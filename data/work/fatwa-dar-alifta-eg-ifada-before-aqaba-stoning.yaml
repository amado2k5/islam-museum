id: work/fatwa-dar-alifta-eg-ifada-before-aqaba-stoning
class: work
kind: fatwa
label: { ar: "حكم تقديم طواف الإفاضة على رمي جمرة العقبة", en: "Performing tawaf al-ifada before stoning al-jamrat al-aqaba", ur: "جمرہ عقبہ کی رمی سے پہلے طواف افاضہ", es: "Realizar tawaf al-ifada antes de apedrear a al-jamrat al-aqaba", fr: "Effectuer le tawaf al-ifada avant de lapider al-jamrat al-aqaba", tr: "Tevaf el-İfade'den önceki Jamrah al-Aqaba'nın taşlanmasıyla ilgili karar", id: "Putusan sebelum Tawaf al-Ifadah atas rajam Jamrah al-Aqaba" }
summary:
  ar: "سائل سأل عن تقديم طواف الإفاضة على رمي جمرة العقبة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20757)⁩ أن أداء الحاج طواف الإفاضة قبل رمي جمرة العقبة أمر جائز شرعًا ولا حرج عليه في ذلك ولا فدية."
  en: "A questioner asked about performing tawaf al-ifada before stoning al-jamrat al-aqaba. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20757) answered that it is lawful — no blame and no fidya."
  ur: "ایک سائل نے جمرہ عقبہ کی رمی سے پہلے طواف افاضہ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20757)⁩ نے جواب دیا کہ یہ جائز ہے اور نہ حرج نہ فدیہ۔"
  es: "Un interrogador preguntó sobre la realización del tawaf al-ifada antes de apedrear a al-jamrat al-aqaba. Dar al-Ifta de Egipto (Gran Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20757) respondió que es lícito: no hay culpa ni fidya."
  fr: "Un interlocuteur a demandé s'il était possible d'effectuer le tawaf al-ifada avant de lapider al-jamrat al-aqaba. Le Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20757) a répondu que c'était légal – sans blâme ni fidya."
  tr: "Bir soru soran kişi, Cemir el-Akabe'yi taşlamaya tercih etmek yerine Tevaf el-İfade'nin önceliklendirilmesi hakkında sorular sormuştur. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 20757), Cemreti taşlamadan önce Tevaf el-İfade'nin yapılmasının İslam hukukuna göre izin olduğunu, zararı olmadığını ve fidya gerekmediğini belirtmiştir."
  id: "Seorang penanya menanyakan tentang prioritas Tawaf al-Ifadah daripada dilempari batu ke Jamrat al-Aqaba. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20757) menjawab bahwa melaksanakan Tawaf al-Ifadah sebelum dilempari batu di Jamrat al-Aqaba diperbolehkan menurut hukum Islam, tidak ada bahaya, dan tidak diperlukan fidya."
