summary:
  ar: "سائل سأل عن تقديم طواف الإفاضة على رمي جمرة العقبة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20757)⁩ أن أداء الحاج طواف الإفاضة قبل رمي جمرة العقبة أمر جائز شرعًا ولا حرج عليه في ذلك ولا فدية."
  en: "A questioner asked about performing tawaf al-ifada before stoning al-jamrat al-aqaba. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20757) answered that it is lawful — no blame and no fidya."
  ur: "ایک سائل نے جمرہ عقبہ کی رمی سے پہلے طواف افاضہ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20757)⁩ نے جواب دیا کہ یہ جائز ہے اور نہ حرج نہ فدیہ۔"
