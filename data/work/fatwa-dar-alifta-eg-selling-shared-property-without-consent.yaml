summary:
  ar: "سائل سأل عن بيع المال المشاع من دون إذن باقي الشركاء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21645)⁩ أن الملكية على الشيوع لا تجعل لأي واحد من الشركاء حقًا في أن يتصرف في نصيب غيره من المالكين بدون إذن على ما فصّل الجواب."
  en: "A questioner asked about selling commonly-held property without the other partners' consent. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21645) answered that co-ownership gives no partner the right to dispose of another owner's share without permission — as the answer details."
  ur: "ایک سائل نے بغیر دیگر شرکاء کی اجازت مشترک مال بیچنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21645)⁩ نے جواب دیا کہ مشترک ملکیت کسی شریک کو دوسرے کے حصے میں بغیر اجازت تصرف کا حق نہیں دیتی — جیسا کہ جواب میں تفصیل ہے۔"
