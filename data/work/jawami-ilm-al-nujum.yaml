summary:
  ar: "كتاب الفرغاني في علم الهيئة، ويسميه الناشر اللاتيني «Elementa astronomica» ويسمى في الفهرس «الفصول»، في ثلاثين فصلاً تبدأ بأسماء الأشهر والأيام، وتعرض كروية الأرض والسماء، والحركات اليومية والخاصة للكواكب، والمنازل، والطلوع من شعاع الشمس، والكسوفات. قرأ هذا السجل منه الصفحات 1 إلى 100 من الملف: التصدير والفهرس ونص الفصول من الثامن إلى الثلاثين {cite:farghani-elements-astronomy p. 7}{cite:farghani-elements-astronomy p. 10}."
  en: "al-Farghani's treatise on astronomy, printed by Golius as the Elementa astronomica. Its thirty chapters run from the calendar and the shape of the heavens through the planetary motions, the lunar mansions, the risings from the sun's rays and the eclipses. This record covers the front matter and chapters 8 to 30 printed in the Arabic text."
authors: [person/al-farghani]
language: language/arabic
structure: "ثلاثون فصلاً (الفهرس، ص 10-12 من الملف). الفصل الثامن: مساحة الأرض والأقاليم السبعة. التاسع: أسماء البلدان في كل إقليم. العاشر والحادي عشر: مطالع البروج والساعات. الثاني عشر والثالث عشر والرابع عشر والخامس عشر والسادس عشر والسابع عشر: صفة الأفلاك وحركاتها. الثامن عشر والتاسع عشر: العروض وعدد الكواكب الثابتة. العشرون: منازل القمر. الحادي والعشرون والثاني والعشرون: الأبعاد والأجرام. الثالث والعشرون حتى السادس والعشرون: الطلوع والاختفاء بشعاع الشمس والمنظر. السابع والعشرون والثامن والعشرون والتاسع والعشرون: اختلاف المنظر وكسوف القمر والشمس. الثلاثون: الفاصل بين الكسوفات. في الملف طُبع النص العربي معكوس الترتيب، فالفصل الثلاثون في الصفحة 20 والفصل الأول في الصفحة 131، والترجمة اللاتينية تبدأ من الصفحة 133."
