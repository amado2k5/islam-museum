id: work/fatwa-dar-alifta-sale-with-lifetime-maintenance-condition
class: work
kind: fatwa
label: { ar: "حكم البيع مع شرط الصيانة المجانية مدة العمر الافتراضي للمنتج", en: "A sale with a condition of free maintenance for the product's expected life", ur: "مصنوعات کی متوقع عمر تک مفت مرمت کی شرط کے ساتھ بیع کا حکم", es: "Venta con la condición de mantenimiento gratuito durante la vida útil prevista del producto.", fr: "Vente assortie d'une garantie d'entretien gratuit pendant toute la durée de vie prévue du produit", tr: "Ücretsiz bakım koşullarıyla satış kuralı Ürün ömrü", id: "Aturan penjualan dengan kondisi perawatan gratis Umur produk" }
summary:
  ar: "سؤال من بائع أدوات منزلية مستعملة اشترط عليه عميل صيانة الأجهزة التي اشتراها مدة عمرها الافتراضي بعد انتهاء ضمانها، أجابت فيه دار الإفتاء المصرية بأن اشتراط المشتري على البائع صيانة الأجهزة طيلة عمرها الافتراضي المعلوم المتفق عليه مقابل عوض معلوم جائز شرعًا ولا ينافي مقتضى العقد. ذكّرت الدار بشروط العقود العامة من الأهلية والرضا وانتفاء الغرر وخلو العقد من الشروط الممنوعة، مستدلة بحديث أن المسلمين على شروطهم إلا شرطًا حرم حلالًا أو أحل حرامًا، وعرّفت العمر الافتراضي بما في قرار جهاز حماية المستهلك رقم 1/4 لسنة 2022، وكيّفت المعاملة بأنها بيع وشرط أجازه جمهور المالكية والشافعية والحنابلة ما دام الشرط لا يخالف مقتضى العقد ولا يؤول إلى غرر، ناقلة عن ابن رشد والخرشي والزرقاني والنووي وابن رجب والحجاوي. واشترطت لدفع النزاع بيان الأجزاء والأعمال التي تشملها الصيانة، وهل تشمل قطع الغيار أم أجرة الإصلاح فقط، وهل هي بعوض معلوم، استنادًا إلى قاعدة لا ضرر ولا ضرار، وأحالت إلى قرار مجمع الفقه الإسلامي رقم 103 (6/11) الذي عدّ الصيانة المشروطة على البائع لمدة معلومة بيعًا وشرطًا جائزًا."
  en: "A question from a seller of used household appliances whose customer stipulated maintenance of the devices he bought for their expected lifespan after the warranty had expired; Dar al-Ifta al-Misriyya answered that a buyer's stipulating that the seller maintain the devices throughout their known and agreed expected life, for a known consideration, is permissible in sharia and does not contradict the nature of the contract. Dar al-Ifta recalled the general conditions of contracts, namely capacity, consent, the absence of excessive uncertainty and freedom from forbidden conditions, citing the hadith that Muslims are bound by their conditions except one that forbids the lawful or permits the forbidden; it defined the expected life by the Consumer Protection Agency's decision 1/4 of 2022, and characterised the transaction as a sale with a condition, which the majority of Malikis, Shafi'is and Hanbalis allow so long as the condition does not contradict the contract or lead to uncertainty, quoting Ibn Rushd, al-Kharashi, al-Zurqani, al-Nawawi, Ibn Rajab and al-Hajjawi. To forestall dispute it required that the parts and work covered be specified, whether spare parts are included or only the cost of repair, and whether a known consideration is paid, on the strength of the rule that there is no harm and no reciprocating harm, and it referred to resolution 103 (6/11) of the Islamic Fiqh Academy, which treated maintenance stipulated on the seller for a known period as a permissible sale with a condition."
  ur: "استعمال شدہ گھریلو آلات بیچنے والے کا سوال جس کے گاہک نے خریدے گئے آلات کی ضمانت ختم ہونے کے بعد ان کی متوقع عمر تک مرمت کی شرط لگائی؛ دار الافتاء مصر نے جواب دیا کہ خریدار کا بیچنے والے پر آلات کی معلوم اور متفق علیہ متوقع عمر بھر مرمت کی شرط لگانا، معلوم معاوضے کے عوض، شرعاً جائز ہے اور عقد کے تقاضے کے خلاف نہیں۔ دار الافتاء نے عقود کی عمومی شرائط یاد دلائیں، یعنی اہلیت، رضامندی، غرر کا نہ ہونا اور ممنوع شرائط سے خالی ہونا، اس حدیث سے استدلال کرتے ہوئے کہ مسلمان اپنی شرطوں کے پابند ہیں سوائے اس شرط کے جو حلال کو حرام یا حرام کو حلال کرے؛ اس نے متوقع عمر کی تعریف صارف تحفظ ادارے کے 2022 کے فیصلے 1/4 سے کی، اور معاملے کو بیع مع شرط قرار دیا جسے مالکیہ، شافعیہ اور حنابلہ کا جمہور جائز سمجھتا ہے جب تک شرط عقد کے تقاضے کے خلاف نہ ہو اور غرر تک نہ پہنچائے، ابن رشد، خرشی، زرقانی، نووی، ابن رجب اور حجاوی سے نقل کرتے ہوئے۔ جھگڑے سے بچنے کے لیے اس نے لازم کیا کہ مرمت میں شامل پرزے اور کام، فاضل پرزوں کی شمولیت یا صرف مرمت کی اجرت، اور معلوم معاوضہ واضح کیے جائیں، قاعدہ لا ضرر ولا ضرار کی بنیاد پر، اور اسلامی فقہ اکیڈمی کی قرارداد 103 (6/11) کا حوالہ دیا جس نے معلوم مدت کے لیے بیچنے والے پر مشروط مرمت کو جائز بیع مع شرط قرار دیا۔"
  es: "Una pregunta de un vendedor de electrodomésticos usados cuyo cliente estipuló el mantenimiento de los aparatos que compró durante su vida útil esperada después de que expirara la garantía; Dar al-Ifta al-Misriyya respondió que es permisible en la sharia que un comprador estipule que el vendedor mantenga los aparatos durante su vida útil esperada conocida y acordada, a cambio de una contraprestación conocida, y no contradice la naturaleza del contrato. Dar al-Ifta recordó las condiciones generales de los contratos, a saber, capacidad, consentimiento, ausencia de incertidumbre excesiva y ausencia de condiciones prohibidas, citando el hadiz que dice que los musulmanes están obligados por sus condiciones excepto una que prohíba lo lícito o permita lo ilícito; Definió la vida útil esperada según la decisión 1/4 de 2022 de la Agencia de Protección al Consumidor y caracterizó la transacción como una venta con condición, que la mayoría de los malikíes, shafiíes y hanbalíes permiten siempre que la condición no contradiga el contrato ni genere incertidumbre, citando a Ibn Rushd, al-Kharashi, al-Zurqani, al-Nawawi, Ibn Rajab y al-Hajjawi. Para evitar disputas, exigió que se especificaran las piezas y el trabajo cubierto, si se incluían repuestos o solo el costo de la reparación, y si se pagaba una contraprestación conocida, basándose en la regla de que no hay daño ni daño recíproco, y se remitió a la resolución 103 (6/11) de la Academia Islámica de Fiqh, que consideró el mantenimiento estipulado al vendedor por un período conocido como una venta permisible con condición."
  fr: "Un vendeur d'électroménager d'occasion a posé une question à Dar al-Ifta al-Misriyya. Son client avait stipulé que l'entretien des appareils achetés, après expiration de la garantie, serait assuré par le vendeur pendant toute leur durée de vie prévue. Dar al-Ifta al-Misriyya a répondu que cette exigence, formulée par l'acheteur, est permise par la charia et ne contrevient pas à la nature du contrat. Dar al-Ifta a rappelé les conditions générales de validité des contrats, à savoir la capacité juridique, le consentement, l'absence d'incertitude excessive et l'absence de clauses illicites, citant un hadith selon lequel les musulmans sont liés par leurs contrats, sauf par une clause interdisant le licite ou autorisant l'illicite. Elle a défini la durée de vie prévue selon la décision 1/4 de 2022 de l'Agence de protection du consommateur et a qualifié la transaction de vente avec condition suspensive. La majorité des écoles malikite, chaféite et hanbalite l'autorisent dès lors que la condition ne contrevient pas au contrat et n'engendre pas d'incertitude, citant Ibn Rushd, al-Kharashi, al-Zurqani, al-Nawawi, Ibn Rajab et al-Hajjawi. Afin de prévenir tout litige, elle a exigé la spécification des pièces et des travaux couverts, la mention de l'inclusion des pièces détachées ou du seul coût de la réparation, ainsi que la définition d'une contrepartie connue. Ce principe repose sur l'absence de préjudice et de préjudice réciproque, et fait référence à la résolution 103 (6/11) de l'Académie de jurisprudence islamique, qui considère l'entretien stipulé par le vendeur pendant une période déterminée comme une vente avec condition suspensive licite."
  tr: "Bir müşteri, ikinci el ev aletleri satıcısından gelen bir soruya güvenerek, garanti süresi dolmadan sonra satın alınan cihazların ömrü boyunca bakımını yapmasını şart koştu. Mısır Dar al-Ifta, alıcının satıcıya cihazları üzerinde anlaşılan ömrü boyunca bakım yapma şartının, Şeriata uygun bir ücret karşılığında aldığı şartın sözleşmenin gerekliliğiyle çelişmediğini belirtti. Dar, kapasite, rıza, belirsizlik olmaması ve yasak koşulların olmaması gibi genel sözleşme koşullarına değindi; Müslümanların bu koşullara tabi olduğu hadislerine atıfta bulundu, ancak bir hadis hariç: yasak veya izin verilebilir. Tüketici Koruma Ajansı Kararı No. 1/4 No'lu 2022'de belirtildiği şekilde raf ömrünü tanımladı ve işlemi, sözleşmenin şartıyla çelişmediği ve belirsizliğe yol açmadığı sürece Maliki, Şafi'ler ve Hanbalilerin çoğunluğu tarafından izin verilen bir satış ve şart olarak sınıflandırdı. İbn Rüşd, El-Hurşi, El-Zürkani, El-Nevavi, İbn Recep ve El-Hijcavi'den alıntı yapıldı. Uyuşmazlığı, bakım kapsamındaki parça ve işleri belirterek çözmesi, sadece yedek parça veya tamir ücretlerini mi içerdiğini ve bilinen tazminat olup olmadığını, zarar yoksa karşılıklı zarar mı ilkesine dayanarak çözmesi gerekiyordu. İslam Fıkıh Akademisi'nin 103 sayılı (6/11) sayılı kararına atıfta bulundu; bu karar, satıcıya belirli bir süre boyunca koşullu bakım yapılmasını satış ve izin verilen bir şart olarak kabul etti."
  id: "Sebuah pertanyaan dari penjual peralatan rumah tangga bekas diajukan oleh pelanggan untuk mempertahankan perangkat yang dibeli selama masa pakainya setelah masa garansi berakhir. Dar al-Ifta Mesir menanggapi bahwa syarat pembeli kepada penjual untuk memelihara perangkat tersebut selama masa pakai yang disepakati sebagai imbalan atas biaya yang diperbolehkan menurut Syariah dan tidak bertentangan dengan persyaratan kontrak. Dar menyebutkan syarat-syarat kontrak umum seperti kapasitas, persetujuan, tidak adanya ketidakpastian, dan ketiadaan syarat terlarang, mengutip hadis bahwa Muslim tunduk pada syarat-syarat tersebut kecuali untuk satu yang dilarang atau diperbolehkan. Dokumen ini mendefinisikan masa simpan sebagaimana tercantum dalam Keputusan Badan Perlindungan Konsumen No. 1/4 tahun 2022, dan mengklasifikasikan transaksi tersebut sebagai penjualan dan kondisi yang diizinkan oleh mayoritas Maliki, Shafi'i, dan Hanbali, selama syarat tersebut tidak bertentangan dengan persyaratan kontrak dan tidak menimbulkan ketidakpastian. Dokumen ini mengutip Ibn Rushd, Al-Khurshi, Al-Zurqani, Al-Nawawi, Ibn Rajab, dan Al-Hijjawi. Pihak tersebut diwajibkan menyelesaikan sengketa dengan menentukan suku cadang dan pekerjaan yang tercakup dalam perawatan, apakah hanya termasuk suku cadang atau biaya perbaikan, dan apakah itu kompensasi yang diketahui, berdasarkan prinsip tidak ada kerugian atau kerugian balas. Laporan tersebut merujuk pada keputusan Akademi Fiqh Islam No. 103 (6/11), yang menganggap pemeliharaan bersyarat pada penjual untuk periode tertentu sebagai penjualan dan kondisi yang diperbolehkan."
