id: work/fatwa-dar-alifta-sale-with-lifetime-maintenance-condition
class: work
kind: fatwa
label: { ar: "حكم البيع مع شرط الصيانة المجانية مدة العمر الافتراضي للمنتج", en: "A sale with a condition of free maintenance for the product's expected life", ur: "مصنوعات کی متوقع عمر تک مفت مرمت کی شرط کے ساتھ بیع کا حکم" }
summary:
  ar: "سؤال من بائع أدوات منزلية مستعملة اشترط عليه عميل صيانة الأجهزة التي اشتراها مدة عمرها الافتراضي بعد انتهاء ضمانها، أجابت فيه دار الإفتاء المصرية بأن اشتراط المشتري على البائع صيانة الأجهزة طيلة عمرها الافتراضي المعلوم المتفق عليه مقابل عوض معلوم جائز شرعًا ولا ينافي مقتضى العقد. ذكّرت الدار بشروط العقود العامة من الأهلية والرضا وانتفاء الغرر وخلو العقد من الشروط الممنوعة، مستدلة بحديث أن المسلمين على شروطهم إلا شرطًا حرم حلالًا أو أحل حرامًا، وعرّفت العمر الافتراضي بما في قرار جهاز حماية المستهلك رقم 1/4 لسنة 2022، وكيّفت المعاملة بأنها بيع وشرط أجازه جمهور المالكية والشافعية والحنابلة ما دام الشرط لا يخالف مقتضى العقد ولا يؤول إلى غرر، ناقلة عن ابن رشد والخرشي والزرقاني والنووي وابن رجب والحجاوي. واشترطت لدفع النزاع بيان الأجزاء والأعمال التي تشملها الصيانة، وهل تشمل قطع الغيار أم أجرة الإصلاح فقط، وهل هي بعوض معلوم، استنادًا إلى قاعدة لا ضرر ولا ضرار، وأحالت إلى قرار مجمع الفقه الإسلامي رقم 103 (6/11) الذي عدّ الصيانة المشروطة على البائع لمدة معلومة بيعًا وشرطًا جائزًا."
  en: "A question from a seller of used household appliances whose customer stipulated maintenance of the devices he bought for their expected lifespan after the warranty had expired; Dar al-Ifta al-Misriyya answered that a buyer's stipulating that the seller maintain the devices throughout their known and agreed expected life, for a known consideration, is permissible in sharia and does not contradict the nature of the contract. Dar al-Ifta recalled the general conditions of contracts, namely capacity, consent, the absence of excessive uncertainty and freedom from forbidden conditions, citing the hadith that Muslims are bound by their conditions except one that forbids the lawful or permits the forbidden; it defined the expected life by the Consumer Protection Agency's decision 1/4 of 2022, and characterised the transaction as a sale with a condition, which the majority of Malikis, Shafi'is and Hanbalis allow so long as the condition does not contradict the contract or lead to uncertainty, quoting Ibn Rushd, al-Kharashi, al-Zurqani, al-Nawawi, Ibn Rajab and al-Hajjawi. To forestall dispute it required that the parts and work covered be specified, whether spare parts are included or only the cost of repair, and whether a known consideration is paid, on the strength of the rule that there is no harm and no reciprocating harm, and it referred to resolution 103 (6/11) of the Islamic Fiqh Academy, which treated maintenance stipulated on the seller for a known period as a permissible sale with a condition."
  ur: "استعمال شدہ گھریلو آلات بیچنے والے کا سوال جس کے گاہک نے خریدے گئے آلات کی ضمانت ختم ہونے کے بعد ان کی متوقع عمر تک مرمت کی شرط لگائی؛ دار الافتاء مصر نے جواب دیا کہ خریدار کا بیچنے والے پر آلات کی معلوم اور متفق علیہ متوقع عمر بھر مرمت کی شرط لگانا، معلوم معاوضے کے عوض، شرعاً جائز ہے اور عقد کے تقاضے کے خلاف نہیں۔ دار الافتاء نے عقود کی عمومی شرائط یاد دلائیں، یعنی اہلیت، رضامندی، غرر کا نہ ہونا اور ممنوع شرائط سے خالی ہونا، اس حدیث سے استدلال کرتے ہوئے کہ مسلمان اپنی شرطوں کے پابند ہیں سوائے اس شرط کے جو حلال کو حرام یا حرام کو حلال کرے؛ اس نے متوقع عمر کی تعریف صارف تحفظ ادارے کے 2022 کے فیصلے 1/4 سے کی، اور معاملے کو بیع مع شرط قرار دیا جسے مالکیہ، شافعیہ اور حنابلہ کا جمہور جائز سمجھتا ہے جب تک شرط عقد کے تقاضے کے خلاف نہ ہو اور غرر تک نہ پہنچائے، ابن رشد، خرشی، زرقانی، نووی، ابن رجب اور حجاوی سے نقل کرتے ہوئے۔ جھگڑے سے بچنے کے لیے اس نے لازم کیا کہ مرمت میں شامل پرزے اور کام، فاضل پرزوں کی شمولیت یا صرف مرمت کی اجرت، اور معلوم معاوضہ واضح کیے جائیں، قاعدہ لا ضرر ولا ضرار کی بنیاد پر، اور اسلامی فقہ اکیڈمی کی قرارداد 103 (6/11) کا حوالہ دیا جس نے معلوم مدت کے لیے بیچنے والے پر مشروط مرمت کو جائز بیع مع شرط قرار دیا۔"
