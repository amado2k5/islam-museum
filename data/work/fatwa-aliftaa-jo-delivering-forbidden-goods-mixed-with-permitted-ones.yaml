id: work/fatwa-aliftaa-jo-delivering-forbidden-goods-mixed-with-permitted-ones
class: work
kind: fatwa
label: { ar: "توصيل السلع المحرمة المختلطة بسلع مباحة", en: "Delivering forbidden goods mixed with permitted ones", ur: "جائز سامان کے ساتھ ملے ہوئے حرام سامان کی ڈیلیوری" }
summary:
  ar: "سؤال عن توصيل سلع محرمة مختلطة بسلع مباحة إلى المشتري، أجابت فيه دائرة الإفتاء العام الأردنية بأن ذلك يحرم إذا علم العامل بوجودها، ولا حرج عليه إن لم يعلم، ولا يلزمه التفتيش عن محتوى الطلبية. أجابت الدائرة بأن الإسلام حرم كل عمل يعين على الحرام، وأن توصيل السلع المحرمة من الإعانة المحرمة، ونقلت قول زكريا الأنصاري في أسنى المطالب بتحريم بيع العنب لمن يُعلم أو يُظن أنه يتخذه خمرًا، وكل تصرف يفضي إلى معصية. وقالت إنه لا حرج في الجملة في العمل بتوصيل الطلبات إذا كان العامل لا يعلم محتواها، ولا يلزمه التفتيش والسؤال عنها، لكنه إن تيقن أن الطلب لحم خنزير أو خمر ونحوهما فلا يجوز له إيصاله، وينبغي له الاعتذار عنه. وخلصت إلى تحريم توصيل السلع المحرمة ولو كانت مختلطة بسلع مباحة إذا علم العامل بوجودها، وأنه لا حرج عليه إن لم يعلم."
  en: "A question about delivering forbidden goods mixed with permitted ones to a buyer, in which Jordan's General Iftaa Department answered that this is forbidden if the worker knows they are there, that there is no blame if he does not know, and that he is not obliged to inspect the order's contents. The Department answered that Islam forbids any work that assists in what is forbidden, and that delivering forbidden goods is forbidden assistance, quoting Zakariyya al-Ansari in Asna al-Matalib that selling grapes to someone known or thought to make wine of them is forbidden, as is any dealing that leads to sin. It said there is in general no objection to working as a delivery worker if he does not know an order's contents, and he is not obliged to inspect or ask about them; but if he is certain the order is pork, wine or similar forbidden things, he may not deliver it and should excuse himself. It concluded that delivering forbidden goods is forbidden, even when mixed with permitted goods, if the worker knows they are there, and that there is no objection if he does not know."
  ur: "خریدار تک جائز سامان کے ساتھ ملا ہوا حرام سامان پہنچانے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر کارکن کو اس کی موجودگی کا علم ہو تو یہ حرام ہے، علم نہ ہو تو حرج نہیں، اور اس پر آرڈر کے مواد کی تلاشی لازم نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے ہر وہ کام حرام کیا ہے جو حرام میں مدد دے، اور حرام سامان پہنچانا حرام مدد ہے؛ اس نے اسنی المطالب میں زکریا انصاری کا قول نقل کیا کہ اس شخص کو انگور بیچنا حرام ہے جس کے بارے میں معلوم یا گمان ہو کہ وہ اس سے شراب بنائے گا، اور ہر وہ تصرف جو گناہ تک لے جائے۔ اس نے کہا کہ عمومی طور پر ڈیلیوری کا کام کرنے میں حرج نہیں اگر کارکن کو آرڈر کے مواد کا علم نہ ہو، اور اس پر تلاشی یا پوچھ گچھ لازم نہیں؛ لیکن اگر اسے یقین ہو کہ آرڈر خنزیر کا گوشت، شراب یا اس جیسی حرام چیز ہے تو وہ اسے نہیں پہنچا سکتا اور اسے معذرت کر لینی چاہیے۔ اس نے نتیجہ نکالا کہ حرام سامان پہنچانا، چاہے جائز سامان کے ساتھ ملا ہو، حرام ہے اگر کارکن کو اس کی موجودگی کا علم ہو، اور علم نہ ہو تو حرج نہیں۔"
