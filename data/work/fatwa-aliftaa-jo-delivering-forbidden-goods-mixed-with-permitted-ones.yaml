id: work/fatwa-aliftaa-jo-delivering-forbidden-goods-mixed-with-permitted-ones
class: work
kind: fatwa
label: { ar: "توصيل السلع المحرمة المختلطة بسلع مباحة", en: "Delivering forbidden goods mixed with permitted ones", ur: "جائز سامان کے ساتھ ملے ہوئے حرام سامان کی ڈیلیوری", es: "Entrega de mercancías prohibidas mezcladas con mercancías permitidas.", fr: "Livraison de marchandises interdites mélangées à des marchandises autorisées", tr: "Karışık yasaklı malların izin verilen mallarla bağlantılı olması", id: "Menghubungkan barang terlarang campuran dengan barang yang diperbolehkan" }
summary:
  ar: "سؤال عن توصيل سلع محرمة مختلطة بسلع مباحة إلى المشتري، أجابت فيه دائرة الإفتاء العام الأردنية بأن ذلك يحرم إذا علم العامل بوجودها، ولا حرج عليه إن لم يعلم، ولا يلزمه التفتيش عن محتوى الطلبية. أجابت الدائرة بأن الإسلام حرم كل عمل يعين على الحرام، وأن توصيل السلع المحرمة من الإعانة المحرمة، ونقلت قول زكريا الأنصاري في أسنى المطالب بتحريم بيع العنب لمن يُعلم أو يُظن أنه يتخذه خمرًا، وكل تصرف يفضي إلى معصية. وقالت إنه لا حرج في الجملة في العمل بتوصيل الطلبات إذا كان العامل لا يعلم محتواها، ولا يلزمه التفتيش والسؤال عنها، لكنه إن تيقن أن الطلب لحم خنزير أو خمر ونحوهما فلا يجوز له إيصاله، وينبغي له الاعتذار عنه. وخلصت إلى تحريم توصيل السلع المحرمة ولو كانت مختلطة بسلع مباحة إذا علم العامل بوجودها، وأنه لا حرج عليه إن لم يعلم."
  en: "A question about delivering forbidden goods mixed with permitted ones to a buyer, in which Jordan's General Iftaa Department answered that this is forbidden if the worker knows they are there, that there is no blame if he does not know, and that he is not obliged to inspect the order's contents. The Department answered that Islam forbids any work that assists in what is forbidden, and that delivering forbidden goods is forbidden assistance, quoting Zakariyya al-Ansari in Asna al-Matalib that selling grapes to someone known or thought to make wine of them is forbidden, as is any dealing that leads to sin. It said there is in general no objection to working as a delivery worker if he does not know an order's contents, and he is not obliged to inspect or ask about them; but if he is certain the order is pork, wine or similar forbidden things, he may not deliver it and should excuse himself. It concluded that delivering forbidden goods is forbidden, even when mixed with permitted goods, if the worker knows they are there, and that there is no objection if he does not know."
  ur: "خریدار تک جائز سامان کے ساتھ ملا ہوا حرام سامان پہنچانے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر کارکن کو اس کی موجودگی کا علم ہو تو یہ حرام ہے، علم نہ ہو تو حرج نہیں، اور اس پر آرڈر کے مواد کی تلاشی لازم نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے ہر وہ کام حرام کیا ہے جو حرام میں مدد دے، اور حرام سامان پہنچانا حرام مدد ہے؛ اس نے اسنی المطالب میں زکریا انصاری کا قول نقل کیا کہ اس شخص کو انگور بیچنا حرام ہے جس کے بارے میں معلوم یا گمان ہو کہ وہ اس سے شراب بنائے گا، اور ہر وہ تصرف جو گناہ تک لے جائے۔ اس نے کہا کہ عمومی طور پر ڈیلیوری کا کام کرنے میں حرج نہیں اگر کارکن کو آرڈر کے مواد کا علم نہ ہو، اور اس پر تلاشی یا پوچھ گچھ لازم نہیں؛ لیکن اگر اسے یقین ہو کہ آرڈر خنزیر کا گوشت، شراب یا اس جیسی حرام چیز ہے تو وہ اسے نہیں پہنچا سکتا اور اسے معذرت کر لینی چاہیے۔ اس نے نتیجہ نکالا کہ حرام سامان پہنچانا، چاہے جائز سامان کے ساتھ ملا ہو، حرام ہے اگر کارکن کو اس کی موجودگی کا علم ہو، اور علم نہ ہو تو حرج نہیں۔"
  es: "Una pregunta sobre la entrega de bienes prohibidos mezclados con bienes permitidos a un comprador, a la que el Departamento General de Iftaa de Jordania respondió que esto está prohibido si el trabajador sabe que están presentes, que no hay culpa si lo desconoce y que no está obligado a inspeccionar el contenido del pedido. El Departamento respondió que el Islam prohíbe cualquier trabajo que ayude a lo prohibido, y que la entrega de bienes prohibidos constituye una ayuda prohibida, citando a Zakariyya al-Ansari en Asna al-Matalib, donde se afirma que vender uvas a alguien que se sabe o se cree que hará vino con ellas está prohibido, al igual que cualquier transacción que conduzca al pecado. Dijo que, en general, no hay objeción a que un repartidor trabaje si desconoce el contenido de un pedido, y que no está obligado a inspeccionarlo ni a preguntar al respecto; pero si está seguro de que el pedido es carne de cerdo, vino o cosas similares prohibidas, no puede entregarlo y debe excusarse. Concluyó que la entrega de bienes prohibidos está prohibida, incluso cuando están mezclados con bienes permitidos, si el trabajador sabe que están presentes, y que no hay objeción si lo desconoce."
  fr: "Une question relative à la livraison de marchandises interdites mélangées à des marchandises licites a été posée au Département général de la jurisprudence islamique (Iftaa) de Jordanie. Ce dernier a répondu que cela est interdit si le livreur a connaissance de leur présence, qu'il n'y a pas lieu de s'en offusquer s'il l'ignore, et qu'il n'est pas tenu de vérifier le contenu de la commande. Le Département a expliqué que l'islam interdit tout travail contribuant à la perpétration d'un acte interdit, et que la livraison de marchandises interdites constitue une forme de complicité illicite. Il a cité Zakariyya al-Ansari dans Asna al-Matalib, qui affirme qu'il est interdit de vendre du raisin à une personne connue ou soupçonnée d'en faire du vin, de même que toute transaction conduisant au péché. Le Département a précisé qu'en général, il n'y a pas d'objection à travailler comme livreur s'il ignore le contenu d'une commande, et qu'il n'est pas tenu de l'inspecter ni de se renseigner à son sujet. Cependant, s'il est certain que la commande contient du porc, du vin ou d'autres produits interdits similaires, il ne peut pas la livrer et doit s'excuser. En conclusion, la livraison de marchandises interdites est prohibée, même mélangées à des marchandises licites, si le livreur en a connaissance, et il n'y a pas d'objection à s'il l'ignore."
  tr: "Yasak malların ve izin verilen malların karışık teslim edilmesi hakkında bir soruya ise, Ürdün Genel Fetva Dairesi, işçinin varlığını bilmesi halinde bunun yasak olduğunu, bilmediği takdirde zarar olmadığını ve emrin içeriğini incelemekle yükümlü olmadığını yanıtladı. Bakanlık, İslam'ın yasak mallara yardımcı olan herhangi bir eylemi yasakladığını ve yasak malların teslim edilmesinin yasak yardım olduğunu belirtti. Asna Al-Talibab'da Zakaria Al-Ansari'nin, üzüm satılmasını şarap olarak kullandığını bilen veya düşünen herkese satılmasını yasakladığını ve herhangi bir eylemin günaha yol açtığını belirtti. İşçi içeriğini bilmiyorsa ve incelemek ya da sorgulamak zorunda değilse siparişi teslim etmenin zararı olmadığını belirtti. Ancak siparişin domuz eti, şarap veya benzeri ürünler olduğundan emrinin eminse, teslim etmesine izin verilmez ve bunun için özür dilemesi gerekir. Yasaklı malların, hatta izin verilen mallarla karıştırılmış olsa bile, işçinin varlığından haberdar olması halinde teslim edilmesinin yasak olduğu, bilmediği takdirde kendisinin suçlanmadığı sonucuna varıldı."
  id: "Sebuah pertanyaan tentang pengiriman barang terlarang yang dicampur dengan barang yang diperbolehkan kepada pembeli, Departemen Fatwa Umum Yordania menjawab bahwa hal ini dilarang jika pekerja mengetahui keberadaannya, dan tidak ada salahnya jika dia tidak tahu, serta tidak berkewajiban memeriksa isi pesanan. Departemen menjawab bahwa Islam melarang segala tindakan yang membantu dalam hal terlarang dan bahwa pengiriman barang terlarang adalah bantuan terlarang. Mereka mengutip Zakaria Al-Ansari dalam Asna Al-Talibab yang melarang menjual anggur kepada siapa pun yang tahu atau mengira mereka menggunakannya sebagai anggur, dan bahwa setiap tindakan akan menyebabkan dosa. Departemen tersebut mengatakan tidak ada salahnya menyampaikan pesanan jika pekerja tidak mengetahui isinya dan tidak wajib memeriksa atau menanyakan tentangnya. Namun, jika dia yakin pesanan itu adalah daging babi atau anggur atau barang sejenis, dia tidak diperbolehkan mengantarkannya dan harus meminta maaf. Laporan menyimpulkan bahwa dilarang mengirimkan barang terlarang, bahkan jika dicampur dengan barang yang diperbolehkan, jika pekerja mengetahui keberadaannya, dan tidak ada kesalahan bagi pekerja jika tidak mengetahuinya."
