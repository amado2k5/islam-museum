id: work/fatwa-islamweb-cashback-from-a-riba-based-credit-card
class: work
kind: fatwa
label: { ar: "واجب من حصل على مكافأة استرداد نقدي نظير استخدامه بطاقة ائتمانية ربوية", en: "What to do with cashback earned on a riba-based credit card", ur: "سودی کریڈٹ کارڈ کے استعمال پر ملنے والے کیش بیک کا حکم" }
summary:
  ar: "سؤال من مهندس يعيش في دولة غربية حصل على بطاقة ائتمان من شركة أمريكان إكسبريس لرفع تقييمه الائتماني قبل أن يعلم أن توقيع عقدها لا يجوز لما فيه من غرامات ربوية على التأخر، فسدد مستحقاتها دائمًا في وقتها، وتوقف عن استخدامها لما علم بالحكم، ثم صرفت له الشركة مكافأة استرداد نقدي مقابل استخدامه السابق، أجاب فيه مركز الفتوى بإسلام ويب بأنه لا يجوز له الانتفاع بهذا الاسترداد النقدي، لأن البنك المصدر يمنحه بسبب استعمال البطاقة المحرمة، فهو مكافأة مشروطة مرتبطة بالعلاقة التعاقدية الفاسدة لا هبة مطلقة، فيأخذ حكمها في الحرمة، والمنافع المحرمة لا يجوز أخذ العوض عليها. ونقل عن القرافي في الذخيرة أن المنافع المحرمة لا تقابل بالأعواض، وعن ابن عقيل في كتاب الفنون أن مذهب أحمد تحريم عوض كل محرم، محتجًا بحديث أن الله إذا حرّم شيئًا حرّم ثمنه. وأوجب التخلص من هذا المال بصرفه في مصالح المسلمين ودفعه للفقراء والمساكين، وقال إن الإبقاء على البطاقة واستعمالها لا يجوز إلا إن كان محتاجًا إليها ولا يجد بديلًا خاليًا من المحاذير الشرعية."
  en: "A question from an engineer living in a Western country who took out an American Express credit card to raise his credit score before learning that signing its contract is impermissible because of the riba-based penalties on late payment; he always paid on time, stopped using the card when he learned the ruling, and the company then paid him a cashback reward for his earlier use. The fatwa centre of IslamWeb answered that he may not benefit from this cashback, because the issuing bank grants it for use of the forbidden card, so it is a conditional reward tied to the void contractual relationship and not an unconditional gift, and it takes on the same prohibition; forbidden benefits may not be exchanged for consideration. It quoted al-Qarafi in al-Dhakhira that forbidden benefits are not matched by consideration, and Ibn Aqil in Kitab al-Funun that Ahmad's school forbids the price of every forbidden thing, arguing from the hadith that when God forbids a thing He forbids its price. It required him to dispose of the money by spending it on the interests of Muslims and giving it to the poor and needy, and said that keeping and using the card is not permitted unless he needs it and finds no alternative free of sharia objections."
  ur: "مغربی ملک میں رہنے والے ایک انجینئر کا سوال جس نے اپنا کریڈٹ سکور بڑھانے کے لیے امریکن ایکسپریس کا کریڈٹ کارڈ لیا، یہ جاننے سے پہلے کہ تاخیر پر سودی جرمانوں کی وجہ سے اس کے معاہدے پر دستخط کرنا ناجائز ہے؛ اس نے ہمیشہ وقت پر ادائیگی کی، حکم جاننے پر کارڈ کا استعمال چھوڑ دیا، اور پھر کمپنی نے سابقہ استعمال پر اسے کیش بیک انعام دیا۔ اسلام ویب کے فتویٰ مرکز نے جواب دیا کہ وہ اس کیش بیک سے فائدہ نہیں اٹھا سکتا، کیونکہ جاری کرنے والا بینک اسے حرام کارڈ کے استعمال کی وجہ سے دیتا ہے، لہٰذا یہ فاسد معاہداتی تعلق سے جڑا مشروط انعام ہے نہ کہ مطلق ہبہ، اور اسی حرمت کا حکم لیتا ہے؛ حرام منافع کا معاوضہ لینا جائز نہیں۔ اس نے قرافی کی الذخیرہ سے نقل کیا کہ حرام منافع کا معاوضہ نہیں لیا جاتا، اور ابن عقیل کی کتاب الفنون سے کہ احمد کا مذہب ہر حرام چیز کے معاوضے کی حرمت ہے، اس حدیث سے استدلال کرتے ہوئے کہ اللہ جب کسی چیز کو حرام کرتا ہے تو اس کی قیمت بھی حرام کرتا ہے۔ اس نے لازم کیا کہ اس رقم کو مسلمانوں کے مفادات میں خرچ کر کے اور فقرا و مساکین کو دے کر اس سے خلاصی حاصل کی جائے، اور کہا کہ کارڈ رکھنا اور استعمال کرنا جائز نہیں سوائے اس صورت کے کہ اسے اس کی ضرورت ہو اور شرعی محذورات سے خالی کوئی متبادل نہ ملے۔"
