id: work/fatwa-islamweb-cashback-from-a-riba-based-credit-card
class: work
kind: fatwa
label: { ar: "واجب من حصل على مكافأة استرداد نقدي نظير استخدامه بطاقة ائتمانية ربوية", en: "What to do with cashback earned on a riba-based credit card", ur: "سودی کریڈٹ کارڈ کے استعمال پر ملنے والے کیش بیک کا حکم", es: "Qué hacer con el reembolso obtenido en una tarjeta de crédito basada en la usura.", fr: "Que faire avec le cashback obtenu sur une carte de crédit à taux d'intérêt avantageux (riba) ?", tr: "Faiz bahane kredi kartı kullanan herkesin nakit iadesi ödülü aldığı görev", id: "Kewajiban siapa pun yang menerima hadiah cashback karena menggunakan kartu kredit riba" }
summary:
  ar: "سؤال من مهندس يعيش في دولة غربية حصل على بطاقة ائتمان من شركة أمريكان إكسبريس لرفع تقييمه الائتماني قبل أن يعلم أن توقيع عقدها لا يجوز لما فيه من غرامات ربوية على التأخر، فسدد مستحقاتها دائمًا في وقتها، وتوقف عن استخدامها لما علم بالحكم، ثم صرفت له الشركة مكافأة استرداد نقدي مقابل استخدامه السابق، أجاب فيه مركز الفتوى بإسلام ويب بأنه لا يجوز له الانتفاع بهذا الاسترداد النقدي، لأن البنك المصدر يمنحه بسبب استعمال البطاقة المحرمة، فهو مكافأة مشروطة مرتبطة بالعلاقة التعاقدية الفاسدة لا هبة مطلقة، فيأخذ حكمها في الحرمة، والمنافع المحرمة لا يجوز أخذ العوض عليها. ونقل عن القرافي في الذخيرة أن المنافع المحرمة لا تقابل بالأعواض، وعن ابن عقيل في كتاب الفنون أن مذهب أحمد تحريم عوض كل محرم، محتجًا بحديث أن الله إذا حرّم شيئًا حرّم ثمنه. وأوجب التخلص من هذا المال بصرفه في مصالح المسلمين ودفعه للفقراء والمساكين، وقال إن الإبقاء على البطاقة واستعمالها لا يجوز إلا إن كان محتاجًا إليها ولا يجد بديلًا خاليًا من المحاذير الشرعية."
  en: "A question from an engineer living in a Western country who took out an American Express credit card to raise his credit score before learning that signing its contract is impermissible because of the riba-based penalties on late payment; he always paid on time, stopped using the card when he learned the ruling, and the company then paid him a cashback reward for his earlier use. The fatwa centre of IslamWeb answered that he may not benefit from this cashback, because the issuing bank grants it for use of the forbidden card, so it is a conditional reward tied to the void contractual relationship and not an unconditional gift, and it takes on the same prohibition; forbidden benefits may not be exchanged for consideration. It quoted al-Qarafi in al-Dhakhira that forbidden benefits are not matched by consideration, and Ibn Aqil in Kitab al-Funun that Ahmad's school forbids the price of every forbidden thing, arguing from the hadith that when God forbids a thing He forbids its price. It required him to dispose of the money by spending it on the interests of Muslims and giving it to the poor and needy, and said that keeping and using the card is not permitted unless he needs it and finds no alternative free of sharia objections."
  ur: "مغربی ملک میں رہنے والے ایک انجینئر کا سوال جس نے اپنا کریڈٹ سکور بڑھانے کے لیے امریکن ایکسپریس کا کریڈٹ کارڈ لیا، یہ جاننے سے پہلے کہ تاخیر پر سودی جرمانوں کی وجہ سے اس کے معاہدے پر دستخط کرنا ناجائز ہے؛ اس نے ہمیشہ وقت پر ادائیگی کی، حکم جاننے پر کارڈ کا استعمال چھوڑ دیا، اور پھر کمپنی نے سابقہ استعمال پر اسے کیش بیک انعام دیا۔ اسلام ویب کے فتویٰ مرکز نے جواب دیا کہ وہ اس کیش بیک سے فائدہ نہیں اٹھا سکتا، کیونکہ جاری کرنے والا بینک اسے حرام کارڈ کے استعمال کی وجہ سے دیتا ہے، لہٰذا یہ فاسد معاہداتی تعلق سے جڑا مشروط انعام ہے نہ کہ مطلق ہبہ، اور اسی حرمت کا حکم لیتا ہے؛ حرام منافع کا معاوضہ لینا جائز نہیں۔ اس نے قرافی کی الذخیرہ سے نقل کیا کہ حرام منافع کا معاوضہ نہیں لیا جاتا، اور ابن عقیل کی کتاب الفنون سے کہ احمد کا مذہب ہر حرام چیز کے معاوضے کی حرمت ہے، اس حدیث سے استدلال کرتے ہوئے کہ اللہ جب کسی چیز کو حرام کرتا ہے تو اس کی قیمت بھی حرام کرتا ہے۔ اس نے لازم کیا کہ اس رقم کو مسلمانوں کے مفادات میں خرچ کر کے اور فقرا و مساکین کو دے کر اس سے خلاصی حاصل کی جائے، اور کہا کہ کارڈ رکھنا اور استعمال کرنا جائز نہیں سوائے اس صورت کے کہ اسے اس کی ضرورت ہو اور شرعی محذورات سے خالی کوئی متبادل نہ ملے۔"
  es: "Un ingeniero residente en un país occidental solicitó una tarjeta de crédito American Express para mejorar su historial crediticio antes de enterarse de que firmar su contrato era inadmisible debido a las penalizaciones por mora basadas en la usura. Siempre pagó a tiempo, dejó de usar la tarjeta al conocer la normativa y la empresa le ofreció un reembolso por su uso anterior. El centro de fatwas de IslamWeb respondió que no podía beneficiarse de este reembolso, ya que el banco emisor lo otorgaba por el uso de la tarjeta prohibida, por lo que se trataba de una recompensa condicional vinculada a la nulidad del contrato y no de un regalo incondicional, y que, por lo tanto, estaba sujeta a la misma prohibición: los beneficios prohibidos no pueden intercambiarse por una contraprestación. Citó a al-Qarafi en al-Dhakhira, donde afirma que los beneficios prohibidos no se corresponden con una contraprestación, y a Ibn Aqil en Kitab al-Funun, donde señala que la escuela de Ahmad prohíbe el precio de todo lo prohibido, argumentando a partir del hadiz que cuando Dios prohíbe algo, prohíbe también su precio. Le exigía que dispusiera del dinero gastándolo en beneficio de los musulmanes y entregándolo a los pobres y necesitados, y decía que conservar y usar la tarjeta no estaba permitido a menos que la necesitara y no encontrara una alternativa libre de objeciones de la sharia."
  fr: "Un ingénieur résidant dans un pays occidental a posé une question concernant sa carte de crédit American Express. Il avait souscrit une carte pour améliorer sa cote de crédit avant de découvrir que la signature du contrat était interdite en raison des pénalités de retard de paiement basées sur l'usure (riba). Toujours ponctuel dans ses paiements, il a cessé d'utiliser la carte dès qu'il a eu connaissance de cette interdiction. La société lui a alors versé un remboursement pour ses utilisations antérieures. Le centre de fatwas d'IslamWeb a répondu qu'il ne pouvait prétendre à ce remboursement, car la banque émettrice l'accorde pour l'utilisation d'une carte non conforme. Il s'agit donc d'une récompense conditionnelle, liée à une relation contractuelle nulle, et non d'un don inconditionnel, soumis à la même interdiction: les avantages illicites ne peuvent être échangés contre une contrepartie. Le centre cite al-Qarafi dans al-Dhakhira, selon lequel les avantages illicites ne sauraient être compensés par une contrepartie, et Ibn Aqil dans Kitab al-Funun, qui indique que l'école d'Ahmad interdit le prix de toute chose illicite, se basant sur le hadith selon lequel lorsque Dieu interdit une chose, Il en interdit également le prix. Il lui était demandé de disposer de l'argent en le dépensant dans l'intérêt des musulmans et en le donnant aux pauvres et aux nécessiteux, et il était précisé que la conservation et l'utilisation de la carte n'étaient pas autorisées, sauf en cas de nécessité et s'il ne trouvait aucune autre solution conforme à la charia."
  tr: "Batı ülkesinde yaşayan bir mühendisin sorusu; American Express'ten kredi kartı alıp kredi notunu yükseltmek için sözleşmenin imzalanmasının gecikme nedeniyle faiz cezaları nedeniyle izin verilmediğini fark etti. Her zaman borcunu zamanında ödedi ve kararı öğrenince kullanmayı bıraktı. Şirket daha sonra önceki kullanımı için nakit iadesi bonusu verdi. IslamWeb'deki Fetva Merkezi, bu nakit iadesinden yararlanmasına izin verilmediğini, çünkü bankanın yasaklı kart kullanımı nedeniyle verdiğini yanıtladı. Bu, mutlak bir hediye değil, yolsuz bir sözleşme ilişkisine bağlı koşullu bir ödüldür, bu nedenle kararı yasak kabul edilir ve yasaklı faydalar tazminat edilemez. Al-Dhakira'daki Al-Qarafi'den yasak yardımların tazminata çevrilemeyeceği ve İbn Aqil'in Al-Funun kitabında, Ahmad'ın düşünce okulunun her yasak kişi için tazminat verilmesini yasakladığını, Tanrı bir şeyi yasakladığında fiyatını yasakladığı hadisini öne sürdüğü bildirilmiştir. Bu paranın Müslümanların çıkarlarına harcanarak ve yoksul ile muhtaçlara verilmesiyle harcanması gerektiğini vurguladı; kartın tutulması ve kullanılması ancak ihtiyaç duyulan ve dini yasaklardan uzak bir alternatif bulunamıyorsa izin verilebilir olduğunu belirtti."
  id: "Pertanyaan dari seorang insinyur yang tinggal di negara Barat yang memperoleh kartu kredit dari American Express untuk menaikkan peringkat kreditnya sebelum menyadari bahwa menandatangani kontrak tidak diperbolehkan karena denda riba atas keterlambatan. Dia selalu membayar iuran tepat waktu dan berhenti menggunakannya setelah mengetahui keputusan tersebut. Perusahaan kemudian memberinya bonus cashback atas penggunaan sebelumnya. Pusat Fatwa di IslamWeb menjawab bahwa dia tidak diizinkan mendapatkan cashback ini karena bank penerbit memberikannya akibat penggunaan kartu terlarang. Ini adalah hadiah bersyarat yang terkait dengan hubungan kontrak yang korup, bukan hadiah mutlak, sehingga keputusannya dianggap dilarang, dan manfaat terlarang tidak dapat dikompensasi. Dilaporkan oleh Al-Qarafi di Al-Dhakira bahwa manfaat terlarang tidak dapat ditukar dengan kompensasi, dan dari Ibn Aqil dalam buku Al-Funun bahwa aliran pemikiran Ahmad melarang kompensasi untuk setiap orang terlarang, mengutip hadits bahwa ketika Tuhan melarang sesuatu, Dia melarang harganya. Ia menekankan bahwa uang ini harus dibuang untuk kepentingan Muslim dan diberikan kepada orang miskin dan membutuhkan, dengan menyatakan bahwa menyimpan dan menggunakan kartu hanya diperbolehkan jika seseorang membutuhkannya dan tidak dapat menemukan alternatif yang bebas dari larangan agama."
