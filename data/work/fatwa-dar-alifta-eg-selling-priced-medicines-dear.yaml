id: work/fatwa-dar-alifta-eg-selling-priced-medicines-dear
class: work
kind: fatwa
label: { ar: "حكم بيع الأدوية المرسومة بسعر قديم بسعرها الجديد", en: "Selling price-fixed medicines at their new price while labelled with the old", ur: "پرانی قیمت لگی ادویات نئی قیمت پر فروخت", es: "Vender medicamentos con precio fijo a su nuevo precio mientras están etiquetados con el antiguo.", fr: "Vendre des médicaments à prix fixe au nouveau prix tout en conservant l'ancien étiquetage." }
summary:
  ar: "سائل سأل عن بيع صيدلي أدوية مسعّرة بسعر قديم بسعرها الجديد المحدد من الجهات المختصة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21586)⁩ أن الواجب على الرجل أن يلتزم في بيع الأدوية من خلال صيدليته بالأسعار المحددة لها من قبل الجهات المعنية المختصة على ما فصّل الجواب."
  en: "A questioner asked about a pharmacist selling medicines labelled with an old price at their new officially-set price. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21586) answered that the man must sell medicines through his pharmacy at the prices set by the competent authorities — as the answer details."
  ur: "ایک سائل نے پرانی قیمت والی ادویات نئی مقررہ قیمت پر بیچنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21586)⁩ نے جواب دیا کہ صیدلی کو متعلقہ حکام کی مقرر کردہ قیمتوں پر فروخت کرنی ہوگی — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre un farmacéutico que vendía medicamentos con el precio anterior al precio oficial vigente. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21586) respondió que el farmacéutico debe vender los medicamentos en su farmacia a los precios establecidos por las autoridades competentes, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant un pharmacien vendant des médicaments étiquetés à un ancien prix au nouveau prix officiel. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21586) a répondu que ce pharmacien est tenu de vendre ses médicaments dans sa pharmacie aux prix fixés par les autorités compétentes, comme le précise la réponse."
