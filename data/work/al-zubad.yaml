summary:
  ar: "زبد ابن رسلان في فقه الشافعية لأحمد بن رسلان الجعدي ⁦(ت. 844هـ)⁩ منظومة في نحو مائة وأربعين بيتاً على بحر الرجز لخّصت أبواب فقه المذهب؛ متن نظمي شافعي في الدروس {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  en: "Al-Zubad of Ibn Ruslan in Shafi'i fiqh by Ahmad ibn Ruslan al-Ja'di (d. 844 AH) — a didactic poem of about a hundred and forty rajaz lines epitomising the school's fiqh chapters; a Shafi'i verse matn in the lessons {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  es: "Al-Zubad de Ibn Ruslan en el fiqh shafi'i por Ahmad ibn Ruslan al-Ja'di (m. 844 AH) — un poema didáctico de aproximadamente ciento cuarenta versos rajaz que resumen los capítulos de fiqh de la escuela; un matn de verso shafi'i en las lecciones {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  fr: "Al-Zubad d'Ibn Ruslan dans le fiqh Shafi'i par Ahmad ibn Ruslan al-Ja'di (d. 844 AH) — un poème didactique d'environ cent quarante vers rajaz résumant les chapitres de fiqh de l'école; un verset Shafi'i matn dans les leçons {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  ur: "شافعی فقہ میں ابن رسلان کا الزباد از احمد بن رسلان الجدی ⁦(متوفی 844ھ)⁩ - تقریباً ایک سو چالیس رجز سطروں کی ایک نثری نظم جو مکتب کے فقہ کے ابواب کی مظہر ہے۔ اسباق میں ایک شافعی آیت متن {حوالہ: المتون العلمیہ ازہر}"
  tr: "Ahmed bin Raslan el-Ca'di'nin (ö. 844 Hicri yılı) Zübd İbn Raslan fi fıkıh'i fıkıyiye, yaklaşık yüz kırk ayetten oluşan ve okulun fıkh fıkhi bölümlerini özetleyen bir şiirdir; Nazmi Şafi'i'nin derslerindeki metni {atı:al-mutun-al-ilmiyya-azhar} {cite:al-aalam} derslerdir."
  id: "Zubd Ibn Raslan fi Fiqh al-Shafi'iyyah oleh Ahmad ibn Raslan al-Ja'di (wafat 844 H) adalah sebuah puisi yang terdiri dari sekitar seratus empat puluh ayat dalam meter rajaz, merangkum bab-bab dalam fiqh al-Shafi'iyyah oleh Ahmad ibn Raslan {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
