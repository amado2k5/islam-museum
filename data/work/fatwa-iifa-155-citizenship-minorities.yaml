id: work/fatwa-iifa-155-citizenship-minorities
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 155 (17/4) بشأن التوفيق بين التقيد بالثوابت ومقتضيات المواطنة للمسلمين خارج ديارهم", en: "IIFA resolution 155 (17/4) on reconciling fixed principles with the requirements of citizenship for Muslims outside Muslim lands", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 155 (17/4): غیر اسلامی ممالک میں مسلمانوں کے لیے ثوابت کی پابندی اور شہریت کے تقاضوں میں تال میل", es: "Resolución 155 (17/4) de la IIFA sobre la conciliación de los principios fijos con los requisitos de ciudadanía para los musulmanes que viven fuera de tierras musulmanas." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩. عرّف المواطنة بالانتماء إلى دولة معينة أرضًا وواقعًا وحمل جنسيتها، والثوابت الإسلامية بالأحكام الاعتقادية والعملية والأخلاقية التي جاءت بها النصوص القطعية أو أجمعت عليها الأمة، ويشمل ذلك حفظ الضروريات الخمس ⁦(الدين والنفس والعقل والنسل والمال)⁩. وقرر: لا مانع شرعًا من إسهام المسلمين في غير الدول الإسلامية في الأنشطة الاجتماعية والسياسية والاقتصادية التي لا تتعارض مع الثوابت ولا سيما إذا اقتضتها المواطنة، بشرط ألا تهدد هويتهم الإسلامية؛ ولا مانع من تحاكمهم أمام القضاء الوضعي عندما يتعين سبيلًا لاستخلاص حق أو دفع مظلمة، مع لزوم أحكام الشريعة في قضايا الأحوال الشخصية. وتناول ضوابط التعامل والمشاركة للمسلمين المقيمين خارج ديار الإسلام."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006). It defined citizenship as belonging to a particular state in land and fact and holding its nationality, and the Islamic fixed principles as the creedal, practical and moral rulings brought by definitive texts or agreed by the umma — including preservation of the five necessities (religion, life, reason, progeny, property). It resolved: nothing in the law prevents Muslims in non-Muslim states from taking part in social, political and economic activities not conflicting with those principles, especially where citizenship requires it, provided their Islamic identity is not threatened; and nothing prevents their litigating before civil courts where that is the only way to recover a right or repel a wrong, while sharia rulings remain binding in personal-status matters. It then gave controls for the dealings and participation of Muslims resident outside Muslim lands."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں۔ اس نے شہریت کی تعریف کی: کسی مخصوص ریاست سے زمین اور واقعیت کے اعتبار سے تعلق اور اس کی جنسيت رکھنا؛ اور اسلامی ثوابت کی: وہ اعتقادی، عملی اور اخلاقی احکام جو قطعی نصوص سے ثابت ہوں یا امت کا اجماع ہو — بشمول پنج ضروریات ⁦(دین، جان، عقل، نسل، مال)⁩ کی حفاظت۔ فیصلے: غیر اسلامی ممالک میں مسلمانوں کی سماجی، سیاسی اور معاشی سرگرمیوں میں شرکت کوئی شرعی مانع نہیں جو ان ثوابت سے متصادم نہ ہو، بالخصوص جب شہریت اس کا تقاضا کرے، بشرطیکہ ان کی اسلامی شناخت کو خطرہ نہ ہو؛ اور حق حاصل کرنے یا ظلم دفع کرنے کا واحد راستہ ہو تو وضعی عدالتوں سے رجوع کی بھی شرعی ممانعت نہیں، بشرطیکہ شخصی حیثیت کے معاملات میں شریعت کے احکام لازم رہیں۔ پھر غیر اسلامی ممالک مقیم مسلمانوں کے معاملات اور شرکت کے ضوابط۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 17.ª sesión en Amán (28 de Jumada al-Ula – 2 de Jumada al-Akhira de 1427, 24-28 de junio de 2006). Definió la ciudadanía como la pertenencia a un Estado particular, tanto territorial como de hecho, y la posesión de su nacionalidad, y los principios islámicos fijos como las normas doctrinales, prácticas y morales establecidas en textos definitivos o acordadas por la umma, incluyendo la preservación de las cinco necesidades básicas (religión, vida, razón, descendencia y propiedad). Resolvió que nada en la ley impide a los musulmanes en Estados no musulmanes participar en actividades sociales, políticas y económicas que no entren en conflicto con dichos principios, especialmente cuando la ciudadanía así lo requiera, siempre que su identidad islámica no se vea amenazada; y nada les impide litigar ante tribunales civiles cuando sea la única vía para recuperar un derecho o revocar una injusticia, mientras que las normas de la sharia siguen siendo vinculantes en materia de estado civil. Finalmente, estableció controles para las transacciones y la participación de los musulmanes residentes fuera de territorios musulmanes."
