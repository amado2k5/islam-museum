summary:
  ar: "التسجيل المصوَّر لأكاديمية القادة الثانية في تركيا، يحفظ أرشيف أسابيل ست جلسات منها: محاضرة في مقاصد الشريعة للضيف عصام تليمة، ومحاضرة طارق السويدان في نماذج وخطوات التخطيط الاستراتيجي في أربعة أجزاء، والجزء الأول من «تعلّم القيادة»."
  en: "The filmed record of the second Leaders' Academy in Turkey, of which the Assabile archive keeps six sessions: a lecture on the objectives of the Sharia by the guest Essam Telima, Tareq al-Suwaidan's four-part lecture on models and steps of strategic planning, and the first part of 'Learning Leadership'."
  ur: "ترکی میں دوسری قائدین اکیڈمی کی فلمائی گئی ریکارڈنگ، جس کی چھ نشستیں اسابیل آرکائیو میں محفوظ ہیں: مہمان عصام تلیمہ کا مقاصدِ شریعت پر لیکچر، سٹریٹجک منصوبہ بندی کے ماڈلوں اور مراحل پر طارق السویدان کا چار حصوں کا لیکچر، اور «قیادت سیکھنا» کا پہلا حصہ۔"
