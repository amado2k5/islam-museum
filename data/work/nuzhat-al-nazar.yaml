summary:
  ar: "شرح ابن حجر العسقلاني ⁦(773–852هـ)⁩ على متنه «نخبة الفكر في مصطلح أهل الأثر»، كتبه بطلب من سأله المتن ثم الشرح، وفرغ منه في مستهل ذي الحجة سنة 818هـ، وأورده «على صورة البسط» فدمج المتن في الشرح؛ ويقوم على تقسيم الخبر بحسب عدد طرقه ثم بحسب القبول والرد بطريقة «السبر والتقسيم»، واستقرت بعده تعريفات اختارها فيه كالشاذ والمنكر والصحيح والحسن لذاتهما ولغيرهما {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18-21} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}."
  en: "Ibn Hajar al-'Asqalani's (773–852 AH) commentary on his own Nukhbat al-Fikar fi Mustalah Ahl al-Athar, written at the request of the person who had asked for the base text and then for a commentary, completed at the start of Dhu al-Hijja 818 AH and set out 'in expanded form', the base text merged into the commentary; it divides reports first by the number of their chains and then by acceptance and rejection, in the manner of 'probing and division', and definitions it chose — the shadhdh and the munkar, the sahih and hasan 'in itself' and 'through another' — became standard after it {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18-21} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}."
  ur: "ابن حجر عسقلانی ⁦(773–852ھ)⁩ کی اپنے متن «نخبۃ الفکر فی مصطلح اہل الاثر» پر شرح، جو انہوں نے اسی شخص کی درخواست پر لکھی جس نے متن اور پھر شرح مانگی تھی، ذوالحجہ 818ھ کے آغاز میں مکمل کی اور «بسط کی صورت» میں پیش کی، یعنی متن کو شرح میں ضم کر دیا؛ یہ خبر کو پہلے اس کے طرق کی تعداد اور پھر قبول و رد کے اعتبار سے «سبر و تقسیم» کے طریقے پر تقسیم کرتی ہے، اور اس میں اختیار کی گئی تعریفیں — شاذ و منکر، اور صحیح و حسن لذاتہ و لغیرہ — بعد میں مستقر ہو گئیں {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18-21} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}۔"
  es: "El comentario de Ibn Hajar al-'Asqalani (773–852 AH) sobre su propio Nukhbat al-Fikar fi Mustalah Ahl al-Athar, escrito a petición de la persona que había solicitado el texto base y luego un comentario, se completó al comienzo de Dhu al-Hijja 818 AH y se presentó 'en forma ampliada', con el texto base fusionado en el comentario; divide los informes primero por el número de sus cadenas y luego por aceptación y rechazo, a la manera de 'sondeo y división', y las definiciones que eligió — el shadhdh y el munkar, el sahih y el hasan 'en sí mismo' y 'a través de otro'— se convirtieron en estándar después de que {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18-21} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}."
  fr: "Le commentaire d'Ibn Hajar al-'Asqalani (773-852 AH) sur son propre Nukhbat al-Fikar fi Mustalah Ahl al-Athar, écrit à la demande de la personne qui avait demandé le texte de base puis un commentaire, fut achevé au début de Dhu al-Hijja 818 AH et présenté « sous une forme développée », le texte de base étant fusionné avec le commentaire; il divise les rapports d'abord par le nombre de leurs chaînes de transmission, puis par acceptation et rejet, à la manière d'un « examen et d'une division », et les définitions qu'il a choisies — le shadhdh et le munkar, le sahih et le hasan « en soi » et « par un autre » — sont devenues la norme par la suite {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18-21} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}."
  tr: "İbn Hajar al-Askelani (773–852 H), metni isteyenlerin isteği üzerine yazdığı ve ardından tefhi 818 hicce'nin başında tamamlanan \"Nukbat el-Fikr fi Mustafa Ahl al-Athar\" metnine yorum yapmış ve metni \"bir yayım biçiminde\" dahil ederek metni tefhüre entegre etmiştir. Rapor, raporun zincir sayısına göre bölünmesiyle, ardından \"sorgulama ve bölme\" yöntemiyle kabul ve çürütmeye göre yapılmasına dayanır. Bundan sonra, anormal, reddedilen, özgün ve kendileri ile başkaları için iyi olan tanımlar oluşturulmuştur {cite:nuzhat-al-nazar-itr-bushra-2011, s. 18-21} {cite:nuzhat-al-nazar-itr-bushra-2011, s. 36}."
  id: "Ibn Hajar al-Asqalani (773–852 H) mengomentari teksnya \"Nukhbat al-Fikr fi Mustala Ahl al-Athar,\" yang ditulis atas permintaan mereka yang meminta teks dan kemudian komentar, yang diselesaikan di awal Dhu al-Hijjah tahun 818 H, dan memasukkannya \"dalam bentuk penyebaran,\" sehingga mengintegrasikan teks ke dalam komentar. Teks ini didasarkan pada pembagian laporan berdasarkan jumlah rantainya, lalu menurut penerimaan dan penolakan menggunakan metode \"penyelidikan dan pembagian.\" Setelah itu, definisi-definisi ditetapkan di dalamnya seperti anomali, yang ditolak, yang otentik, dan kebaikan untuk diri sendiri dan orang lain {cite:nuzhat-al-nazar-itr-bushra-2011, hlm. 18-21} {cite:nuzhat-al-nazar-itr-bushra-2011, hlm. 36}."
