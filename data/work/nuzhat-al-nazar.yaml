label: { ar: "نزهة النظر في توضيح نخبة الفكر", en: "Nuzhat al-Nazar fi Tawdih Nukhbat al-Fikar", ur: "نزہۃ النظر فی توضیح نخبۃ الفکر" }
summary:
  ar: "شرح ابن حجر العسقلاني (773–852هـ) على متنه «نخبة الفكر في مصطلح أهل الأثر»، كتبه بطلب من سأله المتن ثم الشرح، وفرغ منه في مستهل ذي الحجة سنة 818هـ، وأورده «على صورة البسط» فدمج المتن في الشرح؛ ويقوم على تقسيم الخبر بحسب عدد طرقه ثم بحسب القبول والرد بطريقة «السبر والتقسيم»، واستقرت بعده تعريفات اختارها فيه كالشاذ والمنكر والصحيح والحسن لذاتهما ولغيرهما {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18-21} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}."
  en: "Ibn Hajar al-'Asqalani's (773–852 AH) commentary on his own Nukhbat al-Fikar fi Mustalah Ahl al-Athar, written at the request of the person who had asked for the base text and then for a commentary, completed at the start of Dhu al-Hijja 818 AH and set out 'in expanded form', the base text merged into the commentary; it divides reports first by the number of their chains and then by acceptance and rejection, in the manner of 'probing and division', and definitions it chose — the shadhdh and the munkar, the sahih and hasan 'in itself' and 'through another' — became standard after it {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18-21} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}."
  ur: "ابن حجر عسقلانی (773–852ھ) کی اپنے متن «نخبۃ الفکر فی مصطلح اہل الاثر» پر شرح، جو انہوں نے اسی شخص کی درخواست پر لکھی جس نے متن اور پھر شرح مانگی تھی، ذوالحجہ 818ھ کے آغاز میں مکمل کی اور «بسط کی صورت» میں پیش کی، یعنی متن کو شرح میں ضم کر دیا؛ یہ خبر کو پہلے اس کے طرق کی تعداد اور پھر قبول و رد کے اعتبار سے «سبر و تقسیم» کے طریقے پر تقسیم کرتی ہے، اور اس میں اختیار کی گئی تعریفیں — شاذ و منکر، اور صحیح و حسن لذاتہ و لغیرہ — بعد میں مستقر ہو گئیں {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18-21} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}۔"
