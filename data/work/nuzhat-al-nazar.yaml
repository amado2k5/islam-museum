structure: "مقدمة في التصنيف في علوم الحديث وسبب تأليف المتن والشرح (ص 33–36)، ثم الخبر بحسب طرقه: المتواتر والمشهور والعزيز والغريب (ص 36–52)، ثم المقبول: الصحيح لذاته ومراتبه، والحسن لذاته، والصحيح والحسن لغيرهما، وزيادة الثقة، والمحفوظ والشاذ، والمعروف والمنكر، والمتابع والشاهد والاعتبار، والمحكم ومختلف الحديث (ص 52–72)، ثم المردود بالسقط والطعن، ثم أنواع تتعلق بالإسناد والرواة (إلى نحو ص 130)، بحسب طبعة البشرى."
