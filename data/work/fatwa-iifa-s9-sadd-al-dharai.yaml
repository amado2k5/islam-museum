id: work/fatwa-iifa-s9-sadd-al-dharai
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن سد الذرائع", en: "IIFA resolution on blocking the means (sadd al-dhara'i')", ur: "اکیڈمی کی قرارداد: سد الذرائع", es: "Resolución de la IIFA sobre el bloqueo de los medios (sadd al-dhara'i')", fr: "Résolution de l'IIFA sur le blocage des moyens (sadd al-dhara'i')" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته التاسعة ⁦(أبوظبي، أبريل 1995م)⁩: سد الذرائع أصل من أصول الشريعة وحقيقته منع المباحات التي يتوصل بها إلى مفاسد أو محظورات، ولا يقتصر على مواضع الاشتباه والاحتياط بل يشمل كل ما من شأنه التوصل به إلى الحرام، ويقتضي منع الحيل إلى إتيان المحظورات أو إبطال شيء من المطلوبات على ما فصّل."
  en: "IIFA's ninth-session resolution (Abu Dhabi, April 1995) on sadd al-dhara'i' (blocking the means): it is one of the sharia's roots — preventing lawful things used to reach corruptions or prohibitions; it is not confined to doubtful or precautionary cases but covers whatever may lead to the forbidden, and entails barring stratagems toward the prohibited or nullifying a required act, as detailed."
  ur: "اکیڈمی کی نویں مجلس کی قرارداد ⁦(ابوظہبی، اپریل 1995ء)⁩ سد الذرائع پر: شریعت کا ایک اصل ہے — مباح کو حرام تک پہنچانے سے روکنا؛ صرف شبہ نہیں بلکہ ہر وہ راستہ جو حرام کی طرف جائے۔"
  es: "Resolución de la novena sesión de la IIFA (Abu Dabi, abril de 1995) sobre sadd al-dhara'i' (bloqueo de los medios): es una de las raíces de la sharia: impedir que las cosas lícitas se utilicen para llegar a la corrupción o las prohibiciones; no se limita a casos dudosos o precautorios, sino que abarca todo lo que pueda conducir a lo prohibido, e implica impedir estratagemas para llegar a lo prohibido o anular un acto requerido, como se detalla."
  fr: "Résolution de la neuvième session de l'IIFA (Abou Dhabi, avril 1995) sur le sadd al-dhara'i' (blocage des moyens): il s'agit de l'une des racines de la charia — empêcher que des choses licites ne soient utilisées pour atteindre la corruption ou les interdictions; cela ne se limite pas aux cas douteux ou de précaution, mais couvre tout ce qui peut conduire à l'interdit, et implique d'empêcher les stratagèmes visant à l'interdit ou à annuler un acte requis, comme détaillé."
