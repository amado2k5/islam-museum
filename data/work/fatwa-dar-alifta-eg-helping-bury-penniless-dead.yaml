label: { ar: "حكم المشاركة في تجهيز ودفن الميت الذي لا مال له", en: "Helping prepare and bury a deceased who has no money", ur: "بے مال میت کی تدفین و تکفین میں حصہ لینے کا حکم", es: "Ayudar a preparar y enterrar a un difunto que no tiene dinero.", fr: "Aider à préparer et à enterrer un défunt sans ressources.", tr: "Parası olmayan ölenin hazırlanması ve defnedilmesine katılımına ilişkin karar", id: "Putusan tentang partisipasi dalam persiapan dan pemakaman almarhum yang tidak memiliki uang" }
summary:
  ar: "سائل سأل عن المشاركة في تجهيز ودفن الميت الذي لا مال له. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22173)⁩ أن ذلك من الأعمال الفاضلة ويدخل ضمن الصدقات الجارية التي لها أجر عظيم عند الله، على ما فصّل الجواب."
  en: "A questioner asked about helping prepare and bury a deceased who has no money. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22173) answered that this is among the excellent deeds and falls under the ongoing charities that have great reward with God, as the answer details."
  ur: "ایک سائل نے بے مال میت کی تدفین و تکفین میں حصہ لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22173)⁩ نے جواب دیا کہ یہ فضیلت والے کاموں میں ہے اور ایسے جاری صدقات میں داخل ہے جن کا اللہ کے ہاں بڑا اجر ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la posibilidad de ayudar a preparar y enterrar a un difunto sin recursos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22173) respondió que esto se considera una buena acción y forma parte de las obras de caridad que tienen una gran recompensa ante Dios, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant l'aide à apporter aux funérailles d'un défunt sans ressources. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22173) a répondu que cela compte parmi les excellentes actions et relève des aumônes régulières qui sont grandement récompensées par Dieu, comme le précise la réponse."
  tr: "Bir soru soran kişi, parası olmayan vefat eden kişinin hazırlanması ve defnedilmesine katılımı hakkında sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22173), bunun erdemli bir eylem olduğunu ve cevabında ayrıntılı olarak açıklandığı üzere, Allah'ın nezdinde büyük bir ödül getiren devam eden yardım eylemleri arasında sayıldığına cevap verdi."
  id: "Seorang penanya menanyakan tentang partisipasi dalam persiapan dan pemakaman almarhum yang tidak memiliki uang. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22173) menjawab bahwa ini adalah tindakan yang baik dan termasuk dalam amal yang sedang berlangsung yang memiliki ganjaran besar bagi Allah, seperti yang dijelaskan dalam jawabannya."
