id: work/fatwa-dar-alifta-eg-changing-ihram-garments
class: work
kind: fatwa
label: { ar: "حكم خلع لباس الإحرام وتغييره", en: "Taking off and changing the ihram garments", ur: "احرام کے کپڑے اتارنا اور بدلنا", es: "Quitarse y cambiarse las prendas del ihram", fr: "Retirer et changer les vêtements d'ihram" }
summary:
  ar: "سائل سأل عن خلع لباس الإحرام وتغييره أثناء الإحرام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20668)⁩ أنه يجوز خلع لباس الإحرام وتغييره أثناء الإحرام ولا حرج في ذلك ما دام المحرم رجلًا كان أو امرأة لم يخرج عن وصفه على ما فصّل الجواب."
  en: "A questioner asked about taking off and changing the ihram garments during ihram. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20668) answered that it is permissible for man and woman alike so long as its description is kept — as the answer details."
  ur: "ایک سائل نے احرام کے دوران کپڑے اتارنے اور بدلنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20668)⁩ نے جواب دیا کہ مرد ہو یا عورت اس کی حیثیت برقرار رہے تو جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de quitarse y cambiarse las prendas del ihram durante el período de ihram. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20668) respondió que es permisible tanto para hombres como para mujeres, siempre y cuando se mantenga su descripción, tal como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le retrait et le changement des vêtements d'ihram pendant l'ihram. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20668) a répondu que cela est permis aussi bien aux hommes qu'aux femmes, à condition de respecter les consignes – comme le précise la réponse."
