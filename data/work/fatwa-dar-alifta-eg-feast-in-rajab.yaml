label: { ar: "حكم عمل الوليمة في شهر رجب", en: "Holding a feast in the month of Rajab", ur: "رجب میں ولیمہ کرنے کا حکم" }
summary:
  ar: "سائل سأل عن عمل الوليمة في شهر رجب. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22353)⁩ أن عمل الوليمة في رجب جائز شرعًا سواء كان بإطعام الطعام وجمع الناس عليه وهو أمر مندوب إليه، على ما فصّل الجواب."
  en: "A questioner asked about holding a feast in Rajab. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22353) answered that a feast in Rajab is lawful — whether by serving food and gathering people to it — and it is a recommended act, as the answer details."
  ur: "ایک سائل نے رجب میں ولیمہ کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22353)⁩ نے جواب دیا کہ رجب میں ولیمہ کرنا شرعاً جائز ہے — خواہ کھانا کھلا کر لوگوں کو جمع کیا جائے — اور یہ مستحب کام ہے، جیسا کہ جواب میں تفصیل ہے۔"
