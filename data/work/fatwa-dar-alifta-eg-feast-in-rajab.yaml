id: work/fatwa-dar-alifta-eg-feast-in-rajab
class: work
kind: fatwa
label: { ar: "حكم عمل الوليمة في شهر رجب", en: "Holding a feast in the month of Rajab", ur: "رجب میں ولیمہ کرنے کا حکم", es: "Celebrar un banquete en el mes de Rajab.", fr: "Organiser une fête au mois de Rajab", tr: "Recep ayında ziyafet düzenlenmesine ilişkin karar", id: "Putusan tentang mengadakan pesta pada bulan Rajab" }
summary:
  ar: "سائل سأل عن عمل الوليمة في شهر رجب. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22353)⁩ أن عمل الوليمة في رجب جائز شرعًا سواء كان بإطعام الطعام وجمع الناس عليه وهو أمر مندوب إليه، على ما فصّل الجواب."
  en: "A questioner asked about holding a feast in Rajab. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22353) answered that a feast in Rajab is lawful — whether by serving food and gathering people to it — and it is a recommended act, as the answer details."
  ur: "ایک سائل نے رجب میں ولیمہ کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22353)⁩ نے جواب دیا کہ رجب میں ولیمہ کرنا شرعاً جائز ہے — خواہ کھانا کھلا کر لوگوں کو جمع کیا جائے — اور یہ مستحب کام ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de celebrar un banquete en Rajab. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22353) respondió que un banquete en Rajab es lícito, ya sea sirviendo comida o reuniendo gente, y que es un acto recomendado, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant l'organisation d'un festin durant le mois de Rajab. Le Dar al-Ifta égyptien (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22353) a répondu qu'un festin durant Rajab est licite — que ce soit en servant de la nourriture et en réunissant des personnes — et que c'est même un acte recommandé, comme le précise la réponse."
  tr: "Bir soru soran kişi, Rajab ayında bir ziyafet düzenlemeyi sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22353), Rajap'ta bir ziyafet düzenlemenin İslam hukukuna göre izin olduğunu, ister yiyecek vermek ister insan toplamak olsun, cevabda ayrıntılı olarak belirtildiği gibi, bunun tavsiye edilen bir konu olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang mengadakan pesta di bulan Rajab. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22353) menjawab bahwa mengadakan pesta di Rajab diperbolehkan menurut hukum Islam, baik itu melibatkan memberi makan dan mengumpulkan orang di dalamnya, yang merupakan hal yang direkomendasikan, seperti yang dijelaskan dalam jawaban."
