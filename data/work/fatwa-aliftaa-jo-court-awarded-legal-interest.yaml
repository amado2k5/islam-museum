id: work/fatwa-aliftaa-jo-court-awarded-legal-interest
class: work
kind: fatwa
label: { ar: "الفائدة القانونية التي يحكم بها القاضي", en: "Court-awarded legal interest", ur: "عدالت کی طرف سے دیا گیا قانونی سود", es: "Interés jurídico otorgado por el tribunal", fr: "Intérêts légaux accordés par le tribunal", tr: "Hukuki Fayda Yargıcı Kuralları", id: "Aturan Hakim Manfaat Hukum" }
summary:
  ar: "سؤال عن الفائدة القانونية التي يحكم بها القاضي، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز خصم التكاليف الحقيقية للدعوى منها، ويعاد الزائد لمن فرضت عليه، أو يصرف في المصالح العامة أو على الفقراء إن كانت جهة عامة. أجابت الدائرة بأنه يجوز لمن حكم له القاضي بالفائدة القانونية أن يخصم منها التكاليف الحقيقية لإقامة الدعوى. وقالت إن ما زاد على ذلك يعيده لمن فرضت عليه إن كان شخصًا معينًا، وإن كانت جهة عامة صرفه في مصالح المسلمين العامة كالمدارس والمساجد والطرقات، أو تصدق به على الفقراء والمساكين."
  en: "A question about court-awarded legal interest, in which Jordan's General Iftaa Department answered that the real costs of the lawsuit may be deducted from it, and the rest returned to the person it was imposed on, or, if that is a public body, spent on public interests or given to the poor. The Department answered that someone awarded legal interest by a judge may deduct from it the real costs of bringing the lawsuit. It said that anything beyond that should be returned to whoever it was imposed on if that is a specific person, and if it is a public body, spent on the public interests of Muslims, such as schools, mosques and roads, or given in charity to the poor and needy."
  ur: "عدالت کی طرف سے دیا گیا قانونی سود کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مقدمے کے حقیقی اخراجات اس سے منہا کیے جا سکتے ہیں، اور باقی جس پر عائد ہوا اسے لوٹایا جائے، یا اگر وہ سرکاری ادارہ ہو تو عوامی مفاد یا فقرا پر خرچ کیا جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ جس کے حق میں قاضی نے قانونی سود کا فیصلہ دیا ہو وہ اس سے مقدمہ دائر کرنے کے حقیقی اخراجات منہا کر سکتا ہے۔ اس نے کہا کہ اس سے زائد رقم، اگر کسی معین شخص پر عائد ہوئی ہو تو اسے لوٹائی جائے، اور اگر سرکاری ادارہ ہو تو مسلمانوں کے عمومی مفادات جیسے اسکولوں، مساجد اور سڑکوں پر خرچ کی جائے، یا فقرا اور مساکین پر صدقہ کی جائے۔"
  es: "Una pregunta sobre los intereses legales otorgados por un tribunal, a la que el Departamento General de Iftaa de Jordania respondió que los costos reales del litigio pueden deducirse de dichos intereses, y el resto debe devolverse a la persona a quien se le impusieron, o, si se trata de un organismo público, destinarse a intereses públicos o entregarse a los pobres. El Departamento respondió que quien recibe intereses legales otorgados por un juez puede deducir los costos reales de la demanda. Indicó que cualquier cantidad que exceda dicha cantidad debe devolverse a quien se le impuso, si se trata de una persona específica, y si se trata de un organismo público, destinarse a los intereses públicos de los musulmanes, como escuelas, mezquitas y carreteras, o entregarse como caridad a los pobres y necesitados."
  fr: "Concernant les intérêts légaux accordés par un tribunal, le Département général de la Cour suprême de Jordanie (Iftaa) a répondu que les frais réels de la procédure peuvent en être déduits, et le solde restitué à la personne à qui les intérêts ont été accordés ou, s'il s'agit d'un organisme public, affecté à des projets d'intérêt général ou distribué aux plus démunis. Le Département a précisé que toute personne à qui des intérêts légaux ont été accordés par un juge peut en déduire les frais réels de la procédure. Il a ajouté que tout excédent doit être restitué à la personne à qui les intérêts ont été accordés, s'il s'agit d'une personne physique, et, s'il s'agit d'un organisme public, affecté à des projets d'intérêt général pour les musulmans, tels que des écoles, des mosquées et des routes, ou distribué sous forme d'aumône aux pauvres et aux nécessiteux."
  tr: "Yargıcın hukuki fayda hakkıyla ilgili soruya Ürdün Genel Fetva Dairesi tarafından yanıtlandı; davanın gerçek masrafları mahsup edilebileceği ve fazlalığın kendisine yüklenen tarafa iade edilebileceği veya kamu kuruluşu ise kamu çıkarlarına veya yoksullara harcanabileceği belirtildi. Mahkeme, yargıcın hukuki fayda için karar verdiği kişinin davanın açılma masraflarını kesebileceğini yanıtladı. Mahkeme, bu fazlalığın kendisine dayatılan kişiye geri verildiğini, eğer belirli bir kişiyse ve kamu kurumu bunu okullar, camiler, yollar veya yoksul ve muhtaçlara verdiği hayır kurumları gibi Müslümanların kamu çıkarlarına harcıyorsa geri verildiğini belirtti."
  id: "Pertanyaan tentang manfaat hukum yang diberikan oleh hakim dijawab oleh Departemen Fatwa Umum Yordania bahwa biaya aktual dari gugatan dapat dikurangkan, dan kelebihan tersebut dapat dikembalikan kepada pihak yang dikenakan kepada mereka, atau digunakan untuk kepentingan publik atau orang miskin jika itu adalah entitas publik. Pengadilan menjawab bahwa seseorang yang diputuskan hakim untuk manfaat hukum dapat mengurangi biaya aktual untuk mengajukan gugatan. Pengadilan menyatakan bahwa setiap kelebihan di atas itu dikembalikan kepada orang yang dikenakan jika itu adalah orang tertentu, dan jika entitas publik menggunakannya untuk kepentingan publik Muslim seperti sekolah, masjid, jalan, atau amal yang diberikan kepada orang miskin dan membutuhkan."
