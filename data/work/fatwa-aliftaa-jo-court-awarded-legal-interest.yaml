id: work/fatwa-aliftaa-jo-court-awarded-legal-interest
class: work
kind: fatwa
label: { ar: "الفائدة القانونية التي يحكم بها القاضي", en: "Court-awarded legal interest", ur: "عدالت کی طرف سے دیا گیا قانونی سود" }
summary:
  ar: "سؤال عن الفائدة القانونية التي يحكم بها القاضي، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز خصم التكاليف الحقيقية للدعوى منها، ويعاد الزائد لمن فرضت عليه، أو يصرف في المصالح العامة أو على الفقراء إن كانت جهة عامة. أجابت الدائرة بأنه يجوز لمن حكم له القاضي بالفائدة القانونية أن يخصم منها التكاليف الحقيقية لإقامة الدعوى. وقالت إن ما زاد على ذلك يعيده لمن فرضت عليه إن كان شخصًا معينًا، وإن كانت جهة عامة صرفه في مصالح المسلمين العامة كالمدارس والمساجد والطرقات، أو تصدق به على الفقراء والمساكين."
  en: "A question about court-awarded legal interest, in which Jordan's General Iftaa Department answered that the real costs of the lawsuit may be deducted from it, and the rest returned to the person it was imposed on, or, if that is a public body, spent on public interests or given to the poor. The Department answered that someone awarded legal interest by a judge may deduct from it the real costs of bringing the lawsuit. It said that anything beyond that should be returned to whoever it was imposed on if that is a specific person, and if it is a public body, spent on the public interests of Muslims, such as schools, mosques and roads, or given in charity to the poor and needy."
  ur: "عدالت کی طرف سے دیا گیا قانونی سود کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مقدمے کے حقیقی اخراجات اس سے منہا کیے جا سکتے ہیں، اور باقی جس پر عائد ہوا اسے لوٹایا جائے، یا اگر وہ سرکاری ادارہ ہو تو عوامی مفاد یا فقرا پر خرچ کیا جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ جس کے حق میں قاضی نے قانونی سود کا فیصلہ دیا ہو وہ اس سے مقدمہ دائر کرنے کے حقیقی اخراجات منہا کر سکتا ہے۔ اس نے کہا کہ اس سے زائد رقم، اگر کسی معین شخص پر عائد ہوئی ہو تو اسے لوٹائی جائے، اور اگر سرکاری ادارہ ہو تو مسلمانوں کے عمومی مفادات جیسے اسکولوں، مساجد اور سڑکوں پر خرچ کی جائے، یا فقرا اور مساکین پر صدقہ کی جائے۔"
