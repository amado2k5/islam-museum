id: work/fatwa-binbaz-asking-god-by-the-blessing-of-a-person
class: work
kind: fatwa
label: { ar: "حكم قول: ببركة فلان، أو ببركة القرآن", en: "Saying 'by the blessing of so-and-so' or 'by the blessing of the Qur'an' in supplication", ur: "دعا میں 'فلاں کی برکت سے' یا 'قرآن کی برکت سے' کہنے کا حکم", es: "Decir \"por la bendición de fulano\" o \"por la bendición del Corán\" en una súplica.", fr: "Dire « par la bénédiction de untel » ou « par la bénédiction du Coran » en supplication" }
summary:
  ar: "سؤال عن حكم قول القائل في دعائه: اللهم اجعل لي هذا الأمر ببركة فلان أو ببركة القرآن، أجاب فيه ابن باز بأنه إن كان لفلان في الأمر سبب أو أمكن أن يكون له فيه سبب فلا بأس، كقول: اللهم يسّر أمري ببركة فلان، أو اللهم اقض ديني بفلان، أي بأسباب فلان، أما ما ليس له فيه تسبب فهذا كذب. وقال إن قول: اللهم اغفر لي بقراءتي للقرآن أو بعلمي به أو بتلاوتي له أو بحفظي له لا يضر، لأن القرآن كلام الله، فهو توسل بكلام الله."
  en: "A question about the ruling on saying in supplication 'O God, grant me this matter by the blessing of so-and-so, or by the blessing of the Qur'an', in which Ibn Baz answered that if so-and-so had a part in bringing the matter about, or could have had one, there is no harm, as in 'O God, ease my affair by the blessing of so-and-so' or 'O God, settle my debt through so-and-so', meaning through his agency; but where the person had no part in it, the statement is a falsehood. He said that saying 'O God, forgive me by my reading of the Qur'an, my knowledge of it, my recitation of it or my memorisation of it' does no harm, because the Qur'an is God's speech, so this is seeking a means through God's speech."
  ur: "دعا میں یہ کہنے کے حکم کے بارے میں سوال کہ 'اے اللہ، میرے لیے یہ کام فلاں کی برکت سے یا قرآن کی برکت سے کر دے'، جس میں ابن باز نے جواب دیا کہ اگر اس کام میں فلاں کا کوئی سبب ہو یا ہو سکتا ہو تو کوئی حرج نہیں، جیسے 'اے اللہ، فلاں کی برکت سے میرا کام آسان کر' یا 'اے اللہ، فلاں کے ذریعے میرا قرض ادا کر'، یعنی فلاں کے اسباب سے؛ لیکن جس میں اس شخص کا کوئی سبب نہ ہو وہ جھوٹ ہے۔ انہوں نے کہا کہ یہ کہنا کہ 'اے اللہ، میرے قرآن پڑھنے، اس کے علم، اس کی تلاوت یا اسے حفظ کرنے کے سبب مجھے بخش دے' نقصان نہیں دیتا، کیونکہ قرآن اللہ کا کلام ہے، لہٰذا یہ اللہ کے کلام سے توسل ہے۔"
  es: "Una pregunta sobre la norma relativa a la súplica «¡Oh Dios, concédeme esto por la bendición de fulano o por la bendición del Corán!», a la que Ibn Baz respondió que si fulano tuvo parte en la realización del asunto, o pudo haberla tenido, no hay daño, como en «¡Oh Dios, facilita mi asunto por la bendición de fulano!» o «¡Oh Dios, salda mi deuda a través de fulano!», es decir, a través de su intervención; pero cuando la persona no tuvo parte en ello, la declaración es falsa. Dijo que decir «¡Oh Dios, perdóname por mi lectura del Corán, mi conocimiento del mismo, mi recitación del mismo o mi memorización del mismo!» no causa daño, porque el Corán es la palabra de Dios, por lo que esto es buscar un medio a través de la palabra de Dios."
  fr: "Une question portait sur la règle concernant l'invocation: « Ô Dieu, accorde-moi ceci par la grâce de telle personne ou par la grâce du Coran ». Ibn Baz répondit que si telle personne a joué un rôle dans la situation, ou aurait pu en jouer un, il n'y a pas de mal, comme dans « Ô Dieu, facilite ma situation par la grâce de telle personne » ou « Ô Dieu, règle ma dette par l'intermédiaire de telle personne », c'est-à-dire par son intermédiaire. Mais si la personne n'y a pas participé, l'invocation est fausse. Il affirma que dire « Ô Dieu, pardonne-moi par ma lecture du Coran, ma connaissance de celui-ci, ma récitation de celui-ci ou ma mémorisation de celui-ci » ne présente aucun mal, car le Coran est la parole de Dieu; il s'agit donc de rechercher un moyen par la parole divine."
