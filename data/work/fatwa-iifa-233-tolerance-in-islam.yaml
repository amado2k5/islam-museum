label: { ar: "قرار مجمع الفقه الإسلامي الدولي 233 (24/4) بشأن التسامح في الإسلام وضرورته المجتمعية والدولية وآثاره", en: "IIFA resolution 233 (24/4) on tolerance in Islam, its social and international necessity and its effects", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 233 (24/4): اسلام میں رواداری، اس کی سماجی و بین الاقوامی ضرورت اور اس کے اثرات", es: "Resolución 233 (24/4) de la IIFA sobre la tolerancia en el Islam, su necesidad social e internacional y sus efectos.", fr: "Résolution 233 (24/4) de l'IIFA sur la tolérance en islam, sa nécessité sociale et internationale et ses effets", tr: "Uluslararası İslam Fiqh Akademisi Kararı 233 (24/4) ile İslam'da Hoşgörü, Sosyal ve Uluslararası Gerekliliği ile Etkileri", id: "Resolusi Akademi Fiqh Islam Internasional 233 (24/4) tentang toleransi dalam Islam, kebutuhan sosial dan internasionalnya, serta dampaknya" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة والعشرين بدبي ⁦(7–9 ربيع الأول 1441هـ، 4–6 نوفمبر 2019م)⁩. أكد المجمع ما صدر عنه من قرارات وتوصيات وبيانات وإعلانات تدعو إلى التعايش السلمي، وقرر أن التسامح مبدأ أصيل وردت أدلته في القرآن الكريم والسنة وله تطبيقات كثيرة في السيرة وأفعال الصحابة والتاريخ الإسلامي، ومن أبرز صور السماحة مع المخالفين في عهد رسول الله ما اقتضته وثيقة المدينة؛ وأن التسامح مأمور به بين المسلمين وبينهم وبين غيرهم؛ وأن الحاجة ماسة إلى العمل به في السلوك والأقوال في جميع المجالات لأنه من أهم آثار التعايش السلمي والتماسك المجتمعي والحفاظ على العلاقات الاجتماعية والوحدة الوطنية. وأشاد بالمبادرات والإعلانات الدولية وبفعاليات دولة الإمارات في التسامح والتعايش، وأوصى بإدراج قيمة التسامح في المناهج التربوية وتضمين الخطاب الديني ووسائل الإعلام قيمه، وحث المتخصصين على الكتابة والترجمة لها، ودعوة الأمم المتحدة والدول الأعضاء إلى سن تشريعات ومعاهدات تجرم العنصرية والإقصاء والعصبية والتمييز."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 24th session in Dubai (7–9 Rabi' I 1441, 4–6 November 2019). It reaffirmed its earlier resolutions, recommendations, statements and declarations calling for peaceful coexistence; held that tolerance is an original principle whose proofs occur in the Quran and the Sunnah, with many applications in the Prophet's life, the deeds of the Companions and Islamic history — the most prominent example of forbearance toward dissenters in the Prophet's time being the Covenant of Medina; that tolerance is commanded among Muslims and between Muslims and others; and that practising it in conduct and speech in every field is an urgent need, as one of the foremost fruits of peaceful coexistence, social cohesion and the preservation of social relations and national unity. It commended international initiatives and declarations and the United Arab Emirates' activities for tolerance and coexistence, and recommended including the value of tolerance in educational curricula, embodying it in religious discourse and media, urging specialists to write and translate on it, and calling on the United Nations and member states to enact legislation and treaties criminalising racism, exclusion, bigotry and discrimination."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں چوبیس ویں مجلس ⁦(7–9 ربیع الاول 1441ھ، 4–6 نومبر 2019ء)⁩ میں۔ اکیڈمی نے اپنی پچھلی قراردادوں، سفارشات، بیانات اور اعلامیوں کی تائید کی جو پرامن بقائے باہمی کی دعوت دیتے ہیں؛ قرار دیا کہ رواداری ایک اصلی اصول ہے جس کی دلیلیں قرآن و سنت میں موجود ہیں اور سیرت، صحابہ کے اعمال اور اسلامی تاریخ میں اس کی کثیر تطبیقات ہیں — نبوی عہد میں مخالفین کے ساتھ بردباری کی نمایاں ترین مثال میثاقِ مدینہ ہے؛ رواداری مسلمانوں کے باہم اور ان کے اور دوسروں کے درمیان حکم ہے؛ اور ہر شعبے میں قول و فعل میں اس پر عمل شدید ضرورت ہے کیونکہ یہ پرامن بقائے باہمی، سماجی یگانگت اور سماجی تعلقات و قومی وحدت کے تحفظ کے اہم ثمرات میں سے ہے۔ اس نے بین الاقوامی اقدامات اور اعلامیوں اور متحدہ عرب امارات کی رواداری و بقائے باہمی کی سرگرمیوں کو سراہا، اور سفارش کی کہ تدریسی نصابوں میں رواداری کی قدر شامل ہو، دینی خطاب اور ذرائع ابلاغ میں اس کی اقدار شامل ہوں، ماہرین لکھنے و ترجمے کی ترغیب دیں، اور اقوام متحدہ اور رکن ممالک عنصریت، بے دخلی، تعصب اور امتیاز کو جرم بنانے والے قوانین اور معاہدے بنائیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 24.ª sesión en Dubái (7-9 Rabi' I 1441, 4-6 de noviembre de 2019). Reafirmó sus resoluciones, recomendaciones, declaraciones y manifestaciones anteriores que abogan por la coexistencia pacífica; sostuvo que la tolerancia es un principio original cuyas pruebas se encuentran en el Corán y la Sunnah, con numerosas aplicaciones en la vida del Profeta, las acciones de los Compañeros y la historia islámica —el ejemplo más destacado de tolerancia hacia los disidentes en tiempos del Profeta es el Pacto de Medina—; que la tolerancia es un mandato entre los musulmanes y entre los musulmanes y los demás; y que practicarla en la conducta y el habla en todos los ámbitos es una necesidad urgente, como uno de los principales frutos de la coexistencia pacífica, la cohesión social y la preservación de las relaciones sociales y la unidad nacional. Elogió las iniciativas y declaraciones internacionales, así como las actividades de los Emiratos Árabes Unidos en favor de la tolerancia y la coexistencia, y recomendó incluir el valor de la tolerancia en los planes de estudio, incorporarlo en el discurso religioso y en los medios de comunicación, instar a los especialistas a escribir y traducir sobre el tema, y pedir a las Naciones Unidas y a los Estados miembros que promulguen leyes y tratados que tipifiquen como delito el racismo, la exclusión, la intolerancia y la discriminación."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 24e session à Dubaï (7-9 Rabi' I 1441, 4-6 novembre 2019). Elle a réaffirmé ses résolutions, recommandations, déclarations et prises de position antérieures appelant à la coexistence pacifique; elle a affirmé que la tolérance est un principe originel dont les preuves se trouvent dans le Coran et la Sunna, avec de nombreuses applications dans la vie du Prophète, les actes des Compagnons et l'histoire islamique – l'exemple le plus marquant de tolérance envers les dissidents à l'époque du Prophète étant l'Accord de Médine; que la tolérance est un commandement entre musulmans et entre musulmans et autres; et que sa mise en pratique dans les actes et les paroles, dans tous les domaines, est une nécessité urgente, car elle constitue l'un des principaux fruits de la coexistence pacifique, de la cohésion sociale et de la préservation des relations sociales et de l'unité nationale. Elle a salué les initiatives et déclarations internationales ainsi que les activités des Émirats arabes unis en faveur de la tolérance et de la coexistence, et a recommandé d'inclure la valeur de la tolérance dans les programmes scolaires, de l'incarner dans le discours religieux et les médias, d'inciter les spécialistes à écrire et à traduire sur ce sujet, et d'appeler les Nations Unies et les États membres à adopter des lois et des traités criminalisant le racisme, l'exclusion, le sectarisme et la discrimination."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Dubai'deki yirmi dördüncü oturumunda (7–9 Rabi'al-Awwal 1441 H, 4–6 Kasım 2019) toplu kararı alınmıştır. Akademi, barış içinde bir arada yaşama çağrısında bulunan kararlarını, tavsiyelerini, açıklamalarını ve bildirgelerini teyit etmiş ve hoşgörünün Kur'an-Kerim ve Sünnet'te kanıtlanan özgün bir ilke olduğunu, biyografi, Sahabelerin eylemleri ve İslam tarihinde birçok uygulaması olduğuna karar vermiştir. Allah'ın Elçisi döneminde muhaliflere karşı en belirgin hoşgörü biçimlerinden biri, Medine belgesinin gerektirdiği şeylerdir; hoşgörünün Müslümanlar arasında ve onlar arasında ve diğerleri arasında emredildiği; ve barış içinde bir arada yaşamın, toplumsal uyumun, sosyal ilişkilerin ve ulusal birliğin korunmasının en önemli etkilerinden biri olduğu için tüm alanlarda davranış ve sözde acilen uygulanmasının gerekli olduğu belirtilmiştir. Uluslararası girişimleri, deklarasyonları ve BAE'nin hoşgörü ve bir arada yaşama faaliyetlerini övdü, hoşgörünün değerinin eğitim müfredatlarına dahil edilmesini, değerlerinin dini söylem ve medyaya dahil edilmesini, uzmanların bunları yazıp çevirmesini teşvik etti ve Birleşmiş Milletler ile üye devletleri ırkçılık, dışlama, fanatizm ve ayrımcılığı suç sayan yasalar ve antlaşmalar çıkarmaya çağırdı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-24 di Dubai (7–9 Rabi al-Awwal 1441 H, 4–6 November 2019). Akademi menegaskan keputusan, rekomendasi, pernyataan, dan deklarasi yang menyerukan hidup berdampingan secara damai, dan memutuskan bahwa toleransi adalah prinsip otentik yang tercermin dalam Al-Qur'an dan Sunnah, dengan banyak aplikasi dalam biografi, tindakan para sahabat, dan sejarah Islam. Di antara bentuk toleransi yang paling menonjol terhadap lawan pada masa Rasulullah adalah apa yang diwajibkan dokumen Madinah; bahwa toleransi diperintahkan di antara Muslim dan di antara mereka dan lainnya; dan bahwa ada kebutuhan mendesak untuk menerapkannya dalam perilaku dan kata-kata di semua bidang karena ini adalah salah satu efek terpenting dari hidup berdampingan secara damai, kohesi sosial, serta pelestarian hubungan sosial dan persatuan nasional. Ia memuji inisiatif internasional, deklarasi, dan aktivitas UEA dalam toleransi dan hidup berdampingan, merekomendasikan memasukkan nilai toleransi dalam kurikulum pendidikan, mengintegrasikan nilai-nilainya ke dalam wacana dan media agama, mendesak para spesialis untuk menulis dan menerjemahkannya, serta menyerukan Perserikatan Bangsa-Bangsa dan negara anggota untuk mengesahkan undang-undang dan perjanjian yang mengkriminalisasi rasisme, eksklusi, fanatisme, dan diskriminasi."
