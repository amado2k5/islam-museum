label: { ar: "المداعبة دون إنزال", en: "Foreplay without emission — wudu only", ur: "بغیر انزال مداعبت — صرف وضو", es: "Juegos previos sin eyaculación — solo wudu", fr: "préliminaires sans émission — ablutions seulement", tr: "Boşalmadan ön sevişme", id: "Foreplay tanpa ejakulasi" }
summary:
  ar: "سأل سائل أنه يداعب زوجته ويلمسها بشهوة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77563 بتاريخ 25 يناير 2009)⁩ أنه يكفيه من ذلك الوضوء ما دام لم ينزل لأن الغسل إنما يجب بالجماع ولو بغير إنزال أو بالإنزال ولو بغير جماع أما مجرد المداعبة بشهوة ولو صاحبها مذي فإنها لا توجب الغسل على ما فصّل الجواب."
  en: "A questioner described fondling and touching his wife with desire. Dr. Salah al-Sawi (fatwa no. 77563, 25 January 2009) answered that wudu suffices him so long as he did not emit — the washing binds only on intercourse even without emission, or on emission even without intercourse; mere fondling with desire, even where madhy attends it, obliges no washing — as the answer details."
  ur: "بغیر انزال مداعبت؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77563، 25 جنوری 2009)⁩ کے مطابق غسل صرف جماع یا انزال پر ہے — مذی پر وضو کافی۔"
  es: "Un consultante describió haber acariciado y tocado a su esposa con deseo. El Dr. Salah al-Sawi (fatwa n.° 77563, 25 de enero de 2009) respondió que la ablución le basta siempre que no haya eyaculado; la ablución solo obliga en caso de coito, incluso sin eyaculación, o en caso de eyaculación, incluso sin coito; las simples caricias con deseo, incluso cuando hay deseo sexual, no obligan a la ablución, como se detalla en la respuesta."
  fr: "Un homme a décrit avoir caressé et touché sa femme avec désir. Le Dr Salah al-Sawi (fatwa n° 77563, 25 janvier 2009) a répondu que les ablutions suffisent tant qu'il n'y a pas eu d'éjaculation; les ablutions ne sont obligatoires qu'en cas de rapport sexuel, même sans éjaculation, ou en cas d'éjaculation, même sans rapport sexuel; les simples caresses avec désir, même accompagnées de désir, n'obligent pas à se laver, comme le précise la réponse."
  tr: "Bir soru soran kişi, karısını okşayıp şehvetle dokunup dokunmadığını sordu. Dr. Salah Al-Sawy (25 Ocak 2009 tarihli 77563 Fetvası) cevabında bulundu; çünkü boşalma yapmadığı sürece abdest almanın yeterli olduğunu, çünkü gusl'un boşalmadan bile cinsel ilişki için zorunlu olduğunu, cinsel ilişki olmadan bile boşalma zorunlu olduğunu belirtti. Ancak, safsızlıkla birlikte olsa bile arzu ile cinsel ilişki, cevapta açıklandığı gibi hüsl gerektirmez."
  id: "Seorang penanya bertanya apakah ia membelai istrinya dan menyentuhnya dengan penuh nafsu. Dr. Salah Al-Sawy menjawab (Fatwa No. 77563 tanggal 25 Januari 2009) bahwa wudhu sudah cukup baginya selama ia belum melakukan ejakulasi, karena ghusl hanya wajib untuk berhubungan seksual bahkan tanpa ejakulasi atau ejakulasi bahkan tanpa hubungan seksual. Namun, sekadar berhubungan seks dengan hasrat, meskipun disertai dengan ketidakmurnian, tidak memerlukan ghusl seperti yang dijelaskan dalam jawaban."
