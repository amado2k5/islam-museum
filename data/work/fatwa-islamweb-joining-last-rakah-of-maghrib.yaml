id: work/fatwa-islamweb-joining-last-rakah-of-maghrib
class: work
kind: fatwa
label: { ar: "ما يفعل من أدرك ركعة من المغرب مع الإمام", en: "Joining the imam for the last rak'a of the sunset prayer", ur: "مغرب میں امام کے ساتھ آخری رکعت پانے والا کیا کرے", es: "Uniéndose al imán para la última rak'a de la oración del atardecer.", fr: "Je me joins à l'imam pour la dernière rak'a de la prière du coucher du soleil." }
summary:
  ar: "سؤال عمن صلى مع الإمام الركعة الأخيرة من المغرب. أجاب مركز الفتوى في إسلام ويب بأنه إن أدرك الركوع فقد أدرك ركعة وبقيت عليه ركعتان، وإن أدرك الإمام بعد ركوع الثالثة، في السجود أو التشهد، أتم معه ثم صلى ثلاث ركعات بعد سلامه، ولا يضر اختلاف هيئة القضاء عن الأداء، ويدرك أجر الجماعة وإن كان دون أجر من أدركها من أولها."
  en: "A question about someone who prayed the last rak'a of the sunset prayer with the imam. The IslamWeb fatwa centre answered that if he caught the bowing he has caught one rak'a and has two left; if he joined after the third bowing, in prostration or the final tashahhud, he completes with the imam and then prays three rak'as after the imam's closing salutation; the different shape of the made-up prayer does no harm, and he gains the reward of congregation, though less than one who joined from the start."
  ur: "اس شخص کے بارے میں سوال جس نے مغرب کی آخری رکعت امام کے ساتھ پڑھی۔ اسلام ویب کے مرکزِ فتویٰ نے جواب دیا کہ اگر اس نے رکوع پا لیا تو ایک رکعت پا لی اور دو باقی ہیں؛ اگر تیسرے رکوع کے بعد سجدے یا آخری تشہد میں شامل ہوا تو امام کے ساتھ پوری کرے پھر سلام کے بعد تین رکعتیں پڑھے؛ قضا کی ہیئت ادا سے مختلف ہونے میں حرج نہیں، اور اسے جماعت کا ثواب ملے گا اگرچہ شروع سے شامل ہونے والے سے کم۔"
  es: "Una pregunta sobre alguien que rezó la última rak'a de la oración del atardecer con el imán. El centro de fatwas de IslamWeb respondió que si se unió a la reverencia, ya ha rezado una rak'a y le quedan dos; si se unió después de la tercera reverencia, en postración o en el tashahhud final, completa con el imán y luego reza tres rak'as después del saludo final del imán; la forma diferente de la oración completada no causa ningún daño, y obtiene la recompensa de la congregación, aunque menor que la de alguien que se unió desde el principio."
  fr: "Une question concernait une personne ayant accompli la dernière rak'a de la prière du coucher du soleil avec l'imam. Le centre de fatwas IslamWeb a répondu que si cette personne a rejoint l'imam après la troisième inclinaison, elle a accompli une rak'a et il lui en reste deux; si elle a rejoint l'imam après la troisième inclinaison, lors de la prosternation ou du tashahhud final, elle termine la prière avec lui et accomplit ensuite trois rak'as après la salutation finale de l'imam; la forme différente de cette prière improvisée n'a aucune incidence négative, et elle obtient la récompense de la prière en groupe, bien que moindre que celle de celui qui a rejoint l'imam dès le début."
