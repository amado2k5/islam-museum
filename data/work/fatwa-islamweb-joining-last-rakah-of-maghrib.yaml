id: work/fatwa-islamweb-joining-last-rakah-of-maghrib
class: work
kind: fatwa
label: { ar: "ما يفعل من أدرك ركعة من المغرب مع الإمام", en: "Joining the imam for the last rak'a of the sunset prayer", ur: "مغرب میں امام کے ساتھ آخری رکعت پانے والا کیا کرے" }
summary:
  ar: "سؤال عمن صلى مع الإمام الركعة الأخيرة من المغرب. أجاب مركز الفتوى في إسلام ويب بأنه إن أدرك الركوع فقد أدرك ركعة وبقيت عليه ركعتان، وإن أدرك الإمام بعد ركوع الثالثة، في السجود أو التشهد، أتم معه ثم صلى ثلاث ركعات بعد سلامه، ولا يضر اختلاف هيئة القضاء عن الأداء، ويدرك أجر الجماعة وإن كان دون أجر من أدركها من أولها."
  en: "A question about someone who prayed the last rak'a of the sunset prayer with the imam. The IslamWeb fatwa centre answered that if he caught the bowing he has caught one rak'a and has two left; if he joined after the third bowing, in prostration or the final tashahhud, he completes with the imam and then prays three rak'as after the imam's closing salutation; the different shape of the made-up prayer does no harm, and he gains the reward of congregation, though less than one who joined from the start."
  ur: "اس شخص کے بارے میں سوال جس نے مغرب کی آخری رکعت امام کے ساتھ پڑھی۔ اسلام ویب کے مرکزِ فتویٰ نے جواب دیا کہ اگر اس نے رکوع پا لیا تو ایک رکعت پا لی اور دو باقی ہیں؛ اگر تیسرے رکوع کے بعد سجدے یا آخری تشہد میں شامل ہوا تو امام کے ساتھ پوری کرے پھر سلام کے بعد تین رکعتیں پڑھے؛ قضا کی ہیئت ادا سے مختلف ہونے میں حرج نہیں، اور اسے جماعت کا ثواب ملے گا اگرچہ شروع سے شامل ہونے والے سے کم۔"
