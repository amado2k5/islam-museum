id: work/fatwa-iifa-173-cosmetic-surgery
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 173 (18/11) بشأن الجراحة التجميلية وأحكامها", en: "IIFA resolution 173 (18/11) on cosmetic surgery and its rulings", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 173 (18/11): کاسمیٹک سرجری اور اس کے احکام", es: "Resolución 173 (18/11) de la IIFA sobre cirugía estética y sus resoluciones." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩. عرّف جراحة التجميل بأنها ما يعنى بتحسين شكل جزء أو أجزاء من الجسم الظاهرة أو إعادة وظيفته إذا طرأ عليه خلل مؤثر، واشترط لإجرائها: تحقيق مصلحة معتبرة شرعًا كإعادة الوظيفة وإصلاح العيب وإعادة الخلقة لأصلها؛ ألا يربو ضررها على مصلحتها ويقرر ذلك أهل الاختصاص الثقات؛ قيام طبيب مختص مؤهل وإلا ترتبت مسؤوليته حسب قرار المجمع 142 ⁦(15/8)⁩؛ إذن المريض؛ التبصير الواعي بالأخطار والمضاعفات؛ عدم وجود طريق علاجي أقل مساسًا بالجسم؛ ألا تترتب مخالفة للنصوص ⁦(كالنهي الوارد في الأحاديث عن الوشم والنمص والتفلج وتغيير الخلق والتشبهات المنهي عنها)⁩؛ ومراعاة قواعد التداوي من الخلوة وكشف العورات إلا لضرورة أو حاجة. وقرر: يجوز إجراء الجراحة التجميلية الضرورية والحاجية ⁦(إعادة شكل الأعضاء للخلقة الأصلية، إعادة الوظيفة، إصلاح العيوب الخلقية كالشفة الأرنبية واعوجاج الأنف الشديد والوحمات وزيادة الأصابع والأسنان والالتصاق إذا ألحق أذى ماديًا أو معنويًا، إصلاح العيوب الطارئة كآثار الحروق والحوادث وزراعة الجلد وإعادة تشكيل الثدي بعد الاستئصال أو عند المرضية وزراعة الشعر عند سقوطه خاصة للمرأة، وإزالة دمامة تسبب أذى نفسيًا أو عضويًا — بالإحالة لقرار 26 ⁦(1/4)⁩)⁩؛ ولا يجوز إجراء الجراحة التحسينية التي لا تدخل في العلاج الطبي وقصدها تغيير الخلقة السوية تبعًا للهوى والتقليد."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007). It defined cosmetic surgery as surgery improving the shape of visible parts of the body or restoring a function affected by a disorder, and set conditions: achieving a legally recognised benefit such as restoring function, repairing a defect, returning the body to its original form; harm not exceeding benefit, judged by trusted specialists; performance by a qualified specialist, failing which he is liable per resolution 142 (15/8); the patient's consent; informed disclosure of expected risks; no less invasive therapeutic route existing; no resulting breach of legal texts (it cites the hadiths on tattooing, plucking, teeth-filing and altering creation, and the prohibitions on resemblance); and observance of the rules of medical practice on seclusion and exposure except for necessity or need. It ruled: necessary and need-level cosmetic surgery is permissible — restoring organs to their created state, restoring function, repairing congenital defects (cleft lip, severe nasal deviation, birthmarks, supernumerary fingers and teeth, fused digits where they cause physical or moral harm), repairing acquired defects (burns and accident scars, skin grafts, breast reconstruction after mastectomy or for pathological size, hair transplantation especially for women), and removing disfigurement causing psychological or physical harm (with reference to resolution 26 (1/4)); while beautification surgery not entering medical treatment, aimed at altering sound creation following desire and imitation, is impermissible."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں۔ اس نے کاسمیٹک سرجری کی تعریف کی: وہ سرجری جو جسم کے ظاہر حصوں کی شکل سنوارے یا کسی خرابی سے متاثر فنکشن واپس کرے؛ اور شرائط مقرر کیں: شرعی معتبر مصلحت جیسے فنکشن کی واپسی، عیب کی اصلاح اور خلقتِ اصل کی بازیافت؛ نقصان مصلحت سے بڑھ نہ جائے اور فیصلہ قابلِ اعتماد ماہرین کریں؛ کارروائی مستعد ماہر معالج کرے ورنہ قرارداد 142 ⁦(15/8)⁩ کے تحت ذمہ داری ہو؛ مریض کی اجازت؛ متوقع خطرات و پیچیدگیوں کی باخبر وضاحت؛ جسم پر کم اثر والا دوسرا علاجی راستہ نہ ہو؛ نصوص کی خلاف ورزی نہ ہو ⁦(اس نے گودنے، بال اکھاڑنے، دانت تراشنے اور خلقت بدلنے اور منع کردہ مشابہتوں سے متعلق احادیث کا حوالہ دیا)⁩؛ اور خلوت اور ستر کھولنے کے طبی قواعد کی رعایت سوائے ضرورت یا حاجت کے۔ فیصلے: ضروری اور حاجت کی کاسمیٹک سرجری جائز — اعضا کو خلقت پر واپس لانا، فنکشن بحال کرنا، پیدائشی عیوب کی اصلاح ⁦(کھنڈوا ہونٹ، شدید ناک کی ٹیڑھی، ماس، اضافی انگلیاں و دانت اور ملے ہوئے انگلیاں جب مادی یا معنوی تکلیف دیں)⁩، حاصل شدہ عیوب کی اصلاح ⁦(جلنے اور حادثوں کے نشانات، جلد کی پیوندکاری، مستیکٹمی کے بعد چھاتی کی بازسازی یا مریضانہ حجم کی صورت میں، بالوں کی پیوندکاری بالخصوص خواتین)⁩ اور ایسی بدصورتی کا ازالہ جو نفسیاتی یا جسمانی تکلیف دے ⁦(قرارداد 26 ⁦(1/4)⁩ کا حوالہ)⁩؛ جب کہ وہ خوبصورتی سرجری جو طبی علاج میں داخل نہ ہو اور سہی خلقت کو خواہش اور تقلید کی پیروی میں بدلنے کے لیے ہو، ناجائز ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Juqh Islámico en su 18.ª sesión en Putrajaya (24-29 de Jumada al-Akhira 1428, 9-14 de julio de 2007). Definió la cirugía estética como la cirugía que mejora la forma de partes visibles del cuerpo o restaura una función afectada por un trastorno, y estableció condiciones: lograr un beneficio legalmente reconocido, como restaurar la función, reparar un defecto, devolver el cuerpo a su forma original; que el daño no exceda el beneficio, juzgado por especialistas de confianza; que sea realizada por un especialista cualificado, de lo contrario será responsable según la resolución 142 (15/8); el consentimiento del paciente; divulgación informada de los riesgos esperados; que no exista una vía terapéutica menos invasiva; que no haya una violación resultante de los textos legales (cita los hadices sobre tatuajes, depilación, limado de dientes y alteración de la creación, y las prohibiciones sobre la semejanza); y la observancia de las reglas de la práctica médica sobre aislamiento y exposición excepto por necesidad o requerimiento. Dictaminó: la cirugía estética necesaria y justificada es permisible: restaurar órganos a su estado original, restaurar la función, reparar defectos congénitos (labio hendido, desviación nasal grave, marcas de nacimiento, dedos y dientes supernumerarios, dedos fusionados cuando causan daño físico o moral), reparar defectos adquiridos (quemaduras y cicatrices de accidentes, injertos de piel, reconstrucción mamaria después de una mastectomía o por tamaño patológico, trasplante de cabello, especialmente para mujeres) y eliminar desfiguraciones que causen daño psicológico o físico (con referencia a la resolución 26 (1/4)); mientras que la cirugía de embellecimiento que no entra dentro del tratamiento médico, destinada a alterar la creación sana siguiendo el deseo y la imitación, es inadmisible."
