id: work/fatwa-amja-prostate-madhy-excuse
class: work
kind: fatwa
label: { ar: "احتقان البروستاتا والمذي", en: "Prostate congestion and recurring madhy — the excuse-holder's rule", ur: "پروسٹیٹ اور مذی — عذر والوں کا حکم", es: "Congestión prostática y diarrea recurrente: la regla del que siempre encuentra una excusa.", fr: "Congestion de la prostate et crises de folie récurrentes — la règle de l'excuse facile" }
summary:
  ar: "سأل شاب مصاب باحتقان في البروستاتا يودي إلى خروج مذي متقطع. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80865 بتاريخ 25 يناير 2010)⁩ أن أصحاب الأعذار ممن يدوم نزول المذي منهم على فترات متقطعة على النحو المذكور ينظر في أمرهم فإن انضبط لهم وقت لا تنزل فيه هذه السوائل ويتمكنون معه من أداء الصلاة انتظروا ذلك الوقت وإلا توضئوا لكل صلاة وأدوا وما نزل بعد الوضوء فلا يضر على ما فصّل الجواب من أحكام أصحاب السلس."
  en: "A young man with prostate congestion described recurring madhy discharge. Dr. Salah al-Sawi (fatwa no. 80865, 25 January 2010) answered that people of excuses whose fluids descend intermittently are looked at case by case: if a time can be fixed in which the fluids do not descend and prayer can be performed, they wait for it; else they do wudu for each prayer and perform it — what descends after the wudu does no harm. The answer details the rulings of incontinence-holders."
  ur: "پروسٹیٹ کی وجہ سے مذی بار بار نکلتی ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80865، 25 جنوری 2010)⁩ کے مطابق عذر والا ہر نماز کے وقت وضو کرے؛ بعد کے نزول سے صلاة ٹھیک۔"
  es: "Un joven con congestión prostática describió una secreción de madhy recurrente. El Dr. Salah al-Sawi (fatwa n.° 80865, 25 de enero de 2010) respondió que las personas con excusas, cuya secreción desciende intermitentemente, deben ser evaluadas caso por caso: si se puede fijar un momento en el que la secreción no descienda y se pueda realizar la oración, deben esperar; de lo contrario, deben realizar la ablución (wudu) antes de cada oración y llevarla a cabo; lo que desciende después de la ablución no causa daño. La respuesta detalla las normas para quienes padecen incontinencia."
  fr: "Un jeune homme souffrant de congestion de la prostate a décrit des écoulements urinaires intermittents. Le Dr Salah al-Sawi (fatwa n° 80865, 25 janvier 2010) a répondu que les personnes incontinentes dont les écoulements sont intermittents sont examinées au cas par cas: si un moment peut être fixé où les écoulements ne se produisent pas et où la prière peut être accomplie, elles attendent ce moment; sinon, elles font leurs ablutions avant chaque prière et l’accomplissent – les écoulements survenant après les ablutions ne sont pas préjudiciables. La réponse détaille les règles concernant les personnes incontinentes."
