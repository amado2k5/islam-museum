summary:
  ar: "كتاب المغازي لموسى بن عقبة المدني ⁦(ت 141هـ)⁩، يذكره أهل العلم بأنه أقدم مصنف مستقل في مغازي النبي، وقد نقل ابن إسحاق وابن هشام عنه في السيرة. سُجلت هويته هنا لئلا تختلط بمصنف الواقدي اللاحق الذي يحمل العنوان نفسه."
  en: "Kitab al-Maghazi by Musa ibn Uqba al-Madani (d. 141 AH), regarded by many scholars as the earliest monograph on the Prophet's campaigns; Ibn Ishaq and Ibn Hisham drew on it in the Sira. Recorded here so its identity stays distinct from al-Waqidi's later work of the same title."
