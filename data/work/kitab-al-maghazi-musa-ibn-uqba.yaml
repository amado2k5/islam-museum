summary:
  ar: "كتاب المغازي لموسى بن عقبة المدني ⁦(ت 141هـ)⁩، يذكره أهل العلم بأنه أقدم مصنف مستقل في مغازي النبي، وقد نقل ابن إسحاق وابن هشام عنه في السيرة. سُجلت هويته هنا لئلا تختلط بمصنف الواقدي اللاحق الذي يحمل العنوان نفسه."
  en: "Kitab al-Maghazi by Musa ibn Uqba al-Madani (d. 141 AH), regarded by many scholars as the earliest monograph on the Prophet's campaigns; Ibn Ishaq and Ibn Hisham drew on it in the Sira. Recorded here so its identity stays distinct from al-Waqidi's later work of the same title."
  es: "El Kitab al-Maghazi de Musa ibn Uqba al-Madani (fallecido en el año 141 de la Hégira), considerado por muchos eruditos como la monografía más antigua sobre las campañas del Profeta, fue utilizado por Ibn Ishaq e Ibn Hisham en su Sira. Se incluye aquí para preservar su identidad y diferenciarla de la obra posterior de al-Waqidi con el mismo título."
  fr: "Le Kitab al-Maghazi de Musa ibn Uqba al-Madani (mort en 141 AH), considéré par de nombreux érudits comme la première monographie consacrée aux campagnes du Prophète, a servi de référence à Ibn Ishaq et Ibn Hisham dans leur Sira. Il est reproduit ici afin de le distinguer de l'ouvrage ultérieur d'al-Waqidi portant le même titre."
