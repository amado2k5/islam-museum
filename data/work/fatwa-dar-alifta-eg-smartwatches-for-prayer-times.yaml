id: work/fatwa-dar-alifta-eg-smartwatches-for-prayer-times
class: work
kind: fatwa
label: { ar: "حكم الاعتماد على الساعات الذكية في تحديد أوقات الصلاة", en: "Relying on smartwatches and devices for prayer times", ur: "نماز کے اوقات کے لیے سمارٹ گھڑیوں پر اعتماد", es: "Dependencia de relojes inteligentes y dispositivos para los horarios de oración", fr: "S'appuyer sur les montres connectées et autres appareils pour les heures de prière", tr: "Namaz zamanlarının belirlenmesinde akıllı saatlere güvenilmesine ilişkin karar", id: "Putusan tentang penggunaan jam tangan pintar untuk menentukan waktu salat" }
summary:
  ar: "سائل سأل عن الاعتماد على الساعات الذكية والأجهزة الإلكترونية في تحديد أوقات الصلاة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21036)⁩ أنه يجوز الاعتماد على تلك التقنيات الحديثة متى أجيزت من قبل المختصين وكانت مضبوطة وفق توقيت بلد مستخدمها على ما فصّل الجواب."
  en: "A questioner asked about relying on smartwatches and electronic devices for determining prayer times. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21036) answered that relying on the modern technologies is permitted once approved by specialists and set to the user's locale — as the answer details."
  ur: "ایک سائل نے نماز کے اوقات کے لیے سمارٹ گھڑیوں اور الیکٹرانک آلات پر بھروسے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21036)⁩ نے جواب دیا کہ ماہرین کی منظوری اور مقامی اوقات کی ترتیب کے ساتھ یہ جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre la conveniencia de utilizar relojes inteligentes y dispositivos electrónicos para determinar los horarios de oración. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21036) respondió que el uso de las tecnologías modernas está permitido una vez aprobado por especialistas y configurado según la ubicación del usuario, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant l'utilisation des montres connectées et autres appareils électroniques pour déterminer les heures de prière. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21036) a répondu que le recours à ces technologies modernes est autorisé une fois approuvé par des spécialistes et configuré selon le fuseau horaire de l'utilisateur, comme le précise la réponse."
  tr: "Bir soru soran kişi, namaz vakitlerini belirlemek için akıllı saatlere ve elektronik cihazlara güvenilmesini sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21036), bu modern teknolojilerin uzmanlar tarafından onaylandığı ve ülkelerinin zamanına göre kontrol edildiği durumlarda güvenilmesinin mümkün olduğunu yanıtladı; bu durum cevapta detaylandırıldı."
  id: "Seorang penanya menanyakan tentang ketergantungan pada jam tangan pintar dan perangkat elektronik untuk menentukan waktu shalat. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21036) menjawab bahwa diperbolehkan mengandalkan teknologi modern ini jika disetujui oleh para ahli dan dikendalikan sesuai dengan waktu negara mereka, sebagaimana dijelaskan dalam jawaban."
