label: { ar: "الخيط الأبيض من الخيط الأسود", en: "The white thread and the black thread — al-Baqara 187 explained", ur: "سفید اور سیاہ دھاگے — بقرہ 187 کی شرح", es: "El hilo blanco y el hilo negro — explicado en al-Baqara 187", fr: "Le fil blanc et le fil noir — al-Baqara 187 expliqué", tr: "Siyah ipliğin beyaz ipliği", id: "Benang putih dari benang hitam" }
summary:
  ar: "سأل سائل توضيح قصتين منها قصة الرجل الذي تأول آية حتى يتبين لكم الخيط الأبيض من الخيط الأسود. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77627 بتاريخ 30 يناير 2009)⁩ بتلاوة الآية التي أحلت في ليلة الصيام الرفث إلى النساء وأباحت الأكل والشرب حتى يتبين الخيط الأبيض من الخيط الأسود من الفجر ثم أتموا الصيام إلى الليل، وشرح معناها نقلاً عن الحافظ ابن كثير فالخيط الأبيض هو ضوء الصبح والخيط الأسود ظلمة الليل."
  en: "A questioner asked to explain two stories, the first the Companion who read the 'white thread and black thread' verse. Dr. Salah al-Sawi (fatwa no. 77627, 30 January 2009) recited al-Baqara 187 — permitting conjugal approach on fasting nights and eating and drinking 'until the white thread is distinct from the black thread, of dawn; then complete the fast till night' — and explained with al-Hafiz Ibn Kathir that the white thread is the light of dawn and the black thread the darkness of night, as the answer details."
  ur: "ایک سائل نے سفید اور سیاہ دھاگے والی آیت کی شرح پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77627، 30 جنوری 2009)⁩ نے بقرہ 187 تلاوت کر کے ابن کثیر سے نقل کیا کہ سفید دھاگا صبح کی روشنی اور سیاہ دھاگا رات کی تاریکی ہے۔"
  es: "Un consultante pidió que se explicaran dos historias, la primera sobre el Compañero que leyó el versículo del \"hilo blanco y el hilo negro\". El Dr. Salah al-Sawi (fatwa n.º 77627, 30 de enero de 2009) recitó al-Baqara 187, que permite el acercamiento conyugal en las noches de ayuno y comer y beber \"hasta que el hilo blanco se distinga del hilo negro del amanecer; entonces se completa el ayuno hasta la noche\", y explicó junto con al-Hafiz Ibn Kathir que el hilo blanco es la luz del amanecer y el hilo negro la oscuridad de la noche, como se detalla en la respuesta."
  fr: "Un internaute a demandé l'explication de deux récits, le premier concernant le Compagnon qui a lu le verset du « fil blanc et du fil noir ». Le Dr Salah al-Sawi (fatwa n° 77627, 30 janvier 2009) a cité al-Baqara 187, autorisant les contacts conjugaux les nuits de jeûne, ainsi que la consommation de nourriture et de boisson « jusqu'à ce que le fil blanc se distingue du fil noir, signe de l'aube; puis compléter le jeûne jusqu'à la nuit ». Il a ensuite expliqué, en accord avec al-Hafiz Ibn Kathir, que le fil blanc représente la lumière de l'aube et le fil noir l'obscurité de la nuit, comme le précise la réponse."
  tr: "Bir soru soran kişi, beyaz ipliği siyah iplikten ayırt etmek için bir ayeti yorumlayan adamın hikayesi de dahil olmak üzere iki hikayenin açıklamasını istedi. Dr. Salah Al-Sawy (30 Ocak 2009 tarihli 77627 sayılı fetva) oruç gecesi kadınlarla cinsel ilişkiye izin veren ve şafak vakti beyaz iplik siyah iplikten ayırt edilene kadar ye-içme hakkı veren ayeti okuyarak cevap verdi; ardından orucu geceye kadar tamamladılar. Açıklamasının anlamını El-Hafız İbn Kathir'den alıntı yaparak açıkladı: Beyaz iplik sabahın ışığı, siyah ip ise gecenin karanlığıdır."
  id: "Seorang penanya meminta klarifikasi dua cerita, termasuk kisah seorang pria yang menafsirkan sebuah ayat sehingga benang putih dapat dibedakan dari benang hitam. Dr. Salah Al-Sawy menjawab (Fatwa No. 77627 tanggal 30 Januari 2009) dengan membacakan ayat yang mengizinkan hubungan seksual dengan wanita pada malam puasa dan mengizinkan makan dan minum sampai benang putih dibedakan dari benang hitam saat fajar, lalu mereka menyelesaikan puasa hingga malam. Ia menjelaskan maknanya dengan mengutip Al-Hafiz Ibn Kathir: Benang putih adalah cahaya pagi dan benang hitam adalah kegelapan malam."
