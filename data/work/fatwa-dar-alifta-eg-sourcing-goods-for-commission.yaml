summary:
  ar: "سائل سأل عن توفير سلعة معينة لشركة مقابل نسبة من قيمة السلعة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21667)⁩ أن توفير سلعة معينة لشركة مقابل نسبة من قيمتها جائز شرعًا ولا حرج فيه وهو من قبيل الجعالة المشروعة على ما فصّل الجواب."
  en: "A questioner asked about sourcing a specific commodity for a company in return for a percentage of its value. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21667) answered that it is lawful with no harm — a form of the legal ju'ala contract — as the answer details."
  ur: "ایک سائل نے کمپنی کے لیے کوئی سامان مہیا کرنے اور اس کی قیمت کا فیصد لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21667)⁩ نے جواب دیا کہ یہ جائز ہے اور جعالہ عقد کی صورت ہے — جیسا کہ جواب میں تفصیل ہے۔"
