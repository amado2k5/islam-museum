id: work/fatwa-dar-alifta-eg-pricing-udhiyya-by-meat-weight
class: work
kind: fatwa
label: { ar: "حكم تحديد ثمن الأضحية بوزن لحمها بعد الذبح", en: "Pricing the udhiyya by the weight of its meat after slaughter", ur: "ذبح کے بعد گوشت کے وزن سے قربانی کی قیمت", es: "El precio del udhiyya se calcula en función del peso de su carne después del sacrificio.", fr: "Le prix de l'udhiyya est déterminé par le poids de sa viande après l'abattage.", tr: "Bir kurbanın fiyatının, kesim sonrası etin ağırlığına göre belirlenmesine ilişkin karar", id: "Keputusan tentang penentuan harga pengorbanan berdasarkan berat dagingnya setelah disembelih" }
summary:
  ar: "سائل سأل عن شراء الأضحية بوزنها لحمًا بعد الذبح. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20829)⁩ أنه لا يجوز شرعًا شراء الأضحية بوزنها لحمًا بعد الذبح بل يشترط ملك المضحي لها قبل الذبح على ما فصّل الجواب."
  en: "A questioner asked about buying the udhiyya by its weight in meat after slaughter. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20829) answered that this is not lawful; the sacrificer must own it before slaughter — as the answer details."
  ur: "ایک سائل نے ذبح کے بعد گوشت کے وزن سے قربانی خریدنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20829)⁩ نے جواب دیا کہ یہ جائز نہیں بلکہ ذبح سے پہلے اس کی ملکیت شرط ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de comprar la udhiyya por su peso en carne después del sacrificio. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20829) respondió que esto no es lícito; el sacrificador debe ser su propietario antes del sacrificio, como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il était permis d'acheter l'udhiyya au poids de sa viande après l'abattage. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20829) a répondu que cela n'est pas licite; le sacrificateur doit en être le propriétaire avant l'abattage, comme le précise la réponse."
  tr: "Bir soru soran kişi, kurbanın kesimden sonra et olarak ağırlığına göre satın alınmasını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20829), kurbanın kesim sonrası et olarak ağırlığına göre satın alınmasının dini olarak kabul edilmediğini; aksine, kurbanı kesimden önce sahipliğinin gerekli olduğunu, cevabda açıklandığı gibi yanıtladı."
  id: "Seorang penanya bertanya tentang membeli kurban berdasarkan beratnya sebagai daging setelah disembelih. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20829) menjawab bahwa secara agama tidak diperbolehkan membeli korban berdasarkan beratnya sebagai daging setelah disembelih; melainkan, kepemilikan pengorbanan diperlukan sebelum penyembelihan, seperti yang dijelaskan dalam jawaban."
