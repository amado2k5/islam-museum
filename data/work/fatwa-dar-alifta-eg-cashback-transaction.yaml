label: { ar: "حكم معاملة الكاش باك", en: "The ruling on cashback offers", ur: "کیش بیک کا حکم", es: "La resolución sobre las ofertas de reembolso", fr: "La décision concernant les offres de cashback", tr: "Nakit iade işlemlerine ilişkin karar", id: "Keputusan tentang transaksi cashback" }
summary:
  ar: "سائل سأل عن الحصول على مبلغ مالي من عرض الكاش باك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21509)⁩ أن الحصول على مبلغ مالي من عرض الكاش باك هو من قبيل الهبة المشروعة والجهالة وإن كانت حاصلة فيما سيحصل عليه المرء منه فهي جهالة يسيرة لا تضر على ما فصّل الجواب."
  en: "A questioner asked about receiving a sum of money from a cashback offer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21509) answered that receiving it falls under lawful gift; the uncertainty over the eventual amount is slight and harmless — as the answer details."
  ur: "ایک سائل نے کیش بیک آفر سے رقم حاصل کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21509)⁩ نے جواب دیا کہ یہ جائز ہدیہ کی قسم میں ہے؛ رقم کی معمولی غیر یقینیت مضر نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre la posibilidad de recibir una suma de dinero a través de una oferta de reembolso. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21509) respondió que recibirla se considera una donación lícita; la incertidumbre sobre la cantidad final es mínima e inofensiva, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la réception d'une somme d'argent dans le cadre d'une offre de remboursement. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21509) a répondu que cette réception relève du don licite; l'incertitude quant au montant final est minime et sans conséquence, comme le précise la réponse."
  tr: "Bir soru soran kişi, nakit iadesi teklifinden bir miktar para almayı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21509), nakit iadesi teklifinden para almanın meşru bir hediye ve cehalet olduğunu, eğer bu para alınacaklardan elde ediliyorsa, cevabın verdiği bilgiye zarar vermediğini söyledi."
  id: "Seorang penanya bertanya tentang menerima sejumlah uang dari penawaran cashback. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21509) menjawab bahwa memperoleh sejumlah uang dari penawaran cashback adalah hadiah yang sah dan ketidaktahuan, dan jika diperoleh dari apa yang akan diterima, maka ketidaktahuan kecil tidak merugikan apa yang dijelaskan dalam jawaban."
