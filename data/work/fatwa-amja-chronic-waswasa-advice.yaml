id: work/fatwa-amja-chronic-waswasa-advice
class: work
kind: fatwa
label: { ar: "الوسوسة العابرة والشبهة المستقرة", en: "The passing whisper and the settled doubt", ur: "عارضی وسوسہ اور مستقل شبہ", es: "El susurro fugaz y la duda establecida", fr: "Le murmure passager et le doute installé", tr: "Geçici takıntı ve istikrarlı şüphe", id: "Obsesi sementara dan kecurigaan stabil" }
summary:
  ar: "سأل موسوس يعتقد أو يقول شيئًا خطيرًا على الإيمان ولا يدري أكان وسوسة أم قصده. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77887 بتاريخ 19 فبراير 2009)⁩ أنه قد أجابه على هذا السؤال من قبل ونصحه أن يرفق بنفسه ولا يرهقها عسرًا، فما يمر به من وسوسة عابرة يطرحها عنه ولا يلتفت إليها ولا يسترسل معها ويقول الحمد لله الذي رد كيده إلى الوسوسة، فإن تحولت إلى حالة قارة مستوطنة بحث عن علاجها عند من يعرف من الربانيين من أهل العلم وحملة الشريعة."
  en: "A chronic whisperer — unsure whether the grave thoughts against faith he entertained or uttered were whispering or meant — asked what to do. Dr. Salah al-Sawi (fatwa no. 77887, 19 February 2009) answered that he had answered him before: be gentle with yourself and do not weary it with hardship; passing whispers — cast them off, give them no heed and do not indulge them, saying 'praise God who turned his plot into whispering'; if they become a settled established state, seek their cure with the godly among the scholars and bearers of the sharia he knows."
  ur: "ایک موسوس سائل کو خطرناک خیالات آتے تھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77887، 19 فروری 2009)⁩ کے مطابق عارضی وسوسے کو نظرانداز کرے؛ مستقل شبہ ہو تو علماء ربانیوں سے علاج مانگے۔"
  es: "Un murmurador crónico —sin estar seguro de si los graves pensamientos contrarios a la fe que albergaba o expresaba eran susurros o pensamientos reales— preguntó qué debía hacer. El Dr. Salah al-Sawi (fatwa n.° 77887, 19 de febrero de 2009) respondió que ya le había respondido antes: sé amable contigo mismo y no te agobies con dificultades; si son susurros pasajeros, deséchalos, no les prestes atención y no te dejes llevar por ellos, diciendo: «¡Alabado sea Dios que convirtió su plan en un susurro!»; si se convierten en un estado establecido, busca su cura con los piadosos entre los eruditos y portadores de la sharia que conoce."
  fr: "Un homme, en proie à des pensées insidieuses et incertain de la nature de ses propos – murmures ou intentionnels – demanda conseil. Le Dr Salah al-Sawi (fatwa n° 77887, 19 février 2009) répondit qu'il lui avait déjà donné cette réponse: soyez indulgent envers vous-même et ne vous accablez pas de souffrances; pour les pensées insidieuses passagères, ignorez-les, ne leur prêtez aucune attention et ne vous y attardez pas, en disant: « Loué soit Dieu qui a transformé ses desseins en murmures »; si elles s'installent durablement, qu'il cherche un remède auprès des savants et des autorités religieuses qu'il connaît."
  tr: "İnanç veya inanç açısından tehlikeli bir şey söyleyen bir inanana sordu; bunun bir fısıltı mı yoksa sadece bir niyet mi olduğunu bilmiyordu. Dr. Salah Al-Sawy (19 Şubat 2009 tarihli 77887 No. Fetva) bu soruyu daha önce yanıtladığını ve kendine karşı nazik olmasını, onu zorlukla yüklememesini tavsiye ettiğini söyledi. Ne kadar geçici fısıltılar yaşarsa yaşasın, onu önemsemez, devam etmez ve şöyle der: 'Komplosunu tekrar fısıltıya çeviren Allah'a şükür. Eğer kıta yerleşik hale gelirse, ilahi alimler ve kanun taşıyıcıları arasında bilenlerden çare arar.'"
  id: "Ia bertanya kepada seorang mukmin yang percaya atau mengatakan sesuatu yang berbahaya bagi iman dan tidak tahu apakah itu hanya bisikan atau sekadar niat. Dr. Salah Al-Sawy menjawab (Fatwa No. 77887 tanggal 19 Februari 2009) bahwa ia telah menjawab pertanyaan ini sebelumnya dan menasihatinya untuk bersikap lembut pada dirinya sendiri dan tidak membebani dengan kesulitan. Apapun bisikan singkat yang ia alami, ia abaikan dan tidak memperhatikannya atau melanjutkan, sambil berkata, 'Puji bagi Tuhan yang mengubah rencananya kembali menjadi bisikan. Jika itu berubah menjadi benua yang menetepi, ia mencari solusinya dari mereka yang mengetahui di antara para sarjana dan pembawa hukum ilahi.'"
