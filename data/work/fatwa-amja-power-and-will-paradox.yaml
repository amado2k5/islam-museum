id: work/fatwa-amja-power-and-will-paradox
class: work
kind: fatwa
label: { ar: "القدرة والإرادة", en: "God's power over all things — will and power together", ur: "قدرت اور ارادہ — دونوں کا امتزاج", es: "El poder de Dios sobre todas las cosas: voluntad y poder juntos.", fr: "La puissance de Dieu sur toutes choses — volonté et puissance unies", tr: "Yetenek ve İrade Gücü", id: "Kemampuan dan Kekuatan Kemauan" }
summary:
  ar: "سأل سائل عن مسألة قدرة الله على كل شيء وما يثار حولها من إشكالات. أجابت القسم الشرعي بالموقع ⁦(فتوى رقم 21724 بتاريخ 5 فبراير 2008)⁩ أن الله قادر على كل شيء بشرط أن يكون هذا الشيء مرادًا لله لأن الفعل يقع بالإرادة والقدرة فالقدرة وحدها لا تكفي لوقوع الفعل إذا كان صاحبها غير مريد له وكذلك الإرادة وحدها لا تكفي لوقوع الفعل إذا كان صاحبها غير قادر عليه فلابد من توافق الإرادة والقدرة."
  en: "A questioner raised the puzzle of God's power over all things and the problems built on it. The site's sharia department (fatwa no. 21724, 5 February 2008) answered that God is able to do all things — provided the thing is willed by God, since an act takes place by will and power together: power alone does not suffice if its owner does not will the act, nor will alone if its owner lacks power; will and power must concur."
  ur: "ایک سائل نے قدرت مطلقہ کے اشکال پوچھے۔ شریعت شعبے ⁦(فتویٰ 21724، 5 فروری 2008)⁩ کے مطابق اللہ ہر چیز پر قادر ہے بشرط اس کا ارادہ ہو — فعل ارادہ اور قدرت دونوں کے امتزاج سے واقع ہوتا ہے۔"
  es: "Un usuario planteó la incógnita del poder de Dios sobre todas las cosas y los problemas que de ello se derivan. El departamento de la sharia del sitio (fatwa n.º 21724, del 5 de febrero de 2008) respondió que Dios es capaz de hacer todas las cosas, siempre que sean voluntad suya, puesto que un acto se realiza mediante la voluntad y el poder conjuntamente: el poder por sí solo no basta si quien lo posee no quiere realizar el acto, ni la voluntad por sí sola si quien lo posee carece de poder; la voluntad y el poder deben concurrir."
  fr: "Un internaute a soulevé la question du pouvoir absolu de Dieu sur toute chose et les problèmes qui en découlent. Le département de la charia du site (fatwa n° 21724, 5 février 2008) a répondu que Dieu est capable de tout, pourvu que cela soit voulu par Lui, car un acte résulte de la volonté et de la puissance conjointes: la puissance seule ne suffit pas si son détenteur ne veut pas accomplir l’acte, ni la volonté seule si son détenteur est dépourvu de puissance; la volonté et la puissance doivent donc s’unir."
  tr: "Bir soruya Allah'ın her şey üzerindeki gücü ve bununla ilgili ortaya çıkan meseleler hakkında sorular soruldu. Web sitesindeki Şeriat bölümü (5 Şubat 2008 tarihli Fetva No. 21724) Allah'ın her şeye qadir olduğu, ancak bu şeyin Allah tarafından niyetle yapıldığı için irade ve güçle yapıldığı yanıtını verdi. Sahibi istemiyorsa eylemin gerçekleşmesi için yalnızca güç yeterli değildir; aynı şekilde, sahibi yapamıyorsa eylemin gerçekleşmesi için tek irade yeterli değildir, bu yüzden irade ile güç arasında bir uyum olmalıdır."
  id: "Seorang penanya ditanya tentang masalah kemampuan Allah atas segala sesuatu dan isu-isu yang muncul di sekitarnya. Bagian Syariah di situs web (Fatwa No. 21724 tanggal 5 Februari 2008) menjawab bahwa Allah mampu melakukan segalanya, asalkan hal itu dikehendaki oleh Allah, karena perbuatan dilakukan dengan kehendak dan kekuasaan. Kekuasaan saja tidak cukup untuk melakukan perbuatan jika pemiliknya tidak menginginkannya, dan demikian pula, kehendak saja tidak cukup untuk tindakan itu terjadi jika pemiliknya tidak mampu melakukannya, sehingga harus ada kesesuaian antara kehendak dan kekuasaan."
