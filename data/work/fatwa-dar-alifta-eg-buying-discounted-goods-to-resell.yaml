id: work/fatwa-dar-alifta-eg-buying-discounted-goods-to-resell
class: work
kind: fatwa
label: { ar: "حكم شراء السلع المخفضة ثم بيعها بسعر أعلى", en: "Buying discounted goods then reselling above the purchase price", ur: "رعایتی سودا خرید کر مہنگے دام فروخت کرنا", es: "Comprar productos con descuento y luego revenderlos por encima del precio de compra.", fr: "Acheter des marchandises à prix réduit puis les revendre à un prix supérieur au prix d'achat", tr: "İndirimli malların satın alınıp daha yüksek fiyata satılmasına ilişkin karar", id: "Putusan tentang pembelian barang diskon lalu menjualnya dengan harga lebih tinggi" }
summary:
  ar: "سائل سأل عن الاستفادة بالخصومات المقدمة من بعض الشركات للعاملين بها بشراء السلع ثم بيعها بسعر أعلى. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21646)⁩ أنه لا مانع شرعًا من الاستفادة بتلك الخصومات ولا يقدح ذلك في جواز المعاملة على ما فصّل الجواب."
  en: "A questioner asked about benefiting from employee discounts offered by companies — buying goods and reselling at a higher price. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21646) answered there is no legal objection to benefiting from those discounts and it does not impugn the transaction's lawfulness."
  ur: "ایک سائل نے کمپنیوں کی ملازم رعایت سے فائدہ اٹھا کر سودا خرید کر مہنگے دام بیچنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21646)⁩ نے جواب دیا کہ اس رعایت سے فائدہ اٹھانے میں کوئی شرعی مانع نہیں اور اس سے معاملے کی جوازیت متاثر نہیں ہوتی۔"
  es: "Un consultante preguntó sobre la conveniencia de aprovechar los descuentos para empleados que ofrecen las empresas, comprando productos para revenderlos a un precio más alto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21646) respondió que no existe ninguna objeción legal a beneficiarse de esos descuentos y que esto no invalida la legalidad de la transacción."
  fr: "Un internaute a posé une question concernant le fait de bénéficier de remises accordées aux employés par les entreprises – en achetant des biens et en les revendant à un prix plus élevé. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21646) a répondu qu'il n'y a aucune objection légale à bénéficier de ces remises et que cela ne remet pas en cause la licéité de la transaction."
  tr: "Bir soru soran kişi, bazı şirketlerin çalışanlarına sunduğu indirimlerden mal satın alıp daha yüksek fiyata satarak nasıl faydalanabileceklerini sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21646), bu indirimlerden yararlanmanın dini bir itirazı olmadığını ve bunun işlemin izin edilebilirliğini zayıflatmadığını belirtti; bu da yanıtta detaylandırılmıştır."
  id: "Seorang penanya menanyakan tentang keuntungan dari diskon yang ditawarkan beberapa perusahaan kepada karyawannya dengan membeli barang lalu menjualnya dengan harga lebih tinggi. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21646) menjawab bahwa tidak ada keberatan agama untuk mendapatkan diskon ini, dan hal ini tidak mengurangi kelayakan transaksi sebagaimana dijelaskan dalam jawaban."
