id: work/fatwa-aliftaa-jo-taking-street-lights-from-public-places
class: work
kind: fatwa
label: { ar: "أخذ وحدات الإنارة من الشوارع والأماكن العامة", en: "Taking light fittings from streets and public places", ur: "سڑکوں اور عوامی مقامات سے روشنی کے یونٹ اتارنا" }
summary:
  ar: "سؤال عن أخذ وحدات الإنارة من الشوارع والأماكن العامة، أجابت فيه دائرة الإفتاء العام الأردنية بأن حرز وحدات الإنارة يكون بتركيبها في أماكنها المخصصة، فأخذها منها سرقة لأنها أخذت من حرز مثلها. أجابت الدائرة بأن السرقة من كبائر الذنوب، واستشهدت بـ[[passage/quran-5-38|سورة المائدة 5:38]] و[[passage/quran-4-29|سورة النساء 4:29]] و[[passage/quran-4-30|4:30]]، وقالت إنها توجب الحد إذا استوفت شروطه وتوجب الإثم، وإن الإثم لا يسقط وإن سقط الحد، ولا تصح التوبة إلا برد المسروق أو ضمان قيمته. ونقلت تعريف زكريا الأنصاري في أسنى المطالب (4/137) للسرقة بأنها أخذ المال خفية من حرز مثله بشروط، وقالت إن الأخذ من الحرز شرط لثبوت الحد، وإن الحرز يختلف باختلاف العرف والأموال وأحوال الناس والأوقات، ونقلت عن الخطيب الشربيني في الإقناع في حل ألفاظ أبي شجاع (2/535) أن المرجع في الحرز العرف، وذكر ضابط الغزالي بأنه ما لا يعد صاحبه مضيعًا له. وخلصت إلى أن إحراز وحدات الإنارة يكون بتركيبها في أماكنها المخصصة للإنارة، وأن أخذها من هذه الأماكن يعد سرقة لأنها أخذت من حرز مثلها."
  en: "A question about taking light fittings from streets and public places, in which Jordan's General Iftaa Department answered that light fittings are secured (in hirz) by being installed in the places designated for lighting, so taking them from there is theft, since they are taken from the kind of safekeeping appropriate to them. The Department answered that theft is a major sin, citing [[passage/quran-5-38|Surat al-Ma'ida 5:38]] and [[passage/quran-4-29|Surat al-Nisa' 4:29]]–[[passage/quran-4-30|30]]; it said theft incurs the prescribed penalty when its conditions are met and always incurs sin, the sin does not lapse even if the penalty does, and repentance is valid only by returning the stolen item or paying its value. It quoted Zakariyya al-Ansari's definition in Asna al-Matalib (4/137) of theft as secretly taking property from its appropriate place of safekeeping under conditions, said that taking from safekeeping is a condition for the penalty, and that safekeeping varies with custom, the kind of property, people's circumstances and the times, quoting al-Khatib al-Shirbini in al-Iqna' fi Hall Alfaz Abi Shuja' (2/535) that custom decides what counts as safekeeping, and mentioning al-Ghazali's criterion: a place where the owner would not be regarded as neglecting it. It concluded that light fittings are kept in safekeeping by being installed in their designated places, and taking them from there is theft because they are taken from the safekeeping appropriate to them."
  ur: "سڑکوں اور عوامی مقامات سے روشنی کے یونٹ اتارنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ روشنی کے یونٹوں کی حفاظت (حرز) ان کی مقررہ جگہوں پر تنصیب ہے، لہٰذا وہاں سے انہیں اتارنا چوری ہے کیونکہ وہ اپنے مناسب حرز سے لیے گئے۔ ڈیپارٹمنٹ نے جواب دیا کہ چوری کبیرہ گناہ ہے، اور [[passage/quran-5-38|سورۃ المائدہ 5:38]] اور [[passage/quran-4-29|سورۃ النساء 4:29]]–[[passage/quran-4-30|30]] کا حوالہ دیا؛ اس نے کہا کہ شرائط پوری ہوں تو اس پر حد ہے اور گناہ ہر حال میں ہے، حد ساقط ہو جائے تب بھی گناہ ساقط نہیں ہوتا، اور توبہ صرف چوری کا مال واپس کرنے یا اس کی قیمت کا ضامن بننے سے درست ہوتی ہے۔ اس نے اسنی المطالب (4/137) میں زکریا انصاری کی تعریف نقل کی کہ چوری مال کو اس کے مناسب حرز سے چھپ کر شرائط کے ساتھ لینا ہے، اور کہا کہ حد کے لیے حرز سے لینا شرط ہے، اور حرز عرف، مال کی نوعیت، لوگوں کے حالات اور زمانے کے ساتھ بدلتا ہے، اور الاقناع فی حل الفاظ ابی شجاع (2/535) میں خطیب شربینی سے نقل کیا کہ حرز کا مرجع عرف ہے، اور غزالی کا ضابطہ ذکر کیا کہ حرز وہ ہے جس میں مالک کو مال ضائع کرنے والا نہ سمجھا جائے۔ اس نے نتیجہ نکالا کہ روشنی کے یونٹوں کا حرز ان کی روشنی کے لیے مقررہ جگہوں پر تنصیب ہے، اور وہاں سے انہیں اتارنا چوری ہے کیونکہ وہ اپنے مناسب حرز سے لیے گئے۔"
