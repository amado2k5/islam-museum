id: work/fatwa-amja-al-batin-gods-acts
class: work
kind: fatwa
label: { ar: "هل أفعال الله تدخل في اسم الباطن", en: "Do God's acts fall under the name al-Batin", ur: "کیا اللہ کے افعال باطن نام میں آتے ہیں", es: "¿Los actos de Dios se engloban bajo el nombre de al-Batin?", fr: "Les actes de Dieu relèvent-ils du nom d'al-Batin ?" }
summary:
  ar: "سأل سائل هل أفعال الله تدخل في اسمه الباطن فنرى الإنسان يموت ولا نرى كيفية فعله. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77599 بتاريخ 27 يناير 2009)⁩ أن الله فعال لما يريد ولا تنفك أفعاله عن حكمته ويمضي قدره بالأسباب أو بدونها أو بنقيضها لا راد لقضائه ولا معقب لحكمه، وكل ما يتعلق بأسماء الله وصفاته لا علم لنا بكيفيته فنحن نعلم المعنى ونفوض الكيف إلى الله، وطلب منه الاشتغال بما ينفعه فكل مسألة لا ينبني عليها عمل فالخوض فيها من التكلف المنهي عنه."
  en: "A questioner asked whether God's acts fall under His name al-Batin — a man dies and we do not see how God did it. Dr. Salah al-Sawi (fatwa no. 77599, 27 January 2009) answered that God does what He wills, His acts never part from His wisdom, and He executes His decree through causes, without them or against them; none repels His judgment and none reviews His decree; everything touching God's names and attributes is known to us in meaning, its how consigned to God — then counselled him to busy himself with what benefits, since every question on which no action rests is the needless exertion we were forbidden."
  ur: "ایک سائل نے پوچھا کہ کیا اللہ کے افعال «باطن» نام میں آتے ہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77599، 27 جنوری 2009)⁩ کے مطابق اللہ جو چاہے کرتا ہے اور اس کے فیصلوں کی کونی ہمیں معلوم نہیں — معنی ہم جانتے ہیں اور کیفیت اللہ کے سپرد۔"
  es: "Un interlocutor preguntó si los actos de Dios se engloban bajo Su nombre al-Batin: un hombre muere y no vemos cómo Dios lo hizo. El Dr. Salah al-Sawi (fatwa n.º 77599, 27 de enero de 2009) respondió que Dios hace lo que quiere, Sus actos nunca se apartan de Su sabiduría, y ejecuta Su decreto a través de causas, sin ellas o en contra de ellas; nadie rechaza Su juicio y nadie revisa Su decreto; todo lo que concierne a los nombres y atributos de Dios nos es conocido en su significado, es como está encomendado a Dios. Luego le aconsejó que se ocupara de qué beneficios, ya que toda pregunta sobre la que no se basa ninguna acción es un esfuerzo innecesario que nos está prohibido."
  fr: "Un homme demanda si les actes de Dieu relèvent de Son nom al-Batin – un homme meurt et nous ne savons pas comment Dieu est intervenu. Le Dr Salah al-Sawi (fatwa n° 77599, 27 janvier 2009) répondit que Dieu fait ce qu'Il veut, que Ses actes sont toujours guidés par Sa sagesse et qu'Il exécute Son décret par la cause, sans elle ou contre elle; nul ne peut contester Son jugement ni remettre en cause Son décret; tout ce qui touche aux noms et attributs de Dieu nous est connu par sa signification, car cela relève de Sa volonté. Il lui conseilla ensuite de se concentrer sur les bienfaits que cela peut apporter, car toute question restée sans suite est un effort inutile qui nous est interdit."
