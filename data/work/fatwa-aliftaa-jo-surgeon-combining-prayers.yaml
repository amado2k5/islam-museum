id: work/fatwa-aliftaa-jo-surgeon-combining-prayers
class: work
kind: fatwa
label: { ar: "جمع الطبيب الجراح بين الصلاتين", en: "A surgeon combining two prayers", ur: "سرجن کا دو نمازیں جمع کرنا" }
summary:
  ar: "سؤال عن طبيب يجري عملية جراحية تستغرق ساعات، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجب عليه أداء الصلاة في وقتها ما أمكن، فإن تعذر ذلك خوفًا على المريض جاز له أن ينوي جمعها جمع تأخير. أجابت الدائرة بأن على المسلم المحافظة على الصلاة في وقتها ما أمكن، فإن أمكن الطبيب تأخير العملية أو الصلاة قبلها، أو بقي بعدها وقت يتسع للصلاة، حرم عليه التأخير. وإن تعذر ذلك فقد أجاز الفقهاء تقديم الصلاة أو تأخيرها للحاجة، أو عند خوف فوات واجب أو منفعة يطلب الشرع حفظها كالنفس والمال، ونقلت من حاشية الرملي على أسنى المطالب أن ذلك يجري في الاشتغال بإنقاذ الغريق ودفع الصائل. ونقلت من بغية المسترشدين أن الخطابي حكى عن أبي إسحاق جواز الجمع في الحضر للحاجة، وأن ابن المنذر قال به، ومن الإنصاف للحنابلة أن الجمع يجوز لمن له شغل أو عذر يبيح ترك الجمعة والجماعة. وخلصت إلى أن الطبيب إذا انشغل بالعملية وتعذر عليه أداء الصلاة في وقتها خوفًا على المريض جاز له أن ينوي جمعها تأخيرًا."
  en: "A question on a doctor performing surgery that lasts several hours, in which Jordan's General Iftaa Department answered that he must pray on time where possible, but if that is impossible for fear for the patient he may intend to combine the prayers by delaying the first. The Department answered that a Muslim must keep to praying on time as far as possible, so if the doctor can postpone the operation, pray before it, or will have time to pray after it, he may not delay the prayer. If that is impossible, jurists allow bringing a prayer forward or delaying it for need, or for fear of losing a duty or an interest the sharia protects, such as life or property; it quoted al-Ramli's gloss on Asna al-Matalib that this applies to someone busy rescuing a drowning person or fending off an attacker. It quoted Bughyat al-Mustarshidin that al-Khattabi reported from Abu Ishaq that combining while resident is allowed for need, a view also held by Ibn al-Mundhir, and the Hanbali al-Insaf that combining is allowed for anyone with an occupation or excuse that would permit missing the Friday or congregational prayer. It concluded that a doctor busy with an operation who cannot pray on time for fear for the patient may intend to combine the prayers by delay."
  ur: "کئی گھنٹے جاری رہنے والا آپریشن کرنے والے ڈاکٹر کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جہاں تک ممکن ہو نماز وقت پر پڑھنا لازم ہے، اور اگر مریض کے خوف سے یہ ممکن نہ ہو تو وہ جمعِ تاخیر کی نیت کر سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسلمان پر جہاں تک ممکن ہو نماز وقت پر پڑھنا لازم ہے، لہٰذا اگر ڈاکٹر آپریشن مؤخر کر سکے، اس سے پہلے نماز پڑھ سکے، یا بعد میں نماز کا وقت باقی رہے تو نماز مؤخر کرنا حرام ہے۔ اگر یہ ممکن نہ ہو تو فقہاء نے ضرورت کے لیے، یا کسی واجب یا ایسی مصلحت کے فوت ہونے کے خوف سے جس کی حفاظت شریعت چاہتی ہے، جیسے جان یا مال، نماز مقدم یا مؤخر کرنے کی اجازت دی ہے؛ اس نے اسنی المطالب پر رملی کے حاشیے سے نقل کیا کہ یہ ڈوبتے کو بچانے یا حملہ آور کو روکنے میں مشغول شخص پر بھی لاگو ہوتا ہے۔ اس نے بغیۃ المسترشدین سے نقل کیا کہ خطابی نے ابو اسحاق سے حضر میں ضرورت کے لیے جمع کا جواز نقل کیا، اور ابن المنذر کا بھی یہی قول ہے، اور حنابلہ کی الانصاف سے کہ ہر ایسے مشغلے یا عذر والے کے لیے جمع جائز ہے جس سے جمعہ اور جماعت چھوڑنا جائز ہو۔ اس نے نتیجہ نکالا کہ آپریشن میں مشغول ڈاکٹر جو مریض کے خوف سے نماز وقت پر نہ پڑھ سکے، جمعِ تاخیر کی نیت کر سکتا ہے۔"
