label: { ar: "زيارة المسجد الأقصى للمسلمين في الغرب", en: "Western Muslims visiting al-Aqsa Mosque", ur: "مغرب کے مسلمانوں کی مسجد اقصیٰ کی زیارت", es: "Musulmanes occidentales visitando la mezquita de Al-Aqsa.", fr: "Des musulmans occidentaux visitent la mosquée al-Aqsa", tr: "Batı'daki Müslümanlar için Aksa Camii Ziyareti", id: "Mengunjungi Masjid Al-Aqsa untuk Muslim di Barat" }
summary:
  ar: "سأل سائل عن حكم زيارة مسلمي الغرب للمسجد الأقصى في ظل ما ذكره من تضييق على زواره. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84801 بتاريخ 25 يونيو 2011)⁩ أنها من مسائل النزاع بين أهل العلم: فمن أجازها رأى فيها تأكيد حق المسلمين في القدس وربطهم بالأقصى ودعمًا معنويًّا لسكانه وإظهار ارتباط الأمة به أمام العالم مع فضيلة شد الرحال إليه، ومن منعها رأى فيها إقرارًا بسيادة الاحتلال ودعوة للتطبيع بأخذ التأشيرات وما يعود من فوائد على الجانب الآخر، وبيّن أن رابطة علماء فلسطين تدعم اتجاه المنع على ما ورد في الجواب."
  en: "A questioner asked the ruling on western Muslims visiting al-Aqsa given the stated restrictions on visitors. Dr. Salah al-Sawi (fatwa no. 84801, 25 June 2011) answered that it is a disputed question: permitters see it as affirming the Muslims' right in Jerusalem, binding them to al-Aqsa, morally supporting its people and displaying the ummah's bond before the world, with the merit of journeying to it; preventers see it as acknowledging the occupier's sovereignty and a call to normalisation through visa-taking with the benefits that returns, noting that the Palestinian scholars' league supports prevention — as the answer records. Both views presented as the fatwa presents them."
  ur: "ایک سائل نے مغرب کے مسلمانوں کی مسجد اقصیٰ زیارت کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84801، 25 جون 2011)⁩ نے اسے اختلافی مسئلہ قرار دیا اور جواز و منع دونوں فریقوں کے دلائل بیان کیے — جواب کے پیش کردہ دو مؤقفوں کا خلاصہ۔"
  es: "Un consultante preguntó sobre la normativa relativa a la visita de musulmanes occidentales a Al-Aqsa, dadas las restricciones vigentes para los visitantes. El Dr. Salah al-Sawi (fatwa n.º 84801, 25 de junio de 2011) respondió que se trata de una cuestión controvertida: quienes permiten la visita la interpretan como una afirmación del derecho de los musulmanes a Jerusalén, un vínculo con Al-Aqsa, un apoyo moral a su pueblo y una demostración de la unión de la ummah ante el mundo, con el mérito de peregrinar hasta allí; quienes la impiden, en cambio, la interpretan como un reconocimiento de la soberanía del ocupante y un llamado a la normalización mediante la obtención de visados, con los beneficios que ello conlleva, señalando que la Liga de Eruditos Palestinos apoya la prevención, tal como consta en la respuesta. Ambas posturas se presentan tal como las expone la fatwa."
  fr: "Un internaute a interrogé Salah al-Sawi sur la question de la visite de la mosquée Al-Aqsa par les musulmans occidentaux, compte tenu des restrictions en vigueur. Le Dr Salah al-Sawi (fatwa n° 84801, 25 juin 2011) a répondu qu'il s'agissait d'une question controversée: les partisans de l'autorisation y voient une affirmation du droit des musulmans à Jérusalem, un lien indéfectible avec Al-Aqsa, un soutien moral à ses habitants et une démonstration de l'unité de la Oumma aux yeux du monde, assortie du mérite du pèlerinage; les opposants à l'interdiction, quant à eux, y voient une reconnaissance de la souveraineté de l'occupant et un appel à la normalisation des relations par le biais de la délivrance de visas, avec les avantages qui en découlent. Ils ont également noté que la Ligue des oulémas palestiniens soutient l'interdiction, comme le précise la réponse. Les deux points de vue sont présentés tels qu'ils apparaissent dans la fatwa."
  tr: "Bir soru soran, Batılı Müslümanların Camii'ni ziyaret etmelerine ilişkin karar, ziyaretçilere yönelik kısıtlamalar ışığında soruldu. Dr. Salah Al-Sawy (25 Haziran 2011 tarihli Fetva No. 84801), bunun alimler arasında bir tartışma konusu olduğunu yanıtladı: izin verenler, bunu Müslümanların Kudüs hakkını teyit etmek, onları Aksa'ya bağlamak, sakinlerine manevi destek sağlamak ve ülkenin dünyaya buraya seyahat etme erdemiyle bağlılığını göstermek olarak gördüler. Yasaklayanlar, bunu işgalin egemenliğinin kabulü ve vize alarak normalleşme çağrısı olarak gördüler ve diğer tarafta sağladığı faydalar için bir çağrı olarak gördü. Filistinli Alimler Derneği'nin yasaklama yönünü desteklediğini açıkladı, yanıtta belirtildiği gibi."
  id: "Seorang penanya ditanya tentang putusan mengenai Muslim Barat yang mengunjungi Masjid Al-Aqsa mengingat pembatasan yang ia sebutkan terhadap pengunjungnya. Dr. Salah Al-Sawy (Fatwa No. 84801 tanggal 25 Juni 2011) menjawab bahwa hal ini menjadi perselisihan di antara para ulama: mereka yang mengizinkannya melihatnya sebagai penegasan hak Muslim atas Yerusalem, menghubungkan mereka dengan Al-Aqsa, memberikan dukungan moral kepada penduduknya, dan menunjukkan hubungan bangsa dengan masjid tersebut di hadapan dunia dengan kebajikan bepergian ke sana. Mereka yang melarangnya melihatnya sebagai pengakuan atas kedaulatan pendudukan dan seruan untuk normalisasi dengan memperoleh visa serta manfaat yang dibawanya bagi pihak lain. Ia menjelaskan bahwa Asosiasi Ulama Palestina mendukung arah pelarangan alkohol, sebagaimana dinyatakan dalam tanggapan."
