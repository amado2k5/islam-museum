id: work/fatwa-amja-visiting-al-aqsa
class: work
kind: fatwa
label: { ar: "زيارة المسجد الأقصى للمسلمين في الغرب", en: "Western Muslims visiting al-Aqsa Mosque", ur: "مغرب کے مسلمانوں کی مسجد اقصیٰ کی زیارت", es: "Musulmanes occidentales visitando la mezquita de Al-Aqsa." }
summary:
  ar: "سأل سائل عن حكم زيارة مسلمي الغرب للمسجد الأقصى في ظل ما ذكره من تضييق على زواره. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84801 بتاريخ 25 يونيو 2011)⁩ أنها من مسائل النزاع بين أهل العلم: فمن أجازها رأى فيها تأكيد حق المسلمين في القدس وربطهم بالأقصى ودعمًا معنويًّا لسكانه وإظهار ارتباط الأمة به أمام العالم مع فضيلة شد الرحال إليه، ومن منعها رأى فيها إقرارًا بسيادة الاحتلال ودعوة للتطبيع بأخذ التأشيرات وما يعود من فوائد على الجانب الآخر، وبيّن أن رابطة علماء فلسطين تدعم اتجاه المنع على ما ورد في الجواب."
  en: "A questioner asked the ruling on western Muslims visiting al-Aqsa given the stated restrictions on visitors. Dr. Salah al-Sawi (fatwa no. 84801, 25 June 2011) answered that it is a disputed question: permitters see it as affirming the Muslims' right in Jerusalem, binding them to al-Aqsa, morally supporting its people and displaying the ummah's bond before the world, with the merit of journeying to it; preventers see it as acknowledging the occupier's sovereignty and a call to normalisation through visa-taking with the benefits that returns, noting that the Palestinian scholars' league supports prevention — as the answer records. Both views presented as the fatwa presents them."
  ur: "ایک سائل نے مغرب کے مسلمانوں کی مسجد اقصیٰ زیارت کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84801، 25 جون 2011)⁩ نے اسے اختلافی مسئلہ قرار دیا اور جواز و منع دونوں فریقوں کے دلائل بیان کیے — جواب کے پیش کردہ دو مؤقفوں کا خلاصہ۔"
  es: "Un consultante preguntó sobre la normativa relativa a la visita de musulmanes occidentales a Al-Aqsa, dadas las restricciones vigentes para los visitantes. El Dr. Salah al-Sawi (fatwa n.º 84801, 25 de junio de 2011) respondió que se trata de una cuestión controvertida: quienes permiten la visita la interpretan como una afirmación del derecho de los musulmanes a Jerusalén, un vínculo con Al-Aqsa, un apoyo moral a su pueblo y una demostración de la unión de la ummah ante el mundo, con el mérito de peregrinar hasta allí; quienes la impiden, en cambio, la interpretan como un reconocimiento de la soberanía del ocupante y un llamado a la normalización mediante la obtención de visados, con los beneficios que ello conlleva, señalando que la Liga de Eruditos Palestinos apoya la prevención, tal como consta en la respuesta. Ambas posturas se presentan tal como las expone la fatwa."
