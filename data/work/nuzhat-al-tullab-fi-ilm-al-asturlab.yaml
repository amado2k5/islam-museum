label: { ar: "نزهة الطلاب في علم الأسطرلاب ⁦(أمية بن أبي الصلت)⁩", en: "Nuzhat al-tullab fi ilm al-asturlab (Umayya ibn Abi al-Salt al-Andalusi)", ur: "نزہۃ الطلاب فی علم الاسطرلاب ⁦(امیہ بن ابی الصلت اندلسی)⁩", es: "Nuzhat al-tullab fi ilm al-asturlab (omeya ibn Abi al-Salt al-Andalusi)", tr: "Astrolab Bilimi Öğrenci Pikniği (Umayyah ibn Abi al-Salt)", id: "Piknik Siswa dalam Ilmu Astrolabe (Umayyah ibn Abi al-Salt)" }
summary:
  ar: "رسالة لأمية بن أبي الصلت الأندلسي في الأسطرلاب في تسعين بابًا، تعرّف أجزاءه واستعمالاته، ولها نسخة في الأزهر كتبت سنة 1103هـ {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 26} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 27}."
  en: "Treatise by Umayya ibn Abi al-Salt al-Andalusi on the astrolabe in ninety chapters, describing its parts and uses; the Azhar copy was written in 1103 AH {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 26} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 27}."
  ur: "امیہ بن ابی الصلت اندلسی کا اسطرلاب پر نوے ابواب کا رسالہ، جو اس کے اجزا اور استعمالات بیان کرتا ہے؛ ازہر کا نسخہ 1103ھ میں لکھا گیا {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 26} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 27}۔"
  es: "Tratado de Umayya ibn Abi al-Salt al-Andalusi sobre el astrolabio en noventa capítulos, que describe sus partes y usos; la copia de Azhar fue escrita en 1103 AH {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 26} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 27}."
  fr: "Traité d'Umayya ibn Abi al-Salt al-Andalusi sur l'astrolabe en quatre-vingt-dix chapitres, décrivant ses parties et ses utilisations; la copie d'Azhar a été écrite en 1103 AH {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 26} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 27}."
  tr: "Umayya ibn Abi al-Salt al-Andalusi'nin astrolab üzerine doksan bölümlük bir risalesi, bölümleri ve kullanımı ve 1103 Hicri'de yazılmış bir kopyası El-Ezher'de bulunmaktadır {cite:bibalex-azhar-astronomy-manuscripts-2006 s. 26} {cite:bibalex-azhar-astronomy-manuscripts-2006 s. 27}."
  id: "Sebuah risalah oleh Umayya ibn Abi al-Salt al-Andalusi tentang astrolabe dalam sembilan puluh bab, bagian-bagiannya dan penggunaannya, dan memiliki salinannya di Al-Azhar yang ditulis pada tahun 1103 H {cite:bibalex-azhar-astronomy-manuscripts-2006 hlm. 26} {cite:bibalex-azhar-astronomy-manuscripts-2006 hlm. 27}."
