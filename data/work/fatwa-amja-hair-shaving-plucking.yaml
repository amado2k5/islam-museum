id: work/fatwa-amja-hair-shaving-plucking
class: work
kind: fatwa
label: { ar: "حلق الشعر ونتفه", en: "What hair is shaved or plucked — the fitra's rules", ur: "کون سا بال مونڈا یا نوچا جائے — فطرت", es: "Qué vello se afeita o se arranca: las reglas del fitra", fr: "Quels poils sont rasés ou épilés ? — les règles de la fitra" }
summary:
  ar: "سأل سائل ما يجب حلقه ونتفه من الشعر عند الرجل والمرأة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23020 بتاريخ 20 مايو 2008)⁩ أن من سنن الفطرة للرجال والنساء جميعًا نتف الإبط وحلق العانة ويحرم في حقهما جميعًا النمص وهو نتف الحاجبين أو شعر الوجه للمرأة ويحرم على الرجل حلق لحيته على ما فصّل الجواب."
  en: "A questioner asked what hair must be shaved and what plucked, for man and woman. Dr. Salah al-Sawi (fatwa no. 23020, 20 May 2008) answered that among the fitra's ways for men and women together are plucking the armpit and shaving the pubes; forbidden for both is plucking — the eyebrows or a woman's facial hair — and forbidden the man is shaving his beard — as the answer details."
  ur: "کون سے بال کاٹنا یا نوچنا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23020، 20 مئی 2008)⁩ کے مطابق بغل نوچنا زیر ناف مونڈنا فطرت؛ ابرو نوچنا اور داڑھی مونڈنا حرام۔"
  es: "Un consultante preguntó qué vello debe afeitarse y cuál debe depilarse, tanto en hombres como en mujeres. El Dr. Salah al-Sawi (fatwa n.º 23020, 20 de mayo de 2008) respondió que entre las prácticas fitra aplicables a hombres y mujeres se encuentran la depilación de las axilas y el afeitado del vello púbico; está prohibido para ambos depilarse las cejas (o el vello facial de la mujer) y está prohibido que el hombre se afeite la barba, como se detalla en la respuesta."
  fr: "Une personne a demandé quels poils devaient être rasés et épilés, pour l'homme et la femme. Le Dr Salah al-Sawi (fatwa n° 23020, 20 mai 2008) a répondu que, selon la fitra, l'épilation des aisselles et le rasage du pubis sont autorisés pour les hommes et les femmes ensemble; l'épilation des sourcils ou des poils du visage chez la femme est interdite aux deux, et le rasage de la barbe est interdit à l'homme, comme le précise la réponse."
