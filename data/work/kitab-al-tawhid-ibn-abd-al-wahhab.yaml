label: { ar: "كتاب التوحيد الذي هو حق الله على العبيد", en: "Kitab al-Tawhid (Muhammad ibn 'Abd al-Wahhab)", ur: "کتاب التوحید (محمد بن عبد الوہاب)" }
summary:
  ar: "كتاب محمد بن عبد الوهاب (1115–1206هـ) في توحيد العبادة وما ينافيه، في ستة وستين باباً، يسوق في كل باب آيات وأحاديث وآثاراً بلا أسانيد، ثم يستخرج منها «مسائل» مرقمة: من فضل التوحيد وتفسير «لا إله إلا الله»، إلى التمائم والرقى والتبرك بالأشجار والأحجار والذبح والنذر والاستغاثة بغير الله، والشفاعة، والغلو في الصالحين وقبورهم، والسحر والكهانة والتطير والتنجيم، والرياء، والألفاظ، والقدر، والتصوير، والحلف، وختمه بباب عظمة الله {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university p. 7-9} {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university p. 153-157}."
  en: "Muhammad ibn 'Abd al-Wahhab's (1115–1206 AH) book on the oneness of worship and what contradicts it, in sixty-six chapters; each brings verses, reports and sayings of the early generations without chains and then draws numbered 'points' (masa'il) from them. It runs from the merit of tawhid and the meaning of 'there is no god but God' through amulets and incantations, seeking blessing from trees and stones, sacrifice, vows and calling for help on other than God, intercession, excess regarding the righteous and their graves, sorcery, soothsaying, omens and astrology, ostentation, forms of speech, decree, image-making and oaths, and closes with a chapter on God's majesty {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university p. 7-9} {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university p. 153-157}."
  ur: "محمد بن عبد الوہاب (1115–1206ھ) کی کتاب جو توحیدِ عبادت اور اس کے منافی امور پر چھیاسٹھ ابواب میں ہے؛ ہر باب میں آیات، احادیث اور آثار بغیر سند کے لائے جاتے ہیں اور پھر ان سے نمبر وار «مسائل» نکالے جاتے ہیں۔ یہ فضیلتِ توحید اور «لا الہ الا اللہ» کی تفسیر سے شروع ہو کر تعویذ و دم، درختوں اور پتھروں سے تبرک، ذبح، نذر اور غیر اللہ سے استغاثہ، شفاعت، صالحین اور ان کی قبروں میں غلو، جادو، کہانت، بدشگونی اور نجوم، ریا، الفاظ، تقدیر، تصویر اور قسم تک جاتی ہے، اور اللہ کی عظمت کے باب پر ختم ہوتی ہے {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university p. 7-9} {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university p. 153-157}۔"
