structure: "66 باباً بلا مقدمة إلا البسملة والحمدلة (ص 7)؛ يبدأ بـ«كتاب التوحيد» وآيات الذاريات 56 والنحل 36 والإسراء 23–24 والنساء 36 والأنعام 151–153 وحديث معاذ (ص 7–9)، وكل باب يُختم بـ«فيه مسائل» مرقمة. وفهرس الأبواب في نشرة جامعة الإمام ص 153–157 (الصفحات المطبوعة)."
