label: { ar: "حكم حقوق الملكية الفكرية في الأعمال البحثية بعد الوفاة", en: "Intellectual property rights in research works after the author's death", ur: "مصنف کی وفات کے بعد تحقیقی کاموں میں فکری ملکیت کے حقوق کا حکم", es: "Derechos de propiedad intelectual sobre trabajos de investigación tras la muerte del autor", fr: "Droits de propriété intellectuelle sur les travaux de recherche après le décès de l'auteur" }
summary:
  ar: "سؤال من رجل كان لوالده حساب على أحد المواقع يحوي أبحاثه، وأطلعه على الحساب ورقمه السري قبل وفاته، هل تدخل هذه الأبحاث في الميراث أم هي ملك خاص به، أجابت فيه دار الإفتاء المصرية بأن الحقوق المالية للمؤلف سارية طول حياته وخمسين سنة بعد وفاته، وأن حقوق الانتفاع بالأبحاث التي تركها الوالد من جملة أمواله التي تدخل في تركته وتنتقل إلى ورثته، ولا يختص بها أحدهم دون غيره من غير سبب صحيح ناقل للملكية قبل الوفاة كالبيع والهبة والوصية. بيّنت الدار أن حفظ المال من المقاصد الكلية للشرع كما قال الغزالي، وأن حقوق الملكية الفكرية والتأليف من الحقوق الثابتة لأصحابها شرعًا وعرفًا باعتبارها مالًا، لأن المال يشمل الأعيان والمنافع والحقوق، ناقلة عن ابن سيده والزبيدي والمازري والجويني والرافعي وابن قدامة والبهوتي أن المنافع أموال كالأعيان، وأن الإنتاج الفكري يُنتفع به ويُتداول ويُقوَّم عرفًا فله حكم المالية، وأحالت إلى قانون حماية الملكية الفكرية رقم 82 لسنة 2002 ومادتيه 140 و160. وقالت إن إذن الوالد لابنه بالاطلاع على أبحاثه أو إدارة حسابه لا يعني تملكه لها لأن الملك لا يحصل إلا بسبب من أسباب التملك التي عدّها الزيلعي والماوردي وابن الرفعة، وغاية الأمر أنه ائتمنه عليها حال حياته، فإذا توفي ولم ينقل ملكيتها كانت تركة تقسم حقوق الانتفاع بها بين الورثة بحسب أنصبتهم."
  en: "A question from a man whose father had an account on a website holding his research papers and had shown him the account and its password before his death, asking whether these papers form part of the inheritance or are his own property; Dar al-Ifta al-Misriyya answered that an author's economic rights last for his lifetime and fifty years after his death, that the rights to benefit from the research the father left are part of his property, enter his estate and pass to his heirs, and that no one heir has an exclusive claim to them without a valid cause transferring ownership before death, such as sale, gift or bequest. Dar al-Ifta explained that preserving property is among the universal aims of sharia, as al-Ghazali says, and that intellectual property and authors' rights are rights established for their holders in sharia and custom as a form of property, since property includes tangible things, uses and rights; it quoted Ibn Sida, al-Zabidi, al-Mazari, al-Juwayni, al-Rafi'i, Ibn Qudama and al-Buhuti that uses are property like tangible things, said that intellectual production is used, traded and valued by custom and so has the status of property, and referred to Egypt's Intellectual Property Law 82 of 2002, articles 140 and 160. It said that a father's permitting his son to view his research or manage his account does not make the son its owner, because ownership arises only through one of the recognised causes of ownership listed by al-Zayla'i, al-Mawardi and Ibn al-Rif'a; at most the father entrusted the son with it during his lifetime, so if he died without transferring ownership it is part of the estate, and the rights of use are divided among the heirs according to their shares."
  ur: "ایک شخص کا سوال جس کے والد کا ایک ویب سائٹ پر اکاؤنٹ تھا جس میں ان کی تحقیقات تھیں اور انہوں نے وفات سے پہلے اسے اکاؤنٹ اور پاس ورڈ دکھایا تھا؛ اس نے پوچھا کہ کیا یہ تحقیقات وراثت میں داخل ہیں یا اس کی ذاتی ملکیت ہیں۔ دار الافتاء مصر نے جواب دیا کہ مصنف کے مالی حقوق اس کی زندگی اور وفات کے بعد پچاس سال تک جاری رہتے ہیں، والد کی چھوڑی ہوئی تحقیقات سے فائدے کے حقوق ان کے اموال میں شامل ہیں جو ترکے میں داخل ہو کر ورثا کو منتقل ہوتے ہیں، اور وفات سے پہلے ملکیت منتقل کرنے والے کسی درست سبب جیسے بیع، ہبہ یا وصیت کے بغیر کوئی ایک وارث ان کا تنہا حق دار نہیں۔ دار الافتاء نے بیان کیا کہ مال کی حفاظت شریعت کے کلی مقاصد میں سے ہے جیسا کہ غزالی نے کہا، اور فکری ملکیت اور تصنیف کے حقوق شرعاً اور عرفاً ان کے مالکوں کے لیے مال کے طور پر ثابت حقوق ہیں، کیونکہ مال اعیان، منافع اور حقوق سب کو شامل ہے؛ اس نے ابن سیدہ، زبیدی، مازری، جوینی، رافعی، ابن قدامہ اور بہوتی سے نقل کیا کہ منافع اعیان کی طرح مال ہیں، کہا کہ فکری پیداوار سے فائدہ اٹھایا جاتا، اس کی تجارت ہوتی اور عرفاً اس کی قیمت لگائی جاتی ہے لہٰذا اسے مال کا حکم ہے، اور مصر کے 2002 کے فکری ملکیت کے قانون 82 کی دفعات 140 اور 160 کا حوالہ دیا۔ اس نے کہا کہ والد کا بیٹے کو اپنی تحقیقات دیکھنے یا اکاؤنٹ چلانے کی اجازت دینا اسے مالک نہیں بناتا، کیونکہ ملکیت صرف اسبابِ تملک میں سے کسی سبب سے حاصل ہوتی ہے جنہیں زیلعی، ماوردی اور ابن الرفعہ نے شمار کیا؛ زیادہ سے زیادہ والد نے اپنی زندگی میں بیٹے کو اس پر امین بنایا، لہٰذا اگر وہ ملکیت منتقل کیے بغیر فوت ہوئے تو یہ ترکہ ہے اور فائدے کے حقوق ورثا میں ان کے حصوں کے مطابق تقسیم ہوں گے۔"
  es: "Un hombre cuyo padre tenía una cuenta en un sitio web con sus trabajos de investigación y le había mostrado la cuenta y su contraseña antes de morir, preguntó si estos trabajos formaban parte de la herencia o eran de su propiedad; Dar al-Ifta al-Misriyya respondió que los derechos económicos de un autor duran toda su vida y cincuenta años después de su muerte, que los derechos a beneficiarse de la investigación que dejó el padre forman parte de su propiedad, entran en su patrimonio y pasan a sus herederos, y que ningún heredero tiene un derecho exclusivo sobre ellos sin una causa válida que transfiera la propiedad antes de la muerte, como una venta, una donación o un legado. Dar al-Ifta explicó que la preservación de la propiedad está entre los objetivos universales de la sharia, como dice al-Ghazali, y que la propiedad intelectual y los derechos de autor son derechos establecidos para sus titulares en la sharia y la costumbre como una forma de propiedad, ya que la propiedad incluye cosas tangibles, usos y derechos; Citaba a Ibn Sida, al-Zabidi, al-Mazari, al-Juwayni, al-Rafi'i, Ibn Qudama y al-Buhuti, quienes afirmaban que los usos son propiedad como las cosas tangibles; decía que la producción intelectual se usa, se comercializa y se valora por costumbre, por lo que tiene la condición de propiedad; y hacía referencia a la Ley de Propiedad Intelectual n.º 82 de 2002 de Egipto, artículos 140 y 160. Afirmaba que el hecho de que un padre permita a su hijo ver su investigación o administrar su cuenta no convierte al hijo en propietario, porque la propiedad surge solo a través de una de las causas de propiedad reconocidas enumeradas por al-Zayla'i, al-Mawardi e Ibn al-Rif'a; a lo sumo, el padre se la confió al hijo durante su vida, por lo que si murió sin transferir la propiedad, esta forma parte de la herencia, y los derechos de uso se dividen entre los herederos según sus partes."
  fr: "Un homme a demandé si son père, décédé avant lui, possédait un compte sur un site internet hébergeant ses travaux de recherche et lui en avait communiqué l'identifiant et le mot de passe. Il souhaitait savoir si ces travaux faisaient partie de son héritage ou s'il s'agissait de sa propriété personnelle. Dar al-Ifta al-Misriyya a répondu que les droits patrimoniaux d'un auteur durent sa vie et cinquante ans après son décès. Les droits de bénéficier des recherches laissées par son père font partie de son patrimoine, sont intégrés à sa succession et transmis à ses héritiers. Aucun héritier ne peut prétendre à la propriété exclusive de ces travaux sans un transfert de propriété valable intervenu avant le décès, tel qu'une vente, une donation ou un legs. Dar al-Ifta a expliqué que la préservation de la propriété figure parmi les objectifs universels de la charia, comme l'affirme al-Ghazali, et que la propriété intellectuelle et les droits d'auteur sont des droits établis par la charia et la coutume comme une forme de propriété, puisque la propriété englobe les biens matériels, les usages et les droits. L'ouvrage citait Ibn Sida, al-Zabidi, al-Mazari, al-Juwayni, al-Rafi'i, Ibn Qudama et al-Buhuti, selon lesquels les usages constituent une propriété au même titre que les biens matériels. Il affirmait que la production intellectuelle est utilisée, commercialisée et valorisée par la coutume, et qu'elle possède donc le statut de propriété. Il faisait également référence à la loi égyptienne n° 82 de 2002 relative à la propriété intellectuelle, articles 140 et 160. Il précisait que le fait pour un père d'autoriser son fils à consulter ses recherches ou à gérer ses comptes ne confère pas à ce dernier la propriété, car la propriété ne peut naître que de l'une des causes reconnues et énumérées par al-Zayla'i, al-Mawardi et Ibn al-Rif'a. Tout au plus, le père a confié cette propriété à son fils de son vivant; s'il décède sans en avoir transféré la propriété, celle-ci fait partie de la succession, et les droits d'usage sont répartis entre les héritiers au prorata de leurs parts respectives."
