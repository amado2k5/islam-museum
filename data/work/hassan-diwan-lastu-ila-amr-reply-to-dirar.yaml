label: { ar: "قصيدة حسان «لست إلى عمرو ولا المرء منذر»", en: "Hassan's reply to Dirar ibn al-Khattab 'I do not turn to Amr nor to Mundhir'", es: "La respuesta de Hassan a Dirar ibn al-Khattab: \"No recurro ni a Amr ni a Mundhir\".", fr: "Réponse de Hassan à Dirar ibn al-Khattab: « Je ne me tourne ni vers Amr ni vers Mundhir. »", ur: "دیر ابن الخطاب کو حسن کا جواب 'میں نہ عمرو کی طرف متوجہ ہوں اور نہ ہی منذر کی طرف'", tr: "Hassan'ın şiiri \"Ben ne Amr'a ne de tek Mundhir'e değilim\"", id: "Puisi Hassan \"Aku bukan bagi Amr maupun untuk satu Mundhir\"" }
summary:
  ar: "أبيات لحسان بن ثابت من الطويل على روي الراء، يجيب بها ضرار بن الخطاب، وهي أول شعر قاله في الإسلام كما في الشرح {{cite:sharh-diwan-hassan-barquqi-1929 p.192}}."
  en: "Verses by Hassan ibn Thabit in the tawil metre on the rhyme ra', answering Dirar ibn al-Khattab, the first poem he composed in Islam according to the commentary {{cite:sharh-diwan-hassan-barquqi-1929 p.192}}."
  es: "Versos de Hassan ibn Thabit en metro tawil sobre la rima ra', respondiendo a Dirar ibn al-Khattab, el primer poema que compuso en Islam según el comentario {{cite:sharh-diwan-hassan-barquqi-1929 p.192}}."
  fr: "Vers de Hassan ibn Thabit en mètre tawil sur la rime ra', répondant à Dirar ibn al-Khattab, le premier poème qu'il a composé en Islam selon le commentaire {{cite:sharh-diwan-hassan-barquqi-1929 p.192}}."
  ur: "حسن بن ثابت کی آیات تاویل میٹر میں رائم را' پر، دیر ابن الخطاب کا جواب دیتے ہوئے، تفسیر کے مطابق اس نے اسلام میں پہلی نظم لکھی تھی۔"
  tr: "Hasan ibn Tabit'in Al-Tawil'den r' üzerine yazdığı dizeler, Zirar ibn al-Hattab'ın yanıt verdiği ve bunlar, {{cite:sharh-diwan-hassan-barquqi-1929 s.192}} yorumunda bahsedilen İslam hakkında yazdığı ilk şiirlerdir."
  id: "Ayat-ayat oleh Hassan ibn Thabit dari Al-Tawil di r', yang dijawab oleh Dhirar ibn al-Khattab, dan ini adalah puisi-puisi pertama yang ia ciptakan tentang Islam sebagaimana disebutkan dalam komentar {{cite:sharh-diwan-hassan-barquqi-1929 hlm.192}}."
