id: work/fatwa-dar-alifta-eg-disposing-of-earnest-money
class: work
kind: fatwa
label: { ar: "حكم التصرف في العربون قبل تسليم المبيع", en: "Disposing of the earnest money before the goods are delivered", ur: "مبیع کی ترسیل سے پہلے بیعانہ میں تصرف", es: "Disposición del depósito de garantía antes de la entrega de la mercancía.", fr: "Disposition de l'acompte avant la livraison des marchandises" }
summary:
  ar: "سائل سأل عن تصرف البائع في العربون قبل تسليم المبيع. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21773)⁩ أن العربون المدفوع للبائع من قبل المشتري من حين إبرام عقد البيع تنتقل ملكيته إلى البائع بمجرد استحقاقه وبيّن الجواب حكم التصرف فيه على وجهه."
  en: "A questioner asked about the seller disposing of the earnest money before the goods are delivered. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21773) answered that the earnest money paid by the buyer from the moment the sale contract is concluded passes to the seller's ownership as soon as it is earned; the answer sets out the ruling on disposing of it."
  ur: "ایک سائل نے بیچنے والے کے مبیع سپرد کرنے سے پہلے بیعانہ میں تصرف کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21773)⁩ نے جواب دیا کہ خریدار کی طرف سے عقد کے وقت ادا شدہ بیعانہ مستحق ہونے پر بیچنے والے کی ملکیت بن جاتا ہے؛ اس میں تصرف کا حکم جواب میں بیان ہوا۔"
  es: "Un consultante preguntó sobre la disposición del arras por parte del vendedor antes de la entrega de la mercancía. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21773) respondió que las arras pagadas por el comprador desde el momento en que se concluye el contrato de compraventa pasan a ser propiedad del vendedor en cuanto se devengan; la respuesta establece la normativa sobre su disposición."
  fr: "Un internaute a posé une question concernant la disposition de l'acompte par le vendeur avant la livraison des marchandises. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21773) a répondu que l'acompte versé par l'acheteur dès la conclusion du contrat de vente devient la propriété du vendeur dès qu'il est acquis; la réponse expose la règle relative à sa disposition."
