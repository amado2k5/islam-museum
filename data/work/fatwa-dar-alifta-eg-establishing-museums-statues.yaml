id: work/fatwa-dar-alifta-eg-establishing-museums-statues
class: work
kind: fatwa
label: { ar: "حكم إقامة المتاحف واشتمالها على التماثيل والانتفاع بالتعلم منها", en: "Establishing museums containing statues, and learning from them", ur: "مجسموں والے عجائب گھر قائم کرنا اور ان سے سیکھنا" }
summary:
  ar: "سائل سأل عن إقامة المتاحف التي تشتمل على التماثيل والانتفاع بالتعلم منها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22197)⁩ أنه لا مانع شرعًا من إقامة المتاحف المعبرة عن الحضارة والتاريخ التي تعد وسيلة من وسائل التعليم والتثقيف، وأما ما فيها من تماثيل فله ضوابطه التي فصّلها الجواب."
  en: "A questioner asked about establishing museums containing statues and benefiting by learning from them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22197) answered that there is no sharia bar to establishing museums that express civilisation and history as a means of education and culture; the statues in them are governed by controls the answer details."
  ur: "ایک سائل نے مجسموں والے عجائب گھر قائم کرنے اور ان سے استفادہ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22197)⁩ نے جواب دیا کہ تہذیب اور تاریخ کی عکاسی کرنے والے عجائب گھر قائم کرنے میں شرعاً کوئی مانع نہیں کیونکہ وہ تعلیم اور تثقیف کا ذریعہ ہیں؛ ان میں رکھے مجسموں کے لیے وہ ضوابط ہیں جو جواب میں بیان ہوئے۔"
