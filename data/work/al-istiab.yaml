summary:
  ar: "كتاب أبي عمر يوسف بن عبد البر النمري القرطبي ⁦(368-463هـ)⁩ في تراجم الصحابة، رتبه على حروف المعجم في الأسماء ثم الكنى ثم النساء، في نحو 3590 ترجمة في طبعة دار الأعلام؛ قدّم له بأن عدالة الصحابة جميعاً ثابتة بثناء الله ورسوله {cite:istiab-alam-2002 p. 15}؛ وهو أحد الكتب الأربعة التي استقصاها ابن الأثير في أسد الغابة وجعل له علامة ⁦(ب)⁩ {cite:kashf-zunun-furqan p. 398}."
  en: "The dictionary of Companions of Abu 'Umar Yusuf ibn 'Abd al-Barr al-Namari of Cordoba (368-463 AH), arranged alphabetically by name, then by kunya, then the women, in some 3,590 entries in the Dar al-A'lam edition; he opens it by stating that the probity of all the Companions is established by the praise of God and His Messenger {cite:istiab-alam-2002 p. 15}; it is one of the four books Ibn al-Athir exhausted in Usd al-Ghaba under the siglum (ب) {cite:kashf-zunun-furqan p. 398}."
  ur: "ابو عمر یوسف بن عبد البر نمری قرطبی (368-463ھ) کی صحابہ کے تراجم پر کتاب، جو ناموں میں حروفِ تہجی پر، پھر کنیتوں، پھر خواتین پر مرتب ہے، دار الاعلام کی طبع میں تقریباً 3590 تراجم؛ مقدمے میں وہ کہتے ہیں کہ تمام صحابہ کی عدالت اللہ اور اس کے رسول کی تعریف سے ثابت ہے {cite:istiab-alam-2002 p. 15}؛ یہ ان چار کتابوں میں سے ہے جنہیں ابن الاثیر نے اسد الغابہ میں سمویا اور اس کے لیے علامت (ب) رکھی {cite:kashf-zunun-furqan p. 398}۔"
