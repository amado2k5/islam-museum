summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية ⁦(الكويت، ديسمبر 1985م)⁩ بشأن القاديانية: نصّ القرار في صياغته على أن ما ادعاه ميرزا غلام أحمد من النبوة والرسالة ونزول الوحي عليه إنكار لختم النبوة الذي ثبت في الدين بالضرورة، وأن هذه الدعوى تجعله وسائر من يوافقونه عليها مرتدين خارجين عن الإسلام عند المجمع، وبيّن حكم اللاهورية على وجهه. سُجّل منسوبًا إلى المجمع."
  en: "IIFA's second-session resolution (Kuwait, December 1985) on Qadianism: the text states that Mirza Ghulam Ahmad's claims of prophethood, messengerhood and revelation upon him deny the finality of prophethood established in the religion necessarily, and that the claim makes him and those agreeing with him apostates outside Islam in the Academy's view, with the Lahori branch's ruling set out. Recorded as the Academy's own position."
  ur: "اکیڈمی کی دوسری مجلس کی قرارداد ⁦(کویت، دسمبر 1985ء)⁩ قادیانیت پر: متن میں مرزا غلام احمد کے نبوت کے دعوے کو ختم نبوت کا انکار قرار دیا اور لاہوری شاخ کا حکم بیان کیا — اکیڈمی کے مؤقف کا خلاصہ۔"
  es: "Resolución de la IIFA de su segunda sesión (Kuwait, diciembre de 1985) sobre el qadianismo: el texto afirma que las pretensiones de Mirza Ghulam Ahmad de ser profeta, mensajero y haber recibido la revelación niegan necesariamente la finalidad de la profecía establecida en la religión, y que, a juicio de la Academia, dicha pretensión lo convierte a él y a quienes coinciden con él en apóstatas ajenos al Islam, exponiendo la postura de la rama de Lahore. Esta resolución se registró como la posición oficial de la Academia."
