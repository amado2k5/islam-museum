summary:
  ar: "سؤال عن حكم شرب الدخان. الجواب بأن الأطباء أجمعوا على ضرره، وأن كل ما ثبت ضرره حرام لأن تعاطي المضر محرم، وأن جمهور العلماء نصوا على تحريمه."
  ur: "سوال: تمباکو نوشی کا کیا حکم ہے؟ جواب: طبیبوں کا اتفاق ہے کہ یہ نقصان دہ ہے، اور نقصان دہ چیز کا استعمال حرام ہے، اور جمہور علماء نے اس کی حرمت صراحت سے بیان کی ہے۔"
  en: "Question on the ruling on smoking tobacco. The answer: physicians agree it is harmful, harmful substances are forbidden, and most scholars explicitly ruled it unlawful."
