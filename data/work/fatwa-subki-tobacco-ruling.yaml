summary:
  ar: "سؤال عن حكم شرب الدخان. الجواب بأن الأطباء أجمعوا على ضرره، وأن كل ما ثبت ضرره حرام لأن تعاطي المضر محرم، وأن جمهور العلماء نصوا على تحريمه."
  ur: "سوال: تمباکو نوشی کا کیا حکم ہے؟ جواب: طبیبوں کا اتفاق ہے کہ یہ نقصان دہ ہے، اور نقصان دہ چیز کا استعمال حرام ہے، اور جمہور علماء نے اس کی حرمت صراحت سے بیان کی ہے۔"
  en: "Question on the ruling on smoking tobacco. The answer: physicians agree it is harmful, harmful substances are forbidden, and most scholars explicitly ruled it unlawful."
  es: "Pregunta sobre la normativa relativa al consumo de tabaco. Respuesta: los médicos coinciden en que es perjudicial, las sustancias nocivas están prohibidas y la mayoría de los expertos lo consideran ilegal."
  fr: "Question sur la position concernant le tabagisme. Réponse: les médecins s’accordent à dire qu’il est nocif, les substances nocives sont interdites et la plupart des spécialistes l’ont explicitement déclaré illégal."
  tr: "Tütün içme kararıyla ilgili bir soru. Cevap, doktorların zararlı olduğu konusunda oybirliğiyle hemfikir olması ve zararlı olduğu kanıtlanan her şeyin yasak olduğu çünkü zararlı kullanımın yasak olduğu ve çoğu akademisyenin yasak olduğunu açıkça belirttiğidir."
  id: "Sebuah pertanyaan tentang aturan tentang merokok tembakau. Jawabannya adalah bahwa dokter sepakat secara bulat tentang bahayanya, dan bahwa segala sesuatu yang terbukti berbahaya dilarang karena penggunaan yang berbahaya dilarang, dan mayoritas akademisi secara eksplisit menyatakan larangannya."
