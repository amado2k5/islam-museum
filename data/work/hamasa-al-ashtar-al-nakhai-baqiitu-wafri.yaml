label: { ar: "أبيات الأشتر النخعي «بقيت وفري وانحرفت عن العلا»", en: "Al-Ashtar al-Nakha'i's verses 'I remained, with my goods, and turned from eminence'", es: "Versos de Al-Ashtar al-Nakha'i: \"Me quedé con mis bienes y me aparté de la eminencia\".", fr: "Vers d'Al-Ashtar al-Nakha'i: « Je suis resté avec mes biens et me suis détourné de l'éminence. »", ur: "اشتر النخعی کی آیات 'میں اپنے مال کے ساتھ رہا اور عزت سے پھر گیا'", tr: "El-Aştar El-Nakha'i'nin ayetleri: \"Bol kaldım ve yüksekliklerden saptım\"", id: "Ayat-ayat Al-Ashtar Al-Nakha'i: \"Aku tetap melimpah dan menyimpang dari puncak\"" }
summary:
  ar: "أبيات في ديوان الحماسة من الكامل على روي السين، تقدّمها الطبعة بقولها «وقال الأشتر النخعي» وتذكر في حاشيتها أنه مالك بن الحارث أحد بني النخع {{cite:hamasa-abu-tammam-ed-1916 p.37}}."
  en: "Verses in the Diwan al-Hamasa in the kamil metre on the rhyme sin, introduced in the edition with \"al-Ashtar al-Nakha'i said\", its footnote naming him Malik ibn al-Harith of Banu al-Nakha' {{cite:hamasa-abu-tammam-ed-1916 p.37}}."
  es: "Versos del Diwan al-Hamasa en metro kamil sobre la rima sin, introducidos en la edición con \"al-Ashtar al-Nakha'i dijo\", su nota al pie lo nombra Malik ibn al-Harith de Banu al-Nakha' {{cite:hamasa-abu-tammam-ed-1916 p.37}}."
  fr: "Versets du Diwan al-Hamasa en mètre kamil sur la rime sin, introduits dans l'édition avec « al-Ashtar al-Nakha'i a dit », sa note de bas de page le nommant Malik ibn al-Harith de Banu al-Nakha' {{cite:hamasa-abu-tammam-ed-1916 p.37}}."
  ur: "دیوان الحمسہ کی آیات کامل میٹر میں شاعری گناہ پر، ایڈیشن میں \"الاشتر النخعی نے کہا\" کے ساتھ متعارف کرایا ہے، اس کا حاشیہ اس کا نام مالک بن الحارث بنو النخاع ہے۔"
  tr: "Al-Hamasa Diwanı'ndaki Al-Kamil'den Ansallı Günah üzerine ayetler, \"El-Aştar El-Nakha'i dedi\" ifadesinin yer aldığı baskı ile birlikte kenar notlarında Malik ibn El-Harit'in Banu El-Nakha'dan biri olduğu belirtilir {{cite:hamasa-abu-tammam-ed-1916 s.37}}."
  id: "Ayat-ayat dalam Diwan Al-Hamasa dari Al-Kamil tentang Dosa yang Diceritakan, didahului oleh edisi dengan frasa \"Al-Ashtar Al-Nakha'i berkata,\" dan disebutkan dalam catatan pinggirnya bahwa Malik ibn Al-Harith adalah salah satu dari Banu Al-Nakha' {{cite:hamasa-abu-tammam-ed-1916 hlm.37}}."
