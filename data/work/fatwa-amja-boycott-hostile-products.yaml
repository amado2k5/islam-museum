id: work/fatwa-amja-boycott-hostile-products
class: work
kind: fatwa
label: { ar: "شراء منتجات الدول المحاربة", en: "Buying the products of states at war with Islam", ur: "محارب ممالک کی پیداوار خریدنا", es: "Comprar productos de estados en guerra con el Islam." }
summary:
  ar: "سأل سائل عن حكم أكل أو شراء منتجات دول محاربة للإسلام كأمريكا وفرنسا وهل المقاطعة واجبة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82012 بتاريخ 1 أغسطس 2010)⁩ أنه إن تيسرت البدائل من الدول الإسلامية أو المسالمة فليحرص عليها ولا يبغ بها بدلًا، وإن لم يتيسر فليشتر الحلال ممن شاء."
  en: "A questioner asked whether eating or buying the products of states warring against Islam — such as America or France — is permissible, and whether boycott is obligatory. Dr. Salah al-Sawi (fatwa no. 82012, 1 August 2010) answered that where alternatives from Muslim or peaceable states are available one should hold to them and seek no substitute, and where they are not, one may buy what is lawful from whomever one wills."
  ur: "ایک سائل نے اسلام سے محارب ممالک کی پیداوار خریدنے اور ان کے بائیکاٹ کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82012، 1 اگست 2010)⁩ کے مطابق جہاں اسلامی یا مسالم ممالک کے متبادل موجود ہوں وہیں سے لے؛ نہ ہوں تو حلال خریدنا جائز ہے۔"
  es: "Un interlocutor preguntó si era permisible consumir o comprar productos de estados que están en guerra contra el Islam, como Estados Unidos o Francia, y si el boicot era obligatorio. El Dr. Salah al-Sawi (fatwa n.º 82012, 1 de agosto de 2010) respondió que, cuando existan alternativas de estados musulmanes o pacíficos, se debe optar por ellas y no buscar sustitutos; y, cuando no las haya, se puede comprar lo que sea lícito a quien se desee."
