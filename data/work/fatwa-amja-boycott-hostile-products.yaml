id: work/fatwa-amja-boycott-hostile-products
class: work
kind: fatwa
label: { ar: "شراء منتجات الدول المحاربة", en: "Buying the products of states at war with Islam", ur: "محارب ممالک کی پیداوار خریدنا", es: "Comprar productos de estados en guerra con el Islam.", fr: "Acheter les produits d'États en guerre contre l'islam", tr: "Savaşan ülkelerden ürün satın alma", id: "Membeli produk dari negara-negara yang berperang" }
summary:
  ar: "سأل سائل عن حكم أكل أو شراء منتجات دول محاربة للإسلام كأمريكا وفرنسا وهل المقاطعة واجبة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82012 بتاريخ 1 أغسطس 2010)⁩ أنه إن تيسرت البدائل من الدول الإسلامية أو المسالمة فليحرص عليها ولا يبغ بها بدلًا، وإن لم يتيسر فليشتر الحلال ممن شاء."
  en: "A questioner asked whether eating or buying the products of states warring against Islam — such as America or France — is permissible, and whether boycott is obligatory. Dr. Salah al-Sawi (fatwa no. 82012, 1 August 2010) answered that where alternatives from Muslim or peaceable states are available one should hold to them and seek no substitute, and where they are not, one may buy what is lawful from whomever one wills."
  ur: "ایک سائل نے اسلام سے محارب ممالک کی پیداوار خریدنے اور ان کے بائیکاٹ کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82012، 1 اگست 2010)⁩ کے مطابق جہاں اسلامی یا مسالم ممالک کے متبادل موجود ہوں وہیں سے لے؛ نہ ہوں تو حلال خریدنا جائز ہے۔"
  es: "Un interlocutor preguntó si era permisible consumir o comprar productos de estados que están en guerra contra el Islam, como Estados Unidos o Francia, y si el boicot era obligatorio. El Dr. Salah al-Sawi (fatwa n.º 82012, 1 de agosto de 2010) respondió que, cuando existan alternativas de estados musulmanes o pacíficos, se debe optar por ellas y no buscar sustitutos; y, cuando no las haya, se puede comprar lo que sea lícito a quien se desee."
  fr: "Une personne a demandé si la consommation ou l'achat de produits provenant d'États en guerre contre l'islam — comme les États-Unis ou la France — était permis, et si le boycott était obligatoire. Le Dr Salah al-Sawi (fatwa n° 82012, 1er août 2010) a répondu que, lorsque des alternatives provenant d'États musulmans ou pacifiques sont disponibles, il convient de s'y tenir et de ne pas chercher de substitut; en l'absence d'alternatives, chacun peut acheter ce qui est licite auprès de qui il le souhaite."
  tr: "Bir soru soran kişiye, Amerika ve Fransa gibi İslam'la mücadele eden ülkelerden ürün yeme veya satın alma kararı ve boykotun zorunlu olup olmadığı hakkında soruldu. Dr. Salah Al-Sawy (1 Ağustos 2010 tarihli 82012 No. Fetva) İslami veya barışçıl ülkelerden alternatifler varsa, dikkatli olunması ve yerine alternatif aramaması gerektiğini, eğer aramadıkları takdirde yasal malları istediği kişiden satın almasına izin verilmesini söyledi."
  id: "Seorang penanya ditanya tentang aturan makan atau membeli produk dari negara-negara yang melawan Islam seperti Amerika dan Prancis, serta apakah boikot itu wajib. Dr. Salah Al-Sawy menjawab (Fatwa No. 82012 tanggal 1 Agustus 2010) bahwa jika alternatif tersedia dari negara Islam atau damai, seseorang harus berhati-hati dan tidak mencari pengganti, dan jika tidak, biarkan membeli barang yang sah dari siapa pun yang diinginkan."
