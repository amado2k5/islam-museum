summary:
  ar: "منظومة الشاطبي في القراءات السبع، المعروفة بالشاطبية، والتي يذكر متن الطبعة الحديثة أنها جمعت ما تواتر عن القراء السبعة نافع وابن كثير وأبي عمرو وابن عامر وعاصم وحمزة والكسائي؛ وقد نُسب إلى ناظمها في هذه الطبعة وفاته سنة 590هـ {cite:matn-shatibiyya-ghawthani-2010 p.1}."
  en: "Al-Shatibi's verse treatise on the seven canonical readings, known as al-Shatibiyya; the modern edition of its text states that it gathers the transmissions of the seven readers and gives the author's death as 590 AH {cite:matn-shatibiyya-ghawthani-2010 p.1}."
