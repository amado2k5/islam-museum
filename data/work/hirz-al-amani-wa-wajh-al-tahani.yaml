label: { ar: "حرز الأماني ووجه التهاني ⁦(الشاطبية)⁩", en: "Hirz al-Amani wa-Wajh al-Tahani (al-Shatibiyya)", es: "Hirz al-Amani wa-Wajh al-Tahani (al-Shatibiyya)", fr: "Hirz al-Amani wa-Wajh al-Tahani (al-Shatibiyya)", ur: "ہرز الامانی و وجح التہانی ⁦(الشاطبیہ)⁩", tr: "Dilek ve Tebrikler (Al-Shatibiyyah)", id: "Harapan dan Ucapan Selamat (Al-Shatibiyyah)" }
summary:
  ar: "منظومة الشاطبي في القراءات السبع، المعروفة بالشاطبية، والتي يذكر متن الطبعة الحديثة أنها جمعت ما تواتر عن القراء السبعة نافع وابن كثير وأبي عمرو وابن عامر وعاصم وحمزة والكسائي؛ وقد نُسب إلى ناظمها في هذه الطبعة وفاته سنة 590هـ {cite:matn-shatibiyya-ghawthani-2010 p.1}."
  en: "Al-Shatibi's verse treatise on the seven canonical readings, known as al-Shatibiyya; the modern edition of its text states that it gathers the transmissions of the seven readers and gives the author's death as 590 AH {cite:matn-shatibiyya-ghawthani-2010 p.1}."
  es: "El tratado en verso de Al-Shatibi sobre las siete lecturas canónicas, conocido como al-Shatibiyya; la edición moderna de su texto afirma que reúne las transmisiones de los siete lectores y da la muerte del autor como 590 AH {cite:matn-shatibiyya-ghawthani-2010 p.1}."
  fr: "Le traité en vers d'Al-Shatibi sur les sept lectures canoniques, connu sous le nom d'al-Shatibiyya; l'édition moderne de son texte indique qu'il rassemble les transmissions des sept lecteurs et donne la mort de l'auteur en 590 AH {cite:matn-shatibiyya-ghawthani-2010 p.1}."
  ur: "الشاطبی کا سات کنونیکل ریڈنگز پر آیت کا مقالہ، جسے الشاطبیہ کہا جاتا ہے۔ اس کے متن کے جدید ایڈیشن میں کہا گیا ہے کہ اس میں سات قارئین کی نقلیں جمع کی گئی ہیں اور مصنف کی وفات 590 ہجری بتائی گئی ہے۔"
  tr: "Al-Shatibi'nin Yedi Okumada Şiiri olan Al-Shatibiyyah adlı şiir, modern baskıda yedi şiirci Nafi', İbn Kathir, Ebu Amr, İbn Amir, Asim, Hamza ve El-Kisai'nin mutevatir anlatımlarını topladığı belirtilir; bu baskının yazarı 590 Hicri yılında vefat etmiştir {cite:matn-shatibiyya-ghawthani-2010 s.1}."
  id: "Puisi Al-Shatibi dalam Tujuh Bacaan, yang dikenal sebagai Al-Shatibiyyah, yang disebutkan dalam edisi modern sebagai kumpulan narasi mutawatir dari tujuh pembaca Nafi', Ibn Kathir, Abu Amr, Ibn Amir, Asim, Hamza, dan Al-Kisai; penulis edisi ini dikaitkan dengan kematiannya pada tahun 590 H {cite:matn-shatibiyya-ghawthani-2010 hlm.1}."
