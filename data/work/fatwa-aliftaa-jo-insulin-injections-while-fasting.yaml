id: work/fatwa-aliftaa-jo-insulin-injections-while-fasting
class: work
kind: fatwa
label: { ar: "إبرة الأنسولين للصائم", en: "Insulin injections while fasting", ur: "روزے میں انسولین کا انجکشن", es: "Inyecciones de insulina en ayunas", fr: "Injections d'insuline à jeun" }
summary:
  ar: "سؤال عن إبرة الأنسولين للصائم، أجابت فيه دائرة الإفتاء العام الأردنية بأنها لا تفطر لأنها تحت الجلد وغير نافذة إلى الجوف. أجابت الدائرة بأن إبرة الأنسولين لا تفطر. وعللت ذلك بأنها تحت الجلد وغير نافذة إلى الجوف."
  en: "A question about insulin injections while fasting, in which Jordan's General Iftaa Department answered that they do not break the fast because they go under the skin and do not reach the interior. The Department answered that an insulin injection does not break the fast. It explained that the injection is under the skin and does not pass into the body's interior."
  ur: "روزے میں انسولین کا انجکشن کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ روزہ نہیں توڑتا کیونکہ یہ جلد کے نیچے لگتا ہے اور جوف تک نہیں پہنچتا۔ ڈیپارٹمنٹ نے جواب دیا کہ انسولین کا انجکشن روزہ نہیں توڑتا۔ اس نے وجہ یہ بتائی کہ یہ جلد کے نیچے لگتا ہے اور جوف تک نہیں پہنچتا۔"
  es: "Una pregunta sobre las inyecciones de insulina durante el ayuno, a la que el Departamento General de Iftar de Jordania respondió que no rompen el ayuno porque se administran bajo la piel y no llegan al interior del cuerpo. El Departamento explicó que una inyección de insulina no rompe el ayuno. Aclaró que la inyección se administra bajo la piel y no penetra en el interior del organismo."
  fr: "Une question concernant les injections d'insuline pendant le jeûne a été posée. Le Département général de la Iftaa en Jordanie a répondu que ces injections ne rompent pas le jeûne car elles sont administrées sous la peau et ne pénètrent pas dans l'organisme. Le Département a expliqué qu'une injection d'insuline ne rompt pas le jeûne, car elle est administrée sous la peau et ne pénètre pas dans le corps."
