id: work/fatwa-aliftaa-jo-insulin-injections-while-fasting
class: work
kind: fatwa
label: { ar: "إبرة الأنسولين للصائم", en: "Insulin injections while fasting", ur: "روزے میں انسولین کا انجکشن" }
summary:
  ar: "سؤال عن إبرة الأنسولين للصائم، أجابت فيه دائرة الإفتاء العام الأردنية بأنها لا تفطر لأنها تحت الجلد وغير نافذة إلى الجوف. أجابت الدائرة بأن إبرة الأنسولين لا تفطر. وعللت ذلك بأنها تحت الجلد وغير نافذة إلى الجوف."
  en: "A question about insulin injections while fasting, in which Jordan's General Iftaa Department answered that they do not break the fast because they go under the skin and do not reach the interior. The Department answered that an insulin injection does not break the fast. It explained that the injection is under the skin and does not pass into the body's interior."
  ur: "روزے میں انسولین کا انجکشن کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ روزہ نہیں توڑتا کیونکہ یہ جلد کے نیچے لگتا ہے اور جوف تک نہیں پہنچتا۔ ڈیپارٹمنٹ نے جواب دیا کہ انسولین کا انجکشن روزہ نہیں توڑتا۔ اس نے وجہ یہ بتائی کہ یہ جلد کے نیچے لگتا ہے اور جوف تک نہیں پہنچتا۔"
