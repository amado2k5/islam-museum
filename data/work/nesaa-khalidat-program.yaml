label:
  ar: "نساء خالدات ⁦(برنامج تلفزيوني)⁩"
  en: "Nisa' Khalidat, Immortal Women (television programme)"
  ur: "نساء خالدات: لازوال خواتین ⁦(ٹیلی وژن پروگرام)⁩"
summary:
  ar: "برنامج تلفزيوني لطارق السويدان يحفظ منه أرشيف أسابيل ثلاثين ملفًا، يروي في كل حلقة سيرة امرأة أو امرأتين من تاريخ الأنبياء والتاريخ الإسلامي: النساء حول إبراهيم وموسى وسليمان، وأزواج النبي وبناته، والصحابيات، ونساء البلاطين الأموي والعباسي، ويختم كل قصة بالدروس التي يستخلصها منها."
  en: "A television programme by Tareq al-Suwaidan, thirty files of which are kept in the Assabile archive; each episode tells the life of one or two women of sacred and Islamic history, from the women around Abraham, Moses and Solomon to the Prophet's wives and daughters, women Companions and women of the Umayyad and Abbasid courts, and closes with the lessons he draws from it."
  ur: "طارق السویدان کا ٹیلی وژن پروگرام جس کی تیس فائلیں اسابیل آرکائیو میں محفوظ ہیں؛ ہر قسط انبیا کی تاریخ اور اسلامی تاریخ کی ایک یا دو خواتین کی زندگی بیان کرتی ہے، ابراہیم، موسیٰ اور سلیمان کے گرد کی خواتین سے لے کر نبی کی ازواج اور بیٹیوں، صحابیات، اور اموی و عباسی درباروں کی خواتین تک، اور آخر میں ان سے حاصل ہونے والے اسباق بیان کرتی ہے۔"
