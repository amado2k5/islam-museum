summary:
  ar: "سائل سأل عن الاحتفال بنصر أكتوبر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22100)⁩ أن الاحتفال المذكور يعد من الأمور المشروعة المستحبة ففيه إحياء لذكرى يوم من أيام العزة والكرامة على حد تعبير الجواب الذي بيّن ضوابطه."
  en: "A questioner asked about celebrating the October victory. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22100) answered that the celebration is among lawful, recommended matters — it revives the memory of a day of honour and dignity, in the answer's wording — with the controls the answer sets out."
  ur: "ایک سائل نے اکتوبر کی فتح منانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22100)⁩ نے جواب دیا کہ یہ جشن جائز اور مستحب کاموں میں ہے کیونکہ اس میں عزت اور وقار کے دن کی یاد تازہ ہوتی ہے — جواب کے الفاظ کے مطابق — جواب میں اس کے ضوابط بھی بیان ہوئے۔"
