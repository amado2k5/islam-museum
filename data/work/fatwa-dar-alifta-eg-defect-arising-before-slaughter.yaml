id: work/fatwa-dar-alifta-eg-defect-arising-before-slaughter
class: work
kind: fatwa
label: { ar: "حكم التضحية بماشية طرأ عليها عيب مؤثر قبيل ذبحها", en: "Sacrificing livestock struck by a defect shortly before slaughter", ur: "ذبح سے پہلے جانور میں عیب آ جانے پر قربانی", es: "Sacrificio de ganado afectado por un defecto poco antes del sacrificio.", fr: "Sacrifier le bétail atteint d'un défaut peu avant l'abattage", tr: "Önemli bir kusuru olan bir hayvanın kesilmeden önce kurban edilmesine ilişkin karar", id: "Putusan tentang pengorbanan ternak yang memiliki cacat signifikan sebelum disembelih" }
summary:
  ar: "سائل سأل عن التضحية بماشية طرأ عليها عيب قبيل ذبحها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20801)⁩ أنه ما دام العيب الذي طرأ على الأضحية ليس مؤثرًا في اللحم ولا فاحشًا فتفصيل حكمها في الجواب."
  en: "A questioner asked about sacrificing livestock on which a defect appeared shortly before slaughter. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20801) answered that so long as the defect does not affect the meat and is not gross, the ruling is as the answer details."
  ur: "ایک سائل نے اس جانور کی قربانی کا حکم پوچھا جس میں ذبح سے پہلے عیب آ گیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20801)⁩ نے جواب دیا کہ جب تک عیب گوشت کو متاثر نہ کرے اور فاحش نہ ہو اس کا حکم جواب میں ہے۔"
  es: "Un consultante preguntó sobre el sacrificio de ganado que presentaba un defecto poco antes de la matanza. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20801) respondió que, siempre y cuando el defecto no afecte la carne y no sea grave, la norma es la que se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le sacrifice d'un animal présentant un défaut apparu peu avant l'abattage. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20801) a répondu que, tant que le défaut n'altère pas la qualité de la viande et n'est pas manifestement grave, la décision est conforme aux précisions apportées dans la réponse."
  tr: "Bir soru soran kişi, kesim öncesinde kusuru olan sığırların kurban edilmesi hakkında bilgi verdi. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20801), kurbanda meydana gelen kusur eti etkilemediği ve müstehcen olmadığı sürece, ayrıntılı hükmün cevapta verildiğini söyledi."
  id: "Seorang penanya menanyakan tentang pengorbanan sapi yang memiliki cacat sebelum disembelih. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20801) menjawab bahwa selama cacat yang terjadi dalam pengorbanan tidak memengaruhi daging maupun cabul, maka putusan rinci diberikan dalam jawaban."
