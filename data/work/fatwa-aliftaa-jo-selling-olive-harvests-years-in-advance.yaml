id: work/fatwa-aliftaa-jo-selling-olive-harvests-years-in-advance
class: work
kind: fatwa
label: { ar: "بيع ثمار الزيتون لخمس سنوات قادمة", en: "Selling olive harvests for five years ahead", ur: "زیتون کی آئندہ پانچ برس کی فصل بیچنا" }
summary:
  ar: "سؤال عن بيع (تضمين) ثمار الزيتون لخمس سنوات قادمة بثمن محدد مسبقًا، أجابت فيه دائرة الإفتاء العام الأردنية بأن الفقهاء اتفقوا على عدم جواز بيع الثمر لسنتين فأكثر لأنه معدوم عند العقد. أجابت الدائرة بأن الفقهاء اتفقوا على أنه لا يجوز بيع الثمر لسنتين فأكثر، لأن الثمر معدوم وقت العقد، وبيع المعدوم باطل بالنص والإجماع. واستندت إلى حديث جابر بن عبد الله الذي رواه مسلم في النهي عن المعاومة، وهي بيع الثمار لسنين. ونقلت قول النووي في المجموع شرح المهذب إن بيع المعدوم باطل بالإجماع، وإن ابن المنذر وغيره نقلوا إجماع المسلمين على بطلان بيع الثمرة سنتين ونحو ذلك. وخلصت إلى أنه لا يجوز بيع الثمر لسنتين فأكثر."
  en: "A question about selling (leasing out) an olive harvest for the next five years at a price fixed in advance, in which Jordan's General Iftaa Department answered that jurists agree that selling fruit for two years or more is not permitted, because the fruit does not exist at the time of the contract. The Department answered that jurists agree that fruit may not be sold for two years or more, because the fruit does not exist at the time of the contract, and the sale of something non-existent is void by text and consensus. It relied on the hadith of Jabir ibn Abd Allah, reported by Muslim, forbidding mu'awama, the sale of fruit for years ahead. It quoted al-Nawawi in al-Majmu Sharh al-Muhadhdhab that the sale of something non-existent is void by consensus, and that Ibn al-Mundhir and others reported the Muslims' consensus that selling fruit for two years or the like is void. It concluded that fruit may not be sold for two years or more."
  ur: "زیتون کی فصل کو آئندہ پانچ برس کے لیے پہلے سے طے شدہ قیمت پر بیچنے (تضمین) کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ فقہا کا اتفاق ہے کہ دو یا زیادہ برسوں کے لیے پھل بیچنا جائز نہیں، کیونکہ معاہدے کے وقت پھل موجود نہیں ہوتا۔ ڈیپارٹمنٹ نے جواب دیا کہ فقہا کا اتفاق ہے کہ دو یا زیادہ برسوں کے لیے پھل نہیں بیچا جا سکتا، کیونکہ معاہدے کے وقت پھل معدوم ہوتا ہے، اور معدوم کی بیع نص اور اجماع سے باطل ہے۔ اس نے جابر بن عبد اللہ کی اس حدیث پر انحصار کیا جسے مسلم نے روایت کیا، جس میں معاومہ، یعنی کئی برسوں کے لیے پھل بیچنے، سے منع کیا گیا ہے۔ اس نے المجموع شرح المہذب میں نووی کا قول نقل کیا کہ معدوم کی بیع بالاجماع باطل ہے، اور ابن المنذر وغیرہ نے دو برس یا اس جیسی مدت کے لیے پھل بیچنے کے باطل ہونے پر مسلمانوں کا اجماع نقل کیا ہے۔ اس نے نتیجہ نکالا کہ دو یا زیادہ برسوں کے لیے پھل بیچنا جائز نہیں۔"
