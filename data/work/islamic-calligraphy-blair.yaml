label: { ar: "الخط الإسلامي ⁦(شيلا بلير)⁩", en: "Islamic Calligraphy (Sheila Blair)", ur: "اسلامی خطاطی ⁦(شیلا بلیئر)⁩", es: "Caligrafía islámica (Sheila Blair)", fr: "Calligraphie islamique (Sheila Blair)", tr: "İslami Hat Sanatı (Sheila Blair)", id: "Kaligrafi Islam (Sheila Blair)" }
summary:
  ar: "كتاب شيلا بلير (2006) يقدم أول مرجع شامل لفن الكتابة الجميلة بالحرف العربي من القرن السابع إلى اليوم، ويقترح مصطلحات موحدة لوصف الأقلام والأساليب {cite:blair-islamic-calligraphy-2006 p. 3}."
  en: "Sheila Blair's book (2006), presented as the first reference work on the art of beautiful writing in Arabic script from the seventh century to the present, proposing a standard terminology for scripts and styles {cite:blair-islamic-calligraphy-2006 p. 3}."
  ur: "شیلا بلیئر کی کتاب (2006)، جو ساتویں صدی سے آج تک عربی رسم الخط میں خوش نویسی کے فن پر پہلی جامع حوالہ جاتی کتاب کے طور پر پیش کی گئی اور قلموں اور اسالیب کے لیے یکساں اصطلاحات تجویز کرتی ہے {cite:blair-islamic-calligraphy-2006 p. 3}۔"
  es: "El libro de Sheila Blair (2006), presentado como la primera obra de referencia sobre el arte de la escritura bella en escritura árabe desde el siglo VII hasta la actualidad, propone una terminología estándar para escrituras y estilos {cite:blair-islamic-calligraphy-2006 p. 3}."
  fr: "Le livre de Sheila Blair (2006), présenté comme le premier ouvrage de référence sur l'art de la belle écriture en caractères arabes du VIIe siècle à nos jours, propose une terminologie standard pour les écritures et les styles {cite:blair-islamic-calligraphy-2006 p. 3}."
  tr: "Sheila Blair'in kitabı (2006), yedinci yüzyıldan günümüze kadar olan ince Arap kaligrafi sanatına dair ilk kapsamlı referansı sunar ve kalemleri ve stilleri tanımlamak için birleşik terimler önerir {cite:Blair-Islamic-calligraphy-2006 s. 3}."
  id: "Buku Sheila Blair (2006) memberikan referensi komprehensif pertama tentang seni kaligrafi Arab halus dari abad ketujuh hingga sekarang dan mengusulkan istilah terpadu untuk menggambarkan pena dan gaya {cite:Blair-Islamic-calligraphy-2006 hlm. 3}."
