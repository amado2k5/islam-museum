label: { ar: "بيان المقصود من عبارة حاضري المسجد الحرام", en: "Who are 'those present at the Sacred Mosque'?", ur: "«حاضری المسجد الحرام» سے کیا مراد ہے", es: "¿Quiénes son \"los presentes en la Mezquita Sagrada\"?", fr: "Qui sont « ceux qui sont présents à la Mosquée sacrée » ?", tr: "'Büyük Camii katılımcıları' ifadesinin anlamının netleştirilmesi", id: "Penjelasan makna frasa 'pengunjung Masjid Agung'" }
summary:
  ar: "سائل سأل عن المقصود بعبارة حاضري المسجد الحرام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20681)⁩ أن أهل مكة هم حاضرو المسجد الحرام باتفاق ومن ثم لا حرج شرعًا في الإحرام بالعمرة في أشهر الحج من ميقاتهم على ما فصّل الجواب."
  en: "A questioner asked who counts as 'those present at the Sacred Mosque'. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20681) answered that the people of Mecca are so described by agreement; hence there is no blame in entering ihram for umrah in the Hajj months from their miqat — as the answer details."
  ur: "ایک سائل نے «حاضری مسجد حرام» کی تعریف پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20681)⁩ نے جواب دیا کہ اتفاق سے اہل مکہ ہی ہیں اور حج کے مہینوں میں ان کے میقات سے عمرہ کا احرام جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó quiénes se consideran \"los presentes en la Mezquita Sagrada\". El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20681) respondió que los habitantes de La Meca son descritos así por consenso; por lo tanto, no hay culpa alguna en entrar en estado de ihram para la umrah durante los meses del Hajj desde su miqat, como se detalla en la respuesta."
  fr: "Un internaute a demandé qui sont considérés comme « les personnes présentes à la Mosquée sacrée ». La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20681) a répondu que les habitants de La Mecque sont ainsi désignés par consensus; par conséquent, il n’y a aucun reproche à faire à ceux qui entrent en état d’ihram pour la umra pendant les mois du Hajj depuis leur miqat, comme le précise la réponse."
  tr: "Bir soru soran kişi, 'Mescid-i katılımcıları' ifadesinin ne anlama geldiğini sordu. Mısır Dar el-İftası (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 20681), Mekke halkının Mescid-Camii'de anlaşmayla bulunanlar olduğunu ve bu nedenle hec aylarında mikatlarından Umre için ihram etmenin dini bir zararı olmadığını yanıtladı."
  id: "Seorang penanya bertanya apa arti frasa 'para tamu Masjid Agung.' Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20681) menjawab bahwa masyarakat Mekah adalah mereka yang hadir di Masjid Agung berdasarkan kesepakatan, sehingga tidak ada kerugian agama dalam melaksanakan Ihram untuk Umrah selama bulan-bulan Haji dari miqat mereka, seperti yang dijelaskan dalam jawaban."
