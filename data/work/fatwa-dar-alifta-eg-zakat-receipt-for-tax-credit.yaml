id: work/fatwa-dar-alifta-eg-zakat-receipt-for-tax-credit
class: work
kind: fatwa
label: { ar: "حكم تقديم إيصال دفع الزكاة للضرائب لتخفيض قيمتها", en: "Submitting a zakat receipt to the tax office to reduce tax", ur: "ٹیکس کم کرانے کے لیے زکات کی رسید جمع کرانا", es: "Presentar un recibo de zakat a la oficina de impuestos para reducir los impuestos", fr: "Soumettre un reçu de zakat au bureau des impôts pour réduire les impôts", tr: "Vergilerin değerini düşürmek için zekat ödeme makbuzu sunulmasına karar", id: "Putusan tentang penyerahan tanda pembayaran Zakat untuk pajak guna mengurangi nilainya" }
summary:
  ar: "سائل سأل عن تقديم إيصال الزكاة لجهة الضرائب لخصم نسبة ما دفع منها من الضرائب. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22030)⁩ أن ذلك جائز شرعًا بتحديد من الجهات المختصة على ما فصّل الجواب."
  en: "A questioner asked about submitting a zakat receipt to the tax authority to deduct part of what he paid in zakat from his taxes. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22030) answered that this is lawful under the rules set by the competent authorities, as the answer details."
  ur: "ایک سائل نے زکات کی رقم کی کٹوتی کے لیے ٹیکس ادارے کو زکات کی رسید پیش کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22030)⁩ نے جواب دیا کہ متعلقہ اداروں کی مقرر کردہ ضوابط کے تحت یہ جائز ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de presentar un recibo de zakat a la autoridad tributaria para deducir parte del zakat pagado de sus impuestos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22030) respondió que esto es lícito según las normas establecidas por las autoridades competentes, tal como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il était possible de présenter un reçu de zakat à l'administration fiscale afin de déduire une partie du montant versé de ses impôts. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22030) a répondu que cela était licite conformément aux règles établies par les autorités compétentes, comme le précise la réponse."
  tr: "Bir soru soran, ödenen vergilerin bir yüzdesinin düşülmesi için vergi dairesine zekat makbuzu sunma hakkında bilgi verdi. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22030), yanıtta belirtildiği gibi, yetkili makamlarca belirtilen dini olarak bunun mücaiz olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang penyerahan kuitansi zakat kepada otoritas pajak untuk mengurangi persentase dari pajak yang telah dibayarkan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22030) menjawab bahwa hal ini diperbolehkan secara agama sebagaimana ditentukan oleh otoritas yang berwenang, sebagaimana dijelaskan dalam jawaban."
