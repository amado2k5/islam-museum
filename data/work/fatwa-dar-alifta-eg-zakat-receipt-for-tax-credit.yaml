id: work/fatwa-dar-alifta-eg-zakat-receipt-for-tax-credit
class: work
kind: fatwa
label: { ar: "حكم تقديم إيصال دفع الزكاة للضرائب لتخفيض قيمتها", en: "Submitting a zakat receipt to the tax office to reduce tax", ur: "ٹیکس کم کرانے کے لیے زکات کی رسید جمع کرانا" }
summary:
  ar: "سائل سأل عن تقديم إيصال الزكاة لجهة الضرائب لخصم نسبة ما دفع منها من الضرائب. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22030)⁩ أن ذلك جائز شرعًا بتحديد من الجهات المختصة على ما فصّل الجواب."
  en: "A questioner asked about submitting a zakat receipt to the tax authority to deduct part of what he paid in zakat from his taxes. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22030) answered that this is lawful under the rules set by the competent authorities, as the answer details."
  ur: "ایک سائل نے زکات کی رقم کی کٹوتی کے لیے ٹیکس ادارے کو زکات کی رسید پیش کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22030)⁩ نے جواب دیا کہ متعلقہ اداروں کی مقرر کردہ ضوابط کے تحت یہ جائز ہے، جیسا کہ جواب میں تفصیل ہے۔"
