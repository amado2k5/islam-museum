label: { ar: "طريق الإسلام", en: "Islamway", ur: "طریق الاسلام (Islamway)" }
summary:
  ar: "موقع إسلامي متعدد اللغات اشتهر بالصوتيات: الخطب والدروس والتلاوات والأناشيد، ومعها الفتاوى والمقالات والكتب؛ بدأه شخصان أواخر 1998 باسم «The Islamway Radio»، ويقول إن فريقه بلغ أكثر من 150 متطوعًا، وإن فيه 96,648 خطبة ودرسًا لـ794 عالمًا وداعية و35,917 تلاوة لـ351 قارئًا ⁦(أرقام الموقع في 2023)⁩."
  en: "A multilingual Islamic website known for its audio: sermons, lessons, recitations and nasheeds, with fatwas, articles and books; it was begun by two people in late 1998 as 'The Islamway Radio', and says its team has grown to more than 150 volunteers and that it holds 96,648 sermons and lessons by 794 scholars and preachers and 35,917 recitations by 351 reciters (the site's figures, 2023)."
  ur: "کثیر لسانی اسلامی ویب سائٹ جو صوتیات کے لیے مشہور ہے: خطبات، دروس، تلاوتیں اور نشیدیں، ساتھ فتاویٰ، مضامین اور کتابیں؛ 1998 کے آخر میں دو افراد نے «The Islamway Radio» کے نام سے شروع کی؛ اس کے بقول ٹیم 150 سے زیادہ رضاکاروں تک پہنچی، اور اس میں 794 علما و داعیوں کے 96,648 خطبات و دروس اور 351 قراء کی 35,917 تلاوتیں ہیں ⁦(سائٹ کے 2023 کے اعداد)⁩۔"
