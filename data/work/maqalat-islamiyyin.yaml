summary:
  ar: "كتاب لأبي الحسن الأشعري يعرض أقوال الفرق الإسلامية ومقالات المتكلمين، ويختم جزؤه الأول بحكاية جملة قول أصحاب الحديث وأهل السنة ثم يقول إنه يذهب إليها."
  en: "A book by Abu al-Hasan al-Ash'ari setting out the positions of the Muslim sects and the theologians, whose first volume closes with a report of the position of the hadith scholars and Ahl al-Sunna that he then says he holds."
  es: "Un libro de Abu al-Hasan al-Ash'ari que expone las posturas de las sectas musulmanas y los teólogos, cuyo primer volumen concluye con un informe sobre la posición de los eruditos del hadiz y de Ahl al-Sunna, que él afirma sostener."
  fr: "Un livre d'Abu al-Hasan al-Ash'ari exposant les positions des sectes musulmanes et des théologiens, dont le premier volume se termine par un exposé de la position des spécialistes du hadith et des Ahl al-Sunna, position qu'il affirme ensuite défendre."
  ur: "ابو الحسن اشعری کی ایک کتاب جس میں مسلم فرقوں اور علمائے کرام کے موقف کو بیان کیا گیا ہے، جس کی پہلی جلد علماء حدیث اور اہل سنت کے موقف کی رپورٹ کے ساتھ ختم ہوتی ہے جس کے بعد وہ کہتے ہیں کہ ان کے پاس ہے۔"
