summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩: الموافقة بعد تعديلات على مشاريع الموسوعة الفقهية الاقتصادية ومعجم المصطلحات الفقهية ومعلمة القواعد الفقهية ومدونة أدلة الأحكام الفقهية وإحياء التراث الفقهي واللوائح المالية لها."
  en: "IIFA's third-session resolution (Amman, October 1986) approving, with amendments, the Academy's scholarly projects: the economic fiqh encyclopedia, the dictionary of fiqh terms, the fiqh-rules reference, the codification of fiqh-ruling evidences, the revival of fiqh heritage, and their financial regulations."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد ⁦(امان، اکتوبر 1986ء)⁩: معاشی فقہی دائرۃ المعارف، فقہی اصطلاحات کا معجم، فقہی قواعد، ادلہ احکام کی مدونہ اور فقہی ورثے کی احیاء کے منصوبے منظور کیے۔"
  es: "Resolución de la tercera sesión de la IIFA (Amán, octubre de 1986) que aprueba, con enmiendas, los proyectos académicos de la Academia: la enciclopedia de fiqh económico, el diccionario de términos de fiqh, la referencia de reglas de fiqh, la codificación de pruebas de decisiones de fiqh, la recuperación del patrimonio del fiqh y sus reglamentos financieros."
  fr: "Résolution de la troisième session de l'IIFA (Amman, octobre 1986) approuvant, avec des amendements, les projets scientifiques de l'Académie: l'encyclopédie économique du fiqh, le dictionnaire des termes du fiqh, le répertoire des règles du fiqh, la codification des preuves de jurisprudence du fiqh, la renaissance du patrimoine du fiqh et leurs réglementations financières."
  tr: "Uluslararası İslami Fiqh Akademisi'nin üçüncü oturumunda (Amman, Ekim 1986): Ekonomik Hukuk Ansiklopedisi taslağı, Fıkıh Terimleri Sözlüğü, Fıkıh Kuralları Dönüm Noktası, Fıkıh Kararları Rehberleri Kodu, Fıkıh Mirasının Canlandırılması ve mali düzenlemeleri değişiklikler sonrası onaylanmıştır."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi ketiganya (Amman, Oktober 1986): Persetujuan, setelah amandemen, atas rancangan Ensiklopedia Fiqh Ekonomi, Kamus Istilah Yurisprudensi, Landmark Aturan Yurisprusi, Kode Panduan Keputusan Yurisprudensi, Kebangkitan Warisan Yurisprudensi, dan peraturan keuangannya."
