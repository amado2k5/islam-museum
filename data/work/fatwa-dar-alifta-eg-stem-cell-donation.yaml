id: work/fatwa-dar-alifta-eg-stem-cell-donation
class: work
kind: fatwa
label: { ar: "حكم التبرع بالخلايا الجذعية لأغراض علاجية", en: "Donating stem cells for therapeutic purposes", ur: "علاج کے لیے سٹیم سیل کا عطیہ", es: "Donación de células madre con fines terapéuticos", fr: "Donner des cellules souches à des fins thérapeutiques", tr: "Terapötik amaçlarla kök hücre bağışı kararı", id: "Putusan tentang donasi sel punca untuk tujuan terapeutik" }
summary:
  ar: "سائل سأل عن التبرع بالخلايا الجذعية لعلاج المرضى. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22364)⁩ أن تبرع البالغين بالخلايا الجذعية باختيارهم لعلاج المصابين بالأمراض المستعصية أمر جائز ومثاب عليه شرعًا، على ما فصّل الجواب من ضوابط الأذن والأمان."
  en: "A questioner asked about donating stem cells to treat patients. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22364) answered that adults' voluntary donation of stem cells to treat those with intractable diseases is lawful and rewarded in the sharia, under the consent and safety conditions the answer details."
  ur: "ایک سائل نے مریضوں کے علاج کے لیے سٹیم سیل عطیہ کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22364)⁩ نے جواب دیا کہ بالغوں کی اپنی مرضی سے لاعلاج بیماریوں کے علاج کے لیے سٹیم سیل عطیہ کرنا شرعاً جائز اور ثواب کا کام ہے، جواب کے بیان کردہ رضامندی اور حفاظت کے شرائط کے ساتھ۔"
  es: "Un consultante preguntó sobre la donación de células madre para el tratamiento de pacientes. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22364) respondió que la donación voluntaria de células madre por parte de adultos para tratar a personas con enfermedades incurables es lícita y está permitida por la sharia, bajo las condiciones de consentimiento y seguridad que se detallan en la respuesta."
  fr: "Une personne a posé une question concernant le don de cellules souches pour traiter des patients. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22364) a répondu que le don volontaire de cellules souches par des adultes pour traiter des maladies incurables est licite et récompensé par la charia, sous réserve du consentement et des conditions de sécurité détaillés dans la réponse."
  tr: "Bir soru soran kişi, hastaları tedavi etmek için kök hücre bağışı hakkında bilgi verdi. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22364), yetişkinlerin tedavi edilemez hastalıkları olan hastaları tedavi etmeyi tercih ederek kök hücre bağışının izin verilebilir ve dini olarak ödüllendirildiğini, kulak kuralları ve güvenlik ile ilgili yanıtta ayrıntılı olarak belirtildiği gibi, yanıtladı."
  id: "Seorang penanya menanyakan tentang donasi sel punca untuk mengobati pasien. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22364) menjawab bahwa donasi sel punca untuk orang dewasa dengan pilihan mereka untuk mengobati pasien dengan penyakit yang tidak dapat disembuhkan diperbolehkan dan diberi penghargaan secara agama, sebagaimana dijelaskan dalam jawaban mengenai aturan telinga dan keamanan."
