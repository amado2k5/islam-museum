label: { ar: "حكم التبرع بالخلايا الجذعية لأغراض علاجية", en: "Donating stem cells for therapeutic purposes", ur: "علاج کے لیے سٹیم سیل کا عطیہ" }
summary:
  ar: "سائل سأل عن التبرع بالخلايا الجذعية لعلاج المرضى. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22364)⁩ أن تبرع البالغين بالخلايا الجذعية باختيارهم لعلاج المصابين بالأمراض المستعصية أمر جائز ومثاب عليه شرعًا، على ما فصّل الجواب من ضوابط الأذن والأمان."
  en: "A questioner asked about donating stem cells to treat patients. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22364) answered that adults' voluntary donation of stem cells to treat those with intractable diseases is lawful and rewarded in the sharia, under the consent and safety conditions the answer details."
  ur: "ایک سائل نے مریضوں کے علاج کے لیے سٹیم سیل عطیہ کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22364)⁩ نے جواب دیا کہ بالغوں کی اپنی مرضی سے لاعلاج بیماریوں کے علاج کے لیے سٹیم سیل عطیہ کرنا شرعاً جائز اور ثواب کا کام ہے، جواب کے بیان کردہ رضامندی اور حفاظت کے شرائط کے ساتھ۔"
