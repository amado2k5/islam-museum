id: work/fatwa-islamweb-celebrating-a-wedding-with-the-daff-without-extravagance
class: work
kind: fatwa
label: { ar: "استحباب إظهار الفرح في النكاح دون تكلف وإسراف والضرب عليه بالدف", en: "Showing joy at a wedding with the daff, without extravagance", ur: "نکاح میں دف کے ساتھ خوشی کا اظہار، تکلف اور اسراف کے بغیر" }
summary:
  ar: "سؤال من خاطب تريد خطيبته عرسًا شرعيًا غير مختلط في صالة بالدف والأناشيد دون معازف، لكن المعتاد في أعراس النساء عدم الالتزام بالستر وكثرة الغيبة، فسأل على من يكون وزر المخالفات إذا نبّهوا على الستر وترك الغيبة، وخشي أن يكون إنفاق المال على الحفل من صرف الرزق في غير محله، أجاب فيه مركز الفتوى بإسلام ويب بأنه لا حرج في إقامة الاحتفال في الصالة ولا بأس بشيء من اللهو وضرب الدف، مستدلًا بحديث أعلنوا هذا النكاح، وحديث فصل ما بين الحلال والحرام الدف والصوت في النكاح، وأثر الترخيص في اللهو عند العرس، وحديث عائشة ما كان معكم لهو فإن الأنصار يعجبهم اللهو، وبقول أحمد فيما نقله ابن قدامة إنه يستحب إظهار النكاح والضرب عليه بالدف ولا بأس بالغزل في العرس. وقرر أن من يأتي الغيبة أو المخالفات لا شيء على السائل من فعلهم إذا لم يرض به وحذّرهم ونهاهم، ناقلًا كلام ابن تيمية في الفرق بين من سمع المنكر مجتازًا ومن جلس مستمعًا دون إنكار، وأن من شهد المعصية وكرهها كان كمن غاب عنها. وأوصى بالبعد عن التكلف والإسراف بآيات التبذير والإسراف وقول عمر نُهينا عن التكلف وحديث سلمان في النهي عن التكلف للضيف، وبتخفيف التكاليف التي تؤدي إلى الديون."
  en: "A question from a fiancé whose fiancée wants a lawful, unmixed wedding in a hall with the daff and songs and no instruments, where the custom at women's weddings is not to observe modest dress and backbiting is common; he asked who bears the sin of such violations if they warn the guests about dress and backbiting, and feared that spending on the celebration might be misusing the provision God had given him. The fatwa centre of IslamWeb answered that there is no blame in holding the celebration in the hall and no harm in some entertainment and beating the daff, citing the hadith 'announce this marriage', the hadith that what separates the lawful from the unlawful is the daff and the voice at a wedding, the report that entertainment at weddings was permitted, Aisha's hadith 'was there no entertainment with you, for the Ansar love entertainment', and Ahmad's statement, as quoted by Ibn Qudama, that it is recommended to make a marriage public and beat the daff for it and that there is no harm in verse at a wedding. It ruled that those who backbite or commit violations bring nothing upon the questioner if he does not approve and has warned and forbidden them, quoting Ibn Taymiyya on the difference between one who hears wrong while passing by and one who sits listening without objecting, and the saying that whoever witnesses a sin and hates it is as one absent from it. It advised avoiding affectation, extravagance and excess, citing the verses on squandering and extravagance, Umar's words 'we were forbidden affectation' and Salman's hadith forbidding excessive trouble for a guest, and reducing costs that lead to debt."
  ur: "ایک منگیتر کا سوال جس کی منگیتر ہال میں دف اور نظموں کے ساتھ بغیر آلاتِ موسیقی ایک شرعی، غیر مخلوط شادی چاہتی ہے، جہاں عورتوں کی شادیوں میں رواج یہ ہے کہ ساتر لباس کی پابندی نہیں ہوتی اور غیبت عام ہے؛ اس نے پوچھا کہ اگر وہ مہمانوں کو لباس اور غیبت کے بارے میں متنبہ کریں تو ان خلاف ورزیوں کا بوجھ کس پر ہوگا، اور ڈرا کہ تقریب پر خرچ اللہ کے دیے ہوئے رزق کا بے جا استعمال ہو۔ اسلام ویب کے فتویٰ مرکز نے جواب دیا کہ ہال میں تقریب منعقد کرنے میں کوئی حرج نہیں اور کچھ لہو اور دف بجانے میں کوئی مضائقہ نہیں، حدیث 'اس نکاح کا اعلان کرو' سے، اس حدیث سے کہ حلال اور حرام کے درمیان فرق نکاح میں دف اور آواز ہے، شادی میں لہو کی اجازت کے اثر سے، عائشہ کی حدیث 'کیا تمہارے ساتھ لہو نہ تھا، کیونکہ انصار کو لہو پسند ہے' سے، اور احمد کے اس قول سے جو ابن قدامہ نے نقل کیا کہ نکاح کو ظاہر کرنا اور اس پر دف بجانا مستحب ہے اور شادی میں شاعری میں کوئی حرج نہیں۔ اس نے فیصلہ کیا کہ جو غیبت یا خلاف ورزیاں کریں ان کے فعل سے سائل پر کچھ نہیں اگر وہ اس پر راضی نہ ہو اور انہیں متنبہ اور منع کرے، ابن تیمیہ کے اس کلام کو نقل کرتے ہوئے جو گزرتے ہوئے منکر سننے والے اور بغیر انکار بیٹھ کر سننے والے کے فرق کے بارے میں ہے، اور اس قول کو کہ جو گناہ دیکھے اور اسے ناپسند کرے وہ غائب رہنے والے جیسا ہے۔ اس نے تکلف، اسراف اور زیادتی سے بچنے کی نصیحت کی، تبذیر اور اسراف کی آیات، عمر کے الفاظ 'ہمیں تکلف سے منع کیا گیا' اور سلمان کی مہمان کے لیے تکلف سے ممانعت کی حدیث سے، اور قرض تک لے جانے والے اخراجات کم کرنے کی۔"
