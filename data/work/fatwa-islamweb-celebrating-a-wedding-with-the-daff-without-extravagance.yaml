id: work/fatwa-islamweb-celebrating-a-wedding-with-the-daff-without-extravagance
class: work
kind: fatwa
label: { ar: "استحباب إظهار الفرح في النكاح دون تكلف وإسراف والضرب عليه بالدف", en: "Showing joy at a wedding with the daff, without extravagance", ur: "نکاح میں دف کے ساتھ خوشی کا اظہار، تکلف اور اسراف کے بغیر", es: "Mostrar alegría en una boda con narcisos, sin extravagancias.", fr: "Exprimer sa joie à un mariage avec une jonquille, sans extravagance", tr: "Evlilikte sevinç, gösterişli veya gösterişsiz göstermek ve tefle vurmak önerilir", id: "Disarankan untuk menunjukkan kebahagiaan dalam pernikahan tanpa pura-pura atau berlebihan dan memukulnya dengan tamborin" }
summary:
  ar: "سؤال من خاطب تريد خطيبته عرسًا شرعيًا غير مختلط في صالة بالدف والأناشيد دون معازف، لكن المعتاد في أعراس النساء عدم الالتزام بالستر وكثرة الغيبة، فسأل على من يكون وزر المخالفات إذا نبّهوا على الستر وترك الغيبة، وخشي أن يكون إنفاق المال على الحفل من صرف الرزق في غير محله، أجاب فيه مركز الفتوى بإسلام ويب بأنه لا حرج في إقامة الاحتفال في الصالة ولا بأس بشيء من اللهو وضرب الدف، مستدلًا بحديث أعلنوا هذا النكاح، وحديث فصل ما بين الحلال والحرام الدف والصوت في النكاح، وأثر الترخيص في اللهو عند العرس، وحديث عائشة ما كان معكم لهو فإن الأنصار يعجبهم اللهو، وبقول أحمد فيما نقله ابن قدامة إنه يستحب إظهار النكاح والضرب عليه بالدف ولا بأس بالغزل في العرس. وقرر أن من يأتي الغيبة أو المخالفات لا شيء على السائل من فعلهم إذا لم يرض به وحذّرهم ونهاهم، ناقلًا كلام ابن تيمية في الفرق بين من سمع المنكر مجتازًا ومن جلس مستمعًا دون إنكار، وأن من شهد المعصية وكرهها كان كمن غاب عنها. وأوصى بالبعد عن التكلف والإسراف بآيات التبذير والإسراف وقول عمر نُهينا عن التكلف وحديث سلمان في النهي عن التكلف للضيف، وبتخفيف التكاليف التي تؤدي إلى الديون."
  en: "A question from a fiancé whose fiancée wants a lawful, unmixed wedding in a hall with the daff and songs and no instruments, where the custom at women's weddings is not to observe modest dress and backbiting is common; he asked who bears the sin of such violations if they warn the guests about dress and backbiting, and feared that spending on the celebration might be misusing the provision God had given him. The fatwa centre of IslamWeb answered that there is no blame in holding the celebration in the hall and no harm in some entertainment and beating the daff, citing the hadith 'announce this marriage', the hadith that what separates the lawful from the unlawful is the daff and the voice at a wedding, the report that entertainment at weddings was permitted, Aisha's hadith 'was there no entertainment with you, for the Ansar love entertainment', and Ahmad's statement, as quoted by Ibn Qudama, that it is recommended to make a marriage public and beat the daff for it and that there is no harm in verse at a wedding. It ruled that those who backbite or commit violations bring nothing upon the questioner if he does not approve and has warned and forbidden them, quoting Ibn Taymiyya on the difference between one who hears wrong while passing by and one who sits listening without objecting, and the saying that whoever witnesses a sin and hates it is as one absent from it. It advised avoiding affectation, extravagance and excess, citing the verses on squandering and extravagance, Umar's words 'we were forbidden affectation' and Salman's hadith forbidding excessive trouble for a guest, and reducing costs that lead to debt."
  ur: "ایک منگیتر کا سوال جس کی منگیتر ہال میں دف اور نظموں کے ساتھ بغیر آلاتِ موسیقی ایک شرعی، غیر مخلوط شادی چاہتی ہے، جہاں عورتوں کی شادیوں میں رواج یہ ہے کہ ساتر لباس کی پابندی نہیں ہوتی اور غیبت عام ہے؛ اس نے پوچھا کہ اگر وہ مہمانوں کو لباس اور غیبت کے بارے میں متنبہ کریں تو ان خلاف ورزیوں کا بوجھ کس پر ہوگا، اور ڈرا کہ تقریب پر خرچ اللہ کے دیے ہوئے رزق کا بے جا استعمال ہو۔ اسلام ویب کے فتویٰ مرکز نے جواب دیا کہ ہال میں تقریب منعقد کرنے میں کوئی حرج نہیں اور کچھ لہو اور دف بجانے میں کوئی مضائقہ نہیں، حدیث 'اس نکاح کا اعلان کرو' سے، اس حدیث سے کہ حلال اور حرام کے درمیان فرق نکاح میں دف اور آواز ہے، شادی میں لہو کی اجازت کے اثر سے، عائشہ کی حدیث 'کیا تمہارے ساتھ لہو نہ تھا، کیونکہ انصار کو لہو پسند ہے' سے، اور احمد کے اس قول سے جو ابن قدامہ نے نقل کیا کہ نکاح کو ظاہر کرنا اور اس پر دف بجانا مستحب ہے اور شادی میں شاعری میں کوئی حرج نہیں۔ اس نے فیصلہ کیا کہ جو غیبت یا خلاف ورزیاں کریں ان کے فعل سے سائل پر کچھ نہیں اگر وہ اس پر راضی نہ ہو اور انہیں متنبہ اور منع کرے، ابن تیمیہ کے اس کلام کو نقل کرتے ہوئے جو گزرتے ہوئے منکر سننے والے اور بغیر انکار بیٹھ کر سننے والے کے فرق کے بارے میں ہے، اور اس قول کو کہ جو گناہ دیکھے اور اسے ناپسند کرے وہ غائب رہنے والے جیسا ہے۔ اس نے تکلف، اسراف اور زیادتی سے بچنے کی نصیحت کی، تبذیر اور اسراف کی آیات، عمر کے الفاظ 'ہمیں تکلف سے منع کیا گیا' اور سلمان کی مہمان کے لیے تکلف سے ممانعت کی حدیث سے، اور قرض تک لے جانے والے اخراجات کم کرنے کی۔"
  es: "Un prometido, cuya prometida desea una boda legal y sin mezclas en un salón con narcisos y canciones, pero sin instrumentos musicales, donde la costumbre en las bodas de mujeres es no observar vestimenta modesta y la murmuración es común, preguntó quién carga con el pecado de tales violaciones si advierten a los invitados sobre la vestimenta y la murmuración, y temía que gastar en la celebración pudiera ser un mal uso de la provisión que Dios le había dado. El centro de fatwas de IslamWeb respondió que no hay culpa en celebrar la fiesta en el salón y no hay daño en algún entretenimiento y golpear el daff, citando el hadiz \"anuncia este matrimonio\", el hadiz que separa lo lícito de lo ilícito es el daff y la voz en una boda, el informe de que el entretenimiento en las bodas estaba permitido, el hadiz de Aisha \"no hubo entretenimiento contigo, pues a los Ansar les encanta el entretenimiento\", y la declaración de Ahmad, citada por Ibn Qudama, de que es recomendable hacer público un matrimonio y golpear el daff para ello y que no hay daño en el verso en una boda. Dictaminó que aquellos que calumnian o cometen violaciones no traen nada al que pregunta si no aprueba y les ha advertido y prohibido, citando a Ibn Taymiyya sobre la diferencia entre quien oye mal al pasar y quien se sienta a escuchar sin objetar, y el dicho de que quien presencia un pecado y lo odia es como quien está ausente de él. Aconsejaba evitar la afectación, la extravagancia y el exceso, citando los versículos sobre el derroche y la extravagancia, las palabras de Umar \"se nos prohibió la afectación\" y el hadiz de Salman que prohíbe causar molestias excesivas a un huésped, y reducir los gastos que generan deudas."
  fr: "Un fiancé, dont la fiancée souhaite un mariage licite et sans mélange de traditions, dans une salle avec chants et musique traditionnelle (daff), s'interroge sur la responsabilité de sa fiancée. Il se demande qui est coupable de telles transgressions s'il avertit les invités sur la tenue vestimentaire et les médisances, et craint que les dépenses liées à la célébration ne constituent un mauvais usage des ressources divines. Le centre de fatwas d'IslamWeb répond qu'il n'y a aucun blâme à célébrer le mariage dans une salle et aucun mal à proposer quelques divertissements et à jouer du daff. Il cite le hadith « Annoncez ce mariage », le hadith selon lequel ce qui distingue le licite de l'illicite lors d'un mariage est le daff et la voix, le récit autorisant les divertissements aux mariages, le hadith d'Aïcha « N'y avait-il donc aucun divertissement chez vous ? Car les Ansar aiment les divertissements », et la déclaration d'Ahmad, rapportée par Ibn Qudama, selon laquelle il est recommandé de rendre public un mariage et de jouer du daff, et qu'il n'y a aucun mal à réciter des versets lors d'un mariage. Il a été statué que ceux qui médissent ou commettent des infractions n'entraînent aucune responsabilité pour celui qui interroge, s'il ne les approuve pas et les a avertis et interdits. Le texte citait Ibn Taymiyya sur la différence entre celui qui entend un malentendu en passant et celui qui écoute sans protester, ainsi que le dicton selon lequel quiconque est témoin d'un péché et le déteste est comme absent à ce péché. Il était conseillé d'éviter l'affectation, la prodigalité et l'excès, citant les versets sur le gaspillage et la prodigalité, les paroles d'Umar (« l'affectation nous était interdite ») et le hadith de Salman interdisant de causer des désagréments excessifs à un invité, ainsi que la réduction des dépenses susceptibles d'entraîner des dettes."
  tr: "Nişanlısı, müzik aletleri olmadan tef ve şarkıların eşliğinde meşru, karışık olmayan bir düğün isteyen bir talipten gelen soru, ancak kadınların düğünlerinde alışılmış uygulama alçakgönüllülük ve sık sık arkadan iğnemek yerine oturmamaktır. Partiye para harcamanın geçimini sağlamak için kötüye kullanılabileceğinden korkarak örtbas edilmekten ve iğnemekten kaçınılması konusunda uyarıldığında ihlallerden kimin sorumlu olduğunu sordu. Islamweb'deki Fetva Merkezi, kutlamayı salonda yapmanın zararı olmadığını ve biraz eğlencenin de sakınca görmediğini söyledi Küf ve tef çalma, bu evliliği ilan eden hadisleri, helal ile haram arasındaki ayrımı yapan hadisleri, düğünlerde eğlence için izin vermenin etkisini ve Aişe'nin 'Sahip olduğunuz şey eğlence içindir, Ensar için eğlencedir.' Ahmed, İbn Qudame'nin aktardığına göre, evliliğin sergilenmesinin ve tefle vurulmasının tavsiye edildiğini ve düğünlerde kur yapmanın zarar görmediğini söyledi. Geri dönüp gelen veya konuyu ihlal edenlerin, bundan memnun değillerse yaptıklarından sorumlu olmadıklarını hükmetti, onları uyardı ve yasakladı; İbn Teymiye'den alıntı yaptı; yolda kötülük duyanlarla inkar etmeden dinleyenler arasındaki farkı aktardı ve günahı gören ve hoşlanmayan kişinin, günahtan uzak olan gibi olduğunu belirtti. Savurganlık ve gösterişten kaçınılması, Ömer'in savurganlığı yasaklayan ayetleri, Salman'ın misafirler için gösterişin yasaklanması ve borç masraflarının azaltılması ile tavsiye etti."
  id: "Pertanyaan dari seorang pelamar yang tunangannya menginginkan pernikahan yang sah dan tidak campur di aula dengan tamburin dan lagu tanpa alat musik, tetapi praktik umum di pernikahan wanita adalah tidak menjaga kesopanan dan sering mengumpat kasar. Dia bertanya siapa yang bertanggung jawab atas pelanggaran jika mereka memperingatkan agar tidak menutupi dan menghindari fitnah, takut menghabiskan uang untuk pesta bisa disalahgunakan sebagai cara mencari nafkah. Pusat Fatwa di Islamweb menjawab bahwa tidak ada salahnya mengadakan perayaan di aula dan tidak ada salahnya dengan sedikit hiburan dan pemukulan tambur, mengutip hadits yang menyatakan pernikahan ini, hadits yang memisahkan antara halal dan haram, tamburin dan bunyi dalam pernikahan, efek izin dalam hiburan di pernikahan, dan hadits Aisha: 'Apa yang kamu miliki adalah hiburan, untuk hiburan Ansar seperti hiburan.' Ahmad mengatakan seperti yang dilaporkan oleh Ibn Qudamah bahwa disarankan untuk menampilkan pernikahan dan memukulnya dengan tambur dan tidak ada salahnya menggoda di pernikahan. Ia memutuskan bahwa mereka yang menghina atau melanggar masalah tidak bertanggung jawab atas tindakannya jika tidak puas, serta memperingatkan dan melarang mereka, mengutip Ibn Taymiyyah tentang perbedaan antara mereka yang mendengar kesalahan saat lewat dan mereka yang duduk mendengarkan tanpa penyangkalan, dan bahwa siapa pun yang menyaksikan dan tidak menyukai dosa itu sama seperti yang tidak hadir. Ia menyarankan untuk menghindari kemewahan dan pemborosan dengan ayat-ayat kemewahan dan pemborosan, ucapan Umar yang melarang kemewahan, hadits Salman yang melarang kemewahan tamu, dan mengurangi biaya yang menyebabkan utang."
