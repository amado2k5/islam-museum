summary:
  ar: "سائل سأل عن الاحتفال بالمولد النبوي بصنوف الطاعات والعبادات في يوم ميلاده. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22043)⁩ ببيان حكم الاحتفال بهذه المناسبة وكيفيته على ما فصّل الجواب من مشروعية إحياء ذكراه بأنواع القرب."
  en: "A questioner asked about celebrating the Prophet's birthday with kinds of devotion and worship on the day of his birth. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22043) answered by setting out the ruling on marking this occasion and how — the lawfulness of honouring his remembrance with acts of devotion, as the answer details."
  ur: "ایک سائل نے نبی کی ولادت کے دن عبادات اور قربات کے ساتھ میلاد منانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22043)⁩ نے جواب میں اس موقع کو منانے کا حکم اور طریقہ بیان کیا — اس کی یاد کو عبادات سے زندہ رکھنے کی شرعی جواز کے ساتھ۔"
