label: { ar: "حكم الاحتفال بالمولد النبوي الشريف وكيفيته", en: "Celebrating the Prophet's birthday and how", ur: "عید میلاد النبی منانے کا حکم اور طریقہ", es: "Celebrando el cumpleaños del Profeta y cómo", fr: "Célébrer l'anniversaire du Prophète et comment", tr: "Peygamberin Doğum Gününün Kutlanması ve Şekli Hakkında Karar", id: "Putusan tentang Perayaan Hari Ulang Tahun Nabi dan Cara Hidupnya" }
summary:
  ar: "سائل سأل عن الاحتفال بالمولد النبوي بصنوف الطاعات والعبادات في يوم ميلاده. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22043)⁩ ببيان حكم الاحتفال بهذه المناسبة وكيفيته على ما فصّل الجواب من مشروعية إحياء ذكراه بأنواع القرب."
  en: "A questioner asked about celebrating the Prophet's birthday with kinds of devotion and worship on the day of his birth. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22043) answered by setting out the ruling on marking this occasion and how — the lawfulness of honouring his remembrance with acts of devotion, as the answer details."
  ur: "ایک سائل نے نبی کی ولادت کے دن عبادات اور قربات کے ساتھ میلاد منانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22043)⁩ نے جواب میں اس موقع کو منانے کا حکم اور طریقہ بیان کیا — اس کی یاد کو عبادات سے زندہ رکھنے کی شرعی جواز کے ساتھ۔"
  es: "Un consultante preguntó sobre la celebración del cumpleaños del Profeta con actos de devoción y culto en el día de su nacimiento. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22043) respondió exponiendo la normativa sobre la conmemoración de esta ocasión y la licitud de honrar su memoria con actos de devoción, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la célébration de l'anniversaire du Prophète par des actes de dévotion et de culte le jour de sa naissance. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22043) a répondu en exposant la règle relative à la commémoration de cet événement et la manière de l'accomplir: la licéité d'honorer sa mémoire par des actes de dévotion est détaillée dans la réponse."
  tr: "Bir soru soran kişi, Peygamber'in doğum gününü çeşitli itaat ve ibadet eylemleriyle kutlamayı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22043), bu özel günü kutlama kararını ve şeklini çeşitli yakınlık biçimleriyle anmanın izinliliği konusunda ayrıntılı olarak açıkladı."
  id: "Seorang penanya menanyakan tentang merayakan ulang tahun Nabi dengan berbagai tindakan taat dan ibadah pada hari ulang tahunnya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22043) menanggapi dengan memperjelas keputusan perayaan ini dan caranya, serta merinci mengenai kelayakan memperingatinya melalui berbagai bentuk kedekatan."
