id: work/fatwa-aliftaa-jo-zakat-for-funds-supporting-needy-students
class: work
kind: fatwa
label: { ar: "دفع الزكاة لصناديق دعم الطلبة المحتاجين", en: "Giving zakat to funds that support needy students", ur: "ضرورت مند طلبہ کی مدد کرنے والے فنڈز کو زکات دینا" }
summary:
  ar: "سؤال عن صرف الزكاة لصناديق خاصة تدعم الطلبة المحتاجين، أجابت فيه دائرة الإفتاء العام الأردنية بأن الطلاب يُعطون من الزكاة بوصفهم فقراء لا لكونهم طلابًا، بشروط، وأن الصندوق الأمين يجوز توكيله بإيصالها إليهم دون أجرة من الزكاة. أجابت الدائرة بأن مصارف الزكاة محددة في الأصناف الثمانية المذكورة في القرآن، ونقلت عن البيضاوي في تفسيره أن الزكاة لهؤلاء دون غيرهم، فلا يجوز إعطاؤها لغيرهم. وقالت إن الطلاب الفقراء يُعطون منها بوصفهم فقراء لا لكونهم طلابًا، واشترطت لذلك أن يمنعهم طلب العلم من التكسب، وأن يكونوا مجتهدين في دراستهم، ونقلت عن الخطيب الشربيني في مغني المحتاج أن المشتغل بعلم شرعي يمنعه الكسب منه يأخذ من الزكاة. واشترطت أن يكون العلم مما يحقق فروض الكفاية للأمة، وذكرت أنها ترى العلوم الدنيوية الضرورية اليوم كالطب والهندسة والفيزياء ملحقة بالعلوم الشرعية في ذلك، وأن يكون الطالب ممن لا تجب نفقته على المزكي. وقالت إنه يجوز للمزكي أن يوكل شخصًا أو جهة أمينة بتسليم زكاته إلى الطلاب الفقراء، فيعطيهم المال لدفع رسومهم أو يستأذنهم في دفع أقساطهم إلى الجامعة مباشرة. وخلصت إلى جواز دفع الزكاة لهذه الصناديق إن كانت مؤتمنة ولا تأخذ من الزكاة أجرة بل تتبرع بإيصالها، وتوكيلها بإعطائها للطلبة الفقراء المجتهدين."
  en: "A question about giving zakat to private funds that support needy students, in which Jordan's General Iftaa Department answered that students receive zakat as poor people, not as students, under certain conditions, and that a trustworthy fund may be appointed as agent to pass it on to them without taking a fee from the zakat. The Department answered that the recipients of zakat are limited to the eight categories named in the Qur'an, citing al-Baydawi's commentary that zakat is for these and no others, so it may not be given to anyone else. It said poor students receive zakat as poor people, not because they are students, on condition that study prevents them from earning and that they are diligent in it, citing al-Khatib al-Shirbini's Mughni al-Muhtaj that someone occupied with religious learning who cannot also earn a living may take zakat. It added the conditions that the knowledge be of the kind that meets the community's collective needs, which in its view now includes necessary worldly sciences such as medicine, engineering and physics alongside the religious sciences, and that the student not be someone the zakat payer is already obliged to support. It said the zakat payer may appoint a trustworthy person or body as agent to hand the zakat to poor students, either giving them the money to pay their fees or, with their permission, paying their instalments to the university directly. It concluded that zakat may be given to such funds if they are trustworthy and take no fee from it, passing it on voluntarily, and that they may be appointed as agents to give it to poor, diligent students."
  ur: "ضرورت مند طلبہ کی مدد کرنے والے نجی فنڈز کو زکات دینے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ طلبہ کو زکات فقیر ہونے کی بنا پر دی جاتی ہے، طالب علم ہونے کی بنا پر نہیں، اور اس کی کچھ شرطیں ہیں؛ اور امانت دار فنڈ کو زکات سے اجرت لیے بغیر انہیں پہنچانے کا وکیل بنایا جا سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکات کے مصارف قرآن میں مذکور آٹھ اقسام میں محدود ہیں، اور بیضاوی کی تفسیر سے نقل کیا کہ زکات انہی کے لیے ہے، اس لیے ان کے علاوہ کسی کو نہیں دی جا سکتی۔ اس نے کہا کہ غریب طلبہ کو زکات فقیر ہونے کی بنا پر دی جاتی ہے، اس شرط کے ساتھ کہ تعلیم انہیں کمانے سے روکتی ہو اور وہ محنتی ہوں؛ اس نے خطیب شربینی کی مغنی المحتاج سے نقل کیا کہ جو دینی علم میں مشغول ہو اور کمائی اس میں رکاوٹ بنے وہ زکات لے سکتا ہے۔ اس نے یہ شرطیں بھی رکھیں کہ علم ایسا ہو جو امت کی اجتماعی ضرورت پوری کرے، اور اس کی رائے میں آج طب، انجینئرنگ اور فزکس جیسے ضروری دنیوی علوم بھی اس میں دینی علوم کے ساتھ شامل ہیں، اور یہ کہ طالب علم ان لوگوں میں سے نہ ہو جن کا نفقہ زکات دینے والے پر واجب ہے۔ اس نے کہا کہ زکات دینے والا کسی امانت دار شخص یا ادارے کو غریب طلبہ تک زکات پہنچانے کا وکیل بنا سکتا ہے، جو انہیں فیس ادا کرنے کے لیے رقم دے یا ان کی اجازت سے ان کی قسطیں براہ راست یونیورسٹی کو ادا کرے۔ اس نے نتیجہ نکالا کہ اگر یہ فنڈ امانت دار ہوں اور زکات سے اجرت نہ لیں بلکہ رضاکارانہ طور پر پہنچائیں تو انہیں زکات دینا اور غریب محنتی طلبہ تک پہنچانے کا وکیل بنانا جائز ہے۔"
