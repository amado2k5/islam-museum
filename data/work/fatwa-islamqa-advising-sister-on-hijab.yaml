id: work/fatwa-islamqa-advising-sister-on-hijab
class: work
kind: fatwa
label: { ar: "كيف ينصح أخته التي لا تلبس الحجاب؟", en: "A brother advising his sister who does not wear hijab", ur: "بھائی کا اپنی بے حجاب بہن کو نصیحت کرنا" }
summary:
  ar: "أخ يذكر أن أخته البالغة لا تتحجب، وأن أباه، صاحب الأمر في البيت، يريدها كذلك وقد آذاه بسبب نصحه لها، ويسأل هل يأثم وكيف يتعامل معها. أجاب موقع الإسلام سؤال وجواب بأن الأخ لا يأثم بمجرد تبرج أخته البالغة إذا أدى ما عليه من النصح بحسب استطاعته، وأن عليه أن يدعوها بالحكمة والرفق، ويعتني بتقوية إيمانها وتصحيح أفكارها، ويحافظ على صلتها ولا يقطعها."
  en: "A brother says his adult sister does not wear hijab, that their father, who runs the household, wants it so and has mistreated him for advising her, and asks whether he is sinning and how to deal with her. IslamQA answered that a brother does not bear sin merely because his adult sister goes uncovered, provided he has given the advice he is able to give; he should call her with wisdom and gentleness, attend to strengthening her faith and correcting her ideas, and keep up his ties with her rather than cutting them."
  ur: "ایک بھائی بتاتا ہے کہ اس کی بالغ بہن حجاب نہیں کرتی، گھر کا ذمہ دار باپ بھی یہی چاہتا ہے اور نصیحت کرنے پر اس نے بیٹے کو تکلیف دی ہے، اور پوچھتا ہے کہ کیا وہ گناہگار ہے اور کیا کرے۔ اسلام سوال و جواب نے جواب دیا کہ اگر بھائی نے اپنی استطاعت کے مطابق نصیحت کر دی ہے تو محض بہن کی بے پردگی سے وہ گناہگار نہیں؛ اسے حکمت اور نرمی سے دعوت دینی چاہیے، اس کے ایمان کو مضبوط کرنے اور خیالات درست کرنے پر توجہ دے، اور تعلق قائم رکھے، توڑے نہیں۔"
