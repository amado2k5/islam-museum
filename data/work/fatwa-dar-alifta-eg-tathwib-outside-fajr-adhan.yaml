id: work/fatwa-dar-alifta-eg-tathwib-outside-fajr-adhan
class: work
kind: fatwa
label: { ar: "حكم التثويب في غير أذان الفجر", en: "The tathwib — 'prayer is better than sleep' — outside the fajr call", ur: "فجر کے علاوہ اذان میں تثویب", es: "El tathwib — 'la oración es mejor que el sueño' — fuera de la llamada del fajr", fr: "Le tathwib — « la prière vaut mieux que le sommeil » — à l'extérieur de l'appel du fajr" }
summary:
  ar: "سائل سأل عن التثويب وهو قول المؤذن الصلاة خير من النوم في غير أذان الفجر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20711)⁩ أن التثويب سنة ثابتة بإقرار النبي وبيّن الجواب محله من الأذان على وجهه."
  en: "A questioner asked about the tathwib — the muezzin's words 'prayer is better than sleep' — outside the fajr call. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20711) answered that it is an established sunna by the Prophet's approval, and the answer sets out its place in the call."
  ur: "ایک سائل نے فجر کے علاوہ اذان میں تثویب یعنی «الصلاة خير من النوم» کہنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20711)⁩ نے جواب دیا کہ یہ ثابت سنت ہے اور اذان میں اس کا مقام جواب میں ہے۔"
  es: "Un interlocutor preguntó acerca del tathwib —las palabras del muecín: «La oración es mejor que dormir»— fuera de la llamada al fajr. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20711) respondió que es una sunna establecida con la aprobación del Profeta, y la respuesta detalla su lugar en la llamada."
  fr: "Un auditeur a posé une question concernant le tathwib — les paroles du muezzin « la prière est meilleure que le sommeil » — prononcées après l'appel à la prière de l'aube (fajr). La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20711) a répondu qu'il s'agit d'une sunna établie, approuvée par le Prophète, et que la réponse précise sa place dans l'appel."
