summary:
  ar: "مذكرة ماجستير في الاقتصاد الإسلامي للطاهر قانة ⁦(جامعة باتنة، 2006–2007، نوقشت 2008)⁩ تدرس أثر نمط الملكية في التوزيع، فتعرض الملكية والتوزيع في الاقتصادين الرأسمالي والاشتراكي ثم في الاقتصاد الإسلامي، وتأخذ بالتقسيم الثلاثي للملكية: خاصة وعامة وملكية دولة، وتنتهي إلى أن تعدد أشكال الملكية هو أساس عدالة التوزيع عند المؤلف. {cite:dawr-tawzii-milkiyya-qana-2007 p.1} {cite:dawr-tawzii-milkiyya-qana-2007 p.12} {cite:dawr-tawzii-milkiyya-qana-2007 p.70} {cite:dawr-tawzii-milkiyya-qana-2007 p.187}"
  en: "An MA dissertation in Islamic economics by al-Tahir Qana (University of Batna, 2006-2007, defended 2008) on how the pattern of property shapes distribution: it sets out property and distribution in the capitalist and socialist economies and then in the Islamic economy, adopts a threefold division of property — private, public and state — and concludes, in the author's view, that multiple forms of property are the basis of just distribution."
  ur: "الطاہر قانہ کا اسلامی معاشیات میں ایم اے مقالہ ⁦(جامعہ باتنہ، 2006–2007، دفاع 2008)⁩ کہ ملکیت کا نمونہ تقسیمِ دولت پر کیسے اثر ڈالتا ہے: اس میں سرمایہ دارانہ اور اشتراکی معیشتوں میں ملکیت اور تقسیم، پھر اسلامی معیشت میں ان کا بیان ہے؛ یہ ملکیت کی تین قسمیں — نجی، عوامی اور ریاستی — اختیار کرتا ہے اور مصنف کی رائے میں اس نتیجے پر پہنچتا ہے کہ ملکیت کی متعدد صورتیں منصفانہ تقسیم کی بنیاد ہیں۔"
  es: "Tesis de maestría en economía islámica de al-Tahir Qana (Universidad de Batna, 2006-2007, defendida en 2008) sobre cómo el modelo de propiedad configura la distribución: expone la propiedad y la distribución en las economías capitalistas y socialistas, y luego en la economía islámica, adopta una división triple de la propiedad —privada, pública y estatal— y concluye, en opinión del autor, que las múltiples formas de propiedad son la base de una distribución justa."
  fr: "Mémoire de maîtrise en économie islamique d'al-Tahir Qana (Université de Batna, 2006-2007, soutenu en 2008) sur la manière dont le modèle de propriété façonne la distribution: il expose la propriété et la distribution dans les économies capitaliste et socialiste, puis dans l'économie islamique, adopte une division tripartite de la propriété — privée, publique et étatique — et conclut, de l'avis de l'auteur, que de multiples formes de propriété sont la base d'une distribution juste."
  tr: "Tahar Qana'nın (Batna Üniversitesi, 2006–2007, 2008'de tartışıldı) İslami ekonomi üzerine yüksek lisans tezi, mülkiyet kalıplarının dağıtım üzerindeki etkisini inceler; kapitalist ve sosyalist ekonomilerde, ardından İslami ekonomide mülkiyet ve dağıtımı sunar. Mülkiyetin üçlü ayrımını benimser: özel, kamu ve devlet mülkiyeti, yazarın dağıtıcı adaletinin temelini çoklu mülkiyet biçimleriyle oluşturduğunu sonucuna varır. {cite:dawr-tawzii-milkiyya-qana-2007 s.1} {cite:dawr-tawzii-milkiyya-qana-2007 s.12} {cite:dawr-tawzii-milkiyya-qana-2007 s.70} {cite:dawr-tawzii-milkiyya-qana-2007 s.187}"
  id: "Disertasi magister ekonomi Islam oleh Tahar Qana (Universitas Batna, 2006–2007, dibahas 2008) meneliti pengaruh pola kepemilikan terhadap distribusi, menampilkan kepemilikan dan distribusi dalam ekonomi kapitalis dan sosialis, kemudian dalam ekonomi Islam. Tesis ini mengadopsi pembagian kepemilikan tripartit: kepemilikan pribadi, publik, dan negara, menyimpulkan bahwa berbagai bentuk kepemilikan adalah dasar keadilan distributif penulis. {cite:dawr-tawzii-milkiyya-qana-2007 hlm.1} {cite:dawr-tawzii-milkiyya-qana-2007 hlm.12} {cite:dawr-tawzii-milkiyya-qana-2007 hlm.70} {cite:dawr-tawzii-milkiyya-qana-2007 hlm.187}"
