label:
  ar: "الدور التوزيعي للملكية في الاقتصاد الإسلامي (دراسة مقارنة)"
  en: "al-Dawr al-Tawzi'i li-l-Milkiyya fi al-Iqtisad al-Islami (The Distributive Role of Property in the Islamic Economy: a Comparative Study)"
  ur: "الدور التوزیعی للملکیہ فی الاقتصاد الاسلامی (دراسہ مقارنہ)"
summary:
  ar: "مذكرة ماجستير في الاقتصاد الإسلامي للطاهر قانة (جامعة باتنة، 2006–2007، نوقشت 2008) تدرس أثر نمط الملكية في التوزيع، فتعرض الملكية والتوزيع في الاقتصادين الرأسمالي والاشتراكي ثم في الاقتصاد الإسلامي، وتأخذ بالتقسيم الثلاثي للملكية: خاصة وعامة وملكية دولة، وتنتهي إلى أن تعدد أشكال الملكية هو أساس عدالة التوزيع عند المؤلف. {cite:dawr-tawzii-milkiyya-qana-2007 p.1} {cite:dawr-tawzii-milkiyya-qana-2007 p.12} {cite:dawr-tawzii-milkiyya-qana-2007 p.70} {cite:dawr-tawzii-milkiyya-qana-2007 p.187}"
  en: "An MA dissertation in Islamic economics by al-Tahir Qana (University of Batna, 2006-2007, defended 2008) on how the pattern of property shapes distribution: it sets out property and distribution in the capitalist and socialist economies and then in the Islamic economy, adopts a threefold division of property — private, public and state — and concludes, in the author's view, that multiple forms of property are the basis of just distribution."
  ur: "الطاہر قانہ کا اسلامی معاشیات میں ایم اے مقالہ (جامعہ باتنہ، 2006–2007، دفاع 2008) کہ ملکیت کا نمونہ تقسیمِ دولت پر کیسے اثر ڈالتا ہے: اس میں سرمایہ دارانہ اور اشتراکی معیشتوں میں ملکیت اور تقسیم، پھر اسلامی معیشت میں ان کا بیان ہے؛ یہ ملکیت کی تین قسمیں — نجی، عوامی اور ریاستی — اختیار کرتا ہے اور مصنف کی رائے میں اس نتیجے پر پہنچتا ہے کہ ملکیت کی متعدد صورتیں منصفانہ تقسیم کی بنیاد ہیں۔"
