label: { ar: "هل عقود الخيارات في الأسهم حلال؟", en: "Are Stock Options Halal?", ur: "کیا اسٹاک آپشنز حلال ہیں؟", es: "¿Son halal las opciones sobre acciones?", fr: "Les options d'achat d'actions sont-elles halal ?", tr: "Hisse senedi opsiyon sözleşmeleri helal midir?", id: "Apakah kontrak opsi saham itu halal?" }
summary:
  ar: "سؤال: هل تداول عقود الخيارات في الأسهم جائز بما فيها الاستراتيجيات «الأكثر أمانًا» كبيع المكالمات المغطاة والبيع المضمون نقدًا؟ أجاب الشيخ عمر خان بفتوى المجلس الفقهي لأمريكا الشمالية ⁦(نُشرت بتاريخ 9 أكتوبر 2026)⁩ أن شراء وبيع وكتابة عقود الخيارات غير جائز، ويشمل ذلك المكالمات المغطاة وعقود البيع المضمونة نقدًا كما نص الجواب."
  en: "A question: is trading stock options permissible, including 'safer' strategies such as selling covered calls and cash-secured puts? Shaykh Umer Khan answered for the Fiqh Council of North America (published 9 October 2026) that buying, selling and writing stock options is impermissible — expressly including covered calls and cash-secured puts."
  ur: "سوال: کیا اسٹاک آپشنز کی تجارت جائز ہے، بشمول 'محفوظ تر' حکمتِ عملیوں جیسے کورڈ کالز اور کیش سکیورڈ پٹس؟ شیخ عمر خان نے فقہ کونسل آف نارتھ امریکہ کی طرف سے ⁦(شائع شدہ 9 اکتوبر 2026)⁩ جواب دیا کہ اسٹاک آپشنز کی خرید، فروخت اور رائٹنگ ناجائز ہے — اور اس میں صراحتاً کورڈ کالز اور کیش سکیورڈ پٹس بھی شامل ہیں۔"
  es: "Una pregunta: ¿Está permitido negociar opciones sobre acciones, incluidas estrategias más seguras como la venta de opciones de compra cubiertas y opciones de venta garantizadas con efectivo? El jeque Umer Khan respondió en nombre del Consejo de Jurisprudencia Islámica de Norteamérica (publicado el 9 de octubre de 2026) que la compra, venta y emisión de opciones sobre acciones no está permitida, incluyendo expresamente las opciones de compra cubiertas y las opciones de venta garantizadas con efectivo."
  fr: "Question: le négoce d’options sur actions est-il permis, y compris les stratégies « plus sûres » telles que la vente d’options d’achat couvertes et d’options de vente garanties par des liquidités ? Cheikh Umer Khan a répondu au nom du Conseil de jurisprudence islamique d’Amérique du Nord (publication du 9 octobre 2026) que l’achat, la vente et l’émission d’options sur actions sont interdits, y compris expressément les options d’achat couvertes et les options de vente garanties par des liquidités."
  tr: "Soru: Hisse senedi opsiyon sözleşmelerinin ticareti, kapalı alım opsiyonları ve garantili nakit satış gibi 'daha güvenli' stratejiler dahil mi? Şeyh Ömer Khan, Kuzey Amerika Fiqh Konseyi'nin (9 Ekim 2026'da yayımlanan) fetvasını iletilerek yanıt verdi; bu fetva, kapsanan alım opsiyonları ve nakit garantili satış sözleşmeleri dahil olmak üzere, kabul edilemez."
  id: "Pertanyaan: Apakah perdagangan kontrak opsi saham diperbolehkan, termasuk strategi 'lebih aman' seperti menjual covered calls dan penjualan tunai terjamin? Sheikh Omar Khan menanggapi dengan fatwa North American Fiqh Council (diterbitkan pada 9 Oktober 2026) bahwa membeli, menjual, dan menulis kontrak opsi tidak diperbolehkan, termasuk covered call dan kontrak penjualan yang dijamin tunai, seperti yang dinyatakan dalam tanggapan."
