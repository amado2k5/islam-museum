id: work/tafsir-al-quran-al-qareem
class: work
kind: lecture-series
label:
  ar: "تفسير القرآن الكريم (سلسلة دروس)"
  en: "Tafsir al-Qur'an al-Karim (lecture series)"
  ur: "تفسیر القرآن الکریم (درسی سلسلہ)"
summary:
  ar: "سلسلة من عشر حلقات لعمر عبد الكافي في أرشيف أسابيل في تفسير أوائل جزء عمّ: سورة النبأ ثم سورة النازعات، يستطرد فيها إلى موضوعات كثيرة من العقيدة والأخلاق والسيرة."
  en: "A ten-episode series by Omar Abdelkafy on the Assabile archive explaining the opening suras of the last part of the Qur'an, al-Naba' and then al-Nazi'at, with many digressions into creed, ethics and the life of the Prophet."
  ur: "اسابیل آرکائیو میں عمر عبد الکافی کا دس اقساط کا سلسلہ، جو پارہ عمّ کی ابتدائی سورتوں، النبأ اور پھر النازعات، کی تفسیر ہے، اور اس میں عقیدہ، اخلاق اور سیرت کے بہت سے موضوعات پر گفتگو آتی ہے۔"
