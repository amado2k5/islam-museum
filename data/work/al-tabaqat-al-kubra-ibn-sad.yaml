label: { ar: "الطبقات الكبرى (ابن سعد)", en: "Al-Tabaqat al-Kubra (Ibn Sa'd)", ur: "الطبقات الکبریٰ (ابن سعد)" }
summary:
  ar: "كتاب محمد بن سعد كاتب الواقدي (168–230هـ) في سيرة النبي وطبقات الصحابة والتابعين ومن بعدهم إلى زمنه، مرتب على الطبقات؛ يذكر في الترجمة نسب الرجل لأبيه وأمه وأولاده وأمهاتهم، وكنيته ولقبه، وصفته وهيئته وخضابه ولباسه وخاتمه، وولاياته ومسكنه ورحلاته، ويحكم عليه أحياناً بالتوثيق أو التضعيف؛ وقال فيه حاجي خليفة إنه «أعظم ما صُنّف في طبقات الرواة» {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 55-57} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 65}."
  en: "The work of Muhammad ibn Sa'd, al-Waqidi's secretary (168–230 AH), on the life of the Prophet and the generations of Companions, Successors and their followers down to his own time, arranged by generation. A notice gives a man's lineage through father and mother, his children and their mothers, his kunya and title, his appearance, dye, dress and ring, the offices he held, where he lived and his travels, and sometimes a judgement of his reliability. Hajji Khalifa called it 'the greatest work written on the generations of transmitters' {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 55-57} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 65}."
  ur: "کاتبِ واقدی محمد بن سعد (168–230ھ) کی کتاب، جو نبی کی سیرت اور صحابہ، تابعین اور ان کے بعد کے لوگوں کے طبقات پر ان کے اپنے زمانے تک ہے، طبقات کی ترتیب سے۔ ترجمے میں آدمی کا باپ اور ماں کی طرف سے نسب، اولاد اور ان کی مائیں، کنیت اور لقب، حلیہ، خضاب، لباس اور انگوٹھی، مناصب، رہائش اور سفر ذکر ہوتے ہیں، اور کبھی اس کی توثیق یا تضعیف بھی۔ حاجی خلیفہ نے اسے «طبقاتِ رواۃ میں لکھی گئی سب سے عظیم کتاب» کہا {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 55-57} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 65}۔"
