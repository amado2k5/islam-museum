summary:
  ar: "كتاب محمد بن سعد كاتب الواقدي ⁦(168–230هـ)⁩ في سيرة النبي وطبقات الصحابة والتابعين ومن بعدهم إلى زمنه، مرتب على الطبقات؛ يذكر في الترجمة نسب الرجل لأبيه وأمه وأولاده وأمهاتهم، وكنيته ولقبه، وصفته وهيئته وخضابه ولباسه وخاتمه، وولاياته ومسكنه ورحلاته، ويحكم عليه أحياناً بالتوثيق أو التضعيف؛ وقال فيه حاجي خليفة إنه «أعظم ما صُنّف في طبقات الرواة» {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 55-57} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 65}."
  en: "The work of Muhammad ibn Sa'd, al-Waqidi's secretary (168–230 AH), on the life of the Prophet and the generations of Companions, Successors and their followers down to his own time, arranged by generation. A notice gives a man's lineage through father and mother, his children and their mothers, his kunya and title, his appearance, dye, dress and ring, the offices he held, where he lived and his travels, and sometimes a judgement of his reliability. Hajji Khalifa called it 'the greatest work written on the generations of transmitters' {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 55-57} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 65}."
  ur: "کاتبِ واقدی محمد بن سعد ⁦(168–230ھ)⁩ کی کتاب، جو نبی کی سیرت اور صحابہ، تابعین اور ان کے بعد کے لوگوں کے طبقات پر ان کے اپنے زمانے تک ہے، طبقات کی ترتیب سے۔ ترجمے میں آدمی کا باپ اور ماں کی طرف سے نسب، اولاد اور ان کی مائیں، کنیت اور لقب، حلیہ، خضاب، لباس اور انگوٹھی، مناصب، رہائش اور سفر ذکر ہوتے ہیں، اور کبھی اس کی توثیق یا تضعیف بھی۔ حاجی خلیفہ نے اسے «طبقاتِ رواۃ میں لکھی گئی سب سے عظیم کتاب» کہا {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 55-57} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 65}۔"
  es: "La obra de Muhammad ibn Sa'd, secretario de al-Waqidi (168-230 AH), sobre la vida del Profeta y las generaciones de Compañeros, Sucesores y sus seguidores hasta su propia época, organizada por generaciones. Cada nota detalla el linaje de un hombre por vía paterna y materna, sus hijos y sus madres, su kunya y título, su apariencia, tinte, vestimenta y anillo, los cargos que desempeñó, su lugar de residencia y sus viajes, y a veces un juicio sobre su fiabilidad. Hajji Khalifa la denominó «la obra más importante escrita sobre las generaciones de transmisores» {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 55-57} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 65}."
  fr: "L'œuvre de Muhammad ibn Sa'd, secrétaire d'al-Waqidi (168-230 AH), retrace la vie du Prophète et les générations de Compagnons, Successeurs et leurs disciples jusqu'à son époque, classées par génération. Chaque notice détaille la lignée d'un homme par son père et sa mère, ses enfants et leurs mères, sa kunya et son titre, son apparence, sa teinture, ses vêtements et sa bague, les fonctions qu'il a occupées, son lieu de résidence et ses voyages, et parfois une appréciation de sa fiabilité. Hajji Khalifa la qualifie de « plus grande œuvre écrite sur les générations de transmetteurs » {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 55-57} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 65}."
  tr: "El-Vakidi'nin (168–230 H) katibi Muhammed bin Sa'd'ın Peygamber'in biyografisi, sahabeler, takipçiler ve onlardan sonra onun zamanına kadar sınıflara göre düzenlenmiş sınıfları üzerine yazan kitap; biyografi, adamın babasına, annesine, çocuklarına ve annelerine olan soyundan geleni, kunyasını ve unvanını, tanımını, görünüşünü, rengini, giysisini, yüzüğünü, vasiliğini, ikametgahını ve seyahatlerini belirtir ve bazen doğrulama veya zayıflama ile yargılanır. Hacı Halife, bunun \"rivayetçi sınıflarında yazılmış en büyük eser\" olduğunu belirtmiştir {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987, s. 55} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987, s. 65}."
  id: "Buku oleh Muhammad ibn Sa'd, juru tulis al-Waqidi (168–230 H), tentang biografi Nabi, kelas-kelas Para Sahabat, Pengikut, dan setelahnya hingga zamannya, diatur berdasarkan kelas; biografi tersebut menyebutkan garis keturunan pria tersebut hingga ayah, ibu, anak-anak, dan ibunya, kunya dan gelarnya, deskripsi, penampilan, warna, pakaian, cincin, perwalian, tempat tinggal, dan perjalanan, dan kadang-kadang ia dinilai berdasarkan autentikasi atau pelemahan. Haji Khalifa mengatakan tentang buku ini bahwa ini adalah \"karya terbesar yang ditulis dalam kelas narator\" {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987, hlm. 55-57} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987, hlm. 65}."
