structure: "أصله في خمسة عشر مجلداً؛ أوله أخبار النبي (المجلد الأول وأكثر الثاني من الطبعات، ويختمه بقوله «آخر خبر النبي»)، ثم طبقات الصحابة والتابعين ومن بعدهم، ومنها طبقات أهل المدينة (الدراسة ص 55–56). طُبع في ليدن في ثمانية مجلدات وفهارس، ثم في بيروت والقاهرة عنها، وكلها ناقصة من هذا القسم. والقسم المتمم المنشور سنة 1987 يغطي تابعي المدينة من ربع الطبقة الثالثة (69 من 92 ترجمة) إلى نحو نصف السادسة (36 من 76)، مع الرابعة (174) والخامسة (128) كاملتين (الدراسة ص 78)."
