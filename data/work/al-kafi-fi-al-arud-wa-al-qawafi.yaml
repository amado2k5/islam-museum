summary:
  ar: "الكافي في العروض والقوافي، كتاب في العروض والقوافي لمؤلفه الخطيب التبريزي يحيى بن علي، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت 502هـ / 1109م {cite:archive-org-al-kafi-fi-al-arud-wa-al-qawafi}. وجواب الملخص عن وجوده في المكتبة الشاملة: لا، فقد ذكر الملف أن البحث في موقع shamela.ws لم يعثر على مطابقة . لم يقرأ المتحف الكتاب."
  en: "al-Kafi fi al-Arud wa-l-Qawafi (also edited as al-Wafi), a book on prosody (arud and qawafi) by al-Khatib al-Tibrizi, Yahya ibn Ali; its date in a research summary supplied to the museum is d. 502 AH / 1109 CE {cite:archive-org-al-kafi-fi-al-arud-wa-al-qawafi}. The summary's answer on its presence in the Shamela library: No: the file reports that a search of shamela.ws returned no match . The museum has not read the book."
  ur: "الكافي في العروض والقوافي، عروض و قوافی پر ایک کتاب، مصنف الخطيب التبريزي يحيى بن علي؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات 502ھ / 1109ء {cite:archive-org-al-kafi-fi-al-arud-wa-al-qawafi}۔ شاملہ میں موجودگی پر خلاصے کا جواب: نہیں؛ فائل کے مطابق shamela.ws میں تلاش سے کوئی مطابق اندراج نہیں ملا ۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "al-Kafi fi al-Arud wa-l-Qawafi (also edited as al-Wafi), livre sur la prosodie (arud et qawafi) de al-Khatib al-Tibrizi, Yahya ibn Ali ; sa date dans une synthèse de recherche remise au musée : m. 502 H / 1109 {cite:archive-org-al-kafi-fi-al-arud-wa-al-qawafi}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Non : le fichier signale qu'une recherche sur shamela.ws n'a donné aucune correspondance . Le musée n'a pas lu le livre."
  es: "al-Kafi fi al-Arud wa-l-Qawafi (also edited as al-Wafi), libro sobre prosodia (arud y qawafi) de al-Khatib al-Tibrizi, Yahya ibn Ali; su fecha en un resumen de investigación entregado al museo: m. 502 H. / 1109 {cite:archive-org-al-kafi-fi-al-arud-wa-al-qawafi}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: No: el archivo indica que una búsqueda en shamela.ws no dio ninguna coincidencia . El museo no ha leído el libro."
  tr: "Al-Kafi fi al-Aprod wa al-Qawafi, vaiz el-Tabrizi Yahya ibn Ali'nin prosodi ve kafiyeler üzerine bir kitap olup, müzeye sunulan araştırma özetine göre tarihi: ö. 502 Hicri / 1109 M.S. {kaynak:archive-org-al-kafi-al-arud-wa-al-qawafi}. Özetin Kapsamlı Kütüphane'deki varlığıyla ilgili yanıtı: Hayır, dosyada shamela.ws web sitesinde yapılan aramada eşleşme bulunamadığı belirtiliyordu. Müze kitabı okumadı."
  id: "Al-Kafi fi al-Aprod wa al-Qawafi, sebuah buku tentang prosodi dan rima karya penulisnya, pengkhotbah al-Tabrizi Yahya ibn Ali, dan sejarahnya menurut ringkasan penelitian yang diserahkan ke museum: wafat 502 AH / 1109 M {cite:archive-org-al-kafi-al-arud-wa-al-qawafi}. Jawaban ringkasan tentang keberadaannya di Perpustakaan Komprehensif: Tidak, berkas menyatakan bahwa pencarian di situs web shamela.ws tidak menemukan kecocokan. Museum tidak membaca buku tersebut."
