class: work
kind: fatwa
label: { ar: "مدى لزوم طواف آخر لمن صلى المغرب والعشاء بعد طواف الوداع", en: "Is another tawaf due from one who prayed Maghrib and Isha after the farewell tawaf?", ur: "طوافِ وداع کے بعد مغرب عشا پڑھنے والے پر دوبارہ طواف", es: "¿Debe realizar otro tawaf quien rezó Maghrib e Isha después del tawaf de despedida?", fr: "Une autre tawaf est-elle due par celui qui a prié Maghrib et Isha après la tawaf d'adieu ?", tr: "Veda Tevafından sonra Mağrib ve İşa namaz kılanlar için başka bir Tevafın gerekliliği", id: "Kebutuhan akan Tawaf lain bagi mereka yang berdoa Maghrib dan Isha setelah Tawaf Perpisahan" }
summary:
  ar: "سائل سأل عمن صلى المغرب والعشاء بعد طواف الوداع هل يلزمه طواف آخر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20828)⁩ أن طواف الوداع سنة ولا يلزم بتركه دم كما هو المختار للفتوى وينبغي أن يكون بعد فراغ الحاج من مناسك الحج على ما فصّل الجواب."
  en: "A questioner asked whether another tawaf is due from one who prayed Maghrib and Isha after the farewell tawaf. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20828) answered that the farewell tawaf is sunna and no expiation is due for leaving it — the view chosen for fatwa — and it should come after the pilgrim finishes the rites."
  ur: "ایک سائل نے پوچھا کہ طوافِ وداع کے بعد مغرب عشا پڑھنے والے پر کیا دوبارہ طواف لازم ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20828)⁩ نے جواب دیا کہ طوافِ وداع سنت ہے اور ترک پر دم واجب نہیں — منتخب فتویٰ کے مطابق — اور مناسک کے بعد ہونا چاہیے۔"
  es: "Un peregrino preguntó si se debe realizar otro tawaf a quien rezó Maghrib e Isha después del tawaf de despedida. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20828) respondió que el tawaf de despedida es sunna y que no se debe expiar nada por abandonarlo —la opinión elegida para la fatwa— y que debe realizarse después de que el peregrino haya terminado los ritos."
  fr: "Un pèlerin a demandé si un autre tawaf était dû après avoir accompli les prières du Maghrib et de l'Isha suite au tawaf d'adieu. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20828) a répondu que le tawaf d'adieu est une sunna et qu'aucune expiation n'est requise pour l'avoir manqué – avis retenu pour la fatwa – et qu'il doit être effectué après que le pèlerin a terminé ses rites."
  tr: "Bir soru soran kişi, Veda Tevafından sonra Mağrib ve İşa namaz kılan biri hakkında sordu: Başka bir Tevif gerekli mi? Mısır Dar Al-İftası (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 20828), Veda Tevafı'nın sünnet olduğunu ve kan dökülmesini gerektirmediğini, tercih edilen fetvanın olduğu gibi, hacı Hac ritüellerini tamamladıktan sonra olması gerektiğini cevapladı."
  id: "Seorang penanya bertanya tentang seseorang yang berdoa Maghrib dan Isha setelah Tawaf Perpisahan: Apakah Tawaf lain diperlukan? Dar Al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20828) menjawab bahwa Tawaf Perpisahan adalah Sunnah dan tidak memerlukan darah untuk dihilangkan, seperti fatwa yang disarankan, dan harus dilakukan setelah jamaah menyelesaikan ritual Haji, seperti yang dijelaskan dalam jawabannya."
