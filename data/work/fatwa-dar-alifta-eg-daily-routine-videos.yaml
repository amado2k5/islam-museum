label: { ar: "حكم عمل مقاطع فيديو للروتين اليومي ونشرها على مواقع التواصل", en: "Filming one's daily routine and posting it on social media", ur: "روزمرہ معمول کی ویڈیو بنا کر سوشل میڈیا پر ڈالنے کا حکم" }
summary:
  ar: "سائل سأل عن تصوير الروتين اليومي في الأعمال المنزلية ونشره على مواقع التواصل الاجتماعي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22524)⁩ ببيان ضوابط جواز نشر مقاطع الروتين اليومي المنزلي وما يجب اجتنابه فيها من تتبع العورات أو التكلف أو غير ذلك."
  en: "A questioner asked about filming one's daily routine in household tasks and posting it to social media. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22524) answered by setting out the controls under which publishing home-routine clips is permissible, and what must be avoided in them — intrusion on privacy, affectation and the like — as the answer details."
  ur: "ایک سائل نے گھریلو کاموں کے روزمرہ معمول کی ویڈیو بنا کر سوشل میڈیا پر ڈالنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22524)⁩ نے جواب میں وہ ضوابط بیان کیے جن کے تحت گھریلو معمول کی کلپس ڈالنا جائز ہے، اور وہ باتیں جن سے بچنا لازم ہے — نجیت پر ٹوٹنا، تکلف وغیرہ — جیسا کہ جواب میں تفصیل ہے۔"
