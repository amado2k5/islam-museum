id: work/fatwa-dar-alifta-eg-daily-routine-videos
class: work
kind: fatwa
label: { ar: "حكم عمل مقاطع فيديو للروتين اليومي ونشرها على مواقع التواصل", en: "Filming one's daily routine and posting it on social media", ur: "روزمرہ معمول کی ویڈیو بنا کر سوشل میڈیا پر ڈالنے کا حکم", es: "Grabar la rutina diaria y publicarla en las redes sociales.", fr: "Filmer sa routine quotidienne et la publier sur les réseaux sociaux" }
summary:
  ar: "سائل سأل عن تصوير الروتين اليومي في الأعمال المنزلية ونشره على مواقع التواصل الاجتماعي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22524)⁩ ببيان ضوابط جواز نشر مقاطع الروتين اليومي المنزلي وما يجب اجتنابه فيها من تتبع العورات أو التكلف أو غير ذلك."
  en: "A questioner asked about filming one's daily routine in household tasks and posting it to social media. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22524) answered by setting out the controls under which publishing home-routine clips is permissible, and what must be avoided in them — intrusion on privacy, affectation and the like — as the answer details."
  ur: "ایک سائل نے گھریلو کاموں کے روزمرہ معمول کی ویڈیو بنا کر سوشل میڈیا پر ڈالنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22524)⁩ نے جواب میں وہ ضوابط بیان کیے جن کے تحت گھریلو معمول کی کلپس ڈالنا جائز ہے، اور وہ باتیں جن سے بچنا لازم ہے — نجیت پر ٹوٹنا، تکلف وغیرہ — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre la posibilidad de grabar la rutina diaria realizando tareas domésticas y publicarlas en redes sociales. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22524) respondió estableciendo los límites bajo los cuales es permisible publicar vídeos de la rutina doméstica y lo que debe evitarse en ellos —la intrusión en la privacidad, la afectación, etc.—, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le fait de filmer ses tâches ménagères quotidiennes et de les publier sur les réseaux sociaux. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22524) a répondu en exposant les conditions dans lesquelles la publication de vidéos de routine domestique est autorisée, ainsi que ce qui doit être évité: l’atteinte à la vie privée, l’affectation, etc., comme le détaille la réponse."
