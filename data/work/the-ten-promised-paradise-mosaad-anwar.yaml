id: work/the-ten-promised-paradise-mosaad-anwar
class: work
kind: lecture-series
label:
  ar: "المبشرون بالجنة"
  en: "Al-Mubashsharun bil-Janna (Those Given Glad Tidings of Paradise)"
  ur: "المبشرون بالجنة ⁦(جنت کی بشارت پانے والے)⁩"
  es: "Al-Mubashsharun bil-Janna (Aquellos a quienes se les reciben las buenas nuevas del Paraíso)"
  fr: "Al-Mubashsharun bil-Janna (Ceux qui reçoivent la bonne nouvelle du paradis)"
  tr: "Vaat Edilen Cennet"
  id: "Surga yang Dijanjikan"
summary:
  ar: "سلسلة من ثمانٍ وعشرين حلقة لمسعد أنور يحفظها أرشيف أسابيل: حلقة في وصف الجنة، وحلقة في فضل الصحابة، ثم حلقة أو حلقتان لكل واحد ممن يقول إن النبي بشّرهم بالجنة، منهم ستة من العشرة ⁦(عبد الرحمن بن عوف وسعيد بن زيد وسعد بن أبي وقاص وطلحة وأبو عبيدة والزبير)⁩ وبلال وعكاشة وعبد الله بن سلام وحارثة بن النعمان وثابت بن قيس والحسين وحذيفة وعمار وسلمان وجعفر، ومن النساء فاطمة وخديجة وأم زفر وأم سليم وحفصة ونسيبة بنت كعب وأم حرام."
  en: "A series of twenty-eight episodes by Mosaad Anwar kept in the Assabile archive: one on the description of Paradise, one on the merits of the Companions, then one or two for each of those he says the Prophet promised Paradise, among them six of the ten (Abd al-Rahman ibn Awf, Sa'id ibn Zayd, Sa'd ibn Abi Waqqas, Talha, Abu Ubayda and al-Zubayr), Bilal, Ukkasha, Abd Allah ibn Salam, Haritha ibn al-Nu'man, Thabit ibn Qays, al-Husayn, Hudhayfa, Ammar, Salman and Ja'far, and among the women Fatima, Khadija, Umm Zufar, Umm Sulaym, Hafsa, Nusayba bint Ka'b and Umm Haram."
  ur: "مسعد انور کا اٹھائیس اقساط کا سلسلہ جو اسابیل آرکائیو میں محفوظ ہے: ایک قسط جنت کے بیان میں، ایک صحابہ کی فضیلت میں، پھر ہر اس شخصیت کے لیے ایک یا دو اقساط جنہیں ان کے بقول نبی نے جنت کی بشارت دی، جن میں عشرہ میں سے چھ ⁦(عبد الرحمٰن بن عوف، سعید بن زید، سعد بن ابی وقاص، طلحہ، ابو عبیدہ اور زبیر)⁩، بلال، عکاشہ، عبد اللہ بن سلام، حارثہ بن نعمان، ثابت بن قیس، حسین، حذیفہ، عمار، سلمان اور جعفر ہیں، اور خواتین میں فاطمہ، خدیجہ، ام زفر، ام سلیم، حفصہ، نسیبہ بنت کعب اور ام حرام۔"
  es: "Una serie de veintiocho episodios de Mosaad Anwar conservados en el archivo Assabile: uno sobre la descripción del Paraíso, uno sobre los méritos de los Compañeros, y luego uno o dos para cada uno de aquellos a quienes, según él, el Profeta prometió el Paraíso, entre ellos seis de los diez (Abd al-Rahman ibn Awf, Sa'id ibn Zayd, Sa'd ibn Abi Waqqas, Talha, Abu Ubayda y al-Zubayr), Bilal, Ukkasha, Abd Allah ibn Salam, Haritha ibn al-Nu'man, Thabit ibn Qays, al-Husayn, Hudhayfa, Ammar, Salman y Ja'far, y entre las mujeres Fátima, Khadija, Umm Zufar, Umm Sulaym, Hafsa, Nusayba bint Ka'b y Umm Haram."
  fr: "Une série de vingt-huit épisodes de Mosaad Anwar conservés dans les archives d'Assabile: un sur la description du Paradis, un sur les mérites des Compagnons, puis un ou deux pour chacun de ceux à qui, selon lui, le Prophète a promis le Paradis, parmi lesquels six des dix (Abd al-Rahman ibn Awf, Sa'id ibn Zayd, Sa'd ibn Abi Waqqas, Talha, Abu Ubayda et al-Zubayr), Bilal, Ukkasha, Abd Allah ibn Salam, Haritha ibn al-Nu'man, Thabit ibn Qays, al-Husayn, Hudhayfa, Ammar, Salman et Ja'far, et parmi les femmes Fatima, Khadija, Umm Zufar, Umm Sulaym, Hafsa, Nusayba bint Ka'b et Umm Haram."
  tr: "Mas'ad Enver'in yirmi sekiz bölümlük dizisi, Asabil arşivinde saklanmıştır: bir bölüm cenneti anlatırken, bir bölüm sahabelerin erdemini anlatırken, ardından Peygamber'in cennetten müjdesini verdiğini söyleyenlerin her biri için bir veya iki bölüm; bunlardan altısı (Abdul Rahman ibn Awf, Sa'id ibn Zayd, Sa'd ibn Ebi Vaqqas, Talha, Ebu Ubeyde ve El-Zubeyr), Bilal, Okaşa, Abdullah ibn Salam, Haritha ibn al-Nu'man, Tebit bin Kays, El-Hüseyin, Hudhayfah, Ammar, Salman ve Ca'fer. Kadınlar arasında Fatimah, Hadijah, Um Zafar, Um Süleym, Hafsa, Nusaybah bint Ka'b ve Ümmü Haram bulunmaktadır."
  id: "Seri dua puluh delapan episode karya Mas'ad Anwar disimpan dalam arsip Asabil: satu episode menggambarkan Surga, satu episode tentang kebajikan Para Sahabat, lalu satu atau dua episode untuk masing-masing yang mengatakan Nabi telah memberikan kabar bahagia Surga, termasuk enam dari sepuluh (Abdul Rahman ibn Awf, Sa'id ibn Zayd, Sa'd ibn Abi Waqqas, Talha, Abu Ubaidah, dan Al-Zubayr), Bilal, Okasha, Abdullah ibn Salam, Haritha ibn Al-Nu'man, Thabit ibn Qays, Al-Husayn, Hudhayfah, Ammar, Salman, dan Ja'far. Di antara wanita-wanita tersebut adalah Fatimah, Khadijah, um Zafar, um Sulaym, Hafsa, Nusaybah bint Ka'b, dan um Haram."
