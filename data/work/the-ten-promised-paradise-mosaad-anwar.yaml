id: work/the-ten-promised-paradise-mosaad-anwar
class: work
kind: lecture-series
label:
  ar: "المبشرون بالجنة"
  en: "Al-Mubashsharun bil-Janna (Those Given Glad Tidings of Paradise)"
  ur: "المبشرون بالجنة (جنت کی بشارت پانے والے)"
summary:
  ar: "سلسلة من ثمانٍ وعشرين حلقة لمسعد أنور يحفظها أرشيف أسابيل: حلقة في وصف الجنة، وحلقة في فضل الصحابة، ثم حلقة أو حلقتان لكل واحد ممن يقول إن النبي بشّرهم بالجنة، منهم ستة من العشرة ⁦(عبد الرحمن بن عوف وسعيد بن زيد وسعد بن أبي وقاص وطلحة وأبو عبيدة والزبير)⁩ وبلال وعكاشة وعبد الله بن سلام وحارثة بن النعمان وثابت بن قيس والحسين وحذيفة وعمار وسلمان وجعفر، ومن النساء فاطمة وخديجة وأم زفر وأم سليم وحفصة ونسيبة بنت كعب وأم حرام."
  en: "A series of twenty-eight episodes by Mosaad Anwar kept in the Assabile archive: one on the description of Paradise, one on the merits of the Companions, then one or two for each of those he says the Prophet promised Paradise, among them six of the ten (Abd al-Rahman ibn Awf, Sa'id ibn Zayd, Sa'd ibn Abi Waqqas, Talha, Abu Ubayda and al-Zubayr), Bilal, Ukkasha, Abd Allah ibn Salam, Haritha ibn al-Nu'man, Thabit ibn Qays, al-Husayn, Hudhayfa, Ammar, Salman and Ja'far, and among the women Fatima, Khadija, Umm Zufar, Umm Sulaym, Hafsa, Nusayba bint Ka'b and Umm Haram."
  ur: "مسعد انور کا اٹھائیس اقساط کا سلسلہ جو اسابیل آرکائیو میں محفوظ ہے: ایک قسط جنت کے بیان میں، ایک صحابہ کی فضیلت میں، پھر ہر اس شخصیت کے لیے ایک یا دو اقساط جنہیں ان کے بقول نبی نے جنت کی بشارت دی، جن میں عشرہ میں سے چھ (عبد الرحمٰن بن عوف، سعید بن زید، سعد بن ابی وقاص، طلحہ، ابو عبیدہ اور زبیر)، بلال، عکاشہ، عبد اللہ بن سلام، حارثہ بن نعمان، ثابت بن قیس، حسین، حذیفہ، عمار، سلمان اور جعفر ہیں، اور خواتین میں فاطمہ، خدیجہ، ام زفر، ام سلیم، حفصہ، نسیبہ بنت کعب اور ام حرام۔"
