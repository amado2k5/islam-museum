label:
  ar: "صحيح الجامع الصغير وزيادته ⁦(الفتح الكبير)⁩"
  en: "Sahih al-Jami' al-Saghir wa-Ziyadatuh (al-Fath al-Kabir)"
  ur: "صحیح الجامع الصغیر وزیادتہ ⁦(الفتح الکبیر)⁩"
  tr: "Sahih al-Jami' al-Saghir ve eklenmesi (Al-Fath al-Kabir)"
  id: "Sahih al-Jami' al-Saghir dan penambahannya (Al-Fath al-Kabir)"
summary:
  ar: "القسم الأول من تحقيق محمد ناصر الدين الألباني لكتاب «الفتح الكبير» الذي جمع فيه النبهاني «الجامع الصغير» للسيوطي وذيله «الزيادة»: يضم ما يراه الألباني ثابتاً محتجاً به من الصحيح والحسن، مرتباً على حروف المعجم، تحت كل حديث مرتبته ومصدر تحقيقه من كتبه؛ وقسيمه «ضعيف الجامع الصغير وزيادته»؛ بلغت أحاديثه في الطبعة الثالثة 8231 حديثاً منها 3273 من الزيادة {cite:sahih-jami-saghir-maktab-islami-1988 p. 10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 18} {cite:sahih-jami-saghir-maktab-islami-1988 p. 32}."
  en: "The first part of Muhammad Nasir al-Din al-Albani's grading of al-Fath al-Kabir — al-Nabhani's merger of al-Suyuti's al-Jami' al-Saghir with its supplement al-Ziyada: it holds what al-Albani judges established and usable as proof (sound and good), in alphabetical order, each hadith followed by his grade and the book of his where he examined it; its companion is Da'if al-Jami' al-Saghir wa-Ziyadatuh; in the third edition it counts 8,231 hadiths, 3,273 of them from the Ziyada {cite:sahih-jami-saghir-maktab-islami-1988 p. 10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 18} {cite:sahih-jami-saghir-maktab-islami-1988 p. 32}."
  ur: "محمد ناصر الدین البانی کی «الفتح الکبیر» کی تحقیق کا پہلا حصہ — نبہانی کا وہ مجموعہ جس میں سیوطی کی «الجامع الصغیر» اور اس کا ذیل «الزیادہ» ملائے گئے: اس میں وہ احادیث ہیں جنہیں البانی ثابت اور قابلِ حجت ⁦(صحیح و حسن)⁩ سمجھتے ہیں، حروفِ تہجی کی ترتیب پر، ہر حدیث کے نیچے ان کا حکم اور ان کی اس کتاب کا حوالہ جہاں انہوں نے اس کی تحقیق کی؛ اس کا ساتھی «ضعیف الجامع الصغیر وزیادتہ» ہے؛ تیسرے ایڈیشن میں اس کی احادیث 8231 ہیں، جن میں 3273 زیادہ سے ہیں {cite:sahih-jami-saghir-maktab-islami-1988 p. 10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 18} {cite:sahih-jami-saghir-maktab-islami-1988 p. 32}۔"
  es: "La primera parte de la clasificación de Muhammad Nasir al-Din al-Albani de al-Fath al-Kabir — la fusión de al-Nabhani de al-Jami' al-Saghir de al-Suyuti con su suplemento al-Ziyada: contiene lo que al-Albani estableció establecido y utilizable como prueba (sólido y bueno), en orden alfabético, cada hadiz seguido de su grado y el libro suyo donde lo examinó; su compañero es Da'if al-Jami' al-Saghir wa-Ziyadatuh; en la tercera edición cuenta 8.231 hadices, 3.273 de ellos de la Ziyada {cite:sahih-jami-saghir-maktab-islami-1988 p. 10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 18} {citar:sahih-jami-saghir-maktab-islami-1988 p. 32}."
  fr: "La première partie du classement des hadiths d'al-Fath al-Kabir par Muhammad Nasir al-Din al-Albani — la fusion par al-Nabhani de l'ouvrage d'al-Suyuti, al-Jami' al-Saghir, avec son supplément al-Ziyada — présente, par ordre alphabétique, les hadiths qu'al-Albani a établis et utilisables comme preuves (sains et valables), suivis de son classement et du livre dans lequel il l'a examiné. Son ouvrage complémentaire est Da'if al-Jami' al-Saghir wa-Ziyadatuh. Dans sa troisième édition, il recense 8 231 hadiths, dont 3 273 proviennent de Ziyada. 18} {cite: sahih-jami-saghir-maktab-islami-1988 p. 32}."
  tr: "Muhammed Nasirdin el-Albani'nin 'Al-Fath al-Kabir' kitabının doğrulamasının ilk bölümü, el-Nabhani'nin el-Suyuti'nin 'El-Cami' el-Saghir' ve eki 'El-Ziyada'yı derlemiştir: al-Albani'nin özgün ve doğrulanmış saydığı şeyleri, her hadis altında alfabetik olarak düzenlenmiş, kitaplarından alınan sıralama ve doğrulama kaynağı ile birlikte içerir; ve 'Da'if al-Jami' al-Saghir wa Ziyatahu' bölümü; üçüncü baskıdaki hadisleri 8.231 hadise ulaşmış ve bunların 3.273 eki bulunmaktadır {atıf:sahih-jami-saghir-maktab-islami-1988, s. 32}."
  id: "Bagian pertama dari verifikasi Muhammad Nasir al-Din al-Albani atas buku 'Al-Fath al-Kabir,' di mana al-Nabhani menyusun 'Al-Jami' al-Saghir' karya al-Suuji dan lampirannya 'Al-Ziyada': mencakup apa yang dianggap otentik dan terverifikasi oleh al-Albani, disusun secara alfabetis, di bawah setiap hadis dengan peringkat dan sumber verifikasi dari bukunya; dan bagian 'Da'if al-Jami' al-Saghir wa Ziyatahu'; haditsnya pada edisi ketiga mencapai 8.231 hadits, termasuk 3.273 tambahan {cite:sahih-jami-saghir-maktab-islami-1988, hlm. 32}."
