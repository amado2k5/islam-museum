label: { ar: "عيون الأثر في فنون المغازي والشمائل والسير", en: "Uyun al-Athar fi Funun al-Maghazi wa-l-Shama'il wa-l-Siyar", ur: "عیون الاثر فی فنون المغازی والشمائل والسیر" }
summary:
  ar: "سيرة نبوية مسندة للحافظ أبي الفتح ابن سيد الناس اليعمري ⁦(ت 734هـ)⁩، رتبها على تتابع الوقائع زمنياً، وجعل أزواج النبي وأولاده في باب الحلى والشمائل الملحق بالمغازي، وختم كل خبر بفوائد في غريبه ومشكله، وأثبت في آخرها أسانيده إلى مصادره؛ شرحها سبط ابن العجمي في «نور النبراس» ونظمها فتح الدين النابلسي."
  en: "A biography of the Prophet with full chains of transmission by the hadith master Abu al-Fath Ibn Sayyid al-Nas al-Ya'muri (d. 734 AH), arranged in chronological order of events, with the Prophet's wives and children placed in the section on his features and character appended to the campaigns; each report closes with notes on rare words and difficulties, and the book ends with his chains to his sources. Sibt Ibn al-Ajami commented on it in Nur al-Nibras and Fath al-Din al-Nabulusi versified it."
  es: "Biografía del Profeta con cadenas de transmisión completas, escrita por el maestro de hadices Abu al-Fath Ibn Sayyid al-Nas al-Ya'muri (fallecido en 734 AH), organizada cronológicamente. Las esposas e hijos del Profeta se encuentran en la sección sobre sus características y carácter, adjunta a las campañas. Cada relato concluye con notas sobre palabras poco comunes y dificultades, y el libro finaliza con las cadenas de transmisión a sus fuentes. Sibt Ibn al-Ajami la comentó en Nur al-Nibras y Fath al-Din al-Nabulusi la versificó."
  fr: "Biographie du Prophète avec chaînes de transmission complètes, par le maître du hadith Abu al-Fath Ibn Sayyid al-Nas al-Ya'muri (mort en 734 AH), organisée par ordre chronologique. Les épouses et les enfants du Prophète sont présentés dans la section consacrée à ses caractéristiques et à son caractère, annexée aux récits de ses campagnes. Chaque récit se termine par des notes sur les mots rares et les difficultés rencontrées, et l'ouvrage s'achève par les chaînes de transmission de ses sources. Sibt Ibn al-Ajami l'a commenté dans Nur al-Nibras et Fath al-Din al-Nabulusi l'a mis en vers."
