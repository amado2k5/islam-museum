structure: "مقدمة المؤلف وخطته؛ ثم السيرة على ترتيب الوقائع من النسب والمولد إلى الوفاة، والمغازي في أثنائها (يبدأ الجزء الثاني من طبعة الخطراوي بغزوة أحد)؛ ثم باب الحلى والشمائل وفيه الأزواج والأولاد؛ ثم «ذكر الأسانيد التي وقعت لي مع المصنفين الذين أخرجت من كتبهم» في آخر الكتاب."
