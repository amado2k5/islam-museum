label: { ar: "عيون الأثر في فنون المغازي والشمائل والسير", en: "Uyun al-Athar fi Funun al-Maghazi wa-l-Shama'il wa-l-Siyar", ur: "عیون الاثر فی فنون المغازی والشمائل والسیر" }
summary:
  ar: "سيرة نبوية مسندة للحافظ أبي الفتح ابن سيد الناس اليعمري (ت 734هـ)، رتبها على تتابع الوقائع زمنياً، وجعل أزواج النبي وأولاده في باب الحلى والشمائل الملحق بالمغازي، وختم كل خبر بفوائد في غريبه ومشكله، وأثبت في آخرها أسانيده إلى مصادره؛ شرحها سبط ابن العجمي في «نور النبراس» ونظمها فتح الدين النابلسي."
  en: "A biography of the Prophet with full chains of transmission by the hadith master Abu al-Fath Ibn Sayyid al-Nas al-Ya'muri (d. 734 AH), arranged in chronological order of events, with the Prophet's wives and children placed in the section on his features and character appended to the campaigns; each report closes with notes on rare words and difficulties, and the book ends with his chains to his sources. Sibt Ibn al-Ajami commented on it in Nur al-Nibras and Fath al-Din al-Nabulusi versified it."
