id: work/fatwa-amja-tablighi-jamaat-verdict
class: work
kind: fatwa
label: { ar: "جماعة التبليغ", en: "The Tablighi Jamaat — Sunnis in general, with cautions", ur: "تبلیغی جماعت — مجموعی حیثیت", es: "El Tablighi Jamaat — Los sunitas en general, con precauciones", fr: "La Tablighi Jamaat — Les sunnites en général, avec quelques mises en garde", tr: "Tabligh Grubu", id: "Grup Tabligh" }
summary:
  ar: "سأل سائل هل جماعة التبليغ من أهل السنة والجماعة وهل يجوز الخروج معهم أم أنهم مبتدعون فيبعد عنهم. أجاب د. حاتم الحاج ⁦(فتوى رقم 21845 بتاريخ 25 أغسطس 2006)⁩ أن جماعة التبليغ جماعة إسلامية دعوية وعظية من أهل السنة والجماعة في العموم يساهم أعضاؤها في الدعوة إلى الله وتبليغ فضائل الإسلام إلى الخلق مسلمهم وكافرهم وقد أسسها الشيخ محمد إلياس الكاندهلوي الهندي 1303–1364هـ ومن فضائلهم الإخلاص الذي له أمارات تشاهد عليهم والهمة العالية في الدعوة، وذكر ما يؤخذ عليهم من ملاحظات شرعية معينة كما فصّل."
  en: "A questioner asked whether the Tablighi Jamaat are Sunnis and whether going out with them is lawful, or innovators to be shunned, having grown numerous in Egypt. Dr. Hatim al-Hajj (fatwa no. 21845, 25 August 2006) answered that the Tablighi Jamaat is an Islamic preaching and exhorting body of the Sunnis in general, whose members serve the call to God and carry Islam's virtues to Muslims and non-Muslims; it was founded by Shaykh Muhammad Ilyas al-Kandahlawi of India (1303–1364 AH), and among their virtues are sincerity — whose signs are seen on them — and a high resolve in preaching; the answer then details particular sharia reservations about them. Recorded as AMJA's answer."
  ur: "ایک سائل نے تبلیغی جماعت کی حیثیت پوچھی۔ ڈاکٹر حاتم الحاج ⁦(فتویٰ 21845، 25 اگست 2006)⁩ کے مطابق وہ مجموعی طور پر اہل سنت ہیں — اخلاص اور دعوت میں کوشاں — مگر بعض شرعی تنبیہات ہیں۔"
  es: "Un interlocutor preguntó si el Tablighi Jamaat es suní y si salir con ellos es lícito, o si se debe evitar a los innovadores, dado su creciente número en Egipto. El Dr. Hatim al-Hajj (fatwa n.º 21845, 25 de agosto de 2006) respondió que el Tablighi Jamaat es una organización islámica de predicación y exhortación de los suníes en general, cuyos miembros sirven al llamado de Dios y transmiten las virtudes del Islam a musulmanes y no musulmanes; fue fundada por el Shaykh Muhammad Ilyas al-Kandahlawi de la India (1303-1364 AH), y entre sus virtudes se encuentran la sinceridad —cuyos signos se observan en ellos— y una firme determinación en la predicación; la respuesta detalla a continuación las reservas de la sharia relativas a ellos. Registrada como respuesta de AMJA."
  fr: "Un internaute a demandé si les membres de la Tablighi Jamaat étaient sunnites et s'il était licite de les fréquenter, ou s'il s'agissait d'innovateurs à éviter, étant donné leur nombre croissant en Égypte. Le Dr Hatim al-Hajj (fatwa n° 21845, 25 août 2006) a répondu que la Tablighi Jamaat est un mouvement islamique sunnite de prédication et d'exhortation, dont les membres servent l'appel à Dieu et diffusent les vertus de l'islam auprès des musulmans et des non-musulmans. Ce mouvement a été fondé par le cheikh Muhammad Ilyas al-Kandahlawi d'Inde (1303-1364 AH). Parmi ses vertus figurent la sincérité – dont les signes sont visibles chez eux – et une grande détermination dans la prédication. La réponse détaille ensuite certaines réserves de la charia à leur sujet. Cette réponse est enregistrée comme la réponse de l'AMJA."
  tr: "Bir soru soran Tabligh Grubu'nun Ehl-sünnet vel-Cema'ah'tan olup olmadığını, onlarla dışarı çıkmanın caiz olup olmadığını, yoksa yenilikçi olup onlardan uzak tutulması mı gerektiğini sordu. Dr. Hatim Al-Hajj, 25 Ağustos 2006 tarihli 21845 sayılı Fetva) yanıtladı: Tabligh Grubu, genel olarak Ehl-sünnet ve Cemaah'tan İslami bir misyoner ve vaiz gruptur. Üyeleri, Allah'a çağrıda bulunmaya ve İslam'ın erdemlerini hem Müslüman hem de gayrimüslim insanlara aktarmaya katkıda bulunur. Şeyh Muhammed İlyas El-Kandhlawi El-Hindi (1303–1364 H) tarafından kurulmuştur. Erdemleri arasında, işaretlerinde görülen samimiyet ve vaaz konusundaki yüksek hırsları vardır. Ayrıca kendilerine karşı yapılan bazı dini gözlemleri ayrıntılı olarak belirtmiştir."
  id: "Seorang penanya bertanya apakah Kelompok Tabligh berasal dari Ahl al-Sunnah wal-Jama'ah, dan apakah diperbolehkan untuk pergi bersama mereka, atau apakah mereka adalah inovator dan harus dijauhkan dari mereka. Dr. Hatim Al-Hajj menjawab (Fatwa No. 21845 tanggal 25 Agustus 2006) bahwa Kelompok Tabligh adalah kelompok Islam, misionaris, dan dakwah dari Ahl al-Sunnah wa al-Jama'ah secara umum. Anggotanya berkontribusi dalam memanggil Allah dan menyampaikan kebajikan Islam kepada orang-orang, baik Muslim maupun non-Muslim. Kelompok ini didirikan oleh Sheikh Muhammad Ilyas Al-Kandhlawi Al-Hindi (1303–1364 H). Di antara kebajikan mereka adalah ketulusan, yang terlihat dari tanda-tanda mereka, dan ambisi tinggi mereka dalam berkhotbah. Ia juga menyebutkan beberapa pengamatan agama yang dikritik mereka secara rinci."
