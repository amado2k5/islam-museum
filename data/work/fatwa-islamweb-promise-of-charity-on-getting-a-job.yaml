id: work/fatwa-islamweb-promise-of-charity-on-getting-a-job
class: work
kind: fatwa
label: { ar: "الوعد بالصدقة إذا حصل على عمل هل يأخذ حكم النذر، وحكم الشك فيه", en: "Does a promise to give charity on getting a job count as a vow, and what if one is unsure?", ur: "نوکری ملنے پر صدقے کا وعدہ: کیا یہ نذر ہے، اور شک کی صورت میں کیا حکم ہے؟", es: "¿Se considera una promesa de donar a la caridad al conseguir un trabajo un voto? ¿Y qué ocurre si uno no está seguro?", fr: "Une promesse de faire un don à une œuvre de charité après avoir trouvé un emploi compte-t-elle comme un vœu, et que se passe-t-il si l'on n'en est pas sûr ?", tr: "Bir tapu elde ederse hayırseverlik vaadi hakkında, kararı bir yemin üzerine mi alır, kararı ise şüpheyle mi alır?", id: "Mengenai janji amal jika ia memperoleh akta, apakah ia mengambil keputusan berdasarkan sumpah, dan putusan berdasarkan keraguan tentangnya?" }
summary:
  ar: "سؤال من رجل كان في كرب شديد فدعا الله واعدًا إياه أنه إن قُبل في وظيفة أخرج عشرين بالمائة من راتبه صدقة ثم زاد النسبة كلما زاد راتبه، ولا يجزم هل قال كلمة نذرًا، وقُبل في الوظيفة ونسي ما قاله نحو ثلاث سنوات مع محافظته على صدقة شهرية، ثم خشي أن يكون ذلك نذرًا وهو مرعوب من آية إخلاف الوعد، أجاب فيه مركز الفتوى بإسلام ويب بأن قوله أعدك يا رب إن حصلت على عمل أن أتصدق بكذا لا يُعد نذرًا بمجرده، لأن النذر لا ينعقد إلا بلفظ مشعر بالالتزام، ومجرد الوعد لا يكون نذرًا إلا إذا اقترنت به نية فيكون كناية والنذر ينعقد بالكناية على الصحيح، ناقلًا عن الخطيب الشربيني في مغني المحتاج والرملي في نهاية المحتاج. وقرر أنه حيث شك في التلفظ بالنذر أو في وجود النية حال الوعد فالأصل عدم ذلك فلا يلزمه شيء، مستندًا إلى قاعدة استصحاب الأصل وبراءة الذمة التي قررها العز بن عبد السلام في قواعد الأحكام، فإن حصل له اليقين الجازم بأنه نذر بلفظ صريح أو بكناية مع النية لزمه الوفاء، وما تصدق به بنية الوفاء بالنذر يجزئه ويكمل الباقي، لأن النذر يجب الوفاء به ولا يجوز التحلل منه إلا عند العجز التام، لحديث من نذر أن يطيع الله فليطعه."
  en: "A question from a man who, in great distress, prayed to God promising that if he were accepted for a job he would give twenty per cent of his salary in charity and raise the share as his salary rose; he cannot be sure whether he used the word 'vow', was accepted, forgot what he had said for about three years while keeping up a monthly charity, then feared it might have been a vow and was terrified by the verse on breaking a promise to God. The fatwa centre of IslamWeb answered that saying 'I promise You, Lord, that if I get a job I will give such-and-such in charity' is not by itself a vow, because a vow is concluded only by a wording that conveys commitment, and a mere promise becomes a vow only when accompanied by an intention, in which case it is an allusive form, and a vow is concluded by allusive wording on the correct view, quoting al-Khatib al-Shirbini in Mughni al-Muhtaj and al-Ramli in Nihayat al-Muhtaj. It ruled that where he is in doubt whether he uttered the word 'vow' or had the intention at the time of the promise, the default is that he did not, so nothing is binding on him, relying on the principle of presuming the original state and the freedom of one's obligations as set out by al-Izz ibn Abd al-Salam in Qawa'id al-Ahkam; if he becomes certain that he vowed in express words or by allusion with intention, he must fulfil it, what he has already given with the intention of fulfilling the vow counts, and he completes the rest, because a vow must be fulfilled and may not be released except through complete inability, according to the hadith that whoever vows to obey God should obey Him."
  ur: "ایک شخص کا سوال جس نے سخت پریشانی میں اللہ سے دعا کی اور وعدہ کیا کہ اگر وہ نوکری میں قبول ہوا تو اپنی تنخواہ کا بیس فیصد صدقہ کرے گا اور تنخواہ بڑھنے پر حصہ بڑھاتا جائے گا؛ اسے یقین نہیں کہ اس نے لفظ نذر کہا یا نہیں، وہ قبول ہوا، تقریباً تین سال تک اپنا کہا بھول گیا جبکہ ماہانہ صدقہ جاری رکھا، پھر ڈرا کہ شاید یہ نذر تھی اور اللہ سے وعدہ خلافی کی آیت سے خوفزدہ ہوا۔ اسلام ویب کے فتویٰ مرکز نے جواب دیا کہ یہ کہنا کہ 'اے رب، میں وعدہ کرتا ہوں کہ اگر مجھے کام ملا تو اتنا صدقہ کروں گا' بذاتِ خود نذر نہیں، کیونکہ نذر صرف ایسے لفظ سے منعقد ہوتی ہے جو التزام ظاہر کرے، اور محض وعدہ تب نذر بنتا ہے جب اس کے ساتھ نیت ہو، اس صورت میں یہ کنایہ ہے اور صحیح قول پر نذر کنایے سے منعقد ہوتی ہے، خطیب شربینی کی مغنی المحتاج اور رملی کی نہایۃ المحتاج سے نقل کرتے ہوئے۔ اس نے فیصلہ کیا کہ جہاں اسے شک ہو کہ اس نے لفظ نذر کہا یا وعدے کے وقت نیت تھی، وہاں اصل عدم ہے لہٰذا اس پر کچھ لازم نہیں، استصحابِ اصل اور براءتِ ذمہ کے اس قاعدے کی بنا پر جو عز بن عبد السلام نے قواعد الاحکام میں بیان کیا؛ اگر اسے پختہ یقین ہو جائے کہ اس نے صریح لفظ سے یا نیت کے ساتھ کنایے سے نذر مانی تو اس پر اسے پورا کرنا لازم ہے، نذر پوری کرنے کی نیت سے جو صدقہ دیا وہ شمار ہوگا اور باقی مکمل کرے، کیونکہ نذر کو پورا کرنا واجب ہے اور مکمل عاجزی کے سوا اس سے نکلنا جائز نہیں، اس حدیث کی بنا پر کہ جو اللہ کی اطاعت کی نذر مانے وہ اس کی اطاعت کرے۔"
  es: "Una pregunta de un hombre que, en gran angustia, oró a Dios prometiendo que si era aceptado para un trabajo daría el veinte por ciento de su salario en caridad y aumentaría la proporción a medida que su salario aumentara; no está seguro de si usó la palabra \"voto\", fue aceptado, olvidó lo que había dicho durante unos tres años mientras mantenía una caridad mensual, luego temió que pudiera haber sido un voto y se aterrorizó por el versículo sobre romper una promesa a Dios. El centro de fatwas de IslamWeb respondió que decir \"Te prometo, Señor, que si consigo un trabajo daré tal y cual en caridad\" no es en sí mismo un voto, porque un voto se concluye solo con una formulación que transmite compromiso, y una mera promesa se convierte en voto solo cuando va acompañada de una intención, en cuyo caso es una forma alusiva, y un voto se concluye con una formulación alusiva según la opinión correcta, citando a al-Khatib al-Shirbini en Mughni al-Muhtaj y a al-Ramli en Nihayat al-Muhtaj. Dictaminó que cuando él duda si pronunció la palabra \"voto\" o tuvo la intención al momento de la promesa, la norma general es que no lo hizo, por lo que nada le obliga, basándose en el principio de presumir el estado original y la libertad de las obligaciones de uno como lo establece al-Izz ibn Abd al-Salam en Qawa'id al-Ahkam; si llega a la certeza de que hizo un voto con palabras expresas o por alusión con intención, debe cumplirlo, lo que ya ha dado con la intención de cumplir el voto cuenta, y completa el resto, porque un voto debe cumplirse y no puede romperse excepto por completa incapacidad, de acuerdo con el hadiz que dice que quien jura obedecer a Dios debe obedecerle."
  fr: "Un homme, en proie à une grande détresse, a prié Dieu en promettant, s'il était embauché, de donner 20 % de son salaire en aumône et d'augmenter ce pourcentage au fur et à mesure de son salaire. Il ne sait plus s'il a prononcé le mot « vœu », s'il a été accepté, s'il a oublié sa promesse pendant environ trois ans tout en continuant à verser une aumône mensuelle, puis s'il a craint qu'il ne s'agisse d'un vœu et a été terrifié par le verset concernant la rupture d'une promesse faite à Dieu. Le centre de fatwas d'IslamWeb a répondu que dire « Je Te promets, Seigneur, que si j'obtiens un emploi, je donnerai telle somme en aumône » ne constitue pas en soi un vœu, car un vœu se conclut uniquement par une formulation qui exprime un engagement, et une simple promesse ne devient un vœu que lorsqu'elle est accompagnée d'une intention, auquel cas il s'agit d'une forme allusive. Un vœu se conclut par une formulation allusive, selon l'avis correct, citant al-Khatib al-Shirbini dans Mughni al-Muhtaj et al-Ramli dans Nihayat al-Muhtaj. Il a été statué que, dans le cas où il existe un doute quant à savoir s'il a prononcé le mot « vœu » ou s'il en avait l'intention au moment de la promesse, la présomption est qu'il ne l'a pas fait, et donc rien ne l'engage, se fondant sur le principe de la présomption de l'état initial et de la liberté des obligations tel qu'énoncé par al-Izz ibn Abd al-Salam dans Qawa'id al-Ahkam; s'il acquiert la certitude d'avoir fait un vœu expressément ou par allusion avec intention, il doit l'accomplir; ce qu'il a déjà donné avec l'intention d'accomplir le vœu compte, et il accomplit le reste, car un vœu doit être accompli et ne peut être levé qu'en cas d'incapacité totale, conformément au hadith selon lequel quiconque fait vœu d'obéissance à Dieu doit Lui obéir."
  tr: "Ağır sıkıntı içinde olan ve Tanrı'ya dua eden bir adamdan gelen soru, eğer bir iş kabul ederse maaşının yüzde yirmisini sadaka olarak vereceğine, sonra maaşı arttıkça oranı artıracağına dair dua etti. Yemin edip etmediğinden emin değildi, işi kabul etti ve yaklaşık üç yıl boyunca aylık bir hayır kurumu sürdürürken söylediklerini unuttu. Sonra, bunun bir yemin olabileceğinden korkan ve bir sözü bozma ayetinden korkan Fetva Merkezi, 'Sana söz veriyorum, ey Efendim, bir eylem alırsam, şu ya da şu ile sadaka yapacağım tek başına yemin sayılmaz, çünkü yemin sadece bağlılık anlamına gelen bir ifadeyle verilir. Sadece bir söz, niyet eşliğinde olmadıkça yemin değildir ve bir metafor olarak kabul edilir; yemin ise doğru görüşe göre metaforla yapılır; Mughni Al-Muhtaj'daki Al-Khatib Al-Sharbini ve Nihayat Al-Muhtaj'daki Al-Ramli'den alıntı yapılmaktadır. Yeminin yapılması veya söz verildiği anda niyetin varlığı konusunda şüphe olduğunda, bunun böyle olmadığını, bu yüzden hiçbir şeyin onu bağlamadığını, Al-İzz bin Abdülselam tarafından hüküm kurallarında belirlenen varsayım ve sorumluluktan kurtulma ilkesine dayanarak onu bağlamadığını hükmetti. Eğer açıkça veya kasıtlı olarak bir yemin ettiğinden kesin olarak eminse, yemin etmekle yükümlüdür. Yemini yerine getirme niyetiyle yapılan yardım yeterlidir ve gerisini tamamlar, çünkü bir yemin yerine getirilmelidir ve tam yeminsizlik durumlarında, Allah'a itaat etmeye yemin eden ve O'na itaat etmek zorunda olan kişinin hadislerine dayanarak vazgeçmek mümkün değildir."
  id: "Pertanyaan dari seorang pria yang sedang sangat tertekan dan berdoa kepada Tuhan dengan janji bahwa jika ia menerima pekerjaan, ia akan memberikan dua puluh persen dari gajinya sebagai amal, lalu menaikkan persentase seiring kenaikan gajinya. Ia tidak yakin apakah ia telah membuat sumpah, menerima pekerjaan itu, dan lupa apa yang ia katakan selama sekitar tiga tahun sambil menjalankan amal bulanan. Kemudian, karena takut itu adalah sumpah dan takut dengan ayat melanggar janji, Fatwa Center di IslamWeb menjawab bahwa ungkapan 'Aku berjanji kepada-Mu, ya Tuhan, bahwa jika aku mendapatkan perbuatan, aku akan memberi amal dengan sekian ini' tidak dianggap sebagai sumpah tersendiri, karena sumpah hanya dibuat dengan kata-kata yang mengandung komitmen. Janji semata bukanlah janji kecuali disertai dengan niat dan dianggap sebagai metafora, dan sumpah dibuat dengan metafora sesuai pandangan yang benar, mengutip Al-Khatib Al-Sharbini dalam Mughni Al-Muhtaj dan Al-Ramli dalam Nihayat Al-Muhtaj. Ia memutuskan bahwa ketika ada keraguan tentang pengucapan sumpah atau tentang keberadaan niat pada saat janji, default-nya adalah hal itu tidak benar, sehingga tidak ada yang mengikatnya, berdasarkan prinsip praduga dan pembebasan tanggung jawab yang ditetapkan oleh Al-Izz ibn Abd al-Salam dalam aturan keputusan. Jika ia benar-benar yakin telah membuat sumpah secara eksplisit atau dengan niat, maka ia wajib menepatinya. Apa yang beramal dengan niat memenuhi sumpah sudah cukup dan melengkapi sisanya, karena sumpah harus dipenuhi dan tidak diperbolehkan untuk menolaknya kecuali dalam kasus ketidakmampuan total, berdasarkan hadits seseorang yang bersumpah taat kepada Allah dan harus mematuhi-Nya."
