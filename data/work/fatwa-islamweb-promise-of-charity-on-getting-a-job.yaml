id: work/fatwa-islamweb-promise-of-charity-on-getting-a-job
class: work
kind: fatwa
label: { ar: "الوعد بالصدقة إذا حصل على عمل هل يأخذ حكم النذر، وحكم الشك فيه", en: "Does a promise to give charity on getting a job count as a vow, and what if one is unsure?", ur: "نوکری ملنے پر صدقے کا وعدہ: کیا یہ نذر ہے، اور شک کی صورت میں کیا حکم ہے؟" }
summary:
  ar: "سؤال من رجل كان في كرب شديد فدعا الله واعدًا إياه أنه إن قُبل في وظيفة أخرج عشرين بالمائة من راتبه صدقة ثم زاد النسبة كلما زاد راتبه، ولا يجزم هل قال كلمة نذرًا، وقُبل في الوظيفة ونسي ما قاله نحو ثلاث سنوات مع محافظته على صدقة شهرية، ثم خشي أن يكون ذلك نذرًا وهو مرعوب من آية إخلاف الوعد، أجاب فيه مركز الفتوى بإسلام ويب بأن قوله أعدك يا رب إن حصلت على عمل أن أتصدق بكذا لا يُعد نذرًا بمجرده، لأن النذر لا ينعقد إلا بلفظ مشعر بالالتزام، ومجرد الوعد لا يكون نذرًا إلا إذا اقترنت به نية فيكون كناية والنذر ينعقد بالكناية على الصحيح، ناقلًا عن الخطيب الشربيني في مغني المحتاج والرملي في نهاية المحتاج. وقرر أنه حيث شك في التلفظ بالنذر أو في وجود النية حال الوعد فالأصل عدم ذلك فلا يلزمه شيء، مستندًا إلى قاعدة استصحاب الأصل وبراءة الذمة التي قررها العز بن عبد السلام في قواعد الأحكام، فإن حصل له اليقين الجازم بأنه نذر بلفظ صريح أو بكناية مع النية لزمه الوفاء، وما تصدق به بنية الوفاء بالنذر يجزئه ويكمل الباقي، لأن النذر يجب الوفاء به ولا يجوز التحلل منه إلا عند العجز التام، لحديث من نذر أن يطيع الله فليطعه."
  en: "A question from a man who, in great distress, prayed to God promising that if he were accepted for a job he would give twenty per cent of his salary in charity and raise the share as his salary rose; he cannot be sure whether he used the word 'vow', was accepted, forgot what he had said for about three years while keeping up a monthly charity, then feared it might have been a vow and was terrified by the verse on breaking a promise to God. The fatwa centre of IslamWeb answered that saying 'I promise You, Lord, that if I get a job I will give such-and-such in charity' is not by itself a vow, because a vow is concluded only by a wording that conveys commitment, and a mere promise becomes a vow only when accompanied by an intention, in which case it is an allusive form, and a vow is concluded by allusive wording on the correct view, quoting al-Khatib al-Shirbini in Mughni al-Muhtaj and al-Ramli in Nihayat al-Muhtaj. It ruled that where he is in doubt whether he uttered the word 'vow' or had the intention at the time of the promise, the default is that he did not, so nothing is binding on him, relying on the principle of presuming the original state and the freedom of one's obligations as set out by al-Izz ibn Abd al-Salam in Qawa'id al-Ahkam; if he becomes certain that he vowed in express words or by allusion with intention, he must fulfil it, what he has already given with the intention of fulfilling the vow counts, and he completes the rest, because a vow must be fulfilled and may not be released except through complete inability, according to the hadith that whoever vows to obey God should obey Him."
  ur: "ایک شخص کا سوال جس نے سخت پریشانی میں اللہ سے دعا کی اور وعدہ کیا کہ اگر وہ نوکری میں قبول ہوا تو اپنی تنخواہ کا بیس فیصد صدقہ کرے گا اور تنخواہ بڑھنے پر حصہ بڑھاتا جائے گا؛ اسے یقین نہیں کہ اس نے لفظ نذر کہا یا نہیں، وہ قبول ہوا، تقریباً تین سال تک اپنا کہا بھول گیا جبکہ ماہانہ صدقہ جاری رکھا، پھر ڈرا کہ شاید یہ نذر تھی اور اللہ سے وعدہ خلافی کی آیت سے خوفزدہ ہوا۔ اسلام ویب کے فتویٰ مرکز نے جواب دیا کہ یہ کہنا کہ 'اے رب، میں وعدہ کرتا ہوں کہ اگر مجھے کام ملا تو اتنا صدقہ کروں گا' بذاتِ خود نذر نہیں، کیونکہ نذر صرف ایسے لفظ سے منعقد ہوتی ہے جو التزام ظاہر کرے، اور محض وعدہ تب نذر بنتا ہے جب اس کے ساتھ نیت ہو، اس صورت میں یہ کنایہ ہے اور صحیح قول پر نذر کنایے سے منعقد ہوتی ہے، خطیب شربینی کی مغنی المحتاج اور رملی کی نہایۃ المحتاج سے نقل کرتے ہوئے۔ اس نے فیصلہ کیا کہ جہاں اسے شک ہو کہ اس نے لفظ نذر کہا یا وعدے کے وقت نیت تھی، وہاں اصل عدم ہے لہٰذا اس پر کچھ لازم نہیں، استصحابِ اصل اور براءتِ ذمہ کے اس قاعدے کی بنا پر جو عز بن عبد السلام نے قواعد الاحکام میں بیان کیا؛ اگر اسے پختہ یقین ہو جائے کہ اس نے صریح لفظ سے یا نیت کے ساتھ کنایے سے نذر مانی تو اس پر اسے پورا کرنا لازم ہے، نذر پوری کرنے کی نیت سے جو صدقہ دیا وہ شمار ہوگا اور باقی مکمل کرے، کیونکہ نذر کو پورا کرنا واجب ہے اور مکمل عاجزی کے سوا اس سے نکلنا جائز نہیں، اس حدیث کی بنا پر کہ جو اللہ کی اطاعت کی نذر مانے وہ اس کی اطاعت کرے۔"
