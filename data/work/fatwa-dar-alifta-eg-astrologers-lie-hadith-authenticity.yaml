id: work/fatwa-dar-alifta-eg-astrologers-lie-hadith-authenticity
class: work
kind: fatwa
label: { ar: "مدى صحة مقولة كذب المنجمون ولو صدقوا", en: "Is 'the astrologers lie even when truthful' a hadith?", ur: "کیا ⁦(نجومی جھوٹ بولتے ہیں اگرچہ سچ کہیں)⁩ حدیث ہے؟", es: "¿Es un hadiz la afirmación de que \"los astrólogos mienten incluso cuando dicen la verdad\"?", fr: "L'affirmation « les astrologues mentent même lorsqu'ils disent la vérité » est-elle un hadith ?" }
summary:
  ar: "سائل سأل عن مدى صحة مقولة ⁦(كذب المنجمون ولو صدقوا)⁩ المشهورة على ألسنة الناس. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21084)⁩ أنها ليست من الأحاديث النبوية الشريفة وإن كان معناها صحيحًا على ما فصّل الجواب."
  en: "A questioner asked about the soundness of the saying on people's tongues, 'the astrologers lie even when they speak truth.' Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21084) answered that it is not among the noble prophetic hadiths, though its meaning is sound — as the answer details."
  ur: "ایک سائل نے مشہور قول ⁦(نجومی جھوٹ بولتے ہیں اگرچہ سچ کہیں)⁩ کی صحت پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21084)⁩ نے جواب دیا کہ یہ نبوی احادیث میں سے نہیں البتہ اس کا مفہوم صحیح ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre la veracidad del dicho popular: «Los astrólogos mienten incluso cuando dicen la verdad». El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21084) respondió que no se encuentra entre los hadices proféticos nobles, aunque su significado es válido, como se detalla en la respuesta."
  fr: "Un internaute a interrogé Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21084) sur la validité du dicton populaire: « Les astrologues mentent même lorsqu'ils disent la vérité. » Il a répondu que ce dicton ne figure pas parmi les hadiths prophétiques authentiques, bien que sa signification soit juste, comme le précise la réponse."
