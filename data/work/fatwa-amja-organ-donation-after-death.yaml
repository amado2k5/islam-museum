id: work/fatwa-amja-organ-donation-after-death
class: work
kind: fatwa
label: { ar: "التبرع بالأعضاء بعد الموت", en: "Organ donation after death", ur: "موت کے بعد اعضاء کا عطیہ", es: "Donación de órganos después del fallecimiento", fr: "don d'organes après le décès", tr: "Ölümünden sonra organ bağışı", id: "Donasi organ anumerta" }
summary:
  ar: "سأل سائل عن جواز التبرع بأعضاء الجسم بعد الموت. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82987 بتاريخ 29 أكتوبر 2010)⁩ أنه لا حرج في أن يوصي بالتبرع بعد موته ببعض أعضائه لإنقاذ حياة المرضى والمبتلين ما دام يغلب على الظن انتفاعهم به وقف رؤية المتخصصين، ولا حرج أن يتولى ذلك ورثته نيابة عنه إذا فاضت نفسه قبل أن يوصي به."
  en: "A questioner asked about the permissibility of donating one's organs after death. Dr. Salah al-Sawi (fatwa no. 82987, 29 October 2010) answered that there is no harm in bequeathing some of one's organs after death to save the lives of the sick and afflicted, provided the specialists' assessment makes benefit likely; and that one's heirs may make that donation on one's behalf if one dies before bequeathing it."
  ur: "ایک سائل نے مرنے کے بعد اعضاء عطیہ کرنے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82987، 29 اکتوبر 2010)⁩ کے مطابق مریضوں کی جان بچانے کے لیے وصیت کرنا جائز ہے بشرط ماہرین کے مطابق فائدہ غالب ہو؛ وصیت نہ کی ہو تو ورثاء کر سکتے ہیں۔"
  es: "Un consultante preguntó sobre la permisibilidad de donar órganos después de la muerte. El Dr. Salah al-Sawi (fatwa n.° 82987, 29 de octubre de 2010) respondió que no hay inconveniente en legar algunos de los órganos después de la muerte para salvar la vida de los enfermos y afligidos, siempre que la evaluación de los especialistas indique que es probable que haya un beneficio; y que los herederos pueden realizar dicha donación en nombre del donante si este fallece antes de legar los órganos."
  fr: "Une personne a posé une question concernant la licéité du don d'organes après le décès. Le Dr Salah al-Sawi (fatwa n° 82987, 29 octobre 2010) a répondu qu'il n'y a pas d'inconvénient à léguer certains de ses organes après sa mort pour sauver des vies, à condition que l'évaluation des spécialistes rende le don bénéfique probable; et que les héritiers peuvent effectuer ce don en son nom si le défunt décède avant d'avoir pu le faire."
  tr: "Bir soruya ölüm sonrası vücut organı bağışlamanın izinliliği soruldu. Dr. Salah Al-Sawy (Fetva No. 82987, 29 Ekim 2010), hastaların ve hastaların hayatlarını kurtarmak için bazı organlarını ölümden sonra vasiyet etmenin, uzman görme vakfından fayda sağlama olasılığı en yüksek olduğu sürece zarar vereceğini yanıtladı. Eğer kendisi miras bırakmadan önce ölmüşse, varislerinin bu sorumluluğu onun adına üstlenmesinde bir sakınca yoktur."
  id: "Seorang penanya ditanya tentang kelayakan mendonorkan organ tubuh setelah kematian. Dr. Salah Al-Sawy (Fatwa No. 82987 tanggal 29 Oktober 2010) menjawab bahwa tidak ada salahnya mewariskan beberapa organ setelah kematian untuk menyelamatkan nyawa pasien dan individu yang terkena, selama kemungkinan besar mereka mendapat manfaat dari dana bantuan spesialis. Tidak ada salahnya jika ahli warisnya mengambil alih hal ini atas namanya jika ia telah meninggal sebelum mewariskannya."
