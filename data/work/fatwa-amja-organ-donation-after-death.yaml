id: work/fatwa-amja-organ-donation-after-death
class: work
kind: fatwa
label: { ar: "التبرع بالأعضاء بعد الموت", en: "Organ donation after death", ur: "موت کے بعد اعضاء کا عطیہ" }
summary:
  ar: "سأل سائل عن جواز التبرع بأعضاء الجسم بعد الموت. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82987 بتاريخ 29 أكتوبر 2010)⁩ أنه لا حرج في أن يوصي بالتبرع بعد موته ببعض أعضائه لإنقاذ حياة المرضى والمبتلين ما دام يغلب على الظن انتفاعهم به وقف رؤية المتخصصين، ولا حرج أن يتولى ذلك ورثته نيابة عنه إذا فاضت نفسه قبل أن يوصي به."
  en: "A questioner asked about the permissibility of donating one's organs after death. Dr. Salah al-Sawi (fatwa no. 82987, 29 October 2010) answered that there is no harm in bequeathing some of one's organs after death to save the lives of the sick and afflicted, provided the specialists' assessment makes benefit likely; and that one's heirs may make that donation on one's behalf if one dies before bequeathing it."
  ur: "ایک سائل نے مرنے کے بعد اعضاء عطیہ کرنے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82987، 29 اکتوبر 2010)⁩ کے مطابق مریضوں کی جان بچانے کے لیے وصیت کرنا جائز ہے بشرط ماہرین کے مطابق فائدہ غالب ہو؛ وصیت نہ کی ہو تو ورثاء کر سکتے ہیں۔"
