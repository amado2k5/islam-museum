label: { ar: "كتاب السنة ⁦(الخلال)⁩", en: "Kitab al-Sunna (al-Khallal)", ur: "کتاب السنہ ⁦(خلال)⁩", es: "Kitab al-Sunna (al-Khallal)", fr: "Kitab al-Sunna (al-Khallal)", tr: "Sünnet Kitabı (Al-Khallal)", id: "Kitab Sunnah (Al-Khallal)" }
summary:
  ar: "كتاب أبي بكر الخلال ⁦(234–311هـ)⁩ في أبواب الاعتقاد، جمع فيه بالأسانيد أقوال الإمام أحمد بن حنبل وآثار السلف في السمع والطاعة والخوارج، وفضائل النبي والمقام المحمود، والصحابة والخلافة والتفضيل، والقدر، والإيمان والرد على المرجئة، والقرآن والرد على الجهمية؛ وكان في ثلاثة مجلدات وصل منها المجلد الأول في نسخة وحيدة بالمتحف البريطاني، ووصفه ابن تيمية بأنه أجمع كتاب تُذكر فيه أقوال أحمد في أصول الدين {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 3-5} {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 14}."
  en: "Abu Bakr al-Khallal's (234–311 AH) book on matters of creed, gathering with chains the sayings of Ahmad ibn Hanbal and the early authorities on obedience to rulers and the Kharijites, the Prophet's merits and the Praiseworthy Station, the Companions, the caliphate and precedence, predestination, faith and the refutation of the Murji'a, and the Qur'an and the refutation of the Jahmiyya; it ran to three volumes, of which the first survives in a single British Museum manuscript, and Ibn Taymiyya called it the fullest book recording Ahmad's views on the foundations of religion {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 3-5} {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 14}."
  ur: "ابو بکر خلال ⁦(234–311ھ)⁩ کی عقیدے کے ابواب پر کتاب، جس میں انہوں نے سندوں کے ساتھ امام احمد بن حنبل اور سلف کے اقوال جمع کیے: حکمرانوں کی اطاعت اور خوارج، نبی کے فضائل اور مقامِ محمود، صحابہ، خلافت اور تفضیل، تقدیر، ایمان اور مرجئہ کا رد، اور قرآن اور جہمیہ کا رد؛ یہ تین جلدوں میں تھی جن میں سے پہلی جلد برٹش میوزیم کے ایک ہی نسخے میں باقی ہے، اور ابن تیمیہ نے اسے اصولِ دین میں احمد کے اقوال کی سب سے جامع کتاب کہا {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 3-5} {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 14}۔"
  es: "El libro de Abu Bakr al-Khallal (234–311 AH) sobre cuestiones de credo, que reúne con cadenas los dichos de Ahmad ibn Hanbal y las primeras autoridades sobre la obediencia a los gobernantes y los jariyitas, los méritos del Profeta y la Estación Alabada, los Compañeros, el califato y la precedencia, la predestinación, la fe y la refutación de los Murji'a, y el Corán y la refutación de los Jahmiyya; constaba de tres volúmenes, de los cuales el primero sobrevive en un único manuscrito del Museo Británico, e Ibn Taymiyya lo llamó el libro más completo que registra las opiniones de Ahmad sobre los fundamentos de la religión {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 3-5} {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 14}."
  fr: "L'ouvrage d'Abu Bakr al-Khallal (234-311 AH) sur les questions de croyance, rassemblant avec des chaînes les paroles d'Ahmad ibn Hanbal et des premières autorités sur l'obéissance aux dirigeants et aux Kharijites, les mérites du Prophète et la Station louable, les Compagnons, le califat et la préséance, la prédestination, la foi et la réfutation des Murji'a, et le Coran et la réfutation des Jahmiyya; il comportait trois volumes, dont le premier survit dans un unique manuscrit du British Museum, et Ibn Taymiyya l'a qualifié de livre le plus complet enregistrant les vues d'Ahmad sur les fondements de la religion {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 3-5} {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 14}."
  tr: "Ebu Bekir el-Hallal'ın (234–311 H) iman bölümleri üzerine kitabı, İmam Ahmed bin Hanbal'ın sözlerini, ilk kuşakların işitme, itaat ve Havaric'deki geleneklerini, Peygamber'in erdemlerini ve övülen makamı, sahabeleri, halifeliği ve üstünlüğünü, kader, imanı, Murji'ah'ın, Kur'an'ın çürütülmesini ve Jahmiyye'nin çürütülmesini zincirlerle derlemiştir. Üç cilt halinde olup, ilk cilt tek bir kopya olarak British Museum'a ulaşmıştır. İbn Teymiyye, bu kitabı Ahmad'ın dinin temelleri üzerine ifadelerini en kapsamlı şekilde anan kitap olarak tanımlamıştır {cite:kitab-al-sunna-khallal-al-hamdan-2018 s. 14}."
  id: "Kitab Abu Bakr al-Khallal (234–311 H) tentang bab-bab kepercayaan, di mana ia menyusun dengan rantai transmisi perkataan Imam Ahmad ibn Hanbal, tradisi generasi awal dalam pendengaran, ketaatan, dan Khawarij, kebajikan Nabi dan kedudukan yang dipuji, para sahabat, Khalifah dan keunggulan, takdir, iman, penolakan terhadap Murji'ah, Al-Qur'an, dan penolakan terhadap Jahmiyyah. Buku ini terdiri dari tiga jilid, di mana jilid pertama tiba dalam satu salinan di British Museum. Ibn Taymiyyah menggambarkannya sebagai buku paling komprehensif yang menyebutkan pernyataan Ahmad tentang dasar-dasar agama {cite:kitab-al-sunna-khallal-al-hamdan-2018 hlm. 14}."
