structure: "المجلد الأول الموجود في سبعة أجزاء (فُقد الثاني والثالث): أبواب السمع والطاعة والفتن والخوارج واللصوص؛ فضائل النبي وما أنكرته الجهمية من المقام المحمود؛ الصحابة والخلافة والتفضيل؛ القدر والرد على القدرية؛ الإيمان والرد على المرجئة (وفيه كتاب أحمد في الإيمان)؛ ثم أبواب في القرآن والرد على الجهمية واللفظية والواقفة (المقدمة، ص 5 من المسح). والمفقود في الغالب أبواب الرد على الجهمية والصفات والقبر والجنة والنار، جمع المحقق ما نُقل منها في ذيل (ص 948 وما بعدها)."
