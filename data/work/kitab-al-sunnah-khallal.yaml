summary:
  ar: "كتاب أبي بكر الخلال ⁦(234–311هـ)⁩ في أبواب الاعتقاد، جمع فيه بالأسانيد أقوال الإمام أحمد بن حنبل وآثار السلف في السمع والطاعة والخوارج، وفضائل النبي والمقام المحمود، والصحابة والخلافة والتفضيل، والقدر، والإيمان والرد على المرجئة، والقرآن والرد على الجهمية؛ وكان في ثلاثة مجلدات وصل منها المجلد الأول في نسخة وحيدة بالمتحف البريطاني، ووصفه ابن تيمية بأنه أجمع كتاب تُذكر فيه أقوال أحمد في أصول الدين {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 3-5} {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 14}."
  en: "Abu Bakr al-Khallal's (234–311 AH) book on matters of creed, gathering with chains the sayings of Ahmad ibn Hanbal and the early authorities on obedience to rulers and the Kharijites, the Prophet's merits and the Praiseworthy Station, the Companions, the caliphate and precedence, predestination, faith and the refutation of the Murji'a, and the Qur'an and the refutation of the Jahmiyya; it ran to three volumes, of which the first survives in a single British Museum manuscript, and Ibn Taymiyya called it the fullest book recording Ahmad's views on the foundations of religion {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 3-5} {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 14}."
  ur: "ابو بکر خلال ⁦(234–311ھ)⁩ کی عقیدے کے ابواب پر کتاب، جس میں انہوں نے سندوں کے ساتھ امام احمد بن حنبل اور سلف کے اقوال جمع کیے: حکمرانوں کی اطاعت اور خوارج، نبی کے فضائل اور مقامِ محمود، صحابہ، خلافت اور تفضیل، تقدیر، ایمان اور مرجئہ کا رد، اور قرآن اور جہمیہ کا رد؛ یہ تین جلدوں میں تھی جن میں سے پہلی جلد برٹش میوزیم کے ایک ہی نسخے میں باقی ہے، اور ابن تیمیہ نے اسے اصولِ دین میں احمد کے اقوال کی سب سے جامع کتاب کہا {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 3-5} {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 14}۔"
