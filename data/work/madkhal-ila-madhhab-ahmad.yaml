summary:
  ar: 'كتاب ابن بدران في مقدمة وثمانية عقود تعرّف بالمذهب الحنبلي: عقائد الإمام، وسبب اختيار المذهب، وأصوله، ومسلك أصحابه، وأصوله الفقهية، ومصطلحاته، وكتبه المشهورة، وأقسام الفقه عند الحنابلة.'
  en: "Ibn Badran's book in an introduction and eight chapters introducing the Hanbali school: the Imam's creed, the reason the school was chosen, its principles, the path of his companions, its legal theory, its terminology, its famous books, and the divisions of jurisprudence among the Hanbalis."
