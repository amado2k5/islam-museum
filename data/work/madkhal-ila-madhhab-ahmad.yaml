label:
  ar: المدخل إلى مذهب الإمام أحمد بن حنبل
  en: "al-Madkhal ila Madhhab al-Imam Ahmad ibn Hanbal"
  ur: "المدخل الذھب الامام احمد بن حنبل"
  tr: "İmam Ahmed ibn Hanbal Okuluna Giriş"
  id: "Pengantar Sekolah Imam Ahmad ibn Hanbal"
summary:
  ar: 'كتاب ابن بدران في مقدمة وثمانية عقود تعرّف بالمذهب الحنبلي: عقائد الإمام، وسبب اختيار المذهب، وأصوله، ومسلك أصحابه، وأصوله الفقهية، ومصطلحاته، وكتبه المشهورة، وأقسام الفقه عند الحنابلة.'
  en: "Ibn Badran's book in an introduction and eight chapters introducing the Hanbali school: the Imam's creed, the reason the school was chosen, its principles, the path of his companions, its legal theory, its terminology, its famous books, and the divisions of jurisprudence among the Hanbalis."
  es: "El libro de Ibn Badran consta de una introducción y ocho capítulos que presentan la escuela Hanbali: el credo del Imam, la razón por la que se eligió la escuela, sus principios, el camino de sus compañeros, su teoría jurídica, su terminología, sus libros famosos y las divisiones de la jurisprudencia entre los Hanbalis."
  fr: "Le livre d'Ibn Badran comprend une introduction et huit chapitres présentant l'école hanbalite: la croyance de l'imam, la raison du choix de cette école, ses principes, la voie de ses compagnons, sa théorie juridique, sa terminologie, ses ouvrages célèbres et les divisions de la jurisprudence chez les hanbalites."
  ur: "ابن بدران کی کتاب ایک تعارف میں اور آٹھ ابواب میں مکتب حنبلی کا تعارف: امام کا عقیدہ، مکتب کے انتخاب کی وجہ، اس کے اصول، اس کے ساتھیوں کا راستہ، اس کا قانونی نظریہ، اس کی اصطلاحات، اس کی مشہور کتابیں، اور حنبلیوں کے درمیان فقہ کی تقسیم۔"
  tr: "İbn Bedran'ın kitabı girişte ve sekiz on yıl boyunca Hanbali okulu olarak bilinir: imamın inançları, okulun seçilme nedeni, ilkeleri, yoldaşlarının yaklaşımı, fıkhhi ilkeleri, terminolojisi, ünlü kitapları ve Hanbalilere göre fıkıh bölümleri."
  id: "Buku Ibn Badran dalam pengantar dan delapan dekade yang dikenal sebagai aliran Hanbali: kepercayaan Imam, alasan memilih mazhab, prinsip-prinsipnya, pendekatan para pendampingnya, prinsip firih, terminologinya, buku-buku terkenalnya, dan pembagian yurisprudensi menurut Hanbali."
