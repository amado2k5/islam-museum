id: work/fatwa-islamweb-which-facial-hair-counts-as-the-beard
class: work
kind: fatwa
label: { ar: "أنواع شعر الوجه وما يُعدّ من اللحية وما لا يُعدّ منها وأحكام الأخذ منه", en: "Which facial hair counts as the beard, and the rules for trimming it", ur: "چہرے کے بالوں کی قسمیں، کون سے داڑھی میں شامل ہیں اور انہیں کم کرنے کے احکام", es: "¿Qué vello facial se considera barba y cuáles son las reglas para recortarla?", fr: "Quels poils du visage sont considérés comme de la barbe, et quelles sont les règles pour les tailler ?", tr: "Sakal türleri, hangilerinin sakal sayıldığı ve hangilerinin sayılmayacağı ve bunlardan alınma kararları", id: "Jenis-jenis janggut, apa yang dihitung sebagai janggut dan apa yang bukan, serta aturan tentang pengambilan dari janggut tersebut" }
summary:
  ar: "سؤال من شاب لم يكتمل نمو لحيته ولم ينبت منها إلا شعر السوالف الممتد إلى أسفل الأذن، هل يُعدّ هذا الشعر من اللحية وتجري عليه أحكامها، وما القدر الذي يجوز تقصيره مع عدم تناسق مظهره، أجاب فيه مركز الفتوى بإسلام ويب بتفصيل أنواع الشعر: فالصدغ المحاذي لرأس الأذن من شعر الرأس لا من اللحية فلا حرج في حلقه أو قصه، أما العذار المحاذي صماخ الأذن والعارض الذي تحته فمن اللحية، ناقلًا تحديد البهوتي لحد الوجه والعذار والعارض والصدغ، وقول ابن حجر الهيتمي في التحفة إن ما انحط عن الصدغ إلى اللحية عارض حكمه حكمها وأن اللحية الشعر النابت على الذقن ومثلها العارض. وقرر أن ما يحاذي رأس الأذن يجوز قصه وحلقه، أما شعر الخدين والعارض وما حاذى صماخ الأذن فمن اللحية والراجح وجوب إعفائها وعدم جواز حلقها، مع جواز الأخذ منها بما يحصل به تحسين الهيئة، والقدر الجائز ما يحصل به المقصود من دفع ضرر قبح المظهر لأن الضرر يُزال، وإن صبر وترك الأخذ فحسن."
  en: "A question from a young man whose beard has not yet grown in fully, only the sideburn hair reaching an inch or two below the ear, asking whether this hair counts as the beard and is subject to its rulings, and how much he may trim given his uneven appearance; the fatwa centre of IslamWeb answered by distinguishing the kinds of hair: the temple hair level with the top of the ear belongs to the hair of the head, not the beard, so there is no harm in shaving or trimming it, while the hair level with the ear canal and the hair below it on the cheek belong to the beard, quoting al-Buhuti's definition of the bounds of the face, the cheek hair and the temple, and Ibn Hajar al-Haytami in al-Tuhfa that what descends from the temple towards the beard is cheek hair with the beard's ruling, and that the beard is the hair growing on the chin together with the cheek hair. It ruled that hair level with the top of the ear may be trimmed and shaved, whereas the hair of the cheeks and what is level with the ear canal belongs to the beard, which on the stronger view must be left to grow and may not be shaved, though taking from it to improve one's appearance is unobjectionable; the permissible amount is what achieves the purpose of removing the harm of an ugly appearance, since harm is to be removed, and if he bears with it and leaves it untrimmed, that is good."
  ur: "ایک نوجوان کا سوال جس کی داڑھی ابھی پوری نہیں آئی اور صرف قلموں کے بال نکلے ہیں جو کان کے نیچے ایک دو انچ تک جاتے ہیں، کہ کیا یہ بال داڑھی میں شمار ہیں اور ان پر اس کے احکام جاری ہیں، اور بے ترتیب حلیے کی وجہ سے وہ کتنا کم کر سکتا ہے؛ اسلام ویب کے فتویٰ مرکز نے بالوں کی قسموں کی تفصیل سے جواب دیا: کان کے اوپری سرے کے برابر کنپٹی کے بال سر کے بالوں میں سے ہیں نہ کہ داڑھی میں، لہٰذا انہیں مونڈنے یا کاٹنے میں کوئی حرج نہیں، جبکہ کان کے سوراخ کے برابر بال اور اس کے نیچے رخسار کے بال داڑھی میں سے ہیں، بہوتی کی چہرے، عذار، عارض اور کنپٹی کی حد کی تعریف اور ابن حجر ہیتمی کے التحفہ میں اس قول کے حوالے سے کہ جو کنپٹی سے داڑھی کی طرف اترے وہ عارض ہے جس کا حکم داڑھی کا ہے، اور داڑھی ٹھوڑی پر نکلنے والے بال ہیں اور عارض بھی اسی طرح ہے۔ اس نے فیصلہ کیا کہ کان کے اوپری سرے کے برابر بال کاٹے اور مونڈے جا سکتے ہیں، جبکہ رخساروں کے بال اور جو کان کے سوراخ کے برابر ہوں وہ داڑھی میں سے ہیں جسے راجح قول پر بڑھانا واجب اور مونڈنا ناجائز ہے، البتہ حلیہ بہتر کرنے کے لیے اس میں سے لینا بلا مضائقہ ہے؛ جائز مقدار وہ ہے جس سے بدنما حلیے کے ضرر کو دور کرنے کا مقصد حاصل ہو، کیونکہ ضرر دور کیا جاتا ہے، اور اگر وہ صبر کرے اور نہ کاٹے تو بہتر ہے۔"
  es: "Un joven, cuya barba aún no le ha crecido del todo, y solo le llega el pelo de las patillas una o dos pulgadas por debajo de la oreja, preguntó si ese pelo se considera barba y está sujeto a sus normas, y cuánto puede recortarlo dada su apariencia irregular. El centro de fatwas de IslamWeb respondió distinguiendo los tipos de pelo: el pelo de la sien a la altura de la parte superior de la oreja pertenece al pelo de la cabeza, no a la barba, por lo que no hay problema en afeitarlo o recortarlo, mientras que el pelo a la altura del conducto auditivo y el pelo que está debajo en la mejilla pertenecen a la barba, citando la definición de al-Buhuti de los límites de la cara, el pelo de la mejilla y la sien, e Ibn Hajar al-Haytami en al-Tuhfa que lo que desciende de la sien hacia la barba es pelo de la mejilla con la norma de la barba, y que la barba es el pelo que crece en la barbilla junto con el pelo de la mejilla. Se dictaminó que el vello a la altura de la parte superior de la oreja puede recortarse y afeitarse, mientras que el vello de las mejillas y el que está a la altura del conducto auditivo pertenecen a la barba, la cual, según la opinión más estricta, debe dejarse crecer y no puede afeitarse, aunque recortarla para mejorar la apariencia es aceptable; la cantidad permitida es la que logra el propósito de eliminar el daño de una apariencia poco atractiva, ya que el daño debe eliminarse, y si la persona lo tolera y la deja sin recortar, eso es bueno."
  fr: "Un jeune homme, dont la barbe n'est pas encore complètement fournie (seuls les favoris atteignent quelques centimètres sous l'oreille), se demandait si ces poils comptaient comme faisant partie de la barbe et étaient soumis aux mêmes règles, et quelle quantité il pouvait tailler compte tenu de son apparence irrégulière. Le centre de fatwas d'IslamWeb a répondu en distinguant les types de poils: les poils des tempes, au niveau du haut de l'oreille, appartiennent aux cheveux et non à la barbe; il n'y a donc aucun inconvénient à les raser ou à les tailler. Quant aux poils au niveau du conduit auditif et à ceux situés en dessous, sur la joue, ils font partie de la barbe. Le centre cite la définition d'al-Buhuti concernant les limites du visage (poils des joues et des tempes), ainsi que celle d'Ibn Hajar al-Haytami dans al-Tuhfa, selon laquelle les poils descendant des tempes vers la barbe sont des poils de joue soumis aux mêmes règles que ceux de la barbe, et que la barbe est constituée des poils poussant sur le menton, avec ceux des joues. Il a été statué que les poils arrivant au niveau du haut de l'oreille peuvent être taillés et rasés, tandis que les poils des joues et ceux arrivant au niveau du conduit auditif appartiennent à la barbe, qui, selon l'avis le plus strict, doit être laissée pousser et ne peut être rasée, bien qu'il ne soit pas répréhensible d'en prélever pour améliorer son apparence; la quantité admissible est celle qui permet d'éliminer le préjudice d'une apparence disgracieuse, puisque le préjudice doit être éliminé, et s'il la supporte et la laisse non taillée, c'est bien."
  tr: "Sakalı tam olarak çıkmamış ve sadece kulağın altına uzanan favori tüyleri sakalın bir parçası sayılan ve onun kuralları geçerli olan genç bir adama bir soru: Tutarsız görünümüne rağmen kesilmesi ne ölçüde izinlidir? Islamweb'deki fetva merkezi, saç türlerini detaylandırarak şöyle yanıt verdi: Kulak başına bitişik şakak saçından kaynaklanır, sakal değil, bu yüzden tıraş etmek veya kesmek zarar vermez. Kulak zarına bitişik idhar ve altındaki taraf ise sakaldan gelir ve 'bahti'nin yüzün, 'idarın, yan tarafın ve tapınağın sınırlarına kadar uzanan kimliğini taşır. İbn Hajar al-Haytami, Al-Tuhfa'da tapınaktan sakalın sakalın hükümüyle çeliştiğini ve sakalın çenede çıkan saç olduğunu ve benzeri yan tarafta çıkan tüyler olduğunu söylemiştir. Kulak ucuna bitişik olan tüylerin kesilip tıraş edilebileceğini belirlemiştir. Yanaklar, yanlar ve kulak zarına bitişik tüyler için sakalın muaf tutulması gerekir ve tıraş edilmesi yasaktır, ancak görünümü iyileştirmek için kullanılması izinlidir. İzin verilen önlem, zarar giderildiği için çirkin görünümden kaynaklanan zararı önlemek için tasarlanmıştır. Sabırlı olup saç almaktan kaçınılırsa iyidir."
  id: "Pertanyaan kepada pemuda yang janggutnya belum tumbuh sepenuhnya dan hanya rambut jambang yang memanjang di bawah telinga dianggap sebagai bagian dari janggut dan keputusannya berlaku, dan sejauh mana diperbolehkan untuk memotongnya meskipun penampilannya tidak konsisten? Pusat Fatwa di Islamweb, yang merinci jenis rambut, menjawab: Kuil yang berdekatan dengan kepala telinga berasal dari rambut kepala, bukan janggut, jadi tidak ada salahnya mencukur atau memangkasnya. Adapun idhar yang berdekatan dengan gendang telinga dan sisi di bawahnya, itu berasal dari janggut, yang menunjukkan identifikasi 'bahti' hingga batas wajah, 'idhar, sisi, dan kuil. Ibn Hajar al-Haytami mengatakan dalam Al-Tuhfa bahwa apa yang turun dari kuil ke janggut bertentangan dengan keputusannya, dan jenggot adalah rambut yang tumbuh di dagu dan sebagainya, di sisi. Ia menetapkan bahwa apa yang berada di sekitar ujung telinga dapat dipotong dan dicukur. Adapun rambut di pipi, sisi, dan yang berdekatan dengan gendang telinga, dianggap sebagai jenggot harus dikecualikan dan mencukur tidak diperbolehkan, meskipun diperbolehkan digunakan untuk memperbaiki penampilan. Tindakan yang diperbolehkan adalah yang dimaksudkan untuk mencegah kerusakan akibat penampilan jelek karena kerusakan tersebut dihilangkan. Jika seseorang sabar dan menahan diri untuk tidak mengambilnya, itu baik."
