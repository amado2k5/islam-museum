id: work/fatwa-islamweb-which-facial-hair-counts-as-the-beard
class: work
kind: fatwa
label: { ar: "أنواع شعر الوجه وما يُعدّ من اللحية وما لا يُعدّ منها وأحكام الأخذ منه", en: "Which facial hair counts as the beard, and the rules for trimming it", ur: "چہرے کے بالوں کی قسمیں، کون سے داڑھی میں شامل ہیں اور انہیں کم کرنے کے احکام" }
summary:
  ar: "سؤال من شاب لم يكتمل نمو لحيته ولم ينبت منها إلا شعر السوالف الممتد إلى أسفل الأذن، هل يُعدّ هذا الشعر من اللحية وتجري عليه أحكامها، وما القدر الذي يجوز تقصيره مع عدم تناسق مظهره، أجاب فيه مركز الفتوى بإسلام ويب بتفصيل أنواع الشعر: فالصدغ المحاذي لرأس الأذن من شعر الرأس لا من اللحية فلا حرج في حلقه أو قصه، أما العذار المحاذي صماخ الأذن والعارض الذي تحته فمن اللحية، ناقلًا تحديد البهوتي لحد الوجه والعذار والعارض والصدغ، وقول ابن حجر الهيتمي في التحفة إن ما انحط عن الصدغ إلى اللحية عارض حكمه حكمها وأن اللحية الشعر النابت على الذقن ومثلها العارض. وقرر أن ما يحاذي رأس الأذن يجوز قصه وحلقه، أما شعر الخدين والعارض وما حاذى صماخ الأذن فمن اللحية والراجح وجوب إعفائها وعدم جواز حلقها، مع جواز الأخذ منها بما يحصل به تحسين الهيئة، والقدر الجائز ما يحصل به المقصود من دفع ضرر قبح المظهر لأن الضرر يُزال، وإن صبر وترك الأخذ فحسن."
  en: "A question from a young man whose beard has not yet grown in fully, only the sideburn hair reaching an inch or two below the ear, asking whether this hair counts as the beard and is subject to its rulings, and how much he may trim given his uneven appearance; the fatwa centre of IslamWeb answered by distinguishing the kinds of hair: the temple hair level with the top of the ear belongs to the hair of the head, not the beard, so there is no harm in shaving or trimming it, while the hair level with the ear canal and the hair below it on the cheek belong to the beard, quoting al-Buhuti's definition of the bounds of the face, the cheek hair and the temple, and Ibn Hajar al-Haytami in al-Tuhfa that what descends from the temple towards the beard is cheek hair with the beard's ruling, and that the beard is the hair growing on the chin together with the cheek hair. It ruled that hair level with the top of the ear may be trimmed and shaved, whereas the hair of the cheeks and what is level with the ear canal belongs to the beard, which on the stronger view must be left to grow and may not be shaved, though taking from it to improve one's appearance is unobjectionable; the permissible amount is what achieves the purpose of removing the harm of an ugly appearance, since harm is to be removed, and if he bears with it and leaves it untrimmed, that is good."
  ur: "ایک نوجوان کا سوال جس کی داڑھی ابھی پوری نہیں آئی اور صرف قلموں کے بال نکلے ہیں جو کان کے نیچے ایک دو انچ تک جاتے ہیں، کہ کیا یہ بال داڑھی میں شمار ہیں اور ان پر اس کے احکام جاری ہیں، اور بے ترتیب حلیے کی وجہ سے وہ کتنا کم کر سکتا ہے؛ اسلام ویب کے فتویٰ مرکز نے بالوں کی قسموں کی تفصیل سے جواب دیا: کان کے اوپری سرے کے برابر کنپٹی کے بال سر کے بالوں میں سے ہیں نہ کہ داڑھی میں، لہٰذا انہیں مونڈنے یا کاٹنے میں کوئی حرج نہیں، جبکہ کان کے سوراخ کے برابر بال اور اس کے نیچے رخسار کے بال داڑھی میں سے ہیں، بہوتی کی چہرے، عذار، عارض اور کنپٹی کی حد کی تعریف اور ابن حجر ہیتمی کے التحفہ میں اس قول کے حوالے سے کہ جو کنپٹی سے داڑھی کی طرف اترے وہ عارض ہے جس کا حکم داڑھی کا ہے، اور داڑھی ٹھوڑی پر نکلنے والے بال ہیں اور عارض بھی اسی طرح ہے۔ اس نے فیصلہ کیا کہ کان کے اوپری سرے کے برابر بال کاٹے اور مونڈے جا سکتے ہیں، جبکہ رخساروں کے بال اور جو کان کے سوراخ کے برابر ہوں وہ داڑھی میں سے ہیں جسے راجح قول پر بڑھانا واجب اور مونڈنا ناجائز ہے، البتہ حلیہ بہتر کرنے کے لیے اس میں سے لینا بلا مضائقہ ہے؛ جائز مقدار وہ ہے جس سے بدنما حلیے کے ضرر کو دور کرنے کا مقصد حاصل ہو، کیونکہ ضرر دور کیا جاتا ہے، اور اگر وہ صبر کرے اور نہ کاٹے تو بہتر ہے۔"
