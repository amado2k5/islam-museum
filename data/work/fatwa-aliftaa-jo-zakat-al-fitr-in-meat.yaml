id: work/fatwa-aliftaa-jo-zakat-al-fitr-in-meat
class: work
kind: fatwa
label: { ar: "حكم إخراج زكاة الفطر لحمًا", en: "Paying zakat al-fitr in meat", ur: "صدقۂ فطر گوشت کی صورت میں ادا کرنا", es: "Pagar el zakat al-fitr con carne", fr: "Payer la zakat al-fitr en viande", tr: "Et için zekat al-Fitr ödenmesine ilişkin karar", id: "Putusan tentang pembayaran Zakat al-Fitr untuk daging" }
summary:
  ar: "سؤال عن إخراج زكاة الفطر من لحم البقر أو الدجاج، عرضت فيه دائرة الإفتاء العام الأردنية أقوال المذاهب ورأت أن الأولى عدم إخراجها لحمًا، مع صحتها ممن قلّد من أجاز ذلك. بيّنت الدائرة أن زكاة الفطر فُرضت طهرة للصائم وطعمة للمساكين، وأن الواجب فيها صاع من القمح أو الشعير أو التمر أو الزبيب أو الأرز أو نحوها مما يُعد قوتًا غالبًا، مستشهدة بأحاديث ابن عمر وأبي سعيد الخدري. ونقلت عن الشافعية أنها تُخرج من غالب قوت البلد، وأن اللحم لا يجزئ عندهم ولو كان قوت البلد لأنه لا يُقتات عادة، ومن لا قوت له مجزئ أخرج من قوت أقرب بلد. ونقلت عن الحنفية جواز إخراجها لحمًا لأنهم أجازوا القيمة تيسيرًا ومصلحة للفقير، بقيمة نصف صاع من الحنطة، أي 1625 غرامًا، وعن المالكية أنها تُخرج من تسعة أصناف فإن عُدمت جاز إخراجها من غالب القوت ولو لحمًا بما يعادل صاع القمح. وخلصت إلى أن الأولى عدم إخراجها لحمًا خروجًا من خلاف من منع، لكن من قلّد من أجاز ذلك صحت منه."
  en: "A question on paying zakat al-fitr in beef or chicken, in which Jordan's General Iftaa Department set out the schools' views and held that it is better not to pay it in meat, though it is valid from someone following a school that allows it. The Department explained that zakat al-fitr was made obligatory as a purification for the one who fasted and food for the poor, and that what is due is a sa' of wheat, barley, dates, raisins, rice or similar staple food, citing hadith reports from Ibn Umar and Abu Sa'id al-Khudri. It reported the Shafi'i view that it is paid from the land's staple food, and that meat does not count even if it is the local staple, since it is not normally a staple; those with no qualifying staple pay from that of the nearest place. It reported the Hanafi view that meat is allowed, since they allow paying the value for ease and the poor's benefit, to the value of half a sa' of wheat, that is 1,625 grams; and the Maliki view that it is paid from nine specified foods, and only if these are lacking from the prevailing food, even meat, equivalent to a sa' of wheat. It concluded that it is better not to pay it in meat, to avoid the disagreement of those who forbid it, but that it is valid from someone who follows a view allowing it."
  ur: "صدقۂ فطر گائے یا مرغی کے گوشت کی صورت میں ادا کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے مذاہب کے اقوال بیان کیے اور کہا کہ بہتر یہ ہے کہ گوشت میں ادا نہ کیا جائے، البتہ جو اسے جائز کہنے والے مذہب کی پیروی کرے اس کی ادائیگی درست ہے۔ ڈیپارٹمنٹ نے واضح کیا کہ صدقۂ فطر روزہ دار کی پاکیزگی اور مسکینوں کی خوراک کے لیے فرض ہوا، اور اس میں گندم، جو، کھجور، کشمش، چاول یا ایسی ہی غالب خوراک کا ایک صاع واجب ہے، اور ابن عمر اور ابو سعید الخدری کی روایات سے استدلال کیا۔ اس نے شافعیہ کا قول نقل کیا کہ یہ علاقے کی غالب خوراک سے ادا ہوتا ہے اور گوشت کافی نہیں چاہے وہ مقامی غذا ہو، کیونکہ وہ عام طور پر بنیادی خوراک نہیں؛ جن کے پاس کوئی معتبر خوراک نہ ہو وہ قریب ترین جگہ کی خوراک سے ادا کریں۔ اس نے حنفیہ کا قول نقل کیا کہ گوشت جائز ہے کیونکہ وہ آسانی اور فقیر کی مصلحت کے لیے قیمت دینے کو جائز سمجھتے ہیں، آدھے صاع گندم یعنی 1625 گرام کی قیمت کے برابر؛ اور مالکیہ کا قول کہ یہ نو مخصوص اجناس سے ادا ہوتا ہے، اور صرف ان کی عدم موجودگی میں غالب خوراک سے، چاہے گوشت ہو، گندم کے ایک صاع کے برابر۔ اس نے نتیجہ نکالا کہ منع کرنے والوں کے اختلاف سے بچنے کے لیے بہتر ہے کہ گوشت میں ادا نہ کیا جائے، لیکن جو اسے جائز کہنے والے قول کی پیروی کرے اس کی ادائیگی درست ہے۔"
  es: "Una pregunta sobre el pago del zakat al-fitr en carne de res o pollo, en la que el Departamento General de Iftaa de Jordania expuso las opiniones de las escuelas y sostuvo que es mejor no pagarlo en carne, aunque es válido para alguien que sigue una escuela que lo permite. El Departamento explicó que el zakat al-fitr se hizo obligatorio como purificación para el que ayunó y alimento para los pobres, y que lo que se debe es un sa' de trigo, cebada, dátiles, pasas, arroz o alimento básico similar, citando informes de hadices de Ibn Umar y Abu Sa'id al-Khudri. Informó la opinión shafi'í de que se paga con el alimento básico de la tierra, y que la carne no cuenta incluso si es el alimento básico local, ya que normalmente no es un alimento básico; aquellos no tienen un alimento básico calificado pagan con el del lugar más cercano. Informó la opinión hanafi de que la carne está permitida, ya que permiten pagar el valor para la facilidad y el beneficio de los pobres, hasta el valor de medio sa' de trigo, es decir 1,625 gramos; Según la opinión malikí, se paga con nueve alimentos específicos, y solo si estos faltan en la comida habitual, incluso carne, equivalente a un sa' de trigo. Se concluyó que es mejor no pagarlo con carne, para evitar la controversia de quienes lo prohíben, pero que es válido para quien sigue una opinión que lo permite."
  fr: "Une question relative au paiement de la zakat al-fitr en viande bovine ou en poulet a été soulevée par le Département général de la jurisprudence islamique (Iftaa) de Jordanie. Ce dernier a exposé les avis des différentes écoles de pensée et a statué qu'il est préférable de ne pas s'en acquitter en viande, bien que cela soit valable pour une personne suivant une école qui l'autorise. Le Département a expliqué que la zakat al-fitr a été instituée comme purification pour celui qui a jeûné et comme nourriture pour les pauvres. Il a précisé que le montant dû correspond à un sa' de blé, d'orge, de dattes, de raisins secs, de riz ou d'un aliment de base similaire, citant des hadiths rapportés par Ibn Umar et Abu Sa'id al-Khudri. Il a rapporté l'avis chaféite selon lequel la zakat al-fitr est payée à partir de l'aliment de base local, et que la viande n'est pas prise en compte, même s'il s'agit de l'aliment de base local, car elle ne constitue pas un aliment de base ordinaire; ceux qui ne possèdent pas d'aliment de base admissible paient à partir de celui du lieu le plus proche. Il a également rapporté l'avis hanafite, qui autorise le paiement de la viande, car il permet de verser, par souci de simplicité et pour le bien des pauvres, une valeur équivalente à un demi-sa' de blé, soit 1 625 grammes. L'avis malikite stipule que le paiement s'effectue avec neuf aliments spécifiques, et seulement si ceux-ci font défaut dans l'alimentation courante, même de la viande, à raison d'un sa' de blé. Il en conclut qu'il est préférable de ne pas payer en viande, afin d'éviter la controverse avec ceux qui l'interdisent, mais que ce paiement est valable pour celui qui suit un avis l'autorisant."
  tr: "Ürdün Genel Fetva Dairesi'nin düşünce mezheblerinin görüşlerini sunduğu ve et olarak verilmemesinin tercih edileceğine karar verdiği bir sığır veya tavuktan zekât al-fitr ödenmesiyle ilgili bir soru, ancak taklit edenlerin izin vermesi doğrudur. Daire, zekâtın oruç tutan kişi için zorunlu ve yoksullar için yiyecek olduğunu, zorunlu şartın ise buğday, arpa, hurma, kuru üzüm, pirinç veya bol besin olarak kabul edilen benzeri yiyeceklerden bir sa' vermek olduğunu açıkladı; İbn Ömer ve Ebu Said al-Hudri'nin hadislerine atıfta bulundu. Şafi'lerden, yerel yiyeceklerin çoğundan ödendiğini, yerel yiyecek olsa bile etin genellikle sürdürülebilir olmadığını, yeterli yiyecek olmayanlara ise en yakın kasabanın yiyeceklerinden verildiğini belirtti. Hanafiler, fakirlerin kolaylığı ve faydası amacıyla değerin yarım sa', yani 1625 gram olarak kabul edildiğiyle et üretiminin izin verildiği bildirilmiştir. Malikiler ayrıca dokuz farklı yiyecekten geldiğini, eğer öyle değilse, çoğu gıdadan, hatta etten buğday sa'sına eşdeğer olarak üretilmesinin izin verildiğini belirtirler. Yasaklayanların itirazı nedeniyle et olarak üretilmesinin tercih edileceği sonucuna varılmıştır; ancak izin vereni taklit eden kişi geçerlidir."
  id: "Pertanyaan tentang pembayaran Zakat al-Fitr dari daging sapi atau ayam, di mana Departemen Fatwa Umum Yordania menyampaikan pendapat dari aliran pemikiran dan menganggap lebih baik tidak memberikannya sebagai daging, meskipun benar bagi mereka yang menirunya untuk mengizinkannya. Departemen menjelaskan bahwa Zakat al-Fitr wajib bagi orang yang berpuasa dan makanan bagi orang miskin, dan bahwa persyaratan wajibnya adalah memberikan sa' gandum, jelai, kurma, kismis, beras, atau barang serupa yang dianggap melimpah, mengutip hadits dari Ibn Umar dan Abu Sa'id al-Khudri. Mereka mengutip Syafi'i bahwa itu dibayar dari mayoritas makanan lokal, dan daging tidak cukup bagi mereka meskipun itu makanan lokal karena biasanya tidak berkelanjutan, dan yang tidak memiliki cukup makanan diberikan dari makanan kota terdekat. Dilaporkan oleh Hanafi bahwa memproduksi daging diperbolehkan karena mereka mengizinkan nilai demi kenyamanan dan manfaat bagi orang miskin, sebesar setengah sa' gandum, yaitu 1625 gram. Keluarga Malik juga mengatakan bahwa daging berasal dari sembilan jenis makanan, dan jika tidak, diperbolehkan memproduksinya dari sebagian besar makanan, bahkan daging, yang setara dengan sa' gandum. Mereka menyimpulkan bahwa lebih baik tidak memproduksinya sebagai daging karena ketidaksepakatan dari mereka yang melarangnya, tetapi siapa pun yang meniru yang mengizinkannya adalah sah."
