id: work/fatwa-aliftaa-jo-zakat-al-fitr-in-meat
class: work
kind: fatwa
label: { ar: "حكم إخراج زكاة الفطر لحمًا", en: "Paying zakat al-fitr in meat", ur: "صدقۂ فطر گوشت کی صورت میں ادا کرنا" }
summary:
  ar: "سؤال عن إخراج زكاة الفطر من لحم البقر أو الدجاج، عرضت فيه دائرة الإفتاء العام الأردنية أقوال المذاهب ورأت أن الأولى عدم إخراجها لحمًا، مع صحتها ممن قلّد من أجاز ذلك. بيّنت الدائرة أن زكاة الفطر فُرضت طهرة للصائم وطعمة للمساكين، وأن الواجب فيها صاع من القمح أو الشعير أو التمر أو الزبيب أو الأرز أو نحوها مما يُعد قوتًا غالبًا، مستشهدة بأحاديث ابن عمر وأبي سعيد الخدري. ونقلت عن الشافعية أنها تُخرج من غالب قوت البلد، وأن اللحم لا يجزئ عندهم ولو كان قوت البلد لأنه لا يُقتات عادة، ومن لا قوت له مجزئ أخرج من قوت أقرب بلد. ونقلت عن الحنفية جواز إخراجها لحمًا لأنهم أجازوا القيمة تيسيرًا ومصلحة للفقير، بقيمة نصف صاع من الحنطة، أي 1625 غرامًا، وعن المالكية أنها تُخرج من تسعة أصناف فإن عُدمت جاز إخراجها من غالب القوت ولو لحمًا بما يعادل صاع القمح. وخلصت إلى أن الأولى عدم إخراجها لحمًا خروجًا من خلاف من منع، لكن من قلّد من أجاز ذلك صحت منه."
  en: "A question on paying zakat al-fitr in beef or chicken, in which Jordan's General Iftaa Department set out the schools' views and held that it is better not to pay it in meat, though it is valid from someone following a school that allows it. The Department explained that zakat al-fitr was made obligatory as a purification for the one who fasted and food for the poor, and that what is due is a sa' of wheat, barley, dates, raisins, rice or similar staple food, citing hadith reports from Ibn Umar and Abu Sa'id al-Khudri. It reported the Shafi'i view that it is paid from the land's staple food, and that meat does not count even if it is the local staple, since it is not normally a staple; those with no qualifying staple pay from that of the nearest place. It reported the Hanafi view that meat is allowed, since they allow paying the value for ease and the poor's benefit, to the value of half a sa' of wheat, that is 1,625 grams; and the Maliki view that it is paid from nine specified foods, and only if these are lacking from the prevailing food, even meat, equivalent to a sa' of wheat. It concluded that it is better not to pay it in meat, to avoid the disagreement of those who forbid it, but that it is valid from someone who follows a view allowing it."
  ur: "صدقۂ فطر گائے یا مرغی کے گوشت کی صورت میں ادا کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے مذاہب کے اقوال بیان کیے اور کہا کہ بہتر یہ ہے کہ گوشت میں ادا نہ کیا جائے، البتہ جو اسے جائز کہنے والے مذہب کی پیروی کرے اس کی ادائیگی درست ہے۔ ڈیپارٹمنٹ نے واضح کیا کہ صدقۂ فطر روزہ دار کی پاکیزگی اور مسکینوں کی خوراک کے لیے فرض ہوا، اور اس میں گندم، جو، کھجور، کشمش، چاول یا ایسی ہی غالب خوراک کا ایک صاع واجب ہے، اور ابن عمر اور ابو سعید الخدری کی روایات سے استدلال کیا۔ اس نے شافعیہ کا قول نقل کیا کہ یہ علاقے کی غالب خوراک سے ادا ہوتا ہے اور گوشت کافی نہیں چاہے وہ مقامی غذا ہو، کیونکہ وہ عام طور پر بنیادی خوراک نہیں؛ جن کے پاس کوئی معتبر خوراک نہ ہو وہ قریب ترین جگہ کی خوراک سے ادا کریں۔ اس نے حنفیہ کا قول نقل کیا کہ گوشت جائز ہے کیونکہ وہ آسانی اور فقیر کی مصلحت کے لیے قیمت دینے کو جائز سمجھتے ہیں، آدھے صاع گندم یعنی 1625 گرام کی قیمت کے برابر؛ اور مالکیہ کا قول کہ یہ نو مخصوص اجناس سے ادا ہوتا ہے، اور صرف ان کی عدم موجودگی میں غالب خوراک سے، چاہے گوشت ہو، گندم کے ایک صاع کے برابر۔ اس نے نتیجہ نکالا کہ منع کرنے والوں کے اختلاف سے بچنے کے لیے بہتر ہے کہ گوشت میں ادا نہ کیا جائے، لیکن جو اسے جائز کہنے والے قول کی پیروی کرے اس کی ادائیگی درست ہے۔"
