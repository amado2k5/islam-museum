id: work/fatwa-dar-alifta-eg-umrah-when-menses-begin
class: work
kind: fatwa
label: { ar: "حكم العمرة للمرأة إذا فاجأها دم الحيض", en: "A woman's umrah when her menses begin", ur: "حیض شروع ہونے پر عورت کی عمرہ", es: "La Umrah de una mujer cuando comienza su menstruación.", fr: "La umra d'une femme commence au début de ses menstruations.", tr: "Bir kadının adet kanıyla şaşırması halinde Umre hakkındaki karar", id: "Keputusan tentang Umrah bagi wanita jika dia terkejut dengan darah menstruasi" }
summary:
  ar: "سائل سأل عن المرأة التي فاجأها دم الحيض وهي مريدة للعمرة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20753)⁩ أنه يجوز لها الإحرام للعمرة حال حيضها مع استحباب اغتسالها قبله ثم تنتظر حتى تطهر فتغتسل وتؤدي عمرتها على ما فصّل الجواب."
  en: "A questioner asked about a woman whose menses began while she intended umrah. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20753) answered that she may enter ihram during her menses — washing first is recommended — then wait until she is pure, wash and perform her umrah, as the answer details."
  ur: "ایک سائل نے اس عورت کا حکم پوچھا جسے عمرہ کی نیت پر حیض شروع ہو گیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20753)⁩ نے جواب دیا کہ وہ حیض میں احرام باندھ سکتی ہے — پہلے غسل مستحب ہے — پھر طہارت تک رک کر غسل کر کے عمرہ کرے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre una mujer a la que le llegó la menstruación mientras tenía previsto realizar la umrah. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20753) respondió que puede entrar en estado de ihram durante su menstruación —se recomienda lavarse primero—, luego esperar hasta estar pura, lavarse y realizar la umrah, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant une femme dont les menstruations ont commencé alors qu'elle souhaitait accomplir la 'umra. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20753) a répondu qu'elle pouvait entrer en état d'ihram pendant ses menstruations – il est recommandé de se laver au préalable – puis attendre d'être purifiée, se laver et accomplir sa 'umra, comme le précise la réponse."
  tr: "Bir soru soran kişi, Umre ayini yapmak üzereyken adet kanıyla şaşıran bir kadın hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 20753), adet döneminde ihram etmesinin uygun olduğunu, ardından regl öncesinde hüsl yapması, sonra saf olana kadar beklemesini, ardından cevabında açıklandığı gibi hüsl ve umre yapmasını tavsiye ettiğini söyledi."
  id: "Seorang penanya menanyakan tentang seorang wanita yang terkejut dengan darah menstruasi saat ia hendak melakukan Umrah. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20753) menjawab bahwa diperbolehkan baginya untuk memasuki Ihram untuk Umrah selama menstruasi, dengan rekomendasi untuk melakukan ghusl sebelum menstruasi, lalu menunggu hingga ia menjadi murni, kemudian melakukan ghusl dan melakukan Umrah seperti yang dijelaskan dalam jawaban."
