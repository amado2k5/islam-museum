label: { ar: "قصيدة المتنبي «وا حرّ قلباه ممن قلبه شبم»", en: "Al-Mutanabbi's ode 'Alas for a heart burning for one whose heart is cold'", es: "La oda de Al-Mutanabbi: \"¡Ay de aquel cuyo corazón arde por aquel cuyo corazón está frío!\"", fr: "L'ode d'Al-Mutanabbi « Hélas pour un cœur qui brûle pour celui dont le cœur est froid »", ur: "المتنبی کا کلام 'افسوس اس دل کے لیے جس کا دل ٹھنڈا ہے'", tr: "Al-Mutanabbi'nin şiiri: \"Ah, kalbi sıcak olan, kalbi hafif olanıdır\"", id: "Puisi Al-Mutanabbi: \"Oh, orang yang hatinya panas adalah yang hatinya angin sepoi-sepoi\"" }
summary:
  ar: "قصيدة من بحر البسيط على روي الميم قالها المتنبي في مدح سيف الدولة، وتتضمن أبيات الفخر المشهورة «الخيل والليل والبيداء تعرفني»؛ يقدّم لها الديوان بقوله إنها قيلت وقد جرى له خطاب مع قوم متشاعرين وظن الحيف عليه والتحامل {{cite:diwan-mutanabbi-dar-beirut-1983 p.331}}."
  en: "An ode in the basit metre on the rhyme mim, addressed to Sayf al-Dawla, containing the famous boast \"The horses, the night and the desert know me\". The edition introduces it as spoken after an exchange with pretender-poets, when the poet felt wronged {{cite:diwan-mutanabbi-dar-beirut-1983 p.331}}."
  es: "Una oda en metro basit sobre la rima mim, dirigida a Sayf al-Dawla, que contiene la famosa jactancia \"Los caballos, la noche y el desierto me conocen\". La edición la presenta como pronunciada después de un intercambio con poetas impostores, cuando el poeta se sintió agraviado {{cite:diwan-mutanabbi-dar-beirut-1983 p.331}}."
  fr: "Une ode en mètre basit sur la rime mim, adressée à Sayf al-Dawla, contenant la célèbre vantardise « Les chevaux, la nuit et le désert me connaissent ». L'édition la présente comme prononcée après un échange avec des poètes imposteurs, lorsque le poète s'est senti lésé {{cite:diwan-mutanabbi-dar-beirut-1983 p.331}}."
  ur: "شاعری میم پر باسط میٹر میں ایک اوڈ، سیف الدولہ کو مخاطب کیا گیا، جس میں مشہور فخر \"گھوڑے، رات اور صحرا مجھے جانتے ہیں\" پر مشتمل ہے۔ ایڈیشن میں اس کا تعارف پیش کیا گیا ہے جیسا کہ دکھاوے کے شاعروں کے ساتھ تبادلہ خیال کے بعد بولا گیا تھا، جب شاعر نے غلط محسوس کیا تھا {{حوالہ:دیوان-متنبی-در-بیروت-1983 p.331}}۔"
  tr: "Basit ölçüsünden bir şiir, Al-Mutanabbi tarafından Sayf al-Dawla'yı övmek için okunan meme deseni üzerine ünlü gurur dizeleri içerir: \"Atlar, geceler ve çöl beni tanır\"; divan bunu söylendiğini söyleyerek başlatır ve bir grup şairle yaptığı konuşmayı yanlış ve taraflı bulur {{cite:diwan-mutanabbi-dar-beirut-1983 s.331}}."
  id: "Sebuah puisi dari meter Basit tentang pola meme yang dibacakan oleh Al-Mutanabbi sebagai pujian kepada Sayf al-Dawla, berisi baris-baris kebanggaan terkenal: \"Kuda, malam, dan padang belantara mengenali aku\"; sang diwan memperkenalkannya dengan mengatakan bahwa itu telah diucapkan, dan ia berpidato dengan sekelompok penyair, dan ia menganggapnya salah dan bias {{cite:diwan-mutanabbi-dar-beirut-1983 hlm.331}}."
