label: { ar: "قصيدة المتنبي «وا حرّ قلباه ممن قلبه شبم»", en: "Al-Mutanabbi's ode 'Alas for a heart burning for one whose heart is cold'" }
summary:
  ar: "قصيدة من بحر البسيط على روي الميم قالها المتنبي في مدح سيف الدولة، وتتضمن أبيات الفخر المشهورة «الخيل والليل والبيداء تعرفني»؛ يقدّم لها الديوان بقوله إنها قيلت وقد جرى له خطاب مع قوم متشاعرين وظن الحيف عليه والتحامل {{cite:diwan-mutanabbi-dar-beirut-1983 p.331}}."
  en: "An ode in the basit metre on the rhyme mim, addressed to Sayf al-Dawla, containing the famous boast \"The horses, the night and the desert know me\". The edition introduces it as spoken after an exchange with pretender-poets, when the poet felt wronged {{cite:diwan-mutanabbi-dar-beirut-1983 p.331}}."
