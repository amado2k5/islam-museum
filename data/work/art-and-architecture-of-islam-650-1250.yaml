summary:
  ar: "كتاب بالإنجليزية لريتشارد إتينغهاوزن وأوليغ غرابار عن فن الإسلام وعمارته بين سنتي 650 و1250 ضمن سلسلة «بيليكان لتاريخ الفن»، صدر عن دار بنغوين، ثم مطبعة جامعة ييل سنة 1994، وأكمله بلير وبلوم بمجلد 1250–1800، سنة 1987."
  en: "An English book by Richard Ettinghausen and Oleg Grabar on Islamic art and architecture from 650 to 1250, in The Pelican History of Art, published by Penguin Books (Yale University Press edition 1994; continued by Blair and Bloom's 1250–1800 volume) in 1987."
  ur: "رچرڈ ایٹنگ ہاؤزن اور اولیگ گرابار کی انگریزی کتاب جو 650 سے 1250ء تک اسلامی فن اور فنِ تعمیر پر «پیلیکن ہسٹری آف آرٹ» سلسلے میں ہے؛ پینگوئن بکس ⁦(ییل یونیورسٹی پریس ایڈیشن 1994ء)⁩ سے 1987ء میں شائع ہوئی۔"
  fr: "The Art and Architecture of Islam, 650–1250 est un livre de Richard Ettinghausen et Oleg Grabar paru dans la collection The Pelican History of Art, publié par Penguin Books en 1987. Le livre comprend trois parties : le califat, l'éclatement du califat, puis les XIe–XIIIe siècles."
  es: "The Art and Architecture of Islam, 650–1250 es un libro de Richard Ettinghausen y Oleg Grabar en la colección The Pelican History of Art, publicado por Penguin Books en 1987. El libro tiene tres partes: el califato, la fragmentación del califato y los siglos XI a XIII."
  tr: "The Art and Architecture of Islam, 650–1250, Richard Ettinghausen ile Oleg Grabar'ın The Pelican History of Art dizisinde yer alan, 1987'de Penguin Books tarafından yayımlanan kitabıdır. Kitap üç bölümden oluşur: hilafet, hilafetin dağılması ve on birinci ile on üçüncü yüzyıllar."
  id: "The Art and Architecture of Islam, 650–1250 adalah buku karya Richard Ettinghausen dan Oleg Grabar dalam seri The Pelican History of Art, terbitan Penguin Books tahun 1987. Buku ini terdiri atas tiga bagian: kekhalifahan, runtuhnya kekhalifahan, dan abad kesebelas hingga ketiga belas."
