summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته العاشرة ⁦(يوليو 1997م)⁩: تكليف لجنة تشكلها الأمانة العامة للنظر في التوصيات المعدة بشأن دور المرأة المسلمة في التنمية وتعرض نتائج أعمالها في دورة لاحقة."
  en: "IIFA's tenth-session resolution (July 1997) on the Muslim woman's role in development: a committee formed by the secretariat was tasked with reviewing the prepared recommendations on the subject and presenting its findings at a later session."
  ur: "اکیڈمی کی دسویں مجلس کی قرارداد ⁦(جولائی 1997ء)⁩: مسلم خاتون کے ترقیاتی کردار کی سفارشات کا جائزہ ایک کمیٹی کو دیا گیا۔"
  es: "Resolución de la décima sesión de la IIFA (julio de 1997) sobre el papel de la mujer musulmana en el desarrollo: un comité formado por la secretaría recibió el encargo de revisar las recomendaciones preparadas sobre el tema y presentar sus conclusiones en una sesión posterior."
  fr: "Résolution de la dixième session de l'IIFA (juillet 1997) sur le rôle de la femme musulmane dans le développement: un comité formé par le secrétariat a été chargé d'examiner les recommandations préparées sur le sujet et de présenter ses conclusions lors d'une session ultérieure."
  tr: "Uluslararası İslami Fiqh Akademisi'nin onuncu oturumunda (Temmuz 1997) kararı: Genel Sekreterlik tarafından oluşturulan, Müslüman kadınların kalkınmadaki rolüne ilişkin hazırlanan önerileri değerlendirmek ve çalışmalarının sonuçlarını bir sonraki oturumda sunmak üzere görevlendirilmesi."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi kesepuluhnya (Juli 1997): Menugaskan sebuah komite yang dibentuk oleh Sekretariat Jenderal untuk mempertimbangkan rekomendasi yang disiapkan mengenai peran perempuan Muslim dalam pembangunan dan mempresentasikan hasil pekerjaannya pada sesi berikutnya."
