id: work/fatwa-aliftaa-jo-undercutting-competitors
class: work
kind: fatwa
label: { ar: "حكم خفض الأسعار لإخراج المنافسين من السوق", en: "Cutting prices to drive competitors out of the market", ur: "حریفوں کو بازار سے نکالنے کے لیے قیمتیں گرانا", es: "Reducir los precios para expulsar a los competidores del mercado.", fr: "Baisser les prix pour éliminer les concurrents du marché", tr: "Rakipleri piyasadan çıkarmak için fiyatların düşürülmesine ilişkin karar", id: "Putusan tentang penurunan harga untuk mengusir pesaing dari pasar" }
summary:
  ar: "سؤال من شركة مبيعات عن خفض أسعارها شهرين لإخراج منافسيها من السوق، أجابت فيه دائرة الإفتاء العام الأردنية بأن الحكم يختلف باختلاف القصد. أجابت الدائرة بأن البيع بأقل من سعر السوق بقصد الإضرار بالتجار الآخرين، كإلحاق الخسارة بهم أو إخراجهم من السوق للانفراد به، محرم، استنادًا إلى حديث نفي الضرر والضرار. وقالت إن التخفيض بلا قصد إضرار إذا ترتب عليه ضرر يسير يُغتفر تحقيقًا لمصلحة عامة هي التيسير على الناس، كتصفية سلع قارب موسمها أو صلاحيتها على الانتهاء لظرف طارئ ولمدة محدودة. وأما إذا ترتب عليه ضرر فاحش بعموم أهل السوق فذكرت قولين: قول الجمهور بأن للتاجر أن يبيع بما شاء ولا يُلزم بسعر، مستشهدين بخبر عمر مع حاطب بن أبي بلتعة، وقول المالكية بأنه يُلزم بسعر أهل السوق أو يخرج منه، ونقلت فيه عن ابن رشد في البيان والتحصيل، ودعت التجار إلى مراعاة ذلك."
  en: "A question from a sales company about cutting its prices for two months to push its competitors out of the market, in which Jordan's General Iftaa Department answered that the ruling depends on the intention. The Department answered that selling below the market price with the aim of harming other traders, such as inflicting losses on them or driving them out to monopolise the market, is forbidden, citing the hadith that there is to be no harm and no reciprocal harm. It said that a price cut made without intent to harm, which causes only slight harm, is tolerated for the public benefit of easing costs for people, such as clearing goods near the end of their season or shelf life, as a temporary measure for a limited time. Where it causes gross harm to the market as a whole, it set out two views: the majority hold that a trader may sell at any price and is not bound to a fixed one, citing the report of Umar and Hatib ibn Abi Balta'a; the Malikis hold that he must match the market price or leave the market, quoting Ibn Rushd's al-Bayan wa-l-Tahsil. It urged traders to take this into account."
  ur: "ایک سیلز کمپنی کا سوال کہ کیا وہ دو مہینے قیمتیں کم کر کے حریفوں کو بازار سے نکال سکتی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ حکم نیت کے لحاظ سے بدلتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ دوسرے تاجروں کو نقصان پہنچانے کی نیت سے، جیسے انہیں خسارے میں ڈالنا یا بازار پر اجارہ داری کے لیے انہیں نکالنا، بازار کی قیمت سے کم بیچنا حرام ہے، اور اس پر نقصان نہ دینے اور نقصان کا بدلہ نقصان سے نہ دینے والی حدیث سے استدلال کیا۔ اس نے کہا کہ نقصان کی نیت کے بغیر قیمت کم کرنے سے معمولی نقصان ہو تو لوگوں کی سہولت کی عام مصلحت کے لیے اسے برداشت کیا جاتا ہے، جیسے موسم یا میعاد ختم ہونے کے قریب سامان کی عارضی اور محدود مدت کی کلیئرنس۔ اور اگر اس سے پورے بازار کو شدید نقصان ہو تو اس نے دو آرا ذکر کیں: جمہور کے نزدیک تاجر جس قیمت پر چاہے بیچ سکتا ہے اور اسے کسی قیمت کا پابند نہیں کیا جاتا، اس پر عمر اور حاطب بن ابی بلتعہ کے واقعے سے استدلال ہے؛ اور مالکیہ کے نزدیک اسے بازار کی قیمت اختیار کرنی ہوگی یا بازار سے نکلنا ہوگا، جس میں ابن رشد کی البیان والتحصیل سے نقل کیا۔ اس نے تاجروں کو اس کا لحاظ رکھنے کی تلقین کی۔"
  es: "Una pregunta de una empresa de ventas sobre la reducción de sus precios durante dos meses para expulsar a sus competidores del mercado, a la que el Departamento General de Iftaa de Jordania respondió que la decisión depende de la intención. El Departamento respondió que vender por debajo del precio de mercado con el objetivo de perjudicar a otros comerciantes, como infligirles pérdidas o expulsarlos para monopolizar el mercado, está prohibido, citando el hadiz que dice que no debe haber daño ni daño recíproco. Dijo que una reducción de precios hecha sin intención de perjudicar, que causa solo un daño leve, se tolera para el beneficio público de aliviar los costos para las personas, como liquidar productos cerca del final de su temporada o vida útil, como una medida temporal por un tiempo limitado. Cuando causa un daño grave al mercado en su conjunto, estableció dos puntos de vista: la mayoría sostiene que un comerciante puede vender a cualquier precio y no está obligado a uno fijo, citando el informe de Umar y Hatib ibn Abi Balta'a; Los malikíes sostienen que debe igualar el precio del mercado o abandonarlo, citando la obra de Ibn Rushd, al-Bayan wa-l-Tahsil. Esta obra insta a los comerciantes a tener esto en cuenta."
  fr: "Une entreprise commerciale a été interrogée sur sa décision de baisser ses prix pendant deux mois afin d'éliminer ses concurrents du marché. Le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que la décision dépend de l'intention. Le Département a statué que vendre en dessous du prix du marché dans le but de nuire aux autres commerçants, par exemple en leur causant des pertes ou en les forçant à quitter le marché pour le monopoliser, est interdit, citant le hadith selon lequel il ne doit y avoir ni préjudice ni représailles. Il a précisé qu'une baisse de prix effectuée sans intention de nuire, et n'entraînant qu'un préjudice mineur, est tolérée dans l'intérêt général, afin d'alléger les coûts pour les consommateurs, par exemple pour écouler des marchandises en fin de saison ou en fin de durée de conservation, à titre temporaire. Lorsque la baisse de prix cause un préjudice grave au marché dans son ensemble, deux avis sont présentés: la majorité considère qu'un commerçant peut vendre à n'importe quel prix et n'est pas tenu de respecter un prix fixe, citant le hadith d'Umar et de Hatib ibn Abi Balta'a; Les malikites estiment qu'il doit s'aligner sur le prix du marché ou se retirer du marché, citant l'ouvrage d'Ibn Rushd, al-Bayan wa-l-Tahsil. Ce dernier exhortait les commerçants à en tenir compte."
  tr: "Bir satış şirketinin, rakiplerini piyasadan çıkarmak için fiyatlarını iki ay düşürme hakkındaki sorusuna Ürdün Genel Fetva Dairesi, kararın niyete göre değiştiğini yanıtladı. Bakanlık, diğer tüccarlara zarar vermek veya piyasadan çıkarmak gibi zararlar vermek veya piyasadan çıkarmak gibi amaçlarla piyasa fiyatının altında satışların, hadislerin zarar ve zararı reddetmesi nedeniyle yasak olduğunu belirtti. İstemeden yapılan indirimin, kamu yararını sağlamak için mazeret gösterilen küçük zararlara yol açması durumunda zararlı olduğunu, örneğin acil ve sınırlı bir süre nedeniyle sezonu veya raf ömrü sona ermek üzere olan malların takaslanması gibi kamu yararını sağlamak amacıyla zararlı olduğunu belirtti. Genel pazar insanlarına ciddi zarar verip vermediği konusunda ise iki görüşten bahsediyorum: çoğunluk, bir tüccarın istediğini satabileceğini ama fiyata bağlı olmadığını söylüyor, Ömer'in Hatib ibn Abi Balta'ah ile ilgili raporunu aktarıyor ve Maliki görüşü, pazar insanlarının fiyatına bağlı olduğu ya da ondan saptığı yönünde. El-Bayan wa Al-Tahsil'de İbn Rüşd'den alıntı yaptım ve tüccarları buna uymaya çağırdılar."
  id: "Sebuah pertanyaan dari perusahaan penjualan tentang penurunan harga selama dua bulan untuk mengeluarkan pesaingnya dari pasar, Departemen Fatwa Umum Yordania menjawab bahwa putusan tersebut bervariasi tergantung pada niatnya. Departemen tersebut menjawab bahwa menjual di bawah harga pasar dengan maksud merugikan pedagang lain, seperti menyebabkan kerugian atau mengusir mereka dari pasar untuk memonopoli, dilarang, berdasarkan hadits yang menyangkal kerugian dan kerugian. Departemen tersebut menyatakan bahwa pengurangan yang tidak disengaja merugikan jika mengakibatkan kerugian kecil yang dimaafkan demi kepentingan publik, yaitu untuk memudahkan manfaat masyarakat, seperti membersihkan barang yang masa musimnya hampir habis karena keadaan darurat dan periode terbatas. Adapun apakah hal itu menyebabkan kerugian serius bagi masyarakat pasar umum, saya menyebutkan dua pendapat: mayoritas mengatakan bahwa seorang pedagang boleh menjual apa pun yang diinginkannya tetapi tidak terikat oleh harga, mengutip laporan Umar dengan Hatib ibn Abi Balta'ah, dan pandangan Maliki bahwa ia terikat oleh harga orang pasar atau menyimpang darinya. Saya mengutip Ibn Rushd dalam Al-Bayan wa Al-Tahsil, dan mereka menyerukan kepada para pedagang untuk mematuhi hal ini."
