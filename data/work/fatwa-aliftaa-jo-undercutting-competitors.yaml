id: work/fatwa-aliftaa-jo-undercutting-competitors
class: work
kind: fatwa
label: { ar: "حكم خفض الأسعار لإخراج المنافسين من السوق", en: "Cutting prices to drive competitors out of the market", ur: "حریفوں کو بازار سے نکالنے کے لیے قیمتیں گرانا" }
summary:
  ar: "سؤال من شركة مبيعات عن خفض أسعارها شهرين لإخراج منافسيها من السوق، أجابت فيه دائرة الإفتاء العام الأردنية بأن الحكم يختلف باختلاف القصد. أجابت الدائرة بأن البيع بأقل من سعر السوق بقصد الإضرار بالتجار الآخرين، كإلحاق الخسارة بهم أو إخراجهم من السوق للانفراد به، محرم، استنادًا إلى حديث نفي الضرر والضرار. وقالت إن التخفيض بلا قصد إضرار إذا ترتب عليه ضرر يسير يُغتفر تحقيقًا لمصلحة عامة هي التيسير على الناس، كتصفية سلع قارب موسمها أو صلاحيتها على الانتهاء لظرف طارئ ولمدة محدودة. وأما إذا ترتب عليه ضرر فاحش بعموم أهل السوق فذكرت قولين: قول الجمهور بأن للتاجر أن يبيع بما شاء ولا يُلزم بسعر، مستشهدين بخبر عمر مع حاطب بن أبي بلتعة، وقول المالكية بأنه يُلزم بسعر أهل السوق أو يخرج منه، ونقلت فيه عن ابن رشد في البيان والتحصيل، ودعت التجار إلى مراعاة ذلك."
  en: "A question from a sales company about cutting its prices for two months to push its competitors out of the market, in which Jordan's General Iftaa Department answered that the ruling depends on the intention. The Department answered that selling below the market price with the aim of harming other traders, such as inflicting losses on them or driving them out to monopolise the market, is forbidden, citing the hadith that there is to be no harm and no reciprocal harm. It said that a price cut made without intent to harm, which causes only slight harm, is tolerated for the public benefit of easing costs for people, such as clearing goods near the end of their season or shelf life, as a temporary measure for a limited time. Where it causes gross harm to the market as a whole, it set out two views: the majority hold that a trader may sell at any price and is not bound to a fixed one, citing the report of Umar and Hatib ibn Abi Balta'a; the Malikis hold that he must match the market price or leave the market, quoting Ibn Rushd's al-Bayan wa-l-Tahsil. It urged traders to take this into account."
  ur: "ایک سیلز کمپنی کا سوال کہ کیا وہ دو مہینے قیمتیں کم کر کے حریفوں کو بازار سے نکال سکتی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ حکم نیت کے لحاظ سے بدلتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ دوسرے تاجروں کو نقصان پہنچانے کی نیت سے، جیسے انہیں خسارے میں ڈالنا یا بازار پر اجارہ داری کے لیے انہیں نکالنا، بازار کی قیمت سے کم بیچنا حرام ہے، اور اس پر نقصان نہ دینے اور نقصان کا بدلہ نقصان سے نہ دینے والی حدیث سے استدلال کیا۔ اس نے کہا کہ نقصان کی نیت کے بغیر قیمت کم کرنے سے معمولی نقصان ہو تو لوگوں کی سہولت کی عام مصلحت کے لیے اسے برداشت کیا جاتا ہے، جیسے موسم یا میعاد ختم ہونے کے قریب سامان کی عارضی اور محدود مدت کی کلیئرنس۔ اور اگر اس سے پورے بازار کو شدید نقصان ہو تو اس نے دو آرا ذکر کیں: جمہور کے نزدیک تاجر جس قیمت پر چاہے بیچ سکتا ہے اور اسے کسی قیمت کا پابند نہیں کیا جاتا، اس پر عمر اور حاطب بن ابی بلتعہ کے واقعے سے استدلال ہے؛ اور مالکیہ کے نزدیک اسے بازار کی قیمت اختیار کرنی ہوگی یا بازار سے نکلنا ہوگا، جس میں ابن رشد کی البیان والتحصیل سے نقل کیا۔ اس نے تاجروں کو اس کا لحاظ رکھنے کی تلقین کی۔"
