id: work/fatwa-amja-descent-of-isa
class: work
kind: fatwa
label: { ar: "نزول عيسى آخر الزمان", en: "The descent of Isa at the end of time", ur: "آخر زمان میں عیسیٰ کا نزول", es: "El descenso de Isa al final de los tiempos", fr: "La descente d'Isa à la fin des temps", tr: "İsa'nın Kıyametin İnişi", id: "Turunnya Yesus di akhir zaman" }
summary:
  ar: "سأل سائل عن عودة عيسى بن مريم آخر الزمان. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77611 بتاريخ 28 يناير 2009)⁩ أن نزول المسيح عيسى بن مريم في آخر الزمان أحد أشراط الساعة الكبار كما قال تعالى وإنه لعلم للساعة أي نزول عيسى، وجاءت أحاديث كثيرة في نزوله بلغت حد التواتر منها ما في الصحيحين عن أبي هريرة أن رسول الله قال والذي نفسي بيده ليوشكن أن ينزل فيكم ابن مريم حكمًا مقسطًا فيكسر الصليب ويقتل الخنزير ويضع الجزية، فهو من عقائد أهل السنة الثابتة بأدلة قطعية."
  en: "A questioner asked about the return of Isa son of Maryam at the end of time. Dr. Salah al-Sawi (fatwa no. 77611, 28 January 2009) answered that the Messiah's descent is among the major signs of the Hour — 'he is knowledge for the Hour' meaning Isa's descent — and many hadiths reaching mutawatir record it, among them the two-Sahihs report of Abu Hurayra: 'by Him in whose hand is my soul, the son of Maryam will soon descend among you as a just ruler; he will break the cross, kill the swine and lift the jizya'; it is among the established tenets of Sunni creed, proven by decisive texts."
  ur: "ایک سائل نے عیسیٰ کے نزول کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77611، 28 جنوری 2009)⁩ کے مطابق نزول عیسیٰ قیامت کی بڑی نشانیوں میں ہے جس کی احادیث متواتر ہیں — صحیحین کی روایت «ابن مریم عادل حاکم بن کر اترے گا» اس پر ہے۔"
  es: "Un consultante preguntó acerca del regreso de Isa, hijo de Maryam, al final de los tiempos. El Dr. Salah al-Sawi (fatwa n.° 77611, 28 de enero de 2009) respondió que el descenso del Mesías es uno de los principales signos de la Hora —«él es conocimiento para la Hora», refiriéndose al descenso de Isa— y muchos hadices que llegan a mutawatir lo registran, entre ellos el relato de Abu Hurayra, que figura en los dos Sahihs: «Por Aquel en cuya mano está mi alma, el hijo de Maryam pronto descenderá entre vosotros como un gobernante justo; romperá la cruz, matará a los cerdos y levantará la jizya»; es uno de los principios establecidos del credo sunita, probado por textos decisivos."
  fr: "Un internaute a interrogé Salah al-Sawi (fatwa n° 77611, 28 janvier 2009) sur le retour de Jésus, fils de Marie, à la fin des temps. Il a répondu que la venue du Messie compte parmi les signes majeurs de l'Heure – « il est la science de l'Heure », désignant ainsi la venue de Jésus – et que de nombreux hadiths transmis de génération en génération le rapportent, notamment le hadith authentique d'Abou Hourayra: « Par Celui qui tient mon âme entre Ses mains, le fils de Marie descendra bientôt parmi vous en souverain juste; il brisera la croix, abattra le porc et lèvera la jizya. » Ce hadith fait partie des dogmes sunnites établis, attestés par des textes décisifs."
  tr: "Bir soruya Meryem'in oğlu İsa'nın zamanın kıyameti dönüşü hakkında soru soruldu. Dr. Salah Al-Sawy (28 Ocak 2009 tarihli 77611 No. fetva) Mesih Meryem'in oğlunun zamanın kıyameti İnişinin Allah'ın dediği gibi Saatin büyük işaretlerinden biri olduğunu ve Saatin İsa'nın inişi anlamına geldiği bilindiğini yanıtladı. Onun inişiyle ilgili birçok hadis mutawatur seviyesine ulaşmıştır; bunlardan bazıları Ebu Hureyre'nin iki sahihinde yer alır; Allah'ın Resulü'nün şöyle dediği gibi: Ruhumun elinde olan Allah'ın oğlu adil bir yargıç olarak aranızdan inecek, hamı, domuzu öldürecek ve cizye dayatacaktır. Bu, Ehl-sünnet'in kesin kanıtlarla kanıtlanmış inançlarından biridir."
  id: "Seorang penanya ditanya tentang kembalinya Yesus putra Maria pada akhir zaman. Dr. Salah Al-Sawy menjawab (Fatwa No. 77611 tanggal 28 Januari 2009) bahwa turunnya Mesias, Yesus, putra Maria, pada akhir zaman adalah salah satu tanda besar Jam itu, seperti yang dikatakan Allah Yang Maha Kuasa, dan bahwa Jam tersebut diketahui berarti turunnya Yesus. Banyak hadits tentang keturunannya mencapai tingkat mutawatur, beberapa di antaranya ada dalam dua Sahih dari Abu Huraira, yang dikatakan Rasulullah berkata: Melalui Dia yang di tangannya jiwa-Ku, putra Maria akan turun di antara kalian sebagai hakim yang adil, mematahkan salib, membunuh babi, dan memaksakan jizya. Ini adalah salah satu kepercayaan Ahl al-Sunnah yang dibuktikan dengan bukti yang meyakinkan."
