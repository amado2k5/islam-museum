label: { ar: "طبقات الشافعية الكبرى", en: "Tabaqat al-Shafi'iyya al-Kubra", ur: "طبقات الشافعیہ الکبریٰ" }
summary:
  ar: "معجم تاج الدين السبكي الأكبر في تراجم علماء الشافعية، وهو أكبر ثلاث نسخ من «الطبقات» — الكبرى والوسطى والصغرى — جمع فيه التاريخ والأدب والفقه والحديث على غرار «تبيين كذب المفتري» لابن عساكر مع أُسس أوسع {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  en: "Taj al-Din al-Subki's great biographical dictionary of Shafi'i scholars, the largest of his three Tabaqat versions (kubra, wusta, sughra), combining history, adab, law and tradition on the model of Ibn 'Asakir's Tabyin kadhib al-muftari but on broader foundations {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  ur: "تاج الدین سبکی کا شافعی علماء کا بڑا معجم تراجم، جو ان کی تین «طبقات» اصناف (کبریٰ، وسطیٰ، صغریٰ) میں سب سے بڑی ہے؛ اس میں ابن عساکر کے «تبیین کذب المفتری» کے نمونے پر مگر وسیع تر بنیادوں پر تاریخ، ادب، فقہ اور حدیث جمع ہیں {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}۔"
