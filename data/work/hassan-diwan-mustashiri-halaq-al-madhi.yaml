label: { ar: "قصيدة حسان في يوم بدر «مستشعري حلق الماذي يقدمهم»", en: "Hassan's poem on the day of Badr, 'Wearing mail rings of the Madhi'", es: "El poema de Hassan en el día de Badr, 'Llevando anillos de malla del Madhi'", fr: "Le poème d'Hassan le jour de Badr, « Portant des anneaux de cotte de mailles du Madhi »", ur: "بدر کے دن حسن کی نظم 'مدھی کے میل کی انگوٹھیاں پہنے'", tr: "Hassan'ın Bedr günü şiiri: 'Acının boğazının sensörleri onları sunar'", id: "Puisi Hassan pada hari Badr: 'Sensor Tenggorokan Rasa Sakit Menyajikannya'" }
summary:
  ar: "قصيدة لحسان بن ثابت يذكر فيها رسول الله وأصحابه يوم بدر، من البسيط على روي الدال كما في رأسها في شرح البرقوقي {{cite:sharh-diwan-hassan-barquqi-1929 p.80}}."
  en: "A poem by Hassan ibn Thabit recalling the Messenger of God and his companions on the day of Badr, in the basit metre on the rhyme dal, as stated in its heading in al-Barquqi's commentary {{cite:sharh-diwan-hassan-barquqi-1929 p.80}}."
  es: "Un poema de Hassan ibn Thabit que recuerda al Mensajero de Dios y a sus compañeros en el día de Badr, en metro basit sobre la rima dal, como se indica en su encabezado en el comentario de al-Barquqi {{cite:sharh-diwan-hassan-barquqi-1929 p.80}}."
  fr: "Un poème de Hassan ibn Thabit rappelant le Messager de Dieu et ses compagnons le jour de Badr, en mètre basit sur la rime dal, comme indiqué dans son titre dans le commentaire d'al-Barquqi {{cite:sharh-diwan-hassan-barquqi-1929 p.80}}."
  ur: "حسان بن ثابت کی ایک نظم جس میں بدر کے دن رسول اللہ اور آپ کے اصحاب کو یاد کرتے ہوئے، شاعری کی دال پر باسط میٹر میں، جیسا کہ البرقی کی تفسیر میں اس کے عنوان میں بیان کیا گیا ہے {{حوالہ: شرح دیوان-حسن برقوی-1929 صفحہ 80}}۔"
  tr: "Hasan ibn Tabit'in Badr Günü'nde Allah'ın Elçisi ve sahabelerinden bahseden bir şiir, 'dal' rivayetine göre Sharh al-Barquqi'nin başındaki gibi basit bir şekilde {{cite:sharh-diwan-hassan-barquqi-1929 s.80}}."
  id: "Sebuah puisi oleh Hassan ibn Thabit yang menyebutkan Rasulullah dan para sahabatnya pada Hari Badr, dari sederhana menurut riwayat 'dal' seperti di awal Sharh al-Barquqi {{cite:sharh-diwan-hassan-barquqi-1929 hlm.80}}."
