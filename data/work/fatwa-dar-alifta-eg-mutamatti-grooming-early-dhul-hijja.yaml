label: { ar: "حكم أخذ المتمتع من شعره وأظافره في أول ذي الحجة وقبل الإحرام بالحج", en: "The mutamatti' cutting hair and nails in early Dhu'l-Hijja before Hajj ihram", ur: "متمتع کا ذوالحجہ کے آغاز میں حج کے احرام سے پہلے بال ناخن کاٹنا" }
summary:
  ar: "سائل سأل عن أخذ المتمتع من شعره وأظافره في أول ذي الحجة قبل الإحرام بالحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20680)⁩ أنه إذا عزم الرجل على الحج متمتعًا فلا مانع شرعًا من الأخذ من شعره وأظافره في الأيام الأول من شهر ذي الحجة على ما فصّل الجواب."
  en: "A questioner asked about the mutamatti' cutting hair and nails in the first days of Dhu'l-Hijja before entering ihram for Hajj. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20680) answered that one resolved on tamattu' may do so in the month's first days — as the answer details."
  ur: "ایک سائل نے متمتع کے ذوالحجہ کے ابتدائی دنوں میں حج کے احرام سے پہلے بال ناخن کاٹنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20680)⁩ نے جواب دیا کہ تمتع کا ارادہ ہو تو جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
