id: work/fatwa-dar-alifta-eg-petrol-worker-purity
class: work
kind: fatwa
label: { ar: "حكم طهارة العامل في محطات البنزين", en: "The purity of a petrol-station worker", ur: "پٹرول پمپ کارکن کی طہارت", es: "La pureza de un trabajador de gasolinera", fr: "La pureté d'un employé de station-service" }
summary:
  ar: "عامل في محطات البنزين سأل عن طهارته وصحة صلاته بثيابه التي أصابها البنزين والسولار. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21688)⁩ أن البنزين والسولار الأصل فيهما أنهما من جملة الطاهرات فلا تتنجس الملابس أو البدن بما يصيبها من آثارهما على ما فصّل الجواب."
  en: "A petrol-station worker asked about his purity and the validity of praying in clothes touched by petrol and diesel. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21688) answered that petrol and diesel are in origin among the pure things — clothes and body are not made impure by their traces — as the answer details."
  ur: "پٹرول پمپ کے کارکن نے اپنے کپڑوں پر پٹرول اور ڈیزل لگنے پر طہارت اور نماز کی صحت پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21688)⁩ نے جواب دیا کہ پٹرول اور ڈیزل اصل میں پاک چیزیں ہیں اور ان کے آثار سے کپڑے یا جسم ناپاک نہیں ہوتے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un empleado de una gasolinera preguntó sobre su pureza y la validez de rezar con ropa que había estado en contacto con gasolina y diésel. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21688) respondió que la gasolina y el diésel son, en su origen, sustancias puras; la ropa y el cuerpo no se contaminan con sus rastros, como se detalla en la respuesta."
  fr: "Un employé de station-service s'est interrogé sur la pureté de ses vêtements et la validité de la prière en les portant souillés d'essence et de diesel. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21688) a répondu que l'essence et le diesel sont par nature purs; leurs traces ne rendent ni les vêtements ni le corps impurs, comme le précise la réponse."
