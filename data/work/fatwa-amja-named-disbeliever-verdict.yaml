id: work/fatwa-amja-named-disbeliever-verdict
class: work
kind: fatwa
label: { ar: "الحكم على المعين بجنة أو نار", en: "Naming an individual to paradise or fire", ur: "کسی مخصوص شخص کے لیے جنت یا دوزخ کا فیصلہ", es: "Nombrar a un individuo para el paraíso o el fuego", fr: "Nommer un individu au paradis ou au feu" }
summary:
  ar: "سأل سائل عن عقيدة أهل السنة في الكافر الذي علمنا أنه مات على الكفر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21695 بتاريخ 29 يناير 2008)⁩ أن الحكم العام أن من مات على الكفر فهو في النار وهذا لا يوجب الحكم على المعين والشهادة عليه بأنه في النار وكذلك الجنة، فلا تجوز الشهادة لمعين بجنة أو نار إلا لمن شهد الله له بذلك في كتابه أو شهد له رسوله في سنته الصحيحة، وتشهد الأمة لأهل الإيمان عمومًا بالجنة وللكفار عمومًا بالنار لأن العبرة بالخواتيم."
  en: "A questioner asked the Sunni creed on a disbeliever known to have died in disbelief. Dr. Salah al-Sawi (fatwa no. 21695, 29 January 2008) answered that the general ruling is that one who dies in disbelief is in the Fire — but that does not require judging a named individual or testifying him to the Fire, and likewise paradise: none may be testified to paradise or fire except one God witnessed to in His book or His messenger in the sound sunna; the ummah testifies the people of faith generally to paradise and the disbelievers generally to the Fire, for what counts is the endings."
  ur: "ایک سائل نے کسی مخصوص کافر کے انجام کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21695، 29 جنوری 2008)⁩ کے مطابق عمومی حکم یہ ہے کہ کفر پر مرنے والا دوزخ میں ہے مگر کسی مخصوص کے لیے شہادت صرف نص سے ہے۔"
  es: "Un consultante preguntó sobre la doctrina sunita respecto a un incrédulo que murió en la incredulidad. El Dr. Salah al-Sawi (fatwa n.° 21695, 29 de enero de 2008) respondió que la norma general es que quien muere en la incredulidad va al Fuego, pero eso no requiere juzgar a una persona en particular ni atestiguar su condena al Fuego, y lo mismo ocurre con el paraíso: nadie puede ser condenado al paraíso ni al fuego excepto aquel de quien Dios ha dado testimonio en Su libro o Su mensajero en la Sunna auténtica; la Ummah atestigua que los creyentes en general van al paraíso y los incrédulos en general al Fuego, pues lo que cuenta son los finales."
  fr: "Un internaute a interrogé la doctrine sunnite sur le sort d'un mécréant décédé dans l'incroyance. Le Dr Salah al-Sawi (fatwa n° 21695, 29 janvier 2008) a répondu que, selon la règle générale, celui qui meurt dans l'incroyance est voué à l'Enfer. Toutefois, cela n'implique pas de juger une personne nommément ni de témoigner de son destin en Enfer, ni du paradis: nul ne peut être voué au paradis ou à l'Enfer, si ce n'est celui dont Dieu a témoigné dans Son Livre ou Son messager dans la Sunna authentique. La communauté musulmane (oumma) témoigne généralement du destin des croyants au paradis et celui des mécréants en Enfer, car seule la fin importe."
