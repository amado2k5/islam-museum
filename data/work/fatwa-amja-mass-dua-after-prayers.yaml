id: work/fatwa-amja-mass-dua-after-prayers
class: work
kind: fatwa
label: { ar: "الدعاء الجماعي دبر الصلوات", en: "Official collective dua after every prayer — no basis", ur: "ہر نماز کے بعد اجتماعی دعا — بلا اصل" }
summary:
  ar: "سأل سائل عن حكم إلزام المسؤولين بالدعاء الجماعي دبر كل صلاة مفروضة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21983 بتاريخ 14 أكتوبر 2012)⁩ أن الدعاء الجماعي على النحو الذي يجرى في بعض المساجد في أدبار الصلوات المكتوبة ليس له أصل يدل عليه من كتاب أو سنة صحيحة والأصل ترك ما كان من هذا القبيل على ما فصّل الجواب."
  en: "A questioner asked the ruling on officials imposing a collective dua after every obligatory prayer. AMJA's fatwa committee (fatwa no. 21983, 14 October 2012) answered that the collective dua as run in some mosques after the prescribed prayers has no basis indicating it in Book or sound Sunna, and the rule is leaving such things — as the answer details."
  ur: "اجتماعی دعا ہر نماز کے بعد؟ لجنة الفتوى ⁦(فتویٰ 21983، 14 اکتوبر 2012)⁩ کے مطابق اس کی کتاب سنت میں اصل نہیں — ترک اصل ہے۔"
