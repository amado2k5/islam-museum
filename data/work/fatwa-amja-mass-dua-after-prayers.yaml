label: { ar: "الدعاء الجماعي دبر الصلوات", en: "Official collective dua after every prayer — no basis", ur: "ہر نماز کے بعد اجتماعی دعا — بلا اصل", es: "Súplica colectiva oficial después de cada oración: sin fundamento", fr: "Doua collective officielle après chaque prière — sans fondement" }
summary:
  ar: "سأل سائل عن حكم إلزام المسؤولين بالدعاء الجماعي دبر كل صلاة مفروضة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21983 بتاريخ 14 أكتوبر 2012)⁩ أن الدعاء الجماعي على النحو الذي يجرى في بعض المساجد في أدبار الصلوات المكتوبة ليس له أصل يدل عليه من كتاب أو سنة صحيحة والأصل ترك ما كان من هذا القبيل على ما فصّل الجواب."
  en: "A questioner asked the ruling on officials imposing a collective dua after every obligatory prayer. AMJA's fatwa committee (fatwa no. 21983, 14 October 2012) answered that the collective dua as run in some mosques after the prescribed prayers has no basis indicating it in Book or sound Sunna, and the rule is leaving such things — as the answer details."
  ur: "اجتماعی دعا ہر نماز کے بعد؟ لجنة الفتوى ⁦(فتویٰ 21983، 14 اکتوبر 2012)⁩ کے مطابق اس کی کتاب سنت میں اصل نہیں — ترک اصل ہے۔"
  es: "Un consultante preguntó sobre la norma relativa a que los funcionarios impongan una súplica colectiva después de cada oración obligatoria. El comité de fatuas de AMJA (fatua n.º 21983, 14 de octubre de 2012) respondió que la súplica colectiva que se realiza en algunas mezquitas después de las oraciones prescritas no tiene fundamento en el Corán ni en la Sunna auténtica, y la norma no contempla tales prácticas, como se detalla en la respuesta."
  fr: "Un internaute a interrogé l'AMJA sur la question de l'ordonnance relative à l'invocation collective (dua) après chaque prière obligatoire. Le comité des fatwas de l'AMJA (fatwa n° 21983, 14 octobre 2012) a répondu que cette invocation collective, telle qu'elle est pratiquée dans certaines mosquées après les prières prescrites, ne trouve aucun fondement dans le Coran ni dans la Sunna authentique, et que la règle s'abstient de telles pratiques, comme le précise la réponse."
