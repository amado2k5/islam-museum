  - tradition: sunni
    id: wahidi-dhahabi-critique
    standing: main
    stance:
      ar: "ليس تفسيراً معتبراً: نقد الواحدي والذهبي والسيوطي كما ينقله المحقق"
      en: "Not acceptable as tafsir: the critique of al-Wahidi, al-Dhahabi and al-Suyuti as the editor reports it"
      ur: "معتبر تفسیر نہیں: واحدی، ذہبی اور سیوطی کی تنقید جیسا کہ محقق نقل کرتے ہیں"
    summary:
      ar: "ينقل المحقق عن الواحدي قوله «إن كان قد اعتقد أن ذلك تفسير فقد كفر»، وعن الذهبي أن فيه أشياء لا تسوغ أصلاً عدها بعض الأئمة من زندقة الباطنية وعدها بعضهم عرفاناً وحقيقة، وأنه يرى ما فيه «تخريفاً وقرمطة»، وعن السيوطي أنه تفسير «غير محمود»."
      en: "The editor quotes al-Wahidi: 'if he believed that this is tafsir, he has disbelieved'; al-Dhahabi: it contains things in no way permissible, which some imams counted as Batini heresy and others as gnosis and reality, and he regarded its contents as 'nonsense and Qarmatism'; and al-Suyuti, who called it an 'unpraiseworthy' tafsir."
      ur: "محقق واحدی کا قول نقل کرتے ہیں: «اگر انہوں نے اسے تفسیر سمجھا تو کفر کیا»؛ ذہبی کا: اس میں ایسی چیزیں ہیں جو بالکل جائز نہیں، جنہیں بعض ائمہ نے باطنیہ کی زندقہ اور بعض نے عرفان و حقیقت شمار کیا، اور وہ اس کے مشمولات کو «تخریف و قرمطہ» سمجھتے تھے؛ اور سیوطی کا، جنہوں نے اسے «غیر محمود» تفسیر کہا۔"
