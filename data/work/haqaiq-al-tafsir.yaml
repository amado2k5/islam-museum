  - tradition: sunni
    id: shurayba-defence
    standing: secondary
    stance:
      ar: "جمعٌ لأقوال الصوفية لا رأي فيه للسلمي: دفاع المحقق نور الدين شريبة"
      en: "A collection of the Sufis' sayings with no view of al-Sulami's own: the defence of the editor Nur al-Din Shurayba"
      ur: "صوفیہ کے اقوال کا مجموعہ جس میں سلمی کی اپنی رائے نہیں: محقق نور الدین شریبہ کا دفاع"
    summary:
      ar: "يرى المحقق أن الكتاب لا رأي فيه للسلمي وإنما هو آراء القوم وفهمهم، وأن حملة الواحدي «حملة ظالمة» لأن ناقل الكفر ليس بكافر، ويستدل على قبوله عند خاصة العلماء بأن أبا حامد الإسفراييني طلبه ببغداد وأراد أن يسمعه."
      en: "The editor holds that the book contains no view of al-Sulami's but the Sufis' views and understanding, that al-Wahidi's attack is 'an unjust attack' since one who reports unbelief is not an unbeliever, and cites as evidence of its acceptance among leading scholars that Abu Hamid al-Isfara'ini asked for it in Baghdad and wished to hear it read."
      ur: "محقق کی رائے ہے کہ کتاب میں سلمی کی کوئی رائے نہیں بلکہ قوم کی آرا اور فہم ہے، کہ واحدی کا حملہ «ظالمانہ حملہ» ہے کیونکہ کفر نقل کرنے والا کافر نہیں، اور خواص علما کے ہاں اس کی قبولیت پر یہ دلیل دیتے ہیں کہ ابو حامد اسفراینی نے بغداد میں اسے منگوایا اور سننا چاہا۔"
    holders: [person/abu-hamid-al-isfarayini]
