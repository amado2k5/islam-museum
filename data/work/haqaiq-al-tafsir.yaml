summary:
  ar: "كتاب جمع فيه أبو عبد الرحمن السلمي أقوال الصوفية في فهم القرآن، يقول محقق «طبقات الصوفية» إنه لا رأي للسلمي فيه وإنما هو آراء القوم، وقد جرّ عليه خصومة: فيروى عن الواحدي أنه قال «إن كان قد اعتقد أن ذلك تفسير فقد كفر»، وقال الذهبي إن فيه أشياء لا تسوغ أصلاً؛ ومنه نسخ خطية كثيرة {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 34} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 43}."
  en: "A book in which Abu 'Abd al-Rahman al-Sulami gathered the Sufis' sayings on understanding the Qur'an; the editor of Tabaqat al-Sufiyya says it holds no opinion of al-Sulami's own, only the Sufis' views, yet it brought him enmity: al-Wahidi is reported to have said 'if he believed that this is tafsir, he has disbelieved', and al-Dhahabi said it contains things that are in no way permissible; many manuscripts of it survive {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 34} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 43}."
  ur: "ایک کتاب جس میں ابو عبد الرحمن سلمی نے قرآن کے فہم کے بارے میں صوفیہ کے اقوال جمع کیے؛ «طبقات الصوفیہ» کے محقق کہتے ہیں کہ اس میں سلمی کی اپنی کوئی رائے نہیں، صرف قوم کی آرا ہیں، پھر بھی اس نے ان پر مخالفت کھڑی کی: واحدی سے منقول ہے کہ «اگر انہوں نے اسے تفسیر سمجھا تو کفر کیا»، اور ذہبی نے کہا کہ اس میں ایسی چیزیں ہیں جو بالکل جائز نہیں؛ اس کے بہت سے قلمی نسخے موجود ہیں {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 34} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 43}۔"
