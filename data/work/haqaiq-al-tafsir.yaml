summary:
  ar: "كتاب جمع فيه أبو عبد الرحمن السلمي أقوال الصوفية في فهم القرآن، يقول محقق «طبقات الصوفية» إنه لا رأي للسلمي فيه وإنما هو آراء القوم، وقد جرّ عليه خصومة: فيروى عن الواحدي أنه قال «إن كان قد اعتقد أن ذلك تفسير فقد كفر»، وقال الذهبي إن فيه أشياء لا تسوغ أصلاً؛ ومنه نسخ خطية كثيرة {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 34} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 43}."
  en: "A book in which Abu 'Abd al-Rahman al-Sulami gathered the Sufis' sayings on understanding the Qur'an; the editor of Tabaqat al-Sufiyya says it holds no opinion of al-Sulami's own, only the Sufis' views, yet it brought him enmity: al-Wahidi is reported to have said 'if he believed that this is tafsir, he has disbelieved', and al-Dhahabi said it contains things that are in no way permissible; many manuscripts of it survive {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 34} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 43}."
  ur: "ایک کتاب جس میں ابو عبد الرحمن سلمی نے قرآن کے فہم کے بارے میں صوفیہ کے اقوال جمع کیے؛ «طبقات الصوفیہ» کے محقق کہتے ہیں کہ اس میں سلمی کی اپنی کوئی رائے نہیں، صرف قوم کی آرا ہیں، پھر بھی اس نے ان پر مخالفت کھڑی کی: واحدی سے منقول ہے کہ «اگر انہوں نے اسے تفسیر سمجھا تو کفر کیا»، اور ذہبی نے کہا کہ اس میں ایسی چیزیں ہیں جو بالکل جائز نہیں؛ اس کے بہت سے قلمی نسخے موجود ہیں {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 34} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 43}۔"
  es: "Un libro en el que Abu 'Abd al-Rahman al-Sulami reunió los dichos de los sufíes sobre la comprensión del Corán; el editor de Tabaqat al-Sufiyya dice que no contiene ninguna opinión propia de al-Sulami, solo las opiniones de los sufíes, sin embargo, le granjeó enemistad: se dice que al-Wahidi dijo 'si creyó que esto es tafsir, ha descreído', y al-Dhahabi dijo que contiene cosas que no son permisibles de ninguna manera; sobreviven muchos manuscritos de él {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 34} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 43}."
  fr: "Un ouvrage dans lequel Abu 'Abd al-Rahman al-Sulami a rassemblé les hadiths des soufis sur la compréhension du Coran; l'éditeur de Tabaqat al-Sufiyya affirme qu'il ne contient aucune opinion propre à al-Sulami, mais uniquement les points de vue des soufis, et pourtant il lui a valu l'inimitié: al-Wahidi aurait dit: « S'il croit que ceci est un tafsir, il a mécru », et al-Dhahabi a déclaré qu'il contenait des choses qui ne sont en aucun cas permises; de nombreux manuscrits de cet ouvrage subsistent {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 34} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 43}."
  tr: "Ebu Abdurrahman el-Sulami'nin Kur'an'ı anlamadaki Sufilerin görüşlerini derlediği bir kitaptır. 'Tabaqat al-Sufiya'nın editörü, el-Sulemi'nin bu konuda bir görüşü olmadığını; bunun halkın görüşü olduğunu ve anlaşmazlıklarla karşılaştığını söyler: el-Vahidi'den rivayet edilir: 'Eğer bunun bir yorum olduğuna inandıysa, inanmamıştır.' Al-Dhahabi, içinde hiç izin verilmeyen şeyler olduğunu söylemiştir; birçok el yazısı kopyası {atıf:tabaqat-sufiyya-sulami-khanji-1986, s. 34} {cite:tabaqat-sufiyya-sulami-khanji-1986, s. 43}."
  id: "Sebuah buku di mana Abu Abd al-Rahman al-Sulami mengumpulkan pandangan para Sufi dalam memahami Al-Qur'an. Editor 'Tabaqat al-Sufiya' mengatakan bahwa al-Sulami tidak memiliki pendapat tentang hal itu; sebaliknya, itu adalah pendapat rakyat, dan ia menghadapi perdebatan: diceritakan dari al-Wahidi bahwa ia berkata, 'Jika ia percaya bahwa ini adalah interpretasi, ia telah tidak percaya.' Al-Dhahabi mengatakan bahwa ada hal-hal di dalamnya yang sama sekali tidak diperbolehkan; banyak salinan tulisan tangan {cite:tabaqat-sufiyya-sulami-khanji-1986, hlm. 34} {cite:tabaqat-sufiyya-sulami-khanji-1986, hlm. 43}."
