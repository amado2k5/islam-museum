structure: "Eleven books (maqalat), 142 chapters in all (editor, scan p. 38). Vol. 1 of the Beirut edition: author's preface (scan pp. 80–81); Book 1; Book 2 on eras, calendars and feasts — Hijri, Alexander, Yazdgird and al-Mu'tadid's leap year, Indian, Jewish, Christian fasts and feasts, the days held great in Islam (ch. 10), Persian feasts (ch. 11) (scan pp. 263–266, 466); Book 3 on chords, sines, shadows and the spherical sector (scan p. 467); Book 4 (26 chapters) on the obliquity, ascensions, latitudes, the meridian, the azimuth, the hours and the cardines, with a table for the latitude of Ghazna (scan pp. 468–470)."
editions:
  - "Dairat al-Ma'arif al-Uthmaniyya, Hyderabad Deccan, 1954, collated on seven manuscripts with the Bayezid copy as base (editor, scan p. 37)."
  - "Dar al-Kutub al-Ilmiyya, Beirut, ed. Abd al-Karim Sami al-Jundi (source/qanun-masudi-jundi-v1)."
  - "Manuscripts named by the editor (scan p. 37): Bodleian, Oxford (copied 475 AH); Bibliothèque nationale, Paris (501 AH); Millet library, Istanbul (531 AH); Bayezid library, Istanbul (before 536 AH); Tübingen (before 562 AH); British Museum, London (570 AH); Dar al-Kutub, Cairo (Jumada II 673 AH, copied by Muhammad ibn Mas'ud ibn Muhammad al-Sinjari the astrologer)."
