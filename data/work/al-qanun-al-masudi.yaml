summary:
  ar: "موسوعة [[person/al-biruni-muhammad-ibn-ahmad|البيروني]] الكبرى في الهيئة والنجوم، أهداها إلى السلطان مسعود بن محمود الغزنوي وسماها باسمه، في إحدى عشرة مقالة ومائة واثنين وأربعين بابًا، تبدأ بالتواريخ والتقاويم والأعياد ثم حساب المثلثات والهيئة الكروية فالحركات {cite:qanun-masudi-jundi-v1 p. 38} {cite:qanun-masudi-jundi-v1 p. 81}."
  en: "[[person/al-biruni-muhammad-ibn-ahmad|Al-Biruni]]'s great encyclopaedia of astronomy, dedicated to and named after the Ghaznavid sultan Mas'ud ibn Mahmud, in eleven books and 142 chapters, moving from eras, calendars and feasts to trigonometry, spherical astronomy and the motions {cite:qanun-masudi-jundi-v1 p. 38} {cite:qanun-masudi-jundi-v1 p. 81}."
  ur: "[[person/al-biruni-muhammad-ibn-ahmad|بیرونی]] کا ہیئت و نجوم پر عظیم دائرۃ المعارف، جو غزنوی سلطان مسعود بن محمود کے نام معنون اور انہی کے نام سے موسوم ہے؛ گیارہ مقالات اور 142 ابواب، تقاویم و اعیاد سے مثلثات، کروی ہیئت اور حرکات تک {cite:qanun-masudi-jundi-v1 p. 38}."
