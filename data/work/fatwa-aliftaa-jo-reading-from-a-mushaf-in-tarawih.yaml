id: work/fatwa-aliftaa-jo-reading-from-a-mushaf-in-tarawih
class: work
kind: fatwa
label: { ar: "القراءة من المصحف في صلاة التراويح", en: "Reading from a printed Qur'an in tarawih", ur: "تراویح میں مصحف سے دیکھ کر پڑھنا", es: "Lectura de un Corán impreso en tarawih", fr: "Lecture du Coran imprimé pendant les prières de tarawih", tr: "Teravih namazları sırasında Kur'an'dan okur", id: "Pembacaan dari Al-Qur'an saat shalat Taraweeh" }
summary:
  ar: "سؤال عن القراءة من المصحف في صلاة التراويح، أجابت فيه دائرة الإفتاء العام الأردنية بأنها جائزة بشرط ألا يأتي المصلي بحركات كثيرة تبطل الصلاة، والأولى أن يقرأ الإمام من حفظه. أجابت الدائرة بأن القراءة من المصحف في صلاة التراويح جائزة، بشرط ألا يأتي بحركات كثيرة تبطل الصلاة. وقالت إن الأولى أن يكون الإمام حافظًا لكتاب الله وأن يقرأ من حفظه."
  en: "A question about reading from a printed Qur'an in tarawih, in which Jordan's General Iftaa Department answered that it is permitted provided the person praying makes no excessive movements that invalidate the prayer, and that it is better for the imam to recite from memory. The Department answered that reading from a printed copy of the Qur'an in tarawih is permitted, provided the person praying makes no excessive movements that would invalidate the prayer. It said it is better for the imam to have memorised the Qur'an and to recite from memory."
  ur: "تراویح میں مصحف سے دیکھ کر پڑھنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ جائز ہے بشرطیکہ نمازی ایسی زیادہ حرکات نہ کرے جو نماز باطل کر دیں، اور بہتر یہ ہے کہ امام زبانی پڑھے۔ ڈیپارٹمنٹ نے جواب دیا کہ تراویح میں مصحف سے دیکھ کر پڑھنا جائز ہے، بشرطیکہ ایسی زیادہ حرکات نہ ہوں جو نماز کو باطل کر دیں۔ اس نے کہا کہ بہتر یہ ہے کہ امام قرآن کا حافظ ہو اور زبانی پڑھے۔"
  es: "Una pregunta sobre la lectura de un Corán impreso durante el tarawih, a la que el Departamento General de Iftaa de Jordania respondió que está permitido siempre que la persona que reza no realice movimientos excesivos que invaliden la oración, y que es mejor que el imán recite de memoria. El Departamento respondió que leer de una copia impresa del Corán durante el tarawih está permitido, siempre que la persona que reza no realice movimientos excesivos que invaliden la oración. Dijo que es mejor que el imán haya memorizado el Corán y lo recite de memoria."
  fr: "Une question concernant la lecture du Coran imprimé pendant les prières de tarawih a été posée. Le Département général de la Iftaa de Jordanie a répondu que cela est permis à condition que le fidèle n'effectue aucun mouvement excessif susceptible d'invalider la prière, et qu'il est préférable que l'imam récite de mémoire. Le Département a précisé que la lecture d'un exemplaire imprimé du Coran pendant les prières de tarawih est autorisée, à condition que le fidèle n'effectue aucun mouvement excessif susceptible d'invalider la prière. Il a également indiqué qu'il est préférable que l'imam ait mémorisé le Coran et le récite de mémoire."
  tr: "Teravih namazı sırasında Kur'an'dan okunma ile ilgili bir soruda, Ürdün Genel Fetva Dairesi, ibadet eden kişinin namaz kılan çok sayıda hareket yapmaması koşuluyla bunun caiz olduğunu ve imamın kendi ezberinden okumasının tercih edildiğini yanıtladı. Daire, teravih namazı sırasında Kur'an'dan okumanın izin olduğunu, ancak namazı geçersiz kılacak çok sayıda hareket yapmadığı sürece izin verdiğini belirtti. İmamın Allah'ın Kitabı'nı ezberleyip hafızasından okumasının tercih edildiğini belirtti."
  id: "Pertanyaan tentang membaca dari Al-Qur'an saat shalat Taraweeh, di mana Departemen Fatwa Umum Yordania menjawab bahwa hal itu diperbolehkan asalkan jamaah tidak melakukan banyak gerakan yang membatalkan doa, dan lebih baik imam menghafal dari hafalannya sendiri. Departemen menjawab bahwa membaca Al-Qur'an selama shalat Taraweeh diperbolehkan, asalkan ia tidak melakukan banyak gerakan yang membatalkan doa. Dikatakan bahwa lebih baik imam menghafal Kitab Allah dan menghafal dari ingatannya."
