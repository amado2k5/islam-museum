id: work/fatwa-aliftaa-jo-reading-from-a-mushaf-in-tarawih
class: work
kind: fatwa
label: { ar: "القراءة من المصحف في صلاة التراويح", en: "Reading from a printed Qur'an in tarawih", ur: "تراویح میں مصحف سے دیکھ کر پڑھنا" }
summary:
  ar: "سؤال عن القراءة من المصحف في صلاة التراويح، أجابت فيه دائرة الإفتاء العام الأردنية بأنها جائزة بشرط ألا يأتي المصلي بحركات كثيرة تبطل الصلاة، والأولى أن يقرأ الإمام من حفظه. أجابت الدائرة بأن القراءة من المصحف في صلاة التراويح جائزة، بشرط ألا يأتي بحركات كثيرة تبطل الصلاة. وقالت إن الأولى أن يكون الإمام حافظًا لكتاب الله وأن يقرأ من حفظه."
  en: "A question about reading from a printed Qur'an in tarawih, in which Jordan's General Iftaa Department answered that it is permitted provided the person praying makes no excessive movements that invalidate the prayer, and that it is better for the imam to recite from memory. The Department answered that reading from a printed copy of the Qur'an in tarawih is permitted, provided the person praying makes no excessive movements that would invalidate the prayer. It said it is better for the imam to have memorised the Qur'an and to recite from memory."
  ur: "تراویح میں مصحف سے دیکھ کر پڑھنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ جائز ہے بشرطیکہ نمازی ایسی زیادہ حرکات نہ کرے جو نماز باطل کر دیں، اور بہتر یہ ہے کہ امام زبانی پڑھے۔ ڈیپارٹمنٹ نے جواب دیا کہ تراویح میں مصحف سے دیکھ کر پڑھنا جائز ہے، بشرطیکہ ایسی زیادہ حرکات نہ ہوں جو نماز کو باطل کر دیں۔ اس نے کہا کہ بہتر یہ ہے کہ امام قرآن کا حافظ ہو اور زبانی پڑھے۔"
