label: { ar: "قصيدة الحادرة «بكرت سمية بكرة فتمتع»", en: "Al-Hadira's ode 'Sumayya set out early'", es: "La oda de Al-Hadira: \"Sumayya partió temprano\".", fr: "L'ode d'Al-Hadira « Sumayya est partie tôt »", ur: "الہدیرہ کی نظم 'سمیہ جلدی نکل گئی'" }
summary:
  ar: "قصيدة في المفضليات من الكامل على روي العين، مطلعها «بكرت سمية بكرة فتمتع وغدت غدو مفارق لم يربع»، كما في طبعة المطبعة الرحمانية {{cite:mufaddaliyyat-rahmaniyya-1926 p.9}}."
  en: "A poem of the Mufaddaliyyat in the kamil metre on the rhyme ayn, opening \"Sumayya set out early, so take your pleasure, and went off like one who parts and does not return\", as in the Rahmaniyya edition {{cite:mufaddaliyyat-rahmaniyya-1926 p.9}}."
  es: "Un poema de la Mufaddaliyyat en metro kamil con rima ayn, que comienza con \"Sumayya partió temprano, así que disfruta, y se fue como quien se va y no regresa\", como en la edición Rahmaniyya {{cite:mufaddaliyyat-rahmaniyya-1926 p.9}}."
  fr: "Un poème du Mufaddaliyyat en mètre kamil sur la rime ayn, commençant par « Sumayya partit tôt, alors prends ton plaisir, et s'en alla comme celui qui se sépare et ne revient pas », comme dans l'édition Rahmaniyya {{cite:mufaddaliyyat-rahmaniyya-1926 p.9}}."
  ur: "شاعری عین پر کامل میٹر میں مفضلیت کی ایک نظم، جس کا آغاز \"سمیہ جلدی چلی، تو اپنا لطف اٹھا، اور اس طرح چلی گئی جو جدا ہو جائے اور واپس نہ آئے\" جیسا کہ رحمانیہ ایڈیشن {{حوالہ: مفضلیت رحمانیہ-1926 صفحہ 9}} میں ہے۔"
