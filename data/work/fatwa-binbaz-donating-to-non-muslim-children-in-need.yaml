id: work/fatwa-binbaz-donating-to-non-muslim-children-in-need
class: work
kind: fatwa
label: { ar: "حكم التبرع لأطفال الكفار الضعفاء", en: "Donating to non-Muslim children in need", ur: "غیر مسلموں کے کمزور بچوں کو عطیہ دینے کا حکم" }
summary:
  ar: "اعتراض من قارئ على فتوى سابقة لابن باز في مجلة الدعوة أجاز فيها التبرع لأطفال العالم أيًّا كانت جنسياتهم ودياناتهم بشرط ألا تكون دولتهم معادية، رأى فيه السائل أن هذا التبرع يضر الإسلام لأن صرف المال على الأطفال غير مضمون ولأنه يوفر النفقات لدول غير إسلامية معادية، فأجاب ابن باز بأن المقصود الضعفاء الذين يُحسَن إليهم، كالأطفال الذين يُجمعون من آثار الحروب، إذا تولى صرف المساعدة ثقة، لإنقاذ أطفال لا ذنب لهم ليسوا من أطفال المحاربين وإنما من أطفال المستأمنين أو المعاهدين أو أهل الهدنة. واستدل بأن النبي أذن في إعطاء الكفار غير المحاربين وأذن لأسماء بنت أبي بكر أن تصل أمها الكافرة من مالها، وبآية الممتحنة في عدم نهي الله عن برّ من لم يقاتلوا المسلمين. وقال إن الضعفاء من الأطفال والنساء وغيرهم ولو كانوا مشركين، إذا كانوا مستأمنين أو معاهدين أو لاجئين ضعفاء، فلا مانع من الإحسان إليهم، لكن ضعفاء المسلمين أولى منهم، فإذا تيسرت السعة للفريقين فلا بأس."
  en: "A reader's objection to an earlier fatwa by Ibn Baz in the magazine al-Da'wa permitting donations to the children of the world whatever their nationality or religion, provided their state is not hostile; the questioner argued that such donations harm Islam because there is no guarantee the money reaches the children and because it relieves non-Muslim states that are hostile to Muslims. Ibn Baz answered that what was meant is the weak who are shown kindness, such as children gathered up from the aftermath of wars, when a trustworthy party handles the aid, to rescue children who bear no guilt and who are not the children of those at war with Muslims but of people under safe conduct, treaty or truce. He argued that the Prophet permitted giving to non-Muslims who were not combatants and allowed Asma bint Abi Bakr to give to her non-Muslim mother from her wealth, and cited the verse of al-Mumtahana that God does not forbid kindness to those who have not fought the Muslims. He said that the weak among children, women and others, even if they are polytheists, when they are under safe conduct or treaty or are weak refugees, may be shown kindness without objection, but that the weak among Muslims have the greater claim; if there is enough for both, there is no harm."
  ur: "ایک قاری کا ابن باز کے مجلہ الدعوۃ میں شائع شدہ سابقہ فتوے پر اعتراض، جس میں انہوں نے دنیا کے بچوں کو قومیت اور مذہب سے قطع نظر عطیہ دینے کی اجازت دی تھی بشرطیکہ ان کی ریاست دشمن نہ ہو؛ سائل کا کہنا تھا کہ یہ عطیہ اسلام کو نقصان دیتا ہے کیونکہ رقم کے بچوں تک پہنچنے کی ضمانت نہیں اور یہ مسلمانوں سے دشمنی رکھنے والی غیر مسلم ریاستوں کے اخراجات بچاتا ہے۔ ابن باز نے جواب دیا کہ مراد وہ کمزور لوگ ہیں جن سے بھلائی کی جاتی ہے، جیسے جنگوں کے نتیجے میں جمع کیے گئے بچے، جب امداد کی تقسیم کوئی معتبر شخص کرے، ایسے بے گناہ بچوں کو بچانے کے لیے جو مسلمانوں سے برسرِ جنگ لوگوں کے نہیں بلکہ مستأمن، معاہد یا صلح والے لوگوں کے بچے ہیں۔ انہوں نے استدلال کیا کہ نبی نے غیر محارب کافروں کو دینے کی اجازت دی اور اسما بنت ابی بکر کو اپنی کافر ماں کو اپنے مال سے دینے کی اجازت دی، اور سورہ ممتحنہ کی آیت کا حوالہ دیا کہ اللہ ان لوگوں سے بھلائی سے منع نہیں کرتا جنہوں نے مسلمانوں سے جنگ نہ کی۔ انہوں نے کہا کہ بچوں، عورتوں اور دیگر کمزوروں سے، چاہے وہ مشرک ہوں، جب وہ مستأمن یا معاہد ہوں یا کمزور پناہ گزین ہوں، بھلائی کرنے میں کوئی رکاوٹ نہیں، لیکن کمزور مسلمان ان سے زیادہ حق دار ہیں؛ اگر دونوں کے لیے گنجائش ہو تو کوئی حرج نہیں۔"
