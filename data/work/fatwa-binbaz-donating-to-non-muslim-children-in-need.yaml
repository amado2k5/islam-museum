id: work/fatwa-binbaz-donating-to-non-muslim-children-in-need
class: work
kind: fatwa
label: { ar: "حكم التبرع لأطفال الكفار الضعفاء", en: "Donating to non-Muslim children in need", ur: "غیر مسلموں کے کمزور بچوں کو عطیہ دینے کا حکم", es: "Donaciones para niños no musulmanes necesitados", fr: "Faire un don aux enfants non musulmans dans le besoin", tr: "İnançsızların zayıf çocuklarına bağış kararı", id: "Putusan tentang donasi kepada anak-anak lemah dari orang kafir" }
summary:
  ar: "اعتراض من قارئ على فتوى سابقة لابن باز في مجلة الدعوة أجاز فيها التبرع لأطفال العالم أيًّا كانت جنسياتهم ودياناتهم بشرط ألا تكون دولتهم معادية، رأى فيه السائل أن هذا التبرع يضر الإسلام لأن صرف المال على الأطفال غير مضمون ولأنه يوفر النفقات لدول غير إسلامية معادية، فأجاب ابن باز بأن المقصود الضعفاء الذين يُحسَن إليهم، كالأطفال الذين يُجمعون من آثار الحروب، إذا تولى صرف المساعدة ثقة، لإنقاذ أطفال لا ذنب لهم ليسوا من أطفال المحاربين وإنما من أطفال المستأمنين أو المعاهدين أو أهل الهدنة. واستدل بأن النبي أذن في إعطاء الكفار غير المحاربين وأذن لأسماء بنت أبي بكر أن تصل أمها الكافرة من مالها، وبآية الممتحنة في عدم نهي الله عن برّ من لم يقاتلوا المسلمين. وقال إن الضعفاء من الأطفال والنساء وغيرهم ولو كانوا مشركين، إذا كانوا مستأمنين أو معاهدين أو لاجئين ضعفاء، فلا مانع من الإحسان إليهم، لكن ضعفاء المسلمين أولى منهم، فإذا تيسرت السعة للفريقين فلا بأس."
  en: "A reader's objection to an earlier fatwa by Ibn Baz in the magazine al-Da'wa permitting donations to the children of the world whatever their nationality or religion, provided their state is not hostile; the questioner argued that such donations harm Islam because there is no guarantee the money reaches the children and because it relieves non-Muslim states that are hostile to Muslims. Ibn Baz answered that what was meant is the weak who are shown kindness, such as children gathered up from the aftermath of wars, when a trustworthy party handles the aid, to rescue children who bear no guilt and who are not the children of those at war with Muslims but of people under safe conduct, treaty or truce. He argued that the Prophet permitted giving to non-Muslims who were not combatants and allowed Asma bint Abi Bakr to give to her non-Muslim mother from her wealth, and cited the verse of al-Mumtahana that God does not forbid kindness to those who have not fought the Muslims. He said that the weak among children, women and others, even if they are polytheists, when they are under safe conduct or treaty or are weak refugees, may be shown kindness without objection, but that the weak among Muslims have the greater claim; if there is enough for both, there is no harm."
  ur: "ایک قاری کا ابن باز کے مجلہ الدعوۃ میں شائع شدہ سابقہ فتوے پر اعتراض، جس میں انہوں نے دنیا کے بچوں کو قومیت اور مذہب سے قطع نظر عطیہ دینے کی اجازت دی تھی بشرطیکہ ان کی ریاست دشمن نہ ہو؛ سائل کا کہنا تھا کہ یہ عطیہ اسلام کو نقصان دیتا ہے کیونکہ رقم کے بچوں تک پہنچنے کی ضمانت نہیں اور یہ مسلمانوں سے دشمنی رکھنے والی غیر مسلم ریاستوں کے اخراجات بچاتا ہے۔ ابن باز نے جواب دیا کہ مراد وہ کمزور لوگ ہیں جن سے بھلائی کی جاتی ہے، جیسے جنگوں کے نتیجے میں جمع کیے گئے بچے، جب امداد کی تقسیم کوئی معتبر شخص کرے، ایسے بے گناہ بچوں کو بچانے کے لیے جو مسلمانوں سے برسرِ جنگ لوگوں کے نہیں بلکہ مستأمن، معاہد یا صلح والے لوگوں کے بچے ہیں۔ انہوں نے استدلال کیا کہ نبی نے غیر محارب کافروں کو دینے کی اجازت دی اور اسما بنت ابی بکر کو اپنی کافر ماں کو اپنے مال سے دینے کی اجازت دی، اور سورہ ممتحنہ کی آیت کا حوالہ دیا کہ اللہ ان لوگوں سے بھلائی سے منع نہیں کرتا جنہوں نے مسلمانوں سے جنگ نہ کی۔ انہوں نے کہا کہ بچوں، عورتوں اور دیگر کمزوروں سے، چاہے وہ مشرک ہوں، جب وہ مستأمن یا معاہد ہوں یا کمزور پناہ گزین ہوں، بھلائی کرنے میں کوئی رکاوٹ نہیں، لیکن کمزور مسلمان ان سے زیادہ حق دار ہیں؛ اگر دونوں کے لیے گنجائش ہو تو کوئی حرج نہیں۔"
  es: "Un lector objetó una fatwa anterior de Ibn Baz publicada en la revista al-Da'wa, que permitía donaciones a los niños del mundo, independientemente de su nacionalidad o religión, siempre que su estado no fuera hostil. El lector argumentó que tales donaciones perjudican al Islam porque no hay garantía de que el dinero llegue a los niños y porque benefician a estados no musulmanes hostiles a los musulmanes. Ibn Baz respondió que se refería a los débiles a quienes se les muestra bondad, como los niños rescatados tras las guerras, cuando una entidad de confianza gestiona la ayuda, para rescatar a niños inocentes que no son hijos de quienes están en guerra con los musulmanes, sino de personas bajo salvoconducto, tratado o tregua. Argumentó que el Profeta permitió dar a los no musulmanes que no eran combatientes y permitió a Asma bint Abi Bakr dar a su madre no musulmana de su riqueza, y citó el versículo de al-Mumtahana que dice que Dios no prohíbe la bondad a quienes no han luchado contra los musulmanes. Dijo que a los más débiles entre los niños, las mujeres y otros, incluso si son politeístas, cuando están bajo protección o amparo por tratado o son refugiados vulnerables, se les puede mostrar bondad sin objeción, pero que los más débiles entre los musulmanes tienen mayor derecho; si hay suficiente para ambos, no hay problema."
  fr: "Un lecteur s'est opposé à une fatwa antérieure d'Ibn Baz, parue dans la revue al-Da'wa, autorisant les dons aux enfants du monde entier, quelles que soient leur nationalité ou leur religion, pourvu que leur État ne soit pas hostile. L'auteur de la question soutenait que de tels dons nuisaient à l'islam, car rien ne garantissait que l'argent parvienne aux enfants et qu'ils profitaient aux États non musulmans hostiles aux musulmans. Ibn Baz a répondu que la fatwa visait les enfants vulnérables auxquels on faisait preuve de bienveillance, tels que les enfants recueillis après les guerres, lorsque l'aide était gérée par une entité digne de confiance. Il s'agissait de secourir des enfants innocents, non pas de personnes en guerre contre les musulmans, mais de personnes bénéficiant d'un sauf-conduit, d'un traité ou d'une trêve. Il a fait valoir que le Prophète avait autorisé les dons aux non-musulmans non combattants et avait permis à Asma bint Abi Bakr de donner de sa fortune à sa mère non musulmane. Il a également cité le verset d'al-Mumtahana selon lequel Dieu n'interdit pas la bienveillance envers ceux qui n'ont pas combattu les musulmans. Il a déclaré que les plus vulnérables parmi les enfants, les femmes et autres, même s'ils sont polythéistes, lorsqu'ils bénéficient d'un sauf-conduit, d'un traité ou sont des réfugiés vulnérables, peuvent être traités avec bienveillance sans objection, mais que les plus vulnérables parmi les musulmans ont une priorité plus grande; s'il y a suffisamment de ressources pour les deux, il n'y a pas de mal à cela."
  tr: "Bir okuyucunun El-Da'vah dergisinde İbn Baz tarafından yazılmış önceki fetvasına itirazı; bu fetva, ülke ülkesi düşmanca olmadığı sürece dünya çapında çocuklara bağış yapılmasına izin veriyordu. Soru soran kişi, bu bağışın İslam'a zarar verdiğine inanıyordu çünkü çocuklara para harcamanın garanti edilmediğini ve İslam dışı düşman ülkelere masraf sağladığını düşünüyordu. İbn Baz, amaçlanan anlamın, iyi muamele gören zayıfların, örneğin savaş sonrası toplanan çocukların, güvenilen yardımı kabul ederlerse, savaşçı çocukları değil, korunanların, bağlılık yemini edenlerin veya ateşkes yapanların çocuklarının çocuklarını kurtarmak olduğunu savundu. Peygamber'in savaşmayan kâfirlere vermeye izin verdiğini, Asma bint Ebu Bekir'in kendi servetinden inanmayan annesine ulaşmasına izin verdiğini, sınanmış ayetin ise Müslümanlarla savaşmayanları onurlandırmayı yasaklamadığını savundu. Zayıf çocukların, kadınların ve diğerlerinin, ister çok tanrılı, ister güvende, ister ahit taşıyan ya da zayıf mülteci olsalar bile, onlara iyi davranılmasına itiraz olmadığını söyledi. Ancak zayıf Müslümanlar daha çok iyiliğe layıktır. Her iki grup da erişilebilir olursa zarar yoktur."
  id: "Keberatan dari pembaca terhadap fatwa sebelumnya oleh Ibn Baz di majalah Al-Da'wah, yang mengizinkan donasi kepada anak-anak di seluruh dunia tanpa memandang kebangsaan atau agama, asalkan negara mereka tidak bermusuhan. Penanya percaya bahwa donasi ini merugikan Islam karena pengeluaran untuk anak-anak tidak dijamin dan karena menyediakan biaya bagi negara-negara non-Islam yang bermusuhan. Ibn Baz menjawab bahwa makna yang dimaksudkan adalah untuk yang lemah yang diperlakukan dengan baik, seperti anak-anak yang dikumpulkan setelah perang, jika mereka menerima bantuan yang dipercaya, untuk menyelamatkan anak-anak tak bersalah yang bukan anak pejuang melainkan anak mereka yang dilindungi, mereka yang telah bersumpah setia, atau mereka yang telah membuat gencatan senjata. Ia berargumen bahwa Nabi mengizinkan pemberian kepada kafir yang tidak berperang dan mengizinkan Asma bint Abi Bakr untuk menjangkau ibunya yang kafir dari kekayaannya sendiri, dan ayat yang diuji tidak melarang penghormatan kepada mereka yang tidak melawan Muslim. Ia mengatakan bahwa anak-anak, perempuan, dan lainnya yang lemah, bahkan jika mereka politeis, aman, pemegang perjanjian, atau pengungsi lemah, tidak ada keberatan untuk memperlakukan mereka dengan baik. Namun, Muslim yang lemah lebih layak mendapat kebaikan. Jika kedua kelompok memiliki aksesibilitas, tidak ada ruginya."
