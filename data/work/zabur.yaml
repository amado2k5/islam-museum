summary:
  ar: "الزبور في التصور الإسلامي الكتاب المنزّل على داود؛ عدّه ابن النديم مما أنزل الله من الكتب وأنه مائة وخمسون مزمورًا {cite:fihrist-ibn-al-nadim}، وذكره الثعلبي ضمن ما أنزل الله من التوراة والإنجيل والزبور والفرقان {cite:qisas-anbiya-thaalabi-edition}."
  en: "The Zabur in Islamic conception is the book revealed to David; Ibn al-Nadim counts it among God's sent-down books, a hundred and fifty psalms {cite:fihrist-ibn-al-nadim}, and al-Tha'labi names it with the Tawrat, Injil and Furqan among what God sent down {cite:qisas-anbiya-thaalabi-edition}."
  es: "El Zabur, en la concepción islámica, es el libro revelado a David; Ibn al-Nadim lo cuenta entre los libros enviados por Dios, ciento cincuenta salmos {cite:fihrist-ibn-al-nadim}, y al-Tha'labi lo nombra junto con la Torá, el Injil y el Furqan entre lo que Dios envió {cite:qisas-anbiya-thaalabi-edition}."
  fr: "Le Zabur, dans la conception islamique, est le livre révélé à David; Ibn al-Nadim le compte parmi les livres révélés par Dieu, cent cinquante psaumes {cite:fihrist-ibn-al-nadim}, et al-Tha'labi le nomme avec la Tawrat, l'Injil et le Furqan parmi ce que Dieu a révélé {cite:qisas-anbiya-thaalabi-edition}."
  ur: "اسلامی تصور میں زبور داؤد پر نازل ہونے والی کتاب ہے۔ ابن الندیم نے اسے خدا کی نازل کردہ کتابوں میں شمار کیا ہے، ایک سو پچاس زبور {حوالہ: فہرست ابن الندیم}، اور الثعلبی نے اس کا نام تورات، انجیل اور فرقان کے ساتھ رکھا ہے جو خدا نے نازل کیا ہے۔"
  tr: "İslami kavramdaki Mezmurlar, Davud'a vahyedilmiş kitaptır; İbn el-Nadim ise onu Tanrı tarafından vahyedilmiş kitaplar arasında saymış ve yüz elli mezmurdan oluştuğunu söylemiştir {cite:fihrist-ibn-al-nadim} ve Al-Tha'labi bunu Tanrı'nın Tevrat, İncil, Mezmurlar ve {cite:qisas-anbiya-thaalabi-edition} kriteri arasında belirtmiştir."
  id: "Mazmur dalam konsep Islam adalah kitab yang diwahyukan kepada Daud; Ibn al-Nadim menganggapnya sebagai salah satu kitab yang diwahyukan oleh Allah dan terdiri dari seratus lima puluh mazmur {cite:fihrist-ibn-al-nadim}, dan Al-Tha'labi menyebutkannya di antara apa yang Tuhan wahyukan tentang Taurat, Injil, Mazmur, dan kriteria {cite:qisas-anbiya-thaalabi-edition}."
