education:
  did_you_know:
    ar: "الزبور الكتاب المنزّل على داود في التصور الإسلامي؛ عدّه ابن النديم مائة وخمسين مزموراً، وذكره الثعلبي ضمن ما أنزل الله من الكتب مع التوراة والإنجيل والفرقان."
    en: "In Islamic belief the Zabur is the scripture sent down on Dawud; Ibn al-Nadim counts it a hundred and fifty psalms, and al-Tha'labi lists it among the books God sent — with the Torah, the Gospel and the Furqan."
    ur: "اسلامی تصور میں زبور داؤد پر نازل شدہ کتاب ہے؛ ابن ندیم اسے ڈیڑھ سو مزامیر شمار کرتے ہیں اور ثعلبی نے اسے توریت، انجیل اور فرقان کے ساتھ اللہ کی نازل کردہ کتابوں میں گنا۔"
    sources: [source/fihrist-ibn-al-nadim, source/encyclopaedia-of-islam-2]
