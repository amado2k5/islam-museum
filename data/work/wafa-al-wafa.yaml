summary:
  ar: "الكتاب الأوسط من ثلاثة كتب ألّفها السمهودي في تاريخ المدينة، اختصر فيه كتابه الكبير «اقتفاء الوفا» الذي احترق قبل تمامه، وزاد فيه أخباراً عن الحجرة الشريفة شاهدها حين خدم في إعادة بنيانها، كما يذكر محقق طبعته محمد محيي الدين عبد الحميد {cite:samhudi-wafa-al-wafa p.6} {cite:samhudi-wafa-al-wafa p.7}."
  en: "The middle one of three books al-Samhudi wrote on the history of Medina, an abridgement of his large Iqtifa' al-Wafa, which burned before completion, with additions on the Noble Chamber that he witnessed while serving in its rebuilding, as its editor Muhammad Muhyi al-Din Abd al-Hamid explains."
  es: "El segundo de los tres libros que al-Samhudi escribió sobre la historia de Medina es un resumen de su gran obra Iqtifa' al-Wafa, que se incendió antes de ser terminada, con añadidos sobre la Cámara Noble que presenció mientras participaba en su reconstrucción, como explica su editor, Muhammad Muhyi al-Din Abd al-Hamid."
  fr: "Le deuxième des trois livres qu'al-Samhudi a écrits sur l'histoire de Médine, un abrégé de son grand Iqtifa' al-Wafa, qui a brûlé avant d'être achevé, avec des ajouts sur la Chambre Noble dont il a été témoin lors de sa reconstruction, comme l'explique son éditeur Muhammad Muhyi al-Din Abd al-Hamid."
  ur: "السمھودی نے مدینہ کی تاریخ پر لکھی گئی تین کتابوں میں سے درمیانی کتاب، اس کے بڑے اقتداء الوفا کا ایک خلاصہ، جو مکمل ہونے سے پہلے ہی جل گیا، نوبل چیمبر میں اضافے کے ساتھ جو اس نے اس کی تعمیر نو میں خدمات انجام دیتے ہوئے دیکھا، جیسا کہ اس کے مدیر محمد محی الدین عبد الحمید بتاتے ہیں۔"
  tr: "Ortadaki kitap, al-Samhudi'nin Medine tarihi üzerine yazdığı üç kitaptan biridir. Kitapta, tamamlanmadan yanan büyük kitabı 'Iqtifa al-Wafa'yı kısaltmış ve yeniden inşasında görev yaparken tanık olduğu soylu odaya dair detaylar eklemiştir; bu, doğrulanmış editör Muhammad Muhyiddin Abdul Hamid {cite:samhudi-wafa-al-wafa s.6} {cite:samhudi-wafa-al-wafa s.7} tarafından belirtilmiştir."
  id: "Buku tengah adalah salah satu dari tiga buku yang ditulis oleh al-Samhudi tentang sejarah Madinah. Di dalamnya, ia merangkum buku besarnya 'Iqtifa al-Wafa,' yang terbakar sebelum selesai, dan menambahkan rincian tentang ruang bangsawan yang ia saksikan saat bertugas dalam rekonstruksinya, seperti yang disebutkan oleh editor terverifikasi Muhammad Muhyiddin Abdul Hamid {cite:samhudi-wafa-al-wafa hlm.6} {cite:samhudi-wafa-al-wafa hlm.7}."
