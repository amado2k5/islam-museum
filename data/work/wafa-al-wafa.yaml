structure: "Author's preface; bab 1 on the names of Medina; bab 2 on its merits, beginnings and end, in 16 fasls (its preference over other lands, residence and patience in it, its people, the Prophet's prayers for it and the removal of its fever, its protection from the Dajjal and plague, healing by its soil and dates, its peculiarities, its sanctuary and the hills of Ayr and Thawr, the rulings of the haram in eight questions, its beginnings and end, its people's departure and the event of al-Harra, the fire of the Hijaz); bab 3 on its inhabitants in former times and the Prophet's arrival and years of the hijra, in 12 fasls (the Jews after the Flood, the coming of the Ansar, their genealogy, their supremacy over the Jews and the story of Tubba', their quarters and forts, their wars...). Contents of vol. 1, scan pp. 10-11 (printed page numbers there)."
