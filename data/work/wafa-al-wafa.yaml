label: { ar: "وفاء الوفا بأخبار دار المصطفى", en: "Wafa' al-Wafa bi-Akhbar Dar al-Mustafa (al-Samhudi)" }
summary:
  ar: "الكتاب الأوسط من ثلاثة كتب ألّفها السمهودي في تاريخ المدينة، اختصر فيه كتابه الكبير «اقتفاء الوفا» الذي احترق قبل تمامه، وزاد فيه أخباراً عن الحجرة الشريفة شاهدها حين خدم في إعادة بنيانها، كما يذكر محقق طبعته محمد محيي الدين عبد الحميد {cite:samhudi-wafa-al-wafa p.6} {cite:samhudi-wafa-al-wafa p.7}."
  en: "The middle one of three books al-Samhudi wrote on the history of Medina, an abridgement of his large Iqtifa' al-Wafa, which burned before completion, with additions on the Noble Chamber that he witnessed while serving in its rebuilding, as its editor Muhammad Muhyi al-Din Abd al-Hamid explains."
