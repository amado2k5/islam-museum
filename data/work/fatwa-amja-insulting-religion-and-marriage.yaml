id: work/fatwa-amja-insulting-religion-and-marriage
class: work
kind: fatwa
label: { ar: "سب الدين وأثره في النكاح", en: "Insulting religion and its effect on the marriage bond", ur: "دین کی برائی اور نکاح پر اثر" }
summary:
  ar: "سأل سائل عن حكم سب الدين بصيغة يلعن دين أمك ويلعن ملة أمك وهل قائلها خارج من الملة وما حكم زوجته. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77211 بتاريخ 22 ديسمبر 2008)⁩ أن سب الدين على النحو الوارد كفر بالله وانسلال من ربقة الإسلام ويلزم قائله المبادرة الفورية إلى التوبة والنطق بكلمة التوحيد وإصلاح ماضيه بالندم وحاضره بالإقلاع الفوري عن هذه الكبيرة الموبقة ومستقبله بالعزم على عدم العود أبدًا ثم يكثر من الصالحات لعل الله أن يمن عليه بالتوبة والمغفرة، وأما زوجته فلا يلزم تجديد عقد نكاحها إن أعلن توبته وشهد شهادة الحق فإنه قد ارتد بعد وفاة النبي على ما فصل."
  en: "A questioner asked about cursing religion in the forms 'curse your mother's religion, curse your mother's creed' — whether the utterer leaves the fold, and what of his wife. Dr. Salah al-Sawi (fatwa no. 77211, 22 December 2008) answered that cursing religion as described is disbelief and a slipping from Islam's bond; the utterer must hasten at once to repent, utter the testimony, repair his past with remorse, his present with immediate desisting from the destroying sin, and his future with resolve never to return — then multiply good deeds that God may grant repentance and forgiveness; his wife's marriage need not be renewed if he declares his repentance and bears the true witness, the answer detailing why in the post-prophetic case."
  ur: "ایک سائل نے دین کی برائی کرنے والے کے حکم اور اس کی بیوی کے نکاح پر اثر پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77211، 22 دسمبر 2008)⁩ کے مطابق ایسا کہنا کفر ہے؛ فوری توبہ لازم، اور اعلان توبہ پر نکاح کی تجدید ضروری نہیں۔"
