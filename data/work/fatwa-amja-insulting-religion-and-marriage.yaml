id: work/fatwa-amja-insulting-religion-and-marriage
class: work
kind: fatwa
label: { ar: "سب الدين وأثره في النكاح", en: "Insulting religion and its effect on the marriage bond", ur: "دین کی برائی اور نکاح پر اثر", es: "Insultar la religión y su efecto en el vínculo matrimonial", fr: "L'insulte à la religion et son effet sur le lien conjugal", tr: "Dini aşağılamak ve evlilik üzerindeki etkisi", id: "Menghina agama dan dampaknya terhadap pernikahan" }
summary:
  ar: "سأل سائل عن حكم سب الدين بصيغة يلعن دين أمك ويلعن ملة أمك وهل قائلها خارج من الملة وما حكم زوجته. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77211 بتاريخ 22 ديسمبر 2008)⁩ أن سب الدين على النحو الوارد كفر بالله وانسلال من ربقة الإسلام ويلزم قائله المبادرة الفورية إلى التوبة والنطق بكلمة التوحيد وإصلاح ماضيه بالندم وحاضره بالإقلاع الفوري عن هذه الكبيرة الموبقة ومستقبله بالعزم على عدم العود أبدًا ثم يكثر من الصالحات لعل الله أن يمن عليه بالتوبة والمغفرة، وأما زوجته فلا يلزم تجديد عقد نكاحها إن أعلن توبته وشهد شهادة الحق فإنه قد ارتد بعد وفاة النبي على ما فصل."
  en: "A questioner asked about cursing religion in the forms 'curse your mother's religion, curse your mother's creed' — whether the utterer leaves the fold, and what of his wife. Dr. Salah al-Sawi (fatwa no. 77211, 22 December 2008) answered that cursing religion as described is disbelief and a slipping from Islam's bond; the utterer must hasten at once to repent, utter the testimony, repair his past with remorse, his present with immediate desisting from the destroying sin, and his future with resolve never to return — then multiply good deeds that God may grant repentance and forgiveness; his wife's marriage need not be renewed if he declares his repentance and bears the true witness, the answer detailing why in the post-prophetic case."
  ur: "ایک سائل نے دین کی برائی کرنے والے کے حکم اور اس کی بیوی کے نکاح پر اثر پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77211، 22 دسمبر 2008)⁩ کے مطابق ایسا کہنا کفر ہے؛ فوری توبہ لازم، اور اعلان توبہ پر نکاح کی تجدید ضروری نہیں۔"
  es: "Un consultante preguntó acerca de maldecir la religión en las formas \"maldice la religión de tu madre, maldice el credo de tu madre\": si quien profiere estas palabras abandona la fe y qué sucede con su esposa. El Dr. Salah al-Sawi (fatwa n.° 77211, 22 de diciembre de 2008) respondió que maldecir la religión como se describe es incredulidad y una ruptura con el vínculo del Islam; quien profiere estas palabras debe apresurarse a arrepentirse de inmediato, dar testimonio, reparar su pasado con remordimiento, su presente desistiendo inmediatamente del pecado destructivo y su futuro con la resolución de no volver jamás; luego, multiplicar las buenas obras para que Dios le conceda el arrepentimiento y el perdón; el matrimonio de su esposa no necesita ser renovado si él declara su arrepentimiento y da el verdadero testimonio, la respuesta detallando el porqué en el caso posterior a la profecía."
  fr: "Un internaute a posé une question concernant les injures proférées à l'encontre de la religion, telles que « maudire la religion de sa mère » ou « maudire la croyance de sa mère », et notamment sur les conséquences pour celui qui les profère de renier l'islam et sur le sort de son épouse. Le Dr Salah al-Sawi (fatwa n° 77211, 22 décembre 2008) a répondu que de telles injures constituent une forme d'incroyance et une rupture avec l'islam. Il est impératif que celui qui les profère se repente sans délai, témoigne de sa foi, répare son passé par le remords, s'abstienne immédiatement du péché destructeur dans le présent et prenne la ferme résolution de ne jamais y revenir. Il doit ensuite multiplier les bonnes actions afin que Dieu lui accorde le repentir et le pardon. Le mariage de son épouse n'a pas à être renouvelé s'il se repent et témoigne sincèrement, la réponse expliquant en détail les raisons de cette position dans le contexte post-prophétique."
  tr: "Bir soruya soran kişi, annenin dinini lanetlemek biçiminde dini lanetleme, konuşmacının din dışında olup olmadığı ve karısı hakkında verilen hükmün ne olduğu hakkında sorular soruldu. Dr. Salah Al-Sawy (22 Aralık 2008 tarihli 77211 No. fetva) dine lanetlemenin Allah'a inançsızlık ve İslam bağından kopuş olduğunu yanıtladı. Konuşmacı hemen tövbe etmeli, tek tanrıcılık sözünü söylemeli, geçmişini pişmanlıkla düzeltmeli, şimdiki zamanını bu yıkıcı günahı hemen terk ederek ve geleceğini bir daha asla geri dönmemeye ve ardından iyi şeyleri artırmaya karar vererek Allah'ın ona tövbe ve bağışlama vermesini umarak düzeltmelidir. Eşine gelince, tövbe edip gerçeğe tanıklık ederse, Peygamber'in ölümünden sonra dinden döndüğü gibi, evlilik sözleşmesini yenilemek zorunda değildir."
  id: "Seorang penanya ditanya tentang putusan mengutuk agama dalam bentuk mengutuk agama ibu dan mengutuk agama ibu, apakah pembicara berada di luar agama, dan apa putusan terhadap istrinya. Dr. Salah Al-Sawy menjawab (Fatwa No. 77211 tanggal 22 Desember 2008) bahwa mengutuk agama seperti yang dinyatakan adalah ketidakpercayaan kepada Tuhan dan penyimpangan dari ikatan Islam. Pembicara harus segera bertobat, mengucapkan firman monoteisme, memperbaiki masa lalunya dengan penyesalan, masa kini dengan segera meninggalkan dosa yang merusak ini, dan masa depannya dengan bertekad untuk tidak pernah kembali dan kemudian meningkatkan perbuatan baik, berharap Allah memberinya pertobatan dan pengampunan. Adapun istrinya, dia tidak diwajibkan memperbarui kontrak pernikahannya jika menyatakan pertobatan dan bersaksi atas kebenaran, seperti yang dia murtad setelah kematian Nabi seperti yang dijelaskan."
