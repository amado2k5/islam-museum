id: work/fatwa-amja-miscarriage-washing-burial
class: work
kind: fatwa
label: { ar: "أحكام السقط", en: "The rulings of a miscarried child — washing and burial", ur: "سقط جنین کے احکام" }
summary:
  ar: "سأل سائل عن أحكام السقط من غسل وصلاة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84578 بتاريخ 31 مايو 2011)⁩ أن أهل العلم أجمعوا على أن الطفل إذا عرفت حياته واستهل بصوت فإنه يغسل ويكفن ويصلى عليه ويكفن كما يكفن البالغ في ثلاثة أثواب، وأما من لم يستهل بصوت فإن العبرة بنفخ الروح فيه والذي عليه الجمهور أن ذلك يكون بعد تمام أربعة أشهر من الحمل فإن بلغ مبلغ نفخ الروح غسل وصلى عليه ودفن في مقابر المسلمين على ما فصّل الجواب من الأحكام المتعلقة بالسقط."
  en: "A questioner asked the rulings of a miscarried child — washing and prayer over it. Dr. Salah al-Sawi (fatwa no. 84578, 31 May 2011) answered that the scholars agree a child known to have lived and voiced a cry is washed, shrouded and prayed over, shrouded like an adult in three wraps; as for one that did not cry out, the measure is the breathing of the spirit into it, which the majority places after four completed months of pregnancy — one reaching that mark is washed, prayed over and buried in the Muslim cemetery; the answer details the rulings attaching to the miscarriage."
  ur: "ایک سائل نے سقط کے احکام پوچھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84578، 31 مئی 2011)⁩ کے مطابق آواز دینے والا بچہ غسل کفن نماز پاتا ہے؛ بغیر آواز چار ماہ مکمل کی شرط ہے۔"
