label: { ar: "أحكام السقط", en: "The rulings of a miscarried child — washing and burial", ur: "سقط جنین کے احکام", es: "Las resoluciones sobre un feto abortado: lavado y entierro.", fr: "Les décisions concernant un enfant mort-né — la toilette et l'inhumation" }
summary:
  ar: "سأل سائل عن أحكام السقط من غسل وصلاة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84578 بتاريخ 31 مايو 2011)⁩ أن أهل العلم أجمعوا على أن الطفل إذا عرفت حياته واستهل بصوت فإنه يغسل ويكفن ويصلى عليه ويكفن كما يكفن البالغ في ثلاثة أثواب، وأما من لم يستهل بصوت فإن العبرة بنفخ الروح فيه والذي عليه الجمهور أن ذلك يكون بعد تمام أربعة أشهر من الحمل فإن بلغ مبلغ نفخ الروح غسل وصلى عليه ودفن في مقابر المسلمين على ما فصّل الجواب من الأحكام المتعلقة بالسقط."
  en: "A questioner asked the rulings of a miscarried child — washing and prayer over it. Dr. Salah al-Sawi (fatwa no. 84578, 31 May 2011) answered that the scholars agree a child known to have lived and voiced a cry is washed, shrouded and prayed over, shrouded like an adult in three wraps; as for one that did not cry out, the measure is the breathing of the spirit into it, which the majority places after four completed months of pregnancy — one reaching that mark is washed, prayed over and buried in the Muslim cemetery; the answer details the rulings attaching to the miscarriage."
  ur: "ایک سائل نے سقط کے احکام پوچھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84578، 31 مئی 2011)⁩ کے مطابق آواز دینے والا بچہ غسل کفن نماز پاتا ہے؛ بغیر آواز چار ماہ مکمل کی شرط ہے۔"
  es: "Un consultante preguntó sobre las normas relativas a un feto abortado: el lavado y la oración por él. El Dr. Salah al-Sawi (fatwa n.º 84578, 31 de mayo de 2011) respondió que los eruditos coinciden en que un niño del que se sabe que vivió y lloró debe ser lavado, amortajado y se le debe rezar por él, amortajado como a un adulto con tres mantas; en cuanto a uno que no lloró, la medida es la infusión del espíritu, que la mayoría sitúa después de cuatro meses completos de embarazo; quien alcanza ese hito es lavado, se le reza por él y se le entierra en el cementerio musulmán; la respuesta detalla las normas relativas al aborto espontáneo."
  fr: "Une personne a interrogé Salah al-Sawi (fatwa n° 84578, 31 mai 2011) sur les règles relatives à un enfant mort-né: faut-il le laver et prier pour lui ? Il a répondu que les savants s’accordent à dire qu’un enfant vivant et ayant poussé un cri doit être lavé, enveloppé d’un linceul et faire l’objet de prières, comme un adulte, avec trois langes. Quant à un enfant n’ayant pas poussé de cri, la mesure consiste à insuffler l’esprit en lui, ce qui, selon la majorité, est prévu après quatre mois de grossesse. Une fois ce délai atteint, l’enfant est lavé, fait l’objet de prières et enterré dans un cimetière musulman. La réponse détaille les règles relatives à la fausse couche."
