summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته التاسعة ⁦(أبوظبي، أبريل 1995م)⁩ رقم 86 (9/3): الودائع تحت الطلب ⁦(الحسابات الجارية)⁩ لدى البنوك الإسلامية أو الربوية قروض بالمنظور الفقهي لأن المصرف المتسلم يده يد ضمان لها وهو ملزم بالرد عند الطلب، ولا يؤثر كون البنك مليئًا، وبيّن أقسام الودائع وأحكامها على ما فصّل."
  en: "IIFA's ninth-session resolution 86 (9/3) (Abu Dhabi, April 1995) on bank deposits: demand deposits (current accounts) at Islamic or riba banks are loans in the fiqh view, the receiving bank's hand being a guaranteeing hand bound to repay on demand, and the bank's solvency is irrelevant; the deposit categories and their rulings are detailed."
  ur: "اکیڈمی کی نویں مجلس کی قرارداد 86 (9/3) ⁦(ابوظہبی، اپریل 1995ء)⁩: کرنٹ اکاؤنٹ کی جمع فقہی اعتبار سے قرض ہیں — بینک ضامن ہے؛ واپسی پر تفصیلی احکام۔"
