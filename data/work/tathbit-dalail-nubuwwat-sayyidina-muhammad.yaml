summary:
  ar: "«تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني ⁦(ت 415هـ)⁩: مصنف كلامي جامع في أدلة النبوة ومعجزات النبي، يستدل فيها بالقرآن وما نُقل من الأثر ويرد على منكري النبوة وسالبي المعجزات. من أئمة المعتزلة، وتُعرض نصوصه في متصفح المعجزات بوصفها من كتب الأدلة على المعجزات."
  en: "Tathbit Dala'il al-Nubuwwa by the Qadi Abd al-Jabbar al-Hamdani (d. 415 AH): a theological compilation of proofs of prophethood and the Prophet's miracles, arguing from the Qur'an and transmitted reports against those who deny them. A leading Mu'tazili work, shown in the Miracles Browser among the books of proof."
  ur: "«تثبیت دلائل نبوت» قاضی عبد الجبار ہمدانی ⁦(وفات 415ھ)⁩ کی تصنیف: نبوت اور معجزات کے دلائل پر ایک کلامی مجموعہ جو قرآن اور منقول آثار سے استدلال کرتا ہے۔ معتزلی أشهر مصنفین میں سے، معجزات براؤزر میں دلائل کی کتابوں میں دکھائی گئی ہے۔"
