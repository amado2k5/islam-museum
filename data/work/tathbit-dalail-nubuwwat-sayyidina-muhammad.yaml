summary:
  ar: "«تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني ⁦(ت 415هـ)⁩: مصنف كلامي جامع في أدلة النبوة ومعجزات النبي، يستدل فيها بالقرآن وما نُقل من الأثر ويرد على منكري النبوة وسالبي المعجزات. من أئمة المعتزلة، وتُعرض نصوصه في متصفح المعجزات بوصفها من كتب الأدلة على المعجزات."
  en: "Tathbit Dala'il al-Nubuwwa by the Qadi Abd al-Jabbar al-Hamdani (d. 415 AH): a theological compilation of proofs of prophethood and the Prophet's miracles, arguing from the Qur'an and transmitted reports against those who deny them. A leading Mu'tazili work, shown in the Miracles Browser among the books of proof."
  ur: "«تثبیت دلائل نبوت» قاضی عبد الجبار ہمدانی ⁦(وفات 415ھ)⁩ کی تصنیف: نبوت اور معجزات کے دلائل پر ایک کلامی مجموعہ جو قرآن اور منقول آثار سے استدلال کرتا ہے۔ معتزلی أشهر مصنفین میں سے، معجزات براؤزر میں دلائل کی کتابوں میں دکھائی گئی ہے۔"
  es: "Tathbit Dala'il al-Nubuwwa, del cadí Abd al-Jabbar al-Hamdani (fallecido en el año 415 de la Hégira): una compilación teológica de pruebas de la profecía y los milagros del Profeta, que argumenta a partir del Corán y relatos transmitidos contra quienes los niegan. Una obra fundamental de la escuela Mu'tazilí, incluida en el Explorador de Milagros entre los libros de pruebas."
  fr: "Le Tathbit Dala'il al-Nubuwwa, du cadi Abd al-Jabbar al-Hamdani (mort en 415 AH), est un recueil théologique de preuves de la prophétie et des miracles du Prophète, argumentant à partir du Coran et des hadiths transmis contre ceux qui les nient. Cet ouvrage mu'tazilite majeur figure dans le répertoire des miracles parmi les livres de preuves."
  tr: "\"Thabbat Dalail al-Nubuwwah\" Kadi Abd al-Jabbar al-Hamdani'nin (ö. 415 H) eseri: Peygamber'in peygamberliğin kanıtları ve mucizeleri üzerine kapsamlı bir teolojik çalışmadır; burada Kur'an'dan atıfta bulunur ve peygamberliği ve mucizeleri inkâr edenleri çürüten raporlar aktarır. Mu'tezililerin imamlarından biriydi ve metinleri Mucizeler Tarayıcısı'nda mucizelere dair kanıt kitaplarından biri olarak sunulmaktadır."
  id: "\"Thabbat Dalail al-Nubuwwah\" oleh Qadi Abd al-Jabbar al-Hamdani (wafat 415 H): Sebuah karya teologis komprehensif tentang bukti kenabian dan mukjizat Nabi, di mana ia mengutip Al-Qur'an dan menyampaikan laporan, membantah penyangkal kenabian dan penyangkal mukjizat. Ia adalah salah satu imam Mu'tazilite, dan teks-teksnya disajikan dalam Miracles Browser sebagai salah satu buku bukti mukjizat."
