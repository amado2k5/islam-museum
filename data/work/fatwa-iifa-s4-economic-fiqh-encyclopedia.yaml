label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن مشروع الموسوعة الفقهية الاقتصادية", en: "IIFA resolution on the economic fiqh encyclopedia project", ur: "اکیڈمی کی قرارداد: معاشی فقہی دائرۃ المعارف منصوبہ", es: "Resolución de la IIFA sobre el proyecto de enciclopedia de fiqh económico", fr: "Résolution de l'IIFA sur le projet d'encyclopédie économique du droit islamique (fiqh).", tr: "Uluslararası İslami Fiqh Akademisi'nin Ekonomik Fıkıh Ansiklopedisi Projesi ile ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai Proyek Ensiklopedia Fiqh Ekonomi" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩ بعد اطلاعه على تقرير اللجنة الفرعية لدراسة مشروع الموسوعة الفقهية الاقتصادية: اعتماد الخطة التنفيذية للمشروع وفق التعديل المقترح والجوانب المقترح إدخالها على خطط الموضوعات والمراجع المضافة إلى قائمة المراجع."
  en: "IIFA's fourth-session resolution (Jeddah, February 1988) on the economic fiqh encyclopedia project: after reviewing the subcommittee's report, it adopted the project's executive plan with the proposed amendments and the suggested additions to the topic plans and reference list."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد ⁦(جدہ، فروری 1988ء)⁩: معاشی فقہی دائرۃ المعارف کا عملی لائحہ ترامیم کے ساتھ منظور۔"
  es: "Resolución de la cuarta sesión de la IIFA (Yeda, febrero de 1988) sobre el proyecto de enciclopedia de fiqh económico: tras revisar el informe del subcomité, adoptó el plan ejecutivo del proyecto con las enmiendas propuestas y las adiciones sugeridas a los planes temáticos y la lista de referencias."
  fr: "Résolution de la quatrième session de l'IIFA (Djeddah, février 1988) sur le projet d'encyclopédie économique de fiqh: après avoir examiné le rapport du sous-comité, elle a adopté le plan exécutif du projet avec les amendements proposés et les ajouts suggérés aux plans thématiques et à la liste de références."
  tr: "Uluslararası İslami Fiqh Akademisi'nin dördüncü oturumunda (Cidde, Şubat 1988) Ekonomik Hukuk Ansiklopedisi projesinin incelenmesi için Alt Komite raporunun incelenmesinden sonra alınan karar: Önerilen değişikliğe göre projenin yürütme planının onaylanması ve referans listesine eklenen konu ve referansların planlara dahil edilmesi önerilen yönleri."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi keempatnya (Jeddah, Februari 1988) setelah meninjau laporan Subkomite untuk mempelajari proyek Ensiklopedia Fiqh Ekonomi: Menyetujui rencana eksekutif proyek sesuai dengan amandemen yang diusulkan dan aspek-aspek yang diusulkan untuk dimasukkan dalam rencana topik dan referensi yang ditambahkan ke daftar referensi."
