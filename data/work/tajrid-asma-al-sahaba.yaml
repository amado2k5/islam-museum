summary:
  ar: "كتاب الحافظ شمس الدين الذهبي (ت 748هـ) جرّد فيه أسماء الصحابة من «أسد الغابة» لابن الأثير، الجامع للكتب الأربعة لابن منده وأبي نعيم وأبي موسى المديني وابن عبد البر، وزاد عليه من تاريخ من نزل حمص وتاريخ دمشق ومسند أحمد ومسند بقي بن مخلد وطبقات ابن سعد وشعراء ابن سيد الناس، ووضع له رموزاً للتابعي والغلط ولرواة الكتب الستة؛ وقدّر أن المذكورين فيه نحو ثمانية آلاف نفس {cite:tajrid-darbirr-v1 p. 64-67}."
  en: "The work in which the hadith master Shams al-Din al-Dhahabi (d. 748 AH) extracted the names of the Companions from Ibn al-Athir's Usd al-Ghaba, which had combined the four books of Ibn Manda, Abu Nu'aym, Abu Musa al-Madini and Ibn 'Abd al-Barr, adding names from the history of those who settled in Hims, the History of Damascus, the Musnads of Ahmad and of Baqi ibn Makhlad, Ibn Sa'd's Tabaqat and Ibn Sayyid al-Nas's list of poets, with sigla marking Successors, errors and narrators of the six books; he estimated the persons listed at some eight thousand {cite:tajrid-darbirr-v1 p. 64-67}."
  ur: "حافظ شمس الدین ذہبی (وفات 748ھ) کی کتاب جس میں انہوں نے ابن الاثیر کی «اسد الغابہ» سے، جو ابن مندہ، ابو نعیم، ابو موسیٰ مدینی اور ابن عبد البر کی چار کتابوں کی جامع ہے، صحابہ کے نام الگ کیے، اور حمص میں اترنے والوں کی تاریخ، تاریخِ دمشق، مسند احمد، مسند بقی بن مخلد، طبقات ابن سعد اور ابن سید الناس کے شعرا سے اضافہ کیا، تابعی، غلطی اور کتبِ ستہ کے راویوں کے لیے رموز رکھے؛ اور اندازہ لگایا کہ اس میں مذکور افراد تقریباً آٹھ ہزار ہیں {cite:tajrid-darbirr-v1 p. 64-67}۔"
