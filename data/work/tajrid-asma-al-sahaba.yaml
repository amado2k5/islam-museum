summary:
  ar: "كتاب الحافظ شمس الدين الذهبي ⁦(ت 748هـ)⁩ جرّد فيه أسماء الصحابة من «أسد الغابة» لابن الأثير، الجامع للكتب الأربعة لابن منده وأبي نعيم وأبي موسى المديني وابن عبد البر، وزاد عليه من تاريخ من نزل حمص وتاريخ دمشق ومسند أحمد ومسند بقي بن مخلد وطبقات ابن سعد وشعراء ابن سيد الناس، ووضع له رموزاً للتابعي والغلط ولرواة الكتب الستة؛ وقدّر أن المذكورين فيه نحو ثمانية آلاف نفس {cite:tajrid-darbirr-v1 p. 64-67}."
  en: "The work in which the hadith master Shams al-Din al-Dhahabi (d. 748 AH) extracted the names of the Companions from Ibn al-Athir's Usd al-Ghaba, which had combined the four books of Ibn Manda, Abu Nu'aym, Abu Musa al-Madini and Ibn 'Abd al-Barr, adding names from the history of those who settled in Hims, the History of Damascus, the Musnads of Ahmad and of Baqi ibn Makhlad, Ibn Sa'd's Tabaqat and Ibn Sayyid al-Nas's list of poets, with sigla marking Successors, errors and narrators of the six books; he estimated the persons listed at some eight thousand {cite:tajrid-darbirr-v1 p. 64-67}."
  ur: "حافظ شمس الدین ذہبی ⁦(وفات 748ھ)⁩ کی کتاب جس میں انہوں نے ابن الاثیر کی «اسد الغابہ» سے، جو ابن مندہ، ابو نعیم، ابو موسیٰ مدینی اور ابن عبد البر کی چار کتابوں کی جامع ہے، صحابہ کے نام الگ کیے، اور حمص میں اترنے والوں کی تاریخ، تاریخِ دمشق، مسند احمد، مسند بقی بن مخلد، طبقات ابن سعد اور ابن سید الناس کے شعرا سے اضافہ کیا، تابعی، غلطی اور کتبِ ستہ کے راویوں کے لیے رموز رکھے؛ اور اندازہ لگایا کہ اس میں مذکور افراد تقریباً آٹھ ہزار ہیں {cite:tajrid-darbirr-v1 p. 64-67}۔"
  es: "La obra en la que el maestro de hadices Shams al-Din al-Dhahabi (m. 748 AH) extrajo los nombres de los Compañeros del Usd al-Ghaba de Ibn al-Athir, que había combinado los cuatro libros de Ibn Manda, Abu Nu'aym, Abu Musa al-Madini e Ibn 'Abd al-Barr, añadiendo nombres de la historia de aquellos que se establecieron en Hims, la Historia de Damasco, los Musnads de Ahmad y de Baqi ibn Makhlad, el Tabaqat de Ibn Sa'd y la lista de poetas de Ibn Sayyid al-Nas, con siglas que marcan Sucesores, errores y narradores de los seis libros; estimó que las personas listadas eran unas ocho mil {cite:tajrid-darbirr-v1 p. 64-67}."
  fr: "L'ouvrage dans lequel le maître du hadith Shams al-Din al-Dhahabi (mort en 748 AH) a extrait les noms des Compagnons de l'Usd al-Ghaba d'Ibn al-Athir, qui avait combiné les quatre livres d'Ibn Manda, d'Abu Nu'aym, d'Abu Musa al-Madini et d'Ibn 'Abd al-Barr, en y ajoutant des noms tirés de l'histoire de ceux qui se sont installés à Hims, de l'Histoire de Damas, des Musnads d'Ahmad et de Baqi ibn Makhlad, des Tabaqat d'Ibn Sa'd et de la liste des poètes d'Ibn Sayyid al-Nas, avec des sigla marquant les successeurs, les erreurs et les narrateurs des six livres; il a estimé le nombre de personnes listées à environ huit mille {cite:tajrid-darbirr-v1 p. 64-67}."
  tr: "El-Hafız Şemsdin el-Dhahabi (ö. 748 H.) kitabı, İbn el-Athir'in 'Esad al-Ghabah' adlı eserindeki Sahabelerin isimlerini, İbn Manda, Ebu Nuaym, Ebu Musa el-Medini ve İbn Abdülbarr'ın dört kitabının kapsamlı koleksiyonunu listeler. Buna Homs'a yerleşenlerin tarihini, Şam'ın tarihini, Musnad Ahmed'in, Baki bin Mukhlad'ın Musnadı, İbn Seyyid el-Nas'ın sınıflarını ve İbn Seyyid el-Nas'ın şairlerini ekledi. Tabi'i, el-Ghalatı ve altı kitabın anlatıcıları için semboller ekledi; yaklaşık sekiz bin ruhun anıldığı tahmin edilmektedir {atıf:tajrid-darbirr-v1, s. 64-67}."
  id: "Kitab Al-Hafiz Shams al-Din al-Dhahabi (wafat 748 H) mencantumkan nama-nama Para Sahabat dari 'Asad al-Ghabah' karya Ibn al-Athir, kumpulan komprehensif dari empat kitab oleh Ibn Manda, Abu Nu'aym, Abu Musa al-Madini, dan Ibn Abd al-Barr. Ia menambahkan sejarah mereka yang menetap di Homs, sejarah Damaskus, Musnad Ahmad, Musnad Baqi ibn Mukhlad, kelas-kelas Ibn Sa'd, dan penyair Ibn Sayyid al-Nas. Ia menyertakan simbol untuk Tabi'i, al-Ghalat, dan narator dari enam kitab; diperkirakan sekitar delapan ribu jiwa disebutkan di dalamnya {cite:tajrid-darbirr-v1, hlm. 64-67}."
