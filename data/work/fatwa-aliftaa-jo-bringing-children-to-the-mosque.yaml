id: work/fatwa-aliftaa-jo-bringing-children-to-the-mosque
class: work
kind: fatwa
label: { ar: "اصطحاب الأطفال إلى المساجد", en: "Bringing children to the mosque", ur: "بچوں کو مسجد لے جانا", es: "Llevar niños a la mezquita", fr: "Amener les enfants à la mosquée", tr: "Çocukları camilere götürmek", id: "Membawa anak-anak ke masjid" }
summary:
  ar: "سؤال عن اصطحاب الأطفال إلى المساجد، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز إحضار الصغار المميزين إلى المسجد ليتدربوا على الجماعة وآداب المسجد مع إبقائهم بجانب وليهم، أما غير المميزين فالأصل ألا يحضروا، فإن اضطر الولي إلى إحضاره بقي معه ولم يصل في الصفوف الأولى. أجابت الدائرة بأنه يجوز إحضار الصغار المميزين إلى المسجد ليتدربوا على صلاة الجماعة ويتعلموا آداب المساجد واحترامها، وأنه ينبغي للولي أن يجعل ولده بجانبه ليوجهه، وألا يتركه يعبث وقت الصلاة ويشوش على المصلين فتضيع الغاية من اصطحابه. وقالت إن الأصل في الصغار غير المميزين ألا يصطحبوا إلى المساجد لأنهم لا يحسنون الصلاة ويصعب ضبطهم، وحضورهم يتسبب غالبًا في التشويش على المصلين أو تلويث المسجد أو العبث بالمصاحف وممتلكاته، ودرء المفاسد مقدم على جلب المنافع. وأضافت أن من اضطر إلى إحضار ولده غير المميز فلا يتركه وحده، بل يكون بجانبه ولا يصلي في الصفوف الأولى."
  en: "A question about bringing children to the mosque, in which Jordan's General Iftaa Department answered that children old enough to discern may be brought to the mosque to train in congregational prayer and mosque etiquette, kept beside their guardian, while children too young to discern should in principle not be brought; a guardian who must bring one keeps the child with him and does not pray in the front rows. The Department answered that children old enough to discern may be brought to the mosque to train in congregational prayer and learn the etiquette and respect due to mosques; the guardian should keep his child beside him to guide him, and not leave him to play during the prayer and disturb worshippers, which would defeat the purpose of bringing him. It said that children too young to discern should in principle not be brought, since they cannot pray properly and are usually hard to control, and their presence often disturbs worshippers, soils the mosque or damages copies of the Qur'an and mosque property; averting harm takes precedence over securing benefit. It added that someone who has to bring such a child should not leave him alone, but keep him by his side and not pray in the front rows."
  ur: "بچوں کو مسجد لے جانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سمجھدار بچوں کو جماعت اور مسجد کے آداب سکھانے کے لیے مسجد لانا جائز ہے، بشرطیکہ وہ ولی کے پاس رہیں، جبکہ ناسمجھ بچوں کو اصلاً نہ لایا جائے؛ اگر لانا مجبوری ہو تو ولی اسے اپنے ساتھ رکھے اور اگلی صفوں میں نماز نہ پڑھے۔ ڈیپارٹمنٹ نے جواب دیا کہ سمجھدار بچوں کو مسجد لانا جائز ہے تاکہ وہ باجماعت نماز کی مشق کریں اور مسجد کے آداب اور احترام سیکھیں؛ ولی کو چاہیے کہ بچے کو اپنے پاس رکھے تاکہ اس کی رہنمائی کرے، اور اسے نماز کے دوران کھیلنے اور نمازیوں کو پریشان کرنے کے لیے نہ چھوڑے، ورنہ اسے لانے کا مقصد فوت ہو جائے گا۔ اس نے کہا کہ ناسمجھ بچوں کو اصلاً مسجد نہ لایا جائے، کیونکہ وہ صحیح نماز نہیں پڑھ سکتے اور عموماً انہیں سنبھالنا مشکل ہوتا ہے، اور ان کی موجودگی اکثر نمازیوں کی توجہ بٹانے، مسجد کو گندا کرنے یا مصاحف اور مسجد کی چیزوں کو خراب کرنے کا سبب بنتی ہے؛ اور مفاسد کو دور کرنا منافع حاصل کرنے پر مقدم ہے۔ اس نے مزید کہا کہ جسے ایسے بچے کو لانا پڑے وہ اسے اکیلا نہ چھوڑے بلکہ اپنے پاس رکھے اور اگلی صفوں میں نماز نہ پڑھے۔"
  es: "Una pregunta sobre llevar niños a la mezquita, a la que el Departamento General de Iftaa de Jordania respondió que los niños con edad suficiente para discernir pueden ser llevados a la mezquita para practicar la oración en congregación y la etiqueta de la mezquita, siempre junto a su tutor, mientras que los niños demasiado pequeños para discernir, en principio, no deben ser llevados; el tutor que deba llevar a un niño debe mantenerlo consigo y no rezar en las primeras filas. El Departamento respondió que los niños con edad suficiente para discernir pueden ser llevados a la mezquita para practicar la oración en congregación y aprender la etiqueta y el respeto debidos a las mezquitas; el tutor debe mantener a su hijo a su lado para guiarlo, y no dejarlo jugar durante la oración y molestar a los fieles, lo que iría en contra del propósito de llevarlo. Dijo que los niños demasiado pequeños para discernir, en principio, no deben ser llevados, ya que no pueden rezar correctamente y suelen ser difíciles de controlar, y su presencia a menudo molesta a los fieles, ensucia la mezquita o daña copias del Corán y la propiedad de la mezquita; evitar el daño tiene prioridad sobre obtener el beneficio. Añadió que quien tenga que llevar a un niño así no debe dejarlo solo, sino mantenerlo a su lado y no rezar en las primeras filas."
  fr: "Concernant la présence d'enfants à la mosquée, le Département général de la Iftaa en Jordanie a répondu que les enfants en âge de discernement peuvent être amenés à la mosquée pour s'initier à la prière en congrégation et aux règles de bienséance, accompagnés de leur tuteur. En revanche, il est déconseillé d'amener les enfants trop jeunes pour discerner. Le tuteur qui doit absolument amener un enfant doit le garder auprès de lui et ne pas prier au premier rang. Le Département a précisé que les enfants en âge de discernement peuvent être amenés à la mosquée pour s'initier à la prière en congrégation et apprendre les règles de bienséance et de respect dues aux mosquées. Le tuteur doit garder son enfant près de lui pour le guider et ne pas le laisser jouer pendant la prière, ce qui perturberait les fidèles et irait à l'encontre du but recherché. Il a ajouté que les enfants trop jeunes pour discerner ne devraient pas être amenés, car ils ne peuvent pas prier correctement et sont généralement difficiles à gérer. Leur présence perturbe souvent les fidèles, salit la mosquée ou endommage les exemplaires du Coran et les biens de la mosquée. Prévenir les dommages prime sur la recherche du bien. Il a été ajouté que quiconque doit amener un tel enfant ne doit pas le laisser seul, mais le garder à ses côtés et ne doit pas prier au premier rang."
  tr: "Çocukları camiye götürmekle ilgili bir soruya Ürdün Genel Fetva Müdürlüğü, seçkin çocukların camiye getirilerek cemaat namazı ve cami görgü kurallarını uygulamalarının ve onları koruyucularının yanında tutulmasının caiz olduğunu yanıtladı. Uzman olmayanlar için ise varsayılan kural katılmamaktır. Eğer veli onları getirmek zorundaysa, ön sıralarda namaz kılmamaları ve yanlarında kalmalıdır. Daire, seçkin çocukların camiye getirilerek cemaat namazı yapmalarının ve cami görgü kuralları ile saygısını öğrenmelerinin caiz olduğunu yanıtladı. Vekilin yanında çocuğu olmalı, nama zamanını bozmamalı veya ibadet edenleri rahatsız etmemeli, böylece onu getirme amacını kaybetmelidir. Kuralın, ayrıcalıklı olmayan çocukların iyi namaz kılmadıkları ve kontrol etmeleri zor oldukları için camiye götürülmemesi gerektiği belirtti. Onların varlığı sık sık ibadet edenler arasında kafa karışıklığına, caminin kirlenmesine veya Kur'an'ın ve eşyalarının karışmasına yol açıyor. Zararı önlemek, fayda sağlamaktan önceliklidir. Ayrıca, ayrıcalıksız çocuğunu getirmeye zorlanan herkesin onu yalnız bırakmaması, aksine yanında olması ve ön sıralarda namaz kılmaması gerektiğini ekledi."
  id: "Pertanyaan tentang membawa anak-anak ke masjid, di mana Departemen Fatwa Jenderal Yordania menjawab bahwa diperbolehkan membawa anak-anak terhormat ke masjid untuk beribadah dan etiket masjid, sambil tetap berada di dekat wali mereka. Adapun mereka yang tidak spesialisasi, aturan default adalah tidak hadir. Jika wali harus membawa mereka, mereka harus tetap bersama dan tidak salat di baris depan. Departemen menjawab bahwa diperbolehkan membawa anak-anak terhormat ke masjid untuk beribadah dan mempelajari etiket serta penghormatan masjid. Wali harus menempatkan anaknya di sampingnya untuk membimbingnya dan tidak membiarkan anaknya mengacaukan waktu salat atau mengganggu jamaah, sehingga kehilangan tujuan membawanya. Ia mengatakan bahwa aturan tersebut adalah agar anak-anak yang tidak memiliki hak istimewa tidak dibawa ke masjid karena mereka tidak berdoa dengan baik dan sulit dikendalikan. Kehadiran mereka sering menyebabkan kebingungan di kalangan jamaah, pencemaran masjid, atau mengutak-atik Al-Quran dan barang-barangnya. Mencegah bahaya lebih diutamakan daripada membawa manfaat. Ia menambahkan bahwa siapa pun yang dipaksa membawa anak yang kurang beruntung sebaiknya tidak meninggalkannya sendirian, melainkan berada di sisinya dan tidak berdoa di barisan depan."
