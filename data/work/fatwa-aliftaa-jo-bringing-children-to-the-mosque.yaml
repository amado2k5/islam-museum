id: work/fatwa-aliftaa-jo-bringing-children-to-the-mosque
class: work
kind: fatwa
label: { ar: "اصطحاب الأطفال إلى المساجد", en: "Bringing children to the mosque", ur: "بچوں کو مسجد لے جانا" }
summary:
  ar: "سؤال عن اصطحاب الأطفال إلى المساجد، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز إحضار الصغار المميزين إلى المسجد ليتدربوا على الجماعة وآداب المسجد مع إبقائهم بجانب وليهم، أما غير المميزين فالأصل ألا يحضروا، فإن اضطر الولي إلى إحضاره بقي معه ولم يصل في الصفوف الأولى. أجابت الدائرة بأنه يجوز إحضار الصغار المميزين إلى المسجد ليتدربوا على صلاة الجماعة ويتعلموا آداب المساجد واحترامها، وأنه ينبغي للولي أن يجعل ولده بجانبه ليوجهه، وألا يتركه يعبث وقت الصلاة ويشوش على المصلين فتضيع الغاية من اصطحابه. وقالت إن الأصل في الصغار غير المميزين ألا يصطحبوا إلى المساجد لأنهم لا يحسنون الصلاة ويصعب ضبطهم، وحضورهم يتسبب غالبًا في التشويش على المصلين أو تلويث المسجد أو العبث بالمصاحف وممتلكاته، ودرء المفاسد مقدم على جلب المنافع. وأضافت أن من اضطر إلى إحضار ولده غير المميز فلا يتركه وحده، بل يكون بجانبه ولا يصلي في الصفوف الأولى."
  en: "A question about bringing children to the mosque, in which Jordan's General Iftaa Department answered that children old enough to discern may be brought to the mosque to train in congregational prayer and mosque etiquette, kept beside their guardian, while children too young to discern should in principle not be brought; a guardian who must bring one keeps the child with him and does not pray in the front rows. The Department answered that children old enough to discern may be brought to the mosque to train in congregational prayer and learn the etiquette and respect due to mosques; the guardian should keep his child beside him to guide him, and not leave him to play during the prayer and disturb worshippers, which would defeat the purpose of bringing him. It said that children too young to discern should in principle not be brought, since they cannot pray properly and are usually hard to control, and their presence often disturbs worshippers, soils the mosque or damages copies of the Qur'an and mosque property; averting harm takes precedence over securing benefit. It added that someone who has to bring such a child should not leave him alone, but keep him by his side and not pray in the front rows."
  ur: "بچوں کو مسجد لے جانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سمجھدار بچوں کو جماعت اور مسجد کے آداب سکھانے کے لیے مسجد لانا جائز ہے، بشرطیکہ وہ ولی کے پاس رہیں، جبکہ ناسمجھ بچوں کو اصلاً نہ لایا جائے؛ اگر لانا مجبوری ہو تو ولی اسے اپنے ساتھ رکھے اور اگلی صفوں میں نماز نہ پڑھے۔ ڈیپارٹمنٹ نے جواب دیا کہ سمجھدار بچوں کو مسجد لانا جائز ہے تاکہ وہ باجماعت نماز کی مشق کریں اور مسجد کے آداب اور احترام سیکھیں؛ ولی کو چاہیے کہ بچے کو اپنے پاس رکھے تاکہ اس کی رہنمائی کرے، اور اسے نماز کے دوران کھیلنے اور نمازیوں کو پریشان کرنے کے لیے نہ چھوڑے، ورنہ اسے لانے کا مقصد فوت ہو جائے گا۔ اس نے کہا کہ ناسمجھ بچوں کو اصلاً مسجد نہ لایا جائے، کیونکہ وہ صحیح نماز نہیں پڑھ سکتے اور عموماً انہیں سنبھالنا مشکل ہوتا ہے، اور ان کی موجودگی اکثر نمازیوں کی توجہ بٹانے، مسجد کو گندا کرنے یا مصاحف اور مسجد کی چیزوں کو خراب کرنے کا سبب بنتی ہے؛ اور مفاسد کو دور کرنا منافع حاصل کرنے پر مقدم ہے۔ اس نے مزید کہا کہ جسے ایسے بچے کو لانا پڑے وہ اسے اکیلا نہ چھوڑے بلکہ اپنے پاس رکھے اور اگلی صفوں میں نماز نہ پڑھے۔"
