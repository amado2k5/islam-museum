id: work/fatwa-dar-alifta-eg-using-text-files-without-permission
class: work
kind: fatwa
label: { ar: "حكم الاستفادة من ملفات نصية لكتب خاصة دون إذن أصحابها", en: "Using text files of others' books without permission", ur: "بغیر اجازت دوسروں کی کتابوں کی متنی فائلوں سے استفادہ", es: "Utilizar archivos de texto de libros ajenos sin permiso.", fr: "Utiliser des fichiers texte de livres d'autrui sans autorisation", tr: "Sahiplerinin izni olmadan özel kitaplar için metin dosyalarından yararlanma kararı", id: "Putusan tentang keuntungan dari file teks untuk buku pribadi tanpa izin pemiliknya" }
summary:
  ar: "سائل سأل عن استفادة دار النشر بالمصادر الموجودة على أجهزتها للمؤلفات والكتب المراد تنسيقها وإخراجها دون إذن من أصحابها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22404)⁩ ببيان حكم ذلك وضوابطه على ما فصّل الجواب من حقوق المؤلفين والملكية الفكرية."
  en: "A publishing house asked about using the text files on its devices of works and books it wants to lay out and produce, without their owners' permission. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22404) answered by setting out the ruling on that and its controls, in terms of authors' rights and intellectual property as the answer details."
  ur: "ایک ناشر ادارے نے اپنی ڈیوائسز پر موجود مصنفات اور کتابوں کی متنی فائلوں سے — جنہیں وہ ترتیب اور شائع کرنا چاہتا ہے — مالکان کی اجازت کے بغیر استفادے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22404)⁩ نے جواب میں اس کا حکم اور ضوابط بیان کیے، مصنفوں کے حقوق اور دانشورانہ ملکیت کی رو سے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una editorial preguntó sobre la posibilidad de utilizar en sus dispositivos los archivos de texto de obras y libros que desea maquetar y producir, sin el permiso de sus propietarios. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22404) respondió exponiendo la normativa al respecto y sus controles, en lo que respecta a los derechos de autor y la propiedad intelectual, tal como se detalla en la respuesta."
  fr: "Une maison d'édition a demandé l'autorisation d'utiliser, sans l'accord des auteurs, les fichiers texte d'œuvres et de livres présents sur ses appareils en vue de leur mise en page et de leur production. La Cour suprême égyptienne Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22404) a répondu en exposant sa position sur ce sujet et les conditions qu'elle encadre, notamment en matière de droits d'auteur et de propriété intellectuelle."
  tr: "Bir soru soran kişi, yayınevinin cihazlarında bulunan kaynakları, eserlerin ve kitapların sahiplerinin izni olmadan düzenlenip yayımlanması için kullandığı sordu. Mısır Dar Al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22404), kararı ve yazarların hakları ile fikri mülkiyetle ilgili ayrıntılı yanıt üzerindeki kontrollerini netleştirerek yanıt verdi."
  id: "Seorang penanya menanyakan tentang penggunaan sumber yang tersedia di perangkat penerbitnya untuk karya dan buku yang dapat diedit dan diterbitkan tanpa izin dari pemiliknya. Dar Al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22404) menanggapi dengan memperjelas putusan dan pengawasannya atas jawaban rinci mengenai hak penulis dan hak kekayaan intelektual."
