label: { ar: "ما حكم الاستثمار في الأسهم؟", en: "What is the Islamic ruling on investing in stocks?", ur: "اسٹاکس میں سرمایہ کاری کا شرعی حکم کیا ہے؟", es: "¿Cuál es la norma islámica sobre la inversión en acciones?" }
summary:
  ar: "سؤال عن حكم الاستثمار في أسهم الشركات المساهمة. أجاب المجلس الفقهي لأمريكا الشمالية ⁦(نُشر 27 أكتوبر 2024)⁩ ببيان القواعد الأساسية: الشركات المساهمة العامة تعامل في الفقه معاملة شركة العنان والسهم يمثل حصة شائعة في رأس المال على ما فصّل الجواب من الضوابط."
  en: "A question about the ruling on investing in joint-stock companies. The Fiqh Council of North America (published 27 October 2024) answered by setting out the foundational rules: public joint-stock companies are treated in fiqh as shirkat al-'inan, a share representing an undivided portion of capital — with the criteria detailed in the answer."
  ur: "جوائنٹ اسٹاک کمپنیوں میں سرمایہ کاری کے حکم کا سوال۔ فقہ کونسل آف نارتھ امریکہ ⁦(شائع شدہ 27 اکتوبر 2024)⁩ نے جواب دیا کہ عوامی کمپنیاں فقہ میں شرکت عنان کی حیثیت رکھتی ہیں اور حصص سرمائے میں شائع حصہ ہے — ضوابط جواب میں ہیں۔"
  es: "Una pregunta sobre la normativa relativa a la inversión en sociedades anónimas. El Consejo de Fiqh de Norteamérica (publicado el 27 de octubre de 2024) respondió estableciendo las normas fundamentales: las sociedades anónimas públicas se consideran en fiqh como shirkat al-'inan, una participación que representa una porción indivisa del capital, con los criterios detallados en la respuesta."
