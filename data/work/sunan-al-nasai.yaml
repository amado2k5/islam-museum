summary:
  ar: "السنن (السنن الصغرى) لأحمد بن شعيب النسائي (215–303هـ): من الكتب الستة، اشتهر بعنايته بعلل الحديث وأخطاء الراوي حتى قيل إنه أدقها من جهة العلل، وقسّمه مصنفه في النسخة المختصرة بعد أن انتقاه من سننه الكبرى."
  en: "The Sunan al-Sughra of Ahmad ibn Shu'ayb al-Nasa'i (215–303 AH): one of the six books, famed for its attention to hidden defects and transmitters' errors — said to be the subtlest of them in that regard — distilled by its author from his larger Sunan."
