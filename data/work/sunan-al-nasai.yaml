label: { ar: "سنن النسائي", en: "Sunan al-Nasa'i" }
summary:
  ar: "«السنن» ويعرف بالسنن الصغرى لأحمد بن شعيب النسائي ⁦(215–303هـ)⁩: من الكتب الستة، اشتهر بعنايته بعلل الحديث وأخطاء الرواة، وانتقاه مصنفه من سننه الكبرى. تصفه دائرة المعارف الإسلامية بأنه مقسم إلى 51 كتاباً، وفيه أبواب في الإحباس والنحل والركبى والعمرى لا ترد في المجموعات الأخرى، وتغيب عنه أبواب الفتن والقيامة والمناقب والقرآن."
  en: "The Sunan al-Sughra of Ahmad ibn Shu'ayb al-Nasa'i (215–303 AH): one of the six books, famed for its attention to hidden defects and transmitters' errors, and selected by its author from his larger Sunan. The Encyclopaedia of Islam describes it as divided into 51 chapters, with chapters on ihbas, nuhl, rukba and umra found in no other collection, and without chapters on tribulations, the resurrection, virtues or the Qur'an."
  ur: "«السنن» جو سنن صغریٰ کے نام سے معروف ہے، احمد بن شعیب نسائی ⁦(215–303ھ)⁩ کی تصنیف اور کتب ستہ میں سے ہے، جو علل حدیث اور راویوں کی غلطیوں پر توجہ کے لیے مشہور ہے اور مصنف نے اسے اپنی بڑی سنن سے چنا۔ دائرۃ المعارف الاسلامیہ اسے 51 ابواب میں منقسم بتاتی ہے، جن میں احباس، نحل، رقبیٰ اور عمریٰ کے ابواب کسی دوسرے مجموعے میں نہیں، اور فتن، قیامت، فضائل اور قرآن کے ابواب اس میں نہیں۔"
