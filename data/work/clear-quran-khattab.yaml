label: { ar: "القرآن الواضح: ترجمة إنجليزية موضوعية", en: "The Clear Quran: A Thematic English Translation", ur: "دی کلیئر قرآن: موضوعاتی انگریزی ترجمہ" }
summary:
  ar: "ترجمة إنجليزية لمعاني القرآن وضعها العالم والإمام الكندي المصري مصطفى خطاب، صدرت عن مؤسسة «بوك أوف ساينز» في لومبارد بإلينوي ⁦(سنة 2016 عند مشروع «القرآن العالمي»، و2015 في قائمة ويكيبيديا)⁩، بإنجليزية كندية معاصرة، مقسّمة إلى فقرات موضوعية بعناوين، مع مقدمة لكل سورة وحواشٍ معتدلة، وأقواس نصفية للإضافات التوضيحية؛ وقد صارت الترجمة الافتراضية في موقع quran.com سنة 2020، وتوزعها دار السلام بسعر منخفض، ونشأت منها سلسلة كاملة من الإصدارات."
  en: "An English rendering of the meanings of the Qur'an by the Canadian–Egyptian scholar and imam Mustafa Khattab, published by the Book of Signs Foundation in Lombard, Illinois (2016 according to the Global Qur'an project, 2015 in the Wikipedia list), in contemporary Canadian English, arranged in thematic paragraphs with headers, a short introduction to each sura, moderate footnotes and half brackets for explanatory insertions; it became the default translation on quran.com in 2020, is distributed at a low price by Darussalam, and has grown into a whole series of editions."
  ur: "قرآن کے معانی کا انگریزی ترجمہ از کینیڈی مصری عالم و امام مصطفیٰ خطاب، جو لومبارڈ، الینوائے کی بک آف سائنز فاؤنڈیشن سے شائع ہوا، «گلوبل قرآن» منصوبے کے مطابق 2016 اور ویکیپیڈیا کی فہرست کے مطابق 2015 میں؛ معاصر کینیڈین انگریزی، عنوانات والے موضوعاتی پیراگراف، ہر سورت کا مختصر تعارف، معتدل حواشی اور توضیحی اضافوں کے لیے نصف قوسین؛ 2020 میں quran.com کا طے شدہ ترجمہ بنا، دار السلام اسے کم قیمت پر تقسیم کرتا ہے، اور اس سے اشاعتوں کا پورا سلسلہ وجود میں آیا۔"
