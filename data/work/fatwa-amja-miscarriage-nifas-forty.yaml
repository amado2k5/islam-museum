id: work/fatwa-amja-miscarriage-nifas-forty
class: work
kind: fatwa
label: { ar: "النفاس بعد إسقاط جنين", en: "Nifas after miscarrying a four-month fetus — the forty days", ur: "سقط کے بعد نفاس — چالیس دن" }
summary:
  ar: "سألت امرأة أنها أسقطت الجنين وعمره أربعة أشهر لأسباب صحية. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77517 بتاريخ 21 يناير 2009)⁩ أن جمهور العلماء ذهبوا إلى أن أكثر أمد النفاس أربعون يومًا لحديث أم سلمة قالت كان النفساء تجلس على عهد رسول الله أربعين يومًا فإن انقطع الدم قبل ذلك فالطهر حاصل على ما فصّل الجواب من أحكام النفاس."
  en: "A woman miscarried a four-month fetus for health reasons. Dr. Salah al-Sawi (fatwa no. 77517, 21 January 2009) answered that the majority of scholars hold nifas's utmost span forty days — per Umm Salama's report that the postpartum woman sat forty days in the Messenger of God's era; where the blood stops before that, purity is had — the answer detailing the nifas rulings."
  ur: "چار ماہ کے سقط کے بعد نفاس؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77517، 21 جنوری 2009)⁩ کے مطابق نفاس کی اقصی مدت چالیس دن — پہلے ٹہر جائے تو طاہر۔"
