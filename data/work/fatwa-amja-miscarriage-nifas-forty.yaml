id: work/fatwa-amja-miscarriage-nifas-forty
class: work
kind: fatwa
label: { ar: "النفاس بعد إسقاط جنين", en: "Nifas after miscarrying a four-month fetus — the forty days", ur: "سقط کے بعد نفاس — چالیس دن", es: "Nifas después de un aborto espontáneo de un feto de cuatro meses: los cuarenta días", fr: "Nifas après une fausse couche d'un fœtus de quatre mois — les quarante jours" }
summary:
  ar: "سألت امرأة أنها أسقطت الجنين وعمره أربعة أشهر لأسباب صحية. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77517 بتاريخ 21 يناير 2009)⁩ أن جمهور العلماء ذهبوا إلى أن أكثر أمد النفاس أربعون يومًا لحديث أم سلمة قالت كان النفساء تجلس على عهد رسول الله أربعين يومًا فإن انقطع الدم قبل ذلك فالطهر حاصل على ما فصّل الجواب من أحكام النفاس."
  en: "A woman miscarried a four-month fetus for health reasons. Dr. Salah al-Sawi (fatwa no. 77517, 21 January 2009) answered that the majority of scholars hold nifas's utmost span forty days — per Umm Salama's report that the postpartum woman sat forty days in the Messenger of God's era; where the blood stops before that, purity is had — the answer detailing the nifas rulings."
  ur: "چار ماہ کے سقط کے بعد نفاس؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77517، 21 جنوری 2009)⁩ کے مطابق نفاس کی اقصی مدت چالیس دن — پہلے ٹہر جائے تو طاہر۔"
  es: "Una mujer sufrió un aborto espontáneo de un feto de cuatro meses por razones de salud. El Dr. Salah al-Sawi (fatwa n.° 77517, 21 de enero de 2009) respondió que la mayoría de los eruditos sostienen que el período máximo de nifas es de cuarenta días, según el relato de Umm Salama de que la mujer posparto permaneció sentada cuarenta días en la época del Mensajero de Dios; si la sangre se detiene antes de ese tiempo, se alcanza la pureza. La respuesta detalla las normas sobre nifas."
  fr: "Une femme a fait une fausse couche à quatre mois pour raisons de santé. Le Dr Salah al-Sawi (fatwa n° 77517, 21 janvier 2009) a répondu que la majorité des savants considèrent que la période de nifas (période de régurgitations) dure au maximum quarante jours – conformément au récit d'Umm Salama selon lequel, à l'époque du Messager de Dieu, la femme restait assise quarante jours après l'accouchement; si les saignements cessent avant ce délai, la période de régularisation est considérée comme pure – la réponse détaillant les règles relatives au nifas."
