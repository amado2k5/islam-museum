label: { ar: "حكم الأذان والإقامة للمنفرد", en: "The adhan and iqama for one praying alone", ur: "اکیلے نمازی کے لیے اذان اور اقامت", es: "El adhan y el iqama para quien reza solo", fr: "L'adhan et l'iqama pour une personne priant seule" }
summary:
  ar: "سائل سأل عن الأذان والإقامة للمنفرد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21713)⁩ أن الأذان والإقامة من سنن الصلاة ويستحب للمصلي أن يؤذن ويقيم سواء كان في حضر أو على سفر حتى وإن كان منفردًا على ما فصّل الجواب."
  en: "A questioner asked about the adhan and iqama for one praying alone. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21713) answered that adhan and iqama are among the sunnas of the prayer — it is recommended for the worshipper to call them at home or on travel, even alone — as the answer details."
  ur: "ایک سائل نے اکیلے نمازی کے لیے اذان اور اقامت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21713)⁩ نے جواب دیا کہ اذان اور اقامت نماز کی سنتیں ہیں اور حضر ہو یا سفر، تنہا بھی ہو، کہنا مستحب ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó acerca del adhan y el iqama para quien reza solo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21713) respondió que el adhan y el iqama se encuentran entre las sunnas de la oración; se recomienda que el fiel los recite en casa o durante sus viajes, incluso estando solo, como se detalla en la respuesta."
  fr: "Un fidèle a posé une question concernant l'adhan et l'iqama pour une personne priant seule. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21713) a répondu que l'adhan et l'iqama font partie des sunnas de la prière; il est recommandé au fidèle de les réciter chez lui ou en voyage, même seul, comme le précise la réponse."
