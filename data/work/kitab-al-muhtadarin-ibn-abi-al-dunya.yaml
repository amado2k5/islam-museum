label:
  ar: كتاب المحتضرين لابن أبي الدنيا
  en: Kitab al-Muhtadarin by Ibn Abi al-Dunya
  ur: کتاب المحتضرین از ابن ابی الدنیا
summary:
  ar: «المحتضرين» كتاب منسوب إلى ابن أبي الدنيا في أخبار من حضرتهم الوفاة، يذكره الذهبي بين ما وقع له من مصنفاته {cite:siyar-alam-nubala scan vol. 1 p. 2502}. وتذكر كتب التراجم أنه كان يُسمع بالإجازة والإسناد، فسمعه ابن السمعاني من شيخ قرب بلخ {cite:tarikh-islam-dhahabi vol. 41 p. 65}، وسمعه آخر من أبي الخير الباغباني {cite:tarikh-islam-dhahabi vol. 49 p. 126}. ولم يوجد في الكتب المقروءة وصف لترتيبه.
  en: 'Al-Muhtadarin is a book attributed to Ibn Abi al-Dunya on the dying, which al-Dhahabi lists among the works of his he had come across {cite:siyar-alam-nubala scan vol. 1 p. 2502}. The biographical books show it being heard by licence and chain: Ibn al-Sam''ani heard it from a shaykh near Balkh {cite:tarikh-islam-dhahabi vol. 41 p. 65}, and another man from Abu al-Khayr al-Baghbani {cite:tarikh-islam-dhahabi vol. 49 p. 126}. No description of its arrangement was found in the books read.'
  ur: '«المحتضرین» ابن ابی الدنیا سے منسوب نزع میں مبتلا لوگوں کے احوال پر کتاب ہے جسے ذہبی ان کی ان تصانیف میں گنتے ہیں جو انہیں ملیں {cite:siyar-alam-nubala scan vol. 1 p. 2502}۔ تراجم کی کتابوں میں اسے اجازت اور سند سے سنا جاتا نظر آتا ہے: ابن السمعانی نے بلخ کے قریب ایک شیخ سے سنا {cite:tarikh-islam-dhahabi vol. 41 p. 65} اور ایک اور شخص نے ابو الخیر باغبانی سے {cite:tarikh-islam-dhahabi vol. 49 p. 126}۔ پڑھی گئی کتابوں میں اس کی ترتیب کا بیان نہیں ملا۔'
