label: { ar: "الخوف على الأخت من زواج خاطئ والاستخارة", en: "Fearing a wrong marriage for one's sister, and istikhara", ur: "بہن کی غلط شادی کا خوف اور استخارہ", es: "Temer un matrimonio inapropiado para la hermana, e istikhara", fr: "Craignant un mauvais mariage pour sa sœur, et l'istikhara", tr: "Kız kardeş için yanlış evlilik ve istikhara korkusu", id: "Ketakutan untuk saudara perempuan dari pernikahan yang salah dan istikhara" }
summary:
  ar: "سأل سائل يخاف على أخته أن تتزوج رجلًا لا يتقي الله فيها وقال إن فترة الخطوبة لا تكفي لمعرفة ذلك وسأل هل تنفع الاستخارة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82369 بتاريخ 28 أغسطس 2010)⁩ أن الحل أن يجمع بين الاستشارة والاستخارة فما خاب من استشار ولا ندم من استخار، ثم يلح على الله في الدعاء أن يختار لها وألا يكلها إلى نفسها طرفة عين ويكرر مثل دعاء اللهم إن الأمر عندك وهو محجوب عني فكن أنت المختار لي، ويقيننا أن الله لن يضيعها إذا صدقت اللجأ إليه."
  en: "A questioner feared his sister might marry a man who would not fear God toward her, saying the engagement period is too short to know, and asked whether istikhara helps. Dr. Salah al-Sawi (fatwa no. 82369, 28 August 2010) answered that the remedy is combining consultation with istikhara — none who consults fails and none who seeks God's choosing regrets — then pressing God in supplication to choose for her and not leave her to herself for a blink, repeating such prayers as 'O God, the matter is Yours and veiled from me; I know no affair to choose for myself, so be the chooser for me'; his certainty, he said, is that God will not abandon one sincere in resorting to Him."
  ur: "ایک سائل کو خوف تھا کہ اس کی بہن غلط شخص سے شادی کر لے اور اس نے استخارے کا فائدہ پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82369، 28 اگست 2010)⁩ کے مطابق مشورہ اور استخارہ دونوں کرے اور اللہ سے اس کے لیے انتخاب کی دعا پر اصرار کرے۔"
  es: "Un consultante temía que su hermana se casara con un hombre que no temiera a Dios por ella, argumentando que el período de compromiso era demasiado corto para saberlo, y preguntó si la istikhara era útil. El Dr. Salah al-Sawi (fatwa n.° 82369, 28 de agosto de 2010) respondió que el remedio consiste en combinar la consulta con la istikhara —nadie que consulta fracasa y nadie que busca la elección de Dios se arrepiente—, luego rogarle a Dios que elija por ella y no la deje sola ni un instante, repitiendo oraciones como: «Oh Dios, el asunto es Tuyo y está velado para mí; no sé qué asunto elegir por mí misma, así que elige tú por mí». Su certeza, dijo, es que Dios no abandonará a quien sea sincero al recurrir a Él."
  fr: "Un homme, craignant que sa sœur n'épouse un homme qui ne la craindrait pas, a demandé si la période de fiançailles était trop courte pour le savoir et si la prière de consultation (istikhara) pouvait être utile. Le Dr Salah al-Sawi (fatwa n° 82369, 28 août 2010) a répondu que le remède consistait à combiner la consultation avec l'istikhara – car nul ne peut échouer en consultant Dieu et nul ne peut regretter de rechercher le choix de Dieu – puis à implorer Dieu de choisir pour elle et de ne pas la laisser seule, en répétant des prières telles que: « Ô Dieu, cette affaire T'appartient et m'est cachée; je ne sais pas quoi choisir par moi-même, alors choisis pour moi. » Il a ajouté avec certitude que Dieu n'abandonnera jamais celui qui se tourne sincèrement vers Lui."
  tr: "Kız kardeşinin bu dönemde Allah'tan korkmayan biriyle evlenebileceğinden korkan bir soru soran kişiye, nişan süresinin bunu bilmek için yeterli olmadığını sordu, istikhara (rehberlik aramak) faydalı olup olmadığını sordu. Dr. Salah Al-Sawy (28 Ağustos 2010 tarihli 82369 sayılı fetva) çözümün danışma ile istikharayı birleştirmek olduğunu, böylece ne danışan ne de istikhara arayan pişman olmaz dedi. Sonra Allah'tan onu seçmesini ve bir an bile göz açıp kapayıncaya kadar yalnız bırakmamasını dile getirerek aynı duayı tekrarladı: 'Allah, mesele seninle ilgilidir, benden gizli, o yüzden benim için seçilen ol. Ve eminiz, eğer doğruysa Allah onu ona bırakmaz, O'na dön.'"
  id: "Ia bertanya kepada seorang penanya yang takut saudara perempuannya mungkin menikah dengan pria yang tidak takut kepada Tuhan pada masa itu, mengatakan bahwa masa pertunangan tidak cukup untuk mengetahui hal ini, dan bertanya apakah istikhara (mencari bimbingan) itu bermanfaat. Dr. Salah Al-Sawy menjawab (Fatwa No. 82369 tanggal 28 Agustus 2010) bahwa solusinya adalah menggabungkan konsultasi dan istikhara, sehingga baik yang berkonsultasi tidak akan gagal maupun yang mencari Istikhara akan menyesal. Kemudian ia bersikeras kepada Allah dalam permohonannya untuk memilih istikhara dan tidak meninggalkannya sendirian sesaat, mengulangi permohonan yang sama: 'Ya Allah, urusan ini ada pada-Mu selama tersembunyi dariku, maka jadilah yang dipilih untukku. Dan kami yakin Tuhan tidak akan membiarkannya pergi kepadanya jika ia benar, maka bersandarlah-Nya.'"
