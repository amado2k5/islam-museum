id: work/fatwa-amja-istikhara-sisters-suitor
class: work
kind: fatwa
label: { ar: "الخوف على الأخت من زواج خاطئ والاستخارة", en: "Fearing a wrong marriage for one's sister, and istikhara", ur: "بہن کی غلط شادی کا خوف اور استخارہ" }
summary:
  ar: "سأل سائل يخاف على أخته أن تتزوج رجلًا لا يتقي الله فيها وقال إن فترة الخطوبة لا تكفي لمعرفة ذلك وسأل هل تنفع الاستخارة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82369 بتاريخ 28 أغسطس 2010)⁩ أن الحل أن يجمع بين الاستشارة والاستخارة فما خاب من استشار ولا ندم من استخار، ثم يلح على الله في الدعاء أن يختار لها وألا يكلها إلى نفسها طرفة عين ويكرر مثل دعاء اللهم إن الأمر عندك وهو محجوب عني فكن أنت المختار لي، ويقيننا أن الله لن يضيعها إذا صدقت اللجأ إليه."
  en: "A questioner feared his sister might marry a man who would not fear God toward her, saying the engagement period is too short to know, and asked whether istikhara helps. Dr. Salah al-Sawi (fatwa no. 82369, 28 August 2010) answered that the remedy is combining consultation with istikhara — none who consults fails and none who seeks God's choosing regrets — then pressing God in supplication to choose for her and not leave her to herself for a blink, repeating such prayers as 'O God, the matter is Yours and veiled from me; I know no affair to choose for myself, so be the chooser for me'; his certainty, he said, is that God will not abandon one sincere in resorting to Him."
  ur: "ایک سائل کو خوف تھا کہ اس کی بہن غلط شخص سے شادی کر لے اور اس نے استخارے کا فائدہ پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82369، 28 اگست 2010)⁩ کے مطابق مشورہ اور استخارہ دونوں کرے اور اللہ سے اس کے لیے انتخاب کی دعا پر اصرار کرے۔"
