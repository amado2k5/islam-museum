id: work/fatwa-aliftaa-jo-renting-out-gold-jewellery
class: work
kind: fatwa
label: { ar: "تأجير ذهب الزينة", en: "Renting out gold jewellery", ur: "سونے کے زیورات کرائے پر دینا" }
summary:
  ar: "سؤال عن تأجير ذهب الزينة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز تأجير حلي الذهب والفضة بمبلغ معلوم لمدة معلومة، ولا يعد ذلك ربا لأن العقد واقع على المنفعة لا على العين. أجابت الدائرة بأنه يجوز تأجير حلي الذهب أو الفضة بمبلغ معلوم إلى مدة معلومة، ولا يعد ذلك من الربا لأن العقد واقع على المنفعة لا على العين. ونقلت عن العمراني في البيان (7/327) جواز استئجار حلي الذهب بالذهب والفضة، وحلي الفضة بالفضة والذهب، وأن الصيمري ذكر أن بعض الأصحاب توقف في ذلك، وأن التوقف ليس بصحيح لأن المعقود عليه منفعة الذهب لا عينه. ونقلت عن الدميري في النجم الوهاج (5/330) عن الشافعي جواز إجارة الحلي والجواهر وسائر ما تلبسه النساء، وأن الحلي الذهبي إذا اكتري بذهب أو فضة جاز من غير اشتراط القبض في المجلس، إذ لا ربا بين الذهب ومنافعه."
  en: "A question about renting out gold jewellery, in which Jordan's General Iftaa Department answered that gold and silver jewellery may be rented out for a known sum and period, and that this is not riba because the contract concerns the use, not the substance. The Department answered that gold or silver jewellery may be rented for a known amount over a known period, and that this is not riba because the contract concerns the benefit, not the item itself. It quoted al-Imrani in al-Bayan (7/327) that gold jewellery may be hired for gold or silver and silver jewellery for silver or gold, noting that al-Saymari reported some Shafi'is hesitated over this and that the hesitation is not correct, since the object of the contract is the use of the gold, not the gold itself. It quoted al-Damiri in al-Najm al-Wahhaj (5/330) reporting al-Shafi'i's view that jewellery, gems and other things women wear may be hired, and that gold jewellery hired for gold or silver is valid without requiring possession in the session, since there is no riba between gold and the use of gold."
  ur: "سونے کے زیورات کرائے پر دینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سونے اور چاندی کے زیورات معلوم رقم اور مدت کے لیے کرائے پر دینا جائز ہے، اور یہ سود نہیں کیونکہ عقد منفعت پر ہے، عین پر نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ سونے یا چاندی کے زیورات معلوم رقم کے عوض معلوم مدت کے لیے کرائے پر دینا جائز ہے، اور یہ سود میں شمار نہیں کیونکہ عقد منفعت پر ہوتا ہے، خود چیز پر نہیں۔ اس نے البیان (7/327) میں عمرانی سے نقل کیا کہ سونے کے زیور کو سونے اور چاندی کے بدلے، اور چاندی کے زیور کو چاندی اور سونے کے بدلے کرائے پر لینا جائز ہے، اور یہ کہ صیمری نے ذکر کیا کہ بعض شافعیوں نے اس میں توقف کیا، اور یہ توقف درست نہیں کیونکہ عقد سونے کی منفعت پر ہے، سونے کی ذات پر نہیں۔ اس نے النجم الوہاج (5/330) میں دمیری سے شافعی کا قول نقل کیا کہ زیورات، جواہرات اور عورتوں کی پہنی جانے والی دیگر چیزیں کرائے پر دینا جائز ہے، اور سونے کا زیور سونے یا چاندی کے بدلے کرائے پر لیا جائے تو مجلس میں قبضے کی شرط کے بغیر جائز ہے، کیونکہ سونے اور سونے کی منفعت کے درمیان سود نہیں۔"
