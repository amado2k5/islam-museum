id: work/fatwa-amja-does-dua-change-decree
class: work
kind: fatwa
label: { ar: "هل الدعاء يغير القضاء", en: "Does supplication change destiny", ur: "کیا دعا قضا بدل دیتی ہے", es: "¿Cambia la súplica el destino?", fr: "La supplication peut-elle changer le destin ?" }
summary:
  ar: "سأل سائل هل يغير الدعاء القضاء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81834 بتاريخ 9 يوليو 2010)⁩ أن الله شرع الدعاء وأمر به لقوله تعالى ادعوني أستجب لكم، وأن الدعاء من جملة القدر فإذا فعل العبد السبب المشروع ودعا كان ذلك من القضاء فهو رد القضاء بقضاء إن أراد الله ذلك، وقد ثبت في الحديث أن العبد ليحرم الرزق بالذنب يصيبه ولا يرد القدر إلا الدعاء ولا يزيد في العمر إلا البر وكل ذلك مسطور في أم الكتاب."
  en: "A questioner asked whether supplication changes destiny. Dr. Salah al-Sawi (fatwa no. 81834, 9 July 2010) answered that God legislated and commanded supplication — 'call upon Me, I will answer you' — and that supplication is itself part of decree: when the servant takes the lawful means and prays, that is repelling decree by decree if God wills it; it is established in the hadith that a servant may be denied provision for a sin he commits, that nothing repels decree but supplication and nothing lengthens life but piety — all inscribed in the Mother of the Book."
  ur: "ایک سائل نے پوچھا کہ دعا قضا بدل دیتی ہے یا نہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81834، 9 جولائی 2010)⁩ کے مطابق دعا خود قدر میں شامل ہے اور قضا کو قضا سے دفع کیا جاتا ہے — حدیث کے مطابق قدر صرف دعا سے رد ہوتی ہے۔"
  es: "Un interlocutor preguntó si la súplica cambia el destino. El Dr. Salah al-Sawi (fatwa n.º 81834, 9 de julio de 2010) respondió que Dios legisló y mandó la súplica —«invocadme, y os responderé»— y que la súplica es en sí misma parte del decreto: cuando el siervo recurre a los medios lícitos y ora, está repeliendo decreto tras decreto si Dios así lo quiere; está establecido en el hadiz que a un siervo se le puede negar la provisión por un pecado que comete, que nada repele el decreto sino la súplica y nada prolonga la vida sino la piedad; todo ello inscrito en la Madre del Libro."
  fr: "Un internaute a demandé si la supplication pouvait changer le destin. Le Dr Salah al-Sawi (fatwa n° 81834, 9 juillet 2010) a répondu que Dieu a prescrit et ordonné la supplication: « Invoquez-Moi, Je vous répondrai ». La supplication fait partie intégrante du décret divin: lorsque le serviteur accomplit les actes licites et prie, il repousse le décret divin par le décret divin, si Dieu le veut. Il est établi dans les hadiths qu’un serviteur peut être privé de subsistance pour un péché qu’il a commis, que seule la supplication repousse le décret divin et que seule la piété prolonge la vie — tout cela est inscrit dans le Livre."
