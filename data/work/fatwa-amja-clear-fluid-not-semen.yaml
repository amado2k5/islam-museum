id: work/fatwa-amja-clear-fluid-not-semen
class: work
kind: fatwa
label: { ar: "السائل الشفاف", en: "A little clear fluid — only semen obliges the washing", ur: "شفاف سیال — غسل صرف منی پر", es: "Un poco de líquido transparente; solo el semen requiere lavado.", fr: "Un peu de liquide clair — seul le sperme nécessite un lavage" }
summary:
  ar: "سأل سائل عن حكم السائل الشفاف القليل الذي يخرج من الذكر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79164 بتاريخ 13 يونيو 2009)⁩ أنه لا يوجب الاغتسال مما يخرج من القبل من سوائل إلا المني وهو الماء الدافق الذي يخرج دفقًا بشهوة ويعقبه فتور وارتخاء وأما ما وراء ذلك فلا يوجب إلا الاستنجاء والوضوء على ما فصّل الجواب."
  en: "A questioner asked the ruling on a little clear fluid leaving the member. Dr. Salah al-Sawi (fatwa no. 79164, 13 June 2009) answered that of what exits the front part, only semen obliges the washing — the gushing water that leaves in a gush with desire followed by lassitude; whatever lies beyond that obliges only istinja and wudu — as the answer details."
  ur: "شفاف سیال نکلے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79164، 13 جون 2009)⁩ کے مطابق صرف منی غسل طلب ہے؛ باقی پر استنجاء اور وضو کافی۔"
  es: "Un consultante preguntó sobre la norma relativa a la salida de un poco de líquido transparente del miembro. El Dr. Salah al-Sawi (fatwa n.º 79164, 13 de junio de 2009) respondió que, de lo que sale de la parte frontal, solo el semen requiere el lavado —el agua que sale a borbotones con deseo seguido de lasitud—; todo lo que queda más allá solo requiere istinja y wudu —como se detalla en la respuesta—."
  fr: "Un internaute a demandé la décision concernant l'écoulement d'un peu de liquide clair hors du pénis. Le Dr Salah al-Sawi (fatwa n° 79164, 13 juin 2009) a répondu que, parmi ce qui sort de la partie antérieure, seul le sperme nécessite les ablutions – le liquide jaillissant lors de l'éjaculation, suivi de lassitude; tout ce qui se trouve au-delà ne requiert que les ablutions (istinja et wudu), comme le précise la réponse."
