label: { ar: "الأدلة العقلية على وحدانية الله", en: "The rational proofs of God's oneness", ur: "اللہ کی وحدانیت کے عقلی دلائل", es: "Las pruebas racionales de la unicidad de Dios", fr: "Les preuves rationnelles de l'unicité de Dieu", tr: "Tanrı'nın Birliğine Akılcı Kanıt", id: "Bukti Rasional untuk Kesatuan Tuhan" }
summary:
  ar: "سأل سائل عن الأدلة العقلية على وحدانية الله من أقوال الرسول. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77699 بتاريخ 4 فبراير 2009)⁩ أن في كتاب الله آيات مباشرة تتعلق بهذه القضية مثل قوله تعالى لو كان فيهما آلهة إلا الله لفسدتا فسبحان الله رب العرش عما يصفون وقوله ما اتخذ الله من ولد وما كان معه من إله إذًا لذهب كل إله بما خلق ولعلا بعضهم على بعض، فيرجع إلى تفسير هذه الآيات في كتب التفسير وإلى تعليق أساتذة العقيدة عليها ويخص بالذكر شرح الشيخ سفر الحوالي على الطحاوية ففيه كلام نفيس بديع، وقد كتبت دراسات وأبحاث فيما ذكر فراجعها."
  en: "A questioner asked for the rational proofs of God's oneness from the Messenger's words. Dr. Salah al-Sawi (fatwa no. 77699, 4 February 2009) answered that God's book holds direct verses on the matter — 'if there were gods in them besides God, both would have been corrupted; glory to God, Lord of the Throne, above what they describe', and 'God took no son, nor is there any god with Him — else each god would have gone off with what he created and some would have risen over others' — pointing him to their commentary in the tafsir books and the creed teachers' notes, especially Shaykh Safar al-Hawali's commentary on al-Tahawiyya with its precious words; and studies long and short exist on what he asked — let him consult them."
  ur: "ایک سائل نے توحید کے عقلی دلائل پوچھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77699، 4 فروری 2009)⁩ کے مطابق قرآن میں براہ راست آیات ہیں — جیسے دو معبودوں پر فساد کی دلیل — اور اس نے تفاسیر اور سفر حوالی کی شرح طحاویہ کی طرف رہنمائی کی۔"
  es: "Un consultante solicitó pruebas racionales de la unicidad de Dios a partir de las palabras del Mensajero. El Dr. Salah al-Sawi (fatwa n.° 77699, 4 de febrero de 2009) respondió que el Libro de Dios contiene versículos directos sobre el tema: «Si hubiera dioses además de Dios, ambos se habrían corrompido; gloria a Dios, Señor del Trono, por encima de lo que describen», y «Dios no tomó hijo, ni hay dios alguno con Él; de lo contrario, cada dios se habría llevado lo que creó y algunos habrían prevalecido sobre otros». Le remitió a sus comentarios en los libros de tafsir y a las notas de los maestros del credo, especialmente al comentario del Shaykh Safar al-Hawali sobre al-Tahawiyya, con sus valiosas palabras; y existen estudios, tanto extensos como breves, sobre lo que preguntó. Que los consulte."
  fr: "Un internaute a demandé des preuves rationnelles de l'unicité de Dieu tirées des paroles du Messager. Le Dr Salah al-Sawi (fatwa n° 77699, 4 février 2009) a répondu que le Livre de Dieu contient des versets directs à ce sujet: « S'il y avait des divinités en dehors de Dieu, toutes deux auraient été corrompues; gloire à Dieu, Seigneur du Trône, au-dessus de ce qu'elles décrivent », et « Dieu n'a pas pris de fils, et il n'y a point de divinité avec Lui – sinon chaque divinité aurait emporté sa création et certaines se seraient élevées au-dessus des autres ». Il l'a ensuite orienté vers les commentaires de ces versets dans les exégèses (tafsir) et les notes des maîtres de la religion, notamment le commentaire du cheikh Safar al-Hawali sur la sourate al-Tahawiyya, pour sa précieuse contribution. Il a ajouté que de nombreuses études, longues et courtes, existent sur le sujet abordé et qu'il était invité à les consulter."
  tr: "Bir soruya Peygamber'in sözlerinden Allah'ın birliğine dair mantıklı kanıtlar soruldu. Dr. Salah Al-Sawy (4 Şubat 2009 tarihli 77699 Fetvası) bu konuyla ilgili doğrudan ayetler olduğunu söyledi; örneğin: \"Eğer onlarda Allah'tan başka tanrılar olsaydı, yozlaşırlardı. Onların anlattıklarının üzerinde Tahtın Efendisi Allah'a şükürler olsun,\" ve \"Allah ne nesil ne de tanrı yanında götürdü. Birdenbire, her tanrı yarattıklarıyla birlikte yok olurdu ve belki bazıları diğerlerinin üstüne çıkardı.\" Bu ayetlerin tefsir kitaplarındaki yorumuna ve inanç alimlerinin bu ayetlere ilişkin yorumlarına atıfta bulunur; özellikle El-Tahawiyya üzerine Şeyh Sefer El-Havali'yi anar; bu ayet değerli ve harika sözler içerir. Bu konuda çalışmalar ve araştırmalar yapılmıştır, lütfen gözden geçirin."
  id: "Seorang penanya ditanya tentang bukti rasional keesaan Allah dari firman Nabi. Dr. Salah Al-Sawy menjawab (Fatwa No. 77699 tanggal 4 Februari 2009) bahwa ada ayat-ayat langsung dalam Kitab Allah yang berkaitan dengan isu ini, seperti ayat: \"Jika ada tuhan di dalamnya selain Allah, mereka akan rusak. Maka kemuliaan bagi Allah, Tuhan Takhta, di atas apa yang mereka gambarkan,\" dan perwiraannya: \"Allah tidak membawa keturunan maupun dewa bersama-Nya. Tiba-tiba, setiap dewa akan binasa bersama apa yang Dia ciptakan, dan mungkin beberapa dari mereka akan bangkit di atas yang lain.\" Ia merujuk pada penafsiran ayat-ayat ini dalam kitab tafsir dan komentar para ulama tentang ayat-ayat tersebut, secara khusus menyebut Sheikh Safar Al-Hawali tentang Al-Tahawiyya, yang memuat kata-kata yang berharga dan indah. Studi dan penelitian telah ditulis mengenai hal ini, jadi silakan tinjau."
