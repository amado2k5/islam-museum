id: work/fatwa-binbaz-joining-the-imam-in-the-last-unit-of-maghrib
class: work
kind: fatwa
label: { ar: "حكم من أدرك الإمام في الركعة الأخيرة", en: "Catching the imam in the last unit of the sunset prayer", ur: "امام کو مغرب کی آخری رکعت میں پانے والے کا حکم" }
summary:
  ar: "سؤال من مصلٍّ أدرك الإمام في الركعة الأخيرة من صلاة المغرب وجلس معه للتشهد، كيف يتم صلاته، أجاب فيه ابن باز بأنه بعد سلام الإمام يأتي بركعة ثانية ثم يجلس بعدها للتشهد الأول، ثم يقوم فيأتي بركعة ثالثة يقرأ فيها الفاتحة، ثم يتشهد ويسلم."
  en: "A question from a worshipper who joined the imam in the last unit of the sunset prayer and sat with him for the final sitting, asking how to complete his prayer; Ibn Baz answered that after the imam's closing salutation he performs a second unit, then sits after it for the first sitting, then rises and performs a third unit reciting al-Fatiha, before the final sitting and salutation."
  ur: "ایک نمازی کا سوال جو مغرب کی نماز میں امام کو آخری رکعت میں ملا اور اس کے ساتھ آخری تشہد میں بیٹھا، کہ وہ اپنی نماز کیسے مکمل کرے؛ ابن باز نے جواب دیا کہ امام کے سلام کے بعد وہ دوسری رکعت ادا کرے، پھر اس کے بعد پہلے تشہد کے لیے بیٹھے، پھر کھڑا ہو کر تیسری رکعت فاتحہ کے ساتھ ادا کرے، پھر تشہد اور سلام کرے۔"
