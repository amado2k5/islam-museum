id: work/fatwa-binbaz-joining-the-imam-in-the-last-unit-of-maghrib
class: work
kind: fatwa
label: { ar: "حكم من أدرك الإمام في الركعة الأخيرة", en: "Catching the imam in the last unit of the sunset prayer", ur: "امام کو مغرب کی آخری رکعت میں پانے والے کا حکم", es: "Captando al imán en la última parte de la oración del atardecer.", fr: "Surprendre l'imam lors de la dernière prière du coucher du soleil", tr: "Son rekâtta imamı yakalayanın hükmü", id: "Keputusan tentang siapa yang berhasil menyusul imam di rak'ah terakhir" }
summary:
  ar: "سؤال من مصلٍّ أدرك الإمام في الركعة الأخيرة من صلاة المغرب وجلس معه للتشهد، كيف يتم صلاته، أجاب فيه ابن باز بأنه بعد سلام الإمام يأتي بركعة ثانية ثم يجلس بعدها للتشهد الأول، ثم يقوم فيأتي بركعة ثالثة يقرأ فيها الفاتحة، ثم يتشهد ويسلم."
  en: "A question from a worshipper who joined the imam in the last unit of the sunset prayer and sat with him for the final sitting, asking how to complete his prayer; Ibn Baz answered that after the imam's closing salutation he performs a second unit, then sits after it for the first sitting, then rises and performs a third unit reciting al-Fatiha, before the final sitting and salutation."
  ur: "ایک نمازی کا سوال جو مغرب کی نماز میں امام کو آخری رکعت میں ملا اور اس کے ساتھ آخری تشہد میں بیٹھا، کہ وہ اپنی نماز کیسے مکمل کرے؛ ابن باز نے جواب دیا کہ امام کے سلام کے بعد وہ دوسری رکعت ادا کرے، پھر اس کے بعد پہلے تشہد کے لیے بیٹھے، پھر کھڑا ہو کر تیسری رکعت فاتحہ کے ساتھ ادا کرے، پھر تشہد اور سلام کرے۔"
  es: "Un fiel que se unió al imán en la última parte de la oración del atardecer y se sentó con él para la última sesión, preguntó cómo completar su oración; Ibn Baz respondió que después del saludo final del imán realiza una segunda parte, luego se sienta para la primera sesión, luego se levanta y realiza una tercera parte recitando al-Fatiha, antes de la última sesión y el saludo."
  fr: "Un fidèle qui avait rejoint l'imam pour la dernière unité de la prière du coucher du soleil et s'était assis avec lui pour la dernière assise demandait comment terminer sa prière; Ibn Baz répondit qu'après la salutation finale de l'imam, il accomplissait une deuxième unité, puis s'asseyait pour la première assise, puis se levait et accomplissait une troisième unité en récitant al-Fatiha, avant la dernière assise et la salutation."
  tr: "Mağrip namazının son rekâtında imamla karşılaşıp teşekhud kılmak için yanında oturan bir ibadet edenin sorusu: namaz nasıl tamamlanır? İbn Baz ise imamın selamından sonra ikinci bir reket kılmalı, sonra ilk teşekhud için oturması, sonra kalkıp üçüncü reket ederek Fetiha okuması, ardından teshehudu okunması ve bitirmesi gerektiğini söyledi."
  id: "Sebuah pertanyaan dari seorang pemuja yang bertemu imam dalam rak'ah terakhir shalat Maghrib dan duduk bersamanya untuk melaksanakan tashahhud: bagaimana solatnya diselesaikan? Ibn Baz menjawab bahwa setelah salam'ah imam, ia harus melakukan rak'ah kedua, lalu duduk untuk tashahyah pertama, kemudian berdiri dan melakukan rak'ah ketiga untuk membaca Al-Fatiha, kemudian membaca tashahyah dan mengakhiri."
