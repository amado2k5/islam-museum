id: work/fatwa-dar-alifta-eg-menses-on-eid-day
class: work
kind: fatwa
label: { ar: "الحكم لو خافت المرأة طروء الحيض عليها في أيام الحج", en: "A woman fearing her menses may come during the Hajj days", ur: "عورت کو حج کے دنوں میں حیض آ جانے کا خوف", es: "Una mujer que teme que le llegue la menstruación durante los días del Hajj.", fr: "Une femme craignant que ses règles ne surviennent pendant le Hajj", tr: "Bir kadının adet görmesinden korkması durumunda karar veriliyor", id: "Putusan adalah jika seorang wanita takut menstruasinya akan terjadi selama hari Haji" }
summary:
  ar: "سائلة تخاف مداهمة الحيض لها يوم النحر فسألت عن الحكم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21891)⁩ أنها إن لم تحض فهي على طهارة وتتم نسكها وتلتزم بمواقيتها المحددة شرعًا على ما فصّل الجواب."
  en: "A woman fearing her menses may come on the day of sacrifice asked the ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21891) answered that if it does not come she is in purity, completes her rites and keeps to their fixed times as prescribed — as the answer details."
  ur: "ایک عورت کو خوف تھا کہ یومِ نحر کو حیض آ جائے؛ اس نے حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21891)⁩ نے جواب دیا کہ اگر حیض نہ آئے تو وہ طہارت کی حالت میں ہے، اپنے مناسک مکمل کرے اور مقررہ اوقات کی پابندی کرے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una mujer que temía que le llegara la menstruación el día del sacrificio consultó sobre el dictamen. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21891) respondió que, si no le llega la menstruación, se encuentra en estado de pureza, completa sus ritos y respeta los horarios establecidos, tal como se detalla en la respuesta."
  fr: "Une femme, craignant que ses menstruations ne surviennent le jour du sacrifice, a consulté la jurisprudence islamique. Le Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21891) a répondu que si ses menstruations ne surviennent pas, elle est en état de pureté, a accompli ses rites et les respecte selon les horaires prescrits, comme le précise la réponse."
  tr: "Kurban gününde adet döneminin onu boğacağından korkan bir soru soran kişi, hükmü sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21891), adet görmezse saf olduğunu, ritüel ritüellerini yerine getirdiğini ve belirlenen zamana uyduğunu yanıtladı; bu soru cevapta ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya yang khawatir menstruasi akan menguasainya pada hari pengorbanan bertanya tentang keputusan tersebut. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21891) menjawab bahwa jika dia tidak menstruasi, dia berada dalam kemurnian, melaksanakan ritualnya, dan mematuhi waktu yang ditentukan sebagaimana dijelaskan dalam jawaban."
