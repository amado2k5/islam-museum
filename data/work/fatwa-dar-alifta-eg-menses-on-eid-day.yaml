id: work/fatwa-dar-alifta-eg-menses-on-eid-day
class: work
kind: fatwa
label: { ar: "الحكم لو خافت المرأة طروء الحيض عليها في أيام الحج", en: "A woman fearing her menses may come during the Hajj days", ur: "عورت کو حج کے دنوں میں حیض آ جانے کا خوف" }
summary:
  ar: "سائلة تخاف مداهمة الحيض لها يوم النحر فسألت عن الحكم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21891)⁩ أنها إن لم تحض فهي على طهارة وتتم نسكها وتلتزم بمواقيتها المحددة شرعًا على ما فصّل الجواب."
  en: "A woman fearing her menses may come on the day of sacrifice asked the ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21891) answered that if it does not come she is in purity, completes her rites and keeps to their fixed times as prescribed — as the answer details."
  ur: "ایک عورت کو خوف تھا کہ یومِ نحر کو حیض آ جائے؛ اس نے حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21891)⁩ نے جواب دیا کہ اگر حیض نہ آئے تو وہ طہارت کی حالت میں ہے، اپنے مناسک مکمل کرے اور مقررہ اوقات کی پابندی کرے — جیسا کہ جواب میں تفصیل ہے۔"
