id: work/al-kashf-an-wujuh-al-qiraat-al-sab
class: work
kind: book
label: { ar: "الكشف عن وجوه القراءات السبع وعللها وحججها", en: "al-Kashf 'an Wujuh al-Qira'at al-Sab' wa-'Ilalihā wa-Hujajihā (Makki)", ur: "الکشف عن وجوہ القراءات السبع و عللہا و حججہا ⁦(مکی)⁩" }
summary:
  ar: "كتاب مكي بن أبي طالب القيسي في توجيه القراءات السبع وتعليلها والاحتجاج لها، وهو شرح لكتابه «التبصرة»، وعدّه السيوطي بين ما أُفرد في توجيه القراءات مع «الحجة» للفارسي و«المحتسب» لابن جني؛ وتنقل مقدمة «النشر» عن مصنَّف ألحقه مكي بـ«الكشف» ضابط ما يُقرأ به من القراءات وما لا يُقرأ {cite:itqan-suyuti p. 536} {cite:nashr-dahman-damascus-1345-v1 p. 23}."
  en: "Makki ibn Abi Talib al-Qaysi's book on the grounds, causes and arguments for the seven readings, a commentary on his own al-Tabsira; al-Suyuti counts it among the books devoted to explaining the readings, with al-Farisi's al-Hujja and Ibn Jinni's al-Muhtasab, and Ibn al-Jazari's Nashr quotes from a treatise Makki appended to the Kashf on which readings may be recited and which may not {cite:itqan-suyuti p. 536} {cite:nashr-dahman-damascus-1345-v1 p. 23}."
  ur: "مکی بن ابی طالب قیسی کی سات قراءتوں کی توجیہ، علل اور حجتوں پر کتاب، جو ان کی اپنی «التبصرہ» کی شرح ہے؛ سیوطی اسے قراءات کی توجیہ کے لیے مخصوص کتابوں میں فارسی کی «الحجۃ» اور ابن جنی کی «المحتسب» کے ساتھ گنتے ہیں، اور «النشر» کا مقدمہ مکی کی اس تحریر سے نقل کرتا ہے جو انہوں نے «الکشف» کے ساتھ ملحق کی اور جس میں بتایا ہے کہ کون سی قراءتیں پڑھی جاتی ہیں اور کون سی نہیں {cite:itqan-suyuti p. 536} {cite:nashr-dahman-damascus-1345-v1 p. 23}۔"
  es: "El libro de Makki ibn Abi Talib al-Qaysi sobre los fundamentos, causas y argumentos de las siete lecturas, un comentario sobre su propio al-Tabsira; al-Suyuti lo cuenta entre los libros dedicados a explicar las lecturas, junto con al-Hujja de al-Farisi y al-Muhtasab de Ibn Jinni, y Nashr de Ibn al-Jazari cita un tratado que Makki adjuntó al Kashf sobre qué lecturas se pueden recitar y cuáles no {cite:itqan-suyuti p. 536} {cite:nashr-dahman-damascus-1345-v1 p. 23}."
  fr: "Le livre de Makki ibn Abi Talib al-Qaysi sur les fondements, les causes et les arguments des sept lectures, un commentaire de son propre al-Tabsira; al-Suyuti le compte parmi les livres consacrés à l'explication des lectures, avec al-Hujja d'al-Farisi et al-Muhtasab d'Ibn Jinni, et Nashr d'Ibn al-Jazari cite un traité que Makki a ajouté au Kashf sur les lectures qui peuvent être récitées et celles qui ne le peuvent pas {cite:itqan-suyuti p. 536} {cite:nashr-dahman-damascus-1345-v1 p. 23}."
