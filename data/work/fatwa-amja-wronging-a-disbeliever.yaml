id: work/fatwa-amja-wronging-a-disbeliever
class: work
kind: fatwa
label: { ar: "ظلم المسلم للكافر يوم القيامة", en: "A Muslim wronging a disbeliever — the reckoning", ur: "مسلمان کا کافر پر ظلم اور قیامت", es: "Un musulmán que perjudica a un infiel: el ajuste de cuentas.", fr: "Un musulman qui fait du tort à un mécréant — le règlement de comptes" }
summary:
  ar: "سأل سائل إذا ظلم المسلم كافرًا هل يؤخذ من حسناته يوم القيامة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81006 بتاريخ 20 فبراير 2010)⁩ أنه من المعلوم شرعًا أنه لا يجوز للمسلم أن يظلم أحدًا سواء كان مسلمًا أم غير مسلم وقد أخبر النبي أن الظلم ظلمات يوم القيامة، أما كيفية الاقتصاص لغير المسلم من المسلم فيترك أمره إلى الله ولا شأن لهم فيه ما لم يرد نص صحيح به وهذا من العلم الذي لا يضر الجهل به، وقد نهينا عن كثرة السؤال."
  en: "A questioner asked whether a Muslim who wrongs a disbeliever loses his good deeds on Judgment Day. Dr. Salah al-Sawi (fatwa no. 81006, 20 February 2010) answered that it is well-established a Muslim may wrong no one, Muslim or not, and the Prophet said wrongdoing is darkness on Judgment Day; as for how restitution is made to a non-Muslim against a Muslim, its matter is left to God since no sound text specifies it — knowledge whose ignorance harms nothing — and we are forbidden excessive questioning. Recorded as AMJA's answer."
  ur: "ایک سائل نے پوچھا کہ مسلمان کافر پر ظلم کرے تو قیامت میں اس کی نیکیاں جاتی ہیں؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81006، 20 فروری 2010)⁩ کے مطابق ظلم ہر کسی پر حرام ہے اور ظلمات ہے؛ مگر انتقام کی تفصیل اللہ پر چھوڑی گئی — اس کا علم نہ ہونا نقصان نہیں۔"
  es: "Un interlocutor preguntó si un musulmán que perjudica a un no creyente pierde sus buenas obras en el Día del Juicio. El Dr. Salah al-Sawi (fatwa n.º 81006, 20 de febrero de 2010) respondió que está bien establecido que un musulmán no puede perjudicar a nadie, sea musulmán o no, y que el Profeta dijo que la injusticia es oscuridad en el Día del Juicio. En cuanto a cómo se realiza la restitución a un no musulmán por un musulmán, es un asunto que se deja en manos de Dios, ya que ningún texto fidedigno lo especifica —un conocimiento cuya ignorancia no perjudica— y nos está prohibido cuestionar en exceso. Registrada como respuesta de AMJA."
  fr: "Un internaute a demandé si un musulman qui commet un tort envers un non-musulman perd ses bonnes actions au Jour du Jugement. Le Dr Salah al-Sawi (fatwa n° 81006, 20 février 2010) a répondu qu'il est bien établi qu'un musulman ne peut faire de tort à personne, musulman ou non, et que le Prophète a dit que le mal est ténèbres au Jour du Jugement. Quant à la manière dont un non-musulman doit réparer le tort causé par un musulman, cela relève de la volonté de Dieu, car aucun texte authentique ne le précise – une connaissance dont l'ignorance ne nuit en rien –, il nous est interdit de poser des questions à l'excès. Cette réponse a été consignée dans la fatwa de l'AMJA."
