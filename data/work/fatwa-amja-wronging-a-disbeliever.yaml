label: { ar: "ظلم المسلم للكافر يوم القيامة", en: "A Muslim wronging a disbeliever — the reckoning", ur: "مسلمان کا کافر پر ظلم اور قیامت" }
summary:
  ar: "سأل سائل إذا ظلم المسلم كافرًا هل يؤخذ من حسناته يوم القيامة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81006 بتاريخ 20 فبراير 2010)⁩ أنه من المعلوم شرعًا أنه لا يجوز للمسلم أن يظلم أحدًا سواء كان مسلمًا أم غير مسلم وقد أخبر النبي أن الظلم ظلمات يوم القيامة، أما كيفية الاقتصاص لغير المسلم من المسلم فيترك أمره إلى الله ولا شأن لهم فيه ما لم يرد نص صحيح به وهذا من العلم الذي لا يضر الجهل به، وقد نهينا عن كثرة السؤال."
  en: "A questioner asked whether a Muslim who wrongs a disbeliever loses his good deeds on Judgment Day. Dr. Salah al-Sawi (fatwa no. 81006, 20 February 2010) answered that it is well-established a Muslim may wrong no one, Muslim or not, and the Prophet said wrongdoing is darkness on Judgment Day; as for how restitution is made to a non-Muslim against a Muslim, its matter is left to God since no sound text specifies it — knowledge whose ignorance harms nothing — and we are forbidden excessive questioning. Recorded as AMJA's answer."
  ur: "ایک سائل نے پوچھا کہ مسلمان کافر پر ظلم کرے تو قیامت میں اس کی نیکیاں جاتی ہیں؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81006، 20 فروری 2010)⁩ کے مطابق ظلم ہر کسی پر حرام ہے اور ظلمات ہے؛ مگر انتقام کی تفصیل اللہ پر چھوڑی گئی — اس کا علم نہ ہونا نقصان نہیں۔"
