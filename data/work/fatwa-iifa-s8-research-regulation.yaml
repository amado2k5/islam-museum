summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: للأمانة العامة عند انتهاء أجل تلقي البحوث الاقتصار على الوارد خلاله دون التزام تجاه ما تأخر، ولا تستقبل بحوثًا يتطوع أصحابها دون استكتاب، وتقتصر المناقشة في الدورة على ما حددته الأمانة على ما فصّل."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) regulating commissioned research: once the submission term ends the secretariat may confine itself to papers received within it; unsolicited papers are not accepted; and session discussion is confined to what the secretariat sets, as detailed."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩: تحقیقی مقالات صرف مدت کے اندر اور صرف سیکرٹریٹ کی دعوت پر قبول ہوں گے؛ بحث کا دائرہ سیکرٹریٹ مقرر کرے گا۔"
  es: "Resolución de la octava sesión de la IIFA (Brunéi, junio de 1993) que regula la investigación por encargo: una vez finalizado el plazo de presentación, la secretaría puede limitarse a los trabajos recibidos dentro de dicho plazo; no se aceptan trabajos no solicitados; y el debate de la sesión se limita a lo que establezca la secretaría, tal como se detalla."
  fr: "Résolution de la huitième session de l'IIFA (Brunei, juin 1993) régissant la recherche commandée: une fois le délai de soumission expiré, le secrétariat peut se limiter aux documents reçus dans ce délai; les documents non sollicités ne sont pas acceptés; et la discussion de la session est limitée à ce que le secrétariat définit, comme détaillé."
