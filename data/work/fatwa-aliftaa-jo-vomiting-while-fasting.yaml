id: work/fatwa-aliftaa-jo-vomiting-while-fasting
class: work
kind: fatwa
label: { ar: "القيء في نهار رمضان", en: "Vomiting during the day in Ramadan", ur: "رمضان کے دن میں قے" }
summary:
  ar: "سؤال عن القيء في نهار رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأن تعمد القيء يفطر، وأن من غلبه القيء لا يفطر ما لم يرجع شيء منه إلى جوفه. أجابت الدائرة بأن تعمد القيء من المفطرات، فمن تقيأ عمدًا أفطر. وقالت إن من غلبه القيء لم يفطر إن لم يرجع شيء منه إلى الجوف، وإلا أفطر. واستندت إلى حديث رواه أبو داود والترمذي يفرّق بين من غلبه القيء فلا قضاء عليه، ومن استقاء عمدًا فعليه القضاء."
  en: "A question about vomiting during the day in Ramadan, in which Jordan's General Iftaa Department answered that deliberate vomiting breaks the fast, while someone overcome by vomiting does not break it unless some of it returns to the interior. The Department answered that deliberately making oneself vomit is among the things that break the fast, so whoever vomits on purpose has broken it. It said that someone overcome by vomiting has not broken the fast if none of it returns to the interior; otherwise he has. It relied on a hadith reported by Abu Dawud and al-Tirmidhi that distinguishes the person overcome by vomiting, who owes no make-up day, from the one who vomits deliberately, who must make the day up."
  ur: "رمضان کے دن میں قے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جان بوجھ کر قے کرنا روزہ توڑ دیتا ہے، جبکہ جس پر قے غالب آ جائے اس کا روزہ نہیں ٹوٹتا جب تک اس کا کچھ حصہ جوف میں واپس نہ جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ جان بوجھ کر قے کرنا روزہ توڑنے والی چیزوں میں سے ہے، چنانچہ جو عمداً قے کرے اس کا روزہ ٹوٹ گیا۔ اس نے کہا کہ جس پر قے غالب آ جائے اس کا روزہ نہیں ٹوٹتا اگر اس کا کچھ حصہ جوف میں واپس نہ جائے، ورنہ ٹوٹ جاتا ہے۔ اس نے ابو داود اور ترمذی کی روایت کردہ ایک حدیث پر انحصار کیا جو اس شخص میں فرق کرتی ہے جس پر قے غالب آ جائے، اس پر قضا نہیں، اور جو جان بوجھ کر قے کرے، اس پر قضا ہے۔"
