id: work/fatwa-aliftaa-jo-vomiting-while-fasting
class: work
kind: fatwa
label: { ar: "القيء في نهار رمضان", en: "Vomiting during the day in Ramadan", ur: "رمضان کے دن میں قے", es: "Vómitos durante el día en Ramadán", fr: "Vomissements en journée pendant le Ramadan" }
summary:
  ar: "سؤال عن القيء في نهار رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأن تعمد القيء يفطر، وأن من غلبه القيء لا يفطر ما لم يرجع شيء منه إلى جوفه. أجابت الدائرة بأن تعمد القيء من المفطرات، فمن تقيأ عمدًا أفطر. وقالت إن من غلبه القيء لم يفطر إن لم يرجع شيء منه إلى الجوف، وإلا أفطر. واستندت إلى حديث رواه أبو داود والترمذي يفرّق بين من غلبه القيء فلا قضاء عليه، ومن استقاء عمدًا فعليه القضاء."
  en: "A question about vomiting during the day in Ramadan, in which Jordan's General Iftaa Department answered that deliberate vomiting breaks the fast, while someone overcome by vomiting does not break it unless some of it returns to the interior. The Department answered that deliberately making oneself vomit is among the things that break the fast, so whoever vomits on purpose has broken it. It said that someone overcome by vomiting has not broken the fast if none of it returns to the interior; otherwise he has. It relied on a hadith reported by Abu Dawud and al-Tirmidhi that distinguishes the person overcome by vomiting, who owes no make-up day, from the one who vomits deliberately, who must make the day up."
  ur: "رمضان کے دن میں قے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جان بوجھ کر قے کرنا روزہ توڑ دیتا ہے، جبکہ جس پر قے غالب آ جائے اس کا روزہ نہیں ٹوٹتا جب تک اس کا کچھ حصہ جوف میں واپس نہ جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ جان بوجھ کر قے کرنا روزہ توڑنے والی چیزوں میں سے ہے، چنانچہ جو عمداً قے کرے اس کا روزہ ٹوٹ گیا۔ اس نے کہا کہ جس پر قے غالب آ جائے اس کا روزہ نہیں ٹوٹتا اگر اس کا کچھ حصہ جوف میں واپس نہ جائے، ورنہ ٹوٹ جاتا ہے۔ اس نے ابو داود اور ترمذی کی روایت کردہ ایک حدیث پر انحصار کیا جو اس شخص میں فرق کرتی ہے جس پر قے غالب آ جائے، اس پر قضا نہیں، اور جو جان بوجھ کر قے کرے، اس پر قضا ہے۔"
  es: "Una pregunta sobre vomitar durante el día en Ramadán, a la que el Departamento General de Iftaa de Jordania respondió que vomitar deliberadamente rompe el ayuno, mientras que quien vomita a propósito no lo rompe a menos que parte del vómito regrese al cuerpo. El Departamento respondió que provocarse el vómito deliberadamente es una de las acciones que rompen el ayuno, por lo que quien vomita a propósito lo rompe. Añadió que quien vomita no rompe el ayuno si no regresa nada del vómito al cuerpo; de lo contrario, sí lo rompe. Se basó en un hadiz narrado por Abu Dawud y al-Tirmidhi que distingue a la persona que vomita, quien no debe recuperar el día, de quien vomita deliberadamente, quien sí debe recuperarlo."
  fr: "Une question concernant les vomissements diurnes pendant le Ramadan a été posée au Département général de la Iftaa en Jordanie. Ce dernier a répondu que vomir volontairement rompt le jeûne, tandis que vomir involontairement ne le rompt pas, sauf si une partie des vomissements est évacuée. Le Département a précisé que le fait de se faire vomir volontairement constitue un acte de rupture du jeûne; par conséquent, quiconque vomit intentionnellement rompt le jeûne. Il a également indiqué que si aucune partie des vomissements n'est évacuée, le jeûne n'est pas rompu; dans le cas contraire, il l'est. Cette réponse s'appuie sur un hadith rapporté par Abou Dawoud et al-Tirmidhi, qui établit une distinction entre la personne victime de vomissements involontaires, qui n'a pas à rattraper le jour manqué, et celle qui vomit volontairement, qui doit rattraper le jour manqué."
