label: { ar: "القرآن بالليتوانية ⁦(سيغيتاس غيدا)⁩", en: "Koranas (literatūrinių prasmių vertimas) (Sigitas Geda)", ur: "کوراناس، لتھوانیائی ترجمہ ⁦(سیگیتاس گیدا)⁩", tr: "Kur'an Litvanca (Sigetas Gida)", id: "Al-Qur'an dalam bahasa Lithuania (Sigetas Gida)" }
summary:
  ar: "أول ترجمة كاملة للقرآن إلى الليتوانية، وضعها الشاعر والمترجم الليتواني سيغيتاس غيدا ونُشرت سنة 2008 في ألف نسخة نفدت سريعًا، معتمدًا في الغالب على الترجمتين الروسيتين لسابلوكوف وكراتشكوفسكي؛ انتقدها ناشطون مسلمون وباحثون لتحويرها ألفاظًا قرآنية، فراجعها مفتي ليتوانيا روماس ياكوباوسكاس، وصدرت طبعة منقّحة سنة 2010 باسمه مترجمًا ثانيًا وبإجازة المفتية."
  en: "The first complete translation of the Qur'an into Lithuanian, by the Lithuanian poet and translator Sigitas Geda, published in 2008 in 1,000 copies that sold quickly and based mainly on the Russian translations of Sablukov and Krachkovsky; criticised by Muslim activists and scholars for distorting Qur'anic terms, it was revised by the mufti of Lithuania, Romas Jakubauskas, and a revised edition appeared in 2010 with him named as second translator and the Muftiate's approval."
  ur: "قرآن کا پہلا مکمل لتھوانیائی ترجمہ، از لتھوانیائی شاعر و مترجم سیگیتاس گیدا، جو 2008 میں ایک ہزار نسخوں میں شائع ہوا اور جلد ختم ہو گیا، زیادہ تر سابلوکوف اور کراچکووسکی کے روسی تراجم پر مبنی؛ مسلم کارکنوں اور محققین نے قرآنی الفاظ کی تحریف پر تنقید کی، تو مفتیِ لتھوانیا روماس یاکوباؤسکاس نے نظرِ ثانی کی، اور 2010 میں ان کے نام کے ساتھ بطور دوسرے مترجم اور دارالافتا کی منظوری سے نظرِ ثانی شدہ اشاعت آئی۔"
  es: "La primera traducción completa del Corán al lituano, realizada por el poeta y traductor lituano Sigitas Geda, se publicó en 2008 en una edición de 1000 ejemplares que se agotaron rápidamente y se basó principalmente en las traducciones rusas de Sablukov y Krachkovsky; criticada por activistas y académicos musulmanes por distorsionar términos coránicos, fue revisada por el muftí de Lituania, Romas Jakubauskas, y una edición revisada apareció en 2010 con él como segundo traductor y la aprobación del Muftiato."
  fr: "La première traduction intégrale du Coran en lituanien, par le poète et traducteur lituanien Sigitas Geda, publiée en 2008 à 1 000 exemplaires qui se sont vendus rapidement et basée principalement sur les traductions russes de Sablukov et Krachkovsky; critiquée par des militants et des érudits musulmans pour avoir déformé les termes coraniques, elle a été révisée par le mufti de Lituanie, Romas Jakubauskas, et une édition révisée est parue en 2010 avec ce dernier nommé comme second traducteur et l’approbation du muftiat."
  tr: "Kur'an'ın Litvancaya ilk tam çevirisi, Litvanyalı şair ve çevirmen Sigittas Gheida tarafından 2008'de bin kopya halinde yayımlandı ve çoğunlukla Sablukov ve Kratchkovsky'nin Rusça çevirilerine dayanarak hızla tükendi; Müslüman aktivistler ve araştırmacılar, Kur'an terimlerini değiştirdiği için eleştirildi, bu yüzden Litvanya Müftüsü Rumas Jakupauskas tarafından gözden geçirildi ve 2010'da müftü'nün izniyle ikinci çevirmen olarak onun adına revize edilmiş bir baskı yayımlandı."
  id: "Terjemahan lengkap pertama Al-Qur'an ke dalam bahasa Lithuania ditulis oleh penyair dan penerjemah Lithuania Sigittas Gheida, diterbitkan pada tahun 2008 dalam seribu eksemplar yang cepat habis terjual, sebagian besar mengandalkan terjemahan Rusia Sablukov dan Kratchkovsky; Aktivis dan peneliti Muslim mengkritiknya karena mengubah istilah Al-Qur'an, sehingga ditinjau oleh Mufti Lithuania, Rumas Jakupauskas, dan edisi revisi diterbitkan pada tahun 2010 atas namanya sebagai penerjemah kedua dengan izin Mufti."
