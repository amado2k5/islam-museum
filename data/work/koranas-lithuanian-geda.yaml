summary:
  ar: "أول ترجمة كاملة للقرآن إلى الليتوانية، وضعها الشاعر والمترجم الليتواني سيغيتاس غيدا ونُشرت سنة 2008 في ألف نسخة نفدت سريعًا، معتمدًا في الغالب على الترجمتين الروسيتين لسابلوكوف وكراتشكوفسكي؛ انتقدها ناشطون مسلمون وباحثون لتحويرها ألفاظًا قرآنية، فراجعها مفتي ليتوانيا روماس ياكوباوسكاس، وصدرت طبعة منقّحة سنة 2010 باسمه مترجمًا ثانيًا وبإجازة المفتية."
  en: "The first complete translation of the Qur'an into Lithuanian, by the Lithuanian poet and translator Sigitas Geda, published in 2008 in 1,000 copies that sold quickly and based mainly on the Russian translations of Sablukov and Krachkovsky; criticised by Muslim activists and scholars for distorting Qur'anic terms, it was revised by the mufti of Lithuania, Romas Jakubauskas, and a revised edition appeared in 2010 with him named as second translator and the Muftiate's approval."
  ur: "قرآن کا پہلا مکمل لتھوانیائی ترجمہ، از لتھوانیائی شاعر و مترجم سیگیتاس گیدا، جو 2008 میں ایک ہزار نسخوں میں شائع ہوا اور جلد ختم ہو گیا، زیادہ تر سابلوکوف اور کراچکووسکی کے روسی تراجم پر مبنی؛ مسلم کارکنوں اور محققین نے قرآنی الفاظ کی تحریف پر تنقید کی، تو مفتیِ لتھوانیا روماس یاکوباؤسکاس نے نظرِ ثانی کی، اور 2010 میں ان کے نام کے ساتھ بطور دوسرے مترجم اور دارالافتا کی منظوری سے نظرِ ثانی شدہ اشاعت آئی۔"
