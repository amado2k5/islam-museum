id: work/fatwa-amja-discharge-or-madhy
class: work
kind: fatwa
label: { ar: "المذي عند البول", en: "A viscous fluid with urine — likely madhy, not a ghusl case", ur: "پیشاب کے وقت مذی — غسل واجب نہیں", es: "Un fluido viscoso con orina; probablemente madhy, no un caso de ghusl.", fr: "Un liquide visqueux contenant de l'urine — probablement de la madhy, pas un cas de ghusl", tr: "idrar", id: "Urin" }
summary:
  ar: "سأل سائل أنه عند عمل الحمام يجد منيًا لزجًا كثيرًا ويريد الصلاة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85958 بتاريخ 20 نوفمبر 2011)⁩ أن من احتلم في نومه ثم رأى الماء في يقظته فإنه يلزمه الاغتسال أما إذا لم ير الماء فلا يلزمه شيء، وأما ما يجده عند البول من سائل لزج فلعله من قبيل المذي وهو ماء رقيق لزج شفاف لا لون له يخرج عند المداعبة أو تذكر الجماع أو إرادته أو النظر أو غير ذلك ويخرج على شكل قطرات وربما لا يحس بخروجه، ويجب التطهر منه بالوضوء والاستنجاء وإن كان لا يوجب الاغتسال على ما فصّل."
  en: "A questioner found much viscous fluid when passing water and wished to pray. Dr. Salah al-Sawi (fatwa no. 85958, 20 November 2011) answered that one who dreams and sees fluid on waking must wash, but one who sees nothing owes nothing; what he finds at urination is most likely madhy — a thin, sticky, colourless fluid that leaves on foreplay, recalling or intending intercourse, looking and the like, coming out in drops he may not feel; purification from it is wudu and istinja, and it does not oblige the washing — as the answer details."
  ur: "ایک سائل نے پیشاب کے وقت لزج سیال پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85958، 20 نومبر 2011)⁩ کے مطابق یہ غالباً مذی ہے — وضو اور استنجاء کافی، غسل نہیں۔"
  es: "Un consultante encontró mucho líquido viscoso al orinar y deseó rezar. El Dr. Salah al-Sawi (fatwa n.° 85958, 20 de noviembre de 2011) respondió que quien sueña y ve líquido al despertar debe lavarse, pero quien no ve nada no tiene obligación de hacerlo; lo que encuentra al orinar es muy probablemente madhy, un líquido fino, pegajoso e incoloro que sale durante los preliminares, al recordar o tener relaciones sexuales, al mirar y cosas por el estilo, en gotas que puede que no sienta; la purificación de este líquido es wudu e istinja, y no obliga a lavarse, como se detalla en la respuesta."
  fr: "Un homme a constaté la présence d'un liquide visqueux en urinant et souhaitait prier. Le Dr Salah al-Sawi (fatwa n° 85958, 20 novembre 2011) a répondu que celui qui rêve et voit du liquide au réveil doit se laver, mais que celui qui ne voit rien n'est pas tenu de se laver; ce qu'il trouve en urinant est très probablement du madhy — un liquide fin, collant et incolore qui s'écoule lors de préliminaires, en pensant à un rapport sexuel, en regardant, etc., et qui sort par gouttes qu'il peut ne pas sentir; la purification de ce liquide est le wudu et l'istinja, et cela n'oblige pas à se laver — comme le précise la réponse."
  tr: "Bir soru soran kişi, yıkanırken çok yapışkan bir meni bulduğu ve namaz kılmak istediği soruldu. Dr. Salah Al-Sawy (20 Kasım 2011 tarihli 85958 Fetva) uykusunda gece rüyası görüp uyanıkken su gören kişinin ghusl yapması gerektiğini yanıtladı. Ama su görmezse, hiç gerek kalmaz. İdrarında bulduğu yapışkan sıvı ise, cinsel ilişki sırasında dışarı çıkan, cinsel ilişki sırasında çıkan ince, yapışkan, şeffaf ve şeffaf bir sıvı türü olabilir; bu su cinsel ilişkiyi, iradesini hatırlatır, ona bakır veya başka şekilde çıkar ve damla olarak çıkar, serbest bırakıldığı hissedilmeyebilir. Kişi kendini wudu ve istinja ile arındırmalıdır, ancak belirtilen açıklamalara göre banyo için ghusl gerekmez."
  id: "Seorang penanya ditanya bahwa saat mandi, ia menemukan air mani yang sangat lengket dan ingin berdoa. Dr. Salah Al-Sawy menjawab (Fatwa No. 85958 tanggal 20 November 2011) bahwa siapa pun yang bermimpi malam saat tidur dan kemudian melihat air saat terjaga harus melakukan ghusl. Namun jika ia tidak melihat air, ia sama sekali tidak diperlukan. Adapun apa yang ia temukan dalam air mata cairan lengket, bisa seperti jenis cairan, yaitu air tipis kental, transparan, tanpa warna, yang keluar saat berhubungan seks, mengingatkan pada hubungan seksual, kehendaknya, melihatnya, atau cara lain, dan keluar sebagai tetesan dan mungkin tidak terasa dilepaskan. Seseorang harus membersihkan diri dari air tersebut dengan wudu dan istinja, meskipun mandi tidak memerlukan ghusl sesuai penjelasan yang ditentukan."
