id: work/fatwa-amja-discharge-or-madhy
class: work
kind: fatwa
label: { ar: "المذي عند البول", en: "A viscous fluid with urine — likely madhy, not a ghusl case", ur: "پیشاب کے وقت مذی — غسل واجب نہیں", es: "Un fluido viscoso con orina; probablemente madhy, no un caso de ghusl." }
summary:
  ar: "سأل سائل أنه عند عمل الحمام يجد منيًا لزجًا كثيرًا ويريد الصلاة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85958 بتاريخ 20 نوفمبر 2011)⁩ أن من احتلم في نومه ثم رأى الماء في يقظته فإنه يلزمه الاغتسال أما إذا لم ير الماء فلا يلزمه شيء، وأما ما يجده عند البول من سائل لزج فلعله من قبيل المذي وهو ماء رقيق لزج شفاف لا لون له يخرج عند المداعبة أو تذكر الجماع أو إرادته أو النظر أو غير ذلك ويخرج على شكل قطرات وربما لا يحس بخروجه، ويجب التطهر منه بالوضوء والاستنجاء وإن كان لا يوجب الاغتسال على ما فصّل."
  en: "A questioner found much viscous fluid when passing water and wished to pray. Dr. Salah al-Sawi (fatwa no. 85958, 20 November 2011) answered that one who dreams and sees fluid on waking must wash, but one who sees nothing owes nothing; what he finds at urination is most likely madhy — a thin, sticky, colourless fluid that leaves on foreplay, recalling or intending intercourse, looking and the like, coming out in drops he may not feel; purification from it is wudu and istinja, and it does not oblige the washing — as the answer details."
  ur: "ایک سائل نے پیشاب کے وقت لزج سیال پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85958، 20 نومبر 2011)⁩ کے مطابق یہ غالباً مذی ہے — وضو اور استنجاء کافی، غسل نہیں۔"
  es: "Un consultante encontró mucho líquido viscoso al orinar y deseó rezar. El Dr. Salah al-Sawi (fatwa n.° 85958, 20 de noviembre de 2011) respondió que quien sueña y ve líquido al despertar debe lavarse, pero quien no ve nada no tiene obligación de hacerlo; lo que encuentra al orinar es muy probablemente madhy, un líquido fino, pegajoso e incoloro que sale durante los preliminares, al recordar o tener relaciones sexuales, al mirar y cosas por el estilo, en gotas que puede que no sienta; la purificación de este líquido es wudu e istinja, y no obliga a lavarse, como se detalla en la respuesta."
