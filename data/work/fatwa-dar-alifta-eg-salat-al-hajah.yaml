id: work/fatwa-dar-alifta-eg-salat-al-hajah
class: work
kind: fatwa
label: { ar: "حكم صلاة الحاجة", en: "The ruling on the prayer of need", ur: "نمازِ حاجت کا حکم", es: "El dictamen sobre la oración de necesidad", fr: "La décision concernant la prière de besoin" }
summary:
  ar: "سائل سأل عن صلاة الحاجة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22483)⁩ أن صلاة الحاجة — وهي ركعتان ثم الدعاء بعدهما لقضاء حاجة الإنسان — من جملة الصلوات المسنونة التي يستحب للمسلم أداؤها عند الحاجة على ما فصّل الجواب من كيفيتها."
  en: "A questioner asked about the prayer of need. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22483) answered that salat al-hajah — two rak'as followed by supplication for one's need — is among the prescribed voluntary prayers a Muslim is recommended to perform at times of need, as the answer details its manner."
  ur: "ایک سائل نے نمازِ حاجت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22483)⁩ نے جواب دیا کہ نمازِ حاجت — دو رکعتیں اور ان کے بعد اپنی ضرورت کے لیے دعا — مستحب نمازوں میں سے ہے جو مسلمان کے لیے ضرورت کے وقت پڑھنا مطلوب ہے، جیسا کہ جواب میں اس کا طریقہ بیان ہے۔"
  es: "Un consultante preguntó sobre la oración de necesidad. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22483) respondió que la salat al-hajah —dos rak'as seguidas de una súplica por la necesidad propia— se encuentra entre las oraciones voluntarias prescritas que se recomienda que un musulmán realice en momentos de necesidad, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la prière en cas de besoin. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22483) a répondu que la salat al-hajah — deux rak'as suivies d'une invocation pour obtenir ce dont on a besoin — figure parmi les prières surérogatoires prescrites qu'il est recommandé aux musulmans d'accomplir en cas de besoin, et la réponse en détaille la manière de les accomplir."
