id: work/fatwa-dar-alifta-eg-stepmothers-mother-mahram
class: work
kind: fatwa
label: { ar: "مدى اعتبار أم زوجة الأب من المحرمات", en: "Is the stepmother's mother among the prohibited-in-marriage?", ur: "کیا سوتیلی ماں کی ماں محرمات میں ہے؟", es: "¿La madre de la madrastra se encuentra entre las personas a las que les está prohibido casarse?", fr: "La mère de la belle-mère fait-elle partie des personnes interdites de mariage ?", tr: "Üvey annenin annesinin ne ölçüde yasak kabul edildiği", id: "Sejauh mana ibu dari ibu tiri dianggap terlarang" }
summary:
  ar: "سائل سأل عن مدى اعتبار أم زوجة الأب من المحرمات. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21866)⁩ أن أم زوجة الأب لا تعد من المحرمات التي يحرم الزواج منها عند انتفاء الموانع ولا حرج من النظر إليها عند الحاجة على ما فصّل الجواب."
  en: "A questioner asked whether the stepmother's mother counts among the prohibited-in-marriage. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21866) answered that she is not among those prohibited in marriage when impediments are absent, and there is no harm in looking at her when needed — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا سوتیلی ماں کی ماں محرمات میں شمار ہوتی ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21866)⁩ نے جواب دیا کہ موانع کے نہ ہونے کی صورت میں وہ ان میں سے نہیں جن سے نکاح حرام ہے اور ضرورت کے وقت اسے دیکھنے میں حرج نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó si la madre de la madrastra se encuentra entre las personas contra las que está prohibido contraer matrimonio. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21866) respondió que no está entre las personas contra las que está prohibido contraer matrimonio cuando no existen impedimentos, y que no hay inconveniente en mirarla cuando sea necesario, como se detalla en la respuesta."
  fr: "Un internaute a demandé si la mère de la belle-mère figurait parmi les personnes interdites au mariage. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21866) a répondu qu'elle n'en faisait pas partie en l'absence d'empêchements et qu'il n'y avait aucun mal à la voir en cas de besoin, comme le précise la réponse."
  tr: "Bir soru soran kişi, babanın kayınvalidesinin ne ölçüde mahram sayıldığını sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21866), üvey annenin mahram sayılmadığını ve engel yoksa onunla evlenmesinin yasak olduğunu, gerektiğinde ona bakmanın zararı olmadığını cevap vermiştir."
  id: "Seorang penanya bertanya sejauh mana ibu mertua ayah dianggap sebagai mahram. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21866) menjawab bahwa ibu tiri tidak dianggap sebagai mahram dan dilarang menikahinya jika tidak ada hambatan, dan tidak ada salahnya melihatnya jika diperlukan, seperti yang dijelaskan dalam jawaban."
