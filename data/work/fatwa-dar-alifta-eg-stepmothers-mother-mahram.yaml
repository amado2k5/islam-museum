class: work
kind: fatwa
label: { ar: "مدى اعتبار أم زوجة الأب من المحرمات", en: "Is the stepmother's mother among the prohibited-in-marriage?", ur: "کیا سوتیلی ماں کی ماں محرمات میں ہے؟" }
summary:
  ar: "سائل سأل عن مدى اعتبار أم زوجة الأب من المحرمات. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21866)⁩ أن أم زوجة الأب لا تعد من المحرمات التي يحرم الزواج منها عند انتفاء الموانع ولا حرج من النظر إليها عند الحاجة على ما فصّل الجواب."
  en: "A questioner asked whether the stepmother's mother counts among the prohibited-in-marriage. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21866) answered that she is not among those prohibited in marriage when impediments are absent, and there is no harm in looking at her when needed — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا سوتیلی ماں کی ماں محرمات میں شمار ہوتی ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21866)⁩ نے جواب دیا کہ موانع کے نہ ہونے کی صورت میں وہ ان میں سے نہیں جن سے نکاح حرام ہے اور ضرورت کے وقت اسے دیکھنے میں حرج نہیں — جیسا کہ جواب میں تفصیل ہے۔"
