label: { ar: "قرار مجمع الفقه الإسلامي الدولي 256 (1/26) بشأن قضايا مستجدة في رعاية الطفولة", en: "IIFA resolution 256 (1/26) on emerging issues in childhood care", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 256 (1/26): طفولت کی دیکھ بھال کے نئے مسائل", es: "Resolución 256 (1/26) de la IIFA sobre cuestiones emergentes en la atención a la infancia.", fr: "Résolution 256 (1/26) de l'IIFA sur les questions émergentes en matière de prise en charge de l'enfance", tr: "Çocuk bakımında ortaya çıkan konulara ilişkin Uluslararası İslami Fiqh Akademisi Kararı 256 (1/26)", id: "Resolusi Akademi Fiqh Islam Internasional 256 (26/1) mengenai isu-isu baru dalam penitipan anak" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة والعشرين بالدوحة ⁦(6–10 ذو القعدة 1446هـ، 4–8 مايو 2025م)⁩. أكد المجمع قراريه السابقين 113 ⁦(7/12)⁩ في حقوق الأطفال والمسنين و213 ⁦(9/22)⁩ في حقوق المعوقين، وحمّل الأسرة والمجتمع والدولة المسؤولية الشرعية والقانونية والإنسانية في رعاية الطفل والحفاظ على هويته. وأوجب حماية الطفل من الابتزاز والتنمر والتحرش اللفظي والجنسي والإلكتروني والتعنيف بمختلف صوره، وبيّن أن حق الوالدين في التأديب المشروع ليس من التعنيف، وأوجب حماية الطفل أثناء النزاعات المسلحة والحروب والكوارث وأماكن اللجوء والنزوح، وحماية هويته الجنسية بما يضمن سلامة فطرته، وتنشئته قيميًا وأخلاقيًا لضمان سلامته الرقمية، وتعزيز الرقابة الأسرية والتربوية والاجتماعية عند استعمال الأجهزة الرقمية، ورعاية ذوي الاحتياجات الخاصة ودمجهم في مجتمعاتهم. وأوصى بتعظيم قيم الإسلام في نفوس الأطفال، وبناء استراتيجية إسلامية شاملة للطفولة، وإنشاء أدلة إرشادية للعاملين في حمايته، وإيجاد أوقاف لذوي الاحتياجات الخاصة، وعقد ورش وندوات لتوعية الآباء وعن حماية الأطفال أثناء الكوارث والنزاعات."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 26th session in Doha (6–10 Dhu al-Qa'da 1446, 4–8 May 2025). It reaffirmed its earlier resolutions 113 (7/12) on the rights of children and the elderly and 213 (9/22) on the rights of persons with disabilities, and placed the sharia, legal and humanitarian responsibility for the child's care and identity on the family, society and state. It ruled that the child must be protected from blackmail, bullying, verbal, sexual and electronic harassment and all forms of abuse; that the parents' right to lawful discipline is not abuse; that children must be protected during armed conflicts, wars, disasters and in places of refuge and displacement; that the child's gender identity must be protected to safeguard the natural disposition; that children must be raised on values and ethics for their digital safety, with stronger family, educational and social oversight of device use; and that persons with special needs must be cared for and integrated into their communities. It recommended instilling Islamic values in children, a comprehensive Islamic childhood strategy for Muslim states, guidance manuals for child-protection workers, dedicated awqaf for persons with special needs, and workshops and seminars for parents and on protecting children in disasters and conflicts."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چھبیس ویں مجلس ⁦(6–10 ذی قعدہ 1446ھ، 4–8 مئی 2025ء)⁩ میں۔ اکیڈمی نے اپنی سابقہ قراردادیں 113 ⁦(7/12)⁩ ⁦(بچوں اور بزرگوں کے حقوق)⁩ اور 213 ⁦(9/22)⁩ ⁦(معذوروں کے حقوق)⁩ کی تائید کی اور بچے کی دیکھ بھال اور شناخت کے تحفظ کی شرعی، قانونی اور انسانی ذمہ داری خاندان، معاشرے اور ریاست پر عاید کی۔ اس نے بچے کو بلیک میلنگ، گھٹانا ⁦(بلینگ)⁩، زبانی، جنسی اور الیکٹرانک ہراسانی اور ہر قسم کے تشدد سے بچانے کا حکم دیا؛ قرار دیا کہ والدین کا جائز تادیبی حق تشدد نہیں؛ مسلح تنازعوں، جنگوں، آفات اور پناہ و بے گھری کی جگہوں پر بچے کے تحفظ کو لازم قرار دیا؛ فطرت کی حفاظت کے لیے اس کی جنسی شناخت کے تحفظ کو لازم قرار دیا؛ ڈیجیٹل حفاظت کے لیے اقدار و اخلاق پر تربیت اور آلات کے استعمال پر خاندانی، تربیتی اور سماجی نگرانی کے تقویت کو قرار دیا؛ اور خصوصی ضروریات والے افراد کی دیکھ بھال اور سماجی شمولیت کو لازم قرار دیا۔ سفارشات میں بچوں میں اسلامی اقدار کی تعظیم، مسلم ممالک کے لیے جامع اسلامی طفولت حکمتِ عملی، حفاظت کارکنوں کے لیے رہنما کتابچے، خصوصی ضروریات والوں کے لیے مخصوص اوقاف، اور والدین کی آگہی اور آفات و تنازعوں میں بچوں کے تحفظ کے سیمینار شامل ہیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 26.ª sesión en Doha (6-10 Dhu al-Qa'da 1446, 4-8 de mayo de 2025). Reafirmó sus resoluciones anteriores 113 (7/12) sobre los derechos de los niños y los ancianos y 213 (9/22) sobre los derechos de las personas con discapacidad, y puso la responsabilidad sharia, legal y humanitaria del cuidado e identidad del niño en la familia, la sociedad y el estado. Dictaminó que el niño debe ser protegido del chantaje, el acoso, el acoso verbal, sexual y electrónico y todas las formas de abuso; que el derecho de los padres a la disciplina legal no es abuso; que los niños deben ser protegidos durante los conflictos armados, las guerras, los desastres y en los lugares de refugio y desplazamiento; que la identidad de género del niño debe ser protegida para salvaguardar la disposición natural; que los niños deben ser educados en valores y ética para su seguridad digital, con una supervisión familiar, educativa y social más fuerte del uso de dispositivos; Asimismo, recomendó que las personas con necesidades especiales recibieran atención y se integraran en sus comunidades. Se recomendó inculcar valores islámicos en los niños, una estrategia integral islámica para la infancia en los estados musulmanes, manuales de orientación para los trabajadores de protección infantil, fundaciones religiosas (awqaf) específicas para personas con necesidades especiales, y talleres y seminarios para padres sobre la protección de la infancia en situaciones de desastre y conflicto."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 26e session à Doha (6-10 Dhu al-Qa'da 1446, soit 4-8 mai 2025) a réaffirmé ses résolutions antérieures 113 (7/12) relative aux droits des enfants et des personnes âgées et 213 (9/22) relative aux droits des personnes handicapées. Elle a également attribué la responsabilité, au regard de la charia, du droit et des principes humanitaires, de la protection de l'enfant et de son identité à la famille, à la société et à l'État. L'Académie a statué que l'enfant doit être protégé du chantage, du harcèlement (verbal, sexuel et électronique) et de toute forme de maltraitance; que le droit des parents à une discipline légitime ne constitue pas une maltraitance; que les enfants doivent être protégés lors de conflits armés, de guerres, de catastrophes et dans les lieux de refuge et de déplacement; que l'identité de genre de l'enfant doit être protégée afin de préserver son orientation naturelle; que les enfants doivent être élevés dans le respect des valeurs et de l'éthique en matière de sécurité numérique, avec un encadrement familial, éducatif et social renforcé de l'utilisation des appareils numériques; et que les personnes ayant des besoins spécifiques doivent être prises en charge et intégrées à leur communauté. Il recommandait d'inculquer des valeurs islamiques aux enfants, une stratégie islamique globale pour l'enfance dans les États musulmans, des manuels d'orientation pour les travailleurs sociaux chargés de la protection de l'enfance, des awqaf dédiés aux personnes ayant des besoins spéciaux, ainsi que des ateliers et des séminaires pour les parents sur la protection des enfants en cas de catastrophes et de conflits."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Doha'daki 26. oturumunda (6–10 Dhu al-Qi'dah 1446 H, 4–8 Mayıs 2025) ortak kararı. Akademi, çocukların ve yaşlıların haklarına ilişkin önceki 113 (7/12) ve engelli kişilerin haklarına ilişkin 213 (9/22) sayılı kararlarını onaylamış, aileyi, toplumu ve devleti çocuğun bakımından dini, hukuki ve insani sorumluluktan sorumlu tutmaktadır. Çocukların şantaj, zorbalık, sözlü, cinsel ve elektronik taciz ile her türlü şiddet biçiminden korunmasını zorunlu kıldı. Ebeveynlerin disiplin hakkının istismardan kaynaklanmadığını netleştirdi. Silahlı çatışmalar, savaşlar, felaketler, sığınma yerleri ve yerinden edilme ortamlarında çocukların korunmasını, doğal doğalarının bütünlüğünü sağlamak için cinsel kimliklerinin korunmasını, dijital bütünlüklerini garanti altına almak için ahlaki ve ahlaki olarak yetiştirilmelerini, dijital cihazlar kullanılırken aile, eğitim ve sosyal denetimin artırılmasını, özel ihtiyaçları olan kişilerin bakımını ve topluluklarına entegrasyonunu önerdi. Çocuklarda İslam'ın değerlerinin yüceltilmesini, çocukluk için kapsamlı bir İslami strateji oluşturulmasını, koruma alanında çalışanlar için rehber kitapların oluşturulmasını, özel ihtiyaçları olan kişiler için vakıfların kurulmasını ve afet ve çatışmalar sırasında çocukların korunması konusunda ebeveynler arasında farkındalık yaratmak için atölye çalışmaları ve seminerler düzenlenmesini tavsiye etti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-26 di Doha (6–10 Dhu al-Qi'dah 1446 H, 4–8 Mei 2025). Akademi menegaskan resolusi sebelumnya 113 (7/12) tentang hak anak dan lansia serta 213 (9/22) tentang hak penyandang disabilitas, dengan memegang keluarga, masyarakat, dan negara bertanggung jawab atas tanggung jawab agama, hukum, dan kemanusiaan dalam merawat anak dan menjaga identitas mereka. Undang-undang ini mewajibkan perlindungan anak dari pemerasan, perundungan, pelecehan verbal, seksual, dan elektronik, serta segala bentuk kekerasan. Undang-undang ini menegaskan bahwa hak sah orang tua atas disiplin bukanlah dari kekerasan. Undang-undang ini mewajibkan perlindungan anak selama konflik bersenjata, perang, bencana, tempat perlindungan, dan pengungsian, menjaga identitas seksual mereka untuk memastikan integritas sifat alami, membesarkan mereka secara moral dan moral untuk menjamin integritas digital mereka, meningkatkan pengawasan keluarga, pendidikan, dan sosial saat menggunakan perangkat digital, serta merawat orang berkebutuhan khusus dan mengintegrasikan mereka ke dalam komunitas mereka. Laporan ini merekomendasikan untuk menungkit nilai-nilai Islam pada anak-anak, membangun strategi Islam yang komprehensif untuk masa kanak-kanak, menetapkan buku panduan bagi mereka yang bekerja dalam perlindungannya, mendirikan dana abadi bagi orang berkebutuhan khusus, serta mengadakan lokakarya dan seminar untuk meningkatkan kesadaran di kalangan orang tua tentang perlindungan anak selama bencana dan konflik."
