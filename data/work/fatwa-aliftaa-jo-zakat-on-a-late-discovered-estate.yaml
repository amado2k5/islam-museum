id: work/fatwa-aliftaa-jo-zakat-on-a-late-discovered-estate
class: work
kind: fatwa
label: { ar: "زكاة أموال الميت المكتشفة بعد سنين", en: "Zakat on a dead man's wealth discovered years later", ur: "برسوں بعد دریافت ہونے والے میت کے مال کی زکوٰۃ" }
summary:
  ar: "سؤال عن أموال وأسهم لميت اكتُشفت بعد خمس عشرة سنة من وفاته، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأحوط زكاتها عن السنين الماضية على قول الشافعية، مع ذكر قول المالكية باستقبال حول جديد. بدأت الدائرة بأن الزكاة ركن من أركان الإسلام، تجب في المال إذا بلغ النصاب وحال عليه الحول، ويُزكّى كل سنة قمرية. وقالت إن الزكاة تجب في كل مال مملوك علم صاحبه بملكه أم لم يعلم، فلا يعفي الجهل به من زكاة ما مضى، لأن الملك لم ينقطع طوال تلك السنين، ونقلت عن الخطيب الشربيني في مغني المحتاج أن المال المغصوب والضائع والمدفون المنسي يُزكّى إذا عاد للأعوام الماضية. ونقلت عن المالكية، من الشرح الكبير للدردير وحاشية الدسوقي، أن المال الموروث الذي لم يُعلم به لا زكاة فيه لما مضى، فإذا قُبض استُقبل به حول جديد. وخلصت إلى أن على الورثة عند الشافعية زكاة الأسهم والمال وأرباحه عن السنين الماضية عند قبضه، وهو الأحوط، ومن أخذ بقول المالكية رُجي له القبول. ونبهت إلى أن الأرباح إن كانت من مصرف ربوي وجب التصدق بها كلها والتخلص من الأسهم المحرمة، وإن كان المصرف إسلاميًا فلا حرج في تملكها مع زكاتها."
  en: "A question on bank funds and shares belonging to a man discovered fifteen years after his death, in which Jordan's General Iftaa Department answered that the more cautious course is to pay zakat for the past years on the Shafi'i view, while also reporting the Maliki view that a new year begins. The Department began by saying that zakat is a pillar of Islam, due on wealth that reaches the minimum threshold and is held for a full year, and paid every lunar year. It said zakat is due on all owned wealth whether or not the owner knew of it, so ignorance does not excuse the past years, since ownership never lapsed in that time, quoting al-Khatib al-Shirbini's Mughni al-Muhtaj that seized, lost or forgotten buried wealth is taxed for the past years once recovered. It reported the Maliki view, from al-Dardir's al-Sharh al-Kabir with al-Dasuqi's gloss, that inherited wealth no one knew of owes nothing for past years, and a new zakat year starts once it is received. It concluded that on the Shafi'i view the heirs owe zakat on the shares, money and profits for the past years once received, which is the more cautious course, and that whoever follows the Maliki view may hope for acceptance. It added that if the profits came from an interest-based bank they must all be given away in charity and forbidden shares disposed of, while profits from an Islamic bank may be kept, with zakat paid on them."
  ur: "ایک شخص کی وفات کے پندرہ سال بعد دریافت ہونے والی بینک رقوم اور حصص کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ شافعیہ کے قول پر گزشتہ برسوں کی زکوٰۃ دینا زیادہ احتیاط ہے، اور مالکیہ کا قول بھی بیان کیا کہ نیا سال شروع ہوتا ہے۔ ڈیپارٹمنٹ نے آغاز میں کہا کہ زکوٰۃ اسلام کا رکن ہے، جو نصاب کو پہنچنے والے اور سال بھر رکھے گئے مال پر واجب ہوتی ہے اور ہر قمری سال ادا کی جاتی ہے۔ اس نے کہا کہ زکوٰۃ ہر مملوکہ مال پر واجب ہے چاہے مالک کو علم ہو یا نہ ہو، لہٰذا لاعلمی گزشتہ برسوں سے معاف نہیں کرتی کیونکہ اس دوران ملکیت ختم نہیں ہوئی، اور خطیب شربینی کی مغنی المحتاج سے نقل کیا کہ غصب شدہ، گم شدہ یا بھولا ہوا دفن مال واپس ملنے پر گزشتہ برسوں کی زکوٰۃ دی جاتی ہے۔ اس نے مالکیہ کا قول، دردیر کی الشرح الکبیر اور حاشیہ دسوقی سے، نقل کیا کہ جس موروثی مال کا علم نہ ہو اس پر گزشتہ برسوں کی زکوٰۃ نہیں، اور وصولی پر نیا سال شروع ہوتا ہے۔ اس نے نتیجہ نکالا کہ شافعیہ کے نزدیک ورثہ پر وصولی کے وقت حصص، رقم اور منافع کی گزشتہ برسوں کی زکوٰۃ ہے، جو زیادہ احتیاط ہے، اور جو مالکیہ کے قول پر عمل کرے اس کے لیے قبولیت کی امید ہے۔ اس نے مزید کہا کہ اگر منافع سودی بینک سے ہوں تو سب صدقہ کرنا اور حرام حصص سے چھٹکارا پانا لازم ہے، اور اسلامی بینک کے منافع رکھے جا سکتے ہیں، ان کی زکوٰۃ کے ساتھ۔"
