id: work/fatwa-dar-alifta-consolation-gift-for-a-wife-divorced-for-harm
class: work
kind: fatwa
label: { ar: "حكم نفقة المتعة لمن طلبت الطلاق للضرر", en: "The consolation gift (mut'a) for a wife who sought divorce because of harm", ur: "ضرر کی وجہ سے طلاق کا مطالبہ کرنے والی بیوی کے لیے متعہ کا حکم" }
summary:
  ar: "سؤال عن امرأة أقامت دعوى تطلب الطلاق من زوجها للضرر، هل تستحق متعة الطلاق أم يُعدّ طلبها رضا بالطلاق يسقط حقها فيها، أجابت فيه دار الإفتاء المصرية بأن متعة الطلاق مال يدفعه الزوج لمطلقته بعد الدخول، وهي نفقة سنتين على الأقل بحسب حال الزوج يسرًا أو عسرًا، يُرجع في تقديرها إلى التراضي أو إلى القضاء، ويشترط لها ألا يكون الطلاق من قِبل المرأة ولا بسببها، فإذا كان برضاها سقطت، أما إذا كان بناءً على طلبها لتضررها فلا تسقط لانتفاء معنى الرضا. بيّنت الدار معنى المتعة بما في شرح الخرشي ومغني المحتاج، وأنها واجبة اتفاقًا للمطلقة قبل الدخول التي لم يُسمّ لها مهر، ومستحبة في غيرها عند جمهور الحنفية والمالكية والحنابلة في رواية، وواجبة عند الشافعية وفي قول لأحمد اختاره ابن تيمية، وأن مقدارها يُراعى فيه حال الزوج بنص آية البقرة، وأن المذاهب الأربعة نصت على سقوطها بكل فرقة من قِبل المرأة أو بسببها كالخلع، ناقلة عن الكاساني وابن جزي والرافعي وابن قدامة، وأحالت إلى المادة 18 مكرر من القانون 25 لسنة 1929 المضافة بالقانون 100 لسنة 1985 التي توجب للمطلقة بغير رضاها متعة لا تقل عن نفقة سنتين، وإلى حكم النقض المصري سنة 1997 بأن لجوء الزوجة إلى القاضي للتطليق للضرر لا يتوافر به الرضا بالطلاق."
  en: "A question about a woman who brought a case before the judge seeking divorce from her husband for harm, and whether she is entitled to the consolation gift (mut'a) after divorce or whether her request counts as consent to the divorce that forfeits it; Dar al-Ifta al-Misriyya answered that the mut'a is money a husband pays to a wife he divorces after consummation, amounting to at least two years' maintenance according to his means, assessed by agreement or, in dispute, by the court, and that it is conditional on the divorce not coming from the wife or being caused by her, so that if the divorce was with her consent it lapses, but if it came at her request because she was harmed it does not lapse, since the consent that forfeits it is absent. Dar al-Ifta explained the meaning of the mut'a from al-Kharashi's commentary and Mughni al-Muhtaj; that it is obligatory by agreement for a woman divorced before consummation with no dower named, recommended in other cases according to the majority of Hanafis, Malikis and Hanbalis in one report, and obligatory according to the Shafi'is and in a view of Ahmad chosen by Ibn Taymiyya; that its amount depends on the husband's means by the text of the verse of al-Baqara; and that the four schools hold it to lapse in any separation that comes from the wife or is caused by her, such as khul', quoting al-Kasani, Ibn Juzayy, al-Rafi'i and Ibn Qudama. It referred to article 18 bis of Law 25 of 1929, added by Law 100 of 1985, which grants a wife divorced without her consent a mut'a of at least two years' maintenance, and to a 1997 ruling of the Egyptian Court of Cassation that a wife's resort to the judge for divorce on grounds of harm does not amount to consent to the divorce."
  ur: "ایک عورت کے بارے میں سوال جس نے قاضی کے سامنے ضرر کی وجہ سے شوہر سے طلاق کا مقدمہ دائر کیا، کہ کیا وہ طلاق کے بعد متعہ کی حق دار ہے یا اس کا مطالبہ طلاق پر رضامندی شمار ہو کر اس کا حق ساقط کر دیتا ہے؛ دار الافتاء مصر نے جواب دیا کہ متعۂ طلاق وہ مال ہے جو شوہر رخصتی کے بعد طلاق دی گئی بیوی کو ادا کرتا ہے، جو شوہر کی آسودگی یا تنگی کے مطابق کم سے کم دو سال کے نفقے کے برابر ہے، جس کا تعین باہمی رضامندی سے یا تنازع کی صورت میں عدالت سے ہوتا ہے، اور اس کی شرط یہ ہے کہ طلاق عورت کی طرف سے یا اس کے سبب نہ ہو، لہٰذا اگر طلاق اس کی رضامندی سے ہو تو متعہ ساقط ہے، لیکن اگر اس کے ضرر کی وجہ سے اس کے مطالبے پر ہو تو ساقط نہیں کیونکہ ساقط کرنے والی رضامندی موجود نہیں۔ دار الافتاء نے متعہ کا معنی خرشی کی شرح اور مغنی المحتاج سے بیان کیا؛ یہ کہ رخصتی سے پہلے طلاق دی گئی عورت کے لیے جس کا مہر مقرر نہ ہوا بالاتفاق واجب ہے، باقی صورتوں میں حنفیہ، مالکیہ اور ایک روایت میں حنابلہ کے جمہور کے نزدیک مستحب اور شافعیہ اور احمد کے ایک قول میں جسے ابن تیمیہ نے اختیار کیا واجب ہے؛ اس کی مقدار سورہ بقرہ کی آیت کی نص سے شوہر کی حالت پر منحصر ہے؛ اور چاروں مذاہب نے عورت کی طرف سے یا اس کے سبب ہونے والی ہر جدائی جیسے خلع میں اس کے سقوط کی تصریح کی، کاسانی، ابن جزی، رافعی اور ابن قدامہ سے نقل کرتے ہوئے۔ اس نے 1929 کے قانون 25 کی دفعہ 18 مکرر کا حوالہ دیا جو 1985 کے قانون 100 سے شامل کی گئی اور بغیر رضامندی طلاق دی گئی بیوی کو کم سے کم دو سال کے نفقے کا متعہ دیتی ہے، اور مصری عدالتِ نقض کے 1997 کے فیصلے کا کہ بیوی کا ضرر کی بنا پر طلاق کے لیے قاضی سے رجوع طلاق پر رضامندی نہیں۔"
