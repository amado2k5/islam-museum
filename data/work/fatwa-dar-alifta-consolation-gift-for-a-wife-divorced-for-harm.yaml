id: work/fatwa-dar-alifta-consolation-gift-for-a-wife-divorced-for-harm
class: work
kind: fatwa
label: { ar: "حكم نفقة المتعة لمن طلبت الطلاق للضرر", en: "The consolation gift (mut'a) for a wife who sought divorce because of harm", ur: "ضرر کی وجہ سے طلاق کا مطالبہ کرنے والی بیوی کے لیے متعہ کا حکم", es: "El regalo de consuelo (mut'a) para una esposa que solicitó el divorcio debido a un daño.", fr: "Le don de consolation (mut'a) pour une épouse qui a demandé le divorce en raison d'un préjudice", tr: "Zarar nedeniyle boşanma talebinde bulunan birine geçici nafaka kararı", id: "Putusan tentang tunjangan sementara bagi seseorang yang mengajukan perceraian karena kerugian" }
summary:
  ar: "سؤال عن امرأة أقامت دعوى تطلب الطلاق من زوجها للضرر، هل تستحق متعة الطلاق أم يُعدّ طلبها رضا بالطلاق يسقط حقها فيها، أجابت فيه دار الإفتاء المصرية بأن متعة الطلاق مال يدفعه الزوج لمطلقته بعد الدخول، وهي نفقة سنتين على الأقل بحسب حال الزوج يسرًا أو عسرًا، يُرجع في تقديرها إلى التراضي أو إلى القضاء، ويشترط لها ألا يكون الطلاق من قِبل المرأة ولا بسببها، فإذا كان برضاها سقطت، أما إذا كان بناءً على طلبها لتضررها فلا تسقط لانتفاء معنى الرضا. بيّنت الدار معنى المتعة بما في شرح الخرشي ومغني المحتاج، وأنها واجبة اتفاقًا للمطلقة قبل الدخول التي لم يُسمّ لها مهر، ومستحبة في غيرها عند جمهور الحنفية والمالكية والحنابلة في رواية، وواجبة عند الشافعية وفي قول لأحمد اختاره ابن تيمية، وأن مقدارها يُراعى فيه حال الزوج بنص آية البقرة، وأن المذاهب الأربعة نصت على سقوطها بكل فرقة من قِبل المرأة أو بسببها كالخلع، ناقلة عن الكاساني وابن جزي والرافعي وابن قدامة، وأحالت إلى المادة 18 مكرر من القانون 25 لسنة 1929 المضافة بالقانون 100 لسنة 1985 التي توجب للمطلقة بغير رضاها متعة لا تقل عن نفقة سنتين، وإلى حكم النقض المصري سنة 1997 بأن لجوء الزوجة إلى القاضي للتطليق للضرر لا يتوافر به الرضا بالطلاق."
  en: "A question about a woman who brought a case before the judge seeking divorce from her husband for harm, and whether she is entitled to the consolation gift (mut'a) after divorce or whether her request counts as consent to the divorce that forfeits it; Dar al-Ifta al-Misriyya answered that the mut'a is money a husband pays to a wife he divorces after consummation, amounting to at least two years' maintenance according to his means, assessed by agreement or, in dispute, by the court, and that it is conditional on the divorce not coming from the wife or being caused by her, so that if the divorce was with her consent it lapses, but if it came at her request because she was harmed it does not lapse, since the consent that forfeits it is absent. Dar al-Ifta explained the meaning of the mut'a from al-Kharashi's commentary and Mughni al-Muhtaj; that it is obligatory by agreement for a woman divorced before consummation with no dower named, recommended in other cases according to the majority of Hanafis, Malikis and Hanbalis in one report, and obligatory according to the Shafi'is and in a view of Ahmad chosen by Ibn Taymiyya; that its amount depends on the husband's means by the text of the verse of al-Baqara; and that the four schools hold it to lapse in any separation that comes from the wife or is caused by her, such as khul', quoting al-Kasani, Ibn Juzayy, al-Rafi'i and Ibn Qudama. It referred to article 18 bis of Law 25 of 1929, added by Law 100 of 1985, which grants a wife divorced without her consent a mut'a of at least two years' maintenance, and to a 1997 ruling of the Egyptian Court of Cassation that a wife's resort to the judge for divorce on grounds of harm does not amount to consent to the divorce."
  ur: "ایک عورت کے بارے میں سوال جس نے قاضی کے سامنے ضرر کی وجہ سے شوہر سے طلاق کا مقدمہ دائر کیا، کہ کیا وہ طلاق کے بعد متعہ کی حق دار ہے یا اس کا مطالبہ طلاق پر رضامندی شمار ہو کر اس کا حق ساقط کر دیتا ہے؛ دار الافتاء مصر نے جواب دیا کہ متعۂ طلاق وہ مال ہے جو شوہر رخصتی کے بعد طلاق دی گئی بیوی کو ادا کرتا ہے، جو شوہر کی آسودگی یا تنگی کے مطابق کم سے کم دو سال کے نفقے کے برابر ہے، جس کا تعین باہمی رضامندی سے یا تنازع کی صورت میں عدالت سے ہوتا ہے، اور اس کی شرط یہ ہے کہ طلاق عورت کی طرف سے یا اس کے سبب نہ ہو، لہٰذا اگر طلاق اس کی رضامندی سے ہو تو متعہ ساقط ہے، لیکن اگر اس کے ضرر کی وجہ سے اس کے مطالبے پر ہو تو ساقط نہیں کیونکہ ساقط کرنے والی رضامندی موجود نہیں۔ دار الافتاء نے متعہ کا معنی خرشی کی شرح اور مغنی المحتاج سے بیان کیا؛ یہ کہ رخصتی سے پہلے طلاق دی گئی عورت کے لیے جس کا مہر مقرر نہ ہوا بالاتفاق واجب ہے، باقی صورتوں میں حنفیہ، مالکیہ اور ایک روایت میں حنابلہ کے جمہور کے نزدیک مستحب اور شافعیہ اور احمد کے ایک قول میں جسے ابن تیمیہ نے اختیار کیا واجب ہے؛ اس کی مقدار سورہ بقرہ کی آیت کی نص سے شوہر کی حالت پر منحصر ہے؛ اور چاروں مذاہب نے عورت کی طرف سے یا اس کے سبب ہونے والی ہر جدائی جیسے خلع میں اس کے سقوط کی تصریح کی، کاسانی، ابن جزی، رافعی اور ابن قدامہ سے نقل کرتے ہوئے۔ اس نے 1929 کے قانون 25 کی دفعہ 18 مکرر کا حوالہ دیا جو 1985 کے قانون 100 سے شامل کی گئی اور بغیر رضامندی طلاق دی گئی بیوی کو کم سے کم دو سال کے نفقے کا متعہ دیتی ہے، اور مصری عدالتِ نقض کے 1997 کے فیصلے کا کہ بیوی کا ضرر کی بنا پر طلاق کے لیے قاضی سے رجوع طلاق پر رضامندی نہیں۔"
  es: "Una pregunta sobre una mujer que presentó una demanda ante el juez solicitando el divorcio de su esposo por daños y perjuicios, y si tiene derecho al regalo de consuelo (mut'a) después del divorcio o si su solicitud cuenta como consentimiento al divorcio que lo pierde; Dar al-Ifta al-Misriyya respondió que el mut'a es dinero que un esposo paga a una esposa de la que se divorcia después de la consumación, equivalente a al menos dos años de manutención según sus posibilidades, evaluado por acuerdo o, en caso de disputa, por el tribunal, y que está condicionado a que el divorcio no provenga de la esposa ni sea causado por ella, de modo que si el divorcio fue con su consentimiento, caduca, pero si se produjo a petición de ella porque fue perjudicada, no caduca, ya que no existe el consentimiento que lo pierde. Dar al-Ifta explicó el significado del mut'a a partir del comentario de al-Kharashi y Mughni al-Muhtaj; que es obligatorio por acuerdo para una mujer divorciada antes de la consumación sin dote nombrada, recomendado en otros casos según la mayoría de los Hanafi, Maliki y Hanbali en un informe, y obligatorio según los Shafi'i y en una opinión de Ahmad elegida por Ibn Taymiyya; que su cantidad depende de los medios del marido según el texto del versículo de al-Baqara; y que las cuatro escuelas sostienen que caduca en cualquier separación que provenga de la esposa o sea causada por ella, como el khul', citando a al-Kasani, Ibn Juzayy, al-Rafi'i e Ibn Qudama. Se remitió al artículo 18 bis de la Ley 25 de 1929, añadido por la Ley 100 de 1985, que concede a la mujer divorciada sin su consentimiento una pensión compensatoria de al menos dos años, y a una sentencia de 1997 del Tribunal de Casación egipcio que establece que el recurso de la mujer al juez para solicitar el divorcio por motivos de perjuicio no equivale a consentimiento al divorcio."
  fr: "Une question a été posée concernant une femme ayant saisi le juge pour divorcer de son mari pour préjudice moral. Elle se demandait si elle avait droit à la dot (mut'a) après le divorce ou si sa demande valait consentement au divorce, entraînant la perte de ce droit. Dar al-Ifta al-Misriyya a répondu que la mut'a est une somme d'argent versée par un mari à son épouse après consommation du mariage. Cette somme correspond à au moins deux années de pension alimentaire, calculée selon ses ressources et fixée par accord mutuel ou, en cas de litige, par le tribunal. Le versement de la mut'a est subordonné à la condition que le divorce ne soit ni à l'initiative de l'épouse ni provoqué par elle. Ainsi, si le divorce a été prononcé avec son consentement, la dot est caduque. En revanche, si le divorce a été prononcé à sa demande pour cause de préjudice moral, la dot n'est pas caduque, faute de consentement. Dar al-Ifta a expliqué la signification de la mut'a en s'appuyant sur le commentaire d'al-Kharashi et sur le Mughni al-Muhtaj. qu'elle est obligatoire par accord pour une femme divorcée avant la consommation du mariage sans dot mentionnée, recommandée dans d'autres cas selon la majorité des écoles hanafite, malikite et hanbalite dans un hadith, et obligatoire selon les shafi'ites et selon un avis d'Ahmad repris par Ibn Taymiyya; que son montant dépend des ressources du mari selon le texte du verset d'al-Baqara; et que les quatre écoles considèrent qu'elle disparaît en cas de séparation à l'initiative de l'épouse ou causée par elle, comme le khul', citant al-Kasani, Ibn Juzayy, al-Rafi'i et Ibn Qudama. Elle faisait référence à l'article 18 bis de la loi 25 de 1929, ajouté par la loi 100 de 1985, qui accorde à une épouse divorcée sans son consentement une mut'a d'au moins deux ans d'entretien, et à un arrêt de 1997 de la Cour de cassation égyptienne selon lequel le recours d'une épouse au juge pour divorcer pour cause de préjudice ne vaut pas consentement au divorce."
  tr: "Kocasından zarar talebinde bulunan bir kadın hakkında bir soru. Boşanma hakkı mı vardır, yoksa talebi boşanma rızası olarak kabul edilip boşanma hakkı mı kaybedilir? Mısır Dar al-Ifta, boşanmanın faydasının, kocanın evlenmeden sonra eski eşine ödediği para olduğunu belirtmiştir. Durumuna bağlı olarak en az iki yıl nafakadır, kolay mı zor mu olsun. Değerlendirmesi karşılıklı rızaya veya yargıya bağlıdır ve boşanmanın kadın tarafından ya da onun yüzünden başlatılmaması şart koşuldur. Eğer onun rızasıyla yapılmışsa, feragat edilir. Ancak zarar nedeniyle talep edilmişse, rıza anlamı olmadığı için feragat edilmez. Ev, mut'ah (geçici evlilik) anlamını Şerh-el-Harşi ve Mughni al-Muhtac'ta açıklamış, boşanmış bir kadının ceyizi verilmemiş olması için anlaşma ile zorunlu olduğunu belirtmiştir. Hanefi, Maliki ve Hanbalilerin çoğunluğuna göre diğer durumlarda bir rivayete göre, Şafi'lere göre ve İbn Teymiye tarafından seçilen Ahmed tarafından da bu önerilidir. Miktarı, El-Bekarah ayetine göre kocanın durumunu dikkate alır ve dört mezhebin belirttiğini belirtir e, kadın tarafından veya onun yüzünden herhangi bir mezhep tarafından sona erdirildiğini, örneğin khul'a, al-Kasani, İbn Cuzayy, el-Rafi'i ve İbn Kudame'den alıntı yapmaktadır. Bu karar, 1985 tarihli 100 sayılı Kanun ile eklenen 1929 tarihli 25 sayılı Kanun'un 18 bis maddesine atıfta bulunuyor ve boşanmış kadının rızası olmadan en az iki yıl süren bir mut'ah (mut'ah) ile 1997'de Mısır Yargıtayı kararına atıfta bulunuyordu; bu karar bir kadının zarar için boşanma için hakime başvurmasının boşanma rızası anlamına gelmediğini belirtti."
  id: "Pertanyaan tentang seorang wanita yang mengajukan gugatan untuk meminta perceraian dari suaminya atas kerugian yang dilakukan. Apakah dia berhak atas manfaat perceraian, atau jika permohonannya dianggap sebagai persetujuan perceraian dan haknya hilang? Dar al-Ifta Mesir menjawab bahwa manfaat perceraian adalah uang yang dibayarkan suami kepada mantan istrinya setelah penyelesaian. Ini adalah tunjangan setidaknya dua tahun tergantung pada situasi suami, apakah mudah atau sulit. Penilaiannya bergantung pada persetujuan bersama atau peradilan, dan ditetapkan bahwa perceraian tidak boleh diprakarsai oleh wanita atau karena dia. Jika dengan persetujuannya, perceraian dibatalkan. Namun jika didasarkan pada permintaannya karena kerugian yang dirugikan, maka tidak dibatalkan karena tidak adanya makna persetujuan. Dewan memperjelas makna mut'ah (pernikahan sementara) sebagaimana dijelaskan dalam Sharh al-Kharshi dan Mughni al-Muhtaj, menyatakan bahwa ini wajib berdasarkan kesepakatan bagi wanita yang bercerai sebelum pernikahan yang belum diberikan mas kawin. Dalam kasus lain disarankan menurut mayoritas Hanafi, Maliki, dan Hanbali menurut satu narasi, dan wajib menurut Shafi'i, serta menurut pandangan Ahmad yang dipilih oleh Ibn Taymiyyah. Jumlahnya mempertimbangkan kondisi suami menurut ayat Al-Baqarah, dan bahwa keempat aliran pemikiran menetapkan bahwa dihentikan oleh sekte mana pun oleh wanita tersebut atau karena dirinya, seperti khul'a, mengutip dari al-Kasani, Ibn Juzayy, al-Rafi'i, dan Ibn Qudamah. Surat ini merujuk pada Pasal 18 bis Undang-Undang 25 tahun 1929, ditambahkan oleh Undang-Undang 100 tahun 1985, yang mewajibkan wanita yang bercerai tanpa persetujuannya untuk menjalani mut'ah (mut'ah) dengan biaya tunjangan tidak kurang dari dua tahun, dan pada putusan Kasasi Mesir tahun 1997 bahwa permohonan seorang istri ke hakim untuk perceraian atas kerugian tidak merupakan persetujuan perceraian."
