label: { ar: "قرار مجمع الفقه الإسلامي الدولي 209 (22/5) بشأن حقوق وواجبات المواطنين غير المسلمين في الدول الإسلامية ومدى تطبيق أحكام الشريعة الإسلامية عليهم", en: "IIFA resolution 209 (22/5) on the rights and duties of non-Muslim citizens in Islamic states and the extent of applying Islamic sharia rulings to them", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 209 (22/5): اسلامی ریاستوں میں غیر مسلم شہریوں کے حقوق و فرائض اور ان پر شریعتِ اسلامی کے احکام کے اطلاق کی حد", es: "Resolución 209 (22/5) de la IIFA sobre los derechos y deberes de los ciudadanos no musulmanes en los estados islámicos y el alcance de la aplicación de las normas islámicas de la sharia a los mismos." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩. قرر المجمع: أولًا أن الشريعة الإسلامية تكفل لغير المسلمين المقيمين في الدولة الإسلامية حقوقهم العامة والخاصة التي تكفلها للمسلمين، فلهم ما للمسلمين المواطنين وعليهم ما عليهم وهم متساوون في الحقوق والواجبات. ثانيًا لهم حق تحكيم شريعتهم في عباداتهم وأحوالهم الشخصية، ويجوز تعيين قاض منهم للحكم فيما بينهم وتنفذ الدولة أحكامه، وفيما عدا ذلك يطبق قانون الدولة. ثالثًا يجب على غير المسلمين المقيمين في البلاد الإسلامية ما يجب على المسلمين من مراعاة النظام العام والآداب العامة في الدولة وعدم ارتكاب ما يخالفه، وأن يكون ولاؤهم للدولة التي يقيمون بها وينتسبون إليها. رابعًا على وسائل الإعلام بأنواعها الاهتمام ببيان حقوق غير المسلمين في الدولة الإسلامية التي تكفلها الشريعة لهم نشرًا للثقافة الإسلامية وإظهارًا لسماحة الإسلام وعدله وإبراز ذلك في المناهج الدراسية. خامسًا على وسائل الإعلام بأنواعها عدم إثارة الفتن والنعرات الطائفية بين الفئات المختلفة في المجتمع حفاظًا على أمن البلاد."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015). It ruled: first, Islamic sharia guarantees non-Muslims resident in the Islamic state their public and private rights as it guarantees them for Muslims — they have what Muslim citizens have and owe what they owe, equal in rights and duties. Second, they have the right to refer their worship and personal status to their own religious law, and a judge from among them may be appointed to rule between them, whose rulings the state executes; beyond that the state's law applies. Third, non-Muslims resident in Islamic countries owe what Muslims owe: observing the public order and public morals of the state, not committing what contravenes them, and loyalty to the state in which they reside and to which they belong. Fourth, the media of all kinds are to attend to expounding the rights Islamic sharia guarantees non-Muslims in the Islamic state, spreading Islamic culture, showing Islam's tolerance and justice, and presenting this in school curricula. Fifth, the media are not to stir up discord and sectarian strife among the different groups of society, preserving the country's security."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ میں۔ اکیڈمی نے فیصلہ دیا: پہلا، شریعتِ اسلامی اسلامی ریاست میں مقیم غیر مسلموں کے لیے ان کے عام اور خاص حقوق کی ضمانت دیتی ہے جو وہ مسلمانوں کے لیے دیتی ہے — ان کے لیے وہی ہے جو مسلم شہریوں کے لیے اور ان پر وہی ہے جو ان پر — وہ حقوق و فرائض میں برابر ہیں۔ دوسرا، ان کو اپنی عبادات اور احوالِ شخصی میں اپنی شریعت کو حاکم بنانے کا حق ہے، اور ان میں سے قاضی مقرر کیا جا سکتا ہے جو ان کے درمیان فیصلہ کرے اور ریاست اس کے فیصلے نافذ کرے؛ اس کے علاوہ ریاست کا قانون لاگو ہوگا۔ تیسرا، اسلامی ممالک میں مقیم غیر مسلموں پر وہی فرائض ہیں جو مسلمانوں پر ہیں: ریاست کے عوامی نظم اور عوامی آداب کی رعایت اور اس کے خلاف کچھ نہ کرنا، اور اس ریاست سے وفاداری جس میں وہ مقیم ہیں اور جس سے ان کا تعلق ہے۔ چوتھا، ذرائع ابلاغ ہر قسم کے غیر مسلموں کے ان حقوق کی وضاحت پر توجہ دیں جو شریعتِ اسلامی ان کے لیے ضمانت دیتی ہے — اسلامی ثقافت کے پھیلاؤ، اسلام کی رواداری اور عدل کے اظہار کے لیے — اور اسے تعلیمی نصاب میں نمایاں کریں۔ پانچواں، ذرائع ابلاغ معاشرے کے مختلف گروہوں کے درمیان فتنہ اور فرقہ وارانہ تعصبات نہ بھڑکائیں تاکہ ملک کی امنیت محفوظ رہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 22.ª sesión en Kuwait (2-5 de Jumada al-Akhira de 1436, 22-25 de marzo de 2015). En ella se dictaminó: primero, la sharia islámica garantiza a los no musulmanes residentes en el Estado islámico sus derechos públicos y privados, al igual que a los musulmanes: poseen los mismos derechos y obligaciones que los ciudadanos musulmanes, en igualdad de derechos y deberes. Segundo, tienen derecho a regir su culto y su situación personal por su propia ley religiosa, y se puede nombrar un juez de entre ellos para que dicte sentencia, cuyas resoluciones ejecuta el Estado; más allá de eso, se aplica la ley estatal. Tercero, los no musulmanes residentes en países islámicos tienen las mismas obligaciones que los musulmanes: observar el orden público y la moral pública del Estado, no cometer actos que los contravengan y ser leales al Estado en el que residen y al que pertenecen. En cuarto lugar, los medios de comunicación de todo tipo deben dedicarse a difundir los derechos que la sharia islámica garantiza a los no musulmanes en el Estado islámico, a promover la cultura islámica, a mostrar la tolerancia y la justicia del Islam, y a incluir estos valores en los planes de estudio escolares. En quinto lugar, los medios de comunicación no deben incitar a la discordia ni a la confrontación sectaria entre los diferentes grupos de la sociedad, preservando así la seguridad del país."
