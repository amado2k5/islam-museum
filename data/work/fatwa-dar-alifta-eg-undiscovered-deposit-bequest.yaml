label: { ar: "حكم ضمان الوديعة التي أوصى بها المتوفى قبل موته ولم يجدها الورثة", en: "Liability for a deposit the deceased disclosed but the heirs could not find", ur: "متوفی کے بتائی امانت کی ضمانت جو ورثاء کو نہ ملی" }
summary:
  ar: "سائل سأل عن وديعة تركها ابن عم المتوفى عنده ليحفظها إلى حين عودته من سفره وأخبر الرجل أولاده بها قبل وفاته ثم لم يجدوها بعد موته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21638)⁩ ببيان حكم ضمان تلك الوديعة على ما فصّل الجواب."
  en: "A questioner asked about a deposit the deceased's cousin left with him for safekeeping until his return from travel; the man told his sons of it before his death, then they could not find it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21638) answered by setting out the ruling on liability for that deposit."
  ur: "ایک سائل نے ایسی امانت کا حکم پوچھا جو مرنے والے کے چچا زاد نے سفر سے واپسی تک اس کے پاس رکھی؛ اس نے اپنی وفات سے پہلے بیٹوں کو بتا دیا لیکن بعد میں وہ نہ ملی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21638)⁩ نے جواب میں اس امانت کی ضمانت کا حکم بیان کیا۔"
