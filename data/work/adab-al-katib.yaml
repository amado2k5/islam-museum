summary:
  ar: "لأبي محمد عبد الله بن مسلم المعروف بابن قتيبة النحوي المتوفى سنة ٢٧٠هـ؛ قيل: هو خطبة بلا كتاب لطول خطبته مع أنه قد حوى من كل شيء {cite:kashf-zunun-furqan p. 267}."
  en: "Ibn Qutayba's Adab al-Katib — the training manual of the state secretariat; 'a sermon without a book', said to hold a little of everything {cite:kashf-zunun-furqan p. 267}."
  es: "Adab al-Katib de Ibn Qutayba — el manual de capacitación de la secretaría de estado; 'un sermón sin libro', que se dice que contiene un poco de todo {cite:kashf-zunun-furqan p. 267}."
  fr: "L'Adab al-Katib d'Ibn Qutayba — le manuel de formation du secrétariat d'État; « un sermon sans livre », censé contenir un peu de tout {cite:kashf-zunun-furqan p. 267}."
  ur: "ابن قتیبہ کا ادب الکاتب - ریاستی سیکرٹریٹ کا تربیتی کتابچہ؛ 'کتاب کے بغیر ایک خطبہ'، ہر چیز کا تھوڑا سا رکھنے کے لیے کہا۔ 267}۔"
  tr: "270 Hicri'de ölen dilbilgici İbn Kuteybe olarak bilinen Ebu Muhammed Abdullah ibn Müslim'in vaazının kitabı olmadığı söylenir; vaazın uzunluğu nedeniyle kitabı olmayan bir vaaz olduğu söylenir, oysa her şeyi içeriyordu {atıf:kaşf-zunun-furqan, s. 267}."
  id: "Oleh Abu Muhammad Abdullah ibn Muslim, yang dikenal sebagai Ibn Qutaybah, ahli tata bahasa yang meninggal pada tahun 270 H; dikatakan bahwa ini adalah khotbah tanpa buku karena panjang khotbahnya, meskipun berisi semuanya {cite:kashf-zunun-furqan, hlm. 267}."
