summary:
  ar: "ورقة للدكتور منير فريد في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشرت نوفمبر 2021)⁩ تعرض التحليل الفقهي لإثبات بداية رمضان بالحساب الفلكي كما في بحث الدكتور مختار المغرباوي وما فيه من تأويلات النصوص على ما فصّلته الورقة."
  en: "A paper by Dr. Muneer Fareed on the Fiqh Council of North America site (published November 2021) presenting the fiqh analysis of fixing Ramadan's start by astronomical determination, following Dr. Mukhtar Maghraoui's study and its interpretations of the texts — as the paper details."
  ur: "ڈاکٹر منیر فرید کی تحریر فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ نومبر 2021)⁩ رمضان کے آغاز کے فلکی تعین کا فقہی تجزیہ — جیسا کہ تحریر میں تفصیل ہے۔"
  es: "Un artículo del Dr. Muneer Fareed publicado en el sitio web del Consejo de Fiqh de América del Norte (en noviembre de 2021) presenta el análisis fiqh de la fijación del inicio del Ramadán mediante determinación astronómica, siguiendo el estudio del Dr. Mukhtar Maghraoui y sus interpretaciones de los textos, como se detalla en el artículo."
  fr: "Un article du Dr Muneer Fareed sur le site du Conseil Fiqh d'Amérique du Nord (publié en novembre 2021) présente l'analyse fiqh de la fixation du début du Ramadan par détermination astronomique, suivant l'étude du Dr Mukhtar Maghraoui et ses interprétations des textes — comme le détaille l'article."
  tr: "Dr. Munir Farid'in Kuzey Amerika Fıkra Konseyi web sitesinde yayımlanan (Kasım 2021'de yayımlanan) makalesi, Dr. Mukhtar Al-Maghrabawi'nin araştırmasında olduğu gibi astronomik hesaplamalarla Ramazan'ın başlangıcını kanıtlamak için yapılan fikıh analizini ve makalede ayrıntılı olarak metinlerin yorumlarını tartışmaktadır."
  id: "Sebuah makalah oleh Dr. Munir Farid di situs web Dewan Yurisprudensi Amerika Utara (diterbitkan November 2021) membahas analisis yurisprudensi untuk membuktikan awal Ramadan melalui perhitungan astronomi, seperti dalam penelitian Dr. Mukhtar Al-Maghrabawi dan interpretasi teks-teks yang dirinci dalam makalah tersebut."
