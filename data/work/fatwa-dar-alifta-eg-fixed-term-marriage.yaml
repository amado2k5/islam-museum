id: work/fatwa-dar-alifta-eg-fixed-term-marriage
class: work
kind: fatwa
label: { ar: "حكم اشتراط مدة معينة في عقد الزواج", en: "Stipulating a fixed term in the marriage contract", ur: "نکاح کے عقد میں معین مدت کی شرط", es: "Estipular un plazo fijo en el contrato matrimonial.", fr: "Prévoir une durée fixe dans le contrat de mariage" }
summary:
  ar: "سائل سأل عن اشتراط مدة معينة في عقد الزواج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22026)⁩ أن الأصل في عقد الزواج أن يكون مطلقًا غير مقيد بمدة وتقييده بمدة يناقض مقاصد النكاح ويخرجه عن كونه عقدًا صحيحًا على ما فصّل الجواب."
  en: "A questioner asked about stipulating a fixed term in the marriage contract. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22026) answered that the default for the marriage contract is to be unrestricted, not limited to a term; restricting it to a term that ends the contract contradicts the aims of marriage and takes it out of being a valid contract — as the answer details."
  ur: "ایک سائل نے نکاح کے عقد میں معین مدت کی شرط کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22026)⁩ نے جواب دیا کہ اصولاً نکاح کا عقد غیر مقید ہوتا ہے؛ مدت کی قید جو عقد کو ختم کر دے نکاح کے مقاصد کے خلاف ہے اور اسے صحیح عقد سے خارج کرتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de estipular un plazo fijo en el contrato matrimonial. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22026) respondió que, por defecto, el contrato matrimonial debe ser irrestricto, no limitado a un plazo; restringirlo a un plazo que ponga fin al contrato contradice los objetivos del matrimonio y lo invalida, como se detalla en la respuesta."
  fr: "Une question a été posée concernant la possibilité de stipuler une durée fixe dans un contrat de mariage. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22026) a répondu que, par défaut, un contrat de mariage est sans restriction, sans limitation de durée; le restreindre à une durée qui y met fin contredit les objectifs du mariage et le prive de sa validité, comme le précise la réponse."
