summary:
  ar: "كتاب بالإنجليزية لشيلا بلير وجوناثان بلوم عن فنون العالم الإسلامي وعمارته من 1250 إلى 1800، صدر عن مطبعة جامعة ييل سنة 1994 في سلسلة «بيليكان لتاريخ الفن» تكملةً لمجلد إتينغهاوزن وغرابار."
  en: "An English book by Sheila S. Blair and Jonathan M. Bloom on the art and architecture of the Islamic lands from 1250 to 1800, published by Yale University Press in 1994 in the Pelican History of Art as the sequel to Ettinghausen and Grabar's volume."
  ur: "شیلا بلیئر اور جوناتھن بلوم کی انگریزی کتاب جو 1250 سے 1800ء تک عالمِ اسلام کے فن اور فنِ تعمیر پر ہے؛ ییل یونیورسٹی پریس سے 1994ء میں «پیلیکن ہسٹری آف آرٹ» سلسلے میں ایٹنگ ہاؤزن اور گرابار کی جلد کے تسلسل کے طور پر شائع ہوئی۔"
  fr: "The Art and Architecture of Islam, 1250–1800 de Sheila S. Blair et Jonathan M. Bloom passe en revue l'architecture et les arts des pays d'islam traditionnels, des conquêtes mongoles du début du XIIIe siècle à l'arrivée de la domination coloniale européenne au XIXe. La présentation de l'éditeur relève que presque tous les chefs-d'œuvre de l'art islamique, comme l'Alhambra, le Taj Mahal et le Shahnama de Shah Tahmasp, datent de cette période."
  es: "The Art and Architecture of Islam, 1250–1800, de Sheila S. Blair y Jonathan M. Bloom, recorre la arquitectura y las artes de las tierras islámicas tradicionales desde las conquistas mongolas de comienzos del siglo XIII hasta la llegada del dominio colonial europeo en el XIX. La presentación de la editorial señala que casi todas las obras maestras del arte islámico, como la Alhambra, el Taj Mahal y el Shahnama de Shah Tahmasp, se produjeron en este período."
  tr: "The Art and Architecture of Islam, 1250–1800, Sheila Blair ve Jonathan Bloom'un, XIII. yüzyıl başındaki Moğol istilasından XIX. yüzyılda Avrupa sömürge yönetiminin gelişine kadar geleneksel İslam topraklarının sanatını ve mimarisini ele alan kitabıdır. Yayıncının tanıtımına göre Elhamra, Tac Mahal ve Şah Tahmasb Şehnâmesi gibi İslam sanatının başyapıtlarının neredeyse tamamı bu dönemde üretilmiştir."
  id: "The Art and Architecture of Islam, 1250–1800 karya Sheila Blair dan Jonathan Bloom menelaah seni dan arsitektur negeri-negeri Islam tradisional sejak invasi Mongol pada awal abad ketiga belas hingga datangnya kekuasaan kolonial Eropa pada abad kesembilan belas. Menurut deskripsi penerbit, hampir semua mahakarya seni Islam, seperti Alhambra, Taj Mahal, dan Shahnama Syah Tahmasp, dihasilkan pada masa ini."
