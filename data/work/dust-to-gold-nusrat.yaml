label: { ar: "Dust to Gold ⁦(من التراب إلى الذهب)⁩", en: "Dust to Gold (Nusrat Fateh Ali Khan album)", ur: "ڈسٹ ٹو گولڈ", es: "De polvo a oro (álbum de Nusrat Fateh Ali Khan)", fr: "De la poussière à l'or (album de Nusrat Fateh Ali Khan)" }
summary:
  ar: "ألبوم قوالي لنصرت فتح علي خان سُجّل سنة 1997 مع فرقته على الطريقة التقليدية وصدر بعد وفاته سنة 2000 عن ريل وورلد، بأربع قصائد طويلة منها «خواجة تم ہی ہو» و«نور خدا ہے حسن سراپا رسول»؛ رأى النقاد فيه توازنا بين حرية الارتجال وضبطه، وإن بدا في صوته أثر المرض."
  en: "A qawwali album by Nusrat Fateh Ali Khan, recorded in 1997 with his ensemble in traditional form and released posthumously by Real World in 2000, with four long pieces, among them 'Khawaja tum hi ho' and 'Noor-e-khuda hai husn-e-sarapa rasool'; critics heard a balance of improvisational freedom and control, though his voice showed strain."
  ur: "نصرت فتح علی خان کا قوالی البم، 1997 میں روایتی انداز میں ریکارڈ ہوا اور ان کی وفات کے بعد 2000 میں ریئل ورلڈ سے جاری ہوا؛ اس میں «خواجہ تم ہی ہو» اور «نورِ خدا ہے حسنِ سراپا رسول» سمیت چار طویل کلام ہیں۔"
  es: "Un álbum de qawwali de Nusrat Fateh Ali Khan, grabado en 1997 con su conjunto en formato tradicional y publicado póstumamente por Real World en 2000, con cuatro piezas largas, entre ellas 'Khawaja tum hi ho' y 'Noor-e-khuda hai husn-e-sarapa rasool'; los críticos percibieron un equilibrio entre la libertad de improvisación y el control, aunque su voz mostraba tensión."
  fr: "Un album de qawwali de Nusrat Fateh Ali Khan, enregistré en 1997 avec son ensemble dans une forme traditionnelle et publié à titre posthume par Real World en 2000, avec quatre longs morceaux, parmi lesquels « Khawaja tum hi ho » et « Noor-e-khuda hai husn-e-sarapa rasool »; les critiques ont perçu un équilibre entre liberté d'improvisation et contrôle, bien que sa voix ait montré des signes de tension."
