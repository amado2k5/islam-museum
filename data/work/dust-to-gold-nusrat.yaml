summary:
  ar: "ألبوم قوالي لنصرت فتح علي خان سُجّل سنة 1997 مع فرقته على الطريقة التقليدية وصدر بعد وفاته سنة 2000 عن ريل وورلد، بأربع قصائد طويلة منها «خواجة تم ہی ہو» و«نور خدا ہے حسن سراپا رسول»؛ رأى النقاد فيه توازنا بين حرية الارتجال وضبطه، وإن بدا في صوته أثر المرض."
  en: "A qawwali album by Nusrat Fateh Ali Khan, recorded in 1997 with his ensemble in traditional form and released posthumously by Real World in 2000, with four long pieces, among them 'Khawaja tum hi ho' and 'Noor-e-khuda hai husn-e-sarapa rasool'; critics heard a balance of improvisational freedom and control, though his voice showed strain."
  ur: "نصرت فتح علی خان کا قوالی البم، 1997 میں روایتی انداز میں ریکارڈ ہوا اور ان کی وفات کے بعد 2000 میں ریئل ورلڈ سے جاری ہوا؛ اس میں «خواجہ تم ہی ہو» اور «نورِ خدا ہے حسنِ سراپا رسول» سمیت چار طویل کلام ہیں۔"
