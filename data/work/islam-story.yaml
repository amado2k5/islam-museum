summary:
  ar: "موقع تاريخ إسلامي يشرف عليه الداعية والمؤرخ المصري راغب السرجاني، يعرض التاريخ والسيرة والحضارة الإسلامية من السيرة النبوية إلى العصر الحديث في مقالات ودراسات وكتب وصوتيات ومرئيات وخرائط، مع تراجم ومعلومات عن بلدان العالم الإسلامي المعاصرة، بالعربية وعدة لغات أخرى."
  en: "An Islamic history site supervised by the Egyptian preacher and historian Ragheb el-Sergani, presenting Islamic history, the Sira and civilisation from the Prophet's life to modern times in articles, studies, books, audio, video and maps, with biographies and information on today's Muslim countries, in Arabic and several other languages."
  ur: "اسلامی تاریخ کی سائٹ جس کی نگرانی مصری داعی اور مؤرخ راغب السرجانی کرتے ہیں؛ سیرت سے جدید دور تک اسلامی تاریخ اور تہذیب کو مضامین، دراسات، کتابوں، صوتیات، ویڈیو اور نقشوں میں، تراجم اور معاصر مسلم ممالک کی معلومات کے ساتھ، عربی اور کئی دوسری زبانوں میں پیش کرتی ہے۔"
