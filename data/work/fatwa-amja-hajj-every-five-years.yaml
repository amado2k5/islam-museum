id: work/fatwa-amja-hajj-every-five-years
class: work
kind: fatwa
label: { ar: "حديث الحج كل خمس سنين", en: "The hadith of Hajj every five years — its bearing", ur: "ہر پانچ سال حج کی حدیث", es: "El hadiz del Hajj cada cinco años: su significado", fr: "Le hadith du Hajj tous les cinq ans — sa portée", tr: "Her beş yılda bir Hac hadisi", id: "Hadis Haji setiap lima tahun" }
summary:
  ar: "سأل سائل عن حديث إن عبدا صححت له جسمه ووسعت عليه في المعيشة تمضي عليه خمسة أعوام لا يفد إليَّ لمحروم رواه أبو سعيد وأبو هريرة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76955 بتاريخ 27 نوفمبر 2008)⁩ أنه يستفاد منه إن صح أنه لا ينبغي للصحيح الموسر أن يترك الحج خمس سنين وقال المنذري بعد إيراده في الترغيب رواه ابن حبان في صحيحه والبيهقي وكان حسن بن حي يعجبه وبه يأخذ ويحب للموسر الصحيح ألا يترك الحج خمس سنين، ولكن يشوش على هذا أن النبي صح عنه أنه لما ذكر الحج قال له الأقرع بن حابس أفي كل عام يا رسول الله قال لو قلت نعم لوجبت الحج مرة فما زاد فهو تطوع."
  en: "A questioner asked about the hadith that a servant given health of body and ease of living who lets five years pass without coming to God is deprived, narrated from Abu Sa'id and Abu Hurayra. Dr. Salah al-Sawi (fatwa no. 76955, 27 November 2008) answered that were it sound it would mean the healthy well-off man should not leave Hajj five years — al-Mundhiri citing it in al-Targhib via Ibn Hibban's Sahih and al-Bayhaqi, and al-Hasan ibn Hayy approving it — but its use is troubled by the sound report of al-Aqra' ibn Habis asking 'every year, Messenger of God?' and hearing 'had I said yes it would have been binding — Hajj is once; beyond that is voluntary'."
  ur: "ایک سائل نے «پانچ سال حج نہ کرنے والا محروم ہے» کی حدیث پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76955، 27 نومبر 2008)⁩ کے مطابق صحت پر اختلاف ہے اور اقرع بن حابس کی روایت اس کے مطلق معنی کو محدود کرتی ہے — حج عمر میں ایک بار ہے۔"
  es: "Un consultante preguntó sobre el hadiz que dice que un siervo dotado de salud física y facilidad de vida que deja pasar cinco años sin acudir a Dios queda privado, narrado por Abu Sa'id y Abu Hurayra. El Dr. Salah al-Sawi (fatwa n.º 76955, 27 de noviembre de 2008) respondió que, de ser cierto, significaría que el hombre sano y acomodado no debería dejar de hacer el Hajj durante cinco años —al-Mundhiri lo cita en al-Targhib a través del Sahih de Ibn Hibban y al-Bayhaqi, y al-Hasan ibn Hayy lo aprueba—, pero su uso se ve cuestionado por el relato fidedigno de al-Aqra' ibn Habis preguntando \"¿cada año, Mensajero de Dios?\" y escuchando \"si hubiera dicho que sí, habría sido obligatorio; el Hajj es una sola vez; más allá de eso es voluntario\"."
  fr: "Un interrogateur a posé une question concernant le hadith selon lequel un serviteur jouissant d'une bonne santé et d'une vie confortable qui laisse passer cinq années sans se rendre à Dieu est déchu de ses obligations. Ce hadith, rapporté par Abu Sa'id et Abu Hurayra, a été examiné par le Dr Salah al-Sawi (fatwa n° 76955, 27 novembre 2008). Il a répondu que, si ce hadith était authentique, il signifierait qu'un homme en bonne santé et aisé ne devrait pas manquer le Hajj pendant cinq ans – al-Mundhiri le citant dans al-Targhib via le Sahih d'Ibn Hibban et al-Bayhaqi, et al-Hasan ibn Hayy l'approuvant – mais son application est contestée par le hadith authentique d'al-Aqra' ibn Habis demandant: « Chaque année, Messager de Dieu ? » et entendant: « Si j'avais répondu oui, cela aurait été obligatoire. Le Hajj est un pèlerinage unique; au-delà, il est facultatif. »"
  tr: "Bir soru soran, bedeni sağlıklı ve geçim süresi beş yıl uzatılmış bir köle hakkında bir hadis soruldu ve bu hadis bana yoksul bir kişi için gelmedi. Ebu Said ve Ebu Huraira tarafından rivayet edilmiştir. Dr. Salah Al-Sawi (27 Kasım 2008 tarihli 76955 No'lu fetva) şöyle yanıtladı: Buradan, zengin bir kişinin beş yıl boyunca Hacı terk etmemesi gerektiği anlaşılmaktadır. El-Mundhiri, Al-Targhib'de bunu aktardıktan sonra rivayet edildiğini söyledi İbn Hibben tarafından Sahih ve El-Bayhaqi'de yer almıştır. Hasan ibn Hayy bunu beğenmiş ve kabul etmiş, zengin kişinin beş yıl boyunca Hacı bırakmamasını istemiştir. Ancak bu, Peygamber'in Hac'dan bahsederken El-Aqra' ibn Habis'in ona 'Her yıl, ey Allah'ın El-Resulü'nü' dediğini doğru şekilde bildirmiş olmasıyla karışır. Şöyle demiştir: 'Evet deseydim, hacı bir kez zorunlu kılardım.' Bunun ötesi ise gönüllüdür."
  id: "Seorang penanya ditanya tentang hadits tentang seorang budak yang tubuhnya sehat dan penghidupannya diperpanjang selama lima tahun, dan itu tidak datang kepada saya untuk orang yang kurang beruntung. Dinawayatkan oleh Abu Sa'id dan Abu Huraira. Dr. Salah Al-Sawi menjawab (Fatwa No. 76955 tanggal 27 November 2008) bahwa dari sini dipahami bahwa orang kaya tidak boleh meninggalkan Haji selama lima tahun. Al-Mundhiri mengatakan setelah mengutipnya dalam Al-Targhib, itu diceritakan oleh Ibib n Hibban dalam Sahih dan Al-Bayhaqi-nya. Hasan ibn Hayy menyukainya dan menerimanya serta ingin orang kaya tidak meninggalkan Haji selama lima tahun. Namun, hal ini membingungkan karena Nabi dengan tulus melaporkan bahwa ketika menyebut Hajih, Al-Aqra' ibn Habis berkata kepadanya, 'Setiap tahun, wahai Rasulullah.' Dia berkata: 'Jika aku berkata ya, aku akan mewajibkan Haji sekali.' Apa pun yang melebihi itu, itu sukarela (sukarela)."
