id: work/fatwa-amja-hajj-every-five-years
class: work
kind: fatwa
label: { ar: "حديث الحج كل خمس سنين", en: "The hadith of Hajj every five years — its bearing", ur: "ہر پانچ سال حج کی حدیث" }
summary:
  ar: "سأل سائل عن حديث إن عبدا صححت له جسمه ووسعت عليه في المعيشة تمضي عليه خمسة أعوام لا يفد إليَّ لمحروم رواه أبو سعيد وأبو هريرة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76955 بتاريخ 27 نوفمبر 2008)⁩ أنه يستفاد منه إن صح أنه لا ينبغي للصحيح الموسر أن يترك الحج خمس سنين وقال المنذري بعد إيراده في الترغيب رواه ابن حبان في صحيحه والبيهقي وكان حسن بن حي يعجبه وبه يأخذ ويحب للموسر الصحيح ألا يترك الحج خمس سنين، ولكن يشوش على هذا أن النبي صح عنه أنه لما ذكر الحج قال له الأقرع بن حابس أفي كل عام يا رسول الله قال لو قلت نعم لوجبت الحج مرة فما زاد فهو تطوع."
  en: "A questioner asked about the hadith that a servant given health of body and ease of living who lets five years pass without coming to God is deprived, narrated from Abu Sa'id and Abu Hurayra. Dr. Salah al-Sawi (fatwa no. 76955, 27 November 2008) answered that were it sound it would mean the healthy well-off man should not leave Hajj five years — al-Mundhiri citing it in al-Targhib via Ibn Hibban's Sahih and al-Bayhaqi, and al-Hasan ibn Hayy approving it — but its use is troubled by the sound report of al-Aqra' ibn Habis asking 'every year, Messenger of God?' and hearing 'had I said yes it would have been binding — Hajj is once; beyond that is voluntary'."
  ur: "ایک سائل نے «پانچ سال حج نہ کرنے والا محروم ہے» کی حدیث پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76955، 27 نومبر 2008)⁩ کے مطابق صحت پر اختلاف ہے اور اقرع بن حابس کی روایت اس کے مطلق معنی کو محدود کرتی ہے — حج عمر میں ایک بار ہے۔"
