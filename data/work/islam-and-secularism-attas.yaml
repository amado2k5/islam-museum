summary:
  ar: "كتاب بالإنجليزية لسيد محمد نقيب العطاس في نقد العلمنة ومفهوم أسلمة المعرفة، صدر عن حركة الشباب المسلم الماليزية بكوالالمبور سنة 1978، وأعاد طبعه المعهد العالمي للفكر والحضارة الإسلامية سنة 1993."
  en: "An English book by Syed Muhammad Naquib al-Attas criticising secularisation and setting out the idea of the Islamisation of knowledge, published by the Muslim Youth Movement of Malaysia, Kuala Lumpur, in 1978, and reprinted by ISTAC in 1993."
  ur: "سید محمد نقیب العطاس کی انگریزی کتاب جو سیکولرائزیشن پر تنقید اور اسلامیانِ علم کے تصور پر ہے؛ ملائیشیا کی مسلم یوتھ موومنٹ، کوالالمپور سے 1978ء میں شائع ہوئی اور 1993ء میں ISTAC نے اسے دوبارہ چھاپا۔"
  es: "Un libro en inglés de Syed Muhammad Naquib al-Attas que critica la secularización y expone la idea de la islamización del conocimiento, publicado por el Movimiento de la Juventud Musulmana de Malasia, Kuala Lumpur, en 1978, y reimpreso por ISTAC en 1993."
  fr: "Un livre en anglais de Syed Muhammad Naquib al-Attas critiquant la sécularisation et exposant l'idée d'une islamisation du savoir, publié par le Mouvement de la jeunesse musulmane de Malaisie, à Kuala Lumpur, en 1978, et réimprimé par ISTAC en 1993."
  tr: "Syed Muhammad Naqeeb Al-Attas tarafından sekülerleşmeyi ve bilgiyi İslamlaştırma kavramını eleştiren İngilizce bir kitap, 1978'de Kuala Lumpur'da Malezya Müslüman Gençlik Hareketi tarafından yayımlanmış ve 1993'te Uluslararası İslami Düşünce ve Medeniyet Enstitüsü tarafından yeniden basılmıştır."
  id: "Sebuah buku berbahasa Inggris karya Syed Muhammad Naqeeb Al-Attas yang mengkritik sekularisasi dan konsep Islamisasi pengetahuan, diterbitkan oleh Gerakan Pemuda Muslim Malaysia di Kuala Lumpur pada tahun 1978, dan dicetak ulang oleh International Institute of Islamic Thought and Civilization pada tahun 1993."
