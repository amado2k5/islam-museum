label:
  ar: "المنجيات ⁦(برنامج)⁩"
  en: "Al-Munjiyat (programme)"
  ur: "المنجیات ⁦(پروگرام)⁩"
summary:
  ar: "برنامج رمضاني لعمر عبد الكافي على شاشة تلفزيون دبي، في سبع وعشرين حلقة بحسب أرشيف أسابيل، موضوعه «المنجيات»: الأعمال والأحوال التي ينجو بها العبد، يبدؤه بالتوبة ثم الصبر والأخلاق وما يفسد القلب ويصلحه."
  en: "A Ramadan programme by Omar Abdelkafy broadcast on Dubai Television, twenty-seven episodes in the Assabile archive, on al-munjiyat, 'the things that save': the deeds and states by which a servant is saved, beginning with repentance and moving on to patience, character, and what corrupts and mends the heart."
  ur: "عمر عبد الکافی کا رمضانی پروگرام جو دبی ٹیلی وژن پر نشر ہوا، اسابیل آرکائیو میں ستائیس اقساط، جس کا موضوع «المنجیات» یعنی نجات دینے والے اعمال اور احوال ہیں؛ اس کا آغاز توبہ سے ہوتا ہے، پھر صبر، اخلاق اور دل کو بگاڑنے اور سنوارنے والی چیزیں۔"
