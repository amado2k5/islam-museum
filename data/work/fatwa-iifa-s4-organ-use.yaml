label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن انتفاع الإنسان بأعضاء جسم إنسان آخر حيًّا كان أو ميتًا", en: "IIFA resolution on a person benefiting from another's organs, living or dead", ur: "اکیڈمی کی قرارداد: زندہ یا مردہ انسان کے اعضاء سے فائدہ", es: "Resolución de la IIFA sobre la persona que se beneficia de los órganos de otra, viva o muerta.", fr: "Résolution de l'IIFA concernant le bénéfice par une personne par les organes d'une autre, vivante ou décédée", tr: "Bir kişinin başka bir kişinin beden parçalarından yararlanmasına ilişkin Uluslararası İslami Fiqh Akademisi kararı, ister canlı ister ölü olsun,", id: "Keputusan Akademi Fiqh Islam Internasional mengenai manfaat seseorang dari bagian tubuh orang lain, baik yang hidup maupun yang sudah meninggal" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩: عرّف العضو بأنه كل جزء من الإنسان من أنسجة وخلايا ودماء كقرنية العين متصلًا كان أو منفصلًا، وعرّف الانتفاع محل البحث بأنه استفادة دعت إليها ضرورة المستفيد لاستبقاء أصل الحياة أو المحافظة على وظيفة أساسية، ثم بيّن أحكام الصور المختلفة على ما فصّل القرار."
  en: "IIFA's fourth-session resolution (Jeddah, February 1988) on a person benefiting from another human's organs, living or dead: it defines an organ as any part of a person — tissue, cells, blood, like the cornea — attached or detached, and the benefit in question as a use the beneficiary's necessity calls for to preserve life itself or an essential function, then sets out the rulings of the cases as the resolution details."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد ⁦(جدہ، فروری 1988ء)⁩ انسانی اعضاء سے فائدے پر: عضو کی تعریف، ضرورت کی بنیاد پر استفادے کی تعریف، پھر مختلف صورتوں کے احکام بیان کیے۔"
  es: "La resolución de la cuarta sesión de la IIFA (Yeda, febrero de 1988) sobre una persona que se beneficia de los órganos de otro ser humano, vivo o muerto, define un órgano como cualquier parte de una persona —tejido, células, sangre, como la córnea— unida o separada, y el beneficio en cuestión como un uso que la necesidad del beneficiario exige para preservar la vida misma o una función esencial, y luego expone las resoluciones de los casos tal como se detallan en la resolución."
  fr: "La résolution de la quatrième session de l'IIFA (Djeddah, février 1988) sur le bénéfice qu'une personne tire des organes d'un autre être humain, vivant ou mort: elle définit un organe comme toute partie d'une personne — tissu, cellules, sang, comme la cornée — attachée ou détachée, et le bénéfice en question comme une utilisation que la nécessité du bénéficiaire exige pour préserver la vie elle-même ou une fonction essentielle, puis expose les décisions rendues dans les cas détaillés dans la résolution."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin dördüncü oturumunda (Cidde, Şubat 1988): Organ, insanın dokular, hücreler ve kan gibi dokular, hücreler ve kan gibi gözün korneası gibi herhangi bir parçası olarak tanımlandı; ister bağlı ister ayrı olsun. İncelenen fayda, yararlanıcının yaşamın kökenini koruma veya temel bir işlevi sürdürme zorunluluğu nedeniyle talep edilen bir fayda olarak tanımlandı. Daha sonra, çeşitli formların kararları kararda ayrıntılı olarak netleştirildi."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi keempatnya (Jeddah, Februari 1988): Organ didefinisikan sebagai bagian apa pun dari manusia seperti jaringan, sel, dan darah, seperti kornea mata, baik yang terhubung maupun terpisah. Manfaat yang dipelajari didefinisikan sebagai manfaat yang diminta oleh kebutuhan penerima untuk melestarikan asal usul kehidupan atau mempertahankan fungsi esensial. Kemudian, keputusan berbagai bentuk dijelaskan sebagaimana dijelaskan dalam keputusan."
