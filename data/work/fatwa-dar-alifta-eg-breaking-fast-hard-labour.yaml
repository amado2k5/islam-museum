id: work/fatwa-dar-alifta-eg-breaking-fast-hard-labour
class: work
kind: fatwa
label: { ar: "حكم الفطر بسبب مشقة العمل", en: "Breaking the fast because of the hardship of work", ur: "کام کی مشقت کی وجہ سے روزہ توڑنا", es: "Romper el ayuno debido a las dificultades del trabajo", fr: "Rompre le jeûne à cause de la difficulté du travail", tr: "İş zorlukları nedeniyle oruç kırma kararı", id: "Aturan tentang berbuka puasa karena kesulitan kerja" }
summary:
  ar: "سائل من أصحاب المهن الشاقة سأل عن الفطر بسبب مشقة العمل. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21732)⁩ أن أصحاب المهن الشاقة كالجزارين ونحوهم إذا كانوا لا يمكنهم أداء العمل مع الصوم بسبب ما يلقونه من مشقة فلهم حكمهم على ما فصّل الجواب."
  en: "A questioner in heavy labour asked about breaking the fast because of the hardship of work. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21732) answered that workers in gruelling trades — like butchers — who cannot do the work while fasting because of the hardship they endure have their ruling, as the answer details."
  ur: "سخت محنت کرنے والے ایک سائل نے کام کی مشقت کی وجہ سے روزہ توڑنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21732)⁩ نے جواب دیا کہ قصابوں جیسے سخت پیشے والے اگر روزے کے ساتھ کام نہیں کر سکتے تو ان کا حکم جواب میں بیان ہوا۔"
  es: "Un trabajador que realizaba labores pesadas preguntó sobre la posibilidad de romper el ayuno debido a la dureza de su trabajo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21732) respondió que los trabajadores de oficios extenuantes, como los carniceros, que no pueden trabajar mientras ayunan debido a las dificultades que sufren, tienen su propia norma, como se detalla en la respuesta."
  fr: "Un travailleur exerçant un métier pénible a demandé s'il pouvait rompre le jeûne en raison de la difficulté de son travail. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21732) a répondu que les travailleurs exerçant des métiers pénibles — comme les bouchers — qui ne peuvent pas travailler pendant le jeûne en raison des difficultés qu'ils endurent, bénéficient d'une exemption, comme le détaille la réponse."
  tr: "Ağır mesleklerde çalışanlardan biri, işin zorlukları nedeniyle oruç kırmayı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21732), kasaplık gibi ağır mesleklerde olanların, çektikleri zorluklar nedeniyle oruç tutarken iş yapamıyorlarsa, ayrıntılı cevaba dayanarak karar verebileceklerini yanıtladı."
  id: "Seorang penanya dari mereka yang bekerja keras menanyakan tentang berpuasa karena kesulitan kerja. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21732) menjawab bahwa mereka yang bekerja keras seperti tukang daging dan sejenisnya, jika mereka tidak dapat bekerja saat berpuasa karena kesulitan yang mereka alami, mereka dapat memutuskan berdasarkan jawaban yang rinci."
