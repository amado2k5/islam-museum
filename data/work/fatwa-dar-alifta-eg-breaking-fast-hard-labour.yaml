label: { ar: "حكم الفطر بسبب مشقة العمل", en: "Breaking the fast because of the hardship of work", ur: "کام کی مشقت کی وجہ سے روزہ توڑنا" }
summary:
  ar: "سائل من أصحاب المهن الشاقة سأل عن الفطر بسبب مشقة العمل. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21732)⁩ أن أصحاب المهن الشاقة كالجزارين ونحوهم إذا كانوا لا يمكنهم أداء العمل مع الصوم بسبب ما يلقونه من مشقة فلهم حكمهم على ما فصّل الجواب."
  en: "A questioner in heavy labour asked about breaking the fast because of the hardship of work. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21732) answered that workers in gruelling trades — like butchers — who cannot do the work while fasting because of the hardship they endure have their ruling, as the answer details."
  ur: "سخت محنت کرنے والے ایک سائل نے کام کی مشقت کی وجہ سے روزہ توڑنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21732)⁩ نے جواب دیا کہ قصابوں جیسے سخت پیشے والے اگر روزے کے ساتھ کام نہیں کر سکتے تو ان کا حکم جواب میں بیان ہوا۔"
