summary:
  ar: "سؤال: كم تجب عليّ الزكاة في الصكوك؟ أجاب الشيخ عمر خان بفتوى المجلس الفقهي لأمريكا الشمالية ⁦(نُشرت بتاريخ 25 فبراير 2026)⁩، واستند الجواب إلى تعريف آيوفي للصكوك بوصفها أوراقًا مالية، ثم تناول كيفية حساب الزكاة فيها بحسب مقصود اقتنائها وطبيعة الأصول التي تمثلها."
  en: "A question: how much zakat is owed on sukuk? Shaykh Umer Khan answered for the Fiqh Council of North America (published 25 February 2026); the answer takes AAOIFI's definition of sukuk as securities as its starting point, then works through how zakat on them is calculated according to the holder's purpose and the nature of the underlying assets."
  ur: "سوال: صکوک پر کتنی زکات واجب ہے؟ شیخ عمر خان نے فقہ کونسل آف نارتھ امریکہ کی طرف سے ⁦(شائع شدہ 25 فروری 2026)⁩ جواب دیا؛ جواب آئیف کی تعریف کو بنیاد بناتا ہے کہ صکوک سیکیورٹیز ہیں، پھر وضاحت کرتا ہے کہ ان پر زکات کا حساب حامل کی نیت اور بنیادی اثاثوں کی نوعیت کے مطابق کیسے ہوتا ہے۔"
