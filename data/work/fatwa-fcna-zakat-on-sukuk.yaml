label: { ar: "زكاة الصكوك", en: "Zakah on Sukuk", ur: "صکوک پر زکات", es: "Zakat sobre Sukuk", fr: "Zakat sur les sukuks", tr: "Sukuk üzerine zekat", id: "Zakat pada Sukuk" }
summary:
  ar: "سؤال: كم تجب عليّ الزكاة في الصكوك؟ أجاب الشيخ عمر خان بفتوى المجلس الفقهي لأمريكا الشمالية ⁦(نُشرت بتاريخ 25 فبراير 2026)⁩، واستند الجواب إلى تعريف آيوفي للصكوك بوصفها أوراقًا مالية، ثم تناول كيفية حساب الزكاة فيها بحسب مقصود اقتنائها وطبيعة الأصول التي تمثلها."
  en: "A question: how much zakat is owed on sukuk? Shaykh Umer Khan answered for the Fiqh Council of North America (published 25 February 2026); the answer takes AAOIFI's definition of sukuk as securities as its starting point, then works through how zakat on them is calculated according to the holder's purpose and the nature of the underlying assets."
  ur: "سوال: صکوک پر کتنی زکات واجب ہے؟ شیخ عمر خان نے فقہ کونسل آف نارتھ امریکہ کی طرف سے ⁦(شائع شدہ 25 فروری 2026)⁩ جواب دیا؛ جواب آئیف کی تعریف کو بنیاد بناتا ہے کہ صکوک سیکیورٹیز ہیں، پھر وضاحت کرتا ہے کہ ان پر زکات کا حساب حامل کی نیت اور بنیادی اثاثوں کی نوعیت کے مطابق کیسے ہوتا ہے۔"
  es: "Una pregunta: ¿cuánto zakat se debe pagar sobre los sukuk? El jeque Umer Khan respondió para el Consejo de Jurisprudencia Islámica de Norteamérica (publicado el 25 de febrero de 2026); la respuesta parte de la definición de sukuk como valores según la AAOIFI y luego explica cómo se calcula el zakat sobre ellos de acuerdo con el propósito del titular y la naturaleza de los activos subyacentes."
  fr: "Question: quel est le montant de la zakat due sur les sukuk ? Cheikh Umer Khan a répondu pour le Conseil de jurisprudence islamique d’Amérique du Nord (publication du 25 février 2026); la réponse prend pour point de départ la définition des sukuk en tant que titres financiers donnée par l’AAOIFI, puis détaille le calcul de la zakat en fonction de l’objectif du détenteur et de la nature des actifs sous-jacents."
  tr: "Soru: Sukuk için ne kadar zekat ödenecek? Şeyh Ömer Han, IIFI'nin sukuk'u finansal araçlar olarak tanımına dayanarak Kuzey Amerika Fiqh Konseyi'nin (25 Şubat 2026'da yayımlanan) fetvasını sundu, ardından zekatın edinim amacına ve temsil ettikleri varlıkların niteliğine göre nasıl hesaplandığını tartıştı."
  id: "Pertanyaan: Berapa banyak zakat yang harus dibayar untuk sukuk? Sheikh Omar Khan menanggapi dengan fatwa Dewan Fiqh Amerika Utara (diterbitkan pada 25 Februari 2026), mendasarkan jawabannya pada definisi IIFI tentang sukuk sebagai instrumen keuangan, kemudian membahas bagaimana zakat dihitung berdasarkan tujuan akuisisi dan sifat aset yang diwakilinya."
