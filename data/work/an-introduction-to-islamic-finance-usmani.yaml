summary:
  ar: "مدخل بالإنجليزية لمحمد تقي العثماني إلى أدوات التمويل الإسلامي وأحكامها، صدرت طبعته الأولى عن إدارة المعارف في كراتشي سنة 1998، ثم عن دار كلوفر سنة 2002."
  en: "An English introduction by Muhammad Taqi Usmani to the instruments of Islamic finance and their rulings; the first edition was published by Idaratul Ma'arif, Karachi, in 1998, followed by a Kluwer Law International edition in 2002."
