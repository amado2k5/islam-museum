  es: "Introducción en inglés de Muhammad Taqi Usmani a los instrumentos de las finanzas islámicas y sus normas; la primera edición fue publicada por Idaratul Ma'arif, Karachi, en 1998, seguida de una edición de Kluwer Law International en 2002."
  fr: "Une introduction en anglais de Muhammad Taqi Usmani aux instruments de la finance islamique et à leurs règles; la première édition a été publiée par Idaratul Ma'arif, Karachi, en 1998, suivie d'une édition Kluwer Law International en 2002."
  tr: "Muhammad Taqi Al-Othmani tarafından İslami Finans Araçları ve Hükümleri adlı esere İngilizce bir giriş, ilk baskısı 1998'de Karaçi Eğitim Bakanlığı tarafından, ardından 2002'de Clover Yayıncılık tarafından yayımlanmıştır."
  id: "Pengantar bahasa Inggris oleh Muhammad Taqi Al-Othmani untuk Alat Keuangan Islam dan Keputusan Mereka, edisi pertama diterbitkan oleh Departemen Pendidikan di Karachi pada tahun 1998, kemudian oleh Clover Publishing House pada tahun 2002."
