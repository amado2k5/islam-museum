id: work/fatwa-dar-alifta-father-compelling-son-to-give-charity
class: work
kind: fatwa
label: { ar: "حكم إلزام الأب ابنه بالتصدق", en: "A father compelling his son to give voluntary charity", ur: "باپ کا بیٹے کو صدقہ دینے پر مجبور کرنا", es: "Un padre obligando a su hijo a hacer obras de caridad voluntarias.", fr: "Un père obligeant son fils à faire du bénévolat", tr: "Bir babanın oğlunu hayır vermeye zorlaması hakkındaki karar", id: "Putusan tentang seorang ayah yang mewajibkan anaknya untuk memberi amal" }
summary:
  ar: "سائل يذكر أن أباه التاجر يكثر الصدقة ويطلب من أخيه الذي بدأ تجارة مستقلة أن يتصدق شهريًّا ببعض سلعه. أجابت دار الإفتاء المصرية، في فتوى صادرة عن المفتي نظير عياد، بأن صدقة التطوع مستحبة تُخرج بطيب نفس واختيار مما يزيد عن حاجة المرء ومن يعول، فلا يجوز إلزام أحد بها، وليس للأب أن يجبر ابنه عليها، وإنما يحثه بالترغيب وبيان فضلها."
  en: "A questioner says his merchant father gives much in charity and asks his brother, who has started his own business, to give some of his goods in charity every month. Egypt's Dar al-Ifta, in a fatwa issued under Grand Mufti Nazir Ayyad, answered that voluntary charity is recommended and is given willingly, by choice, from what exceeds one's needs and those of one's dependants; no one may be compelled to give it, so the father may not force his son, but may encourage him by explaining its merit."
  ur: "ایک سائل بتاتا ہے کہ اس کا تاجر باپ بہت صدقہ کرتا ہے اور اپنے اس بیٹے سے، جس نے الگ کاروبار شروع کیا ہے، ہر مہینے کچھ سامان صدقہ کرنے کو کہتا ہے۔ مصر کے دار الافتاء نے مفتی نظیر عیاد کے فتوے میں جواب دیا کہ نفلی صدقہ مستحب ہے اور اپنی اور زیرِ کفالت لوگوں کی ضرورت سے زائد مال میں سے خوش دلی اور اختیار سے دیا جاتا ہے؛ کسی کو اس پر مجبور کرنا جائز نہیں، لہٰذا باپ بیٹے کو مجبور نہیں کر سکتا، البتہ اس کی فضیلت بیان کر کے ترغیب دے سکتا ہے۔"
  es: "Un consultante afirma que su padre, comerciante, da mucho en caridad y le pide a su hermano, que ha iniciado su propio negocio, que done parte de sus mercancías cada mes. El Dar al-Ifta de Egipto, en una fatwa emitida bajo el Gran Muftí Nazir Ayyad, respondió que la caridad voluntaria es recomendable y se da de buena gana, por elección, de lo que excede las necesidades propias y las de los dependientes; nadie puede ser obligado a darla, por lo que el padre no puede forzar a su hijo, pero puede animarlo explicándole sus méritos."
  fr: "Un homme, dont le père, marchand, est très généreux en aumônes, demande à son frère, qui a créé sa propre entreprise, de donner une partie de ses biens chaque mois. La Dar al-Ifta d'Égypte, dans une fatwa émise sous l'égide du grand mufti Nazir Ayyad, a répondu que l'aumône volontaire est recommandée et qu'elle est donnée de plein gré, par choix, sur ce qui excède les besoins de chacun et de ses proches; nul ne peut y être contraint, aussi le père ne peut-il forcer son fils, mais l'encourager en lui expliquant le bienfait de cette pratique."
  tr: "Bir soru soran, babasının bir tüccar olduğunu ve bağımsız bir iş kuran kardeşinden, bazı mallarıyla aylık yardım yapmasını istediğini belirtir. Mısırlı Dar al-Ifta, Mufti Nazir Ayad'ın verdiği fetvada, gönüllü yardımın kişinin ve bakmakla yükümlü olduklarının ihtiyaçlarının ötesinde isteyerek ve isteyerek verildiğini belirtmiştir. Hiç kimse bunu yapmak zorunda değildir, ayrıca bir babanın oğlunu zorlaması da kabul edilemez; aksine, onu bu erdemi teşvik etmeye ve açıklamaya teşvik eder."
  id: "Seorang penanya menyebutkan bahwa ayahnya, seorang pedagang, sering memberi amal dan meminta saudaranya, yang memulai usaha mandiri, untuk memberikan amal bulanan dengan beberapa barangnya. Dar al-Ifta Mesir menanggapi dalam fatwa yang dikeluarkan oleh Mufti Nazir Ayad bahwa amal sukarela direkomendasikan dan diberikan dengan sukarela serta pilihan melebihi kebutuhan seseorang dan tanggungannya. Tidak ada yang wajib melakukannya, dan tidak diperbolehkan bagi seorang ayah untuk memaksa anaknya melakukannya; sebaliknya, dia mendorongnya untuk mendorong dan menjelaskan kebaikannya."
