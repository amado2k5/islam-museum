id: work/fatwa-dar-alifta-father-compelling-son-to-give-charity
class: work
kind: fatwa
label: { ar: "حكم إلزام الأب ابنه بالتصدق", en: "A father compelling his son to give voluntary charity", ur: "باپ کا بیٹے کو صدقہ دینے پر مجبور کرنا" }
summary:
  ar: "سائل يذكر أن أباه التاجر يكثر الصدقة ويطلب من أخيه الذي بدأ تجارة مستقلة أن يتصدق شهريًّا ببعض سلعه. أجابت دار الإفتاء المصرية، في فتوى صادرة عن المفتي نظير عياد، بأن صدقة التطوع مستحبة تُخرج بطيب نفس واختيار مما يزيد عن حاجة المرء ومن يعول، فلا يجوز إلزام أحد بها، وليس للأب أن يجبر ابنه عليها، وإنما يحثه بالترغيب وبيان فضلها."
  en: "A questioner says his merchant father gives much in charity and asks his brother, who has started his own business, to give some of his goods in charity every month. Egypt's Dar al-Ifta, in a fatwa issued under Grand Mufti Nazir Ayyad, answered that voluntary charity is recommended and is given willingly, by choice, from what exceeds one's needs and those of one's dependants; no one may be compelled to give it, so the father may not force his son, but may encourage him by explaining its merit."
  ur: "ایک سائل بتاتا ہے کہ اس کا تاجر باپ بہت صدقہ کرتا ہے اور اپنے اس بیٹے سے، جس نے الگ کاروبار شروع کیا ہے، ہر مہینے کچھ سامان صدقہ کرنے کو کہتا ہے۔ مصر کے دار الافتاء نے مفتی نظیر عیاد کے فتوے میں جواب دیا کہ نفلی صدقہ مستحب ہے اور اپنی اور زیرِ کفالت لوگوں کی ضرورت سے زائد مال میں سے خوش دلی اور اختیار سے دیا جاتا ہے؛ کسی کو اس پر مجبور کرنا جائز نہیں، لہٰذا باپ بیٹے کو مجبور نہیں کر سکتا، البتہ اس کی فضیلت بیان کر کے ترغیب دے سکتا ہے۔"
