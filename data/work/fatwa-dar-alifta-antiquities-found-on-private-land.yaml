id: work/fatwa-dar-alifta-antiquities-found-on-private-land
class: work
kind: fatwa
label: { ar: "كيفية التصرف في الآثار التي يجدها الإنسان في ملكه", en: "Antiquities found on one's own land", ur: "اپنی ملکیت میں ملنے والے آثارِ قدیمہ کا حکم" }
summary:
  ar: "سؤال عن رجل اشترى أرضًا في إحدى محافظات مصر ليبني عليها بيتًا فوجد أثناء الحفر تماثيل أثرية قديمة، أجابت فيه دار الإفتاء المصرية بأن الآثار التي يُعثر عليها في الأراضي المصرية من الأموال العامة للدولة ولا تدخل في ملك الأفراد ولو وُجدت في أرض مملوكة ملكًا صحيحًا، فلا يحق له تملكها ولا حيازتها ولا التصرف فيها، ويجب عليه شرعًا تسليمها إلى الجهات المختصة. عرضت الدار تعريف الركاز عند الحنفية والجمهور ومآله في المذاهب الأربعة مع إخراج الخمس، ثم عرّفت الآثار لغةً وبقانون حماية الآثار رقم 117 لسنة 1983، وبنت الفتوى على جهالة المالك الأول، وكون الآثار مظنة التنازع والطمع، وتضرر مجموع الأمة لو اختص بها فرد، وعراقة الحضارة المصرية ودعوة القرآن إلى السير في الأرض والاعتبار بآثار الأمم. ونقلت مواد القانون التي تعدّ الآثار أموالًا عامة وتوجب الإبلاغ عنها خلال ثمان وأربعين ساعة مع جواز المكافأة، وقالت إن ذلك موافق لما قرره الفقهاء من أن أمر المعادن للإمام سدًا لباب الهرج، وأن تصرف الإمام منوط بالمصلحة، وأن المصلحة العامة مقدمة على الخاصة، وأن طاعة ولي الأمر فيما ليس بمعصية واجبة بالإجماع."
  en: "A question about a man who bought land in an Egyptian governorate to build a house and, while digging, found ancient statues; Dar al-Ifta al-Misriyya answered that antiquities found on Egyptian land are public property of the state and do not enter private ownership even when found on validly owned land, so he may neither own, keep nor dispose of them and must hand them to the competent authorities. Dar al-Ifta set out the Hanafi and majority definitions of rikaz (buried treasure) and its disposal in the four schools with the fifth due on it, then defined antiquities in language and under Egypt's Antiquities Protection Law 117 of 1983, and based the fatwa on the unknown identity of the original owner, on antiquities being a cause of dispute and greed, on the harm to the whole community if one individual kept them, and on the antiquity of Egyptian civilisation and the Qur'an's call to travel the earth and reflect on the traces of past nations. It quoted the articles of the law that make antiquities public property and require a finder to report within forty-eight hours, with a possible reward, and said this agrees with what the jurists laid down: that mines are for the ruler to close the door to strife, that the ruler's disposal is bound by the public interest, that the public interest precedes the private, and that obedience to the ruler in what is not sinful is obligatory by consensus."
  ur: "ایک شخص کے بارے میں سوال جس نے مصر کے ایک صوبے میں گھر بنانے کے لیے زمین خریدی اور کھدائی کے دوران قدیم اثری مجسمے پائے؛ دار الافتاء مصر نے جواب دیا کہ مصری زمین میں ملنے والے آثارِ قدیمہ ریاست کے عمومی اموال ہیں اور افراد کی ملکیت میں داخل نہیں ہوتے، چاہے وہ درست ملکیت والی زمین میں ملیں، لہٰذا اسے ان کی ملکیت، قبضے یا تصرف کا حق نہیں اور شرعاً ان کا متعلقہ اداروں کے حوالے کرنا واجب ہے۔ دار الافتاء نے رکاز کی حنفی اور جمہور کی تعریف اور چاروں مذاہب میں خمس کے ساتھ اس کے انجام کو بیان کیا، پھر آثار کی لغوی تعریف اور 1983 کے قانونِ تحفظِ آثار 117 کی تعریف پیش کی، اور فتوے کی بنیاد پہلے مالک کی لاعلمی، آثار کے جھگڑے اور لالچ کا سبب ہونے، ایک فرد کے پاس رہنے سے پوری امت کے نقصان، اور مصری تہذیب کی قدامت اور قرآن کی زمین میں چلنے اور گزشتہ امتوں کے آثار سے عبرت لینے کی دعوت پر رکھی۔ اس نے قانون کی وہ دفعات نقل کیں جو آثار کو عمومی مال قرار دیتی ہیں اور پانے والے پر اڑتالیس گھنٹے میں اطلاع دینا لازم کرتی ہیں، انعام کے امکان کے ساتھ، اور کہا کہ یہ فقہا کے اس فیصلے کے موافق ہے کہ معدنیات کا معاملہ فتنے کا دروازہ بند کرنے کے لیے امام کے سپرد ہے، امام کا تصرف مصلحت سے مشروط ہے، عمومی مصلحت خصوصی پر مقدم ہے، اور غیر معصیت میں ولی امر کی اطاعت بالاجماع واجب ہے۔"
