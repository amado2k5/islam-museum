id: work/fatwa-dar-alifta-antiquities-found-on-private-land
class: work
kind: fatwa
label: { ar: "كيفية التصرف في الآثار التي يجدها الإنسان في ملكه", en: "Antiquities found on one's own land", ur: "اپنی ملکیت میں ملنے والے آثارِ قدیمہ کا حکم", es: "Antigüedades encontradas en la propia tierra", fr: "Des antiquités trouvées sur son propre terrain", tr: "Bir kişinin mülkünde bulduğu eserlerin nasıl bertaraf edileceği", id: "Cara membuang artefak yang ditemukan seseorang di propertinya" }
summary:
  ar: "سؤال عن رجل اشترى أرضًا في إحدى محافظات مصر ليبني عليها بيتًا فوجد أثناء الحفر تماثيل أثرية قديمة، أجابت فيه دار الإفتاء المصرية بأن الآثار التي يُعثر عليها في الأراضي المصرية من الأموال العامة للدولة ولا تدخل في ملك الأفراد ولو وُجدت في أرض مملوكة ملكًا صحيحًا، فلا يحق له تملكها ولا حيازتها ولا التصرف فيها، ويجب عليه شرعًا تسليمها إلى الجهات المختصة. عرضت الدار تعريف الركاز عند الحنفية والجمهور ومآله في المذاهب الأربعة مع إخراج الخمس، ثم عرّفت الآثار لغةً وبقانون حماية الآثار رقم 117 لسنة 1983، وبنت الفتوى على جهالة المالك الأول، وكون الآثار مظنة التنازع والطمع، وتضرر مجموع الأمة لو اختص بها فرد، وعراقة الحضارة المصرية ودعوة القرآن إلى السير في الأرض والاعتبار بآثار الأمم. ونقلت مواد القانون التي تعدّ الآثار أموالًا عامة وتوجب الإبلاغ عنها خلال ثمان وأربعين ساعة مع جواز المكافأة، وقالت إن ذلك موافق لما قرره الفقهاء من أن أمر المعادن للإمام سدًا لباب الهرج، وأن تصرف الإمام منوط بالمصلحة، وأن المصلحة العامة مقدمة على الخاصة، وأن طاعة ولي الأمر فيما ليس بمعصية واجبة بالإجماع."
  en: "A question about a man who bought land in an Egyptian governorate to build a house and, while digging, found ancient statues; Dar al-Ifta al-Misriyya answered that antiquities found on Egyptian land are public property of the state and do not enter private ownership even when found on validly owned land, so he may neither own, keep nor dispose of them and must hand them to the competent authorities. Dar al-Ifta set out the Hanafi and majority definitions of rikaz (buried treasure) and its disposal in the four schools with the fifth due on it, then defined antiquities in language and under Egypt's Antiquities Protection Law 117 of 1983, and based the fatwa on the unknown identity of the original owner, on antiquities being a cause of dispute and greed, on the harm to the whole community if one individual kept them, and on the antiquity of Egyptian civilisation and the Qur'an's call to travel the earth and reflect on the traces of past nations. It quoted the articles of the law that make antiquities public property and require a finder to report within forty-eight hours, with a possible reward, and said this agrees with what the jurists laid down: that mines are for the ruler to close the door to strife, that the ruler's disposal is bound by the public interest, that the public interest precedes the private, and that obedience to the ruler in what is not sinful is obligatory by consensus."
  ur: "ایک شخص کے بارے میں سوال جس نے مصر کے ایک صوبے میں گھر بنانے کے لیے زمین خریدی اور کھدائی کے دوران قدیم اثری مجسمے پائے؛ دار الافتاء مصر نے جواب دیا کہ مصری زمین میں ملنے والے آثارِ قدیمہ ریاست کے عمومی اموال ہیں اور افراد کی ملکیت میں داخل نہیں ہوتے، چاہے وہ درست ملکیت والی زمین میں ملیں، لہٰذا اسے ان کی ملکیت، قبضے یا تصرف کا حق نہیں اور شرعاً ان کا متعلقہ اداروں کے حوالے کرنا واجب ہے۔ دار الافتاء نے رکاز کی حنفی اور جمہور کی تعریف اور چاروں مذاہب میں خمس کے ساتھ اس کے انجام کو بیان کیا، پھر آثار کی لغوی تعریف اور 1983 کے قانونِ تحفظِ آثار 117 کی تعریف پیش کی، اور فتوے کی بنیاد پہلے مالک کی لاعلمی، آثار کے جھگڑے اور لالچ کا سبب ہونے، ایک فرد کے پاس رہنے سے پوری امت کے نقصان، اور مصری تہذیب کی قدامت اور قرآن کی زمین میں چلنے اور گزشتہ امتوں کے آثار سے عبرت لینے کی دعوت پر رکھی۔ اس نے قانون کی وہ دفعات نقل کیں جو آثار کو عمومی مال قرار دیتی ہیں اور پانے والے پر اڑتالیس گھنٹے میں اطلاع دینا لازم کرتی ہیں، انعام کے امکان کے ساتھ، اور کہا کہ یہ فقہا کے اس فیصلے کے موافق ہے کہ معدنیات کا معاملہ فتنے کا دروازہ بند کرنے کے لیے امام کے سپرد ہے، امام کا تصرف مصلحت سے مشروط ہے، عمومی مصلحت خصوصی پر مقدم ہے، اور غیر معصیت میں ولی امر کی اطاعت بالاجماع واجب ہے۔"
  es: "Una pregunta sobre un hombre que compró un terreno en una gobernación egipcia para construir una casa y, mientras excavaba, encontró estatuas antiguas; Dar al-Ifta al-Misriyya respondió que las antigüedades encontradas en tierras egipcias son propiedad pública del Estado y no pasan a ser de propiedad privada, incluso cuando se encuentran en terrenos de propiedad legítima, por lo que no puede poseerlas, conservarlas ni disponer de ellas, y debe entregarlas a las autoridades competentes. Dar al-Ifta expuso las definiciones hanafi y mayoritarias de rikaz (tesoro enterrado) y su disposición en las cuatro escuelas, con la quinta escuela adeudada sobre él, luego definió las antigüedades en términos lingüísticos y bajo la Ley de Protección de Antigüedades de Egipto n.° 117 de 1983, y basó la fatwa en la identidad desconocida del propietario original, en que las antigüedades son causa de disputa y codicia, en el daño a toda la comunidad si un individuo las conserva, y en la antigüedad de la civilización egipcia y el llamado del Corán a viajar por la tierra y reflexionar sobre las huellas de las naciones pasadas. Citó los artículos de la ley que convierten las antigüedades en propiedad pública y exigen que quien las encuentre lo notifique en un plazo de cuarenta y ocho horas, con una posible recompensa, y afirmó que esto concuerda con lo establecido por los juristas: que las minas son para que el gobernante cierre la puerta a la discordia, que la disposición del gobernante está sujeta al interés público, que el interés público precede al privado y que la obediencia al gobernante en lo que no es pecaminoso es obligatoria por consenso."
  fr: "Une question concernait un homme qui avait acheté un terrain dans un gouvernorat égyptien pour y construire une maison et qui, en creusant, y avait découvert des statues antiques. Dar al-Ifta al-Misriyya a répondu que les antiquités trouvées sur des terres égyptiennes appartiennent au domaine public et ne peuvent faire l'objet d'une propriété privée, même si elles sont découvertes sur un terrain légitimement acquis. Par conséquent, cet homme ne peut ni les posséder, ni les conserver, ni en disposer, et doit les remettre aux autorités compétentes. Dar al-Ifta a exposé les définitions hanafite et majoritaire du rikaz (trésor enfoui) et de son sort selon les quatre écoles de pensée, une cinquième école étant également concernée. L'institut a ensuite défini les antiquités en termes de langue et au regard de la loi égyptienne n° 117 de 1983 relative à la protection des antiquités. Enfin, Dar al-Ifta a fondé sa fatwa sur l'identité inconnue du propriétaire initial, sur le fait que les antiquités sont source de litiges et de convoitise, sur le préjudice que leur conservation par un seul individu causerait à la communauté entière, et sur l'ancienneté de la civilisation égyptienne et l'appel du Coran à parcourir le monde et à méditer sur les traces des nations passées. Elle citait les articles de loi qui font des antiquités un bien public et exigent que celui qui les découvre les signale dans les quarante-huit heures, avec une récompense possible, et affirmait que cela concordait avec ce qu'avaient établi les juristes: que les mines appartiennent au souverain pour éviter les conflits, que la disposition du souverain est liée par l'intérêt public, que l'intérêt public prime sur l'intérêt privé et que l'obéissance au souverain dans ce qui n'est pas un péché est obligatoire par consensus."
  tr: "Mısır'ın bir valiliğinde ev inşa etmek için arazi satın alan ve kazı sırasında antik arkeolojik heykeller bulan bir adam hakkında bir soru. Mısır Dar al-Ifta, Mısır topraklarında bulunan antikaların kamu devlet fonu olduğunu ve bireylere ait olmadığını yanıtladı. Uygun mülkiyette bulunan arazide bulunsalar bile, onları sahiplenme, sahiplenme veya elden çıkarma hakkı yoktur. Dini olarak bunları yetkili makamlara teslim etmekle yükümlüdür. Meclis, 'rakaz' tanımını şu şekilde sundu Hanafi ve çoğunluk ile dört düşünce okulunda, beş istisna dahil, kaderi hakkında bilgi edindi. Daha sonra antikaları dilbilimsel olarak ve 1983 tarihli 117 sayılı Antikaların Korunması Yasası kapsamında tanıttı. Fetva, orijinal sahibinin cehaleti, antikaların çatışma ve açgözlülük şüphesi, sadece onlara özgü olursa tüm ulusa zarar vereceği düşüncesine, Mısır medeniyetinin derinliğine ve Kur'an'ın ülkede dolaşma ve ulusların antikalarına saygı duyma çağrısına dayanıyordu. Antikaları kamu fonu olarak gören ve kırk sekiz saat içinde rapor edilmesini, ödülün izin verilmesini zorunlu kılan kanun maddeleri, bunun hukukçuların kararlarıyla uyumlu olduğunu belirtir; bu kararlar mineraller meselesinin İmam'ın kaosu önlemesi için görev olduğu, imamın eylemlerinin çıkara tabi olduğu, kamu yararının özel çıkardan üstün tutulduğu ve günah olmayan konularda hükümdara itaat etmenin oybirliğiyle zorunlu olduğu yönündedir."
  id: "Sebuah pertanyaan tentang seorang pria yang membeli tanah di salah satu provinsi Mesir untuk membangun rumah di atasnya dan menemukan patung arkeologi kuno selama penggalian. Dar al-Ifta Mesir menjawab bahwa barang antik yang ditemukan di tanah Mesir adalah dana negara publik dan bukan milik individu. Bahkan jika ditemukan di tanah yang benar-benar dimiliki, ia tidak berhak memiliki, memiliki, atau melepaskannya. Ia secara agama wajib menyerahkannya kepada otoritas yang berwenang. Dewan menyampaikan definisi 'rakaz' menurut Hanafi dan mayoritas serta nasibnya dalam empat aliran pemikiran, termasuk lima pengecualian. Kemudian Dewan memperkenalkan barang antik secara linguistik dan di bawah Undang-Undang Perlindungan Antikuitas No. 117 tahun 1983. Fatwa tersebut didasarkan pada ketidaktahuan pemilik asli, yaitu kecurigaan konflik dan keserakahan, serta kerugian bagi seluruh bangsa jika hanya milik mereka, kedalaman peradaban Mesir, serta seruan Al-Qur'an untuk berjalan di tanah dan menghormati keanekarangan bangsa-bangsa. Pasal-pasal hukum yang menganggap barang kuno sebagai dana publik dan mewajibkan pelaporan dalam waktu empat puluh delapan jam, dengan izin atas hadiah, menyatakan bahwa hal ini sejalan dengan putusan para ahli hukum, yang menyatakan bahwa masalah mineral adalah tugas Imam untuk mencegah kekacauan, bahwa tindakan Imam tunduk pada kepentingan, bahwa kepentingan publik lebih utama daripada kepentingan pribadi, dan bahwa ketaatan kepada penguasa dalam hal-hal yang tidak berdosa adalah kewajiban bulat."
