summary:
  ar: "أبيات لحسان بن ثابت من الطويل على روي الراء، قالها يوم بدر الكبرى {{cite:sharh-diwan-hassan-barquqi-1929 p.187}}."
  en: "Verses by Hassan ibn Thabit in the tawil metre on the rhyme ra', said on the day of the great battle of Badr {{cite:sharh-diwan-hassan-barquqi-1929 p.187}}."
  es: "Versos de Hassan ibn Thabit en metro tawil sobre la rima ra', dicho el día de la gran batalla de Badr {{cite:sharh-diwan-hassan-barquqi-1929 p.187}}."
  fr: "Vers de Hassan ibn Thabit en mètre tawil sur la rime ra', dits le jour de la grande bataille de Badr {{cite:sharh-diwan-hassan-barquqi-1929 p.187}}."
  ur: "غزوہ بدر کے دن حسن بن ثابت کی آیات تاویل میٹر میں، جو کہ بدر کی عظیم جنگ کے دن کہی گئی {{حوالہ:شرح دیوان-حسن برقوی-1929 صفحہ 187}}۔"
  tr: "Hadsan ibn Tabit'in rā' rivayetine göre El-Tavil'den Hasan ibn Tebit'in ayetleri, Badr al-Kubra gününde okunur {{cite:sharh-diwan-hassan-barquqi-1929 s.187}}."
  id: "Ayat-ayat Hassan ibn Thabit dari Al-Tawil menurut riwayat rā', yang dibacakan pada hari Badr al-Kubra {{cite:sharh-diwan-hassan-barquqi-1929 hlm.187}}."
