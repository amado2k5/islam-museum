id: work/fatwa-dar-alifta-eg-sharing-one-vessel-food
class: work
kind: fatwa
label: { ar: "حكم التشارك في الطعام والشراب في إناء واحد", en: "Sharing food and drink from one vessel", ur: "ایک ہی برتن میں کھانا اور پینا", es: "Compartir comida y bebida de un mismo recipiente.", fr: "Partager la nourriture et les boissons d'un même navire" }
summary:
  ar: "سائل سأل عن التشارك في إناء الطعام والشراب الواحد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21037)⁩ أن التشارك في إناء الطعام أمر جائز شرعًا بشرط ألا يؤدي إلى وقوع ضرر على صحة الإنسان وبيّن الجواب حكم من تعف نفسه عن ذلك على وجهه."
  en: "A questioner asked about sharing food and drink from one vessel. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21037) answered that sharing a vessel is lawful provided it does not cause harm to health, and set out the case of one whose own cleanliness-need leads him to abstain."
  ur: "ایک سائل نے ایک ہی برتن سے کھانے پینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21037)⁩ نے جواب دیا کہ صحت کو نقصان نہ ہو تو یہ جائز ہے اور جس کی طبیعت گریز کرے اس کا حکم جواب میں ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de compartir comida y bebida de un mismo recipiente. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21037) respondió que compartir un recipiente es lícito siempre que no perjudique la salud, y expuso el caso de quien, por motivos de higiene personal, decide abstenerse."
  fr: "Une personne a posé une question concernant le partage de nourriture et de boissons dans un même récipient. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21037) a répondu que le partage d'un récipient est licite à condition qu'il ne nuise pas à la santé, et a exposé le cas d'une personne dont le besoin de propreté l'amène à s'abstenir."
