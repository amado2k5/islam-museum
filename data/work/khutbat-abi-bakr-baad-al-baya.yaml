summary:
  ar: "أول خطبة ألقاها أبو بكر بعد بيعة السقيفة كما رواها الطبري وغيره، وفيها قوله: قد وليت عليكم ولست بخيركم، فإن أحسنت فأعينوني وإن أسأت فقوموني."
  en: "His first sermon after the Saqifa bay'a, as al-Tabari and others transmit: I have been put in charge of you though I am not the best of you; support me if I do right and set me straight if I err."
  ur: "سقیفہ کی بیعت کے بعد پہلا خطبہ، طبری وغیرہ کی روایت سے: میں تمہارا حاکم بنایا گیا بہترین نہ ہونے کے باوجود؛ اچھائی میں تعاون اور خطا پر اصلاح۔"
