label: { ar: "مدى اعتبار الإخبار بالمعصية في طلب الفتوى من الجهر بها", en: "Is telling the mufti of one's sin the condemned broadcasting of it?", ur: "مفتی کو گناہ بتانا کیا اس کا اعلان ہے؟", es: "¿Contarle el pecado al muftí constituye una difusión condenable del mismo?" }
summary:
  ar: "سائل سأل عن مدى اعتبار إخبار المستفتي المفتي بما ابتلي به من معصية من قبيل الجهر المذموم بها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21718)⁩ أن إخبار المستفتي المفتي بما ابتلي به من معصية لا يعد من قبيل الجهر المذموم بالمعاصي على ما فصّل الجواب من علة ذلك."
  en: "A questioner asked whether telling the mufti of a sin one suffers counts as the condemned broadcasting of sins. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21718) answered that informing the mufti when seeking a fatwa does not count as blameworthy broadcasting — the answer explains why."
  ur: "ایک سائل نے پوچھا کہ فتویٰ مانگتے وقت مفتی کو اپنی خطا بتانا کیا مذموم اعلانِ معصیت ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21718)⁩ نے جواب دیا کہ فتویٰ طلب میں بتانا اعلانِ معصیت شمار نہیں ہوتا — جواب میں اس کی وجہ بیان ہوئی۔"
  es: "Un consultante preguntó si informar al muftí sobre un pecado que se padece constituye una divulgación condenable de pecados. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21718) respondió que informar al muftí al solicitar una fatwa no se considera una divulgación censurable; la respuesta explica el porqué."
