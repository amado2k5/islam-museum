label: { ar: "حكم زكاة المال المقتَرض", en: "Zakat on borrowed money", ur: "ادھار لی گئی رقم پر زکات کا حکم", es: "Zakat sobre dinero prestado" }
summary:
  ar: "سائل سأل عن زكاة المال المقترض. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23878)⁩ أن الزكاة تجب في المال إذا توفرت فيه شروط الوجوب: الملك التام، وبلوغ النصاب — وهو قيمة 85 جرامًا من الذهب عيار 21 — وحولان الحول؛ وبيّن الجواب حكم المال المقترض في ضوء هذه الشروط."
  en: "A questioner asked about zakat on borrowed money. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23878) answered that zakat is due on money when its conditions are met: complete ownership, reaching the nisab — the value of 85 grams of 21-carat gold — and the passing of the year; the answer applies these conditions to money held as a loan."
  ur: "ایک سائل نے ادھار لی گئی رقم پر زکات پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23878)⁩ نے جواب دیا کہ مال پر زکات اس وقت واجب ہوتی ہے جب اس میں وجوب کی شرائط پوری ہوں: مکمل ملکیت، نصاب کی تکمیل — جو 85 گرام 21 قیراط سونے کی قیمت ہے — اور سال گزرنا؛ جواب میں ان شرائط کو ادھار کے مال پر منطبق کیا گیا۔"
  es: "Un consultante preguntó sobre el zakat sobre el dinero prestado. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23878) respondió que el zakat se debe sobre el dinero cuando se cumplen sus condiciones: propiedad total, alcanzar el nisab —el valor de 85 gramos de oro de 21 quilates— y el transcurso del año; la respuesta aplica estas condiciones al dinero mantenido como préstamo."
