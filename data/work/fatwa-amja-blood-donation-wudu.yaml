label: { ar: "التبرع بالدم والوضوء", en: "Blood donation and the wudu — the schools on copious blood", ur: "خون عطیہ اور وضو — مذاہب", es: "Donación de sangre y el wudu: las escuelas sobre la donación abundante de sangre." }
summary:
  ar: "سأل سائل هل يلزم المتبرع بالدم أن يتوضأ للصلاة أم أن وضوءه لا ينتقض بتبرعه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21947 بتاريخ 16 يناير 2007)⁩ أن الإمامين أبا حنيفة وأحمد ذهبا إلى أن الدم الفاحش أي الكثير ينقض الوضوء وذهب الشافعي ومالك إلى أنه لا ينقض والأحوط أن يتوضأ على ما فصّل الجواب من الترجيح."
  en: "A questioner asked whether a blood donor must do wudu for the prayer or his wudu stands. Dr. Salah al-Sawi (fatwa no. 21947, 16 January 2007) answered that the two imams Abu Hanifa and Ahmad held copious blood breaks the wudu, while Shafi'i and Malik held it does not; the cautious course is doing wudu — as the answer details the weighing."
  ur: "خون عطیہ سے وضو؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21947، 16 جنوری 2007)⁩ کے مطابق حنفی حنبلی ٹوٹنا مانتے ہیں؛ احتیاط وضو ہے۔"
  es: "Un interlocutor preguntó si un donante de sangre debe realizar la ablución (wudu) para la oración o si su ablución es válida. El Dr. Salah al-Sawi (fatwa n.° 21947, 16 de enero de 2007) respondió que los dos imanes Abu Hanifa y Ahmad sostenían que una cantidad abundante de sangre invalida la ablución, mientras que Shafi'i y Malik sostenían que no; lo prudente es realizar la ablución, como se detalla en la respuesta sobre el cálculo."
