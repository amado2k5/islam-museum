id: work/fatwa-aliftaa-jo-recycling-plastic-caps-for-charity
class: work
kind: fatwa
label: { ar: "جمع الأغطية البلاستيكية وإعادة تدويرها لدعم الأطفال ذوي الإعاقة", en: "Collecting and recycling plastic caps to support disabled children", ur: "معذور بچوں کی مدد کے لیے پلاسٹک کے ڈھکن جمع کر کے ری سائیکل کرنا", es: "Recolectar y reciclar tapones de plástico para ayudar a niños con discapacidad.", fr: "Collecte et recyclage des bouchons en plastique pour soutenir les enfants handicapés", tr: "Engelli çocukları desteklemek için plastik kapakların toplanması ve geri dönüşümü", id: "Mengumpulkan dan mendaur ulang penutup plastik untuk mendukung anak-anak penyandang disabilitas" }
summary:
  ar: "سؤال عن جهة تجمع الأغطية البلاستيكية وتعيد تدويرها حفاظًا على البيئة وتخصص ريعها لدعم الأطفال المصابين بشلل الأطفال، أجابت فيه دائرة الإفتاء العام الأردنية بأن هذه المبادرة من أبواب الخير الداخلة في الصدقات المستحبة التي يثاب عليها المسلم. أجابت الدائرة بأن المحافظة على البيئة محل عناية الشريعة، وذكرت نصوصًا تنهى عن الإفساد في الأرض، واستشهدت بحديث أنس الذي رواه أحمد في غرس الفسيلة ولو قامت القيامة، وبالحديث المتفق عليه في أن من غرس غرسًا فأكل منه طير أو إنسان أو بهيمة كان له به صدقة. وقالت إن أبواب الخير والصدقة كثيرة تشمل كل معروف أقره الشرع ورغب فيه، واستشهدت بحديث رواه البخاري في أن كل معروف صدقة. وخلصت إلى أن جمع العبوات البلاستيكية لإعادة تدويرها وتخصيص ريعها لدعم الأطفال ذوي الإعاقة من أبواب الخير الداخلة في الصدقات المستحبة، لما فيه من المحافظة على البيئة وإعانة المحتاجين، وعدّته من السنن الحسنة، مستشهدة بحديث رواه مسلم في أجر من سن سنة حسنة."
  en: "A question about a group that collects and recycles plastic caps to protect the environment and gives the proceeds to support children disabled by polio, in which Jordan's General Iftaa Department answered that the initiative is one of the doors of good that fall under recommended charity, for which a Muslim is rewarded. The Department answered that protecting the environment is a matter the Sharia attends to, citing texts that forbid corruption on earth, the hadith of Anas reported by Ahmad about planting a sapling even if the Hour is at hand, and the agreed-upon hadith that whoever plants something from which a bird, a person or an animal eats has a charity by it. It said the doors of good and charity are many and include every good deed the Sharia approves and encourages, citing a hadith reported by al-Bukhari that every good deed is charity. It concluded that collecting plastic containers for recycling and giving the proceeds to support disabled children is one of the doors of good within recommended charity, because it preserves the environment and helps those in need, and counted it among the good practices Islam calls for, citing a hadith reported by Muslim on the reward of one who starts a good practice."
  ur: "ایک ادارے کے بارے میں سوال جو ماحول کے تحفظ کے لیے پلاسٹک کے ڈھکن جمع کر کے ری سائیکل کرتا ہے اور اس کی آمدنی پولیو سے معذور بچوں کی مدد کے لیے مختص کرتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ مہم خیر کے ان دروازوں میں سے ہے جو مستحب صدقات میں داخل ہیں اور جن پر مسلمان کو ثواب ملتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ماحول کا تحفظ شریعت کی توجہ کا موضوع ہے، اس نے زمین میں فساد سے روکنے والی نصوص، قیامت قریب ہو تب بھی پودا لگانے کے بارے میں احمد کی روایت کردہ انس کی حدیث، اور اس متفق علیہ حدیث کا حوالہ دیا کہ جو کچھ لگائے اور اس سے پرندہ، انسان یا جانور کھائے تو یہ اس کے لیے صدقہ ہے۔ اس نے کہا کہ خیر اور صدقے کے دروازے بہت ہیں اور ہر اس نیکی کو شامل ہیں جسے شریعت نے منظور کیا اور جس کی ترغیب دی، اور بخاری کی روایت کردہ حدیث کا حوالہ دیا کہ ہر نیکی صدقہ ہے۔ اس نے نتیجہ نکالا کہ پلاسٹک کی بوتلیں ری سائیکلنگ کے لیے جمع کرنا اور اس کی آمدنی معذور بچوں کی مدد کے لیے مختص کرنا مستحب صدقات میں داخل خیر کا دروازہ ہے، کیونکہ اس میں ماحول کا تحفظ اور ضرورت مندوں کی مدد ہے، اور اسے ان اچھے طریقوں میں شمار کیا جن کی اسلام نے دعوت دی، اور اچھا طریقہ شروع کرنے والے کے اجر کے بارے میں مسلم کی روایت کردہ حدیث کا حوالہ دیا۔"
  es: "Una pregunta sobre un grupo que recolecta y recicla tapas de plástico para proteger el medio ambiente y dona las ganancias para apoyar a niños discapacitados por la polio, a la que el Departamento General de Iftaa de Jordania respondió que la iniciativa es una de las puertas del bien que se incluyen en la caridad recomendada, por la cual un musulmán es recompensado. El Departamento respondió que la protección del medio ambiente es un asunto que la Sharia contempla, citando textos que prohíben la corrupción en la tierra, el hadiz de Anas, narrado por Ahmad, sobre plantar un retoño incluso si la Hora está cerca, y el hadiz consensuado que dice que quien planta algo de lo que se alimenta un ave, una persona o un animal, realiza una obra de caridad. Dijo que las puertas del bien y la caridad son muchas e incluyen toda buena acción que la Sharia aprueba y fomenta, citando un hadiz narrado por al-Bujari que dice que toda buena acción es caridad. Concluyó que recolectar envases de plástico para reciclar y destinar los ingresos a apoyar a niños discapacitados es una de las buenas prácticas dentro de la caridad recomendada, porque preserva el medio ambiente y ayuda a los necesitados, y la incluyó entre las buenas prácticas que el Islam promueve, citando un hadiz narrado por Muslim sobre la recompensa de quien inicia una buena práctica."
  fr: "Une question portait sur un groupe qui collecte et recycle les bouchons en plastique afin de protéger l'environnement et reverse les bénéfices à des enfants handicapés par la polio. Le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que cette initiative relève des bonnes actions, considérées comme des aumônes recommandées et pour lesquelles un musulman est récompensé. Le Département a expliqué que la protection de l'environnement est une obligation de la charia, citant des textes interdisant la corruption, le hadith d'Anas rapporté par Ahmad concernant la plantation d'un arbre même à l'approche de l'Heure, et le hadith consensuel selon lequel quiconque plante une plante dont se nourrissent un oiseau, une personne ou un animal accomplit une aumône. Il a ajouté que les bonnes actions et les aumônes sont nombreuses et comprennent tout acte de bienfaisance approuvé et encouragé par la charia, citant un hadith rapporté par al-Bukhari selon lequel toute bonne action est une aumône. Elle a conclu que la collecte de contenants en plastique en vue de leur recyclage et le versement des recettes pour soutenir les enfants handicapés constituent l'une des voies du bien au sein de la charité recommandée, car elle préserve l'environnement et aide les personnes dans le besoin, et l'a comptée parmi les bonnes pratiques préconisées par l'islam, citant un hadith rapporté par Muslim sur la récompense de celui qui instaure une bonne pratique."
  tr: "Plastik örtüleri toplayan ve çevreyi korumak için geri dönüştüren ve gelirlerini çocuk felci hastası çocuklara destek için ayıran bir kuruluş hakkında soru sorulduğunda, Ürdün Genel Fetva Dairesi, bu girişimin Müslümanların ödüllendirildiği önerilen hayır kurumlarında yer alan iyilik kapılarından biri olduğunu yanıtladı. Daire, çevrenin korunmasının Şeriat meselesi olduğunu, yeryüzünde yozlaşmayı yasaklayan metinleri aktardı, Ahmad'ın Kıyamet Günü olsa bile fidan dikme konusundaki Anas hadisini ve kuş, insan ya da hayvan tarafından fidan dikip yerse, ona sadaka verdiğini kabul etti. İyilik ve sadakat bölümlerinin çok olduğu, Şeriat'ın onayladığı ve arzuladığı her iyi işi kapsadığını belirtti ve El-Buhari'nin anlattığı her iyi işin sadaka olduğunu belirten bir hadisi aktardı. Plastik kapların geri dönüşüm için toplanmasının ve gelirin engelli çocuklara destek için tahsis edilmesinin, çevre koruması ve ihtiyaç sahiplerine yardım sağlaması nedeniyle önerilen hayır kurumlarına dahil edilen hayır işleri arasında olduğunu belirtti. Bunu iyi bir sünnet olarak değerlendirdi ve Müslüman'ın iyi bir sünnetin ödülü hakkında anlattığı bir hadisi aktardı."
  id: "Sebuah pertanyaan tentang sebuah organisasi yang mengumpulkan penutup plastik dan mendaur ulangnya untuk melindungi lingkungan serta mengalokasikan hasilnya untuk mendukung anak-anak yang menderita polio, Departemen Fatwa Umum Yordania menanggapi bahwa inisiatif ini adalah salah satu pintu kebaikan yang termasuk dalam badan amal yang direkomendasikan yang menjadi penghargaan bagi seorang Muslim. Departemen tersebut menjawab bahwa pelestarian lingkungan adalah urusan kepedulian Syariah, mengutip teks yang melarang korupsi di bumi, mengutip hadits Anas yang diceritakan oleh Ahmad tentang menanam bibit pohon meskipun Hari Penghakiman terjadi, dan hadits yang disepakati bahwa siapa pun menanam bibit dan memakannya oleh burung, manusia, atau hewan, ia memberinya sedekah. Dinas tersebut menyatakan bahwa bab kebaikan dan amal sangat banyak, mencakup setiap perbuatan baik yang telah disetujui dan diinginkan Syariah, serta mengutip hadits yang diceritakan oleh Al-Bukhari yang menyatakan bahwa setiap perbuatan baik adalah amal. Ia menyimpulkan bahwa mengumpulkan wadah plastik untuk didaur ulang dan mengalokasikan hasilnya untuk mendukung anak-anak penyandang disabilitas termasuk dalam tindakan amal yang direkomendasikan, karena pelestarian lingkungan dan bantuan bagi mereka yang membutuhkan. Ia menganggapnya sebagai Sunnah yang baik, mengutip hadits yang diceritakan oleh Muslim tentang hadiah Sunnah yang baik."
