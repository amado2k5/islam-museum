id: work/fatwa-aliftaa-jo-recycling-plastic-caps-for-charity
class: work
kind: fatwa
label: { ar: "جمع الأغطية البلاستيكية وإعادة تدويرها لدعم الأطفال ذوي الإعاقة", en: "Collecting and recycling plastic caps to support disabled children", ur: "معذور بچوں کی مدد کے لیے پلاسٹک کے ڈھکن جمع کر کے ری سائیکل کرنا" }
summary:
  ar: "سؤال عن جهة تجمع الأغطية البلاستيكية وتعيد تدويرها حفاظًا على البيئة وتخصص ريعها لدعم الأطفال المصابين بشلل الأطفال، أجابت فيه دائرة الإفتاء العام الأردنية بأن هذه المبادرة من أبواب الخير الداخلة في الصدقات المستحبة التي يثاب عليها المسلم. أجابت الدائرة بأن المحافظة على البيئة محل عناية الشريعة، وذكرت نصوصًا تنهى عن الإفساد في الأرض، واستشهدت بحديث أنس الذي رواه أحمد في غرس الفسيلة ولو قامت القيامة، وبالحديث المتفق عليه في أن من غرس غرسًا فأكل منه طير أو إنسان أو بهيمة كان له به صدقة. وقالت إن أبواب الخير والصدقة كثيرة تشمل كل معروف أقره الشرع ورغب فيه، واستشهدت بحديث رواه البخاري في أن كل معروف صدقة. وخلصت إلى أن جمع العبوات البلاستيكية لإعادة تدويرها وتخصيص ريعها لدعم الأطفال ذوي الإعاقة من أبواب الخير الداخلة في الصدقات المستحبة، لما فيه من المحافظة على البيئة وإعانة المحتاجين، وعدّته من السنن الحسنة، مستشهدة بحديث رواه مسلم في أجر من سن سنة حسنة."
  en: "A question about a group that collects and recycles plastic caps to protect the environment and gives the proceeds to support children disabled by polio, in which Jordan's General Iftaa Department answered that the initiative is one of the doors of good that fall under recommended charity, for which a Muslim is rewarded. The Department answered that protecting the environment is a matter the Sharia attends to, citing texts that forbid corruption on earth, the hadith of Anas reported by Ahmad about planting a sapling even if the Hour is at hand, and the agreed-upon hadith that whoever plants something from which a bird, a person or an animal eats has a charity by it. It said the doors of good and charity are many and include every good deed the Sharia approves and encourages, citing a hadith reported by al-Bukhari that every good deed is charity. It concluded that collecting plastic containers for recycling and giving the proceeds to support disabled children is one of the doors of good within recommended charity, because it preserves the environment and helps those in need, and counted it among the good practices Islam calls for, citing a hadith reported by Muslim on the reward of one who starts a good practice."
  ur: "ایک ادارے کے بارے میں سوال جو ماحول کے تحفظ کے لیے پلاسٹک کے ڈھکن جمع کر کے ری سائیکل کرتا ہے اور اس کی آمدنی پولیو سے معذور بچوں کی مدد کے لیے مختص کرتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ مہم خیر کے ان دروازوں میں سے ہے جو مستحب صدقات میں داخل ہیں اور جن پر مسلمان کو ثواب ملتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ماحول کا تحفظ شریعت کی توجہ کا موضوع ہے، اس نے زمین میں فساد سے روکنے والی نصوص، قیامت قریب ہو تب بھی پودا لگانے کے بارے میں احمد کی روایت کردہ انس کی حدیث، اور اس متفق علیہ حدیث کا حوالہ دیا کہ جو کچھ لگائے اور اس سے پرندہ، انسان یا جانور کھائے تو یہ اس کے لیے صدقہ ہے۔ اس نے کہا کہ خیر اور صدقے کے دروازے بہت ہیں اور ہر اس نیکی کو شامل ہیں جسے شریعت نے منظور کیا اور جس کی ترغیب دی، اور بخاری کی روایت کردہ حدیث کا حوالہ دیا کہ ہر نیکی صدقہ ہے۔ اس نے نتیجہ نکالا کہ پلاسٹک کی بوتلیں ری سائیکلنگ کے لیے جمع کرنا اور اس کی آمدنی معذور بچوں کی مدد کے لیے مختص کرنا مستحب صدقات میں داخل خیر کا دروازہ ہے، کیونکہ اس میں ماحول کا تحفظ اور ضرورت مندوں کی مدد ہے، اور اسے ان اچھے طریقوں میں شمار کیا جن کی اسلام نے دعوت دی، اور اچھا طریقہ شروع کرنے والے کے اجر کے بارے میں مسلم کی روایت کردہ حدیث کا حوالہ دیا۔"
