label: { ar: "جواب حسان بن ثابت على عصماء بنت مروان", en: "Hassan ibn Thabit's reply to Asma' bint Marwan", es: "Respuesta de Hassan ibn Thabit a Asma' bint Marwan", fr: "Réponse de Hassan ibn Thabit à Asma' bint Marwan", ur: "حسان بن ثابت کا اسماء بنت مروان کو جواب", tr: "Hassan bin Thabit Asmaa bint Marwan'a yanıt", id: "Hassan bin Thabit Balas kepada Asmaa bint Marwan" }
summary:
  ar: "أربعة أبيات على المتقارب يجيب بها حسان عصماء: بنو وائل وبنو واقف وخطمة دون بني الخزرج؛ متى ما دعت سفهاً ويحها بعولتها والمنايا تجيء، فهزّت فتى ماجداً كريم المداخل والمخرج، فضرّجها من نجيع الدماء بعد الهدوّ فلم يأثم."
  en: "Four verses in which Hassan answers Asma': Banu Wa'il, Banu Waqif and Khatma are beneath Banu al-Khazraj; whenever she called out in folly, woe to her, with her wailing while the fates came on, she stirred a noble young man of honourable comings and goings, who stained her with dark blood after nightfall and incurred no sin."
  es: "Cuatro versículos en los que Hassan responde a Asma': Banu Wa'il, Banu Waqif y Khatma están por debajo de Banu al-Khazraj; cada vez que ella gritaba en su locura, ¡ay de ella!, con sus lamentos mientras los destinos seguían su curso, ella conmovía a un noble joven de honorables idas y venidas, quien la manchaba con sangre oscura después del anochecer y no incurría en pecado alguno."
  fr: "Quatre versets dans lesquels Hassan répond à Asma': Banu Wa'il, Banu Waqif et Khatma sont en dessous de Banu al-Khazraj; chaque fois qu'elle criait follement, malheur à elle, avec ses lamentations tandis que les destins s'accomplissaient, elle excitait un jeune homme noble aux allées et venues honorables, qui la souillait de sang noir après la tombée de la nuit et n'encourait aucun péché."
  ur: "چار آیات جن میں حسن اسماء کا جواب دیتے ہیں: بنو وائل، بنو وکیف اور خطمہ بنو الخزرج کے نیچے ہیں۔ جب بھی اس نے حماقت میں پکارا، اس پر افسوس، قسمت کے آنے کے وقت اس نے اپنی آہ و بکا کے ساتھ، اس نے ایک معزز نوجوان کو ابھارا، جس نے رات کے بعد اسے سیاہ خون سے رنگ دیا اور اس نے کوئی گناہ نہیں کیا۔"
  tr: "Cevap verene yakın olan kişi üzerine dört ayet vardır, Hasan 'Asma' diye cevap verir: Banu Wa'il, Banu Wa'if ve Banu Khazraj olmadan Khatmah; aptallığı onu çağırdığında kadındır ve ölüm gelir, bu yüzden soylu bir genci soylu giriş-çıkışlarla sarstı, o da sakinlikten sonra onu akan kandan sarstı, böylece günah işlemedi."
  id: "Empat ayat untuk orang yang dekat dengan yang menjawab, Hassan menjawab 'Asma': Banu Wa'il, Banu Wa'if, dan Khatmah tanpa Banu Khazraj; setiap kali kebodohannya memanggilnya, dia adalah wanita dan kematian datang, maka dia mengguncang seorang pemuda bangsawan dengan pintu masuk dan keluar yang mulia, dan dia mengguncang dia dari darah yang mengalir setelah tenang, sehingga dia tidak berdosa."
