summary:
  ar: "أربعة أبيات على المتقارب يجيب بها حسان عصماء: بنو وائل وبنو واقف وخطمة دون بني الخزرج؛ متى ما دعت سفهاً ويحها بعولتها والمنايا تجيء، فهزّت فتى ماجداً كريم المداخل والمخرج، فضرّجها من نجيع الدماء بعد الهدوّ فلم يأثم."
  en: "Four verses in which Hassan answers Asma': Banu Wa'il, Banu Waqif and Khatma are beneath Banu al-Khazraj; whenever she called out in folly, woe to her, with her wailing while the fates came on, she stirred a noble young man of honourable comings and goings, who stained her with dark blood after nightfall and incurred no sin."
