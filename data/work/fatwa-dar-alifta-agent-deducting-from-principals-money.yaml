id: work/fatwa-dar-alifta-agent-deducting-from-principals-money
class: work
kind: fatwa
label: { ar: "حكم خصم الوكيل لمبلغ من مال الموكل دون علمه مقابل عمل", en: "An agent deducting money from the principal's proceeds without his knowledge", ur: "وکیل کا موکل کے مال سے اس کی لاعلمی میں کام کے عوض رقم کاٹنے کا حکم" }
summary:
  ar: "سؤال من رجل باع سيارته لشخص ثم قبل أن يبيعها نيابةً عنه مع التزامه بمصاريف استخراج التراخيص البالغة ثلاثين ألفًا، فباعها بأربعمائة وخمسين ألفًا وأخبر الموكل أن الثمن أربعمائة وعشرون ألفًا واحتفظ بالباقي للتراخيص، وسأل عن حكم ذلك وعن أخذ ما يتبقى أجرًا على بيعها، أجابت فيه دار الإفتاء المصرية بأنه يلزمه شرعًا تسليم كامل الثمن الحقيقي إلى الموكل، ولا يجوز له إخباره بثمن أقل ولا الاحتفاظ بالثلاثين ألفًا أو جزء منها، لأنها من حق الموكل ولأنه التزم بمصاريف التراخيص من ماله ولم يُشترط له أجر، إلا إذا وهبه الموكل شيئًا منها بعد علمه بحقيقة الحال ورضاه. بيّنت الدار أن يد الوكيل على مال موكله يد أمانة، وأن المعاملة عقد وكالة بالبيع أجمع الفقهاء على جوازه، وأن ثمن المبيع ملك خالص للموكل في المذاهب الأربعة، وأن إخفاء الثمن الحقيقي كذب وغش وخيانة للأمانة، مستدلة بحديث البيّعان بالخيار وحديث من غشّنا فليس منا وقاعدة لا ضرر ولا ضرار، وبأن مال المسلم لا يحل إلا بطيب نفسه، وأن عمل الوكيل الذي لم يشترط أجرًا يُحمل على التبرع والمعاونة."
  en: "A question from a man who sold his car to someone and later agreed to sell it on the buyer's behalf, undertaking to pay the licensing costs of thirty thousand; he sold it for four hundred and fifty thousand, told the principal the price was four hundred and twenty thousand, and kept the difference for the licences, and asked about this and about keeping what remained as a fee for selling. Dar al-Ifta al-Misriyya answered that he is bound in sharia to hand the principal the full real price, may not report a lower price, and may not keep the thirty thousand or any part of it, because it belongs to the principal and because he undertook the licensing costs from his own money and no fee was stipulated, unless the principal gives him some of it after learning the truth and consenting willingly. Dar al-Ifta explained that an agent's possession of his principal's property is a possession of trust, that the transaction is an agency to sell, permitted by consensus, that the price of the goods belongs wholly to the principal in all four schools, and that concealing the real price is lying, deceit and betrayal of trust; it cited the hadith that the two parties to a sale have a choice while together and are blessed if they are truthful and open, the hadith that whoever deceives us is not of us, the rule that there is no harm and no reciprocating harm, the principle that a Muslim's property is lawful only with his willing consent, and the rule that an agent who stipulated no fee is treated as a volunteer and helper."
  ur: "ایک شخص کا سوال جس نے اپنی گاڑی کسی کو بیچی اور بعد میں خریدار کی طرف سے اسے بیچنے پر رضامند ہوا، تیس ہزار کے لائسنس اخراجات اپنے ذمے لیتے ہوئے؛ اس نے گاڑی چار لاکھ پچاس ہزار میں بیچی، موکل کو قیمت چار لاکھ بیس ہزار بتائی اور فرق لائسنس کے لیے اپنے پاس رکھا، اور اس کا حکم اور باقی رقم کو فروخت کی اجرت کے طور پر رکھنے کا حکم پوچھا۔ دار الافتاء مصر نے جواب دیا کہ اس پر شرعاً لازم ہے کہ موکل کو پوری حقیقی قیمت دے، کم قیمت بتانا جائز نہیں، اور تیس ہزار یا اس کا کوئی حصہ رکھنا جائز نہیں، کیونکہ یہ موکل کا حق ہے اور اس نے لائسنس کے اخراجات اپنے مال سے ادا کرنے کا وعدہ کیا تھا اور کوئی اجرت مقرر نہ ہوئی تھی، سوائے اس کے کہ موکل حقیقت جاننے اور خوشدلی سے راضی ہونے کے بعد اس میں سے کچھ ہبہ کر دے۔ دار الافتاء نے بیان کیا کہ وکیل کا موکل کے مال پر قبضہ امانت کا قبضہ ہے، یہ معاملہ بیع کی وکالت کا عقد ہے جس کے جواز پر فقہا کا اجماع ہے، مبیع کی قیمت چاروں مذاہب میں خالص موکل کی ملکیت ہے، اور حقیقی قیمت چھپانا جھوٹ، دھوکا اور امانت میں خیانت ہے؛ اس نے اس حدیث سے استدلال کیا کہ بیع کے دونوں فریق جدا ہونے تک اختیار رکھتے ہیں اور سچ اور وضاحت پر ان کے لیے برکت ہے، اس حدیث سے کہ جو ہمیں دھوکا دے وہ ہم میں سے نہیں، قاعدہ لا ضرر ولا ضرار، اس اصول سے کہ مسلمان کا مال اس کی خوشدلی کے بغیر حلال نہیں، اور اس قاعدے سے کہ جس وکیل نے اجرت مقرر نہ کی اس کا کام تبرع اور تعاون سمجھا جاتا ہے۔"
