id: work/fatwa-dar-alifta-agent-deducting-from-principals-money
class: work
kind: fatwa
label: { ar: "حكم خصم الوكيل لمبلغ من مال الموكل دون علمه مقابل عمل", en: "An agent deducting money from the principal's proceeds without his knowledge", ur: "وکیل کا موکل کے مال سے اس کی لاعلمی میں کام کے عوض رقم کاٹنے کا حکم", es: "Un agente que deduce dinero de las ganancias del principal sin su conocimiento.", fr: "Un agent qui prélève de l'argent sur les gains du mandant à son insu.", tr: "Temsilcinin, asıl kişinin bilgisi olmadan para kesip karşılığında iş karşılığında bir miktar kesmesine karar verilmesi", id: "Memutuskan agen memotong sejumlah uang dari prinsipal tanpa sepengetahuan mereka sebagai imbalan atas pekerjaan" }
summary:
  ar: "سؤال من رجل باع سيارته لشخص ثم قبل أن يبيعها نيابةً عنه مع التزامه بمصاريف استخراج التراخيص البالغة ثلاثين ألفًا، فباعها بأربعمائة وخمسين ألفًا وأخبر الموكل أن الثمن أربعمائة وعشرون ألفًا واحتفظ بالباقي للتراخيص، وسأل عن حكم ذلك وعن أخذ ما يتبقى أجرًا على بيعها، أجابت فيه دار الإفتاء المصرية بأنه يلزمه شرعًا تسليم كامل الثمن الحقيقي إلى الموكل، ولا يجوز له إخباره بثمن أقل ولا الاحتفاظ بالثلاثين ألفًا أو جزء منها، لأنها من حق الموكل ولأنه التزم بمصاريف التراخيص من ماله ولم يُشترط له أجر، إلا إذا وهبه الموكل شيئًا منها بعد علمه بحقيقة الحال ورضاه. بيّنت الدار أن يد الوكيل على مال موكله يد أمانة، وأن المعاملة عقد وكالة بالبيع أجمع الفقهاء على جوازه، وأن ثمن المبيع ملك خالص للموكل في المذاهب الأربعة، وأن إخفاء الثمن الحقيقي كذب وغش وخيانة للأمانة، مستدلة بحديث البيّعان بالخيار وحديث من غشّنا فليس منا وقاعدة لا ضرر ولا ضرار، وبأن مال المسلم لا يحل إلا بطيب نفسه، وأن عمل الوكيل الذي لم يشترط أجرًا يُحمل على التبرع والمعاونة."
  en: "A question from a man who sold his car to someone and later agreed to sell it on the buyer's behalf, undertaking to pay the licensing costs of thirty thousand; he sold it for four hundred and fifty thousand, told the principal the price was four hundred and twenty thousand, and kept the difference for the licences, and asked about this and about keeping what remained as a fee for selling. Dar al-Ifta al-Misriyya answered that he is bound in sharia to hand the principal the full real price, may not report a lower price, and may not keep the thirty thousand or any part of it, because it belongs to the principal and because he undertook the licensing costs from his own money and no fee was stipulated, unless the principal gives him some of it after learning the truth and consenting willingly. Dar al-Ifta explained that an agent's possession of his principal's property is a possession of trust, that the transaction is an agency to sell, permitted by consensus, that the price of the goods belongs wholly to the principal in all four schools, and that concealing the real price is lying, deceit and betrayal of trust; it cited the hadith that the two parties to a sale have a choice while together and are blessed if they are truthful and open, the hadith that whoever deceives us is not of us, the rule that there is no harm and no reciprocating harm, the principle that a Muslim's property is lawful only with his willing consent, and the rule that an agent who stipulated no fee is treated as a volunteer and helper."
  ur: "ایک شخص کا سوال جس نے اپنی گاڑی کسی کو بیچی اور بعد میں خریدار کی طرف سے اسے بیچنے پر رضامند ہوا، تیس ہزار کے لائسنس اخراجات اپنے ذمے لیتے ہوئے؛ اس نے گاڑی چار لاکھ پچاس ہزار میں بیچی، موکل کو قیمت چار لاکھ بیس ہزار بتائی اور فرق لائسنس کے لیے اپنے پاس رکھا، اور اس کا حکم اور باقی رقم کو فروخت کی اجرت کے طور پر رکھنے کا حکم پوچھا۔ دار الافتاء مصر نے جواب دیا کہ اس پر شرعاً لازم ہے کہ موکل کو پوری حقیقی قیمت دے، کم قیمت بتانا جائز نہیں، اور تیس ہزار یا اس کا کوئی حصہ رکھنا جائز نہیں، کیونکہ یہ موکل کا حق ہے اور اس نے لائسنس کے اخراجات اپنے مال سے ادا کرنے کا وعدہ کیا تھا اور کوئی اجرت مقرر نہ ہوئی تھی، سوائے اس کے کہ موکل حقیقت جاننے اور خوشدلی سے راضی ہونے کے بعد اس میں سے کچھ ہبہ کر دے۔ دار الافتاء نے بیان کیا کہ وکیل کا موکل کے مال پر قبضہ امانت کا قبضہ ہے، یہ معاملہ بیع کی وکالت کا عقد ہے جس کے جواز پر فقہا کا اجماع ہے، مبیع کی قیمت چاروں مذاہب میں خالص موکل کی ملکیت ہے، اور حقیقی قیمت چھپانا جھوٹ، دھوکا اور امانت میں خیانت ہے؛ اس نے اس حدیث سے استدلال کیا کہ بیع کے دونوں فریق جدا ہونے تک اختیار رکھتے ہیں اور سچ اور وضاحت پر ان کے لیے برکت ہے، اس حدیث سے کہ جو ہمیں دھوکا دے وہ ہم میں سے نہیں، قاعدہ لا ضرر ولا ضرار، اس اصول سے کہ مسلمان کا مال اس کی خوشدلی کے بغیر حلال نہیں، اور اس قاعدے سے کہ جس وکیل نے اجرت مقرر نہ کی اس کا کام تبرع اور تعاون سمجھا جاتا ہے۔"
  es: "Una pregunta de un hombre que vendió su coche a alguien y luego acordó venderlo en nombre del comprador, comprometiéndose a pagar los costos de licencia de treinta mil; lo vendió por cuatrocientos cincuenta mil, le dijo al principal que el precio era de cuatrocientos veinte mil, y se quedó con la diferencia para las licencias, y preguntó sobre esto y sobre quedarse con lo que quedaba como comisión por la venta. Dar al-Ifta al-Misriyya respondió que está obligado por la sharia a entregar al principal el precio real completo, no puede informar un precio más bajo, y no puede quedarse con los treinta mil ni ninguna parte de ellos, porque pertenecen al principal y porque asumió los costos de licencia con su propio dinero y no se estipuló ninguna comisión, a menos que el principal le dé una parte después de conocer la verdad y consentir voluntariamente. Dar al-Ifta explicó que la posesión de la propiedad de su principal por parte de un agente es una posesión de confianza, que la transacción es una agencia de venta, permitida por consentimiento, que el precio de los bienes pertenece enteramente al principal en las cuatro escuelas, y que ocultar el precio real es mentir, engañar y traicionar la confianza; Citó el hadiz de que las dos partes en una venta tienen la opción de elegir mientras están juntas y son bendecidas si son veraces y abiertas, el hadiz de que quien nos engaña no es de los nuestros, la regla de que no hay daño ni daño recíproco, el principio de que la propiedad de un musulmán es lícita solo con su consentimiento voluntario, y la regla de que un agente que no estipuló ninguna tarifa es tratado como un voluntario y un ayudante."
  fr: "Un homme qui avait vendu sa voiture et s'était ensuite engagé à la revendre pour le compte de l'acheteur, prenant en charge les frais d'immatriculation d'un montant de trente mille, a posé une question. Il l'a vendue quatre cent cinquante mille, a déclaré au vendeur que le prix était de quatre cent vingt mille et a conservé la différence pour les frais d'immatriculation. Il a alors demandé des précisions sur cette transaction et sur la possibilité de conserver le reste à titre de commission. Dar al-Ifta al-Misriyya a répondu que, selon la charia, il est tenu de remettre au vendeur l'intégralité du prix réel, qu'il ne peut déclarer un prix inférieur et qu'il ne peut conserver les trente mille, ni même une partie de cette somme, car elle appartient au vendeur. En effet, l'homme a pris en charge les frais d'immatriculation sur ses propres deniers et aucune commission n'avait été stipulée, à moins que le vendeur ne lui en reverse une partie après avoir pris connaissance de la vérité et y avoir consenti librement. Dar al-Ifta a expliqué que la possession par un mandataire des biens de son mandant est une possession fiduciaire, que la transaction constitue un mandat de vente, autorisé par consensus, que le prix des biens appartient entièrement au mandant dans les quatre écoles de pensée, et que dissimuler le prix réel constitue un mensonge, une tromperie et un abus de confiance; l’institution a cité le hadith selon lequel les deux parties à une vente ont le choix lorsqu’elles sont ensemble et sont bénies si elles sont sincères et ouvertes, le hadith selon lequel celui qui nous trompe n’est pas des nôtres, la règle selon laquelle il n’y a pas de préjudice ni de préjudice réciproque, le principe selon lequel les biens d’un musulman ne sont licites qu’avec son consentement libre et éclairé, et la règle selon laquelle un mandataire qui n’a pas exigé d’honoraires est considéré comme un bénévole et un assistant."
  tr: "Bir adamın arabasını bir kişiye satıp ardından onun adına satmayı kabul edip otuz bin lisans masraflarını karşılamak zorunda kaldığını sormuştur. Arabayı dört yüz elli bin dolara satmış ve ana kişiye fiyatın dört yüz yirmi bin olduğunu, kalanını ise ruhsatlar için sakladığını bildirmiştir. Bu konuda kararı ve satış ücretinin kalan kısmını alıp almadığını sordu. Mısırlı Dar al-Ifta, asıl paraya tam gerçek fiyatı vermek dini yükümlülüğü olduğunu ve ona daha düşük fiyat söylemesinin veya otuz bin ya da bir kısmını tutmasının yasak olduğunu, çünkü bunun asıl kişinin hakkı olduğunu ve ruhsatlandırma masraflarını kendi parasından taahhüt ettiğini ve herhangi bir ödeme yapmadığını, ancak asıl kişinin gerçeği bilip rızasını verdikten sonra ona bir kısmını hediye etmediğini söyledi. Meclis, temsilcinin asıl malını devretmesinin bir güven eli olduğunu, işlemin hukukçuların oybirliğiyle izin verdiği bir vekaletname sözleşmesi olduğunu, satılan eşyanın fiyatının dört düşünce okuluna göre müdürün münhasır mülkiyeti olduğunu ve gerçek fiyatı gizlemenin yalan, dolandırıcılık ve güven ihlali olduğunu açıkladı. Seçim yoluyla satış hadisi ve 'Bizi kandıran bizden biri değildir' hadisi ile 'Zarar veya karşılıklı zarar yok' kuralını ve bir Müslümanın malının yalnızca kendi iradesiyle yasal olduğunu ve acentenin ücret gerektirmeyen işinin bağış ve yardıma dayandığını belirtti."
  id: "Sebuah pertanyaan dari seorang pria yang menjual mobilnya kepada seseorang lalu menerima untuk menjualnya atas namanya sambil tetap menanggung biaya lisensi tiga puluh ribu. Ia menjualnya seharga empat ratus lima puluh ribu dan memberitahu prinsipal bahwa harganya empat ratus dua puluh ribu dan menyisihkan sisanya untuk lisensi. Ia menanyakan tentang keputusan ini dan tentang mengambil sisa biaya penjualannya. Dar al-Ifta Mesir menjawab bahwa ia secara agama wajib menyerahkan harga riil penuh kepada prinsipal, dan tidak diperbolehkan baginya untuk memberitahu harga yang lebih rendah atau menyimpan tiga puluh ribu atau sebagian, karena itu adalah hak prinsipal dan ia telah berkomitmen untuk biaya lisensi dari uangnya sendiri dan tidak menetapkan pembayaran apapun, kecuali prinsipal memberinya sebagian setelah mengetahui kenyataannya dan menyetujui. Dewan memperjelas bahwa penyerahan agen atas properti prinsipalnya adalah tangan amanah, bahwa transaksi tersebut adalah surat kuasa kontrak jual beli yang diizinkan oleh para ahli hukum secara bulat, bahwa harga barang yang dijual adalah milik eksklusif prinsipal menurut empat aliran pemikiran, dan bahwa menyembunyikan harga sebenarnya adalah kebohongan, penipuan, dan pelanggaran kepercayaan. Dewan mengutip hadits penjualan dengan opsi dan hadis 'Siapa yang menipu kita bukan salah satu dari kita,' serta aturan 'tidak ada kerugian atau kerugian balas,' serta bahwa properti Muslim hanya sah dengan kehendaknya sendiri, dan bahwa pekerjaan agen yang tidak memerlukan biaya didasarkan pada donasi dan bantuan."
