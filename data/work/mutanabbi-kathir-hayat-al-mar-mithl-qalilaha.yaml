label: { ar: "قصيدة المتنبي «أعيدوا صباحي فهو عند الكواعب»", en: "Al-Mutanabbi's ode 'Give back my morning'", es: "La oda de Al-Mutanabbi: \"Devuélveme mi mañana\".", fr: "L'ode d'Al-Mutanabbi « Rendez-moi mon matin »", ur: "المتنبی کا کلام 'میری صبح واپس دو'", tr: "Al-Mutanabbi'nin şiiri: \"Sabahımı geri ver, çünkü Kawa'ib'de\"", id: "Puisi Al-Mutanabbi: \"Kembalilah pagiku, karena itu di Kawa'ib\"" }
summary:
  ar: "قصيدة من الطويل على روي الباء للمتنبي، يمدح فيها أبا القاسم طاهر بن الحسين بن طاهر العلوي كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.225}}."
  en: "An ode in the tawil metre on the rhyme ba by al-Mutanabbi; praising Abu al-Qasim Tahir ibn al-Husayn ibn Tahir al-Alawi, as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.225}}."
  es: "Una oda en metro tawil sobre la rima ba de al-Mutanabbi; alabando a Abu al-Qasim Tahir ibn al-Husayn ibn Tahir al-Alawi, como la introduce la edición de Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.225}}."
  fr: "Une ode en mètre tawil sur la rime ba par al-Mutanabbi; faisant l'éloge d'Abu al-Qasim Tahir ibn al-Husayn ibn Tahir al-Alawi, comme l'indique l'édition Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.225}}."
  ur: "المتنبی کی شاعری با پر تاویل میٹر میں ایک اوڈ؛ ابو القاسم طاہر ابن الحسین ابن طاہر العلوی کی تعریف کرتے ہوئے، جیسا کہ دار بیروت ایڈیشن نے اس کا تعارف کرایا ہے {{حوالہ:دیوان-متنبی-در-بیروت-1983 صفحہ 225}}۔"
  tr: "Al-Tawil'in 'B' harfinin anlatımı üzerine yazdığı bir şiir, burada Ebu el-Kasım Tahir ibn el-Hüseyin ibn Tahir al-Alawi'yi över ve ayrıca Dar Beyrut Diwanı'na tanıtır {{cite:diwan-mutanabbi-dar-beirut-1983 s.225}}."
  id: "Sebuah puisi oleh Al-Tawil tentang narasi huruf 'B' oleh Al-Mutanabbi, di mana ia memuji Abu al-Qasim Tahir ibn al-Husayn ibn Tahir al-Alawi, dan ia juga memperkenalkannya kepada Diwan Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 hlm.225}}."
