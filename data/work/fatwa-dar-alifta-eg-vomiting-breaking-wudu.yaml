id: work/fatwa-dar-alifta-eg-vomiting-breaking-wudu
class: work
kind: fatwa
label: { ar: "حكم نقض الوضوء بالقيء", en: "Does vomiting break wudu?", ur: "کیا قی کرنے سے وضو ٹوٹتا ہے؟", es: "¿Vomitar invalida el wudu?" }
summary:
  ar: "سائلة حامل قيئت الطعام بعد تناوله فسألت عن وضوئها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21756)⁩ أن وضوءها لا ينتقض بقيء الطعام قليلًا كان القيء أو كثيرًا ولا إثم عليها في ذلك على ما فصّل الجواب."
  en: "A pregnant woman vomited food after eating and asked about her wudu. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21756) answered that her wudu is not broken by vomiting food — little or much — and there is no sin on her for it, as the answer details."
  ur: "ایک حاملہ عورت کو کھانا کھانے کے بعد قی آئی؛ اس نے وضو کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21756)⁩ نے جواب دیا کہ قی سے وضو نہیں ٹوٹتا — قلیل ہو یا کثیر — اور اس پر کوئی گناہ نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una mujer embarazada vomitó después de comer y preguntó sobre su ablución (wudu). El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21756) respondió que vomitar comida no invalida su ablución, ya sea poca o mucha, y que no hay pecado en ello, como se detalla en la respuesta."
