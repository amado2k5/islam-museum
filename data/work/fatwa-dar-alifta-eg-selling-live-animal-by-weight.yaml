id: work/fatwa-dar-alifta-eg-selling-live-animal-by-weight
class: work
kind: fatwa
label: { ar: "حكم بيع ما يؤكل من الحيوان وتحديد ثمنه بالوزن وهو حي", en: "Selling an edible animal priced by weight while alive", ur: "زندہ جانور کو وزن کے حساب سے قیمت لگا کر بیچنا", es: "Venta de un animal comestible cuyo precio se calcula por peso mientras está vivo." }
summary:
  ar: "سائل سأل عن بيع ما يؤكل من الحيوان وتحديد ثمنه بالوزن وهو حي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21702)⁩ أن الحيوان من القيميات التي يكفي للعلم بها عند بيعها التعيين والمشاهدة وبيّن الجواب حكم اتخاذ الوزن طريقة لتحديد الثمن على وجهه."
  en: "A questioner asked about selling an edible animal with its price set by weight while still alive. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21702) answered that livestock is among the valuables identified sufficiently by specification and sight at sale; the answer sets out the ruling on using weight to fix the price."
  ur: "ایک سائل نے زندہ جانور کو وزن کے حساب سے قیمت مقرر کر کے بیچنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21702)⁩ نے جواب دیا کہ جانور ان چیزوں میں ہے جن کی تعیین و مشاہدہ کافی ہے؛ وزن سے قیمت مقرر کرنے کا حکم جواب میں بیان ہوا۔"
  es: "Un consultante preguntó sobre la venta de un animal comestible cuyo precio se fija según su peso mientras aún está vivo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21702) respondió que el ganado se encuentra entre los bienes valiosos que se identifican suficientemente mediante su especificación y a simple vista en el momento de la venta; la respuesta expone la normativa sobre el uso del peso para fijar el precio."
