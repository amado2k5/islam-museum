label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن الاستثمار في الأسهم والوحدات الاستثمارية", en: "IIFA resolution on investing in shares and investment units", ur: "اکیڈمی کی قرارداد: حصص اور سرمایہ کاری یونٹس میں سرمایہ کاری", es: "Resolución de la IIFA sobre la inversión en acciones y unidades de inversión.", fr: "Résolution de l'IIFA sur l'investissement en actions et en parts de placement", tr: "Uluslararası İslami Fiqh Akademisi'nin hisse ve yatırım birimlerine yatırım ile ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai investasi saham dan unit investasi" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته التاسعة ⁦(أبوظبي، أبريل 1995م)⁩: تأجيل النظر في الاستثمار في الأسهم والوحدات الاستثمارية لإعداد مزيد من الدراسات تستوعب الجوانب الفنية والشرعية حسب توصية الدورة الثامنة، والاستفادة من الأبحاث الثلاثة عن الصناديق والإصدارات الاستثمارية لإعداد اللائحة."
  en: "IIFA's ninth-session resolution (Abu Dhabi, April 1995) on investing in shares and investment units: it deferred the question for further studies covering the technical and sharia aspects, per the eighth session's recommendation, drawing on three papers about investment funds and issues to prepare the charter."
  ur: "اکیڈمی کی نویں مجلس کی قرارداد ⁦(ابوظہبی، اپریل 1995ء)⁩: حصص اور سرمایہ کاری یونٹس پر فیصلہ مؤخر؛ تین تحقیقی مقالات کی مدد سے ضوابط تیار ہوں گے۔"
  es: "Resolución de la novena sesión de la IIFA (Abu Dabi, abril de 1995) sobre la inversión en acciones y unidades de inversión: se aplazó la cuestión para realizar estudios adicionales que abarcaran los aspectos técnicos y de la sharia, según la recomendación de la octava sesión, basándose en tres documentos sobre fondos de inversión y cuestiones relacionadas para elaborar la carta."
  fr: "Résolution de la neuvième session de l'IIFA (Abou Dhabi, avril 1995) sur l'investissement dans des actions et des parts d'investissement: elle a reporté la question à des études complémentaires couvrant les aspects techniques et de la charia, conformément à la recommandation de la huitième session, en s'appuyant sur trois documents sur les fonds d'investissement et les questions pour préparer la charte."
  tr: "Uluslararası İslami Fiqh Akademisi'nin dokuzuncu oturumunda (Abu Dabi, Nisan 1995) karar aldığı karar: Sekizinci oturumun önerisine göre teknik ve Şeriat yönlerini kapsayan ek çalışmaların hazırlanması için hisse senetleri ve yatırım birimlerine yatırım yatırımlarının değerlendirilmesinin ertelenmesi ve düzenlemelerin hazırlanması için yatırım fonları ve ihraçlar üzerine üç araştırma makalesinden yararlanılması."
  id: "Keputusan International Islamic Fiqh Academy pada sesi kesembilan (Abu Dhabi, April 1995): Penundaan pertimbangan investasi di saham dan unit investasi untuk menyiapkan studi lebih lanjut yang mencakup aspek teknis dan Syariah sesuai rekomendasi sesi kedelapan, serta memanfaatkan tiga makalah penelitian tentang dana investasi dan penerbitan untuk menyiapkan regulasi."
