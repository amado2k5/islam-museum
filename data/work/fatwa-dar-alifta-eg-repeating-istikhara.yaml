label: { ar: "حكم تكرار صلاة الاستخارة", en: "Repeating the istikhara prayer", ur: "استخارہ کی نماز دہرانا", es: "Repitiendo la oración istikhara" }
summary:
  ar: "سائل سأل عن تكرار صلاة الاستخارة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21511)⁩ أنه يجوز تكرار صلاة الاستخارة والتكرار يكون بما زاد عن مرة حتى سبع مرات فقد ورد جواز تكرارها سبع مرات على ما فصّل الجواب."
  en: "A questioner asked about repeating the istikhara prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21511) answered that it may be repeated — more than once up to seven times — since repeating it seven times is transmitted as permissible, as the answer details."
  ur: "ایک سائل نے استخارہ کی نماز دہرانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21511)⁩ نے جواب دیا کہ اسے دہرایا جا سکتا ہے ایک سے زائد تا سات مرتبہ کیونکہ سات بار دہرانا منقول ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de repetir la oración de istikhara. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21511) respondió que se puede repetir, más de una vez, hasta siete veces, ya que repetirla siete veces se considera permisible, como se detalla en la respuesta."
