id: work/fatwa-dar-alifta-eg-seventh-share-cow-for-meat
class: work
kind: fatwa
label: { ar: "حكم المشاركة في الأضحية بالسبع في بقرة بقصد طلب اللحم", en: "Taking a seventh-share in a cow just for the meat", ur: "قربانی میں گائے کے ساتویں حصے میں محض گوشت کی نیت سے شرکت", es: "Adquirir una séptima parte de una vaca solo por la carne.", fr: "Prendre un septième d'une vache uniquement pour sa viande" }
summary:
  ar: "سائل سأل عن اشتراك مجموعة في بقرة لكل واحد سبع بعضهم على نية الأضحية وبعضهم على غير ذلك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21928)⁩ أن ذلك جائز وللشارك في اللحم أخذ نصيبه منها على ما فصّل الجواب."
  en: "A questioner asked about a group sharing a cow — a seventh each — some intending the udhiyya and some not. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21928) answered that this is permitted and the partner in meat takes his share, as the answer details."
  ur: "ایک سائل نے ایک گائے میں سات حصوں کی شرکت کا حکم پوچھا — بعض قربانی کی نیت سے اور بعض بغیر۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21928)⁩ نے جواب دیا کہ یہ جائز ہے اور گوشت میں شریک ہونے والا اپنا حصہ لے سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre un grupo que compartía una vaca —cada uno con una séptima parte—, algunos con la intención de realizar la udhiyya y otros no. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21928) respondió que esto está permitido y que quien comparte la carne toma su parte, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le partage d'une vache par un groupe (un septième de chaque animal), certains ayant l'intention de pratiquer l'udhiyya et d'autres non. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21928) a répondu que cela est permis et que le partenaire ayant consommé la viande prend sa part, comme le précise la réponse."
