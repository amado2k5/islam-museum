summary:
  ar: "المعجم الأوسط لسليمان بن أحمد الطبراني، أحد معاجمه الثلاثة؛ قال ابن ناصر الدين كان الطبراني يقول عنه: هو روحي لأنه تعب عليه {cite:shadharat-dhahab p. 30}."
  en: "al-Tabarani's middle mu'jam — the one he himself called 'my soul, for I toiled over it' {cite:shadharat-dhahab p. 30}."
  es: "El mu'jam del medio de al-Tabarani, aquel al que él mismo llamó 'mi alma, porque trabajé arduamente en ella' {cita: shadharat-dhahab p. 30}."
  fr: "Le mu'jam moyen d'al-Tabarani — celui qu'il appelait lui-même « mon âme, car j'ai peiné dessus » {cite:shadharat-dhahab p. 30}."
  ur: "الطبرانی کا درمیانی معجم - جسے وہ خود کہتے ہیں 'میری جان، کیونکہ میں نے اس پر محنت کی'۔ 30}۔"
  tr: "Süleyman bin Ahmed al-Tabarani'nin Orta Sözlüğü, üç sözlüğünden biri; İbn Nasir al-Din şöyle derdi ki, el-Teberni onun hakkında şöyle derdi: O ruhani bir yapıdır çünkü bunu çalıştı {atıf:shadharat-dhahab s. 30}."
  id: "Kamus Tengah oleh Sulayman ibn Ahmad al-Tabarani, salah satu dari tiga kamusnya; Ibn Nasir al-Din mengatakan al-Tabarani biasa berkata tentang dia: Dia spiritual karena dia yang mengerjakannya {sitasi: shadharat-dhahab hlm. 30}."
