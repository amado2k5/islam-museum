label: { ar: "قصيدة المتنبي «صحب الناس قبلنا ذا الزمانا»", en: "Al-Mutanabbi's ode 'People kept company with this age before us'", es: "La oda de Al-Mutanabbi: \"La gente convivió con esta época antes que nosotros\".", fr: "L'ode d'Al-Mutanabbi « Les gens ont côtoyé cette époque avant nous »", ur: "المتنبی کا قول 'لوگ ہم سے پہلے اس زمانے کے ساتھ صحبت رکھتے ہیں'" }
summary:
  ar: "قصيدة من الخفيف على روي النون للمتنبي، قالها بمصر ولم ينشدها الأسود كافوراً ولم يذكره فيها كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.474}}."
  en: "An ode in the khafif metre on the rhyme nun by al-Mutanabbi; said in Egypt, not recited to Kafur and not naming him, as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.474}}."
  es: "Una oda en metro khafif sobre la rima nun de al-Mutanabbi; dicha en Egipto, no recitada a Kafur y sin nombrarlo, como la introduce la edición de Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.474}}."
  fr: "Une ode en mètre khafif sur la rime nun par al-Mutanabbi; dite en Égypte, non récitée à Kafur et ne le nommant pas, comme l'indique l'édition Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.474}}."
  ur: "المتنبی کی شاعری نون پر خفیف میٹر میں ایک اوڈ؛ مصر میں کہا، کافور کو نہیں پڑھا گیا اور نہ ہی اس کا نام لیا گیا، جیسا کہ دار بیروت ایڈیشن اس کا تعارف کراتا ہے {{حوالہ:دیوان-متنبی-در-بیروت-1983 صفحہ 474}}۔"
