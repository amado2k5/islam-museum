kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 18: كيف صبر الصحابة على تعذيب المشركين؟"
  en: "The Biography of the Messenger of God 2026, episode 18: How the Companions endured the torture of the polytheists"
  ur: "سیرتِ رسول اللہ 2026، قسط 18: صحابہ نے مشرکین کے ظلم و تشدد پر کیسے صبر کیا"
  fr: "La biographie du Messager de Dieu 2026, épisode 18 : Comment les Compagnons ont supporté la torture infligée par les polythéistes"
  es: "La biografía del Mensajero de Dios 2026, episodio 18: Cómo soportaron los Compañeros la tortura de los politeístas"
summary:
  ar: "يفتتح المحاضر الحلقة بترجمة موجزة للصحابي البدري حاطب بن أبي بلتعة، ثم يُتمّ باب سيرة ابن إسحاق عن تحدّيات قريش للنبي، مع ملاحظات ابن هشام اللغوية والردود القرآنية. ثم يقرأ فصل ابن إسحاق عن تعذيب المستضعفين من المسلمين الأوائل، وخبر خباب، ونسب بني زهرة من الكتاب الذي يتّبعه."
  en: "The lecturer opens with a short biography of the Badri Companion Hatib ibn Abi Balta'a, then finishes the section of Ibn Ishaq's Sira on the Quraysh's challenges to the Prophet, with Ibn Hisham's language notes and the Qur'anic answers. He then reads Ibn Ishaq's chapter on the torture of the weak among the early Muslims, the Khabbab report, and the lineage of Banu Zuhra from the book he follows."
  ur: "مقرر قسط کا آغاز بدری صحابی حاطب بن ابی بلتعہ کی مختصر سوانح سے کرتے ہیں، پھر ابن اسحاق کی سیرت کا وہ باب مکمل کرتے ہیں جو نبی کے سامنے قریش کے چیلنجوں پر ہے، اس کے ساتھ ابن ہشام کے لغوی حواشی اور قرآنی جوابات بھی آتے ہیں۔ اس کے بعد وہ ابتدائی مسلمانوں میں سے کمزور لوگوں پر تشدد کے بارے میں ابن اسحاق کا باب، خباب کی روایت، اور بنو زہرہ کا نسب اس کتاب سے پڑھتے ہیں جس کی وہ پیروی کرتے ہیں۔"
  fr: "Le conférencier ouvre la séance par une courte biographie du Compagnon de Badr Hatib ibn Abi Balta'a, puis achève la section de la Sira d'Ibn Ishaq sur les défis lancés au Prophète par Quraych, avec les remarques linguistiques d'Ibn Hisham et les réponses coraniques. Il lit ensuite le chapitre d'Ibn Ishaq sur la torture des faibles parmi les premiers musulmans, le récit de Khabbab, et la généalogie des Banu Zuhra tirée du livre qu'il suit."
  es: "El conferenciante abre la sesión con una breve biografía del Compañero de Badr Hatib ibn Abi Balta'a, y luego termina la sección de la Sira de Ibn Ishaq sobre los desafíos de Quraysh al Profeta, con las notas lingüísticas de Ibn Hisham y las respuestas coránicas. Después lee el capítulo de Ibn Ishaq sobre la tortura de los débiles entre los primeros musulmanes, el relato de Khabbab y el linaje de los Banu Zuhra tomado del libro que sigue."
