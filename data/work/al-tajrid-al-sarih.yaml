summary:
  ar: "كتاب شهاب الدين أبي العباس أحمد الشرجي الزبيدي في أحاديث «الجامع الصحيح» للبخاري، وهو الذي شرحه صديق حسن القنوجي في «عون الباري لحل أدلة البخاري» {cite:nayl-awtar-awn-bari-hamish j.5 p. 2}."
  en: "Shihab al-Din Abu al-'Abbas Ahmad al-Sharji al-Zabidi's book on the hadiths of al-Bukhari's al-Jami' al-Sahih, the text on which Siddiq Hasan al-Qannawji wrote 'Awn al-Bari li-Hall Adillat al-Bukhari {cite:nayl-awtar-awn-bari-hamish j.5 p. 2}."
  ur: "شہاب الدین ابو العباس احمد شرجی زبیدی کی بخاری کی «الجامع الصحیح» کی احادیث پر کتاب، جس کی شرح صدیق حسن قنوجی نے «عون الباری لحل ادلۃ البخاری» میں کی {cite:nayl-awtar-awn-bari-hamish j.5 p. 2}۔"
  es: "Libro de Shihab al-Din Abu al-'Abbas Ahmad al-Sharji al-Zabidi sobre los hadices de al-Jami' al-Sahih de al-Bukhari, el texto sobre el cual Siddiq Hasan al-Qannawji escribió 'Awn al-Bari li-Hall Adillat al-Bukhari {cita:nayl-awtar-awn-bari-hamish j.5 p. 2}."
  fr: "Le livre de Shihab al-Din Abu al-'Abbas Ahmad al-Sharji al-Zabidi sur les hadiths d'al-Jami' al-Sahih d'al-Bukhari, le texte sur lequel Siddiq Hasan al-Qannawji a écrit 'Awn al-Bari li-Hall Adillat al-Bukhari {cite:nayl-awtar-awn-bari-hamish j.5 p. 2}."
  tr: "Şihabedin Ebu el-Abbas Ahmed el-Şeri el-Zubeydi'nin \"El-Cemi' el-Sahih\" hadisleri üzerine kitabı, Siddik Hasan el-Kânuji tarafından \"Awn al-Bari li Hall Adilat al-Bukhari\" (atıf:nayl-awtar-awn-bari-hamish j.5, s. 2} adlı eserinde açıklanmıştır."
  id: "Kitab Shihab al-Din Abu al-Abbas Ahmad al-Sharji al-Zubaidi tentang hadits \"Al-Jami' al-Sahih\" karya al-Bukhari, yang dijelaskan oleh Siddiq Hasan al-Qanouji dalam \"Awn al-Bari li Hall Adilat al-Bukhari\" {cite:nayl-awtar-awn-bari-hamish j.5, hlm. 2}."
