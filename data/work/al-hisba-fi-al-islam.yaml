structure: "Preface: the purpose of offices, the need for a commander and forbidder, obedience to God and His Messenger (pp. 5-9); fasl on the Islamic offices and commanding right (pp. 11-14); fasl on the muhtasib's remit, prayer, fraud in trades, alchemy, forbidden contracts, meeting caravans, the unwary buyer, hoarding and price-fixing (pp. 15-24); communal duties, offices under the Prophet, sharecropping, leased land grants (pp. 25-30); jihad, trade, more on price-fixing, price and value, loans, stud fees, zakat on jewellery (pp. 30-42); the Hanafi view on price-fixing and the hoarder (pp. 39-40); fraud in religion and the duty to restrain it (pp. 43-47); hudud and ta'zir, the spy, limits of the muhtasib (pp. 47-49); financial ta'zir and its kinds - destruction, alteration, transfer (pp. 49-57); recompense in kind; conclusion (pp. 57-59)."
