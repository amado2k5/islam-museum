label: { ar: "الحسبة في الإسلام", en: "al-Hisba fi al-Islam", ur: "الحسبۃ فی الاسلام" }
summary:
  ar: "رسالة لابن تيمية ⁦(661-728هـ)⁩ يسميها «قاعدة في الحسبة»، يقرر فيها أن مقصود جميع الولايات في الإسلام أن يكون الدين كله لله، وأنها كلها راجعة إلى الأمر بالمعروف والنهي عن المنكر؛ ثم يحدد اختصاص المحتسب بين ولاية الحرب والقضاء والمال، ويفصّل ما يأمر به من الصلاة والجماعات وصدق الحديث وأداء الأمانات وما ينهى عنه من الغش والتطفيف والعقود المحرمة والاحتكار، ويبسط القول في التسعير ومتى يكون ظلماً ومتى يكون عدلاً واجباً، وفي المزارعة، وفي التعزير بالعقوبات المالية وأقسامها {cite:hisba-ibn-taymiyya-ilmiyya p. 6} {cite:hisba-ibn-taymiyya-ilmiyya p. 11} {cite:hisba-ibn-taymiyya-ilmiyya p. 16} {cite:hisba-ibn-taymiyya-ilmiyya p. 22} {cite:hisba-ibn-taymiyya-ilmiyya p. 49}."
  en: "A treatise by Ibn Taymiyya (661-728 AH), which he calls 'a rule on hisba', arguing that the purpose of every office in Islam is that religion be wholly for God and that all of them come down to commanding right and forbidding wrong; it then fixes the market inspector's (muhtasib's) remit among the offices of war, judgeship and finance, sets out what he enjoins - prayer, congregations, truthful speech, honesty - and what he forbids - fraud, short measure, forbidden contracts, hoarding - and discusses at length price-fixing, when it is unjust and when it is just and required, sharecropping, and discretionary financial penalties and their kinds."
  ur: "ابن تیمیہ (661-728ھ) کا رسالہ، جسے وہ «قاعدۃ فی الحسبہ» کہتے ہیں: اس میں وہ بیان کرتے ہیں کہ اسلام میں تمام ولایتوں کا مقصد یہ ہے کہ دین سارا اللہ کے لیے ہو، اور سب کی سب امر بالمعروف اور نہی عن المنکر کی طرف لوٹتی ہیں؛ پھر وہ ولایتِ حرب، قضا اور مال کے درمیان محتسب کا دائرہ متعین کرتے ہیں، تفصیل سے بتاتے ہیں کہ وہ کن چیزوں کا حکم دیتا ہے — نماز، جماعتیں، سچ بولنا، امانتیں ادا کرنا — اور کن سے روکتا ہے — دھوکہ، ناپ تول میں کمی، حرام عقود، احتکار — اور تسعیر (نرخ بندی) پر کہ کب ظلم ہے اور کب واجب عدل، مزارعت پر، اور مالی تعزیر اور اس کی اقسام پر مفصل بحث کرتے ہیں۔"
