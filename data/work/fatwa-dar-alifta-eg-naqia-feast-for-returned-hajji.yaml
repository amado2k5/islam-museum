label: { ar: "حكم تلبية الدعوة إلى مأدبة طعام للعائد من الحج ⁦(النقيعة)⁩", en: "Answering a feast invitation for one returned from Hajj (the naqi'a)", ur: "حاجی کے استقبال کی دعوت ⁦(نقیعہ)⁩ قبول کرنا", es: "Responder a una invitación a un banquete para alguien que regresa del Hajj (el naqi'a)" }
summary:
  ar: "سائل سأل عن تلبية دعوة الجار الذي عاد من الحج إلى مأدبة طعام ⁦(النقيعة)⁩. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20838)⁩ أنه يستحب إجابة دعوته لما في ذلك من البر والصلة ومشاركته فرحته على ما فصّل الجواب."
  en: "A questioner asked about answering a neighbour's invitation to a meal for one returned from Hajj (the naqi'a). Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20838) answered that answering it is recommended — as kindness, kinship and sharing his joy — as the answer details."
  ur: "ایک سائل نے حج سے لوٹے پڑوسی کی کھانے کی دعوت ⁦(نقیعہ)⁩ قبول کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20838)⁩ نے جواب دیا کہ قبول کرنا مستحب ہے کیونکہ اس میں بِر اور صلہ اور خوشی میں شرکت ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la conveniencia de aceptar la invitación de un vecino a una comida para alguien que regresa del Hajj (la naqi'a). El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20838) respondió que aceptarla es recomendable, como muestra de amabilidad, parentesco y para compartir su alegría, tal como se detalla en la respuesta."
