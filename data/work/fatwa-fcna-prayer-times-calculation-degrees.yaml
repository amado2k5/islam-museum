  fr: "Un document du Conseil Fiqh d'Amérique du Nord (publié le 18 septembre 2024) expliquant les méthodes de calcul des angles Fajr et Isha utilisés par les sites Web et les applications d'horaires de prière, et comparant les conventions bien connues — Ligue islamique mondiale, ISNA et autres — comme le détaille le document."
