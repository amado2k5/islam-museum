summary:
  ar: "ورقة للمجلس الفقهي لأمريكا الشمالية ⁦(نُشرت 18 سبتمبر 2024)⁩ تشرح طرق حساب زاويتي الفجر والعشاء في مواقع وتطبيقات المواقيت وتبيّن الفروق بين المناهج المعروضة كرابطة العالم الإسلامي والجمعية الإسلامية لأمريكا الشمالية وغيرهما على ما فصّلته الورقة."
