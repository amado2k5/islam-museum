id: work/fatwa-amja-avoid-arousing-scenes
class: work
kind: fatwa
label: { ar: "المذي واجتناب المثيرات", en: "Madhy and avoiding arousing scenes", ur: "مذی اور مثیر مناظر سے اجتناب", es: "Madhy y evitando escenas provocativas", fr: "Madhy et éviter les scènes excitantes" }
summary:
  ar: "سأل شاب عن حالة تواجهه أحيانًا عند النظر إلى مشاهد مثيرة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86032 بتاريخ 1 ديسمبر 2011)⁩ أن أول ما ينصح به هو تجنب النظر إلى هذه المشاهد المثيرة لحرمتها في ذاتها من ناحية ولكونها تشوش عليه عبادته وقد تفسدها عليه من جانب آخر، والمذي لا يوجب الاغتسال وإنما يوجب الاستنجاء والوضوء لما روي أن عليًا قال كنت رجلًا مذاء فاستحييت أن أسأل رسول الله لمكان ابنته فأمر المقداد بن الأسود فسأله فقال فيه الوضوء على ما فصّل."
  en: "A young man asked about a state befalling him sometimes when viewing arousing scenes. Dr. Salah al-Sawi (fatwa no. 86032, 1 December 2011) answered that his first counsel is to avoid looking at such scenes — unlawful in themselves on one side and clouding, possibly corrupting, his worship of his Lord on the other; madhy does not oblige a washing but only istinja and wudu, per Ali's account — 'I was a man of much madhy and shied from asking the Messenger of God for his daughter's sake, so I had al-Miqdad ask him, and he said: wudu for it' — as the answer details."
  ur: "ایک نوجوان نے مثیر مناظر سے ہونے والی حالت پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86032، 1 دسمبر 2011)⁩ کے مطابق پہلی نصیحت اجتناب ہے؛ مذی غسل نہیں بلکہ استنجاء اور وضو طلب کرتا ہے۔"
  es: "Un joven preguntó sobre un estado que a veces le ocurría al ver escenas excitantes. El Dr. Salah al-Sawi (fatwa n.° 86032, 1 de diciembre de 2011) respondió que su primer consejo es evitar mirar tales escenas, ilícitas en sí mismas por un lado y que nublan, posiblemente corrompen, su adoración a su Señor por el otro; la madhy no obliga a lavarse, sino solo a realizar el istinja y el wudu, según el relato de Ali: «Yo era un hombre de mucha madhy y me daba vergüenza pedirle al Mensajero de Dios por su hija, así que le pedí a al-Miqdad que le preguntara, y él dijo: \"wudu por ella\"», como detalla la respuesta."
  fr: "Un jeune homme interrogea Salah al-Sawi au sujet d'un état qu'il ressentait parfois en regardant des scènes érotiques. Le Dr Salah al-Sawi (fatwa n° 86032, 1er décembre 2011) répondit que son premier conseil était d'éviter de regarder de telles scènes, illicites en elles-mêmes et susceptibles d'obscurcir, voire de corrompre, son adoration de son Seigneur. La perversité (madhy) n'exige pas de purification, mais seulement l'istinja et les wudu, comme le relate Ali: « J'étais un homme très pervers et j'hésitais à interroger le Messager de Dieu à cause de sa fille. J'ai donc demandé à al-Miqdad de le faire, et il a dit: \"Fais tes wudu pour cela\" », précise la réponse."
