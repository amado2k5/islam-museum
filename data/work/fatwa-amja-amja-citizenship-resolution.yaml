label: { ar: "التجنس بالجنسية خارج ديار الإسلام", en: "Taking non-Muslim citizenship — AMJA's ruling", ur: "غیر مسلم شہریت — مجمع کا فیصلہ", es: "Adquisición de la ciudadanía a personas no musulmanas: dictamen de AMJA" }
summary:
  ar: "سأل شاب من دول المغرب العربي مقيم بكندا منذ ثلاث سنوات عن التجنس بالجنسية. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80516 بتاريخ 23 نوفمبر 2009)⁩ أن مجمع فقهاء الشريعة بأمريكا نظر في هذه المسألة وقرر أنه لا حرج في التجنس إذا اتخذ سبيلًا إلى ترتيب شؤون المقيمين خارج ديار الإسلام أو داخلها ما بقي صاحبه حفيظًا على ولائه لملته وأمته مقيمًا على عهده مع الله ورسوله."
  en: "A young man from the Maghreb resident in Canada for three years — the period qualifying him for citizenship — asked about naturalizing. Dr. Salah al-Sawi (fatwa no. 80516, 23 November 2009) answered that the Assembly of Muslim Jurists of America examined the question and resolved that there is no harm in naturalization taken as a means to order the affairs of residents outside or inside Muslim lands, so long as its holder keeps his loyalty to his creed and his ummah and stands by his covenant with God and His messenger. Recorded as AMJA's resolution."
  ur: "ایک نوجوان نے شہریت لینے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80516، 23 نومبر 2009)⁩ کے مطابق مجمع نے فیصلہ کیا کہ شہریت جائز ہے بشرط ایمان اور امت سے ولاء قائم رہے۔"
  es: "Un joven del Magreb, residente en Canadá durante tres años —el tiempo que le permite obtener la ciudadanía—, preguntó sobre la naturalización. El Dr. Salah al-Sawi (fatwa n.º 80516, 23 de noviembre de 2009) respondió que la Asamblea de Juristas Musulmanes de América examinó la cuestión y resolvió que no hay inconveniente en la naturalización como medio para regular los asuntos de los residentes, tanto dentro como fuera de tierras musulmanas, siempre que quien la obtenga mantenga su lealtad a su credo y a su comunidad, y cumpla su pacto con Dios y su mensajero. Esta resolución quedó registrada en la Asamblea de Juristas Musulmanes de América."
