id: work/fatwa-amja-amja-citizenship-resolution
class: work
kind: fatwa
label: { ar: "التجنس بالجنسية خارج ديار الإسلام", en: "Taking non-Muslim citizenship — AMJA's ruling", ur: "غیر مسلم شہریت — مجمع کا فیصلہ", es: "Adquisición de la ciudadanía a personas no musulmanas: dictamen de AMJA", fr: "Acquisition de la citoyenneté non musulmane — Décision de l'AMJA", tr: "İslam toprakları dışında milliyetle vatandaşlığa geçiş", id: "Naturalisasi berdasarkan kebangsaan di luar tanah Islam" }
summary:
  ar: "سأل شاب من دول المغرب العربي مقيم بكندا منذ ثلاث سنوات عن التجنس بالجنسية. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80516 بتاريخ 23 نوفمبر 2009)⁩ أن مجمع فقهاء الشريعة بأمريكا نظر في هذه المسألة وقرر أنه لا حرج في التجنس إذا اتخذ سبيلًا إلى ترتيب شؤون المقيمين خارج ديار الإسلام أو داخلها ما بقي صاحبه حفيظًا على ولائه لملته وأمته مقيمًا على عهده مع الله ورسوله."
  en: "A young man from the Maghreb resident in Canada for three years — the period qualifying him for citizenship — asked about naturalizing. Dr. Salah al-Sawi (fatwa no. 80516, 23 November 2009) answered that the Assembly of Muslim Jurists of America examined the question and resolved that there is no harm in naturalization taken as a means to order the affairs of residents outside or inside Muslim lands, so long as its holder keeps his loyalty to his creed and his ummah and stands by his covenant with God and His messenger. Recorded as AMJA's resolution."
  ur: "ایک نوجوان نے شہریت لینے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80516، 23 نومبر 2009)⁩ کے مطابق مجمع نے فیصلہ کیا کہ شہریت جائز ہے بشرط ایمان اور امت سے ولاء قائم رہے۔"
  es: "Un joven del Magreb, residente en Canadá durante tres años —el tiempo que le permite obtener la ciudadanía—, preguntó sobre la naturalización. El Dr. Salah al-Sawi (fatwa n.º 80516, 23 de noviembre de 2009) respondió que la Asamblea de Juristas Musulmanes de América examinó la cuestión y resolvió que no hay inconveniente en la naturalización como medio para regular los asuntos de los residentes, tanto dentro como fuera de tierras musulmanas, siempre que quien la obtenga mantenga su lealtad a su credo y a su comunidad, y cumpla su pacto con Dios y su mensajero. Esta resolución quedó registrada en la Asamblea de Juristas Musulmanes de América."
  fr: "Un jeune homme du Maghreb, résidant au Canada depuis trois ans – période lui permettant d'obtenir la citoyenneté – s'est renseigné sur la possibilité de se naturaliser. Le Dr Salah al-Sawi (fatwa n° 80516, 23 novembre 2009) a répondu que l'Assemblée des juristes musulmans d'Amérique avait examiné la question et décidé qu'il n'y avait aucun inconvénient à la naturalisation, qu'elle soit envisagée comme un moyen de régler les affaires des résidents, qu'ils résident en terre musulmane ou à l'étranger, pourvu que son titulaire reste fidèle à sa foi et à sa communauté et respecte son engagement envers Dieu et Son Messager. Cette décision a été consignée comme résolution de l'AMJA."
  tr: "Kanada'da üç yıl yaşayan Mağrip ülkelerinden genç bir adam, milliyetle vatandaşlık hakkında soru sordu. Dr. Salah Al-Sawy (23 Kasım 2009 tarihli Fetva No. 80516) Amerikan Şeriat Hukukçular Akademisi'nin bu konuyu ele aldığını ve İslam toprakları dışındaki veya içindeki sakinlerin işlerini düzenlemek için bir yol izleyen bir yol seçilmesi durumunda, sahibi inancına ve milletine sadık kaldığı ve Allah ile Elçisi ile Resayetçisi ile yaptığı ahdi yerine getirdiği sürece vatandaşlığa geçişin zararı olmadığını belirtti."
  id: "Seorang pemuda dari negara-negara Maghreb yang tinggal di Kanada selama tiga tahun menanyakan tentang naturalisasi berdasarkan kebangsaan. Dr. Salah Al-Sawy menanggapi (Fatwa No. 80516 tanggal 23 November 2009) bahwa American Academy of Sharia Jurists mempertimbangkan masalah ini dan memutuskan bahwa naturalisasi tidak ada salahnya jika seseorang mengambil cara untuk mengatur urusan penduduk di luar atau di dalam tanah Islam selama pemilik tetap setia pada imannya dan bangsanya serta tetap menepati perjanjiannya dengan Allah dan Rasul-Nya."
