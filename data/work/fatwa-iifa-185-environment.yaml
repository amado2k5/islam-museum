label: { ar: "قرار مجمع الفقه الإسلامي الدولي 185 (19/11) بشأن البيئة والحفاظ عليها من منظور إسلامي", en: "IIFA resolution 185 (19/11) on the environment and its protection from an Islamic perspective", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 185 (19/11): ماحولیات اور اس کا تحفظ — اسلامی تناظر میں", es: "Resolución 185 (19/11) de la IIFA sobre el medio ambiente y su protección desde una perspectiva islámica.", fr: "Résolution 185 (19/11) de l'IIFA sur l'environnement et sa protection dans une perspective islamique", tr: "Uluslararası İslami Fiqh Akademisi Kararı 185 (19/11) ile çevre ve İslami bakış açısıyla çevre ve korunması", id: "Resolusi Akademi Fiqh Islam Internasional 185 (19/11) tentang lingkungan dan pelestariannya dari perspektif Islam" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩. قرر: تحريم إلقاء أي نفايات ضارة في أي بقعة من العالم وإلزام الدول المنتجة لها التصرف بها داخل بلادها بما لا يضر بالبيئة مع امتناع الدول الإسلامية عن جعل أراضيها مدفنًا لها؛ تحريم كل فعل أو تصرف يضر بالبيئة أو يخل بالتوازن البيئي أو يستغل الموارد استغلالًا جائرًا لا يراعي الأجيال القادمة عملًا بقواعد إزالة الضرر؛ ووجوب نزع أسلحة الدمار الشامل دوليًا وحظر ما يؤدي لتسرب الغازات الموسعة لثقب الأوزون والملوثة. وأوصى بجملة تدابير: تشجيع الوقف على حماية البيئة بعناصرها؛ إنشاء لجنة بالمجمع لدراسات البيئة من منظور إسلامي؛ التعاون مع المجتمع الدولي والانضمام للاتفاقيات البيئية بما لا يعارض الشريعة؛ تفعيل المنظمات البيئية لمنظمة المؤتمر الإسلامي والتعاون مع المجالس العربية والخليجية المعنية؛ دعم الصناعات صديقة البيئة؛ حث الدول الأعضاء على التشريع البيئي وتوقيع عقوبات جنائية على الإضرار؛ تزويد الأئمة والدعاة بالمعلومات البيئية؛ ونشر الثقافة البيئية بالإعلام والتربية ومقررات كليات الشريعة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009). It resolved: prohibition of dumping any harmful waste anywhere in the world, obliging producer states to dispose of it at home without environmental harm while Muslim states refrain from making their lands a receptacle; prohibition of every act harming the environment, upsetting its balance or exploiting resources rapaciously without regard to future generations, under the harm-removal rules; and the obligation of worldwide removal of weapons of mass destruction plus a ban on what releases ozone-depleting and polluting gases. Its recommendations: encourage waqf for environmental protection in all its elements; establish an Academy committee for Islamic-perspective environmental studies; cooperate internationally and join environmental accords not contrary to the sharia; activate the OIC's environmental bodies and cooperate with the Arab and Gulf councils; support environment-friendly industries; urge member states to legislate environmental protection with criminal penalties for harm; equip imams and preachers with environmental information; and spread environmental culture through media, upbringing and sharia-faculty curricula."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں۔ فیصلے: دنیا میں کہیں بھی مضر فضلہ پھینکنا حرام ہے، پیدا کرنے والے ممالک پر لازم ہے کہ وہ اپنے ہی ملک میں اس کا ایسا اٹھاؤ کریں جس سے ماحول کو نقصان نہ ہو، اور اسلامی ممالک اپنی سرزمین کو اس کا گڑھا نہ بنائیں؛ ہر وہ فعل حرام ہے جو ماحول کو نقصان پہنچائے، ماحولیاتی توازن بگاڑے یا وسائل کا ایسا استحصال کرے جو آنے والی نسلوں کی پروا نہ کرے — ضرر کی رفو کے شرعی قواعد کی بنا پر؛ اور عالمی سطح پر بڑے تباہی کے ہتھیاروں کا خاتمہ واجب ہے اور اوزون کی تہہ کو پھاڑنے والی اور آلودہ کرنے والی گیسوں کے اخراج پر پابندی۔ سفارشات: ماحول کے تمام عناصر کے تحفظ کے لیے وقف کی ترغیب؛ اکیڈمی میں اسلامی تناظر سے ماحولیاتی مطالعات کی کمیٹی؛ بین الاقوامی تعاون اور شریعت کے خلاف نہ ہونے والے ماحولیاتی معاہدوں میں شمولیت؛ او آئی سی کے ماحولیاتی اداروں کی فعالیت اور عرب و خلیجی کونسلوں سے تعاون؛ ماحول دوست صنعتوں کی حمایت؛ رکن ممالک سے ماحولیاتی قانون سازی اور نقصان پر فوجداری سزاؤں کا مطالبہ؛ ائمہ و داعیوں کو ماحولیاتی معلومات سے لیس کرنا؛ اور ذرائع ابلاغ، تربیت اور شرعیہ کی جامعات کے نصابوں سے ماحولیاتی ثقافت کا پھیلاؤ۔"
  es: "Resolución colectiva de la Academia Internacional de Juqh Islámico en su 19.ª sesión en Sharjah (1-5 de Jumada al-Ula 1430, 26-30 de abril de 2009). Resolvió: prohibición de verter cualquier residuo dañino en cualquier parte del mundo, obligando a los estados productores a deshacerse de él en sus hogares sin causar daño ambiental, mientras que los estados musulmanes se abstienen de convertir sus tierras en un receptáculo; prohibición de todo acto que dañe el medio ambiente, altere su equilibrio o explote los recursos de forma rapaz sin tener en cuenta a las generaciones futuras, bajo las reglas de eliminación de daños; y la obligación de la eliminación mundial de armas de destrucción masiva, además de una prohibición de lo que libera gases que agotan la capa de ozono y contaminantes. Sus recomendaciones: fomentar el waqf para la protección del medio ambiente en todos sus elementos; establecer un comité de la Academia para estudios ambientales de perspectiva islámica; cooperar internacionalmente y unirse a acuerdos ambientales que no sean contrarios a la sharia; activar los organismos ambientales de la OIC y cooperar con los consejos árabes y del Golfo; apoyar industrias respetuosas con el medio ambiente; Instamos a los Estados miembros a que legislen sobre la protección del medio ambiente con sanciones penales por los daños causados; a que capaciten a los imanes y predicadores con información ambiental; y a que difundan la cultura ambiental a través de los medios de comunicación, la educación y los planes de estudio de las facultades de sharia."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 19e session à Sharjah (1-5 Jumada al-Ula 1430, 26-30 avril 2009). Elle a décidé: d'interdire le déversement de déchets nocifs où que ce soit dans le monde, obligeant les États producteurs à les éliminer sur leur territoire sans nuire à l'environnement et les États musulmans à s'abstenir d'utiliser leurs terres comme réceptacles; d'interdire tout acte portant atteinte à l'environnement, perturbant son équilibre ou exploitant ses ressources de manière abusive sans égard pour les générations futures, conformément aux règles de réparation; et d'imposer l'élimination mondiale des armes de destruction massive ainsi que l'interdiction de toute émission de gaz appauvrissant la couche d'ozone et polluants. Ses recommandations: encourager la création de waqf pour la protection de l'environnement sous tous ses aspects; établir un comité de l'Académie chargé des études environnementales dans une perspective islamique; coopérer au niveau international et adhérer aux accords environnementaux non contraires à la charia; dynamiser les organes environnementaux de l'OCI et coopérer avec les conseils arabes et du Golfe; soutenir les industries respectueuses de l'environnement; et inciter les États membres à légiférer sur la protection de l'environnement en prévoyant des sanctions pénales en cas d'atteinte à l'environnement. former les imams et les prédicateurs aux connaissances environnementales; et diffuser la culture environnementale par le biais des médias, de l'éducation et des programmes d'enseignement de la charia."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on dokuzuncu oturumunda Şariha'da (1–5 Jumada al-Awwal 1430H, 26–30 Nisan 2009) toplu kararı. Karar: Dünyanın herhangi bir yerine zararlı atıkların atılmasını yasaklamak ve üretici ülkeleri çevreye zarar vermeyecek şekilde kendi ülkelerinde bertaraf etmeye zorlamak, İslam ülkelerinin ise topraklarını çöplük yapmaktan kaçınması; Çevreye zarar veren, çevresel dengeyi bozan veya kaynakları haksız şekilde kullanan herhangi bir eylem veya davranışın gelecek nesillere saygı gösterilmeden, zarar giderme kurallarına uygun olarak yasaklanması; ve kitle imha silahlarının uluslararası alanda ortadan kaldırılması ve genişlemiş ozon deliği sızıntısına yol açan sızıntıların yasaklanması zorunluluğu. Bir dizi önlem önerdi: çevrenin tüm bileşenlerini korumak için vakıfların teşvik edilmesi; kompleks içinde İslami bakış açısıyla çevre çalışmaları için bir komite kurulması; uluslararası toplumla işbirliği yapmak ve Şeriat'a aykırı olmayan şekilde çevre anlaşmalarına katılmak; İslam Konferansı Örgütü'nün çevre örgütlerini harekete geçirmek ve ilgili Arap ve Körfez konseyleriyle iş birliği yapmak; çevre dostu endüstrileri desteklemek; üye devletleri çevre mevzuatı çıkarmaya ve zarar için cezai yaptırımlar uygulamaya teşvik etmek; imamlara ve vaizlere çevresel bilgi sağlamak; ve medya, eğitim ve Şeriat koleji müfredatları yoluyla çevre kültürünü yaymak."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kesembilan belas di Sharjah (1–5 Jumada al-Awwal 1430H, 26–30 April 2009). Diputuskan: Melarang pembuangan limbah berbahaya di mana pun di dunia dan mewajibkan negara produsen untuk membuangnya di dalam negara mereka sendiri dengan cara yang tidak merusak lingkungan, sementara negara-negara Islam menahan diri untuk tidak menjadikan tanah mereka sebagai tempat pembuangan akhir; Melarang setiap tindakan atau perilaku yang merusak lingkungan, mengganggu keseimbangan lingkungan, atau mengeksploitasi sumber daya secara tidak adil tanpa memperhatikan generasi mendatang sesuai dengan aturan penghilangan bahaya; dan kewajiban untuk menghilangkan senjata pemusnah massal secara internasional serta melarang apa yang menyebabkan kebocoran gas yang diperluas dan mencemari lubang ozon. Ia merekomendasikan serangkaian langkah: mendorong dana abadi untuk melindungi lingkungan dalam semua komponennya; membentuk komite dalam kompleks untuk studi lingkungan dari perspektif Islam; bekerja sama dengan komunitas internasional dan bergabung dengan perjanjian lingkungan dengan cara yang tidak bertentangan dengan Syariah; mengaktifkan organisasi lingkungan dari Organisasi Konferensi Islam dan bekerja sama dengan dewan Arab dan Teluk terkait; mendukung industri ramah lingkungan; mendesak negara anggota untuk memberlakukan legislasi lingkungan dan menjatuhkan sanksi pidana atas bahaya; memberikan informasi lingkungan kepada imam dan pendakwah; serta menyebarkan budaya lingkungan melalui media, pendidikan, dan kurikulum perguruan tinggi Syariah."
