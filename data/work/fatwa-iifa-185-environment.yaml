label: { ar: "قرار مجمع الفقه الإسلامي الدولي 185 (19/11) بشأن البيئة والحفاظ عليها من منظور إسلامي", en: "IIFA resolution 185 (19/11) on the environment and its protection from an Islamic perspective", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 185 (19/11): ماحولیات اور اس کا تحفظ — اسلامی تناظر میں" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩. قرر: تحريم إلقاء أي نفايات ضارة في أي بقعة من العالم وإلزام الدول المنتجة لها التصرف بها داخل بلادها بما لا يضر بالبيئة مع امتناع الدول الإسلامية عن جعل أراضيها مدفنًا لها؛ تحريم كل فعل أو تصرف يضر بالبيئة أو يخل بالتوازن البيئي أو يستغل الموارد استغلالًا جائرًا لا يراعي الأجيال القادمة عملًا بقواعد إزالة الضرر؛ ووجوب نزع أسلحة الدمار الشامل دوليًا وحظر ما يؤدي لتسرب الغازات الموسعة لثقب الأوزون والملوثة. وأوصى بجملة تدابير: تشجيع الوقف على حماية البيئة بعناصرها؛ إنشاء لجنة بالمجمع لدراسات البيئة من منظور إسلامي؛ التعاون مع المجتمع الدولي والانضمام للاتفاقيات البيئية بما لا يعارض الشريعة؛ تفعيل المنظمات البيئية لمنظمة المؤتمر الإسلامي والتعاون مع المجالس العربية والخليجية المعنية؛ دعم الصناعات صديقة البيئة؛ حث الدول الأعضاء على التشريع البيئي وتوقيع عقوبات جنائية على الإضرار؛ تزويد الأئمة والدعاة بالمعلومات البيئية؛ ونشر الثقافة البيئية بالإعلام والتربية ومقررات كليات الشريعة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009). It resolved: prohibition of dumping any harmful waste anywhere in the world, obliging producer states to dispose of it at home without environmental harm while Muslim states refrain from making their lands a receptacle; prohibition of every act harming the environment, upsetting its balance or exploiting resources rapaciously without regard to future generations, under the harm-removal rules; and the obligation of worldwide removal of weapons of mass destruction plus a ban on what releases ozone-depleting and polluting gases. Its recommendations: encourage waqf for environmental protection in all its elements; establish an Academy committee for Islamic-perspective environmental studies; cooperate internationally and join environmental accords not contrary to the sharia; activate the OIC's environmental bodies and cooperate with the Arab and Gulf councils; support environment-friendly industries; urge member states to legislate environmental protection with criminal penalties for harm; equip imams and preachers with environmental information; and spread environmental culture through media, upbringing and sharia-faculty curricula."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں۔ فیصلے: دنیا میں کہیں بھی مضر فضلہ پھینکنا حرام ہے، پیدا کرنے والے ممالک پر لازم ہے کہ وہ اپنے ہی ملک میں اس کا ایسا اٹھاؤ کریں جس سے ماحول کو نقصان نہ ہو، اور اسلامی ممالک اپنی سرزمین کو اس کا گڑھا نہ بنائیں؛ ہر وہ فعل حرام ہے جو ماحول کو نقصان پہنچائے، ماحولیاتی توازن بگاڑے یا وسائل کا ایسا استحصال کرے جو آنے والی نسلوں کی پروا نہ کرے — ضرر کی رفو کے شرعی قواعد کی بنا پر؛ اور عالمی سطح پر بڑے تباہی کے ہتھیاروں کا خاتمہ واجب ہے اور اوزون کی تہہ کو پھاڑنے والی اور آلودہ کرنے والی گیسوں کے اخراج پر پابندی۔ سفارشات: ماحول کے تمام عناصر کے تحفظ کے لیے وقف کی ترغیب؛ اکیڈمی میں اسلامی تناظر سے ماحولیاتی مطالعات کی کمیٹی؛ بین الاقوامی تعاون اور شریعت کے خلاف نہ ہونے والے ماحولیاتی معاہدوں میں شمولیت؛ او آئی سی کے ماحولیاتی اداروں کی فعالیت اور عرب و خلیجی کونسلوں سے تعاون؛ ماحول دوست صنعتوں کی حمایت؛ رکن ممالک سے ماحولیاتی قانون سازی اور نقصان پر فوجداری سزاؤں کا مطالبہ؛ ائمہ و داعیوں کو ماحولیاتی معلومات سے لیس کرنا؛ اور ذرائع ابلاغ، تربیت اور شرعیہ کی جامعات کے نصابوں سے ماحولیاتی ثقافت کا پھیلاؤ۔"
