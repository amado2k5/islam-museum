summary:
  ar: "ورقة للدكتور ذو الفقار علي شاه في موقع المجلس الفقهي لأمريكا الشمالية ⁦(مارس 2020)⁩ تبين الأساس الفقهي لإغلاق المساجد في الطوارئ حين أُغلقت المساجد الأمريكية عن الصلوات والجمعة والجنازة خوفًا من جائحة كورونا على ما فصّلته الورقة."
  en: "A paper by Dr. Zulfiqar Ali Shah on the Fiqh Council of North America site (March 2020) setting out the fiqhi basis for closing masajid in emergencies, when mosques across America closed to daily prayers, jumu'a, janaza and eid for fear of the coronavirus pandemic — as the paper details."
  ur: "ڈاکٹر ذوالفقار علی شاہ کی تحریر فقہ کونسل کی ویب سائٹ پر ⁦(مارچ 2020)⁩ کورونا کے خوف سے مساجد بند کرنے کی فقہی بنیاد پر — جیسا کہ تحریر میں تفصیل ہے۔"
  es: "Un artículo del Dr. Zulfiqar Ali Shah publicado en el sitio web del Consejo de Fiqh de América del Norte (marzo de 2020) expone la base fiqhí para el cierre de mezquitas en situaciones de emergencia, cuando las mezquitas de todo Estados Unidos cerraron sus puertas a las oraciones diarias, el jumu'a, el janaza y el eid por temor a la pandemia del coronavirus, como se detalla en el artículo."
  fr: "Un article du Dr Zulfiqar Ali Shah sur le site du Conseil Fiqh d'Amérique du Nord (mars 2020) exposant la base juridique (fiqh) de la fermeture des mosquées en cas d'urgence, lorsque les mosquées à travers l'Amérique ont fermé leurs portes aux prières quotidiennes, au jumu'a, au janaza et à l'eid par crainte de la pandémie de coronavirus — comme le détaille l'article."
