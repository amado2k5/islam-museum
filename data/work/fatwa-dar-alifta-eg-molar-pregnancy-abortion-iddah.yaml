summary:
  ar: "سائل سأل عن إجهاض الحمل العنقودي وأثره على عدة المرأة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20669)⁩ أنه يجوز إجهاض الحمل العنقودي بنوعيه الكلي والجزئي وبه تنتهي العدة متى أظهرت الفحوصات الطبية أنه قد تكون على ما فصّل الجواب."
  en: "A questioner asked about aborting a molar pregnancy and its effect on the woman's waiting period. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20669) answered that aborting it — complete or partial — is permissible and the idda ends when the medical tests show formation — as the answer details."
  ur: "ایک سائل نے مولر حمل کے اسقاط اور عدت پر اثر کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20669)⁩ نے جواب دیا کہ مکمل یا جزوی اسقاط جائز ہے اور طبی جانچ کے بعد عدت ختم ہوتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
