label: { ar: "مقدار زكاة الزرع المسقي بالطاقة الشمسية", en: "The zakat rate on crops irrigated by solar power", ur: "شمسی توانائی سے سینچی گئی فصل کی زکات" }
summary:
  ar: "سائل سأل عن مقدار زكاة الزرع المسقي عن طريق تقنية الطاقة الشمسية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21500)⁩ أنه تجب الزكاة في المحاصيل التي تسقى باستخدام تقنية الطاقة الشمسية وقدرها نصف عشر الخارج من الأرض على ما فصّل الجواب."
  en: "A questioner asked the rate of zakat on crops irrigated through solar-power technology. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21500) answered that zakat is due on crops irrigated by solar technology, at half a tenth of the land's yield — as the answer details."
  ur: "ایک سائل نے شمسی توانائی سے سینچی گئی فصل کی زکات کی مقدار پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21500)⁩ نے جواب دیا کہ ایسی فصل پر نصف عشر زکات واجب ہے — جیسا کہ جواب میں تفصیل ہے۔"
