id: work/fatwa-dar-alifta-eg-menstruating-woman-reading-quran
class: work
kind: fatwa
label: { ar: "حكم قراءة المرأة الحائض للقرآن من الهاتف أو المصحف الرقمي", en: "A menstruating woman reading the Qur'an from a phone or digital mushaf", ur: "حائضہ عورت کا فون یا ڈیجیٹل مصحف سے قرآن پڑھنا", es: "Una mujer menstruante leyendo el Corán desde un teléfono o un mushaf digital.", fr: "Une femme menstruée lisant le Coran sur un téléphone ou un mushaf numérique", tr: "Regl olan bir kadının telefonundan veya dijital Kur'an'dan Kur'an okumasına ilişkin karar", id: "Putusan tentang seorang wanita yang sedang menstruasi membaca Al-Quran dari ponsel atau Al-Qur'an digitalnya" }
summary:
  ar: "سائل سأل عن قراءة المرأة الحائض للقرآن من الهاتف أو المصحف الرقمي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22454)⁩ أنه يجوز للمرأة الحائض قراءة القرآن بمجرد النظر بالعين إلى المصحف أو إلى شاشة الهاتف أو المصحف الإلكتروني على ما فصّل الجواب من الضوابط."
  en: "A questioner asked about a menstruating woman reading the Qur'an from a phone or digital mushaf. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22454) answered that a menstruating woman may read the Qur'an by merely looking with the eyes at the mushaf or a phone screen or electronic mushaf, under the conditions the answer details."
  ur: "ایک سائل نے حائضہ عورت کے فون یا ڈیجیٹل مصحف سے قرآن پڑھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22454)⁩ نے جواب دیا کہ حائضہ عورت محض آنکھوں سے مصحف، فون کی اسکرین یا الیکٹرانک مصحف کی طرف دیکھ کر قرآن پڑھ سکتی ہے، جواب کے بیان کردہ ضوابط کے ساتھ۔"
  es: "Una persona preguntó sobre la posibilidad de que una mujer menstruante leyera el Corán en un teléfono o en una copia digital del Corán. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22454) respondió que una mujer menstruante puede leer el Corán simplemente mirando el ejemplar físico, la pantalla de un teléfono o una copia electrónica del Corán, bajo las condiciones que se detallan en la respuesta."
  fr: "Une personne a posé une question concernant la lecture du Coran par une femme menstruée sur un téléphone ou un mushaf numérique. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22454) a répondu qu'une femme menstruée peut lire le Coran en regardant simplement le mushaf, l'écran d'un téléphone ou un mushaf électronique, sous réserve des conditions détaillées dans la réponse."
  tr: "Bir soru soran, regl olan bir kadının telefonundan veya dijital Kur'an'dan Kur'an okuması hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 22454), regl olan bir kadının Kur'an'ı sadece gözleriyle Muşaf'a, telefona veya elektronik Kur'an'a bakarak okumasının caiz olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang seorang wanita yang sedang menstruasi membaca Al-Qur'an dari ponsel atau Al-Qur'an digitalnya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22454) menjawab bahwa diperbolehkan bagi wanita yang sedang menstruasi untuk membaca Al-Qur'an hanya dengan menatap mata ke arah Mushaf, atau telepon atau Al-Qur'an elektronik, sebagaimana dijelaskan dalam peraturan."
