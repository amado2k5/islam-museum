id: work/fatwa-dar-alifta-eg-menstruating-woman-reading-quran
class: work
kind: fatwa
label: { ar: "حكم قراءة المرأة الحائض للقرآن من الهاتف أو المصحف الرقمي", en: "A menstruating woman reading the Qur'an from a phone or digital mushaf", ur: "حائضہ عورت کا فون یا ڈیجیٹل مصحف سے قرآن پڑھنا" }
summary:
  ar: "سائل سأل عن قراءة المرأة الحائض للقرآن من الهاتف أو المصحف الرقمي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22454)⁩ أنه يجوز للمرأة الحائض قراءة القرآن بمجرد النظر بالعين إلى المصحف أو إلى شاشة الهاتف أو المصحف الإلكتروني على ما فصّل الجواب من الضوابط."
  en: "A questioner asked about a menstruating woman reading the Qur'an from a phone or digital mushaf. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22454) answered that a menstruating woman may read the Qur'an by merely looking with the eyes at the mushaf or a phone screen or electronic mushaf, under the conditions the answer details."
  ur: "ایک سائل نے حائضہ عورت کے فون یا ڈیجیٹل مصحف سے قرآن پڑھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22454)⁩ نے جواب دیا کہ حائضہ عورت محض آنکھوں سے مصحف، فون کی اسکرین یا الیکٹرانک مصحف کی طرف دیکھ کر قرآن پڑھ سکتی ہے، جواب کے بیان کردہ ضوابط کے ساتھ۔"
