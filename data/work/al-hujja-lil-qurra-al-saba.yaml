summary:
  ar: "كتاب أبي علي الحسن بن أحمد الفارسي النحوي ⁦(ت 377هـ)⁩ في توجيه القراءات السبع، وهو شرح لـ«سبعة» ابن مجاهد وهو مطبوع، يذكره السيوطي أول الكتب التي سمّاها في توجيه القراءات {cite:itqan-suyuti p. 536}."
  en: "Abu 'Ali al-Hasan ibn Ahmad al-Farisi's (d. 377 AH) book on the grounds of the seven readings, a printed commentary on Ibn Mujahid's Sab'a; al-Suyuti names it first among the books devoted to explaining the readings {cite:itqan-suyuti p. 536}."
  ur: "ابو علی حسن بن احمد فارسی نحوی ⁦(م 377ھ)⁩ کی سات قراءتوں کی توجیہ پر کتاب، جو ابن مجاہد کی «السبعہ» کی مطبوع شرح ہے؛ سیوطی اسے قراءات کی توجیہ کے لیے مخصوص کتابوں میں پہلے ذکر کرتے ہیں {cite:itqan-suyuti p. 536}۔"
