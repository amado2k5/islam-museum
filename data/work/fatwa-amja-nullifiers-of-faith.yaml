id: work/fatwa-amja-nullifiers-of-faith
class: work
kind: fatwa
label: { ar: "نواقض الإيمان", en: "The nullifiers of faith and their consequence", ur: "ایمان کے نواقض اور ان کا نتیجہ", es: "Los anuladores de la fe y sus consecuencias", fr: "Les annulateurs de la foi et leurs conséquences" }
summary:
  ar: "سأل سائل عن معنى نواقض الإيمان وما يترتب على الذي نقض إيمانه ومدى صحة صلاة مسلم وهو ناقض لإيمانه. أجابت القسم الشرعي بالموقع ⁦(فتوى رقم 21863 بتاريخ 14 أغسطس 2007)⁩ أن نواقض الإيمان هي مفسداته ومبطلاته ومحبطاته فالإيمان ينتقض بالردة كما ينتقض الوضوء بالحدث، وأهم نواقضه الشرك في الربوبية والشرك في الألوهية والشرك في الأسماء والصفات والاعتراض والتعالي على أحكام الشريعة وجحودها وردها أو الاستهزاء بها أو السخرية منها، والذي يترتب على الذي نقض إيمانه خروجه من الملة فلا تصح له صلاة ولا عمل حتى يجدد إيمانه."
  en: "A questioner asked what the nullifiers of faith are, what follows for one who nullified his faith, and whether a Muslim's prayer is valid while his faith is voided. The site's sharia department (fatwa no. 21863, 14 August 2007) answered that the nullifiers are faith's corrupters, invalidators and frustrators — faith is nullified by apostasy as wudu is by ritual impurity; the chief ones: shirk in lordship, shirk in divinity, shirk in the names and attributes, and objecting to, holding oneself above, denying, rejecting, mocking or ridiculing the sharia's rulings; the one who nullifies his faith leaves the community — no prayer or deed of his stands until he renews his faith. Recorded as AMJA's answer."
  ur: "ایک سائل نے ایمان کے نواقض پوچھے۔ شریعت شعبے ⁦(فتویٰ 21863، 14 اگست 2007)⁩ کے مطابق اہم نواقض — ربوبیت الوہیت اسماء و صفات میں شرک اور شریعت کے احکام کا انکار یا مذاق — ہیں؛ ناقض ایمان کا مرتد خارج ہو کر نماز باطل ہوتی ہے۔"
  es: "Un usuario preguntó cuáles son los anuladores de la fe, qué consecuencias tiene para quien la anula y si la oración de un musulmán es válida mientras su fe está invalidada. El departamento de la sharia del sitio (fatwa n.° 21863, 14 de agosto de 2007) respondió que los anuladores son los corruptores, invalidadores y frustradores de la fe: la fe se anula por la apostasía, así como el wudu por la impureza ritual; los principales son: la idolatría en la soberanía, la idolatría en la divinidad, la idolatría en los nombres y atributos, y la objeción, la pretensión de superioridad, la negación, el rechazo, la burla o el ridículo de las normas de la sharia; quien anula su fe abandona la comunidad: ninguna oración ni acto suyo es válido hasta que renueve su fe. Registrado como respuesta de AMJA."
  fr: "Un internaute a demandé quels sont les actes qui annulent la foi, ce qui arrive à celui qui a renié sa foi et si la prière d'un musulman est valide lorsque sa foi est abolie. Le département de la charia du site (fatwa n° 21863, 14 août 2007) a répondu que les actes qui annulent la foi sont ceux qui la corrompent, l'invalident et la rendent impossible. La foi est abolie par l'apostasie, tout comme les ablutions (wudu) le sont par l'impureté rituelle. Les principaux actes sont: l'associationnisme (shirk) avec la seigneurie, l'associationnisme avec la divinité, l'associationnisme avec les noms et attributs, et le fait de s'opposer aux règles de la charia, de se croire supérieur, de les nier, de les rejeter, de s'en moquer ou de les ridiculiser. Celui qui renie sa foi quitte la communauté; aucune de ses prières ni de ses actions n'est valable tant qu'il n'a pas renouvelé sa foi. Cette réponse est celle d'AMJA."
