label: { ar: "كتاب سيبويه", en: "Sibawayh's Kitab" }
summary:
  ar: "كتاب سيبويه في النحو الذي قال ابن النديم لم يسبقه إلى مثله أحد قبله ولم يلحق به من بعده، وقرأ بخط أبي العباس ثعلب أنه اجتمع على صنعة الكتاب اثنان وأربعون إنسانا منهم سيبويه والأصول والمسائل للخليل، وكان المبرد إذا أراد إنسانا أن يقرأ عليه الكتاب قال له هل ركبت البحر تعظيما له، وكان المازني يقول من أراد أن يعمل كتابا كبيرا في النحو بعد كتاب سيبويه فليستح {cite:fihrist-ibn-al-nadim p. 142-143}."
  en: "Sibawayh's grammar book — no precedent before and no peer after; 42 men aided its making per Tha'lab {cite:fihrist-ibn-al-nadim p. 142-143}."
