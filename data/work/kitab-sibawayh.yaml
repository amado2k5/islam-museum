label: { ar: "كتاب سيبويه", en: "Sibawayh's Kitab", es: "El Kitáb de Sibawayh", fr: "Kitab de Sibawayh", ur: "سباویہ کی کتاب", tr: "Sibawayh Kitabı", id: "Buku Sibawayh" }
summary:
  ar: "كتاب سيبويه في النحو الذي قال ابن النديم لم يسبقه إلى مثله أحد قبله ولم يلحق به من بعده، وقرأ بخط أبي العباس ثعلب أنه اجتمع على صنعة الكتاب اثنان وأربعون إنسانا منهم سيبويه والأصول والمسائل للخليل، وكان المبرد إذا أراد إنسانا أن يقرأ عليه الكتاب قال له هل ركبت البحر تعظيما له، وكان المازني يقول من أراد أن يعمل كتابا كبيرا في النحو بعد كتاب سيبويه فليستح {cite:fihrist-ibn-al-nadim p. 142-143}."
  en: "Sibawayh's grammar book — no precedent before and no peer after; 42 men aided its making per Tha'lab {cite:fihrist-ibn-al-nadim p. 142-143}."
  es: "El libro de gramática de Sibawayh: sin precedentes ni igual después; 42 hombres ayudaron en su elaboración según Tha'lab {cite:fihrist-ibn-al-nadim p. 142-143}."
  fr: "Le livre de grammaire de Sibawayh — aucun précédent avant et aucun pair après; 42 hommes ont aidé à sa réalisation selon Tha'lab {cite:fihrist-ibn-al-nadim p. 142-143}."
  ur: "سیباویہ کی گرامر کی کتاب — اس سے پہلے کوئی نظیر نہیں اور اس کے بعد کوئی ہم مرتبہ نہیں۔ 42 آدمیوں نے اسے فی ثعلب بنانے میں مدد کی۔ 142-143}۔"
  tr: "İbn el-Nadim'in söylediği dilbilgisi kitabı, kendisinden önce kimse tarafından eşsiz ve takip edilmemiştir. Ebu el-Abbas Tha'lab'ın el yazısıyla kırk iki kişinin kitabı hazırlamak için toplandığını, Sibawayh de dahil olduğunu ve prensiplerin ve meselelerin el-Halil'e ait olduğunu okudu. El-Mübarrad kitabı ona birinin okumasını istediğinde, 'Ona saygı duymak için denize mi çıktın?' diye sorardı. El-Mazini şöyle derdi: 'Sibawayh'in kitabından sonra büyük bir dilbilgisi kitabı yapmak isteyen utansın.' {atıf:Fihrist-ibn-al-Nadim s. 142-143}."
  id: "Buku tata bahasa Sibawayh, yang menurut Ibn al-Nadim, tidak tertandingi oleh siapa pun sebelumnya maupun yang diikutinya. Ia membaca dengan tulisan tangan Abu al-Abbas Tha'lab bahwa empat puluh dua orang berkumpul untuk membuat buku itu, termasuk Sibawayh, dan prinsip serta isu-isu itu ditulis oleh al-Khalil. Ketika al-Mubarrad ingin seseorang membacakan buku itu kepadanya, ia akan bertanya, 'Apakah Anda menaiki laut karena hormat kepadanya?' Al-Mazini biasa berkata, 'Siapa pun yang ingin membuat buku tata bahasa yang hebat setelah buku Sibawayh, biarlah ia malu.' {cite:fihrist-ibn-al-nadim hlm. 142-143}."
