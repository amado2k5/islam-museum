summary:
  ar: "«المقتضب» كتاب في علم النحو العربي نسبه ملخص بحثي قُدّم إلى المتحف إلى المبرد، وذكر تاريخه هكذا: وفاة المؤلف 898م / 285هـ {cite:wikipedia-al-muqtadab-ar}. وعدّه الملخص بين ستين كتاباً هي الأكثر استشهاداً بها في علوم العربية الخمسة."
  en: "al-Muqtadab is a work of Arabic grammar that a research summary supplied to the museum ascribes to al-Mubarrad, giving its date as: author died 898 CE / 285 AH {cite:wikipedia-al-muqtadab-ar}. The summary counts it among sixty of the most-cited works in the five Arabic sciences."
  ur: "«المقتضب» عربی نحو کی کتاب ہے جسے عجائب گھر کو دیا گیا ایک تحقیقی خلاصہ المبرد سے منسوب کرتا ہے اور اس کی تاریخ یوں دیتا ہے: مصنف کی وفات 898 ء / 285 ھ {cite:wikipedia-al-muqtadab-ar}۔ خلاصہ اسے عربی کے پانچ علوم کی ساٹھ سب سے زیادہ حوالہ دی جانے والی کتابوں میں شمار کرتا ہے۔"
  fr: "al-Muqtadab est un ouvrage de grammaire arabe qu'un résumé de recherche remis au musée attribue à al-Mubarrad, en donnant sa date ainsi : mort de l'auteur 898 ap. J.-C. / 285 de l'Hégire {cite:wikipedia-al-muqtadab-ar}. Le résumé le compte parmi soixante des ouvrages les plus cités dans les cinq sciences de l'arabe."
  es: "al-Muqtadab es una obra de gramática árabe que un resumen de investigación entregado al museo atribuye a al-Mubarrad, y cuya fecha da así: muerte del autor 898 d. C. / 285 de la hégira {cite:wikipedia-al-muqtadab-ar}. El resumen la cuenta entre sesenta de las obras más citadas en las cinco ciencias del árabe."
