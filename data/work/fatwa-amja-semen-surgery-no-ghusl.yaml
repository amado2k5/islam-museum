id: work/fatwa-amja-semen-surgery-no-ghusl
class: work
kind: fatwa
label: { ar: "إخراج المني بعملية", en: "Semen drawn by surgery — no washing, prayers stand", ur: "آپریشن سے منی — غسل نہیں", es: "Semen extraído mediante cirugía: sin lavado, oraciones en pie" }
summary:
  ar: "سأل سائل هل إخراج المني بعملية جراحية يوجب الغسل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83805 بتاريخ 17 فبراير 2011)⁩ أن الذي يوجب الغسل هو خروج المني بشهوة أما خروجه لعلة أو إخراجه من أصله بعملية جراحية فإنه لا يوجب الغسل، وعلى هذا فصلاته في تلك المدة صلاة صحيحة ولا يلزمه القضاء."
  en: "A questioner asked whether semen drawn out by surgery obliges the washing. Dr. Salah al-Sawi (fatwa no. 83805, 17 February 2011) answered that what obliges washing is semen leaving with desire; its leaving for a cause, or being drawn at the root by a surgical operation, does not oblige it — accordingly his prayers in that span are valid and no make-up binds him."
  ur: "ایک سائل نے آپریشن سے منی نکلنے پر غسل پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83805، 17 فروری 2011)⁩ کے مطابق شہوت کے بغیر غسل نہیں — نمازیں صحیح ہیں۔"
  es: "Un consultante preguntó si el semen extraído mediante cirugía obliga al lavado. El Dr. Salah al-Sawi (fatwa n.° 83805, 17 de febrero de 2011) respondió que lo que obliga al lavado es el semen que sale con deseo; su salida por una causa, o ser extraído de raíz mediante una operación quirúrgica, no lo obliga; por lo tanto, sus oraciones en ese lapso son válidas y no le obliga ningún lavado."
