id: work/fatwa-amja-semen-surgery-no-ghusl
class: work
kind: fatwa
label: { ar: "إخراج المني بعملية", en: "Semen drawn by surgery — no washing, prayers stand", ur: "آپریشن سے منی — غسل نہیں", es: "Semen extraído mediante cirugía: sin lavado, oraciones en pie", fr: "Sperme prélevé par chirurgie — pas de lavage, prières", tr: "Operasyonla meni çıkarma", id: "Pengangkatan sperma melalui operasi" }
summary:
  ar: "سأل سائل هل إخراج المني بعملية جراحية يوجب الغسل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83805 بتاريخ 17 فبراير 2011)⁩ أن الذي يوجب الغسل هو خروج المني بشهوة أما خروجه لعلة أو إخراجه من أصله بعملية جراحية فإنه لا يوجب الغسل، وعلى هذا فصلاته في تلك المدة صلاة صحيحة ولا يلزمه القضاء."
  en: "A questioner asked whether semen drawn out by surgery obliges the washing. Dr. Salah al-Sawi (fatwa no. 83805, 17 February 2011) answered that what obliges washing is semen leaving with desire; its leaving for a cause, or being drawn at the root by a surgical operation, does not oblige it — accordingly his prayers in that span are valid and no make-up binds him."
  ur: "ایک سائل نے آپریشن سے منی نکلنے پر غسل پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83805، 17 فروری 2011)⁩ کے مطابق شہوت کے بغیر غسل نہیں — نمازیں صحیح ہیں۔"
  es: "Un consultante preguntó si el semen extraído mediante cirugía obliga al lavado. El Dr. Salah al-Sawi (fatwa n.° 83805, 17 de febrero de 2011) respondió que lo que obliga al lavado es el semen que sale con deseo; su salida por una causa, o ser extraído de raíz mediante una operación quirúrgica, no lo obliga; por lo tanto, sus oraciones en ese lapso son válidas y no le obliga ningún lavado."
  fr: "Un internaute a demandé si l'éjaculation, provoquée par une intervention chirurgicale, obligeait à se purifier. Le Dr Salah al-Sawi (fatwa n° 83805, 17 février 2011) a répondu que seule l'éjaculation volontaire oblige à se purifier; l'éjaculation provoquée ou l'éjaculation à la racine par une intervention chirurgicale n'y obligent pas – par conséquent, ses prières accomplies pendant cette période sont valides et aucune purification supplémentaire ne le contraint."
  tr: "Bir soru soran kişiye, meni cerrahi işlemle alınmasının ghusl gerektirip gerektirmediği soruldu. Dr. Salah Al-Sawy (Fetva No. 83805, 17 Şubat 2011) ghusl'un istenerek meni salınımı olduğunu, ancak kusur nedeniyle çıkarılması veya cerrahi ile meniden ayrılması durumunda gusl gerekmediğini yanıtladı. Bu nedenle, bu süre zarfındaki duaları geçerlidir ve orucu telafi etmek zorunda değildir."
  id: "Seorang penanya ditanya apakah pengambilan sperma melalui prosedur bedah memerlukan ghusl. Dr. Salah Al-Sawy (Fatwa No. 83805 tanggal 17 Februari 2011) menjawab bahwa yang membutuhkan ghusl adalah emisi semen melalui keinginan, tetapi jika diangkat karena cacat atau pengangkatan dari asalnya melalui operasi, maka tidak memerlukan ghusl. Oleh karena itu, doanya selama periode tersebut sah dan dia tidak wajib untuk menebus puasa."
