id: work/fatwa-amja-congratulating-on-feasts
class: work
kind: fatwa
label: { ar: "تهنئة النصارى بأعيادهم عند بعض العلماء", en: "Scholars congratulating Christians on their feasts", ur: "بعض علماء کی طرف سے مسیحی تہواروں کی مبارکباد", es: "Eruditos felicitando a los cristianos por sus festividades." }
summary:
  ar: "سأل سائل هل لبعض العلماء سلف أو دليل في تهنئة النصارى عباد الصليب في أعيادهم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78925 بتاريخ 20 مايو 2009)⁩ أن الأصل البر والقسط بالمعاهدين لأهل الإسلام من غير المسلمين وقد يدخل في ذلك عند بعض المنتسبين إلى العلم تهنئتهم بأعيادهم وهذا موضع نظر، لأن الصواب أن الأعياد من جملة المناسك وقد قال تعالى لكل أمة جعلنا منسكًا هم ناسكوه فالمشاركة فيها والتهنئة بها لا تجوز ويبقى البر والقسط فيما وراء ذلك."
  en: "A questioner asked whether scholars congratulating Christians on their feasts have any precedent or proof. Dr. Salah al-Sawi (fatwa no. 78925, 20 May 2009) answered that the default is kindness and equity toward covenant non-Muslims, into which some counted among the learned fold congratulations on their feasts — but that is open to question, since the sound view is that feasts are among the rites, per 'for every community We appointed a rite they observe'; sharing in them or congratulating on them is not permissible, while kindness and equity continue in all else. Recorded as AMJA's answer."
  ur: "ایک سائل نے پوچھا کہ کیا علماء کی مسیحی تہواروں پر مبارکباد کی کوئی دلیل ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78925، 20 مئی 2009)⁩ کے مطابق عیدیں مناسک ہیں اور ان میں شرکت یا مبارکباد جائز نہیں؛ باقی معاملات میں بر و قسط برقرار ہے۔"
  es: "Un interlocutor preguntó si existía algún precedente o prueba de que los eruditos felicitaran a los cristianos por sus festividades. El Dr. Salah al-Sawi (fatwa n.º 78925, 20 de mayo de 2009) respondió que la norma general es la bondad y la equidad hacia los no musulmanes del pacto, entre los que algunos eruditos incluyeron las felicitaciones por sus festividades; sin embargo, esto es cuestionable, ya que la opinión correcta es que las festividades se encuentran entre los ritos, según el principio de que «para cada comunidad hemos establecido un rito que observan»; participar en ellas o felicitarlas no está permitido, mientras que la bondad y la equidad se mantienen en todo lo demás. Registrada como respuesta de AMJA."
