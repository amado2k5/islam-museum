summary:
  ar: "سائل سأل عن تسمية شركة باسم البخاري كعلامة تجارية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22219)⁩ أن التسمية باسم البخاري كعلامة تجارية أمر جائز شرعًا ولا إثم فيه ولا حرج مع مراعاة اللوائح والقوانين المنظمة، على ما فصّل الجواب."
  en: "A questioner asked about naming a company 'al-Bukhari' as a trade name. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22219) answered that using the name al-Bukhari as a trademark is lawful — no sin and no harm in it — subject to the governing regulations and laws, as the answer details."
  ur: "ایک سائل نے تجارتی نام کے طور پر کمپنی کا نام 'البخاری' رکھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22219)⁩ نے جواب دیا کہ البخاری نام بطور تجارتی نشان رکھنا شرعاً جائز ہے، اس میں نہ گناہ ہے نہ حرج، بشرطیکہ متعلقہ قواعد و قوانین کی رعایت ہو، جیسا کہ جواب میں تفصیل ہے۔"
