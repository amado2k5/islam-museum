id: work/fatwa-islamweb-delay-in-currency-exchange
class: work
kind: fatwa
label: { ar: "التقابض شرط في المجلس في بيع العملات", en: "Delaying payment in a currency exchange", ur: "کرنسی کے تبادلے میں ادائیگی مؤخر کرنا" }
summary:
  ar: "سؤال عن تأجيل الصرّاف إعطاء المبلغ بعد المصارفة. أجاب مركز الفتوى في إسلام ويب بأن التقابض في مجلس العقد واجب عند بيع عملة بأخرى، استنادًا إلى حديث «يدًا بيد» في رواية مسلم، فلا يجوز تأخير قبض العوضين أو أحدهما أو بعضه عن المجلس، لأن ذلك من ربا النسيئة، وأحال على فتاوى أخرى في ربا النسيئة وربا الفضل."
  en: "A question on whether a money-changer may defer handing over the sum after an exchange. The IslamWeb fatwa centre answered that when one currency is sold for another both must be handed over in the same sitting, citing the hand-to-hand hadith in Muslim's collection; delaying receipt of either counter-value, or any part of it, beyond the sitting is not permitted because it is a form of riba al-nasi'a, and it referred to further fatwas on riba al-nasi'a and riba al-fadl."
  ur: "یہ سوال کہ کیا صراف تبادلے کے بعد رقم دینا مؤخر کر سکتا ہے۔ اسلام ویب کے مرکزِ فتویٰ نے جواب دیا کہ ایک کرنسی دوسری کے بدلے بیچتے وقت اسی مجلس میں دونوں طرف سے قبضہ ضروری ہے، اور صحیح مسلم کی «ہاتھوں ہاتھ» والی حدیث سے استدلال کیا؛ دونوں عوض یا ان میں سے کسی ایک یا اس کے کچھ حصے کا قبضہ مجلس سے مؤخر کرنا جائز نہیں کیونکہ یہ ربا النسیئہ کی ایک صورت ہے، اور ربا النسیئہ اور ربا الفضل پر دوسرے فتاویٰ کا حوالہ دیا۔"
