id: work/fi-rihab-al-hadith-al-qudsiyyah
class: work
kind: lecture-series
label:
  ar: "في رحاب الحديث القدسي (برنامج تلفزيوني)"
  en: "In the Courts of the Hadith Qudsi (television programme)"
  ur: "فی رحاب الحدیث القدسی: حدیثِ قدسی کے آنگن میں (ٹیلی وژن پروگرام)"
summary:
  ar: "برنامج تلفزيوني يحفظ أرشيف أسابيل منه ثلاثين حلقة مصوّرة، تبدأ كل منها بحديث قدسي أو نبوي يشرحه مقدّم البرنامج بالآيات وأقوال المفسرين وأفلام علمية، ثم يتكلم فيه محمد متولي الشعراوي: تعريف الحديث القدسي، وشهادة الجوارح، والمطر والنجوم، وخلق آدم، وأطوار الجنين والقدر، والمرض، والعفو، ويونس، وموسى والعبد الصالح، والكوثر، والنار، وذبح الموت، والميثاق، وعرفات، والسواك، والصيام، ومحبة الله، والرحم، والصبر، والاستغفار، ورؤية الله."
  en: "A television programme of which the Assabile archive keeps thirty video episodes. Each opens with a hadith qudsi or a prophetic hadith that the presenter explains with verses, the views of the commentators and science films, after which Muhammad Mutawalli al-Sha'rawi speaks on it: the definition of the hadith qudsi, the witness of the limbs, rain and the stars, Adam's creation, the embryo and divine decree, illness, pardon, Yunus, Musa and the righteous servant, al-Kawthar, the Fire, the slaughter of death, the covenant, 'Arafat, the miswak, fasting, love for God, kinship, patience, seeking forgiveness and the vision of God."
  ur: "ایک ٹیلی وژن پروگرام جس کی تیس ویڈیو اقساط اسابیل آرکائیو میں محفوظ ہیں۔ ہر قسط ایک حدیثِ قدسی یا حدیثِ نبوی سے شروع ہوتی ہے جس کی میزبان آیات، مفسرین کے اقوال اور سائنسی فلموں سے شرح کرتے ہیں، پھر محمد متولی الشعراوی اس پر گفتگو کرتے ہیں: حدیثِ قدسی کی تعریف، اعضا کی گواہی، بارش اور ستارے، آدم کی تخلیق، جنین اور تقدیر، بیماری، معافی، یونس، موسیٰ اور نیک بندہ، کوثر، آگ، موت کا ذبح، میثاق، عرفات، مسواک، روزہ، اللہ کی محبت، رشتہ داری، صبر، استغفار اور دیدارِ الٰہی۔"
