id: work/fi-rihab-al-hadith-al-qudsiyyah
class: work
kind: lecture-series
label:
  ar: "في رحاب الحديث القدسي ⁦(برنامج تلفزيوني)⁩"
  en: "In the Courts of the Hadith Qudsi (television programme)"
  ur: "فی رحاب الحدیث القدسی: حدیثِ قدسی کے آنگن میں ⁦(ٹیلی وژن پروگرام)⁩"
  es: "En los Tribunales del Hadith Qudsi (programa de televisión)"
  fr: "Dans les tribunaux du Hadith Qudsi (émission de télévision)"
  tr: "Kutsal Hadis Diyarında (TV Programı)"
  id: "Di Alam Hadis Suci (Program TV)"
summary:
  ar: "برنامج تلفزيوني يحفظ أرشيف أسابيل منه ثلاثين حلقة مصوّرة، تبدأ كل منها بحديث قدسي أو نبوي يشرحه مقدّم البرنامج بالآيات وأقوال المفسرين وأفلام علمية، ثم يتكلم فيه محمد متولي الشعراوي: تعريف الحديث القدسي، وشهادة الجوارح، والمطر والنجوم، وخلق آدم، وأطوار الجنين والقدر، والمرض، والعفو، ويونس، وموسى والعبد الصالح، والكوثر، والنار، وذبح الموت، والميثاق، وعرفات، والسواك، والصيام، ومحبة الله، والرحم، والصبر، والاستغفار، ورؤية الله."
  en: "A television programme of which the Assabile archive keeps thirty video episodes. Each opens with a hadith qudsi or a prophetic hadith that the presenter explains with verses, the views of the commentators and science films, after which Muhammad Mutawalli al-Sha'rawi speaks on it: the definition of the hadith qudsi, the witness of the limbs, rain and the stars, Adam's creation, the embryo and divine decree, illness, pardon, Yunus, Musa and the righteous servant, al-Kawthar, the Fire, the slaughter of death, the covenant, 'Arafat, the miswak, fasting, love for God, kinship, patience, seeking forgiveness and the vision of God."
  ur: "ایک ٹیلی وژن پروگرام جس کی تیس ویڈیو اقساط اسابیل آرکائیو میں محفوظ ہیں۔ ہر قسط ایک حدیثِ قدسی یا حدیثِ نبوی سے شروع ہوتی ہے جس کی میزبان آیات، مفسرین کے اقوال اور سائنسی فلموں سے شرح کرتے ہیں، پھر محمد متولی الشعراوی اس پر گفتگو کرتے ہیں: حدیثِ قدسی کی تعریف، اعضا کی گواہی، بارش اور ستارے، آدم کی تخلیق، جنین اور تقدیر، بیماری، معافی، یونس، موسیٰ اور نیک بندہ، کوثر، آگ، موت کا ذبح، میثاق، عرفات، مسواک، روزہ، اللہ کی محبت، رشتہ داری، صبر، استغفار اور دیدارِ الٰہی۔"
  es: "Un programa de televisión del que el archivo Assabile conserva treinta episodios en vídeo. Cada uno comienza con un hadiz qudsi o un hadiz profético que el presentador explica con versículos, las opiniones de los comentaristas y películas científicas, tras lo cual Muhammad Mutawalli al-Sha'rawi habla sobre él: la definición del hadiz qudsi, el testimonio de los miembros, la lluvia y las estrellas, la creación de Adán, el embrión y el decreto divino, la enfermedad, el perdón, Yunus, Musa y el siervo justo, al-Kawthar, el Fuego, la matanza de la muerte, el pacto, 'Arafat, el miswak, el ayuno, el amor a Dios, el parentesco, la paciencia, la búsqueda del perdón y la visión de Dios."
  fr: "Une émission de télévision dont les archives d'Assabile conservent trente épisodes vidéo. Chaque épisode s'ouvre sur un hadith qudsi ou un hadith prophétique que le présentateur explique à l'aide de versets, des avis des commentateurs et de vidéos scientifiques, après quoi Muhammad Mutawalli al-Sha'rawi intervient: la définition du hadith qudsi, le témoignage des membres, la pluie et les étoiles, la création d'Adam, l'embryon et le décret divin, la maladie, le pardon, Jonas, Moïse et le serviteur vertueux, al-Kawthar, le Feu, le sacrifice de la mort, l'alliance, Arafat, le miswak, le jeûne, l'amour de Dieu, la parenté, la patience, la recherche du pardon et la vision de Dieu."
  tr: "İsabel'in arşivini otuz çekilmiş bölümden koruyan bir televizyon programı; her bölüm, program sunucusu tarafından ayetler, yorumcuların sözleri ve bilimsel filmlerle açıklanan kutsal veya peygamberlik hadisleriyle başlar. Sonra Muhammed Metvally El-Şaarawi şunları anlatacaktır: kutsal hadisin tanımı, uzuvların tanıklığı, yağmur ve yıldızlar, Adem'in yaratılışı, fetüsün ve kaderin aşamaları, hastalık, bağışlama, Yunus, Musa ve doğru hizmetkâr El-Kavthar, ateş, ölümün katliamı, antlaşma, Arafat, misvak, oruç, Tanrı'ya sevgi, merhamet, sabır, af arama ve Tanrı'yı görme."
  id: "Sebuah program televisi yang menyimpan arsip Isabel dari tiga puluh episode yang direkam, masing-masing dimulai dengan hadits suci atau nubuat yang dijelaskan oleh pembawa acara dengan ayat, ucapan komentator, dan film ilmiah. Kemudian Muhammad Metwally Al-Shaarawi akan membicarakan: definisi hadis suci, kesaksian anggota tubuh, hujan dan bintang, penciptaan Adam, tahapan janin dan takdir, penyakit, pengampunan, Yunus, Musa dan hamba yang benar, Al-Kawthar, api, pembantaian kematian, perjanjian, Arafat, kekacauan, puasa, kasih kepada Tuhan, belas kasihan, kesabaran, mencari pengampunan, dan melihat Tuhan."
