label: { ar: "قنوت الفجر ومتابعة الإمام", en: "Qunut in the Fajr prayer — an ijtihad matter not to be condemned", ur: "فجر میں قنوت — اجتہادی مسئلہ", es: "El uso del Qunut en la oración del Fajr: una cuestión de ijtihad que no debe ser condenada.", fr: "Qunut dans la prière de Fajr — question d'ijtihad à ne pas condamner", tr: "Fajr Kunut ve İmam'ın Takibi", id: "Fajr Qunoot dan Tindak Lanjut Imam" }
summary:
  ar: "سأل سائل عن حكم القنوت في صلاة الفجر ومدى صحة متابعة الإمام الذي يصر عليه. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21987 بتاريخ 14 أكتوبر 2012)⁩ أن هذه المسألة من مسائل الاجتهاد التي لا ينكر فيها على المخالف لكن يتناصح الناس فيها بالبينات والحجج العلمية وقد قال بالقنوت في صلاة الفجر بعض أئمة المذاهب المتبوعة على ما فصّل الجواب من حكم المتابعة."
  en: "A questioner asked the ruling on qunut in Fajr and the soundness of following an imam who insists on it. AMJA's fatwa committee (fatwa no. 21987, 14 October 2012) answered that this is among ijtihad's questions in which the dissenter is not condemned, though people counsel one another with proofs; some imams of the followed schools did hold Fajr qunut — the answer detailing the ruling on following."
  ur: "فجر کا قنوت؟ لجنة الفتوى ⁦(فتویٰ 21987، 14 اکتوبر 2012)⁩ کے مطابق اجتہادی اختلاف — مخالف پر انکار نہیں؛ بعض ائمہ نے کہا۔"
  es: "Un consultante preguntó sobre el dictamen acerca del qunut en el Fajr y la validez de seguir a un imán que insiste en ello. El comité de fatwas de AMJA (fatwa n.° 21987, 14 de octubre de 2012) respondió que esta es una de las cuestiones de ijtihad en las que no se condena al disidente, aunque la gente se aconseja mutuamente con pruebas; algunos imanes de las escuelas seguidas sí realizaban el qunut del Fajr. La respuesta detalla el dictamen sobre el seguimiento."
  fr: "Un internaute a interrogé l'AMJA sur la règle concernant le qunut à la prière de Fajr et sur la pertinence de suivre un imam qui l'impose. Le comité de fatwas de l'AMJA (fatwa n° 21987, 14 octobre 2012) a répondu que cette question relève de l'ijtihad et que le désaccord n'est pas condamné, même si les fidèles s'éclaircissent mutuellement sur les preuves. Certains imams des écoles reconnues pratiquent le qunut à Fajr – la réponse détaillant la règle à suivre."
  tr: "Bir soruya Fajr namazındaki kunot hakkı ve ısrar eden imamı takip etmenin geçerliliği hakkında soru soruldu. Amerikan Şeriat Hukukçuları Konseyi'ndeki Fetva Komitesi (14 Ekim 2012 tarihli 21987 No. Fetva) bu konunun irtihad (bağımsız akıl yürütme) meselesi olduğunu, karşıtın eleştirilmediğini, ancak insanların kanıt ve bilimsel argümanlarla danıştığını yanıtladı. Aşağıdaki düşünceyi takip eden önde gelen bazı okullar, Fajr namazında takip etme hükmiyle ilgili olarak künut söylemişlerdir."
  id: "Seorang penanya ditanya tentang aturan qunoot dalam shalat Fajr dan keabsahan mengikuti imam yang bersikeras menekuni hal itu. Komite Fatwa di American Council of Sharia Jurists menanggapi (Fatwa No. 21987 tanggal 14 Oktober 2012) bahwa isu ini adalah masalah ijtihad (penalaran independen) di mana lawan tidak dikritik, tetapi orang berkonsultasi dengan bukti dan argumen ilmiah. Beberapa aliran pemikiran terkemuka yang mengikuti berikut ini telah mengucapkan qunoot dalam shalat Fajr mengenai putusan mengikuti itu."
