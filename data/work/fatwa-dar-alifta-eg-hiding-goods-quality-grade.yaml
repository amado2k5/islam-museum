id: work/fatwa-dar-alifta-eg-hiding-goods-quality-grade
class: work
kind: fatwa
label: { ar: "حكم إخفاء درجة جودة السلعة عند بيعها", en: "Concealing a good's quality grade when selling it", ur: "بیچتے وقت چیز کے معیار کا چھپانا", es: "Ocultar el grado de calidad de un producto al venderlo.", fr: "Dissimuler la qualité d'un produit lors de sa vente" }
summary:
  ar: "سائل سأل عن تاجر باع قطعة من السلع أخفى درجة جودتها عن المشتري. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21496)⁩ أن المصارحة والمكاشفة أمر مطلوب في البيع والغش والكتمان أمر ممنوع شرعًا ويأثم فاعله على ما فصّل الجواب."
  en: "A questioner asked about a merchant who sold goods concealing their quality grade from the buyer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21496) answered that candour is required in sale while deception and concealment are forbidden and sinful — as the answer details."
  ur: "ایک سائل نے ایسے تاجر کا حکم پوچھا جس نے چیز بیچتے وقت اس کا معیار خریدار سے چھپایا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21496)⁩ نے جواب دیا کہ بیع میں صاف گوئی مطلوب ہے اور دھوکا اور چھپانا ممنوع اور گناہ ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre un comerciante que vendía mercancías ocultando su calidad al comprador. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21496) respondió que la franqueza es necesaria en la venta, mientras que el engaño y la ocultación están prohibidos y son pecaminosos, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant un commerçant qui vendait des marchandises en dissimulant leur qualité à l'acheteur. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21496) a répondu que la sincérité est de rigueur dans la vente, tandis que la tromperie et la dissimulation sont interdites et constituent un péché, comme le précise la réponse."
