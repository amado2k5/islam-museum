id: work/fatwa-aliftaa-jo-returning-a-gold-ring-that-does-not-fit
class: work
kind: fatwa
label: { ar: "إعادة خاتم ذهب لم يناسب المقاس", en: "Returning a gold ring that does not fit", ur: "ناپ پورا نہ آنے والی سونے کی انگوٹھی واپس کرنا" }
summary:
  ar: "سؤال عن إعادة خاتم ذهب لم يناسب المقاس، أجابت فيه دائرة الإفتاء العام الأردنية بأن الإقالة في بيع الذهب جائزة ومستحبة للبائع، وهي فسخ لا عقد جديد، فيسترد المشتري الثمن الذي دفعه لا سعر اليوم، بشرط ألا تكون مشروطة عند العقد. أجابت الدائرة بأنه يستحب للبائع أن يقيل المشتري إذا ندم وطلب الإقالة، واستدلت بحديث رواه أبو داود معناه أن من أقال مسلمًا أقال الله عثرته. وقالت إن الإقالة فسخ للعقد وليست عقدًا جديدًا على القول المعتمد عند الشافعية، فيسترد البائع المبيع ويسترد المشتري الثمن، وإنها تثبت في بيع الذهب، ونقلت عن زكريا الأنصاري في أسنى المطالب (2/74) أنه فرع على كونها فسخًا جواز افتراق المتقايلين في الصرف قبل التقابض. وخلصت إلى أن البائع يسترد الذهب بالسعر الذي باع به لا بسعر اليوم، بشرط ألا يكون ذلك مشروطًا عند التعاقد لأن عقد الصرف لا يدخله الخيار، وأن البائع إن لم يوافق على الإقالة فلا مانع من بيع الخاتم له بالسعر الذي يتراضيان عليه."
  en: "A question about returning a gold ring that does not fit, in which Jordan's General Iftaa Department answered that rescinding a gold sale (iqala) is permitted and recommended for the seller; it is a rescission, not a new contract, so the buyer gets back the price he paid rather than today's price, provided this was not stipulated in the contract. The Department answered that the seller is encouraged to release the buyer from the sale if he regrets it and asks, citing a hadith narrated by Abu Dawud whose meaning is that whoever releases a Muslim from a sale, God will release him from his stumbling. It said that rescission is a cancellation of the contract, not a new contract, according to the relied-upon Shafi'i view, so the seller takes back the goods and the buyer takes back the price, and that it applies to gold sales, quoting Zakariyya al-Ansari in Asna al-Matalib (2/74) that, because it is a cancellation, the parties may part before mutual possession in a currency exchange. It concluded that the seller takes back the gold at the price at which he sold it, not at today's price, provided this was not stipulated at the time of the contract, since no option may be attached to a currency exchange; if the seller does not agree to rescind, the buyer may sell the ring to him at whatever price they agree."
  ur: "ناپ پورا نہ آنے والی سونے کی انگوٹھی واپس کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سونے کی بیع میں اقالہ جائز اور بیچنے والے کے لیے مستحب ہے؛ یہ فسخ ہے، نیا عقد نہیں، اس لیے خریدار ادا کردہ قیمت واپس لے گا نہ کہ آج کی قیمت، بشرطیکہ عقد کے وقت یہ شرط نہ لگائی گئی ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر خریدار نادم ہو کر اقالہ مانگے تو بیچنے والے کے لیے اقالہ مستحب ہے، اور ابو داود کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ جو کسی مسلمان سے اقالہ کرے اللہ اس کی لغزش معاف کرے گا۔ اس نے کہا کہ شافعیہ کے معتمد قول کے مطابق اقالہ عقد کا فسخ ہے، نیا عقد نہیں، چنانچہ بیچنے والا مال اور خریدار قیمت واپس لیتا ہے، اور یہ سونے کی بیع میں بھی ثابت ہے، اور زکریا انصاری سے اسنی المطالب (2/74) میں نقل کیا کہ اقالہ کے فسخ ہونے کی بنا پر بیعِ صرف میں فریقین باہمی قبضے سے پہلے جدا ہو سکتے ہیں۔ اس نے نتیجہ نکالا کہ بیچنے والا سونا اسی قیمت پر واپس لے گا جس پر بیچا تھا، آج کی قیمت پر نہیں، بشرطیکہ یہ عقد کے وقت مشروط نہ ہو، کیونکہ بیعِ صرف میں خیار داخل نہیں ہوتا؛ اور اگر بیچنے والا اقالے پر راضی نہ ہو تو باہمی رضامندی کی قیمت پر انگوٹھی اسے بیچنے میں کوئی رکاوٹ نہیں۔"
