id: work/ahmed-el-sayed-seerah-lilmuslihin-ep30
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 30: عمرة القضاء ومعركة مؤتة"
  en: "The Prophetic Biography for Reformers, episode 30: Umrat al-Qada and the Battle of Mu'ta"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 30: عمرۃ القضاء اور معرکۂ موتہ"
  fr: "La biographie prophétique pour les réformateurs, épisode 30 : La Umra de compensation et la bataille de Mu'ta"
  es: "La biografía profética para los reformadores, episodio 30: La Umra de compensación y la batalla de Mu'ta"
summary:
  ar: "يتناول أحمد السيد عمرة القضاء في السنة السابعة للهجرة، والزواج من ميمونة في سرف، وغزوة ذات الرقاع، ومعركة مؤتة أمام جيش ضخم من الروم والنصارى العرب. ويستخلص للمصلحين دروسا في القوة النفسية والتدرج والعفو وشباب الصحابة."
  en: "Ahmed Elsayed covers the Umrat al-Qada of year 7 AH, the marriage to Maymuna at Sarif, the expedition of Dhat al-Riqa, and the Battle of Mu'ta against a vast Byzantine and Arab Christian force. He draws lessons for reformers on psychological strength, sequencing, forgiveness and the youth of the Companions."
  ur: "احمد السید ہجرت کے ساتویں سال کے عمرۃ القضاء، سرف میں میمونہ سے نکاح، غزوۂ ذات الرقاع اور رومیوں اور عرب عیسائیوں کے ایک عظیم لشکر کے مقابل معرکۂ موتہ کا ذکر کرتے ہیں۔ وہ مصلحین کے لیے نفسیاتی قوت، تدریج، عفو اور صحابہ کی جوانی سے اسباق نکالتے ہیں۔"
  fr: "Ahmed Elsayed traite de la Umra de compensation de l'an 7 de l'hégire, du mariage avec Maymuna à Sarif, de l'expédition de Dhat al-Riqa et de la bataille de Mu'ta contre une immense force byzantine et arabe chrétienne. Il en tire pour les réformateurs des leçons sur la force psychologique, la progressivité, le pardon et la jeunesse des Compagnons."
  es: "Ahmed Elsayed trata la Umra de compensación del año 7 de la hégira, el matrimonio con Maymuna en Sarif, la expedición de Dhat al-Riqa y la batalla de Mu'ta contra una inmensa fuerza bizantina y árabe cristiana. Extrae para los reformadores lecciones sobre la fortaleza psicológica, la gradualidad, el perdón y la juventud de los Compañeros."
