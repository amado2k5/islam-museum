id: work/fatwa-dar-alifta-eg-zakat-on-dental-clinic
class: work
kind: fatwa
label: { ar: "حكم زكاة عيادات الأسنان", en: "Zakat on dental clinics", ur: "دانتوں کی کلینک پر زکات" }
summary:
  ar: "طبيب أسنان سأل عن زكاة ما يملكه من مقر العيادة والأدوات والمعدات ومواد العلاج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21759)⁩ أن ما يملكه من مقر العيادة والأدوات والمعدات لا تجب فيه الزكاة شرعًا وكذلك ما يستهلكه من مواد على ما فصّل الجواب."
  en: "A dentist asked about zakat on his clinic premises, instruments, equipment and treatment materials. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21759) answered that the premises, instruments and equipment he owns carry no zakat in the sharia, nor do the materials consumed in treatment — as the answer details."
  ur: "ایک دانتوں کے ڈاکٹر نے اپنی کلینک کی جگہ، اوزار، آلات اور علاج کے سامان پر زکات پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21759)⁩ نے جواب دیا کہ کلینک کی جگہ، اوزار اور آلات پر زکات واجب نہیں اور نہ علاج میں خرچ ہونے والے سامان پر — جیسا کہ جواب میں تفصیل ہے۔"
