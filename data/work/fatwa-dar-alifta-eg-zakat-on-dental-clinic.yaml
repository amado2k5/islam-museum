id: work/fatwa-dar-alifta-eg-zakat-on-dental-clinic
class: work
kind: fatwa
label: { ar: "حكم زكاة عيادات الأسنان", en: "Zakat on dental clinics", ur: "دانتوں کی کلینک پر زکات", es: "Zakat en clínicas dentales", fr: "Zakat sur les cliniques dentaires" }
summary:
  ar: "طبيب أسنان سأل عن زكاة ما يملكه من مقر العيادة والأدوات والمعدات ومواد العلاج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21759)⁩ أن ما يملكه من مقر العيادة والأدوات والمعدات لا تجب فيه الزكاة شرعًا وكذلك ما يستهلكه من مواد على ما فصّل الجواب."
  en: "A dentist asked about zakat on his clinic premises, instruments, equipment and treatment materials. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21759) answered that the premises, instruments and equipment he owns carry no zakat in the sharia, nor do the materials consumed in treatment — as the answer details."
  ur: "ایک دانتوں کے ڈاکٹر نے اپنی کلینک کی جگہ، اوزار، آلات اور علاج کے سامان پر زکات پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21759)⁩ نے جواب دیا کہ کلینک کی جگہ، اوزار اور آلات پر زکات واجب نہیں اور نہ علاج میں خرچ ہونے والے سامان پر — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un dentista preguntó sobre el zakat aplicable a las instalaciones de su clínica, sus instrumentos, equipos y materiales de tratamiento. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21759) respondió que, según la sharia, las instalaciones, los instrumentos y los equipos que posee no están sujetos a zakat, ni tampoco los materiales utilizados en los tratamientos, tal como se detalla en la respuesta."
  fr: "Un dentiste a posé une question concernant la zakat sur les locaux de sa clinique, ses instruments, son matériel et les produits utilisés pour ses soins. La Dar al-Ifta d'Égypte (Grand Mufti Dr Nazir Muhammad Ayyad, fatwa n° 21759) a répondu que, selon la charia, ni les locaux, les instruments et le matériel lui appartenant, ni les produits utilisés pour les traitements n'y sont soumis, comme le précise la réponse."
