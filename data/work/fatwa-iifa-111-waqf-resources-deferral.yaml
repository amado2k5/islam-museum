id: work/fatwa-iifa-111-waqf-resources-deferral
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 111 (12/5) بشأن استثمار موارد الأوقاف ⁦(الأحباس)⁩ ⁦(مؤجل)⁩", en: "IIFA resolution 111 (12/5) on investing waqf ⁦(ahbas)⁩ resources ⁦(deferred)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 111 (12/5): اوقاف ⁦(احباس)⁩ کے وسائل کی سرمایہ کاری ⁦(مؤجل)⁩", es: "Resolución 111 (12/5) de la IIFA sobre la inversión de recursos waqf (ahbas) (aplazada)", fr: "Résolution 111 (12/5) de l'IIFA sur l'investissement des ressources waqf (ahbas) (reportée)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩. أجل إصدار قرار في استثمار موارد الأوقاف ⁦(الأحباس)⁩ لمزيد من البحث والدراسة، وبخاصة خمس فقرات سماها النص: استثمار الوقف؛ وقف النقود؛ الإبدال والاستبدال؛ خلط الأوقاف؛ والتفرقة بين الوقف والإرصاد ⁦(Trust)⁩. سُجّل بوصفه تأجيلًا لا حكمًا نهائيًا، واستُوفي جزء منه لاحقًا بقراري 119 ⁦(13/1)⁩ — وهو تأجيل آخر — و140 ⁦(15/6)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000). It deferred issuing a ruling on investing waqf (ahbas) resources pending further study, naming five points in particular: investing the waqf; cash waqf; ibdal and istibdal (substitution of the endowed asset); mixing waqfs; and distinguishing waqf from irsad (trust). Recorded as a deferral, not a final ruling; the subject was taken up again in resolutions 119 (13/1) — itself a deferral — and 140 (15/6)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں۔ اس نے اوقاف ⁦(احباس)⁩ کے وسائل کی سرمایہ کاری پر فیصلہ مزید تحقیق تک مؤجل کیا اور خصوصاً پانچ نکات نام لئے: وقف کی سرمایہ کاری؛ نقد وقف؛ ابدال اور استبدال ⁦(موقوفہ عین کی تبدیلی)⁩؛ اوقاف کا امتزاج؛ اور وقف اور ارصاد ⁦(ٹرسٹ)⁩ میں فرق۔ یہ مؤجل ہے، حتمی حکم نہیں؛ موضوع بعد میں قراردادوں 119 ⁦(13/1)⁩ — جو خود مؤجل ہے — اور 140 ⁦(15/6)⁩ میں اٹھایا گیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 12.ª sesión en Riad (25 de Jumada II – 1 de Rajab de 1421, 23-28 de septiembre de 2000). Aplazó la emisión de un dictamen sobre la inversión de los recursos del waqf (ahbas) a la espera de un estudio más profundo, mencionando cinco puntos en particular: la inversión del waqf; el waqf en efectivo; el ibdal y el istibdal (sustitución del bien patrimonial); la mezcla de waqfs; y la distinción entre waqf e irsad (fideicomiso). Registrada como un aplazamiento, no como un dictamen definitivo, el tema se retomó en las resoluciones 119 (13/1) —que también constituye un aplazamiento— y 140 (15/6)."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 12e session à Riyad (25 Jumada II – 1er Rajab 1421, 23-28 septembre 2000). Elle a reporté l'adoption d'une décision concernant l'investissement des ressources du waqf (ahbas) en attendant des études complémentaires, en mentionnant cinq points en particulier: l'investissement du waqf; le waqf en numéraire; l'ibdal et l'istibdal (substitution du bien doté); le regroupement des waqfs; et la distinction entre waqf et irsad (fiducie). Considérée comme un report et non comme une décision définitive, la question a été reprise dans les résolutions 119 (13/1) – elle-même un report – et 140 (15/6)."
