id: work/fatwa-dar-alifta-cleaning-mosque-carpets-with-chemicals
class: work
kind: fatwa
label: { ar: "حكم تطهير سجاد المساجد بالمواد الكيميائية", en: "Purifying mosque carpets with chemical cleaners", ur: "مسجد کے قالینوں کو کیمیائی مواد سے پاک کرنا" }
summary:
  ar: "سؤال عن إزالة النجاسة عن سجاد المساجد بالمنظفات الكيميائية السائلة، أجابت فيه دار الإفتاء المصرية بأن ذلك يجزئ ولا يشترط الماء. أجابت الدار بأن تطهير محل النجاسة لا يختص بالماء، بل يحصل بكل مائع طاهر مزيل. وقالت إن الأصل في هذه المنظفات أنها طاهرة في نفسها مزيلة لأعيان النجاسة، كما يقرر المتخصصون ويشهد به الواقع، فيجزئ تطهير السجاد بها. واستندت إلى قاعدة أن الأصل في الأعيان الطهارة، ونقلت ذلك عن الحطاب في شرح مختصر خليل وابن حجر الهيتمي في تحفة المحتاج."
  en: "A question on removing impurity from mosque carpets with liquid chemical cleaners, in which Egypt's Dar al-Ifta answered that this suffices and water is not required. Dar al-Ifta answered that purifying the place of impurity is not limited to water, but is achieved by any pure liquid that removes it. It said these cleaners are in principle pure in themselves and remove the substance of impurity, as specialists state and experience shows, so carpets may be purified with them. It relied on the rule that things are pure in principle, citing al-Hattab's commentary on the Mukhtasar of Khalil and Ibn Hajar al-Haytami's Tuhfat al-Muhtaj."
  ur: "مسجد کے قالینوں سے مائع کیمیائی صفائی کے مواد کے ذریعے نجاست دور کرنے کے بارے میں سوال، جس میں مصر کے دار الافتاء نے کہا کہ یہ کافی ہے اور پانی شرط نہیں۔ دار الافتاء نے جواب دیا کہ نجاست کی جگہ کو پاک کرنا پانی کے ساتھ خاص نہیں، بلکہ ہر پاک اور زائل کرنے والے مائع سے حاصل ہو جاتا ہے۔ اس نے کہا کہ یہ مواد اصلاً خود پاک اور نجاست کو دور کرنے والے ہیں، جیسا کہ ماہرین بتاتے ہیں اور مشاہدہ گواہ ہے، اس لیے ان سے قالین پاک کرنا کافی ہے۔ اس نے اس اصول پر بنیاد رکھی کہ اشیا میں اصل پاکی ہے، اور حطاب کی شرح مختصر خلیل اور ابن حجر ہیتمی کی تحفۃ المحتاج سے نقل کیا۔"
