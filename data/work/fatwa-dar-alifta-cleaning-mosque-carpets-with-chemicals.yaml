label: { ar: "حكم تطهير سجاد المساجد بالمواد الكيميائية", en: "Purifying mosque carpets with chemical cleaners", ur: "مسجد کے قالینوں کو کیمیائی مواد سے پاک کرنا", es: "Purificación de las alfombras de la mezquita con productos de limpieza químicos.", fr: "Nettoyage des tapis de mosquée avec des produits chimiques", tr: "Cami Halılarının Kimyasallarla Dezenfekte Edilmesine Dair Karar", id: "Putusan tentang Disinfeksi Karpet Masjid dengan Bahan Kimia" }
summary:
  ar: "سؤال عن إزالة النجاسة عن سجاد المساجد بالمنظفات الكيميائية السائلة، أجابت فيه دار الإفتاء المصرية بأن ذلك يجزئ ولا يشترط الماء. أجابت الدار بأن تطهير محل النجاسة لا يختص بالماء، بل يحصل بكل مائع طاهر مزيل. وقالت إن الأصل في هذه المنظفات أنها طاهرة في نفسها مزيلة لأعيان النجاسة، كما يقرر المتخصصون ويشهد به الواقع، فيجزئ تطهير السجاد بها. واستندت إلى قاعدة أن الأصل في الأعيان الطهارة، ونقلت ذلك عن الحطاب في شرح مختصر خليل وابن حجر الهيتمي في تحفة المحتاج."
  en: "A question on removing impurity from mosque carpets with liquid chemical cleaners, in which Egypt's Dar al-Ifta answered that this suffices and water is not required. Dar al-Ifta answered that purifying the place of impurity is not limited to water, but is achieved by any pure liquid that removes it. It said these cleaners are in principle pure in themselves and remove the substance of impurity, as specialists state and experience shows, so carpets may be purified with them. It relied on the rule that things are pure in principle, citing al-Hattab's commentary on the Mukhtasar of Khalil and Ibn Hajar al-Haytami's Tuhfat al-Muhtaj."
  ur: "مسجد کے قالینوں سے مائع کیمیائی صفائی کے مواد کے ذریعے نجاست دور کرنے کے بارے میں سوال، جس میں مصر کے دار الافتاء نے کہا کہ یہ کافی ہے اور پانی شرط نہیں۔ دار الافتاء نے جواب دیا کہ نجاست کی جگہ کو پاک کرنا پانی کے ساتھ خاص نہیں، بلکہ ہر پاک اور زائل کرنے والے مائع سے حاصل ہو جاتا ہے۔ اس نے کہا کہ یہ مواد اصلاً خود پاک اور نجاست کو دور کرنے والے ہیں، جیسا کہ ماہرین بتاتے ہیں اور مشاہدہ گواہ ہے، اس لیے ان سے قالین پاک کرنا کافی ہے۔ اس نے اس اصول پر بنیاد رکھی کہ اشیا میں اصل پاکی ہے، اور حطاب کی شرح مختصر خلیل اور ابن حجر ہیتمی کی تحفۃ المحتاج سے نقل کیا۔"
  es: "Ante una pregunta sobre cómo eliminar la impureza de las alfombras de las mezquitas con limpiadores químicos líquidos, Dar al-Ifta de Egipto respondió que esto es suficiente y que no se requiere agua. Dar al-Ifta explicó que la purificación de la impureza no se limita al agua, sino que se logra con cualquier líquido puro que la elimine. Afirmó que estos limpiadores son, en principio, puros en sí mismos y eliminan la sustancia impura, como afirman los especialistas y demuestra la experiencia, por lo que las alfombras pueden purificarse con ellos. Se basó en la regla de que las cosas son puras en principio, citando el comentario de al-Hattab sobre el Mukhtasar de Khalil y el Tuhfat al-Muhtaj de Ibn Hajar al-Haytami."
  fr: "Une question portait sur le nettoyage des tapis de mosquée à l'aide de produits chimiques liquides. L'Ifta égyptienne a répondu que cela suffisait et que l'eau n'était pas nécessaire. L'Ifta a précisé que la purification d'un lieu n'était pas limitée à l'eau, mais pouvait être obtenue par tout liquide pur capable d'éliminer l'impureté. Elle a ajouté que ces produits étaient, par principe, purs en eux-mêmes et éliminaient la substance impure, comme l'affirment les spécialistes et comme le démontre l'expérience. Les tapis pouvaient donc être purifiés avec ces produits. L'Ifta s'est appuyée sur le principe de pureté intrinsèque des choses, citant le commentaire d'al-Hattab sur le Mukhtasar de Khalil et le Tuhfat al-Muhtaj d'Ibn Hajar al-Haytami."
  tr: "Cami halılarındaki kirlerin sıvı kimyasal deterjanlarla temizlenmesi sorusuna Mısır Dar al-Ifta'sı yanıtladı ve bunun yeterli olduğu ve suya ihtiyaç olmadığı belirtildi. Meclis, kirlenme yerinin sadece suyla sınırlı olmadığını, onu temizleyen herhangi bir saf sıvı ile yapıldığını söyledi. Bu deterjanların varsayılan ilkesinin, uzmanlar tarafından belirlenen ve gerçeklikle doğrulanan temel kirleri temizledikleri, bu yüzden halıların onlarla arındırılmasının yeterli olduğu belirtildi. Nesnelerde varsayılan olarak saflık olduğu ilkesine dayandı ve bunu al-Hattab'ın Mukhtasar Khalil ve İbn Hajar al-Haytami üzerine Tuhfat al-Muhtaj'daki yorumunda alıntıladı."
  id: "Pertanyaan tentang menghilangkan kotoran dari karpet masjid dengan deterjen kimia cair dijawab oleh Dar al-Ifta Mesir bahwa hal ini sudah cukup dan air tidak diperlukan. Dewan menjawab bahwa pemurnian tempat kotoran tidak terbatas pada air, tetapi dilakukan dengan cairan murni yang menghilangkannya. Dewan mengatakan bahwa prinsip default terkait deterjen ini adalah bahwa mereka murni dengan sendirinya, menghilangkan kotoran esensial, sebagaimana ditentukan oleh para ahli dan dikonfirmasi oleh kenyataan, sehingga memurnikan karpet dengan kotoran tersebut sudah cukup. Dewan mengandalkan prinsip bahwa kekurangan dalam benda adalah kemurnian, dan mengutip ini dari al-Hattab dalam komentarnya tentang Mukhtasar Khalil dan Ibn Hajar al-Haytami dalam Tuhfat al-Muhtaj."
