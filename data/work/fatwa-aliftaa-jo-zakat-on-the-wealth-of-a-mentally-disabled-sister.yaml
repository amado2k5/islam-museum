id: work/fatwa-aliftaa-jo-zakat-on-the-wealth-of-a-mentally-disabled-sister
class: work
kind: fatwa
label: { ar: "الزكاة في مال أخت مريضة عقليًا غير مكلفة", en: "Zakat on the wealth of a sister with a mental disability who is not legally responsible", ur: "ذہنی معذور غیر مکلف بہن کے مال میں زکات" }
summary:
  ar: "سؤال عن الزكاة في مال أخت مريضة عقليًا وجسديًا غير مكلفة بلغ النصاب، عرضت فيه دائرة الإفتاء العام الأردنية قول الجمهور بوجوبها وقول الحنفية بعدمه، وخلصت إلى وجوبها على قول الجمهور يخرجها الولي، وأن القاضي الشرعي هو الذي يأذن إذا كان المال لدى المؤسسات الرسمية. أجابت الدائرة بأن لوجوب الزكاة شروطًا هي الإسلام والحرية وتعيين المالك وتمام الملك وبلوغ النصاب وتمام الحول فيما يشترط له الحول، فإذا تحققت وجبت الزكاة. وقالت إن الشافعية، ووافقهم المالكية والحنابلة، أوجبوا الزكاة في مال الصغير وغير العاقل لعموم النصوص، ونقلت قول [[person/shams-al-din-al-ramli|شمس الدين الرملي]] في نهاية المحتاج إن الزكاة ليست محض عبادة حتى تختص بالمكلف، وإن الولي هو المخاطب بإخراجها. وذكرت أن الحنفية لم يوجبوها لأنها عبادة لا تتأدى إلا بالاختيار والنية، ونقلت قول المرغيناني في الهداية بذلك. ونبهت إلى أن هذا الحكم إذا كان المال بيد الولي، أما إذا كان محفوظًا لدى المؤسسات الرسمية فالقاضي الشرعي هو الذي يملك الإذن بإخراج الزكاة، وذكرت أن القضاة غالبًا يأخذون بمذهب أبي حنيفة في عدم وجوبها في مال اليتيم، كما في قرار مجلس الإفتاء الأردني رقم 83. وخلصت إلى أن الزكاة تجب في مال الصغير وغير العاقل على قول الجمهور إذا بلغ النصاب وحال عليه الحول دون أن ينقص عن النصاب في أثنائه، وتتكرر كل سنة، ويخرجها الولي إذا كان المال تحت يده."
  en: "A question about zakat on the wealth of a sister with mental and physical illness who is not legally responsible and whose money has reached the minimum, in which Jordan's General Iftaa Department set out the majority view that it is due and the Hanafi view that it is not, and concluded that it is due on the majority view and paid by the guardian, with a sharia judge authorising payment if the money is held by official institutions. The Department answered that zakat becomes due when its conditions are met: Islam, freedom, an identified owner, complete ownership, reaching the minimum, and the passing of a year where a year is required. It said the Shafi'is, with the Malikis and Hanbalis, hold zakat due on the wealth of a minor or a person without sound mind because of the general wording of the texts, quoting [[person/shams-al-din-al-ramli|Shams al-Din al-Ramli]] in Nihayat al-Muhtaj that zakat is not purely an act of worship confined to the legally responsible and that the guardian is the one addressed with paying it. It noted that the Hanafis do not hold it due, since it is an act of worship performed only by choice and intention, quoting al-Marghinani in al-Hidaya. It pointed out that this applies when the money is in the guardian's hands; if it is held by official institutions, a sharia judge has the authority to permit paying zakat, and judges usually follow Abu Hanifa's view that zakat is not due on an orphan's money, as in decision No. 83 of the Jordanian Iftaa Council. It concluded that, on the majority view, zakat is due on the wealth of a minor or a person without sound mind once it reaches the minimum and a year passes without its falling below the minimum, recurring every year, and that the guardian pays it when the money is under his control."
  ur: "ذہنی اور جسمانی طور پر بیمار غیر مکلف بہن کے مال میں زکات کے بارے میں سوال جو نصاب کو پہنچ گیا ہو، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے جمہور کا قول کہ زکات واجب ہے اور حنفیہ کا قول کہ واجب نہیں، دونوں بیان کیے، اور نتیجہ نکالا کہ جمہور کے قول پر یہ واجب ہے اور ولی ادا کرے گا، اور اگر مال سرکاری اداروں میں ہو تو شرعی قاضی ادائیگی کی اجازت دیتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکات اپنی شرائط پوری ہونے پر واجب ہوتی ہے: اسلام، آزادی، مالک کا متعین ہونا، ملکیت کا مکمل ہونا، نصاب کو پہنچنا، اور جہاں سال شرط ہو وہاں سال کا گزرنا۔ اس نے کہا کہ شافعیہ، اور ان کے ساتھ مالکیہ اور حنابلہ، نصوص کے عموم کی وجہ سے نابالغ اور فاتر العقل کے مال میں زکات واجب کہتے ہیں، اور نہایۃ المحتاج میں [[person/shams-al-din-al-ramli|شمس الدین رملی]] کا قول نقل کیا کہ زکات محض عبادت نہیں کہ مکلف کے ساتھ خاص ہو، اور اس کی ادائیگی کا مخاطب ولی ہے۔ اس نے ذکر کیا کہ حنفیہ اسے واجب نہیں کہتے، کیونکہ یہ عبادت ہے جو اختیار اور نیت کے بغیر ادا نہیں ہوتی، اور اس پر الہدایہ میں مرغینانی کا قول نقل کیا۔ اس نے تنبیہ کی کہ یہ حکم اس وقت ہے جب مال ولی کے ہاتھ میں ہو؛ اگر وہ سرکاری اداروں میں محفوظ ہو تو زکات نکالنے کی اجازت کا اختیار شرعی قاضی کو ہے، اور قاضی عموماً یتیم کے مال میں زکات واجب نہ ہونے کے بارے میں ابو حنیفہ کا مذہب لیتے ہیں، جیسا کہ اردنی مجلس افتاء کے فیصلہ نمبر 83 میں ہے۔ اس نے نتیجہ نکالا کہ جمہور کے قول پر نابالغ اور فاتر العقل کے مال میں زکات واجب ہے جب وہ نصاب کو پہنچے اور سال اس طرح گزرے کہ درمیان میں نصاب سے کم نہ ہو، اور یہ ہر سال دہرائی جاتی ہے، اور جب مال ولی کے قبضے میں ہو تو ولی اسے ادا کرے۔"
