id: work/fatwa-dar-alifta-eg-shadow-entities-evading-tax
class: work
kind: fatwa
label: { ar: "حكم عمل الكيانات الموازية للشركات بحيث لا يشملها الحجز", en: "Creating shadow entities so taxes do not reach them", ur: "ٹیکس اور ضبطی سے بچنے کے لیے سائے دار ادارے بنانا", es: "Crear entidades fantasma para que los impuestos no les lleguen", fr: "Création d'entités fictives pour que les impôts ne leur parviennent pas", tr: "El koyma konusu olmayan şirketlere paralel işletmelerin işletilmesine ilişkin karar", id: "Putusan tentang operasi entitas yang paralel dengan perusahaan yang tidak menjadi subjek penyitaan" }
summary:
  ar: "سائل سأل عن عمل كيانات موازية للشركات والمصانع بحيث لا يشملها الحجز وبيع جزء من الأملاك بيعًا صوريًّا لأحد الأقارب للتهرب من الحجز على الأموال. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21060)⁩ أنه لا يجوز شرعًا أن يبيع جزءًا من أملاكه بيعًا صوريًّا لتجنب الحجز على أمواله على ما فصّل الجواب."
  en: "A questioner asked about creating shadow entities parallel to companies and factories so that seizure orders do not reach them, and making a fictitious sale of part of his wealth to a relative to avoid attachment. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21060) answered that the fictitious sale to evade attachment is not lawful — as the answer details."
  ur: "ایک سائل نے کمپنیوں کے متوازی سائے دار ادارے بنانے اور ضبطی سے بچنے کے لیے رشتہ دار کو مال کی صوری فروخت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21060)⁩ نے جواب دیا کہ صوری بیع سے ضبطی بچانا جائز نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la creación de entidades fantasma paralelas a empresas y fábricas para evitar que las órdenes de embargo las alcancen, y sobre la venta ficticia de parte de su patrimonio a un familiar para eludir el embargo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21060) respondió que la venta ficticia para evadir el embargo no es lícita, como se detalla en la respuesta."
  fr: "Un individu a posé une question concernant la création de sociétés écrans parallèles à des entreprises et des usines afin d'échapper aux ordres de saisie, et la vente fictive d'une partie de son patrimoine à un proche pour éviter une saisie. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21060) a répondu que cette vente fictive visant à se soustraire à la saisie est illicite, comme le détaille la réponse."
  tr: "Bir soru soran kişi, el konulmaya tabi olmayan şirketler ve fabrikalarla paralel varlıkların işletilmesini ve fonların el konulmasından kaçmak için bir akrabasına sahte bir satış yoluyla mülkün bir kısmının satılmasını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21060), yanıtta belirtildiği gibi, İslam hukukunda mal varlığının bir kısmının sahte satışla satılmasının izin verilmediğini söyledi."
  id: "Seorang penanya menanyakan tentang operasi entitas paralel dengan perusahaan dan pabrik yang tidak dapat disita dan penjualan sebagian properti melalui penjualan fiktif kepada kerabat untuk menghindari penyitaan dana. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21060) menjawab bahwa tidak diperbolehkan dalam hukum Islam menjual sebagian propertinya secara fiktif untuk menghindari penyitaan asetnya, sebagaimana dijelaskan dalam jawaban."
