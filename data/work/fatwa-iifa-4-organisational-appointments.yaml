label: { ar: "قرار مجمع الفقه الإسلامي الدولي 4 بشأن القرارات التنظيمية واختيار الأعضاء المنتدبين", en: "IIFA resolution 4 on organisational decisions and co-opted members", ur: "اکیڈمی کی قرارداد 4: تنظیمی فیصلے اور منتخب ارکان", es: "Resolución 4 de la IIFA sobre decisiones organizativas y miembros cooptados", fr: "Résolution 4 de l'IIFA sur les décisions organisationnelles et les membres cooptés", tr: "Uluslararası İslami Fiqh Akademisi Kararı No. 4, örgütsel kararlar ve yetkilendirilen üyelerin seçimi hakkında", id: "Keputusan Akademi Fiqh Islam Internasional No. 4 mengenai keputusan organisasi dan pemilihan anggota yang didelegasikan" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي ⁦(الدورة الأولى، مكة المكرمة، 26–29 صفر 1405هـ، 19–22 نوفمبر 1984م)⁩. اتخذ قرارات تنظيمية منها تفويض الأمين العام لمدة عام اختيار الدارسين والباحثين والمحققين والخبراء، وضم شخصيات وهيئات علمية تشاركه في بعض أنشطته وممثل عن الجاليات الإسلامية في غير البلاد الإسلامية، ومن المشمولين بالقرار: الشيخ مصطفى الزرقاء، والدكتور الصديق الجرير، والدكتور محمد سلام مدكور، والشيخ عبد الرزاق عفيفي، والمجمع الفقهي لرابطة العالم الإسلامي، والموسوعة الفقهية في الكويت، ومجمع البحوث الإسلامية بالأزهر، والمجمع الملكي لبحوث الحضارة الإسلامية بالأردن."
  en: "A resolution of the International Islamic Fiqh Academy (first session, Mecca, 26–29 Safar 1405, 19–22 November 1984) making organisational decisions: authorising the secretary-general for one year to select researchers, editors and experts, and co-opting figures and learned bodies — among them Shaykh Mustafa al-Zarqa, Dr. al-Siddiq al-Jarir, Dr. Muhammad Salam Madkur, Shaykh Abd al-Razzaq Afifi, the fiqh academy of the Muslim World League, Kuwait's fiqh encyclopedia, al-Azhar's Islamic Research Academy, and Jordan's royal institute for Islamic civilisation research — plus a representative of Muslim communities outside Muslim countries."
  ur: "اکیڈمی کی قرارداد ⁦(پہلی مجلس، مکہ، 26–29 صفر 1405ھ، 19–22 نومبر 1984ء)⁩ تنظیمی فیصلوں پر: سکریٹری جنرل کو ایک سال کے لیے محققین کے انتخاب کا اختیار اور علمی شخصیات و اداروں کی شمولیت — ان میں مصطفیٰ زرقا، صدیق جریر، محمد سلام مدکور اور عبدالرزاق عفیفی شامل ہیں۔"
  es: "Resolución de la Academia Internacional de Fiqh Islámico (primera sesión, La Meca, 26-29 de Safar de 1405, 19-22 de noviembre de 1984) que toma decisiones organizativas: autoriza al secretario general por un año a seleccionar investigadores, editores y expertos, y cooptar figuras y organismos académicos, entre ellos Shaykh Mustafa al-Zarqa, Dr. al-Siddiq al-Jarir, Dr. Muhammad Salam Madkur, Shaykh Abd al-Razzaq Afifi, la academia de fiqh de la Liga Mundial Musulmana, la enciclopedia de fiqh de Kuwait, la Academia de Investigación Islámica de al-Azhar y el Instituto Real de Jordania para la Investigación de la Civilización Islámica, además de un representante de las comunidades musulmanas fuera de los países musulmanes."
  fr: "Résolution de l'Académie internationale de jurisprudence islamique (première session, La Mecque, 26-29 Safar 1405, 19-22 novembre 1984) prenant des décisions organisationnelles: autorisant le secrétaire général pour un an à sélectionner des chercheurs, des rédacteurs et des experts, et à coopter des personnalités et des organismes savants — parmi lesquels le cheikh Mustafa al-Zarqa, le Dr al-Siddiq al-Jarir, le Dr Muhammad Salam Madkur, le cheikh Abd al-Razzaq Afifi, l'académie de jurisprudence de la Ligue islamique mondiale, l'encyclopédie de jurisprudence du Koweït, l'Académie de recherche islamique d'al-Azhar et l'Institut royal jordanien de recherche sur la civilisation islamique — ainsi qu'un représentant des communautés musulmanes hors des pays musulmans."
  tr: "Uluslararası İslami Fiqh Akademisi Kararı (Birinci Oturum, Mekke, 26–29 Safar 1405H, 19–22 Kasım 1984). Örgütsel kararlar alındı; bunlar arasında Genel Sekreter'in bir yıl süreyle bazı faaliyetlerine katılan alimler, araştırmacılar, araştırmacılar ve uzmanlar ile İslam ülkeleri dışındaki İslami toplulukların temsilcisi gibi alimler, araştırmacılar, araştırmacılar ve uzmanlar seçme yetkisi verildi. Karara dahil edilenler arasında Şeyh Mustafa Al-Zarqa, Dr. Al-Siddiq Al-Jarir, Dr. Muhammad Salam Madkour, Şeyh Abdul Razzaq Afifi, Müslüman Dünya Ligi Fiqh Akademisi, Kuveyt'teki Fıkıh Ansiklopedisi, El-Ezher'deki İslami Araştırma Akademisi ve Ürdün'deki Kraliyet İslami Uygarlık Araştırma Akademisi yer alıyor."
  id: "Keputusan Akademi Fiqh Islam Internasional (Sesi Pertama, Mekah, 26–29 Safar 1405H, 19–22 November 1984). Keputusan organisasi diambil, termasuk memberikan wewenang kepada Sekretaris Jenderal selama satu tahun untuk memilih ulama, peneliti, peneliti, dan ahli, termasuk ulama dan badan ilmiah yang berpartisipasi dalam beberapa kegiatannya serta perwakilan komunitas Islam di luar negara-negara Islam. Di antara yang terlibat dalam keputusan tersebut adalah: Sheikh Mustafa Al-Zarqa, Dr. Al-Siddiq Al-Jarir, Dr. Muhammad Salam Madkour, Sheikh Abdul Razzaq Afifi, Akademi Fiqh Liga Dunia Muslim, Ensiklopedia Yurisprudensi di Kuwait, Akademi Riset Islam di Al-Azhar, dan Akademi Kerajaan untuk Penelitian Peradaban Islam di Yordania."
