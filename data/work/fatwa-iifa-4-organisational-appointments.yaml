label: { ar: "قرار مجمع الفقه الإسلامي الدولي 4 بشأن القرارات التنظيمية واختيار الأعضاء المنتدبين", en: "IIFA resolution 4 on organisational decisions and co-opted members", ur: "اکیڈمی کی قرارداد 4: تنظیمی فیصلے اور منتخب ارکان" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي ⁦(الدورة الأولى، مكة المكرمة، 26–29 صفر 1405هـ، 19–22 نوفمبر 1984م)⁩. اتخذ قرارات تنظيمية منها تفويض الأمين العام لمدة عام اختيار الدارسين والباحثين والمحققين والخبراء، وضم شخصيات وهيئات علمية تشاركه في بعض أنشطته وممثل عن الجاليات الإسلامية في غير البلاد الإسلامية، ومن المشمولين بالقرار: الشيخ مصطفى الزرقاء، والدكتور الصديق الجرير، والدكتور محمد سلام مدكور، والشيخ عبد الرزاق عفيفي، والمجمع الفقهي لرابطة العالم الإسلامي، والموسوعة الفقهية في الكويت، ومجمع البحوث الإسلامية بالأزهر، والمجمع الملكي لبحوث الحضارة الإسلامية بالأردن."
  en: "A resolution of the International Islamic Fiqh Academy (first session, Mecca, 26–29 Safar 1405, 19–22 November 1984) making organisational decisions: authorising the secretary-general for one year to select researchers, editors and experts, and co-opting figures and learned bodies — among them Shaykh Mustafa al-Zarqa, Dr. al-Siddiq al-Jarir, Dr. Muhammad Salam Madkur, Shaykh Abd al-Razzaq Afifi, the fiqh academy of the Muslim World League, Kuwait's fiqh encyclopedia, al-Azhar's Islamic Research Academy, and Jordan's royal institute for Islamic civilisation research — plus a representative of Muslim communities outside Muslim countries."
  ur: "اکیڈمی کی قرارداد ⁦(پہلی مجلس، مکہ، 26–29 صفر 1405ھ، 19–22 نومبر 1984ء)⁩ تنظیمی فیصلوں پر: سکریٹری جنرل کو ایک سال کے لیے محققین کے انتخاب کا اختیار اور علمی شخصیات و اداروں کی شمولیت — ان میں مصطفیٰ زرقا، صدیق جریر، محمد سلام مدکور اور عبدالرزاق عفیفی شامل ہیں۔"
