id: work/fatwa-dar-alifta-eg-profit-from-usurped-money
class: work
kind: fatwa
label: { ar: "حكم الربح الناتج عن المال المغصوب ومدى ملكيته لصاحب المال", en: "Profit made on usurped money and who owns it", ur: "غصب شدہ مال سے ہونے والے منافع کا حکم اور مالک کون", es: "Ganancias obtenidas con dinero usurpado y quién es su propietario.", fr: "Les profits réalisés grâce à l'argent usurpé et à qui il appartient", tr: "Gasp edilen paradan elde edilen kâr ve mülkiyet hakkı kararı", id: "Putusan mengenai keuntungan yang dihasilkan dari uang yang diambil alih dan luasnya kepemilikan properti" }
summary:
  ar: "سائل غصب مالًا من صاحبه واتجر فيه فربح فسأل عن حكم الربح. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21870)⁩ أنه لا يحق للغاصب أخذ الربح الناتج عن الاتجار في المال المغصوب ويجب عليه رد المال الذي غصبه على ما فصّل الجواب."
  en: "A man usurped money from its owner, traded with it, and profited, then asked the ruling on the profit. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21870) answered that the usurper is not entitled to the profit generated by trading in usurped money and must return the money he took — as the answer details."
  ur: "ایک شخص نے کسی کا مال غصب کیا، اس سے تجارت کی اور منافع کمایا، پھر منافع کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21870)⁩ نے جواب دیا کہ غاصب کو غصب شدہ مال کی تجارت سے ہونے والے منافع کا حق نہیں اور اسے غصب شدہ مال واپس کرنا ہوگا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre usurpó dinero a su dueño, negoció con él y obtuvo ganancias, y luego solicitó una resolución sobre dichas ganancias. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21870) respondió que el usurpador no tiene derecho a las ganancias generadas por el comercio con dinero usurpado y debe devolver el dinero que tomó, como se detalla en la respuesta."
  fr: "Un homme a usurpé de l'argent à son propriétaire, l'a utilisé pour faire du commerce et en a tiré profit, puis a demandé l'avis juridique concernant ce profit. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21870) a répondu que l'usurpateur n'a pas droit au profit généré par le commerce de l'argent usurpé et doit restituer l'argent qu'il a pris, comme le précise la réponse."
  tr: "Mülkü sahibinden gasp edip ticareti yapan ve kâr eden bir soru soran kişi, kâr kararını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21870), gaspçının gasp edilen mülkten elde ettiği kârı alma hakkı olmadığını ve gasp ettiği parayı geri vermesi gerektiğini yanıtladı; bu cevabda ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya yang mengambil alih properti dari pemiliknya dan memperdagangkannya serta menghasilkan keuntungan, menanyakan tentang keputusan keuntungan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21870) menjawab bahwa perebut tidak berhak mengambil keuntungan dari perdagangan atas properti yang direbut dan harus mengembalikan uang yang telah dikuasainya, sebagaimana dijelaskan dalam jawaban."
