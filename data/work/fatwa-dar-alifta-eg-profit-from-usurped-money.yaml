label: { ar: "حكم الربح الناتج عن المال المغصوب ومدى ملكيته لصاحب المال", en: "Profit made on usurped money and who owns it", ur: "غصب شدہ مال سے ہونے والے منافع کا حکم اور مالک کون" }
summary:
  ar: "سائل غصب مالًا من صاحبه واتجر فيه فربح فسأل عن حكم الربح. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21870)⁩ أنه لا يحق للغاصب أخذ الربح الناتج عن الاتجار في المال المغصوب ويجب عليه رد المال الذي غصبه على ما فصّل الجواب."
  en: "A man usurped money from its owner, traded with it, and profited, then asked the ruling on the profit. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21870) answered that the usurper is not entitled to the profit generated by trading in usurped money and must return the money he took — as the answer details."
  ur: "ایک شخص نے کسی کا مال غصب کیا، اس سے تجارت کی اور منافع کمایا، پھر منافع کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21870)⁩ نے جواب دیا کہ غاصب کو غصب شدہ مال کی تجارت سے ہونے والے منافع کا حق نہیں اور اسے غصب شدہ مال واپس کرنا ہوگا — جیسا کہ جواب میں تفصیل ہے۔"
