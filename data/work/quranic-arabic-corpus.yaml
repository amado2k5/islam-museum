summary:
  ar: "مورد لغوي على الإنترنت يوسم كل كلمة من كلمات القرآن البالغة 77,430 كلمة صرفيًا ونحويًا على إطار الإعراب العربي التقليدي، ويعرض الإعراب في رسوم تبعية، ومعجمًا صرفيًا وفهرسًا بالجذور وترجمة كلمة بكلمة من ترجمات إنجليزية معتمدة؛ يقوده كايس دوكس في جامعة ليدز بإشراف إريك أتويل، وأُطلق في نوفمبر 2009 على corpus.quran.com."
  en: "An online linguistic resource that tags each of the Qur'an's 77,430 words for morphology and syntax within the framework of traditional Arabic i'rab, showing the grammar as dependency graphs, with a morphological lexicon, a concordance by lemma and a word-by-word translation drawn from accepted English translations; led by Kais Dukes at the University of Leeds under Eric Atwell, it was first released in November 2009 at corpus.quran.com."
  ur: "آن لائن لسانی وسیلہ جو قرآن کے 77,430 الفاظ میں سے ہر ایک کو روایتی عربی اعراب کے ڈھانچے میں صرفی اور نحوی طور پر نشان زد کرتا ہے، اعراب کو انحصاری خاکوں میں دکھاتا ہے، اور صرفی لغت، مادوں کی فہرست اور معتبر انگریزی تراجم سے لفظ بہ لفظ ترجمہ دیتا ہے؛ جامعہ لیڈز میں کائس ڈیوکس کی قیادت اور ایرک ایٹویل کی نگرانی میں، نومبر 2009 میں corpus.quran.com پر جاری ہوا۔"
  es: "Se trata de un recurso lingüístico en línea que etiqueta cada una de las 77.430 palabras del Corán según su morfología y sintaxis dentro del marco del árabe tradicional i'rab, mostrando la gramática como gráficos de dependencia, con un léxico morfológico, una concordancia por lema y una traducción palabra por palabra basada en traducciones inglesas aceptadas; dirigido por Kais Dukes en la Universidad de Leeds bajo la dirección de Eric Atwell, se publicó por primera vez en noviembre de 2009 en corpus.quran.com."
  fr: "Une ressource linguistique en ligne qui étiquette chacun des 77 430 mots du Coran pour la morphologie et la syntaxe dans le cadre de l'i'rab arabe traditionnel, montrant la grammaire sous forme de graphes de dépendance, avec un lexique morphologique, une concordance par lemme et une traduction mot à mot tirée de traductions anglaises acceptées; dirigée par Kais Dukes à l'Université de Leeds sous la direction d'Eric Atwell, elle a été publiée pour la première fois en novembre 2009 sur corpus.quran.com."
  tr: "Kur'an'ın her kelimesini etiketleyen, toplam 77.430 morfolojik ve dilbilgisel terimi içeren çevrimiçi bir dilbilim kaynağıdır; geleneksel Arapça dilbilgisi çerçevesinde. Bağımlı grafiklerde ayrıştırma, morfolojik sözlük, köklere göre indeks ve onaylanmış İngilizce çevirilerden kelime kelime çeviri sunar; Leeds Üniversitesi'nden Case Doux tarafından Eric Attwell gözetiminde yürütülmekte ve Kasım 2009'da corpus.quran.com olarak başlatılmıştır."
  id: "Sumber daya linguistik daring yang memberi label pada setiap kata dalam Al-Qur'an, dengan total 77.430 istilah morfologis dan gramatikal, dalam kerangka tata bahasa Arab tradisional. Sumber ini menyajikan parsing dalam grafik dependen, kamus morfologi, indeks berdasarkan akar, dan terjemahan kata demi kata dari terjemahan bahasa Inggris yang disetujui; dipimpin oleh Case Doux di Universitas Leeds di bawah bimbingan Eric Attwell, dan diluncurkan pada November 2009 sebagai corpus.quran.com."
