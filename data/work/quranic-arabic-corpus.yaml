label:
  ar: "المدونة القرآنية العربية (Quranic Arabic Corpus)"
  en: "Quranic Arabic Corpus"
  ur: "قرآنی عربی کارپس"
summary:
  ar: "مورد لغوي على الإنترنت يوسم كل كلمة من كلمات القرآن البالغة 77,430 كلمة صرفيًا ونحويًا على إطار الإعراب العربي التقليدي، ويعرض الإعراب في رسوم تبعية، ومعجمًا صرفيًا وفهرسًا بالجذور وترجمة كلمة بكلمة من ترجمات إنجليزية معتمدة؛ يقوده كايس دوكس في جامعة ليدز بإشراف إريك أتويل، وأُطلق في نوفمبر 2009 على corpus.quran.com."
  en: "An online linguistic resource that tags each of the Qur'an's 77,430 words for morphology and syntax within the framework of traditional Arabic i'rab, showing the grammar as dependency graphs, with a morphological lexicon, a concordance by lemma and a word-by-word translation drawn from accepted English translations; led by Kais Dukes at the University of Leeds under Eric Atwell, it was first released in November 2009 at corpus.quran.com."
  ur: "آن لائن لسانی وسیلہ جو قرآن کے 77,430 الفاظ میں سے ہر ایک کو روایتی عربی اعراب کے ڈھانچے میں صرفی اور نحوی طور پر نشان زد کرتا ہے، اعراب کو انحصاری خاکوں میں دکھاتا ہے، اور صرفی لغت، مادوں کی فہرست اور معتبر انگریزی تراجم سے لفظ بہ لفظ ترجمہ دیتا ہے؛ جامعہ لیڈز میں کائس ڈیوکس کی قیادت اور ایرک ایٹویل کی نگرانی میں، نومبر 2009 میں corpus.quran.com پر جاری ہوا۔"
