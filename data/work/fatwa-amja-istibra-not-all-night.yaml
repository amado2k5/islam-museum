id: work/fatwa-amja-istibra-not-all-night
class: work
kind: fatwa
label: { ar: "الاستبراء في حدود الوسع", en: "Istibra within one's span — not till morning", ur: "استبراء — وسع کی حد تک", es: "Istibra dentro del lapso de uno, no hasta la mañana", fr: "Istibra à portée de main — pas avant le matin" }
summary:
  ar: "سأل سائل هل إذا بال في الخلاء وجب الاستبراء بإخراج بقايا البول حتى لو بقي إلى الصباح. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78605 بتاريخ 19 أبريل 2009)⁩ أن الدين يسر ولن يشاد الدين أحد إلا غلبه فارفق بنفسك ولا تبغض إليها عبادة ربك، لم يتعبدك الله بأن تبقى إلى الصباح تستبرئ من بولك بل تعبدك في حدود وسعك على ما فصّل الجواب."
  en: "A questioner asked whether istibra obliges drawing out the urine's remainders even till morning. Dr. Salah al-Sawi (fatwa no. 78605, 19 April 2009) answered that the religion is ease — none contends with it but it overcomes him — so be gentle with yourself lest worship become hateful: God did not bind you to stay till morning drawing out your urine, He bound you within the limits of your capacity — as the answer details."
  ur: "استبراء صبح تک؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78605، 19 اپریل 2009)⁩ کے مطابق دین آسانی ہے — وسع کی حد تک استبراء کافی۔"
  es: "Un consultante preguntó si la istibra obliga a retener los restos de orina incluso hasta la mañana. El Dr. Salah al-Sawi (fatwa n.° 78605, 19 de abril de 2009) respondió que la religión es facilidad; nadie lucha contra ella sin que lo venza; así que sé amable contigo mismo para que la adoración no se vuelva odiosa: Dios no te obligó a permanecer hasta la mañana reteniendo la orina, te obligó a mantenerte dentro de los límites de tu capacidad, como se detalla en la respuesta."
  fr: "Un internaute a demandé si l'istibra (ablution majeure) obligeait à uriner jusqu'au matin. Le Dr Salah al-Sawi (fatwa n° 78605, 19 avril 2009) a répondu que la religion est source de facilité; nul ne la conteste sans qu'elle le soumette. Il faut donc être indulgent envers soi-même afin que l'adoration ne devienne pas une source de haine. Dieu ne vous a pas contraint à uriner jusqu'au matin, mais Il vous a contraint à respecter vos limites, comme le précise la réponse."
