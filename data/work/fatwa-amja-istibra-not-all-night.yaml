id: work/fatwa-amja-istibra-not-all-night
class: work
kind: fatwa
label: { ar: "الاستبراء في حدود الوسع", en: "Istibra within one's span — not till morning", ur: "استبراء — وسع کی حد تک" }
summary:
  ar: "سأل سائل هل إذا بال في الخلاء وجب الاستبراء بإخراج بقايا البول حتى لو بقي إلى الصباح. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78605 بتاريخ 19 أبريل 2009)⁩ أن الدين يسر ولن يشاد الدين أحد إلا غلبه فارفق بنفسك ولا تبغض إليها عبادة ربك، لم يتعبدك الله بأن تبقى إلى الصباح تستبرئ من بولك بل تعبدك في حدود وسعك على ما فصّل الجواب."
  en: "A questioner asked whether istibra obliges drawing out the urine's remainders even till morning. Dr. Salah al-Sawi (fatwa no. 78605, 19 April 2009) answered that the religion is ease — none contends with it but it overcomes him — so be gentle with yourself lest worship become hateful: God did not bind you to stay till morning drawing out your urine, He bound you within the limits of your capacity — as the answer details."
  ur: "استبراء صبح تک؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78605، 19 اپریل 2009)⁩ کے مطابق دین آسانی ہے — وسع کی حد تک استبراء کافی۔"
