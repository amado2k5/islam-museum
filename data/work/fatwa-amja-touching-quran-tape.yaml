id: work/fatwa-amja-touching-quran-tape
class: work
kind: fatwa
label: { ar: "مس شريط القرآن بغير طهارة", en: "Touching Qur'an tapes without purity — no objection", ur: "قرآن کی ٹیپ بغیر طہارت — جائز", es: "Tocar cintas del Corán sin pureza — no hay objeción", fr: "Toucher des enregistrements du Coran sans pureté rituelle — aucune objection" }
summary:
  ar: "سأل سائل عن حكم مس شريط القرآن بغير طهارة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 3284 بتاريخ 24 يوليو 2007)⁩ أنه لا بأس بلمس أشرطة القرآن بغير طهارة لأنها ليست قرآنًا وبالتالي تختلف عنه في الأحكام على ما فصّل الجواب."
  en: "A questioner asked the ruling on touching a Qur'an tape without purity. Dr. Salah al-Sawi (fatwa no. 3284, 24 July 2007) answered that there is no harm in touching Qur'an tapes without purity — they are not Qur'an and accordingly differ from it in the rulings — as the answer details."
  ur: "قرآن کی ٹیپ چھونا بغیر طہارت؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 3284، 24 جولائی 2007)⁩ کے مطابق جائز — ٹیپ قرآن نہیں اس کے احکام الگ ہیں۔"
  es: "Un consultante preguntó sobre la norma relativa a tocar una cinta del Corán sin purificación. El Dr. Salah al-Sawi (fatwa n.º 3284, 24 de julio de 2007) respondió que no hay inconveniente en tocar cintas del Corán sin purificación, ya que no son el Corán y, por lo tanto, difieren de él en cuanto a las normas, como se detalla en la respuesta."
  fr: "Un internaute a demandé si le fait de toucher une cassette coranique sans purification rituelle était acceptable. Le Dr Salah al-Sawi (fatwa n° 3284, 24 juillet 2007) a répondu qu'il n'y a aucun mal à toucher des cassettes coraniques sans purification rituelle — car elles ne sont pas du Coran et, par conséquent, leur statut juridique diffère du sien — comme le précise la réponse."
