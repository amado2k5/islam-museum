summary:
  ar: "سأل سائل عن حكم مس شريط القرآن بغير طهارة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 3284 بتاريخ 24 يوليو 2007)⁩ أنه لا بأس بلمس أشرطة القرآن بغير طهارة لأنها ليست قرآنًا وبالتالي تختلف عنه في الأحكام على ما فصّل الجواب."
  en: "A questioner asked the ruling on touching a Qur'an tape without purity. Dr. Salah al-Sawi (fatwa no. 3284, 24 July 2007) answered that there is no harm in touching Qur'an tapes without purity — they are not Qur'an and accordingly differ from it in the rulings — as the answer details."
  ur: "قرآن کی ٹیپ چھونا بغیر طہارت؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 3284، 24 جولائی 2007)⁩ کے مطابق جائز — ٹیپ قرآن نہیں اس کے احکام الگ ہیں۔"
