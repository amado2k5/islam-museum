id: work/ahmed-el-sayed-seerah-lilmuslihin-ep08
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 8: أذى المشركين وآيات التثبيت"
  en: "The Prophetic Biography for Reformers, episode 8: The harm done by the polytheists and the verses of steadying"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 8: مشرکین کی اذیت اور ثابت قدمی کی آیات"
  fr: "La biographie prophétique pour les réformateurs, épisode 8 : Les persécutions des polythéistes et les versets de raffermissement"
  es: "La biografía profética para los reformadores, episodio 8: El daño de los politeístas y los versículos de afianzamiento"
summary:
  ar: "يتابع المجلس الثامن من سلسلة السيرة النبوية للمصلحين السنوات المكية الأولى. يتناول المتحدث شراء أبي بكر للعبيد المعذبين وإعتاقهم، وشكوى خباب إلى النبي، والأذى الجسدي الذي لحق النبي عند الكعبة، وموضوعات الوحي المبكر، والضغط الذي قاد إلى الهجرة إلى الحبشة، ومنه حماية ابن الدغنة لأبي بكر. ويختم بمركزية القرآن للمصلح."
  en: "The eighth session of the series on the Prophetic biography for reformers continues the early Meccan years. The speaker treats Abu Bakr's buying and freeing of tortured slaves, Khabbab's complaint to the Prophet, the physical harm done to the Prophet at the Kaaba, the themes of early revelation, and the pressure that led toward the migration to Abyssinia, including Abu Bakr's protection under Ibn al-Dughna. He closes with the centrality of the Qur'an for the reformer."
  ur: "اصلاح پسندوں کے لیے سیرتِ نبوی کے سلسلے کی آٹھویں نشست ابتدائی مکی برسوں کو آگے بڑھاتی ہے۔ مقرر ابو بکر کے اذیت زدہ غلاموں کو خرید کر آزاد کرنے، خباب کی نبی سے شکایت، کعبہ کے پاس نبی کو پہنچنے والی جسمانی اذیت، ابتدائی وحی کے موضوعات، اور حبشہ کی ہجرت کی طرف لے جانے والے دباؤ کو بیان کرتا ہے، جس میں ابن الدغنہ کے تحت ابو بکر کی پناہ بھی شامل ہے۔ وہ اصلاح کرنے والے کے لیے قرآن کی مرکزیت پر بات ختم کرتا ہے۔"
  fr: "La huitième séance de la série sur la biographie prophétique pour les réformateurs poursuit les premières années mecquoises. Le conférencier traite de l'achat et de l'affranchissement par Abu Bakr d'esclaves torturés, de la plainte de Khabbab au Prophète, des violences physiques subies par le Prophète à la Kaaba, des thèmes de la révélation ancienne et de la pression qui mena à la migration vers l'Abyssinie, dont la protection accordée à Abu Bakr par Ibn al-Dughna. Il conclut sur la centralité du Coran pour le réformateur."
  es: "La octava sesión de la serie sobre la biografía profética para reformadores continúa los primeros años mequíes. El conferenciante trata de la compra y liberación por Abu Bakr de esclavos torturados, la queja de Khabbab al Profeta, el daño físico que sufrió el Profeta en la Kaaba, los temas de la revelación temprana y la presión que condujo a la migración a Abisinia, incluida la protección de Abu Bakr bajo Ibn al-Dughna. Concluye con la centralidad del Corán para el reformador."
