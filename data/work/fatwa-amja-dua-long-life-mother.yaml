id: work/fatwa-amja-dua-long-life-mother
class: work
kind: fatwa
label: { ar: "الدعاء لأم بطول العمر والقدر", en: "Praying for a mother's long life, and decree", ur: "ماں کی لمبی عمر کی دعا اور تقدیر" }
summary:
  ar: "سأل سائل هل دعاؤه لأمه بطول العمر معارض للقدر وهل يطيل الله عمرها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82478 بتاريخ 8 سبتمبر 2010)⁩ أنه لا حرج أن يدعو لأمه أن يطيل الله عمرها في طاعته، وتوجيه ذلك عند بعض أهل العلم أن من الأقدار ما هو محقق ومنها ما هو معلق ومن المعلق ما يكون على دعاء الداعين أو على الصدقة وصلة الرحم اللتين تعمران الديار وتطيلان الأعمار كما في الحديث، وكل ذلك مسطور في أم الكتاب، والأولى من الدعاء بطول العمر الدعاء بالنجاة من العذاب لحديث أم حبيبة عند مسلم."
  en: "A questioner asked whether praying for his mother's long life opposes decree and whether God would lengthen it. Dr. Salah al-Sawi (fatwa no. 82478, 8 September 2010) answered that praying for her life to be lengthened in obedience is not objectionable; some scholars explain that decrees are of two kinds — determined and suspended — and the suspended include those hanging on the supplicant's prayer, or on charity and kinship which adorn houses and lengthen lives per the hadith, all inscribed in the Mother of the Book; better than praying for long life is praying for salvation from punishment, per Umm Habiba's hadith in Muslim."
  ur: "ایک سائل نے پوچھا کہ ماں کی لمبی عمر کی دعا تقدیر سے ٹکراؤ تو نہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82478، 8 ستمبر 2010)⁩ کے مطابق طاعت میں عمر درازی کی دعا جائز ہے؛ بعض اقدار دعا اور صدقہ و صلہ رحم پر معلق ہوتی ہیں؛ بہتر یہ ہے کہ عذاب سے نجات کی دعا کرے۔"
