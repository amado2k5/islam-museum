id: work/fatwa-dar-alifta-eg-evading-government-taxes
class: work
kind: fatwa
label: { ar: "حكم التهرب من سداد الضرائب الحكومية", en: "Evading government taxes", ur: "حکومتی ٹیکس سے بچنے کا حکم", es: "Evasión de impuestos gubernamentales", fr: "Évasion des impôts gouvernementaux", tr: "Devlet vergi ödemelerinden kaçınma kararı", id: "Putusan tentang penghindaran pembayaran pajak pemerintah" }
summary:
  ar: "سائل سأل عن التهرب من سداد الضرائب الحكومية بحجة أن تقديراتها غير عادلة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22073)⁩ أنه لا يجوز التهرب من الضرائب التي يفرضها ولي الأمر ويجب على المرء تحري الصدق في كل أحواله، على ما فصّل الجواب."
  en: "A questioner asked about evading government taxes on the plea that their assessments are unfair. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22073) answered that evading the taxes imposed by the governing authority is impermissible, and one must pursue honesty in all his affairs — as the answer details."
  ur: "ایک سائل نے اس بہانے حکومت کے ٹیکس سے بچنے کا حکم پوچھا کہ ان کا اندازہ غیر منصفانہ ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22073)⁩ نے جواب دیا کہ حاکم کے عائد کردہ ٹیکسوں سے بچنا جائز نہیں اور شخص کو ہر حال میں صداقت اختیار کرنی چاہیے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la evasión de impuestos gubernamentales alegando que sus evaluaciones son injustas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22073) respondió que la evasión de los impuestos impuestos por la autoridad gobernante es inadmisible, y que uno debe actuar con honestidad en todos sus asuntos, como se detalla en la respuesta."
  fr: "Un internaute a interrogé Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22073) sur la possibilité de se soustraire à l'impôt en arguant de son injustice. Il a été répondu que la fraude fiscale est inadmissible et qu'il faut agir honnêtement en toutes circonstances, comme le précise la réponse."
  tr: "Bir soru soran kişi, tahminlerinin adil olmadığı gerekçesiyle hükümet vergilerinden kaçınma konusunu sordu. Mısır'ın Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22073), vasi tarafından uygulanan vergilerden kaçınmanın mümkün olmadığını ve her durumda dürüstlük aranması gerektiğini yanıtladı; bu cevapta ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya menanyakan tentang menghindari pembayaran pajak pemerintah dengan alasan bahwa perkiraan mereka tidak adil. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22073) menjawab bahwa tidak diperbolehkan menghindari pajak yang dikenakan oleh wali, dan harus dicari kejujuran dalam segala keadaan, seperti yang dijelaskan dalam jawabannya."
