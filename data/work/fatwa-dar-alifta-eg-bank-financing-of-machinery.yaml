id: work/fatwa-dar-alifta-eg-bank-financing-of-machinery
class: work
kind: fatwa
label: { ar: "حكم تمويل شراء الآلات الصناعية عن طريق البنوك", en: "Financing industrial machinery through banks", ur: "بینکوں کے ذریعے صنعتی مشینری کی مالی معاونت کا حکم", es: "Financiación de maquinaria industrial a través de bancos" }
summary:
  ar: "سائل سأل عن تمويل شراء الآلات والمعدات اللازمة لإنشاء وتشغيل خطوط الإنتاج من خلال البنوك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22387)⁩ أنه يجوز للشركة المذكورة تمويل الآلات اللازمة عبر البنوك سواء كان التمويل بعقد مرابحة أو غيره من الصيغ المشروعة على ما فصّل الجواب."
  en: "A questioner asked about financing the purchase of machinery and equipment needed to set up and run production lines through banks. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22387) answered that the company in question may finance the required machines through banks, whether the financing is by murabaha or other lawful structures, as the answer details."
  ur: "ایک سائل نے پیداواری لائنیں قائم اور چلانے کے لیے مشینری اور سازوسامان کی خرید بینکوں کے ذریعے مالی معاونت لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22387)⁩ نے جواب دیا کہ مذکورہ کمپنی مطلوبہ مشینوں کی مالی معاونت بینکوں سے لے سکتی ہے خواہ مرابحہ کے عقد سے ہو یا دیگر جائز صورتوں سے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de financiar la compra de maquinaria y equipos necesarios para instalar y operar líneas de producción a través de bancos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22387) respondió que la empresa en cuestión puede financiar la maquinaria requerida a través de bancos, ya sea mediante murabaha u otras estructuras legales, como se detalla en la respuesta."
