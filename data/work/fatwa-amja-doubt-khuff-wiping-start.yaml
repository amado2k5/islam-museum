id: work/fatwa-amja-doubt-khuff-wiping-start
class: work
kind: fatwa
label: { ar: "الشك في المسح على الخفين", en: "Doubt over when the khuff-wiping began", ur: "خف مسح کے آغاز کا شک", es: "Se acabó la duda sobre cuándo empezó la limpieza del khuff.", fr: "On ne sait plus quand le nettoyage des khuff a commencé.", tr: "Çorapları silme konusunda şüphe", id: "Ragu soal mengelap kaus kaki" }
summary:
  ar: "سأل سائل أنه شك هل مسح على الخفين لصلاة الظهر أو لصلاة العصر وهل صلاته صحيحة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83918 بتاريخ 7 مارس 2011)⁩ أن الأصل عدم المسح بناء على المستيقن فإن شك هل مسح لصلاة الظهر أو لصلاة العصر فليجعل ابتداء المدة من صلاة العصر لأن الأصل عدم المسح، ودليل هذه القاعدة وهو أن الأصل بقاء ما كان على ما كان وأن الأصل العدم أن الرسول شكي إليه الرجل يخيل إليه أنه يجد الشيء في صلاته فقال لا ينصرف حتى يسمع صوتًا أو يجد ريحًا على ما فصّل."
  en: "A questioner doubted whether he had wiped his khuffs for the noon or the afternoon prayer, and whether his prayer was valid. Dr. Salah al-Sawi (fatwa no. 83918, 7 March 2011) answered that the rule is no wiping, building on the certain; so if he doubts whether he wiped for zuhr or for asr he begins the term from the asr prayer, the assumption being no wiping; the proof of this maxim — that what was, stays as it was, and the default is absence — is the Messenger's answer to the man who fancied he found something in his prayer: 'he is not to leave till he hears a sound or finds a smell' — as detailed."
  ur: "ایک شخص کو خف مسح کے وقت کا شک ہوا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83918، 7 مارچ 2011)⁩ کے مطابق اصل عدم ہے — عصر سے شمار کرے؛ قاعدہ یقین شک سے نہیں جاتا۔"
  es: "Un consultante dudaba si se había limpiado los khuffs para la oración del mediodía o de la tarde, y si su oración era válida. El Dr. Salah al-Sawi (fatwa n.º 83918, 7 de marzo de 2011) respondió que la regla es no limpiarse, partiendo de la certeza; así que si duda si se limpió para el zuhr o para el asr, comienza el plazo desde la oración del asr, asumiendo que no se limpió; la prueba de esta máxima —que lo que fue, permanece como fue, y la omisión es la ausencia— es la respuesta del Mensajero al hombre que creyó encontrar algo en su oración: «no debe irse hasta que oiga un sonido o encuentre un olor», como se detalla."
  fr: "Un homme, se demandant s'il avait essuyé ses ablutions pour la prière de midi ou celle de l'après-midi, et si sa prière était valide, a répondu par la fatwa n° 83918 du 7 mars 2011 que la règle est de ne pas s'essuyer, partant du principe qu'il ne faut pas le faire. Ainsi, s'il doute d'avoir essuyé ses ablutions pour la prière de midi ou celle de l'après-midi, il faut commencer le décompte à partir de la prière de l'après-midi, en supposant qu'il ne s'est pas essuyé. La preuve de cette maxime – que ce qui était, reste ce qui était, et que l'absence est la norme – est la réponse du Messager à l'homme qui pensait avoir trouvé quelque chose pendant sa prière: « Il ne doit pas partir avant d'entendre un son ou de sentir une odeur », comme expliqué en détail."
  tr: "Bir soru soran kişi, Dhuhr veya Asr namazında çorapların üzerinden silinmenin geçerli olup olmadığından şüphe edip etmediği soruldu. Dr. Salah Al-Sawi (7 Mart 2011 tarihli Fetva No. 83918) varsayılan kuralın kesinliğe dayalı silme kuralına dayanarak silmemek olduğunu yanıtladı. Eğer biri silmenin Dhuhr mu yoksa Asr için mi yoksa Asr için mi olduğundan şüphe ediyorsa, süreyi Asr namazından başlatmalıdır çünkü varsayılan olan silme değildir. Bu kuralın kanıtı, varsayılan olanın eskisi gibi kalması olduğudur; Peygamber, bir adamın namazında bir şey bulacağını düşünerek şikayet ettiğini ve bu yüzden belirttiği gibi bir ses veya koku duymadan ayrılmaması gerektiğini söylemiştir."
  id: "Seorang penanya ditanya apakah ia meragukan apakah mengelap kaos kaki untuk shalat Dhuhr atau Asr itu sah. Dr. Salah Al-Sawi menjawab (Fatwa No. 83918 tanggal 7 Maret 2011) bahwa aturan default adalah tidak menghapus berdasarkan kepastian. Jika seseorang meragukan apakah menghapus untuk Dhuhr atau Asr, ia harus memulai durasi dari shalat Asr karena default itu bukan menghapus doa. Bukti untuk aturan ini adalah bahwa default adalah mempertahankan apa yang adanya, dan defaultnya adalah Nabi mengeluh kepada seseorang dengan membayangkan akan menemukan sesuatu dalam doanya, sehingga ia berkata tidak boleh pergi sampai mendengar suara atau mencium bau seperti yang telah ditentukan."
