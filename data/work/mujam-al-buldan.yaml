summary:
  ar: "معجم ياقوت الحموي الجغرافي التاريخي الأدبي؛ بدأت فكرته بمرو سنة ٦١٥هـ وتمت مسودته بحلب في ٢٠ صفر ٦٢١هـ وشرع في تبييضه الأخير لخزانة القفطي في ٢١ محرم ٦٢٥هـ ولم يبلغ مادة رصافة بغداد {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}."
  en: "Yaqut al-Hamawi's geographical, historical and literary dictionary: conceived at Marw in 615, drafted at Aleppo by 20 Safar 621, and begun in definitive form for al-Qifti's library on 21 Muharram 625; the last revision never reached 'Rusafat Baghdad' {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}."
  es: "Diccionario geográfico, histórico y literario de Yaqut al-Hamawi: concebido en Marw en 615, redactado en Alepo el 20 de Safar de 621 y comenzado en su forma definitiva para la biblioteca de al-Qifti el 21 de Muharram de 625; la última revisión nunca llegó a 'Rusafat Bagdad' {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}."
  fr: "Dictionnaire géographique, historique et littéraire de Yaqut al-Hamawi: conçu à Marw en 615, rédigé à Alep le 20 Safar 621 et commencé sous sa forme définitive pour la bibliothèque d'al-Qifti le 21 Muharram 625; la dernière révision n'a jamais atteint 'Rusafat Baghdad' {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}."
  ur: "یاقوت الحماوی کی جغرافیائی، تاریخی اور ادبی لغت: مروہ میں 615 میں تیار کی گئی، 20 صفر 621 کو حلب میں تیار کی گئی، اور 21 محرم 625 کو القیفتی کی لائبریری کے لیے قطعی شکل میں شروع ہوئی۔ آخری نظر ثانی 'رسفت بغداد' تک نہیں پہنچی {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 11ص۔ 265}۔"
  tr: "Yaqut al-Hamawi'nin Coğrafi, Tarihsel ve Edebi Sözlüğü; kavramı 615 Hicri yılında Marw'da başladı, taslağı 20 Sefer 621 Hicri'de Halep'te tamamlandı ve Kıfti kütüphanesinin son beyazlatılması 21 Muharrem 625 Hile tarihinde başladı ve Rusafa Bağdat girişine ulaşmadı {cite:encyclopaedia-of-Islam-2 cilt 11, s. 265}."
  id: "Kamus Geografis, Sejarah, dan Sastra Yaqut al-Hamawi; konsepnya dimulai pada Marw pada tahun 615 H, drafnya selesai di Aleppo pada 20 Safar 621 H, dan pemutihan akhir perpustakaan Qifti dimulai pada 21 Muharram 625 H, dan tidak sampai ke entri Rusafa Baghdad {cite:encyclopaedia-of-Islam-2 vol. 11, hlm. 265}."
