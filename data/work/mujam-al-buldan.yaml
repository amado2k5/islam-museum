composed: { edtf: "1228-01", hijri: "0625-01", calendar: julian, precision: month, status: tradition, derived: true, note: "«وكان الشروع من هذا التبييض في ليلة إحدى وعشرين من محرم سنة خمس وعشرين وستمائة» (Cairo 1323/1906 ed., vol. 1, scan p.17); start of the fair copy, Gregorian derived" }
structure: "Preface (vol. 1 scan pp. 6-17); five introductory chapters: 1 the shape of the earth (pp. 17-27), 2 the seven climes, their derivation and the qibla (pp. 28-37), 3 terms that recur in the book: barid, farsakh, mil, kura, iqlim, mikhlaf, ustan, tassuj, jund, sikka, misr, abad, longitude, latitude, degree, minute, sulh, silm, anwa, kharaj, fay', ghanima, qati'a (pp. 38-47), 4 the jurists on the lands of fay' and ghanima (pp. 48-52), 5 general reports on countries (pp. 52-54); then the dictionary in 28 books by first letter, each in 28 chapters by second letter, alphabetized letter by letter (from p. 55). Volumes 1-2 of the Khanji edition (scan pp. 1-856) cover the introduction and the letters alif, ba and ta."
