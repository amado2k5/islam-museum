summary:
  ar: "معجم ياقوت الحموي الجغرافي التاريخي الأدبي؛ بدأت فكرته بمرو سنة ٦١٥هـ وتمت مسودته بحلب في ٢٠ صفر ٦٢١هـ وشرع في تبييضه الأخير لخزانة القفطي في ٢١ محرم ٦٢٥هـ ولم يبلغ مادة رصافة بغداد {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}."
  en: "Yaqut al-Hamawi's geographical, historical and literary dictionary: conceived at Marw in 615, drafted at Aleppo by 20 Safar 621, and begun in definitive form for al-Qifti's library on 21 Muharram 625; the last revision never reached 'Rusafat Baghdad' {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}."
