label: { ar: "لغز الموت", en: "Lughz al-Mawt", ur: "لغز الموت", es: "Lughz al-Mawt", fr: "Lughz al-Mawt", tr: "Ölümün Gizemi", id: "Misteri Kematian" }
summary:
  ar: "كتاب تأملي لمصطفى محمود في الموت، يبدأ بأن «كل منا يحمل جثته على كتفيه» وأن الموت يحدث فينا في كل لحظة، ويمر بفصول في الزمن والحب والجبر والاختيار والنوم والروح، وينتهي إلى أن العدالة تنتظر الجميع وأن الكتب السماوية وحدها تجيب عن لغز الموت {cite:mm-lughz-al-mawt-awda-1972 p. 7} {cite:mm-lughz-al-mawt-awda-1972 p. 127} {cite:mm-lughz-al-mawt-awda-1972 p. 129}."
  en: "Mostafa Mahmoud's reflective book on death, opening with 'each of us carries his corpse on his shoulders' and death happening in us every moment, passing through chapters on time, love, freedom and determinism, sleep and the soul, and ending with the claim that justice awaits everyone and that only the revealed books answer the riddle of death {cite:mm-lughz-al-mawt-awda-1972 p. 7} {cite:mm-lughz-al-mawt-awda-1972 p. 127} {cite:mm-lughz-al-mawt-awda-1972 p. 129}."
  ur: "موت پر مصطفیٰ محمود کی غور و فکر کی کتاب، جو اس بات سے شروع ہوتی ہے کہ «ہم میں سے ہر ایک اپنی لاش کندھوں پر اٹھائے پھرتا ہے» اور موت ہر لمحہ ہمارے اندر واقع ہوتی ہے، زمانہ، محبت، جبر و اختیار، نیند اور روح کے ابواب سے گزرتی ہے، اور اس نتیجے پر ختم ہوتی ہے کہ عدل سب کا منتظر ہے اور صرف آسمانی کتابیں موت کے معمے کا جواب دیتی ہیں {cite:mm-lughz-al-mawt-awda-1972 p. 7} {cite:mm-lughz-al-mawt-awda-1972 p. 127} {cite:mm-lughz-al-mawt-awda-1972 p. 129}۔"
  es: "El libro reflexivo de Mostafa Mahmoud sobre la muerte, que comienza con \"cada uno de nosotros lleva su cadáver sobre sus hombros\" y la muerte que ocurre en nosotros a cada momento, pasando por capítulos sobre el tiempo, el amor, la libertad y el determinismo, el sueño y el alma, y terminando con la afirmación de que la justicia espera a todos y que solo los libros revelados responden al enigma de la muerte {cite:mm-lughz-al-mawt-awda-1972 p. 7} {cite:mm-lughz-al-mawt-awda-1972 p. 127} {cite:mm-lughz-al-mawt-awda-1972 p. 129}."
  fr: "Le livre de réflexion de Mostafa Mahmoud sur la mort, s'ouvrant sur le constat que « chacun de nous porte son cadavre sur ses épaules » et que la mort survient en nous à chaque instant, passant par des chapitres sur le temps, l'amour, la liberté et le déterminisme, le sommeil et l'âme, et se terminant par l'affirmation que la justice attend chacun et que seuls les livres révélés répondent à l'énigme de la mort {cite:mm-lughz-al-mawt-awda-1972 p. 7} {cite:mm-lughz-al-mawt-awda-1972 p. 127} {cite:mm-lughz-al-mawt-awda-1972 p. 129}."
  tr: "Mustafa Mahmoud'un ölüm üzerine düşünsel bir kitabı, \"Hepimiz cesedimizi omuzlarımızda taşıyoruz\" ile başlıyor ve ölümün her an içimizde gerçekleştiğini, zaman, sevgi, kader, seçim, uyku ve ruh bölümlerinden geçtiğini ve adaletin herkesi beklediğini, sadece göksel kutsal yazıların ölümün gizemini yanıtladığını sonlandırıyor {cite:mm-lughz-al-mawt-awda-1972 s. 7} {cite:mm-lughz-al-mawt-awda-1972 s. 127} {cite:mm-lughz-al-mawt-awda-1972 s. 129}."
  id: "Sebuah buku kontemplatif karya Mustafa Mahmoud tentang kematian, dimulai dengan \"Setiap dari kita membawa mayat kita di atas bahu kita,\" dan bahwa kematian terjadi dalam diri kita setiap saat, melewati bab-bab waktu, cinta, takdir, pilihan, tidur, dan jiwa, dan menyimpulkan bahwa keadilan menanti setiap orang dan hanya kitab suci surgawi yang menjawab misteri kematian {cite:mm-lughz-al-mawt-awda-1972 hlm. 7} {cite:mm-lughz-al-mawt-awda-1972 hlm. 127} {cite:mm-lughz-al-mawt-awda-1972 hlm. 129}."
