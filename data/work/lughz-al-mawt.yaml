summary:
  ar: "كتاب تأملي لمصطفى محمود في الموت، يبدأ بأن «كل منا يحمل جثته على كتفيه» وأن الموت يحدث فينا في كل لحظة، ويمر بفصول في الزمن والحب والجبر والاختيار والنوم والروح، وينتهي إلى أن العدالة تنتظر الجميع وأن الكتب السماوية وحدها تجيب عن لغز الموت {cite:mm-lughz-al-mawt-awda-1972 p. 7} {cite:mm-lughz-al-mawt-awda-1972 p. 127} {cite:mm-lughz-al-mawt-awda-1972 p. 129}."
  en: "Mostafa Mahmoud's reflective book on death, opening with 'each of us carries his corpse on his shoulders' and death happening in us every moment, passing through chapters on time, love, freedom and determinism, sleep and the soul, and ending with the claim that justice awaits everyone and that only the revealed books answer the riddle of death {cite:mm-lughz-al-mawt-awda-1972 p. 7} {cite:mm-lughz-al-mawt-awda-1972 p. 127} {cite:mm-lughz-al-mawt-awda-1972 p. 129}."
  ur: "موت پر مصطفیٰ محمود کی غور و فکر کی کتاب، جو اس بات سے شروع ہوتی ہے کہ «ہم میں سے ہر ایک اپنی لاش کندھوں پر اٹھائے پھرتا ہے» اور موت ہر لمحہ ہمارے اندر واقع ہوتی ہے، زمانہ، محبت، جبر و اختیار، نیند اور روح کے ابواب سے گزرتی ہے، اور اس نتیجے پر ختم ہوتی ہے کہ عدل سب کا منتظر ہے اور صرف آسمانی کتابیں موت کے معمے کا جواب دیتی ہیں {cite:mm-lughz-al-mawt-awda-1972 p. 7} {cite:mm-lughz-al-mawt-awda-1972 p. 127} {cite:mm-lughz-al-mawt-awda-1972 p. 129}۔"
