id: work/fatwa-dar-alifta-zakat-to-a-needy-divorced-wife
class: work
kind: fatwa
label: { ar: "حكم إخراج الرجل زكاة ماله لعلاج مطلقته المحتاجة", en: "Giving zakat to a needy divorced wife for her medical treatment", ur: "ضرورت مند مطلقہ بیوی کے علاج کے لیے زکاۃ دینے کا حکم" }
summary:
  ar: "سؤال عن جواز دفع المزكي زكاة ماله إلى مطلقته لتجري بها عملية جراحية ضرورية لعجزها عن تكاليف العلاج، أجابت فيه دار الإفتاء المصرية بأنه إن كان الطلاق رجعيًا فلا يجزئ دفع الزكاة إليها من سهم الفقراء والمساكين لأنها في حكم الزوجة ما دامت في العدة ونفقتها، ومنها العلاج، واجبة عليه فتصير غنية بذلك، فإن استحقت الزكاة بغير وصف الفقر كأن كانت من الغارمين جاز، وإن كان الطلاق بائنًا بينونة صغرى أو كبرى صارت أجنبية عنه فجاز له أن يدفع إليها من زكاته متى توافر فيها وصف من أوصاف الأصناف الثمانية، ويتأكد استحقاقها إذا كانت مع احتياجها مريضة. نقلت الدار عن إمام الحرمين أن الرجعية زوجة ما دامت في العدة، وعن ابن المنذر إجماع أهل العلم على أن الرجل لا يعطي زوجته من الزكاة، وعن عليش والشوكاني وقانون الأحوال الشخصية 25 لسنة 1920 دخول العلاج في النفقة، وعن الخطيب الشربيني جواز الدفع لمن تلزمه نفقته من سهم باقي الأصناف، وعن ابن القطان إجماع من فرّق صدقته في الأصناف الثمانية، وعن الكاساني والشاطبي حكمة الزكاة في إعانة الضعيف وإحياء النفوس المعرّضة للتلف."
  en: "A question about whether a zakat payer may give his zakat to his divorced wife so that she can have a necessary operation she cannot afford; Dar al-Ifta al-Misriyya answered that if the divorce is revocable the zakat does not count when paid to her from the share of the poor and needy, because she remains in the position of a wife for as long as her waiting period lasts and her maintenance, including medical treatment, is his duty, which makes her well-off in that respect; if she qualifies for zakat on a ground other than poverty, such as being a debtor, he may give it to her; and if the divorce is final, whether of the lesser or the greater kind, she has become a stranger to him and he may pay her from his zakat whenever she meets one of the descriptions of the eight categories, her entitlement being all the stronger when she is both needy and ill. Dar al-Ifta quoted Imam al-Haramayn that a revocably divorced woman is a wife while in her waiting period, Ibn al-Mundhir on the scholars' consensus that a man does not give his wife zakat, Ulaysh, al-Shawkani and Egypt's Personal Status Law 25 of 1920 that treatment falls within maintenance, al-Khatib al-Shirbini that one may give to those he must maintain from the shares of the other categories, Ibn al-Qattan on the consensus that whoever distributes his zakat among the eight categories has discharged his duty, and al-Kasani and al-Shatibi on the purpose of zakat in helping the weak and preserving lives exposed to ruin."
  ur: "اس بارے میں سوال کہ کیا زکاۃ دینے والا اپنی زکاۃ اپنی مطلقہ کو دے سکتا ہے تاکہ وہ ایک ضروری آپریشن کرا سکے جس کے اخراجات وہ برداشت نہیں کر سکتی؛ دار الافتاء مصر نے جواب دیا کہ اگر طلاق رجعی ہو تو فقرا اور مساکین کے حصے سے اسے زکاۃ دینا کافی نہیں، کیونکہ عدت کے دوران وہ بیوی کے حکم میں ہے اور اس کا نفقہ، جس میں علاج شامل ہے، شوہر پر واجب ہے، جس سے وہ اس اعتبار سے غنی ہو جاتی ہے؛ اگر وہ فقر کے علاوہ کسی اور وصف سے زکاۃ کی مستحق ہو، جیسے مقروض ہونا، تو جائز ہے؛ اور اگر طلاق بائن ہو، چھوٹی ہو یا بڑی، تو وہ اس کے لیے اجنبی ہو گئی اور وہ اسے اپنی زکاۃ سے دے سکتا ہے جب بھی وہ آٹھ اصناف میں سے کسی وصف پر پوری اترے، اور ضرورت کے ساتھ بیمار ہونے پر اس کا استحقاق اور مؤکد ہو جاتا ہے۔ دار الافتاء نے امام الحرمین سے نقل کیا کہ رجعی مطلقہ عدت کے دوران بیوی ہے، ابن المنذر سے اہلِ علم کا اجماع کہ مرد اپنی بیوی کو زکاۃ نہیں دیتا، علیش، شوکانی اور مصر کے 1920 کے پرسنل اسٹیٹس قانون 25 سے کہ علاج نفقے میں شامل ہے، خطیب شربینی سے کہ جس کا نفقہ لازم ہو اسے باقی اصناف کے حصوں سے دیا جا سکتا ہے، ابن القطان سے اجماع کہ جو اپنا صدقہ آٹھ اصناف میں تقسیم کرے وہ اپنا فرض ادا کر چکا، اور کاسانی اور شاطبی سے زکاۃ کی حکمت کہ یہ کمزور کی مدد اور تباہی کے خطرے میں پڑی جانوں کو زندہ رکھنا ہے۔"
