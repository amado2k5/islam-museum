id: work/fatwa-amja-sound-vs-weak-opinion
class: work
kind: fatwa
label: { ar: "القول الصحيح والضعيف عند الفقهاء", en: "What jurists mean by a sound and a weak opinion", ur: "فقہاء کے نزدیک صحیح اور کمزور قول", es: "Qué entienden los juristas por opinión sólida y opinión débil", fr: "Que signifient les juristes les expressions « opinion fondée » et « opinion faible » ?" }
summary:
  ar: "سأل سائل ماذا يريد الفقهاء بالرأي الصحيح والضعيف وما معيار الصحة وهل يصح العمل بأي قولين صحيحين وما صيغة خطبة الحاجة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77736 بتاريخ 7 فبراير 2009)⁩ أن الصحة وعدمها في أقوال الفقهاء من الأمور النسبية فما يصح عند مجتهد قد لا يصح عند آخر، لكن المجتهد حين يقول إن هذا هو القول الصحيح يقصد أنه الذي يقتضيه النظر في الأدلة ويشهد له التأمل فيها ومعيار الصحة موافقة القول للدليل وفق أصول المجتهد، وإن كان الخلاف خلاف تنوع جاز العمل بأي قولين أما خلاف التضاد فيلزم التماس الترجيح والعمل بما يغلب على الظن أنه أقرب للصواب وأوفق لمقصود الشارع، والمستفتي من العوام يرجع في الترجيح إلى مفتيه."
  en: "A questioner asked what jurists mean by 'sound' and 'weak' opinions, the criterion of soundness, whether acting on either of two sound views is valid, and the wording of the need-sermon. Dr. Salah al-Sawi (fatwa no. 77736, 7 February 2009) answered that soundness in jurists' opinions is relative — sound to one mujtahid may not be to another — but a mujtahid calling a view sound means it is what evidence-examination requires and reflection witnesses; the measure of soundness is the view's agreement with the proof under his adopted principles; a diversity-difference allows acting on either view, but a contradictory difference requires seeking the preponderant and acting on what one's judgment holds nearer the right and more in keeping with the Lawgiver's intent; a lay questioner is referred to his mufti for the weighing."
  ur: "ایک سائل نے صحیح و کمزور قول کے معیار پوچھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77736، 7 فروری 2009)⁩ کے مطابق صحت نسبتی ہے؛ اختلاف تنوع میں دونوں پر عمل جائز، تضاد میں غالب قول پر عمل اور عوام کے لیے مفتی کی طرف رجوع۔"
  es: "Un consultante preguntó qué entienden los juristas por opiniones «sanas» y «débiles», el criterio de solidez, si es válido actuar según cualquiera de dos opiniones sólidas y la redacción del sermón sobre la necesidad. El Dr. Salah al-Sawi (fatwa n.º 77736, 7 de febrero de 2009) respondió que la solidez en las opiniones de los juristas es relativa: lo que es sólido para un mujtahid puede no serlo para otro; pero que un mujtahid considere sólida una opinión significa que es lo que exige el examen de las pruebas y los testimonios reflexivos; la medida de la solidez es la concordancia de la opinión con la prueba según sus principios adoptados; una diferencia de diversidad permite actuar según cualquiera de las opiniones, pero una diferencia contradictoria exige buscar la preponderante y actuar según lo que el propio juicio considera más cercano a la verdad y más acorde con la intención del Legislador; a un consultante laico se le remite a su muftí para que sopese las opciones."
  fr: "Un interrogateur a demandé ce que les juristes entendent par avis « sain » et « faible », le critère de validité, la légitimité d'agir selon l'un ou l'autre de deux avis « sains », et la formulation du sermon sur la nécessité. Le Dr Salah al-Sawi (fatwa n° 77736, 7 février 2009) a répondu que la validité des avis des juristes est relative: ce qui est « sain » pour un mujtahid peut ne pas l'être pour un autre. Pour un mujtahid, qualifier un avis de « sain » signifie qu'il correspond à ce que l'examen des preuves et la réflexion des témoins exigent. La validité de l'avis se mesure à sa conformité avec les preuves, selon les principes qu'il a adoptés. Une divergence d'opinions permet d'agir selon l'un ou l'autre avis, mais une divergence contradictoire exige de rechercher l'avis prépondérant et d'agir selon ce que l'on juge le plus juste et le plus conforme à l'intention du Législateur. Un profane qui pose la question est invité à consulter son mufti pour une évaluation."
