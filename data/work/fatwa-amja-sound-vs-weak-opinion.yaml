id: work/fatwa-amja-sound-vs-weak-opinion
class: work
kind: fatwa
label: { ar: "القول الصحيح والضعيف عند الفقهاء", en: "What jurists mean by a sound and a weak opinion", ur: "فقہاء کے نزدیک صحیح اور کمزور قول" }
summary:
  ar: "سأل سائل ماذا يريد الفقهاء بالرأي الصحيح والضعيف وما معيار الصحة وهل يصح العمل بأي قولين صحيحين وما صيغة خطبة الحاجة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77736 بتاريخ 7 فبراير 2009)⁩ أن الصحة وعدمها في أقوال الفقهاء من الأمور النسبية فما يصح عند مجتهد قد لا يصح عند آخر، لكن المجتهد حين يقول إن هذا هو القول الصحيح يقصد أنه الذي يقتضيه النظر في الأدلة ويشهد له التأمل فيها ومعيار الصحة موافقة القول للدليل وفق أصول المجتهد، وإن كان الخلاف خلاف تنوع جاز العمل بأي قولين أما خلاف التضاد فيلزم التماس الترجيح والعمل بما يغلب على الظن أنه أقرب للصواب وأوفق لمقصود الشارع، والمستفتي من العوام يرجع في الترجيح إلى مفتيه."
  en: "A questioner asked what jurists mean by 'sound' and 'weak' opinions, the criterion of soundness, whether acting on either of two sound views is valid, and the wording of the need-sermon. Dr. Salah al-Sawi (fatwa no. 77736, 7 February 2009) answered that soundness in jurists' opinions is relative — sound to one mujtahid may not be to another — but a mujtahid calling a view sound means it is what evidence-examination requires and reflection witnesses; the measure of soundness is the view's agreement with the proof under his adopted principles; a diversity-difference allows acting on either view, but a contradictory difference requires seeking the preponderant and acting on what one's judgment holds nearer the right and more in keeping with the Lawgiver's intent; a lay questioner is referred to his mufti for the weighing."
  ur: "ایک سائل نے صحیح و کمزور قول کے معیار پوچھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77736، 7 فروری 2009)⁩ کے مطابق صحت نسبتی ہے؛ اختلاف تنوع میں دونوں پر عمل جائز، تضاد میں غالب قول پر عمل اور عوام کے لیے مفتی کی طرف رجوع۔"
