summary:
  ar: "كتاب حافل في الجهاد صنفه ابن النحاس الدمشقي واختصره هو بنفسه واستجيب فيه دعاؤه لما قال في أول سجعة فيه أحمدك اللهم وأسألك أعلى رتب الشهادة فقتل بدمياط في المعركة مع الفرنج {cite:shadharat-dhahab p. 113-114}."
  en: "Ibn al-Nahhas's celebrated jihad compendium — whose author prayed in its opening saj'a for martyrdom's highest rank, then fell fighting the Frankish raid on Damietta {cite:shadharat-dhahab p. 113-114}."
  es: "El célebre compendio de la yihad de Ibn al-Nahhas, cuyo autor oró en su saj'a inicial por el más alto rango del martirio, y luego cayó luchando en la incursión franca en Damietta {cite:shadharat-dhahab p. 113-114}."
  fr: "Le célèbre recueil de jihad d'Ibn al-Nahhas — dont l'auteur a prié dans sa saj'a d'ouverture pour le plus haut rang du martyre, puis est tombé en combattant le raid franc sur Damiette {cite:shadharat-dhahab p. 113-114}."
  ur: "ابن النحاس کا مشہور جہادی مجموعہ - جس کے مصنف نے اپنے ابتدائی سجدے میں شہادت کے بلند درجات کے لیے دعا کی، پھر دمیتا پر فرینک کے حملے سے لڑتے ہوئے گر گیا۔ 113-114}۔"
  tr: "İbn al-Nahhas al-Dimashqi tarafından yazılan zengin bir cihad kitabı, kendisi de kısaltmış ve ilk kafiyesinde şöyle dediği duasını kabul etmiştir: 'Ey Allah, seni övüyor ve en yüksek şehitlik rütbelerini diliyorum.' Franklarla savaşta Damietta'da öldürüldü {atıf: shadharat-dhahab s. 113-114}."
  id: "Sebuah buku kaya tentang jihad yang ditulis oleh Ibn al-Nahhas al-Dimashqi, yang sendiri meringkasnya dan menjawab doanya ketika ia berkata dalam rima pertama yang berkata: 'Ya Allah, aku memuji-Mu dan memohon pangkat tertinggi syahid-Mu.' Ia tewas di Damietta dalam pertempuran melawan bangsa Franka {cite:shadharat-dhahab hlm. 113-114}."
