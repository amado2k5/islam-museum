id: work/fatwa-amja-attraction-struggle-reward
class: work
kind: fatwa
label: { ar: "الميل المكبوح ومجاهدة النفس", en: "An attraction resisted — no sin in the struggle itself", ur: "روجہان کی مجاہدہ — خود عمل نہیں", es: "Una atracción resistido: no hay pecado en la lucha misma.", fr: "Une attirance à laquelle on résiste — il n'y a pas de péché à lutter en soi", tr: "Bastırılmış eğilim ve kendi kendine mücadele", id: "Kecenderungan yang tertekan dan perjuangan diri" }
summary:
  ar: "سأل سائل أنه يميل جنسيًا إلى الذكور دون الإناث هل هو بلاء أم عذاب وهل يبتلي الله عباده بما لا يرضاه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 792 بتاريخ 13 سبتمبر 2005)⁩ أن مجرد هذه الرغبة إن كبح الإنسان جماحها ولم يسترسل معها بل خاف مقام ربه ونهى نفسه عنها وقاومها بكل ما يستطيع فإنه لا حرج عليه منها ولا تثريب عليه فيها بل قد يكتب له بها ثواب من جاهد نفسه وراضها على طاعة ربه فتكون سببًا في رفعة درجاته وتكفير سيئاته، وإنما يبدأ الحرج عندما يبدأ الاسترسال معها والاستجابة لغواية النفس والهوى."
  en: "A questioner described an inclination toward males rather than females and asked whether it is a trial or a punishment — would God test His servants with what displeases Him? Dr. Salah al-Sawi (fatwa no. 792, 13 September 2005) answered that the mere inclination, if a man curbs its reins and does not indulge it — fearing his Lord's standing, forbidding his soul it and resisting it with all he can — carries no harm and no blame; he may even be written the reward of one who struggles with his soul and trains it on his Lord's obedience, it becoming a cause of raised ranks and expiated sins; the harm begins only when indulgence begins and the soul and desire are answered."
  ur: "ایک سائل نے اپنے روجہان کے بارے میں پوچھا — آزمائش یا عذاب۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 792، 13 ستمبر 2005)⁩ کے مطابق محض رغبت میں گناہ نہیں جب تک قابو رکھے بلکہ مجاہدے کا ثواب مل سکتا ہے؛ حرج عمل پر ہے۔"
  es: "Un consultante describió una inclinación hacia los varones en lugar de las mujeres y preguntó si se trataba de una prueba o un castigo: ¿acaso Dios pondría a prueba a sus siervos con aquello que le desagrada? El Dr. Salah al-Sawi (fatwa n.º 792, 13 de septiembre de 2005) respondió que la mera inclinación, si un hombre la controla y no se deja llevar por ella —temiendo la posición de su Señor, prohibiéndosela a sí mismo y resistiéndose con todas sus fuerzas— no conlleva daño ni culpa; incluso puede recibir la recompensa de quien lucha con su alma y la entrena en la obediencia a su Señor, convirtiéndose así en causa de ascenso social y expiación de pecados; el daño comienza solo cuando comienza la indulgencia y el alma y el deseo son complacidos."
  fr: "Un homme, décrivant une attirance pour les hommes plutôt que pour les femmes, demanda s'il s'agissait d'une épreuve ou d'un châtiment: Dieu mettrait-il Ses serviteurs à l'épreuve par ce qui Lui déplaît ? Le Dr Salah al-Sawi (fatwa n° 792, 13 septembre 2005) répondit que cette simple inclination, si l'homme la maîtrise et n'y cède pas – craignant la révérence de son Seigneur, s'interdisant d'y succomber et y résistant de toutes ses forces – n'entraîne ni mal ni blâme; il pourrait même recevoir la récompense de celui qui lutte avec son âme et la dirige vers l'obéissance à son Seigneur, ce qui lui vaudra une élévation spirituelle et l'expiation de ses péchés. Le mal ne survient que lorsque l'on cède à ses désirs et que l'âme est satisfaite."
  tr: "Bir soru soran kişiye, erkeklere yönelik cinsel eğiliminin bir felaket mi yoksa ceza mı yoksa bir felaket mi olduğu ve Tanrı'nın kullarını sevmediği şeylerle sınayıp sınamadığı soruldu. Dr. Salah Al-Sawy (13 Eylül 2005 tarihli 792 No. Fetva) şöyle yanıtladı: Bir kişi bu arzuyu dizginler, ısrarcı olmaz ama Rabbinin varlığından korkar, kendini tutar ve elinden gelenin en iyisiyle direnirse, bunun için hiçbir suçlama ya da kınama yoktur. Bunun yerine, kendine karşı mücadele eden ve Rab'be itaat etmekle yetinenler için ödül kaydedilebilir; bu da rütbelerini yükseltmek ve günahlarının kefaretini almak için bir sebep olabilir. Zorluk, kişinin onu takip etmeye ve benliğin ve arzuların ayartmalarına yanıt vermeye başladığında başlar."
  id: "Seorang penanya ditanya apakah kecenderungan seksualnya terhadap laki-laki daripada perempuan merupakan bencana atau hukuman, dan apakah Allah menguji hamba-Nya dengan apa yang tidak Dia sukai. Dr. Salah Al-Sawy menjawab (Fatwa No. 792 tertanggal 13 September 2005) bahwa jika seseorang menahan keinginan ini dan tidak bertahan, tetapi takut akan kehadiran Tuhan-Nya, menahan diri, dan melawannya sekuat tenaga, maka tidak ada kesalahan atau celaan atas hal itu. Sebaliknya, ganjaran dapat dicatat bagi mereka yang berjuang melawan diri sendiri dan puas dengan taat pada Tuhan, yang bisa menjadi alasan untuk menaikkan pangkat dan menebus dosa-dosanya. Kesulitan dimulai ketika seseorang mulai mengikutinya dan merespons godaan diri dan keinginan."
