label: { ar: "قصيدة حسان «يا حار قد عولت غير معول»", en: "Hassan's poem 'O Harith, you relied on what could not be relied on'", es: "El poema de Hassan, 'Oh Harith, confiaste en lo que no se podía confiar'.", fr: "Le poème de Hassan « Ô Harith, tu t'es fié à ce sur quoi on ne pouvait pas se fier »", ur: "حسن کی نظم 'اے حارث تو نے اس پر بھروسہ کیا جس پر بھروسہ نہیں کیا جا سکتا'", tr: "Hassan'ın şiiri \"Ey ateşli olan, kazma olmadan güvendin\"", id: "Puisi Hassan \"O yang panas, kau andalkan tanpa cangkul\"" }
summary:
  ar: "أبيات لحسان بن ثابت من الكامل على روي الباء، يذكر فيها فرار الحارث بن هشام يوم بدر وتركه أخاه {{cite:sharh-diwan-hassan-barquqi-1929 p.45}}."
  en: "Verses by Hassan ibn Thabit in the kamil metre on the rhyme ba', recalling al-Harith ibn Hisham's flight at Badr and how he left his brother behind {{cite:sharh-diwan-hassan-barquqi-1929 p.45}}."
  es: "Versos de Hassan ibn Thabit en metro kamil sobre la rima ba', que recuerdan la huida de al-Harith ibn Hisham en Badr y cómo dejó atrás a su hermano {{cite:sharh-diwan-hassan-barquqi-1929 p.45}}."
  fr: "Vers de Hassan ibn Thabit en mètre kamil sur la rime ba', rappelant la fuite d'al-Harith ibn Hisham à Badr et comment il a laissé son frère derrière lui {{cite:sharh-diwan-hassan-barquqi-1929 p.45}}."
  ur: "حارث بن ہشام کی بدر میں پرواز کو یاد کرتے ہوئے اور کس طرح اس نے اپنے بھائی کو پیچھے چھوڑ دیا {{حوالہ:شرح دیوان-حسن برقوی-1929 صفحہ 45}} کی نظم با پر کامل میٹر میں حسن بن ثابت کی آیات۔"
  tr: "Hasan ibn Thabit'in El-Kamil ala'dan Ba' tarafından anlatılan dizeleri, Badr gününde Al-Harit ibn Hisham'ın kaçışı ve kardeşinin terk edilmesi {{cite:sharh-diwan-hassan-barquqi-1929 s.45}}."
  id: "Bait-bait oleh Hassan ibn Thabit dari Al-Kamil ala yang diceritakan oleh Ba', menyebutkan pelarian Al-Harith ibn Hisham pada hari Badr dan pengabaian saudaranya {{cite:sharh-diwan-hassan-barquqi-1929 hlm.45}}."
