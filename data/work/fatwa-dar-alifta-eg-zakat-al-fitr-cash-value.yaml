label: { ar: "حكم إخراج زكاة الفطر بالقيمة مالًا", en: "Paying zakat al-fitr as cash value", ur: "زکات الفطر کی مالیت نقد ادا کرنا" }
summary:
  ar: "سائل سأل عن إخراج زكاة الفطر بالقيمة مالًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21778)⁩ أنه يجوز شرعًا إخراجها بقيمتها مالًا لمستحقيها من غير إثم ولا حرج وهو مذهب الحنفية وبعض فقهاء المذاهب الأخرى على ما فصّل الجواب."
  en: "A questioner asked about paying zakat al-fitr as its cash value. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21778) answered that paying it as money to those entitled is lawful — no sin or harm in it — the doctrine of the Hanafis and some jurists of other schools, as the answer details."
  ur: "ایک سائل نے زکات الفطر کی مالیت نقد ادا کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21778)⁩ نے جواب دیا کہ مستحقین کو اس کی مالیت رقم کے طور پر دینا جائز ہے — کوئی گناہ یا حرج نہیں — یہ حنفیوں کا مذہب ہے اور دیگر مذاہب کے بعض فقہا کا بھی — جیسا کہ جواب میں تفصیل ہے۔"
