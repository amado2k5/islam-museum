label: { ar: "حكم إخراج زكاة الفطر بالقيمة مالًا", en: "Paying zakat al-fitr as cash value", ur: "زکات الفطر کی مالیت نقد ادا کرنا", es: "Pagar el zakat al-fitr como si fuera dinero en efectivo.", fr: "Payer la zakat al-fitr en espèces", tr: "Zekat el-Fitr'in parayla ödenmesine ilişkin karar", id: "Putusan tentang pembayaran Zakat al-Fitr dalam jumlah uang" }
summary:
  ar: "سائل سأل عن إخراج زكاة الفطر بالقيمة مالًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21778)⁩ أنه يجوز شرعًا إخراجها بقيمتها مالًا لمستحقيها من غير إثم ولا حرج وهو مذهب الحنفية وبعض فقهاء المذاهب الأخرى على ما فصّل الجواب."
  en: "A questioner asked about paying zakat al-fitr as its cash value. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21778) answered that paying it as money to those entitled is lawful — no sin or harm in it — the doctrine of the Hanafis and some jurists of other schools, as the answer details."
  ur: "ایک سائل نے زکات الفطر کی مالیت نقد ادا کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21778)⁩ نے جواب دیا کہ مستحقین کو اس کی مالیت رقم کے طور پر دینا جائز ہے — کوئی گناہ یا حرج نہیں — یہ حنفیوں کا مذہب ہے اور دیگر مذاہب کے بعض فقہا کا بھی — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de pagar el zakat al-fitr como si fuera su valor en efectivo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21778) respondió que pagarlo como dinero a quienes tienen derecho a ello es lícito —no hay pecado ni perjuicio alguno—, doctrina de los hanafíes y de algunos juristas de otras escuelas, como se detalla en la respuesta."
  fr: "Un internaute a demandé si le versement de la zakat al-fitr en espèces était autorisé. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21778) a répondu que son versement aux personnes y ayant droit est licite, sans qu'il y ait péché ni préjudice, conformément à la doctrine des hanafites et de certains juristes d'autres écoles, comme le précise la réponse."
  tr: "Bir soru soran kişi, Zekat al-Fitr'in maddi olarak verilmesini sordu. Mısır'ın Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21778), cevabında ayrıntılı olarak belirtildiği gibi, hak sahiplerine para olarak verilmesinin dini olarak kabul edilebilir olduğunu yanıtladı; bu da Hanefi mezhebi ve diğer mezheblerin bazı hukukçularıdır."
  id: "Seorang penanya bertanya tentang pemberian Zakat al-Fitr dalam nilai uang. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21778) menjawab bahwa secara agama diperbolehkan memberikan Zakat al-Fitr sesuai nilai uang kepada mereka yang berhak tanpa dosa atau bahaya, yaitu aliran Hanafi dan beberapa ahli hukum dari aliran lain seperti yang dijelaskan dalam jawaban."
