label: { ar: "حكم دفع الزكاة لجمعية تصرفها في إطعام الطعام والتأهيل", en: "Paying zakat to a charity spending it on feeding and training", ur: "کھانا کھلانے اور تربیت پر خرچ کرنے والی جمعیت کو زکات", es: "Pagar el zakat a una organización benéfica que lo gasta en alimentación y capacitación." }
summary:
  ar: "سائل سأل عن دفع الزكاة لجمعية تصرفها في إطعام الطعام للفقراء في القرى طول العام والتأهيل. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21767)⁩ أنه لا مانع شرعًا من الصرف من أموال الزكاة في عمل وجبات إطعام للفقراء في القرى طول العام وبيّن الجواب حكم ما يتعلق بالتأهيل على وجهه."
  en: "A questioner asked about paying zakat to a charity that spends it on feeding the poor in the villages year-round and on vocational training. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21767) answered that there is no sharia barrier to spending zakat on feeding meals to the village poor all year; the ruling on the training aspect is set out in the answer."
  ur: "ایک سائل نے ایسی جمعیت کو زکات دینے کا حکم پوچھا جو سارا سال دیہات کے فقیروں کو کھانا کھلاتی اور تربیت دیتی ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21767)⁩ نے جواب دیا کہ زکات سے سال بھر فقیروں کو کھانا کھلانا جائز ہے؛ تربیت کے پہلو کا حکم جواب میں بیان ہوا۔"
  es: "Un consultante preguntó sobre el pago del zakat a una organización benéfica que lo destina a alimentar a los pobres de las aldeas durante todo el año y a la formación profesional. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21767) respondió que no existe ningún impedimento según la sharia para destinar el zakat a la alimentación de los pobres de las aldeas durante todo el año; la normativa sobre la formación se detalla en la respuesta."
