id: work/fatwa-amja-cutting-prayer-to-open-door
class: work
kind: fatwa
label: { ar: "قطع الصلاة لفتح الباب", en: "Breaking the prayer to open the mosque door — not legislated", ur: "دروازہ کھولنے نماز توڑنا — غیر مشروع", es: "Interrumpir la oración para abrir la puerta de la mezquita: no está regulado por ley." }
summary:
  ar: "سأل سائل عن جواز قطع الصلاة لفتح باب المصلى أو المسجد لأحد المصلين. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86935 بتاريخ 3 يونيو 2012)⁩ أنه لا يشرع له قطع صلاته لمثل ذلك إلا إذا كان الباب قريبًا وفي جهة القبلة فله أن يتقدم إليه بخطوات يسيرة حتى يفتح له على ما فصّل الجواب من الحديث الوارد في ذلك."
  en: "A questioner asked whether he may cut the prayer to open the prayer-hall or mosque door for a worshipper. AMJA's fatwa committee (fatwa no. 86935, 3 June 2012) answered that cutting the prayer for such a thing is not legislated — unless the door is near and toward the qibla, then he may advance a few steps to open it, per the hadith transmitted in that — as the answer details."
  ur: "نماز توڑ کر دروازہ؟ لجنة الفتوى ⁦(فتویٰ 86935، 3 جون 2012)⁩ کے مطابق نہیں؛ قریب و قبلہ سمت ہو تو چند قدم جائز۔"
  es: "Un consultante preguntó si podía interrumpir la oración para abrir la puerta de la sala de oración o de la mezquita a un fiel. El comité de fatuas de AMJA (fatua n.º 86935, 3 de junio de 2012) respondió que interrumpir la oración para tal cosa no está legislado, a menos que la puerta esté cerca y orientada hacia la qibla; en ese caso, puede avanzar unos pasos para abrirla, según el hadiz transmitido al respecto, como se detalla en la respuesta."
