summary:
  ar: "ترجمة إنجليزية لمعاني القرآن وضعتها الأمريكية الإيرانية ليلى بختيار ونُشرت سنة 2007، على منهج تقول إنه قائم على فهرس للجذور اللغوية العربية، دون حواشٍ ولا تفسير، وبكلمة God بدل اسم الجلالة؛ اشتهرت بطريقتها في ترجمة آية من سورة النساء في معاملة الزوجة، ولقيت ثناءً ونقدًا بقدر متقارب، ومنه نقد خالد أبو الفضل لعلمها بالعربية، وأعادت بختيار نشر نصها في صور مختلفة حتى 2016، وتوفيت سنة 2020."
  en: "An English rendering of the meanings of the Qur'an by the Iranian-American Laleh Bakhtiar, published in 2007, on what she called a concordance-based method resting on Arabic word roots, without notes or commentary, and using 'God' for the divine name; best known for her rendering of a verse of Surat al-Nisa' on the treatment of a wife, it met acclaim and criticism in almost equal measure, including Khaled Abou El Fadl's doubts about her Arabic, and Bakhtiar republished the text in several forms up to 2016; she died in 2020."
  ur: "قرآن کے معانی کا انگریزی ترجمہ از ایرانی امریکی لیلیٰ بختیار، جو 2007 میں شائع ہوا، اس طریقے پر جسے وہ عربی جڑوں کے اشاریے پر مبنی کہتی تھیں، بغیر حواشی اور تفسیر کے، اور اللہ کے نام کے لیے God کے لفظ کے ساتھ؛ سورۃ النساء کی ایک آیت میں بیوی سے سلوک کے ترجمے سے مشہور ہوا، تعریف اور تنقید تقریباً برابر ملی، جن میں خالد ابو الفضل کا ان کی عربی پر اعتراض بھی ہے؛ بختیار نے 2016 تک یہ متن کئی صورتوں میں دوبارہ شائع کیا، اور 2020 میں وفات پائی۔"
