label: { ar: "قراءة القرآن على المقابر والمشي بالنعال عليها", en: "Fatwa on reciting the Qur'an at graves and walking over them in shoes", ur: "قبروں پر قرآن پڑھنے اور جوتوں میں چلنے پر فتویٰ", es: "Fatwa sobre recitar el Corán en tumbas y caminar sobre ellas con zapatos.", fr: "Fatwa concernant la récitation du Coran sur les tombes et le fait de marcher dessus en chaussures", tr: "Mezarlar üzerinde Kur'an okumak ve terlikle üzerinde yürümek", id: "Membaca Al-Qur'an di atas makam dan berjalan di atasnya dengan sandal" }
summary:
  ar: "سؤال عن حكم قراءة القرآن على القبور بقصد السؤال، والمشي بالنعال والجلوس عليها. الجواب: قراءة القرآن بهذا القصد السيئ حرام بلا خلاف، والمشي بالنعال والجلوس على المقابر منهي عنه لما فيه من إهانة الموتى، ومخالفة نهي النبي."
  en: "Question on reciting the Qur'an at graves with the intent of asking, and on walking in shoes or sitting on graves. The answer: reciting with that intent is forbidden without dispute; walking in shoes or sitting on graves is discouraged, since it disrespects the dead and goes against the Prophet's prohibition."
  ur: "سوال: قبروں پر سوال کی نیت سے قرآن پڑھنے، اور جوتے پہنے چلنے یا قبروں پر بیٹھنے کا حکم۔ جواب: اس برے قصد سے قرآن پڑھنا بلا خلاف حرام ہے؛ قبروں پر جوتوں میں چلنا اور بیٹھنا ممنوع ہے کیونکہ اس میں مردوں کی توہین اور نبی کی ممانعت کی مخالفت ہے۔"
  es: "Pregunta sobre recitar el Corán en tumbas con la intención de pedir, y sobre caminar con zapatos o sentarse en tumbas. La respuesta: recitar con esa intención está prohibido sin lugar a dudas; caminar con zapatos o sentarse en tumbas es desaconsejable, ya que es una falta de respeto a los difuntos y contraviene la prohibición del Profeta."
  fr: "Question concernant la récitation du Coran sur les tombes dans le but de poser des questions, et concernant le fait de marcher avec des chaussures ou de s'asseoir sur les tombes. Réponse: réciter le Coran dans ce but est incontestablement interdit; marcher avec des chaussures ou s'asseoir sur les tombes est déconseillé, car cela constitue un manque de respect envers les défunts et contrevient à l'interdiction du Prophète."
  tr: "Kur'an'ın mezar üzerinde soru sormak amacıyla okunması, sandaletlerle yürüyüp üzerine oturması hakkındaki kural hakkında bir soru. Cevap: Kur'an'ı bu kötü niyetle okumak tartışmasız yasaktır, sandaletle yürümek ve mezar üzerine oturmak da ölülere hakaret ve Peygamber'in yasağını ihlal ettiği için yasaktır."
  id: "Sebuah pertanyaan tentang aturan tentang membaca Al-Qur'an di atas makam dengan maksud untuk bertanya, serta berjalan dengan sandal dan duduk di atasnya. Jawaban: Membaca Al-Qur'an dengan niat buruk ini dilarang tanpa bantahan, dan berjalan dengan sandal serta duduk di atas kubur dilarang karena menghina orang yang telah meninggal dan melanggar larangan Nabi."
