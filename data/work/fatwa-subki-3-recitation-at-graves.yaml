label: { ar: "قراءة القرآن على المقابر والمشي بالنعال عليها", en: "Fatwa on reciting the Qur'an at graves and walking over them in shoes" }
summary:
  ar: "سؤال عن حكم قراءة القرآن على القبور بقصد السؤال، والمشي بالنعال والجلوس عليها. الجواب: قراءة القرآن بهذا القصد السيئ حرام بلا خلاف، والمشي بالنعال والجلوس على المقابر منهي عنه لما فيه من إهانة الموتى، ومخالفة نهي النبي صلى الله عليه وسلم."
  en: "Question on reciting the Qur'an at graves with the intent of asking, and on walking in shoes or sitting on graves. The answer: reciting with that intent is forbidden without dispute; walking in shoes or sitting on graves is discouraged, since it disrespects the dead and goes against the Prophet's prohibition."
