class: work
kind: fatwa
label: { ar: "قراءة القرآن على المقابر والمشي بالنعال عليها", en: "Fatwa on reciting the Qur'an at graves and walking over them in shoes", ur: "قبروں پر قرآن پڑھنے اور جوتوں میں چلنے پر فتویٰ", es: "Fatwa sobre recitar el Corán en tumbas y caminar sobre ellas con zapatos." }
summary:
  ar: "سؤال عن حكم قراءة القرآن على القبور بقصد السؤال، والمشي بالنعال والجلوس عليها. الجواب: قراءة القرآن بهذا القصد السيئ حرام بلا خلاف، والمشي بالنعال والجلوس على المقابر منهي عنه لما فيه من إهانة الموتى، ومخالفة نهي النبي."
  en: "Question on reciting the Qur'an at graves with the intent of asking, and on walking in shoes or sitting on graves. The answer: reciting with that intent is forbidden without dispute; walking in shoes or sitting on graves is discouraged, since it disrespects the dead and goes against the Prophet's prohibition."
  ur: "سوال: قبروں پر سوال کی نیت سے قرآن پڑھنے، اور جوتے پہنے چلنے یا قبروں پر بیٹھنے کا حکم۔ جواب: اس برے قصد سے قرآن پڑھنا بلا خلاف حرام ہے؛ قبروں پر جوتوں میں چلنا اور بیٹھنا ممنوع ہے کیونکہ اس میں مردوں کی توہین اور نبی کی ممانعت کی مخالفت ہے۔"
  es: "Pregunta sobre recitar el Corán en tumbas con la intención de pedir, y sobre caminar con zapatos o sentarse en tumbas. La respuesta: recitar con esa intención está prohibido sin lugar a dudas; caminar con zapatos o sentarse en tumbas es desaconsejable, ya que es una falta de respeto a los difuntos y contraviene la prohibición del Profeta."
