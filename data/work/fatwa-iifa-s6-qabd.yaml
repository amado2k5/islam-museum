label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن القبض صوره وأحكامها", en: "IIFA resolution on possession (qabd): its forms, especially the new ones, and rulings", ur: "اکیڈمی کی قرارداد: قبض ⁦(تصرف)⁩ کی صورتیں اور احکام", es: "Resolución de la IIFA sobre posesión (qabd): sus formas, especialmente las nuevas, y resoluciones." }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: قبض الأموال يكون حسِّيًّا بالأخذ باليد أو الكيل أو الوزن أو النقل إلى حوزة القابض ويتحقق اعتبارًا وحكمًا بالتخلية مع التمكين من التصرف ولو لم يوجد حسًّا، وتختلف كيفيته بحسب حال الأشياء والأعراف، وبيّن صوره المستجدة وأحكامها على ما فصّل."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990) on qabd (possession): it is physical by hand-taking, measure, weight or transfer into the taker's hold, and is realised legally by clearance with enablement of disposal even without physical taking; its mode differs with the thing and custom, and the resolution sets out its newly arising forms and rulings."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩ قبض پر: قبضہ حسّی بھی ہوتا ہے اور حکمی بھی — تصرف ممکن ہو تو بلا حسّی قبض قبض شمار ہوتا ہے؛ جدید صورتیں بیان ہوئیں۔"
  es: "Resolución de la sexta sesión de la IIFA (Jeddah, marzo de 1990) sobre qabd (posesión): es física, mediante la toma manual, la medición, el peso o la transferencia al poder del tomador, y se realiza legalmente mediante la autorización que permite la disposición incluso sin toma física; su modo difiere según la cosa y la costumbre, y la resolución establece sus nuevas formas y normas."
