label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن القبض صوره وأحكامها", en: "IIFA resolution on possession (qabd): its forms, especially the new ones, and rulings", ur: "اکیڈمی کی قرارداد: قبض ⁦(تصرف)⁩ کی صورتیں اور احکام", es: "Resolución de la IIFA sobre posesión (qabd): sus formas, especialmente las nuevas, y resoluciones.", fr: "Résolution de l'IIFA sur la possession (qabd): ses formes, notamment les nouvelles, et les décisions", tr: "Uluslararası İslami Fiqh Akademisi'nin tutuklama ve kararlarıyla ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional terkait penangkapan dan putusannya" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: قبض الأموال يكون حسِّيًّا بالأخذ باليد أو الكيل أو الوزن أو النقل إلى حوزة القابض ويتحقق اعتبارًا وحكمًا بالتخلية مع التمكين من التصرف ولو لم يوجد حسًّا، وتختلف كيفيته بحسب حال الأشياء والأعراف، وبيّن صوره المستجدة وأحكامها على ما فصّل."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990) on qabd (possession): it is physical by hand-taking, measure, weight or transfer into the taker's hold, and is realised legally by clearance with enablement of disposal even without physical taking; its mode differs with the thing and custom, and the resolution sets out its newly arising forms and rulings."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩ قبض پر: قبضہ حسّی بھی ہوتا ہے اور حکمی بھی — تصرف ممکن ہو تو بلا حسّی قبض قبض شمار ہوتا ہے؛ جدید صورتیں بیان ہوئیں۔"
  es: "Resolución de la sexta sesión de la IIFA (Jeddah, marzo de 1990) sobre qabd (posesión): es física, mediante la toma manual, la medición, el peso o la transferencia al poder del tomador, y se realiza legalmente mediante la autorización que permite la disposición incluso sin toma física; su modo difiere según la cosa y la costumbre, y la resolución establece sus nuevas formas y normas."
  fr: "Résolution de la sixième session de l'IIFA (Djeddah, mars 1990) sur le qabd (possession): il est physique par prise en main, mesure, poids ou transfert dans la main du preneur, et est réalisé légalement par autorisation avec possibilité de disposition même sans prise physique; son mode diffère selon la chose et la coutume, et la résolution expose ses nouvelles formes et décisions."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin altıncı oturumunda (Cidde, Mart 1990) kararı: Fonların alınması, el alınması, ölçülmesi, tartılması veya sahibinin mülkiyetine devredilmesi yoluyla fiziksel olarak gerçekleşir ve tahliye kararı ile gerçekleşir; duyusal bir his olmasa bile elden çıkarılma imkanı vardır. Yöntemi, durum ve geleneklere bağlı olarak, ayrıca detaylandırıldığı gibi yeni biçimler ve kararlar arasında değişiklik gösterir."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi keenamnya (Jeddah, Maret 1990): Penerimaan dana bersifat fisik dengan mengambil tangan, mengukur, menimbang, atau menyerahkannya ke pemegang, dan diwujudkan melalui pertimbangan serta keputusan pengusiran dengan kemungkinan untuk mengalihkan meskipun tidak ada perasaan sensorik. Caranya bervariasi sesuai dengan keadaan dan adat, serta antara bentuk dan putusan baru yang dijelaskan."
