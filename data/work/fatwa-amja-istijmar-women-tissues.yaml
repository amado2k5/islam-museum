id: work/fatwa-amja-istijmar-women-tissues
class: work
kind: fatwa
label: { ar: "استجمار المرأة", en: "A woman's istijmar — tissues suffice", ur: "عورت کا استجمار — ٹیشو کافی", es: "El istijmar de una mujer: bastan pañuelos de papel.", fr: "L'istijmar d'une femme — des mouchoirs suffisent" }
summary:
  ar: "سألت امرأة هل يختلف استجمارها عن استجمار الرجل وهل تجزئ المناديل المبللة عن الماء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84295 بتاريخ 26 أبريل 2011)⁩ أن النساء شقيقات الرجال أي مثيلاتهن في الأحكام فإذا كان المقصود باستجمار المرأة استعمالها للحجارة والمناديل بعد قضاء الحاجة فهو جائز لا حرج فيه ولو مع وجود الماء والمرأة والرجل في هذا سواء بالإجماع، ولا حرج في استعمال المناديل الورقية بدلًا من الأحجار لأن الورق لليونته أكثر تنقية على ما فصّل الجواب."
  en: "A woman asked whether her istijmar differs from a man's and whether wet tissues serve for water. Dr. Salah al-Sawi (fatwa no. 84295, 26 April 2011) answered that women are men's co-sharers — their like in rulings; if a woman's istijmar means using stones or tissues after relieving herself it is lawful without objection even where water is present, woman and man equal in this by consensus; and paper tissues may replace stones, paper being more cleansing for its softness — as the answer details."
  ur: "ایک خاتون نے اپنے استجمار کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84295، 26 اپریل 2011)⁩ کے مطابق عورت مرد برابر ہے — ٹیشو کافی ہیں اور اجماع سے جائز۔"
  es: "Una mujer preguntó si su istijmar difiere del de un hombre y si los pañuelos húmedos sirven como sustituto del agua. El Dr. Salah al-Sawi (fatwa n.° 84295, 26 de abril de 2011) respondió que las mujeres son copartícipes de los hombres en cuanto a las normas; si el istijmar de una mujer implica el uso de piedras o pañuelos después de hacer sus necesidades, es lícito sin objeción, incluso cuando hay agua presente, pues hombres y mujeres son iguales en esto por consenso; y los pañuelos de papel pueden reemplazar a las piedras, ya que el papel es más limpio por su suavidad, como se detalla en la respuesta."
  fr: "Une femme a demandé si son istijmar diffère de celui d'un homme et si les mouchoirs humides peuvent remplacer l'eau. Le Dr Salah al-Sawi (fatwa n° 84295, 26 avril 2011) a répondu que les femmes sont égales aux hommes en matière de règles; si l'istijmar d'une femme consiste à utiliser des pierres ou des mouchoirs après avoir fait ses besoins, cela est licite sans objection, même en présence d'eau, la femme et l'homme étant égaux sur ce point par consensus; et les mouchoirs en papier peuvent remplacer les pierres, le papier étant plus nettoyant de par sa douceur – comme le précise la réponse."
