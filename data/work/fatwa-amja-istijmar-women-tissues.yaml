id: work/fatwa-amja-istijmar-women-tissues
class: work
kind: fatwa
label: { ar: "استجمار المرأة", en: "A woman's istijmar — tissues suffice", ur: "عورت کا استجمار — ٹیشو کافی" }
summary:
  ar: "سألت امرأة هل يختلف استجمارها عن استجمار الرجل وهل تجزئ المناديل المبللة عن الماء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84295 بتاريخ 26 أبريل 2011)⁩ أن النساء شقيقات الرجال أي مثيلاتهن في الأحكام فإذا كان المقصود باستجمار المرأة استعمالها للحجارة والمناديل بعد قضاء الحاجة فهو جائز لا حرج فيه ولو مع وجود الماء والمرأة والرجل في هذا سواء بالإجماع، ولا حرج في استعمال المناديل الورقية بدلًا من الأحجار لأن الورق لليونته أكثر تنقية على ما فصّل الجواب."
  en: "A woman asked whether her istijmar differs from a man's and whether wet tissues serve for water. Dr. Salah al-Sawi (fatwa no. 84295, 26 April 2011) answered that women are men's co-sharers — their like in rulings; if a woman's istijmar means using stones or tissues after relieving herself it is lawful without objection even where water is present, woman and man equal in this by consensus; and paper tissues may replace stones, paper being more cleansing for its softness — as the answer details."
  ur: "ایک خاتون نے اپنے استجمار کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84295، 26 اپریل 2011)⁩ کے مطابق عورت مرد برابر ہے — ٹیشو کافی ہیں اور اجماع سے جائز۔"
