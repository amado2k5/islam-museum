label:
  ar: "بدائع الصنائع في ترتيب الشرائع"
  en: "Bada'i' al-Sana'i' fi Tartib al-Shara'i'"
  ur: "بدائع الصنائع فی ترتیب الشرائع"
summary:
  ar: "كتاب في الفقه الحنفي لعلاء الدين أبي بكر بن مسعود الكاساني (ت 587هـ)، يقول في مقدمته إنه جمع فيه جملاً من الفقه «مرتبة بالترتيب الصناعي» مع الدلائل، مقتدياً بأستاذه علاء الدين السمرقندي، وسمّاه بدائع الصنائع في ترتيب الشرائع. ويرى محققاه أنه قام على «تحفة الفقهاء» للسمرقندي يحافظ على ألفاظها بترتيب جديد، وأن الصلة بين الكتابين صارت مثلاً: «شرح تحفته وتزوج ابنته». {cite:badai-sanai-ilmiyya-v1 p.77} {cite:badai-sanai-ilmiyya-v1 p.78} {cite:badai-sanai-ilmiyya-v1 p.88} {cite:badai-sanai-ilmiyya-v1 p.89}"
  en: "A Hanafi law book by Ala' al-Din Abu Bakr ibn Mas'ud al-Kasani (d. 587 AH). In its preface he says he gathered in it the body of law 'arranged in a systematic order' with the evidence, following his teacher Ala' al-Din al-Samarqandi, and named it Bada'i' al-Sana'i' fi Tartib al-Shara'i'. Its editors hold that it is built on al-Samarqandi's Tuhfat al-Fuqaha', keeping its wording in a new order, and that the link between the two books became proverbial: 'he explained his Tuhfa and married his daughter'."
  ur: "علاء الدین ابو بکر بن مسعود کاسانی (وفات 587ھ) کی حنفی فقہ کی کتاب۔ مقدمے میں وہ کہتے ہیں کہ انہوں نے اس میں فقہ کے مسائل «صنعتی ترتیب» سے دلائل کے ساتھ جمع کیے، اپنے استاد علاء الدین سمرقندی کی پیروی میں، اور اس کا نام بدائع الصنائع فی ترتیب الشرائع رکھا۔ اس کے محققین کے نزدیک یہ سمرقندی کی «تحفۃ الفقہاء» پر قائم ہے، اس کے الفاظ کو نئی ترتیب میں محفوظ رکھتے ہوئے، اور دونوں کتابوں کا تعلق ضرب المثل بن گیا: «اس نے ان کی تحفہ کی شرح کی اور ان کی بیٹی سے شادی کی»۔"
