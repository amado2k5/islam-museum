id: work/fatwa-amja-muslim-suicide-not-kafir
class: work
kind: fatwa
label: { ar: "حكم المنتحر المسلم", en: "The Muslim who takes his own life", ur: "خودکشی کرنے والا مسلمان", es: "El musulmán que se quita la vida" }
summary:
  ar: "سأل سائل هل المنتحر المسلم مساو للكافر في العقوبة فيخلد في النار ولا يخرج منها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80094 بتاريخ 30 سبتمبر 2009)⁩ أن الانتحار من أكبر الكبائر وقد وردت في الوعيد عليه نصوص شديدة منها ما في مسلم أن من قتل نفسه بحديدة جأ بها في بطنه في نار جهنم خالدًا مخلدًا فيها أبدًا، وأن الله قال عن الجريح الذي حز يده بادرتك عبده بنفسه فحرمت عليه الجنة، لكن على هذا فالانتحار ليس كفرًا مخرجًا من الملة بل هو من كبائر الذنوب التي تكون في مشيئة الله يوم القيامة إن شاء غفرها وإن شاء عذب بها، وذكر قصة الطفيل بن عمرو الدوسي الذي رأى في المنام مغطيًا يديه فدعا له النبي بالمغفرة."
  en: "A questioner asked whether a Muslim suicide equals the disbeliever in punishment — eternal fire with no exit. Dr. Salah al-Sawi (fatwa no. 80094, 30 September 2009) answered that suicide is among the gravest major sins, with severe warnings — Muslim's report that whoever kills himself with an iron will pierce his belly with it in hellfire forever, and God's word about the wounded man who slit his hand, 'My servant hastened to Me with his soul; I have forbidden him Paradise'; yet suicide is not disbelief expelling from the community — it is among the major sins within God's will on Judgment Day, forgiven if He wills or punished if He wills — and he told of al-Tufayl ibn Amr al-Dawsi dreaming of one covering his hands, for whom the Prophet prayed forgiveness. Recorded as AMJA's answer."
  ur: "ایک سائل نے پوچھا کہ خودکشی کرنے والا مسلمان کافر کے برابر عذاب پائے گا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80094، 30 ستمبر 2009)⁩ کے مطابق خودکشی بڑا گناہ ہے اور سخت وعید آئے ہیں مگر یہ کفر نہیں — معاملہ اللہ کی مشیت پر ہے۔"
  es: "Un interlocutor preguntó si el suicidio de un musulmán equivale al castigo de un incrédulo: fuego eterno sin salida. El Dr. Salah al-Sawi (fatwa n.º 80094, 30 de septiembre de 2009) respondió que el suicidio se encuentra entre los pecados mayores más graves, con severas advertencias: el relato de Muslim dice que quien se suicida con una vara de hierro se la clavará en el vientre para siempre en el fuego del infierno, y la palabra de Dios sobre el hombre herido que se cortó la mano: «Mi siervo se apresuró a Mí con su alma; le he negado el Paraíso». Sin embargo, el suicidio no es incredulidad que expulse de la comunidad; se encuentra entre los pecados mayores que Dios considera el Día del Juicio, perdonado si Él quiere o castigado si Él quiere. También contó que al-Tufayl ibn Amr al-Dawsi soñó con alguien que le cubría las manos, por quien el Profeta oró pidiendo perdón. Registrado como respuesta de AMJA."
