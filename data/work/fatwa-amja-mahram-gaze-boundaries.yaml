id: work/fatwa-amja-mahram-gaze-boundaries
class: work
kind: fatwa
label: { ar: "النظر إلى المحارم", en: "Looking at one's mahram women", ur: "محرم عورتوں کو دیکھنا", es: "Mirando a las mujeres mahram de uno" }
summary:
  ar: "سأل سائل أن الشريعة أجازت للرجل أن ينظر إلى محارمه حيث لا يحرم عليه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77406 بتاريخ 11 يناير 2009)⁩ أن للرجل أن ينظر من محارمه ما يظهر منهن عادة وهن في ثياب مهنتهن كالشعر والنحر والصدر وجزء من الساق وجزء من الذراع ونحوه مما تقتضيه الخلطة في غير كلفة ولا مشقة وفي غير ريبة."
  en: "A questioner noted that the sharia permits a man to look at his mahram women where it is not forbidden him. Dr. Salah al-Sawi (fatwa no. 77406, 11 January 2009) answered that a man may look at what customarily appears of his mahrams in their working clothes — the hair, the neck, the chest, part of the leg and part of the arm and the like, as the household's mixing requires, without strain or hardship and without suspicion."
  ur: "ایک سائل نے محرم عورتوں کو دیکھنے کی حدود پوچھیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77406، 11 جنوری 2009)⁩ کے مطابق جو حصے روزمرہ کے کپڑوں میں ظاہر رہتے ہیں — بال گردن سینہ ٹانگ بازو — ان کو دیکھنا جائز ہے بشرط ریب نہ ہو۔"
  es: "Un interlocutor señaló que la sharia permite que un hombre mire a sus mujeres mahram cuando no le está prohibido. El Dr. Salah al-Sawi (fatwa n.º 77406, 11 de enero de 2009) respondió que un hombre puede mirar lo que habitualmente se ve de sus mahrams con su ropa de trabajo: el cabello, el cuello, el pecho, parte de la pierna, parte del brazo, etc., según lo requiera la convivencia familiar, sin reparos ni dificultades y sin sospechas."
