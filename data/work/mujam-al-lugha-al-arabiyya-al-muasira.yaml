summary:
  ar: "معجم اللغة العربية المعاصرة لأحمد مختار عمر، في أربعة أجزاء؛ وتُسجَّل طبعة عالم الكتب سنة ١٤٢٩هـ، ٢٠٠٨م في ٣٣٦٧ صفحة. وهو معجم للعربية المعاصرة، وحقوق طبعته محفوظة ولذلك يوصف هنا ويُشار إليه فقط."
  en: "Mu'jam al-lugha al-arabiyya al-mu'asira by Ahmad Mukhtar Umar, the Dictionary of the Contemporary Arabic Language, in four volumes; the Alam al-Kutub edition of 1429 AH / 2008 is recorded with 3,367 pages. Its edition's rights are not shown as free, so it is described and linked here only."
  es: "El Mu'jam al-lugha al-arabiyya al-mu'asira de Ahmad Mukhtar Umar, el Diccionario de la Lengua Árabe Contemporánea, en cuatro volúmenes; la edición de Alam al-Kutub de 1429 AH / 2008 consta con 3367 páginas. Su edición no figura como libre de derechos, por lo que aquí solo se describe y se enlaza."
  fr: "Le Mu'jam al-lugha al-arabiyya al-mu'asira d'Ahmad Mukhtar Umar, le Dictionnaire de la langue arabe contemporaine, en quatre volumes ; l'édition d'Alam al-Kutub de 1429 AH / 2008 est enregistrée avec 3 367 pages. Son édition n'est pas indiquée comme libre de droits ; il n'est ici que décrit et signalé."
  ur: "احمد مختار عمر کی معجم اللغۃ العربیۃ المعاصرۃ، عربی معاصر کی لغت، چار جلدوں میں؛ عالم الکتب کا 1429ھ / 2008ء کا ایڈیشن 3,367 صفحات کے ساتھ درج ہے۔ اس کی اشاعت آزاد حقوق والی درج نہیں، اس لیے یہاں صرف اس کا بیان اور حوالہ ہے۔"
  tr: "Ahmed Mukhtar Omar tarafından yazılmış Çağdaş Arap Dil Sözlüğü, dört cilt; Alam Al-Kutub'un baskısı 1429 H., 2008 yılında 3.367 sayfa ile kaydedilmiştir. Bu, çağdaş Arapça sözlüğüdür ve baskısının telif hakkı saklıdır, bu nedenle burada tanımlanmış ve sadece referans verilmiştir."
  id: "Kamus Bahasa Arab Kontemporer oleh Ahmed Mukhtar Omar, dalam empat jilid; edisi Alam Al-Kutub tercatat pada tahun 1429 H, 2008 M, dengan 3.367 halaman. Ini adalah kamus bahasa Arab kontemporer, dan hak cipta edisinya dilindungi, sehingga hanya dijelaskan di sini dan dirujuk."
