summary:
  ar: "المقدمة الجزرية في التجويد لشمس الدين ابن الجزري ⁦(ت. 833هـ)⁩ في نحو سبعة أبيات ومائة على بحر الرجز، سميت الموقِّدة؛ تجمع مخارج الحروف وصفاتها والتلاوة وأحكام الرسم وهي متن المتقنين في علم التجويد {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  en: "Al-Muqaddima al-Jazariyya in tajwid by Shams al-Din Ibn al-Jazari (d. 833 AH) — about a hundred and seven rajaz lines, called 'al-Muwqidda'; it gathers the articulation points and qualities of the letters, the recitation rulings and the rasm, the standard text for the masters of tajwid {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  es: "Al-Muqaddima al-Jazariyya en tajwid por Shams al-Din Ibn al-Jazari (m. 833 AH) — aproximadamente ciento siete líneas rajaz, llamadas 'al-Muwqidda'; reúne los puntos de articulación y las cualidades de las letras, las reglas de recitación y el rasm, el texto estándar para los maestros de tajwid {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  fr: "Al-Muqaddima al-Jazariyya en tajwid par Shams al-Din Ibn al-Jazari (d. 833 AH) — environ cent sept lignes rajaz, appelées 'al-Muwqidda'; il rassemble les points d'articulation et les qualités des lettres, les règles de récitation et le rasm, le texte standard pour les maîtres du tajwid {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  ur: "المقدمہ الجزائریہ تجوید میں شمس الدین ابن الجزاری ⁦(متوفی 833ھ)⁩ - تقریباً ایک سو سات رجز لائنیں، جنہیں 'المقدمہ' کہا جاتا ہے۔ اس میں حروف کے نکات اور خصوصیات، قراءت کے احکام اور رسم کو جمع کیا جاتا ہے، تجوید کے ماہرین کے لیے معیاری متن"
  tr: "Şemseddin İbn el-Cezeri'nin Tacvide Girişi (ö. 833 H) yaklaşık yedi ayetten oluşur ve recaz ölçüsünde yüz ayetten oluşur. Adı El-Mukadde; harflerin artikülasyon noktalarını, niteliklerini, okunuşunu ve yazı kurallarını toplar. Tachvit biliminde uzmanların metnidir {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  id: "Pengantar Tajweed karya Al-Jazariyyah oleh Shams al-Din Ibn al-Jazari (wafat 833 H) terdiri dari sekitar tujuh ayat dan seratus dalam meter rajaz. Buku ini disebut Al-Muqaddah; buku ini mengumpulkan titik-titik artikulasi huruf, sifatnya, pembacaan, dan aturan aksara. Ini adalah teks para ahli ilmu Tajweed {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
