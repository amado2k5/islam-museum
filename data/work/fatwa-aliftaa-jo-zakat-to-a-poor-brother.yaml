id: work/fatwa-aliftaa-jo-zakat-to-a-poor-brother
class: work
kind: fatwa
label: { ar: "دفع الزكاة وصدقة الفطر إلى الأخ الفقير", en: "Giving zakat and zakat al-fitr to a poor brother", ur: "غریب بھائی کو زکوٰۃ اور صدقۂ فطر دینا" }
summary:
  ar: "سؤال عن دفع الزكاة وصدقة الفطر إلى الأخ الفقير، أجابت فيه دائرة الإفتاء العام الأردنية بأنه جائز لأن الأخ الفقير من الأصناف التي تعطى من الزكاة. أجابت الدائرة بأنه يجوز دفع الزكاة وصدقة الفطر إلى الأخ الفقير. وعللت ذلك بأنه من الأصناف التي تعطى من الزكاة."
  en: "A question about giving zakat and zakat al-fitr to a poor brother, in which Jordan's General Iftaa Department answered that it is permitted because a poor brother is among those eligible to receive zakat. The Department answered that zakat and zakat al-fitr may be given to a poor brother. It explained that he belongs to the categories of people who may receive zakat."
  ur: "غریب بھائی کو زکوٰۃ اور صدقۂ فطر دینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ جائز ہے کیونکہ غریب بھائی زکوٰۃ کے مستحق طبقات میں شامل ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ غریب بھائی کو زکوٰۃ اور صدقۂ فطر دینا جائز ہے۔ اس نے وجہ یہ بتائی کہ وہ ان طبقات میں شامل ہے جنہیں زکوٰۃ دی جاتی ہے۔"
