id: work/fatwa-aliftaa-jo-zakat-to-a-poor-brother
class: work
kind: fatwa
label: { ar: "دفع الزكاة وصدقة الفطر إلى الأخ الفقير", en: "Giving zakat and zakat al-fitr to a poor brother", ur: "غریب بھائی کو زکوٰۃ اور صدقۂ فطر دینا", es: "Dar zakat y zakat al-fitr a un hermano pobre", fr: "Donner la zakat et la zakat al-fitr à un frère pauvre" }
summary:
  ar: "سؤال عن دفع الزكاة وصدقة الفطر إلى الأخ الفقير، أجابت فيه دائرة الإفتاء العام الأردنية بأنه جائز لأن الأخ الفقير من الأصناف التي تعطى من الزكاة. أجابت الدائرة بأنه يجوز دفع الزكاة وصدقة الفطر إلى الأخ الفقير. وعللت ذلك بأنه من الأصناف التي تعطى من الزكاة."
  en: "A question about giving zakat and zakat al-fitr to a poor brother, in which Jordan's General Iftaa Department answered that it is permitted because a poor brother is among those eligible to receive zakat. The Department answered that zakat and zakat al-fitr may be given to a poor brother. It explained that he belongs to the categories of people who may receive zakat."
  ur: "غریب بھائی کو زکوٰۃ اور صدقۂ فطر دینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ جائز ہے کیونکہ غریب بھائی زکوٰۃ کے مستحق طبقات میں شامل ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ غریب بھائی کو زکوٰۃ اور صدقۂ فطر دینا جائز ہے۔ اس نے وجہ یہ بتائی کہ وہ ان طبقات میں شامل ہے جنہیں زکوٰۃ دی جاتی ہے۔"
  es: "Una pregunta sobre la entrega de zakat y zakat al-fitr a un hermano pobre, a la que el Departamento General de Iftaa de Jordania respondió que está permitido, ya que un hermano pobre se encuentra entre las personas que pueden recibir zakat. El Departamento explicó que se puede entregar zakat y zakat al-fitr a un hermano pobre, dado que pertenece a las categorías de personas que pueden recibir zakat."
  fr: "Une question concernant le versement de la zakat et de la zakat al-fitr à un frère pauvre a été posée. Le Département général de la Iftaa de Jordanie a répondu que cela est permis, car un frère pauvre figure parmi les personnes éligibles à la zakat. Le Département a précisé que la zakat et la zakat al-fitr peuvent être versées à un frère pauvre, car celui-ci fait partie des catégories de personnes pouvant bénéficier de la zakat."
