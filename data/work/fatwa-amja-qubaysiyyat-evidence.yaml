summary:
  ar: "علق سائل على حكم أصدره الشيخ حول جماعة القبيسيات مدعيًا أن ما ذكر من أقوال الأحباش. أجاب د. حاتم الحاج ⁦(فتوى رقم 21832 بتاريخ 26 يونيو 2006)⁩ أن ما ذكر عن القبيسيات ليس مما يشنع عليهن به الأحباش وحدهم وإن كان بين الفرقتين عداوة، وقد جاءت بحقهن فتوى للجنة الدائمة للإفتاء بالسعودية رقم 16011 بتاريخ 18/5/1414هـ لا صلة لهم بالأحباش، وأورد نصها في الجواب."
  en: "A commenter objected to the shaykh's ruling on the Qubaysiyyat, claiming its material came only from the Ahbash. Dr. Hatim al-Hajj (fatwa no. 21832, 26 June 2006) answered that what was said of the Qubaysiyyat is not what the Ahbash alone disparage them with — though enmity exists between the two groups — for the Saudi standing committee for ifta issued fatwa no. 16011 dated 18/5/1414 AH against them, the committee having no link to the Ahbash; the answer reproduces its text. Recorded as AMJA's answer."
  ur: "ایک سائل نے قبیسیات کے فتویٰ پر اعتراض کیا۔ ڈاکٹر حاتم الحاج ⁦(فتویٰ 21832، 26 جون 2006)⁩ کے مطابق سعودی دائمی کمیٹی نے بھی ان کے خلاف فتویٰ 16011 دیا — یہ صرف احباش کا بیانیہ نہیں۔"
