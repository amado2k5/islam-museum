label: { ar: "القبيسيات وفتوى اللجنة الدائمة", en: "The Qubaysiyyat — the standing committee's fatwa on them", ur: "قبیسیات — دائمی کمیٹی کا فتویٰ", es: "El Qubaysiyyat: la fetua del comité permanente sobre ellos", fr: "Les Qubaysiyyat – la fatwa du comité permanent à leur encontre", tr: "El-Kubaysiyat ve Daimi Komite'nin Fetvası", id: "Al-Qubaisiyat dan Fatwa Komite Permanen" }
summary:
  ar: "علق سائل على حكم أصدره الشيخ حول جماعة القبيسيات مدعيًا أن ما ذكر من أقوال الأحباش. أجاب د. حاتم الحاج ⁦(فتوى رقم 21832 بتاريخ 26 يونيو 2006)⁩ أن ما ذكر عن القبيسيات ليس مما يشنع عليهن به الأحباش وحدهم وإن كان بين الفرقتين عداوة، وقد جاءت بحقهن فتوى للجنة الدائمة للإفتاء بالسعودية رقم 16011 بتاريخ 18/5/1414هـ لا صلة لهم بالأحباش، وأورد نصها في الجواب."
  en: "A commenter objected to the shaykh's ruling on the Qubaysiyyat, claiming its material came only from the Ahbash. Dr. Hatim al-Hajj (fatwa no. 21832, 26 June 2006) answered that what was said of the Qubaysiyyat is not what the Ahbash alone disparage them with — though enmity exists between the two groups — for the Saudi standing committee for ifta issued fatwa no. 16011 dated 18/5/1414 AH against them, the committee having no link to the Ahbash; the answer reproduces its text. Recorded as AMJA's answer."
  ur: "ایک سائل نے قبیسیات کے فتویٰ پر اعتراض کیا۔ ڈاکٹر حاتم الحاج ⁦(فتویٰ 21832، 26 جون 2006)⁩ کے مطابق سعودی دائمی کمیٹی نے بھی ان کے خلاف فتویٰ 16011 دیا — یہ صرف احباش کا بیانیہ نہیں۔"
  es: "Un comentarista objetó la decisión del jeque sobre los Qubaysiyyat, alegando que su material provenía únicamente de los Ahbash. El Dr. Hatim al-Hajj (fatwa n.° 21832, 26 de junio de 2006) respondió que lo que se dijo de los Qubaysiyyat no es lo que los Ahbash utilizan exclusivamente para denigrarlos —aunque existe enemistad entre ambos grupos—, ya que el Comité Permanente Saudí para la Ifta emitió la fatwa n.° 16011, con fecha del 18/5/1414 AH, en su contra, sin que dicho comité tenga vínculo alguno con los Ahbash; la respuesta reproduce su texto. Registrado como respuesta de AMJA."
  fr: "Un commentateur a contesté l'avis du cheikh concernant les Qubaysiyat, affirmant que les propos tenus à leur sujet provenaient uniquement des Ahbash. Le Dr Hatim al-Hajj (fatwa n° 21832, 26 juin 2006) a répondu que les propos tenus à l'encontre des Qubaysiyat ne se limitent pas aux seuls propos dénigrants des Ahbash – bien qu'une inimitié existe entre les deux groupes – car le Comité permanent saoudien pour la fatwa a émis la fatwa n° 16011, datée du 18 mai 1414 AH, à leur encontre, ce comité n'ayant aucun lien avec les Ahbash; la réponse reproduit le texte de cette fatwa. Référence: réponse de l'AMJA."
  tr: "Bir soru soran kişi, Şeyh'in El-Kubaysiya grubuyla ilgili çıkardığı bir karara yorum yaparak bahsedilenlerin Habeşlilerin ifadelerinden alındığını iddia etti. Dr. Hatim El-Hac (26 Haziran 2006 tarihli 21832 sayılı Fetva) Qubaysiyat hakkında bahsedilenlerin yalnızca Habeşlilerin onları küçümseyeceği bir şey olmadığını, iki mezhep arasında düşmanlık olsa bile, yanıt verdi. Suudi Arabistan Fetva Daimi Komitesi No. 16011 tarafından 18/5/1414 Hicri tarihli ve Habeşlilerle bağlantısı olmayan bir fetva çıkarılmış ve metni yanıta dahil edilmiştir."
  id: "Seorang penanya mengomentari putusan yang dikeluarkan oleh Sheikh mengenai kelompok Al-Qubaisiyat, mengklaim bahwa apa yang disebutkan dari pernyataan orang Abyssinia. Dr. Hatim Al-Hajj menjawab (Fatwa No. 21832 tanggal 26 Juni 2006) bahwa apa yang disebutkan tentang Qubaisiyat bukanlah sesuatu yang hanya akan direndahkan oleh orang Abyssinia, meskipun ada permusuhan antara kedua sekte. Sebuah fatwa dikeluarkan terhadap mereka oleh Komite Tetap untuk Fatwa di Arab Saudi No. 16011 tertanggal 18/5/1414 H, yang tidak ada hubungannya dengan orang Abyssinia, dan teksnya dimasukkan dalam tanggapan."
