summary:
  ar: "سائل سأل عن شراء شقة بنظام الفائدة المتناقصة مع منع المشتري من التصرف فيها حتى سداد باقي ثمنها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20903)⁩ أن ذلك جائز على ما فصّل الجواب من ضوابطه."
  en: "A questioner asked about buying a flat under a declining-interest system while the buyer is barred from disposing of it until the price is paid. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20903) answered that this is permissible — under the controls the answer sets out."
  ur: "ایک سائل نے گھٹتی سود کے نظام سے فلیٹ خریدنے کا حکم پوچھا جس میں قیمت ادا ہونے تک تصرف ممنوع ہو۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20903)⁩ نے جواب دیا کہ یہ جائز ہے — جواب کے ضوابط کے ساتھ۔"
