summary:
  ar: "يفرّق المؤلف بين «الملة»: الدين كما أنزله الله، و«النحلة»: ما ادّعاه الناس لأنفسهم من آراء ومذاهب وقراءات شخصية للنصوص، ثم يتتبّع هذا التمييز في الأديان الثلاثة بمنهج تاريخي مقارن؛ للدكتور حمدي عبد العال، صدر عن دار القلم بالكويت سنة 1989."
  en: "al-Milla wa-al-Nihla fi al-Yahudiyya wa-al-Masihiyya wa-al-Islam (Milla and Nihla in Judaism, Christianity and Islam) — a book by Dr. Hamdy Abdel Aal, published by Dar al-Qalam, Kuwait, in 1989."
  es: "al-Milla wa-al-Nihla fi al-Yahudiyya wa-al-Masihiyya wa-al-Islam (Milla y Nihla en el judaísmo, el cristianismo y el islam): libro del Dr. Hamdy Abdel Aal, publicado por Dar al-Qalam, Kuwait, en 1989."
  fr: "al-Milla wa-al-Nihla fi al-Yahudiyya wa-al-Masihiyya wa-al-Islam (Milla et Nihla dans le judaïsme, le christianisme et l'islam) — un livre du Dr Hamdy Abdel Aal, publié par Dar al-Qalam, Koweït, en 1989."
  ur: "الم ملّہ و النحلہ فی الیہودیہ و المسیحیہ و الاسلام ⁦(ملا اور نحلہ یہودیت، عیسائیت اور اسلام میں)⁩ — ڈاکٹر حمدی عبد العل کی ایک کتاب، جسے دار الکلام، کویت نے 1989 میں شائع کیا۔"
  tr: "Yazar, 'din' (Allah tarafından vahyedilmiş din) ile 'el-nahlah' (insanların görüşleri, öğretileri ve kişisel metin okumaları açısından kendileri için iddia ettikleri) arasında ayrım yapar. Daha sonra bu üç din arasındaki ayrımı, Dr. Hamdi Abdel Aal tarafından yazılmış, 1989'da Kuveyt'te Dar Al-Qalam tarafından yayımlanan karşılaştırmalı tarihsel bir metodolojiyle izler."
  id: "Penulis membedakan antara 'agama': agama sebagaimana diwahyukan oleh Allah, dan 'al-nahlah': apa yang diklaim orang untuk diri mereka dalam hal pendapat, doktrin, dan pembacaan pribadi atas teks. Ia kemudian menelusuri perbedaan ini dalam ketiga agama dengan metodologi sejarah komparatif; oleh Dr. Hamdi Abdel Aal, diterbitkan oleh Dar Al-Qalam di Kuwait pada tahun 1989."
