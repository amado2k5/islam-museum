label: { ar: "الأحاديث الكلية", en: "al-Ahadith al-Kulliyya", es: "al-Ahadith al-Kulliyya", fr: "al-Ahadith al-Kulliyya", ur: "الاحادیث الکلیہ", tr: "Genel Konuşmalar", id: "Pembicaraan Umum" }
summary:
  ar: "مجلس أملاه الحافظ أبو عمرو بن الصلاح، جمع فيه الأحاديث الجوامع التي يُقال إن مدار الدين عليها وما كان في معناها من الكلمات الجامعة الوجيزة، فاشتمل على ستة وعشرين حديثاً؛ أخذها النووي وزاد عليها فتمت «الأربعين»."
  en: "A dictation session by the hadith master Abu Amr ibn al-Salah gathering the comprehensive hadiths on which the religion is said to turn — twenty-six in all — which al-Nawawi took and expanded into his 'Arba'un'."
  es: "Una sesión de dictado del maestro de hadices Abu Amr ibn al-Salah que recopila los hadices más completos en los que se dice que se basa la religión —veintiséis en total— que al-Nawawi tomó y amplió en su 'Arba'un'."
  fr: "Une séance de dictée du maître du hadith Abu Amr ibn al-Salah rassemblant les hadiths complets sur lesquels la religion est censée se fonder — vingt-six au total — qu'al-Nawawi a repris et développés dans son 'Arba'un'."
  ur: "حدیث کے ماسٹر ابو عمرو بن الصلاح کی طرف سے ایک ڈکٹیشن سیشن ان جامع احادیث کو اکٹھا کر رہا ہے جن پر مذہب کا رخ کیا جاتا ہے - مجموعی طور پر چھبیس - جسے النووی نے لیا اور اپنے 'اربعون' میں توسیع کی۔"
  tr: "Ezberci Ebu Amr bin Selah tarafından dikte edilen bir oturumda, dinin dayandığı söylenen kapsamlı hadislerin hadislerini ve bunların anlamlarını özlü ve kapsamlı kelimelerle birleştirdi. Yirmi altı hadis içeriyordu; el-Nevavi bunları alıp ekledi ve 'kırkı' tamamladı."
  id: "Sesi yang didikte oleh pengapal Abu Amr ibn al-Salah, di mana ia mengumpulkan hadis komprehensif yang dikatakan menjadi dasar agama tersebut dan maknanya dalam kata-kata yang ringkas dan komprehensif. Sidang tersebut mencakup dua puluh enam hadits; al-Nawawi mengambil dan menambahkannya, melengkapi 'empat puluh.'"
