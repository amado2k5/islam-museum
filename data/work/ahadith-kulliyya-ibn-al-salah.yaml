summary:
  ar: "مجلس أملاه الحافظ أبو عمرو بن الصلاح، جمع فيه الأحاديث الجوامع التي يُقال إن مدار الدين عليها وما كان في معناها من الكلمات الجامعة الوجيزة، فاشتمل على ستة وعشرين حديثاً؛ أخذها النووي وزاد عليها فتمت «الأربعين»."
  en: "A dictation session by the hadith master Abu Amr ibn al-Salah gathering the comprehensive hadiths on which the religion is said to turn — twenty-six in all — which al-Nawawi took and expanded into his 'Arba'un'."
