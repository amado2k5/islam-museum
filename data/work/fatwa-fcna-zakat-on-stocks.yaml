label: { ar: "زكاة الأسهم", en: "Zakat on Stocks", ur: "اسٹاکس پر زکات", es: "Zakat sobre acciones", fr: "Zakat sur les actions" }
summary:
  ar: "صاغه الشيخ عمر Khan وأقره المجلس الفقهي لأمريكا الشمالية. بعد استعراض الزكاة على الثروة ⁦(النقد والذهب والفضة وعروض التجارة)⁩، فصّل الجواب زكاة الأسهم بحسب مقصود اقتنائها — للاستثمار أو للمضاربة — وكيف يحسب الزكوي في كل صورة."
  en: "Drafted by Shaykh Umer Khan and approved by the Fiqh Council of North America. After reviewing zakat on wealth (cash, gold and silver, and trade goods), the answer details zakat on shares according to the holder's purpose — long-term investment or trading — and how the zakatable base is computed in each case."
  ur: "شیخ عمر خان نے تحریر کیا اور فقہ کونسل آف نارتھ امریکہ نے منظور کیا۔ مال پر زکات ⁦(نقد، سونا چاندی اور تجارتی سامان)⁩ کے جائزے کے بعد جواب میں اسٹاکس پر زکات حامل کی نیت کے مطابق — طویل مدتی سرمایہ کاری یا تجارت — اور ہر صورت میں زکات کا حساب تفصیل سے بیان کیا گیا۔"
  es: "Redactado por el jeque Umer Khan y aprobado por el Consejo de Jurisprudencia Islámica de Norteamérica. Tras analizar el zakat sobre la riqueza (efectivo, oro, plata y bienes comerciales), la respuesta detalla el zakat sobre las acciones según la finalidad del titular —inversión a largo plazo o comercio— y cómo se calcula la base imponible del zakat en cada caso."
  fr: "Rédigé par le cheikh Umer Khan et approuvé par le Conseil de jurisprudence islamique d'Amérique du Nord, ce document, après avoir examiné la zakat sur les biens (espèces, or, argent et marchandises), détaille la zakat sur les actions selon la finalité du détenteur (investissement à long terme ou commerce) et explique le calcul de l'assiette imposable dans chaque cas."
