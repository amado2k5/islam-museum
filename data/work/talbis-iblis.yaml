label: { ar: "تلبيس إبليس", en: "Talbis Iblis (The Devil's Delusion)", ur: "تلبیس ابلیس" }
summary:
  ar: "كتاب أبي الفرج عبد الرحمن بن الجوزي البغدادي ⁦(ت 597هـ)⁩ في كشف ما يسميه تلبيس إبليس على الناس، في ثلاثة عشر باباً تبدأ بلزوم السنة والجماعة وذم البدع، ثم تتتبع تلبيسه على أصحاب العقائد والديانات، والعلماء، والولاة، والعباد، والزهاد، والصوفية، وأصحاب ما يشبه الكرامات، والعوام، وعلى الناس جميعاً بطول الأمل؛ وأطول أبوابه باب الصوفية {cite:talbis-iblis-muniriyya-1928 p. 8} {cite:talbis-iblis-muniriyya-1928 p. 9} {cite:talbis-iblis-muniriyya-1928 p. 164} {cite:talbis-iblis-muniriyya-1928 p. 381}."
  en: "Abu al-Faraj 'Abd al-Rahman ibn al-Jawzi al-Baghdadi's (d. 597 AH) book exposing what he calls the devil's deceptions, in thirteen chapters: it opens with holding to the Sunna and the community and the censure of innovation, then follows the devil's deception of the holders of creeds and religions, scholars, rulers, worshippers, ascetics, Sufis, those who claim marvel-like wonders, the common people, and all people through long hope; the chapter on the Sufis is the longest {cite:talbis-iblis-muniriyya-1928 p. 8} {cite:talbis-iblis-muniriyya-1928 p. 9} {cite:talbis-iblis-muniriyya-1928 p. 164} {cite:talbis-iblis-muniriyya-1928 p. 381}."
  ur: "ابو الفرج عبد الرحمن ابن الجوزی بغدادی (م 597ھ) کی کتاب جو اس چیز کو کھولتی ہے جسے وہ لوگوں پر ابلیس کا تلبیس (فریب) کہتے ہیں؛ تیرہ ابواب میں: سنت و جماعت کی پابندی اور بدعت کی مذمت سے آغاز، پھر عقائد و ادیان والوں، علما، حکمرانوں، عابدوں، زاہدوں، صوفیہ، کرامت نما دعوے والوں، عوام، اور لمبی امید کے ذریعے سب لوگوں پر ابلیس کے تلبیس کا تتبع؛ سب سے طویل باب صوفیہ کا ہے {cite:talbis-iblis-muniriyya-1928 p. 8} {cite:talbis-iblis-muniriyya-1928 p. 9} {cite:talbis-iblis-muniriyya-1928 p. 164} {cite:talbis-iblis-muniriyya-1928 p. 381}۔"
