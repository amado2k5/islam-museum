label: { ar: "تلبيس إبليس", en: "Talbis Iblis (The Devil's Delusion)", ur: "تلبیس ابلیس", es: "Talbis Iblis (El engaño del diablo)", fr: "Talbis Iblis (L'illusion du diable)", tr: "Şeytanın Sosu", id: "Perban Iblis" }
summary:
  ar: "كتاب أبي الفرج عبد الرحمن بن الجوزي البغدادي ⁦(ت 597هـ)⁩ في كشف ما يسميه تلبيس إبليس على الناس، في ثلاثة عشر باباً تبدأ بلزوم السنة والجماعة وذم البدع، ثم تتتبع تلبيسه على أصحاب العقائد والديانات، والعلماء، والولاة، والعباد، والزهاد، والصوفية، وأصحاب ما يشبه الكرامات، والعوام، وعلى الناس جميعاً بطول الأمل؛ وأطول أبوابه باب الصوفية {cite:talbis-iblis-muniriyya-1928 p. 8} {cite:talbis-iblis-muniriyya-1928 p. 9} {cite:talbis-iblis-muniriyya-1928 p. 164} {cite:talbis-iblis-muniriyya-1928 p. 381}."
  en: "Abu al-Faraj 'Abd al-Rahman ibn al-Jawzi al-Baghdadi's (d. 597 AH) book exposing what he calls the devil's deceptions, in thirteen chapters: it opens with holding to the Sunna and the community and the censure of innovation, then follows the devil's deception of the holders of creeds and religions, scholars, rulers, worshippers, ascetics, Sufis, those who claim marvel-like wonders, the common people, and all people through long hope; the chapter on the Sufis is the longest {cite:talbis-iblis-muniriyya-1928 p. 8} {cite:talbis-iblis-muniriyya-1928 p. 9} {cite:talbis-iblis-muniriyya-1928 p. 164} {cite:talbis-iblis-muniriyya-1928 p. 381}."
  ur: "ابو الفرج عبد الرحمن ابن الجوزی بغدادی ⁦(م 597ھ)⁩ کی کتاب جو اس چیز کو کھولتی ہے جسے وہ لوگوں پر ابلیس کا تلبیس ⁦(فریب)⁩ کہتے ہیں؛ تیرہ ابواب میں: سنت و جماعت کی پابندی اور بدعت کی مذمت سے آغاز، پھر عقائد و ادیان والوں، علما، حکمرانوں، عابدوں، زاہدوں، صوفیہ، کرامت نما دعوے والوں، عوام، اور لمبی امید کے ذریعے سب لوگوں پر ابلیس کے تلبیس کا تتبع؛ سب سے طویل باب صوفیہ کا ہے {cite:talbis-iblis-muniriyya-1928 p. 8} {cite:talbis-iblis-muniriyya-1928 p. 9} {cite:talbis-iblis-muniriyya-1928 p. 164} {cite:talbis-iblis-muniriyya-1928 p. 381}۔"
  es: "El libro de Abu al-Faraj 'Abd al-Rahman ibn al-Jawzi al-Baghdadi (m. 597 AH) que expone lo que él llama los engaños del diablo, en trece capítulos: comienza con el apego a la Sunna y la comunidad y la censura de la innovación, luego sigue el engaño del diablo a los poseedores de credos y religiones, eruditos, gobernantes, adoradores, ascetas, los sufíes, los que afirman maravillas, la gente común y todas las personas a través de una larga esperanza; el capítulo sobre los sufíes es el más largo {cita:talbis-iblis-muniriyya-1928 p. 8} {citar: talbis-iblis-muniriyya-1928 p. 9} {citar: talbis-iblis-muniriyya-1928 p. 164} {cita: talbis-iblis-muniriyya-1928 p. 381}."
  fr: "Le livre d'Abu al-Faraj 'Abd al-Rahman ibn al-Jawzi al-Baghdadi (mort en 597 AH) expose ce qu'il appelle les tromperies du diable, en treize chapitres: il s'ouvre sur le respect de la Sunna et de la communauté et la censure de l'innovation, puis suit la tromperie du diable sur les détenteurs de croyances et de religions, les érudits, les dirigeants, les fidèles, les ascètes, Les soufis, ceux qui revendiquent des merveilles, les gens ordinaires et tous les peuples dans un long espoir; le chapitre sur les Soufis est le plus long {cite:talbis-iblis-muniriyya-1928 p. 8} {cite:talbis-iblis-muniriyya-1928 p. 9} {cite:talbis-iblis-muniriyya-1928 p. 164} {cite:talbis-iblis-muniriyya-1928 p. 381}."
  tr: "Ebu el-Faraj Abdülrahman bin Cevzi el-Bağdadi'nin (ö. 597 H) kitabı, İblis'in insanlara yönelik aldatmacasını on üç bölümde ortaya koyar; Sünnet'e ve cemaate bağlılıkla başlar ve yenilikleri kınar, ardından onun aldatmacasını inanç ve din takipçilerine, alimlere, yöneticilere, ibadet edenlere, münzevilere, sufilere, mucizeye benzeyenlere, sıradan insanlara ve uzun umut taşıyan tüm insanlara anlatır; en uzun bölümü Sufizm (alıntı:) Talbis-iblis-Muniriyya-1928 s. 8} {cite:Talbis-iblis-muniriyya-1928 s. 9} {cite:talbis-iblis-muniriyya-1928 s. 164} {cite:talbis-iblis-muniriyya-1928 s. 381}."
  id: "Kitab Abu al-Faraj Abd al-Rahman ibn al-Jawzi al-Baghdadi (wafat 597 H) yang mengungkap apa yang ia sebut sebagai penipuan Iblis terhadap manusia, dalam tiga belas bab yang dimulai dengan kepatuhan pada Sunnah dan komunitas serta mengutuk inovasi, kemudian menelusuri penipuannya kepada para pengikut kepercayaan dan agama, ulamawan, penguasa, penyembah, pertapa, Sufi, mereka yang menyerupai mukjizat, rakyat biasa, dan semua orang yang memiliki harapan panjang; bab terpanjangnya adalah bab Sufisme {cite:talbis-iblis-muniriyya-1928 hlm. 8} {cite:talbis-iblis-muniriyya-1928 hlm. 9} {cite:talbis-iblis-muniriyya-1928 hlm. 164} {cite:talbis-iblis-muniriyya-1928 hlm. 381}."
