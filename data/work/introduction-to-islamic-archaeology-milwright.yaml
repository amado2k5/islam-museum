summary:
  ar: "كتاب بالإنجليزية لماركوس ميلرايت يعرّف بعلم الآثار الإسلامي، صدر عن مطبعة جامعة إدنبرة سنة 2009 في سلسلة «مسوح إدنبرة الإسلامية الجديدة»."
  en: "An English introduction to Islamic archaeology by Marcus Milwright, published by Edinburgh University Press in 2009 in the New Edinburgh Islamic Surveys."
  ur: "مارکس مل رائٹ کی انگریزی کتاب جو اسلامی آثارِ قدیمہ کا تعارف ہے؛ ایڈنبرا یونیورسٹی پریس سے 2009ء میں «نیو ایڈنبرا اسلامک سرویز» سلسلے میں شائع ہوئی۔"
  fr: "An Introduction to Islamic Archaeology de Marcus Milwright appartient à la collection New Edinburgh Islamic Surveys. D'après sa table des matières, ses chapitres vont de l'islam primitif et l'Antiquité tardive aux « nouvelles orientations de la période islamique ancienne »."
  es: "An Introduction to Islamic Archaeology, de Marcus Milwright, pertenece a la colección New Edinburgh Islamic Surveys. Según su índice, sus capítulos van del islam temprano y la Antigüedad tardía a las «nuevas direcciones en el período islámico temprano»."
  tr: "An Introduction to Islamic Archaeology, Marcus Milwright'ın New Edinburgh Islamic Surveys dizisinde yer alan kitabıdır. İçindekiler listesine göre bölümleri erken İslam ve Geç Antikçağ'dan “erken İslam döneminde yeni yönelimler”e uzanır."
  id: "An Introduction to Islamic Archaeology karya Marcus Milwright termasuk dalam seri New Edinburgh Islamic Surveys. Menurut daftar isinya, bab-babnya bergerak dari Islam awal dan Antikuitas Akhir hingga “arah baru pada periode Islam awal”."
