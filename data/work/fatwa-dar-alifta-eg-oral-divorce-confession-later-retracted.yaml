label: { ar: "مدى ترتب أثر الطلاق الشفوي حال إقرار الطرفين به من غير تلفظ", en: "The effect of a confessed oral divorce without formal wording", ur: "بولی گئی طلاق کا اثر جب دونوں اقرار کریں" }
summary:
  ar: "سائل سأل عن إقراره في ورقة عرفية أنه طلق زوجته في وقت سابق ثم رجع في إقراره بحجة أنه لم يكن قد طلقها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20679)⁩ ببيان مدى ترتب أثر الطلاق الشفوي حال الإقرار به على وجهه."
  en: "A questioner described confessing in an informal paper that he had divorced his wife earlier, then retracted the confession on the ground that he had not. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20679) answered by setting out how far the effect of a confessed oral divorce stands."
  ur: "ایک سائل نے بیان کیا کہ اس نے غیر رسمی کاغذ میں پہلی طلاق کا اعتراف کیا پھر واپس لے لیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20679)⁩ نے جواب میں زبانی طلاق کے اقرار کا اثر بیان کیا۔"
