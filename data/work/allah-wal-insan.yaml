summary:
  ar: "كتاب مصطفى محمود الصادر في سلسلة «كتب للجميع» في مارس 1957، يقول في مقدمته إن «كل شيء يتغير» حتى المثل العليا، وإنه يحاول أن يناقش «مشاكلنا كلها من جديد» ويطرح التركة الفكرية الموروثة «في غربال واسع الخروق»؛ وهو من كتبه الأولى قبل الرحلة التي رواها في «رحلتي من الشك إلى الإيمان» {cite:mm-allah-wal-insan-1957 p. 1} {cite:mm-allah-wal-insan-1957 p. 7} {cite:mm-allah-wal-insan-1957 p. 9}."
  en: "Mostafa Mahmoud's book issued in the Kutub li-l-Jami' series in March 1957, whose preface says that 'everything changes', even ideals, and that he tries to discuss 'all our problems anew', passing the inherited intellectual legacy 'through a wide-meshed sieve'; one of his early books, before the journey he later narrated in Rihlati min al-Shakk ila al-Iman {cite:mm-allah-wal-insan-1957 p. 1} {cite:mm-allah-wal-insan-1957 p. 7} {cite:mm-allah-wal-insan-1957 p. 9}."
  ur: "مصطفیٰ محمود کی کتاب جو مارچ 1957 میں «کتب للجمیع» سلسلے میں شائع ہوئی، جس کے مقدمے میں ہے کہ «ہر چیز بدلتی ہے»، حتیٰ کہ اعلیٰ اقدار بھی، اور وہ «اپنے تمام مسائل پر نئے سرے سے» بحث اور موروثی فکری ترکے کو «بڑے سوراخوں والی چھلنی» سے گزارنے کی کوشش کرتے ہیں؛ یہ ان کی ابتدائی کتابوں میں سے ہے، اس سفر سے پہلے کی جو انہوں نے «رحلتی من الشک الی الایمان» میں بیان کیا {cite:mm-allah-wal-insan-1957 p. 1} {cite:mm-allah-wal-insan-1957 p. 7} {cite:mm-allah-wal-insan-1957 p. 9}۔"
