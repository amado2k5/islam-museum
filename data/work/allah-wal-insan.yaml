label: { ar: "الله والإنسان", en: "Allah wa-l-Insan", ur: "اللہ والانسان", es: "Allah wa-l-Insan", fr: "Allah wa-l-Insan", tr: "Tanrı ve İnsan", id: "Tuhan dan Manusia" }
summary:
  ar: "كتاب مصطفى محمود الصادر في سلسلة «كتب للجميع» في مارس 1957، يقول في مقدمته إن «كل شيء يتغير» حتى المثل العليا، وإنه يحاول أن يناقش «مشاكلنا كلها من جديد» ويطرح التركة الفكرية الموروثة «في غربال واسع الخروق»؛ وهو من كتبه الأولى قبل الرحلة التي رواها في «رحلتي من الشك إلى الإيمان» {cite:mm-allah-wal-insan-1957 p. 1} {cite:mm-allah-wal-insan-1957 p. 7} {cite:mm-allah-wal-insan-1957 p. 9}."
  en: "Mostafa Mahmoud's book issued in the Kutub li-l-Jami' series in March 1957, whose preface says that 'everything changes', even ideals, and that he tries to discuss 'all our problems anew', passing the inherited intellectual legacy 'through a wide-meshed sieve'; one of his early books, before the journey he later narrated in Rihlati min al-Shakk ila al-Iman {cite:mm-allah-wal-insan-1957 p. 1} {cite:mm-allah-wal-insan-1957 p. 7} {cite:mm-allah-wal-insan-1957 p. 9}."
  ur: "مصطفیٰ محمود کی کتاب جو مارچ 1957 میں «کتب للجمیع» سلسلے میں شائع ہوئی، جس کے مقدمے میں ہے کہ «ہر چیز بدلتی ہے»، حتیٰ کہ اعلیٰ اقدار بھی، اور وہ «اپنے تمام مسائل پر نئے سرے سے» بحث اور موروثی فکری ترکے کو «بڑے سوراخوں والی چھلنی» سے گزارنے کی کوشش کرتے ہیں؛ یہ ان کی ابتدائی کتابوں میں سے ہے، اس سفر سے پہلے کی جو انہوں نے «رحلتی من الشک الی الایمان» میں بیان کیا {cite:mm-allah-wal-insan-1957 p. 1} {cite:mm-allah-wal-insan-1957 p. 7} {cite:mm-allah-wal-insan-1957 p. 9}۔"
  es: "El libro de Mostafa Mahmoud, publicado en la serie Kutub li-l-Jami' en marzo de 1957, cuyo prefacio dice que \"todo cambia\", incluso los ideales, y que intenta discutir \"todos nuestros problemas de nuevo\", pasando el legado intelectual heredado \"a través de un tamiz de malla ancha\"; uno de sus primeros libros, antes del viaje que luego narró en Rihlati min al-Shakk ila al-Iman {cite:mm-allah-wal-insan-1957 p. 1} {cite:mm-allah-wal-insan-1957 p. 7} {cite:mm-allah-wal-insan-1957 p. 9}."
  fr: "Le livre de Mostafa Mahmoud, paru dans la série Kutub li-l-Jami' en mars 1957, dont la préface affirme que « tout change », même les idéaux, et qu'il tente de discuter « tous nos problèmes à nouveau », en passant l'héritage intellectuel hérité « à travers un tamis à larges mailles »; l'un de ses premiers livres, avant le voyage qu'il a narré plus tard dans Rihlati min al-Shakk ila al-Iman {cite:mm-allah-wal-insan-1957 p. 1} {cite:mm-allah-wal-insan-1957 p. 7} {cite:mm-allah-wal-insan-1957 p. 9}."
  tr: "Mustafa Mahmoud'un Mart 1957'de yayımlanan \"Kitaplar Herkes İçin\" serisinde kitabı, girişinde \"her şeyin değiştiğini\" belirtir; idealler bile, \"tüm sorunlarımızı yeniden tartışmaya çalışır\" ve miras kalan entelektüel mirası \"geniş bir elek\" içinde sunar; \"Şüpheden İnanca\" yolculuğumda anlattığı yolculuğun öncesindeki en erken kitaplarından biridir {cite:mm-allah-wal-insan-1957 s. 1} {cite:mm-allah-wal-insan-1957 s. 7} {cite:mm-allah-wal-insan-1957 s. 9}."
  id: "Buku Mustafa Mahmoud, yang diterbitkan dalam seri \"Books for All\" pada Maret 1957, menyatakan dalam pengantarnya bahwa \"segala sesuatu berubah,\" bahkan idealismenya, dan mencoba membahas \"semua masalah kita kembali\" serta menyajikan warisan intelektual yang diwariskan \"dengan saringan luas\"; ini adalah salah satu buku awalnya sebelum perjalanan yang ia narasikan dalam \"My Journey from Doubt to Faith\" {cite:mm-allah-wal-insan-1957 hlm. 1} {cite:mm-allah-wal-insan-1957 hlm. 7} {cite:mm-allah-wal-insan-1957 hlm. 9}."
