id: work/fatwa-amja-fiqh-covers-all-life
class: work
kind: fatwa
label: { ar: "هل يشمل الفقه الإسلامي كل الحياة", en: "Does Islamic fiqh cover all of life", ur: "کیا اسلامی فقہ پوری زندگی کو احاطہ کرتی ہے", es: "¿Abarca el fiqh islámico toda la vida?", fr: "Le fiqh islamique couvre-t-il tous les aspects de la vie ?" }
summary:
  ar: "سأل سائل هل يشمل الفقه الإسلامي كل شيء في الحياة وعن شك أصابه في وجود الله. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78020 بتاريخ 28 فبراير 2009)⁩ أنه لا تقع لأحد من أهل دين الله نازلة إلا وفي القرآن دليل على سبيل الهدى فيها، وكل ما يعرض للمكلف في حياته فلله فيه حكم علمه من علمه وجهله من جهله، واستيعاب الفقه للوقائع يكون بكون الشيء منصوصًا عليه بعينه أو مندرجًا تحت علة عامة أو قاعدة عامة، وأما الشك فإن كان وسوسة عابرة استعاذ بالله ولم يسترسل معها وقال الحمد لله الذي رد كيده إلى الوسوسة، وإن كانت شبهة متوطنة مستقرة بحث عن دوائها عند أهل العلم وحملة الشريعة، ونصحه بالإكثار من الذكر وقراءة القرآن."
  en: "A questioner asked whether Islamic fiqh covers everything in life, and about a doubt that had struck him concerning God's existence. Dr. Salah al-Sawi (fatwa no. 78020, 28 February 2009) answered that nothing befalls one of the people of God's religion but the Quran contains a pointer to the way of guidance in it; whatever a bound person meets in life has a ruling of God in it — known to those who know it, hidden to those who do not — and fiqh covers events either by a text naming the thing or by subsumption under a general cause or rule; as for doubt, a passing whisper is met with seeking refuge and refusal to indulge it — 'praise God who turned his plot into whispering' — while a settled deep doubt is treated at the hands of the people of knowledge and bearers of the sharia, and he advised much remembrance and Quran reading."
  ur: "ایک سائل نے پوچھا کہ فقہ زندگی کے ہر معاملے کو ڈھانپتی ہے اور اسے اللہ کے وجود کا شک آیا تھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78020، 28 فروری 2009)⁩ کے مطابق ہر واقعے کا حکم موجود ہے — نص یا عمومی قاعدہ؛ عارضی وسوسے سے پناہ مانگے اور مستقل شبہ علماء سے علاج مانگے۔"
  es: "Un consultante preguntó si el fiqh islámico abarca todos los aspectos de la vida y sobre una duda que le había surgido respecto a la existencia de Dios. El Dr. Salah al-Sawi (fatwa n.º 78020, 28 de febrero de 2009) respondió que nada le sucede a un seguidor de la religión de Dios sin que el Corán contenga una guía hacia el camino correcto; todo aquello que una persona encuentra en la vida tiene una norma divina —conocida por quienes la conocen, oculta para quienes no— y el fiqh abarca los acontecimientos ya sea mediante un texto que los nombra o por subsumirlos bajo una causa o regla general; en cuanto a la duda, un susurro pasajero se enfrenta buscando refugio y negándose a prestarle atención —«alabado sea Dios que convirtió su plan en un susurro»—, mientras que una duda profunda y establecida es tratada por la gente de conocimiento y los portadores de la sharia, y aconsejó mucha memorización y lectura del Corán."
  fr: "Un homme a demandé si le fiqh islamique couvrait tous les aspects de la vie, et a évoqué un doute qui l'avait saisi concernant l'existence de Dieu. Le Dr Salah al-Sawi (fatwa n° 78020, 28 février 2009) a répondu que rien n'arrive à un croyant sans que le Coran ne contienne une indication sur le chemin de la guidance; tout ce qu'une personne soumise à la religion de Dieu rencontre dans la vie est régi par une règle divine – connue de ceux qui la connaissent, cachée à ceux qui l'ignorent – et le fiqh couvre les événements soit par un texte qui les nomme, soit par leur subordination à une cause ou une règle générale; quant au doute, un murmure passager appelle à la recherche de la protection divine et au refus de s'y attarder – « louez Dieu qui a transformé Son dessein en murmure » – tandis qu'un doute profond et persistant est traité par les savants et les détenteurs de la charia, et il a conseillé de multiplier les invocations et la lecture du Coran."
