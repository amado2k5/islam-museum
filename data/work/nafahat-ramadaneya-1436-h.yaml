kind: lecture-series
label:
  ar: "نفحات رمضانية 1436هـ: آفات اللسان (سلسلة دروس)"
  en: "Nafahat Ramadaniyya 1436 AH: the faults of the tongue (lecture series)"
  ur: "نفحاتِ رمضانیہ ۱۴۳۶ھ: زبان کی آفات (درسی سلسلہ)"
summary:
  ar: "سلسلة رمضانية قصيرة لعمر عبد الكافي في أرشيف أسابيل، في ست حلقات محفوظة، عنوانها عنده «آفات اللسان»: المنّ بالعطاء، والدعاء لغير الله، والدعاء على النفس والأولاد، وسبّ الصحابة، وترك ستر المسلم، ثم علاج آفات اللسان."
  en: "A short Ramadan series by Omar Abdelkafy on the Assabile archive, six surviving episodes that he titles 'the faults of the tongue': reminding people of one's gifts, calling on other than God, praying against oneself and one's children, reviling the Companions, failing to cover a Muslim's fault, and the remedy for the faults of the tongue."
  ur: "اسابیل آرکائیو میں عمر عبد الکافی کا مختصر رمضانی سلسلہ، چھ محفوظ اقساط، جن کا عنوان وہ «زبان کی آفات» رکھتے ہیں: احسان جتانا، غیر اللہ کو پکارنا، اپنے اور اولاد کے خلاف بددعا، صحابہ کو برا کہنا، مسلمان کا عیب نہ چھپانا، اور زبان کی آفات کا علاج۔"
