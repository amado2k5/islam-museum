id: work/fatwa-amja-knowledge-as-creed
class: work
kind: fatwa
label: { ar: "هل المعلومات عقيدة", en: "Is information a creed", ur: "کیا معلومات عقیدہ ہیں", es: "¿Es la información un credo?" }
summary:
  ar: "سأل سائل هل المعلومات تعتبر عقيدة مشيرًا إلى أناس عندهم معلومات كثيرة عن الإسلام. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77891 بتاريخ 19 فبراير 2009)⁩ أن أول الأمر وملاكه وجماعه هو العلم لقوله فاعلم أنه لا إله إلا الله، فالعمل بغير علم لا يكون كما أن العلم بغير عمل جنون، فالعلم بالله وملائكته وكتبه ورسله واليوم الآخر والقدر عقيدة ثم يجب أن تقودك هذه العقيدة إلى العمل وإلا كانت حجة على صاحبها ووبالًا عليه يوم القيامة، ومن المستشرقين من جمع عن الإسلام معلومات كثيرة لكنها لم تقده إلى الإيمان بالله ورسوله فهي حجة عليه في الآخرة، وكان أبو طالب يعلم أن محمدًا على حق وهو القائل ولقد علمت بأن دين محمد من خير أديان البرية دينا."
  en: "A questioner asked whether information counts as creed, noting people with much knowledge about Islam. Dr. Salah al-Sawi (fatwa no. 77891, 19 February 2009) answered that the matter's first, axis and sum is knowledge — 'know that there is no god but God' — for action without knowledge is impossible, as knowledge without action is madness; knowledge of God, His angels, books, messengers, the Last Day and decree is creed — but this creed must then lead you to action, else it is evidence against its holder and ruin on Judgment Day: some orientalists amassed much information on Islam that never led them to faith, so it is evidence against them, and Abu Talib knew Muhammad was on truth, saying 'I have known Muhammad's religion to be the best religion of people'."
  ur: "ایک سائل نے پوچھا کہ معلومات عقیدہ بن جاتی ہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77891، 19 فروری 2009)⁩ کے مطابق اللہ وغیرہ کا علم عقیدہ ہے مگر وہ عمل کی قیادت کرے ورنہ قائل کے خلاف حجت ہے — ابوطالب کی مثال۔"
  es: "Un interlocutor preguntó si la información cuenta como credo, haciendo referencia a personas con mucho conocimiento sobre el Islam. El Dr. Salah al-Sawi (fatwa n.º 77891, 19 de febrero de 2009) respondió que el primer, eje y suma del asunto es el conocimiento: «saber que no hay más dios que Dios», pues la acción sin conocimiento es imposible, así como el conocimiento sin acción es locura; el conocimiento de Dios, Sus ángeles, libros, mensajeros, el Último Día y decreto es credo; pero este credo debe luego conducir a la acción, de lo contrario es evidencia en contra de quien lo profesa y ruina en el Día del Juicio: algunos orientalistas acumularon mucha información sobre el Islam que nunca los llevó a la fe, por lo que es evidencia en su contra, y Abu Talib sabía que Mahoma estaba en la verdad, diciendo: «He conocido la religión de Mahoma como la mejor religión de la humanidad»."
