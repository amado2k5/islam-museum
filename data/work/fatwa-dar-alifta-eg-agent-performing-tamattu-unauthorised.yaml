id: work/fatwa-dar-alifta-eg-agent-performing-tamattu-unauthorised
class: work
kind: fatwa
label: { ar: "حكم هدي التمتع إذا حج الوكيل متمتعًا مخالفًا لما أمر به الموكل", en: "The tamattu' hady when the agent performs tamattu' contrary to instructions", ur: "وکیل کا ہدایت کے خلاف تمتع حج کرنے پر ہدی", es: "El tamattu' hady cuando el agente realiza tamattu' en contra de las instrucciones", fr: "Le tamattu' hady lorsque l'agent accomplit un tamattu' contrairement aux instructions" }
summary:
  ar: "سائل سأل عن شخص وكّل غيره في الحج عن والده المتوفى دون أن يحدد له نوع الإحرام فحج متمتعًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20827)⁩ ببيان حكم هدي التمتع في هذه الصورة على وجهه."
  en: "A questioner asked about one who deputised another to perform Hajj for his deceased father without specifying the kind of ihram, and the agent performed it as tamattu'. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20827) answered by setting out the ruling on the tamattu' hady in this case."
  ur: "ایک سائل نے پوچھا کہ ایک شخص نے اپنے مرحوم والد کے حج کے لیے کسی کو وکیل بنایا بغیر احرام کی قسم بتائے اور اس نے تمتع کیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20827)⁩ نے جواب میں تمتع کی ہدی کا حکم بیان کیا۔"
  es: "Un consultante preguntó sobre una persona que delegó en otra la realización del Hajj por su padre fallecido sin especificar el tipo de ihram, y el agente lo realizó como tamattu'. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20827) respondió exponiendo el dictamen sobre el tamattu' hady en este caso."
  fr: "Un internaute a posé une question concernant une personne ayant mandaté une autre pour accomplir le Hajj à la place de son père défunt, sans préciser le type d'ihram requis, et dont le mandataire a accompli le pèlerinage en état de tamattu'. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20827) a répondu en énonçant la règle relative au tamattu' hady dans ce cas précis."
