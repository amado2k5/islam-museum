id: work/fatwa-dar-alifta-eg-extra-takbirs-eid-prayer
class: work
kind: fatwa
label: { ar: "حكم جهر المأموم بالتكبيرات الزائدة في صلاة العيد", en: "The follower saying the extra takbirs aloud in the Eid prayer", ur: "نمازِ عید میں مقتدی کا اضافی تکبیرات بلند آواز سے کہنا" }
summary:
  ar: "سائل سأل عن جهر المأموم بالتكبيرات الزائدة في صلاة العيد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22535)⁩ أنه يُسن شرعًا الجهر بالتكبيرات الزوائد للمأموم في صلاة العيدين، وإن أسرَّ بالتكبير فلا حرج عليه، فالأمر مبني على الاستحباب على ما فصّل الجواب."
  en: "A questioner asked about a follower voicing the extra takbirs aloud in the Eid prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22535) answered that it is prescribed in the sharia for the follower to say the additional takbirs aloud in the two Eid prayers; if he keeps them quiet there is no blame on him, the matter resting on recommendation, as the answer details."
  ur: "ایک سائل نے نمازِ عید میں مقتدی کے اضافی تکبیرات بلند آواز سے کہنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22535)⁩ نے جواب دیا کہ دونوں عیدوں کی نماز میں مقتدی کے لیے اضافی تکبیرات بلند کہنا شرعاً مستحب ہے؛ اگر وہ آہستہ کہے تو کوئی حرج نہیں، معاملہ استحباب پر مبنی ہے، جیسا کہ جواب میں تفصیل ہے۔"
