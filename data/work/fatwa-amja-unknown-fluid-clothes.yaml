id: work/fatwa-amja-unknown-fluid-clothes
class: work
kind: fatwa
label: { ar: "سائل مجهول في الملابس", en: "An unknown fluid on the clothes — ruled by preponderance", ur: "کپڑوں میں نامعلوم سیال — غلبہ ظن", es: "Un fluido desconocido en la ropa —determinado por preponderancia", fr: "Un liquide inconnu sur les vêtements — déterminé par la prépondérance", tr: "Giysilerde bilinmeyen sıvı", id: "Cairan tidak diketahui dalam pakaian" }
summary:
  ar: "سأل سائل إذا وجد سائلًا في ملابسه لا يدري أمني هو أم لا وهل هناك إجماع. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77740 بتاريخ 7 فبراير 2009)⁩ أن من وجد سائلًا في ملابسه لا يدري كنهه فإنه يعمل بغلبة الظن فيرده إلى ما يغلب على ظنه من هذه الأشياء فإن لم يغلب له ظن اعتبره من قبيل ما لا يوجب الاغتسال لأن الأصل براءة الذمة على ما فصّل الجواب."
  en: "A questioner found a fluid on his clothes not knowing if it is semen, and asked whether there is consensus. Dr. Salah al-Sawi (fatwa no. 77740, 7 February 2009) answered that one finding a fluid he cannot identify acts on preponderance — referring it to what outweighs among these things; where no suspicion prevails he counts it of the kind obliging no washing, the presumption being a clear conscience — as the answer details."
  ur: "کپڑے پر نامعلوم سیال؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77740، 7 فروری 2009)⁩ کے مطابق غلبہ ظن پر عمل کرے؛ نہ ہو تو اصل براءت ہے۔"
  es: "Un consultante encontró un fluido en su ropa sin saber si se trataba de semen y preguntó si existía consenso al respecto. El Dr. Salah al-Sawi (fatwa n.° 77740, 7 de febrero de 2009) respondió que quien encuentra un fluido que no puede identificar actúa según la preponderancia de la información, refiriéndose a lo que prevalece entre estas cosas; cuando no existe sospecha, se considera que no requiere lavado, partiendo de la premisa de una conciencia tranquila, como se detalla en la respuesta."
  fr: "Un homme a trouvé un liquide sur ses vêtements, ignorant s'il s'agissait de sperme, et a demandé s'il existait un consensus à ce sujet. Le Dr Salah al-Sawi (fatwa n° 77740, 7 février 2009) a répondu que, face à un liquide non identifiable, il convient d'agir selon la prépondérance des éléments, en se référant à ce qui prévaut parmi les possibilités suivantes; en l'absence de suspicion, il est considéré comme ne nécessitant aucun lavage, la présomption étant celle de la conscience tranquille, comme le précise la réponse."
  tr: "Bir soru soran kişiye şöyle soruldu: Eğer kıyafetlerinde bir soru soran bulursa, güvende olup olmadığını ve bir uzlaşma olup olmadığını bilmez. Dr. Salah Al-Sawi (7 Şubat 2009 tarihli 77740 Fetva) şöyle yanıtladı: Kıyafetlerinde statüsünü bilmeden bir sorgulayan kişi, şüphe ağırlıklı hareket eder ve onu muhtemelen bu şeylere dair varsayışına geri döndürür. Böyle şeylerin baskın olmadığı takdirde, bunu ghusl (ritüel banyo) gerektirmeyen bir konu olarak kabul eder; çünkü varsayılan olarak vicdan temizliğidir, cevapta açıklandığı gibi."
  id: "Seorang penanya ditanya: Jika ia menemukan penanya mengenakan pakaian, ia tidak tahu apakah ia aman atau tidak, dan apakah ada konsensus. Dr. Salah Al-Sawi menjawab (Fatwa No. 77740 tanggal 7 Februari 2009) bahwa siapa pun yang menemukan penanya mengenakan pakaian tanpa mengetahui statusnya bertindak berdasarkan kecurigaan yang didominasi dan mengembalikannya pada apa yang kemungkinan besar adalah dugaan tentang hal-hal tersebut. Jika tidak ada dominasi hal-hal tersebut, ia menganggapnya sebagai hal yang tidak memerlukan ghusl (mandi ritual), karena default-nya adalah kebebasan hati nurani, seperti yang dijelaskan dalam jawaban."
