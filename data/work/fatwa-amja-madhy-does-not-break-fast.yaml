id: work/fatwa-amja-madhy-does-not-break-fast
class: work
kind: fatwa
label: { ar: "المذي والصوم", en: "Madhy by night — the fast stands, no washing owed", ur: "رات کی مذی — روزہ قائم", es: "Madhy de noche: las gradas rápidas, sin necesidad de lavar ropa.", fr: "Madhy la nuit — le jeûne est maintenu, pas de lessive due" }
summary:
  ar: "سأل سائل عن مسألة حصلت له أثار شهوته وسبب له المذي في رمضان. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82461 بتاريخ 7 سبتمبر 2010)⁩ أن المذي لا يفسد الصوم لا سيما وقد حدث ليلا والصوم يكون بالنهار ولا يكون بالليل، والمذي لا يوجب الغسل بل يوجب الاستنجاء والوضوء فعن سهل بن حنيف قال كنت ألقى من المذي شدة وكنت أكثر منه الاغتسال فسألت رسول الله عن ذلك فقال إنما يجزئك من ذلك الوضوء على ما فصّل."
  en: "A questioner described something that stirred his desire and brought on madhy in Ramadan. Dr. Salah al-Sawi (fatwa no. 82461, 7 September 2010) answered that madhy does not spoil the fast — especially having happened by night, fasting being by day and not by night; and madhy obliges no washing but only istinja and wudu: Sahl ibn Hanif said 'I suffered badly from madhy and washed often for it; I asked the Messenger of God and he said: wudu suffices you for it' — as detailed."
  ur: "ایک سائل کی رات میں مذی ہوئی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82461، 7 ستمبر 2010)⁩ کے مطابق مذی روزہ نہیں توڑتی اور غسل نہیں بلکہ وضو کافی ہے۔"
  es: "Un consultante describió algo que despertó su deseo y le provocó madhy durante el Ramadán. El Dr. Salah al-Sawi (fatwa n.° 82461, 7 de septiembre de 2010) respondió que madhy no invalida el ayuno, especialmente si ocurrió de noche, ya que el ayuno es de día y no de noche; y madhy no requiere lavado, sino solo istinja y wudu: Sahl ibn Hanif dijo: «Sufrí mucho de madhy y me lavé a menudo por ello; le pregunté al Mensajero de Dios y él dijo: el wudu te basta», como se detalla."
  fr: "Un homme a décrit un événement qui a suscité chez lui un désir intense et provoqué une impureté nocturne (madhy) pendant le Ramadan. Le Dr Salah al-Sawi (fatwa n° 82461, 7 septembre 2010) a répondu que l'impureté nocturne n'invalide pas le jeûne, surtout si elle survient la nuit, le jeûne étant pratiqué le jour. Il a également indiqué que l'impureté nocturne n'exige aucun lavage, mais seulement l'istinja et les wudu. Sahl ibn Hanif a rapporté: « J'ai beaucoup souffert de l'impureté nocturne et j'ai dû faire de nombreux ablutions. J'ai interrogé le Messager de Dieu, qui m'a répondu: les wudu te suffisent. »"
