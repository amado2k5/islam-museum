summary:
  ar: "تاريخ أندلسي مجهول المؤلف يسجل فتح الأندلس، والفترة السابقة على قيام الإمارة المروانية في قرطبة، وتاريخ الإمارة حتى عهد عبد الرحمن الناصر {cite:encyclopaedia-of-islam-2 vol. 1 p. 342-343}."
  en: "An anonymous chronicle of al-Andalus recording the Arab conquest, the period before the Marwanid amirate of Cordoba, and the amirate's history to the reign of 'Abd al-Rahman III al-Nasir {cite:encyclopaedia-of-islam-2 vol. 1 p. 342-343}."
  es: "Una crónica anónima de al-Ándalus que registra la conquista árabe, el período anterior al emirato marwánida de Córdoba y la historia del emirato hasta el reinado de 'Abd al-Rahman III al-Nasir {cite:encyclopaedia-of-islam-2 vol. 1 p. 342-343}."
  fr: "Une chronique anonyme d'al-Andalus relatant la conquête arabe, la période précédant l'émirat marwanide de Cordoue et l'histoire de l'émirat jusqu'au règne d'Abd al-Rahman III al-Nasir {cite:encyclopaedia-of-islam-2 vol. 1 p. 342-343}."
  ur: "الاندلس کا ایک گمنام تواریخ جس میں عربوں کی فتح، قرطبہ کی مروانی امارت سے پہلے کا دور، اور امارت کی تاریخ عبدالرحمٰن سوم الناصر کے دور تک ریکارڈ کی گئی ہے۔ 1 ص۔ 342-343}۔"
