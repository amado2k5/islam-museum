id: work/fatwa-iifa-253-bequests-against-poverty
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 253 (25/15) بشأن بيان دور الوصايا بوصفها أداة ناجعة من أدوات مكافحة الفقر وضمان تداول المال ورواجه في الشريعة الإسلامية", en: "IIFA resolution 253 (25/15) on the role of bequests as an effective instrument against poverty and for the circulation and flow of wealth in Islamic law", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 253 (25/15): شریعتِ اسلامی میں فقر کے خاتمے اور مال کی گردش و رواج کے لیے وصیتوں کے مؤثر اوزار کے کردار کا بیان" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩ في موضوع دور الوصايا بوصفها أداة من أدوات مكافحة الفقر وضمان تداول المال ورواجه. اطلع المجمع على البحوث الواردة وناقشها مناقشة مستفيضة واستمع إلى آراء الأعضاء والخبراء، وقرر تأجيل البت في الموضوع لمزيد من البحث والدراسة مع التوصية بعقد ندوة متخصصة حوله."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023) on the role of bequests as an effective instrument against poverty and for securing the circulation and flow of wealth in Islamic law. After reviewing the submitted research, discussing it at length and hearing the members' and experts' views, the Academy decided to defer a ruling on the matter for further research and study, recommending that a specialised seminar be held on it."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں، شریعتِ اسلامی میں فقر کے خاتمے اور مال کی گردش و رواج کے لیے وصیتوں کے اوزار کے کردار کے موضوع پر۔ اکیڈمی نے پیش کردہ تحقیقات کا جائزہ لیا، تفصیلی مباحث کیے اور ارکان و ماہرین کی آراء سنی، اور موضوع پر فیصلہ مزید تحقیق و مطالعے کے لیے مؤخر کرتے ہوئے اس پر ایک مخصوص سیمینار کے انعقاد کی سفارش کی۔"
