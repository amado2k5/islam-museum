id: work/fatwa-aliftaa-jo-injections-and-drips-while-fasting
class: work
kind: fatwa
label: { ar: "الإبر العضلية والحقن الوريدية للصائم", en: "Injections and intravenous drips while fasting", ur: "روزے میں انجکشن اور ڈرپ", es: "Inyecciones y goteos intravenosos en ayunas.", fr: "Injections et perfusions intraveineuses à jeun" }
summary:
  ar: "سؤال عن الإبر العضلية والحقن الوريدية للصائم، أجابت فيه دائرة الإفتاء العام الأردنية بأن الحقن العلاجية الجلدية والعضلية لا تفطر، وأن الحقن الوريدية المغذية تفطر. أجابت الدائرة بأن الحقن العلاجية الجلدية والعضلية لا تعد من المفطرات، لأنها لم تدخل إلى الجوف من منفذ مفتوح. وقالت إن الحقن الوريدية المغذية تفطر، لأنها مثل الطعام والشراب من حيث المعنى."
  en: "A question about injections and intravenous drips while fasting, in which Jordan's General Iftaa Department answered that therapeutic skin and muscle injections do not break the fast, while nourishing intravenous drips do. The Department answered that therapeutic injections into the skin or muscle are not among the things that break the fast, because they do not enter the interior through an open passage. It said that nourishing intravenous drips do break the fast, because in meaning they are like food and drink."
  ur: "روزے میں انجکشن اور ڈرپ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جلد اور پٹھوں میں علاج کے انجکشن روزہ نہیں توڑتے، جبکہ غذائیت والی ڈرپ روزہ توڑ دیتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جلد اور پٹھوں میں علاج کے انجکشن روزہ توڑنے والی چیزوں میں شمار نہیں ہوتے، کیونکہ وہ کھلے راستے سے جوف میں داخل نہیں ہوتے۔ اس نے کہا کہ غذائیت والی ڈرپ روزہ توڑ دیتی ہے، کیونکہ معنی کے اعتبار سے وہ کھانے پینے کی طرح ہے۔"
  es: "Una pregunta sobre inyecciones y sueros intravenosos durante el ayuno, a la que el Departamento General de Iftaa de Jordania respondió que las inyecciones terapéuticas en la piel y los músculos no rompen el ayuno, mientras que los sueros intravenosos nutritivos sí. El Departamento explicó que las inyecciones terapéuticas en la piel o los músculos no se consideran parte de lo que rompe el ayuno, ya que no penetran en el organismo a través de un conducto abierto. Añadió que los sueros intravenosos nutritivos sí rompen el ayuno, porque, en esencia, son como alimentos y bebidas."
  fr: "Une question concernant les injections et les perfusions intraveineuses pendant le jeûne a été posée. Le Département général de la Iftaa de Jordanie a répondu que les injections thérapeutiques cutanées et musculaires ne rompent pas le jeûne, contrairement aux perfusions intraveineuses nutritives. Le Département a expliqué que les injections thérapeutiques dans la peau ou les muscles ne font pas partie des actes qui rompent le jeûne, car elles ne pénètrent pas dans l'organisme par une voie ouverte. Il a précisé que les perfusions intraveineuses nutritives rompent le jeûne, car elles sont assimilables à de la nourriture et des boissons."
