id: work/fatwa-aliftaa-jo-injections-and-drips-while-fasting
class: work
kind: fatwa
label: { ar: "الإبر العضلية والحقن الوريدية للصائم", en: "Injections and intravenous drips while fasting", ur: "روزے میں انجکشن اور ڈرپ" }
summary:
  ar: "سؤال عن الإبر العضلية والحقن الوريدية للصائم، أجابت فيه دائرة الإفتاء العام الأردنية بأن الحقن العلاجية الجلدية والعضلية لا تفطر، وأن الحقن الوريدية المغذية تفطر. أجابت الدائرة بأن الحقن العلاجية الجلدية والعضلية لا تعد من المفطرات، لأنها لم تدخل إلى الجوف من منفذ مفتوح. وقالت إن الحقن الوريدية المغذية تفطر، لأنها مثل الطعام والشراب من حيث المعنى."
  en: "A question about injections and intravenous drips while fasting, in which Jordan's General Iftaa Department answered that therapeutic skin and muscle injections do not break the fast, while nourishing intravenous drips do. The Department answered that therapeutic injections into the skin or muscle are not among the things that break the fast, because they do not enter the interior through an open passage. It said that nourishing intravenous drips do break the fast, because in meaning they are like food and drink."
  ur: "روزے میں انجکشن اور ڈرپ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جلد اور پٹھوں میں علاج کے انجکشن روزہ نہیں توڑتے، جبکہ غذائیت والی ڈرپ روزہ توڑ دیتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جلد اور پٹھوں میں علاج کے انجکشن روزہ توڑنے والی چیزوں میں شمار نہیں ہوتے، کیونکہ وہ کھلے راستے سے جوف میں داخل نہیں ہوتے۔ اس نے کہا کہ غذائیت والی ڈرپ روزہ توڑ دیتی ہے، کیونکہ معنی کے اعتبار سے وہ کھانے پینے کی طرح ہے۔"
