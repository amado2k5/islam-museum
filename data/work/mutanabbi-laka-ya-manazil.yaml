label: { ar: "قصيدة المتنبي «لك يا منازل في القلوب منازل»", en: "Al-Mutanabbi's ode 'You, O abodes, have abodes in hearts'", es: "La oda de Al-Mutanabbi: «Vosotros, oh moradas, tenéis moradas en los corazones».", fr: "L'ode d'Al-Mutanabbi « Vous, ô demeures, avez des demeures dans les cœurs »" }
summary:
  ar: "قصيدة من الكامل على روي اللام للمتنبي، يمدح فيها القاضي أبا الفضل أحمد بن عبد الله بن الحسين الأنطاكي كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.177}}."
  en: "An ode in the kamil metre on the rhyme lam by al-Mutanabbi; praising the judge Abu al-Fadl Ahmad ibn Abd Allah ibn al-Husayn al-Antaki, as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.177}}."
  es: "Una oda en metro kamil sobre la rima lam de al-Mutanabbi; alabando al juez Abu al-Fadl Ahmad ibn Abd Allah ibn al-Husayn al-Antaki, como la introduce la edición de Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.177}}."
  fr: "Une ode en mètre kamil sur la rime lam par al-Mutanabbi; faisant l'éloge du juge Abu al-Fadl Ahmad ibn Abd Allah ibn al-Husayn al-Antaki, comme l'indique l'édition Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.177}}."
