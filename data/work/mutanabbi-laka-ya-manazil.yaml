  en: "An ode in the kamil metre on the rhyme lam by al-Mutanabbi; praising the judge Abu al-Fadl Ahmad ibn Abd Allah ibn al-Husayn al-Antaki, as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.177}}."
