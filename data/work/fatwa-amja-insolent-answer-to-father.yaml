id: work/fatwa-amja-insolent-answer-to-father
class: work
kind: fatwa
label: { ar: "لمن أصلي؟", en: "Praying for whom — a youth's sharp answer to his father", ur: "«کس کے لیے نماز؟» — باپ کو جواب", es: "¿Rezando por quién? —la aguda respuesta de un joven a su padre.", fr: "Pour qui prie-t-il ? — La réponse cinglante d'un jeune homme à son père", tr: "Kimin için dua etmeliyim?", id: "Untuk siapa saya harus berdoa?" }
summary:
  ar: "سأل سائل أنه في بداية شبابه مضى يومان لم يكن يصلي فقال والده إنه لا يصلي فغضب وقال له لمن أصلي؟ أجاب د. وليد بن إدريس المنيسي ⁦(فتوى رقم 21850 بتاريخ 21 أكتوبر 2006)⁩ أن عليه التوبة والاستغفار مما قال وأن حبوط العمل لا يكون إلا لمن مات وهو كافر لأن الله قال فيمت وهو كافر فأولئك حبطت أعمالهم، فطالما وفقه الله للتوبة والندم والمحافظة على الصلاة واسترضاء الوالد فهو على خير إن شاء الله، ونصحه بالإكثار من العمل الصالح ليكون كفارة له والحذر من فلتات اللسان إذ لا يكب الناس في النار على مناخرهم إلا حصائد ألسنتهم."
  en: "A questioner recalled that in his early youth he once went two days without praying; his father said 'you do not pray' and, angered, he answered 'whom am I praying for?'. Dr. Walid ibn Idris al-Munaysi (fatwa no. 21850, 21 October 2006) answered that he must repent and seek forgiveness for what he said — works are rendered void only for one who dies a disbeliever, per 'whoever dies a disbeliever, their works are lost'; so long as God granted him repentance, remorse, keeping the prayer and winning back his father's pleasure, he is on good ground — with counsel to multiply good deeds as his expiation and to beware slips of the tongue, for nothing casts men into the Fire on their faces like their tongues' harvest."
  ur: "ایک سائل نے باپ کو تیز جواب دیا تھا۔ ڈاکٹر ولید المنيسي ⁦(فتویٰ 21850، 21 اکتوبر 2006)⁩ کے مطابق توبہ اور والد کی رضا جوئی ضروری ہے — اعمال کا حبوط صرف کفر پر مرنے والے کے لیے ہے؛ زبان کی لغزش سے بچے۔"
  es: "Un consultante recordó que en su juventud pasó dos días sin rezar; su padre le dijo: «No rezas», y él, enfadado, respondió: «¿Por quién rezo?». El Dr. Walid ibn Idris al-Munaysi (fatwa n.º 21850, 21 de octubre de 2006) respondió que debía arrepentirse y pedir perdón por lo que había dicho: las obras solo se anulan para quien muere incrédulo, según el dicho «quien muere incrédulo, pierde sus obras». Mientras Dios le concediera el arrepentimiento, el remordimiento, la constancia en la oración y la reconciliación con su padre, estaría en el buen camino. Se le aconsejó multiplicar las buenas obras como expiación y tener cuidado con los deslices verbales, pues nada arroja a los hombres al Fuego como las palabras de sus lenguas."
  fr: "Un homme, posant la question, raconta que dans sa jeunesse, il avait passé deux jours sans prier. Son père lui avait dit: « Tu ne pries pas ! » et, irrité, il avait répondu: « Pour qui prierais-je ? » Le Dr Walid ibn Idris al-Munaysi (fatwa n° 21850, 21 octobre 2006) répondit qu'il devait se repentir et implorer le pardon pour ses paroles. Les œuvres ne sont vaines que pour celui qui meurt mécréant, selon le verset: « Quiconque meurt mécréant, ses œuvres sont perdues. » Dès lors que Dieu lui accordait le repentir, le remords, la pratique de la prière et la satisfaction de son père, il était sur la bonne voie. Il lui conseilla de multiplier les bonnes actions pour expier ses fautes et de se garder des paroles inconsidérées, car rien ne précipite plus les hommes en enfer que les fruits de leurs paroles."
  tr: "Bir soru soran, gençliğinde iki gün namaz kılmadığını sordu. Babası namaz kılmadığını söyledi, bu yüzden sinirlendi ve namaz kılmasını istedi. Dr. Walid bin İdris El-Munisi (21 Ekim 2006 tarihli Fetva No. 21850) tövbe etmesi ve söylediklerinden dolayı af dilemesi gerektiğini, ancak kafir olarak ölenlere ilişkin eylemlerin püfne yapılmasının geçerli olduğunu, çünkü Allah'ın şöyle dediğini söyledi: 'Eğer kâfirken ölürse, o insanların yaptıkları boşa çıkar.' Allah onu tövbeye, pişmanlık, dua etmeye ve ebeveynlerini memnun etmeye yönlendirdiği sürece, İnşallah iyidir. Ona iyi işleri kendisi için kefaret olarak artırmasını ve dil kaymaktan kaçınmasını öğütledi, çünkü insanlar sadece dillerinin meyvelerini burnundaki ateşe atar."
  id: "Ia bertanya kepada seorang penanya bahwa di masa mudanya, dua hari telah berlalu tanpa berdoa. Ayahnya mengatakan ia tidak berdoa, jadi ia marah dan meminta ayahnya berdoa. Dr. Walid bin Idris Al-Munisi (Fatwa No. 21850 tanggal 21 Oktober 2006) menjawab bahwa ia harus bertobat dan memohon ampun atas apa yang ia katakan, dan bahwa pembatalan perbuatan hanya berlaku bagi mereka yang meninggal sebagai kafir, karena Allah berfirman: 'Jika ia meninggal saat masih kafir, perbuatan mereka sia-sia.' Selama Allah membimbingnya untuk bertobat, menyesal, terus berdoa, dan menyenangkan orang tuanya, ia baik-baik saja, insya Allah. Ia menyarankan agar ia meningkatkan perbuatan baik sebagai penebusan dan berhati-hati agar tidak terlepas lidah, karena orang hanya melemparkan buah lidah mereka ke api di hidung mereka."
