id: work/fatwa-amja-insolent-answer-to-father
class: work
kind: fatwa
label: { ar: "لمن أصلي؟", en: "Praying for whom — a youth's sharp answer to his father", ur: "«کس کے لیے نماز؟» — باپ کو جواب", es: "¿Rezando por quién? —la aguda respuesta de un joven a su padre." }
summary:
  ar: "سأل سائل أنه في بداية شبابه مضى يومان لم يكن يصلي فقال والده إنه لا يصلي فغضب وقال له لمن أصلي؟ أجاب د. وليد بن إدريس المنيسي ⁦(فتوى رقم 21850 بتاريخ 21 أكتوبر 2006)⁩ أن عليه التوبة والاستغفار مما قال وأن حبوط العمل لا يكون إلا لمن مات وهو كافر لأن الله قال فيمت وهو كافر فأولئك حبطت أعمالهم، فطالما وفقه الله للتوبة والندم والمحافظة على الصلاة واسترضاء الوالد فهو على خير إن شاء الله، ونصحه بالإكثار من العمل الصالح ليكون كفارة له والحذر من فلتات اللسان إذ لا يكب الناس في النار على مناخرهم إلا حصائد ألسنتهم."
  en: "A questioner recalled that in his early youth he once went two days without praying; his father said 'you do not pray' and, angered, he answered 'whom am I praying for?'. Dr. Walid ibn Idris al-Munaysi (fatwa no. 21850, 21 October 2006) answered that he must repent and seek forgiveness for what he said — works are rendered void only for one who dies a disbeliever, per 'whoever dies a disbeliever, their works are lost'; so long as God granted him repentance, remorse, keeping the prayer and winning back his father's pleasure, he is on good ground — with counsel to multiply good deeds as his expiation and to beware slips of the tongue, for nothing casts men into the Fire on their faces like their tongues' harvest."
  ur: "ایک سائل نے باپ کو تیز جواب دیا تھا۔ ڈاکٹر ولید المنيسي ⁦(فتویٰ 21850، 21 اکتوبر 2006)⁩ کے مطابق توبہ اور والد کی رضا جوئی ضروری ہے — اعمال کا حبوط صرف کفر پر مرنے والے کے لیے ہے؛ زبان کی لغزش سے بچے۔"
  es: "Un consultante recordó que en su juventud pasó dos días sin rezar; su padre le dijo: «No rezas», y él, enfadado, respondió: «¿Por quién rezo?». El Dr. Walid ibn Idris al-Munaysi (fatwa n.º 21850, 21 de octubre de 2006) respondió que debía arrepentirse y pedir perdón por lo que había dicho: las obras solo se anulan para quien muere incrédulo, según el dicho «quien muere incrédulo, pierde sus obras». Mientras Dios le concediera el arrepentimiento, el remordimiento, la constancia en la oración y la reconciliación con su padre, estaría en el buen camino. Se le aconsejó multiplicar las buenas obras como expiación y tener cuidado con los deslices verbales, pues nada arroja a los hombres al Fuego como las palabras de sus lenguas."
