id: work/fatwa-amja-hair-gel-wudu
class: work
kind: fatwa
label: { ar: "جل الشعر والوضوء", en: "Hair gel and cream — what bars the water, what is absorbed", ur: "بالوں کا جیل اور وضو" }
summary:
  ar: "سأل سائل عن حكم جل الشعر والكريم بالنسبة للوضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78137 بتاريخ 9 مارس 2009)⁩ أن القاعدة في هذا وغيره أن ما مثل حاجزًا يحول دون وصول الماء إلى البشرة تتعين إزالته لصحة الوضوء ولكن مبلغ علمه أن الكريمات يتشربها الجلد بعد فترة فلا تبقى طبقة حاجزة فلا تؤثر على ما فصّل الجواب."
  en: "A questioner asked the ruling on hair gel and cream for the wudu — applying gel then the time comes. Dr. Salah al-Sawi (fatwa no. 78137, 9 March 2009) answered that the rule here and elsewhere: whatever stands as a barrier keeping water from the skin must be removed for valid wudu; but as far as he knows creams are absorbed into the skin after a while leaving no barrier layer, so they do not affect it — as the answer details."
  ur: "جیل یا کریم لگائے وضو؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78137، 9 مارچ 2009)⁩ کے مطابق حائل چیز ہٹانا واجب؛ جذب ہونے والی کریم بے ضرر۔"
