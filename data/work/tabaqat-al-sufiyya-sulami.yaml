label: { ar: "طبقات الصوفية للسلمي", en: "Tabaqat al-Sufiyya (al-Sulami)", ur: "طبقات الصوفیہ ⁦(سلمی)⁩" }
summary:
  ar: "كتاب أبي عبد الرحمن السلمي ⁦(ت 412هـ)⁩ في تراجم مشايخ الصوفية، التزم فيه أن يذكر خمس طبقات في كل طبقة عشرون شيخاً مع شيء من أقوالهم، والذي بين أيدينا منه مئة وثلاث تراجم؛ ألّفه في خاتمة القرن الرابع بعد «تاريخ الصوفية»، وأفاد منه أبو نعيم والخطيب البغدادي والقشيري ومن بعدهم {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 49} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 50} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 65}."
  en: "Abu 'Abd al-Rahman al-Sulami's (d. 412 AH) book of notices of the Sufi masters, in which he undertook to give five generations of twenty shaykhs each with some of their sayings; the text as we have it has one hundred and three notices. He wrote it at the close of the fourth century after his Ta'rikh al-Sufiyya, and Abu Nu'aym, al-Khatib al-Baghdadi, al-Qushayri and later authors drew on it {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 49} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 50} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 65}."
  ur: "ابو عبد الرحمن سلمی ⁦(م 412ھ)⁩ کی صوفی مشائخ کے تراجم پر کتاب، جس میں انہوں نے پانچ طبقے، ہر طبقے میں بیس شیخ اور ان کے کچھ اقوال ذکر کرنے کا التزام کیا؛ موجودہ متن میں ایک سو تین تراجم ہیں۔ انہوں نے اسے چوتھی صدی کے آخر میں «تاریخ الصوفیہ» کے بعد لکھا، اور ابو نعیم، خطیب بغدادی، قشیری اور بعد والوں نے اس سے استفادہ کیا {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 49} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 50} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 65}۔"
