label: { ar: "طبقات الصوفية للسلمي", en: "Tabaqat al-Sufiyya (al-Sulami)", ur: "طبقات الصوفیہ ⁦(سلمی)⁩", es: "Tabaqat al-Sufiyya (al-Sulami)", fr: "Tabaqat al-Sufiyya (al-Sulami)", tr: "Al-Sulmi tarafından Sufi Sınıfları", id: "Kelas Sufi oleh Al-Sulmi" }
summary:
  ar: "كتاب أبي عبد الرحمن السلمي ⁦(ت 412هـ)⁩ في تراجم مشايخ الصوفية، التزم فيه أن يذكر خمس طبقات في كل طبقة عشرون شيخاً مع شيء من أقوالهم، والذي بين أيدينا منه مئة وثلاث تراجم؛ ألّفه في خاتمة القرن الرابع بعد «تاريخ الصوفية»، وأفاد منه أبو نعيم والخطيب البغدادي والقشيري ومن بعدهم {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 49} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 50} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 65}."
  en: "Abu 'Abd al-Rahman al-Sulami's (d. 412 AH) book of notices of the Sufi masters, in which he undertook to give five generations of twenty shaykhs each with some of their sayings; the text as we have it has one hundred and three notices. He wrote it at the close of the fourth century after his Ta'rikh al-Sufiyya, and Abu Nu'aym, al-Khatib al-Baghdadi, al-Qushayri and later authors drew on it {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 49} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 50} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 65}."
  ur: "ابو عبد الرحمن سلمی ⁦(م 412ھ)⁩ کی صوفی مشائخ کے تراجم پر کتاب، جس میں انہوں نے پانچ طبقے، ہر طبقے میں بیس شیخ اور ان کے کچھ اقوال ذکر کرنے کا التزام کیا؛ موجودہ متن میں ایک سو تین تراجم ہیں۔ انہوں نے اسے چوتھی صدی کے آخر میں «تاریخ الصوفیہ» کے بعد لکھا، اور ابو نعیم، خطیب بغدادی، قشیری اور بعد والوں نے اس سے استفادہ کیا {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 49} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 50} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 65}۔"
  es: "El libro de noticias de los maestros sufíes de Abu 'Abd al-Rahman al-Sulami (m. 412 AH), en el que se comprometió a dar a cinco generaciones de veinte shaykhs cada una algunos de sus dichos; el texto tal como lo tenemos tiene ciento tres avisos. Lo escribió a finales del siglo IV después de su Ta'rikh al-Sufiyya, y Abu Nu'aym, al-Khatib al-Baghdadi, al-Qushayri y autores posteriores se basaron en él {citar:tabaqat-sufiyya-sulami-khanji-1986 p. 49} {citar:tabaqat-sufiyya-sulami-khanji-1986 p. 50} {cita:tabaqat-sufiyya-sulami-khanji-1986 p. 65}."
  fr: "le livre d'Abu 'Abd al-Rahman al-Sulami (mort en 412 AH) sur les avis des maîtres soufis, dans lequel il s'est engagé à donner à cinq générations de vingt cheikhs chacune avec certains de leurs paroles; le texte tel que nous l'avons comporte cent trois notices. Il l'a écrit à la fin du quatrième siècle après son Ta'rikh al-Sufiyya, et Abu Nu'aym, al-Khatib al-Baghdadi, al-Qushayri et des auteurs ultérieurs s'en sont inspirés {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 49} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 50} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 65}."
  tr: "Ebu Abdülrahman el-Sulami'nin (ö. 412 Hicri) Sufi şeyhlerinin biyografileri üzerine kitabı, her birinde yirmi şeyh ve onların bazı ifadelerini içeren beş kategoriyi belirtmeyi taahhüt etmiştir. Yüz üç biyografimiz var; bu biyografiyi dördüncü yüzyılın sonunda 'Sufizmin Tarihi'nden sonra ve Abu Nu'aym, el-Hatib el-Bağdadi, el-Kuşayri ve onlardan sonrakilerden sonra yazmıştır {cite:tabaqat-sufiyya-sulami-khanji-1986 s. 49} {cite:tabaqat-sufiyya-sulami-khanji-1986 s. 50} {cite:tabaqat-sufiyya-sulami-khanji-1986 s. 65} {cite:tabaqat-sufiyya-sulami-khanji-1986 s. 65}"
  id: "Kitab Abu Abd al-Rahman al-Sulami (wafat 412 H) tentang biografi para sheikh Sufi, di mana ia berkomitmen untuk menyebutkan lima kategori, masing-masing dengan dua puluh sheikh beserta beberapa pernyataan mereka. Kita memiliki seratus tiga biografi; ia menulisnya pada akhir abad keempat setelah 'Sejarah Sufisme,' dan Abu Nu'aym, al-Khatib al-Baghdadi, al-Qushayri, dan yang setelahnya {cite:tabaqat-sufiyya-sulami-khanji-1986 hlm. 49} {cite:tabaqat-sufiyya-sulami-khanji-1986 hlm. 50} {cite:tabaqat-sufiyya-sulami-khanji-1986 hlm. 65}."
