summary:
  ar: "بيان أصدره المجلس الفقهي لأمريكا الشمالية ⁦(2021)⁩ يوضح الموقف من لقاحات كوفيد-19 ويرد على الشائعات والأوهام المتداولة عنها طبيًّا وشرعيًّا على ما نصّ عليه البيان."
  en: "A statement by the Fiqh Council of North America (2021) clarifying the position on COVID-19 vaccines and answering the circulating rumours and myths about them, medical and religious — as the statement sets out."
  ur: "فقہ کونسل آف نارتھ امریکہ کا بیان ⁦(2021)⁩ کووڈ-19 ویکسین کے بارے میں، جس میں طبی اور مذہبی افواہوں کے جوابات ہیں — جیسا کہ بیان میں ہے۔"
