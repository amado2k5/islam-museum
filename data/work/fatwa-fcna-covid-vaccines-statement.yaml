  id: "Pernyataan yang dikeluarkan oleh North American Fiqh Council (2021) memperjelas sikap terhadap vaksin COVID-19 dan menanggapi rumor serta kesalahpahaman yang beredar tentangnya secara medis dan agama seperti yang dinyatakan dalam pernyataan tersebut."
