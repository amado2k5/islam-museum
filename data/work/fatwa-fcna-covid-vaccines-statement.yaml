  fr: "Une déclaration du Conseil Fiqh d’Amérique du Nord (2021) clarifiant la position sur les vaccins contre la COVID-19 et répondant aux rumeurs et mythes qui circulent à leur sujet, médicaux et religieux — comme le précise la déclaration."
