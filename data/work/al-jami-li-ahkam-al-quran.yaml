id: work/al-jami-li-ahkam-al-quran
class: work
kind: book
label:
  ar: "الجامع لأحكام القرآن والمبين لما تضمنه من السنة وآي الفرقان"
  en: "al-Jami' li-Ahkam al-Qur'an (Tafsir al-Qurtubi)"
  ur: "الجامع لاحکام القرآن (تفسیرِ قرطبی)"
summary:
  ar: "تفسير أبي عبد الله محمد بن أحمد القرطبي (ت 671هـ)، قصد فيه «تعليقًا وجيزًا» يجمع نكت التفسير واللغة والإعراب والقراءات والرد على أهل الزيغ والأحاديث الشاهدة للأحكام وأسباب النزول، وشرط فيه إضافة الأقوال إلى قائليها والأحاديث إلى مخرّجيها، وجعل كل آية فيها حكم مسائل مرقّمة."
  en: "The commentary of Abu Abd Allah Muhammad ibn Ahmad al-Qurtubi (d. 671 AH), planned as a 'concise commentary' gathering points of interpretation, lexicon, grammar and readings, rebuttals of deviant views, and hadith attesting rulings and occasions of revelation; its stated rule is to attribute every saying to its speaker and every hadith to its compiler, and it breaks each verse that carries a ruling into numbered questions (masa'il)."
  ur: "ابو عبد اللہ محمد بن احمد قرطبی (م 671ھ) کی تفسیر، جسے انہوں نے ایک «مختصر تعلیق» کے طور پر سوچا جو تفسیر، لغت، اعراب اور قراءات کے نکات، گمراہ آرا کے رد، اور احکام و اسبابِ نزول کی شاہد احادیث کو جمع کرے؛ اس کی شرط یہ ہے کہ ہر قول اس کے قائل اور ہر حدیث اس کے مخرج کی طرف منسوب ہو، اور ہر حکم والی آیت کو نمبر وار مسائل میں تقسیم کیا جائے۔"
