structure: "مقدمة المصنف وأبوابها: فضائل القرآن؛ كيفية التلاوة؛ ما ينبغي لصاحب القرآن؛ إعراب القرآن؛ فضل التفسير؛ حامل القرآن؛ الوعيد في التفسير بالرأي؛ تبيين الكتاب بالسنة؛ كيفية التعلم؛ معنى حديث الأحرف السبعة وحديث عمر وهشام؛ جمع القرآن؛ ترتيب السور والآيات وشكله ونقطه وتحزيبه وتعشيره؛ معنى السورة والآية؛ الكلمات غير العربية؛ الإعجاز؛ الأحاديث الموضوعة في فضل السور؛ الرد على من طعن في القرآن؛ ثم تفسير السور على ترتيب المصحف، وفيه كل آية ذات حكم مقسمة إلى مسائل."
