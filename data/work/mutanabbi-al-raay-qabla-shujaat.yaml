label: { ar: "قصيدة المتنبي «الرأي قبل شجاعة الشجعان»", en: "Al-Mutanabbi's ode 'Judgement before the courage of the brave'", es: "La oda de Al-Mutanabbi: \"El juicio ante el valor de los valientes\".", fr: "L'ode d'Al-Mutanabbi « Le jugement avant le courage des braves »" }
summary:
  ar: "قصيدة من الكامل على روي النون للمتنبي، يمدح فيها سيف الدولة وأنشده إياها وهو منصرف من بلاد الروم في صفر سنة 345هـ ⁦(956م)⁩ كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.414}}."
  en: "An ode in the kamil metre on the rhyme nun by al-Mutanabbi; praising Sayf al-Dawla, recited on his return from the Byzantine lands in Safar 345 AH (956 CE), as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.414}}."
  es: "Una oda en metro kamil sobre la rima nun de al-Mutanabbi; alabando a Sayf al-Dawla, recitada a su regreso de tierras bizantinas en Safar 345 AH (956 d. C.), como la introduce la edición de Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.414}}."
  fr: "Une ode en mètre kamil sur la rime nun par al-Mutanabbi; faisant l'éloge de Sayf al-Dawla, récitée à son retour des terres byzantines en Safar 345 AH (956 CE), comme l'indique l'édition Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.414}}."
