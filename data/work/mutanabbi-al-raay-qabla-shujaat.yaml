  en: "An ode in the kamil metre on the rhyme nun by al-Mutanabbi; praising Sayf al-Dawla, recited on his return from the Byzantine lands in Safar 345 AH (956 CE), as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.414}}."
