id: work/fatwa-aliftaa-jo-bonus-credit-on-gift-cards
class: work
kind: fatwa
label: { ar: "الرصيد الإضافي في بطاقات الهدايا مسبقة الدفع", en: "Bonus credit on prepaid gift cards", ur: "پیشگی ادا شدہ گفٹ کارڈ پر اضافی بیلنس" }
summary:
  ar: "سؤال عن بطاقة هدية تُشترى بمئة وتسعين دينارًا وتُشحن بمئتين واثني عشر، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في شرائها، لأن الزيادة هبة من البائع. وصفت الدائرة البطاقة بأنها مدفوعة مسبقًا للشراء عبر الإنترنت من موقع مصدرها، وذكرت أنها تبيّنت بعد البحث أن سياسة الموقع منح رصيد زائد على المبلغ المدفوع. وقالت إن البطاقة تمثل فقهيًا قيمة نقدية في حدود ما دفعه العميل، وإن الرصيد الزائد هبة من البائع لحامل البطاقة تشجيعًا له على الشراء منه حصرًا. وخلصت إلى أنه لا حرج في شراء هذه البطاقة."
  en: "A question on a gift card bought for 190 dinars and loaded with 212, in which Jordan's General Iftaa Department answered that buying it is permissible, since the extra is a gift from the seller. The Department described the card as prepaid for online purchases from the issuer's site, and said its research showed that the site's policy is to add credit beyond the amount paid. It said that, in fiqh terms, the card represents cash value up to what the customer paid, and the extra credit is a gift from the seller to the cardholder to encourage buying from it alone. It concluded that there is no objection to buying the card."
  ur: "190 دینار میں خریدے جانے والے اور 212 دینار سے چارج ہونے والے گفٹ کارڈ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اسے خریدنا جائز ہے، کیونکہ اضافہ بیچنے والے کی طرف سے ہبہ ہے۔ ڈیپارٹمنٹ نے کارڈ کو جاری کرنے والے کی ویب سائٹ سے آن لائن خریداری کے لیے پیشگی ادا شدہ کارڈ قرار دیا، اور کہا کہ تحقیق سے معلوم ہوا کہ ویب سائٹ کی پالیسی ادا شدہ رقم سے زائد بیلنس دینا ہے۔ اس نے کہا کہ فقہی لحاظ سے کارڈ گاہک کی ادا کردہ رقم کی حد تک نقد قیمت کی نمائندگی کرتا ہے، اور اضافی بیلنس بیچنے والے کی طرف سے کارڈ رکھنے والے کو ہبہ ہے تاکہ وہ صرف اسی سے خریداری کرے۔ اس نے نتیجہ نکالا کہ یہ کارڈ خریدنے میں کوئی حرج نہیں۔"
