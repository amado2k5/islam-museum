id: work/fatwa-aliftaa-jo-bonus-credit-on-gift-cards
class: work
kind: fatwa
label: { ar: "الرصيد الإضافي في بطاقات الهدايا مسبقة الدفع", en: "Bonus credit on prepaid gift cards", ur: "پیشگی ادا شدہ گفٹ کارڈ پر اضافی بیلنس", es: "Crédito adicional en tarjetas de regalo prepago", fr: "Crédit bonus sur les cartes-cadeaux prépayées", tr: "Ön ödemeli hediye kartlarında ek bakiye", id: "Saldo tambahan pada kartu hadiah prabayar" }
summary:
  ar: "سؤال عن بطاقة هدية تُشترى بمئة وتسعين دينارًا وتُشحن بمئتين واثني عشر، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في شرائها، لأن الزيادة هبة من البائع. وصفت الدائرة البطاقة بأنها مدفوعة مسبقًا للشراء عبر الإنترنت من موقع مصدرها، وذكرت أنها تبيّنت بعد البحث أن سياسة الموقع منح رصيد زائد على المبلغ المدفوع. وقالت إن البطاقة تمثل فقهيًا قيمة نقدية في حدود ما دفعه العميل، وإن الرصيد الزائد هبة من البائع لحامل البطاقة تشجيعًا له على الشراء منه حصرًا. وخلصت إلى أنه لا حرج في شراء هذه البطاقة."
  en: "A question on a gift card bought for 190 dinars and loaded with 212, in which Jordan's General Iftaa Department answered that buying it is permissible, since the extra is a gift from the seller. The Department described the card as prepaid for online purchases from the issuer's site, and said its research showed that the site's policy is to add credit beyond the amount paid. It said that, in fiqh terms, the card represents cash value up to what the customer paid, and the extra credit is a gift from the seller to the cardholder to encourage buying from it alone. It concluded that there is no objection to buying the card."
  ur: "190 دینار میں خریدے جانے والے اور 212 دینار سے چارج ہونے والے گفٹ کارڈ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اسے خریدنا جائز ہے، کیونکہ اضافہ بیچنے والے کی طرف سے ہبہ ہے۔ ڈیپارٹمنٹ نے کارڈ کو جاری کرنے والے کی ویب سائٹ سے آن لائن خریداری کے لیے پیشگی ادا شدہ کارڈ قرار دیا، اور کہا کہ تحقیق سے معلوم ہوا کہ ویب سائٹ کی پالیسی ادا شدہ رقم سے زائد بیلنس دینا ہے۔ اس نے کہا کہ فقہی لحاظ سے کارڈ گاہک کی ادا کردہ رقم کی حد تک نقد قیمت کی نمائندگی کرتا ہے، اور اضافی بیلنس بیچنے والے کی طرف سے کارڈ رکھنے والے کو ہبہ ہے تاکہ وہ صرف اسی سے خریداری کرے۔ اس نے نتیجہ نکالا کہ یہ کارڈ خریدنے میں کوئی حرج نہیں۔"
  es: "Una consulta sobre una tarjeta de regalo comprada por 190 dinares y cargada con 212, a la que el Departamento General de Iftaa de Jordania respondió que su compra es permisible, ya que el saldo adicional es un obsequio del vendedor. El Departamento describió la tarjeta como prepago para compras en línea en el sitio web del emisor y afirmó que su investigación demostró que la política del sitio es agregar crédito por encima del monto pagado. Indicó que, en términos de fiqh (jurisprudencia islámica), la tarjeta representa un valor en efectivo hasta el monto pagado por el cliente, y el crédito adicional es un obsequio del vendedor al titular de la tarjeta para incentivar las compras. Concluyó que no existe objeción alguna a la compra de la tarjeta."
  fr: "Concernant une carte-cadeau achetée 190 dinars et créditée de 212 dinars, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a statué que son achat est licite, le solde excédentaire étant un cadeau du vendeur. Le Département a précisé que la carte est prépayée pour les achats en ligne sur le site de l'émetteur et a indiqué que ses recherches ont montré que la politique de ce site est de créditer le montant au-delà de la somme payée. Selon le droit islamique (fiqh), la carte représente une valeur monétaire à hauteur du prix payé par le client, et le crédit excédentaire est un cadeau du vendeur au titulaire de la carte afin de l'inciter à acheter exclusivement sur ce site. En conclusion, l'achat de cette carte n'est pas contestable."
  tr: "Yüz doksan dinara alınan ve iki yüz on iki dinara gönderilen bir hediye kartı hakkında soru, Ürdün Genel Fetva Müdürlüğü, artışın satıcıdan hediye olarak satın almanın zararı olmadığını yanıtladı. Departman, kartı kaynak web sitesinden ön ödemeli online satın alma olarak tanımladı ve araştırma sonucunda sitenin politikasının ödenmiş tutarın ötesinde fazla kredi vermek olduğunu tespit etti. Kartın yasal olarak müşterinin ödediği limitler içinde parasal değer olarak kabul edildiğini ve fazla bakiyenin satıcının kart sahibine sadece kendisinden alışveriş yapmaya teşvik etmek için verdiği bir hediye olduğunu belirtti. Bu kartı satın almanın zararı olmadığı sonucuna varıldı."
  id: "Sebuah pertanyaan tentang kartu hadiah yang dibeli seharga seratus sembilan puluh dinar dan dikirim seharga dua ratus dua belas dinar, yang dijawab oleh Departemen Fatwa Umum Yordania bahwa tidak ada salahnya membelinya, karena kenaikan tersebut adalah hadiah dari penjual. Departemen tersebut menggambarkan kartu tersebut sebagai pembelian online yang dibayar di awal dari situs sumbernya, dan menyatakan bahwa setelah penelitian, mereka menemukan bahwa kebijakan situs tersebut adalah memberikan kredit berlebih melebihi jumlah yang dibayarkan. Departemen menyatakan bahwa kartu tersebut secara hukum dianggap sebagai nilai uang dalam batas yang dibayarkan oleh pelanggan, dan saldo berlebih adalah hadiah dari penjual kepada pemegang kartu untuk mendorong mereka membeli secara eksklusif dari mereka. Departemen menyimpulkan bahwa tidak ada salahnya membeli kartu ini."
