id: work/fatwa-aliftaa-jo-reselling-a-book-without-an-exclusive-agent
class: work
kind: fatwa
label: { ar: "بيع كتاب لا وكيل حصريًا له", en: "Selling a book that has no exclusive agent", ur: "ایسی کتاب بیچنا جس کا کوئی خصوصی ایجنٹ نہیں" }
summary:
  ar: "سؤال عن استيراد كتاب طبي يبيعه وكيل في السوق، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في بيعه إذا لم تكن هناك وكالة حصرية، ويحرم السعي لفسخ وكالة حصرية قائمة. أجابت الدائرة بأن الأصل في البيع التراضي، وأن للمسألة حالين. الأولى ألا يكون بين المورد والمستورد الأول اتفاق على وكالة حصرية، فلا حرج في التعاقد مع المورد نفسه على استيراد بضاعته وبيعها، ولو بسعر يختلف عن المستورد الأول. والثانية أن يكون المستورد الأول قد حصل على وكالة حصرية، فيسعى الثاني لإقناع المورد بفسخ عقده معه وإبرام عقد جديد، فهذا حرام لأنه يزرع العداوة بين المسلمين، واستشهدت بحديث النهي عن بيع بعضهم على بيع بعض. وخلصت إلى أنه ما دام لا يوجد اتفاق على وكالة حصرية، كما في السؤال، فلا حرج على المستورد الثاني في جلب الكتاب وبيعه بالثمن الذي يراه مناسبًا."
  en: "A question on importing a medical book already sold through an agent, in which Jordan's General Iftaa Department answered that selling it is permissible if there is no exclusive agency, but working to break an existing exclusive agency is forbidden. The Department answered that sale rests on mutual consent, and the question has two cases. In the first, the supplier and the first importer have no exclusive-agency agreement, so there is no objection to contracting with the same supplier to import and sell its goods, even at a different price from the first importer. In the second, the first importer holds an exclusive agency and the second persuades the supplier to cancel that contract and sign with him; this is forbidden because it sows enmity among Muslims, and it cited the hadith forbidding people to sell over one another's sales. It concluded that since there is no exclusive-agency agreement, as in the question, the second importer may bring in the book and sell it at the price he sees fit."
  ur: "مارکیٹ میں ایک ایجنٹ کے ذریعے بکنے والی میڈیکل کتاب درآمد کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر خصوصی ایجنسی نہ ہو تو اسے بیچنا جائز ہے، البتہ موجودہ خصوصی ایجنسی ختم کروانے کی کوشش حرام ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ بیع کی بنیاد باہمی رضامندی ہے، اور مسئلے کی دو صورتیں ہیں۔ پہلی یہ کہ سپلائر اور پہلے درآمد کنندہ کے درمیان خصوصی ایجنسی کا کوئی معاہدہ نہ ہو، تو اسی سپلائر سے اس کا سامان درآمد کر کے بیچنے کا معاہدہ کرنے میں کوئی حرج نہیں، چاہے قیمت پہلے درآمد کنندہ سے مختلف ہو۔ دوسری یہ کہ پہلے درآمد کنندہ کے پاس خصوصی ایجنسی ہو اور دوسرا سپلائر کو اس کا معاہدہ ختم کر کے اپنے ساتھ معاہدہ کرنے پر آمادہ کرے؛ یہ حرام ہے کیونکہ اس سے مسلمانوں میں دشمنی پیدا ہوتی ہے، اور اس نے ایک دوسرے کے سودے پر سودا کرنے کی ممانعت والی حدیث سے استدلال کیا۔ اس نے نتیجہ نکالا کہ چونکہ سوال کی صورت میں خصوصی ایجنسی کا کوئی معاہدہ نہیں، اس لیے دوسرا درآمد کنندہ کتاب لا کر مناسب قیمت پر بیچ سکتا ہے۔"
