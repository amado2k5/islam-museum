id: work/fatwa-aliftaa-jo-reselling-a-book-without-an-exclusive-agent
class: work
kind: fatwa
label: { ar: "بيع كتاب لا وكيل حصريًا له", en: "Selling a book that has no exclusive agent", ur: "ایسی کتاب بیچنا جس کا کوئی خصوصی ایجنٹ نہیں", es: "Vender un libro que no tiene agente exclusivo.", fr: "Vendre un livre sans agent exclusif", tr: "Özel bir ajans olmadan kitap satmak", id: "Menjual buku tanpa agen eksklusif" }
summary:
  ar: "سؤال عن استيراد كتاب طبي يبيعه وكيل في السوق، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في بيعه إذا لم تكن هناك وكالة حصرية، ويحرم السعي لفسخ وكالة حصرية قائمة. أجابت الدائرة بأن الأصل في البيع التراضي، وأن للمسألة حالين. الأولى ألا يكون بين المورد والمستورد الأول اتفاق على وكالة حصرية، فلا حرج في التعاقد مع المورد نفسه على استيراد بضاعته وبيعها، ولو بسعر يختلف عن المستورد الأول. والثانية أن يكون المستورد الأول قد حصل على وكالة حصرية، فيسعى الثاني لإقناع المورد بفسخ عقده معه وإبرام عقد جديد، فهذا حرام لأنه يزرع العداوة بين المسلمين، واستشهدت بحديث النهي عن بيع بعضهم على بيع بعض. وخلصت إلى أنه ما دام لا يوجد اتفاق على وكالة حصرية، كما في السؤال، فلا حرج على المستورد الثاني في جلب الكتاب وبيعه بالثمن الذي يراه مناسبًا."
  en: "A question on importing a medical book already sold through an agent, in which Jordan's General Iftaa Department answered that selling it is permissible if there is no exclusive agency, but working to break an existing exclusive agency is forbidden. The Department answered that sale rests on mutual consent, and the question has two cases. In the first, the supplier and the first importer have no exclusive-agency agreement, so there is no objection to contracting with the same supplier to import and sell its goods, even at a different price from the first importer. In the second, the first importer holds an exclusive agency and the second persuades the supplier to cancel that contract and sign with him; this is forbidden because it sows enmity among Muslims, and it cited the hadith forbidding people to sell over one another's sales. It concluded that since there is no exclusive-agency agreement, as in the question, the second importer may bring in the book and sell it at the price he sees fit."
  ur: "مارکیٹ میں ایک ایجنٹ کے ذریعے بکنے والی میڈیکل کتاب درآمد کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر خصوصی ایجنسی نہ ہو تو اسے بیچنا جائز ہے، البتہ موجودہ خصوصی ایجنسی ختم کروانے کی کوشش حرام ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ بیع کی بنیاد باہمی رضامندی ہے، اور مسئلے کی دو صورتیں ہیں۔ پہلی یہ کہ سپلائر اور پہلے درآمد کنندہ کے درمیان خصوصی ایجنسی کا کوئی معاہدہ نہ ہو، تو اسی سپلائر سے اس کا سامان درآمد کر کے بیچنے کا معاہدہ کرنے میں کوئی حرج نہیں، چاہے قیمت پہلے درآمد کنندہ سے مختلف ہو۔ دوسری یہ کہ پہلے درآمد کنندہ کے پاس خصوصی ایجنسی ہو اور دوسرا سپلائر کو اس کا معاہدہ ختم کر کے اپنے ساتھ معاہدہ کرنے پر آمادہ کرے؛ یہ حرام ہے کیونکہ اس سے مسلمانوں میں دشمنی پیدا ہوتی ہے، اور اس نے ایک دوسرے کے سودے پر سودا کرنے کی ممانعت والی حدیث سے استدلال کیا۔ اس نے نتیجہ نکالا کہ چونکہ سوال کی صورت میں خصوصی ایجنسی کا کوئی معاہدہ نہیں، اس لیے دوسرا درآمد کنندہ کتاب لا کر مناسب قیمت پر بیچ سکتا ہے۔"
  es: "Una pregunta sobre la importación de un libro de medicina ya vendido a través de un agente, a la que el Departamento General de Iftaa de Jordania respondió que su venta es permisible si no existe un acuerdo de agencia exclusiva, pero que está prohibido intentar romper un acuerdo de agencia exclusiva existente. El Departamento explicó que la venta se basa en el consentimiento mutuo y que la pregunta presenta dos casos. En el primero, el proveedor y el primer importador no tienen un acuerdo de agencia exclusiva, por lo que no hay inconveniente en contratar con el mismo proveedor para importar y vender sus productos, incluso a un precio diferente al del primer importador. En el segundo, el primer importador tiene un acuerdo de agencia exclusiva y el segundo persuade al proveedor para que cancele dicho contrato y firme con él; esto está prohibido porque siembra enemistad entre los musulmanes, y citó el hadiz que prohíbe vender por encima de las ventas de otros. Concluyó que, dado que no existe un acuerdo de agencia exclusiva, como en el caso de la pregunta, el segundo importador puede importar el libro y venderlo al precio que considere oportuno."
  fr: "Une question relative à l'importation d'un ouvrage médical déjà vendu par un agent a été posée au Département général de la jurisprudence jordanienne (Iftaa). Ce dernier a statué que la vente est permise en l'absence de contrat d'exclusivité, mais que toute tentative de rupture d'un tel contrat est interdite. Le Département a précisé que la vente repose sur le consentement mutuel et a identifié deux cas de figure. Dans le premier cas, le fournisseur et le premier importateur ne disposent d'aucun contrat d'exclusivité; il n'y a donc aucune objection à conclure un contrat avec le même fournisseur pour importer et vendre ses produits, même à un prix différent de celui pratiqué par le premier importateur. Dans le second cas, le premier importateur détient un contrat d'exclusivité et le second persuade le fournisseur de le rompre pour signer un contrat avec lui. Cette pratique est interdite car elle sème la discorde entre musulmans, et le Département a cité un hadith interdisant de concurrencer les ventes d'autrui. En conclusion, en l'absence de contrat d'exclusivité, comme dans le cas présent, le second importateur est autorisé à importer l'ouvrage et à le vendre au prix qu'il juge approprié."
  tr: "Pazarda bir temsilci tarafından satılan tıbbi kitabın ithalatıyla ilgili bir soruya yanıt verdi; Ürdün Genel Fetva Dairesi, münhasır vekaletname yoksa kitabı satmanın zararı olmadığını ve mevcut münhasır vekaletnamenin iptal edilmesinin yasak olduğunu belirtti. Departman, satıştaki temerrüdün rızaya dayalı olduğunu ve konunun iki dava olduğunu yanıtladı. Birincisi, tedarikçi ile ilk ithalatçı arasında münhasır vekaletname konusunda anlaşma olmamalı, bu nedenle aynı tedarikçiyle mallarını ithal edip satmak için sözleşme yapmakta zarar görmez, fiyat ilk ithalatçıdan farklı olsa bile. İkincisi, ilk ithalatçının münhasır vekaletname almış olması ve tedarikçinin tedarikçiyi sözleşmeyi feshetmeye ve yeni bir vekaletname yapmaya ikna etmeye çalışmasıdır; çünkü bu yasaktır çünkü Müslümanlar arasında düşmanlık tohumlanır. Bazılarını diğerlerine tercih etmeyi yasaklayan hadisi alıntıladım. Soruda olduğu gibi münhasır bir ajans üzerinde anlaşma olmadığı sürece, ikinci ithalatçının kitabı getirip uygun gördüğü fiyata satmasının bir zararı olmadığını belirtmiştir."
  id: "Pertanyaan tentang impor buku medis yang dijual oleh agen di pasar, di mana Departemen Fatwa Umum Yordania menjawab bahwa tidak ada salahnya menjualnya jika tidak ada surat kuasa eksklusif, dan bahwa upaya mencabut surat kuasa eksklusif yang ada dilarang. Departemen menjawab bahwa kegagalan penjualan bersifat konsensual dan masalah ini memiliki dua kasus. Pertama, tidak boleh ada kesepakatan antara pemasok dan importir pertama mengenai surat kuasa eksklusif, jadi tidak ada salahnya mengontrak dengan pemasok yang sama untuk mengimpor dan menjual barang mereka, bahkan dengan harga yang berbeda dari importir pertama. Yang kedua adalah importir pertama telah memperoleh surat kuasa eksklusif, sehingga importir pertama berusaha membujuk pemasok untuk mengakhiri kontrak dan membuat kontrak baru, karena hal ini dilarang karena menimbulkan permusuhan di antara umat Muslim. Saya mengutip hadits yang melarang menjual beberapa kontrak dibandingkan yang lain. Pengadilan menyimpulkan bahwa selama tidak ada kesepakatan mengenai agen eksklusif, seperti dalam pertanyaan, tidak ada kerugian bagi importir kedua untuk membawa buku dan menjualnya pada harga yang dianggap sesuai."
