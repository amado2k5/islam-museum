id: work/fatwa-aliftaa-jo-umra-on-behalf-of-a-sick-father
class: work
kind: fatwa
label: { ar: "شروط الإنابة في الحج أو العمرة عن المريض", en: "Conditions for performing hajj or umrah on behalf of a sick person", ur: "بیمار کی طرف سے حج یا عمرہ کی نیابت کی شرائط", es: "Condiciones para realizar el Hajj o la Umrah en nombre de una persona enferma.", fr: "Conditions pour accomplir le hajj ou la umra au nom d'une personne malade" }
summary:
  ar: "سؤال عن توكيل شخص يؤدي العمرة عن أب مريض بنية الشفاء، أجابت فيه دائرة الإفتاء العام الأردنية بأن الإنابة تجوز عن العاجز عجزًا لا يُرجى زواله وبإذنه، ولا بأس بنية الشفاء. أجابت الدائرة بأن الحج والعمرة فُرضا مرة في العمر، وأن من عجز عنهما لمرض لا يُرجى زواله أو كبر سن جاز له أن ينيب غيره فيهما، بل يجب عليه في الفرض، ونقلت ذلك عن الشرواني في حاشيته على تحفة المحتاج، وتعريف المعضوب من المجموع للنووي. واشترطت إذن المعضوب لأنه حي له إرادة واختيار، ونقلت عن النووي في روضة الطالبين أن الحج عنه لا يجزئ بغير إذنه، وقالت إن المرض العارض الذي يُرجى زواله لا تجوز معه الإنابة. وقالت إنه لا بأس أن تكون العمرة بنية الشفاء، لأن طلب الشفاء دعاء، ويستحب تقديم عمل صالح بين يدي الدعاء. وخلصت إلى أن من تحققت له الاستطاعة ثم عجز يجب عليه أن ينيب، ويجوز للعاجز الإنابة في النافلة، وأن على النائب أن يستأذن المنوب عنه وأن يكون قد حج أو اعتمر عن نفسه."
  en: "A question on appointing someone to perform umrah for a sick father with the intention of his recovery, in which Jordan's General Iftaa Department answered that proxy performance is allowed for someone permanently unable, with his permission, and that intending recovery is fine. The Department answered that hajj and umrah are obligatory once in a lifetime, and that someone unable to perform them because of an illness not expected to pass, or old age, may appoint another to perform them, and must do so for the obligatory one, citing al-Shirwani's gloss on Tuhfat al-Muhtaj and the definition of the permanently disabled (al-ma'dub) in al-Nawawi's al-Majmu'. It required the disabled person's permission, since he is alive with his own will and choice, quoting al-Nawawi's Rawdat al-Talibin that hajj for him without his permission does not count, and said a passing illness expected to heal does not allow a proxy. It said there is nothing wrong with the umrah being intended for recovery, since seeking recovery is a supplication and offering a good deed before supplicating is recommended. It concluded that someone who became able and then lost the ability must appoint a proxy, that the disabled may appoint one for voluntary hajj and umrah too, and that the proxy must have the person's permission and must already have performed hajj or umrah for himself."
  ur: "ایک بیمار والد کی طرف سے شفا کی نیت سے عمرہ ادا کرنے کے لیے کسی کو مقرر کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مستقل طور پر عاجز شخص کی طرف سے اس کی اجازت سے نیابت جائز ہے، اور شفا کی نیت میں حرج نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ حج اور عمرہ زندگی میں ایک بار فرض ہیں، اور جو ایسی بیماری جس کے ختم ہونے کی امید نہ ہو یا بڑھاپے کی وجہ سے انہیں ادا نہ کر سکے وہ کسی اور کو نائب بنا سکتا ہے، اور فرض میں ایسا کرنا لازم ہے، اور اس پر تحفۃ المحتاج پر شروانی کے حاشیے اور نووی کی المجموع میں معضوب کی تعریف سے استدلال کیا۔ اس نے معضوب کی اجازت کو شرط قرار دیا کیونکہ وہ زندہ ہے اور اپنی مرضی و اختیار رکھتا ہے، اور نووی کی روضۃ الطالبین سے نقل کیا کہ اس کی اجازت کے بغیر اس کی طرف سے حج کافی نہیں، اور کہا کہ عارضی بیماری جس سے شفا کی امید ہو نیابت کی اجازت نہیں دیتی۔ اس نے کہا کہ عمرے کا شفا کی نیت سے ہونا درست ہے، کیونکہ شفا طلب کرنا دعا ہے اور دعا سے پہلے نیک عمل پیش کرنا مستحب ہے۔ اس نے نتیجہ نکالا کہ جسے استطاعت حاصل ہوئی پھر وہ عاجز ہو گیا اس پر نائب بنانا لازم ہے، عاجز نفلی حج و عمرہ میں بھی نائب بنا سکتا ہے، اور نائب کے لیے اجازت لینا اور پہلے اپنی طرف سے حج یا عمرہ کر چکا ہونا ضروری ہے۔"
  es: "Una pregunta sobre la designación de alguien para realizar la umrah por un padre enfermo con la intención de su recuperación, en la que el Departamento General de Iftaa de Jordania respondió que la realización por poder está permitida para alguien permanentemente incapacitado, con su permiso, y que la intención de recuperación es aceptable. El Departamento respondió que el hajj y la umrah son obligatorios una vez en la vida, y que alguien que no puede realizarlos debido a una enfermedad que no se espera que pase, o a la vejez, puede designar a otra persona para que los realice, y debe hacerlo para el obligatorio, citando la glosa de al-Shirwani sobre Tuhfat al-Muhtaj y la definición de discapacitado permanente (al-ma'dub) en al-Majmu' de al-Nawawi. Requirió el permiso de la persona discapacitada, ya que está viva con su propia voluntad y elección, citando el Rawdat al-Talibin de al-Nawawi que dice que el hajj para él sin su permiso no cuenta, y dijo que una enfermedad pasajera que se espera que se cure no permite un poder. Afirmó que no hay nada de malo en que la umrah tenga como objetivo la recuperación, ya que buscar la recuperación es una súplica y se recomienda realizar una buena acción antes de suplicar. Concluyó que quien recuperó la capacidad y luego la perdió debe designar un representante, que la persona discapacitada también puede designar uno para el hajj y la umrah voluntarios, y que el representante debe contar con el permiso de la persona y haber realizado previamente el hajj o la umrah por sí misma."
  fr: "Une question portait sur la possibilité de désigner une personne pour accomplir la umra à la place d'un père malade, dans l'espoir de sa guérison. Le Département général de la Iftaa de Jordanie a répondu que l'accomplissement du pèlerinage par procuration est autorisé pour une personne en incapacité permanente, avec son consentement, et que l'intention de guérison est légitime. Le Département a précisé que le hajj et la umra sont obligatoires une fois dans la vie et que toute personne incapable de les accomplir en raison d'une maladie incurable ou de son âge avancé peut désigner une autre personne pour les accomplir, et doit le faire pour elle. Il s'appuie sur le commentaire d'al-Shirwani sur Tuhfat al-Muhtaj et sur la définition de l'incapacité permanente (al-ma'dub) dans al-Majmu' d'al-Nawawi. Le Département exige le consentement de la personne handicapée, puisqu'elle est vivante et libre de ses choix. Il cite Rawdat al-Talibin d'al-Nawawi, selon lequel le hajj accompli sans son consentement n'est pas valable, et précise qu'une maladie passagère dont on attend la guérison ne justifie pas la désignation d'une procuration. Il a été précisé qu'il n'y a rien de mal à ce que la umra soit accomplie dans un but de guérison, car la recherche de la guérison est une invocation et il est recommandé d'accomplir une bonne action avant de formuler une telle invocation. Il a été conclu qu'une personne qui avait recouvré la capacité de commémorer un pèlerinage puis l'a perdue doit désigner un mandataire, que les personnes handicapées peuvent également en désigner un pour le hajj et la umra surérogatoires, et que le mandataire doit avoir l'autorisation du pèlerin et avoir déjà accompli lui-même le hajj ou la umra."
