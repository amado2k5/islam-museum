id: work/fatwa-aliftaa-jo-umra-on-behalf-of-a-sick-father
class: work
kind: fatwa
label: { ar: "شروط الإنابة في الحج أو العمرة عن المريض", en: "Conditions for performing hajj or umrah on behalf of a sick person", ur: "بیمار کی طرف سے حج یا عمرہ کی نیابت کی شرائط" }
summary:
  ar: "سؤال عن توكيل شخص يؤدي العمرة عن أب مريض بنية الشفاء، أجابت فيه دائرة الإفتاء العام الأردنية بأن الإنابة تجوز عن العاجز عجزًا لا يُرجى زواله وبإذنه، ولا بأس بنية الشفاء. أجابت الدائرة بأن الحج والعمرة فُرضا مرة في العمر، وأن من عجز عنهما لمرض لا يُرجى زواله أو كبر سن جاز له أن ينيب غيره فيهما، بل يجب عليه في الفرض، ونقلت ذلك عن الشرواني في حاشيته على تحفة المحتاج، وتعريف المعضوب من المجموع للنووي. واشترطت إذن المعضوب لأنه حي له إرادة واختيار، ونقلت عن النووي في روضة الطالبين أن الحج عنه لا يجزئ بغير إذنه، وقالت إن المرض العارض الذي يُرجى زواله لا تجوز معه الإنابة. وقالت إنه لا بأس أن تكون العمرة بنية الشفاء، لأن طلب الشفاء دعاء، ويستحب تقديم عمل صالح بين يدي الدعاء. وخلصت إلى أن من تحققت له الاستطاعة ثم عجز يجب عليه أن ينيب، ويجوز للعاجز الإنابة في النافلة، وأن على النائب أن يستأذن المنوب عنه وأن يكون قد حج أو اعتمر عن نفسه."
  en: "A question on appointing someone to perform umrah for a sick father with the intention of his recovery, in which Jordan's General Iftaa Department answered that proxy performance is allowed for someone permanently unable, with his permission, and that intending recovery is fine. The Department answered that hajj and umrah are obligatory once in a lifetime, and that someone unable to perform them because of an illness not expected to pass, or old age, may appoint another to perform them, and must do so for the obligatory one, citing al-Shirwani's gloss on Tuhfat al-Muhtaj and the definition of the permanently disabled (al-ma'dub) in al-Nawawi's al-Majmu'. It required the disabled person's permission, since he is alive with his own will and choice, quoting al-Nawawi's Rawdat al-Talibin that hajj for him without his permission does not count, and said a passing illness expected to heal does not allow a proxy. It said there is nothing wrong with the umrah being intended for recovery, since seeking recovery is a supplication and offering a good deed before supplicating is recommended. It concluded that someone who became able and then lost the ability must appoint a proxy, that the disabled may appoint one for voluntary hajj and umrah too, and that the proxy must have the person's permission and must already have performed hajj or umrah for himself."
  ur: "ایک بیمار والد کی طرف سے شفا کی نیت سے عمرہ ادا کرنے کے لیے کسی کو مقرر کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مستقل طور پر عاجز شخص کی طرف سے اس کی اجازت سے نیابت جائز ہے، اور شفا کی نیت میں حرج نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ حج اور عمرہ زندگی میں ایک بار فرض ہیں، اور جو ایسی بیماری جس کے ختم ہونے کی امید نہ ہو یا بڑھاپے کی وجہ سے انہیں ادا نہ کر سکے وہ کسی اور کو نائب بنا سکتا ہے، اور فرض میں ایسا کرنا لازم ہے، اور اس پر تحفۃ المحتاج پر شروانی کے حاشیے اور نووی کی المجموع میں معضوب کی تعریف سے استدلال کیا۔ اس نے معضوب کی اجازت کو شرط قرار دیا کیونکہ وہ زندہ ہے اور اپنی مرضی و اختیار رکھتا ہے، اور نووی کی روضۃ الطالبین سے نقل کیا کہ اس کی اجازت کے بغیر اس کی طرف سے حج کافی نہیں، اور کہا کہ عارضی بیماری جس سے شفا کی امید ہو نیابت کی اجازت نہیں دیتی۔ اس نے کہا کہ عمرے کا شفا کی نیت سے ہونا درست ہے، کیونکہ شفا طلب کرنا دعا ہے اور دعا سے پہلے نیک عمل پیش کرنا مستحب ہے۔ اس نے نتیجہ نکالا کہ جسے استطاعت حاصل ہوئی پھر وہ عاجز ہو گیا اس پر نائب بنانا لازم ہے، عاجز نفلی حج و عمرہ میں بھی نائب بنا سکتا ہے، اور نائب کے لیے اجازت لینا اور پہلے اپنی طرف سے حج یا عمرہ کر چکا ہونا ضروری ہے۔"
