label: { ar: "كيفية شكر الله تعالى على نعمة المطر", en: "How to thank God for the blessing of rain", ur: "بارش کی نعمت پر اللہ کا شکر کیسے ادا کریں", es: "Cómo agradecer a Dios por la bendición de la lluvia", fr: "Comment remercier Dieu pour la bénédiction de la pluie", tr: "Yağmurun bereketi için Yüce Allah'a nasıl şükredilir", id: "Bagaimana bersyukur kepada Allah Yang Maha Kuasa atas berkah hujan" }
summary:
  ar: "سائل سأل عن كيفية شكر الله على نعمة المطر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22283)⁩ أن المطر من نعم الله التي تستوجب الشكر عليها وشكرها بالفرح بها ثم العمل بموجب هذا الشكر، على ما فصّل الجواب من آداب استقبال المطر."
  en: "A questioner asked how to thank God for the blessing of rain. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22283) answered that rain is among God's blessings that call for gratitude — thanked by rejoicing in it and then acting in consequence of that gratitude — and the answer sets out the etiquettes of welcoming rain."
  ur: "ایک سائل نے بارش کی نعمت پر اللہ کا شکر ادا کرنے کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22283)⁩ نے جواب دیا کہ بارش اللہ کی نعمتوں میں سے ہے جس پر شکر واجب ہے — اس میں خوشی اور پھر اس شکر کے تقاضے پر عمل — اور جواب میں بارش کے استقبال کے آداب بھی بیان ہوئے۔"
  es: "Una persona preguntó cómo agradecer a Dios por la bendición de la lluvia. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22283) respondió que la lluvia es una de las bendiciones de Dios que merecen gratitud —agradecida con alegría y actuando en consecuencia de esa gratitud— y la respuesta establece las normas de etiqueta para dar la bienvenida a la lluvia."
  fr: "Un internaute a demandé comment remercier Dieu pour la bénédiction de la pluie. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22283) a répondu que la pluie fait partie des bienfaits divins qui appellent la gratitude – une gratitude qui se manifeste par la joie et des actions concrètes – et la réponse expose les règles de bienséance à respecter pour accueillir la pluie."
  tr: "Bir soru soran kişi, yağmurun bereketi için Allah'a nasıl şükredilir diye sormuştur. Mısırlı Dar al-Ifta (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 22283) yağmurun Allah'ın nimetlerinden biri olduğunu, şükran ve sevinçle şükretmeyi ve ardından bu şükran üzerine hareket etmeyi gerektirdiğini yanıtlamıştır; bu da yağmur alma görgü kurallarında belirtilmiştir."
  id: "Seorang penanya bertanya bagaimana cara bersyukur kepada Allah atas berkah hujan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22283) menjawab bahwa hujan adalah salah satu berkat Allah yang membutuhkan kesyukuran dan syukur dengan sukacita lalu bertindak berdasarkan syukur tersebut, sebagaimana dijelaskan dalam etika menerima hujan."
