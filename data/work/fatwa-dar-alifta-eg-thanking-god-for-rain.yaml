label: { ar: "كيفية شكر الله تعالى على نعمة المطر", en: "How to thank God for the blessing of rain", ur: "بارش کی نعمت پر اللہ کا شکر کیسے ادا کریں" }
summary:
  ar: "سائل سأل عن كيفية شكر الله على نعمة المطر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22283)⁩ أن المطر من نعم الله التي تستوجب الشكر عليها وشكرها بالفرح بها ثم العمل بموجب هذا الشكر، على ما فصّل الجواب من آداب استقبال المطر."
  en: "A questioner asked how to thank God for the blessing of rain. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22283) answered that rain is among God's blessings that call for gratitude — thanked by rejoicing in it and then acting in consequence of that gratitude — and the answer sets out the etiquettes of welcoming rain."
  ur: "ایک سائل نے بارش کی نعمت پر اللہ کا شکر ادا کرنے کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22283)⁩ نے جواب دیا کہ بارش اللہ کی نعمتوں میں سے ہے جس پر شکر واجب ہے — اس میں خوشی اور پھر اس شکر کے تقاضے پر عمل — اور جواب میں بارش کے استقبال کے آداب بھی بیان ہوئے۔"
