id: work/fatwa-amja-speaking-of-deceased-nonmuslim
class: work
kind: fatwa
label: { ar: "هل يجوز قول هذا ⁦(سؤال عن سب الميت غير المسلم والترحم عليه)⁩", en: "May one say this? ⁦(reviling a deceased non-Muslim vs praying for mercy on him)⁩", ur: "کیا یہ کہنا جائز ہے؟ ⁦(غیر مسلم مردہ کی مذمت بمقابلہ اس پر رحمت کی دعا)⁩", es: "¿Puedo decir esto? (insultar a un no musulmán fallecido frente a pedir misericordia para él)", fr: "Peut-on dire cela ? (Insulter un défunt non musulman au lieu de prier pour sa miséricorde)" }
summary:
  ar: "أجاب مجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87573 بتاريخ 12 أكتوبر 2012)⁩ أن من مات من غير المسلمين فقد أفضى إلى ما قدم، فلا يجوز سبّه لحديث النهي عن سب الأموات، ويشرع الإحسان إلى أهله وتعزيتهم به وإرفاقهم بما يحتاجونه من مال وعون عند الاقتضاء؛ وأما الترحم عليه والاستغفار له فلا يحل لقوله تعالى في النهي عن الاستغفار للمشركين."
  en: "The Assembly of Muslim Jurists of America (fatwa no. 87573, 12 October 2012) answered that a non-Muslim who has died has passed on to what he sent ahead: he may not be reviled, per the hadith forbidding abuse of the dead; kindness to his family is prescribed — condolence, and help with money and support where appropriate; but praying mercy and forgiveness for him is not permitted, citing the verse that bars seeking forgiveness for polytheists after it became clear they were people of the Fire."
  ur: "ایسملی آف مسلم جورسٹس آف امریکہ ⁦(فتویٰ نمبر 87573، 12 اکتوبر 2012)⁩ نے جواب دیا کہ غیر مسلم جو مر گیا وہ اپنے بھیجے ہوئے اعمال پر پہنچ چکا: اس کی مذمت جائز نہیں، مردوں کی برائی سے روکنے والی حدیث کے مطابق؛ اس کے اہل و عیال کے ساتھ احسان مشروع ہے — تعزیت، اور مناسب موقع پر مال و مدد؛ لیکن اس کے لیے رحمت اور مغفرت کی دعا حلال نہیں، اس آیت کے سبب جو مشرکین کے لیے مغفرت مانگنے سے روکتی ہے جب ان پر ظاہر ہو چکا کہ وہ اہلِ دوزخ ہیں۔"
  es: "La Asamblea de Juristas Musulmanes de América (fatwa n.º 87573, 12 de octubre de 2012) respondió que un no musulmán que ha fallecido ha pasado a lo que envió por adelantado: no se le puede insultar, según el hadiz que prohíbe el abuso de los muertos; se prescribe la bondad hacia su familia: condolencias y ayuda económica y apoyo cuando sea apropiado; pero no está permitido pedir misericordia y perdón por él, citando el versículo que prohíbe pedir perdón por los politeístas después de que se hizo evidente que eran gente del Fuego."
  fr: "L'Assemblée des juristes musulmans d'Amérique (fatwa n° 87573, 12 octobre 2012) a répondu qu'un non-musulman décédé est parvenu à ce qu'il avait prédestiné: il ne peut être injurié, conformément au hadith interdisant les outrages aux morts; la bienveillance envers sa famille est prescrite — condoléances, aide financière et soutien le cas échéant —; mais il n'est pas permis de prier pour lui, citant le verset qui interdit de demander pardon pour les polythéistes après qu'il soit devenu clair qu'ils étaient des gens du Feu."
