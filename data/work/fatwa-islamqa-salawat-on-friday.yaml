id: work/fatwa-islamqa-salawat-on-friday
class: work
kind: fatwa
label: { ar: "لماذا يُستحب الإكثار من الصلاة على النبي يوم الجمعة؟", en: "Why invoking blessings on the Prophet is increased on Friday", ur: "جمعہ کے دن نبی پر کثرت سے درود کیوں مستحب ہے؟" }
summary:
  ar: "سؤال عن سبب تخصيص يوم الجمعة بالصلاة على النبي. أجاب موقع الإسلام سؤال وجواب بأن الصلاة عليه مشروعة في كل وقت، وأن المخصوص بيوم الجمعة هو الحث على الإكثار منها، لفضيلة هذا اليوم ولأن الصلاة عليه تُعرض عليه فيه عرضًا خاصًّا كما ورد في السنة، وذكر أن أهل العلم التمسوا حكمًا أخرى، وأن الأصل في ذلك الامتثال أُدركت الحكمة أم لم تُدرك."
  en: "A question on why Friday is singled out for invoking blessings on the Prophet. IslamQA answered that invoking blessings on him is prescribed at all times, and what is particular to Friday is the encouragement to do it often, because of the merit of the day and because, as reported in the sunna, the blessings are presented to him on that day in a special way; scholars have suggested further wisdoms, and the basis remains obedience whether or not the wisdom is grasped."
  ur: "یہ سوال کہ جمعہ کو درود کے لیے کیوں خاص کیا گیا۔ اسلام سوال و جواب نے جواب دیا کہ نبی پر درود ہر وقت مشروع ہے، اور جمعہ کی خصوصیت اس کی کثرت کی ترغیب ہے، اس دن کی فضیلت کی وجہ سے اور اس لیے کہ سنت کے مطابق اس دن درود خاص طور پر ان پر پیش کیا جاتا ہے؛ علماء نے اور حکمتیں بھی ذکر کی ہیں، اور بنیاد اطاعت ہے، حکمت سمجھ میں آئے یا نہ آئے۔"
