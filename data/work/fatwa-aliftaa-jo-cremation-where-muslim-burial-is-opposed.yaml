id: work/fatwa-aliftaa-jo-cremation-where-muslim-burial-is-opposed
class: work
kind: fatwa
label: { ar: "حرق الميت في بلد يعترض على الدفن", en: "Cremation where Muslim burial is opposed", ur: "جہاں مسلم تدفین پر اعتراض ہو وہاں میت کو جلانا" }
summary:
  ar: "سؤال عن حرق الميت في بلد يعترض على الدفن، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم حرق جثة الميت لما فيه من الإزراء به والحط من كرامته، ويجب البحث عن طريقة لدفنه وفق الشريعة ولو بنقله إلى منطقة أخرى. أجابت الدائرة بأن الإسلام كرم الإنسان حيًا وميتًا، ومن ذلك تغسيله وتكفينه والصلاة عليه ودفنه، واستشهدت بـ[[passage/quran-17-70|سورة الإسراء 17:70]]، وبحديث رواه أبو داود في سننه معناه أن كسر عظم الميت ككسره حيًا. وقالت إن حرق الجثة محرم لما فيه من إيذاء الميت وامتهانه والإزراء به وذهاب معالم صورته، وذكرت أن الفقهاء منعوا القصاص على وجه يفسد الجثة، ونقلت عن الجويني في نهاية المطلب (16/147) أن بعض الشافعية منعوا القصاص بالسم حفظًا للجثة لأن جسد الميت محترم. وخلصت إلى وجوب البحث عن طريقة لدفن الميت توافق الشريعة، ولو اقتضى ذلك نقله إلى منطقة أخرى يمكن دفنه فيها."
  en: "A question about cremation where Muslim burial is opposed, in which Jordan's General Iftaa Department answered that cremating a corpse is forbidden because it degrades the dead and violates their dignity, and that a way must be found to bury the dead according to the Shari'a, even by moving the body to another area. The Department answered that Islam honours the human being alive and dead, including by washing, shrouding, praying over and burying the dead, citing [[passage/quran-17-70|Surat al-Isra' 17:70]] and a hadith narrated by Abu Dawud in his Sunan whose meaning is that breaking a dead person's bone is like breaking it while alive. It said burning the corpse is forbidden because it harms, demeans and degrades the dead and erases the features of the body, noting that jurists disallowed carrying out retaliation in a way that ruins the body, and quoting al-Juwayni in Nihayat al-Matlab (16/147) that some Shafi'is disallowed retaliation by poison to protect the corpse, since the body of the dead is inviolable. It concluded that a way must be found to bury the dead in accordance with the Shari'a, even if that requires moving the body to another area where burial is possible."
  ur: "جہاں مسلم تدفین پر اعتراض ہو وہاں میت کو جلانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ میت کی لاش جلانا حرام ہے کیونکہ اس میں میت کی تذلیل اور اس کی کرامت کی پامالی ہے، اور شریعت کے مطابق تدفین کا طریقہ تلاش کرنا واجب ہے چاہے لاش کو کسی دوسرے علاقے میں منتقل کرنا پڑے۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے انسان کو زندگی اور موت دونوں میں عزت دی ہے، جس میں میت کو غسل دینا، کفن دینا، نمازِ جنازہ اور تدفین شامل ہیں، اور [[passage/quran-17-70|سورۃ الاسراء 17:70]] اور ابو داود کی سنن میں روایت کردہ حدیث کا حوالہ دیا جس کا مفہوم ہے کہ میت کی ہڈی توڑنا زندہ کی ہڈی توڑنے کی طرح ہے۔ اس نے کہا کہ لاش جلانا حرام ہے کیونکہ اس میں میت کو اذیت، اس کی توہین و تذلیل اور جسم کے نقوش کا مٹ جانا ہے، اور بتایا کہ فقہا نے ایسے طریقے سے قصاص کو منع کیا جو لاش کو بگاڑ دے، اور نہایۃ المطلب (16/147) میں جوینی سے نقل کیا کہ بعض شافعیوں نے لاش کی حفاظت کے لیے زہر سے قصاص کو منع کیا کیونکہ میت کا جسم محترم ہے۔ اس نے نتیجہ نکالا کہ شریعت کے مطابق میت کی تدفین کا طریقہ تلاش کرنا واجب ہے، چاہے اس کے لیے لاش کو کسی ایسے علاقے میں منتقل کرنا پڑے جہاں تدفین ممکن ہو۔"
