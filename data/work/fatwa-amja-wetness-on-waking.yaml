id: work/fatwa-amja-wetness-on-waking
class: work
kind: fatwa
label: { ar: "البلل عند الاستيقاظ", en: "Wetness found on waking — the three cases", ur: "جاگنے پر گیلاپن — تین صورتیں", es: "Humedad encontrada al despertar: los tres casos", fr: "Humidité constatée au réveil — les trois cas", tr: "Uyanırken ıslaklık", id: "Kelembapan saat bangun" }
summary:
  ar: "سأل سائل إذا استيقظ فوجد بللًا في ثيابه ما الحكم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78365 بتاريخ 27 مارس 2009)⁩ أنه لا يخلو من ثلاث حالات: أن يتيقن أنه مني فيجب حينئذ الاغتسال سواء ذكر احتلامًا أم لم يذكر، أو يتيقن أنه ليس بمني فلا يجب عليه شيء، أو يشك فيه فليرجع فيه إلى القرائن والدلائل على ما فصّل الجواب."
  en: "A questioner found wetness in his clothes on waking. Dr. Salah al-Sawi (fatwa no. 78365, 27 March 2009) answered that it is one of three cases: certain it is semen — the washing binds, whether he recalls a dream or not; certain it is not semen — nothing binds; or doubtful — he refers it to the signs and indicators, as the answer details."
  ur: "جاگتے گیلا پایا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78365، 27 مارچ 2009)⁩ کے مطابق تین صورتیں — منی یقینی ہو تو غسل، نہ ہو تو کچھ نہیں، شک ہو تو قرائن دیکھے۔"
  es: "Un consultante encontró su ropa mojada al despertar. El Dr. Salah al-Sawi (fatwa n.° 78365, 27 de marzo de 2009) respondió que se trata de uno de tres casos: seguro que es semen —el lavado lo confirma, independientemente de si recuerda un sueño o no—; seguro que no es semen —no hay nada que lo confirme—; o dudoso —se remite a los signos e indicadores, como se detalla en la respuesta—."
  fr: "Un homme a constaté que ses vêtements étaient humides au réveil. Le Dr Salah al-Sawi (fatwa n° 78365, 27 mars 2009) a répondu qu'il existe trois cas: soit il s'agit certainement de sperme – le lavage est efficace, qu'il se souvienne ou non d'un rêve; soit il ne s'agit certainement pas de sperme – rien ne se passe; soit il y a doute – il faut se référer aux signes et indicateurs, comme le précise la réponse."
  tr: "Bir soruya soran kişiye şöyle soruldu: Uyanınca kıyafetleri ıslak olduğunda karar nedir? Dr. Salah Al-Sawy (27 Mart 2009 tarihli 78365 sayılı fetva) üç durum olduğunu yanıtladı: eğer sperm olduğundan eminse, onu ıslak rüya olarak ansa da etmese de hüslü yapmak zorundadır; ya da sperm olmadığından ve bir yükümlülüğü olmadığından eminse; ya da şüphe ederse, cevapta detaylandırılan delil ve göstergelere başvurmalıdır."
  id: "Seorang penanya ditanya: Ketika dia bangun dan mendapati pakaiannya basah, apa putusannya? Dr. Salah Al-Sawy menjawab (Fatwa No. 78365 tanggal 27 Maret 2009) bahwa ada tiga kasus: jika dia yakin bahwa dia adalah sperma, maka dia harus melakukan ghusl apakah dia menyebutnya sebagai mimpi basah atau bukan; atau jika dia yakin itu bukan sperma dan tidak ada kewajiban padanya; atau jika dia meragukannya, dia harus merujuk pada bukti dan indikasi sebagaimana dijelaskan dalam jawaban."
