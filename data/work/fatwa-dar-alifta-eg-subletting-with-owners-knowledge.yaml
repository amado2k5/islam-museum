id: work/fatwa-dar-alifta-eg-subletting-with-owners-knowledge
class: work
kind: fatwa
label: { ar: "حكم إعادة تأجير العين المستأجرة بعلم صاحبها", en: "Subletting the rented item with the owner's knowledge", ur: "مالک کی اجازت سے کرایے کی چیز دوبارہ کرایہ دینا", es: "Subarrendar el artículo alquilado con el conocimiento del propietario.", fr: "Sous-louer l'objet loué avec l'accord du propriétaire", tr: "Kiralanan mülkün sahibinin bilgisiyle yeniden kiralanmasına ilişkin karar", id: "Memutuskan Penyewaan Kembali Properti Sewaan dengan sepengetahuan pemilik" }
summary:
  ar: "سائل سأل عن إعادة تأجير الدراجات النارية المستأجرة بعلم مالكها بأجرة زائدة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20675)⁩ أنه يجوز شرعًا لمستأجرها من مالكها أن يؤجرها في المصايف بأجرة زائدة عن الثمن الذي استأجرها به على ما فصّل الجواب من الشرط."
  en: "A questioner asked about re-letting rented motorcycles at a higher rent with the owner's knowledge. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20675) answered that the lessee may sublet them at a higher rent — with the conditions set out in the answer."
  ur: "ایک سائل نے مالک کی اجازت سے کرایہ لی ہوئی موٹر سائیکلیں زیادہ کرایہ پر دوبارہ کرایہ دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20675)⁩ نے جواب دیا کہ شرائط کے ساتھ جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de subarrendar motocicletas alquiladas a un precio más alto con el conocimiento del propietario. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20675) respondió que el arrendatario puede subarrendarlas a un precio más alto, con las condiciones que se detallan en la respuesta."
  fr: "Un internaute a demandé s'il était possible de sous-louer une moto à un loyer plus élevé avec l'accord du propriétaire. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20675) a répondu que le locataire pouvait sous-louer la moto à un loyer plus élevé, sous réserve des conditions énoncées dans la réponse."
  tr: "Bir soru soran kişi, sahibinin bilgisiyle kiralanan motosikletleri ek ücret karşılığında yeniden kiralama hakkında bilgi aldı. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20675), ev sahibinden bir kiracının, yazlık tatil köylerinde kiraladığı fiyatı aşan bir ücretle kiraya vermesinin dini olarak uygun olduğunu yanıtladı; bu cevapta detaylandırıldı."
  id: "Seorang penanya menanyakan tentang penyewaan kembali sepeda motor sewaan dengan pengetahuan pemilik dengan biaya tambahan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20675) menjawab bahwa secara hukum diperbolehkan bagi penyewa dari pemilik untuk menyewakannya di resor musim panas dengan biaya yang melebihi harga sewaan, seperti yang dijelaskan dalam jawaban."
