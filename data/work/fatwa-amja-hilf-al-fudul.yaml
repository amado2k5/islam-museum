id: work/fatwa-amja-hilf-al-fudul
class: work
kind: fatwa
label: { ar: "حلف الفضول", en: "The pact of al-Fudul — its story and its meaning", ur: "حلف الفضول — کہانی اور دلالت" }
summary:
  ar: "سأل سائل عن مقومات ودلالة حلف الفضول. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76805 بتاريخ 8 نوفمبر 2008)⁩ أن خبره أنه قد اجتمعت قبائل من قريش فتعاقدوا وتعاهدوا على أن لا يجدوا بمكة مظلومًا من أهلها وغيرهم ممن دخلها من سائر الناس إلا قاموا معه وكانوا على من ظلمه حتى ترد عليه مظلمته فسمت قريش ذلك الحلف حلف الفضول، وروى الحميدي عن عبد الله وعبد الرحمن ابني أبي بكر قالا قال رسول الله لقد شهدت في دار عبد الله بن جدعان حلفًا لو دعيت به في الإسلام لأجبت تحالفوا أن ترد الفضول على أهلها وألا يعز ظالم مظلومًا، ودلالته أن عموم التعاون على البر والتقوى مشروع."
  en: "A questioner asked for the basis and meaning of the pact of al-Fudul. Dr. Salah al-Sawi (fatwa no. 76805, 8 November 2008) answered that Quraysh clans gathered and covenanted that they would find no wronged person in Mecca — of its people or of outsiders entering it — without standing with him against his wronger until his wrong was restored, Quraysh naming it the pact of al-Fudul; al-Humaydi relates the two sons of Abu Bakr saying the Prophet said 'I witnessed in the house of Abdullah ibn Jud'an a pact — were I called to it in Islam I would answer; they covenanted that wrongs be returned to their owners and no wronger prevail over the wronged'. Its meaning: general cooperation in righteousness and piety is commended."
  ur: "ایک سائل نے حلف الفضول کی بنیاد اور دلالت پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76805، 8 نومبر 2008)⁩ کے مطابق قریش قبائل نے مکہ کے ہر مظلوم کے ساتھ کھڑے ہونے کا عہد کیا؛ نبی نے فرمایا اسلام میں بھی اس پر بلایا جائے تو قبول کریں — بر اور تقویٰ میں تعاون مشروع ہے۔"
