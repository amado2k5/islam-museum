label: { ar: "حلف الفضول", en: "The pact of al-Fudul — its story and its meaning", ur: "حلف الفضول — کہانی اور دلالت", es: "El pacto de al-Fudul: su historia y su significado.", fr: "Le pacte d'al-Fudul — son histoire et sa signification", tr: "Erdemlilerin İttifakı", id: "Aliansi Orang-orang Berbudi Luhur" }
summary:
  ar: "سأل سائل عن مقومات ودلالة حلف الفضول. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76805 بتاريخ 8 نوفمبر 2008)⁩ أن خبره أنه قد اجتمعت قبائل من قريش فتعاقدوا وتعاهدوا على أن لا يجدوا بمكة مظلومًا من أهلها وغيرهم ممن دخلها من سائر الناس إلا قاموا معه وكانوا على من ظلمه حتى ترد عليه مظلمته فسمت قريش ذلك الحلف حلف الفضول، وروى الحميدي عن عبد الله وعبد الرحمن ابني أبي بكر قالا قال رسول الله لقد شهدت في دار عبد الله بن جدعان حلفًا لو دعيت به في الإسلام لأجبت تحالفوا أن ترد الفضول على أهلها وألا يعز ظالم مظلومًا، ودلالته أن عموم التعاون على البر والتقوى مشروع."
  en: "A questioner asked for the basis and meaning of the pact of al-Fudul. Dr. Salah al-Sawi (fatwa no. 76805, 8 November 2008) answered that Quraysh clans gathered and covenanted that they would find no wronged person in Mecca — of its people or of outsiders entering it — without standing with him against his wronger until his wrong was restored, Quraysh naming it the pact of al-Fudul; al-Humaydi relates the two sons of Abu Bakr saying the Prophet said 'I witnessed in the house of Abdullah ibn Jud'an a pact — were I called to it in Islam I would answer; they covenanted that wrongs be returned to their owners and no wronger prevail over the wronged'. Its meaning: general cooperation in righteousness and piety is commended."
  ur: "ایک سائل نے حلف الفضول کی بنیاد اور دلالت پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76805، 8 نومبر 2008)⁩ کے مطابق قریش قبائل نے مکہ کے ہر مظلوم کے ساتھ کھڑے ہونے کا عہد کیا؛ نبی نے فرمایا اسلام میں بھی اس پر بلایا جائے تو قبول کریں — بر اور تقویٰ میں تعاون مشروع ہے۔"
  es: "Un consultante preguntó por el fundamento y el significado del pacto de al-Fudul. El Dr. Salah al-Sawi (fatwa n.º 76805, 8 de noviembre de 2008) respondió que los clanes Quraysh se reunieron y se comprometieron a no encontrar a ninguna persona agraviada en La Meca —ni entre sus habitantes ni entre los forasteros que entraran en ella— sin apoyarla contra quien la había agraviado hasta que se reparara el daño causado. Los Quraysh denominaron a este pacto el pacto de al-Fudul. Al-Humaydi relata que los dos hijos de Abu Bakr dijeron que el Profeta dijo: «Presencié en la casa de Abdullah ibn Jud'an un pacto; si me llamaran a él en el Islam, respondería. Se comprometieron a que las injusticias se devolverían a sus dueños y que ningún agraviado prevalecería sobre el agraviado». Su significado: se elogia la cooperación general en la rectitud y la piedad."
  fr: "Un internaute a interrogé Salah al-Sawi sur le fondement et la signification du pacte d'al-Fudul. Dans sa fatwa n° 76805 du 8 novembre 2008, il a répondu que les clans qurayshites s'étaient réunis et avaient conclu un pacte: ne trouver à La Mecque, parmi ses habitants ou parmi les étrangers, une personne lésée, sans se tenir à ses côtés contre son agresseur jusqu'à réparation. Les Qurayshites nommèrent ce pacte « al-Fudul ». Al-Humaydi rapporte que les deux fils d'Abu Bakr ont dit que le Prophète a dit: « J'ai été témoin d'un pacte dans la maison d'Abdullah ibn Jud'an. Si j'étais appelé à le reconnaître en Islam, je répondrais. Ils ont convenu que les torts seraient rendus à leurs auteurs et qu'aucun agresseur ne l'emporterait sur la victime. » Ce pacte signifie que la coopération générale dans la droiture et la piété est encouragée."
