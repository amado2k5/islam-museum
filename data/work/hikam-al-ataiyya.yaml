label: { ar: "الحكم العطائية", en: "Hikam al-'Ata'iyya", ur: "الحکم العطائیہ" }
summary:
  ar: "مجموعة حكم في التصوف لابن عطاء الله السكندري ⁦(ت 709هـ)⁩، عددها مئتان وأربع وستون حكمة غير مكاتباته ومناجاته، يرى محمد عبد المقصود هيكل أنها أول مصنفاته وأنها ألفت قبل وفاة شيخه المرسي سنة 686هـ، وأول من شرحها ابن عباد الرندي {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 36} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 38}."
  en: "A collection of Sufi maxims by Ibn 'Ata' Allah al-Iskandari (d. 709 AH), two hundred and sixty-four in number besides his letters and intimate prayers; Muhammad 'Abd al-Maqsud Haykal thinks it was his first work, written before the death of his shaykh al-Mursi in 686 AH; its first commentator was Ibn 'Abbad al-Rundi {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 36} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 38}."
  ur: "ابن عطاء اللہ سکندری ⁦(م 709ھ)⁩ کی تصوف میں حکمتوں کا مجموعہ، جن کی تعداد ان کے خطوط اور مناجات کے علاوہ دو سو چونسٹھ ہے؛ محمد عبد المقصود ہیکل کے خیال میں یہ ان کی پہلی تصنیف ہے جو ان کے شیخ مرسی کی 686ھ میں وفات سے پہلے لکھی گئی؛ اس کے پہلے شارح ابن عباد رندی ہیں {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 36} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 38}۔"
