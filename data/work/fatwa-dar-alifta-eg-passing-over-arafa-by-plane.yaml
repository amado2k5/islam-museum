label: { ar: "حكم المرور بعرفة بالطائرة", en: "Passing over Arafat by aeroplane", ur: "طیارے سے عرفہ کے اوپر سے گزرنا", es: "Sobrevolando Arafat en avión", fr: "Survol d'Arafat en avion", tr: "Arafah'tan uçakla geçiş hakkında karar", id: "Keputusan tentang melewati Arafah dengan pesawat" }
summary:
  ar: "سائل سأل عن المرور بعرفة بالطائرة هل يقع به الوقوف. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20701)⁩ أن الوقوف بعرفة ركن الحج الذي لا يتم إلا به والأصل فيه مباشرة الحاج لأرض عرفة أو ما اتصل بها من مركب على ما فصّل الجواب."
  en: "A questioner asked whether passing over Arafat by aeroplane counts as the standing. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20701) answered that the standing at Arafat is the pillar without which Hajj is not complete, and the rule is that the pilgrim be on Arafat's ground or in a mount touching it — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا طیارے سے عرفہ کے اوپر سے گزرنا وقوف شمار ہوگا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20701)⁩ نے جواب دیا کہ عرفہ کا وقوف حج کا رکن ہے اور اصل یہ ہے کہ حاجی عرفہ کی زمین پر یا اس سے جڑی سواری پر ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un visitante preguntó si sobrevolar Arafat en avión cuenta como estar de pie. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20701) respondió que estar de pie en Arafat es el pilar sin el cual el Hajj no está completo, y la regla es que el peregrino esté en el terreno de Arafat o en una montaña que lo toque, como se detalla en la respuesta."
  fr: "Un pèlerin a demandé si le survol d'Arafat en avion comptait comme un pèlerinage à Arafat. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20701) a répondu que le pèlerinage à Arafat est un pilier essentiel sans lequel le Hajj est incomplet, et que la règle est que le pèlerin se trouve sur le sol d'Arafat ou sur une montagne qui le touche, comme le précise la réponse."
  tr: "Bir soru soran kişi, Arafat'tan uçakla geçmenin durma sayılıp sayılmadığını sordu. Mısır'ın Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20701), Arafat'ta durmanın Hac sütunu olduğunu ve onsuz tamamlanamayacağını ve orijinal ilkenin cevabında Arafah topraklarına veya ona bağlı herhangi bir gemiye doğrudan giden hacın açıklandığına yanıt verdi."
  id: "Seorang penanya bertanya tentang melewati Arafat dengan pesawat dan apakah itu dianggap sebagai berhenti. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20701) menjawab bahwa berdiri di Arafat adalah tiang Haji yang tidak lengkap tanpa itu, dan prinsip aslinya adalah bahwa peziarah langsung ke tanah Arafah atau perahu yang terhubung dijelaskan dalam jawaban."
