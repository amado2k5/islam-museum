id: work/fatwa-dar-alifta-eg-distributing-life-insurance-named-beneficiaries
class: work
kind: fatwa
label: { ar: "كيفية توزيع مبلغ التأمين على الحياة في حالة تحديد المستفيدين", en: "Distributing a life-insurance sum when beneficiaries were named", ur: "مستفیدین مقرر ہونے پر زندگی بیمہ کی رقم کی تقسیم", es: "Distribución de una suma de seguro de vida cuando se designan beneficiarios.", fr: "Distribution du capital d'une assurance-vie lorsque des bénéficiaires ont été désignés.", tr: "Lehtarlar belirlendiğinde hayat sigortası tutarının nasıl dağıtılacağı", id: "Cara mendistribusikan jumlah asuransi jiwa jika penerima manfaat telah diidentifikasi" }
summary:
  ar: "سائل سأل عن كيفية توزيع مبلغ التأمين على الحياة إذا حدد المتوفى المستفيدين دون تحديد نصيب كل منهم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20758)⁩ ببيان كيفية التوزيع على وجهه."
  en: "A questioner asked how to distribute a life-insurance sum when the deceased named the beneficiaries without fixing each one's share. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20758) answered by setting out how the distribution is made."
  ur: "ایک سائل نے زندگی بیمہ کی رقم کی تقسیم پوچھی جب متوفی نے مستفیدین مقرر کیے ہوں مگر ہر ایک کا حصہ نہ بتایا ہو۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20758)⁩ نے جواب میں تقسیم کا طریقہ بیان کیا۔"
  es: "Un consultante preguntó cómo distribuir la suma de un seguro de vida cuando el fallecido designó a los beneficiarios sin fijar la parte correspondiente a cada uno. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20758) respondió detallando cómo se realiza la distribución."
  fr: "Une personne a demandé comment répartir le capital d'une assurance-vie lorsque le défunt a désigné les bénéficiaires sans préciser la part de chacun. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20758) a répondu en détaillant la procédure de répartition."
  tr: "Bir soru soran, merhumun yararlanıcıları belirtmeden yararlanıcıları belirtmesi durumunda hayat sigortası tutarının nasıl dağıtıldığını sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20758) dağıtımın kendi tarzında nasıl yapılacağını açıklayarak yanıt verdi."
  id: "Seorang penanya bertanya bagaimana jumlah asuransi jiwa didistribusikan jika almarhum menentukan penerima manfaat tanpa menyebutkan bagian masing-masing. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20758) menanggapi dengan menjelaskan bagaimana pembagian akan dilakukan dengan caranya sendiri."
