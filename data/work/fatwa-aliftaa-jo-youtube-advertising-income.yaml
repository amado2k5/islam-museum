id: work/fatwa-aliftaa-jo-youtube-advertising-income
class: work
kind: fatwa
label: { ar: "حكم أرباح إعلانات يوتيوب مع ظهور محرمات عارضة", en: "YouTube ad income when some forbidden content slips through", ur: "یوٹیوب اشتہارات کی آمدنی جب کچھ ممنوعہ مواد آ جائے" }
summary:
  ar: "سؤال من صانع محتوى على يوتيوب يربح من الإعلانات ويفلترها، أجابت فيه دائرة الإفتاء العام الأردنية بأن الحكم يتبع غلبة الإعلانات المحرمة أو ندرتها. أجابت الدائرة بأن الإسلام حرّم ما يعين على الحرام مباشرة، وأن الترويج لإعلان محرم من ذلك، فيجب على صانع المحتوى فلترة الإعلانات وحذف المحرم منها. وقالت إنه إذا عجز عن التحكم في إزالة الإعلانات المحرمة أو كانت تظهر غالبًا رغم الفلترة حرم عليه التكسب منها، لأن الحكم للغالب. وأما إذا ظهرت قليلًا بعد الفلترة، أو كان المحرم عارضًا كصور في إعلانات منتجات مباحة، فرأت أن فيه شبهة على الأقل وأن تركه أولى، ونصحت بالتصدق بجزء من الأرباح إبراءً للذمة."
  en: "A question from a YouTube creator who earns from ads and filters them, in which Jordan's General Iftaa Department answered that the ruling follows whether forbidden ads predominate or are rare. The Department answered that Islam forbids anything that directly aids what is forbidden, and promoting a forbidden ad is such aid, so the creator must filter the ads and remove forbidden ones. It said that if he cannot control the removal of forbidden ads, or they appear predominantly despite filtering, earning from them is forbidden, since the ruling follows what predominates. If they appear only rarely after filtering, or the forbidden element is incidental, such as images in ads for lawful products, it held that this is at the least doubtful and better avoided, and advised giving part of the earnings in charity to clear one's account."
  ur: "اشتہارات سے کمانے اور انہیں فلٹر کرنے والے یوٹیوب کریئیٹر کا سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ حکم ممنوعہ اشتہارات کے غالب یا کم ہونے پر ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے ہر اس کام کو حرام کیا جو براہِ راست حرام میں مدد دے، اور ممنوعہ اشتہار کی تشہیر اسی میں سے ہے، اس لیے کریئیٹر پر اشتہارات فلٹر کرنا اور ممنوعہ اشتہارات ہٹانا لازم ہے۔ اس نے کہا کہ اگر وہ ممنوعہ اشتہارات ہٹانے پر قادر نہ ہو یا فلٹر کے باوجود وہ زیادہ تر ظاہر ہوں تو ان سے کمانا حرام ہے، کیونکہ حکم غالب کا ہوتا ہے۔ اور اگر فلٹر کے بعد کم ظاہر ہوں، یا ممنوعہ چیز ضمنی ہو جیسے جائز مصنوعات کے اشتہارات میں تصاویر، تو اس کے نزدیک کم از کم شبہ ہے اور چھوڑنا بہتر ہے، اور ذمہ داری سے بری ہونے کے لیے منافع کا کچھ حصہ صدقہ کرنے کا مشورہ دیا۔"
