label: { ar: "قرار مجمع الفقه الإسلامي الدولي 174 (18/12) بشأن استكمال النظر في المفطرات ⁦(تأجيل)⁩", en: "IIFA resolution 174 (18/12) on completing the review of fast-nullifiers ⁦(deferred)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 174 (18/12): روزہ شکن امور کا جائزہ مکمل کرنا ⁦(مؤجل)⁩", es: "Resolución 174 (18/12) de la IIFA sobre la finalización de la revisión de los anuladores rápidos (aplazada)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩، إلحاقًا بقراره 93 ⁦(10/1)⁩ بشأن المفطرات في مجال التداوي. بعد اطلاعه على البحثين الواردين بخصوص استكمال النظر في المفطرات واستماعه إلى المناقشات، قرر تأجيل النظر في الموضوع إلى دورة قادمة لمزيد من الدراسة والبحث. وهو قرار تأجيل لا قرار حكم."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007), appended to its resolution 93 (10/1) on fast-nullifiers in the medical field. After reviewing the two submitted papers on completing the review and hearing the discussions, it resolved to postpone consideration to a coming session for further study and research. A deferral, not a ruling."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں، جو اس کی قرارداد 93 ⁦(10/1)⁩ برائے طبی میدان میں روزہ شکن امور کا ضمیمہ ہے۔ آئی ہوئی دو تحقیقات کا جائزہ اور مباحث کے بعد اس نے موضوع کا جائزہ مزید مطالعے کے لیے اگلی مجلس تک مؤجل کیا۔ یہ مؤجل کی قرارداد ہے، حکم کی نہیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica, en su 18.ª sesión celebrada en Putrajaya (del 24 al 29 de Jumada al-Akhira de 1428, del 9 al 14 de julio de 2007), anexada a su resolución 93 (10/1) sobre los anuladores del ayuno en el ámbito médico. Tras revisar los dos documentos presentados y escuchar los debates, se decidió aplazar su consideración a una sesión posterior para su posterior estudio e investigación. Se trata de un aplazamiento, no de una resolución."
