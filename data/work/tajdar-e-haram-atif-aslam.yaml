summary:
  ar: "أداء المغني الباكستاني عاطف أسلم للقوالي «تاجدار حرم» في مديح النبي، في الحلقة الأولى من الموسم الثامن لبرنامج كوك ستوديو باكستان، صدر في 15 أغسطس 2015 تحية للإخوة صابري أصحاب الأداء الأشهر؛ أول مصوّر باكستاني تجاوز مئة مليون مشاهدة على يوتيوب."
  en: "The Pakistani singer Atif Aslam's rendition of the qawwali Tajdar-e-Haram, in praise of the Prophet, on the first episode of Coke Studio Pakistan's eighth season, released on 15 August 2015 as a tribute to the Sabri Brothers' classic performance; the first Pakistani music video to pass 100 million views on YouTube."
  ur: "عاطف اسلم کی قوالی «تاجدارِ حرم» کی ادائیگی، جو نبی کی مدح میں ہے، کوک اسٹوڈیو پاکستان کے آٹھویں سیزن کی پہلی قسط میں 15 اگست 2015 کو جاری ہوئی اور صابری برادران کی مشہور قوالی کو خراجِ تحسین تھی؛ یوٹیوب پر سو ملین ویوز پار کرنے والی پہلی پاکستانی ویڈیو۔"
