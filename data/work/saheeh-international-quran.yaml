summary:
  ar: "ترجمة إنجليزية لمعاني القرآن أعدّها في جدة فريق من ثلاث أمريكيات اعتنقن الإسلام: إميلي عسّامي ⁦(أم محمد)⁩ التي تولّت الترجمة، وماري كينيدي وأمة الله بانتلي اللتان حرّرتا النص؛ صدرت أول مرة سنة 1997 بعنوان «القرآن: النص العربي مع المعاني الإنجليزية المقابلة» عن دار أبي القاسم للنشر والمنتدى الإسلامي، ثم في طبعة ثانية مصحّحة سنة 2004، بإنجليزية معاصرة وأكثر من ألفي حاشية، وأعلنت مقدمتها أنها تعرض المعاني على عقيدة أهل السنة والجماعة."
  en: "An English rendering of the meanings of the Qur'an made in Jeddah by a team of three American converts: Emily Assami (Umm Muhammad), who led the translation, and Mary Kennedy and Amatullah Bantley, who edited it; first published in 1997 as The Qur'an: Arabic Text with Corresponding English Meanings by the Abul-Qasim Publishing House and al-Muntada al-Islami, with a corrected second edition in 2004, it is written in contemporary English with more than two thousand footnotes, and its preface states that it presents the meanings according to the creed of Ahl al-Sunna wa-l-Jama'a."
  ur: "قرآن کے معانی کا انگریزی ترجمہ جو جدہ میں تین امریکی نومسلم خواتین کی ٹیم نے تیار کیا: ایملی عسامی، جو ام محمد کہلاتی ہیں اور جنھوں نے ترجمہ کیا، اور ماری کینیڈی و امۃ اللہ بینٹلی جنھوں نے تدوین کی؛ 1997 میں دار ابو القاسم اور المنتدی الاسلامی سے «دی قرآن: عربی متن مع متعلقہ انگریزی معانی» کے نام سے پہلی بار چھپا اور 2004 میں تصحیح شدہ دوسری اشاعت آئی؛ معاصر انگریزی، دو ہزار سے زیادہ حواشی، اور مقدمے کے مطابق معانی اہل السنہ والجماعہ کے عقیدے پر پیش کیے گئے ہیں۔"
