label:
  ar: "الإدارة العملية (دورة)"
  en: "Practical Management (course)"
  ur: "عملی انتظام (کورس)"
summary:
  ar: "دورة تدريبية مسجّلة لطارق السويدان سمّاها «الإدارة العملية»، يقول إنه أرادها للجانب الذي يُطبَّق فوراً من نظريات الإدارة: التخطيط الاستراتيجي في صفحة واحدة، والرؤية والرسالة والمؤشرات، والقيادة والفرق بينها وبين الإدارة، وتحليل الشخصيات، وتغيير المنظمات والأفراد، واتخاذ القرار، وخطة الحياة الشخصية. يضم أرشيف Assabile منها خمس محاضرات."
  en: "A recorded training course by Tareq al-Suwaidan which he named 'Practical Management'. He says he built it around the part of management theory that can be applied at once: strategic planning on a single page, vision, mission and indicators, leadership and how it differs from management, personality analysis, changing organisations and individuals, decision-making and a personal life plan. The Assabile archive holds five of its lectures."
  ur: "طارق السویدان کا ریکارڈ شدہ تربیتی کورس جسے انہوں نے «عملی انتظام» کا نام دیا۔ وہ کہتے ہیں کہ انہوں نے اسے انتظامی نظریات کے اس حصے پر بنایا جو فوراً لاگو ہو سکے: ایک صفحے پر اسٹریٹجک منصوبہ بندی، وژن، مشن اور اشاریے، قیادت اور انتظام سے اس کا فرق، شخصیات کا تجزیہ، اداروں اور افراد کی تبدیلی، فیصلہ سازی اور ذاتی زندگی کا منصوبہ۔ Assabile آرکائیو میں اس کے پانچ لیکچر ہیں۔"
