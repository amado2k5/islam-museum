label: { ar: "بيان الأفضلية بين أداء الصلاة في أول وقتها منفردًا وأدائها جماعة في آخره", en: "Praying alone early or in congregation late — which is better?", ur: "اول وقت میں اکیلے یا آخر وقت میں جماعت سے نماز — کون بہتر؟", es: "¿Es mejor orar solo temprano o en congregación tarde?" }
summary:
  ar: "سائل سأل عن الأفضل بين أداء الصلاة في أول وقتها منفردًا وأدائها جماعة في آخر الوقت. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21722)⁩ أن مراعاة صلاة الجماعة والحرص عليها في أول الوقت أعظم في تحصيل الثواب والأجر من صلاتها جماعة في آخر الوقت أو منفردًا في أوله على ما فصّل الجواب."
  en: "A questioner asked which is better: praying alone at the start of the time or in congregation at its end. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21722) answered that keeping to congregational prayer and striving for it at the start of the time is greater in reward than congregation at the end or alone at the start — as the answer details."
  ur: "ایک سائل نے پوچھا کہ اول وقت میں اکیلے نماز بہتر ہے یا آخر وقت میں جماعت کے ساتھ۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21722)⁩ نے جواب دیا کہ اول وقت میں جماعت کی رعایت اور اس کی حرص سب سے بڑا ثواب ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó qué es mejor: orar solo al comienzo del tiempo de oración o en congregación al final. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21722) respondió que mantener la oración en congregación y esforzarse por realizarla al comienzo del tiempo de oración tiene mayor recompensa que la oración en congregación al final o la oración en solitario al comienzo, como se detalla en la respuesta."
