id: work/fatwa-aliftaa-jo-mosque-committee-using-building-donations-for-car-hire
class: work
kind: fatwa
label: { ar: "استئجار لجنة إعمار المسجد سيارة من تبرعات البناء", en: "A mosque-building committee hiring a car from building donations", ur: "مسجد تعمیر کمیٹی کا تعمیری عطیات سے گاڑی کرائے پر لینا" }
summary:
  ar: "سؤال عن استئجار لجنة إعمار المسجد سيارة من تبرعات البناء، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم صرف شيء من تبرعات البناء في غير ما جمعت له، وأن المخرج أن تجمع اللجنة تبرعات للأمور الإدارية مع إعلام المتبرعين. أجابت الدائرة بأنه يحرم على لجان إعمار المساجد أن تتصرف بشيء من تبرعات بناء المسجد في غير ما جمعت له، لأن الأصل في صرف التبرعات أن يكون بحسب نية المتبرع وشرطه، والمتبرع بمنزلة الواقف، والأصل التزام شرط الواقف. واستشهدت بقول إمام الحرمين الجويني في نهاية المطلب (8/362) بالرجوع إلى شرط الواقف في صفات المستحقين ومقاديرهم وترتيبهم، وبقول الشيرازي في المهذب (2/328) بصرف الغلة على شرط الواقف لأن الصحابة وقفوا وكتبوا شروطهم. وخلصت إلى أنه لا يجوز صرف شيء من التبرعات لأجرة السيارة ولا لغيرها، وأن على القائمين إن أرادوا الخروج من الإثم أن يجمعوا بعض التبرعات لتصرف في الأمور الإدارية للجنة الإعمار، بشرط إعلام المتبرعين بذلك."
  en: "A question about a mosque-building committee hiring a car from building donations, in which Jordan's General Iftaa Department answered that no part of building donations may be spent on anything other than their purpose, and that the remedy is for the committee to collect donations for administrative costs, informing donors. The Department answered that mosque-building committees may not spend any of the donations for building the mosque on anything other than the purpose they were collected for, because donations are spent according to the donor's intention and condition, the donor stands in the place of an endower (waqif), and the endower's conditions are to be honoured. It cited Imam al-Haramayn al-Juwayni in Nihayat al-Matlab (8/362) that the endower's conditions govern the qualities, shares and order of beneficiaries, and al-Shirazi in al-Muhadhdhab (2/328) that an endowment's yield is spent according to the endower's conditions because the Companions made endowments and wrote down their conditions. It concluded that none of the donations may be spent on car hire or anything else, and that if those in charge wish to avoid sin, they should collect some donations specifically for the committee's administrative costs, on condition that donors are told."
  ur: "مسجد تعمیر کمیٹی کا تعمیری عطیات سے گاڑی کرائے پر لینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ تعمیری عطیات کا کوئی حصہ ان کے مقصد کے سوا خرچ کرنا حرام ہے، اور حل یہ ہے کہ کمیٹی عطیہ دہندگان کو بتا کر انتظامی اخراجات کے لیے عطیات جمع کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسجد تعمیر کمیٹیوں کے لیے مسجد کی تعمیر کے عطیات میں سے کچھ بھی اس مقصد کے سوا خرچ کرنا حرام ہے جس کے لیے وہ جمع کیے گئے، کیونکہ عطیات عطیہ دہندہ کی نیت اور شرط کے مطابق خرچ ہوتے ہیں، عطیہ دہندہ واقف کے درجے میں ہے، اور واقف کی شرط کی پابندی اصل ہے۔ اس نے نہایۃ المطلب (8/362) میں امام الحرمین الجوینی کا قول پیش کیا کہ مستحقین کی صفات، مقدار اور ترتیب میں واقف کی شرط کی طرف رجوع کیا جائے، اور المہذب (2/328) میں شیرازی کا قول کہ وقف کی آمدنی واقف کی شرط کے مطابق خرچ ہو کیونکہ صحابہ نے وقف کیے اور اپنی شرطیں لکھیں۔ اس نے نتیجہ نکالا کہ عطیات میں سے کچھ بھی گاڑی کے کرائے یا کسی اور چیز پر خرچ کرنا جائز نہیں، اور اگر ذمہ دار گناہ سے بچنا چاہیں تو تعمیر کمیٹی کے انتظامی امور کے لیے کچھ عطیات الگ سے جمع کریں، بشرطیکہ عطیہ دہندگان کو اس کی اطلاع دی جائے۔"
