id: work/fatwa-amja-estranged-father-sorcery
class: work
kind: fatwa
label: { ar: "أب قاطع أبناءه", en: "A father who cut off his children — patience, prayer and lawful ruqya", ur: "بیٹوں سے بے تعلق باپ — صبر اور شرعی رقیہ" }
summary:
  ar: "سأل سائل أن أباه غادرهم وهم صغار ليتزوج أخرى ومارس عليهم كل أشكال القطيعة حتى أنكرهم مرة واشتبه في سحر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21867 بتاريخ 28 أغسطس 2007)⁩ بنصحه أن يدع الوسيلة غير المشروعة ويبحث عن وسيلة أخرى مشروعة ويستعين بالصبر والصلاة ثم يسأل أحد أهل العلم من المعروفين بسلامة المعتقد واستقامة المنهج في محلته ممن لهم دراية بحل السحر عن المسحور بالأدعية والرقى الشرعية فعسى أن يجد ضالته عنده بإذن الله إن كان في الأمر شبهة سحر، وسأل الله أن يهدي قلب الأب لهم ويرده إليهم ردًا جميلًا."
  en: "A questioner whose father left them small, married another, practised every form of estrangement — once disowning them — asked, suspecting sorcery. Dr. Salah al-Sawi (fatwa no. 21867, 28 August 2007) counselled leaving any unlawful means, seeking a lawful one, and asking help of patience and prayer; then consulting a scholar in his locality known for sound creed and straight path, versed in lifting sorcery from the bewitched with prayers and lawful ruqya — perhaps he would find his wish there, if sorcery is suspected; and he asked God to guide the father's heart to them and return him beautifully."
  ur: "ایک سائل کے باپ نے انہیں چھوڑ دیا تھا اور جادو کا شبہ تھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21867، 28 اگست 2007)⁩ کے مطابق صبر نماز اور مستند عالم سے شرعی رقیہ کی رہنمائی لے۔"
