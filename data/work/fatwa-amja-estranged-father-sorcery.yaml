id: work/fatwa-amja-estranged-father-sorcery
class: work
kind: fatwa
label: { ar: "أب قاطع أبناءه", en: "A father who cut off his children — patience, prayer and lawful ruqya", ur: "بیٹوں سے بے تعلق باپ — صبر اور شرعی رقیہ", es: "Un padre que desheredó a sus hijos: paciencia, oración y ruqya lícita.", fr: "Un père qui a renié ses enfants — patience, prière et roqya licite", tr: "Çocuklarını hayatından çıkaran bir baba", id: "Seorang ayah yang memutuskan hubungan dengan anak-anaknya" }
summary:
  ar: "سأل سائل أن أباه غادرهم وهم صغار ليتزوج أخرى ومارس عليهم كل أشكال القطيعة حتى أنكرهم مرة واشتبه في سحر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21867 بتاريخ 28 أغسطس 2007)⁩ بنصحه أن يدع الوسيلة غير المشروعة ويبحث عن وسيلة أخرى مشروعة ويستعين بالصبر والصلاة ثم يسأل أحد أهل العلم من المعروفين بسلامة المعتقد واستقامة المنهج في محلته ممن لهم دراية بحل السحر عن المسحور بالأدعية والرقى الشرعية فعسى أن يجد ضالته عنده بإذن الله إن كان في الأمر شبهة سحر، وسأل الله أن يهدي قلب الأب لهم ويرده إليهم ردًا جميلًا."
  en: "A questioner whose father left them small, married another, practised every form of estrangement — once disowning them — asked, suspecting sorcery. Dr. Salah al-Sawi (fatwa no. 21867, 28 August 2007) counselled leaving any unlawful means, seeking a lawful one, and asking help of patience and prayer; then consulting a scholar in his locality known for sound creed and straight path, versed in lifting sorcery from the bewitched with prayers and lawful ruqya — perhaps he would find his wish there, if sorcery is suspected; and he asked God to guide the father's heart to them and return him beautifully."
  ur: "ایک سائل کے باپ نے انہیں چھوڑ دیا تھا اور جادو کا شبہ تھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21867، 28 اگست 2007)⁩ کے مطابق صبر نماز اور مستند عالم سے شرعی رقیہ کی رہنمائی لے۔"
  es: "Un consultante, cuyo padre los abandonó siendo niños, se casó con otra y practicó todo tipo de distanciamiento —incluso los desheredó—, preguntó sospechando de brujería. El Dr. Salah al-Sawi (fatwa n.° 21867, 28 de agosto de 2007) aconsejó abandonar cualquier medio ilícito, buscar uno lícito y pedir ayuda en la paciencia y la oración; luego consultar a un erudito de su localidad conocido por su sana doctrina y recto camino, versado en eliminar la brujería de los embrujados con oraciones y ruqya lícita —quizás allí encontraría lo que buscaba, si sospechaba de brujería—; y pidió a Dios que guiara el corazón del padre hacia ellos y lo devolviera con gracia."
  fr: "Un homme, dont le père les avait abandonnés en bas âge, s'était remarié et avait pratiqué toutes sortes d'éloignement – allant jusqu'à les renier –, demanda conseil, soupçonnant un sortilège. Le Dr Salah al-Sawi (fatwa n° 21867, 28 août 2007) lui recommanda d'abandonner tout moyen illicite, de se tourner vers un moyen licite et de s'appuyer sur la patience et la prière. Il lui suggéra ensuite de consulter un savant de sa région, réputé pour sa foi saine et son droiture, versé dans l'art de lever les ensorceleurs par la prière et la roqya licite – peut-être y trouverait-il la réponse à ses questions, s'il soupçonnait un sortilège. Enfin, il pria Dieu de ramener le père à ses enfants et de le ramener auprès d'eux dans la paix."
  tr: "Bir soru soran kişi, babasının onları gençken terk edip başka bir kadınla evlenip ayrılmadığını, hatta bir keresinde onları reddedip sihirden şüphelenip büyü yaptığını sormuştur. Dr. Salah Al-Sawy (Fetva No. 21867, 28 Ağustos 2007) ona hukuki yollardan vazgeçmesini, başka meşru bir yol aramasını ve sabır ile dua aramasını tavsiye etti. Sonra, yerinde sağlam inancı ve metodolojinin doğruluğu olan, büyüyü büyülenmişlerden yalvarışlar ve yasal ruqyah yoluyla çözme konusunda bilgili bir âlim sordu. Belki de Allah'ın izniyle, sihirle ilgili herhangi bir şüphe varsa, aradığını yanında bulur. Tanrı'dan babanın kalbini onlara yönlendirmesini ve güzel bir şekilde geri vermesini istedi."
  id: "Seorang penanya bertanya apakah ayahnya meninggalkan mereka saat mereka masih muda untuk menikah dengan wanita lain dan melakukan segala bentuk pemisahan dari mereka, sampai-sampai ia pernah menyangkal dan curiga pada sihir. Dr. Salah Al-Sawy (Fatwa No. 21867 tanggal 28 Agustus 2007) menjawab dengan menyarankan agar ia meninggalkan cara yang tidak sah, mencari metode lain yang sah, dan mencari kesabaran serta doa. Kemudian ia meminta seorang cendekiawan yang dikenal dengan keyakinan yang kuat dan kebenaran metodologi di daerahnya, yang mahir dalam melarutkan sihir dari orang yang terpesona melalui permohonan dan ruqyah hukum. Mungkin ia akan menemukan apa yang ia cari bersamanya, jika ada kecurigaan terhadap sihir. Ia meminta Tuhan untuk membimbing hati sang ayah kepada mereka dan mengembalikannya dengan cara yang indah."
