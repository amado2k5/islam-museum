summary:
  ar: "خطاب المأمون حين وصله نعي هارون الرشيد سنة 193هـ، يعزّي فيه ويذكّر الناس بعهدهم ويعد بالإنصاف، وخطبة أخرى له حين بويع بالخلافة."
  en: "Al-Ma'mun's address on receiving news of Harun al-Rashid's death in 193 AH. He offers condolence, reminds the people of their pledge and promises fairness, and gives a second address on accepting the caliphate."
  ur: "193 ہجری میں ہارون الرشید کی وفات کی خبر پر مامون کا خطاب، جس میں وہ تعزیت کرتے، لوگوں کو عہد یاد دلاتے اور انصاف کا وعدہ کرتے ہیں۔ بیعت خلافت کے وقت ان کا ایک اور خطاب بھی درج ہے۔"
