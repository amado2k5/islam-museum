summary:
  ar: "خطاب المأمون حين وصله نعي هارون الرشيد سنة 193هـ، يعزّي فيه ويذكّر الناس بعهدهم ويعد بالإنصاف، وخطبة أخرى له حين بويع بالخلافة."
  en: "Al-Ma'mun's address on receiving news of Harun al-Rashid's death in 193 AH. He offers condolence, reminds the people of their pledge and promises fairness, and gives a second address on accepting the caliphate."
  ur: "193 ہجری میں ہارون الرشید کی وفات کی خبر پر مامون کا خطاب، جس میں وہ تعزیت کرتے، لوگوں کو عہد یاد دلاتے اور انصاف کا وعدہ کرتے ہیں۔ بیعت خلافت کے وقت ان کا ایک اور خطاب بھی درج ہے۔"
  es: "Discurso de Al-Ma'mun al recibir la noticia de la muerte de Harun al-Rashid en el año 193 de la Hégira. Ofrece sus condolencias, recuerda al pueblo su juramento y promete justicia, y pronuncia un segundo discurso al aceptar el califato."
  fr: "Discours d'Al-Ma'mun à l'annonce du décès de Harun al-Rashid en 193 AH. Il présente ses condoléances, rappelle au peuple son serment et promet la justice, puis prononce un second discours sur son acceptation du califat."
  tr: "Al-Ma'mun, 193 Hicri yılında, Harun el-Reşid'in ölüm ilanını alırken yaptığı konuşmada başsağlığını iletti, halka antlarını hatırlattı, adalet sözü verdi ve halifeliğe bağlılık yemini ettiğinde ona başka bir vaaz verdi."
  id: "Pidato Al-Ma'mun saat menerima obituari Harun al-Rashid pada tahun 193 H, di mana ia menyampaikan belasungkawa, mengingatkan rakyat akan perjanjian mereka, menjanjikan keadilan, dan khotbah lain disampaikan kepadanya ketika ia bersumpah setia kepada kekhalifahan."
