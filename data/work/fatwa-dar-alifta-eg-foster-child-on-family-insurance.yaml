label: { ar: "حكم إضافة الطفل المكفول لنظام تأمين صحي خاص", en: "Adding the fostered child to the family's private health insurance", ur: "کفیل بچے کو خاندانی صحت کی انشورنس میں شامل کرنا", es: "Incluir al niño acogido en el seguro médico privado de la familia.", fr: "Ajouter l'enfant placé en famille d'accueil à l'assurance maladie privée de la famille", tr: "Özel sağlık sigortası sistemine sponsorlu bir çocuğun eklenmesine ilişkin karar", id: "Putusan tentang penambahan anak yang disponsori ke dalam sistem asuransi kesehatan swasta" }
summary:
  ar: "سائل سأل عن إضافة الطفل المكفول لنظام التأمين الصحي الخاص بالأسرة الكافلة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21566)⁩ أن إضافة الطفل المكفول لنظام التأمين الصحي الخاص بالأسرة الكافلة يعد من أوجه الكفالة التي يثاب عليها الكافل على ما فصّل الجواب."
  en: "A questioner asked about adding a fostered child to the fostering family's private health insurance. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21566) answered that adding the fostered child to the family's health insurance counts among the rewarding forms of kafala — as the answer details."
  ur: "ایک سائل نے کفیل بچے کو خاندانی صحت کی انشورنس میں شامل کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21566)⁩ نے جواب دیا کہ یہ کفالت کی ان صورتوں میں ہے جن پر کفیل اجر پاتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la posibilidad de incluir a un niño acogido en el seguro médico privado de la familia de acogida. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21566) respondió que incluir al niño acogido en el seguro médico familiar se considera una de las formas beneficiosas de kafala, tal como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant l'ajout d'un enfant placé à l'assurance maladie privée de sa famille d'accueil. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21566) a répondu que cette extension de l'enfant à l'assurance maladie familiale compte parmi les formes méritoires de kafala, comme le précise la réponse."
  tr: "Bir soru soran kişi, sponsorlu çocuğun sponsorlu aile için sağlık sigortası sistemine eklenmesi hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21566), sponsorlu çocuğun sponsorlu aile için sağlık sigortası sistemine eklenmesinin, yanıtta detaylandırıldığı gibi, sponsorun ödüllendirildiği sponsorluk biçimlerinden biri olduğunu belirtti."
  id: "Seorang penanya menanyakan tentang penambahan anak yang disponsori ke dalam sistem asuransi kesehatan untuk keluarga yang disponsori. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21566) menjawab bahwa menambahkan anak yang disponsori ke dalam sistem asuransi kesehatan untuk keluarga yang disponsori dianggap sebagai salah satu bentuk sponsor yang dihargai, sebagaimana dijelaskan dalam jawaban."
