label: { ar: "جامع الترمذي", en: "Jami' al-Tirmidhi" }
summary:
  ar: "الجامع المختصر من السنن عن رسول الله لأبي عيسى محمد بن عيسى بن سورة الترمذي، المتوفى سنة 279هـ، وهو من الكتب الستة، ويذكر فيه مؤلفه درجة الحديث بمصطلحات الصحيح والحسن والغريب. تضع المقالة الجامع في المرتبة الرابعة عادة بعد كتب البخاري ومسلم وأبي داود، وتذكر أن طبعة القاهرة لشاكر وآخرين تضم 3956 حديثاً، وأنه ألحق بآخره كتاب العلل. وللترمذي أيضاً كتاب الشمائل في خصائص النبي."
  en: "The Jami of Abu Isa Muhammad ibn Isa ibn Sawra al-Tirmidhi, who died in 279 AH, is one of the Six Books; its author states each report's grade with the terms sahih, hasan and gharib. The Encyclopaedia of Islam says it is generally ranked fourth after the collections of al-Bukhari, Muslim and Abu Dawud, that the Cairo edition of Shakir and others holds 3,956 traditions, and that the Kitab al-Ilal is appended at its end. Al-Tirmidhi also compiled the Shama'il, on the Prophet's characteristics."
  ur: "الجامع ابو عیسیٰ محمد بن عیسیٰ بن سورہ ترمذی کی کتاب ہے، جن کی وفات 279ھ میں ہوئی، اور یہ کتب ستہ میں سے ہے؛ مؤلف ہر روایت کا درجہ صحیح، حسن اور غریب کی اصطلاحات سے بتاتے ہیں۔ دائرۃ المعارف الاسلامیہ کے مطابق اسے عموماً بخاری، مسلم اور ابو داؤد کے بعد چوتھا درجہ دیا جاتا ہے، شاکر اور دیگر کے قاہرہ ایڈیشن میں 3956 احادیث ہیں، اور آخر میں کتاب العلل شامل ہے۔ ترمذی نے نبی کی صفات پر الشمائل بھی مرتب کی۔"
