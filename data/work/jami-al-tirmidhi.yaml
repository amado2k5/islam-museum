summary:
  ar: "الجامع المختصر من السنن عن رسول الله لأبي عيسى محمد بن عيسى بن سورة الترمذي (ت 279هـ): من الكتب الستة، تميز ببيان درجة كل حديث (صحيح، حسن، غريب) وبذكر مذاهب الفقهاء في الباب، وله كتاب الشمائل المحمدية في أوصاف النبي."
  en: "The Jami' of Abu 'Isa Muhammad ibn 'Isa al-Tirmidhi (d. 279 AH): one of the six books, distinguished by grading each report (sahih, hasan, gharib) and noting the jurists' positions under every chapter; it closes with the Book of al-Shama'il al-Muhammadiyya on the Prophet's description."
