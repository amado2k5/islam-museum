id: work/fatwa-binbaz-treated-impure-water
class: work
kind: fatwa
label: { ar: "حكم الماء النجس إذا صُفّي بطرق علمية", en: "Impure water purified by scientific treatment", ur: "سائنسی طریقوں سے صاف کیے گئے ناپاک پانی کا حکم", es: "Agua impura purificada mediante tratamiento científico.", fr: "Eau impure purifiée par traitement scientifique", tr: "Bilimsel yöntemlerle filtrelenmişse saf olmayan suya ilişkin karar", id: "Aturan tentang air tidak murni jika disaring melalui metode ilmiah" }
summary:
  ar: "سؤال عن الماء النجس إذا كُرّر وصُفّي حتى صار في ريحه ولونه وطعمه كالماء الطبيعي. فرّق ابن باز بين الكثير والقليل: الماء الكثير، قلّتان فأكثر، إذا زال تغيّره بالمعالجة أو بغيرها عاد طهورًا، وما دون القلتين محل خلاف، والقليل جدًّا لا يطهر بذهاب أوصاف النجاسة، واستشهد بالأمر بإراقة الإناء الذي ولغ فيه الكلب."
  en: "A question on impure water that has been recycled and filtered until its smell, colour and taste are like natural water. Ibn Baz distinguished between large and small quantities: a large quantity, two qullas or more, becomes purifying again once its change is removed, by treatment or otherwise; below two qullas the matter is disputed; and a very small quantity is not purified merely by losing the traits of impurity, citing the command to pour out a vessel a dog has drunk from."
  ur: "اس ناپاک پانی کے بارے میں سوال جسے دوبارہ صاف کیا جائے یہاں تک کہ اس کی بو، رنگ اور ذائقہ قدرتی پانی جیسا ہو جائے۔ ابن باز نے کم اور زیادہ پانی میں فرق کیا: زیادہ پانی، دو قلے یا اس سے زیادہ، جب علاج سے یا بغیر علاج کے اس کی تبدیلی ختم ہو جائے تو پھر پاک کرنے والا ہو جاتا ہے؛ دو قلے سے کم میں اختلاف ہے؛ اور بہت تھوڑا پانی محض نجاست کے اوصاف ختم ہونے سے پاک نہیں ہوتا، اور اس پر اس برتن کو انڈیل دینے کے حکم سے استدلال کیا جس سے کتا پی لے۔"
  es: "Una pregunta sobre el agua impura que ha sido reciclada y filtrada hasta que su olor, color y sabor son como los del agua natural. Ibn Baz distinguió entre grandes y pequeñas cantidades: una gran cantidad, dos qullas o más, vuelve a ser purificadora una vez que se elimina su alteración, ya sea mediante tratamiento o de otra manera; por debajo de dos qullas, el asunto es discutible; y una cantidad muy pequeña no se purifica simplemente por perder las características de impureza, citando el mandato de vaciar un recipiente del que ha bebido un perro."
  fr: "La question de l'eau impure recyclée et filtrée jusqu'à ce que son odeur, sa couleur et son goût soient identiques à ceux de l'eau naturelle est posée. Ibn Baz établit une distinction entre les grandes et les petites quantités: une grande quantité, deux qula's ou plus, retrouve ses propriétés purificatrices une fois son impureté éliminée, par traitement ou autre; en dessous de deux qula', la question est controversée; et une très petite quantité n'est pas purifiée par la simple disparition des signes d'impureté, citant l'exemple du récipient dans lequel un chien a bu."
  tr: "Eğer kokusunun, renginin ve tadı doğal su gibi olana kadar tekrar tekrar filtrelenip temiz olmayan su hakkında bir soru. İbn Baz çok ile azını ayırt etti: çok su, iki veya daha fazla. Eğer su işlemi veya başka şekilde giderilirse, su saf olur ve iki kilogramdan az olan su tartışmalıdır. Çok az su saflık özellikleri giderilerek arıtmaz. Köpeğin yuttuğu kabı boşaltma emrini alıntıladı."
  id: "Pertanyaan tentang air yang tidak murni jika difilter berulang kali sampai bau, warna, dan rasanya menjadi seperti air alami. Ibn Baz membedakan antara banyak dan sedikit: banyak air, dua atau lebih. Jika perubahannya dihilangkan dengan perlakuan atau cara lain, air itu menjadi murni, dan apa pun yang kurang dari dua kilogram diperdebatkan. Sangat sedikit yang tidak dapat dimurnikan dengan menghilangkan sifat kotoran. Ia mengutip perintah untuk menuangkan wadah tempat anjing menelan."
