summary:
  ar: "أبيات في ديوان الحماسة من الطويل على روي العين، لإياس بن قبيصة الطائي {{cite:hamasa-abu-tammam-ed-1916 p.59}}."
  en: "Verses in the Diwan al-Hamasa in the tawil metre on the rhyme ayn, by Iyas ibn Qabisa al-Ta'i {{cite:hamasa-abu-tammam-ed-1916 p.59}}."
