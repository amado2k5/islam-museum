  ur: "آیاس ابن قبیصہ الطائی کی طرف سے دیوان الحمسہ میں آیات تاویل میٹر آن دی ریم عین، از ایاس بن قبیصہ الطائی {{حوالہ: حماسہ-ابو-تمام-ایڈ-1916 صفحہ 59}}۔"
  tr: "Hamasa Diwanı'ndaki ayetler, Iyas bin Qubaysa Al-Tai tarafından Al-Tawil 'Ala Ruwai Al-'Ayn'dan {{cite:hamasa-abu-tammam-ed-1916, s.59}}."
  id: "Ayat-ayat dalam Diwan Hamasa dari Al-Tawil 'Ala Ruwai Al-'Ayn, oleh Iyas bin Qubaysa Al-{{cite:hamasa-abu-tammam-ed-1916 hlm.59}}."
