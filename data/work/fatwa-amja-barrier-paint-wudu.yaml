id: work/fatwa-amja-barrier-paint-wudu
class: work
kind: fatwa
label: { ar: "الحائل في الوضوء", en: "A paint barrier and a tight prayer-time", ur: "رنگ کی روک اور نماز کا وقت", es: "Una barrera de pintura y un tiempo de oración ajustado", fr: "Une barrière de peinture et un temps de prière restreint" }
summary:
  ar: "سأل سائل أن على يده طلاء يمنع وصول الماء وشق نزعه حتى ضاق وقت الفريضة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82348 بتاريخ 27 أغسطس 2010)⁩ أنه يلزمه الوضوء عند القيام إلى الصلاة فلا يقبل الله صلاة من أحدث حتى يتوضأ والوضوء كما هو موصوف في كتاب الله وسنة رسوله ولا بد من وصول الماء إلى أعضاء الوضوء فلا يصح الوضوء مع وجود حائل يمنع وصول الماء إلى العضو فإن لم يمكنه إزالة الحائل تيمم على ما فصّل الجواب."
  en: "A questioner had paint on his hand barring the water, hard to strip until the prayer-time narrowed. Dr. Salah al-Sawi (fatwa no. 82348, 27 August 2010) answered that wudu binds him when he rises to pray — God accepts no prayer of one in hadath till he does wudu; the wudu as described in God's book and His Messenger's sunna requires water reaching its limbs, so no wudu stands with a barrier keeping water from the limb; where the barrier cannot be removed he does tayammum — as detailed."
  ur: "ہاتھ پر رنگ پانی روک رہا تھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82348، 27 اگست 2010)⁩ کے مطابق پانی پہنچنا ضروری ہے — حائل نہ ہٹے تو تیمم کرے۔"
  es: "Un consultante tenía pintura en la mano que impedía el paso del agua, difícil de quitar hasta que se acercaba el momento de la oración. El Dr. Salah al-Sawi (fatwa n.º 82348, 27 de agosto de 2010) respondió que la ablución (wudu) lo obliga cuando se levanta para orar: Dios no acepta la oración de nadie en hadiz hasta que haga la ablución; la ablución, tal como se describe en el libro de Dios y en la sunna de Su Mensajero, requiere que el agua llegue a sus miembros, por lo que ninguna ablución es válida con una barrera que impide que el agua llegue al miembro; donde la barrera no se puede quitar, hace el tayammum, como se detalla."
  fr: "Un homme, ayant de la peinture sur la main empêchant l'eau de pénétrer, avait du mal à l'enlever avant que l'heure de la prière ne soit proche. Le Dr Salah al-Sawi (fatwa n° 82348, 27 août 2010) a répondu que les ablutions (wudu) l'obligent à se lever pour prier: Dieu n'accepte aucune prière en hadath tant que l'homme n'a pas fait ses ablutions; les ablutions, telles que décrites dans le Coran et la Sunna du Messager, requièrent que l'eau atteigne les membres; par conséquent, aucune ablution n'est valable si une barrière empêche l'eau d'atteindre un membre; lorsque cette barrière ne peut être enlevée, l'homme effectue le tayammum, comme expliqué en détail."
