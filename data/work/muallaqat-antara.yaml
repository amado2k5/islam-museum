label: { ar: "معلقة عنترة بن شداد «هل غادر الشعراء من متردم»", en: "The Mu'allaqa of Antara ibn Shaddad, 'Have the poets left any patch to mend?'", es: "El Mu'allaqa de Antara ibn Shaddad, '¿Han dejado los poetas algún hueco por remendar?'", fr: "La Mu'allaqa d'Antara ibn Shaddad, « Les poètes ont-ils laissé quelque morceau à réparer ? »" }
summary:
  ar: "إحدى المعلقات السبع، من الكامل على روي الميم، مطلعها «هل غادر الشعراء من متردم أم هل عرفت الدار بعد توهم»، كما في شرح الزوزني {{cite:sharh-muallaqat-sab-zawzani-1921 p.143}}."
  en: "One of the seven Mu'allaqat, in the kamil metre on the rhyme mim, opening \"Have the poets left any patch to be mended? Or did you recognise the abode after doubting?\", as in al-Zawzani's commentary {{cite:sharh-muallaqat-sab-zawzani-1921 p.143}}."
  es: "Uno de los siete Mu'allaqat, en metro kamil sobre la rima mim, comienza \"¿Han dejado los poetas algún parche por remendar? ¿O reconociste la morada después de dudar?\", como en el comentario de al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 p.143}}."
  fr: "L'un des sept Mu'allaqat, en mètre kamil sur la rime mim, commençant par « Les poètes ont-ils laissé un endroit à réparer ? Ou avez-vous reconnu la demeure après avoir douté ? », comme dans le commentaire d'al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 p.143}}."
