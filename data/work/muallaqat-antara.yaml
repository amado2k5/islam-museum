summary:
  ar: "إحدى المعلقات السبع، من الكامل على روي الميم، مطلعها «هل غادر الشعراء من متردم أم هل عرفت الدار بعد توهم»، كما في شرح الزوزني {{cite:sharh-muallaqat-sab-zawzani-1921 p.143}}."
  en: "One of the seven Mu'allaqat, in the kamil metre on the rhyme mim, opening \"Have the poets left any patch to be mended? Or did you recognise the abode after doubting?\", as in al-Zawzani's commentary {{cite:sharh-muallaqat-sab-zawzani-1921 p.143}}."
