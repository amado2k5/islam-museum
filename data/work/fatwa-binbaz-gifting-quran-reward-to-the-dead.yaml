id: work/fatwa-binbaz-gifting-quran-reward-to-the-dead
class: work
kind: fatwa
label: { ar: "هل يصل ثواب قراءة القرآن للميت؟", en: "Does the reward of Qur'an recitation reach the dead?", ur: "کیا قرآن خوانی کا ثواب میت کو پہنچتا ہے؟" }
summary:
  ar: "سؤال عن إهداء ثواب قراءة القرآن إلى الميت، ذكر فيه ابن باز الخلاف ورأى أن الأولى ترك ذلك والاكتفاء بالصدقة والدعاء. ذكر ابن باز أن في المسألة خلافًا: فأكثر أهل العلم يرون أن الثواب يصل، وقال آخرون إنه لم يرد فعله عن النبي ولا عن الصحابة. ورأى أن الأولى ترك ذلك، وأن يقرأ كل امرئ لنفسه، وأن الصدقة عن الميت والدعاء له ينفعانه بإجماع المسلمين. وأضاف أن من مات وعليه صيام فرّط فيه بعد شفائه يُصام عنه، ومن مات وعليه حج الفريضة أو حج نذر يُحج عنه، أما الصلاة عن الميت فلا أصل لها."
  en: "A question on gifting the reward of Qur'an recitation to the dead, in which Ibn Baz set out the disagreement and held that it is better left, in favour of charity and supplication. Ibn Baz said the question is disputed: most scholars hold that the reward arrives, while others say neither the Prophet nor the Companions are reported to have done it. He held that it is better to leave it, with each person reciting for himself, and that charity on behalf of the dead and supplication for them benefit them by the consensus of Muslims. He added that fasts a person neglected after recovering from illness are fasted on his behalf after his death, and an obligatory or vowed pilgrimage is performed for him, but praying on behalf of the dead has no basis."
  ur: "میت کو قرآن خوانی کا ثواب ہدیہ کرنے کے بارے میں سوال، جس میں ابن باز نے اختلاف ذکر کیا اور صدقہ اور دعا پر اکتفا کو بہتر قرار دیا۔ ابن باز نے کہا کہ اس مسئلے میں اختلاف ہے: اکثر اہلِ علم کے نزدیک ثواب پہنچتا ہے، جبکہ دوسروں کا کہنا ہے کہ یہ عمل نبی یا صحابہ سے منقول نہیں۔ ان کے نزدیک بہتر یہ ہے کہ اسے چھوڑ دیا جائے اور ہر شخص اپنے لیے پڑھے، اور میت کی طرف سے صدقہ اور اس کے لیے دعا مسلمانوں کے اجماع سے اسے نفع دیتے ہیں۔ انہوں نے مزید کہا کہ جو شخص شفا کے بعد کوتاہی سے روزے چھوڑ کر فوت ہو اس کی طرف سے روزے رکھے جائیں، اور فرض یا نذر کا حج اس کی طرف سے کیا جائے، لیکن میت کی طرف سے نماز پڑھنے کی کوئی اصل نہیں۔"
