id: work/fatwa-binbaz-gifting-quran-reward-to-the-dead
class: work
kind: fatwa
label: { ar: "هل يصل ثواب قراءة القرآن للميت؟", en: "Does the reward of Qur'an recitation reach the dead?", ur: "کیا قرآن خوانی کا ثواب میت کو پہنچتا ہے؟", es: "¿La recompensa de la recitación del Corán llega a los muertos?", fr: "La récompense de la récitation du Coran parvient-elle aux morts ?", tr: "Kur'an'ı okumanın ödülü merhuma ulaşır mı?", id: "Apakah hadiah untuk membaca Al-Qur'an sampai kepada almarhum?" }
summary:
  ar: "سؤال عن إهداء ثواب قراءة القرآن إلى الميت، ذكر فيه ابن باز الخلاف ورأى أن الأولى ترك ذلك والاكتفاء بالصدقة والدعاء. ذكر ابن باز أن في المسألة خلافًا: فأكثر أهل العلم يرون أن الثواب يصل، وقال آخرون إنه لم يرد فعله عن النبي ولا عن الصحابة. ورأى أن الأولى ترك ذلك، وأن يقرأ كل امرئ لنفسه، وأن الصدقة عن الميت والدعاء له ينفعانه بإجماع المسلمين. وأضاف أن من مات وعليه صيام فرّط فيه بعد شفائه يُصام عنه، ومن مات وعليه حج الفريضة أو حج نذر يُحج عنه، أما الصلاة عن الميت فلا أصل لها."
  en: "A question on gifting the reward of Qur'an recitation to the dead, in which Ibn Baz set out the disagreement and held that it is better left, in favour of charity and supplication. Ibn Baz said the question is disputed: most scholars hold that the reward arrives, while others say neither the Prophet nor the Companions are reported to have done it. He held that it is better to leave it, with each person reciting for himself, and that charity on behalf of the dead and supplication for them benefit them by the consensus of Muslims. He added that fasts a person neglected after recovering from illness are fasted on his behalf after his death, and an obligatory or vowed pilgrimage is performed for him, but praying on behalf of the dead has no basis."
  ur: "میت کو قرآن خوانی کا ثواب ہدیہ کرنے کے بارے میں سوال، جس میں ابن باز نے اختلاف ذکر کیا اور صدقہ اور دعا پر اکتفا کو بہتر قرار دیا۔ ابن باز نے کہا کہ اس مسئلے میں اختلاف ہے: اکثر اہلِ علم کے نزدیک ثواب پہنچتا ہے، جبکہ دوسروں کا کہنا ہے کہ یہ عمل نبی یا صحابہ سے منقول نہیں۔ ان کے نزدیک بہتر یہ ہے کہ اسے چھوڑ دیا جائے اور ہر شخص اپنے لیے پڑھے، اور میت کی طرف سے صدقہ اور اس کے لیے دعا مسلمانوں کے اجماع سے اسے نفع دیتے ہیں۔ انہوں نے مزید کہا کہ جو شخص شفا کے بعد کوتاہی سے روزے چھوڑ کر فوت ہو اس کی طرف سے روزے رکھے جائیں، اور فرض یا نذر کا حج اس کی طرف سے کیا جائے، لیکن میت کی طرف سے نماز پڑھنے کی کوئی اصل نہیں۔"
  es: "Una pregunta sobre la donación de la recompensa de la recitación del Corán a los difuntos, en la que Ibn Baz expuso el desacuerdo y sostuvo que es mejor dejarlo así, en favor de la caridad y la súplica. Ibn Baz dijo que la cuestión es controvertida: la mayoría de los eruditos sostienen que la recompensa llega, mientras que otros dicen que ni el Profeta ni los Compañeros lo hicieron. Sostuvo que es mejor dejarlo así, que cada persona recite para sí misma, y que la caridad en nombre de los difuntos y la súplica por ellos los benefician según el consenso de los musulmanes. Añadió que los ayunos que una persona descuidó tras recuperarse de una enfermedad se realizan en su nombre después de su muerte, y se efectúa una peregrinación obligatoria o prometida en su nombre, pero la oración en nombre de los difuntos carece de fundamento."
  fr: "Concernant la question de l'offrande de la récompense de la récitation du Coran aux défunts, Ibn Baz a exposé les divergences d'opinions et a soutenu qu'il valait mieux s'en abstenir, en privilégiant l'aumône et les invocations. Ibn Baz a indiqué que la question était controversée: la plupart des savants affirment que la récompense est transmise, tandis que d'autres rapportent que ni le Prophète ni ses Compagnons n'ont pratiqué cette pratique. Il a estimé qu'il était préférable de s'en abstenir, chacun récitant pour soi-même, et que l'aumône et les invocations en faveur des défunts leur étaient bénéfiques, selon le consensus musulman. Il a ajouté que les jeûnes manqués par une personne après sa guérison sont accomplis pour elle après son décès, et qu'un pèlerinage obligatoire ou votif est effectué en son nom, mais que les prières pour les défunts n'ont aucun fondement."
  tr: "Kur'an okuma ödülünün merhuma adanmasıyla ilgili bir soruya gelince, İbn Baz anlaşmazlığı dile getirmiş ve tercih edilen uygulamanın bunu bırakıp sadaka ve yalvarışla yetinmek olduğunu düşünmüştür. İbn Baz bu konuda görüş ayrılığı olduğunu belirtmiştir: çoğu alim ödülün ulaşıldığına inanırken, diğerleri bunun Peygamber veya Sahabelerden rivayet edilmediğini söylemiştir. Bunun bırakılmasının daha uygun olduğunu ve herkesin kendisi için okumasının daha uygun olduğunu, merhum adına yapılan sadakat ve onun için yapılan duaların Müslümanların mutabakatıyla ona fayda sağladığını savunmuştur. Ek olarak, oruç tutarken ölen kişinin iyileştikten sonra ihmal edildiğini, onun adına oruç tutması gerektiğini ve hac yemini etmek zorunda kalırken ölenlerin onun adına hac yapması gerektiğini eklemiştir. Ölen adına namaz kılmanın ise bir dayanağı yoktur."
  id: "Pertanyaan tentang mendedikasikan hadiah membaca Al-Qur'an kepada almarhum, Ibn Baz menyebutkan perbedaan pendapat dan percaya bahwa praktik yang lebih disukai adalah meninggalkan itu dan cukup dengan amal serta permohonan. Ibn Baz menyebutkan bahwa ada perbedaan pendapat mengenai hal ini: sebagian besar ulama percaya bahwa ganjaran telah dicapai, sementara yang lain mengatakan itu bukan dinawayajin dari Nabi atau para sahabat. Dia percaya lebih baik membiarkan itu dan setiap orang harus membaca untuk dirinya sendiri, dan bahwa amal atas nama almarhum serta doa untuknya menguntungkan dirinya berdasarkan kesepakatan umat Islam. Dia menambahkan bahwa siapa pun yang meninggal saat masih berpuasa diabaikan setelah sembuh, dia harus berpuasa atas namanya, dan siapa pun yang meninggal saat harus melaksanakan Haji wajib atau ikrar harus melaksanakan Haji atas namanya. Adapun shalat atas nama almarhum, itu tidak memiliki dasar."
