id: work/fatwa-amja-father-prays-no-wudu
class: work
kind: fatwa
label: { ar: "يصلي من غير وضوء", en: "A father suspected of praying without wudu — gentle counsel", ur: "بغیر وضو نماز کا شک — نرمی سے نصیحت", es: "Un padre sospechoso de rezar sin wudu — consejo amable", fr: "Un père soupçonné de prier sans avoir fait ses ablutions — conseils bienveillants" }
summary:
  ar: "سأل سائل أن أباه في السادسة والخمسين تراودهم شكوك أنه يصلي من غير وضوء في البيت. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85907 بتاريخ 14 نوفمبر 2011)⁩ أن الحل هو المناصحة برفق وأن يبينوا له أن الوضوء ينتقض بالحدث وأن الله لا يقبل صلاة من أحدث حتى يتوضأ وأن عليه لكي يقف بين يدي ربه في صلاته أن يتطهر من الحدث بنوعيه الأصغر والأكبر وأن يحسن الاستبراء من بوله وأن يطهر ثوبه وبدنه، وأن يكرروا عليه النصيحة برفق ويحضروا له بعض المواد الدعوية التي تشرح هذه المبادئ لمن يحب أن يستزيد على ما فصّل."
  en: "A questioner said doubts haunted them that their fifty-six-year-old father prays at home without wudu. Dr. Salah al-Sawi (fatwa no. 85907, 14 November 2011) answered that the way is gentle counsel — making plain to him that wudu is broken by the hadath, that God accepts no prayer of one in hadath until he does wudu, that standing before his Lord in prayer calls for purification from both the lesser and greater hadath, careful istibra from urine, and a clean garment and body; they should repeat the counsel gently and bring him some dawa-materials explaining these principles for whoever wishes to learn more — as detailed."
  ur: "ایک سائل نے باپ کے بغیر وضو نماز کے شک پر مشورہ مانگا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85907، 14 نومبر 2011)⁩ کے مطابق حل نرم نصیحت ہے — حدث کی بیجات اور طہارت کی شرائط آہستہ سمجھائیں۔"
  es: "Un consultante expresó dudas sobre si su padre, de cincuenta y seis años, rezaba en casa sin realizar la ablución (wudu). El Dr. Salah al-Sawi (fatwa n.º 85907, 14 de noviembre de 2011) respondió que la solución es aconsejarle con delicadeza, explicándole claramente que la ablución se invalida por la falta de orina (hadath), que Dios no acepta la oración de quien está en falta de orina hasta que realiza la ablución, que estar de pie ante su Señor en oración requiere purificación tanto de la falta de orina (hadath menor como mayor), una cuidadosa limpieza de la orina (istibra) y una vestimenta y un cuerpo limpios; debían repetirle el consejo con suavidad y traerle algunos materiales de dawa que explicaran estos principios para quien desee aprender más, como se detalla."
  fr: "Une personne a confié avoir des doutes quant au fait que son père de cinquante-six ans prie chez lui sans avoir fait ses ablutions. Le Dr Salah al-Sawi (fatwa n° 85907, 14 novembre 2011) a répondu que la solution consiste à lui prodiguer des conseils avec douceur, en lui expliquant clairement que les ablutions sont invalidées par l'ingestion d'urine, que Dieu n'accepte aucune prière d'une personne en état d'ingestion d'urine tant que celle-ci n'a pas fait ses ablutions, que se tenir devant son Seigneur en prière requiert la purification de l'urine, tant mineure que majeure, une ablution soigneusement effectuée, ainsi que des vêtements et un corps propres. Il leur a conseillé de répéter ces conseils avec douceur et de lui apporter des documents de da'wa expliquant ces principes à quiconque souhaite approfondir le sujet."
