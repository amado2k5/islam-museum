id: work/fatwa-aliftaa-jo-hajj-or-having-a-child-first
class: work
kind: fatwa
label: { ar: "تقديم الحج أو الإنجاب", en: "Hajj first, or a child first?", ur: "پہلے حج یا پہلے اولاد؟" }
summary:
  ar: "سؤال من زوجين يقيمان في السعودية عن تقديم الحج أو الإنجاب، أجابت فيه دائرة الإفتاء العام الأردنية بأن الحج تنبغي المبادرة إليه، لكنه واجب على التراخي، فيرجع ترتيب الأولويات إلى حاجة الزوجين. أجابت الدائرة بأن الحج يجب على المكلف المستطيع، والاستطاعة أن يملك ما يحج به فاضلًا عن حاجاته الضرورية من مسكن ونفقة، ونقلت تعريفها عن ابن حجر الهيتمي. وقالت إن ترتيب الأولويات يكون بحسب الحاجة، لأن الحج وإن كان واجبًا فهو على التراخي، ونقلت عن النووي في روضة الطالبين أن من احتاج إلى النكاح خوف العنت فصرف المال إليه أهم من الحج، لأن حاجة النكاح ناجزة والحج على التراخي، وأن كل صاحب حاجة أقدر على تحديد أولوياته. وذكرت أن الإنجاب من مقاصد الشريعة الكبرى في حفظ النسل، لكنه يمكن تأجيله وليس حاجة ملحة، خاصة إذا كانت الزوجة شابة. وخلصت إلى أن الحج ركن عظيم تنبغي المبادرة إليه، إلا أن وجوبه على التراخي، فتجري عليه قواعد فقه الأولويات عند التعارض."
  en: "A question from a couple living in Saudi Arabia on whether to perform hajj or have a child first, in which Jordan's General Iftaa Department answered that hajj should be performed promptly, but its obligation is not immediate, so the order of priorities rests on the couple's needs. The Department answered that hajj is obligatory on a responsible adult who is able, ability meaning having the means for hajj beyond essential needs such as housing and maintenance, quoting Ibn Hajar al-Haytami's definition. It said priorities follow need, because hajj, though obligatory, need not be performed immediately, quoting al-Nawawi's Rawdat al-Talibin that someone who needs to marry for fear of falling into sin should spend his money on marriage before hajj, since that need is pressing and hajj is not immediate, and adding that each person is best placed to judge his own priorities. It noted that having children is among the sharia's great aims, the preservation of lineage, but can be postponed and is not a pressing need, especially when the wife is young. It concluded that hajj is a great pillar to be hastened to, but since its obligation is not immediate, the rules for weighing priorities apply when obligations compete."
  ur: "سعودی عرب میں مقیم ایک جوڑے کا سوال کہ پہلے حج کریں یا اولاد، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ حج میں جلدی کرنی چاہیے، لیکن اس کا وجوب فوری نہیں، اس لیے ترجیحات کی ترتیب جوڑے کی ضرورت پر منحصر ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ حج اس مکلف پر واجب ہے جو استطاعت رکھتا ہو، اور استطاعت کا مطلب ہے رہائش اور نفقہ جیسی بنیادی ضروریات سے زائد حج کے اخراجات کا مالک ہونا، اور اس کی تعریف ابن حجر الہیتمی سے نقل کی۔ اس نے کہا کہ ترجیحات ضرورت کے مطابق ہوتی ہیں، کیونکہ حج واجب ہونے کے باوجود فوری نہیں، اور نووی کی روضۃ الطالبین سے نقل کیا کہ جسے گناہ کے خوف سے نکاح کی ضرورت ہو اس کا مال نکاح پر خرچ کرنا حج سے زیادہ اہم ہے، کیونکہ وہ ضرورت فوری ہے اور حج فوری نہیں، اور کہا کہ ہر صاحبِ ضرورت اپنی ترجیحات بہتر جانتا ہے۔ اس نے ذکر کیا کہ اولاد شریعت کے بڑے مقاصد میں سے حفظِ نسل ہے، لیکن اسے مؤخر کیا جا سکتا ہے اور یہ فوری ضرورت نہیں، خاص طور پر جب بیوی جوان ہو۔ اس نے نتیجہ نکالا کہ حج ایک عظیم رکن ہے جس میں جلدی کرنی چاہیے، لیکن چونکہ اس کا وجوب فوری نہیں، اس لیے تعارض کے وقت ترجیحات کے فقہی قواعد اس پر لاگو ہوتے ہیں۔"
