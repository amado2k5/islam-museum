summary:
  ar: "دراسة بالفرنسية للمؤرخ التونسي هشام جعيط في الفتنة الكبرى وصلة الدين بالسياسة في صدر الإسلام، صدرت عن دار غاليمار بباريس سنة 1989 في 421 صفحة، وترجمتها دار الطليعة إلى العربية سنة 1991–1992."
  en: "A French study by the Tunisian historian Hichem Djait of the first civil war (al-fitna al-kubra) and the relation of religion and politics in early Islam, published by Gallimard, Paris, in 1989 (421 pages); Dar al-Tali'a published an Arabic translation in 1991–1992."
  ur: "تیونسی مؤرخ ہشام جعیط کا فرانسیسی مطالعہ جو فتنۂ کبریٰ اور ابتدائی اسلام میں دین و سیاست کے تعلق پر ہے؛ گالیمار، پیرس سے 1989ء میں 421 صفحات میں شائع ہوا، اور دار الطلیعہ نے 1991ء–1992ء میں اس کا عربی ترجمہ شائع کیا۔"
  es: "Un estudio francés del historiador tunecino Hichem Djait sobre la primera guerra civil (al-fitna al-kubra) y la relación entre religión y política en los inicios del Islam, publicado por Gallimard, París, en 1989 (421 páginas); Dar al-Tali'a publicó una traducción al árabe entre 1991 y 1992."
  fr: "Une étude française de l'historien tunisien Hichem Djait sur la première guerre civile (al-fitna al-kubra) et la relation entre religion et politique dans l'islam primitif, publiée par Gallimard, Paris, en 1989 (421 pages); Dar al-Tali'a en a publié une traduction arabe en 1991-1992."
  tr: "Tunuslu tarihçi Hicham Djait tarafından Fransızca yazılmış bir çalışma, Erken İslam'da Büyük Fitna ve Dinin Siyasetle Bağlantısı üzerine 1989'da Paris'te Gallimard Publishing tarafından 421 sayfa olarak yayımlanmış ve Dar Al-Tali'a tarafından 1991–1992 yıllarında Arapçaya çevrilmiştir."
  id: "Sebuah studi dalam bahasa Prancis oleh sejarawan Tunisia Hicham Djait tentang Fitna Agung dan Hubungan Agama dengan Politik dalam Islam Awal, diterbitkan oleh Gallimard Publishing di Paris pada tahun 1989 dalam 421 halaman, dan diterjemahkan oleh Dar Al-Tali'a ke dalam bahasa Arab pada tahun 1991–1992."
