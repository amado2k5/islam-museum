label: { ar: "أبيات حسان «إذا أردت السيد الأشدا» في مدح سعد بن زيد", en: "Hassan's verses praising Sa'd ibn Zayd 'If you seek the mightiest chief'", es: "Versos de Hassan alabando a Sa'd ibn Zayd: \"Si buscas al jefe más poderoso\".", fr: "Versets de Hassan louant Sa'd ibn Zayd « Si vous recherchez le chef le plus puissant »", ur: "سعد بن زید کی تعریف کرنے والی حسن کی آیات 'اگر تم سب سے طاقتور سردار کو تلاش کرو'", tr: "Hassan'ın \"Eğer en güçlü ustayı istiyorsan\" dizeleri Saad bin Zayd'i öven", id: "Bait-bait Hassan \"Jika kau ingin tuan yang terkuat\" sebagai pujian kepada Saad bin Zayd" }
summary:
  ar: "بيتان لحسان بن ثابت من الرجز على روي الدال، يمدح بهما سعد بن زيد من الأنصار {{cite:sharh-diwan-hassan-barquqi-1929 p.153}}."
  en: "Two verses by Hassan ibn Thabit in the rajaz metre on the rhyme dal, praising Sa'd ibn Zayd of the Ansar {{cite:sharh-diwan-hassan-barquqi-1929 p.153}}."
  es: "Dos versos de Hassan ibn Thabit en metro rajaz sobre la rima dal, alabando a Sa'd ibn Zayd de los Ansar {{cite:sharh-diwan-hassan-barquqi-1929 p.153}}."
  fr: "Deux vers de Hassan ibn Thabit en mètre rajaz sur la rime dal, louant Sa'd ibn Zayd des Ansar {{cite:sharh-diwan-hassan-barquqi-1929 p.153}}."
  ur: "حسان بن ثابت کی رجز میٹر میں شاعری دال پر دو آیات، انصار کے سعد ابن زید کی تعریف کرتے ہوئے"
  tr: "Hassan ibn Thabit'in 'dal' anlatımına göre Rajaz'dan iki dize, Saad ibn Zayd tarafından Ansar'dan övülür {{cite:sharh-diwan-hassan-barquqi-1929 s.153}}."
  id: "Dua bait oleh Hassan ibn Thabit dari rajaz sesuai dengan riwayat 'dal', dipuji oleh Saad ibn Zayd dari Ansar {{cite:sharh-diwan-hassan-barquqi-1929 hlm.153}}."
