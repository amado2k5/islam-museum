id: work/fatwa-aliftaa-jo-eating-by-mistake-during-an-expiation-fast
class: work
kind: fatwa
label: { ar: "الأكل أو الشرب ناسيًا في صيام كفارة اليمين", en: "Eating or drinking by mistake during an oath-expiation fast", ur: "قسم کے کفارے کے روزے میں بھول کر کھا پی لینا" }
summary:
  ar: "سؤال عن الأكل أو الشرب ناسيًا في صيام كفارة اليمين، أجابت فيه دائرة الإفتاء العام الأردنية بأن من أكل أو شرب ناسيًا لا يفطر ويتابع صيامه، أيًّا كان نوع الصيام. أجابت الدائرة بأن من أكل أو شرب ناسيًا فإنما أطعمه الله وسقاه، فلا يفطر بذلك بل يتابع صيامه. وقالت إن هذا الحكم عام، سواء كان الصيام فرضًا أو قضاء أو كفارة أو نفلًا."
  en: "A question about eating or drinking by mistake during an oath-expiation fast, in which Jordan's General Iftaa Department answered that someone who eats or drinks by mistake does not break the fast and continues it, whatever kind of fast it is. The Department answered that whoever eats or drinks forgetfully has only been fed and given drink by God, so his fast is not broken and he continues fasting. It said this applies generally, whether the fast is obligatory, a make-up, an expiation or voluntary."
  ur: "قسم کے کفارے کے روزے میں بھول کر کھا پی لینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جو بھول کر کھا پی لے اس کا روزہ نہیں ٹوٹتا اور وہ روزہ جاری رکھے، روزہ کسی بھی قسم کا ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ جو بھول کر کھائے یا پیے اسے اللہ ہی نے کھلایا پلایا، اس سے روزہ نہیں ٹوٹتا بلکہ وہ روزہ جاری رکھے۔ اس نے کہا کہ یہ حکم عام ہے، روزہ فرض ہو، قضا ہو، کفارہ ہو یا نفل۔"
