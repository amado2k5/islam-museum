id: work/fatwa-aliftaa-jo-eating-by-mistake-during-an-expiation-fast
class: work
kind: fatwa
label: { ar: "الأكل أو الشرب ناسيًا في صيام كفارة اليمين", en: "Eating or drinking by mistake during an oath-expiation fast", ur: "قسم کے کفارے کے روزے میں بھول کر کھا پی لینا", es: "Comer o beber por error durante un ayuno de expiación por juramento.", fr: "Manger ou boire par erreur pendant un jeûne d'expiation de serment", tr: "Oruçta unutup yemek veya içmek, yemin için kefarettir", id: "Makan atau minum, lupa saat puasa adalah penebusan sumpah" }
summary:
  ar: "سؤال عن الأكل أو الشرب ناسيًا في صيام كفارة اليمين، أجابت فيه دائرة الإفتاء العام الأردنية بأن من أكل أو شرب ناسيًا لا يفطر ويتابع صيامه، أيًّا كان نوع الصيام. أجابت الدائرة بأن من أكل أو شرب ناسيًا فإنما أطعمه الله وسقاه، فلا يفطر بذلك بل يتابع صيامه. وقالت إن هذا الحكم عام، سواء كان الصيام فرضًا أو قضاء أو كفارة أو نفلًا."
  en: "A question about eating or drinking by mistake during an oath-expiation fast, in which Jordan's General Iftaa Department answered that someone who eats or drinks by mistake does not break the fast and continues it, whatever kind of fast it is. The Department answered that whoever eats or drinks forgetfully has only been fed and given drink by God, so his fast is not broken and he continues fasting. It said this applies generally, whether the fast is obligatory, a make-up, an expiation or voluntary."
  ur: "قسم کے کفارے کے روزے میں بھول کر کھا پی لینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جو بھول کر کھا پی لے اس کا روزہ نہیں ٹوٹتا اور وہ روزہ جاری رکھے، روزہ کسی بھی قسم کا ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ جو بھول کر کھائے یا پیے اسے اللہ ہی نے کھلایا پلایا، اس سے روزہ نہیں ٹوٹتا بلکہ وہ روزہ جاری رکھے۔ اس نے کہا کہ یہ حکم عام ہے، روزہ فرض ہو، قضا ہو، کفارہ ہو یا نفل۔"
  es: "Ante una pregunta sobre comer o beber por error durante un ayuno de expiación, el Departamento General de Iftaa de Jordania respondió que quien come o bebe por error no rompe el ayuno y lo continúa, sea cual sea su tipo. El Departamento explicó que quien come o bebe por olvido solo ha recibido alimento y bebida de Dios, por lo que su ayuno no se rompe y continúa ayunando. Añadió que esto se aplica en general, ya sea un ayuno obligatorio, de recuperación, de expiación o voluntario."
  fr: "Une question concernant le fait de manger ou de boire par erreur pendant un jeûne expiatoire a été posée au Département général de la Ifta de Jordanie. Ce dernier a répondu que celui qui mange ou boit par inadvertance ne rompt pas son jeûne et peut le poursuivre, quel qu'en soit le type. Le Département a expliqué que celui qui mange ou boit par oubli a simplement été nourri et abreuvé par Dieu; son jeûne n'est donc pas rompu et il continue de jeûner. Il a précisé que cela s'applique de manière générale, que le jeûne soit obligatoire, de rattrapage, expiatoire ou volontaire."
  tr: "Yemin için kefaret olarak oruç tutarken unutularak yemek veya içmekle ilgili bir soru; Ürdün Genel Fetva Dairesi, kim unutarak yiyorsa ya da içiyorsa, orucunu bozmaz ve orucuna devam eder, orucun türü ne olursa olsun, bunu yaptı. Daire, yiyip içen kişinin onu beslediğini ve su verdiğini, böylece orucunu bozmadığını, orucuna devam ettiğini söyledi. Bu hükmün genel olduğunu, orucun zorunlu mu, kaçırılması, kefaret veya gönüllü olması gerektiğini belirtti."
  id: "Sebuah pertanyaan tentang makan atau minum dengan lupa dalam puasa penebusan sumpah, di mana Departemen Fatwa Jenderal Yordania menjawab bahwa siapa pun yang makan atau minum dengan lupa, ia tidak memutus puasanya dan melanjutkan puasa, terlepas dari jenis puasanya. Departemen menjawab bahwa siapa pun yang makan atau minum dengan pelupa, Allah telah memberinya makan dan minum air, sehingga ia tidak memutus puasanya tetapi tetap berpuasa. Dinyatakan bahwa aturan ini bersifat umum, baik puasa itu wajib, terlewat, penebusan, maupun sukarela."
