id: work/ahmed-el-sayed-seerah-lilmuslihin-ep32
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 32: المجلس الأخير | غزوة حنين وتبوك وحجة الوداع"
  en: "The Prophetic Biography for Reformers, episode 32: The Last Session: Hunayn, Tabuk and the Farewell Pilgrimage"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 32: آخری مجلس: غزوۂ حنین، تبوک اور حجۃ الوداع"
  fr: "La biographie prophétique pour les réformateurs, épisode 32 : La dernière séance : Hunayn, Tabuk et le pèlerinage d'adieu"
  es: "La biografía profética para los reformadores, episodio 32: La última sesión: Hunayn, Tabuk y la peregrinación de despedida"
summary:
  ar: "يتناول أحمد السيد المرحلة الأخيرة من السيرة: المسير إلى حنين والفرار والرجوع فيها، وأوطاس وحصار الطائف، وقسمة الغنائم بالجعرانة وخطبة النبي في الأنصار، وعام الوفود، وغزوة تبوك والثلاثة الذين خُلّفوا، والإعلان في حج السنة التاسعة، وحجة الوداع وخطبتها، ومرض النبي الأخير. ويستخلص دروسا للمصلحين في قياس الحق بالقوة، وتأليف القلوب، وتذكّر الفضل السابق، وصدق النية، وتمام الرسالة. ويترك الحديث عن وفاة النبي دون سرد."
  en: "Ahmed Elsayed covers the last stretch of the biography: the march to Hunayn and the flight and rally there, Awtas and the siege of Ta'if, the distribution of the spoils at al-Ji'rana and the Prophet's address to the Ansar, the year of the delegations, the expedition to Tabuk with the three who stayed behind, the declaration at the pilgrimage of year 9, the Prophet's farewell pilgrimage and sermon, and his final illness. He draws lessons for reformers on measuring truth by power, winning hearts, remembering one's past service, the sincerity of intention and the completion of the message. He leaves the account of the Prophet's death untold."
  ur: "احمد السید سیرت کے آخری مرحلے کا ذکر کرتے ہیں: حنین کی طرف کوچ اور وہاں بھاگنا اور پلٹ آنا، اوطاس اور طائف کا محاصرہ، جعرانہ میں مالِ غنیمت کی تقسیم اور انصار سے نبی کا خطاب، وفود کا سال، غزوۂ تبوک اور پیچھے رہ جانے والے تین صحابہ، نویں سال کے حج میں اعلان، حجۃ الوداع اور اس کا خطبہ، اور نبی کی آخری بیماری۔ وہ مصلحین کے لیے اسباق نکالتے ہیں: حق کو طاقت سے ناپنا، دلوں کو جوڑنا، پچھلی خدمات کو یاد رکھنا، نیت کا اخلاص اور پیغام کی تکمیل۔ وہ نبی کی وفات کا بیان نہیں کرتے۔"
  fr: "Ahmed Elsayed traite la dernière période de la biographie : la marche vers Hunayn, la fuite et le ralliement, Awtas et le siège de Ta'if, le partage du butin à al-Ji'rana et l'allocution du Prophète aux Ansar, l'année des délégations, l'expédition de Tabuk avec les trois hommes restés en arrière, la proclamation au pèlerinage de l'an 9, le pèlerinage d'adieu et son sermon, puis la dernière maladie du Prophète. Il tire des leçons pour les réformateurs : ne pas mesurer la vérité à la force, gagner les cœurs, se souvenir des services passés, la sincérité de l'intention et l'achèvement du message. Il ne raconte pas la mort du Prophète."
  es: "Ahmed Elsayed trata la última etapa de la biografía: la marcha hacia Hunayn y la huida y el reagrupamiento allí, Awtas y el asedio de Ta'if, el reparto del botín en al-Ji'rana y el discurso del Profeta a los Ansar, el año de las delegaciones, la expedición a Tabuk con los tres que se quedaron atrás, la proclamación en la peregrinación del año 9, la peregrinación de despedida y su sermón, y la última enfermedad del Profeta. Extrae lecciones para los reformadores: no medir la verdad por la fuerza, ganar los corazones, recordar los servicios pasados, la sinceridad de la intención y la culminación del mensaje. No narra la muerte del Profeta."
