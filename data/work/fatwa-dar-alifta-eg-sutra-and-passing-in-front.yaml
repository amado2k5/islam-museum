label: { ar: "مقدار السترة في الصلاة ومسافة المرور أمام المصلي", en: "The sutra in prayer and the distance for passing in front of one praying", ur: "نماز میں سترہ کی مقدار اور نمازی کے سامنے سے گزرنے کا فاصلہ", es: "El sutra en la oración y la distancia para pasar frente a quien está orando", fr: "Le sutra dans la prière et la distance à respecter pour passer devant une personne en prière", tr: "Dua sırasında ceketin miktarı ve ibadet edenin önünde gereken mesafe", id: "Jumlah jaket saat berdoa dan jarak yang diperlukan di depan jemaat" }
summary:
  ar: "سائل سأل عن مقدار السترة في الصلاة ومسافة المرور أمام المصلي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22161)⁩ أن اتخاذ السترة يعين المكلف على استحضار الخشوع وحضور القلب وعدم التشويش عليه من المارة، وبيّن الجواب مقاديرها والمسافة الآمنة للمرور."
  en: "A questioner asked about the extent of the sutra (screen) in prayer and the distance for passing before one praying. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22161) answered that adopting a sutra helps the worshipper keep presence of heart and avoid being distracted by passers-by; the answer sets out its measures and the safe passing distance."
  ur: "ایک سائل نے نماز میں سترے کی مقدار اور نمازی کے سامنے سے گزرنے کا فاصلہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22161)⁩ نے جواب دیا کہ سترہ رکھنا نمازی کو خشوع اور قلب کی حضوری بچانے اور راہگیروں سے بے چینی سے بچنے میں مدد دیتا ہے؛ جواب میں اس کی مقدار اور محفوظ فاصلہ بیان ہوا۔"
  es: "Un consultante preguntó sobre la extensión del sutra (pantalla) durante la oración y la distancia que debe haber entre quienes rezan. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22161) respondió que adoptar un sutra ayuda al orante a mantener la concentración y evitar distracciones por parte de los transeúntes; la respuesta detalla las medidas necesarias y la distancia de seguridad para pasar entre ellos."
  fr: "Un internaute a posé une question concernant l'étendue du sutra (écran) pendant la prière et la distance à respecter pour passer devant le fidèle en prière. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22161) a répondu que l'adoption d'un sutra aide le fidèle à maintenir sa concentration et à éviter d'être distrait par les passants; la réponse précise les dimensions du sutra et la distance de sécurité à respecter."
  tr: "Bir soru soran kişi, namazdaki Sitra miktarı ve ibadet edenin önünden geçmek için gereken mesafe hakkında bilgi verdi. Mısırlı Dar Al-Ifta (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 22161), Sitra takmanın kişinin alçakgönüllülüğünü, kalbinin varlığını korumasına ve yoldan geçenlerden rahatsız edilmemesine yardımcı olduğunu, önlemleri ve güvenli mesafeyi açıkladı."
  id: "Seorang penanya menanyakan tentang jumlah Sitra dalam shalat dan jarak yang diperlukan untuk melewati jemaah. Dar Al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22161) menjawab bahwa mengenakan Sitra membantu seseorang tetap rendah hati, hadir di hati, dan tidak terganggu oleh orang yang lewat, serta menjelaskan langkah-langkah dan jarak aman untuk lewat."
