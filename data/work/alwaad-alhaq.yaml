id: work/alwaad-alhaq
class: work
kind: lecture-series
label:
  ar: "برنامج الوعد الحق"
  en: "Al-Wa'd al-Haqq (The True Promise) programme"
  ur: "پروگرام الوعد الحق"
summary:
  ar: "برنامج رمضاني تلفزيوني لعمر عبد الكافي على قناة الشرق، في 44 حلقة، يسير بالمشاهد من الوصية ومرض الموت وعلامات الساعة والقبر والبرزخ إلى البعث والحساب والصراط والنار والجنة، داعيًا إلى الاستعداد للآخرة، وفق تسجيلات أسبابيل."
  en: "A Ramadan television programme by Omar Abdelkafy on the Al-Sharq channel, in 44 episodes, which takes the viewer from the will, the illness of death and the signs of the Hour through the grave and barzakh to the resurrection, the reckoning, the Sirat, the Fire and Paradise, urging preparation for the afterlife, as recorded in the Assabile archive."
  ur: "عمر عبد الکافی کا شرق چینل پر رمضان کا ٹیلی ویژن پروگرام، 44 قسطوں میں، جو ناظر کو وصیت، مرضِ موت اور قیامت کی نشانیوں سے قبر اور برزخ کے راستے حشر، حساب، صراط، جہنم اور جنت تک لے جاتا ہے اور آخرت کی تیاری کی دعوت دیتا ہے، اسابیل کے ذخیرے کے مطابق۔"
wings: [ideas]
themes: [spirituality-and-sufism, ethics-and-character]
regions: [global]
authors: [person/omar-abdelkafy]
