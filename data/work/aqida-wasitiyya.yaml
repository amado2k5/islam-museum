summary:
  ar: "رسالة في عقيدة أهل السنة والجماعة كتبها ابن تيمية سنة 698هـ إجابة لطلب أحد قضاة واسط، وعُقد لمناقشتها مجلس في دمشق سنة 705هـ."
  en: "A statement of the creed of Ahl al-Sunna wa'l-Jama'a written by Ibn Taymiyya in 698 AH at the request of one of the judges of Wasit, which was discussed at a session in Damascus in 705 AH."
  es: "Una declaración del credo de Ahl al-Sunna wa'l-Jama'a escrita por Ibn Taymiyya en el año 698 de la Hégira a petición de uno de los jueces de Wasit, que fue discutida en una sesión en Damasco en el año 705 de la Hégira."
  fr: "Déclaration du credo d'Ahl al-Sunna wa'l-Jama'a écrite par Ibn Taymiyya en 698 AH à la demande de l'un des juges de Wasit, qui fut discutée lors d'une session à Damas en 705 AH."
