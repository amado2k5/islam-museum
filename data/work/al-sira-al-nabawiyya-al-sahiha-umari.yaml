structure: "مقدمة: منهج كتابة تاريخ صدر الإسلام، ملامح التصور الإسلامي للتفسير التاريخي، ضرورة المرونة في تطبيق قواعد المحدثين، مصادر السيرة؛ الفصل الأول: الرسول في مكة؛ الثاني: الرسول في المدينة (خصائص المجتمع المدني وتنظيماته الأولى وإجلاء اليهود، ودستور المدينة)؛ الثالث: الجهاد ضد المشركين من بدر إلى تبوك وحجة الوداع والوفاة؛ الرابع: الرسالة والرسول (فهرس الموضوعات ص689–692)."
