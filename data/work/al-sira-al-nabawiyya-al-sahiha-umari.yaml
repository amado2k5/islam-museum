summary:
  ar: "كتاب الدكتور أكرم ضياء العمري في السيرة النبوية، عنوانه الفرعي «محاولة لتطبيق قواعد المحدثين في نقد روايات السيرة النبوية»: يقدّم الروايات الصحيحة ثم الحسنة ثم ما يعتضد من الضعيف، ويتشدد فيما يتعلق بالعقيدة والشريعة ويتساهل في أخبار العمران ووصف المعارك، ويعتمد على كتب الحديث إلى جانب كتب السيرة."
  en: "Dr Akram Diya' al-Umari's biography of the Prophet, subtitled 'an attempt to apply the hadith scholars' rules to the criticism of the sira reports': it gives sound reports first, then good ones, then weak ones that are corroborated; it is strict where belief and law are concerned and lenient for reports on building and battle description; and it draws on the hadith collections alongside the sira books."
  es: "La biografía del Profeta escrita por el Dr. Akram Diya' al-Umari, subtitulada \"un intento de aplicar las reglas de los eruditos del hadiz a la crítica de los relatos de la sira\", presenta primero los relatos fiables, luego los buenos y, finalmente, los débiles que han sido corroborados; es estricta en lo que respecta a la creencia y la ley, y indulgente con los relatos sobre la descripción de edificios y batallas; y se basa en las colecciones de hadices junto con los libros de la sira."
  fr: "La biographie du Prophète par le Dr Akram Diya' al-Umari, sous-titrée « une tentative d'application des règles des spécialistes du hadith à la critique des récits de la Sira »: elle présente d'abord les récits authentiques, puis les bons, puis les faibles qui sont corroborés; elle est stricte en ce qui concerne la croyance et la loi et indulgente pour les récits relatifs à la construction et à la description des batailles; et elle s'appuie sur les recueils de hadiths ainsi que sur les livres de la Sira."
