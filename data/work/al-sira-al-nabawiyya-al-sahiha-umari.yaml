summary:
  ar: "كتاب الدكتور أكرم ضياء العمري في السيرة النبوية، عنوانه الفرعي «محاولة لتطبيق قواعد المحدثين في نقد روايات السيرة النبوية»: يقدّم الروايات الصحيحة ثم الحسنة ثم ما يعتضد من الضعيف، ويتشدد فيما يتعلق بالعقيدة والشريعة ويتساهل في أخبار العمران ووصف المعارك، ويعتمد على كتب الحديث إلى جانب كتب السيرة."
  en: "Dr Akram Diya' al-Umari's biography of the Prophet, subtitled 'an attempt to apply the hadith scholars' rules to the criticism of the sira reports': it gives sound reports first, then good ones, then weak ones that are corroborated; it is strict where belief and law are concerned and lenient for reports on building and battle description; and it draws on the hadith collections alongside the sira books."
