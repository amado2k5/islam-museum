label: { ar: "الأعمال الصالحة في الأشهر الحرم", en: "Righteous deeds in the sacred months", ur: "حرمت والے مہینوں میں نیک اعمال" }
summary:
  ar: "سائل سأل عن الأعمال الصالحة في الأشهر الحرم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22613)⁩ أن الأشهر الحرم الأربعة هي رجب وذو القعدة وذو الحجة والمحرم، وأنها من أحب الأزمان إلى الله، وبيّن الجواب ما يستحب فيها من الأعمال الصالحة وما يجب اجتنابه."
  en: "A questioner asked about righteous deeds in the sacred months. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22613) answered that the four sacred months are Rajab, Dhu'l-Qa'da, Dhu'l-Hijja and Muharram, and that they are among the times most beloved to God; the answer sets out the righteous deeds recommended in them and what must be avoided."
  ur: "ایک سائل نے حرمت والے مہینوں میں نیک اعمال کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22613)⁩ نے جواب دیا کہ چار حرمت والے مہینے رجب، ذوالقعدہ، ذوالحجہ اور محرم ہیں اور یہ اللہ کے نزدیک محبوب اوقات میں ہیں؛ جواب میں ان میں مستحب نیک اعمال اور جن چیزوں سے بچنا لازم ہے بیان ہوا۔"
