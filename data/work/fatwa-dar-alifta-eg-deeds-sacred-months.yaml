id: work/fatwa-dar-alifta-eg-deeds-sacred-months
class: work
kind: fatwa
label: { ar: "الأعمال الصالحة في الأشهر الحرم", en: "Righteous deeds in the sacred months", ur: "حرمت والے مہینوں میں نیک اعمال", es: "Obras justas en los meses sagrados", fr: "Actes vertueux durant les mois sacrés", tr: "Kutsal aylarda iyi işler", id: "Perbuatan baik selama bulan-bulan suci" }
summary:
  ar: "سائل سأل عن الأعمال الصالحة في الأشهر الحرم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22613)⁩ أن الأشهر الحرم الأربعة هي رجب وذو القعدة وذو الحجة والمحرم، وأنها من أحب الأزمان إلى الله، وبيّن الجواب ما يستحب فيها من الأعمال الصالحة وما يجب اجتنابه."
  en: "A questioner asked about righteous deeds in the sacred months. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22613) answered that the four sacred months are Rajab, Dhu'l-Qa'da, Dhu'l-Hijja and Muharram, and that they are among the times most beloved to God; the answer sets out the righteous deeds recommended in them and what must be avoided."
  ur: "ایک سائل نے حرمت والے مہینوں میں نیک اعمال کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22613)⁩ نے جواب دیا کہ چار حرمت والے مہینے رجب، ذوالقعدہ، ذوالحجہ اور محرم ہیں اور یہ اللہ کے نزدیک محبوب اوقات میں ہیں؛ جواب میں ان میں مستحب نیک اعمال اور جن چیزوں سے بچنا لازم ہے بیان ہوا۔"
  es: "Un consultante preguntó acerca de las buenas obras en los meses sagrados. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22613) respondió que los cuatro meses sagrados son Rajab, Dhu'l-Qa'da, Dhu'l-Hijja y Muharram, y que se encuentran entre los momentos más amados por Dios; la respuesta expone las buenas obras recomendadas en ellos y lo que debe evitarse."
  fr: "Un internaute a posé une question sur les bonnes actions à accomplir durant les mois sacrés. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22613) a répondu que les quatre mois sacrés sont Rajab, Dhu al-Qa'da, Dhu al-Hijja et Muharram, et qu'ils comptent parmi les périodes les plus aimées de Dieu; la réponse expose les bonnes actions recommandées durant ces mois et celles à éviter."
  tr: "Bir soru soran kişi kutsal aylarda yapılan doğru amallar hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 22613), dört kutsal ayın Recep, Zulü Kı'da, Zhu al-Hicce ve Muharrem olduğunu ve bunların Allah'ın en sevdiği zamanlar arasında olduğunu belirtti. Cevap, bu dönemde hangi iyiliklerin tavsiye edildiğini ve nelerden kaçınılması gerektiğini açıkladı."
  id: "Seorang penanya menanyakan tentang perbuatan benar selama bulan-bulan suci. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22613) menjawab bahwa empat bulan suci adalah Rajab, Dhu al-Qi'dah, Dhu al-Hijjah, dan Muharram, dan bahwa itu termasuk waktu yang paling dicintai Allah. Jawabannya memperjelas perbuatan baik apa yang direkomendasikan selama masa tersebut dan apa yang harus dihindari."
