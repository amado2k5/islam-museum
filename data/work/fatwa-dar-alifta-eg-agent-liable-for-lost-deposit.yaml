id: work/fatwa-dar-alifta-eg-agent-liable-for-lost-deposit
class: work
kind: fatwa
label: { ar: "حكم ضمان ما تلف في يد الوكيل من أمانة", en: "Is the agent liable for a trust lost in his hand?", ur: "وکیل کے ہاتھ امانت ضائع ہو جائے تو ضمان", es: "¿Es responsable el agente por un bien fiduciario que se pierde mientras está en sus manos?", fr: "L'agent est-il responsable en cas de perte d'un fonds fiduciaire entre ses mains ?", tr: "Güven temsilcisinin elinde kaybedilen şeylerin garanti altına alınmasına ilişkin karar", id: "Putusan tentang jaminan apa yang hilang di tangan agen trust" }
summary:
  ar: "سائل أُعطي هاتفًا محمولًا ليوصله إلى عمه فتلف أو فقد فسأل عن الضمان. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21949)⁩ أن يده على الهاتف يد أمانة فلا يضمنه ما لم يتعد أو يفرط على ما فصّل الجواب."
  en: "A man was given a mobile phone to deliver to his uncle and it was damaged or lost; he asked about liability. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21949) answered that his hand over the phone is a hand of trust — he is not liable unless he transgressed or was negligent, as the answer details."
  ur: "ایک شخص کو چچا تک پہنچانے کے لیے موبائل فون دیا گیا جو ضائع یا کھو گیا؛ اس نے ضمان پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21949)⁩ نے جواب دیا کہ فون پر اس کا ہاتھ امانت کا ہاتھ ہے — جب تک اس نے زیادتی یا کوتاہی نہ کی ہو وہ ضامن نہیں، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre recibió un teléfono móvil para entregárselo a su tío, pero este resultó dañado o se perdió. Preguntó sobre la responsabilidad del cliente. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21949) respondió que, al entregar el teléfono, el cliente depositó su confianza en él, por lo que no es responsable a menos que haya cometido una falta o haya actuado con negligencia, como se detalla en la respuesta."
  fr: "Un homme devait remettre un téléphone portable à son oncle, mais celui-ci a été endommagé ou perdu. Il s'est interrogé sur la responsabilité de l'autorité compétente. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21949) a répondu que la remise du téléphone constituait une confiance et que l'homme n'était pas responsable, sauf en cas de faute ou de négligence, comme le précise la réponse."
  tr: "Bir soru soran kişiye, hasar görmüş veya kaybolmuş olan amcasına teslim etmesi için bir cep telefonu verildi ve garanti hakkında bilgi aldı. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21949), telefondaki elinin güvenilir olduğunu, bu yüzden cevapta belirtilenleri ihmal etmedikçe sorumlu olmadığını söyledi."
  id: "Seorang penanya diberikan ponsel untuk dikirim ke pamannya, yang rusak atau hilang, dan ia menanyakan tentang jaminan tersebut. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21949) menjawab bahwa tangan teleponnya dapat dipercaya, jadi ia tidak bertanggung jawab kecuali melanggar atau mengabaikan rincian dalam jawaban."
