id: work/fatwa-dar-alifta-eg-takbir-when-rising-from-ruku
class: work
kind: fatwa
label: { ar: "حكم قول ⁦(الله أكبر)⁩ عند الرفع من الركوع", en: "Saying 'Allahu akbar' when rising from bowing", ur: "رکوع سے اٹھتے وقت ⁦(اللہ اکبر)⁩ کہنا", es: "Decir 'Allahu Akbar' al levantarse de la reverencia.", fr: "Dire « Allahu akbar » en se relevant après s'être incliné", tr: "Eğilmekten kalkarken (Allahu Ekber) söyleme hakkı", id: "Putusan tentang mengucapkan (Allahu Akbar) saat bangkit dari membungkuk" }
summary:
  ar: "سائل استبدل ناسيًا قول ⁦(الله أكبر)⁩ بـ⁦(سمع الله لمن حمده)⁩ عند الرفع من الركوع فسأل عن صلاةه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21611)⁩ أن صلاته صحيحة ولا يلزمه إعادتها على ما فصّل الجواب."
  en: "A man who had forgetfully said 'sami'a Allahu liman hamidah' instead of 'Allahu akbar' when rising from bowing asked about his prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21611) answered that his prayer is valid and need not be repeated — as the answer details."
  ur: "ایک شخص نے رکوع سے اٹھتے وقت بھول کر ⁦(اللہ اکبر)⁩ کے بجائے ⁦(سمع الله لمن حمده)⁩ کہہ دیا اور اپنی نماز کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21611)⁩ نے جواب دیا کہ اس کی نماز صحیح ہے اور دہرانا واجب نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre que, por olvido, había dicho «sami'a Allahu liman hamidah» en lugar de «Allahu akbar» al levantarse de la reverencia, preguntó sobre su oración. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21611) respondió que su oración es válida y no necesita repetirse, como se detalla en la respuesta."
  fr: "Un homme qui, en se relevant après une prosternation, avait prononcé par inadvertance « sami'a Allahu liman hamidah » au lieu de « Allahu akbar », interrogea Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21611) sur la validité de sa prière. Dar al-Ifta répondit que sa prière était valide et qu'il n'était pas nécessaire de la répéter, comme le précise la réponse."
  tr: "Bir soru soran kişi, eğilmekten kalkıp namazını sorduğunda (Allahu Ekber) ifadesini (Sama'a Allah li-Hamidhu) ile unutkança değiştirdi. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 21611), duasının geçerli olduğunu ve cevabında ayrıntılı olarak tekrarlamak zorunda olmadığını söyledi."
  id: "Seorang penanya dengan lupa mengganti frasa (Allahu Akbar) dengan (Sama'a Allah li-Hamidhu) saat bangkit dari membungkuk dan bertanya tentang doanya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21611) menjawab bahwa doanya sah dan ia tidak wajib mengulanginya, seperti yang dijelaskan dalam jawabannya."
