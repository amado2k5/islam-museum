label: { ar: "كتاب الحساب للخوارزمي ⁦(الحساب الهندي)⁩", en: "al-Khwarizmi's Book of Arithmetic (Algorismus)", es: "El libro de aritmética de al-Juarismi (Algorismo)", fr: "Le livre d'arithmétique d'al-Khwarizmi (Algorismus)", ur: "الخوارزمی کی ریاضی کی کتاب ⁦(الگورزمس)⁩", tr: "Al-Khwarizmi'nin Aritmetik Kitabı (Hint Aritmetiği Kitabı)", id: "Buku Aritmatika Al-Khwarizmi (Aritmetika India)" }
summary:
  ar: "كتاب الخوارزمي في الحساب، الذي يذكر محققا طبعة القاهرة لكتاب الجبر أنه وصل إلينا وأن طريقة الحساب الهندية ومعها الصفر وصلت إلى الغرب عن طريقه مترجماً إلى اللاتينية، ومن اسم مؤلفه جاءت كلمات Algorismus وAlgorithm وguarismo {cite:khwarizmi-jabr-cairo-1939 p.23} {cite:khwarizmi-jabr-cairo-1939 p.25}."
  en: "Al-Khwarizmi's book on arithmetic, which the Cairo editors of his algebra say has survived and through whose Latin translation the Indian method of reckoning, including zero, reached the West; from its author's name came the words Algorismus, algorithm and guarismo."
  es: "El libro de Al-Juarismi sobre aritmética, que según los editores de El Cairo de su álgebra ha sobrevivido y a través de cuya traducción al latín el método indio de cálculo, incluido el cero, llegó a Occidente; del nombre de su autor surgieron las palabras Algorismus, algoritmo y guarismo."
  fr: "Le livre d'algèbre d'Al-Khwarizmi, dont les éditeurs cairotes de son algèbre affirment qu'il a survécu et grâce auquel la traduction latine de laquelle la méthode indienne de calcul, y compris le zéro, est parvenue en Occident; du nom de son auteur sont venus les mots Algorismus, algorithme et guarismo."
  ur: "الخوارزمی کی ریاضی پر کتاب، جسے اس کے الجبرا کے قاہرہ کے مدیران کہتے ہیں زندہ ہے اور جس کے لاطینی ترجمے کے ذریعے ہندستانی طریقہ حساب، بشمول صفر، مغرب تک پہنچا؛ اس کے مصنف کے نام سے Algorismus، algorithm اور guarismo کے الفاظ آئے۔"
  tr: "Al-Khwarizmi'nin Aritmetik kitabı, Kahire baskısında bize ulaştığını ve sıfır Hint aritmetik yönteminin Batı'ya ulaştığını Latince'ye çevirerek belirtir. Yazarın adından Algorismus, Algorithm ve guarismo kelimeleri gelir {cite:khwarizmi-jabr-cairo-1939 s.23} {cite:khwarizmi-jabr-cairo-1939 s.25}."
  id: "Buku aritmatika Al-Khwarizmi, yang ia sebutkan dalam edisi Aljabar Kairo, sampai kepada kita dan metode aritmetika India dengan nol sampai ke Barat melalui terjemahan Latin. Dari nama penulis lahir kata Algorismus, Algorithm, dan guarismo {cite:khwarizmi-jabr-cairo-1939 hlm.23} {cite:khwarizmi-jabr-cairo-1939 hlm.25}."
