label:
  ar: "سيرة رسول الله 2026، الحلقة 25: آثار إسلام عمر"
  en: "The Biography of the Messenger of God 2026, episode 25: The Effects of Umar's Conversion"
  ur: "سیرتِ رسول اللہ 2026، قسط 25: عمر کے اسلام لانے کے اثرات"
  fr: "La biographie du Messager de Dieu 2026, épisode 25 : Les effets de la conversion d'Omar"
  es: "La biografía del Mensajero de Dios 2026, episodio 25: Los efectos de la conversión de Umar"
summary:
  ar: "يختم المحاضر الحديث عن إسلام عمر بن الخطاب في السنة السادسة من البعثة. يزن الحديث الوارد في دعاء النبي بأن يعز الله الإسلام بأحد الرجلين، ويقرأ روايتي ابن إسحاق المدنية والمكية وروايات البخاري، ثم ينتقل إلى ابن سعد لعرض مشاهد من حياة عمر اللاحقة، ويمهد لسنوات المقاطعة التي تلي."
  en: "The lecturer closes the account of the conversion of Umar ibn al-Khattab in the sixth year of the mission. He weighs the hadith about the Prophet's prayer for Islam to be strengthened through one of two men, reads Ibn Ishaq's two narrations (Medinan and Meccan) and al-Bukhari's reports, then turns to Ibn Sa'd for scenes from Umar's later life, and previews the boycott years that follow."
  ur: "مقرر سنہ بعثت کے چھٹے سال میں عمر بن خطاب کے اسلام لانے کا بیان مکمل کرتے ہیں۔ وہ اس حدیث کو پرکھتے ہیں جس میں نبی نے دعا کی کہ اسلام کو دو آدمیوں میں سے ایک کے ذریعے قوت ملے، ابن اسحاق کی دونوں روایات مدنی اور مکی اور بخاری کی روایات پڑھتے ہیں، پھر عمر کی بعد کی زندگی کے مناظر کے لیے ابن سعد کی طرف جاتے ہیں، اور آنے والے مقاطعے کے سالوں کا تعارف کراتے ہیں۔"
  fr: "Le conférencier achève le récit de la conversion d'Omar ibn al-Khattab, la sixième année de la mission. Il pèse le hadith sur la prière du Prophète pour que l'islam soit renforcé par l'un de deux hommes, lit les deux récits d'Ibn Ishaq (médinois et mecquois) et les rapports d'al-Bukhari, puis se tourne vers Ibn Sa'd pour des scènes de la vie ultérieure d'Omar, et annonce les années de boycott qui suivent."
  es: "El conferenciante cierra el relato de la conversión de Umar ibn al-Khattab en el sexto año de la misión. Sopesa el hadiz sobre la súplica del Profeta para que el islam fuera fortalecido por uno de dos hombres, lee los dos relatos de Ibn Ishaq (medinés y mequí) y los informes de al-Bukhari, y luego recurre a Ibn Sa'd para escenas de la vida posterior de Umar, y anticipa los años de boicot que siguen."
