summary:
  ar: "دراسة في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشرت نوفمبر 2021)⁩ تبحث في مصطلح الردة في الخطاب الفقهي وما قيل في عقوبتها في الإسلام على ما فصّلته الدراسة."
  en: "A study on the Fiqh Council of North America site (published November 2021) examining the term ridda in Islamic legal discourse and what has been said about its punishment in Islam — as the study details."
  ur: "فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ کی تحقیق ⁦(شائع شدہ نومبر 2021)⁩ ارتداد کی فقہی اصطلاح اور اس کی سزا کے بارے میں کہی گئی آراء پر — جیسا کہ تحقیق میں تفصیل ہے۔"
  es: "Un estudio publicado en el sitio web del Consejo de Fiqh de Norteamérica (en noviembre de 2021) examina el término ridda en el discurso jurídico islámico y lo que se ha dicho sobre su castigo en el Islam, tal como se detalla en el estudio."
  fr: "Une étude publiée sur le site du Conseil Fiqh d'Amérique du Nord (novembre 2021) examine le terme ridda dans le discours juridique islamique et ce qui a été dit à propos de sa punition en Islam — comme le détaille l'étude."
  tr: "Kuzey Amerika Fıkıh Konseyi'nin web sitesinde (Kasım 2021'de yayımlandı) yapılan bir çalışma, fıkıh söylemindeki dinden dönme terimini ve İslam'da bunun cezalandırılması hakkında neler söylendiğini inceliyor; bu çalışma bu çalışmada ayrıntılı olarak yer alıyor."
  id: "Sebuah studi di situs web Jurisprudential Council of North America (diterbitkan November 2021) meneliti istilah murtad dalam wacana yurisprudensi dan apa yang dikatakan tentang hukumannya dalam Islam, sebagaimana dijelaskan oleh studi tersebut."
