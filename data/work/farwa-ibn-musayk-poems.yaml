label: { ar: "شعر فروة بن مسيك في يوم الردم وفي مسيره إلى النبي", en: "Farwa ibn Musayk's verses on the Day of al-Radm and on his journey to the Prophet", es: "Versículos de Farwa ibn Musayk sobre el Día de al-Radm y su viaje hacia el Profeta", fr: "Versets de Farwa ibn Musayk sur le jour d'al-Radm et sur son voyage vers le Prophète", ur: "فروا بن مسیک کی آیات یوم الردم اور سفر نبوی کے موقع پر", tr: "Farwa bin Misik'in çöplük günü ve peygambere yürüyüşündeki şiirleri", id: "Puisi Farwa bin Misik pada hari pembuangan sampah dan dalam perjalanannya menuju nabi" }
summary:
  ar: "قصيدة على روي النون قالها فروة بن مسيك المرادي في يوم الردم: إن غلبوا فغلّابون قديماً وإن غُلبوا فغير مغلَّبين، وليس طبّهم الجبن، والدهر دولته سجال، ولو خلد الملوك لخلدوا؛ وبيتان قالهما حين توجه إلى النبي مفارقاً ملوك كندة. أثبت ابن هشام أن أول القصيدة وقوله «فإن نغلب» عن غير ابن إسحاق، وأنشد عن أبي عبيدة رواية للبيت الثاني."
  en: "A nun-rhymed poem Farwa ibn Musayk al-Muradi composed on the Day of al-Radm: if they win they have long been winners and if beaten they are not the oft-beaten, cowardice is not their way, fortune turns by turns, and had kings lived forever so would they; and two verses he said when he set out for the Prophet, leaving the kings of Kinda. Ibn Hisham marks the first line and the phrase 'if we win' as from other than Ibn Ishaq and gives Abu Ubayda's reading of the second couplet."
  es: "Un poema con rima monástica que Farwa ibn Musayk al-Muradi compuso el Día de al-Radm: si ganan, llevan mucho tiempo siendo vencedores, y si son derrotados, no son los que suelen ser derrotados; la cobardía no es su camino; la fortuna cambia por turnos, y si los reyes vivieran para siempre, ellos también lo harían; y dos versos que dijo cuando partió en busca del Profeta, dejando a los reyes de Kinda. Ibn Hisham señala que el primer verso y la frase \"si ganamos\" no son de Ibn Ishaq y da la lectura de Abu Ubayda del segundo pareado."
  fr: "Farwa ibn Musayk al-Muradi composa un poème en rimes nun, le jour d'al-Radm: « S'ils gagnent, ils sont depuis longtemps des vainqueurs; s'ils sont vaincus, ils ne sont pas des vaincus fréquents; la lâcheté n'est pas leur voie; la fortune est changeante; et si les rois vivaient éternellement, il en serait de même pour eux. » Il récita également deux versets en partant à la rencontre du Prophète, quittant les rois de Kinda. Ibn Hisham attribue le premier vers et l'expression « si nous gagnons » à une autre personne qu'Ibn Ishaq et donne la lecture du second distique par Abu Ubayda."
  ur: "فروا ابن مسیق المرادی نے یوم الردم پر لکھی ایک نون تالیف نظم: اگر وہ جیت جاتے ہیں تو وہ طویل عرصے سے فاتح ہیں اور اگر وہ مارے جاتے ہیں تو وہ اکثر مارے جانے والے نہیں ہیں، بزدلی ان کا راستہ نہیں ہے، قسمت باری باری بدلتی ہے، اور اگر بادشاہ ہمیشہ زندہ رہتے تو وہ ہوتے۔ اور دو آیات اس نے کہی جب وہ نبی کی طرف روانہ ہوئے، کندہ کے بادشاہوں کو چھوڑ کر۔ ابن ہشام نے پہلی سطر اور فقرہ 'اگر ہم جیت گئے' کو ابن اسحاق کے علاوہ دوسرے مصرعے کی طرح نشان زد کرتے ہیں اور ابو عبیدہ کا دوسرا شعر پڑھتے ہیں۔"
  tr: "Furwah ibn Musik al-Muradi tarafından Yağmur Günü'nde söylenen rahibenin anlatımına dayanan bir şiir: 'Eğer galip gelirlerse, geçmişte yenilecekler; eğer galip gelirlerse, yenilmezler.' Onların şifası korkaklık değildir, zaman tartışmalı halidir ve eğer krallar ölümsüz olsaydı ölümsüz olurlardı; ve Kindah krallarını bırakırken Peygamber'e giderken iki ayet okumuştur. İbn Hisham, şiirin başlangıcının ve 'Eğer galip gelirsek' ifadesinin İbn İshaq'tan başka birinden geldiğini doğrulamış ve Ebu Ubeyde'den ikinci ayetin bir rivayetini okudu."
  id: "Sebuah puisi yang didasarkan pada riwayat biarawati itu, yang dikatakan oleh Furwah ibn Musik al-Muradi pada Hari Hujan: 'Jika mereka menang, mereka akan kalah di masa lalu; jika mereka menang, mereka tidak akan dikalahkan.' Obat mereka bukanlah pengecut, dan waktu adalah keadaan perselisihan, dan jika raja abadi, mereka akan abadi; dan dua ayat yang ia bacakan ketika ia pergi kepada Nabi meninggalkan raja-raja Kindah. Ibn Hisham menegaskan bahwa awal puisi dan frasa 'Jika kita menang' berasal dari seseorang selain Ibn Ishaq, dan ia membacakan dari Abu Ubaidah sebuah narasi dari ayat kedua."
