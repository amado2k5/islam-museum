label: { ar: "صورة الأرض ⁦(ابن حوقل)⁩", en: "Surat al-Ard (Ibn Hawqal)", ur: "صورۃ الارض ⁦(ابن حوقل)⁩" }
summary:
  ar: "كتاب أبي القاسم ابن حوقل النصيبي في جغرافية بلاد الإسلام، ويُعرف أيضاً بـ«المسالك والممالك والمفاوز والمهالك»؛ يصف فيه أشكال الأرض وأقاليم البلدان الإسلامية إقليماً إقليماً مع صورة ⁦(خريطة)⁩ لكل إقليم، ومدنه وأنهاره وجباياته وخراجه ومسافاته وتجاراته، من ديار العرب والمغرب والأندلس وصقلية إلى خراسان وما وراء النهر؛ بدأ أسفاره من بغداد يوم الخميس 7 رمضان 331هـ {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 6} {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 9-10} {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 437-438}."
  en: "Abu al-Qasim Ibn Hawqal al-Nasibi's geography of the lands of Islam, also known as al-Masalik wa-al-Mamalik wa-al-Mafawiz wa-al-Mahalik. It describes the shape of the earth and the provinces of the Islamic lands one by one, with an image (map) for each, and their cities, rivers, revenues, land tax, distances and trade, from Arabia, the Maghrib, al-Andalus and Sicily to Khurasan and Transoxiana. He set out on his travels from Baghdad on Thursday 7 Ramadan 331 AH {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 6} {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 9-10} {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 437-438}."
  ur: "ابو القاسم ابن حوقل نصیبی کی اسلامی ممالک کے جغرافیے پر کتاب، جو «المسالک والممالک والمفاوز والمہالک» کے نام سے بھی معروف ہے۔ اس میں زمین کی شکل اور اسلامی ممالک کے اقالیم کا ایک ایک کر کے بیان ہے، ہر اقلیم کی صورت ⁦(نقشے)⁩ کے ساتھ، اور اس کے شہر، دریا، محاصل، خراج، فاصلے اور تجارتیں — دیارِ عرب، مغرب، اندلس اور صقلیہ سے خراسان اور ماوراء النہر تک۔ انہوں نے اپنے سفر کا آغاز جمعرات 7 رمضان 331ھ کو بغداد سے کیا {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 6} {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 9-10} {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 437-438}۔"
