id: work/fatwa-amja-stone-cast-into-fire
class: work
kind: fatwa
label: { ar: "سماع الصحابة صوت الحجر في جهنم", en: "The Companions hearing a stone cast into the Fire", ur: "صحابہ کا جہنم میں پتھر کی ٹھوکر سننا", es: "Los Compañeros oyeron una piedra arrojada al fuego.", fr: "Les Compagnons entendent une pierre jetée dans le feu", tr: "Yoldaşlar cehennemdeki taşın sesini duydular", id: "Para sahabat mendengar suara batu di neraka" }
summary:
  ar: "سأل سائل عن الحديث الذي كان فيه النبي جالسًا مع أصحابه فسمعوا صوت صخرة قذفت في النار وهم في الدنيا. أجاب القسم الشرعي ⁦(فتوى رقم 78237 بتاريخ 16 مارس 2009)⁩ أن هذا الحديث أخرجه الإمامان أحمد في مسنده ومسلم في صحيحه، وفيه ما يدل على سماعهم هذه الوجبة أو السقطة للحجر في قعر جهنم وهو قوله تدرون ما هذا."
  en: "A questioner asked about the hadith in which the Prophet sat with his Companions and they heard the sound of a rock cast into the Fire while still in this world. The site's sharia section (fatwa no. 78237, 16 March 2009) answered that the hadith was narrated by Ahmad in his Musnad and Muslim in his Sahih, and it shows their hearing that fall of the stone into the pit of jahannam in his saying 'do you know what this was'."
  ur: "ایک سائل نے اس حدیث کی وضاحت چاہی کہ صحابہ نے جہنم میں پھینکے پتھر کی آواز سنی۔ شرعی شعبے ⁦(فتویٰ 78237، 16 مارچ 2009)⁩ کے مطابق یہ احمد اور مسلم کی روایت ہے اور سننا ظاہر ہے۔"
  es: "Un usuario preguntó sobre el hadiz en el que el Profeta se sentó con sus Compañeros y oyeron el sonido de una roca arrojada al Fuego mientras aún estaban en este mundo. La sección de sharia del sitio (fatwa n.° 78237, 16 de marzo de 2009) respondió que el hadiz fue narrado por Ahmad en su Musnad y por Muslim en su Sahih, y muestra que oyeron la caída de la piedra al abismo del infierno cuando él dijo: \"¿Sabéis qué era esto?\"."
  fr: "Un internaute a posé une question concernant le hadith où le Prophète, assis avec ses Compagnons, entendit le bruit d'une pierre jetée dans l'Enfer alors qu'il était encore en vie. La section charia du site (fatwa n° 78237, 16 mars 2009) a répondu que ce hadith était rapporté par Ahmad dans son Musnad et Muslim dans son Sahih, et qu'il relate qu'ils entendirent la chute de la pierre dans la fosse de l'Enfer lorsque le Prophète demanda: « Savez-vous ce que c'était ? »"
  tr: "Bir sorgulayan kişiye, Peygamber'in sahabeleriyle oturduğu ve bu dünyada bir kayanın ateşe atılma sesi duydukları hadis hakkında soru soruldu. Dini bölüm (16 Mart 2009 tarihli 78237 No'lu fetva) bu hadisin İmam Ahmed tarafından Musned'inde, Müslüman ise Sahih'inde rivayet edildiğini ve bu yükü ya da taşın cehennemin dibine düşmesini duyduklarına dair kanıtlar içerdiğini yanıtladı; bu da onun sözü: Bunun ne olduğunu biliyor musunuz?"
  id: "Seorang penanya ditanya tentang hadis di mana Nabi duduk bersama para sahabatnya dan mereka mendengar suara batu yang dilempar ke api saat mereka masih di dunia ini. Bagian agama (Fatwa No. 78237 tanggal 16 Maret 2009) menjawab bahwa hadis ini diceritakan oleh Imam Ahmad dalam Mazhabnya dan Muslim dalam Sahih-nya, dan memuat bukti bahwa mereka mendengar beban ini atau jatuhnya batu ke dasar Neraka, yaitu perkataannya: Apakah kamu tahu apa ini?"
