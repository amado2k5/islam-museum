id: work/fatwa-amja-stone-cast-into-fire
class: work
kind: fatwa
label: { ar: "سماع الصحابة صوت الحجر في جهنم", en: "The Companions hearing a stone cast into the Fire", ur: "صحابہ کا جہنم میں پتھر کی ٹھوکر سننا", es: "Los Compañeros oyeron una piedra arrojada al fuego." }
summary:
  ar: "سأل سائل عن الحديث الذي كان فيه النبي جالسًا مع أصحابه فسمعوا صوت صخرة قذفت في النار وهم في الدنيا. أجاب القسم الشرعي ⁦(فتوى رقم 78237 بتاريخ 16 مارس 2009)⁩ أن هذا الحديث أخرجه الإمامان أحمد في مسنده ومسلم في صحيحه، وفيه ما يدل على سماعهم هذه الوجبة أو السقطة للحجر في قعر جهنم وهو قوله تدرون ما هذا."
  en: "A questioner asked about the hadith in which the Prophet sat with his Companions and they heard the sound of a rock cast into the Fire while still in this world. The site's sharia section (fatwa no. 78237, 16 March 2009) answered that the hadith was narrated by Ahmad in his Musnad and Muslim in his Sahih, and it shows their hearing that fall of the stone into the pit of jahannam in his saying 'do you know what this was'."
  ur: "ایک سائل نے اس حدیث کی وضاحت چاہی کہ صحابہ نے جہنم میں پھینکے پتھر کی آواز سنی۔ شرعی شعبے ⁦(فتویٰ 78237، 16 مارچ 2009)⁩ کے مطابق یہ احمد اور مسلم کی روایت ہے اور سننا ظاہر ہے۔"
  es: "Un usuario preguntó sobre el hadiz en el que el Profeta se sentó con sus Compañeros y oyeron el sonido de una roca arrojada al Fuego mientras aún estaban en este mundo. La sección de sharia del sitio (fatwa n.° 78237, 16 de marzo de 2009) respondió que el hadiz fue narrado por Ahmad en su Musnad y por Muslim en su Sahih, y muestra que oyeron la caída de la piedra al abismo del infierno cuando él dijo: \"¿Sabéis qué era esto?\"."
