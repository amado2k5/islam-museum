id: work/fatwa-dar-alifta-transferring-a-land-allocation-for-a-premium
class: work
kind: fatwa
label: { ar: "حكم التنازل عن تخصيص قطعة أرض مقابل مبلغ من المال", en: "Transferring a land-allocation place for a premium", ur: "زمین کی الاٹمنٹ کی باری رقم کے عوض دوسرے کو دینے کا حکم", es: "Transferencia de una plaza de asignación de terreno por una prima", fr: "Transfert d'une place d'attribution de terrain moyennant une prime", tr: "Bir arazi parçasının para karşılığında devredilmesine ilişkin karar", id: "Putusan tentang pemindahan alokasi sebidang tanah sebagai imbalan sejumlah uang" }
summary:
  ar: "سؤال عن امرأة حجزت قطعة أرض لدى جهاز إحدى المدن العمرانية الجديدة ودفعت جدية الحجز، ثم عرض عليها شخص أن يأخذ ترتيبها في التخصيص مقابل رد ما دفعته ومبلغ زائد يسمى ⁦(أوفر)⁩، أجابت فيه دار الإفتاء المصرية بأن التنازل وأخذ المال من دون الرجوع إلى الجهة المختصة وقبل استيفاء شروطها محرم، لأنه تحايل على الضوابط وتعدٍّ على حق من يليها في الدور، وأن أخذ المقابل يصح شرعًا إذا تم بعد موافقة الجهة المختصة واستيفاء اللوائح وتراضي الطرفين. بيّنت الدار أن جهاز المدينة تابع لهيئة المجتمعات العمرانية الجديدة المنشأة بالقانون 59 لسنة 1979، ونقلت عن قرار مجلس الوزراء 2904 لسنة 1995 منع التصرف في الأرض قبل مرور عشر سنوات من استلامها إلا بموافقة كتابية من رئيس الجهاز. واستدلت لصحة التنازل بالرضا بحديث أن مال المسلم لا يحل إلا بطيب نفس منه، وبأن الأصل في العقود والشروط الصحة، ولتحريم التنازل الملتوي بأن الحيل محرمة، ناقلة عن ابن حزم وابن قدامة والشاطبي والخطابي."
  en: "A question about a woman who reserved a plot of land with the authority of one of Egypt's new urban communities and paid the reservation deposit, then was offered by another person to take her place in the allocation in return for refunding what she had paid plus an extra sum known as an 'over'; Dar al-Ifta al-Misriyya answered that transferring the place and taking the money without going through the competent authority and before meeting its conditions is forbidden, because it circumvents the rules and infringes the right of the next person in line, while taking the premium is valid in sharia if it happens after the authority approves the transfer and the regulations are met, with both parties consenting. Dar al-Ifta explained that the city authority belongs to the New Urban Communities Authority, created by Law 59 of 1979, and quoted Cabinet Decree 2904 of 1995 forbidding disposal of the land within ten years of receipt without the written approval of the authority's head. It grounded the validity of a consensual transfer in the hadith that a Muslim's property is lawful only with his willing consent and in the default validity of contracts and conditions, and grounded the prohibition of the roundabout transfer in the prohibition of legal devices (hiyal), quoting Ibn Hazm, Ibn Qudama, al-Shatibi and al-Khattabi."
  ur: "ایک خاتون کے بارے میں سوال جس نے مصر کے ایک نئے شہری علاقے کے ادارے کے پاس زمین کا ایک پلاٹ بک کرایا اور بکنگ کی رقم ادا کی، پھر ایک شخص نے پیشکش کی کہ وہ اس کی الاٹمنٹ کی باری لے لے اور اس کے عوض ادا کی گئی رقم کے ساتھ ایک اضافی رقم ⁦(اوور)⁩ دے؛ دار الافتاء مصر نے جواب دیا کہ متعلقہ ادارے کی طرف رجوع کیے بغیر اور اس کی شرائط پوری کیے بغیر باری دوسرے کو دینا اور رقم لینا حرام ہے، کیونکہ یہ ضوابط سے حیلہ بازی اور باری میں بعد والے کے حق پر زیادتی ہے، جبکہ اگر متعلقہ ادارے کی منظوری اور قواعد کی تکمیل کے بعد فریقین کی رضامندی سے معاوضہ لیا جائے تو شرعاً درست ہے۔ دار الافتاء نے بیان کیا کہ شہر کا ادارہ 1979 کے قانون 59 سے قائم نئے شہری علاقوں کی اتھارٹی کے تحت ہے، اور 1995 کے وزرائی فیصلے 2904 سے نقل کیا کہ زمین وصولی کے دس سال سے پہلے ادارے کے سربراہ کی تحریری منظوری کے بغیر اس میں تصرف ممنوع ہے۔ رضامندی سے منتقلی کے درست ہونے پر اس حدیث سے استدلال کیا کہ مسلمان کا مال اس کی خوشدلی کے بغیر حلال نہیں، اور اس اصول سے کہ عقود اور شرائط میں اصل صحت ہے؛ اور چور راستے سے منتقلی کی حرمت پر حیلوں کی ممانعت سے، ابن حزم، ابن قدامہ، شاطبی اور خطابی سے نقل کرتے ہوئے۔"
  es: "Ante una pregunta sobre una mujer que reservó un terreno con la autoridad de una de las nuevas comunidades urbanas de Egipto y pagó el depósito de reserva, a quien otra persona le ofreció ocupar su lugar en la asignación a cambio del reembolso de lo pagado más una suma adicional conocida como \"sobrepago\", Dar al-Ifta al-Misriyya respondió que transferir el lugar y recibir el dinero sin pasar por la autoridad competente y antes de cumplir con sus condiciones está prohibido, ya que elude las normas e infringe el derecho de la siguiente persona en la lista, mientras que recibir el sobrepago es válido según la sharia si se realiza después de que la autoridad apruebe la transferencia y se cumplan las regulaciones, con el consentimiento de ambas partes. Dar al-Ifta explicó que la autoridad de la ciudad pertenece a la Autoridad de Nuevas Comunidades Urbanas, creada por la Ley 59 de 1979, y citó el Decreto del Gabinete 2904 de 1995 que prohíbe la enajenación del terreno dentro de los diez años posteriores a su recepción sin la aprobación por escrito del titular de la autoridad. Fundamentó la validez de una transferencia consensual en el hadiz que dice que la propiedad de un musulmán es lícita solo con su consentimiento voluntario y en la validez por defecto de los contratos y condiciones, y fundamentó la prohibición de la transferencia indirecta en la prohibición de los mecanismos legales (hiyal), citando a Ibn Hazm, Ibn Qudama, al-Shatibi y al-Khattabi."
  fr: "Une question a été posée concernant une femme ayant réservé un terrain auprès d'une des nouvelles communautés urbaines d'Égypte et versé l'acompte. Une autre personne lui a ensuite proposé de prendre sa place en échange du remboursement de son acompte, majoré d'une somme supplémentaire appelée « surprime ». Dar al-Ifta al-Misriyya a répondu que le transfert de la place et l'encaissement de l'argent sans l'autorisation de l'autorité compétente et sans avoir rempli les conditions requises sont interdits, car cela contourne les règles et porte atteinte aux droits de la personne suivante sur la liste d'attente. En revanche, l'encaissement de la surprime est licite selon la charia s'il intervient après l'approbation du transfert par l'autorité et le respect des réglementations, avec le consentement des deux parties. Dar al-Ifta a expliqué que l'autorité compétente relève de l'Autorité des nouvelles communautés urbaines, créée par la loi n° 59 de 1979, et a cité le décret n° 2904 de 1995 du Conseil des ministres interdisant la cession du terrain dans les dix ans suivant son acquisition sans l'autorisation écrite du chef de l'autorité. Elle fonde la validité d'un transfert consensuel sur le hadith selon lequel la propriété d'un musulman n'est licite qu'avec son consentement libre et éclairé, ainsi que sur la validité par défaut des contrats et des conditions, et fonde l'interdiction du transfert indirect sur l'interdiction des artifices juridiques (hiyal), citant Ibn Hazm, Ibn Qudama, al-Shatibi et al-Khattabi."
  tr: "Yeni kentsel şehirlerden birinin yetkisiyle bir arazi ayıran ve rezervasyon ücretini ödeyen bir kadınla ilgili bir soru, ardından birinin ödediği paranın iadesi ve ek bir miktar (over) karşılığında tahsisini düzenlemeyi teklif etmesiyle ilgili bir soru. Mısır Dar al-Ifta, yetkili makama başvurmadan ve şartlarını yerine getirmeden para transferi ve alınmanın yasak olduğunu, çünkü bunun düzenlemeleri aştığını ve evde kendisini takip edenlerin haklarını ihlal ettiğini yanıtladı. Tazminatın alınması, yetkili makamın onayı, düzenlemelerin yerine getirilmesi ve karşılıklı anlaşma sonrası yapılması halinde dini olarak geçerlidir. Meclis, şehir otoritesinin 1979 tarihli 59 sayılı Kanun ile kurulan Yeni Kentsel Topluluklar Otoritesi'ne bağlı olduğunu netleştirdi ve 1995 tarihli 2904 sayılı Kabine Kararı'nı, arazinin on yıl öncesinde ancak otorite başkanının yazılı onayı olmadan alınmasını yasaklayan alıntıladı. Bir Müslümanın servetinin ancak onun istekliliğiyle yasal olduğu, sözleşme ve koşullardaki temerrüdün geçerlilik olduğu ve hilelerin yasak olduğuna dair çarpık feragatin yasaklanması için rıza yoluyla feragat etmenin geçerliliğini kanıt olarak gösterdi; bu sözler İbn Hazm, İbn Kudame, El-Şatibi ve El-Hattabi'den alıntılandı."
  id: "Sebuah pertanyaan tentang seorang wanita yang memesan sebidang tanah dengan otoritas salah satu kota baru dan membayar biaya reservasi, lalu seseorang menawarkan untuk mengatur alokasinya dengan imbalan pengembalian atas apa yang dibayarnya dan jumlah tambahan yang dipanggil (over). Dar al-Ifta Mesir menjawab bahwa pemindahan dan pengambilan uang tanpa merujuk kepada otoritas yang berwenang dan sebelum memenuhi syaratnya dilarang, karena hal itu mengakali peraturan dan melanggar hak mereka yang mengikutinya di rumah. Mengambil kompensasi tersebut sah secara hukum jika dilakukan setelah persetujuan otoritas yang berwenang, pemenuhan peraturan, dan kesepakatan bersama. Dewan menjelaskan bahwa otoritas kota berafiliasi dengan Otoritas Komunitas Perkotaan Baru yang didirikan oleh Undang-Undang No. 59 tahun 1979, dan mengutip Resolusi Kabinet 2904 tahun 1995 yang melarang penjualan tanah sebelum sepuluh tahun diterimanya kecuali dengan persetujuan tertulis dari kepala otoritas. Ia mengutip keabsahan pengabaian dengan persetujuan sebagai bukti hadits bahwa kekayaan Muslim hanya sah dengan kehendaknya, dan bahwa pelanggaran kontrak dan ketentuan adalah keabsahan, serta larangan pengecualian yang terdistorsi bahwa trik dilarang, yang dikutip dari Ibn Hazm, Ibn Qudamah, Al-Shatibi, dan Al-Khattabi."
