id: work/fatwa-dar-alifta-transferring-a-land-allocation-for-a-premium
class: work
kind: fatwa
label: { ar: "حكم التنازل عن تخصيص قطعة أرض مقابل مبلغ من المال", en: "Transferring a land-allocation place for a premium", ur: "زمین کی الاٹمنٹ کی باری رقم کے عوض دوسرے کو دینے کا حکم" }
summary:
  ar: "سؤال عن امرأة حجزت قطعة أرض لدى جهاز إحدى المدن العمرانية الجديدة ودفعت جدية الحجز، ثم عرض عليها شخص أن يأخذ ترتيبها في التخصيص مقابل رد ما دفعته ومبلغ زائد يسمى ⁦(أوفر)⁩، أجابت فيه دار الإفتاء المصرية بأن التنازل وأخذ المال من دون الرجوع إلى الجهة المختصة وقبل استيفاء شروطها محرم، لأنه تحايل على الضوابط وتعدٍّ على حق من يليها في الدور، وأن أخذ المقابل يصح شرعًا إذا تم بعد موافقة الجهة المختصة واستيفاء اللوائح وتراضي الطرفين. بيّنت الدار أن جهاز المدينة تابع لهيئة المجتمعات العمرانية الجديدة المنشأة بالقانون 59 لسنة 1979، ونقلت عن قرار مجلس الوزراء 2904 لسنة 1995 منع التصرف في الأرض قبل مرور عشر سنوات من استلامها إلا بموافقة كتابية من رئيس الجهاز. واستدلت لصحة التنازل بالرضا بحديث أن مال المسلم لا يحل إلا بطيب نفس منه، وبأن الأصل في العقود والشروط الصحة، ولتحريم التنازل الملتوي بأن الحيل محرمة، ناقلة عن ابن حزم وابن قدامة والشاطبي والخطابي."
  en: "A question about a woman who reserved a plot of land with the authority of one of Egypt's new urban communities and paid the reservation deposit, then was offered by another person to take her place in the allocation in return for refunding what she had paid plus an extra sum known as an 'over'; Dar al-Ifta al-Misriyya answered that transferring the place and taking the money without going through the competent authority and before meeting its conditions is forbidden, because it circumvents the rules and infringes the right of the next person in line, while taking the premium is valid in sharia if it happens after the authority approves the transfer and the regulations are met, with both parties consenting. Dar al-Ifta explained that the city authority belongs to the New Urban Communities Authority, created by Law 59 of 1979, and quoted Cabinet Decree 2904 of 1995 forbidding disposal of the land within ten years of receipt without the written approval of the authority's head. It grounded the validity of a consensual transfer in the hadith that a Muslim's property is lawful only with his willing consent and in the default validity of contracts and conditions, and grounded the prohibition of the roundabout transfer in the prohibition of legal devices (hiyal), quoting Ibn Hazm, Ibn Qudama, al-Shatibi and al-Khattabi."
  ur: "ایک خاتون کے بارے میں سوال جس نے مصر کے ایک نئے شہری علاقے کے ادارے کے پاس زمین کا ایک پلاٹ بک کرایا اور بکنگ کی رقم ادا کی، پھر ایک شخص نے پیشکش کی کہ وہ اس کی الاٹمنٹ کی باری لے لے اور اس کے عوض ادا کی گئی رقم کے ساتھ ایک اضافی رقم (اوور) دے؛ دار الافتاء مصر نے جواب دیا کہ متعلقہ ادارے کی طرف رجوع کیے بغیر اور اس کی شرائط پوری کیے بغیر باری دوسرے کو دینا اور رقم لینا حرام ہے، کیونکہ یہ ضوابط سے حیلہ بازی اور باری میں بعد والے کے حق پر زیادتی ہے، جبکہ اگر متعلقہ ادارے کی منظوری اور قواعد کی تکمیل کے بعد فریقین کی رضامندی سے معاوضہ لیا جائے تو شرعاً درست ہے۔ دار الافتاء نے بیان کیا کہ شہر کا ادارہ 1979 کے قانون 59 سے قائم نئے شہری علاقوں کی اتھارٹی کے تحت ہے، اور 1995 کے وزرائی فیصلے 2904 سے نقل کیا کہ زمین وصولی کے دس سال سے پہلے ادارے کے سربراہ کی تحریری منظوری کے بغیر اس میں تصرف ممنوع ہے۔ رضامندی سے منتقلی کے درست ہونے پر اس حدیث سے استدلال کیا کہ مسلمان کا مال اس کی خوشدلی کے بغیر حلال نہیں، اور اس اصول سے کہ عقود اور شرائط میں اصل صحت ہے؛ اور چور راستے سے منتقلی کی حرمت پر حیلوں کی ممانعت سے، ابن حزم، ابن قدامہ، شاطبی اور خطابی سے نقل کرتے ہوئے۔"
