summary:
  ar: "سائل سأل عن اتفاق بينه وبين أصدقائه عند إنشاء شركة على أن يأخذ نسبة ربح زائدة مقابل إدارته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21503)⁩ أن ما قام به السائل من اتفاق بينهم جميعًا على أن يأخذ نسبة ربح زائدة مقابل الإدارة جائز على ما فصّل الجواب."
  en: "A questioner asked about an agreement between himself and his friends on founding a company that he takes an extra profit share in return for management. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21503) answered that their unanimous agreement is permissible — as the answer details."
  ur: "ایک سائل نے کمپنی بناتے وقت یہ معاہدہ پوچھا کہ انتظام کے عوض وہ اضافی منافع کا حصہ لے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21503)⁩ نے جواب دیا کہ سب کا اتفاق کرنے پر یہ جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
