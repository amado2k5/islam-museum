id: work/fatwa-amja-water-mixed-soap-purity
class: work
kind: fatwa
label: { ar: "الماء المخالط بالصابون", en: "Water altered by admixture — unfit for purification", ur: "صابن ملا پانی — طہارت نہیں", es: "Agua alterada por impurezas: no apta para la purificación." }
summary:
  ar: "سأل سائل عن باب المياه في الفقه وما يخالط الصابون. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81847 بتاريخ 12 يوليو 2010)⁩ ناصحًا أولًا بالتلقي المباشر في طلب العلم ما أمكن فإن من كان شيخه كتابه فاق خطؤه صوابه، وأن الماء الذي تغير بالمخالطة ففقد إطلاقه لا يصلح التطهر به وإن كان طاهرًا في نفسه، ومن ذلك ما سئل عنه من تغير الماء بسبب مخالطته للصابون على ما فصّل الجواب من أنواع المياه."
  en: "A questioner asked about the waters chapter in fiqh and what soap mixes into. Dr. Salah al-Sawi (fatwa no. 81847, 12 July 2010) first counselled direct learning in seeking knowledge where possible — one whose shaykh is his book errs more than he hits — then answered that water altered by admixture until it loses its unqualified name is unfit for purification though pure in itself; such is the soap-admixed water asked after — the answer detailing the kinds of waters."
  ur: "صابن ملا پانی سے طہارت؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81847، 12 جولائی 2010)⁩ کے مطابق مخلوط پانی طاہر مگر غیر مطلق ہے — طہارت کے لیے نہیں۔"
  es: "Un consultante preguntó sobre el capítulo de las aguas en el fiqh y con qué se mezcla el jabón. El Dr. Salah al-Sawi (fatwa n.° 81847, 12 de julio de 2010) aconsejó primero el aprendizaje directo para buscar conocimiento siempre que sea posible —quien tiene a su shaykh como su libro se equivoca más de lo que acierta—, luego respondió que el agua alterada por la mezcla hasta perder su nombre original no es apta para la purificación, aunque sea pura en sí misma; tal es el caso del agua mezclada con jabón a la que se refería la pregunta —la respuesta detallaba los tipos de aguas."
