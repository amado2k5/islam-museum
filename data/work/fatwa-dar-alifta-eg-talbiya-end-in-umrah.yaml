id: work/fatwa-dar-alifta-eg-talbiya-end-in-umrah
class: work
kind: fatwa
label: { ar: "وقت انتهاء التلبية في العمرة", en: "When the talbiya ends in umrah", ur: "عمرہ میں تلبیہ کب ختم ہوتا ہے", es: "Cuando la talbiya termina en la umrah", fr: "Lorsque la talbiya se termine lors de la umrah", tr: "Umre'de Talbiye'nin tamamlanma süresi", id: "Waktu penyelesaian Talbiyah dalam Umrah" }
summary:
  ar: "سائل سأل عن وقت انتهاء التلبية في العمرة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21867)⁩ أن التلبية في العمرة مستحبة مسنونة تبدأ من الإحرام بها وتنتهي بالشروع في الطواف على ما فصّل الجواب."
  en: "A questioner asked when the talbiya ends in umrah. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21867) answered that the talbiya in umrah is a commended sunna, beginning at ihram and ending at the start of tawaf — as the answer details."
  ur: "ایک سائل نے عمرہ میں تلبیہ کے ختم ہونے کا وقت پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21867)⁩ نے جواب دیا کہ عمرہ میں تلبیہ مستحب سنت ہے جو احرام سے شروع اور طواف شروع کرنے پر ختم ہوتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó cuándo termina la talbiya en la umrah. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21867) respondió que la talbiya en la umrah es una sunna recomendada, que comienza en el ihram y termina al inicio del tawaf, como se detalla en la respuesta."
  fr: "Un internaute a demandé à quel moment la talbiya se termine lors de la umra. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21867) a répondu que la talbiya pendant la umra est une sunna recommandée, commençant à l'ihram et se terminant au début du tawaf, comme le précise la réponse."
  tr: "Bir soru soran kişi, Umre'de Talbiye'nin sona erdiği zamanı sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 21867), Umre sırasında Talbiye'nin İhram girişiyle başlayıp Tewef'in başlangıcıyla sona ererek önerildiğini ve tavsiye edildiğini yanıtlamıştır; bu cevapta detaylandırılmıştır."
  id: "Seorang penanya menanyakan tentang waktu ketika Talbiyah berakhir selama Umrah. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21867) menjawab bahwa Talbiyah selama Umrah direkomendasikan dan direkomendasikan serta direkomendasikan dimulai dengan memasuki Ihram dan diakhiri dengan awal Tawah, seperti yang dijelaskan dalam jawaban."
