summary:
  ar: "سائل سأل عن وقت انتهاء التلبية في العمرة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21867)⁩ أن التلبية في العمرة مستحبة مسنونة تبدأ من الإحرام بها وتنتهي بالشروع في الطواف على ما فصّل الجواب."
  en: "A questioner asked when the talbiya ends in umrah. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21867) answered that the talbiya in umrah is a commended sunna, beginning at ihram and ending at the start of tawaf — as the answer details."
  ur: "ایک سائل نے عمرہ میں تلبیہ کے ختم ہونے کا وقت پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21867)⁩ نے جواب دیا کہ عمرہ میں تلبیہ مستحب سنت ہے جو احرام سے شروع اور طواف شروع کرنے پر ختم ہوتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
