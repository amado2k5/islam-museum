id: work/fatwa-amja-citizenship-for-lawful-benefit
class: work
kind: fatwa
label: { ar: "التجنس لمصلحة مشروعة", en: "Naturalisation for a lawful benefit", ur: "جائز مصلحت کے لیے شہریت", es: "Naturalización para obtener un beneficio legal.", fr: "Naturalisation pour un avantage légal", tr: "Meşru menfaat için vatandaşlığa geçiş", id: "Naturalisasi untuk kepentingan yang sah" }
summary:
  ar: "سأل طبيب مصري يعمل بالسعودية ونال زمالة بريطانية عن التجنس. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80328 بتاريخ 24 أكتوبر 2009)⁩ أنه لا حرج في التجنس إذا تعين سبيلًا لترتيب شؤون المقيمين خارج ديار الإسلام وتوطين وجودهم، ولا حرج فيه للقادمين من الخارج إذا تعين سبيلًا لتحقيق مصلحة مشروعة، ما بقي صاحبه حفيظًا على عهده مع الله ورسوله وعلى ولائه لملته وأمته مع رعاية ما يقتضيه الوجود من الالتزام بعقد الأمان مع الدولة المضيفة وما يترتب عليه."
  en: "An Egyptian doctor working in Saudi Arabia who had earned a British fellowship asked about naturalisation. Dr. Salah al-Sawi (fatwa no. 80328, 24 October 2009) answered that naturalisation is unobjectionable when it becomes the means of ordering the affairs of residents outside Muslim lands and settling their presence, and for those coming from abroad when it is the means to a lawful benefit — provided the person keeps his covenant with God and His Messenger and his loyalty to his creed and ummah, while honouring the security covenant with the host state and what flows from it."
  ur: "ایک مصری ڈاکٹر نے شہریت کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80328، 24 اکتوبر 2009)⁩ کے مطابق جائز مصلحت کے لیے شہریت میں حرج نہیں بشرط عہد الٰہی اور امت سے ولایت برقرار رہے اور میزبان ملک سے عقد امان کی رعایت ہو۔"
  es: "Un médico egipcio que trabajaba en Arabia Saudita y que había obtenido una beca británica preguntó sobre la naturalización. El Dr. Salah al-Sawi (fatwa n.° 80328, 24 de octubre de 2009) respondió que la naturalización es aceptable cuando sirve para regular los asuntos de los residentes fuera de tierras musulmanas y para regular su presencia, y para aquellos que vienen del extranjero cuando es un medio para obtener un beneficio lícito, siempre que la persona mantenga su pacto con Dios y Su Mensajero y su lealtad a su credo y ummah, al tiempo que respeta el pacto de seguridad con el Estado anfitrión y lo que de él se deriva."
  fr: "Un médecin égyptien exerçant en Arabie saoudite et titulaire d'une bourse de recherche britannique s'est renseigné sur la naturalisation. Le Dr Salah al-Sawi (fatwa n° 80328, 24 octobre 2009) a répondu que la naturalisation est licite lorsqu'elle permet de régulariser la situation des résidents hors des terres musulmanes et de faciliter leur installation, et pour les personnes venant de l'étranger lorsqu'elle constitue un moyen d'obtenir un avantage licite – à condition que la personne respecte son engagement envers Dieu et Son Messager, sa foi et sa communauté, et qu'elle honore le pacte de sécurité avec l'État d'accueil et ses obligations."
  tr: "Suudi Arabistan'da çalışan ve İngiliz bursu alan Mısırlı bir doktor, vatandaşlık hakkında sorular sordu. Dr. Salah Al-Sawy (Fetva No. 80328, 24 Ekim 2009), İslam toprakları dışındaki sakinlerin işlerini düzenlemeye ve varlıklarını düzenlemeye kararlıysa, vatandaşlığa geçişin zararı olmadığını, yurt dışından gelenlerin de meşru bir çıkar elde etmeye kararlıysa, mülkiyet sahibinin Allah ve Elçisi ile olan ahdine, inancına ve milletine sadakatine sadık kalması, ev sahibi ülkeyle güvenlik sözleşmesine bağlılık ve sonuçları gibi varoluşun gerektirdiği yükümlülükleri dikkate aldığı sürece zarar görmediğini yanıtladı."
  id: "Seorang dokter Mesir yang bekerja di Arab Saudi dan memperoleh beasiswa Inggris menanyakan tentang naturalisasi. Dr. Salah Al-Sawy (Fatwa No. 80328 tanggal 24 Oktober 2009) menjawab bahwa naturalisasi tidak ada salahnya jika ditentukan untuk mengatur urusan penduduk di luar tanah Islam dan menyelesaikan keberadaan mereka, dan tidak ada kerugian bagi mereka yang datang dari luar negeri jika diputuskan untuk mencapai kepentingan yang sah, selama pemegang tetap setia pada perjanjiannya dengan Tuhan dan Rasul-Nya serta kesetiaannya kepada iman dan bangsanya, sambil mempertimbangkan kewajiban yang diperlukan oleh keberadaan, seperti kepatuhan pada kontrak keamanan dengan negara tuan rumah dan konsekuensinya."
