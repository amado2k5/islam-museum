id: work/fatwa-amja-citizenship-for-lawful-benefit
class: work
kind: fatwa
label: { ar: "التجنس لمصلحة مشروعة", en: "Naturalisation for a lawful benefit", ur: "جائز مصلحت کے لیے شہریت" }
summary:
  ar: "سأل طبيب مصري يعمل بالسعودية ونال زمالة بريطانية عن التجنس. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80328 بتاريخ 24 أكتوبر 2009)⁩ أنه لا حرج في التجنس إذا تعين سبيلًا لترتيب شؤون المقيمين خارج ديار الإسلام وتوطين وجودهم، ولا حرج فيه للقادمين من الخارج إذا تعين سبيلًا لتحقيق مصلحة مشروعة، ما بقي صاحبه حفيظًا على عهده مع الله ورسوله وعلى ولائه لملته وأمته مع رعاية ما يقتضيه الوجود من الالتزام بعقد الأمان مع الدولة المضيفة وما يترتب عليه."
  en: "An Egyptian doctor working in Saudi Arabia who had earned a British fellowship asked about naturalisation. Dr. Salah al-Sawi (fatwa no. 80328, 24 October 2009) answered that naturalisation is unobjectionable when it becomes the means of ordering the affairs of residents outside Muslim lands and settling their presence, and for those coming from abroad when it is the means to a lawful benefit — provided the person keeps his covenant with God and His Messenger and his loyalty to his creed and ummah, while honouring the security covenant with the host state and what flows from it."
  ur: "ایک مصری ڈاکٹر نے شہریت کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80328، 24 اکتوبر 2009)⁩ کے مطابق جائز مصلحت کے لیے شہریت میں حرج نہیں بشرط عہد الٰہی اور امت سے ولایت برقرار رہے اور میزبان ملک سے عقد امان کی رعایت ہو۔"
