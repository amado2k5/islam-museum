id: work/fatwa-dar-alifta-eg-zakat-to-dependents
class: work
kind: fatwa
label: { ar: "حكم إخراج المزكي زكاته على من ينفق عليهم", en: "Paying zakat to those one is obliged to support", ur: "ان لوگوں کو زکات دینا جن کی کفالت واجب ہے", es: "Pagar el zakat a aquellos a quienes uno está obligado a mantener", fr: "Verser la zakat à ceux que l'on est tenu de soutenir", tr: "Zekat ödeyenin onlara harcayanlara zekat ödemesine ilişkin karar", id: "Putusan bahwa pembayar zakat membayar zakat kepada mereka yang membelanjakannya" }
summary:
  ar: "سائل سأل عن إعطاء الزكاة لمن ينفق عليهم المزكي كعم الأولاد الصغار الملزم بنفقتهم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21795)⁩ أنه إن كان العم تلزمه النفقة على أولاد أخيه الصغار لعدم وجود من ينفق عليهم فله حكمه الذي بيّنه الجواب."
  en: "A questioner asked about giving zakat to those the payer is obliged to support — such as an uncle bound to maintain his brother's young children for lack of any other provider. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21795) answered by setting out the ruling for such a case."
  ur: "ایک سائل نے ان لوگوں کو زکات دینے کا حکم پوچھا جن کی کفالت دینے والے پر واجب ہے — جیسے چچا جس پر بھتیجوں کی کفالت ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21795)⁩ نے جواب میں اس صورت کا حکم بیان کیا۔"
  es: "Un consultante preguntó sobre la conveniencia de dar zakat a aquellos a quienes el pagador está obligado a mantener, como un tío que debe mantener a los hijos pequeños de su hermano por falta de otro proveedor. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21795) respondió exponiendo la normativa aplicable a este caso."
  fr: "Un internaute a posé une question concernant l'obligation de verser la zakat aux personnes que le payeur est tenu de soutenir, comme par exemple un oncle contraint d'entretenir les jeunes enfants de son frère faute d'autres ressources. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21795) a répondu en énonçant la règle applicable à un tel cas."
  tr: "Bir soru soran, zekatın sağlandığı kişilere, örneğin küçük çocukların amcasına zekat verilmesini sormuştur; bu amca onlara bakmakla yükümlüdür. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21795), amcanın, küçük kardeşinin çocuklarına bakmak zorunda kalması durumunda, cevabda açıklandığı gibi hükmünü verdiğini yanıtlamıştır."
  id: "Seorang penanya menanyakan tentang pemberian zakat kepada mereka yang diberikan zakat, seperti paman dari anak-anak kecil yang wajib menyediakan kebutuhan mereka. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21795) menjawab bahwa jika paman berkewajiban menyediakan anak-anak adik laki-lakinya karena tidak ada orang yang mendukung, maka dia memiliki keputusan seperti yang dijelaskan dalam jawaban."
