id: work/fatwa-amja-cursing-inanimate
class: work
kind: fatwa
label: { ar: "لعن الأشياء غير الحية", en: "Cursing lifeless things", ur: "بے جان چیزوں کو لعنت دینا", es: "Maldiciendo cosas sin vida", fr: "Maudire les choses sans vie", tr: "cansız şeylere lanet etmek", id: "kutuk makhluk tak hidup" }
summary:
  ar: "سأل سائل عن حكم لعن الأشياء غير الحية. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82312 بتاريخ 24 أغسطس 2010)⁩ أن المسلم ليس بالسباب ولا اللعان ولا الفاحش ولا البذيء، فلا ينبغي لعن شيء من الأحياء أو الجمادات إلا ما ورد النص بلعنه كلعن غير المعين ممن يفعلون السوء كقول القائل ألا لعنة الله على الظالمين أو الكاذبين ونحوه."
  en: "A questioner asked the ruling on cursing lifeless things. Dr. Salah al-Sawi (fatwa no. 82312, 24 August 2010) answered that the Muslim is not a reviler, a curser, obscene or foul-mouthed; no living thing or lifeless object should be cursed except where a text has come cursing it — such as the unmarked cursing of wrongdoers generally, as in 'God's curse be upon the unjust' or 'the liars', and the like."
  ur: "ایک سائل نے بے جان چیزوں کو لعنت دینے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82312، 24 اگست 2010)⁩ کے مطابق مسلمان لعن طعن کرنے والا نہیں؛ صرف نص میں آئی ہوئی عمومی لعنت جیسے ظالموں و جھوٹوں پر ہی کہی جا سکتی ہے۔"
  es: "Un consultante preguntó sobre la norma relativa a maldecir cosas inanimadas. El Dr. Salah al-Sawi (fatwa n.º 82312, 24 de agosto de 2010) respondió que el musulmán no es un injuriador, un maldiciente, obsceno ni grosero; ningún ser vivo u objeto inanimado debe ser maldecido excepto cuando un texto lo maldiga, como la maldición implícita contra los malhechores en general, como en «Que la maldición de Dios caiga sobre los injustos» o «los mentirosos», y similares."
  fr: "Un internaute a interrogé le Dr Salah al-Sawi (fatwa n° 82312, 24 août 2010) sur la question de la malédiction des choses inanimées. Il a répondu que le musulman n'est ni injurieux, ni grossier, ni obscène; aucune créature vivante ni aucun objet inanimé ne doit être maudit, sauf si un texte le mentionne explicitement – comme la malédiction générale des malfaiteurs, telle que « Que la malédiction de Dieu soit sur les injustes » ou « sur les menteurs », etc."
  tr: "Bir soru soran kişi, cansız şeylere lanet verilmesine ilişkin hüküm hakkında soru soruldu. Dr. Salah Al-Sawy (24 Ağustos 2010 tarihli Fetva No. 82312) bir Müslümanın lanetlenmediğini, lanetlendiğini, müstehcen veya müstehcen olmadığını yanıtladı; canlılardan veya cansız nesnelerden gelen hiçbir şey, metinde açıkça belirtilenler dışında, örneğin 'Allah'ın laneti zulmeciler, yalancılar ve benzerlerinin üzerine olsun' sözü gibi, lanetlenmelidir."
  id: "Seorang penanya ditanya tentang putusan mengutuk makhluk tak hidup. Dr. Salah Al-Sawy menjawab (Fatwa No. 82312 tanggal 24 Agustus 2010) bahwa seorang Muslim tidak dikutuk, dikutuk, tidak senonoh, atau cabul; tidak ada yang boleh dikutuk dari makhluk hidup atau benda mati kecuali yang secara eksplisit dinyatakan dalam teks, seperti mengutuk yang tidak disebutkan yang berbuat jahat, seperti pepatah: 'Semoga kutukan Allah menimpa para penindas, pembohong, dan sejenisnya.'"
