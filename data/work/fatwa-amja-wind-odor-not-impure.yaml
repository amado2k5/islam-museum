id: work/fatwa-amja-wind-odor-not-impure
class: work
kind: fatwa
label: { ar: "رائحة الريح ليست نجسة", en: "The smell wind leaves — not impure", ur: "ریح کی بو — نجس نہیں", es: "El olor que deja el viento no es impuro.", fr: "Le vent laisse une odeur — non impure", tr: "Rüzgarın kokusu kirli değildir", id: "Bau angin tidak kotor" }
summary:
  ar: "سأل سائل أنه تخرج منه ريح بشكل متكرر ويكتشف رائحة كريهة في سرواله الداخلي. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21410 بتاريخ 23 فبراير 2008)⁩ أن الرائحة التي تنشأ عن الريح ليست نجسة فلا يلزمه تغيير سرواله من أجلها ولكن إن فعل ذلك على سبيل التنظف وحسن الاستعداد للصلاة فهو حسن على ما فصّل الجواب."
  en: "A questioner passes wind repeatedly and finds a bad smell in his underclothes. Dr. Salah al-Sawi (fatwa no. 21410, 23 February 2008) answered that the odor arising from wind is not impure — he need not change his underclothes for it; doing so for cleanliness and good preparation for the prayer is nonetheless good — as the answer details."
  ur: "ریح کی بو سے کپڑا بدلنا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21410، 23 فروری 2008)⁩ کے مطابق بو نجس نہیں — تبدیلی لازم نہیں مگر اچھی۔"
  es: "Un consultante expulsa gases repetidamente y percibe un mal olor en su ropa interior. El Dr. Salah al-Sawi (fatwa n.º 21410, 23 de febrero de 2008) respondió que el olor proveniente de los gases no es impuro; no es necesario cambiarse la ropa interior por ello; sin embargo, hacerlo por higiene y para prepararse adecuadamente para la oración es recomendable, como se detalla en la respuesta."
  fr: "Un homme, ayant émis des gaz à répétition, constate une mauvaise odeur dans ses sous-vêtements. Le Dr Salah al-Sawi (fatwa n° 21410, 23 février 2008) répond que l'odeur due aux gaz n'est pas impure; il n'est donc pas nécessaire de changer de sous-vêtements. Toutefois, le faire par souci de propreté et en bonne préparation à la prière est néanmoins recommandé, comme le précise la réponse."
  tr: "Bir soruya iç çamaşırından sürekli kötü bir koku gelip gelmediği soruldu. Dr. Salah Al-Sawy (23 Şubat 2008 tarihli Fetva No. 21410) rüzgarın neden olduğu kokunun kirli olmadığını, bu yüzden pantolonunu değiştirmesine gerek olmadığını, ancak temizlik ve namaz hazırlığı için değiştirirse bunun iyi olduğunu yanıtladı."
  id: "Seorang penanya ditanya apakah ia berulang kali memiliki bau tidak sedap yang keluar dari pakaian dalamnya. Dr. Salah Al-Sawy menjawab (Fatwa No. 21410 tanggal 23 Februari 2008) bahwa bau yang disebabkan angin tidak kotor, jadi ia tidak perlu mengganti celananya, tetapi jika ia melakukannya untuk membersihkan dan mempersiapkan doa dengan baik, maka itu baik, seperti yang dijelaskan dalam jawaban."
