id: work/fatwa-amja-no-logic-for-falsehood
class: work
kind: fatwa
label: { ar: "ليس للضلال منطق", en: "Falsehood has no logic", ur: "گمراہی کی کوئی منطق نہیں", es: "La falsedad no tiene lógica.", fr: "Le mensonge n'a pas de logique.", tr: "Yanlış yönlendirmenin mantığı yoktur", id: "Kesalahan tidak memiliki logika" }
summary:
  ar: "سأل سائل عن دعوى منتدى تناولت ضلال الجن ومشركيهم بمنطقهم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81567 بتاريخ 27 مايو 2010)⁩ أنه يراه بهذه المقدمات يحاكم ضلال الجن ومشركيهم إلى المنطق، ومتى كان للضال في ضلاله منطق، وهل لمن عبدوا الأبقار أو بوذا منطق بل هل لعبادة الشيطان منطق، وقد ذرأ الله لجهنم كثيرًا من الجن والإنس لهم قلوب لا يعقلون بها وأعين لا يبصرون بها وآذان لا يسمعون بها ولهذا يقولون يوم القيامة لو كنا نسمع أو نعقل ما كنا في أصحاب السعير، فليخل عنه هذا الاسترسال المنطقي في شأنهم فليس للباطل منطق بل هو الهوى والتيه والتخبط."
  en: "A questioner brought a forum piece reasoning about the misguidance of the jinn and their polytheists in terms of their 'logic'. Dr. Salah al-Sawi (fatwa no. 81567, 27 May 2010) answered that he is, by such premises, judging the error of the jinn and polytheists by logic — and when has the straying had logic? Did cow-worshippers or Buddha-worshippers or devil-worshippers have one? God bred many of jinn and men for hell — hearts that do not understand, eyes that do not see, ears that do not hear — so they will say on Judgment Day 'had we listened or reasoned we would not be among the people of the blaze'; let him leave this logical indulgence about them — falsehood has no logic, only whim, bewilderment and confusion. Recorded as AMJA's answer."
  ur: "ایک سائل نے جنوں اور مشرکین کی گمراہی پر منطقی دلیل کے دعوے پوچھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81567، 27 مئی 2010)⁩ کے مطابق ضلالت کی کوئی منطق نہیں — باطل صرف خواہش اور بہکاؤ ہے۔"
  es: "Un participante planteó en el foro un argumento sobre el extravío de los genios y sus politeístas en términos de su supuesta «lógica». El Dr. Salah al-Sawi (fatwa n.º 81567, 27 de mayo de 2010) respondió que, partiendo de tales premisas, juzga el error de los genios y politeístas mediante la lógica. ¿Y cuándo ha tenido lógica el extravío? ¿Acaso la tuvieron los adoradores de vacas, de Buda o del diablo? Dios creó a muchos genios y hombres para el infierno: corazones que no comprenden, ojos que no ven, oídos que no oyen, para que en el Día del Juicio Final digan: «Si hubiéramos escuchado o razonado, no estaríamos entre la gente del fuego». Que deje de lado esta indulgencia lógica sobre ellos: la falsedad no tiene lógica, solo capricho, desconcierto y confusión. Registrado como respuesta de AMJA."
  fr: "Un participant a présenté un argumentaire de forum concernant l'égarement des djinns et des polythéistes, fondé sur leur « logique ». Le Dr Salah al-Sawi (fatwa n° 81567, 27 mai 2010) a répondu que, partant de ce principe, il jugeait l'erreur des djinns et des polythéistes par la logique – or, depuis quand les égarés font-ils preuve de logique ? Les adorateurs de la vache, de Bouddha ou du diable en ont-ils jamais fait preuve ? Dieu a créé nombre de djinns et d'hommes pour l'enfer – des cœurs qui ne comprennent pas, des yeux qui ne voient pas, des oreilles qui n'entendent pas – afin qu'ils disent au Jour du Jugement: « Si nous avions écouté ou raisonné, nous ne serions pas parmi les damnés. » Qu'il cesse de s'abaisser à de telles considérations logiques à leur sujet – le mensonge est dépourvu de logique, il n'est que caprice, égarement et confusion. Réponse consignée par AMJA."
  tr: "Bir soru soran, cinlerin ve onların çok tanrılılarının mantıklarıyla yanlış yönlendirilmesini ele alan bir forum iddiası hakkında soru sordu. Dr. Salah Al-Sawy (Fetva No. 81567, 27 Mayıs 2010) bunu bu öncüllerle gördüğünü, cinlerin ve onların çrikperestlerinin yanlış yönlendirmesini mantığa göre yargıladığını yanıtladı. Yanlış yola sapan ne zaman mantıklı olur? İneklere ya da Buda'ya tapmanın mantığı var mı? Gerçekten de şeytana tapmanın mantığı var mı? Allah, birçok cin ve insanı anlamadıkları kalplerle, görmedikleri gözlerle ve duymadıkları kulaklarla cehenneme attı. Bu yüzden şöyle derler: Diriliş günü, eğer duymuş ya da akıl yürütseydik, Ateş'in yoldaşları arasında olmazdık. Bu mantık akışı onlar hakkında terk edilsin, çünkü yalanın mantığı yoktur; aksine, arzu, karmaşa ve karışıklıktır."
  id: "Seorang penanya bertanya tentang klaim forum yang membahas kekeliruan jin dan para politeis mereka dengan logika mereka. Dr. Salah Al-Sawy (Fatwa No. 81567 tanggal 27 Mei 2010) menjawab bahwa ia melihat hal ini, dengan premis-premis ini, menilai kesalahan jin dan para politeis mereka terhadap logika. Kapan orang yang tersesat memiliki logika dalam kesalahan-nya? Apakah menyembah sapi atau Buddha memiliki logika? Memang, apakah menyembah Setan memiliki logika? Tuhan telah melemparkan banyak jin dan manusia ke Neraka dengan hati yang tidak mereka pahami, mata yang tidak mereka lihat, dan telinga yang tidak mereka dengar. Itulah sebabnya mereka akan berkata: Pada Hari Kebangkitan, jika kita mendengar atau beralasan, kita tidak akan berada di antara sahabat Kobaran. Biarlah aliran logika ini ditinggalkan terkait mereka, karena kebohongan tidak memiliki logika; melainkan keinginan, kebingungan, dan kebingungan."
