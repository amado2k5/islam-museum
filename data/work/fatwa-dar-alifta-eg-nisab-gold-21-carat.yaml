label: { ar: "السبب في تقدير النصاب في زكاة المال على اعتبار عيار ٢١", en: "Why the zakat nisab is reckoned at 21-carat gold", ur: "زکات کے نصاب میں ۲۱ قیراط سونے کی بنا" }
summary:
  ar: "سائل سأل عن سبب تقدير نصاب الزكاة بعيار ٢١ من الذهب دون عيار ١٨ أو ٢٤. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21692)⁩ أن اختيار عيار ٢١ لحساب نصاب الزكاة جاء مراعية لما تعارف عليه الناس على ما فصّل الجواب من علة ذلك."
  en: "A questioner asked why the zakat nisab is reckoned on 21-carat gold rather than 18 or 24. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21692) answered that choosing the 21-carat standard for computing the nisab was made in consideration of what people customarily deal in — the answer explains the reasoning."
  ur: "ایک سائل نے پوچھا کہ زکات کا نصاب ۲۱ قیراط سونے کی بنیاد پر کیوں ناپا جاتا ہے نہ کہ ۱۸ یا ۲۴۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21692)⁩ نے جواب دیا کہ یہ انتخاب لوگوں کے رائج معاملے کی رعایت میں کیا گیا — جواب میں اس کی وجہ بیان ہوئی۔"
