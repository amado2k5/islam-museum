id: work/fatwa-dar-alifta-eg-nisab-gold-21-carat
class: work
kind: fatwa
label: { ar: "السبب في تقدير النصاب في زكاة المال على اعتبار عيار ٢١", en: "Why the zakat nisab is reckoned at 21-carat gold", ur: "زکات کے نصاب میں ۲۱ قیراط سونے کی بنا", es: "Por qué el zakat nisab se calcula en oro de 21 quilates", fr: "Pourquoi le nisab de la zakat est-il calculé en or 21 carats ?", tr: "Zekatta nisabın servete göre tahmin edilmesinin nedeni, 21 ayar olarak değerlendirilmiştir", id: "Alasan memperkirakan nisab dalam zakat berdasarkan kekayaan yang dianggap 21 karat" }
summary:
  ar: "سائل سأل عن سبب تقدير نصاب الزكاة بعيار ٢١ من الذهب دون عيار ١٨ أو ٢٤. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21692)⁩ أن اختيار عيار ٢١ لحساب نصاب الزكاة جاء مراعية لما تعارف عليه الناس على ما فصّل الجواب من علة ذلك."
  en: "A questioner asked why the zakat nisab is reckoned on 21-carat gold rather than 18 or 24. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21692) answered that choosing the 21-carat standard for computing the nisab was made in consideration of what people customarily deal in — the answer explains the reasoning."
  ur: "ایک سائل نے پوچھا کہ زکات کا نصاب ۲۱ قیراط سونے کی بنیاد پر کیوں ناپا جاتا ہے نہ کہ ۱۸ یا ۲۴۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21692)⁩ نے جواب دیا کہ یہ انتخاب لوگوں کے رائج معاملے کی رعایت میں کیا گیا — جواب میں اس کی وجہ بیان ہوئی۔"
  es: "Un consultante preguntó por qué el nisab del zakat se calcula sobre oro de 21 quilates en lugar de 18 o 24. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21692) respondió que la elección del estándar de 21 quilates para calcular el nisab se hizo teniendo en cuenta con qué se suele comerciar habitualmente; la respuesta explica el razonamiento."
  fr: "Un internaute a demandé pourquoi le nisab de la zakat est calculé sur l'or 21 carats plutôt que sur l'or 18 ou 24 carats. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21692) a répondu que le choix de la norme de 21 carats pour calculer le nisab a été fait en tenant compte de ce que les gens traitent habituellement — la réponse explique le raisonnement."
  tr: "Bir soru soran kişi, zekatın nisabının neden 18 veya 24 karat yerine 21 ayar altın olarak tahmin edildiğini sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21692), zekat nisabını hesaplamak için 21 ayar altının seçilmesinin, nedenlerin ayrıntılı açıklaması konusunda insanların üzerinde anlaştıkları düşünceler doğrultusunda yapıldığını belirtmiştir."
  id: "Seorang penanya bertanya mengapa nisab zakat diperkirakan sebesar emas 21 karat dibandingkan 18 karat atau 24 karat. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21692) menjawab bahwa memilih emas 21 karat untuk menghitung zakat nisab dilakukan dengan mempertimbangkan apa yang telah disepakati masyarakat mengenai penjelasan rinci alasannya."
