structure: "Volume 1 (parts 1–7): the Book of Faith — why the book was written, obeying the Messenger, the division of the community, avoiding disputation and the people of kalam, the signs of hypocrisy, sins that remove faith, the definition of faith as assent, affirmation and action, its increase and decrease, the exception (saying 'God willing'), asking 'are you a believer?'. Volume 2 (parts 8–14): the refutation of the Qadariyya (parts 8–11) and of the Jahmiyya (parts 12–14). Further parts survive in Manchester."
