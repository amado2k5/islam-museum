summary:
  ar: "«الإبانة عن شريعة الفرقة الناجية ومجانبة الفرق المذمومة» لابن بطة العكبري الحنبلي ⁦(ت 387هـ)⁩، المعروف بالإبانة الكبرى تمييزاً له عن رسالته «الشرح والإبانة»: موسوعة مسندة في العقيدة على طريقة أهل الحديث، تجمع الأحاديث والآثار بأسانيدها في أبواب الإيمان والقدر والرد على الجهمية وغيرها، في ثلاثة مجلدات أو أربعة بحسب ما ذكره الذهبي."
  en: "Al-Ibana 'an Shari'at al-Firqa al-Najiya wa-Mujanabat al-Firaq al-Madhmuma by the Hanbali Ibn Batta al-Ukbari (d. 387 AH), known as al-Ibana al-Kubra to distinguish it from his shorter al-Sharh wa'l-Ibana: a creed encyclopedia in the hadith scholars' manner, gathering reports with their chains under chapters on faith, predestination, the refutation of the Jahmiyya and more, in three or four volumes according to al-Dhahabi."
