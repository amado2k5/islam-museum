label: { ar: "الإبانة الكبرى", en: "al-Ibana al-Kubra (Ibn Batta)", ur: "الابانۃ الکبریٰ ⁦(ابن بطہ)⁩", es: "al-Ibana al-Kubra (Ibn Batta)", fr: "al-Ibana al-Kubra (Ibn Batta)", tr: "Büyük İlbanah", id: "Ilbanah Agung" }
summary:
  ar: "«الإبانة عن شريعة الفرقة الناجية ومجانبة الفرق المذمومة» لابن بطة العكبري الحنبلي ⁦(ت 387هـ)⁩، المعروف بالإبانة الكبرى تمييزاً له عن رسالته «الشرح والإبانة»: موسوعة مسندة في العقيدة على طريقة أهل الحديث، تجمع الأحاديث والآثار بأسانيدها في أبواب الإيمان والقدر والرد على الجهمية وغيرها، في ثلاثة مجلدات أو أربعة بحسب ما ذكره الذهبي."
  en: "Al-Ibana 'an Shari'at al-Firqa al-Najiya wa-Mujanabat al-Firaq al-Madhmuma by the Hanbali Ibn Batta al-Ukbari (d. 387 AH), known as al-Ibana al-Kubra to distinguish it from his shorter al-Sharh wa'l-Ibana: a creed encyclopedia in the hadith scholars' manner, gathering reports with their chains under chapters on faith, predestination, the refutation of the Jahmiyya and more, in three or four volumes according to al-Dhahabi."
  es: "Al-Ibana 'an Shari'at al-Firqa al-Najiya wa-Mujanabat al-Firaq al-Madhmuma del hanbalí Ibn Batta al-Ukbari (m. 387 AH), conocido como al-Ibana al-Kubra para distinguirlo de su obra más breve al-Sharh wa'l-Ibana: una enciclopedia de credos al estilo de los eruditos del hadiz, que reúne informes con sus cadenas bajo capítulos sobre la fe, la predestinación, la refutación de los Jahmiyya y más, en tres o cuatro volúmenes según al-Dhahabi."
  fr: "Al-Ibana 'an Shari'at al-Firqa al-Najiya wa-Mujanabat al-Firaq al-Madhmuma par le Hanbalite Ibn Batta al-Ukbari (d. 387 AH), connu sous le nom d'al-Ibana al-Kubra pour le distinguer de son plus court al-Sharh wa'l-Ibana: une encyclopédie de croyance à la manière des érudits du hadith, rassemblant des rapports avec leurs chaînes sous des chapitres sur la foi, la prédestination, la réfutation des Jahmiyya et plus encore, en trois ou quatre volumes selon al-Dhahabi."
  ur: "حنبلی ابن بطہ العکبری ⁦(متوفی 387ھ)⁩ کی کتاب الابنا شرعی الفرقاء النجیہ و مجنبۃ الفرقاء المدموما، جسے ابنا الکبریٰ کے نام سے جانا جاتا ہے تاکہ اسے اپنی مختصر الشرح کتابت سے ممتاز کیا جاسکے۔ الذہبی کے مطابق تین یا چار جلدوں میں علماء کا طریقہ، ایمان، تقدیر، جہمیہ کی تردید اور مزید کے ابواب کے تحت اپنی زنجیروں کے ساتھ رپورٹیں جمع کرنا۔"
  tr: "İbn Batta al-Akbari el-Hanbali (ö. 387 Hicri) tarafından yazılmış, Büyük İbanah olarak bilinen \"El-Şeyna' an Şeriat el-Siraq el-Neciyye ve Suçlu Mezheplerden Kaçınma\" adlı eserinden ayırır; bu eser, hadis halkının yöntemine dayanan, hadisleri ve raporları zincirleriyle birlikte iman, kader, camiyiye reddi ve diğer bölümlerde derler, üç ya da dört ciltte derler."
  id: "\"Al-Ibanah 'an Shari'at al-Siraq al-Najiyyah wa Avoidance of the Blameworthy Sects\" oleh Ibn Batta al-Akbari al-Hanbali (wafat 387 H), yang dikenal sebagai Ibanah Agung, membedakannya dari risalahnya \"Al-Sharh wa al-Ibanah\": sebuah ensiklopedia kredo berdasarkan metode umat hadits, mengumpulkan hadis dan laporan dengan rantainya dalam bab-bab iman, takdir, penolakan Jahmiyyah, dan lainnya, dalam tiga atau empat jilid, sesuai dengan yang disebutkan al-Dhahabi."
