label:
  ar: "التعليق المغني على الدارقطني"
  en: "al-Ta'liq al-Mughni 'ala al-Daraqutni"
  ur: "التعلیق المغنی علی الدارقطنی"
summary:
  ar: "تعليقات أبي الطيب محمد شمس الحق العظيم آبادي على سنن الدارقطني، قال إنه علّقها وقت مطالعته الكتاب، مقتصراً على نقد بعض أحاديثه وبيان علله وكشف بعض مطالبه على سبيل الإيجاز، آخذاً من كتب الفن؛ وقدّم لها بمقدمة في ثلاثة فصول: ترجمة الدارقطني، ورواة السنن عنه واختلاف نسخه، وإسناده هو إليه {cite:sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 7}."
  en: "Abu al-Tayyib Muhammad Shams al-Haqq al-'Azimabadi's notes on the Sunan of al-Daraqutni, written, he says, while reading the book, limited to criticising some of its hadiths, explaining their defects and clarifying some points briefly, drawing on the books of the discipline; he prefaced them with an introduction in three chapters: al-Daraqutni's life, the transmitters of the Sunan and its copies, and his own chains to it {cite:sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 7}."
  ur: "ابو الطیب محمد شمس الحق عظیم آبادی کی سنن دارقطنی پر تعلیقات، جو ان کے بقول کتاب کے مطالعے کے دوران لکھیں، بعض احادیث کی تنقید، علل کے بیان اور بعض مطالب کی وضاحت تک محدود، اختصار کے ساتھ، اس فن کی کتابوں سے اخذ کر کے؛ اس کا تین فصلوں پر مقدمہ ہے: دارقطنی کا ترجمہ، سنن کے راوی اور نسخوں کا اختلاف، اور ان کی اپنی سند {cite:sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 7}۔"
