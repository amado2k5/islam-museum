label:
  ar: "التعليق المغني على الدارقطني"
  en: "al-Ta'liq al-Mughni 'ala al-Daraqutni"
  ur: "التعلیق المغنی علی الدارقطنی"
  es: "al-Ta'liq al-Mughni 'ala al-Daraqutni"
  fr: "al-Ta'liq al-Mughni 'ala al-Daraqutni"
  tr: "Şarkıcının Al-Daraqutni Üzerine Yorumu"
  id: "Komentar Penyanyi tentang Al-Daraqutni"
summary:
  ar: "تعليقات أبي الطيب محمد شمس الحق العظيم آبادي على سنن الدارقطني، قال إنه علّقها وقت مطالعته الكتاب، مقتصراً على نقد بعض أحاديثه وبيان علله وكشف بعض مطالبه على سبيل الإيجاز، آخذاً من كتب الفن؛ وقدّم لها بمقدمة في ثلاثة فصول: ترجمة الدارقطني، ورواة السنن عنه واختلاف نسخه، وإسناده هو إليه {cite:sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 7}."
  en: "Abu al-Tayyib Muhammad Shams al-Haqq al-'Azimabadi's notes on the Sunan of al-Daraqutni, written, he says, while reading the book, limited to criticising some of its hadiths, explaining their defects and clarifying some points briefly, drawing on the books of the discipline; he prefaced them with an introduction in three chapters: al-Daraqutni's life, the transmitters of the Sunan and its copies, and his own chains to it {cite:sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 7}."
  ur: "ابو الطیب محمد شمس الحق عظیم آبادی کی سنن دارقطنی پر تعلیقات، جو ان کے بقول کتاب کے مطالعے کے دوران لکھیں، بعض احادیث کی تنقید، علل کے بیان اور بعض مطالب کی وضاحت تک محدود، اختصار کے ساتھ، اس فن کی کتابوں سے اخذ کر کے؛ اس کا تین فصلوں پر مقدمہ ہے: دارقطنی کا ترجمہ، سنن کے راوی اور نسخوں کا اختلاف، اور ان کی اپنی سند {cite:sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 7}۔"
  es: "Las notas de Abu al-Tayyib Muhammad Shams al-Haqq al-'Azimabadi sobre el Sunan de al-Daraqutni, escritas, según él, mientras leía el libro, se limitan a criticar algunos de sus hadices, explicar sus defectos y aclarar brevemente algunos puntos, recurriendo a los libros de la disciplina; las precedió con una introducción en tres capítulos: la vida de al-Daraqutni, los transmisores del Sunan y sus copias, y sus propias cadenas de transmisión {cite:sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 7}."
  fr: "Les notes d'Abu al-Tayyib Muhammad Shams al-Haqq al-'Azimabadi sur le Sunan d'al-Daraqutni, écrites, dit-il, pendant sa lecture du livre, se limitent à critiquer certains de ses hadiths, à expliquer leurs défauts et à clarifier brièvement certains points, en s'appuyant sur les ouvrages de la discipline; il les a précédées d'une introduction en trois chapitres: la vie d'al-Daraqutni, les transmetteurs du Sunan et ses copies, et ses propres chaînes de transmission {cite:sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 7}."
  tr: "Ebu el-Tayyib Muhammed Şems el-Hak el-Azimabadi'nin Sünen el-Daraqutni üzerine yaptığı yorumları, kitabı okurken yorum yaptığını, bazı hadislerini eleştirmekle, kusurlarını açıklamakla ve sanat kitaplarından alınan bazı taleplerini kısaca ortaya koymakla yetindiğini söyledi; üç bölümlük bir girişle başladı: el-Daraqutni'nin biyografisi, ondan sunan rivayetçileri, versiyonlarındaki farklılıklar ve ona anlattığı anlatım zinciri {cite:sunan-daraqutni-ibn-hazm-2011 s. 5} {cite:sunan-daraqutni-ibn-hazm-2011 s. 7}."
  id: "Komentar Abu al-Tayyib Muhammad Shams al-Haq al-Azimabadi tentang Sunan al-Daraqutni, yang katanya ia komentari saat membaca buku itu, membatasi dirinya hanya mengkritik beberapa haditsnya, memperjelas kekurangannya, dan mengungkapkan beberapa tuntutannya secara singkat, diambil dari buku-buku seni; ia memperkenalkannya dengan pengantar dalam tiga bab: biografi al-Daraqutni, narator Sunan darinya, perbedaan dalam versinya, dan rantai naratifnya kepadanya {cite:sunan-daraqutni-ibn-hazm-2011 hlm. 5} {cite:sunan-daraqutni-ibn-hazm-2011 hlm. 7}."
