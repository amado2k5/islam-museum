structure: "مقدمة المؤلف (ص3–4)؛ النسب الشريف والمولد والنشأة؛ ثم الوقائع إلى الهجرة؛ ثم السنون بعد الهجرة سنة سنة إلى السنة الحادية عشرة وفيها مرض النبي وصلاة أبي بكر بالناس ووفاة النبي؛ ثم الشمائل ثم المعجزات؛ ثم الفهرس (طبعة 1926)."
