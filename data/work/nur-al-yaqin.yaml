label: { ar: "نور اليقين في سيرة سيد المرسلين", en: "Nur al-Yaqin fi Sirat Sayyid al-Mursalin", ur: "نور الیقین فی سیرۃ سید المرسلین" }
summary:
  ar: "سيرة نبوية مختصرة للشيخ محمد الخضري، كتبها بالمنصورة استجابة لرغبة القاضي محمود بك سالم في «سيرة خالية من الحشو والتعقيد تنتفع بها عامة المسلمين»، واعتمد فيها القرآن وصحيحي البخاري ومسلم مستعيناً بالشفا والسيرة الحلبية والمواهب اللدنية والإحياء، ورتب الوقائع بعد الهجرة على السنين، وختمها بالشمائل والمعجزات."
  en: "A concise biography of the Prophet by Shaykh Muhammad al-Khudari, written in al-Mansura at the wish of the judge Mahmud Bek Salim for 'a sira free of padding and complication from which ordinary Muslims can benefit'. It relies on the Qur'an and the Sahihs of al-Bukhari and Muslim, with help from al-Shifa, al-Sira al-Halabiyya, al-Mawahib al-Laduniyya and the Ihya', arranges events after the Hijra year by year, and ends with the Prophet's qualities and miracles."
