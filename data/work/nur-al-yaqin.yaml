label: { ar: "نور اليقين في سيرة سيد المرسلين", en: "Nur al-Yaqin fi Sirat Sayyid al-Mursalin", ur: "نور الیقین فی سیرۃ سید المرسلین" }
summary:
  ar: "سيرة نبوية مختصرة للشيخ محمد الخضري، كتبها بالمنصورة استجابة لرغبة القاضي محمود بك سالم في «سيرة خالية من الحشو والتعقيد تنتفع بها عامة المسلمين»، واعتمد فيها القرآن وصحيحي البخاري ومسلم مستعيناً بالشفا والسيرة الحلبية والمواهب اللدنية والإحياء، ورتب الوقائع بعد الهجرة على السنين، وختمها بالشمائل والمعجزات."
  en: "A concise biography of the Prophet by Shaykh Muhammad al-Khudari, written in al-Mansura at the wish of the judge Mahmud Bek Salim for 'a sira free of padding and complication from which ordinary Muslims can benefit'. It relies on the Qur'an and the Sahihs of al-Bukhari and Muslim, with help from al-Shifa, al-Sira al-Halabiyya, al-Mawahib al-Laduniyya and the Ihya', arranges events after the Hijra year by year, and ends with the Prophet's qualities and miracles."
  es: "Una biografía concisa del Profeta escrita por el jeque Muhammad al-Khudari en al-Mansura, a petición del juez Mahmud Bek Salim, que buscaba una biografía del Profeta libre de adornos y complicaciones, de la que pudieran beneficiarse los musulmanes comunes. Se basa en el Corán y en los Sahihs de al-Bujari y Muslim, con la ayuda de al-Shifa, al-Sira al-Halabiyya, al-Mawahib al-Laduniyya y el Ihya', y organiza los acontecimientos posteriores a la Hégira año por año, concluyendo con las cualidades y los milagros del Profeta."
  fr: "Une biographie concise du Prophète par le cheikh Muhammad al-Khudari, écrite à al-Mansura à la demande du juge Mahmud Bek Salim, qui souhaitait une biographie claire et concise, accessible à tous les musulmans. Elle s'appuie sur le Coran et les recueils authentiques d'al-Bukhari et de Muslim, avec le concours d'al-Shifa, d'al-Sira al-Halabiyya, d'al-Mawahib al-Laduniyya et de l'Ihya', et retrace les événements postérieurs à l'Hégire année par année. L'ouvrage se conclut par une présentation des qualités et des miracles du Prophète."
  ur: "شیخ محمد الخدری کی طرف سے نبی کی ایک جامع سوانح عمری، المنصورہ میں جج محمود بیک سلیم کی خواہش پر 'ایک ایسی سیرت جس سے عام مسلمان مستفید ہو سکیں' کے لیے لکھی گئی۔ یہ قرآن اور بخاری و مسلم کی صحیحوں پر انحصار کرتا ہے، الشفاء، السیرۃ الحلبیہ، المواہب الدونیہ اور احیاء کی مدد سے، سال بہ سال ہجرت کے بعد کے واقعات ترتیب دیتا ہے، اور پیغمبر کی صفات اور معجزات پر ختم ہوتا ہے۔"
