summary:
  ar: "إحدى المعلقات السبع، من الطويل على روي اللام، مطلعها «قفا نبك من ذكرى حبيب ومنزل بسقط اللوى بين الدخول فحومل»، كما في شرح الزوزني {{cite:sharh-muallaqat-sab-zawzani-1921 p.3}}."
  en: "One of the seven Mu'allaqat, in the tawil metre on the rhyme lam, opening \"Halt, you two, let us weep for the memory of a beloved and a camp at the sand-dune's edge between al-Dakhul and Hawmal\", as in al-Zawzani's commentary {{cite:sharh-muallaqat-sab-zawzani-1921 p.3}}."
