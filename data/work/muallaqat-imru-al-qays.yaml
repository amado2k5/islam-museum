label: { ar: "معلقة امرئ القيس «قفا نبك من ذكرى حبيب ومنزل»", en: "The Mu'allaqa of Imru' al-Qays, 'Halt, you two, let us weep'", es: "El Mu'allaqa de Imru' al-Qays, '¡Alto, vosotros dos, lloremos!'", fr: "La Mu'allaqa d'Imru' al-Qays, 'Halte, vous deux, laissez-nous pleurer'" }
summary:
  ar: "إحدى المعلقات السبع، من الطويل على روي اللام، مطلعها «قفا نبك من ذكرى حبيب ومنزل بسقط اللوى بين الدخول فحومل»، كما في شرح الزوزني {{cite:sharh-muallaqat-sab-zawzani-1921 p.3}}."
  en: "One of the seven Mu'allaqat, in the tawil metre on the rhyme lam, opening \"Halt, you two, let us weep for the memory of a beloved and a camp at the sand-dune's edge between al-Dakhul and Hawmal\", as in al-Zawzani's commentary {{cite:sharh-muallaqat-sab-zawzani-1921 p.3}}."
  es: "Uno de los siete Mu'allaqat, en metro tawil sobre la rima lam, comienza con \"Alto, vosotros dos, lloremos por el recuerdo de un ser querido y un campamento al borde de la duna de arena entre al-Dakhul y Hawmal\", como en el comentario de al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 p.3}}."
  fr: "L'un des sept Mu'allaqat, dans le mètre tawil sur la rime lam, commençant par « Halte, vous deux, pleurons la mémoire d'un être cher et d'un camp au bord de la dune de sable entre al-Dakhul et Hawmal », comme dans le commentaire d'al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 p.3}}."
