label: { ar: "المفهم لما أشكل من تلخيص كتاب مسلم", en: "al-Mufhim li-ma Ashkala min Talkhis Kitab Muslim", ur: "المفہم لما اشکلا من تلخیص کتاب مسلم", tr: "Bir Müslüman kitabının özetlenmesinden daha zor olanı anlamak", id: "Pemahaman tentang apa yang lebih sulit daripada merangkum sebuah buku Muslim" }
summary:
  ar: "شرح لتلخيص كتاب مسلم لأبي العباس أحمد بن عمر القرطبي ⁦(578–656هـ)⁩، يشرح ما أشكل من أحاديث مسلم ويبين معانيها وفقهها؛ والجزء السابع من طبعة دمشق وبيروت يضم كتاب الأذكار والدعوات وكتاب الرقاق والزهد والتفسير."
  en: "A commentary on al-Qurtubi's abridgement of Muslim, explaining the hadiths of Muslim that present difficulties, with their meanings and jurisprudence. Volume 7 of the Damascus and Beirut edition covers the Book of Remembrance and Supplications, the Book of Softening of Hearts, the Book of Asceticism and the Book of Tafsir."
  es: "Comentario sobre la recopilación de Muslim realizada por al-Qurtubi, que explica los hadices de Muslim que presentan dificultades, con sus significados y jurisprudencia. El volumen 7 de la edición de Damasco y Beirut abarca el Libro del Recuerdo y las Súplicas, el Libro del Ablandamiento de los Corazones, el Libro del Ascetismo y el Libro del Tafsir."
  fr: "Ce commentaire du résumé de Muslim par al-Qurtubi explique les hadiths de Muslim qui posent problème, en précisant leur signification et leur application juridique. Le volume 7 de l'édition de Damas et Beyrouth comprend le Livre du Souvenir et des Invocations, le Livre de l'Adoucissement des Cœurs, le Livre de l'Ascétisme et le Livre du Tafsir."
  ur: "القرطبی کی مسلم کی اختصار کی تفسیر، مسلم کی احادیث کی وضاحت کرتی ہے جو مشکلات پیش کرتی ہیں، ان کے معانی اور فقہ کے ساتھ۔ دمشق اور بیروت ایڈیشن کی جلد 7 کتاب ذکر اور دعاؤں کی کتاب، دلوں کو نرم کرنے والی کتاب، تصوف کی کتاب اور کتاب تفسیر پر محیط ہے۔"
  tr: "Ebu el-Abbas Ahmed bin Ömer el-Kurtubi'nin (578–656 H) Müslüman kitabının özetine yapılan bir tefsir, Müslümanların en zor hadislerini açıklar ve anlamlarını ve fıkıhlarını açıklar; Şam ve Beyrut baskılarının yedinci cildi, anma, dualar, rukaq kitabı, münzevim ve tefsir kitabını içerir."
  id: "Sebuah komentar atas ringkasan kitab Muslim oleh Abu al-Abbas Ahmad ibn Umar al-Qurtubi (578–656 H), yang menjelaskan hadits Muslim yang paling sulit dan memperjelas makna serta yurisprudensinya; jilid ketujuh edisi Damaskus dan Beirut mencakup kitab peringatan, permohonan, kitab ruqaq, asketisme, dan tafsir."
