summary:
  ar: "شرح لتلخيص كتاب مسلم لأبي العباس أحمد بن عمر القرطبي (578–656هـ)، يشرح ما أشكل من أحاديث مسلم ويبين معانيها وفقهها؛ والجزء السابع من طبعة دمشق وبيروت يضم كتاب الأذكار والدعوات وكتاب الرقاق والزهد والتفسير."
  en: "A commentary on al-Qurtubi's abridgement of Muslim, explaining the hadiths of Muslim that present difficulties, with their meanings and jurisprudence. Volume 7 of the Damascus and Beirut edition covers the Book of Remembrance and Supplications, the Book of Softening of Hearts, the Book of Asceticism and the Book of Tafsir."
