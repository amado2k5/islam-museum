label: { ar: "تيسير الكريم المنان في سيرة عثمان بن عفان", en: "Taysir al-Karim al-Mannan fi Sirat Uthman ibn Affan", ur: "تیسیر الکریم المنان فی سیرۃ عثمان بن عفان" }
summary:
  ar: "دراسة معاصرة لعلي محمد الصلابي في شخصية عثمان بن عفان وعصره، الجزء الثالث من سلسلته «تاريخ الخلفاء الراشدين»؛ فرغ منها فجر الأربعاء 8 ربيع الثاني 1423هـ/18 يونيو 2002م، وتقع في سبعة فصول: حياته بين مكة والمدينة، واستخلافه ومنهجه في الحكم وصفاته، والمؤسستان المالية والقضائية، والفتوح وجمع الأمة على مصحف واحد، ومؤسسة الولاة، وأسباب الفتنة، ثم مقتله ومواقف الصحابة منه."
  en: "A contemporary study by Ali Muhammad al-Sallabi of the person and times of Uthman ibn Affan, volume three of his History of the Rightly Guided Caliphs; finished at dawn on Wednesday 8 Rabi' II 1423 / 18 June 2002, in seven chapters: his life between Mecca and Medina; his accession, method of government and qualities; the financial and judicial institutions; the conquests and the uniting of the community on one codex; the governors; the causes of the strife; and his killing and the Companions' positions on it."
