structure: "المقدمة (ص9–16 من نسخة PDF)؛ الفصل الأول: ذو النورين بين مكة والمدينة، خمسة مباحث (ص17–58)؛ الفصل الثاني: استخلافه ومنهجه في الحكم وأهم صفاته (ص59–112)؛ الفصل الثالث: المؤسسة المالية والقضائية (ص113–166)؛ الفصل الرابع: الفتوحات في المشرق والشام ومصر، وجمع الأمة على مصحف واحد (ص167–240)؛ الفصل الخامس: مؤسسة الولاة، وفيه حقيقة ولاة عثمان وحقيقة العلاقة بين أبي ذر وعثمان (ص241–304)؛ الفصل السادس: أسباب فتنة مقتل عثمان (ص305–344)؛ الفصل السابع: مقتل عثمان ومواقف الصحابة منه (ص345–)؛ فهرس الكتاب (ص465–488)."
