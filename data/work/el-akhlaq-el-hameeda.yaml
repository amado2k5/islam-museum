label:
  ar: "الأخلاق الحميدة"
  en: "Noble ethics (al-akhlaq al-hamidah)"
  ur: "نیک اخلاق ⁦(الأخلاق الحميدۃ)⁩"
  es: "Ética noble (al-akhlaq al-hamidah)"
  fr: "Noble éthique (al-akhlaq al-hamidah)"
  tr: "İyi ahlak"
  id: "Moral yang baik"
summary:
  ar: "سلسلة من أربع حلقات لـوجدي غنيم يحفظها أرشيف أسابيل باسم «الأخلاق الحميدة»؛ دروسها في الأمانة وأنواعها، ثم في الإخلاص معناه وأدلته من القرآن والحديث وأثره في قبول العمل، ثم في الصدق أقسامه وشروطه، ثم في الوفاء بالعهد والميثاق في العبادات والعلاقات."
  en: "A four-episode series by Wagdy Ghoneim kept in the Assabile archive as 'Al-Akhlaq al-Hamidah' (noble ethics); its lessons treat trustworthiness (amana) and its kinds, then sincerity (ikhlas), its meaning, its proofs from the Qur'an and the Sunna and its bearing on acceptance of deeds, then truthfulness (sidq) in its kinds, then fidelity (wafa') to covenants and compacts in worship and in relations."
  ur: "وجدی غنیم کی چار اقساط کا سلسلہ جو اسابیل آرکائیو میں «الأخلاق الحميدۃ» کے نام سے محفوظ ہے؛ اس کے اسباق امانت اور اس کی اقسام، پھر اخلاص، اس کے معنی، قرآن و حدیث سے دلائل اور قبولیتِ عمل پر اثر، پھر صدق کی اقسام اور شرائط، اور پھر عبادات و معاملات میں عہد و میثاق کی وفا بیان کرتی ہیں۔"
  es: "Una serie de cuatro episodios de Wagdy Ghoneim, conservada en el archivo de Assabile como 'Al-Akhlaq al-Hamidah' (ética noble); sus lecciones tratan sobre la confiabilidad (amana) y sus clases, luego la sinceridad (ikhlas), su significado, sus pruebas del Corán y la Sunna y su relación con la aceptación de los actos, luego la veracidad (sidq) en sus clases, y finalmente la fidelidad (wafa') a los pactos y acuerdos en el culto y en las relaciones."
  fr: "Une série en quatre épisodes de Wagdy Ghoneim conservée dans les archives d'Assabile sous le nom d'« Al-Akhlaq al-Hamidah » (éthique noble); ses leçons traitent de la fiabilité (amana) et de ses différentes formes, puis de la sincérité (ikhlas), de sa signification, de ses preuves tirées du Coran et de la Sunna et de son incidence sur l'acceptation des actes, puis de la véracité (sidq) et de ses différentes formes, puis de la fidélité (wafa') aux alliances et aux pactes dans le culte et dans les relations."
  tr: "Wajdi Ghoneim'in dört bölümlük bir serisi, Asabel arşivi tarafından 'İyi Ahlak' adıyla korunmaktadır; güvenilirlik ve türleri üzerine dersleri, sonra samimiyet, anlamı ve Kur'an ile Hadislerden aldığı kanıtlar, eylemlerin kabulüne etkisi, sonra dürüstlük, yeminler ve koşullar, ardından ibadet ve ilişkilerde vaat ve antlaşmaların yerine getirilmesi üzerine dersler."
  id: "Serangkaian empat episode oleh Wajdi Ghoneim, disimpan oleh arsip Asabel dengan nama 'Good Morals'; pelajaran tentang kepercayaan dan jenisnya, lalu tentang ketulusan, makna dan bukti dari Al-Qur'an dan Hadis serta dampaknya terhadap penerimaan perbuatan, kemudian tentang kejujuran, sumpah dan syaratnya, kemudian tentang pemenuhan janji dan perjanjian dalam ibadah dan hubungan."
