id: work/fatwa-aliftaa-jo-paying-oath-expiation-in-cash
class: work
kind: fatwa
label: { ar: "مقدار كفارة اليمين من النقود", en: "The cash amount of expiation for a broken oath", ur: "قسم کے کفارے کی نقد مقدار", es: "La cantidad de dinero de expiación por un juramento roto", fr: "Le montant en espèces de l'expiation pour un serment rompu" }
summary:
  ar: "سؤال عن مقدار كفارة اليمين من النقود، أجابت فيه دائرة الإفتاء العام الأردنية بأنها إطعام عشرة مساكين بستمئة غرام من الأرز لكل مسكين، ويجوز إخراج قيمتها نقدًا وتقدر بدينار. أجابت الدائرة بأن كفارة اليمين إطعام عشرة مساكين، وتقدر بستمئة غرام من الأرز لكل مسكين. وقالت إنه يجوز إخراج قيمتها نقدًا، وتقدر بدينار."
  en: "A question about the cash amount of expiation for a broken oath, in which Jordan's General Iftaa Department answered that it is feeding ten poor people with 600 grams of rice each, and that its value may be paid in cash, set at one dinar. The Department answered that the expiation for an oath is feeding ten poor people, set at 600 grams of rice for each. It said its value may be paid in cash, set at one dinar."
  ur: "قسم کے کفارے کی نقد مقدار کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ دس مسکینوں کو فی کس چھ سو گرام چاول کھلانا ہے، اور اس کی قیمت نقد دی جا سکتی ہے جو ایک دینار مقرر کی گئی۔ ڈیپارٹمنٹ نے جواب دیا کہ قسم کا کفارہ دس مسکینوں کو کھانا کھلانا ہے، جو ہر مسکین کے لیے چھ سو گرام چاول مقرر ہے۔ اس نے کہا کہ اس کی قیمت نقد دی جا سکتی ہے، جو ایک دینار مقرر کی گئی ہے۔"
  es: "Una pregunta sobre la cantidad de dinero para la expiación por un juramento roto, a la que el Departamento General de Iftaa de Jordania respondió que está alimentando a diez personas pobres con 600 gramos de arroz cada una, y que su valor puede pagarse en efectivo, fijado en un dinar. El Departamento respondió que la expiación por un juramento es alimentar a diez personas pobres, fijado en 600 gramos de arroz para cada una. Dijo que su valor puede pagarse en efectivo, fijado en un dinar."
  fr: "À une question concernant le montant de l'expiation pour un serment rompu, le Département général de la Iftaa de Jordanie a répondu qu'il nourrissait dix personnes pauvres avec 600 grammes de riz chacune, et que cette somme pouvait être payée en espèces, à hauteur d'un dinar. Le Département a précisé que l'expiation pour un serment rompu consistait à nourrir dix personnes pauvres, soit 600 grammes de riz par personne. Il a ajouté que cette somme pouvait être payée en espèces, à hauteur d'un dinar."
