label: { ar: "قرار مجمع الفقه الإسلامي الدولي 3 بشأن تقرير شعبة الإفتاء ونشر علم الفقه", en: "IIFA resolution 3 on the fatwa division's report and spreading fiqh knowledge", ur: "اکیڈمی کی قرارداد 3: شعبہ افتا کی رپورٹ اور فقہی علم کی اشاعت", es: "Resolución 3 de la IIFA sobre el informe de la división de fatuas y la difusión del conocimiento del fiqh." }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي ⁦(الدورة الأولى، مكة المكرمة، 26–29 صفر 1405هـ، 19–22 نوفمبر 1984م)⁩. استعرض تقرير شعبة الإفتاء وقرر أن المقصود بالفتوى في عمله ما يصدر من آراء فيما يشغل بال الأمة من مشاكل العصر تعرض على المجمع ليبت فيها، وتحقيق تيسير معرفة الفقه عبر المصطلحات الفقهية والموسوعات الفقهية — مراجعتها وتصحيحها وإتمامها وتدليلها — ونشر كتب الفقه الإسلامي بتحرير قوائم مخطوطات مكتبات العالم واقتناء صورها وإعادة طبع المعتمد منها."
  en: "A resolution of the International Islamic Fiqh Academy (first session, Mecca, 26–29 Safar 1405, 19–22 November 1984). Reviewing the fatwa division's report, it defined fatwa in its work as the opinions issued on contemporary problems occupying the Muslim community, laid before the Academy for decision, and resolved to ease the knowledge of fiqh through fiqh terminology and encyclopedias — reviewing, correcting, completing and evidencing them — and through publishing fiqh books by cataloguing the world's manuscripts and reprinting the reliable ones."
  ur: "اکیڈمی کی قرارداد ⁦(پہلی مجلس، مکہ، 26–29 صفر 1405ھ، 19–22 نومبر 1984ء)⁩۔ اس نے فتویٰ کی تعریف امت کے عصری مسائل پر جاری آراء قرار دی اور فقہ کے علم کو آسان بنانے کے لیے اصطلاحات، موسوعات اور فقہی کتب کی طباعت و اشاعت کا فیصلہ کیا۔"
  es: "Resolución de la Academia Internacional de Fiqh Islámico (primera sesión, La Meca, 26-29 Safar 1405, 19-22 de noviembre de 1984). Tras revisar el informe de la división de fatwas, definió la fatwa, en su labor, como las opiniones emitidas sobre problemas contemporáneos que afectan a la comunidad musulmana, presentadas ante la Academia para su decisión, y resolvió facilitar el conocimiento del fiqh mediante la terminología y las enciclopedias del fiqh —revisándolas, corrigiéndolas, completándolas y documentándolas— y mediante la publicación de libros de fiqh catalogando los manuscritos del mundo y reimprimiendo los fiables."
