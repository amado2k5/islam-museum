label: { ar: "قرار مجمع الفقه الإسلامي الدولي 3 بشأن تقرير شعبة الإفتاء ونشر علم الفقه", en: "IIFA resolution 3 on the fatwa division's report and spreading fiqh knowledge", ur: "اکیڈمی کی قرارداد 3: شعبہ افتا کی رپورٹ اور فقہی علم کی اشاعت", es: "Resolución 3 de la IIFA sobre el informe de la división de fatuas y la difusión del conocimiento del fiqh.", fr: "Résolution 3 de l'IIFA sur le rapport de la division des fatwas et la diffusion du savoir juridique (fiqh)", tr: "Fetva Bölümü raporu ve fıkıh biliminin yayımlanmasına ilişkin Uluslararası İslami Fiqh Akademisi 3 Kararı", id: "Keputusan Akademi Fiqh Islam Internasional 3 mengenai laporan Divisi Fatwa dan publikasi ilmu ilmu hukum" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي ⁦(الدورة الأولى، مكة المكرمة، 26–29 صفر 1405هـ، 19–22 نوفمبر 1984م)⁩. استعرض تقرير شعبة الإفتاء وقرر أن المقصود بالفتوى في عمله ما يصدر من آراء فيما يشغل بال الأمة من مشاكل العصر تعرض على المجمع ليبت فيها، وتحقيق تيسير معرفة الفقه عبر المصطلحات الفقهية والموسوعات الفقهية — مراجعتها وتصحيحها وإتمامها وتدليلها — ونشر كتب الفقه الإسلامي بتحرير قوائم مخطوطات مكتبات العالم واقتناء صورها وإعادة طبع المعتمد منها."
  en: "A resolution of the International Islamic Fiqh Academy (first session, Mecca, 26–29 Safar 1405, 19–22 November 1984). Reviewing the fatwa division's report, it defined fatwa in its work as the opinions issued on contemporary problems occupying the Muslim community, laid before the Academy for decision, and resolved to ease the knowledge of fiqh through fiqh terminology and encyclopedias — reviewing, correcting, completing and evidencing them — and through publishing fiqh books by cataloguing the world's manuscripts and reprinting the reliable ones."
  ur: "اکیڈمی کی قرارداد ⁦(پہلی مجلس، مکہ، 26–29 صفر 1405ھ، 19–22 نومبر 1984ء)⁩۔ اس نے فتویٰ کی تعریف امت کے عصری مسائل پر جاری آراء قرار دی اور فقہ کے علم کو آسان بنانے کے لیے اصطلاحات، موسوعات اور فقہی کتب کی طباعت و اشاعت کا فیصلہ کیا۔"
  es: "Resolución de la Academia Internacional de Fiqh Islámico (primera sesión, La Meca, 26-29 Safar 1405, 19-22 de noviembre de 1984). Tras revisar el informe de la división de fatwas, definió la fatwa, en su labor, como las opiniones emitidas sobre problemas contemporáneos que afectan a la comunidad musulmana, presentadas ante la Academia para su decisión, y resolvió facilitar el conocimiento del fiqh mediante la terminología y las enciclopedias del fiqh —revisándolas, corrigiéndolas, completándolas y documentándolas— y mediante la publicación de libros de fiqh catalogando los manuscritos del mundo y reimprimiendo los fiables."
  fr: "Résolution de l'Académie internationale de jurisprudence islamique (première session, La Mecque, 26-29 Safar 1405, 19-22 novembre 1984). Après avoir examiné le rapport de la division des fatwas, l'Académie a défini la fatwa comme l'ensemble des avis juridiques émis sur les problèmes contemporains qui préoccupent la communauté musulmane, soumis à sa décision. Elle a également décidé de faciliter l'accès à la connaissance du fiqh par le biais de la terminologie et des encyclopédies de fiqh – en les révisant, les corrigeant, les complétant et les documentant – et par la publication d'ouvrages de fiqh, grâce au catalogage des manuscrits du monde entier et à la réimpression des plus fiables."
  tr: "Uluslararası İslami Fıkıh Akademisi Kararı (Birinci Oturum, Mekke, 26–29 Sefer 1405 H, 19–22 Kasım 1984). Fetva Bölümü raporu, fetvanın çalışmalarındaki amaçlanışın ummeti ilgilendiren güncel konularda görüş bildirmek ve karar alma için Akademi'ye sunulmak, fıkıh terminolojisi ve ansiklopediler yoluyla hukukun bilgisini kolaylaştırmak — bunları gözden geçirmek, düzeltmek, tamamlamak ve belirtmek — ile dünya çapındaki kütüphanelerdeki el yazmalarının listelerini düzenleyerek, kopyalarını temin ederek ve güvenilenleri yeniden basarak İslami fıkıh kitapları yayımlamak olduğunu gözden geçirmiş ve belirlemiştir."
  id: "Keputusan Akademi Fiqh Islam Internasional (Sesi Pertama, Mekah, 26–29 Safar 1405 H, 19–22 November 1984). Laporan Divisi Fatwa meninjau dan menentukan bahwa tujuan utama fatwa dalam pekerjaannya adalah untuk menyampaikan pendapat mengenai isu-isu kontemporer yang berkaitan dengan Ummah, yang disampaikan kepada Akademi untuk pengambilan keputusan, serta memfasilitasi pengetahuan tentang yurisprudensi melalui terminologi dan ensiklopedia yurisprudensi — meninjau, mengoreksi, melengkapi, dan menunjukkannya — serta menerbitkan buku fiqih Islam dengan mengedit daftar manuskrip di perpustakaan seluruh dunia, memperoleh salinannya, dan mencetak ulang manuskrip yang menjadi dasar keputusan."
