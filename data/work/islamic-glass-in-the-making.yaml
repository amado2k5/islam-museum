summary:
  ar: "كتاب نادين شيبيل (2022) في تطور وصفات الزجاج في العالم الإسلامي المبكر، يحدد بالتحليل الكيميائي فوارق تركيب الزجاج المصري والشامي والعراقي وزجاج آسيا الوسطى والأندلس وصقلية، ويربط تحولات الصناعة بقيام العواصم والقصور الخلافية {cite:schibille-islamic-glass-2022 p. 20} {cite:schibille-islamic-glass-2022 p. 24}."
  en: "Nadine Schibille's book (2022) on the evolution of glass recipes in the early Islamic world, using chemical analysis to separate Egyptian, Levantine, Mesopotamian, Central Asian, Iberian and Sicilian glass, and linking the industry's transformations to the founding of capitals and caliphal residences {cite:schibille-islamic-glass-2022 p. 20} {cite:schibille-islamic-glass-2022 p. 24}."
  ur: "نادین شیبل کی کتاب (2022) ابتدائی اسلامی دنیا میں شیشے کے نسخوں کے ارتقا پر؛ کیمیائی تجزیے سے مصری، شامی، عراقی، وسط ایشیائی، اندلسی اور صقلی شیشے کا فرق، اور صنعت کی تبدیلیوں کا دارالحکومتوں اور خلافتی محلات کے قیام سے ربط {cite:schibille-islamic-glass-2022 p. 24}."
