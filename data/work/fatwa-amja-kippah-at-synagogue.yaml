id: work/fatwa-amja-kippah-at-synagogue
class: work
kind: fatwa
label: { ar: "وضع القلنسوة اليهودية في المعبد", en: "Wearing the Jewish skullcap inside the synagogue", ur: "کناخہ میں یہودی ٹوپی پہننا", es: "Llevar el solideo judío dentro de la sinagoga", fr: "Porter la kippa juive à l'intérieur de la synagogue", tr: "Yahudi şapkasının tapınağa yerleştirilmesi", id: "Penempatan topi Yahudi di bait suci" }
summary:
  ar: "سأل سائل دُعي مع إخوته لزيارة معبد يهودي فلما ألقى محاضرته لاحظ بعضهم يضعون القلنسوة على رؤوسهم عن حكم ذلك. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81616 بتاريخ 5 يونيو 2010)⁩ أنهم أخطؤوا فيما فعلوا وأخطؤوا مرة أخرى فيما ردوا به عليه، فهذه الشعارات الدينية لا يجوز التشبه بأصحابها فيها بإجماع المسلمين، ونسأل الله أن يردهم إليه ردًّا جميلًا."
  en: "A questioner who lectured at a synagogue saw some of his companions put on the skullcap, and asked. Dr. Salah al-Sawi (fatwa no. 81616, 5 June 2010) answered that they erred in what they did and erred again in their reply to him: imitating those to whom such religious emblems belong is forbidden by the Muslims' consensus. Recorded as AMJA's answer."
  ur: "ایک سائل نے پوچھا کہ یہودی عبادت خانے میں ان کی مذہبی ٹوپی پہننا کیسا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81616، 5 جون 2010)⁩ کے مطابق دینی علامات میں مشابہت اجماعاً جائز نہیں؛ انہوں نے غلطی کی۔"
  es: "Un conferenciante que impartía una charla en una sinagoga vio a algunos de sus compañeros ponerse el solideo y preguntó al respecto. El Dr. Salah al-Sawi (fatwa n.º 81616, 5 de junio de 2010) respondió que se habían equivocado en su acción y también en su respuesta: imitar a quienes llevan tales símbolos religiosos está prohibido por consenso entre los musulmanes. Esta respuesta fue registrada por AMJA."
  fr: "Lors d'une conférence à la synagogue, un homme remarqua que certains de ses compagnons portaient la kippa et lui posa la question. Le Dr Salah al-Sawi (fatwa n° 81616, 5 juin 2010) répondit qu'ils avaient commis une erreur, tant dans leur geste que dans leur réponse: imiter ceux à qui appartiennent de tels symboles religieux est interdit par le consensus musulman. Cette réponse est consignée dans l'AMJA."
  tr: "Kardeşleriyle birlikte bir Yahudi tapınağını ziyaret etmek üzere davet edilen bir soru soranına sordu. Ders verirken, bazılarının kararla ilgili başlarını kapattığını fark etti. Dr. Salah Al-Sawy (5 Haziran 2010 tarihli Fetva No. 81616) yaptıklarında hata yaptıklarını ve yanıtlarında yine hata yaptıklarını söyledi. Bu dini sloganlar Müslümanların uzlaşmasıyla taklit edilmemelidir ve Tanrı'dan bunları güzel bir yanıtla geri vermesini diliyoruz."
  id: "Ia bertanya kepada seorang penanya yang diundang bersama saudara-saudaranya untuk mengunjungi sebuah kuil Yahudi. Saat ia memberikan ceramahnya, ia melihat beberapa dari mereka membongkar keputusan tersebut. Dr. Salah Al-Sawy menjawab (Fatwa No. 81616 tanggal 5 Juni 2010) bahwa mereka melakukan kesalahan dan kembali melakukan kesalahan dalam menjawab mereka. Slogan-slogan agama ini tidak boleh ditiru oleh konsensus umat Muslim, dan kami memohon kepada Tuhan agar mengembalikannya kepada-Nya dengan jawaban yang indah."
