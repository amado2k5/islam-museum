label: { ar: "حكم عدم التزام الصيدلي بشراء الدواء من غير الشركة المنتجة له", en: "May a pharmacist buy medicine from other than the manufacturer?", ur: "کیا فارما سیسٹ کمپنی کے بجائے دوسرے بائع سے دوا خرید سکتا ہے" }
summary:
  ar: "سائل سأل عن عدم التزام الصيدلي بشراء الدواء من الشركة المنتجة له وشرائه من بائعه بسعر يحقق منه ربحًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21510)⁩ أنه لا مانع شرعًا من قيام الصيدلي بشراء الدواء من بائعه بسعر يستطيع من خلاله أن يحقق ربحًا ما دام قد وقع الاتفاق على ذلك على ما فصّل الجواب."
  en: "A questioner asked whether a pharmacist must buy medicine only from its manufacturer, or may buy from a seller at a price leaving him profit. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21510) answered there is no legal objection to buying from the seller at a profitable price where agreed — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا فارما سیسٹ کو دوا صرف کمپنی سے خریدنی ہوگی یا کسی اور بائع سے خرید سکتا ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21510)⁩ نے جواب دیا کہ اتفاق سے ایسا کرنے میں کوئی شرعی مانع نہیں — جیسا کہ جواب میں تفصیل ہے۔"
