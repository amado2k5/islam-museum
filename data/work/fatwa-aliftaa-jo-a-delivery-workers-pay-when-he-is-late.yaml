id: work/fatwa-aliftaa-jo-a-delivery-workers-pay-when-he-is-late
class: work
kind: fatwa
label: { ar: "اشتراط مجانية التوصيل عند تأخر عامل التوصيل", en: "Stipulating free delivery when a delivery worker is late", ur: "ڈیلیوری میں تاخیر پر مفت ڈیلیوری کی شرط" }
summary:
  ar: "سؤال عن اشتراط أن يكون التوصيل مجانيًا إذا تأخر عامل التوصيل عن مدة معينة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم اشتراط حرمان العامل من أجره عند التأخر إلا إذا تبرع هو بذلك، ويجوز اشتراط خصم جزء معلوم من الأجرة. أجابت الدائرة بأن الأصل وجوب وفاء الحقوق لأصحابها ومنها حق الأجير، لأن استخدام الأجير دون عوض ظلم، واستشهدت بحديث رواه البخاري فيمن استأجر أجيرًا فاستوفى منه ولم يعطه أجره. وقالت إن عامل التوصيل أجير يؤدي خدمة، فلا يجوز بخس حقه باشتراط عدم دفع أجرته إذا تأخر، أما اشتراط خصم جزء من الأجرة فجائز كما عند بعض الحنفية وفي مجلة الأحكام العدلية، ونقلت قول المرغيناني في الهداية إن أبا يوسف ومحمدًا أجازا الشرطين فيمن قال إن خطته اليوم فبدرهم وإن خطته غدًا فبنصف درهم. وقالت إن العامل إذا اشترط ذلك على نفسه جاز لأنه من باب التبرع، ونبهت إلى أن بعض شركات التوصيل هي التي تفرض هذا الشرط فتحرم العامل من حقه في جهده، وهذا محرم. وخلصت إلى تحريم اشتراط حرمان العامل من أجره إذا تأخر إلا إذا تبرع هو بذلك، وجواز اشتراط خصم جزء معلوم من الأجرة عند تأخره."
  en: "A question about stipulating that a delivery is free if the delivery worker is late beyond a set time, in which Jordan's General Iftaa Department answered that stipulating that the worker loses his whole wage for lateness is forbidden unless he volunteers it himself, while stipulating a known deduction from the wage is permitted. The Department answered that rights must in principle be paid to those owed them, including a hired worker's right, because using a worker without payment is injustice, citing a hadith reported by al-Bukhari about one who hires a worker, takes his full work and does not give him his wage. It said a delivery worker is a hired worker providing a service, so his right may not be cut by stipulating that he gets no wage if he is late; but stipulating a deduction of part of the wage is permitted, as held by some Hanafis and in the Majalla, quoting al-Marghinani in al-Hidaya that Abu Yusuf and Muhammad allowed both conditions where someone says: if you sew it today you get a dirham, and if tomorrow, half a dirham. It said that if the worker imposes this on himself it is permitted, as a voluntary gift, and noted that some delivery companies impose the condition and so deprive the worker of his due for his effort, which is forbidden. It concluded that stipulating that the worker loses his wage for lateness is forbidden unless he volunteers it, and that stipulating a known deduction from the wage for lateness is permitted."
  ur: "اس شرط کے بارے میں سوال کہ اگر ڈیلیوری والا مقررہ وقت سے دیر کرے تو ڈیلیوری مفت ہوگی، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ تاخیر پر کارکن کو پوری اجرت سے محروم کرنے کی شرط حرام ہے سوائے اس کے کہ وہ خود رضاکارانہ طور پر ایسا کرے، جبکہ اجرت میں سے معلوم حصہ کاٹنے کی شرط جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اصل یہ ہے کہ حق داروں کے حقوق ادا کیے جائیں، جن میں مزدور کا حق بھی ہے، کیونکہ بغیر معاوضے مزدور سے کام لینا ظلم ہے؛ اس نے بخاری کی روایت کردہ حدیث کا حوالہ دیا اس شخص کے بارے میں جو مزدور رکھے، اس سے پورا کام لے اور اجرت نہ دے۔ اس نے کہا کہ ڈیلیوری کارکن خدمت انجام دینے والا اجیر ہے، لہٰذا تاخیر پر اجرت نہ دینے کی شرط لگا کر اس کا حق نہیں مارا جا سکتا؛ البتہ اجرت کا کچھ حصہ کاٹنے کی شرط جائز ہے، جیسا کہ بعض حنفیہ اور مجلۃ الاحکام العدلیہ میں ہے؛ اس نے الہدایہ میں مرغینانی کا قول نقل کیا کہ ابو یوسف اور محمد نے دونوں شرطوں کو جائز کہا جب کوئی کہے: آج سیو تو ایک درہم، کل سیو تو آدھا درہم۔ اس نے کہا کہ اگر کارکن خود اپنے اوپر یہ شرط لگائے تو جائز ہے کیونکہ یہ تبرع ہے، اور تنبیہ کی کہ بعض ڈیلیوری کمپنیاں یہ شرط عائد کر کے کارکن کو اس کی محنت کے حق سے محروم کرتی ہیں، جو حرام ہے۔ اس نے نتیجہ نکالا کہ تاخیر پر کارکن کو اجرت سے محروم کرنے کی شرط حرام ہے سوائے اس کے کہ وہ خود تبرع کرے، اور تاخیر پر اجرت میں سے معلوم حصہ کاٹنے کی شرط جائز ہے۔"
