id: work/fatwa-aliftaa-jo-a-wig-made-from-a-womans-own-hair
class: work
kind: fatwa
label: { ar: "باروكة من شعر المرأة نفسها", en: "A wig made from a woman's own hair", ur: "عورت کے اپنے بالوں سے بنی وگ" }
summary:
  ar: "سؤال عن باروكة من شعر المرأة نفسها، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا مانع منها ما دام الشعر شعرها وتفك عند الغسل الواجب ويمكن مسح جزء من الرأس في الوضوء، على ألا تظهر بها أمام الرجال الأجانب. أجابت الدائرة بأنه ما دام الشعر من المرأة نفسها، والباروكة تفك عند الغسل الواجب، ويمكن مسح جزء من الرأس عند الوضوء، فلا مانع شرعًا من صنعها. وقالت إن عليها ألا تظهر بها أمام الرجال الأجانب، لأنه لا يحل لهم النظر إلى شعر المرأة المنفصل، ونقلت من روضة الطالبين أن ما لا يجوز النظر إليه متصلًا، كشعر رأس الحرة، يحرم النظر إليه بعد انفصاله على الأصح."
  en: "A question about a wig made from a woman's own hair, in which Jordan's General Iftaa Department answered that there is no objection as long as the hair is her own, the wig is removed for obligatory ghusl and part of the head can be wiped in wudu, provided she does not appear in it before unrelated men. The Department answered that as long as the hair is the woman's own, the wig is taken off for obligatory ghusl, and part of the head can be wiped during wudu, there is no legal objection to making it. It said she should not appear in it before unrelated men, since they may not look at a woman's detached hair, quoting Rawdat al-Talibin that what may not be looked at while attached, such as a free woman's hair, may not be looked at once detached, according to the most correct view."
  ur: "عورت کے اپنے بالوں سے بنی وگ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جب تک بال اس کے اپنے ہوں، فرض غسل میں وگ اتاری جائے اور وضو میں سر کے کچھ حصے کا مسح ممکن ہو، کوئی حرج نہیں، بشرطیکہ وہ اسے پہن کر نامحرم مردوں کے سامنے نہ آئے۔ ڈیپارٹمنٹ نے جواب دیا کہ جب تک بال خود عورت کے ہوں، فرض غسل کے وقت وگ کھول دی جائے، اور وضو میں سر کے کچھ حصے کا مسح ممکن ہو، تو اسے بنانے میں کوئی شرعی رکاوٹ نہیں۔ اس نے کہا کہ وہ اسے پہن کر نامحرم مردوں کے سامنے نہ آئے، کیونکہ ان کے لیے عورت کے جدا شدہ بالوں کو دیکھنا حلال نہیں، اور روضۃ الطالبین سے نقل کیا کہ جس چیز کو جڑی ہوئی حالت میں دیکھنا جائز نہیں، جیسے آزاد عورت کے سر کے بال، اسے جدا ہونے کے بعد دیکھنا بھی زیادہ صحیح قول کے مطابق حرام ہے۔"
