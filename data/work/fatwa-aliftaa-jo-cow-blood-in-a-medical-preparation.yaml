id: work/fatwa-aliftaa-jo-cow-blood-in-a-medical-preparation
class: work
kind: fatwa
label: { ar: "استخدام دم البقر في تصنيع مستحضر طبي", en: "Using cow blood to make a medical preparation", ur: "طبی دوا کی تیاری میں گائے کا خون استعمال کرنا" }
summary:
  ar: "سؤال عن استخدام دم البقر في تصنيع مستحضر طبي، أجابت فيه دائرة الإفتاء العام الأردنية بأن الدم نجس، وأن المستحضرات التي يدخل فيها الدم يحرم استعمالها إلا إذا لم يوجد دواء طاهر يغني عنها وثبتت نجاعتها، فتباح حينئذ للحاجة. أجابت الدائرة بأن الدم من النجاسات، ونقلت عن النووي في شرحه على صحيح مسلم نقل الإجماع على نجاسته. وقالت إن الشافعية أجازوا التداوي بعين النجاسة كالدم والبول ولحم الميتة إذا فُقد الدواء الطاهر الذي يؤدي الغرض، ونقلت ذلك عن الشرواني في حاشيته على تحفة المحتاج. وذكرت أن مجلس الإفتاء الأردني قرر في قراره رقم 128 لسنة 2009 أن الجيلاتين المصنوع من مشتقات الخنزير أو الحيوانات النجسة لا يجوز استخدامه في الأدوية والمكملات الغذائية أو تغليفها لوجود بدائل من حيوانات مأكولة أو من النبات، إلا للضرورة وعند عدم البديل. وخلصت إلى أن المواد والمستحضرات الطبية التي يدخل في صناعتها شيء من الدم نجسة، فيحرم استخدامها إلا إذا لم يوجد ما يغني عنها من الأدوية الطاهرة وثبتت نجاعتها في العلاج، فيباح استعمالها حينئذ للحاجة."
  en: "A question about using cow blood to make a medical preparation, in which Jordan's General Iftaa Department answered that blood is impure and that preparations containing it may not be used unless no pure medicine can replace them and they are proven effective, in which case they are permitted out of need. The Department answered that blood is among the impure substances, citing al-Nawawi's commentary on Sahih Muslim, which reports a consensus that it is impure. It said the Shafi'is permit treatment with impure substances such as blood, urine or carrion when no pure medicine that serves the purpose is available, citing al-Shirwani's gloss on Tuhfat al-Muhtaj. It noted that the Jordanian Iftaa Council decided in its decision No. 128 of 2009 that gelatin made from pork derivatives or impure animals may not be used in medicines, food supplements or their capsules, because alternatives exist from animals that may be eaten or from plants, except in necessity and when there is no alternative. It concluded that medical materials and preparations made with any blood are impure and may not be used unless no pure medicine can replace them and they are proven effective in treatment, in which case their use is permitted out of need."
  ur: "طبی دوا کی تیاری میں گائے کا خون استعمال کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ خون نجس ہے اور جن دواؤں میں خون شامل ہو ان کا استعمال حرام ہے، الا یہ کہ کوئی پاک دوا ان کی جگہ نہ لے سکے اور ان کی افادیت ثابت ہو، تب ضرورت کی وجہ سے جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ خون نجاسات میں سے ہے، اور نووی کی شرح صحیح مسلم سے اس کی نجاست پر اجماع نقل کیا۔ اس نے کہا کہ شافعیہ نے خون، پیشاب اور مردار کے گوشت جیسی نجس چیزوں سے علاج کو اس وقت جائز رکھا ہے جب مقصد پورا کرنے والی پاک دوا نہ ملے؛ اس نے شروانی کے تحفۃ المحتاج پر حاشیے سے نقل کیا۔ اس نے ذکر کیا کہ اردنی افتاء کونسل نے 2009 کے فیصلہ نمبر 128 میں طے کیا کہ سور کے اجزا یا نجس جانوروں سے بنا جیلاٹن ادویات، غذائی سپلیمنٹس یا ان کے کیپسول میں استعمال کرنا جائز نہیں، کیونکہ حلال جانوروں یا نباتات سے متبادل موجود ہیں، سوائے ضرورت کے اور متبادل نہ ہونے کی صورت میں۔ اس نے نتیجہ نکالا کہ جن طبی مواد اور دواؤں کی تیاری میں کچھ بھی خون شامل ہو وہ نجس ہیں اور ان کا استعمال حرام ہے، الا یہ کہ کوئی پاک دوا ان کی جگہ نہ لے سکے اور علاج میں ان کی افادیت ثابت ہو، تب ضرورت کی وجہ سے ان کا استعمال جائز ہے۔"
