summary:
  ar: "كتاب الخوارزمي في تقويم البلدان شرح فيه آراء بطليموس، ويذكر محققا طبعة القاهرة لكتاب الجبر أنه وصل إلينا وأن نللينو رأى فيه بحثاً جديداً مستقلاً في الجغرافيا لا مجرد تقليد للآراء الإغريقية {cite:khwarizmi-jabr-cairo-1939 p.23} {cite:khwarizmi-jabr-cairo-1939 p.24}."
  en: "Al-Khwarizmi's book on the coordinates of countries, in which he set out Ptolemy's views; the Cairo editors of his algebra say it survives and that Nallino saw it as new and independent geographical research, not a mere imitation of the Greeks."
  es: "El libro de Al-Juarismi sobre las coordenadas de los países, en el que expuso las ideas de Ptolomeo; los editores de El Cairo de su álgebra afirman que se conserva y que Nallino lo consideró una investigación geográfica nueva e independiente, no una mera imitación de los griegos."
  fr: "L'ouvrage d'Al-Khwarizmi sur les coordonnées des pays, dans lequel il expose les idées de Ptolémée; les éditeurs cairotes de son algèbre affirment qu'il a survécu et que Nallino le considérait comme une recherche géographique nouvelle et indépendante, et non comme une simple imitation des Grecs."
  ur: "ممالک کے نقاط پر الخوارزمی کی کتاب، جس میں اس نے بطلیموس کے خیالات بیان کیے ہیں۔ اس کے الجبرا کے قاہرہ کے ایڈیٹرز کہتے ہیں کہ یہ زندہ ہے اور نالینو نے اسے ایک نئی اور آزاد جغرافیائی تحقیق کے طور پر دیکھا، نہ کہ یونانیوں کی محض تقلید۔"
