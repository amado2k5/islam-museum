id: work/fatwa-dar-alifta-eg-specifying-tawaf-intention-in-hajj
class: work
kind: fatwa
label: { ar: "حكم تعيين نية الطواف في الحج", en: "Whether the tawaf's intention must be specified in Hajj", ur: "حج میں طواف کی نیت کی تعیین", es: "Si la intención del tawaf debe especificarse en el Hajj", fr: "La question de savoir si l'intention du tawaf doit être précisée lors du Hajj", tr: "Hac sırasında Tevaf'ın niyetinin belirlenmesine ilişkin karar", id: "Putusan tentang penentuan niat Tawaf selama Haji" }
summary:
  ar: "سائل سأل عن تعيين نية الطواف في الحج وعن حج والدته التي طافت دون تعيين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20670)⁩ أن حج والدة السائل صحيح شرعًا ولا فدية عليها لأن الطواف يقع صحيحًا ويجزئ عن صاحبه إذا فعله من غير نية معينة على ما فصّل الجواب."
  en: "A questioner asked about specifying the tawaf's intention in Hajj, concerning his mother who circled without specifying. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20670) answered that her Hajj is valid and she owes no fidya, since tawaf is valid and sufficient without a specified intention — as the answer details."
  ur: "ایک سائل نے حج میں طواف کی نیت کی تعیین اور اپنی والدہ کے بغیر تعیین طواف کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20670)⁩ نے جواب دیا کہ ان کا حج صحیح ہے اور فدیہ نہیں کیونکہ طواف بغیر تعیین بھی صحیح ہوتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó acerca de especificar la intención del tawaf en el Hajj, en relación con su madre, quien realizó el peregrinaje sin especificarla. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20670) respondió que su Hajj es válido y que no debe pagar fidya, ya que el tawaf es válido y suficiente sin una intención específica, como se detalla en la respuesta."
  fr: "Un pèlerin a posé une question concernant la nécessité de préciser l'intention du tawaf lors du Hajj, au sujet de sa mère qui avait effectué le tawaf sans le préciser. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20670) a répondu que son Hajj est valide et qu'elle n'est redevable d'aucune fidya, le tawaf étant valide et suffisant sans intention spécifique – comme le détaille la réponse."
  tr: "Bir soru soran kişi, Hac sırasında Tevaf'ın niyetini ve annesinin Tevafı belirtmeden gerçekleştirdiği Hac hakkında bilgi sordu. Mısır Dar Al-İftesi (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 20670), soru soranın annesinin hac yolunun İslam hukukuna göre geçerli olduğunu ve ona karşılık verilmediğini, çünkü Tevafın geçerli olduğunu ve belirli bir niyet olmadan bunu yapan kişi için yeterli olduğunu, cevabında açıklandığı gibi yanıtladı."
  id: "Seorang penanya menanyakan tentang penjelasan niat Tawaf selama Haji dan tentang Haji ibunya yang melaksanakan Tawaf tanpa menyebutkannya. Dar Al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20670) menjawab bahwa haji ibu penanya sah menurut hukum Islam dan tidak ada kompensasi untuknya, karena Tawaf sah dan cukup bagi orang yang melakukannya tanpa niat khusus, seperti yang dijelaskan dalam jawaban."
