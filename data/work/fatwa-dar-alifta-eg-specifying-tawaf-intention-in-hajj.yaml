id: work/fatwa-dar-alifta-eg-specifying-tawaf-intention-in-hajj
class: work
kind: fatwa
label: { ar: "حكم تعيين نية الطواف في الحج", en: "Whether the tawaf's intention must be specified in Hajj", ur: "حج میں طواف کی نیت کی تعیین" }
summary:
  ar: "سائل سأل عن تعيين نية الطواف في الحج وعن حج والدته التي طافت دون تعيين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20670)⁩ أن حج والدة السائل صحيح شرعًا ولا فدية عليها لأن الطواف يقع صحيحًا ويجزئ عن صاحبه إذا فعله من غير نية معينة على ما فصّل الجواب."
  en: "A questioner asked about specifying the tawaf's intention in Hajj, concerning his mother who circled without specifying. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20670) answered that her Hajj is valid and she owes no fidya, since tawaf is valid and sufficient without a specified intention — as the answer details."
  ur: "ایک سائل نے حج میں طواف کی نیت کی تعیین اور اپنی والدہ کے بغیر تعیین طواف کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20670)⁩ نے جواب دیا کہ ان کا حج صحیح ہے اور فدیہ نہیں کیونکہ طواف بغیر تعیین بھی صحیح ہوتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
