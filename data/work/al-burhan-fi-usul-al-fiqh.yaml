authors: [person/imam-al-haramayn-al-juwayni]
structure: "Introductions: the sources of usul (kalam, Arabic, fiqh), reason and revelation, knowledge (pp. 2-40); language, commands (p. 83), prohibitions (p. 139), general and specific (p. 162), interpretation (pp. 186-228), abrogation, the Prophet's acts (p. 274), earlier laws (p. 286); Book 1 on reports (p. 325); Book 2 on consensus (p. 390); Book 3 on analogy, with the chapter on the division of causes and bases (p. 551); Book 4 on inference, kitab al-istidlal (p. 674); Book 5 on preference, kitab al-tarjih (p. 694); then fatwa and ijtihad, ending with the question of al-Shafi'i's wavering views (p. 855)."
