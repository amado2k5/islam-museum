label: { ar: "البرهان في أصول الفقه", en: "al-Burhan fi Usul al-Fiqh", ur: "البرہان فی اصول الفقہ" }
summary:
  ar: "كتاب في أصول الفقه لإمام الحرمين أبي المعالي عبد الملك بن عبد الله بن يوسف الجويني، يفتتحه بأن أصول الفقه مستمدة من الكلام والعربية والفقه، ثم يبسط مباحث البيان والأوامر والنواهي والعموم والتأويل والأفعال والأخبار والإجماع والقياس والاستدلال والترجيح والفتوى؛ ومن أشهر ما فيه تقسيمه أصول الشريعة خمسة أضرب بحسب استنادها إلى الضرورة أو الحاجة العامة أو المكرمات، وعرضه ثلاثة مذاهب في الاستدلال المرسل {cite:burhan-juwayni-mostafa p. 2} {cite:burhan-juwayni-mostafa p. 551} {cite:burhan-juwayni-mostafa p. 674} {cite:burhan-juwayni-mostafa p. 675}."
  en: "A work of legal theory by Imam al-Haramayn Abu al-Ma'ali Abd al-Malik ibn Abd Allah ibn Yusuf al-Juwayni, opening with the statement that legal theory draws on kalam, Arabic and substantive law, and then setting out exposition, commands, prohibitions, generality, interpretation, the Prophet's acts, reports, consensus, analogy, inference (istidlal), preference and fatwa; among its best-known passages are its division of the bases of the law into five kinds according to whether they rest on necessity, general need or noble conduct, and its account of three positions on unattested inference."
  ur: "امام الحرمین ابو المعالی عبد الملک بن عبد اللہ بن یوسف جوینی کی اصولِ فقہ پر کتاب، جو اس بیان سے شروع ہوتی ہے کہ اصولِ فقہ کلام، عربی اور فقہ سے ماخوذ ہے، پھر بیان، اوامر، نواہی، عموم، تاویل، افعالِ نبوی، اخبار، اجماع، قیاس، استدلال، ترجیح اور فتویٰ کے مباحث پیش کرتی ہے؛ اس کے مشہور ترین حصوں میں اصولِ شریعت کی پانچ قسموں میں تقسیم ہے — اس اعتبار سے کہ وہ ضرورت، عام حاجت یا مکارم پر مبنی ہیں — اور مرسل استدلال میں تین مذاہب کا بیان۔"
genre: [usul-al-fiqh]
