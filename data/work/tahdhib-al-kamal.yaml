label: { ar: "تهذيب الكمال في أسماء الرجال", en: "Tahdhib al-Kamal fi Asma al-Rijal", ur: "تہذیب الکمال فی اسماء الرجال" }
summary:
  ar: "موسوعة المزي في تراجم رواة أسانيد الكتب الستة وغيرها، أول معجم جامع قصد الاستيعاب في علم الرجال، جمع فيه كل ما وقف عليه من أخبار رواة الكتب الستة {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}؛ صنّفه في أربعة عشر مجلداً {cite:tarikh-islam-dhahabi p. 489}، واختصره الحفاظ ومن أشهر مختصراته «تهذيب التهذيب» لابن حجر في نحو ثلثه {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}."
  en: "Al-Mizzi's biographical lexicon of the transmitters in the isnads of the Six Books and some minor collections — the first comprehensive lexicon of its kind aiming at exhaustiveness, gathering virtually every scrap on the rijal kutub al-sitta {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}; he composed it in fourteen volumes {cite:tarikh-islam-dhahabi p. 489}, and scholars abridged it, most famously Ibn Hajar's Tahdhib al-Tahdhib at about a third of the original {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}."
  ur: "رواة کی تراجم کی مزی کی موسوعہ جو کتبِ ستہ اور چند دوسری کتابوں کی اسانید کے راویوں پر مشتمل ہے — علمِ رجال کی پہلی جامع لغت جس کا مقصد استیعاب تھا، جس میں انہوں نے رواۃ الکتب الستہ کے بارے میں ہر دستیاب خبر جمع کی {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}؛ انہوں نے اسے چودہ جلدوں میں لکھا {cite:tarikh-islam-dhahabi p. 489} اور علماء نے اس کے خلاصے کیے جن میں ابن حجر کا «تہذیب التہذیب» تقریباً ایک تہائی حجم میں سب سے مشہور ہے {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}۔"
