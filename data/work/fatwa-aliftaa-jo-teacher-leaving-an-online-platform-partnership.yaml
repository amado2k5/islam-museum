id: work/fatwa-aliftaa-jo-teacher-leaving-an-online-platform-partnership
class: work
kind: fatwa
label: { ar: "مدرّسة تنفرد بالعمل دون منصة شريكة مقصّرة", en: "A teacher who wants to work without an underperforming platform partner", ur: "ایک استانی جو کوتاہی کرنے والے پلیٹ فارم شریک کے بغیر کام کرنا چاہتی ہے", es: "Un profesor que desea trabajar sin un socio de plataforma de bajo rendimiento.", fr: "Un enseignant qui souhaite travailler sans partenaire de plateforme peu performant" }
summary:
  ar: "سؤال من مدرّسة تعمل مع منصة إلكترونية على أن لها 60% وللمنصة 40%، فقصّرت المنصة في عملها، أجابت فيه دائرة الإفتاء العام الأردنية بأنها لا تستحق زيادة على النسبة المتفق عليها، وأن عليها فسخ الشراكة أولًا إن أرادت الانفراد بالعمل. أجابت الدائرة بأن العقد شريعة المتعاقدين، وأن الشروط المتفق عليها يجب الالتزام بها إن خلت من المحرمات. وكيّفت العلاقة بين المدرسة ومالك المنصة بأنها شركة أعمال يوزَّع فيها الربح بحسب النسبة المتفق عليها، ونقلت عن المرغيناني في الهداية جواز شركة الصنائع. وخلصت إلى أن المدرسة التي تقوم بأعمال مسؤول المنصة لا تستحق شيئًا زائدًا على ما اتفقا عليه، وأنها إن أرادت الانفراد بالعمل فعليها أن تفسخ عقد الشراكة أولًا ثم تعمل وحدها."
  en: "A question from a teacher working with an online platform for 60% of the income, with 40% for the platform, after the platform stopped doing its share, in which Jordan's General Iftaa Department answered that she is not entitled to more than the agreed share, and that she must first dissolve the partnership if she wants to work alone. The Department answered that a contract is binding law between its parties, and agreed conditions must be honoured if they involve nothing forbidden. It classed the arrangement between the teacher and the platform owner as a partnership in work (sharikat a'mal), in which profit is divided by the agreed proportion, quoting al-Marghinani's al-Hidaya that a partnership of crafts is permitted. It concluded that the teacher who does the platform manager's work is not entitled to anything beyond what they agreed, and if she wants to work alone she must first dissolve the partnership contract and then work on her own."
  ur: "ایک استانی کا سوال جو ایک آن لائن پلیٹ فارم کے ساتھ آمدنی کے 60% پر کام کرتی ہے اور 40% پلیٹ فارم کا ہے، جب پلیٹ فارم نے اپنا کام چھوڑ دیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ وہ طے شدہ حصے سے زیادہ کی حق دار نہیں، اور اکیلے کام کرنا چاہے تو پہلے شراکت ختم کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ عقد فریقین کے درمیان قانون ہے، اور طے شدہ شرائط کی پابندی لازم ہے اگر ان میں کوئی حرام بات نہ ہو۔ اس نے استانی اور پلیٹ فارم کے مالک کے تعلق کو شرکتِ اعمال قرار دیا جس میں منافع طے شدہ تناسب سے تقسیم ہوتا ہے، اور مرغینانی کی الہدایہ سے نقل کیا کہ صنائع کی شرکت جائز ہے۔ اس نے نتیجہ نکالا کہ جو استانی پلیٹ فارم کے منتظم کا کام کرتی ہے وہ طے شدہ حصے سے زیادہ کی حق دار نہیں، اور اگر اکیلے کام کرنا چاہے تو پہلے شراکت کا عقد ختم کرے پھر خود کام کرے۔"
  es: "Una profesora que trabajaba con una plataforma en línea, donde recibía el 60% de los ingresos y el 40% restante correspondía a la plataforma, tras el cese de esta última en su pago, consultó con el Departamento General de Iftaa de Jordania, que le respondió que no tenía derecho a más de la participación acordada y que debía disolver la sociedad si deseaba trabajar de forma independiente. El Departamento argumentó que un contrato es ley vinculante entre las partes y que las condiciones pactadas deben respetarse si no implican nada prohibido. Clasificó el acuerdo entre la profesora y el propietario de la plataforma como una sociedad de trabajo (sharikat a'mal), en la que las ganancias se dividen según la proporción acordada, citando la obra de al-Marghinani, al-Hidaya, que permite la sociedad de oficios. Concluyó que la profesora que realiza el trabajo del administrador de la plataforma no tiene derecho a nada más allá de lo acordado y que, si desea trabajar de forma independiente, debe disolver el contrato de sociedad y luego trabajar por su cuenta."
  fr: "Une enseignante, qui percevait 60 % de ses revenus via une plateforme en ligne et 40 % pour cette dernière, a posé une question au Département général de la jurisprudence jordanienne (Iftaa). Ce dernier a cessé de verser sa part, et le Département a répondu que l'enseignante n'avait droit qu'à la part convenue et qu'elle devait dissoudre le partenariat si elle souhaitait exercer une activité indépendante. Le Département a expliqué qu'un contrat est juridiquement contraignant entre ses parties et que les conditions convenues doivent être respectées, sauf si elles contiennent des éléments illicites. Il a qualifié l'arrangement entre l'enseignante et le propriétaire de la plateforme de partenariat de travail (sharikat a'mal), où les bénéfices sont partagés selon les proportions convenues, citant l'ouvrage d'al-Marghinani, al-Hidaya, qui autorise les partenariats d'artisanat. En conclusion, le Département a estimé que l'enseignante, qui effectue les tâches de gestion de la plateforme, n'avait droit à rien de plus que ce qui avait été convenu et que, si elle souhaitait travailler à son compte, elle devait d'abord dissoudre le contrat de partenariat."
