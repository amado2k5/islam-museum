id: work/fatwa-aliftaa-jo-teacher-leaving-an-online-platform-partnership
class: work
kind: fatwa
label: { ar: "مدرّسة تنفرد بالعمل دون منصة شريكة مقصّرة", en: "A teacher who wants to work without an underperforming platform partner", ur: "ایک استانی جو کوتاہی کرنے والے پلیٹ فارم شریک کے بغیر کام کرنا چاہتی ہے" }
summary:
  ar: "سؤال من مدرّسة تعمل مع منصة إلكترونية على أن لها 60% وللمنصة 40%، فقصّرت المنصة في عملها، أجابت فيه دائرة الإفتاء العام الأردنية بأنها لا تستحق زيادة على النسبة المتفق عليها، وأن عليها فسخ الشراكة أولًا إن أرادت الانفراد بالعمل. أجابت الدائرة بأن العقد شريعة المتعاقدين، وأن الشروط المتفق عليها يجب الالتزام بها إن خلت من المحرمات. وكيّفت العلاقة بين المدرسة ومالك المنصة بأنها شركة أعمال يوزَّع فيها الربح بحسب النسبة المتفق عليها، ونقلت عن المرغيناني في الهداية جواز شركة الصنائع. وخلصت إلى أن المدرسة التي تقوم بأعمال مسؤول المنصة لا تستحق شيئًا زائدًا على ما اتفقا عليه، وأنها إن أرادت الانفراد بالعمل فعليها أن تفسخ عقد الشراكة أولًا ثم تعمل وحدها."
  en: "A question from a teacher working with an online platform for 60% of the income, with 40% for the platform, after the platform stopped doing its share, in which Jordan's General Iftaa Department answered that she is not entitled to more than the agreed share, and that she must first dissolve the partnership if she wants to work alone. The Department answered that a contract is binding law between its parties, and agreed conditions must be honoured if they involve nothing forbidden. It classed the arrangement between the teacher and the platform owner as a partnership in work (sharikat a'mal), in which profit is divided by the agreed proportion, quoting al-Marghinani's al-Hidaya that a partnership of crafts is permitted. It concluded that the teacher who does the platform manager's work is not entitled to anything beyond what they agreed, and if she wants to work alone she must first dissolve the partnership contract and then work on her own."
  ur: "ایک استانی کا سوال جو ایک آن لائن پلیٹ فارم کے ساتھ آمدنی کے 60% پر کام کرتی ہے اور 40% پلیٹ فارم کا ہے، جب پلیٹ فارم نے اپنا کام چھوڑ دیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ وہ طے شدہ حصے سے زیادہ کی حق دار نہیں، اور اکیلے کام کرنا چاہے تو پہلے شراکت ختم کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ عقد فریقین کے درمیان قانون ہے، اور طے شدہ شرائط کی پابندی لازم ہے اگر ان میں کوئی حرام بات نہ ہو۔ اس نے استانی اور پلیٹ فارم کے مالک کے تعلق کو شرکتِ اعمال قرار دیا جس میں منافع طے شدہ تناسب سے تقسیم ہوتا ہے، اور مرغینانی کی الہدایہ سے نقل کیا کہ صنائع کی شرکت جائز ہے۔ اس نے نتیجہ نکالا کہ جو استانی پلیٹ فارم کے منتظم کا کام کرتی ہے وہ طے شدہ حصے سے زیادہ کی حق دار نہیں، اور اگر اکیلے کام کرنا چاہے تو پہلے شراکت کا عقد ختم کرے پھر خود کام کرے۔"
