id: work/fatwa-amja-no-istinja-without-exit
class: work
kind: fatwa
label: { ar: "الاستنجاء وسببه", en: "No istinja where nothing exited — wind only breaks wudu", ur: "جب کچھ خارج نہ ہو — استنجاء نہیں", es: "No hay istinja donde no existía nada; el viento solo rompe el wudu.", fr: "Pas d'istinja là où rien n'existait — seul le vent interrompt les ablutions.", tr: "Istintaja ve nedeni", id: "Istintaja dan penyebabnya" }
summary:
  ar: "سألت امرأة هل يجب أن تدخل المرحاض قبل أن تتوضأ وهل دخوله وهي متوضئة يوجب الاستنجاء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78563 بتاريخ 14 أبريل 2009)⁩ أن الاستنجاء لا يلزم إلا من البول والغائط أو المذي ونحوه من الإفرازات التي توجب الاستنجاء أما إذا لم يخرج من ذلك شيء ولم يكن ثمة إلا انتقاض الوضوء بسبب الريح فلا يلزم إلا الوضوء على ما فصّل الجواب."
  en: "A woman asked whether she must enter the bathroom before wudu, and whether entering it while in wudu calls for istinja. Dr. Salah al-Sawi (fatwa no. 78563, 14 April 2009) answered that istinja is required only of urine, stool, madhy and the like of cleansing-obliging discharges; where nothing of that exited and all there was is wudu's breaking on wind, only wudu binds — as the answer details."
  ur: "کچھ خارج نہ ہو تو استنجاء؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78563، 14 اپریل 2009)⁩ کے مطابق استنجاء صرف خارج ہونے والوں پر ہے — ریح پر صرف وضو۔"
  es: "Una mujer preguntó si debía entrar al baño antes del wudu y si entrar durante el wudu requería istinja. El Dr. Salah al-Sawi (fatwa n.° 78563, 14 de abril de 2009) respondió que el istinja solo es necesario para la orina, las heces, el madhy y otras secreciones que obligan a la limpieza; cuando no se expulsa nada de eso y solo hay gases, solo el wudu es vinculante, como se detalla en la respuesta."
  fr: "Une femme a demandé si elle devait entrer dans la salle de bain avant d'avoir fait ses ablutions (wudu), et si le fait d'y entrer pendant ses ablutions nécessitait l'istinja. Le Dr Salah al-Sawi (fatwa n° 78563, 14 avril 2009) a répondu que l'istinja n'est requise que pour l'urine, les selles, le madhy et autres sécrétions purificatrices; en l'absence de telles sécrétions et si seules les ablutions étaient rompues par des gaz, seules les ablutions sont valides, comme le précise la réponse."
  tr: "Bir kadın, abdest almadan önce tuvaleti kullanmak zorunda olup olmadığını ve abdest alırken tuvalete girmenin istinja gerektirip gerektirmediğini sordu. Dr. Salah Al-Sawy (14 Nisan 2009 tarihli 78563 sayılı Fetva) istinja'nın yalnızca idrar, dışkı veya akıntı için zorunlu olduğunu ve bu yüzden istinja gerektirdiğini yanıtladı. Ancak bundan hiçbir şey çıkmazsa ve sadece rüzgar nedeniyle wudu iptal edilirse, cevapta açıklandığı gibi sadece abdest alma yeterlidir."
  id: "Seorang wanita bertanya apakah ia harus menggunakan toilet sebelum melakukan wudhu, dan apakah masuk ke toilet saat sedang mandi memerlukan istinja. Dr. Salah Al-Sawy menjawab (Fatwa No. 78563 tanggal 14 April 2009) bahwa istinja hanya wajib untuk urine, feses, atau cairan yang membutuhkan istinja. Namun, jika tidak ada yang keluar dari itu dan hanya ada pembatalan wudu karena angin, maka hanya wudhu yang diperlukan, seperti yang dijelaskan dalam jawaban."
