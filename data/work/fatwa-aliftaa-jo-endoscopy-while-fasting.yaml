id: work/fatwa-aliftaa-jo-endoscopy-while-fasting
class: work
kind: fatwa
label: { ar: "إجراء عمليات التنظير في نهار رمضان", en: "Endoscopy during the day in Ramadan", ur: "رمضان کے دن میں اینڈوسکوپی", es: "Endoscopia durante el día en Ramadán", fr: "Endoscopie en journée pendant le Ramadan", tr: "Ramazan gündüz saatlerinde endoskopi işlemlerinin yapılması", id: "Melakukan prosedur endoskopi selama siang hari Ramadan" }
summary:
  ar: "سؤال عن إجراء عمليات التنظير في نهار رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأن التنظير من أي منفذ يفسد الصيام، وعلى من أجري له قضاء اليوم. أجابت الدائرة بأن إجراء عمليات التنظير في نهار رمضان، سواء عن طريق الفم أو الأنف أو القبل أو الدبر، يفسد الصيام. وقالت إن على من أجريت له أن يقضي ذلك اليوم بعد رمضان."
  en: "A question about endoscopy during the day in Ramadan, in which Jordan's General Iftaa Department answered that endoscopy through any passage invalidates the fast and that the patient must make the day up. The Department answered that endoscopy during the day in Ramadan, whether through the mouth, the nose, the front passage or the rear passage, invalidates the fast. It said that the person who undergoes it must make that day up after Ramadan."
  ur: "رمضان کے دن میں اینڈوسکوپی کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کسی بھی راستے سے اینڈوسکوپی روزہ فاسد کر دیتی ہے اور مریض کو اس دن کی قضا کرنی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ رمضان کے دن میں اینڈوسکوپی، چاہے منہ، ناک، اگلی یا پچھلی شرمگاہ کے راستے ہو، روزہ فاسد کر دیتی ہے۔ اس نے کہا کہ جس کی اینڈوسکوپی ہو وہ رمضان کے بعد اس دن کی قضا کرے۔"
  es: "Una pregunta sobre la endoscopia durante el día en Ramadán, a la que el Departamento General de Iftaa de Jordania respondió que la endoscopia realizada a través de cualquier vía anula el ayuno y que el paciente debe recuperar el día. El Departamento explicó que la endoscopia realizada durante el día en Ramadán, ya sea por la boca, la nariz, el ano o el recto, invalida el ayuno. Indicó que la persona que se somete a este procedimiento debe recuperar ese día después de Ramadán."
  fr: "Une question concernant les endoscopies pratiquées en journée pendant le Ramadan a été posée. Le Département général de la Iftaa en Jordanie a répondu que toute endoscopie, quel que soit le mode d'accès, invalide le jeûne et que le patient doit rattraper le jour d'examen après le Ramadan. Le Département a précisé que toute endoscopie réalisée en journée pendant le Ramadan, que ce soit par la bouche, le nez, les voies urinaires antérieures ou postérieures, invalide le jeûne. Il a également indiqué que la personne concernée doit rattraper ce jour d'examen après le Ramadan."
  tr: "Ramazan'da gündüz endoskopi işlemlerinin yapılmasıyla ilgili bir soru var; Ürdün Genel Fetva Dairesi, herhangi bir işlemden endoskopinin orucu geçersiz kıldığını ve endoskopi olanların günü telafi etmek zorunda olduğunu yanıtladı. Bölüm, Ramazan'da gündüz içi ağızdan, burundan, öpüşerek veya anüs yoluyla endoskopi işlemlerinin orucu geçersiz kıldığını belirtti. Endoskopi yaptıranların Ramazan'dan sonraki gün telafi etmesi gerektiğini belirtti."
  id: "Sebuah pertanyaan tentang melakukan prosedur endoskopi pada siang hari di bulan Ramadan, di mana Departemen Fatwa Umum Yordania menjawab bahwa endoskopi dari prosedur apa pun membatalkan puasa, dan mereka yang menjalani endoskopi harus mengejar hari tersebut. Departemen menjawab bahwa melakukan prosedur endoskopi pada siang hari Ramadan, baik secara oral, melalui hidung, ciuman, atau anus, membatalkan puasa. Mereka mengatakan bahwa mereka yang menjalani endoskopi harus menebus pada hari setelah Ramadan."
