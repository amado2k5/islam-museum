id: work/fatwa-aliftaa-jo-endoscopy-while-fasting
class: work
kind: fatwa
label: { ar: "إجراء عمليات التنظير في نهار رمضان", en: "Endoscopy during the day in Ramadan", ur: "رمضان کے دن میں اینڈوسکوپی" }
summary:
  ar: "سؤال عن إجراء عمليات التنظير في نهار رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأن التنظير من أي منفذ يفسد الصيام، وعلى من أجري له قضاء اليوم. أجابت الدائرة بأن إجراء عمليات التنظير في نهار رمضان، سواء عن طريق الفم أو الأنف أو القبل أو الدبر، يفسد الصيام. وقالت إن على من أجريت له أن يقضي ذلك اليوم بعد رمضان."
  en: "A question about endoscopy during the day in Ramadan, in which Jordan's General Iftaa Department answered that endoscopy through any passage invalidates the fast and that the patient must make the day up. The Department answered that endoscopy during the day in Ramadan, whether through the mouth, the nose, the front passage or the rear passage, invalidates the fast. It said that the person who undergoes it must make that day up after Ramadan."
  ur: "رمضان کے دن میں اینڈوسکوپی کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کسی بھی راستے سے اینڈوسکوپی روزہ فاسد کر دیتی ہے اور مریض کو اس دن کی قضا کرنی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ رمضان کے دن میں اینڈوسکوپی، چاہے منہ، ناک، اگلی یا پچھلی شرمگاہ کے راستے ہو، روزہ فاسد کر دیتی ہے۔ اس نے کہا کہ جس کی اینڈوسکوپی ہو وہ رمضان کے بعد اس دن کی قضا کرے۔"
