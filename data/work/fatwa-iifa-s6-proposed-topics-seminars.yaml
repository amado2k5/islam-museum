label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن الموضوعات والندوات المقترحة من شعبة التخطيط", en: "IIFA resolution on the planning division's proposed topics and seminars", ur: "اکیڈمی کی قرارداد: منصوبہ بندی شعبے کے مقترح موضوعات و سمینار", es: "Resolución de la IIFA sobre los temas y seminarios propuestos por la división de planificación.", fr: "Résolution de l'IIFA sur les sujets et séminaires proposés par la division de planification", tr: "Uluslararası İslami Fiqh Akademisi'nin Planlama Bölümü tarafından önerilen konular ve seminerlerle ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai topik dan seminar yang diusulkan oleh Divisi Perencanaan" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: مراعاة المقترحات الواردة من شعبة التخطيط مع تفويض الأمانة العامة الاختيار منها بحسب مقتضيات المصلحة وبخاصة ما اقترح درسه في الدورة السابقة، وقيام الأمانة بالإعداد للندوات المقترحة مع أولوية الموضوعات المطروحة في الدورات."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990) on the planning division's proposed topics and seminars: the proposals are to be heeded, with the secretariat delegated to choose per interest — especially items suggested at the previous session — and to prepare the proposed seminars prioritising topics already raised."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩: منصوبہ بندی شعبے کی تجاویز پر عمل؛ سیکرٹریٹ کو انتخاب اور سمینارز کی تیاری کی اختیار۔"
  es: "Resolución de la sexta sesión de la IIFA (Yeda, marzo de 1990) sobre los temas y seminarios propuestos por la división de planificación: se deberán tener en cuenta las propuestas, delegándose a la secretaría la elección según el interés —especialmente los temas sugeridos en la sesión anterior— y la preparación de los seminarios propuestos, priorizando los temas ya planteados."
  fr: "Résolution de la sixième session de l'IIFA (Djeddah, mars 1990) sur les sujets et séminaires proposés par la division de la planification: les propositions doivent être prises en compte, le secrétariat étant chargé de choisir en fonction des intérêts — en particulier les points suggérés lors de la session précédente — et de préparer les séminaires proposés en privilégiant les sujets déjà soulevés."
  tr: "Uluslararası İslami Fiqh Akademisi'nin altıncı oturumunda (Cidde, Mart 1990) kararı: Planlama Bölümü'nden gelen öneriler dikkate alınarak, Genel Sekreterliğin özellikle önceki oturumda önerilenlere göre bu önerileri seçme yetkisi verilmiş, ayrıca Sekretarya, oturumlarda sunulan konulara öncelikli olarak önerilen seminerleri hazırlamıştır."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi keenamnya (Jeddah, Maret 1990): Dengan mempertimbangkan usulan yang diterima dari Divisi Perencanaan, dengan Sekretariat Jenderal diberi wewenang untuk memilih sesuai dengan persyaratan departemen, terutama yang diusulkan pada sesi sebelumnya, dan Sekretariat mempersiapkan seminar yang diusulkan dengan prioritas atas topik yang disajikan dalam sesi."
