label: { ar: "بيان ما يحصل به التحلل في الحج والعمرة", en: "How release from ihram is achieved in Hajj and umrah", ur: "حج اور عمرہ میں تحلل کیسے حاصل ہوتا ہے", es: "Cómo se logra la liberación del ihram en el Hajj y la Umrah.", fr: "Comment se déroule la levée de l'ihram lors du Hajj et de la Omra", tr: "Hac ve Umre sırasında dağılmanın nedenlerinin açıklaması", id: "Penjelasan tentang penyebab pembubaran selama Haji dan Umrah" }
summary:
  ar: "سائل سأل عن بيان ما يحصل به التحلل في الحج والعمرة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20710)⁩ أن العمرة فيها تحلل واحد يحصل بالحلق أو التقصير على القول بأنهما من أركانها بعد أداء سائر الأركان وبيّن الجواب تحلل الحج على وجهه."
  en: "A questioner asked how release from ihram is achieved in Hajj and umrah. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20710) answered that umrah has a single release — by shaving or shortening, on the view that these are among its pillars after the rest are done — and the answer sets out the releases of Hajj."
  ur: "ایک سائل نے حج اور عمرہ میں تحلل کے حصول کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20710)⁩ نے جواب دیا کہ عمرہ میں ایک تحلل ہے — مڑوانے یا بال کاٹنے سے — اور جواب میں حج کے تحلل بیان ہوئے۔"
  es: "Un consultante preguntó cómo se logra la liberación del ihram en el Hajj y la Umrah. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20710) respondió que la Umrah tiene una única liberación —mediante el afeitado o el acortamiento, ya que se consideran pilares fundamentales una vez cumplidos los demás— y la respuesta detalla las liberaciones del Hajj."
  fr: "Un internaute a demandé comment se dispenser de l'ihram lors du Hajj et de la Omra. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20710) a répondu que la Omra ne prévoit qu'une seule dispense: le rasage ou le raccourcissement du sac, considérés comme des piliers du pèlerinage une fois les autres rites accomplis. La réponse détaille ensuite les dispenses du Hajj."
  tr: "Bir soru soran kişi, Hac ve Umre sırasında boşaltmanın neden izin verildiğinin açıklamasını sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20710), Umre'nin saçın tıraş edilmesi veya kısaltılmasıyla elde edilen bir boşaltma (l'hajal) olduğunu ve diğer sütunları yaptıktan sonra her ikisinin de sütunlar arasında olduğunu, cevabın ise yüzünde hacın yasak olduğunu belirtti."
  id: "Seorang penanya menanyakan penjelasan mengapa pembuangan diizinkan selama Haji dan Umrah. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20710) menjawab bahwa Umrah melibatkan satu cairan (l'hajal) yang diperoleh dengan mencukur atau memendekkan rambut, menyatakan bahwa keduanya berada di antara tiangnya setelah melakukan tiang lainnya, dan jawabannya adalah Haji dilarang di wajah."
