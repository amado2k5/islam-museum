label: { ar: "بيان ما يحصل به التحلل في الحج والعمرة", en: "How release from ihram is achieved in Hajj and umrah", ur: "حج اور عمرہ میں تحلل کیسے حاصل ہوتا ہے", es: "Cómo se logra la liberación del ihram en el Hajj y la Umrah." }
summary:
  ar: "سائل سأل عن بيان ما يحصل به التحلل في الحج والعمرة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20710)⁩ أن العمرة فيها تحلل واحد يحصل بالحلق أو التقصير على القول بأنهما من أركانها بعد أداء سائر الأركان وبيّن الجواب تحلل الحج على وجهه."
  en: "A questioner asked how release from ihram is achieved in Hajj and umrah. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20710) answered that umrah has a single release — by shaving or shortening, on the view that these are among its pillars after the rest are done — and the answer sets out the releases of Hajj."
  ur: "ایک سائل نے حج اور عمرہ میں تحلل کے حصول کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20710)⁩ نے جواب دیا کہ عمرہ میں ایک تحلل ہے — مڑوانے یا بال کاٹنے سے — اور جواب میں حج کے تحلل بیان ہوئے۔"
  es: "Un consultante preguntó cómo se logra la liberación del ihram en el Hajj y la Umrah. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20710) respondió que la Umrah tiene una única liberación —mediante el afeitado o el acortamiento, ya que se consideran pilares fundamentales una vez cumplidos los demás— y la respuesta detalla las liberaciones del Hajj."
