id: work/fatwa-amja-arousal-thoughts-madhy
class: work
kind: fatwa
label: { ar: "الاغتسال عند التفكير", en: "Frequent washing for mere thoughts — it is madhy", ur: "خیال پر غسل — یہ مذی ہے", es: "Lavarse con frecuencia por meros pensamientos es una locura.", fr: "Se laver fréquemment pour de simples pensées — c'est de la folie", tr: "Düşünceli yıkanma", id: "Mencuci saat berpikir" }
summary:
  ar: "سألت امرأة أنها تكثر الاغتسال لمجرد حديث زوجها تلفونيًا وأحيانًا مداعبته أو التخيل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23382 بتاريخ 25 يوليو 2008)⁩ أن ما يخرج عند التفكير في الشهوة أو المداعبة من سائل أبيض رقيق لا يكون دفقًا ولا يعقبه فتور هو المذي الذي لا يوجب إلا الوضوء كما قال الشيخ القرضاوي والفرق بينه وبين المني ظاهر على ما فصّل الجواب."
  en: "A woman was washing often merely for her husband's phone talk, his fondling or imagining. Dr. Salah al-Sawi (fatwa no. 23382, 25 July 2008) answered that what exits at thinking of desire or fondling — a thin white fluid that is no gush and is followed by no lassitude — is madhy, which obliges only wudu, as Shaykh al-Qaradawi said; its difference from semen is plain — as the answer details."
  ur: "خیال یا بات پر بار بار غسل؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23382، 25 جولائی 2008)⁩ کے مطابق یہ مذی ہے — صرف وضو کافی۔"
  es: "Una mujer se lavaba con frecuencia simplemente para escuchar las conversaciones telefónicas de su marido, sus caricias o sus fantasías. El Dr. Salah al-Sawi (fatwa n.º 23382, 25 de julio de 2008) respondió que lo que aparece al pensar en el deseo o las caricias —un fluido blanco y fino que no es un chorro abundante ni va seguido de lasitud— es madhy, que solo requiere wudu, como dijo el jeque al-Qaradawi; su diferencia con el semen es evidente, como se detalla en la respuesta."
  fr: "Une femme se lavait fréquemment simplement pour les conversations téléphoniques de son mari, ses caresses ou ses fantasmes. Le Dr Salah al-Sawi (fatwa n° 23382, 25 juillet 2008) a répondu que ce qui se produit à la pensée du désir ou des caresses — un fluide blanc et fin, sans éjaculation ni sensation de fatigue — est le madhy, qui n'exige que les ablutions (wudu), comme l'a dit le cheikh al-Qaradawi; sa différence avec le sperme est évidente, comme le détaille la réponse."
  tr: "Bir kadına sordum; sadece kocası telefonda konuştuğu, bazen onu okşadığı ya da hayal ettiği için sık sık yıkanıyor. Dr. Salah Al-Sawy (25 Temmuz 2008 tarihli Fetva No. 23382) şehvet veya ön sevişme düşünüldüğünde çıkan şeyin, akmayan ya da ılık sıvı gelmeyen, sadece destmeme ihtiyaç duyan ince, beyaz bir sıvı olduğunu söyledi, Şeyh Al-Karadawi'nin dediği gibi. Cevapta açıklandığı gibi, meniyle arasındaki fark açıktır."
  id: "Saya bertanya kepada seorang wanita yang sering dia cuci hanya karena suaminya berbicara di telepon, kadang membelai atau membayangkannya. Dr. Salah Al-Sawy menjawab (Fatwa No. 23382 tanggal 25 Juli 2008) bahwa yang keluar saat memikirkan nafsu atau pemanasan adalah cairan putih tipis yang tidak mengalir atau diikuti cairan hangat adalah cairan yang hanya perlu dibersihkan, seperti yang dikatakan Sheikh Al-Qaradawi. Perbedaan antara itu dan sperma jelas seperti yang dijelaskan dalam jawaban."
