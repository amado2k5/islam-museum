label: { ar: "كيف تُقام الجنازات أثناء كوفيد-19؟", en: "How should Janazahs be conducted during COVID-19?", ur: "کووڈ-19 کے دوران نماز جنازہ کیسے ادا ہو؟", es: "¿Cómo deben celebrarse los funerales durante la pandemia de COVID-19?", fr: "Comment les funérailles (Janazahs) doivent-elles être organisées pendant la pandémie de COVID-19 ?", tr: "COVID-19 sırasında cenazeler nasıl yapılır?", id: "Bagaimana pemakaman diadakan selama COVID-19?" }
summary:
  ar: "سؤال عن كيفية إقامة الجنازات أثناء جائحة كوفيد-19. أجاب الدكتور ذو الفقار علي شاه في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشر نوفمبر 2021)⁩ بأن الأحكام الاعتيادية غير ممكنة في تلك المرحلة وأن الجنازة تقوم بشخص واحد وتجوز في المغسلة أو موقف السيارات أو المقبرة على ما فصّل الجواب."
  en: "A question about how funeral prayers should be conducted during COVID-19. Dr. Zulfiqar Ali Shah answered on the Fiqh Council of North America site (published November 2021): the usual rulings were not possible at that stage; the janaza can be performed by one person and held at a funeral home, parking lot or cemetery — as the answer details."
  ur: "کووڈ-19 کے دوران نماز جنازہ کے طریقے کا سوال۔ ڈاکٹر ذوالفقار علی شاہ نے فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ نومبر 2021)⁩ جواب دیا کہ اس مرحلے میں معمول کے احکام ممکن نہیں؛ جنازہ ایک فرد سے ہو سکتا ہے اور کفن دفن گاہ پارکنگ یا قبرستان میں ہو سکتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una pregunta sobre cómo deben realizarse las oraciones fúnebres durante la COVID-19. El Dr. Zulfiqar Ali Shah respondió en el sitio web del Consejo de Fiqh de América del Norte (publicado en noviembre de 2021): las normas habituales no eran posibles en esa etapa; el janaza puede ser realizado por una sola persona y celebrarse en una funeraria, un estacionamiento o un cementerio, como se detalla en la respuesta."
  fr: "Une question portait sur la manière dont les prières funéraires devaient être conduites pendant la pandémie de COVID-19. Le Dr Zulfiqar Ali Shah a répondu sur le site du Conseil de jurisprudence islamique d'Amérique du Nord (publication de novembre 2021): les règles habituelles n'étaient pas applicables à ce stade; la prière funéraire (janaza) peut être effectuée par une seule personne et se dérouler dans un funérarium, un parking ou un cimetière, comme le précise la réponse."
  tr: "COVID-19 pandemisi sırasında cenazelerin nasıl yapıldığına dair bir soru. Dr. Zulfiqar Ali Shah, Kuzey Amerika Hukuk Konseyi web sitesinde (Kasım 2021'de yayımlandı) bu aşamada olağan kararların mümkün olmadığını ve cenazenin bir kişi tarafından yapıldığını, ayrıca cevapta detaylandırıldığı üzere çamaşırhane, otopark veya mezarlıkta izin verildiğini yanıtladı."
  id: "Sebuah pertanyaan tentang bagaimana pemakaman diadakan selama pandemi COVID-19. Dr. Zulfiqar Ali Shah menjawab di situs web North American Jurisprudential Council (diterbitkan November 2021) bahwa keputusan biasa tidak memungkinkan pada tahap tersebut dan bahwa pemakaman diadakan oleh satu orang dan diperbolehkan di tempat cuci pakaian, tempat parkir, atau pemakaman, seperti yang dijelaskan dalam jawaban."
