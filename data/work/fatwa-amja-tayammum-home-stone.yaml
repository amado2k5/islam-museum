label: { ar: "التيمم على حجر بالبيت", en: "Tayammum on a household stone — only where water fails", ur: "گھر کے پتھر پر تیمم — پانی نہ ہو تو", es: "Tayammum sobre una piedra doméstica: solo donde escasea el agua.", fr: "Tayammum sur une pierre domestique — seulement là où l'eau manque", tr: "Evde bir taş üzerinde Tayammum", id: "Tayammum di atas batu di rumah" }
summary:
  ar: "سأل سائل أن لديه حجرًا طبيعيًا هل يجوز له التيمم عليه وهو مغسول. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21943 بتاريخ 23 أبريل 2006)⁩ أنه لا يجوز ذلك في حال الاختيار وهذا قول الجمهور على خلاف بينهم في التفاصيل وأعني بحال الاختيار أن يكون قادرًا على استعمال الماء فالتيمم بدل عن الوضوء عند فقد الماء أو العجز عن استعماله على ما فصّل الجواب."
  en: "A questioner had a natural stone, washed — may he do tayammum on it? Dr. Salah al-Sawi (fatwa no. 21943, 23 April 2006) answered that it is not lawful in a state of choice — the majority's saying, with differences in their details — choice meaning being able to use water; tayammum is a stand-in for wudu where water is lacking or unusable — as the answer details."
  ur: "گھر کے پتھر پر تیمم؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21943، 23 اپریل 2006)⁩ کے مطابق پانی میسر ہو تو نہیں — تیمم بدل ہے۔"
  es: "Un consultante tenía una piedra natural lavada; ¿puede realizar el tayammum sobre ella? El Dr. Salah al-Sawi (fatwa n.º 21943, 23 de abril de 2006) respondió que no es lícito en un estado de elección (la opinión mayoritaria, con diferencias en los detalles); elección significa poder usar agua; tayammum es un sustituto del wudu cuando el agua escasea o no se puede usar, como se detalla en la respuesta."
  fr: "Un homme a posé la question suivante: « Peut-il faire le tayammum avec une pierre naturelle lavée ? » Le Dr Salah al-Sawi (fatwa n° 21943, 23 avril 2006) a répondu que cela n’est pas licite en état de libre choix – avis majoritaire, avec quelques différences dans les détails – le libre choix signifiant la capacité d’utiliser l’eau; le tayammum remplace les ablutions lorsque l’eau est absente ou inutilisable, comme le précise la réponse."
  tr: "Bir soruya soran kişiye şöyle soruldu: Eğer doğal taşı varsa, yıkanırken üzerinde tayammum yapması caiz midir? Dr. Salah Al-Sawi (23 Nisan 2006 tarihli 21943 sayılı fetva) bunun tercih durumunda izin verilmediğini yanıtladı. Bu, çoğunluğun ayrıntılar konusundaki görüşüdür; yani seçim durumunda su kullanılabilmek gerekir, bu yüzden su kaybolduğunda veya kullanılamadığında tayammum wudu yerine geçer, cevapta açıklandığı gibi."
  id: "Seorang penanya ditanya: Jika ia memiliki batu alam, apakah diperbolehkan melakukan tayammum di atasnya saat sedang dicuci? Dr. Salah Al-Sawi menjawab (Fatwa No. 21943 tanggal 23 April 2006) bahwa hal itu tidak diperbolehkan dalam kasus pilihan. Ini adalah pendapat mayoritas di antara mereka terkait detail, artinya dalam kasus pilihan, bahwa seseorang harus dapat menggunakan air, sehingga tayammum adalah pengganti wudu ketika air hilang atau tidak dapat digunakan, seperti yang dijelaskan dalam jawaban."
