id: work/fatwa-dar-alifta-eg-men-greeting-women-salam
class: work
kind: fatwa
label: { ar: "حكم إلقاء السلام من الرجال على النساء", en: "Men greeting women with the salam", ur: "مردوں کا عورتوں کو سلام کرنا", es: "Los hombres saludan a las mujeres con el salam", fr: "Des hommes saluant des femmes avec le salam" }
summary:
  ar: "سائل سأل عن إلقاء السلام من الرجال على النساء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21643)⁩ أنه يجوز شرعًا إلقاء السلام ورده بين جماعة كل من الرجال والنساء أو بين جماعة الرجال وامرأة منفردة على ما فصّل الجواب من أحواله وضوابطه."
  en: "A questioner asked about men giving the salam to women. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21643) answered that giving and returning the greeting is lawful between groups of men and women, and between a group of men and a solitary woman — under the cases and controls the answer sets out."
  ur: "ایک سائل نے مردوں کے عورتوں کو سلام کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21643)⁩ نے جواب دیا کہ مردوں اور عورتوں کے گروہوں کے درمیان اور مردوں کے گروہ اور تنہا عورت کے درمیان سلام کرنا اور جواب دینا جائز ہے — جواب کے احوال اور ضوابط کے ساتھ۔"
  es: "Un interlocutor preguntó sobre la práctica de que los hombres saluden a las mujeres con el saludo tradicional (salam). El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21643) respondió que el saludo, tanto para hombres como para mujeres, es lícito entre grupos de hombres y mujeres, y entre un grupo de hombres y una mujer sola, según los casos y controles que se detallan en la respuesta."
  fr: "Une question a été posée concernant le fait pour les hommes de saluer les femmes. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21643) a répondu que saluer et répondre est licite entre groupes d'hommes et de femmes, ainsi qu'entre un groupe d'hommes et une femme seule, sous réserve des conditions et des circonstances précisées dans la fatwa."
