id: work/fatwa-dar-alifta-eg-restoring-nose-plastic-surgery
class: work
kind: fatwa
label: { ar: "حكم إجراء عملية تجميل لإرجاع الأنف لشكلها الأول", en: "Cosmetic surgery restoring a nose to its form before an accident", ur: "حادثے سے پہلے کی صورت پر ناک کی ٹھیک کرنے کی سرجری", es: "Cirugía estética para devolverle a la nariz su forma anterior a un accidente.", fr: "Chirurgie esthétique pour redonner au nez sa forme d'avant l'accident", tr: "Burnun orijinal şekline kavuşturmak için estetik cerrahi yapılmasına ilişkin karar", id: "Putusan tentang menjalani operasi kosmetik untuk mengembalikan hidung ke bentuk aslinya" }
summary:
  ar: "سائل سأل عن إجراء عملية تجميل لإرجاع الأنف لشكلها الأول قبل تعرضها لحادث. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21504)⁩ أنه لا مانع شرعًا من إجراء جراحة تجميلية لإرجاع الأنف لشكلها الأول قبل تعرضها لحادث وما تدعو إليه الحاجة من جراحة على ما فصّل الجواب."
  en: "A questioner asked about cosmetic surgery restoring a nose to its form before an accident. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21504) answered there is no legal objection to cosmetic surgery returning the nose to its prior form, nor to whatever further surgery need requires — as the answer details."
  ur: "ایک سائل نے حادثے سے پہلے کی حالت پر ناک لانے کی کاسمیٹک سرجری کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21504)⁩ نے جواب دیا کہ اس میں کوئی شرعی مانع نہیں اور نہ ضرورت کی مزید سرجری میں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la cirugía estética para devolverle a la nariz su forma anterior a un accidente. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21504) respondió que no existe ninguna objeción legal a la cirugía estética para devolverle a la nariz su forma anterior, ni a cualquier otra cirugía que sea necesaria, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la chirurgie esthétique visant à restaurer la forme du nez après un accident. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21504) a répondu qu'il n'y a aucune objection légale à une telle intervention, ni à aucune autre intervention chirurgicale ultérieure si nécessaire, comme le précise la réponse."
  tr: "Bir soru soran, burnu kazara olmadan önceki orijinal şekline kavuşturmak için estetik cerrahi yapılması hakkında sorular sordu. Mısır'ın Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21504), kaza öncesi burnu orijinal şekline döndürmek için estetik cerrahi yapılmasına dini bir itiraz olmadığını ve hangi ameliyatın gerekli olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang melakukan operasi kosmetik untuk mengembalikan hidung ke bentuk aslinya sebelum menjadi kecelakaan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21504) menjawab bahwa tidak ada keberatan agama terhadap melakukan operasi kosmetik untuk mengembalikan bentuk hidung ke bentuk aslinya sebelum kecelakaan dan operasi apa yang diperlukan, seperti yang dijelaskan dalam jawaban."
