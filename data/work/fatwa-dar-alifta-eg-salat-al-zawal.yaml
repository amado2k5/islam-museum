label: { ar: "بيان المراد بصلاة الزوال وفضلها وعدد ركعاتها", en: "What salat al-zawal is, its merit and its rak'as", ur: "نمازِ زوال کیا ہے، اس کا فضیلت اور رکعات کی تعداد", es: "Qué es salat al-zawal, su mérito y sus rak'as", fr: "Qu'est-ce que la salat al-zawal, son mérite et ses rak'as ?", tr: "Zumar duasının anlamı, erdemi ve birim sayısının netleştirilmesi", id: "Penjelasan makna doa Zumar, kebajikannya, dan jumlah unitnya" }
summary:
  ar: "سائل سأل عن المراد بصلاة الزوال وفضلها وعدد ركعاتها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21860)⁩ أنها أربع ركعات تصلي بتسليم واحد في آخرهن وقيل ركعتين تصلي بعد زوال الشمس وقبل صلاة الظهر وبيّن الجواب فضلها على وجهه."
  en: "A questioner asked what is meant by salat al-zawal, its merit and how many rak'as it is. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21860) answered that it is four rak'as closed with one salam — some say two — prayed after the sun's decline and before the zuhr prayer; the answer sets out its merit."
  ur: "ایک سائل نے نمازِ زوال کے معنی، فضیلت اور رکعات کی تعداد پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21860)⁩ نے جواب دیا کہ یہ چار رکعات ہیں جو ایک سلام کے ساتھ ادا ہوتی ہیں — ایک قول کے مطابق دو — اور سورج ڈھلنے کے بعد نمازِ ظہر سے پہلے پڑھی جاتی ہیں؛ جواب میں اس کا فضیلت بھی بیان ہوا۔"
  es: "Un interlocutor preguntó qué significa salat al-zawal, cuál es su mérito y cuántas rak'as son. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21860) respondió que son cuatro rak'as que terminan con un salam —algunos dicen dos— que se rezan después de la puesta del sol y antes de la oración del zuhr; la respuesta detalla su mérito."
  fr: "Un internaute a demandé ce que signifie la prière de zawal (salat al-zawal), son mérite et le nombre de rak'as qu'elle comporte. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21860) a répondu qu'il s'agit de quatre rak'as se terminant par un salam (certains disent deux), accomplies après le coucher du soleil et avant la prière de zuhr; la réponse expose son mérite."
  tr: "Bir soru soran kişi Zumar namazının anlamı, erdemi ve rekalarının sayısı hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21860), sonunda bir taslimle birlikte dört rekah namazının yapıldığını, gün batımından sonra ve Dhuhr namazından önce iki rekatın okunduğunu, cevabın ise yüzüne göre tercih edildiğini söyledi."
  id: "Seorang penanya menanyakan makna shalat Zumar, kebajikannya, dan jumlah rak'ahnya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21860) menjawab bahwa ada empat rak'ah yang harus didoakan dengan satu tasleem di akhir, dan dikatakan bahwa dua rak'ah didoakan setelah matahari terbenam dan sebelum shalat Dhuhr, dan jawabannya adalah bahwa rak'ah itu lebih disukai di wajahnya."
