id: work/fatwa-dar-alifta-eg-road-accident-deaths-martyrs
class: work
kind: fatwa
label: { ar: "مدى اعتبار من يموت بحوادث الطريق من الشهداء", en: "Are those who die in road accidents counted as martyrs?", ur: "سڑک حادثات میں مرنے والے شہید شمار ہوتے ہیں؟", es: "¿Se considera mártires a quienes mueren en accidentes de tráfico?", fr: "Les personnes qui meurent dans des accidents de la route sont-elles considérées comme des martyrs ?" }
summary:
  ar: "سائل سأل عن من يموت في حوادث الطرق. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22010)⁩ أن من مات في حوادث الطرق والسير وبسبب الإصابات الناجمة عنها معدود من شهداء الآخرة بشرط عدم التفريط منه، على ما فصّل الجواب."
  en: "A questioner asked about those who die in road accidents. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22010) answered that whoever dies in a road or traffic accident or from its injuries is counted among the martyrs of the Hereafter — provided there was no negligence on his part — as the answer details."
  ur: "ایک سائل نے سڑک حادثات میں مرنے والوں کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22010)⁩ نے جواب دیا کہ جو سڑک یا ٹریفک حادثے یا اس کی چوٹوں سے مرے وہ آخرت کے شہداء میں شمار ہوتا ہے — بشرطیکہ اس کی طرف سے کوتاہی نہ ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre las personas que mueren en accidentes de tráfico. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22010) respondió que quien muere en un accidente de tráfico o a causa de las lesiones sufridas en él, se cuenta entre los mártires del Más Allá, siempre que no haya habido negligencia por su parte, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant les personnes décédées dans des accidents de la route. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22010) a répondu que quiconque meurt dans un accident de la route ou des suites de ses blessures est compté parmi les martyrs de l'au-delà, à condition qu'il n'y ait eu aucune négligence de sa part, comme le précise la réponse."
