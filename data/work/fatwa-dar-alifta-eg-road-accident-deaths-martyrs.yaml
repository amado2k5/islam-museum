label: { ar: "مدى اعتبار من يموت بحوادث الطريق من الشهداء", en: "Are those who die in road accidents counted as martyrs?", ur: "سڑک حادثات میں مرنے والے شہید شمار ہوتے ہیں؟" }
summary:
  ar: "سائل سأل عن من يموت في حوادث الطرق. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22010)⁩ أن من مات في حوادث الطرق والسير وبسبب الإصابات الناجمة عنها معدود من شهداء الآخرة بشرط عدم التفريط منه، على ما فصّل الجواب."
  en: "A questioner asked about those who die in road accidents. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22010) answered that whoever dies in a road or traffic accident or from its injuries is counted among the martyrs of the Hereafter — provided there was no negligence on his part — as the answer details."
  ur: "ایک سائل نے سڑک حادثات میں مرنے والوں کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22010)⁩ نے جواب دیا کہ جو سڑک یا ٹریفک حادثے یا اس کی چوٹوں سے مرے وہ آخرت کے شہداء میں شمار ہوتا ہے — بشرطیکہ اس کی طرف سے کوتاہی نہ ہو — جیسا کہ جواب میں تفصیل ہے۔"
