  ur: "گراناڈا کی فتح کے بعد کے ایک خاندان پر ردوا اشور کی تثلیث - موریسکوس اور ایک حرام ثقافت؛ اندلس کے اختتام پر بہترین عربی افسانہ۔"
  tr: "Radwa Ashour'un Granada'daki düşüşten sonra Endülüslü bir aileyi konu alan üçlemesi — Moriskolar ve Yasak Kültür; Endülüs hakkında en kapsamlı Arap edebi metinlerinden biri."
  id: "Trilogi Radwa Ashour tentang sebuah keluarga Andalusia di Granada setelah kejatuhan — Moriscos dan Budaya Terlarang; salah satu teks sastra Arab paling lengkap tentang Andalusia."
