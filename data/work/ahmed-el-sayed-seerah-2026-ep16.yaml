class: work
kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 16: أنواع الأذى التي تعرض لها النبي"
  en: "The Biography of the Messenger of God 2026, episode 16: The kinds of harm the Prophet suffered"
  ur: "سیرتِ رسول اللہ 2026، قسط 16: نبی کو پہنچنے والی اذیتوں کی اقسام"
  fr: "La biographie du Messager de Dieu 2026, épisode 16 : Les formes de mal subies par le Prophète"
  es: "La biografía del Mensajero de Dios 2026, episodio 16: Las clases de daño que sufrió el Profeta"
summary:
  ar: "تبدأ الحلقة بترجمة البدري بلال بن رباح من كتاب سليمان العودة عن المقاتلين البدريين. ثم تقرأ من ابن إسحاق وابن هشام ما لقيه النبي من أذى في مكة، وتحكم على أسانيد الروايات، وتروي إسلام حمزة وعرض عتبة بن ربيعة، وتبدأ الرواية الطويلة عن مطالب قريش والأسئلة الثلاثة التي أُرسلت إلى علماء اليهود في المدينة، وتنتهي عند بداية تفسير سورة الكهف."
  en: "The episode opens with a biography of the Badr veteran Bilal ibn Rabah from Sulayman al-Awda's book on the Badr fighters. It then reads from Ibn Ishaq and Ibn Hisham on the harm suffered by the Prophet in Mecca, grades the chains of the reports, tells the conversion of Hamza and Utba ibn Rabi'a's offer, and begins the long report of Quraysh's demands and the three questions sent to the Jewish scholars of Medina, ending at the start of the exegesis of Surat al-Kahf."
  ur: "قسط کا آغاز سلیمان العودہ کی بدر کے مجاہدین پر کتاب سے بدری صحابی بلال بن رباح کی سوانح سے ہوتا ہے۔ پھر وہ ابن اسحاق اور ابن ہشام سے مکہ میں نبی کو پہنچنے والی اذیت پڑھتے ہیں، روایات کی سندوں پر حکم لگاتے ہیں، حمزہ کے اسلام اور عتبہ بن ربیعہ کی پیشکش بیان کرتے ہیں، اور قریش کے مطالبات اور مدینہ کے یہودی علما کو بھیجے گئے تین سوالات کی طویل روایت شروع کرتے ہیں، جو سورہ کہف کی تفسیر کے آغاز پر ختم ہوتی ہے۔"
  fr: "L'épisode s'ouvre par la biographie du vétéran de Badr Bilal ibn Rabah, tirée du livre de Sulayman al-Awda sur les combattants de Badr. Il lit ensuite Ibn Ishaq et Ibn Hisham sur le mal subi par le Prophète à La Mecque, juge les chaînes des récits, raconte la conversion de Hamza et l'offre d'Utba ibn Rabi'a, et commence le long récit des exigences de Quraysh et des trois questions envoyées aux savants juifs de Médine, pour s'achever au début de l'exégèse de la sourate al-Kahf."
  es: "El episodio abre con la biografía del veterano de Badr Bilal ibn Rabah, tomada del libro de Sulayman al-Awda sobre los combatientes de Badr. Luego lee a Ibn Ishaq y a Ibn Hisham sobre el daño que sufrió el Profeta en La Meca, califica las cadenas de los relatos, cuenta la conversión de Hamza y la oferta de Utba ibn Rabi'a, y comienza el largo relato de las exigencias de Quraysh y de las tres preguntas enviadas a los sabios judíos de Medina, y termina al comienzo de la exégesis de la sura al-Kahf."
