label: { ar: "قصيدة العباس بن مرداس في يوم حنين", en: "Abbas ibn Mirdas's ode on the Battle of Hunayn", es: "Oda de Abbas ibn Mirdas sobre la batalla de Hunayn", fr: "Ode d'Abbas ibn Mirdas sur la bataille de Hunayn", ur: "جنگ حنین میں عباس بن مرداس کا قصیدہ", tr: "Hunayn Günü'nde Al-Abbas bin Mirdas'ın şiiri", id: "Puisi Al-Abbas bin Mirdas pada Hari Hunayn" }
summary:
  ar: "قصيدة العباس بن مرداس السلمي يصف فيها وقائع يوم حنين، وافتخاره ببلاء بني سليم وثبات المسلمين بعد الانكشاف الأول، والرد على شعراء هوازن. مطلعها: «تَقَضَّى أمورٌ وتأتِي أمور»."
  en: "The ode composed by Abbas ibn Mirdas al-Sulami celebrating the steadfastness of Banu Sulaym and the Muslims' counter-rally at the Battle of Hunayn, answering Hawazin's poets."
  es: "La oda compuesta por Abbas ibn Mirdas al-Sulami celebra la firmeza de Banu Sulaym y la contraofensiva de los musulmanes en la batalla de Hunayn, respondiendo a los poetas de Hawazin."
  fr: "L'ode composée par Abbas ibn Mirdas al-Sulami célébrant la fermeté des Banu Sulaym et la contre-attaque des musulmans lors de la bataille de Hunayn, en réponse aux poètes de Hawazin."
  ur: "بنو سلیم کی ثابت قدمی اور جنگ حنین میں مسلمانوں کی جوابی ریلی کا جشن مناتے ہوئے عباس بن مرداس السلمی کی تحریر کردہ غزل، ہوازن کے شعروں کا جواب دیتی ہے۔"
  tr: "Al-Abbas ibn Mirdas Al-Sulami'nin şiiri, Hunayn Günü'ndeki olayları, Banu Süleym'in sıkıntılarına duyduğu gururu, ilk vahiyden sonra Müslümanların kararlılığını ve Hawazin'in şairlerine verilen bir yanıtı anlatır. Şiirinin başı: \"İşler kararlaştırılır ve işler gelecektir.\""
  id: "Puisi Al-Abbas ibn Mirdas Al-Sulami menggambarkan peristiwa Hari Hunayn, kebanggaannya atas penderitaan Banu Sulaym, keteguhan umat Muslim setelah wahyu awal, dan tanggapan terhadap para penyair Hawazin. Pembukaannya adalah: \"Urusan telah ditetapkan dan hal-hal akan datang.\""
