id: work/fatwa-islamweb-false-testimony-that-let-an-adopted-son-inherit
class: work
kind: fatwa
label: { ar: "شهد لشخص كي يرث وهو يظن أنه ابن للمتوفى ثم ظهر أنه ليس ابنًا له", en: "Testifying that a man was the deceased's son so he could inherit, then learning he was adopted", ur: "میت کا بیٹا سمجھ کر وراثت کے لیے گواہی دینا، پھر معلوم ہونا کہ وہ بیٹا نہیں تھا" }
summary:
  ar: "سؤال من رجل شهد عند القاضي لشخص كي يرث من متوفى على أنه ابنه، وهو في الأصل متبنى مسجل في الدفتر العائلي على أنه ابنه لأن المتوفى لا يُنجب، وكان السائل يظن قبل مدة أنه ابنه حقيقة، ثم ندم وسأل هل هذه شهادة زور وهل عليه كفارة، أجاب فيه مركز الفتوى بإسلام ويب بأن شهادة الزور الشهادة بخلاف الحق وهي من أكبر الكبائر بحديث أبي بكرة في صحيح البخاري، وضابط الزور عند ابن حجر وصف الشيء على خلاف ما هو به، فإن كان وقت شهادته شهد بخلاف ما يعلم فقد شهد شهادة زور، فيبادر بالتوبة والاستغفار، ومن تمام توبته أن يأتي المحكمة التي شهد عندها فيصرّح ببطلان شهادته وأن المشهود له لا تربطه بالمتوفى علاقة نسب، كما في الإقناع في حل ألفاظ أبي شجاع أن توبة المعصية القولية تكون بالقول فيقول في شهادة الزور شهادتي باطلة وأنا نادم عليها، مع رد ظلامة الآدمي، وأن هذه الشهادة يترتب عليها مفاسد كثيرة من إرث مال الغير والإلحاق بأسرة معينة، فليبادر بإصلاح ما أفسده."
  en: "A question from a man who testified before a judge that a certain person was the son of a deceased man so that he could inherit, when the person was in fact adopted and registered in the family record as a son because the deceased could not have children; the questioner had earlier believed him to be a real son, then regretted it and asked whether this was false testimony and whether he owes an expiation. The fatwa centre of IslamWeb answered that false testimony is testimony contrary to the truth and among the gravest of major sins by the hadith of Abu Bakra in Sahih al-Bukhari, and that its criterion according to Ibn Hajar is describing a thing contrary to what it is; so if at the time of his testimony he testified contrary to what he knew, he gave false testimony and must hasten to repent and seek forgiveness, and part of his repentance is to go to the court where he testified and declare his testimony void and that the person he testified for has no blood relationship with the deceased, as al-Iqna fi Hall Alfaz Abi Shuja states that repentance from a verbal sin is by speech, saying of false testimony 'my testimony is void and I regret it', together with restoring what was wrongfully taken from a person; and that this testimony may have many harmful consequences, since the person would inherit another's wealth and be attached to a particular family, so he should hasten to set right what he spoiled."
  ur: "ایک شخص کا سوال جس نے قاضی کے سامنے گواہی دی کہ فلاں شخص ایک متوفی کا بیٹا ہے تاکہ وہ وارث بنے، جبکہ وہ شخص دراصل منہ بولا بیٹا تھا جو خاندانی رجسٹر میں بیٹے کے طور پر درج تھا کیونکہ متوفی کی اولاد نہیں ہوتی تھی؛ سائل پہلے اسے حقیقی بیٹا سمجھتا تھا، پھر نادم ہوا اور پوچھا کہ کیا یہ جھوٹی گواہی ہے اور کیا اس پر کفارہ ہے۔ اسلام ویب کے فتویٰ مرکز نے جواب دیا کہ جھوٹی گواہی حق کے خلاف گواہی ہے اور صحیح بخاری میں ابو بکرہ کی حدیث کی بنا پر بڑے گناہوں میں سب سے بڑے گناہوں میں سے ہے، اور ابن حجر کے نزدیک جھوٹ کا ضابطہ کسی چیز کو اس کے خلاف بیان کرنا ہے جو وہ ہے؛ لہٰذا اگر اس نے گواہی کے وقت اپنے علم کے خلاف گواہی دی تو اس نے جھوٹی گواہی دی، اور اسے فوراً توبہ اور استغفار کرنا چاہیے، اور اس کی توبہ کی تکمیل یہ ہے کہ وہ اس عدالت میں جائے جہاں گواہی دی اور اپنی گواہی کے باطل ہونے اور یہ کہ جس کے لیے گواہی دی اس کا متوفی سے کوئی نسبی رشتہ نہیں، صراحت کرے، جیسا کہ الاقناع فی حل الفاظ ابی شجاع میں ہے کہ قولی گناہ سے توبہ قول سے ہوتی ہے، جھوٹی گواہی میں کہے 'میری گواہی باطل ہے اور میں اس پر نادم ہوں'، انسان کے ناحق لیے گئے حق کی واپسی کے ساتھ؛ اور یہ کہ اس گواہی کے بہت سے نقصان دہ نتائج ہو سکتے ہیں، کیونکہ وہ شخص دوسرے کا مال وراثت میں لے گا اور ایک خاص خاندان سے منسوب ہوگا، لہٰذا وہ جو خراب کیا اسے درست کرنے میں جلدی کرے۔"
