id: work/fatwa-islamweb-false-testimony-that-let-an-adopted-son-inherit
class: work
kind: fatwa
label: { ar: "شهد لشخص كي يرث وهو يظن أنه ابن للمتوفى ثم ظهر أنه ليس ابنًا له", en: "Testifying that a man was the deceased's son so he could inherit, then learning he was adopted", ur: "میت کا بیٹا سمجھ کر وراثت کے لیے گواہی دینا، پھر معلوم ہونا کہ وہ بیٹا نہیں تھا", es: "Testificar que un hombre era hijo del difunto para poder heredar, y luego enterarse de que era adoptado.", fr: "Il a témoigné qu'un homme était le fils du défunt afin qu'il puisse hériter, puis a appris qu'il était adopté.", tr: "Bir kişinin miras alması için tanıklık etti ve ölen kişinin oğlu olduğunu düşündü, sonra onun oğlu olmadığı ortaya çıktı.", id: "Dia bersaksi untuk seseorang mewarisi dengan mengira dirinya adalah putra almarhum, lalu menjadi jelas bahwa dia bukan putranya." }
summary:
  ar: "سؤال من رجل شهد عند القاضي لشخص كي يرث من متوفى على أنه ابنه، وهو في الأصل متبنى مسجل في الدفتر العائلي على أنه ابنه لأن المتوفى لا يُنجب، وكان السائل يظن قبل مدة أنه ابنه حقيقة، ثم ندم وسأل هل هذه شهادة زور وهل عليه كفارة، أجاب فيه مركز الفتوى بإسلام ويب بأن شهادة الزور الشهادة بخلاف الحق وهي من أكبر الكبائر بحديث أبي بكرة في صحيح البخاري، وضابط الزور عند ابن حجر وصف الشيء على خلاف ما هو به، فإن كان وقت شهادته شهد بخلاف ما يعلم فقد شهد شهادة زور، فيبادر بالتوبة والاستغفار، ومن تمام توبته أن يأتي المحكمة التي شهد عندها فيصرّح ببطلان شهادته وأن المشهود له لا تربطه بالمتوفى علاقة نسب، كما في الإقناع في حل ألفاظ أبي شجاع أن توبة المعصية القولية تكون بالقول فيقول في شهادة الزور شهادتي باطلة وأنا نادم عليها، مع رد ظلامة الآدمي، وأن هذه الشهادة يترتب عليها مفاسد كثيرة من إرث مال الغير والإلحاق بأسرة معينة، فليبادر بإصلاح ما أفسده."
  en: "A question from a man who testified before a judge that a certain person was the son of a deceased man so that he could inherit, when the person was in fact adopted and registered in the family record as a son because the deceased could not have children; the questioner had earlier believed him to be a real son, then regretted it and asked whether this was false testimony and whether he owes an expiation. The fatwa centre of IslamWeb answered that false testimony is testimony contrary to the truth and among the gravest of major sins by the hadith of Abu Bakra in Sahih al-Bukhari, and that its criterion according to Ibn Hajar is describing a thing contrary to what it is; so if at the time of his testimony he testified contrary to what he knew, he gave false testimony and must hasten to repent and seek forgiveness, and part of his repentance is to go to the court where he testified and declare his testimony void and that the person he testified for has no blood relationship with the deceased, as al-Iqna fi Hall Alfaz Abi Shuja states that repentance from a verbal sin is by speech, saying of false testimony 'my testimony is void and I regret it', together with restoring what was wrongfully taken from a person; and that this testimony may have many harmful consequences, since the person would inherit another's wealth and be attached to a particular family, so he should hasten to set right what he spoiled."
  ur: "ایک شخص کا سوال جس نے قاضی کے سامنے گواہی دی کہ فلاں شخص ایک متوفی کا بیٹا ہے تاکہ وہ وارث بنے، جبکہ وہ شخص دراصل منہ بولا بیٹا تھا جو خاندانی رجسٹر میں بیٹے کے طور پر درج تھا کیونکہ متوفی کی اولاد نہیں ہوتی تھی؛ سائل پہلے اسے حقیقی بیٹا سمجھتا تھا، پھر نادم ہوا اور پوچھا کہ کیا یہ جھوٹی گواہی ہے اور کیا اس پر کفارہ ہے۔ اسلام ویب کے فتویٰ مرکز نے جواب دیا کہ جھوٹی گواہی حق کے خلاف گواہی ہے اور صحیح بخاری میں ابو بکرہ کی حدیث کی بنا پر بڑے گناہوں میں سب سے بڑے گناہوں میں سے ہے، اور ابن حجر کے نزدیک جھوٹ کا ضابطہ کسی چیز کو اس کے خلاف بیان کرنا ہے جو وہ ہے؛ لہٰذا اگر اس نے گواہی کے وقت اپنے علم کے خلاف گواہی دی تو اس نے جھوٹی گواہی دی، اور اسے فوراً توبہ اور استغفار کرنا چاہیے، اور اس کی توبہ کی تکمیل یہ ہے کہ وہ اس عدالت میں جائے جہاں گواہی دی اور اپنی گواہی کے باطل ہونے اور یہ کہ جس کے لیے گواہی دی اس کا متوفی سے کوئی نسبی رشتہ نہیں، صراحت کرے، جیسا کہ الاقناع فی حل الفاظ ابی شجاع میں ہے کہ قولی گناہ سے توبہ قول سے ہوتی ہے، جھوٹی گواہی میں کہے 'میری گواہی باطل ہے اور میں اس پر نادم ہوں'، انسان کے ناحق لیے گئے حق کی واپسی کے ساتھ؛ اور یہ کہ اس گواہی کے بہت سے نقصان دہ نتائج ہو سکتے ہیں، کیونکہ وہ شخص دوسرے کا مال وراثت میں لے گا اور ایک خاص خاندان سے منسوب ہوگا، لہٰذا وہ جو خراب کیا اسے درست کرنے میں جلدی کرے۔"
  es: "Una pregunta de un hombre que testificó ante un juez que cierta persona era hijo de un hombre fallecido para que pudiera heredar, cuando en realidad la persona era adoptada y registrada en el registro familiar como hijo porque el fallecido no podía tener hijos; el interrogador había creído previamente que era un hijo legítimo, luego se arrepintió y preguntó si esto era falso testimonio y si debía expiar algo. El centro de fatwas de IslamWeb respondió que el falso testimonio es un testimonio contrario a la verdad y uno de los pecados mayores más graves según el hadiz de Abu Bakra en Sahih al-Bukhari, y que su criterio según Ibn Hajar es describir algo contrario a lo que es; Así que si en el momento de su testimonio declaró contrario a lo que sabía, dio falso testimonio y debe apresurarse a arrepentirse y buscar el perdón, y parte de su arrepentimiento es ir al tribunal donde testificó y declarar nulo su testimonio y que la persona por la que testificó no tiene parentesco consanguíneo con el fallecido, como afirma al-Iqna fi Hall Alfaz Abi Shuja que el arrepentimiento de un pecado verbal es mediante el habla, diciendo sobre el falso testimonio 'mi testimonio es nulo y lo lamento', junto con la restitución de lo que se le quitó injustamente a una persona; y que este testimonio puede tener muchas consecuencias dañinas, ya que la persona heredaría la riqueza de otro y estaría vinculada a una familia en particular, por lo que debe apresurarse a enmendar lo que estropeó."
  fr: "Un homme a posé la question suivante à un juge: il avait témoigné qu’une personne était le fils d’un défunt afin de pouvoir hériter, alors qu’en réalité, cette personne avait été adoptée et enregistrée comme fils, le défunt étant stérile. L’homme, qui avait cru auparavant qu’il s’agissait de son fils biologique, s’est ensuite repenti et a demandé si son témoignage était faux et s’il devait expier sa faute. Le centre de fatwas d’IslamWeb a répondu que le faux témoignage est un témoignage contraire à la vérité et compte parmi les péchés majeurs les plus graves, selon le hadith d’Abou Bakr rapporté dans Sahih al-Bukhari. Ibn Hajar a précisé que son critère est de décrire une chose contrairement à ce qu’elle est. Ainsi, si au moment de son témoignage il a témoigné contre ce qu'il savait, il a fait un faux témoignage et doit se repentir promptement et demander pardon. Une partie de son repentir consiste à se rendre au tribunal où il a témoigné et à déclarer son témoignage nul et non avenu, en précisant que la personne pour laquelle il a témoigné n'a aucun lien de sang avec le défunt. Comme l'indique al-Iqna fi Hall Alfaz Abi Shuja, le repentir d'un péché verbal s'effectue par la parole, en déclarant à propos d'un faux témoignage: « Mon témoignage est nul et je le regrette », et en restituant ce qui a été indûment pris à autrui. Ce faux témoignage peut avoir de nombreuses conséquences néfastes, car la personne pourrait hériter des biens d'autrui et être liée à une famille particulière; elle doit donc se hâter de réparer ce qu'elle a souillé."
  tr: "Bir adamın sorusu, ölen kişinin oğlu olarak miras alması için mahkeme önünde tanıklık etti; bu kişi aslında aile siciline evlatlık edilmiş ve çocuğu olmadığı için aile siciline evlatlık olarak kaydedilmiş bir çocuktu. Soru soran kişi uzun zaman önce gerçekten oğlu olduğunu sanmış, sonra pişman olmuş ve bunun sahte tanıklık olup olmadığını ve bunun bir kefaret olup olmadığını sordu. IslamWeb'deki Fetva Merkezi, yalan tanıklığın gerçeğe aykırı tanıklık olduğunu ve Ebu Bekre'nin Sahih al-Bukhari'deki hadislerine göre en büyük günahlardan biri olduğunu, İbn Hajar ve bir tanıma göre yalan ölçütü olduğunu yanıtladı Bir şey tersine olur. Tanıklık sırasında bildiklerine aykırı ifade verdiyse, yanlış tanıklık etmiş olur, bu yüzden hemen tövbe eder ve af dilenir. Tövbesini tamamladıktan sonra, mahkemeye gelir ve tanıklık ettiği ifadeyi geçersiz sayar, tanıklık edilen kişinin merhumla akrabalık ilişkisi olmadığını belirtir; tıpkı Ebu Şuca'nın sözlerinde olduğu gibi, sözlü günah için tövbe konuşma yoluyla olduğuna dair ikna edilir. Bir kişinin yanlışlarını çürütürken 'Tanıklığım geçersizdir ve pişmanım' der. Bu tanıklık, başkalarının servetini miras alıp belirli bir aileye katılmaktan kaynaklanan birçok zarara yol açar. Bu yüzden bozduğu şeyi düzeltmek için acele etmelidir."
  id: "Pertanyaan dari seorang pria yang bersaksi di hadapan hakim untuk seseorang mewarisi dari almarhum sebagai anaknya, yang awalnya adalah anak angkat yang terdaftar dalam catatan keluarga sebagai anaknya karena almarhum tidak memiliki anak. Penanya sudah lama mengira dia benar-benar anaknya, lalu menyesalinya dan bertanya apakah ini kesaksian palsu dan apakah ini penebusan. Fatwa Center di IslamWeb menjawab bahwa kesaksian palsu adalah kesaksian yang bertentangan dengan kebenaran dan merupakan salah satu dosa besar, menurut hadits Abu Bakrah dalam Sahih al-Bukhari, serta kriteria kebohongan menurut Ibn Hajar dan deskripsinya Ada sesuatu yang bertentangan dengan kenyataannya. Jika pada saat kesaksiannya ia bersaksi bertentangan dengan apa yang ia ketahui, ia telah memberikan kesaksian palsu, maka ia segera bertobat dan mencari pengampunan. Setelah selesai bertobat, ia harus datang ke pengadilan tempat ia bersaksi dan menyatakan kesaksiannya tidak sah, dan bahwa saksi tersebut tidak memiliki hubungan keluarga dengan almarhum, seperti dalam bujukan kata-kata Abu Shuja bahwa pertobatan atas dosa verbal adalah melalui ucapan. Ia berkata, 'Kesaksian saya tidak sah dan saya menyesalnya,' sambil membantah kesalahan seseorang. Kesaksian ini menimbulkan banyak kerugian dari mewarisi kekayaan orang lain dan bergabung dengan keluarga tertentu. Jadi ia harus segera memperbaiki apa yang telah ia rusak."
