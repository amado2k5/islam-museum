  id: "Oleh Sheikh terhormat Jamal al-Din Abu Abdullah Muhammad ibn Abdullah al-Ta'i al-Jiyani, yang dikenal sebagai Ibn Malik al-Nahwi, yang wafat pada tahun 672 H; komentar dan anotasinya telah banyak hingga mencapai puluhan {cite:kashf-zunun-furqan, hlm. 578-582}."
