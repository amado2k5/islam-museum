summary:
  ar: "مدونة جماعية إسلامية بالإنجليزية تعنى بقضايا المسلمين ولا سيما في الغرب؛ أقدم لقطة لها في أرشيف الإنترنت في 13 مارس 2007، تصف فيها نفسها بأنها خطابات في التقاليد الفكرية والوضع السياسي والأخلاق الاجتماعية للمسلمين."
  en: "An English-language Muslim group blog on issues facing Muslims, especially in the West; its earliest archived capture, of 13 March 2007, describes it as 'Discourses in the Intellectual Traditions, Political Situation, and Social Ethics of Muslims'."
  ur: "انگریزی میں مسلمانوں، خاص طور پر مغرب کے مسلمانوں، کے مسائل پر گروپ بلاگ؛ سب سے پرانی آرکائیو تصویر 13 مارچ 2007 کی، جس میں وہ خود کو مسلمانوں کی فکری روایات، سیاسی صورتِ حال اور سماجی اخلاقیات پر مباحث کہتی ہے۔"
  es: "Un blog colectivo musulmán en inglés sobre temas que afectan a los musulmanes, especialmente en Occidente; su primera publicación archivada, del 13 de marzo de 2007, lo describe como \"Discursos sobre las tradiciones intelectuales, la situación política y la ética social de los musulmanes\"."
  fr: "Un blog collectif musulman anglophone traitant des problèmes rencontrés par les musulmans, notamment en Occident; sa plus ancienne archive, datée du 13 mars 2007, le décrit comme « Discours sur les traditions intellectuelles, la situation politique et l'éthique sociale des musulmans »."
  tr: "Özellikle Batı'daki Müslüman meseleleriyle ilgilenen İngilizce bir İslami kolektif blog; 13 Mart 2007'de Internet Archive'da yer alan en erken anlık fotoğrafı, kendisini Müslümanların entelektüel gelenekleri, siyasi durumu ve sosyal etik üzerine söylemler olarak tanımlar."
  id: "Sebuah blog kolektif Islam dalam bahasa Inggris yang membahas isu-isu Muslim, terutama di Barat; potret paling awal di Internet Archive pada 13 Maret 2007, menggambarkan dirinya sebagai wacana tentang tradisi intelektual, situasi politik, dan etika sosial umat Muslim."
