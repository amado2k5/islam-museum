summary:
  ar: "حاشية لطيفة لأحمد بن محمد الشمني ⁦(ت 872هـ)⁩ على «الشفا» للقاضي عياض، يضبط فيها ألفاظه ويفسر غريبه ويحل مشكله، لخّصها من شرح البرهان الحلبي وزاد عليها، وفرغ منها في العشر الأخير من ذي القعدة سنة 847هـ؛ وتُطبع في ذيل صفحات الشفا."
  en: "A short gloss by Ahmad ibn Muhammad al-Shumunni (d. 872 AH) on Qadi Iyad's al-Shifa, fixing the reading of its words, explaining rare terms and resolving difficulties; abridged from Burhan al-Halabi's commentary with additions and finished in the last ten days of Dhu al-Qa'da 847 AH. It is printed at the foot of the pages of al-Shifa."
