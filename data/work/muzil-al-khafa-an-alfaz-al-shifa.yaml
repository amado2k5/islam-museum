label: { ar: "مزيل الخفاء عن ألفاظ الشفاء", en: "Muzil al-Khafa' an Alfaz al-Shifa'", ur: "مزیل الخفاء عن الفاظ الشفاء", es: "Muzil al-Khafa' an Alfaz al-Shifa'", fr: "Muzil al-Khafa' et Alfaz al-Shifa'", tr: "İyileştirici sözlerinin kaldırıcısı", id: "Penghapus kata-kata penyembuhan" }
summary:
  ar: "حاشية لطيفة لأحمد بن محمد الشمني ⁦(ت 872هـ)⁩ على «الشفا» للقاضي عياض، يضبط فيها ألفاظه ويفسر غريبه ويحل مشكله، لخّصها من شرح البرهان الحلبي وزاد عليها، وفرغ منها في العشر الأخير من ذي القعدة سنة 847هـ؛ وتُطبع في ذيل صفحات الشفا."
  en: "A short gloss by Ahmad ibn Muhammad al-Shumunni (d. 872 AH) on Qadi Iyad's al-Shifa, fixing the reading of its words, explaining rare terms and resolving difficulties; abridged from Burhan al-Halabi's commentary with additions and finished in the last ten days of Dhu al-Qa'da 847 AH. It is printed at the foot of the pages of al-Shifa."
  es: "Breve glosa de Ahmad ibn Muhammad al-Shumunni (fallecido en 872 AH) sobre la obra al-Shifa de Qadi Iyad, que fija la lectura de sus palabras, explica términos poco comunes y resuelve dificultades; abreviada del comentario de Burhan al-Halabi con añadidos y finalizada en los últimos diez días de Dhu al-Qa'da de 847 AH. Está impresa al pie de las páginas de al-Shifa."
  fr: "Une courte glose d'Ahmad ibn Muhammad al-Shumunni (mort en 872 AH) sur l'ouvrage al-Shifa du cadi Iyad, fixant la lecture des mots, expliquant les termes rares et résolvant les difficultés; abrégée du commentaire de Burhan al-Halabi, avec ajouts, elle fut achevée durant les dix derniers jours de Dhu al-Qa'da 847 AH. Elle est imprimée au bas des pages d'al-Shifa."
  ur: "احمد بن محمد الشمنی ⁦(متوفی 872ھ)⁩ کا قادی ایاد کے الشفاء پر ایک مختصر بیان، اس کے الفاظ کے پڑھنے کو درست کرنا، نایاب اصطلاحات کی وضاحت اور مشکلات کا حل؛ برہان الحلبی کی تفسیر سے اضافے کے ساتھ مختصر کیا گیا اور ذوالقعدہ 847 ہجری کے آخری عشرہ میں ختم ہوا۔ یہ الشفاء کے صفحات کے دامن میں چھپی ہے۔"
  tr: "Ahmed bin Muhammed el-Şemni'nin (ö. 872 Hicri yıl) Kadi İyad'ın 'El-Şifa' adlı eserine yazdığı hoş bir kenar notu vardır; burada sözleri açıklar, nadir noktalarını açıklar ve sorunlarını çözer. Bunu El-Burhan el-Halabi'nin tefsirinden özetlemiş, eklemeler yapmış ve 847 H yılında Zhu al-Qi'dah'ın son on gününde tamamlamıştır; bu not, El-Şifa'nın sayfalarının alt kısmında basılıdır."
  id: "Sebuah catatan pinggir yang indah oleh Ahmad ibn Muhammad al-Shamni (wafat 872 H) tentang 'Al-Shifa' oleh Qadi Iyad, di mana ia memperjelas kata-katanya, menjelaskan poin-poin langkanya, dan menyelesaikan masalahnya. Ia merangkum dari komentar Al-Burhan al-Halabi, menambahkannya, dan menyelesaikannya dalam sepuluh hari terakhir Dhu al-Qi'dah pada tahun 847 H; catatan itu dicetak di bagian bawah halaman Al-Shifa."
