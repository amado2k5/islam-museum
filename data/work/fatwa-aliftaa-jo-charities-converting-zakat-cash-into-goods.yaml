id: work/fatwa-aliftaa-jo-charities-converting-zakat-cash-into-goods
class: work
kind: fatwa
label: { ar: "تحويل الجمعيات الخيرية نقود الزكاة إلى خدمات ومواد عينية", en: "Charities converting zakat cash into services and goods", ur: "خیراتی انجمنوں کا زکات کی نقدی کو خدمات اور اشیا میں بدلنا" }
summary:
  ar: "سؤال عن تحويل الجمعيات الخيرية نقود الزكاة إلى خدمات أو مواد عينية كالدواء والطعام، أجابت فيه دائرة الإفتاء العام الأردنية بأن الجمعيات وكيلة عن المزكين فلا يجوز لها ذلك دون إذن الفقير، وأن الاستثناء للدولة إذا جمعت الزكاة وتصرفت بما يحقق مصلحة الفقير مع تمليكه. أجابت الدائرة بأن الزكاة فريضة محددة بالنصوص، وأن تحويل ما يجب تسليمه للفقراء من نقود إلى بضائع ومواد عينية تعدٍّ على أحكامها، ويستثنى من ذلك تصرف ولي الأمر بما يحقق مصلحة معتبرة للفقير مع تمليكه الزكاة. وقالت إن الأصل أن الجمعيات وكيلة عن المزكين في إيصال الزكاة إلى مستحقيها، فلا يجوز لها تحويلها من نقود إلى مواد، لأن المال حق للفقير لا يُتصرف فيه دون إذنه. وقالت إن الدولة إذا جمعت الزكاة فلها أن تحولها من نوع إلى نوع بما يحقق مصلحة الفقير مع تمليكه، لأن جمع الزكاة وتوزيعها من الوظائف العامة المنوطة بها، وتبرأ ذمة المزكي بتسليمها إليها. واستندت في ذلك إلى قول ابن الرفعة في كفاية النبيه إن الزكاة وظيفة كلية أعدت للحاجات العامة، وإلى ما ذكره ابن حجر الهيتمي في تحفة المحتاج من أن قبض الإمام للزكاة يقع بين الولاية المحضة والوكالة، وأن له أن يلزم الفقير بالشراء لمصلحة عامة. وخلصت إلى أنه لا يجوز للجمعيات الخيرية تحويل أموال الزكاة من نوع إلى آخر دون إذن الفقير، وأن الاستثناء خاص بولي الأمر مع تمليك الفقراء ضمن الضوابط المذكورة."
  en: "A question about charities converting zakat cash into services or goods such as medicine and food, in which Jordan's General Iftaa Department answered that charities act as agents of zakat payers and may not do so without the poor recipient's permission, the exception being the state when it collects zakat and acts in the recipient's interest while giving him ownership. The Department answered that zakat is an obligation defined by the texts, and that converting cash due to the poor into goods and in-kind items oversteps its rules, except for actions by the ruler that achieve a recognised interest for the poor while giving them ownership of the zakat. It said charities are in principle agents of zakat payers for delivering zakat to those entitled to it, so they may not convert it from cash into goods, because the money is the right of the poor and cannot be disposed of without their permission. It said that when the state collects zakat it may convert it from one kind to another in the interest of the poor while giving them ownership, because collecting and distributing zakat is a public function entrusted to it, and the payer's obligation is discharged once he hands it over. For this it relied on Ibn al-Rif'a's statement in Kifayat al-Nabih that zakat is a general provision prepared for public needs, and on Ibn Hajar al-Haytami's remark in Tuhfat al-Muhtaj that the ruler's receipt of zakat lies between pure guardianship and agency, and that he may require the poor recipient to buy something for a public interest. It concluded that charities may not convert zakat funds from one kind to another without the poor recipient's permission, and that the exception belongs to the ruler alone, with ownership given to the poor within the stated limits."
  ur: "خیراتی انجمنوں کے زکات کی نقدی کو دوا اور کھانے جیسی خدمات یا اشیا میں بدلنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ انجمنیں زکات دینے والوں کی وکیل ہیں اس لیے فقیر کی اجازت کے بغیر ایسا نہیں کر سکتیں، اور استثنا ریاست کے لیے ہے جب وہ زکات جمع کرے اور فقیر کو مالک بناتے ہوئے اس کے مفاد میں تصرف کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکات نصوص سے متعین فریضہ ہے، اور فقرا کو دی جانے والی نقدی کو سامان اور اشیا میں بدلنا اس کے احکام سے تجاوز ہے، سوائے حکمران کے ایسے تصرف کے جو فقیر کے معتبر مفاد کو پورا کرے اور اسے زکات کا مالک بنائے۔ اس نے کہا کہ اصل یہ ہے کہ انجمنیں زکات مستحقین تک پہنچانے میں زکات دینے والوں کی وکیل ہیں، اس لیے وہ اسے نقدی سے اشیا میں نہیں بدل سکتیں، کیونکہ یہ مال فقیر کا حق ہے جس میں اس کی اجازت کے بغیر تصرف جائز نہیں۔ اس نے کہا کہ جب ریاست زکات جمع کرے تو وہ اسے فقیر کے مفاد میں اور اسے مالک بناتے ہوئے ایک قسم سے دوسری قسم میں بدل سکتی ہے، کیونکہ زکات جمع کرنا اور تقسیم کرنا اس کے سپرد عوامی فریضہ ہے، اور ریاست کو دینے سے زکات دینے والا بری الذمہ ہو جاتا ہے۔ اس کے لیے اس نے کفایۃ النبیہ میں ابن الرفعہ کے اس قول پر انحصار کیا کہ زکات عام ضروریات کے لیے مقرر ایک کلی ذمہ داری ہے، اور ابن حجر الہیتمی کے تحفۃ المحتاج کے اس بیان پر کہ حکمران کا زکات وصول کرنا محض ولایت اور وکالت کے درمیان ہے، اور وہ عام مصلحت کے لیے فقیر کو خریداری کا پابند کر سکتا ہے۔ اس نے نتیجہ نکالا کہ خیراتی انجمنیں فقیر کی اجازت کے بغیر زکات کے مال کو ایک قسم سے دوسری قسم میں نہیں بدل سکتیں، اور یہ استثنا صرف حکمران کے لیے ہے، مذکورہ حدود میں فقرا کو مالک بناتے ہوئے۔"
