id: work/fatwa-aliftaa-jo-charities-converting-zakat-cash-into-goods
class: work
kind: fatwa
label: { ar: "تحويل الجمعيات الخيرية نقود الزكاة إلى خدمات ومواد عينية", en: "Charities converting zakat cash into services and goods", ur: "خیراتی انجمنوں کا زکات کی نقدی کو خدمات اور اشیا میں بدلنا", es: "Organizaciones benéficas que convierten el dinero del zakat en servicios y bienes.", fr: "Des organisations caritatives convertissent l'argent de la zakat en services et en biens" }
summary:
  ar: "سؤال عن تحويل الجمعيات الخيرية نقود الزكاة إلى خدمات أو مواد عينية كالدواء والطعام، أجابت فيه دائرة الإفتاء العام الأردنية بأن الجمعيات وكيلة عن المزكين فلا يجوز لها ذلك دون إذن الفقير، وأن الاستثناء للدولة إذا جمعت الزكاة وتصرفت بما يحقق مصلحة الفقير مع تمليكه. أجابت الدائرة بأن الزكاة فريضة محددة بالنصوص، وأن تحويل ما يجب تسليمه للفقراء من نقود إلى بضائع ومواد عينية تعدٍّ على أحكامها، ويستثنى من ذلك تصرف ولي الأمر بما يحقق مصلحة معتبرة للفقير مع تمليكه الزكاة. وقالت إن الأصل أن الجمعيات وكيلة عن المزكين في إيصال الزكاة إلى مستحقيها، فلا يجوز لها تحويلها من نقود إلى مواد، لأن المال حق للفقير لا يُتصرف فيه دون إذنه. وقالت إن الدولة إذا جمعت الزكاة فلها أن تحولها من نوع إلى نوع بما يحقق مصلحة الفقير مع تمليكه، لأن جمع الزكاة وتوزيعها من الوظائف العامة المنوطة بها، وتبرأ ذمة المزكي بتسليمها إليها. واستندت في ذلك إلى قول ابن الرفعة في كفاية النبيه إن الزكاة وظيفة كلية أعدت للحاجات العامة، وإلى ما ذكره ابن حجر الهيتمي في تحفة المحتاج من أن قبض الإمام للزكاة يقع بين الولاية المحضة والوكالة، وأن له أن يلزم الفقير بالشراء لمصلحة عامة. وخلصت إلى أنه لا يجوز للجمعيات الخيرية تحويل أموال الزكاة من نوع إلى آخر دون إذن الفقير، وأن الاستثناء خاص بولي الأمر مع تمليك الفقراء ضمن الضوابط المذكورة."
  en: "A question about charities converting zakat cash into services or goods such as medicine and food, in which Jordan's General Iftaa Department answered that charities act as agents of zakat payers and may not do so without the poor recipient's permission, the exception being the state when it collects zakat and acts in the recipient's interest while giving him ownership. The Department answered that zakat is an obligation defined by the texts, and that converting cash due to the poor into goods and in-kind items oversteps its rules, except for actions by the ruler that achieve a recognised interest for the poor while giving them ownership of the zakat. It said charities are in principle agents of zakat payers for delivering zakat to those entitled to it, so they may not convert it from cash into goods, because the money is the right of the poor and cannot be disposed of without their permission. It said that when the state collects zakat it may convert it from one kind to another in the interest of the poor while giving them ownership, because collecting and distributing zakat is a public function entrusted to it, and the payer's obligation is discharged once he hands it over. For this it relied on Ibn al-Rif'a's statement in Kifayat al-Nabih that zakat is a general provision prepared for public needs, and on Ibn Hajar al-Haytami's remark in Tuhfat al-Muhtaj that the ruler's receipt of zakat lies between pure guardianship and agency, and that he may require the poor recipient to buy something for a public interest. It concluded that charities may not convert zakat funds from one kind to another without the poor recipient's permission, and that the exception belongs to the ruler alone, with ownership given to the poor within the stated limits."
  ur: "خیراتی انجمنوں کے زکات کی نقدی کو دوا اور کھانے جیسی خدمات یا اشیا میں بدلنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ انجمنیں زکات دینے والوں کی وکیل ہیں اس لیے فقیر کی اجازت کے بغیر ایسا نہیں کر سکتیں، اور استثنا ریاست کے لیے ہے جب وہ زکات جمع کرے اور فقیر کو مالک بناتے ہوئے اس کے مفاد میں تصرف کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکات نصوص سے متعین فریضہ ہے، اور فقرا کو دی جانے والی نقدی کو سامان اور اشیا میں بدلنا اس کے احکام سے تجاوز ہے، سوائے حکمران کے ایسے تصرف کے جو فقیر کے معتبر مفاد کو پورا کرے اور اسے زکات کا مالک بنائے۔ اس نے کہا کہ اصل یہ ہے کہ انجمنیں زکات مستحقین تک پہنچانے میں زکات دینے والوں کی وکیل ہیں، اس لیے وہ اسے نقدی سے اشیا میں نہیں بدل سکتیں، کیونکہ یہ مال فقیر کا حق ہے جس میں اس کی اجازت کے بغیر تصرف جائز نہیں۔ اس نے کہا کہ جب ریاست زکات جمع کرے تو وہ اسے فقیر کے مفاد میں اور اسے مالک بناتے ہوئے ایک قسم سے دوسری قسم میں بدل سکتی ہے، کیونکہ زکات جمع کرنا اور تقسیم کرنا اس کے سپرد عوامی فریضہ ہے، اور ریاست کو دینے سے زکات دینے والا بری الذمہ ہو جاتا ہے۔ اس کے لیے اس نے کفایۃ النبیہ میں ابن الرفعہ کے اس قول پر انحصار کیا کہ زکات عام ضروریات کے لیے مقرر ایک کلی ذمہ داری ہے، اور ابن حجر الہیتمی کے تحفۃ المحتاج کے اس بیان پر کہ حکمران کا زکات وصول کرنا محض ولایت اور وکالت کے درمیان ہے، اور وہ عام مصلحت کے لیے فقیر کو خریداری کا پابند کر سکتا ہے۔ اس نے نتیجہ نکالا کہ خیراتی انجمنیں فقیر کی اجازت کے بغیر زکات کے مال کو ایک قسم سے دوسری قسم میں نہیں بدل سکتیں، اور یہ استثنا صرف حکمران کے لیے ہے، مذکورہ حدود میں فقرا کو مالک بناتے ہوئے۔"
  es: "Ante una pregunta sobre la conversión del dinero del zakat en servicios o bienes, como medicinas y alimentos, por parte de organizaciones benéficas, el Departamento General de Iftaa de Jordania respondió que dichas organizaciones actúan como agentes de los contribuyentes del zakat y no pueden hacerlo sin el permiso del beneficiario, con la excepción del Estado, que recauda el zakat y actúa en interés del beneficiario, otorgándole la propiedad del mismo. El Departamento explicó que el zakat es una obligación definida por los textos sagrados y que la conversión del dinero destinado a los pobres en bienes o artículos en especie contraviene sus normas, salvo en el caso de acciones del gobernante que logren un interés reconocido para los pobres, otorgándoles la propiedad del zakat. Afirmó que, en principio, las organizaciones benéficas son agentes de los contribuyentes del zakat para entregarlo a quienes tienen derecho a él, por lo que no pueden convertirlo de dinero en efectivo a bienes, ya que el dinero pertenece a los pobres y no puede disponerse de él sin su autorización. Se afirmó que cuando el Estado recauda el zakat, puede convertirlo de un tipo a otro en beneficio de los pobres, otorgándoles la propiedad, ya que la recaudación y distribución del zakat es una función pública que le ha sido encomendada, y la obligación del pagador se extingue una vez que lo entrega. Para ello, se basó en la afirmación de Ibn al-Rif'a en Kifayat al-Nabih de que el zakat es una provisión general destinada a las necesidades públicas, y en la observación de Ibn Hajar al-Haytami en Tuhfat al-Muhtaj de que la recepción del zakat por parte del gobernante se sitúa entre la mera tutela y la representación, y que este puede exigir al beneficiario pobre que adquiera algo para el interés público. Se concluyó que las organizaciones benéficas no pueden convertir los fondos del zakat de un tipo a otro sin el permiso del beneficiario pobre, y que la excepción corresponde únicamente al gobernante, otorgándose la propiedad a los pobres dentro de los límites establecidos."
  fr: "Une question concernant la conversion de la zakat en espèces par les organisations caritatives en biens ou services (médicaments, nourriture, etc.) a été posée. Le Département général de la Iftaa de Jordanie a répondu que les organisations caritatives agissent en tant que mandataires des cotisants et ne peuvent procéder à une telle conversion sans l'accord du bénéficiaire pauvre. L'État fait exception lorsqu'il collecte la zakat et agit dans l'intérêt du bénéficiaire en lui en conférant la propriété. Le Département a précisé que la zakat est une obligation définie par les textes sacrés et que la conversion des sommes dues aux pauvres en biens ou en nature constitue une violation de ses règles, sauf dans le cas d'actions entreprises par le souverain qui servent un intérêt reconnu des pauvres tout en leur conférant la propriété de la zakat. Il a ajouté que les organisations caritatives sont, par principe, les mandataires des cotisants chargés de distribuer la zakat aux personnes qui y ont droit. Elles ne peuvent donc pas la convertir en biens, car cet argent appartient aux pauvres et ne peut être disposé sans leur consentement. Il a été établi que lorsque l'État perçoit la zakat, il peut la convertir d'une forme à une autre dans l'intérêt des pauvres, tout en leur en conférant la propriété. En effet, la collecte et la distribution de la zakat constituent une fonction publique qui lui est confiée, et l'obligation du payeur est remplie dès lors qu'il la remet. Cette position s'appuie sur l'affirmation d'Ibn al-Rif'a dans Kifayat al-Nabih, selon laquelle la zakat est une provision générale destinée à répondre aux besoins publics, ainsi que sur la remarque d'Ibn Hajar al-Haytami dans Tuhfat al-Muhtaj, selon laquelle la perception de la zakat par le souverain se situe entre la simple tutelle et le mandat, et que ce dernier peut exiger du bénéficiaire pauvre qu'il acquière un bien d'intérêt public. Il en ressort que les œuvres caritatives ne peuvent convertir les fonds de la zakat d'une forme à une autre sans l'autorisation du bénéficiaire pauvre, et que cette exception relève exclusivement du souverain, la propriété étant transférée aux pauvres dans les limites fixées."
