summary:
  ar: "كتاب البديع، كتاب في البلاغة لمؤلفه عبد الله بن المعتز، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: 888م; ت 908م {cite:wikipedia-en-abdallah-ibn-al-mutazz}. وجواب الملخص عن وجوده في المكتبة الشاملة: نعم، والكتاب في المكتبة الشاملة: Book 11661 {cite:shamela-ws-book-11661}. لم يقرأ المتحف الكتاب."
  en: "Kitab al-Badi, a book on rhetoric (balagha) by Abd Allah ibn al-Mu'tazz; its date in a research summary supplied to the museum is 888 CE; d. 908 CE {cite:wikipedia-en-abdallah-ibn-al-mutazz}. The summary's answer on its presence in the Shamela library: Yes, the book is in the Shamela library: Book 11661 {cite:shamela-ws-book-11661}. The museum has not read the book."
  ur: "كتاب البديع، بلاغت پر ایک کتاب، مصنف عبد الله بن المعتز؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: 888ء; وفات 908ء {cite:wikipedia-en-abdallah-ibn-al-mutazz}۔ شاملہ میں موجودگی پر خلاصے کا جواب: جی ہاں، کتاب المکتبۃ الشاملہ میں ہے: Book 11661 {cite:shamela-ws-book-11661}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "Kitab al-Badi, livre sur la rhétorique (balagha) de Abd Allah ibn al-Mu'tazz ; sa date dans une synthèse de recherche remise au musée : 888; m. 908 {cite:wikipedia-en-abdallah-ibn-al-mutazz}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Oui, le livre figure dans la bibliothèque Shamela : Book 11661 {cite:shamela-ws-book-11661}. Le musée n'a pas lu le livre."
  es: "Kitab al-Badi, libro sobre retórica (balagha) de Abd Allah ibn al-Mu'tazz; su fecha en un resumen de investigación entregado al museo: 888; m. 908 {cite:wikipedia-en-abdallah-ibn-al-mutazz}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: Sí, el libro está en la biblioteca Shamela: Book 11661 {cite:shamela-ws-book-11661}. El museo no ha leído el libro."
