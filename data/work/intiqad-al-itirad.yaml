summary:
  ar: "كتاب بدأه ابن حجر العسقلاني في دفع اعتراضات العيني في «عمدة القاري» على «فتح الباري»، فكتب الاعتراضات وترك تحتها بياضاً ليجيب عنها، ثم توفي ولم يجب عن غالبها، كما تذكر الترجمة المطبوعة مع عمدة القاري {cite:umdat-qari-ilmiyya-2001-v1 p. 16}."
  en: "A book Ibn Hajar al-'Asqalani began in answer to al-'Ayni's objections, in 'Umdat al-Qari, to Fath al-Bari: he copied out the objections and left blank space beneath them for his replies, but died without answering most of them, according to the biography printed with 'Umdat al-Qari {cite:umdat-qari-ilmiyya-2001-v1 p. 16}."
  ur: "ابن حجر عسقلانی کی شروع کی ہوئی کتاب جو «عمدۃ القاری» میں «فتح الباری» پر عینی کے اعتراضات کے جواب میں تھی: انہوں نے اعتراضات لکھے اور جواب کے لیے نیچے جگہ خالی چھوڑی، مگر اکثر کا جواب دیے بغیر وفات پا گئے، جیسا کہ عمدۃ القاری کے ساتھ چھپا ترجمہ بتاتا ہے {cite:umdat-qari-ilmiyya-2001-v1 p. 16}۔"
  es: "Un libro que Ibn Hajar al-'Asqalani comenzó en respuesta a las objeciones de al-'Ayni, en 'Umdat al-Qari, a Fath al-Bari: copió las objeciones y dejó un espacio en blanco debajo de ellas para sus respuestas, pero murió sin responder a la mayoría de ellas, según la biografía impresa con 'Umdat al-Qari {cite:umdat-qari-ilmiyya-2001-v1 p. 16}."
  fr: "Un livre qu'Ibn Hajar al-'Asqalani a commencé en réponse aux objections d'al-'Ayni, dans 'Umdat al-Qari, à Fath al-Bari: il a recopié les objections et a laissé un espace vide en dessous pour ses réponses, mais est mort sans répondre à la plupart d'entre elles, selon la biographie imprimée avec 'Umdat al-Qari {cite:umdat-qari-ilmiyya-2001-v1 p. 16}."
  tr: "İbn Hajar el-Askelani tarafından, 'Umdat al-Qari'de al-'Ayni'nin 'Feth al-Bari' üzerindeki itirazlarını çürütmek için başlattığı bir kitap. İtirazları yazdı ve altına boş bir not bırakarak cevap verdi, sonra öldü ve çoğuna yanıt vermedi; basılı biyografide 'Umdat al-Qari' {cite:umdat-qari-ilmiyya-2001-v1 s. 16}"
  id: "Sebuah buku yang dimulai oleh Ibn Hajar al-Asqalani yang membantah keberatan al-'Ayni dalam 'Umdat al-Qari' tentang 'Fath al-Bari'. Ia menulis keberatan dan meninggalkan catatan kosong di bawahnya untuk menjawab, lalu ia meninggal dan tidak menanggapi sebagian besar keberatan, seperti yang disebutkan dalam biografi cetak bersama 'Umdat al-Qari' {cite:umdat-qari-ilmiyya-2001-v1 hlm. 16}."
