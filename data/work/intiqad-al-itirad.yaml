summary:
  ar: "كتاب بدأه ابن حجر العسقلاني في دفع اعتراضات العيني في «عمدة القاري» على «فتح الباري»، فكتب الاعتراضات وترك تحتها بياضاً ليجيب عنها، ثم توفي ولم يجب عن غالبها، كما تذكر الترجمة المطبوعة مع عمدة القاري {cite:umdat-qari-ilmiyya-2001-v1 p. 16}."
  en: "A book Ibn Hajar al-'Asqalani began in answer to al-'Ayni's objections, in 'Umdat al-Qari, to Fath al-Bari: he copied out the objections and left blank space beneath them for his replies, but died without answering most of them, according to the biography printed with 'Umdat al-Qari {cite:umdat-qari-ilmiyya-2001-v1 p. 16}."
  ur: "ابن حجر عسقلانی کی شروع کی ہوئی کتاب جو «عمدۃ القاری» میں «فتح الباری» پر عینی کے اعتراضات کے جواب میں تھی: انہوں نے اعتراضات لکھے اور جواب کے لیے نیچے جگہ خالی چھوڑی، مگر اکثر کا جواب دیے بغیر وفات پا گئے، جیسا کہ عمدۃ القاری کے ساتھ چھپا ترجمہ بتاتا ہے {cite:umdat-qari-ilmiyya-2001-v1 p. 16}۔"
