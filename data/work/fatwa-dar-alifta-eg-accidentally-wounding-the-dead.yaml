id: work/fatwa-dar-alifta-eg-accidentally-wounding-the-dead
class: work
kind: fatwa
label: { ar: "حكم التسبب في جرح الميت عن طريق الخطأ", en: "Accidentally wounding the deceased during washing", ur: "غسل کے دوران میت کو غلطی سے زخمی کرنا", es: "Herir accidentalmente al fallecido durante el lavado" }
summary:
  ar: "سائل سأل عن امرأة جرحت يد متوفاة دون قصد منها عند تغسيلها ونزع الخاتم من يدها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21637)⁩ أن ما صدر عن المرأة المذكورة من جرحها ليد المتوفاة دون قصد منها لا إثم عليها فيه على ما فصّل الجواب."
  en: "A questioner asked about a woman who unintentionally wounded the deceased's hand while washing her and removing her ring. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21637) answered that what issued from the woman — wounding the hand without intent — carries no sin upon her, as the answer details."
  ur: "ایک سائل نے ایک عورت کے بارے میں پوچھا جس نے غسل کے دوران انگوٹھی اتارتے وقت بے قصد میت کے ہاتھ کو زخمی کر دیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21637)⁩ نے جواب دیا کہ بے قصد صادر ہونے والے اس فعل میں عورت پر کوئی گناہ نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre una mujer que, sin querer, hirió la mano de la fallecida mientras la lavaba y le quitaba el anillo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21637) respondió que la acción de la mujer —herir la mano sin intención— no conlleva pecado alguno, como se detalla en la respuesta."
