id: work/fatwa-dar-alifta-eg-recalling-loan-before-agreed-term
class: work
kind: fatwa
label: { ar: "حكم استرداد العارية قبل انتهاء المدة المتفق عليها", en: "Recalling a lent item before the agreed term ends", ur: "مقررہ مدت سے پہلے عاریت واپس لینا", es: "Recuperación de un artículo prestado antes de que finalice el plazo acordado.", fr: "Rappel d'un objet prêté avant la fin de la période convenue", tr: "Kararlaştırılan süre bitmeden çıplak mülkün geri alınmasına ilişkin karar", id: "Putusan tentang pengambilan kembali properti telanjang sebelum masa yang disepakati berakhir" }
summary:
  ar: "سائل سأل عن استرداد العارية ⁦(سيارة)⁩ قبل انتهاء المدة المتفق عليها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20667)⁩ أنه لا يحق للمستعير الامتناع عن تسليم السيارة لصاحبها ولا يلزم المعير انتظار مضي مدة العارية على ما فصّل الجواب."
  en: "A questioner asked about recalling a lent car before the agreed term ends. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20667) answered that the borrower may not refuse to hand it over and the lender need not wait out the term — as the answer details."
  ur: "ایک سائل نے مقررہ مدت سے پہلے عاریت لی ہوئی گاڑی واپس لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20667)⁩ نے جواب دیا کہ عاریت لینے والا انکار نہیں کر سکتا اور مدت کا انتظار لازم نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de recuperar un automóvil prestado antes de que finalice el plazo acordado. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20667) respondió que el prestatario no puede negarse a devolverlo y que el prestamista no tiene por qué esperar a que finalice el plazo, tal como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la possibilité de reprendre possession d'un véhicule prêté avant la fin du contrat. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20667) a répondu que l'emprunteur ne peut refuser de restituer le véhicule et que le prêteur n'est pas tenu d'attendre l'échéance du prêt, comme le précise la réponse."
  tr: "Bir soru soran kişi, ödünç alınan aracın kararlaştırılan süreden önce iadesi hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20667), borçlunun aracı sahibine iade etmeyi reddetme hakkı olmadığını ve borçlunun kredi süresini geçmesini beklemek zorunda olmadığını yanıtladı; bu cevapta detaylandırılmıştır."
  id: "Seorang penanya menanyakan tentang pengembalian mobil pinjaman sebelum periode yang disepakati. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20667) menjawab bahwa peminjam tidak berhak menolak mengembalikan mobil kepada pemiliknya, dan peminjam tidak diwajibkan menunggu peminjam melewati masa pinjaman, sebagaimana dijelaskan dalam jawaban."
