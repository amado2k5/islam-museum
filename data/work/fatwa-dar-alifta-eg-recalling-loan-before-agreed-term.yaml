summary:
  ar: "سائل سأل عن استرداد العارية ⁦(سيارة)⁩ قبل انتهاء المدة المتفق عليها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20667)⁩ أنه لا يحق للمستعير الامتناع عن تسليم السيارة لصاحبها ولا يلزم المعير انتظار مضي مدة العارية على ما فصّل الجواب."
  en: "A questioner asked about recalling a lent car before the agreed term ends. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20667) answered that the borrower may not refuse to hand it over and the lender need not wait out the term — as the answer details."
  ur: "ایک سائل نے مقررہ مدت سے پہلے عاریت لی ہوئی گاڑی واپس لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20667)⁩ نے جواب دیا کہ عاریت لینے والا انکار نہیں کر سکتا اور مدت کا انتظار لازم نہیں — جیسا کہ جواب میں تفصیل ہے۔"
