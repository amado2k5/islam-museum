id: work/fatwa-amja-the-balance-scales
class: work
kind: fatwa
label: { ar: "الميزان يوم القيامة", en: "The Balance on Judgment Day — one scale or two", ur: "قیامت میں ترازو — ایک یا دو", es: "La balanza en el Día del Juicio Final: una balanza o dos", fr: "L'équilibre au jour du jugement dernier — une balance ou deux", tr: "Kıyamet Günü'ndeki terazi", id: "Timbangan pada Hari Penghakiman" }
summary:
  ar: "سأل سائل هل الميزان واحد أو ميزانان وهل له كفتان ولسان وما تفسير آية ونضع الموازين القسط ليوم القيامة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21574 بتاريخ 8 أبريل 2008)⁩ أن أهل السنة يؤمنون بأن الميزان الذي ينصب يوم القيامة وتوزن به الحسنات والسيئات حق وله كفتان توضع على إحداهما الحسنات وعلى الأخرى السيئات توزن بهما صحائف الأعمال وهو ميزان يزن بمثاقيل الذر فمن يعمل مثقال ذرة خيرًا يره ومن يعمل مثقال ذرة شرًا يره، قال تعالى ونضع الموازين القسط ليوم القيامة فلا تظلم نفس شيئًا وإن كان مثقال حبة من خردل أتينا بها وكفى بنا حاسبين."
  en: "A questioner asked whether the Balance is one or two, whether it has two pans and a tongue, and the meaning of 'We set the just balances for Judgment Day — no soul is wronged at all'. Dr. Salah al-Sawi (fatwa no. 21574, 8 April 2008) answered that the Sunnis believe the balance set on Judgment Day — by which good and evil deeds are weighed — is real, with two pans: good deeds on one, evil on the other, the deeds' records weighed between them, a balance weighing to a gnat's weight — 'whoever does an atom's weight of good will see it, and whoever does an atom's weight of evil will see it'; and the verse 'though it be a mustard-seed's weight, We bring it; sufficient are We as reckoners'."
  ur: "ایک سائل نے ترازو کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21574، 8 اپریل 2008)⁩ کے مطابق اہل سنت کے نزدیک ترازو حقیقی ہے جس کی دو پلڑے ہیں — نیکیاں ایک طرف اور بائیاں دوسری طرف — رائی کے دانے کے برابر بھی تولا جائے گا۔"
  es: "Un interlocutor preguntó si la Balanza es una o dos, si tiene dos platillos y una lengua, y el significado de «Establecemos balanzas justas para el Día del Juicio: ninguna alma es perjudicada en absoluto». El Dr. Salah al-Sawi (fatwa n.º 21574, 8 de abril de 2008) respondió que los sunitas creen que la balanza establecida el Día del Juicio —con la que se pesan las buenas y las malas acciones— es real, con dos platillos: las buenas acciones en uno, las malas en el otro, y los registros de las acciones se pesan entre ellos, una balanza que pesa hasta el peso de un mosquito: «quien haga el peso de un átomo de bien lo verá, y quien haga el peso de un átomo de mal lo verá»; y el versículo «aunque sea el peso de una semilla de mostaza, Nosotros lo traemos; Nosotros somos suficientes como contadores»."
  fr: "Un internaute a demandé si la Balance est unique ou double, si elle possède deux plateaux et une langue, et quelle est la signification du verset: « Nous établissons les justes balances pour le Jour du Jugement; nul n’est lésé. » Le Dr Salah al-Sawi (fatwa n° 21574, 8 avril 2008) a répondu que les sunnites croient que la balance établie le Jour du Jugement — par laquelle les bonnes et les mauvaises actions sont pesées — est réelle, avec deux plateaux: les bonnes actions sur l’un, les mauvaises sur l’autre, les registres des actions pesés entre eux, une balance d’une précision extrême — « Quiconque accomplit le bien, même d’un poids infime, le verra, et quiconque accomplit le mal, même d’un poids infime, le verra »; et le verset: « Même si ce n’est que le poids d’une graine de moutarde, Nous l’apportons; Nous suffisons comme juges. »"
  tr: "Bir soruya soran kişiye şöyle soruldu: Terazi bir mi yoksa iki mi? İki terazisi ve dili var mı? Ayetin yorumu nedir? Ve Kıyamet Günü için adalet terazilerini belirliyoruz. Dr. Salah Al-Sawi (8 Nisan 2008 tarihli 21574 sayılı fetva) Ahl-sünnet'in Diriliş Günü'nde kurulan ve iyi ile kötü işlerin tartıldığı terazinin doğru olduğuna inandığını yanıtladı. İki terazisi vardır, biri iyi işlerle, diğeri kötü işlerle. Bir atomun ağırlığıyla tartılan bir tartıdır. Bir atom ağırlığında iyilik yapan onu görür, kim bir atom ağırlığı kötülük yaparsa görür. Yüce Allah şöyle dedi: Ve Kıyamet Günü için adalet terazilerini kurduk, böylece hiçbir ruh, hardal çekirdeği kadar bile olsa kötülmesin. Onu getiriyoruz. Ve biz muhasebeci olarak yeterliyiz."
  id: "Seorang penanya ditanya: Apakah timbangan itu satu atau dua? Apakah itu memiliki dua timbangan dan satu lidah? Apa penafsiran ayat itu? Dan kami menetapkan timbangan keadilan untuk Hari Penghakiman. Dr. Salah Al-Sawi menjawab (Fatwa No. 21574 tanggal 8 April 2008) bahwa Ahl al-Sunnah percaya bahwa timbangan yang didirikan pada Hari Kebangkitan dan yang digunakan untuk menimbang perbuatan baik dan buruk adalah benar. Timbangan ini memiliki dua timbangan, satu dengan perbuatan baik dan satu lagi dengan perbuatan buruk. Itu adalah timbangan yang ditimbang dengan berat atom. Siapa pun yang melakukan berat atom yang baik akan melihatnya, dan siapa pun melakukan berat atom yang jahat akan melihatnya. Allah yang Maha Tinggi berfirman: Dan Kami mendirikan timbangan keadilan untuk Hari Kebangkitan, sehingga tidak ada jiwa yang akan dirugikan sedikit pun, meskipun beratnya sebiji biji sawi. Kami membawanya masuk. Dan cukuplah Kami sebagai Akuntan."
