id: work/fatwa-aliftaa-jo-a-driver-taking-paid-fares-during-work
class: work
kind: fatwa
label: { ar: "نقل السائق ركابًا بأجرة لحسابه أثناء العمل", en: "A driver carrying paying passengers for himself during work", ur: "کام کے دوران ڈرائیور کا اپنے لیے کرایہ پر سواریاں لے جانا" }
summary:
  ar: "سؤال عن سائق مؤسسة كُلف بعمل خارجها فنقل أشخاصًا بأجرة لمصلحته، أجابت فيه دائرة الإفتاء العام الأردنية بأن ما كسبه بسيارة المؤسسة دون إذن سحت يجب رده، وأن ما كسبه بسيارته في ساعات الدوام يُحسب مقابله من راتبه ويُتصدق به. أجابت الدائرة بأن الموظف أجير مؤتمن على ما في يده، ومقتضى الأمانة ألا ينتفع لنفسه إلا بما تعاقد عليه مع صاحب العمل، ونقلت عن القرطبي في تفسيره أن الأمانة تعم وظائف الدين. وقالت إنه إن استعمل سيارة المؤسسة فلا يجوز ذلك إلا وفق تعليماتها أو بإذن صريح منها، وما حصّله من الاستعمال غير المأذون سحت يجب رده لصاحب العمل، فإن تعذر الرد تصدق به. وإن استعمل سيارته الخاصة فعليه مراعاة التعليمات المنظمة لذلك، ولا يجوز له استغلال ساعات الدوام لأغراض خاصة، فإن فعل وجب عليه أن يحسب من راتبه ما يقابل الساعات التي شغلها بعمله الخاص ويتصدق به، لأنه استثمر وقت العمل في ربحه الشخصي."
  en: "A question about an organisation's driver sent on a job outside it who carried people for a fare for his own benefit, in which Jordan's General Iftaa Department answered that what he earned with the organisation's car without permission is unlawful gain to be returned, and that if he used his own car during working hours he must calculate the matching share of his salary and give it in charity. The Department answered that an employee is a hired worker entrusted with what is in his hands, and trust requires that he take no benefit for himself beyond what he contracted for with his employer; it quoted al-Qurtubi's commentary that trust covers all religious duties. It said that if he used the organisation's car, this is allowed only under its rules or with its explicit permission, and what he earned from unauthorised use is unlawful gain that must be returned to the employer, or given in charity if it cannot be returned. If he used his own car, he must keep the rules on such use, and he may not use working hours for private purposes; if he did, he must calculate the part of his salary matching the hours he spent on his own work and give it in charity, since he used work time for personal profit."
  ur: "ایک ادارے کے ڈرائیور کے بارے میں سوال جسے ادارے سے باہر کام پر بھیجا گیا اور اس نے اپنے فائدے کے لیے کرایہ پر لوگوں کو پہنچایا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ادارے کی گاڑی سے بغیر اجازت کمائی ناجائز ہے جسے لوٹانا واجب ہے، اور اگر اس نے ڈیوٹی کے اوقات میں اپنی گاڑی استعمال کی تو تنخواہ کا متعلقہ حصہ حساب کر کے صدقہ کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ ملازم ایک اجیر ہے جو اپنے ہاتھ کی چیزوں کا امین ہے، اور امانت کا تقاضا ہے کہ وہ آجر سے طے شدہ چیز کے سوا اپنے لیے کوئی فائدہ نہ اٹھائے؛ اس نے قرطبی کی تفسیر سے نقل کیا کہ امانت دین کے تمام فرائض کو شامل ہے۔ اس نے کہا کہ اگر اس نے ادارے کی گاڑی استعمال کی تو یہ صرف ادارے کی ہدایات کے مطابق یا اس کی صریح اجازت سے جائز ہے، اور بغیر اجازت استعمال سے جو کمایا وہ ناجائز ہے جسے آجر کو لوٹانا واجب ہے، اور لوٹانا ممکن نہ ہو تو صدقہ کرے۔ اگر اس نے اپنی ذاتی گاڑی استعمال کی تو اسے متعلقہ ہدایات کی پابندی کرنی چاہیے، اور وہ ڈیوٹی کے اوقات کو ذاتی مقاصد کے لیے استعمال نہیں کر سکتا؛ اگر ایسا کیا تو اپنے ذاتی کام میں صرف ہونے والے گھنٹوں کے مقابل تنخواہ کا حصہ حساب کر کے صدقہ کرے، کیونکہ اس نے کام کا وقت ذاتی نفع میں لگایا۔"
