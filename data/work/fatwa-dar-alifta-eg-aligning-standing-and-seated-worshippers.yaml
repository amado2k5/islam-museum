label: { ar: "كيفية المساواة في الصف بين المصلي قائمًا والجالس على الكرسي", en: "Levelling the row between a standing worshipper and one on a chair", ur: "کھڑے اور کرسی پر بیٹھے نمازی کی صف میں برابری کیسے ہو", es: "Nivelar la fila entre un fiel de pie y uno sentado en una silla.", fr: "Égaliser la rangée entre un fidèle debout et un autre assis sur une chaise" }
summary:
  ar: "سائل سأل عن كيفية المساواة في الصف بين من يصلي قائمًا ومن يصلي جالسًا على الكرسي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21716)⁩ أن الاعتبار في الجالس على الكرسي بحسب عذره — إن كان جلوسه عند الركوع أو السجود مع قدرته على القيام فله حكم وإن كان جلوسه مطلقًا فله حكم آخر بيّنه الجواب."
  en: "A questioner asked how to level the row between one praying standing and one praying seated on a chair. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21716) answered that it depends on the seated worshipper's excuse — seated only at bowing and prostration though able to stand carries one ruling; seated throughout carries another, as the answer sets out."
  ur: "ایک سائل نے کھڑے اور کرسی پر بیٹھے نمازی کی صف برابر کرنے کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21716)⁩ نے جواب دیا کہ یہ اس کے عذر پر منحصر ہے — صرف رکوع و سجود میں بیٹھنے والے کا ایک حکم اور ہمیشہ بیٹھنے والے کا دوسرا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó cómo conciliar la postura de quien reza de pie con la de quien reza sentado en una silla. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21716) respondió que depende de la justificación del fiel sentado: sentarse solo para inclinarse y postrarse, aunque pueda ponerse de pie, conlleva una norma; sentarse durante toda la oración conlleva otra, como se explica en la respuesta."
  fr: "Un internaute a demandé comment trancher entre une personne priant debout et une autre priant assise sur une chaise. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21716) a répondu que cela dépend de l'excuse du fidèle assis: être assis uniquement pour s'incliner et se prosterner, bien qu'il puisse se tenir debout, relève d'une règle; rester assis tout au long de la prière relève d'une autre règle, comme l'explique la réponse."
