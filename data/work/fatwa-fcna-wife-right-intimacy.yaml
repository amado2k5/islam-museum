label: { ar: "حق الزوجة في المعاشرة الزوجية", en: "A Wife's Right to Intimacy in Marriage", ur: "بیوی کا ازدواجی حقِ معاشرت" }
summary:
  ar: "سؤال: هل للزوجة حق في المعاشرة من زوجها؟ أجاب المجلس الفقهي لأمريكا الشمالية ⁦(بقلم الشيخ عمر خان ود. تسنيم الكيك، نُشر بتاريخ 13 أكتوبر 2026)⁩ بنعم: فالمعاشرة حق للزوجة على زوجها كما هي حق للزوج على زوجته، وعلى كل من الزوجين الوفاء به على النحو الذي ينصه الفتوى، وعرض الجواب أدلة الحق المتبادل بين الزوجين."
  en: "A question: does a wife have a right to intimacy from her husband? The Fiqh Council of North America (by Shaykh Umer Khan and Dr. Tesneem Alkiek, published 13 October 2026) answered yes: intimacy is a right of the wife over her husband just as it is a right of the husband over his wife, and each spouse must fulfil it in the manner the fatwa sets out; the answer marshals the evidence for the spouses' mutual right."
  ur: "سوال: کیا بیوی کو شوہر سے معاشرت کا حق ہے؟ فقہ کونسل آف نارتھ امریکہ ⁦(شیخ عمر خان اور ڈاکٹر تسنیم الکیک، شائع شدہ 13 اکتوبر 2026)⁩ نے جواب دیا ہاں: معاشرت بیوی کا شوہر پر حق ہے جیسے شوہر کا بیوی پر، اور دونوں میاں بیوی پر لازم ہے کہ اسے فتوے کے بیان کردہ طریقے سے ادا کریں؛ جواب میں میاں بیوی کے باہمی حق کی ادلہ پیش کی گئی۔"
