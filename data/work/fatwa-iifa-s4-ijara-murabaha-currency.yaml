label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن التأجير المنتهي بالتمليك والمرابحة للآمر بالشراء وتغيير قيمة العملة", en: "IIFA resolution on lease-ending-in-ownership, murabaha to the purchase-orderer, and currency-value change", ur: "اکیڈمی کی قرارداد: ملکیتی کرایہ، مرابحہ، اور قدر کرنسی", es: "Resolución de la IIFA sobre la finalización del arrendamiento en propiedad, el murabaha al comprador y el cambio de valor de la moneda.", fr: "Résolution de l'IIFA sur la résiliation du bail avec transfert de propriété, la murabaha au donneur d'ordre et la variation du taux de change", tr: "Uluslararası İslami Fiqh Akademisi'nin mülkiyet ile sona eren kiralama kararı, satın alma emri veren ve para birimi değerini değiştiren kişi için Murabaha", id: "Keputusan Akademi Fiqh Islam Internasional mengenai penyewaan yang berakhir dengan kepemilikan dan Murabaha untuk yang memerintahkan pembelian serta mengubah nilai mata uang" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩: تأجيل النظر في التأجير المنتهي بالتمليك والمرابحة للآمر بالشراء والبت في تغير قيمة النقد إلى الدورة القادمة للحاجة إلى استيفاء جوانبها، وتكليف الأمانة العامة استيفاء دراستها واستحضار ما قدم من أبحاث."
  en: "IIFA's fourth-session resolution (Jeddah, February 1988): it deferred rulings on lease-ending-in-ownership (ijara muntahiya bi-l-tamlik), murabaha to the purchase-orderer, and the change of currency value to the next session for fuller study, tasking the secretariat with completing the research."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد ⁦(جدہ، فروری 1988ء)⁩: کرایہ بہ تملیک، مرابحہ اور قدر کرنسی کے تین موضوعات مکمل تحقیق کے لیے اگلی مجلس تک مؤخر۔"
  es: "Resolución de la cuarta sesión de la IIFA (Yeda, febrero de 1988): aplazó las decisiones sobre la finalización del arrendamiento con opción a compra (ijara muntahiya bi-l-tamlik), la murabaha al comprador y el cambio del valor de la moneda hasta la siguiente sesión para un estudio más exhaustivo, encargando a la secretaría la realización de la investigación."
  fr: "Résolution de la quatrième session de l'IIFA (Djeddah, février 1988): elle a reporté à la session suivante, pour une étude plus approfondie, les décisions concernant la fin de bail en propriété (ijara muntahiya bi-l-tamlik), la murabaha au donneur d'ordre et le changement de valeur de la monnaie, chargeant le secrétariat de mener à bien les recherches."
  tr: "Uluslararası İslami Fiqh Akademisi'nin dördüncü oturumunda (Cidde, Şubat 1988) kararı: Alıcı için mülkiyet ve murabaha ile sona eren kira sözleşmelerinin değerlendirilmesinin ertelenmesi, nakit değerindeki değişikliklerin bir sonraki oturuma karar verilmesi, bunun yönlerinin yerine getirilmesi gerekliliği nedeniyle ve Genel Sekreterliğin çalışmayı tamamlayıp sunulan araştırmayı dikkate alması için görevlendirilmesi."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi keempatnya (Jeddah, Februari 1988): Penundaan pertimbangan sewa yang berakhir dengan kepemilikan dan murabaha bagi pembeli, serta memutuskan perubahan nilai uang tunai ke sesi berikutnya karena kebutuhan memenuhi aspeknya, serta menugaskan Sekretariat Jenderal untuk menyelesaikan studi dan mempertimbangkan penelitian yang diajukan."
