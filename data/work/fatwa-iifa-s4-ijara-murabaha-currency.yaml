summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩: تأجيل النظر في التأجير المنتهي بالتمليك والمرابحة للآمر بالشراء والبت في تغير قيمة النقد إلى الدورة القادمة للحاجة إلى استيفاء جوانبها، وتكليف الأمانة العامة استيفاء دراستها واستحضار ما قدم من أبحاث."
  en: "IIFA's fourth-session resolution (Jeddah, February 1988): it deferred rulings on lease-ending-in-ownership (ijara muntahiya bi-l-tamlik), murabaha to the purchase-orderer, and the change of currency value to the next session for fuller study, tasking the secretariat with completing the research."
