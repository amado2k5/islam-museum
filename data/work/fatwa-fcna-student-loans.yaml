label: { ar: "القروض الدراسية بالربا في الولايات المتحدة", en: "Interest-Bearing Student Loans in the United States", ur: "امریکہ میں سودی طلبہ قرضے", es: "Préstamos estudiantiles con intereses en los Estados Unidos", fr: "Prêts étudiants à intérêt aux États-Unis", tr: "Amerika Birleşik Devletleri'nde Faiz Bahalı Öğrenci Kredileri", id: "Pinjaman Mahasiswa Riba di Amerika Serikat" }
summary:
  ar: "سؤال: هل يجوز للطالب المسلم في أمريكا أن يأخذ قرضًا دراسيًا بالربا لدفع كلفة التعليم العالي؟ أجاب المجلس الفقهي لأمريكا الشمالية ⁦(نُشر بتاريخ 7 أكتوبر 2026)⁩ أن الاقتراض بالربا محرم ولا يرفع إثمه إلا الضرورة، وأن المجلس يرى التعليم العالي حاجة عامة؛ وتناول الجواب بالتفصيل ما إذا كانت حاجة الطالب ترقى إلى مستوى الضرورة التي ترخص في الربا."
  en: "A question: may a Muslim student in America take an interest-bearing loan to pay for higher education? The Fiqh Council of North America (published 7 October 2026) answered that borrowing with interest is prohibited and only necessity lifts its sin; the Council holds that higher education is a general need, and the answer examines in detail whether a student's need rises to the level of necessity that licenses riba."
  ur: "سوال: کیا امریکہ میں مسلمان طالب علم اعلیٰ تعلیم کی فیس کے لیے سودی قرض لے سکتا ہے؟ فقہ کونسل آف نارتھ امریکہ ⁦(شائع شدہ 7 اکتوبر 2026)⁩ نے جواب دیا کہ سود پر قرض لینا حرام ہے اور صرف ضرورت اس کا گناہ اٹھاتی ہے؛ کونسل کے مطابق اعلیٰ تعلیم ایک عام ضرورت ہے، اور جواب میں تفصیل سے دیکھا گیا کہ آیا طالب علم کی ضرورت اس درجے کی ضرورت ہے جو سود کی رخصت دیتی ہے۔"
  es: "Una pregunta: ¿puede un estudiante musulmán en Estados Unidos obtener un préstamo con intereses para pagar sus estudios superiores? El Consejo de Jurisprudencia Islámica de Norteamérica (publicado el 7 de octubre de 2026) respondió que pedir préstamos con intereses está prohibido y que solo la necesidad justifica su pecado; el Consejo sostiene que la educación superior es una necesidad general, y la respuesta examina en detalle si la necesidad del estudiante alcanza el nivel de necesidad que permite la usura (riba)."
  fr: "Question: Un étudiant musulman américain peut-il contracter un prêt à intérêt pour financer ses études supérieures ? Le Conseil de jurisprudence islamique d’Amérique du Nord (publication du 7 octobre 2026) a répondu que les emprunts à intérêt sont interdits et que seule la nécessité justifie leur utilisation abusive. Le Conseil considère que l’enseignement supérieur est un besoin fondamental et examine en détail si le besoin de l’étudiant atteint le seuil de nécessité autorisant l’usure (riba)."
  tr: "Soru: Amerika'da bir Müslüman öğrencinin yükseköğretimi finanse etmek için tefeci öğrenci kredisi alması mümkün müdür? Kuzey Amerika Hukuk Konseyi (7 Ekim 2026'da yayımlandı), tefecilikle borç almanın yasak olduğunu ve sadece gerektiğinde günahını ortadan kaldırdığını yanıtladı; konseyin yükseköğretimi kamu ihtiyacı olarak gördüğünü; öğrencinin ihtiyacının, tefeciliğe izin veren zorunluluk seviyesini karşılayıp karşılamadığını detaylandırdı."
  id: "Pertanyaan: Apakah diperbolehkan bagi mahasiswa Muslim di Amerika untuk mengambil pinjaman mahasiswa dengan riba untuk membayar pendidikan tinggi? Dewan Yurisprudensi Amerika Utara (diterbitkan pada 7 Oktober 2026) menjawab bahwa meminjam dengan riba dilarang dan hanya menghilangkan dosanya jika diperlukan, dan bahwa dewan memandang pendidikan tinggi sebagai kebutuhan publik; dewan tersebut merinci apakah kebutuhan mahasiswa memenuhi tingkat kebutuhan yang memungkinkan riba."
