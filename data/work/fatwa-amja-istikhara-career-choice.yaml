label: { ar: "الاستخارة ومشيئة العبد في الاختيار", en: "Istikhara and the servant's will in choosing a path", ur: "استخارہ اور بندے کا انتخاب", es: "Istikhara y la voluntad del sirviente al elegir un camino.", fr: "Istikhara et la volonté du serviteur dans le choix d'une voie", tr: "İstikhara'nın ve Hizmetkârın Seçimdeki İradesi", id: "Istikhara dan Kehendak Pelayan dalam Memilih" }
summary:
  ar: "سألت طالبة هندسة معمارية أن معدلها كان يؤهلها لطب الأسنان لكنها اختارت الهندسة لرغبتها ثم شككت في اختيارها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79020 بتاريخ 28 مايو 2009)⁩ أن للعبد مشيئة قطعًا لكنها لا تخرج عن مشيئة الله وما تشاءون إلا أن يشاء الله، فلا تدخل نفسها في الجدل الفلسفي حول القدر، والمهم أن العبد إذا توجه إلى شيء ثم استخار ربه عليه فيسره له ومضى فيه فلا يحزن على ما أصابه بعد ذلك فقد استفرغ وسعه وبذل جهده، فعليه أن يسعى وليس عليه إدراك المقاصد، وإن لم يحالفه التوفيق فليؤمن أن ما أصابه خير وأنه من جنس ما يكفر الله به الخطايا ويرفع به الدرجات."
  en: "An architecture student — whose grades could have taken her to dentistry — chose engineering by her own wish, then doubted her choice. Dr. Salah al-Sawi (fatwa no. 79020, 28 May 2009) answered that the servant has a will, certainly, but it does not escape God's will — 'you will nothing unless God wills it'; she should not enter the philosophical quarrel over destiny: what matters is that the servant who turns to something, seeks God's guidance over it, finds it eased and proceeds should not grieve at what follows — she spent her capacity and made her effort; striving is on her, reaching the goal is not; and should fortune fail her on this path, let her believe what struck her is good, of the kind by which God expiates slips and raises ranks."
  ur: "ایک طالبہ نے پیشے کے انتخاب پر شک کیا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79020، 28 مئی 2009)⁩ کے مطابق بندے کی مشیئت ہے مگر اللہ کی مشیئت سے باہر نہیں — استخارہ کے بعد جو آیا وہ خیر ہے؛ سعی تمھارے ذمے، نتیجہ نہیں۔"
  es: "Una estudiante de arquitectura —cuyas calificaciones podrían haberla llevado a estudiar odontología— eligió ingeniería por voluntad propia, pero luego dudó de su elección. El Dr. Salah al-Sawi (fatwa n.° 79020, 28 de mayo de 2009) respondió que el siervo tiene voluntad, ciertamente, pero no escapa a la voluntad de Dios: «No querrás nada a menos que Dios lo quiera»; no debería entrar en la disputa filosófica sobre el destino: lo que importa es que el siervo que se dedica a algo, busca la guía de Dios al respecto, encuentra facilidades y continúa, no debe lamentarse por lo que sigue: ha empleado su capacidad y se ha esforzado; el esfuerzo recae sobre ella, no sobre alcanzar la meta; y si la fortuna le es traicionada en este camino, que crea que lo que le sucedió es bueno, del tipo por el cual Dios expía los errores y eleva el rango."
  fr: "Une étudiante en architecture, dont les résultats scolaires lui auraient permis d'accéder à la dentisterie, choisit de son plein gré des études d'ingénieur, puis douta de son choix. Le docteur Salah al-Sawi (fatwa n° 79020, 28 mai 2009) répondit que le serviteur possède certes une volonté, mais que celle-ci n'échappe pas à la volonté divine: « Tu ne veux rien si Dieu ne le veut pas ». Elle ne doit pas s'engager dans des querelles philosophiques sur le destin. L'important est que le serviteur qui se tourne vers un objectif, recherche la guidance divine, trouve la voie apaisée et persévère, ne s'afflige pas de la suite. Il a déployé tous ses efforts et déployé toutes ses capacités; l'effort lui incombe, mais la réussite ne dépend pas de lui. Et si la fortune l'abandonne sur ce chemin, qu'elle croie que ce qui l'a frappée est une bonne chose, de celles par lesquelles Dieu expie les erreurs et élève les âmes."
  tr: "Bir mimarlık öğrencisine not ortalamasının diş hekimliği için yeterli olup olmadığını sordum, ancak o istekten dolayı mühendisliği seçti ve sonra seçiminden şüphe etti. Dr. Salah Al-Sawy (28 Mayıs 2009 tarihli 79020 Fetvası) bir hizmetkârın kesin bir iradesi olduğunu, ancak bunun Tanrı'nın iradesinin ötesine geçmediğini ve sadece Allah'ın istediğini kabul ettiğini söyledi. Bu yüzden kader üzerine felsefi tartışmalara karışmayın. Önemli olan, bir hizmetkar bir şeye yönelip sonra Rab'binden rehberlik isterse, onu hafifletir ve devam eder; bu yüzden sonrasında olanlar için üzülmemeli, çünkü kapasitesini tüketmiş ve çaba göstermiştir. Hedefleri kavramamalı ve çabalamamalıdır. Başarılı olamazsa, başına gelenin iyi olduğuna ve Tanrı'nın günahları kefaret ettiği ve rütbelerini yükselttiği türden olduğuna inanmalıdır."
  id: "Saya bertanya kepada seorang mahasiswa arsitektur apakah IPK-nya memenuhi syarat untuk kedokteran gigi, tetapi dia memilih teknik karena keinginannya dan kemudian meragukan pilihannya. Dr. Salah Al-Sawy menjawab (Fatwa No. 79020 tanggal 28 Mei 2009) bahwa seorang hamba memiliki kehendak yang pasti, tetapi itu tidak melampaui kehendak Tuhan, dan Anda hanya memiliki apa yang Tuhan kehendaki. Jadi jangan terlibat dalam perdebatan filosofis tentang takdir. Hal yang penting adalah jika seorang hamba berbalik pada sesuatu dan kemudian mencari petunjuk dari Tuhan-nya, Dia akan meringankannya dan melanjutkannya, jadi dia tidak boleh berduka atas apa yang terjadi setelahnya, karena dia telah menghabiskan kapasitasnya dan berusaha keras. Dia harus berusaha dan tidak meraih tujuan. Jika dia tidak berhasil, dia harus percaya bahwa apa yang menimpanya adalah baik, dan itu adalah jenis yang Tuhan menebus dosa dan mengangkat pangkat."
