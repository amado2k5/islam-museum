id: work/fatwa-dar-alifta-eg-slip-of-tongue-ihram-intention
class: work
kind: fatwa
label: { ar: "حكم الخطأ عند التلفظ بالنية في الإحرام", en: "A slip of the tongue when voicing the ihram intention", ur: "احرام کی نیت ادا کرتے وقت زبان کی غلطی کا حکم", es: "Un lapsus linguae al expresar la intención del ihram." }
summary:
  ar: "سائل أحرم للحج ونوى الإفراد ثم أخطأ في التلفظ بالنية فقال: «لبيك حجة وعمرة». أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23941)⁩ أنه يكون مفردًا تبعًا لنيته، ولا عبرة لسبق لسانه، على ما فصّل الجواب من أن العبرة في النية بالقلب لا باللفظ."
  en: "A questioner assumed ihram for Hajj intending ifrad, then slipped in voicing it and said 'at Your service for Hajj and umrah'. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23941) answered that he remains a mufrid according to his intention, and no weight is given to his tongue's slip — since the seat of intention is the heart, not the words, as the answer details."
  ur: "ایک سائل نے حج کے احرام میں افراد کی نیت کی پھر ادا کرتے ہوئے زبان سے غلطی نکلی کہ 'لبیک حجہ و عمرہ'۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23941)⁩ نے جواب دیا کہ وہ اپنی نیت کے مطابق مفرد ہی رہے گا اور زبان کی چوک کا اعتبار نہیں، کیونکہ نیت کا ٹھکانہ دل ہے الفاظ نہیں، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante asumió el estado de ihram para el Hajj con la intención de peregrinar (ifrad), pero luego, sin querer, lo expresó diciendo: \"A tu servicio para el Hajj y la Umrah\". El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23941) respondió que, según su intención, sigue siendo un perdedor (mufrid), y que no se le da importancia a su lapsus linguae, ya que la intención reside en el corazón, no en las palabras, como se detalla en la respuesta."
