summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: في حالة إصابة أحد الزوجين بالإيدز فعليه إخبار الآخر والتعاون معه في إجراءات الوقاية كافة، وأوصى الجهات المختصة في الدول الإسلامية باتخاذ التدابير للوقاية منه ومعاقبة من ينقله متعمدًا على ما ورد."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on AIDS: a spouse who contracts the disease must inform the other and cooperate in all preventive measures; it recommends the responsible bodies in Muslim states take protective measures and punish whoever transmits it deliberately, as stated."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩ ایڈز پر: متاثرہ فریق کو شریک حیات کو بتانا اور احتیاط پر تعاون کرنا ہوگا؛ دانستہ منتقلی پر سزا کی سفارش۔"
  es: "Resolución de la octava sesión de la IIFA (Brunéi, junio de 1993) sobre el SIDA: el cónyuge que contrae la enfermedad debe informar al otro y cooperar en todas las medidas preventivas; recomienda que los organismos responsables en los estados musulmanes adopten medidas de protección y castiguen a quien la transmita deliberadamente, como se indica."
