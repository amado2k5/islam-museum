label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن مرض نقص المناعة المكتسب ⁦(الإيدز)⁩", en: "IIFA resolution on acquired immune deficiency (AIDS)", ur: "اکیڈمی کی قرارداد: ایڈز کے بارے میں", es: "Resolución de la IIFA sobre la inmunodeficiencia adquirida (SIDA)", fr: "Résolution de l'IIFA sur le déficit immunitaire acquis (SIDA)", tr: "Uluslararası İslami Fiqh Akademisi'nin Edinilmiş Bağışıklık Yetmezliği Sendromu (AIDS) ile ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai Sindrom Imunodefisiensi Diperoleh (AIDS)" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: في حالة إصابة أحد الزوجين بالإيدز فعليه إخبار الآخر والتعاون معه في إجراءات الوقاية كافة، وأوصى الجهات المختصة في الدول الإسلامية باتخاذ التدابير للوقاية منه ومعاقبة من ينقله متعمدًا على ما ورد."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on AIDS: a spouse who contracts the disease must inform the other and cooperate in all preventive measures; it recommends the responsible bodies in Muslim states take protective measures and punish whoever transmits it deliberately, as stated."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩ ایڈز پر: متاثرہ فریق کو شریک حیات کو بتانا اور احتیاط پر تعاون کرنا ہوگا؛ دانستہ منتقلی پر سزا کی سفارش۔"
  es: "Resolución de la octava sesión de la IIFA (Brunéi, junio de 1993) sobre el SIDA: el cónyuge que contrae la enfermedad debe informar al otro y cooperar en todas las medidas preventivas; recomienda que los organismos responsables en los estados musulmanes adopten medidas de protección y castiguen a quien la transmita deliberadamente, como se indica."
  fr: "Résolution de la huitième session de l'IIFA (Brunei, juin 1993) sur le sida: un conjoint qui contracte la maladie doit en informer l'autre et coopérer à toutes les mesures préventives; elle recommande aux organismes responsables des États musulmans de prendre des mesures de protection et de punir quiconque la transmet délibérément, comme indiqué."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin sekizinci oturumunda (Brunei, Haziran 1993) karar verilmiştir: Eşlerden biri AIDS'e yakalanırsa, diğerini bilgilendirmeli ve tüm önleyici tedbirlerde işbirliği yapmalıdır. İslam ülkelerindeki yetkili makamların, AIDS'i önlemek ve kasıtlı olarak bulaştıranları cezalandırmak için önlemler almalarını tavsiye etmiştir."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi kedelapan (Brunei, Juni 1993): Jika salah satu pasangan tertular AIDS, mereka harus memberitahu yang lain dan bekerja sama dengan mereka dalam semua langkah pencegahan. Keputusan merekomendasikan agar otoritas yang berwenang di negara-negara Islam mengambil langkah-langkah untuk mencegahnya dan menghukum mereka yang sengaja menularkannya sesuai dengan yang dinyatakan."
