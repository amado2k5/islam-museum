id: work/fatwa-dar-alifta-eg-choosing-foetus-sex
class: work
kind: fatwa
label: { ar: "حكم تحديد جنس الجنين ومدى اعتبار ذلك اعتراضًا على الخالق", en: "Sex selection of the foetus and whether it objects to the Creator", ur: "جنین کی جنس کا تعین اور کیا یہ خالق پر اعتراض ہے", es: "La selección del sexo del feto y si este se opone al Creador.", fr: "Le choix du sexe du fœtus et son opposition au Créateur" }
summary:
  ar: "سائل سأل عن تحديد جنس الجنين ومدى اعتباره اعتراضًا على الخالق. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22111)⁩ أنه لا مانع شرعًا من التدخل الطبي لتحديد جنس الجنين إذا كانت هناك حاجة داعية كتجنب بعض الأمراض الوراثية، على ما فصّل الجواب من الضوابط."
  en: "A questioner asked about sex selection of the foetus and how far it counts as objecting to the Creator. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22111) answered that there is no sharia bar to medical intervention to determine the foetus's sex where a pressing need exists — such as avoiding some hereditary diseases — under the controls the answer details."
  ur: "ایک سائل نے جنین کی جنس کے تعین اور اس کے خالق پر اعتراض شمار ہونے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22111)⁩ نے جواب دیا کہ کلیجہ ضرورت ہو جیسے بعض موروثی امراض سے بچنا تو طبی مداخلت سے جنس کا تعین شرعاً ممنوع نہیں، جواب کے بیان کردہ ضوابط کے ساتھ۔"
  es: "Una persona preguntó sobre la selección del sexo del feto y hasta qué punto esto constituye una ofensa al Creador. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22111) respondió que no existe ninguna prohibición islámica para la intervención médica que determine el sexo del feto cuando existe una necesidad imperiosa, como evitar ciertas enfermedades hereditarias, bajo los controles que se detallan en la respuesta."
  fr: "Une personne a posé une question sur la sélection du sexe du fœtus et sur la mesure dans laquelle cela constitue une objection au Créateur. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22111) a répondu qu'aucune interdiction de la charia n'existe à l'égard d'une intervention médicale visant à déterminer le sexe du fœtus en cas de nécessité impérieuse – par exemple, pour éviter certaines maladies héréditaires – sous réserve des conditions détaillées dans la réponse."
