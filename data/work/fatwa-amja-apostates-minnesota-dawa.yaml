label: { ar: "ردة جماعة في منيسوتا ومهمة الدعوة", en: "A group's apostasy in Minnesota, and dawa's two missions", ur: "مینیسوٹا میں ارتداد اور دعوت کے دو مشن", es: "La apostasía de un grupo en Minnesota y las dos misiones de Dawa." }
summary:
  ar: "سأل سائل عن أناس في ولاية منيسوتا كانوا مسلمين فتركوا دينهم وصاروا يتكلمون في الدين والنبي. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81733 بتاريخ 23 يونيو 2010)⁩ بالأسف على ردتهم واستحبابهم العمى على الهدى مذكرًا بقوله تعالى يا أيها الذين آمنوا من يرتد منكم عن دينه فسوف يأتي الله بقوم يحبهم ويحبونه، وأنهم يخسرون أنفسهم ولا يضرون الله شيئًا، وأن للدعوة خارج ديار الإسلام رسالتين: حفظ الإسلام على أهله وهو على رأس المطالب، ودعوة غير المسلمين إليه، وأرجو ألا ييأس من استعادتهم بالجهد الصادق والتعرف على أحوالهم عن قرب على ما فصّل."
  en: "A questioner reported a group in Minnesota who had left their religion and begun speaking against the religion and the Prophet. Dr. Salah al-Sawi (fatwa no. 81733, 23 June 2010) answered with sorrow at their apostasy — preferring blindness to guidance — citing the verse that God will bring a people He loves and who love Him should any turn back from their religion; they lose only themselves and do not harm God. He reminded that dawa outside Muslim lands has two missions: preserving Islam among its people — the top priority — and calling non-Muslims to it, and hoped the questioner would not despair of restoring them through sincere effort and knowing their circumstances closely, as detailed. Recorded as AMJA's answer."
  ur: "ایک سائل نے مینیسوٹا میں مرتد ہونے والے گروہ کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81733، 23 جون 2010)⁩ کے مطابق غیر اسلامی ممالک میں دعوت کے دو مشن ہیں — مسلمانوں کا اسلام محفوظ رکھنا سب سے اول، پھر غیر مسلموں کی دعوت — اور مخلص کوشش سے ان کی واپسی کی امید چھوڑنا نہیں۔"
  es: "Un consultante informó sobre un grupo en Minnesota que había abandonado su religión y comenzado a hablar en contra de ella y del Profeta. El Dr. Salah al-Sawi (fatwa n.° 81733, 23 de junio de 2010) expresó su pesar por su apostasía —prefiriendo la ceguera a la guía— citando el versículo que dice que Dios traerá a un pueblo que Él ama y que lo ama si alguno se aparta de su religión; solo se pierden a sí mismos y no dañan a Dios. Recordó que la dawa fuera de tierras musulmanas tiene dos misiones: preservar el Islam entre su gente —la máxima prioridad— y llamar a los no musulmanes a él, y expresó su esperanza de que el consultante no desesperara de poder reconducirlos mediante un esfuerzo sincero y conociendo de cerca sus circunstancias, como se detalla. Registrado como respuesta de AMJA."
