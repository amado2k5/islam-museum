label: { ar: "حكم إعمال الأموال في آلات الملاهي واختلاط النساء بالرجال", en: "Fatwa on spending money on instruments of entertainment and mixed gatherings", ur: "آلاتِ لہو پر مال خرچ کرنے اور مردوں و خواتین کے اختلاط پر فتویٰ", es: "Fatwa sobre el gasto de dinero en instrumentos de entretenimiento y reuniones mixtas.", fr: "Fatwa concernant les dépenses liées aux instruments de divertissement et aux rassemblements mixtes", tr: "Lunaparklarda para kullanımı ve kadınların erkeklerle karıştırılması kararı", id: "Putusan tentang penggunaan uang di taman hiburan dan pencampuran wanita dengan pria" }
summary:
  ar: "سؤال عن حكم إنفاق المال في آلات الملاهي، وعن اختلاط النساء بالرجال فيها، والإعانة عليها، والحضور. الجواب: يجب على ذوي القدرة منعها، ولا يجوز لمسلم حضورها، لأن ذلك من الإعانة على المنكر وهو حرام بالإجماع."
  en: "Question on spending money on instruments of entertainment, mixing of men and women there, helping to fund it, and attending it. The answer: those able must stop it, a Muslim may not attend, since this is helping in wrongdoing, which is forbidden by consensus."
  ur: "سوال: آلاتِ لہو پر مال خرچ کرنے، وہاں مردوں اور خواتین کے اختلاط، اس میں مدد دینے اور اس میں شرکت کا حکم۔ جواب: قدرت رکھنے والوں پر اسے روکنا لازم ہے اور کسی مسلمان کے لیے اس میں شرکت جائز نہیں، کیونکہ یہ ناجائز میں معاونت ہے جو اجماعاً حرام ہے۔"
  es: "Pregunta sobre el gasto de dinero en espectáculos, la mezcla de hombres y mujeres en ellos, la financiación de los mismos y la asistencia. Respuesta: quienes puedan deben impedirlo; un musulmán no puede asistir, ya que esto constituye colaborar en una mala acción, lo cual está prohibido por consenso."
  fr: "Question concernant les dépenses liées aux divertissements, la mixité des sexes dans ces lieux, le financement de ces activités et la participation à celles-ci: la réponse est que ceux qui en ont les moyens doivent y mettre fin; un musulman ne peut y assister, car cela revient à cautionner un acte répréhensible, ce qui est interdit par consensus."
  tr: "Eğlence araçlarına para harcama, kadınların erkeklerle karışması, onlara yardım etmesi ve katılmaları hakkında bir soru. Cevap: Maddi durumu olanlar bunları engellemelidir ve bir Müslümanın bu etkinliklere katılması yasaktır, çünkü bu yanlış davranışa yardım olarak kabul edilir ve oybirliğiyle yasaktır."
  id: "Sebuah pertanyaan tentang aturan pengeluaran uang untuk wahana hiburan, tentang wanita yang bercampur dengan pria di dalamnya, membantu, dan menghadirinya. Jawaban: Mereka yang mampu harus mencegahnya, dan tidak diperbolehkan bagi Muslim untuk menghadirinya, karena itu dianggap membantu melakukan kesalahan dan secara bulat dilarang."
