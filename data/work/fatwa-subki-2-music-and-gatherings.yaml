label: { ar: "حكم إعمال الأموال في آلات الملاهي واختلاط النساء بالرجال", en: "Fatwa on spending money on instruments of entertainment and mixed gatherings", ur: "آلاتِ لہو پر مال خرچ کرنے اور مردوں و خواتین کے اختلاط پر فتویٰ", es: "Fatwa sobre el gasto de dinero en instrumentos de entretenimiento y reuniones mixtas." }
summary:
  ar: "سؤال عن حكم إنفاق المال في آلات الملاهي، وعن اختلاط النساء بالرجال فيها، والإعانة عليها، والحضور. الجواب: يجب على ذوي القدرة منعها، ولا يجوز لمسلم حضورها، لأن ذلك من الإعانة على المنكر وهو حرام بالإجماع."
  en: "Question on spending money on instruments of entertainment, mixing of men and women there, helping to fund it, and attending it. The answer: those able must stop it, a Muslim may not attend, since this is helping in wrongdoing, which is forbidden by consensus."
  ur: "سوال: آلاتِ لہو پر مال خرچ کرنے، وہاں مردوں اور خواتین کے اختلاط، اس میں مدد دینے اور اس میں شرکت کا حکم۔ جواب: قدرت رکھنے والوں پر اسے روکنا لازم ہے اور کسی مسلمان کے لیے اس میں شرکت جائز نہیں، کیونکہ یہ ناجائز میں معاونت ہے جو اجماعاً حرام ہے۔"
  es: "Pregunta sobre el gasto de dinero en espectáculos, la mezcla de hombres y mujeres en ellos, la financiación de los mismos y la asistencia. Respuesta: quienes puedan deben impedirlo; un musulmán no puede asistir, ya que esto constituye colaborar en una mala acción, lo cual está prohibido por consenso."
