summary:
  ar: "سؤال عن حكم إنفاق المال في آلات الملاهي، وعن اختلاط النساء بالرجال فيها، والإعانة عليها، والحضور. الجواب: يجب على ذوي القدرة منعها، ولا يجوز لمسلم حضورها، لأن ذلك من الإعانة على المنكر وهو حرام بالإجماع."
  en: "Question on spending money on instruments of entertainment, mixing of men and women there, helping to fund it, and attending it. The answer: those able must stop it, a Muslim may not attend, since this is helping in wrongdoing, which is forbidden by consensus."
