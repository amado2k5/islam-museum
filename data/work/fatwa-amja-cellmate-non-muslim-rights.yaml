label: { ar: "زميل الزنزانة غير المسلم", en: "Praying before a non-Muslim cellmate — his rights of neighbor", ur: "غیر مسلم ساتھی — حقوق جوار", es: "Orar ante un compañero de celda no musulmán: sus derechos como vecino", fr: "Prier devant un codétenu non musulman — ses droits de voisin", tr: "Gayrimüslim hücre arkadaşı", id: "Teman sekamar non-Muslim" }
summary:
  ar: "سأل سائل أنه يعيش في زنزانة مع غير مسلم ويجد صعوبة في أداء صلاته أمامه على الأرض. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21998 بتاريخ 14 أكتوبر 2012)⁩ أن لجاره الذي قُدر عليه أن يخالطه في الزنزانة جملة من الحقوق منها حق الإنسانية فهو إنسان له حقوق يتعين القيام بها وحق الجوار وقد أوصى النبي بالجار على ما فصّل الجواب من أحكام الصلاة في ذلك المحل."
  en: "A questioner lives in a cell with a non-Muslim and finds praying before him on the floor difficult. AMJA's fatwa committee (fatwa no. 21998, 14 October 2012) answered that this companion decreed upon him in the cell holds a set of rights: the right of humanity — he is human with rights that must be met — and the right of neighborhood, for the Prophet commended the neighbor — the answer detailing the prayer's rulings in such a place."
  ur: "غیر مسلم ساتھی کے سامنے نماز؟ لجنة الفتوى ⁦(فتویٰ 21998، 14 اکتوبر 2012)⁩ کے مطابق اسے انسانیت و جوار کے حقوق حاصل — نماز کے احکام بیان ہوئے۔"
  es: "Un consultante vive en una celda con un no musulmán y encuentra difícil rezar delante de él en el suelo. El comité de fatuas de AMJA (fatua n.º 21998, 14 de octubre de 2012) respondió que este compañero, designado para estar con él en la celda, tiene una serie de derechos: el derecho a la humanidad —es un ser humano con derechos que deben ser respetados— y el derecho de vecindad, pues el Profeta alabó al prójimo —la respuesta detalla las normas de la oración en tal lugar—."
  fr: "Un homme, vivant en cellule avec un non-musulman, éprouve des difficultés à prier devant lui, assis à même le sol. Le comité de fatwas de l'AMJA (fatwa n° 21998, 14 octobre 2012) a répondu que ce compagnon, avec lequel il partage sa cellule, possède plusieurs droits: le droit humain – il est un être humain doté de droits qui doivent être respectés – et le droit de voisinage, car le Prophète a loué le prochain – la réponse détaillant les règles relatives à la prière dans un tel lieu."
  tr: "Bir soru soran kişi, ona gayrimüslimle bir hücrede yaşayıp yaşamadığını ve yerde onun önünde namaz kılmakta zorlandığını sormuştur. Amerikan Şeriat Hukukçuları Konseyi Fetva Komitesi (14 Ekim 2012 tarihli Fetva No. 21998), hücrede iletişim kurmasına izin verilen komşusunun, yerine getirilmesi gereken haklara sahip bir insan olduğu ve komşuluk hakkı olan bir insan olduğu için, insanlık hakkı da dahil olmak üzere bir dizi hak sahibi olduğunu yanıtlamıştır. Peygamber, o yerdeki namaz kuralları hakkında cevabında ayrıntılı olarak belirtildiği üzere komşuya tavsiyede bulunmuştur."
  id: "Seorang penanya bertanya apakah ia tinggal di sel bersama non-Muslim dan merasa sulit untuk melaksanakan shalat di depannya di tanah. Komite Fatwa Dewan Ahli Hukum Syariah Amerika (Fatwa No. 21998 tanggal 14 Oktober 2012) menjawab bahwa tetangga yang diizinkan berinteraksi dengannya di sel memiliki seperangkat hak, termasuk hak atas kemanusiaan, karena ia adalah manusia dengan hak yang harus dipenuhi dan hak untuk bersahabat. Nabi menasihati tetangga, seperti yang dijelaskan dalam jawaban mengenai aturan shalat di tempat tersebut."
