label: { ar: "قرار مجمع الفقه الإسلامي الدولي 219 (23/3) بشأن المفطرات في مجال التداوي ⁦(استكمال ما سبق)⁩", en: "IIFA resolution 219 (23/3) on nullifiers of fasting in the field of medical treatment (continuation of the preceding)", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 219 (23/3): طبی علاج کے میدان میں روزہ شکن اشیا — سابقہ قرارداد کا تکملہ" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة والعشرين بالمدينة المنورة ⁦⁦(19–23 صفر 1440هـ، 28 أكتوبر – 1 نوفمبر 2018م)⁩⁩ استكمالًا لقراره 93 ⁦(10/1)⁩. عرّف المفطرات بتعمد الأكل والشرب والجماع وما في معناه والقيء، والجوف الذي يفسد الصوم بما يصل إليه ما تجاوز الحلق إلى الجهاز الهضمي ووصل المعدة مغذيًا كان أو غير مغذ من طريق معتاد أو غير معتاد. وقرر أن ما لا يفسد الصوم: بخاخ الربو لأنه يستهدف الجهاز التنفسي وما يصل المعدة منه يسير مغتفر أقل من بقايا المضمضة والسواك؛ سحب الدم للتحاليل أو التبرع به؛ كل ما يدخل من طريق الشرج من حقن وتحاميل ومنظار ومراهم ما عدا الحقن المغذية؛ لصقة إزالة الشعور بالجوع؛ شفط الدهون ما لم تقترن بسوائل مغذية؛ المنظار الشرجي وإصبع الفحص الطبي؛ الحجامة والفصد؛ وفقد الوعي بالتخدير العام لجزء من النهار ولو استمر بقية يومه إن وقع التخدير أثناء الصوم ما لم يصاحبه إعطاء سوائل. وما يفسد الصوم: كل ما يدخل الجهاز الهضمي متجاوزًا الفم والبلعوم ومما هو محيل وهاضم للطعام كالمريء والأمعاء الدقيقة؛ كل ما يتغذى به جسم الصائم من أي منفذ طبيعي لأنه في معنى الأكل كالحقنة المغذية؛ جهاز التبخير الرئوي ⁦⁦(البنيوليزر)⁩⁩ المستخدم في علاج الربو لأن الكمية الداخلة منه إلى المعدة أكبر بكثير من المعفو عنه؛ نقل الدم لاحتوائه على كمية كبيرة من الماء؛ الغسيل الكلوي البريتواني والدموي لإدخاله كمية كبيرة من الماء والأملاح والسكر؛ وكبسولات بخاخ الربو المحتوية على البودرة الجافة لخروج جزء منها جرمًا يصل المعدة. وأوصى بأهمية دور الطبيب المعالج في تحديد الضرورة للمداخلات التي قد تفسد الصوم فإن أمكن تأجيلها لوقت الفطر أشار بذلك؛ وبتوعية المرضى بصحة عبادتهم والرجوع لأهل العلم الثقات؛ وبإعلام مريض الفشل الكلوي الذي لا يرجى برؤه بعدم الصوم حفاظًا على حياته فهو معذور وعليه فدية طعام مسكين عن كل يوم."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 23rd session in Medina (19–23 Safar 1440, 28 October – 1 November 2018), continuing resolution 93 (10/1). It defined the nullifiers as deliberately eating, drinking, sexual intercourse and its equivalents, and vomiting; and the interior whose entry breaks the fast as whatever passes the throat into the digestive tract reaching the stomach, nourishing or not, by a usual or unusual route. What does not break the fast: the asthma inhaler, targeting the respiratory system with a negligible forgiven fraction reaching the stomach, less than gargling and siwak remnants; drawing blood for tests or donation; everything entering by the anal route — injections, suppositories, endoscopes, ointments — except nutritive injections; the hunger-suppressing patch; liposuction unless accompanied by nutritive fluids; the rectal endoscope and the examining finger; cupping and venesection; and loss of consciousness by general anaesthesia for part of the day, even lasting its remainder, if administered while fasting and unaccompanied by fluids. What breaks the fast: everything entering the digestive tract past the mouth and pharynx into what conveys and digests food — the oesophagus and small intestine; everything nourishing the fasting body by any natural opening, being the equivalent of eating, such as the nutritive injection; the pulmonary nebuliser used in asthma treatment since the amount reaching the stomach far exceeds the forgiven; blood transfusion for its large water content; peritoneal and haemodialysis for introducing large amounts of water, salts and sugar; and asthma-inhaler capsules containing dry powder, a solid part of which reaches the stomach. It recommended: the attending physician's role in determining necessity for interventions that might break the fast, advising postponement to iftar when possible; raising patients' awareness of correctly performing worship and referring to trustworthy scholars; and informing the unrecoverable renal-failure patient not to fast to preserve his life — he is excused and owes the ransom of feeding a poor person per day."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مدینہ منورہ میں تیس ویں مجلس ⁦⁦(19–23 صفر 1440ھ، 28 اکتوبر – 1 نومبر 2018ء)⁩⁩ میں، اپنی قرارداد 93 ⁦(10/1)⁩ کے تکملے میں۔ روزہ شکن اشیا کی تعریف: عمداً کھانا، پینا، جماع اور اس کے مترادفات اور قی؛ اور وہ جوف جس میں کچھ پہنچنے سے روزہ ٹوٹتا ہے وہ ہے جو حلق سے آگے نظامِ ہاضمہ میں جا کر معدہ تک پہنچے، غذائیت والا ہو یا نہ، معمول کے راستے سے یا غیر معمول کے۔ روزہ نہیں ٹوٹتا: دمے کا سپرے کیونکہ یہ تنفسی نظام کو نشانہ بناتا ہے اور معدہ تک پہنچنے والا مقدار ناچیز معاف شدہ ہے جو کللی اور مسواک کی باقیات سے بھی کم ہے؛ خون نکالنا جانچ یا عطیے کے لیے؛ مقعد کے راستے سے داخل ہونے والی ہر چیز — انجیکشن، تحمیلے، اینڈوسکوپ، مرہم — سوائے غذائیت والے انجیکشن کے؛ بھوک کم کرنے والا پیچ؛ چربی نکالنے کا آپریشن بشرطیکہ اس کے ساتھ غذائیت والے مائعات نہ ہوں؛ مقعد کا اینڈوسکوپ اور طبی معائنے کی انگلی؛ حجامہ اور فصد؛ اور عمومی بے ہوشی سے دن کے کچھ حصے کے لیے ہوشی جانا خواہ دن باقی رہ جائے بشرطیکہ بے ہوشی روزے میں دی گئی ہو اور اس کے ساتھ مائعات نہ دی گئی ہوں۔ روزہ ٹوٹتا ہے: ہر وہ چیز جو منہ اور حلق سے آگے ہاضم نظام میں داخل ہو جیسے غذائی نالی اور چھوٹی آنتیں؛ ہر وہ چیز جس سے روزے دار کا جسم غذا پائے کسی بھی قدرتی راستے سے کیونکہ یہ کھانے کے معنی میں ہے جیسے غذائیت والا انجیکشن؛ دمے کے علاج کا پلمونری نیبولائزر کیونکہ اس سے معدہ تک جانے والی مقدار معاف شدہ سے کہیں زیادہ ہے؛ خون کی منتقلی کیونکہ اس میں پانی کی بڑی مقدار ہے؛ پیریٹونیل اور ہیمودائیلیسس کیونکہ یہ پانی، نمک اور شکر کی بڑی مقدار داخل کرتے ہیں؛ اور خشک پاؤڈر والے دمے کے سپرے کی کیپسولز جن کا کچھ حصہ جرم کی صورت معدہ تک پہنچتا ہے۔ سفارشات: معالج کا کردار فیصلہ کرتا ہے کہ روزہ توڑنے والی مداخلتیں ضروری ہیں یا نمازِ افطار تک ملتوی ہو سکتی ہیں؛ مریضوں کو صحیح عبادت کی تعلیم اور اہلِ علمِ ثقہ سے رجوع کی ترغیب؛ اور ناقابلِ شفا گردے کے مریض کو جان بچانے کے لیے روزہ نہ رکھنے کی خبر دینا — وہ معذور ہے اور ہر دن کے عوض مسکین کو کھانا دینے کی فدیہ اس کے ذمہ ہے۔"
