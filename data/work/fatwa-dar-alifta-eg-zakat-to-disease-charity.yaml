label: { ar: "حكم إخراج الزكاة لمؤسسة متخصصة في رعاية مرضى أمراض معينة", en: "Paying zakat to a foundation caring for patients of specific diseases", ur: "مخصوص امراض کے مریضوں کی دیکھ بھال کی تنظیم کو زکات" }
summary:
  ar: "سائل سأل عن إخراج الزكاة لمؤسسة متخصصة في رعاية مرضى أمراض معينة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22015)⁩ أنه يجوز الصرف من أموال الزكاة للحالات المرضية الواردة على المؤسسة من الفقراء والمساكين على أن يكون ذلك بطريق التمليك على ما فصّل الجواب."
  en: "A questioner asked about paying zakat to a foundation devoted to caring for patients of specific diseases. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22015) answered that zakat funds may go to the sick cases reaching the foundation among the poor and needy, provided transfer is by way of ownership, as the answer details."
  ur: "ایک سائل نے مخصوص بیماریوں کے مریضوں کی دیکھ بھال کرنے والی تنظیم کو زکات دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22015)⁩ نے جواب دیا کہ ادارے تک پہنچنے والے فقیر اور مسکین مریضوں پر زکات خرچ ہو سکتی ہے بشرطیکہ ملکیت کے ذریعے پہنچے، جیسا کہ جواب میں تفصیل ہے۔"
