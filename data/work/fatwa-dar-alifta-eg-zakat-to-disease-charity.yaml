label: { ar: "حكم إخراج الزكاة لمؤسسة متخصصة في رعاية مرضى أمراض معينة", en: "Paying zakat to a foundation caring for patients of specific diseases", ur: "مخصوص امراض کے مریضوں کی دیکھ بھال کی تنظیم کو زکات", es: "Pagar el zakat a una fundación que atiende a pacientes con enfermedades específicas.", fr: "Verser la zakat à une fondation qui prend en charge des patients atteints de maladies spécifiques", tr: "Belirli Hastalıklara Sahip Hastalara Bakım Yapan Bir Kuruma Zekat Ödemesine Karar", id: "Putusan tentang pembayaran zakat kepada institusi yang khusus merawat pasien dengan penyakit tertentu" }
summary:
  ar: "سائل سأل عن إخراج الزكاة لمؤسسة متخصصة في رعاية مرضى أمراض معينة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22015)⁩ أنه يجوز الصرف من أموال الزكاة للحالات المرضية الواردة على المؤسسة من الفقراء والمساكين على أن يكون ذلك بطريق التمليك على ما فصّل الجواب."
  en: "A questioner asked about paying zakat to a foundation devoted to caring for patients of specific diseases. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22015) answered that zakat funds may go to the sick cases reaching the foundation among the poor and needy, provided transfer is by way of ownership, as the answer details."
  ur: "ایک سائل نے مخصوص بیماریوں کے مریضوں کی دیکھ بھال کرنے والی تنظیم کو زکات دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22015)⁩ نے جواب دیا کہ ادارے تک پہنچنے والے فقیر اور مسکین مریضوں پر زکات خرچ ہو سکتی ہے بشرطیکہ ملکیت کے ذریعے پہنچے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el pago del zakat a una fundación dedicada al cuidado de pacientes con enfermedades específicas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22015) respondió que los fondos del zakat pueden destinarse a los casos de enfermedad atendidos por la fundación entre los pobres y necesitados, siempre que la transferencia se realice mediante transferencia de propiedad, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le versement de la zakat à une fondation œuvrant auprès de patients atteints de maladies spécifiques. La Dar al-Ifta égyptienne (Grand Mufti Dr Nazir Muhammad Ayyad, fatwa n° 22015) a répondu que les fonds de la zakat peuvent être versés aux malades parmi les personnes pauvres et nécessiteuses prises en charge par la fondation, à condition que le transfert s'effectue par transfert de propriété, comme le précise la réponse."
  tr: "Bir soru soran, belirli hastalıklara sahip hastalara bakım konusunda uzmanlaşmış uzman bir kuruma zekat verilmesini sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22015), cevabında belirtildiği gibi, yoksul ve muhtah sahipleri arasında kuruma sevk edilen hasta vakaları için zekat fonlarının harcanmasının uygun olduğunu söyledi."
  id: "Seorang penanya menanyakan tentang pemberian zakat kepada institusi khusus yang mengkhususkan diri dalam merawat pasien dengan penyakit tertentu. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22015) menjawab bahwa diperbolehkan menggunakan dana zakat untuk kasus sakit yang dirujuk ke institusi tersebut di kalangan miskin dan membutuhkan, asalkan dilakukan secara kepemilikan sebagaimana dijelaskan dalam jawaban."
