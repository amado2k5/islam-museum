id: work/fatwa-dar-alifta-eg-zakat-al-fitr-for-debtor
class: work
kind: fatwa
label: { ar: "حكم زكاة الفطر لمن عليه دين", en: "Zakat al-fitr for one who owes a debt", ur: "قرض دار پر زکات الفطر" }
summary:
  ar: "سائل سأل عن وجوب زكاة الفطر على المدين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21781)⁩ أن زكاة الفطر واجبة على الصغير والكبير والذكر والأنثى ولا يمنع الدين من وجوبها على المكلف ما دام أنه قادر على إخراجها على ما فصّل الجواب."
  en: "A questioner asked whether zakat al-fitr is obligatory on a debtor. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21781) answered that it is obligatory on young and old, male and female, and debt does not prevent its obligation so long as the person is able to pay it — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا قرض دار پر زکات الفطر واجب ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21781)⁩ نے جواب دیا کہ یہ چھوٹے بڑے مرد و عورت سب پر واجب ہے اور قرض اس کے واجب ہونے سے نہیں روکتا جب تک ادا کرنے کی استطاعت ہو — جیسا کہ جواب میں تفصیل ہے۔"
