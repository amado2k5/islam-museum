id: work/fatwa-aliftaa-jo-parents-forbidding-mosque-prayer
class: work
kind: fatwa
label: { ar: "طاعة الوالدين في منع الولد من صلاة الجماعة في المسجد", en: "Obeying parents who forbid going to the mosque for congregational prayer", ur: "والدین کی اطاعت جب وہ مسجد میں باجماعت نماز سے روکیں" }
summary:
  ar: "سؤال من شاب يمنعه أهله من صلاة الجماعة في المسجد، أجابت فيه دائرة الإفتاء العام الأردنية بأن طاعتهما تجب إن كان منعهما لمصلحة ظاهرة، ولا تجب إن كان تعنتًا أو توهمًا. بيّنت الدائرة أن صلاة الجماعة مشروعة، وأقلها اثنان، وتحصل فضيلتها في البيت أو العمل، وهي فرض كفاية على الرجال المقيمين في الفرائض، وفي المسجد أفضل للرجل، وذكرت أعذار تركها العامة كالمطر والبرد الشديدين، والخاصة كالمرض والخوف على النفس أو المال. وقالت إن منع الوالدين إن كان لمصلحة ظاهرة وحفظ للولد من مكروه يغلب على ظنهما وقوعه، كمرض في وقت وباء أو خطف أو اعتداء عند الفتن، أو لمصلحة لهما ككبر أو مرض أو أنس به، وجبت طاعتهما. وإن كان على سبيل التعنت أو التوهم فلا تجب الطاعة إذا كان الولد عاقلًا رشيدًا، لأن الطاعة الواجبة هي ما فيه مصلحة ظاهرة لهما، واستشهدت بجواب لابن حجر الهيتمي في الفتاوى الفقهية الكبرى عن أب منع ولده الرشيد من طلب العلم خوفًا من صحبة الأشرار. وختمت بأن على الولد أن يتلطف بوالديه في كل حال."
  en: "A question from a young man whose family stop him from praying in congregation at the mosque, in which Jordan's General Iftaa Department answered that he must obey them if they forbid it for a clear benefit, but need not if they act from obstinacy or imagined fears. The Department explained that congregational prayer is established, needs at least two people, and its merit can be had at home or at work; it is a communal obligation on resident men for the obligatory prayers and is better for men in the mosque, and it listed the general excuses for missing it, such as heavy rain or severe cold, and personal ones such as illness or fear for one's life or property. It said that if the parents forbid it for a clear benefit, to protect their son from a harm they think likely, such as illness during an epidemic or kidnapping or assault in times of unrest, or for their own benefit, such as old age, illness or wanting his company, he must obey them. If they act from obstinacy or imagined fears, obedience is not required of a sane, mature son, since the obedience owed is in what clearly benefits them; it cited a reply of Ibn Hajar al-Haytami in al-Fatawa al-Fiqhiyya al-Kubra about a father who kept his mature son from seeking knowledge for fear of bad company. It closed by saying that the son should be gentle with his parents in every case."
  ur: "ایک نوجوان کا سوال جسے اس کے گھر والے مسجد میں باجماعت نماز سے روکتے ہیں، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر وہ کسی واضح مصلحت سے روکیں تو اطاعت لازم ہے، اور اگر ضد یا وہم کی بنا پر روکیں تو لازم نہیں۔ ڈیپارٹمنٹ نے واضح کیا کہ باجماعت نماز مشروع ہے، اس کے لیے کم از کم دو افراد چاہییں، اور اس کی فضیلت گھر یا کام کی جگہ بھی حاصل ہو سکتی ہے؛ یہ مقیم مردوں پر فرض نمازوں میں فرضِ کفایہ ہے اور مرد کے لیے مسجد میں افضل ہے، اور اس نے جماعت چھوڑنے کے عمومی عذر، جیسے شدید بارش یا سردی، اور ذاتی عذر، جیسے بیماری یا جان و مال کا خوف، بیان کیے۔ اس نے کہا کہ اگر والدین کسی واضح مصلحت سے روکیں، بیٹے کو ایسے نقصان سے بچانے کے لیے جس کا انہیں غالب گمان ہو، جیسے وبا کے دوران بیماری یا فتنوں میں اغوا یا حملہ، یا اپنی مصلحت کے لیے، جیسے بڑھاپا، بیماری یا اس کی صحبت کی خواہش، تو اطاعت لازم ہے۔ اور اگر وہ ضد یا وہم کی بنا پر روکیں تو عاقل اور سمجھ دار بیٹے پر اطاعت لازم نہیں، کیونکہ واجب اطاعت اسی میں ہے جس میں ان کی واضح مصلحت ہو؛ اس نے ابن حجر الہیتمی کی الفتاویٰ الفقہیۃ الکبریٰ کے ایک جواب سے استدلال کیا جو ایسے باپ کے بارے میں تھا جس نے بری صحبت کے خوف سے اپنے سمجھ دار بیٹے کو علم حاصل کرنے سے روکا۔ آخر میں اس نے کہا کہ بیٹا ہر حال میں والدین سے نرمی کا برتاؤ کرے۔"
