id: work/fatwa-aliftaa-jo-parents-forbidding-mosque-prayer
class: work
kind: fatwa
label: { ar: "طاعة الوالدين في منع الولد من صلاة الجماعة في المسجد", en: "Obeying parents who forbid going to the mosque for congregational prayer", ur: "والدین کی اطاعت جب وہ مسجد میں باجماعت نماز سے روکیں", es: "Obedecer a los padres que prohíben ir a la mezquita para la oración en congregación", fr: "Obéir à ses parents qui interdisent d'aller à la mosquée pour la prière en congrégation", tr: "Çocuğun camide cemaat namazı etmesini engellemede ebeveynlere itaat", id: "Ketaatan kepada orang tua dalam mencegah anak salat jamaah di masjid" }
summary:
  ar: "سؤال من شاب يمنعه أهله من صلاة الجماعة في المسجد، أجابت فيه دائرة الإفتاء العام الأردنية بأن طاعتهما تجب إن كان منعهما لمصلحة ظاهرة، ولا تجب إن كان تعنتًا أو توهمًا. بيّنت الدائرة أن صلاة الجماعة مشروعة، وأقلها اثنان، وتحصل فضيلتها في البيت أو العمل، وهي فرض كفاية على الرجال المقيمين في الفرائض، وفي المسجد أفضل للرجل، وذكرت أعذار تركها العامة كالمطر والبرد الشديدين، والخاصة كالمرض والخوف على النفس أو المال. وقالت إن منع الوالدين إن كان لمصلحة ظاهرة وحفظ للولد من مكروه يغلب على ظنهما وقوعه، كمرض في وقت وباء أو خطف أو اعتداء عند الفتن، أو لمصلحة لهما ككبر أو مرض أو أنس به، وجبت طاعتهما. وإن كان على سبيل التعنت أو التوهم فلا تجب الطاعة إذا كان الولد عاقلًا رشيدًا، لأن الطاعة الواجبة هي ما فيه مصلحة ظاهرة لهما، واستشهدت بجواب لابن حجر الهيتمي في الفتاوى الفقهية الكبرى عن أب منع ولده الرشيد من طلب العلم خوفًا من صحبة الأشرار. وختمت بأن على الولد أن يتلطف بوالديه في كل حال."
  en: "A question from a young man whose family stop him from praying in congregation at the mosque, in which Jordan's General Iftaa Department answered that he must obey them if they forbid it for a clear benefit, but need not if they act from obstinacy or imagined fears. The Department explained that congregational prayer is established, needs at least two people, and its merit can be had at home or at work; it is a communal obligation on resident men for the obligatory prayers and is better for men in the mosque, and it listed the general excuses for missing it, such as heavy rain or severe cold, and personal ones such as illness or fear for one's life or property. It said that if the parents forbid it for a clear benefit, to protect their son from a harm they think likely, such as illness during an epidemic or kidnapping or assault in times of unrest, or for their own benefit, such as old age, illness or wanting his company, he must obey them. If they act from obstinacy or imagined fears, obedience is not required of a sane, mature son, since the obedience owed is in what clearly benefits them; it cited a reply of Ibn Hajar al-Haytami in al-Fatawa al-Fiqhiyya al-Kubra about a father who kept his mature son from seeking knowledge for fear of bad company. It closed by saying that the son should be gentle with his parents in every case."
  ur: "ایک نوجوان کا سوال جسے اس کے گھر والے مسجد میں باجماعت نماز سے روکتے ہیں، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر وہ کسی واضح مصلحت سے روکیں تو اطاعت لازم ہے، اور اگر ضد یا وہم کی بنا پر روکیں تو لازم نہیں۔ ڈیپارٹمنٹ نے واضح کیا کہ باجماعت نماز مشروع ہے، اس کے لیے کم از کم دو افراد چاہییں، اور اس کی فضیلت گھر یا کام کی جگہ بھی حاصل ہو سکتی ہے؛ یہ مقیم مردوں پر فرض نمازوں میں فرضِ کفایہ ہے اور مرد کے لیے مسجد میں افضل ہے، اور اس نے جماعت چھوڑنے کے عمومی عذر، جیسے شدید بارش یا سردی، اور ذاتی عذر، جیسے بیماری یا جان و مال کا خوف، بیان کیے۔ اس نے کہا کہ اگر والدین کسی واضح مصلحت سے روکیں، بیٹے کو ایسے نقصان سے بچانے کے لیے جس کا انہیں غالب گمان ہو، جیسے وبا کے دوران بیماری یا فتنوں میں اغوا یا حملہ، یا اپنی مصلحت کے لیے، جیسے بڑھاپا، بیماری یا اس کی صحبت کی خواہش، تو اطاعت لازم ہے۔ اور اگر وہ ضد یا وہم کی بنا پر روکیں تو عاقل اور سمجھ دار بیٹے پر اطاعت لازم نہیں، کیونکہ واجب اطاعت اسی میں ہے جس میں ان کی واضح مصلحت ہو؛ اس نے ابن حجر الہیتمی کی الفتاویٰ الفقہیۃ الکبریٰ کے ایک جواب سے استدلال کیا جو ایسے باپ کے بارے میں تھا جس نے بری صحبت کے خوف سے اپنے سمجھ دار بیٹے کو علم حاصل کرنے سے روکا۔ آخر میں اس نے کہا کہ بیٹا ہر حال میں والدین سے نرمی کا برتاؤ کرے۔"
  es: "Un joven, cuya familia le impedía rezar en congregación en la mezquita, consultó con el Departamento General de Iftaa de Jordania, quien respondió que debía obedecerles si la prohibición existía por un bien evidente, pero no si se debía a obstinación o temores infundados. El Departamento explicó que la oración en congregación es una práctica establecida, requiere al menos dos personas y su beneficio puede obtenerse en casa o en el trabajo; es una obligación comunitaria para los hombres residentes en el lugar de oración y es preferible para los hombres en la mezquita. Asimismo, enumeró las excusas generales para no asistir, como fuertes lluvias o frío intenso, y las personales, como enfermedad o temor por la vida o los bienes. Añadió que si los padres la prohibían por un bien evidente, para proteger a su hijo de un daño que consideraban probable, como una enfermedad durante una epidemia, un secuestro o una agresión en tiempos de disturbios, o por su propio beneficio, como la vejez, una enfermedad o el deseo de su compañía, debía obedecerles. Si actúan por obstinación o temores infundados, no se exige obediencia a un hijo cuerdo y maduro, puesto que la obediencia debida se centra en aquello que claramente le beneficia. Se citó una respuesta de Ibn Hajar al-Haytami en al-Fatawa al-Fiqhiyya al-Kubra sobre un padre que impedía a su hijo maduro buscar conocimiento por temor a las malas compañías. Se concluyó diciendo que el hijo debe ser amable con sus padres en todo caso."
  fr: "Un jeune homme, dont la famille l'empêche de prier en congrégation à la mosquée, a posé une question au Département général de la Iftaa de Jordanie. Ce dernier a répondu qu'il devait obéir à sa famille si cette interdiction était justifiée par un intérêt manifeste, mais qu'il n'y était pas tenu si elle était motivée par l'obstination ou des craintes infondées. Le Département a expliqué que la prière en congrégation est une institution, qu'elle requiert la présence d'au moins deux personnes et qu'elle peut être accomplie à domicile ou au travail. Il s'agit d'une obligation communautaire pour les hommes résidant à la mosquée, et il est préférable pour eux de la pratiquer. Le Département a énuméré les motifs généraux d'absence, tels que les fortes pluies ou le froid intense, ainsi que les motifs personnels, comme la maladie ou la crainte pour sa vie ou ses biens. Il a précisé que si les parents interdisent la prière en congrégation pour un intérêt manifeste, afin de protéger leur fils d'un danger qu'ils jugent probable, comme une maladie lors d'une épidémie, un enlèvement ou une agression en période de troubles, ou pour leur propre bien, comme la vieillesse, la maladie ou le désir de sa compagnie, l'enfant doit leur obéir. Si les parents agissent par obstination ou par crainte irrationnelle, l'obéissance n'est pas exigée d'un fils sain d'esprit et mûr, car l'obéissance due concerne ce qui leur est manifestement profitable. Le texte cite une réponse d'Ibn Hajar al-Haytami dans al-Fatawa al-Fiqhiyya al-Kubra, à propos d'un père qui empêchait son fils adulte d'acquérir des connaissances par crainte de mauvaises fréquentations. Il conclut en affirmant que le fils doit se montrer bienveillant envers ses parents en toutes circonstances."
  tr: "Ailesi camide cemaat namazını yapmasını engelleyen genç bir adamın sorusuna gelince, Ürdün Genel Fetva Dairesi, önlemenin açık bir fayda için yapılıyorsa itaatin zorunlu olduğunu, inatçılık veya yanılsamadan değil diye yanıtladı. Daire, cemaat namazının en az iki istisna dışında zorunlu olduğunu ve erdeminin evde veya işte sağlandığını açıkladı. Bu, zorunlu görevlerde yaşayan erkekler için toplu bir yükümlülüktür. camide olması erkekler için daha iyidir. Kamuoyunun onu ihmal etmesi için şiddetli yağmur ve soğuk gibi bahaneler ve hastalık ile kendisi ya da servet korkusu gibi özel nedenler belirtildi. Ebeveynlerin zarardan korunmasının, çoğunlukla salgın sırasında hastalık, kaçırılma veya duruşma sırasında saldırı gibi görünür bir fayda ve çocuğu korumak için ya da yaşlılık, hastalık veya arkadaşlık gibi kendi yararı için yapıldığı ve itaatin zorunlu olduğu belirtildi. Eğer inatçılık veya yanılsama ile yapılırsa, itaat zorunlu değildir; eğer çocuk aklı, sağlam ve makul ise, çünkü zorunlu itaat görünüşte onlar için faydalıdır. İbn Hajar al-Haytami'nin, kötü adamların varlığından korktuğu için bilge oğlunun bilgi aramasını yasakladığı büyük fıkıh fetvalarında verdiği bir cevabı aktardım. Çocuğun her durumda ebeveynlerine iyi davranması gerektiği sonucuna vardı."
  id: "Sebuah pertanyaan dari seorang pemuda yang keluarganya mencegahnya berdoa berjamaah di masjid, Departemen Fatwa Umum Yordania menjawab bahwa ketaatan terhadap doa tersebut wajib jika pencegahan itu untuk manfaat yang jelas, bukan karena keras kepala atau delusi. Departemen menjelaskan bahwa shalat jemaat diwajibkan, dengan paling sedikit dua pengecualian, dan kebajikan itu dicapai di rumah atau di tempat kerja. Ini adalah kewajiban kolektif bagi pria yang menjalankan tugas wajib, dan di masjid lebih baik untuk pria. Departemen tersebut menyebutkan alasan untuk mengabaikannya oleh masyarakat umum, seperti hujan deras dan dingin, serta alasan spesifik seperti sakit dan ketakutan terhadap diri sendiri atau kekayaan. Departemen menyatakan bahwa mencegah orang tua dari bahaya terutama diduga terjadi jika itu untuk manfaat yang tampak dan untuk melindungi anak dari bahaya, seperti sakit selama wabah, penculikan, atau serangan selama ujian, atau demi kepentingan mereka sendiri, seperti usia tua, sakit, atau kebersamaan, dan ketaatan mereka wajib. Jika dilakukan karena keras kepala atau delusi, ketaatan tidak wajib jika anak itu waras, sehat, dan masuk akal, karena ketaatan wajib adalah yang tampaknya menguntungkan bagi mereka. Saya mengutip tanggapan Ibn Hajar al-Haytami dalam fatwa yurisprudensi utama tentang seorang ayah yang melarang putranya yang bijaksana mencari ilmu karena takut akan kebersamaan dengan orang jahat. Dia menyimpulkan bahwa anak harus bersikap baik kepada orang tuanya dalam segala keadaan."
