id: work/fatwa-binbaz-is-semen-pure-or-impure
class: work
kind: fatwa
label: { ar: "هل المني طاهر أم نجس؟", en: "Is semen ritually pure or impure?", ur: "منی پاک ہے یا ناپاک؟" }
summary:
  ar: "سؤال عن طهارة المني ونجاسته وهل يكفي فركه إن كان يابسًا وغسله إن كان رطبًا، أجاب فيه ابن باز بأن المني على الصحيح طاهر وهو أصل الإنسان، مستدلًا بقول عائشة إن النبي ربما غسله وربما فركه وأنها كانت تفركه يابسًا من ثوبه، فدل الاكتفاء بالحك والتنظيف بدون ماء على طهارته إذ لو كان نجسًا لغُسل، ولأن الإنسان طاهر وأصله التراب الطاهر ثم المني فهو طاهر."
  en: "A question whether semen is ritually pure or impure, and whether rubbing it off suffices when dry and washing when wet; Ibn Baz answered that on the correct view semen is pure, being the origin of the human being, citing Aisha's statement that the Prophet sometimes washed it and sometimes rubbed it off, and that she used to scrape it dry from his garment, which shows its purity, since had it been impure it would have had to be washed rather than merely scraped and cleaned without water; and because the human being is pure, his origin in earth is pure, and so semen, which comes after, is pure."
  ur: "منی کے پاک یا ناپاک ہونے اور یہ کہ خشک ہو تو کھرچنا اور تر ہو تو دھونا کافی ہے یا نہیں، کے بارے میں سوال؛ ابن باز نے جواب دیا کہ صحیح قول پر منی پاک ہے اور انسان کی اصل ہے، عائشہ کے اس قول سے استدلال کرتے ہوئے کہ نبی کبھی اسے دھوتے اور کبھی کھرچتے تھے، اور وہ خود اسے ان کے کپڑے سے خشک کھرچتی تھیں، جو اس کی پاکی پر دلالت کرتا ہے، کیونکہ اگر ناپاک ہوتا تو دھونا ضروری ہوتا نہ کہ محض کھرچ کر پانی کے بغیر صاف کرنا؛ اور اس لیے کہ انسان پاک ہے، اس کی اصل مٹی پاک ہے، اور پھر منی جو اس کے بعد ہے وہ بھی پاک ہے۔"
