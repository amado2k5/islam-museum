label: { ar: "تعليل الأحكام الشرعية", en: "Reasoning out the sharia's rulings — no bar to it", ur: "شرعی احکام کی تعلیل", es: "Razonar sobre las normas de la sharia: no hay ningún impedimento para ello.", fr: "Raisonner les règles de la charia — aucun obstacle", tr: "Şeriat Hükümlerinin Açıklaması", id: "Penjelasan Putusan Syariah" }
summary:
  ar: "سأل سائل عن أدلة التي منعت تعليل الأحكام في الشريعة. أجاب د. وليد بسيوني ⁦(فتوى رقم 21835 بتاريخ 19 فبراير 2006)⁩ أنه لا مانع من تعليل الأحكام في الشريعة الإسلامية والقياس حجة عند المذاهب الأربعة المتبوعة ولا يتم القياس إلا بتعليل الأحكام وإلحاق المسكوت عنه بالمنطوق به في الحكم لاشتراكهما في علة ذلك الحكم، فلعل السائل قرأ أن بعض المسائل التعبدية غير معقولة المعنى ولا يدري علتها مثل كون الظهر أربع ركعات والمغرب ثلاث أو كون الصوم في رمضان لا شعبان فحسب أن كل الأحكام كذلك وهذا ليس بصحيح."
  en: "A questioner asked for the proofs forbidding reasoning out the sharia's rulings. Dr. Walid Basyouni (fatwa no. 21835, 19 February 2006) answered that nothing bars ta'lil of the Islamic sharia's rulings — analogy is a proof at the four followed madhhabs, and it runs only by reasoning out rulings and annexing the unspoken to the spoken in judgment for their sharing its cause; perhaps the questioner read that some worship-matters are not intelligible in meaning — the noon prayer four and the sunset three, fasting Ramadan and not Sha'ban — and supposed all rulings like that, which is not so."
  ur: "ایک سائل نے احکام کی تعلیل سے روکنے کی دلیل پوچھی۔ ڈاکٹر وليد بسيوني ⁦(فتویٰ 21835، 19 فروری 2006)⁩ کے مطابق تعلیل جائز ہے اور قیاس اسی پر مبنی ہے؛ بس بعض عبادات کی علت معقول نہیں۔"
  es: "Un consultante solicitó pruebas que prohibieran razonar las normas de la sharia. El Dr. Walid Basyouni (fatwa n.º 21835, 19 de febrero de 2006) respondió que nada impide el ta'lil de las normas de la sharia islámica; la analogía es una prueba en las cuatro madhhabs seguidas, y se basa únicamente en el razonamiento de las normas y la anexión de lo tácito a lo tácito en el juicio, ya que comparten su causa. Quizás el consultante interpretó que algunos asuntos de culto no son inteligibles en su significado —las cuatro oraciones del mediodía y las tres del atardecer, el ayuno de Ramadán y no el de Sha'ban— y supuso que todas las normas eran así, lo cual no es cierto."
  fr: "Un interlocuteur a demandé les preuves interdisant de déduire les règles de la charia par le raisonnement. Le Dr Walid Basyouni (fatwa n° 21835, 19 février 2006) a répondu que rien n'interdit le ta'lil (interprétation) des règles de la charia islamique. L'analogie constitue une preuve valable pour les quatre écoles juridiques (madhhabs) suivies, et elle repose uniquement sur le raisonnement des règles et l'intégration du non-dit au dit dans le jugement, afin d'en comprendre la cause commune. L'interlocuteur a peut-être interprété que certaines pratiques religieuses sont inintelligibles – la prière de midi quatre fois et celle du coucher du soleil trois fois, le jeûne du Ramadan et non celui de Sha'ban – et a supposé que toutes les règles étaient ainsi, ce qui est erroné."
  tr: "Şeriatta hükümlerin gerekçelendirilmesini engelleyen deliller hakkında bir soru soruldu. Dr. Walid Basyouni (19 Şubat 2006 tarihli 21835 No'lu Fetva), İslami Şeriat'ta hükümleri haklı çıkarmaya itiraz olmadığını ve benzetmenin dört izlenen okula göre bir kanıt olduğunu yanıtladı. Benzetme, ancak hükümleri açıklayıp hükümde belirtilenlere söylenmeyenleri ekleyerek geçerlidir; çünkü bu kişiler de bu hükmün sebebini paylaşır. Belki soru soran kişi, bazı ibadet eylemlerinin anlam olarak makul olmadığını okumuş ve nedenlerini bilmediğini okumuştur; örneğin Dhuhr dört rekât, Mağrib'in üç rekat olması ya da Ramazan'da oruç tutulması ve Şaban olmaması gibi, tüm hükümler böyledir ve bu doğru değildir."
  id: "Seorang penanya ditanya tentang bukti yang menghalangi penalaran putusan dalam Syariah. Dr. Walid Basyouni (Fatwa No. 21835 tanggal 19 Februari 2006) menjawab bahwa tidak ada keberatan untuk membenarkan putusan dalam Syariah Islam, dan analogi adalah bukti menurut empat aliran yang diikuti. Analogi hanya berlaku dengan menjelaskan putusan dan menambahkan apa yang tidak diucapkan pada apa yang dinyatakan dalam putusan, karena keduanya berbagi alasan di balik putusan tersebut. Mungkin penanya membaca bahwa beberapa tindakan ibadah tidak masuk akal dalam makna, dan dia tidak mengetahui alasannya, seperti Dhuhr adalah empat rak'ah dan Maghrib tiga rak'ah, atau puasa pada Ramadan bukan Sha'ban, semua putusan seperti ini, dan ini tidak benar."
