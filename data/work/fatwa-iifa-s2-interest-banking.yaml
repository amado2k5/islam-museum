summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية ⁦(الكويت، ديسمبر 1985م)⁩: كل زيادة أو فائدة على الدين الذي حل أجله وعجز المدين عن الوفاء مقابل تأجيله وكذلك الزيادة على القرض منذ بداية العقد ربا محرم شرعًا، والبديل الضامن للسيولة والنشاط الاقتصادي في الصورة التي يرتضيها الإسلام هو التعامل وفق الأحكام الشرعية ومنها المصارف الإسلامية على ما فصّل القرار."
  en: "IIFA's second-session resolution (Kuwait, December 1985): any increase or interest on a matured debt the debtor cannot repay in exchange for deferral, and likewise the increase on a loan from the contract's start, are both riba forbidden in the sharia; the alternative securing liquidity and economic activity in the form Islam accepts is dealing under sharia rulings including the Islamic banks — as the resolution details."
  ur: "اکیڈمی کی دوسری مجلس کی قرارداد ⁦(کویت، دسمبر 1985ء)⁩: مقروض کی تاخیر پر اضافہ اور قرض کے آغاز سے اضافہ دونوں ربا اور حرام ہیں؛ متبادل شرعی معاملات بشمول اسلامی بینک۔"
