label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن التعامل المصرفي بالفوائد وحكم التعامل بالمصارف الإسلامية", en: "IIFA resolution on interest-based banking and dealing with Islamic banks", ur: "اکیڈمی کی قرارداد: سودی بینکاری اور اسلامی بینکوں سے معاملات", es: "Resolución de la IIFA sobre banca basada en intereses y trato con bancos islámicos", fr: "Résolution de l'IIFA sur les services bancaires basés sur les intérêts et les relations avec les banques islamiques", tr: "Uluslararası İslami Fiqh Akademisi'nin faiz bazlı bankacılık ile ilgili kararı ve İslami bankalarda işlem yapma kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai perbankan berbasis bunga dan putusan mengenai transaksi di bank-bank Islam" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية ⁦(الكويت، ديسمبر 1985م)⁩: كل زيادة أو فائدة على الدين الذي حل أجله وعجز المدين عن الوفاء مقابل تأجيله وكذلك الزيادة على القرض منذ بداية العقد ربا محرم شرعًا، والبديل الضامن للسيولة والنشاط الاقتصادي في الصورة التي يرتضيها الإسلام هو التعامل وفق الأحكام الشرعية ومنها المصارف الإسلامية على ما فصّل القرار."
  en: "IIFA's second-session resolution (Kuwait, December 1985): any increase or interest on a matured debt the debtor cannot repay in exchange for deferral, and likewise the increase on a loan from the contract's start, are both riba forbidden in the sharia; the alternative securing liquidity and economic activity in the form Islam accepts is dealing under sharia rulings including the Islamic banks — as the resolution details."
  ur: "اکیڈمی کی دوسری مجلس کی قرارداد ⁦(کویت، دسمبر 1985ء)⁩: مقروض کی تاخیر پر اضافہ اور قرض کے آغاز سے اضافہ دونوں ربا اور حرام ہیں؛ متبادل شرعی معاملات بشمول اسلامی بینک۔"
  es: "Resolución de la segunda sesión de la IIFA (Kuwait, diciembre de 1985): cualquier aumento o interés sobre una deuda vencida que el deudor no pueda pagar a cambio de un aplazamiento, y de igual manera el aumento sobre un préstamo desde el inicio del contrato, son ambos usura prohibida por la sharia; la alternativa para asegurar la liquidez y la actividad económica en la forma que acepta el Islam es operar bajo las normas de la sharia, incluidos los bancos islámicos, como se detalla en la resolución."
  fr: "Résolution de la deuxième session de l'IIFA (Koweït, décembre 1985): toute augmentation ou tout intérêt sur une dette arrivée à échéance que le débiteur ne peut rembourser en échange d'un report, ainsi que l'augmentation d'un prêt dès le début du contrat, constituent tous deux du riba interdit par la charia; l'alternative garantissant la liquidité et l'activité économique sous la forme acceptée par l'islam consiste à traiter conformément aux règles de la charia, y compris les banques islamiques — comme le détaille la résolution."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin ikinci oturumunda (Kuveyt, Aralık 1985) Kararı: Vadesi geçmiş ve borçlunun erteleme nedeniyle ödeyemediği bir borcun artışı veya faizi ile sözleşmenin başından itibaren kredi üzerindeki herhangi bir artış, Şeriat tarafından yasaklanmış tefeciliktir. İslam'ın kabul ettiği biçimde likidite ve ekonomik faaliyeti garanti eden alternatif, kararda detaylandırıldığı üzere İslami bankalar da dahil olmak üzere Şeriat hükümlerine göre işlem yapmaktır."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi kedua (Kuwait, Desember 1985): Setiap kenaikan atau bunga atas utang yang jatuh tempo dan debitur tidak dapat melunasi karena penundaan, serta kenaikan pinjaman sejak awal kontrak, dilarang riba oleh Syariah. Alternatif yang menjamin likuiditas dan aktivitas ekonomi dalam bentuk yang diterima oleh Islam adalah dengan mengatur berdasarkan putusan Syariah, termasuk bank Islam, sebagaimana dijelaskan dalam keputusan."
