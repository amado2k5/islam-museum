  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: جمع أحكام الأسهم والاختيارات والسلع والعملات وصكوك المقارضة والاستثمار الصادرة في قرارات المجمع السابقة ⁦(63 (7/1) و30 (4/5) وغيرها)⁩ مما يمكن الإفادة منه لإقامة سوق المال الإسلامية، وبيّن التطبيقات على ما فصّل."
