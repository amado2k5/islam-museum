label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن تطبيقات شرعية لإقامة السوق الإسلامية", en: "IIFA resolution on sharia applications for establishing the Islamic market", ur: "اکیڈمی کی قرارداد: اسلامی منڈی کے قیام کے شرعی اطلاقات", es: "Resolución de la IIFA sobre las aplicaciones de la sharia para el establecimiento del mercado islámico.", fr: "Résolution de l'IIFA sur les applications de la charia pour l'établissement du marché islamique", tr: "Uluslararası İslami Fiqh Akademisi'nin İslami Pazarın Kurulması İçin Şeriat Başvurularına İlişkin Kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai Aplikasi Syariah untuk Mendirikan Pasar Islam" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: جمع أحكام الأسهم والاختيارات والسلع والعملات وصكوك المقارضة والاستثمار الصادرة في قرارات المجمع السابقة ⁦(63 (7/1) و30 (4/5) وغيرها)⁩ مما يمكن الإفادة منه لإقامة سوق المال الإسلامية، وبيّن التطبيقات على ما فصّل."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on sharia applications for establishing the Islamic market: it gathers the Academy's earlier rulings on shares, options, commodities, currencies and muqarada and investment certificates — resolutions 63 (7/1), 30 (4/5) and others — as usable groundwork for an Islamic capital market."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩: سابقہ قراردادوں ⁦(حصص، اختیارات، سکرٹفکیٹس)⁩ کو اسلامی منڈی کے قیام کے لیے یکجا کیا۔"
  es: "La resolución de la octava sesión de la IIFA (Brunéi, junio de 1993) sobre las aplicaciones de la sharia para el establecimiento del mercado islámico: reúne las resoluciones anteriores de la Academia sobre acciones, opciones, materias primas, divisas y muqarada y certificados de inversión —resoluciones 63 (7/1), 30 (4/5) y otras— como base útil para un mercado de capitales islámico."
  fr: "Résolution de la huitième session de l'IIFA (Brunei, juin 1993) sur les applications de la charia pour l'établissement du marché islamique: elle rassemble les décisions antérieures de l'Académie sur les actions, les options, les matières premières, les devises et les certificats de muqarada et d'investissement — résolutions 63 (7/1), 30 (4/5) et autres — comme base utilisable pour un marché des capitaux islamique."
  tr: "Uluslararası İslami Fiqh Akademisi'nin sekizinci oturumunda (Brunei, Haziran 1993): İslami finans piyasasının kurulmasında kullanılabilecek önceki Karmaşık kararlarda (63 (7/1) ve 30 (4/5) ve diğerleri) çıkarılan hisseler, opsiyonlar, emtialar, para birimleri ile kredi ve yatırım araçlarına ilişkin karşılıkların toplanması ve başvuruların ayrıntılı şekilde açıklanması."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi kedelapan (Brunei, Juni 1993): Pengumpulan ketentuan atas saham, opsi, komoditas, mata uang, serta instrumen pinjaman dan investasi yang diterbitkan dalam keputusan Kompleks sebelumnya (63 (7/1) dan 30 (4/5) dan lainnya) yang dapat digunakan untuk membentuk pasar keuangan Islam, serta menguraikan aplikasi sesuai rincian."
