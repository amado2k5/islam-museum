label: { ar: "قرار مجمع الفقه الإسلامي الدولي 153 (17/2) بشأن الإفتاء: شروطه وآدابه", en: "IIFA resolution 153 (17/2) on ifta: its conditions and etiquettes", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 153 (17/2): افتاء — اس کی شرائط اور آداب", es: "Resolución 153 (17/2) de la IIFA sobre el ifta: sus condiciones y protocolo", fr: "Résolution 153 (17/2) de l'IIFA sur l'IFTA: ses conditions et son étiquette", tr: "Fetva: Koşulları ve Nezaketi ile İlgili Uluslararası İslami Fiqh Akademisi Kararı 153 (17/2)", id: "Keputusan Akademi Fiqh Islam Internasional 153 (17/2) mengenai Fatwa: Ketentuan dan Etiket" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩. عرّف الإفتاء ببيان الحكم الشرعي عند السؤال عنه أو بغير سؤال لبيان حكم النازلة لتصحيح أوضاع الناس، والمفتي بالعالم بالأحكام والوقائع القادر على استنباط الأحكام من أدلتها وتنزيلها على الحوادث، مبينًا عظم شأن الفتوى لكونها بيانًا لشرع الله. وعدّد شروط المفتي منها: العلم بكتاب الله وسنة رسوله وما يتعلق بهما؛ العلم بمواطن الإجماع والخلاف والمذاهب والآراء الفقهية؛ المعرفة التامة بأصول الفقه ومبادئه وقواعده؛ ومعرفة الواقع وفقه الموازنات وتحقيق المناط وتخريج الفروع على الأصول وفقه المقاصد ومراتبها؛ وأن يكون عدلًا ثقة في دينه وعلمه. ثم سرد آداب المفتي والمستفتي وضوابط التعامل مع الفتاوى والتحذير ممن يتصدى للإفتاء بغير أهلية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006). It defined ifta as stating the legal ruling when asked, or without being asked to explain the ruling of an occurrence so people's affairs are set right; and the mufti as the scholar of rulings and events able to derive rulings from their evidences and apply them to occurrences — stressing the fatwa's gravity as an exposition of God's law. Conditions of the mufti it lists: knowledge of the Book and the Sunna and their related sciences; knowledge of the points of consensus and disagreement, the schools and juristic opinions; complete knowledge of usul al-fiqh and its principles and maxims; knowledge of reality, the jurisprudence of balancing, identifying the effective cause, deriving branches from roots and the jurisprudence of the maqasid and their levels; and being upright and trustworthy in religion and knowledge. It then set out the etiquettes of mufti and mustafti, controls for handling fatwas, and warnings against unqualified ifta."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں۔ اس نے افتاء کی تعریف کی: پوچھے جانے پر شرعی حکم بیان کرنا یا بلا سوال کسی نازلہ کا حکم بیان کرنا تاکہ لوگوں کے معاملات درست ہوں؛ اور مفتی کی: احکام اور واقعات کا وہ عالم جو ادلہ سے احکام نکال کر حوادث پر منطبق کر سکے — اور اس پر زور دیا کہ فتویٰ اللہ کی شریعت کا بیان ہونے کے سبب بہت سنجیدہ ہے۔ مفتی کی شرائط: کتاب اور سنت اور ان سے متعلق علوم کا علم؛ اجماع و اختلاف کے مواقع، مذاہب اور فقہی آراء کا علم؛ اصولِ فقہ اور اس کے مبادی و قواعد کا مکمل علم؛ واقعہ پرسوں کا شعور، فقہِ موازنات، تحقیقِ مناط، اصولوں پر فروع کے تخریج اور فقہِ مقاصد و مراتب؛ اور دین و علم میں عدل و ثقہ ہونا۔ پھر مفتی اور مستفتی کے آداب، فتاویٰ سے معاملے کے ضوابط اور غیر اہل افتاء سے خبردار کیا گیا۔"
  es: "Resolución colectiva de la Academia Internacional de Fiqh Islámico en su 17.ª sesión en Ammán (28 de Jumada al-Ula – 2 de Jumada al-Akhira de 1427, 24–28 de junio de 2006). Definió la ifta como la declaración del dictamen legal cuando se le solicita, o sin que se le solicite para explicar el dictamen de un suceso para que los asuntos de las personas se enderecen; y al muftí como el erudito de dictámenes y eventos capaz de derivar dictámenes de sus evidencias y aplicarlos a los sucesos, enfatizando la gravedad de la fatwa como una exposición de la ley de Dios. Las condiciones del muftí enumera: conocimiento del Corán y la Sunna y sus ciencias relacionadas; conocimiento de los puntos de consenso y desacuerdo, las escuelas y opiniones jurídicas; conocimiento completo de usul al-fiqh y sus principios y máximas; conocimiento de la realidad, la jurisprudencia del equilibrio, la identificación de la causa efectiva, la derivación de ramas de raíces y la jurisprudencia de los maqasid y sus niveles; y ser íntegro y digno de confianza en la religión y el conocimiento. Luego estableció las normas de etiqueta del muftí y el mustaftí, los controles para el manejo de fatuas y las advertencias contra las ifta no calificadas."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 17e session à Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24-28 juin 2006). Elle définit l'ifta comme l'énoncé de la décision juridique, qu'elle soit demandée ou non, afin d'éclairer les affaires des personnes concernées. Le mufti est défini comme le savant des règles et des événements, capable de déduire des décisions à partir de leurs preuves et de les appliquer aux situations, soulignant ainsi la gravité de la fatwa en tant qu'interprétation de la loi divine. Parmi les qualités requises pour être mufti, la résolution énumère: la connaissance du Coran et de la Sunna, ainsi que des sciences connexes; la connaissance des points de consensus et de désaccord, des écoles et des avis juridiques; la connaissance approfondie de l'usul al-fiqh, de ses principes et maximes; la connaissance du réel, de la jurisprudence de l'équilibre, de l'identification de la cause déterminante, de la dérivation des branches à partir des racines et de la jurisprudence des maqasid et de leurs niveaux; et l'intégrité et la fiabilité en matière de religion et de science. Il exposait ensuite les règles de bienséance du mufti et du mustafti, les contrôles relatifs à la gestion des fatwas et les mises en garde contre les ifta non qualifiées."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on yedinci oturumunda Amman'daki toplu kararı (28 Cumedõvvel – 2 Cumedül-Akhirah 1427 H, 24–28 Haziran 2006). Fetva, sorgulanmadığında yasal hükümler vermesi, insanların durumunu düzeltmek için bir durumu netleştirmesi ve delillerinden hüküm çıkarıp olaylara uygulayabilen bir müfti olarak tanınır; fetvanın, Allah'ın kanununun bir ifadesi olması nedeniyle büyük önemini açıklar. Müftünün şartlarını sıraladı; bunlar arasında: Allah'ın Kitabı ve Elçi'nin Sünneti hakkında bilgi; uzlaşma, anlaşmazlık, mezhebler ve fıkıh görüşleri hakkında bilgi; fıkıhın ilkeleri, ilkeleri ve kuralları hakkında kapsamlı bilgi; gerçeklik bilgisi, karşılaştırma fıhhihi, temellerin doğrulanması, ilkelere dayalı dalların türetilmesi, amaçların ve bunların düzeylerinin fıhhihi; ve dini ve bilgilerinde adil ve güvenilir olmak. Sonra müfti ve fetva sorgulayan kişilerin görgü kurallarını, fetvalarla başa çıkma kurallarını ve fetva arayanlara karşı uyarıyı sıraladı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ketujuh belas di Amman (28 Jumada al-Awwal – 2 Jumada al-Akhirah 1427 H, 24–28 Juni 2006 M). Fatwa dikenal karena mengeluarkan putusan hukum saat dipertanyakan atau tidak, untuk memperjelas putusan suatu situasi guna memperbaiki kondisi masyarakat, dan sebagai mufti yang memahami putusan dan fakta, mampu mengambil keputusan dari bukti dan menerapkannya pada peristiwa, menjelaskan pentingnya fatwa karena merupakan ekspresi hukum Tuhan. Ia mencantumkan syarat-syarat mufti, termasuk: pengetahuan tentang Kitab Allah dan Sunnah Rasul-Nya serta hal-hal terkait; pengetahuan tentang poin-poin konsensus, perbedaan pendapat, mazhab, dan pendapat firih. pengetahuan mendalam tentang prinsip, prinsip, dan aturan firisprudensi; pengetahuan tentang kenyataan, yurisprudensi perbandingan, verifikasi dasar-dasarnya, penarikan cabang berdasarkan prinsip, yurisprudensi tujuan dan tingkatnya; serta menjadi adil dan dapat dipercaya dalam agama dan pengetahuan mereka. Kemudian ia mencantumkan etiket mufti dan penanyai fatwa, aturan dalam menangani fatwa, serta peringatan terhadap mereka yang mencari fatwa tanpa syarat."
