summary:
  ar: "الشرح الكبير الذي وعد به المرغيناني في أول بداية المبتدي، ثم رأى فيه إطناباً فصرف عنايته إلى الهداية؛ يحيل عليه في الهداية في أكثر من عشرين موضعاً. يذكر طاش كبري زاده أنه في نحو ثمانين مجلداً، ويقول العيني إنه مفقود لم يوجد في العراق والشام ومصر، ولم يقف عليه محقق الهداية. {cite:hidaya-bakdash-v1 p.31} {cite:hidaya-bakdash-v1 p.32} {cite:hidaya-bakdash-v1 p.33}"
  en: "The large commentary al-Marghinani promised at the start of Bidayat al-Mubtadi; finding it too long, he turned to al-Hidaya, where he refers to it in more than twenty places. Tashkopruzade puts it at about eighty volumes; al-Ayni says it was lost, not found in Iraq, Syria or Egypt; the editor of al-Hidaya did not find it."
  ur: "وہ بڑی شرح جس کا وعدہ مرغینانی نے بدایۃ المبتدی کے آغاز میں کیا، پھر اس میں طوالت دیکھ کر ہدایہ کی طرف متوجہ ہوئے، جس میں بیس سے زیادہ مقامات پر اس کا حوالہ دیتے ہیں۔ طاش کبری زادہ کے مطابق یہ تقریباً اسی جلدوں میں تھی؛ عینی کہتے ہیں کہ یہ مفقود ہے، عراق، شام اور مصر میں نہیں ملی؛ ہدایہ کے محقق کو بھی نہیں ملی۔"
  es: "El extenso comentario que al-Marghinani prometió al comienzo de Bidayat al-Mubtadi, al considerarlo demasiado largo, lo llevó a consultar al-Hidaya, donde lo menciona en más de veinte ocasiones. Tashkopruzade lo sitúa en unos ochenta volúmenes; al-Ayni afirma que se perdió, que no se encontró ni en Irak, ni en Siria, ni en Egipto; el editor de al-Hidaya tampoco lo halló."
  fr: "Le volumineux commentaire promis par al-Marghinani au début de Bidayat al-Mubtadi; le jugeant trop long, il se tourna vers al-Hidaya, où il y fait référence à plus de vingt reprises. Tashkopruzade l'estime à environ quatre-vingts volumes; al-Ayni affirme qu'il a été perdu, introuvable en Irak, en Syrie ou en Égypte; l'éditeur d'al-Hidaya ne l'a pas retrouvé."
  tr: "Al-Marghinani'nin başlangıç döneminin başında vaat ettiği ana yorumu daha sonra fazla bulup rehberliğe yönelmiştir; yirmiden fazla yerde buna atıfta bulunur. Tash Kubrazadeh yaklaşık seksen ciltte bahseder ve Al-Ayni bunun kayıp olduğunu, Irak, Şam veya Mısır'da bulunmadığını ve Al-Hidayah'ın editörü tarafından karşılaşılmadığını söyler. {cite:hidaya-bakdash-v1 s.31} {cite:hidaya-bakdash-v1 s.32} {cite:hidaya-bakdash-v1 s.33}"
  id: "Komentar utama yang dijanjikan Al-Marghinani di awal pemula, kemudian ia menganggapnya berlebihan dan mengalihkan perhatiannya pada bimbingan; ia menyebutnya di lebih dari dua puluh tempat. Tash Kubrazadeh menyebutkannya dalam sekitar delapan puluh jilid, dan Al-Ayni mengatakan itu hilang, tidak ditemukan di Irak, Levant, atau Mesir, dan editor Al-Hidayah tidak menemukannya. {cite:hidaya-bakdash-v1 hlm.31} {cite:hidaya-bakdash-v1 hlm.32} {cite:hidaya-bakdash-v1 hlm.33}"
