label:
  ar: "كفاية المنتهي في شرح بداية المبتدي"
  en: "Kifayat al-Muntahi"
  ur: "کفایۃ المنتہی"
summary:
  ar: "الشرح الكبير الذي وعد به المرغيناني في أول بداية المبتدي، ثم رأى فيه إطناباً فصرف عنايته إلى الهداية؛ يحيل عليه في الهداية في أكثر من عشرين موضعاً. يذكر طاش كبري زاده أنه في نحو ثمانين مجلداً، ويقول العيني إنه مفقود لم يوجد في العراق والشام ومصر، ولم يقف عليه محقق الهداية. {cite:hidaya-bakdash-v1 p.31} {cite:hidaya-bakdash-v1 p.32} {cite:hidaya-bakdash-v1 p.33}"
  en: "The large commentary al-Marghinani promised at the start of Bidayat al-Mubtadi; finding it too long, he turned to al-Hidaya, where he refers to it in more than twenty places. Tashkopruzade puts it at about eighty volumes; al-Ayni says it was lost, not found in Iraq, Syria or Egypt; the editor of al-Hidaya did not find it."
  ur: "وہ بڑی شرح جس کا وعدہ مرغینانی نے بدایۃ المبتدی کے آغاز میں کیا، پھر اس میں طوالت دیکھ کر ہدایہ کی طرف متوجہ ہوئے، جس میں بیس سے زیادہ مقامات پر اس کا حوالہ دیتے ہیں۔ طاش کبری زادہ کے مطابق یہ تقریباً اسی جلدوں میں تھی؛ عینی کہتے ہیں کہ یہ مفقود ہے، عراق، شام اور مصر میں نہیں ملی؛ ہدایہ کے محقق کو بھی نہیں ملی۔"
