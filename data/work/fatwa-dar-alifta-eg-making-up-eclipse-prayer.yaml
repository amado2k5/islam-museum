summary:
  ar: "سائل سأل عن قضاء صلاة الكسوف أو الخسوف لمن لم يؤدها في وقتها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21695)⁩ أن صلاة كل من الكسوف والخسوف سنة فعلها النبي وحث عليها ويصح أداؤهما فرادى وجماعة وبيّن الجواب حكم قضائها على وجهه."
  en: "A questioner asked about making up the solar- or lunar-eclipse prayer for one who missed it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21695) answered that both eclipse prayers are sunna — practised and urged by the Prophet — valid alone or in congregation; the answer sets out the ruling on making them up."
  ur: "ایک سائل نے کسوف کی نماز قضا کرنے کا حکم پوچھا اگر وہ وقت پر نہ پڑھ سکے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21695)⁩ نے جواب دیا کہ دونوں کسوف نمازیں سنت ہیں جو تنہا اور جماعت دونوں سے ادا ہو سکتی ہیں؛ قضاء کا حکم جواب میں بیان ہوا۔"
