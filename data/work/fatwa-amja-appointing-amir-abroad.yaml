label: { ar: "تولية أمير على المسلمين في بلد غير إسلامي", en: "Appointing an amir over Muslims in a non-Islamic land", ur: "غیر اسلامی ملک میں مسلمانوں پر امیر مقرر کرنا", es: "Nombrar un emir sobre los musulmanes en un país no islámico.", fr: "Nommer un émir à la tête de musulmans dans un pays non islamique", tr: "İslam dışı bir ülkede bir prensi Müslümanların üzerine atamak", id: "Menetapkan pangeran di atas Muslim di negara non-Islam" }
summary:
  ar: "سأل سائل هل يجب تولية أمير على جماعة المسلمين في بلد غير إسلامي وهل يلقب بأمير وما صفاته. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81745 بتاريخ 25 يونيو 2010)⁩ أن الواجب بقاء المسلمين في رحاب الشريعة يحكمونها في حياتهم الاجتماعية إن عجزوا عن تحكيمها سياسيًّا، وسبيلهم أن يأرزوا إلى علمائهم ويصدروا فقهاءهم إذا خلا الزمان من السلطان الشرعي، فأولو الأمر في الأمة فريقان العلماء والأمراء فإذا غاب الأمراء وكلت الأمور إلى العلماء، والمقصود اجتماع الكلمة حول تحكيم الشريعة والإذعان لمرجعيتها أيا كانت التسمية عميدًا للجالية أو غيرها على ما فصّل."
  en: "A questioner asked whether Muslims in a non-Islamic land must appoint an amir, whether he must bear that title, and what his required qualities are. Dr. Salah al-Sawi (fatwa no. 81745, 25 June 2010) answered that the duty is for Muslims to remain within the sharia's fold, ruling their social lives by it when they cannot rule politically — resorting to their scholars and putting forward their jurists when the age lacks a lawful sultan guarding the religion and steering the world by it; the community's two orders are the scholars and the rulers, so when the rulers are absent affairs fall to the scholars; the aim is unity of word around applying the sharia and submitting to its authority, whatever the chosen title — community dean or other — as detailed."
  ur: "ایک سائل نے پوچھا کہ غیر اسلامی ملک میں مسلمانوں پر امیر مقرر کرنا واجب ہے اور اس کے اوصاف کیا ہوں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81745، 25 جون 2010)⁩ کے مطابق مسلمانوں کو شریعت کے مطابق اپنی سماجی زندگی چلانی چاہیے اور سلطان کے غیاب میں علماء کی طرف رجوع کرنا چاہیے؛ لقب کی اہمیت نہیں، مقصد شریعت کے حوالے اجتماع ہے۔"
  es: "Un interlocutor preguntó si los musulmanes en un país no islámico deben nombrar un emir, si este debe ostentar dicho título y cuáles son las cualidades que se requieren de él. El Dr. Salah al-Sawi (fatwa n.º 81745, 25 de junio de 2010) respondió que el deber de los musulmanes es permanecer dentro del marco de la sharia, rigiendo su vida social según ella cuando no pueden gobernar políticamente, recurriendo a sus eruditos y proponiendo a sus juristas cuando la época carece de un sultán legítimo que proteja la religión y guíe el mundo según ella; los dos órdenes de la comunidad son los eruditos y los gobernantes, por lo que cuando los gobernantes están ausentes, los asuntos recaen en los eruditos; el objetivo es la unidad de palabra en torno a la aplicación de la sharia y la sumisión a su autoridad, cualquiera que sea el título elegido —decano de la comunidad u otro— como se detalla."
  fr: "Un internaute a demandé si les musulmans vivant en terre non islamique devaient nommer un émir, si celui-ci devait porter ce titre et quelles étaient les qualités requises. Le Dr Salah al-Sawi (fatwa n° 81745, 25 juin 2010) a répondu que le devoir des musulmans est de demeurer conformes à la charia et de régir leur vie sociale selon elle lorsqu'ils ne peuvent exercer de pouvoir politique. Ils doivent s'en remettre à leurs savants et à leurs juristes en l'absence d'un sultan légitime garant de la religion et orientant le monde selon elle. La communauté est organisée en deux ordres: les savants et les dirigeants. En l'absence de ces derniers, les affaires incombent aux savants. L'objectif est l'unité de parole quant à l'application de la charia et la soumission à son autorité, quel que soit le titre choisi – doyen de la communauté ou autre – comme indiqué précédemment."
  tr: "Bir soru soran, İslam dışı bir ülkede Müslüman topluluğun başına bir emir atanmasının gerekli olup olmadığını, emir unvanının verilip verilmemesi gerektiğini ve niteliklerinin ne olduğunu sordu. Dr. Salah Al-Sawy (25 Haziran 2010 tarihli 81745 sayılı fetva) Müslümanların siyasi olarak uygulayamıyorlarsa şeriat alanında kalmalarının ve sosyal hayatlarında bunu yönetmelerinin zorunlu olduğunu yanıtladı. Onların yolu, zaman meşru yetki yoksa alimlerine boyun eğmek ve hukukçularını atamaktır. Ülkedeki otoriteler iki gruba ayrılır: alimler ve prensler. Prensler yoksa, işler alimlere bırakılır. Amaç, şeriatın yönetimi ve otoritesine boyun eğme konusundaki sözü, ister cemaat dekanı olarak ister başka bir şekilde belirtildiği gibi, birleştirmektir."
  id: "Seorang penanya menanyakan apakah perlu menunjuk seorang emir atas komunitas Muslim di negara non-Islam, dan apakah ia harus diberi gelar emir serta apa saja kualitasnya. Dr. Salah Al-Sawy menjawab (Fatwa No. 81745 tanggal 25 Juni 2010) bahwa Muslim wajib tetap berada dalam ranah Syariah, memerintahnya dalam kehidupan sosial mereka jika mereka tidak mampu menegakkannya secara politik. Cara mereka adalah tunduk kepada ulama dan mengeluarkan ahli hukum jika waktu tidak memiliki otoritas yang sah. Otoritas di negara ini terbagi menjadi dua kelompok: ulama dan pangeran. Jika para pangeran tidak ada, urusan dipercayakan kepada para ulama. Tujuannya adalah untuk menyatukan firman tentang pemerintahan Syariah dan penyerahan pada otoritasnya, terlepas dari penunjukan, baik sebagai dekan komunitas maupun lainnya, seperti yang dijelaskan."
