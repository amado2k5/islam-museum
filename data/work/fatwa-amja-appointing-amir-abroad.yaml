id: work/fatwa-amja-appointing-amir-abroad
class: work
kind: fatwa
label: { ar: "تولية أمير على المسلمين في بلد غير إسلامي", en: "Appointing an amir over Muslims in a non-Islamic land", ur: "غیر اسلامی ملک میں مسلمانوں پر امیر مقرر کرنا" }
summary:
  ar: "سأل سائل هل يجب تولية أمير على جماعة المسلمين في بلد غير إسلامي وهل يلقب بأمير وما صفاته. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81745 بتاريخ 25 يونيو 2010)⁩ أن الواجب بقاء المسلمين في رحاب الشريعة يحكمونها في حياتهم الاجتماعية إن عجزوا عن تحكيمها سياسيًّا، وسبيلهم أن يأرزوا إلى علمائهم ويصدروا فقهاءهم إذا خلا الزمان من السلطان الشرعي، فأولو الأمر في الأمة فريقان العلماء والأمراء فإذا غاب الأمراء وكلت الأمور إلى العلماء، والمقصود اجتماع الكلمة حول تحكيم الشريعة والإذعان لمرجعيتها أيا كانت التسمية عميدًا للجالية أو غيرها على ما فصّل."
  en: "A questioner asked whether Muslims in a non-Islamic land must appoint an amir, whether he must bear that title, and what his required qualities are. Dr. Salah al-Sawi (fatwa no. 81745, 25 June 2010) answered that the duty is for Muslims to remain within the sharia's fold, ruling their social lives by it when they cannot rule politically — resorting to their scholars and putting forward their jurists when the age lacks a lawful sultan guarding the religion and steering the world by it; the community's two orders are the scholars and the rulers, so when the rulers are absent affairs fall to the scholars; the aim is unity of word around applying the sharia and submitting to its authority, whatever the chosen title — community dean or other — as detailed."
  ur: "ایک سائل نے پوچھا کہ غیر اسلامی ملک میں مسلمانوں پر امیر مقرر کرنا واجب ہے اور اس کے اوصاف کیا ہوں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81745، 25 جون 2010)⁩ کے مطابق مسلمانوں کو شریعت کے مطابق اپنی سماجی زندگی چلانی چاہیے اور سلطان کے غیاب میں علماء کی طرف رجوع کرنا چاہیے؛ لقب کی اہمیت نہیں، مقصد شریعت کے حوالے اجتماع ہے۔"
