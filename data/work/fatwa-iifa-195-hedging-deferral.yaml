label: { ar: "قرار مجمع الفقه الإسلامي الدولي 195 (21/1) بشأن التحوط في المعاملات المالية", en: "IIFA resolution 195 (21/1) on hedging in financial transactions", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 195 (21/1): مالی معاملات میں ہیجنگ", es: "Resolución 195 (21/1) de la IIFA sobre cobertura en transacciones financieras" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية والعشرين بالرياض ⁦(15–19 محرم 1435هـ، 18–22 نوفمبر 2013م)⁩. بعد اطلاع المجلس على البحوث الواردة بخصوص التحوط في المعاملات المالية والمناقشات التي دارت حوله، قرر تأجيل إصدار قرار في الموضوع لمزيد من البحث والدرس، على أن تتناول البحوث والدراسات القادمة تحوطات المؤسسات المالية الإسلامية وكذلك البدائل الشرعية للتحوطات التقليدية. وهو قرار تأجيل لا قرار حكم؛ وقد تناول المجمع الموضوع لاحقًا في قراريه 224 ⁦(23/8)⁩ و238 ⁦(24/6)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 21st session in Riyadh (15–19 Muharram 1435, 18–22 November 2013). After reviewing the research submitted on hedging in financial transactions and the discussions around it, it resolved to postpone issuing a resolution on the subject for further research and study, provided that the coming research and studies address the hedging of Islamic financial institutions as well as the sharia alternatives to conventional hedges. A deferral, not a ruling; the Academy returned to the subject in resolutions 224 (23/8) and 238 (24/6)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں اکیسویں مجلس ⁦(15–19 محرم 1435ھ، 18–22 نومبر 2013ء)⁩ میں۔ مالی معاملات میں ہیجنگ کے موضوع پر آنے والی تحقیقات اور مباحث کے جائزے کے بعد اکیڈمی نے فیصلہ کیا کہ موضوع پر قرارداد جاری کرنا مزید تحقیق اور مطالعے کے لیے مؤجل کیا جائے، بشرطیکہ آنے والی تحقیقات اسلامی مالی اداروں کی ہیجنگ اور روایتی ہیج کے شرعی متبادل دونوں کو شامل کریں۔ یہ مؤجل کی قرارداد ہے، حکم کی نہیں؛ اکیڈمی نے بعد میں قراردادوں 224 ⁦(23/8)⁩ اور 238 ⁦(24/6)⁩ میں موضوع واپس لیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 21.ª sesión celebrada en Riad (15-19 de Muharram de 1435, 18-22 de noviembre de 2013). Tras revisar la investigación presentada sobre cobertura en transacciones financieras y los debates al respecto, se decidió aplazar la emisión de una resolución sobre el tema para profundizar en la investigación y el estudio, siempre que dicha investigación y estudios aborden tanto la cobertura de las instituciones financieras islámicas como las alternativas islámicas a las coberturas convencionales. Se trató de un aplazamiento, no de una resolución; la Academia retomó el tema en las resoluciones 224 (23/8) y 238 (24/6)."
