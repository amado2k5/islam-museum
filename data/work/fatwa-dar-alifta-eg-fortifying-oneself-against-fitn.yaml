summary:
  ar: "سائل سأل عن كيفية تحصين النفس من الفتن. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20906)⁩ أنه لكي يقوى الإنسان على مقاومة الفتن وحفظ نفسه من مكائد النفس والشيطان عليه أن يسعى ليكون عبدًا طائعًا مخلصًا على ما فصّل الجواب."
  en: "A questioner asked how to fortify oneself against temptations. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20906) answered that to resist temptations and guard against the snares of self and Satan one should strive to be an obedient, devoted servant — as the answer details."
  ur: "ایک سائل نے فتنوں سے خود کو بچانے کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20906)⁩ نے جواب دیا کہ انسان کو نفس اور شیطان کے مکر سے بچنے کے لیے اطاعت اور اخلاص کا راستہ اختیار کرنا ہوگا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó cómo fortalecerse contra las tentaciones. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20906) respondió que para resistir las tentaciones y protegerse de las trampas del ego y de Satanás, uno debe esforzarse por ser un siervo obediente y devoto, como se detalla en la respuesta."
