id: work/fatwa-dar-alifta-departing-from-a-testators-condition
class: work
kind: fatwa
label: { ar: "حكم مخالفة شرط الموصي عند عدم القدرة على الوفاء بالشرط", en: "Departing from a testator's condition when it cannot be fulfilled", ur: "وصیت کرنے والے کی شرط پوری نہ ہو سکنے پر اس کی خلاف ورزی کا حکم" }
summary:
  ar: "سؤال عن أخت متوفاة تركت أموالًا لأخيها وطلبت منه التبرع بها بعد وفاتها في تجهيز عروس يتيمة، ولا يعرف الورثة إلا عرائس فقيرات، هل يجوز تجهيز عروس فقيرة بدلًا من اليتيمة، أجابت فيه دار الإفتاء المصرية بأنه يجب على الوصي العمل بما شرط الموصي ما دام مشروعًا وممكن التنفيذ ويحرم عليه تغييره، فيجب عليه البحث عن عروس يتيمة عبر الجهات الرسمية والجمعيات المشهرة ودور رعاية الأيتام ومكاتب الشؤون الاجتماعية، فإن بذل جهده ولم يجد إلا عروسًا فقيرة جاز له استثناءً دفع المال إليها لإعانتها على الزواج. عرّفت الدار الوصية بتمليك مضاف لما بعد الموت بطريق التبرع كما قال الحطاب، وبيّنت أنها مندوبة إلا فيما على المكلف من حقوق فتجب، كما قال السرخسي والكاساني وابن رشد الجد والرافعي وابن قدامة، وأنها مقيدة بالثلث بحديث سعد بن أبي وقاص وإجماع نقله ابن بطال والمادة 37 من قانون الوصية. ثم قررت أن شروط الموصي معتبرة ويحرم تبديلها بنص آية البقرة كما فسرها ابن كثير والسرخسي وابن رشد والجويني، إلا أن هذا الأصل ترد عليه استثناءات تراعى فيها مقاصد الموصي عند تعذر تنفيذ الشرط، لأن الوصية ولاية نظرية والوصي نائب عن الميت، وأن وصف اليُتم في الوصية إنما لمظنة العجز والحاجة، فصرف المال إلى عروس فقيرة انتقال إلى أقرب الجهات في العلة لا إلى جهة أجنبية."
  en: "A question about a deceased sister who left money with her brother and asked him to give it after her death to furnish the marriage of an orphan bride, while the family know only poor brides who are not orphans, and whether a poor bride may be furnished instead; Dar al-Ifta al-Misriyya answered that the executor must act on what the testator stipulated so long as it is lawful and feasible and may not alter it, so he must search for an orphan bride through official bodies, registered charities, orphanages and social-affairs offices that keep lists of orphan girls and their needs; if he does his utmost and finds only a poor bride, he may exceptionally give the money to her to help her marry, without blame or sin. Dar al-Ifta defined a bequest as a transfer of ownership taking effect after death by way of gift, as al-Hattab says, explained that it is recommended except for debts and duties owed, where it is obligatory, as al-Sarakhsi, al-Kasani, Ibn Rushd the grandfather, al-Rafi'i and Ibn Qudama say, and that it is limited to a third of the estate by the hadith of Sa'd ibn Abi Waqqas, the consensus reported by Ibn Battal and article 37 of the Bequests Law. It then ruled that a testator's conditions are binding and may not be altered, by the text of the verse of al-Baqara as explained by Ibn Kathir, al-Sarakhsi, Ibn Rushd and al-Juwayni, but that exceptions to this rule attend to the testator's purposes when the condition cannot be carried out, since a bequest is a discretionary trust and the executor is the deceased's deputy, and the description 'orphan' in the bequest points to likely helplessness and need, so giving the money to a poor bride moves to the nearest case sharing the same rationale, not to an unrelated one."
  ur: "ایک متوفیہ بہن کے بارے میں سوال جس نے اپنے بھائی کے پاس رقم چھوڑی اور کہا کہ وفات کے بعد اسے ایک یتیم دلہن کی شادی کے سامان میں دے، جبکہ خاندان صرف ایسی غریب دلہنوں کو جانتا ہے جو یتیم نہیں، اور یہ کہ کیا یتیم کی جگہ غریب دلہن کو سامان دیا جا سکتا ہے؛ دار الافتاء مصر نے جواب دیا کہ وصی پر لازم ہے کہ وصیت کرنے والے کی شرط پر عمل کرے جب تک وہ مشروع اور قابلِ عمل ہو اور اسے بدلنا حرام ہے، لہٰذا اسے سرکاری اداروں، رجسٹرڈ تنظیموں، یتیم خانوں اور سماجی امور کے دفاتر کے ذریعے جو یتیم لڑکیوں اور ان کی ضروریات کی فہرستیں رکھتے ہیں یتیم دلہن تلاش کرنی چاہیے؛ اگر وہ پوری کوشش کرے اور صرف غریب دلہن ملے تو استثنائی طور پر اس کی شادی میں مدد کے لیے اسے رقم دے سکتا ہے، بغیر حرج اور گناہ کے۔ دار الافتاء نے وصیت کی تعریف کی کہ یہ تبرع کے طور پر موت کے بعد کی طرف مضاف تملیک ہے، جیسا کہ حطاب نے کہا، بیان کیا کہ یہ مستحب ہے سوائے مکلف پر لازم حقوق کے جن میں واجب ہے، جیسا کہ سرخسی، کاسانی، ابن رشد جد، رافعی اور ابن قدامہ نے کہا، اور یہ کہ سعد بن ابی وقاص کی حدیث، ابن بطال کے نقل کردہ اجماع اور وصیت کے قانون کی دفعہ 37 سے یہ ترکے کے تہائی تک محدود ہے۔ پھر اس نے فیصلہ کیا کہ وصیت کرنے والے کی شرطیں معتبر ہیں اور سورہ بقرہ کی آیت کی نص سے جیسا کہ ابن کثیر، سرخسی، ابن رشد اور جوینی نے اس کی تفسیر کی انہیں بدلنا حرام ہے، لیکن اس اصول پر استثنا وارد ہوتے ہیں جن میں شرط پر عمل ناممکن ہونے پر وصیت کرنے والے کے مقاصد کا لحاظ کیا جاتا ہے، کیونکہ وصیت ایک نظری ولایت ہے اور وصی میت کا نائب ہے، اور وصیت میں یتیم کا وصف محتاجی اور ضرورت کے گمان کے لیے ہے، لہٰذا رقم غریب دلہن کو دینا اسی علت میں شریک قریب ترین جہت کی طرف منتقلی ہے نہ کہ کسی اجنبی جہت کی طرف۔"
