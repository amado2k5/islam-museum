label:
  ar: "التفسير الوسيط للقرآن الكريم"
  en: "al-Tafsir al-Wasit lil-Qur'an al-Karim (Tantawi)"
  ur: "التفسیر الوسیط للقرآن الکریم (طنطاوی)"
summary:
  ar: "تفسير كامل للقرآن في خمسة عشر مجلدًا كتبه محمد سيد طنطاوي في نحو خمسة عشر عامًا وفرغ منه بالقاهرة في 26 ربيع الأول 1407هـ (28 نوفمبر 1986م)؛ وصفه صاحبه بأنه تفسير «وسيط» علمي محرَّر من الأقوال الضعيفة، يبدأ بشرح الألفاظ ثم سبب النزول المقبول ثم المعنى الإجمالي، ويقدّم لكل سورة بتمهيد عن عدد آياتها ومكان نزولها وأسمائها ومقاصدها."
  en: "A complete commentary on the Qur'an in fifteen volumes, written by Muhammad Sayyid Tantawi over some fifteen years and finished in Cairo on 26 Rabi' I 1407 AH (28 November 1986). Its author called it a 'middle-sized' scholarly commentary, purged of weak opinions, that explains the words, then gives any accepted occasion of revelation, then the overall meaning, and opens each sura with an introduction on its verse count, place of revelation, names and aims."
  ur: "قرآن کی مکمل تفسیر، پندرہ جلدوں میں، جو محمد سید طنطاوی نے تقریباً پندرہ برس میں لکھی اور 26 ربیع الاول 1407ھ (28 نومبر 1986ء) کو قاہرہ میں مکمل کی۔ مصنف نے اسے «وسیط» (درمیانے حجم کی) علمی تفسیر کہا جو کمزور اقوال سے پاک ہو؛ اس میں پہلے الفاظ کی شرح، پھر مقبول سببِ نزول، پھر اجمالی معنی آتا ہے، اور ہر سورت سے پہلے اس کی آیات کی تعداد، مقامِ نزول، ناموں اور مقاصد پر تمہید ہے۔"
