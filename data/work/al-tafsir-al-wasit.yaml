structure: "15 مجلدًا: (1) الفاتحة والبقرة؛ (2) آل عمران؛ (3) النساء؛ (4) المائدة؛ (5) الأنعام والأعراف؛ (6) الأنفال والتوبة؛ (7) من يونس إلى إبراهيم؛ (8) الحجر والنحل والإسراء والكهف؛ (9) مريم وطه والأنبياء والحج؛ (10) المؤمنون والنور والفرقان والشعراء والنمل والقصص؛ (11) من العنكبوت إلى فاطر؛ (12) يس والصافات وص والزمر وغافر وفصلت؛ (13) من الشورى إلى ق؛ (14) من الذاريات إلى التحريم؛ (15) جزءا تبارك وعم."
