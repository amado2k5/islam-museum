label: { ar: "حق العباد على الله وأسئلة الشبهات", en: "Creatures' right upon God, and recurring doubts", ur: "مخلوق کا اللہ پر حق اور شکوک کے جوابات", es: "El derecho de las criaturas ante Dios y las dudas recurrentes", fr: "Le droit des créatures sur Dieu et les doutes récurrents", tr: "Hizmetkârların hakları Tanrı'ya ve şüphe sorularına bağlıdır", id: "Hak para hamba ada pada Tuhan dan pertanyaan tentang keraguan" }
summary:
  ar: "سأل سائل عن شبهات تتردد تفسد الدين وطلب جوابًا مفصلًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86832 بتاريخ 8 مايو 2012)⁩ مفتتحًا بأنه ليس للناس على الله حق إلا ما أحقه الله على نفسه، وقد أحق على نفسه لعباده حقوقًا منها نصرة المؤمنين وألا يعذب من لم يشرك به شيئًا كما في حديث معاذ في الصحيحين، وأن هذا حق وجب بكلماته التامة ووعده الصادق لا أن العبد مستحق على الله كاستحقاق المخلوق على المخلوق، ثم تابع الأجوبة على ما ورد."
  en: "A questioner raised recurring doubts harming religion and asked for detailed answers. Dr. Salah al-Sawi (fatwa no. 86832, 8 May 2012) opened that creatures hold no right upon God except what God Himself made binding: He bound Himself to aiding the believers and to not punishing whoever associates nothing with Him, per Mu'adh's hadith in the two Sahihs — a right due by His perfect words and true promise, not a creature's claim on God like one creature's on another — then pursued the remaining answers, as recorded."
  ur: "ایک سائل نے دین کو نقصان پہنچانے والے شکوک کے تفصیلی جواب مانگے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86832، 8 مئی 2012)⁩ نے کھولا کہ مخلوق کا اللہ پر کوئی حق نہیں سوائے جو اس نے خود اپنے اوپر لازم کیا — مومنین کی نصرت اور مشرک نہ کرنے والے کو عذاب نہ دینا — اور باقی جوابات دیے۔"
  es: "Un consultante planteó dudas recurrentes que perjudicaban la religión y solicitó respuestas detalladas. El Dr. Salah al-Sawi (fatwa n.º 86832, 8 de mayo de 2012) explicó que las criaturas no tienen ningún derecho sobre Dios excepto el que Dios mismo estableció como vinculante: se comprometió a ayudar a los creyentes y a no castigar a quien no le asocia nada, según el hadiz de Mu'adh en los dos Sahihs; un derecho derivado de Sus palabras perfectas y su verdadera promesa, no una pretensión de una criatura sobre Dios como la de otra. Luego, continuó con las respuestas restantes, tal como se registraron."
  fr: "Un internaute a soulevé des doutes récurrents, préjudiciables à la religion, et a demandé des réponses détaillées. Le Dr Salah al-Sawi (fatwa n° 86832, 8 mai 2012) a expliqué que les créatures ne possèdent aucun droit sur Dieu, si ce n'est celui que Dieu Lui-même a rendu obligatoire: Il s'est engagé à secourir les croyants et à ne punir personne qui ne Lui associe rien, conformément au hadith de Mu'adh rapporté dans les deux recueils authentiques (Sahihs) – un droit découlant de Ses paroles parfaites et de Sa promesse véritable, et non une prétention d'une créature envers Dieu, comme une créature pourrait en avoir envers une autre. Il a ensuite développé les autres réponses, telles qu'elles ont été rapportées."
  tr: "Bir soruya dini yozlaştıran söylentiler hakkında sordu ve ayrıntılı bir cevap istedi. Dr. Salah Al-Sawy (8 Mayıs 2012 tarihli Fetva No. 86832) yanıtladı ve insanların Allah üzerinde hakkı olmadığını, sadece Allah'ın kendisine verdiği hakkın olduğunu söyledi. Kendisi üzerindekileri kendisi üzerinde, inananları desteklemek ve kendisiyle hiçbir şey ilişkisi olmayanları cezalandırmamak da dahil olmak üzere, Muadh'ın iki sahih hadisinde olduğu gibi, kendisi üzerinde haklar vermiştir. Bu, O'nun tam sözlerinde ve samimi sözünde zorunlu olan bir haktır, hizmetin yaratılanın yaratılanlar üzerindeki iyiliği gibi Allah'a layık olduğu anlamına gelmez. Sonra cevapları belirtildiği gibi devam etti."
  id: "Ia menanyakan kepada penanya tentang rumor keraguan yang merusak agama dan meminta jawaban yang rinci. Dr. Salah Al-Sawy menjawab (Fatwa No. 86832 tanggal 8 Mei 2012), membuka dengan mengatakan bahwa orang tidak memiliki hak atas Allah kecuali apa yang Allah berikan kepada-Nya. Ia telah memberikan hak atas diri-Nya kepada para hamba-Nya, termasuk mendukung umat beriman dan tidak menghukum mereka yang tidak mengaitkan apa pun dengan-Nya, seperti dalam hadis Mu'adh dalam dua Sahih. Ini adalah hak yang wajib dalam kata-kata lengkapnya dan janji tulus-Nya, bukan berarti hamba itu layak menerima Allah seperti jasa yang diciptakan atas yang diciptakan. Kemudian ia melanjutkan jawaban seperti yang telah disebutkan."
