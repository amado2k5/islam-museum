kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 21: فقه الهجرة"
  en: "The Biography of the Messenger of God 2026, episode 21: Jurisprudence of Emigration"
  ur: "سیرتِ رسول اللہ 2026، قسط 21: ہجرت کا فقہ"
  fr: "La biographie du Messager de Dieu 2026, épisode 21 : Le droit de l'émigration"
  es: "La biografía del Mensajero de Dios 2026, episodio 21: La jurisprudencia de la emigración"
summary:
  ar: "يفتتح المحاضر بتعريف بسيرة جعفر بن أبي طالب، ويبيّن كيف يزن روايات الواقدي، ثم ينتقل إلى الأحكام الفقهية المستفادة من الهجرة إلى الحبشة: متى تجب الهجرة من بلاد الكفر، وأنواع الديار الثلاثة، وحال النجاشي. ويختم بعرض لموضوعات سورة النحل في مواجهة اعتراضات قريش."
  en: "The lecturer opens with a biographical portrait of Jafar ibn Abi Talib, including how he judges the reports of al-Waqidi, then turns to the legal rulings drawn from the migration to Abyssinia: when emigration from a land of unbelief is required, the three kinds of territory, and the case of the Negus. He closes with a survey of the themes of Surat al-Nahl against the objections of the Quraysh."
  ur: "مقرر پہلے جعفر بن ابی طالب کا سوانحی تعارف پیش کرتے ہیں اور بتاتے ہیں کہ وہ واقدی کی روایات کو کس طرح پرکھتے ہیں، پھر ہجرت حبشہ سے نکلنے والے فقہی احکام کی طرف آتے ہیں: دارالکفر سے ہجرت کب لازم ہے، دیار کی تین قسمیں، اور نجاشی کا معاملہ۔ آخر میں قریش کے اعتراضات کے مقابل سورہ النحل کے موضوعات کا جائزہ لیتے ہیں۔"
  fr: "Le conférencier ouvre par un portrait biographique de Jafar ibn Abi Talib, dont il montre comment il juge les récits d'al-Waqidi, puis passe aux règles juridiques tirées de l'émigration en Abyssinie : quand l'émigration hors d'une terre d'incroyance est obligatoire, les trois sortes de territoire et le cas du Négus. Il conclut par un survol des thèmes de la sourate al-Nahl face aux objections des Qurayshites."
  es: "El conferenciante abre con un retrato biográfico de Jafar ibn Abi Talib, incluido cómo juzga los relatos de al-Waqidi, y pasa luego a las normas jurídicas que se extraen de la emigración a Abisinia: cuándo es obligatoria la emigración desde una tierra de incredulidad, las tres clases de territorio y el caso del Negus. Cierra con un repaso de los temas de la sura al-Nahl frente a las objeciones de los quraishíes."
