id: work/fatwa-amja-climax-without-intercourse
class: work
kind: fatwa
label: { ar: "الذروة دون وطء", en: "Climax without intercourse — the washing still binds", ur: "بغیر وطء ذروہ — غسل واجب", es: "Clímax sin coito: el lavado aún ata", fr: "Climax sans rapport sexuel — le lavage continue de lier" }
summary:
  ar: "سألت امرأة أن زوجها يداعبها فتصل إلى مرحلة الشبق والذروة دون أن يوطئها هل يجب عليها الاغتسال. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80851 بتاريخ 21 يناير 2010)⁩ أن الغسل يجب بالوطء ولو بغير إنزال وبالإنزال ولو بغير وطء فمن وصلت إلى الذروة ولا يكون ذلك غالبًا إلا بالإنزال فإنه يجب عليها الغسل سواء أوطأها زوجها أم لم يطأها على ما فصّل الجواب."
  en: "A woman whose husband's foreplay brings her to climax without intercourse asked whether washing binds her. Dr. Salah al-Sawi (fatwa no. 80851, 21 January 2010) answered that washing binds on intercourse even without emission, and on emission even without intercourse; one reaching the peak — which mostly comes only with emission — owes the washing whether her husband entered her or not — as the answer details."
  ur: "بغیر دخول ذروہ پر پہنچنا — غسل؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80851، 21 جنوری 2010)⁩ کے مطابق انزال ہو جائے تو غسل واجب ہے چاہے وطء ہو یا نہ ہو۔"
  es: "Una mujer cuyo marido la lleva al clímax con los preliminares sin penetración preguntó si el lavado la obligaba a realizarlo. El Dr. Salah al-Sawi (fatwa n.º 80851, 21 de enero de 2010) respondió que el lavado obliga a realizarlo incluso con penetración y sin eyaculación, y también con eyaculación y sin penetración; quien alcanza el clímax —que generalmente solo se produce con eyaculación— debe realizar el lavado independientemente de si su marido la penetró o no, como se detalla en la respuesta."
  fr: "Une femme, dont le mari lui procure un orgasme sans pénétration, a demandé si les ablutions l'obligeaient à se purifier. Le Dr Salah al-Sawi (fatwa n° 80851, 21 janvier 2010) a répondu que les ablutions lient à la fois à la pénétration, même sans éjaculation, et à l'éjaculation, même sans pénétration; celle qui atteint l'orgasme – qui survient généralement avec éjaculation – doit accomplir les ablutions, que son mari l'ait pénétrée ou non, comme le précise la réponse."
