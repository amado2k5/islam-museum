id: work/fatwa-amja-climax-without-intercourse
class: work
kind: fatwa
label: { ar: "الذروة دون وطء", en: "Climax without intercourse — the washing still binds", ur: "بغیر وطء ذروہ — غسل واجب" }
summary:
  ar: "سألت امرأة أن زوجها يداعبها فتصل إلى مرحلة الشبق والذروة دون أن يوطئها هل يجب عليها الاغتسال. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80851 بتاريخ 21 يناير 2010)⁩ أن الغسل يجب بالوطء ولو بغير إنزال وبالإنزال ولو بغير وطء فمن وصلت إلى الذروة ولا يكون ذلك غالبًا إلا بالإنزال فإنه يجب عليها الغسل سواء أوطأها زوجها أم لم يطأها على ما فصّل الجواب."
  en: "A woman whose husband's foreplay brings her to climax without intercourse asked whether washing binds her. Dr. Salah al-Sawi (fatwa no. 80851, 21 January 2010) answered that washing binds on intercourse even without emission, and on emission even without intercourse; one reaching the peak — which mostly comes only with emission — owes the washing whether her husband entered her or not — as the answer details."
  ur: "بغیر دخول ذروہ پر پہنچنا — غسل؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80851، 21 جنوری 2010)⁩ کے مطابق انزال ہو جائے تو غسل واجب ہے چاہے وطء ہو یا نہ ہو۔"
