id: work/fatwa-iifa-210-istihala-istihlak-additives
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 210 (22/6) بشأن الاستحالة والاستهلاك في المواد الإضافية في الغذاء والدواء", en: "IIFA resolution 210 (22/6) on istihala (transformation) and istihlak (dissolution) in additive substances in food and medicine", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 210 (22/6): خوراک اور ادویہ میں اضافی اجزاء میں استحالہ اور استہلاک", es: "Resolución 210 (22/6) de la IIFA sobre istihala (transformación) e istihlak (disolución) en sustancias aditivas en alimentos y medicamentos.", fr: "Résolution 210 (22/6) de l'IIFA sur l'istihala (transformation) et l'istihlak (dissolution) des substances additives dans les aliments et les médicaments", tr: "Gıda ve ilaçta katkı maddelerinin tüketimi ve imkansızlığı ile ilgili Uluslararası İslami Fiqh Akademisi Kararı 210 (22/6)", id: "Resolusi Akademi Fiqh Islam Internasional 210 (22/6) mengenai ketidakmungkinan dan konsumsi bahan tambahan dalam makanan dan obat-obatan" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩. اعتمد تعريف الاستحالة في قراره 198 ⁦(21/4)⁩ مع إضافة: تغير حقيقة المادة النجسة أو المحرم تناولها وانقلاب عينها إلى مادة أخرى مختلفة في الاسم والخصائص والصفات، ويعبر عنها علميًا بكل تفاعل كيميائي كامل كتحويل الشحوم إلى صابون وتحلل المادة إلى مكوناتها، ويحصل بالوسائل العلمية وغير المنظورة كالتخليل والإحراق، وأما التفاعل الجزئي فليس استحالة فتبقى المادة النجسة على حالها ولا يجوز استخدامها؛ والاستهلاك انغمار عين في عين تزول معه صفات وخصائص العين المغمورة ولا يمكن تمييزها. وأرجأ موضوع بلازما الدم لمعطيات جديدة بتشكيل لجنة مختصين، وأبقى الاستهلاك مؤجلًا لمزيد بحث. وتبنى فتوى المنظمة الإسلامية للعلوم الطبية ⁦(الكويت 1415هـ/1995م)⁩: الكحول غير نجس شرعًا صرفًا أو مخففًا فيجوز استخدامه طبيًا مطهرًا ومذيبًا وفي الروائح والكريمات دون الخمر لحرمة الانتفاع به؛ لا مانع من الأدوية المحتوية نسبة ضئيلة من الكحول للحفظ أو الإذابة عند عدم وجود بديل؛ يحرم تناول غذاء يحتوي نسبة من الخمور مهما ضلت؛ ويجوز غذاء استعمل في تصنيعه قدر ضئيل من الكحول مذيبًا لعموم البلوى وتبخره أثناء التصنيع مع الحرص على البدائل؛ والأغذية الداخل في تركيبها شحم الخنزير محرمة مطلقًا؛ والجيلاتين أحيل لمزيد بحث. وفي الهرمونات والإنزيمات: هيبارين الخنزير لا يجوز إلا للضرورة وتعديله للوزن الجزيئي المنخفض ليس استحالة، والمحضر بالهندسة الوراثية دون أجزاء الخنزير لا حرج فيه؛ إنسولين الخنزير لا يجوز لوجود البديل والإنسولين البشري ونظائره بالهندسة الوراثية جائز؛ الصمامات البديلة المعدنية والحيوية جائزة وصمام الخنزير للضرورة فقط. وفي الإنفحة: إنفحة الخنزير محرمة نجسة، والمأخوذة من حيوان مأكول مذكى طاهرة حلال، ومن غير مذكى أو ميتة رأى أغلب المشاركين عدم طهارتها وبعضهم طهارتها، والمحضرة بالهندسة الوراثية جائزة. وجوز استخدام مياه الصرف الصحي المعالجة في العادات وغسل المنازل والزراعات غير المأكولة ما لم تضر، وفي الأكل والشرب إن لم تضر، ولا تجوز في العبادات إلا بعد التحقق من طهارتها، وأوصى بمعالجتها واجبًا شرعيًا درءًا للمفاسد وبترشيد المياه ومتابعة البحث والرقابة والتحقق من سلامة المحاصيل والتعريف بالمنتجات والاستفادة من المخلفات في إنتاج الطاقة. وقرر عدم جواز الأعلاف المحتوية مخلفات الميتة والدم ولحم الخنزير والهرمونات والمضادات الحيوية لأضرارها البالغة بصحة الإنسان، وأوصى الدول الإسلامية بالتحري عند استيراد الأعلاف."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015). It adopted the definition of istihala in its resolution 198 (21/4) with an addition: the change of the reality of an impure or forbidden substance and the turning of its substance into another different in name, properties and attributes — expressed scientifically as every complete chemical reaction, such as converting fats into soap or decomposing a substance into components; it occurs by technical means and unperceived means such as pickling and burning, while a partial reaction is not istihala, an impure substance remaining as is and impermissible to use. Istihlak is the immersion of one substance in another such that the immersed substance's attributes vanish and it cannot be distinguished. Blood plasma was deferred for a specialists' committee given new data, and istihlak remained deferred for further research. It adopted the Islamic Organisation for Medical Sciences fatwa (Kuwait 1415/1995): alcohol is not legally impure, pure or diluted, so it may be used medically as a disinfectant, solvent, in perfumes and creams — but not wine, benefiting from it being forbidden; medicines containing a minute percentage of alcohol for preservation or dissolution are unobjectionable where no alternative exists; food containing any proportion of wine is forbidden to consume however small; food manufactured with a tiny amount of alcohol as solvent is permissible given general necessity and its evaporation during manufacture, with preference for alcohol-free alternatives; foods containing pork fat are absolutely forbidden; gelatin was referred for further study. On hormones and enzymes: porcine heparin only in necessity, its low-molecular modification not being istihala, while heparin made by genetic engineering without pig parts is unobjectionable; porcine insulin impermissible given the halal alternative, human insulin and its recombinant analogues permissible; replacement heart valves, metallic or biological, permissible, porcine valves only in necessity. On rennet: porcine rennet forbidden and impure; from a properly slaughtered edible animal pure and lawful; from unslaughtered or carrion, most participants held it impure, some held it pure; recombinant rennet permissible. Treated wastewater may be used in ordinary habits — washing homes and clothes, non-edible crops — unless harmful; in food and drink if harmless; not in worship until its purity is verified; treating it was called a legal duty to ward off harm, with recommendations on water rationalisation, research, oversight, crop safety, labelling and energy from waste. Feed containing carrion waste, blood, pork, hormones or antibiotics is impermissible to use for its grave harm to human health, and Islamic states were advised to verify imported feed."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ میں۔ اکیڈمی نے اپنی قرارداد 198 ⁦(21/4)⁩ کی استحالہ کی تعریف ایک اضافے کے ساتھ منظور کی: نجس یا حرام مادے کی حقیقت کا بدل جانا اور اس کا دوسرے مادے میں — نام، خصوصیات اور صفات میں مختلف — ڈھل جانا؛ سائنسی اصطلاح میں ہر مکمل کیمیائی تعامل جیسے چربی کو صابن بنانا یا مادے کا اجزاء میں تحلل ہونا؛ یہ فنی اور غیر مرئی ذرائع جیسے اچار بنانا اور جلانا دونوں سے ہوتا ہے، جبکہ جزوی تعامل استحالہ نہیں اور نجس مادہ اپنی حالت پر رہتا ہے اور استعمال جائز نہیں۔ استہلاک ایک شے کا دوسری میں اس طرح غرق ہونا کہ غرق شدہ کی صفات ختم ہو جائیں اور ممیز نہ ہو۔ خون کی پلازما نئے معلومات کی بنا پر ماہرین کی کمیٹی کو دی گئی اور استہلاک مزید تحقیق کے لیے مؤجل رہا۔ اکیڈمی نے اسلامی آرگنائزیشن فار میڈیکل سائنسز کا فتویٰ ⁦(کویت 1415ھ/1995ء)⁩ اپنایا: الکحل شرعاً نجس نہیں، خالص ہو یا پانی سے ملیا — طبی استعمال جیسے جراثیم کش، سالوینٹ، پرفیوم اور کریم میں جائز، مگر شراب نہیں کیونکہ اس سے فائدہ حرام ہے؛ ادویہ میں حفظ یا تحلیل کے لیے الکحل کی معمولی مقدار جائز ہے جب متبادل نہ ہو؛ شراب والی خوراک کتنی ہی کم ہو حرام؛ جس خوراک میں مذیب کے طور پر معمولی الکحل استعمال ہوا وہ جائز ہے عمومی استطاعت اور پکاتے وقت اڑ جانے کی وجہ سے، بشرطیکہ الکحل سے پاک متبادل کی ترجیح ہو؛ سور کی چربی والی خوراک قطعاً حرام؛ جیلیٹن مزید تحقیق کو دیا گیا۔ ہارمونز اور اینزائمز: سور کا ہیپرین صرف ضرورت میں، اس کا کم مالیکیولر وزن کرنا استحالہ نہیں، اور سور کے حصوں کے بغیر جینیاتی انجینئرنگ سے بنا ہیپرین جائز؛ سور کا انسولین جائز متبادل کی موجودگی میں ممنوع، انسانی اور جینیاتی انسولین جائز؛ دھات یا حیاتی دل کے وال جائز، سور کا وال صرف ضرورت میں۔ رینٹ: سور کا رینٹ نجس حرام، حلال ذبح شدہ کھانے کے جانور کا پاک حلال، غیر ذبح شدہ یا مردار کا اکثریت کے نزدیک ناپاک، بعض کے نزدیک پاک، اور جینیاتی رینٹ جائز۔ صاف کیے گئے گٹر کے پانی کا استعمال عادات میں — گھر اور کپڑے دھونا، غیر خوردنی فصلیں — جائز جب نقصان نہ ہو؛ کھانے پینے میں بھی اگر نقصان نہ ہو؛ عبادات میں طہارت کی تصدیق کے بغیر نہیں؛ اس کی صفائی شرعی فرض ہے مفسدہ روکنے کے لیے، اور پانی کی کفایت، تحقیق، نگرانی، فصلوں کی سلامتی، لیبلنگ اور فضلہ سے توانائی کی سفارشیں کیں۔ مردار کے فضلہ، خون، سور کا گوشت، ہارمونز اور اینٹی بایوٹکس والی چارے کا استعمال جائز نہیں انسانی صحت پر شدید نقصان کی وجہ سے، اور اسلامی ممالک کو درآمد چارے کی تصدیق کی تلقین کی۔"
  es: "Resolución colectiva de la Academia Internacional de Juqh Islámico en su 22.ª sesión en Kuwait (2-5 de Jumada al-Akhira de 1436, 22-25 de marzo de 2015). Adoptó la definición de istihala en su resolución 198 (21/4) con una adición: el cambio de la realidad de una sustancia impura o prohibida y la transformación de su sustancia en otra diferente en nombre, propiedades y atributos, expresado científicamente como toda reacción química completa, como convertir grasas en jabón o descomponer una sustancia en componentes; ocurre por medios técnicos y medios imperceptibles como el encurtido y la combustión, mientras que una reacción parcial no es istihala, una sustancia impura que permanece como está y cuyo uso es inadmisible. Istihlak es la inmersión de una sustancia en otra de tal manera que los atributos de la sustancia sumergida desaparecen y no se puede distinguir. El plasma sanguíneo se aplazó para un comité de especialistas a la luz de nuevos datos, e istihlak permaneció aplazado para futuras investigaciones. Adoptó la fatwa de la Organización Islámica para las Ciencias Médicas (Kuwait 1415/1995): el alcohol no es legalmente impuro, puro o diluido, por lo que puede usarse médicamente como desinfectante, solvente, en perfumes y cremas, pero no el vino, beneficiándose de que esté prohibido; los medicamentos que contienen un porcentaje mínimo de alcohol para conservación o disolución no son objetables cuando no existe alternativa; los alimentos que contienen cualquier proporción de vino están prohibidos para el consumo por pequeña que sea; los alimentos elaborados con una pequeña cantidad de alcohol como solvente son permisibles dada la necesidad general y su evaporación durante la elaboración, con preferencia por alternativas sin alcohol; los alimentos que contienen grasa de cerdo están absolutamente prohibidos; la gelatina fue remitida para un estudio más profundo. Sobre hormonas y enzimas: la heparina porcina solo en necesidad, su modificación de bajo peso molecular no es istihala, mientras que la heparina hecha por ingeniería genética sin partes de cerdo no es objetable; la insulina porcina no es permisible dada la alternativa halal, la insulina humana y sus análogos recombinantes son permisibles; Válvulas cardíacas de reemplazo, metálicas o biológicas, permitidas, válvulas porcinas solo en caso de necesidad. Sobre el cuajo: el cuajo porcino está prohibido e impuro; el de un animal comestible debidamente sacrificado es puro y lícito; de animales no sacrificados o carroña, la mayoría de los participantes lo consideraron impuro, algunos lo consideraron puro; el cuajo recombinante es permisible. Las aguas residuales tratadas pueden usarse en hábitos comunes —lavar casas y ropa, cultivos no comestibles— a menos que sean dañinas; en alimentos y bebidas si son inocuas; no en el culto hasta que se verifique su pureza; su tratamiento se consideró un deber legal para evitar daños, con recomendaciones sobre racionalización del agua, investigación, supervisión, seguridad de los cultivos, etiquetado y energía a partir de residuos. El alimento que contiene desechos de carroña, sangre, carne de cerdo, hormonas o antibióticos no está permitido debido a su grave daño para la salud humana, y se aconsejó a los estados islámicos que verificaran el alimento importado."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) a été adoptée lors de sa 22e session au Koweït (2-5 Jumada al-Akhira 1436, soit 22-25 mars 2015). Elle a repris la définition d'istihala de sa résolution 198 (21/4), en y ajoutant: la modification de la nature d'une substance impure ou interdite et sa transformation en une autre substance différente par son nom, ses propriétés et ses attributs. Scientifiquement, cela s'exprime par toute réaction chimique complète, comme la transformation des graisses en savon ou la décomposition d'une substance en ses composants. Ce processus peut être réalisé par des moyens techniques ou imperceptibles, tels que le saumurage et la combustion. En revanche, une réaction partielle n'est pas istihala, la substance impure restant inchangée et inutilisable. L'istihlak est l'immersion d'une substance dans une autre de telle sorte que les attributs de la substance immergée disparaissent et qu'elle ne puisse plus être distinguée. L'étude du plasma sanguin a été reportée à un comité de spécialistes compte tenu des nouvelles données, et la question de l'istihlak est restée en suspens pour des recherches complémentaires. Elle a adopté la fatwa de l'Organisation islamique des sciences médicales (Koweït 1415/1995): l'alcool n'est pas considéré comme impur, pur ou dilué au sens juridique du terme; il peut donc être utilisé médicalement comme désinfectant, solvant, dans les parfums et les crèmes – mais pas le vin, ce dernier étant interdit; les médicaments contenant un faible pourcentage d'alcool pour leur conservation ou leur dissolution ne posent pas de problème en l'absence d'alternative; la consommation d'aliments contenant du vin, même en petite quantité, est interdite; les aliments fabriqués avec une infime quantité d'alcool comme solvant sont autorisés en cas de nécessité générale et compte tenu de son évaporation lors de la fabrication, avec une préférence pour les alternatives sans alcool; les aliments contenant de la graisse de porc sont absolument interdits; la gélatine a été renvoyée pour des études complémentaires. Concernant les hormones et les enzymes: l'héparine porcine n'est autorisée qu'en cas de nécessité, sa modification à faible poids moléculaire n'étant pas halal, tandis que l'héparine produite par génie génétique sans parties de porc ne pose pas de problème; l'insuline porcine est interdite étant donné l'existence d'une alternative halal, l'insuline humaine et ses analogues recombinants étant autorisés; les valves cardiaques de remplacement, métalliques ou biologiques, sont autorisées, les valves porcines n'étant autorisées qu'en cas de nécessité. Concernant la présure: la présure porcine est interdite et considérée comme impure; celle provenant d’un animal comestible abattu selon les rites est pure et licite; quant à la présure provenant d’animaux non abattus ou de charognes, la plupart des participants la jugeaient impure, tandis que certains la considéraient pure; la présure recombinante est autorisée. Les eaux usées traitées peuvent être utilisées pour les besoins courants – lavage du linge et des habitations, arrosage des cultures non comestibles – sauf si elles sont nocives; elles peuvent également être utilisées pour l’alimentation et les boissons si elles sont inoffensives; elles ne peuvent être utilisées pour le culte tant que leur pureté n’a pas été vérifiée. Le traitement des eaux usées est considéré comme une obligation légale pour prévenir tout dommage, avec des recommandations relatives à la rationalisation de l’utilisation de l’eau, à la recherche, au contrôle, à la sécurité des cultures, à l’étiquetage et à la valorisation énergétique des déchets. L’utilisation d’aliments contenant des déchets de charognes, du sang, du porc, des hormones ou des antibiotiques est interdite en raison de leurs graves risques pour la santé humaine, et il a été conseillé aux États islamiques de contrôler les aliments importés."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Kuveyt Devleti'ndeki yirmi ikinci oturumunda (2–5 Jumada al-Akhirah 1436 H, 22–25 Mart 2015) toplu kararı. İmkansızlık tanımı, 198 (21/4) sayılı kararında kabul edilmiş ve eklenmiş olup: tüketilecek kirli veya yasak maddenin gerçekliğinin değiştirilmesi ve isim, özellik ve nitelikte farklı başka bir maddeye dönüşmesi. Bu, bilimsel olarak yağın sabuna dönüştürülmesi ve maddenin bileşenlerine çözünmesi gibi bilimsel ve görünmeyen yöntemlerle yapılan turşu ve yakma gibi yöntemlerle gerçekleşir. Kısmi reaksiyonlar için imkansız değildir, çünkü kirli madde değişmeden kalır ve kullanılamaz; tüketim, gözün bir kaba daldırılmasıdır ve bu da suya batmış gözün özelliklerini ve niteliklerini kaybeder ve ayırt edilemez. Kan plazması konusu, yeni veriler için özel bir komite kurularak ertelendi ve tüketim daha ileri araştırmalar için ertelendi. İslami Tıp Bilimleri Örgütü fetvası (Kuveyt 1415 Hicri / 1995 M.S.) şunu kabul etti: Alkol İslam hukukuna göre tamamen saf değildir veya seyreltilmiş değildir, bu nedenle tıbbi amaçlarla, dezenfekte ve dezenfekte olarak, alkolsüz parfüm ve kremlerde kullanılabilir; alternatif yoksa, az miktarda alkol içeren ilaçların korunması veya çözünmesi için itiraz yoktur; alkol içeren yiyeceklerin ne kadar yanlış sapmış olursa olsun tüketilmesi yasaktır; az miktarda alkol içeren gıdaların genel rahatsızlıkları çözüp üretim sırasında buharlaşması ve alternatiflerin sağlanması izinlidir; iç yağı içeren yiyecekler kesinlikle yasaktır; ve jelatin daha ileri araştırmalar için yönlendirilmiştir. Hormonlar ve enzimler açısından: domuz heparini yalnızca zorunluluktan izin verilir ve düşük moleküler ağırlığa modifiye edilmesi imkansız değildir. Domuz parçaları olmadan hazırlanan genetik mühendislik sorun değildir; domuz insülini ikame madde varlığı nedeniyle izin verilmez, insan insülini ve genetik mühendislik yoluyla muadilleri kabul edilir; metal ve biyolojik replasman kapakçıkları izinlidir ve domuz kapakçıkları sadece zorunluluk nedeniyle gereklidir. İnfaha durumunda: domuz şişirilebilir kapanlar yasaktır ve saf değildir, helal yenen hayvandan alınır; çoğu katılımcı ise saf olmayan veya ölü hayvanlardan alınır; bazıları ise saf değildir. Genetik mühendislik ile hazırlanması izin verilir. Arıtılmış atık suyun gümrükte, evlerde ve yenmemiş ürünlerde zararlı olmadığı sürece kullanılması, zarar vermediği sürece yemek ve içme için kullanılması izinlidir. Temizliği doğrulanmadıkça ibadet eylemleri için izin verilmez. Zararları önlemek, suyu rasyonelleştirmek, araştırma ve izlemeye devam etmek, ürün güvenliğini doğrulamak, ürünleri tanıtmak ve atıkları enerji üretiminde kullanmak için dini bir görev olarak kabul edilmesi tavsiye edildi. Leş, kan, domuz eti, hormon ve antibiyotik içeren yemlerin insan sağlığına ciddi zararları nedeniyle kullanılmasının yasak olduğuna karar verildi ve İslam ülkelerinin yem ithalatında dikkatli olmaları tavsiye edildi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh dua di Negara Kuwait (2–5 Jumada al-Akhirah 1436 H, 22–25 Maret 2015 M). Definisi ketidakmungkinan diadopsi dalam keputusan 198 (21/4), menambahkan: perubahan realitas zat yang tidak murni atau dilarang untuk dikonsumsi dan transformasinya menjadi zat lain yang berbeda dalam nama, sifat, dan sifat. Hal ini secara ilmiah diekspresikan melalui reaksi kimia lengkap seperti mengubah minyak menjadi sabun dan pelarutan zat menjadi komponennya, yang dicapai melalui cara ilmiah dan tak terlihat seperti pengasinan dan pembakaran. Adapun reaksi parsial, hal ini tidak mustahil, karena zat yang tidak murni tetap tidak berubah dan tidak boleh digunakan; konsumsi adalah pencelupan mata ke dalam wadah yang menyebabkan sifat dan sifat mata yang terendam menghilang dan tidak dapat dibedakan. Topik plasma darah ditunda untuk data baru dengan membentuk komite khusus, dan konsumsi ditunda untuk penelitian lebih lanjut. Fatwa Organisasi Islam untuk Ilmu Kedokteran (Kuwait 1415 AH / 1995 M) mengadopsi: Alkohol tidak murni oleh hukum Islam atau diencerkan, sehingga dapat digunakan secara medisin, disinfeksi, dan disinfeksi, serta dalam parfum dan krim tanpa alkohol karena larangan untuk memanfaatkannya; tidak ada keberatan terhadap obat yang mengandung sedikit alkohol untuk pengawetan atau pelarutan jika tidak ada alternatif yang tersedia; dilarang mengonsumsi makanan yang mengandung persentase alkohol tidak peduli seberapa pun tersesat; diperbolehkan bagi makanan yang mengandung sedikit alkohol untuk melarutkan penyakit umum dan menguap selama proses pembuatan sambil memastikan alternatif; makanan yang mengandung lemak babi benar-benar dilarang; dan gelatin dirujuk untuk penelitian lebih lanjut. Mengenai hormon dan enzim: heparin babi hanya diperbolehkan jika perlu, dan memodifikasinya menjadi berat molekul rendah tidaklah mustahil. Rekayasa genetika yang dibuat tanpa bagian babi tidak bermasalah; insulin babi tidak diperbolehkan karena adanya pengganti, insulin manusia dan padanannya melalui rekayasa genetika diperbolehkan; katup pengganti logam dan biologis diperbolehkan, dan katup babi hanya diperlukan jika diperlukan. Dalam kasus infaha: katup babi dilarang dan tidak murni, dan diambil dari hewan yang dimakan halal murni, dan dari hewan yang tidak murni, atau mati, sebagian peserta menganggapnya tidak murni, dan beberapa menganggapnya tidak murni. Dibuat dengan rekayasa genetika diperbolehkan. Diperbolehkan menggunakan air limbah yang telah diolah di bea cukai, mencuci rumah, dan tanaman yang tidak dimakan kecuali jika merusak, serta untuk makan dan minum jika tidak merusak. Tidak diperbolehkan untuk ibadah kecuali setelah memverifikasi kemurniannya. Diperbolehkan untuk memperlakukannya sebagai kewajiban agama untuk mencegah bahaya, merasionalisasi air, melanjutkan penelitian dan pemantauan, memverifikasi keamanan tanaman, mempromosikan produk, dan memanfaatkan limbah dalam produksi energi. Diputuskan bahwa tidak diperbolehkan menggunakan pakan yang mengandung bangkai, darah, babi, hormon, dan antibiotik karena bahaya serius bagi kesehatan manusia, dan merekomendasikan agar negara-negara Islam berhati-hati saat mengimpor pakan."
