id: work/fatwa-amja-knife-used-on-pork
class: work
kind: fatwa
label: { ar: "سكين الخنزير", en: "A knife used on a pig — its impurity and cleansing", ur: "خنزیر کا چھری — نجاست اور صفائی" }
summary:
  ar: "سأل سائل إذا استعمل السكين في ذبح الخنزير وقطعه فهل تنجس وكيف تطهر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 3274 بتاريخ 23 يوليو 2007)⁩ أنه إذا زال الدم عن السكين بالماء أو غيره فقد زالت النجاسة ولذا شرع الاستنجاء بالماء أو الاستجمار بصلب كالحجر إن كان منقيا مزيلا للنجاسة وإذا بقي شيء من أثر نجاسة الخنزير لم يطهر إلا بإزالته على ما فصّل الجواب."
  en: "A questioner asked whether a knife used slaughtering and cutting a pig is impure and how it is cleansed. Dr. Salah al-Sawi (fatwa no. 3274, 23 July 2007) answered that once the blood leaves the knife by water or the like, the impurity has left; hence the legislation of istinja by water or istijmar by something hard like a stone, where it cleanses and removes the filth; if anything of the pig's impurity-trace remains it is not pure until that is removed — as the answer details."
  ur: "خنزیر پر استعمال شدہ چھری؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 3274، 23 جولائی 2007)⁩ کے مطابق خون دھل جائے تو نجاست زائل — بقایا ہو تو ہٹانا واجب۔"
