summary:
  ar: "المعجم الصغير لسليمان بن أحمد الطبراني (ت 360هـ)، ثالث معاجمه الثلاثة، وهو مرتب على أسماء الشيوخ الذين روى عنهم، فتجمع أحاديث كل شيخ في بابه، ويفصّل المؤلف طرق كل حديث وأحوال شيوخه. والجزء الأول من طبعة دار الكتب العلمية (1403هـ) يضم الشيوخ من باب الألف إلى باب الكاف."
  en: "al-Tabarani's (d. 360 AH) smaller mu'jam, the third of his three Mu'jams. It is arranged by the names of the shaykhs he heard from, so each shaykh's hadiths sit together, and it gives the transmission routes of each report and the circumstances of the shaykhs. Volume 1 of the Dar al-Kutub al-Ilmiyya edition (1403 AH) covers the shaykhs from alif to kaf."
