class: work
kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 27: تتمة تراجم السابقين من مهاجري الحبشة ⁦(غير البدريين)⁩"
  en: "The Biography of the Messenger of God 2026, episode 27: Conclusion of the biographies of the early emigrants to Abyssinia who did not fight at Badr"
  ur: "سیرتِ رسول اللہ 2026، قسط 27: حبشہ کے ان سابقین مہاجرین کے تراجم کا تکملہ جو بدر میں شریک نہ تھے"
  fr: "La biographie du Messager de Dieu 2026, épisode 27 : Suite des biographies des premiers émigrés en Abyssinie qui n'ont pas combattu à Badr"
  es: "La biografía del Mensajero de Dios 2026, episodio 27: Continuación de las biografías de los primeros emigrados a Abisinia que no combatieron en Badr"
summary:
  ar: "يستعرض المحاضر ما مضى من السلسلة ويعلن عن فقرة ثابتة في كل لقاء عن سورة مكية، ثم يتأمل في سورة النجم. بعد ذلك ينتقل إلى مجلد ابن سعد عن السابقين من المسلمين الذين لم يشهدوا بدرًا، فيقدّم تراجم موجزة حسب البطون لمن هاجر منهم إلى الحبشة، مع الإشارة إلى مكان وفاة كل منهم."
  en: "The speaker recaps what the series has covered and announces a fixed segment on a Meccan sura in each session, then reflects on Sura al-Najm. He then turns to Ibn Sa'd's volume on early Muslims who did not fight at Badr and gives short biographies, clan by clan, of those who emigrated to Abyssinia, with notes on where each died."
  ur: "مقرر سلسلے میں اب تک جو کچھ بیان ہوا اس کا خلاصہ پیش کرتا ہے اور اعلان کرتا ہے کہ ہر نشست میں ایک مکی سورت کے لیے مقررہ حصہ ہوگا، پھر سورۃ النجم پر غور کرتا ہے۔ اس کے بعد وہ ابن سعد کی اس جلد کی طرف آتا ہے جو ان ابتدائی مسلمانوں کے بارے میں ہے جو بدر میں شریک نہ ہوئے، اور حبشہ ہجرت کرنے والوں کے مختصر تراجم قبیلوں کے لحاظ سے بیان کرتا ہے، ہر ایک کے مقامِ وفات کے ذکر کے ساتھ۔"
  fr: "Le conférencier fait le point sur ce que la série a couvert et annonce un segment fixe consacré à une sourate mecquoise dans chaque séance, puis médite sur la sourate al-Najm. Il se tourne ensuite vers le volume d'Ibn Sa'd sur les premiers musulmans qui n'ont pas combattu à Badr et donne de brèves biographies, clan par clan, de ceux qui ont émigré en Abyssinie, avec l'indication du lieu où chacun est mort."
  es: "El conferenciante repasa lo que ha tratado la serie y anuncia un segmento fijo sobre una sura mecana en cada sesión; después reflexiona sobre la sura al-Najm. A continuación pasa al volumen de Ibn Sa'd sobre los primeros musulmanes que no combatieron en Badr y ofrece breves biografías, clan por clan, de quienes emigraron a Abisinia, con indicaciones sobre dónde murió cada uno."
