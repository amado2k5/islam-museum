id: work/fatwa-amja-why-god-does-not-intervene
class: work
kind: fatwa
label: { ar: "لماذا لا يتدخل الله عند الجريمة", en: "Why does God not intervene at a crime", ur: "اللہ جرم کے وقت مداخلت کیوں نہیں کرتا", es: "¿Por qué Dios no interviene en un crimen?", fr: "Pourquoi Dieu n'intervient-il pas lors d'un crime ?", tr: "Tanrı neden suça müdahale etmiyor?", id: "Mengapa Tuhan tidak campur tangan dalam kejahatan itu" }
summary:
  ar: "سأل من رأى امرأة مقتولة في جريمة وجنت ابنتها الصغيرة لما رأتها لماذا لم يتدخل الله ويتلطف بالصغيرة وهل من دعاء لتفادي الجريمة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81607 بتاريخ 3 يونيو 2010)⁩ أن الله خلق كل شيء بقدر وهو الفعال لما يريد، فما من الناس أحد إلا ويريد ما لا يفعل أو يفعل ما لا يريد لكن الله وحده الفعال لما يريد، وهو لا يسأل عما يفعل لكن أفعاله لا تنفك عن حكمته سواء أدركناها أم غابت عنا، فالخير بيديه والشر ليس إليه، وليس لأحد أن يقول لماذا لم يفعل الله كذا فإن هذا ليس من الأدب مع الله."
  en: "A questioner who saw a murdered woman and her little daughter driven mad by the sight asked why God did not intervene and spare the child, and whether a supplication wards off crime. Dr. Salah al-Sawi (fatwa no. 81607, 3 June 2010) answered that God created everything by measure and does what He wills — everyone among people wills what he cannot do or does what he does not will, but God alone does what He wills; He is not questioned about what He does, yet His acts are never sundered from His wisdom whether we grasp it or it escapes us; good is in His hands and evil is not attributed to Him, and it is not for anyone to say 'why did God not do such-and-such' — that is not courtesy with God. Recorded as AMJA's answer."
  ur: "ایک سائل نے پوچھا کہ اللہ قتل کے موقع پر مداخلت کیوں نہیں کرتا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81607، 3 جون 2010)⁩ کے مطابق اللہ جو چاہے کرتا ہے اور اس کے افعال حکمت سے خالی نہیں خواہ ہم سمجھیں یا نہ؛ اللہ سے اعتراض ادب نہیں۔"
  es: "Una persona que presenció el asesinato de una mujer y la locura de su pequeña hija preguntó por qué Dios no intervino para salvar a la niña y si una súplica previene el crimen. El Dr. Salah al-Sawi (fatwa n.° 81607, 3 de junio de 2010) respondió que Dios creó todo con medida y hace lo que quiere; todos los seres humanos desean lo que no pueden o hacen lo que no quieren, pero solo Dios hace lo que quiere. No se le cuestiona sobre sus acciones, y sus actos nunca se separan de su sabiduría, ya sea que la comprendamos o no; el bien está en sus manos y el mal no se le atribuye, y nadie tiene derecho a preguntar «¿por qué Dios no hizo esto o aquello?»; eso no es una muestra de cortesía hacia Dios. Registrada como respuesta de AMJA."
  fr: "Un homme, témoin du meurtre d'une femme et de sa petite fille, rendue folle par cette vision, demanda pourquoi Dieu n'était pas intervenu pour épargner l'enfant et si une invocation pouvait éloigner le crime. Le Dr Salah al-Sawi (fatwa n° 81607, 3 juin 2010) répondit que Dieu a créé toute chose avec mesure et qu'il fait ce qu'Il veut. Tout être humain désire l'impossible ou fait le contraire de sa volonté, mais Dieu seul fait ce qu'Il veut. Nul ne peut Le questionner sur Ses actes, et pourtant Ses actions sont toujours guidées par Sa sagesse, que nous la comprenions ou non. Le bien est entre Ses mains et le mal ne Lui est pas imputable. Il n'appartient à personne de demander « pourquoi Dieu n'a-t-il pas fait ceci ou cela »; ce serait manquer de respect envers Lui. (Réponse rapportée par AMJA.)"
  tr: "Bir kadının suçta öldürüldüğünü ve küçük kızının doğduğunu gören birine, Tanrı'nın neden müdahale etmediğini ve küçük kıza iyi davranmadığını, suçtan kaçınmak için herhangi bir dua olup olmadığını sordu. Dr. Salah Al-Sawy (3 Haziran 2010 tarihli Fetva No. 81607) Tanrı'nın her şeyi bir fermana göre yarattığını ve istediğini yapan kişi olduğunu yanıtladı. Sadece yapmadığını ya da istemediğini arzuladığından başka kimse yoktur, ama Tanrı yalnızca istediğini yapandır. Yaptığı şey sorgulanmaz, ancak eylemleri farkında olsak da olmasak da bilgeliğinden ayrılmazdır. İyilik O'nun elindedir, kötülük ise O'nun değildir. Tanrı'nın neden böyle yapmadığını kimse söylemeye hakkı yoktur, çünkü bu Tanrı'ya uygun değildir."
  id: "Ia bertanya kepada seseorang yang melihat seorang wanita dibunuh dalam kejahatan dan putri kecilnya lahir saat ia melihatnya, mengapa Tuhan tidak campur tangan dan berbaik kepada gadis kecil itu, dan apakah ada doa untuk menghindari kejahatan tersebut. Dr. Salah Al-Sawy menjawab (Fatwa No. 81607 tanggal 3 Juni 2010) bahwa Allah menciptakan segala sesuatu menurut sebuah titah dan Ia yang melakukan apa yang Dia kehendaki. Tidak ada siapa pun kecuali Dia menginginkan apa yang tidak Dia lakukan atau tidak kehendak, tetapi hanya Allah yang melakukan apa yang Dia kehendaki. Dia tidak dipertanyakan tentang apa yang Dia lakukan, tetapi tindakan-Nya tidak terpisahkan dari kebijaksanaan-Nya, apakah kita menyadarinya atau tidak. Kebaikan ada di tangan-Nya, dan kejahatan bukan untuk-Nya. Tidak ada yang berhak mengatakan mengapa Tuhan tidak melakukan ini dan itu, karena itu tidak pantas bagi Tuhan."
