label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن زراعة الأعضاء التناسلية", en: "IIFA resolution on transplanting genital organs", ur: "اکیڈمی کی قرارداد: تناسلی اعضاء کی پیوندکاری", es: "Resolución de la IIFA sobre el trasplante de órganos genitales", fr: "Résolution de l'IIFA sur la transplantation d'organes génitaux" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: زرع الخصية والمبيض محرم شرعًا لاستمرارهما في حمل وإفراز الصفات الوراثية للمنقول منه بعد الزرع، وبيّن حكم زرع أعضاء الجهاز التناسلي التي لا تنقل الصفات الوراثية على ما فصّل القرار."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990) on genital-organ transplants: transplanting testes and ovaries is forbidden in the sharia because they continue carrying and secreting the donor's genetic traits after transplantation; the resolution then sets out the ruling for reproductive-system organs that do not transmit genetic traits."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩: خصیہ اور بیضہ دان کی پیوندکاری حرام کیونکہ یہ عطیہ کنندہ کی وراثتی صفات منتقل کرتے ہیں؛ دیگر تناسلی اعضاء کے احکام بیان ہوئے۔"
  es: "Resolución de la sexta sesión de la IIFA (Yeda, marzo de 1990) sobre trasplantes de órganos genitales: el trasplante de testículos y ovarios está prohibido en la sharia porque continúan portando y secretando los rasgos genéticos del donante después del trasplante; la resolución establece a continuación la normativa para los órganos del sistema reproductivo que no transmiten rasgos genéticos."
  fr: "Résolution de la sixième session de l'IIFA (Djeddah, mars 1990) sur les transplantations d'organes génitaux: la transplantation de testicules et d'ovaires est interdite par la charia car ils continuent de porter et de sécréter les caractéristiques génétiques du donneur après la transplantation; la résolution énonce ensuite la règle applicable aux organes du système reproducteur qui ne transmettent pas de caractéristiques génétiques."
