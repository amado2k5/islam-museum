summary:
  ar: "الألبوم الأول لسامي يوسف، صدر عن أوايكننغ سنة 2003 بعد أن وقّعت معه الشركة أول فنانيها، وعنوانه «المعلم» إشارة إلى النبي؛ تقول الغارديان سنة 2012 إنه باع ثلاثة ملايين نسخة، وإنه مع «أمتي» دفع مجلة تايم إلى وصف سامي يوسف بأنه «أكبر نجم روك في الإسلام»، ووضع معيارا لصناعة النشيد الناشئة."
  en: "Sami Yusuf's debut album, released by Awakening in 2003 after the label signed him as its first artist; its title, 'The Teacher', refers to the Prophet. The Guardian reported in 2012 that it sold 3 million copies and that, with My Ummah, it led Time magazine to call Sami Yusuf 'Islam's biggest rock star' and set the bar for the young nasheed industry."
  ur: "سامی یوسف کا پہلا البم، جو 2003 میں اویکننگ سے جاری ہوا جب کمپنی نے انہیں اپنے پہلے فنکار کے طور پر سائن کیا؛ عنوان «المعلم» نبی کی طرف اشارہ ہے۔ گارڈین نے 2012 میں اس کی فروخت تین ملین نسخے بتائی۔"
