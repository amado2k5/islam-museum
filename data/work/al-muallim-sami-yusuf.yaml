label: { ar: "المعلم ⁦(ألبوم سامي يوسف، 2003)⁩", en: "Al-Mu'allim", ur: "المعلم ⁦(سامی یوسف کا البم، 2003)⁩", es: "Al-Mu'allim", fr: "Al-Mu'allim", tr: "The Teacher (Sami Youssef albümü, 2003)", id: "The Teacher (album Sami Youssef, 2003)" }
summary:
  ar: "الألبوم الأول لسامي يوسف، صدر عن أوايكننغ سنة 2003 بعد أن وقّعت معه الشركة أول فنانيها، وعنوانه «المعلم» إشارة إلى النبي؛ تقول الغارديان سنة 2012 إنه باع ثلاثة ملايين نسخة، وإنه مع «أمتي» دفع مجلة تايم إلى وصف سامي يوسف بأنه «أكبر نجم روك في الإسلام»، ووضع معيارا لصناعة النشيد الناشئة."
  en: "Sami Yusuf's debut album, released by Awakening in 2003 after the label signed him as its first artist; its title, 'The Teacher', refers to the Prophet. The Guardian reported in 2012 that it sold 3 million copies and that, with My Ummah, it led Time magazine to call Sami Yusuf 'Islam's biggest rock star' and set the bar for the young nasheed industry."
  ur: "سامی یوسف کا پہلا البم، جو 2003 میں اویکننگ سے جاری ہوا جب کمپنی نے انہیں اپنے پہلے فنکار کے طور پر سائن کیا؛ عنوان «المعلم» نبی کی طرف اشارہ ہے۔ گارڈین نے 2012 میں اس کی فروخت تین ملین نسخے بتائی۔"
  es: "El álbum debut de Sami Yusuf, lanzado por Awakening en 2003 después de que el sello lo fichara como su primer artista, se titula \"The Teacher\" (El Maestro), en referencia al Profeta. En 2012, The Guardian informó que vendió 3 millones de copias y que, junto con \"My Ummah\", llevó a la revista Time a calificar a Sami Yusuf como \"la mayor estrella del rock del Islam\" y a marcar un hito en la joven industria del nasheed."
  fr: "Le premier album de Sami Yusuf, sorti chez Awakening en 2003 après que le label l'ait signé comme premier artiste, s'intitule « The Teacher », en référence au Prophète. Le Guardian rapportait en 2012 qu'il s'était vendu à 3 millions d'exemplaires et que, grâce à son titre « My Ummah », il avait valu à Sami Yusuf d'être qualifié de « plus grande rock star de l'islam » par le magazine Time, établissant ainsi une nouvelle référence pour la jeune génération de l'industrie du nasheed."
  tr: "Sami Youssef'in ilk albümü, şirketin ilk sanatçılarını imzalamasının ardından 2003 yılında Awakening tarafından yayımlandı. Albümün adı \"The Teacher\" Peygamber'e bir göndermedir; The Guardian 2012'de üç milyon kopya sattığını ve \"My Nation\" ile Time dergisinin Sami Youssef'i \"İslam'ın en büyük rock yıldızı\" olarak tanımladığını ve yükselen marş prodüksiyonu için bir standart belirlediğini bildirmiştir."
  id: "Album pertama Sami Youssef dirilis oleh Awakening pada tahun 2003 setelah perusahaan tersebut menandatangani artis pertamanya. Judulnya \"The Teacher\" merujuk pada Nabi; The Guardian melaporkan pada tahun 2012 bahwa album tersebut terjual tiga juta kopi, dan dengan \"My Nation,\" majalah Time menggambarkan Sami Youssef sebagai \"bintang rock terbesar dalam Islam\" dan menetapkan standar produksi lagu kebangsaan yang sedang berkembang."
