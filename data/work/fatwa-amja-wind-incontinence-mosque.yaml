id: work/fatwa-amja-wind-incontinence-mosque
class: work
kind: fatwa
label: { ar: "سلس الريح والمسجد", en: "Wind incontinence and longing for the mosque prayer", ur: "ریح کا سلس اور مسجد کی نماز", es: "Incontinencia urinaria y anhelo de la oración en la mezquita." }
summary:
  ar: "سأل سائل أن لديه سلس الريح ويرغب بشدة في صلاة العشاء في المسجد. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82151 بتاريخ 12 أغسطس 2010)⁩ أن أصحاب الأعذار يتوضئون لوقت كل صلاة ولا يصلح لهم تقديم الطهور عن ذلك، وأن الطهور شطر الإيمان ولا تصلح صلاة من أحدث حتى يتوضأ، وأنه يرجو أن يقدر إخوته هذا الأمر وأن يبقى منهم من يعينه على الذهاب إلى المسجد بإذن الله كما يمكنه الصلاة في أقرب مسجد على ما فصّل الجواب."
  en: "A questioner with wind incontinence longed keenly for the isha prayer in the mosque. Dr. Salah al-Sawi (fatwa no. 82151, 12 August 2010) answered that people of excuses do wudu for each prayer's time and may not bring the purification before it — purity being half of faith and no prayer standing for one in hadath till he does wudu; he hoped his brothers would weigh this matter and that some would stay to help him to the mosque, God willing — or he may pray at the nearest mosque, as the answer details."
  ur: "ایک شخص ریح کے عذر میں مسجد کی نماز چاہتا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82151، 12 اگست 2010)⁩ کے مطابق ہر وقت پر نیا وضو کرے اور قریبی مسجد میں نماز پڑھے۔"
  es: "Un consultante con incontinencia de gases anhelaba fervientemente la oración de Isha en la mezquita. El Dr. Salah al-Sawi (fatwa n.° 82151, 12 de agosto de 2010) respondió que las personas que buscan excusas realizan la ablución (wudu) antes de cada oración y no necesariamente deben realizar la purificación previa, ya que la pureza es la mitad de la fe y, según el hadiz, ninguna oración es válida hasta que se realiza la ablución. El consultante esperaba que sus hermanos consideraran este asunto y que algunos lo acompañaran a la mezquita, si Dios quería, o bien, que rezara en la mezquita más cercana, como se detalla en la respuesta."
