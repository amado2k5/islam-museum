id: work/fatwa-amja-wind-incontinence-mosque
class: work
kind: fatwa
label: { ar: "سلس الريح والمسجد", en: "Wind incontinence and longing for the mosque prayer", ur: "ریح کا سلس اور مسجد کی نماز", es: "Incontinencia urinaria y anhelo de la oración en la mezquita.", fr: "Incontinence fébrile et désir ardent d'aller à la mosquée pour prier", tr: "Rüzgar ve cami yalıtımı", id: "Isolasi angin dan masjid" }
summary:
  ar: "سأل سائل أن لديه سلس الريح ويرغب بشدة في صلاة العشاء في المسجد. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82151 بتاريخ 12 أغسطس 2010)⁩ أن أصحاب الأعذار يتوضئون لوقت كل صلاة ولا يصلح لهم تقديم الطهور عن ذلك، وأن الطهور شطر الإيمان ولا تصلح صلاة من أحدث حتى يتوضأ، وأنه يرجو أن يقدر إخوته هذا الأمر وأن يبقى منهم من يعينه على الذهاب إلى المسجد بإذن الله كما يمكنه الصلاة في أقرب مسجد على ما فصّل الجواب."
  en: "A questioner with wind incontinence longed keenly for the isha prayer in the mosque. Dr. Salah al-Sawi (fatwa no. 82151, 12 August 2010) answered that people of excuses do wudu for each prayer's time and may not bring the purification before it — purity being half of faith and no prayer standing for one in hadath till he does wudu; he hoped his brothers would weigh this matter and that some would stay to help him to the mosque, God willing — or he may pray at the nearest mosque, as the answer details."
  ur: "ایک شخص ریح کے عذر میں مسجد کی نماز چاہتا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82151، 12 اگست 2010)⁩ کے مطابق ہر وقت پر نیا وضو کرے اور قریبی مسجد میں نماز پڑھے۔"
  es: "Un consultante con incontinencia de gases anhelaba fervientemente la oración de Isha en la mezquita. El Dr. Salah al-Sawi (fatwa n.° 82151, 12 de agosto de 2010) respondió que las personas que buscan excusas realizan la ablución (wudu) antes de cada oración y no necesariamente deben realizar la purificación previa, ya que la pureza es la mitad de la fe y, según el hadiz, ninguna oración es válida hasta que se realiza la ablución. El consultante esperaba que sus hermanos consideraran este asunto y que algunos lo acompañaran a la mezquita, si Dios quería, o bien, que rezara en la mezquita más cercana, como se detalla en la respuesta."
  fr: "Un homme souffrant d'incontinence fécale souhaitait ardemment accomplir la prière de l'Isha à la mosquée. Le Dr Salah al-Sawi (fatwa n° 82151, 12 août 2010) a répondu que les personnes ayant des excuses doivent faire leurs ablutions (wudu) avant chaque prière et ne peuvent se purifier avant celle-ci – la pureté étant considérée comme la moitié de la foi et aucune prière n'étant valable tant que les ablutions n'ont pas été faites –, espérant que ses frères prendraient en considération cette question et que certains resteraient pour l'aider à se rendre à la mosquée, si Dieu le veut. Il peut également prier à la mosquée la plus proche, comme le précise la réponse."
  tr: "Bir soru soran kişi, rüzgar kaçırma sorunu yaşayıp yaşamadığını ve camide İsha namazı kılmak isteyip istemediğini sordu. Dr. Salah Al-Sawy (Fetva No. 82151, 12 Ağustos 2010 tarihli), bahaneleri olanların her namaz sırasında abdest aldığını ve bunun ötesinde arınma yapmalarının uygun olmadığını, arınmanın inancın bir parçası olduğunu ve yenilik yapan birinden namaz kılmanın ancak abdest olmadan uygun olmadığını söyledi. Kardeşlerinin bunu takdir edeceğini ve aralarında birinin olup inşallah camiye gitmesinde yardımcı olacağını, en yakın camide namaz kılabileceğini umdu, cevabında açıklandığı gibi."
  id: "Seorang penanya bertanya apakah ia mengalami inkontinensia angin dan sangat ingin melakukan salat Isha di masjid. Dr. Salah Al-Sawy (Fatwa No. 82151 tanggal 12 Agustus 2010) menjawab bahwa mereka yang memiliki alasan melakukan wudhu pada setiap waktu salat dan tidak pantas melakukan penyucian lebih dari itu, dan penyucian adalah bagian dari iman dan bahwa doa dari seseorang yang berinovasi tidak layak sampai ia melakukan wudhu. Ia berharap saudara-saudaranya akan menghargai hal ini dan ada seseorang di antara mereka yang membantunya pergi ke masjid, jika Insya Allah, dan ia dapat berdoa di masjid terdekat, seperti yang dijelaskan dalam jawabannya."
