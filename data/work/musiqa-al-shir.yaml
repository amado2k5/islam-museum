summary:
  ar: "موسيقى الشعر، كتاب في العروض والقوافي لمؤلفه إبراهيم أنيس، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: نُشر 1948م; ت 1977م {cite:archive-org-musiqa-al-shir}. وجواب الملخص عن وجوده في المكتبة الشاملة: لا، فقد ذكر الملف أن البحث في موقع shamela.ws لم يعثر على مطابقة . لم يقرأ المتحف الكتاب."
  en: "Musiqa al-Shir, a book on prosody (arud and qawafi) by Ibrahim Anis; its date in a research summary supplied to the museum is pub. 1948 CE; d. 1977 CE {cite:archive-org-musiqa-al-shir}. The summary's answer on its presence in the Shamela library: No: the file reports that a search of shamela.ws returned no match . The museum has not read the book."
  ur: "موسيقى الشعر، عروض و قوافی پر ایک کتاب، مصنف إبراهيم أنيس؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: اشاعت 1948ء; وفات 1977ء {cite:archive-org-musiqa-al-shir}۔ شاملہ میں موجودگی پر خلاصے کا جواب: نہیں؛ فائل کے مطابق shamela.ws میں تلاش سے کوئی مطابق اندراج نہیں ملا ۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "Musiqa al-Shir, livre sur la prosodie (arud et qawafi) de Ibrahim Anis ; sa date dans une synthèse de recherche remise au musée : publ. 1948; m. 1977 {cite:archive-org-musiqa-al-shir}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Non : le fichier signale qu'une recherche sur shamela.ws n'a donné aucune correspondance . Le musée n'a pas lu le livre."
  es: "Musiqa al-Shir, libro sobre prosodia (arud y qawafi) de Ibrahim Anis; su fecha en un resumen de investigación entregado al museo: publ. 1948; m. 1977 {cite:archive-org-musiqa-al-shir}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: No: el archivo indica que una búsqueda en shamela.ws no dio ninguna coincidencia . El museo no ha leído el libro."
  tr: "Şiirin Müziği, yazarı İbrahim Anis'in prosodi ve kafiyeler üzerine bir kitabı ve müzeye sunulan bir araştırma özetine göre tarihçesi: 1948'de yayımlandı; ö. 1977 {cite:archive-org-musiqa-al-shir}. Özetin Kapsamlı Kütüphane'deki varlığıyla ilgili yanıtı: Hayır, dosyada shamela.ws web sitesinde yapılan aramada eşleşme bulunamadığı belirtiliyordu. Müze kitabı okumadı."
  id: "The Music of Poetry, sebuah buku tentang prosodi dan rima karya penulisnya Ibrahim Anis, dan sejarahnya menurut ringkasan penelitian yang diserahkan ke museum: diterbitkan 1948; wafat 1977 {cite:archive-org-musiqa-al-shir}. Jawaban ringkasan tentang keberadaannya di Perpustakaan Komprehensif: Tidak, berkas menyatakan bahwa pencarian di situs web shamela.ws tidak menemukan kecocokan. Museum tidak membaca buku tersebut."
