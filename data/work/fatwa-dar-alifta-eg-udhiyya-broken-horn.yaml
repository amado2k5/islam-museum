id: work/fatwa-dar-alifta-eg-udhiyya-broken-horn
class: work
kind: fatwa
label: { ar: "حكم الأضحية بمكسورة القرن", en: "Sacrificing an animal with a broken horn", ur: "سنگ ٹوٹے جانور کی قربانی", es: "Sacrificar un animal con un cuerno roto.", fr: "Sacrifier un animal à la corne cassée" }
summary:
  ar: "سائل سأل عن التضحية بعجل كسر قرنه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20774)⁩ أنه لا مانع من التضحية به ما لم يصاحب الكسر مرض معد يؤثر في اللحم ويضر به."
  en: "A questioner asked about sacrificing a calf whose horn was broken. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20774) answered there is no objection so long as the break is not accompanied by a contagious disease affecting and harming the meat."
  ur: "ایک سائل نے سنگ ٹوٹے بچھڑے کی قربانی کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20774)⁩ نے جواب دیا کہ مانع نہیں جب تک کوئی متعدی مرض گوشت کو نقصان نہ پہنچائے۔"
  es: "Un consultante preguntó sobre el sacrificio de un ternero cuyo cuerno estaba roto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20774) respondió que no hay objeción siempre y cuando la rotura no esté acompañada de una enfermedad contagiosa que afecte y dañe la carne."
  fr: "Un internaute a posé une question concernant le sacrifice d'un veau dont la corne était cassée. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20774) a répondu qu'il n'y avait pas d'objection tant que la fracture n'était pas accompagnée d'une maladie contagieuse affectant la viande."
