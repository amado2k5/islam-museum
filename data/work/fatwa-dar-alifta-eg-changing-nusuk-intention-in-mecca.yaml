id: work/fatwa-dar-alifta-eg-changing-nusuk-intention-in-mecca
class: work
kind: fatwa
label: { ar: "حكم تغيير نية النسك بعد دخول مكة", en: "Changing the rite's intention after entering Mecca", ur: "مکہ داخل ہونے کے بعد نسک کی نیت بدلنا" }
summary:
  ar: "سائل سأل عن تغيير نية النسك بعد دخول مكة لمن نوى العمرة متمتعًا بها إلى الحج ولم يتمكن من أدائها بسبب المرض. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20666)⁩ أنه يجوز للرجل المذكور بعد أن نوى العمرة متمتعًا ولم يتمكن من أدائها بسبب المرض حتى دخل وقت الحج ما فصّل الجواب من التحول."
  en: "A questioner asked about changing the rite's intention after entering Mecca for one who intended tamattu' umrah but could not perform it for illness until Hajj's time came. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20666) answered that he may change as the answer details."
  ur: "ایک سائل نے اس شخص کا حکم پوچھا جس نے تمتع عمرہ کی نیت کی مگر بیماری سے نہ کر سکا یہاں تک کہ حج کا وقت آ گیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20666)⁩ نے جواب دیا کہ نسک بدلنا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
