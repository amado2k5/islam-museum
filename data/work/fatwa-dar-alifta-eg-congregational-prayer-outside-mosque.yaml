id: work/fatwa-dar-alifta-eg-congregational-prayer-outside-mosque
class: work
kind: fatwa
label: { ar: "فضل صلاة الجماعة في المسجد عن غيره من الأماكن", en: "The merit of congregational prayer in the mosque over other places", ur: "مسجد میں جماعت کی نماز کا دوسری جگہوں پر فضیلت", es: "El mérito de la oración en congregación en la mezquita sobre otros lugares.", fr: "Le mérite de la prière en congrégation à la mosquée par rapport aux autres lieux" }
summary:
  ar: "سائل يصلي بعض الفروض مع رفقائه في المسكن الذي يقيمون فيه فسأل عن تحقق الجماعة وفضلها في المسجد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21853)⁩ أن أداءه بعض الصلوات المفروضة مع رفقائه في مسكنهم أمر تتحقق به صلاة الجماعة وبيّن الجواب فضل الجماعة في المسجد على وجهه."
  en: "A man prays some obligatory prayers with his companions in their residence and asked whether congregational prayer is achieved and its merit in the mosque. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21853) answered that praying with his companions at home does constitute congregational prayer, and the answer sets out the added merit of congregation in the mosque."
  ur: "ایک شخص اپنے ساتھیوں کے ساتھ رہائش میں بعض فرض نمازیں پڑھتا ہے؛ اس نے جماعت کے حصول اور مسجد میں اس کے فضیلت کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21853)⁩ نے جواب دیا کہ گھر میں ساتھیوں کے ساتھ نماز پڑھنے سے جماعت حاصل ہو جاتی ہے اور جواب میں مسجد میں جماعت کا اضافی فضیلت بیان ہوا۔"
  es: "Un hombre realizaba algunas oraciones obligatorias con sus compañeros en su domicilio y preguntó si la oración en congregación se realizaba en la mezquita y cuál era su mérito. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21853) respondió que rezar con sus compañeros en casa sí constituye la oración en congregación, y la respuesta expone el mérito adicional de la oración en congregación en la mezquita."
  fr: "Un homme accomplit des prières obligatoires avec ses compagnons à leur domicile et demande si la prière en congrégation est valable et quel est son mérite à la mosquée. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21853) répond que prier avec ses compagnons à domicile constitue bien une prière en congrégation, et souligne le mérite supplémentaire de la prière en congrégation à la mosquée."
