id: work/fatwa-dar-alifta-eg-congregational-prayer-outside-mosque
class: work
kind: fatwa
label: { ar: "فضل صلاة الجماعة في المسجد عن غيره من الأماكن", en: "The merit of congregational prayer in the mosque over other places", ur: "مسجد میں جماعت کی نماز کا دوسری جگہوں پر فضیلت" }
summary:
  ar: "سائل يصلي بعض الفروض مع رفقائه في المسكن الذي يقيمون فيه فسأل عن تحقق الجماعة وفضلها في المسجد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21853)⁩ أن أداءه بعض الصلوات المفروضة مع رفقائه في مسكنهم أمر تتحقق به صلاة الجماعة وبيّن الجواب فضل الجماعة في المسجد على وجهه."
  en: "A man prays some obligatory prayers with his companions in their residence and asked whether congregational prayer is achieved and its merit in the mosque. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21853) answered that praying with his companions at home does constitute congregational prayer, and the answer sets out the added merit of congregation in the mosque."
  ur: "ایک شخص اپنے ساتھیوں کے ساتھ رہائش میں بعض فرض نمازیں پڑھتا ہے؛ اس نے جماعت کے حصول اور مسجد میں اس کے فضیلت کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21853)⁩ نے جواب دیا کہ گھر میں ساتھیوں کے ساتھ نماز پڑھنے سے جماعت حاصل ہو جاتی ہے اور جواب میں مسجد میں جماعت کا اضافی فضیلت بیان ہوا۔"
