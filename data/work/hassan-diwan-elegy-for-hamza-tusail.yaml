label: { ar: "مرثية حسان لحمزة «تسائل عن قوم هجان سميدع»", en: "Hassan's elegy for Hamza 'She asks about a pure-bred chief'", es: "La elegía de Hassan para Hamza: \"Pregunta por un jefe de pura raza\".", fr: "Élégie d'Hassan pour Hamza: « Elle demande un chef de pure race »", ur: "حمزہ کے لیے حسن کی خوبصورتی 'وہ خالص نسل کے سردار کے بارے میں پوچھتی ہے'" }
summary:
  ar: "أبيات لحسان بن ثابت من الطويل على روي الراء، يرثي بها حمزة بن عبد المطلب حين قدمت ابنته أمامة المدينة تسأل عن قبر أبيها ومصرعه {{cite:sharh-diwan-hassan-barquqi-1929 p.186}}."
  en: "Verses by Hassan ibn Thabit in the tawil metre on the rhyme ra', lamenting Hamza ibn Abd al-Muttalib when his daughter Umama came to Medina asking about her father's grave and place of death {{cite:sharh-diwan-hassan-barquqi-1929 p.186}}."
  es: "Versos de Hassan ibn Thabit en metro tawil sobre la rima ra', lamentando a Hamza ibn Abd al-Muttalib cuando su hija Umama llegó a Medina preguntando por la tumba y el lugar de la muerte de su padre {{cite:sharh-diwan-hassan-barquqi-1929 p.186}}."
  fr: "Vers de Hassan ibn Thabit en mètre tawil sur la rime ra', déplorant Hamza ibn Abd al-Muttalib lorsque sa fille Umama est venue à Médine pour se renseigner sur la tombe de son père et le lieu de sa mort {{cite:sharh-diwan-hassan-barquqi-1929 p.186}}."
  ur: "حمزہ بن عبد المطلب کی بیٹی امامہ اپنے والد کی قبر اور جائے وفات کے بارے میں پوچھنے کے لیے مدینہ تشریف لائیں {{حوالہ:شرح-دیوان-حسن برقوی-1929 ص186}} میں حسن بن ثابت کی آیات۔"
