summary:
  ar: "كتاب أبي الحسن علي بن عمر الدارقطني ⁦(306–385هـ)⁩ في أحاديث الأحكام مرتبة على أبواب الفقه بأسانيدها، يكثر فيه من الطرق والعلل؛ ويرى الخطيب البغدادي أنه يدل على عنايته بالفقه، إذ لا يقدر على جمع ما فيه إلا من تقدمت معرفته باختلاف الأحكام؛ ورواه عنه ابن بشران وأبو طاهر بن عبد الرحيم والبرقاني وغيرهم في نسخ بينها تفاوت في الترتيب والألفاظ {cite:sunan-daraqutni-ibn-hazm-2011 p. 8-10}."
  en: "The book of Abu al-Hasan 'Ali b. 'Umar al-Daraqutni (306–385 AH) of legal hadiths with their chains, arranged by the chapters of fiqh and rich in routes and defects; al-Khatib al-Baghdadi took it to show his learning in fiqh, since only one versed in juristic disagreement could compile it; Ibn Bishran, Abu Tahir b. 'Abd al-Rahim, al-Barqani and others transmitted it, in copies that differ in order and wording {cite:sunan-daraqutni-ibn-hazm-2011 p. 8-10}."
  ur: "ابو الحسن علی بن عمر دارقطنی ⁦(306–385ھ)⁩ کی احادیثِ احکام کی کتاب، اسانید کے ساتھ ابوابِ فقہ پر مرتب، طرق اور علل سے بھرپور؛ خطیب بغدادی کے نزدیک یہ ان کی فقہ سے دلچسپی کی دلیل ہے کیونکہ اس جیسا مجموعہ وہی مرتب کر سکتا ہے جو احکام میں اختلاف کو جانتا ہو؛ اسے ان سے ابن بشران، ابو طاہر بن عبد الرحیم، برقانی وغیرہ نے روایت کیا، اور نسخوں میں ترتیب اور الفاظ کا فرق ہے {cite:sunan-daraqutni-ibn-hazm-2011 p. 8-10}۔"
  es: "El libro de Abu al-Hasan 'Ali b. 'Umar al-Daraqutni (306–385 AH) de hadices legales con sus cadenas, ordenado por capítulos de fiqh y rico en rutas y defectos; al-Khatib al-Baghdadi lo tomó para mostrar su erudición en fiqh, ya que solo alguien versado en desacuerdos jurídicos podía compilarlo; Ibn Bishran, Abu Tahir b. 'Abd al-Rahim, al-Barqani y otros lo transmitieron, en copias que difieren en orden y redacción {cite:sunan-daraqutni-ibn-hazm-2011 p. 8-10}."
  fr: "Le livre d'Abu al-Hasan 'Ali b. 'Umar al-Daraqutni (306–385 AH) de hadiths juridiques avec leurs chaînes, classés par chapitres de fiqh et riche en itinéraires et défauts; al-Khatib al-Baghdadi l'a pris pour montrer son savoir en fiqh, car seul un érudit en désaccord juridique pouvait le compiler; Ibn Bishran, Abu Tahir b. 'Abd al-Rahim, al-Barqani et d'autres l'ont transmis, dans des copies qui diffèrent dans l'ordre et le libellé {cite:sunan-daraqutni-ibn-hazm-2011 p. 8-10}."
  tr: "Ebu el-Hasan Ali bin Ömer el-Daraqutni'nin (306–385 H) hadisler hakkında, fıkıh bölümlerine göre ve onların aktarım zincirlerine göre düzenlenmiş kitabı birçok zincir ve hata içerir; el-Hatib el-Bağdadi, bunun fıkıha olan dikkatini gösterdiğine inanır; çünkü daha önce hükümlerinde farklı bilgiye sahip olanlar tarafından derlenebilir; İbn Bişran, Ebu Tahir bin Abdülrahim, el-Berqani ve diğerleri tarafından farklı sıralama ve ifadelerle el yazmalarında ondan rivayet edilmiştir {atıf:sunan-darakutni-ibn-hazm-2011, s. 8-10}."
  id: "Kitab Abu al-Hasan Ali ibn Umar al-Daraqutni (306–385 H) tentang hadis keputusan, disusun menurut bab-bab yurisprudensi dengan rantai transmisinya, memuat banyak rantai dan kesalahan; al-Khatib al-Baghdadi percaya bahwa buku ini menunjukkan perhatiannya terhadap firisprudensi, karena hanya mereka yang sebelumnya memiliki pengetahuan berbeda dalam keputusannya yang dapat mengumpulkan isinya; kitab ini diceritakan darinya oleh Ibn Bishran, Abu Tahir ibn Abd al-Rahim, al-Barqani, dan lainnya dalam manuskrip dengan urutan dan kata-kata yang beragam {cite:sunan-daraqutni-ibn-hazm-2011, hlm. 8-10}."
