summary:
  ar: "كتاب أبي الحسن علي بن عمر الدارقطني ⁦(306–385هـ)⁩ في أحاديث الأحكام مرتبة على أبواب الفقه بأسانيدها، يكثر فيه من الطرق والعلل؛ ويرى الخطيب البغدادي أنه يدل على عنايته بالفقه، إذ لا يقدر على جمع ما فيه إلا من تقدمت معرفته باختلاف الأحكام؛ ورواه عنه ابن بشران وأبو طاهر بن عبد الرحيم والبرقاني وغيرهم في نسخ بينها تفاوت في الترتيب والألفاظ {cite:sunan-daraqutni-ibn-hazm-2011 p. 8-10}."
  en: "The book of Abu al-Hasan 'Ali b. 'Umar al-Daraqutni (306–385 AH) of legal hadiths with their chains, arranged by the chapters of fiqh and rich in routes and defects; al-Khatib al-Baghdadi took it to show his learning in fiqh, since only one versed in juristic disagreement could compile it; Ibn Bishran, Abu Tahir b. 'Abd al-Rahim, al-Barqani and others transmitted it, in copies that differ in order and wording {cite:sunan-daraqutni-ibn-hazm-2011 p. 8-10}."
  ur: "ابو الحسن علی بن عمر دارقطنی ⁦(306–385ھ)⁩ کی احادیثِ احکام کی کتاب، اسانید کے ساتھ ابوابِ فقہ پر مرتب، طرق اور علل سے بھرپور؛ خطیب بغدادی کے نزدیک یہ ان کی فقہ سے دلچسپی کی دلیل ہے کیونکہ اس جیسا مجموعہ وہی مرتب کر سکتا ہے جو احکام میں اختلاف کو جانتا ہو؛ اسے ان سے ابن بشران، ابو طاہر بن عبد الرحیم، برقانی وغیرہ نے روایت کیا، اور نسخوں میں ترتیب اور الفاظ کا فرق ہے {cite:sunan-daraqutni-ibn-hazm-2011 p. 8-10}۔"
