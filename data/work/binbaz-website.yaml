summary:
  ar: "الموقع الذي يجمع تراث الشيخ عبد العزيز بن باز العلمي وفتاواه ودروسه؛ أقدم لقطة له في أرشيف الإنترنت في نوفمبر 1999 يصف فيها نفسه بأنه موقعه الرسمي الوحيد المعتمد منه كتابةً قبل وفاته، بإشراف ابنه أحمد، وهو اليوم من مشاريع مجموعة زاد التي يملكها محمد صالح المنجد."
  en: "The site that gathers the scholarly legacy, fatwas and lessons of Shaykh Abd al-Aziz ibn Baz; its earliest archived capture, of November 1999, calls it his only official site, approved by him in writing before his death and supervised by his son Ahmad; today it is a project of the Zad Group owned by Muhammad Salih al-Munajjid."
  ur: "وہ سائٹ جو شیخ عبدالعزیز بن باز کا علمی ورثہ، فتاویٰ اور دروس جمع کرتی ہے؛ نومبر 1999 کی سب سے پرانی آرکائیو تصویر میں وہ خود کو ان کی واحد سرکاری سائٹ کہتی ہے جس کی انہوں نے وفات سے پہلے تحریری منظوری دی، نگران ان کے صاحبزادے احمد؛ آج یہ محمد صالح المنجد کے زاد گروپ کا منصوبہ ہے۔"
