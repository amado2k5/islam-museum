summary:
  ar: "سيرة نبوية معاصرة مطولة لعلي محمد الصلابي ⁦(المقدمة مؤرخة 1421هـ/2000م)⁩، تعرض الأحداث من أحوال العالم قبل البعثة إلى الوفاة في سبعة عشر فصلاً وأكثر، وتختم كل حدث بمبحث «دروس وعبر وفوائد»، وتعتمد على المصادر القديمة وعلى الدراسات الحديثة كالرحيق المختوم وفقه السيرة؛ طبعة دار المعرفة السابعة 2008 في 934 صفحة."
  en: "A long contemporary biography of the Prophet by Ali Muhammad al-Sallabi (preface dated 1421/2000), covering events from the state of the world before the mission to the Prophet's death in seventeen and more chapters, each event closing with a section of 'lessons, morals and benefits', drawing on classical sources and on modern studies such as al-Raheeq al-Makhtum and Fiqh al-Sira; Dar al-Ma'rifa 7th edition 2008, 934 pages."
