structure: "مقدمة (ص5–12)؛ الفصل الأول: أهم الأحداث من قبل البعثة حتى نزول الوحي (ص13–)؛ ثم العهد المكي والهجرة؛ ثم بناء المجتمع في المدينة (المؤاخاة، الوثيقة، السرايا)؛ الفصل الثامن بدر (نتائجها ص436–440)؛ التاسع أحد؛ العاشر بنو النضير وذات الرقاع وبنو المصطلق؛ الحادي عشر الأحزاب؛ الثاني عشر زواج زينب وما بعد الخندق؛ الثالث عشر الحديبية وخيبر ودعوة الملوك وعمرة القضاء؛ الرابع عشر ما بين الحديبية والفتح وفيه مؤتة (ص 696–) وذات السلاسل؛ الخامس عشر فتح مكة (ص734–780)؛ السادس عشر حنين والطائف (ص780–807)؛ السابع عشر تبوك (ص808–850) وما بعدها إلى حجة الوداع والوفاة؛ المصادر والمراجع حتى ص 916؛ فهرس المحتويات حتى ص934."
