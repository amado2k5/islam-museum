kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 7: سيرة رسول الله 07 | العلم بالله أول دروس الوحي"
  en: "The Biography of the Messenger of God 2026, episode 7: Knowledge of God is the first lesson of revelation"
  ur: "سیرتِ رسول اللہ 2026، قسط 7: اللہ کی معرفت وحی کا پہلا سبق"
  fr: "La biographie du Messager de Dieu 2026, épisode 7 : La connaissance de Dieu, première leçon de la révélation"
  es: "La biografía del Mensajero de Dios 2026, episodio 7: El conocimiento de Dios, primera lección de la revelación"
summary:
  ar: "تُتمّ الحلقة السابعة الحديث عن بدء الوحي. يتأمل الشيخ لماذا تتحدث الآيات الأولى من السورة الأولى نزولًا عن الله وعن حاجة الإنسان إلى خالقه، ثم يدرس الروايات في اختبار خديجة للزائر وفي فضائلها، ورواية ابن إسحاق عن فترة الوحي، مع الملاحظات اللغوية لابن هشام والسهيلي وتعليقات ابن كثير."
  en: "The seventh session finishes the account of the first revelation. He reflects on why the opening verses of the first sura revealed speak of God and of human need for the Creator, then studies the reports on Khadija's testing of the visitor and her merits, and Ibn Ishaq's account of the pause in revelation, with language notes by Ibn Hisham and al-Suhayli and the comments of Ibn Kathir."
  ur: "ساتویں نشست پہلی وحی کے بیان کو مکمل کرتی ہے۔ وہ غور کرتے ہیں کہ سب سے پہلے نازل ہونے والی سورت کی ابتدائی آیات اللہ کا اور خالق کی طرف انسان کی حاجت کا ذکر کیوں کرتی ہیں، پھر خدیجہ کی طرف سے آنے والے کی آزمائش اور ان کے فضائل کی روایات، اور وحی کے وقفے کے بارے میں ابن اسحاق کا بیان پڑھتے ہیں، جس کے ساتھ ابن ہشام اور سہیلی کے لغوی نکات اور ابن کثیر کے تبصرے بھی ہیں۔"
  fr: "La septième séance achève le récit de la première révélation. Il réfléchit à la raison pour laquelle les versets d'ouverture de la première sourate révélée parlent de Dieu et du besoin qu'a l'être humain de son Créateur, puis étudie les récits sur l'épreuve que Khadija fit subir au visiteur et sur ses mérites, ainsi que le récit d'Ibn Ishaq sur la pause de la révélation, avec les notes de langue d'Ibn Hicham et d'al-Suhayli et les commentaires d'Ibn Kathir."
  es: "La séptima sesión termina el relato de la primera revelación. Reflexiona sobre por qué los versículos iniciales de la primera sura revelada hablan de Dios y de la necesidad que el ser humano tiene de su Creador, y luego estudia los relatos sobre la prueba que Khadija hizo al visitante y sobre sus méritos, y el relato de Ibn Ishaq sobre la pausa de la revelación, con las notas de lengua de Ibn Hisham y al-Suhayli y los comentarios de Ibn Kathir."
