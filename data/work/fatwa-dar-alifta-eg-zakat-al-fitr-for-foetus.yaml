id: work/fatwa-dar-alifta-eg-zakat-al-fitr-for-foetus
class: work
kind: fatwa
label: { ar: "حكم إخراج زكاة الفطر عن الجنين", en: "Paying zakat al-fitr for the unborn child", ur: "جنین کے لیے زکات فطر ادا کرنے کا حکم", es: "Pagar el zakat al-fitr por el niño no nacido", fr: "Payer la zakat al-fitr pour l'enfant à naître" }
summary:
  ar: "سائل سأل عن إخراج زكاة الفطر عن الجنين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22533)⁩ أن زكاة الفطر واجبة على كل مسلم صغيرًا كان أو كبيرًا ذكرًا أو أنثى يخرجها عن نفسه أو يخرجها عنه من تلزمه نفقته، وبيّن الجواب حكم الجنين فيها."
  en: "A questioner asked about paying zakat al-fitr for the unborn child. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22533) answered that zakat al-fitr is obligatory on every Muslim, young or old, male or female — paid by himself or by whoever must support him — and the answer sets out where the unborn stands in it."
  ur: "ایک سائل نے جنین کے لیے زکات فطر ادا کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22533)⁩ نے جواب دیا کہ زکات فطر ہر مسلمان پر واجب ہے چھوٹا ہو یا بڑا مرد ہو یا عورت — خود ادا کرے یا وہ شخص جس پر اس کی کفالت لازم ہے — اور جواب میں جنین کا حکم بھی بیان ہوا۔"
  es: "Un consultante preguntó acerca del pago del zakat al-fitr para el niño por nacer. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22533) respondió que el zakat al-fitr es obligatorio para todo musulmán, joven o anciano, hombre o mujer, pagado por él mismo o por quien deba mantenerlo, y la respuesta establece cuál es la situación del niño por nacer en este concepto."
  fr: "Une personne a posé une question concernant le versement de la zakat al-fitr pour l'enfant à naître. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22533) a répondu que la zakat al-fitr est obligatoire pour tout musulman, jeune ou âgé, homme ou femme – qu'il doit la verser lui-même ou par la personne qui subvient à ses besoins – et la réponse précise le statut de l'enfant à naître dans ce cadre."
