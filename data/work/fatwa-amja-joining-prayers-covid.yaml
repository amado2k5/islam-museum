label: { ar: "الجمع بين الصلاتين في النازلة", en: "Joining the two prayers amid the COVID crisis", ur: "دو نمازوں کا جمع — کورونا", es: "Uniendo las dos oraciones en medio de la crisis de la COVID", fr: "Unir les deux prières au milieu de la crise du COVID" }
summary:
  ar: "سأل سائل عن جواز الجمع بين الصلاتين في ظل نازلة فيروس كورونا. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87732 بتاريخ 23 مارس 2020)⁩ بتفصيل أحكام الجمع في النازلة وما يبيحه من الأعذار على ما ورد في الجواب."
  en: "A questioner asked whether joining the two prayers is lawful amid the COVID crisis. AMJA's fatwa committee (fatwa no. 87732, 23 March 2020) answered detailing the joining rulings in the crisis and which excuses permit it — as the response sets out."
  ur: "کورونا میں جمع؟ لجنة الفتوى ⁦(فتویٰ 87732، 23 مارچ 2020)⁩ نے نازلے میں جمع کے احکام اور عذر بیان کیے۔"
  es: "Un consultante preguntó si la combinación de ambas oraciones es lícita en medio de la crisis de la COVID-19. El comité de fatuas de AMJA (fatua n.º 87732, del 23 de marzo de 2020) respondió detallando las normas sobre la combinación de oraciones durante la crisis y las excusas que la permiten, tal como se expone en la respuesta."
  fr: "Une personne a demandé si le regroupement des deux prières était licite en cette période de crise sanitaire liée à la COVID-19. Le comité des fatwas de l'AMJA (fatwa n° 87732, 23 mars 2020) a répondu en détaillant les règles relatives à ce regroupement dans le contexte de la crise et les motifs justifiant cette pratique, comme l'indique la réponse."
