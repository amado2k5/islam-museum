id: work/fatwa-amja-more-than-three-wudu
class: work
kind: fatwa
label: { ar: "الزيادة على ثلاث في الوضوء", en: "More than three washings — disliked, not voiding", ur: "تین سے زائد دھونا — مکروہ نہ باطل", es: "Más de tres lavados: no me gustó, no me gustó", fr: "Plus de trois lavages — déplaisant, pas vidage", tr: "Temizlikte üç tane eklemek", id: "Menambahkan tiga saat wudhu" }
summary:
  ar: "سأل سائل عن فتوى سمعها لابن باز في الزيادة على ثلاث مرات في أفعال الوضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77580 بتاريخ 26 يناير 2009)⁩ أن جماهير العلماء على أن الزيادة على الثلاث مرات في أفعال الوضوء مكروه لأنه مخالف لهدي النبي ولكنه لا يبطل الوضوء وحكى الدارمي عن قوم أنهم كانوا يفعلون ذلك استحسانًا على ما فصّل الجواب."
  en: "A questioner had heard Ibn Baz's fatwa on exceeding three washings in the wudu acts. Dr. Salah al-Sawi (fatwa no. 77580, 26 January 2009) answered that the majority of scholars hold exceeding the three times in wudu's acts disliked — contrary to the Prophet's guidance — though it does not void the wudu; al-Darimi reported of some that they did it approvingly — as the answer details."
  ur: "تین سے زائد دھونا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77580، 26 جنوری 2009)⁩ کے مطابق جمہور کے نزدیک مکروہ ہے مگر وضو باطل نہیں۔"
  es: "Un consultante había escuchado la fatwa de Ibn Baz sobre exceder las tres abluciones en los actos de la ablución (wudu). El Dr. Salah al-Sawi (fatwa n.° 77580, 26 de enero de 2009) respondió que la mayoría de los eruditos consideran desaconsejable exceder las tres abluciones en los actos de la ablución —contrario a la guía del Profeta—, aunque esto no invalida la ablución; al-Darimi informó que algunos lo hicieron con aprobación, como se detalla en la respuesta."
  fr: "Un internaute avait entendu la fatwa d'Ibn Baz concernant le fait de dépasser trois lavages dans les actes d'ablution. Le Dr Salah al-Sawi (fatwa n° 77580, 26 janvier 2009) a répondu que la majorité des savants déconseillent de dépasser trois fois les actes d'ablution — contrairement à l'enseignement du Prophète —, bien que cela n'invalide pas les ablutions. Al-Darimi a rapporté que certains le faisaient avec approbation, comme le précise la réponse."
  tr: "Bir soru soran kişiye, İbn Baz'dan alevlenme işlemlerinde üç kattan fazla artışla ilgili bir fetva hakkında duyduğu bir fetva soruldu. Dr. Salah Al-Sawi (26 Ocak 2009 tarihli 77580 No'lu fetva) alimlerin çoğunluğunun abdest alma sayısını üç kattan fazla artırmanın Peygamber'in rehberine aykırı olduğu için sevilmediğini düşündüğünü ancak bunun abdest almayı geçersiz kılmadığını söyledi. El-Darimi, bazı kişilerden bunu tercih olarak yaptıklarını bildirdi, açıklamada açıklandığı gibi."
  id: "Seorang penanya ditanya tentang fatwa yang didengarnya dari Ibn Baz mengenai peningkatan lebih dari tiga kali lipat dalam tindakan wudhu. Dr. Salah Al-Sawi menjawab (Fatwa No. 77580 tanggal 26 Januari 2009) bahwa mayoritas ulama berpendapat bahwa menambah jumlah wudhu lebih dari tiga kali tidak disukai karena bertentangan dengan petunjuk Nabi, tetapi tidak membatalkan wudhu. Al-Darimi melaporkan dari beberapa orang bahwa mereka melakukan ini karena preferensi, seperti yang dijelaskan dalam penjelasan."
