label: { ar: "قصيدة المتنبي «المجد للسيف لا للقلم»", en: "Al-Mutanabbi's ode 'Glory belongs to the sword, not the pen'", es: "La oda de Al-Mutanabbi: \"La gloria pertenece a la espada, no a la pluma\".", fr: "L'ode d'Al-Mutanabbi: « La gloire appartient à l'épée, non à la plume »", ur: "المتنبی کا کلام 'شان و شوکت تلوار کی ہے قلم کی نہیں'" }
summary:
  ar: "قصيدة من البسيط على روي الميم للمتنبي، قالها بالكوفة وفيها يذكر مسيره من مصر كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.495}}."
  en: "An ode in the basit metre on the rhyme mim by al-Mutanabbi; said at Kufa, in which he recalls his journey from Egypt, as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.495}}."
  es: "Una oda en metro basit sobre la rima mim de al-Mutanabbi; dicha en Kufa, en la que recuerda su viaje desde Egipto, como la introduce la edición de Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.495}}."
  fr: "Une ode en mètre basit sur la rime mim par al-Mutanabbi; dite à Kufa, dans laquelle il rappelle son voyage depuis l'Égypte, comme l'indique l'édition Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.495}}."
  ur: "المتنبی کی نظم میم پر باسط میٹر میں ایک اوڈ؛ کوفہ میں کہا، جس میں وہ مصر سے اپنے سفر کو یاد کرتے ہیں، جیسا کہ دار بیروت ایڈیشن نے اسے متعارف کرایا ہے {{حوالہ:دیوان-متنبی-در-بیروت-1983 صفحہ 495}}۔"
