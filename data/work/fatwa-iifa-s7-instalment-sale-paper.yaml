label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن البيع بالتقسيط ⁦(والأوراق التجارية)⁩", en: "IIFA resolution on instalment sale — commercial paper", ur: "اکیڈمی کی قرارداد: اقساط کی بیع اور تجارتی کاغذات", es: "Resolución de la IIFA sobre la venta a plazos — papel comercial", fr: "Résolution de l'IIFA sur la vente à tempérament — titres de créance commerciaux", tr: "Uluslararası İslami Fiqh Akademisi'nin taksitli satışlar (ve ticari kağıtlar) ile ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai penjualan cicilan (dan surat kabar komersial)" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السابعة ⁦(مكة، مايو 1992م)⁩: البيع بالتقسيط جائز شرعًا ولو زاد الثمن المؤجل على المعجل، والأوراق التجارية ⁦(الشيكات والسندات لأمر وسندات السحب)⁩ من التوثيق المشروع للدين بالكتابة، وحسم ⁦(خصم)⁩ الأوراق التجارية غير جائز لأنه يؤول إلى ربا النسيئة، والحطيطة من الدين لها أحكامها على ما فصّل."
  en: "IIFA's seventh-session resolution (Mecca, May 1992) on instalment sale and commercial paper: instalment sale is lawful even with a higher deferred price; commercial papers — cheques, promissory notes, bills of exchange — are a lawful way of documenting debt in writing; discounting commercial paper is impermissible as it amounts to riba al-nasi'a; and rebate of debt carries its own rulings, as detailed."
  ur: "اکیڈمی کی ساتویں مجلس کی قرارداد ⁦(مکہ، مئی 1992ء)⁩: اقساط کی بیع جائز؛ چیک، پرامزری نوٹ اور بل آف ایکسچینج قرض کی تحریری دستاویزات ہیں؛ ان کا ڈسکاؤنٹ ربا نسیئہ ہونے کی وجہ سے حرام۔"
  es: "Resolución de la séptima sesión de la IIFA (La Meca, mayo de 1992) sobre la venta a plazos y los documentos comerciales: la venta a plazos es lícita incluso con un precio diferido más alto; los documentos comerciales (cheques, pagarés, letras de cambio) son una forma lícita de documentar la deuda por escrito; el descuento de documentos comerciales es inadmisible, ya que equivale a riba al-nasi'a; y la condonación de deudas tiene sus propias normas, como se detalla."
  fr: "Résolution de la septième session de l'IIFA (La Mecque, mai 1992) sur la vente à tempérament et les effets de commerce: la vente à tempérament est licite même avec un prix différé plus élevé; les effets de commerce — chèques, billets à ordre, lettres de change — sont un moyen licite de documenter une dette par écrit; l'escompte des effets de commerce est interdit car il équivaut à du riba al-nasi'a; et la remise de dette est soumise à ses propres règles, comme détaillé."
  tr: "Uluslararası İslami Fiqh Akademisi'nin yedinci oturumunda (Mekke, Mayıs 1992) kararı: Taksitli satışlar, ertelenmiş fiyat hızlandırılmış tutarı aşsa bile dini olarak izinlidir. Ticari kağıtlar (çekler, senetler ve çek tahvilleri) borç için yasal olarak yazılı olarak belgelenmemiştir. Ticari senetlerde indirim (indirim) yapılamaz çünkü faiz tefeciliği anlamına gelir ve borçtan indirim kararları ayrıntılı olarak belirtilmiştir."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi ketujuhnya (Mekah, Mei 1992): Penjualan cicilan diperbolehkan secara hukum meskipun harga yang ditunda melebihi jumlah yang dipercepat. Surat dagang (cek, surat promes, dan surat bayaran) tidak didokumentasikan secara hukum untuk utang secara tertulis. Pengurangan (diskon) pada surat utang tidak diperbolehkan karena merupakan riba bunga, dan pengurangan dari utang memiliki keputusan yang rinci."
