summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السابعة ⁦(مكة، مايو 1992م)⁩: البيع بالتقسيط جائز شرعًا ولو زاد الثمن المؤجل على المعجل، والأوراق التجارية ⁦(الشيكات والسندات لأمر وسندات السحب)⁩ من التوثيق المشروع للدين بالكتابة، وحسم ⁦(خصم)⁩ الأوراق التجارية غير جائز لأنه يؤول إلى ربا النسيئة، والحطيطة من الدين لها أحكامها على ما فصّل."
  en: "IIFA's seventh-session resolution (Mecca, May 1992) on instalment sale and commercial paper: instalment sale is lawful even with a higher deferred price; commercial papers — cheques, promissory notes, bills of exchange — are a lawful way of documenting debt in writing; discounting commercial paper is impermissible as it amounts to riba al-nasi'a; and rebate of debt carries its own rulings, as detailed."
  ur: "اکیڈمی کی ساتویں مجلس کی قرارداد ⁦(مکہ، مئی 1992ء)⁩: اقساط کی بیع جائز؛ چیک، پرامزری نوٹ اور بل آف ایکسچینج قرض کی تحریری دستاویزات ہیں؛ ان کا ڈسکاؤنٹ ربا نسیئہ ہونے کی وجہ سے حرام۔"
  es: "Resolución de la séptima sesión de la IIFA (La Meca, mayo de 1992) sobre la venta a plazos y los documentos comerciales: la venta a plazos es lícita incluso con un precio diferido más alto; los documentos comerciales (cheques, pagarés, letras de cambio) son una forma lícita de documentar la deuda por escrito; el descuento de documentos comerciales es inadmisible, ya que equivale a riba al-nasi'a; y la condonación de deudas tiene sus propias normas, como se detalla."
