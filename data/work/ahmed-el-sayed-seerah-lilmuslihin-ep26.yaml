id: work/ahmed-el-sayed-seerah-lilmuslihin-ep26
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 26: صلح الحديبية"
  en: "The Prophetic Biography for Reformers, episode 26: The Treaty of Hudaybiyya"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 26: صلح حدیبیہ"
  fr: "La biographie prophétique pour les réformateurs, épisode 26 : Le traité de Hudaybiyya"
  es: "La biografía profética para los reformadores, episodio 26: El tratado de Hudaybiyya"
summary:
  ar: "يواصل المحاضر الحديث عن الحديبية في السنة السادسة للهجرة، متتبعا الرواية الطويلة في صحيح البخاري: الناقة التي بركت، والماء، وسفراء قريش، والتفاوض على الصلح مع سهيل بن عمرو، وقصة أبي جندل، واعتراض عمر، والتردد في النحر والحلق، ثم قصة أبي بصير لاحقا. ويختم بسورة الفتح وبيعة الشجرة والدروس التي يستخلصها للمصلحين."
  en: "The lecturer continues the account of Hudaybiyya in the sixth year of the Hijra, following the long narration in Sahih al-Bukhari: the halted camel, the water, the Quraysh envoys, the negotiation of the treaty with Suhayl ibn Amr, the case of Abu Jandal, Umar's protest, the reluctance to slaughter and shave, and the later story of Abu Basir. He closes with the Qur'anic chapter of al-Fath, the pledge under the tree, and lessons he draws for reformers."
  ur: "مقرر ہجرت کے چھٹے سال کے حدیبیہ کے واقعے کا بیان جاری رکھتے ہیں اور صحیح بخاری کی طویل روایت کی پیروی کرتے ہیں: بیٹھ جانے والی اونٹنی، پانی، قریش کے سفیر، سہیل بن عمرو کے ساتھ صلح کی گفت و شنید، ابو جندل کا واقعہ، عمر کا اعتراض، قربانی اور سر منڈانے میں ہچکچاہٹ، اور بعد میں ابو بصیر کی کہانی۔ آخر میں وہ سورہ فتح، درخت کے نیچے بیعت اور مصلحین کے لیے اخذ کردہ اسباق بیان کرتے ہیں۔"
  fr: "Le conférencier poursuit le récit de Hudaybiyya, en la sixième année de l'Hégire, en suivant la longue narration de Sahih al-Bukhari : la chamelle arrêtée, l'eau, les envoyés de Quraysh, la négociation du traité avec Suhayl ibn Amr, le cas d'Abu Jandal, la protestation d'Umar, la réticence à sacrifier et à se raser, puis plus tard l'histoire d'Abu Basir. Il conclut par la sourate al-Fath, le serment sous l'arbre et les leçons qu'il en tire pour les réformateurs."
  es: "El conferenciante continúa el relato de Hudaybiyya, en el sexto año de la Hégira, siguiendo la larga narración de Sahih al-Bukhari: la camella detenida, el agua, los enviados de Quraysh, la negociación del tratado con Suhayl ibn Amr, el caso de Abu Jandal, la protesta de Umar, la reticencia a sacrificar y rasurarse, y más tarde la historia de Abu Basir. Concluye con la sura al-Fath, el juramento bajo el árbol y las lecciones que extrae para los reformadores."
