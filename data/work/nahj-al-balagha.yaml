summary:
  ar: "المجموع من كلام علي بن أبي طالب وكلماته المنتقاة؛ اختلف العلماء فيه فقيل جمعه الشريف الرضي وقيل الشريف المرتضى وقيل ليس من كلام علي وإنما الذي جمعه ونسبه إليه هو الذي وضعه، كذا أورده ابن خلكان وابن العماد على جهة الاختلاف {cite:shadharat-dhahab p. 264-265}."
  en: "The selected speeches and sayings of 'Ali b. Abi Talib — whose compiler Sunni scholars disputed: some saying al-Sharif al-Radi, some al-Sharif al-Murtada, and some that the compiler himself composed what he attributed to 'Ali {cite:shadharat-dhahab p. 264-265}."
  es: "Los discursos y dichos selectos de 'Ali b. Abi Talib —cuyo compilador fue objeto de disputa entre los eruditos sunitas: algunos dicen que fue al-Sharif al-Radi, otros al-Sharif al-Murtada, y otros que el propio compilador compuso lo que atribuyó a 'Ali {cite:shadharat-dhahab p. 264-265}."
  fr: "Les discours et paroles sélectionnés d'Ali b. Abi Talib — dont le compilateur a fait l'objet de controverses parmi les érudits sunnites: certains disant al-Sharif al-Radi, d'autres al-Sharif al-Murtada, et d'autres encore que le compilateur lui-même a composé ce qu'il a attribué à Ali {cite: shadharat-dhahab p. 264-265}."
  ur: "علی کی منتخب تقریریں اور اقوال ابی طالب - جن کے مرتب کرنے والے سنی علماء نے اختلاف کیا ہے: بعض کہتے ہیں الشریف الرادی، بعض نے الشریف المرتضیٰ، اور بعض یہ ہیں کہ مرتب نے خود اس کی تصنیف کی ہے جسے اس نے علی سے منسوب کیا ہے۔ 264-265}۔"
  tr: "Ali bin Ebi Talib'in sözleri ve seçilmiş sözleri derlemesi; alimler bu konuda farklı görüşlerde bulunmuştur; el-Şerif el-Radi tarafından derlendiği ve başkaları el-Şerif el-Murtada tarafından derlendiği söylenir, bazıları ise bunun Ali'nin sözlerinden değil, onun derleyip ona atfettiği şeyin onu yazan kişi olduğunu söyler. Aynı şekilde, İbn Hallikan ve İbn el-İmad da anlaşmazlık tarafında rapor etmişler {atıf:şadharat-dhahab, s. 264-265}."
  id: "Kumpulan kata-kata Ali ibn Abi Talib dan perkataan pilihannya; para ulama berbeda pendapat tentang hal ini; dikatakan bahwa itu disusun oleh al-Sharif al-Radi, dan yang lain oleh al-Sharif al-Murtada, dan yang lain mengatakan itu bukan dari perkataan Ali, melainkan apa yang ia susun dan atribusikan kepadanya adalah orang yang menyusunnya. Demikian pula, Ibn Khallikan dan Ibn al-Imad melaporkannya dalam pihak yang berbeda pendapat {cite:shadharat-dhahab, hlm. 264-265}."
