label: { ar: "قرار مجمع الفقه الإسلامي الدولي 242 (25/4) بشأن ظاهرة القراءة في الصلاة بغير العربية", en: "IIFA resolution 242 (25/4) on the phenomenon of reciting in prayer in a language other than Arabic", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 242 (25/4): نماز میں غیر عربی قراءت کے رجحان پر", es: "Resolución 242 (25/4) de la IIFA sobre el fenómeno de recitar en la oración en un idioma distinto del árabe.", fr: "Résolution 242 (25/4) de l'IIFA sur le phénomène de la récitation de prières dans une langue autre que l'arabe", tr: "Arapça dışında namaz kılma olgusuna ilişkin Uluslararası İslami Fiqh Akademisi Kararı 242 (25/4)", id: "Resolusi Akademi Fiqh Islam Internasional 242 (25/4) mengenai fenomena bacaan doa di luar bahasa Arab" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩، في ظاهرة دعوة جديدة إلى الصلاة بترجمات معاني القرآن والأذكار بدل القراءة بالعربية، وبيّن أنها لا علاقة لها بالخلاف الفقهي المعروف في القراءة بغير العربية. قرر المجمع أن الصلاة بالعربية من المتواترات لفظًا ومعنى وشعيرة استقر عليها عمل الأمة من عصر الصحابة فلا يجوز مخالفتها؛ وأن الصلاة بغير العربية لا تصح ولا عذر لمن لم يتعلم ما تجب قراءته من القرآن والأذكار الواجبة، ويستثنى حديث العهد بالإسلام والعاجز كليًا عن تعلم العربية؛ وأن ترجمة معاني القرآن ليست قرآنًا بإجماع المسلمين لأن القرآن اسم للفظ والنظم معًا والترجمات كلام بشر غير معصومة ولا يتعبد بتلاوتها؛ وأن الصلاة بالترجمات باطلة تجب إعادتها لترك ركن قراءة القرآن؛ ولولي الأمر تعزير من يصلي أو يدعو إلى الصلاة بغير العربية لما يترتب على فعله من مفاسد. وأوصى بمناشدة الحكومات والمؤسسات التصدي للدعوة إليها، وبدعوة جهات الإفتاء والأئمة لبيان خطورتها، وتسهيل تعلم لغة القرآن."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023), on a new phenomenon calling for prayer using translations of the meanings of the Qur'an and the required invocations instead of reciting in Arabic, which it distinguished from the known juristic disagreement over reciting in a non-Arabic language. It ruled that praying in Arabic belongs to what is transmitted in wording and meaning and is a rite on which the practice of the community has been settled since the Companions, so it may not be contravened; that prayer in a non-Arabic language is not valid and there is no excuse for one who has not learned the required Qur'an and invocations, except the new Muslim and one utterly unable to learn Arabic; that translations of the meanings of the Qur'an are not Qur'an by the consensus of Muslims — the Qur'an names the wording and composition together, while translations are the words of humans, neither inerrant nor recited as worship; that prayer performed in translations is invalid and must be repeated for leaving the pillar of Qur'an recitation; and that the ruler may discipline whoever prays or calls to prayer in a non-Arabic language for the harms it entails. It recommended that governments and institutions counter the call, that fatwa bodies and imams explain its danger, and that learning the language of the Qur'an be made easy."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں، ایک نئے رجحان پر جس نے نماز میں قرآن و اذکار کے ترجمہ معانی کو عربی قراءت کے بدل استعمال کرنے کی دعوت دی، اور اکیڈمی نے اسے غیر عربی قراءت کے معروف فقہی اختلاف سے الگ قرار دیا۔ اکیڈمی نے فیصلہ کیا کہ عربی نماز لفظاً و معنیٰ متواتر امور میں سے اور ایسی شعیر ہے جس پر امت کا عمل صحابہ کے زمانے سے مستقر ہے، اس کی مخالفت جائز نہیں؛ غیر عربی نماز صحیح نہیں اور جو واجب قراءت و اذکار نہ سیکھے اسے کوئی عذر نہیں، سوائے نومسلم اور اس کے جو عربی سیکھنے سے بالکل عاجز ہو؛ قرآن کے ترجمہ معانی مسلمانوں کے اتفاق سے قرآن نہیں کیونکہ قرآن لفظ اور نظم دونوں کا نام ہے، جب کہ ترجمے انسان کا کلام ہیں، معصوم نہیں اور ان کی تلاوت عبادت نہیں؛ ترجموں سے کی گئی نماز باطل ہے اور قراءتِ قرآن کے رکن کے ترک ہونے سے اس کی اعادت واجب ہے؛ اور والیِ امر غیر عربی نماز پڑھنے یا اس کی دعوت دینے والے کو اس کے مفاسد کی بنا پر تعزیر دے سکتا ہے۔ سفارشات میں حکومتوں و اداروں سے اس دعوت کا مقابلہ، مفتیان و ائمہ سے اس کے خطرات کے بیان، اور قرآن کی زبان سیکھنے کی سہولت کی دعوت شامل ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 25.ª sesión en Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 de febrero de 2023), sobre un nuevo fenómeno que pide la oración utilizando traducciones de los significados del Corán y las invocaciones requeridas en lugar de recitar en árabe, que distinguió del conocido desacuerdo jurídico sobre recitar en un idioma que no sea árabe. Dictaminó que la oración en árabe pertenece a lo que se transmite en palabras y significado y es un rito sobre el cual la práctica de la comunidad ha sido establecida desde los Compañeros, por lo que no puede ser contravenida; que la oración en un idioma que no sea árabe no es válida y no hay excusa para quien no ha aprendido el Corán y las invocaciones requeridas, excepto el nuevo musulmán y aquel totalmente incapaz de aprender árabe; Según el consenso de los musulmanes, las traducciones del significado del Corán no constituyen el Corán en sí mismo, ya que el Corán define la redacción y la composición en su conjunto, mientras que las traducciones son meras palabras humanas, infalibles y no aptas para la adoración. Asimismo, se afirma que la oración realizada con traducciones es inválida y debe repetirse para no abandonar el pilar de la recitación coránica. Además, se recomienda que el gobernante castigue a quien ore o llame a la oración en un idioma distinto del árabe por los perjuicios que ello conlleva. Se aconseja que los gobiernos e instituciones contrarresten esta práctica, que los organismos de fatuas y los imanes expliquen su peligro y que se facilite el aprendizaje del idioma del Corán."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh), lors de sa 25e session à Djeddah (29 Rajab – 3 Sha'ban 1444, 20-23 février 2023), concernant un nouveau phénomène appelant à prier en utilisant des traductions du sens du Coran et des invocations requises au lieu de réciter en arabe, a été adoptée. Cette résolution se distingue du désaccord juridique connu concernant la récitation dans une langue non arabe. L'Académie a statué que la prière en arabe fait partie de la tradition transmise, tant au niveau du texte que du sens, et constitue un rite établi par la communauté depuis les Compagnons; elle ne saurait donc être transgressée. La résolution stipule également que la prière dans une langue non arabe est invalide et qu'aucune excuse n'est valable pour celui qui n'a pas appris le Coran et les invocations requis, à l'exception du nouveau musulman et de celui qui est absolument incapable d'apprendre l'arabe. Il est établi que les traductions du Coran ne constituent pas le Coran selon le consensus musulman: le Coran nomme le texte et sa composition de manière indissociable, tandis que les traductions sont des œuvres humaines, ni infaillibles ni récitées comme acte d’adoration. La prière accomplie en utilisant des traductions est invalide et doit être répétée, car elle contrevient au pilier de la récitation du Coran. Le dirigeant peut sanctionner quiconque prie ou appelle à la prière dans une langue autre que l’arabe, en raison des préjudices que cela engendre. Il est recommandé aux gouvernements et aux institutions de s’opposer à cet appel, aux instances de fatwas et aux imams d’en expliquer le danger, et de faciliter l’apprentissage de la langue coranique."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Cidde'deki yirmi beşinci oturumunda (29 Rajab – 3 Şa'ban 1444 H, 20–23 Şubat 2023), Arapça okuma yerine Kur'an'ın anlamlarının çevirileriyle ve dualarla yeni bir ezan olgusu hakkında ortak karar, bunun Arapça olmayan okumalarda okunma konusundaki bilinen fıkıh anlaşmazlığıyla hiçbir ilgisi olmadığını açıklığa kavuşturmaktadır. Akademi, Arapça namaz kılmanın, Ümmetin Sahabeler döneminden beri uygulamayla yerleşmiş bir mutevatire (yaygın şekilde aktarılan) olduğunu, bu nedenle Ümmetin ayini icra etmediğini; Arapça dışında yapılan namazın, Kur'an'ın zorunlu kılvetini ve zorunlu anmaları öğrenmemiş olanlar için geçerli olmadığını, ancak Arapçayı tamamen öğrenemeyen yeni İslam'a geçenler hariç, geçerli ve mazur görüldüğünü; Kur'an'ın anlamlarının Kur'an olarak çevrilmesinin Kur'an mutabakatı olmadığını belirtmiştir Müslümanlar çünkü Kur'an hem ifade hem de bileşim için bir isimdir ve çeviriler insan kelimeleridir, yanılmaz değildir ve ibadet sırasında okunmamalıdır; çevirili namaz geçersizdir ve Kur'an okumasının temel direğinden vazgeçmek için yeniden uygulanmalıdır; ve hükümdar, Arapça dışında namaz kılan veya namaz kılanları zararlar nedeniyle cezalandırabilir. Hükümetleri ve kurumları bu çağrıya karşı durmaya teşvik edilmesini, fetva yetkilileri ve imamları bu çağrının ciddiyetini netleştirmeye ve Kur'an dilini öğrenmeyi kolaylaştırmaya davet edilmesini tavsiye etti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-25 di Jeddah (29 Rajab – 3 Sha'ban 1444 H, 20–23 Februari 2023), mengenai fenomena panggilan salat baru dengan terjemahan makna Al-Qur'an dan doa alih-alih pembacaan dalam bahasa Arab, memperjelas bahwa hal ini tidak ada hubungannya dengan perbedaan yurisprudensi yang diketahui mengenai pembacaan dalam bacaan non-Arab. Akademi memutuskan bahwa shalat dalam bahasa Arab adalah salah satu mutawatir (yang banyak ditemoni) dalam kata-kata, makna, dan ritual, yang telah ditetapkan oleh praktik Ummah sejak zaman Para Sahabat, sehingga tidak diperbolehkan melanggarnya; bahwa shalat yang dilakukan di luar bahasa Arab tidak sah dan dimaafkan bagi mereka yang belum mempelajari bacaan wajib Al-Qur'an dan peringatan wajib, kecuali bagi mereka yang baru memeluk Islam dan sama sekali tidak mampu belajar bahasa Arab; bahwa menerjemahkan makna Al-Qur'an bukanlah Al-Qur'an berdasarkan konsensus umat Muslim karena Al-Qur'an adalah nama untuk kata-kata dan komposisi, dan terjemahan adalah kata-kata manusia yang tidak sempurna dan tidak boleh dibacakan melalui ibadah; bahwa doa dengan terjemahan tidak sah dan harus dipulihkan untuk meninggalkan pilar pembacaan Al-Qur'an; dan bahwa penguasa dapat menghukum mereka yang berdoa atau berdoa di luar bahasa Arab karena kerugian yang timbul dari hal tersebut. Surat ini merekomendasikan agar pemerintah dan institusi menghadapi panggilan tersebut, serta mengundang otoritas fatwa dan imam untuk menjelaskan keseriusannya serta memudahkan pembelajaran bahasa Al-Qur'an."
