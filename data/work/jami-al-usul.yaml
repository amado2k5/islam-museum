structure: "ثلاثة أركان: الأول في المبادي (خمسة أبواب: الباعث على عمل الكتاب، وكيفية وضعه، وأصول الحديث وأحكامه — الرواة والجرح والتعديل والنسخ وأقسام الصحيح — وتراجم الأئمة الستة)، والثاني في المقاصد (الكتب مرتبة على حروف المعجم بدءاً بحرف الهمزة: كتاب الإيمان والإسلام…، وفي آخرها كتاب الفضائل والمناقب وكتاب اللواحق)، والثالث في الخواتم (ومنه قسم تراجم الرجال المذكورين في الكتاب) (ط. دار ابن كثير، ص 45، 60–65، 179 من المسح)."
