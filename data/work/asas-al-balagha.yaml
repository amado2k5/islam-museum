summary:
  ar: "للعلامة جار الله أبي القاسم محمود بن عمر الزمخشري المتوفى سنة ٥٣٨هـ؛ كتاب كبير الحجم عظيم الفحوى من أركان فن الأدب بل هو أساسه، ذكر فيه المجازات اللغوية والمزايا الأدبية وتعبيرات البلغاء على ترتيب موادها كالمغرب، أوله: خير منطوق به إمام كل كلام {cite:kashf-zunun-furqan p. 375-376}. وينفرد أساس البلاغة، عند بعلبكي، بتتبع الاستعمال المجازي باطّراد: فمعظم مداخله مصدَّر بالمعاني الحقيقية يليها المجاز بعبارة «ومن المجاز»."
  en: "Al-Zamakhshari's Asas al-Balagha — a large lexicon of figurative usage and rhetorical expression ordered like al-Mughrib; 'a pillar of the literary art, indeed its foundation' {cite:kashf-zunun-furqan p. 375-376}. Baalbaki notes that Asas al-Balagha is unique among the classical dictionaries in following figurative usage consistently: most entries give the literal senses first, then the figurative ones introduced by the phrase 'and from the figurative'."
  es: "Asas al-Balagha de Al-Zamakhshari: un amplio léxico de uso figurativo y expresión retórica ordenado como al-Mughrib; 'un pilar del arte literario, de hecho su fundamento' {cita:kashf-zunun-furqan p. 375-376}. Baalbaki señala que el Asas al-Balagha es único entre los diccionarios clásicos al seguir de forma constante el uso figurado: la mayoría de las entradas dan primero los sentidos literales y luego los figurados, introducidos por la frase «y del sentido figurado»."
  fr: "Asas al-Balagha d'Al-Zamakhshari — un vaste lexique d'usage figuratif et d'expression rhétorique ordonné comme al-Mughrib; 'un pilier de l'art littéraire, voire son fondement' {cite:kashf-zunun-furqan p. 375-376}. Baalbaki note que l'Asas al-Balagha est unique parmi les dictionnaires classiques en suivant systématiquement l'emploi figuré : la plupart des entrées donnent d'abord les sens propres, puis les sens figurés introduits par la formule « et du figuré »."
  ur: "الزمخشری کی عاص البلاغہ - علامتی استعمال اور بیاناتی اظہار کی ایک بڑی لغت المغرب کی طرح ترتیب دی گئی ہے۔ 'ادبی فن کا ایک ستون، درحقیقت اس کی بنیاد' 375-376}۔ بعلبکی نوٹ کرتے ہیں کہ اساس البلاغہ کلاسیکی لغات میں اس لحاظ سے منفرد ہے کہ وہ مجازی استعمال کا مسلسل تتبع کرتی ہے: اکثر مداخل میں پہلے حقیقی معانی اور پھر «ومن المجاز» کے الفاظ سے مجازی معانی آتے ہیں۔"
