summary:
  ar: "للعلامة جار الله أبي القاسم محمود بن عمر الزمخشري المتوفى سنة ٥٣٨هـ؛ كتاب كبير الحجم عظيم الفحوى من أركان فن الأدب بل هو أساسه، ذكر فيه المجازات اللغوية والمزايا الأدبية وتعبيرات البلغاء على ترتيب موادها كالمغرب، أوله: خير منطوق به إمام كل كلام {cite:kashf-zunun-furqan p. 375-376}."
  en: "Al-Zamakhshari's Asas al-Balagha — a large lexicon of figurative usage and rhetorical expression ordered like al-Mughrib; 'a pillar of the literary art, indeed its foundation' {cite:kashf-zunun-furqan p. 375-376}."
  es: "Asas al-Balagha de Al-Zamakhshari: un amplio léxico de uso figurativo y expresión retórica ordenado como al-Mughrib; 'un pilar del arte literario, de hecho su fundamento' {cita:kashf-zunun-furqan p. 375-376}."
  fr: "Asas al-Balagha d'Al-Zamakhshari — un vaste lexique d'usage figuratif et d'expression rhétorique ordonné comme al-Mughrib; 'un pilier de l'art littéraire, voire son fondement' {cite:kashf-zunun-furqan p. 375-376}."
  ur: "الزمخشری کی عاص البلاغہ - علامتی استعمال اور بیاناتی اظہار کی ایک بڑی لغت المغرب کی طرح ترتیب دی گئی ہے۔ 'ادبی فن کا ایک ستون، درحقیقت اس کی بنیاد' 375-376}۔"
