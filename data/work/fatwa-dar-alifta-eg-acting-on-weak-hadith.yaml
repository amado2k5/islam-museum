id: work/fatwa-dar-alifta-eg-acting-on-weak-hadith
class: work
kind: fatwa
label: { ar: "حكم العمل بالحديث الضعيف وروايته في الفضائل والترغيب والقصص", en: "Acting on weak hadith and narrating it in virtues and exhortation", ur: "ضعیف حدیث پر عمل اور فضائل و ترغیب میں اس کی روایت کا حکم" }
summary:
  ar: "سائل سأل عن العمل بالحديث الضعيف وروايته في فضائل الأعمال والترغيب والقصص. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22492)⁩ أن رواية الأحاديث الضعيفة في فضائل الأعمال جائزة كما قرره العلماء من الفقهاء والمحدثين بشرط ألا يشتد ضعفه على ما فصّل الجواب من الضوابط."
  en: "A questioner asked about acting on weak hadith and narrating it in the virtues of deeds, exhortation and stories. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22492) answered that narrating weak hadith in the virtues of works is permissible as the scholars of fiqh and hadith have held, provided its weakness is not severe — under the conditions the answer details."
  ur: "ایک سائل نے ضعیف حدیث پر عمل کرنے اور فضائلِ اعمال، ترغیب اور قصص میں اس کی روایت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22492)⁩ نے جواب دیا کہ فضائلِ اعمال میں ضعیف احادیث کی روایت جائز ہے جیسا کہ فقہاء اور محدثین نے قرار دیا ہے، بشرطیکہ اس کی ضعف شدید نہ ہو — جواب کے بیان کردہ شرائط کے تحت۔"
