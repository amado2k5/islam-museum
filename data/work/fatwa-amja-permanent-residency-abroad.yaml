id: work/fatwa-amja-permanent-residency-abroad
class: work
kind: fatwa
label: { ar: "الإقامة الدائمة خارج ديار الإسلام", en: "Permanent residence outside Muslim lands", ur: "غیر اسلامی ملک میں مستقل قیام", es: "Residencia permanente fuera de tierras musulmanas", fr: "résidence permanente hors des terres musulmanes", tr: "İslam toprakları dışında kalıcı ikamet", id: "Tempat tinggal tetap di luar tanah Islam" }
summary:
  ar: "سأل سائل عن حكم الإقامة الدائمة في البلاد الأجنبية وقد نقصت الرواتب في الدول الإسلامية وقال بعضهم إنه يسهل القيام بالفرائض في أي دولة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78512 بتاريخ 10 أبريل 2009)⁩ أنه لا حرج في الإقامة لطلب التوسعة في الرزق خارج ديار الإسلام لمن كان قادرًا على إظهار دينه وآمنًا من الفتنة فيه، وللمجمع قرار حول حكم الإقامة خارج ديار الإسلام ناقش فيه هذه المسألة بالتفصيل بصورها المختلفة فليرجع إليه على موقع المجمع تحت عنوان قرارات وبيانات."
  en: "A questioner asked about permanent residence in foreign lands, citing scarce salaries in Muslim states and the ease of performing duties anywhere. Dr. Salah al-Sawi (fatwa no. 78512, 10 April 2009) answered that residing abroad to broaden provision is unobjectionable for one able to show his religion and safe from trial in it; the Assembly has a resolution on residence outside Muslim lands treating the question in its various forms — to be found on its site under Resolutions and Statements."
  ur: "ایک سائل نے روزی کے لیے بیرون ملک مستقل قیام کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78512، 10 اپریل 2009)⁩ کے مطابق دین ظاہر کرنے اور فتنے سے امن کی شرط پر جائز ہے اور مجمع کا مفصل قرار موجود ہے۔"
  es: "Un interlocutor preguntó sobre la residencia permanente en el extranjero, citando los bajos salarios en los estados musulmanes y la facilidad para desempeñar las funciones en cualquier lugar. El Dr. Salah al-Sawi (fatwa n.° 78512, 10 de abril de 2009) respondió que residir en el extranjero para ampliar las oportunidades no presenta inconveniente alguno para quien pueda demostrar su religión y estar a salvo de ser juzgado en ella; la Asamblea cuenta con una resolución sobre la residencia fuera de los países musulmanes que aborda la cuestión en sus diversas formas, la cual puede consultarse en su sitio web, en la sección de Resoluciones y Declaraciones."
  fr: "Un intervenant a posé une question sur la résidence permanente à l'étranger, évoquant la faiblesse des salaires dans les pays musulmans et la possibilité d'exercer ses fonctions n'importe où. Le Dr Salah al-Sawi (fatwa n° 78512, 10 avril 2009) a répondu que résider à l'étranger pour bénéficier de ressources supplémentaires n'est pas contestable pour une personne capable de prouver sa religion et à l'abri de toute poursuite judiciaire à ce sujet; l'Assemblée a adopté une résolution sur la résidence hors des pays musulmans, qui traite de la question sous ses différents aspects; cette résolution est disponible sur son site web, dans la section « Résolutions et déclarations »."
  tr: "Yabancı ülkelerde kalıcı oturma izni kararı hakkında bir soru soruldu ve İslam ülkelerinde maaşlar azaldı. Bazıları, herhangi bir ülkede dini görevleri yerine getirmenin daha kolay olduğunu söyledi. Dr. Salah Al-Sawy (10 Nisan 2009 tarihli 78512 sayılı Fetva) dinini kanıtlayabilen ve orada ayartmadan korunanlar için İslam toprakları dışında geçim kaynaklarını genişletmeye yönelik ikamet yapmanın zararı olmadığını yanıtladı. Akademi, İslam toprakları dışındaki ikamet kararıyla ilgili bir karara sahiptir ve bu konu çeşitli biçimlerinde ayrıntılı olarak ele alınmaktadır. Lütfen Akademi'nin web sitesinde Kararlar ve Açıklamalar başlığı altında bu kararı inceleyin."
  id: "Seorang penanya ditanya tentang putusan tentang status tinggal tetap di negara asing, dan gaji telah menurun di negara-negara Islam. Beberapa mengatakan bahwa lebih mudah menjalankan kewajiban agama di negara mana pun. Dr. Salah Al-Sawy menjawab (Fatwa No. 78512 tanggal 10 April 2009) bahwa tidak ada salahnya tinggal yang berusaha memperluas mata pencaharian di luar tanah Islam bagi mereka yang mampu menunjukkan agamanya dan aman dari godaan di sana. Akademi memiliki keputusan mengenai putusan tentang residensi di luar tanah Islam, di mana isu ini dibahas secara rinci dalam berbagai bentuknya. Silakan merujuk pada situs web Akademi dengan judul Keputusan dan Pernyataan."
