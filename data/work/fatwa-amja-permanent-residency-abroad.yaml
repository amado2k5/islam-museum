id: work/fatwa-amja-permanent-residency-abroad
class: work
kind: fatwa
label: { ar: "الإقامة الدائمة خارج ديار الإسلام", en: "Permanent residence outside Muslim lands", ur: "غیر اسلامی ملک میں مستقل قیام", es: "Residencia permanente fuera de tierras musulmanas" }
summary:
  ar: "سأل سائل عن حكم الإقامة الدائمة في البلاد الأجنبية وقد نقصت الرواتب في الدول الإسلامية وقال بعضهم إنه يسهل القيام بالفرائض في أي دولة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78512 بتاريخ 10 أبريل 2009)⁩ أنه لا حرج في الإقامة لطلب التوسعة في الرزق خارج ديار الإسلام لمن كان قادرًا على إظهار دينه وآمنًا من الفتنة فيه، وللمجمع قرار حول حكم الإقامة خارج ديار الإسلام ناقش فيه هذه المسألة بالتفصيل بصورها المختلفة فليرجع إليه على موقع المجمع تحت عنوان قرارات وبيانات."
  en: "A questioner asked about permanent residence in foreign lands, citing scarce salaries in Muslim states and the ease of performing duties anywhere. Dr. Salah al-Sawi (fatwa no. 78512, 10 April 2009) answered that residing abroad to broaden provision is unobjectionable for one able to show his religion and safe from trial in it; the Assembly has a resolution on residence outside Muslim lands treating the question in its various forms — to be found on its site under Resolutions and Statements."
  ur: "ایک سائل نے روزی کے لیے بیرون ملک مستقل قیام کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78512، 10 اپریل 2009)⁩ کے مطابق دین ظاہر کرنے اور فتنے سے امن کی شرط پر جائز ہے اور مجمع کا مفصل قرار موجود ہے۔"
  es: "Un interlocutor preguntó sobre la residencia permanente en el extranjero, citando los bajos salarios en los estados musulmanes y la facilidad para desempeñar las funciones en cualquier lugar. El Dr. Salah al-Sawi (fatwa n.° 78512, 10 de abril de 2009) respondió que residir en el extranjero para ampliar las oportunidades no presenta inconveniente alguno para quien pueda demostrar su religión y estar a salvo de ser juzgado en ella; la Asamblea cuenta con una resolución sobre la residencia fuera de los países musulmanes que aborda la cuestión en sus diversas formas, la cual puede consultarse en su sitio web, en la sección de Resoluciones y Declaraciones."
