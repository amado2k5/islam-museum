id: work/fatwa-amja-advising-nonpraying-kin
class: work
kind: fatwa
label: { ar: "نصح الأقارب التاركين", en: "Advising siblings who do not pray — constancy and gentle winning", ur: "نماز نہ پڑھنے والے بہن بھائی — نصیحت", es: "Aconsejar a los hermanos que no rezan: constancia y una dulce conquista.", fr: "Conseiller aux frères et sœurs qui ne prient pas: la constance et la douceur triomphent" }
summary:
  ar: "سألت امرأة ملتزمة أن أخاها ضابط طيران لا يصلي نهائيًا هو وأختها الصغرى غير المتزوجة ولا تصلي إلا إذا رأتهم يصلون. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86811 بتاريخ 2 مايو 2012)⁩ أن الذي يلزمها استدامة نصحهما والسعي إلى تألف قلوبهما على طاعة الله ما أمكن ولا حرج في مواداتهما في هذا الإطار تألفًا لقلوبهما على الطاعة واستحياء لهما بالتوبة والإنابة على ما فصّل الجواب."
  en: "A devout woman asked — her brother a flight officer never prays, and her unmarried younger sister prays only if she sees them praying. AMJA's fatwa committee (fatwa no. 86811, 2 May 2012) answered that what falls on her is constant counsel and striving to win their hearts to God's obedience as possible; there is no harm in courteous dealings toward that end, winning their hearts to obedience and stirring them to repentance — as the answer details."
  ur: "نماز نہ پڑھنے والے بہن بھائی؟ لجنة الفتوى ⁦(فتویٰ 86811، 2 مئی 2012)⁩ کے مطابق مسلسل نصیحت اور دل جوئی — نرم معاملہ جائز۔"
  es: "Una mujer devota preguntó: su hermano, oficial de vuelo, nunca reza, y su hermana menor, soltera, solo reza si los ve rezando. El comité de fatuas de AMJA (fatua n.° 86811, 2 de mayo de 2012) respondió que su responsabilidad es aconsejarles constantemente y esforzarse por ganar sus corazones para que obedezcan a Dios en la medida de lo posible; no hay inconveniente en tratarlos con cortesía para lograr ese fin, persuadiéndolos a la obediencia e impulsándolos al arrepentimiento, como se detalla en la respuesta."
  fr: "Une femme pieuse a posé la question suivante: son frère, officier de l’air, ne prie jamais, et sa jeune sœur célibataire ne prie que si elle les voit prier. Le comité des fatwas de l’AMJA (fatwa n° 86811, 2 mai 2012) a répondu qu’il lui incombait de les conseiller constamment et de s’efforcer autant que possible de gagner leurs cœurs à l’obéissance à Dieu; il n’y a aucun mal à agir avec courtoisie dans ce but, en les amenant à l’obéissance et en les incitant à la repentance, comme le précise la réponse."
