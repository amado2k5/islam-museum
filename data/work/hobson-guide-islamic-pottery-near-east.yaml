summary:
  ar: "دليل نشره المتحف البريطاني سنة 1932 بقلم ر. ل. هوبسون لمجموعته من الخزف الإسلامي، يرتبها في ثلاث فترات ويحتج لنسبة الخزف العثماني المسمى «رودسي» و«دمشقي» إلى إزنيق {cite:hobson-guide-islamic-pottery-near-east-1932 p. 6} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 10} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 135}."
  en: "Guide published by the British Museum in 1932, by R. L. Hobson, to its Islamic pottery collection, arranged in three periods and arguing that the Ottoman wares called 'Rhodian' and 'Damascus' belong to Iznik {cite:hobson-guide-islamic-pottery-near-east-1932 p. 6} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 10} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 135}."
  ur: "برٹش میوزیم کی 1932ء میں شائع کردہ آر ایل ہوبسن کی رہنما کتاب جو اس کے اسلامی ظروف کے ذخیرے کو تین ادوار میں ترتیب دیتی ہے اور «رودسی» اور «دمشقی» کہلانے والے عثمانی ظروف کو ازنیق سے منسوب کرنے کے حق میں دلیل دیتی ہے {cite:hobson-guide-islamic-pottery-near-east-1932 p. 6} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 10} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 135}۔"
