id: work/fatwa-aliftaa-jo-a-charity-using-zakat-to-treat-patients
class: work
kind: fatwa
label: { ar: "استخدام جمعية خيرية الزكاة في علاج المرضى", en: "A charity using zakat to treat patients", ur: "خیراتی انجمن کا زکات کو مریضوں کے علاج میں استعمال کرنا", es: "Una organización benéfica que utiliza el zakat para tratar a los pacientes.", fr: "Une organisation caritative utilisant la zakat pour soigner les patients", tr: "Zekat Hayırseverliği'nin Hasta Tedavisinde Kullanımı", id: "Menggunakan Zakat Charity dalam Merawat Pasien" }
summary:
  ar: "سؤال عن جمعية خيرية تأخذ الزكاة لعلاج المرضى وشراء الأدوية والأجهزة وتمويل مشاريع صحية، أجابت فيه دائرة الإفتاء العام الأردنية بأن الزكاة لا تُصرف في شراء الأدوية والأجهزة والمشاريع الصحية، وتجوز في تكاليف علاج فقراء المسلمين بوكالة منهم، ولولي الأمر صرفها على الوجه الأنفع للفقير. أجابت الدائرة بأن مصارف الزكاة محددة في آية الصدقات من سورة التوبة، وأنه لا يجوز دفع الزكاة لشراء الأدوية والأجهزة الطبية وتكاليف المختبرات والمشاريع الصحية، أما إنفاقها على فقراء المسلمين وتكاليف علاجهم، لا على النفقات الإدارية أو التشغيلية العامة، فلا حرج فيه. وقالت إن المستشفى أو المركز يمكنه أن يحصل على وكالة من الفقراء يتسلم بموجبها الأموال عنهم ثم ينفقها عليهم، لأن الأصل في الزكاة أن تُملك للفقير، إلا إذا كانت الجهة حكومية، فلولي الأمر أن ينفق الزكاة على الفقير على الوجه الذي يراه أنفع وأصلح. ونقلت ما ذكره الفقهاء من أن للإمام أن يشتري للفقير عقارًا يستغله، مستشهدة بقول الزركشي كما في مغني المحتاج، وبما في حاشية الجمل على شرح المنهج من أن الإمام نائب الفقير في القبض، وبقول ابن حجر الهيتمي في تحفة المحتاج إن له أن يلزمه بعدم إخراج ما اشتراه عن ملكه للمصلحة. وذكرت أن مجلس الإفتاء الأردني قرر في قراره رقم 99 جواز تقديم المساعدة من أموال الزكاة لمرضى السرطان المسلمين الفقراء، وختمت بحديث معاذ في أن الصدقة تؤخذ من أغنياء المسلمين وترد على فقرائهم."
  en: "A question about a charity taking zakat to treat patients, buy medicines and equipment and fund health projects, in which Jordan's General Iftaa Department answered that zakat may not be spent on buying medicines, equipment or health projects, but may cover poor Muslims' treatment costs through their agency, while the state may spend it in whatever way best benefits the poor. The Department answered that the recipients of zakat are fixed in the verse on alms in Surat al-Tawba, and that zakat may not be paid to buy medicines and medical equipment or to cover laboratory costs and health projects; but spending it on poor Muslims and their treatment costs, not on general administrative or operating expenses, is unobjectionable. It said a hospital or centre may obtain an agency from the poor under which it receives the money on their behalf and then spends it on them, because zakat in principle must be put into the poor person's ownership; the exception is a government body, since the ruler may spend zakat on the poor in the way he judges most beneficial. It cited the jurists' view that the ruler may buy the poor person a property to draw income from, quoting al-Zarkashi as reported in Mughni al-Muhtaj, the gloss of al-Jamal on Sharh al-Manhaj that the ruler acts for the poor in receiving zakat, and Ibn Hajar al-Haytami in Tuhfat al-Muhtaj that he may bind the poor person not to dispose of what was bought, for the public interest. It noted that the Jordanian Iftaa Council decided in its resolution no. 99 that zakat may be used to help poor Muslim cancer patients, and closed with the hadith of Mu'adh that alms are taken from the Muslims' rich and returned to their poor."
  ur: "ایک خیراتی انجمن کے بارے میں سوال جو مریضوں کے علاج، دواؤں اور آلات کی خریداری اور صحت کے منصوبوں کے لیے زکات لے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ زکات دواؤں، آلات یا صحت کے منصوبوں کی خریداری پر خرچ نہیں ہو سکتی، البتہ غریب مسلمانوں کی وکالت سے ان کے علاج کے اخراجات میں دی جا سکتی ہے، اور حکومت اسے فقیر کے لیے سب سے مفید طریقے سے خرچ کر سکتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکات کے مصارف سورۃ التوبہ کی آیت صدقات میں متعین ہیں، اور زکات دواؤں اور طبی آلات کی خریداری، لیبارٹری کے اخراجات اور صحت کے منصوبوں کے لیے نہیں دی جا سکتی؛ البتہ اسے غریب مسلمانوں اور ان کے علاج کے اخراجات پر، نہ کہ عمومی انتظامی یا عملیاتی اخراجات پر، خرچ کرنے میں حرج نہیں۔ اس نے کہا کہ ہسپتال یا مرکز فقرا سے وکالت لے سکتا ہے جس کے تحت وہ ان کی طرف سے رقم وصول کر کے پھر ان پر خرچ کرے، کیونکہ اصل یہ ہے کہ زکات فقیر کی ملکیت میں دی جائے؛ استثنا سرکاری ادارہ ہے، کیونکہ حاکم زکات کو فقیر پر اس طریقے سے خرچ کر سکتا ہے جسے وہ زیادہ مفید اور بہتر سمجھے۔ اس نے فقہا کا یہ قول نقل کیا کہ حاکم فقیر کے لیے ایسی جائیداد خرید سکتا ہے جس سے وہ آمدنی لے، اور اس پر مغنی المحتاج میں منقول زرکشی کا قول، شرح المنہج پر حاشیۃ الجمل کا یہ بیان کہ حاکم قبضے میں فقیر کا نائب ہے، اور تحفۃ المحتاج میں ابن حجر ہیتمی کا قول پیش کیا کہ وہ مصلحت عامہ کے لیے فقیر کو خریدی گئی چیز ملکیت سے نہ نکالنے کا پابند کر سکتا ہے۔ اس نے ذکر کیا کہ اردنی مجلس افتاء نے اپنی قرارداد نمبر 99 میں غریب مسلمان کینسر کے مریضوں کی زکات سے مدد کو جائز قرار دیا، اور معاذ کی حدیث پر اختتام کیا کہ صدقہ مسلمانوں کے امیروں سے لیا جائے اور ان کے غریبوں کو لوٹایا جائے۔"
  es: "Ante una pregunta sobre una organización benéfica que recibe zakat para tratar pacientes, comprar medicamentos y equipos, y financiar proyectos de salud, el Departamento General de Iftaa de Jordania respondió que el zakat no puede destinarse a la compra de medicamentos, equipos o proyectos de salud, pero sí puede cubrir los gastos de tratamiento de los musulmanes pobres a través de su agencia, mientras que el Estado puede gastarlo de la manera que mejor beneficie a los pobres. El Departamento explicó que los beneficiarios del zakat están definidos en el versículo sobre la limosna en la Sura Al-Tawba, y que el zakat no puede utilizarse para comprar medicamentos ni equipos médicos, ni para cubrir gastos de laboratorio o proyectos de salud; pero gastarlo en los musulmanes pobres y sus gastos de tratamiento, y no en gastos administrativos u operativos generales, es aceptable. Añadió que un hospital o centro puede obtener una agencia de los pobres mediante la cual recibe el dinero en su nombre y luego lo gasta en ellos, ya que, en principio, el zakat debe ser propiedad de la persona pobre; la excepción es un organismo gubernamental, puesto que el gobernante puede gastar el zakat en los pobres de la manera que considere más beneficiosa. Citó la opinión de los juristas de que el gobernante puede comprarle a una persona pobre una propiedad para que obtenga ingresos de ella, citando a al-Zarkashi según lo informado en Mughni al-Muhtaj, la glosa de al-Jamal en Sharh al-Manhaj que dice que el gobernante actúa en favor de los pobres al recibir el zakat, e Ibn Hajar al-Haytami en Tuhfat al-Muhtaj que puede obligar a la persona pobre a no disponer de lo comprado, por el interés público. Señaló que el Consejo de Iftaa de Jordania decidió en su resolución n.° 99 que el zakat puede usarse para ayudar a pacientes musulmanes pobres con cáncer, y concluyó con el hadiz de Mu'adh que dice que las limosnas se toman de los ricos musulmanes y se devuelven a sus pobres."
  fr: "Une question concernant la collecte de la zakat par une organisation caritative pour soigner des patients, acheter des médicaments et du matériel, et financer des projets de santé a été posée. Le Département général de la Iftaa de Jordanie a répondu que la zakat ne peut être utilisée pour l'achat de médicaments, de matériel ou pour des projets de santé, mais peut couvrir les frais de traitement des musulmans pauvres par l'intermédiaire de son organisme. L'État, quant à lui, peut l'utiliser de la manière qui profite le mieux aux plus démunis. Le Département a précisé que les bénéficiaires de la zakat sont définis dans le verset relatif à l'aumône de la sourate At-Tawba et que la zakat ne peut servir à l'achat de médicaments et de matériel médical, ni au financement de frais de laboratoire ou de projets de santé. En revanche, son utilisation pour les musulmans pauvres et leurs frais de traitement, et non pour les dépenses administratives ou de fonctionnement générales, est licite. Il a ajouté qu'un hôpital ou un centre peut obtenir un mandat auprès des pauvres afin de recevoir la zakat en leur nom et de la dépenser ensuite pour eux, car la zakat doit, en principe, revenir à la personne pauvre. Une exception est faite pour les organismes gouvernementaux, car le dirigeant peut utiliser la zakat pour les pauvres de la manière qu'il juge la plus appropriée. Le texte citait l'avis des juristes selon lequel le souverain peut acquérir un bien pour le pauvre afin d'en tirer des revenus, en reprenant les propos d'al-Zarkashi rapportés dans Mughni al-Muhtaj, la glose d'al-Jamal sur Sharh al-Manhaj selon laquelle le souverain agit dans l'intérêt des pauvres en recevant la zakat, et Ibn Hajar al-Haytami dans Tuhfat al-Muhtaj, qui affirme qu'il peut contraindre le pauvre à ne pas disposer du bien acquis, dans l'intérêt public. Il notait également que le Conseil jordanien de la Ifta avait décidé, dans sa résolution n° 99, que la zakat pouvait être utilisée pour aider les musulmans pauvres atteints de cancer, et concluait par le hadith de Mu'adh selon lequel l'aumône est prélevée sur les musulmans riches et restituée aux pauvres."
  tr: "Hastaların tedavisi, ilaç ve cihaz satın alınması ve sağlık projelerini finanse etmek için zekat toplayan bir hayır kurumu hakkında soru. Ürdün Genel Fetva Dairesi, zekatın ilaç, cihaz ve sağlık projelerinin satın alınmasına harcanmadığını, kurumlarının yoksul Müslümanların tedavi masraflarını karşılamak için kullanılmasının mümkün olduğunu, vasi ise bunu yoksullar için en faydalı şekilde harcayabileceğini yanıtladı. Daire, zekat harcamalarının T-Tavbe Suresindeki hayırseverlik ayetinde belirtildiğini ve zekatın ilaç, tıbbi cihaz, laboratuvar masrafları ve sağlık projeleri için zekatın ödenmediğini belirtti. Ancak, zakatın yoksul Müslümanlar ve tedavi masrafları için harcanması, genel idari veya operasyonel giderler için değil, sorun değildir. Hastane veya merkezin, zakatın aslında yoksullara ait olması amaçlandığı için fakirlerden vekaletname alabileceğini, ancak devlet kurumu olmadığını belirtti. Vasi, zekatı fakirlere uygun ve uygun gördüğü şekilde harcayabilir. Fıkılıların imamın yoksullar için mülk satın alabileceğini aktararak, Mughni Al-Muhtaj'daki Al-Zarkashi'nin ifadesini ve Al-Jamal Sharh Al-Manhaj yorumunda imamın gözaltındaki yoksulların vekili olduğu ve İbn Hajar Al-Haytami'nin Tuhfat Al-Muhtaj'da kamu yararı için mülkünden aldığı şeyi devretmemekle yükümlü olduğunu aktardığı belirtildi. Ürdün Fetva Konseyi'nin 99 sayılı kararında zekat fonlarından yardımın yoksul Müslüman kanser hastalarına izin verildiğine karar verdiği ve Mu'adh'ın hadisiyle zengin Müslümanlardan sadakaların alınıp yoksullara geri verildiği sonucuna varıldı."
  id: "Sebuah pertanyaan tentang asosiasi amal yang mengumpulkan zakat untuk merawat pasien, membeli obat dan perangkat, serta membiayai proyek kesehatan. Departemen Fatwa Umum Yordania menjawab bahwa zakat tidak dibelanjakan untuk membeli obat, alat, dan proyek kesehatan, dan diperbolehkan menggunakan agensinya untuk menutupi biaya pengobatan Muslim miskin, dan wali dapat menggunakannya dengan cara yang paling bermanfaat bagi orang miskin. Departemen menjawab bahwa pengeluaran zakat ditentukan dalam ayat tentang amal dari Surah At-Tawbah, dan zakat tidak diperbolehkan membayar zakat untuk pembelian obat, alat medis, biaya laboratorium, dan proyek kesehatan. Namun, membelanjakannya untuk Muslim miskin dan biaya pengobatan mereka, bukan untuk biaya administrasi atau operasional umum, bukanlah masalah. Dikatakan bahwa rumah sakit atau pusat dapat memperoleh surat kuasa dari orang miskin untuk menerima uang dari mereka dan kemudian membelanjakannya untuk mereka, karena zakat awalnya dimaksudkan untuk orang miskin, kecuali entitas tersebut adalah pemerintah. Wali dapat membelanjakan zakat kepada orang miskin sesuai dengan cara yang mereka anggap tepat dan sesuai. Laporan tersebut mengutip apa yang disebutkan oleh para ahli hukum bahwa Imam dapat membeli properti untuk dieksploitasi oleh orang miskin, mengutip pernyataan Al-Zarkashi seperti dalam Mughni Al-Muhtaj, dan yang disebutkan dalam komentar Al-Jamal Sharh Al-Manhaj bahwa Imam adalah wakil orang miskin yang ditahan, dan Ibn Hajar Al-Haytami dalam Tuhfat Al-Muhtaj bahwa ia berkewajiban untuk tidak memindahkan apa yang dibelinya dari propertinya demi kepentingan publik. Surat itu menyebutkan bahwa Dewan Fatwa Yordania memutuskan dalam keputusan No. 99 bahwa bantuan dari dana zakat diperbolehkan bagi pasien kanker Muslim miskin, dan menyimpulkan dengan hadits Mu'adh bahwa amal diambil dari Muslim kaya dan dikembalikan kepada orang miskin mereka."
