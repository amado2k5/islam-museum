id: work/fatwa-aliftaa-jo-a-charity-using-zakat-to-treat-patients
class: work
kind: fatwa
label: { ar: "استخدام جمعية خيرية الزكاة في علاج المرضى", en: "A charity using zakat to treat patients", ur: "خیراتی انجمن کا زکات کو مریضوں کے علاج میں استعمال کرنا" }
summary:
  ar: "سؤال عن جمعية خيرية تأخذ الزكاة لعلاج المرضى وشراء الأدوية والأجهزة وتمويل مشاريع صحية، أجابت فيه دائرة الإفتاء العام الأردنية بأن الزكاة لا تُصرف في شراء الأدوية والأجهزة والمشاريع الصحية، وتجوز في تكاليف علاج فقراء المسلمين بوكالة منهم، ولولي الأمر صرفها على الوجه الأنفع للفقير. أجابت الدائرة بأن مصارف الزكاة محددة في آية الصدقات من سورة التوبة، وأنه لا يجوز دفع الزكاة لشراء الأدوية والأجهزة الطبية وتكاليف المختبرات والمشاريع الصحية، أما إنفاقها على فقراء المسلمين وتكاليف علاجهم، لا على النفقات الإدارية أو التشغيلية العامة، فلا حرج فيه. وقالت إن المستشفى أو المركز يمكنه أن يحصل على وكالة من الفقراء يتسلم بموجبها الأموال عنهم ثم ينفقها عليهم، لأن الأصل في الزكاة أن تُملك للفقير، إلا إذا كانت الجهة حكومية، فلولي الأمر أن ينفق الزكاة على الفقير على الوجه الذي يراه أنفع وأصلح. ونقلت ما ذكره الفقهاء من أن للإمام أن يشتري للفقير عقارًا يستغله، مستشهدة بقول الزركشي كما في مغني المحتاج، وبما في حاشية الجمل على شرح المنهج من أن الإمام نائب الفقير في القبض، وبقول ابن حجر الهيتمي في تحفة المحتاج إن له أن يلزمه بعدم إخراج ما اشتراه عن ملكه للمصلحة. وذكرت أن مجلس الإفتاء الأردني قرر في قراره رقم 99 جواز تقديم المساعدة من أموال الزكاة لمرضى السرطان المسلمين الفقراء، وختمت بحديث معاذ في أن الصدقة تؤخذ من أغنياء المسلمين وترد على فقرائهم."
  en: "A question about a charity taking zakat to treat patients, buy medicines and equipment and fund health projects, in which Jordan's General Iftaa Department answered that zakat may not be spent on buying medicines, equipment or health projects, but may cover poor Muslims' treatment costs through their agency, while the state may spend it in whatever way best benefits the poor. The Department answered that the recipients of zakat are fixed in the verse on alms in Surat al-Tawba, and that zakat may not be paid to buy medicines and medical equipment or to cover laboratory costs and health projects; but spending it on poor Muslims and their treatment costs, not on general administrative or operating expenses, is unobjectionable. It said a hospital or centre may obtain an agency from the poor under which it receives the money on their behalf and then spends it on them, because zakat in principle must be put into the poor person's ownership; the exception is a government body, since the ruler may spend zakat on the poor in the way he judges most beneficial. It cited the jurists' view that the ruler may buy the poor person a property to draw income from, quoting al-Zarkashi as reported in Mughni al-Muhtaj, the gloss of al-Jamal on Sharh al-Manhaj that the ruler acts for the poor in receiving zakat, and Ibn Hajar al-Haytami in Tuhfat al-Muhtaj that he may bind the poor person not to dispose of what was bought, for the public interest. It noted that the Jordanian Iftaa Council decided in its resolution no. 99 that zakat may be used to help poor Muslim cancer patients, and closed with the hadith of Mu'adh that alms are taken from the Muslims' rich and returned to their poor."
  ur: "ایک خیراتی انجمن کے بارے میں سوال جو مریضوں کے علاج، دواؤں اور آلات کی خریداری اور صحت کے منصوبوں کے لیے زکات لے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ زکات دواؤں، آلات یا صحت کے منصوبوں کی خریداری پر خرچ نہیں ہو سکتی، البتہ غریب مسلمانوں کی وکالت سے ان کے علاج کے اخراجات میں دی جا سکتی ہے، اور حکومت اسے فقیر کے لیے سب سے مفید طریقے سے خرچ کر سکتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکات کے مصارف سورۃ التوبہ کی آیت صدقات میں متعین ہیں، اور زکات دواؤں اور طبی آلات کی خریداری، لیبارٹری کے اخراجات اور صحت کے منصوبوں کے لیے نہیں دی جا سکتی؛ البتہ اسے غریب مسلمانوں اور ان کے علاج کے اخراجات پر، نہ کہ عمومی انتظامی یا عملیاتی اخراجات پر، خرچ کرنے میں حرج نہیں۔ اس نے کہا کہ ہسپتال یا مرکز فقرا سے وکالت لے سکتا ہے جس کے تحت وہ ان کی طرف سے رقم وصول کر کے پھر ان پر خرچ کرے، کیونکہ اصل یہ ہے کہ زکات فقیر کی ملکیت میں دی جائے؛ استثنا سرکاری ادارہ ہے، کیونکہ حاکم زکات کو فقیر پر اس طریقے سے خرچ کر سکتا ہے جسے وہ زیادہ مفید اور بہتر سمجھے۔ اس نے فقہا کا یہ قول نقل کیا کہ حاکم فقیر کے لیے ایسی جائیداد خرید سکتا ہے جس سے وہ آمدنی لے، اور اس پر مغنی المحتاج میں منقول زرکشی کا قول، شرح المنہج پر حاشیۃ الجمل کا یہ بیان کہ حاکم قبضے میں فقیر کا نائب ہے، اور تحفۃ المحتاج میں ابن حجر ہیتمی کا قول پیش کیا کہ وہ مصلحت عامہ کے لیے فقیر کو خریدی گئی چیز ملکیت سے نہ نکالنے کا پابند کر سکتا ہے۔ اس نے ذکر کیا کہ اردنی مجلس افتاء نے اپنی قرارداد نمبر 99 میں غریب مسلمان کینسر کے مریضوں کی زکات سے مدد کو جائز قرار دیا، اور معاذ کی حدیث پر اختتام کیا کہ صدقہ مسلمانوں کے امیروں سے لیا جائے اور ان کے غریبوں کو لوٹایا جائے۔"
