summary:
  ar: "معجم لأبي عبيد البكري ذكر فيه ما ورد في الحديث والأخبار والتواريخ والأشعار من المنازل والديار والقرى والأمصار والجبال والآثار والمياه والآبار، مرتباً على حروف المعجم بترتيب المغاربة، مضبوطاً لأن كثيراً منها «استعجم على الناس» {cite:mujam-ma-istaajam-bakri p.14} {cite:mujam-ma-istaajam-bakri p.15}. وتصفه «أرابيكا» بأنه معجم لأسماء المواقع في الجزيرة العربية من منازل وديار وقرى وأمصار وجبال وآثار، له مقدمة في جغرافيتها ومواضع القبائل، اعتمد فيه على أقوال اللغويين والجغرافيين القدامى والأخبار والشعر."
  en: "Abu Ubayd al-Bakri's dictionary of the halting places, abodes, villages, cities, mountains, ruins, waters and wells named in hadith, reports, histories and poetry, arranged alphabetically in the Maghribi letter order and carefully vocalized, because many of these names 'had become obscure to people'. Arabica describes it as a dictionary of place names in the Arabian Peninsula (stations, abodes, villages, cities, mountains, ruins) with an introduction on their geography and the places of the tribes, drawing on early linguists and geographers, reports and poetry."
  es: "El diccionario de Abu Ubayd al-Bakri recoge los lugares de descanso, moradas, aldeas, ciudades, montañas, ruinas, aguas y pozos mencionados en hadices, relatos, historias y poesía, ordenados alfabéticamente según el orden de las letras del alfabeto magrebí y cuidadosamente vocalizados, porque muchos de estos nombres \"se habían vuelto oscuros para la gente\". Arabica lo describe como un diccionario de nombres de lugares de la península arábiga (etapas, moradas, aldeas, ciudades, montañas, ruinas) con una introducción sobre su geografía y los lugares de las tribus, apoyado en lingüistas y geógrafos antiguos, relatos y poesía."
  fr: "Le dictionnaire d'Abu Ubayd al-Bakri recense les lieux de halte, les demeures, les villages, les villes, les montagnes, les ruines, les eaux et les puits mentionnés dans les hadiths, les récits, les histoires et la poésie, classés par ordre alphabétique selon l'alphabet maghrébin et soigneusement vocalisés, car nombre de ces noms « étaient devenus obscurs pour les gens ». Arabica le décrit comme un dictionnaire de noms de lieux de la péninsule Arabique (étapes, demeures, villages, villes, montagnes, ruines) avec une introduction sur leur géographie et les lieux des tribus, s'appuyant sur les anciens linguistes et géographes, les récits et la poésie."
  ur: "ابو عبید البکری کی لغت میں ٹھہرنے کی جگہوں، ٹھکانوں، دیہاتوں، شہروں، پہاڑوں، کھنڈرات، پانیوں اور کنوؤں کے نام حدیثوں، رپورٹوں، تاریخوں اور اشعار میں حروف تہجی کے لحاظ سے مغربی حروف کی ترتیب سے ترتیب دیے گئے ہیں اور احتیاط سے آواز دی گئی ہے، کیونکہ ان میں سے بہت سے نام 'لوگوں کے لیے مبہم ہو گئے تھے'۔ «اربیکا» اسے جزیرہ نما عرب کے مقامات کے ناموں کی لغت بتاتی ہے، منازل، دیار، قریے، شہر، پہاڑ اور آثار، جس کا مقدمہ ان کے جغرافیے اور قبائل کے مقامات پر ہے، اور جس میں قدیم لغویوں اور جغرافیوں کے اقوال، اخبار اور شعر سے کام لیا گیا۔"
  tr: "Ebu Ubeyd el-Bekri'nin hadislerde, rivayetlerde, tarihlerde ve şiirlerde bahsedilenleri, evler, köyler, şehirler, dağlar, anıtlar, sular ve kuyularla ilgili bir sözlük, Magripler sırasına göre alfabetik olarak düzenlenmiştir; çünkü bunların çoğu 'istaajam al-nas' {cite:mujam-ma-istaajam-bakri s.14} {cite:mujam-ma-istaajam-bakri s.15} şeklindedir. Arabica, bunu Arap Yarımadası'ndaki yerlerin isimlerinin, evler, evler, köyler, şehirler, dağlar ve anıtlar dahil olmak üzere, coğrafyaları ve kabile yerleşimlerine giriş yaparak, eski dilbilimcilerin, coğrafyacıların, raporların ve şiirlerin sözlerine dayanarak tanımlar."
  id: "Kamus oleh Abu Ubayd al-Bakri yang menyebutkan apa yang disebutkan dalam hadis, laporan, sejarah, dan puisi mengenai rumah, rumah, desa, kota, gunung, monumen, air, dan sumur, disusun secara alfabetis menurut urutan Maghreb, tepat karena banyak di antaranya adalah 'istaajam al-nas' {cite:mujam-ma-istaajam-bakri hlm.14} {cite:mujam-ma-istaajam-bakri hlm.15}. Arabika menggambarkannya sebagai kamus nama-nama tempat di Semenanjung Arab termasuk rumah, rumah, desa, kota, gunung, dan monumen, dengan pengantar geografi dan lokasi suku mereka, dengan mengandalkan kata-kata ahli bahasa kuno, ahli geografi, laporan, dan puisi."
