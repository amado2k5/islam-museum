id: work/fatwa-dar-alifta-eg-combining-tamattu-ashura-fast
class: work
kind: fatwa
label: { ar: "حكم الجمع بين نية صوم التمتع وصوم عاشوراء", en: "Combining the intention of the tamattu' fast with the Ashura fast", ur: "تمتع کے روزے اور عاشورا کے روزے کی نیت ملا کر رکھنا", es: "Combinar la intención del ayuno de tamattu' con el ayuno de Ashura.", fr: "Combiner l'intention du jeûne de tamattu' avec le jeûne d'Achoura", tr: "Tamattu' oruç tutma niyetinin Ashura oruç tutma niyetinin birleştirilmesine ilişkin karar", id: "Putusan tentang menggabungkan niat puasa Tamattu' dengan puasa Ashura" }
summary:
  ar: "سائل سأل عن الجمع بين نية صوم التمتع وصوم عاشوراء في يوم واحد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20911)⁩ أن الجمع بين نية صوم التمتع وصوم عاشوراء في يوم واحد جائز شرعًا في حالة ما إذا تم تأخير صوم التمتع إلى ما بعد الحج على ما فصّل الجواب."
  en: "A questioner asked about combining the intention of the tamattu' fast with the Ashura fast on one day. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20911) answered that combining them on one day is lawful in the case where the tamattu' fast is delayed until after the Hajj — as the answer details."
  ur: "ایک سائل نے ایک دن میں تمتع کے روزے اور عاشورا کے روزے کی نیت ملانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20911)⁩ نے جواب دیا کہ تمتع کا روزہ حج کے بعد مؤخر ہونے پر دونوں نیتیں ملانا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de combinar el ayuno de Tamattu' con el ayuno de Ashura en un mismo día. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20911) respondió que combinarlos en un mismo día es lícito en el caso de que el ayuno de Tamattu' se retrase hasta después del Hajj, como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il était possible de combiner le jeûne de Tamattu' avec celui d'Achoura le même jour. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20911) a répondu que cela était licite si le jeûne de Tamattu' était reporté après le Hajj, comme le précise la réponse."
  tr: "Bir soru soran kişi, Tamattu' orucu ile aynı gün Aşura'yı oruç tutma niyetinin birleştirilmesini sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 20911), Tamattu' orucunun aynı gün oruç tutma niyeti ile Aşura'nın orucunun ertelenmesi durumunda dini olarak izin verildiğini yanıtladı, bu da cevapta açıklandı."
  id: "Seorang penanya menanyakan tentang menggabungkan niat puasa Tamattu' dan puasa Ashura pada hari yang sama. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20911) menjawab bahwa menggabungkan niat puasa Tamattu' dan puasa Ashura pada hari yang sama secara agama diperbolehkan jika menunda puasa Tamattu hingga setelah Haji, seperti yang dijelaskan dalam jawabannya."
