class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 188 (20/3) بشأن استكمال موضوع الصكوك الإسلامية", en: "IIFA resolution 188 (20/3) on completing the subject of Islamic sukuk", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 188 (20/3): اسلامی صکوک کے موضوع کی تکمیل", es: "Resolución 188 (20/3) de la IIFA sobre la finalización del tema de los sukuk islámicos.", fr: "Résolution 188 (20/3) de l'IIFA relative à l'achèvement du sujet des sukuk islamiques", tr: "Uluslararası İslami Fiqh Akademisi Kararı 188 (20/3) İslami sukuk konusunun tamamlanmasına ilişkin", id: "Resolusi Akademi Fiqh Islam Internasional 188 (20/3) mengenai penyelesaian subjek sukuk Islam" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته العشرين بوهران ⁦(26 شوال – 2 ذو القعدة 1433هـ، 13–18 سبتمبر 2012م)⁩ بعد توصيات ندوة «الصكوك الإسلامية: عرض وتقويم» بجدة ⁦(10–11 جمادى الآخرة 1431هـ، 24–25 مايو 2010م)⁩ وقراره 178 ⁦(19/4)⁩ بشأن الصكوك وتطبيقاتها وتداولها. ضوابط عامة: يجب أن تحقق الصكوك مقاصد التشريع من تعزيز التنمية ودعم النشاطات الحقيقية وإقامة العدالة؛ وأن تحقق عقودها مقتضاها من ثبوت الملكية شرعًا وقانونًا وما يترتب عليها من التصرف وتحمل الضمان وتخلو من الحيل والصورية مع سلامة ما تؤول إليه شرعًا؛ وأن تتضمن وثائقها آليات ضبط التطبيق والمراجعة الدورية لسلامة استخدام حصيلتها في الغرض المحدد؛ وأن تستوفي الفروق الجوهرية بينها وبين السندات الربوية هيكلةً وتصميمًا وتركيبًا منعكسًا على تسويقها وتسعيرها. وفي التعهدات: لا يجوز للمضارب أو الشريك أو الوكيل أن يتعهد بشراء الصكوك أو أصولها بقيمتها الاسمية أو بقيمة محددة سلفًا بما يؤدي لضمان رأس المال أو نقد حال بنقد مؤجل أكثر منه — ويستثنى التعدي والتفريط المستوجبان ضمان حقوق حملة الصكوك؛ ولا يجوز إقراض حملة الصكوك عند نقص العائد الفعلي عن المتوقع بما يؤدي لسلف وبيع أو قرض بفائدة ويجوز تكوين احتياطي من الأرباح لجبر النقص المحتمل؛ ويجوز التحوط من مخاطر رأس المال بالتأمين التعاوني أو التكافلي المنضبط. وفي إجارة الأصل على بائعه: لا يجوز بيع أصل بثمن نقدي بشرط استئجار البائع له بإجارة مقرونة بوعد تمليك بما مجموعه أجرة وثمن يتجاوز النقدي صراحة أو ضمنًا لأنه من العينة المحرمة، فلا يجوز إصدار صكوك عليها. وفي إجارة الموصوف في الذمة: يجوز إجارة الأعيان الموصوفة في الذمة وإصدار صكوك عليها، ويتركز الإشكال في حكم تأجيل الأجرة عن مجلس العقد وحكم تداول صكوكها قبل تعيين محل الإجارة — أوصى بتشكيل فريق لدراستها ⁦(استكملت في قرار 196 (21/2))⁩. وفي تداول الأوراق المالية من صكوك أو أسهم أو وحدات: إن تمحضت موجوداتها نقودًا أو ديونًا خضعت لأحكام الصرف أو بيع الدين؛ وإن تمحضت أعيانًا أو منافع أو حقوقًا جاز التداول بالسعر المتفق عليه؛ وإن كانت خليطًا فإن كانت النقود والديون تابعة لما يصح أن يكون متبوعًا وكانت الورقة متضمنة ملكيته جاز التداول دون مراعاة النسبة، وإلا خضعت لأحكام الغلبة؛ وإن لم تبدأ الشركة العمل الفعلي أو كانت تحت التصفية خضعت لأحكام الغلبة؛ ولظهور ثبوت التبعية بملكية المشغل أو العمل أو النشاط واتساع معيار الغلبة أوصى بتشكيل فريق لدراسة المعايير ⁦(استكملت في قراري 214 (22/10) و226 (23/10))⁩. وفي أثر القرارات على العقود السابقة: قرارات المجمع تسري من حين صدورها ولا تؤثر على ما سبقها من عقود ومنها صكوك صدرت باجتهاد أو فتوى معتبرة، وعلى المسلمين اتباع الشريعة بحسب الوسع والسعي المستمر لرفع العجز والتخلص من أحكام الضرورة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 20th session in Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 September 2012), after the Jeddah seminar 'Islamic sukuk: presentation and evaluation' (10–11 Jumada al-Akhira 1431, 24–25 May 2010) and its resolution 178 (19/4) on sukuk applications and trading. General controls: sukuk must serve the ends of the law — development, real activities, justice between parties; their contracts must secure ownership legally and sharia-wise with the resulting disposal and liability, free of stratagems and nominalism, with a sound outcome; their documents must contain mechanisms for monitoring application and periodic review that proceeds are used for the stated purpose; and they must display the essential differences from interest-bearing bonds in structure, design and composition, reflected in marketing and pricing. On undertakings: the mudarib, partner or agent may not undertake to buy the sukuk or their assets at par or a preset value guaranteeing capital or spot cash against larger deferred cash — except cases of transgression or negligence requiring protection of holders' rights; nor may he lend holders when actual return falls short of expected, which would make loan-with-sale or interest — a reserve from profits may instead cover possible shortfall; and hedging capital risks through disciplined cooperative or takaful insurance is permissible. On leasing the asset back to its seller: selling an asset for cash on condition the seller rents it under a lease with a promise of transfer, the total exceeding the cash price, explicit or implied, is the prohibited 'ina transaction, so no sukuk may be issued on it. On leasing what is described in liability: leasing objects described in liability is permissible and sukuk may be issued on it; the difficulty lies in deferring rent past the contract session and trading its sukuk before the leased object is specified — a study team was recommended (completed in resolution 196 (21/2)). On trading securities — sukuk, shares or units: if the paper's assets are purely cash or debts, trading follows exchange or debt-sale rules; if purely objects, usufructs or rights, trading at the agreed price is permissible; if mixed, then if the cash and debts are subordinate to what may properly be followed and the paper comprises its ownership, trading is permissible regardless of proportion, otherwise predominance rules apply; if the company or project has not begun actual work or is under liquidation, predominance rules apply; and since subordination proved establishable through ownership of operator, work or activity, and the predominance criterion proved broad, a study team was recommended (completed in resolutions 214 (22/10) and 226 (23/10)). On resolutions' effect on earlier contracts: Academy resolutions apply from issuance and do not affect preceding contracts including sukuk issued on recognised ijtihad or fatwa; Muslims must follow the sharia within capacity and keep striving to lift incapacity and exit necessity."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، وہران میں بیسویں مجلس ⁦(26 شوال – 2 ذو القعدہ 1433ھ، 13–18 ستمبر 2012ء)⁩ میں — جدہ کی سیمینار 'اسلامی صکوک: عرض و جائزہ' ⁦(10–11 جمادی الآخرہ 1431ھ، 24–25 مئی 2010ء)⁩ اور قرارداد 178 ⁦(19/4)⁩ کے بعد۔ عمومی ضوابط: صکوک کو شرعی مقاصد — ترقی، حقیقی سرگرمیاں، دونوں فریقوں میں انصاف — پورا کرنا چاہیے؛ ان کے عقود ملکیت کو شرعاً و قانوناً ثابت کریں اور اس کے نتائج — تصرف اور ضمانت — کے ساتھ حیلے اور صوری پن سے پاک ہوں اور انجام شرعاً درست ہو؛ ان کے دستاویزات میں اطلاق کی نگرانی اور وقفے وقفے سے نظرثانی کے آلات ہوں کہ آمدنی مقررہ مقصد میں لگے؛ اور وہ سودی بانڈز سے ساخت، ڈیزائن اور ترکیب میں جوہری فرق رکھیں جو مارکیٹنگ اور قیمت پر ظاہر ہو۔ تعہدات پر: مضارب، شریک یا وکیل یہ عہد نہیں کر سکتا کہ صکوک یا ان کے اثاثے برابر یا طے شدہ قیمت پر خریدے گا جس سے سرمائے کی ضمانت یا حال نقد بڑے مؤجل نقد کے بدلے ہو — سوائے زیادتی یا کوتاہی کی صورتوں میں ہولڈروں کے حقوق کے تحفظ کے؛ اور نہ حقیقی آمدنی متوقع سے کم ہونے پر ہولڈروں کو قرض دے سکتا ہے جو سلف و بیع یا سودی قرض بنے — ممکنہ کمی کے لیے منافع سے ذخیرہ بنایا جا سکتا ہے؛ اور سرمائے کے خطرات سے منضبط تعاونی یا تکافلی بیمے سے ہیجنگ جائز ہے۔ بیچنے والے کو اثاثہ واپس کرائے پر دینے پر: نقد قیمت پر اثاثہ بیچنا اس شرط کے ساتھ کہ بیچنے والا اسے کرائے پر لے تملیک کے وعدے کے ساتھ تاکہ کل اجرت و قیمت نقد رقم سے بڑھے — صریح یا ضمنی — حرام عینہ ہے، اس پر صکوک جاری نہیں ہو سکتے۔ ذمہ میں موصوف کا اجارہ: ذمہ میں موصوف اشیاء کا اجارہ اور اس پر صکوک جائز ہیں؛ مشکل اجرت کا عقد کے مجلس سے مؤجل ہونا اور محل کے تعین سے پہلے اس کی صکوک کا ٹریڈ ہے — مطالعاتی ٹیم کی سفارش ⁦(قرارداد 196 (21/2) میں مکمل)⁩۔ سیکیورٹیز — صکوک، حصص یا یونٹس — کے ٹریڈ پر: اگر کاغذ کے اثاثے خالص نقد یا قرض ہوں تو ٹریڈ صرف یا قرض کی بیع کے احکام تابع؛ خالص اشیاء، منافع یا حقوق ہوں تو متفقہ قیمت پر ٹریڈ جائز؛ مخلوط ہوں تو اگر نقد اور قرض اس کے تابع ہوں جو جائز طور پر متبوع ہو سکتا ہے اور کاغذ اس کی ملکیت پر مشتمل ہو تو تناسب کی رعایت بغیر ٹریڈ جائز، ورنہ غلبہ کے احکام؛ اور اگر کمپنی یا منصوبہ ابھی کام شروع نہ کیا ہو یا تحلیل میں ہو تو غلبہ کے احکام۔ چونکہ تبعیت مشغل، کام یا سرگرمی کی ملکیت سے بھی ثابت ہو سکتی ہے اور غلبہ کا معیار وسیع نکلا، معیارات کی تحقیق کے لیے ٹیم کی سفارش ⁦(قراردادوں 214 (22/10) اور 226 (23/10) میں مکمل)⁩۔ سابقہ عقود پر قراردادوں کے اثر پر: اکیڈمی کی قراردادیں جاری ہونے سے لاگو ہیں اور سابقہ عقود کو متاثر نہیں کرتیں جن میں معتبر اجتہاد یا فتویٰ سے جاری صکوک ہیں؛ مسلمانوں پر اپنی استطاعت کے مطابق شریعت کی پابندی اور عجز دور کرنے اور ضرورت سے نکلنے کی مسلسل کوشش لازم ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 20.ª sesión en Orán (26 de Shawwal – 2 de Dhu al-Qada de 1433, 13-18 de septiembre de 2012), tras el seminario de Yeda «Sukuk islámico: presentación y evaluación» (10-11 de Jumada al-Akhira de 1431, 24-25 de mayo de 2010) y su resolución 178 (19/4) sobre solicitudes y negociación de sukuk. Controles generales: los sukuk deben servir a los fines de la ley: desarrollo, actividades reales, justicia entre las partes; sus contratos deben asegurar la propiedad legalmente y de acuerdo con la sharia con la disposición y responsabilidad resultantes, libres de estratagemas y nominalismo, con un resultado sólido; sus documentos deben contener mecanismos para monitorear la solicitud y la revisión periódica de que los fondos se utilizan para el propósito declarado; y deben mostrar las diferencias esenciales de los bonos que devengan intereses en estructura, diseño y composición, reflejadas en el marketing y los precios. Sobre los compromisos: el mudarib, socio o agente no puede comprometerse a comprar el sukuk o sus activos a la par o a un valor preestablecido que garantice el capital o efectivo al contado contra efectivo diferido mayor, excepto en casos de transgresión o negligencia que requieran la protección de los derechos de los tenedores; tampoco puede prestar a los tenedores cuando el rendimiento real sea inferior al esperado, lo que haría un préstamo con venta o interés; en su lugar, una reserva de las ganancias puede cubrir el posible déficit; y la cobertura de riesgos de capital a través de seguros cooperativos disciplinados o takaful es permisible. Sobre el arrendamiento del activo de vuelta a su vendedor: vender un activo por efectivo con la condición de que el vendedor lo arriende bajo un contrato de arrendamiento con promesa de transferencia, el total que exceda el precio en efectivo, explícito o implícito, es la transacción 'ina prohibida, por lo que no se puede emitir ningún sukuk sobre él. Sobre el arrendamiento de lo que se describe en la responsabilidad: el arrendamiento de objetos descritos en la responsabilidad es permisible y se puede emitir un sukuk sobre él; La dificultad radica en aplazar el pago del alquiler más allá del período contractual y negociar sus sukuk antes de que se especifique el objeto arrendado; se recomendó un equipo de estudio (finalizado en la resolución 196 (21/2)). Sobre la negociación de valores (sukuk, acciones o unidades): si los activos del documento son exclusivamente efectivo o deudas, la negociación sigue las reglas de intercambio o venta de deuda; si son exclusivamente objetos, usufructos o derechos, se permite la negociación al precio acordado; si son mixtos, entonces si el efectivo y las deudas están subordinados a lo que se puede seguir adecuadamente y el documento comprende su propiedad, la negociación es admisible independientemente de la proporción, de lo contrario se aplican las reglas de predominio; si la empresa o el proyecto no ha comenzado el trabajo real o está en liquidación, se aplican las reglas de predominio; y dado que se demostró que la subordinación se puede establecer a través de la propiedad del operador, el trabajo o la actividad, y el criterio de predominio resultó amplio, se recomendó un equipo de estudio (finalizado en las resoluciones 214 (22/10) y 226 (23/10)). Sobre el efecto de las resoluciones en los contratos anteriores: Las resoluciones de la Academia se aplican desde su emisión y no afectan a los contratos anteriores, incluidos los sukuk emitidos sobre la base de un ijtihad o fatwa reconocidos; los musulmanes deben seguir la sharia dentro de sus posibilidades y seguir esforzándose por superar la incapacidad y salir de la necesidad."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 20e session à Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13-18 septembre 2012), faisant suite au séminaire de Djeddah intitulé « Les sukuk islamiques: présentation et évaluation » (10-11 Jumada al-Akhira 1431, 24-25 mai 2010) et à sa résolution 178 (19/4) relative aux demandes et aux transactions de sukuk. Contrôles généraux: les sukuk doivent servir les objectifs de la loi – développement, activités concrètes, justice entre les parties; leurs contrats doivent garantir la propriété légalement et conformément à la charia, ainsi que la disposition et la responsabilité qui en découlent, sans manœuvres dilatoires ni faux-semblants, et aboutir à un résultat équitable; leurs documents doivent prévoir des mécanismes de suivi des demandes et un examen périodique de l'utilisation des fonds aux fins déclarées; enfin, ils doivent présenter les différences essentielles avec les obligations à intérêt, tant au niveau de leur structure et de leur conception que de leur composition, différences qui se reflètent dans leur commercialisation et leur tarification. Concernant les engagements: le mudarib, l’associé ou l’agent ne peut s’engager à racheter les sukuk ou leurs actifs au pair ou à une valeur prédéfinie garantissant le capital ou la trésorerie immédiate contre une trésorerie différée plus importante, sauf en cas de transgression ou de négligence nécessitant la protection des droits des porteurs; il ne peut pas non plus prêter aux porteurs lorsque le rendement réel est inférieur aux attentes, ce qui constituerait un prêt avec vente ou un prêt à intérêt; une réserve sur les bénéfices peut couvrir l’éventuel déficit; et la couverture des risques de capital par une assurance coopérative ou takaful rigoureuse est autorisée. Concernant la location de l’actif à son vendeur: la vente d’un actif au comptant à condition que le vendeur le loue dans le cadre d’un contrat de location avec promesse de transfert, le total excédant le prix au comptant, explicite ou implicite, constitue une opération 'ina interdite, de sorte qu’aucun sukuk ne peut être émis sur cette opération. Concernant la location de ce qui est décrit dans le passif: la location des objets décrits dans le passif est autorisée et des sukuk peuvent être émis sur ces objets. La difficulté réside dans le report du loyer au-delà de l'échéance contractuelle et la négociation des sukuk avant la désignation du bien loué; la mise en place d'une équipe d'étude a été recommandée (étude finalisée par la résolution 196 (21/2)). Concernant la négociation de titres – sukuk, actions ou parts: si l'actif du titre est exclusivement constitué de liquidités ou de créances, la négociation suit les règles de change ou de cession de créances; s'il s'agit exclusivement de biens, d'usufruits ou de droits, la négociation au prix convenu est autorisée; en cas d'actif mixte, si les liquidités et les créances sont subordonnées à ce qui peut être légitimement suivi et que le titre en comprend la propriété, la négociation est autorisée quelle que soit la proportion; sinon, les règles de prédominance s'appliquent; si la société ou le projet n'a pas encore démarré ses activités ou est en liquidation, les règles de prédominance s'appliquent; et étant donné que la subordination a été établie par la propriété de l'exploitant, de l'ouvrage ou de l'activité, et que le critère de prédominance s'est avéré large, la mise en place d'une équipe d'étude a été recommandée (étude finalisée par les résolutions 214 (22/10) et 226 (23/10)). Concernant l'effet des résolutions sur les contrats antérieurs: les résolutions de l'Académie s'appliquent dès leur publication et n'affectent pas les contrats antérieurs, y compris les sukuk émis sur la base d'un ijtihad ou d'une fatwa reconnus; les musulmans doivent suivre la charia dans la mesure de leurs capacités et s'efforcer constamment de surmonter l'incapacité et de sortir de la nécessité."
  tr: "Uluslararası İslami Fiqh Akademisi'nin yirminci oturumunda (26 Şevval – 2 Dhu al-Qi'de 1433 H, 13–18 Eylül 2012), Cidde'deki 'İslami Sukuk: Sunum ve Değerlendirme' seminerinin önerileri (10–11 Jumada al-Akhirah 1431 H, 24–25 Mayıs 2010) ve sukuk, uygulamaları ve dolaşıma ilişkin 178 (19/4) sayılı kararı doğrultusunda toplu karar. Genel Düzenlemeler: Sukuklar, kalkınmayı teşvik etme, gerçek faaliyetleri destekleme ve adaletin tesis edilmesi gibi mevzuat amaçlarına ulaşmalıdır; sözleşmeleri, mülkiyeti yasal ve dini olarak tesis ederek, ortaya çıkan düzenlemeyi garanti içererek ve hile ile formalitelerden arınmış olmalı, hukuki sonuçlarının bütünlüğünü koruyarak bu gereklilikleri yerine getirmelidir; belgeleri, gelirlerinin belirli amaçlar için doğru kullanımını sağlamak için uygulama kontrol mekanizmalarını ve periyodik inceleme mekanizmalarını içermelidir; ve pazarlama ve fiyatlandırmalarını etkileyen yapısal, tasarım ve bileşimdeki temel tefecilik tahvilleri ile aralarındaki temel farklılıkları karşılamalıdır. Taahhütlerde: Bir spekülatör, ortak veya acente, sukuk veya varlıklarını nominal değeri veya önceden belirlenmiş değeri üzerinden satın almayı taahhüt edemez — ancak sukukların haklarının garanti altına alınmasını gerektiren ihlal ve ihmaller hariç; sukuk sahipleri, gerçek getirilerin beklenenin altına düştüğünde kredi veremez ve bu avans, satış veya faizli kredilere yol açtığında; ve olası eksiklikleri telafi etmek için kâr rezervi oluşturulabilir; sermaye riskleri disiplinli kooperatif veya takaful sigortasıyla korunabilir. Bir varlığı satıcıya kiralarken: satıcının mülkiyet sözü ve açık veya örtük nakdi aşan bir fiyatla mülkiyet sözü vermesi koşuluyla, bu nedenle sukuk ihraç edilemez. Tanımlanan mülkün sorumluluk kapsamında kiralanmasına gelince: sorumlu olarak tanımlanan mülklerin kiralanıp bunlar üzerinde tapu düzenlenmesi izinlidir. Konu, sözleşme konseyinden kira ödemesinin ertelenmesi ve kira yerinin belirlenmeden önce tapu dolaşımına ilişkin karar üzerine odaklanmaktadır — bu konuyu incelemek için bir ekip kurulmasını önermiştir (196 (21/2) sayılı Karar ile tamamlanmıştır). Sukuk, hisse senetleri veya birimler gibi menkul kıymetlerin ticaretinde: varlıkları net para veya borç ise, borç değişimi veya satış hükümlerine tabi ise; kalem, fayda veya hak olarak tasfiye ediliyorsa, üzerinde anlaşılan fiyattan işlem yapılmasına izin verilir; eğer bunlar karışıksa, para ve borçlar geçerli olana aitse ve teminat borcun mülkiyetini içeriyorsa, yüzde dikkate alınmadan işlem görebilir; aksi takdirde öncelik kuralına tabidir; şirket fiili faaliyete başlamamışsa veya tasfiye aşamasındaysa önleyici kurala tabidir; işletmecinin, işin veya faaliyetin mülkiyetinin kanıtlanmış ikincillik ve önleyici kriterin genişletilmesi nedeniyle, kriterleri incelemek üzere bir ekip oluşturulması önerilmiştir (214 (22/10) ve 226 (23/10) sayılı kararlarda tamamlanmıştır). Önceki sözleşmeler üzerindeki kararların etkisi hakkında: Akademi kararları verildiği andan itibaren geçerlidir ve geçerli ijtihad veya fetva ile yayımlanan sukuk dahil önceki sözleşmeleri etkilemez. Müslümanlar, yetenekleri doğrultusunda Şeriata uymalı ve yetersizlikleri ortadan kaldırmak ve zorunlu hükümleri ortadan kaldırmak için sürekli çaba göstermelidir."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh di Oran (26 Syayaw – 2 Dhu al-Qi'dah 1433 H, 13–18 September 2012) mengikuti rekomendasi seminar 'Sukuk Islam: Presentasi dan Evaluasi' di Jeddah (10–11 Jumada al-Akhirah 1431 H, 24–25 Mei 2010) dan Keputusan 178 (19/4) mengenai sukuk, penerapannya, dan peredaran. Peraturan Umum: Sukuk harus mencapai tujuan legislasi dalam mendorong pembangunan, mendukung kegiatan nyata, dan menegakkan keadilan; kontrak mereka harus memenuhi persyaratan dengan menetapkan kepemilikan secara hukum dan agama, penempatan yang dihasilkan, membawa jaminan, dan bebas dari tipu daya serta formalitas, dengan integritas konsekuensi hukumnya; dokumen mereka harus mencakup mekanisme pengendalian aplikasi dan tinjauan berkala untuk memastikan penggunaan hasil yang tepat untuk tujuan tertentu; dan mereka harus memenuhi perbedaan mendasar antara mereka dan obligasi riba dalam struktur, desain, dan komposisi yang mencerminkan pemasaran dan penetapan harga mereka. Dalam komitmen: Seorang spekulan, mitra, atau agen tidak boleh berkomitmen untuk membeli sukuk atau asetnya pada nilai nominal atau nilai yang telah ditentukan dengan cara yang menjamin modal atau uang tunai ditunda lebih dari itu — kecuali untuk pelanggaran dan kelalaian yang memerlukan jaminan hak pemegang sukuk; pemegang sukuk tidak boleh meminjamkan jika pengembalian sebenarnya di bawah perkiraan yang menyebabkan uang muka, penjualan, atau pinjaman berbunga; dan cadangan keuntungan dapat dibentuk untuk mengkompensasi potensi kekurangan; risiko modal dapat dilindungi melalui asuransi koperasi atau takaful yang disiplin. Dalam menyewakan aset kepada penjualnya: tidak diperbolehkan menjual aset dengan uang tunai dengan syarat penjual menyewakannya dengan janji kepemilikan dengan total sewa dan harga melebihi uang tunai secara eksplisit atau implisit karena merupakan spesimen yang dilarang, sehingga sukuk tidak boleh diterbitkan atas aset tersebut. Mengenai penyewaan properti yang dijelaskan di bawah kewajiban: diperbolehkan untuk menyewakan properti yang disebut bertanggung jawab dan menerbitkan akta atas properti tersebut. Isu ini berpusat pada putusan tentang penundaan sewa dari dewan kontrak dan keputusan tentang peredaran akta sebelum menentukan tempat sewa — ia merekomendasikan pembentukan tim untuk mempelajarinya (diselesaikan dalam Keputusan 196 (21/2)). Dalam perdagangan sekuritas seperti sukuk, saham, atau satuan: jika asetnya adalah uang bersih atau utang yang tunduk pada ketentuan pertukaran atau penjualan utang; jika dicairkan sebagai barang, manfaat, atau hak, perdagangan diperbolehkan dengan harga yang disepakati; jika merupakan campuran, jika uang dan utang termasuk dalam apa yang sah dan sekuritas mencakup kepemilikan utang, maka dapat diperdagangkan tanpa memperhatikan persentase; jika tidak, dikenakan aturan preemptif; jika perusahaan belum memulai operasi aktual atau sedang dilikuidasi, maka tunduk pada aturan preemptif; karena subsidiaritas kepemilikan operator, pekerjaan, atau aktivitas yang terbukti dan perluasan kriteria preemptif, disarankan untuk membentuk tim guna mempelajari kriteria tersebut (dilengkapi dalam keputusan 214 (22/10) dan 226 (23/10)). Mengenai dampak keputusan terhadap kontrak sebelumnya: Keputusan Akademi berlaku sejak saat diterbitkan dan tidak memengaruhi kontrak sebelumnya, termasuk sukuk yang dikeluarkan oleh ijtihad atau fatwa yang sah. Muslim harus mengikuti Syariah sesuai kemampuan mereka dan terus berupaya menghilangkan ketidakmampuan serta menghilangkan ketentuan kebutuhan."
