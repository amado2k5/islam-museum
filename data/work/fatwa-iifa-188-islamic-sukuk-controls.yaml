label: { ar: "قرار مجمع الفقه الإسلامي الدولي 188 (20/3) بشأن استكمال موضوع الصكوك الإسلامية", en: "IIFA resolution 188 (20/3) on completing the subject of Islamic sukuk", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 188 (20/3): اسلامی صکوک کے موضوع کی تکمیل" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته العشرين بوهران ⁦(26 شوال – 2 ذو القعدة 1433هـ، 13–18 سبتمبر 2012م)⁩ بعد توصيات ندوة «الصكوك الإسلامية: عرض وتقويم» بجدة ⁦(10–11 جمادى الآخرة 1431هـ، 24–25 مايو 2010م)⁩ وقراره 178 ⁦(19/4)⁩ بشأن الصكوك وتطبيقاتها وتداولها. ضوابط عامة: يجب أن تحقق الصكوك مقاصد التشريع من تعزيز التنمية ودعم النشاطات الحقيقية وإقامة العدالة؛ وأن تحقق عقودها مقتضاها من ثبوت الملكية شرعًا وقانونًا وما يترتب عليها من التصرف وتحمل الضمان وتخلو من الحيل والصورية مع سلامة ما تؤول إليه شرعًا؛ وأن تتضمن وثائقها آليات ضبط التطبيق والمراجعة الدورية لسلامة استخدام حصيلتها في الغرض المحدد؛ وأن تستوفي الفروق الجوهرية بينها وبين السندات الربوية هيكلةً وتصميمًا وتركيبًا منعكسًا على تسويقها وتسعيرها. وفي التعهدات: لا يجوز للمضارب أو الشريك أو الوكيل أن يتعهد بشراء الصكوك أو أصولها بقيمتها الاسمية أو بقيمة محددة سلفًا بما يؤدي لضمان رأس المال أو نقد حال بنقد مؤجل أكثر منه — ويستثنى التعدي والتفريط المستوجبان ضمان حقوق حملة الصكوك؛ ولا يجوز إقراض حملة الصكوك عند نقص العائد الفعلي عن المتوقع بما يؤدي لسلف وبيع أو قرض بفائدة ويجوز تكوين احتياطي من الأرباح لجبر النقص المحتمل؛ ويجوز التحوط من مخاطر رأس المال بالتأمين التعاوني أو التكافلي المنضبط. وفي إجارة الأصل على بائعه: لا يجوز بيع أصل بثمن نقدي بشرط استئجار البائع له بإجارة مقرونة بوعد تمليك بما مجموعه أجرة وثمن يتجاوز النقدي صراحة أو ضمنًا لأنه من العينة المحرمة، فلا يجوز إصدار صكوك عليها. وفي إجارة الموصوف في الذمة: يجوز إجارة الأعيان الموصوفة في الذمة وإصدار صكوك عليها، ويتركز الإشكال في حكم تأجيل الأجرة عن مجلس العقد وحكم تداول صكوكها قبل تعيين محل الإجارة — أوصى بتشكيل فريق لدراستها ⁦(استكملت في قرار 196 (21/2))⁩. وفي تداول الأوراق المالية من صكوك أو أسهم أو وحدات: إن تمحضت موجوداتها نقودًا أو ديونًا خضعت لأحكام الصرف أو بيع الدين؛ وإن تمحضت أعيانًا أو منافع أو حقوقًا جاز التداول بالسعر المتفق عليه؛ وإن كانت خليطًا فإن كانت النقود والديون تابعة لما يصح أن يكون متبوعًا وكانت الورقة متضمنة ملكيته جاز التداول دون مراعاة النسبة، وإلا خضعت لأحكام الغلبة؛ وإن لم تبدأ الشركة العمل الفعلي أو كانت تحت التصفية خضعت لأحكام الغلبة؛ ولظهور ثبوت التبعية بملكية المشغل أو العمل أو النشاط واتساع معيار الغلبة أوصى بتشكيل فريق لدراسة المعايير ⁦(استكملت في قراري 214 (22/10) و226 (23/10))⁩. وفي أثر القرارات على العقود السابقة: قرارات المجمع تسري من حين صدورها ولا تؤثر على ما سبقها من عقود ومنها صكوك صدرت باجتهاد أو فتوى معتبرة، وعلى المسلمين اتباع الشريعة بحسب الوسع والسعي المستمر لرفع العجز والتخلص من أحكام الضرورة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 20th session in Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 September 2012), after the Jeddah seminar 'Islamic sukuk: presentation and evaluation' (10–11 Jumada al-Akhira 1431, 24–25 May 2010) and its resolution 178 (19/4) on sukuk applications and trading. General controls: sukuk must serve the ends of the law — development, real activities, justice between parties; their contracts must secure ownership legally and sharia-wise with the resulting disposal and liability, free of stratagems and nominalism, with a sound outcome; their documents must contain mechanisms for monitoring application and periodic review that proceeds are used for the stated purpose; and they must display the essential differences from interest-bearing bonds in structure, design and composition, reflected in marketing and pricing. On undertakings: the mudarib, partner or agent may not undertake to buy the sukuk or their assets at par or a preset value guaranteeing capital or spot cash against larger deferred cash — except cases of transgression or negligence requiring protection of holders' rights; nor may he lend holders when actual return falls short of expected, which would make loan-with-sale or interest — a reserve from profits may instead cover possible shortfall; and hedging capital risks through disciplined cooperative or takaful insurance is permissible. On leasing the asset back to its seller: selling an asset for cash on condition the seller rents it under a lease with a promise of transfer, the total exceeding the cash price, explicit or implied, is the prohibited 'ina transaction, so no sukuk may be issued on it. On leasing what is described in liability: leasing objects described in liability is permissible and sukuk may be issued on it; the difficulty lies in deferring rent past the contract session and trading its sukuk before the leased object is specified — a study team was recommended (completed in resolution 196 (21/2)). On trading securities — sukuk, shares or units: if the paper's assets are purely cash or debts, trading follows exchange or debt-sale rules; if purely objects, usufructs or rights, trading at the agreed price is permissible; if mixed, then if the cash and debts are subordinate to what may properly be followed and the paper comprises its ownership, trading is permissible regardless of proportion, otherwise predominance rules apply; if the company or project has not begun actual work or is under liquidation, predominance rules apply; and since subordination proved establishable through ownership of operator, work or activity, and the predominance criterion proved broad, a study team was recommended (completed in resolutions 214 (22/10) and 226 (23/10)). On resolutions' effect on earlier contracts: Academy resolutions apply from issuance and do not affect preceding contracts including sukuk issued on recognised ijtihad or fatwa; Muslims must follow the sharia within capacity and keep striving to lift incapacity and exit necessity."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، وہران میں بیسویں مجلس ⁦(26 شوال – 2 ذو القعدہ 1433ھ، 13–18 ستمبر 2012ء)⁩ میں — جدہ کی سیمینار 'اسلامی صکوک: عرض و جائزہ' ⁦(10–11 جمادی الآخرہ 1431ھ، 24–25 مئی 2010ء)⁩ اور قرارداد 178 ⁦(19/4)⁩ کے بعد۔ عمومی ضوابط: صکوک کو شرعی مقاصد — ترقی، حقیقی سرگرمیاں، دونوں فریقوں میں انصاف — پورا کرنا چاہیے؛ ان کے عقود ملکیت کو شرعاً و قانوناً ثابت کریں اور اس کے نتائج — تصرف اور ضمانت — کے ساتھ حیلے اور صوری پن سے پاک ہوں اور انجام شرعاً درست ہو؛ ان کے دستاویزات میں اطلاق کی نگرانی اور وقفے وقفے سے نظرثانی کے آلات ہوں کہ آمدنی مقررہ مقصد میں لگے؛ اور وہ سودی بانڈز سے ساخت، ڈیزائن اور ترکیب میں جوہری فرق رکھیں جو مارکیٹنگ اور قیمت پر ظاہر ہو۔ تعہدات پر: مضارب، شریک یا وکیل یہ عہد نہیں کر سکتا کہ صکوک یا ان کے اثاثے برابر یا طے شدہ قیمت پر خریدے گا جس سے سرمائے کی ضمانت یا حال نقد بڑے مؤجل نقد کے بدلے ہو — سوائے زیادتی یا کوتاہی کی صورتوں میں ہولڈروں کے حقوق کے تحفظ کے؛ اور نہ حقیقی آمدنی متوقع سے کم ہونے پر ہولڈروں کو قرض دے سکتا ہے جو سلف و بیع یا سودی قرض بنے — ممکنہ کمی کے لیے منافع سے ذخیرہ بنایا جا سکتا ہے؛ اور سرمائے کے خطرات سے منضبط تعاونی یا تکافلی بیمے سے ہیجنگ جائز ہے۔ بیچنے والے کو اثاثہ واپس کرائے پر دینے پر: نقد قیمت پر اثاثہ بیچنا اس شرط کے ساتھ کہ بیچنے والا اسے کرائے پر لے تملیک کے وعدے کے ساتھ تاکہ کل اجرت و قیمت نقد رقم سے بڑھے — صریح یا ضمنی — حرام عینہ ہے، اس پر صکوک جاری نہیں ہو سکتے۔ ذمہ میں موصوف کا اجارہ: ذمہ میں موصوف اشیاء کا اجارہ اور اس پر صکوک جائز ہیں؛ مشکل اجرت کا عقد کے مجلس سے مؤجل ہونا اور محل کے تعین سے پہلے اس کی صکوک کا ٹریڈ ہے — مطالعاتی ٹیم کی سفارش ⁦(قرارداد 196 (21/2) میں مکمل)⁩۔ سیکیورٹیز — صکوک، حصص یا یونٹس — کے ٹریڈ پر: اگر کاغذ کے اثاثے خالص نقد یا قرض ہوں تو ٹریڈ صرف یا قرض کی بیع کے احکام تابع؛ خالص اشیاء، منافع یا حقوق ہوں تو متفقہ قیمت پر ٹریڈ جائز؛ مخلوط ہوں تو اگر نقد اور قرض اس کے تابع ہوں جو جائز طور پر متبوع ہو سکتا ہے اور کاغذ اس کی ملکیت پر مشتمل ہو تو تناسب کی رعایت بغیر ٹریڈ جائز، ورنہ غلبہ کے احکام؛ اور اگر کمپنی یا منصوبہ ابھی کام شروع نہ کیا ہو یا تحلیل میں ہو تو غلبہ کے احکام۔ چونکہ تبعیت مشغل، کام یا سرگرمی کی ملکیت سے بھی ثابت ہو سکتی ہے اور غلبہ کا معیار وسیع نکلا، معیارات کی تحقیق کے لیے ٹیم کی سفارش ⁦(قراردادوں 214 (22/10) اور 226 (23/10) میں مکمل)⁩۔ سابقہ عقود پر قراردادوں کے اثر پر: اکیڈمی کی قراردادیں جاری ہونے سے لاگو ہیں اور سابقہ عقود کو متاثر نہیں کرتیں جن میں معتبر اجتہاد یا فتویٰ سے جاری صکوک ہیں؛ مسلمانوں پر اپنی استطاعت کے مطابق شریعت کی پابندی اور عجز دور کرنے اور ضرورت سے نکلنے کی مسلسل کوشش لازم ہے۔"
