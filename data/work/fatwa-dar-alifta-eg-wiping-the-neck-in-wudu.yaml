id: work/fatwa-dar-alifta-eg-wiping-the-neck-in-wudu
class: work
kind: fatwa
label: { ar: "حكم مسح الرقبة في الوضوء", en: "Wiping the neck during wudu", ur: "وضو میں گردن کا مسح", es: "Limpiarse el cuello durante el wudu", fr: "S'essuyer le cou pendant les ablutions", tr: "Destmem sırasında boynun silinmesine ilişkin karar", id: "Aturan tentang mengelap leher saat wudhu" }
summary:
  ar: "سائل سأل عن مسح الرقبة أثناء الوضوء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22135)⁩ أن مسح الرقبة من الأمور الخلافية التي ليس فيها إنكار على فاعله ولا تاركه والأمر فيه سعة، فمن مسح رقبته فلا بأس ومن لم يمسح فلا حرج عليه، على ما فصّل الجواب."
  en: "A questioner asked about wiping the neck during wudu. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22135) answered that wiping the neck is a differed-over matter in which neither doer nor leaver is blamed — the matter has latitude; whoever wipes his neck does no wrong and whoever does not is not at fault, as the answer details."
  ur: "ایک سائل نے وضو میں گردن کے مسح کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22135)⁩ نے جواب دیا کہ گردن کا مسح اختلافی معاملات میں ہے جس میں کرنے والے اور نہ کرنے والے دونوں پر کوئی انکار نہیں اور معاملے میں گنجائش ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre limpiarse el cuello durante el wudu. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22135) respondió que limpiarse el cuello es un asunto discrecional en el que ni quien lo hace ni quien no lo hace son culpables; el asunto tiene cierta flexibilidad; quien se limpia el cuello no comete ninguna falta y quien no lo hace no tiene culpa, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le fait de s'essuyer la nuque pendant les ablutions. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22135) a répondu que cette pratique est sujette à controverse et que ni celui qui l'effectue ni celui qui ne l'effectue pas n'est blâmé; la question est laissée à l'appréciation de chacun; celui qui s'essuie la nuque ne commet aucune faute et celui qui ne le fait pas n'est pas en faute non plus, comme le précise la réponse."
  tr: "Bir soru soran kişi abdest alma sırasında boynu silmeyi sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 22135), boynu silmenin yapanı veya terk etmeyi engellemeyen tartışmalı bir konu olduğunu ve konunun geniş olduğunu yanıtladı. Boynunu silen kişi caizdir, silmeyen ise zarar görmez, bu cevabda detaylandırılmıştır."
  id: "Seorang penanya menanyakan tentang mengelap leher saat wudhu. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22135) menjawab bahwa mengelap leher adalah hal yang diperdebatkan yang tidak melarang atau meninggalkannya, dan masalah ini bersifat luas. Siapa pun yang mengelap lehernya diperbolehkan, dan siapa pun yang tidak mengelap tidak akan dirugikan, seperti yang dijelaskan dalam jawaban."
