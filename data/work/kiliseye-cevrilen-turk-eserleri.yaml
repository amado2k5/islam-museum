summary:
  ar: "فهرس في ثلاثة مجلدات لمحمد أمين يلماز ⁦(ط1 إسطنبول 2020، ط2 موسعة أنقرة 2023)⁩ يحصي مئات المباني العثمانية والإسلامية التي حُوّلت إلى كنائس في البلقان والقوقاز وأوروبا الوسطى والجزائر والقرم واليونان، بلغتين {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 7} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 37}."
  en: "A three-volume bilingual catalogue by Mehmet Emin Yılmaz (1st ed. Istanbul 2020, enlarged 2nd ed. Ankara 2023) listing Ottoman and other Muslim buildings converted into churches across the Balkans, the Caucasus, Central Europe, Algeria, Crimea and Greece {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 7} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 37}."
  es: "Un catálogo bilingüe en tres volúmenes de Mehmet Emin Yılmaz (1.ª ed. Estambul 2020, 2.ª ed. ampliada. Ankara 2023) que enumera los edificios otomanos y otros musulmanes convertidos en iglesias en los Balcanes, el Cáucaso, Europa Central, Argelia, Crimea y Grecia {cita:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 7} {citar:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 37}."
  fr: "Un catalogue bilingue en trois volumes de Mehmet Emin Yılmaz (1ère éd. Istanbul 2020, 2e éd. élargie Ankara 2023) répertoriant les bâtiments ottomans et autres bâtiments musulmans transformés en églises à travers les Balkans, le Caucase, l'Europe centrale, l'Algérie, la Crimée et la Grèce {cite: yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 7} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 37}."
  ur: "مہمت ایمن یلماز کا تین جلدوں پر مشتمل دو لسانی کیٹلاگ ⁦(پہلا ایڈیشن استنبول 2020، بڑھا ہوا دوسرا ایڈیشن انقرہ 2023)⁩ جس میں بلقان، قفقاز، وسطی یورپ، الجزائر، کریمیا اور گریمیا کے گرجا گھروں میں تبدیل ہونے والی عثمانی اور دیگر مسلم عمارتوں کی فہرست دی گئی ہے۔ {حوالہ: Yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 7} {حوالہ: Yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 37}۔"
