id: work/fatwa-amja-woman-left-prayer-return
class: work
kind: fatwa
label: { ar: "ترك الصلاة والعودة إلى الله", en: "Leaving the prayer — a call back to repentance", ur: "نماز چھوڑنا — توبہ کی دعوت", es: "Al terminar la oración, un llamado al arrepentimiento.", fr: "Quitter la prière — un appel à la repentance", tr: "Duayı bırakıp Tanrı'ya dönmek", id: "Meninggalkan doa dan kembali kepada Tuhan" }
summary:
  ar: "سألت امرأة قصتها المعقدة التي تتضمن تركها للصلاة والتبرج وخلافات أسرية. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21831 بتاريخ 19 ديسمبر 2005)⁩ أنه لم ينزل بلاء إلا بذنب ولم يكشف إلا بتوبة وقال تعالى وما أصابكم من مصيبة فبما كسبت أيديكم ويعفو عن كثير، وترك الصلاة من أعظم الكبائر وهو عند كثير من أهل العلم باب من أبواب الردة عن الإسلام فقد قال العهد الذي بيننا وبينهم الصلاة فمن تركها فقد كفر وقال عمر بن الخطاب لا سهم في الإسلام لمن ترك الصلاة ولا حظ فيه، وتبرجها وتركها للحجاب من المنكرات الواجب التوبة منها، ونصحها بالعودة إلى الله بالندم والإقلاع والعزم على الإصلاح."
  en: "A woman recounted her tangled story — abandoning the prayer, uncovering, and family conflicts. Dr. Salah al-Sawi (fatwa no. 21831, 19 December 2005) answered that no affliction descends but for a sin and none is lifted but by repentance — 'whatever strikes you of calamity is for what your hands earned, and He pardons much'; leaving the prayer is among the greatest of the major sins and, at many scholars, a door of leaving Islam — 'the covenant between us and them is the prayer; whoever leaves it has disbelieved', and Umar's 'no share in Islam for one who leaves the prayer'; her uncovering and leaving the hijab are among the wrongs repentance requires; he counselled her return to God with remorse, desisting and resolve to mend. Recorded as AMJA's answer."
  ur: "ایک خاتون نے نماز ترک کرنے اور دیگر مسائل کی داستان سنائی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21831، 19 دسمبر 2005)⁩ کے مطابق نماز چھوڑنا بڑے گناہوں میں ہے اور بعض علماء کے نزدیک ردہ کا دروازہ — توبہ ندم استقامت کی تلقین کی۔"
  es: "Una mujer relató su compleja historia: abandono de la oración, desvelamiento y conflictos familiares. El Dr. Salah al-Sawi (fatwa n.º 21831, 19 de diciembre de 2005) respondió que ninguna aflicción desciende sino por un pecado y ninguna se levanta sino por el arrepentimiento: «cualquier calamidad que te sobreviene es por lo que tus manos han cometido, y Él perdona mucho»; abandonar la oración es uno de los pecados más graves y, para muchos eruditos, una puerta para abandonar el Islam: «el pacto entre nosotros y ellos es la oración; quien la abandona ha renegado de la fe», y Umar dijo: «quien abandona la oración no tiene parte en el Islam»; su desvelamiento y el abandono del hiyab se encuentran entre las faltas que requieren arrepentimiento; le aconsejó que volviera a Dios con remordimiento, desistiendo y con la firme intención de enmendar. Registrado como respuesta de AMJA."
  fr: "Une femme a raconté son histoire complexe: l’abandon de la prière, le dévoilement de son voile et des conflits familiaux. Le Dr Salah al-Sawi (fatwa n° 21831, 19 décembre 2005) a répondu qu’aucune affliction ne survient sans conséquence sur un péché et qu’aucune n’est levée sans repentir: « Tout malheur qui te frappe est dû à tes œuvres, et Il pardonne beaucoup. »; l’abandon de la prière est un péché majeur et, pour de nombreux savants, une porte d’excommunication: « La prière est le pacte qui nous lie à eux; quiconque l’abandonne a mécru », et selon la maxime d’Umar: « Nul n’est digne de l’islam s’il abandonne la prière. »; le fait qu’elle ait dévoilé son voile et abandonné le hijab compte parmi les fautes qui exigent le repentir. Il lui a conseillé de revenir à Dieu avec remords, de renoncer à ses péchés et de prendre la ferme résolution de se repentir. Cette réponse a été consignée dans la fatwa d’AMJA."
  tr: "Bir kadına namazı, süslemeyi bırakması ve aile anlaşmazlıklarını içeren karmaşık hikayesi soruldu. Dr. Salah Al-Sawy (19 Aralık 2005 tarihli 21831 No. fetva) hiçbir dertin yalnızca günah yoluyla olduğunu ve bunun sadece tövbe yoluyla ortaya çıktığını söyledi. Yüce Allah şöyle dedi: Başına gelen her sıkıntı, ellerinizin kazandığı şeylerden kaynaklanır ve birçok kişiyi affeder. Namazı terk etmek en büyük günahlardan biridir ve birçok âlime göre İslam'ın dinden dönme yönlerinden biridir. Bizimle aramızdaki antlaşmada şöyle der: Namazı terk eden kâfir olmuştur. Ömer bin El-Hattab şöyle dedi: 'Namaz kılan kişinin İslam'da payı yoktur ve bu da onun payı değildir. Kendini süslemek ve başörtüsünü bırakmak, tövbe eden kötü eylemler arasındadır ve ona pişmanlık, terk etme ve ıslah kararlılığıyla Allah'a dönmesini öğütledi.'"
  id: "Seorang wanita ditanya kisah rumitnya, yang mencakup meninggalkan doa, hiasan, dan perselisihan keluarga. Dr. Salah Al-Sawy menjawab (Fatwa No. 21831 tanggal 19 Desember 2005) bahwa tidak ada penderitaan yang menimpa kecuali karena dosa, dan hanya terungkap melalui pertobatan. Allah Yang Maha Kuasa berfirman: Apa pun penderitaan yang menimpa kamu adalah karena apa yang telah diusahakan oleh tanganmu, dan Dia mengampuni banyak orang. Meninggalkan doa adalah salah satu dosa terbesar, dan menurut banyak ulama, itu dianggap sebagai salah satu aspek murtad dalam Islam. Perjanjian antara kita dan mereka berkata: Siapa pun yang meninggalkan salat telah berbuat kafir. Umar ibn Al-Khattab berkata: 'Siapa pun yang meninggalkan shalat tidak memiliki bagian dalam Islam, dan itu juga bukan bagian darinya. Menghias diri dan meninggalkan hijab adalah salah satu perbuatan jahat yang menjadi pertobatan, dan dia menasihatinya untuk kembali kepada Tuhan dengan penyesalan, pengabaian, dan tekad untuk berubah.'"
