id: work/fatwa-amja-incontinence-waiting-time
class: work
kind: fatwa
label: { ar: "السلس وانتظار الانقطاع", en: "Waiting for the incontinence's pause — even past congregation", ur: "سلس کے ٹھراؤ کا انتظار", es: "Esperando la pausa de la incontinencia, incluso después de la congregación.", fr: "En attendant la fin de l'incontinence — même après la fin de la congrégation", tr: "Sorunsuz ve bağlantı kesilmeyi bekliyor", id: "Lancar dan menunggu pemutusan" }
summary:
  ar: "سأل سائل عن موازنة بين رفع الحرج وأحكام السلس. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80496 بتاريخ 21 نوفمبر 2009)⁩ أن السلس هو الحدث الذي يلازم كل الوقت فإن كان ينقطع في وقت معروف انتظر ذلك الوقت ولو أدى انتظاره إلى فوات صلاة الجماعة ما لم يخرج الوقت فإن خشي خروج الوقت قبل انقطاعه توضأ وصلى بعد إزالة النجس على ما فصّل الجواب من ضوابط أصحاب الأعذار."
  en: "A questioner noted the sharia lifts hardship yet the majority's rules burden excuse-holders. Dr. Salah al-Sawi (fatwa no. 80496, 21 November 2009) answered that incontinence is the hadath that attends all the time; if it ceases at a known hour he waits for that hour even at the cost of the congregational prayer, so long as the time does not run out — if he fears the time's exit before it ceases, he removes the filth, does wudu and prays. The answer details the excuse-holders' rules."
  ur: "سلس والے کا انتظار؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80496، 21 نومبر 2009)⁩ کے مطابق معلوم ٹھراؤ کا انتظار کرے خواہ جماعت چھوٹے؛ وقت نکلتا ہو تو وضو کر نماز پڑھے۔"
  es: "Un consultante señaló que la sharia alivia las dificultades, pero las normas de la mayoría suponen una carga para quienes tienen excusas. El Dr. Salah al-Sawi (fatwa n.º 80496, 21 de noviembre de 2009) respondió que la incontinencia es una condición permanente; si cesa a una hora determinada, se espera hasta esa hora, incluso a costa de la oración en congregación, siempre que no se agote el tiempo. Si se teme que el tiempo se agote antes de que cese, se limpia, realiza la ablución y reza. La respuesta detalla las normas para quienes tienen excusas."
  fr: "Un internaute a fait remarquer que la charia allège les difficultés, mais que les règles majoritaires pèsent sur ceux qui bénéficient d'une excuse. Le Dr Salah al-Sawi (fatwa n° 80496, 21 novembre 2009) a répondu que l'incontinence est une obligation permanente; si elle cesse à une heure connue, le fidèle attend cette heure, même au détriment de la prière en congrégation, tant que le temps imparti n'est pas écoulé. S'il craint que le temps ne soit écoulé avant la fin de l'incontinence, il se nettoie, fait ses ablutions et prie. La réponse détaille les règles applicables à ceux qui bénéficient d'une excuse."
  tr: "Bir soru soran kişi, zorlukların kaldırılması ile iflas kararları arasında bir denge hakkında bilgi verdi. Dr. Salah Al-Sawy (21 Kasım 2009 tarihli Fetva No. 80496), yatarak idrar kaçırmanın her zaman gerçekleşen bir olay olduğunu yanıtladı. Eğer bilinen bir zamanda durdurulursa, o zamanı beklemek gerekir; beklemek cemaatin namazının kaçırılmasına neden oluyorsa, zaman bitmeden dolacağı korkusu varsa, temiz kaçırmadan temizlendikten sonra el destmemi yapılmalı ve namaz kılınmalıdır; bu, mazeretli kişilerin kurallarıyla ilgili yanıtta detaylandırılmıştır."
  id: "Seorang penanya menanyakan tentang keseimbangan antara menghilangkan kesulitan dan putusan kebangkrutan. Dr. Salah Al-Sawy (Fatwa No. 80496 tanggal 21 November 2009) menjawab bahwa inkontinensia rawat inap adalah peristiwa yang terjadi setiap saat. Jika inkontinensia dihentikan pada waktu yang diketahui, harus menunggu waktu tersebut, dan jika menunggu menyebabkan doa jemaat terlewat kecuali waktu tersebut terlewat, jika ada kekhawatiran waktu akan habis sebelum berakhir, ia harus melakukan wudhu dan berdoa setelah mengeluarkan yang tidak suci, seperti yang dijelaskan dalam jawaban mengenai aturan bagi mereka yang memiliki alasan."
