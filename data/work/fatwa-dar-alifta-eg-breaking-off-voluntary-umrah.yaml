id: work/fatwa-dar-alifta-eg-breaking-off-voluntary-umrah
class: work
kind: fatwa
label: { ar: "حكم التحلل من الإحرام بالعمرة قبل الشروع فيها بسبب كسر", en: "Leaving ihram of a voluntary umrah before starting it because of a fracture", ur: "ہڈی کے ٹوٹنے پر عمرے کے احرام سے نکلنا", es: "Abandonar el estado de ihram de una umrah voluntaria antes de comenzarla debido a una fractura.", fr: "Abandonner l'ihram d'une umra volontaire avant de la commencer en raison d'une fracture" }
summary:
  ar: "سائل أحرم بعمرة تطوعًا ثم أصابه كسر في إحدى رجليه فسأل عن التحلل قبل الشروع فيها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21602)⁩ أن من أحرم بعمرة تطوعًا يلزمه الاستمرار فيها وإكمالها فإن أصابه مرض يمنعه من إتمامها فتفصيل حكمه في الجواب."
  en: "A man who entered ihram for a voluntary umrah then suffered a leg fracture asked about leaving it before starting. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21602) answered that one who enters ihram for a voluntary umrah must continue and complete it; if illness prevents completion, the answer sets out his ruling."
  ur: "ایک شخص نے نفلی عمرے کا احرام باندھا پھر ٹانگ میں ہڈی ٹوٹ گئی؛ اس نے شروع کرنے سے پہلے احرام سے نکلنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21602)⁩ نے جواب دیا کہ نفلی عمرے کا احرام باندھنے والے پر مکمل کرنا لازم ہے؛ اگر بیماری مانع ہو تو اس کا حکم جواب میں ہے۔"
  es: "Un hombre que entró en estado de ihram para realizar una umrah voluntaria y luego sufrió una fractura en la pierna preguntó si podía abandonarlo antes de comenzar. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21602) respondió que quien entra en estado de ihram para una umrah voluntaria debe continuar y completarla; si la enfermedad impide completarla, la respuesta expone su dictamen."
  fr: "Un homme, entré en état d'ihram pour une omra volontaire, s'est fracturé la jambe et a demandé s'il pouvait l'interrompre avant de commencer. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21602) a répondu que celui qui entre en état d'ihram pour une omra volontaire doit la poursuivre et la terminer; si la maladie l'empêche de la terminer, la fatwa expose la décision rendue."
