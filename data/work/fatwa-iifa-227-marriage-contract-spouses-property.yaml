id: work/fatwa-iifa-227-marriage-contract-spouses-property
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 227 (23/11) بشأن أثر عقد الزوجية على ملكية الزوجين", en: "IIFA resolution 227 (23/11) on the effect of the marriage contract on the spouses' property", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 227 (23/11): نکاح کے عقد کا میاں بیوی کی ملکیت پر اثر" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة والعشرين بالمدينة المنورة ⁦(19–23 صفر 1440هـ، 28 أكتوبر – 1 نوفمبر 2018م)⁩. قرر المجمع أن لكل من الزوجين ذمته المالية المستقلة وله بمقتضاها حق التصرف فيما يملكه من الأموال والحقوق معاوضة أو تبرعًا؛ وأن ما يملكه كل واحد منهما بسبب عقد الزواج أو بدونه ملك خاص لصاحبه ينتقل من بعده إلى ورثته؛ وأنه إذا تراضى الزوجان على اقتسام أموالهما عن طيب نفس واختيار فلا مانع شرعًا من ذلك ولا يجوز فرضه عليهما بالتعيين الملزم؛ وأن للزوجة إذا انتهت العلاقة الزوجية بالطلاق أو التطليق أو الخلع وأحدث لها ذلك ضررًا حق اللجوء للقضاء مطالبة بالتعويض عن الأضرار تفعيلًا معاصرًا لما قرره الشارع للمطلقة من حق المتعة بعد الطلاق؛ ودعا إلى إنشاء مؤسسات حكومية أو أهلية لرعاية المطلقات لسد حاجتهن."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 23rd session in Medina (19–23 Safar 1440, 28 October – 1 November 2018). It ruled that each spouse has an independent financial personality and therefore the right to dispose of what he or she owns of property and rights, for consideration or as a gift; that whatever each owns, whether through the marriage contract or apart from it, is that spouse's private property and passes on death to his or her heirs; that if the spouses willingly and freely agree between themselves to divide their property there is no sharia objection, but it may not be imposed on them as a binding specification; that where the marital relation ends by divorce, judicial divorce or khul' and causes the wife harm, she has the right to resort to a court claiming compensation for the harm suffered — a contemporary application of the mut'a right the lawgiver established for the divorced woman; and it called for the establishment of state or civil institutions to care for divorced women and meet their needs."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مدینہ منورہ میں تیس ویں مجلس ⁦(19–23 صفر 1440ھ، 28 اکتوبر – 1 نومبر 2018ء)⁩ میں۔ اکیڈمی نے فیصلہ دیا کہ میاں بیوی دونوں کی ذمۂ مالی آزاد ہے اور دونوں کو اپنی املاک و حقوق میں عوض یا عطیہ کے طور پر تصرف کا حق ہے؛ ہر ایک کی ملکیت — نکاح کے عقد سے حاصل ہو یا اس کے بغیر — اس کی ذاتی ملکیت ہے جو اس کے بعد وارثوں کو منتقل ہوتی ہے؛ اگر میاں بیوی باہمی رضامندی اور اختیار سے اپنی املاک کی تقسیم پر اتفاق کریں تو شرعاً کوئی حرج نہیں مگر ان پر لازم تعین کے ساتھ نافذ نہیں کیا جا سکتا؛ اگر ازدواجی تعلق طلاق، عدالتی طلاق یا خلع سے ختم ہو اور بیوی کو نقصان پہنچے تو اسے عدالت سے ہرجانے کا مطالبہ کرنے کا حق ہے — شارعِ حکمت کی طرف سے مطلقہ کے لیے مقرر حقِ متعہ کی عصری تطبیق؛ اور اس نے مطلقہ خواتین کی دیکھ بھال اور ضروریات کے لیے حکومتی یا اہلی ادارے بنانے کی دعوت دی۔"
