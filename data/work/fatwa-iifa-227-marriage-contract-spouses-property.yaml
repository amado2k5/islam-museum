label: { ar: "قرار مجمع الفقه الإسلامي الدولي 227 (23/11) بشأن أثر عقد الزوجية على ملكية الزوجين", en: "IIFA resolution 227 (23/11) on the effect of the marriage contract on the spouses' property", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 227 (23/11): نکاح کے عقد کا میاں بیوی کی ملکیت پر اثر", es: "Resolución 227 (23/11) de la IIFA sobre el efecto del contrato matrimonial en los bienes de los cónyuges.", fr: "Résolution 227 (23/11) de l'IIFA relative aux effets du contrat de mariage sur les biens des époux", tr: "Evlilik sözleşmesinin eşlerin mülkiyeti üzerindeki etkisine ilişkin Uluslararası İslami Fiqh Akademisi Kararı 227 (23/11)", id: "Resolusi Akademi Fiqh Islam Internasional 227 (23/11) mengenai dampak kontrak pernikahan terhadap kepemilikan pasangan" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة والعشرين بالمدينة المنورة ⁦(19–23 صفر 1440هـ، 28 أكتوبر – 1 نوفمبر 2018م)⁩. قرر المجمع أن لكل من الزوجين ذمته المالية المستقلة وله بمقتضاها حق التصرف فيما يملكه من الأموال والحقوق معاوضة أو تبرعًا؛ وأن ما يملكه كل واحد منهما بسبب عقد الزواج أو بدونه ملك خاص لصاحبه ينتقل من بعده إلى ورثته؛ وأنه إذا تراضى الزوجان على اقتسام أموالهما عن طيب نفس واختيار فلا مانع شرعًا من ذلك ولا يجوز فرضه عليهما بالتعيين الملزم؛ وأن للزوجة إذا انتهت العلاقة الزوجية بالطلاق أو التطليق أو الخلع وأحدث لها ذلك ضررًا حق اللجوء للقضاء مطالبة بالتعويض عن الأضرار تفعيلًا معاصرًا لما قرره الشارع للمطلقة من حق المتعة بعد الطلاق؛ ودعا إلى إنشاء مؤسسات حكومية أو أهلية لرعاية المطلقات لسد حاجتهن."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 23rd session in Medina (19–23 Safar 1440, 28 October – 1 November 2018). It ruled that each spouse has an independent financial personality and therefore the right to dispose of what he or she owns of property and rights, for consideration or as a gift; that whatever each owns, whether through the marriage contract or apart from it, is that spouse's private property and passes on death to his or her heirs; that if the spouses willingly and freely agree between themselves to divide their property there is no sharia objection, but it may not be imposed on them as a binding specification; that where the marital relation ends by divorce, judicial divorce or khul' and causes the wife harm, she has the right to resort to a court claiming compensation for the harm suffered — a contemporary application of the mut'a right the lawgiver established for the divorced woman; and it called for the establishment of state or civil institutions to care for divorced women and meet their needs."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مدینہ منورہ میں تیس ویں مجلس ⁦(19–23 صفر 1440ھ، 28 اکتوبر – 1 نومبر 2018ء)⁩ میں۔ اکیڈمی نے فیصلہ دیا کہ میاں بیوی دونوں کی ذمۂ مالی آزاد ہے اور دونوں کو اپنی املاک و حقوق میں عوض یا عطیہ کے طور پر تصرف کا حق ہے؛ ہر ایک کی ملکیت — نکاح کے عقد سے حاصل ہو یا اس کے بغیر — اس کی ذاتی ملکیت ہے جو اس کے بعد وارثوں کو منتقل ہوتی ہے؛ اگر میاں بیوی باہمی رضامندی اور اختیار سے اپنی املاک کی تقسیم پر اتفاق کریں تو شرعاً کوئی حرج نہیں مگر ان پر لازم تعین کے ساتھ نافذ نہیں کیا جا سکتا؛ اگر ازدواجی تعلق طلاق، عدالتی طلاق یا خلع سے ختم ہو اور بیوی کو نقصان پہنچے تو اسے عدالت سے ہرجانے کا مطالبہ کرنے کا حق ہے — شارعِ حکمت کی طرف سے مطلقہ کے لیے مقرر حقِ متعہ کی عصری تطبیق؛ اور اس نے مطلقہ خواتین کی دیکھ بھال اور ضروریات کے لیے حکومتی یا اہلی ادارے بنانے کی دعوت دی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 23.ª sesión en Medina (19-23 Safar 1440, 28 de octubre - 1 de noviembre de 2018). En ella se dictaminó que cada cónyuge tiene personalidad jurídica independiente y, por lo tanto, derecho a disponer de sus bienes y derechos, ya sea a cambio de una contraprestación o como donación; que todo lo que cada uno posee, ya sea a través del contrato matrimonial o al margen del mismo, es propiedad privada de ese cónyuge y se transmite a sus herederos tras su fallecimiento; que si los cónyuges acuerdan de forma voluntaria y libre dividir sus bienes, no existe objeción alguna por parte de la sharia, pero esta no puede imponerse como una especificación vinculante; que cuando la relación matrimonial termina por divorcio, divorcio judicial o khul' y causa daño a la esposa, ella tiene derecho a recurrir a un tribunal para reclamar una indemnización por el daño sufrido, una aplicación contemporánea del derecho mut'a que el legislador estableció para la mujer divorciada; y se pidió la creación de instituciones estatales o civiles para atender a las mujeres divorciadas y satisfacer sus necesidades."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 23e session à Médine (19-23 Safar 1440, 28 octobre – 1er novembre 2018) a statué que chaque époux possède une personnalité financière indépendante et, par conséquent, le droit de disposer de ses biens et droits, à titre onéreux ou gratuit; que tout ce que chacun possède, que ce soit par le biais du contrat de mariage ou en dehors de celui-ci, constitue sa propriété privée et est transmis à ses héritiers à son décès; que si les époux s'accordent librement et volontairement sur le partage de leurs biens, la charia ne s'y oppose pas, mais que ce partage ne peut leur être imposé comme une clause contraignante; que lorsque la relation conjugale prend fin par divorce, divorce judiciaire ou khul' et cause un préjudice à l'épouse, celle-ci a le droit de saisir un tribunal pour obtenir réparation du préjudice subi – une application contemporaine du droit de mut'a établi par le législateur pour la femme divorcée; et que la résolution a appelé à la création d'institutions étatiques ou civiles pour prendre soin des femmes divorcées et répondre à leurs besoins."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Medine'deki yirmi üçüncü oturumunda (19–23 Sefer 1440 H, 28 Ekim – 1 Kasım 2018) toplu kararı. Akademi, her eşin bağımsız bir mali sorumluluğu olduğunu ve mal ve haklarını takas veya bağış yoluyla kullanma hakkına sahip olduğunu; evlilik sözleşmesi nedeniyle ya da olmadan sahip olduğu şeyin sahibinin özel mülkü olduğunu ve ardından varislerine geçtiğini; eşler mallarını isteyerek ve istekli olarak paylaşmayı kabul ederlerse buna dini bir itiraz olmadığını ve bağlayıcı atama yoluyla bunu kabul etmenin mümkün olmadığını; evlilik ilişkisi boşanma, boşanma veya khula ile sona ererse ve bu ona zarar verirse, boşanma sonrası boşanma için mut'ah (mut'ah) hakkının yasal olarak yürürlüğe girmesine uygun olarak tazminat talep etme hakkına sahip olduğunu; boşanmış kadınların ihtiyaçlarını karşılamak üzere devlet veya özel kurumların kurulmasını talep etti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh tiga di Madinah (19–23 Safar 1440 H, 28 Oktober – 1 November 2018). Akademi memutuskan bahwa setiap pasangan memiliki tanggung jawab keuangan independen dan berhak menjual properti serta haknya melalui pertukaran atau donasi; bahwa apa yang dimiliki masing-masing, baik karena atau tanpa kontrak pernikahan, adalah properti pribadi pemiliknya dan kemudian diwariskan kepada ahli warisnya; dan jika pasangan setuju untuk membagi harta mereka secara sukarela dan atas pilihan, tidak ada keberatan agama terhadap hal ini dan tidak diperbolehkan untuk memaksakan hak tersebut melalui penunjukan yang mengikat; dan jika hubungan pernikahan berakhir dengan perceraian, perceraian, atau khula dan hal ini menyebabkan kerugian baginya, dia berhak untuk menuntut kompensasi atas kerugian sesuai dengan pengesahan sah hak mut'ah (mut'ah) untuk perceraian setelah perceraian; dan menyerukan pembentukan institusi pemerintah atau swasta untuk merawat wanita yang bercerai guna memenuhi kebutuhan mereka."
