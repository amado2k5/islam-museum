id: work/fatwa-amja-jews-christians-not-pleased
class: work
kind: fatwa
label: { ar: "لن ترضى عنك اليهود ولا النصارى", en: "Al-Baqara 120 — the wrong gloss corrected", ur: "یہود و نصاریٰ راضی نہیں ہوں گے — بقرہ 120", es: "Al-Baqara 120 — corrección del glosario erróneo", fr: "Al-Baqara 120 — correction de la glose erronée", tr: "Yahudiler ve Hristiyanlar sizinle yetinmeyecek", id: "Orang Yahudi dan Kristen tidak akan puas dengan Anda" }
summary:
  ar: "سأل سائل عن تأويل من يتكلون في الدين لآية لن ترضى عنكم اليهود ولا النصارى حتى تتبع ملتهم بأن معناها لو افترضنا اتباعهم فلن يرضوا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77598 بتاريخ 27 يناير 2009)⁩ أن هذا التأويل ليس بظاهر لأن النفي المشار إليه في الآية له غاية ينتهي عندها وهي حتى تتبع ملتهم فالآية لم تقل ولن ترضى عنك اليهود ولا النصارى ولو اتبعت ملتهم بل قالت حتى تتبع ملتهم، وسأل الله أن يرزق حسن الفهم لكتابه ويجنب الزيغ والزلل في القول والعمل."
  en: "A questioner cited religious speculators glossing 'the Jews and Christians will never be pleased with you until you follow their creed' to mean they would not be pleased even then. Dr. Salah al-Sawi (fatwa no. 77598, 27 January 2009) answered that the gloss is not sound — the negation in the verse has a bound at which it ends, 'until you follow their creed'; the verse did not say 'even if you followed their creed', and he asked God for sound understanding of His book and protection from deviation and slips in word and deed."
  ur: "ایک سائل نے بقرہ 120 کی ایک تاویل پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77598، 27 جنوری 2009)⁩ کے مطابق نفی کی انتہا «جب تک تم ان کے دین پر نہ آو» ہے — آیت نے کہا کہ پیروی نہ کرو گے تو راضی نہیں ہوں گے۔"
  es: "Un interlocutor citó a especuladores religiosos que interpretan la frase «los judíos y los cristianos nunca estarán complacidos contigo hasta que sigas su credo» como si quisieran decir que ni siquiera entonces estarían complacidos. El Dr. Salah al-Sawi (fatwa n.º 77598, 27 de enero de 2009) respondió que dicha interpretación no es correcta: la negación del versículo tiene un límite, «hasta que sigas su credo»; el versículo no dice «incluso si siguieras su credo». Por ello, pidió a Dios una comprensión sólida de Su libro y protección contra la desviación y los errores de palabra y obra."
  fr: "Un internaute a cité des spéculateurs religieux interprétant le verset « les Juifs et les Chrétiens ne seront jamais satisfaits de vous tant que vous n'aurez pas adopté leur croyance » comme signifiant qu'ils ne le seraient pas même après cela. Le Dr Salah al-Sawi (fatwa n° 77598, 27 janvier 2009) a répondu que cette interprétation est erronée: la négation dans le verset est circonscrite à « tant que vous n'aurez pas adopté leur croyance »; le verset ne dit pas « même si vous adoptiez leur croyance ». Il a ensuite imploré Dieu de lui accorder une compréhension juste de Son Livre et de le préserver de toute déviation et de tout faux pas, tant en paroles qu'en actes."
  tr: "Bir soru soran kişiye, dine dayananların 'Yahudiler ya da Hristiyanlar sizden memnun kalmazlar' ayeti hakkında yorumları soruldu; yani eğer onları takip ettiğinizi varsayarsak, onlar tatmin olmazlar. Dr. Salah Al-Sawy (27 Ocak 2009 tarihli 77598 sayılı fetva) bu yorumun açık olmadığını çünkü ayette bahsedilen inkârın orada sona eren bir amacı olduğunu, yani dinlerini takip etmeyi amaçladığını yanıtladı. Ayet, Yahudiler veya Hristiyanlar dinlerini takip etseniz bile onları memnun etmeyecek ve memnun etmeyecek, aksine dinlerini takip edene kadar bunu söylemiş oldu. Allah'tan Kitabını iyi anlamasını ve konuşma ile eylemde sapma ve hatadan kaçınmasını istedi."
  id: "Seorang penanya ditanya tentang penafsiran mereka yang bergantung pada agama terkait ayat 'Orang Yahudi atau Kristen tidak akan senang dengan Anda sampai Anda mengikuti agama mereka,' yang berarti jika kita menganggap Anda mengikuti mereka, mereka tidak akan puas. Dr. Salah Al-Sawy menjawab (Fatwa No. 77598 tanggal 27 Januari 2009) bahwa penafsiran ini tidak jelas karena penolakan yang disebutkan dalam ayat tersebut memiliki tujuan yang berakhir di sana, yaitu mengikuti agama mereka. Ayat tersebut tidak mengatakan dan tidak akan menyenangkan orang Yahudi atau Kristen meskipun Anda mengikuti agama mereka, melainkan mengatakannya sampai Anda mengikuti agama mereka. Ia memohon kepada Allah agar memberikan pemahaman yang baik tentang Kitab-Nya dan menghindari penyimpangan serta kesalahan dalam ucapan dan tindakan."
