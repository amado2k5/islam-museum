id: work/fatwa-amja-asking-by-gods-face
class: work
kind: fatwa
label: { ar: "السؤال بوجه الله", en: "Asking 'by God's face' — the hadith and its meanings", ur: "«اللہ کے وجہ کے واسطے سے» مانگنا", es: "Pedir \"por Dios\" — el hadiz y su significado" }
summary:
  ar: "سأل سائل عن السؤال بالله عز وجل وحول الإعطاء لله ورسوله من حيث التوحيد والشرك. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21862 بتاريخ 6 أغسطس 2007)⁩ أنه ورد أنه لا يسأل بوجه الله إلا الجنة وقد ضعف المحدثون هذا الحديث وعلى فرض ثبوته اختلف أهل العلم في المراد منه على قولين: الأول أن المراد لا تسألوا أحدًا من المخلوقين بوجه الله فإن الخلق لا يقدرون على إعطاء الجنة فلا يسألون بوجه الله مطلقًا لكن من سئل بوجه الله فينبغي أن يجيب سائله، والثاني أن المراد لا تسألوا الله إلا الجنة فلا تسألوه بالدنيا وهي من الأعراض التافهة التي لا تليق بعظمة السؤال بالوجه."
  en: "A questioner asked about asking 'by God's face' and giving 'for God and His messenger' in light of tawhid and shirk. Dr. Salah al-Sawi (fatwa no. 21862, 6 August 2007) answered that 'none is asked by God's face but paradise' is reported though the hadith-scholars weakened it; supposing it stood, scholars differed on its meaning: first, that one should not ask creatures by God's face — they cannot give paradise — while whoever is asked by it should answer his asker; second, that God is not to be asked for anything but paradise, worldly trifles being unworthy of asking by the Face. The answer continues on giving for God and His messenger."
  ur: "ایک سائل نے «اللہ کے وجہ کے واسطے سے مانگنا» پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21862، 6 اگست 2007)⁩ کے مطابق حدیث ضعیف ہے مگر معنی پر دو قول ہیں — مخلوق سے اللہ کے واسطے نہ مانگو، یا اللہ سے جنت کے سوا نہ مانگو۔"
  es: "Un consultante preguntó acerca de pedir \"por Dios\" y dar \"por Dios y Su mensajero\" a la luz del tawhid y el shirk. El Dr. Salah al-Sawi (fatwa n.° 21862, 6 de agosto de 2007) respondió que \"a nadie se le pide por Dios sino el paraíso\" es algo que se ha reportado, aunque los eruditos del hadiz lo han debilitado; suponiendo que se mantuviera, los eruditos difieren en su significado: primero, que no se debe pedir a las criaturas por Dios —no pueden dar el paraíso— mientras que quien recibe la pregunta debe responder a quien pregunta; segundo, que a Dios no se le debe pedir nada más que el paraíso, siendo las nimiedades mundanas indignas de pedir por Su Rostro. La respuesta continúa con dar por Dios y Su mensajero."
