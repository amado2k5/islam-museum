id: work/fatwa-amja-asking-by-gods-face
class: work
kind: fatwa
label: { ar: "السؤال بوجه الله", en: "Asking 'by God's face' — the hadith and its meanings", ur: "«اللہ کے وجہ کے واسطے سے» مانگنا", es: "Pedir \"por Dios\" — el hadiz y su significado", fr: "Demander « par la face de Dieu » — le hadith et sa signification", tr: "Soru Tanrı'nın karşısında", id: "Pertanyaannya ada di hadapan Tuhan" }
summary:
  ar: "سأل سائل عن السؤال بالله عز وجل وحول الإعطاء لله ورسوله من حيث التوحيد والشرك. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21862 بتاريخ 6 أغسطس 2007)⁩ أنه ورد أنه لا يسأل بوجه الله إلا الجنة وقد ضعف المحدثون هذا الحديث وعلى فرض ثبوته اختلف أهل العلم في المراد منه على قولين: الأول أن المراد لا تسألوا أحدًا من المخلوقين بوجه الله فإن الخلق لا يقدرون على إعطاء الجنة فلا يسألون بوجه الله مطلقًا لكن من سئل بوجه الله فينبغي أن يجيب سائله، والثاني أن المراد لا تسألوا الله إلا الجنة فلا تسألوه بالدنيا وهي من الأعراض التافهة التي لا تليق بعظمة السؤال بالوجه."
  en: "A questioner asked about asking 'by God's face' and giving 'for God and His messenger' in light of tawhid and shirk. Dr. Salah al-Sawi (fatwa no. 21862, 6 August 2007) answered that 'none is asked by God's face but paradise' is reported though the hadith-scholars weakened it; supposing it stood, scholars differed on its meaning: first, that one should not ask creatures by God's face — they cannot give paradise — while whoever is asked by it should answer his asker; second, that God is not to be asked for anything but paradise, worldly trifles being unworthy of asking by the Face. The answer continues on giving for God and His messenger."
  ur: "ایک سائل نے «اللہ کے وجہ کے واسطے سے مانگنا» پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21862، 6 اگست 2007)⁩ کے مطابق حدیث ضعیف ہے مگر معنی پر دو قول ہیں — مخلوق سے اللہ کے واسطے نہ مانگو، یا اللہ سے جنت کے سوا نہ مانگو۔"
  es: "Un consultante preguntó acerca de pedir \"por Dios\" y dar \"por Dios y Su mensajero\" a la luz del tawhid y el shirk. El Dr. Salah al-Sawi (fatwa n.° 21862, 6 de agosto de 2007) respondió que \"a nadie se le pide por Dios sino el paraíso\" es algo que se ha reportado, aunque los eruditos del hadiz lo han debilitado; suponiendo que se mantuviera, los eruditos difieren en su significado: primero, que no se debe pedir a las criaturas por Dios —no pueden dar el paraíso— mientras que quien recibe la pregunta debe responder a quien pregunta; segundo, que a Dios no se le debe pedir nada más que el paraíso, siendo las nimiedades mundanas indignas de pedir por Su Rostro. La respuesta continúa con dar por Dios y Su mensajero."
  fr: "Un internaute a posé une question sur l'invocation « par la face de Dieu » et l'offrande « pour Dieu et Son Messager » au regard du tawhid et du shirk. Le Dr Salah al-Sawi (fatwa n° 21862, 6 août 2007) a répondu que le hadith « nul n'est demandé par la face de Dieu, si ce n'est le paradis », bien que les spécialistes l'aient nuancé. À supposer qu'il soit maintenu, les savants ont divergé sur son interprétation: premièrement, il ne faut pas s'adresser aux créatures par la face de Dieu – elles ne peuvent accorder le paradis – et celui à qui l'on s'adresse ainsi doit répondre à celui qui le demande; deuxièmement, il ne faut rien demander à Dieu, si ce n'est le paradis, les futilités terrestres étant indignes d'une invocation par Sa face. La réponse aborde ensuite la question de l'offrande pour Dieu et Son Messager."
  tr: "Bir soruya Allah'tan ve Allah'a ve O'nun Elçisine tek tanrılık ve çürktelik açısından verme hakkında soru soruldu. Dr. Salah Al-Sawy (6 Ağustos 2007 tarihli 21862 No. fetva) yalnızca cennetin Allah'ın önünde sorulduğu bildirildiğini yanıtladı. Hadis âlimleri bu hadisi zayıflatmış ve doğruluğunu varsayan alimler bunun ne anlama geldiği konusunda iki görüşte farklılık göstermektedir: Birincisi, Allah uğruna yaratılmış kimseye Cennet veremeyeceği ve Allah'ın yüzü istenmediğidir. Ama Allah uğruna sorulan kişiye sorusuna cevap vermelidir. İkincisi ise, amaçlanan anlam 'Allah'tan sadece cennet dile, o zaman bu dünyada da O'nu isteme, ki bu yüzle dilemenin büyüklüğüne yakışmayan önemsiz bir onurdur.'"
  id: "Seorang penanya ditanya tentang menanyakan tentang Allah Yang Maha Kuasa dan tentang memberikan kepada Allah dan Rasul-Nya dalam istilah monoteisme dan politeisme. Dr. Salah Al-Sawy menjawab (Fatwa No. 21862 tanggal 6 Agustus 2007) bahwa dilaporkan hanya surga yang diminta di hadapan Allah. Para ulama hadis telah melemahkan hadis ini, dan dengan asumsi keasliannya, para ulama berbeda pendapat tentang maknanya dalam dua pendapat: Yang pertama adalah bahwa Anda tidak boleh meminta siapa pun yang diciptakan demi Allah, karena ciptaan tidak mampu memberikan surga dan sama sekali tidak diminta untuk wajah Allah. Namun siapa pun yang diminta demi Allah harus menjawab pertanyaannya. Yang kedua adalah makna yang dimaksudkan adalah 'Jangan bertanya kepada Allah kecuali Surga, maka jangan bertanya kepada-Nya di dunia ini, yang merupakan salah satu kehormatan sepele yang tidak pantas dengan kebesaran bertanya dengan wajah.'"
