id: work/fatwa-amja-cannot-ghusl-sickness
class: work
kind: fatwa
label: { ar: "لا يستطيع الاغتسال لمرض", en: "Too ill to wash on waking in ihtilam — tayammum, then pray", ur: "بیماری سے غسل نہ ہو — تیمم", es: "Demasiado enfermo para lavarse al despertar en ihtilam — tayammum, luego orar", fr: "Trop malade pour se laver au réveil à l'ihtilam — tayammum, alors priez", tr: "Hastalık yüzünden yıkanamıyor", id: "Dia tidak bisa mandi karena sakit" }
summary:
  ar: "سأل شاب أنه لا يستطيع فعل الغسل عند استيقاظه مستحلمًا لمرض. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21951 بتاريخ 13 يوليو 2007)⁩ أنه إن كان الوضع كما ذكر من غلبة تحقق ضرر عليه باغتساله فيجوز له أن يتيمم ويصلي مع الجماعة لحين الاغتسال في وقت مناسب قريب لرفع جنابته مع الأخذ بأسباب العلاج وسؤال أهل الذكر على ما فصّل الجواب."
  en: "A man of twenty-four could not manage the washing on waking in ihtilam for illness. Dr. Salah al-Sawi (fatwa no. 21951, 13 July 2007) answered that if the matter is as he described — harm to him prevailing in likelihood on washing — he may do tayammum and pray with the congregation until he washes at a near suitable time to lift his janaba, taking the means of treatment and asking people of knowledge — as the answer details."
  ur: "بیماری میں غسل نہ ہو سکے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21951، 13 جولائی 2007)⁩ کے مطابق تیمم کر نماز پڑھے پھر جلد غسل — علاج بھی کرے۔"
  es: "Un hombre de veinticuatro años no pudo realizar la ablución al despertar en estado de ihtilam debido a una enfermedad. El Dr. Salah al-Sawi (fatwa n.° 21951, 13 de julio de 2007) respondió que si el asunto es como lo describió —es probable que le cause daño al ablución— puede realizar el tayammum y orar con la congregación hasta que se ablucione en un momento adecuado para levantar su janaba, tomando los medios de tratamiento y consultando a personas de conocimiento, como se detalla en la respuesta."
  fr: "Un homme de vingt-quatre ans, malade et incapable de se laver le matin après son réveil, a reçu la réponse du Dr Salah al-Sawi (fatwa n° 21951, 13 juillet 2007). Dans ce cas, il est probable qu'il risque de se blesser en se lavant. Il peut alors accomplir le tayammum et prier en congrégation jusqu'à ce qu'il puisse se laver à un moment plus propice pour lever sa janaba, en prenant les soins nécessaires et en consultant des savants, comme le précise la réponse."
  tr: "Genç bir adama, hastalık nedeniyle uyandığında ghusl yapamayacağı soruldu. Dr. Salah Al-Sawy (13 Temmuz 2007 tarihli 21951 No. Fetva) şöyle yanıt verdi: Eğer belirtildiği gibi, durum onu yıkayarak ona esas olarak zarar veriyorsa, cemaatle birlikte tayammum yapabileceğini ve uygun bir zamanda gusl yapılana kadar cemaatle birlikte namaz kılabileceğini, tedavi nedenlerini dikkate alarak ve alimlere ayrıntılı cevabı soracağını belirtti."
  id: "Seorang pemuda ditanya apakah ia tidak dapat melakukan ghusl saat bangun karena sakit. Dr. Salah Al-Sawy menjawab (Fatwa No. 21951 tanggal 13 Juli 2007) bahwa jika, seperti yang disebutkan, situasinya terutama merugikan dirinya dengan mencucinya, maka ia boleh melakukan tayammum dan berdoa bersama jemaat sampai ghusl dilakukan pada waktu yang tepat untuk segera melepas janabahnya, dengan mempertimbangkan alasan pengobatan dan menanyakan jawaban rinci kepada para cendekiawan."
