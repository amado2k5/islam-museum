id: work/ghazawat-el-nabi
class: work
kind: lecture-series
label:
  ar: "غزوات النبي"
  en: "The Prophet's campaigns (al-ghazawat)"
  ur: "غزوات النبی ⁦(غزوات النبی)⁩"
  es: "Las campañas del Profeta (al-ghazawat)"
  fr: "Les campagnes du Prophète (al-ghazawat)"
  tr: "Peygamber'in Savaşları"
  id: "Pertempuran Nabi"
summary:
  ar: "سلسلة من ثماني حلقات لـوجدي غنيم يحفظها أرشيف أسابيل باسم «غزوات النبي»؛ تغطي الحلقات الثماني كلها غزوة بدر ووقائعها ودروسها، ثم صلح الحديبية وشروطه وعمرة القضاء، ثم غزوة الأحزاب أو الخندق ومصائر يهود المدينة الثلاثة وحكم سعد بن معاذ في بني قريظة، ثم غزوة خيبر وحصار حصونها ومصائر غنائمها، ثم غزوة تبوك آخر الحملات وسببها وتمويلها وتخلف الثلاثة عن الغزوة ومسجد الضرار، ثم غزوة حنين وكرّها وفرارها ثم ردّ الله عليهم، وأخيرًا فتح مكة وسرايا ما قبل الفتح."
  en: "An eight-episode series by Wagdy Ghoneim kept in the Assabile archive as 'Ghuzat al-Nabi' (the Prophet's campaigns); all eight episodes treat the Battle of Badr and its events and lessons, the Treaty of Hudaybiyya and its terms and the compensating pilgrimage, the Battle of the Confederates or the Trench with the fates of Medina's three Jewish tribes and Sa'd ibn Mu'adh's judgment over Banu Qurayza, the campaign of Khaybar with its sieges and the division of its spoils, the campaign of Tabuk — the last campaign — its cause and financing, the three who stayed behind, and the mosque of al-Dirar, the battle of Hunayn and the rout followed by God's turning of the tide, and finally the conquest of Mecca and the raiding parties before it."
  ur: "وجدی غنیم کا آٹھ اقساط کا سلسلہ جو اسابیل آرکائیو میں «غزوات النبی» کے نام سے محفوظ ہے؛ آٹھوں اقساط غزوہ بدر کے واقعات اور اسباق، صلح حدیبیہ اور اس کے شرائط اور قضاء کی عمرہ، غزوہ احزاب یا خندق اور مدینہ کے تین یہودی قبیلوں کے انجام اور بنو قریظہ میں سعد بن معاذ کا فیصلہ، غزوہ خیبر اور اس کے قلعوں کا محاصرہ اور غنیمت کی تقسیم، آخری غزوہ تابک اس کی وجہ اور مالی اعانت اور پیچھے رہ جانے والے تینوں اور مسجد ضرار، غزوہ حنین کا بھاگنا اور اللہ کی مدد، اور آخر میں فتح مکہ اور فتح سے پہلے کی سرايا بیان کرتی ہیں۔"
  es: "Una serie de ocho episodios de Wagdy Ghoneim, conservada en el archivo de Assabile como 'Ghuzat al-Nabi' (las campañas del Profeta); los ocho episodios tratan sobre la Batalla de Badr y sus acontecimientos y lecciones, el Tratado de Hudaybiyya y sus términos y la peregrinación compensatoria, la Batalla de los Confederados o la Trinchera con el destino de las tres tribus judías de Medina y el juicio de Sa'd ibn Mu'adh sobre Banu Qurayza, la campaña de Khaybar con sus asedios y el reparto de su botín, la campaña de Tabuk —la última campaña— su causa y financiación, los tres que se quedaron atrás y la mezquita de al-Dirar, la batalla de Hunayn y la derrota seguida por el cambio de rumbo de Dios, y finalmente la conquista de La Meca y las incursiones previas."
  fr: "Une série en huit épisodes de Wagdy Ghoneim conservée dans les archives d'Assabile sous le titre « Ghuzat al-Nabi » (les campagnes du Prophète); les huit épisodes traitent de la bataille de Badr et de ses événements et enseignements, du traité de Hudaybiyya et de ses conditions ainsi que du pèlerinage compensatoire, de la bataille des Confédérés ou du Fossé avec le sort des trois tribus juives de Médine et le jugement de Sa'd ibn Mu'adh sur les Banu Qurayza, de la campagne de Khaybar avec ses sièges et le partage de son butin, de la campagne de Tabuk — la dernière campagne — sa cause et son financement, les trois qui sont restés sur place et la mosquée d'al-Dirar, de la bataille de Hunayn et de la déroute suivie du renversement de situation par Dieu, et enfin de la conquête de La Mecque et des groupes de pillards qui l'ont précédée."
  tr: "Wajdi Ghunaym'ın sekiz bölümlük serisi, 'Peygamberin Savaşları' adıyla Asabil arşivinde saklanmaktadır; sekiz bölümün tamamı Badr Muharebesi'ni, olaylarını ve derslerini, ardından Hudeybiye Antlaşması'nı ve koşullarını, yargı Umresi'ni, ardından Konfederasyon Savaşı veya Siper Savaşı'nı, Medine'deki üç Yahudi'nin akıbetini, Sa'd ibn Muadh'ın Banu Kureyze üzerindeki yönetimini, ardından Haybar Savaşı'nı ve kalelerinin kuşatmasını ve ganimetlerinin akıbetini, ardından Tabuk Savaşı'nı, son seferi, nedenini ve finansmanını, üçünün savaşa katılamamasını ve El-Darar Camii'ni, ardından Hunayn ve Kerke Muharebesi'ni ve Tanrı'nın onlara dönene kadar kaçışını, son olarak Mekke'nin fethi ve fetih öncesi seferleri."
  id: "Serangkaian delapan episode oleh Wajdi Ghunaym yang disimpan di arsip Asabil dengan nama 'Pertempuran Nabi'; semua delapan episode mencakup Pertempuran Badr, peristiwa-peristiwa di dalamnya, dan pelajarannya, lalu Perjanjian Hudaybiyyah dan syarat-syaratnya, Umrah peradilan, kemudian Pertempuran Konfederasi atau Parit, nasib tiga Yahudi Madinah, dan pemerintahan Sa'd ibn Muadh atas Banu Qurayza, kemudian Pertempuran Khaybar dan pengepungan benteng-bentengnya serta nasib rampasan mereka, kemudian Pertempuran Tabuk, kampanye terakhir, penyebabnya, pendanaannya dan kegagalan ketiganya untuk berpartisipasi dalam pertempuran dan Masjid Al-Darar, kemudian Pertempuran Hunayn dan Kirkah serta pelariannya sampai Tuhan kembali kepada mereka, dan akhirnya penaklukan Mekah dan ekspedisi sebelum penaklukan."
