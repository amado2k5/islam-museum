id: work/ahmed-el-sayed-seerah-lilmuslihin-ep16
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 16: المؤاخاة وبناء المسجد والمجتمع المدني"
  en: "The Prophetic Biography for Reformers, episode 16: Brotherhood, the Building of the Mosque and the Medinan Society"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 16: مؤاخات، مسجد کی تعمیر اور مدنی معاشرہ"
  fr: "La biographie prophétique pour les réformateurs, épisode 16 : La fraternisation, la construction de la mosquée et la société médinoise"
  es: "La biografía profética para los reformadores, episodio 16: La hermandad, la construcción de la mezquita y la sociedad medinense"
summary:
  ar: "يتابع المحاضر وصول النبي إلى المدينة: انتظار أهلها له، والإقامة في قباء، وشراء الموضع وبناء المسجد النبوي، وبدء الأذان، وحمى المدينة، والمؤاخاة بين المهاجرين والأنصار. ويختم بتكوين المجتمع المدني وعهد النبي مع اليهود وتحويل القبلة كما تعالجه سورة البقرة."
  en: "The lecturer follows the Prophet's arrival in Medina: the waiting of the Medinans, the stay at Quba, the purchase of the site and the building of the Prophet's Mosque, the beginning of the call to prayer, the fever of Medina, and the brotherhood between the Emigrants and the Helpers. He closes with the make-up of Medinan society, the Prophet's treaty with the Jews, and the change of the prayer direction as it is treated in Surat al-Baqara."
  ur: "مقرر نبی کی مدینہ آمد کا ذکر کرتے ہیں: اہلِ مدینہ کا انتظار، قبا میں قیام، جگہ کی خرید اور مسجد نبوی کی تعمیر، اذان کا آغاز، مدینہ کا بخار، اور مہاجرین و انصار کے درمیان مؤاخات۔ آخر میں وہ مدنی معاشرے کی ساخت، نبی کے یہودیوں سے معاہدے اور سورۃ البقرہ میں بیان ہونے والی تحویلِ قبلہ پر بات کرتے ہیں۔"
  fr: "Le conférencier suit l'arrivée du Prophète à Médine : l'attente des Médinois, le séjour à Quba, l'achat du terrain et la construction de la mosquée du Prophète, les débuts de l'appel à la prière, la fièvre de Médine et la fraternisation entre les Émigrés et les Auxiliaires. Il termine par la composition de la société médinoise, le traité du Prophète avec les Juifs et le changement de direction de la prière tel que le traite la sourate al-Baqara."
  es: "El conferenciante sigue la llegada del Profeta a Medina: la espera de los medinenses, la estancia en Quba, la compra del terreno y la construcción de la mezquita del Profeta, el comienzo de la llamada a la oración, la fiebre de Medina y la hermandad entre los Emigrados y los Auxiliares. Termina con la composición de la sociedad medinense, el tratado del Profeta con los judíos y el cambio de la dirección de la oración tal como lo trata la sura al-Baqara."
