id: work/fatwa-aliftaa-jo-buying-unripe-grapes-for-vine-leaves
class: work
kind: fatwa
label: { ar: "بيع العنب قبل نضجه للحصول على ورق الدوالي", en: "Buying grapes before they ripen to get the vine leaves", ur: "انگور کے پتوں کے لیے پکنے سے پہلے انگور خریدنا", es: "Comprar uvas antes de que maduren para obtener las hojas de la vid.", fr: "Acheter des raisins avant leur maturité pour obtenir les feuilles de vigne", tr: "Varis olmak için olgunlaşmadan önce üzüm satın.", id: "Jual anggur sebelum matang untuk mendapatkan varises" }
summary:
  ar: "سؤال عن شراء العنب قبل بدو صلاحه أو قبل تخلقه بقصد الحصول على ورق الدوالي، أجابت فيه دائرة الإفتاء العام الأردنية بأن بيع الثمر قبل نضجه يصح بشرط القطع والانتفاع، ولا يصح قبل تخلقه، ولا يدخل الورق في البيع إلا بالنص عليه. أجابت الدائرة بأن بيع الثمار على الشجر قبل نضجها لا يصح إلا بشرط قطعها في الحال وأن يكون فيها نفع، ونقلت ذلك عن الخطيب الشربيني في الإقناع، وأن بيع الثمر قبل تخلقه لا يصح مطلقًا لأنه بيع معدوم وغرر، ونقلت ذلك عن النووي في المجموع. وقالت إن المشتري إذا صح بيعه لا يملك إلا الثمر، فلا ينتفع بالورق ولا الأغصان إلا إذا شملها العقد، ويجوز أن يشتري الثمر والورق معًا. وقالت إن الورق المنتفع به كالثمر، لا يُباع إلا بعد صلاحه أو قبله بشرط القطع والانتفاع، واستشهدت بأقوال الشربيني والروياني وزكريا الأنصاري في ورق التوت، وبأن ورق العنب ينتفع به عرفًا كورق التوت. وخلصت إلى جواز بيع العنب قبل نضجه بشرط قطعه، ويسمى حينئذ حصرمًا، وعدم جواز الانتفاع بورقه تبعًا إلا إذا عُقد عليهما معًا، وجواز بيع الورق وحده مع مراعاة ضابط صلاحه بتفتحه أو شرط قطعه."
  en: "A question on buying grapes before they ripen, or before they have formed, in order to get the vine leaves, in which Jordan's General Iftaa Department answered that selling unripe fruit is valid on condition of cutting it and its being usable, invalid before it forms, and that the leaves are not included unless the contract names them. The Department answered that selling fruit on the tree before it ripens is valid only on condition that it is cut at once and has some use, quoting al-Khatib al-Shirbini's al-Iqna', and that selling fruit before it has formed is never valid, being the sale of something non-existent and uncertain, quoting al-Nawawi's al-Majmu'. It said that where such a sale is valid the buyer owns only the fruit and may not take the leaves or branches unless the contract covers them, though he may buy fruit and leaves together. It said usable leaves are like fruit, sold only once ripe or before that on condition of cutting and usability, citing al-Shirbini, al-Ruyani and Zakariyya al-Ansari on mulberry leaves, and noting that vine leaves are customarily used just as mulberry leaves are. It concluded that unripe grapes (hisrim) may be sold on condition of cutting, that their leaves may not be taken along with them unless both are contracted for, and that the leaves may be sold alone, observing the rule of ripeness, their unfolding, or a condition of cutting."
  ur: "انگور کے پتوں کے حصول کے لیے انگور پکنے یا بننے سے پہلے خریدنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کچا پھل کاٹنے اور قابلِ استعمال ہونے کی شرط پر بیچنا درست ہے، بننے سے پہلے درست نہیں، اور پتے سودے میں شامل نہیں جب تک عقد میں ان کا ذکر نہ ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ درخت پر پکنے سے پہلے پھل بیچنا صرف اس شرط پر درست ہے کہ اسے فوراً کاٹا جائے اور اس میں کوئی فائدہ ہو، اور یہ خطیب شربینی کی الاقناع سے نقل کیا، اور بننے سے پہلے پھل بیچنا کبھی درست نہیں کیونکہ یہ معدوم اور غرر کی بیع ہے، اور یہ نووی کی المجموع سے نقل کیا۔ اس نے کہا کہ جہاں ایسی بیع درست ہو وہاں خریدار صرف پھل کا مالک ہوتا ہے اور پتے یا شاخیں نہیں لے سکتا جب تک عقد میں شامل نہ ہوں، البتہ پھل اور پتے اکٹھے خرید سکتا ہے۔ اس نے کہا کہ قابلِ استعمال پتے پھل کی طرح ہیں، صرف پکنے کے بعد یا اس سے پہلے کاٹنے اور قابلِ استعمال ہونے کی شرط پر بیچے جائیں، اور شہتوت کے پتوں کے بارے میں شربینی، رویانی اور زکریا الانصاری کے اقوال سے استدلال کیا، اور کہا کہ انگور کے پتے عرف میں شہتوت کے پتوں کی طرح استعمال ہوتے ہیں۔ اس نے نتیجہ نکالا کہ کچے انگور ⁦(حصرم)⁩ کاٹنے کی شرط پر بیچے جا سکتے ہیں، ان کے پتے ساتھ نہیں لیے جا سکتے جب تک دونوں پر عقد نہ ہو، اور پتے اکیلے بیچے جا سکتے ہیں، ان کے پکنے یعنی کھلنے کے ضابطے یا کاٹنے کی شرط کے ساتھ۔"
  es: "Una pregunta sobre la compra de uvas antes de que maduren o se formen, con el fin de obtener las hojas de la vid, a la que el Departamento General de Iftaa de Jordania respondió que la venta de fruta inmadura es válida con la condición de que se corte y sea utilizable, pero inválida antes de que se forme, y que las hojas no se incluyen a menos que el contrato las mencione. El Departamento respondió que la venta de fruta en el árbol antes de que madure es válida solo con la condición de que se corte de inmediato y tenga algún uso, citando al-Iqna' de al-Khatib al-Shirbini, y que la venta de fruta antes de que se forme nunca es válida, ya que se trata de la venta de algo inexistente e incierto, citando al-Majmu' de al-Nawawi. Dijo que cuando dicha venta es válida, el comprador solo posee la fruta y no puede llevarse las hojas o ramas a menos que el contrato las incluya, aunque puede comprar fruta y hojas juntas. Afirmó que las hojas utilizables son como la fruta, vendidas solo una vez maduras o antes, con la condición de que estén cortadas y sean utilizables, citando a al-Shirbini, al-Ruyani y Zakariyya al-Ansari sobre las hojas de morera, y señalando que las hojas de vid se utilizan habitualmente igual que las de morera. Concluyó que las uvas verdes (hisrim) pueden venderse con la condición de que estén cortadas, que sus hojas no pueden llevarse junto con ellas a menos que se contrate el producto completo, y que las hojas pueden venderse solas, observando la regla de la madurez, su despliegue o la condición de que estén cortadas."
  fr: "Concernant la question de l'achat de raisins avant maturité, ou avant leur formation, afin d'obtenir les feuilles de vigne, le Département général de la jurisprudence jordanienne (Iftaa) a répondu que la vente de fruits verts est valable à condition qu'ils soient cueillis et consommables, mais nulle avant leur formation. Les feuilles ne sont pas incluses dans la vente, sauf mention contraire dans le contrat. Le Département a précisé que la vente de fruits sur l'arbre avant maturité n'est valable que si les fruits sont cueillis immédiatement et sont utilisables, citant l'ouvrage « al-Iqna' » d'al-Khatib al-Shirbini. Il a également indiqué que la vente de fruits avant leur formation est toujours nulle, car il s'agit de la vente d'un bien inexistant et incertain, citant l'ouvrage « al-Majmu' » d'al-Nawawi. Enfin, il a ajouté que, dans le cas d'une vente valable, l'acheteur n'acquiert que la propriété des fruits et ne peut emporter les feuilles ou les branches, sauf si le contrat le prévoit, bien qu'il puisse acheter les fruits et les feuilles ensemble. Il y est indiqué que les feuilles utilisables sont comme des fruits, vendues uniquement à maturité ou avant, sous réserve de leur coupe et de leur aptitude à l'usage. L'ouvrage cite al-Shirbini, al-Ruyani et Zakariyya al-Ansari à propos des feuilles de mûrier et note que les feuilles de vigne sont couramment utilisées de la même manière. Il conclut que les raisins verts (hisrim) peuvent être vendus sous réserve de leur coupe, que leurs feuilles ne peuvent être vendues avec les raisins sauf si les deux sont prévus dans un contrat, et que les feuilles peuvent être vendues seules, en respectant les règles de maturité, de leur déploiement ou de la coupe."
  tr: "Üzümlerin olgunlaşmadan önce veya olgunlaşmadan önce varis yaprakları elde etmek amacıyla satın alınmasıyla ilgili bir soruya gelince, Ürdün Genel Fetva Dairesi, meyvenin olgunlaşmadan önce satışının geçerli olduğunu, ancak olgunlaşmadan önce yapılmadığını, yaprakların ise açıkça belirtilmedikçe satışa dahil edilmediğini yanıtladı. Daire, meyvelerin olgunlaşmadan önce ağaçlarda satılmasının ancak hemen kesilip faydalı olması halinde geçerli olduğunu belirtti. Al-Iqna'da Al-Khatib Al-Sharbini'yi alıntıladı ve meyve tam olarak üretilmeden önce satılmasının geçerli olmadığını, çünkü bunun bir satış olmadığını ve gharar olarak kabul edildiğini belirtti. Al-Nawawi'yi özetle aktardı. Alıcı doğru şekilde satarsa, sadece meyveye sahip olduğunu, bu yüzden yapraklar veya dallar sözleşme kapsamında değilse fayda sağlamaz ve hem meyve hem de yaprak satın alınmasının izin verildiğini belirtti. Faydalı yaprakların meyve gibi olduğunu ve ancak olgunlaştıktan sonra veya olgunlaşmadan önce satılamayacağını, ancak kesilip kullanıldığını söyledi. Al-Sharbini, Al-Ruyani ve Zakariya Al-Ansari'nin dut yaprakları hakkındaki açıklamalarını ve üzüm yapraklarının dut yaprakları gibi geleneksel olarak faydalı olduğunu belirtti. Üzümlerin olgunlaşmadan önce satılmasının mümkün olduğunu, ancak kesilmeleri gerektiğini belirtti; buna münhasırlık denir, yapraklarından faydalanmanın ise birlikte sözleşme yapılmadıkça izin verilmediğini, yaprakların sadece satılmasının ise geçerli veya kesildiği sürece kesim şartı olduğu sürece izin verilebilir olduğunu belirtti."
  id: "Sebuah pertanyaan tentang membeli anggur sebelum matang atau sebelum mulai matang dengan tujuan mendapatkan daun varises, Departemen Fatwa Umum Yordania menjawab bahwa menjual buah sebelum matang sah asalkan buah tersebut dipotong dan bermanfaat, tetapi tidak sebelum matang, dan daun tidak termasuk dalam penjualan kecuali dinyatakan secara eksplisit. Departemen menjawab bahwa menjual buah di pohon sebelum matang hanya sah jika buah tersebut dipotong segera dan bermanfaat. Departemen mengutip Al-Khatib Al-Sharbini dalam Al-Iqna' dan bahwa menjual buah sebelum benar-benar diproduksi tidak sah karena itu adalah penjualan yang tidak ada dan dianggap sebagai gharar. Departemen tersebut mengutip Al-Nawawi secara ringkas. Departemen tersebut menyatakan bahwa jika pembeli menjual dengan benar, dia hanya memiliki buah, sehingga daun maupun cabang tidak mendapat manfaat kecuali tercakup dalam kontrak, dan diperbolehkan membeli buah dan daun. Ia mengatakan bahwa daun yang bermanfaat itu seperti buah dan tidak dapat dijual kecuali setelah matang atau sebelum daun, asalkan dipotong dan digunakan. Ia mengutip pernyataan Al-Sharbini, Al-Ruyani, dan Zakariya Al-Ansari mengenai daun murbei, dan bahwa daun anggur biasanya bermanfaat seperti daun murbei. Ia menyimpulkan bahwa diperbolehkan menjual anggur sebelum matang, asalkan dipotong, yang disebut eksklusivitas, dan tidak diperbolehkan memanfaatkan daun anggur kecuali dikontrak bersama, dan bahwa menjual daun saja diperbolehkan asalkan masa berlakunya dibuka atau dipotong sebagai syarat pemotongan."
