id: work/fatwa-aliftaa-jo-buying-unripe-grapes-for-vine-leaves
class: work
kind: fatwa
label: { ar: "بيع العنب قبل نضجه للحصول على ورق الدوالي", en: "Buying grapes before they ripen to get the vine leaves", ur: "انگور کے پتوں کے لیے پکنے سے پہلے انگور خریدنا" }
summary:
  ar: "سؤال عن شراء العنب قبل بدو صلاحه أو قبل تخلقه بقصد الحصول على ورق الدوالي، أجابت فيه دائرة الإفتاء العام الأردنية بأن بيع الثمر قبل نضجه يصح بشرط القطع والانتفاع، ولا يصح قبل تخلقه، ولا يدخل الورق في البيع إلا بالنص عليه. أجابت الدائرة بأن بيع الثمار على الشجر قبل نضجها لا يصح إلا بشرط قطعها في الحال وأن يكون فيها نفع، ونقلت ذلك عن الخطيب الشربيني في الإقناع، وأن بيع الثمر قبل تخلقه لا يصح مطلقًا لأنه بيع معدوم وغرر، ونقلت ذلك عن النووي في المجموع. وقالت إن المشتري إذا صح بيعه لا يملك إلا الثمر، فلا ينتفع بالورق ولا الأغصان إلا إذا شملها العقد، ويجوز أن يشتري الثمر والورق معًا. وقالت إن الورق المنتفع به كالثمر، لا يُباع إلا بعد صلاحه أو قبله بشرط القطع والانتفاع، واستشهدت بأقوال الشربيني والروياني وزكريا الأنصاري في ورق التوت، وبأن ورق العنب ينتفع به عرفًا كورق التوت. وخلصت إلى جواز بيع العنب قبل نضجه بشرط قطعه، ويسمى حينئذ حصرمًا، وعدم جواز الانتفاع بورقه تبعًا إلا إذا عُقد عليهما معًا، وجواز بيع الورق وحده مع مراعاة ضابط صلاحه بتفتحه أو شرط قطعه."
  en: "A question on buying grapes before they ripen, or before they have formed, in order to get the vine leaves, in which Jordan's General Iftaa Department answered that selling unripe fruit is valid on condition of cutting it and its being usable, invalid before it forms, and that the leaves are not included unless the contract names them. The Department answered that selling fruit on the tree before it ripens is valid only on condition that it is cut at once and has some use, quoting al-Khatib al-Shirbini's al-Iqna', and that selling fruit before it has formed is never valid, being the sale of something non-existent and uncertain, quoting al-Nawawi's al-Majmu'. It said that where such a sale is valid the buyer owns only the fruit and may not take the leaves or branches unless the contract covers them, though he may buy fruit and leaves together. It said usable leaves are like fruit, sold only once ripe or before that on condition of cutting and usability, citing al-Shirbini, al-Ruyani and Zakariyya al-Ansari on mulberry leaves, and noting that vine leaves are customarily used just as mulberry leaves are. It concluded that unripe grapes (hisrim) may be sold on condition of cutting, that their leaves may not be taken along with them unless both are contracted for, and that the leaves may be sold alone, observing the rule of ripeness, their unfolding, or a condition of cutting."
  ur: "انگور کے پتوں کے حصول کے لیے انگور پکنے یا بننے سے پہلے خریدنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کچا پھل کاٹنے اور قابلِ استعمال ہونے کی شرط پر بیچنا درست ہے، بننے سے پہلے درست نہیں، اور پتے سودے میں شامل نہیں جب تک عقد میں ان کا ذکر نہ ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ درخت پر پکنے سے پہلے پھل بیچنا صرف اس شرط پر درست ہے کہ اسے فوراً کاٹا جائے اور اس میں کوئی فائدہ ہو، اور یہ خطیب شربینی کی الاقناع سے نقل کیا، اور بننے سے پہلے پھل بیچنا کبھی درست نہیں کیونکہ یہ معدوم اور غرر کی بیع ہے، اور یہ نووی کی المجموع سے نقل کیا۔ اس نے کہا کہ جہاں ایسی بیع درست ہو وہاں خریدار صرف پھل کا مالک ہوتا ہے اور پتے یا شاخیں نہیں لے سکتا جب تک عقد میں شامل نہ ہوں، البتہ پھل اور پتے اکٹھے خرید سکتا ہے۔ اس نے کہا کہ قابلِ استعمال پتے پھل کی طرح ہیں، صرف پکنے کے بعد یا اس سے پہلے کاٹنے اور قابلِ استعمال ہونے کی شرط پر بیچے جائیں، اور شہتوت کے پتوں کے بارے میں شربینی، رویانی اور زکریا الانصاری کے اقوال سے استدلال کیا، اور کہا کہ انگور کے پتے عرف میں شہتوت کے پتوں کی طرح استعمال ہوتے ہیں۔ اس نے نتیجہ نکالا کہ کچے انگور (حصرم) کاٹنے کی شرط پر بیچے جا سکتے ہیں، ان کے پتے ساتھ نہیں لیے جا سکتے جب تک دونوں پر عقد نہ ہو، اور پتے اکیلے بیچے جا سکتے ہیں، ان کے پکنے یعنی کھلنے کے ضابطے یا کاٹنے کی شرط کے ساتھ۔"
