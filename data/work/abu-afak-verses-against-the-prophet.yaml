summary:
  ar: "خمسة أبيات يوردها ابن إسحاق لأبي عفك: عاش دهراً فما رأى داراً ولا جمعاً أبرّ عهوداً من أولاد قيلة، يهدّ الجبال جمعهم ولم يخضعوا؛ فصدّعهم راكب جاءهم بحلال وحرام لشتى معاً؛ فلو أن بالعز صدّقوا أو الملك تابعوا تُبّعاً."
  en: "Five verses Ibn Ishaq gives to Abu Afak: he had lived an age and never seen a house or gathering truer to its pledges than the sons of Qayla, whose assembly could level mountains and never bowed; then a rider split them, bringing lawful and forbidden together; had they believed in might or followed a king, they would have followed Tubba'."
