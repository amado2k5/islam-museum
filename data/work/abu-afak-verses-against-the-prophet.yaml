label: { ar: "أبيات أبي عفك في الراكب الذي صدّع أولاد قيلة", en: "Abu Afak's verses on the rider who split the sons of Qayla", es: "Los versos de Abu Afak sobre el jinete que separó a los hijos de Qayla", fr: "Les vers d'Abu Afak sur le cavalier qui a séparé les fils de Qayla", ur: "قائلہ کے بیٹوں کو تقسیم کرنے والے سوار پر ابو آفاق کی آیات" }
summary:
  ar: "خمسة أبيات يوردها ابن إسحاق لأبي عفك: عاش دهراً فما رأى داراً ولا جمعاً أبرّ عهوداً من أولاد قيلة، يهدّ الجبال جمعهم ولم يخضعوا؛ فصدّعهم راكب جاءهم بحلال وحرام لشتى معاً؛ فلو أن بالعز صدّقوا أو الملك تابعوا تُبّعاً."
  en: "Five verses Ibn Ishaq gives to Abu Afak: he had lived an age and never seen a house or gathering truer to its pledges than the sons of Qayla, whose assembly could level mountains and never bowed; then a rider split them, bringing lawful and forbidden together; had they believed in might or followed a king, they would have followed Tubba'."
  es: "Cinco versículos que Ibn Ishaq le da a Abu Afak: había vivido una era y nunca había visto una casa o reunión más fiel a sus promesas que los hijos de Qayla, cuya asamblea podía aplanar montañas y nunca se inclinaba; entonces un jinete los separó, reuniendo a los lícitos y a los ilícitos; si hubieran creído en el poder o seguido a un rey, habrían seguido a Tubba'."
  fr: "Ibn Ishaq attribue cinq versets à Abu Afak: il avait vécu un siècle et n'avait jamais vu de maison ou de rassemblement plus fidèle à ses engagements que les fils de Qayla, dont l'assemblée pouvait aplanir des montagnes et ne s'inclinait jamais; puis un cavalier les sépara, réunissant le licite et l'illicite; s'ils avaient cru en la force ou suivi un roi, ils auraient suivi Tubba'."
  ur: "ابن اسحاق نے ابو عفق کو پانچ آیتیں دی ہیں: اس نے ایک عمر گزاری تھی اور اس نے کبھی کوئی گھر یا اپنے عہدوں پر قائلہ کے بیٹوں سے زیادہ سچا جمع ہوتے نہیں دیکھا، جس کی مجلس پہاڑوں کو برابر کر سکتی تھی اور کبھی جھکتی نہیں تھی۔ پھر ایک سوار نے حلال اور حرام کو اکٹھا کر کے ان کو الگ کر دیا۔ اگر وہ طاقت پر یقین رکھتے یا کسی بادشاہ کی پیروی کرتے تو تبع کی پیروی کرتے۔"
