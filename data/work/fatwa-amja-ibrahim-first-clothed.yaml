label: { ar: "تقديم إبراهيم بالكسوة يوم القيامة", en: "Why Abraham is clothed first on the Last Day", ur: "قیامت میں ابراہیم کو پہلے لباس کیوں ملے گا", es: "¿Por qué Abraham fue vestido primero en el Último Día?" }
summary:
  ar: "سأل سائل عن سبب تقديم إبراهيم على غيره بالكسوة يوم القيامة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83370 بتاريخ 21 ديسمبر 2010)⁩ أن أول من يكسى من عباد الله يومئذ خليل الرحمن أبو الأنبياء إبراهيم لحديث صحيح البخاري عن ابن عباس إن أول الخلائق يكسى يوم القيامة إبراهيم الخليل، وذكر ابن حجر زيادة البيهقي في طرح كرسي عن يمين العرش، وذكر العلماء أن تقديمه لأنه لم يكن في الأولين والآخرين أخوف الله منه فتعجلت له الكسوة أمانًا ليطمئن قلبه، ويحتمل لأنه أول من لبس السراويل على ما ورد."
  en: "A questioner asked why Abraham is advanced before others in being clothed on the Last Day. Dr. Salah al-Sawi (fatwa no. 83370, 21 December 2010) answered that the first of God's servants clothed that day is the Friend of the Merciful, father of the prophets, Abraham — per Ibn Abbas's hadith in Sahih al-Bukhari 'the first of creation clothed on the Last Day is Abraham the Friend' — with Ibn Hajar noting al-Bayhaqi's addition of a chair placed right of the throne; the scholars give his precedence to none before or after fearing God more than he, so his clothing is hastened as reassurance, and possibly because he was first to wear the sarawil, as recorded."
  ur: "ایک سائل نے پوچھا کہ قیامت میں ابراہیم کو پہلے لباس کیوں دیا جائے گا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83370، 21 دسمبر 2010)⁩ کے مطابق بخاری کی حدیث کے مطابق وہ پہلی مخلوق ہیں؛ علماء کے نزدیک اس لیے کہ ان سے زیادہ خوف خدا کسی کا نہیں تھا۔"
  es: "Un interlocutor preguntó por qué Abraham es adelantado a los demás en ser vestido el Último Día. El Dr. Salah al-Sawi (fatwa n.º 83370, 21 de diciembre de 2010) respondió que el primero de los siervos de Dios vestido ese día es el Amigo del Misericordioso, padre de los profetas, Abraham —según el hadiz de Ibn Abbas en Sahih al-Bukhari: «el primero de la creación vestido el Último Día es Abraham el Amigo»—, con Ibn Hajar señalando la adición de al-Bayhaqi de una silla colocada a la derecha del trono; los eruditos dan su precedencia a nadie antes o después que tema a Dios más que él, por lo que su vestimenta se apresura como garantía, y posiblemente porque fue el primero en usar el sarawil, como está registrado."
