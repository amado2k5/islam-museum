id: work/shorut-kobol-assalat
class: work
kind: lecture-series
label:
  ar: "شروط قبول الصلاة ⁦(سلسلة خطب)⁩"
  en: "Shurut Qabul al-Salat: the conditions for the acceptance of prayer (sermon series)"
  ur: "شروط قبول الصلاۃ: نماز کی قبولیت کی شرطیں ⁦(خطبات کا سلسلہ)⁩"
  es: "Shurut Qabul al-Salat: las condiciones para la aceptación de la oración (serie de sermones)"
  fr: "Shurut Qabul al-Salat: les conditions d'acceptation de la prière (série de sermons)"
  tr: "Dua Kabul Koşulları (Vaaz Serisi)"
  id: "Syarat Penerimaan Doa (Seri Khotbah)"
summary:
  ar: "سلسلة من سبع خطب طويلة لعبد الحميد كشك في أرشيف أسابيل، يشرح فيها حديثًا قدسيًّا في شروط قبول الصلاة، فيخصّ كل شرط بخطبة: التواضع لعظمة الله، وترك الاستطالة على الخلق، وترك الإصرار على المعصية، وقطع النهار في الذكر، ورحمة المسكين وابن السبيل والأرملة والمصاب."
  en: "A series of seven long sermons by Abdul Hamid Kishk on the Assabile archive, explaining a hadith qudsi on the conditions for the acceptance of prayer, one sermon to each condition: humility before God's greatness, not lording it over His creation, not persisting in sin, spending the day in remembrance, and mercy to the poor, the wayfarer, the widow and the afflicted."
  ur: "اسابیل آرکائیو میں عبد الحمید کشک کے سات طویل خطبات کا سلسلہ، جس میں وہ نماز کی قبولیت کی شرطوں سے متعلق ایک حدیث قدسی کی شرح کرتے ہیں اور ہر شرط کو ایک خطبہ دیتے ہیں: اللہ کی عظمت کے سامنے تواضع، مخلوق پر دست درازی نہ کرنا، گناہ پر اصرار نہ کرنا، دن ذکر میں گزارنا، اور مسکین، مسافر، بیوہ اور مصیبت زدہ پر رحم۔"
  es: "Una serie de siete largos sermones de Abdul Hamid Kishk en el archivo Assabile, que explican un hadiz qudsi sobre las condiciones para la aceptación de la oración, un sermón para cada condición: humildad ante la grandeza de Dios, no enseñorearse de Su creación, no persistir en el pecado, pasar el día en el recuerdo y misericordia para con los pobres, los viajeros, las viudas y los afligidos."
  fr: "Une série de sept longs sermons d'Abdul Hamid Kishk sur les archives Assabile, expliquant un hadith qudsi sur les conditions d'acceptation de la prière, un sermon pour chaque condition: l'humilité devant la grandeur de Dieu, ne pas dominer sa création, ne pas persister dans le péché, passer la journée en souvenir et la miséricorde envers le pauvre, le voyageur, la veuve et l'affligé."
  tr: "Abdel Hamid Kashk'ın Asabil arşivinde yer alan yedi uzun vaazından oluşan bir seri; burada duanın kabul koşullarıyla ilgili kutsal bir hadisi açıklıyor ve her bir şartı bir vaaza itiyor: Tanrı'nın büyüklüğü karşısında alçakgönüllülük, yaratılışını uzatmamak, günahta ısrarcı olmamak, günü anma için kesme ve yoksullara, yolcuya, dul kadına ve mağdurlara merhamet."
  id: "Serangkaian tujuh khotbah panjang oleh Abdel Hamid Kashk di arsip Asabil, di mana ia menjelaskan hadits suci mengenai syarat-syarat penerimaan doa, dengan mendedikasikan setiap syarat untuk sebuah khotbah: kerendahan hati di hadapan kebesaran Allah, menahan diri untuk tidak memperpanjang ciptaan-Nya, menahan diri dari ketekunan dalam dosa, memotong hari untuk mengenang, dan belas kasihan bagi orang miskin, pengembara, janda, dan yang menderita."
