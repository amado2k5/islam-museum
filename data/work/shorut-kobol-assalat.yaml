id: work/shorut-kobol-assalat
class: work
kind: lecture-series
label:
  ar: "شروط قبول الصلاة (سلسلة خطب)"
  en: "Shurut Qabul al-Salat: the conditions for the acceptance of prayer (sermon series)"
  ur: "شروط قبول الصلاۃ: نماز کی قبولیت کی شرطیں (خطبات کا سلسلہ)"
summary:
  ar: "سلسلة من سبع خطب طويلة لعبد الحميد كشك في أرشيف أسابيل، يشرح فيها حديثًا قدسيًّا في شروط قبول الصلاة، فيخصّ كل شرط بخطبة: التواضع لعظمة الله، وترك الاستطالة على الخلق، وترك الإصرار على المعصية، وقطع النهار في الذكر، ورحمة المسكين وابن السبيل والأرملة والمصاب."
  en: "A series of seven long sermons by Abdul Hamid Kishk on the Assabile archive, explaining a hadith qudsi on the conditions for the acceptance of prayer, one sermon to each condition: humility before God's greatness, not lording it over His creation, not persisting in sin, spending the day in remembrance, and mercy to the poor, the wayfarer, the widow and the afflicted."
  ur: "اسابیل آرکائیو میں عبد الحمید کشک کے سات طویل خطبات کا سلسلہ، جس میں وہ نماز کی قبولیت کی شرطوں سے متعلق ایک حدیث قدسی کی شرح کرتے ہیں اور ہر شرط کو ایک خطبہ دیتے ہیں: اللہ کی عظمت کے سامنے تواضع، مخلوق پر دست درازی نہ کرنا، گناہ پر اصرار نہ کرنا، دن ذکر میں گزارنا، اور مسکین، مسافر، بیوہ اور مصیبت زدہ پر رحم۔"
