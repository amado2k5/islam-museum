id: work/fatwa-amja-alcohol-hand-sanitizer
class: work
kind: fatwa
label: { ar: "معقم اليد الكحولي", en: "Alcohol-based hand sanitizer — permitted in medicine", ur: "الکحل والی ہینڈ سینیٹائزر", es: "Desinfectante de manos a base de alcohol: permitido en medicina", fr: "Désinfectant pour les mains à base d'alcool — autorisé en médecine", tr: "Alkol bazlı el dezenfektanı", id: "Hand sanitizer berbasis alkohol" }
summary:
  ar: "سأل سائل عن حكم استعمال معقم اليد المحتوي على نسبة كبيرة من الكحول في زمن الجائحة. أجابت اللجنة الدائمة للإفتاء بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87745 بتاريخ 3 أبريل 2020)⁩ أن أهل العلم نظروا في استعمال الكحول غير المعد للشرب وإنما للاستخدام الطبي في التعقيم والتطهير أو في صناعة العطور، واختار المجمع الفقهي الإسلامي في دورته السادسة عشرة بمكة جواز استعمال الأدوية المشتملة على الكحول بنسب مستهلكة تقتضيها الصناعة الدوائية التي لا بديل عنها بشرط أن يصفها طبيب عدل كما يجوز استعمال الكحول في التعقيم والتطهير على ما فصّل الجواب."
  en: "A questioner asked the ruling on using a hand sanitizer containing a large proportion of alcohol in the pandemic days. AMJA's Permanent Fatwa Committee (no. 87745, 3 April 2020) answered that the scholars examined alcohol not meant for drinking but for medical sterilizing and disinfecting or perfumery; the International Islamic Fiqh Academy at its sixteenth session in Mecca ruled medicines containing alcohol in consumed proportions demanded by pharmaceutical manufacture with no alternative are lawful if prescribed by a fair physician — and likewise alcohol may be used in sterilizing and disinfecting, as the answer details."
  ur: "ایک سائل نے الکحل والا سینیٹائزر پوچھا۔ مجمع کی کمیٹی ⁦(فتویٰ 87745، 3 اپریل 2020)⁩ کے مطابق مجمع فقہی نے طبی مقاصد کے الکحل کو جائز قرار دیا — تعقیم میں استعمال جائز ہے۔"
  es: "Un consultante preguntó sobre la jurisprudencia relativa al uso de desinfectante de manos con alto contenido de alcohol durante la pandemia. El Comité Permanente de Fatwas de AMJA (n.º 87745, 3 de abril de 2020) respondió que los eruditos examinaron el alcohol no destinado al consumo, sino a la esterilización y desinfección médica o a la perfumería; la Academia Internacional de Jurisprudencia Islámica, en su decimosexta sesión en La Meca, dictaminó que los medicamentos que contienen alcohol en las proporciones de consumo requeridas por la fabricación farmacéutica, sin alternativa alguna, son lícitos si los prescribe un médico competente; asimismo, el alcohol puede utilizarse para esterilizar y desinfectar, como se detalla en la respuesta."
  fr: "Une question portait sur la réglementation concernant l'utilisation de solutions hydroalcooliques à forte concentration d'alcool pendant la pandémie. Le Comité permanent des fatwas de l'AMJA (n° 87745, 3 avril 2020) a répondu que les savants avaient examiné l'alcool non destiné à la consommation, mais utilisé à des fins médicales de stérilisation et de désinfection, ou en parfumerie. L'Académie internationale de jurisprudence islamique (Fiqh), lors de sa seizième session à La Mecque, a statué que les médicaments contenant de l'alcool dans les proportions requises par l'industrie pharmaceutique, en l'absence d'alternative, sont licites s'ils sont prescrits par un médecin compétent. De même, l'alcool peut être utilisé pour la stérilisation et la désinfection, comme le précise la réponse."
  tr: "Pandemi sırasında büyük miktarda alkol içeren el dezenfektanı kullanımına ilişkin karar hakkında bir soru soruldu. Amerikan İslami Hukukçular Konseyi'nin Daimi Fetva Komitesi (3 Nisan 2020 tarihli Fetva No. 87745), alimlerin alkolün içme amacıyla değil, sterilizasyon, arıtma veya parfüm üretiminde tıbbi kullanım amacıyla kullanıldığını değerlendirdiğini yanıtladı. İslami Fiqh Akademisi, Mekke'deki on altıncı oturumunda, ilaç endüstrisinin talep ettiği tüketim oranlarında alkol içeren ilaçların kullanımına izin verdi; ancak bu, adil bir doktor tarafından reçete edildiği sürece vazgeçilmez bir tüketim oranıdır. Ayrıca, yanıtta ayrıntılı olarak belirtildiği gibi, alkolün sterilizasyon ve arındırma için kullanılması da izinlidir."
  id: "Seorang penanya ditanya tentang putusan penggunaan hand sanitizer yang mengandung banyak alkohol selama pandemi. Komite Fatwa Permanen di American Council of Islamic Jurists (Fatwa No. 87745 tanggal 3 April 2020) menanggapi bahwa para ulama telah mempertimbangkan penggunaan alkohol bukan untuk diminum tetapi untuk penggunaan medis dalam sterilisasi, pemurnian, atau pembuatan parfum. Akademi Fiqh Islam, dalam sesi keenam belas di Mekah, telah mengizinkan penggunaan obat yang mengandung alkohol dalam tingkat konsumsi yang diwajibkan oleh industri farmasi, yang tidak dapat digantikan asalkan diresepkan oleh dokter yang adil. Alkohol juga diperbolehkan untuk sterilisasi dan pemurnian, sebagaimana dijelaskan dalam jawaban."
