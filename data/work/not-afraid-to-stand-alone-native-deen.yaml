summary:
  ar: "الألبوم الثاني لفرقة الهيب هوب الأمريكية نيتف دين، صدر في نوفمبر 2007 بإحدى وعشرين مقطوعة تستعمل الإيقاع وحده، وصدرت منه نسخة صوتية؛ موضوعاته تسبيح الله وصعوبات حياة المسلم والثبات والصلاة والحج والنبي، والتمييز الذي يلقاه المسلمون في أمريكا، وفيه ضيوف منهم عصام بشيري من آوتلانديش وزين بيكا."
  en: "The second album of the American hip-hop group Native Deen, released in November 2007 with twenty-one tracks using percussion only, plus a voice-only version; its themes include praise of God, the hardships and steadfastness of Muslim life, prayer, the hajj, the Prophet and the discrimination Muslims face in America, with guests including Isam Bachiri of Outlandish and Zain Bhikha."
  ur: "امریکی ہپ ہاپ گروپ نیٹو دین کا دوسرا البم، نومبر 2007 میں اکیس ٹریکس کے ساتھ جاری ہوا جن میں صرف تال کے ساز ہیں، اور ایک صرف آواز والا ورژن بھی آیا؛ موضوعات میں اللہ کی حمد، مسلمان کی زندگی کی مشکلات، نماز، حج، نبی اور امریکہ میں مسلمانوں سے امتیاز شامل ہیں۔"
