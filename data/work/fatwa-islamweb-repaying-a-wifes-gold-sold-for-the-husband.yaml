id: work/fatwa-islamweb-repaying-a-wifes-gold-sold-for-the-husband
class: work
kind: fatwa
label: { ar: "أمرها زوجها ببيع شيء من ذهبها ليقترضه، فهل تسترده منه بالوزن أم بالقيمة؟", en: "Repaying a wife's gold sold at her husband's request: by weight or by value?", ur: "شوہر کے کہنے پر بیچا گیا بیوی کا سونا: وزن سے واپس ملے یا قیمت سے؟" }
summary:
  ar: "سؤال من زوجة اشتُري لها بمهرها المقدر بالدنانير ذهب على عرف بلدها، ثم طلب منها زوجها بيع بعضه لحاجة مع وعده بإعادته، وباعت الباقي بإرادتها لإكمال بناء البيت على أن يعيده أيضًا، وقد تضاعف ثمن الذهب بعد سنوات، فسألت هل تسترد قيمة المهر بالدنانير أم قيمة الذهب، وعن هدية الخطوبة هل تُحسب من المهر، وعن وجوب نفقة علاجها على الزوج، أجاب فيه مركز الفتوى بإسلام ويب بأنه إن كان الزوج اقترض منها ذات الذهب ثم أمر ببيعه فهو دين في ذمته يلزمه رد مثله لا قيمته بغض النظر عن تغير سعره، لأن الديون تُقضى بأمثالها كما في قرار مجمع الفقه الإسلامي بالكويت سنة 1988، إلا أن يتراضيا على دفع القيمة فتُقوّم يوم الأداء لحديث ابن عمر، ولا علاقة للدنانير التي سُمّي بها المهر لأنها استُبدلت بالذهب الذي صار ملكًا لها. أما إن كانت هي التي باعت الذهب ثم أقرضته الثمن نقدًا فالدين هو المبلغ النقدي لا قيمته من الذهب، كما في الموسوعة الفقهية. وأما الشبكة فسواء عُدّت جزءًا من المهر أو هبة مستقلة فهي بتمام العقد والدخول ملك خالص للزوجة، فإن بيعت لحاجته بوعد الإعادة فهي دين كباقي الذهب. وأما تكفل الزوج بمصاريف العلاج ففيه خلاف أحال فيه إلى فتوى سابقة ذكر فيها أن القول بوجوبه عليه وجيه في هذا الزمان."
  en: "A question from a wife whose dower, fixed in dinars, was spent on gold for her according to her country's custom; her husband later asked her to sell part of it for a need, promising to return it, and she sold the rest of her own accord to finish building their house on the understanding that he would return it too; the price of gold has since multiplied, so she asked whether she recovers the dower's value in dinars or the value of the gold, whether the engagement gift counts as part of the dower, and whether the husband must pay for her medical treatment. The fatwa centre of IslamWeb answered that if the husband borrowed the gold itself from her and then had it sold, it is a debt he owes and he must return its like, not its value, whatever the change in its price, because debts are repaid in kind, as the Islamic Fiqh Academy resolved in Kuwait in 1988, unless the two agree on payment of its value, which is then assessed on the day of payment according to the hadith of Ibn Umar; the dinars in which the dower was named are irrelevant, since they were exchanged for gold that became her property. If instead she sold the gold herself and lent him the cash, the debt is the sum of money, with no regard to its gold value, as the Fiqh Encyclopaedia states. As for the engagement gift, whether counted as part of the dower or as a separate gift, it becomes the wife's sole property once the marriage is contracted and consummated, and if sold for the husband's need with a promise of return it is a debt like the rest of the gold. On the husband's bearing the cost of his wife's treatment, the centre noted a difference of opinion and referred to an earlier fatwa in which it said the view that it is obligatory on him is well founded in this age."
  ur: "ایک بیوی کا سوال جس کا دیناروں میں مقرر مہر اس کے ملک کے عرف کے مطابق اس کے لیے سونا خریدنے پر خرچ ہوا؛ بعد میں شوہر نے کسی ضرورت کے لیے اس کا کچھ حصہ بیچنے کو کہا اور واپس کرنے کا وعدہ کیا، اور باقی سونا اس نے اپنی مرضی سے گھر کی تعمیر مکمل کرنے کے لیے اس شرط پر بیچا کہ شوہر وہ بھی واپس کرے گا؛ سونے کی قیمت برسوں میں کئی گنا بڑھ گئی، تو اس نے پوچھا کہ وہ مہر کی قیمت دیناروں میں واپس لے یا سونے کی قیمت، کیا منگنی کا تحفہ مہر میں شمار ہوگا، اور کیا شوہر پر اس کے علاج کا خرچ لازم ہے۔ اسلام ویب کے فتویٰ مرکز نے جواب دیا کہ اگر شوہر نے اس سے خود سونا قرض لیا اور پھر اسے بیچنے کو کہا تو یہ اس کے ذمے قرض ہے جس کی مثل واپس کرنا لازم ہے نہ کہ قیمت، قیمت کے بدلنے سے قطع نظر، کیونکہ قرض مثل سے ادا ہوتے ہیں جیسا کہ اسلامی فقہ اکیڈمی نے 1988 میں کویت میں قرارداد دی، سوائے اس کے کہ دونوں قیمت کی ادائیگی پر راضی ہوں تو ابن عمر کی حدیث کے مطابق ادائیگی کے دن کی قیمت لگائی جائے گی؛ جن دیناروں میں مہر مقرر ہوا ان کا کوئی تعلق نہیں کیونکہ وہ سونے سے بدلے گئے جو اس کی ملکیت بن گیا۔ لیکن اگر اس نے خود سونا بیچ کر نقد رقم قرض دی تو قرض وہ نقد رقم ہے، سونے کی قیمت کا لحاظ نہیں، جیسا کہ فقہی انسائیکلوپیڈیا میں ہے۔ رہا منگنی کا تحفہ، تو خواہ اسے مہر کا حصہ سمجھا جائے یا الگ ہبہ، عقد اور رخصتی کی تکمیل سے وہ بیوی کی خالص ملکیت ہے، اور اگر شوہر کی ضرورت کے لیے واپسی کے وعدے پر بیچا گیا تو باقی سونے کی طرح قرض ہے۔ شوہر کے بیوی کے علاج کا خرچ اٹھانے میں مرکز نے اختلاف کا ذکر کیا اور ایک سابقہ فتوے کا حوالہ دیا جس میں کہا تھا کہ اس دور میں اس کے وجوب کا قول وزنی ہے۔"
