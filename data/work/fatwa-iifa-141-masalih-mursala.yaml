label: { ar: "قرار مجمع الفقه الإسلامي الدولي 141 (15/7) بشأن المصالح المرسلة وتطبيقاتها المعاصرة", en: "IIFA resolution 141 (15/7) on unattested benefits ⁦(al-masalih al-mursala)⁩ and their contemporary applications", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 141 (15/7): مصالحِ مرسلہ اور ان کے عصری اطلاقات", es: "Resolución 141 (15/7) de la IIFA sobre beneficios no certificados (al-masalih al-mursala) y sus aplicaciones contemporáneas.", fr: "Résolution 141 (15/7) de l'IIFA sur les avantages non attestés (al-masalih al-mursala) et leurs applications contemporaines", tr: "Uluslararası İslami Fiqh Akademisi Kararı 141 (15/7) Gönderilen İlgi Alanları ve Çağdaş Uygulamaları ile İlgili", id: "Resolusi Akademi Fiqh Islam Internasional 141 (15/7) mengenai Kepentingan Terkirim dan Aplikasi Kontemporernya" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة عشرة بمسقط ⁦(14–19 المحرم 1425هـ، 6–11 مارس 2004م)⁩، استحضارًا لإجماع المسلمين على أن الأحكام مبنية على جلب المصالح ودرء المفاسد. عرّف المصلحة بالمحافظة على مقصود الشارع: حفظ الدين والنفس والعقل والنسل والمال، والمصلحة المرسلة بما لم ينص عليها الشارع اعتبارًا ولا إلغاءً وهي داخلة تحت المقاصد الكلية. واشترط لاعتبارها: أن تكون حقيقية لا وهمية؛ كلية لا جزئية؛ عامة لا خاصة؛ لا تعارضها مصلحة أولى أو مساوية؛ ملائمة لمقاصد الشريعة. وأشار إلى معايير العلماء في تقسيم المصالح وترتيبها ⁦(ضرورية وحاجية وتحسينية)⁩ ومراتبها في الترجيح، وتناول تطبيقاتها المعاصرة في التشريع والاجتهاد."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 15th session in Muscat (14–19 Muharram 1425, 6–11 March 2004), citing the Muslims' consensus that rulings are built on procuring benefits and repelling harms. It defined maslaha as preserving the Lawgiver's intent — religion, life, reason, progeny and property — and the unattested maslaha as one not expressly affirmed or negated by the Lawgiver yet falling under the general purposes. Conditions for considering it: it must be real, not imagined; universal, not partial; general, not particular; not contradicted by an equal or higher benefit; and suitable to the law's purposes — noting the jurists' criteria for classifying benefits (necessary, need-level, enhancing) and ranking them in preference, with applications to contemporary legislation and ijtihad."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مسقط میں پندرہویں مجلس ⁦(14–19 محرم 1425ھ، 6–11 مارچ 2004ء)⁩ میں، مسلمانوں کے اجماع کے پیشِ نظر کہ احکام مصالح کے حصول اور مفاسد کی رفع پر قائم ہیں۔ اس نے مصلحت کی تعریف کی: شارع کے مقصد کی حفاظت — دین، جان، عقل، نسل اور مال؛ اور مصلحتِ مرسلہ کی: وہ مصلحت جسے شارع نے نہ تسلیم کیا نہ رد، مگر مقاصدِ کلی میں داخل۔ اس کے اعتبار کی شرائط: حقیقی ہو، وہمی نہ؛ کلی ہو، جزئی نہ؛ عام ہو، خاص نہ؛ اس سے برابر یا افضل مصلحت متعارض نہ ہو؛ اور مقاصدِ شریعت کے موافق ہو — فقہاء کے معیارات کے حوالے سے مصالح کی تقسیم ⁦(ضروریات، حاجات، تحسینات)⁩ اور ترجیح کی ترتیب، اور تشریع و اجتہاد میں ان کے عصری اطلاقات۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 15.ª sesión en Mascate (14-19 de Muharram de 1425, 6-11 de marzo de 2004), citando el consenso de los musulmanes de que las decisiones se basan en la obtención de beneficios y la prevención de daños. Definió maslaha como la preservación de la intención del Legislador —religión, vida, razón, descendencia y propiedad— y maslaha no atestiguada como aquella que no es expresamente afirmada ni negada por el Legislador, pero que se enmarca dentro de los propósitos generales. Condiciones para su consideración: debe ser real, no imaginaria; universal, no parcial; general, no particular; no contradicha por un beneficio igual o superior; y adecuada a los propósitos de la ley, señalando los criterios de los juristas para clasificar los beneficios (necesarios, de nivel de necesidad, potenciadores) y jerarquizarlos por preferencia, con aplicaciones a la legislación contemporánea y al ijtihad."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 15e session à Mascate (14-19 Muharram 1425, 6-11 mars 2004) rappelle le consensus musulman selon lequel les décisions juridiques reposent sur la recherche du bien et la prévention du mal. Elle définit la maslaha comme la préservation de l'intention du Législateur – religion, vie, raison, descendance et biens – et la maslaha non attestée comme celle qui n'est ni expressément affirmée ni niée par le Législateur, mais qui relève des objectifs généraux. Les conditions de sa prise en compte sont les suivantes: elle doit être réelle et non imaginaire; universelle et non partielle; générale et non particulière; non contredite par un bénéfice égal ou supérieur; et conforme aux objectifs de la loi. Cette résolution rappelle les critères des juristes pour classer les bénéfices (nécessaires, liés au besoin, améliorants) et les hiérarchiser, avec des applications à la législation contemporaine et à l'ijtihad."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on beşinci oturumunda (14–19 Muharrem 1425H, 6–11 Mart 2004) Muskat'ta ortak bir karar, Müslümanların kararların fayda sağlamaya ve zararı önlemeye dayandığı yönündeki uzlaşmasını hatırlatır. Çıkarı, yasama organının niyetini korumak olarak tanımladı: din, yaşam, akl, soy ve servet ile yasa koyucu tarafından açıkça belirtilmemiş konulardaki mursal çıkarı korumak (ister değerlendirme ister inkâr yoluyla) ve bunlar genel hedeflere girer. Dikkate alınmaları için şunu belirtti: bunların gerçek ve hayali olmaması; genel değil; genel değil; özgül değil; birincil veya eşit çıkarla çelişmemesi; ve Şeriat'ın hedefleriyle uyumlu olmaları. Alimlerin çıkarları bölme ve düzenleme kriterlerine (gerekli, ihtiyaç ve iyileştirici) ile tercih seviyelerine işaret etti ve bunların yasama ve ictihaddaki çağdaş uygulamalarını ele aldı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sesi kelima belas di Muscat (14–19 Muharram 1425H, 6–11 Maret 2004), mengingat konsensus umat Muslim bahwa putusan didasarkan pada membawa manfaat dan mencegah kerugian. Ia mendefinisikan kepentingan sebagai menjaga niat pembuat undang-undang: menjaga agama, kehidupan, intelek, garis keturunan, dan kekayaan, serta kepentingan mursal dalam hal-hal yang tidak secara eksplisit ditentukan oleh Pemberi Undang-undang, baik melalui pertimbangan maupun penolakan, dan keduanya termasuk dalam tujuan umum. Ia menetapkan untuk pertimbangan: bahwa keputusan tersebut harus nyata dan bukan imajinasi; umum bukan khusus; umum bukan spesifik; tidak bertentangan dengan kepentingan utama atau setara; dan sesuai dengan tujuan Syariah. Ia menunjukkan kriteria para ulama untuk membagi kepentingan dan mengaturnya (perlu, membutuhkan, dan meningkatkan kemampuan) serta tingkat preferensi mereka, serta membahas aplikasi kontemporer dalam legislasi dan ijtihad."
