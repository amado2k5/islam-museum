id: work/fatwa-iifa-212-bank-guarantee-investment-losses
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 212 (22/8) بشأن ضمان البنك للمخاطر الناشئة عن سوء استثمار أموال العملاء وتعويضهم عن الأضرار الناجمة", en: "IIFA resolution 212 (22/8) on the bank's guarantee of risks arising from mismanaging clients' funds and compensating them for resulting harm", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 212 (22/8): گاہکوں کے فنڈز کے غلط استعمال سے پیدا ہونے والے خطرات کی بینک ضمانت اور ہونے والے نقصان کی تلافی", es: "Resolución 212 (22/8) de la IIFA sobre la garantía del banco frente a los riesgos derivados de la mala gestión de los fondos de los clientes y la indemnización por los daños resultantes.", fr: "Résolution 212 (22/8) de l'IIFA relative à la garantie bancaire des risques liés à la mauvaise gestion des fonds des clients et à l'indemnisation de ces derniers pour le préjudice qui en résulte.", tr: "Uluslararası İslami Fiqh Akademisi Kararı 212 (22/8), müşterilerin fonlarının yanlış yatırımından kaynaklanan riskler için Banka'nın garantisi ve ortaya çıkan zararların tazminatı hakkında", id: "Keputusan International Islamic Fiqh Academy 212 (22/8) mengenai jaminan Bank atas risiko yang timbul dari salah investasi dana klien dan kompensasi atas kerugian yang ditimbulkan" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩. عرّف ضمان البنك بتحمله تبعة الهلاك ⁦(الخسارة)⁩ الكلي أو الجزئي لأموال المودعين وأصحاب الحسابات الاستثمارية. وبيّن أن يد البنك على المال تدور بين يد الضمان ⁦(حيازة للتملك أو لمصلحة الحائز كالمشتري والمرتهن والمقترض)⁩ — ومنها الودائع تحت الطلب التي أكد فيها قراره 86 ⁦(9/3)⁩ أنها قروض بالمنظور الفقهي ويد المصرف يد ضمان ملزم بالرد عند الطلب — ويد الأمانة ⁦(حيازة نيابة بإذن رب المال كالمودَع والمستأجر والشريك والمضارب وناظر الوقف)⁩ — ومنها الحسابات الاستثمارية التي هي رأس مال مضاربة تنطبق عليها أحكامها ومنها عدم جواز ضمان المضارب رأس مالها. وقرر أنه لا يجوز للبنك المضارب ضمان الهلاك الكلي أو الجزئي في حسابات الاستثمار إلا إذا تعدى أو قصر أو خالف الشروط، ومن حالات التعدي: عدم الالتزام بالضوابط الشرعية المنصوصة في عقود فتح الحسابات؛ مخالفة الأنظمة والأعراف المصرفية والتجارية الصادرة عن الهيئات الإشرافية غير المتعارضة مع الشريعة؛ عدم إجراء دراسات الجدوى الكافية للمتعاملين؛ اختيار صيغ وآليات غير مناسبة؛ عدم اتباع التعليمات المنصوصة؛ وعدم أخذ الضمانات الكافية بحسب الأعراف. ولا يجوز تضمين البنك بصفته مضاربًا بالشرط لمخالفته مقتضى المضاربة تأكيدًا لقراريه 86 و30 ⁦(4/5)⁩ في صكوك المقارضة بأن نشرة الإصدار لا تتضمن ضمان رأس المال أو ربحًا مقطوعًا وإلا بطل الشرط واستحق المضارب ربح مضاربة المثل. وينتقل عبء الإثبات في دعوى الخسارة إلى البنك خلافًا للأصل بشرط قرائن تخالف دعواه عدم التعدي كعرف عدم قبول قول المضارب حتى يقيم البينة، وثبوت التهمة على الأمين، وثبوت المصلحة في نقل العبء حماية لأموال المستثمرين. وجوز تبرع البنك المضارب بجزء من حصته في الربح دون شرط في العقد. والجهات المنوطة بتحديد المسؤولية تشمل الجهات الإشرافية كالبنوك المركزية بلجانها الإسلامية، ومراكز المصالحة والتحكيم كالمركز الإسلامي الدولي للمصالحة والتحكيم بدبي، ومراقبي الحسابات وهيئات الرقابة الشرعية. ويقتصر التعويض على الضرر الفعلي كليًا كان أو جزئيًا دون الربح الفائت ⁦(الفرصة البديلة)⁩ لأنه توقع غير قائم. وأوصى البنوك الإسلامية ببذل العناية وإنشاء الصناديق والاحتياطيات لحماية الأموال، ودعا الدول الإسلامية لإصدار قوانين تنشئ مؤسسات ضمان أموال المودعين أو تعديل القوانين على أساس التأمين التكافلي تشترك فيه المؤسسات المالية الإسلامية وتدار وفق قراره 200 ⁦(21/6)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015). It defined the bank's guarantee as its bearing liability for the total or partial loss of depositors' and investment-account holders' funds. It distinguished two kinds of possession: the hand of guarantee (possession for ownership or the possessor's benefit — buyer, pledgee, borrower), under which demand deposits fall, reaffirming resolution 86 (9/3) that they are juristic loans the bank must repay on demand; and the hand of trust (possession on behalf of the owner by his permission — depositary, lessee, partner, mudarib, waqf administrator), under which investment accounts fall as mudaraba capital whose rules include the impermissibility of the mudarib guaranteeing the capital. The mudarib bank may not guarantee total or partial loss in investment accounts except where it transgresses, is negligent or breaches terms — transgression including: not observing the legal controls in account-opening contracts; breaching supervisory banking and commercial regulations not contrary to sharia; not conducting adequate feasibility studies for clients; choosing unsuitable forms and mechanisms; not following prescribed instructions; and not taking adequate guarantees per custom. The bank may not be made liable qua mudarib by stipulation, reaffirming resolutions 86 and 30 (4/5) that a muqarada-sukuk prospectus may not guarantee capital or a fixed profit else the condition is void and the mudarib earns the profit of a like mudaraba. The burden of proof in a loss claim shifts to the bank contrary to the default where indications contradict its plea of no transgression — such as custom not accepting the mudarib's word without evidence, an established presumption against the trustee, and proven interest in protecting investors' funds. The mudarib may donate part of its profit share without contractual stipulation. Bodies determining liability include supervisory authorities such as central banks with Islamic-banking committees, conciliation and arbitration centres such as Dubai's International Islamic Centre, and account auditors and sharia-supervisory boards. Compensation is limited to actual damage, total or partial, excluding lost profit (opportunity cost) as a non-existent expectation. It recommended Islamic banks exercise care, create funds and reserves, and called on Islamic states to enact deposit-insurance laws on a takaful basis per its resolution 200 (21/6)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ میں۔ بینک کی ضمانت کی تعریف: مودعین اور سرمایہ کاری اکاؤنٹ ہولڈرز کے فنڈز کے مکمل یا جزوی نقصان کی ذمہ داری سنبھالنا۔ اکیڈمی نے قبضے کی دو اقسام بیان کیں: یدِ ضمان ⁦(ملکیت یا حائز کے فائدے کی حیازت — خریدار، مرتہن، مقروض)⁩ جس میں ڈیمانڈ ڈپازٹس آتی ہیں اور جس پر اس نے قرارداد 86 ⁦(9/3)⁩ کی تائید کی کہ وہ فقہی لحاظ سے قرض ہیں اور بینک کو طلب پر واپس کرنا لازم؛ اور یدِ امانت ⁦(مالک کی اجازت سے نیابت کی حیازت — امانت دار، مستاجر، شریک، مضارب، وقف ناظر)⁩ جس میں سرمایہ کاری اکاؤنٹس آتے ہیں جو مضاربہ کا سرمایہ ہیں اور ان کے احکام میں مضارب کا سرمایہ ضمانت نہ کرنا شامل ہے۔ مضارب بینک سرمایہ کاری اکاؤنٹس میں مکمل یا جزوی نقصان کی ضمانت نہیں دے سکتا سوائے تجاوز، تقصیر یا شرائط کی خلاف ورزی کی — تجاوز میں شامل: اکاؤنٹ کھولنے کے عقود میں شرعی ضوابط کی پابندی نہ کرنا؛ شریعت سے متصادم نہ ہوتے نگران اداروں کے بینکاری و تجارتی ضوابط کی خلاف ورزی؛ گاہکوں کے لیے کافی فزیبلٹی مطالعے نہ کرنا؛ نا مناسب صورتیں و آلات کا انتخاب؛ مقررہ ہدایات کی پیروی نہ کرنا؛ اور عرف کے مطابق کافی ضمانتیں نہ لینا۔ شرط لگا کر بینک کو مضارب کی حیثیت سے ذمہ دار نہیں ٹھہرایا جا سکتا — قراردادوں 86 اور 30 ⁦(4/5)⁩ کی تائید کہ مقارضہ صکوک کے نشرِ اصدار میں سرمائے یا مقررہ منافع کی ضمانت نہیں ہو سکتی ورنہ شرط باطل اور مضارب مثل کے مضاربے کا منافع کا مستحق۔ نقصان کے دعوے میں اثبات کا بوجھ بینک پر منتقل ہو جاتا ہے اصول کے خلاف جب اس کے عدَم تجاوز کے دعوے کے خلاف قرائن موجود ہوں — جیسے مضارب کا قول بغیر بینہ قبول نہ کرنے کا عرف، امانت دار پر تہمت کی تحقق، اور سرمایہ کاروں کے فنڈز کے تحفظ کے مفاد کی تحقق۔ مضارب عقد میں شرط کے بغیر اپنے منافع کے حصے کا کچھ حصہ عطیہ کر سکتا ہے۔ ذمہ داری متعین کرنے والے اداروں میں نگران ادارے جیسے اسلامی کمیٹیوں والے مرکزی بینک، مصالحہ و تحکیم مراکز جیسے دبئی کا بین الاقوامی اسلامی مرکز، اور اکاؤنٹ آڈیٹرز اور شرعی نگرانی بورڈ شامل ہیں۔ تلافی محض واقعی نقصان تک محدود ہے، مکمل ہو یا جزوی — کھوئے ہوئے منافع ⁦(مواقع کی لاگت)⁩ کے بغیر کیونکہ وہ محض توقع ہے۔ اکیڈمی نے اسلامی بینکوں سے احتیاط، فنڈز اور ذخائر بنانے کی سفارش کی اور اسلامی ممالک سے مودعین کے فنڈز کی ضمانت کے ادارے قائم کرنے کے قوانین یا تکافل کی بنیاد پر قوانین میں ترمیم کی دعوت دی — اپنی قرارداد 200 ⁦(21/6)⁩ کے مطابق۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 22.ª sesión en Kuwait (2-5 de Jumada al-Akhira de 1436, 22-25 de marzo de 2015). Definió la garantía del banco como su responsabilidad por la pérdida total o parcial de los fondos de los depositantes y titulares de cuentas de inversión. Distinguió dos tipos de posesión: la mano de garantía (posesión para la propiedad o el beneficio del poseedor: comprador, acreedor prendario, prestatario), bajo la cual se incluyen los depósitos a la vista, reafirmando la resolución 86 (9/3) que son préstamos jurídicos que el banco debe reembolsar a requerimiento; y la mano de fideicomiso (posesión en nombre del propietario con su autorización: depositario, arrendatario, socio, mudarib, administrador de waqf), bajo la cual se incluyen las cuentas de inversión como capital mudaraba cuyas reglas incluyen la inadmisibilidad de que el mudarib garantice el capital. El banco mudarib no puede garantizar la pérdida total o parcial en cuentas de inversión excepto cuando transgrede, es negligente o incumple los términos, transgresión que incluye: no observar los controles legales en los contratos de apertura de cuentas; incumplir las regulaciones bancarias y comerciales de supervisión que no sean contrarias a la sharia; no realizar estudios de viabilidad adecuados para los clientes; elegir formas y mecanismos inadecuados; no seguir las instrucciones prescritas; y no tomar garantías adecuadas según la costumbre. El banco no puede ser considerado responsable como mudarib por estipulación, reafirmando las resoluciones 86 y 30 (4/5) que un prospecto de muqarada-sukuk no puede garantizar el capital o una ganancia fija, ya que la condición es nula y el mudarib obtiene la ganancia de un mudaraba similar. La carga de la prueba en una reclamación por pérdida se traslada al banco contrariamente al incumplimiento cuando los indicios contradicen su alegación de no transgresión, tales como la costumbre de no aceptar la palabra del mudarib sin pruebas, una presunción establecida contra el fiduciario y el interés probado en proteger los fondos de los inversionistas. El mudarib puede donar parte de su participación en las ganancias sin estipulación contractual. Los organismos que determinan la responsabilidad incluyen autoridades supervisoras como bancos centrales con comités de banca islámica, centros de conciliación y arbitraje como el Centro Islámico Internacional de Dubái, auditores de cuentas y juntas de supervisión de la sharia. La compensación se limita al daño real, total o parcial, excluyendo la pérdida de ganancias (costo de oportunidad) por ser una expectativa inexistente. Se recomendó a los bancos islámicos que actuaran con cautela, crearan fondos y reservas, e instó a los estados islámicos a promulgar leyes de seguro de depósitos sobre la base del takaful, según su resolución 200 (21/6)."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 22e session au Koweït (2-5 Jumada al-Akhira 1436, soit 22-25 mars 2015) définit la garantie bancaire comme l'engagement de la banque à couvrir la perte totale ou partielle des fonds des déposants et des titulaires de comptes d'investissement. Elle distingue deux types de détention: la détention par garantie (détention à titre de propriété ou au profit du détenteur – acheteur, créancier gagiste, emprunteur), à laquelle appartiennent les dépôts à vue, réaffirmant la résolution 86 (9/3) selon laquelle il s'agit de prêts juridiques que la banque doit rembourser sur demande; et la détention par fiducie (détention pour le compte du propriétaire avec son autorisation – dépositaire, locataire, associé, mudarib, administrateur de waqf), à laquelle appartiennent les comptes d'investissement en tant que capital mudaraba, dont les règles interdisent notamment au mudarib de garantir le capital. La banque mudarib ne peut garantir la perte totale ou partielle des comptes d'investissement qu'en cas de transgression, de négligence ou de manquement de sa part aux termes du contrat. Sont notamment considérés comme transgressions: le non-respect des contrôles légaux dans les contrats d'ouverture de compte; la violation des réglementations bancaires et commerciales de surveillance non contraires à la charia; l'absence d'études de faisabilité adéquates pour les clients; le choix de formes et de mécanismes inadaptés; le non-respect des instructions prescrites; et le défaut de prise de garanties suffisantes conformément à la coutume. La banque ne peut être tenue responsable en tant que mudarib par stipulation, réaffirmant les résolutions 86 et 30 (4/5) selon lesquelles un prospectus de muqarada-sukuk ne peut garantir le capital ni un profit fixe, faute de quoi la condition est nulle et le mudarib perçoit le profit d'une mudaraba similaire. La charge de la preuve en cas de réclamation pour perte incombe à la banque, contrairement à la situation de manquement, lorsque des éléments contredisent son allégation d'absence de transgression: par exemple, la coutume n'accepte pas la parole du mudarib sans preuve, une présomption établie contre le fiduciaire et un intérêt avéré à protéger les fonds des investisseurs. Le mudarib peut faire don d'une partie de sa part de bénéfices sans stipulation contractuelle. Les organismes chargés de déterminer la responsabilité comprennent les autorités de surveillance telles que les banques centrales dotées de comités de banque islamique, les centres de conciliation et d'arbitrage comme le Centre islamique international de Dubaï, ainsi que les commissaires aux comptes et les conseils de surveillance de la charia. L'indemnisation est limitée au préjudice réel, total ou partiel, à l'exclusion du manque à gagner (coût d'opportunité) considéré comme une espérance non réalisée. La résolution 200 (21/6) recommande aux banques islamiques de faire preuve de prudence, de constituer des fonds et des réserves, et appelle les États islamiques à adopter des lois sur l'assurance-dépôts sur la base du takaful."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Kuveyt Devleti'ndeki yirmi ikinci oturumunda (2–5 Jumada al-Akhirah 1436 H, 22–25 Mart 2015) toplu kararı. Bankanın garantisi, mevduat sahiplerinin ve yatırım hesabı sahiplerinin fonlarının tam veya kısmi kaybı riskini üstlenmek olarak tanımlanır. Bankanın para üzerindeki hakimiyetinin, garanti (sahiplik veya alıcı, ipotek sahibi ve borçlu gibi sahiplerin yararına olması) — talep mevduatları dahil, bunların 86 (9/3) Kararı tarafından teyit edilen ve bankanın talep üzerine geri vermekle yükümlü bir garantiye sahip olduğunu — ve güvenin elinde olduğunu (sermaye sahibinin, kiracının, ortak, spekülatörün ve vakıf denetçisinin izniyle vekaletle sahiplik) — ve yatırım hesaplarının (hükümlerine tabi spekülatif sermaye olan ve spekülatörün sermayesini garanti edemeyen) elinde olduğunu açıkladı. Spekülatör bankanın, koşulları aşmadıkça, başarısız olmadığı veya ihlal etmediği sürece yatırım hesaplarında toplam veya kısmi zarar garantisi veremeyeceğine karar verilmiştir. İhlal vakaları arasında: hesap açma sözleşmelerinde belirtilen Şeriat düzenlemelerine uyulmaması; denetim organları tarafından verilen bankacılık ve ticaret düzenlemeleri ile gümrüklerin şeriatla çelişmeyen ihlali; müşteriler için yeterli fizibilite çalışmalarının yapılmaması; uygunsuz formül ve mekanizmaların seçilmesi; belirtilen talimatların takip edilmemesi; ve gümrüklere uygun yeterli garantilerin alınmaması. Banka, bir koşulu spekülatör olarak, Mudarabah şartını ihlal etme koşulu kapsamına dahil edilemez; takas sukuktaki 86 ve 30 (4/5) numaralı kararlarını, ihraç prospektüsünde sermaye garantisi veya toplu kar içermediğini onaylar; aksi takdirde koşul geçersiz sayılır ve spekülatör eşdeğer spekülatif spekülasyondan kâr alma hakkına sahiptir. Zarar talebinde ispat yükü, orijinal koşulun aksine, iddiaya aykırı kanıtlar olduğu sürece bankaya geçer; örneğin, spekülatörün beyanını kanıt sağlanana kadar kabul etmeme geleneği, vekil hakkındaki ücret ve yatırımcı fonlarını koruma yükümlülüğünün devredilmesi gibi deliller bulunur. Spekülatör banka, sözleşmede herhangi bir koşul olmaksızın kârın bir kısmını bağışlayabilir. Sorumluluğu belirlemekten sorumlu kuruluşlar arasında merkez bankaları ve İslami komiteleri, Dubai'deki Uluslararası İslami Uzlaşma ve Tahkim Merkezi gibi uzlaşma ve tahkim merkezleri, denetçiler ve Şeriat denetim organları yer alır. Tazminat, tamamen veya kısmen gerçek zararla sınırlıdır, kaybedilen kâr (alternatif fırsat) hariç tutulur, çünkü bu gerçekçi olmayan bir beklentidir. İslami bankaların fonları korumak için dikkatli olmalarını ve fonlar ile rezervler oluşturmalarını tavsiye etti ve İslam ülkelerini, mevduat fonları garanti kurumları kurmak veya İslami finansal kurumların katıldığı ve 200 (21/6) sayılı kararına göre yönetildiği takaful sigortasına dayalı yasaları değiştirmek için yasalar çıkarmaya çağırdı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sidang kedua puluh dua di Negara Kuwait (2–5 Jumada al-Akhirah 1436 H, 22–25 Maret 2015). Jaminan bank didefinisikan sebagai menanggung risiko kehilangan total atau sebagian dana nasabah dan pemegang rekening investasi. Ia menjelaskan bahwa kepemilikan bank atas uang tersebut berada di tangan jaminan (kepemilikan atau untuk kepentingan pemegang seperti pembeli, pemegang hipotek, dan peminjam) — termasuk deposito dengan permintaan, yang dikonfirmasi oleh Keputusan 86 (9/3) sebagai pinjaman dari perspektif yurisprudensi, dan bank memegang jaminan yang wajib mengembalikan atas permintaan — serta tangan trust (kepemilikan melalui kuasa dengan izin pemilik modal seperti deposan, penyewa, mitra, spekulan, dan pengawas abadi) — serta rekening investasi, yang merupakan modal spekulatif yang tunduk pada ketentuan mereka, dan beberapa di antaranya spekulan tidak dapat menjamin modalnya. Diputuskan bahwa bank spekulan tidak dapat menjamin kerugian total atau sebagian dalam rekening investasi kecuali melebihi, gagal, atau melanggar syarat. Kasus pelanggaran meliputi: kegagalan mematuhi peraturan Syariah yang diatur dalam kontrak pembukaan rekening; pelanggaran peraturan perbankan dan komersial serta bea cukai yang dikeluarkan oleh badan pengawas yang tidak bertentangan dengan Syariah; kegagalan melakukan studi kelayakan yang memadai bagi klien; pemilihan formula dan mekanisme yang tidak tepat; kegagalan mengikuti instruksi yang ditentukan; dan kegagalan memperoleh jaminan yang memadai sesuai bea cukai. Bank, sebagai spekulan dengan syarat, tidak boleh termasuk dalam syarat pelanggaran persyaratan Mudarabah, mengonfirmasi keputusan 86 dan 30 (4/5) dalam swap sukuk bahwa prospektus penerbitan tidak mencakup jaminan modal atau keuntungan sekaligus; jika tidak, syarat tersebut batal dan berhak atas keuntungan dari spekulasi spekulatif yang setara. Beban pembuktian dalam klaim kerugian beralih ke bank bertentangan dengan kondisi awal, asalkan ada bukti yang bertentangan dengan klaim tersebut, seperti kebiasaan tidak menerima pernyataan spekulan sampai bukti dibuktikan, dakwaan terhadap wali, dan kepentingan untuk memindahkan beban tersebut demi melindungi dana investor. Bank spekulan dapat menyumbangkan sebagian bagian keuntungannya tanpa syarat dalam kontrak. Entitas yang bertanggung jawab untuk menentukan tanggung jawab meliputi badan pengawas seperti bank sentral dengan komite Islam mereka, pusat rekonsiliasi dan arbitrase seperti International Islamic Reconciliation and Arbitration Center di Dubai, auditor, dan badan pengawas Syariah. Kompensasi dibatasi pada kerugian nyata, baik seluruhnya maupun sebagian, tidak termasuk kerugian laba (peluang alternatif), karena merupakan ekspektasi yang tidak realistis. Ia merekomendasikan agar bank-bank Islam berhati-hati dan membentuk dana serta cadangan untuk melindungi dana, serta menyerukan kepada negara-negara Islam untuk mengesahkan undang-undang pendirian lembaga penjaminan dana nasabah atau mengubah undang-undang berdasarkan asuransi takaful, di mana lembaga keuangan Islam berpartisipasi dan dikelola sesuai dengan resolusi 200 (21/6)."
