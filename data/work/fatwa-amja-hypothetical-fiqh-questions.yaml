summary:
  ar: "سأل سائل متابعة لسؤال سابق عن اتفاق المذاهب الأربعة على وجوب الجزاء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77698 بتاريخ 4 فبراير 2009)⁩ أن مبنى ذلك عندهم على أن قيم المتلفات يستوي فيها العمد والخطأ، ثم سأله: هل هذه الأسئلة تمثل نوازل يعيشها أم مجرد ترف وتزجية أوقات، فما أجمل أن يشتغل بما ينفعه ويوفر وقته وجهده لعبادة ربه وللتعرف عما نزل به من نوازل، أما ما لم ينزل به فليدعه فعند نزوله سيرزق الله ساعتها بفرج من عنده."
  en: "Following up on an earlier question about the four madhhabs' agreement on requiring compensation, the answerer was asked more. Dr. Salah al-Sawi (fatwa no. 77698, 4 February 2009) said its basis with them is that the value of destroyed property is alike for intent and error — then asked in turn whether these questions were actual cases he lived or mere pastime: how fine it is to occupy oneself with what benefits, sparing time and effort for worshipping one's Lord and learning what has actually befallen him; what has not befallen him he should leave, for when it befalls God will grant relief at its hour."
  ur: "ایک سائل نے مزید فرضی سوال پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77698، 4 فروری 2009)⁩ نے کہا کہ اصل سوالات کے جواب دے چکے مگر کیا یہ واقعی نوازل ہیں یا وقت گزارنا — مفید کام میں لگے اور جو واقع نہیں ہوا اسے چھوڑے۔"
  es: "Tras una pregunta anterior sobre el acuerdo de las cuatro escuelas jurídicas respecto a la exigencia de indemnización, se le hicieron más preguntas al que respondía. El Dr. Salah al-Sawi (fatwa n.º 77698, 4 de febrero de 2009) dijo que su fundamento para ellos es que el valor de la propiedad destruida es el mismo tanto por intención como por error; luego se le preguntó a su vez si estas preguntas eran casos reales que había vivido o un mero pasatiempo: qué bueno es ocuparse de qué beneficios, dedicando tiempo y esfuerzo a adorar a su Señor y a aprender lo que realmente le ha sucedido; lo que no le ha sucedido debe dejarlo, pues cuando suceda Dios concederá alivio en su momento."
