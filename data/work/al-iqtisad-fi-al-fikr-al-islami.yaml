label:
  ar: "الاقتصاد في الفكر الإسلامي"
  en: "al-Iqtisad fi al-Fikr al-Islami (Economics in Islamic Thought)"
  ur: "الاقتصاد فی الفکر الاسلامی"
summary:
  ar: "الجزء الرابع من «موسوعة الحضارة الإسلامية» لأحمد شلبي، يعرض فيه مبادئ الإسلام الاقتصادية، ويناقش القضايا الحديثة من الربا والبنوك وشهادات الاستثمار والتأمين والبورصة، ويؤرخ لبيت المال وموارده، ويقارن الاقتصاد الإسلامي بالشيوعية والرأسمالية والاشتراكية. ويذهب فيه إلى أن الربا المحرم مرتبط بالقروض، وإلى إباحة عائد شهادات الاستثمار، وهو رأيه ومنسوب إليه. {cite:iqtisad-fikr-islami-shalabi-1993 p.12} {cite:iqtisad-fikr-islami-shalabi-1993 p.13} {cite:iqtisad-fikr-islami-shalabi-1993 p.14} {cite:iqtisad-fikr-islami-shalabi-1993 p.141}"
  en: "Volume 4 of Ahmad Shalabi's Mawsu'at al-Hadara al-Islamiyya, setting out Islam's economic principles, discussing modern questions of riba, banks, investment certificates, insurance and the stock exchange, giving a history of the treasury and its revenues, and comparing Islamic economics with communism, capitalism and socialism. In it he argues that forbidden riba is tied to loans and that the return on investment certificates is permissible; this is his view, attributed to him."
  ur: "احمد شلبی کی «موسوعۃ الحضارۃ الاسلامیہ» کی چوتھی جلد، جس میں وہ اسلام کے معاشی اصول بیان کرتے ہیں، ربا، بینکوں، سرمایہ کاری سرٹیفکیٹ، بیمہ اور بازارِ حصص کے جدید مسائل پر بحث کرتے ہیں، بیت المال اور اس کے وسائل کی تاریخ لکھتے ہیں، اور اسلامی معیشت کا اشتراکیت، سرمایہ داری اور سوشلزم سے موازنہ کرتے ہیں۔ اس میں ان کا موقف ہے کہ حرام ربا قرضوں سے متعلق ہے اور سرمایہ کاری سرٹیفکیٹ کا منافع جائز ہے؛ یہ ان کی رائے ہے اور انہی کی طرف منسوب ہے۔"
