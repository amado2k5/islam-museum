summary:
  ar: "كتاب لأبي طالب المكي في أعمال القلوب ومقامات السالكين، كالصبر والشكر والحب والتوكل والتوحيد؛ يذكر ابن تيمية أن إحياء علوم الدين للغزالي تبع له في هذه الأبواب، وأن أبا طالب أعلم بالحديث والأثر وكلام أهل علوم القلوب وكلامه أسد وأبعد عن البدعة، مع أن في كتابه أحاديث ضعيفة وموضوعة وأشياء مردودة."
  en: "A book by Abu Talib al-Makki on the works of the heart and the stations of the wayfarers – patience, gratitude, love, reliance, tawhid. Ibn Taymiyya says that al-Ghazali's Ihya' 'Ulum al-Din follows it in these chapters, that Abu Talib knew hadith, reports and the words of the masters of the sciences of the heart better and wrote more soundly and further from innovation, though his book contains weak and fabricated hadiths and many things to be rejected."
  es: "Un libro de Abu Talib al-Makki sobre las obras del corazón y las etapas de los caminantes: paciencia, gratitud, amor, confianza, tawhid. Ibn Taymiyya afirma que el Ihya' 'Ulum al-Din de al-Ghazali lo sigue en estos capítulos, que Abu Talib conocía mejor los hadices, los relatos y las palabras de los maestros de las ciencias del corazón, y escribió con mayor solidez y más alejado de las innovaciones, aunque su libro contiene hadices débiles y fabricados, y muchas cosas que deben rechazarse."
  fr: "Un livre d'Abu Talib al-Makki sur les œuvres du cœur et les étapes du chemin spirituel: la patience, la gratitude, l'amour, la confiance et le tawhid. Ibn Taymiyya affirme que l'ouvrage d'al-Ghazali, Ihya' 'Ulum al-Din, reprend ces chapitres, et qu'Abu Talib connaissait mieux les hadiths, les récits et les paroles des maîtres des sciences du cœur, et qu'il écrivait avec plus de rigueur et moins d'innovation, bien que son livre contienne des hadiths faibles et forgés, ainsi que de nombreux éléments à rejeter."
  ur: "ابو طالب المکی کی ایک کتاب دل کے کاموں اور مسافروں کے مقامات پر - صبر، شکر، محبت، توکل، توحید۔ ابن تیمیہ کہتے ہیں کہ الغزالی کی احیاء العلوم الدین نے ان ابواب میں اس کی پیروی کی ہے کہ ابو طالب حدیث، روایت اور علوم قلب کے ماہرین کے کلام کو بہتر جانتے تھے اور زیادہ صحیح اور بدعت سے زیادہ لکھتے تھے، حالانکہ ان کی کتاب میں ضعیف اور من گھڑت احادیث ہیں اور بہت سی چیزیں رد کی گئی ہیں۔"
