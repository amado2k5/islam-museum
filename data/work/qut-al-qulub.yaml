summary:
  ar: "كتاب لأبي طالب المكي في أعمال القلوب ومقامات السالكين، كالصبر والشكر والحب والتوكل والتوحيد؛ يذكر ابن تيمية أن إحياء علوم الدين للغزالي تبع له في هذه الأبواب، وأن أبا طالب أعلم بالحديث والأثر وكلام أهل علوم القلوب وكلامه أسد وأبعد عن البدعة، مع أن في كتابه أحاديث ضعيفة وموضوعة وأشياء مردودة."
  en: "A book by Abu Talib al-Makki on the works of the heart and the stations of the wayfarers – patience, gratitude, love, reliance, tawhid. Ibn Taymiyya says that al-Ghazali's Ihya' 'Ulum al-Din follows it in these chapters, that Abu Talib knew hadith, reports and the words of the masters of the sciences of the heart better and wrote more soundly and further from innovation, though his book contains weak and fabricated hadiths and many things to be rejected."
