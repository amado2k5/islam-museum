summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السابعة ⁦(مكة، مايو 1992م)⁩: عقد الاستصناع — وهو عقد وارد على العمل والعين في الذمة — ملزم للطرفين إذا توافرت فيه الأركان والشروط، ويشترط فيه بيان جنس المستصنع ونوعه وقدره وأوصافه المطلوبة وأن يحدد فيه الأجل، ويجوز تأجيل الثمن كله أو تقسيطه على ما فصّل."
  en: "IIFA's seventh-session resolution (Mecca, May 1992) on istisna': the manufacture-order contract — covering work and a described item owed — binds both parties once its pillars and conditions hold; it requires specifying the manufactured item's kind, type, quantity and required features plus a stated term; the whole price may be deferred or instalments set, as detailed."
  ur: "اکیڈمی کی ساتویں مجلس کی قرارداد ⁦(مکہ، مئی 1992ء)⁩ استصناع پر: یہ عقد دونوں فریقوں پر لازم ہے بشرط جنس، قسم، مقدار اور مدت کی وضاحت ہو؛ قیمت مؤخر یا اقساط ہو سکتی ہے۔"
