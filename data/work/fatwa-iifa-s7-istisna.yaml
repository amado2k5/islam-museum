label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن عقد الاستصناع", en: "IIFA resolution on the istisna' (manufacture-order) contract", ur: "اکیڈمی کی قرارداد: استصناع کا معاہدہ", es: "Resolución de la IIFA sobre el contrato de istisna' (orden de fabricación).", fr: "Résolution de l'IIFA sur le contrat istisna' (commande de fabrication)", tr: "Uluslararası İslami Fiqh Akademisi'nin İstisna sözleşmesine ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai kontrak Istisna" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السابعة ⁦(مكة، مايو 1992م)⁩: عقد الاستصناع — وهو عقد وارد على العمل والعين في الذمة — ملزم للطرفين إذا توافرت فيه الأركان والشروط، ويشترط فيه بيان جنس المستصنع ونوعه وقدره وأوصافه المطلوبة وأن يحدد فيه الأجل، ويجوز تأجيل الثمن كله أو تقسيطه على ما فصّل."
  en: "IIFA's seventh-session resolution (Mecca, May 1992) on istisna': the manufacture-order contract — covering work and a described item owed — binds both parties once its pillars and conditions hold; it requires specifying the manufactured item's kind, type, quantity and required features plus a stated term; the whole price may be deferred or instalments set, as detailed."
  ur: "اکیڈمی کی ساتویں مجلس کی قرارداد ⁦(مکہ، مئی 1992ء)⁩ استصناع پر: یہ عقد دونوں فریقوں پر لازم ہے بشرط جنس، قسم، مقدار اور مدت کی وضاحت ہو؛ قیمت مؤخر یا اقساط ہو سکتی ہے۔"
  es: "Resolución de la séptima sesión de la IIFA (La Meca, mayo de 1992) sobre istisna': el contrato de pedido de fabricación, que abarca el trabajo y un artículo descrito adeudado, vincula a ambas partes una vez que se cumplen sus pilares y condiciones; requiere especificar el tipo, la cantidad y las características requeridas del artículo fabricado, además de un plazo determinado; el precio total puede diferirse o establecerse en cuotas, según se detalla."
  fr: "Résolution de la septième session de l'IIFA (La Mecque, mai 1992) sur l'istisna': le contrat de commande de fabrication — couvrant le travail et un article décrit dû — lie les deux parties une fois que ses piliers et conditions sont respectés; il exige de préciser la nature, le type, la quantité et les caractéristiques requises de l'article fabriqué, ainsi qu'une durée déterminée; le prix total peut être différé ou échelonné, comme détaillé."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin yedinci oturumunda (Mekke, Mayıs 1992) karar alışı: İstisna sözleşmesi — borçlu iş ve mülke uygulanan bir sözleşme — şartlar ve koşullar sağlandığında her iki taraf için de bağlayıcıdır. Üretilen ürünün türünü, türünü, değerini ve gerekli özelliklerini belirtir, son tarihi belirtir ve tam fiyatı belirtir. Tam fiyat ertelenebilir veya belirtilen şekilde taksitler halinde ödenebilir."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi ketujuhnya (Mekah, Mei 1992): Kontrak Istisna — kontrak yang berlaku untuk pekerjaan dan properti dalam utang — mengikat kedua pihak jika unsur dan ketentuan terpenuhi. Kontrak ini menetapkan jenis, jenis, nilai, dan karakteristik yang diperlukan dari barang yang diproduksi, menetapkan tenggat waktu, dan menetapkan harga penuh. Harga penuh dapat ditunda atau dibayar secara cicilan sesuai dengan ketentuan yang ditentukan."
