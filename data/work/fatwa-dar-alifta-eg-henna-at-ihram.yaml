id: work/fatwa-dar-alifta-eg-henna-at-ihram
class: work
kind: fatwa
label: { ar: "حكم اختضاب المرأة بالحناء عند الإحرام", en: "A woman dyeing with henna when entering ihram", ur: "احرام کے وقت عورت کا حنا لگانا", es: "Una mujer tiñéndose con henna al entrar en estado de ihram.", fr: "Une femme se teint au henné en entrant en ihram", tr: "İhram sırasında kına boyayan bir kadının hakkındaki karar", id: "Putusan tentang seorang wanita yang mewarnai dengan henna selama Ihram" }
summary:
  ar: "سائل سأل عن اختضاب المرأة بالحناء عند الإحرام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23936)⁩ أنه يجوز للمرأة أن تختضب بالحناء عند الإحرام بحج أو عمرة، سواء كانت الحناء مما يبقى لونها ورائحتها بعد الإحرام أو لا، وإن كان الأولى أن يكون ذلك قبل الإحرام كما فصّل الجواب."
  en: "A questioner asked about a woman dyeing with henna at ihram. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23936) answered that a woman may dye with henna when entering ihram for Hajj or umrah — whether or not her henna's colour and scent persist into ihram — though it is preferable she do it before ihram, as the answer details."
  ur: "ایک سائل نے احرام کے وقت عورت کے حنا لگانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23936)⁩ نے جواب دیا کہ عورت حج یا عمرہ کے احرام میں داخل ہوتے وقت حنا لگا سکتی ہے — خواہ حنا کا رنگ اور خوشبو احرام کے بعد باقی رہے یا نہ — البتہ بہتر یہی ہے کہ احرام سے پہلے کر لے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la posibilidad de que una mujer se tiña con henna durante el estado de ihram. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23936) respondió que una mujer puede teñirse con henna al entrar en estado de ihram para el Hajj o la Umrah, independientemente de si el color y el aroma de la henna persisten durante el ihram, aunque es preferible que lo haga antes del ihram, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la teinture au henné pour femmes en état d'ihram. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23936) a répondu qu'une femme peut se teindre les cheveux au henné au moment d'entrer en ihram pour le Hajj ou la Omra — que la couleur et le parfum du henné persistent ou non pendant l'ihram —, bien qu'il soit préférable qu'elle le fasse avant, comme le précise la réponse."
  tr: "Bir soru soran kişi, ihram sırasında kına boyayan bir kadın hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 23936), bir kadının Hac veya Umre sırasında ihram sırasında kına boyamasının izin olduğunu, kına ihramdan sonra renk ve koku içinde kalsa da olmasa da boyanmasının caiz olduğunu yanıtladı; ancak cevapta açıklandığı gibi ihramdan önce boyamak tercih edilir."
  id: "Seorang penanya menanyakan tentang seorang wanita yang mewarnai dengan henna selama Ihram. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 23936) menjawab bahwa diperbolehkan bagi seorang wanita untuk mewarnai dengan henna selama Ihram selama Haji atau Umrah, baik henna tetap berwarna dan berbau setelah Ihram atau tidak, meskipun lebih baik melakukannya sebelum Ihram seperti yang dijelaskan dalam jawaban."
