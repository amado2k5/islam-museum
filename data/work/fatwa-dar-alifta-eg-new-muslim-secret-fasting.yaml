label: { ar: "حكم الصيام بالنسبة لمسلمة جديدة تصوم سرًا", en: "A new Muslim woman fasting in secret", ur: "نومسلم عورت کا خفیہ روزہ", es: "Una nueva mujer musulmana ayuna en secreto" }
summary:
  ar: "سائلة مسلمة جديدة تصوم سرًا خشية أهلها فسألت عن صحة صومها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21770)⁩ أنه إذا تم الصوم بأركانه وشروطه من وجود النية والإمساك عن المفطرات في وقته المحدد شرعًا ولم يكن عندها ما يمنع صحته فصومها صحيح على ما فصّل الجواب."
  en: "A new Muslim woman fasting in secret for fear of her family asked about her fast's validity. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21770) answered that if the fast is completed with its pillars and conditions — the intention and abstaining from the breakers in its lawful time — and nothing prevents its validity, her fast is valid, as the answer details."
  ur: "نومسلم عورت اپنے گھر والوں کے خوف سے خفیہ روزہ رکھتی ہے؛ اس نے اس کی صحت پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21770)⁩ نے جواب دیا کہ اگر روزہ اپنی شرائط — نیت اور مقررہ وقت میں مفطرات سے پرہیز — کے ساتھ مکمل ہو تو وہ درست ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una mujer musulmana que ayunaba en secreto por temor a su familia preguntó sobre la validez de su ayuno. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21770) respondió que si el ayuno se completa con sus pilares y condiciones —la intención y la abstención de los alimentos que lo rompen en su tiempo lícito— y nada impide su validez, su ayuno es válido, como se detalla en la respuesta."
