id: work/fatwa-dar-alifta-eg-praying-at-home-in-rain
class: work
kind: fatwa
label: { ar: "حكم الصلاة في البيوت حال المطر", en: "Praying at home when it rains", ur: "بارش کے وقت گھر میں نماز پڑھنا", es: "Orar en casa cuando llueve" }
summary:
  ar: "سائل سأل عن الصلاة في البيت حين يصعب الصلاة مع الجماعة في مسجد بلدته في الشتاء عند سقوط الأمطار. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21648)⁩ أنه يجوز شرعًا للمسلم أن يصلي في بيته حين يصعب عليه الصلاة مع الجماعة في المسجد عند المطر الشديد على ما فصّل الجواب."
  en: "A questioner asked about praying at home when attending congregational prayer at his town's mosque in winter rain is hard. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21648) answered that a Muslim may pray at home when joining the congregation at the mosque is difficult in heavy rain — as the answer details."
  ur: "ایک سائل نے پوچھا کہ سردیوں میں موسلادھار بارش کے وقت گھر میں نماز پڑھنا جائز ہے یا نہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21648)⁩ نے جواب دیا کہ جب مسجد جانا مشکل ہو تو گھر میں نماز پڑھنا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de rezar en casa cuando resulta difícil asistir a la oración en congregación en la mezquita de su ciudad durante el invierno. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21648) respondió que un musulmán puede rezar en casa cuando le resulta difícil unirse a la congregación en la mezquita debido a las fuertes lluvias, tal como se detalla en la respuesta."
