label:
  ar: "برنامج طريق النور ⁦(دروس رمضان)⁩"
  en: "Tariq al-Noor (Ramadan lessons)"
  ur: "پروگرام طریق النور ⁦(رمضان کے اسباق)⁩"
summary:
  ar: "برنامج رمضاني يومي لعمر عبد الكافي من ثلاثين حلقة قصيرة، يدعو فيه إلى السير في «طريق النور» أي طريق الكتاب والسنة بعيدا عن البدع والأهواء، ويتناول في كل حلقة موضوعا أخلاقيا أو إيمانيا واحدا."
  en: "A daily Ramadan programme of thirty short episodes by Omar Abdelkafy, inviting listeners to walk the 'path of light', which he defines as the way of the Qur'an and the sunna away from innovation and whims, with one ethical or devotional theme in each episode."
  ur: "عمر عبد الکافی کا رمضان کا روزانہ پروگرام، تیس مختصر اقساط پر مشتمل۔ وہ سننے والوں کو «طریق النور» پر چلنے کی دعوت دیتے ہیں، یعنی قرآن اور سنت کا راستہ، بدعت اور خواہشات سے دور۔ ہر قسط میں ایک اخلاقی یا ایمانی موضوع ہے۔"
