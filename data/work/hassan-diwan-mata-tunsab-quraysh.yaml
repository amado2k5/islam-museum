summary:
  ar: "أبيات لحسان بن ثابت من الوافر الأول على روي الباء، يقدّمها شرح البرقوقي بقوله «وقال للوليد بن المغيرة» ويذكر بحرها في رأسها {{cite:sharh-diwan-hassan-barquqi-1929 p.58}}. الهجاء وصف أدبي من الديوان ولا يتبنى المتحف حكمه."
  en: "Verses by Hassan ibn Thabit in the first wafir on the rhyme ba, introduced in al-Barquqi's commentary as \"and he said to al-Walid ibn al-Mughira\", with the metre stated in the heading {{cite:sharh-diwan-hassan-barquqi-1929 p.58}}. The satire is reported as a literary text; the museum does not adopt its judgement."
