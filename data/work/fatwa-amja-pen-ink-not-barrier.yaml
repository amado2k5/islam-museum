id: work/fatwa-amja-pen-ink-not-barrier
class: work
kind: fatwa
label: { ar: "حبر القلم لا يمنع الوضوء", en: "Pen ink is no barrier — the wudu stands", ur: "قلم کی سیاہی رکاوٹ نہیں — وضو درست", es: "La tinta del bolígrafo no es un obstáculo: el wudu permanece", fr: "L'encre du stylo n'est pas un obstacle — les ablutions restent valides", tr: "Kalemin mürekkebi abdest almayı engellemez", id: "Tinta pena tidak menghalangi wudhu" }
summary:
  ar: "سأل سائل هل يجوز الوضوء وعلى يده حبر قلم جاف أم لا يجوز. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21934 بتاريخ 11 سبتمبر 2005)⁩ أن الحبر ليس طبقة عازلة ولا يمنع وصول الماء وعليه فالوضوء صحيح والصلاة صحيحة على ما فصّل الجواب."
  en: "A questioner asked whether wudu is valid with dry pen ink on his hand. Dr. Salah al-Sawi (fatwa no. 21934, 11 September 2005) answered that ink is not an insulating layer and does not bar the water's arrival; so the wudu is sound and the prayer sound — as the answer states."
  ur: "ہاتھ پر سیاہی ہو تو وضو؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21934، 11 ستمبر 2005)⁩ کے مطابق سیاہی روک نہیں — وضو اور نماز دونوں درست۔"
  es: "Un consultante preguntó si la ablución (wudu) es válida con tinta seca en la mano. El Dr. Salah al-Sawi (fatwa n.° 21934, 11 de septiembre de 2005) respondió que la tinta no es una capa aislante y no impide la entrada del agua; por lo tanto, la ablución es válida y la oración también, tal como se indica en la respuesta."
  fr: "Un homme a demandé si les ablutions (wudu) étaient valides avec de l'encre de stylo sèche sur la main. Le Dr Salah al-Sawi (fatwa n° 21934, 11 septembre 2005) a répondu que l'encre ne forme pas une couche isolante et n'empêche pas l'eau de pénétrer; les ablutions et la prière sont donc valides, comme l'indique la réponse."
  tr: "Bir soru soran, tükenmez mürekkep tutarken abdest almanın izin olup olmadığını sordu. Dr. Salah Al-Sawy (11 Eylül 2005 tarihli Fetva No. 21934) mürekkebin yalıtıcı bir tabaka olmadığını ve suyun suya ulaşmasını engellemediğini, bu nedenle abdestmenin geçerli olduğunu ve namazın ayrıntılı cevaba göre geçerli olduğunu söyledi."
  id: "Seorang penanya bertanya apakah diperbolehkan melakukan wudhu sambil memegang tinta bolpoin atau tidak. Dr. Salah Al-Sawy menjawab (Fatwa No. 21934 tanggal 11 September 2005) bahwa tinta bukanlah lapisan isolasi dan tidak mencegah air mencapai air, sehingga wudhu sah dan doa sah menurut jawaban rinci."
