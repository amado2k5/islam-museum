id: work/fatwa-amja-prophet-parents-faith
class: work
kind: fatwa
label: { ar: "عقيدة والدي النبي", en: "The faith of the Prophet's parents — a question best left", ur: "نبی کے والدین کا ایمان — ترک ہی بہتر", es: "La fe de los padres del Profeta: una cuestión que es mejor dejar para después.", fr: "La foi des parents du Prophète — une question qu'il vaut mieux laisser sans réponse", tr: "Peygamber'in babasının doktrini", id: "Doktrin ayah Nabi" }
summary:
  ar: "سأل سائل عن رأي يقول إن أجداد النبي ووالديه كانوا على دين النبي إبراهيم موحدين مستدلاً بآية وتقلبك في الساجدين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77070 بتاريخ 9 ديسمبر 2008)⁩ أن الراجح في هذه المسألة خلاف ذلك، ونصحه بعدم تشقيق القول في هذه القضية وأمثالها لأن الخلاف حولها يثير سخائم النفوس وهي في ذاتها ليس مما ينبني عليه عمل، وخشي أن يكون الخوض فيها من التكلف الذي نهينا عنه فليشتغل بما ينفعه."
  en: "A questioner raised the view that the Prophet's ancestors and parents were on Ibrahim's religion, monotheists, citing 'and your going about among the prostrate'. Dr. Salah al-Sawi (fatwa no. 77070, 9 December 2008) answered that the preponderant view is otherwise, and advised him not to split words over this question and its like — the dispute around it stirs souls' rancour and nothing of action rests on it; he feared wading into it was the needless exertion we were forbidden, and counselled occupying oneself with what benefits."
  ur: "ایک سائل نے نبی کے والدین کی عقیدت پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77070، 9 دسمبر 2008)⁩ کے مطابق راجح قول اس کے خلاف ہے اور اس نے اختلافی غیرعملی بحثوں میں نہ پڑنے کی نصیحت کی۔"
  es: "Un interlocutor planteó la opinión de que los antepasados y padres del Profeta profesaban la religión de Ibrahim, monoteístas, citando «y tu andar entre los postrados». El Dr. Salah al-Sawi (fatwa n.º 77070, 9 de diciembre de 2008) respondió que la opinión predominante es la contraria y le aconsejó que no se anduviera con rodeos sobre esta cuestión ni sobre otras similares, pues la disputa en torno a ella aviva el rencor y no tiene fundamento alguno; temía que adentrarse en ella fuera un esfuerzo innecesario que nos estaba prohibido, y le recomendó que se ocupara de lo que le reportaría beneficios."
  fr: "Un interrogateur a soulevé l'idée que les ancêtres et les parents du Prophète étaient monothéistes, adeptes de la religion d'Ibrahim, citant le verset « et votre manière de vous prosterner ». Le Dr Salah al-Sawi (fatwa n° 77070, 9 décembre 2008) a répondu que l'avis prépondérant est différent et lui a conseillé de ne pas polémiquer sur cette question et d'autres semblables; les disputes à ce sujet attisent les rancœurs et n'entraînent aucune action concrète. Il craignait que s'y engager ne soit un effort inutile qui nous était interdit et a recommandé de se consacrer à des activités plus profitables."
  tr: "Bir soru soran, Peygamber'in atalarının ve ebeveynlerinin Peygamber İbrahim'in tek tanrılı olduğu yönünde, bir ayet ve secdelerdeki tutarsızlığınızı gösteren bir görüş soruldu. Dr. Salah Al-Sawi (9 Aralık 2008 tarihli 77070 sayılı fetva) bu konuda yaygın görüşün farklı olduğunu ve bu konuda ve benzeri konularda anlaşmazlık yaratmamasını tavsiye etti; çünkü bu konuda anlaşmazlık insanlarda şikayet uyandırır ve bu da kendi başına eylem için bir temel değildir. Buna dalmanın yasakladığımız aşırı bir bahane olacağından korktu, bu yüzden kendisine fayda sağlayacak şeyler üzerinde çalışması gerektiğini belirtti."
  id: "Seorang penanya diminta pendapat yang menyatakan bahwa leluhur dan orang tua Nabi adalah monetik Nabi Abraham, dengan mengutip sebuah ayat dan ketidakkonsistenan Anda dalam sujud. Dr. Salah Al-Sawi menjawab (Fatwa No. 77070 tanggal 9 Desember 2008) bahwa pandangan yang berlaku tentang hal ini berbeda, dan menyarankan agar tidak berbeda pendapat dalam isu ini dan isu serupa, karena ketidaksepakatan tentang hal ini menimbulkan keluhan dalam masyarakat, yang pada dasarnya bukan dasar untuk bertindak. Ia khawatir bahwa menyelidiki hal ini akan menjadi kepura-puraan berlebihan yang kita larang, jadi ia harus bekerja pada apa yang menguntungkannya."
