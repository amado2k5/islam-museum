id: work/fatwa-amja-prophet-parents-faith
class: work
kind: fatwa
label: { ar: "عقيدة والدي النبي", en: "The faith of the Prophet's parents — a question best left", ur: "نبی کے والدین کا ایمان — ترک ہی بہتر" }
summary:
  ar: "سأل سائل عن رأي يقول إن أجداد النبي ووالديه كانوا على دين النبي إبراهيم موحدين مستدلاً بآية وتقلبك في الساجدين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77070 بتاريخ 9 ديسمبر 2008)⁩ أن الراجح في هذه المسألة خلاف ذلك، ونصحه بعدم تشقيق القول في هذه القضية وأمثالها لأن الخلاف حولها يثير سخائم النفوس وهي في ذاتها ليس مما ينبني عليه عمل، وخشي أن يكون الخوض فيها من التكلف الذي نهينا عنه فليشتغل بما ينفعه."
  en: "A questioner raised the view that the Prophet's ancestors and parents were on Ibrahim's religion, monotheists, citing 'and your going about among the prostrate'. Dr. Salah al-Sawi (fatwa no. 77070, 9 December 2008) answered that the preponderant view is otherwise, and advised him not to split words over this question and its like — the dispute around it stirs souls' rancour and nothing of action rests on it; he feared wading into it was the needless exertion we were forbidden, and counselled occupying oneself with what benefits."
  ur: "ایک سائل نے نبی کے والدین کی عقیدت پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77070، 9 دسمبر 2008)⁩ کے مطابق راجح قول اس کے خلاف ہے اور اس نے اختلافی غیرعملی بحثوں میں نہ پڑنے کی نصیحت کی۔"
