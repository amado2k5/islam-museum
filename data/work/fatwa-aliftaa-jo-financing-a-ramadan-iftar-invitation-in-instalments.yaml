id: work/fatwa-aliftaa-jo-financing-a-ramadan-iftar-invitation-in-instalments
class: work
kind: fatwa
label: { ar: "تقسيط عزومة رمضان عبر شركة تمويل", en: "Financing a Ramadan iftar invitation in instalments", ur: "رمضان کی افطار دعوت قسطوں پر فنانس کرنا" }
summary:
  ar: "سؤال عن تقسيط عزومة رمضان عبر شركة تمويل، أجابت فيه دائرة الإفتاء العام الأردنية بأن صلة الرحم تكون بحسب القدرة والأفضل عدم التكلف بالاستدانة لها؛ فالقرض الربوي حرام، والقرض الحسن والمرابحة المنضبطة غير محرمين مع ما فيهما من تكلف، ويحرم الاقتراض إن أدى إلى التقتير على العيال أو كانت الوليمة للمباهاة. أجابت الدائرة بأن الإسلام حث على صلة الرحم، واستشهدت بحديث متفق عليه عن أنس بن مالك معناه أن من أحب أن يبسط له في رزقه ويؤخر في أجله فليصل أرحامه، وقالت إن الصلة تكون بحسب القدرة؛ فمن استطاع دعوة أرحامه للإفطار فذلك حسن، ومن لم يستطع فالأفضل ألا يتكلف ويستدين، وتكفي زيارتهم والسلام عليهم. وقالت إن من تكلف الاستدانة لوليمة الإفطار نظر في طريقها: فإن كانت بقرض ربوي فهي حرام، واستدلت بحديث رواه مسلم عن جابر بن عبد الله في لعن آكل الربا وموكله وكاتبه وشاهديه؛ وإن كانت بقرض حسن أو مرابحة موافقة للضوابط الشرعية فلا تحرم، لكنه كلف نفسه فوق طاقتها خاصة إن لم يسمح وضعه بالسداد. وأضافت أن القرض يحرم إن أدى إلى التقتير في النفقة على العيال، واستدلت بحديث رواه أبو داود معناه أنه يكفي المرء إثمًا أن يضيع من يقوت، كما تحرم الوليمة إن كانت للمباهاة والتفاخر والرياء."
  en: "A question about financing a Ramadan iftar invitation in instalments, in which Jordan's General Iftaa Department answered that maintaining kinship ties is according to one's means and it is better not to burden oneself with debt for it; an interest-bearing loan is forbidden, an interest-free loan or compliant murabaha is not forbidden though burdensome, and borrowing is forbidden if it leads to stinting on one's dependants or the feast is for showing off. The Department answered that Islam encourages maintaining kinship ties, citing a hadith agreed upon by al-Bukhari and Muslim from Anas ibn Malik whose meaning is that whoever wishes his provision to be expanded and his life extended should maintain his ties of kinship; such ties are according to one's means: inviting relatives to iftar is good for whoever can afford it, but whoever cannot should not overburden himself or borrow, and visiting and greeting them suffices. It said that if someone does borrow for the iftar feast, the means matters: an interest-bearing loan is forbidden, citing a hadith narrated by Muslim from Jabir ibn Abdullah about the curse on whoever consumes riba, pays it, records it or witnesses it; an interest-free loan or a murabaha meeting Shari'a standards is not forbidden, though he has burdened himself beyond his capacity, especially if his finances do not allow repayment. It added that the loan is forbidden if it leads to stinting on spending for his family, citing a hadith narrated by Abu Dawud whose meaning is that it is sin enough for a person to neglect those he must provide for, and the feast is likewise forbidden if held for showing off, boasting or display."
  ur: "رمضان کی افطار دعوت قسطوں پر فنانس کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ صلہ رحمی استطاعت کے مطابق ہے اور اس کے لیے قرض لے کر خود پر بوجھ نہ ڈالنا بہتر ہے؛ سودی قرض حرام ہے، قرضِ حسن یا شرعی ضوابط والی مرابحہ حرام نہیں مگر بوجھ ہے، اور اگر قرض اہل و عیال کے خرچ میں تنگی کا سبب بنے یا دعوت دکھاوے کے لیے ہو تو حرام ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے صلہ رحمی پر ابھارا ہے، اور انس بن مالک سے متفق علیہ حدیث کا حوالہ دیا جس کا مفہوم ہے کہ جو چاہے کہ اس کا رزق کشادہ اور عمر دراز ہو وہ صلہ رحمی کرے؛ صلہ رحمی استطاعت کے مطابق ہے: جو استطاعت رکھے اس کا رشتہ داروں کو افطار پر بلانا اچھا ہے، اور جو نہ رکھے وہ تکلف اور قرض نہ لے، ان سے ملنا اور سلام کرنا کافی ہے۔ اس نے کہا کہ اگر کوئی افطار کی دعوت کے لیے قرض لے تو طریقہ دیکھا جائے گا: سودی قرض حرام ہے، اور مسلم کی جابر بن عبداللہ سے روایت کردہ حدیث سے استدلال کیا کہ سود کھانے، کھلانے، لکھنے اور اس کے گواہوں پر لعنت کی گئی؛ قرضِ حسن یا شرعی ضوابط کے مطابق مرابحہ حرام نہیں، مگر اس نے خود پر طاقت سے زیادہ بوجھ ڈالا، خاص طور پر اگر اس کی مالی حالت ادائیگی کی اجازت نہ دے۔ اس نے مزید کہا کہ اگر قرض گھر والوں کے خرچ میں تنگی کا باعث بنے تو حرام ہے، اور ابو داود کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ آدمی کے گناہ کے لیے یہی کافی ہے کہ وہ اپنے زیرِ کفالت لوگوں کو ضائع کرے، اور اسی طرح دکھاوے، فخر اور ریا کے لیے دعوت بھی حرام ہے۔"
