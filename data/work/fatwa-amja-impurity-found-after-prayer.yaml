id: work/fatwa-amja-impurity-found-after-prayer
class: work
kind: fatwa
label: { ar: "نجاسة تُرى بعد الصلاة", en: "Impurity noticed on the garment after finishing the prayer", ur: "نماز کے بعد نجاست نظر آئے", es: "Se observó impureza en la prenda después de terminar la oración.", fr: "Impureté constatée sur le vêtement après la prière", tr: "Dua sonrası gördüğünüz kirlilik", id: "Ketidakmurnian yang kamu lihat setelah doa" }
summary:
  ar: "سأل سائل عن حكم الصلاة لمن وجد نجاسة في ثوبه بعد فراغه من الصلاة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86588 بتاريخ 16 مارس 2012)⁩ أن إزالة النجاسة عن محمول المصلي وبدنه واجب مع الذكر والقدرة فمن صلى وعلى ثوبه نجاسة ناسيًا أو عاجزًا عن إزالتها فصلاته صحيحة ولا تلزمه إعادة على ما فصّل الجواب."
  en: "A questioner asked the ruling for one who finds impurity on his garment after finishing the prayer. AMJA's fatwa committee (fatwa no. 86588, 16 March 2012) answered that removing impurity from the worshipper's clothing and body is obligatory where remembered and possible; one who prayed with impurity on his garment forgetfully or unable to remove it has a sound prayer with no repeat owed — as the answer details."
  ur: "بعد نماز نجاست ملی؟ لجنة الفتوى ⁦(فتویٰ 86588، 16 مارچ 2012)⁩ کے مطابق بھول یا عجز میں نماز درست — اعادہ نہیں۔"
  es: "Un consultante preguntó cuál es el dictamen para quien encuentra impurezas en su vestimenta después de terminar la oración. El comité de fatwas de AMJA (fatwa n.° 86588, 16 de marzo de 2012) respondió que es obligatorio eliminar las impurezas de la ropa y el cuerpo del orante cuando se recuerda y es posible; quien oró con impurezas en su vestimenta por olvido o incapacidad para eliminarlas, tiene una oración válida sin necesidad de repetirla, como se detalla en la respuesta."
  fr: "Un fidèle a demandé la décision concernant celui qui trouve une impureté sur son vêtement après avoir accompli la prière. Le comité des fatwas de l'AMJA (fatwa n° 86588, 16 mars 2012) a répondu que le dépoussiérage du corps et des vêtements du fidèle est obligatoire s'il s'en souvient et si cela est possible; celui qui a prié avec une impureté sur son vêtement par oubli ou par incapacité de l'enlever a une prière valide et n'a pas à la refaire, comme le précise la réponse."
  tr: "Bir soru soran, namazı bitirdikten sonra giysisinde kirlilik bulan kişi için namaz hakkındaki hükmü soruldu. Amerikan İslami Hukukçular Konseyi Fetva Komitesi (16 Mart 2012 tarihli Fetva No. 86588), ibadet edenin eşyalarından ve bedeninden kirin çıkarılmasının anma ve yetenek ile zorunlu olduğunu yanıtladı. Giysisinde kirli bir şey giyerek namaz kılan, onu unutan veya çıkaramayan kişi namaz kılarsa, namazı geçerlidir ve cevabında ayrıntılı olarak belirtildiği gibi tekrar etmek zorunda değildir."
  id: "Seorang penanya ditanya tentang aturan doa bagi seseorang yang menemukan kotoran dalam pakaiannya setelah selesai shalat. Komite Fatwa di American Council of Islamic Jurists (Fatwa No. 86588 tanggal 16 Maret 2012) menjawab bahwa menghilangkan kotoran dari barang dan tubuh jamaah adalah kewajiban dengan ingatan dan kemampuan. Siapa pun yang berdoa sambil mengenakan kotoran pada pakaiannya, lupa atau tidak mampu melepasnya, doanya sah dan tidak wajib mengulanginya, seperti yang dijelaskan dalam jawaban."
