summary:
  ar: "ديوان أبي الطيب المتنبي في طبعة دار بيروت (1983)، ويبدأ بمقدمة تعريفية بالشاعر تذكر مولده بالكوفة وإقامته بالشام ومصر وحلب وبغداد وشيراز، وتذكر أنه توفي سنة 354هـ {cite:diwan-mutanabbi-dar-beirut-1983 p.5}."
