  es: "El diwan de al-Mutanabbi en la edición de Dar Beirut (1983); comienza con una biografía introductoria del poeta que indica su muerte en el año 354 AH {cite:diwan-mutanabbi-dar-beirut-1983 p.5}."
  fr: "Le diwan d'al-Mutanabbi dans l'édition Dar Beirut (1983); il s'ouvre sur une biographie introductive du poète qui indique sa mort en 354 AH {cite:diwan-mutanabbi-dar-beirut-1983 p.5}."
  ur: "دار بیروت ایڈیشن میں المتنبی کا دیوان (1983)؛ اس کا آغاز شاعر کی تعارفی سوانح سے ہوتا ہے جس میں ان کی وفات 354 ہجری بتائی جاتی ہے {حوالہ:دیوان المتنبی دار بیروت-1983 صفحہ 5}۔"
  tr: "Beyrut Yayıncılık Binası baskısında (1983) Ebu el-Tayyib el-Mutanabbi'nin Diwanı, şairin Kufa'daki doğumunu ve Levant, Mısır, Halep, Bağdat ve Şiraz'daki ikametgahını belirten giriş girişiyle başlar ve 354 H yılında öldüğünü belirtir {cite:diwan-mutanabbi-dar-beirut-1983 s.5}."
  id: "Diwan Abu al-Tayyib al-Mutanabbi dalam edisi Beirut Publishing House (1983), dimulai dengan pengantar pengantar kepada penyair yang menyebutkan kelahirannya di Kufa dan kediamannya di Levant, Mesir, Aleppo, Baghdad, dan Shiraz, serta menyebutkan bahwa ia meninggal pada tahun 354 H {cite:diwan-mutanabbi-dar-beirut-1983 hlm.5}."
