summary:
  ar: "سائل سأل عن ذبح الأضحية أثناء خطبة العيد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20817)⁩ أنه إذا ذبح الرجل أضحيته أثناء خطبة العيد فإنها تجزئ عنه ولا حرج عليه في ذلك شرعًا."
  en: "A questioner asked about slaughtering the udhiyya during the Eid sermon. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20817) answered that if a man slaughters his sacrifice during the Eid sermon it suffices for him and there is no blame upon him in that."
  ur: "ایک سائل نے عید کے خطبے کے دوران قربانی ذبح کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20817)⁩ نے جواب دیا کہ ایسا کرنے سے قربانی کافی ہے اور کوئی حرج نہیں۔"
  es: "Un interlocutor preguntó sobre el sacrificio de la udhiyya durante el sermón del Eid. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20817) respondió que si un hombre sacrifica su animal durante el sermón del Eid, eso le basta y no hay culpa alguna en ello."
