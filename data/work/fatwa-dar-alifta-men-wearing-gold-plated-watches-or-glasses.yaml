id: work/fatwa-dar-alifta-men-wearing-gold-plated-watches-or-glasses
class: work
kind: fatwa
label: { ar: "حكم لبس الرجل لساعة أو نظارة مطلية بالذهب", en: "Men wearing a gold-plated watch or glasses", ur: "مرد کا سونے کی پالش والی گھڑی یا عینک پہننا", es: "Hombres que llevan un reloj o gafas chapadas en oro.", fr: "Des hommes portant une montre ou des lunettes plaquées or", tr: "Saat veya altın kaplama gözlük takan bir adamın kararı", id: "Putusan tentang seorang pria yang memakai jam tangan atau kacamata berlapis emas" }
summary:
  ar: "سؤال عن حكم لبس الرجل ساعةً أو نظارةً مطلية أو مموهة بالذهب، أجابت فيه دار الإفتاء المصرية بأنه لا مانع من ذلك إذا كان الطلاء مجرد لون لا أثر فيه للذهب، أو شيئًا يسيرًا لا يتخلص منه ذهب بإزالته، أما إن كان كثيرًا كطبقة سميكة أو كان بحيث لو أُذيب الشيء خلص منه الذهب فيحرم اللبس. بيّنت الدار تحريم الذهب على الرجال بحديث علي عند أبي داود أن الحرير والذهب حرام على ذكور الأمة وحديث أبي موسى الأشعري، وإجماع العلماء الذي نقله النووي على تحريم خاتم الذهب على الرجال، وأن النص يتعلق بالذهب الخالص أو الأساسي، وأن الفقهاء اختلفوا في المموه تبعًا لاختلافهم في علة التحريم: فالحنفية يجيزون بالاتفاق ما لا يتخلص منه شيء بالعرض على النار ويختلفون فيما يتخلص كما قال الكاساني وابن نجيم، والمالكية يحرمون ما كان الذهب فيه مساويًا لأصله أو أكثر ويكرهون الأقل كما قال الدردير والدسوقي، والشافعية في الأصح والحنابلة يجيزون القليل الذي لا يتخلص منه شيء بالعرض على النار ويحرمون ما تخلص منه لتحقق الخيلاء وكسر قلوب الفقراء كما قال الخطيب الشربيني والبهوتي، مع حديث معاوية في النهي عن لبس الذهب إلا مقطّعًا وشرح علي القاري، والمختار للفتوى حرمة ما يخلص منه الذهب خروجًا من الخلاف كما قال السيوطي."
  en: "A question about a man wearing a watch or glasses plated or gilded with gold; Dar al-Ifta al-Misriyya answered that there is no objection when the plating is mere colour with no trace of gold, or so slight that no gold would be recovered by removing it, but that wearing is forbidden when the gold is substantial, such as a thick layer, or when gold would be recovered if the item were melted down. Dar al-Ifta set out the prohibition of gold for men from Ali's hadith in Abu Dawud that silk and gold are forbidden to the men of the community and the hadith of Abu Musa al-Ash'ari, and the consensus reported by al-Nawawi forbidding gold rings for men; it noted that the text concerns pure gold or gold as the main material, and that the jurists differ on gilding according to their view of the reason for the prohibition: the Hanafis agree on permitting gilding from which nothing is recovered on exposure to fire and differ where something is recovered, as al-Kasani and Ibn Nujaym say; the Malikis forbid an item in which the gold equals or exceeds the base and dislike a smaller share, as al-Dardir and al-Dasuqi say; the Shafi'is in their sounder view and the Hanbalis permit a small amount from which nothing is recovered on exposure to fire and forbid what yields gold, since ostentation and the grieving of the poor are then present, as al-Khatib al-Shirbini and al-Buhuti say, together with Mu'awiya's hadith forbidding the wearing of gold except in small pieces and Ali al-Qari's explanation. The view chosen for the fatwa is that what would yield gold is forbidden, so as to avoid the disagreement, as al-Suyuti recommends."
  ur: "مرد کے سونے کی پالش یا ملمع والی گھڑی یا عینک پہننے کے بارے میں سوال؛ دار الافتاء مصر نے جواب دیا کہ جب پالش محض رنگ ہو جس میں سونے کا کوئی اثر نہ ہو، یا اتنی معمولی ہو کہ اتارنے سے سونا حاصل نہ ہو، تو کوئی رکاوٹ نہیں، لیکن جب سونا زیادہ ہو، جیسے موٹی تہہ، یا ایسا ہو کہ چیز کو پگھلانے سے سونا نکل آئے، تو پہننا حرام ہے۔ دار الافتاء نے مردوں پر سونے کی حرمت ابو داود کے پاس علی کی حدیث سے بیان کی کہ ریشم اور سونا امت کے مردوں پر حرام ہیں اور ابو موسیٰ اشعری کی حدیث سے، اور نووی کے نقل کردہ اجماع سے جو مردوں پر سونے کی انگوٹھی حرام کرتا ہے؛ اس نے ذکر کیا کہ نص خالص سونے یا بنیادی مادے کے طور پر سونے سے متعلق ہے، اور فقہا ملمع میں حرمت کی علت کے اختلاف کے مطابق مختلف ہیں: حنفیہ اس ملمع کے جواز پر متفق ہیں جس سے آگ پر رکھنے سے کچھ حاصل نہ ہو اور جس سے کچھ حاصل ہو اس میں مختلف ہیں، جیسا کہ کاسانی اور ابن نجیم نے کہا؛ مالکیہ اس چیز کو حرام کہتے ہیں جس میں سونا اصل کے برابر یا زیادہ ہو اور کم کو مکروہ، جیسا کہ دردیر اور دسوقی نے کہا؛ شافعیہ اصح قول میں اور حنابلہ اس تھوڑی مقدار کو جائز کہتے ہیں جس سے آگ پر رکھنے سے کچھ حاصل نہ ہو اور جس سے سونا نکلے اسے حرام، کیونکہ تب تکبر اور فقرا کی دل شکنی موجود ہے، جیسا کہ خطیب شربینی اور بہوتی نے کہا، معاویہ کی حدیث کے ساتھ جس میں سونا پہننے سے منع کیا گیا سوائے چھوٹے ٹکڑوں کے اور علی قاری کی شرح کے ساتھ۔ فتوے کے لیے مختار یہ ہے کہ جس سے سونا نکلے وہ حرام ہے، اختلاف سے بچنے کے لیے، جیسا کہ سیوطی نے کہا۔"
  es: "Una pregunta sobre un hombre que usa un reloj o gafas chapadas o doradas con oro; Dar al-Ifta al-Misriyya respondió que no hay objeción cuando el chapado es meramente color sin rastro de oro, o tan ligero que no se recuperaría oro al quitarlo, pero que el uso está prohibido cuando el oro es sustancial, como una capa gruesa, o cuando se recuperaría oro si el artículo se fundiera. Dar al-Ifta estableció la prohibición del oro para los hombres a partir del hadiz de Ali en Abu Dawud que la seda y el oro están prohibidos para los hombres de la comunidad y el hadiz de Abu Musa al-Ash'ari, y el consenso reportado por al-Nawawi que prohíbe los anillos de oro para los hombres; señaló que el texto se refiere al oro puro o al oro como material principal, y que los juristas difieren en el dorado según su punto de vista de la razón de la prohibición: los Hanafi están de acuerdo en permitir el dorado del cual no se recupera nada al exponerlo al fuego y difieren cuando se recupera algo, como dicen al-Kasani e Ibn Nujaym; Los malikíes prohíben un objeto cuyo oro sea igual o superior al valor base y desaprueban una porción menor, como afirman al-Dardir y al-Dasuqi; los shafiíes, en su opinión más sólida, y los hanbalíes permiten una pequeña cantidad de la que no se recupera nada al exponerla al fuego y prohíben lo que produce oro, puesto que entonces se manifiesta la ostentación y el sufrimiento de los pobres, como afirman al-Khatib al-Shirbini y al-Buhuti, junto con el hadiz de Mu'awiya que prohíbe el uso de oro excepto en pequeñas piezas y la explicación de Ali al-Qari. La opinión elegida para la fatwa es que lo que produce oro está prohibido, para evitar la controversia, como recomienda al-Suyuti."
  fr: "Une question concernant le port par un homme d'une montre ou de lunettes plaquées ou dorées à l'or a été posée. Dar al-Ifta al-Misriyya a répondu qu'il n'y a pas d'objection lorsque le plaquage est purement coloré, sans aucune trace d'or, ou si fin qu'il serait impossible de récupérer de l'or en le retirant. En revanche, le port est interdit lorsque l'or est substantiel, comme une couche épaisse, ou lorsque l'or pourrait être récupéré par fusion. Dar al-Ifta a exposé l'interdiction de l'or pour les hommes en se basant sur le hadith d'Ali rapporté par Abu Dawud, qui interdit la soie et l'or aux hommes de la communauté, sur le hadith d'Abu Musa al-Ash'ari, et sur le consensus rapporté par al-Nawawi interdisant les bagues en or pour les hommes. Il a été noté que le texte concerne l'or pur ou l'or comme matériau principal, et que les juristes divergent sur la dorure selon leur interprétation de la raison de l'interdiction: les hanafites autorisent la dorure dont rien ne peut être récupéré par le feu, et divergent lorsqu'il est possible d'en récupérer, comme l'affirment al-Kasani et Ibn Nujaym. Les Malikites interdisent tout objet dont la teneur en or est égale ou supérieure à celle de la base et désapprouvent une proportion moindre, comme l'affirment al-Dardir et al-Dasuqi. Les Chafi'ites, dans leur avis plus équilibré, et les Hanbalites autorisent une petite quantité d'or dont rien ne peut être récupéré par le feu et interdisent tout objet susceptible de produire de l'or, car cela relève de l'ostentation et de la souffrance des pauvres, comme le rapportent al-Khatib al-Shirbini et al-Buhuti, en accord avec le hadith de Mu'awiya interdisant le port d'or, sauf en petites quantités, et l'explication d'Ali al-Qari. L'avis retenu pour la fatwa est celui qui interdit tout objet susceptible de produire de l'or, afin d'éviter toute divergence, conformément à la recommandation d'al-Suyuti."
  tr: "Altın kaplı veya kamufle edilmiş saat veya gözlük takan bir adamla ilgili kararla ilgili bir soruya ise, Mısır Dar al-Ifta, boya sadece altın izi olmayan bir renkse ya da çıkarılarak çıkarılamayan küçük bir altın parçasa buna itiraz olmadığını yanıtladı. Ancak, kalın bir tabaka gibi büyük bir tabakaysa veya eşya eritilmişse altın çıkarılıyorsa takılması yasaktır. Ev, Ali'nin Ebu Davud'daki hadislerine dayanarak erkekler için altın yasağını netleştirdi; ümmetin erkekleri için ipek ve altının yasak olduğunu, ayrıca Ebu Musa el-Eş'ari'nin hadisi ve el-Newavi tarafından aktarılan alimlerin erkekler için altın yüzüklerin yasaklanması konusundaki uzlaşısı da belirtti. Metin saf veya temel altını konu alır ve hukukçular kamuflaj konusunda yasaklama nedeni konusunda farklı görüşler bildirmiştir: Hanefiler oybirliğiyle çıkarılmayan şeyleri ateşe koyarak kabul eder, neyin atılacağı konusunda ise el-Kasani ve İbn Najim'in dediği gibi ayrılık yapar, Malikiler ise altının ne içerdiğini yasaklar orijinaliyle eşit veya daha fazla olan ve Al-Dardir ile Al-Desouqi'nin dediği gibi daha azını sevmezler. Şafiiler, en özgün ve Hanbali mezheblerinde, ateşe verilemeyecek küçük bir miktarı alıp çıkarılamayacak miktarı yasaklar; bu da kibir yaratmak ve yoksulların kalbini kırmak için, Al-Khatib Al-Sharbini ve Al-Bahuti'nin dediği gibi, Muaviye'nin altın takmayı ancak parçalı olarak giymeyi yasaklayan hadisleri ve Ali Al-Qari'nin açıklaması gibi. Tercih edilen fetva, anlaşmazlığı önlemek için altın çıkarmada kullanılan şeyleri yasaklar, Al-Suyuti'nin dediği gibi."
  id: "Pertanyaan tentang aturan pria yang mengenakan jam tangan atau kacamata yang dilapisi atau kamuflase emas, Dar al-Ifta Mesir menjawab bahwa tidak ada keberatan jika cat hanya warna tanpa jejak emas, atau jika itu adalah potongan emas kecil yang tidak bisa dihilangkan dengan cara dilepas. Namun, jika lapisan besar seperti lapisan tebal atau jika barang itu meleleh, emas dihilangkan, maka pemakaian dilarang. Dewan memperjelas larangan emas bagi pria berdasarkan hadits Ali di Abu Dawood, menyatakan bahwa sutra dan emas dilarang bagi laki-laki Ummah, serta hadis Abu Musa al-Ash'ari, dan konsensus para ulama yang disampaikan oleh al-Nawawi tentang larangan cincin emas untuk pria. Teks tersebut berkaitan dengan emas murni atau esensial, dan para ahli hukum berbeda pendapat mengenai kamuflase karena perbedaan alasan larangan: Hanafi secara bulat mengizinkan apa yang tidak diambil dengan memasukkannya ke api, dan berbeda pendapat tentang apa yang dibuang, seperti yang dikatakan al-Kasani dan Ibn Najim, dan Malik melarang apa yang berisi emas sama dengan aslinya atau lebih, dan mereka tidak menyukai yang lebih rendah seperti yang dikatakan Al-Dardir dan Al-Desouqi. Para syafi'i, dalam mazhab paling otentik dan Hanbali, mengizinkan sejumlah kecil yang tidak dapat diambil dengan membakarnya dan melarang apa yang dibuang, untuk menimbulkan kesombongan dan menghancurkan hati orang miskin, seperti yang dikatakan Al-Khatib Al-Sharbini dan Al-Bahuti, bersama dengan hadits Muawiya yang melarang memakai emas kecuali dalam bentuk yang terpecah-pecah, dan penjelasan oleh Ali Al-Qari. Fatwa yang dipilih melarang apa yang digunakan untuk mengekstrak emas agar tidak terjadi perselisihan, seperti yang dikatakan Al-Suyuti."
