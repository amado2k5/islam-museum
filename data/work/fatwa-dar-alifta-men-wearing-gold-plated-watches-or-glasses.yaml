id: work/fatwa-dar-alifta-men-wearing-gold-plated-watches-or-glasses
class: work
kind: fatwa
label: { ar: "حكم لبس الرجل لساعة أو نظارة مطلية بالذهب", en: "Men wearing a gold-plated watch or glasses", ur: "مرد کا سونے کی پالش والی گھڑی یا عینک پہننا" }
summary:
  ar: "سؤال عن حكم لبس الرجل ساعةً أو نظارةً مطلية أو مموهة بالذهب، أجابت فيه دار الإفتاء المصرية بأنه لا مانع من ذلك إذا كان الطلاء مجرد لون لا أثر فيه للذهب، أو شيئًا يسيرًا لا يتخلص منه ذهب بإزالته، أما إن كان كثيرًا كطبقة سميكة أو كان بحيث لو أُذيب الشيء خلص منه الذهب فيحرم اللبس. بيّنت الدار تحريم الذهب على الرجال بحديث علي عند أبي داود أن الحرير والذهب حرام على ذكور الأمة وحديث أبي موسى الأشعري، وإجماع العلماء الذي نقله النووي على تحريم خاتم الذهب على الرجال، وأن النص يتعلق بالذهب الخالص أو الأساسي، وأن الفقهاء اختلفوا في المموه تبعًا لاختلافهم في علة التحريم: فالحنفية يجيزون بالاتفاق ما لا يتخلص منه شيء بالعرض على النار ويختلفون فيما يتخلص كما قال الكاساني وابن نجيم، والمالكية يحرمون ما كان الذهب فيه مساويًا لأصله أو أكثر ويكرهون الأقل كما قال الدردير والدسوقي، والشافعية في الأصح والحنابلة يجيزون القليل الذي لا يتخلص منه شيء بالعرض على النار ويحرمون ما تخلص منه لتحقق الخيلاء وكسر قلوب الفقراء كما قال الخطيب الشربيني والبهوتي، مع حديث معاوية في النهي عن لبس الذهب إلا مقطّعًا وشرح علي القاري، والمختار للفتوى حرمة ما يخلص منه الذهب خروجًا من الخلاف كما قال السيوطي."
  en: "A question about a man wearing a watch or glasses plated or gilded with gold; Dar al-Ifta al-Misriyya answered that there is no objection when the plating is mere colour with no trace of gold, or so slight that no gold would be recovered by removing it, but that wearing is forbidden when the gold is substantial, such as a thick layer, or when gold would be recovered if the item were melted down. Dar al-Ifta set out the prohibition of gold for men from Ali's hadith in Abu Dawud that silk and gold are forbidden to the men of the community and the hadith of Abu Musa al-Ash'ari, and the consensus reported by al-Nawawi forbidding gold rings for men; it noted that the text concerns pure gold or gold as the main material, and that the jurists differ on gilding according to their view of the reason for the prohibition: the Hanafis agree on permitting gilding from which nothing is recovered on exposure to fire and differ where something is recovered, as al-Kasani and Ibn Nujaym say; the Malikis forbid an item in which the gold equals or exceeds the base and dislike a smaller share, as al-Dardir and al-Dasuqi say; the Shafi'is in their sounder view and the Hanbalis permit a small amount from which nothing is recovered on exposure to fire and forbid what yields gold, since ostentation and the grieving of the poor are then present, as al-Khatib al-Shirbini and al-Buhuti say, together with Mu'awiya's hadith forbidding the wearing of gold except in small pieces and Ali al-Qari's explanation. The view chosen for the fatwa is that what would yield gold is forbidden, so as to avoid the disagreement, as al-Suyuti recommends."
  ur: "مرد کے سونے کی پالش یا ملمع والی گھڑی یا عینک پہننے کے بارے میں سوال؛ دار الافتاء مصر نے جواب دیا کہ جب پالش محض رنگ ہو جس میں سونے کا کوئی اثر نہ ہو، یا اتنی معمولی ہو کہ اتارنے سے سونا حاصل نہ ہو، تو کوئی رکاوٹ نہیں، لیکن جب سونا زیادہ ہو، جیسے موٹی تہہ، یا ایسا ہو کہ چیز کو پگھلانے سے سونا نکل آئے، تو پہننا حرام ہے۔ دار الافتاء نے مردوں پر سونے کی حرمت ابو داود کے پاس علی کی حدیث سے بیان کی کہ ریشم اور سونا امت کے مردوں پر حرام ہیں اور ابو موسیٰ اشعری کی حدیث سے، اور نووی کے نقل کردہ اجماع سے جو مردوں پر سونے کی انگوٹھی حرام کرتا ہے؛ اس نے ذکر کیا کہ نص خالص سونے یا بنیادی مادے کے طور پر سونے سے متعلق ہے، اور فقہا ملمع میں حرمت کی علت کے اختلاف کے مطابق مختلف ہیں: حنفیہ اس ملمع کے جواز پر متفق ہیں جس سے آگ پر رکھنے سے کچھ حاصل نہ ہو اور جس سے کچھ حاصل ہو اس میں مختلف ہیں، جیسا کہ کاسانی اور ابن نجیم نے کہا؛ مالکیہ اس چیز کو حرام کہتے ہیں جس میں سونا اصل کے برابر یا زیادہ ہو اور کم کو مکروہ، جیسا کہ دردیر اور دسوقی نے کہا؛ شافعیہ اصح قول میں اور حنابلہ اس تھوڑی مقدار کو جائز کہتے ہیں جس سے آگ پر رکھنے سے کچھ حاصل نہ ہو اور جس سے سونا نکلے اسے حرام، کیونکہ تب تکبر اور فقرا کی دل شکنی موجود ہے، جیسا کہ خطیب شربینی اور بہوتی نے کہا، معاویہ کی حدیث کے ساتھ جس میں سونا پہننے سے منع کیا گیا سوائے چھوٹے ٹکڑوں کے اور علی قاری کی شرح کے ساتھ۔ فتوے کے لیے مختار یہ ہے کہ جس سے سونا نکلے وہ حرام ہے، اختلاف سے بچنے کے لیے، جیسا کہ سیوطی نے کہا۔"
