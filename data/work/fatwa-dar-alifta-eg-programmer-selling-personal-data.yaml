id: work/fatwa-dar-alifta-eg-programmer-selling-personal-data
class: work
kind: fatwa
label: { ar: "حكم بيع المبرمج البيانات الشخصية", en: "A programmer selling personal data", ur: "پروگرامر کا ذاتی ڈیٹا بیچنے کا حکم", es: "Un programador que vende datos personales" }
summary:
  ar: "سائل سأل عن بيع المبرمج قاعدة معلومات للبيانات الشخصية والبيومترية لشركة أجنبية أو غيرها مقابل نظير مادي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22616)⁩ أن ذلك حرام شرعًا إذا كان دون إذن من أصحاب البيانات أو الجهة المخولة على ما فصّل الجواب من خيانة الأمانة وخرق الخصوصية."
  en: "A questioner asked about a programmer selling a database of personal and biometric data to a foreign or other company for payment. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22616) answered that this is forbidden in the sharia where done without the permission of the data's owners or the authorised body — as the answer details in terms of breach of trust and violation of privacy."
  ur: "ایک سائل نے پروگرامر کے ذاتی اور بایو میٹرک ڈیٹا کا ڈیٹابیس کسی غیر ملکی یا دوسری کمپنی کو رقم کے بدلے بیچنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22616)⁩ نے جواب دیا کہ ڈیٹا کے مالکوں یا مجاز ادارے کی اجازت کے بغیر یہ شریعت میں حرام ہے — جیسا کہ جواب میں امانت کی خیانت اور نجیت کی خلاف ورزی کی رو سے تفصیل ہے۔"
  es: "Un usuario preguntó sobre la posibilidad de que un programador vendiera una base de datos con información personal y biométrica a una empresa extranjera o de otro tipo a cambio de dinero. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22616) respondió que esto está prohibido por la sharia cuando se realiza sin el permiso de los propietarios de los datos o del organismo autorizado, tal como se detalla en la respuesta en términos de abuso de confianza y violación de la privacidad."
