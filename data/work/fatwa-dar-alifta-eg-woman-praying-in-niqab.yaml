label: { ar: "حكم صلاة المرأة بالنقاب", en: "A woman praying in the niqab", ur: "عورت کا نقاب میں نماز پڑھنا" }
summary:
  ar: "سائل سأل عن صلاة المرأة بالنقاب. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22110)⁩ أن ستر المرأة جميع بدنها عدا وجهها وكفيها ⁦(وقدميها عند جماعة من الفقهاء)⁩ من شروط صحة الصلاة ويكره لها أن تصلي منتقبة على ما فصّل الجواب."
  en: "A questioner asked about a woman praying while wearing the niqab. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22110) answered that covering the whole body except face and hands (and feet, on some jurists' view) is a condition of valid prayer, and it is disliked for a woman to pray veiled — as the answer details."
  ur: "ایک سائل نے عورت کے نقاب میں نماز پڑھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22110)⁩ نے جواب دیا کہ عورت کا چہرے اور ہاتھوں ⁦(بعض فقہاء کے نزدیک پاؤں بھی)⁩ کے سوا پورا بدن ڈھانپنا نماز کی صحت کی شرط ہے اور نقاب میں نماز پڑھنا مکروہ ہے — جیسا کہ جواب میں تفصیل ہے۔"
