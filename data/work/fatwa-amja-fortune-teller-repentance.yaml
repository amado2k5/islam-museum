id: work/fatwa-amja-fortune-teller-repentance
class: work
kind: fatwa
label: { ar: "إتيان العراف ثم الندم", en: "Visiting a fortune-teller then repenting", ur: "کاہن کے پاس جانے کے بعد توبہ", es: "Visitar a una adivina y luego arrepentirse", fr: "Consulter une voyante puis se repentir", tr: "Falcının gelişi sonra pişmanlık", id: "Kedatangan peramal lalu penyesalan" }
summary:
  ar: "سأل سائل عمن أتى عرافًا أو كاهنًا فشعر بالذنب واستغفر الله هل يلزمه تجديد الشهادة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84138 بتاريخ 3 أبريل 2011)⁩ أن من أتى كاهنًا فصدقه فقد كفر بما أنزل على محمد ومن أتاه فسأله ولم يصدقه لم تقبل له صلاة أربعين ليلة، ومن ألم بذنب ثم ندم واستغفر وأناب وجد الله توابًا رحيمًا ولا يلزمه تجديد الشهادة لأنه لم يكفر بها بل لا يزال مستديمًا لقولها واعتقاد موجبها وإنما كانت سقطته من باب آخر فليتب إلى الله منه."
  en: "A questioner asked about one who visited a fortune-teller or diviner, then felt guilt and sought God's forgiveness — must he renew the shahada? Dr. Salah al-Sawi (fatwa no. 84138, 3 April 2011) answered that whoever goes to a diviner and believes him has disbelieved in what was sent down on Muhammad, and whoever goes and asks without believing has no prayer accepted for forty nights; but one who slips, repents, seeks forgiveness and turns back finds God relenting and merciful and need not renew the shahada, since he did not disbelieve — his fall was of another kind — so he repents to God from it. Recorded as AMJA's answer."
  ur: "ایک سائل نے پوچھا کہ کاهن کے پاس جانے والے کو پشیمانی پر دوبارہ شہادت پڑھنی ہو گی؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84138، 3 اپریل 2011)⁩ کے مطابق تصدیق کرنے والا کافر ہوتا ہے اور صرف پوچھنے والے کی چالیس رات نماز قبول نہیں؛ توبہ کرنے والے کو شہادت کی تجدید درکار نہیں۔"
  es: "Un consultante preguntó acerca de quien visita a un adivino o vidente, luego siente culpa y busca el perdón de Dios: ¿debe renovar la shahada? El Dr. Salah al-Sawi (fatwa n.° 84138, 3 de abril de 2011) respondió que quien acude a un adivino y le cree ha renegado de lo revelado a Mahoma, y quien acude y pregunta sin creer no tiene aceptada su oración durante cuarenta noches; pero quien se equivoca, se arrepiente, busca el perdón y regresa, encuentra a Dios misericordioso y compasivo, y no necesita renovar la shahada, puesto que no renegaba de la fe —su caída fue de otra índole—, por lo que se arrepiente ante Dios. Registrada como respuesta de AMJA."
  fr: "Un internaute a posé la question suivante: celui qui consulte un devin, éprouve de la culpabilité et implore le pardon de Dieu, doit-il renouveler la shahada ? Le Dr Salah al-Sawi (fatwa n° 84138, 3 avril 2011) a répondu que quiconque consulte un devin et croit en ses paroles a renié la révélation faite à Muhammad, et que quiconque consulte sans croire ne verra pas sa prière exaucée pendant quarante nuits. Cependant, celui qui commet une faute, se repent, implore le pardon et revient à Dieu trouve Dieu indulgent et miséricordieux et n’a pas besoin de renouveler la shahada, car il n’a pas renié sa foi; sa faute est d’une autre nature. Il se repent donc auprès de Dieu. Cette réponse est consignée dans le rapport de l’AMJA."
  tr: "Bir sorucuya, falcı ya da kahin olarak gelip suçluluk hissedip Allah'tan af dileyen biri hakkında soruldu—şahitliğini yenilemek zorunda mı? Dr. Salah Al-Sawy (3 Nisan 2011 tarihli Fetva No. 84138) şöyle yanıtladı: Kim bir kahine gelip ona inanırsa, Muhammed'e vahyedilene inanmamış olur ve kim ona gelip ona inanmazsa, kırk gece boyunca yaptığı dua kabul edilmez. Bir günah işleyip sonra pişman olan, af dileyen ve tövbe eden Tanrı'yı tövbe eden biri olarak görür. Kâmansız olmadığı için şahitliği yenilemek zorunda değildir, ancak yine de söylemekte ve zorunluluğuna inanmakta ısrar eder. Bunun yerine, ihmal başka bir kapıdan yapılmıştır ve ondan Allah'a tövbe etmelidir."
  id: "Seorang penanya ditanya tentang seseorang yang datang sebagai peramal atau peramal dan merasa bersalah lalu meminta pengampunan kepada Tuhan—apakah dia diwajibkan untuk memperbarui kesaksiannya? Dr. Salah Al-Sawy menjawab (Fatwa No. 84138 tanggal 3 April 2011) bahwa siapa pun yang datang kepada peramal dan mempercayainya telah tidak percaya pada apa yang telah diwahyukan kepada Muhammad, dan siapa pun yang datang kepadanya dan meminta tetapi tidak percaya, doanya selama empat puluh malam tidak akan diterima. Siapa pun yang menderita karena dosa, lalu menyesalinya, mencari pengampunan, dan bertobat, Allah akan menemukan Tuhan sebagai seorang yang bertobat dan penyayang. Dia tidak wajib memperbarui kesaksian karena tidak pernah tidak percaya, tetapi tetap bersikeras mengucapkannya dan mempercayai kewajibannya. Sebaliknya, kelalaian itu terjadi melalui pintu lain dan dia harus bertobat kepada Tuhan darinya."
