summary:
  ar: "تفسير كامل للقرآن الكريم لوهبة الزحيلي، صدرت طبعته الأولى عن دار الفكر بدمشق ودار الفكر المعاصر ببيروت سنة 1411هـ/1991م في اثنين وثلاثين جزءاً منها جزءان للفهارس، وتُرجم إلى لغات منها الإندونيسية والملايوية والتركية."
  en: "A complete Qur'an commentary by Wahbah al-Zuhayli; its first edition was published by Dar al-Fikr, Damascus, and Dar al-Fikr al-Mu'asir, Beirut, in 1411/1991 in thirty-two parts, two of them indexes. It has been translated into Indonesian, Malay, Turkish and other languages."
  ur: "وہبہ زحیلی کی مکمل تفسیرِ قرآن؛ اس کا پہلا ایڈیشن دار الفکر، دمشق اور دار الفکر المعاصر، بیروت سے 1411ھ/1991ء میں بتیس اجزا میں شائع ہوا جن میں دو اشاریے ہیں۔ اس کا ترجمہ انڈونیشیائی، ملائی، ترکی اور دیگر زبانوں میں ہوا ہے۔"
  es: "Comentario completo del Corán por Wahbah al-Zuhayli. Su primera edición fue publicada por Dar al-Fikr (Damasco) y Dar al-Fikr al-Mu'asir (Beirut) en 1411/1991 en treinta y dos partes, dos de ellas índices. Ha sido traducido al indonesio, malayo, turco y otros idiomas."
  fr: "Commentaire complet du Coran par Wahbah al-Zuhayli; sa première édition a été publiée par Dar al-Fikr (Damas) et Dar al-Fikr al-Mu'asir (Beyrouth) en 1411/1991, en trente-deux parties, dont deux index. Il a été traduit en indonésien, en malais, en turc et dans d'autres langues."
