label: { ar: "تكفير علماء الإمامية", en: "Declaring the Imamiyya's scholars disbelievers — the cautious line", ur: "امامیہ علماء کی تکفیر — احتیاط", es: "Declarar incrédulos a los eruditos imamíes: la línea cautelosa" }
summary:
  ar: "سأل سائل هل صحيح أن رأينا في الشيعة الإمامية أن جهالهم فساق وعلماؤهم كفار. أجاب د. صلاح الصاوي ⁦(فتوى رقم 3262 بتاريخ 22 يوليو 2007)⁩ أن في تكفير علماء الإمامية خلافًا بين أهل العلم والاحتياط أن يقال من صح عنه بعينه أنه يدين بنحلة كفرية فهو بها كافر ولا يطلق القول بتكفير عموم علمائهم لما في ذلك القول من المجازفة."
  en: "A questioner asked whether it is true that 'our view of the Imamite Shia is that their ignorant are sinners and their scholars disbelievers'. Dr. Salah al-Sawi (fatwa no. 3262, 22 July 2007) answered that declaring the Imamiyya's scholars disbelievers is disputed among scholars; the cautious course is to say: whoever is proven of himself to hold an unbelieving creed is a disbeliever for it — without pronouncing takfir over their scholars wholesale, such a saying being reckless. Recorded as AMJA's answer."
  ur: "ایک سائل نے امامیہ علماء کی تکفیر پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 3262، 22 جولائی 2007)⁩ کے مطابق علماء میں اختلاف ہے اور احتیاط یہ ہے کہ ہر فرد کا معاملہ الگ دیکھا جائے — عمومی تکفیر جرات ہے۔"
  es: "Un interlocutor preguntó si era cierto que «nuestra opinión sobre los chiíes imamíes es que sus ignorantes son pecadores y sus eruditos incrédulos». El Dr. Salah al-Sawi (fatwa n.º 3262, 22 de julio de 2007) respondió que declarar incrédulos a los eruditos imamíes es un tema controvertido entre los eruditos; lo prudente es decir: quien demuestre tener una creencia incrédula es incrédulo por ella, sin declarar takfir a todos sus eruditos en general, pues tal afirmación sería imprudente. Registrada como respuesta de AMJA."
