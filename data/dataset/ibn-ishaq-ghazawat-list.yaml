summary:
  ar: "قائمة ابن إسحاق، في رواية زياد البكائي عن ابن هشام، بما غزاه النبي بنفسه: سبع وعشرون غزوة من ودّان إلى تبوك على ترتيبه، قاتل منها في تسع: بدر وأحد والخندق وقريظة والمصطلق وخيبر والفتح وحنين والطائف."
  en: "Ibn Ishaq's list, in Ziyad al-Bakka'i's transmission through Ibn Hisham, of the expeditions the Prophet led in person: twenty-seven from Waddan to Tabuk in his order, nine of them with fighting: Badr, Uhud, the Trench, Qurayza, al-Mustaliq, Khaybar, the Conquest, Hunayn and al-Ta'if."
  es: "La lista de Ibn Ishaq, en la transmisión de Ziyad al-Bakka'i a través de Ibn Hisham, de las expediciones que el Profeta dirigió personalmente: veintisiete desde Waddan hasta Tabuk bajo su orden, nueve de ellas con combates: Badr, Uhud, la Trinchera, Qurayza, al-Mustaliq, Khaybar, la Conquista, Hunayn y al-Ta'if."
  fr: "La liste d'Ibn Ishaq, dans la transmission de Ziyad al-Bakka'i par Ibn Hisham, des expéditions que le Prophète a menées en personne: vingt-sept de Waddan à Tabuk sur son ordre, neuf d'entre elles avec des combats: Badr, Uhud, le Fossé, Qurayza, al-Mustaliq, Khaybar, la Conquête, Hunayn et al-Ta'if."
  ur: "ابن اسحاق کی فہرست، زیاد البکائی کی طرف سے ابن ہشام کے ذریعے منتقل ہونے والی مہمات میں سے، رسول اللہ نے بذات خود قیادت کی: ستائیس ودان سے تبوک تک، ان میں سے نو لڑائیوں کے ساتھ: بدر، احد، خندق، قریظہ، المصطلق، فتح خیبر اور فتحین۔"
  tr: "İbn İshak'ın, İbn Hişam'dan rivayetle Ziyad el-Bakka'i'den aktardığına göre, Peygamberin bizzat yaptığı baskınların listesi şöyledir: Waddan'dan Tebük'e kadar yirmi yedi baskın, bunlardan dokuzunda savaşmıştır: Bedir, Uhud, Hendek, Kureyza, el-Mustalık, Hayber, Fetih, Huneyn ve Taif."
  id: "Daftar Ibn Ishaq, dalam riwayat Ziyad al-Bakka’i dari Ibn Hisham, tentang tempat-tempat yang diserbu oleh Nabi sendiri: dua puluh tujuh penyerbuan dari Waddan ke Tabuk atas perintah beliau, di mana beliau berperang dalam sembilan di antaranya: Badr, Uhud, Parit, Qurayza, al-Mustaliq, Khaybar, Penaklukan, Hunayn dan Ta’if."
