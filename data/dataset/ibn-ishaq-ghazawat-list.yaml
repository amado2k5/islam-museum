  ar: "قائمة ابن إسحاق، في رواية زياد البكائي عن ابن هشام، بما غزاه النبي بنفسه: سبع وعشرون غزوة من ودّان إلى تبوك على ترتيبه، قاتل منها في تسع: بدر وأحد والخندق وقريظة والمصطلق وخيبر والفتح وحنين والطائف."
  en: "Ibn Ishaq's list, in Ziyad al-Bakka'i's transmission through Ibn Hisham, of the expeditions the Prophet led in person: twenty-seven from Waddan to Tabuk in his order, nine of them with fighting: Badr, Uhud, the Trench, Qurayza, al-Mustaliq, Khaybar, the Conquest, Hunayn and al-Ta'if."
