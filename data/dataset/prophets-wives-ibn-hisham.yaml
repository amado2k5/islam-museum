summary:
  ar: "قائمة الزوجات التي جمعها ابن هشام في الجزء الرابع من السيرة: ثلاث عشرة زوجة، إحدى عشرة بنى بهن النبي، ومنهن خديجة وزينب بنت خزيمة قُبضتا قبله؛ مع المهر كما يذكره ابن هشام، وما انفرد به من ملاحظات الروايات."
  en: "The list of wives Ibn Hisham gives in juz' 4 of the Sira: thirteen in all, eleven of whom the Prophet consummated, two of them (Khadija and Zaynab bint Khuzayma) dying before him; with the dowry as Ibn Hisham gives it and his notes on the variant reports."
  es: "La lista de esposas que Ibn Hisham da en el juz' 4 de la Sira: trece en total, once de las cuales el Profeta consumó, dos de ellas (Khadija y Zaynab bint Khuzayma) murieron antes que él; con la dote como la da Ibn Hisham y sus notas sobre los relatos variantes."
  fr: "La liste des épouses qu'Ibn Hisham donne dans le juz' 4 de la Sira: treize au total, dont onze avec lesquelles le Prophète a consommé le mariage, deux d'entre elles (Khadija et Zaynab bint Khuzayma) mourant avant lui; avec la dot telle qu'Ibn Hisham la donne et ses notes sur les rapports divergents."
  ur: "ابن ہشام نے سیرت کے جوز 4 میں ازواج کی فہرست دی ہے: مجموعی طور پر تیرہ، جن میں سے گیارہ نبی نے ختم کیے، ان میں سے دو ⁦(خدیجہ اور زینب بنت خزیمہ)⁩ آپ کے سامنے فوت ہوئیں؛ جہیز کے ساتھ جیسا کہ ابن ہشام اسے دیتا ہے اور مختلف رپورٹوں پر اس کے نوٹ۔"
