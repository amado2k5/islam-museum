summary:
  ar: "جدول مقادير العطايا والأموال التي قسمها النبي بالجعرانة ⁦(شوال 8هـ)⁩ على سادات قريش ورؤساء قبائل نجد تأليفاً لقلوبهم، مستخرج من سيرة ابن هشام ⁦(الجزء الرابع ص 135–138)⁩."
  en: "Roster of grant amounts and gifts distributed by the Prophet at al-Ji'rana (Shawwal 8 AH) to the chieftains of Quraysh and Najdi tribal leaders to reconcile their hearts, extracted from Ibn Hisham's Sira (juz' 4 pp. 135–138)."
  es: "Lista de cantidades de subvenciones y regalos distribuidos por el Profeta en al-Ji'rana (Shawwal 8 AH) a los jefes de Quraysh y a los líderes tribales de Najdi para reconciliar sus corazones, extraída de la Sira de Ibn Hisham (juz' 4 pp. 135–138)."
  fr: "Liste des montants des subventions et des cadeaux distribués par le Prophète à al-Ji'rana (Shawwal 8 AH) aux chefs des tribus Quraysh et Najdi pour réconcilier leurs cœurs, extrait de la Sira d'Ibn Hisham (juz' 4 pp. 135–138)."
  ur: "الجیرانہ ⁦(شوال 8 ہجری)⁩ میں رسول اللہ کی طرف سے قریش کے سرداروں اور نجدی قبائل کے سرداروں کو ان کے دلوں میں صلح کرنے کے لیے تقسیم کی گئی امدادی رقوم اور تحائف کا فہرست، ابن ہشام کی سیرت سے ماخوذ ہے ⁦(جوز 4 صفحہ 135-138)⁩۔"
  tr: "İbn Hişam'ın biyografisinden (Dördüncü Kısım, s. 135-138) alınan, Peygamberin Ciranah'ta (Hicri 8. Şevval) Kureyş önderlerine ve Necd kabilelerinin reislerine gönüllerini kazanmak için dağıttığı hediyelerin ve paraların miktarlarını gösteren tablo."
  id: "Tabel jumlah hadiah dan uang yang dibagikan Nabi di Al-Ji'ranah (Sawwal 8 H) kepada para pemimpin Quraisy dan kepala suku Najd untuk memenangkan hati mereka, diambil dari biografi Ibn Hisham (Bagian Empat, hlm. 135–138)."
