summary:
  ar: "جدول بمن سمّاهم ابن إسحاق في غزوة تبوك بحسب أصنافهم: البكاؤون، والمتخلفون عن غير شك، والمعذّرون، والمنافقون المتخلفون، والمستخلفون على المدينة، والمنفقون، والملاحقون، ومن مات أو صالح ⁦(الجزء الرابع ص159-173)⁩."
  en: "A table of those Ibn Ishaq names in the Tabuk expedition, by category: the weepers, those who stayed behind without doubt, the excused, the hypocrites who stayed behind, those appointed over Medina, the spenders, those who caught up, and those who died or made peace (part 4, pp. 159–173)."
  es: "Una tabla con los nombres que Ibn Ishaq mencionó en la expedición de Tabuk, por categoría: los que lloraban, los que se quedaron atrás sin duda, los excusados, los hipócritas que se quedaron atrás, los designados sobre Medina, los que gastaban, los que se pusieron al día y los que murieron o hicieron las paces (parte 4, págs. 159-173)."
  fr: "Un tableau des noms d'Ibn Ishaq dans l'expédition de Tabuk, par catégorie: les pleureuses, ceux qui sont restés sans aucun doute, les excusés, les hypocrites qui sont restés, ceux nommés à Médine, les dépensiers, ceux qui ont rattrapé et ceux qui sont morts ou ont fait la paix (partie 4, pp. 159-173)."
  ur: "غزوہ تبوک میں ابن اسحاق کے ناموں کا ایک جدول، زمرہ کے لحاظ سے: رونے والے، پیچھے رہ جانے والے، عذر کرنے والے، پیچھے رہ جانے والے منافق، مدینہ پر مقرر، خرچ کرنے والے، پکڑنے والے اور مرنے والے یا صلح کرنے والے ⁦(حصہ 4، صفحہ 159-173)⁩۔"
  tr: "İbn İshak'ın Tebük Muharebesi'nde isimlerini verdiği kişilerin kategorilerine göre bir tablo: ağlayanlar, şüphe duymadan geride kalanlar, mazeret uyduranlar, geride kalan münafıklar, Medine'de halef olarak atananlar, cimriler, takip edilenler ve ölenler veya barış yapanlar (Dördüncü Kısım, s. 159-173)."
  id: "Tabel yang berisi nama-nama orang yang disebutkan Ibnu Ishaq dalam Perang Tabuk menurut kategori mereka: orang-orang yang menangis, orang-orang yang tetap tinggal tanpa ragu, orang-orang yang mencari alasan, orang-orang munafik yang tetap tinggal, orang-orang yang diangkat sebagai penerus di Madinah, orang-orang yang berinfak, orang-orang yang dikejar, dan orang-orang yang meninggal atau berdamai (Bagian Empat, hlm. 159-173)."
