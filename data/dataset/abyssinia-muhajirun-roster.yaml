method_note: "الأعداد الكلية من نص ابن إسحاق نفسه؛ والمعدودون يُسجَّلون بحسب ما يقول الكتاب، فمن ذُكر ضمن أهل المهاجر (زوجة أو ابن قدم معه) لم يُعدّ رجلاً مستقلاً. الوفيات بعد العودة موضوعة بصيغة الكتاب (في خلافة أبي بكر أو عمر) دون تعيين سنة."
