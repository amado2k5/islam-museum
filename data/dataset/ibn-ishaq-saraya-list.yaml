id: dataset/ibn-ishaq-saraya-list
class: dataset
label: { ar: "جملة سرايا النبي وبعوثه بحسب ابن إسحاق", en: "Ibn Ishaq's enumeration of the Prophet's detachments and missions", es: "Enumeración de Ibn Ishaq sobre los destacamentos y misiones del Profeta", fr: "Énumération par Ibn Ishaq des détachements et missions du Prophète" }
summary:
  ar: "قائمة ابن إسحاق ببعوث النبي وسراياه، ثمان وثلاثون بين بعث وسرية، كما يسردها في ص257 وما بعدها متخللة بأخبار بعضها: من غزوة عبيدة بن الحارث أسفل ثنية المرة إلى بعث أسامة بن زيد؛ مع ملاحظة ابن إسحاق أن بعض الناس يقدم غزوة حمزة قبل غزوة عبيدة."
  en: "Ibn Ishaq's list of the Prophet's missions and detachments, thirty-eight in all, as he sets them out from p. 257 onward interleaved with the narratives of some: from Ubayda ibn al-Harith's raid below Thaniyyat al-Marra to the sending of Usama ibn Zayd; with Ibn Ishaq's note that some people place Hamza's raid before Ubayda's."
  es: "La lista de Ibn Ishaq de las misiones y destacamentos del Profeta, treinta y ocho en total, tal como los presenta a partir de la página 257, intercalada con las narraciones de algunos: desde la incursión de Ubayda ibn al-Harith debajo de Thaniyyat al-Marra hasta el envío de Usama ibn Zayd; con la nota de Ibn Ishaq de que algunas personas sitúan la incursión de Hamza antes que la de Ubayda."
  fr: "La liste des missions et détachements du Prophète établie par Ibn Ishaq, trente-huit au total, telle qu'il les présente à partir de la page 257, entremêlée des récits de certains d'entre eux: du raid d'Ubayda ibn al-Harith au sud de Thaniyyat al-Marra à l'envoi d'Usama ibn Zayd; avec la note d'Ibn Ishaq selon laquelle certains placent le raid de Hamza avant celui d'Ubayda."
