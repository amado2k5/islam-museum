label: { ar: "جملة سرايا النبي وبعوثه بحسب ابن إسحاق", en: "Ibn Ishaq's enumeration of the Prophet's detachments and missions" }
summary:
  ar: "قائمة ابن إسحاق ببعوث النبي وسراياه، ثمان وثلاثون بين بعث وسرية، كما يسردها في ص257 وما بعدها متخللة بأخبار بعضها: من غزوة عبيدة بن الحارث أسفل ثنية المرة إلى بعث أسامة بن زيد؛ مع ملاحظة ابن إسحاق أن بعض الناس يقدم غزوة حمزة قبل غزوة عبيدة."
  en: "Ibn Ishaq's list of the Prophet's missions and detachments, thirty-eight in all, as he sets them out from p. 257 onward interleaved with the narratives of some: from Ubayda ibn al-Harith's raid below Thaniyyat al-Marra to the sending of Usama ibn Zayd; with Ibn Ishaq's note that some people place Hamza's raid before Ubayda's."
