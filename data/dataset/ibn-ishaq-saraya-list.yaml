method_note: "اكتملت صفوف ابن إسحاق الثمانية والثلاثون (ص257-291)؛ ما زاده ابن هشام (بعث عمرو بن أمية، سرية زيد إلى مدين، سرية علقمة، سرية كرز، وبعث أسامة) غير معدود هنا وله مداخل مستقلة؛ عمود narrated يبيّن هل أورد ابن إسحاق خبر السرية مفصلاً أم اكتفى بذكرها في القائمة. الترتيب ترتيب الكتاب لا الترتيب الزمني."
