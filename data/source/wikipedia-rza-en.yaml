reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026, and its content checked against the recorded revision. It gives Robert Fitzgerald Diggs, born 5 July 1969 in Brownsville, Brooklyn, named for the Kennedy brothers; his summers in North Carolina, his move to Steubenville, Ohio in 1990, and his acquittal of an attempted-murder charge there, which he has called a second chance; the founding of the Wu-Tang Clan and the album Enter the Wu-Tang (36 Chambers) (1993); the Gravediggaz and the Bobby Digital solo albums; his scores for Kill Bill: Volume 1 (2003) and Volume 2 (2004); his directorial debut The Man with the Iron Fists (2012) and Love Beats Rhymes (2017); and the Emmy-nominated main-title theme of Wu-Tang: An American Saga (2019–2023). For his faith, the personal-life section states in terms that he was a former member of the Five-Percent Nation, until he and Cappadonna accompanied Tareef Michael to Mecca in January 2024 and reverted to Islam in the Masjid al-Haram, citing an Instagram reel by Michael titled 'Sheikh Khalid Amin dictates the Shahadah to RZA & Cappadonna'. That is one article resting on a single social-media citation; no school is named."
