summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن آر زد إيه؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه عضو سابق في «أمة الخمسة بالمئة»، وتذكر أنه نطق بالشهادة في المسجد الحرام بمكة في يناير 2024."
  en: "English Wikipedia article on RZA; used for entity facts only. It describes him as a former member of the Five-Percent Nation and reports that he pronounced the shahada at the Grand Mosque in Mecca in January 2024."
  es: "Artículo de la Wikipedia en inglés sobre RZA; utilizado únicamente para obtener información sobre la persona. Lo describe como un antiguo miembro de la Nación de los Cinco Por Ciento e informa que pronunció la shahada en la Gran Mezquita de La Meca en enero de 2024."
  fr: "Article Wikipédia en anglais sur RZA; utilisé uniquement à des fins d’information sur l’entité. Il le décrit comme un ancien membre de la Nation des Cinq Pour Cent et indique qu’il a prononcé la shahada à la Grande Mosquée de La Mecque en janvier 2024."
  ur: "RZA پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے پانچ فیصد قوم کے سابق رکن کے طور پر بیان کیا گیا ہے اور بتایا گیا ہے کہ اس نے جنوری 2024 میں مکہ کی عظیم الشان مسجد میں شہادت کا اعلان کیا۔"
  tr: "RZA hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılıyor. Makalede kendisi 'Beş Yüzde Ulusu'nun eski bir üyesi olarak tanımlanıyor ve Ocak 2024'te Mekke'deki Büyük Camii'de şehitliği ilan ettiğini belirtiyor."
  id: "Artikel Wikipedia bahasa Inggris tentang RZA hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menggambarkannya sebagai mantan anggota 'Nation of the Five Percent,' dan menyebutkan bahwa ia memproklamasikan kemartiran di Masjid Agung di Mekah pada Januari 2024."
