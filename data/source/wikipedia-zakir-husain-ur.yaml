  tr: "Zakir Hussain hakkında Urduca Wikipedia makalesi. 8 Şubat 1897'deki doğumunu, 3 Mayıs 1969'daki ölümünü ve Hindistan'da iki dönem Başkan Yardımcısı ve Cumhurbaşkanı olarak görev yaptığını doğrular."
