label:
  ar: "ديوان خطب خطيب الخطباء أبي يحيى عبد الرحيم بن نباتة، ويليه خطب ولده أبي طاهر محمد — مشروحاً بقلم الشيخ طاهر أفندي الجزائري، مطبعة جريدة بيروت، بيروت 1319هـ"
  en: "Diwan of the sermons of the 'preacher of preachers' Abu Yahya 'Abd al-Rahim ibn Nubata, followed by the sermons of his son Abu Tahir Muhammad — with a commentary by Shaykh Tahir Afandi al-Jaza'iri, Matba'at Jaridat Bayrut, Beirut 1319 AH"
summary:
  ar: "نشرة بيروتية سنة 1319هـ لديوان خطب ابن نباتة الفارقي (ت 374هـ) بشرح لغوي لطاهر الجزائري، تُباع في المكتبة الأنسية ببيروت؛ فيها فهرس الخطب بمطالعها، وترجمة صاحب الديوان منقولة من تاريخ ابن خلكان مع زيادات للشارح، وذكر شروح الديوان ونقد أهل الأدب له، ثم الخطب مرتبة: خطب المعاد وخطب المناسبات كعاشوراء ووفاة النبي والجهاد ووداع رمضان، وخطب الأعياد والنكاح، ثم خطب ولده أبي طاهر محمد."
  en: "A Beirut printing of 1319 AH of the Diwan of sermons of Ibn Nubata al-Fariqi (d. 374 AH) with a philological commentary by Tahir al-Jaza'iri, sold at al-Maktaba al-Unsiyya in Beirut. It holds a list of the sermons by their opening words, a notice of the author taken from Ibn Khallikan with the commentator's additions, an account of the Diwan's commentaries and of literary criticism of it, and then the sermons in order: sermons on the hereafter and occasional sermons (Ashura, the Prophet's death, jihad, farewell to Ramadan), festival and marriage sermons, and finally the sermons of his son Abu Tahir Muhammad."
title: "ديوان خطب ابن نباتة — مشروح بقلم الشيخ طاهر الجزائري"
