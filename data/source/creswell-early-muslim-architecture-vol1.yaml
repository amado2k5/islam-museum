summary:
  ar: "الجلد الأول من الطبعة الثانية المنقّحة لكتاب كرسويل المرجعي في العمارة الإسلامية المبكرة، ويضم فصل مارغريت غوتييه-فان برشيم في فسيفساء قبة الصخرة، وفيه النصوص العربية عن صنّاع الفسيفساء ⁦(الفسيفساء)⁩ الذين عملوا للوليد بن عبد الملك في المدينة ودمشق، ووصف ابن فضل الله العمري التقني لصناعة الفسيفساء في القرن الرابع عشر الميلادي."
  en: "The first volume of the revised second edition of Creswell's standard work on early Muslim architecture, which includes Marguerite Gautier-van Berchem's study of the mosaics of the Dome of the Rock: the Arabic texts about the mosaicists (fusaifisa'-workers) who worked for al-Walid ibn Abd al-Malik at Medina and Damascus, and al-Umari's fourteenth-century technical description of how fusaifisa' cubes were made."
