summary:
  ar: "مقالة ويكيبيديا العربية عن سوهارتو؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها مولده في 8 يونيو 1921 في كيميوسوك ووفاته في 27 يناير 2008 في جاكرتا ودينه «الإسلام» عموما نقلا عن شفارتز (1994)، وتصنّفه فئاتها في «مسلمون سنة» و«مسلمون سنة إندونيسيون»، وتقابل ميلاده بـ1339 هـ ووفاته بـ1429 هـ."
  en: "Arabic Wikipedia article on Suharto; used for entity facts only. Its infobox gives his birth on 8 June 1921 at Kemusuk, his death on 27 January 2008 at Jakarta, and his religion as Islam generically (citing Schwarz 1994, p. 175). Its categories file him under 'Sunni Muslims' and 'Indonesian Sunni Muslims' (filings) and pair his birth with 1339 AH and his death with 1429 AH."
  es: "Artículo de Wikipedia en árabe sobre Suharto; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació el 8 de junio de 1921 en Kemusuk, falleció el 27 de enero de 2008 en Yakarta y profesaba el islam (citando a Schwarz, 1994, p. 175). Sus categorías lo clasifican como «musulmanes sunitas» y «musulmanes sunitas indonesios» (archivos) y asocian su nacimiento con el año 1339 de la Hégira y su fallecimiento con el año 1429 de la Hégira."
  fr: "Article Wikipédia en arabe sur Suharto; utilisé uniquement pour les informations le concernant. Son infobox indique sa naissance le 8 juin 1921 à Kemusuk, son décès le 27 janvier 2008 à Jakarta et son appartenance à l’islam (d’après Schwarz, 1994, p. 175). Ses catégories le classent dans les sous-catégories « Musulmans sunnites » et « Musulmans sunnites indonésiens » et associent sa naissance à l’année 1339 de l’Hégire et son décès à l’année 1429 de l’Hégire."
