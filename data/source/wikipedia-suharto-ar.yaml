  ar: "مقالة ويكيبيديا العربية عن سوهارتو؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها مولده في 8 يونيو 1921 في كيميوسوك ووفاته في 27 يناير 2008 في جاكرتا ودينه «الإسلام» عموما نقلا عن شفارتز (1994)، وتصنّفه فئاتها في «مسلمون سنة» و«مسلمون سنة إندونيسيون»، وتقابل ميلاده بـ1339 هـ ووفاته بـ1429 هـ."
  en: "Arabic Wikipedia article on Suharto; used for entity facts only. Its infobox gives his birth on 8 June 1921 at Kemusuk, his death on 27 January 2008 at Jakarta, and his religion as Islam generically (citing Schwarz 1994, p. 175). Its categories file him under 'Sunni Muslims' and 'Indonesian Sunni Muslims' (filings) and pair his birth with 1339 AH and his death with 1429 AH."
