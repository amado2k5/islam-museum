summary:
  ar: "تقرير لدانيال بيرك من «سي إن إن»، أعادت نشره محطة WTKR في 27 نوفمبر 2015، عن صدور «القرآن الدراسي» بالإنجليزية: حفل في جامعة جورجتاون، وعشر سنوات من العمل، ورئاسة سيد حسين نصر للتحرير، وشرطه أن يكون المترجمون مسلمين من طلابه، وجمع التفاسير السنية والشيعية، والتمويل، والطبعات الأولى، وآراء المؤيدين والمتحفظين."
  en: "A report by Daniel Burke for CNN, syndicated by WTKR on 27 November 2015, on the release of The Study Quran: the celebration at Georgetown University, ten years of work, Seyyed Hossein Nasr as editor-in-chief, his condition that the translators be Muslims and his former students, Sunni and Shia commentary side by side, the funding, the first print runs, and voices for and against."
  ur: "سی این این کے لیے ڈینیئل برک کی رپورٹ، جو WTKR نے 27 نومبر 2015 کو شائع کی، «دی اسٹڈی قرآن» کے اجرا پر: جارج ٹاؤن یونیورسٹی کی تقریب، دس سال کا کام، مدیرِ اعلیٰ سید حسین نصر، مترجمین کے مسلمان اور ان کے شاگرد ہونے کی شرط، سنی اور شیعہ تفاسیر ساتھ ساتھ، مالی معاونت، ابتدائی اشاعت، اور حامی و ناقد آرا۔"
