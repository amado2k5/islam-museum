label: { en: "CNN Wire, 'Could this Quran curb extremism?' (Daniel Burke, 27 November 2015)" }
summary:
  ar: "تقرير لدانيال بيرك من «سي إن إن»، أعادت نشره محطة WTKR في 27 نوفمبر 2015، عن صدور «القرآن الدراسي» بالإنجليزية: حفل في جامعة جورجتاون، وعشر سنوات من العمل، ورئاسة سيد حسين نصر للتحرير، وشرطه أن يكون المترجمون مسلمين من طلابه، وجمع التفاسير السنية والشيعية، والتمويل، والطبعات الأولى، وآراء المؤيدين والمتحفظين."
  en: "A report by Daniel Burke for CNN, syndicated by WTKR on 27 November 2015, on the release of The Study Quran: the celebration at Georgetown University, ten years of work, Seyyed Hossein Nasr as editor-in-chief, his condition that the translators be Muslims and his former students, Sunni and Shia commentary side by side, the funding, the first print runs, and voices for and against."
  ur: "سی این این کے لیے ڈینیئل برک کی رپورٹ، جو WTKR نے 27 نومبر 2015 کو شائع کی، «دی اسٹڈی قرآن» کے اجرا پر: جارج ٹاؤن یونیورسٹی کی تقریب، دس سال کا کام، مدیرِ اعلیٰ سید حسین نصر، مترجمین کے مسلمان اور ان کے شاگرد ہونے کی شرط، سنی اور شیعہ تفاسیر ساتھ ساتھ، مالی معاونت، ابتدائی اشاعت، اور حامی و ناقد آرا۔"
  es: "Un reportaje de Daniel Burke para CNN, distribuido por WTKR el 27 de noviembre de 2015, sobre la publicación de The Study Quran: la celebración en la Universidad de Georgetown, diez años de trabajo, Seyyed Hossein Nasr como editor jefe, su condición de que los traductores fueran musulmanes y sus antiguos alumnos, comentarios sunitas y chiítas presentados en paralelo, la financiación, las primeras tiradas y las voces a favor y en contra."
  fr: "Un reportage de Daniel Burke pour CNN, diffusé par WTKR le 27 novembre 2015, sur la sortie de The Study Quran: la célébration à l’université de Georgetown, dix ans de travail, Seyyed Hossein Nasr comme rédacteur en chef, sa condition que les traducteurs soient musulmans et ses anciens étudiants, les commentaires sunnites et chiites côte à côte, le financement, les premiers tirages et les voix pour et contre."
  tr: "CNN'den Daniel Burke tarafından hazırlanan ve WTKR tarafından 27 Kasım 2015'te yeniden yayımlanan bir rapor, İngilizce olarak yayımlanan 'Kur'an Çalışması' hakkında: Georgetown Üniversitesi'nde bir tören, on yıllık çalışma, Seyyid Hüseyin Nasr'ın editör direktörlüğü, çevirmenlerin Müslüman öğrenci olma şartı, Sünni ve Şii yorumların toplanması, finansman, ilk baskılar ve destekçiler ile muhafazakarların görüşleri."
  id: "Laporan oleh Daniel Burke dari CNN, diterbitkan ulang oleh WTKR pada 27 November 2015, tentang penerbitan 'Quran Study' dalam bahasa Inggris: sebuah upacara di Universitas Georgetown, sepuluh tahun kerja, Sayyid Hussein Nasr sebagai direktur editorial, syarat bahwa penerjemah harus mahasiswa Muslim, kumpulan komentar Sunni dan Syiah, pendanaan, edisi pertama, serta pendapat para pendukung dan konservatif."
