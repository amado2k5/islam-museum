summary:
  ar: "المقال السندي عن پير علي محمد راشدي: يذكر اسم ولادته ⁦(سيد علي محمد شاه راشدي)⁩ وتاريخ مولده مقترنا بـ12 جمادى الثانية 1323هـ نقلا عن كتاب جي ايم سيد، وتفاصيل أسرته وأعماله سنديا وأرديا وإنجليزيا."
  en: "The Sindhi article on Pir Ali Muhammad Rashidi: gives his birth name (Syed Ali Muhammad Shah Rashidi) and pairs his birth with 12 Jumada al-Thani 1323 AH, citing G. M. Syed's book, with detail on his family and his Sindhi, Urdu and English works."
  es: "El artículo en sindhi sobre Pir Ali Muhammad Rashidi: da su nombre de nacimiento (Syed Ali Muhammad Shah Rashidi) y relaciona su nacimiento con el 12 de Jumada al-Thani de 1323 AH, citando el libro de GM Syed, con detalles sobre su familia y sus obras en sindhi, urdu e inglés."
  fr: "L'article sindhi sur Pir Ali Muhammad Rashidi: donne son nom de naissance (Syed Ali Muhammad Shah Rashidi) et associe sa naissance au 12 Jumada al-Thani 1323 AH, citant le livre de GM Syed, avec des détails sur sa famille et ses œuvres en sindhi, en ourdou et en anglais."
  ur: "پیر علی محمد راشدی پر سندھی مضمون: ان کا پیدائشی نام ⁦(سید علی محمد شاہ راشدی)⁩ بتاتا ہے اور ان کی پیدائش 12 جمادی الثانی 1323 ہجری سے جوڑتا ہے، جی ایم سید کی کتاب کا حوالہ دیتے ہوئے، ان کے خاندان اور ان کے سندھی، اردو اور انگریزی کاموں پر تفصیل کے ساتھ۔"
  tr: "Pir Ali Muhammed Raşidi hakkında Orijinal Belge: Doğum adı (Seyyid Ali Muhammed Şah Raşidi) ve doğum tarihi, G.M. Seyyid'in kitabından alıntılanan 12 Cumedül-Thani 1323 Hicri ile birlikte ailesi ve Sindhi, Urdi ve İngilizce eserleri hakkında bilgiler verilmiştir."
  id: "Dokumen Otentik tentang Pir Ali Muhammad Rashidi: Nama lahirnya (Syed Ali Muhammad Shah Rashidi) dan tanggal lahirnya disebutkan bersama dengan 12 Jumada al-Thani 1323 H, yang dikutip dari buku karya G.M. Syed, beserta rincian keluarganya dan karyanya dalam bahasa Sindhi, Urdi, dan Inggris."
