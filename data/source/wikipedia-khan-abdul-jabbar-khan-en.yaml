summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خان عبد الجبار خان ⁦(الدكتور خان صاحب)⁩؛ تُستخدم لوقائع الكيان فقط. تروي ولادته سنة 1883 في أوتمانزاي ودراسته الطب في بومباي ولندن وخدمته العسكرية، وقيادته حكومة الإقليم الحدودي الشمالي الغربي، ومعارضته التقسيم، ورئاسته وزراء غرب باكستان، واغتياله في لاهور في 9 مايو 1958."
  en: "English Wikipedia article on Khan Abdul Jabbar Khan (Dr. Khan Sahib); used for entity facts only. It gives his birth in 1883 at Utmanzai, his medical studies at Bombay and London and wartime service, his chief ministership of the North-West Frontier Province, his opposition to Partition, his term as first Chief Minister of West Pakistan, and his assassination at Lahore on 9 May 1958."
  es: "Artículo de la Wikipedia en inglés sobre Khan Abdul Jabbar Khan (Dr. Khan Sahib); utilizado únicamente para datos biográficos. Describe su nacimiento en 1883 en Utmanzai, sus estudios de medicina en Bombay y Londres y su servicio militar durante la guerra, su mandato como primer ministro de la Provincia de la Frontera Noroeste, su oposición a la Partición, su período como primer ministro de Pakistán Occidental y su asesinato en Lahore el 9 de mayo de 1958."
  fr: "Article de Wikipédia en anglais sur Khan Abdul Jabbar Khan (Dr Khan Sahib); utilisé uniquement à des fins d’information sur la personne. Il relate sa naissance en 1883 à Utmanzai, ses études de médecine à Bombay et à Londres, son service pendant la guerre, son poste de ministre en chef de la Province de la Frontière-Nord-Ouest, son opposition à la Partition, son mandat de premier ministre en chef du Pakistan occidental et son assassinat à Lahore le 9 mai 1958."
  ur: "خان عبدالجبار خان ⁦(ڈاکٹر خان صاحب)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1883 میں عثمان زئی میں ان کی پیدائش، بمبئی اور لندن میں ان کی طبی تعلیم اور جنگ کے وقت کی خدمات، شمال مغربی سرحدی صوبے کی ان کی وزارت اعلیٰ، تقسیم کی مخالفت، مغربی پاکستان کے پہلے وزیر اعلیٰ کے طور پر ان کی مدت ملازمت، اور 9 مئی 1958 کو لاہور میں ان کا قتل۔"
