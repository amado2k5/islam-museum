summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خان عبد الجبار خان ⁦(الدكتور خان صاحب)⁩؛ تُستخدم لوقائع الكيان فقط. تروي ولادته سنة 1883 في أوتمانزاي ودراسته الطب في بومباي ولندن وخدمته العسكرية، وقيادته حكومة الإقليم الحدودي الشمالي الغربي، ومعارضته التقسيم، ورئاسته وزراء غرب باكستان، واغتياله في لاهور في 9 مايو 1958."
  en: "English Wikipedia article on Khan Abdul Jabbar Khan (Dr. Khan Sahib); used for entity facts only. It gives his birth in 1883 at Utmanzai, his medical studies at Bombay and London and wartime service, his chief ministership of the North-West Frontier Province, his opposition to Partition, his term as first Chief Minister of West Pakistan, and his assassination at Lahore on 9 May 1958."
