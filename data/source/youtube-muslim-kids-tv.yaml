summary:
  ar: "القناة الرسمية لمنصة «مسلم كيدز تي في» على يوتيوب (@muslimkidstvofficial)؛ تصف نفسها بأنها «أول قناة رسوم إسلامية للأطفال على الإنترنت»، وتنشر رسوما وأغاني وقصصا إسلامية للأطفال، وتربط موقع المنصة muslimkids.tv."
  en: "The official YouTube channel of the Muslim Kids TV platform (@muslimkidstvofficial); it describes itself as 'the first Kids Islamic Cartoon and educational Channel on Internet' and publishes Islamic cartoons, songs and stories for children, linking the platform site muslimkids.tv."
  es: "El canal oficial de YouTube de la plataforma Muslim Kids TV (@muslimkidstvofficial); se describe a sí mismo como \"el primer canal educativo y de dibujos animados islámicos para niños en Internet\" y publica dibujos animados, canciones e historias islámicas para niños, con enlaces al sitio web de la plataforma muslimkids.tv."
  fr: "La chaîne YouTube officielle de la plateforme Muslim Kids TV (@muslimkidstvofficial); elle se décrit comme « la première chaîne de dessins animés islamiques et éducative pour enfants sur Internet » et publie des dessins animés, des chansons et des histoires islamiques pour enfants, en lien avec le site de la plateforme muslimkids.tv."
  ur: "مسلم کڈز ٹی وی پلیٹ فارم کا آفیشل یوٹیوب چینل (@muslimkidstvofficial)؛ یہ خود کو 'انٹرنیٹ پر بچوں کا پہلا اسلامی کارٹون اور تعلیمی چینل' کے طور پر بیان کرتا ہے اور پلیٹ فارم سائٹ muslimkids.tv سے منسلک ہوتے ہوئے بچوں کے لیے اسلامی کارٹون، گانے اور کہانیاں شائع کرتا ہے۔"
  tr: "YouTube'daki 'Muslim Kids TV' platformunun resmi kanalı (@muslimkidstvofficial) kendisini 'internetteki ilk çocuklar için İslami çizgi film kanalı' olarak tanımlıyor, çocuklar için İslami çizgi filmler, şarkılar ve hikayeler yayınlıyor ve platformun web sitesine muslimkids.tv bağlantı veriyor."
  id: "Saluran resmi platform 'Muslim Kids TV' di YouTube (@muslimkidstvofficial) menggambarkan dirinya sebagai 'saluran kartun Islam pertama untuk anak-anak di internet,' menerbitkan kartun, lagu, dan cerita Islam untuk anak-anak, serta menautkan situs web platform tersebut muslimkids.tv."
