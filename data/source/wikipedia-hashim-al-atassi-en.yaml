summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هاشم الأتاسي؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من إدارة حمص العثمانية إلى رئاساته الثلاث للجمهورية السورية."
  en: "English Wikipedia article on Hashim al-Atassi; used for entity facts only. It recounts his Ottoman administrative career, the Syrian National Congress of 1919–1920, his two premierships and his three presidencies of Syria (1936–1939, 1949–1951, 1954–1955)."
  es: "Artículo de la Wikipedia en inglés sobre Hashim al-Atassi; utilizado únicamente para datos sobre la persona. Relata su trayectoria administrativa en el Imperio Otomano, el Congreso Nacional Sirio de 1919-1920, sus dos mandatos como primer ministro y sus tres presidencias de Siria (1936-1939, 1949-1951, 1954-1955)."
  fr: "Article de Wikipédia en anglais sur Hashim al-Atassi; utilisé uniquement pour les informations sur l’entité. Il relate sa carrière administrative ottomane, le Congrès national syrien de 1919-1920, ses deux mandats de Premier ministre et ses trois présidences de la Syrie (1936-1939, 1949-1951, 1954-1955)."
  ur: "ہاشم العطاسی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے عثمانی انتظامی کیریئر، 1919-1920 کی سیریئن نیشنل کانگریس، ان کی دو پریمیئر شپ اور شام کی ان کی تین صدارتوں ⁦(1936–1939، 1949–1951، 1954–1955)⁩ کا ذکر ہے۔"
  tr: "Haşim el-Atassi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Osmanlı Homs yönetiminden Suriye Cumhuriyeti'ndeki üç başkanlığına kadar olan yolculuğunu anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Hashim al-Atassi; digunakan hanya untuk fakta entitas. Artikel ini menceritakan perjalanannya dari pemerintahan Ottoman di Homs hingga tiga masa kepresidenannya di Republik Suriah."
