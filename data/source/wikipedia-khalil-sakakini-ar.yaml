reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 26 October 2026 and checked against the recorded revision. Its lead names him personally a Christian — a Palestinian educator from Jerusalem, 'a Christian and an Arab nationalist' — and says he was born to an Arab Christian family; its text records his 1913 pamphlet 'The Orthodox Renaissance in Palestine', his founding of the Orthodox Brotherhood society, and his excommunication by the Orthodox church. Its categories file him under 'Palestinian Eastern Orthodox' and 'Palestinian Christians', and pair his birth year 1878 with 1295 AH and his death year 1953 with 1372 AH."
