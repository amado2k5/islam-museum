  ar: "مقالة ويكيبيديا العربية عن خليل السكاكيني؛ تُستخدم لوقائع الكيان فقط. تقدّمه أديبًا ومربيًا فلسطينيًا مقدسيًا مسيحيًا وقوميًا عربيًا، وتروي تعليمه وعمله التربوي ومؤلفاته الاثني عشر ويومياته."
  en: "Arabic Wikipedia article on Khalil Sakakini; used for entity facts only. Its lead presents him as a Palestinian educator from Jerusalem, a Christian and an Arab nationalist, and it recounts his schooling, his educational work, his twelve published books and his diaries."
  es: "Artículo de Wikipedia en árabe sobre Khalil Sakakini; utilizado únicamente para obtener información sobre la persona. En su introducción se le presenta como un educador palestino de Jerusalén, cristiano y nacionalista árabe, y se narra su formación académica, su labor educativa, sus doce libros publicados y sus diarios."
  fr: "Article Wikipédia en arabe sur Khalil Sakakini; utilisé uniquement à des fins d’information sur l’entité. Son introduction le présente comme un éducateur palestinien de Jérusalem, chrétien et nationaliste arabe, et relate sa scolarité, son œuvre pédagogique, ses douze ouvrages publiés et ses journaux intimes."
  ur: "خلیل ساکاکینی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ اسے یروشلم سے تعلق رکھنے والے ایک فلسطینی معلم، ایک عیسائی اور ایک عرب قوم پرست کے طور پر پیش کرتا ہے، اور اس میں اس کی اسکولنگ، اس کے تعلیمی کام، اس کی بارہ شائع شدہ کتابوں اور اس کی ڈائریوں کا ذکر ہے۔"
