summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمر السومة؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 23 مارس 1989 في دير الزور، ومواسمه الثلاثة المتتالية هدافاً للدوري السعودي مع الأهلي ولقب الدوري سنة 2016، ورصيده مع سوريا 47 مباراة و23 هدفاً، وانتقاله سنة 2026 إلى الوحدة الدمشقي. ولا تذكر ديانته."
  en: "English Wikipedia article on Omar Al Somah; used for entity facts only. It gives his birth on 23 March 1989 in Deir ez-Zor, his three straight Saudi Pro League top-scorer seasons with Al-Ahli and the 2016 league title, his Syria record of 47 caps and 23 goals, and his 2026 move to Al-Wahda of Damascus. It makes no statement about his religion."
  es: "Artículo de la Wikipedia en inglés sobre Omar Al Somah; utilizado únicamente para datos biográficos. Indica su fecha de nacimiento, el 23 de marzo de 1989 en Deir ez-Zor, sus tres temporadas consecutivas como máximo goleador de la Liga Profesional Saudí con el Al-Ahli y el título de liga de 2016, su récord con la selección de Siria de 47 partidos y 23 goles, y su fichaje por el Al-Wahda de Damasco en 2026. No menciona su religión."
  fr: "L'article Wikipédia en anglais consacré à Omar Al Somah, utilisé uniquement à des fins d'information sur l'entité, mentionne sa naissance le 23 mars 1989 à Deir ez-Zor, ses trois saisons consécutives en tant que meilleur buteur du championnat saoudien professionnel avec Al-Ahli, le titre de champion remporté en 2016, son record de 47 sélections et 23 buts en équipe nationale syrienne, ainsi que son transfert à Al-Wahda (Damas) en 2026. Aucune information n'est fournie concernant sa religion."
