  ar: "مقالة ويكيبيديا الإنجليزية عن عمر السومة؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 23 مارس 1989 في دير الزور، ومواسمه الثلاثة المتتالية هدافاً للدوري السعودي مع الأهلي ولقب الدوري سنة 2016، ورصيده مع سوريا 47 مباراة و23 هدفاً، وانتقاله سنة 2026 إلى الوحدة الدمشقي. ولا تذكر ديانته."
  en: "English Wikipedia article on Omar Al Somah; used for entity facts only. It gives his birth on 23 March 1989 in Deir ez-Zor, his three straight Saudi Pro League top-scorer seasons with Al-Ahli and the 2016 league title, his Syria record of 47 caps and 23 goals, and his 2026 move to Al-Wahda of Damascus. It makes no statement about his religion."
