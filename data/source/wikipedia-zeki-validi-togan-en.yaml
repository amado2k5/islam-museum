summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زكي وليدي توغان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 10 ديسمبر 1890 في كوزيانوفو بمحافظة أوفا، ووفاته في 26 يوليو 1970 بإسطنبول، وتدريسه في مدرسة قاسميّة بقازان 1912–1915، وعمله في مكتب دعم النواب المسلمين بالدوما، وقيادته الحركة الباشكيرية وحركة البسمتشي، وكرسيّه في جامعة إسطنبول؛ ولا تسمي له دينا ولا مذهبا."
  en: "English Wikipedia article on Zeki Velidi Togan; used for entity facts only. It gives his birth on 10 December 1890 at Kuzyanovo in Ufa Governorate and his death on 26 July 1970 at Istanbul, his teaching at the Qasimiyä madrasa in Kazan in 1912–1915, his work in the bureau supporting Muslim deputies at the Duma, his leadership of the Bashkir movement and of the Basmachi, and his Istanbul University chair; it names no religion or school for him."
