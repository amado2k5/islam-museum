summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صبغت الله مجددي؛ تُستخدم لوقائع الكيان فقط. تروي مولده في كابل (صدرها 27 سبتمبر 1926، ويذكر مصدر مقتبس فيها سنة 1925)، ودراسته الشريعة في الأزهر وتدريسه في جامعة كابل، وتأسيسه جبهة التحرير الوطني الأفغاني سنة 1979، ورئاسته المؤقتة أفغانستان من أبريل إلى يونيو 1992، ووفاته في كابل في 11 فبراير 2019."
  en: "English Wikipedia article on Sibghatullah Mojaddedi; used for entity facts only. It recounts his birth at Kabul (its lead and infobox give 27 September 1926, while a source quoted in the article gives 1925), his study of Islamic law at al-Azhar and teaching at Kabul University, his founding of the Afghan National Liberation Front in 1979, his acting presidency of Afghanistan from April to June 1992, and his death at Kabul on 11 February 2019."
