summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مسلمة أقليدس الخامسة؛ لوقائع الكيان فقط: محاولة ابن الهيثم ⁦(965–1039)⁩ بالبرهان بالخلف وإدخاله مفهوم الحركة في الهندسة وشبه منحرف ابن الهيثم ولامبرت، أطروحة عمر الخيام ⁦(ت 1123)⁩ في كتاب شرح ما أشكل من مصادرات أقليدس وشبه منحرف الخيام وساكيري وبديله المسلمي عن الخطين المتقاربين، رسالة نصير الدين الطوسي ⁦(1250)⁩ في دفع الشك عن الخطوط المتوازية، كتاب صدر الدين ⁦(1298)⁩ المطبوع بروما 1594 ونقطة انطلاق ساكيري، ونهاية القصة عند لوباتشفسكي وبوياي وبلترامي."
  en: "English Wikipedia article on Euclid's fifth postulate; entity facts only: Ibn al-Haytham's (965-1039) attempted proof by contradiction introducing motion into geometry and the Ibn al-Haytham-Lambert quadrilateral, Umar Khayyam's (d. 1123) Explanations of the Difficulties in the Postulates of Euclid with the Khayyam-Saccheri quadrilateral and his convergent-lines postulate, Nasir al-Din al-Tusi's 1250 Discussion Which Removes Doubt about Parallel Lines, Sadr al-Din's 1298 book printed at Rome 1594 as Saccheri's starting point, and the Lobachevsky-Bolyai-Beltrami ending."
  es: "Artículo de la Wikipedia en inglés sobre el quinto postulado de Euclides; solo hechos de la entidad: el intento de prueba por contradicción de Ibn al-Haytham (965-1039) que introduce el movimiento en la geometría y el cuadrilátero de Ibn al-Haytham-Lambert, las Explicaciones de Umar Khayyam (m. 1123) de las dificultades en los postulados de Euclides con el cuadrilátero de Khayyam-Saccheri y su postulado de líneas convergentes, la Discusión de Nasir al-Din al-Tusi de 1250 que elimina la duda sobre las líneas paralelas, el libro de Sadr al-Din de 1298 impreso en Roma en 1594 como punto de partida de Saccheri, y el final de Lobachevsky-Bolyai-Beltrami."
  fr: "Article de Wikipédia en anglais sur le cinquième postulat d'Euclide; faits uniquement: la tentative de démonstration par l'absurde d'Ibn al-Haytham (965-1039) introduisant le mouvement en géométrie et le quadrilatère d'Ibn al-Haytham-Lambert, les explications d'Umar Khayyam (mort en 1123) sur les difficultés des postulats d'Euclide avec le quadrilatère de Khayyam-Saccheri et son postulat des droites convergentes, la discussion de Nasir al-Din al-Tusi de 1250 qui lève le doute sur les droites parallèles, le livre de Sadr al-Din de 1298 imprimé à Rome en 1594 comme point de départ de Saccheri, et la conclusion de Lobachevsky-Bolyai-Beltrami."
