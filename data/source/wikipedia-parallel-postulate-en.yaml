summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مسلمة أقليدس الخامسة؛ لوقائع الكيان فقط: محاولة ابن الهيثم ⁦(965–1039)⁩ بالبرهان بالخلف وإدخاله مفهوم الحركة في الهندسة وشبه منحرف ابن الهيثم ولامبرت، أطروحة عمر الخيام ⁦(ت 1123)⁩ في كتاب شرح ما أشكل من مصادرات أقليدس وشبه منحرف الخيام وساكيري وبديله المسلمي عن الخطين المتقاربين، رسالة نصير الدين الطوسي ⁦(1250)⁩ في دفع الشك عن الخطوط المتوازية، كتاب صدر الدين ⁦(1298)⁩ المطبوع بروما 1594 ونقطة انطلاق ساكيري، ونهاية القصة عند لوباتشفسكي وبوياي وبلترامي."
  en: "English Wikipedia article on Euclid's fifth postulate; entity facts only: Ibn al-Haytham's (965-1039) attempted proof by contradiction introducing motion into geometry and the Ibn al-Haytham-Lambert quadrilateral, Umar Khayyam's (d. 1123) Explanations of the Difficulties in the Postulates of Euclid with the Khayyam-Saccheri quadrilateral and his convergent-lines postulate, Nasir al-Din al-Tusi's 1250 Discussion Which Removes Doubt about Parallel Lines, Sadr al-Din's 1298 book printed at Rome 1594 as Saccheri's starting point, and the Lobachevsky-Bolyai-Beltrami ending."
