reliability_note: "Peer-reviewed conference proceedings paper, read in full on 15 November 2026. Its biographical frame (full name, birth date, the pesantren of his father, the 2018 founding and the growth from seven members to 66,000) rests on the paper's fieldwork in Karanggayam village and its documentation. The paper also records his Instagram following as 1.3 million at its writing; that figure is undated within the paper and is not used as a reach entry. The paper describes the assembly and its congregation; it names no school for him."
