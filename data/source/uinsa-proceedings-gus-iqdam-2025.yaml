summary:
  ar: "ورقة مؤتمر أكاديمية عن خطابة غوس إقدام في مجلس سبيل التوبة؛ تذكر اسمه الكامل أغوس محمد إقدام، وولادته في 27 سبتمبر 1994، وتأسيسه المجلس سنة 2018 ونموّه من سبعة أعضاء إلى 66,000."
  en: "Academic conference paper on Gus Iqdam's rhetoric in the Sabilu Taubah congregation; it gives his full name as Agus Muhammad Iqdam, his birth on 27 September 1994, his founding of the assembly in 2018 and its growth from seven members to 66,000."
  es: "Ponencia académica sobre la retórica de Gus Iqdam en la congregación Sabilu Taubah; en ella se indica su nombre completo como Agus Muhammad Iqdam, su fecha de nacimiento el 27 de septiembre de 1994, la fundación de la asamblea en 2018 y su crecimiento de siete miembros a 66.000."
  fr: "Article de conférence universitaire sur la rhétorique de Gus Iqdam dans la congrégation Sabilu Taubah; il donne son nom complet comme Agus Muhammad Iqdam, sa naissance le 27 septembre 1994, la fondation de l'assemblée en 2018 et sa croissance de sept membres à 66 000."
  ur: "سبیلو توبہ جماعت میں گس اقدام کے بیانات پر اکیڈمک کانفرنس پیپر؛ یہ ان کا پورا نام اگس محمد اقدام بتاتا ہے، ان کی پیدائش 27 ستمبر 1994 کو، 2018 میں ان کی اسمبلی کی بنیاد اور اس کے سات ارکان سے بڑھ کر 66,000 ہو گئے۔"
  tr: "Gus Iqdam'ın Sabil Al-Tawba Konseyi'ndeki konuşmasına dair akademik bir konferans bildirisinde; tam adı Agos Mohammed Iqdam, 27 Eylül 1994'teki doğumu, 2018'de kurulduğu ve yedi üyeden 66.000'e büyümesi belirtilmektedir."
  id: "Makalah konferensi akademik tentang pidato Gus Iqdam di Dewan Sabil Al-Tawba; menyebutkan nama lengkapnya, Agos Mohammed Iqdam, kelahirannya pada 27 September 1994, pendirian dewan pada tahun 2018, dan pertumbuhannya dari tujuh anggota menjadi 66.000."
title: "Public Perception of Gus Iqdam's Rethoric in the Sabilu Taubah Religious Congregation"
