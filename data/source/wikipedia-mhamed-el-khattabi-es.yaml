summary:
  ar: "مقالة ويكيبيديا الإسبانية عن امحمد عبد الكريم ⁦(أخدير 1892 – الرباط 17 ديسمبر 1967)⁩؛ تسرد دراسته بمدرسة المناجم بمدريد وقيادته العليا لجيش الريف ونائب رئاسة الجمهورية وحملات شفشاون وتطوان وأوارگا ونفيه وعودته ودفنه بأجدير، وتنبه إلى أن بعض المصادر تعطي ميلاده سنة 1897."
  en: "The Spanish Wikipedia article on M'hamed el-Khattabi (Ajdir 1892 – Rabat 17 December 1967), covering his studies at the Madrid School of Mines, his supreme command of the Rifian army and vice-presidency of the Republic, the Chefchaouen, Tetouan and Ouergha campaigns, his exile, return and burial at Ajdir; it notes that some sources give his birth year as 1897."
  es: "El artículo de la Wikipedia en español sobre M'hamed el-Khattabi (Ajdir 1892 – Rabat 17 de diciembre de 1967), que abarca sus estudios en la Escuela de Minas de Madrid, su mando supremo del ejército rifeño y la vicepresidencia de la República, las campañas de Chefchaouen, Tetuán y Ouergha, su exilio, regreso y entierro en Ajdir; señala que algunas fuentes indican que nació en 1897."
  fr: "L'article de Wikipédia espagnol sur M'hamed el-Khattabi (Ajdir 1892 – Rabat 17 décembre 1967), couvrant ses études à l'École des mines de Madrid, son commandement suprême de l'armée rifaine et sa vice-présidence de la République, les campagnes de Chefchaouen, Tétouan et Ouergha, son exil, son retour et son enterrement à Ajdir; il note que certaines sources donnent son année de naissance comme étant 1897."
