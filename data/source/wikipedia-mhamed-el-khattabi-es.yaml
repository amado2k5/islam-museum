  ar: "مقالة ويكيبيديا الإسبانية عن امحمد عبد الكريم (أخدير 1892 – الرباط 17 ديسمبر 1967)؛ تسرد دراسته بمدرسة المناجم بمدريد وقيادته العليا لجيش الريف ونائب رئاسة الجمهورية وحملات شفشاون وتطوان وأوارگا ونفيه وعودته ودفنه بأجدير، وتنبه إلى أن بعض المصادر تعطي ميلاده سنة 1897."
