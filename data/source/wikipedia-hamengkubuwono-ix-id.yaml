summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن هامينغكوبوونو التاسع (1912–1988)؛ تُستخدم لوقائع الكيان فقط. سيرة مفصّلة تذكر مولده باسم دورودجاتون، وتتويجه، ودوره في حرب الاستقلال، ومناصبه الحكومية ووفاته. سُجّلت لأن لا مقالة عربية عنه في ويكيبيديا."
  en: "Indonesian Wikipedia article on Hamengkubuwono IX (1912–1988); used for entity facts only. A detailed biography giving his birth as Dorodjatun, his coronation, his role in the war of independence, his government offices and his death. Registered because no Arabic Wikipedia article exists for him."
  es: "Artículo de la Wikipedia en indonesio sobre Hamengkubuwono IX (1912-1988); utilizado únicamente para datos sobre la persona. Una biografía detallada que narra su nacimiento como Dorodjatun, su coronación, su papel en la guerra de independencia, sus cargos gubernamentales y su fallecimiento. Registrado porque no existe ningún artículo sobre él en la Wikipedia en árabe."
  fr: "Article de Wikipédia indonésien sur Hamengkubuwono IX (1912-1988); utilisé uniquement à titre informatif. Biographie détaillée retraçant sa naissance sous le nom de Dorodjatun, son couronnement, son rôle dans la guerre d'indépendance, ses fonctions gouvernementales et sa mort. Enregistré car aucun article Wikipédia en arabe ne lui est consacré."
  ur: "انڈونیشی ویکیپیڈیا مضمون ہمنگکوبوونو IX (1912–1988) پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک تفصیلی سوانح عمری جس میں ان کی ولادت دورودجاتون، اس کی تاجپوشی، جنگ آزادی میں اس کا کردار، اس کے سرکاری دفاتر اور اس کی موت۔ رجسٹرڈ کیونکہ اس کے لیے عربی ویکیپیڈیا کا کوئی مضمون موجود نہیں ہے۔"
  tr: "Hamingkubuno IX (1912–1988) hakkında Endonezya Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Detaylı bir biyografi, doğumunu Dorodjatun olarak tanımlar, taç giyme töreni, Bağımsızlık Savaşı'ndaki rolü, hükümet pozisyonları ve ölümü belirtilmiştir. Bu makale, hakkında Wikipedia'da Arapça bir makale olmadığı için kaydedilmiştir."
  id: "Artikel Wikipedia Indonesia tentang Hamingkubuno IX (1912–1988); digunakan hanya untuk fakta entitas. Biografi rinci menyebutkan kelahirannya sebagai Dorodjatun, penobatannya, perannya dalam Perang Kemerdekaan, posisi pemerintahannya, dan kematiannya. Artikel ini dicatat karena tidak ada artikel Arab tentang dirinya di Wikipedia."
