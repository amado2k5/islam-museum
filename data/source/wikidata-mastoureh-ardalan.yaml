summary:
  ar: "عنصر ويكي بيانات Q464670: الولادة 1805 في سنندج، وقيمتان للوفاة ⁦(1848 وديسمبر 1847)⁩ ومكان الوفاة السليمانية؛ قيمته الدينية الوحيدة هي «الإسلام» عامة (Q432)."
  en: "Wikidata item Q464670 (revision 2558721022): born 1805 at Sanandaj; two death values, the year 1848 and December 1847; death place Sulaymaniyah. Its only religion value is the generic Islam (Q432), naming no school."
  es: "Elemento de Wikidata Q464670 (revisión 2558721022): nacido en 1805 en Sanandaj; dos fechas de fallecimiento: 1848 y diciembre de 1847; lugar de fallecimiento: Sulaymaniyah. Su única religión registrada es el Islam genérico (Q432), sin mencionar ninguna escuela."
  fr: "L'élément Wikidata Q464670 (révision 2558721022) indique une personne née en 1805 à Sanandaj; deux dates de décès sont mentionnées: 1848 et décembre 1847; le lieu du décès est Souleimaniye. La seule information religieuse disponible est l'islam générique (Q432), sans précision d'école."
  ur: "ویکی ڈیٹا آئٹم Q464670 ⁦(نظرثانی 2558721022)⁩: سنندج میں 1805 میں پیدا ہوا۔ موت کی دو قدریں، سال 1848 اور دسمبر 1847؛ مقام وفات سلیمانیہ۔ اس کی واحد مذہبی قدر عام اسلام (Q432) ہے، جس کا نام کسی اسکول کا نہیں ہے۔"
