summary:
  ar: "كتاب الأستاذ محمد فريد وجدي (ت ١٣٧٣هـ / ١٩٥٤م) عن مهمة الدين الإسلامي في العالم، ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، بإشراف الأمين العام للمجمع؛ يضم تمهيداً للأستاذ الدكتور محمد رجب البيومي، وثلاثة أبواب: مهمة الدين الإسلامي في العالم، وإعلان الألفة العامة بين الشعوب، والمثل الأعلى في بناء الأمم. رقم الإيداع ٢٠١٧/٢٧٨٤٨ {cite:muhimmat-al-islam-azhar p. 3}."
  en: "Muhammad Farid Wajdi's book on the mission of Islam in the world, in the Islamic Research Academy's Scientific Series at al-Azhar, supervised by the Academy's Secretary-General. It has a preface by Muhammad Rajab al-Bayumi and three parts: the mission of the Islamic religion in the world, the proclamation of general human kinship among peoples, and the ideal in building nations. Deposit number 2017/27848 {cite:muhimmat-al-islam-azhar p. 3}."
