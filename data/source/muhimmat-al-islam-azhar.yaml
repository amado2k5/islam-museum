label:
  ar: مهمة الإسلام في العالم — محمد فريد وجدي
  en: The Mission of Islam in the World — Muhammad Farid Wajdi
summary:
  ar: "كتاب الأستاذ محمد فريد وجدي ⁦(ت ١٣٧٣هـ / ١٩٥٤م)⁩ عن مهمة الدين الإسلامي في العالم، ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، بإشراف الأمين العام للمجمع؛ يضم تمهيداً للأستاذ الدكتور محمد رجب البيومي، وثلاثة أبواب: مهمة الدين الإسلامي في العالم، وإعلان الألفة العامة بين الشعوب، والمثل الأعلى في بناء الأمم. رقم الإيداع ٢٠١٧/٢٧٨٤٨ {cite:muhimmat-al-islam-azhar p. 3}."
  en: "Muhammad Farid Wajdi's book on the mission of Islam in the world, in the Islamic Research Academy's Scientific Series at al-Azhar, supervised by the Academy's Secretary-General. It has a preface by Muhammad Rajab al-Bayumi and three parts: the mission of the Islamic religion in the world, the proclamation of general human kinship among peoples, and the ideal in building nations. Deposit number 2017/27848 {cite:muhimmat-al-islam-azhar p. 3}."
  es: "El libro de Muhammad Farid Wajdi sobre la misión del Islam en el mundo, perteneciente a la Serie Científica de la Academia de Investigación Islámica de Al-Azhar, bajo la supervisión del Secretario General de la Academia, incluye un prefacio de Muhammad Rajab al-Bayumi y se divide en tres partes: la misión de la religión islámica en el mundo, la proclamación de la hermandad universal entre los pueblos y el ideal de la construcción de naciones. Número de depósito 2017/27848 {cite:muhimmat-al-islam-azhar p. 3}."
  fr: "L'ouvrage de Muhammad Farid Wajdi sur la mission de l'islam dans le monde, publié dans la collection scientifique de l'Académie de recherche islamique d'al-Azhar, sous la supervision du secrétaire général de l'Académie, est préfacé par Muhammad Rajab al-Bayumi et se divise en trois parties: la mission de la religion islamique dans le monde, la proclamation de la fraternité universelle entre les peuples et l'idéal de construction des nations. Numéro de dépôt: 2017/27848 {cite:muhimmat-al-islam-azhar p. 3}."
  ur: "محمد فرید وجدی کی کتاب دنیا میں اسلام کے مشن پر، اسلامک ریسرچ اکیڈمی کی سائنسی سیریز الازہر میں، اکیڈمی کے سیکرٹری جنرل کی زیر نگرانی۔ محمد رجب البیومی کا دیباچہ اور تین حصے ہیں: دنیا میں اسلام کا مشن، لوگوں کے درمیان عمومی انسانی رشتہ داری کا اعلان، اور قوموں کی تعمیر میں مثالی۔ جمع نمبر 2017/27848 {حوالہ: محمّت الاسلام اظہر ص۔ 3}۔"
  tr: "Profesör Muhammed Farid Wagdi'nin (ö. 1373 Hicri / 1954 M.S.) İslam'ın dünyadaki misyonu üzerine, Akademi Genel Sekreteri tarafından denetlenen El-Ezher El-Şerif İslam Araştırma Akademisi'nin bilimsel serisinin bir parçası olarak yer almaktadır; Profesör Dr. Muhammed Receb El-Bayomi'nin bir girişi ve üç bölüm içerir: İslam'ın dünyadaki misyonu, halklar arasında genel birlik ilanı ve ulus inşasındaki ideal. Mevduat numarası 2017/27848 {kaynak:muhimmat-al-Islam-azhar s. 3}."
  id: "Buku oleh Profesor Muhammad Farid Wagdi (wafat 1373 H / 1954 M) tentang misi Islam di dunia, sebagai bagian dari seri ilmiah Akademi Riset Islam di Al-Azhar Al-Sharif, yang diawasi oleh Sekretaris Jenderal Akademi; buku ini mencakup pengantar oleh Profesor Dr. Muhammad Rajab Al-Bayoumi dan tiga bab: misi Islam di dunia, deklarasi persatuan umum antar bangsa, dan cita-cita dalam pembangunan bangsa. Nomor deposit 2017/27848 {kutip: muhimmat-al-Islam-azhar hlm. 3}."
