summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الزيج؛ لوقائع الكيان فقط: اشتقاق الاسم من الفارسية الوسطى zih أو zig بمعنى خيط وانتقاله من النسج إلى صفوف الجداول، المحتوى المعتاد للأزياج من تقويم وخطوط وعرض وجداول نجوم ودوال مثلثية ومعادلة الزمن وحركات كواكب وكسوف ورؤية هلال، أزيد من مئتي زيج بين القرنين الثامن والخامس عشر، ومراكزها في بغداد ومراغة وسمرقند وإستانبول ونحو مئة أخرى في الهند."
  en: "English Wikipedia article on the zij; entity facts only: the name derived from Middle Persian zih or zig meaning cord, transferred from weaving to table rows, typical zij contents (chronology, latitudes and longitudes, star tables, trigonometrical functions, spherical astronomy, equation of time, planetary motions, eclipse computation, crescent visibility), over two hundred zijes between the eighth and fifteenth centuries, centres at Baghdad, Maragha, Samarkand, Constantinople and nearly a hundred more in India."
  es: "Artículo de la Wikipedia en inglés sobre el zij; solo datos sobre la entidad: el nombre deriva del persa medio zih o zig, que significa cuerda, transferido del tejido a las filas de las tablas, contenidos típicos de los zij (cronología, latitudes y longitudes, tablas estelares, funciones trigonométricas, astronomía esférica, ecuación del tiempo, movimientos planetarios, cálculo de eclipses, visibilidad de la luna creciente), más de doscientos zijes entre los siglos VIII y XV, centros en Bagdad, Maragha, Samarcanda, Constantinopla y casi un centenar más en la India."
  fr: "Article de Wikipédia en anglais sur le zij; informations sur l’entité uniquement: le nom dérive du moyen persan zih ou zig signifiant corde, transféré du tissage aux rangées de tables, contenu typique du zij (chronologie, latitudes et longitudes, tables d’étoiles, fonctions trigonométriques, astronomie sphérique, équation du temps, mouvements planétaires, calcul des éclipses, visibilité du croissant), plus de deux cents zijes entre les VIIIe et XVe siècles, centres à Bagdad, Maragha, Samarcande, Constantinople et près d’une centaine d’autres en Inde."
  ur: "زیج پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: مشرق فارسی زِہ یا زِگ سے ماخوذ نام جس کا مطلب ہے ڈوری، بُنائی سے میز کی قطاروں میں منتقل، عام زِج کے مشمولات (تاریخ، عرض البلد اور طول البلد، ستارے کی میزیں، مثلثی افعال، کروی فلکیات، وقت کی مساوات، سیاروں کی رفتار، دو سو سے زائد سیاروں کی رفتار، سیاروں کی گردش آٹھویں اور پندرہویں صدی کے درمیان، بغداد، مراثہ، سمرقند، قسطنطنیہ اور ہندوستان میں تقریباً ایک سو کے مراکز۔"
  tr: "Zig hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için: ismin Orta Farsça zih veya zig'den türemesi, yani iplik anlamına gelmesi ve dokumadan tablo sıralarına geçişi, zijlerin takvim, çizgiler, enlem, yıldız tabloları, üçgen fonksiyonlar, zaman denklemi, gezegen hareketleri, tutulmalar ve hilal gözlemi gibi olağan içerikleri; 8. ve 15. yüzyıllar arasında iki yüzden fazla zig, Bağdat, Marage, Semerkant, İstanbul ve Hindistan'da yaklaşık yüz başka merkez bulunuyordu."
  id: "Artikel Wikipedia bahasa Inggris tentang zig; hanya untuk fakta entitas: asal-usul nama dari Persia Tengah zih atau zig, yang berarti benang, dan transisinya dari tenunan ke baris tabel, isi biasanya zijs seperti kalender, garis, lintang, tabel bintang, fungsi segitiga, persamaan waktu, pergerakan planet, gerhana, dan penampakan bulan sabit, lebih dari dua ratus zig antara abad ke-8 dan ke-15, dengan pusat-pusat di Baghdad, Maragheh, Samarkand, Istanbul, dan sekitar seratus lainnya di India."
