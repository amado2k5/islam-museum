summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الزيج؛ لوقائع الكيان فقط: اشتقاق الاسم من الفارسية الوسطى zih أو zig بمعنى خيط وانتقاله من النسج إلى صفوف الجداول، المحتوى المعتاد للأزياج من تقويم وخطوط وعرض وجداول نجوم ودوال مثلثية ومعادلة الزمن وحركات كواكب وكسوف ورؤية هلال، أزيد من مئتي زيج بين القرنين الثامن والخامس عشر، ومراكزها في بغداد ومراغة وسمرقند وإستانبول ونحو مئة أخرى في الهند."
  en: "English Wikipedia article on the zij; entity facts only: the name derived from Middle Persian zih or zig meaning cord, transferred from weaving to table rows, typical zij contents (chronology, latitudes and longitudes, star tables, trigonometrical functions, spherical astronomy, equation of time, planetary motions, eclipse computation, crescent visibility), over two hundred zijes between the eighth and fifteenth centuries, centres at Baghdad, Maragha, Samarkand, Constantinople and nearly a hundred more in India."
