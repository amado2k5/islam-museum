label: { ar: "الصواعق المرسلة على الجهمية والمعطلة لابن قيم الجوزية، تحقيق حسين بن عكاشة بن رمضان وآخرين، المجلد الأول ⁦(مع مقدمة التحقيق)⁩، دار عطاءات العلم، الرياض، الطبعة الأولى 1445هـ", en: "al-Sawa'iq al-Mursala 'ala al-Jahmiyya wa'l-Mu'attila of Ibn Qayyim al-Jawziyya, ed. Husayn ibn Ukasha ibn Ramadan et al., vol. 1 (with the editors' introduction), Dar Ata'at al-'Ilm, Riyadh, 1st ed., 1445 AH" }
summary:
  ar: "المجلد الأول من طبعة دار عطاءات العلم للصواعق المرسلة ضمن «مجموع مؤلفات الإمام ابن قيم الجوزية» ⁦(آثار ابن القيم وما لحقها)⁩، وفق المنهج المعتمد من الشيخ بكر أبو زيد، تحقيق حسين بن عكاشة بن رمضان وتخريج حسين بن حسن باقر وكريم محمد عيد؛ في أوله دراسة المحققين: توثيق النسبة، وعرض الفصول، والقدر الموجود، والمختصرات، والطبعات السابقة."
  en: "Volume 1 of the Dar Ata'at al-'Ilm printing of al-Sawa'iq al-Mursala in the 'Collected Works of Imam Ibn Qayyim al-Jawziyya', following the method set by Shaykh Bakr Abu Zayd, edited by Husayn ibn Ukasha ibn Ramadan with hadith references by Husayn ibn Hasan Baqir and Karim Muhammad Eid; it opens with the editors' study: the attribution, an outline of the chapters, the extant portion, the abridgements and the earlier editions."
