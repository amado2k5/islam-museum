label: { ar: "الصواعق المرسلة على الجهمية والمعطلة لابن قيم الجوزية، تحقيق حسين بن عكاشة بن رمضان وآخرين، المجلد الأول ⁦(مع مقدمة التحقيق)⁩، دار عطاءات العلم، الرياض، الطبعة الأولى 1445هـ", en: "al-Sawa'iq al-Mursala 'ala al-Jahmiyya wa'l-Mu'attila of Ibn Qayyim al-Jawziyya, ed. Husayn ibn Ukasha ibn Ramadan et al., vol. 1 (with the editors' introduction), Dar Ata'at al-'Ilm, Riyadh, 1st ed., 1445 AH" }
summary:
  ar: "المجلد الأول من طبعة دار عطاءات العلم للصواعق المرسلة ضمن «مجموع مؤلفات الإمام ابن قيم الجوزية» ⁦(آثار ابن القيم وما لحقها)⁩، وفق المنهج المعتمد من الشيخ بكر أبو زيد، تحقيق حسين بن عكاشة بن رمضان وتخريج حسين بن حسن باقر وكريم محمد عيد؛ في أوله دراسة المحققين: توثيق النسبة، وعرض الفصول، والقدر الموجود، والمختصرات، والطبعات السابقة."
  en: "Volume 1 of the Dar Ata'at al-'Ilm printing of al-Sawa'iq al-Mursala in the 'Collected Works of Imam Ibn Qayyim al-Jawziyya', following the method set by Shaykh Bakr Abu Zayd, edited by Husayn ibn Ukasha ibn Ramadan with hadith references by Husayn ibn Hasan Baqir and Karim Muhammad Eid; it opens with the editors' study: the attribution, an outline of the chapters, the extant portion, the abridgements and the earlier editions."
  es: "Volumen 1 de la edición Dar Ata'at al-'Ilm de al-Sawa'iq al-Mursala en las 'Obras Completas del Imam Ibn Qayyim al-Jawziyya', siguiendo el método establecido por Shaykh Bakr Abu Zayd, editado por Husayn ibn Ukasha ibn Ramadan con referencias de hadices de Husayn ibn Hasan Baqir y Karim Muhammad Eid; comienza con el estudio de los editores: la atribución, un esquema de los capítulos, la parte existente, los abreviados y las ediciones anteriores."
  fr: "Le volume 1 de l'édition Dar Ata'at al-'Ilm d'al-Sawa'iq al-Mursala dans les « Œuvres complètes de l'imam Ibn Qayyim al-Jawziyya », suivant la méthode établie par Shaykh Bakr Abu Zayd, édité par Husayn ibn Ukasha ibn Ramadan avec des références aux hadiths par Husayn ibn Hasan Baqir et Karim Muhammad Eid; il s'ouvre sur l'étude des éditeurs: l'attribution, un aperçu des chapitres, la partie existante, les abrégés et les éditions antérieures."
  ur: "دار عطاء العلم کی جلد 1 طباعت الصوائق المرسلا کی مجموعۂ تصنیف امام ابن قیم الجوزیہ میں، شیخ بکر ابو زید کے وضع کردہ طریقہ پر عمل کرتے ہوئے، جس کی تدوین حسین بن عکاشہ بن رمضان نے کی ہے، حدیث حسن بعثین اور محمد حسنین کے حوالے سے۔ یہ ایڈیٹرز کے مطالعہ کے ساتھ کھلتا ہے: انتساب، ابواب کا خاکہ، موجودہ حصہ، اختصار اور سابقہ ایڈیشن۔"
  tr: "Al-Sawa'iq Al-Mursalah tarafından Dar At'at al-Ilm'in baskısının Birinci Cildi, \"İmam İbn Kayyim el-Cevziyya'nın Toplu Eserleri\" (Athar İbn el-Kayyim ve sonraki) içinde, Şeyh Bekir Ebu Zayd tarafından benimsenen metodolojiye göre, Hüseyin bin Aşka bin Ramazan tarafından düzenlenmiş ve Hüseyin bin Hasan Baqir ile Kerim Muhammed Bayram tarafından doğrulanmıştır; başlangıçta editörlerin çalışmaları yer alır: soyun belgelenmesi, bölümlerin sunulması, mevcut fermanın, kısaltmaların ve önceki baskıların sunulması."
  id: "Jilid Satu edisi Dar At'at al-Ilm oleh Al-Sawa'iq Al-Mursalah, dalam \"Karya Terkumpul Imam Ibn Qayyim al-Jawziyya\" (Athar Ibn al-Qayyim dan yang berikutnya), sesuai dengan metodologi yang diadopsi oleh Sheikh Bakr Abu Zayd, disunting oleh Hussein bin Ukasha bin Ramadan dan disahkan oleh Hussein bin Hasan Baqir dan Karim Muhammad Eid; di awal, mencakup studi para editor: mendokumentasikan garis keturunan, menyajikan bab-bab, dekret yang ada, ringkasan, dan edisi-edisi sebelumnya."
