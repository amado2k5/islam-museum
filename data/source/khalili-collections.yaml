summary:
  ar: "الموقع الرسمي لمقتنيات عائلة ناصر خليلي في الفنون الإسلامية — المعادن والخزفيات والمخطوطات والأسلحة والمنسوجات — بصفحة مستقلة لكل قطعة تحمل البيانات الفنية والتأريخ والمصدر." 
  en: "The published online database of the Nasser D. Khalili family's Islamic-art collections — metalwork, ceramics, manuscripts, arms and textiles — with a dedicated page per object carrying catalogue data, dating and provenance."
  ur: "The published online database of the Nasser D. Khalili family's Islamic-art collections — metalwork, ceramics, manuscripts, arms and textiles — with a dedicated page per object carrying catalogue data, dating and provenance."
  es: "La base de datos en línea publicada de las colecciones de arte islámico de la familia Nasser D. Khalili —metalurgia, cerámica, manuscritos, armas y textiles— cuenta con una página dedicada a cada objeto que incluye datos de catálogo, datación y procedencia."
  fr: "La base de données en ligne publiée des collections d'art islamique de la famille Nasser D. Khalili — objets en métal, céramiques, manuscrits, armes et textiles — avec une page dédiée pour chaque objet contenant des données de catalogue, la datation et la provenance."
  tr: "Nasser Halili ailesinin İslami sanatlar koleksiyonlarının resmi web sitesinde — metaller, seramik, el yazmaları, silahlar ve tekstiller — her eser için ayrı bir sayfa bulunuyor; burada sanatsal veriler, tarih ve kaynak yer alıyor."
  id: "Situs resmi untuk koleksi keluarga Nasser Khalili dalam seni Islam — logam, keramik, manuskrip, senjata, dan tekstil — memiliki halaman terpisah untuk setiap karya yang memuat data artistik, sejarah, dan sumber."
