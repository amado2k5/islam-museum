summary:
  ar: "قناة «فت مسلمة» (Fit Muslimah) على يوتيوب (@FitMuslimah)؛ مصدر أولي لفيديوهات مباركة إبراهيم في الصحة الشاملة واللياقة للمسلمات، وتصف نفسها بأنها مدربة صحة شاملة تساعد المسلمات فوق الأربعين على عكس مقاومة الإنسولين وخسارة دهون البطن والحضور الأعمق في الصلاة."
  en: "The Fit Muslimah YouTube channel (@FitMuslimah); a primary source for Mubarakah Ibrahim's videos on holistic health and fitness for Muslim women, describing her as a holistic health coach helping Muslim women over 40 reverse insulin resistance, lose belly fat, and feel more present in their prayer."
  es: "El canal de YouTube Fit Muslimah (@FitMuslimah); una fuente principal de los videos de Mubarakah Ibrahim sobre salud y bienestar integral para mujeres musulmanas, que la describe como una entrenadora de salud integral que ayuda a las mujeres musulmanas mayores de 40 años a revertir la resistencia a la insulina, perder grasa abdominal y sentirse más presentes en su oración."
  fr: "La chaîne YouTube Fit Muslimah (@FitMuslimah); une source principale pour les vidéos de Mubarakah Ibrahim sur la santé et la forme physique holistiques pour les femmes musulmanes, la décrivant comme une coach de santé holistique aidant les femmes musulmanes de plus de 40 ans à inverser la résistance à l'insuline, à perdre de la graisse abdominale et à se sentir plus présentes dans leur prière."
  ur: "فٹ مسلمہ یوٹیوب چینل (@FitMuslimah)؛ مبارکہ ابراہیم کی مسلم خواتین کے لیے مجموعی صحت اور تندرستی کے بارے میں ویڈیوز کا ایک بنیادی ذریعہ، انہیں ایک جامع ہیلتھ کوچ کے طور پر بیان کیا گیا ہے جو 40 سے زائد عمر کی مسلمان خواتین کو انسولین کے خلاف مزاحمت، پیٹ کی چربی کو کم کرنے، اور اپنی نماز میں زیادہ حاضر ہونے میں مدد کرتی ہے۔"
