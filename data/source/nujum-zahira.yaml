label:
  ar: النجوم الزاهرة في ملوك مصر والقاهرة — ابن تغري بردي
  en: Al-Nujum al-Zahira fi Muluk Misr wa-l-Qahira — Ibn Taghribirdi
  ur: النجوم الزاہرہ فی ملوک مصر والقاہرہ — ابن تغری بردی
summary:
  ar: "تاريخ جمال الدين أبي المحاسن يوسف بن تغري بردي الأتابكي ⁦(ت 874هـ)⁩ لملوك مصر والقاهرة على السنين؛ يغطي الجزء الخامس عشر سنوات 836–854هـ {cite:nujum-zahira 15/3}."
  en: "Jamal al-Din Abu al-Mahasin Yusuf ibn Taghribirdi al-Atabaki's (d. 874 AH) annalistic history of the rulers of Egypt and Cairo; part fifteen covers the years 836–854 AH {cite:nujum-zahira 15/3}."
  ur: "جمال الدین ابو المحاسن یوسف بن تغری بردی اتابکی (وفات 874ھ) کی مصر و قاہرہ کے سلاطین کی سال بہ سال تاریخ؛ پندرھواں حصہ 836–854ھ گزارتا ہے {cite:nujum-zahira 15/3}۔"
