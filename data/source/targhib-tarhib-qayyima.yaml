label:
  ar: "الترغيب والترهيب من الحديث الشريف — زكي الدين عبد العظيم بن عبد القوي المنذري (ت 656هـ)، المكتبة القيمة، القاهرة، في أربعة أجزاء"
  en: "al-Targhib wa-l-Tarhib min al-Hadith al-Sharif — Zaki al-Din 'Abd al-'Azim b. 'Abd al-Qawi al-Mundhiri (d. 656 AH), al-Maktaba al-Qayyima, Cairo, 4 vols."
summary:
  ar: "طبعة المكتبة القيمة بالقاهرة لكتاب المنذري، قوبلت على عدة نسخ فوُجدت فيها زيادات لم توجد في النسخة المطبوعة من قبل فأُثبتت، ومعها كتاب «الترغيب والترهيب من القرآن الحكيم» لمحمد منير الدمشقي، وبحواشيها تعليقات في الغريب وتراجم أصحاب الكتب ونقد بعض الأحاديث لمعلّق لم يُسمّ في الصفحات المقروءة."
  en: "The al-Maktaba al-Qayyima (Cairo) edition of al-Mundhiri's book, collated with several copies in which additions were found that were missing from the earlier printing and were added, together with al-Targhib wa-l-Tarhib min al-Qur'an al-Hakim by Muhammad Munir al-Dimashqi; its footnotes, by an annotator not named in the pages read, gloss rare words, give notices on the compilers and comment on some hadiths."
title: "الترغيب والترهيب من الحديث الشريف"
