summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نجيب رزاق ⁦(وُلد 1953)⁩؛ تُستخدم لوقائع الكيان فقط. تروي مولده في كوالا ليبيس ببهانغ في 23 يوليو 1953 الابن الأكبر لعبد الرزاق حسين، ومسيرته الوزارية ونيابته لرئاسة الوزراء، ورئاسته السادسة لوزراء ماليزيا (2009–2018)، وإدانته وسجنه في فضيحة صندوق التنمية الماليزي (1MDB)."
  en: "English Wikipedia article on Najib Razak (born 1953); used for entity facts only. It recounts his birth at Kuala Lipis, Pahang, on 23 July 1953 as the eldest son of Abdul Razak Hussein, his ministerial career and deputy premiership, his tenure as Malaysia's sixth prime minister (2009–2018), and his conviction and imprisonment in the 1Malaysia Development Berhad (1MDB) scandal."
  es: "Artículo de la Wikipedia en inglés sobre Najib Razak (nacido en 1953); utilizado únicamente para datos biográficos. Relata su nacimiento en Kuala Lipis, Pahang, el 23 de julio de 1953 como hijo mayor de Abdul Razak Hussein, su carrera ministerial y su cargo de viceprimer ministro, su mandato como sexto primer ministro de Malasia (2009-2018) y su condena y encarcelamiento en el escándalo de 1Malaysia Development Berhad (1MDB)."
  fr: "Article de Wikipédia en anglais sur Najib Razak (né en 1953); utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Kuala Lipis, Pahang, le 23 juillet 1953, en tant que fils aîné d'Abdul Razak Hussein, sa carrière ministérielle et son poste de vice-premier ministre, son mandat de sixième premier ministre de Malaisie (2009-2018), ainsi que sa condamnation et son emprisonnement dans le cadre du scandale 1Malaysia Development Berhad (1MDB)."
  ur: "نجیب رزاق ⁦(پیدائش 1953)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 23 جولائی 1953 کو کوالا لپس، پہانگ میں ان کی پیدائش، عبدالرزاق حسین کے سب سے بڑے بیٹے کے طور پر، ان کے وزارتی کیریئر اور نائب وزیر اعظم، ملائیشیا کے چھٹے وزیر اعظم (2009-2018) کے طور پر ان کا دور، اور 1 اسکائی ڈیولپمنٹ میں ان کی سزا اور قید کا ذکر ہے۔"
  tr: "Najib Razak (d. 1953) hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılmıştır. 23 Temmuz 1953'te Kuala Lipis, Bhang'da doğduğu doğum hikayesi, Abdul Razak Hussain'in en büyük oğlu olarak doğduğu bakanlık kariyerini, başbakan yardımcılığını, altıncı başbakanlığını (2009–2018) ve Malezya Kalkınma Fonu (1MDB) skandalında mahkumiyeti ve hapis cezasını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Najib Razak (lahir 1953); hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya di Kuala Lipis, Bhang pada 23 Juli 1953, putra sulung Abdul Razak Hussain, karier menterinya, jabatan wakil perdana menteri, masa perdana menteri keenamnya (2009–2018), serta vonis dan penahanannya dalam skandal Dana Pembangunan Malaysia (1MDB)."
