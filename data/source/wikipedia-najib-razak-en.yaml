  ar: "مقالة ويكيبيديا الإنجليزية عن نجيب رزاق (وُلد 1953)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في كوالا ليبيس ببهانغ في 23 يوليو 1953 الابن الأكبر لعبد الرزاق حسين، ومسيرته الوزارية ونيابته لرئاسة الوزراء، ورئاسته السادسة لوزراء ماليزيا (2009–2018)، وإدانته وسجنه في فضيحة صندوق التنمية الماليزي (1MDB)."
  en: "English Wikipedia article on Najib Razak (born 1953); used for entity facts only. It recounts his birth at Kuala Lipis, Pahang, on 23 July 1953 as the eldest son of Abdul Razak Hussein, his ministerial career and deputy premiership, his tenure as Malaysia's sixth prime minister (2009–2018), and his conviction and imprisonment in the 1Malaysia Development Berhad (1MDB) scandal."
