summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن يوسف رضا غيلاني؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 9 يونيو 1952 في ملتان في أسرة سرائيكية من السادة الصوفية، ودراسته الصحافة السياسية، ومسيرته في الرابطة الإسلامية ثم حزب الشعب، ووزارتيه ورئاسته للجمعية الوطنية (1993–1997)، وسجنه (2001–2006) وإدانته وما وُصف به من تسييس، ورئاسته الوزراء (2008–2012)، وإدانته بازدراء المحكمة في أبريل 2012 وعزله في يونيو 2012، ورئاسته لمجلس الشيوخ منذ 2024. ويصنّفه تصنيف في آخرها في «مسلمي باكستان السنّة»."
  en: "English Wikipedia article on Yusuf Raza Gilani; used for entity facts only. It recounts his birth on 9 June 1952 at Multan to a Saraiki family of Sufi Sayyids, his studies in political journalism, his career in the Muslim League and then the Peoples Party, his ministries and speakership of the National Assembly (1993–1997), his imprisonment (2001–2006) and conviction and their reported political motivation, his premiership (2008–2012), his contempt-of-court conviction in April 2012 and disqualification in June 2012, and his chairmanship of the Senate since 2024. A category at its foot files him under 'Pakistani Sunni Muslims'."
  es: "Artículo de la Wikipedia en inglés sobre Yusuf Raza Gilani; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 9 de junio de 1952 en Multan en el seno de una familia saraiki de sayyids sufíes, sus estudios de periodismo político, su trayectoria en la Liga Musulmana y posteriormente en el Partido Popular, sus ministerios y su presidencia de la Asamblea Nacional (1993-1997), su encarcelamiento (2001-2006) y su condena, así como su presunta motivación política, su mandato como primer ministro (2008-2012), su condena por desacato al tribunal en abril de 2012 y su inhabilitación en junio de 2012, y su presidencia del Senado desde 2024. Una categoría al pie del artículo lo clasifica dentro de la categoría de \"musulmanes sunitas pakistaníes\"."
  fr: "Article de Wikipédia en anglais sur Yusuf Raza Gilani; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance le 9 juin 1952 à Multan, au sein d'une famille saraiki de Sayyids soufis, ses études de journalisme politique, sa carrière au sein de la Ligue musulmane puis du Parti du peuple, ses ministères et sa présidence de l'Assemblée nationale (1993-1997), son emprisonnement (2001-2006) et sa condamnation, ainsi que les motivations politiques qui en découlent, son poste de Premier ministre (2008-2012), sa condamnation pour outrage au tribunal en avril 2012 et sa destitution en juin 2012, et sa présidence du Sénat depuis 2024. Une catégorie en bas de page le classe dans la catégorie « Musulmans sunnites pakistanais »."
