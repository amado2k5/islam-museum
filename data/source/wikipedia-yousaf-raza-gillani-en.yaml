summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن يوسف رضا غيلاني؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 9 يونيو 1952 في ملتان في أسرة سرائيكية من السادة الصوفية، ودراسته الصحافة السياسية، ومسيرته في الرابطة الإسلامية ثم حزب الشعب، ووزارتيه ورئاسته للجمعية الوطنية (1993–1997)، وسجنه (2001–2006) وإدانته وما وُصف به من تسييس، ورئاسته الوزراء (2008–2012)، وإدانته بازدراء المحكمة في أبريل 2012 وعزله في يونيو 2012، ورئاسته لمجلس الشيوخ منذ 2024. ويصنّفه تصنيف في آخرها في «مسلمي باكستان السنّة»."
  en: "English Wikipedia article on Yusuf Raza Gilani; used for entity facts only. It recounts his birth on 9 June 1952 at Multan to a Saraiki family of Sufi Sayyids, his studies in political journalism, his career in the Muslim League and then the Peoples Party, his ministries and speakership of the National Assembly (1993–1997), his imprisonment (2001–2006) and conviction and their reported political motivation, his premiership (2008–2012), his contempt-of-court conviction in April 2012 and disqualification in June 2012, and his chairmanship of the Senate since 2024. A category at its foot files him under 'Pakistani Sunni Muslims'."
