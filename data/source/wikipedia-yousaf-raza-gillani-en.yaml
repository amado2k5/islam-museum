reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. The article has no religion field and no text naming his own affiliation: its only religion text concerns his family's purported descent from the Sunni theologian Abd al-Qadir al-Jilani and the Sufi saint Musa al-Jilani — lineage, not an attestation — and a category filing places him under 'Pakistani Sunni Muslims'. A keyword search found no Shia content in the article at all. The article gives his birth at Multan; Wikidata instead gives Karachi."
