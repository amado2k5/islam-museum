  ur: "انگریزی ویکیپیڈیا کا مضمون شیرون پشیور پر ⁦(پیدائش 24 مارچ 1974 تہران میں)⁩، ایرانی نژاد امریکی کاروباری، وینچر کیپیٹلسٹ اور سپر اینجل سرمایہ کار، شیرپا کیپٹل اور ہائپر لوپ ون کے شریک بانی۔ یہ اس کے لیے کسی مذہبی وابستگی کا نام نہیں لیتا۔"
