summary:
  ar: "سجل فهرسي لرسالة الخجندي في صناعة الآلة الشاملة مع أسمائها البديلة وأربعة شهود مخطوطة ومرجع ببليوغرافي لروزنفيلد وإحسان أوغلو."
  en: "Catalogue record for al-Khujandi's treatise on constructing the comprehensive instrument, with title aliases, four manuscript witnesses and the Rozenfeld-İhsanoğlu bibliographic reference."
  ur: "خجندی کے جامع آلہ کی تعمیر کے رسالے کا فہرستی ریکارڈ، متبادل ناموں، چار مخطوطہ گواہوں اور روزنفیلڈ و احسان اوغلو کے ماخذ کے ساتھ۔"
  es: "Registro del catálogo del tratado de al-Khujandi sobre la construcción del instrumento exhaustivo, con títulos alternativos, cuatro copias manuscritas y la referencia bibliográfica de Rozenfeld-İhsanoğlu."
  fr: "Notice de catalogue du traité d'al-Khujandi sur la construction de l'instrument complet, avec les alias du titre, quatre témoins manuscrits et la référence bibliographique Rozenfeld-İhsanoğlu."
  tr: "Al-Khujandi'nin kapsamlı enstrümanın yapımına dair incelemesinin dizin kaydı; alternatif isimleri, dört el yazması tanığı ve Rosenfeld ile İhsanoğlu için bibliyografik bir referans."
  id: "Catatan indeks risalah Al-Khujandi tentang pembuatan instrumen komprehensif beserta nama alternatifnya, empat saksi manuskrip, dan referensi bibliografi untuk Rosenfeld dan Ihsanoglu."
