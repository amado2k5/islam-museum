reliability_note: "Actual complete text record read 2026-11-15. Aliases: Kitāb al-ālaẗ al-šāmilaẗ, Kitāb al-ālah al-ʿāmmah, Kitāb ṣanʿat al-ālah al-shāmilah; subject Astronomical Instruments; text type first-order prose composition. Four witnesses listed: Birmingham Islamic Arabic 560, Bursa İnebey Yazma Haraççıoğlu 1217, Cairo Dār al-Kutub Dār al-Kutub mīqāt 970, Oxford Bodleian Huntington 566. Literature reference: Rozenfeld and İhsanoğlu 2003, p. 100, no. 269, A1. A linked text record (ismi_id 99184) is the later 'Complement to the Book of al-Khujandī on the Universal Instrument' by Abū al-Qāsim Hibat Allāh ibn al-Ḥusayn al-Asṭurlābī. Database entry only: it establishes the work's existence and witnesses, not the instrument's mechanics, which remain unread because no edition exists."
