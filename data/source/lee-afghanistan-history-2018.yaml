reliability_note: "Read on 27 October 2026 in the online reproduction of the book; the passages used are the Sherpur and 1885 purge narrative and the note on the son's succession as pir. Lee's text implies Mushk-i 'Alam held the standing of a pir (his son 'succeeded him as pir'); it names no order for him."
