summary:
  ar: "تاريخ أفغانستان لجوناثان لي (2018). يروي أن مشك عالم والجنرال محمد جان خان وردك كانا العنصرين الأساسيين في حصار معسكر شيرپور سنة 1879، وأن الأمير عبد الرحمن اتهمهما بالتآمر لإعادة أيوب خان فاعتُقلا وسُمّما في السجن أو قُتلا، وأن ابنه الأكبر عبد الكريم خلفه بيرا وأصدر فتوى ضد الأمير في أواخر 1885. ويذكر أيضا نجاح نجم الدين آخوندزاده (صاحب هده) في شبكة مشايخ الحدود."
  en: "Jonathan L. Lee's history of Afghanistan (Reaktion Books, 2018). It recounts that Mushk-i 'Alam and General Muhammad Jan Khan Wardak were the two men instrumental in the siege of the Sherpur cantonment in 1879; that Amir 'Abd al-Rahman accused them of plotting the restoration of Ayub Khan, and that they were arrested and poisoned in prison or put to death; and that by the end of 1885 Mushk-i 'Alam's eldest son 'Abd al-Karim had succeeded him as pir and issued a fatwa against the Amir. Its narrative presupposes Mushk-i 'Alam's death in or before 1885."
title: "Afghanistan: A History from 1260 to the Present"
