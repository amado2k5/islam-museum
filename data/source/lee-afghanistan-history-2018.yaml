summary:
  ar: "تاريخ أفغانستان لجوناثان لي (2018). يروي أن مشك عالم والجنرال محمد جان خان وردك كانا العنصرين الأساسيين في حصار معسكر شيرپور سنة 1879، وأن الأمير عبد الرحمن اتهمهما بالتآمر لإعادة أيوب خان فاعتُقلا وسُمّما في السجن أو قُتلا، وأن ابنه الأكبر عبد الكريم خلفه بيرا وأصدر فتوى ضد الأمير في أواخر 1885. ويذكر أيضا نجاح نجم الدين آخوندزاده ⁦(صاحب هده)⁩ في شبكة مشايخ الحدود."
  en: "Jonathan L. Lee's history of Afghanistan (Reaktion Books, 2018). It recounts that Mushk-i 'Alam and General Muhammad Jan Khan Wardak were the two men instrumental in the siege of the Sherpur cantonment in 1879; that Amir 'Abd al-Rahman accused them of plotting the restoration of Ayub Khan, and that they were arrested and poisoned in prison or put to death; and that by the end of 1885 Mushk-i 'Alam's eldest son 'Abd al-Karim had succeeded him as pir and issued a fatwa against the Amir. Its narrative presupposes Mushk-i 'Alam's death in or before 1885."
  es: "La historia de Afganistán de Jonathan L. Lee (Reaktion Books, 2018) relata que Mushk-i 'Alam y el general Muhammad Jan Khan Wardak fueron los dos hombres clave en el asedio del acuartelamiento de Sherpur en 1879; que el emir 'Abd al-Rahman los acusó de conspirar para restaurar a Ayub Khan, y que fueron arrestados y envenenados en prisión o ejecutados; y que a finales de 1885, el hijo mayor de Mushk-i 'Alam, 'Abd al-Karim, lo sucedió como pir y emitió una fatwa contra el emir. Su narración presupone la muerte de Mushk-i 'Alam en 1885 o antes."
  fr: "L'ouvrage de Jonathan L. Lee sur l'Afghanistan (Reaktion Books, 2018) relate que Mushk-i 'Alam et le général Muhammad Jan Khan Wardak furent les deux hommes clés du siège du cantonnement de Sherpur en 1879; que l'émir 'Abd al-Rahman les accusa de comploter pour restaurer Ayub Khan, et qu'ils furent arrêtés et empoisonnés en prison ou exécutés; et qu'à la fin de 1885, le fils aîné de Mushk-i 'Alam, 'Abd al-Karim, lui succéda comme pir et émit une fatwa contre l'émir. Ce récit présuppose la mort de Mushk-i 'Alam en 1885 ou avant."
