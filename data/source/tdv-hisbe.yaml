summary:
  ar: "مدخل «حسبة» في موسوعة TDV الإسلامية التركية، ويتناول معنى الحسبة وحكمها الفقهي، وتاريخها في البلاد الإسلامية المركزية والمغرب والأندلس وإيران وآسيا الوسطى ومصر والشام والأناضول والدولة العثمانية، ثم شبه القارة الهندية، وصلاحيات المحتسب وحدوده."
  en: "The TDV İslâm Ansiklopedisi entry 'Hisbe' (the institution of public order and morals in Islamic states). It covers the meaning and legal rule of hisba, the powers and limits of the muhtasib, its history from the Prophet's time through the Abbasid, Fatimid, Mamluk, Maghrebi, Andalusi, Iranian, Anatolian Seljuk and Ottoman periods, and a note on the Indian subcontinent. Its sections are by Cengiz Kallek (law and history of the central lands), A. S. Bazmee Ansari (the subcontinent) and Ziya Kazıcı (the Ottoman state)."
  es: "La entrada «Hisba» (la institución del orden público y la moral en los estados islámicos) de la TDV İslâm Ansiklopedisi abarca el significado y la norma jurídica de la hisba, las atribuciones y limitaciones del muhtasib, su historia desde la época del Profeta hasta los periodos abasí, fatimí, mameluco, magrebí, andalusí, iraní, selyúcida anatolio y otomano, e incluye una nota sobre el subcontinente indio. Sus secciones están escritas por Cengiz Kallek (derecho e historia de las tierras centrales), AS Bazmee Ansari (el subcontinente) y Ziya Kazıcı (el estado otomano)."
  fr: "L'article « Hisbe » (l'institution de l'ordre public et de la moralité dans les États islamiques) de l'encyclopédie islamique TDV İslâm Ansiklopedisi traite de la signification et du cadre juridique de la hisba, des pouvoirs et des limites des muhtasib, de son histoire depuis l'époque du Prophète jusqu'aux périodes abbasside, fatimide, mamelouke, maghrébine, andalouse, iranienne, seldjoukide d'Anatolie et ottomane, ainsi que d'une note sur le sous-continent indien. Les sections sont rédigées par Cengiz Kallek (droit et histoire des terres centrales), AS Bazmee Ansari (le sous-continent) et Ziya Kazıcı (l'État ottoman)."
