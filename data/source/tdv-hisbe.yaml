summary:
  ar: "مدخل «حسبة» في موسوعة TDV الإسلامية التركية، ويتناول معنى الحسبة وحكمها الفقهي، وتاريخها في البلاد الإسلامية المركزية والمغرب والأندلس وإيران وآسيا الوسطى ومصر والشام والأناضول والدولة العثمانية، ثم شبه القارة الهندية، وصلاحيات المحتسب وحدوده."
  en: "The TDV İslâm Ansiklopedisi entry 'Hisbe' (the institution of public order and morals in Islamic states). It covers the meaning and legal rule of hisba, the powers and limits of the muhtasib, its history from the Prophet's time through the Abbasid, Fatimid, Mamluk, Maghrebi, Andalusi, Iranian, Anatolian Seljuk and Ottoman periods, and a note on the Indian subcontinent. Its sections are by Cengiz Kallek (law and history of the central lands), A. S. Bazmee Ansari (the subcontinent) and Ziya Kazıcı (the Ottoman state)."
