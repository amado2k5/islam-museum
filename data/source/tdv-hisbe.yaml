reliability_note: "Read in the web edition on 2 November 2026: the fiqh section, the history of the central lands (up to the Mamluk and Fatimid periods), the Maghreb and al-Andalus, Iran and Transoxiana, the Anatolian Seljuks, and the Ottoman section (read in full). The subcontinent section was read only as its opening line on the index. The bibliography names classical manuals (al-Shayzari, Ibn al-Ukhuwwa, Ibn Bassam, al-Makkari, al-Maqrizi and others) that were not read for this record. Facts are rewritten in the museum's own words and cited by section; page numbers are given only where the web edition prints them."
