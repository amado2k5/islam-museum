summary:
  ar: "مقالة ويكيبيديا العربية عن آصف علي؛ بذرة قصيرة تُستخدم لوقائع الكيان فقط. تذكر ولادته في 11 أيار 1888 ووفاته في 1 نيسان 1953، وتصفه بأنه سياسي ودبلوماسي ومحام هندي، أول سفير هندي في الولايات المتحدة وحاكم أوديشا."
  en: "Arabic Wikipedia article on Asaf Ali; a short stub used for entity facts only. It gives his birth on 11 May 1888 and his death on 1 April 1953, and describes him as an Indian politician, diplomat and lawyer, India's first ambassador to the United States and a Governor of Odisha."
  es: "Artículo en árabe de la Wikipedia sobre Asaf Ali; un breve esbozo que solo incluye datos sobre la persona. Indica su fecha de nacimiento, el 11 de mayo de 1888, y su fallecimiento, el 1 de abril de 1953. Lo describe como político, diplomático y abogado indio, primer embajador de la India en Estados Unidos y gobernador de Odisha."
  fr: "Article Wikipédia en arabe sur Asaf Ali; une brève ébauche servant uniquement à fournir des informations factuelles. On y trouve la date de naissance (11 mai 1888) et la date de décès (1er avril 1953), et le décrit comme un homme politique, diplomate et avocat indien, premier ambassadeur de l'Inde aux États-Unis et gouverneur de l'Odisha."
  ur: "اسف علی پر عربی ویکیپیڈیا مضمون؛ ایک مختصر سٹب صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ یہ 11 مئی 1888 کو ان کی پیدائش اور 1 اپریل 1953 کو ان کی موت کا ذکر کرتا ہے، اور انہیں ایک ہندوستانی سیاست دان، سفارت کار اور وکیل، ریاستہائے متحدہ میں ہندوستان کے پہلے سفیر اور اوڈیشہ کے گورنر کے طور پر بیان کرتا ہے۔"
  tr: "Asif Ali hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılan kısa bir taslaktır. 11 Mayıs 1888 doğumlu ve 1 Nisan 1953'te ölmüş olarak anılmaktadır; kendisi Hintli bir siyasetçi, diplomat ve avukat, Amerika Birleşik Devletleri'ndeki ilk Hint büyükelçisi ve Odisha valisi olarak tanımlanır."
  id: "Artikel Wikipedia berbahasa Arab tentang Asif Ali; sebuah stub pendek yang hanya digunakan untuk fakta entitas. Ia disebutkan lahir pada 11 Mei 1888, dan meninggal pada 1 April 1953, serta menggambarkannya sebagai seorang politikus, diplomat, dan pengacara India, duta besar India pertama untuk Amerika Serikat, dan gubernur Odisha."
