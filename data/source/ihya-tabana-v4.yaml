label:
  ar: "إحياء علوم الدين للغزالي، الجزء الرابع، بتقديم بدوي طبانة ⁦(كرياطه فوترا، سمارانج)⁩"
  en: "al-Ghazali, Ihya' 'Ulum al-Din, part 4, introduced by Badawi Tabana (Karya Toha Putra, Semarang)"
  ur: "غزالی، احیاء علوم الدین، جزء چہارم، تقدیم بدوی طبانہ (کریا طٰہٰ پترا، سمارانگ)"
summary:
  ar: "الجزء الرابع من طبعة الإحياء التي قدّم لها الدكتور بدوي طبانة الأستاذ المساعد بكلية دار العلوم بالقاهرة بمقدمة في التصوف ودراسة لشخصية الغزالي وفلسفته، ومعه «المغني» للعراقي وبهامشه «عوارف المعارف» للسهروردي؛ طبع مكتبة ومطبعة كرياطه فوترا بسمارانج."
  en: "Part 4 of the Ihya' edition introduced by Dr Badawi Tabana of Dar al-'Ulum, Cairo University, with a preface on Sufism and a study of al-Ghazali; it carries al-Iraqi's al-Mughni, with al-Suhrawardi's 'Awarif al-Ma'arif in the margin. Printed by Karya Toha Putra, Semarang."
  ur: "احیاء کے اس ایڈیشن کا چوتھا جزء جس پر ڈاکٹر بدوی طبانہ (دار العلوم، جامعہ قاہرہ) نے تصوف اور غزالی کی شخصیت پر مقدمہ لکھا؛ ساتھ عراقی کی «المغنی» اور حاشیے پر سہروردی کی «عوارف المعارف»؛ کریا طٰہٰ پترا، سمارانگ کی طباعت۔"
