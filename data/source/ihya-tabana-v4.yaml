label:
  ar: "إحياء علوم الدين للغزالي، الجزء الرابع، بتقديم بدوي طبانة ⁦(كرياطه فوترا، سمارانج)⁩"
  en: "al-Ghazali, Ihya' 'Ulum al-Din, part 4, introduced by Badawi Tabana (Karya Toha Putra, Semarang)"
  ur: "غزالی، احیاء علوم الدین، جزء چہارم، تقدیم بدوی طبانہ ⁦(کریا طٰہٰ پترا، سمارانگ)⁩"
summary:
  ar: "الجزء الرابع من طبعة الإحياء التي قدّم لها الدكتور بدوي طبانة الأستاذ المساعد بكلية دار العلوم بالقاهرة بمقدمة في التصوف ودراسة لشخصية الغزالي وفلسفته، ومعه «المغني» للعراقي وبهامشه «عوارف المعارف» للسهروردي؛ طبع مكتبة ومطبعة كرياطه فوترا بسمارانج."
  en: "Part 4 of the Ihya' edition introduced by Dr Badawi Tabana of Dar al-'Ulum, Cairo University, with a preface on Sufism and a study of al-Ghazali; it carries al-Iraqi's al-Mughni, with al-Suhrawardi's 'Awarif al-Ma'arif in the margin. Printed by Karya Toha Putra, Semarang."
  ur: "احیاء کے اس ایڈیشن کا چوتھا جزء جس پر ڈاکٹر بدوی طبانہ ⁦(دار العلوم، جامعہ قاہرہ)⁩ نے تصوف اور غزالی کی شخصیت پر مقدمہ لکھا؛ ساتھ عراقی کی «المغنی» اور حاشیے پر سہروردی کی «عوارف المعارف»؛ کریا طٰہٰ پترا، سمارانگ کی طباعت۔"
  es: "Cuarta parte de la edición Ihya', introducida por el Dr. Badawi Tabana de Dar al-'Ulum, Universidad de El Cairo, con un prefacio sobre el sufismo y un estudio de al-Ghazali; incluye al-Mughni de al-Iraqi, con el 'Awarif al-Ma'arif de al-Suhrawardi en el margen. Impreso por Karya Toha Putra, Semarang."
  fr: "Quatrième partie de l'édition Ihya', introduite par le Dr Badawi Tabana de Dar al-'Ulum, Université du Caire, avec une préface sur le soufisme et une étude d'al-Ghazali; elle contient l'ouvrage al-Mughni d'al-Iraqi, avec 'Awarif al-Ma'arif d'al-Suhrawardi en marge. Imprimée par Karya Toha Putra, Semarang."
  tr: "Al-İhya'nın dördüncü bölümü, Kahire'deki Dar Al-Uloom Fakültesi Yardımcı Doçenti Dr. Badawi Tabana tarafından sunulan, tasavvuf üzerine bir giriş ve Al-Ghazali'nin kişiliği ile felsefesi üzerine bir çalışma ile birlikte Al-Irak'ın \"Al-Mughni\" ve kenar notları \"Awarif Al-Ma'arif\" Al-Suhrawardi tarafından sunulmuştur; Semarang'daki Kiryatah Kütüphanesi ve Yayını tarafından basılmıştır."
  id: "Bagian keempat edisi Al-Ihya, dipresentasikan oleh Dr. Badawi Tabana, Asisten Profesor di Fakultas Dar Al-Uloom di Kairo, dengan pengantar tentang Sufisme dan studi tentang kepribadian serta filsafat Al-Ghazali, bersama dengan \"Al-Mughni\" karya Al-Iraqi dan catatan pinggirnya \"Awarif Al-Ma'arif\" oleh Al-Suhrawardi; dicetak oleh Perpustakaan dan Percetakan Kiryatah di Semarang."
