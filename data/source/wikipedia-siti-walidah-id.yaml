summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن سيتي والدة؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في 3 كانون الثاني 1872 ووفاتها في 31 أيار 1946 في كاومان بيوجياكارتا، وتضيف تأسيسها أول مصلى للعائشية سنة 1922 وإصدارها مجلة «صوت العائشية» سنة 1926 وأسماء أبنائها الستة، ويعطي صندوق معلوماتها ديانتها «الإسلام» إجمالًا."
  en: "Indonesian Wikipedia article on Siti Walidah; used for entity facts only. It gives her birth on 3 January 1872 and her death on 31 May 1946, both at Kauman, Yogyakarta, and adds her founding of the first Aisyiyah prayer house in 1922, her launch of the magazine Suara Aisyiyah in 1926, and the names of her six children; its infobox gives her religion as Islam in general."
