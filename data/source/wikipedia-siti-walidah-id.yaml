summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن سيتي والدة؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في 3 كانون الثاني 1872 ووفاتها في 31 أيار 1946 في كاومان بيوجياكارتا، وتضيف تأسيسها أول مصلى للعائشية سنة 1922 وإصدارها مجلة «صوت العائشية» سنة 1926 وأسماء أبنائها الستة، ويعطي صندوق معلوماتها ديانتها «الإسلام» إجمالًا."
  en: "Indonesian Wikipedia article on Siti Walidah; used for entity facts only. It gives her birth on 3 January 1872 and her death on 31 May 1946, both at Kauman, Yogyakarta, and adds her founding of the first Aisyiyah prayer house in 1922, her launch of the magazine Suara Aisyiyah in 1926, and the names of her six children; its infobox gives her religion as Islam in general."
  es: "Artículo de la Wikipedia en indonesio sobre Siti Walidah; utilizado únicamente para datos biográficos. Indica su nacimiento el 3 de enero de 1872 y su fallecimiento el 31 de mayo de 1946, ambos en Kauman, Yogyakarta, y añade que fundó la primera casa de oración Aisyiyah en 1922, lanzó la revista Suara Aisyiyah en 1926 y mencionó los nombres de sus seis hijos; su ficha informativa indica que profesaba el Islam en general."
  fr: "Article de Wikipédia indonésien sur Siti Walidah; utilisé uniquement pour les informations la concernant. Il indique sa naissance le 3 janvier 1872 et son décès le 31 mai 1946, tous deux à Kauman, Yogyakarta, et mentionne la fondation de la première maison de prière Aisyiyah en 1922, le lancement du magazine Suara Aisyiyah en 1926, ainsi que les noms de ses six enfants; son infobox précise qu’elle était de confession musulmane."
  ur: "Siti Walidah پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 3 جنوری 1872 کو اس کی پیدائش اور 31 مئی 1946 کو اس کی موت، دونوں کومن، یوگیکارتا میں، اور اس نے 1922 میں اس کے پہلے عائشہ کے نماز گھر کی بنیاد رکھی، 1926 میں اس کا میگزین سورہ آسیہ کا اجرا، اور اس کے چھ بچوں کے نام؛ اس کا انفو باکس اس کا مذہب عام طور پر اسلام کے طور پر دیتا ہے۔"
