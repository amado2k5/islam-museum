label:
  ar: "شرطة — موسوعة TDV الإسلامية ⁦(يلماز)⁩"
  en: "ŞURTA (the shurta police institution and the sahib al-shurta) — TDV İslâm Ansiklopedisi (Metin Yılmaz)"
summary:
  ar: "مدخل «شرطة» في موسوعة TDV الإسلامية: جهاز الشرطة في المدن الإسلامية ورئيسه صاحب الشرطة من حراس العهد النبوي إلى تنظيم الدولة الأموية فالعباسية، صلاحياته القضائية والإدارية، مبانيه وعناصره وأزياء صاحب الشرطة وسلاح رجاله."
  en: "The TDV İslâm Ansiklopedisi entry on the shurta: the urban security institution of the Islamic states and its chief, the sahib al-shurta, from the watchmen of the Prophet's time to the Umayyad and Abbasid organisations, its judicial and administrative powers, its buildings and personnel, and the chief's investiture dress and the men's arms."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre la shurta: la institución de seguridad urbana de los estados islámicos y su jefe, el sahib al-shurta, desde los guardianes de la época del Profeta hasta las organizaciones omeyas y abasíes, sus poderes judiciales y administrativos, sus edificios y personal, y la vestimenta de investidura del jefe y las armas de los hombres."
  fr: "L'article de TDV İslâm Ansiklopedisi sur la shurta: l'institution de sécurité urbaine des États islamiques et son chef, le sahib al-shurta, depuis les gardiens de l'époque du Prophète jusqu'aux organisations omeyyades et abbassides, ses pouvoirs judiciaires et administratifs, ses bâtiments et son personnel, ainsi que la tenue d'investiture du chef et les armes des hommes."
  ur: "شرطہ پر TDV İslâm Ansiklopedisi اندراج: اسلامی ریاستوں کا شہری تحفظ کا ادارہ اور اس کے سربراہ صاحب الشریطہ، عہد نبوی کے چوکیداروں سے لے کر اموی اور عباسی تنظیموں تک، اس کے عدالتی اور انتظامی اختیارات، اس کی عمارتیں اور عملہ، اور مردوں کے ہتھیاروں کی سرمایہ کاری۔"
  tr: "TDV İslami Ansiklopedisi'nde 'Polis' maddesi: İslam şehirlerindeki polis gücü ve şefi, peygamberlik döneminden Emevi ve Abbasi devlet örgütüne kadar bir polis memuru, yargı ve idari yetkileri, binaları ve personeli, polis şefinin üniformaları ve adamlarının silahları."
  id: "Entri tentang 'Polisi' dalam Ensiklopedia Islam TDV: Pasukan polisi di kota-kota Islam dan kepalanya, yang memiliki seorang polisi dari penjaga era Nabi hingga organisasi negara Umayyah dan Abbasiyah, kekuasaan yudisial dan administratifnya, bangunan dan personelnya, seragam kepala polisi, serta senjata anak buahnya."
