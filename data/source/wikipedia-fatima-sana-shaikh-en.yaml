  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives her birth at Hyderabad on 11 January 1992, her parents’ faiths, her career from Chachi 420 to Dangal and beyond, and reports that she identifies as an atheist, carrying her own words from The Quint interview."
