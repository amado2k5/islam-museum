summary:
  ar: "مقالة ويكيبيديا العربية عن أكبر الباكر؛ تذكر توليه رئاسة الخطوط الجوية القطرية التنفيذية سنة 1997 بعد عمله في الطيران المدني القطري، وإعادة إطلاقه الشركة، وشهادته في الاقتصاد والتجارة، ورئاسته مجلس إدارة الهيئة القطرية للسياحة منذ سنة 2000، ولا تذكر تاريخ مولده وحقل الديانة في صندوقها فارغ."
  en: "Arabic Wikipedia article on Akbar Al Baker; it gives his becoming Qatar Airways CEO in 1997 after working in Qatar's civil aviation authority, his relaunch of the airline, his degree in economics and commerce, and his chairmanship of the Qatar Tourism Authority board from 2000. It gives no birth date, and its infobox religion field is empty."
  es: "Artículo de Wikipedia en árabe sobre Akbar Al Baker; en él se menciona que se convirtió en director ejecutivo de Qatar Airways en 1997 tras trabajar en la autoridad de aviación civil de Qatar, el relanzamiento de la aerolínea, su licenciatura en economía y comercio, y su presidencia del consejo de la Autoridad de Turismo de Qatar desde el año 2000. No se indica la fecha de nacimiento y el campo de religión en la ficha informativa está vacío."
  fr: "L'article de Wikipédia en arabe sur Akbar Al Baker mentionne sa nomination à la tête de Qatar Airways en 1997 après avoir travaillé à l'autorité de l'aviation civile du Qatar, la relance de la compagnie aérienne, son diplôme en économie et commerce, et sa présidence du conseil d'administration de l'Autorité du tourisme du Qatar à partir de 2000. Il ne mentionne pas sa date de naissance et le champ « religion » de son infobox est vide."
  ur: "اکبر البکر پر عربی ویکیپیڈیا مضمون؛ یہ قطر کی سول ایوی ایشن اتھارٹی میں کام کرنے کے بعد 1997 میں قطر ایئر ویز کے سی ای او بننے، ایئر لائن کا دوبارہ آغاز، معاشیات اور تجارت میں ان کی ڈگری اور 2000 سے قطر ٹورازم اتھارٹی بورڈ کی چیئرمین شپ دیتا ہے۔"
