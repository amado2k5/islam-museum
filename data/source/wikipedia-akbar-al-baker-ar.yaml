  ar: "مقالة ويكيبيديا العربية عن أكبر الباكر؛ تذكر توليه رئاسة الخطوط الجوية القطرية التنفيذية سنة 1997 بعد عمله في الطيران المدني القطري، وإعادة إطلاقه الشركة، وشهادته في الاقتصاد والتجارة، ورئاسته مجلس إدارة الهيئة القطرية للسياحة منذ سنة 2000، ولا تذكر تاريخ مولده وحقل الديانة في صندوقها فارغ."
  en: "Arabic Wikipedia article on Akbar Al Baker; it gives his becoming Qatar Airways CEO in 1997 after working in Qatar's civil aviation authority, his relaunch of the airline, his degree in economics and commerce, and his chairmanship of the Qatar Tourism Authority board from 2000. It gives no birth date, and its infobox religion field is empty."
