reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The article records Zaidul Akbar (born 30 November 1977 in Jambi) as an Indonesian physician, Islamic preacher, consultant and practitioner of prophetic medicine; founder of Jurus Sehat Rasulullah (JSR); co-founder and three-term chairman (2012-2025) of the Indonesian Cupping Association (PBI); graduate of the Faculty of Medicine, Universitas Diponegoro, in 2003; author of the book Jurus Sehat Rasulullah. Its infobox names no school for him. Read via search extract on 15 November 2026."
