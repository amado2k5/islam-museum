  ar: "مقالة ويكيبيديا العربية عن صهيب ويب: سيرته منذ مولده واعتناقه الإسلام سنة 1992 حتى دراسته في الأزهر وعمله في بوسطن؛ ويذكر صندوق معلوماتها دينه بلفظ «الإسلام» العام دون مذهب."
