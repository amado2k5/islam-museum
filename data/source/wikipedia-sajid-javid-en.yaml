  ar: "مقالة ويكيبيديا الإنجليزية عن ساجد جاويد (وُلد في 5 كانون الأول 1969 في روتشديل)، المصرفي السابق وسياسي المحافظين الذي صار أول مسلم يتولى إحدى المناصب العليا في الدولة وزيرًا للداخلية. تقول المقالة بنصها إنه رغم تربيته الإسلامية لم يعد يمارس أي دين، لكنه ما زال يصف نفسه بأنه مسلم."
  en: "English Wikipedia article on Sajid Javid (born 5 December 1969 in Rochdale), the former banker and Conservative politician who became the first Muslim to hold one of the Great Offices of State, as Home Secretary. The article states in its own text that despite his Islamic upbringing he no longer practises any religion, yet still describes himself as a Muslim."
