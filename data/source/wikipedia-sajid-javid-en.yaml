reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Used for his birth on 5 December 1969 in Rochdale, his Punjabi Muslim family's origins in Toba Tek Singh District, his banking career, his election as MP for Bromsgrove in 2010, and his cabinet posts to 2022. For faith, the article states in its own text, citing Christian Today of 30 April 2018, that despite having an Islamic upbringing he no longer practises any religion, and, citing The Muslim News, that he still describes himself as a Muslim, claiming to be the first Muslim Home Secretary invited to an iftar in the House of Commons. Both statements are recorded in full in the person record; neither settles a faith value."
