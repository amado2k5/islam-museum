reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. A one-line stub: its text gives him only as Grand Mufti of Ghana, born on 23 April 1919 at Old Fadama, Ghana. Its unreferenced infobox gives religion Islam, creed Ahl al-Sunna wa-l-Jama'a and school Maliki — one unreferenced infobox family, naming a different claim (Sunni/Maliki) from the English infobox's Tijaniyyah. Its categories file him under births of 1341 AH, which corresponds to 1922–1923 and so points to the 1923 birth variant the English article also carries, not to the 1919 of its own text."
