  ar: "مقال «سبورتس إلستريتد» ⁦(10 أغسطس 2018)⁩ لبن غوليفر يصف دجانان موسى بأنه «مسلم متدين» وينقل كلامه عن الإهانات المعادية للمسلمين التي تعرض لها في كرواتيا."
  en: "Sports Illustrated feature of 10 August 2018 by Ben Golliver, published with the documentary Something in the Water: it calls Musa 'a devout Muslim', says he 'does not hide the fact that he is a devout Muslim', and quotes his own account of anti-Muslim insults from fans in Croatia — 'I was a boy at 16 years old and I heard the insults.' It names no school."
  es: "Artículo de Ben Golliver publicado en Sports Illustrated el 10 de agosto de 2018, junto con el documental Something in the Water: describe a Musa como \"un musulmán devoto\", afirma que \"no oculta el hecho de ser un musulmán devoto\" y cita su propio relato sobre los insultos antimusulmanes que recibió de aficionados en Croacia: \"Tenía 16 años y escuché los insultos\". No menciona ninguna escuela."
  fr: "Article de Ben Golliver paru dans Sports Illustrated le 10 août 2018, en parallèle du documentaire Something in the Water: il décrit Musa comme « un musulman fervent », affirme qu’il « ne cache pas sa foi musulmane » et cite son propre témoignage d’insultes antimusulmanes proférées par des supporters en Croatie: « J’avais 16 ans et j’ai entendu ces insultes. » L’article ne mentionne aucune école."
  ur: "بین گولیور کی 10 اگست 2018 کی اسپورٹس الیسٹریٹڈ فیچر، سمتھنگ ان دی واٹر نامی دستاویزی فلم کے ساتھ شائع ہوئی: اس میں موسیٰ کو 'ایک دیندار مسلمان' کہا گیا ہے، اس کا کہنا ہے کہ وہ 'اس حقیقت کو نہیں چھپاتا کہ وہ ایک دیندار مسلمان ہے'، اور کروشیا میں شائقین کی جانب سے مسلم مخالف توہین کے اپنے اکاؤنٹ کا حوالہ دیتے ہیں — 'میں 16 سال کا لڑکا تھا اور میں 16 سال کا تھا۔' اس میں کسی اسکول کا نام نہیں ہے۔"
