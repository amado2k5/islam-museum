summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فهد بن عبد العزيز آل سعود؛ تُستخدم لوقائع الكيان فقط. تذكر أنه ملك السعودية من 13 يونيو 1982 حتى وفاته في 1 أغسطس 2005، وأنه أكبر «السديريين السبعة»، ووزير المعارف 1953–1962 ووزير الداخلية 1962–1975 وولي العهد 1975–1982، وأنه اتخذ لقب خادم الحرمين الشريفين سنة 1986 وأصدر النظام الأساسي للحكم سنة 1992، وأن ولي العهد عبد الله صار الحاكم الفعلي بعد إصابته بجلطة سنة 1995. وتذكر ولادته في الرياض بالأعوام «1920 أو 1921 أو 1923» فقط، ولا تذكر له دينًا في متنها أو صندوق معلوماتها."
  en: "English Wikipedia article on Fahd bin Abdulaziz Al Saud; used for entity facts only. It gives him as King of Saudi Arabia from 13 June 1982 until his death on 1 August 2005, eldest of the Sudairi Seven, Minister of Education 1953–1962, Interior Minister 1962–1975 and Crown Prince 1975–1982, the king who adopted the title Custodian of the Two Holy Mosques in 1986 and introduced the Basic Law in 1992, and records that after his 1995 stroke Crown Prince Abdullah was de facto ruler. It gives his birth at Riyadh only as '1920, 1921 or 1923' and names no religion for him in text or infobox."
