summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فهد بن عبد العزيز آل سعود؛ تُستخدم لوقائع الكيان فقط. تذكر أنه ملك السعودية من 13 يونيو 1982 حتى وفاته في 1 أغسطس 2005، وأنه أكبر «السديريين السبعة»، ووزير المعارف 1953–1962 ووزير الداخلية 1962–1975 وولي العهد 1975–1982، وأنه اتخذ لقب خادم الحرمين الشريفين سنة 1986 وأصدر النظام الأساسي للحكم سنة 1992، وأن ولي العهد عبد الله صار الحاكم الفعلي بعد إصابته بجلطة سنة 1995. وتذكر ولادته في الرياض بالأعوام «1920 أو 1921 أو 1923» فقط، ولا تذكر له دينًا في متنها أو صندوق معلوماتها."
  en: "English Wikipedia article on Fahd bin Abdulaziz Al Saud; used for entity facts only. It gives him as King of Saudi Arabia from 13 June 1982 until his death on 1 August 2005, eldest of the Sudairi Seven, Minister of Education 1953–1962, Interior Minister 1962–1975 and Crown Prince 1975–1982, the king who adopted the title Custodian of the Two Holy Mosques in 1986 and introduced the Basic Law in 1992, and records that after his 1995 stroke Crown Prince Abdullah was de facto ruler. It gives his birth at Riyadh only as '1920, 1921 or 1923' and names no religion for him in text or infobox."
  es: "Artículo de la Wikipedia en inglés sobre Fahd bin Abdulaziz Al Saud; utilizado únicamente para datos sobre la entidad. Lo presenta como Rey de Arabia Saudita desde el 13 de junio de 1982 hasta su muerte el 1 de agosto de 2005, el mayor de los Siete Sudairi, Ministro de Educación de 1953 a 1962, Ministro del Interior de 1962 a 1975 y Príncipe Heredero de 1975 a 1982, el rey que adoptó el título de Custodio de las Dos Mezquitas Sagradas en 1986 e introdujo la Ley Fundamental en 1992, y registra que después de su derrame cerebral en 1995, el Príncipe Heredero Abdullah fue gobernante de facto. Indica que nació en Riad solo como \"1920, 1921 o 1923\" y no menciona su religión en el texto ni en el recuadro informativo."
  fr: "L'article de Wikipédia en anglais consacré à Fahd ben Abdelaziz Al Saoud, utilisé uniquement pour les informations le concernant, le présente comme roi d'Arabie saoudite du 13 juin 1982 à sa mort le 1er août 2005. Il est l'aîné des Sept Sudairi, ministre de l'Éducation de 1953 à 1962, ministre de l'Intérieur de 1962 à 1975 et prince héritier de 1975 à 1982. Ce roi a adopté le titre de Gardien des Deux Saintes Mosquées en 1986 et a promulgué la Loi fondamentale en 1992. L'article indique également qu'après son accident vasculaire cérébral en 1995, le prince héritier Abdallah a exercé le pouvoir de facto. Sa naissance à Riyad est mentionnée comme étant entre 1920 et 1923, sans que sa religion ne soit précisée dans le texte ni dans l'infobox."
  ur: "فہد بن عبدالعزیز آل سعود پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انہیں 13 جون 1982 سے لے کر یکم اگست 2005 کو اپنی موت تک سعودی عرب کا بادشاہ دیتا ہے، سدیری سات میں سب سے بڑے، وزیر تعلیم 1953–1962، وزیر داخلہ 1962–1975 اور ولی عہد شہزادہ 1975–1982، بادشاہ جس نے 1975–1982 میں دو محافظوں کا لقب اختیار کیا 1992 میں بنیادی قانون، اور یہ ریکارڈ کرتا ہے کہ 1995 کے اسٹروک کے بعد ولی عہد شہزادہ عبداللہ ڈی فیکٹو حکمران تھے۔ اس کی پیدائش ریاض میں صرف '1920، 1921 یا 1923' کے طور پر ہوئی ہے اور متن یا معلوماتی خانے میں اس کے لیے کسی مذہب کا نام نہیں ہے۔"
