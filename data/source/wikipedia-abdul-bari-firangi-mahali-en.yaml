  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الباري الفرنجي محلي (1878–1926)؛ تُستخدم لوقائع الكيان فقط. تروي أنه عالم وكاتب مسلم هندي من فرنجي محل في لكهنؤ ألّف 111 كتابًا، ونشاطه في حركة الخلافة، وتأسيسه مدرسة نظامية وجمعية خدام الكعبة، وعضويته المؤسسة لدار المصنفين وللجامعة الملية الإسلامية."
  en: "English Wikipedia article on Abdul Bari Firangi Mahali (1878–1926); used for entity facts only. It presents him as an Indian Muslim scholar and writer of Firangi Mahal in Lucknow who authored 111 books, recounts his Khilafat-movement activity, his founding of the Madarsa-i-Nizamia and the Anjuman-i-Khuddam-i-Kabba, and his founder membership of Darul Musannefin Shibli Academy and Jamia Millia Islamia."
