summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الباري الفرنجي محلي (1878–1926)؛ تُستخدم لوقائع الكيان فقط. تروي أنه عالم وكاتب مسلم هندي من فرنجي محل في لكهنؤ ألّف 111 كتابًا، ونشاطه في حركة الخلافة، وتأسيسه مدرسة نظامية وجمعية خدام الكعبة، وعضويته المؤسسة لدار المصنفين وللجامعة الملية الإسلامية."
  en: "English Wikipedia article on Abdul Bari Firangi Mahali (1878–1926); used for entity facts only. It presents him as an Indian Muslim scholar and writer of Firangi Mahal in Lucknow who authored 111 books, recounts his Khilafat-movement activity, his founding of the Madarsa-i-Nizamia and the Anjuman-i-Khuddam-i-Kabba, and his founder membership of Darul Musannefin Shibli Academy and Jamia Millia Islamia."
  es: "Artículo de Wikipedia en inglés sobre Abdul Bari Firangi Mahali (1878-1926); Se utiliza únicamente para hechos de entidades. Lo presenta como un erudito musulmán indio y autor de Firangi Mahal en Lucknow, autor de 111 libros, relata su actividad en el movimiento Khilafat, su fundación de Madarsa-i-Nizamia y Anjuman-i-Khuddam-i-Kabba."
  fr: "Article Wikipédia en anglais sur Abdul Bari Firangi Mahali (1878-1926); utilisé uniquement pour les faits d’entité. Il le présente comme un érudit musulman indien et auteur de Firangi Mahal à Lucknow, auteur de 111 livres, raconte son activité dans le mouvement Khilafat, sa fondation du Madarsa-i-Nizamia et de l'Anjuman-i-Khuddam-i-Kabba."
  ur: "انگریزی ویکیپیڈیا مضمون عبدالباری فرنگی محلی (1878–1926) پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں انہیں ایک ہندوستانی مسلمان اسکالر اور لکھنؤ میں فرنگی محل کے مصنف کے طور پر پیش کیا گیا ہے جس نے 111 کتابیں تصنیف کیں، ان کی تحریک خلافت کی سرگرمی، مدرسہ نظامیہ اور انجمن خدام کبہ کے قیام کا ذکر کیا ہے۔"
