summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حافظ علي خان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه عازف سرود وُلد سنة 1888 في غواليور من نسل بانغاش عازفي السرود، وأنه نال بادما بهوشان سنة 1960 وتوفي في ديسمبر 1972، مع اختلاف المقالة نفسها في مكان الوفاة بين ممبئی ⁦(صندوق المعلومات)⁩ ونيودلهي ⁦(النص)⁩. لا تذكر المقالة شيئا عن دينه."
  en: "English Wikipedia article on Hafiz Ali Khan; used for entity facts only. It gives the sarod player born in 1888 at Gwalior, of the Bangash line of sarod players, Padma Bhushan in 1960, and died in December 1972 — the article itself splits on the place, Mumbai in its infobox against New Delhi in its text. It makes no statement about his religion."
  es: "Artículo de la Wikipedia en inglés sobre Hafiz Ali Khan; utilizado únicamente para datos sobre la persona. Describe al intérprete de sarod nacido en 1888 en Gwalior, perteneciente a la familia Bangash de intérpretes de sarod, galardonado con el Padma Bhushan en 1960 y fallecido en diciembre de 1972. El artículo presenta discrepancias en cuanto al lugar de nacimiento: Bombay en el recuadro informativo y Nueva Delhi en el texto. No menciona su religión."
  fr: "L'article de Wikipédia en anglais consacré à Hafiz Ali Khan, utilisé uniquement pour les informations le concernant, indique que ce joueur de sarod est né en 1888 à Gwalior, appartenant à la lignée Bangash, récipiendaire du Padma Bhushan en 1960 et décédé en décembre 1972. L'article lui-même présente une divergence quant au lieu: Mumbai dans l'encadré et New Delhi dans le texte. Il ne mentionne pas sa religion."
  ur: "حافظ علی خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1888 میں گوالیار میں پیدا ہونے والے سرود بجانے والے، سرود بجانے والوں کی بنگش لائن کے، 1960 میں پدم بھوشن، اور دسمبر 1972 میں انتقال کر گئے تھے - مضمون خود اس جگہ پر تقسیم ہوتا ہے، ممبئی اپنے متن میں نئی دہلی کے خلاف اپنے معلوماتی باکس میں۔ اس کے مذہب کے بارے میں کوئی بیان نہیں ہے۔"
  tr: "Hafiz Ali Khan hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1888'de Gwalior'da doğmuş bir sarod çalan olduğu, şarkı yazarı Bangash'ın soyundan geldiği ve 1960'ta Padma Bhushan aldığı ve Aralık 1972'de öldüğü belirtilmektedir; ancak aynı makale ölüm yeri açısından Mumbai (bilgi kutusu) ile Yeni Delhi (metin) arasında farklılık göstermektedir. Makalede dini hakkında hiçbir şey belirtilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Hafiz Ali Khan; digunakan hanya untuk fakta entitas. Disebutkan bahwa ia adalah pemain sarod yang lahir pada tahun 1888 di Gwalior, keturunan Bangash, seorang penulis lagu, dan menerima Padma Bhushan pada tahun 1960 serta meninggal pada Desember 1972, meskipun artikel yang sama berbeda dalam hal tempat kematian antara Mumbai (infobox) dan New Delhi (teks). Artikel tersebut tidak menyebutkan apa pun tentang agamanya."
