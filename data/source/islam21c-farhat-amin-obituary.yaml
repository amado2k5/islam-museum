summary:
  ar: "نعي موقع إسلام 21 لفرحات أمين، مقدمة بودكاست «سمارت مسلمة» ومؤلفة كتب في الحجاب والزواج، نشر في 30 أبريل 2025؛ يورد إعلان زوجها محمد جلال وفاتها بعد أكثر من ثلاث سنوات مع السرطان، وخلفيتها معلمة لغة إنجليزية في مدرسة ثانوية تخرجت في معهد التعليم بجامعة لندن سنة 2009 وتركت التعليم سنة 2015، وقائمة كتبها ومكان جنازتها في مسجد عمر بوالثامستو."
  en: "Islam21c's obituary of Farhat Amin, host of the Smart Muslima podcast and author of books on hijab and marriage, published 30 April 2025. It carries her husband Muhammad Jalal's announcement of her death after more than three years living with cancer, her background as a secondary-school English teacher who graduated from the UCL Institute of Education in 2009 and left teaching in 2015, a list of her books, and her funeral at Masjid e Umer in Walthamstow, London."
title: "Condolences upon the passing of Farhat Amin"
