summary:
  ar: "نعي موقع إسلام 21 لفرحات أمين، مقدمة بودكاست «سمارت مسلمة» ومؤلفة كتب في الحجاب والزواج، نشر في 30 أبريل 2025؛ يورد إعلان زوجها محمد جلال وفاتها بعد أكثر من ثلاث سنوات مع السرطان، وخلفيتها معلمة لغة إنجليزية في مدرسة ثانوية تخرجت في معهد التعليم بجامعة لندن سنة 2009 وتركت التعليم سنة 2015، وقائمة كتبها ومكان جنازتها في مسجد عمر بوالثامستو."
  en: "Islam21c's obituary of Farhat Amin, host of the Smart Muslima podcast and author of books on hijab and marriage, published 30 April 2025. It carries her husband Muhammad Jalal's announcement of her death after more than three years living with cancer, her background as a secondary-school English teacher who graduated from the UCL Institute of Education in 2009 and left teaching in 2015, a list of her books, and her funeral at Masjid e Umer in Walthamstow, London."
  es: "El obituario de Farhat Amin, presentadora del podcast Smart Muslima y autora de libros sobre el hiyab y el matrimonio, publicado por Islam21c el 30 de abril de 2025, incluye el anuncio de su esposo, Muhammad Jalal, sobre su fallecimiento tras más de tres años luchando contra el cáncer, su trayectoria como profesora de inglés de secundaria, graduada del Instituto de Educación de la UCL en 2009 y que dejó la docencia en 2015, una lista de sus libros y su funeral en la mezquita Masjid e Umer en Walthamstow, Londres."
  fr: "L'avis de décès de Farhat Amin, animatrice du podcast Smart Muslima et auteure d'ouvrages sur le hijab et le mariage, publié par Islam21c le 30 avril 2025, relate l'annonce de son décès par son époux, Muhammad Jalal, après plus de trois ans de lutte contre le cancer, son parcours d'enseignante d'anglais au secondaire (diplômée de l'Institut d'éducation de l'UCL en 2009 et ayant quitté l'enseignement en 2015), la liste de ses livres et ses obsèques à la mosquée Masjid e Umer de Walthamstow, à Londres."
  ur: "اسلام 21c کا سمارٹ مسلمہ پوڈ کاسٹ کی میزبان اور حجاب اور شادی سے متعلق کتابوں کی مصنفہ فرحت امین کا 30 اپریل 2025 کو شائع ہوا۔ اس میں ان کے شوہر محمد جلال کی کینسر کے ساتھ تین سال سے زیادہ زندگی گزارنے کے بعد ان کی موت کا اعلان ہے، اس کا پس منظر ایک سیکنڈری اسکول انگلش ٹیچر کے طور پر ہے جس نے یو سی ایل 2005 سے گریجویشن کیا اور تعلیمی ادارے سے گریجویشن کیا۔ اس کی کتابوں کی فہرست، اور والتھمسٹو، لندن میں مسجد عمر میں اس کا جنازہ۔"
title: "Condolences upon the passing of Farhat Amin"
