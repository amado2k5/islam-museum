  en: "Hafsa Kanjwal, Colonizing Kashmir (2023)"
summary:
  ar: "كتاب حفصة كنجوال «استعمار كشمير: بناء الدولة تحت الاحتلال الهندي» ⁦(مطبعة جامعة ستانفورد، 2023)⁩: تذكر فيه ⁦(ص 205)⁩ أن آزاد كان الأثور بين شاعرَي عصره، وأنه عرّف بنفسه ماركسياً وكانت قصائده تعالج مباشرة موضوعات التغيير الاجتماعي والعدالة."
  en: "Hafsa Kanjwal's Stanford University Press monograph on Bakshi-era state-building (2023): at p. 205 she writes that Azad was the more revolutionary of the two Dogra-era poets, that he identified as a Marxist, and that his poetry directly addressed themes of social change and justice."
  es: "En la monografía de Hafsa Kanjwal, publicada por Stanford University Press (2023), sobre la construcción del Estado en la era Bakshi, en la página 205 escribe que Azad fue el más revolucionario de los dos poetas de la era Dogra, que se identificaba como marxista y que su poesía abordaba directamente temas de cambio social y justicia."
  fr: "Dans sa monographie de Stanford University Press sur la construction de l'État à l'époque de Bakshi (2023): à la page 205, Hafsa Kanjwal écrit qu'Azad était le plus révolutionnaire des deux poètes de l'époque Dogra, qu'il s'identifiait comme marxiste et que sa poésie abordait directement les thèmes du changement social et de la justice."
  ur: "حفصہ کنجوال کا اسٹینفورڈ یونیورسٹی پریس کا مونوگراف آن بخشی دور کی ریاستی عمارت (2023): صفحہ۔ 205 وہ لکھتی ہیں کہ آزاد ڈوگرہ دور کے دو شاعروں میں زیادہ انقلابی تھے، جن کی شناخت انہوں نے مارکسسٹ کے طور پر کی تھی، اور ان کی شاعری میں سماجی تبدیلی اور انصاف کے موضوعات پر براہ راست توجہ دی گئی تھی۔"
  tr: "Hafsa Kanjwal'ın \"Keşmir'in Kolonizasyonu: Hindistan İşgali Altında Devlet İnşası\" (Stanford University Press, 2023) adlı kitabında (s. 205) Azad'ın döneminin en etkili şairi olduğunu, kendini Marksist olarak tanımladığını ve şiirlerinin doğrudan sosyal değişim ve adalet konularını ele aldığını belirtir."
  id: "Buku Hafsa Kanjwal \"Colonization of Kashmir: State-Building under Indian Occupation\" (Stanford University Press, 2023): Dalam buku itu (hlm. 205) ia menyebutkan bahwa Azad adalah penyair paling berpengaruh pada zamannya, bahwa ia mengidentifikasi dirinya sebagai Marxis, dan puisinya secara langsung membahas topik perubahan sosial dan keadilan."
