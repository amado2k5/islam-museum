summary:
  ar: "كتاب حفصة كنجوال «استعمار كشمير: بناء الدولة تحت الاحتلال الهندي» ⁦(مطبعة جامعة ستانفورد، 2023)⁩: تذكر فيه ⁦(ص 205)⁩ أن آزاد كان الأثور بين شاعرَي عصره، وأنه عرّف بنفسه ماركسياً وكانت قصائده تعالج مباشرة موضوعات التغيير الاجتماعي والعدالة."
  en: "Hafsa Kanjwal's Stanford University Press monograph on Bakshi-era state-building (2023): at p. 205 she writes that Azad was the more revolutionary of the two Dogra-era poets, that he identified as a Marxist, and that his poetry directly addressed themes of social change and justice."
  es: "En la monografía de Hafsa Kanjwal, publicada por Stanford University Press (2023), sobre la construcción del Estado en la era Bakshi, en la página 205 escribe que Azad fue el más revolucionario de los dos poetas de la era Dogra, que se identificaba como marxista y que su poesía abordaba directamente temas de cambio social y justicia."
