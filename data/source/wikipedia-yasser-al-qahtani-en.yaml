reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Al-Qahtani as born 10 October 1982 in Khobar, his full name as Yasser Saeed Mosleh Abdulrahman Al-Qahtani; Al-Qadsiah 2000–2005, Al-Hilal 2005–2018 with a loan at Al Ain in 2011–2012; 108 caps and 42 goals as Saudi Arabia's captain; Asian Footballer of the Year 2007 after the 2007 Asian Cup final, followed by a Manchester City trial. It makes no statement of his religion; its only 'Islamic' references are the 2005 Islamic Solidarity Games and the medalist categories for those Games, which are competition names. Note its birthplace (Khobar) conflicts with the Arabic article's infobox (Riyadh); Wikidata agrees with Khobar."
