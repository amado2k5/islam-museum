  ar: "مقالة ويكيبيديا الإنجليزية عن ياسر القحطاني؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 10 أكتوبر 1982 في الخبر، وانتقاله من القادسية إلى الهلال سنة 2005، و108 مباريات دولية و42 هدفًا، وجائزة أفضل لاعب في آسيا 2007."
  en: "English Wikipedia article on Yasser Al-Qahtani; used for entity facts only. It gives his birth on 10 October 1982 in Khobar, his move from Al-Qadsiah to Al-Hilal in 2005, 108 caps and 42 goals for Saudi Arabia, and his 2007 Asian Footballer of the Year award."
  es: "Artículo de la Wikipedia en inglés sobre Yasser Al-Qahtani; utilizado únicamente para datos biográficos. En él se indica que nació el 10 de octubre de 1982 en Khobar, su traspaso del Al-Qadsiah al Al-Hilal en 2005, sus 108 partidos internacionales y 42 goles con la selección de Arabia Saudí, y su premio al Futbolista Asiático del Año en 2007."
  fr: "Article Wikipédia en anglais sur Yasser Al-Qahtani; utilisé uniquement pour les informations relatives à l'entité. On y apprend sa naissance le 10 octobre 1982 à Khobar, son transfert d'Al-Qadsiah à Al-Hilal en 2005, ses 108 sélections et 42 buts en équipe nationale d'Arabie saoudite, ainsi que son titre de meilleur joueur asiatique de l'année 2007."
  ur: "یاسر القحطانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 10 اکتوبر 1982 کو خبر میں ان کی پیدائش، 2005 میں القادسیہ سے الہلال میں اس کی منتقلی، سعودی عرب کے لیے 108 کیپس اور 42 گول، اور اسے 2007 کے ایشین فٹ بالر آف دی ایئر کا ایوارڈ ملا۔"
  tr: "Yaser Al-Qahtani hakkında İngilizce Vikipedi makalesi; sadece varlığın gerçekleri için kullanılmıştır. 10 Ekim 1982'de Al-Khobar'da doğduğunu, 2005'te Al-Qadsiah'tan Al-Hilal'a transferini, 108 uluslararası maç, 42 gol ve 2007'de Asya'nın En İyi Oyuncusu ödülünü vermektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Yasser Al-Qahtani; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 10 Oktober 1982 di Al-Khobar, kepindahannya dari Al-Qadsiah ke Al-Hilal pada 2005, 108 pertandingan internasional, 42 gol, dan penghargaan Pemain Terbaik di Asia 2007."
