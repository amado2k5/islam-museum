  ar: "مقالة ويكيبيديا الإنجليزية عن شاه جهان بيكم، بيغوم بوبال (1838–1901)؛ تُستخدم لوقائع الكيان فقط. تروي عهديها: الأول طفلةً ووالدتها سكندر بيكم وصية، والثاني من 1868 حتى وفاتها، وزواجيها من باقي محمد خان ثم صديق حسن خان، وبناءها تاج المساجد ومسجد ووكينغ."
  en: "English Wikipedia article on Shah Jahan Begum, Begum of Bhopal (1838–1901); used for entity facts only. It recounts her two reigns — the first as a child with her mother Sikandar Begum as regent, the second from 1868 until her death — her marriages to Baqi Muhammad Khan and then Siddiq Hasan Khan, and her building of the Taj-ul-Masajid and the Woking mosque."
