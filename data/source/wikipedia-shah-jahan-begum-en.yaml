summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شاه جهان بيكم، بيغوم بوبال (1838–1901)؛ تُستخدم لوقائع الكيان فقط. تروي عهديها: الأول طفلةً ووالدتها سكندر بيكم وصية، والثاني من 1868 حتى وفاتها، وزواجيها من باقي محمد خان ثم صديق حسن خان، وبناءها تاج المساجد ومسجد ووكينغ."
  en: "English Wikipedia article on Shah Jahan Begum, Begum of Bhopal (1838–1901); used for entity facts only. It recounts her two reigns — the first as a child with her mother Sikandar Begum as regent, the second from 1868 until her death — her marriages to Baqi Muhammad Khan and then Siddiq Hasan Khan, and her building of the Taj-ul-Masajid and the Woking mosque."
  es: "Artículo de la Wikipedia en inglés sobre Shah Jahan Begum, Begum de Bhopal (1838-1901); utilizado únicamente para datos sobre la persona. Relata sus dos reinados: el primero durante su infancia, con su madre Sikandar Begum como regente, y el segundo desde 1868 hasta su muerte; sus matrimonios con Baqi Muhammad Khan y luego con Siddiq Hasan Khan; y la construcción del Taj-ul-Masajid y la mezquita de Woking."
  fr: "L'article de Wikipédia en anglais sur Shah Jahan Begum, Bégum de Bhopal (1838-1901), est utilisé uniquement à titre informatif. Il relate ses deux règnes: le premier, lorsqu'elle était enfant, avec sa mère Sikandar Begum comme régente; le second, de 1868 jusqu'à sa mort. On y trouve également des informations sur ses mariages avec Baqi Muhammad Khan puis Siddiq Hasan Khan, ainsi que sur la construction du Taj-ul-Masajid et de la mosquée de Woking."
