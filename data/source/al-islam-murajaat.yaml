summary:
  ar: "صفحة كتاب المراجعات على موقع al-islam.org كما اطُّلع عليها في 17 نوفمبر 2026؛ يعرض الموقع نص الكتاب الذي يقدّمه ناشروه باعتباره مراسلات بين عبد الحسين شرف الدين الموسوي وسليم البشري."
  en: "The al-Muraja'at page at al-Islam.org as consulted on 17 November 2026; the site carries the text that its publishers present as correspondence between Abd al-Husayn Sharaf al-Din al-Musawi and Salim al-Bishri."
  es: "La página de al-Muraja'at en al-Islam.org, consultada el 17 de noviembre de 2026, contiene el texto que sus editores presentan como correspondencia entre Abd al-Husayn Sharaf al-Din al-Musawi y Salim al-Bishri."
  fr: "La page al-Muraja'at sur al-Islam.org telle que consultée le 17 novembre 2026; le site contient le texte que ses éditeurs présentent comme une correspondance entre Abd al-Husayn Sharaf al-Din al-Musawi et Salim al-Bishri."
  ur: "17 نومبر 2026 کو مشورے کے طور پر الاسلام ڈاٹ آرگ پر المراجعات صفحہ؛ سائٹ میں وہ متن موجود ہے جسے اس کے ناشرین عبد الحسین شرف الدین الموسوی اور سلیم البشری کے درمیان خط و کتابت کے طور پر پیش کرتے ہیں۔"
  tr: "al-islam.org web sitesindeki İnceleme Kitabı sayfası, 17 Kasım 2026 tarihinde erişilmiştir; site, yayınevleri tarafından sunulan kitabın metnini, Abdulhüseyin Şerafeddin El-Musavi ile Salim El-Bişri arasında yazışma olarak göstermektedir."
  id: "Halaman Buku Ulasan di situs web al-islam.org yang diakses pada 17 November 2026; situs tersebut menampilkan teks buku yang disajikan oleh penerbitnya sebagai korespondensi antara Abdulhussein Sharafeddin Al-Mousawi dan Salim Al-Bishri."
