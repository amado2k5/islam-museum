summary:
  ar: "مقالة ويكيبيديا العربية عن الشيخ عبد الله بن عيسى آل خليفة (1883–1966)؛ تُستخدم لوقائع الكيان فقط. متنها يذكر مولده في المنامة بقلعة الديوان سنة 1883 وتربيته في كنف أبيه الحاكم عيسى بن علي، بينما يذكر مطلعها المحرق مكانا للولادة، وتؤكد مناصبه ووفاته في 23 أبريل 1966. لا حقل دين فيها."
  en: "Arabic Wikipedia article on Sheikh Abdullah bin Isa Al Khalifa (1883–1966); used for entity facts only. Its text gives his birth in Manama at the Diwan fort in 1883 and his upbringing in the house of his father the ruler Isa bin Ali, while its lead gives Al-Muharraq as the birthplace; it confirms his offices and his death on 23 April 1966. It has no religion field."
  es: "Artículo de Wikipedia en árabe sobre el jeque Abdullah bin Isa Al Khalifa (1883-1966); utilizado únicamente para datos sobre la persona. Su texto indica que nació en Manama, en el fuerte Diwan, en 1883, y que se crió en la casa de su padre, el gobernante Isa bin Ali. Su introducción señala Al-Muharraq como su lugar de nacimiento; confirma sus cargos y su fallecimiento el 23 de abril de 1966. No incluye información sobre religión."
  fr: "L'article de Wikipédia en arabe consacré au cheikh Abdullah bin Isa Al Khalifa (1883-1966) est utilisé uniquement à des fins d'information. Son texte indique sa naissance à Manama, au fort du Diwan, en 1883, et son enfance au sein de la famille de son père, le souverain Isa bin Ali. L'introduction mentionne Al-Muharraq comme lieu de naissance, confirme ses fonctions et son décès le 23 avril 1966. Aucun champ relatif à la religion n'est mentionné."
  ur: "شیخ عبداللہ بن عیسیٰ الخلیفہ (1883–1966) پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا متن 1883 میں قلعہ دیوان میں ان کی پیدائش مناما میں اور اس کی پرورش اپنے والد کے حکمراں عیسیٰ بن علی کے گھر میں ہوئی ہے، جبکہ اس کی قیادت المحراق کو جائے پیدائش کے طور پر بتاتی ہے۔ یہ ان کے دفاتر اور 23 اپریل 1966 کو ان کی موت کی تصدیق کرتا ہے۔ اس کا کوئی مذہب نہیں ہے۔"
  tr: "Şeyh Abdullah bin İsa Al Khalifa (1883–1966) hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Metinde, 1883'te Manama'da Diwan Kalesi'nde doğduğu ve babası hükümdar İsa bin Ali'nin bakımında yetiştirildiği belirtilirken, açılışında doğum yeri olarak Muharraq yer geçerek konumunu ve 23 Nisan 1966'daki ölümünü doğrular. Metinde bir din alanı yoktur."
  id: "Artikel Wikipedia berbahasa Arab tentang Sheikh Abdullah bin Isa Al Khalifa (1883–1966); hanya digunakan untuk fakta entitas tersebut. Teksnya menyebutkan kelahirannya di Manama di Benteng Diwan pada tahun 1883 dan masa kecilnya di bawah asuhan ayahnya, penguasa Isa bin Ali, sementara di awalnya mencatat Muharraq sebagai tempat kelahirannya, mengonfirmasi posisinya dan kematiannya pada 23 April 1966. Tidak ada bidang agama di dalamnya."
