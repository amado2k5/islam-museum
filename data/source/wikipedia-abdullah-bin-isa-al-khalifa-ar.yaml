  ar: "مقالة ويكيبيديا العربية عن الشيخ عبد الله بن عيسى آل خليفة (1883–1966)؛ تُستخدم لوقائع الكيان فقط. متنها يذكر مولده في المنامة بقلعة الديوان سنة 1883 وتربيته في كنف أبيه الحاكم عيسى بن علي، بينما يذكر مطلعها المحرق مكانا للولادة، وتؤكد مناصبه ووفاته في 23 أبريل 1966. لا حقل دين فيها."
  en: "Arabic Wikipedia article on Sheikh Abdullah bin Isa Al Khalifa (1883–1966); used for entity facts only. Its text gives his birth in Manama at the Diwan fort in 1883 and his upbringing in the house of his father the ruler Isa bin Ali, while its lead gives Al-Muharraq as the birthplace; it confirms his offices and his death on 23 April 1966. It has no religion field."
