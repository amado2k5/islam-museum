summary:
  ar: "مقال أكاديمي ⁦(كان التاريخية 16/61، أيلول 2023، ص 58–73)⁩ لأحمد علي نوح وکریمة أحمد عوض عن بيلتا طليطلة؛ قُرئ فقط عنوانه وبياناته البحثية وملخصه العربي الكامل — يمهد للحوضَين داخل تقليد هندسة النوافير الأندلسي ويصف مزامنة القمر والمزامنة الذاتية والتخريب الموثق، ويعدّهما لغزًا هندسيًا لم تحله التقنيات اللاحقة."
  en: "Academic article (Douria Kan al-Tarikhiyya 16/61, Sept 2023, pp. 58-73) by Abdullah Ali Nuh and Karima Ahmad Awad on Baylatan of Toledo; bibliographic record and full Arabic abstract read — the body unread. Places the basins in Andalusian fountain-engineering tradition and calls their lunar synchrony, self-correction and reported sabotage an engineering puzzle later technology failed to explain."
  ur: "اکادیمی مقالہ ⁦(دوریہ کان التاریخیہ 16/61، ستمبر 2023، ص 58–73)⁩ عبداللہ علی نوح اور کریمہ احمد عوض کے طلیطلہ کی بيلتا پر؛ صرف عنوانی اور کتابیاتی ریکارڈ اور مکمل عربی خلاصہ پڑھا گیا، متن نہیں۔"
  es: "Artículo académico (Douria Kan al-Tarikhiyya 16/61, septiembre de 2023, págs. 58-73) de Abdullah Ali Nuh y Karima Ahmad Awad sobre Baylatan de Toledo; se leyó el registro bibliográfico y el resumen completo en árabe; el texto no se leyó. Sitúa las pilas dentro de la tradición andalusí de la ingeniería de fuentes y considera que su sincronización lunar, su autocorrección y el sabotaje reportado constituyen un enigma de ingeniería que la tecnología posterior no logró explicar."
  fr: "Article académique (Douria Kan al-Tarikhiyya 16/61, sept. 2023, p. 58-73) d'Abdullah Ali Nuh et Karima Ahmad Awad sur les bassins Baylatan de Tolède; notice bibliographique et résumé complet en arabe consultés, corps du texte non lu. Les auteurs situent ces bassins dans la tradition andalouse des fontaines et qualifient leur synchronisation lunaire, leur autorégulation et les actes de sabotage rapportés d'énigme technique que les technologies ultérieures n'ont pas permis d'expliquer."
