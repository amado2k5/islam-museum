summary:
  ar: "مقالة ويكيبيديا الأردية عن فخرالدین عراقی؛ تصفه بأنه شاعر صوفي وعارف، وتروي مولده في كميجان نحو سنة 600 هـ — قراءة مخالفة للمقالة الإنجليزية؛ تُستخدم لوقائع الكيان فقط كشاهد على هذا الاختلاف."
  en: "Urdu Wikipedia article on Fakhr al-Din Iraqi; it describes him as a Sufi poet and gnostic and gives his birth at Komijan around 600 AH — a reading that differs from the English article; used for entity facts only, as a witness to that variant."
  es: "Artículo de Wikipedia en urdu sobre Fakhr al-Din Iraqi; lo describe como un poeta sufí y gnóstico y sitúa su nacimiento en Komijan alrededor del año 600 AH, una lectura que difiere del artículo en inglés; se utiliza únicamente para datos objetivos, como testimonio de esa variante."
  fr: "L'article de Wikipédia en ourdou sur Fakhr al-Din Iraqi le décrit comme un poète soufi et gnostique et indique sa naissance à Komijan vers 600 AH — une lecture qui diffère de l'article anglais; utilisé uniquement pour les faits concernant l'entité, comme témoin de cette variante."
  ur: "فخر الدین عراقی پر اردو ویکیپیڈیا مضمون؛ اس میں اسے ایک صوفی شاعر اور علم پرست کے طور پر بیان کیا گیا ہے اور اس کی پیدائش 600 ہجری کے لگ بھگ کومیجان میں ہوئی ہے - ایک پڑھنا جو انگریزی مضمون سے مختلف ہے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، اس قسم کے گواہ کے طور پر۔"
  tr: "Fakhr al-Din Iraqi hakkında Urduca Wikipedia makalesi; onu bir Sufi şair ve mistik olarak tanımlayan ve yaklaşık 600 Hicri yılında Kamijan'da doğduğunu anlatan — İngilizce makalenin aksine bir okuma; bu farkın kanıtı olarak yalnızca varlığın gerçekleri için kullanılmıştır."
  id: "Artikel Wikipedia Urdu tentang Fakhr al-Din Iraqi; menggambarkannya sebagai penyair Sufi dan mistikus, serta menceritakan kelahirannya di Kamijan sekitar tahun 600 H — sebuah pembacaan yang bertentangan dengan artikel bahasa Inggris; hanya digunakan untuk fakta entitas sebagai bukti perbedaan ini."
