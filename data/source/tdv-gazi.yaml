summary:
  ar: "مدخل «غازي» في موسوعة TDV الإسلامية: اللفظ في القرآن والحديث، الغازي متطوعاً في الرباطات الأموية، غزاة الأوج في الأناضول وأمراء الغزو، الغازي لقباً للسلاطين العثمانيين، واللقب في تركيا الحديثة."
  en: "The TDV İslâm Ansiklopedisi entry on the ghazi: the word in Qur'an and hadith, the volunteer ghazis of the Umayyad ribats, the frontier ghazis and conquering emirs of Anatolia, the title for Ottoman sultans, and the title's survival in modern Turkey."
  ur: "TDV اسلامی انسائیکلوپیڈیا کا مادہ «غازی»: قرآن و حدیث میں لفظ، اموی رباطوں کے رضاکار غازی، اناطولیہ کے سرحدی غازی اور فاتح امیر، عثمانی سلاطین کے لیے لقب، اور جدید ترکی میں لقب کا استمرار۔"
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el ghazi: la palabra en el Corán y los hadices, los ghazis voluntarios de los ribats omeyas, los ghazis fronterizos y los emires conquistadores de Anatolia, el título de los sultanes otomanos y la supervivencia del título en la Turquía moderna."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le ghazi: le mot dans le Coran et les hadiths, les ghazis volontaires des ribats omeyyades, les ghazis frontaliers et les émirs conquérants d'Anatolie, le titre des sultans ottomans et la survie du titre dans la Turquie moderne."
  tr: "TDV İslami Ansiklopedisi'nde 'Gazi' maddesi: Kur'an ve Hadislerdeki ifadeler, Gazi'nin Emevi ribatlarında gönüllü olması, Anadolu'daki zirve istilacılar ve fetih prensleri, Gazi Osmanlı sultanları için bir unvan olarak ve modern Türkiye'deki unvan."
  id: "Entri tentang 'Ghazi' dalam Ensiklopedia Islam TDV: Kata-kata dalam Al-Qur'an dan Hadis, Ghazi yang menjadi sukarelawan dalam ribat Umayyah, penjajah puncak di Anatolia dan pangeran penaklukan, Ghazi sebagai gelar untuk sultan Ottoman, dan gelar di Turki modern."
