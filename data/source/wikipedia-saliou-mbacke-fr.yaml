reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. Its text gives him as born at Diourbel on 22 September 1915, son of Cheikh Ahmadou Bamba, fifth khalife of the Mourides from 1990 to 2007, and as dying at Touba on 28 December 2007; its own infobox gives 27 December 2007, an internal slip not followed, since its text (citing BBC News), the English article and Wikidata all give 28 December. It credits him with daaras across Senegal, a 45,000-hectare agricultural project at Khelcom, renovation of the Grand Mosque of Touba, continuation of the al-Azhar Islamic university begun by his elder brother Abdoul Ahad Mbacké, and a hospital at Touba, and names him the last son of Ahmadou Bamba. The text describes him by office and descent; it makes no statement of his personal initiation or affiliation."
