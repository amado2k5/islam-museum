summary:
  ar: "مقالة ويكيبيديا الفرنسية عن سيرين ساليو مباكي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في ديوربل في 22 سبتمبر 1915 ووفاته في طوبى في 28 ديسمبر 2007، وخلافته الخامسة للمريدية، ومدارسه الدينية ومشروعه الزراعي الكبير في خلقوم وأعماله في طوبى."
  en: "French Wikipedia article on Serigne Saliou Mbacké; used for entity facts only. It gives his birth at Diourbel on 22 September 1915 and his death at Touba on 28 December 2007, his fifth caliphate of the Mourides, his religious schools, his great agricultural project at Khelcom and his works at Touba."
  es: "Artículo de la Wikipedia en francés sobre Serigne Saliou Mbacké; utilizado únicamente para datos biográficos. En él se menciona su nacimiento en Diourbel el 22 de septiembre de 1915 y su fallecimiento en Touba el 28 de diciembre de 2007, su quinto califato de los Mourides, sus escuelas religiosas, su gran proyecto agrícola en Khelcom y sus obras en Touba."
  fr: "Article de Wikipédia en français sur Serigne Saliou Mbacké; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance à Diourbel le 22 septembre 1915 et sa mort à Touba le 28 décembre 2007, son cinquième califat des Mourides, ses écoles religieuses, son grand projet agricole à Khelcom et ses travaux à Touba."
  ur: "Serigne Saliou Mbacké پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 22 ستمبر 1915 کو دیوربل میں ان کی پیدائش اور 28 دسمبر 2007 کو توبہ میں ان کی موت، موریڈس کی ان کی پانچویں خلافت، ان کے مذہبی مدارس، کھیلکوم میں ان کے عظیم زرعی منصوبے اور توبہ میں ان کے کاموں کی وجہ سے۔"
