  ar: "مقالة ويكيبيديا الفرنسية عن سيرين ساليو مباكي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في ديوربل في 22 سبتمبر 1915 ووفاته في طوبى في 28 ديسمبر 2007، وخلافته الخامسة للمريدية، ومدارسه الدينية ومشروعه الزراعي الكبير في خلقوم وأعماله في طوبى."
  en: "French Wikipedia article on Serigne Saliou Mbacké; used for entity facts only. It gives his birth at Diourbel on 22 September 1915 and his death at Touba on 28 December 2007, his fifth caliphate of the Mourides, his religious schools, his great agricultural project at Khelcom and his works at Touba."
