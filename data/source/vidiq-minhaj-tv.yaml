reliability_note: "Platform statistics aggregator, not a museum-verified fact: the figure of 146,000 subscribers (23,734,772 total views, 1,754 videos) was read from vidIQ on 5 November 2026 and is used only as a dated audience figure. The page also records that the channel was created on 18 February 2012 and that its channel country is set to Pakistan; its most-viewed video is Rahat Fateh Ali Khan's 'Pukaro Shah e Jilan ko Pukaro' (2023, about 684 thousand views), followed by a Surah Taha recitation from the 2025 International Milad Conference. vidIQ's estimated earnings are modelled and are not used."
