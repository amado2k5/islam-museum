reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth in 1631 at Sijilmasa, his father Moulay Sharif, his half-brother Sidi Mohammed’s death at the battle of Angad on 2 August 1664 — which it pairs with 9 Muharram 1075 — his succession to his brother, his conquests of Fez, Marrakesh and the Sous, his building works, and his death at Marrakesh on 9 April 1672 after a fall from his horse, succeeded by his half-brother Moulay Ismail. It counts his sultanate from 1666 where the French and Arabic articles count from 1667. It names no school for the man himself. Checked 1 November 2026."
