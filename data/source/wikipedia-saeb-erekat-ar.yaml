  ar: "مقالة ويكيبيديا العربية عن صائب عريقات (أبو علي)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أبو ديس في 28 أبريل 1955، ولقبه «كبير المفاوضين الفلسطينيين»، وأمانته سرَّ اللجنة التنفيذية لمنظمة التحرير الفلسطينية بين 2015 و2020، ووفاته في القدس في 10 نوفمبر 2020، وتشييع جثمانه في رام الله قبل دفنه في أريحا."
  en: "Arabic Wikipedia article on Saeb Erekat (Abu Ali); used for entity facts only. It gives his birth in Abu Dis on 28 April 1955, his standing as the Palestinians' chief negotiator, his secretary-generalship of the PLO Executive Committee between 2015 and 2020, his death in Jerusalem on 10 November 2020, and the funeral procession in Ramallah before his burial in Jericho."
