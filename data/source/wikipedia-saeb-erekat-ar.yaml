summary:
  ar: "مقالة ويكيبيديا العربية عن صائب عريقات ⁦(أبو علي)⁩؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أبو ديس في 28 أبريل 1955، ولقبه «كبير المفاوضين الفلسطينيين»، وأمانته سرَّ اللجنة التنفيذية لمنظمة التحرير الفلسطينية بين 2015 و2020، ووفاته في القدس في 10 نوفمبر 2020، وتشييع جثمانه في رام الله قبل دفنه في أريحا."
  en: "Arabic Wikipedia article on Saeb Erekat (Abu Ali); used for entity facts only. It gives his birth in Abu Dis on 28 April 1955, his standing as the Palestinians' chief negotiator, his secretary-generalship of the PLO Executive Committee between 2015 and 2020, his death in Jerusalem on 10 November 2020, and the funeral procession in Ramallah before his burial in Jericho."
  es: "Artículo en árabe de la Wikipedia sobre Saeb Erekat (Abu Ali); utilizado únicamente para datos sobre la persona. En él se indica su nacimiento en Abu Dis el 28 de abril de 1955, su cargo como principal negociador palestino, su secretaría general del Comité Ejecutivo de la OLP entre 2015 y 2020, su fallecimiento en Jerusalén el 10 de noviembre de 2020 y la procesión fúnebre en Ramallah antes de su entierro en Jericó."
  fr: "Article de Wikipédia en arabe sur Saeb Erekat (Abou Ali); utilisé uniquement pour les informations sur l’entité. Il indique sa naissance à Abou Dis le 28 avril 1955, son rôle de négociateur en chef palestinien, son poste de secrétaire général du Comité exécutif de l’OLP entre 2015 et 2020, son décès à Jérusalem le 10 novembre 2020 et le déroulement de ses funérailles à Ramallah avant son inhumation à Jéricho."
  ur: "صائب ارکات ⁦(ابو علی)⁩ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 28 اپریل 1955 کو ابو دیس میں ان کی پیدائش، فلسطینیوں کے چیف مذاکرات کار کے طور پر ان کا کھڑا ہونا، 2015 اور 2020 کے درمیان پی ایل او کی ایگزیکٹو کمیٹی کا سیکرٹری جنرل، 10 نومبر 2020 کو یروشلم میں ان کی موت، اور جیچو میں تدفین سے قبل رام اللہ میں جنازے کا جلوس۔"
  tr: "Saeb Erekat (Abu Ali) hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 28 Nisan 1955'te Abu Dis'teki doğumunu, 'Baş Filistin Müzakerecisi' unvanını, 2015-2020 yılları arasında Filistin Kurtuluş Örgütü Yürütme Komitesi sekreterliğini, 10 Kasım 2020'de Kudüs'te vefatını ve Ramallah'ta cenazesini, ardından Eriha'da defnedilmesini anlatır."
  id: "Artikel Wikipedia berbahasa Arab tentang Saeb Erekat (Abu Ali); digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Abu Dis pada 28 April 1955, gelarnya sebagai 'Negosiator Palestina Utama,' sekretariatnya di Komite Eksekutif Organisasi Pembebasan Palestina antara tahun 2015 dan 2020, kematiannya di Yerusalem pada 10 November 2020, dan pemakamannya di Ramallah sebelum dimakamkan di Yerikho."
