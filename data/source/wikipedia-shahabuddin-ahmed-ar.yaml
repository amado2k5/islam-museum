summary:
  ar: "مقالة ويكيبيديا العربية عن شهاب الدين أحمد ⁦(موسومة «قاضي» للتمييز)⁩؛ تُستخدم لوقائع الكيان فقط. تتفق مع المقالة الإنجليزية في مولده في 1 فبراير 1930 ووفاته في 19 مارس 2022، ويعطي صندوق معلوماتها ديانتَه «الإسلام» بصورة عامة دون مذهب."
  en: "Arabic Wikipedia article on Shahabuddin Ahmed (titled with the disambiguator 'judge'); used for entity facts only. It agrees with the English article on his birth on 1 February 1930 and his death on 19 March 2022, and its infobox gives his religion as Islam, generically, naming no school."
  es: "Artículo de Wikipedia en árabe sobre Shahabuddin Ahmed (titulado con el desambiguador «juez»); utilizado únicamente para datos sobre la entidad. Coincide con el artículo en inglés sobre su nacimiento el 1 de febrero de 1930 y su fallecimiento el 19 de marzo de 2022, y su ficha informativa indica que su religión era el islam, de forma genérica, sin mencionar ninguna escuela."
  fr: "L'article de Wikipédia en arabe consacré à Shahabuddin Ahmed (intitulé avec le terme d'ambiguïté « juge ») est utilisé uniquement pour les informations le concernant. Il concorde avec l'article en anglais quant à sa naissance le 1er février 1930 et son décès le 19 mars 2022, et son infobox indique qu'il était musulman, sans préciser d'école."
  ur: "شہاب الدین احمد پر عربی ویکیپیڈیا کا مضمون ⁦(عنوان ابہام کرنے والے 'جج' کے ساتھ)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1 فروری 1930 کو ان کی پیدائش اور 19 مارچ 2022 کو ان کی موت سے متعلق انگریزی مضمون سے اتفاق کرتا ہے، اور اس کا معلوماتی باکس اس کا مذہب اسلام کے طور پر دیتا ہے، عام طور پر، کسی اسکول کا نام نہیں دیتا۔"
