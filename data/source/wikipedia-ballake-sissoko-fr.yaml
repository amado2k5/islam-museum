reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026, and its content checked against the recorded revision. It gives Ballaké Sissoko, born in 1967 at Bamako, from a family of djéli (the Manding griot caste); his father, the musician Djelimady Sissoko, did not want his first son to become a musician, so Ballaké taught himself the kora; on his father's death in 1981, aged 13, he joined the Ensemble instrumental du Mali; the group Mandé Tabolo, formed in 2000; Chamber Music (2009) and Musique de nuit (2015) with Vincent Ségal; the difficult situation of traditional musicians in Mali, which led him to favour an international career; and the 4 February 2020 return from a US tour on which his custom kora, worth more than 5,000 euros, was found dismantled — this article names the Transportation Security Administration (TSA), speaks of an apology note, and reports the TSA's denial that it opened the baggage (the English article instead names U.S. Customs and Border Protection; the two accounts are stated separately in the record and prose, not merged). Its awards list gives the 2009 Victoire du Jazz for Chamber Music and the 2024 Victoire du jazz concert of the year for Les Égarés. The article states no religion for him."
