summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن القوس المدبب؛ لوقائع الكيان فقط: تعريفه وشكله ثنائي المراكز، شواهد ما قبل الإسلام ⁦(نيبور ونينوى وجسر كرة مجرة وقناة قبرس القرن السابع)⁩، الاستعمال الأموي-العباسي المبكر وقبة الصليبية وقصر العاشق بسامراء ومسجد ابن طولون، تسلسل تباعد المراكز من عُشر البحور ⁦(قصير عمرة)⁩ إلى ثلثها ⁦(الفسطاط)⁩، نقد وارن لتأريخ كريسويل، قراءة ستيوارت لقبرس البيزنطية، المبرر الإنشائي في درم، الأقباط الأولى ⁦(درم وسان دوني وليساي وتشيفالو)⁩، الرباعي المراكز وتيودور، والإحيائية الغوطية."
  en: "English Wikipedia article on the pointed arch; entity facts only: definition and two-centred form, pre-Islamic witnesses (Nippur, Nineveh, Karamagara bridge, seventh-century Cypriot aqueduct), early Umayyad-Abbasid use (Qubbat al-Sulaybiyya, Qasr al-Ashiq, Ibn Tulun), the centre-offset sequence from one-tenth of the span (Qusayr Amra) to one-third (Fustat), Warren's critique of Creswell's dating method, Stewart on Byzantine Cyprus, the Durham rib-vault rationale, early rib vaults (Durham, Saint-Denis, Lessay, Cefalu), sexpartite to quadripartite vaults, four-centred and Tudor forms, and the Gothic Revival."
  es: "Artículo de la Wikipedia en inglés sobre el arco apuntado; solo datos sobre la entidad: definición y forma bicéntrica, testimonios preislámicos (Nippur, Nínive, puente de Karamagara, acueducto chipriota del siglo VII), uso temprano omeya-abasí (Qubbat al-Sulaybiyya, Qasr al-Ashiq, Ibn Tulun), la secuencia de desplazamiento del centro desde una décima parte del vano (Qusayr Amra) hasta un tercio (Fustat), la crítica de Warren al método de datación de Creswell, Stewart sobre el Chipre bizantino, la justificación de la bóveda de crucería de Durham, las primeras bóvedas de crucería (Durham, Saint-Denis, Lessay, Cefalú), bóvedas sexpartitas a cuatripartitas, formas cuatricéntricas y Tudor, y el renacimiento gótico."
  fr: "Article de Wikipédia en anglais sur l'arc brisé; informations factuelles uniquement: définition et forme à deux centres, témoins préislamiques (Nippour, Ninive, pont de Karamagara, aqueduc chypriote du VIIe siècle), utilisation précoce omeyyade-abbasside (Qubbat al-Sulaybiyya, Qasr al-Ashiq, Ibn Tulun), la séquence de décalage du centre d'un dixième de la portée (Qusayr Amra) à un tiers (Fustat), la critique par Warren de la méthode de datation de Creswell, Stewart sur Chypre byzantine, la justification de la voûte d'ogives de Durham, les premières voûtes d'ogives (Durham, Saint-Denis, Lessay, Cefalù), les voûtes sexpartites à quadripartites, les formes à quatre centres et Tudor, et le renouveau gothique."
