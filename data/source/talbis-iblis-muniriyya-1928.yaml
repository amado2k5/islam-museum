  en: "Ibn al-Jawzi, Talbis Iblis, corrected and annotated by Muhammad Munir 'Abduh Agha al-Dimashqi, 2nd printing (Idarat al-Tiba'a al-Muniriyya, Egypt (Misr) 1347 AH / 1928)"
  ur: "ابن الجوزی، تلبیس ابلیس، تصحیح و تعلیق محمد منیر عبدہ آغا دمشقی، دوسری طباعت (ادارۃ الطباعۃ المنیریہ، مصر 1347ھ/1928ء)"
summary:
  ar: "الطبعة المنيرية الثانية من «تلبيس إبليس» لأبي الفرج عبد الرحمن بن الجوزي البغدادي (ت 597هـ)، صححها وعلق عليها محمد منير الدمشقي الأزهري سنة 1347هـ، وقال في خاتمتها إنه طبع الأولى عن نسختين خطيتين مختلفتي التاريخ ثم ظفر في الثانية بنسخة ثالثة؛ وفي آخرها فهرس للموضوعات."
  en: "The second Muniriyya printing of Talbis Iblis by Abu al-Faraj 'Abd al-Rahman ibn al-Jawzi al-Baghdadi (d. 597 AH), corrected and annotated by Muhammad Munir al-Dimashqi al-Azhari in 1347 AH; in his closing note he says the first printing rested on two manuscripts of different dates and that for the second he found a third; a table of topics closes the volume."
  ur: "ابو الفرج عبد الرحمن ابن الجوزی بغدادی (م 597ھ) کی «تلبیس ابلیس» کی دوسری منیری طباعت، جس کی تصحیح و تعلیق محمد منیر دمشقی ازہری نے 1347ھ میں کی؛ خاتمے میں وہ کہتے ہیں کہ پہلی طباعت دو مختلف تاریخوں کے قلمی نسخوں پر تھی اور دوسری کے لیے انہیں تیسرا نسخہ ملا؛ آخر میں موضوعات کی فہرست ہے۔"
