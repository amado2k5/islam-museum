label:
  ar: "تلبيس إبليس لابن الجوزي، بتصحيح محمد منير عبده أغا الدمشقي وتعليقه، الطبعة الثانية ⁦(إدارة الطباعة المنيرية، مصر 1347هـ/1928م)⁩"
  en: "Ibn al-Jawzi, Talbis Iblis, corrected and annotated by Muhammad Munir 'Abduh Agha al-Dimashqi, 2nd printing (Idarat al-Tiba'a al-Muniriyya, Egypt (Misr) 1347 AH / 1928)"
  ur: "ابن الجوزی، تلبیس ابلیس، تصحیح و تعلیق محمد منیر عبدہ آغا دمشقی، دوسری طباعت ⁦(ادارۃ الطباعۃ المنیریہ، مصر 1347ھ/1928ء)⁩"
summary:
  ar: "الطبعة المنيرية الثانية من «تلبيس إبليس» لأبي الفرج عبد الرحمن بن الجوزي البغدادي ⁦(ت 597هـ)⁩، صححها وعلق عليها محمد منير الدمشقي الأزهري سنة 1347هـ، وقال في خاتمتها إنه طبع الأولى عن نسختين خطيتين مختلفتي التاريخ ثم ظفر في الثانية بنسخة ثالثة؛ وفي آخرها فهرس للموضوعات."
  en: "The second Muniriyya printing of Talbis Iblis by Abu al-Faraj 'Abd al-Rahman ibn al-Jawzi al-Baghdadi (d. 597 AH), corrected and annotated by Muhammad Munir al-Dimashqi al-Azhari in 1347 AH; in his closing note he says the first printing rested on two manuscripts of different dates and that for the second he found a third; a table of topics closes the volume."
  ur: "ابو الفرج عبد الرحمن ابن الجوزی بغدادی ⁦(م 597ھ)⁩ کی «تلبیس ابلیس» کی دوسری منیری طباعت، جس کی تصحیح و تعلیق محمد منیر دمشقی ازہری نے 1347ھ میں کی؛ خاتمے میں وہ کہتے ہیں کہ پہلی طباعت دو مختلف تاریخوں کے قلمی نسخوں پر تھی اور دوسری کے لیے انہیں تیسرا نسخہ ملا؛ آخر میں موضوعات کی فہرست ہے۔"
  es: "La segunda edición de Muniriyya del Talbis Iblis de Abu al-Faraj 'Abd al-Rahman ibn al-Jawzi al-Baghdadi (fallecido en 597 AH), corregida y anotada por Muhammad Munir al-Dimashqi al-Azhari en 1347 AH; en su nota final dice que la primera edición se basó en dos manuscritos de fechas diferentes y que para la segunda encontró un tercero; una tabla de temas cierra el volumen."
  fr: "La deuxième édition Muniriyya du Talbis Iblis par Abu al-Faraj 'Abd al-Rahman ibn al-Jawzi al-Baghdadi (mort en 597 AH), corrigée et annotée par Muhammad Munir al-Dimashqi al-Azhari en 1347 AH; dans sa note finale, il dit que la première édition reposait sur deux manuscrits de dates différentes et que pour la seconde, il en a trouvé un troisième; une table des matières clôt le volume."
  tr: "Ebu el-Faraj Abd al-Rahman ibn al-Jawzi al-Baghdadi (ö. 597 Ah) tarafından yazılmış \"Tilbees Iblis\"in Muniriyyah baskısının ikinci baskısı, 1347 Hicri yılında Muhammed Munir el-Dimashqi el-Azhari tarafından düzenlenmiş ve yorumlanmıştır. Sonunda ilkini farklı tarihlerde iki el yazması kopyası olarak bastığını, ikincisinde üçüncü kopyayı aldığını belirtmiştir; ve sonunda konu dizini bulunmaktadır."
  id: "Edisi kedua dari edisi Muniriyyah \"Tilbees Iblis\" oleh Abu al-Faraj Abd al-Rahman ibn al-Jawzi al-Baghdadi (wafat 597 H), diedit dan dikomentari oleh Muhammad Munir al-Dimashqi al-Azhari pada tahun 1347 H. Dalam kesimpulannya, ia menyatakan bahwa ia mencetak yang pertama dalam dua salinan manuskrip dengan tanggal berbeda, kemudian memperoleh salinan ketiga dalam salinan kedua; dan di akhir terdapat indeks topik."
