summary:
  ar: "مدخل «المهندسخانه البرّي الهمايون» في موسوعة TDV الإسلامية: المدرسة التي فُتحت في هسكوي سنة 1795م في عهد سليم الثالث لتخريج المهندسين، وبرنامجها في الحساب والهندسة والرسم الفني والمساحة والتحصينات وحساب التفاضل والميكانيكا، وأساتذتها الأتراك ومطبعتها، ثم رتب المهندسين في الجيش الجديد ولواء المهندسين."
  en: "The TDV İslâm Ansiklopedisi entry on the Mühendishâne-i Berrî-i Hümâyun, the school opened at Hasköy in 1795 under Selim III to train engineers: its curriculum of arithmetic, geometry, technical drawing, surveying, fortification, conic sections, calculus and mechanics, its Turkish teaching staff and its printing press of 1797, and the later mühendis ranks in the new army and the engineer regiment of 1841."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre Mühendishâne-i Berrî-i Hümâyun, la escuela inaugurada en Hasköy en 1795 bajo el reinado de Selim III para formar ingenieros: su plan de estudios de aritmética, geometría, dibujo técnico, topografía, fortificación, secciones cónicas, cálculo y mecánica, su profesorado turco y su imprenta de 1797, y los posteriores rangos de mühendis en el nuevo ejército y el regimiento de ingenieros de 1841."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur le Mühendishâne-i Berrî-i Hümâyun, l'école ouverte à Hasköy en 1795 sous Selim III pour former des ingénieurs: son programme d'arithmétique, de géométrie, de dessin technique, d'arpentage, de fortification, de sections coniques, de calcul et de mécanique, son personnel enseignant turc et son imprimerie de 1797, et les grades ultérieurs de mühendis dans la nouvelle armée et le régiment du génie de 1841."
  ur: "Mühendishâne-i Berrî-i Hümâyun پر TDV İslâm Ansiklopedisi اندراج، 1795 میں ہاسکی میں سیلم III کے تحت انجینئروں کو تربیت دینے کے لیے کھولا جانے والا اسکول: اس کا ریاضی، جیومیٹری، تکنیکی ڈرائنگ، سروے، قلعہ بندی، کونکیکل اور اس کے عملے کو سکھانے کا نصاب۔ 1797 کا پرنٹنگ پریس، اور بعد میں مہندیس نئی فوج اور 1841 کی انجینئر رجمنٹ میں شامل ہوئے۔"
  tr: "TDV İslami Ansiklopedisi'nde 'Arazi Mühendisi Khaneh al-Humayun' girişi: Okul, 1795 yılında Selim III döneminde Heskoy'da mezun mühendisler için açıldı; aritmetik, mühendislik, teknik çizim, ölçüm, tahkimatlar, kalkülüs ve mekanik programları, Türk öğretmenleri ve matbaası, ardından yeni orduda mühendis ve mühendisler tugayında mühendis kadroları yer aldı."
  id: "Entri 'Insinyur Tanah Khaneh al-Humayun' dalam Ensiklopedia Islam TDV: Sekolah ini dibuka di Heskoy pada tahun 1795 M selama masa pemerintahan Selim III untuk lulusan insinyur, dengan program aritmatika, teknik, gambar teknis, survei, benteng, kalkulus, dan mekanika, guru Turki dan mesin cetak, kemudian pangkat insinyur di tentara baru dan brigade insinyur."
