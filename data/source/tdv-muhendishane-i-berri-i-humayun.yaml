summary:
  ar: "مدخل «المهندسخانه البرّي الهمايون» في موسوعة TDV الإسلامية: المدرسة التي فُتحت في هسكوي سنة 1795م في عهد سليم الثالث لتخريج المهندسين، وبرنامجها في الحساب والهندسة والرسم الفني والمساحة والتحصينات وحساب التفاضل والميكانيكا، وأساتذتها الأتراك ومطبعتها، ثم رتب المهندسين في الجيش الجديد ولواء المهندسين."
  en: "The TDV İslâm Ansiklopedisi entry on the Mühendishâne-i Berrî-i Hümâyun, the school opened at Hasköy in 1795 under Selim III to train engineers: its curriculum of arithmetic, geometry, technical drawing, surveying, fortification, conic sections, calculus and mechanics, its Turkish teaching staff and its printing press of 1797, and the later mühendis ranks in the new army and the engineer regiment of 1841."
