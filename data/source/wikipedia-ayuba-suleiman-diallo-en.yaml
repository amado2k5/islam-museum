  ar: "مقالة ويكيبيديا الإنجليزية عن أيوبا سليمان ديالو (1701–1773)، المعروف عند الإنجليز باسم جوب بن سولومون: أمير وعالم فولاني من بوندو ⁦(السنغال اليوم)⁩، أُسر سنة 1730 وبِيع إلى ماريلاند، ثم افتُدي ونُقل إلى لندن (1733) حيث رُسمت صورته وكتب القرآن من حفظه، وعاد إلى بلاده سنة 1734، وسُجّلت وفاته سنة 1773."
  en: "English Wikipedia article on Ayuba Suleiman Diallo (1701–1773), known in England as Job ben Solomon: a Fulani Muslim prince and scholar of Bundu (present-day Senegal), captured in 1730 and sold to Maryland, ransomed and brought to London in 1733 — where his portrait was painted and he copied the Qur'an from memory — returned home in 1734, and his death recorded in 1773."
