summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن مايكل بامبانغ هارتونو، المولود في 2 تشرين الأول 1939 والمتوفى في 19 آذار 2026 في سنغافورة؛ تذكر وراثته جاروم مع أخيه روبرت بودي سنة 1963، وتقول في متنها إن بامبانغ وأسرته يعتنقون الدين الكاثوليكي، وتذكر ميداليته في ألعاب آسيا 2018 ووفاته ودفنه في رمبانغ."
  en: "Indonesian Wikipedia article on Michael Bambang Hartono, born 2 October 1939 and died 19 March 2026 in Singapore; it records his inheritance of Djarum with his brother Robert Budi in 1963, states in its prose that Bambang and his family adhere to the Catholic faith, and records his 2018 Asian Games medal, his death and his burial in Rembang."
  es: "Artículo de la Wikipedia en indonesio sobre Michael Bambang Hartono, nacido el 2 de octubre de 1939 y fallecido el 19 de marzo de 2026 en Singapur; en él se recoge la herencia de Djarum que compartió con su hermano Robert Budi en 1963, se indica en su texto que Bambang y su familia profesaban la fe católica y se menciona su medalla en los Juegos Asiáticos de 2018, su fallecimiento y su entierro en Rembang."
  fr: "L'article de Wikipédia indonésien sur Michael Bambang Hartono, né le 2 octobre 1939 et décédé le 19 mars 2026 à Singapour, relate son héritage de Djarum avec son frère Robert Budi en 1963, indique dans son texte que Bambang et sa famille étaient de confession catholique, et relate sa médaille aux Jeux asiatiques de 2018, sa mort et son enterrement à Rembang."
  ur: "مائیکل بامبنگ ہارٹونو پر انڈونیشیائی ویکیپیڈیا کا مضمون، 2 اکتوبر 1939 کو پیدا ہوا اور 19 مارچ 2026 کو سنگاپور میں فوت ہوا۔ یہ 1963 میں اپنے بھائی رابرٹ بوڈی کے ساتھ دجارم کی وراثت کو ریکارڈ کرتا ہے، اپنے نثر میں بیان کرتا ہے کہ بامبنگ اور اس کا خاندان کیتھولک عقیدے پر قائم ہے، اور اس کا 2018 کے ایشین گیمز کا تمغہ، اس کی موت اور ریمبنگ میں اس کی تدفین کو ریکارڈ کرتا ہے۔"
