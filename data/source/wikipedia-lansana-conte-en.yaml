summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن لانسانا كونتي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في موساياه لومبايا قرب دوبريكا وتعليمه في المدرسة القرآنية وخدمته في الجيشين الفرنسي والغيني وانقلابه في أبريل 1984 ورئاسته غينيا حتى وفاته في 22 ديسمبر 2008، ومشاركته سنة 1980 في حج الحزب الرسمي إلى مكة ضمن وفد حكومي. لا يشهد نصها بإسلامه الشخصي ولا تسمّي له مذهبا، وتصنّفه ضمن مسلمي غينيا."
  en: "English Wikipedia article on Lansana Conté; used for entity facts only. It recounts his upbringing at Moussayah Loumbaya near Dubréka, his education at a local Qur'anic school, his service in the French and Guinean armies, his April 1984 coup and his presidency of Guinea until his death on 22 December 2008, and his part in the ruling party's official pilgrimage to Mecca in 1980 as a member of a government delegation. Its text does not attest his personal religion and names no school; it files him under Guinean Muslims."
