summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن لانسانا كونتي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في موساياه لومبايا قرب دوبريكا وتعليمه في المدرسة القرآنية وخدمته في الجيشين الفرنسي والغيني وانقلابه في أبريل 1984 ورئاسته غينيا حتى وفاته في 22 ديسمبر 2008، ومشاركته سنة 1980 في حج الحزب الرسمي إلى مكة ضمن وفد حكومي. لا يشهد نصها بإسلامه الشخصي ولا تسمّي له مذهبا، وتصنّفه ضمن مسلمي غينيا."
  en: "English Wikipedia article on Lansana Conté; used for entity facts only. It recounts his upbringing at Moussayah Loumbaya near Dubréka, his education at a local Qur'anic school, his service in the French and Guinean armies, his April 1984 coup and his presidency of Guinea until his death on 22 December 2008, and his part in the ruling party's official pilgrimage to Mecca in 1980 as a member of a government delegation. Its text does not attest his personal religion and names no school; it files him under Guinean Muslims."
  es: "Artículo de la Wikipedia en inglés sobre Lansana Conté; utilizado únicamente para datos biográficos. Relata su infancia en Moussayah Loumbaya, cerca de Dubréka, su educación en una escuela coránica local, su servicio en los ejércitos francés y guineano, el golpe de Estado de abril de 1984 y su presidencia de Guinea hasta su fallecimiento el 22 de diciembre de 2008, así como su participación en la peregrinación oficial del partido gobernante a La Meca en 1980 como miembro de una delegación gubernamental. El texto no menciona su religión personal ni nombra ninguna escuela; lo clasifica dentro de la categoría de musulmanes guineanos."
  fr: "Article de Wikipédia en anglais sur Lansana Conté; utilisé uniquement à des fins d'information sur l'entité. Il relate son enfance à Moussayah Loumbaya, près de Dubréka, sa scolarité dans une école coranique locale, son service dans les armées française et guinéenne, son coup d'État d'avril 1984 et sa présidence de la Guinée jusqu'à sa mort le 22 décembre 2008, ainsi que sa participation au pèlerinage officiel du parti au pouvoir à La Mecque en 1980 en tant que membre d'une délégation gouvernementale. Le texte ne mentionne pas sa religion personnelle ni son école; il le classe parmi les musulmans guinéens."
  ur: "Lansana Conté پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ڈوبریکا کے قریب موسایا لومبیا میں اس کی پرورش، ایک مقامی قرآنی اسکول میں اس کی تعلیم، فرانسیسی اور گنی کی فوجوں میں اس کی خدمات، اس کی اپریل 1984 کی بغاوت اور 22 دسمبر 2008 کو اس کی موت تک گنی کی صدارت، اور حکمران جماعت میں بطور سرکاری رکن Mecca کے ممبر کے طور پر اس کا حصہ بتایا گیا ہے۔ وفد اس کا متن اس کے ذاتی مذہب کی تصدیق نہیں کرتا اور کسی اسکول کا نام نہیں رکھتا۔ یہ اسے گنی کے مسلمانوں کے تحت فائل کرتا ہے۔"
  tr: "Lansana Conté hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Makale, Dobrica yakınlarındaki Moussaiya Lumbaya'da yetiştirilmesini, Kur'an okulundaki eğitimini, Fransız ve Gine ordularındaki hizmetini, Nisan 1984'teki darbesini, 22 Aralık 2008'deki ölümüne kadar Gine başkanlığını ve 1980'de resmi partinin Mekke'ye hac yolculuğuna hükümet heyetinin bir parçası olarak katılımını anlatır. Metni kişisel İslam'ını belgelememektedir, mezhebini adlandırmaz ve onu Gine'deki Müslümanlar arasında sınıflandırmaz."
  id: "Artikel Wikipedia bahasa Inggris tentang Lansana Conté; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Moussaiya Lumbaya dekat Dobrica, pendidikannya di sekolah Al-Qur'an, pengabdiannya di tentara Prancis dan Guinea, kudetanya pada April 1984, kepresidenannya di Guinea hingga kematiannya pada 22 Desember 2008, dan partisipasinya pada tahun 1980 dalam ziarah resmi partai ke Mekah sebagai bagian dari delegasi pemerintah. Teksnya tidak mengakui Islam pribadinya, juga tidak menyebutkan sektenya dan mengklasifikasikannya di antara Muslim Guinea."
