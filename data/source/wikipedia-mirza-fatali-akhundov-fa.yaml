summary:
  ar: مقالة ويكيبيديا الفارسية عن ميرزا فتح علي أخوندزاده؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 2 رجب 1227 الموافق 12 يوليو 1812 ووفاته سنة 1295، وتكرر بالفارسية حكم موسوعة إيرانيكا بأنه كان خداناباور ⁦(ملحدًا)⁩.
  en: Persian Wikipedia article on Mirza Fatali Akhundov (Akhundzadeh); used for entity facts only. It gives his birth on 2 Rajab 1227 (12 July 1812) and death in 1295 (1878), and repeats in Persian the Encyclopaedia Iranica judgement that he was an atheist (khodanabavar).
  es: "Artículo en persa de la Wikipedia sobre Mirza Fatali Akhundov (Akhundzadeh); utilizado únicamente para datos sobre la persona. Indica que nació el 2 de Rajab de 1227 (12 de julio de 1812) y murió en 1295 (1878), y reproduce en persa el juicio de la Encyclopaedia Iranica que lo declara ateo (khodanabavar)."
  fr: "L'article persan de Wikipédia sur Mirza Fatali Akhundov (Akhundzadeh) est utilisé uniquement pour des informations factuelles. Il indique sa naissance le 2 Rajab 1227 (12 juillet 1812) et sa mort en 1295 (1878), et reprend en persan l'avis de l'Encyclopaedia Iranica selon lequel il était athée (khodanabavar)."
  ur: "فارسی ویکیپیڈیا پر مرزا فتحی اخوندوف ⁦(اخوندزادہ)⁩ پر مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 2 رجب 1227 ⁦(12 جولائی 1812)⁩ اور موت 1295 (1878) میں بتائی گئی ہے، اور فارسی میں انسائیکلوپیڈیا ایرانیکا کے فیصلے کو دہرایا گیا ہے کہ وہ ملحد ⁦(خودانابوار)⁩ تھا۔"
  tr: "Farsça Vikipedi'de Mirza Fath Ali Akhundzadeh hakkında; yalnızca varlığın gerçekleri için kullanılmıştır. 2 Rajab 1227'de doğmuş, yani 12 Temmuz 1812'ye denk gelmektedir ve 1295'te ölmüştür; İranica ansiklopedisinde Fars yönetimi tekrar Khodanabavar (bir ateist) olarak belirtilmiştir."
  id: "Artikel Wikipedia Persia tentang Mirza Fath Ali Akhundzadeh; digunakan hanya untuk fakta entitas. Ia lahir pada 2 Rajab 1227, yang bertepatan dengan 12 Juli 1812, dan meninggal pada tahun 1295, dan pemerintahan Persia dalam ensiklopedia Iranica diulang bahwa ia adalah Khodanabavar (seorang ateis)."
