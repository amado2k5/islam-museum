summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ماجد بن سعيد البوسعيدي ⁦(نحو 1834-1870)⁩، أول سلاطين زنجبار (1856-1870)؛ يذكر صندوق معلوماتها أن دينه هو الإسلام الإباضي وأن والده هو سعيد بن سلطان، وتسرد خلافته المتنازع عليها وانقسام زنجبار وعُمان ووفاته في 7 أكتوبر 1870."
  en: "English Wikipedia article on Majid bin Said al-Busaidi (c. 1834–1870), first Sultan of Zanzibar (1856–1870); its infobox gives his religion as Ibadi Islam and his father as Said bin Sultan, and the article sets out his contested accession, the division of Zanzibar and Oman, and his death on 7 October 1870."
  es: "Artículo de la Wikipedia en inglés sobre Majid bin Said al-Busaidi (c. 1834–1870), primer sultán de Zanzíbar (1856–1870); su ficha informativa indica que su religión era el islam ibadí y que su padre era Said bin Sultan, y el artículo expone su controvertida ascensión al trono, la división de Zanzíbar y Omán, y su muerte el 7 de octubre de 1870."
  fr: "Article de Wikipédia en anglais sur Majid bin Said al-Busaidi (vers 1834-1870), premier sultan de Zanzibar (1856-1870); son infobox indique que sa religion est l'islam ibadite et que son père est Said bin Sultan, et l'article décrit son accession contestée au trône, la division de Zanzibar et d'Oman, et sa mort le 7 octobre 1870."
  ur: "ماجد بن سعید البوسیدی (c. 1834–1870)، زنجبار کے پہلے سلطان (1856–1870) پر انگریزی ویکیپیڈیا کا مضمون؛ اس کے معلوماتی خانے میں اس کا مذہب عبادی اسلام اور اس کے والد سعید بن سلطان کے طور پر دیا گیا ہے، اور مضمون میں اس کے متنازعہ الحاق، زنجبار اور عمان کی تقسیم اور 7 اکتوبر 1870 کو اس کی موت کا ذکر کیا گیا ہے۔"
