  ar: "مقالة ويكيبيديا الإنجليزية عن ضياء الدين أحمد (1873–1947)؛ تُستخدم لوقائع الكيان فقط. رياضياتي من ميروت وبرلماني في الهند البريطانية، نائب رئيس جامعة عليكرة الإسلامية في فترات متعددة، وصندوق تعاقبه يجعل نواب محمد إسماعيل خان سلفه المباشر في الفترة التي بدأت سنة 1935."
  en: "English Wikipedia article on Ziauddin Ahmad (1873–1947); used for entity facts only. A Meerut mathematician and British Indian parliamentarian who served several terms as Vice-Chancellor of Aligarh Muslim University; its succession box gives Nawab Mohammad Ismail Khan as his immediate predecessor for the term beginning in 1935."
  es: "Artículo de la Wikipedia en inglés sobre Ziauddin Ahmad (1873-1947); utilizado únicamente para datos sobre la persona. Matemático de Meerut y parlamentario británico de origen indio, ocupó el cargo de vicerrector de la Universidad Musulmana de Aligarh durante varios mandatos; en su recuadro de sucesión figura Nawab Mohammad Ismail Khan como su predecesor inmediato para el mandato que comenzó en 1935."
  fr: "Article de Wikipédia en anglais sur Ziauddin Ahmad (1873-1947); utilisé uniquement pour les informations sur l'entité. Mathématicien de Meerut et parlementaire britannique des Indes, il a occupé à plusieurs reprises le poste de vice-chancelier de l'université musulmane d'Aligarh; l'encadré relatif à sa succession indique que Nawab Mohammad Ismail Khan était son prédécesseur immédiat pour le mandat débutant en 1935."
