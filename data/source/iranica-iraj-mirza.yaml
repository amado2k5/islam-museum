reliability_note: "Scholarly encyclopedia entry (Vol. XIII, Fasc. 2, pp. 202-204), read in full on 26 October 2026. Its death date, 12 March 1926, is given consistently in two calendars (27 Sha'ban 1344; the Persian article's 22 Esfand 1304 converts to the same day) against the 14 March of the English article and Wikidata; the record discloses the split. It discusses his themes, including his criticism of the veil and of social conditions, but makes no statement of his personal belief or unbelief."
