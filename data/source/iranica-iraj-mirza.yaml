summary:
  ar: "مدخل موسوعة إيرانيكا «إيرج ميرزا، جلال‌الممالک» بقلم بهروز محمودي بختياري؛ يُستخدم لوقائع الكيان. يعطي ميلاده في تبريز في رمضان 1291 (أكتوبر 1874) ووفاته في طهران في 27 شعبان 1344 (12 مارس 1926)، وتعليمه في دار الفنون تبريز ومناصبه وشعره الساخر ونقده الاجتماعي."
  en: "Encyclopaedia Iranica entry 'Iraj Mirza, Jalal-al-Mamalek' by Behrooz Mahmoodi-Bakhtiari; used for entity facts. It gives his birth at Tabriz in Ramadan 1291 (October 1874) and his death at Tehran on 27 Sha'ban 1344 (12 March 1926), his schooling at Tabriz's Dar ul-Funun, his posts, and his satirical and socially critical poetry."
