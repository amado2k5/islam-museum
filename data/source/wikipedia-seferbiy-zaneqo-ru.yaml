  ar: "مقالة ويكيبيديا الروسية عن سفر بك زان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1798 في أنابا ووفاته في 1 يناير 1860، وتفصّل تعليمه في ليسيه ريشيليو في أوديسا وخدمته الروسية ثم العثمانية وقيادته المقاومة الشركسية؛ ولا تنسب إليه مذهبا."
  en: "Russian Wikipedia article on Sefer-bey Zan; used for entity facts only. It gives his birth in 1798 at Anapa and his death on 1 January 1860, and details his education at the Richelieu Lyceum in Odessa, his Russian then Ottoman service and his leadership of the Circassian resistance; it names no school for him."
