summary:
  ar: "مقالة ويكيبيديا الروسية عن سفر بك زان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1798 في أنابا ووفاته في 1 يناير 1860، وتفصّل تعليمه في ليسيه ريشيليو في أوديسا وخدمته الروسية ثم العثمانية وقيادته المقاومة الشركسية؛ ولا تنسب إليه مذهبا."
  en: "Russian Wikipedia article on Sefer-bey Zan; used for entity facts only. It gives his birth in 1798 at Anapa and his death on 1 January 1860, and details his education at the Richelieu Lyceum in Odessa, his Russian then Ottoman service and his leadership of the Circassian resistance; it names no school for him."
  es: "Artículo de la Wikipedia rusa sobre Sefer-bey Zan; utilizado únicamente para obtener información sobre la persona. Indica su nacimiento en 1798 en Anapa y su fallecimiento el 1 de enero de 1860, y detalla su educación en el Liceo Richelieu de Odessa, su servicio en Rusia y posteriormente en el Imperio Otomano, y su liderazgo en la resistencia circasiana; no menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en russe sur Sefer-bey Zan; utilisé uniquement pour les informations le concernant. Il indique sa naissance en 1798 à Anapa et sa mort le 1er janvier 1860, et détaille ses études au lycée Richelieu d’Odessa, son service dans l’armée russe puis ottomane et son rôle de chef de la résistance circassienne; il ne mentionne aucune école à son nom."
  ur: "Sefer-bey Zan پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1798 میں انپا میں ان کی پیدائش اور 1 جنوری 1860 کو ان کی موت، اور اوڈیسا کے رچیلیو لائسیوم میں ان کی تعلیم، اس کی روسی اس وقت کی عثمانی خدمات اور سرکیسیئن مزاحمت کی قیادت؛ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Bek Zan'ın seyahatiyle ilgili Rusça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1798'de Anapa'da doğduğunu ve 1 Ocak 1860'taki ölümünü anlatır, Odessa'daki Lycée Richelieu'deki eğitimini, Rus ve ardından Osmanlı hizmetini ve Çerkes direnişini yönetmeyi detaylandırır; ona herhangi bir mezhep atfetmez."
  id: "Artikel Wikipedia Rusia tentang perjalanan Bek Zan; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada tahun 1798 di Anapa dan kematiannya pada 1 Januari 1860, merinci pendidikannya di Lycée Richelieu di Odessa, pengabdiannya di Rusia dan kemudian Ottoman, serta kepemimpinannya dalam perlawanan Circassian; tidak mengaitkan sekte apapun dengannya."
