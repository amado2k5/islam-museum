  ar: "مقال موسوعي عن عارف لوهار ⁦(وُلد 18 أبريل 1966)⁩، مغنّي البنجاب الشعبي وابن عالم لوهار، صاحب «ألف الله ⁦(جغني)⁩» في كوك ستوديو."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth on 18 April 1966 in the village of Achh, names his father as the folk singer Alam Lohar, and covers his chimta-accompanied folk singing, his 2006 Jugni with Nooran Lal, his Coke Studio performance of Alif Allah (Jugni) and his Pride of Performance (2005)."
  ur: "موسوعاتی مضمون عارف لوہار ⁦(پیدائش 18 اپریل 1966ء)⁩ پر؛ والد عالم لوہار، چمٹے کے ساتھ لوک گائیکی اور کوک اسٹوڈیو کی «الف اللہ ⁦(جگنی)⁩» کا احاطہ کرتا ہے۔"
  es: "Artículo de enciclopedia editado por la comunidad, recuperado en su totalidad en la revisión indicada; en él se menciona su nacimiento el 18 de abril de 1966 en el pueblo de Achh, se nombra a su padre como el cantante folclórico Alam Lohar y se abarca su canto folclórico acompañado de chimta, su Jugni de 2006 con Nooran Lal, su actuación en Coke Studio de Alif Allah (Jugni) y su premio Pride of Performance (2005)."
