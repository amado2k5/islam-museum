summary:
  ar: "مقالة ويكيبيديا التركية عن جعفر سيد أحمد قريمر؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 1 سبتمبر 1889 في قيزيل طاش ووفاته في 3 أبريل 1960 في إسطنبول ودفنه في مقبرة فري كوي بإسطنبول، وقائمة مؤلفاته؛ ولا تتضمن أي محتوى ديني عنه."
  en: "Turkish Wikipedia article on Cafer Seydahmet Kırımer; used for entity facts only. It gives his birth on 1 September 1889 at Kızıltaş, his death on 3 April 1960 in Istanbul and his burial in Istanbul's Feriköy Cemetery, and lists his books; it contains no religion content about him."
  es: "Artículo de la Wikipedia en turco sobre Cafer Seydahmet Kırımer; utilizado únicamente para datos biográficos. Indica su nacimiento el 1 de septiembre de 1889 en Kızıltaş, su fallecimiento el 3 de abril de 1960 en Estambul y su entierro en el cementerio Feriköy de Estambul, y enumera sus libros; no contiene información religiosa sobre él."
  fr: "Article de Wikipédia en turc sur Cafer Seydahmet Kırımer; utilisé uniquement pour les informations biographiques. Il indique sa naissance le 1er septembre 1889 à Kızıltaş, son décès le 3 avril 1960 à Istanbul et son inhumation au cimetière Feriköy d'Istanbul, et liste ses ouvrages; il ne contient aucune information religieuse à son sujet."
  ur: "Cafer Seydahmet Kırımer پر ترکی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1 ستمبر 1889 کو Kızıltaş میں ان کی پیدائش، 3 اپریل 1960 کو استنبول میں اس کی موت اور استنبول کے Feriköy قبرستان میں اس کی تدفین ہوئی، اور اس کی کتابوں کی فہرست دی گئی ہے۔ اس میں اس کے بارے میں کوئی مذہبی مواد نہیں ہے۔"
  tr: "Jafar Seyid Ahmed Kırımer hakkında Türkçe Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1 Eylül 1889'da Kızıltaş'ta doğduğunu, 3 Nisan 1960'ta İstanbul'da vefat ettiğini ve İstanbul'daki Freyköy Mezarlığı'na defnedilmesini ve eserlerinin listesini içermektedir; hakkında herhangi bir dini içerik içermemektedir."
  id: "Artikel Wikipedia Turki tentang Jafar Seyed Ahmed Qırımer; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada 1 September 1889 di Kızıltaş, kematiannya pada 3 April 1960 di Istanbul, dan pemakamannya di Pemakaman Freyköy di Istanbul, beserta daftar karyanya; tidak memuat konten keagamaan apapun tentang dirinya."
