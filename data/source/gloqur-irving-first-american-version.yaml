  ar: "تدوينة لجوانا بينك في مشروع «القرآن العالمي»، 22 مارس 2024، عن «القرآن: النسخة الأمريكية الأولى» لتوماس بالانتاين إيرفنغ سنة 1985، وسياق نشأة النشر الإسلامي في الولايات المتحدة، وتمويل عائلة عاصي في سيدار رابيدز وشركة ميدامار للأغذية الحلال."
