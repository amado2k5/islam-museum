summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كوستا خيتاغوروف؛ تُستخدم لوقائع الكيان فقط. تروي حياته مؤسسًا للأدب الأوسيتي ورسامًا ومنفيًا مرتين، ولا تذكر ديانته الشخصية في أي موضع."
  en: "English Wikipedia article on Kosta Khetagurov; used for entity facts only. It recounts his life as founder of Ossetian literature, painter and twice-exiled public figure, and nowhere states his personal religion."
  es: "Artículo de la Wikipedia en inglés sobre Kosta Khetagurov; utilizado únicamente para obtener información sobre su persona. Narra su vida como fundador de la literatura osetia, pintor y figura pública exiliada en dos ocasiones, y en ningún momento menciona su religión personal."
  fr: "Article de Wikipédia en anglais sur Kosta Khetagurov; utilisé uniquement pour les informations le concernant. Il relate sa vie en tant que fondateur de la littérature ossète, peintre et personnalité publique exilée à deux reprises, sans mentionner sa religion."
  ur: "کوسٹا کھیتگورو پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اوسیشین ادب کے بانی، مصور اور دو مرتبہ جلاوطن عوامی شخصیت کے طور پر ان کی زندگی کا ذکر کرتا ہے، اور کہیں بھی ان کے ذاتی مذہب کا ذکر نہیں کیا گیا ہے۔"
  tr: "Kosta Khitagorov hakkında İngilizce Wikipedia makalesi; sadece varlığın gerçekleri için kullanılmıştır. Oset edebiyatının kurucusu, ressam ve iki kez sürgün olarak hayatını anlatır, kişisel dinine hiçbir yer yer verilmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Kosta Khitagorov; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kehidupannya sebagai pendiri sastra Ossetia, pelukis, dan dua kali sebagai pengasingan, tanpa menyebutkan agama pribadinya di mana pun."
