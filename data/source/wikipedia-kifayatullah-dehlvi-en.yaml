summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كفاية الله الدهلوي (1875–1952)؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في شاه جهان بور ودراسته في دار العلوم ديوبند، وتدريسه في مدرسة أمينيا بدلهي ورئاسته لها، ورئاسته جمعية علماء الهند، وفتاواه وكتابيه «تعليم الإسلام» و«كفاية المفتي»، ووفاته في دلهي في 31 ديسمبر 1952."
  en: "English Wikipedia article on Kifayatullah Dehlawi (1875–1952); used for entity facts only. It recounts his birth at Shahjahanpur, his studies at Darul Uloom Deoband, his teaching and rectorship at Madrasa Aminia in Delhi, his presidencies of Jamiat Ulama-e-Hind, his fatwa work and his books Ta'limul Islam and Kifayat al-Mufti, and his death at Delhi on 31 December 1952."
  es: "Artículo de la Wikipedia en inglés sobre Kifayatullah Dehlawi (1875-1952); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Shahjahanpur, sus estudios en Darul Uloom Deoband, su labor docente y rectoral en la Madrasa Aminia de Delhi, sus presidencias de Jamiat Ulama-e-Hind, su labor en la emisión de fatuas y sus libros Ta'limul Islam y Kifayat al-Mufti, y su fallecimiento en Delhi el 31 de diciembre de 1952."
  fr: "Article de Wikipédia en anglais sur Kifayatullah Dehlawi (1875-1952); utilisé uniquement à titre informatif. Il relate sa naissance à Shahjahanpur, ses études à Darul Uloom Deoband, son enseignement et son rectorat à la Madrasa Aminia de Delhi, ses présidences de Jamiat Ulama-e-Hind, ses travaux sur les fatwas et ses ouvrages Ta'limul Islam et Kifayat al-Mufti, ainsi que sa mort à Delhi le 31 décembre 1952."
  ur: "کفایت اللہ دہلوی (1875-1952) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں شاہجہاں پور میں ان کی پیدائش، دارالعلوم دیوبند میں ان کی تعلیم، دہلی کے مدرسہ امینیہ میں ان کی تدریس اور رجعت، جمعیت علمائے ہند کی ان کی صدارت، ان کے فتویٰ کام اور ان کی کتابیں تعلیم الاسلام اور کفایت المفتی، اور 31 دسمبر 1952 کو دہلی میں ان کی وفات کا ذکر ہے۔"
  tr: "Kifayatullah Dehlawi (1875–1952) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Şah Cihanpur'daki yetiştirilme yıllarını, Darul Uloom Deoband'daki eğitimlerini, Delhi'deki Amnia Okulu'ndaki öğretmenliğini ve oradaki başkanlığını, Hint Alimler Derneği başkanlığını, fetvaları ve kitapları 'Taleem al-Islam' ile 'Kifayat al-Mufti' ile 31 Aralık 1952'de Delhi'de vefatını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Kifayatullah Dehlawi (1875–1952); digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Shah Jahanpur, studinya di Darul Uloom Deoband, pengajarannya di Sekolah Amnia di Delhi dan masa kepresidenannya di sana, kepresidenannya di Asosiasi Cendekiawan India, fatwa dan bukunya 'Taleem al-Islam' dan 'Kifayat al-Mufti', serta kematiannya di Delhi pada 31 Desember 1952."
