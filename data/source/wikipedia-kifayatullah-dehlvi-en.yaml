summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كفاية الله الدهلوي (1875–1952)؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في شاه جهان بور ودراسته في دار العلوم ديوبند، وتدريسه في مدرسة أمينيا بدلهي ورئاسته لها، ورئاسته جمعية علماء الهند، وفتاواه وكتابيه «تعليم الإسلام» و«كفاية المفتي»، ووفاته في دلهي في 31 ديسمبر 1952."
  en: "English Wikipedia article on Kifayatullah Dehlawi (1875–1952); used for entity facts only. It recounts his birth at Shahjahanpur, his studies at Darul Uloom Deoband, his teaching and rectorship at Madrasa Aminia in Delhi, his presidencies of Jamiat Ulama-e-Hind, his fatwa work and his books Ta'limul Islam and Kifayat al-Mufti, and his death at Delhi on 31 December 1952."
