  ar: "مقالة ويكيبيديا الإنجليزية عن فرقة الهيب هوب الدنماركية آوتلانديش؛ لوقائع الكيان فقط: تأسيسها سنة 1997 في برونبي ستراند، وأعضاؤها، وأغانيها «Look into My Eyes» و«Aïcha» و«Guantanamo»، وتفرقها في 2017 وعودتها، وحفلاتها الخيرية، والجدلان في الصحافة الدنماركية سنتي 2006 و2007 بأقوال الطرفين؛ تستند إلى يولاندس بوستن وبي تي وتي في 2 وغافا وعرب نيوز."
  en: "English Wikipedia article on the Danish hip-hop group Outlandish; entity facts only: its formation in 1997 in Brøndby Strand, its members, the songs 'Look into My Eyes', 'Aïcha' and 'Guantanamo', its 2017 break-up and return, its charity concerts, and the 2006 and 2007 disputes in the Danish press with both sides' statements; it cites Jyllands-Posten, BT, TV 2, Gaffa, DR and Arab News."
