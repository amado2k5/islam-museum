summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فرقة الهيب هوب الدنماركية آوتلانديش؛ لوقائع الكيان فقط: تأسيسها سنة 1997 في برونبي ستراند، وأعضاؤها، وأغانيها «Look into My Eyes» و«Aïcha» و«Guantanamo»، وتفرقها في 2017 وعودتها، وحفلاتها الخيرية، والجدلان في الصحافة الدنماركية سنتي 2006 و2007 بأقوال الطرفين؛ تستند إلى يولاندس بوستن وبي تي وتي في 2 وغافا وعرب نيوز."
  en: "English Wikipedia article on the Danish hip-hop group Outlandish; entity facts only: its formation in 1997 in Brøndby Strand, its members, the songs 'Look into My Eyes', 'Aïcha' and 'Guantanamo', its 2017 break-up and return, its charity concerts, and the 2006 and 2007 disputes in the Danish press with both sides' statements; it cites Jyllands-Posten, BT, TV 2, Gaffa, DR and Arab News."
  es: "Artículo de la Wikipedia en inglés sobre el grupo danés de hip-hop Outlandish; solo datos sobre la entidad: su formación en 1997 en Brøndby Strand, sus miembros, las canciones 'Look into My Eyes', 'Aïcha' y 'Guantanamo', su separación y regreso en 2017, sus conciertos benéficos y las disputas de 2006 y 2007 en la prensa danesa con declaraciones de ambas partes; cita a Jyllands-Posten, BT, TV 2, Gaffa, DR y Arab News."
  fr: "Article de Wikipédia en anglais sur le groupe de hip-hop danois Outlandish; informations factuelles uniquement: sa formation en 1997 à Brøndby Strand, ses membres, les chansons « Look into My Eyes », « Aïcha » et « Guantanamo », sa séparation et son retour en 2017, ses concerts caritatifs et les différends de 2006 et 2007 dans la presse danoise avec les déclarations des deux parties; il cite Jyllands-Posten, BT, TV 2, Gaffa, DR et Arab News."
  ur: "ڈینش ہپ ہاپ گروپ آؤٹ لینڈیش پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: اس کی تشکیل 1997 میں Brøndby Strand میں، اس کے اراکین، گانے 'Look into My Eyes'، 'Aïcha' اور 'Guantanamo'، اس کا 2017 کا بریک اپ اور واپسی، اس کے چیریٹی کنسرٹ، اور 2006 اور 2007 کے تنازعات ڈینش پریس میں دونوں طرف سے بیانات؛ اس میں Jyllands-Posten، BT، TV 2، Gaffa، DR اور عرب نیوز کا حوالہ دیا گیا ہے۔"
  tr: "Danimarkalı hip-hop grubu Outlandish hakkında İngilizce Wikipedia makalesi; sadece varlık için gerçekler: 1997'de Brunaby Strand'da kurulmaları, üyeleri, \"Look into My Eyes,\" \"Aïcha\" ve \"Guantanamo\" şarkıları, 2017'deki dağılmaları ve dönüşleri, hayır konserleri ve 2006 ile 2007'de Danimarka basınında her iki tarafın açıklamalarına dayanan tartışmalar; Yolandspost, BT, TV2, Gava ve Arab News temelinde."
  id: "Artikel Wikipedia bahasa Inggris tentang band hip-hop Denmark Outlandish; hanya untuk fakta entitas: pendirian mereka pada tahun 1997 di Brunaby Strand, anggotanya, lagu-lagu mereka \"Look into My Eyes,\" \"Aïcha,\" dan \"Guantanamo,\" pembubaran mereka pada 2017 dan kembalinya mereka, konser amal mereka, serta perdebatan di pers Denmark pada 2006 dan 2007 berdasarkan pernyataan dari kedua belah pihak; berdasarkan Yolandspost, BT, TV2, Gava, dan Arab News."
