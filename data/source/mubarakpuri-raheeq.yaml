label: { ar: "الرحيق المختوم — صفي الرحمن المباركفوري", en: "al-Raheeq al-Makhtum — Safi al-Rahman al-Mubarakpuri" }
summary:
  ar: "الرحيق المختوم: بحث في السيرة النبوية، الفائز بالجائزة الأولى في مسابقة رابطة العالم الإسلامي للسيرة ⁦(1399هـ/1979م)⁩، أوسع السير الحديثة انتشاراً، ويعتمد على المصادر الكلاسيكية بهوامش في كل صفحة تقريباً."
  en: "al-Raheeq al-Makhtum, first prize of the Muslim World League's 1979 sira competition; a Sunni modern sira citing classical sources in footnotes on nearly every page."
  es: "al-Raheeq al-Makhtum, primer premio del concurso de sira de la Liga Mundial Musulmana de 1979; una sira sunita moderna que cita fuentes clásicas en notas a pie de página en casi todas las páginas."
  fr: "al-Raheeq al-Makhtum, premier prix du concours de sira de la Ligue musulmane mondiale de 1979; une sira sunnite moderne citant des sources classiques dans des notes de bas de page sur presque chaque page."
  ur: "الرحیق المختم، مسلم ورلڈ لیگ کے 1979 کے سیرت مقابلے کا پہلا انعام؛ ایک سنی جدید سیرہ جو تقریباً ہر صفحے پر فوٹ نوٹ میں کلاسیکی ذرائع کا حوالہ دیتی ہے۔"
  tr: "Al-Hareq Al-Khatmum: Peygamberlik biyografisi üzerine bir çalışma, Müslüman Dünya Ligi Biyografi Yarışması'nda birincilik kazanan (1399 Hicri / 1979 M.S.), en yaygın dolaşıma giren modern biyografilerden biri olup, neredeyse her sayfasında dipnotlar bulunan klasik kaynaklara dayanır."
  id: "Al-Hareq Al-Khatmum: Sebuah studi tentang biografi Nabi, pemenang juara pertama dalam Kompetisi Biografi Liga Dunia Muslim (1399 H / 1979 M), biografi modern yang paling banyak beredar, mengandalkan sumber klasik dengan catatan kaki di hampir setiap halaman."
title: "الرحيق المختوم: بحث في السيرة النبوية"
