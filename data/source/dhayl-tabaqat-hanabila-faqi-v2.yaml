  en: "Kitab al-Dhayl ala Tabaqat al-Hanabila by Ibn Rajab — part 2, corrected by Muhammad Hamid al-Fiqi, Cairo 1372 AH / 1953"
summary:
  ar: "الجزء الثاني من «الذيل على طبقات الحنابلة» لزين الدين أبي الفرج عبد الرحمن بن أحمد بن رجب البغدادي ثم الدمشقي الحنبلي ⁦(736–795هـ)⁩، وقف على طبعه وصححه محمد حامد الفقي، ونشر بالقاهرة سنة 1372هـ/1953م كما في صفحة العنوان. يبدأ بوفيات المائة السابعة من سنة 601، وأول تراجمه برقم 214 ترجمة الحافظ عبد الغني المقدسي، وفي آخره فهرس التراجم."
  en: "Part 2 of al-Dhayl ala Tabaqat al-Hanabila by Zayn al-Din Abu al-Faraj Abd al-Rahman ibn Ahmad ibn Rajab al-Baghdadi then al-Dimashqi al-Hanbali (736–795 AH), seen through the press and corrected by Muhammad Hamid al-Fiqi, Cairo, 1372 AH / 1953 CE as the title page gives it. It opens the deaths of the seventh century from the year 601; its first entry, no. 214, is the biography of the hafiz Abd al-Ghani al-Maqdisi; an index of entries closes the volume."
