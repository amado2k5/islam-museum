label:
  ar: "ابن عابدين، رد المحتار على الدر المختار، الجزء الرابع ⁦(بولاق 1271هـ)⁩"
  en: "Ibn Abidin, Radd al-Muhtar ala al-Durr al-Mukhtar, vol. 4 (Bulaq, 1271 AH)"
  ur: "ابن عابدین، رد المحتار علی الدر المختار، جلد چہارم ⁦(بولاق، 1271ھ)⁩"
summary:
  ar: "الجزء الرابع من حاشية ابن عابدين، طُبع بدار الطباعة المصرية ببولاق وتم طبعه في أوائل شعبان سنة 1271هـ، مقابلاً على خط المؤلف إلا أواخره، ومتن الدر المختار في الهامش. يبدأ بكتاب البيوع وينتهي بكتاب الهبة، ويتلوه الجزء الخامس أوله كتاب الإجارة. من مسح مكتبة الإسكندرية على الأرشيف ⁦(المعرّف AAlexandrina-147484، 530 صفحة)⁩."
  en: "Volume 4 of Ibn Abidin's gloss, printed at the Egyptian Press (Dar al-Tiba'a al-Misriyya) at Bulaq and finished early in Sha'ban 1271 AH, collated with the author's autograph except for its last part, with al-Durr al-Mukhtar in the margin. It runs from the Book of Sales to the Book of Gifts; vol. 5 begins with the Book of Hire. From the Bibliotheca Alexandrina scan on archive.org (item AAlexandrina-147484, 530 pages)."
  es: "Volumen 4 de la glosa de Ibn Abidin, impresa en la Imprenta Egipcia (Dar al-Tiba'a al-Misriyya) en Bulaq y finalizada a principios de Sha'ban de 1271 AH, cotejada con la firma del autor, excepto la última parte, con la anotación al-Durr al-Mukhtar en el margen. Abarca desde el Libro de las Ventas hasta el Libro de los Regalos; el volumen 5 comienza con el Libro de los Alquileres. Procedente del escaneo de la Biblioteca de Alejandría en archive.org (elemento AAlexandrina-147484, 530 páginas)."
  fr: "Le volume 4 de la glose d'Ibn Abidin, imprimé à l'imprimerie égyptienne (Dar al-Tiba'a al-Misriyya) de Boulaq et achevé au début du mois de Sha'ban 1271 AH, est collationné avec la signature de l'auteur, à l'exception de sa dernière partie, avec une annotation d'al-Durr al-Mukhtar en marge. Il couvre la période allant du Livre des ventes au Livre des dons; le volume 5 commence avec le Livre des locations. Provenant de la numérisation de la Bibliotheca Alexandrina sur archive.org (référence AAlexandrina-147484, 530 pages)."
  ur: "ابن عابدین کی تصنیف کی جلد 4، مصری پریس ⁦(دار الطبع المصریہ)⁩ میں بلاق میں چھپی اور شعبان 1271 ہجری کے اوائل میں ختم ہوئی، مصنف کے آٹوگراف کے ساتھ اس کے آخری حصے کے علاوہ، حاشیہ میں الدر المختار کے ساتھ۔ یہ بک آف سیلز سے بک آف گفٹ تک چلتا ہے۔ والیوم 5 کرایہ کی کتاب سے شروع ہوتا ہے۔ archive.org پر Bibliotheca Alexandrina اسکین سے ⁦(آئٹم AAlexandrina-147484، 530 صفحات)⁩۔"
  tr: "İbn Abidin'in kenar notlarının dördüncü cildi, Bulak'taki Mısır Matbaası'nda basılmıştır ve 1271 Hicri başlarında Basılmış, yazarın el yazısına karşılık gelmiş, uç kısmı hariç ve kenarda Al-Dürr Al-Mukhtar metni yer almıştır. Kitap, Satış Kitabı ile başlar ve Hediyeler Kitabı ile sona erer, ardından beşinci cilt gelir ve İjarah Kitabı ile başlar. Arşivdeki Bibliotheca Alexandrina Araştırması'ndan (tanımlayıcı AAlexandrina-147484, 530 sayfa)."
  id: "Volume keempat catatan pinggir Ibn Abidi dicetak di Percetakan Mesir di Bulaq dan dicetak pada awal Sha'ban 1271 H, sesuai dengan tulisan tangan penulis kecuali di bagian akhir, dengan teks Al-Durr Al-Mukhtar di pinggir. Buku ini dimulai dengan Buku Penjualan dan diakhiri dengan Buku Hadiah, diikuti oleh volume kelima, dimulai dengan Kitab Ijarah. Dari Survei Bibliotheca Alexandrina tentang Arsip (identifikasi AAlexandrina-147484, 530 halaman)."
