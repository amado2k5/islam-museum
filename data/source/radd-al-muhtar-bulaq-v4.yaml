reliability_note: "Imprint from the colophon on PDF p. 528: printing finished at Dar al-Tiba'a al-Misriyya, Bulaq, early Sha'ban 1271 AH; the corrector signs as Muhammad Qitta al-Adawi (the OCR reads the name as «قملة», read here as «قطة»); the volume was collated with the author's hand except its end, from quire 91, which was corrected from a faulty copy taken from a copy without the marginal notes. The same page carries a note by the author's son Ala' al-Din, dated Wednesday 25 Safar 1260 AH, that the last notes are what he found on his father's copy. The Gregorian year 1855 in `issued` is derived from 1271 AH (Sha'ban 1271 = April-May 1855). Citations give PDF page numbers of the scan; printed page = PDF page minus 7 (checked: PDF p. 300 = printed 293, PDF p. 450 = printed 443). The OCR is noisy; doubtful readings are flagged in the entities."
