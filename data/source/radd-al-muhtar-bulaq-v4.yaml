summary:
  ar: "الجزء الرابع من حاشية ابن عابدين، طُبع بدار الطباعة المصرية ببولاق وتم طبعه في أوائل شعبان سنة 1271هـ، مقابلاً على خط المؤلف إلا أواخره، ومتن الدر المختار في الهامش. يبدأ بكتاب البيوع وينتهي بكتاب الهبة، ويتلوه الجزء الخامس أوله كتاب الإجارة. من مسح مكتبة الإسكندرية على الأرشيف ⁦(المعرّف AAlexandrina-147484، 530 صفحة)⁩."
  en: "Volume 4 of Ibn Abidin's gloss, printed at the Egyptian Press (Dar al-Tiba'a al-Misriyya) at Bulaq and finished early in Sha'ban 1271 AH, collated with the author's autograph except for its last part, with al-Durr al-Mukhtar in the margin. It runs from the Book of Sales to the Book of Gifts; vol. 5 begins with the Book of Hire. From the Bibliotheca Alexandrina scan on archive.org (item AAlexandrina-147484, 530 pages)."
