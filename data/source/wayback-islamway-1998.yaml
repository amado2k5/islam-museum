summary:
  ar: "أقدم لقطة في أرشيف الإنترنت لموقع islamway.com بتاريخ 12 ديسمبر 1998، بعنوان «The Islamway Radio»: صفحتان إنجليزية وعربية فيهما نحو خمسين سورة بأصوات قراء مشهورين ومحاضرات إسلامية وصفحة للصلاة، ومكتبة قيد الإنشاء."
  en: "The earliest Internet Archive capture of islamway.com, 12 December 1998, titled 'The Islamway Radio': English and Arabic pages offering about fifty suras by well-known reciters, Islamic lectures and a prayer page, with a library under construction."
  ur: "islamway.com کی سب سے پرانی انٹرنیٹ آرکائیو تصویر، 12 دسمبر 1998، عنوان «The Islamway Radio»: انگریزی اور عربی صفحات جن میں مشہور قراء کی تقریباً پچاس سورتیں، اسلامی لیکچر اور نماز کا صفحہ تھا۔"
  es: "La primera captura de islamway.com en Internet Archive, del 12 de diciembre de 1998, titulada 'The Islamway Radio': páginas en inglés y árabe que ofrecen alrededor de cincuenta suras recitadas por conocidos recitadores, conferencias islámicas y una página de oración, con una biblioteca en construcción."
  fr: "La plus ancienne capture d'archive Internet d'islamway.com, datée du 12 décembre 1998 et intitulée « The Islamway Radio »: pages en anglais et en arabe proposant une cinquantaine de sourates récitées par des auteurs renommés, des conférences islamiques et une page de prière, avec une bibliothèque en construction."
  tr: "islamway.com web sitesi internet arşivinin en eski anlık görüntüsü, 12 Aralık 1998 tarihli \"İslam Yolu Radyosu\": ünlü şivetçiler tarafından anlatılan yaklaşık elli sureyi içeren iki İngilizce ve Arapça sayfa, İslami dersler, bir namaz sayfası ve inşaat halinde olan bir kütüphane."
  id: "Potret tertua di arsip internet situs islamway.com bertanggal 12 Desember 1998, berjudul \"The Islamway Radio\": dua halaman berbahasa Inggris dan Arab yang berisi sekitar lima puluh surah yang dinarasikan oleh para pembaca terkenal, kuliah Islam, halaman doa, dan perpustakaan yang sedang dibangun."
