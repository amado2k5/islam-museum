reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by its revision id with the returned id asserted equal. It gives his presidency as 15 September 1963 to 19 June 1965 with the predecessor field empty (a new office), his death at his family home in Algiers on 11 April 2012 and his funeral at El Alia Cemetery on 13 April. On his birth it gives the year 1916 only and warns in a note that the exact date is not known, that some sources state 1918, that his father antedated the birth by two years, and that Ben Bella himself in 2002 said he was probably born in 1916. Its infobox carries no religion field and its text names no school for him; its discussions of Islam are of his state policy and political thought."
