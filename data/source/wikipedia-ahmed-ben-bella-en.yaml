summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد بن بلة؛ تُستخدم لوقائع الكيان فقط. تروي دوره في حرب الاستقلال، ورئاسته الحكومة ثم الجمهورية (1963–1965)، وسياساته الاشتراكية العربية، وانقلاب بومدين عليه وسجنه الطويل، ووفاته في الجزائر العاصمة سنة 2012."
  en: "English Wikipedia article on Ahmed Ben Bella; used for entity facts only. It recounts his role in the war of independence, his premiership and then presidency (1963–1965), his Arab socialist policies, Boumédiène's coup against him and his long detention, and his death in Algiers in 2012."
  es: "Artículo de la Wikipedia en inglés sobre Ahmed Ben Bella; utilizado únicamente para obtener información sobre la persona. Relata su papel en la guerra de independencia, su mandato como primer ministro y posteriormente como presidente (1963-1965), sus políticas socialistas árabes, el golpe de Estado de Boumédiène en su contra y su larga detención, y su muerte en Argel en 2012."
  fr: "Article de Wikipédia en anglais sur Ahmed Ben Bella; utilisé uniquement à des fins d'information sur l'entité. Il relate son rôle dans la guerre d'indépendance, son mandat de Premier ministre puis de président (1963-1965), sa politique socialiste arabe, le coup d'État de Boumédiène contre lui et sa longue détention, ainsi que sa mort à Alger en 2012."
  ur: "احمد بین بیلا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں آزادی کی جنگ میں ان کے کردار، اس کی وزارت عظمیٰ اور پھر صدارت (1963–1965)، اس کی عرب سوشلسٹ پالیسیاں، بومیڈین کی اس کے خلاف بغاوت اور ان کی طویل نظر بندی، اور 2012 میں الجزائر میں ان کی موت کا ذکر ہے۔"
  tr: "Ahmed Ben Bella hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bağımsızlık Savaşı'ndaki rolünü, hükümeti ve ardından cumhuriyeti (1963–1965) liderliğini, Arap sosyalist politikalarını, Boumediene'nin ona karşı yaptığı darbeyi ve uzun hapis cezasını ve 2012'de Cezayir'de ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ahmed Ben Bella; hanya digunakan untuk fakta entitas. Artikel ini menceritakan perannya dalam Perang Kemerdekaan, kepemimpinannya atas pemerintahan dan kemudian republik (1963–1965), kebijakan sosialis Arabnya, kudeta Boumediene terhadapnya dan penahanannya yang panjang, serta kematiannya di Aljir pada 2012."
