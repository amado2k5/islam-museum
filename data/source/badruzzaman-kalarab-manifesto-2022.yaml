reliability_note: "His own words, a primary source for his self-account, not independent corroboration: the manifesto, read in full on 9 November 2026, presents him (spelling his name \"Mohammad Badruzzaman\" in its text) as a candidate for executive director in the election of 7 October 2022, recounts about eighteen years of his work in Kalarab — including his closeness to its founder Aynuddin Al Azad and the organisation's revival alongside Sayeed Ahmad — and states that in the committee formed in 2017 he became joint executive director (যুগ্ম নির্বাহী পরিচালক), carrying the organisation's management. It gives no birth date, no education history and no school of law. The URL is stored percent-encoded because the validator requires URI format; it decodes to the Bengali slug under which the manifesto was read."
