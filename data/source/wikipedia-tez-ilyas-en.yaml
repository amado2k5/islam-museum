reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Used for his birth name (Mohammed Tehzeeb Ilyas, from the England & Wales Civil Registration Birth Index as cited in the article), his birth on 8 April 1983 in Blackburn to a Pakistani Punjabi family from Jhelum, his biochemistry degrees at Lancaster and his civil-service career, his comedy from 2010 (TEZ Talks; The Tez O'Clock Show on Channel 4 from 2019; the role of Eight in Man Like Mobeen; the stand-up special Teztify), his 2021 book, and his marriage in 2022. The article states plainly that 'Ilyas is a Muslim' and his shows are built on his own British Muslim life, but it names no school or order for him."
