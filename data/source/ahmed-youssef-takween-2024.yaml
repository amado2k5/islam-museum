label: { en: "Ahmed Youssef: commentary on Behery's 11 May 2024 Amr Adib interview about Takween" }
summary:
  ar: "تعليق أحمد يوسف على ظهور إسلام بحيري في برنامج عمرو أديب في 11 مايو 2024 مدافعا عن مؤسسة تكوين الفكر العربي عند إطلاقها، واصفا إياها بأنها تعزز التسامح والحوار، وعلى عضويته في مجلس أمنائها المؤسس إلى جانب إبراهيم عيسى ويوسف زيدان وفراس السواح وألفت يوسف وآخرين."
  en: "Ahmed Youssef's commentary on Behery's appearance on Amr Adib's programme on 11 May 2024, defending the Takween Foundation for Arab Thought at its launch as promoting tolerance and dialogue, and on his founding trusteeship alongside Ibrahim Issa, Youssef Ziedan, Firas al-Sawwah, Olfat Youssef and others."
  es: "Comentario de Ahmed Youssef sobre la aparición de Behery en el programa de Amr Adib el 11 de mayo de 2024, defendiendo la Fundación Takween para el Pensamiento Árabe en su lanzamiento como promotora de la tolerancia y el diálogo, y sobre su papel como fideicomisario fundador junto con Ibrahim Issa, Youssef Ziedan, Firas al-Sawwah, Olfat Youssef y otros."
  fr: "Commentaire d'Ahmed Youssef sur l'apparition de Behery dans l'émission d'Amr Adib le 11 mai 2024, défendant la Fondation Takween pour la pensée arabe lors de son lancement comme promouvant la tolérance et le dialogue, et sur son rôle de membre fondateur aux côtés d'Ibrahim Issa, Youssef Ziedan, Firas al-Sawwah, Olfat Youssef et d'autres."
  ur: "احمد یوسف کی 11 مئی 2024 کو عمر ادیب کے پروگرام میں بیہری کی پیشی پر تبصرہ، تکوین فاؤنڈیشن فار عرب تھاٹ کے آغاز کے موقع پر رواداری اور مکالمے کو فروغ دینے اور ابراہیم عیسیٰ، یوسف زیدان، فراس الصوفیہ اور دیگر کے ساتھ اس کی بانی ٹرسٹی شپ کا دفاع کرنا۔"
  tr: "Ahmed Youssef'in, Islam Behairy'nin 11 Mayıs 2024'te Amr Adib'in programına katılıp Arap Düşünce Oluşumu Vakfı'nı başlatırken savunması, hoşgörüyü ve diyaloğu teşvik ettiğini ve İbrahim Issa, Youssef Zidan, Firas Al-Sawah, Olfat Youssef ve diğerleriyle birlikte kurucu yönetim kurulunda üyeliği hakkındaki yorumu."
  id: "Komentar Ahmed Youssef tentang penampilan Islam Behairy di program Amr Adib pada 11 Mei 2024, membela Yayasan Pembentukan Pemikiran Arab saat peluncurannya, menggambarkannya sebagai mempromosikan toleransi dan dialog, serta keanggotaannya di dewan pendiri bersama Ibrahim Issa, Youssef Zidan, Firas Al-Sawah, Olfat Youssef, dan lainnya."
