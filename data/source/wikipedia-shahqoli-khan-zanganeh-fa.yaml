summary:
  ar: "مقالة ويكيبيديا الفارسية عن شاهقلي خان زنگنه؛ تعطي وفاته سنة 1716 ولا تعطي سنة ولادة، وتصف إيل زنگنه بأنه من الإيلات الكردية الشيعية؛ تُستخدم لوقائع الكيان فقط."
  en: "Persian Wikipedia article on Shahqoli Khan Zanganeh; it gives his death in 1716 and no birth year, and describes the Zanganeh tribe as a Shia Kurdish tribe; used for entity facts only, each cited where the article gives its own source."
  es: "Artículo de la Wikipedia en persa sobre Shahqoli Khan Zanganeh; indica que murió en 1716 y no menciona el año de su nacimiento, y describe a la tribu Zanganeh como una tribu kurda chiíta; se utiliza únicamente para datos sobre la entidad, citados donde el artículo proporciona su propia fuente."
  fr: "Article Wikipédia persan sur Shahqoli Khan Zanganeh; il indique sa mort en 1716 et ne mentionne pas son année de naissance, et décrit la tribu Zanganeh comme une tribu kurde chiite; utilisé uniquement pour les informations sur l’entité, chaque information étant citée lorsque l’article donne sa propre source."
  ur: "شاہقولی خان زنگنہ پر فارسی ویکیپیڈیا مضمون؛ یہ 1716 میں اس کی موت اور پیدائش کا سال نہیں بتاتا ہے، اور زنگنہ قبیلے کو شیعہ کرد قبیلے کے طور پر بیان کرتا ہے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک کا حوالہ دیا جاتا ہے جہاں مضمون اپنا ماخذ دیتا ہے۔"
  tr: "Şahqali Han Zanganeh hakkında Farsça Vikipedi makalesi ölüm yılını 1716 olarak verir ancak doğum yılını vermez ve Il Zanganeh'i Şii Kürt Eilatlarından biri olarak tanımlar; bu sadece varlığın gerçekleri için kullanılır."
  id: "Artikel Wikipedia Persia tentang Shahqali Khan Zanganeh menyebutkan tahun kematiannya 1716 tetapi tidak menyebutkan tahun kelahirannya, dan menggambarkan Il Zanganeh sebagai salah satu Eilat Kurdi Syiah; hanya digunakan untuk fakta entitas tersebut."
