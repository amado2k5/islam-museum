reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Khedira as born 4 April 1987 in Stuttgart, a central midfielder who won the Bundesliga with Stuttgart (2007), the Champions League with Real Madrid (2014) and five Serie A titles with Juventus, earned 77 Germany caps and won the 2014 World Cup, retired at Hertha BSC in 2021, and now works as an assistant coach at Real Madrid. Its personal-life section states only that he was born to a Tunisian father and a German mother and that his brother Rani is also a footballer; the article's full text was searched and it makes no statement of Khedira's religion anywhere."
