reliability_note: "The person's own channel: a primary source for identity, work and reach, not independent corroboration (founder's sourcing ladder, 24 Oct 2026). The channel's own description opens 'Welcome to the official channel of Sheikh Mansour Al Salmi'; a joint-lecture upload's description lists his accounts as Snapchat mn99y, Instagram m.alsalmy1, Facebook mn99y, Twitter malsalmy2 and YouTube @sheikhmansouralsalmi, and the Instagram handle is the one Mawdoo3 reports at more than 1.5 million followers. Its best-known uploads are his own full-surah recitations of 1444 AH, among them Surah Al-Baqarah at about 16 million views, Surah Yusuf at about 3.9 million and Surah Al-Kahf at about 3.6 million at check time. The channel header's subscriber figure could not be extracted in the text check of 25 October 2026, so no subscriber figure is carried as a fact; Mawdoo3 already reported more than 15 million channel views in 2023. Checked 25 October 2026."
