reliability_note: "Read in the museum's session on 20 November 2026. A short signed-by-the-site post (the author is not named on the page). It says Lane's Arabic-English Lexicon has been unequalled since 1863, although it runs only to qaf, with roots after qaf present but not complete; that Perseus has the full text (the post says it did not check its accuracy); that the Tyndale archive has a page-by-page fully indexed scan; and that Lane's Lexicon is especially useful for literary texts. The post is a pointer with an opinion; the museum takes from it only the extent of the work and where it can be read."
