  ar: "تدوينة ٢٠١٤ في The Digital Orientalist عن مواضع قراءة معجم لين على الشبكة، اطُّلع عليها في ٢٠ نوفمبر ٢٠٢٦؛ تُستخدم لمدى الكتاب ⁦(إلى حرف القاف)⁩ ومواضعه على الشبكة."
  en: "A 2014 post of The Digital Orientalist on where Lane's Lexicon can be read online, read on 20 November 2026; used for the extent of the work (to the letter qaf) and the places it is online."
  es: "Una entrada de 2014 de The Digital Orientalist sobre dónde puede leerse en línea el léxico de Lane, consultada el 20 de noviembre de 2026; usada para la extensión de la obra (hasta la letra qaf) y los lugares donde está en línea."
  fr: "Un billet de 2014 de The Digital Orientalist sur les lieux où lire en ligne le lexique de Lane, consulté le 20 novembre 2026 ; utilisé pour l'étendue de l'ouvrage (jusqu'à la lettre qaf) et les lieux où il est en ligne."
  ur: "The Digital Orientalist کی 2014ء کی ایک تحریر کہ لین کی لغت آن لائن کہاں پڑھی جا سکتی ہے، 20 نومبر 2026 کو پڑھی؛ کتاب کی وسعت ⁦(حرف قاف تک)⁩ اور آن لائن مقامات کے لیے استعمال۔"
  tr: "The Digital Orientalist'te 2014 tarihli bir yazı, Lean Sözlüğü'nün çevrimiçi okunabileceği yerler hakkında, 20 Kasım 2026'da erişildi; kitabın kapsamı (Qaf harfine kadar) ve web'deki yerleşimleri için kullanıldı."
  id: "Sebuah postingan tahun 2014 di The Digital Orientalist tentang tempat-tempat membaca Lean Dictionary secara online, diakses pada 20 November 2026; digunakan untuk jangkauan buku (hingga huruf Qaf) dan penempatannya di web."
