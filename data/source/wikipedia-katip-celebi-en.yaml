reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A long article resting chiefly on Geoffrey L. Lewis's The Balance of Truth (1957), Piterberg (2003) and Shefer-Mossensohn (2015). It gives his birth at Istanbul in February 1609 (Dhu'l-Qa'da 1017 AH), his clerkship and campaigns, the 1633 Hajj, the 1645 inheritance that freed him for scholarship, and the full works list, Kashf al-Zunun first. Its infobox gives his death as 26 September 1657, against the Turkish article's and Wikidata's 6 October 1657; both readings are preserved in the person record. Its infobox religion fields (Sunni, Hanafi) are structured filings and are not relied on for faith — the settlement rests on the prose of the Arabic article and the TDV entry, which quote his own self-description. Checked 1 November 2026."
