  ar: مقالة ويكيبيديا الإنجليزية عن محمد طاهر القادري؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في جهنغ في 19 فبراير 1951، وتأسيسه منهاج القرآن العالمية (1980) والحركة الشعبية الباكستانية (1989)، وسنواته في الجمعية الوطنية، وانتقاله إلى كندا (2005)، وفتواه ضد الإرهاب (2010).
  en: English Wikipedia article on Muhammad Tahir-ul-Qadri; used for entity facts only. It gives his birth in Jhang on 19 February 1951, his founding of Minhaj-ul-Quran International (1980) and the Pakistan Awami Tehreek (1989), his years in the National Assembly, his move to Canada (2005), and his 2010 Fatwa on Terrorism.
  es: "Artículo de la Wikipedia en inglés sobre Muhammad Tahir-ul-Qadri; utilizado únicamente para datos sobre la persona. En él se menciona su nacimiento en Jhang el 19 de febrero de 1951, la fundación de Minhaj-ul-Quran International (1980) y del Pakistan Awami Tehreek (1989), sus años en la Asamblea Nacional, su traslado a Canadá (2005) y su fatwa de 2010 sobre el terrorismo."
  fr: "Article de Wikipédia en anglais sur Muhammad Tahir-ul-Qadri; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance à Jhang le 19 février 1951, la fondation de Minhaj-ul-Quran International (1980) et du Pakistan Awami Tehreek (1989), ses années à l’Assemblée nationale, son départ pour le Canada (2005) et sa fatwa de 2010 sur le terrorisme."
  ur: "محمد طاہر القادری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 19 فروری 1951 کو جھنگ میں ان کی پیدائش، منہاج القرآن انٹرنیشنل (1980) اور پاکستان عوامی تحریک (1989) کی بنیاد، قومی اسمبلی میں ان کے سال، کینیڈا منتقل (2005) اور دہشت گردی پر ان کا 2010 کا فتویٰ۔"
  tr: "Muhammed Tahir el-Kadri hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bu makale, 19 Şubat 1951'de Jhang'da doğmasını, Uluslararası Kur'an Müfredatını (1980) ve Pakistan Halk Hareketi'ni (1989) kurmasını, Ulusal Meclis'teki yıllarını, Kanada'ya taşınmasını (2005) ve terörizme karşı fetvasını (2010) anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad Tahir al-Qadri; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Jhang pada 19 Februari 1951, pendirian Kurikulum Al-Qur'an Internasional (1980) dan Gerakan Rakyat Pakistan (1989), tahun-tahun di Majelis Nasional, kepindahannya ke Kanada (2005), dan fatwa melawan terorisme (2010)."
