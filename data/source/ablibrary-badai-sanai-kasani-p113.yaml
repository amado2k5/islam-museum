  ar: "صفحة وردت في ملخص بحثي قُدِّم إلى المتحف واعتمده المؤسس في 21 نوفمبر 2026؛ لم تُفتح الصفحة، وأرقام الصفحات المذكورة هي ما في الملخص ولم يُتحقق منها. ناشرها: Ahl al-Bayt Digital Islamic Library. يُستند إليها في: أحكام قراءة القرآن بغير العربية في الصلاة عند المذاهب؛ هل الترجمة قرآن، وحكم مسّها."
  en: "A page listed in a research summary supplied to the museum and approved by the founder on 21 November 2026; the page was not opened, and any page numbers are the summary's and unchecked. Publisher: Ahl al-Bayt Digital Islamic Library. Used for: the positions on reciting the Qur'an in a non-Arabic language in prayer; whether a translation counts as the Qur'an and the rule on touching it."
  ur: "ایک صفحہ جو عجائب گھر کو دیے گئے تحقیقی خلاصے میں مذکور ہے اور جسے بانی نے 21 نومبر 2026 کو منظور کیا؛ صفحہ کھولا نہیں گیا، اور صفحات کے نمبر خلاصے کے ہیں اور جانچے نہیں گئے۔ ناشر: Ahl al-Bayt Digital Islamic Library۔ اس سے استناد ان امور کے لیے ہے: نماز میں قرآن کو غیر عربی میں پڑھنے کے بارے میں مذاہب کے اقوال؛ کیا ترجمہ قرآن شمار ہوتا ہے اور اسے چھونے کا حکم۔"
  fr: "Page citée dans un résumé de recherche remis au musée et approuvé par le fondateur le 21 novembre 2026 ; la page n'a pas été ouverte, et les numéros de page sont ceux du résumé, non vérifiés. Éditeur : Ahl al-Bayt Digital Islamic Library. Utilisée pour : les positions sur la récitation du Coran dans une langue autre que l'arabe dans la prière; la question de savoir si une traduction est le Coran et la règle sur son toucher."
  es: "Página citada en un resumen de investigación entregado al museo y aprobado por el fundador el 21 de noviembre de 2026; la página no se abrió, y los números de página son los del resumen, sin comprobar. Editor: Ahl al-Bayt Digital Islamic Library. Usada para: las posiciones sobre recitar el Corán en una lengua distinta del árabe en la oración; si una traducción cuenta como el Corán y la regla sobre tocarla."
