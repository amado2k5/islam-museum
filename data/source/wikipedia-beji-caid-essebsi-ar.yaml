summary:
  ar: "مقالة ويكيبيديا العربية عن الباجي قائد السبسي؛ تُستخدم لوقائع الكيان فقط. تؤكد خلافته للمرزوقي في الرئاسة ووفاته سنة 2019، وتنقل الجدل حول مقترحه في المساواة في الميراث، ويذكر صندوق معلوماتها دينه «الإسلام» بصورة عامة."
  en: "Arabic Wikipedia article on Beji Caid Essebsi; used for entity facts only. It confirms his succession to Marzouki as president and his death in 2019, and reports the controversy over his inheritance-equality proposal; its infobox gives his religion as Islam in general."
  es: "Artículo de Wikipedia en árabe sobre Beji Caid Essebsi; utilizado únicamente para datos sobre la persona. Confirma su sucesión a Marzouki como presidente y su fallecimiento en 2019, e informa sobre la controversia en torno a su propuesta de igualdad de herencia; su ficha informativa indica que profesaba el islam en general."
  fr: "Article Wikipédia en arabe sur Béji Caïd Essebsi; utilisé uniquement pour les informations le concernant. Il confirme sa succession à Marzouki à la présidence et son décès en 2019, et relate la controverse autour de sa proposition d’égalité successorale; son infobox indique qu’il était musulman."
  ur: "Beji Caid Essebsi پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ مارزوکی کے صدر کے طور پر ان کی جانشینی اور 2019 میں ان کی موت کی تصدیق کرتا ہے، اور ان کی وراثت کی مساوات کی تجویز پر تنازعہ کی اطلاع دیتا ہے۔ اس کا انفو باکس اس کا مذہب عام طور پر اسلام کے طور پر دیتا ہے۔"
  tr: "Beji Caid Essebsi hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Marzouki'nin başkanlıkta halefliğini ve 2019'daki ölümünü doğrular; mirasta eşitlik önerisi üzerine yaptığı tartışma ise genel olarak dininin \"İslam\" olarak belirtildiği bilgi kutusunda belirtilir."
  id: "Artikel Wikipedia berbahasa Arab tentang Beji Caid Essebsi hanya digunakan untuk fakta entitas tersebut. Ia mengonfirmasi suksesinya sebagai presiden Marzouki dan kematiannya pada 2019, dan perdebatan tentang usulannya untuk kesetaraan warisan disebutkan, dengan infobox yang menyebutkan agamanya sebagai \"Islam\" secara umum."
