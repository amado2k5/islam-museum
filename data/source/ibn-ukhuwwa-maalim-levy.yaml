summary:
  ar: "طبعة روبن ليفي لكتاب «معالم القربة في أحكام الحسبة» لضياء الدين محمد بن محمد القرشي الشافعي المعروف بابن الأخوة، وهو دليل حسبة من القرن الثامن الهجري يرتّب قواعد ضبط السوق في سبعين باباً حرفةً حرفة: الطحّانين والصيادلة والقصّارين والحجّامين والزيّاتين والحصّارين والنجّارين والبنّائين وغيرهم، مع خلاصة إنجليزية لمحتوياته."
  en: "Reuben Levy's edition of the Ma'alim al-Qurba fi Ahkam al-Hisba of Diya' al-Din Muhammad b. Muhammad al-Qurashi al-Shafi'i, known as Ibn al-Ukhuwwa, an eighth-century hijri hisba manual that arranges market-inspection rules in seventy chapters trade by trade: millers, druggists, fullers, phlebotomists and cuppers, oil-pressers, reed-mat makers, carpenters, sawyers, builders and more, with an English abstract of its contents."
  ur: "روبن لیوی کی تدوین کردہ «معالم القربۃ فی احکام الحسبہ» از ضیاء الدین محمد بن محمد قریشی شافعی المعروف ابن الاخوہ، آٹھویں صدی ہجری کی حسبہ دستورالعمل ہے جو بازار کی نگرانی کے اصول ستر ابواب میں پیشہ ور پیشہ بیان کرتی ہے: چکی والے، عطار، دھوبی، فصد کھولنے والے اور حجام، تیل کولھو کرنے والے، چٹائی بُننے والے، بڑھئی، آری کش اور مِستری وغیرہ، مع اندراجات کا انگریزی خلاصہ۔"
  es: "Edición de Reuben Levy del Ma'alim al-Qurba fi Ahkam al-Hisba de Diya' al-Din Muhammad b. Muhammad al-Qurashi al-Shafi'i, conocido como Ibn al-Ukhuwwa, un manual de inspección de mercado del siglo VIII de la Hégira que organiza las reglas de inspección de mercado en setenta capítulos, oficio por oficio: molineros, farmacéuticos, bataneros, flebotomistas y cuproneros, prensadores de aceite, fabricantes de esteras de junco, carpinteros, aserradores, constructores y más, con un resumen en inglés de su contenido."
  fr: "L'édition de Reuben Levy du Ma'alim al-Qurba fi Ahkam al-Hisba de Diya' al-Din Muhammad b. Muhammad al-Qurashi al-Shafi'i, connu sous le nom d'Ibn al-Ukhuwwa, un manuel hisba du VIIIe siècle de l'Hégire qui organise les règles d'inspection des marchés en soixante-dix chapitres, métier par métier: meuniers, apothicaires, foulons, phlébotomistes et cupores, presseurs d'huile, fabricants de nattes de roseau, charpentiers, scieurs, constructeurs et plus encore, avec un résumé en anglais de son contenu."
  tr: "Robin Levy'nin, Diya' al-Din Muhammad ibn Muhammad al-Qurashi al-Shafi'i tarafından yazılmış 'Hisbah Hükümlerinde Yakınlık Simgeleri' adlı kitabının baskısı, İbn al-Ikhwa olarak bilinir. Bu kitap, sekizinci yüzyıl Hicri Yılına ait bir hisbah el kitabıdır ve piyasa düzenleme kurallarını yetmiş bölüme ayırır: değirmenciler, eczacılar, kasaplar, kuaförler, zeytindükkanlar, kasaplar, marangozlar, inşaatçılar ve diğerleri; ayrıca içeriğinin İngilizce özetini içerir."
  id: "Edisi Robin Levy dari buku 'Landmarks of Closeness in the Rulings of Hisbah' oleh Diya' al-Din Muhammad ibn Muhammad al-Qurashi al-Shafi'i, yang dikenal sebagai Ibn al-Ikhwa. Ini adalah buku panduan hisbah dari abad kedelapan AH yang mengatur aturan regulasi pasar menjadi tujuh puluh bab: penggiling, apoteker, tukang daging, penata rambut, toko zaitun, tukang daging, tukang kayu, tukang bangunan, dan lainnya, beserta ringkasan isi dalam bahasa Inggris."
