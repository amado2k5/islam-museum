reliability_note: "Read on 1 November 2026 in the web edition, the Kallek section (the page's first part; the second part by Mustafa Çağrıcı on trade ethics is listed on the page but not used for any fact in this record). The printed range pp. 134–144 is the one the page prints; the record cites that range for each fact and does not claim a narrower page within it. Read: the definition and etymology, the Qur'anic and hadith material on trade as the entry gives it, the forbidden transactions, Mecca's trade, the three periods of trade history as far as the Abbasid and Mediterranean sections, the al-Dimashqi classification and the sections on European privileges and the Ottoman period up to the 16th century. Not read in full: the late-Ottoman and modern sections, the bibliography's classical works (al-Dimashqi's al-Isharah, al-Maqdisi's Ahsan al-taqasim, al-Mawardi's Tashil al-nazar, Ibn Khaldun) and the EI2 articles the entry cites; those works are not cited as sources here."
