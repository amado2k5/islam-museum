summary:
  ar: "مدخل «تجارة» في موسوعة TDV الإسلامية التركية بقلم جنكيز كالّك (المجلد 41، إسطنبول 2012، ص 134–144)، ويتناول تعريف التجارة وصفة التاجر، وأخلاقها وتحريم المعاملات المحرّمة، وتاريخها من الجاهلية إلى العهد العثماني، والامتيازات التجارية، وتصنيف الدمشقي للتجار."
  en: "The TDV İslâm Ansiklopedisi entry 'Ticaret' (trade) by Cengiz Kallek (vol. 41, Istanbul 2012, pp. 134–144). It covers the definition of trade and of the merchant, the ethics of trade and the transactions it forbids, its history from pre-Islamic Mecca to the Ottoman period, commercial privileges, and al-Dimashqi's classification of merchants."
title: "TİCARET"
