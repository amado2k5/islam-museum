summary:
  ar: "مقالة ويكيبيديا الفرنسية عن لاتير ديور نغوني لاتير ديوب ⁦(لات ديور)⁩، المولود سنة 1842 في كور أمادو يالا والمتوفى في 26 أكتوبر 1886 في معركة ديخيلي، دامل كايور ⁦(1861-1863 ثم 1871-1883)⁩ وأحد أكبر مقاومي التغلغل الاستعماري الفرنسي في السنغال؛ تروي أصوله، ونفيه إلى سالوم واعتناقه الإسلام على شرط المرابط مابا دياخو با واتخاذه اسم سيلماخا ديوب، وعودته وحروبه ضد الفرنسيين ومعارضته سكة الحديد، وموته في المعارك."
  en: "French Wikipedia article on Latyr Dior Ngoné Latyr Diop (Lat Dior), born in 1842 at Keur Amadou Yalla and killed on 26 October 1886 at the battle of Dékheulé, damel of Cayor (1861–1863, then 1871–1883) and one of the greatest opponents of French colonial penetration in Senegal; it recounts his origins, his exile in Saloum and conversion to Islam as the marabout Maba Diakhou Ba's condition for help, taking the name Silmakha Diop, his return, his wars against the French and opposition to the railway, and his death in battle."
  es: "Artículo de la Wikipedia en francés sobre Latyr Dior Ngoné Latyr Diop (Lat Dior), nacido en 1842 en Keur Amadou Yalla y muerto el 26 de octubre de 1886 en la batalla de Dékheulé, dama de Cayor (1861-1863, luego 1871-1883) y uno de los mayores opositores a la penetración colonial francesa en Senegal; relata sus orígenes, su exilio en Saloum y su conversión al Islam como condición del marabú Maba Diakhou Ba para obtener ayuda, adoptando el nombre de Silmakha Diop, su regreso, sus guerras contra los franceses y su oposición al ferrocarril, y su muerte en batalla."
  fr: "L'article de Wikipédia en français sur Latyr Dior Ngoné Latyr Diop (Lat Dior), né en 1842 à Keur Amadou Yalla et tué le 26 octobre 1886 à la bataille de Dékheulé, damel de Cayor (1861-1863, puis 1871-1883) et l'un des plus grands opposants à la pénétration coloniale française au Sénégal; il relate ses origines, son exil à Saloum et sa conversion à l'islam comme condition pour l'aide du marabout Maba Diakhou Ba, prenant le nom de Silmakha Diop, son retour, ses guerres contre les Français et son opposition au chemin de fer, et sa mort au combat."
  ur: "Latyr Dior Ngoné Latyr Diop (Lat Dior) پر فرانسیسی ویکیپیڈیا کا مضمون، 1842 میں Keur Amadou Yalla میں پیدا ہوا اور 26 اکتوبر 1886 کو Dékheulé کی لڑائی میں مارا گیا، Damel of Cayor ⁦(1861–1863، پھر 1871–1883)⁩ اور فرانسیسی حریفوں کے سب سے بڑے مخالفین میں سے ایک۔ اس میں اس کی اصلیت، سلوم میں اس کی جلاوطنی اور اسلام قبول کرنے کے بارے میں بتایا گیا ہے کہ وہ مدد کے لیے ماراباؤٹ مابا دیاخو با کی حالت، سلماکھا ڈیوپ کا نام لینا، اس کی واپسی، فرانس کے خلاف اس کی جنگیں اور ریلوے کی مخالفت، اور جنگ میں اس کی موت۔"
  tr: "Latre Dior Ngoni hakkında Fransızca Wikipedia makalesi Latre Diop (Latte Dior), 1842'de Cour Amadou Yala'da doğmuş ve 26 Ekim 1886'da Dikheli Muharebesi'nde ölmüştür. Damel Cayor (1861-1863 ve ardından 1871-1883) ile Senegal'deki Fransız sömürge sızmasına karşı en büyük direnişçilerden biridir; kökenlerini, Salom'a sürgün, Murabid Maba Diajo Ba şartıyla İslam'a geçmesi, Selmakha Diop adını alma, dönüşü ve Fransızlara karşı savaşları, demiryoluna karşı direnişi ve savaşta ölmesini anlatır."
  id: "Artikel Wikipedia Prancis tentang Latre Dior Ngoni Latre Diop (Latte Dior), lahir pada tahun 1842 di Cour Amadou Yala dan meninggal pada 26 Oktober 1886 dalam Pertempuran Dikheli, Damel Cayor (1861-1863 dan kemudian 1871-1883) dan salah satu penentang terbesar infiltrasi kolonial Prancis di Senegal; artikel ini menceritakan asal-usulnya, pengasingan ke Salom, konversi ke Islam dengan syarat Murabid Maba Diajo Ba, mengambil nama Selmakha Diop, kepulangannya dan perang melawan Prancis, penentangan terhadap kereta api, serta kematiannya dalam pertempuran."
