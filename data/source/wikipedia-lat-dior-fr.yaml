summary:
  ar: "مقالة ويكيبيديا الفرنسية عن لاتير ديور نغوني لاتير ديوب (لات ديور)، المولود سنة 1842 في كور أمادو يالا والمتوفى في 26 أكتوبر 1886 في معركة ديخيلي، دامل كايور (1861-1863 ثم 1871-1883) وأحد أكبر مقاومي التغلغل الاستعماري الفرنسي في السنغال؛ تروي أصوله، ونفيه إلى سالوم واعتناقه الإسلام على شرط المرابط مابا دياخو با واتخاذه اسم سيلماخا ديوب، وعودته وحروبه ضد الفرنسيين ومعارضته سكة الحديد، وموته في المعارك."
  en: "French Wikipedia article on Latyr Dior Ngoné Latyr Diop (Lat Dior), born in 1842 at Keur Amadou Yalla and killed on 26 October 1886 at the battle of Dékheulé, damel of Cayor (1861–1863, then 1871–1883) and one of the greatest opponents of French colonial penetration in Senegal; it recounts his origins, his exile in Saloum and conversion to Islam as the marabout Maba Diakhou Ba's condition for help, taking the name Silmakha Diop, his return, his wars against the French and opposition to the railway, and his death in battle."
