  ar: "مقالة ويكيبيديا الأردية المفصّلة عن محمد خدابنده أولجايتو؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1280 ووفاته في 16 ديسمبر 1316، وتوثّق تعمّده باسم نيكوليا، واعتناقه الإسلام وتسمّيه محمدًا، وتلقّبه بغياث الدين عند اعتلائه العرش سنة 1304."
  en: "Detailed Urdu Wikipedia article on Muhammad Khodabandeh Öljaitü; used for entity facts only. It gives his birth in 1280 and his death on 16 December 1316, and documents his baptism with the name Nikolya, his conversion to Islam and adoption of the name Muhammad, and his regnal title Ghiyath al-Din on his accession in 1304."
