summary:
  ar: "مقالة ويكيبيديا الأردية المفصّلة عن محمد خدابنده أولجايتو؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1280 ووفاته في 16 ديسمبر 1316، وتوثّق تعمّده باسم نيكوليا، واعتناقه الإسلام وتسمّيه محمدًا، وتلقّبه بغياث الدين عند اعتلائه العرش سنة 1304."
  en: "Detailed Urdu Wikipedia article on Muhammad Khodabandeh Öljaitü; used for entity facts only. It gives his birth in 1280 and his death on 16 December 1316, and documents his baptism with the name Nikolya, his conversion to Islam and adoption of the name Muhammad, and his regnal title Ghiyath al-Din on his accession in 1304."
  es: "Artículo detallado de Wikipedia en urdu sobre Muhammad Khodabandeh Öljaitü; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1280 y su muerte el 16 de diciembre de 1316, y documenta su bautismo con el nombre de Nikolya, su conversión al islam y la adopción del nombre Muhammad, así como su título real de Ghiyath al-Din al ascender al trono en 1304."
  fr: "Article détaillé de Wikipédia en ourdou sur Muhammad Khodabandeh Öljaitü; utilisé uniquement pour les informations biographiques. Il indique sa naissance en 1280 et sa mort le 16 décembre 1316, et documente son baptême sous le nom de Nikolya, sa conversion à l’islam et l’adoption du nom de Muhammad, ainsi que son titre de règne Ghiyath al-Din lors de son accession au trône en 1304."
  ur: "اردو ویکیپیڈیا پر تفصیلی مضمون محمد خدابندہ Öljaitü; صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1280 میں اس کی پیدائش اور 16 دسمبر 1316 کو اس کی موت کا ذکر کرتا ہے، اور نیکولیا کے نام سے اس کے بپتسمہ، اس کے اسلام قبول کرنے اور محمد نام کو اپنانے، اور 1304 میں اس کے الحاق پر اس کا باقاعدہ لقب غیاث الدین کا دستاویز کرتا ہے۔"
