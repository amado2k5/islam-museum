summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن اللواء عباس كامل ⁦(وُلد سنة 1957)⁩، مدير المخابرات العامة المصرية (2018–2024) ومستشار رئيس الجمهورية منسق الأجهزة الأمنية منذ 2024؛ تذكر تخرجه في الكلية الحربية 1978 وخدمته في المدرعات ومديرية مكتب الرئيس السيسي."
  en: "English Wikipedia article on Major General Abbas Kamel (born 1957), director of Egypt's General Intelligence Directorate (2018-2024) and since 2024 a presidential adviser coordinating the security apparatuses; it records his 1978 Military College graduation, his armoured-corps service and his directorship of President el-Sisi's office."
  es: "Artículo de la Wikipedia en inglés sobre el mayor general Abbas Kamel (nacido en 1957), director de la Dirección General de Inteligencia de Egipto (2018-2024) y desde 2024 asesor presidencial que coordina los aparatos de seguridad; en él se recoge su graduación en la Academia Militar en 1978, su servicio en el cuerpo blindado y su cargo como director de la oficina del presidente El-Sisi."
  fr: "Article de Wikipédia en anglais sur le major-général Abbas Kamel (né en 1957), directeur de la Direction générale du renseignement égyptien (2018-2024) et, depuis 2024, conseiller présidentiel chargé de coordonner les appareils de sécurité; il relate sa remise de diplôme de l'école militaire en 1978, son service dans les blindés et sa direction du bureau du président el-Sisi."
  ur: "میجر جنرل عباس کامل ⁦(پیدائش 1957)⁩، مصر کے جنرل انٹیلی جنس ڈائریکٹوریٹ (2024-2018) کے ڈائریکٹر اور 2024 سے سیکیورٹی آلات کو مربوط کرنے والے صدارتی مشیر پر انگریزی ویکیپیڈیا کا مضمون؛ اس میں ان کی 1978 کے ملٹری کالج کی گریجویشن، ان کی بکتر بند کور سروس اور صدر السیسی کے دفتر کی ان کی ڈائریکٹر شپ کو ریکارڈ کیا گیا ہے۔"
  tr: "Mısır Genel İstihbarat Direktörü (2018–2024) ve 2024'ten beri Cumhurbaşkanı Danışmanı ile Güvenlik Kurumları Koordinatörü olan Tümgeneral Abbas Kamel (d. 1957) hakkında İngilizce Wikipedia makalesi; 1978'de Askeri Akademi'den mezun olmasından ve zırhlı araçlarda ve Cumhurbaşkanı El-Sisi'nin ofisindeki hizmetinden bahsedilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Mayor Jenderal Abbas Kamel (lahir 1957), Direktur Intelijen Umum Mesir (2018–2024) dan Penasihat Presiden Republik serta Koordinator Badan Keamanan sejak 2024; artikel tersebut menyebutkan kelulusannya dari Akademi Militer pada tahun 1978 dan pelayanannya di kendaraan lapis baja serta kantor Direktorat Presiden El-Sisi."
