summary:
  ar: "صفحة الفنان «حلال بيتس» في «شازام»، وتعكس بيانات صفحة الفنان في «آبل ميوزك»؛ تذكر أن موطنه هارو في لندن بإنجلترا، وتعرض إصداراته، وتسند تأليف أغانيه إلى عمر حاجي فالو."
  en: "The Shazam artist page for Halal Beats, mirroring Apple Music's artist data: it gives his hometown as Harrow, London, England, lists his releases, and credits his songs to the composer Umar Haji Valu."
  es: "La página de artista de Shazam para Halal Beats, que reproduce los datos de artista de Apple Music, indica que su ciudad natal es Harrow, Londres, Inglaterra, enumera sus lanzamientos y atribuye sus canciones al compositor Umar Haji Valu."
  fr: "La page artiste Shazam de Halal Beats, qui reflète les données d'artiste d'Apple Music: elle indique que sa ville natale est Harrow, Londres, Angleterre, liste ses sorties et attribue ses chansons au compositeur Umar Haji Valu."
  ur: "حلال بیٹس کے لیے شازم آرٹسٹ کا صفحہ، ایپل میوزک کے آرٹسٹ ڈیٹا کی عکس بندی کرتا ہے: یہ اس کا آبائی شہر ہیرو، لندن، انگلینڈ دیتا ہے، اس کی ریلیز کی فہرست دیتا ہے، اور اس کے گانوں کا کریڈٹ موسیقار عمر حاجی والو کو دیتا ہے۔"
  tr: "'Shazam'daki sanatçı 'Halal Beats' sayfası, sanatçının 'Apple Music' sayfasının detaylarını yansıtıyor; memleketinin Londra, İngiltere'deki Harrow olduğu ve albümlerinin sergilendiği, şarkı yazarlığının ise Omar Haji Falu'ya atfedildiği belirtiliyor."
  id: "Halaman artis 'Halal Beats' di 'Shazam' mencerminkan detail halaman artis di 'Apple Music'; disebutkan bahwa kampung halamannya adalah Harrow di London, Inggris, dan rilisan-rilisannya dipamerkan, dengan penulisan lagu dikreditkan kepada Omar Haji Falu."
