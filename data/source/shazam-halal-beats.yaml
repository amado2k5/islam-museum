reliability_note: "Shazam (Apple) artist page for Halal Beats, checked 25 October 2026, mirroring the Apple Music artist entry (artist ID 1551088433) that his own channel links to. It gives the artist's hometown as Harrow, London, England, carries Apple's 'in the artist's words' text in which he recalls recreating film soundtracks on a tiny keyboard as a child, and credits songs such as 'Where You Are (Vocal and Drum)' as written by Umar Haji Valu; streaming credits elsewhere (for example Qobuz, for the 2022 single 'My Hijab') likewise name 'Umar Haji Valu' as composer. A platform artist page: used for identity, credits and background, not as corroboration of his own channel."
