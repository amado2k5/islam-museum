summary:
  ar: "مقالة ويكيبيديا العربية عن علاء الدين رعاية شاه القهار، ثالث سلاطين آتشيه وابن علي مغيات شاه الثاني؛ مقدمتها تؤرخ وفاته بـ29 سبتمبر 1571 وقسم وفاتها بـ28 سبتمبر عن نقش القبر."
  en: "Arabic Wikipedia article on Alauddin Ri'ayat Syah al-Qahhar, third sultan of Aceh and second son of Ali Mughayat Syah; its lead dates his death 29 September 1571 but its death section gives 28 September from the grave inscription."
  es: "Artículo de Wikipedia en árabe sobre Alauddin Ri'ayat Syah al-Qahhar, tercer sultán de Aceh y segundo hijo de Ali Mughayat Syah; su introducción fecha su muerte el 29 de septiembre de 1571, pero su sección sobre su muerte indica el 28 de septiembre según la inscripción de la tumba."
  fr: "Article de Wikipédia en arabe sur Alauddin Ri'ayat Syah al-Qahhar, troisième sultan d'Aceh et deuxième fils d'Ali Mughayat Syah; son introduction date sa mort du 29 septembre 1571, mais sa section sur la mort donne le 28 septembre d'après l'inscription funéraire."
  ur: "عربی ویکیپیڈیا مضمون علاؤالدین ریاض صیح القہار، آچے کے تیسرے سلطان اور علی مغیث صیح کے دوسرے بیٹے پر؛ اس کا لیڈ اس کی موت کی تاریخ 29 ستمبر 1571 ہے لیکن اس کا موت کا حصہ قبر کے نوشتہ سے 28 ستمبر دیتا ہے۔"
  tr: "Arapça Vikipedi makalesi, Aceh'in üçüncü sultanı ve Ali Maghyat Şah II'nin oğlu Aladdin Ra'ayat Şah el-Kahar hakkında; girişinde ölümünü 29 Eylül 1571'e tarihlendirir ve 28 Eylül bölümü mezar yazıtına dayanmaktadır."
  id: "Artikel Wikipedia berbahasa Arab tentang Aladdin Ra'ayat Shah al-Qahar, Sultan ketiga Aceh dan putra Ali Maghyat Shah II; pengenalannya mencatat kematiannya pada 29 September 1571, dan bagian pada 28 September didasarkan pada prasasti makam."
