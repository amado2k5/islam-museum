  ar: "مقالة ويكيبيديا الإنجليزية عن محمود خواجه بهبودي (20 يناير 1875 – 25 مارس 1919)، الكاتب والناشر الجديدي الأوزبكي وقاضي سمرقند؛ تُستخدم لوقائع الكيان فقط. تتناول تعليمه في المدرسة ومجلته «آيينه» وصحيفته «سمرقند» وأول مسرحية عصرية في آسيا الوسطى «بادركوش» ومكتبته واعتقاله وإعدامه في قرشي سنة 1919."
  en: "English Wikipedia article on Mahmud Khoja Behbudiy (20 January 1875 – 25 March 1919), the Uzbek Jadid writer, publisher and Samarkand qadi; used for entity facts only. It covers his madrasa education, his magazine Ayina and newspaper Samarkand, the first modern Central Asian play Padarkush, his library, and his arrest and execution at Qarshi in 1919."
