  ar: "مقالة ويكيبيديا العربية عن معاوية ولد سيدي أحمد الطايع؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته سنة 1941 في أطار ورئاسته البلاد طويلا وإقامته في الدوحة وصدامه مع التيار الإسلامي. حقل الدين في صندوق معلوماتها فارغ؛ وتصنّفه في «المسلمين السنّة الموريتانيين» و«المسلمين الموريتانيين»."
