summary:
  ar: "مقالة ويكيبيديا العربية عن معاوية ولد سيدي أحمد الطايع؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته سنة 1941 في أطار ورئاسته البلاد طويلا وإقامته في الدوحة وصدامه مع التيار الإسلامي. حقل الدين في صندوق معلوماتها فارغ؛ وتصنّفه في «المسلمين السنّة الموريتانيين» و«المسلمين الموريتانيين»."
  en: "Arabic Wikipedia article on Maaouya Ould Sid'Ahmed Taya; used for entity facts only. It gives his birth in 1941 at Atar, his long presidency, his residence in Doha, and his clashes with the Islamist current. The religion field of its infobox is blank; it files him under Mauritanian Sunni Muslims and Mauritanian Muslims."
  es: "Artículo de Wikipedia en árabe sobre Maaouya Ould Sid'Ahmed Taya; utilizado únicamente para datos sobre la persona. Menciona su nacimiento en 1941 en Atar, su larga presidencia, su residencia en Doha y sus enfrentamientos con la corriente islamista. El campo de religión de su ficha informativa está en blanco; lo clasifica como musulmán sunita mauritano y musulmán mauritano."
  fr: "Article Wikipédia en arabe sur Maaouya Ould Sid'Ahmed Taya; utilisé uniquement pour les informations sur l'entité. Il mentionne sa naissance en 1941 à Atar, sa longue présidence, sa résidence à Doha et ses affrontements avec le courant islamiste. Le champ « religion » de son infobox est vide; il est classé dans les catégories « Musulmans sunnites mauritaniens » et « Musulmans mauritaniens »."
  ur: "معاویہ اولد سید احمد تایا پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1941 میں عطار میں ان کی پیدائش، ان کی طویل صدارت، دوحہ میں ان کی رہائش گاہ، اور اسلام پسند موجودہ کے ساتھ ان کی جھڑپیں ہیں۔ اس کے معلوماتی خانے کا مذہب خالی ہے۔ یہ اسے موریطانیہ کے سنی مسلمانوں اور موریطانیائی مسلمانوں کے تحت فائل کرتا ہے۔"
