reliability_note: "A short stub. Read on 27 October 2026 at the recorded revision. It gives her full name as أسماء جهانجير جيلاني, born 27 January 1952 at Lahore, LLB from the University of the Punjab, imprisoned in the 1980s for pro-democracy activity, UN Special Rapporteur on freedom of belief 2004–2010 and later on human rights in Iran, died 11 February 2018 in hospital at Lahore of a stroke causing a brain haemorrhage, aged 66. Its person infobox template carries no religion value and its text makes no statement of her religion; its categories file her by profession and as Pashtun, not by faith."
