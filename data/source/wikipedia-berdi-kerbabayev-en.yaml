summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بيردي كيرباباييف؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 3 مارس 1894 في قرية كوفكي زيرين بمقاطعة تيجين، ودراسته في مدرسة ببخارى، وخدمته القصيرة في حركة البسمجية ثم انضمامه إلى البلاشفة سنة 1919، وتحريره صحيفة «تركمانستان» ومجلة «توكماك» في العشرينيات، وروايته «الخطوة الحاسمة» الحائزة جائزة الدولة للاتحاد السوفيتي سنة 1948، و«نيبيط داغ» سنة 1957، ووفاته في عشق آباد في 3 مارس 1974. ولا تذكر المقالة أي انتماء ديني له."
  en: "English Wikipedia article on Berdi Kerbabayev; used for entity facts only. It gives his birth on 3 March 1894 at the village of Kowki-Zeren in the Tejen District, his schooling at a Bukhara madrasa, his brief service in the Basmachi movement and his joining the Bolsheviks in 1919, his editorship of the newspaper Turkmenistan and the journal Tokmak in the 1920s, his novel The Decisive Step (USSR State Prize, 1948) and Nebit Dag (1957), and his death at Ashkhabad on 3 March 1974. The article records no religious affiliation for him."
