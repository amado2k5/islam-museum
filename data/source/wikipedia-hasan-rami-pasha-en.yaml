  ar: "مقالة ويكيبيديا الإنجليزية عن حسن رامي باشا؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من خريج في الأكاديمية البحرية إلى قائد الأسطول الذي أبلغ السلطان عبد الحميد الثاني بفساد حاله، ونظارته للبحرية، وعزله ومحاكمته بعد ثورة 1908، ووفاته في إسطنبول سنة 1923."
  en: "English Wikipedia article on Hasan Rami Pasha; used for entity facts only. It recounts his rise from naval academy graduate to commander of the fleet whose decayed state he reported to Abdul Hamid II, his naval ministry, his dismissal and trial after the 1908 revolution, and his death at Istanbul in 1923."
