reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him as born in Selanik (Thessaloniki) to a Turkish family in 1842, a naval academy graduate of 1856, a warship commander in the Russo-Turkish War, commander of the navy from 1882, adjutant of Abdul Hamid II from 1885, commander of the fleet sent to the Dardanelles in 1897, naval minister from 1906 (its succession box gives 1906–1907), dismissed and downgraded after the Young Turk Revolution, and dead at Istanbul in 1923; his memoirs were republished in 2013 together with Rauf Orbay's criticisms of him. It makes no statement of his religion: its infobox has no religion field and its text gives only his Turkish family origin."
