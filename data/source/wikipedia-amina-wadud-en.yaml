summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أمينة ودود؛ تُستخدم لوقائع الكيان فقط، وتؤكد ولادتها في 25 سبتمبر 1952 في بيثيسدا واعتناقها الإسلام سنة 1972 ودكتوراه جامعة ميشيغان سنة 1988 وكتابها «القرآن والمرأة»، ولا تسمّي لها مذهبًا."
  en: "English Wikipedia article on Amina Wadud; used for entity facts only. It confirms her birth on 25 September 1952 in Bethesda, Maryland, her conversion to Islam in 1972, her doctorate at the University of Michigan in 1988 and her book Qur'an and Woman, and names no school for her."
  es: "Artículo de la Wikipedia en inglés sobre Amina Wadud; utilizado únicamente para datos sobre la persona. Confirma su nacimiento el 25 de septiembre de 1952 en Bethesda, Maryland, su conversión al Islam en 1972, su doctorado en la Universidad de Michigan en 1988 y su libro El Corán y la mujer, pero no menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en anglais sur Amina Wadud; utilisé uniquement pour des informations sur l'entité. Il confirme sa naissance le 25 septembre 1952 à Bethesda, dans le Maryland, sa conversion à l'islam en 1972, son doctorat à l'Université du Michigan en 1988 et son livre « Le Coran et la femme », mais ne mentionne aucune école à laquelle elle aurait été rattachée."
  ur: "آمنہ ودود پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 25 ستمبر 1952 کو بیتھسڈا، میری لینڈ میں اس کی پیدائش، 1972 میں اسلام قبول کرنے، 1988 میں مشی گن یونیورسٹی سے ڈاکٹریٹ اور اس کی کتاب قرآن اور عورت کی تصدیق کرتا ہے، اور اس کے لیے کسی اسکول کا نام نہیں رکھتا ہے۔"
