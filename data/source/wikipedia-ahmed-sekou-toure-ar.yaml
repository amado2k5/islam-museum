summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد سيكو توري؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في فرانا في 9 يناير 1922 لعائلة مسلمة ودراسته في المدرسة القرآنية، وعمله النقابي ورئاسته غينيا منذ الاستقلال سنة 1958 حتى وفاته، ووساطته بتكليف من منظمة المؤتمر الإسلامي في الحرب العراقية الإيرانية. الخلفية العائلية والدراسة القرآنية تكوين لا شهادة مذهب، ولا تسمّي له مذهبا."
  en: "Arabic Wikipedia article on Ahmed Sékou Touré; used for entity facts only. It recounts his birth in Faranah on 9 January 1922 to a Muslim family, his study at the Qur'anic school, his trade-union work, his presidency of Guinea from independence in 1958 until his death, and his OIC-mandated mediation in the Iran–Iraq war. The family background and Qur'anic schooling are formation, not a school attestation, and it names no school for him."
