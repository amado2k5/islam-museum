summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد سيكو توري؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في فرانا في 9 يناير 1922 لعائلة مسلمة ودراسته في المدرسة القرآنية، وعمله النقابي ورئاسته غينيا منذ الاستقلال سنة 1958 حتى وفاته، ووساطته بتكليف من منظمة المؤتمر الإسلامي في الحرب العراقية الإيرانية. الخلفية العائلية والدراسة القرآنية تكوين لا شهادة مذهب، ولا تسمّي له مذهبا."
  en: "Arabic Wikipedia article on Ahmed Sékou Touré; used for entity facts only. It recounts his birth in Faranah on 9 January 1922 to a Muslim family, his study at the Qur'anic school, his trade-union work, his presidency of Guinea from independence in 1958 until his death, and his OIC-mandated mediation in the Iran–Iraq war. The family background and Qur'anic schooling are formation, not a school attestation, and it names no school for him."
  es: "Artículo de Wikipedia en árabe sobre Ahmed Sékou Touré; utilizado únicamente para datos biográficos. Relata su nacimiento en Faranah el 9 de enero de 1922 en el seno de una familia musulmana, sus estudios en una escuela coránica, su labor sindical, su presidencia de Guinea desde la independencia en 1958 hasta su fallecimiento, y su mediación, por mandato de la OIC, en la guerra Irán-Irak. Los antecedentes familiares y la educación coránica se mencionan como información formativa, no como una certificación de escuela, y no se menciona ninguna escuela específica para él."
  fr: "Article Wikipédia en arabe sur Ahmed Sékou Touré; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Faranah le 9 janvier 1922 dans une famille musulmane, ses études à l'école coranique, son engagement syndical, sa présidence de la Guinée de l'indépendance en 1958 jusqu'à sa mort, et sa médiation, mandatée par l'OCI, dans la guerre Iran-Irak. Les informations relatives à son milieu familial et à sa scolarité coranique relèvent de sa formation et non d'une attestation scolaire; l'article ne mentionne d'ailleurs aucune école."
  ur: "احمد سیکو ٹوری پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں فرانہ میں 9 جنوری 1922 کو ایک مسلمان گھرانے میں ان کی پیدائش، قرآنی اسکول میں ان کی تعلیم، اس کے ٹریڈ یونین کے کام، 1958 میں آزادی سے لے کر ان کی موت تک گنی کی صدارت، اور ایران عراق جنگ میں ان کی او آئی سی کی طرف سے ثالثی کے بارے میں بتایا گیا ہے۔ خاندانی پس منظر اور قرآنی تعلیم کی تشکیل ہے، اسکول کی تصدیق نہیں، اور اس میں اس کے لیے کسی اسکول کا نام نہیں ہے۔"
