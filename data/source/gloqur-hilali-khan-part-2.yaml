  es: "Segunda parte del estudio de Yakubovych, 6 de mayo de 2022: en qué se diferencian las ediciones de 1977 y 1978 de la traducción Hilali-Khan de las revisiones posteriores, desde las glosas en árabe y los comentarios entre corchetes hasta el cambio de apéndices, así como la influencia de la traducción y las críticas que recibió."
  fr: "Deuxième partie de l'étude de Yakubovych, 6 mai 2022: comment les éditions de 1977 et 1978 de la traduction Hilali-Khan diffèrent des révisions ultérieures, des gloses arabes et des commentaires entre crochets au changement des annexes, ainsi que l'influence de la traduction et les critiques qu'elle a suscitées."
