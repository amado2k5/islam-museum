summary:
  ar: "الجزء الثاني من دراسة ياكوبوفيتش، 6 مايو 2022: الفروق بين طبعتي 1977 و1978 من ترجمة الهلالي وخان وبين المراجعات اللاحقة، من إدخال المصطلحات العربية والشروح بين الأقواس إلى تغيير الملاحق، وما بقي لها من أثر وما وُجّه إليها من نقد."
