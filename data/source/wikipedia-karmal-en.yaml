  ar: "مقالة ويكيبيديا الإنجليزية عن ببرك كارمل؛ تُستخدم لوقائع الكيان فقط. تروي مولده باسم سلطان حسين في 6 يناير 1929 في كاماري قرب كابل، ومشاركته في تأسيس الحزب الديمقراطي الشعبي الأفغاني وقيادته فصيل برچم، وتنصيبه رئيسا لأفغانستان بعد الغزو السوفيتي في ديسمبر 1979 حتى عزله سنة 1986، ووفاته في موسكو في مطلع ديسمبر 1996 بسرطان الكبد."
  en: "English Wikipedia article on Babrak Karmal; used for entity facts only. It recounts his birth as Sultan Hussein on 6 January 1929 at Kamari near Kabul, his co-founding of the People's Democratic Party of Afghanistan and leadership of its Parcham faction, his installation as Afghanistan's leader after the Soviet invasion in December 1979 until his removal in 1986, and his death in Moscow in early December 1996 from liver cancer."
