label:
  ar: "سيما خان، «عمارة المساجد في عهد فيروز شاه تغلق»، رسالة ماجستير في الفلسفة (M.Phil.)، قسم التاريخ، جامعة عليكره الإسلامية، 2011"
  en: "Seema Khan, Mosque Architecture under Firuzshah Tughlaq, M.Phil. dissertation, Centre of Advanced Study, Department of History, Aligarh Muslim University, 2011"
summary:
  ar: "رسالة ماجستير أعدتها سيما خان بإشراف الدكتورة غلفشان خان في مركز الدراسات المتقدمة بقسم التاريخ في جامعة عليكره الإسلامية، تتناول تطور عمارة المساجد ثم مساجد عهد فيروز شاه تغلق في دلهي وموادها وزخرفتها، مع مسح ميداني للمواقع."
  en: "An M.Phil. dissertation by Seema Khan, supervised by Dr Gulfishan Khan at the Centre of Advanced Study, Department of History, Aligarh Muslim University, on the evolution of mosque architecture and on the mosques of Firuz Shah Tughluq's reign in Delhi, their materials and decoration, with the author's own site survey."
  es: "Tesis de maestría de Seema Khan, dirigida por el Dr. Gulfishan Khan en el Centro de Estudios Avanzados del Departamento de Historia de la Universidad Musulmana de Aligarh, sobre la evolución de la arquitectura de las mezquitas y sobre las mezquitas del reinado de Firuz Shah Tughluq en Delhi, sus materiales y decoración, con un estudio de campo realizado por la propia autora."
  fr: "Une thèse de maîtrise (M.Phil.) de Seema Khan, supervisée par le Dr Gulfishan Khan au Centre d'études avancées, Département d'histoire, Université musulmane d'Aligarh, sur l'évolution de l'architecture des mosquées et sur les mosquées du règne de Firuz Shah Tughluq à Delhi, leurs matériaux et leur décoration, avec une étude de site réalisée par l'auteure elle-même."
  ur: "ایک ایم فل۔ سیما خان کا مقالہ، جسے ڈاکٹر گلفشاں خان کی زیر نگرانی سینٹر آف ایڈوانسڈ اسٹڈی، شعبہ تاریخ، علی گڑھ مسلم یونیورسٹی میں، مسجد کے فن تعمیر کے ارتقاء اور دہلی میں فیروز شاہ تغلق کے دور کی مساجد، ان کے مواد اور سجاوٹ پر، مصنف کے اپنے سائٹ سروے کے ساتھ۔"
  tr: "Aligarh İslam Üniversitesi Tarih Bölümü İleri Araştırmalar Merkezi'nde Dr. Gulfshan Khan danışmanlığında Seema Khan tarafından hazırlanan yüksek lisans tezi, cami mimarisinin gelişimini ve ardından Firoz Shah döneminin Delhi'deki camilerini, malzemelerini, dekorasyonlarını ve alanların saha incelemesini ele almaktadır."
  id: "Tesis magister yang disusun oleh Seema Khan di bawah bimbingan Dr. Gulfshan Khan di Center for Advanced Studies di Departemen Sejarah Universitas Islam Aligarh, membahas perkembangan arsitektur masjid dan kemudian masjid-masjid pada era Firoz Shah di Delhi, bahan, dekorasinya, dan survei lapangan terhadap situs-situs tersebut."
