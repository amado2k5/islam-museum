summary:
  ar: "ملف موقع إنفلوينس ووتش عن سراج وهاج؛ يصفه بأنه صار مسلما سنيا أرثوذكسيا بعد تركه أمة الإسلام، ويذكر تدريبه في جامعة أم القرى، وتأسيسه مسجد التقوى سنة 1981، ومشاركته في تأسيس تحالف مسلمي أمريكا الشمالية، ونائب رئاسته السابق للجمعية الإسلامية لأمريكا الشمالية."
  en: "InfluenceWatch's profile of Siraj Wahhaj; it states that he moved away from the Nation of Islam and became an orthodox Sunni Muslim, and records his clerical training at Umm al-Qura University, his founding of Masjid At-Taqwa in 1981, his co-founding of the Muslim Alliance in North America and his former vice-presidency of the Islamic Society of North America."
  es: "El perfil de Siraj Wahhaj publicado por InfluenceWatch indica que se alejó de la Nación del Islam y se convirtió en un musulmán sunita ortodoxo, y registra su formación clerical en la Universidad Umm al-Qura, la fundación de la Mezquita At-Taqwa en 1981, su participación como cofundador de la Alianza Musulmana en Norteamérica y su anterior cargo como vicepresidente de la Sociedad Islámica de Norteamérica."
  fr: "Le profil de Siraj Wahhaj établi par InfluenceWatch indique qu'il a quitté la Nation of Islam pour devenir un musulman sunnite orthodoxe, et relate sa formation cléricale à l'université Umm al-Qura, la fondation de la mosquée At-Taqwa en 1981, sa cofondation de l'Alliance musulmane en Amérique du Nord et son ancien poste de vice-président de la Société islamique d'Amérique du Nord."
  ur: "انفلوئنس واچ کی سراج وہاج کی پروفائل؛ اس میں کہا گیا ہے کہ وہ نیشن آف اسلام سے دور ہو گئے اور ایک آرتھوڈوکس سنی مسلمان بن گئے، اور ام القریٰ یونیورسٹی میں علمی تربیت، 1981 میں مسجد التقویٰ کی بنیاد، شمالی امریکہ میں مسلم الائنس کے شریک بانی اور اسلامک سوسائٹی آف نارتھ امریکہ کے سابق نائب صدر کے طور پر اپنی علمی تربیت ریکارڈ کی۔"
  tr: "Siraj Wahaj hakkında Influence Watch dosyası; onu İslam ümmetinden ayrıldıktan sonra Sünni Ortodoks Müslüman olarak tanımlıyor, Um Al-Qura Üniversitesi'ndeki eğitimini, 1981'de Al-Taqwa Camii'ni kurmasını, Kuzey Amerika Müslüman İttifakı'nın kuruluşuna katılımını ve Kuzey Amerika İslam Derneği'nin eski başkan yardımcısını anlatıyor."
  id: "Berkas Influence Watch tentang Siraj Wahaj; ia menggambarkannya sebagai Muslim Ortodoks Sunni setelah meninggalkan Ummah Islam, menyebutkan pelatihannya di Universitas um Al-Qura, mendirikan Masjid Al-Taqwa pada tahun 1981, partisipasinya dalam pendirian North American Muslim Alliance, dan mantan wakil presiden Asosiasi Islam Amerika Utara."
