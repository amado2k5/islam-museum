summary:
  ar: "ملف موقع إنفلوينس ووتش عن سراج وهاج؛ يصفه بأنه صار مسلما سنيا أرثوذكسيا بعد تركه أمة الإسلام، ويذكر تدريبه في جامعة أم القرى، وتأسيسه مسجد التقوى سنة 1981، ومشاركته في تأسيس تحالف مسلمي أمريكا الشمالية، ونائب رئاسته السابق للجمعية الإسلامية لأمريكا الشمالية."
  en: "InfluenceWatch's profile of Siraj Wahhaj; it states that he moved away from the Nation of Islam and became an orthodox Sunni Muslim, and records his clerical training at Umm al-Qura University, his founding of Masjid At-Taqwa in 1981, his co-founding of the Muslim Alliance in North America and his former vice-presidency of the Islamic Society of North America."
