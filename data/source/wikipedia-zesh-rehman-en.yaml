reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id. It gives his full name as Zeshan Rehman, born 14 October 1983 in Birmingham; a defender who came through Fulham (debut September 2003), was the first British Asian to play in the top division of English football and, with his Bradford City debut in January 2009, the first to have played in all four divisions; Queens Park Rangers, Bradford City (as captain), Muangthong United, Kitchee, Pahang, Gillingham and Southern, where he became player-manager in 2020; then Portsmouth under-18 coach in June 2022 and interim first-team assistant in January 2023. He played for England at under-18 to under-20 level and made his Pakistan debut in 2005. On religion, the article records community appearances: taking part in the Islam Expo event in London in July 2008, and appearing on Noor TV and Islamic TV in April 2008 discussing being a Muslim footballer and pursuing a football career while sticking to Islamic roots. It names Islam in general only; no school is named for him anywhere in the article."
