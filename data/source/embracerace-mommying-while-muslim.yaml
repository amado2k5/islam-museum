summary:
  ar: "نص حوار منظمة «إمبريس ريس» مع زايبة حسن وعظمى جعفري، مقدّمتي بودكاست «الأمومة على الطريقة المسلمة»؛ تروي فيه زايبة أن البودكاست بدأ حين أوقف ابنها المراهق في مطار بوصفه مسلمًا فاتصلت بعظمى للبحث عن موارد، وتقول عظمى إنها لم تكن تعرف البودكاست حتى اقترحت زايبة أن يبدآ واحدًا فانضمت إلى الرحلة."
  en: "EmbraceRace's conversation transcript with Zaiba Hasan and Uzma Jafri, hosts of the Mommying While Muslim podcast; Zaiba recounts that the podcast started after her teenage son was stopped at an airport as a Muslim male and she contacted Uzma to look for resources, and Uzma says she did not know what podcasts were until Zaiba proposed starting one and she came along for the ride."
title: "“Mommying While Muslim”: Raising Healthy Muslim Children in a Post-9/11 World"
