summary:
  ar: "نص حوار منظمة «إمبريس ريس» مع زايبة حسن وعظمى جعفري، مقدّمتي بودكاست «الأمومة على الطريقة المسلمة»؛ تروي فيه زايبة أن البودكاست بدأ حين أوقف ابنها المراهق في مطار بوصفه مسلمًا فاتصلت بعظمى للبحث عن موارد، وتقول عظمى إنها لم تكن تعرف البودكاست حتى اقترحت زايبة أن يبدآ واحدًا فانضمت إلى الرحلة."
  en: "EmbraceRace's conversation transcript with Zaiba Hasan and Uzma Jafri, hosts of the Mommying While Muslim podcast; Zaiba recounts that the podcast started after her teenage son was stopped at an airport as a Muslim male and she contacted Uzma to look for resources, and Uzma says she did not know what podcasts were until Zaiba proposed starting one and she came along for the ride."
  es: "Transcripción de la conversación de EmbraceRace con Zaiba Hasan y Uzma Jafri, presentadoras del podcast Mommying While Muslim; Zaiba cuenta que el podcast comenzó después de que su hijo adolescente fuera detenido en un aeropuerto por ser musulmán y ella contactara a Uzma para buscar recursos, y Uzma dice que no sabía qué eran los podcasts hasta que Zaiba le propuso comenzar uno y ella se unió a la iniciativa."
  fr: "Transcription de la conversation d'EmbraceRace avec Zaiba Hasan et Uzma Jafri, animatrices du podcast Mommying While Muslim; Zaiba raconte que le podcast a débuté après que son fils adolescent a été arrêté à l'aéroport en tant que garçon musulman et qu'elle a contacté Uzma pour chercher des ressources, et Uzma dit qu'elle ne savait pas ce qu'étaient les podcasts jusqu'à ce que Zaiba propose d'en lancer un et qu'elle se soit jointe à l'aventure."
  ur: "Mommying while Muslim podcast کی میزبان زیبا حسن اور عظمیٰ جعفری کے ساتھ ایمبریس ریس کی گفتگو کا ٹرانسکرپٹ؛ زیبا بتاتی ہیں کہ پوڈ کاسٹ اس وقت شروع ہوا جب اس کے نوعمر بیٹے کو ایک مسلمان مرد کے طور پر ہوائی اڈے پر روکا گیا اور اس نے وسائل تلاش کرنے کے لیے عظمیٰ سے رابطہ کیا، اور عظمیٰ کا کہنا ہے کہ جب تک زیبا نے اسے شروع کرنے کی تجویز پیش نہیں کی تب تک وہ نہیں جانتی تھیں کہ پوڈ کاسٹ کیا ہوتے ہیں اور وہ سواری کے لیے ساتھ آئی۔"
