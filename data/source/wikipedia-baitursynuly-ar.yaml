summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد بايتورسينوف؛ تُستخدم لوقائع الكيان فقط. سيرة موجزة تذكر تعليمه في مدرسة المعلمين بأورينبورغ وصحافته ورئاسته تحرير «قازاق» ووفاته في 8 ديسمبر 1937، وتؤرّخ مولده بـ28 يناير 1873 خلافًا لتاريخ 5 سبتمبر 1872 في المقالات الإنجليزية والروسية والكازاخية."
  en: "Arabic Wikipedia article on Ahmet Baitursynuly; used for entity facts only. A short biography giving his education at the Orenburg teachers' school, his journalism, his editorship of Qazaq and his death on 8 December 1937; it dates his birth to 28 January 1873, against the 5 September 1872 of the English, Russian and Kazakh articles."
  es: "Artículo en árabe de la Wikipedia sobre Ahmet Baitursynuly; utilizado únicamente para datos biográficos. Una breve biografía que detalla su formación en la escuela de maestros de Orenburg, su trayectoria periodística, su dirección del periódico Qazaq y su fallecimiento el 8 de diciembre de 1937; fecha su nacimiento el 28 de enero de 1873, en contraposición al 5 de septiembre de 1872 que indican los artículos en inglés, ruso y kazajo."
  fr: "Article Wikipédia en arabe sur Ahmet Baitursynuly; utilisé uniquement à des fins d'information sur l'entité. Une courte biographie retrace sa formation à l'école normale d'Orenbourg, sa carrière de journaliste, son poste de rédacteur en chef de Qazaq et son décès le 8 décembre 1937; elle date sa naissance du 28 janvier 1873, contrairement aux articles en anglais, en russe et en kazakh qui indiquent le 5 septembre 1872."
  ur: "عربی ویکیپیڈیا مضمون پر احمد بیتورسنولی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر سوانح عمری جس میں اورینبرگ کے اساتذہ کے اسکول میں ان کی تعلیم، ان کی صحافت، قزاق کی ان کی ادارت اور 8 دسمبر 1937 کو ان کی وفات؛ اس کی تاریخ پیدائش 28 جنوری 1873 ہے، انگریزی، روسی اور قازق مضامین کے 5 ستمبر 1872 کے خلاف۔"
