  ar: "مقالة ويكيبيديا العربية عن أحمد بايتورسينوف؛ تُستخدم لوقائع الكيان فقط. سيرة موجزة تذكر تعليمه في مدرسة المعلمين بأورينبورغ وصحافته ورئاسته تحرير «قازاق» ووفاته في 8 ديسمبر 1937، وتؤرّخ مولده بـ28 يناير 1873 خلافًا لتاريخ 5 سبتمبر 1872 في المقالات الإنجليزية والروسية والكازاخية."
  en: "Arabic Wikipedia article on Ahmet Baitursynuly; used for entity facts only. A short biography giving his education at the Orenburg teachers' school, his journalism, his editorship of Qazaq and his death on 8 December 1937; it dates his birth to 28 January 1873, against the 5 September 1872 of the English, Russian and Kazakh articles."
