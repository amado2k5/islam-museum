summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن لخضر بلومي؛ تُستخدم لوقائع الكيان فقط. تروي سيرة لاعب الوسط المهاجم الجزائري المولود في 29 ديسمبر 1958 بمعسكر، ويُعد أعظم لاعب جزائري: قضى مسيرته غالبًا مع غالي معسكر ومولودية وهران، وسجل هدف الفوز على ألمانيا الغربية في كأس العالم 1982، وشارك في كأسي العالم 1982 و1986."
  en: "English Wikipedia article on Lakhdar Belloumi; used for entity facts only. It records the Algerian attacking midfielder born 29 December 1958 at Mascara, widely considered Algeria's greatest player: a career spent mostly at GC Mascara and MC Oran, the winning goal against West Germany at the 1982 World Cup, and World Cups in 1982 and 1986."
  es: "Artículo de la Wikipedia en inglés sobre Lakhdar Belloumi; utilizado únicamente para obtener información sobre la persona. Describe al centrocampista ofensivo argelino nacido el 29 de diciembre de 1958 en Mascara, considerado por muchos el mejor jugador de Argelia: una carrera que transcurrió principalmente en el GC Mascara y el MC Oran, el gol de la victoria contra Alemania Occidental en el Mundial de 1982 y los Mundiales de 1982 y 1986."
  fr: "Article de Wikipédia en anglais sur Lakhdar Belloumi; utilisé uniquement pour les informations sur l'entité. Il retrace la carrière du milieu offensif algérien né le 29 décembre 1958 à Mascara, largement considéré comme le plus grand joueur algérien: une carrière passée principalement au GC Mascara et au MC Oran, le but victorieux contre l'Allemagne de l'Ouest lors de la Coupe du monde 1982, et les Coupes du monde de 1982 et 1986."
  ur: "لکھدار بیلومی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں الجزائر کے حملہ آور مڈفیلڈر کا ریکارڈ ہے جو 29 دسمبر 1958 کو مسکارا میں پیدا ہوا تھا، جسے الجزائر کا سب سے بڑا کھلاڑی سمجھا جاتا ہے: ایک کیریئر زیادہ تر جی سی مسکارا اور ایم سی اوران میں گزارا، 1982 کے ورلڈ کپ میں مغربی جرمنی کے خلاف جیتنے والا گول، اور 1982 اور 1986 میں ورلڈ کپ۔"
