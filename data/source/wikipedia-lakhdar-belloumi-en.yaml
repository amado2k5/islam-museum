  ar: "مقالة ويكيبيديا الإنجليزية عن لخضر بلومي؛ تُستخدم لوقائع الكيان فقط. تروي سيرة لاعب الوسط المهاجم الجزائري المولود في 29 ديسمبر 1958 بمعسكر، ويُعد أعظم لاعب جزائري: قضى مسيرته غالبًا مع غالي معسكر ومولودية وهران، وسجل هدف الفوز على ألمانيا الغربية في كأس العالم 1982، وشارك في كأسي العالم 1982 و1986."
  en: "English Wikipedia article on Lakhdar Belloumi; used for entity facts only. It records the Algerian attacking midfielder born 29 December 1958 at Mascara, widely considered Algeria's greatest player: a career spent mostly at GC Mascara and MC Oran, the winning goal against West Germany at the 1982 World Cup, and World Cups in 1982 and 1986."
