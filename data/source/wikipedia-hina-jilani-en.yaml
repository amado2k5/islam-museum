reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives her born 19 December 1953 at Lahore (citing the Women's Year Book of Pakistan, 1989); that in February 1980 she co-founded with her sister Asma Jahangir Pakistan's first all-female legal aid practice, AGHS Legal Aid Cell, in Lahore; that she is a founder of the Human Rights Commission of Pakistan and the Women's Action Forum, founded Pakistan's first legal aid centre in 1986 and the Dastak shelter in 1991; and her service as the UN Secretary-General's Special Representative on human rights defenders, on the Darfur commission of inquiry and the Gaza fact-finding mission, and as a member of The Elders. It makes no statement of her religion anywhere, and has no religion infobox field."
