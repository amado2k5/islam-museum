summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن المختار ولد داداه؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في أسرة مرابطية من بوتلميت ودراسته في الأكاديميات الإسلامية ثم الحقوق بباريس، ورئاسته الوزراء (1957–1961) والرئاسة (1960–1978)، ودولة الحزب الواحد و«الاشتراكية الإسلامية»، وحرب الصحراء، والإطاحة به سنة 1978 وسجنه ومنفاه في فرنسا وعودته سنة 2001 ووفاته بباريس. لا يذكر نصّها مذهبه؛ وتقدّم أصله ونشأته فقط، وتصنّفه في «الاشتراكيين المسلمين»."
  en: "English Wikipedia article on Moktar Ould Daddah; used for entity facts only. It recounts his birth into a marabout family of Boutilimit, his schooling at Islamic academies and in law at Paris, his premiership (1957–1961) and presidency (1960–1978), the one-party state and 'Islamic socialism', the Western Sahara war, his overthrow in 1978, imprisonment, exile in France, return in 2001, and death in Paris. Its text names no school of his; it gives family background and formation only, and files him under Muslim socialists."
