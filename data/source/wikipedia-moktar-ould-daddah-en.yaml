summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن المختار ولد داداه؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في أسرة مرابطية من بوتلميت ودراسته في الأكاديميات الإسلامية ثم الحقوق بباريس، ورئاسته الوزراء (1957–1961) والرئاسة (1960–1978)، ودولة الحزب الواحد و«الاشتراكية الإسلامية»، وحرب الصحراء، والإطاحة به سنة 1978 وسجنه ومنفاه في فرنسا وعودته سنة 2001 ووفاته بباريس. لا يذكر نصّها مذهبه؛ وتقدّم أصله ونشأته فقط، وتصنّفه في «الاشتراكيين المسلمين»."
  en: "English Wikipedia article on Moktar Ould Daddah; used for entity facts only. It recounts his birth into a marabout family of Boutilimit, his schooling at Islamic academies and in law at Paris, his premiership (1957–1961) and presidency (1960–1978), the one-party state and 'Islamic socialism', the Western Sahara war, his overthrow in 1978, imprisonment, exile in France, return in 2001, and death in Paris. Its text names no school of his; it gives family background and formation only, and files him under Muslim socialists."
  es: "Artículo de la Wikipedia en inglés sobre Moktar Ould Daddah; utilizado únicamente para datos sobre la persona. Relata su nacimiento en una familia marabá de Boutilimit, su formación en academias islámicas y en derecho en París, su mandato como primer ministro (1957-1961) y presidente (1960-1978), el Estado de partido único y el «socialismo islámico», la guerra del Sáhara Occidental, su derrocamiento en 1978, su encarcelamiento, su exilio en Francia, su regreso en 2001 y su muerte en París. El texto no menciona ninguna escuela a la que haya asistido; solo proporciona información sobre su familia y su formación, y lo clasifica dentro del grupo de los socialistas musulmanes."
  fr: "L'article de Wikipédia en anglais consacré à Moktar Ould Daddah, utilisé uniquement pour les informations le concernant, relate sa naissance dans une famille de marabouts de Boutilimit, ses études dans des académies islamiques et en droit à Paris, son mandat de Premier ministre (1957-1961) puis de président (1960-1978), le régime de parti unique et le « socialisme islamique », la guerre du Sahara occidental, son renversement en 1978, son emprisonnement, son exil en France, son retour en 2001 et sa mort à Paris. Le texte ne mentionne aucune école qu'il aurait fréquentée; il se concentre uniquement sur son milieu familial et sa formation, et le classe parmi les socialistes musulmans."
