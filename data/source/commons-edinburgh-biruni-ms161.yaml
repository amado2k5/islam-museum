reliability_note: "Commons file page inspected: public-domain mark, faithful photographic reproduction of a 14th-century work, author given as \"14th century author\", uploaded by Pataliputra! on 25 January 2024 from the University of Edinburgh digital-images server (images.is.ed.ac.uk, work shelfmark Or.Ms.161). The manuscript is dated 707 AH / 1307-08 CE by the Edinburgh University Library catalogue (Or Ms 161, scribe Ibn al-Qutbi); Commons category confirms the volume is al-Biruni's Chronology of Ancient Nations (Athar al-Baqiya) with 26 illustrations. Reproduction depicts the manuscript's own title-page miniature, not a modern reconstruction."
