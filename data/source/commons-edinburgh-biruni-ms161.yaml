summary:
  ar: "صفحة ملف Commons الموثقة: «Chronology of Ancient Nations, f.1r miniature.jpg» — إعادة تصوير أمينة لصفحة عنوان مصورة من المخطوط الإيلخاني Or 161 الذي يحفظ «الآثار الباقية» في مكتبة جامعة إدنبرة، موسوم بعلامة الملك العام."
  en: "Commons file page for \"Chronology of Ancient Nations, f.1r miniature.jpg\" — a faithful photographic reproduction of the illuminated title page of Edinburgh MS Or 161, the Ilkhanid manuscript of al-Biruni's Athar al-Baqiya held by the University of Edinburgh Library, marked public domain."
  ur: "کامنز فائل صفحہ «Chronology of Ancient Nations, f.1r miniature.jpg» — ایڈنبرا یونیورسٹی لائبریری کے مخطوط Or 161 کے عنوانی صفحے کے روشن متون منی ایچر کی دیانت دارانہ تصویری نقل، جو البیرونی کی «الآثار الباقیہ» کے محفوظ نسخے سے ہے اور بادشاہی عام نشان سے نشان زد ہے۔"
  es: "Página de archivo de Wikimedia Commons para \"Chronology of Ancient Nations, f.1r miniature.jpg\" — una reproducción fotográfica fiel de la página del título iluminada del manuscrito Edinburgh MS Or 161, el manuscrito iljánida del Athar al-Baqiya de al-Biruni que se conserva en la Biblioteca de la Universidad de Edimburgo, marcado como de dominio público."
  fr: "Page de fichier Commons pour « Chronologie des nations anciennes, f.1r miniature.jpg » — une reproduction photographique fidèle de la page de titre enluminée du manuscrit Edinburgh MS Or 161, le manuscrit ilkhanide de l'Athar al-Baqiya d'al-Biruni conservé par la bibliothèque de l'université d'Édimbourg, marqué domaine public."
  tr: "Belgelenmiş Commons dosya sayfası: \"Antik Ulusların Kronolojisi, f.1r miniature.jpg\" — İlhanlı el yazması veya 161'den resimli bir başlık sayfasının sadık yeniden imsafı; bu sayfa, Edinburgh Üniversitesi Kütüphanesi'nde \"Kalan Antikalar\"ı kamu malı işaretiyle işaretlenmiş olarak korumaktadır."
  id: "Halaman berkas Commons yang terdokumentasi: \"Chronology of Ancient Nations, f.1r miniature.jpg\" — pencitraan ulang yang setia dari halaman judul bergambar dari manuskrip Ilkhanid atau 161, yang melestarikan \"Sisa Antikitas\" di Perpustakaan Universitas Edinburgh, yang ditandai dengan tanda domain publik."
