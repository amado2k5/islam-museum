summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن يوسف آقجورا؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في سيمبيرسك في 2 ديسمبر 1876، وهجرته إلى الدولة العثمانية في السابعة من عمره، وتعليمه العسكري ونفيه إلى فزان سنة 1896، وهربه إلى باريس، ورسالته «أوضاع السياسة الثلاثة» (1904)، ومشاركته في تأسيس «اتفاق المسلمين» وجمعية «الوطن التركي» ومجلتها سنة 1911، ونيابته عن إسطنبول (1923–1934) ثم قارص، ورئاسته للجمعية التاريخية التركية منذ 1932، ووفاته في إسطنبول في 11 مارس 1935. ويناقش متنها مواقفه السياسية، ومنها رغبته في تركيا علمانية، ولا يسمي له ديانة ولا مدرسة."
  en: "English Wikipedia article on Yusuf Akçura; used for entity facts only. It gives his birth at Simbirsk on 2 December 1876, his emigration to the Ottoman Empire at the age of seven, his military schooling and exile to Fezzan in 1896, his escape to Paris, his 1904 essay Üç Tarz-ı Siyaset, his co-founding of the Ittifaq al-Muslimin and of the Türk Yurdu association and journal in 1911, his parliamentary terms for Istanbul (1923–1934) and Kars, his presidency of the Turkish Historical Society from 1932, and his death at Istanbul on 11 March 1935. Its text discusses his political positions — including his wish for a secular Turkey — and names no religion or school for him."
