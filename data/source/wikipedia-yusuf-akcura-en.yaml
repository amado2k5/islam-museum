summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن يوسف آقجورا؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في سيمبيرسك في 2 ديسمبر 1876، وهجرته إلى الدولة العثمانية في السابعة من عمره، وتعليمه العسكري ونفيه إلى فزان سنة 1896، وهربه إلى باريس، ورسالته «أوضاع السياسة الثلاثة» (1904)، ومشاركته في تأسيس «اتفاق المسلمين» وجمعية «الوطن التركي» ومجلتها سنة 1911، ونيابته عن إسطنبول (1923–1934) ثم قارص، ورئاسته للجمعية التاريخية التركية منذ 1932، ووفاته في إسطنبول في 11 مارس 1935. ويناقش متنها مواقفه السياسية، ومنها رغبته في تركيا علمانية، ولا يسمي له ديانة ولا مدرسة."
  en: "English Wikipedia article on Yusuf Akçura; used for entity facts only. It gives his birth at Simbirsk on 2 December 1876, his emigration to the Ottoman Empire at the age of seven, his military schooling and exile to Fezzan in 1896, his escape to Paris, his 1904 essay Üç Tarz-ı Siyaset, his co-founding of the Ittifaq al-Muslimin and of the Türk Yurdu association and journal in 1911, his parliamentary terms for Istanbul (1923–1934) and Kars, his presidency of the Turkish Historical Society from 1932, and his death at Istanbul on 11 March 1935. Its text discusses his political positions — including his wish for a secular Turkey — and names no religion or school for him."
  es: "Artículo de la Wikipedia en inglés sobre Yusuf Akçura; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Simbirsk el 2 de diciembre de 1876, su emigración al Imperio Otomano a los siete años, su formación militar y exilio a Fezzan en 1896, su huida a París, su ensayo de 1904, Üç Tarz-ı Siyaset, su cofundación de Ittifaq al-Muslimin y de la asociación y revista Türk Yurdu en 1911, sus mandatos parlamentarios por Estambul (1923-1934) y Kars, su presidencia de la Sociedad Histórica Turca desde 1932 y su muerte en Estambul el 11 de marzo de 1935. El texto analiza sus posiciones políticas —incluido su deseo de una Turquía laica— y no menciona ninguna religión ni escuela que le atribuya."
  fr: "Article de Wikipédia en anglais sur Yusuf Akçura; utilisé uniquement pour les informations biographiques. Il relate sa naissance à Simbirsk le 2 décembre 1876, son émigration vers l’Empire ottoman à l’âge de sept ans, sa formation militaire et son exil au Fezzan en 1896, sa fuite à Paris, son essai de 1904 intitulé « Üç Tarz-ı Siyaset », sa cofondation de l’Ittifaq al-Muslimin et de l’association et revue Türk Yurdu en 1911, ses mandats de député d’Istanbul (1923-1934) et de Kars, sa présidence de la Société historique turque à partir de 1932 et sa mort à Istanbul le 11 mars 1935. Le texte aborde ses positions politiques – notamment son souhait d’une Turquie laïque – sans mentionner sa religion ni son école."
  ur: "یوسف اکیورا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 2 دسمبر 1876 کو سمبرسک میں اس کی پیدائش، سات سال کی عمر میں سلطنت عثمانیہ کی طرف ہجرت، اس کی فوجی تعلیم اور 1896 میں فیضان میں جلاوطنی، اس کا پیرس فرار، اس کا 1904 کا مضمون Üç Tarz-ı Siyaset، اس کا اتحاد المسلمین اور یثرب المصطفیٰ کے شریک بانی۔ 1911 میں جریدہ، استنبول کے لیے ان کی پارلیمانی شرائط (1923-1934) اور کارس، 1932 سے ترک تاریخی سوسائٹی کی صدارت، اور 11 مارچ 1935 کو استنبول میں ان کی موت۔"
  tr: "Yusuf Akjura hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Makale, 2 Aralık 1876'da Simbirsk'teki doğumundan, yedi yaşında Osmanlı İmparatorluğu'na göçünden, 1896'da askeri eğitimi ve Fezzan'a sürgününden, Paris'e kaçışından, 'Üç Siyasi Devlet' (1904) adlı mektubundan bahseder; 1911'de 'Müslüman Anlaşması' ve 'Türk Vatanı' derneği ile dergisinin kuruluşuna katılımı, İstanbul'u temsil etmesi (1923–1934) ve ardından Kars'ı, 1932'den itibaren Türk Tarih Cemiyeti başkanlığını ve 11 Mart 1935'te İstanbul'daki ölümünü anlatır. Makale, siyasi duruşlarını, laik bir Türkiye arzusu da dahil olmak üzere, ele alır ve kendisi için bir din ya da okul belirtmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Yusuf Akjura hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya di Simbirsk pada 2 Desember 1876, migrasinya ke Kekaisaran Ottoman pada usia tujuh tahun, pendidikan militernya dan pengasingannya ke Fezzan pada tahun 1896, pelariannya ke Paris, suratnya 'Tiga Negara Politik' (1904), partisipasinya dalam mendirikan 'Perjanjian Muslim' dan asosiasi 'Tanah Air Turki' beserta majalahnya pada tahun 1911, perwakilannya terhadap Istanbul (1923–1934) dan kemudian Kars, kepresidenannya di Masyarakat Sejarah Turki sejak 1932, serta kematiannya di Istanbul pada 11 Maret 1935. Artikel tersebut membahas posisi politiknya, termasuk keinginannya untuk Turki yang sekuler, dan tidak menyebutkan agama atau sekolah untuknya."
