summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن دينا الشهابي؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في الرياض في 21 سبتمبر 1989 ونشأتها بين السعودية وبيروت ودبي، ودراستها في جامعة نيويورك ⁦(ماجستير الفنون الجميلة 2014)⁩، وأدوارها في «جاك رايان» و«ألتيرد كاربون» و«أركايف 81». لا تسمّي المقالة دينًا أو مذهبًا لها."
  en: "English Wikipedia article on Dina Shihabi; used for entity facts only. It records her birth in Riyadh on 21 September 1989, her upbringing in Saudi Arabia, Beirut and Dubai, her NYU MFA (2014), and her roles in Jack Ryan, Altered Carbon and Archive 81. The article names no religion or school for her."
  es: "Artículo de la Wikipedia en inglés sobre Dina Shihabi; se utiliza únicamente para obtener información sobre la persona. En él se registra su nacimiento en Riad el 21 de septiembre de 1989, su infancia en Arabia Saudita, Beirut y Dubái, su maestría en Bellas Artes por la Universidad de Nueva York (2014) y sus papeles en Jack Ryan, Altered Carbon y Archive 81. El artículo no menciona su religión ni su escuela."
  fr: "Article Wikipédia en anglais sur Dina Shihabi; utilisé uniquement à titre informatif. Il mentionne sa naissance à Riyad le 21 septembre 1989, son enfance en Arabie saoudite, à Beyrouth et à Dubaï, son MFA de l’Université de New York (2014) et ses rôles dans Jack Ryan, Altered Carbon et Archive 81. L’article ne précise ni sa religion ni son école."
  ur: "دینا شہابی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 21 ستمبر 1989 کو ریاض میں اس کی پیدائش، سعودی عرب، بیروت اور دبئی میں اس کی پرورش، اس کے NYU MFA (2014) اور جیک ریان، الٹرڈ کاربن اور آرکائیو 81 میں اس کے کردار ریکارڈ کیے گئے ہیں۔ مضمون میں اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
