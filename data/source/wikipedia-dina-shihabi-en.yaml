  ar: "مقالة ويكيبيديا الإنجليزية عن دينا الشهابي؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في الرياض في 21 سبتمبر 1989 ونشأتها بين السعودية وبيروت ودبي، ودراستها في جامعة نيويورك (ماجستير الفنون الجميلة 2014)، وأدوارها في «جاك رايان» و«ألتيرد كاربون» و«أركايف 81». لا تسمّي المقالة دينًا أو مذهبًا لها."
