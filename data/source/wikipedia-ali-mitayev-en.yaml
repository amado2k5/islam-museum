summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي ميتاييف؛ تُستخدم لوقائع الكيان فقط. تسمّيه مقدمتها «شيخ طريقة صوفية» و«أحد أكثر الشيوخ الصوفية نفوذًا في الشيشان وإنغوشيا»، ويعطي صندوق معلوماتها دينه «الإسلام السني»؛ وتذكر مولده سنة 1881 في أفتوري ووفاته سنة 1925 في روستوف على الدون."
  en: "English Wikipedia article on Ali Mitayev; used for entity facts only. Its lead calls him 'the sheikh of a Sufi tariqa' and 'one of the most influential Sufi sheikhs in Chechnya and Ingushetia', and its infobox gives his religion as Sunni Islam; it gives his birth in 1881 at Avtury and his death in 1925 at Rostov-on-Don."
  es: "Artículo de la Wikipedia en inglés sobre Ali Mitayev; utilizado únicamente para obtener información sobre la persona. Su introducción lo describe como \"el jeque de una tariqa sufí\" y \"uno de los jeques sufíes más influyentes de Chechenia e Ingushetia\", y su ficha informativa indica que su religión era el islam sunita; menciona que nació en 1881 en Avtury y falleció en 1925 en Rostov del Don."
  fr: "Article de Wikipédia en anglais sur Ali Mitayev; utilisé uniquement pour les informations sur l'entité. Son introduction le décrit comme « le cheikh d'une confrérie soufie » et « l'un des cheikhs soufis les plus influents de Tchétchénie et d'Ingouchie », et son infobox indique qu'il était de confession sunnite; elle mentionne sa naissance en 1881 à Avtury et sa mort en 1925 à Rostov-sur-le-Don."
  ur: "علی مطائف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ اسے 'صوفی طریقہ کا شیخ' اور 'چیچنیا اور انگوشیشیا کے سب سے زیادہ بااثر صوفی شیخوں میں سے ایک' کہتا ہے، اور اس کا انفو باکس اس کا مذہب بطور سنی اسلام دیتا ہے۔ اس کی پیدائش 1881 میں Avtury میں ہوئی اور اس کی موت 1925 میں Rostov-on-Don میں ہوئی۔"
