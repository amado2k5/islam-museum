  id: "Entri untuk ensiklopedia Turki \"Kore\" tentang Serdar Tungir, penyair, penulis, dan pembawa acara televisi yang lahir di Ankara pada tahun 1978; perlu disebutkan bahwa ia meluncurkan saluran Mai di YouTube pada tahun 2020; saluran ini hanya digunakan untuk fakta entitas."
