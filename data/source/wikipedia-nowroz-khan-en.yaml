summary:
  ar: "المقال الإنجليزي عن نواب نوروز خان (المعروف عند البلوش بـ«دادا نوروز»)، زعيم الزاركزاي (الزهري) في جهلوان: تمرده في 1958–1959 بعد اعتقال خان قلات، واستسلامه في 15 مايو 1959 على عهد أمان بالمصحف ثم اعتقاله، وإعدام سبعة من رفاقه في يوليو 1960، ووفاته في سجن كوهلو سنة 1964. سنة ميلاده غير مستقرة في المقال نفسه."
  en: "English Wikipedia article on Nawab Nauroz (Nowroz) Khan, known to the Baloch as Dada Nowroz, head of the Zarakzai (Zehri) of Jhalawan: his 1958–59 insurgency after the Khan of Kalat's arrest, his surrender on 15 May 1959 under a Quran oath of amnesty and his arrest instead, the execution of seven of his companions in July 1960, and his death in Kohlu jail in 1964. The article's own birth year is unsettled (lead '1868?', text 'the 1860s or 1870s', categories '1870s births')."
