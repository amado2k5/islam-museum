summary:
  ar: "مقالة ويكيبيديا الأردية عن عبد الله الأول بن حسين هي بذرة من سطر واحد تقول إنه كان ثاني ثلاثة أبناء لحسين بن علي شريف مكة، دون أي تاريخ أو تفصيل آخر؛ ويستند سجل المتحف إلى المقالتين الإنجليزية والعربية وعنصر ويكيدانات."
  en: "The Urdu Wikipedia article on Abdullah I bin Hussein is a one-line stub stating only that he was the second of three sons of Hussein bin Ali, Sharif of Mecca, with no dates or further detail; the museum's record rests on the English and Arabic articles and the Wikidata item."
  es: "El artículo de Wikipedia en urdu sobre Abdullah I bin Hussein es un breve esbozo de una sola línea que solo indica que fue el segundo de los tres hijos de Hussein bin Ali, jerife de La Meca, sin fechas ni más detalles; el registro del museo se basa en los artículos en inglés y árabe y en la entrada de Wikidata."
  fr: "L'article de Wikipédia en ourdou sur Abdullah I bin Hussein est une ébauche d'une seule ligne indiquant seulement qu'il était le deuxième des trois fils de Hussein bin Ali, chérif de La Mecque, sans dates ni autres détails; les archives du musée se basent sur les articles en anglais et en arabe et sur l'élément Wikidata."
  ur: "عبداللہ اول بن حسین پر اردو ویکیپیڈیا کا مضمون ایک سطری سٹب ہے جس میں صرف یہ بتایا گیا ہے کہ وہ حسین بن علی کے تین بیٹوں میں سے دوسرے تھے، شریف مکہ، جس کی کوئی تاریخ یا مزید تفصیل نہیں ہے۔ میوزیم کا ریکارڈ انگریزی اور عربی مضامین اور Wikidata آئٹم پر منحصر ہے۔"
