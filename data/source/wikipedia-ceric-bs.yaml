reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision. It gives his birth in 1952 at Veliko Čajno near Visoko, primary school in his birthplace, the Gazi Husrev-beg Madrasa in Sarajevo (graduated 1972), his Al-Azhar degree at Cairo (1978), service as imam at the White Mosque in Gračanica until 1981, appointment as imam at the Islamic Cultural Center in Chicago, his doctorate under Fazlur Rahman at the University of Chicago on 'A study of the Theology of Abu Mansur al-Maturidi' (24 September 1986) with parallel teaching at the American College in Chicago, and his return as chief imam of the Zagreb mosque. Its infobox religion field gives only 'Islam'."
