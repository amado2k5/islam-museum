summary:
  ar: "مقالة ويكيبيديا العربية عن رانيا العبد الله؛ تُستخدم لوقائع الكيان فقط. توافق الإنجليزية في الولادة ⁦(31 أغسطس 1970 في الكويت، باسم رانيا فيصل صدقي الياسين)⁩ والدراسة والعمل قبل الزواج والزواج سنة 1993 والتلقيب بالملكة سنة 1999، وتبرز اهتمامها بحقوق الطفل والمرأة وعملها التعليمي. لا يرد في صندوق معلوماتها ولا في متنها حقل للدين، وتصنيفاتها تصفها بالمسلمة الأردنية تصنيفًا."
  en: "Arabic Wikipedia article on Rania Al-Abdullah; used for entity facts only. It agrees with the English article on her birth (31 August 1970 in Kuwait, named Rania Faisal Sidqi Al-Yassin), her studies and pre-marriage work, her 1993 marriage and her being styled queen in 1999, and highlights her concern for children's and women's rights and her education work. Neither its infobox nor its text carries a religion field; its categories file her as a Jordanian Muslim — a filing, which never attests a school."
  es: "Artículo de Wikipedia en árabe sobre Rania Al-Abdullah; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento (31 de agosto de 1970 en Kuwait, con el nombre de Rania Faisal Sidqi Al-Yassin), sus estudios y trabajo previo al matrimonio, su matrimonio en 1993 y su coronación como reina en 1999, y destaca su preocupación por los derechos de los niños y las mujeres, así como su labor educativa. Ni su ficha informativa ni su texto incluyen un campo sobre religión; sus categorías la clasifican como musulmana jordana, clasificación que no especifica ninguna escuela."
  fr: "Article Wikipédia en arabe sur Rania Al-Abdullah; utilisé uniquement pour les informations la concernant. Il concorde avec l'article en anglais sur sa naissance (31 août 1970 au Koweït, sous le nom de Rania Faisal Sidqi Al-Yassin), ses études et son travail avant son mariage, son mariage en 1993 et son accession au titre de reine en 1999. Il souligne également son engagement pour les droits des enfants et des femmes ainsi que son action dans le domaine de l'éducation. Ni son infobox ni son texte ne comportent de champ « religion »; ses catégories la présentent comme une musulmane jordanienne, une classification qui ne mentionne jamais d'établissement scolaire."
  ur: "رانیہ عبداللہ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش ⁦(31 اگست 1970 کویت میں، رانیہ فیصل صدیقی ال یاسین کے نام سے)⁩، اس کی پڑھائی اور شادی سے پہلے کے کام، اس کی 1993 کی شادی اور 1999 میں ملکہ بننے کے بارے میں انگریزی مضمون سے متفق ہے، اور بچوں اور خواتین کے حقوق اور اس کے تعلیمی کام کے لیے اس کی تشویش کو اجاگر کرتا ہے۔ نہ اس کا انفو باکس اور نہ ہی اس کے متن میں کوئی مذہب نہیں ہے۔ اس کے زمرے اسے اردنی مسلمان کے طور پر فائل کرتے ہیں - ایک فائلنگ، جو کبھی بھی اسکول کی تصدیق نہیں کرتی ہے۔"
  tr: "Rania Al-Abdullah hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumda İngilizce uyumu (31 Ağustos 1970, Kuveyt'te Rania Faisal Sidqi Al-Yassin olarak), evlilik öncesi eğitim ve çalışma, 1993'te evlilik ve 1999'da Kraliçe unvanı; bu unvan, çocuk ve kadın haklarına olan ilgisi ile eğitim çalışmalarına olan ilgisini vurgulamaktadır. Bilgi kutusunda din için bir alan bulunmamaktadır ve sınıflandırmaları onu sınıflandırma açısından Ürdünlü Müslüman olarak tanımlamaktadır."
  id: "Artikel Wikipedia Arab tentang Rania Al-Abdullah; digunakan hanya untuk fakta entitas. Kesesuaian bahasa Inggris saat lahir (31 Agustus 1970 di Kuwait, sebagai Rania Faisal Sidqi Al-Yassin), studi dan pekerjaan sebelum menikah, menikah pada 1993, dan gelar Ratu pada 1999, menyoroti minatnya pada hak anak dan perempuan serta pekerjaan pendidikannya. Kotak info-nya tidak memuat bidang agama, dan klasifikasinya menggambarkannya sebagai Muslim Yordania dalam hal klasifikasi."
