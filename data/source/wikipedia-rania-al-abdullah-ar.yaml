summary:
  ar: "مقالة ويكيبيديا العربية عن رانيا العبد الله؛ تُستخدم لوقائع الكيان فقط. توافق الإنجليزية في الولادة (31 أغسطس 1970 في الكويت، باسم رانيا فيصل صدقي الياسين) والدراسة والعمل قبل الزواج والزواج سنة 1993 والتلقيب بالملكة سنة 1999، وتبرز اهتمامها بحقوق الطفل والمرأة وعملها التعليمي. لا يرد في صندوق معلوماتها ولا في متنها حقل للدين، وتصنيفاتها تصفها بالمسلمة الأردنية تصنيفًا."
  en: "Arabic Wikipedia article on Rania Al-Abdullah; used for entity facts only. It agrees with the English article on her birth (31 August 1970 in Kuwait, named Rania Faisal Sidqi Al-Yassin), her studies and pre-marriage work, her 1993 marriage and her being styled queen in 1999, and highlights her concern for children's and women's rights and her education work. Neither its infobox nor its text carries a religion field; its categories file her as a Jordanian Muslim — a filing, which never attests a school."
