  en: "Wikidata item Q19891676 for Hakim Abdul Hameed; used for entity facts only. It gives his birth on 14 September 1908, his death on 22 July 1999 and his occupation as a physician, carries several external identifiers, and carries no religion statement."
  es: "Elemento de Wikidata Q19891676 para Hakim Abdul Hameed; se utiliza únicamente para datos sobre la entidad. Indica su fecha de nacimiento el 14 de septiembre de 1908, su fallecimiento el 22 de julio de 1999 y su profesión como médico, contiene varios identificadores externos y no incluye ninguna declaración sobre su religión."
  fr: "L'élément Wikidata Q19891676 concernant Hakim Abdul Hameed est utilisé uniquement pour les informations relatives à l'entité. Il indique sa date de naissance (14 septembre 1908), sa date de décès (22 juillet 1999) et sa profession de médecin. Il comporte plusieurs identifiants externes et ne mentionne aucune religion."
  ur: "حکیم عبدالحمید کے لیے ویکی ڈیٹا آئٹم Q19891676؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 14 ستمبر 1908 کو ان کی پیدائش، 22 جولائی 1999 کو اس کی موت اور ایک طبیب کے طور پر اس کا پیشہ، کئی بیرونی شناخت کاروں کو رکھتا ہے، اور اس میں مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Wikidata öğesi Hakim Abdul Hamid tarafından Q19891676; yalnızca varlık bilgileri için kullanılır. Doğum tarihi olarak 14 Eylül 1908 ve ölüm tarihi 22 Temmuz 1999'da verilmiştir, mesleği hekimdir, çeşitli dış kimlik taşır ve herhangi bir dini ifade taşımaz."
  id: "Elemen Wikidata Q19891676 oleh Hakim Abdul Hamid; digunakan hanya untuk fakta entitas. Tanggal lahirnya diberikan pada 14 September 1908, dan kematiannya pada 22 Juli 1999, profesinya adalah dokter, ia memiliki beberapa identifikasi eksternal, dan tidak membawa pernyataan keagamaan apapun."
