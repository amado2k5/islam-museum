reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by its revision id with the returned id asserted equal. It gives him as born Rashid al-Khriji on 22 June 1941 at El Hamma, co-founder of the Ennahda Party and its president since November 1991, Speaker of the Assembly from 13 November 2019 to 25 July 2021, exiled in the United Kingdom for 22 years until his return on 30 January 2011, and sentenced most recently to life imprisonment in June 2026. Its infobox carries no religion field and its text names no school or madhhab for him; it attests his movement and his thought, which are not a school attestation."
