  ar: "مقالة ويكيبيديا الإنجليزية عن راشد الغنوشي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في الحامة وتعليمه في الزيتونة ودمشق، وتأسيسه حركة الاتجاه الإسلامي ثم النهضة، وسجنه ونفيه الطويل في لندن وعودته سنة 2011، ورئاسته مجلس نواب الشعب، وسجنه مجددا منذ 2023."
  en: "English Wikipedia article on Rached Ghannouchi; used for entity facts only. It recounts his birth at El Hamma and education at Zaytouna and Damascus, his founding of the Islamic Tendency Movement and then Ennahda, his imprisonments, his long London exile and 2011 return, his speakership of parliament, and his imprisonment again since 2023."
