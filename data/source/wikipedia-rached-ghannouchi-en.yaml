summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن راشد الغنوشي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في الحامة وتعليمه في الزيتونة ودمشق، وتأسيسه حركة الاتجاه الإسلامي ثم النهضة، وسجنه ونفيه الطويل في لندن وعودته سنة 2011، ورئاسته مجلس نواب الشعب، وسجنه مجددا منذ 2023."
  en: "English Wikipedia article on Rached Ghannouchi; used for entity facts only. It recounts his birth at El Hamma and education at Zaytouna and Damascus, his founding of the Islamic Tendency Movement and then Ennahda, his imprisonments, his long London exile and 2011 return, his speakership of parliament, and his imprisonment again since 2023."
  es: "Artículo de la Wikipedia en inglés sobre Rached Ghannouchi; utilizado únicamente para datos sobre la persona. Relata su nacimiento en El Hamma y su educación en Zaytouna y Damasco, la fundación del Movimiento de la Tendencia Islámica y posteriormente de Ennahda, sus encarcelamientos, su largo exilio en Londres y su regreso en 2011, su presidencia del parlamento y su nuevo encarcelamiento desde 2023."
  fr: "Article de Wikipédia en anglais sur Rached Ghannouchi; utilisé uniquement pour les informations le concernant. Il relate sa naissance à El Hamma et ses études à Zaytouna et Damas, la fondation du Mouvement de la tendance islamique puis d’Ennahda, ses emprisonnements, son long exil à Londres et son retour en 2011, sa présidence du Parlement et son nouvel emprisonnement depuis 2023."
  ur: "Rached Ghannouchi پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں الحما میں اس کی پیدائش اور زیتونہ اور دمشق میں تعلیم، اسلامی رجحانات کی تحریک اور پھر النہضہ کی بنیاد، اس کی قید، اس کی طویل لندن جلاوطنی اور 2011 میں واپسی، اس کی پارلیمنٹ کی سپیکر شپ، اور 2023 سے دوبارہ اس کی قید کا ذکر ہے۔"
  tr: "Rached Ghannouchi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Al-Hamma'daki yetiştirilme sürecini, Al-Zaytuna ve Şam'daki eğitimini, İslami Hareket'i ve ardından Ennahda'yı kurmasını, Londra'da uzun sürgün ve 2011'de dönüşünü, Halk Temsilcileri Meclisi başkanlığını ve 2023'ten beri tekrar hapis yatışını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Rached Ghannouchi; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Al-Hamma, pendidikannya di Al-Zaytuna dan Damaskus, pendirian Gerakan Islam dan kemudian Ennahda, penahanan dan pengasingan panjangnya di London serta kepulangannya pada 2011, kepresidenannya di Majelis Perwakilan Rakyat, dan penahanannya lagi sejak 2023."
