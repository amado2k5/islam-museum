summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عطا الرحمن؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 22 سبتمبر 1942 بدلهي، ودكتوراه كامبريدج 1968 في كيمياء القلويدات، ووزارتيه للعلوم والتعليم، ورئاسته لهيئة التعليم العالي (2002–2008)، وجوائزه ومنها جائزة اليونسكو للعلوم 1999. لا يرد فيها أي محتوى عن دينه الشخصي."
  en: "English Wikipedia article on Atta-ur-Rahman; used for entity facts only. It gives his birth as 22 September 1942 at Delhi, his 1968 Cambridge PhD in alkaloid chemistry, his federal ministries of science and technology and of education, his chairmanship of the Higher Education Commission (2002–2008), and his awards including the 1999 UNESCO Science Prize. It carries no content about his personal religion."
