summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عطا الرحمن؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 22 سبتمبر 1942 بدلهي، ودكتوراه كامبريدج 1968 في كيمياء القلويدات، ووزارتيه للعلوم والتعليم، ورئاسته لهيئة التعليم العالي (2002–2008)، وجوائزه ومنها جائزة اليونسكو للعلوم 1999. لا يرد فيها أي محتوى عن دينه الشخصي."
  en: "English Wikipedia article on Atta-ur-Rahman; used for entity facts only. It gives his birth as 22 September 1942 at Delhi, his 1968 Cambridge PhD in alkaloid chemistry, his federal ministries of science and technology and of education, his chairmanship of the Higher Education Commission (2002–2008), and his awards including the 1999 UNESCO Science Prize. It carries no content about his personal religion."
  es: "Artículo de la Wikipedia en inglés sobre Atta-ur-Rahman; utilizado únicamente para datos sobre la persona. Indica que nació el 22 de septiembre de 1942 en Delhi, obtuvo su doctorado en química de alcaloides en Cambridge en 1968, ocupó los ministerios federales de ciencia y tecnología y de educación, presidió la Comisión de Educación Superior (2002-2008) y recibió premios como el Premio UNESCO de Ciencias en 1999. No contiene información sobre su religión personal."
  fr: "Article de Wikipédia en anglais sur Atta-ur-Rahman; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 22 septembre 1942 à Delhi, son doctorat en chimie des alcaloïdes obtenu à Cambridge en 1968, ses fonctions de ministre fédéral des Sciences et de la Technologie et de l’Éducation, sa présidence de la Commission de l’enseignement supérieur (2002-2008) et les distinctions qu’il a reçues, dont le prix UNESCO de la science en 1999. Il ne contient aucune information sur sa religion."
