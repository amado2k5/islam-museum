summary:
  ar: "مقال مطول في الموسوعة عن تاريخ الجغرافيا الإسلامية، يذكر أن البكري طبق نظام الترتيب الأبجدي العربي على كتاب جغرافي أول مرة بقدر علمها، وأن أول معجم جغرافي أبجدي في أوروبا لم يأت إلا في القرن السادس عشر."
  en: "A long encyclopaedia article on the history of Islamic geography, recording that al-Bekri first applied the Arabic alphabetical ordering to a geographical book as far as known, and that Europe's first alphabetical geographical encyclopaedia did not appear until the sixteenth century."
  ur: "اسلامی جغرافیہ کی تاریخ پر دائرۃ المعارف کا طویل مضمون، جس میں درج ہے کہ البکری نے بقدر معلوم پہلی بار عربی حروفِ تہجی کی ترتیب جغرافیائی کتاب پر لاگو کی، اور یورپ کی پہلی حروفِ تہجی والی جغرافیائی دائرة المعارف سولہویں صدی تک نہیں آئی۔"
  es: "Un extenso artículo enciclopédico sobre la historia de la geografía islámica, que recoge que, hasta donde se sabe, al-Bekri fue el primero en aplicar el orden alfabético árabe a un libro de geografía, y que la primera enciclopedia geográfica alfabética de Europa no apareció hasta el siglo XVI."
  fr: "Un long article encyclopédique sur l'histoire de la géographie islamique, indiquant qu'al-Bekri fut le premier, à notre connaissance, à appliquer le classement alphabétique arabe à un ouvrage géographique, et que la première encyclopédie géographique alphabétique d'Europe n'apparut qu'au XVIe siècle."
