summary:
  ar: "مقالة ويكيبيديا العربية المختصرة عن عزلن محب الدين شاه. تذكر مولده في فيرق وتعليمه في جامعة نوتنغهام ومنصبيه سلطانا لفيرق (1984–2014) وملكا لماليزيا (1989–1994) ووفاته في كوالالمبور عن 86 عاما."
  en: "Arabic Wikipedia stub on Azlan Muhibbuddin Shah. It gives his birth in Perak, his education at the University of Nottingham, his offices as Sultan of Perak (1984–2014) and Yang di-Pertuan Agong (1989–1994), and his death at Kuala Lumpur aged 86."
  es: "Talón de Wikipedia en árabe sobre Azlan Muhibbuddin Shah. Da su nacimiento en Perak, su educación en la Universidad de Nottingham, sus cargos como Sultán de Perak (1984-2014) y Yang di-Pertuan Agong (1989-1994) y su muerte en Kuala Lumpur a los 86 años."
  fr: "Talon Wikipédia en arabe sur Azlan Muhibbuddin Shah. Il donne sa naissance à Perak, ses études à l'Université de Nottingham, ses fonctions de sultan de Perak (1984-2014) et de Yang di-Pertuan Agong (1989-1994) et sa mort à Kuala Lumpur à l'âge de 86 ans."
  ur: "اذلان محب الدین شاہ پر عربی ویکیپیڈیا کا سٹب۔ یہ پیراک میں ان کی پیدائش، نوٹنگھم یونیورسٹی میں ان کی تعلیم، پیراک کے سلطان (1984–2014) اور یانگ دی-پرتوان اگونگ (1989–1994) کے طور پر ان کے دفاتر، اور 86 سال کی عمر میں کوالالمپور میں ان کی موت ہے۔"
  tr: "Muhibuddin Şah'ın tahttan indirilmesiyle ilgili kısa bir Arapça Vikipedi makalesi. Bir kenarda doğdu, Nottingham Üniversitesi'nde eğitim gördü ve Firaq Sultanı (1984–2014) ile Malezya Kralı (1989–1994) olarak görev yaptı ve 86 yaşında Kuala Lumpur'da vefat etti."
  id: "Sebuah artikel singkat di Wikipedia bahasa Arab tentang penggulingan Muhibuddin Shah. Ia lahir di daerah pinggiran, menempuh pendidikan di Universitas Nottingham, dan menjabat sebagai Sultan Firaq (1984–2014) dan Raja Malaysia (1989–1994), serta wafat di Kuala Lumpur pada usia 86 tahun."
