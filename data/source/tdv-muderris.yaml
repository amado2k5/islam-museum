summary:
  ar: "مدخل «مدرس» (müderris) في موسوعة TDV الإسلامية، في جزأين: الأول بقلم نبي بوزكورت عن المعنى والمدرسة النظامية والتعيين والمراسم واللباس ومدة الخدمة والأجر، والثاني بقلم محمد إيبشيرلي عن المدرّس في الدولة العثمانية: الرتب والتعيين والتدرّج والامتحان والواجبات والانتقال إلى القضاء، وانتهاء اللقب سنة 1933. ⁦(المجلد 31، إسطنبول وأنقرة، 2020، ص 465–468)⁩."
  en: "The entry 'MÜDERRİS' (müderris, the teacher of a madrasa) in the TDV İslâm Ansiklopedisi, in two parts: part 1 by Nebi Bozkurt on the meaning of the word, the Nizamiyya origin, appointment, ceremony, dress, tenure and pay; part 2 by Mehmet İpşirli on the Ottoman müderris: ranks, appointment, the apprenticeship and examination, duties, the move to judgeship, and the end of the title in 1933 (vol. 31, 2020, pp. 465–468)."
  es: "La entrada 'MÜDERRİS' (müderris, el maestro de una madrasa) en el TDV İslâm Ansiklopedisi, en dos partes: la parte 1 por Nebi Bozkurt sobre el significado de la palabra, el origen Nizamiyya, el nombramiento, la ceremonia, la vestimenta, la duración del mandato y el salario; la parte 2 por Mehmet İpşirli sobre los müderris otomanos: rangos, nombramiento, el aprendizaje y el examen, deberes, el paso al cargo de juez y el fin del título en 1933 (vol. 31, 2020, pp. 465–468)."
  fr: "L'entrée « MÜDERRİS » (müderris, le professeur d'une madrasa) dans la TDV İslâm Ansiklopedisi, en deux parties: la partie 1 par Nebi Bozkurt sur la signification du mot, l'origine Nizamiyya, la nomination, la cérémonie, la tenue, la durée et la rémunération; la partie 2 par Mehmet İpşirli sur les müderris ottomans: les grades, la nomination, l'apprentissage et l'examen, les devoirs, le passage à la magistrature et la fin du titre en 1933 (vol. 31, 2020, pp. 465–468)."
  ur: "TDV İslâm Ansiklopedisi میں 'MÜDERRIS' ⁦(مدرسہ کے استاد)⁩ کا اندراج، دو حصوں میں: حصہ 1 نبیی بوزکورٹ کی طرف سے لفظ کے معنی، نظامیہ کی اصل، تقرری، تقریب، لباس، مدت اور تنخواہ؛ حصہ 2 بذریعہ مہمت İpşirli on the Ottoman müderris: درجہ، تقرری، اپرنٹس شپ اور امتحان، فرائض، جج شپ کی طرف قدم، اور 1933 میں عنوان کا خاتمہ ⁦(جلد 31، 2020، صفحہ 465–468)⁩۔"
