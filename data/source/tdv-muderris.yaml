reliability_note: "Read in full on 1 November 2026 in the web edition, both parts, through the browser pane: part 1 (Nebi Bozkurt, pp. 465–467) and part 2 (Mehmet İpşirli, pp. 467–468). The printed page ranges are taken from the page's own line. Part 2 is the Ottoman section; its statements about the grades and their links to judgeship are cited as the entry states them. The bibliographies were not read. The related entries (MEDRESE, MUÎD) were not read as articles. Two searches of the site, for MÜDERRİSLİK and for MUALLİM, gave no standalone article: the first lists degree names that refer to MEDRESE, the second lists personal names only; neither is cited here as a source. The entry's Ottoman material is a summary of practice; the record's wording says so."
