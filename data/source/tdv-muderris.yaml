summary:
  ar: "مدخل «مدرس» (müderris) في موسوعة TDV الإسلامية، في جزأين: الأول بقلم نبي بوزكورت عن المعنى والمدرسة النظامية والتعيين والمراسم واللباس ومدة الخدمة والأجر، والثاني بقلم محمد إيبشيرلي عن المدرّس في الدولة العثمانية: الرتب والتعيين والتدرّج والامتحان والواجبات والانتقال إلى القضاء، وانتهاء اللقب سنة 1933. (المجلد 31، إسطنبول وأنقرة، 2020، ص 465–468)."
  en: "The entry 'MÜDERRİS' (müderris, the teacher of a madrasa) in the TDV İslâm Ansiklopedisi, in two parts: part 1 by Nebi Bozkurt on the meaning of the word, the Nizamiyya origin, appointment, ceremony, dress, tenure and pay; part 2 by Mehmet İpşirli on the Ottoman müderris: ranks, appointment, the apprenticeship and examination, duties, the move to judgeship, and the end of the title in 1933 (vol. 31, 2020, pp. 465–468)."
