  ar: "مقالة ويكيبيديا الإنجليزية عن محمد العبار، رجل الأعمال الإماراتي مؤسس شركة إعمار العقارية مطوّرة برج خليفة ودبي مول؛ تذكر مولده في 8 تشرين الثاني 1956 في دبي، ودراسته في جامعة سياتل، وتأسيسه إيجل هيلز ونون ورئاسته مجموعة أمريكانا."
  en: "English Wikipedia article on Mohamed Alabbar, the Emirati businessman who founded Emaar Properties, developer of the Burj Khalifa and the Dubai Mall; it gives his birth on 8 November 1956 in Dubai, his Seattle University education, and his founding of Eagle Hills and Noon.com and chairmanship of the Americana Group."
