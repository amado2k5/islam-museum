summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد العبار، رجل الأعمال الإماراتي مؤسس شركة إعمار العقارية مطوّرة برج خليفة ودبي مول؛ تذكر مولده في 8 تشرين الثاني 1956 في دبي، ودراسته في جامعة سياتل، وتأسيسه إيجل هيلز ونون ورئاسته مجموعة أمريكانا."
  en: "English Wikipedia article on Mohamed Alabbar, the Emirati businessman who founded Emaar Properties, developer of the Burj Khalifa and the Dubai Mall; it gives his birth on 8 November 1956 in Dubai, his Seattle University education, and his founding of Eagle Hills and Noon.com and chairmanship of the Americana Group."
  es: "Artículo en inglés de la Wikipedia sobre Mohamed Alabbar, el empresario emiratí que fundó Emaar Properties, la empresa promotora del Burj Khalifa y el Dubai Mall; en él se menciona su nacimiento el 8 de noviembre de 1956 en Dubái, su formación en la Universidad de Seattle, la fundación de Eagle Hills y Noon.com, y su presidencia del Americana Group."
  fr: "L'article de Wikipédia en anglais sur Mohamed Alabbar, l'homme d'affaires émirati fondateur d'Emaar Properties, promoteur du Burj Khalifa et du Dubai Mall, mentionne sa naissance le 8 novembre 1956 à Dubaï, ses études à l'Université de Seattle, la création d'Eagle Hills et de Noon.com, ainsi que sa présidence du groupe Americana."
  ur: "ایمار پراپرٹیز کی بنیاد رکھنے والے اماراتی تاجر، برج خلیفہ اور دبئی مال کے ڈویلپر محمد الابار پر انگریزی ویکیپیڈیا کا مضمون؛ یہ 8 نومبر 1956 کو دبئی میں ان کی پیدائش، سیئٹل یونیورسٹی کی تعلیم، اور ایگل ہلز اور نون ڈاٹ کام کی بانی اور امریکانا گروپ کی چیئرمین شپ۔"
