reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A long article resting chiefly on Abdul Karim's Banglapedia entry and on Jadunath Sarkar's History of Aurangzib, vol. 5. It gives his birth on 22 November 1600 at Delhi — the day resting on William Hedges' diary — and his death as circa 1694 at Delhi, his viceroyalty of the Deccan and Shivaji's night attack on him at Pune on 5 April 1663, his two governorships of Bengal, the conquest of Chittagong, his building works in Dhaka and his family. Its infobox files his religion as Shia Islam; an infobox is not a text and the person record's faith settlement does not rest on it. Checked 1 November 2026."
