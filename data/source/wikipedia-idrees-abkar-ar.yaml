reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Fetched by revision id through the MediaWiki API on 26 October 2026; the returned revision id equals the recorded one. The article gives Idrees bin Muhammad Abkar, a Yemeni Qur'an reciter holding Emirati nationality, born in Jeddah in 1395 AH / 1975 CE; he studied the Qur'an from childhood at the Tawhid Mosque, joined memorisation circles at thirteen at the Fitani Mosque and completed memorisation at seventeen, then led prayers there for about three years. It lists his teachers (Yusuf al-Ahmadi, Abd al-Wahhab al-Zahiri, Abdullah al-Qarni, Uda al-Zahiri, Adel al-Ahmadi, Hadi Said) and the mosques he has served, ending with the Sheikh Zayed Mosque in the Emirates, where he is imam now. Its text names no school for him; its infobox gives his fiqh as Hanbali and his creed as Ahl al-Sunna wa'l-Jama'a, and the article is filed in the Hanbalis category — an infobox value and a category filing, recorded here as such."
