summary:
  ar: مقالة ويكيبيديا الروسية عن ميرزا علي أكبر صابر؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الحقيقي ميرزا ألكبر زين العابدين أوغلو طاهرزاده ومولده في شماخي في 30 مايو 1862 ووفاته في 12 يوليو 1911 ودفنه في مقبرة «يدي گنبز» ⁦(القباب السبع)⁩ في شماخي.
  en: Russian Wikipedia article on Mirza Alakbar Sabir; used for entity facts only. It gives his real name as Mirza Alekper Zeynalabdin ogly Taiirzade, his birth at Shamakhi on 30 May 1862, his death on 12 July 1911, and his burial at the Yeddi Gümbəz ('Seven Domes') cemetery in Shamakhi.
  es: "Artículo de la Wikipedia rusa sobre Mirza Alakbar Sabir; utilizado únicamente para datos sobre la persona. Indica que su nombre real era Mirza Alekper Zeynalabdin ogly Taiirzade, que nació en Shamakhi el 30 de mayo de 1862, que falleció el 12 de julio de 1911 y que fue enterrado en el cementerio Yeddi Gümbəz ('Siete Cúpulas') en Shamakhi."
  fr: "Article de Wikipédia en russe sur Mirza Alakbar Sabir; utilisé uniquement à des fins d'information sur l'entité. Il indique son véritable nom comme Mirza Alekper Zeynalabdin ogly Taiirzade, sa naissance à Shamakhi le 30 mai 1862, son décès le 12 juillet 1911 et son inhumation au cimetière Yeddi Gümbəz (« Sept Dômes ») à Shamakhi."
