summary:
  ar: "مقالة ويكيبيديا الملايوية عن توك جانغوت؛ تُستخدم لوقائع الكيان فقط. تسميه «حاجي حسن بن فڠليما مت مونس» واسم مولده «مت حسن بن مت مونس»، وتذكر مولده سنة 1853 في كامبونغ سارينغ بجيرام، باسير بوتيه، وتعليمه في مكة، وانتفاضته ضد الضرائب البريطانية، ومقتله في معركة كامبونغ بوبوه في 25 أيار 1915، وعرض جثته في كوتا بهرو ثم دفنه في باسير بيكان؛ وتصفه بأنه شخصية دينية إسلامية دون أن تسمي له مذهبًا."
  en: "Malay Wikipedia article on Tok Janggut; used for entity facts only. It names him Haji Hassan bin Panglima Mat Munas, with birth name Mat Hassan bin Mat Munas, gives his birth in 1853 at Kampung Saring, Jeram, Pasir Puteh, his education in Mecca, his rising against the British taxes, his death in battle at Kampung Pupuh on 25 May 1915, the display of his body at Kota Bharu and his burial at Pasir Pekan. It describes him as an Islamic religious figure and names no school for him."
