summary:
  ar: "مقالة ويكيبيديا الملايوية عن توك جانغوت؛ تُستخدم لوقائع الكيان فقط. تسميه «حاجي حسن بن فڠليما مت مونس» واسم مولده «مت حسن بن مت مونس»، وتذكر مولده سنة 1853 في كامبونغ سارينغ بجيرام، باسير بوتيه، وتعليمه في مكة، وانتفاضته ضد الضرائب البريطانية، ومقتله في معركة كامبونغ بوبوه في 25 أيار 1915، وعرض جثته في كوتا بهرو ثم دفنه في باسير بيكان؛ وتصفه بأنه شخصية دينية إسلامية دون أن تسمي له مذهبًا."
  en: "Malay Wikipedia article on Tok Janggut; used for entity facts only. It names him Haji Hassan bin Panglima Mat Munas, with birth name Mat Hassan bin Mat Munas, gives his birth in 1853 at Kampung Saring, Jeram, Pasir Puteh, his education in Mecca, his rising against the British taxes, his death in battle at Kampung Pupuh on 25 May 1915, the display of his body at Kota Bharu and his burial at Pasir Pekan. It describes him as an Islamic religious figure and names no school for him."
  es: "Artículo de Wikipedia en malayo sobre Tok Janggut; utilizado únicamente para datos sobre la persona. Lo nombra Haji Hassan bin Panglima Mat Munas, cuyo nombre de nacimiento era Mat Hassan bin Mat Munas. Indica que nació en 1853 en Kampung Saring, Jeram, Pasir Puteh, que se educó en La Meca, que se rebeló contra los impuestos británicos, que murió en batalla en Kampung Pupuh el 25 de mayo de 1915, que su cuerpo fue expuesto en Kota Bharu y que fue enterrado en Pasir Pekan. Lo describe como una figura religiosa islámica y no menciona ninguna escuela a la que pertenezca."
  fr: "L'article de Wikipédia en malais consacré à Tok Janggut, utilisé uniquement pour les informations le concernant, le nomme Haji Hassan bin Panglima Mat Munas (né Mat Hassan bin Mat Munas). Il indique sa naissance en 1853 à Kampung Saring, Jeram, Pasir Puteh, ses études à La Mecque, sa révolte contre les taxes britanniques, sa mort au combat à Kampung Pupuh le 25 mai 1915, l'exposition de sa dépouille à Kota Bharu et son inhumation à Pasir Pekan. L'article le décrit comme une figure religieuse islamique et ne mentionne aucune école à son sujet."
  ur: "Tok Janggut پر مالائی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا نام حاجی حسن بن پنگلیما مات موناس ہے، پیدائشی نام مات حسن بن مت موناس کے ساتھ، اس کی پیدائش 1853 میں کمپونگ سارنگ، جیرم، پسیر پوتہ میں ہوئی، مکہ میں اس کی تعلیم، انگریزوں کے ٹیکسوں کے خلاف اس کا اٹھنا، 25 مئی 1915 کو کمپونگ پپوہ کی لڑائی میں اس کی موت، اس کے جسم کی نمائش کو بھاکا بورو میں اس کے جسم کی نمائش۔ یہ اسے ایک اسلامی مذہبی شخصیت کے طور پر بیان کرتا ہے اور اس کے لیے کسی اسکول کا نام نہیں رکھتا۔"
  tr: "Tok Jangut hakkında Malayca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Adı 'Hacı Hassan bin Faglima Mat Munis' ve doğum adı 'Mat Hassan bin Mat Munis'dir; 1853'te Jiram, Basir Buteh'deki Kampong Sareng'de doğduğunu, Mekke'deki eğitimini, İngiliz vergilerine karşı ayaklanmasını, 25 Mayıs 1915'te Kampong Boboh Muharebesi'nde öldüğünü, cesedinin Kota Bahru'da sergilenmesini ve ardından Basir Bekan'da gömülmesini belirtir; onu bir tarikat olarak tanımlamadan İslami bir dini figür olarak tanımlanır."
  id: "Artikel Wikipedia Bahasa Melayu tentang Tok Jangut; digunakan hanya untuk fakta entitas tersebut. Ia bernama 'Haji Hassan bin Faglima Mat Munis' dan nama lahirnya 'Mat Hassan bin Mat Munis', serta menyebutkan kelahirannya pada tahun 1853 di Kampong Sareng in Jiram, Basir Buteh, pendidikannya di Mekah, pemberontakannya melawan pajak Inggris, kematiannya dalam Pertempuran Kampong Boboh pada 25 Mei 1915, jenazahnya dipajang di Kota Bahru, lalu dimakamkan di Basir Bekan; digambarkan sebagai tokoh agama Islam tanpa menyebut sekte."
