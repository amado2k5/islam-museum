reliability_note: "Read in full on 7 November 2026; the reading tools available in this run did not expose a revision id, so none is recorded. Used for corroborating the birth date in the Persian calendar (12 Aban 1360, in its infobox placed in Khorramshahr) and his education (building-drafting diploma; two terms of judicial law, then withdrawal). The article contradicts itself on the birth city: the infobox says Khorramshahr while the personal-life section says Abadan — the person record follows his own published statement (Khorramshahr) and notes the slip. Its lead calls him only an 'Iranian maddah' and attests no school for him in prose."
