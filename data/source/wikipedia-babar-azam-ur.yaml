summary:
  ar: "مقالة ويكيبيديا الأردية عن بابر أعظم؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 15 أكتوبر 1994 في لاهور ومسيرته مع باكستان وقيادته المنتخب، وتصف أسرته بأنها أسرة بنجابية مسلمة من لاهور."
  en: "Urdu Wikipedia article on Babar Azam; used for entity facts only. It records his birth on 15 October 1994 in Lahore, his Pakistan career and captaincy, and describes his family as a Punjabi Muslim family of Lahore — family background, naming no school for him."
  es: "Artículo de Wikipedia en urdu sobre Babar Azam; utilizado únicamente para datos sobre la persona. Registra su nacimiento el 15 de octubre de 1994 en Lahore, su trayectoria en la selección de Pakistán y su capitanía, y describe a su familia como una familia musulmana punjabí de Lahore; sin mencionar su escuela."
  fr: "Article Wikipédia en ourdou sur Babar Azam; utilisé uniquement pour les informations sur l'entité. Il mentionne sa naissance le 15 octobre 1994 à Lahore, sa carrière au sein de l'équipe nationale du Pakistan et son capitanat, et décrit sa famille comme une famille musulmane punjabi de Lahore — origine familiale, sans mentionner son école."
  ur: "بابر اعظم پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 15 اکتوبر 1994 کو لاہور میں ان کی پیدائش، ان کے پاکستانی کیریئر اور کپتانی کو ریکارڈ کیا گیا ہے، اور ان کے خاندان کو لاہور کے ایک پنجابی مسلمان خاندان کے طور پر بیان کیا گیا ہے - خاندانی پس منظر، اس کے لیے کسی اسکول کا نام نہیں رکھا گیا ہے۔"
  tr: "Babur Azam hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 15 Ekim 1994'te Lahor'da Pakistan ve seçilmiş liderliği ile yolculuğu ve ailesi Lahor'dan Pencaplı Müslüman bir aile olarak tanımlanır."
  id: "Artikel Wikipedia Urdu tentang Babur Azam; hanya digunakan untuk fakta entitas. Ia disebutkan di Lahore pada 15 Oktober 1994, dan perjalanannya bersama Pakistan serta kepemimpinan terpilihnya, dan keluarganya digambarkan sebagai keluarga Muslim Punjabi dari Lahore."
