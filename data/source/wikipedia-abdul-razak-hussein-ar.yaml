  ar: "مقالة ويكيبيديا العربية عن عبد الرزاق حسين (1922–1976)؛ تُستخدم لوقائع الكيان فقط. موجز يذكر مولده في 11 مارس 1922 ووفاته في 14 يناير 1976 ورئاسته الثانية لوزراء ماليزيا من سبتمبر 1970 حتى وفاته."
  en: "Arabic Wikipedia article on Abdul Razak Hussein (1922–1976); used for entity facts only. A short article giving his birth on 11 March 1922, his death on 14 January 1976, and his tenure as Malaysia's second prime minister from September 1970 until his death."
  es: "Artículo en árabe de la Wikipedia sobre Abdul Razak Hussein (1922-1976); utilizado únicamente para datos sobre la persona. Un breve artículo que indica su fecha de nacimiento, el 11 de marzo de 1922, su fallecimiento, el 14 de enero de 1976, y su mandato como segundo primer ministro de Malasia desde septiembre de 1970 hasta su muerte."
  fr: "Article de Wikipédia en arabe sur Abdul Razak Hussein (1922-1976); utilisé uniquement à des fins d'information sur l'entité. Cet article concis indique sa naissance le 11 mars 1922, son décès le 14 janvier 1976 et son mandat de deuxième Premier ministre de Malaisie, de septembre 1970 jusqu'à sa mort."
  ur: "عبدالرزاق حسین (1922-1976) پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 11 مارچ 1922 کو ان کی پیدائش، 14 جنوری 1976 کو ان کی موت، اور ستمبر 1970 سے ان کی موت تک ملائیشیا کے دوسرے وزیر اعظم کے طور پر ان کی مدت کے بارے میں ایک مختصر مضمون۔"
  tr: "Abdul Razzaq Hussain (1922–1976) hakkında Arapça Vikipedi makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. Özet, doğumunun 11 Mart 1922'de, 14 Ocak 1976'da öldüğünü ve Eylül 1970'ten ölümüne kadar Malezya bakanlığı olarak ikinci kez başbakanlığını belirtir."
  id: "Artikel Wikipedia Arab tentang Abdul Razzaq Hussain (1922–1976); digunakan hanya untuk fakta entitas. Ringkasan menyebutkan kelahirannya pada 11 Maret 1922, wafat pada 14 Januari 1976, dan masa jabatan perdana menteri Malaysia kedua dari September 1970 hingga wafatnya."
