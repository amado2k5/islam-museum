summary:
  ar: "مقالة ويكيبيديا العربية عن محمد أيوب خان رئيس باكستان؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته العسكرية ورئاسته، ويذكر صندوق معلوماتها دينه «الإسلام» عامة دون مذهب."
  en: "Arabic Wikipedia article on Muhammad Ayub Khan, president of Pakistan; used for entity facts only. It recounts his military career and presidency; its infobox gives his religion as Islam in general, naming no school."
  es: "Artículo de Wikipedia en árabe sobre Muhammad Ayub Khan, presidente de Pakistán; se utiliza únicamente para obtener información sobre la persona. Relata su carrera militar y su presidencia; su ficha informativa indica que profesaba el islam en general, sin mencionar ninguna escuela específica."
  fr: "Article de Wikipédia en arabe sur Muhammad Ayub Khan, président du Pakistan; utilisé uniquement à des fins d'information sur l'entité. Il retrace sa carrière militaire et sa présidence; son infobox indique qu'il est musulman, sans préciser d'école."
  ur: "پاکستان کے صدر محمد ایوب خان پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کے فوجی کیریئر اور صدارت کا ذکر کرتا ہے۔ اس کا انفو باکس اس کے مذہب کو عام طور پر اسلام دیتا ہے، کسی اسکول کا نام نہیں دیتا۔"
  tr: "Pakistan Cumhurbaşkanı Muhammed Ayub Han hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Askeri kariyerini ve başkanlığını anlatır ve bilgi kutusunda dini genel olarak \"İslam\" olarak geçer, herhangi bir mezhep olmadan belirtilir."
  id: "Artikel Wikipedia berbahasa Arab tentang Muhammad Ayub Khan, Presiden Pakistan; hanya digunakan untuk fakta entitas. Artikel ini menceritakan karier militer dan kepresidenannya, dan infobox menyebutkan agamanya sebagai \"Islam\" secara umum tanpa sekte apapun."
