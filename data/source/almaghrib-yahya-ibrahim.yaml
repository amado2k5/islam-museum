summary:
  ar: "صفحة معهد المغرب لدورة «المطهَّرة: دراسة سورة مريم» التي يدرّسها يحيى إبراهيم؛ سيرة مدرّسه المرفقة تصفه بأنه متخصص في التزكية والقرآن، درس التفسير والفقه والحديث على علماء من الحجاز ومصر، مطلوب لدى منظمات ومدارس وحكومات، وحاصل على جائزة غرب أستراليا لخدمة المجتمع متعدد الثقافات للتميز الفردي."
  en: "AlMaghrib Institute's page for the course 'Purified: A Study of Surat Maryam', taught by Yahya Ibrahim; its attached instructor biography describes him as a specialist in spirituality and the Qur'an who studied tafsir, fiqh and hadith with scholars from the Hijaz and Egypt, is sought after by organisations, schools and government, and was awarded the West Australian Multicultural Community Service Award for Individual Excellence."
