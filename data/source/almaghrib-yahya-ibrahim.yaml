summary:
  ar: "صفحة معهد المغرب لدورة «المطهَّرة: دراسة سورة مريم» التي يدرّسها يحيى إبراهيم؛ سيرة مدرّسه المرفقة تصفه بأنه متخصص في التزكية والقرآن، درس التفسير والفقه والحديث على علماء من الحجاز ومصر، مطلوب لدى منظمات ومدارس وحكومات، وحاصل على جائزة غرب أستراليا لخدمة المجتمع متعدد الثقافات للتميز الفردي."
  en: "AlMaghrib Institute's page for the course 'Purified: A Study of Surat Maryam', taught by Yahya Ibrahim; its attached instructor biography describes him as a specialist in spirituality and the Qur'an who studied tafsir, fiqh and hadith with scholars from the Hijaz and Egypt, is sought after by organisations, schools and government, and was awarded the West Australian Multicultural Community Service Award for Individual Excellence."
  es: "La página del Instituto AlMaghrib para el curso \"Purificado: Un estudio de la Sura Maryam\", impartido por Yahya Ibrahim, cuya biografía adjunta lo describe como un especialista en espiritualidad y el Corán que estudió tafsir, fiqh y hadith con eruditos del Hiyaz y Egipto, es muy solicitado por organizaciones, escuelas y el gobierno, y fue galardonado con el Premio de Servicio Comunitario Multicultural de Australia Occidental a la Excelencia Individual."
  fr: "La page de l'Institut AlMaghrib consacrée au cours « Purifié: une étude de la sourate Maryam », dispensé par Yahya Ibrahim, présente un instructeur dont la biographie jointe le décrit comme un spécialiste de la spiritualité et du Coran ayant étudié le tafsir, le fiqh et le hadith auprès d'érudits du Hedjaz et d'Égypte. Il est recherché par des organisations, des écoles et le gouvernement, et a reçu le prix d'excellence individuelle du service communautaire multiculturel d'Australie-Occidentale."
  ur: "المغرب انسٹی ٹیوٹ کا صفحہ 'پیوریفائیڈ: اے اسٹڈی آف سورت مریم'، جو یحییٰ ابراہیم نے پڑھایا؛ اس کے منسلک انسٹرکٹر کی سوانح عمری میں اسے روحانیت اور قرآن کے ماہر کے طور پر بیان کیا گیا ہے جس نے حجاز اور مصر کے اسکالرز کے ساتھ تفسیر، فقہ اور حدیث کا مطالعہ کیا، تنظیموں، اسکولوں اور حکومت کی طرف سے اسے تلاش کیا گیا، اور اسے انفرادی فضیلت کے لیے مغربی آسٹریلیا کے ملٹی کلچرل کمیونٹی سروس ایوارڈ سے نوازا گیا۔"
