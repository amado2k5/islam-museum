reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth on 28 June 1766 in Tafilalt to Sidi Mohammed III and a wife of the Ahlaf tribe, his religious education, his reign of 1792–1822 after a seven-year civil war, the end of corsairing, his closure of trade with Europe alongside continued relations with the United States (including the 1821 gift of the Tangier Legation building), his capture by the Ait Umalu in 1819, and his death on 28 November 1822 at Marrakesh. Its religious-policy section, citing Miller's History of Modern Morocco, records his inspiration by the Wahhabi call after Saud ibn Abdulaziz's letter of 1811, his bans on music and dance in ceremonies, shrine pilgrimages and festivals, the removal of the dome over his father's grave in 1812, his 1806 treatise criticising Sufi practices and his sermon on God's oneness; its text calls him a follower of Wahhabism, citing an 1857 bulletin, and its infobox files Sunni Islam (Wahhabism). No text in it names a legal school for the man himself. Checked 1 November 2026."
