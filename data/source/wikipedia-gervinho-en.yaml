summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جرفينيو؛ تُستخدم لوقائع الكيان فقط. تروي مسيرة المهاجم العاجي المولود في 27 مايو 1987 بأنياما: ثنائية ليل 2010–11، وأرسنال وروما وخبي وبارما وطرابزون سبور، وأكثر من 80 مباراة مع ساحل العاج ولقب أمم أفريقيا 2015. لا تذكر ديانته في أي موضع."
  en: "English Wikipedia article on Gervinho; used for entity facts only. It records the Ivorian forward born 27 May 1987 at Anyama: the Lille league-and-cup double of 2010–11, Arsenal, Roma, Hebei China Fortune, Parma and Trabzonspor, over 80 Ivory Coast caps and the 2015 Africa Cup of Nations title. It makes no statement of his religion anywhere."
  es: "Artículo de Wikipedia en inglés sobre Gervinho; utilizado únicamente para datos sobre la persona. En él se registra al delantero marfileño nacido el 27 de mayo de 1987 en Anyama: el doblete de liga y copa con el Lille en la temporada 2010-11, Arsenal, Roma, Hebei China Fortune, Parma y Trabzonspor, más de 80 partidos con la selección de Costa de Marfil y el título de la Copa Africana de Naciones de 2015. No se menciona su religión en ningún momento."
  fr: "Article Wikipédia en anglais sur Gervinho; utilisé uniquement pour les informations le concernant. Il retrace le parcours de l'attaquant ivoirien né le 27 mai 1987 à Anyama: le doublé championnat-coupe avec Lille en 2010-2011, ses passages à Arsenal, la Roma, le Hebei China Fortune, Parme et Trabzonspor, plus de 80 sélections en équipe nationale de Côte d'Ivoire et le titre de champion d'Afrique des Nations en 2015. Aucune mention de sa religion n'est faite."
