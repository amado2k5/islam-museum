  ar: "الصفحة «Unicode 1.0 Code Charts (CodeCharts2.pdf)» في Unicode Consortium؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: الحروف الطباعية والطباعة العربية وكتلة يونيكود العربية."
  en: "The page \"Unicode 1.0 Code Charts (CodeCharts2.pdf)\" (Unicode Consortium), named in a research file supplied to the museum on 21 November 2026; the museum did not open the page, and the founder approved using the file without re-verification. Used for: Arabic typography and the Unicode Arabic block."
