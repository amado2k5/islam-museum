reliability_note: "Encyclopedia article retrieved in full at the stated revision, its revision id fetched live from the MediaWiki API and re-asserted identical on a second query the same day. It is internally inconsistent on one point — its lead narrative says he 'succeeded his father' in Damascus while its own family section records that his uncle Sulayman Pasha, governor of Damascus, died in 1743 and As'ad then took the post; the family-section chronology is followed in the person record. It gives two accounts of his death (execution aboard a ship in March 1758; execution at Ankara per the Türkiye Diyanet Vakfı Encyclopaedia of Islam, with his tomb there dated 1171 AH); both are preserved. It names no school or affiliation for the man himself."
