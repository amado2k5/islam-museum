  ar: "مقال الإنجليزية عن أسعد باشا العظم ⁦(نحو 1706 – مارس 1758)⁩، والي دمشق العثماني 1743–1757: أصله من معرة النعمان، وسحقه جنود الإنكشارية سنة 1746، وحمايته قافلة الحج الشامية، وبناؤه قصر العظم بدمشق (1750) وخان أسعد باشا (1752)، وعزله سنة 1757 وروايتا وفاته."
  en: "English encyclopedia article on As'ad Pasha al-Azm (c. 1706 – March 1758), Ottoman governor of Damascus 1743–1757: his origins in Ma'arrat al-Nu'man, his crushing of the janissaries in 1746, his protection of the Syrian Hajj caravan, his building of the Azm Palace in Damascus (1750) and Khan As'ad Pasha (1752), his deposition in 1757 and the two accounts of his death."
