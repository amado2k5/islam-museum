summary:
  ar: "مقال الإنجليزية عن أسعد باشا العظم ⁦(نحو 1706 – مارس 1758)⁩، والي دمشق العثماني 1743–1757: أصله من معرة النعمان، وسحقه جنود الإنكشارية سنة 1746، وحمايته قافلة الحج الشامية، وبناؤه قصر العظم بدمشق (1750) وخان أسعد باشا (1752)، وعزله سنة 1757 وروايتا وفاته."
  en: "English encyclopedia article on As'ad Pasha al-Azm (c. 1706 – March 1758), Ottoman governor of Damascus 1743–1757: his origins in Ma'arrat al-Nu'man, his crushing of the janissaries in 1746, his protection of the Syrian Hajj caravan, his building of the Azm Palace in Damascus (1750) and Khan As'ad Pasha (1752), his deposition in 1757 and the two accounts of his death."
  es: "Artículo de enciclopedia inglesa sobre As'ad Pasha al-Azm (c. 1706 – marzo de 1758), gobernador otomano de Damasco entre 1743 y 1757: sus orígenes en Ma'arrat al-Nu'man, su aplastamiento de los jenízaros en 1746, su protección de la caravana siria del Hajj, la construcción del Palacio Azm en Damasco (1750) y del Khan As'ad Pasha (1752), su deposición en 1757 y los dos relatos sobre su muerte."
  fr: "Article d'encyclopédie anglaise sur As'ad Pasha al-Azm (vers 1706 – mars 1758), gouverneur ottoman de Damas de 1743 à 1757: ses origines à Ma'arrat al-Nu'man, l'écrasement des janissaires en 1746, sa protection de la caravane syrienne du Hajj, la construction du palais Azm à Damas (1750) et du Khan As'ad Pasha (1752), sa destitution en 1757 et les deux récits de sa mort."
  ur: "اسد پاشا الاعظم ⁦(c. 1706 - مارچ 1758)⁩ پر انگریزی انسائیکلوپیڈیا کا مضمون، دمشق کے عثمانی گورنر 1743–1757: اس کی ابتدا معرّت النعمان میں، اس کا 1746 میں جنیسریوں کو کچلنا، اس کا شامی محلہ کی عمارت، عزاماس کی عمارت کا تحفظ۔ (1750) اور خان اسد پاشا (1752)، 1757 میں ان کی معزولی اور ان کی موت کے دو واقعات۔"
  tr: "Asaad Paşa el-Azm (yaklaşık 1706 – Mart 1758), Şam'ın Osmanlı valisi 1743–1757 yılları arasında yer alan İngilizce makale: aslen Maarrat el-Numan'dan, 1746'da Yeniçeri askerleri tarafından ezilmiş, Levant hac kervanı tarafından korunan, Şam'da el-Azm Sarayı (1750) ve Han As'ad Paşa (1752) inşa edilmiş, 1757'de görevden alınmış ve ölüm anlatımları bulunmaktadır."
  id: "Artikel dalam bahasa Inggris tentang Asaad Pasha al-Azm (sekitar 1706 – Maret 1758), gubernur Ottoman Damaskus 1743–1757: berasal dari Maarrat al-Numan, dihancurkan oleh tentara Janissary pada tahun 1746, dilindungi oleh karavan ziarah Levantine, membangun Istana al-Azm di Damaskus (1750) dan Khan As'ad Pasha (1752), diberhentikan pada tahun 1757, beserta catatan kematiannya."
