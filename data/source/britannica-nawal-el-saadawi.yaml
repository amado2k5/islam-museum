summary:
  ar: "مدخل موسوعة بريتانيكا عن نوال السعداوي: طبيبة وكاتبة مصرية ومدافعة عن حقوق المرأة؛ يوثّق تعليمها وفصلها من وزارة الصحة وسجنها سنة 1981 ودعاوى الردة ضدها، ولا يذكر لها انتماءً دينيًا."
  en: "Encyclopaedia Britannica entry on Nawal El Saadawi: Egyptian physician, author and advocate of women's rights; it documents her education, her expulsion from the health ministry, her 1981 jailing and the apostasy accusations against her, and records no religious affiliation for her."
  es: "Entrada de la Enciclopedia Británica sobre Nawal El Saadawi: médica, escritora y defensora de los derechos de la mujer egipcia; documenta su educación, su expulsión del Ministerio de Salud, su encarcelamiento en 1981 y las acusaciones de apostasía en su contra, y no registra ninguna afiliación religiosa para ella."
  fr: "L'article de l'Encyclopædia Britannica sur Nawal El Saadawi: médecin, auteure et militante égyptienne pour les droits des femmes, documente sa formation, son expulsion du ministère de la Santé, son emprisonnement en 1981 et les accusations d'apostasie portées contre elle, sans mentionner d'appartenance religieuse."
