reliability_note: "Independent encyclopedia account, first published 21 October 2009 and updated to 23 October 2026; read in full on 24 October 2026. It gives her birth on 27 October 1931 at Kafr Tahla and death on 21 March 2021 at Cairo, her Cairo University M.D. (1955) and Columbia M.P.H. (1966), her expulsion from the health ministry in 1972 over Women and Sex (1969), her two months' imprisonment in 1981 writing Memoirs from the Women's Prison with a smuggled cosmetic pencil, the founding of the Arab Women's Solidarity Association in 1982 and its closure by the government in 1991, and the legal challenges against her including accusations of apostasy, the 2002 forced-divorce attempt and the case she won in May 2008. It dates her Ain Shams psychiatric research to 1972-74 where the English article gives 1973-76; the variance is recorded in the prose's references note. It names no religion for her."
