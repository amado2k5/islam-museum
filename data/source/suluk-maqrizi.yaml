  ar: السلوك لمعرفة دول الملوك — المقريزي (تحقيق سعيد عبد الفتاح عاشور)
  en: Al-Suluk li-Ma'rifat Duwal al-Muluk — al-Maqrizi (ed. Sa'id Abd al-Fattah Ashur)
  ur: السلوک لمعرفۃ دول الملوک — مقریزی (تحقیق سعید عبد الفتاح عاشور)
summary:
  ar: "تاريخ تقي الدين أحمد بن علي المقريزي ⁦(ت 845هـ)⁩ لدولتي المماليك البحرية والبرجية، مرتب على السنين؛ يغطي القسم الثالث من الجزء الرابع سنوات 841–844هـ {cite:suluk-maqrizi p. 1053}."
  en: "Taqi al-Din Ahmad ibn Ali al-Maqrizi's (d. 845 AH) annalistic history of the Mamluk sultanate; the third part of volume four covers the years 841–844 AH {cite:suluk-maqrizi p. 1053}."
  ur: "تقی الدین احمد بن علی مقریزی ⁦(وفات 845ھ)⁩ کی ممالیك سلطنت کی سال بہ سال تاریخ؛ چوتھے جلد کا تیسرا حصہ 841–844ھ کے سال گزارتا ہے {cite:suluk-maqrizi p. 1053}۔"
