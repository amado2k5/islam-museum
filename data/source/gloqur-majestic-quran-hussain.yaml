summary:
  ar: "تدوينة لصهيب سعيد، 17 يوليو 2020، عن «القرآن المجيد» لمشرّف حسين، الصادر في نوتنغهام سنة 2018 بإنجليزية بسيطة، والمراجعات التي أُدخلت عليه بعد اجتماع لأئمة بريطانيين ونشر قائمة تصحيحات."
  en: "A post by Sohaib Saeed, 17 July 2020, on Musharraf Hussain's The Majestic Qur'an (Nottingham, 2018), a plain-English translation, and the corrections made to it after a meeting of British imams and the publication of an errata list."
  ur: "صہیب سعید کی تحریر، 17 جولائی 2020، مشرف حسین کے «دی مجسٹک قرآن» ⁦(نوٹنگھم، 2018)⁩ پر، جو سادہ انگریزی میں ہے، اور برطانوی ائمہ کے اجلاس کے بعد شائع ہونے والی تصحیحات کی فہرست پر۔"
  es: "Artículo de Sohaib Saeed, del 17 de julio de 2020, sobre El majestuoso Corán de Musharraf Hussain (Nottingham, 2018), una traducción al inglés sencillo, y las correcciones realizadas tras una reunión de imanes británicos y la publicación de una lista de erratas."
  fr: "Article de Sohaib Saeed, 17 juillet 2020, sur The Majestic Qur'an de Musharraf Hussain (Nottingham, 2018), une traduction en anglais simple, et les corrections qui y ont été apportées après une réunion d'imams britanniques et la publication d'une liste d'errata."
  tr: "Suhaib Saeed'in 17 Temmuz 2020 tarihli yazısı, 2018'de Nottingham'da basit İngilizce olarak yayımlanan Musharraf Hussein tarafından yazılmış 'Kutsal Kur'an' ve İngiliz imamlarının toplantısı ile bir düzeltme listesinin yayımlanmasından sonra yapılan revizyonlar."
  id: "Sebuah tulisan oleh Suhaib Saeed, 17 Juli 2020, tentang 'Al-Qur'an Suci' oleh Musharraf Hussein, yang diterbitkan di Nottingham pada 2018 dalam bahasa Inggris sederhana, serta revisi yang dilakukan setelah pertemuan imam Inggris dan publikasi daftar koreksi."
