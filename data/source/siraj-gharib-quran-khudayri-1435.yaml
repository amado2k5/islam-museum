label: { ar: "السراج في بيان غريب القرآن لمحمد بن عبد العزيز الخضيري ⁦(كرسي القرآن الكريم وعلومه بجامعة الملك سعود، ط2 1435هـ)⁩", en: "Muhammad ibn Abd al-Aziz al-Khudayri, al-Siraj fi bayan gharib al-Qur'an (Chair of Qur'anic Sciences, King Saud University, 2nd ed. 1435 AH)" }
summary:
  ar: "«السراج في بيان غريب القرآن» للدكتور محمد بن عبد العزيز الخضيري، أستاذ القرآن وعلومه بجامعة الملك سعود، الطبعة الثانية، كرسي القرآن الكريم وعلومه بجامعة الملك سعود، الرياض، 1435هـ ⁦(فهرسة 1432هـ، 352 صفحة)⁩، بتقديم المشرف على الكرسي عبد الرحمن بن معاضة الشهري."
  en: "al-Siraj fi bayan gharib al-Qur'an by Dr Muhammad ibn Abd al-Aziz al-Khudayri, professor of Qur'an and its sciences at King Saud University, 2nd ed., Chair of the Holy Qur'an and its Sciences, King Saud University, Riyadh, 1435 AH (catalogued 1432, 352 pp.), with a foreword by the Chair's supervisor Abd al-Rahman ibn Mu'ada al-Shihri."
  es: "al-Siraj fi bayan gharib al-Qur'an por el Dr. Muhammad ibn Abd al-Aziz al-Khudayri, profesor del Corán y sus ciencias en la Universidad Rey Saud, 2.ª ed., Cátedra del Sagrado Corán y sus Ciencias, Universidad Rey Saud, Riad, 1435 AH (catalogado en 1432, 352 pp.), con un prólogo del supervisor de la Cátedra, Abd al-Rahman ibn Mu'ada al-Shihri."
  fr: "al-Siraj fi bayan gharib al-Qur'an par le Dr Muhammad ibn Abd al-Aziz al-Khudayri, professeur de Coran et de ses sciences à l'Université du Roi Saoud, 2e éd., Chaire du Saint Coran et de ses sciences, Université du Roi Saoud, Riyad, 1435 AH (catalogué 1432, 352 pp), avec une préface du superviseur de la Chaire, Abd al-Rahman ibn Mu'ada al-Shihri."
  ur: "السراج فی بیان غریب القرآن بذریعہ ڈاکٹر محمد بن عبدالعزیز الخدیری، کنگ سعود یونیورسٹی میں قرآن اور اس کے علوم کے پروفیسر، دوسرا ایڈیشن، چیئر آف ہولی قرآن اور اس کے سائنسز، کنگ سعود یونیورسٹی، ریاض، 1435 ہجری ⁦(4pp32 کے لیے کیٹلاگ)⁩۔ چیئر کے نگران عبدالرحمن بن معاذ الشہری۔"
  tr: "\"Al-Siraj fi Bayan Gharib al-Qur'an\" Dr. Muhammed bin Abdülaziz El-Khudairi tarafından, Kur'an ve Bilimleri Profesörü, Kral Suud Üniversitesi, Riyad, İkinci Baskı, Kur'an-ı Kerim ve Bilimleri Kürsüsü, 1435 Hicri (İndeks 1432 H, 352 sayfa), kürsünün danışmanı Abdulrahman bin Muadah Al-Shahri tarafından sunulmuştur."
  id: "\"Al-Siraj fi Bayan Gharib al-Qur'an\" oleh Dr. Muhammad bin Abdulaziz Al-Khudairi, Profesor Al-Quran dan Ilmu-ilmunya di Universitas King Saud, Edisi Kedua, Ketua Al-Quran dan Ilmu-ilmunya di Universitas King Saud, Riyadh, 1435 AH (Indeks 1432 H, 352 halaman), disampaikan oleh pembimbing ketua, Abdulrahman bin Muadah Al-Shahri."
