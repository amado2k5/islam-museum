label: { ar: "أسباب نزول القرآن للواحدي ⁦(تحقيق كمال بسيوني زغلول، دار الكتب العلمية 1991)⁩", en: "al-Wahidi, Asbab nuzul al-Qur'an (ed. Kamal Basyuni Zaghlul, Dar al-Kutub al-Ilmiyya, 1991)" }
summary:
  ar: "«أسباب نزول القرآن» لأبي الحسن علي بن أحمد الواحدي ⁦(ت 468هـ)⁩، تحقيق ودراسة كمال بسيوني زغلول، دار الكتب العلمية، بيروت، الطبعة الأولى 1411هـ/1991م، اعتماداً على نشرة السيد أحمد صقر، مع ترجمة للمؤلف وتخريج للأحاديث."
  en: "Asbab nuzul al-Qur'an by Abu al-Hasan Ali ibn Ahmad al-Wahidi (d. 468 AH), edited with a study by Kamal Basyuni Zaghlul, Dar al-Kutub al-Ilmiyya, Beirut, 1st ed. 1411/1991, based on al-Sayyid Ahmad Saqr's edition, with a biography of the author and documentation of the hadiths."
  es: "Asbab nuzul al-Qur'an por Abu al-Hasan Ali ibn Ahmad al-Wahidi (m. 468 AH), editado con un estudio de Kamal Basyuni Zaghlul, Dar al-Kutub al-Ilmiyya, Beirut, 1ª ed. 1411/1991, basado en la edición de al-Sayyid Ahmad Saqr, con una biografía del autor y documentación de los hadices."
  fr: "Asbab nuzul al-Qur'an par Abu al-Hasan Ali ibn Ahmad al-Wahidi (mort en 468 AH), édité avec une étude de Kamal Basyuni Zaghlul, Dar al-Kutub al-Ilmiyya, Beyrouth, 1ère éd. 1411/1991, basé sur l'édition d'al-Sayyid Ahmad Saqr, avec une biographie de l'auteur et une documentation des hadiths."
  ur: "قرآن کے نزول کے اسباب ابو الحسن علی ابن احمد الواحیدی ⁦(متوفی 468ھ)⁩، کمال باسیونی زغلول، دار الکتب العلمیہ، بیروت، 1st ایڈیشن کے مطالعہ کے ساتھ ترمیم شدہ۔ 1411/1991، السید احمد صقر کے ایڈیشن پر مبنی، مصنف کی سوانح حیات اور احادیث کی دستاویزات کے ساتھ۔"
  tr: "\"Asbab Nuzul al-Qur'an\", Abu al-Hasan Ali ibn Ahmad al-Wahidi (ö. 468 H) tarafından, Kamal Basyuni Zaghloul tarafından düzenlenmiş ve incelenmiştir, Dar al-Kutub al-Ilmiyya, Beyrut, ilk baskı 1411 Hicri / 1991 CE, Seyyid Ahmed Saqr'ın yayımına dayanmakta, yazarın biyografisi ve hadislerin doğruluğu ile."
  id: "\"Asbab Nuzul al-Qur'an\" oleh Abu al-Hasan Ali ibn Ahmad al-Wahidi (wafat 468 H), disunting dan dipelajari oleh Kamal Basyuni Zaghloul, Dar al-Kutub al-Ilmiyya, Beirut, edisi pertama 1411 H / 1991 M, berdasarkan publikasi Sayyid Ahmad Saqr, dengan biografi penulis dan pengesahan hadits."
