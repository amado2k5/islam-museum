  ar: "مقالة ويكيبيديا الإنجليزية عن عبد اللطيف الحموشي ⁦(وُلد سنة ١٩٦٦ في تازة)⁩، المسؤول الأمني المغربي الذي يرأس المديرية العامة للأمن الوطني والمديرية العامة لمراقبة التراب الوطني؛ تذكر دراسته للحقوق وصعوده في جهاز الاستخبارات وادعاءات التعذيب والنزاع الدبلوماسي مع فرنسا وتحقيق بيغاسوس وأوسمته، ولا تسمي له دينًا."
  en: "English Wikipedia article on Abdellatif Hammouchi (born 1966 in Taza), Moroccan security official who heads both the national police (DGSN) and the domestic intelligence service (DGST); it records his law studies, his rise through the DST, the torture allegations and diplomatic dispute with France, the Pegasus investigation and his decorations, and names no faith for him."
