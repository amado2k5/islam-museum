summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد اللطيف الحموشي ⁦(وُلد سنة ١٩٦٦ في تازة)⁩، المسؤول الأمني المغربي الذي يرأس المديرية العامة للأمن الوطني والمديرية العامة لمراقبة التراب الوطني؛ تذكر دراسته للحقوق وصعوده في جهاز الاستخبارات وادعاءات التعذيب والنزاع الدبلوماسي مع فرنسا وتحقيق بيغاسوس وأوسمته، ولا تسمي له دينًا."
  en: "English Wikipedia article on Abdellatif Hammouchi (born 1966 in Taza), Moroccan security official who heads both the national police (DGSN) and the domestic intelligence service (DGST); it records his law studies, his rise through the DST, the torture allegations and diplomatic dispute with France, the Pegasus investigation and his decorations, and names no faith for him."
  es: "Artículo de la Wikipedia en inglés sobre Abdellatif Hammouchi (nacido en 1966 en Taza), funcionario de seguridad marroquí que dirige tanto la policía nacional (DGSN) como el servicio de inteligencia interior (DGST); en él se recogen sus estudios de derecho, su ascenso en la DST, las acusaciones de tortura y la disputa diplomática con Francia, la investigación Pegasus y sus condecoraciones, y no se menciona ninguna religión en su nombre."
  fr: "L'article de Wikipédia en anglais sur Abdellatif Hammouchi (né en 1966 à Taza), haut responsable de la sécurité marocaine qui dirige à la fois la police nationale (DGSN) et le service de renseignement intérieur (DGST); il relate ses études de droit, son ascension au sein du DST, les allégations de torture et le différend diplomatique avec la France, l'enquête Pegasus et ses décorations, et ne mentionne aucune religion à son sujet."
  ur: "عبدلطیف ہموچی ⁦(تزا میں 1966 میں پیدا ہوئے)⁩ پر انگریزی ویکیپیڈیا کا مضمون، مراکشی سیکورٹی اہلکار جو قومی پولیس (DGSN) اور گھریلو انٹیلی جنس سروس (DGST) دونوں کے سربراہ ہیں؛ اس میں اس کے قانون کے مطالعے، ڈی ایس ٹی کے ذریعے اس کا عروج، فرانس کے ساتھ تشدد کے الزامات اور سفارتی تنازعات، پیگاسس کی تحقیقات اور اس کی سجاوٹ کو ریکارڈ کیا گیا ہے، اور اس کے لیے کوئی ایمان نہیں ہے۔"
