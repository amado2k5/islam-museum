summary:
  ar: "مقالة ويكيبيديا الأوزبكية عن عبد الله قادري (1894–1938)؛ يحمل صندوق معلوماتها «الإسلام» في خانة الدين بصيغة عامة، ويذكر متنها أنه أُعدم مع زملائه المتفقي الفكر ومنهم جولبن وفطرت."
  en: "The Uzbek Wikipedia article on Abdulla Qodiriy (1894–1938); its infobox records Islam in general in the religion field, and its text states that he was executed together with like-minded colleagues including Choʻlpon and Fitrat."
  es: "El artículo de Wikipedia en uzbeko sobre Abdulla Qodiriy (1894-1938); su ficha informativa registra el Islam en general en el campo de la religión, y su texto afirma que fue ejecutado junto con colegas de ideas afines, incluidos Choʻlpon y Fitrat."
  fr: "L'article de Wikipédia en ouzbek sur Abdulla Qodiriy (1894-1938); son infobox mentionne l'islam en général dans le champ religion, et son texte indique qu'il a été exécuté avec des collègues partageant les mêmes idées, dont Choʻlpon et Fitrat."
  ur: "عبداللہ قدیری (1894-1938) پر ازبک ویکیپیڈیا مضمون؛ اس کا معلوماتی باکس عام طور پر مذہب کے میدان میں اسلام کو ریکارڈ کرتا ہے، اور اس کے متن میں کہا گیا ہے کہ اسے ہم خیال ساتھیوں کے ساتھ مل کر موت کی سزا دی گئی جن میں چولپون اور فطرت شامل ہیں۔"
