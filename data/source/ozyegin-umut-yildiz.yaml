reliability_note: "Institutional press bulletin of Özyeğin University, read in full on 31 October 2026. Its biographical note states that Yıldız was born in 1980 to a civil-servant family, graduated in astronomy and space sciences from Ankara University, took his master's at the University of Groningen and his doctorate at Leiden University, describes him as 35 years old, and says he had begun work at NASA two years earlier as a data scientist on the Jet Propulsion Laboratory's Mars project, one of four Turks among some five thousand NASA staff. The age and the NASA start together fit a 1980 birth. Some Turkish web biographies give 1982 instead; the record follows the university bulletin and marks the year debated. The bulletin names no religion for him."
