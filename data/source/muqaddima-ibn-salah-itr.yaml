  en: "Ulum al-Hadith by Ibn al-Salah — edited and annotated by Nur al-Din Itr (edition not stated in the scan)"
summary:
  ar: "نص كتاب ابن الصلاح أبي عمرو عثمان بن عبد الرحمن الشهرزوري ⁦(577–643هـ)⁩ في علوم الحديث، الذي سماه في خطبته «معرفة أنواع علم الحديث»، بتحقيق نور الدين عتر وشرحه في الحواشي، مقابلاً على نسخ رمز لها بـ«آ» و«ع» و«ق». في آخره فهارس وقائمة بكتب المحقق تذكر الكتاب «طبعة ثالثة بتعليقات موسعة»."
  en: "The text of Ibn al-Salah Abu Amr Uthman ibn Abd al-Rahman al-Shahrazuri's (577–643 AH) book on the hadith sciences, which he calls in his preface Ma'rifat Anwa' Ilm al-Hadith, edited by Nur al-Din Itr with his commentary in the footnotes, collated with manuscripts marked 'آ', 'ع' and 'ق'. It ends with indexes and a list of the editor's books, which names this work as a 'third edition with expanded notes'."
