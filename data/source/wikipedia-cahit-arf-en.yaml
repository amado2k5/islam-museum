summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جاهيت عارف؛ تُستخدم لوقائع الكيان فقط. يتعارض فيها تاريخ المولد: تعطي المقدمة وصندوق المعلومات 24 أكتوبر 1910، بينما يعطي متنها 11 أكتوبر 1910 — وهما صيغتا اليوم نفسه بالتقويمين اليولياني والميلادي. وتذكر وفاته في 26 ديسمبر 1997 في بيبك بإسطنبول، وتعليمه في المدرسة العليا للمعلمين بباريس ودكتوراه غوتنغن 1938 بإشراف هلموت هاسه، وثابت عارف ونظرية هاسه–عارف، وتأسيسه توبيتاك، وصورته على ورقة العشر ليرات 2009. لا يحتوي المقال أي محتوى ديني."
  en: "English Wikipedia article on Cahit Arf; used for entity facts only. Its birth date is internally split: the lead and infobox give 24 October 1910 while the body gives 11 October 1910 — the Julian/Gregorian pair for the same day. It gives his death on 26 December 1997 at Bebek, Istanbul, his education at the École Normale Supérieure and his 1938 Göttingen PhD under Helmut Hasse, the Arf invariant and Hasse–Arf theorem, his founding directorship of TÜBİTAK, and his portrait on the 2009 ten-lira note. The article contains no religion content."
  es: "Artículo de la Wikipedia en inglés sobre Cahit Arf; utilizado únicamente para datos sobre la entidad. Su fecha de nacimiento está dividida internamente: el titular y el recuadro informativo indican el 24 de octubre de 1910, mientras que el cuerpo del texto indica el 11 de octubre de 1910 (el par juliano/gregoriano para el mismo día). Menciona su fallecimiento el 26 de diciembre de 1997 en Bebek, Estambul, su formación en la École Normale Supérieure y su doctorado en Gotinga en 1938 bajo la dirección de Helmut Hasse, el invariante de Arf y el teorema de Hasse-Arf, su cargo como director fundador de TÜBİTAK y su retrato en el billete de diez liras de 2009. El artículo no contiene contenido religioso."
  fr: "Article de Wikipédia en anglais sur Cahit Arf; utilisé uniquement pour les informations le concernant. Sa date de naissance est divisée en deux: l’introduction et l’infobox indiquent le 24 octobre 1910, tandis que le corps du texte mentionne le 11 octobre 1910 (correspondant aux calendriers julien et grégorien). L’article mentionne son décès le 26 décembre 1997 à Bebek (Istanbul), ses études à l’École normale supérieure et son doctorat obtenu à Göttingen en 1938 sous la direction d’Helmut Hasse, l’invariant d’Arf et le théorème de Hasse-Arf, son rôle de directeur fondateur du TÜBİTAK, ainsi que son portrait sur le billet de dix lires de 2009. L’article ne contient aucun contenu religieux."
  ur: "Cahit Arf پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی تاریخ پیدائش اندرونی طور پر منقسم ہے: لیڈ اور انفو باکس 24 اکتوبر 1910 دیتے ہیں جبکہ باڈی 11 اکتوبر 1910 دیتی ہے — اسی دن کے لیے جولین/گریگورین جوڑا۔ یہ 26 دسمبر 1997 کو بیبک، استنبول میں ان کی موت، École Normale Supérieure میں ان کی تعلیم اور 1938 Göttingen PhD Helmut Hasse کے تحت، Arf invariant اور Hasse–Arf تھیوریم، TÜBİTAK کی ان کی بانی ڈائرکٹر شپ، اور اس کی پورٹریٹ نہیں دس۔ مضمون میں کوئی مذہبی مواد نہیں ہے۔"
