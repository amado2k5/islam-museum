summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جاهيت عارف؛ تُستخدم لوقائع الكيان فقط. يتعارض فيها تاريخ المولد: تعطي المقدمة وصندوق المعلومات 24 أكتوبر 1910، بينما يعطي متنها 11 أكتوبر 1910 — وهما صيغتا اليوم نفسه بالتقويمين اليولياني والميلادي. وتذكر وفاته في 26 ديسمبر 1997 في بيبك بإسطنبول، وتعليمه في المدرسة العليا للمعلمين بباريس ودكتوراه غوتنغن 1938 بإشراف هلموت هاسه، وثابت عارف ونظرية هاسه–عارف، وتأسيسه توبيتاك، وصورته على ورقة العشر ليرات 2009. لا يحتوي المقال أي محتوى ديني."
  en: "English Wikipedia article on Cahit Arf; used for entity facts only. Its birth date is internally split: the lead and infobox give 24 October 1910 while the body gives 11 October 1910 — the Julian/Gregorian pair for the same day. It gives his death on 26 December 1997 at Bebek, Istanbul, his education at the École Normale Supérieure and his 1938 Göttingen PhD under Helmut Hasse, the Arf invariant and Hasse–Arf theorem, his founding directorship of TÜBİTAK, and his portrait on the 2009 ten-lira note. The article contains no religion content."
