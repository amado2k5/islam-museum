reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Koulibaly as born on 20 June 1991 in Saint-Dié-des-Vosges to Senegalese parents, a professional at Metz from 2010, at Genk from 2012 (Belgian Cup the following year), at Napoli from 2014 for eight seasons (Supercoppa Italiana in his first year, Coppa Italia 2020), then Chelsea in 2022 and Al-Hilal in 2023. Its infobox gives his religion as Islam generically, a value drawn from Wikidata; its text names no school. Its statistics tables are partly stale (updated 2023), so career facts follow the English article where they differ."
