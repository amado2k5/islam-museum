summary:
  ar: "مقالة ويكيبيديا العربية «خاليدو كوليبالي»؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في سينت ديه دي فوج سنة 1991 لأبوين سنغاليين، ومسيرته مع متز وغنك ونابولي وتشيلسي والهلال، ومشاركاته مع منتخبي فرنسا تحت 20 سنة والسنغال."
  en: "Arabic Wikipedia article on Kalidou Koulibaly; used for entity facts only. It gives his birth in Saint-Dié-des-Vosges in 1991 to Senegalese parents, his career with Metz, Genk, Napoli, Chelsea and Al-Hilal, and his appearances for France under-20 and Senegal."
  es: "Artículo de Wikipedia en árabe sobre Kalidou Koulibaly; utilizado únicamente para datos sobre la persona. Menciona su nacimiento en Saint-Dié-des-Vosges en 1991, de padres senegaleses, su trayectoria en Metz, Genk, Napoli, Chelsea y Al-Hilal, y sus apariciones con las selecciones sub-20 de Francia y Senegal."
  fr: "Article Wikipédia en arabe sur Kalidou Koulibaly; utilisé uniquement pour les informations le concernant. Il indique sa naissance à Saint-Dié-des-Vosges en 1991 de parents sénégalais, sa carrière à Metz, Genk, Naples, Chelsea et Al-Hilal, ainsi que ses sélections en équipe de France Espoirs et au Sénégal."
  ur: "عربی ویکیپیڈیا کا مضمون کلیداؤ کولیبالی پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1991 میں سینٹ-ڈی-ڈیس-واسجس میں سینیگالی والدین کے ہاں اس کی پیدائش، میٹز، جینک، ناپولی، چیلسی اور الہلال کے ساتھ اس کا کیریئر، اور فرانس کے انڈر 20 اور سینیگال کے لیے اس کی پیشی ہے۔"
  tr: "Arapça Vikipedi makalesi \"Khalidou Coulibaly\"; yalnızca varlık bilgileri için kullanılır. 1991'de Saint-de-De-Voss'ta Senegalli ebeveynlerin çocuğu olarak doğduğu anılmaktadır; Metz, Genk, Napoli, Chelsea ve Al Hilal takımlarındaki kariyeri ve Fransa 20 yaş altı milli takımı ile Senegal'deki katılımları vardır."
  id: "Artikel Wikipedia Arab \"Khalidou Coulibaly\"; hanya digunakan untuk fakta entitas. Ia disebutkan lahir di Saint-de-De-Voss pada tahun 1991 dari orang tua Senegal, kariernya bersama Metz, Genk, Napoli, Chelsea, dan Al Hilal, serta partisipasinya dengan tim nasional Prancis U-20 dan Senegal."
