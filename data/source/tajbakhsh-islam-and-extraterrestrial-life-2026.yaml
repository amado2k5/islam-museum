  ar: "مؤلَّف موجز نشرته Cambridge University Press في 30 يونيو 2026؛ يصف ملخصه أنه يعرض الحياة خارج الأرض وصور النظر إليها دينياً وثقافياً مع عناية بالمنظورات الإسلامية، ويبدأ بتاريخ النقاش حول تعدد العوالم في العالم المسيحي ثم يتحول إلى القرآن والحديث. لم تُقرأ مادته بعد."
  en: "A short monograph published by Cambridge University Press on 30 June 2026; its abstract says it gives an overview of extraterrestrial life and religious and cultural views of it, with particular attention to Islamic perspectives, beginning with the history of the plurality-of-worlds debate in Christendom and then turning to the Qur'an and hadith. Its text has not yet been read for the museum."
  ur: "Cambridge University Press کا مختصر مونوگراف، 30 جون 2026ء کو شائع؛ اس کے خلاصے کے مطابق یہ زمین سے باہر زندگی اور اس کے بارے میں مذہبی و ثقافتی نظریات کا جائزہ ہے، اسلامی نقطہ ہائے نظر پر خاص توجہ کے ساتھ، اور آغاز مسیحی دنیا میں تعدد عوالم کی بحث کی تاریخ سے ہوتا ہے، پھر قرآن و حدیث کی طرف۔ اس کا متن ابھی میوزیم کے لیے نہیں پڑھا گیا۔"
