summary:
  ar: "مؤلَّف موجز نشرته Cambridge University Press في 30 يونيو 2026؛ يصف ملخصه أنه يعرض الحياة خارج الأرض وصور النظر إليها دينياً وثقافياً مع عناية بالمنظورات الإسلامية، ويبدأ بتاريخ النقاش حول تعدد العوالم في العالم المسيحي ثم يتحول إلى القرآن والحديث. لم تُقرأ مادته بعد."
  en: "A short monograph published by Cambridge University Press on 30 June 2026; its abstract says it gives an overview of extraterrestrial life and religious and cultural views of it, with particular attention to Islamic perspectives, beginning with the history of the plurality-of-worlds debate in Christendom and then turning to the Qur'an and hadith. Its text has not yet been read for the museum."
  ur: "Cambridge University Press کا مختصر مونوگراف، 30 جون 2026ء کو شائع؛ اس کے خلاصے کے مطابق یہ زمین سے باہر زندگی اور اس کے بارے میں مذہبی و ثقافتی نظریات کا جائزہ ہے، اسلامی نقطہ ہائے نظر پر خاص توجہ کے ساتھ، اور آغاز مسیحی دنیا میں تعدد عوالم کی بحث کی تاریخ سے ہوتا ہے، پھر قرآن و حدیث کی طرف۔ اس کا متن ابھی میوزیم کے لیے نہیں پڑھا گیا۔"
  es: "Una breve monografía publicada por Cambridge University Press el 30 de junio de 2026. Su resumen indica que ofrece una visión general de la vida extraterrestre y las perspectivas religiosas y culturales al respecto, con especial atención a las perspectivas islámicas, comenzando con la historia del debate sobre la pluralidad de mundos en la cristiandad y luego abordando el Corán y los hadices. El texto aún no ha sido leído para el museo."
  fr: "Une courte monographie publiée par Cambridge University Press le 30 juin 2026; son résumé indique qu’elle offre un aperçu de la vie extraterrestre et des conceptions religieuses et culturelles qui en sont faites, en accordant une attention particulière aux perspectives islamiques, en commençant par l’histoire du débat sur la pluralité des mondes dans la chrétienté, puis en s’appuyant sur le Coran et les hadiths. Le texte n’a pas encore été lu pour le musée."
  tr: "Cambridge University Press tarafından 30 Haziran 2026'da yayımlanan kısa bir eser; özeti, Hristiyan dünyasındaki dünyaların çokluğu tartışmasının tarihinden başlayıp Kur'an ve Hadislere odaklanarak İslami perspektiflere odaklanarak Dünya ötesindeki yaşamı ve dini ve kültürel perspektiflerini sunduğunu anlatır. Henüz onun materyalini okumadım."
  id: "Sebuah karya singkat yang diterbitkan oleh Cambridge University Press pada 30 Juni 2026; ringkasannya menggambarkannya sebagai penyajian kehidupan di luar Bumi dan perspektif agama serta budayanya dengan perhatian pada perspektif Islam, dimulai dari sejarah diskusi tentang banyaknya dunia dalam dunia Kristen dan kemudian beralih ke Al-Qur'an dan Hadis. Saya belum membaca materinya."
