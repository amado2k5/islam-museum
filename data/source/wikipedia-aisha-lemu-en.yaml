summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عائشة ليمو؛ تُستخدم لوقائع الكيان فقط. تثبت ميلادها في بول بدورست سنة 1940 باسم بريدجيت هوني، واعتناقها الإسلام سنة 1961 أثناء دراستها في كلية الدراسات الشرقية والأفريقية، وزواجها من أحمد ليمو سنة 1968، وانتقالها إلى نيجيريا وتدريسها في كانو وصكتو ومينا، وتأسيسها مع زوجها صندوق التعليم الإسلامي وتأسيسها اتحاد جمعيات المرأة المسلمة في نيجيريا سنة 1985، ووفاتها في مينا في 5 يناير 2019، وقائمة طويلة من مؤلفاتها."
  en: "English Wikipedia article on Aisha Lemu; used for entity facts only. It gives her birth at Poole, Dorset, in 1940 as Bridget Honey, her conversion to Islam in 1961 while studying at SOAS, her marriage to Ahmed Lemu in 1968, her move to Nigeria and teaching at Kano, Sokoto and Minna, her co-founding of the Islamic Educational Trust with her husband and of the Federation of Muslim Women's Associations of Nigeria in 1985, her death at Minna on 5 January 2019, and a long list of her books."
