reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the article was fetched by revision id through the MediaWiki API and the returned revid asserted equal to 1372658354 before any claim was drawn. Its text and infobox give her birth in 1940 at Poole, Dorset, under the birth name Bridget Aisha Honey, and her death on 5 January 2019 at Minna, citing the Daily Nigerian of that day; a tribute the article cites (Sheroes, 11 January 2019) gives her birth date as 14 October 1940, a day-level date the article's own text does not carry. It states that she converted to Islam in 1961 at the Islamic Cultural Centre in London during her first year at SOAS, citing Suraiya Nawab's 1997 study of her autobiographical writings; it names no school, order or branch for her anywhere."
