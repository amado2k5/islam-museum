summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عائشة ليمو؛ تُستخدم لوقائع الكيان فقط. تثبت ميلادها في بول بدورست سنة 1940 باسم بريدجيت هوني، واعتناقها الإسلام سنة 1961 أثناء دراستها في كلية الدراسات الشرقية والأفريقية، وزواجها من أحمد ليمو سنة 1968، وانتقالها إلى نيجيريا وتدريسها في كانو وصكتو ومينا، وتأسيسها مع زوجها صندوق التعليم الإسلامي وتأسيسها اتحاد جمعيات المرأة المسلمة في نيجيريا سنة 1985، ووفاتها في مينا في 5 يناير 2019، وقائمة طويلة من مؤلفاتها."
  en: "English Wikipedia article on Aisha Lemu; used for entity facts only. It gives her birth at Poole, Dorset, in 1940 as Bridget Honey, her conversion to Islam in 1961 while studying at SOAS, her marriage to Ahmed Lemu in 1968, her move to Nigeria and teaching at Kano, Sokoto and Minna, her co-founding of the Islamic Educational Trust with her husband and of the Federation of Muslim Women's Associations of Nigeria in 1985, her death at Minna on 5 January 2019, and a long list of her books."
  es: "Artículo de la Wikipedia en inglés sobre Aisha Lemu; utilizado únicamente para datos biográficos. En él se menciona su nacimiento en Poole, Dorset, en 1940 con el nombre de Bridget Honey, su conversión al Islam en 1961 mientras estudiaba en la SOAS, su matrimonio con Ahmed Lemu en 1968, su traslado a Nigeria y su labor docente en Kano, Sokoto y Minna, la cofundación del Islamic Educational Trust con su esposo y de la Federación de Asociaciones de Mujeres Musulmanas de Nigeria en 1985, su fallecimiento en Minna el 5 de enero de 2019 y una larga lista de sus libros."
  fr: "Article de Wikipédia en anglais sur Aisha Lemu; utilisé uniquement pour les informations biographiques. On y apprend sa naissance à Poole, dans le Dorset, en 1940 sous le nom de Bridget Honey, sa conversion à l’islam en 1961 alors qu’elle étudiait à la SOAS, son mariage avec Ahmed Lemu en 1968, son installation au Nigeria et son enseignement à Kano, Sokoto et Minna, la fondation, avec son mari, de l’Islamic Educational Trust et de la Fédération des associations de femmes musulmanes du Nigeria en 1985, son décès à Minna le 5 janvier 2019, ainsi qu’une longue liste de ses ouvrages."
  ur: "عائشہ لیمو پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے پول، ڈورسیٹ میں 1940 میں برجٹ ہنی کے طور پر جنم لیا، SOAS میں تعلیم کے دوران 1961 میں اس کا اسلام قبول کیا، 1968 میں احمد لیمو سے اس کی شادی، نائیجیریا منتقل ہونے اور کانو، سوکوٹو اور مینا میں پڑھانے، اس کی اسلامی تعلیمی ٹرسٹ کی شریک بانی اس کے شوہر کے ساتھ مسلم خواتین کی تنظیم فیڈر اور نیجریا میں 1985، 5 جنوری 2019 کو مینا میں اس کی موت، اور اس کی کتابوں کی ایک لمبی فہرست۔"
  tr: "Aisha Limo hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1940'ta Poole Dorset'te doğduğu Bridget Honey, 1961'de Doğuş ve Afrika Çalışmaları Fakültesi'nde okurken İslam'a geçişi, 1968'de Ahmed Limo ile evliliği, Kano, Sekoto ve Mina'da öğretmenlik yapmak üzere Nijerya'ya taşınması, eşiyle birlikte İslami Eğitim Fonu'nu kurması, 1985'te Nijerya Müslüman Kadınlar Dernekleri Birliği'ni kurması, 5 Ocak 2019'da Mina'da vefatı ve uzun bir eserler listesi kaydedilmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Aisha Limo; digunakan hanya untuk fakta entitas. Kelahirannya di Poole Dorset pada tahun 1940 tercatat sebagai Bridget Honey, konversinya ke Islam pada tahun 1961 saat belajar di Fakultas Studi Oriental dan Afrika, pernikahannya dengan Ahmed Limo pada tahun 1968, kepindahannya ke Nigeria untuk mengajar di Kano, Sekoto, dan Mina, pendiriannya bersama suaminya Dana Pendidikan Islam, pendirian Union of Muslim Women's Associations in Nigeria pada tahun 1985, kematiannya di Mina pada 5 Januari 2019, dan daftar panjang karyanya."
