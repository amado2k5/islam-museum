summary:
  ar: "مقالة ويكيبيديا الفرنسية القصيرة عن أبي بكر محمود غومي؛ تُستخدم لوقائع الكيان فقط. تذكر صراحة تاريخي ميلاد متنافسين: 5 نوفمبر 1922 أو 7 نوفمبر 1924، وتصف إسلامه الإصلاحي المستلهم من الوهابية ومعارضته للطرق الصوفية."
  en: "Short French Wikipedia article on Abubakar Mahmud Gumi; used for entity facts only. It states both competing birth dates, 5 November 1922 or 7 November 1924, and describes his Wahhabi-inspired reformist Islam and his opposition to the Sufi brotherhoods."
  es: "Breve artículo en francés de la Wikipedia sobre Abubakar Mahmud Gumi; utilizado únicamente para datos sobre la persona. Menciona dos fechas de nacimiento contradictorias: el 5 de noviembre de 1922 o el 7 de noviembre de 1924, y describe su islam reformista de inspiración wahabí y su oposición a las hermandades sufíes."
  fr: "Court article de Wikipédia en français sur Abubakar Mahmud Gumi; utilisé uniquement à des fins d’information sur l’entité. Il mentionne deux dates de naissance possibles, le 5 novembre 1922 ou le 7 novembre 1924, et décrit son islam réformiste d’inspiration wahhabite ainsi que son opposition aux confréries soufies."
  ur: "ابوبکر محمود گمی پر مختصر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں مسابقتی تاریخ پیدائش، 5 نومبر 1922 یا 7 نومبر 1924، اور اس کے وہابی سے متاثر اصلاح پسند اسلام اور صوفی بھائی چارے کے خلاف اس کی مخالفت کو بیان کیا گیا ہے۔"
