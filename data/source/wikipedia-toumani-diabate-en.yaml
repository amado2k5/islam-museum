reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026, and its content checked against the recorded revision. It gives Toumani Diabaté, born 10 August 1965 at Bamako and died there on 19 July 2024, aged 58, after a short illness; his father Sidiki Diabaté, who recorded the first-ever kora album in 1970, and his mother, the singer Nene Koita; the family oral tradition of 70 generations of kora players before him; the childhood illness that cost him the use of his right leg; public performance by the age of 13 and a place in the backing group of the jelimuso Kandia Kouyaté; the 1987 appearance on his father's ensemble album Ba Togoma and the 1988 solo album Kaira, recorded in one afternoon in London; collaborations with Ketama (Songhai), Taj Mahal (Kulanjan, 1999), Roswell Rudd (MALIcool, 2002) and Björk (Volta, 2007); New Ancient Strings (1999) with Ballaké Sissoko; In the Heart of the Moon (2005) with Ali Farka Touré, winner of the 2006 Grammy Award for Best Traditional World Music Album; Boulevard de l'Indépendance (2006) with the Symmetric Orchestra; The Mandé Variations (2008); the October 2008 removal of the Arabic lyrics of his song 'Tapha Niang' from the video game LittleBigPlanet after objections to their inclusion of verses from the Qur'an; his appointment as a United Nations Goodwill Ambassador in December 2008 for his HIV and AIDS work; the honorary doctorate from SOAS in March 2014; Toumani & Sidiki (2014) with his son Sidiki; the collective Lamomali and its posthumous Totem (2025); and the description of him by a panel commissioned by The Independent (2006) as one of the fifty best African artists, and by The Times obituary as 'a bold and innovative musical visionary'. The article states no religion for him."
