summary:
  ar: "القسم الأول من «مدارج السالكين بين منازل إياك نعبد وإياك نستعين» لابن قيم الجوزية ⁦(691–751هـ)⁩، في التحقيق الجماعي لأساتذة العقيدة والمذاهب المعاصرة بجامعة القصيم، دار الصميعي بالرياض، الطبعة الأولى 1432هـ/2011م؛ حققه ودرسه ناصر بن سليمان السعوي، ويمتد من أول الكتاب إلى فصل انقسام الذنوب إلى صغائر وكبائر، وفيه مقدمة عامة للتحقيق وخاتمة بنتائج دراسة المحقق."
  en: "Part 1 of Madarij al-Salikin bayna Manazil Iyyaka Na'budu wa-Iyyaka Nasta'in by Ibn Qayyim al-Jawziyya (691–751 AH), in the joint edition by professors of creed and contemporary schools at Qassim University, Dar al-Sumay'i, Riyadh, 1st ed. 1432 AH / 2011; edited with a study by Nasir ibn Sulayman al-Sa'wi, it runs from the start of the book to the section on the division of sins into minor and major, with a general introduction to the edition and a conclusion setting out the editor's findings."
