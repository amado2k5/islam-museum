label: { ar: "مدارج السالكين لابن قيم الجوزية، القسم الأول بتحقيق ناصر السعوي ⁦(دار الصميعي 1432هـ)⁩", en: "Ibn Qayyim al-Jawziyya, Madarij al-Salikin, part 1, ed. Nasir al-Sa'wi (Dar al-Sumay'i, 1432 AH)" }
summary:
  ar: "القسم الأول من «مدارج السالكين بين منازل إياك نعبد وإياك نستعين» لابن قيم الجوزية ⁦(691–751هـ)⁩، في التحقيق الجماعي لأساتذة العقيدة والمذاهب المعاصرة بجامعة القصيم، دار الصميعي بالرياض، الطبعة الأولى 1432هـ/2011م؛ حققه ودرسه ناصر بن سليمان السعوي، ويمتد من أول الكتاب إلى فصل انقسام الذنوب إلى صغائر وكبائر، وفيه مقدمة عامة للتحقيق وخاتمة بنتائج دراسة المحقق."
  en: "Part 1 of Madarij al-Salikin bayna Manazil Iyyaka Na'budu wa-Iyyaka Nasta'in by Ibn Qayyim al-Jawziyya (691–751 AH), in the joint edition by professors of creed and contemporary schools at Qassim University, Dar al-Sumay'i, Riyadh, 1st ed. 1432 AH / 2011; edited with a study by Nasir ibn Sulayman al-Sa'wi, it runs from the start of the book to the section on the division of sins into minor and major, with a general introduction to the edition and a conclusion setting out the editor's findings."
  es: "La primera parte de Madarij al-Salikin bayna Manazil Iyyaka Na'budu wa-Iyyaka Nasta'in de Ibn Qayyim al-Jawziyya (691–751 AH), en la edición conjunta de profesores de teología y escuelas contemporáneas de la Universidad de Qassim, Dar al-Sumay'i, Riad, 1.ª ed. 1432 AH / 2011; editada con un estudio de Nasir ibn Sulayman al-Sa'wi, abarca desde el comienzo del libro hasta la sección sobre la división de los pecados en menores y mayores, con una introducción general a la edición y una conclusión que expone las conclusiones del editor."
  fr: "Première partie de Madarij al-Salikin bayna Manazil Iyyaka Na'budu wa-Iyyaka Nasta'in d'Ibn Qayyim al-Jawziyya (691-751 AH), dans l'édition conjointe des professeurs de doctrine et des écoles contemporaines de l'Université Qassim, Dar al-Sumay'i, Riyad, 1re éd. 1432 AH / 2011; éditée avec une étude de Nasir ibn Sulayman al-Sa'wi, elle s'étend du début du livre jusqu'à la section sur la division des péchés en mineurs et majeurs, avec une introduction générale à l'édition et une conclusion exposant les conclusions de l'éditeur."
  ur: "مدارج السالکین بینا منازل ایاکا نعبدو وایاکا نستعین کا حصہ 1 ابن قیم الجوزیہ ⁦(691-751ھ)⁩، قاسم یونیورسٹی، دار السمیع، 1 میں مسلک اور عصری اسکولوں کے پروفیسروں کے مشترکہ ایڈیشن میں۔ 1432ھ/2011; ناصر بن سلیمان الساوی کے مطالعہ کے ساتھ ترمیم کی گئی، یہ کتاب کے آغاز سے لے کر گناہوں کو چھوٹے اور بڑے میں تقسیم کرنے کے حصے تک چلتا ہے، اس ایڈیشن کا عام تعارف اور ایک اختتام ایڈیٹر کے نتائج کو ترتیب دیتا ہے۔"
  tr: "İbn Qayyim al-Jawziyyah (691–751 Hicri) tarafından yazılmış 'Madarij al-Salikin Bayn Manazil Iyyaka Na'bud wa Iyyaka Nasta'in' adlı eserinin ilk bölümü, Qassim Üniversitesi, Dar al-Sumaie, Riyad'daki inanç ve çağdaş öğretim profesörleri tarafından toplu doğrulama kapsamında, ilk baskı 1432 Hicri / 2011 CE; Nasser bin Süleyman el-Saawi tarafından düzenlenmiş ve incelenmiştir. Kitabın başından başlayarak günahların küçük ve büyük günahlara ayrılması bölümüne kadar uzanır; doğrulamaya genel bir giriş ve araştırmacının çalışmasının sonuçlarını içeren bir sonuç içerir."
  id: "Bagian pertama dari 'Madarij al-Salikin Bayn Manazil Iyyaka Na'bud wa Iyyaka Nasta'in' oleh Ibn Qayyim al-Jawziyyah (691–751 H), dalam verifikasi kolektif oleh para profesor ajaran dan doktrin kontemporer di Universitas Qassim, Dar al-Sumaie, Riyadh, edisi pertama 1432 H / 2011 M; disunting dan dipelajari oleh Nasser ibn Suleiman al-Saawi. Bagian ini mencakup dari awal buku hingga bab tentang pembagian dosa kecil dan besar, berisi pengantar umum verifikasi dan kesimpulan dengan hasil studi peneliti."
