summary:
  ar: "مراجعة لضياء الدين سردار في صحيفة «ميل آند غارديان»، 23 يوليو 2008، لترجمة طريف الخالدي «القرآن: ترجمة جديدة» في سلسلة كلاسيكيات بنغوين، يقارنها فيها بترجمة داود السابقة في السلسلة نفسها وبترجمتي عبد الحليم وآربري."
  en: "Ziauddin Sardar's review in the Mail & Guardian, 23 July 2008, of Tarif Khalidi's The Qur'an: A New Translation in Penguin Classics, comparing it with N. J. Dawood's earlier Penguin translation and with those of Abdel Haleem and Arberry."
  ur: "میل اینڈ گارڈین میں ضیاء الدین سردار کا تبصرہ، 23 جولائی 2008، طریف خالدی کے «دی قرآن: اے نیو ٹرانسلیشن» ⁦(پینگوئن کلاسکس)⁩ پر، جس میں اس کا موازنہ اسی سلسلے میں داؤد کے پرانے ترجمے اور عبد الحلیم و آربری کے تراجم سے کیا گیا ہے۔"
