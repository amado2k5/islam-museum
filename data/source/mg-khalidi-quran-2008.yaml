label: { en: "Mail & Guardian, 'A redeeming take on the Qur'an' (Ziauddin Sardar, 23 July 2008)" }
summary:
  ar: "مراجعة لضياء الدين سردار في صحيفة «ميل آند غارديان»، 23 يوليو 2008، لترجمة طريف الخالدي «القرآن: ترجمة جديدة» في سلسلة كلاسيكيات بنغوين، يقارنها فيها بترجمة داود السابقة في السلسلة نفسها وبترجمتي عبد الحليم وآربري."
  en: "Ziauddin Sardar's review in the Mail & Guardian, 23 July 2008, of Tarif Khalidi's The Qur'an: A New Translation in Penguin Classics, comparing it with N. J. Dawood's earlier Penguin translation and with those of Abdel Haleem and Arberry."
  ur: "میل اینڈ گارڈین میں ضیاء الدین سردار کا تبصرہ، 23 جولائی 2008، طریف خالدی کے «دی قرآن: اے نیو ٹرانسلیشن» ⁦(پینگوئن کلاسکس)⁩ پر، جس میں اس کا موازنہ اسی سلسلے میں داؤد کے پرانے ترجمے اور عبد الحلیم و آربری کے تراجم سے کیا گیا ہے۔"
  es: "Reseña de Ziauddin Sardar en el Mail & Guardian, del 23 de julio de 2008, sobre El Corán de Tarif Khalidi: Una nueva traducción en Penguin Classics, comparándola con la traducción anterior de NJ Dawood para Penguin y con las de Abdel Haleem y Arberry."
  fr: "La critique de Ziauddin Sardar dans le Mail & Guardian du 23 juillet 2008, de la traduction du Coran de Tarif Khalidi dans Penguin Classics, la comparant à la traduction précédente de NJ Dawood chez Penguin et à celles d'Abdel Haleem et d'Arberry."
  tr: "Diaa El-Din Sardar tarafından Mail & Guardian'da, 23 Temmuz 2008 tarihli bir inceleme, Penguin Classics serisinde Tarif Al-Khalidi'nin \"Kur'an: Yeni Bir Çeviri\" çevirisiyle ilgili bir inceleme, Dawood'un aynı serideki önceki çevirisi ve Abdel Halim ile Arbery'nin çevirileriyle karşılaştırılmıştır."
  id: "Ulasan oleh Diaa El-Din Sardar di Mail & Guardian, 23 Juli 2008, tentang terjemahan Tarif Al-Khalidi atas \"Al-Qur'an: Terjemahan Baru\" dalam seri Penguin Classics, membandingkannya dengan terjemahan Dawood sebelumnya dalam seri yang sama dan dengan terjemahan Abdel Halim dan Arbery."
title: "A redeeming take on the Qur'an"
