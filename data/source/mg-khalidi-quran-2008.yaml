reliability_note: "Signed review in a national weekly, read in full in Chrome on 6 November 2026 (the byline is printed 'Ziaudauddin'). Used for Khalidi's post at the American University of Beirut, the publication in Penguin Classics as a new translation in 2008, the reviewer's account of its method (the seven tropes, prose and verse layouts), its gender-neutral renderings compared with Dawood, the absence of context notes, the verse numbering in the margins, no chapter numbers and no index, and the reviewer's verdict, attributed to him."
