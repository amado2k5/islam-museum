  ar: "مقالة ويكيبيديا الإنجليزية عن نواب مصطفى خان شيفتة؛ تُستخدم لوقائع الكيان فقط. تروي حياته في دلهي، وصداقته ورعايته لميرزا غالب، وسجنه بعد ثورة 1857، ووفاته سنة 1869، ولا تذكر دينه أو مذهبه."
  en: "English Wikipedia article on Nawab Mustafa Khan Shefta; used for entity facts only. It recounts his Delhi life, his friendship with and patronage of Mirza Ghalib, his imprisonment after the 1857 rebellion, and his death in 1869; it makes no statement of his religion or school."
  es: "Artículo de la Wikipedia en inglés sobre Nawab Mustafa Khan Shefta; se utiliza únicamente para obtener información sobre la persona. Relata su vida en Delhi, su amistad y mecenazgo con Mirza Ghalib, su encarcelamiento tras la rebelión de 1857 y su muerte en 1869; no menciona su religión ni su escuela."
  fr: "Article de Wikipédia en anglais sur Nawab Mustafa Khan Shefta; utilisé uniquement à titre informatif. Il relate sa vie à Delhi, son amitié avec Mirza Ghalib et son soutien à ce dernier, son emprisonnement après la rébellion de 1857 et sa mort en 1869; il ne mentionne ni sa religion ni son école."
  ur: "نواب مصطفی خان شیفتہ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی دہلی کی زندگی، مرزا غالب کے ساتھ ان کی دوستی اور سرپرستی، 1857 کی بغاوت کے بعد ان کی قید اور 1869 میں ان کی موت کا ذکر ہے۔ یہ اس کے مذہب یا مکتب کا کوئی بیان نہیں دیتا۔"
  tr: "Nawab Mustafa Khan Shifta hakkında İngilizce Vikipedi makalesi; sadece varlığın gerçekleri için kullanılır. Delhi'deki hayatını, Mirza Ghalib'e olan dostluğunu ve ilgisini, 1857 devriminden sonra hapsedilmesini ve 1869'daki ölümünü anlatır, dini veya mezhebinden bahsetmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Nawab Mustafa Khan Shifta; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kehidupannya di Delhi, persahabatan dan perhatiannya terhadap Mirza Ghalib, penahanannya setelah revolusi 1857, dan kematiannya pada tahun 1869, tanpa menyebutkan agama atau sektenya."
