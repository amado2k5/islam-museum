reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. It gives his life as 1809–1869, born in Delhi into a Bangash Pathan landowning family, educated by teachers including Haji Muhammad Nur Naqshbandi, a member of the Delhi circle of Ghalib, Zauq and Momin, Ghalib's friend and patron who sought poetic correction (islah) from Momin for his Urdu verse and from Ghalib for his Persian, imprisoned for seven years after 1857 with half his estates restored on appeal, author of the early history of Urdu poetry Gulshan-e-be-khaar, and dead in 1869 at his Kucha Chelaan residence in Delhi, buried in the family graveyard near the Nizamuddin shrine. It records his Hajj pilgrimage and that his writing turned spiritual afterwards; it makes no statement of his religion or school anywhere."
