summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد ياسين؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في الجورة قرب عسقلان وتجعل تاريخها غير مؤكد (جواز سفره الفلسطيني يقول 1 يناير 1929، وهو قال إنه وُلد صيف 1936، ويقرأ صدرها يونيو 1936/37)، وشلله منذ السادسة عشرة، وعمله معلمًا وخطيبًا، وتأسيسه المجمع الإسلامي ثم حماس سنة 1987، وسجنه وإطلاقه سنة 1997، واغتياله في غزة في 22 مارس 2004. نصها يشهد لانتمائه الحركي (الإخوان وحماس) ولا يسمّي مذهبًا له هو."
  en: "English Wikipedia article on Ahmed Yassin; used for entity facts only. It recounts his birth in al-Jura near Ashkelon with an uncertain date (his Palestinian passport says 1 January 1929, he claimed he was born in the summer of 1936, and its lead reads June 1936/37), his quadriplegia from the age of sixteen, his work as a teacher and preacher, his founding of the Mujama al-Islamiya and then of Hamas in 1987, his imprisonment and 1997 release, and his assassination in Gaza on 22 March 2004. Its text attests his movement involvement (the Muslim Brotherhood and Hamas) and names no school for the man himself."
