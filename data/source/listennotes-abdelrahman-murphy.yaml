summary:
  ar: "صفحة «ليستن نوتس» لسلسلة بودكاست «مسلم سنترال» لعبد الرحمن ميرفي، تحمل سيرته: بكالوريوس تدريس الإنجليزية والدراسات الدينية من جامعة إلينوي في شيكاغو، يعمل منذ 2009 مديرا للشباب ومرشدا وإماما مساعدا، أكمل برنامج شهادة الإمامة في مكة، وتخرج في معهد قلم في مايو 2014 تحت عبد الناصر جانغدا، ثم انتقل إلى دالاس."
  en: "Listen Notes' page for Muslim Central's AbdelRahman Murphy podcast series, carrying his biography: a bachelor's in the Teaching of English and Religious Studies from the University of Illinois at Chicago; youth director, Muslim chaplain and assistant imam full-time since 2009; an Imam Certificate Program completed in Makkah; graduation from the Qalam Seminary in May 2014 under AbdulNasir Jangda; and a move to Dallas."
  es: "En la página de Listen Notes de la serie de podcasts de AbdelRahman Murphy de Muslim Central, se incluye su biografía: una licenciatura en Enseñanza de Inglés y Estudios Religiosos de la Universidad de Illinois en Chicago; director de jóvenes, capellán musulmán e imán asistente a tiempo completo desde 2009; un programa de certificación de imán completado en La Meca; graduación del Seminario Qalam en mayo de 2014 bajo la tutela de AbdulNasir Jangda; y su traslado a Dallas."
  fr: "La page « Listen Notes » de la série de podcasts AbdelRahman Murphy de Muslim Central contient sa biographie: une licence en enseignement de l’anglais et des études religieuses de l’Université de l’Illinois à Chicago; directeur de la jeunesse, aumônier musulman et imam adjoint à temps plein depuis 2009; un programme de certificat d’imam complété à La Mecque; l’obtention du diplôme du séminaire Qalam en mai 2014 sous la direction d’AbdulNasir Jangda; et un déménagement à Dallas."
