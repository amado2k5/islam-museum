summary:
  ar: "صفحة «ليستن نوتس» لسلسلة بودكاست «مسلم سنترال» لعبد الرحمن ميرفي، تحمل سيرته: بكالوريوس تدريس الإنجليزية والدراسات الدينية من جامعة إلينوي في شيكاغو، يعمل منذ 2009 مديرا للشباب ومرشدا وإماما مساعدا، أكمل برنامج شهادة الإمامة في مكة، وتخرج في معهد قلم في مايو 2014 تحت عبد الناصر جانغدا، ثم انتقل إلى دالاس."
  en: "Listen Notes' page for Muslim Central's AbdelRahman Murphy podcast series, carrying his biography: a bachelor's in the Teaching of English and Religious Studies from the University of Illinois at Chicago; youth director, Muslim chaplain and assistant imam full-time since 2009; an Imam Certificate Program completed in Makkah; graduation from the Qalam Seminary in May 2014 under AbdulNasir Jangda; and a move to Dallas."
