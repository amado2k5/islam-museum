  en: "Kyrie Irving — Andscape on his conversion to Islam, 2021"
summary:
  ar: "مقال «أندسكيب» ⁦(27 أبريل 2021)⁩ لخالد بيضون ينقل كلمات إيرفينغ في 23 أبريل 2021: «كوني جزءاً من المجتمع المسلم، وملتزماً بالإسلام»، دون أن يسمي مذهباً."
  en: "Andscape essay of 27 April 2021 by Khaled A. Beydoun quoting Irving's postgame words of 23 April 2021 at length: 'being part of the Muslim community, being committed to Islam', and his account of taking part in Ramadan with his 'Muslim brothers and sisters'. It names no school or tradition."
  es: "Ensayo de Andscape del 27 de abril de 2021, escrito por Khaled A. Beydoun, que cita extensamente las declaraciones de Irving tras el partido del 23 de abril de 2021: «ser parte de la comunidad musulmana, estar comprometido con el Islam», y su relato de haber participado en el Ramadán con sus «hermanos y hermanas musulmanes». No menciona ninguna escuela ni tradición."
  fr: "Dans un essai publié sur Andscape le 27 avril 2021, Khaled A. Beydoun cite longuement les propos d'Irving après le match du 23 avril 2021: « faire partie de la communauté musulmane, être attaché à l'islam », ainsi que son récit de sa participation au Ramadan avec ses « frères et sœurs musulmans ». Il ne mentionne aucune école ni tradition."
  ur: "27 اپریل 2021 کا اینڈسکیپ مضمون خالد اے بیڈون کا 23 اپریل 2021 کے ارونگ کے پوسٹ گیم کے الفاظ کا حوالہ دیتے ہوئے: 'مسلم کمیونٹی کا حصہ ہونا، اسلام کا پابند ہونا'، اور اپنے 'مسلم بھائیوں اور بہنوں' کے ساتھ رمضان میں حصہ لینے کا ان کا بیان۔ اس میں کسی اسکول یا روایت کا نام نہیں ہے۔"
  tr: "Khaled Baydoun'un 27 Nisan 2021 tarihli \"Underscape\" makalesi, Irving'in 23 Nisan 2021'de belirttiği şu sözleri aktarıyor: \"Müslüman topluluğun bir parçası ol ve İslam'a bağlı ol,\" ama bir mezhep belirtilmedi."
  id: "Sebuah artikel \"Underscape\" (27 April 2021) oleh Khaled Baydoun mengutip kata-kata Irving pada 23 April 2021: \"Jadilah bagian dari komunitas Muslim dan berkomitmen pada Islam,\" tanpa menyebutkan sekte."
