summary:
  ar: "مقالة ويكيبيديا العربية عن سميرة موسى ⁦(3 آذار 1917 – آب 1952)⁩، أول عالمة ذرة مصرية وأول معيدة في كلية العلوم بجامعة فؤاد الأول؛ تذكر مولدها في سنبو الكبرى بمركز زفتى وحفظها أجزاء من القرآن في طفولتها، وتتضمن نظريات حول وفاتها؛ مختصرها يجعل وفاتها في 5 آب بينما سردها المفصل يجعل الحادث في 15 آب 1952."
  en: "Arabic Wikipedia article on Sameera Moussa (3 March 1917 – August 1952), Egypt's first woman atomic scientist and the first woman lecturer at Fouad I University's Faculty of Sciences; it records her birth at Sanbo El-Kobra in the Zefta district, that she memorised parts of the Qur'an as a child, and theories about her death; its lead dates her death to 5 August while its detailed narrative dates the crash to 15 August 1952."
  es: "Artículo en la Wikipedia en árabe sobre Sameera Moussa (3 de marzo de 1917 - agosto de 1952), la primera mujer científica atómica de Egipto y la primera mujer profesora en la Facultad de Ciencias de la Universidad Fouad I; registra su nacimiento en Sanbo El-Kobra, en el distrito de Zefta, que memorizó partes del Corán cuando era niña y teorías sobre su muerte; su introducción fecha su muerte el 5 de agosto, mientras que su narración detallada fecha el accidente el 15 de agosto de 1952."
  fr: "L'article de Wikipédia en arabe sur Sameera Moussa (3 mars 1917 – août 1952), première femme scientifique atomiste d'Égypte et première femme professeure à la faculté des sciences de l'université Fouad I, relate sa naissance à Sanbo El-Kobra dans le district de Zefta, le fait qu'elle ait mémorisé des parties du Coran dès son enfance, et les théories concernant sa mort; son introduction date son décès du 5 août tandis que son récit détaillé date l'accident du 15 août 1952."
  ur: "سمیرا موسیٰ ⁦(3 مارچ 1917 - اگست 1952)⁩ پر عربی ویکیپیڈیا کا مضمون، مصر کی پہلی خاتون ایٹمی سائنسدان اور فواد اول یونیورسٹی کی فیکلٹی آف سائنسز میں پہلی خاتون لیکچرر؛ اس میں اس کی پیدائش ضلع زیفتا کے سانبو الکبرا میں ریکارڈ کی گئی ہے، کہ اس نے بچپن میں قرآن کے کچھ حصے حفظ کیے تھے، اور اپنی موت کے بارے میں نظریات؛ اس کی قیادت اس کی موت کی تاریخ 5 اگست ہے جبکہ اس کی تفصیلی داستان حادثے کی تاریخ 15 اگست 1952 ہے۔"
  tr: "Arapça Vikipedi makalesi, ilk Mısırlı nükleer bilim insanı ve Fouad I Üniversitesi Fen Fakültesi'nde ilk öğretim asistanı olan Samira Moussa (3 Mart 1917 – Ağustos 1952) hakkında; Zefta merkezindeki Büyük Sanbo'da doğduğundan ve çocukluğunda Kur'an'ın bazı bölümlerini ezberlediğinden bahseder. Ölümüne dair teoriler içerir; kısa anlatımları ölümünü 5 Ağustos'a verirken, ayrıntılı anlatımı olayı 15 Ağustos 1952'ye yerleştirir."
  id: "Artikel Wikipedia berbahasa Arab tentang Samira Moussa (3 Maret 1917 – Agustus 1952), ilmuwan nuklir Mesir pertama dan asisten pengajar pertama di Fakultas Sains Universitas Fouad I; artikel ini menyebutkan kelahirannya di Sanbo Agung di pusat Zefta dan hafalan bagian-bagian Al-Qur'an selama masa kecilnya. Artikel tersebut memuat teori tentang kematiannya; catatan singkatnya menempatkan kematiannya pada 5 Agustus, sementara catatan rincinya menempatkan insiden tersebut pada 15 Agustus 1952."
