  ar: "مقالة ويكيبيديا العربية عن سميرة موسى ⁦(3 آذار 1917 – آب 1952)⁩، أول عالمة ذرة مصرية وأول معيدة في كلية العلوم بجامعة فؤاد الأول؛ تذكر مولدها في سنبو الكبرى بمركز زفتى وحفظها أجزاء من القرآن في طفولتها، وتتضمن نظريات حول وفاتها؛ مختصرها يجعل وفاتها في 5 آب بينما سردها المفصل يجعل الحادث في 15 آب 1952."
  en: "Arabic Wikipedia article on Sameera Moussa (3 March 1917 – August 1952), Egypt's first woman atomic scientist and the first woman lecturer at Fouad I University's Faculty of Sciences; it records her birth at Sanbo El-Kobra in the Zefta district, that she memorised parts of the Qur'an as a child, and theories about her death; its lead dates her death to 5 August while its detailed narrative dates the crash to 15 August 1952."
