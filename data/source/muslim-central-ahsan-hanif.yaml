summary:
  ar: "صفحة بودكاست «مسلم سنترال» لأحسن حنيف، تضم نحو 600 محاضرة له منذ 2013؛ وتعطي سيرتها — وهي نص معهد المغرب عن مدرّسيه — نشأته في برمنغهام وحفظه القرآن في الثالثة عشرة ومنحته إلى المدينة سنة 2000 وتخرّجه في الشريعة سنة 2006 ودكتوراه برمنغهام ورئاسته قسم علوم القرآن والحديث في المغرب."
  en: "Muslim Central's podcast page for Ahsan Hanif, carrying some 600 of his lectures since 2013; its biography (AlMaghrib Institute's instructor text) gives his Birmingham upbringing, memorisation of the Qur'an at thirteen, Madinah scholarship in 2000, Shari'ah graduation in 2006, Birmingham PhD, and his headship of AlMaghrib's Qur'an and Hadith sciences department."
  es: "La página de podcasts de Muslim Central dedicada a Ahsan Hanif, que incluye unas 600 de sus conferencias desde 2013, describe en su biografía (texto del profesorado del Instituto AlMaghrib) su infancia en Birmingham, la memorización del Corán a los trece años, su beca en Medina en el año 2000, su graduación en Sharia en 2006, su doctorado en Birmingham y su cargo como director del departamento de ciencias del Corán y los Hadices de AlMaghrib."
  fr: "La page de podcasts de Muslim Central consacrée à Ahsan Hanif, qui propose quelque 600 de ses conférences depuis 2013; sa biographie (texte pédagogique de l’Institut AlMaghrib) retrace son enfance à Birmingham, sa mémorisation du Coran à treize ans, sa bourse d’études à Médine en 2000, son diplôme en charia en 2006, son doctorat à Birmingham et sa direction du département des sciences du Coran et du hadith d’AlMaghrib."
