  ar: "صفحة بودكاست «مسلم سنترال» لأحسن حنيف، تضم نحو 600 محاضرة له منذ 2013؛ وتعطي سيرتها — وهي نص معهد المغرب عن مدرّسيه — نشأته في برمنغهام وحفظه القرآن في الثالثة عشرة ومنحته إلى المدينة سنة 2000 وتخرّجه في الشريعة سنة 2006 ودكتوراه برمنغهام ورئاسته قسم علوم القرآن والحديث في المغرب."
  en: "Muslim Central's podcast page for Ahsan Hanif, carrying some 600 of his lectures since 2013; its biography (AlMaghrib Institute's instructor text) gives his Birmingham upbringing, memorisation of the Qur'an at thirteen, Madinah scholarship in 2000, Shari'ah graduation in 2006, Birmingham PhD, and his headship of AlMaghrib's Qur'an and Hadith sciences department."
