  fr: "Article de Wikipédia en anglais sur le prince Yusuf Izzeddin; utilisé uniquement pour les informations biographiques. Il le présente comme le fils aîné du sultan Abdulaziz et prince héritier de l’Empire ottoman (1909-1916), et relate son suicide dans sa villa d’Istanbul le 1er février 1916."
  ur: "شہزادے یوسف عزالدین پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے سلطان عبدالعزیز کے بڑے بیٹے اور سلطنت عثمانیہ کے ولی عہد (1909-1916) کے طور پر دیتا ہے، اور 1 فروری 1916 کو اپنے استنبول ولا میں اس کی خودکشی کا ذکر کرتا ہے۔"
