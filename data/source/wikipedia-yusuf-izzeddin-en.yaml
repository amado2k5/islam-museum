  en: "English Wikipedia article on Şehzade Yusuf Izzeddin; used for entity facts only. It gives him as the eldest son of Sultan Abdulaziz and crown prince of the Ottoman Empire (1909–1916), and recounts his suicide at his Istanbul villa on 1 February 1916."
