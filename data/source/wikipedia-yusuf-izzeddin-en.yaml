reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by revision id with content verified identical. Its infobox carries a religion field reading 'Sunni Islam', uncited; its text names no school for him personally — the nearest statement describes him as 'a conservative and pious person', a character description, not an attestation of a school. The birth day is split three ways: the infobox and the early-life text give 29 September 1857 at Dolmabahçe Palace, citing Adra's genealogy of the imperial family, the lead gives 11 October 1857, and the Turkish article and Wikidata give 10 October 1857. The death — suicide on 1 February 1916 at his Zincirlikuyu villa, Istanbul, and burial in the mausoleum of Mahmud II — is consistent across the sources."
