label: { en: "Pakistan Tourism Portal: Dr. Abdul Samad profile" }
summary:
  ar: "ملف تعريفي لعبد الصمد في بوابة باكستان السياحية: يذكر أنه من جنغل خيل بكوهات، وحاصل على الماجستير في الآثار من جامعة بيشاور بالمرتبة الأولى وميدالية ذهبية، وعلى الدكتوراه من جامعة برلين الحرة سنة 2011 بمنحة داد، ودرّس قرابة عشر سنوات في جامعة هزارة، وعُيّن مديرا لمديرية الآثار والمتاحف في خيبر بختونخوا في يونيو 2014 ثم مديرا عاما وأمينا لها، وألّف «نشأة الهندوسية في غاندهارا»، وحاز وسام فخر الأداء الرئاسي."
  en: "Pakistan Tourism Portal profile of Abdul Samad: from Jungle Khel, Kohat; MA in archaeology from the University of Peshawar, first in his class with a gold medal; PhD from the Free University of Berlin in 2011 on a DAAD scholarship; taught almost ten years at Hazara University; appointed director of the Khyber Pakhtunkhwa Directorate of Archaeology and Museums in June 2014, later its director general and secretary; author of Emergence of Hinduism in Gandhara; recipient of the Presidential Pride of Performance."
  es: "Perfil de Abdul Samad en el Portal de Turismo de Pakistán: originario de Jungle Khel, Kohat; Máster en arqueología por la Universidad de Peshawar, donde obtuvo el primer puesto de su promoción con medalla de oro; Doctorado por la Universidad Libre de Berlín en 2011 con una beca DAAD; impartió clases durante casi diez años en la Universidad de Hazara; nombrado director de la Dirección de Arqueología y Museos de Khyber Pakhtunkhwa en junio de 2014, y posteriormente director general y secretario; autor de \"El surgimiento del hinduismo en Gandhara\"; galardonado con el Premio Presidencial al Mérito."
  fr: "Profil d'Abdul Samad sur le portail du tourisme du Pakistan: originaire de Jungle Khel, Kohat; titulaire d'une maîtrise en archéologie de l'Université de Peshawar, major de sa promotion et médaillé d'or; docteur de l'Université libre de Berlin (2011) grâce à une bourse du DAAD; a enseigné pendant près de dix ans à l'Université Hazara; nommé directeur de la Direction de l'archéologie et des musées du Khyber Pakhtunkhwa en juin 2014, puis directeur général et secrétaire; auteur de « L'émergence de l'hindouisme au Gandhara »; récipiendaire de la Médaille présidentielle de la fierté de la performance."
  ur: "عبدالصمد کا پاکستان ٹورازم پورٹل پروفائل: جنگل خیل، کوہاٹ سے؛ پشاور یونیورسٹی سے آرکیالوجی میں ایم اے، گولڈ میڈل کے ساتھ اپنی کلاس میں اول۔ 2011 میں برلن کی فری یونیورسٹی سے DAAD اسکالرشپ پر پی ایچ ڈی؛ ہزارہ یونیورسٹی میں تقریباً دس سال پڑھایا۔ جون 2014 میں خیبرپختونخوا ڈائریکٹوریٹ آف آرکیالوجی اینڈ میوزیم کے ڈائریکٹر مقرر ہوئے، بعد میں اس کے ڈائریکٹر جنرل اور سیکرٹری؛ گندھارا میں ہندو ازم کا ظہور کے مصنف؛ صدارتی پرائیڈ آف پرفارمنس کا وصول کنندہ۔"
  tr: "Pakistan Turizm Portalı'ndaki Abdul Samad profili: Kohat'taki Jangal Khel'den olduğunu, Peşaver Üniversitesi'nden arkeoloji alanında birinci dereceyle ve altın madalya ile yüksek lisans derecesine sahip olduğunu, 2011 yılında Berlin Özgür Üniversitesi'nden burslu doktora derecesini aldığını belirtmek gerekir. Yaklaşık on yıl Hazara Üniversitesi'nde eğitim gördü, Haziran 2014'te Hayber Pakhtunkhwa Antikalar ve Müzeler Müdürlüğü Müdürü olarak atandı, ardından Genel Müdür ve Sekreter oldu, 'Gandhara'da Hinduizmin Kökeni' adlı kitabı yazdı ve Cumhurbaşkanlığı Performans Gururu Madalyası'nı aldı."
  id: "Profil Abdul Samad di Pakistan Tourism Portal: Perlu disebutkan bahwa ia berasal dari Jangal Khel di Kohat, meraih gelar master arkeologi dari Universitas Peshawar dengan peringkat pertama dan medali emas, serta gelar PhD dari Free University of Berlin pada tahun 2011 dengan beasiswa. Ia belajar hampir sepuluh tahun di Universitas Hazara, diangkat sebagai Direktur Direktorat Antikuitas dan Museum di Khyber Pakhtunkhwa pada Juni 2014, kemudian menjadi Direktur Jenderal dan Sekretaris, menulis 'The Origin of Hinduism in Gandhara,' dan menerima Presidential Pride of Performance Medal."
