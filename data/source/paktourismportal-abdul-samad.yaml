summary:
  ar: "ملف تعريفي لعبد الصمد في بوابة باكستان السياحية: يذكر أنه من جنغل خيل بكوهات، وحاصل على الماجستير في الآثار من جامعة بيشاور بالمرتبة الأولى وميدالية ذهبية، وعلى الدكتوراه من جامعة برلين الحرة سنة 2011 بمنحة داد، ودرّس قرابة عشر سنوات في جامعة هزارة، وعُيّن مديرا لمديرية الآثار والمتاحف في خيبر بختونخوا في يونيو 2014 ثم مديرا عاما وأمينا لها، وألّف «نشأة الهندوسية في غاندهارا»، وحاز وسام فخر الأداء الرئاسي."
  en: "Pakistan Tourism Portal profile of Abdul Samad: from Jungle Khel, Kohat; MA in archaeology from the University of Peshawar, first in his class with a gold medal; PhD from the Free University of Berlin in 2011 on a DAAD scholarship; taught almost ten years at Hazara University; appointed director of the Khyber Pakhtunkhwa Directorate of Archaeology and Museums in June 2014, later its director general and secretary; author of Emergence of Hinduism in Gandhara; recipient of the Presidential Pride of Performance."
title: "Dr. Abdul Samad — Director General & Secretary, Directorate of Archaeology & Museums, Khyber Pakhtunkhwa"
