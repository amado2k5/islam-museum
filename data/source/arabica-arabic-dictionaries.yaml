reliability_note: "Read in the museum's session on 20 November 2026. It is Baalbaki's long overview of the classical lexicographic tradition (2nd to 12th century AH). It divides the dictionaries into thematic ones (mubawwaba) and root-ordered ones (mujannasa) and describes the orders (articulation points with permutations; alphabetical by first letter; rhyme order by last letter). It says al-Jawhari (d. about 400/1010) was the first to make the alphabetical order of the root letters the only criterion of the rhyme system, probably following his uncle Ishaq al-Farabi (d. 350/961), and that al-Bandaniji (d. 284/897) preceded al-Farabi but considered only the last letter; that Ibn Manzur finished Lisan al-Arab in 689/1290 from five named sources and followed al-Muhkam for the organisation of entries; that al-Qamus draws most of its material from al-Muhkam and al-Ubab, has about three times the proper names of Lisan and twenty times those of al-Sihah, and that the word qamus comes from the Greek okeanos; that Taj al-Arus took fourteen years and some days to dictate, ending in 1188/1774, with 11,978 roots against 9,273 in Lisan and 5,618 in al-Sihah; that Maqayis orders roots alphabetically in a cyclic way and Asas al-Balagha follows figurative usage consistently; and it quotes Ibn Sida's reasons for making al-Mukhassas thematic. Figures are the entry's own. Used for entity facts only."
