summary:
  ar: "مدخل «كورش» ⁦(المصارعة)⁩ في موسوعة TDV الإسلامية: المصارعة عند الترك القدماء وفي الجاهلية، ومصارعة النبي مع ركانة بن عبد يزيد، والبلهوانات في قصور العباسيين والبويهيين، وتكايا المصارعين العثمانية وحوزور كورش ومصارعات قيرق بينار وأنواعها ⁦(قره قوجاق وياغلي وأبا)⁩."
  en: "The TDV İslâm Ansiklopedisi entry on güreş (wrestling): the sport among the ancient Turks and in the Jahiliyya fairs, the Prophet's wrestling with Rukana ibn Abd Yazid, the pehlivans of the Abbasid and Buyid palaces, the Ottoman wrestlers' tekkes and huzur güreşleri, the Kırkpınar fair and its ağa and cazgır, and the wrestling kinds (karakucak, yağlı, aba)."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre güreş (lucha libre): el deporte entre los antiguos turcos y en las ferias de la Jahiliyya, la lucha del Profeta con Rukana ibn Abd Yazid, los pehlivans de los palacios abasíes y buyíes, los tekkes y huzur güreşleri de los luchadores otomanos, la feria de Kırkpınar y su ağa y cazgır, y los tipos de lucha libre (karakucak, yağlı, aba)."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur güreş (lutte): le sport chez les anciens Turcs et dans les foires Jahiliyya, la lutte du Prophète avec Rukana ibn Abd Yazid, les pehlivans des palais abbassides et bouyides, les tekkes et huzur güreşleri des lutteurs ottomans, la foire de Kırkpınar et ses ağa et cazgır, et les types de lutte (karakucak, yağlı, aba)."
  ur: "TDV İslâm Ansiklopedisi Güreş ⁦(کشتی)⁩ پر داخلہ: قدیم ترکوں کے درمیان کھیل اور جاہلیت کے میلوں میں، نبی کی رکانہ ابن عبد یزید کے ساتھ کشتی، عباسی اور بعید محلوں کے پہلوان، عثمانی حوثیوں اور عثمانیوں کی کشتی Kırkpınar میلہ اور اس کا ağa اور cazgır، اور کشتی کی اقسام (karakucak, yağlı, aba)۔"
