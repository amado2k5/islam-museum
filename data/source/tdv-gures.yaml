  ar: "مدخل «كورش» ⁦(المصارعة)⁩ في موسوعة TDV الإسلامية: المصارعة عند الترك القدماء وفي الجاهلية، ومصارعة النبي مع ركانة بن عبد يزيد، والبلهوانات في قصور العباسيين والبويهيين، وتكايا المصارعين العثمانية وحوزور كورش ومصارعات قيرق بينار وأنواعها ⁦(قره قوجاق وياغلي وأبا)⁩."
  en: "The TDV İslâm Ansiklopedisi entry on güreş (wrestling): the sport among the ancient Turks and in the Jahiliyya fairs, the Prophet's wrestling with Rukana ibn Abd Yazid, the pehlivans of the Abbasid and Buyid palaces, the Ottoman wrestlers' tekkes and huzur güreşleri, the Kırkpınar fair and its ağa and cazgır, and the wrestling kinds (karakucak, yağlı, aba)."
