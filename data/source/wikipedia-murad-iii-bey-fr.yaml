summary:
  ar: "مقالة ويكيبيديا الفرنسية عن مراد باي الثالث؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه أبا الظفر مراد بن علي باي وميلاده 1680 واغتياله في 9 حزيران 1702 في صدرها وصندوقها، وإن جعل متنها الاغتيال في عربته عند وادي الزرقة في 2 حزيران، وتذكر سلفه رمضان باي وخلفه إبراهيم الشريف."
  en: "French Wikipedia article on Mourad III Bey; used for entity facts only. Its lead and infobox give his name as Abu al-Zafar Murad ibn Ali Bey, his birth in 1680 and assassination on 9 June 1702, with Ramadan Bey as predecessor and Ibrahim Cherif as successor, but its narrative dates the assassination in his carriage at Oued Zarga to 2 June — the same internal split as the English article, preserved in the person record."
  es: "Artículo de la Wikipedia en francés sobre Mourad III Bey; utilizado únicamente para datos sobre la persona. Su introducción y ficha informativa indican que su nombre era Abu al-Zafar Murad ibn Ali Bey, que nació en 1680 y fue asesinado el 9 de junio de 1702, con Ramadan Bey como predecesor e Ibrahim Cherif como sucesor, pero la narración fecha el asesinato en su carruaje en Oued Zarga el 2 de junio, la misma división interna que el artículo en inglés, conservada en el registro de la persona."
  fr: "Article de Wikipédia en français sur Mourad III Bey; utilisé uniquement pour les informations sur l’entité. Son introduction et son infobox indiquent son nom comme Abu al-Zafar Murad ibn Ali Bey, sa naissance en 1680 et son assassinat le 9 juin 1702, avec Ramadan Bey comme prédécesseur et Ibrahim Cherif comme successeur, mais son récit date l’assassinat dans sa calèche à Oued Zarga du 2 juin — la même division interne que dans l’article anglais, conservée dans la fiche de personne."
