  ar: "مقالة ويكيبيديا الفرنسية عن مراد باي الثالث؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه أبا الظفر مراد بن علي باي وميلاده 1680 واغتياله في 9 حزيران 1702 في صدرها وصندوقها، وإن جعل متنها الاغتيال في عربته عند وادي الزرقة في 2 حزيران، وتذكر سلفه رمضان باي وخلفه إبراهيم الشريف."
  en: "French Wikipedia article on Mourad III Bey; used for entity facts only. Its lead and infobox give his name as Abu al-Zafar Murad ibn Ali Bey, his birth in 1680 and assassination on 9 June 1702, with Ramadan Bey as predecessor and Ibrahim Cherif as successor, but its narrative dates the assassination in his carriage at Oued Zarga to 2 June — the same internal split as the English article, preserved in the person record."
