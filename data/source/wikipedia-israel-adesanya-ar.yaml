  ar: "مقالة ويكيبيديا العربية عن إسرائيل أديسانيا؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته في الكيك بوكسينغ وفنون القتال المختلطة وبطولته في يو إف سي للوزن المتوسط مرتين واهتماماته بالأنمي والرقص."
  en: "Arabic Wikipedia article on Israel Adesanya; used for entity facts only. It recounts his kickboxing and MMA career, his two UFC middleweight championship reigns, and his anime and dance interests."
  es: "Artículo de Wikipedia en árabe sobre Israel Adesanya; se utiliza únicamente para obtener información sobre la persona. Narra su trayectoria en kickboxing y artes marciales mixtas, sus dos reinados como campeón de peso medio de la UFC y su afición por el anime y la danza."
  fr: "Article Wikipédia en arabe sur Israel Adesanya; utilisé uniquement à des fins d'information. Il relate sa carrière en kickboxing et en MMA, ses deux titres de champion des poids moyens de l'UFC, ainsi que ses intérêts pour l'anime et la danse."
  ur: "عربی ویکیپیڈیا مضمون اسرائیل ادیسانیا پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کے کک باکسنگ اور ایم ایم اے کیرئیر، اس کی دو UFC مڈل ویٹ چیمپیئن شپ کے راج، اور ان کی اینیمی اور ڈانس کی دلچسپیوں کا ذکر ہے۔"
  tr: "Israel Adesanya hakkında Arapça Wikipedia makalesi; sadece varlık bilgileri için kullanılmıştır. Kickboks, karma dövüş sanatları, iki kez UFC orta sıklet şampiyonluğu ve anime ile dansa olan ilgileri anlatılır."
  id: "Artikel Wikipedia Arab tentang Israel Adesanya; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kariernya di kickboxing, seni bela diri campuran, gelar juara kelas menengah UFC dua kali, dan minatnya pada anime serta tari."
