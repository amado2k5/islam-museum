  ar: "تقرير صحيفة البينسولا القطرية في 12 أبريل 2023 بمناسبة مرور 25 عامًا على إسلام ويب: موقع تابع لوزارة الأوقاف والشؤون الإسلامية أُطلق سنة 1998 مقتصرًا على الفتوى، ولغاته الست، وأعداد فتاواه واستشاراته ومقالاته وملفاته الصوتية وصفحاته، وتطبيق المكتبة سنة 2022."
