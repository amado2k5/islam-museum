reliability_note: "The official channel's own videos: a primary source for the channel arrangement, the sheikh's output and his self-presentation, not independent corroboration of biography. The description of the Laascaanood lecture video 'Khatarta ay Munaafaqnimadu ay lee dahay Laaasaacaanood || Sheekh Maxamuud Xaliike' (video h2hFEeZImp0, page crawled 27 October 2026) states verbatim: 'This is the official channel page of Sheikh Mahmoud Xaliike', cross-promotes the channel handle @rashaadmedia1 and names his Telegram channels t.me/SheekhMaxamuudXaliike and — in the character-series video (PVjxKE7fBqQ, crawl of about June 2026) — t.me/ShMaxamuudXaliike; the harvest read the same arrangement in Somali in his videos' descriptions: 'Waa Page-ka Channelka rasmiga ah ee Sheekh Maxamuud Xaliike' ('this is the official channel page of Sheikh Mahmoud Xaliike'). Lesson-series credits style him 'Sheikh Mahmoud Muhammad Haliki'. Facebook material read in the second pass identifies the man behind the brand as Rashaad Cabdilaahi: his post of 8 January 2026 announced the fourth session ('fadhigii 4aad') of the sheikh's series at Al Huda Mosque, Laascaanood, cross-promoting this channel and the operation's TikTok account — the source for the operator's name and for the mosque series' recurrence. No separate personal YouTube channel under his own name was found in either research pass. No subscriber count is taken from this source: no vidIQ, SocialCounts, ThoughtLeaders or youtubers.me page for the channel surfaced in the second pass, so no dated YouTube figure exists to carry. The descriptions name no school of law for him. Read on 9 November 2026."
