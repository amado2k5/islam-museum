summary:
  ar: "قناة «رشاد ميديا» على يوتيوب (@RashaadMedia1)، وهي قناة الشيخ محمود خاليكي الرسمية؛ تصف أوصاف مقاطعها القناةَ نفسها بأنها «صفحة القناة الرسمية للشيخ محمود خاليكي»، ومن محاضراته عليها محاضرة لاسعانود في خطر النفاق ⁦(قُرئ وصفها كما فُهرس في 27 أكتوبر 2026)⁩ وسلسلة دروس في أخلاق المسلم."
  en: "The Rashaad Media YouTube channel (@RashaadMedia1), Sheikh Mahmoud Xaliike's official channel; its own videos' descriptions call the channel 'the official channel page of Sheikh Mahmoud Xaliike', and its lectures by him include the Laascaanood lecture on the danger of hypocrisy (description read as indexed on 27 October 2026) and a multi-part lesson series on Muslim character."
  ur: "«رشاد میڈیا» کا یوٹیوب چینل (@RashaadMedia1)، جو شیخ محمود خالیکے کا سرکاری چینل ہے؛ اس کی اپنی ویڈیوز کی تفصیلات چینل کو «شیخ محمود خالیکے کے سرکاری چینل کا صفحہ» کہتی ہیں، اور اس پر ان کے خطبات میں لاسعانود کا «منافقت کے خطرے» پر خطبہ ⁦(اس کی تفصیل 27 اکتوبر 2026ء کی فہرست سازی میں پڑھی گئی)⁩ اور مسلمان کے اخلاق پر کئی حصوں کی درسی سلسلہ شامل ہے۔"
