summary:
  ar: "قناة «رشاد ميديا» على يوتيوب (@RashaadMedia1)، وهي قناة الشيخ محمود خاليكي الرسمية؛ تصف أوصاف مقاطعها القناةَ نفسها بأنها «صفحة القناة الرسمية للشيخ محمود خاليكي»، ومن محاضراته عليها محاضرة لاسعانود في خطر النفاق ⁦(قُرئ وصفها كما فُهرس في 27 أكتوبر 2026)⁩ وسلسلة دروس في أخلاق المسلم."
  en: "The Rashaad Media YouTube channel (@RashaadMedia1), Sheikh Mahmoud Xaliike's official channel; its own videos' descriptions call the channel 'the official channel page of Sheikh Mahmoud Xaliike', and its lectures by him include the Laascaanood lecture on the danger of hypocrisy (description read as indexed on 27 October 2026) and a multi-part lesson series on Muslim character."
  ur: "«رشاد میڈیا» کا یوٹیوب چینل (@RashaadMedia1)، جو شیخ محمود خالیکے کا سرکاری چینل ہے؛ اس کی اپنی ویڈیوز کی تفصیلات چینل کو «شیخ محمود خالیکے کے سرکاری چینل کا صفحہ» کہتی ہیں، اور اس پر ان کے خطبات میں لاسعانود کا «منافقت کے خطرے» پر خطبہ ⁦(اس کی تفصیل 27 اکتوبر 2026ء کی فہرست سازی میں پڑھی گئی)⁩ اور مسلمان کے اخلاق پر کئی حصوں کی درسی سلسلہ شامل ہے۔"
  es: "El canal de YouTube Rashaad Media (@RashaadMedia1), el canal oficial del jeque Mahmoud Xaliike; las descripciones de sus propios vídeos lo denominan \"la página oficial del canal del jeque Mahmoud Xaliike\", y entre sus conferencias se incluyen la conferencia Laascaanood sobre el peligro de la hipocresía (descripción leída según la indexación del 27 de octubre de 2026) y una serie de lecciones en varias partes sobre el carácter musulmán."
  fr: "La chaîne YouTube Rashaad Media (@RashaadMedia1), la chaîne officielle du cheikh Mahmoud Xaliike; les descriptions de ses propres vidéos appellent la chaîne « la page officielle de la chaîne du cheikh Mahmoud Xaliike », et ses conférences de lui incluent la conférence Laascaanood sur le danger de l'hypocrisie (description lue telle qu'indexée le 27 octobre 2026) et une série de leçons en plusieurs parties sur le caractère musulman."
  tr: "Şeyh Mahmoud Khaliki'nin resmi kanalı olan YouTube'daki 'Rashad Media' kanalı (@RashaadMedia1), kliplerini kanalın kendi 'Şeyh Mahmoud Khaliki için resmi kanal sayfası' olarak tanımlıyor. Konferansları arasında Asanoud'un ikiyüzlülüğün tehlikeleri üzerine verdiği bir konferans (tanımı 27 Ekim 2026'da indekslenerek okundu) ve Müslüman etiğiyle ilgili bir dizi ders yer alıyor."
  id: "Saluran 'Rashad Media' di YouTube (@RashaadMedia1), saluran resmi Sheikh Mahmoud Khaliki, menggambarkan klip-klipnya sebagai 'halaman saluran resmi untuk Sheikh Mahmoud Khaliki' milik saluran tersebut. Di antara kuliahnya adalah kuliah oleh Asanoud tentang bahaya kemunafikan (deskripsinya dibaca seperti yang diindeks pada 27 Oktober 2026), dan serangkaian pelajaran tentang etika Muslim."
