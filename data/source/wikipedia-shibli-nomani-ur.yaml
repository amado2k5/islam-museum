summary:
  ar: "مقالة ويكيبيديا الأردية «شبلی نعمانی»؛ صندوقها يؤرخ ميلاده في 3 يونيو 1857 ومتنها في 4 يونيو، ووفاته في 18 نوفمبر 1914 بأعظم كره، وتفصّل سيرته ونقده الأدبي ومؤلفاته."
  en: "Urdu Wikipedia article 'Shibli Nomani'; its infobox dates his birth to 3 June 1857 and its text to 4 June, his death to 18 November 1914 at Azamgarh, and it details his life, his literary criticism and his works."
  es: "El artículo de Wikipedia en urdu titulado \"Shibli Nomani\" sitúa su fecha de nacimiento el 3 de junio de 1857 en su ficha informativa, el 4 de junio en su texto, y su fecha de fallecimiento el 18 de noviembre de 1914 en Azamgarh. En él se detallan su vida, su crítica literaria y sus obras."
  fr: "L'article de Wikipédia en ourdou « Shibli Nomani »; son infobox date sa naissance du 3 juin 1857 et son texte du 4 juin, sa mort du 18 novembre 1914 à Azamgarh, et il détaille sa vie, sa critique littéraire et ses œuvres."
  ur: "اردو ویکیپیڈیا مضمون 'شبلی نعمانی'؛ اس کے معلوماتی خانے میں ان کی پیدائش کی تاریخ 3 جون 1857 ہے اور اس کا متن 4 جون، ان کی وفات 18 نومبر 1914 کو اعظم گڑھ میں ہے اور اس میں ان کی زندگی، ان کی ادبی تنقید اور ان کے کام کی تفصیلات درج ہیں۔"
  tr: "Urduca Vikipedi makalesi \"Shibli Nomani\"; kutusunda doğumunu 3 Haziran 1857'de ve 4 Haziran 1914'te ölümünü büyük bir nefretle tarihlendiriyor; biyografisi, edebi eleştirileri ve yazılarını detaylandırıyor."
  id: "Artikel Wikipedia dalam bahasa Urdu \"Shibli Nomani\"; kotaknya mencatat tanggal kelahirannya pada 3 Juni 1857, dan kematiannya pada 4 Juni 1914, dengan kebencian besar, merinci biografi, kritik sastra, dan tulisan-tulisannya."
