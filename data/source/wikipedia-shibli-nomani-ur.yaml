reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Its infobox, citing the German National Library authority file, gives born 3 June 1857 at Azamgarh, died 18 November 1914 in Azamgarh district, teacher Ahmad Ali Saharanpuri, influenced by Sir Syed Ahmad Khan, movements Aligarh and Nadwatul Ulama; its introductory text gives the birth as 4 June 1857 at the village of Bindwal, his first teacher as Maulvi Farooq Chirayakoti, his Hajj in 1876, his passing the law examination and brief practice, his appointment as professor of Persian at Aligarh, his learning French from Professor Arnold, his 1892 journey to Turkey and Syria, his resignation in 1898, and the founding of Darul Musannefin in 1913 — the last a compression, since the English article and the TDV entry place the academy's foundation in 1914, the year of his death. The body largely translates the English article. It names no madhhab for him. Read in full on 24 October 2026."
