  ur: "18 اکتوبر 2010 کی رپورٹ، اسماعیلی کمیونٹی کی آفیشل سائٹ دی اسماعیلی پر، ناہید نینشی کے کیلگری کے میئر کے طور پر انتخاب کے بارے میں، اسے ایک اسماعیلی مسلمان کے عنوان سے پیش کیا گیا۔"
