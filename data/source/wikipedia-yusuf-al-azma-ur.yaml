summary:
  ar: "مقالة ويكيبيديا الأردية عن يوسف العظمہ؛ تُستخدم لوقائع الكيان فقط. ترجمة واسعة للمقالة الإنجليزية تروي حياته العسكرية ووزارته للحربية واستشهاده في ميسلون، وتصنفه ضمن المسلمين السنة السوريين."
  en: "Urdu Wikipedia article on Yusuf al-Azma; used for entity facts only. A full rendering of the English article's account of his military career, his ministry of war and his death at Maysalun, filing him under Syrian Sunni Muslims."
  es: "Artículo de Wikipedia en urdu sobre Yusuf al-Azma; utilizado únicamente para datos sobre la persona. Transcripción completa del artículo en inglés que describe su carrera militar, su ministerio de guerra y su muerte en Maysalun, clasificándolo entre los musulmanes sunitas sirios."
  fr: "Article de Wikipédia en ourdou sur Yusuf al-Azma; utilisé uniquement à des fins d'information. Traduction intégrale de l'article en anglais relatant sa carrière militaire, son ministère de la Guerre et sa mort à Maysalun, le classant parmi les musulmans sunnites syriens."
  ur: "یوسف الاعظم پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ انگریزی مضمون میں ان کے فوجی کیریئر، ان کی وزارت جنگ اور میسالون میں ان کی موت، شام کے سنی مسلمانوں کے تحت ان کی موت کے بارے میں ایک مکمل رینڈرنگ۔"
  tr: "Yusuf el-Azmah hakkında Urduca Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. İngilizce makalenin geniş bir çevirisi, askeri yaşamını, Savaş Bakanlığını ve Maysalun'daki şehitliğini anlatarak onu Sünni Suriyeli Müslümanlar arasında sınıflandırır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Yusuf al-Azmah hanya digunakan untuk fakta entitas tersebut. Terjemahan luas artikel bahasa Inggris menceritakan kehidupan militernya, Kementerian Perangnya, dan kemartiran di Maysalun, mengklasifikasikannya di antara Muslim Sunni Suriah."
