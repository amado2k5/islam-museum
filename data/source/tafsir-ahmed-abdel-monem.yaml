summary:
  ar: "حوار مركز تفسير للدراسات القرآنية مع د. أحمد عبد المنعم، المشرف العام على موقع «إنه القرآن» والمدرس بكلية الطب بجامعة المنصورة، حول أثر القرآن في التغيير ومفاهيم تدبره ومشروعه «إنه القرآن» ومساقاته."
  en: "Interview by the Tafsir Center for Qur'anic Studies with Dr Ahmed Abdel Monem, general supervisor of the 'It's the Quran' website and lecturer at the Faculty of Medicine, Mansoura University, on the Quran's effect in change, the concepts of its contemplation, and his 'It's the Quran' project and courses."
  es: "Entrevista realizada por el Centro Tafsir de Estudios Coránicos al Dr. Ahmed Abdel Monem, supervisor general del sitio web \"Es el Corán\" y profesor de la Facultad de Medicina de la Universidad de Mansoura, sobre el efecto del Corán en el cambio, los conceptos de su contemplación y su proyecto y cursos \"Es el Corán\"."
  fr: "Entretien réalisé par le Centre Tafsir d'études coraniques avec le Dr Ahmed Abdel Monem, superviseur général du site web « C'est le Coran » et maître de conférences à la faculté de médecine de l'université de Mansoura, sur l'influence du Coran sur le changement, les concepts de sa contemplation, ainsi que son projet et ses cours « C'est le Coran »."
