summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله بن عيسى آل خليفة (1883–1966)؛ تُستخدم لوقائع الكيان فقط. تفتتح بأنه ابن الشيخ عيسى بن علي آل خليفة، مولودا في المنامة سنة 1883، وتروي رئاسته أول مجلس لبلدية المنامة (1919–1929)، وتأسيسه أول مدرسة للبنات سنة 1926، وتعيينه أول وزير للمعارف سنة 1931 ورئيسا لقضاة محكمة التمييز سنة 1938، ووفاته في 23 أبريل 1966. لا حقل دين فيها."
  en: "English Wikipedia article on Abdullah bin Isa Al Khalifa (1883–1966); used for entity facts only. It opens by naming him a son of Sheikh Isa ibn Ali Al Khalifa, born in Manama in 1883, and recounts his presidency of the first Manama municipal council (1919–1929), his founding of the first girls' school in 1926, his appointment as first Minister of Education in 1931 and as chief judge of the Court of Cassation in 1938, and his death on 23 April 1966. It has no religion field."
  es: "Artículo de la Wikipedia en inglés sobre Abdullah bin Isa Al Khalifa (1883-1966); utilizado únicamente para datos sobre la persona. Comienza presentándolo como hijo del jeque Isa ibn Ali Al Khalifa, nacido en Manama en 1883, y relata su presidencia del primer consejo municipal de Manama (1919-1929), la fundación de la primera escuela para niñas en 1926, su nombramiento como primer ministro de Educación en 1931 y como juez presidente del Tribunal de Casación en 1938, y su fallecimiento el 23 de abril de 1966. No incluye información sobre religión."
  fr: "Article de Wikipédia en anglais sur Abdullah bin Isa Al Khalifa (1883-1966); utilisé uniquement pour les informations sur l'entité. Il commence par le présenter comme le fils du cheikh Isa ibn Ali Al Khalifa, né à Manama en 1883, et relate sa présidence du premier conseil municipal de Manama (1919-1929), la fondation de la première école de filles en 1926, sa nomination comme premier ministre de l'Éducation en 1931 et comme président de la Cour de cassation en 1938, et son décès le 23 avril 1966. Il ne comporte pas de champ relatif à la religion."
