summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله بن عيسى آل خليفة (1883–1966)؛ تُستخدم لوقائع الكيان فقط. تفتتح بأنه ابن الشيخ عيسى بن علي آل خليفة، مولودا في المنامة سنة 1883، وتروي رئاسته أول مجلس لبلدية المنامة (1919–1929)، وتأسيسه أول مدرسة للبنات سنة 1926، وتعيينه أول وزير للمعارف سنة 1931 ورئيسا لقضاة محكمة التمييز سنة 1938، ووفاته في 23 أبريل 1966. لا حقل دين فيها."
  en: "English Wikipedia article on Abdullah bin Isa Al Khalifa (1883–1966); used for entity facts only. It opens by naming him a son of Sheikh Isa ibn Ali Al Khalifa, born in Manama in 1883, and recounts his presidency of the first Manama municipal council (1919–1929), his founding of the first girls' school in 1926, his appointment as first Minister of Education in 1931 and as chief judge of the Court of Cassation in 1938, and his death on 23 April 1966. It has no religion field."
