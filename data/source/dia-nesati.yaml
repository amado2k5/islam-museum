reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The standard scholarly encyclopaedia entry. It heads him (ö. 1085/1674), names him Ahmed of Edirne — some calling him Nişancı Ahmed Dede or Neşâtî Süleyman Dede — and records, on Sâkıb Dede's information, his great profit from his shaykh Ağazâde Mehmed Dede, postnişin of the Gelibolu Mevlevîhâne, his appointment to the Edirne Mevlevîhâne shaykhdom in 1081/1670, four years in that post, his death in office and burial in the Murâdiye Mosque hazire — the third of the three independent texts behind the person record's sufi settlement. Read in-session 1 November 2026."
