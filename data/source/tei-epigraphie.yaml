summary:
  ar: "الموسوعة الشاملة للنقوش العربية والتركية والفارسية بنسخها المحققة، وهي امتداد لعمل المركز الفرنسي للأبحاث في روما؛ تنشرها اليوم جامعة لييج بالتعاون مع مؤسسة ماكس فان برشم، وتضم ٥٨٬٢٨٩ بطاقة فهرسية و٤٩٬٨٨٤ صورة تغطي العالم الإسلامي حتى سنة ١٠٠٠هـ، وتسجّل في كل بطاقة التاريخ الهجري والميلادي والمكان والحفظ والمادة." 
  en: "The comprehensive corpus of Arabic, Turkish and Persian inscriptions in edition, tracing back to the French research centre in Rome; now published by the University of Liege with the Max van Berchem Foundation, holding 58,289 fiches and 49,884 photographs covering the Muslim world to AH 1000."
  ur: "The comprehensive corpus of Arabic, Turkish and Persian inscriptions in edition, tracing back to the French research centre in Rome; now published by the University of Liege with the Max van Berchem Foundation, holding 58,289 fiches and 49,884 photographs covering the Muslim world to AH 1000."
title: "Thesaurus d'Epigraphie Islamique"
publisher: "University of Liege (ULiege) / Fondation Max van Berchem"
