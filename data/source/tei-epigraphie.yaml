reliability_note: "The authoritative corpus of dated Islamic inscriptions — foundation texts, tombstones, waqf and construction records — and therefore the best corroborating dating source for buildings and objects. Each fiche carries Hijri era, Christian era, place, current repository, language, nature, support type, material and last-update date. Cite as {cite:tei-epigraphie 11979} (the anchor is the fiche number on EpigraphyDisplay.aspx?id=<n>). Facts-only posture: free of charge online since October 2011 and no licence page is published, so inscription text and photographs are never republished and records are rewritten in the museum's own words. Canonical host is the uliege.be base; the legacy domain epigraphie-islamique.org is a parked courtesy page. Assessment: web-sources lane, 8 Nov 2026; decision dec-20261108-204 (supersedes engine false-positive dec-20261108-197)."
