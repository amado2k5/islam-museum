summary:
  ar: "فصل بوريس روزنفلد وأدولف يوشكيفيتش «الهندسة» في Encyclopedia of the History of Arabic Science ⁦(ج 2، روتلج 1996، ص 447–494)⁩؛ تستشهد به مقالة مسلمة المتوازيات على أن مسلمة الخيام أقصت حالة الهندسة الزائدية بينما أقصت مسلمة الطوسي الزائدية والإهليجية معاً، وأن شبه منحرف ساكيري نظر فيه الخيام أولاً في المقالة الأولى من شرح المصادرات، وأن نص «شرح أقليدس» المنسوب للطوسي جدد المنظومة والبراهين."
  en: "Rosenfeld and Youschkevitch's 'Geometry' chapter in Rashed (ed.), Encyclopedia of the History of Arabic Science (vol. 2, Routledge 1996, pp. 447-494); the parallel-postulate article cites it for Khayyam's postulate excluding the hyperbolic case while al-Tusi's ruled out both hyperbolic and elliptic, for Khayyam's first treatment of the Saccheri quadrilateral in Book I of his Explanations, and for the pseudo-Tusi Exposition of Euclid's revised axioms and proofs."
  es: "El capítulo de 'Geometría' de Rosenfeld y Youschkevitch en Rashed (ed.), Encyclopedia of the History of Arabic Science (vol. 2, Routledge 1996, pp. 447-494); el artículo sobre el postulado paralelo lo cita para el postulado de Khayyam que excluye el caso hiperbólico, mientras que el de al-Tusi descarta tanto el hiperbólico como el elíptico, para el primer tratamiento de Khayyam del cuadrilátero de Saccheri en el Libro I de sus Explicaciones, y para la exposición pseudo-Tusi de los axiomas y demostraciones revisados de Euclides."
  fr: "Le chapitre « Géométrie » de Rosenfeld et Youschkevitch dans Rashed (éd.), Encyclopedia of the History of Arabic Science (vol. 2, Routledge 1996, pp. 447-494); l'article sur le postulat parallèle le cite pour le postulat de Khayyam excluant le cas hyperbolique tandis que celui d'al-Tusi excluait à la fois le cas hyperbolique et le cas elliptique, pour le premier traitement par Khayyam du quadrilatère Saccheri dans le Livre I de ses Explications, et pour l'Exposition pseudo-Tusi des axiomes et des preuves révisés d'Euclide."
  ur: "روزنفیلڈ اور یوشکیوچ کا 'جیومیٹری' باب رشد ⁦(ایڈ.)⁩، انسائیکلوپیڈیا آف دی ہسٹری آف عربی سائنس ⁦(جلد 2، روٹلیج 1996، صفحہ 447-494)⁩؛ متوازی مقالے نے اسے ہائپربولک کیس کو چھوڑ کر خیام کے مراسلے کے لیے نقل کیا ہے جب کہ الطوسی نے ہائپربولک اور بیضوی دونوں کو مسترد کیا ہے، خیام نے اپنی وضاحتوں کی کتاب I میں ساکری چوکور کے پہلے علاج کے لیے، اور سیوڈو-طوسی کے لیے ایکسپوزیشن آف یوکلیڈیزوم اور ریوائسز پروف کے لیے۔"
  tr: "Boris Rosenfeld ve Adolf Yushkiewicz'in \"Geometri\" bölümü, Arap Bilimi Tarihi Ansiklopedisi'nde (Cilt 2, Routledge 1996, ss. 447–494); \"Paralel Aksiyomlar\" adlı makalede alıntılanmıştır; burada Hayyam teoreminin hiperbolik geometri durumunu dışladığı, Al-Tusi'nin aksiyomunun ise hem hiperbolik hem de eliptik denklemleri dışladığı belirtilmiştir. Hayyam, Sakiri'nin trapezoidini ilk kez itiraflar üzerine yapılan yorumun ilk makalesinde ele almış ve Tusi'ye atfedilen \"Öklid Yorumu\" metninin sistemi ve ispatları yenilediğini belirtmiştir."
  id: "bab Boris Rosenfeld dan Adolf Yushkiewicz tentang \"Geometri\" dalam Ensiklopedia Sejarah Ilmu Arab (Vol. 2, Routledge 1996, hlm. 447–494); hal ini dikutip dalam artikel \"The Parallel Axioms,\" yang menyatakan bahwa teorema Khayyam mengecualikan kasus geometri hiperbolik, sementara aksioma Al-Tusi mengecualikan baik persamaan hiperbolik maupun elips. Khayyam pertama kali mempertimbangkan trapezoid Sakiri dalam artikel pertama komentar atas pengakuan, dan bahwa teks \"Euclid's Commentary\" yang dikaitkan dengan Tusi memperbarui sistem dan bukti-buktinya."
