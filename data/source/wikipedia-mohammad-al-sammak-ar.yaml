summary:
  ar: "مقالة ويكيبيديا العربية عن المفكر والكاتب محمد السماك: مولده في بيروت 1936، وأمانته العامة للجنة الوطنية الإسلامية المسيحية للحوار وللقمة الروحية الإسلامية، وعضويته في مجلس إدارة مركز الملك عبد الله للحوار، واستشاراته للمفتي ولرفيق الحريري، ومقالاته، وجنسيته السعودية (2021)، وجائزة الملك فيصل (2024)."
  en: "Arabic Wikipedia article on the thinker and writer Mohammad al-Sammak: birth in Beirut in 1936, secretary-generalship of the National Islamic-Christian Committee for Dialogue and of the Islamic Spiritual Summit, board membership of the King Abdullah dialogue centre (KAICIID), adviser to the Mufti and to Rafik Hariri, journalism, Saudi citizenship (2021), and the King Faisal Prize (2024)."
