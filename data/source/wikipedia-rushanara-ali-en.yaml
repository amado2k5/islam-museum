summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن روشانارا علي (مواليد 1975)؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في بيشواناث بسيلهيت في بنغلاديش في 14 مارس 1975، وهجرتها إلى لندن في السابعة، ودراستها في كلية سانت جون بأوكسفورد، وعملها البحثي والحقوقي قبل البرلمان، وانتخابها سنة 2010 أولَ نائبة من أصل بنغلاديشي في مجلس العموم وضمن أوائل النائبات المسلمات، ومنصبها وكيلة وزارة لشؤون التشرد والديمقراطية (2024-2025) واستقالتها منه في أغسطس 2025."
  en: "English Wikipedia article on Rushanara Ali (born 1975); used for entity facts only. It records her birth at Bishwanath, Sylhet, Bangladesh, on 14 March 1975, her move to London at seven, her PPE degree at St John's College, Oxford, her research and human-rights work before Parliament, her 2010 election as the first person of Bangladeshi origin in the House of Commons and one of the UK's first female Muslim MPs, her office as Parliamentary Under-Secretary of State for Homelessness and Democracy (2024–2025) and her resignation from it in August 2025."
