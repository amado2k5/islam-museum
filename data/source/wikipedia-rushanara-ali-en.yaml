summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن روشانارا علي ⁦(مواليد 1975)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في بيشواناث بسيلهيت في بنغلاديش في 14 مارس 1975، وهجرتها إلى لندن في السابعة، ودراستها في كلية سانت جون بأوكسفورد، وعملها البحثي والحقوقي قبل البرلمان، وانتخابها سنة 2010 أولَ نائبة من أصل بنغلاديشي في مجلس العموم وضمن أوائل النائبات المسلمات، ومنصبها وكيلة وزارة لشؤون التشرد والديمقراطية (2024-2025) واستقالتها منه في أغسطس 2025."
  en: "English Wikipedia article on Rushanara Ali (born 1975); used for entity facts only. It records her birth at Bishwanath, Sylhet, Bangladesh, on 14 March 1975, her move to London at seven, her PPE degree at St John's College, Oxford, her research and human-rights work before Parliament, her 2010 election as the first person of Bangladeshi origin in the House of Commons and one of the UK's first female Muslim MPs, her office as Parliamentary Under-Secretary of State for Homelessness and Democracy (2024–2025) and her resignation from it in August 2025."
  es: "Artículo de la Wikipedia en inglés sobre Rushanara Ali (nacida en 1975); utilizado únicamente para datos sobre la persona. En él se registra su nacimiento en Bishwanath, Sylhet, Bangladesh, el 14 de marzo de 1975, su traslado a Londres a los siete años, su licenciatura en Filosofía, Política y Economía (PPE) en el St John's College de Oxford, su investigación y su labor en defensa de los derechos humanos ante el Parlamento, su elección en 2010 como la primera persona de origen bangladesí en la Cámara de los Comunes y una de las primeras mujeres diputadas musulmanas del Reino Unido, su cargo como Subsecretaria Parlamentaria de Estado para la Falta de Vivienda y la Democracia (2024-2025) y su dimisión en agosto de 2025."
  fr: "Article de Wikipédia en anglais sur Rushanara Ali (née en 1975); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Bishwanath, Sylhet, au Bangladesh, le 14 mars 1975, son arrivée à Londres à l’âge de sept ans, son diplôme de philosophie, politique et économie (PPE) au St John’s College d’Oxford, ses recherches et son travail en faveur des droits de l’homme devant le Parlement, son élection en 2010 comme première personne d’origine bangladaise à la Chambre des communes et l’une des premières femmes députées musulmanes du Royaume-Uni, son poste de sous-secrétaire d’État parlementaire chargée du sans-abrisme et de la démocratie (2024-2025) et sa démission de ce poste en août 2025."
  ur: "انگریزی ویکیپیڈیا مضمون پر روشنارا علی ⁦(پیدائش 1975)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 14 مارچ 1975 کو بشواناتھ، سلہٹ، بنگلہ دیش میں اس کی پیدائش، سات سال کی عمر میں اس کی لندن منتقلی، سینٹ جان کالج، آکسفورڈ میں اس کی پی پی ای کی ڈگری، پارلیمنٹ کے سامنے اس کا تحقیقی اور انسانی حقوق کا کام، ہاؤس آف کامنز میں بنگلہ دیشی نژاد پہلی شخصیت کے طور پر اس کا 2010 کا انتخاب اور برطانیہ کی پہلی خاتون رکن پارلیمنٹ کے طور پر ان کی ہوم لیس ممبر پارلیمنٹ کے طور پر منتخب ہونے کا ریکارڈ درج ہے۔ اور جمہوریت (2024–2025) اور اگست 2025 میں اس سے استعفیٰ۔"
