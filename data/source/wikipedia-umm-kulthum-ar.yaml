summary:
  ar: "مقالة ويكيبيديا العربية عن أم كلثوم؛ تُستخدم لوقائع الكيان فقط. تقدّم تاريخ ميلادها 31 ديسمبر 1898 في صدرها — وهو التاريخ المعتمد في سجلّها — وتوثّق سيرتها ومسيرتها الفنية ووفاتها في القاهرة سنة 1975."
  en: "Arabic Wikipedia article on Umm Kulthum; used for entity facts only. Its lead gives her birth as 31 December 1898 — the date the museum follows — and it documents her life, career and death in Cairo in 1975."
  es: "Artículo en árabe de la Wikipedia sobre Umm Kulthum; se utiliza únicamente para obtener información sobre la persona. Su introducción indica que nació el 31 de diciembre de 1898 —fecha que sigue el museo— y documenta su vida, su carrera y su muerte en El Cairo en 1975."
  fr: "Article de Wikipédia en arabe sur Oum Kalthoum; utilisé uniquement pour les informations sur l’entité. Son introduction indique sa naissance le 31 décembre 1898 — date suivie par le musée — et retrace sa vie, sa carrière et sa mort au Caire en 1975."
  ur: "ام کلثوم پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے لیڈ سے اس کی پیدائش 31 دسمبر 1898 ہے - جس تاریخ کے بعد میوزیم ہے - اور یہ 1975 میں قاہرہ میں اس کی زندگی، کیریئر اور موت کی دستاویز کرتا ہے۔"
  tr: "Um Kulthum hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Doğum tarihi 31 Aralık 1898'dir, alnında da bu tarih kayıtlarında belirtilmiştir ve biyografisini, sanatsal kariyerini ve 1975'te Kahire'de ölümünü belgelemektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang um Kulthum hanya digunakan untuk fakta entitas tersebut. Tanggal lahirnya adalah 31 Desember 1898, di dahi—yang merupakan tanggal yang digunakan dalam catatannya—dan mendokumentasikan biografi, karier seni, dan kematiannya di Kairo pada tahun 1975."
