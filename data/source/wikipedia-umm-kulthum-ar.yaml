reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A long article, read in full on 25 October 2026. Its lead names her, as on her birth certificate, Umm Kulthum Ibrahim es-Sayyid el-Beltagi, and dates her 31 December 1898 – 3 February 1975; its text adds that some historians give 31 December 1898 while 'official records' give 4 May 1908 — a third date at odds with the article's own lead and with the English article's 4 May 1904, all recorded in the person record. It corroborates the Cairo career, the composers and poets she worked with, the monthly concerts, her marriage in 1954 to Dr Hasan es-Sayyid el-Hifnawi, her physician, and her death and funeral in Cairo."
