reliability_note: "Read in full on 7 November 2026. The report was originally published by the Ethiopian News Agency on 13 May 2021 and is reproduced by The Free Library from Ethiopia PR Observer. It is an independent news source for the man's public standing: it calls him — in its own wording, with a translation artefact in the syndicated copy — a 'Protuberant Islamic preacher, Ustaz Abubeker Ahmed' (read as: a prominent Islamic preacher) and quotes him speaking publicly at the 1442 Eid al-Fitr celebrations about the Grand Ethiopian Renaissance Dam, alongside Ustaz Yassin Nuru and Sheikh Ali Ahmed, Deputy President of the Addis Ababa Supreme Islamic Affairs Council. It gives no birth date, no biography and no school of law, and it is not a source for his present-day audience figures."
