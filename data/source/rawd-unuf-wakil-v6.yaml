label:
  ar: "الروض الأنف في شرح السيرة النبوية لابن هشام، للسهيلي — تحقيق عبد الرحمن الوكيل، الجزء السادس"
  en: "al-Rawd al-Unuf fi Sharh al-Sira al-Nabawiyya li-Ibn Hisham of al-Suhayli — ed. 'Abd al-Rahman al-Wakil, vol. 6"
summary:
  ar: "الجزء السادس من طبعة عبد الرحمن الوكيل، وفيه نص سيرة ابن هشام من مقتل أبي بن خلف يوم أحد إلى غزوة خيبر، يتلوه شرح السهيلي ⁦(الروض)⁩ لكل قسم، مع حواشي المحقق؛ وفي فهرسه رمز ⁦(س)⁩ للسيرة و⁦(ن. ل)⁩ للنحو واللغة و⁦(ش)⁩ للشعر، والروض بلا رمز."
  en: "Volume 6 of 'Abd al-Rahman al-Wakil's edition: the text of Ibn Hisham's Sira from the killing of Ubayy ibn Khalaf at Uhud to the Khaybar campaign, each section followed by al-Suhayli's commentary (the Rawd), with the editor's notes; its index marks Sira passages ⁦(س)⁩, grammar and language ⁦(ن. ل)⁩ and poetry ⁦(ش)⁩, the Rawd being unmarked."
  es: "Volumen 6 de la edición de 'Abd al-Rahman al-Wakil: el texto de la Sira de Ibn Hisham desde la muerte de Ubayy ibn Khalaf en Uhud hasta la campaña de Khaybar, cada sección seguida del comentario de al-Suhayli (el Rawd), con las notas del editor; su índice marca los pasajes de la Sira ⁦(س)⁩, la gramática y el lenguaje ⁦(ن. ل)⁩ y la poesía ⁦(ش)⁩, mientras que el Rawd no está marcado."
  fr: "Volume 6 de l'édition d'Abd al-Rahman al-Wakil: le texte de la Sira d'Ibn Hisham, depuis le meurtre d'Ubayy ibn Khalaf à Uhud jusqu'à la campagne de Khaybar, chaque section étant suivie du commentaire d'al-Suhayli (le Rawd), avec les notes de l'éditeur; son index marque les passages de la Sira ⁦(س)⁩, la grammaire et la langue ⁦(ن. ل)⁩ et la poésie ⁦(ش)⁩, le Rawd n'étant pas marqué."
  ur: "عبد الرحمن الوکیل کے ایڈیشن کی جلد 6: ابن ہشام کی سیرت کا متن احد میں ابی ابن خلف کے قتل سے لے کر خیبر مہم تک، ہر ایک حصے کے بعد السحیلی کی تفسیر ⁦(رعود)⁩، مدیر کے نوٹس کے ساتھ؛ اس کا اشاریہ سیرت کے اقتباسات ⁦(س)⁩، گرامر اور زبان ⁦(ن. ل)⁩ اور شاعری ⁦(ش)⁩ کو نشان زد کرتا ہے، راڈ کو غیر نشان زد کیا گیا ہے۔"
