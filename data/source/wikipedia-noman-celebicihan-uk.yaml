  ar: "مقالة ويكيبيديا الأوكرانية عن نعمان چلبى جهان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1885 في بييوك سوناك وأن والده كان إمام المسجد، وتفصّل انتخابه رئيسا للجنة التنفيذية المسلمة ومفتيا سنة 1917 ودعوته بصفته مفتيا إلى إصلاحات، وإعدامه في 23 فبراير 1918؛ ولا تذكر له مذهبا."
  en: "Ukrainian Wikipedia article on Noman Chelebidjikhan; used for entity facts only. It gives his birth in 1885 at Büyük Sonaq and that his father was the mosque's imam, and details his 1917 election as chairman of the Muslim Executive Committee and as mufti, his reform calls issued as mufti, and his execution on 23 February 1918; it names no school for him."
