summary:
  ar: "مقالة ويكيبيديا الأوكرانية عن نعمان چلبى جهان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1885 في بييوك سوناك وأن والده كان إمام المسجد، وتفصّل انتخابه رئيسا للجنة التنفيذية المسلمة ومفتيا سنة 1917 ودعوته بصفته مفتيا إلى إصلاحات، وإعدامه في 23 فبراير 1918؛ ولا تذكر له مذهبا."
  en: "Ukrainian Wikipedia article on Noman Chelebidjikhan; used for entity facts only. It gives his birth in 1885 at Büyük Sonaq and that his father was the mosque's imam, and details his 1917 election as chairman of the Muslim Executive Committee and as mufti, his reform calls issued as mufti, and his execution on 23 February 1918; it names no school for him."
  es: "Artículo de la Wikipedia en ucraniano sobre Noman Chelebidjikhan; utilizado únicamente para datos sobre la persona. Indica que nació en 1885 en Büyük Sonaq y que su padre era el imán de la mezquita. Detalla su elección en 1917 como presidente del Comité Ejecutivo Musulmán y como muftí, sus llamamientos a la reforma emitidos como muftí y su ejecución el 23 de febrero de 1918; no menciona ninguna escuela a la que pertenezca."
  fr: "L'article de Wikipédia ukrainien consacré à Noman Chelebidjikhan, utilisé uniquement à des fins d'information sur l'entité, indique sa naissance en 1885 à Büyük Sonaq, précise que son père était l'imam de la mosquée, et détaille son élection en 1917 à la présidence du Comité exécutif musulman et à sa nomination comme mufti, ses appels à la réforme lancés en tant que mufti, ainsi que son exécution le 23 février 1918. Aucune école n'est mentionnée à son nom."
  ur: "نعمان چیلیبیدجیخان پر یوکرینی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 1885 میں بیوک سوناق میں ہوئی ہے اور یہ کہ ان کے والد مسجد کے امام تھے، اور ان کے 1917 کے مسلم ایگزیکٹو کمیٹی کے چیئرمین اور مفتی کے طور پر انتخاب کی تفصیلات بتاتے ہیں، مفتی کے طور پر ان کی اصلاحی کالیں جاری کی گئیں، اور 23 فروری 1918 کو ان کی پھانسی؛ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
