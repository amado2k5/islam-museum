summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نعمان چلبى جهان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1885 في بييوك سوناك ووفاته رميا بالرصاص في سيفاستوبول في 23 فبراير 1918، وتفصّل رئاسته حكومة جمهورية القرم الشعبية ووزارة عدلها وانتخابه مفتيا مؤقتا سنة 1917 وتأليفه النشيد الوطني التتري؛ ولا تذكر له مذهبا."
  en: "English Wikipedia article on Noman Chelebidjikhan; used for entity facts only. It gives his birth in 1885 at Büyük Sonaq and his shooting at Sevastopol on 23 February 1918, and details his chairmanship of the Crimean People's Republic's Directory and justice administration, his 1917 election as temporary mufti and his authorship of the Crimean Tatar national anthem; it names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Noman Chelebidjikhan; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1885 en Büyük Sonaq y su fusilamiento en Sebastopol el 23 de febrero de 1918, y detalla su presidencia del Directorio y la administración de justicia de la República Popular de Crimea, su elección como muftí interino en 1917 y su autoría del himno nacional tártaro de Crimea; no menciona ninguna escuela a la que haya asistido."
  fr: "L'article de Wikipédia en anglais sur Noman Chelebidjikhan, utilisé uniquement pour les informations sur l'entité, indique sa naissance en 1885 à Büyük Sonaq et son assassinat à Sébastopol le 23 février 1918. Il détaille également sa présidence du Directoire et de l'administration judiciaire de la République populaire de Crimée, son élection en 1917 comme mufti temporaire et sa contribution à l'hymne national tatar de Crimée. Aucune école n'est mentionnée à son nom."
  ur: "نعمان چیلیبیدجیخان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1885 میں Büyük Sonaq میں اس کی پیدائش اور 23 فروری 1918 کو Sevastopol میں اس کی شوٹنگ، اور Crimean People's Republic's Directory and Justice Administance کی ان کی چیئرمین شپ، 1917 کے عارضی مفتی کے طور پر ان کے انتخاب اور کریمیائی تاتار قومی ترانے کی ان کی تصنیف کی تفصیلات بیان کرتا ہے۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Numan Çelebi Jahan hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1885'te Buyuk Sunak'ta doğduğunu ve 23 Şubat 1918'de Sivastopol'da kurşuna dizilerek öldürülmesini anlatır; ayrıca Kırım Halk Cumhuriyeti hükümetindeki liderliğini, Adalet Bakanlığı'nı ve 1917'de geçici müftü olarak seçilmesini ve Tatar milli marşını bestelerini detaylandırır; kendisi için herhangi bir mezhepten bahsedilmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Numan Çelebi Jahan; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada tahun 1885 di Buyuk Sunak dan kematiannya akibat regu tembak di Sevastopol pada 23 Februari 1918, serta merinci kepemimpinannya atas pemerintahan Republik Rakyat Krimea dan Kementerian Kehakimannya, pemilihannya sebagai mufti sementara pada tahun 1917, serta komposisinya atas lagu kebangsaan Tatar; tidak disebutkan sekte apapun untuknya."
