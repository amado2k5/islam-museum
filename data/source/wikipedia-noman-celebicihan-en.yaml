  ar: "مقالة ويكيبيديا الإنجليزية عن نعمان چلبى جهان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1885 في بييوك سوناك ووفاته رميا بالرصاص في سيفاستوبول في 23 فبراير 1918، وتفصّل رئاسته حكومة جمهورية القرم الشعبية ووزارة عدلها وانتخابه مفتيا مؤقتا سنة 1917 وتأليفه النشيد الوطني التتري؛ ولا تذكر له مذهبا."
  en: "English Wikipedia article on Noman Chelebidjikhan; used for entity facts only. It gives his birth in 1885 at Büyük Sonaq and his shooting at Sevastopol on 23 February 1918, and details his chairmanship of the Crimean People's Republic's Directory and justice administration, his 1917 election as temporary mufti and his authorship of the Crimean Tatar national anthem; it names no school for him."
