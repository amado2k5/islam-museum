summary:
  ar: "صفحة الدورات الحضورية للجمعية الإسلامية الطلابية في مانشستر؛ تدرج دورة «كتاب التوحيد» في مركز الفرقان بتدريس «الشيخ محمد علي مولي»، وهي شهادة مستقلة على دوره التعليمي في المركز."
  en: "The Manchester Islamic Society's in-person courses page; it lists an Al Furqan course, 'Kitab At-Tawhid', taught 'By Sheikh Muhammed Ali Mowlee', an attestation of his teaching role at the centre independent of the centre itself."
  es: "La página de cursos presenciales de la Sociedad Islámica de Manchester enumera un curso de Al Furqan, 'Kitab At-Tawhid', impartido 'Por el jeque Muhammed Ali Mowlee', una certificación de su papel docente en el centro, independientemente del centro en sí."
  fr: "La page des cours en présentiel de la Société islamique de Manchester mentionne un cours d'Al Furqan, « Kitab At-Tawhid », dispensé « par le cheikh Muhammed Ali Mowlee », ce qui atteste de son rôle d'enseignant au sein du centre, indépendamment du centre lui-même."
  ur: "مانچسٹر اسلامک سوسائٹی کا ذاتی کورسز کا صفحہ؛ اس میں الفرقان کورس کی فہرست دی گئی ہے، 'کتاب التوحید'، جسے 'شیخ محمد علی مولی' نے پڑھایا ہے، جو مرکز سے آزاد مرکز میں ان کے تدریسی کردار کی تصدیق ہے۔"
  tr: "Manchester'daki İslami Öğrenci Derneği'nin yüz yüze kurslar sayfası; Al-Furqan Merkezi'ndeki 'Kitab al-Tawhid' dersi, merkezdeki eğitimsel rolünün bağımsız bir kanıtı olan Şeyh Muhammed Ali Mawla tarafından verilmektedir."
  id: "Halaman kursus tatap muka dari Asosiasi Mahasiswa Islam di Manchester; kursus 'Kitab al-Tawhid' di Pusat Al-Furqan diajarkan oleh Sheikh Muhammad Ali Mawla, yang merupakan bukti independen dari peran pendidikannya di pusat tersebut."
