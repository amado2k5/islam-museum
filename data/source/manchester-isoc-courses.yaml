reliability_note: "The course listing of the University of Manchester's Islamic Society, which runs joint courses with the city's mosques and centres. Under 'Al Furqan: Kitab At-Tawhid' it names the teacher as 'Sheikh Muhammed Ali Mowlee' — a third spelling of his name and an independent attestation of his teaching at the centre. Teaching a set text is not a personal school attestation, and the listing names no school or affiliation for him. Checked 24 October 2026."
