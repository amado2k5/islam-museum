summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن السيد جمال الدين واعظ الإصفهاني؛ تُستخدم لوقائع الكيان فقط. تعطي سنواته 1862–1908، وتصفه بأنه واعظ وكاتب دستوري شهير في إيران وأحد مؤسسي الحركة الدستورية في إصفهان، وتنقل عن كيدي وصف ابنه له بأنه مفكر حر، وتذكر كتابيه «لباس التقوى» و«الرؤيا الصادقة» وأنه والد محمد علي جمال زاده."
  en: "English Wikipedia article on Sayyid Jamal al-Din Va'iz Esfahani; used for entity facts only. It gives his years as 1862–1908, describes him as a popular pro-constitutional preacher and writer in Iran and a founder of the constitutional movement in Isfahan, quotes Keddie's report that his son described him as a freethinker, and lists his works Lebas ot-taqva and The True Dream and his son, the writer Mohammad Ali Jamalzadeh."
  es: "Artículo de la Wikipedia en inglés sobre Sayyid Jamal al-Din Va'iz Esfahani; utilizado únicamente para datos sobre la persona. Indica que vivió entre 1862 y 1908, lo describe como un predicador y escritor popular a favor de la constitución en Irán y fundador del movimiento constitucional en Isfahán, cita el informe de Keddie según el cual su hijo lo describió como un librepensador, y enumera sus obras Lebas ot-taqva y El sueño verdadero, así como a su hijo, el escritor Mohammad Ali Jamalzadeh."
  fr: "L'article de Wikipédia en anglais sur Sayyid Jamal al-Din Va'iz Esfahani, utilisé uniquement pour les informations biographiques, indique ses années de naissance et de décès (1862-1908). Il le décrit comme un prédicateur et écrivain pro-constitutionnel populaire en Iran, fondateur du mouvement constitutionnel à Ispahan, cite le rapport de Keddie selon lequel son fils le décrivait comme un libre-penseur, et mentionne ses œuvres *Lebas ot-taqva* et *The True Dream*, ainsi que le nom de son fils, l'écrivain Mohammad Ali Jamalzadeh."
