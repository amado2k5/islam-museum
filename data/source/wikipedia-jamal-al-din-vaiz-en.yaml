  ar: "مقالة ويكيبيديا الإنجليزية عن السيد جمال الدين واعظ الإصفهاني؛ تُستخدم لوقائع الكيان فقط. تعطي سنواته 1862–1908، وتصفه بأنه واعظ وكاتب دستوري شهير في إيران وأحد مؤسسي الحركة الدستورية في إصفهان، وتنقل عن كيدي وصف ابنه له بأنه مفكر حر، وتذكر كتابيه «لباس التقوى» و«الرؤيا الصادقة» وأنه والد محمد علي جمال زاده."
  en: "English Wikipedia article on Sayyid Jamal al-Din Va'iz Esfahani; used for entity facts only. It gives his years as 1862–1908, describes him as a popular pro-constitutional preacher and writer in Iran and a founder of the constitutional movement in Isfahan, quotes Keddie's report that his son described him as a freethinker, and lists his works Lebas ot-taqva and The True Dream and his son, the writer Mohammad Ali Jamalzadeh."
