summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شهاب الدين ويرك؛ تُستخدم لوقائع الكيان فقط. تروي أنه محامٍ وسياسي بنجابي من مقاطعة سيالكوت، انتُخب لعضوية مجلس البنجاب التشريعي سنة 1923 وتولى رئاسته ثلاث دورات متتالية (1925–1936)، ثم كان أول رئيس لمجلس البنجاب التشريعي (1937–1945)، وتوفي في لاهور سنة 1946."
  en: "English Wikipedia article on Shahab-ud-Din Virk; used for entity facts only. It records a Punjabi lawyer and politician from Sialkot District who entered the Punjab Legislative Council in 1923 and presided over it for three consecutive terms (1925–1936), then served as Speaker of the Punjab Legislative Assembly (1937–1945), and died at Lahore in 1946."
  es: "Artículo de la Wikipedia en inglés sobre Shahab-ud-Din Virk; utilizado únicamente para datos biográficos. En él se menciona a un abogado y político punjabí del distrito de Sialkot que ingresó en el Consejo Legislativo de Punjab en 1923 y lo presidió durante tres mandatos consecutivos (1925-1936), luego fue presidente de la Asamblea Legislativa de Punjab (1937-1945) y falleció en Lahore en 1946."
  fr: "Article de Wikipédia en anglais sur Shahab-ud-Din Virk; utilisé uniquement pour les informations sur l’entité. Il retrace l’histoire d’un avocat et homme politique punjabi originaire du district de Sialkot, entré au Conseil législatif du Pendjab en 1923 et qui l’a présidé pendant trois mandats consécutifs (1925-1936), puis a été président de l’Assemblée législative du Pendjab (1937-1945), et est décédé à Lahore en 1946."
  ur: "شہاب الدین ورک پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ضلع سیالکوٹ سے تعلق رکھنے والے ایک پنجابی وکیل اور سیاست دان کا ریکارڈ ہے جو 1923 میں پنجاب لیجسلیٹو کونسل میں داخل ہوا اور مسلسل تین بار (1925-1936) تک اس کی صدارت کی، پھر پنجاب لیجسلیٹو اسمبلی (1937-1945) کے سپیکر کے طور پر کام کیا، اور 1946 میں لاہور میں انتقال کر گئے۔"
