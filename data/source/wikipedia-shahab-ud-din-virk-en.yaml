  ar: "مقالة ويكيبيديا الإنجليزية عن شهاب الدين ويرك؛ تُستخدم لوقائع الكيان فقط. تروي أنه محامٍ وسياسي بنجابي من مقاطعة سيالكوت، انتُخب لعضوية مجلس البنجاب التشريعي سنة 1923 وتولى رئاسته ثلاث دورات متتالية (1925–1936)، ثم كان أول رئيس لمجلس البنجاب التشريعي (1937–1945)، وتوفي في لاهور سنة 1946."
  en: "English Wikipedia article on Shahab-ud-Din Virk; used for entity facts only. It records a Punjabi lawyer and politician from Sialkot District who entered the Punjab Legislative Council in 1923 and presided over it for three consecutive terms (1925–1936), then served as Speaker of the Punjab Legislative Assembly (1937–1945), and died at Lahore in 1946."
