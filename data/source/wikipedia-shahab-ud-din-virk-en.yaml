reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. The article is a short stub: it gives no birth date (its category files him under year of birth missing), says he was born into a Muslim Jat family of the Virk tribe from Sialkot District (citing Talbot 2013, p. 97, and a Brill volume of 2022, p. 15) — a statement of family background, not of a school — and records his education at Government College, Lahore, his election to the Lahore Municipal Committee in 1912, his membership of the Punjab Legislative Council from 1923 and its presidency for three consecutive terms between 1925 and 1936 (citing The Punjab Parliamentarians 1897–2013, Provincial Assembly of the Punjab, 2015), his knighthood in the 1930 New Year Honours (citing the Edinburgh Gazette of 7 January 1930), his speakership of the Punjab Legislative Assembly from April 1937 to March 1945, and his death at Lahore in 1946."
