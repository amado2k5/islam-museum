summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شوكت علي (1873–1938)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في رامبور في 10 مارس 1873، وتعليمه في جامعة عليكرة الإسلامية وخدمته المدنية، ونشاطه في حركة الخلافة وسجنه، ومعارضته تقرير نهرو، وحضوره مؤتمري المائدة المستديرة، وانضمامه إلى العصبة الإسلامية سنة 1936، ووفاته في دلهي في 26 نوفمبر 1938 ودفنه قرب الجامع الكبير."
  en: "English Wikipedia article on Shaukat Ali (1873–1938); used for entity facts only. It recounts his birth at Rampur on 10 March 1873, his education at Aligarh Muslim University and his civil service, his Khilafat-movement activity and imprisonments, his opposition to the Nehru Report, his attendance at the Round Table Conferences, his joining the Muslim League in 1936, and his death at Delhi on 26 November 1938 and burial near the Jama Masjid."
