summary:
  ar: "«القانون الأساسي الفلسطيني المعدل، 2003»، كما يُنشر عند: المركز الوطني الفلسطيني للمعلومات، وفا. العنوان ونص المادة 4، الفقرة 3 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Amended Basic Law of Palestine, 2003, as published at: Palestinian National Information Center, WAFA. The address and the wording of Article 4, paragraph 3 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Amended Basic Law of Palestine, 2003، جیسا کہ Palestinian National Information Center, WAFA پر شائع ہے۔ پتہ اور دفعہ 4، شق 3 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Amended Basic Law of Palestine, 2003, tel que publié à : Palestinian National Information Center, WAFA. L'adresse et le texte (article 4, paragraphe 3) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Amended Basic Law of Palestine, 2003, tal como se publica en: Palestinian National Information Center, WAFA. La dirección y el texto (artículo 4, párrafo 3) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Değiştirilmiş Filistin Temel Yasası, 2003,\" yayımlandığı üzere: Filistin Ulusal Bilgi Merkezi, WAFA. Madde 4, paragraf 3'ün başlığı ve metni müze tarafından sağlanan bir araştırma özetinden alınmıştır ve müze sayfayı açmamıştır; kurucu, metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Undang-Undang Dasar Palestina yang Diamandemen, 2003,\" sebagaimana diterbitkan di: Pusat Informasi Nasional Palestina, WAFA. Judul dan teks Pasal 4, paragraf 3 diambil dari ringkasan penelitian yang disediakan oleh museum, dan museum tidak membuka halaman tersebut; pendiri mengizinkan penggunaan teks tersebut sebagaimana dinyatakan pada 21 November 2026."
