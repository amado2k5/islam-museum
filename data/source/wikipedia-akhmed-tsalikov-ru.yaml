summary:
  ar: "مقالة ويكيبيديا الروسية عن أحمد تساليكوف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1882 في قرية نوغقاو بمنطقة تيريك في أسرة أوسيتي مسلم، وصندوق معلوماتها يعطي دينه «الإسلام» دون مذهب، وتفصّل قيادته المنشفية وخطبه في مؤتمر مسلمي روسيا سنة 1917 وهجرته إلى تشيكوسلوفاكيا وبولندا ووفاته في 2 سبتمبر 1928 في براغا بوارسو، وتسرد مؤلفاته."
  en: "Russian Wikipedia article on Akhmed Tembulatovich Tsalikov (he has no English article); used for entity facts only. It gives his birth in 1882 at the aul of Nogkau in the Terek region, into the family of an Ossetian Muslim, its infobox gives his religion as Islam with no school, and it details his Menshevik leadership, his speeches at the 1917 All-Russian Muslim Congress, his emigration to Czechoslovakia and Poland and his death on 2 September 1928 at Praga, Warsaw, and lists his works."
  es: "Artículo de la Wikipedia rusa sobre Akhmed Tembulatovich Tsalikov (no tiene artículo en inglés); se utiliza únicamente para datos sobre la persona. Indica que nació en 1882 en el pueblo de Nogkau, en la región de Terek, en el seno de una familia musulmana osetia. Su ficha informativa indica que su religión era el islam sin escuela, y detalla su liderazgo menchevique, sus discursos en el Congreso Musulmán Panruso de 1917, su emigración a Checoslovaquia y Polonia, y su fallecimiento el 2 de septiembre de 1928 en Praga, Varsovia. Además, enumera sus obras."
  fr: "Article de Wikipédia en russe sur Akhmed Tembulatovich Tsalikov (il n'existe pas d'article en anglais); utilisé uniquement pour les informations sur l'entité. Il indique sa naissance en 1882 à Nogkau, dans la région du Terek, au sein d'une famille musulmane ossète; son infobox précise qu'il était de confession musulmane sans appartenance à une école religieuse; et détaille son engagement menchevik, ses discours au Congrès musulman panrusse de 1917, son émigration en Tchécoslovaquie et en Pologne, et sa mort le 2 septembre 1928 à Praga, Varsovie. Il liste également ses œuvres."
