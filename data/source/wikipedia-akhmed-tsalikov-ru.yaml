summary:
  ar: "مقالة ويكيبيديا الروسية عن أحمد تساليكوف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1882 في قرية نوغقاو بمنطقة تيريك في أسرة أوسيتي مسلم، وصندوق معلوماتها يعطي دينه «الإسلام» دون مذهب، وتفصّل قيادته المنشفية وخطبه في مؤتمر مسلمي روسيا سنة 1917 وهجرته إلى تشيكوسلوفاكيا وبولندا ووفاته في 2 سبتمبر 1928 في براغا بوارسو، وتسرد مؤلفاته."
  en: "Russian Wikipedia article on Akhmed Tembulatovich Tsalikov (he has no English article); used for entity facts only. It gives his birth in 1882 at the aul of Nogkau in the Terek region, into the family of an Ossetian Muslim, its infobox gives his religion as Islam with no school, and it details his Menshevik leadership, his speeches at the 1917 All-Russian Muslim Congress, his emigration to Czechoslovakia and Poland and his death on 2 September 1928 at Praga, Warsaw, and lists his works."
