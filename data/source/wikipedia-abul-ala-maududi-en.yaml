reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth on 25 September 1903 at Aurangabad into a clerical family of Chishti descent, his father's home education in Arabic, Persian, Islamic law and hadith, his ijazahs, his journalism (Taj, al-Jamiah, Tarjuman al-Quran), his meeting with Iqbal and the Darul Islam waqf at Pathankot and Lahore, the founding of Jamaat-e-Islami in August 1941 and its opposition to partition, the 1947 split and his emirate of the Pakistani party until 1972, his arrests (1948, 1964, 1967), the 1953 anti-Ahmadiyya campaign, his death sentence and release after two years under public pressure, his support for Zia-ul-Haq's Islamisation, his doctrines — divine sovereignty (hakimiyya) and the 'theodemocracy', sharia as a complete scheme of life, the phased 'Islamic revolution' — his early criticism of Sufism and later redefinition of it as sharia-bound, his marriage in 1937, his six sons and three daughters, his kidney ailment, his death in Buffalo, New York on 22 September 1979, his burial at his Ichhra residence in Lahore and the funeral prayer led by Yusuf al-Qaradawi, and his Tafhim-ul-Quran, begun in 1942. The article names no legal school as his own; his formation touched Deobandi and Chishti circles, which the person record reports without converting them into an affiliation. Read in full on 24 October 2026."
