  ar: "مقالة ويكيبيديا الإنجليزية عن أبي الأعلى المودودي؛ تُستخدم لوقائع الكيان فقط. توثّق نشأته في أورنج آباد، وتأسيسه جماعة الإسلامية سنة 1941، ونشاطه في باكستان وحكم الإعدام الذي صدر عليه سنة 1953 ثم أُطلق سراحه، وأفكاره في الدولة الإسلامية والشريعة والتصوف، ووفاته في بوفالو سنة 1979."
  en: "English Wikipedia article on Abul A'la Maududi; used for entity facts only. It records his Aurangabad childhood, the founding of Jamaat-e-Islami in 1941, his Pakistani career and the 1953 death sentence commuted to release, his doctrines of the Islamic state, sharia and Sufism, and his death in Buffalo in 1979."
