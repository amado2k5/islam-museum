reliability_note: "Independent encyclopedia account, read in full on 24 October 2026. Its Quick Facts give born June 23, 1879, Al-Minyā, and died December 12, 1947, Cairo. The body confirms independently of Wikipedia that after her husband's death she shifted from the nationalist movement to women's equality, founded the Egyptian Feminist Union in 1923, removed her face veil in a Cairo train station in March 1923 while returning from the International Women Suffrage Alliance conference in Rome, remained the Union's president for the rest of her life, became founding president of the Arab Feminist Union in 1945, and that the Union launched L'Égyptienne (later Al-Misriyyah) in 1925. It names no religion or school for her."
