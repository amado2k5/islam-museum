  en: "Encyclopaedia Britannica entry on Huda Sharawi by Jennifer Jaffer: founder of the women's movement in Egypt, who established the Egyptian Feminist Union in 1923 and removed her face veil at a Cairo train station in March of that year."
  es: "Entrada de la Enciclopedia Británica sobre Huda Sharawi, escrita por Jennifer Jaffer: fundadora del movimiento feminista en Egipto, quien estableció la Unión Feminista Egipcia en 1923 y se quitó el velo facial en una estación de tren de El Cairo en marzo de ese mismo año."
  fr: "Article de l'Encyclopædia Britannica sur Huda Sharawi par Jennifer Jaffer: fondatrice du mouvement féministe en Égypte, qui a créé l'Union féministe égyptienne en 1923 et a retiré son voile dans une gare du Caire en mars de la même année."
