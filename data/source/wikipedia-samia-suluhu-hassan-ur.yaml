summary:
  ar: "مقالة ويكيبيديا الأردية عن سامية صلوحي حسن؛ تُستخدم لوقائع الكيان فقط. تروي سيرتها ورئاستها تنزانيا؛ وتصنيفاتها تضعها في «اشتراكيون مسلمون» و«مسلمو القرن 21» — تصنيفات ملفّية، ونصها لا يسمي دينا ولا مدرسة."
  en: "Urdu Wikipedia article on Samia Suluhu Hassan; used for entity facts only. It recounts her life and presidency of Tanzania; its categories file her under Muslim socialists and 21st-century Muslims — filings only; its text names no religion or school."
  es: "Artículo de Wikipedia en urdu sobre Samia Suluhu Hassan; se utiliza únicamente para obtener información sobre la persona. Narra su vida y su presidencia de Tanzania; sus categorías la clasifican dentro de los socialistas musulmanes y los musulmanes del siglo XXI (solo se incluyen los datos de las clasificaciones); el texto no menciona ninguna religión ni escuela."
  fr: "Article de Wikipédia en ourdou sur Samia Suluhu Hassan; utilisé uniquement à des fins d’information. Il retrace sa vie et sa présidence de la Tanzanie; ses catégories la classent dans les catégories « socialistes musulmans » et « musulmans du XXIe siècle » (classifications uniquement); son texte ne mentionne aucune religion ni école."
  ur: "سمیعہ سلوہ حسن پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی زندگی اور تنزانیہ کی صدارت کا ذکر ہے۔ اس کے زمرے اسے مسلم سوشلسٹوں اور 21ویں صدی کے مسلمانوں کے تحت فائل کرتے ہیں - صرف فائلنگ؛ اس کے متن میں کسی مذہب یا اسکول کا نام نہیں ہے۔"
  tr: "Samia Suluhi Hassan hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Biyografisini ve Tanzanya'daki başkanlığını anlatır; sınıflandırmaları onu \"Müslüman sosyalistler\" ve \"21. yüzyıl Müslümanları\" — dosya sınıflandırmaları olarak sınıflandırır ve metinde din veya okul belirtilmez."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Samia Suluhi Hassan; digunakan hanya untuk fakta entitas. Artikel ini menceritakan biografi dan masa kepresidenannya di Tanzania; klasifikasinya menempatkannya di bawah \"sosialis Muslim\" dan \"Muslim abad ke-21\" — klasifikasi file, dan teksnya tidak menyebutkan agama atau sekolah."
