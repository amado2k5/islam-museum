summary:
  ar: "تقرير عرب نيوز باكستان في 30 يوليو 2019 عن تطبيق «لبيك في آر» لمحاكاة الحج والعمرة بالواقع الافتراضي من شركة في كراتشي: 80 ألف صورة بدقة 8K للمشاعر، وتدريب 30 ألف حاج مع شركات الحج، وأقوال الرئيس التنفيذي شهريار أشرف ومدير المشروع عدنان مقبول."
  en: "Arab News Pakistan, 30 July 2019, on Labbaik VR, a virtual-reality Hajj and Umrah simulator app by a Karachi company: 80,000 8K photographs of the holy sites, 30,000 pilgrims trained with Hajj operators, and the words of its CEO Shehriar Ashraf and project director Adnan Maqbool."
  ur: "عرب نیوز پاکستان، 30 جولائی 2019: کراچی کی کمپنی کی ورچوئل رئیلٹی حج و عمرہ سمیولیٹر ایپ «لبیک وی آر»؛ مقدس مقامات کی 80 ہزار 8K تصاویر، حج آپریٹرز کے ساتھ 30 ہزار حاجیوں کی تربیت، اور سی ای او شہریار اشرف اور پروجیکٹ ڈائریکٹر عدنان مقبول کے بیانات۔"
