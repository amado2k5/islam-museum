  ar: مقالة ويكيبيديا الإنجليزية عن أمينة كاشاليا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها باسم أمينة أسفات في فيرينجنغ في 28 يونيو 1930 ووفاتها في جوهانسبرغ في 31 يناير 2013، وعملها في اتحاد نساء جنوب أفريقيا، وخمس عشرة سنة من الإقامة الجبرية، وانتخابها للجمعية الوطنية سنة 1994.
  en: English Wikipedia article on Amina Cachalia; used for entity facts only. It gives her birth as Amina Asvat in Vereeniging on 28 June 1930 and her death in Johannesburg on 31 January 2013, her work in the Federation of South African Women, her fifteen years under house arrest, and her election to the National Assembly in 1994.
  es: "Artículo de la Wikipedia en inglés sobre Amina Cachalia; utilizado únicamente para datos biográficos. En él se indica su nacimiento como Amina Asvat en Vereeniging el 28 de junio de 1930 y su fallecimiento en Johannesburgo el 31 de enero de 2013, su labor en la Federación de Mujeres Sudafricanas, sus quince años de arresto domiciliario y su elección a la Asamblea Nacional en 1994."
  fr: "Article de Wikipédia en anglais sur Amina Cachalia; utilisé uniquement pour les informations relatives à l’entité. Il indique sa naissance sous le nom d’Amina Asvat à Vereeniging le 28 juin 1930 et son décès à Johannesburg le 31 janvier 2013, son travail au sein de la Fédération des femmes sud-africaines, ses quinze années d’assignation à résidence et son élection à l’Assemblée nationale en 1994."
