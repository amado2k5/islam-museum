summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شيرين نشاط؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها في قزوين في 26 مارس 1957 في بيئة أسرية مسلمة، ودراستها في بيركلي، وسلسلة «نساء الله»، وجائزتي البندقية، وفيلم «نساء بلا رجال»."
  en: "English Wikipedia article on Shirin Neshat; used for entity facts only. It records her birth in Qazvin on 26 March 1957, her upbringing in a Muslim family environment, her Berkeley degrees, the Women of Allah series, her two Venice prizes, and the film Women Without Men."
  es: "Artículo de la Wikipedia en inglés sobre Shirin Neshat; se utiliza únicamente para obtener información sobre la persona. En él se recogen su nacimiento en Qazvin el 26 de marzo de 1957, su crianza en un entorno familiar musulmán, sus títulos de Berkeley, la serie Mujeres de Alá, sus dos premios de Venecia y la película Mujeres sin hombres."
  fr: "Article de Wikipédia en anglais sur Shirin Neshat; utilisé uniquement pour des informations sur l’entité. Il relate sa naissance à Qazvin le 26 mars 1957, son éducation dans une famille musulmane, ses diplômes de Berkeley, la série « Women of Allah », ses deux prix à Venise et le film « Women Without Men »."
  ur: "شیریں نشاط پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 26 مارچ 1957 کو قزوین میں اس کی پیدائش، مسلم خاندانی ماحول میں اس کی پرورش، اس کی برکلے کی ڈگریاں، اللہ کی خواتین کی سیریز، اس کے دو وینس انعامات، اور فلم ویمن وداؤٹ مین کو ریکارڈ کیا گیا ہے۔"
  tr: "Sherine Nashat hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 26 Mart 1957'de Qazvin'de Müslüman bir aile ortamında doğduğunu, Berkeley'deki eğitimini, \"Tanrı'nın Kadınları\" dizisini, Venedik Ödülü'nü ve \"Erkeklersiz Kadınlar\" filmini belgelemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Sherine Nashat hanya digunakan untuk fakta entitas tersebut. Ia mendokumentasikan kelahirannya di Qazvin pada 26 Maret 1957, dalam lingkungan keluarga Muslim, studinya di Berkeley, serial \"Women of God,\" Venice Prize, dan film \"Women Without Men.\""
