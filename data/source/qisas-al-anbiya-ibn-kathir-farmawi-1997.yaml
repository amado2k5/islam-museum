reliability_note: "Classical Sunni work (author d. 774 AH), public domain; the 1997 apparatus is copyrighted, and only facts and short attributed quotations are taken. Copy used: harvest item seerah/qisas-anbiya-ibn-kathir/iqraaEBook54 (773 PDF pages, OCR text). Title p. 1, imprint p. 2, the editor's preface pp. 5–9 (dated 1 Rabi' al-Awwal 1411/21 September 1990), chapter 1 (Adam) from p. 11, chapter 20 ('Isa) p. 679, contents pp. 769–773. PRINTED PAGE = PDF PAGE (checked on pp. 5, 13, 50, 69, 78). The editor's statement that the book is 'entirely free of Isra'iliyyat' is his judgement; Ibn Kathir himself marks reports in the text as taken from the Isra'iliyyat (e.g. pp. 50, 69, 78)."
