label:
  ar: "قصص الأنبياء لعماد الدين أبي الفداء إسماعيل بن كثير ⁦(ت 774هـ)⁩ — تحقيق عبد الحي الفرماوي، دار الطباعة والنشر الإسلامية، القاهرة، الطبعة الخامسة 1417هـ/1997م"
  en: "Ibn Kathir (d. 774 AH), Qisas al-Anbiya' — ed. 'Abd al-Hayy al-Farmawi, Dar al-Tiba'a wa-al-Nashr al-Islamiyya, Cairo, 5th edition 1417 AH/1997 CE"
summary:
  ar: "نشرة عبد الحي الفرماوي ⁦(أستاذ التفسير بجامعة الأزهر)⁩ لقصص الأنبياء لابن كثير في مجلد واحد، اعتمد فيها على النسخ المطبوعة، فعزا الآيات وشرح الغريب وترجم للأعلام والأماكن وخرّج الأحاديث وقسّم الكتاب أبواباً وفصولاً بحسب تقسيم المؤلف، وصنع فهرس الموضوعات؛ مع تقديم في المؤلف والكتاب ومنهج التحقيق ⁦(ربيع الأول 1411هـ/سبتمبر 1990م)⁩."
  en: "'Abd al-Hayy al-Farmawi's one-volume edition of Ibn Kathir's Qisas al-Anbiya'. Al-Farmawi, a professor of exegesis at al-Azhar, based it on printed editions; he identified the verses, glossed rare words, gave notes on persons and places, traced the reports, and divided the book into numbered chapters and sections on the author's own divisions, with a subject index. It opens with a preface on the author, the book and the method (Rabi' al-Awwal 1411 AH/September 1990)."
