reliability_note: "Pointer for entity facts only. A careful article: it states that the identity of the Taj Mahal's architect is not definitely known, that Shah Jahan's official histories name only the supervisors Makramat Khan and Mir Abd al-Karim, and that the only explicit evidence for Ahmad is his son Lutfullah's Diwan-i Muhandis poem, whose Delhi-fort claim is corroborated by the official chronicle's naming of Ustad Ahmad and Ustad Hamid as the Red Fort's chief architects (1639-1648). It gives his death in 1649 and no birth year, and names no religion for him. Checked 1 November 2026."
