  ar: "مقالة ويكيبيديا الإنجليزية عن عارف قزوینی؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في قزوين نحو 1882 ووفاته في 21 يناير 1934 في همدان، وتصانيفه الوطنية زمن الثورة الدستورية ولقبه «الشاعر الوطني» وسنواته الأخيرة في همدان ودفنه في ضريح ابن سينا."
  en: "English Wikipedia article on Aref Qazvini; used for entity facts only. It gives his birth at Qazvin about 1882 and his death on 21 January 1934 at Hamadan, his patriotic tasnifs of the Constitutional Revolution, his 'national poet' title, his last years in Hamadan, and his burial at the Avicenna Mausoleum."
