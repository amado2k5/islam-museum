reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It dates the birth circa 1882 with a note giving the rival datings (1295 AH, about 1297 AH, and the 1300 AH of his lifetime Divan cover), and its text leaves his death in the night of 20/21 January 1934 where its infobox gives 21 January. On affiliation it records only that his ancestors two generations back were Zoroastrians and that his father made him learn rawda-khwani and wear a turban, which he gave up on his father's death."
