summary:
  ar: "مقالة ويكيبيديا العربية عن محمد يوسف الكندهلوي (1917–1965)؛ تتبع مقالة الإنجليزية بمصادرها المستشهد بها نفسها، فتذكر حفظه القرآن في العاشرة وتخرجه من مظاهر علوم سنة 1936 ووفاته في لاهور عن 48 عامًا ودفنه بجوار والده؛ ولا تسمّي مذهبًا في متنها."
  en: "The Arabic Wikipedia article on Muhammad Yusuf Kandhlawi (1917–1965); it closely follows the English article with the same cited profiles, stating his memorisation of the Qur'an at ten, his 1936 Mazahir Uloom graduation, his death at Lahore aged 48 and his burial beside his father; it names no school in its prose."
  es: "El artículo de Wikipedia en árabe sobre Muhammad Yusuf Kandhlawi (1917-1965) sigue de cerca el artículo en inglés con los mismos perfiles citados, indicando que memorizó el Corán a los diez años, se graduó en Mazahir Uloom en 1936, murió en Lahore a los 48 años y fue enterrado junto a su padre; no menciona ninguna escuela en su texto."
  fr: "L'article de Wikipédia en arabe sur Muhammad Yusuf Kandhlawi (1917-1965); il suit de près l'article en anglais avec les mêmes profils cités, mentionnant sa mémorisation du Coran à dix ans, son diplôme de Mazahir Uloom en 1936, sa mort à Lahore à l'âge de 48 ans et son enterrement aux côtés de son père; il ne nomme aucune école dans son texte."
