  ar: "مقالة ويكيبيديا الإنجليزية عن حكيم زياش؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في درونتن لأبوين مغربيين من تافوغالت، ومسيرته من هيرنفين وتفينتي إلى أياكس وتشيلسي وغلطة سراي، ومشاركته مع المغرب في بلوغ نصف نهائي كأس العالم 2022."
  en: "English Wikipedia article on Hakim Ziyech; used for entity facts only. It recounts his upbringing in Dronten to Moroccan parents from Tafoughalt, his career from Heerenveen and Twente to Ajax, Chelsea and Galatasaray, and his part in Morocco's run to the 2022 World Cup semi-finals."
