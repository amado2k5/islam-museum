reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Ziyech as born on 19 March 1993 in Dronten, Netherlands, the youngest of nine children of Moroccan parents from Tafoughalt in the Aït Iznassen area near Berkane; his father died on 23 December 2003, when he was ten. Career: Heerenveen from 2012, Twente from 2014 (captain in 2015-16, the captaincy later withdrawn), Ajax from 2016 (Eredivisie and KNVB Cup 2018-19; Dutch Footballer of the Year 2017-18; nicknamed 'the Wizard' by Ajax supporters), Chelsea from 2020 (Champions League, UEFA Super Cup and FIFA Club World Cup 2021), Galatasaray from 2023 (Süper Lig 2023-24 and 2024-25), then Al-Duhail, Wydad and Botafogo. For Morocco: debut in 2015, 64 caps and 25 goals to 2024, World Cups 2018 and 2022 (semi-final, the first by an African nation). Its personal-life section states that he 'has been described as a devout and practicing Muslim'; it names no school. It also records that he donates all his international earnings and bonuses to charities or team staff, and his donation of three hundred thousand meals to the Gaza Strip in March 2025."
