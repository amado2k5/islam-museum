reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026), read through the MediaWiki API at revision 75788848 (3 July 2026) on 2 November 2026. Gives: Egyptian Islamic preacher born in 1978; bachelor's degree in commerce from Ain Shams University (2000) and the certificate of the preachers' institute of the Ministry of Awqaf; connected chains of transmission (asanid) in books of hadith, hadith terminology, fiqh, usul al-fiqh and creed, listed by title; prepared and presented more than fifty television and radio programmes; married with children and living in New Cairo; worked in sales from 1997 while a student; presenter on Iqraa, al-Nahar and ON channels; teacher of character building at an international school; board member of an association against smoking; founder and chair of the trustees of the 'Ummar al-Ard foundation; member of the Royal Aal al-Bayt Institute for Islamic Thought; ranked 27th, 'for the eighth year', among the most influential Muslim figures in the report of the Royal Islamic Strategic Studies Centre in Jordan; coaching certificates and master's studies in psychology. Its list of programmes names 'Ish al-Lahza (Ramadan 2014) and Ahl al-Janna (Ramadan 2013) as television programmes and Hadaya al-Rahman as a radio programme on Nogoum FM (Ramadan 2014). Wikidata (Q6943266) gives only Islam as religion; the article names no school of law or creed. Recorded in docs/authenticity-ledger/pages/wikipedia-mustafa-hosny-ar.yaml."
