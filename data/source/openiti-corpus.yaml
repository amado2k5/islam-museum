summary:
  ar: "مشروع مفتوح يجمع آلاف النصوص العربية والفارسية وغيرها بصيغة مقروءة آليًا، ويعطي لكل مؤلف معرّفًا ثابتًا من سنة الوفاة بالهجري واسم مختصر، مثل ٠٢٥٦البخاري. يُستعمل هنا للمعرّفات وبيانات الفهرسة فقط، ولا تُنقل نصوصه."
  en: "An open project that gathers thousands of Arabic, Persian and other texts in machine-readable form and gives each author a stable identifier made of the Hijri death year and a short name, for example 0256Bukhari. Used here for identifiers and catalogue facts only; its texts are not copied."
  ur: "ایک کھلا منصوبہ جو ہزاروں عربی، فارسی اور دیگر متون کو مشینی صورت میں جمع کرتا ہے اور ہر مصنف کو ہجری سالِ وفات اور مختصر نام پر مشتمل مستقل شناخت دیتا ہے، مثلاً 0256Bukhari۔ یہاں صرف شناختوں اور فہرستی حقائق کے لیے استعمال ہوتا ہے، متون نقل نہیں کیے جاتے۔"
