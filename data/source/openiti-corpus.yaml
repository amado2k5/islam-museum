label:
  ar: "المدونة الآلية للنصوص الإسلامية ⁦(OpenITI)⁩"
  en: "OpenITI, a machine-readable corpus of Islamicate texts"
  ur: "اوپن آئی ٹی آئی، اسلامی متون کا مشینی مجموعہ ⁦(OpenITI)⁩"
summary:
  ar: "مشروع مفتوح يجمع آلاف النصوص العربية والفارسية وغيرها بصيغة مقروءة آليًا، ويعطي لكل مؤلف معرّفًا ثابتًا من سنة الوفاة بالهجري واسم مختصر، مثل ٠٢٥٦البخاري. يُستعمل هنا للمعرّفات وبيانات الفهرسة فقط، ولا تُنقل نصوصه."
  en: "An open project that gathers thousands of Arabic, Persian and other texts in machine-readable form and gives each author a stable identifier made of the Hijri death year and a short name, for example 0256Bukhari. Used here for identifiers and catalogue facts only; its texts are not copied."
  ur: "ایک کھلا منصوبہ جو ہزاروں عربی، فارسی اور دیگر متون کو مشینی صورت میں جمع کرتا ہے اور ہر مصنف کو ہجری سالِ وفات اور مختصر نام پر مشتمل مستقل شناخت دیتا ہے، مثلاً 0256Bukhari۔ یہاں صرف شناختوں اور فہرستی حقائق کے لیے استعمال ہوتا ہے، متون نقل نہیں کیے جاتے۔"
  es: "Un proyecto abierto que recopila miles de textos en árabe, persa y otros idiomas en formato legible por máquina y asigna a cada autor un identificador estable compuesto por el año de fallecimiento según el calendario islámico y un nombre breve, por ejemplo, 0256Bukhari. Se utiliza aquí únicamente para identificadores y datos de catálogo; sus textos no se copian."
  fr: "Un projet ouvert qui rassemble des milliers de textes arabes, persans et autres sous forme lisible par machine et attribue à chaque auteur un identifiant stable composé de l'année de décès selon le calendrier hégirien et d'un nom court, par exemple 0256Bukhari. Utilisé ici uniquement à des fins d'identification et de catalogage; ses textes ne sont pas copiés."
  tr: "Binlerce Arapça, Farsça ve diğer metni makine tarafından okunabilir formatta toplayan açık bir proje; her yazara Hicri'deki ölüm yılından sabit bir tanımlayıcı ve kısaltılmış bir isim veriyor, örneğin 0256 el-Buhari. Burada yalnızca tanımlayıcılar ve veri indeksleme için kullanılır, metin iletimi için kullanılmaz."
  id: "Sebuah proyek terbuka yang mengumpulkan ribuan teks Arab, Persia, dan lainnya dalam format yang dapat dibaca mesin, memberikan setiap penulis pengenal tetap dari tahun kematian dalam Hijriah dan nama singkat, seperti 0256 al-Bukhari. Digunakan di sini hanya untuk pengenal dan data pengindeksan, bukan untuk mengirimkan teks."
