summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد جواد ظریف؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تعطي ولادته في 7 كانون الثاني 1960 ومنصبيه سفيرًا لدى الأمم المتحدة ووزيرًا للخارجية، ويعطي صندوق معلوماتها دينه شيعة اثنا عشرية."
  en: "Urdu Wikipedia article on Mohammad Javad Zarif; used for entity facts only. A short article giving his birth on 7 January 1960 and his posts as ambassador to the United Nations and foreign minister; its infobox gives his religion as Twelver Shia."
  es: "Artículo de Wikipedia en urdu sobre Mohammad Javad Zarif; utilizado únicamente para datos sobre la persona. Un breve artículo que indica su fecha de nacimiento, el 7 de enero de 1960, y sus cargos como embajador ante las Naciones Unidas y ministro de Relaciones Exteriores; su ficha informativa señala que su religión es chiíta duodecimano."
  fr: "Article de Wikipédia en ourdou sur Mohammad Javad Zarif; utilisé uniquement à des fins d'information sur l'entité. Ce court article indique sa date de naissance, le 7 janvier 1960, et ses fonctions d'ambassadeur auprès des Nations Unies et de ministre des Affaires étrangères; son infobox précise qu'il est chiite duodécimain."
  ur: "محمد جواد ظریف پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 7 جنوری 1960 کو ان کی پیدائش اور اقوام متحدہ میں سفیر اور وزیر خارجہ کے طور پر ان کے عہدوں کا ایک مختصر مضمون؛ اس کا انفو باکس اس کا مذہب بارہویں شیعہ کے طور پر دیتا ہے۔"
  tr: "Mohammad Javad Zarif hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 7 Ocak 1960'taki doğumu, Birleşmiş Milletler büyükelçiliği ve dışişleri bakanı olarak iki görevini ve bilgi kutusunda dinini On İki Kişi Şii olarak belirten kısa bir makale."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Mohammad Javad Zarif; digunakan hanya untuk fakta entitas. Sebuah artikel singkat yang menyebutkan kelahirannya pada 7 Januari 1960, dua posisinya sebagai duta besar untuk Perserikatan Bangsa-Bangsa dan menteri luar negeri, serta infobox yang mencantumkan agamanya sebagai Syiah Dua Belas."
