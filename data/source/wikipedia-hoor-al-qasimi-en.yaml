  ar: "مقالة ويكيبيديا الإنجليزية عن حور القاسمي، رئيسة ومديرة مؤسسة الشارقة للفنون؛ تذكر مولدها سنة 1980 ابنةً لحاكم الشارقة، ودراستها في سليد والأكاديمية الملكية والكلية الملكية للفنون، وتأسيسها المؤسسة سنة 2009، واختيارها الشخصية الأكثر تأثيرًا في عالم الفن في قائمة باور 100 لمجلة آرت ريفيو سنة 2024."
  en: "English Wikipedia article on Hoor Al Qasimi, president and director of the Sharjah Art Foundation; it gives her birth in 1980 as a daughter of the Ruler of Sharjah, her education at the Slade School of Fine Art, the Royal Academy of Arts and the Royal College of Art, her founding of the foundation in 2009, and her naming as the art world's most influential person in ArtReview's 2024 Power 100."
