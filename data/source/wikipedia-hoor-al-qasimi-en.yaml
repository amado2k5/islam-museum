summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حور القاسمي، رئيسة ومديرة مؤسسة الشارقة للفنون؛ تذكر مولدها سنة 1980 ابنةً لحاكم الشارقة، ودراستها في سليد والأكاديمية الملكية والكلية الملكية للفنون، وتأسيسها المؤسسة سنة 2009، واختيارها الشخصية الأكثر تأثيرًا في عالم الفن في قائمة باور 100 لمجلة آرت ريفيو سنة 2024."
  en: "English Wikipedia article on Hoor Al Qasimi, president and director of the Sharjah Art Foundation; it gives her birth in 1980 as a daughter of the Ruler of Sharjah, her education at the Slade School of Fine Art, the Royal Academy of Arts and the Royal College of Art, her founding of the foundation in 2009, and her naming as the art world's most influential person in ArtReview's 2024 Power 100."
  es: "Artículo en inglés de la Wikipedia sobre Hoor Al Qasimi, presidenta y directora de la Fundación de Arte de Sharjah; en él se menciona su nacimiento en 1980 como hija del gobernante de Sharjah, su formación en la Slade School of Fine Art, la Royal Academy of Arts y el Royal College of Art, la fundación de la fundación en 2009 y su nombramiento como la persona más influyente del mundo del arte en la lista Power 100 de ArtReview de 2024."
  fr: "L'article de Wikipédia en anglais sur Hoor Al Qasimi, présidente et directrice de la Sharjah Art Foundation, mentionne sa naissance en 1980, fille du souverain de Sharjah, ses études à la Slade School of Fine Art, à la Royal Academy of Arts et au Royal College of Art, la création de la fondation en 2009 et sa nomination comme la personne la plus influente du monde de l'art dans le Power 100 de ArtReview en 2024."
  ur: "شارجہ آرٹ فاؤنڈیشن کے صدر اور ڈائریکٹر حور القاسمی پر انگریزی ویکیپیڈیا کا مضمون؛ اس نے اسے 1980 میں شارجہ کے حکمران کی بیٹی کے طور پر جنم دیا، اس کی تعلیم سلیڈ اسکول آف فائن آرٹ، رائل اکیڈمی آف آرٹس اور رائل کالج آف آرٹ میں ہوئی، اس کی بنیاد 2009 میں رکھی گئی، اور آرٹ ریویو کے 2024 پاور 100 میں آرٹ کی دنیا کی سب سے بااثر شخصیت کے طور پر اس کا نام لیا گیا۔"
  tr: "Sharjah Sanat Vakfı Başkanı ve Direktörü Hoor Al Qasimi hakkında İngilizce Vikipedi makalesi; 1980'de doğduğu, Sharjah hükümdarının kızı olduğunu, Slade, Royal Academy ve Royal College of Arts'taki eğitimlerini, 2009'da vakfı kurduğunu ve 2024'te Art Review'un Power 100 listesinde sanat dünyasının en etkili figürü seçilmesini belirtiyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Hoor Al Qasimi, Presiden dan Direktur Sharjah Art Foundation; artikel tersebut menyebutkan kelahirannya pada tahun 1980, putri penguasa Sharjah, studinya di Slade, Royal Academy, dan Royal College of Arts, mendirikan yayasan pada tahun 2009, serta terpilih sebagai tokoh paling berpengaruh di dunia seni dalam daftar Power 100 Art Review pada tahun 2024."
