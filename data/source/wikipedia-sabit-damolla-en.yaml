reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. Its infobox (citing Forbes 1986, p. 123) gives birth in June 1883 at Atush and death in July 1934 at Aksu; its death section reports capture near Aksu in late April 1934, delivery to Sheng Shicai, and execution reportedly by hanging in July 1934 at Aksu, while also carrying a later allegation that he was instead imprisoned at Ürümqi — an internally garbled passage tied to events of 1944. The article states (citing Tursun 2014) that he was a Jadidist; no text in it names a legal school or Sufi order for him, and its infobox has no religion field."
