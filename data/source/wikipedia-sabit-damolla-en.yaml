  en: "English Wikipedia article on Sabit Damolla; used for entity facts only. It recounts the independence leader who became the first and only prime minister of the First East Turkestan Republic (November 1933 to April 1934), his birth in June 1883 at Atush, and his reported execution by hanging in July 1934 at Aksu."
