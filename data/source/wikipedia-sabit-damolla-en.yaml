summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ثابت داملا؛ تُستخدم لوقائع الكيان فقط. تروي زعيم الاستقلال الذي صار أول رئيس وزراء لجمهورية تركستان الشرقية الأولى ووحيدها ⁦(نوفمبر 1933 – أبريل 1934)⁩، مولده في يونيو 1883 في أتوش، وإعدامه شنقًا بحسب الراجح في يوليو 1934 في أكسو."
  en: "English Wikipedia article on Sabit Damolla; used for entity facts only. It recounts the independence leader who became the first and only prime minister of the First East Turkestan Republic (November 1933 to April 1934), his birth in June 1883 at Atush, and his reported execution by hanging in July 1934 at Aksu."
  es: "Artículo de la Wikipedia en inglés sobre Sabit Damolla; utilizado únicamente para obtener información sobre la persona. Relata la vida del líder independentista que se convirtió en el primer y único primer ministro de la Primera República del Turkestán Oriental (de noviembre de 1933 a abril de 1934), su nacimiento en junio de 1883 en Atush y su presunta ejecución en la horca en julio de 1934 en Aksu."
  fr: "Article de Wikipédia en anglais sur Sabit Damolla; utilisé uniquement à des fins d'information sur l'entité. Il relate le parcours du leader indépendantiste devenu le premier et unique Premier ministre de la Première République du Turkestan oriental (novembre 1933 à avril 1934), sa naissance en juin 1883 à Atush et son exécution par pendaison, rapportée, en juillet 1934 à Aksu."
  ur: "Sabit Damolla پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں آزادی کے رہنما کا ذکر ہے جو پہلے مشرقی ترکستان جمہوریہ کے پہلے اور واحد وزیر اعظم بنے ⁦(نومبر 1933 سے اپریل 1934)⁩، ان کی پیدائش جون 1883 میں آتش میں ہوئی، اور جولائی 1934 میں اکسو میں پھانسی دے کر ان کی موت کی اطلاع دی گئی ہے۔"
  tr: "Thabit Damla hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bağımsızlık liderini, Birinci Doğu Türkistan Cumhuriyeti'nin (Kasım 1933 – Nisan 1934) ilk ve tek başbakanı olan, Haziran 1883'te Atush'ta doğan ve muhtemelen Temmuz 1934'te Aksu'da asılarak idam edilen kişiyi anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Thabit Damla; digunakan hanya untuk fakta entitas. Artikel ini menceritakan pemimpin kemerdekaan yang menjadi Perdana Menteri pertama dan satu-satunya Republik Turkestan Timur Pertama (November 1933 – April 1934), lahir pada Juni 1883 di Atush, dan kemungkinan besar dieksekusi dengan cara digantung pada Juli 1934 di Aksu."
