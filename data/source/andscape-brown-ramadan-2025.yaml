  fr: "Le rapport Andscape du 26 mars 2025, rédigé par Marc J. Spears et basé sur des entretiens avec Brown et son entraîneur, mentionne Brown parmi les musulmans pratiquants, relate son jeûne du Ramadan (sixième année consécutive, selon son entraîneur), son pèlerinage à La Mecque et à Médine en juillet 2024, et cite Brown qualifiant le jeûne de « partie intégrante de [sa] foi et de [ses] convictions ». Aucune école ni tradition n'est citée."
  ur: "مارک جے سپیئرز کی 26 مارچ 2025 کی اینڈسکیپ رپورٹ، براؤن اور اس کے کوچ کے انٹرویوز پر مبنی: اس میں براؤن کو مشق کرنے والے مسلمانوں میں شمار کیا جاتا ہے، اس کے رمضان کے روزے ⁦(اس کا چھٹا سال، اس کے کوچ کے مطابق)⁩، اس کا جولائی 2024 کا مکہ اور مدینہ کا حج ریکارڈ کیا گیا ہے، اور براؤن نے 'میرے ایمان کے روزے اور ایمان کا حصہ' کا حوالہ دیا ہے۔ اس میں کسی اسکول یا روایت کا نام نہیں ہے۔"
  tr: "Underscape raporu (26 Mart 2025) Mark Spears tarafından: Gillen Brown, 2024'te Ramazan ve Hac aylarında oruç tuttuğunu belirten bir Müslümandır, ancak bir mezhep belirtmemiştir."
