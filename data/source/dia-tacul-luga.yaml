reliability_note: "Read in the museum's session on 20 November 2026. It gives the full title as Taj al-lugha wa-sihah al-arabiyya, usually called al-Sihah; describes the rhyme arrangement (28 chapters by last radical, each with 16 to 28 sections by first radical), the writing out of vowels in words and the grades of soundness; lists the printings (Tabriz 1270, Bulaq 1282 and 1292, Cairo 1301) and the critical editions of Ahmad Abd al-Ghafur Attar and Shihab al-Din Abu Amr; and names Ibn Barri's glosses and al-Tadili's al-Wishah among the works around it. Used for entity facts only."
