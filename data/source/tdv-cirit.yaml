summary:
  ar: "مدخل «جيريت» في موسوعة TDV الإسلامية: لعبة الجريد بالرماح غير المسنّنة على ظهور الخيل، أصلها الوسط-آسيوي، قواعدها وتسجيلها، ورعاية السلاطين العثمانيين لها وتدريب الجندية ⁦(جوندي لك)⁩ في القصر، ولعبها في الأعراس الملكية، واضمحلالها بعد إلغاء الإنكشارية."
  en: "The TDV İslâm Ansiklopedisi entry on cirit: the mounted war-game of blunt javelins, its Central Asian origins, rules and scoring (a hit on a rider scores, on a horse loses points), the Ottoman sultans' patronage and the palace cündilik lessons, the games at the 1675 Edirne circumcision wedding and the Tulip Era, and its decline after the janissary corps was abolished."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre cirit: el juego de guerra a caballo con jabalinas sin filo, sus orígenes en Asia Central, reglas y puntuación (un impacto en el jinete suma puntos, un impacto en el caballo resta puntos), el patrocinio de los sultanes otomanos y las lecciones de cündilik en el palacio, los juegos en la boda de circuncisión de Edirne de 1675 y la Era de los Tulipanes, y su declive después de que se aboliera el cuerpo de jenízaros."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le cirit: le jeu de guerre monté avec des javelots émoussés, ses origines d'Asie centrale, ses règles et son système de points (un coup porté à un cavalier rapporte des points, un coup porté à un cheval en fait perdre), le patronage des sultans ottomans et les leçons de cündilik au palais, les jeux lors du mariage de circoncision d'Edirne en 1675 et l'ère des tulipes, et son déclin après l'abolition du corps des janissaires."
  ur: "TDV İslâm Ansiklopedisi entry on cirit: کند برچھیوں کا نصب جنگی کھیل، اس کی وسطی ایشیائی اصلیت، اصول اور اسکورنگ ⁦(سوار کے اسکور پر ایک ہٹ، گھوڑے پر پوائنٹس کھو دیتا ہے)⁩، عثمانی سلطانوں کی سرپرستی اور محلات، شادی کے کھیلوں میں سرکوں کا کم حصہ۔ اور ٹیولپ دور، اور جینسری کور کے خاتمے کے بعد اس کا زوال۔"
