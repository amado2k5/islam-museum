summary:
  ar: "مقالة ويكيبيديا العربية عن إسلام البحيري؛ تُستخدم لوقائع الكيان فقط. تنبّه المقالة نفسها إلى خلاف داخلي في تاريخ ميلاده: نصّها يقول 5 أبريل 1974 وصندوق معلوماتها يقول 5 مايو 1975."
  en: "Arabic Wikipedia article on Islam Behery; used for entity facts only. The article itself carries an internal inconsistency on his birth date: its text gives 5 April 1974 while its infobox gives 5 May 1975."
  es: "Artículo en árabe de la Wikipedia sobre Islam Behery; se utiliza únicamente para obtener información sobre la persona. El artículo presenta una inconsistencia interna en cuanto a su fecha de nacimiento: el texto indica el 5 de abril de 1974, mientras que el recuadro informativo indica el 5 de mayo de 1975."
  fr: "Article de Wikipédia en arabe sur Islam Behery; utilisé uniquement pour les informations sur l’entité. L’article lui-même présente une incohérence interne concernant sa date de naissance: le texte indique le 5 avril 1974 tandis que l’infobox mentionne le 5 mai 1975."
  ur: "اسلام بیہری پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ مضمون میں خود ان کی تاریخ پیدائش میں اندرونی تضاد ہے: اس کا متن 5 اپریل 1974 دیتا ہے جبکہ اس کا معلوماتی خانہ 5 مئی 1975 دیتا ہے۔"
  tr: "İslam Al-Buhairi hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Aynı makale, doğum tarihiyle ilgili iç bir anlaşmazlığa işaret ediyor: metinde 5 Nisan 1974, bilgi kutusunda ise 5 Mayıs 1975 yazıyor."
  id: "Artikel Wikipedia berbahasa Arab tentang Islam Al-Buhairi hanya digunakan untuk fakta entitas tersebut. Artikel yang sama menunjuk pada perselisihan internal mengenai tanggal lahirnya: teksnya tertulis 5 April 1974, dan infobox tertulis 5 Mei 1975."
