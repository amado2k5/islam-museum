reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The longest article on him. It gives his birth in 1572 at Hasankale and his death on 27 January 1635 at Istanbul, his education and posts, and quotes both the Şeyhülislam Yahya exchange and the Tahir Efendi quatrain, glossing the quatrain's first sense as Nef'i being a member of the Maliki madhhab — the second of the two independent prose texts behind the person record's faith settlement. It writes his first pen name Zarrî where the TDV entry gives Darrî. Checked 1 November 2026."
