reliability_note: "His own channel: a primary source for his identity, his self-presentation and his current activity, not independent corroboration of biography. Opened and read on 5 November 2026: the description reads 'Welcome to the Official Verified YouTube channel of Abu Taw Haa Muhammad Adnan. Our mission here is to share the true teachings of Islam and Shariah', and its recent uploads were eight and nine days old. The subscriber count is taken from vidIQ's dated reading, not from this page. A separate channel named 'Abu Tawha Muhammad Adnan Lectures' (about 290 thousand subscribers per Mixerno, noted in the wave-192 harvest) could not be verified as his and is recorded in his entry as unverified, never as his channel. His platform channel Taw Haa Tv is a separate channel, listed as his website in the English Wikipedia infobox."
