summary:
  ar: "القناة الشخصية الموثّقة لأبي طه محمد عدنان على يوتيوب (@abutawhaamuhammadadnan)؛ يصفها بأنها قناته الرسمية لنشر تعاليم الإسلام والشريعة، وكانت نشطة بمقاطع جديدة قبل أيام من قراءتها في 5 نوفمبر 2026."
  en: "Abu Taw Haa Muhammad Adnan's verified personal YouTube channel (@abutawhaamuhammadadnan); its description calls it his official channel for sharing the teachings of Islam and Shariah, and it was active with new uploads days before it was read on 5 November 2026."
  es: "El canal personal verificado de YouTube de Abu Taw Haa Muhammad Adnan (@abutawhaamuhammadadnan); su descripción lo identifica como su canal oficial para compartir las enseñanzas del Islam y la Sharia, y estuvo activo con nuevas subidas días antes de que se leyera el 5 de noviembre de 2026."
  fr: "La chaîne YouTube personnelle vérifiée d'Abu Taw Haa Muhammad Adnan (@abutawhaamuhammadadnan); sa description la décrit comme sa chaîne officielle pour partager les enseignements de l'Islam et de la Charia, et elle était active avec de nouvelles mises en ligne les jours précédant sa lecture le 5 novembre 2026."
  ur: "ابو طاؤ ہا محمد عدنان کا تصدیق شدہ ذاتی یوٹیوب چینل (@abutawhaamuhammadadnan)؛ اس کی تفصیل اسے اسلام اور شریعت کی تعلیمات کو شیئر کرنے کے لیے اپنا آفیشل چینل کہتی ہے، اور یہ 5 نومبر 2026 کو پڑھنے سے کچھ دن پہلے نئے اپ لوڈز کے ساتھ فعال تھا۔"
