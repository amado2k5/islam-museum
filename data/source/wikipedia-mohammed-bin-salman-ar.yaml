  fr: "Article de Wikipédia en arabe sur Mohammed ben Salmane; utilisé uniquement pour les informations sur l'entité. Cet article détaillé retrace la vie, les fonctions et les réformes du prince héritier. L'infobox « Religion » mentionne l'islam de manière générique, sans préciser de branche; ses catégories le classent dans la catégorie « Musulmans sunnites saoudiens »."
