  ar: "مقالة ويكيبيديا العربية عن محمد بن سلمان آل سعود؛ تُستخدم لوقائع الكيان فقط. مقالة مطوّلة عن حياة ولي العهد ومناصبه وإصلاحاته. ويذكر حقل الدين في صندوق معلوماتها «الإسلام» إجمالًا دون فرع؛ وتصنيفاتها تدرجه في «مسلمون سنة سعوديون»."
