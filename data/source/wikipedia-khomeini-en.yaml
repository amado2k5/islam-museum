summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن روح الله الخميني؛ تُستخدم لوقائع الكيان فقط. تقدّمه سياسيًا إيرانيًا ورجل دين شيعيًا قاد الثورة الإيرانية وأسّس الجمهورية الإسلامية وكان مرشدها الأعلى من 1979 حتى وفاته سنة 1989، وتذكر صراحة أنه صار رجل دين رفيعًا في التشيع الاثني عشري ومرجع تقليد، وتعطي تاريخ ميلاده وفق شهادة الميلاد 17 أيار 1900 في خمين مع الإشارة إلى رواية أخيه 24 أيلول 1902، ووفاته في 3 حزيران 1989 في طهران."
  en: "English Wikipedia article on Ruhollah Khomeini; used for entity facts only. It presents him as an Iranian politician and Shia cleric who led the Iranian Revolution, founded the Islamic Republic and was its supreme leader from 1979 until his death in 1989; its text states that he became a high-ranking cleric in Twelver Shi'ism and a marja'. It gives his birth, per his birth certificate, as 17 May 1900 at Khomeyn, noting his brother's alternative date of 24 September 1902, and his death on 3 June 1989 in Tehran."
