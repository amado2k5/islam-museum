summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن روح الله الخميني؛ تُستخدم لوقائع الكيان فقط. تقدّمه سياسيًا إيرانيًا ورجل دين شيعيًا قاد الثورة الإيرانية وأسّس الجمهورية الإسلامية وكان مرشدها الأعلى من 1979 حتى وفاته سنة 1989، وتذكر صراحة أنه صار رجل دين رفيعًا في التشيع الاثني عشري ومرجع تقليد، وتعطي تاريخ ميلاده وفق شهادة الميلاد 17 أيار 1900 في خمين مع الإشارة إلى رواية أخيه 24 أيلول 1902، ووفاته في 3 حزيران 1989 في طهران."
  en: "English Wikipedia article on Ruhollah Khomeini; used for entity facts only. It presents him as an Iranian politician and Shia cleric who led the Iranian Revolution, founded the Islamic Republic and was its supreme leader from 1979 until his death in 1989; its text states that he became a high-ranking cleric in Twelver Shi'ism and a marja'. It gives his birth, per his birth certificate, as 17 May 1900 at Khomeyn, noting his brother's alternative date of 24 September 1902, and his death on 3 June 1989 in Tehran."
  es: "Artículo de la Wikipedia en inglés sobre Ruhollah Khomeini; utilizado únicamente para datos sobre la persona. Lo presenta como un político iraní y clérigo chiíta que lideró la Revolución iraní, fundó la República Islámica y fue su líder supremo desde 1979 hasta su muerte en 1989; su texto afirma que se convirtió en un clérigo de alto rango en el chiismo duodecimano y en un marja'. Indica que nació, según su certificado de nacimiento, el 17 de mayo de 1900 en Khomeyn, mencionando la fecha alternativa de su hermano, el 24 de septiembre de 1902, y que murió el 3 de junio de 1989 en Teherán."
  fr: "Article de Wikipédia en anglais sur Rouhollah Khomeini; utilisé uniquement pour les informations factuelles. Il le présente comme un homme politique iranien et un religieux chiite qui a mené la révolution iranienne, fondé la République islamique et en a été le guide suprême de 1979 à sa mort en 1989. Le texte indique qu'il est devenu un haut dignitaire du chiisme duodécimain et un marja'. Il mentionne sa naissance, d'après son acte de naissance, le 17 mai 1900 à Khomeyn, ainsi que la date alternative donnée par son frère, le 24 septembre 1902, et son décès le 3 juin 1989 à Téhéran."
  ur: "روح اللہ خمینی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انہیں ایک ایرانی سیاست دان اور شیعہ عالم کے طور پر پیش کرتا ہے جس نے ایرانی انقلاب کی قیادت کی، اسلامی جمہوریہ کی بنیاد رکھی اور 1979 سے لے کر 1989 میں اپنی موت تک اس کے سپریم لیڈر رہے۔ اس کے متن میں کہا گیا ہے کہ وہ بارہویں شیعہ مذہب اور مرجع میں ایک اعلیٰ درجے کا عالم بن گیا۔ یہ اس کی پیدائش کے سرٹیفکیٹ کے مطابق، 17 مئی 1900 کو خمین میں، اس کے بھائی کی متبادل تاریخ 24 ستمبر 1902، اور تہران میں اس کی موت 3 جون 1989 کو بتاتی ہے۔"
