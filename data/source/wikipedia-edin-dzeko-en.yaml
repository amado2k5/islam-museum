summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إدين دجيكو؛ تُستخدم لوقائع الكيان فقط. تروي طفولته تحت حصار سراييفو ومسيرته مع فولفسبورغ ومانشستر سيتي وروما وإنتر ميلان وشالكه وأرقامه القياسية مع منتخب البوسنة، وتذكر في حياته الشخصية أنه مسلم دون تسمية أي مذهب."
  en: "English Wikipedia article on Edin Džeko; used for entity facts only. It recounts his childhood under the Siege of Sarajevo, his career at Wolfsburg, Manchester City, Roma, Inter Milan and Schalke 04 and his Bosnia and Herzegovina records, and states in its personal-life section that he is a Muslim, without naming any school."
  es: "Artículo de la Wikipedia en inglés sobre Edin Džeko; utilizado únicamente para obtener información sobre la persona. Relata su infancia durante el asedio de Sarajevo, su trayectoria en el Wolfsburg, el Manchester City, la Roma, el Inter de Milán y el Schalke 04, así como sus récords en Bosnia y Herzegovina. En la sección sobre su vida personal, afirma que es musulmán, sin mencionar ninguna escuela."
  fr: "Article Wikipédia en anglais sur Edin Džeko; utilisé uniquement pour les informations le concernant. Il relate son enfance pendant le siège de Sarajevo, sa carrière à Wolfsburg, Manchester City, la Roma, l’Inter Milan et Schalke 04, ainsi que ses performances en Bosnie-Herzégovine. La section consacrée à sa vie personnelle indique qu’il est musulman, sans toutefois mentionner d’établissement scolaire."
  ur: "Edin Džeko پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں سراجیوو کے محاصرے میں اس کے بچپن، وولفسبرگ، مانچسٹر سٹی، روما، انٹر میلان اور شالکے 04 میں اس کے کیریئر اور اس کے بوسنیا اور ہرزیگووینا کے ریکارڈوں کو بیان کیا گیا ہے، اور اس کے ذاتی زندگی کے حصے میں کہا گیا ہے کہ وہ ایک مسلمان ہے، بغیر کسی اسکول کا نام لیے۔"
  tr: "Edin Džeko hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Saraybosna kuşatması altındaki çocukluğunu, Wolfsburg, Manchester City, Roma, Inter Milan, Schalke ile kariyerini ve Bosna milli takımındaki rekor kayıtlarını anlatır ve kişisel hayatında herhangi bir mezhep isimini vermeden Müslüman olduğunu belirtir."
  id: "Artikel Wikipedia bahasa Inggris tentang Edin Džeko; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya di bawah pengepungan Sarajevo, kariernya bersama Wolfsburg, Manchester City, Roma, Inter Milan, Schalke, dan rekor rekor dengan tim nasional Bosnia, serta menyebutkan dalam kehidupan pribadinya bahwa dia seorang Muslim tanpa menyebutkan sekte apapun."
