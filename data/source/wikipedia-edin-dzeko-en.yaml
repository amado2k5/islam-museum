reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, which is dated the same day. It gives Džeko as born 17 March 1986 in Sarajevo to Midhat and Belma; Bundesliga champion and then top scorer with Wolfsburg; two Premier League titles with Manchester City, including his 92nd-minute equaliser against Queens Park Rangers on the final day of 2011–12; Serie A top scorer with Roma in 2016–17; later Inter Milan, Fenerbahçe, Fiorentina and Schalke 04; and Bosnia and Herzegovina's all-time top scorer and most-capped player with 152 caps and 73 goals before his 2026 international retirement. Its personal-life section states: 'He is a Muslim.' No school is named anywhere in the article."
