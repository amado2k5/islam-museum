reliability_note: "Read in full (text and wikitext) on 1 November 2026. A Good Article resting on the standard scholarship: David Pingree's Encyclopaedia Iranica entry, Josep Casulleras in the Biographical Encyclopedia of Astronomers, J. al-Dabbagh in the Dictionary of Scientific Biography, Atilla Bir's study of the Kitab al-Hiyal (1990), Dimitri Gutas (1998) and the MacTutor biography. Its chronology is deliberately spare: Muhammad is dated 'before 803 – February 873' in the lead while its Deaths section, citing Bir, gives the death month as January 873 and states expressly that of the three brothers only Muhammad's death year is known; Ahmad and al-Hasan are dated only 'd. 9th century'. The brothers are listed in what is assumed to be their order of seniority — Muhammad, Ahmad, al-Hasan. The English pages bearing the younger brothers' names and Muhammad's kunya title are redirects to this article, a fact recorded in the Wikidata source files. No sentence in the article names a religion or legal school for any brother."
