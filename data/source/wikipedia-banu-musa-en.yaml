  ar: "مقالة ويكيبيديا الإنجليزية عن بني موسى، الإخوة الثلاثة محمد وأحمد والحسن بني موسى بن شاكر، علماء بغداد في القرن التاسع؛ تؤرخ لمحمد «قبل 803 – شباط 873» ولأخويه بالقرن التاسع فقط، وتقرر أن سنة وفاة محمد وحدها هي المعروفة من بين الإخوة."
  en: "English Wikipedia article on the Banu Musa — Muhammad, Ahmad and al-Hasan, the three sons of Musa ibn Shakir, scholars of 9th-century Baghdad; it dates Muhammad 'before 803 – February 873', the two younger brothers only to the 9th century, and states that of the three brothers only Muhammad's death year is known."
