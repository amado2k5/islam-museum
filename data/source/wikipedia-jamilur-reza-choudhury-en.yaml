summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جميلور رضا تشودري؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 15 نوفمبر 1943 في سيلهيت (بينما يذكر متنها التمهيدي سنة 1942)، وتعليمه في جامعة بنغلاديش للهندسة والتكنولوجيا وجامعة ساوثهامبتون، وعمله أستاذًا في بوئت وأول نائب رئيس لجامعة براك ونائب رئيس جامعة آسيا والمحيط الهادئ، ومستشارًا لحكومة تصريف الأعمال سنة 1996، ووفاته في دكا في 28 أبريل 2020. لا تذكر المقالة أي دين له."
  en: "English Wikipedia article on Jamilur Reza Choudhury; used for entity facts only. It gives his birth on 15 November 1943 at Sylhet in its infobox and early-life text (its lead instead prints 15 November 1942), his education at BUET and the University of Southampton, his professorship at BUET, his terms as first vice-chancellor of BRAC University and vice-chancellor of the University of Asia Pacific, his service as an adviser to the 1996 caretaker government, and his death at Dhaka on 28 April 2020. The article names no religion for him."
