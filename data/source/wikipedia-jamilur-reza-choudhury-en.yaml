summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جميلور رضا تشودري؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 15 نوفمبر 1943 في سيلهيت ⁦(بينما يذكر متنها التمهيدي سنة 1942)⁩، وتعليمه في جامعة بنغلاديش للهندسة والتكنولوجيا وجامعة ساوثهامبتون، وعمله أستاذًا في بوئت وأول نائب رئيس لجامعة براك ونائب رئيس جامعة آسيا والمحيط الهادئ، ومستشارًا لحكومة تصريف الأعمال سنة 1996، ووفاته في دكا في 28 أبريل 2020. لا تذكر المقالة أي دين له."
  en: "English Wikipedia article on Jamilur Reza Choudhury; used for entity facts only. It gives his birth on 15 November 1943 at Sylhet in its infobox and early-life text (its lead instead prints 15 November 1942), his education at BUET and the University of Southampton, his professorship at BUET, his terms as first vice-chancellor of BRAC University and vice-chancellor of the University of Asia Pacific, his service as an adviser to the 1996 caretaker government, and his death at Dhaka on 28 April 2020. The article names no religion for him."
  es: "Artículo de la Wikipedia en inglés sobre Jamilur Reza Choudhury; utilizado únicamente para datos sobre la persona. En su ficha informativa y en el texto sobre su juventud, indica que nació el 15 de noviembre de 1943 en Sylhet (en lugar del 15 de noviembre de 1942), su formación académica en BUET y la Universidad de Southampton, su cátedra en BUET, sus mandatos como primer vicerrector de la Universidad BRAC y vicerrector de la Universidad de Asia Pacífico, su labor como asesor del gobierno interino de 1996 y su fallecimiento en Dhaka el 28 de abril de 2020. El artículo no menciona su religión."
  fr: "L'article de Wikipédia en anglais consacré à Jamilur Reza Choudhury, utilisé uniquement pour les informations le concernant, indique sa naissance le 15 novembre 1943 à Sylhet dans son infobox et sa biographie (l'introduction mentionne le 15 novembre 1942), ses études à l'Université de génie et de technologie du Bangladesh (BUET) et à l'Université de Southampton, son poste de professeur à la BUET, ses mandats de premier vice-chancelier de l'Université BRAC et de vice-chancelier de l'Université Asie-Pacifique, son rôle de conseiller auprès du gouvernement intérimaire de 1996 et son décès à Dhaka le 28 avril 2020. L'article ne mentionne pas sa religion."
  ur: "جمیل الرضا چوہدری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 15 نومبر 1943 کو سلہٹ میں ان کی پیدائش اپنے معلوماتی خانے اور ابتدائی زندگی کے متن میں ⁦(اس کا لیڈ 15 نومبر 1942 کو پرنٹ کرتا ہے)⁩، BUET اور یونیورسٹی آف ساؤتھمپٹن میں ان کی تعلیم، BUET میں ان کی پروفیسر شپ، BRAC یونیورسٹی کے پہلے وائس چانسلر کے طور پر ان کی شرائط اور ایشیائی یونیورسٹی کے وائس چانسلر کے طور پر ان کی خدمات، 1969 کے مشیر کے طور پر۔ نگراں حکومت، اور ان کی موت 28 اپریل 2020 کو ڈھاکہ میں ہوئی۔ مضمون میں ان کے لیے کسی مذہب کا نام نہیں لیا گیا ہے۔"
