  ar: "مقالة ويكيبيديا الإنجليزية عن خليل السكاكيني؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في القدس، وتأسيسه المدرسة الدستورية، ودوره في النهضة الأرثوذكسية وحرمانه كنسيًا، ونفيه إلى دمشق، ولجوءه إلى القاهرة سنة 1948 ووفاته فيها سنة 1953."
  en: "English Wikipedia article on Khalil Sakakini; used for entity facts only. It recounts his Jerusalem upbringing, his founding of the Dusturiyyah school, his Orthodox Renaissance campaign and excommunication, his Damascus imprisonment, and his 1948 flight to Cairo, where he died in 1953."
