reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his birth on 23 January 1878 in Jerusalem and his death on 13 August 1953 in Cairo, drawing mainly on Tom Segev's biography. On religion it says he was born into a Palestinian Christian Orthodox family — family framing — but also records his own acts as a church member: he led a movement to reform the Greek Orthodox Church of Jerusalem, published the 1913 pamphlet 'The Orthodox Renaissance in Palestine', and was excommunicated by that church; his wife was buried in the Greek Orthodox cemetery on Mount Zion. Its categories file him under 'Greek Orthodox Christians from Palestine'."
