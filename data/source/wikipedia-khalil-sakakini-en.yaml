summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خليل السكاكيني؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في القدس، وتأسيسه المدرسة الدستورية، ودوره في النهضة الأرثوذكسية وحرمانه كنسيًا، ونفيه إلى دمشق، ولجوءه إلى القاهرة سنة 1948 ووفاته فيها سنة 1953."
  en: "English Wikipedia article on Khalil Sakakini; used for entity facts only. It recounts his Jerusalem upbringing, his founding of the Dusturiyyah school, his Orthodox Renaissance campaign and excommunication, his Damascus imprisonment, and his 1948 flight to Cairo, where he died in 1953."
  es: "Artículo de la Wikipedia en inglés sobre Khalil Sakakini; utilizado únicamente para obtener información sobre la persona. Relata su infancia en Jerusalén, la fundación de la escuela Dusturiyyah, su campaña por el Renacimiento ortodoxo y su excomunión, su encarcelamiento en Damasco y su huida a El Cairo en 1948, donde falleció en 1953."
  fr: "Article de Wikipédia en anglais sur Khalil Sakakini; utilisé uniquement pour des informations sur l’entité. Il relate son enfance à Jérusalem, la fondation de l’école Dusturiyyah, sa campagne pour la renaissance orthodoxe et son excommunication, son emprisonnement à Damas et sa fuite au Caire en 1948, où il mourut en 1953."
  ur: "خلیل ساکاکینی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی یروشلم کی پرورش، اس کے دستوریہ اسکول کی بنیاد، اس کی آرتھوڈوکس نشاۃ ثانیہ کی مہم اور اخراج، اس کی دمشق کی قید، اور اس کی 1948 کی قاہرہ کی پرواز کا ذکر ہے، جہاں اس کی موت 1953 میں ہوئی۔"
  tr: "Khalil Al-Sakakini hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kudüs'teki yetiştirilme tarzını, Anayasa Okulu'nun kuruluşunu, Ortodoks rönesansındaki rolünü, Şam'a sürgününü, 1948'de Kahire'ye sürgününü ve 1953'teki orada ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Khalil Al-Sakakini; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Yerusalem, pendirian Sekolah Konstitusional, perannya dalam renaisans Ortodoks, pengasingannya ke Damaskus, pengasingannya ke Kairo pada tahun 1948, dan kematiannya di sana pada tahun 1953."
