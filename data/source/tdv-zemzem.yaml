summary:
  ar: "مدخل «زمزم» في موسوعة TDV الإسلامية: البئر ونشأتها واسمها وإعادة عبد المطلب كشفها، وعمارتها وتحسينها من الأمويين والعباسيين إلى العثمانيين، ورجال خدمتها: موظف السقاية، والسقاؤون الموزّعون على أقاليم الدولة العثمانية ورئيسهم من آل زبير، والأربعون مستقىً الذين رآهم أوليا جلبي بنقع الحناء يتناوبون على البكور، والزمزميون الذين يوصلون الماء إلى الحجاج في مكة ومنى وعرفات."
  en: "The TDV İslâm Ansiklopedisi entry on Zemzem: the well, its origin and names, Abd al-Muttalib's rediscovery of it, its building history from the Umayyads and Abbasids to the Ottomans, and its service staff — the sikâye officer, the sakas assigned to the pilgrims of every Ottoman province under a headman of the Al-i Zubayr, the forty henna-stained water-drawers Evliya saw working the pulleys in shifts of four, and the zemzemîs who distribute the water to pilgrims at Mecca, Mina and Arafat."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre Zemzem: el pozo, su origen y nombres, su redescubrimiento por Abd al-Muttalib, su historia constructiva desde los omeyas y abasíes hasta los otomanos, y su personal de servicio: el oficial sikâye, los sakas asignados a los peregrinos de cada provincia otomana bajo un jefe del Al-i Zubayr, los cuarenta aguadores con manchas de henna que Evliya vio trabajando con las poleas en turnos de cuatro, y los zemzemîs que distribuyen el agua a los peregrinos en La Meca, Mina y Arafat."
  fr: "L'article de TDV İslâm Ansiklopedisi sur Zemzem: le puits, son origine et ses noms, sa redécouverte par Abd al-Muttalib, son histoire de construction des Omeyyades et des Abbassides aux Ottomans, et son personnel de service — l'officier sikâye, les sakas affectés aux pèlerins de chaque province ottomane sous un chef de l'Al-i Zubayr, les quarante puisatiers au henné qu'Evliya a vus actionner les poulies par équipes de quatre, et les zemzemîs qui distribuent l'eau aux pèlerins à La Mecque, Mina et Arafat."
