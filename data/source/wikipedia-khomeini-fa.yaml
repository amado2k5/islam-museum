summary:
  ar: "مقالة ويكيبيديا الفارسية عن روح الله الخميني؛ تُستخدم لوقائع الكيان فقط. تقدّمه مؤسس الجمهورية الإسلامية ومرشدها الأول، وتصفه في نصّها بأنه من حيث الأيديولوجيا إسلامي شيعي راديكالي وأن نظريته في ولاية الفقيه تقوم على دور علماء الشيعة، وتعطي ميلاده في خمين في 24 أيلول 1902 نقلاً عن دائرة المعارف الإسلامية الكبرى، خلافًا لتاريخ شهادة الميلاد الوارد في المقالة الإنجليزية."
  en: "Persian Wikipedia article on Ruhollah Khomeini; used for entity facts only. It presents him as the founder of the Islamic Republic and its first supreme leader, describes him in its text as ideologically a radical Shia Islamist whose doctrine of clerical rule rests on the role of Shia scholars, and gives his birth at Khomeyn as 24 September 1902, citing the Great Islamic Encyclopaedia — the date his brother gave, against the birth-certificate date carried by the English article."
  es: "Artículo de Wikipedia en persa sobre Ruhollah Khomeini; utilizado únicamente para datos sobre la persona. Lo presenta como el fundador de la República Islámica y su primer líder supremo, lo describe en su texto como un islamista chií radical cuya doctrina de gobierno clerical se basa en el papel de los eruditos chiíes, y sitúa su nacimiento en Khomeyn el 24 de septiembre de 1902, citando la Gran Enciclopedia Islámica, fecha que proporcionó su hermano, en contraposición a la fecha del certificado de nacimiento que figura en el artículo en inglés."
  fr: "Article persan de Wikipédia sur Rouhollah Khomeiny; utilisé uniquement pour les informations factuelles. Il le présente comme le fondateur de la République islamique et son premier guide suprême, le décrit comme un islamiste chiite radical dont la doctrine du pouvoir clérical repose sur le rôle des érudits chiites, et indique sa naissance à Khomeiny le 24 septembre 1902, citant la Grande Encyclopédie islamique – date donnée par son frère, contrairement à celle figurant sur l’acte de naissance dans l’article anglais."
  ur: "روح اللہ خمینی پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے اسلامی جمہوریہ کے بانی اور اس کے پہلے سپریم لیڈر کے طور پر پیش کرتا ہے، اسے اپنے متن میں نظریاتی طور پر ایک بنیاد پرست شیعہ اسلامسٹ کے طور پر بیان کرتا ہے جس کے علما کی حکمرانی کا نظریہ شیعہ علماء کے کردار پر منحصر ہے، اور عظیم اسلامی انسائیکلوپیڈیا کا حوالہ دیتے ہوئے، خمین میں ان کی پیدائش 24 ستمبر 1902 کو ہوئی تھی، جس میں اس کے بھائی نے تاریخ پیدائش کی تاریخ لکھی تھی۔"
  tr: "Ruhullah Humeyni hakkında Farsça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Bu makale, İslam Cumhuriyeti'nin kurucusu ve ilk rehberi tarafından sunulmuş, metinde onu ideolojik olarak radikal bir Şii İslamcı olarak tanımlamaktadır ve Hukukçuların Vesayeti teorisinin Şii alimlerin rolüne dayandığı belirtilmiştir; Büyük İslami Ansiklopedi'ye göre, İngilizce makalede belirtilen doğum belgesi tarihinin aksine 24 Eylül 1902'de Humeyn'de doğmuştur."
  id: "Artikel Wikipedia Persia tentang Ruhollah Khomeini hanya digunakan untuk fakta entitas tersebut. Artikel ini disajikan oleh pendiri dan pemandu pertama Republik Islam, yang menggambarkannya dalam teks sebagai seorang Islamis Syiah radikal secara ideologis, dan bahwa teori Guardianship of the Jurist didasarkan pada peran ulama Syiah, dan kelahirannya di Khomein pada 24 September 1902, menurut Ensiklopedia Islam Agung, bertentangan dengan tanggal akta kelahiran yang disebutkan dalam artikel bahasa Inggris."
