summary:
  ar: "مقالة ويكيبيديا الفارسية عن روح الله الخميني؛ تُستخدم لوقائع الكيان فقط. تقدّمه مؤسس الجمهورية الإسلامية ومرشدها الأول، وتصفه في نصّها بأنه من حيث الأيديولوجيا إسلامي شيعي راديكالي وأن نظريته في ولاية الفقيه تقوم على دور علماء الشيعة، وتعطي ميلاده في خمين في 24 أيلول 1902 نقلاً عن دائرة المعارف الإسلامية الكبرى، خلافًا لتاريخ شهادة الميلاد الوارد في المقالة الإنجليزية."
  en: "Persian Wikipedia article on Ruhollah Khomeini; used for entity facts only. It presents him as the founder of the Islamic Republic and its first supreme leader, describes him in its text as ideologically a radical Shia Islamist whose doctrine of clerical rule rests on the role of Shia scholars, and gives his birth at Khomeyn as 24 September 1902, citing the Great Islamic Encyclopaedia — the date his brother gave, against the birth-certificate date carried by the English article."
