summary:
  ar: "مقالة ويكيبيديا العربية عن الحسن بن محمد الوزان ⁦(ليون الأفريقي)⁩؛ يعطي صندوقها مولده سنة 1488 بغرناطة، ويذكر متنها اختلاف المؤرخين: فبعضهم يجعل مولده 901هـ/1495 وبعضهم 906هـ/1500، وتورد رأي المؤرخ التونسي محمد بن الخوجة أن تحوّل الوزان إلى المسيحية كان صوريًا فقط."
  en: "Arabic Wikipedia article on al-Hasan ibn Muhammad al-Wazzan (Leo Africanus); its infobox gives his birth in 1488 at Granada while its text reports historians placing the birth at 901 AH/1495 or at 906 AH/1500, and it carries the Tunisian historian Muhammad ibn al-Khuja's view that al-Wazzan's conversion to Christianity was only outward."
  es: "Artículo en árabe de la Wikipedia sobre al-Hasan ibn Muhammad al-Wazzan (Leo Africanus); su ficha informativa indica que nació en 1488 en Granada, mientras que el texto recoge que los historiadores sitúan el nacimiento en el año 901 de la Hégira (1495) o en el año 906 de la Hégira (1500), y recoge la opinión del historiador tunecino Muhammad ibn al-Khuja de que la conversión de al-Wazzan al cristianismo fue solo superficial."
  fr: "L'article de Wikipédia en arabe sur al-Hasan ibn Muhammad al-Wazzan (Léo l'Africain); son infobox indique sa naissance en 1488 à Grenade tandis que son texte rapporte que les historiens situent la naissance en 901 AH/1495 ou en 906 AH/1500, et il reprend l'opinion de l'historien tunisien Muhammad ibn al-Khuja selon laquelle la conversion d'al-Wazzan au christianisme n'était qu'extérieure."
  ur: "عربی ویکیپیڈیا مضمون الحسن بن محمد الوازان ⁦(لیو افریقی)⁩ پر؛ اس کے معلوماتی خانے میں اس کی پیدائش 1488 میں غرناطہ میں دی گئی ہے جبکہ اس کے متن میں مورخین کی پیدائش 901 ہجری / 1495 یا 906 ہجری / 1500 میں بتائی گئی ہے، اور اس میں تیونس کے مؤرخ محمد ابن الخوجہ کا خیال ہے کہ الوازان کی عیسائیت میں تبدیلی صرف ظاہری تھی۔"
