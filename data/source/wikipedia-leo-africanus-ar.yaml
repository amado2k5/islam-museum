  ar: "مقالة ويكيبيديا العربية عن الحسن بن محمد الوزان (ليون الأفريقي)؛ يعطي صندوقها مولده سنة 1488 بغرناطة، ويذكر متنها اختلاف المؤرخين: فبعضهم يجعل مولده 901هـ/1495 وبعضهم 906هـ/1500، وتورد رأي المؤرخ التونسي محمد بن الخوجة أن تحوّل الوزان إلى المسيحية كان صوريًا فقط."
  en: "Arabic Wikipedia article on al-Hasan ibn Muhammad al-Wazzan (Leo Africanus); its infobox gives his birth in 1488 at Granada while its text reports historians placing the birth at 901 AH/1495 or at 906 AH/1500, and it carries the Tunisian historian Muhammad ibn al-Khuja's view that al-Wazzan's conversion to Christianity was only outward."
