summary:
  ar: "مدخل مير مشرف حسين في بنغلابيديا، الموسوعة الوطنية لبنغلاديش، بقلم بيمال غوها؛ تُستخدم لوقائع الكيان فقط. يذكر مولده في لاهيري بارا بكوشتيا في 13 نوفمبر 1847 ووفاته سنة 1912 ودفنه في بادامدي، ويفصّل أعماله من «راتنافاتي» (1869) إلى «بيساد سيندو» (1885-1891) وسيرته الذاتية، ولا يذكر له أي انتماء مذهبي."
  en: "Entry 'Hossain, Mir Mosharraf' in Banglapedia, the national encyclopedia of Bangladesh, by Bimal Guha; used for entity facts only. It records his birth at Lahiripara in Kushtia on 13 November 1847, his death in 1912 and his burial at Padamdi, and details his works from Ratnavati (1869) to Bisad Sindhu (1885–1891) and his autobiography. It records no affiliation for him."
title: "Hossain, Mir Mosharraf"
