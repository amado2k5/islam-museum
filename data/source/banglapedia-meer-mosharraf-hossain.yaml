reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia in editorship; the English Wikipedia article in turn cites it. Read in full on 25 October 2026. It styles him novelist, playwright and essayist and a pioneer among nineteenth-century Bengali Muslim writers, spells his birth village Lahiripara (the English article has Lahinipara) and his masterpiece Bisad Sindhu, and gives his death only as 'He died in 1912 and was buried at Padamdi' — against the English article's 19 December 1911; the person record records 19 December 1912 with the variant stated, following Banglapedia and Wikidata on the year and both traditions on the day. It adds his literary guru Kangal Harinath of the Grambarta Prakashika, his editorship of the Azizannehar (1874) and Hitakari (1890) and association with the Bangiya Sahitya Parishad, his satire of contemporary society in Gazi Miyar Bastani, his freedom from communal prejudice, and his essay against indiscriminate cow slaughter on agricultural grounds (which it titles 'Gokul Nirmul Ashabka'), and lists some thirty-five works including the textbooks Mussalmander Bangla Shiksa (1903, 1908), Bibi Khodejar Bibaha (1905), Hazrat Omarer Dharmajiban Labh (1905) and Madinar Gaurab (1906), Amar Jibani (1908–1910) and its sequel on Bibi Kulsum (1910). It names no affiliation or school for him anywhere."
