summary:
  ar: "مقالة ويكيبيديا الأردية عن آصف علي ⁦(بعنوان «عساف علی»)⁩؛ تُستخدم لوقائع الكيان فقط. تروي استقالته من المجلس الخاص سنة 1914 تأييدًا للدولة العثمانية، وانتخابه للمجلس التشريعي المركزي سنة 1935، وسجنه بعد قرار «اتركوا الهند» 1942، وزواجه من أرونا سنة 1928 واصفة إياه بأنه مسلم وإياها بأنها هندوسية."
  en: "Urdu Wikipedia article on Asaf Ali (titled 'Assaf Ali'); used for entity facts only. It recounts his 1914 resignation from the Privy Council in support of the Ottoman state, his 1935 election to the Central Legislative Assembly, his imprisonment after the 1942 Quit India resolution, and his 1928 marriage to Aruna, describing him as a Muslim and her as a Hindu."
  es: "Artículo de Wikipedia en urdu sobre Asaf Ali (titulado «Assaf Ali»); utilizado únicamente para datos sobre la persona. Relata su dimisión del Consejo Privado en 1914 en apoyo del Estado otomano, su elección a la Asamblea Legislativa Central en 1935, su encarcelamiento tras la resolución «Quit India» de 1942 y su matrimonio con Aruna en 1928, describiéndolo a él como musulmán y a ella como hindú."
  fr: "L'article de Wikipédia en ourdou sur Asaf Ali (intitulé « Assaf Ali ») est utilisé uniquement à des fins d'information sur l'entité. Il relate sa démission du Conseil privé en 1914 en soutien à l'État ottoman, son élection à l'Assemblée législative centrale en 1935, son emprisonnement après la résolution « Quit India » de 1942 et son mariage avec Aruna en 1928, le décrivant comme musulman et elle comme hindoue."
  ur: "اردو ویکیپیڈیا کا مضمون آصف علی پر ⁦(عنوان 'آصف علی')⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں عثمانی ریاست کی حمایت میں پریوی کونسل سے ان کے 1914 کے استعفیٰ، سنٹرل لیجسلیٹو اسمبلی کے لیے ان کے 1935 کے انتخاب، 1942 کی ہندوستان چھوڑنے کی قرارداد کے بعد ان کی قید، اور ارونا کے ساتھ ان کی 1928 کی شادی کا ذکر کیا گیا ہے، جس میں انہیں ایک مسلمان اور اسے ہندو قرار دیا گیا ہے۔"
