summary:
  ar: "صفحة معرض «مسلمون أفارقة مستعبدون ومحرَّرون» التابع لمبادرة التاريخ الرقمي للوكنتري ⁦(كلية تشارلستون)⁩: صالح بلالي وُلد نحو 1790 في ماسينا على نهر النيجر ⁦(مالي اليوم)⁩، وأُسر وبِيع عبر ساحل الذهب إلى جزر البهاما ثم إلى جيمس هاملتون كوبر الذي أخذه إلى مزرعة كانونز بوينت في جزيرة سانت سايمنز بجورجيا، حيث ترقّى حتى صار السائق الرئيس، وسُجّل في بعض قيود البيع باسم «توم»."
  en: "Exhibit page of 'Enslaved and Freed African Muslims: Spiritual Wayfarers in the South and Lowcountry' (Lowcountry Digital History Initiative, College of Charleston): Salih Bilali was born around 1790 in Massina on the Niger River (present-day Mali), captured and sold along the Gold Coast to the Bahamas, then sold to James Hamilton Couper, who took him to Cannon's Point plantation on St. Simons Island, Georgia, where he rose to head driver; some sale records note him as 'Tom'. It quotes Couper on him: 'his industry, intelligence, and honesty, soon brought him notice, and he was successively advanced, until he was made head driver.'"
