reliability_note: "Scholarly digital exhibit read in full on 3 November 2026. It is the most careful short account of Salih Bilali read for this record, and it is explicit that the surviving records are the enslavers' and their descendants'. Its birth year (c. 1790) is the latest of the readings in the scholarship and conflicts with the c. 1765 and 1770s readings elsewhere; all readings are preserved in the person record. The exhibit page once misprints his name as 'Sahil Bilali'."
