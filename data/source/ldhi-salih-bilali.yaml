summary:
  ar: "صفحة معرض «مسلمون أفارقة مستعبدون ومحرَّرون» التابع لمبادرة التاريخ الرقمي للوكنتري ⁦(كلية تشارلستون)⁩: صالح بلالي وُلد نحو 1790 في ماسينا على نهر النيجر ⁦(مالي اليوم)⁩، وأُسر وبِيع عبر ساحل الذهب إلى جزر البهاما ثم إلى جيمس هاملتون كوبر الذي أخذه إلى مزرعة كانونز بوينت في جزيرة سانت سايمنز بجورجيا، حيث ترقّى حتى صار السائق الرئيس، وسُجّل في بعض قيود البيع باسم «توم»."
  en: "Exhibit page of 'Enslaved and Freed African Muslims: Spiritual Wayfarers in the South and Lowcountry' (Lowcountry Digital History Initiative, College of Charleston): Salih Bilali was born around 1790 in Massina on the Niger River (present-day Mali), captured and sold along the Gold Coast to the Bahamas, then sold to James Hamilton Couper, who took him to Cannon's Point plantation on St. Simons Island, Georgia, where he rose to head driver; some sale records note him as 'Tom'. It quotes Couper on him: 'his industry, intelligence, and honesty, soon brought him notice, and he was successively advanced, until he was made head driver.'"
  es: "Página de la exposición «Musulmanes africanos esclavizados y liberados: Viajeros espirituales en el sur y la región costera» (Iniciativa de Historia Digital de la Región Costera, College of Charleston): Salih Bilali nació alrededor de 1790 en Massina, a orillas del río Níger (actual Malí). Fue capturado y vendido en la Costa de Oro a las Bahamas, y posteriormente vendido a James Hamilton Couper, quien lo llevó a la plantación Cannon's Point en la isla de St. Simons, Georgia, donde ascendió hasta convertirse en capataz principal. Algunos registros de venta lo identifican como «Tom». Couper comenta sobre él: «Su laboriosidad, inteligencia y honestidad pronto le valieron el reconocimiento, y fue ascendiendo progresivamente hasta convertirse en capataz principal»."
  fr: "Page d'exposition de « Musulmans africains esclaves et affranchis: voyageurs spirituels dans le Sud et les Lowcountry » (Initiative d'histoire numérique des Lowcountry, Collège de Charleston): Salih Bilali naquit vers 1790 à Massina, sur le fleuve Niger (actuel Mali). Capturé, il fut vendu le long de la Côte de l'Or jusqu'aux Bahamas, puis acquis par James Hamilton Couper, qui l'emmena à la plantation de Cannon's Point sur l'île de St. Simons, en Géorgie, où il devint chef d'équipe. Certains actes de vente le mentionnent sous le nom de « Tom ». Couper écrit à son sujet: « Son ardeur au travail, son intelligence et son honnêteté lui valurent rapidement d'être remarqué, et il gravit les échelons jusqu'à devenir chef d'équipe. »"
  ur: "'غلامی اور آزاد افریقی مسلمان: جنوبی اور کم ملک میں روحانی راہگیر' کا نمائشی صفحہ ⁦(لوکاؤنٹری ڈیجیٹل ہسٹری انیشی ایٹو، کالج آف چارلسٹن)⁩: صالح بلالی 1790 کے آس پاس دریائے نائجر ⁦(موجودہ مالی)⁩ پر مسینا میں پیدا ہوا، پکڑا گیا اور اسے گولڈ کوسٹ کے ساتھ بیچ دیا گیا، پھر جیمز کو گولڈ کوسٹ کے پاس لے جایا گیا۔ سینٹ سائمنز جزیرہ، جارجیا پر کینن پوائنٹ پلانٹیشن، جہاں وہ ہیڈ ڈرائیور کے عہدے پر فائز ہوئے۔ کچھ فروخت کے ریکارڈ اسے 'ٹام' کے طور پر نوٹ کرتے ہیں۔ اس میں کوپر کا حوالہ دیا گیا ہے: 'اس کی صنعت، ذہانت اور ایمانداری نے جلد ہی اسے نوٹس میں لایا، اور وہ یکے بعد دیگرے ترقی کرتا گیا، یہاں تک کہ اسے ہیڈ ڈرائیور بنا دیا گیا۔'"
