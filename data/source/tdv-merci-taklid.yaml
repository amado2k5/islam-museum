summary:
  ar: "مدخل «مرجع التقليد» في موسوعة TDV الإسلامية ⁦(المجلد 29، أنقرة 2004، ص 172–174)⁩ بقلم حامد ألكار: المجتهد الذي يرجع إليه الإمامية في الفتوى، وشروطه، وقواعد التقليد، ودوره في الحكم والمال، وتاريخه السياسي في العهد القاجاري والمعاصر."
  en: "The TDV İslâm Ansiklopedisi entry 'MERCİ-i TAKLÎD' (vol. 29, Ankara 2004, pp. 172–174) by Hamid Algar: the mujtahid whom Imami Shi'is consult for rulings, his conditions, the rules of following a marja, the office's role in religious dues and endowments, and its political history under the Qajars and after."
  es: "La entrada 'MERCİ-i TAKLÎD' de la TDV İslâm Ansiklopedisi (vol. 29, Ankara 2004, pp. 172–174) de Hamid Algar: el muytahid al que consultan los chiítas imamíes para obtener dictámenes, sus condiciones, las reglas para seguir a un marja, el papel del cargo en los derechos y donaciones religiosas y su historia política bajo los Qajar y posteriormente."
  fr: "L'entrée TDV İslâm Ansiklopedisi 'MERCİ-i TAKLÎD' (vol. 29, Ankara 2004, pp. 172–174) par Hamid Algar: le mujtahid que les chiites imami consultent pour des décisions, ses conditions, les règles de suivre un marja, le rôle de la fonction dans les cotisations et dotations religieuses, et son histoire politique sous les Qajars et après."
