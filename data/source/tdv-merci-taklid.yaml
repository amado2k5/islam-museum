summary:
  ar: "مدخل «مرجع التقليد» في موسوعة TDV الإسلامية (المجلد 29، أنقرة 2004، ص 172–174) بقلم حامد ألكار: المجتهد الذي يرجع إليه الإمامية في الفتوى، وشروطه، وقواعد التقليد، ودوره في الحكم والمال، وتاريخه السياسي في العهد القاجاري والمعاصر."
  en: "The TDV İslâm Ansiklopedisi entry 'MERCİ-i TAKLÎD' (vol. 29, Ankara 2004, pp. 172–174) by Hamid Algar: the mujtahid whom Imami Shi'is consult for rulings, his conditions, the rules of following a marja, the office's role in religious dues and endowments, and its political history under the Qajars and after."
