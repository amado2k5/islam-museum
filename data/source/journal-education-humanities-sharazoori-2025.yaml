label: { ar: "دراسة استراتيجيات الإقناع في خطب الجمعة الكردية — مجلة التربية للعلوم الإنسانية (2025)", en: "A Discourse Study of Persuasion Strategies in Kurdish Friday Sermons — Journal of Education for Humanities (2025)" }
summary:
  ar: "دراسة أكاديمية محكّمة لجيار عثمان حمه‌دمين من جامعة صلاح الدين – أربيل، نُشرت في مجلة التربية للعلوم الإنسانية، المجلد 5، العدد 19، في 1 يونيو 2025؛ حلّلت خطبة جمعة كردية مدتها 33 دقيقة للواعظ الكردي المعروف محمد فائق شارەزووری مأخوذة من يوتيوب."
  en: "A peer-reviewed study by Jiyar Othman Hamadamin of Salahaddin University–Erbil, published in the Journal of Education for Humanities, vol. 5 no. 19, on 1 June 2025; it analyses a 33-minute Kurdish Friday sermon by 'a well-known Kurdish preacher called Mullah Mohammad Faeeq Sharazoori', taken from a YouTube video."
  es: "Un estudio revisado por pares realizado por Jiyar Othman Hamadamin de la Universidad de Salahaddin-Erbil, publicado en el Journal of Education for Humanities, vol. 5, n.º 19, el 1 de junio de 2025, analiza un sermón kurdo de los viernes de 33 minutos de duración pronunciado por \"un conocido predicador kurdo llamado Mullah Mohammad Faeeq Sharazoori\", tomado de un vídeo de YouTube."
  fr: "Une étude évaluée par des pairs par Jiyar Othman Hamadamin de l'Université Salahaddin d'Erbil, publiée dans le Journal of Education for Humanities, vol. 5 no. 19, le 1er juin 2025; elle analyse un sermon kurde du vendredi de 33 minutes d'un prédicateur kurde bien connu appelé Mullah Mohammad Faeeq Sharazoori, tiré d'une vidéo YouTube."
  ur: "صلاح الدین یونیورسٹی – اربیل کے جیار عثمان حمادمین کا ہم مرتبہ جائزہ لیا گیا مطالعہ، جو جرنل آف ایجوکیشن فار ہیومینٹیز میں شائع ہوا، جلد۔ 5 نمبر 19، 1 جون 2025 کو؛ یہ 33 منٹ کے کرد جمعہ کے خطبہ کا تجزیہ کرتا ہے جو کہ 'ایک معروف کرد مبلغ ملا محمد فائق شرازوری' کے یوٹیوب ویڈیو سے لیا گیا ہے۔"
  tr: "Selahaddin Üniversitesi – Erbil'den Jiyar Osman Hama Damin tarafından yürütülen, Journal of Education for Humanities, Cilt 5, Sayı 19'da 1 Haziran 2025'te yayımlanan hakemli akademik çalışma, YouTube'dan alınan ünlü Kürt vaizi Muhammad Faiq Sharazouri'nin 33 dakikalık Kürtçe Cuma vaazını analiz etti."
  id: "Sebuah studi akademik yang ditinjau sejawat oleh Jiyar Osman Hama Damin dari Universitas Salahaddin – Erbil, yang diterbitkan di Journal of Education for Humanities, Volume 5, Edisi 19, pada 1 Juni 2025; menganalisis khotbah Jumat Kurdi berdurasi 33 menit oleh pengkhotbah Kurdi terkenal Muhammad Faiq Sharazouri yang diambil dari YouTube."
title: "A Discourse Study of Persuasion Strategies in Kurdish Friday Sermons"
