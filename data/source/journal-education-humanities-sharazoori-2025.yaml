reliability_note: "A peer-reviewed academic article (received 24 July 2024, accepted 27 August 2024, published 1 June 2025), independent of the preacher and his channel. It identifies its subject as 'a well-known Kurdish preacher called Mullah Mohammad Faeeq Sharazoori', states that the sermon data was collected from a YouTube video lasting approximately 33 minutes, and analyses the sermon's persuasion strategies under Johnstone's framework. It is the identity anchor for this record: an academic identification of the man and of YouTube as his platform. It names no school or madhhab for him. Checked 9 November 2026."
