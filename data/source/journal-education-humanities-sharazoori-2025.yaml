summary:
  ar: "دراسة أكاديمية محكّمة لجيار عثمان حمه‌دمين من جامعة صلاح الدين – أربيل، نُشرت في مجلة التربية للعلوم الإنسانية، المجلد 5، العدد 19، في 1 يونيو 2025؛ حلّلت خطبة جمعة كردية مدتها 33 دقيقة للواعظ الكردي المعروف محمد فائق شارەزووری مأخوذة من يوتيوب."
  en: "A peer-reviewed study by Jiyar Othman Hamadamin of Salahaddin University–Erbil, published in the Journal of Education for Humanities, vol. 5 no. 19, on 1 June 2025; it analyses a 33-minute Kurdish Friday sermon by 'a well-known Kurdish preacher called Mullah Mohammad Faeeq Sharazoori', taken from a YouTube video."
title: "A Discourse Study of Persuasion Strategies in Kurdish Friday Sermons"
