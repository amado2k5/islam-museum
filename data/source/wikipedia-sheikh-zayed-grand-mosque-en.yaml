reliability_note: "Pointer for entity facts only, used where the article cites a source: built 1994 to 2007 and inaugurated in December 2007 (Abu Dhabi Government page); the infobox groundbreaking of 1996 is noted as an alternative; the founder's burial in the courtyard in 2004; dimensions about 290 by 420 m and more than 12 hectares, capacity over 40,100 with a main hall of over 7,000 (the mosque centre's own site, szgmc.ae; the infobox gives 41,000+); four minarets of about 107 m (szgmc.ae; the infobox gives 104 m); 82 domes; the architect Yusef Abdelki with Basem Barghouti, Moataz al-Halabi and Imad Malas (AD Middle East, 2 December 2023); contractors Impregilo and Rizzani de Eccher, then ACC and Six Construct 2004 to 2007 (Accsal; BESIX; Gulf Construction 2004); the 17,000 m2 marble courtyard and the marbles used (szgmc.ae); the carpet by Iran Carpet Company designed by Ali Khaliqi, 5,627 m2 (szgmc.ae; Web India 2007); the seven Faustig chandeliers; the lighting by Speirs and Major; the calligraphers Mohammed Mandi al-Tamimi, Farouk Haddad and Mohammed Allam (szgmc.ae); TripAdvisor's ranking as the world's second favourite landmark (The National, 27 May 2017); the replica in Surakarta (The National, 14 November 2022). Lines marked 'citation needed' or 'by whom' are not used. Read in Chrome on 6 November 2026."
