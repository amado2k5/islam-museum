  fr: "Article Wikipédia en anglais sur Keith Ellison; utilisé uniquement pour les informations le concernant. Il relate sa naissance le 4 août 1963 à Détroit, son éducation catholique et sa conversion à l’islam à l’université, son élection comme premier musulman au Congrès, son mandat de membre du Congrès puis de procureur général du Minnesota; le texte ne mentionne aucun établissement scolaire."
