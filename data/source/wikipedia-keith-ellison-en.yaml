  ar: "مقالة ويكيبيديا الإنجليزية عن كيث إليسون؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في 4 أغسطس 1963 في ديترويت، وتربيته الكاثوليكية واعتناقه الإسلام في الجامعة، وكونه أول مسلم يُنتخب للكونغرس، وخدمته نائبًا ثم مدعيًا عامًا لمنيسوتا، ولا ينصّ متنها على مذهب له."
  en: "English Wikipedia article on Keith Ellison; used for entity facts only. It records his birth on 4 August 1963 in Detroit, his Catholic upbringing and conversion to Islam at university, his being the first Muslim elected to Congress, his service as a congressman and then as Minnesota attorney general; its text names no school for him."
