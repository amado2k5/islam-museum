summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إريك أبيدال؛ تُستخدم لوقائع الكيان فقط. تروي سيرة المدافع الفرنسي المولود في 11 سبتمبر 1979 بسان جوني لافال: ليون وبرشلونة ⁦(19 لقبًا مع الناديين ودوري أبطال أوروبا مرتين)⁩ وموناكو وأولمبياكوس، و67 مباراة مع فرنسا، وورم الكبد وزراعته، وأنه نشأ في عائلة كاثوليكية واعتنق الإسلام في عشرينياته."
  en: "English Wikipedia article on Eric Abidal; used for entity facts only. It records the French defender born 11 September 1979 at Saint-Genis-Laval: Lyon and Barcelona (19 trophies with the two clubs, two Champions Leagues), Monaco and Olympiacos, 67 France caps, his liver tumour and transplant, and that he was raised in a Catholic family and converted to Islam in his 20s."
  es: "Artículo de la Wikipedia en inglés sobre Eric Abidal; utilizado únicamente para datos sobre la persona. En él se menciona al defensa francés nacido el 11 de septiembre de 1979 en Saint-Genis-Laval: Lyon y Barcelona (19 trofeos con ambos clubes, dos Ligas de Campeones), Mónaco y Olympiacos, 67 partidos con la selección francesa, su tumor hepático y el trasplante, y que fue criado en una familia católica y se convirtió al islam a los veinte años."
  fr: "Article Wikipédia en anglais sur Eric Abidal; utilisé uniquement pour les informations sur le joueur. Il retrace la vie du défenseur français né le 11 septembre 1979 à Saint-Genis-Laval: Lyon et Barcelone (19 trophées avec les deux clubs, dont deux Ligues des champions), Monaco et l’Olympiakos, 67 sélections en équipe de France, sa tumeur au foie et sa transplantation, et son éducation dans une famille catholique et sa conversion à l’islam dans sa vingtaine."
  ur: "ایرک ابیڈل پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں فرانسیسی محافظ کا ریکارڈ ہے جو 11 ستمبر 1979 کو سینٹ-جینس-لاوال میں پیدا ہوا: لیون اور بارسلونا ⁦(دو کلبوں کے ساتھ 19 ٹرافی، دو چیمپئنز لیگ)⁩، موناکو اور اولمپیاکوس، 67 فرانس کیپس، اس کے جگر کا ٹیومر اور ٹرانسپلانٹ، اور یہ کہ اس کی پرورش ایک کیتھولک خاندان میں ہوئی اور اسلام قبول کیا۔"
