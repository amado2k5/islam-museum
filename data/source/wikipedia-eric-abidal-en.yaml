  ar: "مقالة ويكيبيديا الإنجليزية عن إريك أبيدال؛ تُستخدم لوقائع الكيان فقط. تروي سيرة المدافع الفرنسي المولود في 11 سبتمبر 1979 بسان جوني لافال: ليون وبرشلونة (19 لقبًا مع الناديين ودوري أبطال أوروبا مرتين) وموناكو وأولمبياكوس، و67 مباراة مع فرنسا، وورم الكبد وزراعته، وأنه نشأ في عائلة كاثوليكية واعتنق الإسلام في عشرينياته."
  en: "English Wikipedia article on Eric Abidal; used for entity facts only. It records the French defender born 11 September 1979 at Saint-Genis-Laval: Lyon and Barcelona (19 trophies with the two clubs, two Champions Leagues), Monaco and Olympiacos, 67 France caps, his liver tumour and transplant, and that he was raised in a Catholic family and converted to Islam in his 20s."
