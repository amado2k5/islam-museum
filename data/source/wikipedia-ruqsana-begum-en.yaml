summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن روكسانا بيجوم؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها ونشأتها في بيثنال غرين بلندن في 15 أكتوبر 1983 لأسرة بريطانية بنغلاديشية، وتدريبها السري لسنوات خوفاً من اعتراض أسرتها المسلمة المتدينة، ولقبيها البريطاني والعالمي، وخط حجابها الرياضي، وكتابها «مقاتلة بالفطرة». وتصفها مراراً بأنها مسلمة دون أن تسمي لها مذهباً."
  en: "English Wikipedia article on Ruqsana Begum; used for entity facts only. It gives her birth and upbringing in Bethnal Green, London, on 15 October 1983 to a British Bangladeshi family, her years of training in secret from her strict Muslim family, her British and world titles, her sports-hijab line and her book Born Fighter. It calls her a Muslim repeatedly, without naming any school for her."
  es: "Artículo de Wikipedia en inglés sobre Ruqsana Begum; utilizado únicamente para datos biográficos. Describe su nacimiento y crianza en Bethnal Green, Londres, el 15 de octubre de 1983, en el seno de una familia británico-bangladesí; sus años de entrenamiento en secreto, lejos de su estricta familia musulmana; sus títulos británicos y mundiales; su línea deportiva con hiyab; y su libro \"Born Fighter\". La menciona repetidamente como musulmana, sin indicar ninguna escuela a la que haya asistido."
  fr: "Article Wikipédia en anglais sur Ruqsana Begum; utilisé uniquement à titre informatif. Il relate sa naissance et son enfance à Bethnal Green, Londres, le 15 octobre 1983, au sein d'une famille britannique d'origine bangladaise, ses années d'entraînement clandestin à l'insu de sa famille musulmane pratiquante, ses titres britanniques et internationaux, sa ligne de hijabs sportifs et son livre « Born Fighter ». L'article la qualifie de musulmane à plusieurs reprises, sans toutefois mentionner d'établissement scolaire."
  ur: "رخسانہ بیگم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 15 اکتوبر 1983 کو ایک برطانوی بنگلہ دیشی خاندان میں بیتھنل گرین، لندن میں اس کی پیدائش اور پرورش، اس کے سخت مسلم خاندان سے اس کی برسوں کی تربیت، اس کے برطانوی اور عالمی عنوانات، اس کی کھیلوں کی حجاب لائن اور اس کی کتاب بورن فائٹر ہے۔ یہ اسے بار بار مسلمان کہتا ہے، اس کے لیے کسی اسکول کا نام لیے بغیر۔"
