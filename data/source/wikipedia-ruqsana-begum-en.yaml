reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The infobox gives her birth on 15 October 1983 in Bethnal Green, London, her nickname Warrior Princess and her trainer Bill Judd. The text records that she was born and brought up in Bethnal Green in a strict Muslim household (Morning Star, 2015), took up kickboxing at eighteen in 2002 and trained in secret for almost five years, turned professional in 2008, won the British Muay Thai atomweight title on 27 November 2010 — Sky News, cited there, calls her the only Muslim woman who is a national champion in her sport, and a 2017 BBC report calls her the first female British Muslim kickboxing champion — won the WKA world title on 23 April 2016, turned professional in boxing in 2018 and won the WBU female intercontinental championship in Dhaka in March 2023. It also records her chronic fatigue syndrome (ME), her free coaching for East End children, the sports-hijab line she launched in April 2016, her 2012 Olympic torch relay run and the Queen's Achievement Award for Breaking Down Barriers, her 2017 pilgrimage to Mecca, and her book Born Fighter (2020), shortlisted for the William Hill Sports Book of the Year. The article names no school or madhhab for her."
