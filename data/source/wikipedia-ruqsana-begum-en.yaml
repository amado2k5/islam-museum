summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن روكسانا بيجوم؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها ونشأتها في بيثنال غرين بلندن في 15 أكتوبر 1983 لأسرة بريطانية بنغلاديشية، وتدريبها السري لسنوات خوفاً من اعتراض أسرتها المسلمة المتدينة، ولقبيها البريطاني والعالمي، وخط حجابها الرياضي، وكتابها «مقاتلة بالفطرة». وتصفها مراراً بأنها مسلمة دون أن تسمي لها مذهباً."
  en: "English Wikipedia article on Ruqsana Begum; used for entity facts only. It gives her birth and upbringing in Bethnal Green, London, on 15 October 1983 to a British Bangladeshi family, her years of training in secret from her strict Muslim family, her British and world titles, her sports-hijab line and her book Born Fighter. It calls her a Muslim repeatedly, without naming any school for her."
