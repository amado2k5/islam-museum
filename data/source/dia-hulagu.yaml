reliability_note: "Read in the museum's session on 20 November 2026. It gives his father as Tolui, the youngest son of Chinggis Khan; says that before the attack on Alamut in 653 (1255) he asked the caliph al-Musta'sim for troops and that after Alamut he wrote again asking him to demolish the city's walls and fill the ditches; that he set out from Hamadan for Baghdad on 9 Rabi' I 655 (27 March 1257) and surrounded the city with an army in three parts, right, left and centre; that the sources give the number put to the sword in Baghdad as anything from 800,000 to 2,300,000, and give different reports about the killing of the caliph and about the vizier Ibn al-Alqami, said to have encouraged Hulagu to invade; that the capture of Baghdad and the end of the Abbasid caliphate was a turning point in Islamic history; that a massacre rarely matched in history took place and the smell of the corpses forced even Hulagu to leave the city; that mosques and libraries were destroyed, books thrown into the Tigris and the river ran for days the colour of ink; and that this was a catastrophe for the whole Islamic world, from which date Islamic civilisation is seen to begin to stagnate and decline (the article's own judgment). Used for the statements it makes, each attributed to it; the museum does not treat them as settled where the article itself speaks of reports."
