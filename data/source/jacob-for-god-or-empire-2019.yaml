reliability_note: "Peer-reviewed university-press monograph devoted to Sayyid Fadl. Used here, via its published text and the review in the Journal of Indian Ocean World Studies, for his dates (1824–1900), his Sufi formation and leadership in the Alawiyya tradition, his governorship of Dhofar and his death at Istanbul in 1900. Read on 25 October 2026."
