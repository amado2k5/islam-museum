summary:
  ar: "دراسة أكاديمية لولسون تشاكو جاكوب عن حياة السيد فضل بن علوي (1824-1900): وُلد في مالابار لأب صوفي حضرمي مهاجر، ونُفي إلى الجزيرة العربية، وصار عالما صوفيا معروفا ووالياً عثمانياً على ظفار ثم مستشارا للسلطان في إسطنبول حيث توفي سنة 1900. تتبع الكتاب أيضا تقليد السادة العلويين الباعلوي وطريقتهم الصوفية في عالم المحيط الهندي."
  en: "Wilson Chacko Jacob's academic study of the life of Sayyid Fadl ibn Alawi (1824–1900): born in Malabar to a Hadrami immigrant Sufi father, exiled to Arabia, he became a renowned Sufi scholar, an Ottoman governor in Dhofar and an adviser to the Sultan in Istanbul, where he died in 1900. The book also traces the Ba Alawi sayyids and their Sufi pathway across the Indian Ocean world."
  es: "El estudio académico de Wilson Chacko Jacob sobre la vida de Sayyid Fadl ibn Alawi (1824-1900): nacido en Malabar de un padre sufí inmigrante hadrami, exiliado a Arabia, se convirtió en un renombrado erudito sufí, gobernador otomano en Dhofar y consejero del sultán en Estambul, donde falleció en 1900. El libro también traza la trayectoria de los sayyids Ba Alawi y su recorrido sufí por el mundo del Océano Índico."
  fr: "L'étude universitaire de Wilson Chacko Jacob sur la vie de Sayyid Fadl ibn Alawi (1824-1900): né à Malabar d'un père soufi immigré hadram, exilé en Arabie, il devint un érudit soufi renommé, gouverneur ottoman du Dhofar et conseiller du sultan à Istanbul, où il mourut en 1900. L'ouvrage retrace également le parcours des sayyids Ba Alawi et leur voie soufie à travers le monde de l'océan Indien."
title: "For God or Empire: Sayyid Fadl and the Indian Ocean World"
