summary:
  ar: "دراسة أكاديمية لولسون تشاكو جاكوب عن حياة السيد فضل بن علوي (1824-1900): وُلد في مالابار لأب صوفي حضرمي مهاجر، ونُفي إلى الجزيرة العربية، وصار عالما صوفيا معروفا ووالياً عثمانياً على ظفار ثم مستشارا للسلطان في إسطنبول حيث توفي سنة 1900. تتبع الكتاب أيضا تقليد السادة العلويين الباعلوي وطريقتهم الصوفية في عالم المحيط الهندي."
  en: "Wilson Chacko Jacob's academic study of the life of Sayyid Fadl ibn Alawi (1824–1900): born in Malabar to a Hadrami immigrant Sufi father, exiled to Arabia, he became a renowned Sufi scholar, an Ottoman governor in Dhofar and an adviser to the Sultan in Istanbul, where he died in 1900. The book also traces the Ba Alawi sayyids and their Sufi pathway across the Indian Ocean world."
title: "For God or Empire: Sayyid Fadl and the Indian Ocean World"
