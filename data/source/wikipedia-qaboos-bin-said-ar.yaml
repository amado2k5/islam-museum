summary:
  ar: "مقالة ويكيبيديا العربية عن قابوس بن سعيد؛ تُستخدم لوقائع الكيان فقط. تروي نشأته وتوليه الحكم سنة 1970 وإنجازاته وسياساته ووفاته وخلافة هيثم بن طارق له. ولا يسمي متنها مذهبه، وتصنّفه فئاتها تحت «إباضيون»، وهو تصنيف لا إثبات."
  en: "Arabic Wikipedia article on Qaboos bin Said; used for entity facts only. It recounts his upbringing, his accession in 1970, his achievements and policies, his death and the succession of Haitham bin Tariq. No text in it names his school, and its categories file him under 'Ibadis' — a filing."
  es: "Artículo en árabe de la Wikipedia sobre Qaboos bin Said; se utiliza únicamente para obtener información sobre la persona. Relata su infancia, su ascenso al trono en 1970, sus logros y políticas, su muerte y la sucesión de Haitham bin Tariq. No menciona su escuela y lo clasifica como «ibadí»."
  fr: "L'article de Wikipédia en arabe consacré à Qabous bin Saïd, utilisé uniquement à des fins d'information sur l'entité, relate son enfance, son accession au trône en 1970, ses réalisations et sa politique, sa mort et la succession de Haïtham bin Tariq. Aucune mention n'est faite de son école, et il est classé dans la catégorie « Ibadis »."
  ur: "قابوس بن سعید پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پرورش، 1970 میں ان کے الحاق، ان کی کامیابیوں اور پالیسیوں، ان کی موت اور ہیثم بن طارق کی جانشینی کا ذکر ہے۔ اس میں کسی متن میں اس کے اسکول کا نام نہیں ہے، اور اس کے زمرے اسے 'عبادیس' کے تحت فائل کرتے ہیں۔"
