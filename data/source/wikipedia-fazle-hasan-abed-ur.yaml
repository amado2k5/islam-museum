  ur: "فضل حسن عابد پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ انگریزی مضمون سے ماخوذ ایک مختصر سٹب، اس میں اسے ایک چیریٹی ورکر، سماجی کارکن اور چارٹرڈ اکاؤنٹنٹ کے طور پر بیان کیا گیا ہے اور اس میں کوئی تاریخ اور کوئی مذہب کا مواد نہیں ہے۔"
