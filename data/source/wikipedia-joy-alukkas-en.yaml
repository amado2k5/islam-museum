summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جوي ألوكاس: وُلد في 29 تشرين الأول 1956 في تريشور، أسس مجوهرات جوي ألوكاس سنة 2001، وتذكر أعماله الخيرية ومذكراته «نشر الفرح» ومداهمات ضريبة الدخل سنة 2018 ومصادرة إدارة الإنفاذ أصولاً سنة 2023."
  en: "English Wikipedia article on Joy Alukkas, born 29 October 1956 at Thrissur, who founded Joy Alukkas Jewellery in 2001; it covers his philanthropy, his memoir Spreading Joy, the 2018 Income Tax raids and the Enforcement Directorate's 2023 attachment of assets."
  es: "Artículo de la Wikipedia en inglés sobre Joy Alukkas, nacido el 29 de octubre de 1956 en Thrissur, quien fundó Joy Alukkas Jewellery en 2001; abarca su filantropía, sus memorias Spreading Joy, las redadas del Impuesto sobre la Renta de 2018 y el embargo de bienes por parte de la Dirección de Ejecución en 2023."
  fr: "Article de Wikipédia en anglais sur Joy Alukkas, né le 29 octobre 1956 à Thrissur, qui a fondé Joy Alukkas Jewellery en 2001; il traite de sa philanthropie, de ses mémoires Spreading Joy, des raids fiscaux de 2018 et de la saisie d'actifs par la Direction de l'application des lois en 2023."
  ur: "جوائے الوکاس پر انگریزی ویکیپیڈیا کا مضمون، 29 اکتوبر 1956 کو تھریسور میں پیدا ہوا، جس نے 2001 میں جوائے الوکاس جیولری کی بنیاد رکھی۔ اس میں ان کی انسان دوستی، اس کی یادداشت اسپریڈنگ جوی، 2018 کے انکم ٹیکس کے چھاپے اور انفورسمنٹ ڈائریکٹوریٹ کے 2023 کے اثاثوں کا احاطہ کیا گیا ہے۔"
  tr: "Joy Alukas hakkında İngilizce Wikipedia makalesi: 29 Ekim 1956'da Thrissur'da doğdu, 2001 yılında Joy Alukas Jewelry'yi kurdu. Hayır işleri olan anıları, 'Spreading Joy' adlı eserleri, 2018'deki gelir vergisi baskınları ve 2023'teki yaptırım dairesinin el koyması hatırlanıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Joy Alukas: Lahir pada 29 Oktober 1956 di Thrissur, ia mendirikan Joy Alukas Jewelry pada tahun 2001. Karya amalnya, memoar 'Spreading Joy,' penggerebekan pajak penghasilan pada tahun 2018, dan penyitaan departemen penegakan hukum pada tahun 2023 dikenang."
