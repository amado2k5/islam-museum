  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى شوكاي (25 ديسمبر 1890 – 27 ديسمبر 1941)، الرئيس الكازاخي لحكومة تركستان المستقلة؛ تُستخدم لوقائع الكيان فقط. تتناول مولده في أسرة كازاخية مسلمة في أكمشيت ودراسته الحقوق في سانت بطرسبرغ وعمله لفصيل المسلمين في الدوما بتوصية من عليخان بوكيخانوف وحكومة خوكند ومنفاه في إسطنبول وباريس ورفضه قيادة الفيلق التركستاني ووفاته في برلين."
  en: "English Wikipedia article on Mustafa Shokay (25 December 1890 – 27 December 1941), the Kazakh head of the Turkestan Autonomy; used for entity facts only. It covers his birth into a Muslim Kazakh family at Ak-Meshit, his law studies at St Petersburg, his work for the Duma Muslim faction on Alikhan Bukeikhanov's recommendation, the Kokand autonomy, his exile in Istanbul and Paris, his refusal to lead the Turkestan Legion, and his death in Berlin."
