summary:
  ar: "مقال موسوعي بالبوسنية عن نافيا سرايليتش ⁦(وُلدت هاجيكاريتش؛ 1893–1970)⁩، الكاتبة والمعلّمة في سراييفو، من أوائل الناثرات في البوسنة والهرسك، المدافعة عن تعليم النساء المسلمات وتحرّرهن."
  en: "Bosnian-language encyclopedia article on Nafija Sarajlić (née Hadžikarić; 1893–1970), the Sarajevo writer and teacher, one of the first women prose authors of Bosnia and Herzegovina and an advocate of Muslim women's education."
  es: "Artículo de una enciclopedia en idioma bosnio sobre Nafija Sarajlić (de soltera Hadžikarić; 1893–1970), escritora y maestra de Sarajevo, una de las primeras mujeres prosistas de Bosnia y Herzegovina y defensora de la educación de las mujeres musulmanas."
  fr: "Article de l'encyclopédie en langue bosniaque sur Nafija Sarajlić (née Hadžikarić; 1893–1970), écrivaine et enseignante de Sarajevo, l'une des premières femmes auteurs de prose de Bosnie-Herzégovine et une défenseure de l'éducation des femmes musulmanes."
  ur: "Nafija Sarajlić ⁦(née Hadžikarić؛ 1893–1970)⁩ پر بوسنیائی زبان کا انسائیکلوپیڈیا مضمون، سراجیوو کی مصنفہ اور استاد، بوسنیا اور ہرزیگوینا کی پہلی خواتین نثری مصنفین میں سے ایک اور مسلم خواتین کی تعلیم کی حامی ہیں۔"
  tr: "Saraybosna'da yazar ve öğretmen olan Navia Šrălić (doğum Hažić; 1893–1970) hakkında Bosnakça ansiklopedik bir makale; Bosna-Hersek'teki ilk düzyazı yazarlarından biri olarak, Müslüman kadınların eğitimi ve özgürlüğünü savunmuştur."
  id: "Sebuah artikel ensiklopedis dalam bahasa Bosnia tentang Navia Šrălić (lahir Hažić; 1893–1970), penulis dan guru di Sarajevo, salah satu penulis prosa pertama di Bosnia dan Herzegovina, yang memperjuangkan pendidikan dan pembebasan perempuan Muslim."
