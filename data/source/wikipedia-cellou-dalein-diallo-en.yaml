  ar: "مقالة ويكيبيديا الإنجليزية عن سيلو دالين ديالو؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته الوزارية (1996–2004) ورئاسته الوزراء (2004–2006) وإقالته، وقيادته اتحاد القوى الديمقراطية الغيني منذ 2007، وإصابته في احتجاج 28 سبتمبر 2009، وتصدّره الجولة الأولى سنة 2010 وخسارته الجولة الثانية، وترشحه في 2015 و2020. لا يذكر نصّها دينه؛ وصندوق معلوماتها يحمل حقلا خاصا بالدين يسمّي الإسلام."
  en: "English Wikipedia article on Cellou Dalein Diallo; used for entity facts only. It recounts his ministerial career (1996–2004), his premiership (2004–2006) and dismissal, his leadership of the UFDG from 2007, his injury in the 28 September 2009 protest, his first-round lead in 2010 and runoff loss, and his 2015 and 2020 candidacies. Its text says nothing about his religion; its infobox carries a custom Religion field naming Islam."
