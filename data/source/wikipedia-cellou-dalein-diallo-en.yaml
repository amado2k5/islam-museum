summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيلو دالين ديالو؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته الوزارية (1996–2004) ورئاسته الوزراء (2004–2006) وإقالته، وقيادته اتحاد القوى الديمقراطية الغيني منذ 2007، وإصابته في احتجاج 28 سبتمبر 2009، وتصدّره الجولة الأولى سنة 2010 وخسارته الجولة الثانية، وترشحه في 2015 و2020. لا يذكر نصّها دينه؛ وصندوق معلوماتها يحمل حقلا خاصا بالدين يسمّي الإسلام."
  en: "English Wikipedia article on Cellou Dalein Diallo; used for entity facts only. It recounts his ministerial career (1996–2004), his premiership (2004–2006) and dismissal, his leadership of the UFDG from 2007, his injury in the 28 September 2009 protest, his first-round lead in 2010 and runoff loss, and his 2015 and 2020 candidacies. Its text says nothing about his religion; its infobox carries a custom Religion field naming Islam."
  es: "Artículo de la Wikipedia en inglés sobre Cellou Dalein Diallo; utilizado únicamente para datos sobre la persona. Relata su carrera ministerial (1996-2004), su mandato como primer ministro (2004-2006) y su destitución, su liderazgo de la UFDG desde 2007, su lesión en la protesta del 28 de septiembre de 2009, su ventaja en la primera vuelta de las elecciones de 2010 y su derrota en la segunda vuelta, y sus candidaturas en 2015 y 2020. El texto no menciona su religión; su ficha informativa incluye un campo personalizado de Religión que indica Islam."
  fr: "Article Wikipédia en anglais sur Cellou Dalein Diallo; utilisé uniquement pour les informations sur l’entité. Il retrace sa carrière ministérielle (1996-2004), son mandat de Premier ministre (2004-2006) et sa destitution, sa direction de l’UFDG à partir de 2007, sa blessure lors de la manifestation du 28 septembre 2009, son avance au premier tour en 2010 et sa défaite au second tour, ainsi que ses candidatures de 2015 et 2020. Le texte ne mentionne pas sa religion; son infobox comporte un champ personnalisé « Religion » indiquant « Islam »."
  ur: "Cellou Dalein Diallo پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے وزارتی کیریئر (1996-2004)، اس کی وزارت عظمیٰ (2004-2006) اور برطرفی، 2007 سے UFDG کی اس کی قیادت، 28 ستمبر 2009 کے احتجاج میں ان کی چوٹ، 2010 میں اس کی پہلے راؤنڈ کی برتری اور رن آف ہار، اور اس کی 2015 کی جیت کا ذکر ہے۔ اس کا متن اس کے مذہب کے بارے میں کچھ نہیں کہتا۔ اس کے انفو باکس میں اسلام کا نام رکھنے والا ایک اپنی مرضی کے مطابق مذہب کا میدان ہے۔"
