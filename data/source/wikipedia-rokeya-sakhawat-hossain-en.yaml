reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The article rests heavily on the Banglapedia entry by Shahida Akhter, cited throughout, and notes itself that the 9 December birth date is 'more conjecture than a fact as it was not documented' — the date is recorded with that caveat in the person record. It covers her birth as Rokeya Khatun to the zamindar Zahiruddin Muhammad Abu Ali Haidar Saber and Rahatunnessa Sabera Chaudhurani, her home learning of Bengali and English from her eldest brother Ibrahim Saber and her sister Karimunnesa, her marriage in 1898 to Khan Bahadur Sakhawat Hossain, the Urdu-speaking deputy magistrate of Bhagalpur who encouraged her learning and writing, his death in 1909, the school she founded five months later at Bhagalpur and moved to Calcutta in 1911, her twenty-four years running it, the Anjuman-e-Khawateen-e-Islam founded in 1916, her presidency of the 1926 Bengal Women's Education Conference at Kolkata, her death of heart problems on 9 December 1932 shortly after presiding over a session of the Indian Women's Conference, her grave at Sodepur rediscovered through the historian Amalendu De, the Rokeya Day observance and Begum Rokeya Padak, her sixth place in the BBC's 2004 Greatest Bengali poll, and her works with Sultana's Dream dated 1905 in the lead and works list and 1908 in the marriage section and in Banglapedia — both dates are recorded. It names no school for her; its infobox records no religion."
