summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رقية سخاوات حسين (بيغوم رقية، 1880-1932)؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في بايراباند في 9 ديسمبر 1880 ووفاتها في كلكتا في 9 ديسمبر 1932، ومدرسة سخاوات التذكارية للبنات التي أسستها، وجمعية نساء الإسلام التي أسستها سنة 1916، وأعمالها «ماتيتشور» و«حلم سلطانة» (1905) و«بادماراغ» و«أبارودباسيني»."
  en: "English Wikipedia article on Rokeya Sakhawat Hossain (Begum Rokeya, 1880–1932); used for entity facts only. It records her birth at Pairaband on 9 December 1880 and her death at Calcutta on 9 December 1932, the Sakhawat Memorial Girls' School she founded, the Muslim Women's Association she founded in 1916, and her works Matichur, Sultana's Dream (1905), Padmarag and Abarodhbasini."
