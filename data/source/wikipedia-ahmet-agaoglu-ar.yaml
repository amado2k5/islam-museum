summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد آغا أوغلي؛ تعطي ميلاده في ديسمبر 1869 في شوشة ووفاته في 19 مايو 1939 في إسطنبول، وتروي مسيرته في أذربيجان وتركيا ومؤلفاته؛ وهي في معظمها ترجمة للمقالة الإنجليزية."
  en: "Arabic Wikipedia article on Ahmet Ağaoğlu; it gives his birth in December 1869 at Shusha and his death on 19 May 1939 at Istanbul, and recounts his career in Azerbaijan and Turkey and his works; it is largely a translation of the English article."
  es: "Artículo en árabe de la Wikipedia sobre Ahmet Ağaoğlu; en él se indica su nacimiento en diciembre de 1869 en Shusha y su fallecimiento el 19 de mayo de 1939 en Estambul, y se relata su trayectoria profesional en Azerbaiyán y Turquía, así como sus obras; se trata en gran medida de una traducción del artículo en inglés."
  fr: "Article de Wikipédia en arabe sur Ahmet Ağaoğlu; il indique sa naissance en décembre 1869 à Shusha et sa mort le 19 mai 1939 à Istanbul, et relate sa carrière en Azerbaïdjan et en Turquie ainsi que ses œuvres; il s’agit en grande partie d’une traduction de l’article anglais."
  ur: "احمد Ağaoğlu پر عربی ویکیپیڈیا مضمون؛ یہ دسمبر 1869 میں شوشا میں ان کی پیدائش اور 19 مئی 1939 کو استنبول میں ان کی موت، اور آذربائیجان اور ترکی میں ان کے کیریئر اور ان کے کاموں کا ذکر کرتا ہے۔ یہ زیادہ تر انگریزی مضمون کا ترجمہ ہے۔"
