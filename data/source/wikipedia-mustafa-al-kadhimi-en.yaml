summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى الكاظمي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في متنها 1 كانون الثاني 1964 وفي صندوقها 31 كانون الثاني 1964 بالكاظمية في بغداد، وهي قراءة متناقضة داخليًا تستند إلى قطعة واحدة عنوانها سؤال عن كونه سنيًا أو شيعيًا، ولا تسمّي انتماءً دينيًا له في أي موضع من نصها."
  en: "English Wikipedia article on Mustafa Al-Kadhimi; used for entity facts only. Its lead gives his birth as 1 January 1964 and its infobox as 31 January 1964, at Kadhimiya, Baghdad — an internally inconsistent reading resting on a single cited piece whose headline asks whether he is Sunni or Shia, a question the article itself nowhere answers. It gives his premiership 2020–2022 and names no religious affiliation for him in text, infobox or categories."
