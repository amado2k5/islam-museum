summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى الكاظمي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في متنها 1 كانون الثاني 1964 وفي صندوقها 31 كانون الثاني 1964 بالكاظمية في بغداد، وهي قراءة متناقضة داخليًا تستند إلى قطعة واحدة عنوانها سؤال عن كونه سنيًا أو شيعيًا، ولا تسمّي انتماءً دينيًا له في أي موضع من نصها."
  en: "English Wikipedia article on Mustafa Al-Kadhimi; used for entity facts only. Its lead gives his birth as 1 January 1964 and its infobox as 31 January 1964, at Kadhimiya, Baghdad — an internally inconsistent reading resting on a single cited piece whose headline asks whether he is Sunni or Shia, a question the article itself nowhere answers. It gives his premiership 2020–2022 and names no religious affiliation for him in text, infobox or categories."
  es: "Artículo de Wikipedia en inglés sobre Mustafa Al-Kadhimi; utilizado únicamente para datos sobre la persona. Su introducción indica que nació el 1 de enero de 1964 y su ficha informativa el 31 de enero de 1964 en Kadhimiya, Bagdad; una lectura internamente inconsistente basada en un único artículo citado cuyo titular pregunta si es sunita o chiita, una pregunta que el artículo en sí no responde en ningún momento. Indica que fue primer ministro entre 2020 y 2022 y no menciona su afiliación religiosa en el texto, la ficha informativa ni las categorías."
  fr: "L'article de Wikipédia en anglais sur Mustafa Al-Kadhimi, utilisé uniquement pour les informations le concernant, indique sa date de naissance au 1er janvier 1964 et sa fiche descriptive au 31 janvier 1964 à Kadhimiya, Bagdad. Cette incohérence repose sur une seule citation dont le titre demande s'il est sunnite ou chiite, question à laquelle l'article lui-même ne répond nulle part. Il mentionne son mandat de Premier ministre de 2020 à 2022 et ne précise aucune appartenance religieuse, ni dans le texte, ni dans la fiche descriptive, ni dans les catégories."
  ur: "مصطفی الکاظمی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ اس کی پیدائش 1 جنوری 1964 اور اس کا معلوماتی خانہ 31 جنوری 1964 کو کادھیمیہ، بغداد میں ہوتا ہے - ایک داخلی طور پر متضاد پڑھنا جس کا ایک حوالہ دیا گیا حصہ ہے جس کی سرخی یہ پوچھتی ہے کہ آیا وہ سنی ہے یا شیعہ، اس سوال کا جواب خود مضمون میں کہیں نہیں ملتا۔ یہ اسے 2020-2022 کی پریمیئر شپ دیتا ہے اور متن، معلوماتی باکس یا زمروں میں اس کے لیے کوئی مذہبی وابستگی کا نام نہیں دیتا ہے۔"
  tr: "Mustafa Al-Kadhimi hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Doğumu gövdesinde 1 Ocak 1964, kutuda ise 31 Ocak 1964, Bağdat'ın El-Kazimiye kentinde verilmiştir. Bu, \"Sünni mi yoksa Şii mi olduğu Sorusu\" başlıklı tek bir makaleye dayanan içsel çelişkili bir okumadır ve metinde ona herhangi bir dini aidiyeti belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Mustafa Al-Kadhimi hanya digunakan untuk fakta entitas tersebut. Kelahirannya tercantum dalam isi artikel tersebut sebagai 1 Januari 1964, dan dalam kotaknya sebagai 31 Januari 1964, di Al-Kadhimiya, Baghdad. Ini adalah pembacaan yang secara internal bertentangan berdasarkan satu karya berjudul \"Pertanyaan apakah dia Sunni atau Syiah,\" dan tidak menyebutkan afiliasi agama apapun kepadanya di seluruh teks."
