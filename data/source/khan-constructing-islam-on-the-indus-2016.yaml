  ar: "دراسة حسن علي خان الأكاديمية عن التاريخ المادي للطريقة السهروردية في وادي السند (1200–1500)، وفي فصلها الثالث «الطريقة السهروردية في أوج» معالجة لجلال الدين سرخ بوش البخاري وحفيده مخدوم جهانيان جهانكشت وانتسابهما إلى السهروردية."
  en: "Hasan Ali Khan's scholarly study of the material history of the Suhrawardi Sufi order in the Indus valley (1200–1500); its third chapter, 'The Suhrawardi Order in Uch', treats Jalaluddin Surkh-Posh Bukhari and his grandson Makhdum-i Jahaniyan Jahangasht and their initiation into the Suhrawardi order."
title: "Constructing Islam on the Indus: The Material History of the Suhrawardi Sufi Order, 1200–1500 AD"
