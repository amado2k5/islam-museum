reliability_note: "Peer-reviewed scholarly monograph (ISBN 978-1-107-06290-0), adapted from the author's SOAS doctorate on the Suhrawardi order in Multan and Uch. Chapter 3 (pp. 96–119) was read in a retrieved Cambridge Core copy: it states that Surkhposh was born in 1198 in Bukhara, migrated to Multan in 1237 and was there initiated into the Suhrawardi order and appointed a deputy, and that his grandson Jahangasht — born at Uch on 9 February 1308 — was reportedly initiated into the Suhrawardi order by Shah Rukn-e-Alam. The chapter is used for the two men's Suhrawardi initiation and mastership, which it attests as their own, and for the 1198 birth variant of Surkhposh."
