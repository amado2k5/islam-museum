  ar: "مقالة ويكيبيديا الإنجليزية عن نسيم حميد؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته في وزن الريشة (1992–2002) وألقابه العالمية وخسارته الوحيدة أمام ماركو أنطونيو باريرا، ودخوله قاعة مشاهير الملاكمة الدولية سنة 2015، وإدانته بالقيادة الخطرة سنة 2006."
  en: "English Wikipedia article on Naseem Hamed; used for entity facts only. It recounts his featherweight career (1992–2002), his world titles and single loss to Marco Antonio Barrera, his 2015 induction into the International Boxing Hall of Fame, and his 2006 dangerous-driving conviction."
  es: "Artículo de la Wikipedia en inglés sobre Naseem Hamed; utilizado únicamente para obtener información sobre la persona. Narra su trayectoria en la categoría de peso pluma (1992-2002), sus títulos mundiales y su única derrota ante Marco Antonio Barrera, su ingreso en el Salón de la Fama del Boxeo Internacional en 2015 y su condena por conducción temeraria en 2006."
  fr: "Article de Wikipédia en anglais sur Naseem Hamed; utilisé uniquement à des fins d’information sur l’entité. Il retrace sa carrière chez les poids plumes (1992-2002), ses titres mondiaux et sa seule défaite contre Marco Antonio Barrera, son intronisation au Temple de la renommée internationale de la boxe en 2015 et sa condamnation pour conduite dangereuse en 2006."
  ur: "نسیم حمید پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کے فیدر ویٹ کیریئر (1992–2002)، اس کے عالمی ٹائٹل اور مارکو انتونیو بیریرا سے سنگل ہار، انٹرنیشنل باکسنگ ہال آف فیم میں اس کی 2015 میں شمولیت، اور 2006 میں خطرناک ڈرائیونگ کی سزا کا ذکر ہے۔"
