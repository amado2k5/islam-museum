reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, including the record-summary template in the article's wikitext (36 wins, 31 by knockout, 5 on points; 1 loss, on points). It gives Hamed as born on 12 February 1974 in Sheffield; WBO featherweight champion in 1995 (Steve Robinson), IBF champion in 1997 (Tom Johnson), WBC champion in 1999 (César Soto), beaten by Marco Antonio Barrera in 2001, and a final bout against Manuel Calvo on 18 May 2002 watched by 11 million people on ITV. Its personal-life section states: 'Hamed is a Muslim, and frequently recited the takbir out loud before his fights', and quotes Sean Ingle calling him 'a proud Muslim'; it also records his 1998 marriage to Eleasha Elphinstone, who had converted to Islam. It names no school for him. It also records his 2006 conviction for dangerous driving (a 15-month sentence, of which he served 16 weeks) and the removal of his MBE."
