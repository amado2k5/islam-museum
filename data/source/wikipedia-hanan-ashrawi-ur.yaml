summary:
  ar: "مقالة ويكيبيديا الأردية عن حنان عشراوي؛ تُستخدم لوقائع الكيان فقط. توافق على الولادة في نابلس في 8 أكتوبر 1946 لأبوين فلسطينيين عيسائيين ⁦(مسيحيين)⁩ وعلى أسرتها ومسيرتها، وهي بذلك تشهد لمسيحية الأسرة لا لانتمائها هي."
  en: "Urdu Wikipedia article on Hanan Ashrawi; used for entity facts only. It agrees on her birth in Nablus on 8 October 1946 to Palestinian Christian parents and on her family and career; it attests her family's Christianity, not her own affiliation."
  es: "Artículo de Wikipedia en urdu sobre Hanan Ashrawi; se utiliza únicamente para obtener información sobre la persona. Confirma su nacimiento en Nablus el 8 de octubre de 1946, de padres cristianos palestinos, así como su familia y trayectoria profesional; atestigua la fe cristiana de su familia, no la suya propia."
  fr: "Article de Wikipédia en ourdou sur Hanan Ashrawi; utilisé uniquement pour des informations sur l'entité. Il confirme sa naissance à Naplouse le 8 octobre 1946 de parents chrétiens palestiniens et décrit sa famille et sa carrière; il atteste de la foi chrétienne de sa famille, et non de son appartenance religieuse personnelle."
  ur: "حنان اشراوی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 8 اکتوبر 1946 کو نابلس میں فلسطینی عیسائی والدین کے ہاں اس کی پیدائش اور اس کے خاندان اور کیریئر پر متفق ہے۔ یہ اس کے خاندان کی عیسائیت کی تصدیق کرتا ہے، نہ کہ اس کی اپنی وابستگی۔"
  tr: "Hanan Ashrawi hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 8 Ekim 1946'da Filistinli Hristiyan ebeveynlerin çocuğu olarak Nablus'ta doğmayı kabul eder; böylece ailesinin Hristiyanlığını kanıtlar, kendi aidiyetinden ziyade."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Hanan Ashrawi; digunakan hanya untuk fakta entitas. Dia setuju untuk lahir di Nablus pada 8 Oktober 1946, dari orang tua Kristen Palestina, dari keluarga dan kariernya, sehingga membuktikan kekristenan keluarga daripada afiliasinya sendiri."
