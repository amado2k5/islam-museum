  ur: "کمیونٹی میں ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظرثانی پر مکمل طور پر بازیافت کیا گیا؛ یہ 30 جنوری 1999 کو اس کی پیدائش، دیر البلاح کیمپ میں اس کی پرورش، اس کی UNRWA کی ملازمت اور الازہر یونیورسٹی کی ڈگری، غزہ جنگ کی اس کی دستاویزات، اور اس کے اعزازات ⁦(GQ Middle East Man of the Year 2023؛ ٹائم 100, 2024؛ 2024 کا نوبل امن انعام)⁩۔ اس میں کوئی مذہبی مواد نہیں ہے۔"
