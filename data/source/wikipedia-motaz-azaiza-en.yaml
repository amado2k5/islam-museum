  ar: "مقال موسوعي عن معتز عزايزة ⁦(مواليد 1999)⁩، المصور الصحفي الفلسطيني من غزة الذي وثّق الحرب على إنستغرام ونال جوائز دولية."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth on 30 January 1999, his upbringing in the Deir al-Balah camp, his UNRWA employment and Al-Azhar University degree, his documentation of the Gaza war, and his honours (GQ Middle East Man of the Year 2023; Time 100, 2024; a 2024 Nobel Peace Prize nomination). It carries no religion content."
  es: "Artículo de enciclopedia editado por la comunidad, recuperado íntegramente en la revisión indicada; en él se detallan su nacimiento el 30 de enero de 1999, su infancia en el campo de Deir al-Balah, su empleo en la UNRWA y su título universitario en la Universidad de Al-Azhar, su documentación de la guerra de Gaza y sus reconocimientos (Hombre del Año de Oriente Medio según GQ en 2023; Time 100, 2024; nominación al Premio Nobel de la Paz en 2024). No contiene contenido religioso."
