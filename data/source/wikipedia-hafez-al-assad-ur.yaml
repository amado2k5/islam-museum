summary:
  ar: "مقالة ويكيبيديا الأردية الموجزة عن حافظ الأسد؛ تُستخدم لوقائع الكيان فقط. توجز رئاسته سوريا حتى سنة 2000 وتصنّفه في مواليد 1930 ووفيات 2000؛ ولا تضيف شهادة دينية فوق ما في المقالتين الأخريين."
  en: "Urdu Wikipedia stub on Hafez al-Assad; used for entity facts only. It summarises his presidency of Syria until 2000 and files him among the 1930 births and 2000 deaths; it adds no religion attestation beyond the other articles."
  es: "Artículo breve de la Wikipedia en urdu sobre Hafez al-Assad; se utiliza únicamente para datos sobre la figura. Resume su presidencia de Siria hasta el año 2000 y lo incluye entre los nacidos en 1930 y los fallecidos en 2000; no añade ninguna información sobre su religión más allá de lo que ya se menciona en otros artículos."
  fr: "Ébauche de l'article Wikipédia en ourdou sur Hafez al-Assad; utilisée uniquement pour les informations factuelles. Elle résume sa présidence de la Syrie jusqu'en 2000 et le classe parmi les naissances de 1930 et les décès de 2000; elle n'ajoute aucune mention de religion par rapport aux autres articles."
  ur: "حافظ الاسد پر اردو ویکیپیڈیا کا سٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 2000 تک شام کی ان کی صدارت کا خلاصہ کرتا ہے اور اسے 1930 کی پیدائش اور 2000 اموات میں شامل کرتا ہے۔ یہ دوسرے مضامین کے علاوہ کسی مذہب کی تصدیق کا اضافہ نہیں کرتا ہے۔"
  tr: "Hafez el-Esad hakkında kısa Urduca Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Suriye'deki başkanlığını 2000 yılına kadar özetler ve 1930 doğumlu ile 2000 yılında ölmüş olarak sınıflandırır; diğer iki makalede belirtilenlerin üzerine dini tanıklık eklemez."
  id: "Artikel singkat Wikipedia dalam bahasa Urdu tentang Hafez al-Assad hanya digunakan untuk fakta entitas tersebut. Artikel ini merangkum masa kepresidenannya di Suriah hingga tahun 2000 dan mengkategorikannya lahir pada tahun 1930 dan meninggal pada tahun 2000; artikel ini tidak menambahkan kesaksian agama di atas apa yang disebutkan dalam dua artikel lainnya."
