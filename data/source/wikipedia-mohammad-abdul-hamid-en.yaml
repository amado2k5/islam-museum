  ar: "مقالة ويكيبيديا الإنجليزية عن محمد عبد الحميد؛ تُستخدم لوقائع الكيان فقط. تروي مولده في كامالبور بميثامين في 1 يناير 1944، ومسيرته في رابطة عوامي نائبًا في البرلمان سبع مرات ورئيسًا لمجلس الأمة في 2001 و2009–2013، ورئاسته (2013–2023) أطول رئاسة في تاريخ بنغلاديش، وحياته بعد الرئاسة حتى 2026. لا يحمل صندوق معلوماتها حقلًا للديانة ولا يذكر متنها انتماءً دينيًا شخصيًا له."
  en: "English Wikipedia article on Mohammad Abdul Hamid; used for entity facts only. It recounts his birth at Kamalpur, Mithamain, on 1 January 1944, his Awami League career — seven terms as a member of parliament, speaker of the Jatiya Sangsad in 2001 and 2009–2013 — his presidency (2013–2023), the longest in Bangladesh's history, and his post-presidency years to 2026. Its infobox carries no religion field and its text states no personal religious affiliation for him."
