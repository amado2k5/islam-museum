summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد عبد الحميد؛ تُستخدم لوقائع الكيان فقط. تروي مولده في كامالبور بميثامين في 1 يناير 1944، ومسيرته في رابطة عوامي نائبًا في البرلمان سبع مرات ورئيسًا لمجلس الأمة في 2001 و2009–2013، ورئاسته (2013–2023) أطول رئاسة في تاريخ بنغلاديش، وحياته بعد الرئاسة حتى 2026. لا يحمل صندوق معلوماتها حقلًا للديانة ولا يذكر متنها انتماءً دينيًا شخصيًا له."
  en: "English Wikipedia article on Mohammad Abdul Hamid; used for entity facts only. It recounts his birth at Kamalpur, Mithamain, on 1 January 1944, his Awami League career — seven terms as a member of parliament, speaker of the Jatiya Sangsad in 2001 and 2009–2013 — his presidency (2013–2023), the longest in Bangladesh's history, and his post-presidency years to 2026. Its infobox carries no religion field and its text states no personal religious affiliation for him."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Abdul Hamid; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Kamalpur, Mithamain, el 1 de enero de 1944, su trayectoria en la Liga Awami —siete mandatos como miembro del parlamento, presidente del Jatiya Sangsad en 2001 y entre 2009 y 2013—, su presidencia (2013-2023), la más larga en la historia de Bangladesh, y sus años posteriores a la presidencia hasta 2026. Su ficha informativa no incluye información sobre religión y su texto no indica ninguna afiliación religiosa personal."
  fr: "L'article de Wikipédia en anglais consacré à Mohammad Abdul Hamid, utilisé uniquement pour les informations le concernant, retrace sa naissance à Kamalpur, dans le district de Mithamain, le 1er janvier 1944, son parcours au sein de la Ligue Awami (sept mandats de député, président du Jatiya Sangsad en 2001 et de 2009 à 2013), sa présidence (2013-2023), la plus longue de l'histoire du Bangladesh, et ses années après la présidence jusqu'en 2026. L'infobox ne comporte pas de champ « religion » et le texte ne mentionne aucune appartenance religieuse personnelle."
  ur: "محمد عبدالحمید پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں یکم جنوری 1944 کو کمال پور، مٹھامین میں ان کی پیدائش، ان کا عوامی لیگ کیریئر - سات بار رکن پارلیمنٹ، 2001 اور 2009-2013 میں قومی اسمبلی کے اسپیکر کی حیثیت سے - ان کی صدارت (2013-2023)، بنگلہ دیش کی تاریخ میں سب سے طویل، اور 2020 کے بعد کی کارپوریشن کے 20 سال تک کا ذکر ہے۔ کوئی مذہب کا شعبہ اور اس کے متن میں اس کے لیے کوئی ذاتی مذہبی وابستگی نہیں ہے۔"
