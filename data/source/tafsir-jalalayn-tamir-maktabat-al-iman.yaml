label:
  ar: "تفسير الجلالين — المحلي والسيوطي، راجعه وأعده للنشر د. محمد محمد تامر (مكتبة الإيمان، المنصورة)"
  en: "Tafsir al-Jalalayn — al-Mahalli and al-Suyuti, revised for publication by Dr Muhammad Muhammad Tamir (Maktabat al-Iman, Mansura)"
  ur: "تفسیر الجلالین — محلی اور سیوطی، نظرِ ثانی و اشاعت ڈاکٹر محمد محمد تامر (مکتبۃ الایمان، منصورہ)"
summary:
  ar: "طبعة مكتبة الإيمان بالمنصورة (أمام جامعة الأزهر) من تفسير الجلالين، راجعها وأعدها للنشر الدكتور محمد محمد تامر من كلية دار العلوم، قسم الشريعة؛ وفيها مقدمة للمراجع في التعريف بالكتاب وتقسيمه بين المؤلفين، وتنبيه على مواضع الأسماء والصفات، وترجمتان موجزتان للمحلي والسيوطي. لا تحمل الطبعة تاريخًا."
  en: "Maktabat al-Iman's printing (Mansura, opposite al-Azhar University) of Tafsir al-Jalalayn, revised and prepared for publication by Dr Muhammad Muhammad Tamir of the Faculty of Dar al-Ulum, Shari'a department; with the reviser's introduction on the book and its division between the two authors, a caution about the passages on the divine names and attributes, and short biographies of al-Mahalli and al-Suyuti. The printing is undated."
  ur: "مکتبۃ الایمان منصورہ (جامعہ ازہر کے سامنے) کا تفسیر الجلالین کا ایڈیشن، جس کی نظرِ ثانی اور اشاعت کی تیاری ڈاکٹر محمد محمد تامر، کلیہ دار العلوم، شعبۂ شریعت نے کی؛ اس میں کتاب اور مصنفین کے درمیان اس کی تقسیم پر مراجع کا مقدمہ، اسما و صفات کے مقامات پر ایک تنبیہ، اور محلی و سیوطی کے مختصر سوانح ہیں۔ ایڈیشن پر تاریخ درج نہیں۔"
