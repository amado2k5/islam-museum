label:
  ar: "تفسير الجلالين — المحلي والسيوطي، راجعه وأعده للنشر د. محمد محمد تامر ⁦(مكتبة الإيمان، المنصورة)⁩"
  en: "Tafsir al-Jalalayn — al-Mahalli and al-Suyuti, revised for publication by Dr Muhammad Muhammad Tamir (Maktabat al-Iman, Mansura)"
  ur: "تفسیر الجلالین — محلی اور سیوطی، نظرِ ثانی و اشاعت ڈاکٹر محمد محمد تامر ⁦(مکتبۃ الایمان، منصورہ)⁩"
summary:
  ar: "طبعة مكتبة الإيمان بالمنصورة ⁦(أمام جامعة الأزهر)⁩ من تفسير الجلالين، راجعها وأعدها للنشر الدكتور محمد محمد تامر من كلية دار العلوم، قسم الشريعة؛ وفيها مقدمة للمراجع في التعريف بالكتاب وتقسيمه بين المؤلفين، وتنبيه على مواضع الأسماء والصفات، وترجمتان موجزتان للمحلي والسيوطي. لا تحمل الطبعة تاريخًا."
  en: "Maktabat al-Iman's printing (Mansura, opposite al-Azhar University) of Tafsir al-Jalalayn, revised and prepared for publication by Dr Muhammad Muhammad Tamir of the Faculty of Dar al-Ulum, Shari'a department; with the reviser's introduction on the book and its division between the two authors, a caution about the passages on the divine names and attributes, and short biographies of al-Mahalli and al-Suyuti. The printing is undated."
  ur: "مکتبۃ الایمان منصورہ ⁦(جامعہ ازہر کے سامنے)⁩ کا تفسیر الجلالین کا ایڈیشن، جس کی نظرِ ثانی اور اشاعت کی تیاری ڈاکٹر محمد محمد تامر، کلیہ دار العلوم، شعبۂ شریعت نے کی؛ اس میں کتاب اور مصنفین کے درمیان اس کی تقسیم پر مراجع کا مقدمہ، اسما و صفات کے مقامات پر ایک تنبیہ، اور محلی و سیوطی کے مختصر سوانح ہیں۔ ایڈیشن پر تاریخ درج نہیں۔"
  es: "Edición impresa de Maktabat al-Iman (Mansura, frente a la Universidad de al-Azhar) del Tafsir al-Jalalayn, revisada y preparada para su publicación por el Dr. Muhammad Muhammad Tamir de la Facultad de Dar al-Ulum, departamento de Sharia; incluye una introducción del revisor sobre el libro y su división entre los dos autores, una advertencia sobre los pasajes relativos a los nombres y atributos divinos, y breves biografías de al-Mahalli y al-Suyuti. La edición no está fechada."
  fr: "Édition de Maktabat al-Iman (Mansoura, en face de l'université al-Azhar) du Tafsir al-Jalalayn, révisé et préparé pour publication par le Dr Muhammad Muhammad Tamir, de la faculté Dar al-Ulum, département de Charia; avec l'introduction du réviseur sur l'ouvrage et sa répartition entre les deux auteurs, une mise en garde concernant les passages relatifs aux noms et attributs divins, ainsi que de courtes biographies d'al-Mahalli et d'al-Suyuti. L'édition n'est pas datée."
  tr: "Tafsir Al-Jalalayn'ın Mansura'daki (El-Ezher Üniversitesi önünde) El-İman Kütüphanesi'nin baskısı, Dar Al-Uloom Fakültesi, Şeriat Bölümü'nden Dr. Muhammed Muhammed Tamer tarafından incelenip yayımlanmak üzere hazırlanmıştır; kitabı tanıtan referansların ve yazarlar arasında sınıflandırılmasının bir girişini, isim ve niteliklerin yerleşimlerine dair bir not ile El-Mahli ve El-Suyuti'nin iki kısa çevirisini içerir. Baskıda tarih belirtilmemektedir."
  id: "Edisi Perpustakaan Al-Iman di Mansoura (di depan Universitas Al-Azhar) dari Tafsir Al-Jalalayn, yang ditinjau dan dipersiapkan untuk publikasi oleh Dr. Muhammad Muhammad Tamer dari Fakultas Dar Al-Uloom, Departemen Syariah; edisi ini mencakup pengantar dengan referensi yang memperkenalkan buku dan klasifikasinya di antara para penulis, catatan tentang penempatan nama dan atribut, serta dua terjemahan singkat Al-Mahli dan Al-Suyuti. Edisi ini tidak mencantumkan tanggal."
