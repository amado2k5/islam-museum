  ar: "مقالة ويكيبيديا الأردية عن عبد الباري الثبيتي؛ تُستخدم لوقائع الكيان فقط. ترجمة للمقالة الإنجليزية: مولده سنة 1960 ⁦(1380هـ)⁩ بمكة، وإمامته ضيفاً للحرم وإمامته للمسجد النبوي من 1994؛ وصندوقها يعطي الدين الإسلام فقط وتصنّفه فئاتها في الحنابلة."
  en: "Urdu Wikipedia article on Abdul Bari Al-Thubaiti; used for entity facts only. A translation of the English article: birth in 1960 (1380 AH) at Mecca, the Haram guest imamate and the Prophet's Mosque imamate from 1994; its infobox gives religion Islam only and its categories file him among Hanbalis."
