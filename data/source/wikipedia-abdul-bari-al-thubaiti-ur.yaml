  fr: "Article Wikipédia en ourdou sur Abdul Bari Al-Thubaiti; utilisé uniquement pour les faits d’entité. L'article anglais: Né en 1960 (1380 AH) à La Mecque, l'imamat invité du Haram et l'imamat de la mosquée du Prophète à partir de 1994; Son Infobox donne uniquement la religion Islam et ses catégories le classent parmi les Hanbalis."
