summary:
  ar: "مقالة ويكيبيديا العربية عن إسماعيل صبري يعقوب ⁦(وُلد 1960)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 18 يناير 1960 وعضويته في البرلمان عن بيرا منذ 2004، ورئاسته التاسعة لوزراء ماليزيا من أغسطس 2021 حتى انتخابات نوفمبر 2022."
  en: "Arabic Wikipedia article on Ismail Sabri Yaakob (born 1960); used for entity facts only. It gives his birth on 18 January 1960, his Bera parliamentary seat held since 2004, and his tenure as Malaysia's ninth prime minister from August 2021 until the November 2022 election."
  es: "Artículo en árabe de la Wikipedia sobre Ismail Sabri Yaakob (nacido en 1960); utilizado únicamente para datos sobre la persona. Indica su fecha de nacimiento, el 18 de enero de 1960, su escaño parlamentario por Bera, que ocupó desde 2004, y su mandato como noveno primer ministro de Malasia desde agosto de 2021 hasta las elecciones de noviembre de 2022."
  fr: "Article de Wikipédia en arabe sur Ismail Sabri Yaakob (né en 1960); utilisé uniquement à des fins d'information sur l'entité. Il indique sa date de naissance, le 18 janvier 1960, son siège de député de Bera depuis 2004 et son mandat de neuvième Premier ministre de Malaisie, d'août 2021 jusqu'aux élections de novembre 2022."
