  ar: "مقالة ويكيبيديا الإنجليزية عن سوريا جوانغرونغروانغكيت (وُلد 1954)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 10 ديسمبر 1954 في بانكوك في عائلة تايلندية صينية، ووزارتيه المتكررتين للصناعة والنقل، ونيابته لرئاسة الوزراء، وتوليه رئاسة الوزراء بالوكالة في 1–3 يوليو 2025. لا تحمل أي محتوى ديني."
  en: "English Wikipedia article on Suriya Juangroongruangkit (born 1954); used for entity facts only. It gives his birth on 10 December 1954 in Bangkok into a Thai Chinese family, his repeated industry and transport portfolios, his deputy premiership, and his acting premiership of 1–3 July 2025. It carries no religion content at all."
