summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سوريا جوانغرونغروانغكيت ⁦(وُلد 1954)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 10 ديسمبر 1954 في بانكوك في عائلة تايلندية صينية، ووزارتيه المتكررتين للصناعة والنقل، ونيابته لرئاسة الوزراء، وتوليه رئاسة الوزراء بالوكالة في 1–3 يوليو 2025. لا تحمل أي محتوى ديني."
  en: "English Wikipedia article on Suriya Juangroongruangkit (born 1954); used for entity facts only. It gives his birth on 10 December 1954 in Bangkok into a Thai Chinese family, his repeated industry and transport portfolios, his deputy premiership, and his acting premiership of 1–3 July 2025. It carries no religion content at all."
  es: "Artículo de la Wikipedia en inglés sobre Suriya Juangroongruangkit (nacido en 1954); utilizado únicamente para datos biográficos. Indica su nacimiento el 10 de diciembre de 1954 en Bangkok, en el seno de una familia chino-tailandesa, sus reiteradas carteras de industria y transporte, su viceprimer ministro y su mandato como primer ministro interino del 1 al 3 de julio de 2025. No contiene ningún contenido religioso."
  fr: "Article Wikipédia en anglais sur Suriya Juangroongruangkit (né en 1954); utilisé uniquement à titre informatif. Il mentionne sa naissance le 10 décembre 1954 à Bangkok, au sein d’une famille sino-thaïlandaise, ses mandats successifs aux ministères de l’Industrie et des Transports, son poste de vice-Premier ministre et son intérim de Premier ministre du 1er au 3 juillet 2025. Il ne contient aucune référence à la religion."
  ur: "سوریہ جوانگرونگروانگ کٹ ⁦(پیدائش 1954)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 10 دسمبر 1954 کو بنکاک میں ایک تھائی چینی خاندان میں اس کی پیدائش، اس کی بار بار صنعت اور ٹرانسپورٹ کے محکمے، اس کی نائب وزیراعظم اور 1-3 جولائی 2025 کی ان کی قائم مقام پریمیئر شپ۔ اس میں مذہب کا کوئی مواد نہیں ہے۔"
