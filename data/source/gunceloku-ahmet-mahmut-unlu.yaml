  ar: "ملف تعريفي تركي بأحمد محمود أونلو في موقع غونجل أوكو؛ يُستخدم مصدرا ثانيا مستقلا على تدرّبه الشخصي على يد محمود أوستا أوسمان أوغلو، أحد كبار الطريقة النقشبندية."
  en: "Turkish biographical profile of Ahmet Mahmut Ünlü on the Güncel Oku website; used as a second independent text for his personal training under Mahmut Ustaosmanoğlu, a leading figure of the Naqshbandi order."
