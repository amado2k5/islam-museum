  ur: "Güncel Oku ویب سائٹ پر احمد محمود Ünlü کی ترک سوانحی پروفائل؛ نقشبندی آرڈر کی ایک سرکردہ شخصیت، محمود استاؤسمان اوغلو کے تحت اپنی ذاتی تربیت کے لیے دوسرے آزاد متن کے طور پر استعمال کیا گیا۔"
  tr: "Ahmet Mahmud Onlu'nun Güngel Oku web sitesindeki Türk profili; önde gelen Nakşibendi tarikatlarından Mahmud Usta Osmanoğlu'nun kişisel eğitimine dayanan ikincil bağımsız bir kaynak kullanılarak."
