summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بواكاو بانشاميك؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده باسم سومبات بانشاميك في سامرونغ تاب بمحافظة سورين في 8 مايو 1982، ولقبيه «اللوتس الأبيض» و«الذهب الأسود»، وبطولتيه في كي-وان ماكس 2004 و2006، وسجله 246 انتصاراً، ورسوه كسفير للمواي تاي. ولا تذكر ديانته في متنها."
  en: "English Wikipedia article on Buakaw Banchamek; used for entity facts only. It gives his birth as Sombat Banchamek in Samrong Thap, Surin, on 8 May 1982, his ring names The White Lotus and Black Gold, his K-1 World MAX titles of 2004 and 2006, his record of 246 wins, and his ambassador role for Muay Thai. It makes no statement of his religion in its text."
  es: "Artículo de la Wikipedia en inglés sobre Buakaw Banchamek; utilizado únicamente para datos sobre la persona. Indica que nació como Sombat Banchamek en Samrong Thap, Surin, el 8 de mayo de 1982, sus nombres artísticos The White Lotus y Black Gold, sus títulos mundiales K-1 MAX de 2004 y 2006, su récord de 246 victorias y su papel como embajador del Muay Thai. No menciona su religión en el texto."
  fr: "Article Wikipédia en anglais sur Buakaw Banchamek; utilisé uniquement pour les informations le concernant. On y apprend sa naissance sous le nom de Sombat Banchamek à Samrong Thap, Surin, le 8 mai 1982, ses noms de ring « Le Lotus Blanc » et « L'Or Noir », ses titres de champion du monde K-1 MAX de 2004 et 2006, son palmarès de 246 victoires et son rôle d'ambassadeur du Muay Thaï. L'article ne mentionne pas sa religion."
  ur: "Buakaw Banchamek پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے سمرونگ تھاپ، سورن میں 8 مئی 1982 کو سومبٹ بنچامیک کے طور پر اس کی پیدائش کی، اس کی انگوٹھی کا نام The White Lotus and Black Gold، اس کے K-1 ورلڈ MAX ٹائٹل 2004 اور 2006، اس کا 246 جیت کا ریکارڈ، اور موئے تھائی کے لیے اس کا سفیر کا کردار۔ اس کے متن میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Puakau Panchamik hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılır. 8 Mayıs 1982'de Surin Eyaleti, Samrong Tap'ta Sombat Panchamik adı verildi ve 'Beyaz Lotus' ile 'Siyah Altın' unvanları verildi; ayrıca 2004 ve 2006'da iki K-1 Max şampiyonluğu kazandı; 246 zafer ve bir Muay Thai elçisi oldu. Dini içeriğinde belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Puakau Panchamik; digunakan hanya untuk fakta entitas. Ia diberi nama Sombat Panchamik di Samrong Tap, Provinsi Surin, pada 8 Mei 1982, dan diberi gelar 'White Lotus' dan 'Black Gold', serta dua gelar K-1 Max pada tahun 2004 dan 2006, dengan 246 kemenangan dan gelar duta Muay Thai. Agamanya tidak disebutkan dalam kontennya."
