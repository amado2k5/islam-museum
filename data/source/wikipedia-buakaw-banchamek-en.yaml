reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The infobox gives his birth name Sombat Banchamek, his birth on 8 May 1982 at Ban Song Nong, Samrong Thap, Surin, his record of 246 wins (74 by knockout), 25 losses and 14 draws, his teams Por. Pramuk Gym (1997–2012) and Banchamek Gym, and lists Superbon among his students. The text records his Omnoi Stadium featherweight and lightweight titles, the 2002 Toyota Marathon, the K-1 World MAX titles of 2004 and 2006 (the first man to win it twice), the Shoot Boxing S-Cup of 2010, the Thai Fight tournament titles of 2011 and 2012, his 2023 Guinness-record Wai Kru performance, his acting roles and his Buakaw Village project in Mae Taeng, Chiang Mai (founded April 2018). The article's text makes no statement of his religion; it files him only in the category Thai Theravada Buddhists, which is a filing, not attestation."
