  ar: "مقالة ويكيبيديا الإنجليزية عن بواكاو بانشاميك؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده باسم سومبات بانشاميك في سامرونغ تاب بمحافظة سورين في 8 مايو 1982، ولقبيه «اللوتس الأبيض» و«الذهب الأسود»، وبطولتيه في كي-وان ماكس 2004 و2006، وسجله 246 انتصاراً، ورسوه كسفير للمواي تاي. ولا تذكر ديانته في متنها."
  en: "English Wikipedia article on Buakaw Banchamek; used for entity facts only. It gives his birth as Sombat Banchamek in Samrong Thap, Surin, on 8 May 1982, his ring names The White Lotus and Black Gold, his K-1 World MAX titles of 2004 and 2006, his record of 246 wins, and his ambassador role for Muay Thai. It makes no statement of his religion in its text."
