label: { en: "Setia & Iqbal (2022) — Social-media adaptation of Indonesian religious organisations: the NU Channel case" }
summary:
  ar: "مقالة أكاديمية ⁦(مجلة JISPO، 2022)⁩ تدرس قناة إن يو على يوتيوب بوصفها قناة جمعية نهضة العلماء، وتبيّن أن الجمعية تبنّت يوتيوب وسيلةً للدراسات الدينية عبر الإنترنت على هذه القناة."
  en: "A 2022 journal article (JISPO Jurnal Ilmu Sosial dan Ilmu Politik) studying Nahdlatul Ulama's YouTube channel, NU Channel: the organisation adopted YouTube as a new medium for conveying its religious views, with religious studies conducted online on NU Channel."
  ur: "ایک تعلیمی جریدے ⁦(JISPO، 2022ء)⁩ کا مضمون جو نہضۃ العلماء کے یوٹیوب چینل این یو چینل کا مطالعہ کرتا ہے: تنظیم نے اپنے مذہبی خیالات کی ترسیل کے لیے یوٹیوب کو نیا ذریعہ بنایا اور اس چینل پر آن لائن دینی مطالعات پیش کیے۔"
  es: "Un artículo de revista de 2022 (JISPO Jurnal Ilmu Sosial dan Ilmu Politik) que estudia el canal de YouTube de Nahdlatul Ulama, NU Channel: la organización adoptó YouTube como un nuevo medio para transmitir sus puntos de vista religiosos, con estudios religiosos realizados en línea en NU Channel."
  fr: "Un article de revue de 2022 (JISPO Jurnal Ilmu Sosial dan Ilmu Politik) étudiant la chaîne YouTube de Nahdlatul Ulama, NU Channel: l'organisation a adopté YouTube comme nouveau moyen de transmettre ses opinions religieuses, avec des études religieuses menées en ligne sur NU Channel."
  tr: "Akademik bir makale (JISPO Journal, 2022), NU YouTube'da Nahdlatul Ulama Derneği'nin bir kanalı olarak incelenmekte ve derneğin bu kanalda dini çalışmalar için YouTube'u benimsediğini göstermektedir."
  id: "Sebuah artikel akademik (JISPO Journal, 2022) mempelajari NU di YouTube sebagai saluran dari Asosiasi Ulama Nahdlatul, dan menunjukkan bahwa asosiasi tersebut telah mengadopsi YouTube sebagai media studi agama secara daring di saluran ini."
title: "Adaptasi Media Sosial oleh Organisasi Keagamaan di Indonesia: Studi Kanal YouTube Nahdlatul Ulama, NU Channel"
author: [{ family: "Setia", given: "P." }, { family: "Iqbal", given: "A. M." }]
issued: { "date-parts": [[2022]] }
publisher: "JISPO Jurnal Ilmu Sosial dan Ilmu Politik 11(2), 359-378 (2022)"
URL: "https://doi.org/10.15575/jispo.v11i2.14572"
language: id
reliability_note: "Peer-reviewed journal article (published 6 February 2022) based on online observation of NU Channel. It argues that the assumption that Nahdlatul Ulama tends to be traditionalist and conservative towards technological developments is incorrect: NU is adaptive to social media, as seen in its adoption of YouTube as a new medium of religious studies conducted online on NU Channel. Read via its journal page on 15 November 2026."
