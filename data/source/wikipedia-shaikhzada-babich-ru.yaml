summary:
  ar: "مقالة ويكيبيديا الروسية عن شايخزاده بابيتش؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 14 يناير (بالقديم 2 يناير) 1895 في أسيانوفو، وأباه الملّا محمد زكير بابيتشيف ملّا محلّة أسيانوفو ومدير مدرستها، ونشاطه في الحكومة الباشكيرية واتحاد الشباب «تولقن»، وقتله في 28 مارس 1919 في بريوبراجينسكويه (يلاير اليوم) ودفنه في قبر على أطراف يلاير؛ ولا تسمي له دينا ولا مذهبا."
  en: "Russian Wikipedia article on Shaikhzada Babich; used for entity facts only. It dual-dates his birth 14 January (old style 2 January) 1895 at Asyanovo, names his father the mullah Mukhametzakir Babichev, mullah of the Asyanovo mahalla and head of its madrasa, records his work in the Bashkir government and the Tulqın youth union, his murder on 28 March 1919 at Preobrazhenskoye (now Zilair) and his burial in a grave on the outskirts of Zilair; it names no religion or school for him."
