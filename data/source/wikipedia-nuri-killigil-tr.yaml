reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. Its infobox gives his birth in 1889 at Manastır (Bitola), agreeing with the English article and with one of Wikidata's two birth values; its lead and categories, however, give 1890 and Istanbul — an internal contradiction recorded in this museum record's birth note, with 1889 at Manastır followed. It agrees on his death on 2 March 1949 in the explosion of his Sütlüce factory, names his byname 'Bakü Fatihi' (Conqueror of Baku), and gives his burial at the Edirnekapı Martyrs' Cemetery, Istanbul. Neither its infobox nor its text states any religion for him."
