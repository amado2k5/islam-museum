label:
  ar: "قاضي القضاة — موسوعة TDV الإسلامية ⁦(أوزن)⁩"
  en: "KĀDILKUDÂT (qadi al-qudat, chief judge) — TDV İslâm Ansiklopedisi (Şükrü Özen)"
summary:
  ar: "مدخل «قاضي القضاة» في موسوعة TDV الإسلامية: نشأة المنصب في بغداد العباسية بتعيين أبي يوسف، نمو صلاحياته من شرف المحض إلى رأس الجهاز القضائي، نظيره المغربي قاضي الجماعة، وقاضي القضاة في الفاطميين والأيوبيين والمماليك وعلاقته بالقاضي عسكر العثماني."
  en: "The TDV İslâm Ansiklopedisi entry on the qadi al-qudat: the office's beginnings in Abbasid Baghdad with Abu Yusuf's appointment, the growth of its powers from an honorary title to head of the judiciary, the Maghribi counterpart qadi al-jama'a, the office under the Fatimids, Ayyubids and Mamluks, and its relation to the Ottoman kazasker."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el qadi al-qudat: los inicios del cargo en el Bagdad abasí con el nombramiento de Abu Yusuf, el crecimiento de sus poderes desde un título honorífico hasta jefe del poder judicial, su contraparte magrebí, el qadi al-jama'a, el cargo bajo los fatimíes, ayubíes y mamelucos, y su relación con el kazasker otomano."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le qadi al-qudat: les débuts de cette fonction dans le Bagdad abbasside avec la nomination d'Abu Yusuf, la croissance de ses pouvoirs d'un titre honorifique à chef du pouvoir judiciaire, son homologue maghrébin qadi al-jama'a, la fonction sous les Fatimides, les Ayyoubides et les Mamelouks, et sa relation avec le kazasker ottoman."
  ur: "قضا القدات پر TDV ISLAm Ansiklopedisi کا اندراج: ابو یوسف کی تقرری کے ساتھ عباسی بغداد میں دفتر کا آغاز، اس کے اختیارات میں ایک اعزازی لقب سے عدلیہ کے سربراہ تک کا اضافہ، مغربی ہم منصب قادی الجماعہ، اس کے دفتر اور فسطائیت کے ماتحت اس کا دفتر۔ عثمانی قازق۔"
  tr: "TDV İslami Ansiklopedisi'nde 'Baş Yargıç'a Giriş: Abbasi Bağdat'taki pozisyonun yükselişi, Ebu Yusuf'un atanmasıyla saf onurdan yargı başkanına, Fas muadili olarak cemaat yargıcı ve Fatımılar, Eyyubiler ve Memlükler başyargıcı olarak yükselmesi ve Hakim Esker-Osmanlı ile ilişkisi."
  id: "Pengantar tentang 'Ketua Hakim' dalam Ensiklopedia Islam TDV: Munculnya posisi di Baghdad Abbasiyah dengan pengangkatan Abu Yusuf, kenaikan kekuasaannya dari kehormatan murni menjadi kepala peradilan, rekan Maroko sebagai hakim komunitas, dan sebagai ketua hakim di Fatimiyah, Ayyubid, dan Mamluk, serta hubungannya dengan Hakim Askar al-Ottoman."
