reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by revision id with content verified identical. The article has no religion field and names no religion or school for him anywhere in its text. It gives the birth as Nicosia in 1833 — while the Ankara doctoral thesis it cites for his early life is titled 'Sadrazam Kıbrıslı Mehmed Kamil Paşa: 1832-1913', putting 1832 in the cited scholarship — the four grand vizierates (25 September 1885 – 4 September 1891; 2 October – 7 November 1895; 5 August 1908 – 14 February 1909; 29 October 1912 – 23 January 1913), the forced resignation in the raid on the Sublime Porte, and the death at Nicosia on 14 November 1913."
