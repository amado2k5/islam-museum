reliability_note: "Structured dates, places and identifiers only (Wikipedia broad rule, AGENTS.md). Consulted on 26 October 2026. Item revision 2557869963 of 17 October 2026. It gives birth on 22 November 1881 — one day earlier than the 23 November given by both articles' leads and infoboxes, though both articles' death templates also compute from the 22nd — referenced to encyclopaedia authority files, at Istanbul (Q406), and death on 4 August 1922 in the Baljuvon area (Q68682), agreeing with the articles on the day. Its burial value is the Monument of Liberty, Istanbul (Q320876), agreeing with both articles. Its only religion value is Sunni Islam (Q483654), with a single URL reference (P854): the only source consulted that names a school for him at all, and one structured-data value, which under the museum's two-source rule cannot settle a school."
