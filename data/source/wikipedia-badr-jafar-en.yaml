  ar: "مقالة ويكيبيديا الإنجليزية عن بدر جعفر، الرئيس التنفيذي للهلال للمشاريع ورئيس نفط الهلال؛ تذكر مولده سنة 1979 ونشأته في الشارقة وتعليمه في إيتون وكامبريدج، ومبادرة بيرل التي أطلقها سنة 2010، وتعيينه مبعوثًا خاصًا للإمارات للأعمال والعمل الخيري سنة 2024."
  en: "English Wikipedia article on Badr Jafar, chief executive of Crescent Enterprises and president of Crescent Petroleum; it gives his 1979 birth and Sharjah upbringing, his Eton and Cambridge education, the Pearl Initiative he founded in 2010, and his appointment as the UAE's Special Envoy for Business and Philanthropy in 2024."
  es: "Artículo de la Wikipedia en inglés sobre Badr Jafar, director ejecutivo de Crescent Enterprises y presidente de Crescent Petroleum; en él se detalla su nacimiento en 1979 y su crianza en Sharjah, su educación en Eton y Cambridge, la Iniciativa Perla que fundó en 2010 y su nombramiento como Enviado Especial de los Emiratos Árabes Unidos para los Negocios y la Filantropía en 2024."
  fr: "L'article de Wikipédia en anglais sur Badr Jafar, directeur général de Crescent Enterprises et président de Crescent Petroleum, mentionne sa naissance en 1979 et son enfance à Sharjah, ses études à Eton et Cambridge, la Pearl Initiative qu'il a fondée en 2010 et sa nomination comme envoyé spécial des Émirats arabes unis pour les affaires et la philanthropie en 2024."
