reliability_note: "Scholarly encyclopedia entry, read in full on 1 November 2026 (web edition), and the anchor source for this record's dates and origin. It works critically through the biographical tradition: it shows that Taşköprizâde's 'ümerâ-i Ferâsiha' (commanders of the Varangians) was misread as 'Franks', so the converted-Frankish-amir father of the Shadharat-derived accounts is a transmission error, and it fixes the death at 885/1480 against the 886 of the older annals. In the text read it styles him 'Ottoman scholar and mufti' and treats his Dürerü'l-hükkâm as the judges' standard reference, but it does not name a legal school for him in so many words; the record's Hanafi settlement rests on the Arabic Wikipedia's lead text and the Shadharat heading, not on this entry. Its related-entry apparatus names Molla Yegân as his teacher."
