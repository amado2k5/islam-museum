label: { en: "MOLLA HÜSREV — TDV İslâm Ansiklopedisi" }
summary:
  ar: "مدخل «الملا خسرو» في موسوعة الإسلام التركية (TDV) بقلم فرحات كوجا ⁦(المجلد 30، 2005)⁩؛ أوفى ترجمة علمية له: أصله من وارساق المنطقة بين أماسيا وطوقات وسيفاس ومولده في قرية قرقين، وتصحيحه خطأ قراءة «أمراء الفراسخة» التي جعلت أباه في مصادر لاحقة فرنجياً أو رومياً، وكنيته في آخر «الدرر» ووثيقة بيع من أوائل 843هـ، ووفاته سنة 885هـ/1480م وهو مفتي إسطنبول ودفنه في تربة مدرسته ببورصة."
  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'MOLLA HÜSREV' by Ferhat Koca (vol. 30, 2005); the fullest scholarly biography — his Varsak origin in the Amasya-Tokat-Sivas region and birth in the village of Karkın, its correction of the Ferâsiha misreading that made his father a Frank or a Rum in later sources, his colophon at the end of the Dürer and a sale deed of early 843/1439 naming him Mehmed b. Ferâmurz b. Hoca Ali, and his death in 885/1480 while mufti of Istanbul, buried in the hazire of his Bursa madrasa."
  es: "La entrada 'MOLLA HÜSREV' de la TDV İslâm Ansiklopedisi (enciclopedia turca del Islam) de Ferhat Koca (vol. 30, 2005); la biografía académica más completa: su origen Varsak en la región de Amasya-Tokat-Sivas y su nacimiento en el pueblo de Karkın, su corrección de la lectura errónea de Ferâsiha que hizo que su padre fuera un franco o un rum en fuentes posteriores, su colofón al final del Dürer y una escritura de venta de principios de 843/1439 que lo nombra Mehmed b. Ferâmurz b. Hoca Ali, y su muerte en 885/1480 mientras era muftí de Estambul, enterrado en el hazire de su madrasa de Bursa."
  fr: "L'article « MOLLA HÜSREV » de Ferhat Koca (vol. 30, 2005) dans la TDV İslâm Ansiklopedisi (encyclopédie turque de l'Islam); la biographie savante la plus complète — son origine varsak dans la région d'Amasya-Tokat-Sivas et sa naissance dans le village de Karkın, la correction de la lecture erronée de Ferâsiha qui faisait de son père un Franc ou un Rum dans des sources ultérieures, son colophon à la fin du Dürer et un acte de vente du début de 843/1439 le nommant Mehmed b. Ferâmurz b. Hoca Ali, et sa mort en 885/1480 alors qu'il était mufti d'Istanbul, enterré dans le hazire de sa madrasa de Bursa."
  ur: "TDV İslâm Ansiklopedisi ⁦(ترک انسائیکلوپیڈیا آف اسلام)⁩ کا اندراج 'مولا حسریو' از فرحت کوکا ⁦(جلد 30، 2005)⁩؛ مکمل علمی سوانح عمری - اس کی ورسک کی ابتدا اماسیا-ٹوکاٹ-سیواس کے علاقے میں ہوئی اور کارکن گاؤں میں پیدائش، اس کی فریسیہا غلط فہمی کی تصحیح جس نے بعد کے ذرائع میں اس کے والد کو فرینک یا رم بنا دیا، Dürer کے آخر میں اس کا کولفون اور 8943/14 کے اوائل میں اسے فروخت کا عمل۔ Ferâmurz b. Hoca Ali، اور ان کی وفات 885/1480 میں استنبول کے مفتی، اپنے برسا مدرسہ کے حجرے میں دفن ہوئے۔"
