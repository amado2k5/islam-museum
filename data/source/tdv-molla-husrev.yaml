summary:
  ar: "مدخل «الملا خسرو» في موسوعة الإسلام التركية (TDV) بقلم فرحات كوجا (المجلد 30، 2005)؛ أوفى ترجمة علمية له: أصله من وارساق المنطقة بين أماسيا وطوقات وسيفاس ومولده في قرية قرقين، وتصحيحه خطأ قراءة «أمراء الفراسخة» التي جعلت أباه في مصادر لاحقة فرنجياً أو رومياً، وكنيته في آخر «الدرر» ووثيقة بيع من أوائل 843هـ، ووفاته سنة 885هـ/1480م وهو مفتي إسطنبول ودفنه في تربة مدرسته ببورصة."
  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'MOLLA HÜSREV' by Ferhat Koca (vol. 30, 2005); the fullest scholarly biography — his Varsak origin in the Amasya-Tokat-Sivas region and birth in the village of Karkın, its correction of the Ferâsiha misreading that made his father a Frank or a Rum in later sources, his colophon at the end of the Dürer and a sale deed of early 843/1439 naming him Mehmed b. Ferâmurz b. Hoca Ali, and his death in 885/1480 while mufti of Istanbul, buried in the hazire of his Bursa madrasa."
