summary:
  ar: "مقالة ويكيبيديا الروسية عن حمزة حكيم زاده نيازي (1889–1929)، الشاعر والمسرحي السوفييتي الأوزبكي ومؤسس الأدب السوفييتي الأوزبكي؛ تعطي مولده 22 فبراير 1889 بالتقويم اليولياني ولا تصفه بالإلحاد، وتسجل أن صورته السوفييتية طُعن فيها بعد الاستقلال حتى أُعلن «عدوًا للشعب الأوزبكي والإسلام»."
  en: "The Russian Wikipedia article on Hamza Hakimzade Niyazi (1889–1929), the Uzbek Soviet poet and playwright and founder of Uzbek Soviet literature; it gives his birth as 22 February 1889 in the Julian calendar, makes no atheist attestation, and records that his Soviet-era portrait has been contested since independence, to the point of his being declared 'an enemy of the Uzbek people and Islam'."
