reliability_note: "Peer-reviewed institute research brief (ISEAS – Yusof Ishak Institute; the author is a Visiting Senior Fellow at ISEAS and a Research Fellow at the Institute of the Malay World and Civilization, National University of Malaysia), based on ten months of observation (November 2023–September 2024) and follower interviews; the full text was also read in the issue PDF. Its follower figures are the study's own counts at the time of writing and are used only as dated audience figures. Its political readings are the author's analysis — for example the claim that Asma' Harun's content indirectly encourages support for a scholar-led party — and are recorded as attributed positions, never as the museum's findings. The harvest brief cited this material as 'ISEAS Perspective 2026/2 (13 January 2026)'; that number belongs to a different ISEAS piece by the same author, and the ustazah figures are from this 2025/81 issue, which is what is registered here."
