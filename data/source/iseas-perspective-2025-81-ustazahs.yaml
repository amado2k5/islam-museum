label: { en: "ISEAS Perspective 2025/81 — Malaysia's celebrity ustazahs (Asma' Harun, Norhafizah Musa)" }
summary:
  ar: "دراسة موجزة لمعهد ISEAS ⁦(بورسبكتيف 2025/81)⁩ بقلم محمد فايزال موسى، 29 أكتوبر 2025، عن القاعدة الجماهيرية على وسائل التواصل لداعيات ماليزيا المشهورات؛ فيها 1.1 مليون متابع لأسماء هارون ومليون متابع لنور حفيظة موسى على إنستغرام، وسيرتاهما وبرامجهما ومشروعاتهما التجارية والتعليمية ومواقفهما المعلنة."
  en: "ISEAS Perspective 2025/81 by Mohd Faizal Musa, 29 October 2025, a preliminary study of the social-media power base of Malaysia's celebrity ustazahs; it gives Asma' Harun 1.1 million and Norhafizah Musa 1 million Instagram followers, with their biographies, programmes, commercial and educational projects, and reported public positions."
  es: "ISEAS Perspective 2025/81, de Mohd Faizal Musa, 29 de octubre de 2025, es un estudio preliminar de la base de poder en las redes sociales de las ustazahs famosas de Malasia; otorga a Asma' Harun 1,1 millones de seguidores en Instagram y a Norhafizah Musa 1 millón, con sus biografías, programas, proyectos comerciales y educativos, y cargos públicos declarados."
  fr: "ISEAS Perspective 2025/81 par Mohd Faizal Musa, 29 octobre 2025, une étude préliminaire de la base de pouvoir des médias sociaux des oustazahs célèbres de Malaisie; elle donne à Asma' Harun 1,1 million et à Norhafizah Musa 1 million d'abonnés Instagram, avec leurs biographies, programmes, projets commerciaux et éducatifs, et positions publiques rapportées."
  ur: "ISEAS تناظر 2025/81 از محمد فیضل موسی، 29 اکتوبر 2025، ملائیشیا کی مشہور شخصیات کے سوشل میڈیا پاور بیس کا ابتدائی مطالعہ؛ یہ اسماء ہارون کو 1.1 ملین اور نورحافظہ موسیٰ کو 1 ملین انسٹاگرام فالورز دیتا ہے، ان کی سوانح حیات، پروگراموں، تجارتی اور تعلیمی منصوبوں اور عوامی عہدوں کی اطلاع کے ساتھ۔"
title: "A Preliminary Study of the Social Media Power Base of Malaysia's Celebrity Ustazahs"
