  ar: "دراسة موجزة لمعهد ISEAS ⁦(بورسبكتيف 2025/81)⁩ بقلم محمد فايزال موسى، 29 أكتوبر 2025، عن القاعدة الجماهيرية على وسائل التواصل لداعيات ماليزيا المشهورات؛ فيها 1.1 مليون متابع لأسماء هارون ومليون متابع لنور حفيظة موسى على إنستغرام، وسيرتاهما وبرامجهما ومشروعاتهما التجارية والتعليمية ومواقفهما المعلنة."
  en: "ISEAS Perspective 2025/81 by Mohd Faizal Musa, 29 October 2025, a preliminary study of the social-media power base of Malaysia's celebrity ustazahs; it gives Asma' Harun 1.1 million and Norhafizah Musa 1 million Instagram followers, with their biographies, programmes, commercial and educational projects, and reported public positions."
title: "A Preliminary Study of the Social Media Power Base of Malaysia's Celebrity Ustazahs"
