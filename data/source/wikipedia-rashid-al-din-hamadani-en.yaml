summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رشيد الدين الهمذاني (1247–1318)، وزير الإيلخانيين وطبيبهم ومؤرخ جامع التواريخ؛ وُلد لأسرة يهودية فارسية واعتنق الإسلام في نحو الثلاثين من عمره وأُعدم في 13 يوليو 1318؛ تُستخدم لوقائع الكيان فقط."
  en: "English Wikipedia article on Rashid al-Din Hamadani (1247-1318), Ilkhanid vizier, physician and historian of the Jami' al-Tawarikh; born into a Persian Jewish family, he converted to Islam by about the age of thirty and was executed on 13 July 1318; used for entity facts only."
  es: "Artículo de la Wikipedia en inglés sobre Rashid al-Din Hamadani (1247-1318), visir iljánida, médico e historiador del Jami' al-Tawarikh; nacido en una familia judía persa, se convirtió al Islam alrededor de los treinta años y fue ejecutado el 13 de julio de 1318; utilizado únicamente para datos sobre la entidad."
  fr: "Article de Wikipédia en anglais sur Rashid al-Din Hamadani (1247-1318), vizir ilkhanide, médecin et historien du Jami' al-Tawarikh; né dans une famille juive perse, il se convertit à l'islam vers l'âge de trente ans et fut exécuté le 13 juillet 1318; utilisé uniquement pour les faits concernant l'entité."
  ur: "راشد الدین ہمدانی (1247-1318) پر انگریزی ویکیپیڈیا کا مضمون، الخانید وزیر، طبیب اور جامع التوارخ کے مورخ؛ ایک فارسی یہودی خاندان میں پیدا ہوا، اس نے تقریباً تیس سال کی عمر میں اسلام قبول کیا اور 13 جولائی 1318 کو اسے پھانسی دے دی گئی۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔"
  tr: "Jami' al-Tawarikh'in İlhanlı rahibi, hekim ve tarihçisi Raşid al-Din el-Hamadhani (1247–1318) hakkında İngilizce Vikipedi makalesi; Pers Yahudi bir ailede doğmuş, yaklaşık otuz yaşında İslam'a geçmiş ve 13 Temmuz 1318'de idam edilmiştir; bu makale yalnızca varlığın gerçekleri için kullanılır."
  id: "Artikel Wikipedia bahasa Inggris tentang Rashid al-Din al-Hamadhani (1247–1318), menteri, dokter, dan sejarawan Ilkhanid dari Jami' al-Tawarikh; lahir dalam keluarga Yahudi Persia, ia memeluk Islam sekitar usia tiga puluh tahun dan dieksekusi pada 13 Juli 1318; artikel ini hanya digunakan untuk fakta entitas tersebut."
