reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It states he was born in 1247 into a Persian Jewish family from Hamadan province, converted to Islam around the age of thirty (in 1277), served as vizier under Ghazan and Oldjaitu, and was executed on 13 July 1318. Its closing description of him as an ardent Sunni Muslim rests on his Letters, whose authenticity the same article reports as disputed — Alexander Morton showed them to be a forgery, probably of the Timurid period, per David Morgan — so that description is a single, internally qualified attestation and names no school in the article's own voice. Checked 2 November 2026."
