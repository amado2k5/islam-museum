summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد بن سلمان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه ولي عهد السعودية من 21 يونيو 2017 ورئيس مجلس الوزراء من 27 سبتمبر 2022، ابن الملك سلمان، ووزير الدفاع من 2015، وصاحب برنامج رؤية السعودية 2030 المعلن في أبريل 2016، وتروي إصلاحاته المحدّة من نفوذ المؤسسة الدينية الوهابية، ورفع حظر قيادة النساء سنة 2018، وانتقاده المتلفز للمدارس الفكرية الثابتة، و — منسوبًا إلى تقييم لمكتب مدير الاستخبارات الوطنية الأمريكي — نتيجة أنه أمر باغتيال جمال خاشقجي، وهو ما نفاه مع قبوله المسؤولية بوصفه قائدًا. ويذكر حقل الدين في صندوق معلوماتها «الإسلام السني»؛ ولا يذكر متنها مدرسة له. وتذكر ولادته في الرياض في 31 أغسطس 1985."
  en: "English Wikipedia article on Mohammed bin Salman; used for entity facts only. It gives him as Crown Prince of Saudi Arabia from 21 June 2017 and Prime Minister from 27 September 2022, son of King Salman, defence minister from 2015, the author of the Saudi Vision 2030 programme announced in April 2016, and records his reforms curtailing the Wahhabi religious establishment, the lifting of the ban on women driving in 2018, his televised criticism of fixed schools of thought, and — attributed to a United States ODNI assessment — the finding that he ordered the assassination of Jamal Khashoggi, which he has denied while accepting responsibility as leader. Its infobox religion field reads 'Sunni Islam'; its text names no school as his own. It gives his birth at Riyadh on 31 August 1985."
