  tr: "Muhammed Raşid Rida tarafından Tafsir al-Manar olarak bilinen Kur'an-Ker'in dokuzuncu yorumu, 88'deki A'raf ayetlerinin yorumuyla başlar ve korunan kopyanın başlık sayfasına göre El-Enfal'in ayetlerine 40'a kadar uzanır."
  id: "Bagian kesembilan dari interpretasi Al-Qur'an, yang dikenal sebagai Tafsir al-Manar oleh Muhammad Rashid Rida, dimulai dengan penafsiran ayat-ayat A'raf dari tahun 88 dan meluas hingga ayat-ayat Al-Anfal hingga 40, sesuai dengan halaman judul dalam salinan yang disimpan."
