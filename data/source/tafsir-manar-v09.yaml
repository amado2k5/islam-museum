  ar: "الجزء التاسع من تفسير القرآن الحكيم المشهور بتفسير المنار لمحمد رشيد رضا، ويبدأ بتفسير آيات الأعراف من 88 ويمتد إلى آيات الأنفال إلى 40 بحسب صفحة العنوان في النسخة المحفوظة."
  en: "Volume 9 of Muhammad Rashid Rida's Tafsir al-Manar, covering Qur'an 7:88 to 8:40 according to its title page."
