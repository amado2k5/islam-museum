summary:
  ar: "مقالة ويكيبيديا التركية عن فيزا غورسي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 7 أبريل 1921 بأناضولو حصاري في إسطنبول ووفاته في 13 أبريل 1992 في نيو هيفن ودفنه في مقبرة الأسرة بأناضولو حصاري، وتعيينه بجامعة إسطنبول بين 1951 و1957 «بدعم من جاهيت عارف»، ومسيرته في جامعة الشرق الأوسط التقنية وييل. لا يحتوي المقال أي محتوى ديني."
  en: "Turkish Wikipedia article on Feza Gürsey; used for entity facts only. It gives his birth on 7 April 1921 at Anadolu Hisarı, Istanbul, his death on 13 April 1992 at New Haven and his burial in the family plot at Anadolu Hisarı Cemetery, his Istanbul University appointment of 1951–57 made 'with Cahit Arf's support', and his career at METU and Yale. The article contains no religion content."
  es: "Artículo de la Wikipedia en turco sobre Feza Gürsey; utilizado únicamente para datos biográficos. Indica su nacimiento el 7 de abril de 1921 en Anadolu Hisarı, Estambul, su fallecimiento el 13 de abril de 1992 en New Haven y su entierro en la parcela familiar del cementerio de Anadolu Hisarı, su nombramiento en la Universidad de Estambul entre 1951 y 1957, realizado «con el apoyo de Cahit Arf», y su trayectoria profesional en la Universidad Técnica de Oriente Medio (METU) y Yale. El artículo no contiene contenido religioso."
  fr: "Article de Wikipédia en turc consacré à Feza Gürsey; utilisé uniquement à titre informatif. Il mentionne sa naissance le 7 avril 1921 à Anadolu Hisarı, Istanbul, son décès le 13 avril 1992 à New Haven et son inhumation dans le caveau familial du cimetière d'Anadolu Hisarı, sa nomination à l'Université d'Istanbul de 1951 à 1957 « grâce au soutien de Cahit Arf », ainsi que sa carrière à l'Université technique du Moyen-Orient (METU) et à Yale. Cet article ne contient aucune information religieuse."
  ur: "Feza Gürsey پر ترک ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 7 اپریل 1921 کو انادولو حصاری، استنبول میں ان کی پیدائش، 13 اپریل 1992 کو نیو ہیون میں ان کی موت اور انادولو حصاری قبرستان میں خاندانی پلاٹ میں ان کی تدفین، ان کی استنبول یونیورسٹی میں 1951–57 کی تقرری 'کاہت آرف کے تعاون سے ہوئی'، اور یالی ٹی یو میں ان کا کیریئر۔ مضمون میں کوئی مذہبی مواد نہیں ہے۔"
