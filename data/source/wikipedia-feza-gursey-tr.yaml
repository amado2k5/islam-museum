  ar: "مقالة ويكيبيديا التركية عن فيزا غورسي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 7 أبريل 1921 بأناضولو حصاري في إسطنبول ووفاته في 13 أبريل 1992 في نيو هيفن ودفنه في مقبرة الأسرة بأناضولو حصاري، وتعيينه بجامعة إسطنبول بين 1951 و1957 «بدعم من جاهيت عارف»، ومسيرته في جامعة الشرق الأوسط التقنية وييل. لا يحتوي المقال أي محتوى ديني."
  en: "Turkish Wikipedia article on Feza Gürsey; used for entity facts only. It gives his birth on 7 April 1921 at Anadolu Hisarı, Istanbul, his death on 13 April 1992 at New Haven and his burial in the family plot at Anadolu Hisarı Cemetery, his Istanbul University appointment of 1951–57 made 'with Cahit Arf's support', and his career at METU and Yale. The article contains no religion content."
