reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. It gives his birth on 6 October 1879 at Bangarmau in Unnao district and his death on 5 December 1957 at Deoband; his graduation from Darul Uloom Deoband, eighteen years teaching in Medina, his years as the seminary's principal and Shaykh al-Hadith from 1927, his Malta imprisonment alongside his teacher Mahmud Hasan, his two teaching years in Sylhet, his presidency of Jamiat Ulama-e-Hind from 1940, his 1938 book Composite Nationalism and Islam and the Madani–Iqbal debate, and the Padma Bhushan of 1954. Its TEXT nowhere names a legal school or creed for the man himself; the embedded religious-biography infobox gives denomination Sunni, jurisprudence Hanafi, creed Maturidi, movement Deobandi and tariqas Chishti (Sabiri-Imdadi), Naqshbandi, Qadri and Suhrawardi, with no citations attached to those fields — one infobox family. Its categories are filings (Maturidis, Deobandis, Sunni Sufis, Hanafi scholars)."
