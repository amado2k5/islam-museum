summary:
  ar: "قناة خالد منتصر على يوتيوب، ووصفها «الطبيب والكاتب والاعلامي»؛ تحمل لقاءات «خارج النص» وأحاديثه، ومعظم فيديوهاتها من 2020–2023."
  en: "Khaled Montaser's YouTube channel, described as 'the physician, writer and broadcaster'; it carries Kharej Al-Nass interviews and his talks, most videos from 2020–2023."
  es: "El canal de YouTube de Khaled Montaser, descrito como \"el médico, escritor y locutor\", incluye entrevistas y charlas de Kharej Al-Nass, la mayoría de los vídeos datan del período 2020-2023."
  fr: "La chaîne YouTube de Khaled Montaser, décrit comme « médecin, écrivain et animateur », propose des interviews et des conférences de Kharej Al-Nass, la plupart des vidéos datant de 2020-2023."
  ur: "خالد مونتاسر کا یوٹیوب چینل، جسے 'طبیب، مصنف اور براڈکاسٹر' کے طور پر بیان کیا گیا ہے۔ اس میں خوارج الناس کے انٹرویوز اور ان کی گفتگو، 2020-2023 کی زیادہ تر ویڈیوز شامل ہیں۔"
  tr: "Khaled Montaser'ın \"doktor, yazar ve medya profesyoneli\" olarak tanımlanan YouTube kanalı, 2020–2023 yıllarına ait videolarının çoğunu içeren \"senaryo dışı\" röportajlar ve sohbetler içeriyor."
  id: "Channel YouTube Khaled Montaser, yang digambarkan sebagai \"dokter, penulis, dan profesional media,\" menampilkan wawancara dan percakapan \"off-the-script\", dengan sebagian besar videonya dari tahun 2020–2023."
