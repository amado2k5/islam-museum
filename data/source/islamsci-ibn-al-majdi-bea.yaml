summary:
  ar: "مقال فرنسوا شاريه في *Biographical Encyclopedia of Astronomers* ⁦(Springer 2007، ص 561-562)⁩ عن ابن المجدي: ميقاتي الأزهر ورئيس مشايخ مدرسة جنبكية، تعليمه الديني، تعلّمه الميقات على المارديني، رسائله في رؤية الهلال والجداول المساعدة، وقراءتها في مصر حتى أواخر القرن التاسع عشر."
  en: "François Charette's article in the *Biographical Encyclopedia of Astronomers* (Springer 2007, pp. 561-562) on Ibn al-Majdi: muwaqqit at al-Azhar and head of teachers at the Jannibakiyya madrasa, his religious education, learning mīqāt under al-Mardini, his treatises on crescent visibility and auxiliary tables, and their readership in Egypt into the late nineteenth century."
  ur: "فرانسوا Charette کا مضمون *Biographical Encyclopedia of Astronomers* ⁦(Springer 2007، ص 561-562)⁩ میں ابن المجدی پر: جامع ازہر کے میقاتی اور جامعہ جنبکیہ کے اساتذہ کے سربراہ، اس کی مذہبی تعلیم، الماردینی سے میقات سیکھنا، رؤیتِ ہلال اور معاون جداول پر اس کی تصانیف، اور انیسویں صدی کے آخر تک مصر میں ان کا مطالعہ۔"
title: "Ibn al-Majdī: Shihāb al-Dīn Abū al-ʿAbbās Aḥmad ibn Rajab ibn Ṭaybughā al-Majdī al-Shāfiʿī — Biographical Encyclopedia of Astronomers"
