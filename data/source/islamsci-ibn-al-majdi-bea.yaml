reliability_note: "Full BEA entry read 2026-11-15 (Charette, pp. 561-562). Scholarly biographical encyclopedia article: born Cairo August 1366, died Cairo 27/28 January 1447; muwaqqit at al-Azhar Mosque and head of teachers at the Jannibakiyya madrasa; traditional religious education in Quranic studies, hadith, fiqh and Arabic; learned mīqāt under Jamal al-Din al-Mardini (student of Ibn al-Shatir); treatises on lunar crescent visibility 'a topic of prime importance to Muslim religious practice since the Islamic calendar is lunar'; auxiliary tables al-Durr al-yatim studied by Kennedy and King; writings read and commented on in Egypt into the late nineteenth century."
