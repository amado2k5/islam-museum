summary:
  ar: "مقالة ويكيبيديا الفرنسية عن عبد القادر حاج علي؛ تُستخدم لوقائع الكيان فقط، ومصدرها الأساس قاموس ميترون (غالييسو). تعطي مولده في 23 ديسمبر 1883 بدوار سيدي سعادة قرب غليزان ووفاته سنة 1957 بمنطقة باريس، وهجرته إلى فرنسا، وحصوله على الجنسية الفرنسية 1911، وعضويته في اللجنة المركزية للحزب الشيوعي الفرنسي ورئاسته نجم شمال إفريقيا عند إنشائه 1926. لا تذكر ديانة له."
  en: "French Wikipedia article on Abdelkader Hadj Ali; used for entity facts only, resting chiefly on the Maitron dictionary (Gallissot). It gives his birth on 23 December 1883 at the douar Sidi Saada near Relizane and his death in 1957 in the Paris region, his emigration to France, French citizenship in 1911, membership of the PCF central committee and his presidency of the Étoile nord-africaine at its creation in 1926. It names no religion for him."
