  ar: "مقالة ويكيبيديا العربية عن الإمام والمقرئ المغربي عبد العزيز الكرعاني؛ لوقائع الكيان فقط: نشأته في درب الفقراء بالدار البيضاء، وإمامته في مساجد التوبة والتيسير والقاضي عياض، وعمله التربوي منذ 1999، ووفاته في 31 مايو 2025 ودفنه في مقبرة سيدي مسعود؛ مقالة بذرة غير مراجعة، وتستند إلى لو 360 وكشـ24 وهسبريس."
