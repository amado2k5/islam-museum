summary:
  ar: "مقالة ويكيبيديا العربية عن الإمام والمقرئ المغربي عبد العزيز الكرعاني؛ لوقائع الكيان فقط: نشأته في درب الفقراء بالدار البيضاء، وإمامته في مساجد التوبة والتيسير والقاضي عياض، وعمله التربوي منذ 1999، ووفاته في 31 مايو 2025 ودفنه في مقبرة سيدي مسعود؛ مقالة بذرة غير مراجعة، وتستند إلى لو 360 وكشـ24 وهسبريس."
  en: "Arabic Wikipedia article on the Moroccan imam and reciter Abdelaziz al-Karaouri; entity facts only: his upbringing in Derb al-Fuqara, Casablanca, his imamate at the al-Tawba, al-Taysir and al-Qadi Iyad mosques, his work in education from 1999, and his death on 31 May 2025 with burial at Sidi Mas'ud cemetery; a stub marked unreviewed, citing Le360, Kech24 and Hespress."
  es: "Artículo en árabe de Wikipedia sobre el imán y recitador marroquí Abdelaziz al-Karaouri; datos de la entidad únicamente: su educación en Derb al-Fuqara, Casablanca, su imamato en las mezquitas de al-Tawba, al-Taysir y al-Qadi Iyad; un talón marcado como no revisado, citando a Le360, Kech24 y Hespress."
  fr: "Article Wikipédia en arabe sur l'imam et récitant marocain Abdelaziz al-Karaouri; faits d'entité uniquement: son éducation à Derb al-Fuqara, Casablanca, son imamat aux mosquées al-Tawba, al-Taysir et al-Qadi Iyad; un talon marqué non révisé, citant Le360, Kech24 et Hespress."
  ur: "مراکش کے امام اور قاری عبد العزیز الکراوری پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: اس کی پرورش درب الفقرہ، کاسابلانکا میں، التوبہ، التیسر اور القادی عیاد مساجد میں اس کی امامت؛ Le360، Kech24 اور Hespress کا حوالہ دیتے ہوئے، ایک اسٹب کو غیر جائزہ شدہ نشان زد کیا گیا ہے۔"
