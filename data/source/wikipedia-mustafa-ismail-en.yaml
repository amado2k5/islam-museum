  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى إسماعيل؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 17 يونيو 1905 بميت غزال قرب طنطا، ودراسته بطنطا على إدريس فاخر، وتعيينه قارئا بمسجد الأزهر سنة 1947، وتكريم عبد الناصر له سنة 1965، ووفاته بالإسكندرية في 26 ديسمبر 1978؛ وصندوق معلوماتها المضمّن يعطي دينه الإسلام وطائفته سنية."
  en: "English Wikipedia article on Mustafa Ismail; used for entity facts only. It gives his birth on 17 June 1905 at Mit Gazal near Tanta, his studies at Tanta under Idris Fakhir, his appointment as a reciter at Al-Azhar Mosque in 1947, the distinction he received from President Nasser in 1965, and his death at Alexandria on 26 December 1978; its embedded religious-biography infobox gives religion Islam and sect Sunni."
