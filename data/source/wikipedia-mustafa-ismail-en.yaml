summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى إسماعيل؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 17 يونيو 1905 بميت غزال قرب طنطا، ودراسته بطنطا على إدريس فاخر، وتعيينه قارئا بمسجد الأزهر سنة 1947، وتكريم عبد الناصر له سنة 1965، ووفاته بالإسكندرية في 26 ديسمبر 1978؛ وصندوق معلوماتها المضمّن يعطي دينه الإسلام وطائفته سنية."
  en: "English Wikipedia article on Mustafa Ismail; used for entity facts only. It gives his birth on 17 June 1905 at Mit Gazal near Tanta, his studies at Tanta under Idris Fakhir, his appointment as a reciter at Al-Azhar Mosque in 1947, the distinction he received from President Nasser in 1965, and his death at Alexandria on 26 December 1978; its embedded religious-biography infobox gives religion Islam and sect Sunni."
  es: "Artículo de la Wikipedia en inglés sobre Mustafa Ismail; utilizado únicamente para datos biográficos. Indica su nacimiento el 17 de junio de 1905 en Mit Gazal, cerca de Tanta, sus estudios en Tanta con Idris Fakhir, su nombramiento como recitador en la mezquita de Al-Azhar en 1947, la distinción que recibió del presidente Nasser en 1965 y su fallecimiento en Alejandría el 26 de diciembre de 1978; su ficha biográfica religiosa integrada indica que su religión era el islam y su secta, suní."
  fr: "Article de Wikipédia en anglais sur Mustafa Ismail; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 17 juin 1905 à Mit Gazal, près de Tanta, ses études à Tanta auprès d’Idris Fakhir, sa nomination comme récitant à la mosquée Al-Azhar en 1947, la distinction qu’il a reçue du président Nasser en 1965 et sa mort à Alexandrie le 26 décembre 1978; son infobox biographique religieuse intégrée précise qu’il était de religion islam et de confession sunnite."
  ur: "مصطفی اسماعیل پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 17 جون 1905 کو طنطہ کے قریب میت غزال میں ان کی پیدائش، ادریس فاخر کے تحت طنطہ میں ان کی تعلیم، 1947 میں الازہر مسجد میں قاری کے طور پر ان کی تقرری، 1965 میں صدر ناصر سے انہیں جو امتیاز ملا، اور 26 دسمبر 1978 کو اسکندریہ میں ان کی وفات۔ اس کا سرایت شدہ مذہبی سوانح حیات کا انفو باکس مذہب اسلام اور فرقہ سنی دیتا ہے۔"
  tr: "Mustafa İsmail hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 17 Haziran 1905'te Tanta yakınlarındaki Mit Ghazal'da doğduğunu, Tanta'da İdris Fakhir'in yanında çalışmalarını, 1947'de El-Ezher Camii'nde okumacı olarak atanmasını, 1965'te Abdel Nasser tarafından onurlandırılmasını ve 26 Aralık 1978'de İskenderiye'de vefatını belirtir; ve içinde yer alan bilgi kutusu onun dini İslam ve mezhebi Sünni olarak verilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Mustafa Ismail; digunakan hanya untuk fakta entitas. Artikel ini menyebutkan kelahirannya pada 17 Juni 1905 di Mit Ghazal dekat Tanta, studinya di Tanta di bawah Idris Fakhir, pengangkatannya sebagai pembaca di Masjid Al-Azhar pada tahun 1947, penghormatan oleh Abdel Nasser pada tahun 1965, dan kematiannya di Alexandria pada 26 Desember 1978; dan kotak informasi yang disertakan mencantumkan agama Islam dan sektenya Sunni."
