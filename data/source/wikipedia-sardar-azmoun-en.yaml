reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 — the career in full and the entire text searched for any religion statement; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Azmoun as born on 1 January 1995 in Gonbad-e Kavus; a striker for Rubin Kazan, Rostov, Zenit Saint Petersburg (Russian Premier League co-top scorer and Player of the Season in 2020–21), Bayer Leverkusen, Roma on loan and Shabab Al Ahli from 2024; an Iran international since 2014 with 93 caps and 57 goals at the article's last statistical update, at the 2018 and 2022 World Cups and the 2015, 2019 and 2023 Asian Cups. Its infobox has no religion field. Its only religion statement is in the Personal life section: 'Azmoun was born into a Sunni family of Turkmen origin', cited to a reference — a statement about the family he was born into, not an attestation of a school for Azmoun himself, and the article makes no other statement of his religion."
