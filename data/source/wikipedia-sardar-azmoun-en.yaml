  en: "English Wikipedia article on Sardar Azmoun; used for entity facts only. It recounts his career with Rubin Kazan, Rostov and Zenit — where he finished the 2020–21 Russian season as co-top scorer and Player of the Season — then Bayer Leverkusen, Roma and Shabab Al Ahli, and his Iran career at the 2018 and 2022 World Cups."
