  en: "English Wikipedia article on Mohammad Khatami; used for entity facts only. Its lead calls him an Iranian politician and Shia cleric, president of Iran from 3 August 1997 to 3 August 2005 and proposer of the Dialogue Among Civilizations."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Khatami; utilizado únicamente para obtener información sobre la persona. En su introducción se le describe como un político iraní y clérigo chiíta, presidente de Irán del 3 de agosto de 1997 al 3 de agosto de 2005 y promotor del Diálogo entre Civilizaciones."
  fr: "Article de Wikipédia en anglais sur Mohammad Khatami; utilisé uniquement à des fins d’information sur l’entité. Son introduction le décrit comme un homme politique iranien et un religieux chiite, président de l’Iran du 3 août 1997 au 3 août 2005 et instigateur du Dialogue entre les civilisations."
  ur: "محمد خاتمی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی قیادت انہیں ایک ایرانی سیاست دان اور شیعہ عالم، 3 اگست 1997 سے 3 اگست 2005 تک ایران کے صدر اور تہذیبوں کے درمیان مکالمے کے تجویز کنندہ کہتی ہے۔"
  tr: "Muhammed Hatemi hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Girişinde onu İranlı bir politikacı ve Şii din adamı, 3 Ağustos 1997'den 3 Ağustos 2005'e kadar İran cumhurbaşkanı ve medeniyetler arası diyalog fikrinin kurucusu olarak tanımlar."
  id: "Artikel Wikipedia bahasa Inggris tentang Mohammad Khatami; digunakan hanya untuk fakta entitas. Pendahuluannya menggambarkan dia sebagai politisi Iran dan ulama Syiah, presiden Iran dari 3 Agustus 1997 hingga 3 Agustus 2005, serta pendiri gagasan dialog antar peradaban."
