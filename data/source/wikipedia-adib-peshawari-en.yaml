  ar: "مقالة ويكيبيديا الإنجليزية عن الأديب البيشاوري؛ تُستخدم لوقائع الكيان فقط. تسمّيه عالمًا صوفيًا وشاعرًا فارسيًا، وُلد قرب بيشاور سنة 1844 وتوفي في 30 يونيو 1930، وتروي مقتل أبيه في الحرب الإنجليزية الفارسية ودراسته في كابل وغزني وسبزوار وإقامته في طهران."
  en: "English Wikipedia article on Adib Pishavari; used for entity facts only. It calls him a Sufi scholar and master of Persian literature, born near Peshawar in 1844 and died 30 June 1930, and recounts his father's death in the Anglo-Persian War, his studies at Kabul, Ghazni and Sabzevar, and his residence in Tehran."
