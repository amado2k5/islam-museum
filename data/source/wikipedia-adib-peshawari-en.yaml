summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الأديب البيشاوري؛ تُستخدم لوقائع الكيان فقط. تسمّيه عالمًا صوفيًا وشاعرًا فارسيًا، وُلد قرب بيشاور سنة 1844 وتوفي في 30 يونيو 1930، وتروي مقتل أبيه في الحرب الإنجليزية الفارسية ودراسته في كابل وغزني وسبزوار وإقامته في طهران."
  en: "English Wikipedia article on Adib Pishavari; used for entity facts only. It calls him a Sufi scholar and master of Persian literature, born near Peshawar in 1844 and died 30 June 1930, and recounts his father's death in the Anglo-Persian War, his studies at Kabul, Ghazni and Sabzevar, and his residence in Tehran."
  es: "Artículo de la Wikipedia en inglés sobre Adib Pishavari; utilizado únicamente para datos sobre la persona. Lo describe como un erudito sufí y maestro de la literatura persa, nacido cerca de Peshawar en 1844 y fallecido el 30 de junio de 1930, y relata la muerte de su padre en la guerra anglo-persa, sus estudios en Kabul, Ghazni y Sabzevar, y su residencia en Teherán."
  fr: "Article de Wikipédia en anglais sur Adib Pishavari; utilisé uniquement pour les informations biographiques. Il le décrit comme un érudit soufi et un maître de la littérature persane, né près de Peshawar en 1844 et décédé le 30 juin 1930, et relate la mort de son père pendant la guerre anglo-persane, ses études à Kaboul, Ghazni et Sabzevar, et sa résidence à Téhéran."
  ur: "ادیب پشاوری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں انہیں صوفی اسکالر اور فارسی ادب کا ماہر کہا جاتا ہے، جو 1844 میں پشاور کے قریب پیدا ہوئے اور 30 جون 1930 کو وفات پا گئے، اور اینگلو-فارسی جنگ میں اپنے والد کی موت، کابل، غزنی اور سبزوار میں اپنی تعلیم اور تہران میں ان کی رہائش کا ذکر کرتے ہیں۔"
