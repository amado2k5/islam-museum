summary:
  ar: "مقالة ويكيبيديا الفارسية عن أستاذ غلام حسين؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تعطي تاريخيه بالتقويم الهجري الشمسي ⁦(1265 - 27 تير 1346)⁩، وتصفه بأنه أكبر عازفي الهارمونية والبيانو في زمانه، وتذكر تربيته تلاميذ كثيرين منهم ابنه محمد حسين سرآهنگ. مصدرها مقال بي بي سي الفارسية في الذكرى الأربعين لوفاته. لا تسمي دينا ولا مذهبا."
  en: "Persian Wikipedia article on Ustad Ghulam Hossein; used for entity facts only. A stub giving his dates in the Solar Hijri calendar (1265 – 27 Tir 1346), describing him as the greatest harmonium and piano player of his time, and recording that he trained many students, among them his son Mohammad Hossein Sarahang. It cites BBC Persian's piece on the fortieth anniversary of his death. It names no religion or school."
  es: "Artículo de Wikipedia en persa sobre Ustad Ghulam Hossein; utilizado únicamente para datos sobre la persona. Un breve extracto que indica sus fechas en el calendario Hijri solar (1265 – 27 Tir 1346), describiéndolo como el mejor intérprete de armonio y piano de su época, y registrando que formó a numerosos alumnos, entre ellos su hijo Mohammad Hossein Sarahang. Cita un reportaje de BBC Persian sobre el cuadragésimo aniversario de su muerte. No menciona ninguna religión ni escuela."
  fr: "Article Wikipédia en persan sur Ustad Ghulam Hossein; utilisé uniquement pour les informations le concernant. Ce texte incomplet indique ses dates selon le calendrier hégirien solaire (1265 – 27 Tir 1346), le décrit comme le plus grand joueur d'harmonium et de piano de son temps, et mentionne qu'il a formé de nombreux élèves, parmi lesquels son fils Mohammad Hossein Sarahang. Il cite un article de BBC Persian paru à l'occasion du quarantième anniversaire de sa mort. Aucune religion ni école n'est mentionnée."
  ur: "استاد غلام حسین پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ شمسی ہجری کیلنڈر ⁦(1265 - 27 تیر 1346)⁩ میں اپنی تاریخیں دینے والا ایک سٹب، اسے اپنے وقت کے سب سے بڑے ہارمونیم اور پیانو بجانے والے کے طور پر بیان کرتا ہے، اور یہ ریکارڈ کرتا ہے کہ اس نے بہت سے طلباء کو تربیت دی، ان میں اس کا بیٹا محمد حسین سرہنگ بھی شامل ہے۔ اس میں ان کی موت کی چالیسویں برسی پر بی بی سی فارسی کے ٹکڑے کا حوالہ دیا گیا ہے۔ اس میں کسی مذہب یا اسکول کا نام نہیں ہے۔"
  tr: "Profesör Gholam Hussein hakkında Farsça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılır. Güneş Hicri takviminde (1265 - 27 Tir 1346) tarihini anlatan kısa bir makale, onu zamanının en büyük armonika ve piyanisti olarak tanımlar ve oğlu Muhammed Hüseyin Sarahang dahil birçok öğrenci tarafından yetiştirildiğinden bahseder. Kaynağı, ölümünün kırkıncı yıldönümüyle ilgili BBC Farsça makalesidir. Din veya mezhep adı verilmez."
  id: "Artikel Wikipedia Persia tentang Profesor Gholam Hussein; hanya digunakan untuk fakta entitas. Sebuah artikel singkat yang menjelaskan sejarahnya dalam kalender Hijriyah Matahari (1265 - 27 Tir 1346), menggambarkannya sebagai harmonika dan pianis terbesar pada zamannya, serta menyebutkan masa kecilnya oleh banyak murid, termasuk putranya Muhammad Hussein Sarahang. Sumbernya adalah artikel BBC Persia tentang peringatan empat puluh tahun kematiannya. Artikel tersebut tidak menyebutkan agama atau sekte."
