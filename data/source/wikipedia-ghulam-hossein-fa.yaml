summary:
  ar: "مقالة ويكيبيديا الفارسية عن أستاذ غلام حسين؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تعطي تاريخيه بالتقويم الهجري الشمسي (1265 - 27 تير 1346)، وتصفه بأنه أكبر عازفي الهارمونية والبيانو في زمانه، وتذكر تربيته تلاميذ كثيرين منهم ابنه محمد حسين سرآهنگ. مصدرها مقال بي بي سي الفارسية في الذكرى الأربعين لوفاته. لا تسمي دينا ولا مذهبا."
  en: "Persian Wikipedia article on Ustad Ghulam Hossein; used for entity facts only. A stub giving his dates in the Solar Hijri calendar (1265 – 27 Tir 1346), describing him as the greatest harmonium and piano player of his time, and recording that he trained many students, among them his son Mohammad Hossein Sarahang. It cites BBC Persian's piece on the fortieth anniversary of his death. It names no religion or school."
