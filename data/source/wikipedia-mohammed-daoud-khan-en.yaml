  ar: "مقالة ويكيبيديا الإنجليزية عن محمد داود خان؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 18 يوليو 1909 بكابل، ورئاسته الحكومة (1953-1963)، وانقلابه سنة 1973 على ابن عمه الملك ظاهر شاه وإعلانه الجمهورية ورئاسته لها، واغتياله في انقلاب ثور في 28 أبريل 1978. لا تحمل خانة للديانة."
  en: "English Wikipedia article on Mohammad Daoud Khan; used for entity facts only. It recounts his birth on 18 July 1909 at Kabul, his premiership (1953–1963), his 1973 coup against his cousin King Zahir Shah and proclamation of the republic with himself as president, and his assassination in the Saur Revolution on 28 April 1978. It carries no religion field."
