summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد داود خان؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 18 يوليو 1909 بكابل، ورئاسته الحكومة (1953-1963)، وانقلابه سنة 1973 على ابن عمه الملك ظاهر شاه وإعلانه الجمهورية ورئاسته لها، واغتياله في انقلاب ثور في 28 أبريل 1978. لا تحمل خانة للديانة."
  en: "English Wikipedia article on Mohammad Daoud Khan; used for entity facts only. It recounts his birth on 18 July 1909 at Kabul, his premiership (1953–1963), his 1973 coup against his cousin King Zahir Shah and proclamation of the republic with himself as president, and his assassination in the Saur Revolution on 28 April 1978. It carries no religion field."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Daoud Khan; se utiliza únicamente para datos sobre la persona. Relata su nacimiento el 18 de julio de 1909 en Kabul, su mandato como primer ministro (1953-1963), su golpe de Estado de 1973 contra su primo, el rey Zahir Shah, y la proclamación de la república con él mismo como presidente, y su asesinato durante la Revolución de Saur el 28 de abril de 1978. No incluye información sobre religión."
  fr: "Article de Wikipédia en anglais sur Mohammad Daoud Khan; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance le 18 juillet 1909 à Kaboul, son mandat de Premier ministre (1953-1963), son coup d'État de 1973 contre son cousin, le roi Zahir Shah, et la proclamation de la république dont il s'est nommé président, ainsi que son assassinat lors de la révolution de Saur le 28 avril 1978. Il ne comporte pas de champ relatif à la religion."
