reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. It gives his birth in Jerusalem on 1 November 1935 and death in New York on 25 September 2003 of leukaemia, his father's Protestantism and American service in the First World War, the family's move from Jerusalem's Talbiya quarter to Cairo in 1948, Victoria College (which it places at Alexandria, expulsion in 1950, against the English article's Cairo branch and 1951), the Harvard doctorate in 1963 (against the English article's and Britannica's 1964), the Columbia career, the Palestinian National Council membership (1977-1991) and resignation over Oslo, the prizes including the Nonino International Prize (1998) and the American Book Awards (1996), and a long attributed account of the Orientalism controversy, including Justus Weiner's disputed claims about his Jerusalem childhood and the rebuttals. The date and schooling variants are recorded in the person record. Read in full on 24 October 2026."
