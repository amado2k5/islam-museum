summary:
  ar: "سيرة صالح بن عبد الله بن حمد العصيمي في موسوعة سير أعلام المعاصرين (alsiyars.com)؛ تصنفه في فئات «أهل السنة» وتصفه في متنها بأنه «صلب في عقيدته السنية»، وتفصّل مشايخه وبرامجه التعليمية ومناصبه."
  en: "Biography of Saleh bin Abdullah bin Hamad al-Osaimi in the Alsiyars encyclopedia of contemporary figures (alsiyars.com); it files him under the category 'Ahl al-Sunna' and describes him in its prose as firm in his Sunni creed, and details his teachers, teaching programmes and posts."
  es: "La biografía de Saleh bin Abdullah bin Hamad al-Osaimi aparece en la enciclopedia Alsiyars de figuras contemporáneas (alsiyars.com); lo clasifica dentro de la categoría \"Ahl al-Sunna\" y lo describe en su prosa como firme en su credo sunita, detallando sus maestros, programas de enseñanza y cargos."
  fr: "Biographie de Saleh bin Abdullah bin Hamad al-Osaimi dans l'encyclopédie Alsiyars des personnalités contemporaines (alsiyars.com); elle le classe dans la catégorie « Ahl al-Sunna » et le décrit dans sa prose comme ferme dans sa croyance sunnite, et détaille ses enseignants, ses programmes d'enseignement et ses postes."
  ur: "ہم عصر شخصیات کے السیار انسائیکلوپیڈیا میں صالح بن عبداللہ بن حمد العثیمی کی سوانح عمری (alsiyars.com)؛ اس نے اسے 'اہل السنہ' کے زمرے میں درج کیا ہے اور اسے اپنے نثر میں اس کے سنی مسلک پر پختہ قرار دیا ہے، اور اس کے اساتذہ، تدریسی پروگراموں اور عہدوں کی تفصیل دی ہے۔"
  tr: "Çağdaş Figürler Ansiklopedisi'nde (alsiyars.com) Saleh bin Abdullah bin Hamad Al-Oseimi'nin biyografisi onu \"Ehl-sünnet\" kategorileri arasında sınıflandırır ve metinde \"Sünni inancında kararlı\" olarak tanımlanır; öğretmenlerini, eğitim programlarını ve pozisyonlarını detaylandırır."
  id: "Biografi Saleh bin Abdullah bin Hamad Al-Oseimi dalam Ensiklopedia Tokoh Kontemporer (alsiyars.com) mengklasifikasikannya di antara kategori \"Ahl al-Sunnah\" dan menggambarkannya dalam teks sebagai \"teguh dalam ajaran Sunni,\" merinci guru, program pendidikan, dan posisinya."
