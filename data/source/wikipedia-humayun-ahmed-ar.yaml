summary:
  ar: "مقالة ويكيبيديا العربية عن همايون أحمد؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 13 نوفمبر 1948 ووفاته في 19 يوليو 2012 في نيويورك بسرطان القولون، وأعماله الروائية والسينمائية، ودينه في صندوق المعلومات «الإسلام» عمومًا دون مذهب."
  en: "Arabic Wikipedia article on Humayun Ahmed; used for entity facts only. It gives his birth on 13 November 1948, his death on 19 July 2012 in New York of colon cancer, and his novels and films. Its infobox gives his religion as Islam generically — no school."
  es: "Artículo de Wikipedia en árabe sobre Humayun Ahmed; se utiliza únicamente para obtener información sobre la persona. Indica su fecha de nacimiento (13 de noviembre de 1948), su fallecimiento (19 de julio de 2012) en Nueva York a causa de cáncer de colon, y sus novelas y películas. Su ficha informativa señala que su religión era el islam en general, sin mencionar ninguna escuela específica."
  fr: "Article Wikipédia en arabe sur Humayun Ahmed; utilisé uniquement pour les informations le concernant. Il indique sa date de naissance, le 13 novembre 1948, son décès, le 19 juillet 2012 à New York, des suites d’un cancer du côlon, ainsi que ses romans et films. Son infobox précise qu’il était musulman, sans mention d’école particulière."
  ur: "ہمایوں احمد پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 13 نومبر 1948 کو ان کی پیدائش، بڑی آنت کے کینسر سے نیویارک میں 19 جولائی 2012 کو ان کی موت، اور ان کے ناول اور فلمیں پیش کرتا ہے۔ اس کا معلوماتی خانہ اس کے مذہب کو عمومی طور پر اسلام دیتا ہے — کوئی اسکول نہیں۔"
