summary:
  ar: "مقابلة أجرتها مجلة The Fountain ⁦(عدد 67، يناير-فبراير 2009)⁩ مع زويل عن رحلته إلى نوبل وعن العلم في العالم الإسلامي؛ يتحدث فيها عن نشأته مسلماً في مصر، ومسجد سيدي إبراهيم الدسوقي، ودراسته في المسجد بعد الصلاة، ورأيه أن الإسلام والعلم لا يتعارضان."
  en: "An interview by The Fountain magazine (issue 67, January-February 2009) with Zewail on his road to the Nobel and on science in the Muslim world; he speaks of growing up Muslim in Egypt, the Sidi Ibrahim al-Desuqi mosque, studying in the mosque after prayer, and his view that Islam and science do not conflict."
  ur: "فاؤنٹن میگزین کا انٹرویو ⁦(اشاعت 67، جنوری-فروری 2009)⁩ زویل کے ساتھ ان کے نوبل سفر اور مسلم دنیا میں سائنس پر؛ اس میں وہ اپنی مسلمانی میں مصری پرورش، سیدی ابراہیم الدسوقی مسجد، نماز کے بعد مسجد میں مطالعہ، اور اس رائے کو بیان کرتے ہیں کہ اسلام اور سائنس میں کوئی تضاد نہیں۔"
  es: "En una entrevista publicada por la revista The Fountain (número 67, enero-febrero de 2009) con Zewail, habla de su camino hacia el Premio Nobel y de la ciencia en el mundo musulmán. En ella, relata su infancia como musulmán en Egipto, la mezquita Sidi Ibrahim al-Desuqi, sus estudios en la mezquita después de la oración y su opinión de que el Islam y la ciencia no entran en conflicto."
  fr: "Une interview de Zewail par le magazine The Fountain (numéro 67, janvier-février 2009) sur son parcours vers le prix Nobel et sur la science dans le monde musulman; il parle de son enfance musulmane en Égypte, de la mosquée Sidi Ibrahim al-Desuqi, de ses études à la mosquée après la prière et de son point de vue selon lequel l'islam et la science ne sont pas en conflit."
