label:
  ar: "المستدرك على الصحيحين للحاكم — وفي ذيله تلخيص المستدرك للذهبي، مطبعة مجلس دائرة المعارف النظامية، حيدرآباد الدكن 1341هـ، الجزء الثالث"
  en: "al-Mustadrak 'ala al-Sahihayn of al-Hakim — with al-Dhahabi's Talkhis al-Mustadrak beneath, Majlis Da'irat al-Ma'arif al-Nizamiyya press, Hyderabad Deccan 1341 AH, vol. 3"
summary:
  ar: "الطبعة الأولى بمطبعة مجلس دائرة المعارف النظامية بحيدرآباد الدكن، الجزء الثالث (سنة 1341هـ على صفحة العنوان)، وفي ذيله «تلخيص المستدرك» للذهبي الذي «نبه فيه على تساهله وتصحيحه»؛ يبدأ بكتاب الهجرة ويشتمل على المغازي ومعرفة الصحابة، وفي آخره فهرس الأسماء والكنى. هذه هي الطبعة القديمة التي تحيل إليها أرقام الأجزاء والصفحات في مقدمة مقبل الوادعي."
  en: "The first printing at the press of the Majlis Da'irat al-Ma'arif al-Nizamiyya, Hyderabad Deccan, vol. 3 (1341 AH on the title page), with al-Dhahabi's Talkhis al-Mustadrak beneath the text, in which he 'drew attention to its laxity and its authentications'; it begins with the Book of the Hijra and contains the Campaigns and the Knowledge of the Companions, ending with an index of names and kunyas. This is the old printing to which the volume and page numbers in Muqbil al-Wadi'i's introduction refer."
