label:
  ar: "المستدرك على الصحيحين للحاكم — وفي ذيله تلخيص المستدرك للذهبي، مطبعة مجلس دائرة المعارف النظامية، حيدرآباد الدكن 1341هـ، الجزء الثالث"
  en: "al-Mustadrak 'ala al-Sahihayn of al-Hakim — with al-Dhahabi's Talkhis al-Mustadrak beneath, Majlis Da'irat al-Ma'arif al-Nizamiyya press, Hyderabad Deccan 1341 AH, vol. 3"
summary:
  ar: "الطبعة الأولى بمطبعة مجلس دائرة المعارف النظامية بحيدرآباد الدكن، الجزء الثالث ⁦(سنة 1341هـ على صفحة العنوان)⁩، وفي ذيله «تلخيص المستدرك» للذهبي الذي «نبه فيه على تساهله وتصحيحه»؛ يبدأ بكتاب الهجرة ويشتمل على المغازي ومعرفة الصحابة، وفي آخره فهرس الأسماء والكنى. هذه هي الطبعة القديمة التي تحيل إليها أرقام الأجزاء والصفحات في مقدمة مقبل الوادعي."
  en: "The first printing at the press of the Majlis Da'irat al-Ma'arif al-Nizamiyya, Hyderabad Deccan, vol. 3 (1341 AH on the title page), with al-Dhahabi's Talkhis al-Mustadrak beneath the text, in which he 'drew attention to its laxity and its authentications'; it begins with the Book of the Hijra and contains the Campaigns and the Knowledge of the Companions, ending with an index of names and kunyas. This is the old printing to which the volume and page numbers in Muqbil al-Wadi'i's introduction refer."
  es: "La primera edición impresa en la imprenta del Majlis Da'irat al-Ma'arif al-Nizamiyya, Hyderabad Deccan, vol. 3 (1341 AH en la portada), con el Talkhis al-Mustadrak de al-Dhahabi debajo del texto, en el que «llamaba la atención sobre su laxitud y sus autenticaciones»; comienza con el Libro de la Hégira y contiene las Campañas y el Conocimiento de los Compañeros, finalizando con un índice de nombres y kunyas. Esta es la edición antigua a la que se refieren los números de volumen y página en la introducción de Muqbil al-Wadi'i."
  fr: "Première édition imprimée à l'imprimerie du Majlis Da'irat al-Ma'arif al-Nizamiyya, Hyderabad Deccan, vol. 3 (1341 AH sur la page de titre), avec le commentaire d'al-Dhahabi, Talkhis al-Mustadrak, en marge du texte, où il « attire l'attention sur son caractère imprécis et ses authentifications »; elle commence par le Livre de l'Hégire et contient les Campagnes et la Connaissance des Compagnons, se terminant par un index des noms et des kunyas. C'est à cette ancienne édition que font référence les numéros de volume et de page dans l'introduction de Muqbil al-Wadi'i."
  ur: "مجلس دعوت المعارف النظامیہ، حیدرآباد دکن کے پریس میں پہلی طباعت، جلد 1۔ 3 ⁦(عنوان صفحہ پر 1341ھ)⁩، متن کے نیچے الذہبی کی تلخیص المستدرک کے ساتھ، جس میں انہوں نے 'اس کی سستی اور اس کی توثیق کی طرف توجہ مبذول کروائی'؛ اس کا آغاز کتاب ہجرہ سے ہوتا ہے اور اس میں صحابہ کی مہمات اور علم شامل ہیں، اس کا اختتام ناموں اور کنیوں کے اشاریہ پر ہوتا ہے۔ یہ پرانی طباعت ہے جس کی طرف مقبل الوادی کے تعارف میں جلد اور صفحہ نمبر اشارہ کرتے ہیں۔"
  tr: "İlk baskı, Haydarabad, Deccan'daki Nizamiyya Ansiklopedisi Konseyi'nin üçüncü ciltinde (başlık sayfasında 1341 Hicri yılı) ve sonunda el-Dhahabi'nin 'Konuşması el-Mustadrak' yer alır; burada 'hoşgörü ve düzeltme belirtmiştir'; kitap 'Hicre' kitabıyla başlar ve Maghazi ile Ma'rifat al-Sahabah'ı içerir, ayrıca isim ve kunya diziniyle sona erer. Bu, Muqbil al-Wadi'i'nin giriş cildi ve sayfa numaralarına atıfta bulunulan eski baskıdır."
  id: "Edisi pertama ada di Percetakan Dewan Ensiklopedia Nizamiyya di Hyderabad, Deccan, jilid tiga (tahun 1341 H di halaman judul), dan di akhir adalah 'Talkhis al-Mustadrak' oleh al-Dhahabi, di mana ia 'menunjukkan keringanan dan koreksi'; dimulai dengan buku 'Al-Hijrah' dan mencakup Maghazi serta Ma'rifat al-Sahabah, dan diakhiri dengan indeks nama dan kunya. Ini adalah edisi lama yang dirujuk pada jilid dan nomor halaman dalam pengantar Muqbil al-Wadi'i."
