  id: "Elemen Wikidata Q1391723 tentang Naguib Sawiris: seorang pengusaha Mesir; tanggal lahirnya disebutkan 15 Juni 1954, dan dua saudaranya Nasif dan Samih, serta agamanya didasarkan pada satu pernyataan struktural, yaitu Gereja Ortodoks Koptik."
