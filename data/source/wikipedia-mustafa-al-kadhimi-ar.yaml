  ar: "مقالة ويكيبيديا العربية عن مصطفى الكاظمي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 5 تموز 1967 بمنطقة الكاظمية في بغداد، وسلفه عادل عبد المهدي وخلفه محمد شياع السوداني، ولا تسمّي انتماءً دينيًا شخصيًا له في نصها وتصنّفه ضمن «شيعة عراقيون» وهو تصنيف ملفات."
  en: "Arabic Wikipedia article on Mustafa Al-Kadhimi; used for entity facts only. It gives his birth on 5 July 1967 in the Kadhimiya district of Baghdad, his predecessor Adel Abdul Mahdi and his successor Mohammed Shia' al-Sudani. It names no personal religious affiliation in its text and files him under 'Iraqi Shia', a category filing."
