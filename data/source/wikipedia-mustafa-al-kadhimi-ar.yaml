summary:
  ar: "مقالة ويكيبيديا العربية عن مصطفى الكاظمي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 5 تموز 1967 بمنطقة الكاظمية في بغداد، وسلفه عادل عبد المهدي وخلفه محمد شياع السوداني، ولا تسمّي انتماءً دينيًا شخصيًا له في نصها وتصنّفه ضمن «شيعة عراقيون» وهو تصنيف ملفات."
  en: "Arabic Wikipedia article on Mustafa Al-Kadhimi; used for entity facts only. It gives his birth on 5 July 1967 in the Kadhimiya district of Baghdad, his predecessor Adel Abdul Mahdi and his successor Mohammed Shia' al-Sudani. It names no personal religious affiliation in its text and files him under 'Iraqi Shia', a category filing."
  es: "Artículo de Wikipedia en árabe sobre Mustafa Al-Kadhimi; utilizado únicamente para datos sobre la persona. Indica que nació el 5 de julio de 1967 en el distrito de Kadhimiya, Bagdad, y menciona a su predecesor, Adel Abdul Mahdi, y a su sucesor, Mohammed Shia' al-Sudani. No especifica su afiliación religiosa y lo clasifica como «chiíta iraquí»."
  fr: "L'article de Wikipédia en arabe consacré à Mustafa Al-Kadhimi, utilisé uniquement à des fins d'information sur l'entité, indique sa naissance le 5 juillet 1967 dans le quartier de Kadhimiya à Bagdad, ainsi que les noms de son prédécesseur Adel Abdul Mahdi et de son successeur Mohammed Shia' al-Sudani. Aucune appartenance religieuse personnelle n'est mentionnée, et Mustafa Al-Kadhimi est classé dans la catégorie « Chiite irakien »."
  ur: "مصطفی الکاظمی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے 5 جولائی 1967 کو بغداد کے کادھیمیہ ضلع میں اس کے پیشرو عادل عبدالمہدی اور اس کے جانشین محمد شیعہ السودانی کو جنم دیا۔ اس نے اپنے متن میں کسی ذاتی مذہبی وابستگی کا نام نہیں لیا ہے اور اسے 'عراقی شیعہ' کے تحت فائل کیا ہے، ایک زمرہ فائلنگ۔"
