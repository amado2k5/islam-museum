summary:
  ar: "مدخل موسوعة بريتانيكا عن بينظير بوتو؛ يؤكد أنها أول امرأة ترأس حكومة بلد مسلم، ويؤرخ توليها رئاسة الوزراء في 1 ديسمبر 1988، ويختصر اغتيالها في 27 ديسمبر 2007، ولا يذكر لها مذهبًا."
  en: "Encyclopaedia Britannica entry on Benazir Bhutto; it confirms her as the first woman to head the government of a Muslim country, dates her becoming prime minister to 1 December 1988, and summarises her assassination on 27 December 2007. It names no sect for her."
  es: "Entrada de la Enciclopedia Británica sobre Benazir Bhutto; la confirma como la primera mujer en encabezar el gobierno de un país musulmán, fecha su nombramiento como primera ministra el 1 de diciembre de 1988 y resume su asesinato el 27 de diciembre de 2007. No menciona ninguna secta a la que pertenezca."
  fr: "L'article de l'Encyclopædia Britannica sur Benazir Bhutto confirme qu'elle est la première femme à diriger le gouvernement d'un pays musulman, date son accession au poste de Premier ministre du 1er décembre 1988 et résume son assassinat le 27 décembre 2007. Il ne mentionne aucune secte à laquelle elle appartenait."
  ur: "بینظیر بھٹو پر انسائیکلوپیڈیا برٹانیکا کا اندراج؛ یہ اس کی تصدیق کرتا ہے کہ وہ ایک مسلم ملک کی حکومت کی سربراہی کرنے والی پہلی خاتون ہیں، ان کی وزیر اعظم بننے کی تاریخ 1 دسمبر 1988 ہے، اور 27 دسمبر 2007 کو ان کے قتل کا خلاصہ بیان کرتا ہے۔ اس میں ان کے لیے کسی فرقے کا نام نہیں لیا گیا ہے۔"
