summary:
  ar: "مدخل موسوعة بريتانيكا عن بينظير بوتو؛ يؤكد أنها أول امرأة ترأس حكومة بلد مسلم، ويؤرخ توليها رئاسة الوزراء في 1 ديسمبر 1988، ويختصر اغتيالها في 27 ديسمبر 2007، ولا يذكر لها مذهبًا."
  en: "Encyclopaedia Britannica entry on Benazir Bhutto; it confirms her as the first woman to head the government of a Muslim country, dates her becoming prime minister to 1 December 1988, and summarises her assassination on 27 December 2007. It names no sect for her."
