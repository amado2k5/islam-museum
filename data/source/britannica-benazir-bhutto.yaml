reliability_note: "Reference entry read in full on 25 October 2026. Used for entity facts: her education at Radcliffe and Oxford, her return to Pakistan shortly before her father's ouster in Zia-ul-Haq's coup, her leadership of the PPP in exile and at home, her two premierships and dismissals, her self-imposed exile and return, and her assassination at Rawalpindi on 27 December 2007. It dates her becoming prime minister to 1 December 1988, one day before the swearing-in date (2 December) given by the English article; the variant is recorded in the person record's prose. It names no religion or school for her — one of the silences the faith note records."
