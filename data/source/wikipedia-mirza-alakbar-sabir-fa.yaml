summary:
  ar: 'مقالة ويكيبيديا الفارسية عن ميرزا علي أكبر صابر؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في شماخي في 30 مايو 1862 ووفاته في شماخي في 12 يوليو 1911، وتذكر أسماءه القلمية: ميرت وصابر وهوپ هوپ وفاصل.'
  en: Persian Wikipedia article on Mirza Alakbar Sabir; used for entity facts only. It gives his birth at Shamakhi on 30 May 1862 and death at Shamakhi on 12 July 1911, and lists his pseudonyms as Mirat, Sabir, Hop-Hop and Fasil.
  es: "Artículo de Wikipedia en persa sobre Mirza Alakbar Sabir; utilizado únicamente para datos sobre la persona. Indica que nació en Shamakhi el 30 de mayo de 1862 y falleció en Shamakhi el 12 de julio de 1911, y enumera sus seudónimos como Mirat, Sabir, Hop-Hop y Fasil."
  fr: "Article Wikipédia en persan sur Mirza Alakbar Sabir; utilisé uniquement pour les informations sur l’individu. Il indique sa naissance à Shamakhi le 30 mai 1862 et son décès à Shamakhi le 12 juillet 1911, et mentionne ses pseudonymes: Mirat, Sabir, Hop-Hop et Fasil."
  ur: "مرزا الکبر صابر پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 30 مئی 1862 کو شماکھی میں ان کی پیدائش اور 12 جولائی 1911 کو شماکھی میں انتقال کرتا ہے، اور اس کے تخلص کو میرات، صابر، ہاپ ہاپ اور فاصل کے طور پر درج کرتا ہے۔"
  tr: "Farsça Vikipedi'deki Mirza Ali Akbar Sabir makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 30 Mayıs 1862'de Şamakhi'de doğdu ve 12 Temmuz 1911'de Şamakhi'de öldü; takma adlarını kullandı: Mert, Saber, Hope Hope ve Fasel."
  id: "Artikel Wikipedia Persia tentang Mirza Ali Akbar Sabir hanya digunakan untuk fakta entitas tersebut. Ia lahir di Shamakhi pada 30 Mei 1862, dan meninggal di Shamakhi pada 12 Juli 1911, dengan menyebut nama penanya: Mert, Saber, Hope Hope, dan Fasel."
