summary:
  ar: "مدخل «شيخ» في موسوعة TDV الإسلامية: اللقب في معانيه العديدة، منها شيخ القبيلة بوصفه رئيسها وحكمها لا آمرها المطلق، وألقاب الشيخ عند العلماء والمؤسسات والدول."
  en: "The TDV İslâm Ansiklopedisi entry on shaykh: the title's many senses, including the tribal shaykh as the tribe's head and arbiter rather than absolute commander, and the title's uses among scholars, institutions and states."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre shaykh: los múltiples sentidos del título, incluyendo el del shaykh tribal como jefe y árbitro de la tribu en lugar de comandante absoluto, y los usos del título entre académicos, instituciones y estados."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur shaykh: les nombreux sens du titre, y compris le shaykh tribal en tant que chef et arbitre de la tribu plutôt que commandant absolu, et les usages du titre parmi les érudits, les institutions et les États."
  ur: "شیخ پر TDV İslâm Ansiklopedisi کا اندراج: عنوان کے بہت سے حواس ہیں، بشمول قبائلی شیخ بطور مطلق کمانڈر کے بجائے قبیلے کے سربراہ اور ثالث کے طور پر، اور علماء، اداروں اور ریاستوں کے درمیان اس عنوان کے استعمال۔"
