  en: "Urdu Wikipedia article on Rached Ghannouchi; used for entity facts only. A short article confirming his birth on 22 June 1941, his birth name Rashid al-Khriji, and his role as co-founder and intellectual leader of the Ennahda Party."
  es: "Artículo de Wikipedia en urdu sobre Rached Ghannouchi; utilizado únicamente para datos sobre la persona. Un breve artículo que confirma su nacimiento el 22 de junio de 1941, su nombre de nacimiento Rashid al-Khriji y su papel como cofundador y líder intelectual del Partido Ennahda."
  fr: "Article de Wikipédia en ourdou sur Rached Ghannouchi; utilisé uniquement à des fins d’information sur l’entité. Ce court article confirme sa naissance le 22 juin 1941, son nom de naissance Rashid al-Khriji et son rôle de cofondateur et de chef intellectuel du parti Ennahda."
  ur: "Rached Ghannouchi پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 22 جون 1941 کو ان کی پیدائش، ان کا پیدائشی نام راشد الخریجی، اور النہضہ پارٹی کے شریک بانی اور دانشور رہنما کے طور پر ان کے کردار کی تصدیق کرنے والا ایک مختصر مضمون۔"
  tr: "Rached Ghannouchi hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 22 Haziran 1941'de doğumunu doğrulayan kısa bir makale, doğum adının Rached Al-Khuraisi olduğunu ve Ennahda Partisi'nin kurucu ortağı ve entelektüel lideri olarak rolüyle ilgilidir."
  id: "Artikel Wikipedia Urdu tentang Rached Ghannouchi; hanya digunakan untuk fakta entitas. Sebuah artikel singkat yang mengonfirmasi kelahirannya pada 22 Juni 1941, namanya saat lahir adalah Rached Al-Khuraisi, dan perannya sebagai mitra pendiri serta pemimpin intelektual Partai Ennahda."
