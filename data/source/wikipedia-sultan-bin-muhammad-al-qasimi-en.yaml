summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سلطان بن محمد القاسمي، حاكم الشارقة؛ يذكر قسم الأسرة فيها أبناء زوجته الثانية جواهر بنت محمد القاسمي: بدور ⁦(مواليد 1978)⁩ ونور (1979) وحور (1980) وخالد (1980–2019) — وهو النص الذي يثبت أن بدور وحور شقيقتان."
  en: "English Wikipedia article on Sultan bin Muhammad Al-Qasimi, Ruler of Sharjah; its family section lists the children of his second wife, Jawaher bint Mohammed Al Qasimi, as Bodour (born 1978), Noor (born 1979), Hoor (born 1980) and Khalid (1980–2019) — the text attesting that Bodour and Hoor are full sisters."
  es: "Artículo de la Wikipedia en inglés sobre el sultán bin Muhammad Al-Qasimi, gobernante de Sharjah; en su sección familiar se enumeran los hijos de su segunda esposa, Jawaher bint Mohammed Al Qasimi, como Bodour (nacida en 1978), Noor (nacida en 1979), Hoor (nacida en 1980) y Khalid (1980-2019); el texto atestigua que Bodour y Hoor son hermanas de padre y madre."
  fr: "Article de Wikipédia en anglais sur Sultan bin Muhammad Al-Qasimi, souverain de Sharjah; sa section famille liste les enfants de sa deuxième épouse, Jawaher bint Mohammed Al Qasimi, comme Bodour (née en 1978), Noor (née en 1979), Hoor (née en 1980) et Khalid (1980-2019) — le texte attestant que Bodour et Hoor sont sœurs à part entière."
  ur: "شارجہ کے حکمران سلطان بن محمد القاسمی پر انگریزی ویکیپیڈیا کا مضمون؛ اس کے خاندانی حصے میں ان کی دوسری بیوی، جواہر بنت محمد القاسمی کے بچوں کی فہرست دی گئی ہے، بطور بودور ⁦(پیدائش 1978)⁩، نور ⁦(پیدائش 1979)⁩، حور ⁦(پیدائش 1980)⁩ اور خالد (1980–2019) - یہ متن اس بات کی تصدیق کرتا ہے کہ بدور اور حور مکمل بہنیں ہیں۔"
