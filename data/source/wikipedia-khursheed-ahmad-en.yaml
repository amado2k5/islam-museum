summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0625\u0646\u062c\u0644\u064a\u0632\u064a\u0629 \u0639\u0646 \u0645\u0646\u0634\u062f \u0627\u0644\u0646\u0639\u062a \u0627\u0644\u0628\u0627\u0643\u0633\u062a\u0627\u0646\u064a \u062e\u0648\u0631\u0634\u064a\u062f \u0623\u062d\u0645\u062f\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u0631\u062d\u064a\u0645 \u064a\u0627\u0631 \u062e\u0627\u0646 \u0641\u064a 1 \u064a\u0646\u0627\u064a\u0631 1956\u060c \u0648\u0627\u0646\u062a\u0642\u0627\u0644\u0647 \u0625\u0644\u0649 \u0643\u0631\u0627\u062a\u0634\u064a \u0648\u0625\u0630\u0627\u0639\u0629 \u0628\u0627\u0643\u0633\u062a\u0627\u0646 \u0641\u064a 1973\u060c \u0648\u0641\u0648\u0632\u0647 \u0628\u0645\u0633\u0627\u0628\u0642\u0629 \u0627\u0644\u0646\u0639\u062a \u0641\u064a \u0627\u0644\u062a\u0644\u0641\u0632\u064a\u0648\u0646 \u0627\u0644\u0628\u0627\u0643\u0633\u062a\u0627\u0646\u064a \u0641\u064a 1978\u060c \u0648\u0646\u0639\u0648\u062a\u0647 \u0627\u0644\u0645\u0634\u0647\u0648\u0631\u0629\u060c \u0648\u0648\u0633\u0627\u0645 \u062d\u0633\u0646 \u0627\u0644\u0623\u062f\u0627\u0621 \u0641\u064a 1996\u060c \u0648\u0648\u0641\u0627\u062a\u0647 \u0641\u064a \u0643\u0631\u0627\u062a\u0634\u064a \u0641\u064a 30 \u0623\u063a\u0633\u0637\u0633 2007\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u062f\u0627\u0648\u0646 (31 \u0623\u063a\u0633\u0637\u0633 2007)."
  en: "English Wikipedia article on the Pakistani naat reciter Khursheed Ahmad; entity facts only: birth at Rahim Yar Khan on 1 January 1956, his move to Karachi and Radio Pakistan in 1973, first place in PTV's naat competition in 1978, his best-known naats, the Pride of Performance in 1996, and death in Karachi on 30 August 2007; it cites Dawn (31 August 2007)."
