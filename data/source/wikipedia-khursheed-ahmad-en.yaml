summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن منشد النعت الباكستاني خورشيد أحمد؛ لوقائع الكيان فقط: مولده في رحيم يار خان في 1 يناير 1956، وانتقاله إلى كراتشي وإذاعة باكستان في 1973، وفوزه بمسابقة النعت في التلفزيون الباكستاني في 1978، ونعوته المشهورة، ووسام حسن الأداء في 1996، ووفاته في كراتشي في 30 أغسطس 2007؛ وتستند إلى داون ⁦(31 أغسطس 2007)⁩."
  en: "English Wikipedia article on the Pakistani naat reciter Khursheed Ahmad; entity facts only: birth at Rahim Yar Khan on 1 January 1956, his move to Karachi and Radio Pakistan in 1973, first place in PTV's naat competition in 1978, his best-known naats, the Pride of Performance in 1996, and death in Karachi on 30 August 2007; it cites Dawn (31 August 2007)."
  es: "Artículo de la Wikipedia en inglés sobre el recitador de naat pakistaní Khursheed Ahmad; solo datos sobre la persona: nacimiento en Rahim Yar Khan el 1 de enero de 1956, su traslado a Karachi y Radio Pakistán en 1973, primer lugar en el concurso de naat de PTV en 1978, sus naats más conocidos, el premio Pride of Performance en 1996, y muerte en Karachi el 30 de agosto de 2007; cita a Dawn (31 de agosto de 2007)."
  fr: "Article de Wikipédia en anglais sur le récitant de naats pakistanais Khursheed Ahmad; faits concernant uniquement l’entité: naissance à Rahim Yar Khan le 1er janvier 1956, son déménagement à Karachi et à Radio Pakistan en 1973, première place au concours de naats de PTV en 1978, ses naats les plus connus, Pride of Performance en 1996, et décès à Karachi le 30 août 2007; il cite Dawn (31 août 2007)."
  ur: "پاکستانی نعت خوان خورشید احمد پر انگریزی ویکیپیڈیا کا مضمون؛ ہستی کے حقائق صرف: یکم جنوری 1956 کو رحیم یار خان میں پیدائش، 1973 میں کراچی اور ریڈیو پاکستان منتقل، 1978 میں پی ٹی وی کے نعت مقابلے میں پہلی پوزیشن، ان کی مشہور نعتیں، 1996 میں پرائیڈ آف پرفارمنس، اور 30 اگست 2007 کو کراچی میں وفات؛ اس نے ڈان ⁦(31 اگست 2007)⁩ کا حوالہ دیا ہے۔"
  tr: "Pakistanlı övgü şarkıcısı Khurshid Ahmed hakkında İngilizce Wikipedia makalesi; sadece varlık etkinlikleri için: 1 Ocak 1956'da Rahim Yar Khan'da doğumu, 1973'te Karachi ve Pakistan Radyosu'na taşınması, 1978'de Pakistan Television Najm yarışmasını kazanması, 1996'da ünlü ölüm ilanı Mükemmellik Madalyası ve 30 Ağustos 2007'de Karaçi'de vefatı; Dawn (31 Ağustos 2007) programına dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang penyanyi pidato perpisahan Pakistan Khurshid Ahmed; untuk acara entitas saja: kelahirannya di Rahim Yar Khan pada 1 Januari 1956, kepindahannya ke Karachi dan Pakistan Radio pada 1973, kemenangannya dalam kompetisi Pakistan Television Najm pada 1978, obituari terkenalnya, Medal of Excellence pada 1996, dan kematiannya di Karachi pada 30 Agustus 2007; berdasarkan Dawn (31 Agustus 2007)."
