summary:
  ar: "مدخل «داود آغا» في موسوعة TDV الإسلامية التركية بقلم سماوي أيجه (المجلد 9، إسطنبول 1994، ص 24–26)، ويتناول عمله مشرفاً على مياه المدينة ثم رئيساً للمعماريين بعد وفاة سنان، وأعماله في القصر وعلى أسوار الساحل، والكتابات التي تذكر اسمه، والروايتين المختلفتين عن وفاته."
  en: "The TDV İslâm Ansiklopedisi entry 'DÂVUD AĞA' by Semavi Eyice (vol. 9, Istanbul 1994, pp. 24–26). It covers his career as superintendent of the water works and then chief architect after Sinan's death, his works in the palace and on the shore walls, the inscriptions that name him, and two differing accounts of his death."
title: "DÂVUD AĞA"
author: [{ family: "Eyice", given: "Semavi" }]
issued: { "date-parts": [[1994]] }
publisher: "TDV İslâm Araştırmaları Merkezi, TDV İslâm Ansiklopedisi, vol. 9 (Istanbul, 1994), pp. 24–26; web edition"
URL: "https://islamansiklopedisi.org.tr/davud-aga"
language: tr
reliability_note: "Read in full on 1 November 2026 in the web edition at islamansiklopedisi.org.tr/davud-aga. The entry's bibliography (the Ahkâm-ı Mâliye register nr. 7534, Selânikî, Ayvansarayî's Hadîkatü'l-cevâmi', Ahmed Refik and others) is cited through the entry and was not opened. The entry reports two accounts of his death, a plague death in 1598 and a killing in Vefa square, and does not settle between them; this record keeps both as debated."
