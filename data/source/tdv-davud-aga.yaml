summary:
  ar: "مدخل «داود آغا» في موسوعة TDV الإسلامية التركية بقلم سماوي أيجه ⁦(المجلد 9، إسطنبول 1994، ص 24–26)⁩، ويتناول عمله مشرفاً على مياه المدينة ثم رئيساً للمعماريين بعد وفاة سنان، وأعماله في القصر وعلى أسوار الساحل، والكتابات التي تذكر اسمه، والروايتين المختلفتين عن وفاته."
  en: "The TDV İslâm Ansiklopedisi entry 'DÂVUD AĞA' by Semavi Eyice (vol. 9, Istanbul 1994, pp. 24–26). It covers his career as superintendent of the water works and then chief architect after Sinan's death, his works in the palace and on the shore walls, the inscriptions that name him, and two differing accounts of his death."
  es: "La entrada «DÂVUD AĞA» de la TDV İslâm Ansiklopedisi, de Semavi Eyice (vol. 9, Estambul, 1994, págs. 24-26), abarca su trayectoria como superintendente de las obras hidráulicas y, posteriormente, como arquitecto jefe tras la muerte de Sinan, sus obras en el palacio y en los muros de la costa, las inscripciones que lo mencionan y dos versiones diferentes sobre su fallecimiento."
  fr: "L'article « DÂVUD AĞA » de Semavi Eyice (vol. 9, Istanbul 1994, pp. 24–26) dans la TDV İslâm Ansiklopedisi retrace sa carrière de surintendant des travaux hydrauliques puis d'architecte en chef après la mort de Sinan, ses travaux au palais et sur les digues, les inscriptions qui le mentionnent, ainsi que deux versions différentes des circonstances de sa mort."
  ur: "TDV İslâm Ansiklopedisi اندراج 'DÂVUD AĞA' از سیماوی آئس ⁦(جلد 9، استنبول 1994، صفحہ 24-26)⁩۔ اس میں سنان کی موت کے بعد واٹر ورکس کے سپرنٹنڈنٹ اور پھر چیف آرکیٹیکٹ کے طور پر ان کے کیرئیر، محل اور ساحل کی دیواروں پر ان کے کام، ان کے نام کے نوشتہ جات، اور ان کی موت کے دو مختلف واقعات کا احاطہ کیا گیا ہے۔"
  tr: "Samavi Ayce'nin Türk İslami TDV Ansiklopedisi'ndeki \"Davud Ağa\" girişi (Cilt 9, İstanbul 1994, ss. 24–26), şehrin sularının denetçisi olarak yaptığı çalışmaları, ardından Sinan'ın ölümünden sonra baş mimar olarak yaptığı çalışmaları, saray ve sahil duvarlarındaki eserlerini, adını geçen yazıları ve ölümüne dair iki farklı anlatımı ele alır."
  id: "Entri \"Dawood Agha\" dalam Ensiklopedia TDV Islam Turki oleh Samavi Ayce (Vol. 9, Istanbul 1994, hlm. 24–26), membahas pekerjaannya sebagai pengawas perairan kota dan kemudian sebagai arsitek utama setelah kematian Sinan, karya-karyanya di istana dan tembok pantai, tulisan yang menyebut namanya, serta dua kisah berbeda tentang kematiannya."
title: "DÂVUD AĞA"
