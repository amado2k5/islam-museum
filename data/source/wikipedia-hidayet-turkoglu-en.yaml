summary:
  ar: "مقال موسوعي عن هيدو توركوغلو ⁦(مواليد 1979)⁩: ميلاده في 19 مارس 1979 في غازي عثمان باشا بإسطنبول، ومواسمه الخمسة عشر في NBA، وجائزة اللاعب الأكثر تطوراً 2007–08، ورئاسته الاتحاد التركي لكرة السلة منذ أكتوبر 2016. ويذكر المقال عنه نفسه أنه مسلم، دون أن يسمي مذهباً."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth on 19 March 1979 at Gaziosmanpaşa, Istanbul, his fifteen NBA seasons with six teams, the 2007–08 Most Improved Player award, and his presidency of the Turkish Basketball Federation since October 2016. Its biographical section states of the man himself: 'He is a Muslim.' It names no school."
  es: "Artículo de enciclopedia editado por la comunidad, recuperado íntegramente en la revisión indicada; menciona su nacimiento el 19 de marzo de 1979 en Gaziosmanpaşa, Estambul, sus quince temporadas en la NBA con seis equipos, el premio al Jugador Más Mejorado de la temporada 2007-08 y su presidencia de la Federación Turca de Baloncesto desde octubre de 2016. Su sección biográfica afirma sobre él: «Es musulmán». No menciona ninguna escuela."
  fr: "Article encyclopédique collaboratif, consulté intégralement à la version indiquée; il mentionne sa naissance le 19 mars 1979 à Gaziosmanpaşa, Istanbul, ses quinze saisons en NBA au sein de six équipes, le prix du joueur ayant le plus progressé en 2007-2008 et sa présidence de la Fédération turque de basketball depuis octobre 2016. Sa biographie précise à son sujet: « Il est musulman. » Aucune école n’est mentionnée."
  ur: "کمیونٹی میں ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظرثانی پر مکمل طور پر بازیافت کیا گیا؛ اس کی پیدائش 19 مارچ 1979 کو استنبول کے گازیوسمانپاسا میں ہوئی، اس کے NBA کے پندرہ سیزن چھ ٹیموں کے ساتھ، 2007-08 کا سب سے بہتر کھلاڑی کا ایوارڈ، اور اکتوبر 2016 سے ترک باسکٹ بال فیڈریشن کی صدارت۔ اس میں کسی اسکول کا نام نہیں ہے۔"
  tr: "Hedo Türkoğlu (d. 1979) hakkında ansiklopedik bir makale: 19 Mart 1979'da İstanbul'un Gaziosmanpaşa kentinde doğmuş, NBA'deki on beş sezonu, 2007–08 yıllarında En Çok Gelişen Oyuncu ödülünü kazanmış ve Ekim 2016'dan beri Türk Basketbol Federasyonu başkanlığını yapmıştır. Makalede, kendisinin Müslüman olduğu belirtilmiş, ancak bir mezhep belirtilmiştir."
  id: "Sebuah artikel ensiklopedis tentang Hedo Turkoglu (lahir 1979): lahir pada 19 Maret 1979 di Gaziosmanpasa, Istanbul, lima belas musimnya di NBA, penghargaan Pemain Paling Berkembang 2007–08, dan menjabat sebagai presiden Federasi Bola Basket Turki sejak Oktober 2016. Artikel tersebut menyebutkan bahwa dia sendiri beragama Muslim, tanpa menyebutkan sekte."
