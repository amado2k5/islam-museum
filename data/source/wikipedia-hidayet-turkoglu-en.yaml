  ar: "مقال موسوعي عن هيدو توركوغلو (مواليد 1979): ميلاده في 19 مارس 1979 في غازي عثمان باشا بإسطنبول، ومواسمه الخمسة عشر في NBA، وجائزة اللاعب الأكثر تطوراً 2007–08، ورئاسته الاتحاد التركي لكرة السلة منذ أكتوبر 2016. ويذكر المقال عنه نفسه أنه مسلم، دون أن يسمي مذهباً."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth on 19 March 1979 at Gaziosmanpaşa, Istanbul, his fifteen NBA seasons with six teams, the 2007–08 Most Improved Player award, and his presidency of the Turkish Basketball Federation since October 2016. Its biographical section states of the man himself: 'He is a Muslim.' It names no school."
