summary:
  ar: "مقالة ويكيبيديا العربية المطولة عن حسين باي الأول؛ تُستخدم لوقائع الكيان فقط. متنها يجعل مولده سنة 1675 بالكاف وبيعته في 12 تموز 1705 وتجددها الرسمي في 15 تموز، وإن أعطت بياناتها البنيوية وتصنيفاتها مولده سنة 1669 ووفاته سنة 1153هـ بالقيروان."
  en: "Arabic Wikipedia article on Husayn Bey I, a long article; used for entity facts only. Its prose gives his birth in 1675 at Le Kef, his acclamation on 12 July 1705 and formal investiture on 15 July, and his career under the last Muradid beys and Ibrahim Sharif; its structured fields and categories instead give a 1669 birth — the year the queue row carried — and a death in 1153 AH at Kairouan. The internal split is preserved in the person record's debated blocks."
  es: "Artículo de Wikipedia en árabe sobre Husayn Bey I, un artículo extenso; utilizado únicamente para datos sobre la persona. Su prosa indica su nacimiento en 1675 en Le Kef, su aclamación el 12 de julio de 1705 y su investidura formal el 15 de julio, así como su trayectoria bajo los últimos beys Muradid e Ibrahim Sharif; sin embargo, sus campos y categorías estructurados indican un nacimiento en 1669 —el año que indica la fila de la cola— y una muerte en 1153 AH en Kairouan. Esta división interna se conserva en los bloques debatidos del registro de la persona."
  fr: "L'article de Wikipédia en arabe consacré à Husayn Bey Ier est un long article, utilisé uniquement pour les informations le concernant. Le texte indique sa naissance en 1675 à Le Kef, son acclamation le 12 juillet 1705 et son investiture officielle le 15 juillet, ainsi que son mandat sous les derniers beys muradides et Ibrahim Sharif. Cependant, la structure de sa fiche mentionne une naissance en 1669 (année retenue par l'ordre chronologique) et un décès en 1153 AH à Kairouan. Cette divergence interne est conservée dans les sections controversées de sa fiche."
  ur: "حسین بی اول پر عربی ویکیپیڈیا مضمون، ایک طویل مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا نثر 1675 میں لی کیف میں اس کی پیدائش، 12 جولائی 1705 کو اس کی تعریف اور 15 جولائی کو رسمی سرمایہ کاری، اور آخری مرید بے اور ابراہیم شریف کے تحت اس کا کیریئر؛ اس کے ڈھانچے والے میدان اور زمرہ جات 1669 کی پیدائش دیتے ہیں - جس سال قطار کی قطار چلی تھی - اور 1153 ہجری میں کیروان میں موت۔ اندرونی تقسیم شخصی ریکارڈ کے زیر بحث بلاکس میں محفوظ ہے۔"
