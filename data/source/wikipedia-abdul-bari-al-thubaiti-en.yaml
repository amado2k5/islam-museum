  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الباري الثبيتي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1960 (1380هـ) بمكة، وإمامته ضيفاً للتراويح بالمسجد الحرام بين 1990 و1993، وإمامته وخطابته بالمسجد النبوي من 1994، ودكتوراه الفقه سنة 2001، وتنسب انسحابه من التراويح إلى سرطان الغدة الدرقية؛ وصندوقها يعطي الدين الإسلام فقط دون خانات للطائفة أو الفقه."
  en: "English Wikipedia article on Abdul Bari Al-Thubaiti; used for entity facts only. It gives his birth in 1960 (1380 AH) at Mecca, his guest imamate for Tarawih at Masjid al-Haram from 1990 to 1993, his imamate and khutba at the Prophet's Mosque from 1994, and his doctorate in fiqh in 2001, attributing his withdrawal from Tarawih to thyroid cancer; its infobox gives religion Islam only, with no denomination or jurisprudence fields."
