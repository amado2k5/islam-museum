  ar: "ترجمة سوما دين في صفحة حكّام جوائز الكتّاب المسلمين الشباب لسنة 2014: مؤلفة عناوين تعليمية للأطفال وكتاب «مدّ الروح» (Turning the Tide) للنساء، وتدرّس في قطاع تعليم الكبار في باكينغهامشير حيث تقيم مع أسرتها، وتشارك في قيادة مجموعة شبابية للفتيات وبرامج حوار الأديان."
  en: "The Young Muslim Writers Awards 2014 judges' biography of Suma Din: author of children's educational titles and of Turning the Tide for women; she teaches in the adult education sector in Buckinghamshire, where she lives with her family, co-leads a girls' youth group and takes part in interfaith programmes."
