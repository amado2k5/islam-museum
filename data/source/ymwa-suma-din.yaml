summary:
  ar: "ترجمة سوما دين في صفحة حكّام جوائز الكتّاب المسلمين الشباب لسنة 2014: مؤلفة عناوين تعليمية للأطفال وكتاب «مدّ الروح» (Turning the Tide) للنساء، وتدرّس في قطاع تعليم الكبار في باكينغهامشير حيث تقيم مع أسرتها، وتشارك في قيادة مجموعة شبابية للفتيات وبرامج حوار الأديان."
  en: "The Young Muslim Writers Awards 2014 judges' biography of Suma Din: author of children's educational titles and of Turning the Tide for women; she teaches in the adult education sector in Buckinghamshire, where she lives with her family, co-leads a girls' youth group and takes part in interfaith programmes."
  es: "Biografía de Suma Din, elaborada por el jurado de los Premios a Jóvenes Escritores Musulmanes 2014: autora de libros educativos para niños y de \"Turning the Tide\" para mujeres; imparte clases en el sector de la educación para adultos en Buckinghamshire, donde vive con su familia, codirige un grupo juvenil femenino y participa en programas interreligiosos."
  fr: "Biographie de Suma Din par les juges du concours Young Muslim Writers Awards 2014: auteure d’ouvrages éducatifs pour enfants et de Turning the Tide destiné aux femmes; elle enseigne dans le secteur de l’éducation des adultes dans le Buckinghamshire, où elle vit avec sa famille, co-anime un groupe de jeunes filles et participe à des programmes interreligieux."
  ur: "دی ینگ مسلم رائٹرز ایوارڈز 2014 کے ججوں کی سوما دین کی سوانح عمری: بچوں کے تعلیمی عنوانات اور خواتین کے لیے ٹرننگ دی ٹائیڈ کی مصنفہ؛ وہ بکنگھم شائر میں تعلیم بالغاں کے شعبے میں پڑھاتی ہے، جہاں وہ اپنے خاندان کے ساتھ رہتی ہے، لڑکیوں کے نوجوانوں کے گروپ کی شریک قیادت کرتی ہے اور بین المذاہب پروگراموں میں حصہ لیتی ہے۔"
  tr: "Soma Deen'in 2014 Genç Müslüman Yazarlar Ödülleri jüri sayfasındaki çevirisi: Çocuklar için eğitim kitaplarının ve kadınlar için \"Turning the Tide\" kitabının yazarı. Buckinghamshire'da ailesiyle birlikte yaşadığı yetişkin eğitimi sektöründe ders vermekte ve kızlar için gençlik grubuna liderlik etmekte ve dinlerarası diyalog programlarına katılmaktadır."
  id: "Terjemahan Soma Deen di halaman juri Young Muslim Writers Awards tahun 2014: Penulis judul edukasi untuk anak-anak dan buku \"Turning the Tide\" untuk perempuan. Ia mengajar di sektor pendidikan dewasa di Buckinghamshire, tempat ia tinggal bersama keluarganya, dan berpartisipasi memimpin kelompok remaja untuk anak perempuan serta program dialog antaragama."
