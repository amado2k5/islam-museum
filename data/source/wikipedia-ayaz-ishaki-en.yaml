  ar: "مقالة ويكيبيديا الإنجليزية عن عياض إسحاقي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 22 فبراير (10 فبراير بالأسلوب القديم) 1878 في ياوشيرما قرب قازان ووفاته في 22 يوليو 1954 ودفنه في مقبرة أدرنة قابي بإسطنبول، وتعليمه في البيت والمدرسة الشرعية ومدرسة المعلمين الروسية التترية، وأمانته العامة لدولة إيدل أورال سنة 1918 وهجرته سنة 1920؛ ولا تسمي له مذهبا."
  en: "English Wikipedia article on Ayaz İshaki; used for entity facts only. It dual-dates his birth 22 February (10 February old style) 1878 at Yaushirma near Kazan, gives his death on 22 July 1954 and his burial in the Edirnekapı graveyard in Istanbul, his schooling at home, in a madrasa and at the Russian-Tatar teachers' school, his secretaryship of the Idel-Ural State in 1918 and his emigration in 1920; it names no school for him."
