summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عياض إسحاقي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 22 فبراير ⁦(10 فبراير بالأسلوب القديم)⁩ 1878 في ياوشيرما قرب قازان ووفاته في 22 يوليو 1954 ودفنه في مقبرة أدرنة قابي بإسطنبول، وتعليمه في البيت والمدرسة الشرعية ومدرسة المعلمين الروسية التترية، وأمانته العامة لدولة إيدل أورال سنة 1918 وهجرته سنة 1920؛ ولا تسمي له مذهبا."
  en: "English Wikipedia article on Ayaz İshaki; used for entity facts only. It dual-dates his birth 22 February (10 February old style) 1878 at Yaushirma near Kazan, gives his death on 22 July 1954 and his burial in the Edirnekapı graveyard in Istanbul, his schooling at home, in a madrasa and at the Russian-Tatar teachers' school, his secretaryship of the Idel-Ural State in 1918 and his emigration in 1920; it names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Ayaz İshaki; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 22 de febrero (10 de febrero según el calendario antiguo) de 1878 en Yaushirma, cerca de Kazán; su muerte el 22 de julio de 1954 y su entierro en el cementerio de Edirnekapı en Estambul; su educación en casa, en una madrasa y en la escuela de maestros ruso-tártaros; su cargo como secretario del Estado de Idel-Ural en 1918 y su emigración en 1920; no menciona ninguna escuela a la que haya asistido."
  fr: "L'article de Wikipédia en anglais sur Ayaz İshaki, utilisé uniquement pour les informations sur l'entité, mentionne sa naissance le 22 février (10 février selon l'ancien style) 1878 à Yaushirma, près de Kazan, son décès le 22 juillet 1954 et son inhumation au cimetière d'Edirnekapı à Istanbul, sa scolarité à domicile, dans une madrasa et à l'école normale russo-tatare, son poste de secrétaire de l'État d'Idel-Oural en 1918 et son émigration en 1920; aucune école n'est mentionnée."
  ur: "ایاز عشقی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ دوہری تاریخیں ان کی پیدائش 22 فروری ⁦(10 فروری پرانی طرز)⁩ 1878 کو کازان کے قریب یوشیرما میں، 22 جولائی 1954 کو ان کی موت اور استنبول کے ایدیرنیکاپی قبرستان میں ان کی تدفین، گھر پر، مدرسے میں اور روسی تاتار اساتذہ کے اسکول میں، ان کی ریاستی سکریٹری شپ اور 18 میں ان کی سیکرٹری شپ۔ 1920; اس کے لیے کسی اسکول کا نام نہیں ہے۔"
