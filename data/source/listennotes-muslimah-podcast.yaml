summary:
  ar: "صفحة دليل لسن نوتس لبودكاست «مسلمة» من تقديم أسماء باولا: ٥٩ حلقة منذ ٢١ يونيو ٢٠٢٠، باللغة الإنجليزية من الولايات المتحدة؛ وتتضمن أوصاف الحلقات كلماتها عن إتمام سنتها الثانية في دراسة القانون وعن زواجها وقرارات حجابها ومقابلاتها مع ضيفات حول حياة النساء المسلمات."
  en: "The Listen Notes directory page for the podcast Muslimah, hosted by Asma Bawla: 59 episodes since 21 June 2020, in English from the United States. Its episode descriptions carry her own words on finishing her second year of law school, her wedding (walima), her hijab decisions, and her guest conversations about Muslim women's lives."
  es: "La página del directorio Listen Notes del podcast Muslimah, presentado por Asma Bawla, cuenta con 59 episodios desde el 21 de junio de 2020, en inglés y producido en Estados Unidos. Las descripciones de los episodios recogen sus propias palabras sobre la finalización de su segundo año de la facultad de derecho, su boda (walima), sus decisiones sobre el hiyab y sus conversaciones con invitadas acerca de la vida de las mujeres musulmanas."
  fr: "La page Listen Notes du podcast Muslimah, animé par Asma Bawla: 59 épisodes depuis le 21 juin 2020, en anglais (États-Unis). Les descriptions des épisodes reprennent ses propres mots sur la fin de sa deuxième année de droit, son mariage (walima), ses choix concernant le hijab et ses conversations avec des invitées sur la vie des femmes musulmanes."
  ur: "پوڈ کاسٹ مسلمہ کے لیے سننے کے نوٹس ڈائرکٹری کا صفحہ، جس کی میزبانی اسماء باولہ نے کی ہے: 59 اقساط 21 جون 2020 سے، ریاستہائے متحدہ سے انگریزی میں۔ اس کے ایپی سوڈ کی تفصیل اس کے لا اسکول کے دوسرے سال کی تکمیل، اس کی شادی ⁦(ولیمہ)⁩، اس کے حجاب کے فیصلوں، اور مسلمان خواتین کی زندگیوں کے بارے میں اس کے مہمان کی گفتگو پر اس کے اپنے الفاظ ہیں۔"
