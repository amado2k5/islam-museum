reliability_note: "Bodleian Libraries blog post ⁦(Simon McLeish, posted 14 October 2010, updated 18 October 2013⁩ read on
  15 November 2026. Verified claims: al-Idrisi's Kitab nuzhat al-mushtaq describes the known world in seven 'climates'; the
  Bodleian's MS. Greaves 42 ⁦(14th/15th c.⁩ covers the first three climates and MS. Pococke 375 ⁦(1550s⁩ all seven, with
  painted maps drawn facing south. A library-curatorial source describing its own holdings; cited for the later-map
  dependent, not for the medieval scheme's origin."
