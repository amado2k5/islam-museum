summary:
  ar: "مدخل «رسيم» في موسوعة TDV الإسلامية لتونجاي باش أوغلو: مفهوم الصورة والتصوير في اللغة والنصوص، وموقف الشريعة من التصوير والتمثال، وأثر ذلك في توجيه الفن الإسلامي نحو الخط والتذهيب والعَبْر ⁦(الإبرو)⁩."
  en: "The TDV İslâm Ansiklopedisi entry on resim (image, painting) by Tuncay Başoğlu: the vocabulary of image and depiction in language and texts, the law's stance on figural representation and sculpture, and how that stance channelled Muslim art toward calligraphy, illumination and marbling."
  es: "La entrada de Tuncay Başoğlu en la TDV İslâm Ansiklopedisi sobre resim (imagen, pintura): el vocabulario de la imagen y la representación en el lenguaje y los textos, la postura de la ley sobre la representación figurativa y la escultura, y cómo esa postura orientó el arte musulmán hacia la caligrafía, la iluminación y el marmoleado."
  fr: "L'article de TDV İslâm Ansiklopedisi sur resim (image, peinture) par Tuncay Başoğlu: le vocabulaire de l'image et de la représentation dans le langage et les textes, la position de la loi sur la représentation figurative et la sculpture, et comment cette position a orienté l'art musulman vers la calligraphie, l'enluminure et le marbrage."
  ur: "TDV İslâm Ansiklopedisi Entry on Resim ⁦(تصویر، پینٹنگ)⁩ از Tuncay Başoğlu: زبان اور متن میں تصویر اور عکاسی کا ذخیرہ، فگریکل نمائندگی اور مجسمہ سازی کے بارے میں قانون کا موقف، اور اس موقف نے مسلم فن کو خطاطی اور مرثیہ نگاری کی طرف کیسے منتقل کیا۔"
