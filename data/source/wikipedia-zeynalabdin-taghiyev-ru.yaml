summary:
  ar: "مقالة ويكيبيديا الروسية المطولة عن زين العابدين تقييف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده «1823 أو يناير 1838»، وتذكر مذكرات ابنته التي تجعله عاش 86 سنة وتوفي سنة 1924 وهو ما يوافق 1838، وتفصّل أعماله ومشروعاته."
  en: "Russian Wikipedia article on Zeynalabdin Taghiyev, the longest of the editions; used for entity facts only. It gives his birth as '1823 or January 1838', reports his daughter's memoir that he lived 86 years and died in 1924 (which yields 1838), and details his enterprises and projects."
  es: "Artículo de la Wikipedia rusa sobre Zeynalabdin Taghiyev, la edición más extensa; se utiliza únicamente para datos sobre la persona. Indica que nació en 1823 o en enero de 1838, recoge las memorias de su hija que afirman que vivió 86 años y murió en 1924 (lo que da como resultado 1838), y detalla sus empresas y proyectos."
  fr: "Article de Wikipédia en russe sur Zeynalabdin Taghiyev, la plus longue des versions; utilisée uniquement pour les informations sur l'entité. Elle indique sa naissance en « 1823 ou janvier 1838 », rapporte les mémoires de sa fille selon lesquels il a vécu 86 ans et est décédé en 1924 (ce qui correspond à 1838), et détaille ses entreprises et projets."
  ur: "زینالبدین تغییف پر روسی ویکیپیڈیا کا مضمون، ایڈیشنوں میں سب سے طویل؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش '1823 یا جنوری 1838' کے طور پر دیتا ہے، اس کی بیٹی کی یادداشت بتاتی ہے کہ وہ 86 سال زندہ رہی اور 1924 میں اس کی موت ہوئی ⁦(جس کا نتیجہ 1838 ہے)⁩، اور اس کے کاروباری اداروں اور منصوبوں کی تفصیل ہے۔"
