reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision (revid asserted equal before use). It gives Abdullah Awwad Al Juhany, born 13 January 1976 in Medina; a bachelor's degree from the faculty of Qur'an at the Islamic University of Madinah and a doctorate from Umm al-Qura University; Tarawih imam at Masjid al-Haram from 2005 and permanent imam from July 2007; it also lists him as an imam of the Prophet's Mosque, Quba Mosque and Masjid al-Qiblatayn, on a weak forum citation. Its infobox, uncited, gives his jurisprudence as Hanbali; no text in the article names a school for him, and its categories file him under Sunni Muslims, a filing only."
