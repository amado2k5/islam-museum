  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله عواد الجهني؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده بالمدينة المنورة في 13 يناير 1976، ودراسته بالجامعة الإسلامية وجامعة أم القرى، وإمامته لصلاة التراويح بالمسجد الحرام منذ 2005 وتعيينه إمامًا دائمًا سنة 2007."
  en: "English Wikipedia article on Abdullah Awad Al-Juhany; used for entity facts only. It records his birth in Medina on 13 January 1976, his studies at the Islamic University of Madinah and Umm al-Qura University, his leading of the Tarawih prayers at Masjid al-Haram from 2005, and his appointment as a permanent imam in July 2007."
  es: "Artículo de la Wikipedia en inglés sobre Abdullah Awad Al-Juhany; utilizado únicamente para datos sobre la persona. En él se registra su nacimiento en Medina el 13 de enero de 1976, sus estudios en la Universidad Islámica de Medina y en la Universidad Umm al-Qura, su labor dirigiendo las oraciones de Tarawih en la Mezquita Sagrada (Masjid al-Haram) desde 2005 y su nombramiento como imán permanente en julio de 2007."
  fr: "Article de Wikipédia en anglais sur Abdullah Awad Al-Juhany; utilisé uniquement pour les informations relatives à l’entité. Il relate sa naissance à Médine le 13 janvier 1976, ses études à l’Université islamique de Médine et à l’Université Umm al-Qura, sa direction des prières de Tarawih à la Masjid al-Haram à partir de 2005 et sa nomination comme imam permanent en juillet 2007."
