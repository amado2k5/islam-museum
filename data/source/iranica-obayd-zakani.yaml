reliability_note: "Scholarly encyclopedia entry, read in full in session. Its heading gives 'd. ca. 770/1370'; its Life section gives his birth as 'probably before 1319' with no year, his descent from the Zakani branch of the Banu Khafaja settled in the Qazvin region, and — following the Shahed-e Sadeq and the Kholasat al-ash'ar as used by Abbas Iqbal — his death in 771/1369-70 or 772/1370-71, noting a manuscript he copied in 768/1366. The record follows its conventional 1370 for the death year, as debated, and takes from it the absence of any birth year."
