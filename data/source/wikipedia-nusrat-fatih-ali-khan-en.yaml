  ar: "مقالة ويكيبيديا الإنجليزية عن نصرت فتح علي خان؛ لوقائع الكيان فقط: مولده في لائلپور في 13 أكتوبر 1948، وقيادته فرقة الأسرة منذ 1971، وعمله مع ريل ورلد وبيتر غابرييل، وجوائزه ⁦(حسن الأداء 1987، جائزة اليونسكو للموسيقى 1995، جائزة فوكوكا 1996، ترشيحان لغرامي 1997)⁩، ووفاته في لندن في 16 أغسطس 1997؛ وتستند إلى نيويورك تايمز وذي إندبندنت ورولينغ ستون وNPR وغينيس."
  en: "English Wikipedia article on Nusrat Fateh Ali Khan; entity facts only: birth at Lyallpur on 13 October 1948, leadership of the family party from 1971, his work with Real World and Peter Gabriel, his honours (Pride of Performance 1987, UNESCO Music Prize 1995, Fukuoka Prize 1996, two Grammy nominations 1997) and death in London on 16 August 1997; it cites The New York Times, The Independent, Rolling Stone, NPR and Guinness."
