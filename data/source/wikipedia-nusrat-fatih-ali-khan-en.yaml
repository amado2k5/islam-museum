summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0625\u0646\u062c\u0644\u064a\u0632\u064a\u0629 \u0639\u0646 \u0646\u0635\u0631\u062a \u0641\u062a\u062d \u0639\u0644\u064a \u062e\u0627\u0646\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u0644\u0627\u0626\u0644\u067e\u0648\u0631 \u0641\u064a 13 \u0623\u0643\u062a\u0648\u0628\u0631 1948\u060c \u0648\u0642\u064a\u0627\u062f\u062a\u0647 \u0641\u0631\u0642\u0629 \u0627\u0644\u0623\u0633\u0631\u0629 \u0645\u0646\u0630 1971\u060c \u0648\u0639\u0645\u0644\u0647 \u0645\u0639 \u0631\u064a\u0644 \u0648\u0631\u0644\u062f \u0648\u0628\u064a\u062a\u0631 \u063a\u0627\u0628\u0631\u064a\u064a\u0644\u060c \u0648\u062c\u0648\u0627\u0626\u0632\u0647 (\u062d\u0633\u0646 \u0627\u0644\u0623\u062f\u0627\u0621 1987\u060c \u062c\u0627\u0626\u0632\u0629 \u0627\u0644\u064a\u0648\u0646\u0633\u0643\u0648 \u0644\u0644\u0645\u0648\u0633\u064a\u0642\u0649 1995\u060c \u062c\u0627\u0626\u0632\u0629 \u0641\u0648\u0643\u0648\u0643\u0627 1996\u060c \u062a\u0631\u0634\u064a\u062d\u0627\u0646 \u0644\u063a\u0631\u0627\u0645\u064a 1997)\u060c \u0648\u0648\u0641\u0627\u062a\u0647 \u0641\u064a \u0644\u0646\u062f\u0646 \u0641\u064a 16 \u0623\u063a\u0633\u0637\u0633 1997\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0646\u064a\u0648\u064a\u0648\u0631\u0643 \u062a\u0627\u064a\u0645\u0632 \u0648\u0630\u064a \u0625\u0646\u062f\u0628\u0646\u062f\u0646\u062a \u0648\u0631\u0648\u0644\u064a\u0646\u063a \u0633\u062a\u0648\u0646 \u0648NPR \u0648\u063a\u064a\u0646\u064a\u0633."
  en: "English Wikipedia article on Nusrat Fateh Ali Khan; entity facts only: birth at Lyallpur on 13 October 1948, leadership of the family party from 1971, his work with Real World and Peter Gabriel, his honours (Pride of Performance 1987, UNESCO Music Prize 1995, Fukuoka Prize 1996, two Grammy nominations 1997) and death in London on 16 August 1997; it cites The New York Times, The Independent, Rolling Stone, NPR and Guinness."
