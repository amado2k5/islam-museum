summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نصرت فتح علي خان؛ لوقائع الكيان فقط: مولده في لائلپور في 13 أكتوبر 1948، وقيادته فرقة الأسرة منذ 1971، وعمله مع ريل ورلد وبيتر غابرييل، وجوائزه ⁦(حسن الأداء 1987، جائزة اليونسكو للموسيقى 1995، جائزة فوكوكا 1996، ترشيحان لغرامي 1997)⁩، ووفاته في لندن في 16 أغسطس 1997؛ وتستند إلى نيويورك تايمز وذي إندبندنت ورولينغ ستون وNPR وغينيس."
  en: "English Wikipedia article on Nusrat Fateh Ali Khan; entity facts only: birth at Lyallpur on 13 October 1948, leadership of the family party from 1971, his work with Real World and Peter Gabriel, his honours (Pride of Performance 1987, UNESCO Music Prize 1995, Fukuoka Prize 1996, two Grammy nominations 1997) and death in London on 16 August 1997; it cites The New York Times, The Independent, Rolling Stone, NPR and Guinness."
  es: "Artículo de la Wikipedia en inglés sobre Nusrat Fateh Ali Khan; solo datos sobre la persona: nacimiento en Lyallpur el 13 de octubre de 1948, liderazgo del partido familiar desde 1971, su trabajo con Real World y Peter Gabriel, sus honores (Pride of Performance 1987, Premio de Música de la UNESCO 1995, Premio Fukuoka 1996, dos nominaciones a los premios Grammy 1997) y muerte en Londres el 16 de agosto de 1997; cita a The New York Times, The Independent, Rolling Stone, NPR y Guinness."
  fr: "Article de Wikipédia en anglais sur Nusrat Fateh Ali Khan; informations uniquement sur l’individu: naissance à Lyallpur le 13 octobre 1948, direction du parti familial à partir de 1971, sa collaboration avec Real World et Peter Gabriel, ses distinctions (Pride of Performance 1987, Prix de musique de l’UNESCO 1995, Prix de Fukuoka 1996, deux nominations aux Grammy Awards 1997) et décès à Londres le 16 août 1997; l’article cite The New York Times, The Independent, Rolling Stone, NPR et Guinness."
  ur: "نصرت فتح علی خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: لائل پور میں 13 اکتوبر 1948 کو پیدائش، 1971 سے خاندانی پارٹی کی قیادت، ریئل ورلڈ اور پیٹر گیبریل کے ساتھ ان کا کام، ان کے اعزازات ⁦(پرائیڈ آف پرفارمنس 1987، یونیسکو میوزک پرائز 1995، فوکوکا پرائز 1996، دو گریمی نامزدگی)⁩ اور 1997 اگست 1997 کو لندن میں انتقال ہوا۔ اس میں نیویارک ٹائمز، دی انڈیپنڈنٹ، رولنگ اسٹون، این پی آر اور گنیز کا حوالہ دیا گیا ہے۔"
  tr: "Nusrat Fateh Ali Khan hakkında İngilizce Wikipedia makalesi; sadece varlık için gerçekler: 13 Ekim 1948'de Lilpur'da doğması, 1971'den beri aile grubunun liderliği, Real World ve Peter Gabriel ile çalışmaları, ödülleri (En İyi Performans 1987, UNESCO Müzik Ödülü 1995, Fukuoka Ödülü 1996, iki Grammy adaylığı 1997) ve 16 Ağustos 1997'de Londra'da vefatı; The New York Times, The Independent, Rolling Stone, NPR ve Guinness'e dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Nusrat Fateh Ali Khan; hanya untuk fakta entitas: kelahirannya di Lilpur pada 13 Oktober 1948, kepemimpinannya di band keluarga sejak 1971, karyanya dengan Real World dan Peter Gabriel, penghargaan yang dimilikinya (Penampilan Terbaik 1987, UNESCO Music Prize 1995, Fukuoka Prize 1996, dua nominasi Grammy 1997), dan kematiannya di London pada 16 Agustus 1997; berdasarkan The New York Times, The Independent, Rolling Stone, NPR, dan Guinness."
