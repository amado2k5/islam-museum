summary:
  ar: "صفحة فعالية جولة «الصحوة» لساحل عديم في برادفورد ⁦(20 أكتوبر 2024)⁩؛ تصفه بعالم نفس سلوكي ومدرّب شركات يقود شركة Source Code لتزويد الشباب المسلم بمهارات التفكير النقدي."
  en: "The event page for Sahil Adeem's Awakening Tour in Bradford (20 October 2024), describing him as a behavioural psychologist and corporate trainer whose company Source Code equips young Muslims with critical-thinking skills."
  es: "La página del evento \"Awakening Tour\" de Sahil Adeem en Bradford (20 de octubre de 2024) lo describe como un psicólogo conductual y formador empresarial cuya compañía, Source Code, dota a jóvenes musulmanes de habilidades de pensamiento crítico."
  fr: "La page de l'événement pour la tournée Awakening de Sahil Adeem à Bradford (20 octobre 2024) le décrit comme un psychologue comportemental et formateur en entreprise dont la société Source Code fournit aux jeunes musulmans des compétences en pensée critique."
  ur: "بریڈ فورڈ ⁦(20 اکتوبر 2024)⁩ میں ساحل عدیم کے اویکننگ ٹور کے لیے ایونٹ کا صفحہ، اسے رویے کے ماہر نفسیات اور کارپوریٹ ٹرینر کے طور پر بیان کرتا ہے جس کی کمپنی سورس کوڈ نوجوان مسلمانوں کو تنقیدی سوچ کی مہارتوں سے آراستہ کرتی ہے۔"
  tr: "Bradford'daki ıssız bir kıyı için 'Uyanış' turu etkinlik sayfası (20 Ekim 2024); onu davranış psikoloğu ve kurumsal eğitmen olarak tanımlıyor; Müslüman gençlere eleştirel düşünme becerileri kazandırmak için Source Code'u yönetiyor."
  id: "Halaman acara tur 'Awakening' untuk pantai terpencil di Bradford (20 Oktober 2024); menggambarkannya sebagai psikolog perilaku dan pelatih korporat yang memimpin Source Code untuk membekali remaja Muslim dengan keterampilan berpikir kritis."
