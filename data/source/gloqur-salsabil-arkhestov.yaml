summary:
  ar: "تدوينة لإلفيرا كولييفا، 16 يونيو 2023، عن «سلسبيل»، ترجمة روسية لمعاني القرآن صدر جزؤها الأول سنة 2022 بوصفها «طبعة تجريبية»، من إعداد أصلان أرخيستوف وفريق أكثره من النساء."
  en: "A post by Elvira Kulieva, 16 June 2023, on Salsabil, a Russian translation of the meanings of the Qur'an whose first part appeared in 2022 as an 'experimental edition', prepared by Aslan Arkhestov and a team mostly of women."
  ur: "الویرا کولیوا کی تحریر، 16 جون 2023، «سلسبیل» پر، قرآن کے معانی کا روسی ترجمہ جس کا پہلا حصہ 2022 میں «تجرباتی اشاعت» کے طور پر آیا، جسے اصلان ارخیستوف اور زیادہ تر خواتین پر مشتمل ٹیم نے تیار کیا۔"
  es: "Publicación de Elvira Kulieva, 16 de junio de 2023, sobre Salsabil, una traducción rusa de los significados del Corán cuya primera parte apareció en 2022 como una \"edición experimental\", preparada por Aslan Arkhestov y un equipo compuesto principalmente por mujeres."
  fr: "Article d'Elvira Kulieva, 16 juin 2023, sur Salsabil, une traduction russe des significations du Coran dont la première partie est parue en 2022 en tant qu'« édition expérimentale », préparée par Aslan Arkhestov et une équipe composée principalement de femmes."
  tr: "Elvira Kolyeva'nın 16 Haziran 2023 tarihli bir yazısı, Kur'an'ın anlamlarının Rusça çevirisi olan \"Salsabil\" hakkında, ilk bölümü 2022'de Aslan Arkhistov ve çoğunluğu kadınlardan oluşan bir ekip tarafından hazırlanan \"deneme baskısı\" olarak yayımlandı."
  id: "Sebuah tulisan oleh Elvira Kolyeva, 16 Juni 2023, tentang \"Salsabil,\" terjemahan bahasa Rusia dari makna Al-Qur'an, bagian pertamanya diterbitkan pada 2022 sebagai \"edisi percobaan,\" yang disiapkan oleh Aslan Arkhistov dan tim yang sebagian besar terdiri dari perempuan."
title: "Qur'an translation of the week #161: From Certainty to Experimentation: A New Salafi Qur'an Translation into Russian – Salsabil by Aslan Arkhestov et al."
