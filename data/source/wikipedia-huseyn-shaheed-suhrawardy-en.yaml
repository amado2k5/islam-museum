  ar: "مقالة ويكيبيديا الإنجليزية عن حسين شهيد سهروردي (1892–1963)، رئيس وزراء باكستان (1956–1957) وآخر رئيس وزراء للبنغال الموحدة؛ تعطي مولده في 8 أيلول 1892 في مدنابور ووفاته في 5 كانون الأول 1963 في بيروت ودفنه في دكا، وتتتبع نسب أسرته إلى الصوفي شهاب الدين عمر السهروردي دون أن تسمي مذهب حسين نفسه."
  en: "The English Wikipedia article on Huseyn Shaheed Suhrawardy (1892–1963), prime minister of Pakistan (1956–1957) and last prime minister of undivided Bengal; it gives his birth on 8 September 1892 at Midnapore, his death on 5 December 1963 at Beirut and his burial at Dhaka, and traces his family's lineage to the Sufi Shihab al-Din Umar al-Suhrawardi without naming any school for Huseyn himself."
