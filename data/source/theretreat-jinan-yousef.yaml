summary:
  ar: "سيرة جنان يوسف في موقع «ذا ريتريت» المنظِّم لرحلات العمرة النسائية؛ تقول إنها كاتبة منذ أكثر من عقد، نشرت كتاب «التأمل في أسماء الله» ⁦(دار البروج، 2020)⁩ ودفتر «أسماء الله الحسنى» ⁦(الطبعة الثالثة، 2023)⁩، ودرست في كلية كامبريدج الإسلامية وتدرس التفسير والحديث في معهد السلام، وتدرّس أسماء الله عبر الإنترنت، ومحاضِرة وكاتبة لدى معهد تواصوا وباحثة أولى في معهد يقين، وقادت رحلة عمرة نسائية في يوليو 2025."
  en: "Jinan Yousef's biography on the website of The Retreat, organiser of women's Umrah retreats. It states that she has been an author for over a decade, published Reflecting on the Names of Allah (Al-Buruj Press, 2020) and the 99 Names of Allah guided journal (3rd edition, 2023), studied at Cambridge Islamic College and currently studies tafsir and hadith at Al-Salam Institute, teaches classes on the names of Allah online, is a lecturer and writer for Tawasaw Institute and a Senior Fellow at Yaqeen Institute, and led a sisters' Umrah retreat in July 2025."
  es: "La biografía de Jinan Yousef se encuentra en el sitio web de The Retreat, organizador de retiros de Umrah para mujeres. En ella se indica que ha sido autora durante más de una década, publicó Reflecting on the Names of Allah (Al-Buruj Press, 2020) y el diario guiado 99 Names of Allah (3.ª edición, 2023), estudió en el Cambridge Islamic College y actualmente estudia tafsir y hadith en el Instituto Al-Salam, imparte clases en línea sobre los nombres de Allah, es profesora y escritora para el Instituto Tawasaw y miembro sénior del Instituto Yaqeen, y dirigió un retiro de Umrah para mujeres en julio de 2025."
  fr: "La biographie de Jinan Yousef sur le site web de The Retreat, organisateur de retraites Omra pour femmes, indique qu'elle est auteure depuis plus de dix ans, qu'elle a publié *Reflecting on the Names of Allah* (Al-Buruj Press, 2020) et le journal guidé *99 Names of Allah* (3e édition, 2023), qu'elle a étudié au Cambridge Islamic College et qu'elle étudie actuellement le tafsir et le hadith à l'Institut Al-Salam, qu'elle donne des cours en ligne sur les noms d'Allah, qu'elle est conférencière et auteure pour l'Institut Tawasaw et chercheuse principale à l'Institut Yaqeen, et qu'elle a dirigé une retraite Omra pour femmes en juillet 2025."
  ur: "خواتین کے عمرہ اعتکاف کی منتظم جنان یوسف کی سوانح عمری دی ریٹریٹ کی ویب سائٹ پر۔ اس میں کہا گیا ہے کہ وہ ایک دہائی سے زیادہ عرصے سے مصنف ہیں، اللہ کے ناموں کی عکاسی کرتی ہیں ⁦(البروج پریس، 2020)⁩ اور اللہ کے 99 ناموں کے ہدایت یافتہ جریدے ⁦(تیسرا ایڈیشن، 2023)⁩ شائع کرتی ہیں، کیمبرج اسلامک کالج میں پڑھتی ہیں اور فی الحال السلام انسٹی ٹیوٹ میں تفسیر اور حدیث پڑھتی ہیں، اللہ کے نام کی آن لائن کلاس پڑھاتی ہیں۔ Tawasaw Institute اور Yaqeen Institute میں ایک سینئر فیلو، اور جولائی 2025 میں بہنوں کے عمرہ اعتکاف کی قیادت کی۔"
  tr: "Janan Youssef'in kadınların Umre gezilerini düzenleyen 'The Retreat' adlı web sitesindeki biyografisinde, on yılı aşkın süredir yazar olduğunu, 'Allah'ın İsimleri Üzerine Düşünce' (Dar Al-Burouj, 2020) kitabını ve 'Allah'ın Güzel İsimleri' defterini (3. baskı, 2023) yayımladığını, Cambridge İslam Koleji'nde eğitim aldığını, Barış Enstitüsü'nde Tefsir ve Hadis dersleri verdiğini, Allah'ın İsimlerini çevrimiçi öğrettiğini, Tawaswa Enstitüsü'nde öğretim görevlisi ve yazar olduğunu, Yaqin Enstitüsü'nde kıdemli araştırmacı olduğunu ve Temmuz 2025'te kadınların Umre yolculuğuna liderlik ettiğini belirtmektedir."
  id: "Biografi Janan Youssef di situs web 'The Retreat,' yang mengorganisir perjalanan Umrah perempuan, menyatakan bahwa ia telah menjadi penulis selama lebih dari satu dekade, menerbitkan buku 'Refleksi atas Nama-nama Allah' (Dar Al-Burouj, 2020) dan buku catatan 'The Beautiful Names of Allah' (edisi ke-3, 2023), belajar di Cambridge Islamic College, mengajar Tafsir dan Hadis di Institute for Peace, mengajarkan Names of Allah secara daring, menjadi dosen dan penulis di Tawaswa Institute, peneliti senior di Yaqin Institute, serta memimpin perjalanan Umrah perempuan pada Juli 2025."
