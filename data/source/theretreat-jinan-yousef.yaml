summary:
  ar: "سيرة جنان يوسف في موقع «ذا ريتريت» المنظِّم لرحلات العمرة النسائية؛ تقول إنها كاتبة منذ أكثر من عقد، نشرت كتاب «التأمل في أسماء الله» (دار البروج، 2020) ودفتر «أسماء الله الحسنى» (الطبعة الثالثة، 2023)، ودرست في كلية كامبريدج الإسلامية وتدرس التفسير والحديث في معهد السلام، وتدرّس أسماء الله عبر الإنترنت، ومحاضِرة وكاتبة لدى معهد تواصوا وباحثة أولى في معهد يقين، وقادت رحلة عمرة نسائية في يوليو 2025."
  en: "Jinan Yousef's biography on the website of The Retreat, organiser of women's Umrah retreats. It states that she has been an author for over a decade, published Reflecting on the Names of Allah (Al-Buruj Press, 2020) and the 99 Names of Allah guided journal (3rd edition, 2023), studied at Cambridge Islamic College and currently studies tafsir and hadith at Al-Salam Institute, teaches classes on the names of Allah online, is a lecturer and writer for Tawasaw Institute and a Senior Fellow at Yaqeen Institute, and led a sisters' Umrah retreat in July 2025."
