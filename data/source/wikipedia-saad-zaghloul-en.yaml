reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. Its infobox gives him born on 1 July 1859 at Ibyana, Kafr el-Sheikh, and died on 23 August 1927 at Cairo, resting in the Mausoleum of Saad Zaghloul; its own timeline, however, gives his birth as July 1857. Its text recounts his studies at al-Azhar and a French law school in Cairo, his judgeship from 1892, his ministries of education (1906–1908 in the text, 1906–1910 in the timeline) and justice (1910–1912), his vice-presidency of the Legislative Assembly from 1913, the delegation (wafd) of 1919, his exile to Malta, the Seychelles and Gibraltar and release in 1923, the Wafd's election victory and his premiership of 26 January to 24 November 1924, ended by his resignation after the assassination of Sir Lee Stack, and his death in 1927. His wife Safiya was the daughter of prime minister Mustafa Fahmi Pasha; his brother was Ahmad Fathy Zaghlul. The article makes no statement of his religion in its text; its categories file him under 'Egyptian Muslims'."
