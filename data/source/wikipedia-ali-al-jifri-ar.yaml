summary:
  ar: "مقالة ويكيبيديا العربية عن علي الجفري (ولد 16 أبريل 1971 في جدة)؛ فيها قسم مستقل عن تصوفه يعدّه فيه المهتمون بالتصوف من أعلام التصوف المعتدل، وقائمة بشيوخه يتصدرها عمر بن حفيظ الذي صحبه في تريم من 1993 إلى 2003 وقرأ وحضر عليه كثيرًا، ويعطي صندوق معلوماتها العقيدة الأشعرية والمذهب الشافعي."
  en: "The Arabic Wikipedia article on Ali al-Jifri (born 16 April 1971 in Jeddah); it carries a dedicated section on his Sufism counting him, on the word of scholars of Sufism, among the figures of moderate Sufism, a list of his teachers headed by Umar bin Hafiz — whose company he kept in Tarim from 1993 to 2003 and under whom he read extensively — and an infobox giving the Ash'ari creed and the Shafi'i madhhab."
