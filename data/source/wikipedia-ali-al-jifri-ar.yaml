summary:
  ar: "مقالة ويكيبيديا العربية عن علي الجفري ⁦(ولد 16 أبريل 1971 في جدة)⁩؛ فيها قسم مستقل عن تصوفه يعدّه فيه المهتمون بالتصوف من أعلام التصوف المعتدل، وقائمة بشيوخه يتصدرها عمر بن حفيظ الذي صحبه في تريم من 1993 إلى 2003 وقرأ وحضر عليه كثيرًا، ويعطي صندوق معلوماتها العقيدة الأشعرية والمذهب الشافعي."
  en: "The Arabic Wikipedia article on Ali al-Jifri (born 16 April 1971 in Jeddah); it carries a dedicated section on his Sufism counting him, on the word of scholars of Sufism, among the figures of moderate Sufism, a list of his teachers headed by Umar bin Hafiz — whose company he kept in Tarim from 1993 to 2003 and under whom he read extensively — and an infobox giving the Ash'ari creed and the Shafi'i madhhab."
  es: "El artículo de Wikipedia en árabe sobre Ali al-Jifri (nacido el 16 de abril de 1971 en Jeddah) incluye una sección dedicada a su sufismo, donde, según los estudiosos del sufismo, se le considera una figura destacada del sufismo moderado; una lista de sus maestros encabezada por Umar bin Hafiz, con quien compartió tiempo en Tarim entre 1993 y 2003 y de quien estudió extensamente; y un recuadro informativo sobre la escuela de pensamiento Ash'ari y la escuela Shafi'i."
  fr: "L'article de Wikipédia en arabe sur Ali al-Jifri (né le 16 avril 1971 à Djeddah) comporte une section dédiée à son soufisme, le comptant, selon les érudits du soufisme, parmi les figures du soufisme modéré, une liste de ses enseignants menée par Umar bin Hafiz — avec qui il a été en compagnie à Tarim de 1993 à 2003 et auprès duquel il a beaucoup étudié — et une infobox donnant la croyance ash'arite et le madhhab shafi'ite."
