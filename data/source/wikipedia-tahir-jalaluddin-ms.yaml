summary:
  ar: "مقالة ويكيبيديا الملايوية عن محمد طاهر جلال الدين؛ تُستخدم لوقائع الكيان فقط. تربط ميلاده بـ5 رمضان 1286هـ (8 كانون الأول 1869) في أمبيق أنغكيق، وتسمّي معلّمه وابن عمّه الشيخ أحمد الخطيب المنكباوي مفتي الشافعية في المسجد الحرام، وتصف دراسته في الأزهر (1893–1897) ووقوفه مع حركة «كاوم مودا» الإصلاحية وخدمته في فيرق وجوهر، ووفاته في 26 تشرين الأول 1956 ودفنه في كوالا كانغسار."
  en: "Malay Wikipedia article on Muhammad Tahir Jalaluddin; used for entity facts only. It pairs his birth with 5 Ramadan 1286 AH (8 December 1869) at Ampek Angkek, names his teacher — his cousin Sheikh Ahmad Khatib al-Minangkabawi, then mufti of the Shafi'i school at the Grand Mosque of Mecca — describes his al-Azhar years (1893–1897), his Kaum Muda reformist standing, his Perak and Johor service, and his death on 26 October 1956 (paired in the article with 21 Rabi' al-awwal 1377) and burial at the Jalan Baru cemetery, Kuala Kangsar."
