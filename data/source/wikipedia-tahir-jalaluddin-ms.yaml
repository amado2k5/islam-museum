reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by revision id through the MediaWiki API with the returned id asserted equal. An independent Malay tradition resting on Malaysian scholarship and interviews with his son Hamdan. Its Hijri pairings differ from the Indonesian article's (birth 5 against 4 Ramadan 1286; death 21 Rabi' al-awwal 1377, whose year cannot pair with 1956, against 22 Rabi' al-awwal 1376), while the Gregorian dates agree across all traditions. It names no madhhab for Tahir himself; it identifies his teacher as the Shafi'i mufti of the Meccan sanctuary."
