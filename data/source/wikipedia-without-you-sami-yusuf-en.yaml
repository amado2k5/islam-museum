summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألبوم «بدونك» لسامي يوسف؛ لوقائع الكيان فقط: صدوره في 17 يناير 2009 عن أوايكننغ، واعتراض سامي يوسف عليه ودعوته إلى مقاطعته، ونزاع العقد 2008–2009، وإعادة إصدار أغانيه لاحقا، وقائمة الأغاني؛ تستند إلى بيان سامي يوسف على موقعه."
  en: "English Wikipedia article on Sami Yusuf's album Without You; entity facts only: its release on 17 January 2009 by Awakening, Sami Yusuf's objection and call for a boycott, the 2008–2009 contract dispute, the later re-release of its songs, and the track list; it cites Sami Yusuf's statement on his website."
  es: "Artículo de la Wikipedia en inglés sobre el álbum Without You de Sami Yusuf; solo datos sobre la entidad: su lanzamiento el 17 de enero de 2009 por Awakening, la objeción de Sami Yusuf y su llamado al boicot, la disputa contractual de 2008-2009, la posterior reedición de sus canciones y la lista de canciones; cita la declaración de Sami Yusuf en su sitio web."
  fr: "Article de Wikipédia en anglais sur l'album Without You de Sami Yusuf; faits concernant l'album uniquement: sa sortie le 17 janvier 2009 chez Awakening, l'objection de Sami Yusuf et son appel au boycott, le différend contractuel de 2008-2009, la réédition ultérieure de ses chansons et la liste des titres; il cite la déclaration de Sami Yusuf sur son site web."
  ur: "سمیع یوسف کے البم بغیر تم پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: اس کی ریلیز 17 جنوری 2009 کو اویکننگ کے ذریعے، سمیع یوسف کا اعتراض اور بائیکاٹ کا مطالبہ، 2008-2009 کے معاہدے کا تنازع، بعد میں اس کے گانوں کی دوبارہ ریلیز، اور ٹریک لسٹ؛ اس نے اپنی ویب سائٹ پر سمیع یوسف کے بیان کا حوالہ دیا ہے۔"
  tr: "Sami Youssef'in albümü \"Without You\" hakkında İngilizce Wikipedia makalesi; sadece varlık için gerçekler: 17 Ocak 2009'da Awakening tarafından yayımlanması, Sami Youssef'in itirazı ve boykot çağrısı, 2008–2009 sözleşme anlaşmazlığı, şarkılarının yeniden yayımlanması ve çalma listesi; Sami Youssef'in web sitesindeki açıklamasına dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang album Sami Youssef \"Without You\"; hanya untuk fakta entitas: perilisan pada 17 Januari 2009 oleh Awakening, keberatan Sami Youssef terhadapnya dan seruannya untuk memboikot, sengketa kontrak 2008–2009, rilis ulang lagu-lagunya berikutnya, dan daftar putar; berdasarkan pernyataan Sami Youssef di situs webnya."
