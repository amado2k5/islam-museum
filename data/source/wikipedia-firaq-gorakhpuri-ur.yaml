summary:
  ar: "مقالة ويكيبيديا الأردية عن فراق گورکھپوری؛ تُستخدم لوقائع الكيان فقط. تؤكد تاريخيه وأعماله، وتذكر — نقلا عن «تذكرة» مالك رام — أن جثمانه نُقل إلى الله آباد وأُحرق عند ملتقى الغانجا والجمنا، وهو طقس جنائزي هندوسي."
  en: "Urdu Wikipedia article on Firaq Gorakhpuri; used for entity facts only. It confirms his dates and works and records — citing Malik Ram's Tazkira — that his body was taken to Allahabad and cremated at the confluence of the Ganga and the Jamuna, a Hindu funerary rite."
  es: "Artículo de Wikipedia en urdu sobre Firaq Gorakhpuri; utilizado únicamente para datos sobre la persona. Confirma sus fechas y obras, y registra —citando el Tazkira de Malik Ram— que su cuerpo fue llevado a Allahabad y cremado en la confluencia del Ganges y el Yamuna, un rito funerario hindú."
  fr: "Article de Wikipédia en ourdou sur Firaq Gorakhpuri; utilisé uniquement pour les informations sur l'entité. Il confirme ses dates et ses œuvres et rapporte — citant le Tazkira de Malik Ram — que son corps a été transporté à Allahabad et incinéré au confluent du Gange et de la Yamuna, selon un rite funéraire hindou."
  ur: "فراق گورکھپوری پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی تاریخوں اور کاموں اور ریکارڈوں کی تصدیق کرتا ہے - مالک رام کے تذکرہ کا حوالہ دیتے ہوئے - کہ اس کی لاش کو الہ آباد لے جایا گیا اور گنگا اور جمنا کے سنگم پر اس کا آخری رسومات، ایک ہندو جنازہ کی رسم ہے۔"
  tr: "Gorakhpuri'nin ayrılışıyla ilgili Urduca Wikipedia makalesi yalnızca varlığın olayları için kullanılıyor. Makale, varlığın tarihini ve eserlerini doğruluyor ve Malik Ram'ın \"Tadhkirah\" adlı eserinden alıntı yaparak — bedeninin Allahabad'a nakledildiğini ve Ganga ile Jamna'nın birleştiği yerde yakıldığını belirtiyor; bu bir Hindu cenaze ritüeli."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang kepergian Gorakhpuri hanya digunakan untuk peristiwa entitas tersebut. Artikel tersebut mengonfirmasi sejarah dan karyanya, serta menyebutkan — mengutip \"Tadhkirah\" karya Malik Ram — bahwa jenazahnya dipindahkan ke Allahabad dan dikremasi di pertemuan Sungai Ganga dan Jamna, sebuah ritual pemakaman Hindu."
