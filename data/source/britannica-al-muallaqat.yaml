summary:
  ar: "صفحة «Al-Muʿallaqāt (Arabic literature)» لدى Encyclopaedia Britannica. لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملخص بحثي قُدّم إلى المتحف ووافق المؤسس على استعماله في 21 نوفمبر 2026. يُستشهد بها في: المعلقات السبع كما رُويت، والشعراء الثلاثة المضافون في روايات المعلقات العشر."
  en: "The page \"Al-Muʿallaqāt (Arabic literature)\" (Encyclopaedia Britannica). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum and approved for use by the founder on 21 November 2026. Cited for: the seven Mu'allaqat as transmitted and the three poets added in the ten-ode recensions."
  ur: "صفحہ «Al-Muʿallaqāt (Arabic literature)»، Encyclopaedia Britannica۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ عجائب گھر کو دیے گئے ایک تحقیقی خلاصے سے ہے جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ اس کے لیے دیا گیا: سات معلقات جیسے روایت ہوئیں اور دس قصیدوں والی روایتوں میں شامل کیے گئے تین مزید شاعر۔"
  fr: "La page « Al-Muʿallaqāt (Arabic literature) » (Encyclopaedia Britannica). Le musée ne l'a pas ouverte lui-même : ce qu'on en sait vient d'une synthèse de recherche remise au musée et approuvée pour usage par le fondateur le 21 novembre 2026. Citée pour : les sept Mu'allaqat telles que transmises et les trois poètes ajoutés dans les recensions à dix odes."
  es: "La página «Al-Muʿallaqāt (Arabic literature)» (Encyclopaedia Britannica). El museo no la abrió por sí mismo: lo que se sabe de ella procede de un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026. Citada para: las siete Mu'allaqat tal como se transmitieron y los tres poetas añadidos en las recensiones de diez odas."
  tr: "Encyclopaedia Britannica'daki \"Al-Muʿallaqāt (Arap edebiyatı)\" sayfası. Müze kendisi açmamıştır; içeriği, müzeye sunulan ve kurucu tarafından 21 Kasım 2026'da onaylanan bir araştırma özetinden bilinmektedir. Kitap, şu kitaplarda yer almaktadır: Anlatılan Yedi Mu'allaqat ve On Mu'allaqat romanında eklenen üç şair."
  id: "Halaman \"Al-Muʿallaqāt (sastra Arab)\" dalam Encyclopaedia Britannica. Museum itu sendiri tidak membukanya; isinya diketahui dari ringkasan penelitian yang diserahkan ke museum dan disetujui oleh pendiri pada 21 November 2026. Buku ini dikutip dalam: Tujuh Mu'allaqat yang Diceritakan, dan Tiga Penyair Ditambahkan dalam Sepuluh Novel Mu'allakat."
