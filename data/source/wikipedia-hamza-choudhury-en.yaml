reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id. It gives his full name as Hamza Dewan Choudhury, born 1 October 1997 in Loughborough to a Grenadian father and a Bangladeshi mother from Habiganj; a Leicester City academy product who made over 100 senior appearances for the club, won the FA Cup in 2021 and the EFL Championship in 2024, had loans at Burton Albion, Watford and Sheffield United before joining Sheffield United permanently in 2026; an England under-21 international who took a Bangladeshi passport in late 2024 and switched to Bangladesh. On religion its personal-life section states, citing one 2019 web article, that he is a Sunni Muslim who attended evening madrasa in his youth and recites passages of the Qur'an and supplications before matches, and that he was raised in a traditional Bangladeshi Muslim household. The Sunni statement rests on that single cited source within this article."
