reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id through the MediaWiki API. It gives Atiku as born on 25 November 1946 in Jada, then in the British Cameroons, a customs officer for twenty years who retired as a deputy director in April 1989, vice president under Olusegun Obasanjo (1999–2007), a six-time presidential aspirant or candidate (1993–2023), and, from 2025, a member of the African Democratic Congress. On religion its text attests once, in the account of his marriages, that a fourth wife was 'the maximum permitted him as a Muslim'; no school is named anywhere, and its categories file him under 'Nigerian Muslims'."
