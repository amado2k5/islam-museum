summary:
  ar: "مقالة ويكيبيديا الروسية عن عبد الله رحيم باييف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 1 يونيو 1896 (19 مايو بالتقويم القديم) في خوجند في أسرة تاجر، وعضويته وقيادته سنة 1917 لمنظمة «شورى الإسلامية» الخوجندية ثم أمانته لمجلس العمال المسلمين في خوجند، ورئاسته للجنة التنفيذية المركزية لتركستان ثم أمانته للجنة المركزية للحزب الشيوعي الأوزبكي، ورئاسته لحكومة طاجيكستان 1933–1937، واعتقاله سنة 1937 وإعدامه في موسكو في 7 مايو 1938 وردّ اعتباره سنة 1956. منظمتا 1917 نشاط سياسي في سنة ثورية، لا شهادة على انتمائه الشخصي."
  en: "Russian Wikipedia article on Abdullo Rakhimbayev; used for entity facts only. It gives his birth on 1 June 1896 (19 May Old Style) in Khujand in a trader's family, his membership in and leadership of the Khujand Shuro-i-Islamiya organisation in 1917 and then his secretaryship of the Khujand Council of Muslim Workers, his chairmanship of the Central Executive Committee of Turkestan and secretaryship of the Central Committee of the Communist Party of Uzbekistan, his premiership of Tajikistan 1933–1937, his arrest in 1937, his execution in Moscow on 7 May 1938 and his rehabilitation in 1956. The 1917 organisations are political activity in a revolutionary year, not an attestation of his personal affiliation."
