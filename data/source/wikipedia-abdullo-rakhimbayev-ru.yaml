summary:
  ar: "مقالة ويكيبيديا الروسية عن عبد الله رحيم باييف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 1 يونيو 1896 ⁦(19 مايو بالتقويم القديم)⁩ في خوجند في أسرة تاجر، وعضويته وقيادته سنة 1917 لمنظمة «شورى الإسلامية» الخوجندية ثم أمانته لمجلس العمال المسلمين في خوجند، ورئاسته للجنة التنفيذية المركزية لتركستان ثم أمانته للجنة المركزية للحزب الشيوعي الأوزبكي، ورئاسته لحكومة طاجيكستان 1933–1937، واعتقاله سنة 1937 وإعدامه في موسكو في 7 مايو 1938 وردّ اعتباره سنة 1956. منظمتا 1917 نشاط سياسي في سنة ثورية، لا شهادة على انتمائه الشخصي."
  en: "Russian Wikipedia article on Abdullo Rakhimbayev; used for entity facts only. It gives his birth on 1 June 1896 (19 May Old Style) in Khujand in a trader's family, his membership in and leadership of the Khujand Shuro-i-Islamiya organisation in 1917 and then his secretaryship of the Khujand Council of Muslim Workers, his chairmanship of the Central Executive Committee of Turkestan and secretaryship of the Central Committee of the Communist Party of Uzbekistan, his premiership of Tajikistan 1933–1937, his arrest in 1937, his execution in Moscow on 7 May 1938 and his rehabilitation in 1956. The 1917 organisations are political activity in a revolutionary year, not an attestation of his personal affiliation."
  es: "Artículo de la Wikipedia rusa sobre Abdullo Rakhimbayev; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 1 de junio de 1896 (19 de mayo según el calendario antiguo) en Khujand en el seno de una familia de comerciantes, su pertenencia y liderazgo de la organización Khujand Shuro-i-Islamiya en 1917, su posterior secretaría del Consejo de Trabajadores Musulmanes de Khujand, su presidencia del Comité Ejecutivo Central de Turkestán y su secretaría del Comité Central del Partido Comunista de Uzbekistán, su mandato como primer ministro de Tayikistán entre 1933 y 1937, su arresto en 1937, su ejecución en Moscú el 7 de mayo de 1938 y su rehabilitación en 1956. Las organizaciones de 1917 representan actividad política en un año revolucionario, no una prueba de su afiliación personal."
  fr: "L'article de Wikipédia russe sur Abdullo Rakhimbayev, utilisé uniquement pour des informations factuelles, indique sa naissance le 1er juin 1896 (19 mai, ancien calendrier) à Khodjent, dans une famille de commerçants. Il mentionne également son appartenance et sa direction au sein de l'organisation Khodjent Shuro-i-Islamiya en 1917, puis son poste de secrétaire du Conseil des travailleurs musulmans de Khodjent, sa présidence du Comité exécutif central du Turkestan et son secrétariat du Comité central du Parti communiste d'Ouzbékistan, son mandat de Premier ministre du Tadjikistan de 1933 à 1937, son arrestation en 1937, son exécution à Moscou le 7 mai 1938 et sa réhabilitation en 1956. L'implication dans les organisations de 1917 relève de son activité politique durant une année révolutionnaire et ne constitue pas une preuve de son appartenance personnelle."
