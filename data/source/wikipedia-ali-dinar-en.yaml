summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي دينار ⁦(ت. 1916)⁩؛ تُستخدم لوقائع الكيان فقط. تجعله آخر سلاطين دارفور من الأسرة الكيراوية، وتروي خضوعه للمهديين ثم فراره عند معركة أم درمان واستعادته السلطنة وقتله في غزو 1916."
  en: "English Wikipedia article on Ali Dinar (d. 1916); used for entity facts only. It makes him the last sultan of Darfur of the Keira dynasty, and recounts his submission to the Mahdists, his flight at the battle of Omdurman, his restoration of the sultanate, and his death in the invasion of 1916."
  es: "Artículo de la Wikipedia en inglés sobre Ali Dinar (fallecido en 1916); utilizado únicamente para datos sobre la persona. Lo presenta como el último sultán de Darfur de la dinastía Keira y relata su sumisión a los mahdistas, su huida en la batalla de Omdurman, la restauración del sultanato y su muerte en la invasión de 1916."
  fr: "Article de Wikipédia en anglais sur Ali Dinar (décédé en 1916); utilisé uniquement à des fins d’information sur l’entité. Il le présente comme le dernier sultan du Darfour de la dynastie Keira et relate sa soumission aux Mahdistes, sa fuite lors de la bataille d’Omdurman, la restauration de son sultanat et sa mort lors de l’invasion de 1916."
  ur: "علی دینار ⁦(متوفی 1916)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے کیرا خاندان کے دارفور کا آخری سلطان بناتا ہے، اور مہدیوں کے سامنے اس کی سر تسلیم خم کرنے، اومدرمان کی جنگ میں اس کی پرواز، اس کی سلطنت کی بحالی، اور 1916 کے حملے میں اس کی موت کا ذکر کرتا ہے۔"
  tr: "Ali Dinar (ö. 1916) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bu makale, onu Kirawi hanedanından Darfur'un son sultanı yapar ve Mahdi'lere boyun eğmesini, Omdurman Muharebesi'ndeki kaçışını, sultanlığı yeniden ele geçirmesini ve 1916 işgalinde suikasta uğramasını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ali Dinar (wafat 1916); hanya digunakan untuk fakta entitas. Artikel ini menjadikannya sultan terakhir Darfur dari dinasti Kirawi, dan menceritakan penyerahannya kepada Mahdi, pelariannya dalam Pertempuran Omdurman, perebutan kembali kesultanan, dan pembunuhannya dalam invasi tahun 1916."
