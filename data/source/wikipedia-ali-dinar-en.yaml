reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: full name Muhammad Ali Dinar; born 'c. 1865' (the Arabic and French articles and the founder's queue give c. 1856, which the record follows; Wikidata gives the 1860s at decade precision — all variants recorded in the record); ascended the throne in 1891 after his cousin the 'shadow sultan' Abu l-Khayrat was killed by rebellious slaves — some sources allege he incited the death, an allegation the article records him denying, and the museum carries it only as that attributed allegation; surrendered to the Mahdists at al-Fashir on 13 October 1891; imprisoned for drinking wine and saved by the intercession of the amir Mahmud w. Ahmad; taken to Omdurman and presented to the Khalifa Abdallahi; returned to Darfur in June 1894 and sent back to Omdurman in January 1895 under suspicion of intending rebellion; served the amir Ibrahim al-Khalil in the Nuba Mountains in 1896; fled back to Darfur just before or during the battle of Omdurman (1898) with many notables of the old sultanate, reasserted the sultanate's authority, built a functioning judiciary and 'rooted out Mahdist influence', and opened diplomacy with the Sanusiyya, Wadai, Dar Sila and Dar al-Kuti; in 1915 he declared support for the Ottoman Empire in the First World War, the British invaded Darfur, and he was killed in action on 6 November 1916, after which the sultanate was incorporated into Anglo-Egyptian Sudan. Its references include Theobald's biography 'Ali Dinar, Last Sultan of Darfur, 1898–1916' and O'Fahey's history of the Darfur Sultanate. The article names no school of law or theology for him."
