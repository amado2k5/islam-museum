reliability_note: "An institutional event biography published by the London branch of the Yunus Emre Institute for its January 2023 concert tour; used only for the biographical facts it states plainly: birth on 16 August 1978 in Ankara, the start of his broadcasting career in 1996, his Ramadan programmes, and his three poetry albums and three poetry books. It names no school for him. Read in full on 16 November 2026."
