summary:
  ar: "سيرة سردار تونجر في صفحة فعالية معهد يونس إمره في لندن؛ تقول إنه وُلد في 16 أغسطس 1978 في أنقرة، وبدأ مسيرته الإعلامية سنة 1996 في إذاعة بيرق بأنقرة، وقدّم برامج رمضانية على قنوات تركية، وله ثلاثة دواوين وثلاثة كتب شعرية."
  en: "Biography of Serdar Tuncer on the Yunus Emre Institute London event page; it states that he was born on 16 August 1978 in Ankara, began his broadcasting career in 1996 at Ankara Bayrak Radio, presented Ramadan programmes on Turkish channels, and has three poetry albums and three poetry books."
  es: "La biografía de Serdar Tuncer aparece en la página del evento del Instituto Yunus Emre de Londres; en ella se indica que nació el 16 de agosto de 1978 en Ankara, comenzó su carrera en la radiodifusión en 1996 en Ankara Bayrak Radio, presentó programas de Ramadán en canales turcos y tiene tres álbumes y tres libros de poesía."
  fr: "Biographie de Serdar Tuncer sur la page de l'événement de l'Institut Yunus Emre de Londres; il est indiqué qu'il est né le 16 août 1978 à Ankara, qu'il a commencé sa carrière dans la radiodiffusion en 1996 à Ankara Bayrak Radio, qu'il a présenté des émissions sur le Ramadan sur des chaînes turques et qu'il a publié trois albums et trois recueils de poésie."
title: "'Yunus'un İzinde' Sufi Music Concert and Poetry Recital in London with Serdar Tuncer and Zejd Šoto"
