summary:
  ar: "مقالة ويكيبيديا الأردية عن ديمس هاسابيس، تعطي ولادته في 27 يوليو 1976 وتصفه بأنه عالم بريطاني حائز جائزة نوبل. لا تذكر أي انتماء ديني."
  en: "The Urdu Wikipedia article on Demis Hassabis, giving his birth on 27 July 1976 and describing him as a British Nobel-laureate scientist. It names no religious affiliation."
  es: "El artículo de Wikipedia en urdu sobre Demis Hassabis indica que nació el 27 de julio de 1976 y lo describe como un científico británico ganador del Premio Nobel. No menciona ninguna afiliación religiosa."
  fr: "L'article de Wikipédia en ourdou consacré à Demis Hassabis indique sa date de naissance, le 27 juillet 1976, et le décrit comme un scientifique britannique lauréat du prix Nobel. Il ne mentionne aucune appartenance religieuse."
  ur: "ڈیمس ہسابیس پر اردو ویکیپیڈیا کا مضمون، جس میں ان کی پیدائش 27 جولائی 1976 کو ہوئی تھی اور اسے برطانوی نوبل انعام یافتہ سائنسدان کے طور پر بیان کیا گیا تھا۔ یہ کسی مذہبی وابستگی کا نام نہیں لیتا۔"
  tr: "Urduca Wikipedia'daki Demokrat Hasabis'in 27 Temmuz 1976'da doğduğu hakkında makale, onu İngiliz bilim insanı ve Nobel Ödülü sahibi olarak tanımlıyor. Herhangi bir dini aidiyetten bahsedilmiyor."
  id: "Artikel Wikipedia berbahasa Urdu tentang Demokrat Hasabis, yang melahirkannya pada 27 Juli 1976, menggambarkannya sebagai ilmuwan Inggris dan peraih Hadiah Nobel. Artikel tersebut tidak menyebutkan afiliasi agama apa pun."
