summary:
  ar: "فصل أكاديمي لجيريمي بريستهولت في كتاب «مسلمون عالميون في عصر البخار والطباعة» (مطبعة جامعة كاليفورنيا، 2014) عن سلمة بنت سعيد / إميلي رويته (1844-1924)، أول زنجبارية بل أول امرأة عربية تنشر مذكراتها؛ يذكر أنها هربت مع تاجر ألماني واعتنقت المسيحية، وأن مذكراتها (1886) تروي حياتها في زنجبار ورحلتها بين عالمين."
  en: "Jeremy Prestholdt's academic chapter in Global Muslims in the Age of Steam and Print (University of California Press, 2014) on Sayyida Salme bint Said / Emily Ruete (1844–1924), the first Zanzibari and first Arab woman to publish her memoirs; it states that she eloped with a German merchant and converted to Christianity, and that her Memoirs (1886) narrate her Zanzibar upbringing and her life between two worlds."
title: "From Zanzibar to Beirut: Sayyida Salme bint Said and the Tensions of Cosmopolitanism"
