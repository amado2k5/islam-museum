  ar: "صفحة ترجمة بدر بن علي بن طامي العتيبي في موقع مصنفاته: نسبه الكامل ومولده في الطائف منتصف جمادى الآخرة 1392هـ، وملازمته لابن باز عشر سنين، وشيوخه وإجازاته من أكثر من مائة وخمسين شيخا، ومؤلفاته ودروسه في مساجد الطائف."
  en: "The biography page of Badr ibn Ali ibn Tami al-Utaybi on his works site (Mosannefat): his full lineage, his birth in Taif in mid-Jumada al-Akhirah 1392 AH, his ten years with Ibn Baz, his teachers and ijazahs from more than 150 scholars, and his books and teaching in Taif's mosques."
