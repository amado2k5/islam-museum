reliability_note: "His own works site, where his books are published; the biography was written up by a student from the author's dictation and papers, so it is a primary source for his name, birth, teachers, ijazahs and works, not independent corroboration. It describes him as 'al-Hanbali al-Athari in creed and in fiqh' — the only source found that names a school for him. The IslamHouse author directory republishes the same biography (without that phrase), so the two are one source family. Checked 25 October 2026."
