summary:
  ar: "صفحة ترجمة بدر بن علي بن طامي العتيبي في موقع مصنفاته: نسبه الكامل ومولده في الطائف منتصف جمادى الآخرة 1392هـ، وملازمته لابن باز عشر سنين، وشيوخه وإجازاته من أكثر من مائة وخمسين شيخا، ومؤلفاته ودروسه في مساجد الطائف."
  en: "The biography page of Badr ibn Ali ibn Tami al-Utaybi on his works site (Mosannefat): his full lineage, his birth in Taif in mid-Jumada al-Akhirah 1392 AH, his ten years with Ibn Baz, his teachers and ijazahs from more than 150 scholars, and his books and teaching in Taif's mosques."
  es: "La página biográfica de Badr ibn Ali ibn Tami al-Utaybi en su sitio web de obras (Mosannefat): su linaje completo, su nacimiento en Taif a mediados de Jumada al-Akhirah de 1392 AH, sus diez años con Ibn Baz, sus maestros e ijazahs de más de 150 eruditos, y sus libros y enseñanzas en las mezquitas de Taif."
  fr: "La page biographique de Badr ibn Ali ibn Tami al-Utaybi sur son site d'œuvres (Mosannefat): sa lignée complète, sa naissance à Taïf au milieu de Jumada al-Akhirah 1392 AH, ses dix années avec Ibn Baz, ses enseignants et les ijazahs de plus de 150 savants, ainsi que ses livres et son enseignement dans les mosquées de Taïf."
  ur: "بدر بن علی ابن تمی العتیبی کی سوانح عمری کا صفحہ ان کے کام کی جگہ ⁦(موسنافات)⁩: ان کا مکمل سلسلہ نسب، ان کی ولادت طائف میں جمادۃ الآخرۃ 1392 ہجری کے وسط میں، ابن باز کے ساتھ ان کے دس سال، ان کے اساتذہ اور 150 سے زیادہ علماء کے اعجاز اور طائف کی مساجد میں ان کی تعلیمات۔"
  tr: "Eserlerinin web sitesindeki Badr bin Ali bin Tami Al-Otaibi'nin biyografisi sayfası: Tam soy ve doğumu, 1392 Hicri Cumada'l-Ahirah ortasında Taif'te, on yıl boyunca İbn Baz ile arkadaşlığı, öğretmenleri ve yüz elliden fazla şeyhten aldığı yetkiler ile Taif camilerindeki yazıları ve dersleri."
  id: "Halaman tentang biografi Badr bin Ali bin Tami Al-Otaibi di situs web karyanya: Garis keturunan lengkap dan kelahirannya di Taif pada pertengahan Jumada al-Akhirah 1392 H, kebersamaannya dengan Ibn Baz selama sepuluh tahun, guru-gurunya dan otorisasi dari lebih dari seratus lima puluh sheikh, serta tulisan dan pelajarannya di masjid-masjid Taif."
