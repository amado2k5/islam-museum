  ar: "مقالة ويكيبيديا الإنجليزية عن محمد علي جوهر (1878–1931)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في رامبور في 10 ديسمبر 1878، وتعليمه في عليكرة وأكسفورد، وتأسيسه صحيفتي «كومريد» و«همدرد»، وقيادته حركة الخلافة، ورئاسته المؤتمر الوطني الهندي سنة 1923، وسجنه في كراتشي، ووفاته في لندن في 4 يناير 1931 ودفنه في القدس."
  en: "English Wikipedia article on Mohammad Ali Jauhar (1878–1931); used for entity facts only. It recounts his birth at Rampur on 10 December 1878, his education at Aligarh and Oxford, his founding of The Comrade and Hamdard, his leadership of the Khilafat movement, his 1923 presidency of the Indian National Congress, his Karachi imprisonment, and his death in London on 4 January 1931 and burial in Jerusalem."
