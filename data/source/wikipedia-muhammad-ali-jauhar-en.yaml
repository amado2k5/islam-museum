summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد علي جوهر (1878–1931)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في رامبور في 10 ديسمبر 1878، وتعليمه في عليكرة وأكسفورد، وتأسيسه صحيفتي «كومريد» و«همدرد»، وقيادته حركة الخلافة، ورئاسته المؤتمر الوطني الهندي سنة 1923، وسجنه في كراتشي، ووفاته في لندن في 4 يناير 1931 ودفنه في القدس."
  en: "English Wikipedia article on Mohammad Ali Jauhar (1878–1931); used for entity facts only. It recounts his birth at Rampur on 10 December 1878, his education at Aligarh and Oxford, his founding of The Comrade and Hamdard, his leadership of the Khilafat movement, his 1923 presidency of the Indian National Congress, his Karachi imprisonment, and his death in London on 4 January 1931 and burial in Jerusalem."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Ali Jauhar (1878-1931); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Rampur el 10 de diciembre de 1878, su educación en Aligarh y Oxford, la fundación de The Comrade and Hamdard, su liderazgo del movimiento Khilafat, su presidencia del Congreso Nacional Indio en 1923, su encarcelamiento en Karachi y su muerte en Londres el 4 de enero de 1931, con posterior entierro en Jerusalén."
  fr: "Article de Wikipédia en anglais sur Mohammad Ali Jauhar (1878-1931); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Rampur le 10 décembre 1878, ses études à Aligarh et à Oxford, la fondation des journaux The Comrade et Hamdard, son rôle à la tête du mouvement Khilafat, sa présidence du Congrès national indien en 1923, son emprisonnement à Karachi, sa mort à Londres le 4 janvier 1931 et son inhumation à Jérusalem."
  ur: "محمد علی جوہر (1878-1931) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 10 دسمبر 1878 کو رام پور میں ان کی پیدائش، علی گڑھ اور آکسفورڈ میں ان کی تعلیم، کامریڈ اور ہمدرد کی بنیاد، تحریک خلافت کی قیادت، ان کی 1923 میں انڈین نیشنل کانگریس کی صدارت، ان کی کراچی قید، اور 4 جنوری 1931 کو لندن میں ان کی موت اور یروشلم میں تدفین کا ذکر ہے۔"
  tr: "Muhammed Ali Jawhar (1878–1931) hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 10 Aralık 1878'de Rampur'daki doğumunu, Aligarh ve Oxford'daki eğitimini, 'Comrad' ve 'Hamdard' gazetelerinin kuruluşunu, Hilafa Hareketi'nin liderliğini, 1923'te Hindistan Ulusal Kongresi başkanlığını, Karaçi'de hapsedilmesini, 4 Ocak 1931'de Londra'da ölmesini ve Kudüs'te defnedilmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad Ali Jawhar (1878–1931); digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Rampur pada 10 Desember 1878, pendidikannya di Aligarh dan Oxford, pendirian surat kabar 'Comrad' dan 'Hamdard', kepemimpinannya dalam Gerakan Khilafa, kepresidenannya di Kongres Nasional India pada tahun 1923, penahanannya di Karachi, kematiannya di London pada 4 Januari 1931, dan pemakamannya di Yerusalem."
