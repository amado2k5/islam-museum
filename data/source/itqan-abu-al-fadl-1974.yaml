summary:
  ar: "كتاب الإتقان في علوم القرآن لـالسيوطي، تحقيق محمد أبو الفضل إبراهيم، الهيئة المصرية العامة للكتاب؛ قُرئ في نسخة المكتبة الشاملة الموافقة للمطبوع في 21 نوفمبر 2026، في موضوع: المعرَّب في القرآن والصرفة."
