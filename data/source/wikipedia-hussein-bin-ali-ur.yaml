  ar: "مقالة ويكيبيديا الأردية المختصرة عن حسين بن علي الهاشمي، شريف مكة من 1908، الذي ثار على الدولة العثمانية في الحرب العالمية الأولى بمساعدة بريطانيا ولورنس، وحاصر المدينة المنورة سنتين، وهزمه ابن سعود سنة 1924 فنُفي إلى قبرص حتى 1931 ثم توفي في عمان، وصار ابناه ملكين على العراق والأردن."
  en: "Short Urdu Wikipedia article on Hussein bin Ali al-Hashimi, Sharif of Mecca from 1908, who revolted against the Ottoman Empire in the First World War with British help and Lawrence's, besieged Medina for two years, was defeated by Ibn Saud in 1924, exiled to Cyprus until 1931 and died at Amman, his two sons becoming kings of Iraq and of Jordan."
