summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مامادي دومبوي؛ تُستخدم لوقائع الكيان فقط. تروي خدمته في الفيلق الأجنبي الفرنسي وقيادته مجموعة القوات الخاصة الغينية وانقلابه في 5 سبتمبر 2021 على الرئيس ألفا كوندي وتنصيبه رئيسا مؤقتا في 1 أكتوبر 2021 وفوزه بانتخابات 2025 وتنصيبه رئيسا مدنيا في يناير 2026. تعطي ميلاده 5 ديسمبر 1984 في منطقة كانكان، وهو تاريخ متنازع عليه، ولا تذكر دينه في أي نص؛ وتصنّفه ضمن مسلمي غينيا."
  en: "English Wikipedia article on Mamady Doumbouya; used for entity facts only. It recounts his service in the French Foreign Legion, his command of Guinea's Special Forces Group, his coup of 5 September 2021 against President Alpha Condé, his swearing-in as interim president on 1 October 2021, his victory in the 2025 election and his inauguration as civilian president in January 2026. It gives his birth as 5 December 1984 in the Kankan Region — a disputed date — and its text says nothing about his religion; it files him under Guinean Muslims."
  es: "Artículo de la Wikipedia en inglés sobre Mamady Doumbouya; utilizado únicamente para datos sobre la persona. Relata su servicio en la Legión Extranjera Francesa, su mando del Grupo de Fuerzas Especiales de Guinea, su golpe de Estado del 5 de septiembre de 2021 contra el presidente Alpha Condé, su toma de posesión como presidente interino el 1 de octubre de 2021, su victoria en las elecciones de 2025 y su investidura como presidente civil en enero de 2026. Indica que nació el 5 de diciembre de 1984 en la región de Kankan —una fecha controvertida— y su texto no menciona su religión; lo clasifica dentro de los musulmanes guineanos."
  fr: "Article de Wikipédia en anglais sur Mamady Doumbouya; utilisé uniquement à des fins d’information sur l’entité. Il relate son service dans la Légion étrangère française, son commandement du Groupe des forces spéciales de Guinée, son coup d’État du 5 septembre 2021 contre le président Alpha Condé, sa prestation de serment comme président par intérim le 1er octobre 2021, sa victoire aux élections de 2025 et son investiture comme président civil en janvier 2026. Il indique sa date de naissance comme étant le 5 décembre 1984 dans la région de Kankan – une date contestée – et ne mentionne rien de sa religion; il est classé parmi les musulmans guinéens."
  ur: "Mamady Doumbouya پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں فرانسیسی فارن لیجن میں ان کی خدمات، گنی کے اسپیشل فورسز گروپ کی ان کی کمانڈ، صدر الفا کونڈے کے خلاف 5 ستمبر 2021 کی بغاوت، 1 اکتوبر 2021 کو عبوری صدر کے طور پر ان کی حلف برداری، 2025 کے انتخابات میں ان کی فتح اور جنوری 2026 میں سویلین صدر کے طور پر ان کے حلف کا ذکر کیا گیا ہے۔ متنازعہ تاریخ - اور اس کا متن اس کے مذہب کے بارے میں کچھ نہیں کہتا۔ یہ اسے گنی کے مسلمانوں کے تحت فائل کرتا ہے۔"
  tr: "Mamadi Domboy hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Fransız Yabancı Lejyonu'ndaki hizmetini ve Gine Özel Kuvvetler Grubu'nun liderliğini, 5 Eylül 2021'deki darbesini, 1 Ekim 2021'de geçici cumhurbaşkanı olarak atanmasını, 2025 seçimlerindeki zaferini ve Ocak 2026'da sivil cumhurbaşkanı olarak atanmasını anlatmaktadır. 5 Aralık 1984'te Kankan bölgesinde doğduğu belirtilmiştir; bu tarih tartışmalıdır ve dini hiçbir metinde belirtilmemiştir; bu tarih onu Gine'deki Müslümanlar arasında sınıflandırmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Mamadi Domboy; digunakan hanya untuk fakta entitas. Artikel ini menceritakan pengabdiannya di Legiun Asing Prancis dan kepemimpinannya di Kelompok Pasukan Khusus Guinea, kudetanya pada 5 September 2021, pengangkatannya sebagai presiden sementara pada 1 Oktober 2021, kemenangannya dalam pemilihan 2025, dan pengangkatannya sebagai presiden sipil pada Januari 2026. Dia dinyatakan lahir pada 5 Desember 1984 di wilayah Kankan, tanggal yang diperdebatkan, yang agamanya tidak disebutkan dalam teks manapun; ini mengklasifikasikannya di antara Muslim Guinea."
