summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مامادي دومبوي؛ تُستخدم لوقائع الكيان فقط. تروي خدمته في الفيلق الأجنبي الفرنسي وقيادته مجموعة القوات الخاصة الغينية وانقلابه في 5 سبتمبر 2021 على الرئيس ألفا كوندي وتنصيبه رئيسا مؤقتا في 1 أكتوبر 2021 وفوزه بانتخابات 2025 وتنصيبه رئيسا مدنيا في يناير 2026. تعطي ميلاده 5 ديسمبر 1984 في منطقة كانكان، وهو تاريخ متنازع عليه، ولا تذكر دينه في أي نص؛ وتصنّفه ضمن مسلمي غينيا."
  en: "English Wikipedia article on Mamady Doumbouya; used for entity facts only. It recounts his service in the French Foreign Legion, his command of Guinea's Special Forces Group, his coup of 5 September 2021 against President Alpha Condé, his swearing-in as interim president on 1 October 2021, his victory in the 2025 election and his inauguration as civilian president in January 2026. It gives his birth as 5 December 1984 in the Kankan Region — a disputed date — and its text says nothing about his religion; it files him under Guinean Muslims."
