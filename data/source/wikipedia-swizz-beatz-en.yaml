reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026, and its content checked against the recorded revision. It gives Kasseem Daoud Dean, born 13 September 1978 in the Bronx, raised by his mother in the North East Bronx; his start as a DJ in 1994; his rise through his family's Ruff Ryders Entertainment and his production for DMX, including 'Ruff Ryders' Anthem' on the 1998 album It's Dark and Hell Is Hot; the protégé Cassidy and his own imprint Full Surface Records (2001); his albums Swizz Beatz Presents G.H.E.T.T.O. Stories (2002), One Man Band Man (2007) and Poison (2018); his production credits for Beyoncé, T.I., Drake, Kanye West and Lil Wayne among others; one Grammy Award from five nominations; the 2010 NYU Producer in Residence post; his Brooklyn Museum trusteeship (from 2015) and creative-director roles; his marriages and children; and the Verzuz webcast series he co-created with Timbaland in 2020. No statement of his religion appears anywhere in the article."
