reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth in May 1604 at Edirne, his father the müderris Habbazzade Hasan Efendi called Salbaş, his teaching posts at Edirne, his 1632 hajj, and his death at Edirne in 1658 or 1659, the tombstone giving only the year 1069 AH. It calls Abdülkadir Efendi his paternal uncle, where the TDV entry calls him his brother; the discrepancy is recorded in the person record and no relation edge is built on it. It names no school or order for Hibri himself. Checked 1 November 2026."
