summary:
  ar: "مقال موسوعي عن نازيه حسن (1965–2000)، ملكة البوب في جنوب آسيا؛ يذكر ولادتها في كراتشي ووفاتها في لندن ومسيرتها مع أخيها زوهيب."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives her birth at Karachi on 3 April 1965 and her death from lung cancer at London on 13 August 2000, her career with her brother Zoheb, her burial with Islamic rites at Hendon Cemetery, and the Pride of Performance awarded posthumously in 2002."
  es: "Artículo de enciclopedia editado por la comunidad, recuperado íntegramente en la revisión indicada; en él se menciona su nacimiento en Karachi el 3 de abril de 1965 y su muerte por cáncer de pulmón en Londres el 13 de agosto de 2000, su carrera junto a su hermano Zoheb, su entierro con ritos islámicos en el cementerio de Hendon y el premio Pride of Performance que se le otorgó póstumamente en 2002."
  fr: "Article encyclopédique édité par la communauté, récupéré intégralement à la version indiquée; il donne sa naissance à Karachi le 3 avril 1965 et sa mort d'un cancer du poumon à Londres le 13 août 2000, sa carrière avec son frère Zoheb, son enterrement selon les rites islamiques au cimetière de Hendon et le prix Pride of Performance décerné à titre posthume en 2002."
  ur: "کمیونٹی میں ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظرثانی پر مکمل طور پر بازیافت کیا گیا؛ یہ 3 اپریل 1965 کو کراچی میں اس کی پیدائش اور 13 اگست 2000 کو لندن میں پھیپھڑوں کے کینسر سے اس کی موت، اپنے بھائی زوہیب کے ساتھ اس کا کیریئر، ہینڈن قبرستان میں اسلامی رسومات کے ساتھ اس کی تدفین، اور 2002 میں پرائیڈ آف پرفارمنس سے نوازا گیا۔"
  tr: "Güney Asya'nın pop kraliçesi Nazih Hassan (1965–2000) hakkında ansiklopedik bir makale; Karaçi'deki doğumundan, Londra'daki ölümünden ve kardeşi Zohaib ile yolculuğundan bahsediyor."
  id: "Sebuah artikel ensiklopedis tentang Nazih Hassan (1965–2000), ratu pop di Asia Selatan; menyebutkan kelahirannya di Karachi, kematiannya di London, dan perjalanannya bersama saudaranya Zohaib."
