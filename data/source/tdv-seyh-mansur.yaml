reliability_note: "A scholarly encyclopedia entry resting on Ottoman archival documents (its bibliography lists the Basbakanlik archive registers, Cevdet's history and Smirnov). It gives his birth name as Uçermak (Uşurmek), Russian Ushurma, records researchers giving his birth as 1722 and as 1748, narrates the movement from the Ottoman reports, and gives his death at Schlüsselburg (Shlisselburg) on 13 April 1794. It is the strongest carrier of the attestation this record had to test, asserting in one clause that he was initiated into the Naqshbandi order in Dagestan (intisap) — an assertion for which it names no initiating shaykh and cites no document, and which Kemper's Encyclopaedia of Islam Three entry (2012) later found no evidence for. Read live in-session, 1 November 2026."
