summary:
  ar: "خبر موقع «أباوت إسلام» عن الإطلاق التجريبي لشبكة «مسلم نتورك تي في» في أمريكا الشمالية في أبريل 2020، وفيه تصريحات لطه غيور، نائب رئيس مؤسسة ساوند فيجن التي تقف خلف الشبكة."
  en: "AboutIslam's report of Muslim Network TV's soft launch in North America in April 2020, quoting Taha Ghayyur, Vice President of the Sound Vision Foundation behind the network."
  es: "Según el informe de AboutIslam sobre el lanzamiento preliminar de Muslim Network TV en Norteamérica en abril de 2020, que cita a Taha Ghayyur, vicepresidente de la Fundación Sound Vision, responsable de la cadena."
  fr: "Le rapport d'AboutIslam sur le lancement discret de Muslim Network TV en Amérique du Nord en avril 2020 cite Taha Ghayyur, vice-président de la Sound Vision Foundation à l'origine du réseau."
  ur: "اپریل 2020 میں شمالی امریکہ میں مسلم نیٹ ورک ٹی وی کے سافٹ لانچ کے بارے میں اسلام کی رپورٹ، اس نیٹ ورک کے پیچھے ساؤنڈ ویژن فاؤنڈیشن کے نائب صدر طحہ غیور کے حوالے سے۔"
  tr: "'İslam Hakkında' web sitesinden Nisan 2020'de Kuzey Amerika'da 'Muslim Network TV' ağının pilot lansmanına dair haberler, ağın arkasındaki ağ olan SoundVision'ın Başkan Yardımcısı Taha Gheour'un açıklamalarını içeriyor."
  id: "Berita dari situs web 'About Islam' tentang peluncuran pilot jaringan 'Muslim Network TV' di Amerika Utara pada April 2020, yang mencakup pernyataan dari Taha Gheour, Wakil Presiden SoundVision, jaringan di balik jaringan tersebut."
