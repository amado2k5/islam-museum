summary:
  ar: معجم ابن حجر العسقلاني (ت 852هـ) في تراجم أعيان القرن الثامن الهجري، مرتب على حروف المعجم، في أربعة أجزاء، دار الجيل ببيروت سنة 1414هـ/1993م، بتصحيح سالم الكرنكوي {cite:durar-kamina-jil-1993 1/3}.
  en: Ibn Hajar al-Asqalani's (d. 852 AH) dictionary of the notable people of the eighth Islamic century, arranged alphabetically, in four volumes, Dar al-Jil, Beirut, 1414/1993, in the text corrected by Salim al-Krenkow {cite:durar-kamina-jil-1993 1/3}.
  ur: ابن حجر عسقلانی (وفات 852ھ) کی آٹھویں صدی ہجری کے ممتاز لوگوں کی سوانحی لغت، حروفِ تہجی کی ترتیب سے، چار جلدیں، دار الجیل، بیروت، 1414ھ/1993ء، سالم کرنکوی کے تصحیح کردہ متن میں {cite:durar-kamina-jil-1993 1/3}۔
