  ar: "قناة معهد جنة على يوتيوب (@jannahinstitute)، المعهد التعليمي الذي أسسته هيفاء يونس وترأسه في إيرفاين بكاليفورنيا؛ مصدر أولي لمحاضراتها ودروسها وانتشارها، وتربط أوصاف فيديوهاتها بموقع المعهد وحساباتها."
  en: "The YouTube channel (@jannahinstitute) of Jannah Institute, the educational nonprofit Haifaa Younis founded and chairs in Irvine, California; a primary source for her lectures, courses and reach, its video descriptions linking the institute's site and her accounts."
  es: "El canal de YouTube (@jannahinstitute) del Instituto Jannah, la organización educativa sin ánimo de lucro que Haifaa Younis fundó y preside en Irvine, California; una fuente principal para sus conferencias, cursos y alcance, cuyas descripciones de vídeo enlazan con el sitio web del instituto y sus cuentas."
  fr: "La chaîne YouTube (@jannahinstitute) du Jannah Institute, l'organisme éducatif à but non lucratif fondé et présidé par Haifaa Younis à Irvine, en Californie; une source principale pour ses conférences, ses cours et sa portée, ses descriptions vidéo reliant le site de l'institut et ses comptes."
  ur: "Jannah انسٹی ٹیوٹ کا یوٹیوب چینل (@jannahinstitute)، تعلیمی غیر منفعتی حائفہ یونس نے Irvine، California میں قائم کیا اور کرسیاں سنبھالیں۔ اس کے لیکچرز، کورسز اور رسائی کا ایک بنیادی ذریعہ، اس کی ویڈیو کی تفصیل انسٹی ٹیوٹ کی سائٹ اور اس کے اکاؤنٹس کو جوڑتی ہے۔"
  tr: "Jannah Enstitüsü'nün YouTube kanalı (@jannahinstitute), Irvine, Kaliforniya'da Haifa Younis tarafından kurulan ve yönetilen eğitim kurumu, onun dersleri, dersleri ve yayımı için birincil kaynaktır; video açıklamalarını enstitünün web sitesi ve hesaplarına bağlamaktadır."
  id: "Saluran YouTube Jannah Institute (@jannahinstitute), institusi pendidikan yang didirikan dan dipimpin oleh Haifa Younis di Irvine, California, adalah sumber utama untuk kuliah, pelajaran, dan penyebarannya, dengan menautkan deskripsi video ke situs web dan akun institut."
