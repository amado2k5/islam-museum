summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد عطا الله ⁦(1924–2009)⁩؛ لوقائع الكيان فقط: مهندس مصري-أمريكي وُلد في بورسعيد ودرس في جامعة القاهرة ثم بوردو ⁦(ماجستير 1947 ودكتوراه 1949 في الهندسة الميكانيكية)⁩، عمل في مختبرات بِل منذ 1949 وقاد فريق ترانزستور صغيراً منذ 1956 ضم إيلين تانينباوم وإدوين شيبنر وداون كانغ، طوّر التخميل السطحي بالأكسدة الحرارية فحلّ مشكلة حالات سطح السيليكون، وصنع مع كانغ أول موسفت عام 1959 ثم عملا على أجهزة الحامل الحار ودَيودات شوتكي، واقترحا الدارة المتكاملة موس عام 1960، انتقل إلى إتش بي 1962 ففيرتشايلد 1969، أسس شركة عطا الله 1972 وأصدر «صندوق عطا الله» أول وحدة أمن أجهزة 1973 وبراءة نظام التحقق من الرقم السري عن بعد، لُقّب «أب الرقم السري»، نال ميدالية ستيوارت بالانتين 1975 وأُدخل قاعة مشاهير المخترعين 2009، وأُدرج اختراع موسفت 1959 في معالم IEEE عام 2014."
  en: "English Wikipedia article on Mohamed Atalla ⁦(1924–2009)⁩; entity facts only: Egyptian-American engineer born in Port Said, educated at Cairo University then Purdue ⁦(MSc 1947, PhD 1949 in mechanical engineering)⁩, at Bell Labs from 1949, leading a small transistor team from 1956 including Tannenbaum, Scheibner and Dawon Kahng; developed surface passivation by thermal oxidation solving the silicon surface-state problem, built the first MOSFET with Kahng in 1959, pioneering hot-carrier and Schottky-diode work and the MOS integrated circuit proposal of 1960; moved to HP in 1962 and Fairchild in 1969, founded Atalla Corporation in 1972, released the 'Atalla Box' first hardware security module in 1973 and a remote PIN-verification patent; called the 'Father of the PIN'; Stuart Ballantine Medal 1975, National Inventors Hall of Fame 2009, and the 1959 MOSFET listed as an IEEE milestone in 2014."
  es: "Artículo de la Wikipedia en inglés sobre Mohamed Atalla (1924–2009); solo datos de la entidad: ingeniero egipcio-estadounidense nacido en Port Said, educado en la Universidad de El Cairo y luego en Purdue (MSc 1947, PhD 1949 en ingeniería mecánica), en Bell Labs desde 1949, liderando un pequeño equipo de transistores desde 1956 que incluía a Tannenbaum, Scheibner y Dawon Kahng; desarrolló la pasivación de superficie por oxidación térmica resolviendo el problema del estado superficial del silicio, construyó el primer MOSFET con Kahng en 1959, pionero en el trabajo de portadores calientes y diodos Schottky y la propuesta de circuito integrado MOS de 1960; se trasladó a HP en 1962 y a Fairchild en 1969, fundó Atalla Corporation en 1972, lanzó la 'Atalla Box', el primer módulo de seguridad de hardware en 1973 y una patente de verificación remota de PIN; llamado el 'Padre del PIN'; Medalla Stuart Ballantine 1975, Salón Nacional de la Fama de los Inventores 2009, y el MOSFET de 1959 fue catalogado como un hito del IEEE en 2014."
  fr: "Article Wikipédia en anglais sur Mohamed Atalla (1924–2009); faits concernant l’entité uniquement: ingénieur égypto-américain né à Port-Saïd, formé à l’Université du Caire puis à Purdue (MSc 1947, PhD 1949 en génie mécanique), aux Bell Labs à partir de 1949, dirigeant une petite équipe de transistors à partir de 1956 comprenant Tannenbaum, Scheibner et Dawon Kahng; a développé la passivation de surface par oxydation thermique, résolvant le problème des états de surface du silicium, a construit le premier MOSFET avec Kahng en 1959, pionnier dans les travaux sur les porteurs chauds et les diodes Schottky et la proposition de circuit intégré MOS de 1960; a rejoint HP en 1962 et Fairchild en 1969, a fondé Atalla Corporation en 1972, a lancé le « Boîte Atalla », premier module de sécurité matériel, en 1973 et un brevet de vérification de code PIN à distance; appelé le « Père du code PIN »; Médaille Stuart Ballantine 1975, intronisation au National Inventors Hall of Fame 2009 et inscription du MOSFET de 1959 comme étape importante de l'IEEE en 2014."
