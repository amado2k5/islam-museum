summary:
  ar: "مخطوطة منتخبة من كتاب «إغاثة اللهفان» لابن قيم الجوزية في الرد على عبادة القبور والبدع عندها، جمعها رومي أفندي لبعض إخوانه؛ النسخة الرقمية من مكتبة الألوكة."
  en: "A selection from Ibn al-Qayyim's Ighathat al-Lahfan on grave worship and the innovations around graves, gathered by Rumi Efendi for a friend; the digital copy is from the Alukah library."
  es: "Una selección de Ighathat al-Lahfan de Ibn al-Qayyim sobre el culto a las tumbas y las innovaciones en torno a ellas, recopilada por Rumi Efendi para un amigo; la copia digital proviene de la biblioteca Alukah."
  fr: "Une sélection de l'ouvrage d'Ibn al-Qayyim, Ighathat al-Lahfan, sur le culte des tombes et les innovations liées aux sépultures, rassemblée par Rumi Efendi pour un ami; la copie numérique provient de la bibliothèque Alukah."
  ur: "قبر کی عبادت اور قبروں کے ارد گرد کی اختراعات پر ابن القیم کے اضافت اللفان سے ایک انتخاب، جسے رومی آفندی نے ایک دوست کے لیے جمع کیا تھا۔ ڈیجیٹل کاپی الوکہ لائبریری سے ہے۔"
  tr: "Rumi Efendi tarafından bazı kardeşleri için derlenen, mezar tapınması ve buna göre yeniliklere karşı İbn Kayyim al-Jawziyyah tarafından 'Ruhların Rahatlaması' adlı kitaptan seçilmiş bir el yazması; Al-Awlaka Kütüphanesi'nden dijital kopya."
  id: "Sebuah naskah pilihan dari buku 'Relief of the Souls' oleh Ibn Qayyim al-Jawziyyah sebagai penolakan terhadap pemujaan makam dan inovasi menurutnya, disusun oleh Rumi Effendi untuk beberapa saudaranya; salinan digital dari Perpustakaan Al-Awlaka."
