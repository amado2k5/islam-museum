reliability_note: "An event organiser's speaker page, independent of the subject: used for biographical facts only. It describes him as a globally renowned Islamic speaker with over 27 years delivering da'wah and community lectures, holding a degree in Shari'ah and Da'wah from the Ad-Da'wah Wal-Irshad University Institute in Tripoli, Lebanon, with further studies in biomedical science, teaching science and welfare counselling, and migration law and practice; over two decades as a secondary school teacher and counsellor; a registered imam and marriage celebrant with the Australian Federation of Islamic Councils; born and residing in Melbourne. It makes no statement naming a legal school for him. Checked 26 October 2026."
