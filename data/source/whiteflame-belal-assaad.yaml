summary:
  ar: "صفحة منظّم الجولات الأسترالي «وايت فلايم» عن جولة الشيخ بلال أسعد في أستراليا ونيوزيلندا، وفيها سيرة مستقلة عنه: شهادته من طرابلس بلبنان، وعمله مدرّسًا ومستشارًا، وتسجيله إمامًا ومأذونًا، ومولده وإقامته في ملبورن."
  en: "The Australian tour organiser White Flame's page for Sheikh Belal Assaad's Australia and New Zealand tour, carrying an independent biography: his degree from Tripoli, Lebanon, his work as a teacher and counsellor, his registration as an imam and marriage celebrant, and his birth and residence in Melbourne."
  es: "La página de White Flame, la empresa organizadora de la gira australiana, dedicada a la gira del jeque Belal Assaad por Australia y Nueva Zelanda, incluye una biografía independiente: su título universitario de Trípoli, Líbano, su trabajo como profesor y consejero, su registro como imán y oficiante de bodas, y su lugar de nacimiento y residencia en Melbourne."
  fr: "La page de White Flame, l'organisateur de voyages australien, consacrée à la tournée du cheikh Belal Assaad en Australie et en Nouvelle-Zélande, présente une biographie indépendante: son diplôme de Tripoli (Liban), son travail d'enseignant et de conseiller, son inscription comme imam et célébrant de mariage, ainsi que sa naissance et sa résidence à Melbourne."
  ur: "شیخ بلال اسد کے آسٹریلیا اور نیوزی لینڈ کے دورے کے لیے آسٹریلوی ٹور آرگنائزر وائٹ فلیم کا صفحہ، جس میں ایک آزاد سوانح ہے: طرابلس، لبنان سے ان کی ڈگری، ایک استاد اور مشیر کے طور پر ان کا کام، امام اور شادی کے جشن منانے والے کے طور پر ان کی رجسٹریشن، اور میلبورن میں ان کی پیدائش اور رہائش۔"
  tr: "Avustralya tur organizatörü 'White Flame'in sayfası, Şeyh Bilal Esaad'ın Avustralya ve Yeni Zelanda'daki turunu anlatıyor; kendisi hakkında bağımsız bir biyografi de yer alıyor: Trablus, Lübnan'daki tanıklığı, öğretmenlik ve danışmanlık çalışmaları, imam ve nikah memuru olarak kaydı, Melbourne'daki doğumu ve ikameti."
  id: "Halaman penyelenggara tur Australia 'White Flame' tentang tur Sheikh Bilal Asaad di Australia dan Selandia Baru, yang mencakup biografi independen tentangnya: kesaksiannya dari Tripoli, Lebanon, pekerjaannya sebagai guru dan penasihat, pendaftarannya sebagai imam dan upacara pernikahan, kelahiran dan tempat tinggalnya di Melbourne."
