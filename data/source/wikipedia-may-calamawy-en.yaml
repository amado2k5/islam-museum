reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Its infobox gives May El Calamawy, born 28 October 1986 in Bahrain, citizenship Egypt and Palestine; its early-life section records an Egyptian banker father, a Palestinian-Jordanian mother, an older brother, a childhood divided between Bahrain, Doha and Houston, high school in Bahrain, a BA in theatre studies from Emerson College, five years in Dubai from 2009 after her mother's illness and death, and training at the William Esper Studio after returning to the United States in 2015; its career section records Thursday (2006), Djinn (2013), Dena Hassan in Ramy (2019–2022), Together Together (2021), Layla El-Faouly / Scarlet Scarab in Moon Knight (2022), the cutting of her Gladiator II role, The Actor (2025) and Lee Cronin's The Mummy (2026); its personal-life section records her alopecia areata diagnosis at 22, written into Dena Hassan's storyline, her move to London, and her signing of the October 2023 Artists4Ceasefire open letter. No religion is named anywhere in the article, which is why her person record's faith segment is unknown."
