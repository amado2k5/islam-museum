summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مي القلماوي؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها في البحرين في 28 أكتوبر 1986 لأب مصري وأم فلسطينية-أردنية، ودراستها في إيمرسون وستوديو وليام إسبر، وأدوارها في «رامي» و«فارس القمر» و«جنّي» و«معًا معًا» وداء الثعلبة لديها. لا تذكر المقالة أي دين لها."
  en: "English Wikipedia article on May Calamawy; used for entity facts only. It records her birth in Bahrain on 28 October 1986 to an Egyptian father and a Palestinian-Jordanian mother, her studies at Emerson College and the William Esper Studio, her roles in Ramy, Moon Knight, Djinn and Together Together, and her alopecia areata. The article names no religion for her."
  es: "Artículo de la Wikipedia en inglés sobre May Calamawy; se utiliza únicamente para obtener información sobre la persona. En él se registra su nacimiento en Baréin el 28 de octubre de 1986, de padre egipcio y madre palestina-jordana; sus estudios en el Emerson College y el William Esper Studio; sus papeles en Ramy, Moon Knight, Djinn y Together Together; y su alopecia areata. El artículo no menciona su religión."
  fr: "Article Wikipédia en anglais sur May Calamawy; utilisé uniquement à titre informatif. Il relate sa naissance à Bahreïn le 28 octobre 1986 d'un père égyptien et d'une mère palestino-jordanienne, ses études à l'Emerson College et au William Esper Studio, ses rôles dans Ramy, Moon Knight, Djinn et Together Together, ainsi que son alopécie areata. L'article ne mentionne aucune religion."
  ur: "مئی کالاماوی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پیدائش 28 اکتوبر 1986 کو بحرین میں ایک مصری والد اور ایک فلسطینی-اردنی ماں کے ہاں، ایمرسن کالج اور ولیم ایسپر اسٹوڈیو میں اس کی تعلیم، رامی، مون نائٹ، جن اور ٹوگیدر ٹوگیدر میں اس کے کردار، اور اس کے ایلوپیشیا ایریاٹا کو ریکارڈ کیا گیا ہے۔ مضمون میں اس کے لیے کسی مذہب کا نام نہیں ہے۔"
  tr: "Mai Al-Qalamawi hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 28 Ekim 1986'da Bahreyn'de Mısırlı bir baba ve Filistin-Ürdünlü bir annenin çocuğu olarak doğduğu, Emerson ve William Esper Stüdyosu'nda eğitim aldığı ve \"Rami,\" \"Moon Knight,\" \"Jinni\" ve \"Together Together\" filmlerindeki rolleri ile alopesi hastalığı belgelenmiştir. Makalede herhangi bir dini belirtilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Mai Al-Qalamawi hanya digunakan untuk fakta entitas tersebut. Ia tercatat lahir di Bahrain pada 28 Oktober 1986, dari ayah Mesir dan ibu Palestina-Yordania, belajar di Emerson and William Esper Studio, serta perannya dalam \"Rami,\" \"Moon Knight,\" \"Jinni,\" dan \"Together Together,\" serta penyakit alopecia-nya. Artikel tersebut tidak menyebutkan agama apapun yang diikutinya."
