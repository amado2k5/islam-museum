  ar: "مقالة ويكيبيديا الإنجليزية عن مي القلماوي؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها في البحرين في 28 أكتوبر 1986 لأب مصري وأم فلسطينية-أردنية، ودراستها في إيمرسون وستوديو وليام إسبر، وأدوارها في «رامي» و«فارس القمر» و«جنّي» و«معًا معًا» وداء الثعلبة لديها. لا تذكر المقالة أي دين لها."
  en: "English Wikipedia article on May Calamawy; used for entity facts only. It records her birth in Bahrain on 28 October 1986 to an Egyptian father and a Palestinian-Jordanian mother, her studies at Emerson College and the William Esper Studio, her roles in Ramy, Moon Knight, Djinn and Together Together, and her alopecia areata. The article names no religion for her."
