summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مولوي محمد ذكاء الله الدهلوي؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في دلهي في 20 أبريل 1832 ووفاته فيها في 7 نوفمبر 1910، ودراسته في كلية دلهي على رامشاندرا ومملوك علي النانوتوي، وخدمته التعليمية حتى أستاذيته في كلية موير المركزية بالله آباد، وترجماته لجمعية سيد أحمد خان العلمية، ومصنّفه «تاريخ هندستان» في أربعة عشر مجلدا."
  en: "English Wikipedia article on Maulvi Mohammad Zakaullah (Zakaullah Dehlvi); used for entity facts only. It records his birth in Delhi on 20 April 1832 and death there on 7 November 1910, his studies at Delhi College under Ramchandra and Mamluk Ali Nanautawi, his education service ending as professor at Muir Central College, Allahabad, his translations for Syed Ahmad Khan's Scientific Society, and his fourteen-volume Tarikh-e-Hindustan."
  es: "Artículo de la Wikipedia en inglés sobre Maulvi Mohammad Zakaullah (Zakaullah Dehlvi); utilizado únicamente para datos sobre la persona. En él se registra su nacimiento en Delhi el 20 de abril de 1832 y su fallecimiento allí el 7 de noviembre de 1910, sus estudios en el Delhi College con Ramchandra y Mamluk Ali Nanautawi, su trayectoria docente que culminó como profesor en el Muir Central College de Allahabad, sus traducciones para la Sociedad Científica de Syed Ahmad Khan y su obra Tarikh-e-Hindustan, de catorce volúmenes."
  fr: "Article de Wikipédia en anglais sur Maulvi Mohammad Zakaullah (Zakaullah Dehlvi); utilisé uniquement pour les informations sur l'entité. Il relate sa naissance à Delhi le 20 avril 1832 et son décès dans la même ville le 7 novembre 1910, ses études au Delhi College auprès de Ramchandra et Mamluk Ali Nanautawi, sa carrière dans l'enseignement qui s'est achevée comme professeur au Muir Central College d'Allahabad, ses traductions pour la Société scientifique de Syed Ahmad Khan et son ouvrage en quatorze volumes, le Tarikh-e-Hindustan."
  ur: "مولوی محمد ذکاء اللہ ⁦(ذکاء اللہ دہلوی)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 20 اپریل 1832 کو دہلی میں ان کی پیدائش اور وہیں وفات 7 نومبر 1910 کو درج ہے، رام چندر اور مملوک علی نانوتوی کے تحت دہلی کالج میں ان کی تعلیم، مویر سنٹرل کالج، الہ آباد میں بطور پروفیسر ختم ہونے والی ان کی تعلیمی خدمات، سید احمد خان کی سائنٹفک سوسائٹی کے لیے ان کے تراجم، اور ان کی چودہ جلدوں پر مشتمل کتاب تاریخ۔"
  tr: "Maulvi Muhammad Zakaullah Dehlawi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 20 Nisan 1832'de Delhi'de doğduğu ve 7 Kasım 1910'da orada öldüğü belgelenmiştir; Ramachandra'nın yönetiminde Delhi Koleji'nde Ali Nanotoi'ye ait eğitimi, Allahabad'daki Muir Central College'daki profesörlüğüne kadar olan eğitim hizmetleri, Syed Ahmad Khan Bilim Derneği'nin çevirileri ve on dört ciltlik 'Hindistan Tarihi' adlı eseri belgelenmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Maulvi Muhammad Zakaullah Dehlawi; digunakan hanya untuk fakta entitas. Kelahirannya di Delhi pada 20 April 1832, dan kematiannya di sana pada 7 November 1910, didokumentasikan, studinya di Delhi College di bawah Ramachandra dan dimiliki oleh Ali Nanotoi, pengabdiannya dalam pendidikan hingga jabatan profesor di Muir Central College, Allahabad, terjemahan Syed Ahmad Khan Scientific Society, dan karya empat belas jilidnya 'History of India.'"
