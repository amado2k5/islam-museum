summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مولوي محمد ذكاء الله الدهلوي؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في دلهي في 20 أبريل 1832 ووفاته فيها في 7 نوفمبر 1910، ودراسته في كلية دلهي على رامشاندرا ومملوك علي النانوتوي، وخدمته التعليمية حتى أستاذيته في كلية موير المركزية بالله آباد، وترجماته لجمعية سيد أحمد خان العلمية، ومصنّفه «تاريخ هندستان» في أربعة عشر مجلدا."
  en: "English Wikipedia article on Maulvi Mohammad Zakaullah (Zakaullah Dehlvi); used for entity facts only. It records his birth in Delhi on 20 April 1832 and death there on 7 November 1910, his studies at Delhi College under Ramchandra and Mamluk Ali Nanautawi, his education service ending as professor at Muir Central College, Allahabad, his translations for Syed Ahmad Khan's Scientific Society, and his fourteen-volume Tarikh-e-Hindustan."
