summary:
  ar: "مدخل موسوعة بريتانيكا عن عظيم بريمجي: رئيس ويبرو الذي قادها عبر أربعة عقود من التنويع والنمو لتصبح رائدة عالمية في البرمجيات، وقد بقيت أسرته المسلمة في الهند عند التقسيم."
  en: "Encyclopaedia Britannica entry on Azim Premji: the Wipro chairman who guided the company through four decades of diversification into a world software leader; his Muslim family chose to remain in India at Partition."
  es: "Entrada de la Enciclopedia Británica sobre Azim Premji: el presidente de Wipro que guió a la empresa a través de cuatro décadas de diversificación hasta convertirla en un líder mundial del software; su familia musulmana optó por permanecer en la India tras la Partición."
  fr: "Article de l'Encyclopædia Britannica sur Azim Premji: le président de Wipro qui a guidé l'entreprise à travers quatre décennies de diversification pour en faire un leader mondial des logiciels; sa famille musulmane a choisi de rester en Inde lors de la Partition."
  ur: "عظیم پریم جی پر انسائیکلوپیڈیا برٹانیکا کا اندراج: وپرو کے چیئرمین جنہوں نے چار دہائیوں کے تنوع کے ذریعے کمپنی کو ایک عالمی سافٹ ویئر لیڈر بنانے میں رہنمائی کی۔ ان کے مسلمان خاندان نے تقسیم کے وقت ہندوستان میں رہنے کا انتخاب کیا۔"
  tr: "Britannica Ansiklopedisi'nin Azeem Premji hakkında: Wipro'nun başkanı, Müslüman ailesi bölünme sırasında Hindistan'da kalırken yazılımda küresel lider haline getiren ve kırk yıl süren çeşitlendirme ve büyüme sürecine liderlik eden kişi."
  id: "Entri Ensiklopedia Britannica tentang Azeem Premji: Kepala Wipro, yang memimpinnya melalui empat dekade diversifikasi dan pertumbuhan hingga menjadi pemimpin global dalam bidang perangkat lunak, sementara keluarganya yang beragama Muslim tetap tinggal di India selama pemisahan."
