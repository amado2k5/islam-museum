reliability_note: "Independent encyclopedia account, alongside English Wikipedia: the father's founding of Western Indian Vegetable Products Ltd in 1945, the family's decision to remain in India at Partition ('the Premjis, a Muslim family, chose to remain in India' — it names no school), Premji's interrupted Stanford engineering degree in 1966, the renaming to Wipro in 1977, the turn to computers after IBM was asked to leave India in 1979, and the software-export strategy. Entry dated 14 May 2010 as cited by English Wikipedia; read as opened on 26 Oct 2026."
