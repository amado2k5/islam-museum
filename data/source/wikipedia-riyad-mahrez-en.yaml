summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رياض محرز؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في كليشي في 21 فبراير 1991، ومسيرته من كيمبر ولوهافر إلى ليستر سيتي ومانشستر سيتي والأهلي، ولقب الدوري الإنجليزي 2015–16 وجائزة أفضل لاعب من رابطة اللاعبين، وموسم ثلاثية دوري الأبطال 2022–23 مع سيتي، وفوز الجزائر بكأس أمم أفريقيا 2019، وتصفه بأنه مسلم ممارس دون تسمية أي مذهب له."
  en: "English Wikipedia article on Riyad Mahrez; used for entity facts only. It records his birth in Clichy on 21 February 1991, his career from Quimper and Le Havre to Leicester City, Manchester City and Al-Ahli, the 2015-16 Premier League title and PFA Players' Player of the Year award, the 2022-23 Champions League treble season at City, and Algeria's 2019 Africa Cup of Nations win, and describes him as a practising Muslim, naming no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Riyad Mahrez; utilizado únicamente para datos sobre la persona. Registra su nacimiento en Clichy el 21 de febrero de 1991, su carrera desde Quimper y Le Havre hasta Leicester City, Manchester City y Al-Ahli, el título de la Premier League 2015-16 y el premio al Jugador del Año de la PFA, la temporada del triplete de la Liga de Campeones 2022-23 con el City y la victoria de Argelia en la Copa Africana de Naciones 2019, y lo describe como musulmán practicante, sin mencionar ninguna escuela a la que pertenezca."
  fr: "Article Wikipédia en anglais sur Riyad Mahrez; utilisé uniquement pour les informations le concernant. Il relate sa naissance à Clichy le 21 février 1991, sa carrière de Quimper et Le Havre à Leicester City, Manchester City et Al-Ahli, le titre de champion d'Angleterre et le prix du meilleur joueur de l'année PFA remportés par ses pairs lors de la saison 2015-2016, le triplé en Ligue des champions avec City lors de la saison 2022-2023, et la victoire de l'Algérie à la Coupe d'Afrique des Nations 2019. Il est décrit comme un musulman pratiquant, sans mentionner d'établissement scolaire."
