summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رياض محرز؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في كليشي في 21 فبراير 1991، ومسيرته من كيمبر ولوهافر إلى ليستر سيتي ومانشستر سيتي والأهلي، ولقب الدوري الإنجليزي 2015–16 وجائزة أفضل لاعب من رابطة اللاعبين، وموسم ثلاثية دوري الأبطال 2022–23 مع سيتي، وفوز الجزائر بكأس أمم أفريقيا 2019، وتصفه بأنه مسلم ممارس دون تسمية أي مذهب له."
  en: "English Wikipedia article on Riyad Mahrez; used for entity facts only. It records his birth in Clichy on 21 February 1991, his career from Quimper and Le Havre to Leicester City, Manchester City and Al-Ahli, the 2015-16 Premier League title and PFA Players' Player of the Year award, the 2022-23 Champions League treble season at City, and Algeria's 2019 Africa Cup of Nations win, and describes him as a practising Muslim, naming no school for him."
