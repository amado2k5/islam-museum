reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. Its lead and body agree with the English article that he died on 13 November 1896, after the battle of Porédaka, captured and decapitated by Sori Illili's soldiers; its infobox, however, gives '18 novembre 1896' at Botôre — an internal inconsistency of the article, recorded in the person's death note and not followed. It gives no birth date (its category is 'date of birth not recorded, 19th century') and names no religion, school or order for him personally."
