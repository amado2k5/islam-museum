  en: "French Wikipedia article 'Bokar Biro' on Bokar Biro Barry; used for entity facts only. It parallels the English article on his life, rule and death after the battle of Porédaka in 1896; its infobox alone gives a different death date (18 November 1896, at Botôre) from its own lead and body."
