summary:
  ar: "مقالة ويكيبيديا الفرنسية «بوكار بيرو» عن بوكار بيرو باري؛ تُستخدم لوقائع الكيان فقط. توازي المقالة الإنجليزية في سيرته وحكمه ووفاته بعد معركة بوريداكا سنة 1896، وصندوق معلوماتها وحده يعطي تاريخ وفاة مختلفًا ⁦(18 نوفمبر 1896 في بوتور)⁩."
  en: "French Wikipedia article 'Bokar Biro' on Bokar Biro Barry; used for entity facts only. It parallels the English article on his life, rule and death after the battle of Porédaka in 1896; its infobox alone gives a different death date (18 November 1896, at Botôre) from its own lead and body."
  es: "Artículo de la Wikipedia en francés titulado «Bokar Biro» sobre Bokar Biro Barry; se utiliza únicamente para datos sobre la persona. Es paralelo al artículo en inglés sobre su vida, gobierno y muerte tras la batalla de Porédaka en 1896; su ficha informativa, por sí sola, proporciona una fecha de fallecimiento diferente (18 de noviembre de 1896, en Botôre) a la que figura en el texto principal."
  fr: "L'article Wikipédia français « Bokar Biro » concerne Bokar Biro Barry; il est utilisé uniquement pour les informations sur l'entité. Il est similaire à l'article anglais sur sa vie, son règne et sa mort après la bataille de Porédaka en 1896; son infobox, à elle seule, donne une date de décès différente (18 novembre 1896, à Botôre) de celle figurant dans l'article original."
  ur: "بوکر بیرو بیری پر فرانسیسی ویکیپیڈیا مضمون 'بوکر بیرو'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1896 میں Porédaka کی جنگ کے بعد ان کی زندگی، حکمرانی اور موت پر انگریزی مضمون کے متوازی ہے۔ اس کا انفو باکس اکیلے اس کے اپنے لیڈ اور باڈی سے مختلف موت کی تاریخ ⁦(18 نومبر 1896، بوٹور میں)⁩ دیتا ہے۔"
