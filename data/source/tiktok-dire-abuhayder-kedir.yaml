reliability_note: "A third-party clip account, not Kedir's own account: used only as evidence that clips of his talks circulate under the name 'Abu heydar kedir' — the basis for recording the kunya Abu Hayder. The video page was read directly on TikTok on 7 November 2026: posted 6 December 2025 (platform timestamp), duration 133 seconds, 564,200 plays, 38,400 likes, 830 comments, 18,800 shares and 4,164 saves at read time. Its description reads '#islamic#viral #vi #dawah #Creator Search Insights ኢስሊምናን የመሰረተ ነቢይ የለም❤❤❤ Abu heydar kedir'. A second clip read the same day (posted by Hamza, @hamza_h__, 30 March 2026) carries the hashtag '#ustazabuhayder' with '#dawa' and '#ethiopian_tik_tok', corroborating the same form of the name. The pages give no birth date and no school of law."
