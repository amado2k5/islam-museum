summary:
  ar: "جزء جوزف نيدهم عن الهندسة الميكانيكية: يصف آلة الجزري المركبة التي يدير فيها بقر على سطح خزان علوي ساقيةً بينما تصب مياه على شفرات دولاب بخزان سفلي، ويسجل مضخات السلاسل الرومانية المبكرة."
  en: "Joseph Needham's mechanical-engineering volume: describes al-Jazari's composite machine in which an ox on the roof of an upper-level reservoir drives a saqiya while water falls onto the spoon-shaped pallets of a water wheel in a lower reservoir, and records the early Roman bucket-chain pumps."
  es: "El libro de ingeniería mecánica de Joseph Needham describe la máquina compuesta de al-Jazari, en la que un buey en el techo de un depósito superior acciona una saqiya mientras el agua cae sobre las paletas en forma de cuchara de una rueda hidráulica en un depósito inferior, y documenta las primeras bombas romanas de cadena de cangilones."
  fr: "Le volume de Joseph Needham sur l'ingénierie mécanique: décrit la machine composite d'al-Jazari dans laquelle un bœuf sur le toit d'un réservoir de niveau supérieur actionne une saqiya tandis que l'eau tombe sur les palettes en forme de cuillère d'une roue à eau dans un réservoir inférieur, et relate les premières pompes à chaîne à godets romaines."
  ur: "جوزف نیدھم کی مکینیکل انجینئرنگ والیوم: الجزری کی جامع مشین کی وضاحت کرتا ہے جس میں ایک بالائی سطح کے حوض کی چھت پر ایک بیل سبیہ چلاتا ہے جب کہ پانی نچلے ذخیرے میں پانی کے پہیے کے چمچے کی شکل کے پیلیٹ پر گرتا ہے، اور ابتدائی رومن بالٹی پمپ کو ریکارڈ کرتا ہے۔"
  tr: "Joseph Needham'ın makine mühendisliği bölümü: ineklerin üst bir tankın yüzeyinde bir şaft ile sürüldüğü, alt tanktaki tekerlek kanatlarına su döküldüğü kompozit havuç makinesini tanımlar ve erken Roma zincir pompalarını kaydeder."
  id: "Bagian Joseph Needham tentang teknik mesin: menggambarkan mesin wortel komposit di mana sapi digerakkan di permukaan tangki atas dengan poros sementara air dituangkan ke bilah roda di tangki bawah, dan mencatat pompa rantai Romawi awal."
