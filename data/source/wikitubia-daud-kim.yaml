summary:
  ar: "صفحة «ويكيتيوبيا» عن داود كيم، مدوّن الفيديو الكوري الجنوبي المسلم؛ تسجل اعتناقه الإسلام في 25 سبتمبر 2019 ومحتواه وحملة بناء المسجد في إنتشون واكتمال المسجد في 2024 بحسب الصفحة."
  en: "Wikitubia (the YouTube wiki) profile of Daud Kim, the South Korean Muslim YouTuber; it records his conversion to Islam on 25 September 2019, his content, the Incheon mosque campaign and, per the page, the mosque's completion in 2024."
  es: "Perfil en Wikitubia (la wiki de YouTube) de Daud Kim, el youtuber musulmán surcoreano; en él se registra su conversión al Islam el 25 de septiembre de 2019, su contenido, la campaña de la mezquita de Incheon y, según la página, la finalización de la mezquita en 2024."
  fr: "Profil Wikitubia (le wiki de YouTube) de Daud Kim, le YouTubeur musulman sud-coréen; il relate sa conversion à l'islam le 25 septembre 2019, son contenu, la campagne pour la mosquée d'Incheon et, selon la page, l'achèvement de la mosquée en 2024."
  ur: "Wikitubia (YouTube wiki) جنوبی کوریا کے مسلمان YouTuber داؤد کم کا پروفائل؛ اس میں 25 ستمبر 2019 کو اس کی اسلام قبول کرنے، اس کے مواد، انچیون کی مسجد کی مہم اور صفحہ کے مطابق، 2024 میں مسجد کی تکمیل کو ریکارڈ کیا گیا ہے۔"
  tr: "Güney Koreli Müslüman video blog yazarı Dawood Kim hakkında \"Wikipedia\" sayfası, 25 Eylül 2019'da İslam'a geçişini, içeriğini, İncheon'daki caminin inşası kampanyasını ve caminin 2024'te tamamlanmasını kaydediyor, sayfaya göre."
  id: "Halaman \"Wikipedia\" tentang Dawood Kim, blogger video Muslim asal Korea Selatan, mencatat konversinya ke Islam pada 25 September 2019, isinya, kampanye pembangunan masjid di Incheon, dan penyelesaian masjid pada tahun 2024, menurut halaman tersebut."
