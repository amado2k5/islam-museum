  ar: "مدخل «رصدخانة» في موسوعة TDV الإسلامية، وهو مدخل عام قصير ما زال قيد التحديث، يعرّفه بأنه الكيان الذي تُجرى فيه الرصود الفلكية، ويحيل إلى رصدخانات سمرقند وقندلي، وإلى مصطلحات الزيج والأسطرلاب."
  en: "The TDV İslâm Ansiklopedisi general entry 'RASATHÂNE', a short entry marked as being updated. It defines the rasathane as an establishment where astronomical observations are made, and refers to the Samarkand and Kandilli observatories, to the zij and to the astrolabe."
