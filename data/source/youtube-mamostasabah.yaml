summary:
  ar: "قناة مامۆستا صباح كفري على يوتيوب؛ تنشر خطب جمعته، وأوصاف مقاطعها تنسب خطبته إلى مسجد حاجي فتاح في كفري وتربط صفحته على فيسبوك وحسابه على إنستغرام."
  en: "Mamosta Sabah Kifri's YouTube channel (@mamostasabah), carrying his Friday sermons; his video descriptions place his preaching at the Haji Fattah mosque in Kifri and cross-link his Facebook page and his Instagram account."
  es: "El canal de YouTube de Mamosta Sabah Kifri (@mamostasabah) publica sus sermones de los viernes; las descripciones de sus videos sitúan sus predicaciones en la mezquita Haji Fattah en Kifri y enlazan su página de Facebook con su cuenta de Instagram."
  fr: "La chaîne YouTube de Mamosta Sabah Kifri (@mamostasabah), qui diffuse ses sermons du vendredi; les descriptions de ses vidéos situent ses prédications à la mosquée Haji Fattah de Kifri et renvoient vers sa page Facebook et son compte Instagram."
  ur: "Mamosta Sabah Kifri کا یوٹیوب چینل (@mamostasabah)، اس کے جمعہ کے خطبات لے کر؛ اس کی ویڈیو کی تفصیل اس کی تبلیغ کیفری میں حاجی فتح مسجد میں کرتی ہے اور اس کے فیس بک پیج اور انسٹاگرام اکاؤنٹ کو کراس لنک کرتی ہے۔"
  tr: "Öğretmen Sabah Kafri'nin YouTube kanalı, Cuma vaazlarını yayınlıyor; klip açıklamaları Kafri'deki Hacı Fattah Camii'ndeki vaazına atfediliyor ve Facebook sayfası ile Instagram hesabı bağlantılı."
  id: "Saluran YouTube guru Sabah Kafri mempublikasikan khotbah Jumatnya, dengan klip deskripsi yang dikaitkan dengan khotbahnya di Masjid Haji Fattah di Kafri, menghubungkan halaman Facebook dan akun Instagram-nya."
