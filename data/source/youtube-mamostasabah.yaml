reliability_note: "The channel's own presence: a primary source for its identity and output — not independent corroboration of biography. His video descriptions identify him as the Friday preacher at the Haji Fattah mosque in Kifri and cross-link his Facebook page (facebook.com/mamostasabahkifre) and his Instagram account (@mamosta__sabah), which is the own-channel identity evidence for his Facebook main channel. His Friday sermons on the channel are dated 11 September, 9 October and 30 October 2026 (the last posted about 6 November 2026), so he is current. No dated subscriber count for this channel could be pinned in any source read, and no channel start date was found; neither is asserted. Checked via the wave-199 harvest on 9 November 2026."
