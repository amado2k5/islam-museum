label:
  ar: "فضائل الصحابة — أحمد بن حنبل ⁦(تحقيق وصي الله بن محمد عباس، دار ابن الجوزي، الطبعة الثانية 1420هـ/1999م)⁩"
  en: "Fada'il al-Sahaba — Ahmad ibn Hanbal (ed. Wasi Allah ibn Muhammad Abbas, Dar Ibn al-Jawzi, 2nd ed. 1420/1999)"
summary:
  ar: "كتاب فضائل الصحابة للإمام أحمد بن حنبل ⁦(ت 241هـ)⁩ برواية ابنه عبد الله وزياداته وزيادات أبي بكر القطيعي، حققه وخرج أحاديثه وصي الله بن محمد عباس ⁦(جامعة أم القرى)⁩ رسالةً للدكتوراه؛ الطبعة الثانية المنقحة، دار ابن الجوزي، الدمام، في مجلدين بترقيم متصل ⁦(1–1383 صفحة)⁩، وفيه 1962 رواية مرقمة."
  en: "Ahmad ibn Hanbal's (d. 241 AH) Fada'il al-Sahaba in the transmission of his son Abd Allah, with Abd Allah's and Abu Bakr al-Qati'i's additions, edited with full takhrij by Wasi Allah ibn Muhammad Abbas (Umm al-Qura University) as a doctoral thesis; revised second edition, Dar Ibn al-Jawzi, Dammam, two volumes paginated continuously (pp. 1–1383), 1,962 numbered narrations."
  es: "Fada'il al-Sahaba de Ahmad ibn Hanbal (m. 241 AH) en la transmisión de su hijo Abd Allah, con adiciones de Abd Allah y Abu Bakr al-Qati'i, editado con takhrij completo por Wasi Allah ibn Muhammad Abbas (Universidad Umm al-Qura) como tesis doctoral; segunda edición revisada, Dar Ibn al-Jawzi, Dammam, dos volúmenes paginados de forma continua (pp. 1–1383), 1962 narraciones numeradas."
  fr: "Fada'il al-Sahaba d'Ahmad ibn Hanbal (d. 241 AH) dans la transmission de son fils Abd Allah, avec les ajouts d'Abd Allah et d'Abu Bakr al-Qati'i, édité avec un takhrij complet par Wasi Allah ibn Muhammad Abbas (Université Umm al-Qura) comme thèse de doctorat; deuxième édition révisée, Dar Ibn al-Jawzi, Dammam, deux volumes paginés en continu (pp. 1–1383), 1 962 narrations numérotées."
  ur: "احمد بن حنبل کی ⁦(متوفی 241ھ)⁩ فدائیل الصحابہ نے اپنے بیٹے عبد اللہ کی منتقلی میں، عبد اللہ اور ابوبکر القطی کے اضافے کے ساتھ، مکمل تخریج کے ساتھ وصی اللہ ابن محمد عباس ⁦(ام القراء یونیورسٹی)⁩ نے ڈاکٹریٹ کے مقالے کے طور پر ترمیم کی۔ نظر ثانی شدہ دوسرا ایڈیشن، دار ابن الجوزی، دمام، دو جلدیں صفحہ پر لگاتار ⁦(صفحہ 1-1383)⁩، 1,962 عدد روایات۔"
  tr: "İmam Ahmed bin Hanbal (ö. 241 H) tarafından yazılan Sahabelerin Erdemleri Kitabı, oğlu Abdullah tarafından anlatılan, Ebu Bekir el-Kutai'i'nin eklemeleri ve eklemeleri, Wasiullah ibn Muhammed Abbas (um Al-Qura Üniversitesi) tarafından düzenlenmiş ve hadisler tarafından hazırlanmıştır, doktora tezi; ikinci gözden geçirilmiş baskı, Dar İbn el-Cavazi, Dammam, iki cilt halinde (1–1383 sayfa) ve 1962 numaralı rivayetleri içermektedir."
  id: "Kitab Kebajikan Para Sahabat oleh Imam Ahmad ibn Hanbal (wafat 241 H), yang dinarasikan oleh putranya Abdullah beserta tambahan dan tambahan Abu Bakr al-Qutai'i, disunting dan hadis yang diproduksi oleh Wasiullah ibn Muhammad Abbas (Universitas um Al-Qura), disertasi doktoral; edisi revisi kedua, Dar Ibn al-Jawzi, Dammam, dalam dua jilid dengan penomoran terkait (1–1383 halaman), berisi narasi bernomor tahun 1962."
