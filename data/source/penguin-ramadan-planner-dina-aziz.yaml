summary:
  ar: "صفحة بنغوين الرسمية لكتاب «مخطط رمضان» لدينا عزيز ⁦(دار سنتشري، 15 فبراير 2024)⁩؛ تصف دينا بأنها مؤثرة أسرت جمهورًا واسعًا بأزيائها المحتشمة ونمط حياتها الملهم وفنها، وأنها تشارك كل رمضان لمحات من مفكرتها لدعم متابعيها في رحلتهم الروحية."
  en: "Penguin's official page for Dina Aziz's Ramadan Planner (Century imprint, published 15 February 2024). Its author biography describes Dina Aziz as an influencer who has captivated a vast following with her modest sense of fashion, inspiring lifestyle and artistry, and who shares glimpses of her planner each Ramadan to support her followers on their spiritual journey."
  es: "Página oficial de Penguin para la Agenda de Ramadán de Dina Aziz (sello Century, publicada el 15 de febrero de 2024). La biografía de la autora describe a Dina Aziz como una influencer que ha cautivado a un gran número de seguidores con su estilo sencillo, su inspirador estilo de vida y su talento artístico, y que comparte fragmentos de su agenda cada Ramadán para apoyar a sus seguidores en su camino espiritual."
  fr: "Page officielle de Penguin pour l'agenda Ramadan de Dina Aziz (collection Century, paru le 15 février 2024). Sa biographie décrit Dina Aziz comme une influenceuse qui a conquis un large public grâce à son style vestimentaire sobre, son mode de vie inspirant et son talent artistique, et qui partage chaque Ramadan des aperçus de son agenda pour accompagner ses abonnés dans leur cheminement spirituel."
  ur: "دینا عزیز کے رمضان پلانر کے لیے پینگوئن کا آفیشل صفحہ ⁦(سینچری امپرنٹ، 15 فروری 2024 کو شائع ہوا)⁩۔ اس کی مصنفہ کی سوانح عمری میں دینا عزیز کو ایک متاثر کن کے طور پر بیان کیا گیا ہے جس نے فیشن کے اپنے معمولی احساس، متاثر کن طرز زندگی اور فنکارانہ انداز سے ایک وسیع پیروکار کو اپنے سحر میں جکڑ لیا ہے، اور جو ہر رمضان میں اپنے پیروکاروں کی روحانی سفر میں مدد کرنے کے لیے اپنے منصوبہ ساز کی جھلکیں شیئر کرتی ہے۔"
