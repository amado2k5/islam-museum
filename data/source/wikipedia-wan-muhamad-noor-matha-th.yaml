summary:
  ar: "مقالة ويكيبيديا التايلندية عن وان محمد نور ماتا ⁦(وُلد 1944)⁩؛ تُستخدم لوقائع الكيان فقط. وهي أطول المقالات وتوافق على مولده سنة 1944، ويربط صندوق معلوماتها دينه بالإسلام عموما."
  en: "Thai Wikipedia article on Wan Muhamad Noor Matha (born 1944); used for entity facts only. The fullest of the articles; it agrees on the 1944 birth, and its infobox links his religion to Islam in general ('Islam in Thailand'), naming no school."
  es: "Artículo de la Wikipedia en tailandés sobre Wan Muhamad Noor Matha (nacido en 1944); utilizado únicamente para datos sobre la persona. Es el artículo más completo; coincide en la fecha de nacimiento de 1944 y su ficha informativa vincula su religión con el islam en general («El islam en Tailandia»), sin mencionar ninguna escuela."
  fr: "Article de Wikipédia thaïlandais sur Wan Muhamad Noor Matha (né en 1944); utilisé uniquement pour les informations le concernant. C'est l'article le plus complet; il confirme la date de naissance de 1944 et son infobox rattache sa religion à l'islam en général (« L'islam en Thaïlande »), sans mentionner d'école."
  ur: "وان محمد نور متھا ⁦(پیدائش 1944)⁩ پر تھائی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ مضامین میں سے مکمل؛ یہ 1944 کی پیدائش پر متفق ہے، اور اس کا معلوماتی باکس اس کے مذہب کو عام طور پر اسلام سے جوڑتا ہے ⁦('اسلام میں تھائی لینڈ')⁩، کسی اسکول کا نام نہیں دیتا۔"
  tr: "Wan Muhammad Noor Mata (1944 doğumlu) hakkında Tayca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. En uzun makaledir ve 1944'teki doğumunu doğrular, bilgi kutusu ise dinini genel olarak İslam'a bağlar."
  id: "Artikel Wikipedia Thailand tentang Wan Muhammad Noor Mata (lahir 1944); digunakan hanya untuk fakta entitas. Ini adalah artikel terpanjang dan mengonfirmasi kelahirannya pada tahun 1944, serta infobox yang mengaitkan agamanya dengan Islam secara umum."
