label:
  ar: "محمد أمين يلماز، «الآثار التركية المحوّلة إلى كنائس»، المجلد 2 ⁦(أنقرة: رئاسة الأتراك في الخارج والمجتمعات ذات القربى، الطبعة الثانية الموسعة، 2023)⁩"
  en: "Mehmet Emin Yılmaz, Kiliseye Çevrilen Türk Eserleri / The Turkish Monuments Converted into Churches, vol. 2 (Ankara: YTB, 2nd enlarged ed., 2023)"
summary:
  ar: "المجلد 2 من فهرس ثنائي اللغة ⁦(تركي وإنجليزي)⁩ لمحمد أمين يلماز عن المساجد والتكايا والأضرحة العثمانية وغيرها التي حُوّلت إلى كنائس خارج تركيا وداخلها؛ يتناول هذا المجلد: Hungary, Moldova, Romania, Serbia, Türkiye and Ukraine (with Crimea)."
  en: "Volume 2 of Mehmet Emin Yılmaz's bilingual (Turkish and English) catalogue of Ottoman and other Muslim mosques, lodges, tombs and buildings converted into churches; this volume covers Hungary, Moldova, Romania, Serbia, Türkiye and Ukraine (with Crimea)."
  es: "Volumen 2 del catálogo bilingüe (turco e inglés) de Mehmet Emin Yılmaz sobre mezquitas, logias, tumbas y edificios otomanos y de otras culturas musulmanas convertidos en iglesias; este volumen abarca Hungría, Moldavia, Rumania, Serbia, Turquía y Ucrania (incluida Crimea)."
  fr: "Volume 2 du catalogue bilingue (turc et anglais) de Mehmet Emin Yılmaz sur les mosquées, loges, tombeaux et bâtiments ottomans et autres musulmans convertis en églises; ce volume couvre la Hongrie, la Moldavie, la Roumanie, la Serbie, la Turquie et l'Ukraine (avec la Crimée)."
  ur: "مہمت ایمن یلماز کے دو لسانی ⁦(ترکی اور انگریزی)⁩ عثمانی اور دیگر مسلمانوں کی مساجد، قیام گاہوں، مقبروں اور گرجا گھروں میں تبدیل ہونے والی عمارتوں کی کیٹلاگ کی جلد 2؛ یہ حجم ہنگری، مالڈووا، رومانیہ، سربیا، ترکی اور یوکرین ⁦(کرائمیا کے ساتھ)⁩ پر محیط ہے۔"
  tr: "Mehmet Emin Yılmaz tarafından hazırlanan Osmanlı camileri, tekyehleri, türbeleri ve Türkiye içinde ve dışında kiliseye dönüştürülmüş diğer konular hakkında iki dilli (Türkçe ve İngilizce) dizininin 2. cildi; bu cilt Macaristan, Moldova, Romanya, Sırbistan, Türkiye ve Ukrayna (Kırım ile birlikte) konularını ele almaktadır."
  id: "Volume 2 dari indeks bilingual (Turki dan Inggris) oleh Mehmet Emin Yilmaz tentang masjid, tekyeh, makam, dan lainnya yang diubah menjadi gereja baik di dalam maupun di luar Turki; volume ini membahas de: Hungaria, Moldova, Rumania, Serbia, Turki, dan Ukraina (dengan Krimea)."
