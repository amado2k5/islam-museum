summary:
  ar: "مقالة ويكيبيديا العربية عن إريك أبيدال؛ تُستخدم لوقائع الكيان فقط. تغطي ميلاده سنة 1979 ومسيرته مع موناكو وليل وليون وبرشلونة، وتذكر في حياته الشخصية أنه نشأ في عائلة كاثوليكية واعتنق الإسلام في العشرينيات من عمره."
  en: "Arabic Wikipedia article on Eric Abidal; used for entity facts only. It covers his 1979 birth and his career with Monaco, Lille, Lyon and Barcelona, and states in its personal life section that he grew up in a Catholic family and embraced Islam in his twenties."
  es: "Artículo de Wikipedia en árabe sobre Eric Abidal; se utiliza únicamente para obtener información sobre la persona. Abarca su nacimiento en 1979 y su trayectoria profesional en el Mónaco, el Lille, el Lyon y el Barcelona, y en la sección sobre su vida personal indica que creció en una familia católica y se convirtió al islam a los veinte años."
  fr: "Article Wikipédia en arabe sur Eric Abidal; utilisé uniquement à des fins d’information sur l’entité. Il retrace sa naissance en 1979 et sa carrière à Monaco, Lille, Lyon et Barcelone, et précise dans sa section consacrée à sa vie personnelle qu’il a grandi dans une famille catholique et s’est converti à l’islam dans sa vingtaine."
  ur: "ایرک ابیدل پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی 1979 کی پیدائش اور موناکو، للی، لیون اور بارسلونا کے ساتھ اس کے کیریئر کا احاطہ کیا گیا ہے، اور اس کے ذاتی زندگی کے حصے میں بتایا گیا ہے کہ وہ ایک کیتھولک خاندان میں پلا بڑھا اور بیس کی دہائی میں اسلام قبول کیا۔"
  tr: "Eric Abidal hakkında Arapça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 1979'daki doğumunu ve Monako, Lille, Lyon ve Barselona'daki kariyerini kapsar; kişisel hayatında Katolik bir ailede büyüdüğünü ve yirmili yaşlarında İslam'a geçtiğini belirtir."
  id: "Artikel Wikipedia berbahasa Arab tentang Eric Abidal hanya digunakan untuk fakta entitas tersebut. Artikel ini membahas kelahirannya pada tahun 1979 dan kariernya di Monaco, Lille, Lyon, dan Barcelona, serta menyebutkan dalam kehidupan pribadinya bahwa ia tumbuh dalam keluarga Katolik dan memeluk Islam pada usia dua puluhan."
