  ar: "مقالة ويكيبيديا الإنجليزية عن أنتوني تان (وُلد سنة 1982 في كوالالمبور)، رجل أعمال سنغافوري شارك في تأسيس شركة غراب ورئيسها التنفيذي؛ تذكر نشأته في أسرة تان تشونغ موتور، ودراسته في جامعة شيكاغو وكلية هارفارد للأعمال، وإطلاقه مايتكسي مع زميلته تان هوي لينغ سنة 2012، وحصوله على الجنسية السنغافورية سنة 2016، وجدل مقاطعة 2023 المرتبط بمنشور لزوجته."
  en: "English Wikipedia article on Anthony Tan (born 1982 in Kuala Lumpur), Singaporean businessman, co-founder and group chief executive of Grab; it records his upbringing in the Tan Chong Motor family, his studies at the University of Chicago and Harvard Business School, his launching of MyTeksi with his classmate Tan Hooi Ling in 2012, his taking Singapore citizenship in 2016, and the 2023 boycott episode that followed a social-media post by his wife."
