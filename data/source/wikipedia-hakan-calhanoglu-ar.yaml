  ar: "مقالة ويكيبيديا العربية عن هاكان تشالهان أوغلو (بعنوان «خاقان جال خان أوغلي»)؛ تُستخدم لوقائع الكيان فقط. تثبت ميلاده في مانهايم في 8 فبراير 1994 ومسيرته مع الأندية الألمانية وميلان وإنتر، ويعطي صندوق معلوماتها ديانته «الإسلام» بصيغة عامة."
