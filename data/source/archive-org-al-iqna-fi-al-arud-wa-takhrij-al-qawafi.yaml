  fr: "La page «al-Iqna fi al-Arud wa-Takhrij al-Qawafi» — Internet Archive ; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : le livre « al-Iqna fi al-Arud wa-Takhrij al-Qawafi » : son auteur et sa date."
  es: "La página «al-Iqna fi al-Arud wa-Takhrij al-Qawafi» — Internet Archive; resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: el libro «al-Iqna fi al-Arud wa-Takhrij al-Qawafi»: su autor y su fecha."
