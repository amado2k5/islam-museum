summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نجم الدين غوتسينسكي ⁦(نجم الدين صاحب غوتسو)⁩؛ تُستخدم لوقائع الكيان فقط. تروي إفتاءه لشمال القوقاز وإمامته لداغستان والشيشان وثوراته على البلاشفة وإعدامه سنة 1925، وصندوق معلوماتها يذكر «إسلامًا سنيًا» و«تصوفًا نقشبنديًا» دون سند نصي."
  en: "English Wikipedia article on Najmuddin Hotsinsky (Najmuddin of Gotzo); used for entity facts only. It recounts his muftiate of the North Caucasus, his imamate of Dagestan and Chechnya, his uprisings against the Bolsheviks and his 1925 execution; its infobox gives Sunni Islam with Sufism and Naqshbandi fields referenced to no text."
  es: "Artículo de la Wikipedia en inglés sobre Najmuddin Hotsinsky (Najmuddin de Gotzo); utilizado únicamente para datos sobre la entidad. Relata su muftiato del Cáucaso Norte, su imamato de Daguestán y Chechenia, sus levantamientos contra los bolcheviques y su ejecución en 1925; su ficha informativa presenta el islam sunita con campos sobre sufismo y naqshbandi sin referencia a ningún texto."
  fr: "L'article de Wikipédia en anglais sur Najmuddin Hotsinsky (Najmuddin de Gotzo) est utilisé uniquement à des fins d'information sur l'entité. Il relate son muftiat du Caucase du Nord, son imamat du Daghestan et de la Tchétchénie, ses soulèvements contre les bolcheviks et son exécution en 1925; son infobox indique « Islam sunnite » avec des champs « Soufisme » et « Naqshbandi » sans référence textuelle."
  ur: "نجم الدین ہوٹسنسکی پر انگریزی ویکیپیڈیا مضمون ⁦(گوٹزو کا نجم الدین)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں شمالی قفقاز کے اس کے مفتی، داغستان اور چیچنیا کے اس کی امامت، بالشویکوں کے خلاف اس کی بغاوت اور اس کی 1925 کی پھانسی کا ذکر ہے۔ اس کا معلوماتی خانہ تصوف اور نقشبندی کے شعبوں کے ساتھ سنی اسلام دیتا ہے جس کا کوئی متن نہیں ہے۔"
  tr: "Necmeddin Gutsinsky (Najmuddin Sahib Gutso) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kuzey Kafkasya fetvası, Dağıstan ve Çeçenya'daki imamı, Bolşeviklere karşı devrimleri ve 1925'teki idamı anlatılır. Bilgi kutusunda 'Sünni İslam' ve 'Nakşibendi Sufizmi' metinsel kanıt olmadan bahsedilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Najm al-Din Gutsinsky (Najmuddin Sahib Gutso); digunakan hanya untuk fakta entitas. Artikel ini menceritakan fatwa-nya untuk Kaukasus Utara, imamannya di Dagestan dan Chechnya, revolusinya melawan Bolshevik, dan eksekusinya pada tahun 1925. Kotak infonya menyebutkan 'Islam Sunni' dan 'Sufisme Naqshbandi' tanpa bukti tekstual."
