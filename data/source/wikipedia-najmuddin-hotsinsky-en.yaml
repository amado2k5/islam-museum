  ar: "مقالة ويكيبيديا الإنجليزية عن نجم الدين غوتسينسكي (نجم الدين صاحب غوتسو)؛ تُستخدم لوقائع الكيان فقط. تروي إفتاءه لشمال القوقاز وإمامته لداغستان والشيشان وثوراته على البلاشفة وإعدامه سنة 1925، وصندوق معلوماتها يذكر «إسلامًا سنيًا» و«تصوفًا نقشبنديًا» دون سند نصي."
