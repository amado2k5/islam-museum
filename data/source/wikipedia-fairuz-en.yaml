  ar: "مقالة ويكيبيديا الإنجليزية عن فيروز؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في بيروت في أسرة مسيحية سريانية أرثوذكسية ومارونية، واكتشافها سنة 1950، وتعاونها مع الأخوين رحباني، وموقفها في الحرب الأهلية، ومسيرتها حتى اليوم."
  en: "English Wikipedia article on Fairuz; used for entity facts only. It records her birth in Beirut into a Syriac Orthodox and Maronite Christian family, her discovery in 1950, her work with the Rahbani Brothers, her stance in the civil war, and her career to the present."
