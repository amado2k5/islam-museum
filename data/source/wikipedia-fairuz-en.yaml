reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A long article, read in full on 25 October 2026. Its lead gives Nouhad Wadie Haddad, born '20 November 1934 or 21 November 1935' in Beirut 'into a Syriac Orthodox and Maronite Christian family'; its personal-life section records that she converted to Greek Orthodoxy when she married Assi Rahbani on 23 January 1955 — one of the two independent attestations of her Christianity used in the person record. Covers: her father Wadie, an Assyrian from Mardin who fled the Sayfo, and her Maronite mother Lisa al-Boustani of Dibbiyeh; the family's home in Zuqaq al-Blat; her discovery by Mohammed Flayfel in 1950, the conservatory, and Halim el Roumi, who hired her as a radio chorus singer and gave her the name Fairuz; 'Itab' (1952) with Assi Rahbani; the Baalbeck International Festival from 1957 and the 'Cavalier' honour from President Camille Chamoun; the scale of the output (some 1,500 songs, over 80 albums, 20 musicals, more than 150 million records — the article's own figures, attributed as such); the Rahbani Brothers' short Lebanese-dialect song form; her remaining in Lebanon through the 1975–1990 civil war, refusing to take sides, and singing Petra in both halves of divided Beirut in 1978; the 1979 split from the Rahbanis and her later work with her son Ziad Rahbani; the 1994 Martyrs' Square comeback concert; the contested 2008 Damascus Opera House appearance; the albums Eh Fi Amal (2010) and Bebalee (2017); President Macron's home visit of 31 August 2020; and her rare public appearance at her son Ziad's funeral in July 2025."
