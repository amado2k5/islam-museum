summary:
  ar: "مقالة ويكيبيديا الفرنسية عن علي دينار ⁦(نحو 1856-1916)⁩؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تجعله آخر سلاطين دارفور من السلالة الكيراوية، استعاد استقلال دارفور سنة 1898 وقُتل في الحملة الأنجلو-مصرية سنة 1916."
  en: "French Wikipedia article on Ali Dinar (c. 1856–1916); used for entity facts only. A short article making him the last sultan of Darfur of the Keira dynasty, who recovered Darfur's independence in 1898 and was killed in the Anglo-Egyptian expedition of 1916."
  es: "Artículo de la Wikipedia en francés sobre Ali Dinar (c. 1856–1916); utilizado únicamente para datos sobre la persona. Un breve artículo que lo presenta como el último sultán de Darfur de la dinastía Keira, quien recuperó la independencia de Darfur en 1898 y murió en la expedición anglo-egipcia de 1916."
  fr: "Article de Wikipédia en français sur Ali Dinar (vers 1856-1916); utilisé uniquement à des fins d'information sur l'entité. Ce court article le présente comme le dernier sultan du Darfour de la dynastie Keira, qui recouvra l'indépendance du Darfour en 1898 et fut tué lors de l'expédition anglo-égyptienne de 1916."
  ur: "علی دینار پر فرانسیسی ویکیپیڈیا مضمون (c. 1856–1916)؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون اسے کیرا خاندان کے دارفور کا آخری سلطان بناتا ہے، جس نے دارفر کی آزادی 1898 میں حاصل کی تھی اور 1916 کی اینگلو-مصری مہم میں مارا گیا تھا۔"
  tr: "Ali Dinar hakkında Fransızca Wikipedia makalesi (yaklaşık 1856-1916); yalnızca varlığın olayları için kullanılmıştır. Onu Kirawi hanedanından Darfur'un son Sultanı yapan kısa bir makale, 1898'de Darfur'un bağımsızlığını yeniden kazanmış ve 1916'daki Anglo-Mısır seferinde öldürülmüştür."
  id: "Artikel Wikipedia Prancis tentang Ali Dinar (sekitar 1856-1916); hanya digunakan untuk peristiwa entitas tersebut. Sebuah artikel singkat yang menjadikannya Sultan terakhir Darfur dari dinasti Kirawi, memperoleh kembali kemerdekaan Darfur pada tahun 1898 dan tewas dalam kampanye Anglo-Mesir pada tahun 1916."
