reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article. It gives: born 'vers 1856' (about 1856 — agreeing with the Arabic article and the founder's queue against the English article's c. 1865 and Wikidata's decade-precision 1860s, both recorded in the record); last sultan of Darfur and ruler of the Keira dynasty; in 1898, as the Mahdist state declined, he reconquered Darfur's independence; he took part in the Wadai war against the French, supporting Muhammad Daoud Mourra ibn Yousouf; his 1915 support for the Ottoman Empire in the First World War led the British government to launch the invasion of Darfur, in which he was killed in action on 6 November 1916, after which his sultanate was incorporated into Anglo-Egyptian Sudan; his sword was taken and is exhibited at the British Museum. The article names no school of law or theology for him."
