reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it, chiefly Hunwick's encyclopaedia entry 'Mukhtar ibn Ahmad, al-' (2004), Fage and Tordoff (2002), Willis (1979, 1989) and Hall (2011). Read in full on 25 October 2026. The article itself notes that Hunwick's suggestion of study in Morocco in 1754–1757 is inconsistent with the primary sources, including the hagiography by al-Mukhtar's son, which hold that he never left West Africa; the prose follows the primary-source position and states the disagreement."
