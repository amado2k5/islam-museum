summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيدي المختار بن أحمد الكنتي (1729-1811)، العالم البارز في الحركة القادرية في السودان الغربي الذي أسهم في انتشار الإسلام في غرب أفريقيا؛ تروي نشأته في منطقة إرغ أورالا شمال مبروك بمالي في قبيلة كنتة، وتتلمذه على سيدي علي بن النجيب في أروان، وقيادته من أزواد ووساطاته القبلية وكتبه الكثيرة وتتلمذ عثمان دان فوديو عليه، ووفاته سنة 1226 هـ (1811) وخلف ولده محمد ثم حفيده أحمد البكاي له."
  en: "English Wikipedia article on Sidi al-Mukhtar ibn Ahmad al-Kunti (1729–1811), the leading scholar of the Qadiriyya movement in the Western Sudan who promoted the spread of Islam in West Africa; it recounts his birth in the Erg Oralla region north of Mabrouk, Mali, in the Kunta tribe, his study under Sidi Ali bin al-Najib of Araouane, his leadership from Azawad, his tribal mediations, his many writings, his teaching of Usman dan Fodio, and his death in 1226 AH (1811 CE) and succession by his son Muhammad and then his grandson Ahmed al-Bakkay."
