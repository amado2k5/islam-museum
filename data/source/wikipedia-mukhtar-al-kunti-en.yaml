summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيدي المختار بن أحمد الكنتي (1729-1811)، العالم البارز في الحركة القادرية في السودان الغربي الذي أسهم في انتشار الإسلام في غرب أفريقيا؛ تروي نشأته في منطقة إرغ أورالا شمال مبروك بمالي في قبيلة كنتة، وتتلمذه على سيدي علي بن النجيب في أروان، وقيادته من أزواد ووساطاته القبلية وكتبه الكثيرة وتتلمذ عثمان دان فوديو عليه، ووفاته سنة 1226 هـ (1811) وخلف ولده محمد ثم حفيده أحمد البكاي له."
  en: "English Wikipedia article on Sidi al-Mukhtar ibn Ahmad al-Kunti (1729–1811), the leading scholar of the Qadiriyya movement in the Western Sudan who promoted the spread of Islam in West Africa; it recounts his birth in the Erg Oralla region north of Mabrouk, Mali, in the Kunta tribe, his study under Sidi Ali bin al-Najib of Araouane, his leadership from Azawad, his tribal mediations, his many writings, his teaching of Usman dan Fodio, and his death in 1226 AH (1811 CE) and succession by his son Muhammad and then his grandson Ahmed al-Bakkay."
  es: "Artículo de Wikipedia en inglés sobre Sidi al-Mukhtar ibn Ahmad al-Kunti (1729–1811), el principal estudioso del movimiento Qadiriyya en el Sudán occidental que promovió la expansión del Islam en África occidental; relata su nacimiento en la región de Erg Oralla al norte de Mabrouk, Mali, en la tribu Kunta, su estudio con Sidi Ali bin al-Najib de Araouane, su liderazgo desde Azawad, sus mediaciones tribales, sus numerosos escritos, sus enseñanzas de Usman dan Fodio al-Bakkay."
  fr: "Article de Wikipédia en anglais sur Sidi al-Mukhtar ibn Ahmad al-Kunti (1729-1811), le principal érudit du mouvement Qadiriyya au Soudan occidental qui a favorisé la propagation de l'islam en Afrique de l'Ouest; il raconte sa naissance dans la région de l'Erg Oralla au nord de Mabrouk, au Mali, dans la tribu Kunta, ses études sous Sidi Ali bin al-Najib d'Araouane, son leadership depuis l'Azawad, ses médiations tribales, ses nombreux écrits, son enseignement d'Usman dan Fodio al-Bakkay."
  ur: "مغربی سوڈان میں قادریہ تحریک کے سرکردہ عالم سیدی المختار ابن احمد الکنتی (1729–1811) پر انگریزی ویکیپیڈیا کا مضمون، جس نے مغربی افریقہ میں اسلام کے پھیلاؤ کو فروغ دیا۔ اس میں کنتا قبیلے میں مالی کے شہر مبروک کے شمال میں ارگ اورلہ کے علاقے میں ان کی پیدائش، عروانے کے سیدی علی بن النجیب کے تحت ان کا مطالعہ، ازواد سے اس کی قیادت، اس کی قبائلی ثالثی، اس کی بہت سی تحریریں، عثمان دان فودیو البکائے کی تعلیم کا ذکر ہے۔"
