  ar: "مقالة ويكيبيديا الصينية عن وانغ جينغزهاي؛ تُستخدم لوقائع الكيان فقط. وهي أوسع سيرة له: أهونغ تيانجين (1880–1949) الذي خدم في أكثر من عشرين مسجدًا، ودرس في الأزهر وحجّ سنة 1923، وقاد دعوة «اتباع الكتاب وإصلاح العادات» فهوجم بوصفه «الممارسة الجديدة»، وأصدر مجلة «إي غوانغ»، وترجم القرآن ثلاث مرات."
  en: "Chinese Wikipedia article on Wang Jingzhai; used for entity facts only. The fullest biography of him: the Tianjin ahong (12 March 1880 – 25 May 1949) who served more than twenty mosques, studied at al-Azhar and performed the hajj in 1923, led the 'follow scripture, reform customs' advocacy and was attacked as the 'new practice', published the journal Yi Guang, and translated the Qur'an three times."
