reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives his birth as the second day of the second lunar month of Guangxu 6 — 12 March 1880 — against the 1879 of the English and Urdu articles and Wikidata, and his death on 25 May 1949 at Guiyang; it names his teachers (his father Wang Lanting, Yu Mianzhai and others, none with a museum record), his study at al-Azhar in 1922–1924 and hajj in the autumn of 1923, funded by Ma Juntu, Ma Rongxuan, Ma Qiansan and Yang Xiaoting — the detailed itinerary that contradicts the sponsorship claim in Ma Linyi's English article. On affiliation it describes his reform advocacy ('following scripture and reforming customs'), the 1933 Sanyizhuang reform and the 1934 'expel the new practice' campaign against his party, and the reformist influence he absorbed in Egypt, but it names no movement or school as his affiliation."
