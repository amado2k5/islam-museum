summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رحمة الله الكيرانوي (1818–1891)؛ تُستخدم لوقائع الكيان فقط. تروي أنه عالم سني هندي اشتهر بـ«إظهار الحق» رداً على نقد الكتاب المقدس، وأنه شارك في المناظرة العلنية الشهيرة مع كارل غوتليب فاندر في آغرا سنة 1854، وأن الكتاب استُخدم بعد وفاته موسوعةً للطعون على النصرانية."
  en: "English Wikipedia article on Rahmatullah Kairanawi (1818–1891); used for entity facts only. It recounts the Indian Sunni scholar's fame through Izhar ul-Haqq, his part in the celebrated 1854 Agra public debate with Karl Gottlieb Pfander, and the book's later use as an encyclopaedia of charges against Christianity."
  es: "Artículo de la Wikipedia en inglés sobre Rahmatullah Kairanawi (1818-1891); utilizado únicamente para datos sobre la persona. Relata la fama del erudito sunita indio a través de Izhar ul-Haqq, su participación en el célebre debate público de Agra de 1854 con Karl Gottlieb Pfander, y el uso posterior del libro como enciclopedia de acusaciones contra el cristianismo."
  fr: "Article de Wikipédia en anglais sur Rahmatullah Kairanawi (1818-1891); utilisé uniquement à des fins d'information. Il relate la renommée de ce théologien sunnite indien grâce à son ouvrage Izhar ul-Haqq, son rôle dans le célèbre débat public d'Agra de 1854 avec Karl Gottlieb Pfander, et l'utilisation ultérieure de ce livre comme encyclopédie des accusations portées contre le christianisme."
  ur: "رحمت اللہ کیرانوی (1818-1891) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اظہار الحق کے ذریعے ہندوستانی سنی اسکالر کی شہرت، کارل گوٹلیب پیفنڈر کے ساتھ 1854 میں آگرہ کے مشہور عوامی مباحثے میں ان کا حصہ، اور بعد میں اس کتاب کو عیسائیت کے خلاف الزامات کے انسائیکلوپیڈیا کے طور پر استعمال کیا گیا۔"
