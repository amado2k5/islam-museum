  ar: "مقالة ويكيبيديا الإنجليزية عن رحمة الله الكيرانوي (1818–1891)؛ تُستخدم لوقائع الكيان فقط. تروي أنه عالم سني هندي اشتهر بـ«إظهار الحق» رداً على نقد الكتاب المقدس، وأنه شارك في المناظرة العلنية الشهيرة مع كارل غوتليب فاندر في آغرا سنة 1854، وأن الكتاب استُخدم بعد وفاته موسوعةً للطعون على النصرانية."
  en: "English Wikipedia article on Rahmatullah Kairanawi (1818–1891); used for entity facts only. It recounts the Indian Sunni scholar's fame through Izhar ul-Haqq, his part in the celebrated 1854 Agra public debate with Karl Gottlieb Pfander, and the book's later use as an encyclopaedia of charges against Christianity."
