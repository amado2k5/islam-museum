  ar: "عنصر ويكي بيانات Q139800986 لحكيم غلام نبي؛ يُستخدم لوقائع الكيان فقط. يعطي وفاته في 2 آب 1916 ومولده في أجناله ودفنه في مقبرة مياني صاحب بلاهور ولغاته الأردية والفارسية والعربية، ولا يحمل أي بيان ديانة."
  en: "Wikidata item Q139800986 for Hakim Ghulam Nabi; used for entity facts only. It gives his death on 2 August 1916, his birthplace as Ajnala, his burial place as Miani Sahib Graveyard in Lahore, and his languages as Urdu, Persian and Arabic, and carries no religion statement."
  es: "El elemento de Wikidata Q139800986 corresponde a Hakim Ghulam Nabi; se utiliza únicamente para obtener información sobre la persona. Indica que falleció el 2 de agosto de 1916, que nació en Ajnala, que fue enterrado en el cementerio de Miani Sahib en Lahore y que hablaba urdu, persa y árabe. No incluye ninguna declaración sobre su religión."
  fr: "L'élément Wikidata Q139800986 concernant Hakim Ghulam Nabi est utilisé uniquement pour les informations relatives à l'entité. Il indique sa date de décès, le 2 août 1916, son lieu de naissance, Ajnala, son lieu de sépulture, le cimetière Miani Sahib à Lahore, et les langues qu'il parlait: ourdou, persan et arabe. Aucune mention de sa religion n'est faite."
  ur: "حکیم غلام نبی کے لیے ویکی ڈیٹا آئٹم Q139800986؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی وفات 2 اگست 1916 کو، ان کی جائے پیدائش اجنالہ، ان کی تدفین کی جگہ میانی صاحب قبرستان لاہور، اور ان کی زبانیں اردو، فارسی اور عربی ہیں، اور اس میں کوئی مذہب بیان نہیں ہے۔"
