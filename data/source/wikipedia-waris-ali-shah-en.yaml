summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن وارث علي شاه (1817–1905)، وتنص في متنها على أنه مؤسس الطريقة الصوفية الوارثية، وأنه لازم في صباه الشيخ خادم علي شاه حتى وفاة الشيخ، وأنه أجاز الناس في طريقته، وتوفي في 7 نيسان 1905."
  en: "The English Wikipedia article on Waris Ali Shah (1817–1905), which states in its text that he was the founder of the Warsi Sufi order, that as a boy he attached himself to Khadim Ali Shah and remained with him until the latter's death, that he admitted people to his spiritual order, and that he died on 7 April 1905."
  es: "El artículo de la Wikipedia en inglés sobre Waris Ali Shah (1817-1905), que afirma en su texto que fue el fundador de la orden sufí Warsi, que de niño se unió a Khadim Ali Shah y permaneció con él hasta la muerte de este último, que admitió personas en su orden espiritual y que murió el 7 de abril de 1905."
  fr: "L'article de Wikipédia en anglais sur Waris Ali Shah (1817-1905) indique dans son texte qu'il était le fondateur de l'ordre soufi Warsi, que dès son enfance il s'est attaché à Khadim Ali Shah et est resté avec lui jusqu'à la mort de ce dernier, qu'il a admis des personnes dans son ordre spirituel et qu'il est mort le 7 avril 1905."
  ur: "وارث علی شاہ (1817-1905) پر انگریزی ویکیپیڈیا کا مضمون، جس کے متن میں کہا گیا ہے کہ وہ وارثی صوفی حکم کے بانی تھے، کہ وہ لڑکپن میں ہی خادم علی شاہ سے منسلک رہے اور بعد کی موت تک ان کے ساتھ رہے، کہ انہوں نے لوگوں کو اپنے روحانی حکم میں داخل کیا، اور یہ کہ ان کا انتقال 7 اپریل 1905 کو ہوا۔"
  tr: "Warith Ali Şah (1817–1905) hakkında İngilizce Wikipedia makalesi, onun kalıtsal Sufi tarikatının kurucusu olduğunu, gençliğinde Şeyh Hadim Ali Şah'ı Şeyh'in ölümüne kadar takip ettiğini, insanların kendi tarikatına uymasına izin verdiğini ve 7 Nisan 1905'te öldüğünü belirtir."
  id: "Artikel Wikipedia bahasa Inggris tentang Warith Ali Shah (1817–1905), menyatakan bahwa ia adalah pendiri tarekat Sufi turun-temurun, mengikuti Sheikh Khadim Ali Shah saat muda hingga kematian Sheikh, mengizinkan orang mengikuti perintahnya, dan bahwa ia meninggal pada 7 April 1905."
