  ar: "مقالة ويكيبيديا الإنجليزية عن وارث علي شاه (1817–1905)، وتنص في متنها على أنه مؤسس الطريقة الصوفية الوارثية، وأنه لازم في صباه الشيخ خادم علي شاه حتى وفاة الشيخ، وأنه أجاز الناس في طريقته، وتوفي في 7 نيسان 1905."
  en: "The English Wikipedia article on Waris Ali Shah (1817–1905), which states in its text that he was the founder of the Warsi Sufi order, that as a boy he attached himself to Khadim Ali Shah and remained with him until the latter's death, that he admitted people to his spiritual order, and that he died on 7 April 1905."
