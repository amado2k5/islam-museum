summary:
  ar: "سيرة محمد بن أحمد بن عبدون التجيبي في ويكيبيديا العربية: كاتب وفقيه من أهل إشبيلية عاش في النصف الثاني من القرن الخامس الهجري وشهد نهاية ملك المعتمد بن عباد ودولة المرابطين، وصاحب «رسالة في القضاء والحسبة» التي حققها ليفي بروفنسال (1955)؛ لا تذكر المقالة تاريخَي ولادة ووفاة محددَين."
  en: "Arabic Wikipedia biography of Muhammad ibn Ahmad ibn Abdun al-Tujibi: a writer and jurist of Seville who lived in the second half of the 5th century AH (11th century CE), witnessed the end of al-Mu'tamid's reign and the Almoravid period, and wrote the Risala fi'l-qada' wa'l-hisba (Treatise on the Judiciary and Market Inspection), edited by Levi-Provencal in 1955. The article gives no exact birth or death dates."
  ur: "محمد بن احمد بن عبدون التجیبی کی عربی ویکیپیڈیا سوانح: اشبیلیہ کے مصنف و فقیہ، پانچویں صدی ہجری کے نصفِ ثانی میں زیست، «رسالہ فی القضاء والحسبہ» کے مصنف؛ مضمون میں ولادت و وفات کی کوئی قطعی تاریخ نہیں۔"
  es: "Biografía en la Wikipedia en árabe de Muhammad ibn Ahmad ibn Abdun al-Tujibi: escritor y jurista sevillano que vivió en la segunda mitad del siglo V d. C. (siglo XI d. C.), presenció el fin del reinado de al-Mu'tamid y el período almorávide, y escribió el Risala fi'l-qada' wa'l-hisba (Tratado sobre el poder judicial y la inspección del mercado), editado por Levi-Provencal en 1955. El artículo no proporciona fechas exactas de nacimiento ni de fallecimiento."
  fr: "Biographie de Muhammad ibn Ahmad ibn Abdun al-Tujibi sur Wikipédia en arabe: écrivain et juriste sévillan ayant vécu dans la seconde moitié du Ve siècle de l’Hégire (XIe siècle de notre ère), il fut témoin de la fin du règne d’al-Mu’tamid et de la période almoravide, et auteur du Risala fi’l-qada’ wa’l-hisba (Traité de la justice et de l’inspection du marché), édité par Levi-Provencal en 1955. L’article ne mentionne aucune date précise de naissance ni de décès."
