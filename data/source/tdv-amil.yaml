  ar: "مدخل «عامل» في موسوعة TDV الإسلامية التركية. يتتبع الكلمة من معناها في اللغة إلى جباية الزكاة والخراج والجزية، ثم إلى العامل في الدول التركية المسلمة وفي كتب الفقه، وإلى أجره وشروطه."
  en: "The TDV İslâm Ansiklopedisi entry on the amil. It follows the word from its dictionary sense to the collection of zakat, land tax and poll tax, then to the amil in the Turkic Muslim states and in the law books, and to his wage and his conditions."
