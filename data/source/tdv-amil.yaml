summary:
  ar: "مدخل «عامل» في موسوعة TDV الإسلامية التركية. يتتبع الكلمة من معناها في اللغة إلى جباية الزكاة والخراج والجزية، ثم إلى العامل في الدول التركية المسلمة وفي كتب الفقه، وإلى أجره وشروطه."
  en: "The TDV İslâm Ansiklopedisi entry on the amil. It follows the word from its dictionary sense to the collection of zakat, land tax and poll tax, then to the amil in the Turkic Muslim states and in the law books, and to his wage and his conditions."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre el amil. Analiza la palabra desde su significado en el diccionario hasta la recaudación del zakat, el impuesto sobre la tierra y el impuesto per cápita, pasando por la figura del amil en los estados turco-musulmanes y en los libros de leyes, así como su salario y sus condiciones laborales."
  fr: "L'article de TDV İslâm Ansiklopedisi sur l'amil retrace l'étymologie du mot, de sa définition dans le dictionnaire à la collecte de la zakat, de l'impôt foncier et de la capitation, puis à l'amil dans les États turco-musulmans et dans les recueils de lois, ainsi qu'à son salaire et à ses conditions de travail."
  ur: "امل پر TDV İslâm Ansiklopedisi اندراج۔ یہ لفظ اپنے لغت کے معنی سے لے کر زکوٰۃ، اراضی ٹیکس اور پول ٹیکس کی وصولی تک، پھر ترک مسلم ریاستوں اور قانون کی کتابوں میں عامل کے لیے، اور اس کی اجرت اور اس کی شرائط تک ہے۔"
