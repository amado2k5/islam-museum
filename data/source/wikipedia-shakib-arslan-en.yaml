reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his birth at Choueifat on 25 December 1869 and his death on 9 December 1946 (infobox: Beirut). On religion its personal-life section, citing William L. Cleveland's Islam Against the West (1985, p. 49), states that he was born into a Druze family and 'later converted to Sunni Islam', 'establishing himself as an orthodox Muslim serving the interests of Sunni Islam' — a personal attestation from an independent scholarly biography; its short description calls him a Druze prince and its categories file him under 'Lebanese Druze people', 'Lebanese Sunni politicians' and 'Converts to Islam from Druzism'."
