  ar: "مقالة ويكيبيديا الإنجليزية عن شكيب أرسلان؛ تُستخدم لوقائع الكيان فقط. تروي نشاطه السياسي والأدبي ومنفاه في جنيف، وفي حياته الشخصية أنه وُلد في أسرة درزية ثم اعتنق الإسلام السني لاحقاً."
  en: "English Wikipedia article on Shakib Arslan; used for entity facts only. It recounts his pan-Islamic and Arab nationalist politics, his Geneva exile as unofficial representative of Syria and Palestine to the League of Nations, and states in its personal-life section that he was born into a Druze family and later converted to Sunni Islam."
  es: "Artículo de la Wikipedia en inglés sobre Shakib Arslan; utilizado únicamente para obtener información sobre la persona. Relata su ideología panislámica y nacionalista árabe, su exilio en Ginebra como representante no oficial de Siria y Palestina ante la Sociedad de Naciones, y afirma en su sección sobre su vida personal que nació en una familia drusa y que posteriormente se convirtió al islam sunita."
  fr: "Article de Wikipédia en anglais sur Shakib Arslan; utilisé uniquement pour les informations relatives à l’entité. Il relate son engagement politique panislamique et nationaliste arabe, son exil à Genève en tant que représentant non officiel de la Syrie et de la Palestine auprès de la Société des Nations, et précise dans sa section consacrée à sa vie personnelle qu’il est né dans une famille druze et s’est converti plus tard à l’islam sunnite."
