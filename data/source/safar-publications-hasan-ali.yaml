summary:
  ar: "صفحة التعريف بمنشورات سفر: تذكر أن مؤسسة أكاديمية سفر أسسها الشيخ حسن علي سنة 1998، وأن مناهجها تُستخدم الآن في أكثر من ستين دولة، وتضم رسالة مؤسس موقعة منه بوصفه مؤسس أكاديمية سفر ومنشورات سفر."
  en: "Safar Publications' about page: it states that Safar Academy Trust was founded by Shaykh Hasan Ali in 1998, that its curriculum is now used in more than sixty countries, and it carries a founder's message signed by him as founder of Safar Academy and Safar Publications."
  es: "La página \"Acerca de\" de Safar Publications indica que Safar Academy Trust fue fundada por Shaykh Hasan Ali en 1998, que su plan de estudios se utiliza actualmente en más de sesenta países y que incluye un mensaje del fundador firmado por él como fundador de Safar Academy y Safar Publications."
  fr: "La page « À propos » de Safar Publications indique que Safar Academy Trust a été fondée par Shaykh Hasan Ali en 1998, que son programme est désormais utilisé dans plus de soixante pays, et elle contient un message du fondateur signé par lui en tant que fondateur de Safar Academy et de Safar Publications."
  ur: "صفر پبلی کیشنز کے بارے میں صفحہ: اس میں کہا گیا ہے کہ سفر اکیڈمی ٹرسٹ کی بنیاد 1998 میں شیخ حسن علی نے رکھی تھی کہ اس کا نصاب اب ساٹھ سے زیادہ ممالک میں استعمال ہوتا ہے۔"
  tr: "Seyahat Yayınları Giriş Sayfası: Safar Akademisi Vakfı'nın 1998 yılında Şeyh Hassan Ali tarafından kurulduğu ve müfredatlarının şu anda altmıştan fazla ülkede kullanıldığı belirtilmektedir. Mektubunda, Safar ve Seyahat Yayınları Akademisi'nin kurucusu olarak kendisi tarafından imzalanan bir kurucu mektubu da bulunmaktadır."
  id: "Halaman Pendahuluan Publikasi Perjalanan: Disebutkan bahwa Yayasan Akademi Safar didirikan oleh Sheikh Hassan Ali pada tahun 1998, dan kurikulumnya kini digunakan di lebih dari enam puluh negara. Surat tersebut mencakup surat pendiri yang ditandatangani olehnya sebagai pendiri Akademi Publikasi Safar dan Perjalanan."
