reliability_note: "Read in the museum's session on 20 November 2026. It says that in the Mongol conquest the smell of the bodies made Hulagu withdraw for a few days, the city was plundered, mosques were turned into stables and libraries were destroyed; that part of the books was burned and part thrown into the Tigris, which ran for days the colour of ink; that the Mongol invasion was a terrible catastrophe for the whole Islamic world; and that Baghdad was nevertheless saved from complete destruction. It also describes Baghdad as a great centre of culture, translation and science, with the Bayt al-Hikma among the institutions that translated. Used for the statements it makes, each attributed to it; the museum does not treat them as settled where the article itself speaks of reports."
