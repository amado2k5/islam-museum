  ar: "مقالة ويكيبيديا الإنجليزية عن سعيد بن سلطان، سلطان مسقط وعُمان وزنجبار ووالد علي بن سعيد؛ يذكر صندوق معلوماتها أن دينه هو الإسلام الإباضي، وتُستشهد بها هنا تأييدًا لتوثيق انتماء الأسرة."
  en: "English Wikipedia article on Said bin Sultan, Sultan of Muscat, Oman and Zanzibar and father of Ali bin Said; its infobox records his religion as Ibadi Islam, and it is cited here as corroboration for the dynasty's attested affiliation."
  es: "Artículo de la Wikipedia en inglés sobre Said bin Sultan, sultán de Mascate, Omán y Zanzíbar y padre de Ali bin Said; su ficha informativa indica que su religión era el islam ibadí, y se cita aquí como corroboración de la afiliación atestiguada de la dinastía."
  fr: "L'article de Wikipédia en anglais sur Saïd bin Sultan, sultan de Mascate, d'Oman et de Zanzibar et père d'Ali bin Saïd; son infobox indique que sa religion est l'islam ibadite, et il est cité ici comme corroboration de l'affiliation attestée de la dynastie."
  ur: "سید بن سلطان، مسقط، عمان اور زنجبار کے سلطان اور علی بن سعید کے والد پر انگریزی ویکیپیڈیا مضمون؛ اس کا معلوماتی باکس اس کے مذہب کو عبادی اسلام کے طور پر ریکارڈ کرتا ہے، اور اسے یہاں خاندان کی تصدیق شدہ وابستگی کی تصدیق کے طور پر نقل کیا گیا ہے۔"
  tr: "Said bin Sultan, Muskat, Umman ve Zanzibar Sultanı ve Ali bin Said'in babası hakkında İngilizce Wikipedia makalesi; bilgi kutusunda dininin İbadi İslam olduğu belirtiliyor ve aile bağlılığını belgelemek için burada bu maddeyi alıntılıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Said bin Sultan, Sultan Muscat, Oman, dan Zanzibar, serta ayah Ali bin Said; infobox-nya menyebutkan bahwa agamanya adalah Islam Ibadi, dan dikutip di sini untuk mendukung dokumentasi afiliasi keluarga."
