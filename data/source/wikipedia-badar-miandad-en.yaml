summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن القوّال بدر مياں داد؛ لوقائع الكيان فقط: مولده في باكپتن في 17 فبراير ⁦(1960 في الصندوق و1962 في المتن)⁩، وأسرته من القوالين، وقرابته لنصرت فتح علي خان، وبدء مسيرته في 1975، وتلحينه لأفلام هندية وباكستانية، وقوالياته المشهورة، ووفاته في لاهور في 2 مارس 2007؛ وتستند إلى داون وذا نيشن."
  en: "English Wikipedia article on the qawwal Badar Miandad; entity facts only: birth at Pakpattan on 17 February (1960 in the infobox, 1962 in the text), his qawwal family, his kinship with Nusrat Fateh Ali Khan, the start of his career in 1975, his film scores, his best-known qawwalis, and death in Lahore on 2 March 2007; it cites Dawn and The Nation."
  es: "Artículo de la Wikipedia en inglés sobre el qawwal Badar Miandad; solo datos sobre la persona: nacimiento en Pakpattan el 17 de febrero (1960 en el recuadro informativo, 1962 en el texto), su familia qawwal, su parentesco con Nusrat Fateh Ali Khan, el inicio de su carrera en 1975, sus bandas sonoras para películas, sus qawwalis más conocidos y su muerte en Lahore el 2 de marzo de 2007; cita a Dawn y The Nation."
  fr: "Article de Wikipédia en anglais sur le qawwal Badar Miandad; informations uniquement sur l’entité: naissance à Pakpattan le 17 février (1960 dans l’infobox, 1962 dans le texte), sa famille de qawwals, sa parenté avec Nusrat Fateh Ali Khan, le début de sa carrière en 1975, ses musiques de films, ses qawwalis les plus connus et sa mort à Lahore le 2 mars 2007; il cite Dawn et The Nation."
  ur: "قوال بدر میانداد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: 17 فروری کو پاکپتن میں پیدائش ⁦(انفو باکس میں 1960، متن میں 1962)⁩، ان کا قوال خاندان، نصرت فتح علی خان کے ساتھ ان کی رشتہ داری، 1975 میں ان کے کیریئر کا آغاز، ان کے فلمی سکور، ان کی معروف قوالیاں، اور وفات 2 مارچ 720 کو لاہور میں۔ یہ ڈان اور دی نیشن کا حوالہ دیتا ہے۔"
  tr: "Qawwal Badr Mian Dad hakkında İngilizce Wikipedia makalesi; sadece varlığın gerçekleri için: 17 Şubat'ta Pakpatan'da doğması (1960'ta Al-Sakud'da ve 1962'de Al-Tan'da), kavvali ailesi, Nusrat Fateh Ali Khan ile akrabalığı, 1975'te kariyerine başlaması, Hint ve Pakistan filmleri bestelemesi, ünlü kavvalileri ve 2 Mart 2007'de Lahor'da ölümü; Down ve The Nation filmlerine dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Qawwal Badr Mian Dad; hanya untuk fakta entitas: kelahirannya di Pakpatan pada 17 Februari (1960 di Al-Sakud dan 1962 di Al-Tan), keluarga qawwalisnya, hubungan kekeluargaannya dengan Nusrat Fateh Ali Khan, awal kariernya pada tahun 1975, komposisi film India dan Pakistan, qawwali terkenalnya, dan kematiannya di Lahore pada 2 Maret 2007; berdasarkan Down dan The Nation."
