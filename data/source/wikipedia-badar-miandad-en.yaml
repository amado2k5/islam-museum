  ar: "مقالة ويكيبيديا الإنجليزية عن القوّال بدر مياں داد؛ لوقائع الكيان فقط: مولده في باكپتن في 17 فبراير ⁦(1960 في الصندوق و1962 في المتن)⁩، وأسرته من القوالين، وقرابته لنصرت فتح علي خان، وبدء مسيرته في 1975، وتلحينه لأفلام هندية وباكستانية، وقوالياته المشهورة، ووفاته في لاهور في 2 مارس 2007؛ وتستند إلى داون وذا نيشن."
  en: "English Wikipedia article on the qawwal Badar Miandad; entity facts only: birth at Pakpattan on 17 February (1960 in the infobox, 1962 in the text), his qawwal family, his kinship with Nusrat Fateh Ali Khan, the start of his career in 1975, his film scores, his best-known qawwalis, and death in Lahore on 2 March 2007; it cites Dawn and The Nation."
