summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0625\u0646\u062c\u0644\u064a\u0632\u064a\u0629 \u0639\u0646 \u0627\u0644\u0642\u0648\u0651\u0627\u0644 \u0628\u062f\u0631 \u0645\u064a\u0627\u06ba \u062f\u0627\u062f\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u0628\u0627\u0643\u067e\u062a\u0646 \u0641\u064a 17 \u0641\u0628\u0631\u0627\u064a\u0631 \u2066(1960 \u0641\u064a \u0627\u0644\u0635\u0646\u062f\u0648\u0642 \u06481962 \u0641\u064a \u0627\u0644\u0645\u062a\u0646)\u2069\u060c \u0648\u0623\u0633\u0631\u062a\u0647 \u0645\u0646 \u0627\u0644\u0642\u0648\u0627\u0644\u064a\u0646\u060c \u0648\u0642\u0631\u0627\u0628\u062a\u0647 \u0644\u0646\u0635\u0631\u062a \u0641\u062a\u062d \u0639\u0644\u064a \u062e\u0627\u0646\u060c \u0648\u0628\u062f\u0621 \u0645\u0633\u064a\u0631\u062a\u0647 \u0641\u064a 1975\u060c \u0648\u062a\u0644\u062d\u064a\u0646\u0647 \u0644\u0623\u0641\u0644\u0627\u0645 \u0647\u0646\u062f\u064a\u0629 \u0648\u0628\u0627\u0643\u0633\u062a\u0627\u0646\u064a\u0629\u060c \u0648\u0642\u0648\u0627\u0644\u064a\u0627\u062a\u0647 \u0627\u0644\u0645\u0634\u0647\u0648\u0631\u0629\u060c \u0648\u0648\u0641\u0627\u062a\u0647 \u0641\u064a \u0644\u0627\u0647\u0648\u0631 \u0641\u064a 2 \u0645\u0627\u0631\u0633 2007\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u062f\u0627\u0648\u0646 \u0648\u0630\u0627 \u0646\u064a\u0634\u0646."
  en: "English Wikipedia article on the qawwal Badar Miandad; entity facts only: birth at Pakpattan on 17 February (1960 in the infobox, 1962 in the text), his qawwal family, his kinship with Nusrat Fateh Ali Khan, the start of his career in 1975, his film scores, his best-known qawwalis, and death in Lahore on 2 March 2007; it cites Dawn and The Nation."
