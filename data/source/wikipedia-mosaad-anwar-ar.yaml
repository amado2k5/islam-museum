reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026), read through the MediaWiki API at revision 73718077 (7 March 2026) on 2 November 2026. Gives: an Egyptian Islamic preacher (da'iya), born in Egypt, presenter of several programmes on satellite channels, best known on al-Rahma channel, with many lessons and lectures on channels and in mosques; security forces raided his home in Hadaiq al-Qubba at two in the morning and arrested him, as the preacher Abd al-Rahman Mansour confirmed, together with his son Muhammad; the prosecution confronted him with investigations alleging funding of and membership in a group founded contrary to the constitution and incitement to violence, and a role in moving Brotherhood demonstrations, all of which he denied, denying any link to the Muslim Brotherhood, saying he had not intervened in the country's politics since the demonstrations of 30 June 2013 and that demonstrations are forbidden in the Sharia; he was released after six hours of questioning. The article gives no date of birth, no date for the arrest and no school; its references section is empty in the text read. Recorded in docs/authenticity-ledger/pages/wikipedia-mosaad-anwar-ar.yaml."
