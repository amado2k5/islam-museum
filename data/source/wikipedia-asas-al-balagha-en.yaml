summary:
  ar: "صفحة «Asas al-Balagha» في ويكيبيديا الإنجليزية، وهي الصفحة الموثِّقة التي سماها ملخص بحثي قُدّم إلى المتحف للكتاب «أساس البلاغة»؛ لم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص دون إعادة تحقق في 21 نوفمبر 2026، في موضوع: نسبة الكتاب إلى مؤلفه وتاريخه."
  en: "The page \"Asas al-Balagha\" on the English Wikipedia, named by a research summary supplied to the museum as the documenting page for Asas al-Balagha; the museum did not open the page, and the founder approved using the summary without re-verification on 21 November 2026, for the ascription of the work to its author and its date."
  ur: "انگریزی ویکیپیڈیا پر صفحہ «Asas al-Balagha»، جسے عجائب گھر کو دیے گئے ایک تحقیقی خلاصے نے «اساس البلاغۃ» کا مستند صفحہ بتایا؛ عجائب گھر نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصے کے استعمال کی منظوری دی، موضوع: کتاب کی مصنف سے نسبت اور اس کی تاریخ۔"
  fr: "La page « Asas al-Balagha » de Wikipédia (anglaise), nommée par un résumé de recherche remis au musée comme page documentaire de Asas al-Balagha ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé sans nouvelle vérification le 21 novembre 2026, pour l'attribution de l'ouvrage à son auteur et sa date."
  es: "La página «Asas al-Balagha» de Wikipedia (en inglés), nombrada por un resumen de investigación entregado al museo como página documental de Asas al-Balagha; el museo no abrió la página, y el fundador aprobó usar el resumen sin nueva verificación el 21 de noviembre de 2026, para la atribución de la obra a su autor y su fecha."
  tr: "İngilizce Vikipedi'deki \"Asas al-Balagha\" sayfası, \"Retoriğin Temeli\" kitabı için müzeye sunulan araştırma özeti olarak belgelenmiş sayfadır; müze sayfayı açmamış ve kurucu 21 Kasım 2026'da kitabın yazarına ve tarihine atfedilmesi başlıklı özetin yeniden doğrulama yapılmadan kullanılmasına izin vermiştir."
  id: "Halaman \"Asas al-Balagha\" di Wikipedia bahasa Inggris, yang merupakan halaman terdokumentasi disebut ringkasan penelitian yang dikirim ke museum untuk buku \"The Foundation of Rhetoric\"; museum tidak membuka halaman tersebut, dan pendiri mengizinkan penggunaan ringkasan tanpa verifikasi ulang pada 21 November 2026, dalam topik: atribusi buku kepada penulisnya dan sejarahnya."
