summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نواب سر فتح علي خان قزلباش؛ تُستخدم لوقائع الكيان فقط. تروي أنه جاگیردار من لاهور، وُلد سنة 1862 وتوفي في 28 تشرين الأول 1923، وأنه ساعد الحكومة في حملة چترال سنة 1895، وخلف عمه سنة 1898 على رأس عشيرة قزلباش، وجلس في مجلس الهند، وطرح سنة 1914 فكرة كلية الشيعة في لكناو، ونال وسام قائد فارس للإمبراطورية الهندية سنة 1921."
  en: "English Wikipedia article on Nawab Sir Fateh Ali Khan Kazilbash; used for entity facts only. It recounts that he was a Lahore landlord, born in 1862 and died on 28 October 1923, that he assisted the government in the Chitral Expedition of 1895, succeeded his uncle in 1898 as head of the Qizilbash clan, sat on the Council of India, promulgated the idea of Shia College, Lucknow in 1914, and was made KCIE in 1921."
  es: "Artículo de la Wikipedia en inglés sobre Nawab Sir Fateh Ali Khan Kazilbash; utilizado únicamente para datos sobre la persona. Relata que fue un terrateniente de Lahore, nacido en 1862 y fallecido el 28 de octubre de 1923, que ayudó al gobierno en la Expedición a Chitral de 1895, sucedió a su tío en 1898 como jefe del clan Qizilbash, formó parte del Consejo de la India, impulsó la idea del Colegio Shia de Lucknow en 1914 y fue nombrado KCIE en 1921."
  fr: "Article de Wikipédia en anglais sur Nawab Sir Fateh Ali Khan Kazilbash; utilisé uniquement à titre informatif. Il relate qu’il était un propriétaire terrien de Lahore, né en 1862 et décédé le 28 octobre 1923, qu’il a aidé le gouvernement lors de l’expédition de Chitral en 1895, qu’il a succédé à son oncle en 1898 à la tête du clan Qizilbash, qu’il a siégé au Conseil de l’Inde, qu’il a promulgué l’idée du Shia College de Lucknow en 1914 et qu’il a été fait chevalier commandeur de l’Ordre de l’Inde (KCIE) en 1921."
