summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نواب سر فتح علي خان قزلباش؛ تُستخدم لوقائع الكيان فقط. تروي أنه جاگیردار من لاهور، وُلد سنة 1862 وتوفي في 28 تشرين الأول 1923، وأنه ساعد الحكومة في حملة چترال سنة 1895، وخلف عمه سنة 1898 على رأس عشيرة قزلباش، وجلس في مجلس الهند، وطرح سنة 1914 فكرة كلية الشيعة في لكناو، ونال وسام قائد فارس للإمبراطورية الهندية سنة 1921."
  en: "English Wikipedia article on Nawab Sir Fateh Ali Khan Kazilbash; used for entity facts only. It recounts that he was a Lahore landlord, born in 1862 and died on 28 October 1923, that he assisted the government in the Chitral Expedition of 1895, succeeded his uncle in 1898 as head of the Qizilbash clan, sat on the Council of India, promulgated the idea of Shia College, Lucknow in 1914, and was made KCIE in 1921."
