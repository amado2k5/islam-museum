reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by revision id through the MediaWiki API with the returned id asserted equal. Its biography rests chiefly on Rao's Indian Biographical Dictionary (1915, p. 143), Hansard of 21 July 1908, The Times of 29 April 1902, the India List for 1905 and the London Gazette of 4 June 1921. On religion it states in its text that in 1914 he promulgated the idea of Shia College, Lucknow, citing Islam and the Modern Age (1992) and Hasan's Vanishing Culture of Lucknow (1990), and cites Andreas Rieck's The Shias of Pakistan (2016, p. 342) for his First World War donation; it carries no religion infobox field and no religion category."
