  tr: "\"Rawi\"nin TDV İslami Ansiklopedisi'ne Mehmet Efendioğlu'nun girişi: Anlatıcı, hadislerin ileticisi, rivayetçilerin katmanlarını, adalet ve doğruluk koşullarını, dayanıklılık ve performans şartlarını aktarıcısıdır."
