  en: "The TDV İslâm Ansiklopedisi entry on râvî (transmitter) by Mehmet Efendioğlu: the hadith-transmitter's office, the generations of transmitters, the qualifications of adala and dabt, and the vocabulary of receiving and passing on a report."
