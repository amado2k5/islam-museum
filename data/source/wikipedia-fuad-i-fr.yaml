summary:
  ar: "مقالة ويكيبيديا الفرنسية عن فؤاد الأول؛ يعطي صندوقها دينه «الإسلام» بصورة عامة، واسمه الكامل أحمد فؤاد إسماعيل، وتواريخها توافق المقالة الإنجليزية."
  en: "French Wikipedia article on Fouad Ier, King of Egypt; used for entity facts only. Its infobox gives his religion as Islam in generic form, his full name as Ahmed Fouad Ismail, and dates agreeing with the English article (26 March 1868 – 28 April 1936, Cairo)."
  es: "Artículo de la Wikipedia en francés sobre Fouad Ier, rey de Egipto; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que su religión era el islam en forma genérica, su nombre completo era Ahmed Fouad Ismail y las fechas coinciden con el artículo en inglés (26 de marzo de 1868 - 28 de abril de 1936, El Cairo)."
  fr: "Article de Wikipédia en français sur Fouad Ier, roi d'Égypte; utilisé uniquement pour les informations sur l'entité. Son infobox indique que sa religion est l'islam (de manière générique), son nom complet est Ahmed Fouad Ismail, et les dates correspondent à celles de l'article en anglais (26 mars 1868 – 28 avril 1936, Le Caire)."
  ur: "مصر کے بادشاہ فواد ایر پر فرانسیسی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے معلوماتی خانے میں عام شکل میں اس کا مذہب اسلام، اس کا پورا نام احمد فواد اسماعیل، اور انگریزی مضمون ⁦(26 مارچ 1868 - 28 اپریل 1936، قاہرہ)⁩ سے متفق ہونے کی تاریخیں دی گئی ہیں۔"
  tr: "Fuad I hakkında Fransızca Wikipedia makalesi; kutusunda genel olarak dininin \"İslam\" olduğu belirtiliyor, tam adı Ahmed Fouad Ismail'dir ve tarihleri İngilizce makaleyle eşleşiyor."
  id: "Artikel Wikipedia Prancis tentang Fuad I; kotaknya mencantumkan agamanya sebagai \"Islam\" secara umum, nama lengkapnya Ahmed Fouad Ismail, dan tanggalnya sesuai dengan artikel bahasa Inggris."
