summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نور محمد تركي؛ تُستخدم لوقائع الكيان فقط ⁦(مقالة جيدة)⁩. تروي مولده في 14 يوليو 1917 في ناوا بولاية غزني لأسرة فلاحية بشتونية، وعمله صحفيا وكاتبا، وتأسيسه حزب الشعب الديمقراطي الأفغاني وأمانته العامة، وقيادته الدولة بعد انقلاب ثور حتى اغتياله في 9 أكتوبر 1979 بكابل. لا تحمل خانة للديانة ولا يسمي نصها ديانته أو إلحاده الشخصي."
  en: "English Wikipedia article on Nur Muhammad Taraki; used for entity facts only (a Good Article). It recounts his birth on 14 July 1917 at Nawa in Ghazni Province to a Pashtun peasant family, his work as journalist and writer, his founding and general secretaryship of the People's Democratic Party of Afghanistan, and his headship of state after the Saur Revolution until his murder on 9 October 1979 at Kabul. It carries no religion field, and its text names neither a religion nor a personal atheism for him."
  es: "Artículo de la Wikipedia en inglés sobre Nur Muhammad Taraki; utilizado únicamente para datos sobre la persona (un buen artículo). Relata su nacimiento el 14 de julio de 1917 en Nawa, provincia de Ghazni, en el seno de una familia campesina pastún; su trayectoria como periodista y escritor; la fundación y secretaría general del Partido Democrático Popular de Afganistán; y su jefatura de Estado tras la Revolución Saur hasta su asesinato el 9 de octubre de 1979 en Kabul. No incluye información sobre religión, y su texto no menciona ninguna religión ni ateísmo personal en relación con él."
  fr: "Article de Wikipédia en anglais sur Nur Muhammad Taraki; utilisé uniquement pour les informations biographiques (article de qualité). Il relate sa naissance le 14 juillet 1917 à Nawa, dans la province de Ghazni, au sein d’une famille de paysans pachtounes, son travail de journaliste et d’écrivain, la fondation et le poste de secrétaire général du Parti démocratique populaire d’Afghanistan, ainsi que son rôle de chef d’État après la révolution de Saur jusqu’à son assassinat le 9 octobre 1979 à Kaboul. L’article ne comporte pas de champ relatif à la religion et son texte ne mentionne ni son appartenance religieuse ni son athéisme personnel."
  ur: "نور محمد تراکی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے ⁦(ایک اچھا مضمون)⁩۔ اس میں 14 جولائی 1917 کو صوبہ غزنی کے ناوا میں ایک پشتون کسان خاندان میں ان کی پیدائش، صحافی اور مصنف کے طور پر ان کے کام، ان کی پیپلز ڈیموکریٹک پارٹی آف افغانستان کی بانی اور جنرل سیکرٹری شپ، اور سور انقلاب کے بعد ان کی ریاست کی سربراہی 9 اکتوبر 1979 کو کابل میں ان کے قتل تک کا ذکر ہے۔ اس میں کوئی مذہب نہیں ہے، اور اس کے متن کے نام نہ تو اس کے لیے کوئی مذہب ہے اور نہ ہی ذاتی الحاد۔"
