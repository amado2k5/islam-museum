summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نور محمد تركي؛ تُستخدم لوقائع الكيان فقط (مقالة جيدة). تروي مولده في 14 يوليو 1917 في ناوا بولاية غزني لأسرة فلاحية بشتونية، وعمله صحفيا وكاتبا، وتأسيسه حزب الشعب الديمقراطي الأفغاني وأمانته العامة، وقيادته الدولة بعد انقلاب ثور حتى اغتياله في 9 أكتوبر 1979 بكابل. لا تحمل خانة للديانة ولا يسمي نصها ديانته أو إلحاده الشخصي."
  en: "English Wikipedia article on Nur Muhammad Taraki; used for entity facts only (a Good Article). It recounts his birth on 14 July 1917 at Nawa in Ghazni Province to a Pashtun peasant family, his work as journalist and writer, his founding and general secretaryship of the People's Democratic Party of Afghanistan, and his headship of state after the Saur Revolution until his murder on 9 October 1979 at Kabul. It carries no religion field, and its text names neither a religion nor a personal atheism for him."
