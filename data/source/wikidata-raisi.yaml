summary:
  ar: "عنصر ويكي بيانات Q5947347 لإبراهيم رئيسي، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته 14 كانون الأول 1960 في مشهد ووفاته 19 أيار 2024، وللدين قيمة الإسلام عمومًا (Q432) فقط — فلا قيمة شيعية فيه أصلًا."
  en: "Wikidata item Q5947347 for Ebrahim Raisi, grounded through the English article's pageprops; used for entity facts only. It gives his birth as 14 December 1960 in Mashhad and his death as 19 May 2024, and its only religion value is Islam in general (Q432) — it carries no Shia value at all."
  es: "Elemento de Wikidata Q5947347 para Ebrahim Raisi, basado en los pageprops del artículo en inglés; utilizado únicamente para datos de la entidad. Indica que nació el 14 de diciembre de 1960 en Mashhad y falleció el 19 de mayo de 2024, y su único valor religioso es el Islam en general (Q432); no tiene ningún valor chiíta."
  fr: "L'élément Wikidata Q5947347 concernant Ebrahim Raisi, basé sur les propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance le 14 décembre 1960 à Mashhad et son décès le 19 mai 2024. Sa seule information religieuse est l'islam en général (Q432); aucune information sur le chiisme n'est fournie."
  ur: "ویکی ڈیٹا آئٹم Q5947347 ابراہیم رئیسی کے لیے، انگریزی مضمون کے صفحہ کے پراپس کے ذریعے بنیاد پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 14 دسمبر 1960 کو مشہد میں ہوئی اور اس کی موت 19 مئی 2024 کو ہوئی، اور اس کی واحد مذہبی قدر عمومی طور پر اسلام ہے (Q432) - اس کی کوئی شیعہ قدر نہیں ہے۔"
