summary: { en: "The free structured knowledge base of the Wikimedia Foundation (CC0); used for labels, dates, capitals, succession and identifiers, with each dated fact flagged for a second source.", ar: "قاعدة المعرفة المنظّمة الحرة لمؤسسة ويكيميديا ⁦(ترخيص CC0)⁩؛ نأخذ منها الأسماء والتواريخ والعواصم والتسلسل والمعرّفات، وتُعلَّم كل واقعة مؤرَّخة بحاجتها إلى مصدر ثانٍ.", es: "La base de conocimiento estructurada y gratuita de la Fundación Wikimedia (CC0); se utiliza para etiquetas, fechas, capitales, sucesiones e identificadores, y cada dato fechado está marcado con una segunda fuente.", fr: "La base de connaissances structurée et libre de la Fondation Wikimedia (CC0); utilisée pour les étiquettes, les dates, les capitales, la succession et les identifiants, chaque fait daté étant signalé pour une deuxième source.", ur: "وکیمیڈیا فاؤنڈیشن (CC0) کی مفت ساختی علمی بنیاد؛ لیبلز، تاریخوں، کیپٹل، جانشینی اور شناخت کنندگان کے لیے استعمال کیا جاتا ہے، جس میں ہر تاریخ کی حقیقت کو دوسرے ماخذ کے لیے جھنڈا لگایا جاتا ہے۔" }
