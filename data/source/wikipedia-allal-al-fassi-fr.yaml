reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision, resting on Benjamin Stora and Akram Ellyas (1999), Le Monde's obituary of 15 May 1974 and Moroccan press histories. It gives his birth at Fez on 10 January 1910 and his death at Bucharest on 13 May 1974 during an official mission, his father Abd al-Wahid as one of Fez's leading ulama and a Qarawiyyin teacher, his own Qarawiyyin licence of 1932, the founding of the Moroccan Action Committee in 1934 with Mohamed Hassan Ouazzani and Ahmed Balafrej, and the nine years of exile in Gabon."
