reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Used for her birth in Karachi on 11 August 1938 to Parsi Zoroastrian parents, the family's move to Lahore in her infancy, her childhood polio, her Kinnaird College BA of 1957, her two marriages and five children, her teaching at Columbia, Rice and other universities, her Sitara-i-Imtiaz of 1991, her bibliography, and her death in Houston on 25 December 2024 as reported by the Dawn and Guardian obituaries the article cites. On faith, the article records two things about Sidhwa herself rather than her descent alone — her induction into the Zoroastrian Hall of Fame in 2000 and her second husband Noshir described as 'also a Zoroastrian' — and those are used, with the FEZANA memorial, as attestation of her own affiliation."
