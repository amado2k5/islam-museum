reliability_note: "Archive.org copy of the Saudi Aramco World issue read 2026-11-16. The article's account of al-Razi's Kitab al-Asrar — two kerosene-making methods, repetition of distillation until the product is 'safe to light' — is the magazine's own synthesis of the medieval text tradition, not a page-cited reading of the Arabic Kitab al-Asrar itself. Treat the al-Razi material as a secondary summary, not a primary-text quotation."
