title: "The Oil Weapons"
summary:
  ar: "مقال لمؤرخ النفط زاين بلكادي في Saudi Aramco World يصف استخدام المسلمون للنفط سلاحاً وإضاءة، ويذكر كتاب الأسرار للرازي وطرائقه في تقطير النفط إلى الكيروسين أي النفط الأبيض."
  en: "Oil historian Zayn Bilkadi's Saudi Aramco World article describing Muslim use of petroleum as weapon and lamp fuel, naming al-Razi's Kitab al-Asrar and its methods for distilling white naphtha."
  ur: "تیل کے مؤرخ زین بلکادی کا Saudi Aramco World مضمون، جو تیل کے استعمال کو ہتھیار اور چراغ کے ایندھن کے طور پر بیان کرتا ہے؛ اس میں رازی کی کتاب الأسرار اور اس کے سفید نیفتھا (naft abyad) کو کشید کرنے کے طریقوں کا ذکر ہے۔"
  es: "El artículo del historiador petrolero Zayn Bilkadi, publicado en Saudi Aramco World, describe el uso que los musulmanes hacían del petróleo como combustible para armas y lámparas, mencionando el Kitab al-Asrar de al-Razi y sus métodos para destilar nafta blanca."
