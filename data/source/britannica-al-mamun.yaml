  ar: "صفحة «al-Maʼmūn» لدى Encyclopaedia Britannica. لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملخص بحثي قُدّم إلى المتحف ووافق المؤسس على استعماله في 21 نوفمبر 2026. يُستشهد بها في: بيت الحكمة وحركة الترجمة الإغريقية العربية في العصر العباسي."
  en: "The page \"al-Maʼmūn\" (Encyclopaedia Britannica). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum and approved for use by the founder on 21 November 2026. Cited for: the House of Wisdom and the Graeco-Arabic translation movement of the Abbasid age."
