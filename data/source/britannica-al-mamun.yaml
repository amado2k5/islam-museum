  fr: "La page « al-Maʼmūn » (Encyclopaedia Britannica). Le musée ne l'a pas ouverte lui-même : ce qu'on en sait vient d'une synthèse de recherche remise au musée et approuvée pour usage par le fondateur le 21 novembre 2026. Citée pour : la Maison de la sagesse et le mouvement de traduction gréco-arabe de l'époque abbasside."
  es: "La página «al-Maʼmūn» (Encyclopaedia Britannica). El museo no la abrió por sí mismo: lo que se sabe de ella procede de un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026. Citada para: la Casa de la Sabiduría y el movimiento de traducción greco-árabe de la época abasí."
