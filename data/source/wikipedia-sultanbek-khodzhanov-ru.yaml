summary:
  ar: "مقالة ويكيبيديا الروسية عن سلطان بيك خوجانوف ⁦(يرد اسمه في عنوانها بصيغة «كوجانوف»)⁩؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 10 سبتمبر 1894 في قرية أكسومبه، وتعليمه في طشقند، ومشاركته سنة 1917 مع مصطفى شوكاي وآخرين في إقامة حكم تركستان الذاتي، ومنصبيه مفوضا للداخلية (1920) وللتعليم (1921) في تركستان، ودوره في الترسيم الوطني لآسيا الوسطى، واعتقاله في يوليو 1937 وإعدامه في سجن بوتيركا بموسكو في 10 فبراير 1938 وردّ اعتباره سنة 1957. لا يرد فيها أي محتوى ديني."
  en: "Russian Wikipedia article on Sultanbek Khodzhanov (his name is given in its title in the form 'Kozhanov'); used for entity facts only. It gives his birth on 10 September 1894 in the village of Aksumbe, his schooling in Tashkent, his work in 1917 with Mustafa Shokay and others to create the Turkestan Autonomy, his posts as people's commissar of internal affairs (1920) and of education (1921) in Turkestan, his part in the national delimitation of Central Asia, his arrest in July 1937, his execution in Moscow's Butyrka Prison on 10 February 1938 and his rehabilitation in 1957. It contains no religion content."
  es: "Artículo de la Wikipedia rusa sobre Sultanbek Khodzhanov (su nombre aparece en el título como «Kozhanov»); utilizado únicamente para datos sobre la persona. Describe su nacimiento el 10 de septiembre de 1894 en la aldea de Aksumbe, su educación en Tashkent, su trabajo en 1917 con Mustafa Shokay y otros para crear la Autonomía de Turkestán, sus cargos como comisario popular de asuntos internos (1920) y de educación (1921) en Turkestán, su participación en la delimitación nacional de Asia Central, su arresto en julio de 1937, su ejecución en la prisión de Butyrka en Moscú el 10 de febrero de 1938 y su rehabilitación en 1957. No contiene contenido religioso."
  fr: "Article de Wikipédia en russe sur Sultanbek Khodzhanov (son nom est orthographié « Kozhanov » dans le titre); utilisé uniquement pour les informations biographiques. Il relate sa naissance le 10 septembre 1894 dans le village d'Aksumbe, sa scolarité à Tachkent, sa participation en 1917, avec Mustafa Shokay et d'autres, à la création de l'autonomie du Turkestan, ses fonctions de commissaire du peuple aux affaires intérieures (1920) et à l'éducation (1921) au Turkestan, son rôle dans la délimitation nationale de l'Asie centrale, son arrestation en juillet 1937, son exécution à la prison de Boutyrka à Moscou le 10 février 1938 et sa réhabilitation en 1957. Cet article ne contient aucun contenu religieux."
