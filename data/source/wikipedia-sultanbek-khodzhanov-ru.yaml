summary:
  ar: "مقالة ويكيبيديا الروسية عن سلطان بيك خوجانوف (يرد اسمه في عنوانها بصيغة «كوجانوف»)؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 10 سبتمبر 1894 في قرية أكسومبه، وتعليمه في طشقند، ومشاركته سنة 1917 مع مصطفى شوكاي وآخرين في إقامة حكم تركستان الذاتي، ومنصبيه مفوضا للداخلية (1920) وللتعليم (1921) في تركستان، ودوره في الترسيم الوطني لآسيا الوسطى، واعتقاله في يوليو 1937 وإعدامه في سجن بوتيركا بموسكو في 10 فبراير 1938 وردّ اعتباره سنة 1957. لا يرد فيها أي محتوى ديني."
  en: "Russian Wikipedia article on Sultanbek Khodzhanov (his name is given in its title in the form 'Kozhanov'); used for entity facts only. It gives his birth on 10 September 1894 in the village of Aksumbe, his schooling in Tashkent, his work in 1917 with Mustafa Shokay and others to create the Turkestan Autonomy, his posts as people's commissar of internal affairs (1920) and of education (1921) in Turkestan, his part in the national delimitation of Central Asia, his arrest in July 1937, his execution in Moscow's Butyrka Prison on 10 February 1938 and his rehabilitation in 1957. It contains no religion content."
