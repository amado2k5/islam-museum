  en: "The book \"Gulf Arabic\" (Clive Holes). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum by the founder, who approved its use on 21 November 2026. Cited for: specialist reference works on the dialects."
  ur: "کتاب «Gulf Arabic»، Clive Holes۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ بانی کے فراہم کردہ تحقیقی خلاصے سے ہے، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ ان کے لیے دیا گیا: بولیوں پر ماہرانہ مراجع۔"
