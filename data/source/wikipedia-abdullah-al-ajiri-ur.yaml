  ur: "عبداللہ ابن صالح العجیری پر اردو ویکیپیڈیا مضمون؛ عربی مضمون کا ترجمہ، صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1976 میں الخبر میں ان کی پیدائش، تکوین سینٹر کی ان کی ڈائریکٹر شپ اور الحاد پر تنقید کے لیے ان کی شہرت ہے۔"
