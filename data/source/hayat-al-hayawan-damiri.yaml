reliability_note: "The standard reference for animal entries in the classical Islamic world. Al-Damiri gathers weak and popular reports beside the sound; the museum cites the work as the record of the tradition's lore, not as proof of the reports' isnad — entries based on it stay draft-tier and are labelled as tradition, not Prophetic text."
