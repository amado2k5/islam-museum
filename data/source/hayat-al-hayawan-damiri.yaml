summary:
  ar: "موسوعة كمال الدين محمد بن موسى الدميري ⁦(ت 808هـ/1405م)⁩ في الحيوان واللفظ، مرتبة على حروف المعجم، يجمع في كل مادة اللغة والخبر والفقه والمثل: مرجع المتحف لأخبار الحيوان في التراث خارج القرآن والحديث المدوّن."
  en: "Kamal al-Din Muhammad ibn Musa al-Damiri's ⁦(d. 808 AH / 1405 CE)⁩ zoological-lexical encyclopedia, arranged alphabetically, gathering under each animal the lexicon, the reports, the fiqh rulings and the proverbs: the museum's reference for animal lore in the tradition beyond the Qur'an and the written hadith."
  ur: "کمال الدین محمد بن موسیٰ دمیری ⁦(متوفی 808ھ/1405ء)⁩ کی حیوانی و لغوی دائرۃ المعارف، حروف تہجی کی ترتیب پر، ہر جانور کے تحت لغت، اخبار، فقہی احکام اور امثال جمع: قرآن اور مدون حدیث سے باہر روایت میں حیوانات کے اخبار کا مرجع۔"
  es: "La enciclopedia zoológica-léxica de Kamal al-Din Muhammad ibn Musa al-Damiri (fallecido en 808 AH / 1405 CE), ordenada alfabéticamente, reúne bajo cada animal el léxico, los informes, las normas de fiqh y los proverbios: la obra de referencia del museo sobre el saber popular animal en la tradición que va más allá del Corán y los hadices escritos."
  fr: "L'encyclopédie zoologique et lexicale de Kamal al-Din Muhammad ibn Musa al-Damiri (mort en 808 AH / 1405 CE), classée par ordre alphabétique, rassemblant sous chaque animal le lexique, les rapports, les décisions fiqh et les proverbes: la référence du musée pour la connaissance animale dans la tradition au-delà du Coran et des hadiths écrits."
  tr: "Kamaleddin Muhammed bin Musa el-Damiri'nin (ö. 808 Hicri / 1405 M.S.) hayvanlar ve telaffuz üzerine ansiklopedisi, dil, haber, fıkhhi ve atasözleri konularını alfabetik olarak derlerken; müzenin Kur'an dışındaki mirasta hayvan haberleri ve hadisler için referansı."
  id: "Ensiklopedia Kamal al-Din Muhammad ibn Musa al-Damiri (wafat 808 H / 1405 M) tentang hewan dan pengucapan, disusun secara alfabet, mengumpulkan semua topik bahasa, berita, yurisprudensi, dan perisalan: referensi museum untuk berita hewan dalam warisan di luar Al-Qur'an dan hadits yang tercatat."
