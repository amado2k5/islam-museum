summary:
  ar: "موسوعة كمال الدين محمد بن موسى الدميري ⁦(ت 808هـ/1405م)⁩ في الحيوان واللفظ، مرتبة على حروف المعجم، يجمع في كل مادة اللغة والخبر والفقه والمثل: مرجع المتحف لأخبار الحيوان في التراث خارج القرآن والحديث المدوّن."
  en: "Kamal al-Din Muhammad ibn Musa al-Damiri's ⁦(d. 808 AH / 1405 CE)⁩ zoological-lexical encyclopedia, arranged alphabetically, gathering under each animal the lexicon, the reports, the fiqh rulings and the proverbs: the museum's reference for animal lore in the tradition beyond the Qur'an and the written hadith."
  ur: "کمال الدین محمد بن موسیٰ دمیری ⁦(متوفی 808ھ/1405ء)⁩ کی حیوانی و لغوی دائرۃ المعارف، حروف تہجی کی ترتیب پر، ہر جانور کے تحت لغت، اخبار، فقہی احکام اور امثال جمع: قرآن اور مدون حدیث سے باہر روایت میں حیوانات کے اخبار کا مرجع۔"
title: "حياة الحيوان الكبرى"
