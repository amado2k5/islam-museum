summary:
  ar: "مقالة ويكيبيديا التركية «Fatma Aliye Topuz»؛ تُستخدم لوقائع الكيان فقط، وتؤرخ مولدها في 22 أكتوبر 1862 خلافا لبقية المصادر، وتصف دفاعها عن حقوق المرأة من داخل نظرة إسلامية ومعارضتها لتعدد الزوجات."
  en: "Turkish Wikipedia article 'Fatma Aliye Topuz'; used for entity facts only. It dates her birth to 22 October 1862 against the other sources, and describes her defence of women's rights from within an Islamic outlook and her opposition to polygamy."
  es: "Artículo de la Wikipedia en turco titulado «Fatma Aliye Topuz»; utilizado únicamente para datos biográficos. En contra de otras fuentes, fecha su nacimiento el 22 de octubre de 1862 y describe su defensa de los derechos de la mujer desde una perspectiva islámica y su oposición a la poligamia."
  fr: "L'article de Wikipédia en turc intitulé « Fatma Aliye Topuz » (utilisé uniquement à des fins d'information sur la personne) date sa naissance du 22 octobre 1862, contrairement à d'autres sources, et décrit sa défense des droits des femmes dans une perspective islamique ainsi que son opposition à la polygamie."
  ur: "ترکی ویکیپیڈیا مضمون 'فاطمہ علیے توپوز'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پیدائش کی تاریخ 22 اکتوبر 1862 ہے دوسرے ذرائع کے خلاف، اور اس کے اسلامی نقطہ نظر کے اندر سے خواتین کے حقوق کے دفاع اور تعدد ازدواج کی مخالفت کو بیان کرتی ہے۔"
  tr: "Türk Vikipedi makalesi \"Fatma Aliye Topuz\" yalnızca varlığın gerçekleri için kullanılır, doğumunu diğer kaynaklardan farklı olarak 22 Ekim 1862 olarak tarihlendirir ve kadın haklarını İslami bir bakış açısıyla savunmasını ve çok eşliliğe karşı çıkışını anlatır."
  id: "Artikel Wikipedia Turki \"Fatma Aliye Topuz\" hanya digunakan untuk fakta entitas tersebut, mencatat tanggal lahirnya pada 22 Oktober 1862, berbeda dengan sumber lain, dan menggambarkan pembelaannya terhadap hak-hak perempuan dari perspektif Islam serta penentangannya terhadap poligami."
