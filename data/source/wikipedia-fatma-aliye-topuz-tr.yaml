reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Its lead dates her birth to 22 October 1862, against 9 October 1862 in the English and Arabic articles and Wikidata; the person record follows 9 October and records the variant. It adds the framing of her positions: she viewed women's rights within the family, was no radical feminist, defended women's rights without breaking from an Islamic outlook, opposed polygamy and defended a woman's right to divorce, and saw men as the chief obstacle to women's advancement. It dates Hayal ve Hakikat to 1891 and Nisvan-ı İslam to 1892. Read in full on 24 October 2026."
