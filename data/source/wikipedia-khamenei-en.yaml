  ar: "مقالة ويكيبيديا الإنجليزية عن علي خامنئي؛ تُستخدم لوقائع الكيان فقط. تقدّمه سياسيًا إيرانيًا ورجل دين شيعيًا كان المرشد الأعلى لإيران من 1989 حتى اغتياله في 28 شباط 2026، ورئيسًا لإيران 1981–1989، وتعطي ميلاده في مشهد في 19 نيسان 1939 ودراسته في قم على يد روح الله الخميني، ويذكر نصّها أنه لم يكن مرجعًا عند تولّيه القيادة وأن المرجعية سلطة دينية رفيعة في التشيع الاثني عشري، ويعطي صندوقها مذهبه بالاثني عشري."
  en: "English Wikipedia article on Ali Khamenei; used for entity facts only. It presents him as an Iranian politician and Shia cleric who was supreme leader of Iran from 1989 until his assassination on 28 February 2026, and president of Iran from 1981 to 1989; it gives his birth at Mashhad on 19 April 1939 and his studies at Qom in the classes of Ruhollah Khomeini. Its text calls him a Shia cleric and discusses his standing in Twelver Shi'ism's clerical hierarchy; the infobox gives his denomination as Twelver Shi'a."
