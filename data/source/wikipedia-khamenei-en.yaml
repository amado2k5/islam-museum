summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي خامنئي؛ تُستخدم لوقائع الكيان فقط. تقدّمه سياسيًا إيرانيًا ورجل دين شيعيًا كان المرشد الأعلى لإيران من 1989 حتى اغتياله في 28 شباط 2026، ورئيسًا لإيران 1981–1989، وتعطي ميلاده في مشهد في 19 نيسان 1939 ودراسته في قم على يد روح الله الخميني، ويذكر نصّها أنه لم يكن مرجعًا عند تولّيه القيادة وأن المرجعية سلطة دينية رفيعة في التشيع الاثني عشري، ويعطي صندوقها مذهبه بالاثني عشري."
  en: "English Wikipedia article on Ali Khamenei; used for entity facts only. It presents him as an Iranian politician and Shia cleric who was supreme leader of Iran from 1989 until his assassination on 28 February 2026, and president of Iran from 1981 to 1989; it gives his birth at Mashhad on 19 April 1939 and his studies at Qom in the classes of Ruhollah Khomeini. Its text calls him a Shia cleric and discusses his standing in Twelver Shi'ism's clerical hierarchy; the infobox gives his denomination as Twelver Shi'a."
  es: "Artículo de la Wikipedia en inglés sobre Ali Khamenei; utilizado únicamente para datos sobre la persona. Lo presenta como un político iraní y clérigo chiíta que fue líder supremo de Irán desde 1989 hasta su asesinato el 28 de febrero de 2026, y presidente de Irán de 1981 a 1989; indica que nació en Mashhad el 19 de abril de 1939 y que estudió en Qom en las clases de Ruhollah Khomeini. El texto lo describe como un clérigo chiíta y analiza su posición en la jerarquía clerical del chiismo duodecimano; el recuadro informativo indica que pertenece al chiismo duodecimano."
  fr: "Article de Wikipédia en anglais sur Ali Khamenei; utilisé uniquement pour les informations le concernant. Il le présente comme un homme politique iranien et un religieux chiite, guide suprême de l'Iran de 1989 jusqu'à son assassinat le 28 février 2026, et président de l'Iran de 1981 à 1989. Il indique sa naissance à Mashhad le 19 avril 1939 et ses études à Qom auprès de Rouhollah Khomeini. Le texte le qualifie de religieux chiite et aborde sa place dans la hiérarchie du chiisme duodécimain; l'infobox précise son appartenance au chiisme duodécimain."
  ur: "علی خامنہ ای پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں انہیں ایک ایرانی سیاست دان اور شیعہ عالم کے طور پر پیش کیا گیا ہے جو 1989 سے لے کر 28 فروری 2026 کو ان کے قتل تک ایران کے سپریم لیڈر تھے، اور 1981 سے 1989 تک ایران کے صدر؛ یہ 19 اپریل 1939 کو مشہد میں پیدا ہوا اور روح اللہ خمینی کی کلاسوں میں قم میں تعلیم حاصل کی۔ اس کا متن اسے شیعہ عالم کہتا ہے اور بارہویں شیعہ مذہب کے علمی درجہ بندی میں ان کے موقف پر بحث کرتا ہے۔ معلومات خانہ اپنا فرقہ بارہویں شیعہ کے طور پر دیتا ہے۔"
