label:
  ar: "مفتاح الفلاح ومصباح الأرواح لابن عطاء الله السكندري (الطبعة الأولى، مطبعة السعادة، القاهرة 1332هـ)"
  en: "Ibn 'Ata' Allah al-Iskandari, Miftah al-Falah wa-Misbah al-Arwah (first printing, Matba'at al-Sa'ada, Cairo, 1332 AH)"
  ur: "ابن عطاء اللہ سکندری، مفتاح الفلاح و مصباح الارواح (پہلا ایڈیشن، مطبعۃ السعادۃ، قاہرہ 1332ھ)"
summary:
  ar: "الطبعة الأولى من «مفتاح الفلاح ومصباح الأرواح» على نفقة الشيخ مصطفى سيد أحمد تاج وولده إبراهيم تاج الكتبي بطنطا، طبعت بمطبعة السعادة بجوار محافظة مصر وتم طبعها في 15 صفر 1332هـ؛ نسخة ممسوحة من مكتبة الإسكندرية عليها ختم مكتبة علي أفندي الحطاب بالإسكندرية."
  en: "The first printing of Miftah al-Falah wa-Misbah al-Arwah, at the expense of Shaykh Mustafa Sayyid Ahmad Taj and his son Ibrahim Taj, booksellers of Tanta, printed at Matba'at al-Sa'ada beside the Cairo Governorate and completed on 15 Safar 1332 AH; a Bibliotheca Alexandrina scan bearing the stamp of the library of 'Ali Efendi al-Hattab in Alexandria."
  ur: "«مفتاح الفلاح و مصباح الارواح» کا پہلا ایڈیشن، شیخ مصطفیٰ سید احمد تاج اور ان کے بیٹے ابراہیم تاج کتب فروش طنطا کے خرچ پر، مطبعۃ السعادۃ (محافظۂ مصر کے پاس) میں چھپا اور 15 صفر 1332ھ کو مکمل ہوا؛ مکتبہ اسکندریہ کا اسکین جس پر اسکندریہ کے مکتبہ علی آفندی الحطاب کی مہر ہے۔"
