  ar: "مقالة ويكيبيديا العربية عن لانسانا كونتي؛ تُستخدم لوقائع الكيان فقط. تقول نصا في بدايته إنه من جذور سوسو «وهو مسلم الديانة»، وتروي ولادته في موساياه لومبايا التابعة لدوبريكا وخدمته العسكرية وانقلابه سنة 1984 ورئاسته حتى وفاته. وهي بهذا النص الوحيد الذي يشهد بإسلامه الشخصي، ولا تسمّي له مذهبا."
  en: "Arabic Wikipedia article on Lansana Conté; used for entity facts only. Its early-life text states that he was of Susu roots 'and he is of the Muslim religion' (وهو مسلم الديانة), and it recounts his birth at Moussayah Loumbaya in Dubréka, his military service, his 1984 coup and his presidency until his death. It is the one text that attests his personal Muslim identity, and it names no school for him."
