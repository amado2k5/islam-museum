summary:
  ar: "مقالة ويكيبيديا العربية عن لانسانا كونتي؛ تُستخدم لوقائع الكيان فقط. تقول نصا في بدايته إنه من جذور سوسو «وهو مسلم الديانة»، وتروي ولادته في موساياه لومبايا التابعة لدوبريكا وخدمته العسكرية وانقلابه سنة 1984 ورئاسته حتى وفاته. وهي بهذا النص الوحيد الذي يشهد بإسلامه الشخصي، ولا تسمّي له مذهبا."
  en: "Arabic Wikipedia article on Lansana Conté; used for entity facts only. Its early-life text states that he was of Susu roots 'and he is of the Muslim religion' ⁦(وهو مسلم الديانة)⁩, and it recounts his birth at Moussayah Loumbaya in Dubréka, his military service, his 1984 coup and his presidency until his death. It is the one text that attests his personal Muslim identity, and it names no school for him."
  es: "Artículo de Wikipedia en árabe sobre Lansana Conté; utilizado únicamente para datos sobre la persona. En su texto sobre su juventud se afirma que era de origen susu y de religión musulmana ⁦(وهو مسلم الديانة)⁩, y se relata su nacimiento en Moussayah Loumbaya, en Dubréka, su servicio militar, el golpe de Estado de 1984 y su presidencia hasta su muerte. Es el único texto que atestigua su identidad musulmana personal y no menciona ninguna escuela a la que perteneciera."
  fr: "Article Wikipédia en arabe sur Lansana Conté; utilisé uniquement pour les informations le concernant. Le texte relatif à sa jeunesse indique qu'il était d'origine Susu « et de confession musulmane » ⁦(وهو مسلم الديانة)⁩, et relate sa naissance à Moussayah Loumbaya à Dubréka, son service militaire, son coup d'État de 1984 et sa présidence jusqu'à sa mort. C'est le seul texte qui atteste de son identité musulmane personnelle, et il ne mentionne aucune école à son sujet."
  ur: "Lansana Conté پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی ابتدائی زندگی کے متن میں کہا گیا ہے کہ وہ سوسو کی جڑوں سے تھا 'اور وہ مسلم مذہب سے تھا' ⁦(وهو مسلم الدیانة)⁩، اور اس میں ان کی پیدائش، ان کی فوجی خدمات، اس کی 1984 کی بغاوت اور اس کی موت تک اس کی صدارت کا ذکر ہے۔ یہ ایک متن ہے جو اس کی ذاتی مسلم شناخت کی تصدیق کرتا ہے، اور اس میں اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Lansana Conte hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bir metinle başlar; onun Susu kökenli olduğunu ve \"Müslüman olduğunu\" belirtir; Mosaiya Lumbaja'daki doğumunu, Dobrica ile bağlantılı olduğunu, askerlik hizmetini, 1984 darbesini ve ölümüne kadar başkanlığını anlatır. Bu metinle, kişisel İslam'ını doğrulayan tek metindir ve onun adına bir mezhep adı vermez."
  id: "Artikel Wikipedia Arab tentang Lansana Conte; digunakan hanya untuk fakta entitas. Artikel ini dimulai dengan teks yang menyatakan bahwa ia berasal dari akar Susu dan \"seorang Muslim,\" serta menceritakan kelahirannya di Mosaiya Lumbaja, yang berafiliasi dengan Dobrica, dinas militernya, kudeta tahun 1984, dan masa jabatannya hingga kematiannya. Dengan teks ini, ia adalah satu-satunya yang membuktikan Islam pribadinya dan tidak menamai sekte untuknya."
