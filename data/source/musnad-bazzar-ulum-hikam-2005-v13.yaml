  en: "al-Bazzar, al-Bahr al-Zakhkhar known as Musnad al-Bazzar, vol. 13, ed. Adil ibn Sa'd (Maktabat al-Ulum wa-l-Hikam, Medina, 1st ed., 1426/2005)"
  ur: "البزار، البحر الزخار المعروف بمسند البزار، جلد 13، تحقیق عادل بن سعد ⁦(مکتبۃ العلوم والحکم، مدینہ منورہ، طبع اول، 1426ھ/2005ء)⁩"
summary:
  ar: "الجزء الثالث عشر من «البحر الزخار» المعروف بـ«مسند البزار» للحافظ أبي بكر أحمد بن عمرو بن عبد الخالق البزار ⁦(ت 292هـ)⁩، بتحقيق عادل بن سعد، وراجعه وقدّم له الشيخ بدر بن عبد الله البدر، مكتبة العلوم والحكم، المدينة المنورة، الطبعة الأولى 1426هـ/2005م؛ يبدأ ببقية مسند أنس من الحديث 6292."
  en: "Volume 13 of al-Bahr al-Zakhkhar, known as Musnad al-Bazzar, by al-Hafiz Abu Bakr Ahmad ibn Amr ibn Abd al-Khaliq al-Bazzar (d. 292 AH), edited by Adil ibn Sa'd, revised and introduced by Shaykh Badr ibn Abd Allah al-Badr, Maktabat al-Ulum wa-l-Hikam, Medina, 1st ed. 1426/2005; it opens with the rest of the Musnad of Anas from hadith 6292."
  es: "Volumen 13 de al-Bahr al-Zakhkhar, conocido como Musnad al-Bazzar, por al-Hafiz Abu Bakr Ahmad ibn Amr ibn Abd al-Khaliq al-Bazzar (m. 292 AH), editado por Adil ibn Sa'd, revisado e introducido por Shaykh Badr ibn Abd Allah al-Badr, Maktabat al-Ulum wa-l-Hikam, Medina, 1ª ed. 1426/2005; se abre con el resto del Musnad de Anas del hadiz 6292."
  fr: "Volume 13 d'al-Bahr al-Zakhkhar, connu sous le nom de Musnad al-Bazzar, par al-Hafiz Abu Bakr Ahmad ibn Amr ibn Abd al-Khaliq al-Bazzar (mort en 292 AH), édité par Adil ibn Sa'd, révisé et introduit par Shaykh Badr ibn Abd Allah al-Badr, Maktabat al-Ulum wa-l-Hikam, Médine, 1ère éd. 1426/2005; il s'ouvre avec le reste du Musnad d'Anas du hadith 6292."
  ur: "البحر الزخار کی جلد 13 جو کہ مسند البزار کے نام سے مشہور ہے، حافظ ابوبکر احمد بن عمرو بن عبد الخالق البزار ⁦(متوفی 292 ہجری)⁩، جس کی تدوین عادل بن سعد نے کی ہے، شیخ اللہ بدر المکتب الثانی نے ترمیم شدہ اور متعارف کرایا ہے۔ والحکم، مدینہ، 1st ایڈیشن. 1426/2005; یہ حدیث 6292 کی بقیہ مسند انس سے شروع ہوتی ہے۔"
  tr: "\"Al-Bahr al-Zakhar\"ın on üçüncü cildi, hadis Ebu Bekir Ahmed bin Amr ibn Abdul Khaliq al-Bazzar (ö. 292 H.) tarafından yazılan, Adel ibn Sa'd tarafından düzenlenmiş, Şeyh Badr ibn Abdullah al-Badr tarafından gözden geçirilip tanıtılmış, Medine Mektülül-Ulum wal-Hikam, ilk baskı 1426 Hicri / 2005 M.S."
  id: "Jilid ketiga belas \"Al-Bahr al-Zakhar,\" yang dikenal sebagai \"Musnad al-Bazzar,\" oleh hadis Abu Bakr Ahmad ibn Amr ibn Abdul Khaliq al-Bazzar (wafat 292 H), disunting oleh Adel ibn Sa'd, ditinjau dan diperkenalkan oleh Sheikh Badr ibn Abdullah al-Badr, Maktabat al-Ulum wal-Hikam, Madinah, edisi pertama 1426 H / 2005 M; dimulai dengan sisa Musnad Anas dari hadis 6292."
