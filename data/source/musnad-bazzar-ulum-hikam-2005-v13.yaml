summary:
  ar: "الجزء الثالث عشر من «البحر الزخار» المعروف بـ«مسند البزار» للحافظ أبي بكر أحمد بن عمرو بن عبد الخالق البزار ⁦(ت 292هـ)⁩، بتحقيق عادل بن سعد، وراجعه وقدّم له الشيخ بدر بن عبد الله البدر، مكتبة العلوم والحكم، المدينة المنورة، الطبعة الأولى 1426هـ/2005م؛ يبدأ ببقية مسند أنس من الحديث 6292."
  en: "Volume 13 of al-Bahr al-Zakhkhar, known as Musnad al-Bazzar, by al-Hafiz Abu Bakr Ahmad ibn Amr ibn Abd al-Khaliq al-Bazzar (d. 292 AH), edited by Adil ibn Sa'd, revised and introduced by Shaykh Badr ibn Abd Allah al-Badr, Maktabat al-Ulum wa-l-Hikam, Medina, 1st ed. 1426/2005; it opens with the rest of the Musnad of Anas from hadith 6292."
