summary:
  ar: "صفحة موسوعة سعوديبيديا عن التسلسل الزمني لمجمع الملك عبدالعزيز لكسوة الكعبة المشرفة: الأمر بإنشاء دار للكسوة في أجياد سنة 1927، ونقلها إلى جرول سنة 1962، والأمر بإنشاء مصنع في أم الجود سنة 1972 وافتتاحه سنة 1977، وتغيير اسمه إلى اسمه الحالي سنة 2017."
  en: "Saudipedia's timeline of the King Abdulaziz Complex for the Holy Kaaba Kiswa: a facility ordered in the Ajyad district in 1927, relocated to Jarwal in 1962, a factory ordered in Umm al-Jud in 1972 and inaugurated in 1977, renamed to its present name in 2017."
  ur: "سعودی پیڈیا کا صفحہ جو شاہ عبدالعزیز کمپلیکس برائے غلافِ کعبہ کی تاریخ وار ترتیب دیتا ہے: 1927 میں اجیاد میں کارخانے کا حکم، 1962 میں جرول منتقلی، 1972 میں ام الجود میں کارخانے کا حکم اور 1977 میں اس کا افتتاح، اور 2017 میں موجودہ نام۔"
  es: "Cronología de Saudipedia sobre el Complejo Rey Abdulaziz para la Sagrada Kaaba Kiswa: una instalación encargada en el distrito de Ajyad en 1927, reubicada en Jarwal en 1962, una fábrica encargada en Umm al-Jud en 1972 e inaugurada en 1977, y renombrada con su nombre actual en 2017."
  fr: "Chronologie de Saudipedia du complexe du roi Abdulaziz pour la Sainte Kaaba Kiswa: une installation commandée dans le district d’Ajyad en 1927, déplacée à Jarwal en 1962, une usine commandée à Umm al-Jud en 1972 et inaugurée en 1977, renommée sous son nom actuel en 2017."
  tr: "Saudipedia Ansiklopedisi'nin sayfası, Kutsal Kabe'nin Kiswası için Kral Abdulaziz Kompleksi'nin kronolojik sıralaması üzerine sayfa: 1927'de Ajyad'da bir Kiswa evi kurulma emri, 1962'de Jarul'a devri, 1972'de um al-Joud'da fabrika kurma emri, 1977'de açılışı ve 2017'de adının mevcut haline değiştirilmesi."
  id: "Halaman Ensiklopedia Saudipedia tentang urutan kronologis Kompleks Raja Abdulaziz untuk Kiswa Ka'bah Suci: perintah untuk mendirikan rumah Kiswa di Ajyad pada tahun 1927, pemindahannya ke Jarul pada tahun 1962, perintah untuk mendirikan pabrik di um al-Joud pada tahun 1972, pembukaannya pada tahun 1977, dan perubahan nama menjadi yang sekarang pada tahun 2017."
