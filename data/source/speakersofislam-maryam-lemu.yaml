summary:
  ar: "سيرة مريم ليمو في دليل «متحدثو الإسلام»؛ تقول إنها وُلدت في 29 يناير 1973 لأب نيجيري هو الشيخ أحمد ليمو وأم بريطانية هي بريدجت آن عائشة ليمو، ولها أخ أكبر هو نور الدين ليمو، وإنها متحدثة دولية وميسّرة ندوات بخبرة تتجاوز ثلاثة عقود، رئيسة الإدارة وإدارة الموارد في كلية نيو هورايزنز بمينا في نيجيريا ومديرة في شركة بروستارت للاستشارات، ومقدمة البرنامج الحواري «سيسترلي» على قناة أليف وبرامج رمضانية، ولها سلاسل فيديو على يوتيوب ومتابعة واسعة."
  en: "Speakers of Islam's biography of Maryam Lemu. It says she was born on 29 January 1973 to a Nigerian father, Sheikh Ahmed Lemu, and a British mother, Bridget Anne Aisha Lemu, with an older brother Nuruddeen Lemu; that she is an international speaker and seminar facilitator with a career spanning over three decades, Head of Administration and Resource Management at New Horizons College in Minna, Nigeria, and a director of ProStart Consultants; and that she hosts the Islamic talk show Sisterly on Alif TV and Ramadan shows, and produces YouTube video series with a large social-media following."
