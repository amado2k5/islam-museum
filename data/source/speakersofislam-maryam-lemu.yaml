summary:
  ar: "سيرة مريم ليمو في دليل «متحدثو الإسلام»؛ تقول إنها وُلدت في 29 يناير 1973 لأب نيجيري هو الشيخ أحمد ليمو وأم بريطانية هي بريدجت آن عائشة ليمو، ولها أخ أكبر هو نور الدين ليمو، وإنها متحدثة دولية وميسّرة ندوات بخبرة تتجاوز ثلاثة عقود، رئيسة الإدارة وإدارة الموارد في كلية نيو هورايزنز بمينا في نيجيريا ومديرة في شركة بروستارت للاستشارات، ومقدمة البرنامج الحواري «سيسترلي» على قناة أليف وبرامج رمضانية، ولها سلاسل فيديو على يوتيوب ومتابعة واسعة."
  en: "Speakers of Islam's biography of Maryam Lemu. It says she was born on 29 January 1973 to a Nigerian father, Sheikh Ahmed Lemu, and a British mother, Bridget Anne Aisha Lemu, with an older brother Nuruddeen Lemu; that she is an international speaker and seminar facilitator with a career spanning over three decades, Head of Administration and Resource Management at New Horizons College in Minna, Nigeria, and a director of ProStart Consultants; and that she hosts the Islamic talk show Sisterly on Alif TV and Ramadan shows, and produces YouTube video series with a large social-media following."
  es: "La biografía de Maryam Lemu publicada por Speakers of Islam indica que nació el 29 de enero de 1973, hija de un padre nigeriano, el jeque Ahmed Lemu, y una madre británica, Bridget Anne Aisha Lemu, y que tiene un hermano mayor, Nuruddeen Lemu; que es oradora internacional y facilitadora de seminarios con una trayectoria profesional de más de tres décadas, jefa de administración y gestión de recursos en New Horizons College en Minna, Nigeria, y directora de ProStart Consultants; y que presenta el programa de entrevistas islámicas Sisterly en Alif TV y programas especiales de Ramadán, además de producir series de vídeos para YouTube con gran número de seguidores en las redes sociales."
  fr: "La biographie de Maryam Lemu, publiée par Speakers of Islam, indique qu'elle est née le 29 janvier 1973 d'un père nigérian, Sheikh Ahmed Lemu, et d'une mère britannique, Bridget Anne Aisha Lemu. Elle a un frère aîné, Nuruddeen Lemu. Conférencière internationale et animatrice de séminaires, elle compte à son actif une carrière de plus de trente ans. Elle a été directrice administrative et de gestion des ressources au New Horizons College de Minna, au Nigéria, et directrice de ProStart Consultants. Elle anime l'émission de débats islamiques « Sisterly » sur Alif TV et des émissions spéciales Ramadan, et produit des séries de vidéos pour YouTube qui bénéficient d'une large audience sur les réseaux sociaux."
