summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي رضا بناهيان: تصفه في متنها بأنه عالم شيعي إثنا عشري إيراني وحجة إسلام، مولود في طهران سنة 1965، ورئيس «اتاق فکر» المرشد الأعلى في الجامعات، ومن مؤسسي «قرارگاه عمار» في فبراير 2011."
  en: "The English Wikipedia article on Alireza Panahian: its prose describes him as an Iranian Twelver Shia scholar and Hojatoleslam, born in Tehran in 1965, head of the Supreme Leader's think tank for universities, and among the founders of the Ammar Headquarters in February 2011."
  es: "El artículo de la Wikipedia en inglés sobre Alireza Panahian: su prosa lo describe como un erudito chiíta duodecimano iraní y Hojatoleslam, nacido en Teherán en 1965, jefe del grupo de expertos del Líder Supremo para las universidades y uno de los fundadores de la Sede de Ammar en febrero de 2011."
  fr: "L'article de Wikipédia en anglais sur Alireza Panahian: son texte le décrit comme un érudit chiite duodécimain iranien et Hojatoleslam, né à Téhéran en 1965, chef du groupe de réflexion du Guide suprême pour les universités, et parmi les fondateurs du quartier général d'Ammar en février 2011."
  ur: "علیرضا پناہیان پر انگریزی ویکیپیڈیا کا مضمون: اس کی نثر میں اسے ایک ایرانی ٹویلور شیعہ عالم اور حجت الاسلام کے طور پر بیان کیا گیا ہے، جو 1965 میں تہران میں پیدا ہوئے، یونیورسٹیوں کے لیے سپریم لیڈر کے تھنک ٹینک کے سربراہ، اور فروری 2011 میں عمار ہیڈ کوارٹر کے بانیوں میں سے تھے۔"
