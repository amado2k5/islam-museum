summary:
  ar: مقالة ويكيبيديا الإنجليزية عن محمد الطاهر بن عاشور؛ تُستخدم لوقائع الكيان فقط. صندوقها يعطي الانتماء «سني» والفقه «مالكي» (محيلًا إلى نافي 2005، ص12) والعقيدة «أشعري» (ص22)، أما متنها فيعطي مولده في تونس سنة 1879 ووفاته في أوت 1973، وتعليمه وعمله في الزيتونة، ولقب شيخ الإسلام سنة 1932، وتفسيره «التحرير والتنوير» وكتابه «مقاصد الشريعة الإسلامية»، ورفضه فتوى إفطار رمضان التي طلبها بورقيبة. لا يسمّي المتن مذهبًا له.
  en: English Wikipedia article on Muhammad al-Tahir ibn Ashur; used for entity facts only. Its infobox gives denomination 'Sunni', jurisprudence 'Maliki' (citing M. Nafi 2005, p. 12) and creed 'Ash'ari' (p. 22); the body gives his birth in Tunis in 1879 and death in August 1973, his Zaytuna education and career, the Shaykh al-Islam title in 1932, his tafsir al-Tahrir wa'l-Tanwir and Maqasid al-Shari'ah al-Islamiyyah, and his refusal of Bourguiba's requested Ramadan fatwa. The body text names no school for him.
