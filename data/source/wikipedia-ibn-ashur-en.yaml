summary:
  ar: مقالة ويكيبيديا الإنجليزية عن محمد الطاهر بن عاشور؛ تُستخدم لوقائع الكيان فقط. صندوقها يعطي الانتماء «سني» والفقه «مالكي» ⁦(محيلًا إلى نافي 2005، ص12)⁩ والعقيدة «أشعري» ⁦(ص22)⁩، أما متنها فيعطي مولده في تونس سنة 1879 ووفاته في أوت 1973، وتعليمه وعمله في الزيتونة، ولقب شيخ الإسلام سنة 1932، وتفسيره «التحرير والتنوير» وكتابه «مقاصد الشريعة الإسلامية»، ورفضه فتوى إفطار رمضان التي طلبها بورقيبة. لا يسمّي المتن مذهبًا له.
  en: English Wikipedia article on Muhammad al-Tahir ibn Ashur; used for entity facts only. Its infobox gives denomination 'Sunni', jurisprudence 'Maliki' (citing M. Nafi 2005, p. 12) and creed 'Ash'ari' (p. 22); the body gives his birth in Tunis in 1879 and death in August 1973, his Zaytuna education and career, the Shaykh al-Islam title in 1932, his tafsir al-Tahrir wa'l-Tanwir and Maqasid al-Shari'ah al-Islamiyyah, and his refusal of Bourguiba's requested Ramadan fatwa. The body text names no school for him.
  es: "Artículo de la Wikipedia en inglés sobre Muhammad al-Tahir ibn Ashur; utilizado únicamente para datos sobre la persona. Su ficha informativa indica la denominación «Suní», la jurisprudencia «Maliki» (citando a M. Nafi 2005, p. 12) y el credo «Ash'ari» (p. 22); el cuerpo del texto indica su nacimiento en Túnez en 1879 y su muerte en agosto de 1973, su educación y carrera en Zaytuna, el título de Shaykh al-Islam en 1932, su tafsir al-Tahrir wa'l-Tanwir y Maqasid al-Shari'ah al-Islamiyyah, y su negativa a la fatwa de Ramadán solicitada por Bourguiba. El texto principal no menciona ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en anglais sur Muhammad al-Tahir ibn Ashur; utilisé uniquement pour les informations le concernant. Son infobox indique son appartenance à la confession sunnite, son courant juridique malikite (citant M. Nafi 2005, p. 12) et sa croyance ash'arite (p. 22). Le corps du texte mentionne sa naissance à Tunis en 1879 et sa mort en août 1973, ses études et sa carrière à Zaytuna, l'obtention du titre de Cheikh al-Islam en 1932, ses exégèses (tafsir) al-Tahrir wa'l-Tanwir et Maqasid al-Shari'ah al-Islamiyyah, ainsi que son refus de la fatwa du Ramadan demandée par Bourguiba. Le texte ne mentionne aucune école à laquelle il aurait appartenu."
  ur: "محمد الطاہر ابن عاشور پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے معلوماتی خانے میں فرقہ 'سنی'، فقہ 'مالکی' ⁦(حوالہ ایم. نافی 2005، صفحہ 12)⁩ اور مسلک 'اشعری' ⁦(ص 22)⁩ دیا گیا ہے۔ جسم نے 1879 میں تیونس میں اپنی پیدائش اور اگست 1973 میں موت، اس کی زیتونہ تعلیم اور کیریئر، 1932 میں شیخ الاسلام کا خطاب، ان کی تفسیر التحریر والتنویر اور مقاصد الشریعۃ الاسلامیہ، اور ان کی فتویٰ رباعۃ الاسلامیہ سے انکار۔ جسم کے متن میں اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Muhammed el-Tahir ibn Aşur hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kutusunda mensubluk \"Sünni\", fıkıh \"Maliki\" (Nafi 2005, s. 12'ye atıfta bulunarak) ve mezhebi \"Aş'ari\" (s. 22) olarak belirtilmiştir. Metinde, 1879'da Tunus'ta doğduğu, Ağustos 1973'te ölümü, Zeytuna'daki eğitimi ve çalışmaları, 1932'de Şeyh al-Islam unvanı, \"el-Tahrir ve el-Tanwir\" tafsiri, \"Makasid al-Shari'ah al-Islamiyya\" kitabı ve Burguiba'nın talep ettiği Ramazan iftar fetvasını reddettiği yer verilmektedir. Metinde onun düşünce ekoküyle ilgili isimler verilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad al-Tahir ibn Ashur; digunakan hanya untuk fakta entitas. Kotaknya mencantumkan afiliasi sebagai \"Sunni,\" yurisprudensi sebagai \"Maliki\" (merujuk pada Nafi 2005, hlm. 12), dan kredo sebagai \"Ash'ari\" (hlm. 22). Teksnya menceritakan kelahirannya di Tunisia pada tahun 1879, kematiannya pada Agustus 1973, pendidikan dan pekerjaannya di Zaytuna, gelar Sheikh al-Islam pada tahun 1932, tafsirnya \"al-Tahrir wa al-Tanwir,\" bukunya \"Maqasid al-Shari'ah al-Islamiyya,\" dan penolakannya terhadap fatwa iftar Ramadan yang diminta oleh Bourguiba. Teks tersebut tidak menyebutkan aliran pemikirannya."
