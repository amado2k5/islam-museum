reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The only Wikipedia article on him in any language (the fuller title «جمال‌الدین محمد خوانساری» redirects here). Its lead names him Jamal al-Din Muhammad ibn Husayn ibn Muhammad, known as Aqa Jamal, son of Aqa Husayn al-Khwansari, and counts him among the Shia scholars of the twelfth Hijri century — one of the two texts behind the person record's faith settlement. It states plainly that his birth date and birthplace are not recorded and that he was raised in Isfahan, and gives his death as 1122 AH, or by another account 1125 AH, both readings preserved in the person record. Checked 1 November 2026."
