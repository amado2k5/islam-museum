  ar: "صفحة vidIQ لقناة تي في مو على يوتيوب ⁦(@televisimuhammadiyah)⁩؛ سجّلت نحو 415,000 مشترك و39,300,000 مشاهدة ونحو 27,034 مقطعًا في قراءة حُدّثت في 8 نوفمبر 2026، بينما قرأت صفحة القناة نفسها 414,000 مشترك في 2 نوفمبر 2026؛ قُرئت في 15 نوفمبر 2026."
  en: "vidIQ page for the tvMu Channel YouTube channel (@televisimuhammadiyah); about 415,000 subscribers, 39,300,000 views and about 27,034 videos on a reading last updated 8 November 2026 (the channel page itself read 414,000 subscribers as of 2 November 2026), read on 15 November 2026."
  ur: "ٹی وی مو چینل یوٹیوب چینل ⁦(@televisimuhammadiyah)⁩ کا vidIQ صفحہ؛ 8 نومبر 2026ء کو آخری بار اپ ڈیٹ کی گئی خوانی کے مطابق تقریباً 415,000 سبسکرائبر، 39,300,000 آراء اور تقریباً 27,034 ویڈیوز ⁦(خود چینل کا صفحہ 2 نومبر 2026ء کو 414,000 پڑھتا تھا)⁩؛ 15 نومبر 2026ء کو پڑھا گیا۔"
  es: "Página de vidIQ para el canal de YouTube tvMu Channel (@televisimuhammadiyah); aproximadamente 415.000 suscriptores, 39.300.000 visualizaciones y aproximadamente 27.034 vídeos según una lectura actualizada por última vez el 8 de noviembre de 2026 (la página del canal en sí mostraba 414.000 suscriptores al 2 de noviembre de 2026), consultada el 15 de noviembre de 2026."
  fr: "Page vidIQ de la chaîne YouTube tvMu Channel (@televisimuhammadiyah); environ 415 000 abonnés, 39 300 000 vues et environ 27 034 vidéos lors d’une lecture mise à jour le 8 novembre 2026 (la page de la chaîne elle-même indiquait 414 000 abonnés au 2 novembre 2026), consultée le 15 novembre 2026."
  tr: "TV Mo'nun YouTube'daki vidIQ sayfası (@televisimuhammadiyah); 8 Kasım 2026'da yapılan bir okumada yaklaşık 415.000 abone, 39.300.000 izlenme ve yaklaşık 27.034 klip kaydetti; aynı kanalın aynı sayfası ise 2 Kasım 2026'da 414.000 aboneye sahipti; 15 Kasım 2026'da okundu."
