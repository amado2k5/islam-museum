  ar: "مقالة ويكيبيديا الأردية عن محمد سیاد بری؛ تُستخدم لوقائع الكيان فقط. مقالة من سطر واحد تذكر رئاسته الصومال (1969–1991)، وتودعه في تصنيفات منها «صومالی مسلم» و«اسلامی اشتراکیت پسند»، ولا نص فيها عن دينه."
  en: "Urdu Wikipedia article on Siad Barre; used for entity facts only. A one-line stub recording his presidency of Somalia (1969–1991); it files him under Somali Muslims and Islamic socialists. Its text says nothing about his religion."
