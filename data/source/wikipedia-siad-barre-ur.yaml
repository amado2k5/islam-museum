  fr: "Article Wikipédia en ourdou sur Siad Barre; utilisé uniquement pour des informations factuelles. Un court texte relatant sa présidence de la Somalie (1969-1991) le classe parmi les musulmans somaliens et les socialistes islamiques. Le texte ne mentionne pas sa religion."
  ur: "سیاد بیرے پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ صومالیہ (1969–1991) کی ان کی صدارت کو ریکارڈ کرنے والا ایک سطری اسٹب؛ یہ اسے صومالی مسلمانوں اور اسلامی سوشلسٹوں کے تحت فائل کرتا ہے۔ اس کا متن اس کے مذہب کے بارے میں کچھ نہیں کہتا۔"
