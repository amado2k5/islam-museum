summary:
  ar: "مقالة ويكيبيديا العربية عن عيدي أمين؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته العسكرية وانقلاب 1971 وحكمه لأوغندا ومنفاه ووفاته في جدة. تذكر أن أباه اعتنق الإسلام سنة 1910 بعد أن كان كاثوليكيا وغيّر اسمه إلى أمين دادا؛ ولا تسمي مدرسة لعيدي أمين نفسه."
  en: "Arabic Wikipedia article on Idi Amin; used for entity facts only. It recounts his military career, the 1971 coup, his rule of Uganda, his exile and his death at Jeddah. It states that his father converted to Islam in 1910, having been a Roman Catholic, and changed his name to Amin Dada; it names no school for Idi Amin himself."
  es: "Artículo de Wikipedia en árabe sobre Idi Amin; se utiliza únicamente para obtener información sobre la persona. Relata su carrera militar, el golpe de Estado de 1971, su gobierno en Uganda, su exilio y su muerte en Yeda. Indica que su padre se convirtió al islam en 1910, habiendo sido católico, y cambió su nombre a Amin Dada; no menciona ninguna escuela a la que perteneciera Idi Amin."
  fr: "Article de Wikipédia en arabe sur Idi Amin; utilisé uniquement à des fins d'information sur l'individu. Il relate sa carrière militaire, le coup d'État de 1971, son règne en Ouganda, son exil et sa mort à Djeddah. Il indique que son père s'est converti à l'islam en 1910, après avoir été catholique, et a pris le nom d'Amin Dada; aucune école n'est mentionnée pour Idi Amin lui-même."
  ur: "ایدی امین پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے فوجی کیریئر، 1971 کی بغاوت، یوگنڈا کی حکمرانی، ان کی جلاوطنی اور جدہ میں ان کی موت کا ذکر ہے۔ اس میں کہا گیا ہے کہ اس کے والد نے 1910 میں اسلام قبول کیا، رومن کیتھولک تھے، اور اپنا نام بدل کر امین دادا رکھ لیا۔ اس نے خود ایدی امین کے لیے کسی اسکول کا نام نہیں لیا۔"
  tr: "Idi Amin hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Askeri kariyerini, 1971 darbesini, Uganda yönetimini, sürgününü ve Cidde'deki ölümünü anlatır. Babası 1910'da Katolik olduktan sonra İslam'a geçtiği ve adını Amin Dada olarak değiştirdiği belirtilir; okulun adını Idi Amin'in kendisi için verilmez."
  id: "Artikel Wikipedia berbahasa Arab tentang Idi Amin; hanya digunakan untuk fakta entitas. Artikel ini menceritakan karier militernya, kudeta tahun 1971, pemerintahannya di Uganda, pengasingannya, dan kematiannya di Jeddah. Disebutkan bahwa ayahnya memeluk Islam pada tahun 1910 setelah menjadi Katolik dan mengganti namanya menjadi Amin Dada; sekolah tersebut tidak dinamai untuk Idi Amin sendiri."
