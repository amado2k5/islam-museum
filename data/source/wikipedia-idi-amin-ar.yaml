  ar: "مقالة ويكيبيديا العربية عن عيدي أمين؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته العسكرية وانقلاب 1971 وحكمه لأوغندا ومنفاه ووفاته في جدة. تذكر أن أباه اعتنق الإسلام سنة 1910 بعد أن كان كاثوليكيا وغيّر اسمه إلى أمين دادا؛ ولا تسمي مدرسة لعيدي أمين نفسه."
  en: "Arabic Wikipedia article on Idi Amin; used for entity facts only. It recounts his military career, the 1971 coup, his rule of Uganda, his exile and his death at Jeddah. It states that his father converted to Islam in 1910, having been a Roman Catholic, and changed his name to Amin Dada; it names no school for Idi Amin himself."
