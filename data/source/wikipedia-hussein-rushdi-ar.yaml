summary:
  ar: "مقالة ويكيبيديا العربية عن حسين رشدي باشا؛ تذكر وفاته في 14 مارس 1928 ورئاسته للوزارة أربع مرات ومناصبه القضائية والوزارية ولجنة الدستور 1922 ورئاسة مجلس الشيوخ."
  en: "Arabic Wikipedia article on Hussein Rushdi Pasha; used for entity facts only. It states that he died on 14 March 1928, lists his four premierships (1914–1919), his judicial and ministerial posts, his chairing of the 1922 constitution committee and his presidency of the Senate (1926–1928)."
  es: "Artículo en árabe de la Wikipedia sobre Hussein Rushdi Pasha; utilizado únicamente para datos sobre la persona. Indica que falleció el 14 de marzo de 1928, enumera sus cuatro mandatos como primer ministro (1914-1919), sus cargos judiciales y ministeriales, su presidencia del comité constitucional de 1922 y su presidencia del Senado (1926-1928)."
  fr: "Article de Wikipédia en arabe sur Hussein Rushdi Pacha; utilisé uniquement à des fins d’information sur l’entité. Il indique qu’il est décédé le 14 mars 1928, énumère ses quatre mandats de Premier ministre (1914-1919), ses fonctions judiciaires et ministérielles, sa présidence du comité constitutionnel de 1922 et sa présidence du Sénat (1926-1928)."
  ur: "حسین رشدی پاشا پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں کہا گیا ہے کہ ان کا انتقال 14 مارچ 1928 کو ہوا، ان کی چار پریمیئر شپ (1914–1919)، ان کے عدالتی اور وزارتی عہدوں، 1922 کی آئینی کمیٹی کی صدارت اور سینیٹ کی صدارت (1926–1928) کی فہرست درج ہے۔"
