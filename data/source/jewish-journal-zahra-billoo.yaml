summary:
  ar: "تقرير الجويش جورنال ⁦(19 سبتمبر 2019)⁩ عن تصويت مسيرة النساء على إبعاد زهرة بيلو من مجلسها بعد رد فعل على تغريدات لها ساوت فيها إسرائيل بالنازيين وداعش؛ ينقل دفاعها بأنها تعرضت لحملة تشهير معادية للإسلام، وترحيب رابطة مكافحة التشهير بالإبعاد."
  en: "Jewish Journal report (19 September 2019) on the Women's March voting Zahra Billoo off its board after a backlash to tweets of hers that equated Israel to the Nazis and ISIS; it carries her defence that she was the target of an Islamophobic smear campaign, and the Anti-Defamation League's welcome of the removal."
  es: "El Jewish Journal publicó un artículo (19 de septiembre de 2019) sobre la destitución de Zahra Billoo de su junta directiva por parte de la Marcha de las Mujeres tras la polémica suscitada por unos tuits suyos en los que equiparaba a Israel con los nazis y el ISIS; el artículo recoge su defensa, según la cual fue víctima de una campaña de desprestigio islamófoba, y la celebración de la destitución por parte de la Liga Antidifamación."
  fr: "Article du Jewish Journal (19 septembre 2019) sur l'éviction de Zahra Billoo du conseil d'administration de la Marche des femmes suite à la polémique suscitée par des tweets où elle assimilait Israël aux nazis et à l'EI; l'article relate sa défense selon laquelle elle était la cible d'une campagne de diffamation islamophobe, ainsi que la réaction positive de l'Anti-Defamation League à cette éviction."
  ur: "یہودی جریدے کی رپورٹ ⁦(19 ستمبر 2019)⁩ خواتین کے مارچ میں زہرہ بلو کو اس کے بورڈ سے ہٹانے کے بارے میں ان کی ٹویٹس پر ردعمل کے بعد جس میں اسرائیل کو نازیوں اور آئی ایس آئی ایس کے برابر قرار دیا گیا تھا۔ اس میں اس کا دفاع ہے کہ وہ اسلامو فوبک سمیر مہم کا نشانہ تھی، اور اینٹی ڈیفیمیشن لیگ کی جانب سے ہٹائے جانے کا خیرمقدم کیا گیا ہے۔"
  tr: "Jewish Journal (19 Eylül 2019) raporu, İsrail'i Naziler ve IŞİD ile eşdeğerleyen tweetlere tepki olarak Zahra Bello'nun konseyden ihraç edilmesi için yapılan Kadınlar Yürüyüşü oylamasıyla ilgili rapor; savunması, onun İslam karşıtı bir iftira kampanyasına maruz kaldığını ve Anti-Defamation League tarafından ihraç edilmesini memnuniyetle karşıladığını belirtiyor."
  id: "Laporan The Jewish Journal (19 September 2019) tentang pemungutan suara Women's March untuk mengeluarkan Zahra Bello dari dewannya setelah menanggapi tweet yang menyamakan Israel dengan Nazi dan ISIS; pembelaannya menyatakan bahwa dia menjadi sasaran kampanye pencemaran nama baik anti-Islam dan menyambut baik pengusiran oleh Anti-Defamation League."
