reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The article is in large part a devotional biography in the tradition of the disciples' lives of the Shaykh, and its narrative portions are used with that character in mind; its lead, however, independently states the facts on which the record chiefly relies: his real name Ahmad ibn Muhammad ibn Habiballah; born 1853, died 1927; known as Khadim al-Rasul ('Servant of the Messenger') and, to his murids, Serigne Touba; 'one of the prominent figures of Sufi Islam in West Africa through his founding of the Muridiyya tariqa' — an independent attestation of the Sufi affiliation and headship, counted for the record's sufi segment; he founded the city of Touba in 1887 (the French article gives 1888) and persuaded a number of the region's kings to embrace Islam; the colonial authorities arrested and exiled him in 1895 to Gabon for seven years because of his power to mobilise his followers; after his triumphant return he built the Great Mosque of Touba, around which the city grew and where his tomb stands. The article does not name a school of law or theology for him."
