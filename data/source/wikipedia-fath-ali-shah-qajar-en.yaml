reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth on 5 August 1772 at Damghan, his childhood as the hostage Baba Khan at Karim Khan Zand's court in Shiraz, his designation as heir by his uncle Agha Mohammad Khan, his reign as second Qajar shah from 17 June 1797, the two Russo-Persian wars and the treaties of Gulistan and Turkmenchay, and his burial in the Fatima Masumeh Shrine at Qom; its lead gives his death as 24 October 1834 while its later-life text gives 23 October 1834, an internal conflict that is preserved. Of religion it says that the Shia clergy pressed for war in 1804 and that his coinage broke with striking coins in a Shia Imam's name; it names no school for the man himself. Checked 1 November 2026."
