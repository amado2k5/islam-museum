reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it, chiefly Nyambarza's study from the French archives (1969), French officers' contemporary portraits, and Roche's study of his capture and death (1985); its bibliography adds Clark and Phillips's Historical Dictionary of Senegal entry (1994) and Bathily (1970). Read in full on 25 October 2026. The article nowhere names a Sufi order or school for him — a silence the record's faith note relies on — and its narrative of his youth (service under Umar Tall in Futa, a decade in Mecca and Constantinople) differs in detail from the English article's Fisher-based account; the record states both."
