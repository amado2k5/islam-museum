summary:
  ar: "مقالة ويكيبيديا الفرنسية عن الحاج ممدو لامين درامي، العالم المسلم والقائد العسكري الساراكولي الذي حاول بين 1885 و1888 تأسيس دولة سوننكية بين مالي والسنغال؛ تروي ولادته بين 1835 و1840 في غونديورو، وأسره شابا وانضمامه إلى جيش الحاج عمر، ونفيه الديني عشر سنوات إلى مكة والقسطنطينية، وانتفاضته ضد الفرنسيين وهجومه على حصن باكل في أبريل 1886، ووفاته متأثرا بجراحه في 9 ديسمبر 1887 بعد معركة توباكوتا."
  en: "French Wikipedia article on El Hadj Mamadou Lamine Dramé, the Sarakole Muslim scholar and military leader who tried between 1885 and 1888 to found a Soninke state between Mali and Senegal; it recounts his birth between 1835 and 1840 at Goundiourou, his youthful capture, his service in El Hadj Omar's army, his ten-year religious exile to Mecca and Constantinople, his uprising against the French and attack on the fort of Bakel in April 1886, and his death from his wounds on 9 December 1887 after Toubakouta."
