summary:
  ar: "مقالة ويكيبيديا الفرنسية عن الحاج ممدو لامين درامي، العالم المسلم والقائد العسكري الساراكولي الذي حاول بين 1885 و1888 تأسيس دولة سوننكية بين مالي والسنغال؛ تروي ولادته بين 1835 و1840 في غونديورو، وأسره شابا وانضمامه إلى جيش الحاج عمر، ونفيه الديني عشر سنوات إلى مكة والقسطنطينية، وانتفاضته ضد الفرنسيين وهجومه على حصن باكل في أبريل 1886، ووفاته متأثرا بجراحه في 9 ديسمبر 1887 بعد معركة توباكوتا."
  en: "French Wikipedia article on El Hadj Mamadou Lamine Dramé, the Sarakole Muslim scholar and military leader who tried between 1885 and 1888 to found a Soninke state between Mali and Senegal; it recounts his birth between 1835 and 1840 at Goundiourou, his youthful capture, his service in El Hadj Omar's army, his ten-year religious exile to Mecca and Constantinople, his uprising against the French and attack on the fort of Bakel in April 1886, and his death from his wounds on 9 December 1887 after Toubakouta."
  es: "Artículo de la Wikipedia en francés sobre El Hadj Mamadou Lamine Dramé, el erudito musulmán y líder militar de Sarakole que intentó entre 1885 y 1888 fundar un estado Soninke entre Mali y Senegal; relata su nacimiento entre 1835 y 1840 en Goundiourou, su captura en su juventud, su servicio en el ejército de El Hadj Omar, su exilio religioso de diez años a La Meca y Constantinopla, su levantamiento contra los franceses y el ataque al fuerte de Bakel en abril de 1886, y su muerte a causa de sus heridas el 9 de diciembre de 1887 después de Toubakouta."
  fr: "L'article de Wikipédia en français sur El Hadj Mamadou Lamine Dramé, érudit musulman et chef militaire sarakole qui tenta entre 1885 et 1888 de fonder un État soninké entre le Mali et le Sénégal, relate sa naissance entre 1835 et 1840 à Goundiourou, sa capture dans sa jeunesse, son service dans l'armée d'El Hadj Omar, son exil religieux de dix ans à La Mecque et à Constantinople, son soulèvement contre les Français et l'attaque du fort de Bakel en avril 1886, et sa mort des suites de ses blessures le 9 décembre 1887 après Toubakouta."
  ur: "فرانسیسی ویکیپیڈیا کا مضمون الحاج ممداؤ لامین ڈرامے پر، ساراکول مسلم اسکالر اور فوجی رہنما جس نے 1885 اور 1888 کے درمیان مالی اور سینیگال کے درمیان ایک سونینکے ریاست کے قیام کی کوشش کی۔ اس میں 1835 اور 1840 کے درمیان گونڈیورو میں اس کی پیدائش، اس کی جوانی میں گرفتاری، الحاج عمر کی فوج میں اس کی خدمات، مکہ اور قسطنطنیہ میں اس کی دس سالہ مذہبی جلاوطنی، فرانس کے خلاف اس کی بغاوت اور اپریل 1886 میں باکیل کے قلعے پر حملہ، اور 9 دسمبر 1886 کو اس کے زخموں کی تاب نہ لاتے ہوئے اس کی موت کا ذکر ہے۔"
  tr: "1885-1888 yılları arasında Mali ile Senegal arasında bir Sünni devleti kurmaya çalışan Müslüman âlim ve Sarakoli askeri komutanı Hac Mamdou Lamine Dramami hakkında Fransızca Wikipedia makalesi; 1835 ile 1840 yılları arasında Gondiouro'da doğmasını, gençken esir alınmasını, Hac Omar'ın ordusuna katılmasını, on yıl boyunca Mekke ve Konstantinopolis'e dini sürgününü, Fransızlara karşı ayaklanmasını, Nisan 1886'da Bakel Kalesi'ne saldırısını ve 9 Aralık 1887'de Tobacotta Muharebesi sonrası aldığı yaralardan ölümünü anlatır."
  id: "Artikel Wikipedia Prancis tentang Haji Mamdou Lamine Dramami, ulama Muslim dan komandan militer Sarakoli yang berusaha antara tahun 1885 dan 1888 mendirikan negara Sunenik antara Mali dan Senegal; artikel ini menceritakan kelahirannya antara tahun 1835 dan 1840 di Gondiouro, penangkapannya saat masih muda, bergabung dengan tentara Haji Omar, pengasingan agamanya selama sepuluh tahun ke Mekah dan Konstantinopel, pemberontakannya melawan Prancis, serangannya di Benteng Bakel pada April 1886, dan kematiannya akibat luka pada 9 Desember 1887, setelah Pertempuran Tobacotta."
