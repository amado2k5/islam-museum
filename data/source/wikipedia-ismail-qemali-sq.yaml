reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The longest article. Its lead dates him 'Vlorë, 24 janar 1844 – Peruxhia, 26 janar 1919' — the death day (26 January) agrees with the English and Arabic articles against Wikidata's 24 January, while its birth day (24 January) stands against 16 January in the English and Arabic articles and in Wikidata, which the record follows with the conflict noted. It gives rich family detail: his first marriage (1864) to the widow Nasipe Hanëm of Konica, who died after bearing a daughter; his second marriage (1867, at Ruschuk) to Kleoniki, daughter of the Greek nobleman Anton Sourmeli of Edirne, and their ten children, among them Mahmud Bey (1871–1920), Tahir Bey, Et'hem Bey, Xhevdet Bey, Qazim Bey and Qamil Bey; the 1876 Philippopolis investigation commissions and the constitutional commission under Midhat Pasha; his exile at Kütahya, property purchase near Eskişehir, governorship of Bolu (1884) and of Beirut. It states nothing about his school."
