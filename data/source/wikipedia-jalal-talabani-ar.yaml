summary:
  ar: "مقالة ويكيبيديا العربية عن جلال طالباني؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل جلال حسام الدين نور الله نوري الطالباني وولادته في 12 نوفمبر 1933 ووفاته في 3 أكتوبر 2017، وتصنّفه ضمن «مسلمون سنة عراقيون» وهو تصنيف ملفات لا شهادة نصية."
  en: "Arabic Wikipedia article on Jalal Talabani; used for entity facts only. It gives his full name, Jalal Husamuddin Nurallah Nuri al-Talabani, his birth on 12 November 1933 and his death on 3 October 2017. It files him under 'Iraqi Sunni Muslims', a category filing, not a textual attestation."
  es: "Artículo de Wikipedia en árabe sobre Jalal Talabani; se utiliza únicamente para obtener información sobre la persona. Indica su nombre completo, Jalal Husamuddin Nurallah Nuri al-Talabani, su fecha de nacimiento el 12 de noviembre de 1933 y su fallecimiento el 3 de octubre de 2017. Lo clasifica dentro de la categoría de «musulmanes sunitas iraquíes», no como una declaración textual."
  fr: "Article de Wikipédia en arabe sur Jalal Talabani; utilisé uniquement à titre informatif. Il indique son nom complet, Jalal Husamuddin Nurallah Nuri al-Talabani, sa date de naissance (12 novembre 1933) et sa date de décès (3 octobre 2017). Il est classé dans la catégorie « Musulmans sunnites irakiens », une classification par catégorie et non une attestation textuelle."
  ur: "جلال طالبانی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا پورا نام جلال حسام الدین نوراللہ نوری الطالبانی بتایا گیا ہے، ان کی پیدائش 12 نومبر 1933 کو اور ان کی وفات 3 اکتوبر 2017 کو ہوئی۔ یہ اسے 'عراقی سنی مسلمان' کے زمرے میں فائل کرتا ہے، نہ کہ متنی تصدیق۔"
  tr: "Celal Talabani hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Tam adı Celal Hüssam el-Din Nurallah Nuri el-Talabani olarak verilmiştir; 12 Kasım 1933 doğumlu ve 3 Ekim 2017'de vefat etmiş olup, onu 'Iraklı Sünni Müslümanlar' arasında sınıflandırmaktadır; bu da metin belgesi değil, dosya sınıflandırmasıdır."
  id: "Artikel Wikipedia berbahasa Arab tentang Jalal Talabani; digunakan hanya untuk fakta entitas. Artikel tersebut mencantumkan nama lengkapnya Jalal Hussam al-Din Nurallah Nuri al-Talabani, lahir pada 12 November 1933 dan meninggal pada 3 Oktober 2017, serta mengklasifikasikannya di antara 'Muslim Sunni Irak,' yang merupakan klasifikasi berkas, bukan sertifikat teks."
