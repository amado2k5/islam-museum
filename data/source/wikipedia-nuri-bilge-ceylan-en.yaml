reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Covers: birth 26 January 1959 in Bakırköy, Istanbul, to Mehmet Emin and Fatma Ceylan; childhood in Yenice; chemistry at Istanbul Technical University from 1976, then electrical engineering at Boğaziçi University from 1978; photography recognition in the 1980s, the 1989 Kodak competition, military service, and film study at Mimar Sinan University; the short Cocoon (Koza, 1995), the first Turkish short screened at Cannes; the provincial trilogy Kasaba (1997), Clouds of May (1999) and Distant (Uzak, 2002, Cannes Grand Prix and Best Actor); Climates (2006, FIPRESCI); Three Monkeys (2008, Cannes Best Director); Once Upon a Time in Anatolia (2011, Cannes Grand Prix); Winter Sleep (2014, Palme d'Or); The Wild Pear Tree (2018); About Dry Grasses (2023); his style of static shots, long takes and silence; and his marriage to Ebru Ceylan. It states no religion for him personally."
