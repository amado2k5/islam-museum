summary:
  ar: "مقالة ويكيبيديا التركية عن الحافظ والمولدخوان كاني قراجه؛ لوقائع الكيان فقط: مولده في قرية أدالي بكاراتاش من أضنة في 1930، وفقده البصر صغيرًا، وحفظه القرآن في التاسعة، وقدومه إلى إسطنبول في 1950 وأساتذته ⁦(علي أوسكودارلي، سعد الدين قايناق، خليل نوري بويراز، سعد الدين هيبر)⁩، وتسجيلاته، ووفاته في 29 مايو 2004 ودفنه في مقبرة شهداء أدرنه قابي؛ وتستند إلى إن تي في وحرييت ومقالة أكاديمية (2021)."
  en: "Turkish Wikipedia article on the hafiz and mevlid singer Kâni Karaca; entity facts only: birth at Adalı, Karataş, Adana, in 1930, blindness in childhood, memorisation of the Qur'an at nine, his move to Istanbul in 1950 and his teachers (Ali Üsküdarlı, Sadettin Kaynak, Halil Nuri Poyraz, Sadettin Heper), his recordings, and death on 29 May 2004 with burial at the Edirnekapı Martyrs' Cemetery; it cites NTV, Hürriyet and a 2021 academic article."
