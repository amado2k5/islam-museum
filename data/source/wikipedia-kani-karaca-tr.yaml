summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u062a\u0631\u0643\u064a\u0629 \u0639\u0646 \u0627\u0644\u062d\u0627\u0641\u0638 \u0648\u0627\u0644\u0645\u0648\u0644\u062f\u062e\u0648\u0627\u0646 \u0643\u0627\u0646\u064a \u0642\u0631\u0627\u062c\u0647\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u0642\u0631\u064a\u0629 \u0623\u062f\u0627\u0644\u064a \u0628\u0643\u0627\u0631\u0627\u062a\u0627\u0634 \u0645\u0646 \u0623\u0636\u0646\u0629 \u0641\u064a 1930\u060c \u0648\u0641\u0642\u062f\u0647 \u0627\u0644\u0628\u0635\u0631 \u0635\u063a\u064a\u0631\u064b\u0627\u060c \u0648\u062d\u0641\u0638\u0647 \u0627\u0644\u0642\u0631\u0622\u0646 \u0641\u064a \u0627\u0644\u062a\u0627\u0633\u0639\u0629\u060c \u0648\u0642\u062f\u0648\u0645\u0647 \u0625\u0644\u0649 \u0625\u0633\u0637\u0646\u0628\u0648\u0644 \u0641\u064a 1950 \u0648\u0623\u0633\u0627\u062a\u0630\u062a\u0647 (\u0639\u0644\u064a \u0623\u0648\u0633\u0643\u0648\u062f\u0627\u0631\u0644\u064a\u060c \u0633\u0639\u062f \u0627\u0644\u062f\u064a\u0646 \u0642\u0627\u064a\u0646\u0627\u0642\u060c \u062e\u0644\u064a\u0644 \u0646\u0648\u0631\u064a \u0628\u0648\u064a\u0631\u0627\u0632\u060c \u0633\u0639\u062f \u0627\u0644\u062f\u064a\u0646 \u0647\u064a\u0628\u0631)\u060c \u0648\u062a\u0633\u062c\u064a\u0644\u0627\u062a\u0647\u060c \u0648\u0648\u0641\u0627\u062a\u0647 \u0641\u064a 29 \u0645\u0627\u064a\u0648 2004 \u0648\u062f\u0641\u0646\u0647 \u0641\u064a \u0645\u0642\u0628\u0631\u0629 \u0634\u0647\u062f\u0627\u0621 \u0623\u062f\u0631\u0646\u0647 \u0642\u0627\u0628\u064a\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0625\u0646 \u062a\u064a \u0641\u064a \u0648\u062d\u0631\u064a\u064a\u062a \u0648\u0645\u0642\u0627\u0644\u0629 \u0623\u0643\u0627\u062f\u064a\u0645\u064a\u0629 (2021)."
  en: "Turkish Wikipedia article on the hafiz and mevlid singer K\u00e2ni Karaca; entity facts only: birth at Adal\u0131, Karata\u015f, Adana, in 1930, blindness in childhood, memorisation of the Qur'an at nine, his move to Istanbul in 1950 and his teachers (Ali \u00dcsk\u00fcdarl\u0131, Sadettin Kaynak, Halil Nuri Poyraz, Sadettin Heper), his recordings, and death on 29 May 2004 with burial at the Edirnekap\u0131 Martyrs' Cemetery; it cites NTV, H\u00fcrriyet and a 2021 academic article."
