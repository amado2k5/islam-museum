reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A long article. It gives her birth on 23 March 1614 — against 2 April 1614 in the Arabic and Urdu articles and Wikidata, a rivalry preserved in the person record — and her death on 16 September 1681, her charge of the imperial seal and the title Padshah Begum after Mumtaz Mahal's death in 1631, her partisanship for Dara Shikoh in the war of succession, her care of Shah Jahan in the Agra Fort until 1666, her reconciliation with Aurangzeb, and her burial in the Nizamuddin Dargah complex in Delhi. Its Sufism section is one of the two attestations the person record's faith settlement rests on — it states that Mullah Shah Badakhshi initiated her into the Qadiriyya Sufi order in 1641, that he would have named her his successor in the order had its rules allowed, and that her own Risala-i Sahibiyya describes her initiation by him; it also records her biography of Muinuddin Chishti, the Munis al-Arwah, and her pilgrimage to Ajmer. Checked 1 November 2026."
