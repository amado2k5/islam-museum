reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It follows the English article's frame and adds: her 1994 acquittal in the special-courts misuse-of-authority cases; her 1995 donation of $300,000 to Harvard Law School's Islamic studies centre; the 1989 Liberal International Prize; her second election by the National Assembly dated 20 October 1993, by 121 votes to 72 (the English article dates her swearing-in to 19 October; both are recorded); the 18 October 2007 Karachi bombings at more than 125 killed, against the English article's 149; and, on her death, the early and party reports of shots to the neck, chest and head set against the government's official account that she died when her head struck the armoured car's sunroof lever in the blast. It names no sect or school for her."
