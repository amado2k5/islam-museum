  fr: "La page « DecoType foundry collection » (MyFonts), citée dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisée pour : la typographie arabe et le bloc arabe d'Unicode."
  es: "La página «DecoType foundry collection» (MyFonts), citada en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el archivo sin volver a verificar. Usada para: la tipografía árabe y el bloque árabe de Unicode."
