  ar: "الصفحة «DecoType foundry collection» في MyFonts؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: الحروف الطباعية والطباعة العربية وكتلة يونيكود العربية."
