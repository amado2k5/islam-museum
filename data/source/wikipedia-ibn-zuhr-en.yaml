reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision ('Avenzoar' redirects to it). It gives his birth at Seville in 1094 to the Banu Zuhr family of physicians, his study of medicine with his father Abu al-Ala Zuhr (d. 1131), his service to the Almoravids, imprisonment at Marrakesh in 1140, return under the Almohads and death at Seville in 1162, and his works — al-Taysir, al-Iqtisad, al-Aghdhiya — with his experimental tracheotomy on a goat and his descriptions of cancers and pericarditis. Its birth year conflicts with the Arabic article's 465 AH/1072; the conflict is preserved in the record."
