reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: full name Adama ɓii Ardo Hassana; 'Modibbo' means 'learned man'; a Fulani scholar of the Yillaga (Yirlaɓe) clan whose father Modibbo Hassana, an Ardo (clan leader), educated him to age eleven; studies under Shehu Muhammad Tahir in Baghirmi and for about a decade under Mallam Kiari at Birnin Ngazargamo, capital of Bornu; in 1809 he led the Fombina clans' delegation to Sokoto, where Usman dan Fodio gave him the jihad flag, appointed him Lamido Fombina ('Lord of the South') and charged him with propagating Islam, distributing flags to the Ardo'en and watching for the signs of the Mahdi's coming — a March 1809 Yola manuscript is quoted for the appointment; his campaigns against the Bata, Lala and Mandara (the taking and loss of Dulo); the move of his capital to Yola by 1841 and the three-tier administration under him as emir al-Mu'minin answerable only to Sokoto; more than forty appointed lamibe; his four wives and the Yasebo affair, including the article's own caution that the tradition excluding her descendants was likely a rumour fabricated in the 1847 succession crisis; his asceticism — a week without eating, supporting himself by making and selling ropes — and Clapperton's description of him as the most modestly dressed emir at Bello's court; died 1847 at Yola, his tomb surviving, succeeded by his son Muhammadu Lawal; the emirate at his death covered some 103,000 km² with about 1,500,000 people. CONFLICTS inside the article: its lead dates him 1786–1847 while its early-life section says 'born in 1779 in Wuro Chekke' — the record follows 1786 (lead, French and Arabic articles, Wikidata) and records 1779 here and in the record. The article names no school of law or theology for him and no Sufi affiliation."
