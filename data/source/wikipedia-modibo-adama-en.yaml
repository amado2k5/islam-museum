  en: "English Wikipedia article on Modibbo Adama (1786–1847); used for entity facts only. It details his studies in Baghirmi and Birnin Ngazargamo, his receipt of the jihad flag from Usman dan Fodio in 1809, his founding of the Fombina (Adamawa) emirate, and his death at Yola in 1847."
