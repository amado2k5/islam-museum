label:
  ar: القدس بين اليهودية والإسلام — محمد عمارة
  en: Jerusalem between Judaism and Islam — Muhammad Imara
summary:
  ar: "كتاب الدكتور محمد عمارة، ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، في 188 صفحة: دراسة وتقديم ترد على وثيقة لرابطة الدفاع اليهودية في إسلامية القدس، وتتضمن في ملحقها تقرير لجنة حائط المبكى الدولية التي شكلتها عصبة الأمم سنة 1930م؛ إشراف الأمين العام للمجمع."
  en: "Muhammad Imara's book in the Scientific Series of the Islamic Research Academy of al-Azhar, 188 pages: a study that answers a document of the Jewish Defense League on the Islamic character of Jerusalem, with an annex reproducing the 1930 report of the League of Nations commission on the Wailing Wall; supervised by the Academy's Secretary-General."
  es: "Libro de Muhammad Imara en la Serie Científica de la Academia de Investigación Islámica de al-Azhar, 188 páginas: un estudio que responde a un documento de la Liga de Defensa Judía sobre el carácter islámico de Jerusalén, con un anexo que reproduce el informe de 1930 de la comisión de la Sociedad de Naciones sobre el Muro de las Lamentaciones; supervisado por el Secretario General de la Academia."
  fr: "Ouvrage de Muhammad Imara dans la série scientifique de l'Académie de recherche islamique d'al-Azhar, 188 pages: une étude qui répond à un document de la Ligue de défense juive sur le caractère islamique de Jérusalem, avec une annexe reproduisant le rapport de 1930 de la commission de la Société des Nations sur le Mur des Lamentations; supervisé par le secrétaire général de l'Académie."
  ur: "اسلامک ریسرچ اکیڈمی آف الازہر کی سائنسی سیریز میں محمد امارہ کی کتاب، 188 صفحات: ایک مطالعہ جو یروشلم کے اسلامی کردار پر یہودی دفاعی لیگ کی ایک دستاویز کا جواب دیتا ہے، جس میں ایک ضمیمہ ہے جس میں لیگ آف نیشن کمیشن کی 1930 کی رپورٹ کو دوبارہ پیش کیا گیا ہے۔ اکیڈمی کے سیکرٹری جنرل کی زیر نگرانی۔"
  tr: "Dr. Muhammed Amara'nın, El-Ezher Şerif İslami Araştırma Akademisi'nin bilimsel serisi içinde yer alan 188 sayfalık kitabı: Kudüs'ün İslami Statüsünde Yahudi Savunma Birliği'nin belgesine yanıt veren bir çalışma ve giriş; ekinde 1930'da Milletler Cemiyeti tarafından kurulan ve Akademi Genel Sekreteri tarafından denetlenen Uluslararası Yas Duvarı Komitesi'nin raporu yer almaktadır."
  id: "Buku Dr. Muhammad Amara, dalam seri ilmiah Akademi Riset Islam di Al-Azhar Al-Sharif, dalam 188 halaman: Studi dan pengantar menanggapi dokumen Liga Pertahanan Yahudi dalam Status Islam Yerusalem, yang dalam lampirannya memuat laporan Komite Tembok Berkabung Internasional yang dibentuk oleh Liga Bangsa-Bangsa pada tahun 1930, diawasi oleh Sekretaris Jenderal Akademi."
