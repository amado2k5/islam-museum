  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد آغا أوغلي؛ تعطي ميلاده في ديسمبر 1869 في شوشة ووفاته في 19 مايو 1939 في إسطنبول، وتفصّل تعليمه في باريس وصحافته في باكو وحزب «دفاعي» ونفيه إلى مالطا وكماليته الليبرالية وصلاة جنازته في جامع تشويقية."
  en: "English Wikipedia article on Ahmet Ağaoğlu; used for entity facts only. It gives his birth in December 1869 at Shusha and his death on 19 May 1939 at Istanbul, and details his Paris education, his Baku journalism, the Difai party, his Malta exile, his liberal Kemalism, and his funeral prayer at the Teşvikiye Mosque."
