summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد آغا أوغلي؛ تعطي ميلاده في ديسمبر 1869 في شوشة ووفاته في 19 مايو 1939 في إسطنبول، وتفصّل تعليمه في باريس وصحافته في باكو وحزب «دفاعي» ونفيه إلى مالطا وكماليته الليبرالية وصلاة جنازته في جامع تشويقية."
  en: "English Wikipedia article on Ahmet Ağaoğlu; used for entity facts only. It gives his birth in December 1869 at Shusha and his death on 19 May 1939 at Istanbul, and details his Paris education, his Baku journalism, the Difai party, his Malta exile, his liberal Kemalism, and his funeral prayer at the Teşvikiye Mosque."
  es: "Artículo de la Wikipedia en inglés sobre Ahmet Ağaoğlu; utilizado únicamente para datos biográficos. Indica su nacimiento en diciembre de 1869 en Shusha y su fallecimiento el 19 de mayo de 1939 en Estambul, y detalla su educación en París, su labor periodística en Bakú, el partido Difai, su exilio en Malta, su ideología liberal kemalista y su oración fúnebre en la mezquita Teşvikiye."
  fr: "L'article de Wikipédia en anglais consacré à Ahmet Ağaoğlu, utilisé uniquement pour les informations le concernant, indique sa naissance en décembre 1869 à Choucha et sa mort le 19 mai 1939 à Istanbul. Il détaille également ses études à Paris, son expérience de journaliste à Bakou, son appartenance au parti Difai, son exil à Malte, son kémalisme libéral et ses funérailles à la mosquée Teşvikiye."
  ur: "احمد Ağaoğlu پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں دسمبر 1869 میں شوشا میں ان کی پیدائش اور 19 مئی 1939 کو استنبول میں ان کی موت ہوئی، اور اس کی پیرس کی تعلیم، اس کی باکو کی صحافت، ڈیفائی پارٹی، اس کی مالٹا جلاوطنی، اس کی لبرل کمالیت، اور تیویکیہ مسجد میں اس کی نماز جنازہ کی تفصیلات بیان کی گئی ہیں۔"
  tr: "Ahmet Aga Oğlu hakkında İngilizce Wikipedia makalesi, Aralık 1869'da Şuşa'da doğduğunu ve 19 Mayıs 1939'da İstanbul'da vefatını anlatır; Paris'teki eğitimini, Bakü'deki gazeteciliğini, 'Defend' partisini, Malta'ya sürgününü, liberal lüksünü ve Tzviqiya Camii'ndeki cenaze namazını detaylandırır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ahmet Aga Oğlu menceritakan kelahirannya pada Desember 1869 di Shusha dan kematiannya pada 19 Mei 1939 di Istanbul, yang merinci pendidikannya di Paris, jurnalistiknya di Baku, partai 'Defend', pengasingannya ke Malta, kemewahan liberalnya, dan doa pemakamannya di Masjid Tzviqiya."
