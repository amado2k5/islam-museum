summary:
  ar: "مقالة ويكيبيديا العربية عن الحسين بن طلال؛ تُستخدم لوقائع الكيان فقط. توافق الإنجليزية في الولادة (14 نوفمبر 1935 في عمّان) والاعتلاء (11 أغسطس 1952 بعد عزل طلال لمرضه، مع مجلس وصاية حتى بلوغه) والوفاة (7 فبراير 1999)، وتصفه بأنه ثالث ملوك المملكة الأردنية الهاشمية. لا يرد في صندوق معلوماتها ولا في متنها حقل للدين، وتصنيفاتها تصفه بالمسلم السنّي الأردني تصنيفًا."
  en: "Arabic Wikipedia article on Hussein bin Talal; used for entity facts only. It agrees with the English article on his birth (14 November 1935 in Amman), his accession (11 August 1952 after Talal's removal for illness, with a regency council until his majority) and his death (7 February 1999), and calls him the third king of the Hashemite Kingdom of Jordan. Neither its infobox nor its text carries a religion field; its categories file him as a Jordanian Sunni Muslim — a filing, which never attests."
