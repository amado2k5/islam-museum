summary:
  ar: "المجلد السادس من طبعة دار ابن حزم لـ«المحلى»، بإشراف خالد الرباط ومشاركة باحثين، يضم تتمة كتاب الزكاة (زكاة الحلي والديون وزكاة الفطر ومصارف الزكاة) وكتاب الصيام وأول كتاب الحج، مع تعليقات المحققين وتخريجاتهم وفهرس المسائل؛ فيه مسائل الهلال يرى نهاراً والصوم في السفر."
  en: "Volume 6 of the Dar Ibn Hazm edition of al-Muhalla, supervised by Khalid al-Rabbat with a team of researchers, holding the end of the Book of Zakat (jewellery, debts, the alms of the fast-breaking and the recipients of zakat), the Book of Fasting and the beginning of the Book of Pilgrimage, with the editors' notes, references and an index of questions."
  ur: "دار ابن حزم کے ایڈیشن «المحلی» کی جلد ششم، خالد الرباط کی نگرانی میں محققین کی شرکت سے، جس میں کتاب الزکاۃ کا آخری حصہ (زیورات، قرض، صدقۂ فطر اور مصارفِ زکاۃ)، کتاب الصیام اور کتاب الحج کا آغاز ہیں، محققین کے حواشی، تخریجات اور مسائل کی فہرست کے ساتھ۔"
title: "المحلى بالآثار في شرح المجلى بالاختصار (المجلد السادس)"
