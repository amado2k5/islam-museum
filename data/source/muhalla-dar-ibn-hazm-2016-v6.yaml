label:
  ar: "ابن حزم، المحلى بالآثار، المجلد السادس ⁦(دار ابن حزم، بيروت، ط1، 1437هـ/2016م)⁩"
  en: "Ibn Hazm, al-Muhalla bi-l-Athar, vol. 6 (Dar Ibn Hazm, Beirut, 1st ed., 1437/2016)"
  ur: "ابن حزم، المحلی بالآثار، جلد ششم ⁦(دار ابن حزم، بیروت، طبع اول، 1437ھ/2016ء)⁩"
summary:
  ar: "المجلد السادس من طبعة دار ابن حزم لـ«المحلى»، بإشراف خالد الرباط ومشاركة باحثين، يضم تتمة كتاب الزكاة ⁦(زكاة الحلي والديون وزكاة الفطر ومصارف الزكاة)⁩ وكتاب الصيام وأول كتاب الحج، مع تعليقات المحققين وتخريجاتهم وفهرس المسائل؛ فيه مسائل الهلال يرى نهاراً والصوم في السفر."
  en: "Volume 6 of the Dar Ibn Hazm edition of al-Muhalla, supervised by Khalid al-Rabbat with a team of researchers, holding the end of the Book of Zakat (jewellery, debts, the alms of the fast-breaking and the recipients of zakat), the Book of Fasting and the beginning of the Book of Pilgrimage, with the editors' notes, references and an index of questions."
  ur: "دار ابن حزم کے ایڈیشن «المحلی» کی جلد ششم، خالد الرباط کی نگرانی میں محققین کی شرکت سے، جس میں کتاب الزکاۃ کا آخری حصہ ⁦(زیورات، قرض، صدقۂ فطر اور مصارفِ زکاۃ)⁩، کتاب الصیام اور کتاب الحج کا آغاز ہیں، محققین کے حواشی، تخریجات اور مسائل کی فہرست کے ساتھ۔"
  es: "Volumen 6 de la edición Dar Ibn Hazm de al-Muhalla, supervisada por Khalid al-Rabbat con un equipo de investigadores, que contiene el final del Libro del Zakat (joyas, deudas, la limosna de quienes rompen el ayuno y los receptores del zakat), el Libro del Ayuno y el comienzo del Libro de la Peregrinación, con notas de los editores, referencias y un índice de preguntas."
  fr: "Volume 6 de l'édition Dar Ibn Hazm d'al-Muhalla, supervisée par Khalid al-Rabbat avec une équipe de chercheurs, contenant la fin du Livre de la Zakat (bijoux, dettes, aumônes de ceux qui rompent le jeûne et bénéficiaires de la zakat), le Livre du jeûne et le début du Livre du pèlerinage, avec les notes des éditeurs, des références et un index des questions."
  tr: "\"El-Muhalla\"nın Dar İbn Hazm baskısının altıncı cildi, Khaled Al-Rabet'in denetiminde ve araştırmacıların katılımıyla Zekat Kitabı'nın (Mücevher, Borçlar, Zekat al-Fitr ve Zekat Harcamaları üzerine zekat), Oruç Kitabı'nın devamını, Hac Kitabı'nın başlangıcını, editörlerin notlarını ve referanslarını ve bir konu dizini içerir; gündüz görülen hilal ve yolculuk sırasında oruçla ilgili konuları içerir."
  id: "Jilid Enam edisi Dar Ibn Hazm \"Al-Muhalla,\" yang diawasi oleh Khaled Al-Rabat dan dengan partisipasi para peneliti, memuat kelanjutan Kitab Zakat (Zakat tentang Perhiasan, Utang, Zakat al-Fitr, dan Pengeluaran Zakat), Kitab Puasa, dan awal Kitab Haji, beserta anotasi dan referensi para editor serta indeks isu; buku ini mencakup isu-isu terkait bulan sabit yang terlihat pada siang hari dan puasa saat perjalanan."
title: "المحلى بالآثار في شرح المجلى بالاختصار ⁦(المجلد السادس)⁩"
