summary:
  ar: "عنصر ويكيداتا Q57331 لقابوس بن سعيد آل سعيد: ولادته في 18 نوفمبر 1940 في صلالة ووفاته في 10 يناير 2020 في سيب، ووالده سعيد بن تيمور (Q879869) ووالدته مزون بنت أحمد. وقيمة الدين (P140) هي الإسلام (Q432) فقط، دون فرع أو مدرسة، فلا تؤيد القيمةُ البنيوية قراءةَ الإباضية."
  en: "Wikidata item Q57331 for Qaboos bin Said Al Said: born 18 November 1940 at Salalah, died 10 January 2020 at Seeb, father Said bin Taimur (Q879869), mother Mazoon bint Ahmad. The religion (P140) value is Islam (Q432) only, with no branch or school, so the structured data does not corroborate the Ibadi reading."
  es: "Entrada de Wikidata Q57331 para Qaboos bin Said Al Said: nacido el 18 de noviembre de 1940 en Salalah, fallecido el 10 de enero de 2020 en Seeb, padre Said bin Taimur (Q879869), madre Mazoon bint Ahmad. El valor de religión (P140) es solo Islam (Q432), sin rama o escuela, por lo que los datos estructurados no corroboran la lectura ibadí."
  fr: "L'élément Wikidata Q57331 concerne Qaboos bin Said Al Said: né le 18 novembre 1940 à Salalah, décédé le 10 janvier 2020 à Seeb, fils de Said bin Taimur (Q879869) et de Mazoon bint Ahmad. La valeur relative à la religion (P140) indique uniquement l'islam (Q432), sans mention de branche ou d'école; les données structurées ne confirment donc pas l'appartenance à l'ibadisme."
  ur: "قابوس بن سعید السید کے لیے وکی ڈیٹا آئٹم Q57331: 18 نومبر 1940 کو صلالہ میں پیدا ہوا، 10 جنوری 2020 کو سیب میں انتقال ہوا، والد سعید بن تیمور (Q879869)، والدہ مازون بنت احمد۔ مذہب (P140) کی قدر صرف اسلام (Q432) ہے، جس کی کوئی شاخ یا اسکول نہیں ہے، اس لیے منظم ڈیٹا عبادی پڑھنے کی تصدیق نہیں کرتا ہے۔"
