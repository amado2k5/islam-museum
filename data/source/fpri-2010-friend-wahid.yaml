summary:
  ar: "مقالة ثيودور فريند التأبينية عن عبد الرحمن وحيد (منشورات معهد بحوث السياسة الخارجية الأمريكي، يناير 2010)؛ يُستشهد بها لتوصيفها تصوّف وحيد الشخصي. يصفه فريند بأنه «حكيم صوفي ومتصوّف»، ويكتب أن حياته ومسيرته «تحمل أدلة وفيرة لمن أراد فهم التصوف الحديث»."
  en: "Theodore Friend's obituary essay on Abdurrahman Wahid (FPRI E-Notes, January 2010); cited for its characterisation of Wahid's own Sufism. Friend reconstructs an Indonesian aphorism around him — 'Santri pursuing order in office, Sufi sage and mystic out of office' — and writes that his life and career 'contain abundant clues for anyone who would understand modern Sufism'."
title: "Abdurrahman Wahid, the Indonesian Republic, and Dynamics in Islam"
