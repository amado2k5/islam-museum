reliability_note: "Obituary assessment by Theodore Friend, a historian of Indonesia, read in full on 31 October 2026 as republished by the Australia/Israel & Jewish Affairs Council in the Australia/Israel Review under the title 'Wahid's Way'. Independent of the Jakarta Post reportage and of the Wikipedia literature. It is characterisation rather than reportage — its 'Sufi sage and mystic' is the author's judgement of the man — so the record's faith note pairs it with the contemporary practice report before the value is settled."
