label: { en: "FPRI E-Notes: Theodore Friend, 'Abdurrahman Wahid, the Indonesian Republic, and Dynamics in Islam' (Jan 2010)" }
summary:
  ar: "مقالة ثيودور فريند التأبينية عن عبد الرحمن وحيد ⁦(منشورات معهد بحوث السياسة الخارجية الأمريكي، يناير 2010)⁩؛ يُستشهد بها لتوصيفها تصوّف وحيد الشخصي. يصفه فريند بأنه «حكيم صوفي ومتصوّف»، ويكتب أن حياته ومسيرته «تحمل أدلة وفيرة لمن أراد فهم التصوف الحديث»."
  en: "Theodore Friend's obituary essay on Abdurrahman Wahid (FPRI E-Notes, January 2010); cited for its characterisation of Wahid's own Sufism. Friend reconstructs an Indonesian aphorism around him — 'Santri pursuing order in office, Sufi sage and mystic out of office' — and writes that his life and career 'contain abundant clues for anyone who would understand modern Sufism'."
  es: "El ensayo necrológico de Theodore Friend sobre Abdurrahman Wahid (FPRI E-Notes, enero de 2010) se cita por su caracterización del sufismo de Wahid. Friend reconstruye un aforismo indonesio en torno a él: «Santri que busca el orden en el cargo, sabio y místico sufí fuera del cargo», y escribe que su vida y su carrera «contienen abundantes claves para cualquiera que desee comprender el sufismo moderno»."
  fr: "L'essai nécrologique de Theodore Friend sur Abdurrahman Wahid (FPRI E-Notes, janvier 2010) est cité pour sa caractérisation du soufisme de Wahid. Friend y reconstitue un aphorisme indonésien à son sujet: « Santri poursuivant l'ordre dans ses fonctions, sage soufi et mystique hors de ses fonctions », et écrit que sa vie et sa carrière « regorgent d'indices pour quiconque souhaite comprendre le soufisme moderne »."
  ur: "تھیوڈور فرینڈ کا عبدالرحمٰن واحد پر مقالہ ⁦(ایف پی آر آئی ای نوٹس، جنوری 2010)⁩؛ واحد کے اپنے تصوف کی خصوصیت کے لیے حوالہ دیا گیا۔ دوست اپنے اردگرد ایک انڈونیشین افورزم کی تشکیل نو کرتا ہے - 'سنتری دفتر میں آرڈر کی پیروی کر رہا ہے، صوفی بابا اور دفتر سے باہر صوفیانہ' - اور لکھتا ہے کہ اس کی زندگی اور کیرئیر میں 'ہر کسی کے لیے بہت سارے اشارے موجود ہیں جو جدید تصوف کو سمجھے گا'۔"
  tr: "Theodore Friend'in Abdul Rahman Wahid üzerine yazdığı övgü makalesi (Amerikan Dış Politika Araştırmaları Enstitüsü Yayınları, Ocak 2010); Wahid'in kişisel mistisizmini tanımlamak için bu makaleyi alıntılıyor. Onu 'bir Sufi bilgesi ve mistik' olarak tanımlıyor ve hayatının ve kariyerinin 'modern Sufizmi anlamak isteyen herkes için bolca kanıt taşıdığını' yazıyor."
  id: "Artikel pidato perpisahan Theodore Friend tentang Abdul Rahman Wahid (Publications of the Institute for American Foreign Policy Research, Januari 2010); ia mengutip artikel tersebut untuk menggambarkan mistisisme pribadi Wahid. Ia menggambarkannya sebagai 'resi dan mistik Sufi,' menulis bahwa kehidupan dan kariernya 'membawa bukti melimpah bagi siapa pun yang ingin memahami Sufisme modern.'"
title: "Abdurrahman Wahid, the Indonesian Republic, and Dynamics in Islam"
