summary:
  ar: "مقالة ويكيبيديا العربية عن مهاتير محمد، مراجعة 5 أكتوبر 2026؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها ميلاده في ألور ستار في 10 يوليو 1925 وديانتها «الإسلام» دون مدرسة، ووفاة زوجته حازمة محمد علي في 28 سبتمبر 2026، وجائزة الملك فيصل لخدمة الإسلام سنة 1997."
  en: "Arabic Wikipedia article on Mahathir Mohamad, revision of 5 October 2026; used for entity facts only. Its infobox gives his birth at Alor Setar on 10 July 1925 and his religion as Islam with no school, the death of his wife Hasmah Mohamad Ali on 28 September 2026, and the 1997 King Faisal Prize for Service to Islam."
  es: "Artículo de Wikipedia en árabe sobre Mahathir Mohamad, revisado el 5 de octubre de 2026; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació en Alor Setar el 10 de julio de 1925 y profesaba el islam sin seguir ninguna escuela, que su esposa, Hasmah Mohamad Ali, falleció el 28 de septiembre de 2026 y que recibió el Premio Rey Faisal de 1997 por sus servicios al islam."
  fr: "Article de Wikipédia en arabe sur Mahathir Mohamad, mis à jour le 5 octobre 2026; utilisé uniquement pour les informations sur l’entité. Son infobox indique sa naissance à Alor Setar le 10 juillet 1925, sa religion (l’islam sans école religieuse), le décès de son épouse Hasmah Mohamad Ali le 28 septembre 2026 et l’obtention du prix du roi Faisal pour services rendus à l’islam en 1997."
  ur: "مہاتیر محمد پر عربی ویکیپیڈیا مضمون، 5 اکتوبر 2026 کی نظر ثانی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی خانہ 10 جولائی 1925 کو الور سیٹار میں اس کی پیدائش اور اس کا مذہب اسلام کے طور پر بغیر اسکول کے، 28 ستمبر 2026 کو ان کی اہلیہ حسمہ محمد علی کی موت، اور 1997 کو اسلام کی خدمت کے لیے شاہ فیصل انعام دیتا ہے۔"
  tr: "Mahathir Mohamad hakkında Arapça Wikipedia makalesi, 5 Ekim 2026 revizyonu; yalnızca varlık bilgileri için kullanılmıştır. Bilgi kutusunda, 10 Temmuz 1925'te Alor Star'da doğduğu an, okulsuz dini \"İslam\", 28 Eylül 2026'da eşi Hazma Muhammad Ali'nin ölümü ve 1997'de İslam'a Hizmet Kral Faysal Ödülü bahsedilmektedir."
  id: "Artikel Wikipedia Arab tentang Mahathir Mohamad, revisi 5 Oktober 2026; hanya digunakan untuk fakta entitas. Infobox menyebutkan kelahirannya di Alor Star pada 10 Juli 1925, agamanya \"Islam\" tanpa sekolah, kematian istrinya Hazma Muhammad Ali pada 28 September 2026, dan Penghargaan King Faisal untuk Pengabdian kepada Islam pada tahun 1997."
