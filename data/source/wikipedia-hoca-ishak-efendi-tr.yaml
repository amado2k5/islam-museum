reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The longest article on him. It heads him (ö. 1836), gives his birth in 1774 at Arta, his years as a student (1806–1815) and mathematics teacher at the Mühendishane, his dragomanship, his başhoca years 1830–1836 and his textbook translations. It records the scholarly dispute over his origin — a Jew's son who converted on most accounts, against Fuat Köprülü's and Bursalı Mehmed Tahir's objection that he was a Turk, some sources making him a Muslim of Karlova — and the rival hypothesis identifying him with Sultanzade İshak Bey, born in 1748; both disputes are preserved in the person record. Checked 1 November 2026."
