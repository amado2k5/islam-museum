  ar: "مقالة ويكيبيديا الفارسية عن أحمد باشا البرسوي (1426–1496)؛ تجعل مولده في أدرنة ووفاته سنة 1496، وتذكر تولّيه قضاء أدرنة ثم قاضي عسكر، ومعلّميته لمحمد الفاتح، وسجنه ثم قصيدته «كرم» التي نجا بها، ودفنه في مسجد المرادية ببرسا."
  en: "Persian Wikipedia article on Ahmed Pasha of Bursa (1426–1496); it makes Edirne his birthplace and 1496 his death year, and records his judgeship of Edirne, his kazasker post, his tutorship of Mehmed the Conqueror, his imprisonment and the 'Kerem' qasida that saved him, and his burial at the Muradiye Mosque in Bursa."
