label:
  en: "Ahmed Pasha of Bursa — Persian Wikipedia"
summary:
  ar: "مقالة ويكيبيديا الفارسية عن أحمد باشا البرسوي (1426–1496)؛ تجعل مولده في أدرنة ووفاته سنة 1496، وتذكر تولّيه قضاء أدرنة ثم قاضي عسكر، ومعلّميته لمحمد الفاتح، وسجنه ثم قصيدته «كرم» التي نجا بها، ودفنه في مسجد المرادية ببرسا."
  en: "Persian Wikipedia article on Ahmed Pasha of Bursa (1426–1496); it makes Edirne his birthplace and 1496 his death year, and records his judgeship of Edirne, his kazasker post, his tutorship of Mehmed the Conqueror, his imprisonment and the 'Kerem' qasida that saved him, and his burial at the Muradiye Mosque in Bursa."
  es: "Artículo de la Wikipedia en persa sobre Ahmed Pasha de Bursa (1426-1496); indica que Edirne fue su lugar de nacimiento y 1496 el año de su muerte, y registra su cargo como juez de Edirne, su puesto como kazasker, su tutela de Mehmed el Conquistador, su encarcelamiento y la qasida 'Kerem' que lo salvó, y su entierro en la mezquita Muradiye en Bursa."
  fr: "L'article persan de Wikipédia sur Ahmed Pacha de Bursa (1426-1496); il indique Edirne comme son lieu de naissance et 1496 comme son année de décès, et relate son poste de juge d'Edirne, son poste de kazasker, son tutorat de Mehmed le Conquérant, son emprisonnement et la qasida 'Kerem' qui le sauva, et son enterrement à la mosquée Muradiye de Bursa."
  ur: "برسا کے احمد پاشا پر فارسی ویکیپیڈیا مضمون (1426-1496)؛ یہ ایڈرن کو اس کی جائے پیدائش اور 1496 کو اس کی موت کا سال بناتا ہے، اور ایڈرن کے بارے میں اس کی جج شپ، اس کا قازق عہدہ، اس کی مہمد فاتح کی تربیت، اس کی قید اور 'کریم' قصیدہ جس نے اسے بچایا، اور برسا کی مرادیہ مسجد میں اس کی تدفین کو ریکارڈ کیا ہے۔"
  tr: "Ahmad Paşa el-Barsui (1426–1496) hakkında Farsça Vikipedi makalesi, onun Edirne'de doğduğunu ve 1496'da öldüğünü belirtir, Edirne yargıcı olarak atanmasını, ardından askeri yargıç olarak atanmasını, Muhammed Fatih'e öğretmenlik yapmasını, hapsedilmesini ve hayatta kaldığı 'Kerem' şiirini ve Bursa'daki El-Muradiya Camii'nde defnedilmesini belirtir."
  id: "Artikel Wikipedia Persia tentang Ahmad Pasha al-Barsui (1426–1496) menyatakan bahwa ia lahir di Edirne dan meninggal pada tahun 1496, menyebutkan pengangkatannya sebagai hakim Edirne yang saat itu menjadi hakim militer, bimbingan kepada Muhammad Sang Penakluk, penahanannya, dan kemudian puisinya 'Karam' yang ia selamatkan, serta pemakamannya di Masjid Al-Muradiya di Bursa."
