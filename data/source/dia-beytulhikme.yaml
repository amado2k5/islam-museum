reliability_note: "Read in the museum's session on 20 November 2026. It says it is disputed who first founded it and when; that al-Mansur set aside a place in his palace as a library for translated works, called Khizanat al-Hikma, which was the core of the Bayt al-Hikma; that al-Ma'mun made it a full institution after 830; and that this centre, which for more than five hundred years was a source for the Islamic world of learning, was burned and destroyed by Hulagu in 1258. Used for the statements it makes, each attributed to it; the museum does not treat them as settled where the article itself speaks of reports."
