summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نديم مكارم، المولود في 4 تموز 1984 في سنغافورة، مؤسس غوجيك ووزير التعليم والثقافة والبحث والتكنولوجيا الإندونيسي (2021–2024)؛ تذكر دراسته في جامعة براون وهارفارد ومسيرته التجارية واعتقاله سنة 2025 وإدانته بالفساد في 30 حزيران 2026 بحكم عشر سنوات نفاه عنه وأعلن استئنافه."
  en: "English Wikipedia article on Nadiem Makarim, born 4 July 1984 in Singapore, founder of Gojek and Indonesia's minister of education, culture, research and technology (2021-2024); it records his studies at Brown and Harvard, his business career, his 2025 arrest, and his 30 June 2026 corruption conviction and ten-year sentence, which he denied and said he would appeal."
  es: "Artículo de la Wikipedia en inglés sobre Nadiem Makarim, nacido el 4 de julio de 1984 en Singapur, fundador de Gojek y ministro de educación, cultura, investigación y tecnología de Indonesia (2021-2024); en él se recogen sus estudios en Brown y Harvard, su trayectoria empresarial, su detención en 2025 y su condena por corrupción del 30 de junio de 2026 y sentencia de diez años, que él negó y anunció que apelaría."
  fr: "L'article de Wikipédia en anglais sur Nadiem Makarim, né le 4 juillet 1984 à Singapour, fondateur de Gojek et ministre indonésien de l'Éducation, de la Culture, de la Recherche et de la Technologie (2021-2024); il relate ses études à Brown et à Harvard, sa carrière dans les affaires, son arrestation en 2025 et sa condamnation pour corruption le 30 juin 2026 à une peine de dix ans, qu'il a niée et pour laquelle il a déclaré qu'il ferait appel."
  ur: "ندیم مکارم پر انگریزی ویکیپیڈیا کا مضمون، 4 جولائی 1984 کو سنگاپور میں پیدا ہوا، گوجیک کے بانی اور انڈونیشیا کے وزیر تعلیم، ثقافت، تحقیق اور ٹیکنالوجی (2021-2024)؛ اس میں براؤن اور ہارورڈ میں ان کی تعلیم، اس کے کاروباری کیریئر، اس کی 2025 کی گرفتاری، اور اس کی 30 جون 2026 کی بدعنوانی کی سزا اور دس سال کی سزا کو ریکارڈ کیا گیا ہے، جس سے اس نے انکار کیا اور کہا کہ وہ اپیل کریں گے۔"
  tr: "4 Temmuz 1984'te Singapur'da doğan, Gojik'in kurucusu ve Endonezya Eğitim, Kültür, Araştırma ve Teknoloji Bakanı (2021–2024) Nadim Makarem hakkında İngilizce Wikipedia makalesi; Brown ve Harvard Üniversitesi'ndeki eğitimi, iş hayatı, 2025'teki tutuklanması ve 30 Haziran 2026'da yolsuzluktan mahkumiyeti hakkında yer alıyor; on yıllık sürgünün ardından itirazını açıkladı."
  id: "Artikel Wikipedia bahasa Inggris tentang Nadim Makarem, lahir 4 Juli 1984 di Singapura, pendiri Gojik dan Menteri Pendidikan, Kebudayaan, Riset, dan Teknologi Indonesia (2021–2024); artikel ini menyebutkan studinya di Brown dan Universitas Harvard, karier bisnisnya, penangkapannya pada 2025, dan vonisnya atas korupsi pada 30 Juni 2026, setelah pengasingan selama sepuluh tahun yang membuatnya mengumumkan bandingnya."
