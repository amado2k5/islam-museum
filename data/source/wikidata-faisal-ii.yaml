summary:
  ar: "عنصر ويكي بيانات Q149724 لفيصل الثاني، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته في 2 مايو 1935 ووفاته في 14 يوليو 1958 ومكانَي الولادة والوفاة بغداد، وقيمة دين هي الإسلام عمومًا فحسب، وأباه غازي (Q314784)."
  en: "Wikidata item Q149724 for Faisal II, grounded through the English article's pageprops; used for entity facts only. It gives his birth on 2 May 1935, his death on 14 July 1958, Baghdad as both birth and death place, a religion value of Islam in general only, and his father as Ghazi (Q314784)."
  es: "El elemento de Wikidata Q149724 para Faisal II, basado en los pageprops del artículo en inglés, se utiliza únicamente para datos de la entidad. Indica que nació el 2 de mayo de 1935, falleció el 14 de julio de 1958, que Bagdad fue su lugar de nacimiento y de fallecimiento, menciona la religión del Islam en general y que su padre era Ghazi (Q314784)."
  fr: "L'élément Wikidata Q149724 concernant Faisal II, basé sur les propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance le 2 mai 1935, son décès le 14 juillet 1958, Bagdad comme lieu de naissance et de décès, l'islam comme religion et le nom de son père, Ghazi (Q314784)."
  ur: "وکی ڈیٹا آئٹم Q149724 فیصل II کے لیے، انگریزی مضمون کے صفحہ پراپس کے ذریعے بنیاد پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 2 مئی 1935 کو ان کی پیدائش، 14 جولائی 1958 کو ان کی موت، بغداد پیدائش اور موت دونوں جگہ، عام طور پر صرف اسلام کی ایک مذہبی قدر، اور ان کے والد غازی (Q314784) کے طور پر بتاتا ہے۔"
  tr: "Faisal II için bir Wikidata öğesi Q149724, İngilizce makale sayfası properties üzerinden düzeltilmiştir; yalnızca varlığın gerçekleri için kullanılır. Doğumunu 2 Mayıs 1935'te, ölümünü 14 Temmuz 1958'de vermektedir; doğum ve ölüm yerleri Bağdat olarak belirtilmiştir, bir dinin değeri genel olarak İslam'dır ve babası Ghazi (Q314784)."
  id: "Item Wikidata Q149724 untuk Faisal II, diperbaiki melalui properti halaman artikel berbahasa Inggris; digunakan hanya untuk fakta entitas. Ia melahirkan pada 2 Mei 1935, dan wafat pada 14 Juli 1958, dengan tempat lahir dan wafatnya di Baghdad, dan nilai sebuah agama adalah Islam secara umum, dan ayahnya adalah Ghazi (Q314784)."
