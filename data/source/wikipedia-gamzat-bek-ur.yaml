  ar: "مقالة ويكيبيديا الأردية القصيرة عن حمزة بيگ؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه كان تابعا لسلسلة صوفية، وتعطي سنتي 1789–1834 وكونه الإمام الثاني للإمامة القوقازية خلفا لغازي محمد؛ وهي بذرة قصيرة تستند في مراجعها إلى كتاب شابي قازييف «الإمام شامل»، فلا يُعتمد وصفها الصوفي حيث تعارضه المقالة الإنجليزية المسندة."
  en: "Short Urdu Wikipedia stub on Hamzat Bek; used for entity facts only. It describes him as a follower of a Sufi order (silsila), gives the years 1789–1834 and his position as second Imam of the Caucasian Imamate after Ghazi Muhammad; it is a brief stub citing Shapi Kaziev's book Imam Shamil, so its Sufi description is not followed where the sourced English article contradicts it."
