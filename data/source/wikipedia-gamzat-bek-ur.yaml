summary:
  ar: "مقالة ويكيبيديا الأردية القصيرة عن حمزة بيگ؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه كان تابعا لسلسلة صوفية، وتعطي سنتي 1789–1834 وكونه الإمام الثاني للإمامة القوقازية خلفا لغازي محمد؛ وهي بذرة قصيرة تستند في مراجعها إلى كتاب شابي قازييف «الإمام شامل»، فلا يُعتمد وصفها الصوفي حيث تعارضه المقالة الإنجليزية المسندة."
  en: "Short Urdu Wikipedia stub on Hamzat Bek; used for entity facts only. It describes him as a follower of a Sufi order (silsila), gives the years 1789–1834 and his position as second Imam of the Caucasian Imamate after Ghazi Muhammad; it is a brief stub citing Shapi Kaziev's book Imam Shamil, so its Sufi description is not followed where the sourced English article contradicts it."
  es: "Breve reseña en urdu de Wikipedia sobre Hamzat Bek; se utiliza únicamente para datos sobre la persona. Lo describe como seguidor de una orden sufí (silsila), indica los años 1789-1834 y su posición como segundo imán del Imamato del Cáucaso después de Ghazi Muhammad; se trata de una breve reseña que cita el libro Imam Shamil de Shapi Kaziev, por lo que no se sigue su descripción sufí cuando el artículo en inglés citado la contradice."
  fr: "Brève ébauche de page Wikipédia en ourdou sur Hamzat Bek; utilisée uniquement pour fournir des informations factuelles. Elle le décrit comme un adepte d'un ordre soufi (silsila), indique les années 1789-1834 et sa fonction de deuxième imam de l'imamat caucasien après Ghazi Muhammad; il s'agit d'une brève ébauche citant l'ouvrage de Shapi Kaziev, Imam Shamil; par conséquent, la description soufie n'est pas retenue lorsque l'article anglais source la contredit."
  ur: "حمزت بیک پر مختصر اردو ویکیپیڈیا اسٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے صوفی حکم ⁦(سلسلہ)⁩ کے پیروکار کے طور پر بیان کیا گیا ہے، 1789-1834 کے سال اور غازی محمد کے بعد کاکیشین امامت کے دوسرے امام کے طور پر ان کا مقام بیان کیا گیا ہے۔ یہ شاپی کازیف کی کتاب امام شمل کا حوالہ دیتے ہوئے ایک مختصر سٹب ہے، لہذا اس کی صوفی وضاحت کی پیروی نہیں کی جاتی ہے جہاں ماخذ انگریزی مضمون اس سے متصادم ہے۔"
  tr: "Hamza Beg hakkında kısa Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Makalede onu bir Sufi tarikatına mensup olarak tanımlar ve 1789–1834 yılları arasında Kafkas İmamı'nın Ghazi Muhammed'den sonra ikinci imamı olduğu belirtilir; bu kısa bir taslaktır; bu kısa bir taslaktır ve referansları Shabi Qaziev'in \"İmam Shamil\" adlı kitabına dayanır, bu nedenle Sufiizm tanımına dayanılmaz, çünkü İngilizce makale buna karşı çıkar."
  id: "Artikel singkat Wikipedia dalam bahasa Urdu tentang Hamza Beg; hanya digunakan untuk fakta-fakta entitas tersebut. Artikel ini menggambarkan dia sebagai anggota tarekat Sufi, dengan tahun 1789–1834 sebagai Imam kedua dari Imamaat Kaukasus yang menggantikan Ghazi Muhammad; ini adalah artikel singkat yang didasarkan pada referensi dari buku Shabi Qaziev \"Imam Shamil,\" sehingga deskripsi Sufi tidak dipercaya, karena artikel berbahasa Inggris bertentangan."
