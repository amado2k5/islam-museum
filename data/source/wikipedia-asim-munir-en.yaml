  ar: "مقالة ويكيبيديا الإنجليزية عن سيد عاصم منير أحمد شاه ⁦(وُلد سنة 1968 في راولبندي)⁩، رئيس أركان الجيش الباكستاني منذ 2022 وأول رئيس لقوات الدفاع منذ كانون الأول 2025 والمشير الميداني منذ أيار 2025؛ تذكر حفظه القرآن أثناء خدمته في السعودية وتعليمه الديني المبكر في المدرسة المركزية دار التجويد وترؤسه الاستخبارات العسكرية وجهاز الاستخبارات (2018–2019)."
  en: "English Wikipedia article on Syed Asim Munir Ahmed Shah (born 1968 in Rawalpindi), Pakistan's chief of army staff since 2022, its first chief of defence forces since December 2025 and a field marshal since May 2025; it records his memorisation of the Quran during a posting in Saudi Arabia, his early religious education at the Markazi Madrasah Dar-ul-Tajweed, and his headship of Military Intelligence and the ISI (2018-2019)."
