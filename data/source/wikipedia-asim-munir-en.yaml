summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد عاصم منير أحمد شاه ⁦(وُلد سنة 1968 في راولبندي)⁩، رئيس أركان الجيش الباكستاني منذ 2022 وأول رئيس لقوات الدفاع منذ كانون الأول 2025 والمشير الميداني منذ أيار 2025؛ تذكر حفظه القرآن أثناء خدمته في السعودية وتعليمه الديني المبكر في المدرسة المركزية دار التجويد وترؤسه الاستخبارات العسكرية وجهاز الاستخبارات (2018–2019)."
  en: "English Wikipedia article on Syed Asim Munir Ahmed Shah (born 1968 in Rawalpindi), Pakistan's chief of army staff since 2022, its first chief of defence forces since December 2025 and a field marshal since May 2025; it records his memorisation of the Quran during a posting in Saudi Arabia, his early religious education at the Markazi Madrasah Dar-ul-Tajweed, and his headship of Military Intelligence and the ISI (2018-2019)."
  es: "Artículo de la Wikipedia en inglés sobre Syed Asim Munir Ahmed Shah (nacido en 1968 en Rawalpindi), jefe del Estado Mayor del Ejército de Pakistán desde 2022, su primer jefe de las fuerzas de defensa desde diciembre de 2025 y mariscal de campo desde mayo de 2025; en él se recoge su memorización del Corán durante un destino en Arabia Saudita, su educación religiosa temprana en la madrasa Markazi Dar-ul-Tajweed y su dirección de la Inteligencia Militar y del ISI (2018-2019)."
  fr: "L'article de Wikipédia en anglais sur Syed Asim Munir Ahmed Shah (né en 1968 à Rawalpindi), chef d'état-major de l'armée pakistanaise depuis 2022, premier chef des forces de défense depuis décembre 2025 et maréchal depuis mai 2025, relate sa mémorisation du Coran lors d'une affectation en Arabie saoudite, son éducation religieuse initiale à la madrasa Markazi Dar-ul-Tajweed et sa direction du renseignement militaire et de l'ISI (2018-2019)."
  ur: "سید عاصم منیر احمد شاہ ⁦(پیدائش 1968 راولپنڈی میں)⁩، 2022 سے پاکستان کے چیف آف آرمی اسٹاف، دسمبر 2025 کے بعد اس کے پہلے چیف آف ڈیفنس فورسز اور مئی 2025 سے فیلڈ مارشل پر انگریزی ویکیپیڈیا کا مضمون؛ اس میں سعودی عرب میں پوسٹنگ کے دوران ان کا قرآن حفظ، مرکزی مدرسہ دار التجوید میں ان کی ابتدائی دینی تعلیم، اور ملٹری انٹیلی جنس اور ISI کی سربراہی (2018-2019) کو ریکارڈ کیا گیا ہے۔"
