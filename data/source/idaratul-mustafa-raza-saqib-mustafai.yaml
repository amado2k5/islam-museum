summary:
  ar: "بيان سيرة في موقع إدارة المصطفى الدولية، المنظمة التي أسسها رضا ثاقب مصطفائي؛ يُستخدم لوقائع حياته الأساسية التي يذكرها نصّا، ومنها نيله خلافة الطريقة النقشبندية سنة 1994."
  en: "Biographical press release on the website of Idara-tul-Mustafa International, the organisation Raza Saqib Mustafai founded; used for the life facts it states in prose, among them his receiving the spiritual caliphate of the Naqshbandi order in 1994."
  es: "Nota de prensa biográfica en el sitio web de Idara-tul-Mustafa International, la organización fundada por Raza Saqib Mustafai; se utiliza para los hechos de su vida que se exponen en prosa, entre ellos su recepción del califato espiritual de la orden Naqshbandi en 1994."
  fr: "Communiqué de presse biographique sur le site web d'Idara-tul-Mustafa International, l'organisation fondée par Raza Saqib Mustafai; utilisé pour les faits de sa vie qu'il relate en prose, parmi lesquels sa réception du califat spirituel de l'ordre Naqshbandi en 1994."
  ur: "ادارۃ المصطفٰی انٹرنیشنل کی ویب سائٹ پر سوانحی پریس ریلیز، رضا ثاقب مصطفائی نے قائم کردہ تنظیم؛ نثر میں بیان کردہ زندگی کے حقائق کے لیے استعمال کیا جاتا ہے، ان میں سے 1994 میں نقشبندی حکم کی روحانی خلافت حاصل کرنا۔"
  tr: "Biyografi bildirisi, Reda Thaqib Mustafai tarafından kurulan Mustafa Uluslararası İdaresi'nin web sitesinde yer almaktadır; metinde bahsedilen hayatının başlıca olayları için kullanılmıştır; bunlar arasında 1994'te Nakşibendi tarikatının halefliğini kazanması da yer almaktadır."
  id: "Pernyataan biografi di situs web Mustafa International Administration, organisasi yang didirikan oleh Reda Thaqib Mustafai; digunakan untuk peristiwa utama dalam hidupnya yang disebutkan dalam teks, termasuk pencapaiannya sebagai suksesi ordo Naqshbandi pada tahun 1994."
