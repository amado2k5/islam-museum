summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد السادس؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 21 أغسطس 1963 في الرباط، وجلوسه على العرش في 23 يوليو 1999 خلفا لوالده الحسن الثاني، ودراسته القانون في جامعة محمد الخامس ودكتوراه جامعة نيس سنة 1993، وإصلاحاته ومنها مدونة الأسرة."
  en: "English Wikipedia article on Mohammed VI of Morocco; used for entity facts only. It gives his birth on 21 August 1963 at Rabat, his accession on 23 July 1999 succeeding his father Hassan II, his law studies at Mohammed V University and his 1993 Nice doctorate, and his reforms including the family code."
  es: "Artículo de la Wikipedia en inglés sobre Mohammed VI de Marruecos; utilizado únicamente para datos sobre la persona. En él se menciona su nacimiento el 21 de agosto de 1963 en Rabat, su ascenso al trono el 23 de julio de 1999 sucediendo a su padre Hassan II, sus estudios de derecho en la Universidad Mohammed V y su doctorado en Niza en 1993, así como sus reformas, incluido el código de familia."
  fr: "Article de Wikipédia en anglais sur Mohammed VI du Maroc; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 21 août 1963 à Rabat, son accession au trône le 23 juillet 1999, succédant à son père Hassan II, ses études de droit à l’université Mohammed V et son doctorat de Nice obtenu en 1993, ainsi que ses réformes, notamment le code de la famille."
  ur: "مراکش کے محمد ششم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 21 اگست 1963 کو رباط میں ان کی پیدائش، 23 جولائی 1999 کو اپنے والد حسن ثانی کے بعد الحاق، محمد وی یونیورسٹی میں قانون کی تعلیم اور 1993 میں ڈاکٹریٹ کی ڈگری، اور اس کی اصلاحات بشمول خاندانی ضابطہ۔"
  tr: "Muhammed VI hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 21 Ağustos 1963'te Rabat'ta doğdu, 23 Temmuz 1999'da babası Hassan II'nin yerine tahta çıktı, Mohammed V Üniversitesi'nde hukuk okudu, 1993'te Nice Üniversitesi'nden doktora aldı ve Aile Kanunu dahil reformlarını yaptı."
  id: "Artikel Wikipedia bahasa Inggris tentang Mohammed VI; digunakan hanya untuk fakta entitas. Ia lahir pada 21 Agustus 1963 di Rabat, naik tahta pada 23 Juli 1999, menggantikan ayahnya Hassan II, belajar hukum di Universitas Mohammed V, meraih gelar doktor dari Universitas Nice pada tahun 1993, dan melakukan reformasi termasuk Kode Keluarga."
