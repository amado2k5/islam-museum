  ar: "مقالة ويكيبيديا الإنجليزية عن محمد السادس؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 21 أغسطس 1963 في الرباط، وجلوسه على العرش في 23 يوليو 1999 خلفا لوالده الحسن الثاني، ودراسته القانون في جامعة محمد الخامس ودكتوراه جامعة نيس سنة 1993، وإصلاحاته ومنها مدونة الأسرة."
