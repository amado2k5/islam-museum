summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أولتراتوب، الجهة غير الربحية التي تصدر القوائم الرسمية في بلجيكا منذ 1995 بمبادرة من رابطة الترفيه البلجيكية، في مجموعتين متوازيتين لفلاندرز ووالونيا."
  en: "English Wikipedia article on Ultratop, the non-profit body that has published Belgium's official charts since 1995 on the initiative of the Belgian Entertainment Association, in two parallel sets for Flanders and Wallonia."
  es: "Artículo de la Wikipedia en inglés sobre Ultratop, el organismo sin ánimo de lucro que publica las listas oficiales de éxitos de Bélgica desde 1995 por iniciativa de la Asociación Belga de Entretenimiento, en dos conjuntos paralelos para Flandes y Valonia."
  fr: "Article de Wikipédia en anglais sur Ultratop, l'organisme à but non lucratif qui publie les classements officiels belges depuis 1995 à l'initiative de l'Association belge du divertissement, en deux séries parallèles pour la Flandre et la Wallonie."
  ur: "الٹرا ٹاپ پر انگریزی ویکیپیڈیا کا مضمون، غیر منافع بخش ادارہ جس نے 1995 سے بیلجیئم انٹرٹینمنٹ ایسوسی ایشن کی پہل پر، فلینڈرز اور والونیا کے لیے دو متوازی سیٹوں میں بیلجیم کے سرکاری چارٹ شائع کیے ہیں۔"
  tr: "1995'ten beri Belçika'da resmi listeler yayımlayan kar amacı gütmeyen kuruluş Ultratop hakkında İngilizce Wikipedia makalesi, Belçika Eğlence Derneği'nin girişimiyle Flandre ve Wallonia'nın iki paralel grubunda yayınlanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ultratop, entitas nirlaba yang telah menerbitkan daftar resmi di Belgia sejak 1995 atas inisiatif Asosiasi Hiburan Belgia, dalam dua kelompok paralel yaitu Flanders dan Wallonia."
