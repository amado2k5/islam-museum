summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بير سيد جماعة علي شاه (1834–1951)، وتنص في متنها على أنه عالم وولي صوفي من الطريقة النقشبندية ترأس مؤتمر عموم الهند السني وأُعلن أمير الملة سنة 1935، وأنه كان مخوّلًا بقبول المريدين في طرق صوفية كثيرة لكنه عمل في الطريقة النقشبندية، وقاد حركة مسجد شهيد غنج وحركة باكستان."
  en: "The English Wikipedia article on Pir Syed Jamaat Ali Shah (1834–1951), which states in its text that he was a scholar and Sufi saint of the Naqshbandi order who presided over the All India Sunni Conference and was declared Ameer-e-Millat in 1935, that he was authorised to accept murids into many Sufi orders but worked in the Naqshbandi order, and that he led the Shaheed Ganj Mosque movement and campaigned for Pakistan."
