summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بير سيد جماعة علي شاه (1834–1951)، وتنص في متنها على أنه عالم وولي صوفي من الطريقة النقشبندية ترأس مؤتمر عموم الهند السني وأُعلن أمير الملة سنة 1935، وأنه كان مخوّلًا بقبول المريدين في طرق صوفية كثيرة لكنه عمل في الطريقة النقشبندية، وقاد حركة مسجد شهيد غنج وحركة باكستان."
  en: "The English Wikipedia article on Pir Syed Jamaat Ali Shah (1834–1951), which states in its text that he was a scholar and Sufi saint of the Naqshbandi order who presided over the All India Sunni Conference and was declared Ameer-e-Millat in 1935, that he was authorised to accept murids into many Sufi orders but worked in the Naqshbandi order, and that he led the Shaheed Ganj Mosque movement and campaigned for Pakistan."
  es: "El artículo de la Wikipedia en inglés sobre Pir Syed Jamaat Ali Shah (1834-1951), que afirma en su texto que fue un erudito y santo sufí de la orden Naqshbandi que presidió la Conferencia Suní de Toda la India y fue declarado Ameer-e-Millat en 1935, que estaba autorizado a aceptar murids en muchas órdenes sufíes pero trabajó en la orden Naqshbandi, y que lideró el movimiento de la Mezquita Shaheed Ganj e hizo campaña por Pakistán."
  fr: "L'article de Wikipédia en anglais sur Pir Syed Jamaat Ali Shah (1834-1951) indique dans son texte qu'il était un érudit et un saint soufi de l'ordre Naqshbandi qui a présidé la Conférence sunnite de toute l'Inde et a été déclaré Ameer-e-Millat en 1935, qu'il était autorisé à accepter des murids dans de nombreux ordres soufis mais qu'il travaillait dans l'ordre Naqshbandi, et qu'il a dirigé le mouvement de la mosquée Shaheed Ganj et a fait campagne pour le Pakistan."
  ur: "پیر سید جماعت علی شاہ (1834-1951) پر انگریزی ویکیپیڈیا کا مضمون، جس کے متن میں کہا گیا ہے کہ وہ نقشبندی حکم کے ایک عالم اور صوفی بزرگ تھے جنہوں نے آل انڈیا سنی کانفرنس کی صدارت کی اور انہیں 1935 میں امیرِ ملت قرار دیا گیا، کہ وہ مریدوں کو قبول کرنے کے مجاز تھے لیکن انہوں نے بہت سے صوفیاء کے حکم پر عمل کیا۔ شہید گنج مسجد تحریک اور پاکستان کے لیے مہم چلائی۔"
