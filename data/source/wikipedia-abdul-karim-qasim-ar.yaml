  ar: "مقالة ويكيبيديا العربية عن عبد الكريم قاسم؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 21 نوفمبر 1914 في محلة المهدية ببغداد وإعدامه سنة 1963، وتصف أباه بأنه مسلم سني وأمه بأنها من عائلة شيعية، وهو تأطير أسري لا يسمّي مذهب قاسم نفسه."
  en: "Arabic Wikipedia article on Abdul-Karim Qasim; used for entity facts only. It gives his birth on 21 November 1914 in the Mahdiyya district of Baghdad and his execution in 1963, and describes his father as a Sunni Muslim and his mother as from a Shia family — family framing that names no school of Qasim's own."
