summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الكريم قاسم؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 21 نوفمبر 1914 في محلة المهدية ببغداد وإعدامه سنة 1963، وتصف أباه بأنه مسلم سني وأمه بأنها من عائلة شيعية، وهو تأطير أسري لا يسمّي مذهب قاسم نفسه."
  en: "Arabic Wikipedia article on Abdul-Karim Qasim; used for entity facts only. It gives his birth on 21 November 1914 in the Mahdiyya district of Baghdad and his execution in 1963, and describes his father as a Sunni Muslim and his mother as from a Shia family — family framing that names no school of Qasim's own."
  es: "Artículo de Wikipedia en árabe sobre Abdul-Karim Qasim; utilizado únicamente para datos sobre la persona. Indica que nació el 21 de noviembre de 1914 en el distrito de Mahdiyya de Bagdad y que fue ejecutado en 1963, y describe a su padre como musulmán sunita y a su madre como perteneciente a una familia chiita; esta descripción familiar no menciona la escuela a la que pertenecía Qasim."
  fr: "Article Wikipédia en arabe sur Abdul-Karim Qasim; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 21 novembre 1914 dans le quartier de Mahdiyya à Bagdad et son exécution en 1963, et décrit son père comme musulman sunnite et sa mère comme issue d'une famille chiite — un cadre familial qui ne mentionne aucune école à laquelle Qasim aurait appartenu."
