summary:
  ar: "أطروحة جامعية ⁦(شافوان نيزومي، 2023)⁩ محفوظة في مستودع جامعة شريف هداية الله الإسلامية الحكومية بجاكرتا، توثق نشأة قناة الإرث النبوي في جدة على يد محمد بن عبد الرحمن السقاف وامتدادها إلى إندونيسيا باسم نبوي تي في سنة 2014."
  en: "An undergraduate thesis by Shafwan Nizomi (2023), held in the institutional repository of UIN Syarif Hidayatullah Jakarta, documenting the founding of Irtsun Nabawi in Jeddah by Muhammad bin Abdurrahman Assegaf and its extension to Indonesia as Nabawi TV in 2014."
  es: "Una tesis de pregrado de Shafwan Nizomi (2023), conservada en el repositorio institucional de UIN Syarif Hidayatullah Jakarta, que documenta la fundación de Irtsun Nabawi en Jeddah por Muhammad bin Abdurrahman Assegaf y su extensión a Indonesia en"
  fr: "Une thèse de premier cycle de Shafwan Nizomi (2023), conservée dans le dépôt institutionnel de l'UIN Syarif Hidayatullah Jakarta, documentant la fondation d'Irtsun Nabawi à Djeddah par Muhammad bin Abdurrahman Assegaf et son extension à l'Indonésie en"
  ur: "شفوان نظامی کا ایک انڈرگریجویٹ مقالہ (2023)، جو UIN سریف ہدایت اللہ جکارتہ کے ادارہ جاتی ذخیرے میں منعقد ہوا، جس میں محمد بن عبدالرحمٰن اسیگف کے ذریعہ جدہ میں ارٹسن نبوی کی بنیاد اور اس کی انڈونیشیا تک توسیع کی دستاویز کی گئی ہے۔"
  tr: "Jakarta'daki Şerif Hidayatullah İslam Devleti Üniversitesi'nin arşivinde saklanan üniversite tezi (Shafwan Nizomi, 2023), Muhammed bin Abdul Rahman Al-Saqqaf tarafından Cidde'de Peygamber Mirası Kanalı'nın kurulmasını ve 2014'te Nabawi TV adıyla Endonezya'ya genişletilmesini belgelemektedir."
  id: "Sebuah tesis universitas (Shafwan Nizomi, 2023) yang disimpan di repositori Universitas Negeri Islam Sharif Hidayatullah di Jakarta, mendokumentasikan pendirian Saluran Warisan Nabi di Jeddah oleh Muhammad bin Abdul Rahman Al-Saqqaf dan perluasannya ke Indonesia dengan nama Nabawi TV pada tahun 2014."
title: "Strategi Komunikasi Nabawi TV dalam Pengembangan Program-Program Dakwah"
