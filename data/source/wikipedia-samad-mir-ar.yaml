summary:
  ar: "مقال موسوعي بالعربية عن صمد مير (1893–1959) يصفه بأنه شاعر كشميري صوفي، ويذكر أن والديه كانا درويشين في طريقة صوفية، وأن دراسة عنه صدرت عن أكاديمية ساهيتيا بالأردية والكشميرية."
  en: "Arabic encyclopedia article on Samad Mir (1893–1959), styling him a Kashmiri Sufi poet, recording that his parents were dervish members of a Sufi order, and noting the Sahitya Akademi monograph on him in Urdu and Kashmiri."
  es: "Artículo de una enciclopedia árabe sobre Samad Mir (1893-1959), que lo describe como un poeta sufí de Cachemira, indica que sus padres eran derviches miembros de una orden sufí y menciona la monografía de la Sahitya Akademi sobre él en urdu y cachemir."
  fr: "Article d'encyclopédie arabe sur Samad Mir (1893-1959), le qualifiant de poète soufi du Cachemire, indiquant que ses parents étaient des derviches membres d'un ordre soufi et mentionnant la monographie de la Sahitya Akademi sur lui en ourdou et en cachemiri."
  ur: "صمد میر (1893-1959) پر عربی انسائیکلوپیڈیا کا مضمون، اسے کشمیری صوفی شاعر کا اسٹائل دیتے ہوئے، یہ ریکارڈ کرتے ہوئے کہ ان کے والدین ایک صوفی حکم کے درویش رکن تھے، اور ساہتیہ اکادمی کے مونوگراف کو اردو اور کشمیری میں نوٹ کرتے ہوئے۔"
  tr: "Samad Mir (1893–1959) hakkında Arapça bir ansiklopedik makalede onu Keşmirli bir Sufi şair olarak tanımlar; ebeveynlerinin bir Sufi tarikatında derviş olduğunu ve hakkında Sahitya Akademisi tarafından Urduca ve Keşmirce bir çalışma yayımlandığını belirtir."
  id: "Sebuah artikel ensiklopedis dalam bahasa Arab tentang Samad Mir (1893–1959) menggambarkannya sebagai penyair Sufi Kashmir, menyebutkan bahwa orang tuanya adalah dervish dalam ordo Sufi, dan sebuah studi tentangnya diterbitkan oleh Akademi Sahitya dalam bahasa Urdu dan Kashmiri."
