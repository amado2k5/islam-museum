label:
  ar: "التاريخ الكبير — البخاري، تحقيق محمد بن صالح الدباسي، الناشر المتميز 1440هـ، المجلد الأول"
  en: "al-Tarikh al-Kabir — al-Bukhari, ed. Muhammad ibn Salih al-Dabbasi, al-Nashir al-Mutamayyiz 1440 AH, vol. 1"
summary:
  ar: "المجلد الأول من «التاريخ الكبير» لأبي عبد الله محمد بن إسماعيل البخاري (ت 256هـ)، برواية أبي الحسن محمد بن سهل البصري الفسوي، مقابلة برواية ابن فارس الدلال وجزء من رواية عبد الرحمن بن الفضل الفسوي، على ثمانية أصول خطية، تحقيق ودراسة محمد بن صالح الدباسي، الطبعة الأولى 1440هـ/2019م، في اثني عشر مجلداً، نشر الناشر المتميز بالرياض ودار النصيحة بالمدينة. يفتتح المجلد بمقدمة التحقيق في التعريف بالكتاب وإبرازاته ورواياته."
  en: "Volume 1 of al-Tarikh al-Kabir by Abu Abd Allah Muhammad ibn Isma'il al-Bukhari (d. 256 AH), in the recension of Abu al-Hasan Muhammad ibn Sahl al-Basri al-Fasawi, collated with Ibn Faris al-Dallal's recension and part of Abd al-Rahman ibn al-Fadl al-Fasawi's, on eight manuscripts; edited with a study by Muhammad ibn Salih al-Dabbasi, 1st ed. 1440 AH / 2019, 12 vols, al-Nashir al-Mutamayyiz (Riyadh) and Dar al-Nasiha (Medina). The volume opens with the editor's introduction on the book, its successive versions and its recensions."
