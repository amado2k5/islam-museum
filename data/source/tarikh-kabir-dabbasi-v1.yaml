label:
  ar: "التاريخ الكبير — البخاري، تحقيق محمد بن صالح الدباسي، الناشر المتميز 1440هـ، المجلد الأول"
  en: "al-Tarikh al-Kabir — al-Bukhari, ed. Muhammad ibn Salih al-Dabbasi, al-Nashir al-Mutamayyiz 1440 AH, vol. 1"
summary:
  ar: "المجلد الأول من «التاريخ الكبير» لأبي عبد الله محمد بن إسماعيل البخاري ⁦(ت 256هـ)⁩، برواية أبي الحسن محمد بن سهل البصري الفسوي، مقابلة برواية ابن فارس الدلال وجزء من رواية عبد الرحمن بن الفضل الفسوي، على ثمانية أصول خطية، تحقيق ودراسة محمد بن صالح الدباسي، الطبعة الأولى 1440هـ/2019م، في اثني عشر مجلداً، نشر الناشر المتميز بالرياض ودار النصيحة بالمدينة. يفتتح المجلد بمقدمة التحقيق في التعريف بالكتاب وإبرازاته ورواياته."
  en: "Volume 1 of al-Tarikh al-Kabir by Abu Abd Allah Muhammad ibn Isma'il al-Bukhari (d. 256 AH), in the recension of Abu al-Hasan Muhammad ibn Sahl al-Basri al-Fasawi, collated with Ibn Faris al-Dallal's recension and part of Abd al-Rahman ibn al-Fadl al-Fasawi's, on eight manuscripts; edited with a study by Muhammad ibn Salih al-Dabbasi, 1st ed. 1440 AH / 2019, 12 vols, al-Nashir al-Mutamayyiz (Riyadh) and Dar al-Nasiha (Medina). The volume opens with the editor's introduction on the book, its successive versions and its recensions."
  es: "Volumen 1 de al-Tarikh al-Kabir de Abu Abd Allah Muhammad ibn Isma'il al-Bukhari (m. 256 AH), en la recensión de Abu al-Hasan Muhammad ibn Sahl al-Basri al-Fasawi, cotejada con la recensión de Ibn Faris al-Dallal y parte de la de Abd al-Rahman ibn al-Fadl al-Fasawi, en ocho manuscritos; editado con un estudio de Muhammad ibn Salih al-Dabbasi, 1.ª ed. 1440 AH / 2019, 12 vols, al-Nashir al-Mutamayyiz (Riad) y Dar al-Nasiha (Medina). El volumen comienza con la introducción del editor sobre el libro, sus sucesivas versiones y sus recensiones."
  fr: "Volume 1 d'al-Tarikh al-Kabir d'Abu Abd Allah Muhammad ibn Isma'il al-Bukhari (mort en 256 AH), selon la recension d'Abu al-Hasan Muhammad ibn Sahl al-Basri al-Fasawi, collationnée avec la recension d'Ibn Faris al-Dallal et une partie de celle d'Abd al-Rahman ibn al-Fadl al-Fasawi, sur huit manuscrits; édition et étude de Muhammad ibn Salih al-Dabbasi, 1re éd. 1440 AH / 2019, 12 vol., al-Nashir al-Mutamayyiz (Riyad) et Dar al-Nasiha (Médine). Le volume s'ouvre sur l'introduction de l'éditeur présentant l'ouvrage, ses versions successives et ses recensions."
  ur: "التاریخ الکبیر کی جلد 1 از ابو عبد اللہ محمد بن اسماعیل البخاری ⁦(متوفی 256 ہجری)⁩، ابو الحسن محمد بن سہل البصری الفسوی کی تعدیل میں، ابن فارس الدلال کی رجعت اور عبد الافضل الفساوی کے کچھ حصے کے ساتھ مل کر۔ آٹھ مخطوطات پر؛ محمد بن صالح الدباسی کے مطالعہ کے ساتھ ترمیم، 1st ایڈیشن. 1440ھ / 2019، 12 جلد، النشر المطعمیز ⁦(ریاض)⁩ اور دار النصیحہ ⁦(مدینہ)⁩۔ کتاب پر ایڈیٹر کے تعارف، اس کے یکے بعد دیگرے ورژن اور اس کی تجدید کے ساتھ جلد کا آغاز ہوتا ہے۔"
  tr: "Ebu Abdullah Muhammed bin İsmail el-Buhari (ö. 256 Hicri) tarafından yazılan 'El-Tarih El-Kabir'in birinci cildi, Ebu el-Hasan Muhammed bin Sahl el-Basri el-Fasavi tarafından anlatılan, İbn Faris el-Delal'in anlatımı ve Abdülrahman ibn el-Fadl el-Fasawi'nin sekiz el yazması ilkesine dayanan, Muhammed bin Salih el-Dabbasi tarafından düzenlenen ve incelenmiş, ilk baskı 1440 Hicri / 2019 M.S. tarafından on iki cilt halinde yayımlanmış, seçkin yayınevi tarafından Riyad'da ve Medine'de Dar al-Nasiha tarafından yayımlanmıştır. Cilt, kitabın doğrulanmasına, öne çıkan noktalarına ve anlatımlarına giriş ile başlar."
  id: "Jilid pertama 'Al-Tarikh Al-Kabir' oleh Abu Abdullah Muhammad ibn Ismail Al-Bukhari (wafat 256 H), dinarasikan oleh Abu al-Hasan Muhammad ibn Sahl al-Basri al-Fasawi, dibandingkan dengan narasi Ibn Faris al-Dalal dan sebagian narasi Abd al-Rahman ibn al-Fadl al-Fasawi, berdasarkan delapan prinsip manuskrip, yang disunting dan dipelajari oleh Muhammad ibn Salih al-Dabbasi, edisi pertama 1440 H / 2019 M, dalam dua belas jilid, diterbitkan oleh penerbit terkemuka di Riyadh dan Dar al-Nasiha di Madinah. Jilid ini dibuka dengan pengantar verifikasi buku, sorotan-sorotannya, dan narasinya."
