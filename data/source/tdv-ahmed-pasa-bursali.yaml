reliability_note: "Scholarly encyclopedia entry, read in full on 1 November 2026, and the anchor source for this record. It gives the death only as the Hijri year 902 (= 1496–97 CE), which is why the record follows a debated 1497 within that span rather than a single certain year; it attests that the poet Melîhî was Ahmed Pasha's own teacher ('hocası olan Melîhî'), that his Divan opens with a münacat and a na't, and that in the army he was nicknamed 'sipahi müftüsü' for his meticulousness. It names no legal school for him."
