label: { en: "AHMED PAŞA, Bursalı — TDV İslâm Ansiklopedisi" }
summary:
  ar: "مدخل «أحمد باشا البرسوي» في موسوعة الإسلام التركية (TDV) بقلم غوناي قوت ⁦(المجلد 2، إسطنبول 1989، ص 111–112)⁩؛ يصدر المدخل بوفاته سنة 902هـ/1496-97، ويذكر أنه ابن وليّ الدين أفندي قاضي عسكر مراد الثاني، وأنه وُلد على الأرجح في أدرنة، وخلف الملا خسرو في قضاء أدرنة سنة 855هـ/1451، وصار قاضي عسكر ثم مصاحبًا ومعلّمًا لمحمد الثاني ووزيرًا، ثم سُجن ونجا بقصيدة «كرم»، ومات في برسا ودُفن في تربته قرب مدرسة المرادية."
  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'AHMED PAŞA, Bursalı' by Günay Kut (vol. 2, Istanbul 1989, pp. 111–112); it heads the entry with his death in 902/1496–97, makes him the son of Veliyyüddin Efendi, kazasker of Murad II, places his birth in all likelihood at Edirne, records his appointment to Edirne in 855/1451 in place of Molla Hüsrev, his rise to kazasker, companion and tutor to Mehmed II and the vizier rank, his arrest and rescue by the 'Kerem' qasida, and his death at Bursa and burial in his türbe beside the Muradiye Madrasa."
  es: "La entrada 'AHMED PAŞA, Bursalı' de la TDV İslâm Ansiklopedisi (enciclopedia turca del Islam) de Günay Kut (vol. 2, Estambul 1989, pp. 111–112); encabeza la entrada con su muerte en 902/1496–97, lo hace hijo de Veliyyüddin Efendi, kazasker de Murad II, sitúa su nacimiento con toda probabilidad en Edirne, registra su nombramiento en Edirne en 855/1451 en lugar de Molla Hüsrev, su ascenso a kazasker, compañero y tutor de Mehmed II y el rango de visir, su arresto y rescate por la qasida 'Kerem', y su muerte en Bursa y entierro en su türbe junto a la Muradiye Madrasa."
  fr: "L'article « AHMED PAŞA, Bursalı » de Günay Kut (vol. 2, Istanbul 1989, pp. 111-112) de la TDV İslâm Ansiklopedisi (encyclopédie turque de l'Islam) commence par sa mort en 902/1496-97, le présente comme le fils de Veliyyüddin Efendi, cazasker de Murad II, situe sa naissance très probablement à Edirne, relate sa nomination à Edirne en 855/1451 en remplacement de Molla Hüsrev, son ascension au rang de cazasker, de compagnon et de précepteur de Mehmed II et au rang de vizir, son arrestation et son sauvetage par la qasida « Kerem », ainsi que sa mort à Bursa et son inhumation dans son türbe à côté de la médersa Muradiye."
  ur: "TDV İslâm Ansiklopedisi ⁦(Turkish انسائیکلوپیڈیا آف اسلام)⁩ اندراج 'احمد PAŞA, Bursalı' از گنائے کوت ⁦(جلد 2، استنبول 1989، صفحہ 111-112)⁩؛ یہ 902/1496-97 میں اس کی موت کے ساتھ اندراج کی سربراہی کرتا ہے، اسے مراد دوم کے قازکر ولی الدین آفندی کا بیٹا بناتا ہے، اس کی پیدائش ایڈرن میں تمام امکانات کے ساتھ ہوتی ہے، 855/1451 میں مولا حسریو کی جگہ ایڈرن میں اس کی تقرری کو ریکارڈ کرتا ہے، اس کا ولی عہد اور مہر دوئم کا تخت نشین ہوا۔ رتبہ، 'کریم' قصیدہ کے ذریعہ اس کی گرفتاری اور بچاؤ، اور برسا میں ان کی وفات اور مرادیہ مدرسہ کے پاس ان کے تربے میں تدفین۔"
