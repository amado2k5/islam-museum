summary:
  ar: "مدخل «أحمد باشا البرسوي» في موسوعة الإسلام التركية (TDV) بقلم غوناي قوت (المجلد 2، إسطنبول 1989، ص 111–112)؛ يصدر المدخل بوفاته سنة 902هـ/1496-97، ويذكر أنه ابن وليّ الدين أفندي قاضي عسكر مراد الثاني، وأنه وُلد على الأرجح في أدرنة، وخلف الملا خسرو في قضاء أدرنة سنة 855هـ/1451، وصار قاضي عسكر ثم مصاحبًا ومعلّمًا لمحمد الثاني ووزيرًا، ثم سُجن ونجا بقصيدة «كرم»، ومات في برسا ودُفن في تربته قرب مدرسة المرادية."
  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'AHMED PAŞA, Bursalı' by Günay Kut (vol. 2, Istanbul 1989, pp. 111–112); it heads the entry with his death in 902/1496–97, makes him the son of Veliyyüddin Efendi, kazasker of Murad II, places his birth in all likelihood at Edirne, records his appointment to Edirne in 855/1451 in place of Molla Hüsrev, his rise to kazasker, companion and tutor to Mehmed II and the vizier rank, his arrest and rescue by the 'Kerem' qasida, and his death at Bursa and burial in his türbe beside the Muradiye Madrasa."
