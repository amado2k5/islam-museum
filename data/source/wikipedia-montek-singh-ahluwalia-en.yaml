summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مونتيك سينغ أهلواليا؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 24 نوفمبر 1943 براولبندي في صندوق معلوماتها ونص نشأته، ومسيرته في البنك الدولي والحكومة الهندية وصندوق النقد الدولي ولجنة التخطيط، ولا تذكر له أي انتماء ديني."
  en: "English Wikipedia article on Montek Singh Ahluwalia; used for entity facts only. Its infobox and early-life text give his birth as 24 November 1943 at Rawalpindi, and it covers his World Bank, Government of India, IMF and Planning Commission career. It names no religion for him."
  es: "Artículo de Wikipedia en inglés sobre Montek Singh Ahluwalia; utilizado únicamente para obtener información sobre la persona. Su ficha informativa y la descripción de su juventud indican que nació el 24 de noviembre de 1943 en Rawalpindi, y abarca su trayectoria profesional en el Banco Mundial, el Gobierno de la India, el FMI y la Comisión de Planificación. No se menciona su religión."
  fr: "Article Wikipédia en anglais sur Montek Singh Ahluwalia; utilisé uniquement pour les informations relatives à l'entité. Son infobox et sa biographie indiquent sa naissance le 24 novembre 1943 à Rawalpindi et retracent son parcours professionnel à la Banque mondiale, au gouvernement indien, au FMI et à la Commission de planification. Aucune mention de sa religion n'est faite."
  ur: "مونٹیک سنگھ اہلووالیا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی خانہ اور ابتدائی زندگی کا متن اس کی پیدائش 24 نومبر 1943 کو راولپنڈی میں کرتا ہے، اور یہ ان کے ورلڈ بینک، حکومت ہند، آئی ایم ایف اور پلاننگ کمیشن کے کیریئر کا احاطہ کرتا ہے۔ اس کے لیے کسی مذہب کا نام نہیں۔"
