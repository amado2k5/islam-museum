reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. Read in full on 4 November 2026. It gives the birth date and place (16 April 1977, Tirana), more than ten years in a Tirana madrassa followed by study in Damascus (1993–1997) and a degree in Islamic law at the Islamic University of Medina, the return in August 2001, the imamate of the Dine Hoxha Mosque, membership of the Tirana Council of Muftis for over fifteen years and formerly of the Theological Council of the Muslim Community of Albania, the 2017 University of East Anglia dissertation on Muslim clergy and interreligious harmony in Albania 1912–1945, the petition for OIC recognition of Kosovo (52,000 signatures in two weeks), and the April 2021 knife attack on his mosque in which five worshippers were wounded. The infobox's 'Течение, школа: суннизм' (current/school: Sunnism) entry is structured data, not a text attestation, and was not used to settle faith. The revision-id endpoint was not read in this session, so no revision id is recorded; the access date stands in its place."
