  en: "English Wikipedia article on Khaled Al-Rashed (titled 'Khalid Rashid'), read on 25 October 2026; used for entity facts only. Its infobox gives his birth as 1970 in Saudi Arabia, his denomination as Sunni, his jurisprudence as Hanbali, and his official website."
