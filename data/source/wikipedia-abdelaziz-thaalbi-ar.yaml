summary:
  ar: مقالة ويكيبيديا العربية عن عبد العزيز الثعالبي؛ تُستخدم لوقائع الكيان فقط. مطلعها يعطي «15 شعبان 1293هـ / 5 سبتمبر 1874م» — وسنة 1874 تناقض تاريخها الهجري نفسه وقسم سيرتها الذي يعطي 1876 — ووفاته في 1 أكتوبر 1944 في تونس، ودراسته في الزيتونة والخلدونية، وصحفه، ونفيه وعودته سنة 1937. تصفه زعيمًا سياسيًا ودينيًا وداعية إصلاح وتجديد، ولا تسمّي مذهبًا فقهيًا له.
  en: Arabic Wikipedia article on Abdelaziz Thâalbi; used for entity facts only. Its lead gives '15 Sha'ban 1293 AH / 5 September 1874' — the year 1874 contradicts its own Hijri date and its biography section, which gives 1876 — and his death on 1 October 1944 in Tunis, his studies at the Zaytuna and the Khaldounia, his newspapers, his exile and his 1937 return. It describes him as a political and religious leader and a caller to reform and renewal, and names no legal school for him.
  es: "Artículo de Wikipedia en árabe sobre Abdelaziz Thâalbi; utilizado únicamente para datos sobre la persona. Su introducción indica «15 Sha'ban 1293 AH / 5 de septiembre de 1874» —el año 1874 contradice su propia fecha Hijri y su sección biográfica, que indica 1876— y su muerte el 1 de octubre de 1944 en Túnez, sus estudios en Zaytuna y Khaldounia, sus periódicos, su exilio y su regreso en 1937. Lo describe como un líder político y religioso y un promotor de la reforma y la renovación, pero no menciona ninguna escuela jurídica a la que pertenezca."
  fr: "L'article de Wikipédia en arabe consacré à Abdelaziz Thâalbi, utilisé uniquement pour les informations sur l'entité, mentionne la date du 15 Sha'ban 1293 AH / 5 septembre 1874. Cette année 1874 contredit la date hégirienne mentionnée dans l'article et la biographie, qui indique 1876. L'article aborde également sa mort le 1er octobre 1944 à Tunis, ses études à la Zaytuna et à la Khaldounia, ses journaux, son exil et son retour en 1937. Il le décrit comme un chef politique et religieux, un artisan de la réforme et du renouveau, sans toutefois faire mention d'une école juridique à son nom."
  ur: "عبد العزیز ثعلبی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ '15 شعبان 1293 ہجری / 5 ستمبر 1874' دیتا ہے - سال 1874 اس کی اپنی ہجری تاریخ اور اس کی سوانح عمری کے حصے سے متصادم ہے، جو کہ 1876 دیتا ہے - اور اس کی وفات 1 اکتوبر 1944 کو تیونس میں، زیتونہ اور خلدونیہ میں اس کی تعلیم، اس کے اخبارات، اس کی جلاوطنی 1973۔ اس میں اسے ایک سیاسی اور مذہبی رہنما اور اصلاح اور تجدید کے داعی کے طور پر بیان کیا گیا ہے، اور اس کے لیے کسی قانونی اسکول کا نام نہیں لیا گیا ہے۔"
