summary:
  ar: مقالة ويكيبيديا العربية عن عبد العزيز الثعالبي؛ تُستخدم لوقائع الكيان فقط. مطلعها يعطي «15 شعبان 1293هـ / 5 سبتمبر 1874م» — وسنة 1874 تناقض تاريخها الهجري نفسه وقسم سيرتها الذي يعطي 1876 — ووفاته في 1 أكتوبر 1944 في تونس، ودراسته في الزيتونة والخلدونية، وصحفه، ونفيه وعودته سنة 1937. تصفه زعيمًا سياسيًا ودينيًا وداعية إصلاح وتجديد، ولا تسمّي مذهبًا فقهيًا له.
  en: Arabic Wikipedia article on Abdelaziz Thâalbi; used for entity facts only. Its lead gives '15 Sha'ban 1293 AH / 5 September 1874' — the year 1874 contradicts its own Hijri date and its biography section, which gives 1876 — and his death on 1 October 1944 in Tunis, his studies at the Zaytuna and the Khaldounia, his newspapers, his exile and his 1937 return. It describes him as a political and religious leader and a caller to reform and renewal, and names no legal school for him.
