summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نور الدين النيبت؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في الدار البيضاء سنة 1970، وألقابه مع الوداد وديبورتيفو لا كورونيا، و115 مباراة دولية مع المغرب. تصنفه ضمن «مسلمي المغرب» تصنيفاً فقط."
  en: "English Wikipedia article on Noureddine Naybet; used for entity facts only. It recounts his birth in Casablanca in 1970, his honours with Wydad and Deportivo La Coruña, and his 115 caps for Morocco. It files him under the category 'Moroccan Muslims' and makes no statement of his religion in its text."
  es: "Artículo de la Wikipedia en inglés sobre Noureddine Naybet; utilizado únicamente para obtener información sobre la persona. Relata su nacimiento en Casablanca en 1970, sus logros con el Wydad y el Deportivo La Coruña, y sus 115 partidos con la selección de Marruecos. Lo clasifica dentro de la categoría de «musulmanes marroquíes» y no menciona su religión en el texto."
  fr: "Article de Wikipédia en anglais sur Noureddine Naybet; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Casablanca en 1970, ses succès au Wydad et au Deportivo La Coruña, ainsi que ses 115 sélections en équipe nationale du Maroc. Il est classé dans la catégorie « Musulmans marocains » et ne mentionne pas sa religion."
  ur: "نورالدین نیابت پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1970 میں کاسابلانکا میں ان کی پیدائش، وائیڈاد اور ڈیپورٹیو لا کورونا کے ساتھ ان کے اعزازات اور مراکش کے لیے ان کے 115 کیپس کا ذکر ہے۔ اس نے اسے 'مراکش کے مسلمان' کے زمرے میں درج کیا ہے اور اس کے متن میں اس کے مذہب کا کوئی بیان نہیں دیا ہے۔"
  tr: "Noureddine Neibt hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. 1970'te Kazablanka'daki doğumunu, Wydad ve Deportivo La Coruña ile oynadığı unvanları ve Fas ile oynadığı 115 uluslararası maçı anlatır. Sadece kategoriye göre 'Fas Müslümanları' arasında sınıflandırılır."
  id: "Artikel Wikipedia bahasa Inggris tentang Noureddine Neibt; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya di Casablanca pada tahun 1970, gelarnya bersama Wydad dan Deportivo La Coruña, serta 115 pertandingan internasional melawan Maroko. Ia diklasifikasikan di antara 'Muslim Maroko' hanya berdasarkan kategori."
