summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تعمية الجمل؛ لوقائع الكيان فقط: خوارزمية تعمية بمفتاح عمومي مبنية على تبادل مفاتيح ديفي-هلمان وصفها طاهر الجمل عام 1985، أمانها قيام على صعوبة مسألة ديفي-هلمان القرارية في الزمرة الدائرية، تعمل على ثلاث مراحل ⁦(توليد المفتاح والتعمية وفك التعمية)⁩ بمفتاح عابر جديد لكل رسالة، وهي مستعملة في GNU Privacy Guard وإصدارات PGP الحديثة، وخوارزمية التوقيع الرقمي DSA صيغة من مخطط الجمل للتوقيع لا من تعمية الجمل."
  en: "English Wikipedia article on ElGamal encryption; entity facts only: a public-key encryption algorithm based on the Diffie-Hellman key exchange, described by Taher Elgamal in 1985, its security resting on the difficulty of the Decisional Diffie-Hellman problem in the cyclic group, working in three phases ⁦(key generation, encryption, decryption)⁩ with a fresh ephemeral key per message, used in GNU Privacy Guard and recent PGP versions, with the Digital Signature Algorithm ⁦(DSA)⁩ a variant of the ElGamal signature scheme, not of ElGamal encryption."
  es: "Artículo de la Wikipedia en inglés sobre el cifrado ElGamal; solo datos de la entidad: un algoritmo de cifrado de clave pública basado en el intercambio de claves Diffie-Hellman, descrito por Taher Elgamal en 1985, cuya seguridad se basa en la dificultad del problema Decisional Diffie-Hellman en el grupo cíclico, que funciona en tres fases (generación de clave, cifrado, descifrado) con una nueva clave efímera por mensaje, utilizado en GNU Privacy Guard y versiones recientes de PGP, con el Algoritmo de Firma Digital (DSA) una variante del esquema de firma ElGamal, no del cifrado ElGamal."
  fr: "Article Wikipédia en anglais sur le chiffrement ElGamal; informations sur l’entité uniquement: algorithme de chiffrement à clé publique basé sur l’échange de clés Diffie-Hellman, décrit par Taher Elgamal en 1985, sa sécurité reposant sur la difficulté du problème de Diffie-Hellman décisionnel dans le groupe cyclique, fonctionnant en trois phases (génération de clé, chiffrement, déchiffrement) avec une nouvelle clé éphémère par message, utilisé dans GNU Privacy Guard et les versions récentes de PGP, avec l’algorithme de signature numérique (DSA) une variante du schéma de signature ElGamal, et non du chiffrement ElGamal."
  ur: "ElGamal خفیہ کاری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: ڈفی-ہیل مین کلیدی تبادلے پر مبنی ایک عوامی کلیدی خفیہ کاری الگورتھم، جسے طاہر ایلگمل نے 1985 میں بیان کیا ہے، اس کی حفاظت سائیکلکل گروپ میں فیصلہ کن ڈفی-ہیل مین کے مسئلے کی دشواری پر منحصر ہے، تین مراحل میں کام کر رہی ہے ⁦(کلیدی جنریشن، انکرپشن، ڈیکرپشن کے ساتھ استعمال شدہ کلیدی پیغامات)⁩ گارڈ اور حالیہ PGP ورژن، ڈیجیٹل سگنیچر الگورتھم (DSA) کے ساتھ، ElGamal دستخطی اسکیم کا ایک قسم، نہ کہ ElGamal انکرپشن کا۔"
  tr: "İngilizce Wikipedia cümle şifrelemesi makalesi; sadece varlık bilgileri için: Taher Al-Jamal tarafından 1985'te tanımlanan Davey-Hellman anahtar değişimine dayalı bir açık anahtar şifreleme algoritması. Güvenliği, döngüsel gruptaki Devi-Hellman karar probleminin zorluğuna dayanır. Üç aşamada çalışır (anahtar üretimi, şifreleme ve şifre çözme) ve her mesaj için yeni bir geçici anahtar bulunur. GNU Privacy Guard ve modern PGP sürümlerinde kullanılır ve DSA dijital imza algoritması, cümle şifrelemesi yerine işaretleme için bir cümle şemasıdır."
  id: "Artikel Wikipedia bahasa Inggris tentang enkripsi kalimat; hanya untuk fakta entitas: algoritma enkripsi kunci publik berdasarkan pertukaran kunci Davey-Hellman yang dijelaskan oleh Taher Al-Jamal pada tahun 1985. Keamanannya didasarkan pada kesulitan masalah keputusan Devi-Hellman dalam kelompok sirkular. Algoritma ini beroperasi dalam tiga tahap (pembuatan kunci, enkripsi, dan dekripsi) dengan kunci transien baru untuk setiap pesan. Algoritma ini digunakan dalam GNU Privacy Guard dan versi PGP modern, dan algoritma tanda tangan digital DSA adalah bentuk skema kalimat untuk penandatanganan, bukan enkripsi kalimat."
