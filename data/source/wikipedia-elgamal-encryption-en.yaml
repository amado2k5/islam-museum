summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تعمية الجمل؛ لوقائع الكيان فقط: خوارزمية تعمية بمفتاح عمومي مبنية على تبادل مفاتيح ديفي-هلمان وصفها طاهر الجمل عام 1985، أمانها قيام على صعوبة مسألة ديفي-هلمان القرارية في الزمرة الدائرية، تعمل على ثلاث مراحل ⁦(توليد المفتاح والتعمية وفك التعمية)⁩ بمفتاح عابر جديد لكل رسالة، وهي مستعملة في GNU Privacy Guard وإصدارات PGP الحديثة، وخوارزمية التوقيع الرقمي DSA صيغة من مخطط الجمل للتوقيع لا من تعمية الجمل."
  en: "English Wikipedia article on ElGamal encryption; entity facts only: a public-key encryption algorithm based on the Diffie-Hellman key exchange, described by Taher Elgamal in 1985, its security resting on the difficulty of the Decisional Diffie-Hellman problem in the cyclic group, working in three phases ⁦(key generation, encryption, decryption)⁩ with a fresh ephemeral key per message, used in GNU Privacy Guard and recent PGP versions, with the Digital Signature Algorithm ⁦(DSA)⁩ a variant of the ElGamal signature scheme, not of ElGamal encryption."
