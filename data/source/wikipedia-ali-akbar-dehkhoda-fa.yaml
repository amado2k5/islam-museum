summary:
  ar: "مقالة ويكيبيديا الفارسية «علی‌اکبر دهخدا»؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده سنة 1257 هـ.ش في محلة سنگلج بطهران ووفاته في 7 اسفند 1334 هـ.ش في طهران ودفنه في ابن‌بابويه بشهر ري، ودراسته في مدرسة العلوم السياسية ونشاطه في «صور اسرافیل» وتأليفه «لغت‌نامه»."
  en: "Persian Wikipedia article 'Ali-Akbar Dehkhoda'; used for entity facts only. It gives his birth in 1257 SH in Tehran's Sanglaj quarter and his death on 7 Esfand 1334 SH in Tehran with burial at Ibn Babawayh in Shahr-e Ray, his study at the School of Political Science, his Sur-e Esrafil work, and his Loghat-nameh."
  es: "Artículo de Wikipedia en persa titulado «Ali-Akbar Dehkhoda»; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1257 SH en el barrio de Sanglaj de Teherán y su fallecimiento el 7 de Esfand de 1334 SH en Teherán, con sepultura en Ibn Babawayh en Shahr-e Ray, sus estudios en la Escuela de Ciencias Políticas, su obra Sur-e Esrafil y su Loghat-nameh."
  fr: "L'article Wikipédia persan « Ali-Akbar Dehkhoda » est utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance en 1257 SH dans le quartier de Sanglaj à Téhéran et sa mort le 7 Esfand 1334 SH à Téhéran, avec inhumation au cimetière Ibn Babawayh à Shahr-e Ray. On y trouve également des informations sur ses études à l'École des sciences politiques, son ouvrage Sur-e Esrafil et son Loghat-nameh."
  ur: "فارسی ویکیپیڈیا مضمون 'علی اکبر دہخودہ'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 1257ھ میں تہران کے سنگلج کوارٹر میں ہوئی اور ان کی وفات 7 اسفند 1334ھ کو تہران میں شہر رے میں ابن بابویہ میں تدفین، سکول آف پولیٹیکل سائنس میں ان کی تعلیم، اس کے سورۃ اسرافیل کام، اور اس کا لوگت نام ہے۔"
  tr: "Farsça Vikipedi makalesi \"Ali Akbar Dehkhoda\" yalnızca varlığın gerçekleri için kullanılmaktadır. 1257 Hicri Yıl'da Tahran'ın Sanglaj bölgesinde doğdu, 7 Esfand 1334 SH tarihinde Tahran'da öldü, Rey ayında İbn Babavey'de defnedildi, Siyaset Bilimleri Okulu'nda eğitim aldı, 'Sur-e Israfil'de aktifti ve 'Lughat Nama' adlı eserin yazarıydı."
  id: "Artikel Wikipedia Persia \"Ali Akbar Dehkhoda\" hanya digunakan untuk fakta entitas tersebut. Ia lahir pada tahun 1257 AH di distrik Sanglaj, Teheran, meninggal pada 7 Esfand 1334 SH di Teheran, dimakamkan di Ibn Babawayh pada bulan Rey, belajar di Sekolah Ilmu Politik, aktif di 'Sur-e Israfil', dan menulis 'Lughat Nama'."
