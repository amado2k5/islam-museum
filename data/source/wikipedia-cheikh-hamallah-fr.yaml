reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision; the article carries 'to verify' and 'needs sources' banners, so its uncited narrative detail is used with care. It gives his birth as c. 1883 in its lead (citing Le Monde, 15 February 2023) but 1881 in its biography section, born at Kamba Sagho to a Moorish scholar father from Tichitt and a Fulani mother; it calls him founder of the Hamawiyya branch of the Tijani Sufi brotherhood, narrates his succession to Sidi Mohammed Lakhdar — charged by a companion of Ahmad Tijani with extending the tariqa in West Africa — and his deportations (1925 to Mederdra in Mauritania, then Côte d'Ivoire, return allowed 1936; arrest 19 June 1941; deportation to France in 1942, internment at Évaux-les-Bains) and his death at Montluçon on 16 January 1943, which the authorities kept secret until the Liberation."
