summary:
  ar: "مقالة ويكيبيديا الفرنسية «أحمدو حماه الله» عن الشيخ حماه الله؛ تُستخدم لوقائع الكيان فقط. مقالة مطوّلة تستند إلى أعمال حامس قسطنطين وعليون تراوري ولو موند، تروي نشأته في كمبا وتربيته في تيشيت وخلافته لسيدي محمد الأخضر على رأس «الأحد عشر حبة» التيجانية، ونفيه المتكرر ووفاته في مونلوسون في 16 يناير 1943."
  en: "French Wikipedia article 'Ahmedou Hamahoullah' on Cheikh Hamallah; used for entity facts only. A long article resting on Hamès Constant, Alioune Traoré and Le Monde, recounting his upbringing at Kamba and schooling at Tichitt, his succession to Sidi Mohammed Lakhdar at the head of the 'eleven grains' Tijaniyya, his repeated deportations, and his death at Montluçon on 16 January 1943."
  es: "Artículo de la Wikipedia en francés «Ahmedou Hamahoullah» sobre Cheikh Hamallah; utilizado únicamente para datos sobre la persona. Un extenso artículo basado en Hamès Constant, Alioune Traoré y Le Monde, que relata su infancia en Kamba y su educación en Tichitt, su sucesión de Sidi Mohammed Lakhdar al frente de la Tijaniyya de los «once granos», sus repetidas deportaciones y su muerte en Montluçon el 16 de enero de 1943."
  fr: "L'article « Ahmadou Hamahoullah » de Wikipédia en français, consacré à Cheikh Hamallah, est utilisé uniquement à des fins d'information sur l'entité. Ce long article, basé sur les travaux de Hamès Constant, Alioune Traoré et Le Monde, relate son enfance à Kamba et sa scolarité à Tichitt, sa succession à Sidi Mohammed Lakhdar à la tête de la Tijaniyya (la « compagnie des onze céréales »), ses déportations répétées et sa mort à Montluçon le 16 janvier 1943."
  ur: "فرانسیسی ویکیپیڈیا مضمون 'احمدو حماہ اللہ' شیخ حم اللہ پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ Hamès Constant، Alioune Traoré اور Le Monde پر مشتمل ایک طویل مضمون، کمبا میں اس کی پرورش اور تیچٹ میں اسکول کی تعلیم، 'گیارہ اناج' تیجانیہ کے سربراہ سیدی محمد لخدر کی جانشینی، اس کی بار بار جلاوطنی، اور 16 جنوری 1943 کو مونٹلوشن میں اس کی موت کا ذکر کرتا ہے۔"
