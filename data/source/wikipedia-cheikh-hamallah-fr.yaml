summary:
  ar: "مقالة ويكيبيديا الفرنسية «أحمدو حماه الله» عن الشيخ حماه الله؛ تُستخدم لوقائع الكيان فقط. مقالة مطوّلة تستند إلى أعمال حامس قسطنطين وعليون تراوري ولو موند، تروي نشأته في كمبا وتربيته في تيشيت وخلافته لسيدي محمد الأخضر على رأس «الأحد عشر حبة» التيجانية، ونفيه المتكرر ووفاته في مونلوسون في 16 يناير 1943."
  en: "French Wikipedia article 'Ahmedou Hamahoullah' on Cheikh Hamallah; used for entity facts only. A long article resting on Hamès Constant, Alioune Traoré and Le Monde, recounting his upbringing at Kamba and schooling at Tichitt, his succession to Sidi Mohammed Lakhdar at the head of the 'eleven grains' Tijaniyya, his repeated deportations, and his death at Montluçon on 16 January 1943."
