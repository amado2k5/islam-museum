summary:
  ar: "مقالة ويكيبيديا الأذربيجانية عن آدم غونش؛ تُستخدم لوقائع الكيان فقط. تفصّل ميلاده سنة 1969 في أنقرة وتخرّجه في كلية التربية بجامعة روتردام، وقائمة مؤلفاته: 22 كتابًا بالتركية وكتابان بالإنجليزية في تربية الأطفال."
  en: "Azerbaijani Wikipedia article on Adem Güneş; used for entity facts only. It details his birth in 1969 in Ankara and his graduation from Rotterdam University's pedagogy faculty, and lists his works: 22 books in Turkish and 2 in English on child education."
  es: "Artículo de la Wikipedia en azerbaiyano sobre Adem Güneş; utilizado únicamente para obtener información sobre la persona. Detalla su nacimiento en 1969 en Ankara y su graduación de la facultad de pedagogía de la Universidad de Rotterdam, y enumera sus obras: 22 libros en turco y 2 en inglés sobre educación infantil."
  fr: "Article Wikipédia azerbaïdjanais consacré à Adem Güneş; utilisé uniquement à des fins d'information sur l'entité. Il détaille sa naissance en 1969 à Ankara et son diplôme de la faculté de pédagogie de l'université de Rotterdam, et liste ses publications: 22 livres en turc et 2 en anglais sur l'éducation des enfants."
  ur: "Adem Güneş پر آذربائیجانی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1969 میں انقرہ میں ان کی پیدائش اور روٹرڈیم یونیورسٹی کی تدریسی فیکلٹی سے ان کی گریجویشن کی تفصیلات دی گئی ہیں، اور ان کے کاموں کی فہرست دی گئی ہے: بچوں کی تعلیم پر 22 کتابیں ترکی میں اور 2 انگریزی میں۔"
  tr: "Adam Güneş hakkında Azerbaycan Vikipedi makalesi; yalnızca kuruluşun gerçekleri için kullanılmıştır. 1969 yılında Ankara'da doğdu ve Rotterdam Üniversitesi Eğitim Fakültesi'nden mezun oldu. Yayın listesi arasında: çocuk eğitimi üzerine 22 Türkçe ve İngilizce 2 kitap bulunmaktadır."
  id: "Artikel Wikipedia Azerbaijan tentang Adam Güneş; digunakan hanya untuk fakta entitas. Ia lahir pada tahun 1969 di Ankara dan lulus dari Fakultas Pendidikan Universitas Rotterdam. Daftar publikasinya meliputi: 22 buku dalam bahasa Turki dan 2 buku dalam bahasa Inggris tentang pendidikan anak."
