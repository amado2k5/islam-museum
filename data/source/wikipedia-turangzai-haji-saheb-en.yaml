summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حاجي تورنغزي ⁦(فضل وحيد؛ 1858–1937)⁩؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في تورنغزي بقضاء چارسده، ودراسته في دار العلوم ديوبند وصحبته للشيخ محمود حسن ومرافقته إياه في الحج سنة 1890، وقتاله في ثورة الحدود 1897، ثم انصرافه إلى التعليم فأسّس مع خان عبد الغفار خان نحو 120 مدرسة، ومطاردة البريطانيين له سنة 1915 وفراره إلى أراضي مهمند، ووفاته في 14 ديسمبر 1937."
  en: "English Wikipedia article on the Haji Sahib of Turangzai (Fazal Wahid; 1858–1937); used for entity facts only. It recounts his birth at Turangzai in Charsadda district, his studies at Darul Uloom Deoband and attachment to Sheikh Mahmud Hasan, whom he accompanied on the Hajj in 1890, his fighting in the 1897 frontier revolt, his turn to education — with Khan Abdul Ghaffar Khan he helped found some 120 schools — the British warrant of 1915 and his flight to Mohmand territory, and his death on 14 December 1937."
  es: "Artículo de la Wikipedia en inglés sobre el Haji Sahib de Turangzai (Fazal Wahid; 1858–1937); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Turangzai, en el distrito de Charsadda, sus estudios en Darul Uloom Deoband y su afinidad con el jeque Mahmud Hasan, a quien acompañó en el Hajj de 1890, su participación en la revuelta fronteriza de 1897, su dedicación a la educación —junto con Khan Abdul Ghaffar Khan ayudó a fundar unas 120 escuelas—, la orden judicial británica de 1915 y su huida al territorio de Mohmand, y su muerte el 14 de diciembre de 1937."
  fr: "Article de Wikipédia en anglais sur le Haji Sahib de Turangzai (Fazal Wahid; 1858-1937); utilisé uniquement à des fins d’information. Il relate sa naissance à Turangzai, dans le district de Charsadda, ses études à Darul Uloom Deoband et son attachement au cheikh Mahmud Hasan, qu’il accompagna lors du Hajj en 1890, sa participation à la révolte frontalière de 1897, son engagement dans l’éducation – avec Khan Abdul Ghaffar Khan, il contribua à la fondation d’environ 120 écoles –, le mandat britannique de 1915 et sa fuite vers le territoire Mohmand, ainsi que sa mort le 14 décembre 1937."
  ur: "ترنگزئی کے حاجی صاحب پر انگریزی ویکیپیڈیا کا مضمون ⁦(فضل واحد؛ 1858-1937)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں چارسدہ ضلع کے ترنگزئی میں ان کی پیدائش، دارالعلوم دیوبند میں ان کی تعلیم اور شیخ محمود حسن سے وابستگی، جن کے ساتھ وہ 1890 میں حج پر گئے تھے، 1897 کی سرحدی بغاوت میں ان کی لڑائی، تعلیم کی طرف ان کی باری - خان عبدالغفار خان کے ساتھ انھوں نے 120 کے قریب برطانوی اسکولوں کی تلاش میں مدد کی اور 120 جنگجوؤں کی مدد کی۔ علاقہ، اور اس کی موت 14 دسمبر 1937 کو ہوئی۔"
  tr: "Hacı Turingzi hakkında İngilizce Vikipedi makalesi (Fadl Wahid; 1858–1937); yalnızca varlığın gerçekleri için kullanılmıştır. Turingzi'deki Charsadda bölgesindeki yetiştirilme tarzını, Darul Uloom Deoband'daki eğitimlerini, 1890'da Şeyh Mahmood Hassan ile arkadaşlığını ve hac yolculuğundaki eşliğini, 1897 sınır devriminden mücadelesini, ardından Han Abdul Ghaffar Khan ile yaklaşık 120 okul kurarak eğitime olan bağlılığını, 1915'te İngilizler tarafından takip edilmesini, Mohmand topraklarına kaçışını ve 14 Aralık 1937'deki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Haji Turingzi (Fadl Wahid; 1858–1937); hanya digunakan untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Turingzi di distrik Charsadda, studinya di Darul Uloom Deoband, persahabatannya dengan Sheikh Mahmood Hassan dan pendampingnya dalam ziarah pada tahun 1890, perjuangannya dalam revolusi perbatasan 1897, kemudian dedikasinya pada pendidikan dengan mendirikan sekitar 120 sekolah bersama Khan Abdul Ghaffar Khan, pengejarannya oleh Inggris pada tahun 1915, pelariannya ke tanah Mohmand, dan kematiannya pada 14 Desember 1937."
