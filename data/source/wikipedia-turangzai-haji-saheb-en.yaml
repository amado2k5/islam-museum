reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 by its recorded revision id via the MediaWiki API, the returned id asserted equal before any claim was drawn. The article carries a standing 'unreliable sources' notice (May 2012) and is internally inconsistent on his birth: its lead and text give 1858, its infobox 1842, and its statement that he died aged 81 fits neither; the lead's 1858, which Wikidata also gives, is carried as debated in the person record. The article never mentions his discipleship under the Mulla of Hadda; that attestation rests on Edwards and the Tribal Analysis Center report, registered separately."
