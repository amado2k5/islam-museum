summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حاجي تورنغزي (فضل وحيد؛ 1858–1937)؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في تورنغزي بقضاء چارسده، ودراسته في دار العلوم ديوبند وصحبته للشيخ محمود حسن ومرافقته إياه في الحج سنة 1890، وقتاله في ثورة الحدود 1897، ثم انصرافه إلى التعليم فأسّس مع خان عبد الغفار خان نحو 120 مدرسة، ومطاردة البريطانيين له سنة 1915 وفراره إلى أراضي مهمند، ووفاته في 14 ديسمبر 1937."
  en: "English Wikipedia article on the Haji Sahib of Turangzai (Fazal Wahid; 1858–1937); used for entity facts only. It recounts his birth at Turangzai in Charsadda district, his studies at Darul Uloom Deoband and attachment to Sheikh Mahmud Hasan, whom he accompanied on the Hajj in 1890, his fighting in the 1897 frontier revolt, his turn to education — with Khan Abdul Ghaffar Khan he helped found some 120 schools — the British warrant of 1915 and his flight to Mohmand territory, and his death on 14 December 1937."
