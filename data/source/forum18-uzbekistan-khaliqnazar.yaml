summary:
  ar: "تغطية خدمة أخبار فوروم 18، وهي خدمة إخبارية مستقلة معنية بالحرية الدينية، لخطبة ألقاها المفتي العام لأوزبكستان نور الدين خالقنزاروف في مسجد بطشقند يوم 8 سبتمبر عن اللباس الديني."
  en: "Forum 18 News Service, an independent religious-freedom news service, reporting an 8 September sermon by Uzbekistan's Chief Mufti Nuriddin Kholiknazarov in a Tashkent mosque on religious dress."
  es: "Forum 18 News Service, un servicio de noticias independiente que defiende la libertad religiosa, informa sobre un sermón pronunciado el 8 de septiembre por el Gran Muftí de Uzbekistán, Nuriddin Kholiknazarov, en una mezquita de Tashkent, acerca de la vestimenta religiosa."
  fr: "Forum 18 News Service, un service d'information indépendant sur la liberté religieuse, rapporte un sermon du 8 septembre du grand mufti d'Ouzbékistan, Nuriddin Kholiknazarov, dans une mosquée de Tachkent, sur le thème des vêtements religieux."
  ur: "فورم 18 نیوز سروس، ایک آزاد مذہبی آزادی نیوز سروس، تاشقند کی ایک مسجد میں ازبکستان کے چیف مفتی نورالدین خولیکنزاروف کے 8 ستمبر کے خطبہ کی رپورٹنگ کر رہی ہے۔"
  tr: "Dini özgürlükle ilgilenen bağımsız bir haber servisi olan Forum 18 Haber Servisi'nin, 8 Eylül'de Taşkent'teki bir camide Özbekistan Büyük Müftüsü Nureddin Halqnazarov'un dini kıyafet hakkında verdiği vaazın yayını."
  id: "Liputan Forum 18 News Service, sebuah layanan berita independen yang berkaitan dengan kebebasan beragama, tentang khotbah yang disampaikan oleh Mufti Agung Uzbekistan Nureddin Khalqnazarov di sebuah masjid di Tashkent pada 8 September mengenai pakaian keagamaan."
