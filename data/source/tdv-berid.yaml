summary:
  ar: "مدخل «بريد» في موسوعة TDV الإسلامية التركية، ويتناول نظام البريد والاستخبارات في الدولة الإسلامية من عهد النبي والخلفاء الراشدين، وتنظيمه في الدولتين الأموية والعباسية، وفي الأندلس ودول الطولونيين والسامانيين والغزنويين والسلاجقة والأيوبيين والمماليك، وصولاً إلى البريد الحديث في الدولة العثمانية."
  en: "The TDV İslâm Ansiklopedisi entry 'Berîd' (postal service). It covers the state postal and intelligence service from the time of the Prophet and the Rightly Guided caliphs, its organisation under the Umayyads and Abbasids, and its later forms in Andalusia, the Tulunids, Samanids, Ghaznavids, Seljuks, Ayyubids and Mamluks, and the modern postal service adopted in the Ottoman state. The entry is by İbrahim Harekât."
  es: "La entrada «Berîd» (servicio postal) de la TDV İslâm Ansiklopedisi abarca el servicio postal y de inteligencia estatal desde la época del Profeta y los califas bien guiados, su organización bajo los Omeyas y los Abasíes, y sus formas posteriores en Al-Ándalus, los Tuluníes, los Samánidas, los Ghaznávidas, los Selyúcidas, los Ayubíes y los Mamelucos, así como el servicio postal moderno adoptado en el Imperio Otomano. La entrada es de İbrahim Harekât."
  fr: "L'article « Berîd » (service postal) de l'encyclopédie islamique TDV traite du service postal et de renseignement de l'État depuis l'époque du Prophète et des califes bien guidés, de son organisation sous les Omeyyades et les Abbassides, et de ses formes ultérieures en Andalousie, sous les Toulounides, les Samanides, les Ghaznévides, les Seldjoukides, les Ayyoubides et les Mamelouks, jusqu'au service postal moderne adopté par l'État ottoman. Cet article est d'Ibrahim Harekât."
  ur: "TDV İslâm Ansiklopedisi اندراج 'Berîd' ⁦(پوسٹل سروس)⁩۔ یہ ریاستی ڈاک اور انٹیلی جنس سروس کا احاطہ کرتا ہے جو نبی اور خلفائے راشدین کے دور سے، امویوں اور عباسیوں کے ماتحت اس کی تنظیم، اور اندلس میں اس کے بعد کی شکلوں، تلونیوں، سامانیوں، غزنویوں، سلجوقوں، ایوبیوں اور مملوکوں، اور ریاست میں جدید پوسٹل سروس کو اپنایا گیا ہے۔ اندراج ابراہیم حریکات کا ہے۔"
  tr: "Türk İslami TDV Ansiklopedisi'ndeki \"Mail\" maddesi, Peygamber ve Doğru Rehberli Halifeler zamanından itibaren İslam devletindeki posta ve istihbarat sistemini, Emevi ve Abbasi devletlerindeki örgütlenmesini, ayrıca Endülüs'te, Tuluniler, Samaniler, Gazneviler, Selçuklular, Eyyubiler ve Memlükler'de, Osmanlı devletindeki modern posta hizmetlerine kadar kapsar."
  id: "Entri \"Surat\" dalam Ensiklopedia Islam Turki TDV mencakup sistem pos dan intelijen di negara Islam sejak masa Nabi dan Khalifah yang Dibimbing dengan Tepat, organisasinya di negara Umayyah dan Abbasiyah, serta di Andalusia, Tulunid, Samanid, Ghaznavid, Seljuk, Ayyubid, dan Mamluk, hingga layanan pos modern di negara Ottoman."
