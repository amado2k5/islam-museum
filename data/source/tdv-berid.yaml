summary:
  ar: "مدخل «بريد» في موسوعة TDV الإسلامية التركية، ويتناول نظام البريد والاستخبارات في الدولة الإسلامية من عهد النبي والخلفاء الراشدين، وتنظيمه في الدولتين الأموية والعباسية، وفي الأندلس ودول الطولونيين والسامانيين والغزنويين والسلاجقة والأيوبيين والمماليك، وصولاً إلى البريد الحديث في الدولة العثمانية."
  en: "The TDV İslâm Ansiklopedisi entry 'Berîd' (postal service). It covers the state postal and intelligence service from the time of the Prophet and the Rightly Guided caliphs, its organisation under the Umayyads and Abbasids, and its later forms in Andalusia, the Tulunids, Samanids, Ghaznavids, Seljuks, Ayyubids and Mamluks, and the modern postal service adopted in the Ottoman state. The entry is by İbrahim Harekât."
