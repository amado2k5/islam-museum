summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيرين مونتاخا مباكي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته سنة 1930، وخلافته الثامنة للمريدية منذ يناير 2018، وأنه أكبر حفيد لأحمدو بمبا وابن سيرين محمدو بصيرو مباكي."
  en: "English Wikipedia article on Serigne Mountakha Mbacké; used for entity facts only. It gives his birth in 1930, his eighth caliphate of the Mourides since January 2018, and his descent as the oldest grandson of Ahmadou Bamba and son of Serigne Mouhamadou Bassirou Mbacké."
  es: "Artículo de la Wikipedia en inglés sobre Serigne Mountakha Mbacké; utilizado únicamente para datos sobre la persona. Indica que nació en 1930, que ostenta el octavo califato de los Mourides desde enero de 2018 y que es el nieto mayor de Ahmadou Bamba e hijo de Serigne Mouhamadou Bassirou Mbacké."
  fr: "Article de Wikipédia en anglais sur Serigne Mountakha Mbacké; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance en 1930, son huitième califat des Mourides depuis janvier 2018, et sa descendance en tant que petit-fils aîné d’Ahmadou Bamba et fils de Serigne Mouhamadou Bassirou Mbacké."
  ur: "Serigne Mountakha Mbacké پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1930 میں اس کی پیدائش، جنوری 2018 سے موریڈس کی اس کی آٹھویں خلافت ہے، اور احمداؤ بامبا کے سب سے پرانے پوتے اور سیرگنے Mouhamadou Bassirou Mbacké کے بیٹے کے طور پر اس کی نسل ہے۔"
  tr: "Cyrine Montaja Mbaké hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1930 doğumlu olduğu ve Ocak 2018'den beri sekizinci kez Méridée unvanı aldığı belirtilmektedir; ayrıca Ahmadou Bemba'nın en büyük torunu ve Sirine Mohammadu Basirou Mbaki'nin oğlu olarak belirtilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Cyrine Montaja Mbaké; digunakan hanya untuk fakta entitas. Ia disebutkan lahir pada tahun 1930, dan suksesi kedelapan sebagai Méridée sejak Januari 2018, serta cucu tertua Ahmadou Bemba dan putra Sirine Mohammadu Basirou Mbaki."
