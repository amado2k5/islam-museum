reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. A short stub: it gives him as born in 1930 — against the French article's lead and Wikidata, which give 11 July 1932, and the French article's body, which gives 1933 — the current and eighth caliph of the Mouride brotherhood since January 2018, on the death of the seventh caliph Serigne Sidi Moukhtar Mbacké; the oldest grandson of the founder Sheikh Ahmadou Bamba and son of Serigne Mouhamadou Bassirou Mbacké ibn Khadim Rassoul. Its text describes him by office and descent only; it makes no statement of his personal initiation or affiliation."
