summary:
  ar: "مدخل «مُرَكَّب» في موسوعة TDV الإسلامية لمحمد أوغور درمان: مواد الحبر الإسلامي وأنواعه — حبر الإس وحبر المزّ والأحبار الملوّنة — وأدواته ووصفاته وطرائق صنعه ومهنة المُرَكَّبجي عند العثمانيين."
  en: "The TDV İslâm Ansiklopedisi entry on ink by the calligrapher M. Uğur Derman: materials and kinds of Islamic ink — soot (is) and oak-gall (mazı) inks and coloured writing fluids — tools, recipes, manufacture, and the Ottoman ink-sellers' trade."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre la tinta del calígrafo M. Uğur Derman: materiales y tipos de tinta islámica: tintas de hollín (is) y de agallas de roble (mazı) y líquidos de escritura de colores; herramientas, recetas, fabricación y el comercio de los vendedores de tinta otomanos."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur l'encre par le calligraphe M. Uğur Derman: matériaux et types d'encre islamique — encres de suie (is) et de galle de chêne (mazı) et liquides d'écriture colorés — outils, recettes, fabrication et commerce des vendeurs d'encre ottomans."
  ur: "سیاہی پر TDV İslâm Ansiklopedisi کا اندراج خطاط M. Uğur Derman: اسلامی سیاہی کے مواد اور قسمیں — کاجل (is) اور بلوط گیل (mazı) سیاہی اور رنگین تحریری سیال — اوزار، ترکیبیں، تیاری، اور عثمانی سیاہی بیچنے والوں کی تجارت۔"
  tr: "TDV İslami Ansiklopedisi'nde \"Bileşik\" maddesi (Muhammad Ugur Derman): İslami mürekkep malzemeleri ve türleri — As mürekkebi, Mez mürekkebi ve renkli mürekkepler — aletleri, tarifleri, üretim yöntemleri ve Osmanlılar arasında Markibji mesleği."
  id: "Entri tentang \"Compound\" dalam Ensiklopedia Islam TDV oleh Muhammad Ugur Derman: Bahan dan jenis tinta Islam — tinta As, tinta Mez, dan tinta berwarna — alat, resep, metode produksi, dan profesi Markibji di antara Ottoman."
