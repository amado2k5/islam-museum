  ar: "مقالة ويكيبيديا الإنجليزية عن ستار خان؛ تُستخدم لوقائع الكيان فقط. تعطي في صندوقها ميلاده في 20 أكتوبر 1866 بسردار كندي ووفاته في 17 نوفمبر 1914 بطهران، بينما يقول متنها إنه وُلد «نحو 1868» و«توفي في 9 نوفمبر 1914»، وتروي دفاعه عن تبريز ولقبه «سردار ملي» وواقعة حديقة أتابك ودفنه في مرقد شاه عبد العظيم بالري."
  en: "English Wikipedia article on Sattar Khan; used for entity facts only. Its infobox gives his birth on 20 October 1866 at Sardar Kandy and his death on 17 November 1914 at Tehran, while its text says he was born 'some time in 1868' and 'died on November 9, 1914'; it recounts his defence of Tabriz, his title Sardar-e Melli, the Atabak Park incident, and his burial at the Shah-Abdol-Azim shrine in Ray."
