summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ستار خان؛ تُستخدم لوقائع الكيان فقط. تعطي في صندوقها ميلاده في 20 أكتوبر 1866 بسردار كندي ووفاته في 17 نوفمبر 1914 بطهران، بينما يقول متنها إنه وُلد «نحو 1868» و«توفي في 9 نوفمبر 1914»، وتروي دفاعه عن تبريز ولقبه «سردار ملي» وواقعة حديقة أتابك ودفنه في مرقد شاه عبد العظيم بالري."
  en: "English Wikipedia article on Sattar Khan; used for entity facts only. Its infobox gives his birth on 20 October 1866 at Sardar Kandy and his death on 17 November 1914 at Tehran, while its text says he was born 'some time in 1868' and 'died on November 9, 1914'; it recounts his defence of Tabriz, his title Sardar-e Melli, the Atabak Park incident, and his burial at the Shah-Abdol-Azim shrine in Ray."
  es: "Artículo de la Wikipedia en inglés sobre Sattar Khan; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació el 20 de octubre de 1866 en Sardar Kandy y falleció el 17 de noviembre de 1914 en Teherán, mientras que el texto dice que nació \"en algún momento de 1868\" y \"murió el 9 de noviembre de 1914\"; relata su defensa de Tabriz, su título de Sardar-e Melli, el incidente del Parque Atabak y su entierro en el santuario de Shah-Abdol-Azim en Ray."
  fr: "Article de Wikipédia en anglais sur Sattar Khan; utilisé uniquement pour les informations biographiques. Son infobox indique sa naissance le 20 octobre 1866 à Sardar Kandy et sa mort le 17 novembre 1914 à Téhéran, tandis que son texte précise qu'il est né « vers 1868 » et « décédé le 9 novembre 1914 ». Il relate sa défense de Tabriz, son titre de Sardar-e Melli, l'incident du parc Atabak et son inhumation au mausolée de Shah-Abdol-Azim à Ray."
