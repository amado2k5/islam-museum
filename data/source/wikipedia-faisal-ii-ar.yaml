summary:
  ar: "مقالة ويكيبيديا العربية عن الملك فيصل الثاني؛ تُستخدم لوقائع الكيان فقط. تعطي نسبه الهاشمي وولايته ووفاته في ثورة 14 يوليو 1958، وتورد خطابه عند التتويج، وتصنّفه ضمن «مسلمون سنة عراقيون» وهو تصنيف ملفات لا شهادة نصية."
  en: "Arabic Wikipedia article on King Faisal II; used for entity facts only. It gives his Hashemite lineage, his reign and his death in the revolution of 14 July 1958, and quotes his coronation speech. It files him under the category 'Iraqi Sunni Muslims', a category filing, not a textual attestation."
  es: "Artículo en árabe de la Wikipedia sobre el rey Faisal II; se utiliza únicamente para obtener información sobre su figura. Describe su linaje hachemita, su reinado y su muerte en la revolución del 14 de julio de 1958, e incluye una cita de su discurso de coronación. Lo clasifica dentro de la categoría de «musulmanes sunitas iraquíes», una clasificación que no constituye una declaración textual."
  fr: "Article de Wikipédia en arabe sur le roi Fayçal II; utilisé uniquement à titre informatif. Il retrace son ascendance hachémite, son règne et sa mort lors de la révolution du 14 juillet 1958, et cite son discours de couronnement. Il le classe dans la catégorie « Musulmans sunnites irakiens », un classement par catégorie et non une attestation textuelle."
  ur: "شاہ فیصل دوم پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کا ہاشمی نسب، اس کے دور حکومت اور 14 جولائی 1958 کے انقلاب میں اس کی موت کا ذکر کرتا ہے، اور اس کی تاجپوشی کی تقریر کا حوالہ دیتا ہے۔ یہ اسے 'عراقی سنی مسلمان' کے زمرے کے تحت فائل کرتا ہے، ایک زمرہ فائلنگ، نہ کہ متنی تصدیق۔"
