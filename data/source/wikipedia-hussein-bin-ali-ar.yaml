reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read at revision 76988112 on 25 October 2026 (lead and the reign, exile and death sections read in full). The article gives his birth at Istanbul in the year 1853 and his death on 4 June 1931, agreeing with the French article and Wikidata against the queue's 1854. Where the English article names four wives, this article counts three marriages (Abidiya; a Circassian wife; Adila Khanum) and distributes the daughters differently; the difference is stated in the prose, not merged. The article names no school for Hussein himself — its only Hanafi mention is of Abdullah Siraj, mufti of the Hanafis of Mecca, a different man."
