summary:
  ar: "مقالة ويكيبيديا العربية المفصلة عن الشريف الحسين بن علي (1853 – 4 يونيو 1931)، مؤسس المملكة العربية الحجازية وقائد الثورة العربية الكبرى؛ وُلد في الأستانة أثناء وجود والده فيها، ونُفي إليها سنة 1893 إثر خلافه مع عمه عون الرفيق، وعاد سنة 1908 أميرًا على مكة، وتروي المقالة سيرته وحروبه ومراسلاته ونفيه إلى قبرص وزيارات ابنيه له وعودته ووفاته ودفنه في الحرم القدسي."
  en: "The detailed Arabic Wikipedia article on Sharif Hussein bin Ali (1853 – 4 June 1931), founder of the Arab Kingdom of the Hejaz and leader of the Great Arab Revolt; born at Istanbul during his father's stay there, exiled to it in 1893 after his dispute with his uncle Awn al-Rafiq, and returned in 1908 as Emir of Mecca; it recounts his career, wars and correspondence, his exile to Cyprus, his sons' visits to him, his return, death and burial at the Haram al-Sharif."
