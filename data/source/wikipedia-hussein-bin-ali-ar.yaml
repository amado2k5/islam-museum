summary:
  ar: "مقالة ويكيبيديا العربية المفصلة عن الشريف الحسين بن علي ⁦(1853 – 4 يونيو 1931)⁩، مؤسس المملكة العربية الحجازية وقائد الثورة العربية الكبرى؛ وُلد في الأستانة أثناء وجود والده فيها، ونُفي إليها سنة 1893 إثر خلافه مع عمه عون الرفيق، وعاد سنة 1908 أميرًا على مكة، وتروي المقالة سيرته وحروبه ومراسلاته ونفيه إلى قبرص وزيارات ابنيه له وعودته ووفاته ودفنه في الحرم القدسي."
  en: "The detailed Arabic Wikipedia article on Sharif Hussein bin Ali (1853 – 4 June 1931), founder of the Arab Kingdom of the Hejaz and leader of the Great Arab Revolt; born at Istanbul during his father's stay there, exiled to it in 1893 after his dispute with his uncle Awn al-Rafiq, and returned in 1908 as Emir of Mecca; it recounts his career, wars and correspondence, his exile to Cyprus, his sons' visits to him, his return, death and burial at the Haram al-Sharif."
  es: "El detallado artículo de Wikipedia en árabe sobre Sharif Hussein bin Ali (1853 – 4 de junio de 1931), fundador del Reino Árabe del Hiyaz y líder de la Gran Revuelta Árabe; nacido en Estambul durante la estancia de su padre allí, exiliado a la ciudad en 1893 tras su disputa con su tío Awn al-Rafiq, y de regreso en 1908 como Emir de La Meca; relata su trayectoria, guerras y correspondencia, su exilio a Chipre, las visitas de sus hijos, su regreso, su muerte y su entierro en el Haram al-Sharif."
  fr: "L'article détaillé de Wikipédia en arabe sur Sharif Hussein bin Ali (1853 – 4 juin 1931), fondateur du royaume arabe du Hedjaz et chef de la Grande Révolte arabe; né à Istanbul pendant le séjour de son père dans cette ville, exilé à Istanbul en 1893 après son différend avec son oncle Awn al-Rafiq, et revenu en 1908 comme émir de La Mecque; il relate sa carrière, ses guerres et sa correspondance, son exil à Chypre, les visites de ses fils, son retour, sa mort et son enterrement au Haram al-Sharif."
  ur: "شریف حسین بن علی ⁦(1853 - 4 جون 1931)⁩، حجاز کی عرب سلطنت کے بانی اور عظیم عرب بغاوت کے رہنما پر تفصیلی عربی ویکیپیڈیا مضمون؛ اپنے والد کے قیام کے دوران استنبول میں پیدا ہوئے، اپنے چچا عون الرفیق کے ساتھ تنازعہ کے بعد 1893 میں اس میں جلاوطن ہو گئے، اور 1908 میں مکہ کے امیر کے طور پر واپس آئے۔ اس میں اس کے کیریئر، جنگیں اور خط و کتابت، قبرص میں اس کی جلاوطنی، اس کے بیٹوں کی اس سے ملاقات، اس کی واپسی، موت اور حرم الشریف میں تدفین کا ذکر ہے۔"
  tr: "Hecazi Arap Krallığı'nın kurucusu ve Büyük Arap İsyanı'nın lideri Şerif Hüseyin bin Ali (1853 – 4 Haziran 1931) hakkında ayrıntılı Arapça Wikipedia makalesi; babası oradayken İstanbul'da doğdu, 1893'te amcası Awn al-Rafiq ile yaşadığı anlaşmazlık sonrası sürgüne gönderildi ve 1908'de Mekke valisi olarak geri döndü. Makale, biyografisini, savaşlarını, yazışmalarını, Kıbrıs'a sürgünü, oğullarının ziyaretlerini, dönüşünü, ölümünü ve Al-Haram al-Qudsi'ye defnedilmesini anlatıyor."
  id: "Artikel rinci Wikipedia bahasa Arab tentang Sharif Hussein bin Ali (1853 – 4 Juni 1931), pendiri Kerajaan Arab Hejazi dan pemimpin Pemberontakan Arab Besar; ia lahir di Istanbul saat ayahnya berada di sana, diasingkan pada tahun 1893 setelah perselisihan dengan pamannya Awn al-Rafiq, dan kembali pada tahun 1908 sebagai gubernur Mekah. Artikel tersebut menceritakan biografinya, perang, korespondensi, pengasingan ke Siprus, kunjungan putra-putranya, kepulangannya, kematian, dan pemakamannya di Al-Haram al-Qudsi."
