  en: "Urdu Wikipedia article on Jalaluddin Khalji, first sultan of his dynasty; it notes he was about seventy at his accession and appointed his nephew Alauddin governor of Kara; used for entity facts only."
  es: "Artículo de Wikipedia en urdu sobre Jalaluddin Khalji, primer sultán de su dinastía; señala que tenía unos setenta años cuando ascendió al trono y nombró a su sobrino Alauddin gobernador de Kara; se utiliza únicamente para datos sobre la entidad."
  fr: "Article de Wikipédia en ourdou sur Jalaluddin Khalji, premier sultan de sa dynastie; il note qu'il avait environ soixante-dix ans lors de son accession au trône et qu'il a nommé son neveu Alauddin gouverneur de Kara; utilisé uniquement pour les informations sur l'entité."
  ur: "اپنے خاندان کے پہلے سلطان جلال الدین خلجی پر اردو ویکیپیڈیا کا مضمون؛ یہ نوٹ کرتا ہے کہ اس کی عمر تقریباً ستر سال تھی جب اس نے اپنے بھتیجے کو کارا کا گورنر مقرر کیا تھا۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔"
  tr: "Urduca Vikipedi makalesi, hanedanının ilk sultanı Celaluddin Halci hakkında; tahta çıktığında yaklaşık yetmiş yaşında olduğunu ve yeğeni Ala al-Din'i isteksizce hükümdar olarak atadığını belirtir; bu makale yalnızca varlığın gerçekleri için kullanılır."
  id: "Artikel Wikipedia Urdu tentang Jalaluddin Khalji, sultan pertama dinastinya; disebutkan bahwa ia berusia sekitar tujuh puluh tahun saat naik takhta dan menunjuk keponakannya Ala al-Din sebagai penguasa meskipun enggan; artikel ini hanya digunakan untuk fakta entitas."
