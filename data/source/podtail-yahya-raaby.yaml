summary:
  ar: "صفحة ملف بودكاست يحيى رابي على بودتيل ⁦(تغذية «مسلم سنترال»)⁩؛ تضيف سيرته — نص واحد منسوخ عبر أدلة البودكاست — أنه من الدنمارك أصلًا وانتقل إلى المملكة المتحدة، وأنه مدير معهد التوحيد في ميدنهيد."
  en: "Podtail profile page for Yahya Raaby's podcast (the Muslim Central feed); its biography — one text copied across the podcast directories — adds that he is originally from Denmark, relocated to the United Kingdom, and is principal of the Tawheed Institute in Maidenhead."
  es: "Página de perfil de Podtail para el podcast de Yahya Raaby (la fuente Muslim Central); su biografía —un texto copiado en todos los directorios de podcasts— añade que es originario de Dinamarca, se mudó al Reino Unido y es director del Instituto Tawheed en Maidenhead."
  fr: "La page de profil Podtail du podcast de Yahya Raaby (le flux Muslim Central); sa biographie — un texte copié dans tous les annuaires de podcasts — ajoute qu'il est originaire du Danemark, qu'il a déménagé au Royaume-Uni et qu'il est directeur du Tawheed Institute à Maidenhead."
  ur: "یحییٰ رابی کے پوڈ کاسٹ ⁦(مسلم سنٹرل فیڈ)⁩ کے لیے پوڈٹیل پروفائل صفحہ؛ اس کی سوانح عمری — ایک متن جو پوڈ کاسٹ ڈائریکٹریز میں نقل کیا گیا ہے — مزید کہتا ہے کہ وہ اصل میں ڈنمارک سے ہے، برطانیہ منتقل ہو گیا ہے، اور میڈن ہیڈ میں توحید انسٹی ٹیوٹ کے پرنسپل ہیں۔"
  tr: "Yahya Rabi'nin podcast dosya sayfası Podtil (Muslim Central kanalı); biyografisi—podcast rehberleri aracılığıyla kopyalanmış tek bir transkript—aslen Danimarkalı olduğunu ve Birleşik Krallık'a taşındığını, ayrıca Maidenhead'deki Tawheed Enstitüsü'nün direktörü olduğunu ekliyor."
  id: "Halaman file podcast Yahya Rabi di Podtil (feed Muslim Central); biografinya—satu transkrip yang disalin melalui panduan podcast—menambahkan bahwa ia berasal dari Denmark dan pindah ke Inggris, serta direktur Tawheed Institute di Maidenhead."
