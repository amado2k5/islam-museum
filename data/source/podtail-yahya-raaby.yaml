reliability_note: "Profile page for his Muslim Central podcast feed, consulted 26 October 2026. Its biography is one copied text across the podcast directories (Podtail, Podscan, FM Radio Free) — a single text family, not several sources. It describes a contemporary Islamic teacher and Qur'an mentor engaging Muslim youth and young professionals in the UK and globally, originally from Denmark, whose foundational exposure came through Somali scholars and teachers, who memorised large portions of the Qur'an with his mother's support, who is a key instructor at Badr Academy, and who contributes to the Tawheed Institute in Maidenhead as its principal. It gives no birth date and names no legal school for him."
