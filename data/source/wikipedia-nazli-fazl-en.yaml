  ar: "مقالة ويكيبيديا الإنجليزية عن الأميرة نازلي فاضل (1853-1913) من الأسرة العلوية؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها في القاهرة سنة 1853 وصالونها الأدبي في قصرها «فيلا هنري» وعلاقاتها بعبده وزغلول وقاسم أمين، وزواجها الثاني في تونس ووفاتها في القاهرة في 28 ديسمبر 1913."
  en: "English Wikipedia article on Princess Nazli Fazl (1853–1913) of the Muhammad Ali dynasty; used for entity facts only. It gives her birth at Cairo in 1853, her literary salon at the Villa Henry, her ties to Abduh, Zaghloul and Qasim Amin, her second marriage in Tunis, and her death at Cairo on 28 December 1913."
