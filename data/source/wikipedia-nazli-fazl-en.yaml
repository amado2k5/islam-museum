reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born in Cairo in 1853, eldest child of Mustafa Fazil Pasha and Dilazad Hanim; taken to Constantinople at 13 in 1866 after her father's breach with Khedive Isma'il; spoke Turkish, Arabic, French and English; married Khalil Sherif Pasha in October 1872, widowed 1879, settled at the 'Villa Henry' by Abdeen Palace; from the 1880s held a salon frequented by Muhammad Abduh, Saad Zaghloul, Qasim Amin, Lord Cromer and Kitchener; she encouraged Zaghloul to learn French, employed him as her legal adviser and arranged his marriage to Safiya Zaghloul; at her insistence Cromer coordinated Abduh's return from exile in 1888; travelled to Tunis in 1896 and 1899; married Khelil Bouhageb on 22 April 1900 and settled at La Marsa, where her house was a cultural centre; fell on 13 October 1913 and died at Cairo on 28 December 1913; buried in the Fazil Mausoleum by the Imam al-Shafi'i mosque, Cairo. Two of its claims conflict with other sources registered here: the French article and Wikidata place her birth at Constantinople, and the French article dates her death 12 December 1913. The article states nothing about her religion or school."
