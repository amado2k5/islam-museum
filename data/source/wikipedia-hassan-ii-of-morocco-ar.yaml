  ar: "مقالة ويكيبيديا العربية عن الحسن الثاني بن محمد؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 9 يوليو 1929 ووفاته في 23 يوليو 1999، وخلافته لوالده محمد الخامس، وتفاصيل عهده الطويل."
