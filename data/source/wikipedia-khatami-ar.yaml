summary:
  ar: "مقالة ويكيبيديا العربية عن محمد خاتمي؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة يعطي صندوقها سلفه هاشمي رفسنجاني وخلفه محمود أحمدي نجاد، وحقل الدين فيها «إسلام» عمومًا."
  en: "Arabic Wikipedia article on Mohammad Khatami; used for entity facts only. A short article whose infobox names Hashemi Rafsanjani as his predecessor and Mahmoud Ahmadinejad as his successor, and whose religion field gives Islam in general."
  es: "Artículo de Wikipedia en árabe sobre Mohammad Khatami; utilizado únicamente para datos sobre la entidad. Un artículo breve cuya ficha informativa nombra a Hashemi Rafsanjani como su predecesor y a Mahmoud Ahmadinejad como su sucesor, y cuyo campo de religión indica el Islam en general."
  fr: "Article de Wikipédia en arabe sur Mohammad Khatami; utilisé uniquement pour les informations sur l'entité. Cet article court mentionne Hashemi Rafsanjani comme son prédécesseur et Mahmoud Ahmadinejad comme son successeur, et indique « Islam » dans le champ « Religion »."
  ur: "محمد خاتمی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون جس کے معلوماتی خانے میں ہاشمی رفسنجانی کو ان کے پیشرو اور محمود احمدی نژاد کو ان کے جانشین کے طور پر نامزد کیا گیا ہے، اور جس کا مذہب کا میدان عام طور پر اسلام دیتا ہے۔"
  tr: "Muhammed Hatemi hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılır. Kutusunu selefi Haşimi Rafsancani ve halefi Mahmoud Ahmedinejad tarafından verilen kısa bir makale ve içindeki din alanı genellikle \"İslam\"dır."
  id: "Artikel Wikipedia berbahasa Arab tentang Mohammad Khatami; hanya digunakan untuk fakta entitas. Sebuah artikel singkat yang kotaknya diberikan oleh pendahulunya Hashemi Rafsanjani dan penerusnya Mahmoud Ahmadinejad, dan bidang agama di dalamnya umumnya adalah \"Islam.\""
