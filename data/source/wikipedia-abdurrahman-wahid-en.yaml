  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرحمن وحيد (1940–2009)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في جومبانغ في 7 سبتمبر 1940 — الرابع من شعبان 1359 — وتعليمه في المعاهد الدينية وفي بغداد، وتدريسه في تامباكبراس، وترؤسه نهضة العلماء (1984–1999)، وتأسيسه حزب نهضة الوطن، ورئاسته (1999–2001) وعزله، ووفاته في جاكرتا في 30 ديسمبر 2009."
  en: "English Wikipedia article on Abdurrahman Wahid (1940–2009); used for entity facts only. It recounts his birth at Jombang on 7 September 1940 — the fourth day of Sha'ban 1359 — his pesantren and Baghdad education, his teaching at Tambakberas, his chairmanship of Nahdlatul Ulama (1984–1999), the founding of the PKB, his presidency (1999–2001) and removal, and his death at Jakarta on 30 December 2009."
