reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full via the MediaWiki API on 31 October 2026 at the recorded revision. The article rests heavily on Greg Barton's 2002 biography. Its infobox has no religion field; its religion content is his NU leadership, his 1975 teaching of the Sufi Kitab al-Hikam, and his pluralist positions — office, teaching and politics, none of which the faith settlement relies on. Its two birth renderings (7 September 1940; born on 4 Sha'ban) are reconciled in the record's born note."
