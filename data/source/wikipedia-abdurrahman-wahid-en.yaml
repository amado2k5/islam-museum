summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرحمن وحيد (1940–2009)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في جومبانغ في 7 سبتمبر 1940 — الرابع من شعبان 1359 — وتعليمه في المعاهد الدينية وفي بغداد، وتدريسه في تامباكبراس، وترؤسه نهضة العلماء (1984–1999)، وتأسيسه حزب نهضة الوطن، ورئاسته (1999–2001) وعزله، ووفاته في جاكرتا في 30 ديسمبر 2009."
  en: "English Wikipedia article on Abdurrahman Wahid (1940–2009); used for entity facts only. It recounts his birth at Jombang on 7 September 1940 — the fourth day of Sha'ban 1359 — his pesantren and Baghdad education, his teaching at Tambakberas, his chairmanship of Nahdlatul Ulama (1984–1999), the founding of the PKB, his presidency (1999–2001) and removal, and his death at Jakarta on 30 December 2009."
  es: "Artículo de la Wikipedia en inglés sobre Abdurrahman Wahid (1940-2009); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Jombang el 7 de septiembre de 1940, el cuarto día de Sha'ban de 1359, su educación en un pesantren y en Bagdad, su labor docente en Tambakberas, su presidencia de Nahdlatul Ulama (1984-1999), la fundación del PKB, su presidencia (1999-2001) y su destitución, y su fallecimiento en Yakarta el 30 de diciembre de 2009."
  fr: "Article de Wikipédia en anglais sur Abdurrahman Wahid (1940-2009); utilisé uniquement pour les informations sur l'entité. Il relate sa naissance à Jombang le 7 septembre 1940 — le quatrième jour de Sha'ban 1359 — ses études au pesantren et à Bagdad, son enseignement à Tambakberas, sa présidence de Nahdlatul Ulama (1984-1999), la fondation du PKB, sa présidence (1999-2001) et sa destitution, et sa mort à Jakarta le 30 décembre 2009."
  ur: "عبدالرحمن واحد (1940-2009) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 7 ستمبر 1940 کو جومبنگ میں ان کی ولادت - شعبان 1359 کے چوتھے دن - ان کے کسان اور بغداد کی تعلیم، تمبکبراس میں ان کی تعلیم، نہدلۃ العلماء کی ان کی سربراہی (1984-1999)، PKB کی بنیاد، ان کی صدارت، اور ان کی وفات (1984-1999) کا ذکر ہے۔ 30 دسمبر 2009۔"
