reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It agrees with the English article on his birth in 1881 at Thessaloniki, his ministries and his burial at Zincirlikuyu Cemetery, Istanbul, and records that by his own wish and his family's his grave was not transferred to the State Cemetery. It gives his death on 2 October 1963, citing the TBMM Album, one day earlier than the English article's 3 October; this record follows 3 October with the conflict stated. Its infobox religion field (dini) is present but left blank, and its text names no religion, school or order for him."
