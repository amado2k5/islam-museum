summary:
  ar: "مقالة ويكيبيديا التركية عن رفعت بيله؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته العسكرية والسياسية، وتترك خانة الدين في صندوق معلوماتها فارغة، وتعطي وفاته في 2 أكتوبر 1963 مستندة إلى ألبوم البرلمان التركي."
  en: "Turkish Wikipedia article on Refet Bele; used for entity facts only. It recounts his military and political career, leaves the religion field of its infobox blank, and gives his death on 2 October 1963, citing the Turkish parliament's album."
  es: "Artículo de la Wikipedia en turco sobre Refet Bele; utilizado únicamente para obtener información sobre la persona. Relata su trayectoria militar y política, deja en blanco el campo de religión de su ficha informativa e indica que falleció el 2 de octubre de 1963, citando el archivo del parlamento turco."
  fr: "Article de Wikipédia en turc sur Refet Bele; utilisé uniquement pour les informations sur l'entité. Il relate sa carrière militaire et politique, laisse le champ « religion » de son infobox vide et indique sa mort le 2 octobre 1963, citant l'album du parlement turc."
  ur: "Refet Bele پر ترکی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کے فوجی اور سیاسی کیریئر کا ذکر کرتا ہے، اپنے معلوماتی خانے کے مذہب کو خالی چھوڑ دیتا ہے، اور ترک پارلیمنٹ کے البم کا حوالہ دیتے ہوئے 2 اکتوبر 1963 کو ان کی موت پیش کرتا ہے۔"
  tr: "Rifaat Bileh hakkında Türkçe Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Askeri ve siyasi kariyerini anlatır, bilgi kutusundaki din bölümünü boş bırakır ve 2 Ekim 1963'te Türk Parlamentosu albümüne dayanarak ölümünü verir."
  id: "Artikel Wikipedia Turki tentang Rifaat Bileh hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan karier militer dan politiknya, meninggalkan bagian agama kosong di infobox-nya, dan menyebutkan kematiannya pada 2 Oktober 1963, berdasarkan album Parlemen Turki."
