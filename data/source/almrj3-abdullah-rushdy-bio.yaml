summary:
  ar: "سيرة منشورة عن عبد الله رشدي في موقع المرجع؛ تصفه بأنه داعية مصري وإمام وخطيب بمسجد السيدة نفيسة بوزارة الأوقاف، حاصل على ليسانس الدعوة الإسلامية وليسانس الشريعة والقانون من جامعة الأزهر، وبارع في مقارنة الأديان."
  en: "A published biography of Abdullah Rushdy on the Al-Mrj3 site, describing him as an Egyptian preacher and imam and preacher of the Sayyida Nafisa Mosque for the Ministry of Awqaf, holding Azhar bachelor's degrees in Islamic dawah and in sharia and law, and skilled in comparative religion."
  es: "En el sitio web Al-Mrj3 se publicó una biografía de Abdullah Rushdy que lo describe como un predicador e imán egipcio, predicador de la mezquita Sayyida Nafisa del Ministerio de Awqaf, licenciado en Dawah islámica, sharia y derecho por la Universidad de Al-Azhar, y experto en religión comparada."
  fr: "Une biographie publiée d'Abdullah Rushdy sur le site Al-Mrj3 le décrit comme un prédicateur et imam égyptien, prédicateur de la mosquée Sayyida Nafisa pour le ministère des Awqaf, titulaire de diplômes de licence d'Azhar en dawah islamique et en charia et droit, et versé dans les religions comparées."
  ur: "المرج 3 سائٹ پر عبداللہ رشدی کی ایک شائع شدہ سوانح عمری، جس میں انہیں مصری مبلغ اور سیدہ نفیسہ مسجد کے امام اور وزارت اوقاف کے مبلغ کے طور پر بیان کیا گیا ہے، اسلامی دعوت اور شریعت اور قانون میں ازہر بیچلر ڈگریاں ہیں، اور تقابلی مذہب میں ماہر ہیں۔"
  tr: "Marja' web sitesinde yayımlanan Abdullah Rushdi'nin biyografisi; onu Awqaf Bakanlığı'ndaki Seyyida Nafisa Camii'nde Mısırlı vaiz, imam ve vaiz olarak tanımlıyor. El-Ezher Üniversitesi'nden İslami savunuculuk lisans ve Şeriat ile hukuk lisans derecesine sahiptir ve dinleri karşılaştırma konusunda yeteneklidir."
  id: "Biografi Abdullah Rushdi diterbitkan di situs web Marja'; menggambarkannya sebagai pengkhotbah, imam, dan pengkhotbah Mesir di Masjid Sayyida Nafisa di Kementerian Awqaf. Ia meraih gelar sarjana advokasi Islam dan gelar sarjana Syariah serta hukum dari Universitas Al-Azhar, serta mahir membandingkan agama."
