reliability_note: "An unofficial biography page. Used, with attribution, as a second published account of his posts and degrees. Its biography table also describes his affiliation as Ahl al-Sunna wa'l-Jama'a, but the page cites the Arabic Wikipedia article as its source for the biography, so it is not an independent attestation for faith purposes. It gives his birthplace as a village in Beheira Governorate, conflicting with the Arabic Wikipedia article's Cairo, which is the one recorded, with the conflict noted. Checked 25 October 2026."
