summary:
  ar: "سيرة منشورة عن عبد الله رشدي في موقع المرجع؛ تصفه بأنه داعية مصري وإمام وخطيب بمسجد السيدة نفيسة بوزارة الأوقاف، حاصل على ليسانس الدعوة الإسلامية وليسانس الشريعة والقانون من جامعة الأزهر، وبارع في مقارنة الأديان."
  en: "A published biography of Abdullah Rushdy on the Al-Mrj3 site, describing him as an Egyptian preacher and imam and preacher of the Sayyida Nafisa Mosque for the Ministry of Awqaf, holding Azhar bachelor's degrees in Islamic dawah and in sharia and law, and skilled in comparative religion."
