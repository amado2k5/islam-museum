  en: The gift that keeps on giving — North-West University news (2021)
summary:
  ar: 'الملف الإخباري لجامعة الشمال الغربي عن امتياز سليمان بمناسبة تسميته بطل العدالة الاجتماعية لسنة 2021: وُلد في 7 مارس 1962 في بوتشيفستروم، وأنهى دراسته الثانوية في كلية ساستري بدربن سنة 1978، وتأهل طبيبًا في جامعة ناتال سنة 1984، وبدأ ممارسة خاصة في بيترماريتزبرغ، وأسس «غيفت أوف ذا غيفرز» في 6 أغسطس 1992 قبل أن يتفرغ لها سنة 1994.'
  en: 'North-West University''s news profile of Imtiaz Sooliman on his being named Social Justice Champion for 2021: born on 7 March 1962 in Potchefstroom, matriculated from Sastri College in Durban in 1978, qualified as a medical practitioner at the University of Natal in 1984, began private practice in Pietermaritzburg, and founded Gift of the Givers on 6 August 1992 before going full-time with it in 1994.'
  es: "Perfil de Imtiaz Sooliman publicado por la Universidad del Noroeste con motivo de su nombramiento como Campeón de la Justicia Social en 2021: nació el 7 de marzo de 1962 en Potchefstroom, se graduó del Sastri College en Durban en 1978, se licenció en medicina en la Universidad de Natal en 1984, comenzó a ejercer la medicina privada en Pietermaritzburg y fundó Gift of the Givers el 6 de agosto de 1992 antes de dedicarse a ella a tiempo completo en 1994."
  fr: "Profil d'Imtiaz Sooliman publié par l'Université du Nord-Ouest à l'occasion de sa nomination comme champion de la justice sociale pour 2021: né le 7 mars 1962 à Potchefstroom, il a obtenu son baccalauréat au Sastri College de Durban en 1978, est devenu médecin à l'Université du Natal en 1984, a commencé à exercer en cabinet privé à Pietermaritzburg et a fondé Gift of the Givers le 6 août 1992 avant de s'y consacrer à plein temps en 1994."
  ur: "نارتھ ویسٹ یونیورسٹی کی جانب سے امتیاز سلیمان کو 2021 کے لیے سوشل جسٹس چیمپیئن نامزد کیے جانے پر ان کی نیوز پروفائل: 7 مارچ 1962 کو Potchefstroom میں پیدا ہوئے، 1978 میں ڈربن کے ساستری کالج سے میٹرک کیا، 1984 میں نٹال یونیورسٹی میں میڈیکل پریکٹیشنر کے طور پر کوالیفائی کیا، اور Giitzburg کے پرائیویٹ پریکٹس کا آغاز کیا۔ 1994 میں اس کے ساتھ مکمل وقت جانے سے پہلے 6 اگست 1992۔"
