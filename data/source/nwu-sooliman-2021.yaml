summary:
  ar: 'الملف الإخباري لجامعة الشمال الغربي عن امتياز سليمان بمناسبة تسميته بطل العدالة الاجتماعية لسنة 2021: وُلد في 7 مارس 1962 في بوتشيفستروم، وأنهى دراسته الثانوية في كلية ساستري بدربن سنة 1978، وتأهل طبيبًا في جامعة ناتال سنة 1984، وبدأ ممارسة خاصة في بيترماريتزبرغ، وأسس «غيفت أوف ذا غيفرز» في 6 أغسطس 1992 قبل أن يتفرغ لها سنة 1994.'
  en: 'North-West University''s news profile of Imtiaz Sooliman on his being named Social Justice Champion for 2021: born on 7 March 1962 in Potchefstroom, matriculated from Sastri College in Durban in 1978, qualified as a medical practitioner at the University of Natal in 1984, began private practice in Pietermaritzburg, and founded Gift of the Givers on 6 August 1992 before going full-time with it in 1994.'
