summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن باسيرو ديوماي فاي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في ندياغانياو، وعمله مفتشا للضرائب، وأمانته العامة لحزب باستيف، وسجنه (2023–2024)، وفوزه بانتخابات 2024 الرئاسية وتنصيبه رئيسا خامسا للسنغال في 2 أبريل 2024، وخلافه مع عثمان سونكو وإقالته من رئاسة الوزراء في مايو 2026؛ وتودعه في تصنيف «مسلمي السنغال السنة» دون أي نص عن دينه شخصيا."
  en: "English Wikipedia article on Bassirou Diomaye Faye; used for entity facts only. It recounts his upbringing in Ndiaganiao, his work as a tax inspector, his general secretaryship of PASTEF, his imprisonment (2023–2024), his victory in the 2024 presidential election and inauguration as Senegal's fifth president on 2 April 2024, and his falling-out with Ousmane Sonko and dismissal of him as prime minister in May 2026. It files him under Senegalese Sunni Muslims; its text says nothing about his own religion."
