summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن باسيرو ديوماي فاي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في ندياغانياو، وعمله مفتشا للضرائب، وأمانته العامة لحزب باستيف، وسجنه (2023–2024)، وفوزه بانتخابات 2024 الرئاسية وتنصيبه رئيسا خامسا للسنغال في 2 أبريل 2024، وخلافه مع عثمان سونكو وإقالته من رئاسة الوزراء في مايو 2026؛ وتودعه في تصنيف «مسلمي السنغال السنة» دون أي نص عن دينه شخصيا."
  en: "English Wikipedia article on Bassirou Diomaye Faye; used for entity facts only. It recounts his upbringing in Ndiaganiao, his work as a tax inspector, his general secretaryship of PASTEF, his imprisonment (2023–2024), his victory in the 2024 presidential election and inauguration as Senegal's fifth president on 2 April 2024, and his falling-out with Ousmane Sonko and dismissal of him as prime minister in May 2026. It files him under Senegalese Sunni Muslims; its text says nothing about his own religion."
  es: "Artículo de la Wikipedia en inglés sobre Bassirou Diomaye Faye; utilizado únicamente para datos sobre la persona. Relata su infancia en Ndiaganiao, su trabajo como inspector de hacienda, su cargo como secretario general de PASTEF, su encarcelamiento (2023-2024), su victoria en las elecciones presidenciales de 2024 y su investidura como quinto presidente de Senegal el 2 de abril de 2024, y su ruptura con Ousmane Sonko y su destitución como primer ministro en mayo de 2026. Lo clasifica dentro de los musulmanes sunitas senegaleses; el texto no menciona nada sobre su propia religión."
  fr: "Article de Wikipédia en anglais sur Bassirou Diomaye Faye; utilisé uniquement à des fins d’information sur l’entité. Il relate son enfance à Ndiaganiao, son travail d’inspecteur des impôts, son poste de secrétaire général du PASTEF, son emprisonnement (2023-2024), sa victoire à l’élection présidentielle de 2024 et son investiture comme cinquième président du Sénégal le 2 avril 2024, ainsi que sa rupture avec Ousmane Sonko et sa destitution du poste de Premier ministre en mai 2026. Il est classé parmi les musulmans sunnites sénégalais; le texte ne mentionne pas sa religion."
