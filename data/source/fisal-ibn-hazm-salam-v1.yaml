label:
  ar: "ابن حزم، الفصل في الملل والأهواء والنحل، الجزء الأول، وبهامشه الملل والنحل للشهرستاني ⁦(مكتبة السلام العالمية، القاهرة)⁩"
  en: "Ibn Hazm, al-Fisal fi al-Milal wa-l-Ahwa' wa-l-Nihal, vol. 1, with al-Shahrastani's al-Milal wa-l-Nihal in the margin (Maktabat al-Salam al-Alamiyya, Cairo)"
  ur: "ابن حزم، الفصل فی الملل والاہواء والنحل، جلد اول، حاشیے پر شہرستانی کی الملل والنحل ⁦(مکتبۃ السلام العالمیہ، قاہرہ)⁩"
summary:
  ar: "الجزء الأول من خمسة أجزاء لطبعة مكتبة السلام العالمية ⁦(32 شارع الفلكي، القاهرة)⁩ من «الفصل» للإمام ابن حزم الظاهري الأندلسي ⁦(ت 456هـ)⁩، وبهامشها «الملل والنحل» للشهرستاني؛ في أولها ترجمة لابن حزم وأخرى للشهرستاني ملخصتان من معجم الأدباء لياقوت ووفيات الأعيان لابن خلكان، بقلم عبد الرحمن خليفة."
  en: "Volume 1 of five of the Maktabat al-Salam al-Alamiyya (32 al-Falaki Street, Cairo) printing of al-Fisal by Imam Ibn Hazm al-Zahiri of al-Andalus (d. 456 AH), with al-Shahrastani's al-Milal wa-l-Nihal in the margin; it opens with lives of Ibn Hazm and of al-Shahrastani summarised from Yaqut's Mu'jam al-Udaba' and Ibn Khallikan's Wafayat al-A'yan, signed Abd al-Rahman Khalifa."
  ur: "مکتبۃ السلام العالمیہ ⁦(32 شارع الفلکی، قاہرہ)⁩ کے پانچ جلدی ایڈیشن کی جلد اول، از امام ابن حزم ظاہری اندلسی ⁦(م 456ھ)⁩، حاشیے پر شہرستانی کی «الملل والنحل»؛ آغاز میں ابن حزم اور شہرستانی کے تراجم ہیں جو یاقوت کی معجم الادباء اور ابن خلکان کی وفیات الاعیان سے ملخص ہیں، بقلم عبد الرحمن خلیفہ۔"
title: "الفصل في الملل والأهواء والنحل"
