reliability_note: "Platform statistics aggregator, not a museum-verified fact: the figure of 875,000 subscribers (about 175 million total views, 1,643 videos) was read from vidIQ on 8 November 2026 and is used only as a dated audience figure. The page records that the channel's country is set to the United Arab Emirates — a diaspora-operated channel despite its Dhaka name; the country setting is a channel fact, not a verified place of residence for any person. Its video listing shows a waz aggregator carrying, among others, Hafizur Rahman Siddiqui's mahfils. No channel creation date was captured in this pass, so none is asserted. The page names no owner, head or operator for the channel. vidIQ's estimated earnings are modelled and are not used."
