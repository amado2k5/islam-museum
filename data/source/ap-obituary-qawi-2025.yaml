summary:
  ar: "نعي وكالة أسوشيتد برس لدوايت محمد قاوي، نُشر في 28 يوليو 2025. يذكر أنه غيّر اسمه قانونياً سنة 1982 بعد اعتناقه الإسلام، وأنه توفي يوم الجمعة بعد خمس سنوات مع الخرف، وأنه فاز ببطولتي العالم سنة 1981 و1985 وأُدخل قاعة المشاهير سنة 2004."
  en: "Associated Press obituary of Dwight Muhammad Qawi, published 28 July 2025. It states that he legally changed his name in 1982 following his conversion to Islam, that he died on the Friday after a five-year battle with dementia, and that he won world titles in 1981 and 1985 and was inducted into the Hall of Fame in 2004."
  es: "Obituario de Dwight Muhammad Qawi publicado por Associated Press el 28 de julio de 2025. En él se indica que cambió legalmente su nombre en 1982 tras su conversión al Islam, que falleció el viernes después de una batalla de cinco años contra la demencia, que ganó títulos mundiales en 1981 y 1985 y que fue incluido en el Salón de la Fama en 2004."
  fr: "Nécrologie de Dwight Muhammad Qawi publiée par l'Associated Press le 28 juillet 2025. Elle indique qu'il a légalement changé de nom en 1982 suite à sa conversion à l'islam, qu'il est décédé le vendredi après cinq ans de lutte contre la démence, et qu'il a remporté des titres mondiaux en 1981 et 1985 et a été intronisé au Temple de la renommée en 2004."
  ur: "Dwight محمد قوی کی ایسوسی ایٹڈ پریس کی موت، 28 جولائی 2025 کو شائع ہوئی۔ اس میں کہا گیا ہے کہ اس نے اسلام قبول کرنے کے بعد 1982 میں قانونی طور پر اپنا نام تبدیل کیا، کہ وہ ڈیمنشیا کے ساتھ پانچ سال کی لڑائی کے بعد جمعہ کو انتقال کر گئے، اور یہ کہ اس نے 1981 اور 1985 میں عالمی ٹائٹل جیتے اور اسے Hall2000 میں شامل کیا گیا۔"
