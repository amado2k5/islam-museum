summary:
  ar: "نعي وكالة أسوشيتد برس لدوايت محمد قاوي، نُشر في 28 يوليو 2025. يذكر أنه غيّر اسمه قانونياً سنة 1982 بعد اعتناقه الإسلام، وأنه توفي يوم الجمعة بعد خمس سنوات مع الخرف، وأنه فاز ببطولتي العالم سنة 1981 و1985 وأُدخل قاعة المشاهير سنة 2004."
  en: "Associated Press obituary of Dwight Muhammad Qawi, published 28 July 2025. It states that he legally changed his name in 1982 following his conversion to Islam, that he died on the Friday after a five-year battle with dementia, and that he won world titles in 1981 and 1985 and was inducted into the Hall of Fame in 2004."
