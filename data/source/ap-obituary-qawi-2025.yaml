reliability_note: "Wire obituary, read on 26 October 2026 in its Associated Press syndication as carried by WVLT (Knoxville), under a Camden, N.J. (AP) dateline and an Associated Press copyright line; the same text ran across AP member outlets. It is an independent attestation, separate from the CBS Sports obituary the English Wikipedia article cites: it states in its own reporting that Qawi, born Dwight Braxton in Baltimore and raised in Camden, legally changed his name in 1982 following his conversion to Islam. It names no school of Islam for him."
