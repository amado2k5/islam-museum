  ur: "نوازالدین صدیقی کی خاموش ویڈیو '16.66' پر 24 اپریل 2017 کی دی بیٹر انڈیا رپورٹ، جس میں ان کے پلے کارڈز 'ڈی این اے ٹیسٹ' کی رپورٹ کرتے ہیں جس میں انہیں ہر مذہب کا 16.66 فیصد پایا جاتا ہے اور یہ نتیجہ اخذ کیا جاتا ہے: 'جب میں نے اپنی روح کو دریافت کیا تو میں نے پایا کہ میں 100 فیصد فنکار ہوں۔'"
