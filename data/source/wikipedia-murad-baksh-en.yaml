reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth on 9 October 1624 at Rohtasgarh Fort in Bihar — Wikidata gives 8 October, a one-day rivalry preserved in the person record — as the youngest surviving son of Shah Jahan and Mumtaz Mahal, his governorships (Multan, Balkh, Kashmir, the Deccan, Kabul, Gujarat, Malwa), his marriage in 1638 to the Safavid princess Sakina Banu Begum, his self-proclamation as emperor at Ahmedabad on 30 November 1657, his alliance with Aurangzeb and charge at Samugarh, his arrest on 7 July 1658, and his execution at Gwalior Fort on 14 December 1661. It names no legal school for the man himself. Checked 1 November 2026."
