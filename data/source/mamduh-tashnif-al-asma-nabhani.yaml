label:
  en: "Mamduh, Tashnif al-Asma' — entry on Yusuf al-Nabhani (Dar al-Nicosia translation, 2022)"
summary:
  ar: "مدخل يوسف النبهاني في «تشنيف الأسماع بشيوخ الإجازة والسماع» لمحمود سعيد ممدوح، بترجمته الإنجليزية ⁦(دار النيقوسيا، 2022)⁩: يفتتحه بـ«الشاعر والأديب والقاضي الشافعي» ويقول إنه كان أزهريًا صوفيًا متمسكًا بالمذهب الشافعي، وأنه توفي في قريته سنة 1350 هـ."
  en: "The Yusuf al-Nabhani entry in Mahmud Sa'id Mamduh's Tashnif al-Asma' bi-Shuyukh al-Ijaza wa-l-Sama', in its English translation (Dar al-Nicosia, 2022): it opens 'the poet, author, and Shafi'i judge', states that he 'was Azharite, a Sufi, and adhered to the Shafi'i school of thought', and has him die in his village in 1350 AH."
  es: "La entrada de Yusuf al-Nabhani en el Tashnif al-Asma' bi-Shuyukh al-Ijaza wa-l-Sama' de Mahmud Sa'id Mamduh, en su traducción al inglés (Dar al-Nicosia, 2022): comienza como \"el poeta, autor y juez shafi'í\", afirma que \"era azharita, sufí y se adhirió a la escuela de pensamiento shafi'í\", y dice que murió en su pueblo en 1350 AH."
  fr: "L'entrée Yusuf al-Nabhani dans Tashnif al-Asma' bi-Shuyukh al-Ijaza wa-l-Sama' de Mahmud Sa'id Mamduh, dans sa traduction anglaise (Dar al-Nicosia, 2022): elle ouvre « le poète, auteur et juge shafi'ite », déclare qu'il « était azharite, soufi et adhérait à l'école de pensée shafi'ite », et le fait mourir dans son village en 1350 AH."
  ur: "یوسف النبھانی کا اندراج محمود سعید ممدوح کی تصنیف الاسماء باشویخ الاعجاز و السماء میں، اس کے انگریزی ترجمے ⁦(دارالنکوسیا، 2022)⁩ میں: اس سے 'شاعر، مصنف، اور شافعی جج' کھلتے ہیں، ایک اظہر اور اظہر کو کہتے ہیں کہ شافعی مکتبہ فکر سے تعلق رکھتے ہیں اور ان کی وفات 1350ھ میں اپنے گاؤں میں ہوئی۔"
  tr: "Yusuf Al-Nabhani'nin Mahmoud Said Mamdouh'un \"Tashnif al-Asma' bi Shuyukh al-Ijaza wal-Sama\" adlı eserindeki yazısı, İngilizceye çevrilmiştir (Lefkoşa Yayın Evi, 2022): Kitabı \"şair, yazar ve yargıç el-Şafi'i\" ile açar; kendisinin Şafii okuluna bağlı bir Ezher Sufi olduğunu ve 1350 Hicri'de köyünde öldüğünü belirtir."
  id: "Entri Yusuf Al-Nabhani dalam \"Tashnif al-Asma' bi Shuyukh al-Ijaza wal-Sama\" oleh Mahmoud Said Mamdouh, diterjemahkan ke dalam bahasa Inggris (Penerbitan Nicosia, 2022): Ia membukanya dengan \"penyair, penulis, dan hakim al-Shafi'i,\" menyatakan bahwa ia adalah seorang Sufi Azhar yang menganut aliran pemikiran Shafi'i, dan bahwa ia meninggal di desanya pada tahun 1350 H."
