summary:
  ar: "مدخل يوسف النبهاني في «تشنيف الأسماع بشيوخ الإجازة والسماع» لمحمود سعيد ممدوح، بترجمته الإنجليزية (دار النيقوسيا، 2022): يفتتحه بـ«الشاعر والأديب والقاضي الشافعي» ويقول إنه كان أزهريًا صوفيًا متمسكًا بالمذهب الشافعي، وأنه توفي في قريته سنة 1350 هـ."
  en: "The Yusuf al-Nabhani entry in Mahmud Sa'id Mamduh's Tashnif al-Asma' bi-Shuyukh al-Ijaza wa-l-Sama', in its English translation (Dar al-Nicosia, 2022): it opens 'the poet, author, and Shafi'i judge', states that he 'was Azharite, a Sufi, and adhered to the Shafi'i school of thought', and has him die in his village in 1350 AH."
