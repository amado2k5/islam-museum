reliability_note: "A modern hadith scholar's biographical dictionary of his ijaza teachers, compiled from the ijaza tradition itself; the Yusuf entry was read in full in this session at the academia.edu posting of the Dar al-Nicosia translation. It is independent of both Wikipedia compilations and of the Azhar Memory biography: it names his school (Shafi'i) and his Sufism in its own summary sentence and places his death in his home village in 1350 AH, alongside al-Bitar's Hilyat al-Bashar and al-Zirikli's al-A'lam in its own source list."
