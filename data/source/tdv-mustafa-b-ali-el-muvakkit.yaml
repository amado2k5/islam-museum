summary:
  ar: "مدخل «مصطفى بن علي الموقّت» في موسوعة TDV الإسلامية: الفلكي العثماني ⁦(ت 1571م)⁩ الذي عمل موقّتاً طويلاً في جامع السلطان سليم حتى لُقّب بالسليمي، ثم صار منجّم باشي في القصر بعد 1560م وعُرف عند العامة بـ«كوجا ساعتجي»، ومؤلفاته التركية الأربعة والعشرون في آلات الفلك التي صارت مراجع الموقّتين العثمانيين."
  en: "The TDV İslâm Ansiklopedisi entry on Mustafa b. Ali el-Muvakkit (d. 1571): the Ottoman astronomer who served for long years as muvakkit of the Sultan Selim mosque — hence his nisba Selimi — then became reisülmüneccimin, the chief astrologer, at the palace after 1560 and was popularly known as Koca Saatçi, and whose twenty-four mostly Turkish treatises on astronomical instruments became the Ottoman muvakkits' handbooks."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre Mustafa b. Ali el-Muvakkit (m. 1571): el astrónomo otomano que sirvió durante muchos años como muvakkit de la mezquita del sultán Selim —de ahí su nisba Selimi—, luego se convirtió en reisülmüneccimin, el astrólogo jefe, en el palacio después de 1560 y era conocido popularmente como Koca Saatçi, y cuyos veinticuatro tratados, en su mayoría en turco, sobre instrumentos astronómicos se convirtieron en los manuales de los muvakkits otomanos."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur Mustafa b. Ali el-Muvakkit (d. 1571): l'astronome ottoman qui a servi pendant de longues années comme muvakkit de la mosquée du sultan Selim — d'où son nisba Selimi — est ensuite devenu reisülmüneccimin, l'astrologue en chef, au palais après 1560 et était populairement connu sous le nom de Koca Saatçi, et dont les vingt-quatre traités, principalement turcs, sur les instruments astronomiques sont devenus les manuels des muvakkits ottomans."
  ur: "TDV İslâm Ansiklopedisi entry on Mustafa b. علی المواقیت ⁦(متوفی 1571)⁩: عثمانی ماہر فلکیات جس نے سلطان سلیم مسجد میں طویل عرصے تک بطور مواکیت خدمات انجام دیں - اس وجہ سے اس کا نسبہ سلیمی - پھر 1560 کے بعد محل میں ریئسلمونیسیمین، چیف نجومی بن گیا اور مشہور طور پر مشہور تھا، جس کا علاج، کوکا ساتویسی پر سب سے زیادہ مشہور تھا۔ فلکیاتی آلات عثمانی میواکٹس کی ہینڈ بک بن گئے۔"
  tr: "İslam TDV Ansiklopedisi'nde 'Mustafa bin Ali' Geçici Astronom'un kaydı: Osmanlı astronomu (ö. 1571), uzun süre Sultan Selim Camii'nde çalışmış, ardından 1560'tan sonra sarayda Başı astroloğu olmuş ve halk arasında 'Koca Saatci' olarak bilinmiştir. Yirmi dört Türk astronom alet eseri, Osmanlı zamanlayıcıları için referans kaynağı olmuştur."
  id: "Entri oleh 'Mustafa bin Ali si Astronom Sementara' dalam Ensiklopedia Islam TDV: Astronom Ottoman (wafat 1571 M), yang bekerja sementara selama waktu lama di Masjid Sultan Selim hingga dijuluki Selimi, kemudian menjadi astrolog Bashi di istana setelah 1560 M dan dikenal di kalangan publik sebagai 'Koca Saatci'. Dua puluh empat karya Turki tentang instrumen astronomi menjadi referensi bagi para penghitung waktu Ottoman."
