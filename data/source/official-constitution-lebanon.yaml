summary:
  ar: "«الدستور اللبناني»، كما يُنشر عند: رئاسة الجمهورية اللبنانية. العنوان ونص المادة 11 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Lebanese Constitution, as published at: Presidency of the Lebanese Republic. The address and the wording of Article 11 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Lebanese Constitution، جیسا کہ Presidency of the Lebanese Republic پر شائع ہے۔ پتہ اور دفعہ 11 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Lebanese Constitution, tel que publié à : Presidency of the Lebanese Republic. L'adresse et le texte (article 11) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Lebanese Constitution, tal como se publica en: Presidency of the Lebanese Republic. La dirección y el texto (artículo 11) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Lübnan Anayasası\", şu adreste yayımlandığı şekliyle: Lübnan Cumhurbaşkanlığı. Madde 11'in başlığı ve metni, müze tarafından sağlanan bir araştırma özetinden alınmıştır ve müze sayfayı açmamıştır; kurucu, metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Konstitusi Lebanon,\" sebagaimana diterbitkan di: Kepresidenan Republik Lebanon. Judul dan teks Pasal 11 diambil dari ringkasan penelitian yang disediakan oleh museum, dan museum tidak membuka halaman tersebut; pendiri mengizinkan penggunaan teks tersebut seperti yang dinyatakan pada 21 November 2026."
