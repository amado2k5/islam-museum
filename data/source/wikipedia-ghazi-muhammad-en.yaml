summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن غازي محمد؛ تُستخدم لوقائع الكيان فقط. يسجل متنها انضمامه إلى الطريقة النقشبندية ودراسته على جمال الدين الغازي غوموقي ومحمد اليراغي، وسنتي مولده 1793 و1795 في الحواشي، ووفاته مزدوجة التأريخ 17/29 أكتوبر 1832 في غيمري، وتفضيله أحكام المذهب الشافعي؛ ويعطي صندوق معلوماتها دينه «الإسلام السني»."
  en: "English Wikipedia article on Ghazi Muhammad; used for entity facts only. Its text records his joining the Naqshbandi order and his study under Jamal al-Din al-Ghazi-Ghumuqi and Muhammad al-Yaraghi, gives the birth years 1793 and 1795 in its notes, the dual-dated death 17/29 October 1832 at Gimry, and his favouring of Shafi'i legal norms; its infobox gives his religion as Sunni Islam."
