reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. It names him Ismail ibn Abd al-Ghani ibn Waliullah al-Dehlvi, known as Mawlana Shah Muhammad Ismail Shahid, and gives his birth as 12 Rabi' al-Akhir 1193 AH = 29 April 1779 — the day the Urdu article and Wikidata also give, where the English article gives 26 April. It records that after his father's early death he was raised by his uncle Abd al-Qadir, read the curriculum books with him, and benefited from his uncles Rafi' al-Din and Abd al-Aziz, then attached himself to Imam Ahmad ibn Irfan (Syed Ahmad Barelvi), travelled with him to the Hijaz in 1237 AH and to the frontier in 1241 AH, and was killed at Balakot. It names no madhhab for him in its text; its category filings under 'Hanafis' and 'Maturidis' are filings, not attestations, and are not counted."
