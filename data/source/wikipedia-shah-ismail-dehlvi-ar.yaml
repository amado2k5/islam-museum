summary:
  ar: "مقالة ويكيبيديا العربية «إسماعيل بن عبد الغني الدهلوي»؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 12 ربيع الآخر 1193هـ الموافق 29 أبريل 1779م في مظفر نكر، وتربيته عند عمه عبد القادر الدهلوي واستفادته من عميه رفيع الدين وعبد العزيز، وملازمته للإمام أحمد بن عرفان وجهاده معه، واستشهاده في بالاكوت في 24 ذي القعدة 1246هـ الموافق 6 مايو 1831م، وتسرد مؤلفاته بالفارسية والعربية والأردية."
  en: "Arabic Wikipedia article 'Ismail ibn Abd al-Ghani al-Dehlvi'; used for entity facts only. It gives his birth on 12 Rabi' al-Akhir 1193 AH, corresponding to 29 April 1779, at Muzaffarnagar, his upbringing under his uncle Abd al-Qadir al-Dehlvi and his study with his uncles Rafi' al-Din and Abd al-Aziz, his attachment to Imam Ahmad ibn Irfan and jihad alongside him, and his death at Balakot on 24 Dhu al-Qa'da 1246 AH, 6 May 1831, and lists his works in Persian, Arabic and Urdu."
