  ar: "مقالة ويكيبيديا العربية عن روث بفاو؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تصفها بأنها طبيبة ألمانية باكستانية وراهبة في جمعية بنات مريم كرّست نحو خمسين عامًا لمحاربة الجذام في باكستان، وتروي وفاتها في مستشفى الآغا خان في كراتشي صباح 10 أغسطس 2017 وإعلان جنازتها الرسمية في كاتدرائية القديس باتريك."
  en: "Arabic Wikipedia article on Ruth Pfau; used for entity facts only. A short article describing her as a German–Pakistani physician and a nun in the Society of the Daughters of Mary who devoted some fifty years to fighting leprosy in Pakistan, and recording her death at the Aga Khan Hospital, Karachi, on the morning of 10 August 2017 and the announcement of her state funeral at St Patrick's Cathedral."
