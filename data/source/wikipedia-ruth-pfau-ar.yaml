summary:
  ar: "مقالة ويكيبيديا العربية عن روث بفاو؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تصفها بأنها طبيبة ألمانية باكستانية وراهبة في جمعية بنات مريم كرّست نحو خمسين عامًا لمحاربة الجذام في باكستان، وتروي وفاتها في مستشفى الآغا خان في كراتشي صباح 10 أغسطس 2017 وإعلان جنازتها الرسمية في كاتدرائية القديس باتريك."
  en: "Arabic Wikipedia article on Ruth Pfau; used for entity facts only. A short article describing her as a German–Pakistani physician and a nun in the Society of the Daughters of Mary who devoted some fifty years to fighting leprosy in Pakistan, and recording her death at the Aga Khan Hospital, Karachi, on the morning of 10 August 2017 and the announcement of her state funeral at St Patrick's Cathedral."
  es: "Artículo en árabe de la Wikipedia sobre Ruth Pfau; utilizado únicamente para obtener información sobre la persona. Un breve artículo que la describe como una médica germano-pakistaní y monja de la Sociedad de las Hijas de María que dedicó unos cincuenta años a la lucha contra la lepra en Pakistán, y que registra su fallecimiento en el Hospital Aga Khan de Karachi la mañana del 10 de agosto de 2017 y el anuncio de su funeral de Estado en la Catedral de San Patricio."
  fr: "Article de Wikipédia en arabe sur Ruth Pfau; utilisé uniquement à des fins d’information. Ce court article la décrit comme une médecin germano-pakistanaise et une religieuse de la Société des Filles de Marie qui a consacré une cinquantaine d’années à la lutte contre la lèpre au Pakistan. Il relate son décès à l’hôpital Aga Khan de Karachi, le matin du 10 août 2017, et l’annonce de ses funérailles nationales à la cathédrale Saint-Patrick."
  ur: "روتھ فاؤ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون جس میں اسے ایک جرمن-پاکستانی معالج اور سوسائٹی آف دی ڈوٹرز آف میری کی ایک راہبہ کے طور پر بیان کیا گیا ہے جس نے پاکستان میں جذام سے لڑنے کے لیے تقریباً پچاس سال وقف کیے، اور 10 اگست 2017 کی صبح کراچی کے آغا خان ہسپتال میں اس کی موت ریکارڈ کی اور سینٹ سی اے میں اس کی سرکاری تدفین کا اعلان۔"
  tr: "Ruth Bfau hakkında Arapça Wikipedia makalesi; sadece varlık gerçekleri için kullanılmıştır. Kısa bir makalede, onu Alman-Pakistanlı bir doktor ve Mary Kızları Derneği'nde rahibe olarak tanımlıyor; neredeyse elli yılını Pakistan'da cüzamla mücadeleye adamış, 10 Ağustos 2017 sabahı Karaçi'deki Aga Khan Hastanesi'nde öldüğü ve St. Patrick Katedrali'nde resmi cenazesinin duyurulduğu anılıyor."
  id: "Artikel Wikipedia berbahasa Arab tentang Ruth Bfau; hanya digunakan untuk fakta entitas. Sebuah artikel singkat menggambarkannya sebagai dokter dan biarawati Jerman-Pakistan di Daughters of Mary Association yang mendedikasikan hampir lima puluh tahun untuk memerangi kusta di Pakistan, menceritakan kematiannya di Rumah Sakit Aga Khan di Karachi pada pagi hari 10 Agustus 2017, serta pengumuman pemakaman resminya di Katedral St. Patrick."
