summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أيوب خان، رئيس باكستان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 14 مايو 1907 في ريهانا بمقاطعة هاريبور، وتدريبه في ساند هيرست وقيادته العامة للجيش (1951–1958)، ورئاسته من أكتوبر 1958 إلى استقالته في مارس 1969، ودستور 1962 الذي احترم الإسلام ولم يجعله دين الدولة، ووفاته قريبًا من إسلام آباد في 19 أبريل 1974. لا يحمل صندوق معلوماتها أي قيمة للديانة."
  en: "English Wikipedia article on Ayub Khan, president of Pakistan; used for entity facts only. It gives his birth on 14 May 1907 at Rehana in Haripur District, his Sandhurst training and command-in-chief of the army (1951–1958), his presidency from October 1958 until his resignation in March 1969, the 1962 constitution that respected Islam but did not make it the state religion, and his death near Islamabad on 19 April 1974. Its infobox carries no religion value."
  es: "Artículo de la Wikipedia en inglés sobre Ayub Khan, presidente de Pakistán; utilizado únicamente para datos sobre la persona. Describe su nacimiento el 14 de mayo de 1907 en Rehana, distrito de Haripur; su formación en Sandhurst y su cargo como comandante en jefe del ejército (1951-1958); su presidencia desde octubre de 1958 hasta su dimisión en marzo de 1969; la constitución de 1962, que respetaba el islam pero no lo convertía en la religión oficial del Estado; y su fallecimiento cerca de Islamabad el 19 de abril de 1974. Su ficha informativa no contiene información sobre religión."
  fr: "Article de Wikipédia en anglais sur Ayub Khan, président du Pakistan; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 14 mai 1907 à Rehana, dans le district de Haripur, sa formation à Sandhurst et son commandement en chef de l'armée (1951-1958), sa présidence d'octobre 1958 à sa démission en mars 1969, la constitution de 1962 qui respectait l'islam sans toutefois en faire la religion d'État, et sa mort près d'Islamabad le 19 avril 1974. Son infobox ne contient aucune information sur la religion."
