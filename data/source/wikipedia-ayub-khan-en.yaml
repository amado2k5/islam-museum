reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 27 October 2026 and checked against the recorded revision; this article is about the president of Pakistan (1907–1974), not the Afghan commander of Maiwand (1857–1914), who has his own record in the museum. The article's religion-related content is state policy — the place of Islam in his 1962 constitution and his restriction on using religion in politics — which under the headship line attests no personal affiliation; no text in it names a school for him. His wife's name is given as Zubaida Khatoon in the infobox and Zaidi Khatoon in the personal-life text; the variant is noted, and neither form is used in the record."
