summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أيوب خان، رئيس باكستان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 14 مايو 1907 في ريهانا بمقاطعة هاريبور، وتدريبه في ساند هيرست وقيادته العامة للجيش (1951–1958)، ورئاسته من أكتوبر 1958 إلى استقالته في مارس 1969، ودستور 1962 الذي احترم الإسلام ولم يجعله دين الدولة، ووفاته قريبًا من إسلام آباد في 19 أبريل 1974. لا يحمل صندوق معلوماتها أي قيمة للديانة."
  en: "English Wikipedia article on Ayub Khan, president of Pakistan; used for entity facts only. It gives his birth on 14 May 1907 at Rehana in Haripur District, his Sandhurst training and command-in-chief of the army (1951–1958), his presidency from October 1958 until his resignation in March 1969, the 1962 constitution that respected Islam but did not make it the state religion, and his death near Islamabad on 19 April 1974. Its infobox carries no religion value."
