  id: "Artikel Wikipedia bahasa Arab tentang George Weah; digunakan hanya untuk fakta entitas tersebut. Dia menyebutkan neneknya yang taat Kristen yang membesarkannya dan mendaftarkannya di sekolah Konferensi Islam, tanpa secara eksplisit menyatakan agamanya sendiri."
