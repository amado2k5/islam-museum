summary:
  ar: "الجزء الأول ⁦(1100–1189هـ)⁩ من «عجائب الآثار» لعبد الرحمن بن حسن الجبرتي، تحقيق شموئيل موريه، بمشورة دافيد أيالون، الجامعة العبرية في القدس، معهد الدراسات الآسيوية والإفريقية، سلسلة مكس شلوسنجر التذكارية، 2013؛ وفيه مقدمة المحقق عن تأليف الكتاب ومخطوطاته وسنة وفاة الجبرتي."
  en: "Vol. 1 (1100-1189 AH) of Abd al-Rahman ibn Hasan al-Jabarti's Aja'ib al-athar, ed. Shmuel Moreh with David Ayalon as consultant, Hebrew University of Jerusalem, Institute of Asian and African Studies, Max Schloessinger Memorial Series, 2013; with the editor's introduction on the book's composition, manuscripts and the year of al-Jabarti's death."
  es: "Vol. 1 (1100-1189 AH) de Aja'ib al-athar de Abd al-Rahman ibn Hasan al-Jabarti, ed. Shmuel Moreh con David Ayalon como consultor, Universidad Hebrea de Jerusalén, Instituto de Estudios Asiáticos y Africanos, Serie Conmemorativa Max Schloessinger, 2013; con la introducción del editor sobre la composición del libro, los manuscritos y el año de la muerte de al-Jabarti."
  fr: "Vol. 1 (1100-1189 AH) de Aja'ib al-athar d'Abd al-Rahman ibn Hasan al-Jabarti, éd. Shmuel Moreh avec David Ayalon comme consultant, Université hébraïque de Jérusalem, Institut d'études asiatiques et africaines, Max Schloessinger Memorial Series, 2013; avec l'introduction de l'éditeur sur la composition du livre, les manuscrits et l'année de la mort d'al-Jabarti."
  ur: "والیوم 1 ⁦(1100-1189ھ)⁩ عبدالرحمن بن حسن الجبارتی کی عجائب الاطہر، ایڈیشن۔ شموئل مورہ ڈیوڈ آیالون کے ساتھ بطور مشیر، یروشلم کی عبرانی یونیورسٹی، انسٹی ٹیوٹ آف ایشین اینڈ افریقن اسٹڈیز، میکس شلوسینجر میموریل سیریز، 2013؛ کتاب کی ساخت، مخطوطات اور الجبرتی کی وفات کے سال پر مدیر کے تعارف کے ساتھ۔"
