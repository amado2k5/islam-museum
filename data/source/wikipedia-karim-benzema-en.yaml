summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كريم بنزيما؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في ليون في 19 ديسمبر 1987، وصعوده في ليون، وأربعة عشر موسمًا مع ريال مدريد بخمسة ألقاب لدوري الأبطال، والكرة الذهبية 2022، وانتقاله إلى الاتحاد سنة 2023، وغيابه خمس سنوات عن منتخب فرنسا بعد قضية الابتزاز سنة 2015 وحكم المحكمة فيها، وتصفه بأنه مسلم ممارس يصوم رمضان دون تسمية أي مذهب له."
  en: "English Wikipedia article on Karim Benzema; used for entity facts only. It records his birth in Lyon on 19 December 1987, his rise at Lyon, fourteen seasons at Real Madrid with five Champions League titles, the 2022 Ballon d'Or, his move to Al-Ittihad in 2023, his five-year absence from France after the 2015 blackmail case and the court's verdict in that case, and describes him as a practising Muslim who fasts in Ramadan, naming no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Karim Benzema; utilizado únicamente para datos sobre la persona. En él se recoge su nacimiento en Lyon el 19 de diciembre de 1987, su ascenso en el Lyon, catorce temporadas en el Real Madrid con cinco títulos de la Liga de Campeones, el Balón de Oro de 2022, su fichaje por el Al-Ittihad en 2023, su ausencia de cinco años de Francia tras el caso de chantaje de 2015 y el veredicto judicial en dicho caso, y se le describe como un musulmán practicante que ayuna en Ramadán, sin mencionar ninguna escuela para él."
  fr: "Article de Wikipédia en anglais sur Karim Benzema; utilisé uniquement pour les informations le concernant. Il relate sa naissance à Lyon le 19 décembre 1987, son ascension à Lyon, ses quatorze saisons au Real Madrid avec cinq titres de Ligue des champions, le Ballon d’Or 2022, son transfert à Al-Ittihad en 2023, son absence de cinq ans de la France après l’affaire de chantage de 2015 et le verdict du tribunal, et le décrit comme un musulman pratiquant qui jeûne pendant le ramadan, sans mentionner son école."
  ur: "کریم بینزیما پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 19 دسمبر 1987 کو لیون میں اس کی پیدائش، لیون میں اس کا عروج، ریال میڈرڈ میں چودہ سیزن میں پانچ چیمپئنز لیگ ٹائٹل، 2022 کا بیلن ڈی اور، 2023 میں ان کا التحاد میں جانا، 2015 کے بلیک میل کیس کے بعد فرانس سے اس کی پانچ سال کی غیر موجودگی اور عدالت نے اسے ایک مسلمان کے طور پر بیان کیا ہے، جو اس کیس میں مسلم لیگ ⁦(ن)⁩ کے خلاف مقدمہ درج کرتے ہیں۔ رمضان میں روزے رکھتا ہے، اس کے لیے کسی اسکول کا نام نہیں رکھتا۔"
