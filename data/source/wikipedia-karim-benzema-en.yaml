summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كريم بنزيما؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في ليون في 19 ديسمبر 1987، وصعوده في ليون، وأربعة عشر موسمًا مع ريال مدريد بخمسة ألقاب لدوري الأبطال، والكرة الذهبية 2022، وانتقاله إلى الاتحاد سنة 2023، وغيابه خمس سنوات عن منتخب فرنسا بعد قضية الابتزاز سنة 2015 وحكم المحكمة فيها، وتصفه بأنه مسلم ممارس يصوم رمضان دون تسمية أي مذهب له."
  en: "English Wikipedia article on Karim Benzema; used for entity facts only. It records his birth in Lyon on 19 December 1987, his rise at Lyon, fourteen seasons at Real Madrid with five Champions League titles, the 2022 Ballon d'Or, his move to Al-Ittihad in 2023, his five-year absence from France after the 2015 blackmail case and the court's verdict in that case, and describes him as a practising Muslim who fasts in Ramadan, naming no school for him."
