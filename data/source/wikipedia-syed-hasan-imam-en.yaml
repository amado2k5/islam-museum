  ar: "مقالة ويكيبيديا الإنجليزية عن سيد حسن إمام؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 31 أغسطس 1871 في نيورا قرب باتنا ووفاته في 19 أبريل 1933، وقضاءه في محكمة كلكتا العليا 1912–1916 وممارسته في باتنا، ورئاسته جلسة الكونغرس الخاصة سنة 1918، وتصفه نصًا بأنه «مسلم شيعي بالإيمان»."
  en: "English Wikipedia article on Syed Hasan Imam; used for entity facts only. It gives his birth on 31 August 1871 at Neora near Patna and death on 19 April 1933, his judgeship of the Calcutta High Court 1912–1916 and practice at Patna, and his presidency of the 1918 special session of the Indian National Congress; its text calls him 'a Shia Muslim by faith'."
