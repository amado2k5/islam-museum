summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد حسن إمام؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 31 أغسطس 1871 في نيورا قرب باتنا ووفاته في 19 أبريل 1933، وقضاءه في محكمة كلكتا العليا 1912–1916 وممارسته في باتنا، ورئاسته جلسة الكونغرس الخاصة سنة 1918، وتصفه نصًا بأنه «مسلم شيعي بالإيمان»."
  en: "English Wikipedia article on Syed Hasan Imam; used for entity facts only. It gives his birth on 31 August 1871 at Neora near Patna and death on 19 April 1933, his judgeship of the Calcutta High Court 1912–1916 and practice at Patna, and his presidency of the 1918 special session of the Indian National Congress; its text calls him 'a Shia Muslim by faith'."
  es: "Artículo de la Wikipedia en inglés sobre Syed Hasan Imam; utilizado únicamente para datos sobre la persona. Indica que nació el 31 de agosto de 1871 en Neora, cerca de Patna, y falleció el 19 de abril de 1933, que fue juez del Tribunal Superior de Calcuta entre 1912 y 1916 y que ejerció la abogacía en Patna, y que presidió la sesión especial del Congreso Nacional Indio de 1918; en su texto se le describe como «un musulmán chiíta»."
  fr: "L'article de Wikipédia en anglais consacré à Syed Hasan Imam, utilisé uniquement à des fins d'information sur l'entité, indique sa naissance le 31 août 1871 à Neora, près de Patna, et son décès le 19 avril 1933. Il mentionne également son poste de juge à la Haute Cour de Calcutta de 1912 à 1916, son exercice du droit à Patna, ainsi que sa présidence de la session spéciale de 1918 du Congrès national indien. Le texte le décrit comme « musulman chiite »."
  ur: "سید حسن امام پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 31 اگست 1871 کو پٹنہ کے قریب نیورا میں ان کی پیدائش اور 19 اپریل 1933 کو موت، کلکتہ ہائی کورٹ 1912-1916 میں ان کی جج شپ اور پٹنہ میں پریکٹس، اور انڈین نیشنل کانگریس کے 1918 کے خصوصی اجلاس کی صدارت؛ اس کا متن اسے 'عقیدہ کے لحاظ سے شیعہ مسلمان' کہتا ہے۔"
