summary:
  ar: "مقالة أكاديمية في مجلة «الإسلام في آسيا» تدرس إبداع فرق النشيد الماليزية ربّاني وريحان وحجاز ودورها في نشر الوعي الإسلامي وإسلامية الأغاني."
  en: "A journal article (Journal of Islam in Asia, IIUM) studying the creativity of the Malaysian nashid groups Rabbani, Raihan and Hijjaz, their historical background, and the role they have played in creating Islamic awareness and in the Islamisation of songs and music."
  ur: "«جرنل آف اسلام ان ایشیا» ⁦(IIUM)⁩ کا مضمون جو ملائیشی نشید گروپوں ربانی، ریحان اور حجاز کی تخلیقی صلاحیت، ان کے تاریخی پس منظر اور اسلامی شعور کی تشکیل میں ان کے کردار کا مطالعہ کرتا ہے۔"
  es: "Un artículo de revista (Journal of Islam in Asia, IIUM) que estudia la creatividad de los grupos nashid malasios Rabbani, Raihan y Hijjaz, sus antecedentes históricos y el papel que han desempeñado en la creación de conciencia islámica y en la islamización de canciones y música."
  fr: "Un article de revue (Journal of Islam in Asia, IIUM) étudiant la créativité des groupes de nashid malaisiens Rabbani, Raihan et Hijjaz, leur contexte historique et le rôle qu'ils ont joué dans la création d'une conscience islamique et dans l'islamisation des chansons et de la musique."
  tr: "'İslam Asya'da İslam' dergisinde yayımlanan akademik bir makale, Malezya marş grupları Rabbani, Basil ve Hijaz adlı grubun yaratıcılığını ve bunların İslami farkındalığı ile şarkı İslamını yaymadaki rollerini inceliyor."
  id: "Sebuah artikel akademik di majalah 'Islam in Asia' mempelajari kreativitas kelompok lagu kebangsaan Malaysia Rabbani, Basil, dan Hijaz serta peran mereka dalam menyebarkan kesadaran Islam dan Islam dalam lagu."
title: "Creativity in Islamic Entertainment: A Case Study of Malaysian Nashid Groups (Rabbani, Raihan and Hijjaz)"
