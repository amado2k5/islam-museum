reliability_note: "Peer-reviewed journal article read via its journal page on 15 November 2026. Its stated focus is the historical background of the Rabbani, Raihan and Hijjaz nashid groups, the role these groups have been playing in creating Islamic awareness, the Islamisation of songs and music as promoted by the three groups, and the challenges they face. It establishes Hijjaz as one of the Malaysian nashid groups studied in the academic literature alongside Rabbani and Raihan; it is not used for any audience figure. Read on 15 November 2026."
