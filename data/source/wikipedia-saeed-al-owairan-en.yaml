reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Al-Owairan as born 19 August 1967 in Riyadh, his full name as Saeed Ali Al-Owairan Al-Dossari; his entire club career at Al-Shabab; 85 caps and 34 goals for Saudi Arabia, including seven in the 1994 World Cup qualifiers; his solo goal against Belgium at RFK Stadium at the 1994 World Cup, later voted sixth in FIFA's Goal of the Century rankings, which took Saudi Arabia into the second round for the first time; Asian Footballer of the Year in 1994; and two appearances at the 1998 World Cup. It makes no statement of his religion anywhere in its text."
