  ar: "تقرير موقع الدفاعية ⁦(عن وكالة أنباء الإمارات)⁩ في 4 كانون الثاني 2023: أصدر رئيس الإمارات مرسومًا اتحاديًا بتعيين الفريق الركن مهندس عيسى سيف محمد المزروعي رئيسًا لأركان القوات المسلحة بمرتبة وزير، ونقل سلفه حمد محمد ثاني الرميثي إلى مستشار الشؤون العسكرية لرئيس الدولة."
  en: "Al Defaiya report (from the Emirates News Agency, WAM) of 4 January 2023: the UAE President issued a federal decree appointing Staff Lieutenant General Engineer Issa Saif Mohammed Al Mazrouei as Chief of Staff of the UAE Armed Forces at the rank of Minister, and moved his predecessor Hamad Mohammed Thani Al Rumaithi to Military Affairs Adviser to the President."
