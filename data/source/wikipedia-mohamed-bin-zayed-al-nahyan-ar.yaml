summary:
  ar: "مقالة ويكيبيديا العربية عن محمد بن زايد آل نهيان؛ تُستخدم لوقائع الكيان فقط. تروي نشأته وتعليمه ومسيرته العسكرية والسياسية وتوليه الحكم سنة 2022. ويقرأ حقل الدين في صندوق معلوماتها «الإسلام» دون فرع أو مدرسة، ويذكر متنها أن والده عهد بتعليمه في طفولته إلى العالم عز الدين إبراهيم، وهو تكوين لا إثبات انتماء."
  en: "Arabic Wikipedia article on Mohamed bin Zayed Al Nahyan; used for entity facts only. It recounts his upbringing, education, military and political career and his accession in 2022. Its infobox religion field reads 'Islam' with no branch or school, and its text records that his father entrusted his childhood tutoring to the scholar Ezzedine Ibrahim — formation, not an attestation of affiliation."
  es: "Artículo en árabe de la Wikipedia sobre Mohamed bin Zayed Al Nahyan; utilizado únicamente para datos sobre la persona. Relata su infancia, educación, carrera militar y política, y su ascenso al trono en 2022. En su ficha informativa, el campo de religión indica «Islam» sin especificar rama ni escuela, y el texto registra que su padre le confió su educación infantil al erudito Ezzedine Ibrahim; información que no constituye una declaración de afiliación religiosa."
  fr: "Article Wikipédia en arabe sur Mohamed ben Zayed Al Nahyan; utilisé uniquement à des fins d’information sur l’entité. Il relate son enfance, ses études, sa carrière militaire et politique, ainsi que son accession au trône en 2022. Le champ « Religion » de l’infobox indique « Islam », sans mention de branche ou d’école, et le texte précise que son père a confié son éducation à l’érudit Ezzedine Ibrahim – une information qui ne constitue pas une attestation d’appartenance religieuse."
  ur: "محمد بن زید النہیان پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پرورش، تعلیم، عسکری اور سیاسی کیریئر اور 2022 میں اس کے الحاق کا ذکر ہے۔ اس کا معلوماتی خانہ مذہب 'اسلام' پڑھتا ہے جس کی کوئی شاخ یا اسکول نہیں ہے، اور اس کے متن میں لکھا ہے کہ اس کے والد نے اپنے بچپن کی تعلیم اسکالر ایزدین ابراہیم کو سونپی تھی - تشکیل، وابستگی کی تصدیق نہیں۔"
