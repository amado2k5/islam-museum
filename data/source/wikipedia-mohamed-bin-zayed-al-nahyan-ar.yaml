  ar: "مقالة ويكيبيديا العربية عن محمد بن زايد آل نهيان؛ تُستخدم لوقائع الكيان فقط. تروي نشأته وتعليمه ومسيرته العسكرية والسياسية وتوليه الحكم سنة 2022. ويقرأ حقل الدين في صندوق معلوماتها «الإسلام» دون فرع أو مدرسة، ويذكر متنها أن والده عهد بتعليمه في طفولته إلى العالم عز الدين إبراهيم، وهو تكوين لا إثبات انتماء."
  en: "Arabic Wikipedia article on Mohamed bin Zayed Al Nahyan; used for entity facts only. It recounts his upbringing, education, military and political career and his accession in 2022. Its infobox religion field reads 'Islam' with no branch or school, and its text records that his father entrusted his childhood tutoring to the scholar Ezzedine Ibrahim — formation, not an attestation of affiliation."
