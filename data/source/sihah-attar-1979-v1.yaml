  en: "al-Sihah, Taj al-Lugha wa-Sihah al-Arabiyya — al-Jawhari, ed. Ahmad Abd al-Ghafur Attar (Dar al-Ilm lil-Malayin, 2nd ed., 1979), vol. 1"
  ur: "الصحاح تاج اللغۃ وصحاح العربیۃ — جوہری، تحقیق احمد عبد الغفور عطار (دار العلم للملایین، دوسرا ایڈیشن، 1979ء)، جلد اول"
summary:
  ar: "الجزء الأول من طبعة أحمد عبد الغفور عطار للصحاح، الطبعة الثانية ببيروت عن دار العلم للملايين سنة 1399هـ/1979م ⁦(الأولى بالقاهرة 1376هـ/1956م)⁩، وفيه مقدمة الطبعة الثانية مؤرخة بمكة في رجب 1399هـ، ومقدمة الأمير فهد بن عبد العزيز، وبحث المحقق «الجوهري مبتكر منهج الصحاح» في الرد على من نسب السبق إلى البندنيجي."
  en: "Volume 1 of Ahmad Abd al-Ghafur Attar's edition of al-Sihah, 2nd edition, Beirut, Dar al-Ilm lil-Malayin, 1399 AH / 1979 (1st edition Cairo 1376 AH / 1956), containing the second-edition preface dated Mecca, Rajab 1399, a foreword by Prince Fahd ibn Abd al-Aziz, and the editor's essay 'al-Jawhari, Originator of the Method of al-Sihah', rebutting those who credited al-Bandaniji with priority."
  ur: "احمد عبد الغفور عطار کے ایڈیشنِ صحاح کی پہلی جلد، دوسرا ایڈیشن، بیروت، دار العلم للملایین، 1399ھ / 1979ء (پہلا ایڈیشن قاہرہ 1376ھ / 1956ء)، جس میں رجب 1399ھ کا مکہ میں لکھا دوسرے ایڈیشن کا مقدمہ، شہزادہ فہد بن عبد العزیز کا پیش لفظ، اور محقق کا مضمون «الجوہری مبتکر منہج الصحاح» ہے جو بندنیجی کو سبقت دینے والوں کا رد ہے۔"
