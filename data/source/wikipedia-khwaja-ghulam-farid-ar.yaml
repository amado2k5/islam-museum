summary:
  ar: "مقالة ويكيبيديا العربية عن خواجة غلام فريد؛ ترجمة للمقالة الإنجليزية بنصها ومراجعها، تنص على أنه شاعر صوفي من بهاولبور ينتمي إلى الطريقة الجشتية، وتوفي في 24 تموز 1901 ودُفن في ميثانكوت."
  en: "The Arabic Wikipedia article on Khwaja Ghulam Farid; a translation of the English article with the same text and references, stating that he was a Sufi poet from Bahawalpur belonging to the Chishti tariqa, died 24 July 1901 and was buried at Mithankot."
  es: "El artículo de Wikipedia en árabe sobre Khwaja Ghulam Farid, una traducción del artículo en inglés con el mismo texto y referencias, afirma que fue un poeta sufí de Bahawalpur perteneciente a la tariqa Chishti, murió el 24 de julio de 1901 y fue enterrado en Mithankot."
  fr: "L'article de Wikipédia en arabe sur Khwaja Ghulam Farid; une traduction de l'article anglais avec le même texte et les mêmes références, indiquant qu'il était un poète soufi de Bahawalpur appartenant à la tariqa Chishti, décédé le 24 juillet 1901 et enterré à Mithankot."
  ur: "خواجہ غلام فرید پر عربی ویکیپیڈیا مضمون؛ اسی متن اور حوالوں کے ساتھ انگریزی مضمون کا ترجمہ جس میں یہ بتایا گیا کہ وہ چشتی طریقت سے تعلق رکھنے والے بہاولپور کے صوفی شاعر تھے، 24 جولائی 1901 کو وفات پا گئے اور مٹھن کوٹ میں دفن ہوئے۔"
  tr: "Khwaja Ghulam Farid hakkında Arapça Vikipedi makalesi; İngilizce makalenin metni ve referanslarıyla birlikte çevirisi, onun Bahawalpur'dan Jashti tarikatına mensup bir Sufi şair olduğunu, 24 Temmuz 1901'de öldüğünü ve Mithankot'ta defnedildiğini belirtmektedir."
  id: "Artikel Wikipedia bahasa Arab tentang Khwaja Ghulam Farid; terjemahan artikel bahasa Inggris beserta teks dan referensinya, yang menyatakan bahwa ia adalah penyair Sufi dari Bahawalpur yang termasuk dalam tarekat Jashti, yang meninggal pada 24 Juli 1901 dan dimakamkan di Mithankot."
