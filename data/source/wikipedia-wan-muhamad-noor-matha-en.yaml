summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن وان محمد نور ماتا ⁦(وُلد 1944)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 11 مايو 1944 في موانغ يالا، ورئاسته لمجلس النواب التايلندي ⁦(1996–2000 و2023–2025)⁩ — أول مسلم تايلندي يتولاها — ووزاراته للداخلية والنقل والزراعة ونيابته لرئاسة الوزراء."
  en: "English Wikipedia article on Wan Muhamad Noor Matha (born 1944); used for entity facts only. It gives his birth on 11 May 1944 at Mueang Yala, his two speakerships of the Thai House of Representatives (1996–2000 and 2023–2025) — the first Thai Muslim to hold the office — and his interior, transport and agriculture portfolios and deputy premiership."
  es: "Artículo de la Wikipedia en inglés sobre Wan Muhamad Noor Matha (nacido en 1944); utilizado únicamente para datos sobre la persona. Indica su nacimiento el 11 de mayo de 1944 en Mueang Yala, sus dos mandatos como presidente de la Cámara de Representantes de Tailandia (1996-2000 y 2023-2025) —el primer musulmán tailandés en ocupar dicho cargo— y sus carteras de Interior, Transporte y Agricultura, así como su cargo de viceprimer ministro."
  fr: "Article de Wikipédia en anglais sur Wan Muhamad Noor Matha (né en 1944); utilisé uniquement pour les informations biographiques. Il indique sa naissance le 11 mai 1944 à Mueang Yala, ses deux mandats de président de la Chambre des représentants thaïlandaise (1996-2000 et 2023-2025) — le premier musulman thaïlandais à occuper ce poste — ainsi que ses portefeuilles ministériels (Intérieur, Transports et Agriculture) et son poste de vice-Premier ministre."
  ur: "وان محمد نور مٹھا ⁦(پیدائش 1944)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 11 مئی 1944 کو Mueang Yala میں ہوئی، تھائی ہاؤس آف ریپریزنٹیٹوز کی ان کی دو سپیکر شپ ⁦(1996–2000 اور 2023–2025)⁩ — عہدہ سنبھالنے والے پہلے تھائی مسلمان — اور ان کے داخلہ، ٹرانسپورٹ اور زراعت کے محکمے اور نائب وزیر اعظم۔"
  tr: "Wan Muhammad Nur Mata (1944 doğumlu) hakkında İngilizce Vikipedi makalesi; yalnızca varlık gerçekleri için kullanılmıştır. 11 Mayıs 1944'te Muang Yala'da doğmuş, Tayland Temsilciler Meclisi başkanlığı (1996–2000 ve 2023–2025) — bu görevi üstlenen ilk Taylandlı Müslüman olarak — ve içişleri, ulaşım ve tarım bakanlıkları ile başbakan yardımcılığı olarak hatırlanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Wan Muhammad Nur Mata (lahir 1944); hanya digunakan untuk fakta entitas. Ia dikenang lahir pada 11 Mei 1944 di Muang Yala, masa kepresidenannya di Dewan Perwakilan Thailand (1996–2000 dan 2023–2025) — Muslim Thailand pertama yang memegangnya — serta kementerian dalam negeri, transportasi, dan pertanian, serta masa jabatan wakil perdana menterinya."
