summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد حسني حتقاي، ضابط المخابرات الأردني الذي يدير دائرة المخابرات العامة منذ ١ أيار ٢٠١٩؛ تذكر ثلاثة عقوده داخل الدائرة ومناصبه في مكافحة الإرهاب والشؤون الخارجية وأصله الشركسي ودوره في أزمة ٢٠٢١ وأمن الحدود السورية، ولا تعطي تاريخ مولد ولا دينًا له."
  en: "English Wikipedia article on Ahmad Husni Hatoqay, Jordanian intelligence officer who has directed the General Intelligence Department since 1 May 2019; it records his three decades inside the GID, his counterterrorism and foreign-affairs posts, his Circassian descent and his role in the 2021 crisis and in Syria-border security, and gives no birth date and no faith for him."
  es: "Artículo de la Wikipedia en inglés sobre Ahmad Husni Hatoqay, oficial de inteligencia jordano que dirige el Departamento de Inteligencia General desde el 1 de mayo de 2019; en él se recogen sus tres décadas dentro del Departamento, sus puestos en materia de contraterrorismo y asuntos exteriores, su ascendencia circasiana y su papel en la crisis de 2021 y en la seguridad de la frontera con Siria, pero no se indica su fecha de nacimiento ni su religión."
  fr: "L'article de Wikipédia en anglais sur Ahmad Husni Hatoqay, officier du renseignement jordanien qui dirige le Département général du renseignement depuis le 1er mai 2019, relate ses trois décennies au sein du GID, ses postes dans la lutte contre le terrorisme et les affaires étrangères, ses origines circassiennes et son rôle dans la crise de 2021 et dans la sécurité à la frontière syrienne, sans toutefois mentionner sa date de naissance ni sa religion."
  ur: "1 مئی 2019 سے جنرل انٹیلی جنس ڈیپارٹمنٹ کو ہدایت کرنے والے اردنی انٹیلی جنس افسر احمد حسینی ہتوکے پر انگریزی ویکیپیڈیا کا مضمون؛ یہ جی آئی ڈی کے اندر ان کی تین دہائیوں، انسداد دہشت گردی اور خارجہ امور کی پوسٹس، اس کی سرکاسیائی نسل اور 2021 کے بحران اور شام کی سرحدی سلامتی میں اس کے کردار کو ریکارڈ کرتا ہے، اور اس کے لیے کوئی تاریخ پیدائش اور کوئی عقیدہ نہیں بتاتا۔"
