summary:
  ar: "مقالة ويكيبيديا التركية عن أحمد جودت أوران؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته سنة 1862 في حي أقصاراي بإسطنبول ووفاته في 27 مايو 1935 في أنقرة ودفنه في مقبرة أيوب بإسطنبول، وتذكر لقبه «إقدامجي» ومنفاه في فرنسا وسويسرا حتى 1923."
  en: "Turkish Wikipedia article on Ahmet Cevdet Oran; used for entity facts only. It gives his birth in 1862 in the Aksaray district of Istanbul, his death on 27 May 1935 at Ankara and his burial at Eyup Cemetery in Istanbul, and records his nickname 'Ikdamci', his exile in France and Switzerland until 1923, and his editorship of Ikdam from 1894."
  es: "Artículo de la Wikipedia en turco sobre Ahmet Cevdet Oran; utilizado únicamente para datos sobre la persona. Indica que nació en 1862 en el distrito de Aksaray, en Estambul, que falleció el 27 de mayo de 1935 en Ankara y que fue enterrado en el cementerio de Eyup, en Estambul. También registra su apodo, 'Ikdamci', su exilio en Francia y Suiza hasta 1923 y su labor como editor de Ikdam desde 1894."
  fr: "Article de Wikipédia en turc sur Ahmet Cevdet Oran; utilisé uniquement pour les informations biographiques. Il indique sa naissance en 1862 dans le quartier d’Aksaray à Istanbul, son décès le 27 mai 1935 à Ankara et son inhumation au cimetière d’Eyüp à Istanbul. On y trouve également mention de son surnom « Ikdamci », de son exil en France et en Suisse jusqu’en 1923, et de sa direction du journal Ikdam à partir de 1894."
  ur: "Ahmet Cevdet Oran پر ترکی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ استنبول کے اکسرے ضلع میں 1862 میں ان کی پیدائش، 27 مئی 1935 کو انقرہ میں ان کی موت اور استنبول کے ایوپ قبرستان میں ان کی تدفین، اور اس کا عرفی نام 'اکدامچی'، 1923 تک فرانس اور سوئٹزرلینڈ میں ان کی جلاوطنی اور 1923 سے اقدام کی ان کی ادارت درج ہے۔"
  tr: "Ahmet Cevdet Oran hakkında Türkçe Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1862 yılında İstanbul'un Aksuray ilçesinde doğmuş, 27 Mayıs 1935'te Ankara'da vefat etmiş ve İstanbul'daki Eyüp Mezarlığı'na defnedilmiştir. Soyadı 'Iqdamci' ve 1923'e kadar Fransa ile İsviçre'deki sürgünlüğü geçmektedir."
  id: "Artikel Wikipedia Turki tentang Ahmet Cevdet Oran; digunakan hanya untuk fakta entitas. Ia lahir pada tahun 1862 di distrik Aksuray, Istanbul dan meninggal pada 27 Mei 1935 di Ankara, serta dimakamkan di Pemakaman Eyüp di Istanbul. Nama keluarganya 'Iqdamci' dan pengasingannya di Prancis dan Swiss hingga tahun 1923 disebutkan."
