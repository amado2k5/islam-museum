  ar: "مقالة ويكيبيديا التركية عن أحمد جودت أوران؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته سنة 1862 في حي أقصاراي بإسطنبول ووفاته في 27 مايو 1935 في أنقرة ودفنه في مقبرة أيوب بإسطنبول، وتذكر لقبه «إقدامجي» ومنفاه في فرنسا وسويسرا حتى 1923."
  en: "Turkish Wikipedia article on Ahmet Cevdet Oran; used for entity facts only. It gives his birth in 1862 in the Aksaray district of Istanbul, his death on 27 May 1935 at Ankara and his burial at Eyup Cemetery in Istanbul, and records his nickname 'Ikdamci', his exile in France and Switzerland until 1923, and his editorship of Ikdam from 1894."
