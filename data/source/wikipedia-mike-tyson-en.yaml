summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مايك تايسون؛ تُستخدم لوقائع الكيان فقط. تذكر مولده باسم مايكل جيرارد تايسون في 30 يونيو 1966 في بروكلين بمدينة نيويورك، وألقابه في الوزن الثقيل وسجل مسيرته، وإدانته سنة 1992 وسجنه، وقسماً عن ديانته يروي نشأته الكاثوليكية ومعموديته المعمدانية سنة 1988 واعتناقه الإسلام لاحقاً."
  en: "English Wikipedia article on Mike Tyson; used for entity facts only. It gives his birth as Michael Gerard Tyson on 30 June 1966 in Brooklyn, New York City, his heavyweight titles and career record, his 1992 conviction and imprisonment, and a religion section recording his Catholic upbringing, his 1988 Baptist baptism and his later conversion to Islam."
  es: "Artículo de la Wikipedia en inglés sobre Mike Tyson; utilizado únicamente para obtener información sobre la persona. En él se detalla su nacimiento como Michael Gerard Tyson el 30 de junio de 1966 en Brooklyn, Nueva York, sus títulos de peso pesado y su trayectoria profesional, su condena y encarcelamiento en 1992, y una sección sobre religión que recoge su educación católica, su bautismo bautista en 1988 y su posterior conversión al islam."
  fr: "Article Wikipédia en anglais sur Mike Tyson; utilisé uniquement pour les informations le concernant. Il mentionne sa naissance sous le nom de Michael Gerard Tyson le 30 juin 1966 à Brooklyn, New York, ses titres de champion du monde des poids lourds et son palmarès, sa condamnation et son emprisonnement en 1992, ainsi qu'une section sur sa religion relatant son éducation catholique, son baptême baptiste en 1988 et sa conversion ultérieure à l'islam."
  ur: "مائیک ٹائسن پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ مائیکل جیرارڈ ٹائسن کی حیثیت سے 30 جون 1966 کو بروکلین، نیو یارک سٹی میں جنم لیتا ہے، اس کے ہیوی ویٹ ٹائٹلز اور کیریئر کا ریکارڈ، اس کی 1992 کی سزا اور قید، اور ایک مذہب سیکشن جس میں اس کی کیتھولک پرورش، اس کا 1988 کا بپتسمہ دینے والا بپتسمہ اور اس کے بعد اسلام قبول کیا گیا تھا۔"
