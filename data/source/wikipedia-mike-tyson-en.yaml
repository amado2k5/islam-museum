reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026. Its religion section states that Tyson converted to Islam before entering prison and made no efforts to correct what was reported in the media, and that it was falsely claimed that his conversion happened during prison and that he adopted the Muslim name Malik Abdul Aziz (some sources report it as Malik Shabazz): he never changed his given name to an Islamic one. It records his Umrah journeys of July 2010 and December 2022 and his December 2013 statement that he was very grateful to be a Muslim. It names no school for him. Revision identifiers could not be recorded in this run; the article was consulted directly on the date given."
