  ar: "مقالة ويكيبيديا الإنجليزية عن مايك تايسون؛ تُستخدم لوقائع الكيان فقط. تذكر مولده باسم مايكل جيرارد تايسون في 30 يونيو 1966 في بروكلين بمدينة نيويورك، وألقابه في الوزن الثقيل وسجل مسيرته، وإدانته سنة 1992 وسجنه، وقسماً عن ديانته يروي نشأته الكاثوليكية ومعموديته المعمدانية سنة 1988 واعتناقه الإسلام لاحقاً."
  en: "English Wikipedia article on Mike Tyson; used for entity facts only. It gives his birth as Michael Gerard Tyson on 30 June 1966 in Brooklyn, New York City, his heavyweight titles and career record, his 1992 conviction and imprisonment, and a religion section recording his Catholic upbringing, his 1988 Baptist baptism and his later conversion to Islam."
