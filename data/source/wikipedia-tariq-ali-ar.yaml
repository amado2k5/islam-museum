summary:
  ar: "مقالة ويكيبيديا العربية عن طارق علي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في لاهور سنة 1943 ونشاطه السياسي وكتاباته. تصفه مقدمة المقالة بأنه «مسلم علماني»، وهو وصف تحريري في المقدمة لا يستند في نص المقالة إلى مصدر يسمي انتماءه."
  en: "Arabic Wikipedia article on Tariq Ali; used for entity facts only. It covers his 1943 birth in Lahore, his political activism and his writings. Its lead labels him a 'secular Muslim' — an editorial label in the lead, not supported in the article's text by any source naming an affiliation for him."
  es: "Artículo de Wikipedia en árabe sobre Tariq Ali; utilizado únicamente para obtener información sobre la persona. Abarca su nacimiento en Lahore en 1943, su activismo político y sus escritos. En su introducción, lo describe como un «musulmán secular», una etiqueta editorial que no se encuentra respaldada en el texto del artículo por ninguna fuente que indique su afiliación religiosa."
  fr: "Article de Wikipédia en arabe sur Tariq Ali; utilisé uniquement à titre informatif. Il relate sa naissance à Lahore en 1943, son engagement politique et ses écrits. Son introduction le qualifie de « musulman laïc » – une affirmation éditoriale non étayée par le texte par une source mentionnant une quelconque affiliation religieuse."
  ur: "طارق علی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی لاہور میں 1943 کی پیدائش، ان کی سیاسی سرگرمی اور ان کی تحریروں کا احاطہ کیا گیا ہے۔ اس کا لیڈ اسے 'سیکولر مسلمان' کا لیبل کرتا ہے - ایک ایڈیٹوریل لیبل جس کی قیادت اس کے لیے کسی وابستگی کا نام دیتے ہوئے کسی بھی ذریعہ سے مضمون کے متن میں حمایت نہیں کی گئی ہے۔"
