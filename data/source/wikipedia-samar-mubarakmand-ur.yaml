summary:
  ar: "مقالة ويكيبيديا الأردية عن سمر مبارك مند؛ تُستخدم لوقائع الكيان فقط. تتناول مساره في البرنامج النووي الباكستاني، ولا يسمّي نصها دينا له؛ وتصنيفها «علماء مسلمون» تصنيف ملفي لا يُعدّ إثباتا."
  en: "Urdu Wikipedia article on Samar Mubarakmand; used for entity facts only. It covers his career in Pakistan's nuclear programme; its text names no religion for him, and its 'Muslim scientists' category is a filing, not an attestation."
  es: "Artículo de Wikipedia en urdu sobre Samar Mubarakmand; se utiliza únicamente para obtener información sobre la persona. Describe su trayectoria en el programa nuclear de Pakistán; el texto no menciona su religión y la categoría de «científicos musulmanes» es una declaración, no una certificación."
  fr: "Article de Wikipédia en ourdou sur Samar Mubarakmand; utilisé uniquement à titre informatif. Il relate sa carrière au sein du programme nucléaire pakistanais; le texte ne mentionne aucune religion pour lui, et la catégorie « scientifiques musulmans » est un classement, et non une attestation."
  ur: "ثمر مبارک مند پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں پاکستان کے جوہری پروگرام میں ان کے کیریئر کا احاطہ کیا گیا ہے۔ اس کا متن اس کے لیے کسی مذہب کا نام نہیں رکھتا، اور اس کے 'مسلم سائنسدانوں' کا زمرہ ایک فائلنگ ہے، تصدیق نہیں۔"
  tr: "Samar Mubarak Mand hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Pakistan nükleer programındaki sürecini kapsar ve metninde onun için bir din olarak adlandırılmaz; ve \"Müslüman alimler\" olarak sınıflandırılması kanıt sayılmayan bir dosya sınıflandırmasıdır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Samar Mubarak Mand; hanya digunakan untuk fakta entitas. Artikel itu membahas jalannya dalam program nuklir Pakistan, dan teksnya tidak menyebutnya sebagai agama baginya; dan klasifikasinya sebagai \"ulama Muslim\" adalah klasifikasi berkas yang tidak dianggap sebagai bukti."
