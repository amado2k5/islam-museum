  en: "French Wikipedia article on Samori Touré; used for entity facts only. A long article from the French Africanist tradition that gives his religion as Islam with no school named, and narrates in detail the Islamisation of his empire between 1881 and 1894, his wars, and his death at Ndjolé in 1900."
