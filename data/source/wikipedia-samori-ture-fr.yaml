reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 24 October 2026. It draws on the French scholarly tradition (Person's three-volume Samori: une révolution dyula; the Archives nationales d'outre-mer; Fofana; Camara). It gives his birth c. 1830 at Manyambaladugu, his title Almamy dated 1873–74, his institution of marabout political commissars (1881–1894), the alliance with Kankan's ulema and the endorsement of its governor Karamoko Dayawara, the Kadialy revolt, the treaties of Kénieba-Koura (28 March 1886) and Niako (February 1889), the siege of Sikasso, the crossing into the Baoulé forest, the capture on 29 September 1898, the exile (Kayes, Saint-Louis, the suicide attempt, deportation to Gabon on 5 February 1899) and his death of pneumonia at Ndjolé on 2 June 1900. Its infobox gives his religion as Islam, generically; the article nowhere names the Maliki school or any madhhab for him — a silence the record's faith note relies on. It also carries the assessments of his rule (organisation, forced conversions, massacres and the post-colonial reassessments) attributed to their authors."
