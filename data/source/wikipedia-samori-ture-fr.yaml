summary:
  ar: "مقالة ويكيبيديا الفرنسية عن ساموري توري؛ تُستخدم لوقائع الكيان فقط. مقالة موسّعة من التاريخ الفرنسي الأفريقي تذكر دينه «الإسلام» دون مذهب، وتسرد بالتفصيل أسلمة إمبراطوريته من 1881 إلى 1894، وحروبه ووفاته في ندجولي سنة 1900."
  en: "French Wikipedia article on Samori Touré; used for entity facts only. A long article from the French Africanist tradition that gives his religion as Islam with no school named, and narrates in detail the Islamisation of his empire between 1881 and 1894, his wars, and his death at Ndjolé in 1900."
  es: "Artículo de la Wikipedia en francés sobre Samori Touré; utilizado únicamente para datos sobre la persona. Un extenso artículo de la tradición africanista francesa que indica que profesaba el islam, sin mencionar ninguna escuela, y narra en detalle la islamización de su imperio entre 1881 y 1894, sus guerras y su muerte en Ndjolé en 1900."
  fr: "Article de Wikipédia en français sur Samori Touré; utilisé uniquement pour les informations factuelles. Cet article long, issu de la tradition africaniste française, le présente comme musulman sans préciser d’école et relate en détail l’islamisation de son empire entre 1881 et 1894, ses guerres et sa mort à Ndjolé en 1900."
  ur: "Samori Touré پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ فرانسیسی افریقی روایت کا ایک طویل مضمون جو اس کے مذہب کو اسلام کے طور پر دیتا ہے جس میں کسی اسکول کا نام نہیں ہے، اور 1881 اور 1894 کے درمیان اس کی سلطنت کی اسلامائزیشن، اس کی جنگیں، اور 1900 میں Ndjolé میں اس کی موت کو تفصیل سے بیان کرتا ہے۔"
  tr: "Samori Touré hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Fransız-Afrika tarihi üzerine kapsamlı bir makale, onun dini \"İslam\"ı mezhepsiz olarak anmakta, 1881'den 1894'e kadar imparatorluğunun İslamlaşması, savaşları ve 1900'de Ndjoli'deki ölümü detaylandırılmıştır."
  id: "Artikel Wikipedia Prancis tentang Samori Touré; digunakan hanya untuk fakta entitas. Sebuah artikel luas tentang sejarah Prancis-Afrika menyebutkan agamanya \"Islam\" tanpa sekte, merinci Islamisasi kekaisarannya dari tahun 1881 hingga 1894, perang-perangnya, dan kematiannya di Ndjoli pada tahun 1900."
