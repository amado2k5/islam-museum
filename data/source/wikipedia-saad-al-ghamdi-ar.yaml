summary:
  ar: "مقالة ويكيبيديا العربية عن سعد الغامدي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بالدمام في 7 أغسطس 1967 الموافق 1 جمادى الأولى 1387 هـ، ودراسته بها وتخرجه في كلية الشريعة بالأحساء، وإجازته برواية حفص سنة 1417 هـ، وأعماله في التدريس والإشراف وإمامة جامع كانو والمشاركة في تراويح المسجد النبوي 1430 هـ؛ وصندوقها يعطي العقيدة أهل السنة والجماعة وحقل الفقه فارغ."
  en: "Arabic Wikipedia article on Saad Al-Ghamdi; used for entity facts only. It gives his birth at Dammam on 7 August 1967, paired with 1 Jumada al-Ula 1387 AH, his schooling there and his sharia degree at Al-Ahsa, his ijaza in the Hafs recitation in 1417 AH, and his work in teaching and supervision, the imamate of the Kanoo Mosque and his share in the Prophet's Mosque Tarawih of 1430 AH; its infobox gives his creed as Ahl al-Sunna wa-l-Jama'a with the fiqh field left empty."
