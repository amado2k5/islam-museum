summary:
  ar: "مقالة ويكيبيديا العربية عن سعد الغامدي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بالدمام في 7 أغسطس 1967 الموافق 1 جمادى الأولى 1387 هـ، ودراسته بها وتخرجه في كلية الشريعة بالأحساء، وإجازته برواية حفص سنة 1417 هـ، وأعماله في التدريس والإشراف وإمامة جامع كانو والمشاركة في تراويح المسجد النبوي 1430 هـ؛ وصندوقها يعطي العقيدة أهل السنة والجماعة وحقل الفقه فارغ."
  en: "Arabic Wikipedia article on Saad Al-Ghamdi; used for entity facts only. It gives his birth at Dammam on 7 August 1967, paired with 1 Jumada al-Ula 1387 AH, his schooling there and his sharia degree at Al-Ahsa, his ijaza in the Hafs recitation in 1417 AH, and his work in teaching and supervision, the imamate of the Kanoo Mosque and his share in the Prophet's Mosque Tarawih of 1430 AH; its infobox gives his creed as Ahl al-Sunna wa-l-Jama'a with the fiqh field left empty."
  es: "Artículo de Wikipedia en árabe sobre Saad Al-Ghamdi; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Dammam el 7 de agosto de 1967, junto con el 1 de Jumada al-Ula de 1387 AH, su educación allí y su título de sharia en Al-Ahsa, su ijaza en la recitación de Hafs en 1417 AH, y su trabajo en la enseñanza y supervisión, el imamato de la Mezquita de Kanoo y su participación en el Tarawih de la Mezquita del Profeta de 1430 AH; su ficha informativa indica que su credo es Ahl al-Sunna wa-l-Jama'a, dejando el campo de fiqh vacío."
  fr: "L'article de Wikipédia en arabe consacré à Saad Al-Ghamdi, utilisé uniquement pour les informations le concernant, indique sa naissance à Dammam le 7 août 1967 (1er Jumada al-Ula 1387 AH), sa scolarité dans cette ville et son diplôme de charia à Al-Ahsa, son ijaza pour la récitation du Hafs en 1417 AH, ainsi que son travail d'enseignement et de supervision, son imamat de la mosquée Kanoo et sa participation aux prières de Tarawih à la mosquée du Prophète en 1430 AH. Son infobox précise qu'il appartenait à la Sunna wa-l-Jama'a (Ahl al-Sunna wa-l-Jama'a), le champ relatif à la jurisprudence islamique (fiqh) étant laissé vide."
  ur: "سعد الغامدی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 7 اگست 1967 کو دمام میں 1 جمادی الاول 1387 ہجری کو پیدا ہوا، وہاں اس کی تعلیم اور الاحساء میں اس کی شرعی ڈگری، 1417 ہجری میں حفص کی تلاوت میں اس کا اعجاز، اور تدریس اور نگرانی میں اس کا کام، مسجد نبوی میں کانوۃ النبی کی امامت اور ان کی شرکت۔ 1430ھ؛ اس کا معلومات خانہ اس کا عقیدہ اہل السنۃ والجماعۃ دیتا ہے اور فقہ کا میدان خالی رہ گیا ہے۔"
  tr: "Saad al-Ghamdi hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 7 Ağustos 1967'de Dammam'da doğduğundan, yani 1 Cumedül-Avwel 1387 Hicri'ye karşılık gelen makaleden, oradaki eğitiminden, Al-Ahsa'daki Şeriat Koleji'nden mezuniyetinden, 1417 Hicri'de Hafs rivayetine izin vermesinden, öğretisinden, gözetmenliğinden, Kano Camii'nde namazını yönetmesinden ve 1430 Hicri Müslim'de Peygamber Camii'nde teravih namazlarına katılmasından bahseder; fonu Ehl-sünnet vella-Cema'ah'a bir mezun olur ve hukuk alanı boştur."
  id: "Artikel Wikipedia Arab tentang Saad Al-Ghamdi; digunakan hanya untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya di Dammam pada 7 Agustus 1967, sesuai dengan 1 Jumada al-Awwal 1387 H, studinya di sana, kelulusannya dari Perguruan Tinggi Syariah di Al-Ahsa, otorisasi untuk narasi Hafs pada tahun 1417 H, pengajaran, pengawasannya, memimpin shalat di Masjid Kano, dan partisipasi dalam shalat Taraweeh di Masjid Nabi pada tahun 1430 H; dana tersebut memberikan ajaran kepada Ahl al-Sunnah wal-Jama'ah, dan bidang hukum menjadi kosong."
