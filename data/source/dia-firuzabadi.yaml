reliability_note: "Read in the museum's session on 20 November 2026. It describes him as the Arab language, exegesis and hadith scholar known for al-Qamus al-Muhit; gives his birth in Rabi' II or Jumada II 729 (February or April 1329) at Kazerun in Fars, and his death in 817/1415 in the cross-reference of the dictionary's entry; names his early teachers (his father, Qiwam al-Din Abdallah ibn Mahmud, al-Zarandi), his study of the Sahih of al-Bukhari in Shiraz, Wasit, Baghdad and Damascus, and his stay in Jerusalem and Mecca. Used for entity facts only."
