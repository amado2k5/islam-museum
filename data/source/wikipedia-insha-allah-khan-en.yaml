reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives him as Syed Insha Allah Khan, born about 1752 at Murshidabad, where his father the physician Mir Masha Allah Khan served Nawab Siraj-ud-Daula, and dead on 19 May 1817 at Lucknow after years at the Delhi and Lucknow courts; his Darya-e-Latafat of 1807 is the first grammar of Urdu and his Rani Ketki Ki Kahani among the earliest Hindi prose. It names no school or order for him. Checked 1 November 2026."
