reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia. Read in full on 1 November 2026. It gives his original name as Mir Muhammad Said, his birth in about 1591 at Ardistan in Ispahan — the Ardistan reading preserved against the English article's Isfahan in the person record — his clerkship under a diamond merchant, his own diamond and maritime trade, his vizierate of Golconda and Karnatak conquests, his Mughal titles and appointment as diwan-i-kul, the pursuit of Shah Shuja to Dhaka, his Bengal administration and building works, the Assam campaign, and his death on the return, on a boat off Khizrpur, on 30 March 1663. It names no faith for him; the naming of Shia is in the same author's survey entry 'Islam, Bengal', a separate source record."
