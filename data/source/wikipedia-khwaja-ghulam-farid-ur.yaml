summary:
  ar: "مقالة ويكيبيديا الأردية عن خواجة غلام فريد؛ تعطي مولده في 25 تشرين الثاني 1845 ⁦(25 ذي القعدة 1261هـ)⁩ في تشاتشران ووفاته في 24 تموز 1901، وتذكر انتماءه إلى السلسلة الجشتية النظامية وبيعته لأخيه الأكبر خواجة فخر جهان في الثالثة عشرة وجلوسه بعده على سجادة الإرشاد، ويحمل صندوق معلوماتها حقل مكتب فکر: أهل السنة الحنفي."
  en: "The Urdu Wikipedia article on Khwaja Ghulam Farid; it gives his birth on 25 November 1845 (25 Dhu al-Qa'da 1261 AH) at Chachran and his death on 24 July 1901, states his belonging to the Chishti Nizami silsila, his bay'ah at thirteen to his elder brother Khwaja Fakhr Jahan and his succession to his brother's seat, and its infobox carries a school-of-thought field reading Ahl-e-Sunnat Hanafi."
  es: "El artículo de Wikipedia en urdu sobre Khwaja Ghulam Farid; indica su nacimiento el 25 de noviembre de 1845 (25 Dhu al-Qa'da 1261 AH) en Chachran y su muerte el 24 de julio de 1901, afirma su pertenencia a la silsila Chishti Nizami, su bay'ah a los trece años a su hermano mayor Khwaja Fakhr Jahan y su sucesión al trono de su hermano, y su ficha informativa contiene un campo de escuela de pensamiento que indica Ahl-e-Sunnat Hanafi."
  fr: "L'article de Wikipédia en ourdou sur Khwaja Ghulam Farid; il indique sa naissance le 25 novembre 1845 (25 Dhu al-Qa'da 1261 AH) à Chachran et sa mort le 24 juillet 1901, précise son appartenance à la silsila Chishti Nizami, son bay'ah à treize ans à son frère aîné Khwaja Fakhr Jahan et sa succession au siège de son frère, et son infobox comporte un champ d'école de pensée indiquant Ahl-e-Sunnat Hanafi."
  ur: "خواجہ غلام فرید پر اردو ویکیپیڈیا کا مضمون؛ یہ ان کی پیدائش 25 نومبر 1845 ⁦(25 ذی القعدہ 1261ھ)⁩ کو چاچڑاں میں ہوئی اور 24 جولائی 1901 کو ان کی وفات ہوئی، ان کا تعلق چشتی نظامی کے سلسلۂ سے تھا، ان کی بیعت تیرہ سال کی عمر میں ان کے بڑے بھائی خواجہ فخر جہاں سے ہوئی اور ان کی گاڑی کی نشست اور ان کے مکتب میں ان کے بھائی کی جانشینی۔ میدان اہلسنت حنفی پڑھنا۔"
