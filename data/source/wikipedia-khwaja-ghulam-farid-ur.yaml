summary:
  ar: "مقالة ويكيبيديا الأردية عن خواجة غلام فريد؛ تعطي مولده في 25 تشرين الثاني 1845 (25 ذي القعدة 1261هـ) في تشاتشران ووفاته في 24 تموز 1901، وتذكر انتماءه إلى السلسلة الجشتية النظامية وبيعته لأخيه الأكبر خواجة فخر جهان في الثالثة عشرة وجلوسه بعده على سجادة الإرشاد، ويحمل صندوق معلوماتها حقل مكتب فکر: أهل السنة الحنفي."
  en: "The Urdu Wikipedia article on Khwaja Ghulam Farid; it gives his birth on 25 November 1845 (25 Dhu al-Qa'da 1261 AH) at Chachran and his death on 24 July 1901, states his belonging to the Chishti Nizami silsila, his bay'ah at thirteen to his elder brother Khwaja Fakhr Jahan and his succession to his brother's seat, and its infobox carries a school-of-thought field reading Ahl-e-Sunnat Hanafi."
