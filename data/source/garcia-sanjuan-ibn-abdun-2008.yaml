summary:
  ar: "دراسة أكاديمية محكّمة لمعالجة الفقيه الإشبيلي محمد بن أحمد بن عبدون لليهود والنصارى في رسالته في القضاء والحسبة في إشبيلية المرابطية أوائل القرن الثاني عشر الميلادي؛ تنقل عن شالميتا أن ابن عبدون ربما لم يكن قاضيًا فعليًا بل مرشحًا للقضاء."
  en: "Peer-reviewed study of how the Sevillian jurist Muhammad ibn Ahmad ibn Abdun treats Jews and Christians in his treatise on the judiciary and hisba in Almoravid Seville (early 12th century); reports Chalmeta's argument that Ibn Abdun may have been only a candidate for the qadiship rather than a serving qadi."
  ur: "مرابطی اشبیلیہ میں فقیہ محمد بن احمد بن عبدون کے رسالے میں یہود و نصاریٰ کے معاملے پر محققانہ مطالعہ؛ چالمیٹا کی یہ رائے نقل کرتا ہے کہ ابن عبدون شاید قاضی کے منصب کے امیدوار تھے، عامل قاضی نہیں۔"
