label:
  ar: "غارسيا-سانخوان، «يهود ونصارى في إشبيلية المرابطية عند الفقيه ابن عبدون» (2008)"
  en: "Garcia-Sanjuan, 'Jews and Christians in Almoravid Seville as Portrayed by the Islamic Jurist Ibn Abdun' (2008)"
  ur: "گارسیا سانخوان، «ابن عبدون کی نظر میں مرابطی اشبیلیہ کے یہود و نصاریٰ» ⁦(2008ء)⁩"
summary:
  ar: "دراسة أكاديمية محكّمة لمعالجة الفقيه الإشبيلي محمد بن أحمد بن عبدون لليهود والنصارى في رسالته في القضاء والحسبة في إشبيلية المرابطية أوائل القرن الثاني عشر الميلادي؛ تنقل عن شالميتا أن ابن عبدون ربما لم يكن قاضيًا فعليًا بل مرشحًا للقضاء."
  en: "Peer-reviewed study of how the Sevillian jurist Muhammad ibn Ahmad ibn Abdun treats Jews and Christians in his treatise on the judiciary and hisba in Almoravid Seville (early 12th century); reports Chalmeta's argument that Ibn Abdun may have been only a candidate for the qadiship rather than a serving qadi."
  ur: "مرابطی اشبیلیہ میں فقیہ محمد بن احمد بن عبدون کے رسالے میں یہود و نصاریٰ کے معاملے پر محققانہ مطالعہ؛ چالمیٹا کی یہ رائے نقل کرتا ہے کہ ابن عبدون شاید قاضی کے منصب کے امیدوار تھے، عامل قاضی نہیں۔"
  es: "Estudio revisado por pares sobre cómo el jurista sevillano Muhammad ibn Ahmad ibn Abdun trata a judíos y cristianos en su tratado sobre el poder judicial y la hisba en la Sevilla almorávide (principios del siglo XII); recoge el argumento de Chalmeta de que Ibn Abdun puede haber sido solo un candidato al cadí en lugar de un cadí en ejercicio."
  fr: "Étude évaluée par des pairs sur la manière dont le juriste sévillan Muhammad ibn Ahmad ibn Abdun traite les juifs et les chrétiens dans son traité sur le système judiciaire et la hisba dans la Séville almoravide (début du XIIe siècle); rapporte l'argument de Chalmeta selon lequel Ibn Abdun n'était peut-être qu'un candidat à la fonction de cadi plutôt qu'un cadi en exercice."
title: "Jews and Christians in Almoravid Seville as Portrayed by the Islamic Jurist Ibn Abdun"
