  ar: "مقالة ويكيبيديا الإنجليزية عن آباي قونانبايولي؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 10 أغسطس 1845 ووفاته في 6 يوليو 1904، ودراسته في مدرسة أحمد رضا ثم المدرسة الروسية في سيمي، وترجماته للشعراء الروس والأوروبيين، وكتابه «كتاب الكلمات»."
  en: "English Wikipedia article on Abai Qunanbaiuly; used for entity facts only. It recounts his birth on 10 August 1845 and death on 6 July 1904, his schooling at Ahmed Ryza's madrasa and then at a Russian school in Semipalatinsk, his translations of Russian and European poets, and his Book of Words."
