summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن آباي قونانبايولي؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 10 أغسطس 1845 ووفاته في 6 يوليو 1904، ودراسته في مدرسة أحمد رضا ثم المدرسة الروسية في سيمي، وترجماته للشعراء الروس والأوروبيين، وكتابه «كتاب الكلمات»."
  en: "English Wikipedia article on Abai Qunanbaiuly; used for entity facts only. It recounts his birth on 10 August 1845 and death on 6 July 1904, his schooling at Ahmed Ryza's madrasa and then at a Russian school in Semipalatinsk, his translations of Russian and European poets, and his Book of Words."
  es: "Artículo de la Wikipedia en inglés sobre Abai Qunanbaiuly; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 10 de agosto de 1845 y su muerte el 6 de julio de 1904, su educación en la madrasa de Ahmed Ryza y posteriormente en una escuela rusa en Semipalatinsk, sus traducciones de poetas rusos y europeos, y su Libro de las Palabras."
  fr: "Article de Wikipédia en anglais sur Abai Qunanbaiuly; utilisé uniquement pour les informations sur l'entité. Il relate sa naissance le 10 août 1845 et sa mort le 6 juillet 1904, sa scolarité à la madrasa d'Ahmed Ryza puis dans une école russe à Semipalatinsk, ses traductions de poètes russes et européens, et son Livre des mots."
