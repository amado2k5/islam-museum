summary:
  ar: "الصفحة «ابن جني» — Wikipedia (Arabic)؛ لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: كتاب «al-Tasrif al-Muluki» ومؤلفه وتاريخه."
  en: "The page «ابن جني» — Wikipedia (Arabic); summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the book «al-Tasrif al-Muluki»: its author and date."
  ur: "صفحہ «ابن جني» — Wikipedia (Arabic)؛ اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: کتاب «al-Tasrif al-Muluki»، اس کے مصنف اور تاریخ کا بیان۔"
  fr: "La page «ابن جني» — Wikipedia (Arabic) ; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : le livre « al-Tasrif al-Muluki » : son auteur et sa date."
  es: "La página «ابن جني» — Wikipedia (Arabic); resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: el libro «al-Tasrif al-Muluki»: su autor y su fecha."
