  en: "Al Balagh Academy: Ustadah Fatima Barkatulla"
  ur: "«البلاغ اکیڈمی: فاطمہ برکۃ اللہ کی سیرت»"
summary:
  ar: «صفحة سيرة فاطمة بركة الله في أكاديمية البلاغ التي تدرّس فيها (رُوجعت في أكتوبر 2026). المصدر الرئيسي لدراستها في مصر وفي المعاهد البريطانية، وتخصصها في الفقه، ودرجة الماجستير من كلية سواس للحقوق، وتأسيسها «Muslim Womanhood» وإدارتها مؤتمر «Seeds of Change»، وكتبها وجوائزها.»
  en: "The teacher biography of Fatima Barkatulla at Al Balagh Academy, where she teaches (consulted October 2026). The principal source for her studies in Egypt and at British seminaries, her fiqh specialisation, her SOAS master's degree, her founding of Muslim Womanhood and direction of the Seeds of Change conference, her books and her awards."
  ur: «البلاغ اکیڈمی میں فاطمہ برکۃ اللہ کی سیرت کا صفحہ (اکتوبر 2026 میں رجوع کیا گیا)۔»
