id: source/albalagh-fatima-barkatulla
class: source
label:
  ar: "«أكاديمية البلاغ: سيرة الأستاذة فاطمة بركة الله»"
  en: "Al Balagh Academy: Ustadah Fatima Barkatulla"
  ur: "«البلاغ اکیڈمی: فاطمہ برکۃ اللہ کی سیرت»"
summary:
  ar: «صفحة سيرة فاطمة بركة الله في أكاديمية البلاغ التي تدرّس فيها ⁦(رُوجعت في أكتوبر 2026)⁩. المصدر الرئيسي لدراستها في مصر وفي المعاهد البريطانية، وتخصصها في الفقه، ودرجة الماجستير من كلية سواس للحقوق، وتأسيسها «Muslim Womanhood» وإدارتها مؤتمر «Seeds of Change»، وكتبها وجوائزها.»
  en: "The teacher biography of Fatima Barkatulla at Al Balagh Academy, where she teaches (consulted October 2026). The principal source for her studies in Egypt and at British seminaries, her fiqh specialisation, her SOAS master's degree, her founding of Muslim Womanhood and direction of the Seeds of Change conference, her books and her awards."
  ur: «البلاغ اکیڈمی میں فاطمہ برکۃ اللہ کی سیرت کا صفحہ ⁦(اکتوبر 2026 میں رجوع کیا گیا)⁩۔»
  es: "Biografía de la profesora Fatima Barkatulla en la Academia Al Balagh, donde imparte clases (consultada en octubre de 2026). Fuente principal de sus estudios en Egipto y en seminarios británicos, su especialización en fiqh, su maestría en SOAS, la fundación de Muslim Womanhood y la dirección de la conferencia Seeds of Change, sus libros y sus premios."
  fr: "Biographie de Fatima Barkatulla, enseignante à l'Académie Al Balagh (consultée en octobre 2026). Source principale concernant ses études en Égypte et dans des séminaires britanniques, sa spécialisation en fiqh, son master de la SOAS, la fondation de Muslim Womanhood et la direction de la conférence Seeds of Change, ses ouvrages et ses distinctions."
  tr: "\"Fatima Baraka Allah'ın eğitim gördüğü Al-Balagh Akademisi'ndeki biyografisinin sayfası (Ekim 2026'da incelendi). Mısır'daki ve İngiliz enstitülerindeki çalışmalarının ana kaynağı, hukuk uzmanlığı, Sawas Hukuk Fakültesi'nden yüksek lisans derecesi, 'Müslüman Kadınlığı' kuruluşu ve 'Değişim Tohumları' konferansının yönetimi, kitapları ve ödülleri.\""
  id: "\"Halaman biografi Fatima Baraka Allah di Al-Balagh Academy tempat ia belajar (ditinjau pada Oktober 2026). Sumber utama studinya di Mesir dan di institut-institut Inggris, spesialisasinya dalam bidang hukum, gelar master dari Sawas Law School, pendirian 'Muslim Womanhood' dan pengelolaan konferensi 'Seeds of Change', buku-bukunya, dan penghargaan yang dimilikinya.\""
