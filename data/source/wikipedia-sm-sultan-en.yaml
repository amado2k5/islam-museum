  ar: "مقالة ويكيبيديا الإنجليزية عن إس إم سلطان (شيخ محمد سلطان)؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 10 أغسطس 1923 في ماشيمديا بنارايل ووفاته في 10 أكتوبر 1994 في جيسور، ولوحاته للفلاحين البنغال ذوي البنية الضخمة، وانضمامه في شبابه إلى حركة خاكسار، وجوائزه — دون أن تسمّي له مذهبًا."
  en: "English Wikipedia article on SM Sultan (Sheikh Mohammed Sultan); used for entity facts only. It gives his birth on 10 August 1923 at Machimdia, Narail, and his death on 10 October 1994 at Jessore, his paintings of muscular Bengali peasants, his youthful joining of the Khaksar movement, and his awards. It names no school for him; a movement affiliation is not a school attestation."
