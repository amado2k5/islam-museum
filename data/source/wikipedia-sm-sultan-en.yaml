summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إس إم سلطان ⁦(شيخ محمد سلطان)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 10 أغسطس 1923 في ماشيمديا بنارايل ووفاته في 10 أكتوبر 1994 في جيسور، ولوحاته للفلاحين البنغال ذوي البنية الضخمة، وانضمامه في شبابه إلى حركة خاكسار، وجوائزه — دون أن تسمّي له مذهبًا."
  en: "English Wikipedia article on SM Sultan (Sheikh Mohammed Sultan); used for entity facts only. It gives his birth on 10 August 1923 at Machimdia, Narail, and his death on 10 October 1994 at Jessore, his paintings of muscular Bengali peasants, his youthful joining of the Khaksar movement, and his awards. It names no school for him; a movement affiliation is not a school attestation."
  es: "Artículo de la Wikipedia en inglés sobre SM Sultan (Sheikh Mohammed Sultan); utilizado únicamente para datos biográficos. Indica su nacimiento el 10 de agosto de 1923 en Machimdia, Narail, y su fallecimiento el 10 de octubre de 1994 en Jessore, sus pinturas de campesinos bengalíes musculosos, su ingreso en el movimiento Khaksar en su juventud y sus premios. No menciona ninguna escuela a la que pertenezca; la afiliación a un movimiento no equivale a una acreditación académica."
  fr: "Article de Wikipédia en anglais sur SM Sultan (Cheikh Mohammed Sultan); utilisé uniquement pour les informations sur l'individu. Il indique sa naissance le 10 août 1923 à Machimdia, Narail, et son décès le 10 octobre 1994 à Jessore, ses peintures de paysans bengalis musclés, son engagement précoce dans le mouvement Khaksar et les distinctions qu'il a reçues. Il ne mentionne aucune école où il aurait été scolarisé; l'appartenance à un mouvement ne constitue pas une attestation de scolarité."
