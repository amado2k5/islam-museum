summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شفيقة غسبرالي؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في باغچه سراي في 14 أكتوبر 1886 لأبيها إسماعيل غسبرينسكي وأمها زهرة من أسرة آقجورا، وتعليمها في مدرسة أبيها ذات الأسلوب الجديد، وعملها مساعدةً رئيسية له في صحيفة «ترجمان»، وزواجها من نسيب بك يوسفبيلي سنة 1906، ورئاستها تحرير مجلة «عالم نسوان» منذ 1906، وعضويتها في هيئة رئاسة الكورولتاي القِرمي ونيابتها لدورتين سنة 1917، وفرارها إلى أذربيجان سنة 1919، وهجرتها إلى تركيا حاملةً أرشيفًا كبيرًا للحركة الإسلامية في روسيا، واتحاد نساء تتار القرم الذي أسسته سنة 1930، ووفاتها في إسطنبول في 31 أغسطس 1975. ولا تذكر المقالة ديانتها في متنها."
  en: "English Wikipedia article on Şefiqa Gaspıralı; used for entity facts only. It gives her birth at Bakhchysarai on 14 October 1886 to Ismail Gasprinsky and Zühre of the Akçora family, her education at her father's new-method school, her work as his chief assistant on Terciman, her marriage to Nasib bey Yusifbeyli in 1906, her editorship of Alem-i Nisvan from 1906, her seat in the presidium of the Crimean Kurultai and two terms as a deputy in 1917, her flight to Azerbaijan in 1919, her emigration to Turkey with a large archive of the Russian Muslim movement, the Crimean Tatar Women's Union she founded in 1930, and her death at Istanbul on 31 August 1975. It makes no statement of her religion in its text."
  es: "Artículo de la Wikipedia en inglés sobre Şefiqa Gaspıralı; utilizado únicamente para datos biográficos. Indica su nacimiento en Bajchisarái el 14 de octubre de 1886, hija de Ismail Gasprinsky y Zühre, de la familia Akçora; su educación en la escuela de nuevo método de su padre; su trabajo como su principal asistente en Tercimán; su matrimonio con Nasib bey Yusifbeyli en 1906; su dirección de Alem-i Nisvan desde 1906; su puesto en el presidium del Kurultai de Crimea y dos mandatos como diputada en 1917; su huida a Azerbaiyán en 1919; su emigración a Turquía con un extenso archivo del movimiento musulmán ruso; la Unión de Mujeres Tártaras de Crimea que fundó en 1930; y su fallecimiento en Estambul el 31 de agosto de 1975. No menciona su religión en el texto."
  fr: "L'article de Wikipédia en anglais consacré à Şefiqa Gaspıralı, utilisé uniquement pour les informations biographiques, relate sa naissance à Bakhchysarai le 14 octobre 1886, fille d'Ismail Gasprinsky et de Zühre, membres de la famille Akçora. Il relate également ses études dans l'école de son père, fondée sur la nouvelle méthode, son rôle d'assistante principale de ce dernier à Terciman, son mariage avec Nasib bey Yusifbeyli en 1906, sa direction de la revue Alem-i Nisvan à partir de 1906, son siège au présidium du Kurultai de Crimée et ses deux mandats de députée en 1917, sa fuite en Azerbaïdjan en 1919, son émigration en Turquie avec d'importantes archives sur le mouvement musulman russe, la fondation de l'Union des femmes tatares de Crimée en 1930, et son décès à Istanbul le 31 août 1975. L'article ne mentionne pas sa religion."
  ur: "انگریزی ویکیپیڈیا مضمون Şefiqa Gaspıralı پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے 14 اکتوبر 1886 کو باخچیسرائے میں اکورا خاندان کے اسماعیل گیسپرنسکی اور ظہرے کو جنم دیا، اس کی تعلیم اس کے والد کے نئے طریقہ کار کے اسکول میں، اس کا کام ٹرسیمن پر اس کے چیف اسسٹنٹ کے طور پر، اس کی 1906 میں نصیب بے یوسفبیلی سے اس کی شادی، 1906 میں اس کی صدارت کی نشست سے علیم-i-in کی ایڈیٹر شپ۔ کریمین کورلٹائی اور 1917 میں نائب کے طور پر دو شرائط، 1919 میں آذربائیجان کے لیے اس کی پرواز، روسی مسلم تحریک کے ایک بڑے آرکائیو کے ساتھ ترکی میں اس کی ہجرت، 1930 میں اس کی بنیاد رکھی کریمیائی تاتار خواتین کی یونین، اور 31 اگست 1975 کو استنبول میں اس کی موت اس کے مذہب کے متن میں بیان کرتی ہے۔"
  tr: "Shafika Gasprali hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 14 Ekim 1886'da Bağçasaray'da doğduğu ve babası İsmail Gğprinsky ile annesi Zahra'nın Akjura ailesinden olduğu, babasının okulunda eğitim aldığı, 'Turjuman' gazetesinde baş asistanlık çalışması, 1906'da Nasib Bey Yusefbeyli ile evlenmesi, 1906'dan itibaren 'Alam Niswan' dergisinin başkanlığı, 1917'de Kırım Kurultay başkanlık kurulu üyeliği ve iki dönem milletvekili olduğu, 1919'da Azerbaycan'a kaçışı, Rusya'daki İslami hareketin büyük bir arşivini taşıyarak Türkiye'ye göç etmesi, 1930'da kurulan Kırım Tatar Kadınlar Birliği ve 31 Ağustos 1975'te İstanbul'da vefat etmesi olarak anılmaktadır. Makale içeriğinde dininden bahsetmiyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Shafika Gasprali; digunakan hanya untuk fakta entitas. Ia disebutkan lahir di Bağçasaray pada 14 Oktober 1886, dari ayahnya Ismail Gğprinsky dan ibunya Zahra dari keluarga Akjura, pendidikannya di sekolah ayahnya, pekerjaannya sebagai asisten utama di surat kabar 'Turjuman,' pernikahannya dengan Nasib Bey Yusefbeyli pada tahun 1906, kepresidenan majalah 'Alam Niswan' sejak 1906, keanggotaannya di presidium Kurultai Krimea dan wakilnya selama dua periode pada tahun 1917, pelariannya ke Azerbaijan pada tahun 1919, migrasinya ke Turki membawa arsip besar gerakan Islam di Rusia, Persatuan Perempuan Tatar Krimea yang didirikan pada tahun 1930, dan kematiannya di Istanbul pada 31 Agustus 1975. Artikel tersebut tidak menyebutkan agamanya dalam isinya."
