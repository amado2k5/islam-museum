summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شفيقة غسبرالي؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في باغچه سراي في 14 أكتوبر 1886 لأبيها إسماعيل غسبرينسكي وأمها زهرة من أسرة آقجورا، وتعليمها في مدرسة أبيها ذات الأسلوب الجديد، وعملها مساعدةً رئيسية له في صحيفة «ترجمان»، وزواجها من نسيب بك يوسفبيلي سنة 1906، ورئاستها تحرير مجلة «عالم نسوان» منذ 1906، وعضويتها في هيئة رئاسة الكورولتاي القِرمي ونيابتها لدورتين سنة 1917، وفرارها إلى أذربيجان سنة 1919، وهجرتها إلى تركيا حاملةً أرشيفًا كبيرًا للحركة الإسلامية في روسيا، واتحاد نساء تتار القرم الذي أسسته سنة 1930، ووفاتها في إسطنبول في 31 أغسطس 1975. ولا تذكر المقالة ديانتها في متنها."
  en: "English Wikipedia article on Şefiqa Gaspıralı; used for entity facts only. It gives her birth at Bakhchysarai on 14 October 1886 to Ismail Gasprinsky and Zühre of the Akçora family, her education at her father's new-method school, her work as his chief assistant on Terciman, her marriage to Nasib bey Yusifbeyli in 1906, her editorship of Alem-i Nisvan from 1906, her seat in the presidium of the Crimean Kurultai and two terms as a deputy in 1917, her flight to Azerbaijan in 1919, her emigration to Turkey with a large archive of the Russian Muslim movement, the Crimean Tatar Women's Union she founded in 1930, and her death at Istanbul on 31 August 1975. It makes no statement of her religion in its text."
