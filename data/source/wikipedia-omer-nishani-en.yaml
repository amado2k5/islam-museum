  ar: "مقالة ويكيبيديا الإنجليزية عن عمر نيشاني (1887-1954)، الطبيب وأول رئيس للدولة في ألبانيا الشعبية؛ تُستخدم لوقائع الكيان فقط. توثّق نشأته في غيروكاستر ودراسته الطب في إسطنبول ونضاله ضد زوغو ورئاسته هيئةَ الرئاسة 1946-1953 ووفاته في تيرانا في 26 مايو 1954."
  en: "English Wikipedia article on Omer Nishani (1887–1954), physician and first head of state of People's Albania; used for entity facts only. It records his Gjirokastër birth, medical studies in Istanbul, the anti-Zog struggle, his chairmanship of the Presidium 1946–1953, and his death at Tirana on 26 May 1954."
