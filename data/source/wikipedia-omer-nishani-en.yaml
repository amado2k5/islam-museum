reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born at Gjirokastër on 5 February 1887; brother Beso a teacher of the young Enver Hoxha; studied medicine in Istanbul, graduating without practising; worked as a physician in Vienna and (1915–1918) at Ballsh, then at Tirana and Durrës hospitals until 1924; took part in the 1924 assassination attempt on Ahmet Zogu and was jailed two weeks; supported Fan Noli's June Revolution; fled abroad in December 1924 and co-founded KONARE in 1925, running its Geneva newspaper 'Liria Kombëtare' with Halim Xhelo until 1932; settled in Vienna, married the Austrian Rozvita von Woler, and was sentenced to death in absentia in Albania; returned after the 1939 Italian invasion and briefly sat on the collaborationist Council of State, a step he told Hoxha he regretted; joined the National Liberation Movement on its formation in September 1942; chaired the Standing Committee of the National Liberation General Council (1943), then the Anti-Fascist National Liberation Council at the Congress of Përmet (May 1944) with the foreign-affairs portfolio; on 11 January 1946 chaired the Constituent Assembly, transformed on 16 March into the People's Assembly, and served as first Chairman of its Presidium — head of state — until 1953, without being a member of the ruling Party of Labour; his brother Besim was arrested in 1952; he resigned officially for health reasons on 24 July 1953 and was succeeded by Haxhi Lleshi on 1 August; a Ministry of Interior dossier records that the autopsy concluded suicide. A 1988 compilation of his articles and speeches was published as 'Për Shqipërinë e popullit'. The article states nothing about his religion, and Wikidata carries no religion statement for him."
