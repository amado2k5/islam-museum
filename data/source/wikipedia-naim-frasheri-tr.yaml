summary:
  ar: "مقالة ويكيبيديا التركية عن نعيم فراشري ⁦(نعيم فراشيري)⁩؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه «هو نفسه بكتاشي» وتوافق الإنجليزية في تاريخي ميلاده ووفاته."
  en: "Turkish Wikipedia article on Naim Frashëri (Naim Fraşiri); used for entity facts only. It describes him as 'himself a Bektashi' and agrees with the English article on his birth and death dates."
  es: "Artículo de la Wikipedia en turco sobre Naim Frashëri (Naim Fraşiri); utilizado únicamente para datos sobre la persona. Lo describe como «un bektashi» y coincide con el artículo en inglés en cuanto a sus fechas de nacimiento y muerte."
  fr: "L'article de Wikipédia en turc sur Naim Frashëri (Naim Fraşiri) est utilisé uniquement pour les informations relatives à l'entité. Il le décrit comme « lui-même un Bektashi » et confirme l'article en anglais concernant ses dates de naissance et de décès."
  ur: "ترکی ویکیپیڈیا مضمون Naim Frashëri (Naim Fraşiri) پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے 'خود ایک بکتاشی' کے طور پر بیان کرتا ہے اور اس کی پیدائش اور موت کی تاریخوں کے انگریزی مضمون سے اتفاق کرتا ہے۔"
  tr: "Neim Fraşarı ⁦(نيם fraşiri)⁩ hakkında Türkçe Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Onu \"kendisi Bektasi\" olarak tanımlar ve İngilizce doğum ve ölüm tarihlerini eşitler."
  id: "Artikel Wikipedia Turki tentang Neim Fraşerı ⁦(نيם fraşiri)⁩; digunakan hanya untuk fakta entitas tersebut. Artikel ini menggambarkannya sebagai \"dirinya sendiri Bektasi,\" dan bahasa Inggris cocok dengan tanggal lahir dan kematiannya."
