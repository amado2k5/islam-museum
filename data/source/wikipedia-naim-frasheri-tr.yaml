reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 25 May 1846 at Fraşır (Frashër), one of eight children of a devout, wealthy Albanian Bektashi family; educated at the Nasibi Tahir Baba Tekke and the Zosimaia school at Ioannina, with private lessons from two local Bektashis; his career and works as in the English article, with which much of its legacy section runs parallel — for the faith segment it is treated as corroboration rather than as an independent attestation, its statement 'Kendisi de bir Bektaşi olan Fraşiri' ('Frashëri, himself also a Bektashi') agreeing with the English article's own 'Himself a Bektashi'. The record's sufi segment rests on the English and Albanian articles plus Robert Elsie's biography, stated in the faith note."
