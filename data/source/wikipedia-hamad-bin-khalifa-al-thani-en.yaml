summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حمد بن خليفة آل ثاني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في الدوحة سنة 1952 وتخرّجه في ساندهيرست سنة 1971 وصعوده في القوات المسلحة القطرية، وانقلابه الأبيض على والده سنة 1995، وحكمه ثمانية عشر عامًا طوّر فيها الغاز الطبيعي المسال وأسّس مؤسسة قطر والجزيرة وهيئة متاحف قطر، وتنازله عن الحكم لابنه تميم سنة 2013، ووفاته في الدوحة في 12 يوليو 2026 عن 74 عامًا. لا يرد في نصها ولا في صندوق معلوماتها أي ذكر لدينه أو مذهبه."
  en: "English Wikipedia article on Hamad bin Khalifa Al Thani; used for entity facts only. It recounts his birth in Doha in 1952, his graduation from Sandhurst in 1971 and rise through the Qatar Armed Forces, his bloodless 1995 coup against his father, his eighteen-year reign developing liquefied natural gas and founding Qatar Foundation, Al Jazeera and the Qatar Museums Authority, his 2013 abdication in favour of his son Tamim, and his death in Doha on 12 July 2026 aged 74. Neither its text nor its infobox makes any statement of his religion or school."
