reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by its revision id and asserted equal to it. It gives his birth in Doha on 1 January 1952, his Sandhurst graduation in 1971, his posts as chief of staff and minister of defence, the bloodless coup of 27 June 1995 against his father Khalifa bin Hamad, his reign to the abdication of 25 June 2013 in favour of his son Tamim, and his death in Doha on 12 July 2026 (citing the Associated Press of that date), with burial at Lusail Royal Cemetery. Its infobox carries no religion field; its categories file him under 'Qatari Muslims' and 'Muslim monarchs' — filings, which never attest a school."
