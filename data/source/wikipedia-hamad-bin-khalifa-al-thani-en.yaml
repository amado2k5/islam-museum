summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حمد بن خليفة آل ثاني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في الدوحة سنة 1952 وتخرّجه في ساندهيرست سنة 1971 وصعوده في القوات المسلحة القطرية، وانقلابه الأبيض على والده سنة 1995، وحكمه ثمانية عشر عامًا طوّر فيها الغاز الطبيعي المسال وأسّس مؤسسة قطر والجزيرة وهيئة متاحف قطر، وتنازله عن الحكم لابنه تميم سنة 2013، ووفاته في الدوحة في 12 يوليو 2026 عن 74 عامًا. لا يرد في نصها ولا في صندوق معلوماتها أي ذكر لدينه أو مذهبه."
  en: "English Wikipedia article on Hamad bin Khalifa Al Thani; used for entity facts only. It recounts his birth in Doha in 1952, his graduation from Sandhurst in 1971 and rise through the Qatar Armed Forces, his bloodless 1995 coup against his father, his eighteen-year reign developing liquefied natural gas and founding Qatar Foundation, Al Jazeera and the Qatar Museums Authority, his 2013 abdication in favour of his son Tamim, and his death in Doha on 12 July 2026 aged 74. Neither its text nor its infobox makes any statement of his religion or school."
  es: "Artículo de la Wikipedia en inglés sobre Hamad bin Khalifa Al Thani; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Doha en 1952, su graduación de Sandhurst en 1971 y su ascenso en las Fuerzas Armadas de Qatar, su golpe de Estado incruento de 1995 contra su padre, sus dieciocho años de gobierno desarrollando el gas natural licuado y fundando la Fundación Qatar, Al Jazeera y la Autoridad de Museos de Qatar, su abdicación en 2013 en favor de su hijo Tamim y su fallecimiento en Doha el 12 de julio de 2026 a los 74 años. Ni el texto ni el recuadro informativo mencionan su religión ni su escuela."
  fr: "Article de Wikipédia en anglais sur Hamad bin Khalifa Al Thani; utilisé uniquement pour les informations relatives à l’entité. Il relate sa naissance à Doha en 1952, sa sortie de l’académie militaire de Sandhurst en 1971 et son ascension au sein des forces armées qataries, son coup d’État sans effusion de sang en 1995 contre son père, ses dix-huit années à la tête du Qatar, marquées par le développement du gaz naturel liquéfié et la création de la Fondation du Qatar, d’Al Jazeera et de l’Autorité des musées du Qatar, son abdication en 2013 en faveur de son fils Tamim, et son décès à Doha le 12 juillet 2026 à l’âge de 74 ans. Ni le texte ni l’encadré ne font mention de sa religion ou de son parcours scolaire."
  ur: "حمد بن خلیفہ الثانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1952 میں دوحہ میں ان کی پیدائش، 1971 میں سینڈہرسٹ سے ان کی گریجویشن اور قطر کی مسلح افواج کے ذریعے عروج، 1995 میں اپنے والد کے خلاف ان کی بے خونی بغاوت، ان کے اٹھارہ سالہ دور حکومت میں مائع قدرتی گیس کی ترقی اور قطر فاؤنڈیشن، الجزیرہ اور قطر میوزیم اتھارٹی کی بنیاد، ان کے بیٹے کی موت اور ان کی موت کے بارے میں بتایا گیا ہے۔ دوحہ میں 12 جولائی 2026 کو 74 سال کی عمر میں۔ نہ تو اس کا متن اور نہ ہی اس کے معلوماتی خانے میں اس کے مذہب یا اسکول کا کوئی بیان ہے۔"
  tr: "Hamad bin Halife Al Thani hakkında İngilizce Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. 1952'de Doha'da doğmasını, 1971'de Sandhurst'ta mezun olmasını, Katar silahlı kuvvetlerine yükselişini, 1995'te babasına karşı beyaz darbesini, sıvılaştırılmış doğal gaz geliştirdiği on sekiz yıllık hükümdarlığını, Katar Vakfı, Al Jazeera ve Katar Müzeler Otoritesi'ni kurmasını, 2013'te iktidarı oğlu Tamim'e devretmesini ve 12 Temmuz 2026'da 74 yaşında Doha'da vefat etmesini anlatmaktadır. Metinde veya bilgi kutusunda dini veya mezhebine dair hiçbir bilgi yoktur."
  id: "Artikel Wikipedia bahasa Inggris tentang Hamad bin Khalifa Al Thani; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Doha pada tahun 1952, kelulusannya di Sandhurst pada tahun 1971, kenaikannya ke angkatan bersenjata Qatar, kudeta putihnya terhadap ayahnya pada tahun 1995, masa pemerintahannya selama delapan belas tahun di mana ia mengembangkan gas alam cair, mendirikan Qatar Foundation, Al Jazeera, dan Otoritas Museum Qatar, melepaskan kekuasaan kepada putranya Tamim pada tahun 2013, dan meninggal di Doha pada 12 Juli 2026, pada usia 74 tahun. Tidak ada penyebutan agama atau sektenya dalam teks atau kotak info di kotak informasinya."
