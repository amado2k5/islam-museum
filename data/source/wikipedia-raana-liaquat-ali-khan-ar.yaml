summary:
  ar: "مقالة ويكيبيديا العربية القصيرة عن رعنا لياقت علي خان؛ تذكر اسمها الأصلي شيلا إيرين بانت ومولدها في شباط 1905 ووفاتها في 13 حزيران 1990 ودورها في حركة باكستان، ولا تسمي لها مذهباً."
  en: "The short Arabic Wikipedia article on Ra'ana Liaquat Ali Khan; it gives her birth name Sheila Irene Pant, her birth in February 1905 and her death on 13 June 1990, and her role in the Pakistan Movement, and names no school for her."
  es: "El breve artículo de Wikipedia en árabe sobre Ra'ana Liaquat Ali Khan; indica que su nombre de nacimiento era Sheila Irene Pant, que nació en febrero de 1905 y murió el 13 de junio de 1990, y su papel en el Movimiento de Pakistán, pero no menciona ninguna escuela en su honor."
  fr: "Le court article de Wikipédia en arabe sur Ra'ana Liaquat Ali Khan; il indique son nom de naissance Sheila Irene Pant, sa naissance en février 1905 et sa mort le 13 juin 1990, ainsi que son rôle dans le Mouvement pour le Pakistan, mais ne mentionne aucune école à son nom."
  ur: "رانا لیاقت علی خان پر مختصر عربی ویکیپیڈیا مضمون؛ اس میں اس کا پیدائشی نام شیلا آئرین پنت، فروری 1905 میں اس کی پیدائش اور 13 جون 1990 کو اس کی موت، اور تحریک پاکستان میں ان کا کردار، اور اس کے لیے کسی اسکول کا نام نہیں رکھا گیا ہے۔"
  tr: "Rana Liaquat Ali Khan hakkında kısa Arapça Vikipedi makalesi; orijinal adı Sheila Irene Pant, Şubat 1905'teki doğumu, 13 Haziran 1990'daki ölümü ve Pakistan hareketindeki rolü belirtilmiş, ancak herhangi bir tarikat adı verilmemiştir."
  id: "Artikel singkat Wikipedia berbahasa Arab tentang Rana Liaquat Ali Khan menyebutkan nama aslinya Sheila Irene Pant, kelahirannya pada Februari 1905, kematiannya pada 13 Juni 1990, dan perannya dalam gerakan Pakistan, tetapi tidak memberinya nama sekte apa pun."
