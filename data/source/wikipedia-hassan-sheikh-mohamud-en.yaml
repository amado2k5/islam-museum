summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسن شيخ محمود؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في جلالاقسي في 29 نوفمبر 1955، وتعليمه في مقديشو وبوبال، وعمله الأكاديمي والمدني وتأسيسه جامعة سيماد، ورئاسته الأولى للصومال (2012–2017) ثم عودته إلى الرئاسة في 2022 خلفا لمحمد عبد الله محمد، والنزاع الدستوري منذ 2026 حول استمراره في المنصب. لا يذكر النص دينه شخصيا ولا مدرسته."
  en: "English Wikipedia article on Hassan Sheikh Mohamud; used for entity facts only. It recounts his birth at Jalalaqsi on 29 November 1955, his education in Mogadishu and Bhopal, his academic and civic career and co-founding of SIMAD University, his first presidency of Somalia (2012–2017) and his return to the presidency in 2022 succeeding Mohamed Abdullahi Mohamed, and the constitutional dispute since 2026 over his continuation in office. The text does not discuss his own religion or school."
  es: "Artículo de la Wikipedia en inglés sobre Hassan Sheikh Mohamud; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Jalalaqsi el 29 de noviembre de 1955, su educación en Mogadiscio y Bhopal, su trayectoria académica y cívica, la cofundación de la Universidad SIMAD, su primer mandato como presidente de Somalia (2012-2017) y su regreso a la presidencia en 2022, sucediendo a Mohamed Abdullahi Mohamed, así como la disputa constitucional desde 2026 sobre su permanencia en el cargo. El texto no menciona su religión ni su escuela."
  fr: "Article de Wikipédia en anglais consacré à Hassan Sheikh Mohamud; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Jalalaqsi le 29 novembre 1955, ses études à Mogadiscio et Bhopal, son parcours universitaire et civique, sa cofondation de l’université SIMAD, sa première présidence de la Somalie (2012-2017) et son retour à la présidence en 2022, succédant à Mohamed Abdullahi Mohamed, ainsi que le différend constitutionnel qui oppose les deux pays depuis 2026 quant à son maintien au pouvoir. Le texte n’aborde ni sa religion ni son école."
  ur: "حسن شیخ محمد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 29 نومبر 1955 کو جلالقسی میں ان کی پیدائش، موغادیشو اور بھوپال میں ان کی تعلیم، ان کے تعلیمی اور شہری کیریئر اور سماد یونیورسٹی کے شریک بانی، صومالیہ کی ان کی پہلی صدارت (2012-2017) اور 2026 میں محمد عبداللہ کے بعد ان کی صدارت میں واپسی، محمد عبداللہ کے آئینی تنازعہ پر ان کی واپسی کا ذکر ہے۔ دفتر میں تسلسل. متن میں اس کے اپنے مذہب یا مکتب پر بحث نہیں کی گئی ہے۔"
  tr: "Hassan Sheikh Mahmoud hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 29 Kasım 1955'te Celalaküsi'de doğmasını, Mogadişu ve Bhopal'deki eğitimini, akademik ve sivil çalışmalarını, Semad Üniversitesi'nin kuruluşunu, Somali'nin ilk cumhurbaşkanlığını (2012–2017), ardından 2022'de Mohamed Abdullahi Mohamed'in yerine cumhurbaşkanlığına dönüşünü ve 2026'dan beri devam eden görev süresi üzerindeki anayasal anlaşmazlığı anlatır. Metin, dini veya okulu hakkında kişisel olarak bahsedilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Hassan Sheikh Mahmoud; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Jalalaqsi pada 29 November 1955, pendidikannya di Mogadishu dan Bhopal, pekerjaan akademis dan sipilnya, pendirian Universitas Semad, kepresidenan pertamanya di Somalia (2012–2017), kemudian kembalinya ia ke jabatan presiden pada 2022 menggantikan Mohamed Abdullahi Mohamed, dan perselisihan konstitusional sejak 2026 mengenai kelanjutan masa jabatannya. Teks tersebut tidak menyebutkan agamanya secara pribadi maupun sekolahnya."
