summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسن شيخ محمود؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في جلالاقسي في 29 نوفمبر 1955، وتعليمه في مقديشو وبوبال، وعمله الأكاديمي والمدني وتأسيسه جامعة سيماد، ورئاسته الأولى للصومال (2012–2017) ثم عودته إلى الرئاسة في 2022 خلفا لمحمد عبد الله محمد، والنزاع الدستوري منذ 2026 حول استمراره في المنصب. لا يذكر النص دينه شخصيا ولا مدرسته."
  en: "English Wikipedia article on Hassan Sheikh Mohamud; used for entity facts only. It recounts his birth at Jalalaqsi on 29 November 1955, his education in Mogadishu and Bhopal, his academic and civic career and co-founding of SIMAD University, his first presidency of Somalia (2012–2017) and his return to the presidency in 2022 succeeding Mohamed Abdullahi Mohamed, and the constitutional dispute since 2026 over his continuation in office. The text does not discuss his own religion or school."
