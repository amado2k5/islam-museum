  ar: "مقال موسوعي عن مهجور (1885–1952)، الشاعر الكشميري بيرزاده غلام أحمد: قريته ميتريغام، ولقبه القلمي الذي أخذه بتأثير شبلي نعماني، وعمله بتواريّاً، وشعره الذي جدّد القصيدة الكشميرية."
  en: "Encyclopedia article on Mahjoor (1885–1952), the Kashmiri poet Peerzada Ghulam Ahmad: his Mitrigam village, the pen name taken under Shibli Nomani's influence, his patwari service, and the poetry that renewed the Kashmiri poem."
