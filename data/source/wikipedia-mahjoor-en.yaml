  id: "Sebuah artikel ensiklopedis tentang Mahjour (1885–1952), penyair Kashmir Pirzada Ghulam Ahmed: desanya Mitrigam, judul pena yang dipengaruhi oleh Shibli Namani, karyanya di Tiwaria, dan puisinya yang memperbarui puisi Kashmir."
