summary:
  ar: "مقالة ويكيبيديا العربية عن نزار قباني؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 21 مارس 1923 ووفاته في 30 أبريل 1998، وتتناول طفولته الدمشقية ومسيرته الدبلوماسية ودواوينه والجدل الذي أثاره شعره لدى المحافظين دينيا. ولا تسمّي له دينًا ولا مذهبًا شخصيًا."
  en: "Arabic Wikipedia article on Nizar Qabbani; used for entity facts only. It gives his birth on 21 March 1923 and his death on 30 April 1998, and covers his Damascus childhood, his diplomatic career, his collections and the controversies his verse drew from religious conservatives. It names no religion or school for him personally."
  es: "Artículo de Wikipedia en árabe sobre Nizar Qabbani; se utiliza únicamente para obtener información sobre su persona. Indica su fecha de nacimiento (21 de marzo de 1923) y su fallecimiento (30 de abril de 1998), y abarca su infancia en Damasco, su carrera diplomática, sus colecciones y las controversias que suscitaron sus versos entre los conservadores religiosos. No menciona ninguna religión ni escuela a la que perteneciera personalmente."
  fr: "L'article de Wikipédia en arabe consacré à Nizar Qabbani, utilisé uniquement à des fins d'information sur l'entité, indique sa naissance le 21 mars 1923 et sa mort le 30 avril 1998. Il aborde son enfance à Damas, sa carrière diplomatique, ses recueils et les controverses que ses vers ont suscitées auprès des conservateurs religieux. Aucune religion ni école n'est mentionnée à son encontre."
  ur: "نزار قبانی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 21 مارچ 1923 کو ان کی پیدائش اور 30 اپریل 1998 کو ان کی موت کا ذکر کرتا ہے، اور اس کے دمشق کے بچپن، اس کے سفارتی کیریئر، اس کے مجموعوں اور مذہبی قدامت پسندوں سے ان کی آیت کے تنازعات کا احاطہ کرتا ہے۔ یہ ذاتی طور پر اس کے لیے کسی مذہب یا اسکول کا نام نہیں لیتا۔"
