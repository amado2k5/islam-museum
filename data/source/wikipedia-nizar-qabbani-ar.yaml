  ar: "مقالة ويكيبيديا العربية عن نزار قباني؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 21 مارس 1923 ووفاته في 30 أبريل 1998، وتتناول طفولته الدمشقية ومسيرته الدبلوماسية ودواوينه والجدل الذي أثاره شعره لدى المحافظين دينيا. ولا تسمّي له دينًا ولا مذهبًا شخصيًا."
  en: "Arabic Wikipedia article on Nizar Qabbani; used for entity facts only. It gives his birth on 21 March 1923 and his death on 30 April 1998, and covers his Damascus childhood, his diplomatic career, his collections and the controversies his verse drew from religious conservatives. It names no religion or school for him personally."
