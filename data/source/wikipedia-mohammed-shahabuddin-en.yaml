summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد شهاب الدين؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بابنا في 10 ديسمبر 1949، ومسيرته قاضيًا ومفوضًا في لجنة مكافحة الفساد (2011–2016)، ورئاسته من 24 أبريل 2023 حتى تنحّيه في 24 يوليو 2026 لأسباب صحية، وقد أقسمت في عهده ثلاث حكومات متعاقبة اليمين. لا يحمل صندوق معلوماتها حقلًا للديانة ولا يذكر متنها انتماءً دينيًا شخصيًا له."
  en: "English Wikipedia article on Mohammed Shahabuddin; used for entity facts only. It recounts his birth at Pabna on 10 December 1949, his career as a district judge and a commissioner of the Anti-Corruption Commission (2011–2016), and his presidency from 24 April 2023 until he stepped down on 24 July 2026 citing ill health, having administered the oath to three successive governments. Its infobox carries no religion field and its text states no personal religious affiliation for him."
  es: "Artículo de la Wikipedia en inglés sobre Mohammed Shahabuddin; utilizado únicamente para datos sobre la entidad. Relata su nacimiento en Pabna el 10 de diciembre de 1949, su trayectoria como juez de distrito y comisionado de la Comisión Anticorrupción (2011-2016), y su presidencia desde el 24 de abril de 2023 hasta su dimisión el 24 de julio de 2026 por motivos de salud, tras haber tomado juramento a tres gobiernos sucesivos. Su ficha informativa no incluye información sobre religión y su texto no indica ninguna afiliación religiosa personal."
  fr: "Article de Wikipédia en anglais sur Mohammed Shahabuddin; utilisé uniquement pour les informations le concernant. Il relate sa naissance à Pabna le 10 décembre 1949, sa carrière de juge de district et de commissaire de la Commission anti-corruption (2011-2016), ainsi que sa présidence du 24 avril 2023 jusqu’à sa démission le 24 juillet 2026 pour raisons de santé, après avoir fait prêter serment à trois gouvernements successifs. Son infobox ne comporte pas de champ « religion » et son texte ne mentionne aucune appartenance religieuse personnelle."
  ur: "محمد شہاب الدین پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 10 دسمبر 1949 کو پبنا میں ان کی پیدائش، ضلعی جج اور انسداد بدعنوانی کمیشن (2011-2016) کے کمشنر کے طور پر ان کا کیریئر، اور 24 اپریل 2023 سے ان کی صدارت کے بارے میں بتایا گیا ہے جب تک کہ وہ خرابی صحت کا حوالہ دیتے ہوئے 24 جولائی 2026 کو مستعفی ہو گئے، جس کے بعد انہوں نے مسلسل تین حکومتیں سنبھالیں۔ اس کے معلوماتی خانے میں کوئی مذہب نہیں ہے اور اس کے متن میں اس کے لیے کوئی ذاتی مذہبی وابستگی نہیں ہے۔"
