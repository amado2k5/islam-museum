summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد شهاب الدين؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بابنا في 10 ديسمبر 1949، ومسيرته قاضيًا ومفوضًا في لجنة مكافحة الفساد (2011–2016)، ورئاسته من 24 أبريل 2023 حتى تنحّيه في 24 يوليو 2026 لأسباب صحية، وقد أقسمت في عهده ثلاث حكومات متعاقبة اليمين. لا يحمل صندوق معلوماتها حقلًا للديانة ولا يذكر متنها انتماءً دينيًا شخصيًا له."
  en: "English Wikipedia article on Mohammed Shahabuddin; used for entity facts only. It recounts his birth at Pabna on 10 December 1949, his career as a district judge and a commissioner of the Anti-Corruption Commission (2011–2016), and his presidency from 24 April 2023 until he stepped down on 24 July 2026 citing ill health, having administered the oath to three successive governments. Its infobox carries no religion field and its text states no personal religious affiliation for him."
