summary:
  ar: "مقالة ويكيبيديا الصينية عن ما فولو؛ تُستخدم لوقائع الكيان فقط. تذكر أنه نال رتبة «جينشي» العسكرية سنة 1880، وقاد قوات الهوي في لانغفانغ وعند بوابة تشنغيانغ سنة 1900، ومُنح بعد موته لقب «الجنرال تشنوي» واسم الشرف «تشونغليه» (المخلص الشهيد)، وأن ابنه ما هونغبين أعاد رفاته إلى موطنه سنة 1950؛ وتؤرّخ مولده سنة 1854 ووفاته سنة 1900، ويحمل قالب بياناتها يوم 13 آب للوفاة."
  en: "Chinese Wikipedia article on Ma Fulu; used for entity facts only. It records that he took the military jinshi degree in 1880, led Hui troops at Langfang and the Zhengyang Gate in 1900, was posthumously made 'General Zhenwei' with the posthumous name Zhonglie ('loyal martyr'), and that his son Ma Hongbin brought his remains home in 1950; it dates his birth to 1854 and his death to 1900, and its data template files the death day as 13 August."
