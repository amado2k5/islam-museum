reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026, fetched through the MediaWiki API by its recorded revision id with the returned id asserted equal. An independent Chinese tradition, not a translation of the English article: it cites the Draft History of Qing biography of Ma Fulu, Gao Wende (ed.), Dictionary of Chinese Ethnic History Figures (1990), and Xinhua Gansu pages. Its birthplace statement (Yangwashan, Hanjiaji township) matches the English article's Linxia County at county level. The 13 August death day appears only in its data template, with no source cited for it in the text; it is not followed beyond a note. Its reburial year (1950, by his son) conflicts with the English article's 1995; the discrepancy is carried in his record's prose."
