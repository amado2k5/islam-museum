reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 by its recorded revision id via the MediaWiki API, the returned id asserted equal before any claim was drawn. The article names no religion or school for him and its infobox has no religion field. It gives his birth as January 1879 (citing the Sindh Archives) where Wikidata gives February 1879, and its career section conflates his second chief-ministership with his predecessor's dates (7 March 1941 – 14 October 1947) against its own infobox (14 October 1942 – 14 August 1947); the infobox and the Urdu article are followed."
