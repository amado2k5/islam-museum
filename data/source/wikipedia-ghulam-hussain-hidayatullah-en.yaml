summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سير غلام حسين هدايت الله (1879–1948)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في يناير 1879 في شكارپور وتعليمه القانوني، وممارسته المحاماة في حيدرآباد ⁦(السند)⁩، ووزارته في حكومة بومباي (1921–1928) وعضويته مجلسها التنفيذي، ودوره في مشروع سد سكّر وحضوره مؤتمرات المائدة المستديرة، ورئاسته وزراء السند مرتين وأنه صار أول حاكم للسند في باكستان، ووفاته في كراتشي في 4 أكتوبر 1948."
  en: "English Wikipedia article on Sir Ghulam Hussain Hidayatullah (1879–1948); used for entity facts only. It recounts his birth in January 1879 at Shikarpur and legal education, his law practice at Hyderabad in Sindh, his Bombay ministry (1921–1928) and Executive Council membership, his part in the Sukkur Barrage project and the Round Table Conferences, his two terms as Premier/Chief Minister of Sindh and his becoming the first Governor of Sindh in Pakistan, and his death at Karachi on 4 October 1948."
  es: "Artículo de la Wikipedia en inglés sobre Sir Ghulam Hussain Hidayatullah (1879-1948); utilizado únicamente para datos sobre la persona. Relata su nacimiento en enero de 1879 en Shikarpur y su formación jurídica, su ejercicio de la abogacía en Hyderabad, en Sindh, su ministerio en Bombay (1921-1928) y su pertenencia al Consejo Ejecutivo, su participación en el proyecto de la presa de Sukkur y las Conferencias de Mesa Redonda, sus dos mandatos como Primer Ministro/Ministro Principal de Sindh y su nombramiento como primer Gobernador de Sindh en Pakistán, y su fallecimiento en Karachi el 4 de octubre de 1948."
  fr: "Article de Wikipédia en anglais sur Sir Ghulam Hussain Hidayatullah (1879-1948); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance en janvier 1879 à Shikarpur et ses études de droit, son exercice du droit à Hyderabad dans le Sindh, son ministère à Bombay (1921-1928) et son appartenance au Conseil exécutif, sa participation au projet du barrage de Sukkur et aux conférences de la Table ronde, ses deux mandats de Premier ministre/ministre en chef du Sindh et sa nomination comme premier gouverneur du Sindh au Pakistan, et sa mort à Karachi le 4 octobre 1948."
  ur: "سر غلام حسین ہدایت اللہ (1879–1948) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں جنوری 1879 میں شکار پور میں ان کی پیدائش اور قانونی تعلیم، سندھ میں حیدرآباد میں ان کی لاء پریکٹس، ان کی بمبئی کی وزارت (1921-1928) اور ایگزیکٹو کونسل کی رکنیت، سکھر بیراج پروجیکٹ اور گول میز کانفرنسوں میں ان کا حصہ، بطور وزیر اعظم/وزیراعلیٰ کے طور پر ان کی دو مدتیں، سندھ کے پہلے سندھ میں ان کی وفات اور اکتوبر میں کراچی میں ان کی وفات کا ذکر ہے۔ 1948."
  tr: "Sir Ghulam Hussain Hidayatullah (1879–1948) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Ocak 1879'da Shikarpur'da doğmasını, hukuk eğitimini, Haydarabad'daki (Sindh) avukatlık deneyimini, Bombay hükümetindeki bakanlığını (1921–1928), Yürütme Konseyi üyeliğini, Sukarpur Barajı projesindeki rolünü, yuvarlak masa toplantılarına katılımını, Sindh'in bakanlığına iki kez atanmasını, Pakistan'daki ilk Sind valisi olmasını ve 4 Ekim 1948'de Karaçi'de vefatını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Sir Ghulam Hussain Hidayatullah (1879–1948); hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya pada Januari 1879 di Shikarpur, pendidikan hukumnya, praktik hukumnya di Hyderabad (Sindh), kementeriannya di pemerintahan Bombay (1921–1928), keanggotaannya di Dewan Eksekutif, perannya dalam proyek Bendungan Sukarpur, kehadirannya dalam konferensi meja bundar, pengangkatannya sebagai menteri Sindh dua kali, menjadi gubernur pertama Sindh di Pakistan, dan kematiannya di Karachi pada 4 Oktober 1948."
