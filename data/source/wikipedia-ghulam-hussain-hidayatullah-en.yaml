summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سير غلام حسين هدايت الله (1879–1948)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في يناير 1879 في شكارپور وتعليمه القانوني، وممارسته المحاماة في حيدرآباد (السند)، ووزارته في حكومة بومباي (1921–1928) وعضويته مجلسها التنفيذي، ودوره في مشروع سد سكّر وحضوره مؤتمرات المائدة المستديرة، ورئاسته وزراء السند مرتين وأنه صار أول حاكم للسند في باكستان، ووفاته في كراتشي في 4 أكتوبر 1948."
  en: "English Wikipedia article on Sir Ghulam Hussain Hidayatullah (1879–1948); used for entity facts only. It recounts his birth in January 1879 at Shikarpur and legal education, his law practice at Hyderabad in Sindh, his Bombay ministry (1921–1928) and Executive Council membership, his part in the Sukkur Barrage project and the Round Table Conferences, his two terms as Premier/Chief Minister of Sindh and his becoming the first Governor of Sindh in Pakistan, and his death at Karachi on 4 October 1948."
