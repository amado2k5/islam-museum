label:
  ar: "ابن الجزري، النشر في القراءات العشر، الجزء الأول ⁦(عني بتصحيحه وطبعه محمد أحمد دهمان، مطبعة التوفيق، دمشق 1345هـ)⁩"
  en: "Ibn al-Jazari, al-Nashr fi al-Qira'at al-Ashr, vol. 1 (corrected and printed by Muhammad Ahmad Dahman, Matba'at al-Tawfiq, Damascus 1345 AH)"
  ur: "ابن الجزری، النشر فی القراءات العشر، جلد اول ⁦(تصحیح و طباعت محمد احمد دہمان، مطبعۃ التوفیق، دمشق 1345ھ)⁩"
summary:
  ar: "الطبعة الأولى من «النشر في القراءات العشر» للحافظ أبي الخير محمد بن محمد الدمشقي الشهير بابن الجزري ⁦(ت 833هـ)⁩، عني بتصحيحها وطبعها محمد أحمد دهمان، وطُبعت بمطبعة التوفيق بدمشق في 5 جمادى الآخرة 1345هـ؛ صُححت على أربع نسخ خطية، أولاها كتبها محمد بن الحسن الغزي القادري سنة 839هـ وعليها بلاغات المقابلة بنسخة عليها خط المصنف."
  en: "The first printing of al-Nashr fi al-Qira'at al-Ashr by the hadith master Abu al-Khayr Muhammad ibn Muhammad of Damascus, known as Ibn al-Jazari (d. 833 AH), corrected and printed by Muhammad Ahmad Dahman at Matba'at al-Tawfiq, Damascus, 5 Jumada II 1345 AH; established on four manuscripts, the first copied by Muhammad ibn al-Hasan al-Ghazzi al-Qadiri in 839 AH and marked as collated against a copy bearing the author's hand."
  ur: "حافظ ابو الخیر محمد بن محمد دمشقی، المعروف بہ ابن الجزری ⁦(م 833ھ)⁩ کی «النشر فی القراءات العشر» کی پہلی طباعت، تصحیح و طباعت محمد احمد دہمان، مطبعۃ التوفیق دمشق، 5 جمادی الآخرہ 1345ھ؛ چار قلمی نسخوں پر قائم، جن میں پہلا محمد بن الحسن غزی قادری نے 839ھ میں لکھا اور اس پر مصنف کے خط والے نسخے سے مقابلے کی تحریریں ہیں۔"
  es: "La primera impresión de al-Nashr fi al-Qira'at al-Ashr por el maestro de hadices Abu al-Khayr Muhammad ibn Muhammad de Damasco, conocido como Ibn al-Jazari (m. 833 AH), corregida e impresa por Muhammad Ahmad Dahman en Matba'at al-Tawfiq, Damasco, 5 Jumada II 1345 AH; establecida en cuatro manuscritos, el primero copiado por Muhammad ibn al-Hasan al-Ghazzi al-Qadiri en 839 AH y marcado como cotejado con una copia que lleva la mano del autor."
  fr: "La première impression d'al-Nashr fi al-Qira'at al-Ashr par le maître du hadith Abu al-Khayr Muhammad ibn Muhammad de Damas, connu sous le nom d'Ibn al-Jazari (mort en 833 AH), corrigée et imprimée par Muhammad Ahmad Dahman à Matba'at al-Tawfiq, Damas, le 5 Jumada II 1345 AH; établie sur quatre manuscrits, le premier copié par Muhammad ibn al-Hasan al-Ghazzi al-Qadiri en 839 AH et marqué comme collationné par rapport à une copie portant la main de l'auteur."
  tr: "Hafız Ebu el-Khayr Muhammed bin Muhammed el-Dimashqi (İbn el-Cezari olarak ö. 833 Ah) tarafından yazılan ve Muhammed Ahmed Dahman tarafından düzenlenip basılan \"El-Nashr el Qira'at el-Eşr\"in ilk baskısı, 5 Cumedül-Ahhirah 1345 tarihinde Şam'daki El-Tevfik Matbaası'nda düzenlenip basılmıştır; dört el yazması halinde düzenlenmiştir; ilki 839 H yılında Muhammed bin el-Hasan el-Gazi el-Kadiri tarafından yazılmış olup, yazarın el yazısını taşıyan bir kopyada ilgili yazışmalar yer almıştır."
  id: "Edisi pertama \"Al-Nashr fi al-Qira'at al-Ashr\" oleh hafiz Abu al-Khayr Muhammad ibn Muhammad al-Dimashqi, yang dikenal sebagai Ibn al-Jazari (wafat 833 H), yang diedit dan dicetak oleh Muhammad Ahmad Dahman, diedit dan dicetak di Al-Tawfiq Press di Damaskus pada 5 Jumada al-Akhirah 1345 H; naskah ini diedit dalam empat manuskrip, yang pertama ditulis oleh Muhammad ibn al-Hasan al-Ghazi al-Qadiri pada tahun 839 H, berisi korespondensi yang sesuai dalam salinan tulisan tangan penulis."
