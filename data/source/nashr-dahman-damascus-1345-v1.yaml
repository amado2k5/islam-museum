  en: "Ibn al-Jazari, al-Nashr fi al-Qira'at al-Ashr, vol. 1 (corrected and printed by Muhammad Ahmad Dahman, Matba'at al-Tawfiq, Damascus 1345 AH)"
  ur: "ابن الجزری، النشر فی القراءات العشر، جلد اول (تصحیح و طباعت محمد احمد دہمان، مطبعۃ التوفیق، دمشق 1345ھ)"
summary:
  ar: "الطبعة الأولى من «النشر في القراءات العشر» للحافظ أبي الخير محمد بن محمد الدمشقي الشهير بابن الجزري ⁦(ت 833هـ)⁩، عني بتصحيحها وطبعها محمد أحمد دهمان، وطُبعت بمطبعة التوفيق بدمشق في 5 جمادى الآخرة 1345هـ؛ صُححت على أربع نسخ خطية، أولاها كتبها محمد بن الحسن الغزي القادري سنة 839هـ وعليها بلاغات المقابلة بنسخة عليها خط المصنف."
  en: "The first printing of al-Nashr fi al-Qira'at al-Ashr by the hadith master Abu al-Khayr Muhammad ibn Muhammad of Damascus, known as Ibn al-Jazari (d. 833 AH), corrected and printed by Muhammad Ahmad Dahman at Matba'at al-Tawfiq, Damascus, 5 Jumada II 1345 AH; established on four manuscripts, the first copied by Muhammad ibn al-Hasan al-Ghazzi al-Qadiri in 839 AH and marked as collated against a copy bearing the author's hand."
  ur: "حافظ ابو الخیر محمد بن محمد دمشقی، المعروف بہ ابن الجزری (م 833ھ) کی «النشر فی القراءات العشر» کی پہلی طباعت، تصحیح و طباعت محمد احمد دہمان، مطبعۃ التوفیق دمشق، 5 جمادی الآخرہ 1345ھ؛ چار قلمی نسخوں پر قائم، جن میں پہلا محمد بن الحسن غزی قادری نے 839ھ میں لکھا اور اس پر مصنف کے خط والے نسخے سے مقابلے کی تحریریں ہیں۔"
title: "النشر في القراءات العشر"
