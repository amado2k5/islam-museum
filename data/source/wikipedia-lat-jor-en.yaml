summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن لات جور نغوني لاتير جوب (لات ديور، ح. 1842-1886)، دامل كايور وبطل السنغال الوطني لمقاومته الاستعمار الفرنسي؛ تروي نسبه الجيدج، ونشأته في وسط مسلم اسميا ودراسته في مدرسة قرآنية، وعهده الأول، ودخوله في تلمذة المرابط مابا دياخو با وبقاءه مسلما ممارسا بقية حياته، وعودته إلى كايور وقتاله ضد سكة حديد داكار-سان لوي وموته في معركة ديخيلي."
  en: "English Wikipedia article on Lat Jor Ngoné Latir Jop (Lat Dior, c. 1842–1886), damel of Cayor and national hero of Senegal for his resistance to French colonialism; it recounts his Guedj maternal lineage, his upbringing in a nominally Muslim milieu and Quranic schooling, his first reign, his becoming a disciple (talibe) of the marabout Maba Diakhou Ba and remaining a practicing Muslim for the rest of his life, his return to Cayor, his fight against the Dakar–Saint-Louis railway, and his death at Dekhele."
