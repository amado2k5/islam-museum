label:
  ar: "نور اليقين في سيرة سيد المرسلين — محمد الخضري ⁦(المكتبة التجارية الكبرى، القاهرة، ط4 1344هـ/1926م)⁩"
  en: "Nur al-Yaqin fi Sirat Sayyid al-Mursalin — Muhammad al-Khudari (al-Maktaba al-Tijariyya al-Kubra, Cairo, 4th ed. 1344/1926)"
summary:
  ar: "الطبعة الرابعة من «نور اليقين في سيرة سيد المرسلين» للشيخ محمد الخضري، المفتش بوزارة المعارف ومدرس التاريخ الإسلامي بالجامعة المصرية سابقاً، المكتبة التجارية الكبرى بالقاهرة، 1344هـ/1926م."
  en: "The fourth edition of Nur al-Yaqin fi Sirat Sayyid al-Mursalin by Shaykh Muhammad al-Khudari, inspector at the Ministry of Education and formerly teacher of Islamic history at the Egyptian University; al-Maktaba al-Tijariyya al-Kubra, Cairo, 1344/1926."
  es: "La cuarta edición de Nur al-Yaqin fi Sirat Sayyid al-Mursalin, del jeque Muhammad al-Khudari, inspector del Ministerio de Educación y ex profesor de historia islámica en la Universidad egipcia; al-Maktaba al-Tijariyya al-Kubra, El Cairo, 1344/1926."
  fr: "La quatrième édition de Nur al-Yaqin fi Sirat Sayyid al-Mursalin de Shaykh Muhammad al-Khudari, inspecteur au ministère de l'Éducation et ancien professeur d'histoire islamique à l'Université égyptienne; al-Maktaba al-Tijariyya al-Kubra, Le Caire, 1344/1926."
  ur: "وزارت تعلیم کے انسپکٹر اور مصری یونیورسٹی میں اسلامی تاریخ کے سابق استاد شیخ محمد الخدری کی طرف سے نور الیقین فی سیرت سید المرسلین کا چوتھا ایڈیشن؛ المکتبہ التجاریہ الکبریٰ، قاہرہ، 1344/1926۔"
