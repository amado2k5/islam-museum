summary:
  ar: "مقالة ويكيبيديا العربية عن يوسف علي: تؤكد ميلاده في 15 تشرين الثاني 1955 في ناتيكا ورئاسته لمجموعة لولو الدولية، وتذكر شراءه مبنى اسكتلندا يارد في لندن وتبرعه لإغاثة فيضانات كيرالا."
  en: "Arabic Wikipedia article on M. A. Yusuff Ali, confirming his birth on 15 November 1955 at Nattika and his chairmanship of LuLu Group International, and recording his purchase of London's Scotland Yard Building and his Kerala flood-relief donations."
  es: "Artículo en la Wikipedia en árabe sobre MA Yusuff Ali, que confirma su nacimiento el 15 de noviembre de 1955 en Nattika y su presidencia de LuLu Group International, y que registra la compra del edificio Scotland Yard de Londres y sus donaciones para ayudar a los damnificados por las inundaciones en Kerala."
  fr: "L'article de Wikipédia en arabe sur MA Yusuff Ali confirme sa naissance le 15 novembre 1955 à Nattika et sa présidence de LuLu Group International, et relate son achat du Scotland Yard Building à Londres et ses dons pour les victimes des inondations du Kerala."
  ur: "ایم اے یوسف علی پر عربی ویکیپیڈیا کا مضمون، 15 نومبر 1955 کو ناٹیکا میں ان کی پیدائش اور لولو گروپ انٹرنیشنل کی ان کی چیئرمین شپ کی تصدیق کرتا ہے، اور اس کی لندن کی اسکاٹ لینڈ یارڈ بلڈنگ کی خریداری اور کیرالہ کے سیلاب سے متعلق عطیات کو ریکارڈ کرتا ہے۔"
