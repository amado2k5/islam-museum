  en: "Learn Arabic for it is part of your religion, Alukah forum thread 138809"
  ur: "تعلموا العربية فإنها من دينكم، مجلس الالوکہ، موضوع 138809"
  fr: "Apprenez l'arabe car il fait partie de votre religion, fil 138809 du forum Alukah"
