summary:
  ar: "موضوع في مجلس الألوكة يجمع بحسب الملخص البحثي أسانيد قول عمر في تعلم العربية ⁦(ابن أبي شيبة رقم 31918، وسعيد بن منصور، والبيهقي، وشعب الإيمان رقم 1675، وغيرها)⁩ وحكم ابن حجر ⁦(فتح الباري 12/5)⁩ والباتلي عليها. ذُكرت هذه الصفحة في ملخص بحثي قُدّم إلى المتحف وأجاز المؤسس استعماله في 21 نوفمبر 2026؛ ولم يفتح المتحف الصفحة نفسها."
  en: "A thread on the Alukah forum which, according to the research summary, gathers the chains of the saying attributed to Umar on learning Arabic (Ibn Abi Shayba no. 31918, Sa'id ibn Mansur, al-Bayhaqi, Shu'ab al-Iman no. 1675 and others) and the gradings of Ibn Hajar (Fath al-Bari 12/5) and al-Batili. The page was named in a research summary supplied to the museum and approved for use by the founder on 21 November 2026; the museum did not open it."
  ur: "الوکہ کے مجلس میں ایک موضوع جو تحقیقی خلاصے کے مطابق عمر سے منسوب عربی سیکھنے کے قول کی اسانید ⁦(ابن ابی شیبہ نمبر 31918، سعید بن منصور، بیہقی، شعب الایمان نمبر 1675 وغیرہ)⁩ اور ابن حجر ⁦(فتح الباری 12/5)⁩ اور الباتلی کے احکام جمع کرتا ہے۔ اس صفحے کا ذکر عجائب گھر کو دیے گئے ایک تحقیقی خلاصے میں تھا جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی؛ عجائب گھر نے یہ صفحہ خود نہیں کھولا۔"
  fr: "Un fil du forum Alukah qui, selon le résumé de recherche, réunit les chaînes de la parole attribuée à Umar sur l'apprentissage de l'arabe (Ibn Abi Shayba no 31918, Sa'id ibn Mansur, al-Bayhaqi, Shu'ab al-Iman no 1675 et d'autres) et les jugements d'Ibn Hajar (Fath al-Bari 12/5) et d'al-Batili. La page est nommée dans un résumé de recherche remis au musée et approuvé pour usage par le fondateur le 21 novembre 2026 ; le musée ne l'a pas ouverte."
  es: "Un hilo del foro de Alukah que, según el resumen de investigación, reúne las cadenas del dicho atribuido a Umar sobre aprender árabe (Ibn Abi Shayba n.º 31918, Sa'id ibn Mansur, al-Bayhaqi, Shu'ab al-Iman n.º 1675 y otros) y los juicios de Ibn Hajar (Fath al-Bari 12/5) y de al-Batili. La página figura en un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026; el museo no la abrió."
