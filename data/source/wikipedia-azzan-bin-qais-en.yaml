reliability_note: "English Wikipedia, revision 1358905630 (wikitext consulted in full). It gives no birth year (infobox: year unknown, 19th century), against the queue's 1840, which no consulted source supports; the record therefore omits a born block. Its infobox dates the death 30 January 1871 and its text, citing Lorimer's Gazetteer of the Persian Gulf (1915), p. 729, gives January 1871 at the Battle of Muttrah; the Arabic infobox instead gives 1870 and Wikidata a year-precision 1870, readings the record states. Its lead calls him 'an Ibadi Imam of Oman' and its infobox religion field reads 'Ibadi Islam' uncited; the imamate discussion draws on the same literature (Lorimer 1915; Hopper 2019) as the Arabic article, so the two articles form one source family for the faith question. Consulted on 26 October 2026."
