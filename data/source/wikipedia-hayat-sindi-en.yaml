summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حياة سندي ⁦(ولدت 6 تشرين الثاني 1967 في مكة)⁩، عالمة التقنية الحيوية السعودية وأول سعودية تحصل على الدكتوراه في التقنية الحيوية من جامعة كامبردج سنة 2001، ومن أوائل النساء في مجلس الشورى السعودي منذ 2013 وسفيرة اليونسكو للنوايا الحسنة منذ 2012؛ وتذكر أنها ترتدي الحجاب التقليدي الإسلامي وأنها تعرضت لضغوط في الجامعة للتخلي عن معتقداتها الدينية فرفضت."
  en: "English Wikipedia article on Hayat Sindi (born 6 November 1967 in Mecca), the Saudi biotechnologist who in 2001 became the first Saudi woman to earn a PhD in biotechnology from the University of Cambridge, one of the first women appointed to Saudi Arabia's Consultative Assembly in 2013 and a UNESCO Goodwill Ambassador since 2012; it records that she wears the traditional Muslim headscarf and was pressured at university to abandon her religious beliefs, which she refused to do."
  es: "Artículo de la Wikipedia en inglés sobre Hayat Sindi (nacida el 6 de noviembre de 1967 en La Meca), la biotecnóloga saudí que en 2001 se convirtió en la primera mujer saudí en obtener un doctorado en biotecnología de la Universidad de Cambridge, una de las primeras mujeres nombradas para la Asamblea Consultiva de Arabia Saudí en 2013 y Embajadora de Buena Voluntad de la UNESCO desde 2012; en él se indica que lleva el velo musulmán tradicional y que fue presionada en la universidad para que abandonara sus creencias religiosas, a lo que se negó."
  fr: "L'article de Wikipédia en anglais sur Hayat Sindi (née le 6 novembre 1967 à La Mecque), la biotechnologiste saoudienne qui, en 2001, est devenue la première Saoudienne à obtenir un doctorat en biotechnologie de l'Université de Cambridge, l'une des premières femmes nommées à l'Assemblée consultative d'Arabie saoudite en 2013 et ambassadrice de bonne volonté de l'UNESCO depuis 2012, indique qu'elle porte le foulard traditionnel musulman et qu'elle a subi des pressions à l'université pour abandonner ses convictions religieuses, ce qu'elle a refusé de faire."
  ur: "حیات سندھی پر انگریزی ویکیپیڈیا کا مضمون ⁦(پیدائش 6 نومبر 1967 مکہ میں)⁩، سعودی بایو ٹکنالوجسٹ جو 2001 میں کیمبرج یونیورسٹی سے بائیو ٹیکنالوجی میں پی ایچ ڈی کرنے والی پہلی سعودی خاتون بنیں، 2013 میں سعودی عرب کی کنسلٹیٹو اسمبلی میں تعینات ہونے والی پہلی خواتین میں سے ایک اور یونیسکو کی خیر سگالی سفیر 012 سے؛ اس میں درج ہے کہ وہ روایتی مسلم سر پر اسکارف پہنتی ہے اور یونیورسٹی میں اس پر دباؤ ڈالا گیا کہ وہ اپنے مذہبی عقائد کو ترک کر دیں، جو اس نے کرنے سے انکار کر دیا۔"
  tr: "Sandy'nin (6 Kasım 1967, Mekke doğumlu) hayatı hakkında İngilizce Wikipedia makalesi; Suudi biyoteknoloji bilimcisi ve 2001'de Cambridge Üniversitesi'nden biyoteknoloji alanında doktora alan ilk Suudi kadın, 2013'ten beri Suudi Şura Konseyi'nde yer alan ilk kadınlardan biri ve 2012'den beri UNESCO İyi Niyet Elçisi; geleneksel İslami başörtüsü taktığını ve üniversitede dini inançlarından vazgeçmesi için baskı altında olduğunu belirtiyor, ancak reddediyor."
  id: "Artikel Wikipedia bahasa Inggris tentang kehidupan Sandy (lahir 6 November 1967 di Mekah), seorang ilmuwan bioteknologi Saudi dan wanita Saudi pertama yang meraih gelar PhD di bidang bioteknologi dari Universitas Cambridge pada tahun 2001, salah satu wanita pertama di Dewan Shura Saudi sejak 2013, dan Duta Besar Goodwill UNESCO sejak 2012; ia menyebutkan bahwa ia mengenakan hijab Islam tradisional dan pernah ditekan di universitas untuk meninggalkan keyakinan agamanya, yang ia tolak."
