summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حياة سندي ⁦(ولدت 6 تشرين الثاني 1967 في مكة)⁩، عالمة التقنية الحيوية السعودية وأول سعودية تحصل على الدكتوراه في التقنية الحيوية من جامعة كامبردج سنة 2001، ومن أوائل النساء في مجلس الشورى السعودي منذ 2013 وسفيرة اليونسكو للنوايا الحسنة منذ 2012؛ وتذكر أنها ترتدي الحجاب التقليدي الإسلامي وأنها تعرضت لضغوط في الجامعة للتخلي عن معتقداتها الدينية فرفضت."
  en: "English Wikipedia article on Hayat Sindi (born 6 November 1967 in Mecca), the Saudi biotechnologist who in 2001 became the first Saudi woman to earn a PhD in biotechnology from the University of Cambridge, one of the first women appointed to Saudi Arabia's Consultative Assembly in 2013 and a UNESCO Goodwill Ambassador since 2012; it records that she wears the traditional Muslim headscarf and was pressured at university to abandon her religious beliefs, which she refused to do."
