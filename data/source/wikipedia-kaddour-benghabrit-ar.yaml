  ar: "مقال العربية عن قدور بن غبريط (1868-1954): أصله التلمساني، تعليمه في الثعلبية والقرويين، عمله مترجماً لدى المفوضية الفرنسية بطنجة ورئيس بروتوكول للسلطان، دوره في معاهدة فاس، تأسيسه مسجد باريس الكبير وإنقاذه مئات اليهود في الحرب العالمية الثانية."
  en: "Arabic encyclopedia article on Kaddour Benghabrit (1868-1954): his Tlemcen origin, his education at the Thaalibiya and al-Karaouine, his interpreting for the French legation at Tangier and protocol service to the Sultan, his role in the Treaty of Fes, his founding of the Grand Mosque of Paris and his rescue of hundreds of Jews in the Second World War."
