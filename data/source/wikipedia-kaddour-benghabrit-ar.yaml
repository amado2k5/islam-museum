summary:
  ar: "مقال العربية عن قدور بن غبريط (1868-1954): أصله التلمساني، تعليمه في الثعلبية والقرويين، عمله مترجماً لدى المفوضية الفرنسية بطنجة ورئيس بروتوكول للسلطان، دوره في معاهدة فاس، تأسيسه مسجد باريس الكبير وإنقاذه مئات اليهود في الحرب العالمية الثانية."
  en: "Arabic encyclopedia article on Kaddour Benghabrit (1868-1954): his Tlemcen origin, his education at the Thaalibiya and al-Karaouine, his interpreting for the French legation at Tangier and protocol service to the Sultan, his role in the Treaty of Fes, his founding of the Grand Mosque of Paris and his rescue of hundreds of Jews in the Second World War."
  es: "Artículo de una enciclopedia árabe sobre Kaddour Benghabrit (1868-1954): su origen en Tlemcen, su educación en Thaalibiya y al-Karaouine, su labor como intérprete para la legación francesa en Tánger y su servicio protocolario al sultán, su papel en el Tratado de Fez, la fundación de la Gran Mezquita de París y el rescate de cientos de judíos durante la Segunda Guerra Mundial."
  fr: "Article d'encyclopédie arabe sur Kaddour Benghabrit (1868-1954): ses origines à Tlemcen, son éducation à la Thaalibiya et à al-Karaouine, son interprétation pour la légation française à Tanger et son service protocolaire auprès du Sultan, son rôle dans le traité de Fès, la fondation de la Grande Mosquée de Paris et le sauvetage de centaines de Juifs pendant la Seconde Guerre mondiale."
  ur: "عربی انسائیکلوپیڈیا کا مضمون قدور بنگھبریت (1868-1954): اس کی تلمسن کی ابتدا، ثالبیہ اور الکراوائن میں اس کی تعلیم، تانگیر میں فرانسیسی لیگ کے لیے ان کی ترجمانی اور سلطان کے لیے پروٹوکول سروس، معاہدہ فیس میں اس کا کردار، دوسری عالمی جنگ میں اس کا بانی اور جیوس کی عظیم الشان مسجد کی پادری کی بانی۔"
  tr: "Kadur ibn Ghabrit (1868-1954) hakkında Arapça makale: Tlemceni kökeni, Tha'alabiyyah ve Qarawiyyin'deki eğitimi, Tanca'daki Fransız komisyonunda tercümanlık ve Sultan için protokol başkanı olarak çalışması, Fez Antlaşması'ndaki rolü, Paris Büyük Camii'nin kuruluşu ve II. Dünya Savaşı sırasında yüzlerce Yahudiyi kurtarması."
  id: "Artikel Arab tentang Kadur ibn Ghabrit (1868-1954): Asal-usul Tlemceni-nya, pendidikannya di Tha'alabiyyah dan Qarawiyyin, pekerjaannya sebagai penerjemah di komisi Prancis di Tangier dan kepala protokol untuk Sultan, perannya dalam Perjanjian Fez, pendirian Masjid Besar Paris, dan penyelamatannya terhadap ratusan orang Yahudi selama Perang Dunia II."
