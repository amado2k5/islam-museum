summary:
  ar: "مقالة ويكيبيديا العربية عن مريم ميرزاخاني؛ تُستخدم لوقائع الكيان فقط. تلخّص مسيرتها رياضياتيةً إيرانية نالت ميدالية فيلدز سنة 2014، وتتبنّى قراءتي الأقلية لتاريخي ولادتها ووفاتها: 3 أيار 1977 و15 تموز 2017."
  en: "Arabic Wikipedia article on Maryam Mirzakhani; used for entity facts only. It summarises her career as the Iranian mathematician who won the Fields Medal in 2014 and follows the minority readings of her dates: born 3 May 1977, died 15 July 2017."
  es: "Artículo en árabe de la Wikipedia sobre Maryam Mirzakhani; utilizado únicamente para datos biográficos. Resume su trayectoria como la matemática iraní que ganó la Medalla Fields en 2014 y sigue las versiones minoritarias de sus fechas: nacida el 3 de mayo de 1977, fallecida el 15 de julio de 2017."
  fr: "Article de Wikipédia en arabe sur Maryam Mirzakhani; utilisé uniquement à des fins d’information sur l’entité. Il résume sa carrière de mathématicienne iranienne, lauréate de la médaille Fields en 2014, et reprend les versions minoritaires de ses dates: née le 3 mai 1977, décédée le 15 juillet 2017."
  ur: "مریم مرزاخانی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ایرانی ریاضی دان کے طور پر اس کے کیریئر کا خلاصہ کرتا ہے جس نے 2014 میں فیلڈز میڈل جیتا تھا اور اس کی تاریخوں کی اقلیتی ریڈنگ کی پیروی کرتا ہے: 3 مئی 1977 کو پیدا ہوا، 15 جولائی 2017 کو انتقال ہوا۔"
  tr: "Maryam Mirzakhani hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kariyerini, 2014'te Fields Madalyası'nı kazanan İranlı bir matematikçi olarak özetliyor ve doğum ile ölüm tarihlerini azınlık olarak değerlendiriyor: 3 Mayıs 1977 ve 15 Temmuz 2017."
  id: "Artikel Wikipedia berbahasa Arab tentang Maryam Mirzakhani; digunakan hanya untuk fakta entitas. Ia merangkum kariernya sebagai matematikawan Iran yang memenangkan Medali Fields pada tahun 2014, mengadopsi pembacaan minoritas atas tanggal lahir dan kematiannya: 3 Mei 1977, dan 15 Juli 2017."
