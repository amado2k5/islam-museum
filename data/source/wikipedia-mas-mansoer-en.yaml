summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ماس منصور؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في سورابايا في 25 حزيران 1896 ووفاته في سجن كاليسوسوك بسورابايا في 25 نيسان 1946 ودفنه في غيبو، وتروي دراسته في مكة والأزهر، ورئاسته للمحمدية (1937–1942) وخلفه كي باغوس هاديكوسومو، وفتاواه ومنها تحريم فائدة البنوك ومنع التقاليد التي عدّها بدعًا. لا تسمي له مذهبًا."
  en: "English Wikipedia article on Mas Mansoer; used for entity facts only. It gives his birth at Surabaya on 25 June 1896, his death in Kalisosok Prison, Surabaya, on 25 April 1946 and his burial at Gipu, and recounts his studies in Mecca and at al-Azhar, his Muhammadiyah chairmanship (1937–1942) with Ki Bagoes Hadikoesoemo as successor, and his rulings, including the prohibition of bank interest and of practices he counted as innovations. It names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Mas Mansoer; utilizado únicamente para datos biográficos. Indica su nacimiento en Surabaya el 25 de junio de 1896, su muerte en la prisión de Kalisosok, Surabaya, el 25 de abril de 1946 y su entierro en Gipu. Relata sus estudios en La Meca y en Al-Azhar, su presidencia de Muhammadiyah (1937-1942) con Ki Bagoes Hadikoesoemo como sucesor, y sus dictámenes, incluida la prohibición de los intereses bancarios y de las prácticas que consideraba innovadoras. No menciona ninguna escuela a la que pertenezca."
  fr: "L'article de Wikipédia en anglais consacré à Mas Mansoer, utilisé uniquement pour les informations biographiques, indique sa naissance à Surabaya le 25 juin 1896, son décès à la prison de Kalisosok (Surabaya) le 25 avril 1946 et son inhumation à Gipu. Il relate également ses études à La Mecque et à al-Azhar, sa présidence de la Muhammadiyah (1937-1942), avec Ki Bagoes Hadikoesoemo comme successeur, ainsi que ses décisions, notamment l'interdiction des intérêts bancaires et des pratiques qu'il considérait comme des innovations. Aucune école n'est mentionnée à son sujet."
