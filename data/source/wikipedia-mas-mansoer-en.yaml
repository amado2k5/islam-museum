summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ماس منصور؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في سورابايا في 25 حزيران 1896 ووفاته في سجن كاليسوسوك بسورابايا في 25 نيسان 1946 ودفنه في غيبو، وتروي دراسته في مكة والأزهر، ورئاسته للمحمدية (1937–1942) وخلفه كي باغوس هاديكوسومو، وفتاواه ومنها تحريم فائدة البنوك ومنع التقاليد التي عدّها بدعًا. لا تسمي له مذهبًا."
  en: "English Wikipedia article on Mas Mansoer; used for entity facts only. It gives his birth at Surabaya on 25 June 1896, his death in Kalisosok Prison, Surabaya, on 25 April 1946 and his burial at Gipu, and recounts his studies in Mecca and at al-Azhar, his Muhammadiyah chairmanship (1937–1942) with Ki Bagoes Hadikoesoemo as successor, and his rulings, including the prohibition of bank interest and of practices he counted as innovations. It names no school for him."
