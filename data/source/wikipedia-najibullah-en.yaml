summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد نجيب الله؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 6 أغسطس 1947 في غرديز بولاية بكتيا، ودراسته الطب في جامعة كابل، ورئاسته جهاز الخاد ثم الحزب والحكومة حتى 1992، وسياسة المصالحة الوطنية التي جعلت الإسلام دين الدولة في دستور 1990، ومقتله بيد طالبان في كابل في 27 سبتمبر 1996 ودفنه في غرديز بعد صلاة الجنازة."
  en: "English Wikipedia article on Mohammad Najibullah; used for entity facts only. It recounts his birth on 6 August 1947 at Gardez in Paktia, his medical studies at Kabul University, his leadership of KHAD and then of the party and government until 1992, the National Reconciliation policy that made Islam the state religion in the 1990 constitution, his killing by the Taliban at Kabul on 27 September 1996 and his burial at Gardez after Islamic funeral prayers."
