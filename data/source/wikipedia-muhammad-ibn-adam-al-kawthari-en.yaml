  ar: "مقالة ويكيبيديا الإنجليزية عن محمد بن آدم الكوثري: مفتٍ بريطاني وُلد في ليستر سنة 1976، مؤسس دار الإفتاء في ليستر وكبير مفتييها؛ يعطي صندوق معلوماتها دينه الإسلام ومذهبه سنّياً وفقهه حنفياً وحركته ديوبندية."
  en: "The English Wikipedia article on Muhammad ibn Adam Al-Kawthari: a British mufti born in Leicester in 1976, founder and Chief Mufti of Darul Ifta Leicester; its infobox gives his denomination as Sunni, his jurisprudence as Hanafi and his movement as Deobandi."
  es: "El artículo de la Wikipedia en inglés sobre Muhammad ibn Adam Al-Kawthari: un muftí británico nacido en Leicester en 1976, fundador y Gran Muftí de Darul Ifta Leicester; su ficha informativa indica que su denominación es sunita, su jurisprudencia es hanafi y su movimiento es deobandi."
  fr: "L'article de Wikipédia en anglais sur Muhammad ibn Adam Al-Kawthari: un mufti britannique né à Leicester en 1976, fondateur et grand mufti de Darul Ifta Leicester; son infobox indique qu'il est sunnite, hanafite et déobandi."
  ur: "محمد ابن آدم الکوثاری پر انگریزی ویکیپیڈیا کا مضمون: ایک برطانوی مفتی جو لیسٹر میں 1976 میں پیدا ہوئے، دارالافتا لیسٹر کے بانی اور چیف مفتی؛ اس کا انفو باکس اس کا فرقہ سنی، اس کی فقہ حنفی اور اس کی تحریک کو دیوبندی بتاتا ہے۔"
