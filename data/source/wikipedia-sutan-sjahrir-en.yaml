  ar: "مقالة ويكيبيديا الإنجليزية عن سوتان صاهرير (1909–1966)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بادانغ بانجانغ في 5 مارس 1909، ودراسته في أمستردام ولايدن، ومقاومته للاحتلال الياباني، ورئاسته الأولى لوزراء إندونيسيا (1945–1947)، وتأسيسه الحزب الاشتراكي الإندونيسي، وسجنه دون محاكمة، ووفاته في زيورخ في 9 أبريل 1966."
  en: "English Wikipedia article on Sutan Sjahrir (1909–1966); used for entity facts only. It recounts his birth at Padang Panjang on 5 March 1909, his studies at Amsterdam and Leiden, his resistance to the Japanese occupation, his premiership as Indonesia's first prime minister (1945–1947), his founding of the Indonesian Socialist Party, his imprisonment without trial, and his death at Zürich on 9 April 1966."
