summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سوتان صاهرير (1909–1966)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بادانغ بانجانغ في 5 مارس 1909، ودراسته في أمستردام ولايدن، ومقاومته للاحتلال الياباني، ورئاسته الأولى لوزراء إندونيسيا (1945–1947)، وتأسيسه الحزب الاشتراكي الإندونيسي، وسجنه دون محاكمة، ووفاته في زيورخ في 9 أبريل 1966."
  en: "English Wikipedia article on Sutan Sjahrir (1909–1966); used for entity facts only. It recounts his birth at Padang Panjang on 5 March 1909, his studies at Amsterdam and Leiden, his resistance to the Japanese occupation, his premiership as Indonesia's first prime minister (1945–1947), his founding of the Indonesian Socialist Party, his imprisonment without trial, and his death at Zürich on 9 April 1966."
  es: "Artículo de la Wikipedia en inglés sobre Sutan Sjahrir (1909-1966); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Padang Panjang el 5 de marzo de 1909, sus estudios en Ámsterdam y Leiden, su resistencia a la ocupación japonesa, su mandato como primer ministro de Indonesia (1945-1947), la fundación del Partido Socialista Indonesio, su encarcelamiento sin juicio y su muerte en Zúrich el 9 de abril de 1966."
  fr: "Article de Wikipédia en anglais sur Sutan Sjahrir (1909-1966); utilisé uniquement pour les informations biographiques. Il relate sa naissance à Padang Panjang le 5 mars 1909, ses études à Amsterdam et à Leyde, sa résistance à l'occupation japonaise, son mandat de premier ministre d'Indonésie (1945-1947), la fondation du Parti socialiste indonésien, son emprisonnement sans procès et sa mort à Zurich le 9 avril 1966."
  ur: "انگریزی ویکیپیڈیا مضمون سوتن سجحریر (1909–1966) پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 5 مارچ 1909 کو پڈانگ پنجانگ میں ان کی پیدائش، ایمسٹرڈیم اور لیڈن میں ان کی تعلیم، جاپانی قبضے کے خلاف ان کی مزاحمت، انڈونیشیا کے پہلے وزیر اعظم (1945-1947) کے طور پر ان کی وزارت عظمیٰ، انڈونیشین سوشلسٹ پارٹی کی بنیاد، بغیر مقدمہ چلائے ان کی قید، 1969 اپریل کو ان کی موت، اور 1969 میں ان کی موت کا ذکر ہے۔"
