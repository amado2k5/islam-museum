  ar: "مقالة ويكيبيديا الإنجليزية عن دانيال حقيقتجو؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في هيوستن سنة 1985 أو 1986 لأبوين إيرانيين، ودراسته في هارفارد وتافتس، وكتابته في «مسلم ماترز»، وتأسيسه موقع وقناة «مسلم سكيبتيك» سنة 2015 ومعهد الأسنى سنة 2019، وكتابه «خطر الحداثة على الإسلام» (2020)، وتقارير عن الجدل حول خطابه."
  en: "English Wikipedia article on Daniel Haqiqatjou; used for entity facts only. It gives his birth in Houston in 1985 or 1986 to Iranian parents, his Harvard and Tufts education, his writing for MuslimMatters, his founding of the Muslim Skeptic website and channel in 2015 and of the Alasna Institute in 2019, his book The Modernist Menace to Islam (2020), and reports of controversy over his rhetoric."
