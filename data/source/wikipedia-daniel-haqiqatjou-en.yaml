summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن دانيال حقيقتجو؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في هيوستن سنة 1985 أو 1986 لأبوين إيرانيين، ودراسته في هارفارد وتافتس، وكتابته في «مسلم ماترز»، وتأسيسه موقع وقناة «مسلم سكيبتيك» سنة 2015 ومعهد الأسنى سنة 2019، وكتابه «خطر الحداثة على الإسلام» (2020)، وتقارير عن الجدل حول خطابه."
  en: "English Wikipedia article on Daniel Haqiqatjou; used for entity facts only. It gives his birth in Houston in 1985 or 1986 to Iranian parents, his Harvard and Tufts education, his writing for MuslimMatters, his founding of the Muslim Skeptic website and channel in 2015 and of the Alasna Institute in 2019, his book The Modernist Menace to Islam (2020), and reports of controversy over his rhetoric."
  es: "Artículo de la Wikipedia en inglés sobre Daniel Haqiqatjou; utilizado únicamente para datos sobre la persona. En él se menciona su nacimiento en Houston en 1985 o 1986, de padres iraníes; su formación en Harvard y Tufts; sus artículos para MuslimMatters; la fundación del sitio web y canal Muslim Skeptic en 2015 y del Instituto Alasna en 2019; su libro The Modernist Menace to Islam (2020); y las controversias surgidas en torno a su retórica."
  fr: "Article de Wikipédia en anglais sur Daniel Haqiqatjou; utilisé uniquement pour les informations sur l’entité. Il mentionne sa naissance à Houston en 1985 ou 1986 de parents iraniens, ses études à Harvard et à Tufts, ses articles pour MuslimMatters, la création du site web et de la chaîne Muslim Skeptic en 2015 et de l’Institut Alasna en 2019, son livre The Modernist Menace to Islam (2020), ainsi que des articles relatant des controverses concernant sa rhétorique."
  ur: "انگریزی ویکیپیڈیا مضمون ڈینیل حقیقاتجو پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے 1985 یا 1986 میں ہیوسٹن میں ایرانی والدین، اس کی ہارورڈ اور ٹفٹس کی تعلیم، مسلم میٹرس کے لیے ان کی تحریر، 2015 میں مسلم سکیپٹک ویب سائٹ اور چینل کی بنیاد اور 2019 میں الاسنا انسٹی ٹیوٹ کی بنیاد، اس کی کتاب The Modernist Menace to Islam (2020)، اور اس کی متنازعہ رپورٹوں کے حوالے سے ان کی پیدائش ہیوسٹن میں ہوئی۔"
