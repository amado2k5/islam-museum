summary:
  ar: "منار الآثار — الأرشيف الرقمي بجامعة أكسفورد الذي أسسته جوديث ماكنزي: نحو ٨٣ ألف صورة عالية الدقة لمواقع أثرية ومبانٍ وفنون إسلامية في العالم الإسلامي ⁦(من نحو ٣٠٠ ق.م فصاعداً)⁩، ببطاقات ثنائية اللغة العربية والإنجليزية."
  en: "Manar al-Athar — the University of Oxford digital archive founded by Judith McKenzie: ~83,000 high-resolution photographs of archaeological sites, buildings and art across the Islamicate world (c.300 BC onward), labelled in both Arabic and English."
  ur: "Manar al-Athar — the University of Oxford digital archive founded by Judith McKenzie: ~83,000 high-resolution photographs of archaeological sites, buildings and art across the Islamicate world (c.300 BC onward), labelled in both Arabic and English."
  es: "Manar al-Athar, el archivo digital de la Universidad de Oxford fundado por Judith McKenzie, contiene aproximadamente 83.000 fotografías de alta resolución de yacimientos arqueológicos, edificios y obras de arte de todo el mundo islámico (desde el año 300 a. C. en adelante), con etiquetas en árabe e inglés."
  fr: "Manar al-Athar — les archives numériques de l'Université d'Oxford fondées par Judith McKenzie: environ 83 000 photographies haute résolution de sites archéologiques, de bâtiments et d'œuvres d'art du monde islamique (à partir de 300 av. J.-C.), légendées en arabe et en anglais."
  tr: "Arkeoloji Manarı — Judith Mackenzie tarafından kurulan Oxford Üniversitesi Dijital Arşivi: İslam dünyasındaki arkeolojik alanlar, binalar ve İslami sanatların yaklaşık 83.000 yüksek çözünürlüklü görüntüsü (MÖ 300 civarından itibaren), iki dilli Arapça ve İngilizce kartlarla."
  id: "Manar of Archaeology — Arsip Digital di Universitas Oxford, didirikan oleh Judith Mackenzie: Sekitar 83.000 gambar resolusi tinggi situs arkeologi, bangunan, dan seni Islam di dunia Islam (mulai sekitar 300 SM), dengan kartu dwibahasa Arab dan Inggris."
