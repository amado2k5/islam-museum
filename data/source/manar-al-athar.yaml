reliability_note: "Photographic evidence of what stands where — buildings, mosaics, inscriptions, funerary and religious monuments — the visual corroboration layer for building records. Cite as {cite:manar-al-athar <record-id>} (per-image records under manar.arch.ox.ac.uk; captions and identifications only). Facts-only permanently: the archive's CC BY-NC-SA 2.0 UK posture means images are never ingested and record text never republished. Live host confirmed 8 November 2026; legacy domains dead; no robots.txt. Bilingual ar/en labels make it a rare Arabic-first asset. Assessment: web-sources lane, 8 Nov 2026; decision dec-20261108-216 (supersedes engine false-positive dec-20261108-209)."
