label:
  ar: "ابن حزم، المحلى بالآثار، المجلد الثالث عشر ⁦(دار ابن حزم، بيروت، ط1، 1437هـ/2016م)⁩"
  en: "Ibn Hazm, al-Muhalla bi-l-Athar, vol. 13 (Dar Ibn Hazm, Beirut, 1st ed., 1437/2016)"
  ur: "ابن حزم، المحلی بالآثار، جلد سیزدہم ⁦(دار ابن حزم، بیروت، طبع اول، 1437ھ/2016ء)⁩"
summary:
  ar: "المجلد الثالث عشر من طبعة دار ابن حزم لـ«المحلى»، بإشراف خالد الرباط ومشاركة باحثين، يضم تتمة كتاب النكاح وأحكام الطلاق وكتاب الظهار، مع تعليقات المحققين وتخريجاتهم وفهرس المسائل."
  en: "Volume 13 of the Dar Ibn Hazm edition of al-Muhalla, supervised by Khalid al-Rabbat with a team of researchers, holding the end of the Book of Marriage, the rulings on divorce and the Book of Zihar, with the editors' notes, references and an index of questions."
  ur: "دار ابن حزم کے ایڈیشن «المحلی» کی جلد سیزدہم، خالد الرباط کی نگرانی میں محققین کی شرکت سے، جس میں کتاب النکاح کا آخری حصہ، طلاق کے احکام اور کتاب الظہار ہیں، محققین کے حواشی، تخریجات اور مسائل کی فہرست کے ساتھ۔"
  es: "Volumen 13 de la edición Dar Ibn Hazm de al-Muhalla, supervisada por Khalid al-Rabbat con un equipo de investigadores, que contiene el final del Libro del Matrimonio, las normas sobre el divorcio y el Libro del Zihar, con notas de los editores, referencias y un índice de preguntas."
  fr: "Volume 13 de l'édition Dar Ibn Hazm d'al-Muhalla, supervisée par Khalid al-Rabbat avec une équipe de chercheurs, contenant la fin du Livre du Mariage, les décisions sur le divorce et le Livre du Zihar, avec les notes des éditeurs, les références et un index des questions."
  tr: "Khalid Al-Rabat'ın denetiminde ve araştırmacıların katılımıyla Dar İbn Hazm baskısının on üçüncü cildi, Evlilik Kitabı'nın devamını, boşanma kararlarını ve Zihar Kitabı'nı, editörlerin açıklamaları ve eleştirileri ile bir konu dizini içermektedir."
  id: "Volume tiga belas edisi Dar Ibn Hazm \"Al-Muhalla,\" yang diawasi oleh Khalid Al-Rabat dan dengan partisipasi para peneliti, memuat kelanjutan Kitab Pernikahan, putusan perceraian, dan Kitab Zihar, bersama dengan anotasi dan kritik dari para editor serta indeks isu."
title: "المحلى بالآثار في شرح المجلى بالاختصار ⁦(المجلد الثالث عشر)⁩"
