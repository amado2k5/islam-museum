summary:
  ar: "المجلد الثالث عشر من طبعة دار ابن حزم لـ«المحلى»، بإشراف خالد الرباط ومشاركة باحثين، يضم تتمة كتاب النكاح وأحكام الطلاق وكتاب الظهار، مع تعليقات المحققين وتخريجاتهم وفهرس المسائل."
  en: "Volume 13 of the Dar Ibn Hazm edition of al-Muhalla, supervised by Khalid al-Rabbat with a team of researchers, holding the end of the Book of Marriage, the rulings on divorce and the Book of Zihar, with the editors' notes, references and an index of questions."
  ur: "دار ابن حزم کے ایڈیشن «المحلی» کی جلد سیزدہم، خالد الرباط کی نگرانی میں محققین کی شرکت سے، جس میں کتاب النکاح کا آخری حصہ، طلاق کے احکام اور کتاب الظہار ہیں، محققین کے حواشی، تخریجات اور مسائل کی فہرست کے ساتھ۔"
title: "المحلى بالآثار في شرح المجلى بالاختصار (المجلد الثالث عشر)"
