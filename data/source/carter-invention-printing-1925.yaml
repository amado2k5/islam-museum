summary:
  ar: "تاريخ مدرسي للنقل من الصين إلى الغرب؛ فصوله عن الورق والتنقّل من سمرقند إلى الأندلس تروي خبر أسرى طلاس مع نقد المؤرخ لحدوده."
  en: "A classic Columbia account of transmission from China westward; its chapters on paper's career from Samarkand to Spain narrate the Talas prisoner story while flagging its evidential limits."
  ur: "چین سے مغرب تک منتقلی کا کلاسیکی کولمبیا بیان؛ سمرقند سے اسپین تک کاغذ کے سفر کے ابواب طلاس کے قیدیوں کی روایت سناتے اور اس کی تحدیری حدود بتاتے ہیں۔"
  es: "Un relato clásico de la Universidad de Columbia sobre la transmisión del papel desde China hacia Occidente; sus capítulos sobre la trayectoria del papel desde Samarcanda hasta España narran la historia del prisionero de Talas al tiempo que señalan las limitaciones de sus pruebas."
