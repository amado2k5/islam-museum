summary:
  ar: "المذكرات الرسمية عن الولايات الهندية لسنة 1921 (حكومة الهند): قسم قلات فيها ينص على أن محمود خان خلف والده خداداد خان عند تنازله في نوفمبر 1893، وأن خداداد خان توفي في 20 مايو 1909، ويعدّد أبناءه ومنهم الأمير عظيم جان."
  en: "The Government of India's official Memoranda on the Indian States 1921: its Kalat section states that Mahmud Khan succeeded his father Khudadad Khan on the latter's abdication in November 1893, that 'Mir Khudadad Khan died on 20th May 1909', and lists Khudadad's sons, among them Prince Azim Jan."
