reliability_note: >-
  Official colonial reference work, the Government of India's own
  state-by-state memoranda; the Kalat passage (section 3) was read in
  the Internet Archive's full OCR text on 31 October 2026. The 1911
  edition of the same Memoranda gives the same death date, 20 May
  1909, and the Statesman's Year-Book for 1913 independently gives
  May 1909. This is the record's source for Khudadad Khan's death,
  which the Wikipedia articles leave unknown; it is a contemporary
  administrative source for the Kalat court it supervised.
