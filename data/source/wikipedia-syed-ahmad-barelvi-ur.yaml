reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his full name as Syed Ahmad ibn Syed Muhammad Irfan, born at Daira Shah Alamullah, Rae Bareli, on 6 Safar 1201 AH = 29 November 1786, and his death at Balakot, Mansehra district, on 24 Dhu al-Qa'da 1246 AH = 6 May 1831. Its infobox gives his school of thought as 'Waliullahi' (the movement of Shah Waliullah's school) — a movement label, not a madhhab — and his fields of work as jihad, tasawwuf and preaching. Its lead calls him an Indian reformer and Sufi, and its 'silsila of shaykhs' runs from him through Shah Abdul Aziz and Shah Waliullah to Ahmad Sirhindi. It names no madhhab in its text; its category filing under 'Hanafis' is a filing, not an attestation, and is not counted."
