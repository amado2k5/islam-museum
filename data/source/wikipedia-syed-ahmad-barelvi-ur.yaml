summary:
  ar: "مقالة ويكيبيديا الأردية عن سيد أحمد بريلوي؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه الكامل وولادته في 6 صفر 1201هـ الموافق 29 نوفمبر 1786م في رائي بريلي ووفاته في بالاكوت في 6 مايو 1831م، وتصفه بأنه صوفي وتطبع سلسلة شيوخه الروحية إلى أحمد سرهندي."
  en: "Urdu Wikipedia article on Syed Ahmad Barelvi; used for entity facts only. It gives his full name, his birth on 6 Safar 1201 AH, 29 November 1786, at Rae Bareli, and his death at Balakot on 6 May 1831; it calls him a Sufi in its lead and prints his spiritual chain (silsila) through Shah Abdul Aziz and Shah Waliullah back to Ahmad Sirhindi."
  es: "Artículo de Wikipedia en urdu sobre Syed Ahmad Barelvi; utilizado únicamente para datos sobre la persona. Indica su nombre completo, su nacimiento el 6 de Safar de 1201 AH (29 de noviembre de 1786) en Rae Bareli y su fallecimiento en Balakot el 6 de mayo de 1831. En su introducción, lo describe como un sufí y detalla su cadena espiritual (silsila) a través de Shah Abdul Aziz y Shah Waliullah, remontándose hasta Ahmad Sirhindi."
  fr: "Article de Wikipédia en ourdou sur Syed Ahmad Barelvi; utilisé uniquement pour les informations sur l’entité. Il donne son nom complet, sa date de naissance le 6 Safar 1201 AH (29 novembre 1786) à Rae Bareli et sa date de décès à Balakot le 6 mai 1831; il le présente comme un soufi en introduction et retrace sa chaîne spirituelle (silsila) à travers Shah Abdul Aziz et Shah Waliullah jusqu’à Ahmad Sirhindi."
  ur: "سید احمد بریلوی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا پورا نام بتایا گیا ہے، ان کی پیدائش 6 صفر 1201 ہجری، 29 نومبر 1786 کو رائے بریلی میں، اور 6 مئی 1831 کو بالاکوٹ میں ان کی وفات؛ یہ اسے اپنی قیادت میں صوفی کہتا ہے اور شاہ عبدالعزیز اور شاہ ولی اللہ کے ذریعے ان کا روحانی سلسلہ ⁦(سلسلہ)⁩ واپس احمد سرہندی تک چھاپتا ہے۔"
