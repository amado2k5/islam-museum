summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ناصر الدين شاه قاجار؛ تُستخدم لوقائع الكيان فقط. تعطي عهده الطويل (1848-1896)، ووزارة أمير كبير وإعدامه سنة 1852، ورحلاته الأوروبية الثلاث ⁦(1873 و1878 و1889)⁩، واحتجاج التبغ (1890-92)، واغتياله في مرقد الشاه عبد العظيم بالري في 1 مايو 1896 ودفنه فيه."
  en: "English Wikipedia article on Naser al-Din Shah Qajar; used for entity facts only. It gives his long reign (1848-1896), Amir Kabir's ministry and execution in 1852, his three European journeys (1873, 1878, 1889), the Tobacco Protest (1890-92), and his assassination at the Shah Abdol-Azim Shrine in Ray on 1 May 1896 and burial there."
  es: "Artículo de la Wikipedia en inglés sobre Naser al-Din Shah Qajar; utilizado únicamente para datos sobre la persona. Describe su largo reinado (1848-1896), el ministerio y la ejecución de Amir Kabir en 1852, sus tres viajes a Europa (1873, 1878, 1889), la protesta contra el tabaco (1890-1892) y su asesinato en el santuario de Shah Abdol-Azim en Ray el 1 de mayo de 1896, donde fue enterrado."
  fr: "Article de Wikipédia en anglais sur Naser al-Din Shah Qajar; utilisé uniquement pour les informations factuelles. Il relate son long règne (1848-1896), le ministère d'Amir Kabir et son exécution en 1852, ses trois voyages en Europe (1873, 1878, 1889), la Révolte du tabac (1890-1892), et son assassinat au mausolée de Shah Abdol-Azim à Ray le 1er mai 1896 et son inhumation sur place."
  ur: "انگریزی ویکیپیڈیا مضمون ناصر الدین شاہ قاجار پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کے طویل دور حکومت (1848-1896)، امیر کبیر کی وزارت اور 1852 میں ان کی پھانسی، اس کے تین یورپی سفر ⁦(1873، 1878، 1889)⁩، تمباکو پروٹسٹ (1890-92)، اور 19 مئی 1969 کو شاہ عبدالعظیم میں اس کے قتل اور 19 مئی کو شاہ عبدالعظیم کے قتل کا ذکر کیا گیا ہے۔"
