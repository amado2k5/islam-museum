reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 26 October 2026 and checked against the recorded revision. Its current text gives his birth as 17 July 1831 at Kahnamu, a village near Tabriz, eldest son of Mohammad Shah Qajar and Malek Jahan Khanom (Mahd-e Olia); an older revision of the same article, still mirrored, gives 16 July 1831 and Tabriz. Its infobox carries a religion field reading 'Shia Islam', but its text names no school for him personally: the mentions of Shia Islam are institutional (the Shia call to prayer ordered after the capture of Herat in 1856; the zakat restrictions that left those funds with the ulama), together with his own devotional margin note after Herat thanking 'Murtaza Ali' — practice and devotion, not an attestation of a school."
