  en: "English Wikipedia article on Naser al-Din Shah Qajar; used for entity facts only. It gives his long reign (1848-1896), Amir Kabir's ministry and execution in 1852, his three European journeys (1873, 1878, 1889), the Tobacco Protest (1890-92), and his assassination at the Shah Abdol-Azim Shrine in Ray on 1 May 1896 and burial there."
