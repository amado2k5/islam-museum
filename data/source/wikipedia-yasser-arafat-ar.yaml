  ar: "مقالة ويكيبيديا العربية عن ياسر عرفات؛ تُستخدم لوقائع الكيان فقط. توافق الإنجليزية في الولادة في القاهرة والوفاة في 11 نوفمبر 2004، وتتخذ 4 أغسطس 1929 تاريخًا للولادة وتقترنه بهجريًا (29 صفر 1348 هـ)، وتقترن الوفاة بـ28 رمضان 1425 هـ. يقرأ حقل الدين في صندوق معلوماتها «الإسلام» عامة، دون مذهب."
  en: "Arabic Wikipedia article on Yasser Arafat; used for entity facts only. It agrees with the English article on the Cairo birth and the death of 11 November 2004, takes 4 August 1929 as the birth date and pairs it with 29 Safar 1348 AH, and pairs the death with 28 Ramadan 1425 AH. Its infobox religion field reads Islam generally, with no school."
