summary:
  ar: "مقالة ويكيبيديا العربية عن ياسر عرفات؛ تُستخدم لوقائع الكيان فقط. توافق الإنجليزية في الولادة في القاهرة والوفاة في 11 نوفمبر 2004، وتتخذ 4 أغسطس 1929 تاريخًا للولادة وتقترنه بهجريًا ⁦(29 صفر 1348 هـ)⁩، وتقترن الوفاة بـ28 رمضان 1425 هـ. يقرأ حقل الدين في صندوق معلوماتها «الإسلام» عامة، دون مذهب."
  en: "Arabic Wikipedia article on Yasser Arafat; used for entity facts only. It agrees with the English article on the Cairo birth and the death of 11 November 2004, takes 4 August 1929 as the birth date and pairs it with 29 Safar 1348 AH, and pairs the death with 28 Ramadan 1425 AH. Its infobox religion field reads Islam generally, with no school."
  es: "Artículo de Wikipedia en árabe sobre Yasser Arafat; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre el nacimiento en El Cairo y la muerte el 11 de noviembre de 2004, toma el 4 de agosto de 1929 como fecha de nacimiento y la relaciona con el 29 de Safar de 1348 AH, y relaciona la muerte con el 28 de Ramadán de 1425 AH. Su campo de religión en la ficha informativa indica \"Islam en general\", sin mencionar ninguna escuela."
  fr: "Article de Wikipédia en arabe sur Yasser Arafat; utilisé uniquement pour les informations relatives à l'entité. Il concorde avec l'article en anglais concernant la naissance au Caire et le décès le 11 novembre 2004, mais indique le 4 août 1929 comme date de naissance (associée au 29 Safar 1348 AH) et le 28 Ramadan 1425 AH comme date de décès. Son infobox « Religion » mentionne l'islam en général, sans précision d'école."
  ur: "یاسر عرفات پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ قاہرہ کی پیدائش اور وفات 11 نومبر 2004 کے انگریزی مضمون سے متفق ہے، 4 اگست 1929 کو تاریخ پیدائش کے طور پر لیتا ہے اور اسے 29 صفر 1348 ہجری کے ساتھ جوڑتا ہے، اور موت کو 28 رمضان 1425 ہجری کے ساتھ جوڑتا ہے۔ اس کا infobox مذہب کا میدان عام طور پر اسلام پڑھتا ہے، کوئی اسکول نہیں ہے۔"
  tr: "Yaser Arafat hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. İngilizce, Kahire'de doğum ve 11 Kasım 2004'teki ölüm tarihine karşılık gelir, doğum tarihi olarak 4 Ağustos 1929'u alır ve Hicri takvimine (29 Safar 1348 H) bağlıdır, ölüm ise 28 Ramazan 1425 Hile ilişkilendirilir. Haql-al-Din, genel olarak bilgi kutusunda 'İslam'ı okur, herhangi bir mezhepsel görüş belirtmez."
  id: "Artikel Wikipedia Arab tentang Yasser Arafat; digunakan hanya untuk fakta entitas. Bahasa Inggris sesuai dengan kelahiran di Kairo dan kematian pada 11 November 2004, dan menganggap 4 Agustus 1929 sebagai tanggal lahir dan terkait dengan kalender Hijriyah (29 Safar 1348 H), dan kematian terkait dengan 28 Ramadan 1425 H. Haql al-Din secara umum membaca 'Islam' dalam infobox-nya, tanpa pendapat sektarian."
