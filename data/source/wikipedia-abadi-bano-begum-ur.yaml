  ar: "مقالة ويكيبيديا الأردية عن عبادي بانو بيغوم (بي أما)؛ تُستخدم لوقائع الكيان فقط. تذكر أنها وُلدت سنة 1850 وتوفيت في 12 تشرين الثاني 1924 نقلًا عن «تذكرة ماہ و سال» لمالك رام، وأنها والدة محمد علي جوهر وشوكت علي وعضو نشط في حركة الخلافة جالت البلاد لأجلها."
  en: "Urdu Wikipedia article on Abadi Bano Begum (Bi Amma); used for entity facts only. It gives her birth in 1850 and her death on 12 November 1924, citing Malik Ram's Tazkira Mah-o-Sal, and presents her as the mother of Muhammad Ali Jauhar and Shaukat Ali and an active member of the Khilafat movement who toured the country for it."
