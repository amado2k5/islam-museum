summary:
  ar: "مقالة ويكيبيديا الأردية عن عبادي بانو بيغوم ⁦(بي أما)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر أنها وُلدت سنة 1850 وتوفيت في 12 تشرين الثاني 1924 نقلًا عن «تذكرة ماہ و سال» لمالك رام، وأنها والدة محمد علي جوهر وشوكت علي وعضو نشط في حركة الخلافة جالت البلاد لأجلها."
  en: "Urdu Wikipedia article on Abadi Bano Begum (Bi Amma); used for entity facts only. It gives her birth in 1850 and her death on 12 November 1924, citing Malik Ram's Tazkira Mah-o-Sal, and presents her as the mother of Muhammad Ali Jauhar and Shaukat Ali and an active member of the Khilafat movement who toured the country for it."
  es: "Artículo de Wikipedia en urdu sobre Abadi Bano Begum (Bi Amma); utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1850 y su fallecimiento el 12 de noviembre de 1924, citando el Tazkira Mah-o-Sal de Malik Ram, y la presenta como la madre de Muhammad Ali Jauhar y Shaukat Ali, y como una miembro activa del movimiento Khilafat que recorrió el país en su nombre."
  fr: "L'article de Wikipédia en ourdou sur Abadi Bano Begum (Bi Amma) est utilisé uniquement à titre informatif. Il indique sa naissance en 1850 et son décès le 12 novembre 1924, citant le Tazkira Mah-o-Sal de Malik Ram, et la présente comme la mère de Muhammad Ali Jauhar et de Shaukat Ali, ainsi qu'une membre active du mouvement Khilafat pour lequel elle a parcouru le pays."
  ur: "آبادی بانو بیگم ⁦(بی اماں)⁩ پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1850 میں اس کی پیدائش اور 12 نومبر 1924 کو اس کی موت، مالک رام کی تذکرہ ماہ و سال کا حوالہ دیتے ہوئے، اور اسے محمد علی جوہر اور شوکت علی کی والدہ اور خلافت تحریک کے ایک سرگرم رکن کے طور پر پیش کرتی ہے جس نے اس کے لیے ملک کا دورہ کیا۔"
