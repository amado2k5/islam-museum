summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد ليمو؛ تُستخدم لوقائع الكيان فقط. تثبت ميلاده قرب بيدا سنة 1929 ووفاته في 24 ديسمبر 2020، وتعليمه في ليمو وكانو وكلية الدراسات الشرقية والأفريقية بلندن، وعمله مدرسًا ومفتشًا ثم قاضيًا شرعيًا وكبيرًا لقضاة محكمة الاستئناف الشرعية بولاية نيجر، وتأسيسه مع زوجته عائشة صندوق التعليم الإسلامي سنة 1969، وجائزة الملك فيصل العالمية سنة 2014."
  en: "English Wikipedia article on Ahmed Lemu; used for entity facts only. It gives his birth near Bida in 1929 and his death on 24 December 2020, his education at Lemu, Kano and SOAS in London, his career as teacher and inspector and then as a Sharia judge and Grand Khadi of the Niger State Sharia Court of Appeal, his founding of the Islamic Educational Trust with his wife Aisha in 1969, and the King Faisal Prize of 2014."
