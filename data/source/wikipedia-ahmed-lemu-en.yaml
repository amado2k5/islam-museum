reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the article was fetched by revision id through the MediaWiki API and the returned revid asserted equal to 1373817243 before any claim was drawn. Its lead and infobox give his birth as 21 December 1929 at Lemu village near Bida, Niger State, and his birth name as Ahmad Tijjani Abubakar; its early-life section gives 21 November 1929 instead, a one-month discrepancy inside the article, and the month is recorded from the lead, the Arabic article's Hijri date and Wikidata. It gives his death on 24 December 2020, citing Premium Times and Daily Trust reports of that day. It names no madhhab for him in its text or infobox, and its categories file him only under Nigerian Muslims and Nigerian scholars."
