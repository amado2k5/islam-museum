summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد ليمو؛ تُستخدم لوقائع الكيان فقط. تثبت ميلاده قرب بيدا سنة 1929 ووفاته في 24 ديسمبر 2020، وتعليمه في ليمو وكانو وكلية الدراسات الشرقية والأفريقية بلندن، وعمله مدرسًا ومفتشًا ثم قاضيًا شرعيًا وكبيرًا لقضاة محكمة الاستئناف الشرعية بولاية نيجر، وتأسيسه مع زوجته عائشة صندوق التعليم الإسلامي سنة 1969، وجائزة الملك فيصل العالمية سنة 2014."
  en: "English Wikipedia article on Ahmed Lemu; used for entity facts only. It gives his birth near Bida in 1929 and his death on 24 December 2020, his education at Lemu, Kano and SOAS in London, his career as teacher and inspector and then as a Sharia judge and Grand Khadi of the Niger State Sharia Court of Appeal, his founding of the Islamic Educational Trust with his wife Aisha in 1969, and the King Faisal Prize of 2014."
  es: "Artículo de la Wikipedia en inglés sobre Ahmed Lemu; utilizado únicamente para datos biográficos. En él se menciona su nacimiento cerca de Bida en 1929 y su fallecimiento el 24 de diciembre de 2020, su formación académica en Lemu, Kano y la SOAS de Londres, su trayectoria como profesor e inspector y posteriormente como juez de la Sharia y Gran Cadí del Tribunal de Apelación de la Sharia del Estado de Níger, la fundación del Islamic Educational Trust con su esposa Aisha en 1969 y el Premio Rey Faisal de 2014."
  fr: "Article de Wikipédia en anglais sur Ahmed Lemu; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance près de Bida en 1929 et son décès le 24 décembre 2020, ses études à Lemu, Kano et à la SOAS à Londres, sa carrière d’enseignant et d’inspecteur puis de juge de la charia et de grand cadi de la Cour d’appel de la charia de l’État du Niger, la fondation de l’Islamic Educational Trust avec son épouse Aisha en 1969, et le prix du roi Faisal de 2014."
  ur: "احمد لیمو پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1929 میں بیدا کے قریب ان کی پیدائش اور 24 دسمبر 2020 کو ان کی موت، لندن میں لیمو، کانو اور ایس او اے ایس میں ان کی تعلیم، استاد اور انسپکٹر کے طور پر اس کا کیریئر اور پھر نائجر اسٹیٹ شریعہ کورٹ آف اپیل کے شریعہ جج اور گرینڈ کھادی کے طور پر، اس نے اپنی اہلیہ عائشہ کے ساتھ اسلامک ایجوکیشنل ٹرسٹ کی بنیاد رکھی اور 1969 میں 1960 میں شاہ محمود قریشی کا عہدہ سنبھالا۔"
