summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كامارو عثمان؛ تُستخدم لوقائع الكيان فقط. تروي هجرته من نيجيريا إلى تكساس طفلا، وبطولته الوطنية الجامعية في المصارعة، وفوزه ببطولة يو إف سي لوزن الوسط سنة 2019 بخمس دفاعات ناجحة، وسلسلة انتصاراته القياسية (15)، وخسارته اللقب سنة 2022."
  en: "English Wikipedia article on Kamaru Usman; used for entity facts only. It recounts his childhood emigration from Nigeria to Texas, his collegiate wrestling national title, his 2019 UFC welterweight championship win with five successful defences, his division-record 15-fight win streak, and his loss of the title in 2022."
  es: "Artículo de la Wikipedia en inglés sobre Kamaru Usman; utilizado únicamente para datos sobre la persona. Relata su emigración infantil de Nigeria a Texas, su título nacional universitario de lucha libre, su victoria en el campeonato de peso wélter de la UFC en 2019 con cinco defensas exitosas, su racha récord de 15 victorias consecutivas en la división y la pérdida del título en 2022."
  fr: "Article Wikipédia en anglais sur Kamaru Usman; utilisé uniquement pour les informations sur l'entité. Il relate son émigration du Nigeria au Texas durant son enfance, son titre national de lutte universitaire, sa victoire au championnat UFC des poids welters en 2019, défendue avec succès à cinq reprises, sa série record de 15 victoires consécutives dans la catégorie, et sa perte du titre en 2022."
  ur: "کمارو عثمان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں نائیجیریا سے ٹیکساس میں اس کی بچپن کی ہجرت، اس کا کالج ریسلنگ کا قومی ٹائٹل، پانچ کامیاب دفاعوں کے ساتھ اس کی 2019 UFC ویلٹر ویٹ چیمپئن شپ، اس کے ڈویژن کے ریکارڈ 15 فائٹ جیتنے کا سلسلہ، اور 2022 میں اس کے ٹائٹل سے محرومی کا ذکر ہے۔"
  tr: "Camaro Osman hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için kullanılmıştır. Çocukken Nijerya'dan Teksas'a göçünü, üniversite ulusal güreş şampiyonluğunu, 2019'da beş başarılı savunmayla UFC orta sıklet şampiyonluğunu, rekor galibiyet serisini (15) ve 2022'de unvanı kaybetmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Camaro Osman; digunakan hanya untuk fakta entitas. Artikel ini menceritakan migrasinya dari Nigeria ke Texas saat kecil, gelar gulat nasional perguruan tinggi, gelar juara kelas menengah UFC pada 2019 dengan lima pertahanan sukses, rekor kemenangan beruntun (15), dan kehilangan gelar pada 2022."
