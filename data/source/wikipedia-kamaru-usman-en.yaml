reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Usman as Kamarudeen Usman, born on 11 May 1987 in Auchi, Nigeria, who emigrated to Dallas, Texas at eight; NCAA Division II national champion in 2010; The Ultimate Fighter 21 tournament winner in 2015; UFC welterweight champion from 2 March 2019 (Tyron Woodley) with five successful defences, losing the title to Leon Edwards on 20 August 2022. Its only faith statement is: 'Born to a Muslim father and Christian mother, Usman identifies as a Muslim' — a generic self-identification naming no school; his father's faith is family background."
