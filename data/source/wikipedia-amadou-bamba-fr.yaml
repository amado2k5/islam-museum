  ar: "مقالة ويكيبيديا الفرنسية عن الشيخ أحمدو بمبا (1853-1927)؛ تُستخدم لوقائع الكيان فقط. تصفه في مطلعها بأنه «مسلم سني، عالم أشعري العقيدة، فقيه مالكي، مؤسس طريقته الصوفية الخاصة»، وتفصّل سيرته ونفيه وكتبه ووفاته بديوربل في 19 يوليو 1927."
  en: "French Wikipedia article on Shaykh Ahmadou Bamba (1853–1927); used for entity facts only. Its lead describes him as 'a Sunni Muslim, an Ash'ari theologian, a Maliki jurist, founder of his own Sufi path', and it details his life, his exiles, his writings and his death at Diourbel on 19 July 1927."
