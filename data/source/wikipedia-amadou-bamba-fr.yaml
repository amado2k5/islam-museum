reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Its lead is the fullest confessional description in any fetched article — 'musulman sunnite, théologien acharite, juriste malékite, fondateur de sa propre voie soufie' — and it is one of the independent attestations of his Sufi affiliation and headship on which the record's sufi segment rests; but it is the ONLY fetched source that names a school of law or theology for him, so no sunni segment is recorded, exactly as the record's faith note states. It gives: full name Ahmad ibn Muhammad ibn Habiballah; born 1853 at Mbacké-Baol; Qur'an study from age seven under his uncle Thierno Mboussobé and Tafsir Mbacké Ndoumbé, then at his father's school, versifying al-Sanusi's Umm al-Barahin as Mawahib al-Quddus while his father lived; his father died at Mbacké Cayor in 1881; after two years teaching his father's disciples he turned to tarbiya (spiritual training) — 'the birth of the Mouridiyya'; founded Touba in 1888 (the English, Arabic and Urdu articles give 1887 — the conflict is recorded in the record) and stayed there seven years; arrested at Djéwol in August 1895, tried at Saint-Louis on 5 September 1895 — the colonial justification quoted, that no act of preaching holy war could be held against him — and embarked for Gabon on 21 September 1895 (Mayumba five years, Lambaréné two); returned to Dakar on 11 November 1902; exiled again to Mauritania under the scholar Sidia Baba until 26 April 1907; house arrest at Thiéyène, then Diourbel from January 1912; in January 1919 the governor awarded him the Legion of Honor diploma and cross — he accepted the diploma but refused to wear the cross on religious principle (the English article says simply that he refused it); in 1921 he first publicly organised the anniversary of his exile's departure, the origin of the Magal commemoration; he died at Diourbel on Tuesday 19 July 1927, was buried the next day at Touba in his house adjoining the Great Mosque, and was succeeded by his eldest son Mouhamadou Moustapha Mbacké. Its bibliography includes Fernand Dumont's thesis 'Essai sur la pensée religieuse d'Amadou Bamba (1850-1927)' — one of the 1850 birth-year variants recorded in the record. His doctrine section quotes his own Mawahib al-Quddus on God's attributes and states 'Ahmadou Bamba était de croyance traditionnelle sunnite' — the article's own framing, single-source for the school, as noted."
