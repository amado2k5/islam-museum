summary:
  ar: "عز الدین قسام اردو ویکیپیڈیا میں: ان کی پیدائش 19 دسمبر 1882ء کریمر اور گیدیر کے حوالے سے، اور ان کا حنفی سنی ہونا سلائیفر کے حوالے سے درج ہے۔"
  en: "Izz ad-Din al-Qassam in the Urdu Wikipedia: it dates his birth to 19 December 1882, citing Kramer and Guidere, and repeats the English article's Schleifer-cited statement that he followed the Hanafi school of Sunni Islam."
  es: "Izz ad-Din al-Qassam en la Wikipedia en urdu: fecha su nacimiento el 19 de diciembre de 1882, citando a Kramer y Guidere, y repite la afirmación del artículo en inglés, citada por Schleifer, de que seguía la escuela Hanafi del Islam sunita."
  fr: "Izz ad-Din al-Qassam dans la Wikipédia en ourdou: elle date sa naissance du 19 décembre 1882, citant Kramer et Guidere, et reprend l’affirmation de Schleifer citée dans l’article anglais selon laquelle il suivait l’école hanafite de l’islam sunnite."
  ur: "اردو ویکیپیڈیا میں عزالدین القسام: اس کی تاریخ پیدائش 19 دسمبر 1882 ہے، کریمر اور گائیڈرے کا حوالہ دیتے ہوئے، اور انگریزی مضمون کے شیلیفر کے حوالہ کردہ بیان کو دہراتے ہیں کہ وہ سنی اسلام کے حنفی مکتب کی پیروی کرتے تھے۔"
  tr: "İzzuddin Kassam Urduca Vikipedi'de: Kramer ve Gadir'e göre 19 Aralık 1882'de doğmuştur ve Hanefi Sünni statüsü Slifer'e göre kaydedilmiştir."
  id: "Izzuddin Qassam di Wikipedia Urdu: Ia lahir pada 19 Desember 1882, menurut Kramer dan Gadir, dan status Sunni Hanafinya tercatat menurut Slifer."
