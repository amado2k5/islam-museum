summary:
  ar: "الترجمة العربية للمجلد الإيلخاني من جامع التواريخ لرشيد الدين فضل الله الهمذاني، نقلها فؤاد عبد المعطي الصياد ومحمد صادق نشأت ومحمد موسى هنداوي، وقدّم لها وراجعها يحيى الخشاب، وفيها مقدمة الخشاب المؤرخة بمايو 1960 {cite:jami-al-tawarikh-khashshab-1960 p. 25}. تُذكر الصفحات هنا برقم الفهرس في ملف الصفحات لا بالرقم المطبوع."
  en: "The Arabic translation of the Ilkhanid volume of Rashid al-Din Fadl Allah al-Hamadani's Jami' al-Tawarikh, translated by Fu'ad Abd al-Mu'ti al-Sayyad, Muhammad Sadiq Nashat and Muhammad Musa Hindawi, with an introduction and review by Yahya al-Khashshab; the introduction is dated May 1960 {cite:jami-al-tawarikh-khashshab-1960 p. 25}. Pages are cited by the scan index of the OCR file, not by the printed folio."
  es: "La traducción árabe del volumen ilcanida de Jami' al-Tawarikh de Rashid al-Din Fadl Allah al-Hamadani, traducida por Fu'ad Abd al-Mu'ti al-Sayyad, Muhammad Sadiq Nashat y Muhammad Musa Hindawi, con introducción y revisión de Yahya al-Jashshab; la introducción lleva fecha de mayo de 1960 {cite:jami-al-tawarikh-khashshab-1960 p. 25}. Las páginas se citan por el índice de escaneo del archivo OCR, no por la foliación impresa."
  fr: "La traduction arabe du volume ilkhanide du Jami' al-Tawarikh de Rashid al-Din Fadl Allah al-Hamadani, traduite par Fu'ad Abd al-Mu'ti al-Sayyad, Muhammad Sadiq Nashat et Muhammad Musa Hindawi, avec une introduction et une révision de Yahya al-Khashshab ; l'introduction est datée de mai 1960 {cite:jami-al-tawarikh-khashshab-1960 p. 25}. Les pages sont citées selon l'index de numérisation du fichier OCR, non selon la pagination imprimée."
  ur: "جامع التواریخ کے ایلخانی جلد کا عربی ترجمہ، جسے فؤاد عبد المعطی الصیاد، محمد صادق نشأت اور محمد موسیٰ ہنداوی نے ترجمہ کیا، اور جس کا مقدمہ اور نظرِ ثانی یحییٰ الخشاب نے کی؛ مقدمہ مئی 1960 کا ہے {cite:jami-al-tawarikh-khashshab-1960 p. 25}۔ صفحات OCR فائل کے اسکین نمبر سے حوالہ دیے گئے ہیں، مطبوعہ صفحہ نمبر سے نہیں۔"
  tr: "Rashid al-Din Fadlallah al-Hamadhani tarafından yazılan Jami' al-Tawarikh'ten İlhani cildinin Arapça çevirisi, Fouad Abdul-Mu'ti al-Sayyad, Muhammad Sadiq Nashaat ve Muhammad Musa Hindawi tarafından transkribe edilmiş, Yahya al-Khashab tarafından tanıtılmış ve incelenmiş olup, el-Khashab'ın Mayıs 1960 tarihli girişini içerir {cite:jami-al-tawarikh-khashshab-1960, s. 25}. Buradaki sayfalar, sayfa dosyasındaki indeks numarasıyla belirtilmiştir, basılı numarayla değil."
  id: "Terjemahan Arab dari volume Ilkhani dari Jami' al-Tawarikh oleh Rashid al-Din Fadlallah al-Hamadhani, ditranskripsi oleh Fouad Abdul-Mu'ti al-Sayyad, Muhammad Sadiq Nashaat, dan Muhammad Musa Hindawi, diperkenalkan dan ditinjau oleh Yahya al-Khashab, dan mencakup pengantar al-Khashab tertanggal Mei 1960 {cite:jami-al-tawarikh-khashshab-1960, hlm. 25}. Halaman-halaman di sini disebutkan berdasarkan nomor indeks dalam file halaman, bukan dengan nomor cetak."
