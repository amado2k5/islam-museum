summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بيجوم حضرة محل؛ تُستخدم لوقائع الكيان فقط. تروي نشأتها باسم محمدي خانم في فيض آباد، ودخولها حرم واجد علي شاه وتلقيبها «حضرة محل» بعد ولادة ابنها برجس قادر، ووصايتها على أوده في 1857–1858 وقيادتها للمقاومة ضد شركة الهند الشرقية، ولجوءها إلى نيبال حيث توفيت في كاتماندو في 7 أبريل 1879."
  en: "English Wikipedia article on Begum Hazrat Mahal; used for entity facts only. It recounts her birth as Muhammadi Khanum at Faizabad, her entry into Wajid Ali Shah's harem and the title 'Hazrat Mahal' after the birth of her son Birjis Qadr, her regency of Awadh in 1857–1858 and leadership of the resistance to the East India Company, and her flight to Nepal, where she died at Kathmandu on 7 April 1879."
