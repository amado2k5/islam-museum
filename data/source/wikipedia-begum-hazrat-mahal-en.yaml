summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بيجوم حضرة محل؛ تُستخدم لوقائع الكيان فقط. تروي نشأتها باسم محمدي خانم في فيض آباد، ودخولها حرم واجد علي شاه وتلقيبها «حضرة محل» بعد ولادة ابنها برجس قادر، ووصايتها على أوده في 1857–1858 وقيادتها للمقاومة ضد شركة الهند الشرقية، ولجوءها إلى نيبال حيث توفيت في كاتماندو في 7 أبريل 1879."
  en: "English Wikipedia article on Begum Hazrat Mahal; used for entity facts only. It recounts her birth as Muhammadi Khanum at Faizabad, her entry into Wajid Ali Shah's harem and the title 'Hazrat Mahal' after the birth of her son Birjis Qadr, her regency of Awadh in 1857–1858 and leadership of the resistance to the East India Company, and her flight to Nepal, where she died at Kathmandu on 7 April 1879."
  es: "Artículo de la Wikipedia en inglés sobre Begum Hazrat Mahal; utilizado únicamente para datos sobre la persona. Relata su nacimiento como Muhammadi Khanum en Faizabad, su ingreso en el harén de Wajid Ali Shah y el título de 'Hazrat Mahal' tras el nacimiento de su hijo Birjis Qadr, su regencia de Awadh entre 1857 y 1858 y su liderazgo en la resistencia contra la Compañía Británica de las Indias Orientales, y su huida a Nepal, donde falleció en Katmandú el 7 de abril de 1879."
  fr: "Article de Wikipédia en anglais sur Begum Hazrat Mahal; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance sous le nom de Muhammadi Khanum à Faizabad, son entrée dans le harem de Wajid Ali Shah et le titre de « Hazrat Mahal » après la naissance de son fils Birjis Qadr, sa régence d'Awadh en 1857-1858 et son rôle de chef de la résistance contre la Compagnie des Indes orientales, et sa fuite au Népal, où elle mourut à Katmandou le 7 avril 1879."
  ur: "بیگم حضرت محل پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں فیض آباد میں محمدی خانم کے نام سے اس کی پیدائش، واجد علی شاہ کے حرم میں اس کا داخلہ اور اس کے بیٹے برجیس قدر کی پیدائش کے بعد 'حضرت محل' کا لقب، 1857-1858 میں اس کی ریاست اودھ اور ایسٹ انڈیا کمپنی کے خلاف مزاحمت کی قیادت کے بعد، اور نیپال کے لیے ان کی پرواز کا ذکر ہے، جہاں 79 اپریل کو ان کا انتقال ہوا۔"
