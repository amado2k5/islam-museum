summary:
  ar: "مقالة ويكيبيديا الأردية عن رعنا لياقت علي خان؛ تعطي مولدها في 13 شباط 1905 في أسرة مسیحیة كوماونية ووفاتها في 13 حزيران 1990، وتذكر أن إمام الجامع الكبير عقد نكاحها سنة 1932 وأنها قبلت الإسلام وسُمّيت غل رعنا، وتروي تأسيسها لجمعية المرأة الباكستانية ⁦(اپوا)⁩."
  en: "The Urdu Wikipedia article on Ra'ana Liaquat Ali Khan; it gives her birth on 13 February 1905 into a Kumaoni Christian family and her death on 13 June 1990, recounts that at her 1932 marriage the imam of the Jama Masjid performed the nikah and she accepted Islam and was named Gul-i-Rana, and records her founding of the All Pakistan Women's Association (APWA)."
  es: "El artículo de Wikipedia en urdu sobre Ra'ana Liaquat Ali Khan, que indica su nacimiento el 13 de febrero de 1905 en una familia cristiana de Kumaon y su muerte el 13 de junio de 1990, relata que en su matrimonio de 1932 el imán de la Jama Masjid ofició la ceremonia del nikah, ella aceptó el Islam y fue nombrada Gul-i-Rana, y registra la fundación de la Asociación de Mujeres de Pakistán (APWA)."
  fr: "L'article de Wikipédia en ourdou sur Ra'ana Liaquat Ali Khan; il indique sa naissance le 13 février 1905 dans une famille chrétienne kumaoni et sa mort le 13 juin 1990, raconte qu'à son mariage en 1932, l'imam de la Jama Masjid a célébré le nikah et qu'elle a accepté l'islam et a été nommée Gul-i-Rana, et relate sa fondation de l'Association des femmes de tout le Pakistan (APWA)."
  ur: "رانا لیاقت علی خان پر اردو ویکیپیڈیا کا مضمون؛ اس نے 13 فروری 1905 کو کمونی عیسائی گھرانے میں اس کی پیدائش کی اور 13 جون 1990 کو اس کی موت واقع ہوئی، بتاتا ہے کہ اس کی 1932 کی شادی میں جامع مسجد کے امام نے نکاح کیا اور اس نے اسلام قبول کیا اور اس کا نام گلِ رعنا رکھا گیا، اور آل پاکستان ویمنز ایسوسی ایشن (APWA) کی بانی کا ریکارڈ درج ہے۔"
