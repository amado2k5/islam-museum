summary:
  ar: "مقالة ويكيبيديا الأردية عن رعنا لياقت علي خان؛ تعطي مولدها في 13 شباط 1905 في أسرة مسیحیة كوماونية ووفاتها في 13 حزيران 1990، وتذكر أن إمام الجامع الكبير عقد نكاحها سنة 1932 وأنها قبلت الإسلام وسُمّيت غل رعنا، وتروي تأسيسها لجمعية المرأة الباكستانية (اپوا)."
  en: "The Urdu Wikipedia article on Ra'ana Liaquat Ali Khan; it gives her birth on 13 February 1905 into a Kumaoni Christian family and her death on 13 June 1990, recounts that at her 1932 marriage the imam of the Jama Masjid performed the nikah and she accepted Islam and was named Gul-i-Rana, and records her founding of the All Pakistan Women's Association (APWA)."
