summary:
  ar: "مقالة مستقلة ⁦(8 فبراير 2024)⁩ عن فريق مؤسسة زهرة ترست لماراثون ميامي، تصف سليم قاسام بأنه «سبق أن شارك في تأسيس منظمة ذا مسلم فايب الإعلامية الرقمية»، وأنه صاحب فكرة فريق الجري الخيري وعدّاء بنفسه."
  en: "Independent article (8 February 2024) on the Zahra Trust's Miami Marathon team, describing Salim Kassam as the man who 'previously co-founded The Muslim Vibe digital media organization', who conceived the charity running team and is a runner himself."
  es: "Artículo independiente (8 de febrero de 2024) sobre el equipo de la Fundación Zahra para la Maratón de Miami, que describe a Salim Kassam como el hombre que \"anteriormente cofundó la organización de medios digitales The Muslim Vibe\", quien concibió el equipo benéfico de corredores y que también es corredor."
  fr: "Article indépendant (8 février 2024) sur l'équipe du marathon de Miami du Zahra Trust, décrivant Salim Kassam comme l'homme qui « a auparavant cofondé l'organisation de médias numériques The Muslim Vibe », qui a conçu l'équipe de course caritative et qui est lui-même un coureur."
  ur: "زہرہ ٹرسٹ کی میامی میراتھن ٹیم پر آزاد مضمون ⁦(8 فروری 2024)⁩، جس میں سلیم قاسم کو اس شخص کے طور پر بیان کیا گیا ہے جس نے 'پہلے دی مسلم وائب ڈیجیٹل میڈیا آرگنائزیشن کی مشترکہ بنیاد رکھی'، جس نے چیریٹی چلانے والی ٹیم کا تصور کیا اور وہ خود ایک رنر ہے۔"
