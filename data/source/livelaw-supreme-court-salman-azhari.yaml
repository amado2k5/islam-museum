reliability_note: "Specialist Indian legal-news report, read in full on 5 November 2026. It reports that a Supreme Court bench of Justices Vikram Nath and Prasanna B. Varale set aside the Gujarat High Court's order validating Azhari's detention under the Gujarat Prevention of Anti-Social Activities Act 1985 (PASA), holding: 'the order of detention cannot be sustained as apparently there is nothing to suggest that the speeches delivered by the appellant are in any manner disturbing the public order'; that the detention order had been executed on 22 February 2024 and Azhari held in Vadodara Central Jail; and that the appeal (Civil Appeal No. 11682 of 2024) was allowed and his release directed. The underlying speech cases are distinct from this preventive-detention order and are not described as decided by this report."
