summary:
  ar: "مقالة ويكيبيديا العربية عن محبوب الحق؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة من أسرة النص الألماني تعطي مولده في 22 فبراير 1934 في جامو بكشمير ووفاته في 16 يوليو 1998 في نيويورك، وتصفه بأنه اقتصادي باكستاني شهير ساهم في إنشاء مؤشر التنمية البشرية."
  en: "Arabic Wikipedia article on Mahbub ul Haq; used for entity facts only. A short article of the German-article text family giving his birth as 22 February 1934 at Jammu, Kashmir, and his death as 16 July 1998 at New York, and describing him as a famous Pakistani economist who helped create the Human Development Index."
  es: "Artículo en árabe de la Wikipedia sobre Mahbub ul Haq; utilizado únicamente para datos sobre la persona. Un breve artículo de la familia de artículos en alemán indica que nació el 22 de febrero de 1934 en Jammu, Cachemira, y falleció el 16 de julio de 1998 en Nueva York, y lo describe como un famoso economista pakistaní que ayudó a crear el Índice de Desarrollo Humano."
  fr: "Article de Wikipédia en arabe sur Mahbub ul Haq; utilisé uniquement à des fins d'information sur l'entité. Ce court article, de type allemand, indique sa naissance le 22 février 1934 à Jammu (Cachemire) et son décès le 16 juillet 1998 à New York, et le décrit comme un économiste pakistanais renommé ayant contribué à la création de l'Indice de développement humain."
  ur: "محبوب الحق پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ جرمن آرٹیکل ٹیکسٹ فیملی کا ایک مختصر مضمون جس میں ان کی پیدائش 22 فروری 1934 کو جموں، کشمیر میں، اور ان کی موت 16 جولائی 1998 کو نیویارک میں ہوئی، اور انہیں ایک مشہور پاکستانی ماہر معاشیات کے طور پر بیان کیا گیا جس نے انسانی ترقی کا اشاریہ بنانے میں مدد کی۔"
  tr: "Mahbub al-Haq hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Alman metin ailesinden kısa bir makale, 22 Şubat 1934'te Jammu, Keşmir'de doğduğunu ve 16 Temmuz 1998'de New York'ta öldüğünü anlatır; onu İnsan Gelişimi Endeksi'nin oluşturulmasına katkıda bulunan ünlü bir Pakistanlı ekonomist olarak tanımlar."
  id: "Artikel Wikipedia berbahasa Arab tentang Mahbub al-Haq; hanya digunakan untuk fakta entitas. Sebuah artikel singkat dari keluarga teks Jerman menceritakan kelahirannya pada 22 Februari 1934 di Jammu, Kashmir, dan kematiannya pada 16 Juli 1998 di New York, menggambarkannya sebagai ekonom Pakistan terkenal yang berkontribusi dalam pembentukan Indeks Pembangunan Manusia."
