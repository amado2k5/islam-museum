reliability_note: "Platform statistics aggregator, not a museum-verified fact: vidIQ compiles public YouTube data and stated, as of 7 November 2026, 398,000 subscribers, 41,882,793 total views and 4,224 videos; the channel started on 2 January 2017 and its channel country is set to the United States — a channel setting that does not describe the outlet, an Ethiopian Amharic dawah outlet whose content and audience are Ethiopian. Its most-viewed uploads, as listed on 7 November 2026, include Ustaz Yasin Nuru's Friday khutbah (January 2024, 279.57K views in the listing), a lecture by Ustaz Nuru Turki (August 2023, 242.45K views) and funeral coverage of the Badr Mosque imam Sheikh Abdu Yasin (January 2024, 155.16K views). vidIQ's estimated earnings are modelled and are not used. These figures match the coordinator's fresh vidIQ read of the same day exactly. The page gives no founding date for the outlet itself beyond the channel creation date, and names no owner or manager. Read on 7 November 2026."
