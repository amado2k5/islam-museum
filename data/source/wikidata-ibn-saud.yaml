  ur: "وکی ڈیٹا آئٹم Q151509 برائے عبد العزیز بن عبدالرحمٰن آل سعود، جسے ابن سعود کے نام سے جانا جاتا ہے: پیدائش 15 جنوری 1876 کو ریاض میں اور وفات 9 نومبر 1953 کو طائف میں، مذہب اسلام عام طور پر، ان کے والد عبدالرحمٰن بن فیصل اور ان کے بہت سے بچوں سمیت سعودی عرب کے بعد کے بادشاہوں، انگریزی عربی اور عربی مضمون کے لنکس کے ساتھ۔"
