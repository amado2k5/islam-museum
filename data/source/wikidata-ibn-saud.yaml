  ar: "عنصر ويكيبيانات Q151509 لعبد العزيز بن عبد الرحمن آل سعود المعروف بابن سعود: ولادة في 15 يناير 1876 في الرياض ووفاة في 9 نوفمبر 1953 في الطائف، وديانته الإسلام عامة، وأبوه عبد الرحمن بن فيصل وأبناؤه كثيرون ومنهم ملوك السعودية اللاحقون، مع روابط مقالات ويكيبيديا بالإنجليزية والعربية والأردية والفرنسية."
  en: "Wikidata item Q151509 for Abdulaziz bin Abdul Rahman Al Saud, known as Ibn Saud: birth on 15 January 1876 at Riyadh and death on 9 November 1953 at Taif, religion Islam generically, his father Abdul Rahman bin Faisal and his many children including the later kings of Saudi Arabia, with links to the English, Arabic, Urdu and French Wikipedia articles."
  es: "Entrada de Wikidata Q151509 para Abdulaziz bin Abdul Rahman Al Saud, conocido como Ibn Saud: nacimiento el 15 de enero de 1876 en Riad y muerte el 9 de noviembre de 1953 en Taif, religión Islam en general, su padre Abdul Rahman bin Faisal y sus numerosos hijos, incluidos los reyes posteriores de Arabia Saudita, con enlaces a los artículos de Wikipedia en inglés, árabe, urdu y francés."
