summary:
  ar: "مقالة ويكيبيديا العربية القصيرة عن توقتوغول ساتيلعان أوغلو؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 25 أكتوبر 1864 ووفاته في 17 فبراير 1933 مستندة إلى دليل برادت والموسوعة السوفيتية الكبرى."
  en: "Short Arabic Wikipedia article on Toktogul Satylganov; used for entity facts only. It gives his birth on 25 October 1864 and his death on 17 February 1933, citing the Bradt guide and the Great Soviet Encyclopedia."
  es: "Breve artículo en árabe de Wikipedia sobre Toktogul Satylganov; se utiliza únicamente para datos biográficos. Indica que nació el 25 de octubre de 1864 y falleció el 17 de febrero de 1933, citando la guía Bradt y la Gran Enciclopedia Soviética."
  fr: "Court article de Wikipédia en arabe sur Toktogul Satylganov; utilisé uniquement à des fins d’information sur l’entité. Il indique sa naissance le 25 octobre 1864 et sa mort le 17 février 1933, en citant le guide Bradt et la Grande Encyclopédie soviétique."
  ur: "Toktogul Satylganov پر مختصر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 25 اکتوبر 1864 کو اس کی پیدائش اور 17 فروری 1933 کو اس کی موت بتاتا ہے، بریڈٹ گائیڈ اور عظیم سوویت انسائیکلوپیڈیا کا حوالہ دیتے ہوئے"
  tr: "Toktogol Satilanoğlu hakkında kısa Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bradt El Kitabı ve Büyük Sovyet Ansiklopedisi'ne dayanarak, 25 Ekim 1864 doğumlu ve 17 Şubat 1933'te ölmüş olarak anılmaktadır."
  id: "Artikel singkat Wikipedia bahasa Arab tentang Toktogol Satilanoglu; digunakan hanya untuk fakta entitas. Ia disebutkan lahir pada 25 Oktober 1864, dan meninggal pada 17 Februari 1933, berdasarkan Bradt Manual dan Ensiklopedia Soviet Besar."
