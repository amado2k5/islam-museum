summary:
  ar: "مقالة آنا سوانك في مجلة المجتمع الإعلامي العربي ⁦(مايو 2007)⁩ عن برنامج «كلام كبير» وانتشاره، وهي مصدر كتاب «للكبار فقط» وترخيصها سنة 2003 ووصفها بالمسلمة المتدينة."
  en: "Anna Swank's Arab Media Society article (May 2007) on the Kalam Kibeer programme and its reach; a source for the book Lil Kubaar Faqat, her 2003 licence and the description of her as a devout Muslim."
  es: "Artículo de Anna Swank en la Sociedad de Medios Árabes (mayo de 2007) sobre el programa Kalam Kibeer y su alcance; fuente del libro Lil Kubaar Faqat, su licencia de 2003 y la descripción de ella como una musulmana devota."
  fr: "L'article d'Anna Swank pour l'Arab Media Society (mai 2007) sur le programme Kalam Kibeer et sa portée; une source pour le livre Lil Kubaar Faqat, sa licence de 2003 et la description d'elle comme une musulmane dévouée."
  ur: "انا سوانک کا عرب میڈیا سوسائٹی کا مضمون ⁦(مئی 2007)⁩ کلام کبیر پروگرام اور اس کی رسائی پر؛ کتاب لِل کبار فقات، اس کا 2003 کا لائسنس اور ایک متقی مسلمان کے طور پر اس کی تفصیل کا ایک ذریعہ۔"
  tr: "Anna Swank'ın Arap Medya Derneği dergisinde (Mayıs 2007) yayımlanan \"Kalam Kabir\" programı ve yayılımı hakkında, 2003'te lisanslanan ve dini bir Müslüman olarak tanımlanan \"Sadece Yetişkinler İçin\" adlı kitabın kaynağı olan makalesi."
  id: "Artikel Anna Swank di majalah Arab Media Society (Mei 2007) tentang program \"Kalam Kabir\" dan penyebarannya, yang menjadi sumber buku \"For Adults Only,\" yang dilisensikan pada 2003, dan digambarkan sebagai Muslim yang religius."
title: "Sexual Healing: How big is Kalaam Kibeer?"
