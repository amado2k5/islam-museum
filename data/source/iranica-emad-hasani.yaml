label:
  en: "Encyclopaedia Iranica — ʿEmād Ḥasanī, Mīr, ʿEmād-al-Molk"
summary:
  ar: "مدخل «عماد حسني، مير، عماد الملك» بقلم كامبيز إسلامي في الموسوعة الإيرانية؛ يعطي ولادته نحو 961هـ/1554م في قزوين من أسرة سادات سيفي حسني ووفاته اغتيالًا في 30 رجب 1024هـ/15 أغسطس 1615م، ويصف ميله السنّي المزعوم بأنه ما جعله الشاه عباس قضية ورضي ضمنيًا بقتله."
  en: "Kambiz Eslami's Encyclopaedia Iranica entry 'ʿEmād Ḥasanī, Mīr, ʿEmād-al-Molk'; it gives his birth about 961/ca. 1554 at Qazvin to a family of Sayfi Hasani sayyeds and his assassination on 30 Rajab 1024/15 August 1615, and describes his alleged Sunni inclination as what Shah Abbas made an issue of when he implicitly approved the murder."
  es: "Entrada de la Enciclopedia Iranica de Kambiz Eslami 'ʿEmād Ḥasanī, Mīr, ʿEmād-al-Molk'; Da su nacimiento alrededor del 961/ca. 1554 en Qazvin a una familia de Sayfi Hasani sayyeds y su asesinato el 30 de Rajab de 1024/15 de agosto de 1615, y describe su supuesta inclinación sunita como lo que Shah Abbas planteó cuando aprobó implícitamente el asesinato."
  fr: "Entrée de l'Encyclopaedia Iranica de Kambiz Eslami « ʿEmād Ḥasanī, Mīr, ʿEmād-al-Molk »; il donne naissance à environ 961/ca. 1554 à Qazvin à une famille de Sayfi Hasani sayyeds et son assassinat le 30 Rajab 1024/15 août 1615, et décrit son prétendu penchant sunnite comme ce dont Shah Abbas a fait un problème lorsqu'il a implicitement approuvé le meurtre."
  ur: "کمبیز اسلامی کی انسائیکلوپیڈیا ایرانیکا اندراج 'عماد حسنی، میر، عماد الملک'؛ اس کی پیدائش تقریباً 961/ca ہے۔ 1554 قزوین میں سیفی حسنی سید کے ایک خاندان کے پاس اور 30 رجب 1024/15 اگست 1615 کو ان کا قتل، اور اس کے مبینہ سنی جھکاؤ کو بیان کرتا ہے کہ شاہ عباس نے اس قتل کو واضح طور پر منظور کرتے وقت مسئلہ بنایا۔"
  tr: "Campez Eslami'nin İran Ansiklopedisi'ndeki \"Imad Hosni, Mir, Imad al-Mulk\" adlı maddesi, onun yaklaşık 961 Hicri/1554 yılında Kazvin'de Sedat Seifi Hosseini'nin ailesine doğduğunu ve 30 Recep 1024 / 15 Ağustos 1615'te bir suikast sonucu öldüğünü belirtir. Makalede, iddia edilen Sünni eğilimi onu bir dava yapan şey olarak tanımlanır ve onu öldürmeyi dolaylı olarak kabul etmiştir."
  id: "Entri \"Imad Hosni, Mir, Imad al-Mulk\" oleh Campez Eslami dalam Ensiklopedia Iran menceritakan kelahirannya sekitar tahun 961 H/1554 M di Qazvin dari keluarga Sadat Seifi Hosseini, dan kematiannya sebagai pembunuhan pada 30 Rajab 1024 H / 15 Agustus 1615 M. Entri ini menggambarkan kecenderungan Sunni yang diduga disebutkan sebagai penyebab dan secara implisit setuju untuk membunuhnya."
title: "ʿEMĀD ḤASANĪ, MĪR, ʿEMĀD-AL-MOLK"
