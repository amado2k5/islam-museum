reliability_note: "Peer-reviewed scholarly encyclopedia entry (Encyclopaedia Iranica), read in full at the live URL on 1 November 2026 (article published 15 December 1998; page last updated 3 August 2015). It rests on the contemporary sources (Mustafa Ali, Qazi Ahmad, Eskandar Beg, Nasrabadi) and the standard modern literature (Bayani, Falsafi, Robinson). It is the anchor source for this record: the birth and death dates with their Hijri pairings, the court career and the assassination are taken from it, as is its careful wording on his religion — an 'alleged Sunni inclination' that the shah exploited — and its warning that the calligraphy teachers named by modern authors are not substantiated by contemporary sources."
