summary:
  ar: "مدخل «عماد حسني، مير، عماد الملك» بقلم كامبيز إسلامي في الموسوعة الإيرانية؛ يعطي ولادته نحو 961هـ/1554م في قزوين من أسرة سادات سيفي حسني ووفاته اغتيالًا في 30 رجب 1024هـ/15 أغسطس 1615م، ويصف ميله السنّي المزعوم بأنه ما جعله الشاه عباس قضية ورضي ضمنيًا بقتله."
  en: "Kambiz Eslami's Encyclopaedia Iranica entry 'ʿEmād Ḥasanī, Mīr, ʿEmād-al-Molk'; it gives his birth about 961/ca. 1554 at Qazvin to a family of Sayfi Hasani sayyeds and his assassination on 30 Rajab 1024/15 August 1615, and describes his alleged Sunni inclination as what Shah Abbas made an issue of when he implicitly approved the murder."
