  id: "Artikel Wikipedia Prancis tentang Colo Touré; digunakan hanya untuk fakta entitas tersebut. Artikel ini mencakup kelahirannya pada tahun 1981 dan kariernya bersama Arsenal, Manchester City, Liverpool, Celtic, dan tim nasional Pantai Gading, serta tidak menyebutkan agamanya di mana pun."
