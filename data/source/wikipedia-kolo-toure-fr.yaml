  ar: "مقالة ويكيبيديا الفرنسية عن كولو توريه؛ تُستخدم لوقائع الكيان فقط. تغطي ميلاده سنة 1981 ومسيرته مع أرسنال ومانشستر سيتي وليفربول وسيلتيك ومنتخب ساحل العاج، ولا تذكر ديانته في أي موضع."
  en: "French Wikipedia article on Kolo Touré; used for entity facts only. It covers his 1981 birth and his Arsenal, Manchester City, Liverpool, Celtic and Ivory Coast career, and makes no statement of his religion anywhere."
  es: "Artículo de la Wikipedia en francés sobre Kolo Touré; se utiliza únicamente para obtener información sobre la persona. Abarca su nacimiento en 1981 y su trayectoria en el Arsenal, el Manchester City, el Liverpool, el Celtic y la selección de Costa de Marfil, y no menciona su religión en ningún momento."
  fr: "Article Wikipédia français sur Kolo Touré; utilisé uniquement pour des informations sur l’individu. Il retrace sa naissance en 1981 et sa carrière à Arsenal, Manchester City, Liverpool, le Celtic et la Côte d’Ivoire, sans mentionner sa religion."
  ur: "Kolo Touré پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی 1981 کی پیدائش اور اس کے ہتھیاروں، مانچسٹر سٹی، لیورپول، سیلٹک اور آئیوری کوسٹ کے کیریئر کا احاطہ کیا گیا ہے، اور کہیں بھی اس کے مذہب کا کوئی بیان نہیں دیا گیا ہے۔"
