summary:
  ar: "عنصر ويكيداتا Q146906 للحسين بن طلال: ولادته في 14 نوفمبر 1935 ووفاته في 7 فبراير 1999، ومكانا الولادة والوفاة في عمّان (Q3805)، ووالده طلال بن عبد الله (Q294365). قيمة الدين (P140) هي الإسلام السنّي (Q483654) — قيمة بنيوية واحدة في أسرة الصندوق الإنجليزي نفسها."
  en: "Wikidata item Q146906 for Hussein bin Talal: born 14 November 1935, died 7 February 1999, place of birth and of death both Amman (Q3805), father Talal bin Abdullah (Q294365). The religion (P140) value is Sunni Islam (Q483654) — one structured value in the same family as the English infobox."
  es: "Entrada de Wikidata Q146906 para Hussein bin Talal: nacido el 14 de noviembre de 1935, fallecido el 7 de febrero de 1999, lugar de nacimiento y de fallecimiento ambos Amán (Q3805), padre Talal bin Abdullah (Q294365). El valor de religión (P140) es Islam sunita (Q483654), un valor estructurado de la misma familia que la ficha informativa en inglés."
  fr: "L'élément Wikidata Q146906 concerne Hussein bin Talal: né le 14 novembre 1935, décédé le 7 février 1999, à Amman (Q3805), son père s'appelait Talal bin Abdullah (Q294365). La religion (P140) est l'islam sunnite (Q483654) — une valeur structurée appartenant à la même famille que l'infobox en anglais."
  ur: "وکی ڈیٹا آئٹم Q146906 برائے حسین بن طلال: پیدائش 14 نومبر 1935، وفات 7 فروری 1999، جائے پیدائش اور موت دونوں عمان (Q3805)، والد طلال بن عبداللہ (Q294365)۔ مذہب (P140) کی قدر سنی اسلام ہے (Q483654) — ایک ہی خاندان میں ایک ساختی قدر جس میں انگریزی معلومات خانہ ہے۔"
  tr: "Hüseyin bin Talal'in Wikidata Q146906 öğesi: 14 Kasım 1935'te doğdu ve 7 Şubat 1999'da vefat etti, doğum ve ölüm yerleri Umman'da (Q3805) ve babası Talal bin Abdullah (Q294365). Dinin değeri (P140) Sünni İslam'dır (Q483654) — İngiliz Fonu ailesinin içinde tek bir yapısal değerdir."
  id: "Elemen Wikidata Q146906 Hussein bin Talal: lahir pada 14 November 1935, dan meninggal pada 7 Februari 1999, dengan kelahiran dan tempat kematiannya di Oman (Q3805), serta ayahnya Talal bin Abdullah (Q294365). Nilai agama (P140) adalah Islam Sunni (Q483654) — satu nilai struktural tunggal dalam keluarga English Fund itu sendiri."
