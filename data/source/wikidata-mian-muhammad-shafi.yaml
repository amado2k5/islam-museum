summary:
  ar: "عنصر ويكيداتا Q6932710 لميان محمد شافي؛ يعطي مولده سنة 1869 ووفاته سنة 1932 بالسنة فقط، ومولده في لاهور، ويعطي ابنته جهان آرا شاه نواز (Q4880620)، ويحمل للديانة (P140) قيمة الإسلام (Q432) فقط دون أي مذهب."
  en: "Wikidata item Q6932710 for Mian Muhammad Shafi; it gives his birth and death at year precision only (1869, 1932), his birthplace as Lahore, names his child as Jahanara Shahnawaz (Q4880620), and carries a single religion value (P140): Islam (Q432), with no branch."
  es: "Elemento de Wikidata Q6932710 para Mian Muhammad Shafi; proporciona su nacimiento y muerte con precisión de año solamente (1869, 1932), su lugar de nacimiento como Lahore, nombra a su hijo como Jahanara Shahnawaz (Q4880620) y lleva un único valor religioso (P140): Islam (Q432), sin rama."
  fr: "L'élément Wikidata Q6932710 pour Mian Muhammad Shafi; il donne sa naissance et sa mort avec une précision d'année seulement (1869, 1932), son lieu de naissance comme Lahore, nomme son enfant Jahanara Shahnawaz (Q4880620) et porte une seule valeur de religion (P140): Islam (Q432), sans branche."
  ur: "میاں محمد شفیع کے لیے ویکی ڈیٹا آئٹم Q6932710؛ اس میں اس کی پیدائش اور موت صرف سال کی درستگی ⁦(1869، 1932)⁩ بتائی گئی ہے، اس کی جائے پیدائش لاہور ہے، اس کے بچے کا نام جہانارا شاہنواز (Q4880620) رکھا گیا ہے، اور ایک ہی مذہب کی قیمت (P140): اسلام (Q432) ہے جس کی کوئی شاخ نہیں ہے۔"
  tr: "Wikidata Element Q6932710 Mian Muhammad Shafi tarafından; 1869'da doğup 1932'de vefat etti; sadece bir yaşında, Lahor'da doğdu, kızı Jahan Ara Shah Nawaz'a (Q4880620) sahip oldu ve İslam'ın değerini (Q432) yalnızca din için taşıdı (P140), hiçbir mezhep olmadan."
  id: "Elemen Wikidata Q6932710 oleh Mian Muhammad Shafi; ia melahirkan pada tahun 1869 dan meninggal pada tahun 1932 karena hanya satu tahun, lahir di Lahore, memberikan putrinya Jahan Ara Shah Nawaz (Q4880620), dan memegang nilai Islam (Q432) hanya untuk agama (P140) tanpa sekte apapun."
