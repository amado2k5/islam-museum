  en: "al-Shafi'i, al-Umm, vol. 8 (ed. Rif'at Fawzi Abd al-Muttalib, Dar al-Wafa', 2001)"
  ur: "امام شافعی، الام، جلد ہشتم ⁦(تحقیق رفعت فوزی عبد المطلب، دار الوفاء 2001ء)⁩"
summary:
  ar: "الجزء الثامن من كتاب الأم للإمام الشافعي ⁦(150-204هـ)⁩، بتحقيق وتخريج الدكتور رفعت فوزي عبد المطلب، دار الوفاء للطباعة والنشر والتوزيع، المنصورة، الطبعة الأولى 1422هـ/2001م. يضم كتاب الدعوى والبينات، وكتاب الشهادات، وكتاب الأيمان والنذور، وكتاب اختلاف العراقيين، واختلاف علي وعبد الله بن مسعود، وكتاب اختلاف مالك والشافعي، مع فروق النسخ الخطية وتخريج الآثار في الحواشي."
  en: "Volume 8 of al-Shafi'i's (150-204 AH) Kitab al-Umm, edited with source references by Dr Rif'at Fawzi Abd al-Muttalib, Dar al-Wafa', Mansura, first edition 1422 AH / 2001. It contains the books of Claims and Evidence, Testimony, Oaths and Vows, the Disagreement of the Iraqis, the Disagreement of Ali and Abd Allah ibn Mas'ud, and the Disagreement of Malik and al-Shafi'i, with manuscript variants and references for the reports in the notes."
  es: "Volumen 8 del Kitab al-Umm de al-Shafi'i (150-204 AH), editado con referencias a las fuentes por el Dr. Rif'at Fawzi Abd al-Muttalib, Dar al-Wafa', Mansura, primera edición 1422 AH / 2001. Contiene los libros de Afirmaciones y pruebas, Testimonio, Juramentos y votos, el Desacuerdo de los iraquíes, el Desacuerdo de Ali y Abd Allah ibn Mas'ud, y el Desacuerdo de Malik y al-Shafi'i, con variantes manuscritas y referencias para los informes en las notas."
  fr: "Volume 8 du Kitab al-Umm d'al-Shafi'i (150-204 AH), édité avec des références de sources par le Dr Rif'at Fawzi Abd al-Muttalib, Dar al-Wafa', Mansura, première édition 1422 AH / 2001. Il contient les livres des Revendications et Preuves, des Témoignages, des Serments et Vœux, du Désaccord des Irakiens, du Désaccord d'Ali et d'Abd Allah ibn Mas'ud, et du Désaccord de Malik et d'al-Shafi'i, avec des variantes manuscrites et des références pour les rapports dans les notes."
  ur: "الشافعی ⁦(150-204ھ)⁩ کی کتاب الام کی جلد 8، ڈاکٹر رفعت فوزی عبد المطلب، دار الوفاء، منصورہ، پہلا ایڈیشن 1422 ہجری / 2001 کے ذریعہ ماخذ کے حوالہ جات کے ساتھ مدون۔ اس میں کتابیں، دعوے، دعوے، دعوے اور دعوے کی کتابیں شامل ہیں۔ عراقیوں کا، علی اور عبد اللہ ابن مسعود کا اختلاف، اور مالک اور الشافعی کا اختلاف، مخطوطہ کی مختلف قسموں اور نوٹس میں رپورٹس کے حوالہ جات کے ساتھ۔"
  tr: "İmam Al-Shafi'i (150-204 H) tarafından yazılmış Al-um kitabının sekizinci bölümü, Dr. Rifaat Fawzi Abdul Muttalib, Dar Al-Wafaa for Pressing, Publishing and Distribution (Mansoura, Birinci Baskı 1422 Hicri / 2001 M.S.) tarafından düzenlenmiş ve onaylanmıştır. Kitapta İddialar ve Deliller Kitabı, Tanıklıklar Kitabı, Yeminler ve Yemin Kitabı, Iraklılar Arasındaki Farklılıklar, Ali ile Abdullah ibn Mas'ud Arasındaki Farklılıklar, Malik ile Al-Shafi'i Arasındaki Farklılıklar Kitabı, el yazısı kopyalar ve eserlerin kenar boşluklarındaki doğruluğu farklılıkları içerir."
  id: "Bagian kedelapan dari buku Al-um karya Imam Al-Shafi'i (150-204 H), disunting dan diautentikasi oleh Dr. Rifaat Fawzi Abdul Muttalib, Dar Al-Wafaa untuk Percetakan, Penerbitan dan Distribusi, Mansoura, Edisi Pertama 1422 H / 2001 M. Buku ini mencakup Kitab Klaim dan Bukti, Kitab Kesaksian, Kitab Sumpah dan Izar, Kitab Perbedaan di antara orang Irak, Perbedaan antara Ali dan Abdullah ibn Mas'ud, Kitab Perbedaan antara Malik dan Al-Shafi'i, dengan perbedaan dalam salinan tulisan tangan dan autentikasi karya di pinggir."
