summary:
  ar: "الجزء الثامن من كتاب الأم للإمام الشافعي ⁦(150-204هـ)⁩، بتحقيق وتخريج الدكتور رفعت فوزي عبد المطلب، دار الوفاء للطباعة والنشر والتوزيع، المنصورة، الطبعة الأولى 1422هـ/2001م. يضم كتاب الدعوى والبينات، وكتاب الشهادات، وكتاب الأيمان والنذور، وكتاب اختلاف العراقيين، واختلاف علي وعبد الله بن مسعود، وكتاب اختلاف مالك والشافعي، مع فروق النسخ الخطية وتخريج الآثار في الحواشي."
  en: "Volume 8 of al-Shafi'i's (150-204 AH) Kitab al-Umm, edited with source references by Dr Rif'at Fawzi Abd al-Muttalib, Dar al-Wafa', Mansura, first edition 1422 AH / 2001. It contains the books of Claims and Evidence, Testimony, Oaths and Vows, the Disagreement of the Iraqis, the Disagreement of Ali and Abd Allah ibn Mas'ud, and the Disagreement of Malik and al-Shafi'i, with manuscript variants and references for the reports in the notes."
