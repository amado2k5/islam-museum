reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A short article sourced to the Soviet Historical Encyclopedia (Moscow, 1961). It relates that, carrying out his father's design of an alliance with the Ottoman Empire, he performed the pilgrimage to Mecca and returned in 1676, whence his name Haji; it counts him the eighth sultan of Banten where the English article counts the seventh, gives his reign 1682-1687 and his death in 1687, and records the 1684 treaty that ended Banten's independence. It names no school or order for him. Checked 1 November 2026."
