reliability_note: "Platform statistics aggregator, not a museum-verified fact: vidIQ compiles public YouTube data and stated, as of 15 November 2026, 6,060,000 subscribers, 1,208,626,590 total views and 20,235 videos; the channel started on 27 May 2015 and its channel country is set to Indonesia. Its most-viewed uploads, as listed on 15 November 2026, are all lectures by Buya Yahya (Yahya Zainul Ma'arif) — the most-viewed, a practical lesson on shrouding the dead (May 2022), at 2.72M views in the listing. vidIQ's estimated earnings are modelled and are not used. The page itself does not describe the institution behind the channel. Read on 15 November 2026; the figures agree with the wave-200 harvest's vidIQ read of 13 November 2026 (6,060,000 subscribers, 1,208,351,084 views, 20,224 videos)."
