summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد حاتا (1902–1980)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بوكيتنغي في 12 أغسطس 1902 باسم أثر، ودراسته في روتردام، ونفيه إلى ديغول وباندا، وإعلان الاستقلال سنة 1945، ومنصبيه نائبا للرئيس ورئيسا للوزراء، ووفاته في جاكرتا في 14 مارس 1980."
  en: "English Wikipedia article on Mohammad Hatta (1902–1980); used for entity facts only. It recounts his birth at Bukittinggi on 12 August 1902 under the name Athar, his Rotterdam studies, his exile to Digul and Banda, the 1945 proclamation, his vice presidency and premiership, and his death at Jakarta on 14 March 1980."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Hatta (1902-1980); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Bukittinggi el 12 de agosto de 1902 con el nombre de Athar, sus estudios en Rotterdam, su exilio a Digul y Banda, la proclamación de 1945, su vicepresidencia y su cargo de primer ministro, y su muerte en Yakarta el 14 de marzo de 1980."
  fr: "Article de Wikipédia en anglais sur Mohammad Hatta (1902-1980); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Bukittinggi le 12 août 1902 sous le nom d’Athar, ses études à Rotterdam, son exil à Digul et Banda, la proclamation de 1945, sa vice-présidence et son poste de Premier ministre, et sa mort à Jakarta le 14 mars 1980."
  ur: "محمد حطہ (1902–1980) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بکٹنگگی میں 12 اگست 1902 کو اطہر کے نام سے ان کی پیدائش، ان کی روٹرڈیم کی تعلیم، ڈیگل اور بندہ میں ان کی جلاوطنی، 1945 کا اعلان، ان کی نائب صدارت اور پریمیئر شپ، اور 14 مارچ 1980 کو جکارتہ میں ان کی موت کا ذکر ہے۔"
  tr: "Muhammed Hatta (1902–1980) hakkında İngilizce Vikipedi makalesi; yalnızca varlık gerçekleri için kullanılmıştır. 12 Ağustos 1902'de Bukitengi'de Athar adıyla doğduğu, Rotterdam'da eğitim gördüğü, De Gaulle ve Banda'ya sürgün edildiği, 1945'te bağımsızlığını ilan ettiği, Başkan Yardımcısı ve Başbakan pozisyonlarını üstlendiği ve 14 Mart 1980'de Cakarta'da öldüğü anlatılır."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad Hatta (1902–1980); hanya digunakan untuk fakta entitas. Diceritakan bahwa ia lahir di Bukitengi pada 12 Agustus 1902, dengan nama Athar, belajar di Rotterdam, diasingkan ke De Gaulle dan Banda, mendeklarasikan kemerdekaan pada tahun 1945, menjabat sebagai Wakil Presiden dan Perdana Menteri, dan meninggal di Jakarta pada 14 Maret 1980."
