  ar: "مقالة ويكيبيديا الإنجليزية عن محمد حاتا (1902–1980)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بوكيتنغي في 12 أغسطس 1902 باسم أثر، ودراسته في روتردام، ونفيه إلى ديغول وباندا، وإعلان الاستقلال سنة 1945، ومنصبيه نائبا للرئيس ورئيسا للوزراء، ووفاته في جاكرتا في 14 مارس 1980."
  en: "English Wikipedia article on Mohammad Hatta (1902–1980); used for entity facts only. It recounts his birth at Bukittinggi on 12 August 1902 under the name Athar, his Rotterdam studies, his exile to Digul and Banda, the 1945 proclamation, his vice presidency and premiership, and his death at Jakarta on 14 March 1980."
