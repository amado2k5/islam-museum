summary:
  ar: "مقالة ويكيبيديا الفرنسية عن محمد باي المرادي؛ تُستخدم لوقائع الكيان فقط. تجعل ولايته من 1686 إلى وفاته في 14 تشرين الأول 1696، الابن الأكبر لمراد باي الثاني وحفيد يوسف داي من أمه، وتذكر أن جامع سيدي محرز بُني على طراز جوامع إسطنبول الحنفية، وأنه خلفه أخوه رمضان باي لصغر ابنيه."
  en: "French Wikipedia article on Mohamed Bey El Mouradi; used for entity facts only. It dates his tenure 1686 to his death on 14 October 1696, makes him the eldest son of Murad II Bey and, through his mother, a grandson of Yusuf Dey, records that the Sidi Mahrez Mosque was modelled on the Hanafi mosques of Istanbul — an architectural model, not an attestation of his own school, as the person record's faith note states — and gives his brother Ramadan Bey as successor because his sons Mourad and Hassan were too young."
  es: "Artículo de la Wikipedia en francés sobre Mohamed Bey El Mouradi; utilizado únicamente para datos sobre la persona. Fecha su mandato desde 1686 hasta su muerte el 14 de octubre de 1696, lo identifica como el hijo mayor de Murad II Bey y, a través de su madre, nieto de Yusuf Dey, registra que la mezquita Sidi Mahrez se inspiró en las mezquitas hanafíes de Estambul (un modelo arquitectónico, no una declaración de su propia escuela, como indica la nota sobre la fe en el registro de la persona) y designa a su hermano Ramadan Bey como sucesor porque sus hijos Mourad y Hassan eran demasiado jóvenes."
  fr: "L'article de Wikipédia en français sur Mohamed Bey El Mouradi, utilisé uniquement pour les informations relatives à l'entité, date son règne de 1686 à sa mort le 14 octobre 1696. Il le présente comme le fils aîné de Murad II Bey et, par sa mère, un petit-fils de Yusuf Dey. L'article indique que la mosquée Sidi Mahrez a été conçue sur le modèle des mosquées hanafites d'Istanbul – un modèle architectural, et non une attestation de son école, comme le précise la note relative à sa religion – et désigne son frère Ramadan Bey comme successeur, ses fils Mourad et Hassan étant trop jeunes."
  ur: "فرانسیسی ویکیپیڈیا مضمون محمد بی المورادی پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کے دور کی تاریخ 1686 14 اکتوبر 1696 کو ان کی وفات تک ہے، اسے مراد II بے کا سب سے بڑا بیٹا بناتا ہے اور اپنی والدہ کے ذریعے، یوسف ڈے کے پوتے، ریکارڈ کرتا ہے کہ سیدی مہریز مسجد استنبول کی حنفی مساجد پر بنائی گئی تھی - ایک آرکیٹیکچرل ماڈل ہے، نہ کہ اس کے اپنے بھائی کے عقیدے کی توثیق کے طور پر، اس کے اپنے بھائی کے اسکول اور عقیدے کی تصدیق نہیں ہوتی۔ رمضان بے جانشین کے طور پر کیونکہ ان کے بیٹے مراد اور حسن بہت چھوٹے تھے۔"
