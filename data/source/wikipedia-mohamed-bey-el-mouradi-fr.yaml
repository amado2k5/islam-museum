summary:
  ar: "مقالة ويكيبيديا الفرنسية عن محمد باي المرادي؛ تُستخدم لوقائع الكيان فقط. تجعل ولايته من 1686 إلى وفاته في 14 تشرين الأول 1696، الابن الأكبر لمراد باي الثاني وحفيد يوسف داي من أمه، وتذكر أن جامع سيدي محرز بُني على طراز جوامع إسطنبول الحنفية، وأنه خلفه أخوه رمضان باي لصغر ابنيه."
  en: "French Wikipedia article on Mohamed Bey El Mouradi; used for entity facts only. It dates his tenure 1686 to his death on 14 October 1696, makes him the eldest son of Murad II Bey and, through his mother, a grandson of Yusuf Dey, records that the Sidi Mahrez Mosque was modelled on the Hanafi mosques of Istanbul — an architectural model, not an attestation of his own school, as the person record's faith note states — and gives his brother Ramadan Bey as successor because his sons Mourad and Hassan were too young."
