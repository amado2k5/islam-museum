  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد بايتورسينول (نحو 5 سبتمبر 1872 – 8 ديسمبر 1937)، اللغوي والشاعر الكازاخي وأحد قادة ألاش؛ تُستخدم لوقائع الكيان فقط. تتناول إصلاحه للأبجدية الكازاخية ومسيرته التعليمية وصحيفة «قازاق» التي أسسها في أورينبورغ سنة 1913 مع عليخان بوكيخانوف وميرجاقيب دولاتولي وعمله في ألاش أوردا واعتقالاته وإعدامه في التطهير الكبير."
  en: "English Wikipedia article on Ahmet Baitursynuly (c. 5 September 1872 – 8 December 1937), the Kazakh linguist, poet and Alash leader; used for entity facts only. It covers his alphabet reform, his teaching career, the Qazaq newspaper he founded in Orenburg in 1913 with Alikhan Bukeikhanov and Mirjaqip Dulatuli, his Alash Orda work, his arrests and his execution in the Great Purge."
