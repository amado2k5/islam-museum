reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his reign 1755–1792, his coronation on 13 March 1755 (citing the Yogyakarta palace site), his death on 24 March 1792 at the Kraton Yogyakarta and his family in detail. Its dates for his birth conflict inside the article itself — 5 August 1717 in the infobox against 16 August 1717 in the lead — and both are preserved in the record rather than silently chosen. Its infobox files his religion as Islam; no text in it names a legal school for the man himself. Checked 1 November 2026."
