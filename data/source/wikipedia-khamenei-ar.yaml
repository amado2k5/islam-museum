  ar: "مقالة ويكيبيديا العربية عن علي خامنئي؛ تُستخدم لوقائع الكيان فقط. تذكر في مطلعها اغتياله في 28 شباط 2026 خلال حرب إيران 2026 وأنه ثاني مرشد أعلى بعد روح الله الخميني، وتروي رئاسته لإيران في الثمانينيات وقيادته حتى مقتله ودراسته الحوزوية. لا ينصّ نصّها على مذهب شخصي له ولا يحمل الجزء المقروء من صندوقها حقلًا للمذهب."
