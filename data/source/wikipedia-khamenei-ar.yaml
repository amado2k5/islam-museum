summary:
  ar: "مقالة ويكيبيديا العربية عن علي خامنئي؛ تُستخدم لوقائع الكيان فقط. تذكر في مطلعها اغتياله في 28 شباط 2026 خلال حرب إيران 2026 وأنه ثاني مرشد أعلى بعد روح الله الخميني، وتروي رئاسته لإيران في الثمانينيات وقيادته حتى مقتله ودراسته الحوزوية. لا ينصّ نصّها على مذهب شخصي له ولا يحمل الجزء المقروء من صندوقها حقلًا للمذهب."
  en: "Arabic Wikipedia article on Ali Khamenei; used for entity facts only. Its lead records his assassination on 28 February 2026 during the 2026 Iran war and that he was the second supreme leader after Ruhollah Khomeini; it recounts his presidency in the 1980s, his leadership until his killing, and his seminary studies. Its text makes no statement naming his personal school."
  es: "Artículo de Wikipedia en árabe sobre Ali Khamenei; utilizado únicamente para datos sobre la figura. En su introducción se menciona su asesinato el 28 de febrero de 2026 durante la guerra de Irán de ese año y que fue el segundo líder supremo después de Ruhollah Khomeini; relata su presidencia en la década de 1980, su liderazgo hasta su muerte y sus estudios en el seminario. El texto no menciona el nombre de su escuela."
  fr: "Article de Wikipédia en arabe sur Ali Khamenei; utilisé uniquement pour les informations sur l'entité. Son introduction relate son assassinat le 28 février 2026 durant la guerre Iran-Iran de 2026 et précise qu'il était le deuxième guide suprême après Rouhollah Khomeiny; elle retrace sa présidence dans les années 1980, son rôle à la tête du pays jusqu'à sa mort et ses études au séminaire. Le texte ne mentionne pas le nom de son école."
  ur: "علی خامنہ ای پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے لیڈ میں 28 فروری 2026 کو 2026 کی ایران جنگ کے دوران ان کا قتل ریکارڈ کیا گیا ہے اور وہ روح اللہ خمینی کے بعد دوسرے سپریم لیڈر تھے۔ اس میں 1980 کی دہائی میں ان کی صدارت، ان کے قتل تک ان کی قیادت، اور ان کے مدرسے کی تعلیم کا ذکر ہے۔ اس کے متن میں اس کے ذاتی اسکول کا نام لینے کا کوئی بیان نہیں ہے۔"
  tr: "Ali Hamaney hakkında Arapça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 28 Şubat 2026'da, 2026 İran Savaşı sırasında suikastından ve Ruhullah Humeyni'den sonra ikinci Yüksek Lider olduğundan bahsederek başlar. 1980'lerde İran liderliğini, suikastına kadar sürdüğü liderliği ve rahip eğitimini anlatır. Metni kişisel doktrinini belirtmez, kutusundaki basılı kısım bir mezhep alanını temsil etmez."
  id: "Artikel Wikipedia berbahasa Arab tentang Ali Khamenei hanya digunakan untuk fakta entitas tersebut. Artikel ini dimulai dengan menyebutkan pembunuhannya pada 28 Februari 2026, selama Perang Iran 2026, dan bahwa ia adalah Pemimpin Tertinggi kedua setelah Ruhollah Khomeini. Artikel ini menceritakan kepemimpinannya di Iran pada tahun 1980-an, kepemimpinannya hingga pembunuhannya, dan studi seminarinya. Teksnya tidak menyebutkan doktrin pribadinya, dan bagian cetak kotaknya juga tidak mewakili bidang sekte."
