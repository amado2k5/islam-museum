label:
  ar: "نيل الأوطار من أسرار منتقى الأخبار — محمد بن علي الشوكاني، وبهامشه «عون الباري لحل أدلة البخاري» لصديق حسن القنوجي؛ الأجزاء الثاني والثالث والخامس (طبعة حجرية/قديمة، بيانات النشر لم تُقرأ)"
  en: "Nayl al-Awtar min Asrar Muntaqa al-Akhbar — Muhammad b. 'Ali al-Shawkani, with 'Awn al-Bari li-Hall Adillat al-Bukhari by Siddiq Hasan al-Qannawji in the margin; vols. 2, 3 and 5 (old printing; imprint not read)"
summary:
  ar: "طبعة قديمة من «نيل الأوطار» للشوكاني في أجزاء، على هامشها «عون الباري» لصديق حسن القنوجي، وهو شرح «التجريد الصريح لأحاديث الجامع الصحيح» لأحمد الشرجي الزبيدي؛ في المكتبة الأجزاء الثاني والثالث والخامس، ولكل جزء فهرس أبوابه في أوله وجدول تصحيح لأغلاط طبع «عون الباري» في آخره."
  en: "An old multi-volume printing of al-Shawkani's Nayl al-Awtar, with Siddiq Hasan al-Qannawji's 'Awn al-Bari — a commentary on Ahmad al-Sharji al-Zabidi's al-Tajrid al-Sarih li-Ahadith al-Jami' al-Sahih — in the margin; the library holds vols. 2, 3 and 5, each opening with a table of chapters and closing with a list of corrections to the printing of 'Awn al-Bari."
