summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الستار إيدهي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في بانتفا سنة 1928 في أسرة ميمون مسلمة، وتصريحاته العلنية عن دينه وإنسانيته، وتأسيسه مؤسسة إيدهي، ووفاته في كراتشي سنة 2016 وجنازته الرسمية."
  en: "English Wikipedia article on Abdul Sattar Edhi; used for entity facts only. It recounts his birth at Bantva in 1928 into a Memon Muslim family, his public statements about his faith and his humanitarian creed, his founding of the Edhi Foundation, and his death at Karachi in 2016 and state funeral."
  es: "Artículo de la Wikipedia en inglés sobre Abdul Sattar Edhi; utilizado únicamente para obtener información sobre la persona. Relata su nacimiento en Bantva en 1928 en el seno de una familia musulmana memon, sus declaraciones públicas sobre su fe y su vocación humanitaria, la fundación de la Fundación Edhi y su fallecimiento en Karachi en 2016, donde tuvo lugar su funeral de Estado."
  fr: "Article de Wikipédia en anglais sur Abdul Sattar Edhi; utilisé uniquement pour des informations sur l’entité. Il relate sa naissance à Bantva en 1928 dans une famille musulmane Memon, ses déclarations publiques sur sa foi et ses convictions humanitaires, la création de la Fondation Edhi, ainsi que sa mort à Karachi en 2016 et ses funérailles nationales."
  ur: "عبدالستار ایدھی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1928 میں بانٹوا میں ایک میمن مسلم گھرانے میں ان کی پیدائش، ان کے عقیدے اور ان کے انسانی عقیدے کے بارے میں ان کے عوامی بیانات، ایدھی فاؤنڈیشن کے قیام، اور 2016 میں کراچی میں ان کی موت اور سرکاری تدفین کا ذکر کرتا ہے۔"
  tr: "Abdul Sattar Edhi hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 1928'de Pantfa'da Müslüman bir Maimun ailesinde doğumunu, dini ve insanlığı hakkında kamuya açık açıklamalarını, Edhi Vakfı'nın kuruluşunu, 2016'da Karaçi'de vefatını ve resmi cenazesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdul Sattar Edhi hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Pantfa pada tahun 1928 dalam keluarga Muslim Maimun, pernyataan publiknya tentang agama dan kemanusiaannya, pendirian Yayasan Edhi, kematiannya di Karachi pada tahun 2016, dan pemakaman resminya."
