reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives him born 28 February 1928 at Bantva, Gujarat, and died 8 July 2016 at Karachi; married to Bilquis Edhi from 1965, four children; founder of the Edhi Foundation and its volunteer ambulance network; a state funeral with the Janazah prayer at the National Stadium, Karachi, and burial at Edhi Village, Karachi. On faith it states that he was born into a Memon Muslim family (family background); that he publicly expressed he was not a 'very religious person' and was 'neither for religion or against it' (citing the Guardian obituary of 13 July 2016); that he called himself a 'humanitarian', saying empty words and long phrases do not impress God and that faith is shown through action; and it quotes the Los Angeles Times profile of 30 March 1993 — 'Edhi says he is a Muslim--but adds that human rights is his real religion.' No school is named anywhere."
