reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth at Alexandria on 1 December 1863 to a Turkish father and an Albanian (Arnaut) mother of Muhammad Ali's family, his law degree from the Khedival School in 1881 and four years at the University of Montpellier, his appointment to the Mixed Courts in 1885 and rise to the National Court of Appeals, his mentorship under Muhammad Abduh, his books (Les Égyptiens 1894, The Liberation of Women 1899, The New Woman 1900) and his co-founding of Cairo University. This article's lead dates his death 12 April 1908, against 23 April 1908 in the Arabic article and Wikidata — the discrepancy is recorded in the person record. The article names no school of Islam for him. Read in full on 24 October 2026."
