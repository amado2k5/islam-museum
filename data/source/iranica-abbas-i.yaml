reliability_note: "Peer-reviewed scholarly encyclopedia entry, read in full in the online edition on 31 October 2026. Savory pairs the birth with 1 Ramadan 978 / 27 January 1571 and the death in Mazandaran with Jumada I 1038 / 19 January 1629, names Mohammad Khodabanda as his father, and documents his Twelver devotion: reverence for the imams, generous support of Imam Reza's shrine at Mashhad, the pilgrimage on foot from Isfahan to Mashhad in 1010/1601, and the Safavid claim to represent the Hidden (Twelfth) Imam."
