summary:
  ar: "تقرير صحيفة تايمز أوف إنديا ⁦(24 شباط 2026)⁩ عن فيروز ميرشانت: مبادرته «المجتمع المنسي» أطلقت منذ 2008 سراح أكثر من 20,000 سجين معسر في الإمارات، وتتكثف في رمضان ليعيد السجناء إلى بيوتهم قبل الشهر الفضيل."
  en: "Times of India report of 24 February 2026 on Firoz Merchant; it records that his Forgotten Society initiative has released more than 20,000 insolvent prisoners in the UAE since 2008, peaks each Ramadan so prisoners can return home before the holy month, and in 2026 added support for cancer patients."
  es: "Según un reportaje del Times of India del 24 de febrero de 2026 sobre Firoz Merchant, su iniciativa Forgotten Society ha liberado a más de 20.000 presos insolventes en los Emiratos Árabes Unidos desde 2008, alcanza su punto álgido cada Ramadán para que los presos puedan regresar a casa antes del mes sagrado y, en 2026, añadió apoyo a los pacientes con cáncer."
  fr: "Un article du Times of India du 24 février 2026 sur Firoz Merchant indique que son initiative Forgotten Society a libéré plus de 20 000 prisonniers insolvables aux Émirats arabes unis depuis 2008, atteint des sommets chaque Ramadan afin que les prisonniers puissent rentrer chez eux avant le mois sacré, et a ajouté en 2026 un soutien aux patients atteints de cancer."
  ur: "فیروز مرچنٹ پر 24 فروری 2026 کی ٹائمز آف انڈیا کی رپورٹ؛ یہ ریکارڈ کرتا ہے کہ اس کے فراگوٹن سوسائٹی کے اقدام نے 2008 سے متحدہ عرب امارات میں 20,000 سے زیادہ دیوالیہ قیدیوں کو رہا کیا ہے، ہر رمضان کو عروج پر ہوتا ہے تاکہ قیدی مقدس مہینے سے پہلے گھر واپس آ سکیں، اور 2026 میں کینسر کے مریضوں کے لیے امداد میں اضافہ کیا۔"
  tr: "Times of India'nın 24 Şubat 2026 tarihli Feroz Merchant hakkındaki raporu: 'Unutulmuş Toplum' girişimi 2008'den bu yana BAE'de 20.000'den fazla yoksul mahkumu serbest bıraktı ve Ramazan ayında mahkumları kutsal aydan önce evlerine geri gönderme çabası yoğunlaştı."
  id: "Laporan Times of India (24 Februari 2026) tentang Feroz Merchant: Inisiatifnya 'The Forgotten Society' telah membebaskan lebih dari 20.000 tahanan miskin di UEA sejak 2008, semakin intensif selama Ramadan untuk mengembalikan tahanan ke rumah mereka sebelum bulan suci."
