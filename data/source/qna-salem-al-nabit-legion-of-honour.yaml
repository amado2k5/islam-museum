label: { en: "Chief of Staff Receives French National Order of Legion of Honor with Commander Rank — Qatar News Agency" }
summary:
  ar: "خبر وكالة الأنباء القطرية ⁦(قنا)⁩ من باريس في 1 آذار 2024: تلقى رئيس أركان القوات المسلحة القطرية الفريق الركن ⁦(طيار)⁩ سالم بن حمد بن عقيل النابت وسام جوقة الشرف الفرنسي برتبة قائد من رئيس أركان الجيش الفرنسي الجنرال تييري بوركار تقديرًا لدوره في تعزيز العلاقات العسكرية بين البلدين."
  en: "Qatar News Agency bulletin from Paris, 1 March 2024: the Chief of Staff of the Qatar Armed Forces, Staff Lt. General (Pilot) Salem bin Hamad bin Aqeel Al Nabit, received the French National Order of the Legion of Honor with the rank of Commander from French Army Chief of Staff General Thierry Burkhard, in appreciation of his role in strengthening military relations between the two countries."
  es: "Boletín de la Agencia de Noticias de Qatar desde París, 1 de marzo de 2024: El Jefe del Estado Mayor de las Fuerzas Armadas de Qatar, Teniente General (Piloto) Salem bin Hamad bin Aqeel Al Nabit, recibió la Orden Nacional Francesa de la Legión de Honor con el rango de Comendador de manos del Jefe del Estado Mayor del Ejército francés, General Thierry Burkhard, en reconocimiento a su papel en el fortalecimiento de las relaciones militares entre los dos países."
  fr: "Bulletin de l'Agence de presse du Qatar depuis Paris, 1er mars 2024: le chef d'état-major des forces armées qataries, le lieutenant-général (pilote) Salem bin Hamad bin Aqeel Al Nabit, a reçu l'Ordre national français de la Légion d'honneur au grade de commandeur des mains du chef d'état-major des armées françaises, le général Thierry Burkhard, en reconnaissance de son rôle dans le renforcement des relations militaires entre les deux pays."
