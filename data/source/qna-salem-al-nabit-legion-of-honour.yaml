  ar: "خبر وكالة الأنباء القطرية ⁦(قنا)⁩ من باريس في 1 آذار 2024: تلقى رئيس أركان القوات المسلحة القطرية الفريق الركن ⁦(طيار)⁩ سالم بن حمد بن عقيل النابت وسام جوقة الشرف الفرنسي برتبة قائد من رئيس أركان الجيش الفرنسي الجنرال تييري بوركار تقديرًا لدوره في تعزيز العلاقات العسكرية بين البلدين."
  en: "Qatar News Agency bulletin from Paris, 1 March 2024: the Chief of Staff of the Qatar Armed Forces, Staff Lt. General (Pilot) Salem bin Hamad bin Aqeel Al Nabit, received the French National Order of the Legion of Honor with the rank of Commander from French Army Chief of Staff General Thierry Burkhard, in appreciation of his role in strengthening military relations between the two countries."
