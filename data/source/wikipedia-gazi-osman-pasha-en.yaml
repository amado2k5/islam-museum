summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عثمان نوري باشا المعروف بغازی عثمان باشا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده سنة 1832 في طوقاد، ودفاعه عن بلفنة خمسة أشهر سنة 1877، ووفاته في إسطنبول ليلة 4–5 أبريل 1900 ودفنه بجوار جامع الفاتح."
  en: "English Wikipedia article on Osman Nuri Pasha, known as Gazi Osman Pasha; used for entity facts only. It gives his birth in 1832 at Tokat, his five-month defence of Plevna in 1877, his death at Istanbul on the night of 4–5 April 1900 and his burial beside the Fatih Mosque."
  es: "Artículo de la Wikipedia en inglés sobre Osman Nuri Pasha, conocido como Gazi Osman Pasha; utilizado únicamente para datos biográficos. En él se indica su nacimiento en 1832 en Tokat, su defensa de Plevna durante cinco meses en 1877, su muerte en Estambul la noche del 4 al 5 de abril de 1900 y su entierro junto a la Mezquita Fatih."
  fr: "Article de Wikipédia en anglais sur Osman Nuri Pacha, connu sous le nom de Gazi Osman Pacha; utilisé uniquement à titre informatif. Il indique sa naissance en 1832 à Tokat, sa défense de Plevna qui dura cinq mois en 1877, sa mort à Istanbul dans la nuit du 4 au 5 avril 1900 et son inhumation près de la mosquée Fatih."
