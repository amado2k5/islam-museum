  ar: "مقالة ويكيبيديا الإنجليزية عن عثمان نوري باشا المعروف بغازی عثمان باشا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده سنة 1832 في طوقاد، ودفاعه عن بلفنة خمسة أشهر سنة 1877، ووفاته في إسطنبول ليلة 4–5 أبريل 1900 ودفنه بجوار جامع الفاتح."
  en: "English Wikipedia article on Osman Nuri Pasha, known as Gazi Osman Pasha; used for entity facts only. It gives his birth in 1832 at Tokat, his five-month defence of Plevna in 1877, his death at Istanbul on the night of 4–5 April 1900 and his burial beside the Fatih Mosque."
