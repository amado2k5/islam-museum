reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by revision id with content verified identical. The article names no religion or school for Osman Nuri Pasha personally: its early-life text says he was born into the prominent Muslim Turkish Yağcıoğulları family of Tokat — his family background, which does not attest his own affiliation — and its infobox carries no religion field. Its bibliography lists two monographs titled with the years 1833–1900 (Hülagü 1993; Yenice and Fidan 2001) against the 1832 birth year of its own lead and infobox."
