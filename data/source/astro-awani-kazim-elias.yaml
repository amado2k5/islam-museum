reliability_note: "Malaysian television news broadcaster; the two November 2022 headlines above are confirmed on Astro Awani's own topic page as read on 15 November 2026. The second item is carried exactly as the wave-200 harvest recorded Astro Awani's reporting: that Kazim Elias denied a molestation allegation connected to his tahfiz school — the allegation is press-reported and denied by him, and the museum states neither the allegation nor any outcome as fact. The corroborating press shape read in this build session: Malay Mail reported in December 2016 that the Attorney General's Chambers had directed Ipoh police to re-investigate the case at the tahfiz school he owns, after his denial and his suits against a student's mother and against Wardina Safiyyah; the Children's Commissioner of SUHAKAM issued a statement on 19 October 2019 about the dropping of criminal charges against a suspect in the Manjoi, Ipoh tahfiz-school case. Nothing in this entity is a verdict on any person."
