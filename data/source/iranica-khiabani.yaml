reliability_note: "Scholarly encyclopedia entry by Mansour Bonakdarian, read in full on 26 October 2026. For faith it frames his whole formation inside Twelver Shi'ism: he 'resumed his studies at the seminary (see EDUCATION v. THE MADRASA IN SHIʿITE PERSIA), completing his religious studies under Hajj Mirza Abu'l-Hasan Angaji', 'qualified for ejtehad' under the Jameh mosque's prayer leader, himself led the mosque's prayers for nearly three years, and is counted among the city's clerics in its contrast 'while many Shiʿi clerics in the city denounced the insurgency, Khiabani followed the example of the leading pro-constitutionalist cleric Mirza Ali Aqa Seqat al-Eslam'. Its birth dating (about 1297/1879-80) is a year wider than the 1880 of the other sources; the record discloses it."
