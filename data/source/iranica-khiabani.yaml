summary:
  ar: "مدخل موسوعة إيرانيكا «خياباني، الشيخ محمد» بقلم منصور بونكدريان؛ يُستخدم لوقائع الكيان. يعطي ميلاده نحو 1297 (1879-80) في خامنه ووفاته في تبريز في 14 سبتمبر 1920، وإتمامه دراسته الدينية في مدرسة فارس الشيعية عند أنغجي وتأهّله للاجتهاد وإمامته مسجد تبريز الجامع، وقيامه الدستوري وحكومة «آزاديستان» من 7 أبريل إلى 13 سبتمبر 1920 وقتله صبيحة 14 سبتمبر."
  en: "Encyclopaedia Iranica entry 'Khiabani, Shaikh Mohammad' by Mansour Bonakdarian; used for entity facts. It gives his birth about 1297 (1879-80) at Khamena and his death at Tabriz on 14 September 1920, the completion of his religious studies in the seminary of Shi'ite Persia under Angaji, his qualification for ijtihad and his prayer leadership at Tabriz's Jameh mosque, his constitutionalist career, the Azadistan government of 7 April to 13 September 1920, and his killing on the morning of 14 September."
