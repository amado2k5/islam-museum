summary:
  ar: "مقالة ويكيبيديا الأردية عن الأمير محمد يعقوب خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في كابل سنة 1849 ووفاته في دلهي في 15 نوفمبر 1923 ودفنه في كابل، وأباه شير علي خان وأخاه غازي محمد أيوب خان، وولايته على هراة وتمرده وسجنه وإمارته وتوقيعه معاهدة غاندماك. لا تعطي أي قيمة للدين."
  en: "Urdu Wikipedia article on Amir Mohammad Yaqub Khan; used for entity facts only. It gives his birth at Kabul in 1849, his death at Delhi on 15 November 1923 and his burial at Kabul, his father Sher Ali Khan and his brother Ghazi Mohammad Ayub Khan, his governorship of Herat, his rebellion and imprisonment, his emirate and his signing of the Treaty of Gandamak. It gives no religion value."
  es: "Artículo de Wikipedia en urdu sobre el emir Mohammad Yaqub Khan; se utiliza únicamente para datos biográficos. Describe su nacimiento en Kabul en 1849, su fallecimiento en Delhi el 15 de noviembre de 1923 y su entierro en Kabul, su padre Sher Ali Khan y su hermano Ghazi Mohammad Ayub Khan, su gobierno de Herat, su rebelión y encarcelamiento, su emirato y la firma del Tratado de Gandamak. No incluye información sobre su religión."
  fr: "Article de Wikipédia en ourdou sur Amir Mohammad Yaqub Khan; utilisé uniquement à titre informatif. Il mentionne sa naissance à Kaboul en 1849, sa mort à Delhi le 15 novembre 1923 et son inhumation à Kaboul, son père Sher Ali Khan et son frère Ghazi Mohammad Ayub Khan, son mandat de gouverneur d'Hérat, sa rébellion et son emprisonnement, son émirat et la signature du traité de Gandamak. Il ne précise pas son orientation religieuse."
