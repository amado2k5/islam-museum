  ar: "مقالة ويكيبيديا الأردية عن الأمير محمد يعقوب خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في كابل سنة 1849 ووفاته في دلهي في 15 نوفمبر 1923 ودفنه في كابل، وأباه شير علي خان وأخاه غازي محمد أيوب خان، وولايته على هراة وتمرده وسجنه وإمارته وتوقيعه معاهدة غاندماك. لا تعطي أي قيمة للدين."
  en: "Urdu Wikipedia article on Amir Mohammad Yaqub Khan; used for entity facts only. It gives his birth at Kabul in 1849, his death at Delhi on 15 November 1923 and his burial at Kabul, his father Sher Ali Khan and his brother Ghazi Mohammad Ayub Khan, his governorship of Herat, his rebellion and imprisonment, his emirate and his signing of the Treaty of Gandamak. It gives no religion value."
