summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إبراي ألتينسارين؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 1 نوفمبر 1841 ووفاته في 29 يوليو 1889، وعمله مفتشًا لمدارس تورغاي، ومدارسه الكازاخية الروسية، ونقله الكازاخية إلى الأبجدية السيريلية، وتصريحها بأنه كان مسلمًا."
  en: "English Wikipedia article on Ybyrai Altynsarin; used for entity facts only. It recounts his birth on 1 November 1841 and death on 29 July 1889, his work as inspector of Turgay schools, his Kazakh–Russian schools, his transfer of Kazakh to the Cyrillic alphabet, and states personally that he was a Muslim."
  es: "Artículo de la Wikipedia en inglés sobre Ybyrai Altynsarin; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 1 de noviembre de 1841 y su muerte el 29 de julio de 1889, su labor como inspector de las escuelas Turgay, sus escuelas kazajo-rusas, su transición del kazajo al alfabeto cirílico y afirma personalmente que era musulmán."
  fr: "Article de Wikipédia en anglais sur Ybyrai Altynsarin; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance le 1er novembre 1841 et sa mort le 29 juillet 1889, son travail d’inspecteur des écoles de Turgay, ses écoles kazakh-russes, son passage du kazakh à l’alphabet cyrillique, et indique personnellement qu’il était musulman."
  ur: "Ybyrai Altynsarin پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1 نومبر 1841 کو ان کی پیدائش اور 29 جولائی 1889 کو موت، ترگے کے اسکولوں کے انسپکٹر کے طور پر ان کے کام، اس کے قازق-روسی اسکولوں، اس کی قازق زبان کو سیریلک حروف تہجی میں منتقل کرنے کا ذکر ہے، اور ذاتی طور پر بیان کیا گیا ہے کہ وہ مسلمان تھے۔"
  tr: "İbrai Altinsarin hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1 Kasım 1841'deki doğumunu ve 29 Temmuz 1889'daki ölümünü, Torgay okullarının müfettişi olarak çalışmalarını, Kazak Rus okullarını, Kazakça'yı Kiril alfabesine aktarmasını ve Müslüman olduğunu beyan etmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ibrai Altinsarin; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 1 November 1841, dan kematiannya pada 29 Juli 1889, pekerjaannya sebagai inspektur sekolah Torgay, sekolah-sekolah Kazakh Rusia, transfer bahasa Kazakh ke dalam alfabet Sirilik, serta pernyataannya bahwa dia seorang Muslim."
