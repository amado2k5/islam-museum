  ar: "مقالة ويكيبيديا الإنجليزية عن إبراي ألتينسارين؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 1 نوفمبر 1841 ووفاته في 29 يوليو 1889، وعمله مفتشًا لمدارس تورغاي، ومدارسه الكازاخية الروسية، ونقله الكازاخية إلى الأبجدية السيريلية، وتصريحها بأنه كان مسلمًا."
  en: "English Wikipedia article on Ybyrai Altynsarin; used for entity facts only. It recounts his birth on 1 November 1841 and death on 29 July 1889, his work as inspector of Turgay schools, his Kazakh–Russian schools, his transfer of Kazakh to the Cyrillic alphabet, and states personally that he was a Muslim."
