summary:
  ar: "قناة سكينة كاونسلنغ على يوتيوب، وهي العيادة الخاصة للمعالجة نهى الشقيري، المرخّصة في علاج الزواج والأسرة؛ تنشر القناة ورشها ومحاضراتها في التربية الإيجابية والعلاقات الأسرية بالإنجليزية والعربية."
  en: "The Sakina Counseling YouTube channel, the private practice of Noha Alshugairi, licensed marriage and family therapist; the channel carries her parenting workshops and talks on family relationships in English and Arabic."
  es: "El canal de YouTube Sakina Counseling, la consulta privada de Noha Alshugairi, terapeuta matrimonial y familiar titulada, ofrece sus talleres para padres y charlas sobre relaciones familiares en inglés y árabe."
  fr: "La chaîne YouTube Sakina Counseling, le cabinet privé de Noha Alshugairi, thérapeute conjugale et familiale agréée, propose des ateliers sur la parentalité et des conférences sur les relations familiales en anglais et en arabe."
  ur: "سکینہ کونسلنگ یوٹیوب چینل، نوحہ الشوگیری کی نجی پریکٹس، لائسنس یافتہ شادی اور فیملی تھراپسٹ؛ چینل اس کی والدین کی ورکشاپس اور خاندانی تعلقات پر انگریزی اور عربی میں گفتگو کرتا ہے۔"
  tr: "Evlilik ve aile terapisi lisanslı terapist Noha Al-Shuqairi'nin özel kliniği olan Sakina Danışmanlık Kanalı, İngilizce ve Arapça olarak pozitif ebeveynlik ve aile ilişkileri üzerine atölye çalışmaları ve konferanslar yayınlamaktadır."
  id: "Sakina Counseling Channel di YouTube, klinik pribadi terapis Noha Al-Shuqairi yang berlisensi dalam terapi pernikahan dan keluarga, menerbitkan lokakarya dan kuliah tentang pengasuhan positif dan hubungan keluarga dalam bahasa Inggris dan Arab."
