summary:
  ar: "مقالة ويكيبيديا الأردية عن شاه محمد سليمان؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة مشتقة صراحة من المقالة الإنجليزية تصفه بأنه فيزيائي وقاضٍ نشط من 1923 إلى 1941، وتؤكد سنتي ميلاده (1886) ووفاته (1941) في تصنيفيها."
  en: "Urdu Wikipedia article on Shah Muhammad Sulaiman; used for entity facts only. A short stub explicitly derived from the English article (one source family with it), describing him as a physicist and judge active 1923–1941 and confirming the 1886 birth and 1941 death years in its filing categories."
  es: "Artículo de Wikipedia en urdu sobre Shah Muhammad Sulaiman; utilizado únicamente para datos sobre la persona. Un breve extracto derivado explícitamente del artículo en inglés (una familia de fuentes con él), que lo describe como físico y juez activo entre 1923 y 1941 y confirma los años de nacimiento de 1886 y de fallecimiento de 1941 en sus categorías de archivo."
  fr: "Article de Wikipédia en ourdou sur Shah Muhammad Sulaiman; utilisé uniquement pour les informations sur l’entité. Un court extrait tiré explicitement de l’article anglais (une source parmi d’autres), le décrivant comme un physicien et juge actif de 1923 à 1941 et confirmant les années de naissance (1886) et de décès (1941) dans ses catégories de classement."
  ur: "شاہ محمد سلیمان پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ انگریزی مضمون ⁦(اس کے ساتھ ایک ذریعہ خاندان)⁩ سے واضح طور پر اخذ کردہ ایک مختصر اسٹب، اسے ایک ماہر طبیعیات اور جج کے طور پر 1923–1941 کے فعال اور اس کی فائلنگ کیٹیگریز میں 1886 کی پیدائش اور 1941 موت کے سالوں کی تصدیق کرتا ہے۔"
