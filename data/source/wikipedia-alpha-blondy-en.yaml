reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026, and its content checked against the recorded revision. It gives Seydou Koné, born 1 January 1953 at Dimbokro, the first son of a family of eight children, raised by his grandmother; his schooling at Odienné and expulsion for poor attendance; English study in Monrovia (1973) and then in New York (Hunter College and the Columbia University American Language Program from 1974), where he encountered Rastafari and Jamaican concerts; his return to the Ivory Coast and reunion with the television producer Fulgence Kassi, which began his career under the name Alpha Blondy; the breakthrough album Jah Glory (1982), Cocody Rock, Apartheid Is Nazism, and Jerusalem (1986), recorded with the Wailers; his singing in Dyula, French and English and occasionally Arabic, Hebrew and Jamaican Patois; and his appointment as a United Nations Ambassador of Peace for Côte d'Ivoire. For religion it says only that he tried to promote unity between Islam, Judaism and Christianity and drew his arguments and inspiration from his knowledge of the three faiths, instanced by the songs 'God is One' and 'Jerusalem'; it states no personal affiliation for him."
