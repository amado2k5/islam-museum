summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيري أوناردي ⁦(وُلد في 16 كانون الثاني 1988 في بادانغ)⁩، مهندس برمجيات ورجل أعمال إندونيسي، المؤسس والرئيس التنفيذي لشركة ترافيلوكا لحجوزات السفر؛ تذكر دراسته لعلوم الحاسوب والرياضيات في جامعة بيردو، وعمله في مايكروسوفت على برنامج لينك، وتركه ماجستير إدارة الأعمال في هارفارد ليؤسس ترافيلوكا سنة 2012، ووسام ساتيالانكانا ويرا كاريا سنة 2016."
  en: "English Wikipedia article on Ferry Unardi (born 16 January 1988 in Padang), Indonesian software engineer and business executive, founding chief executive of the online travel agency Traveloka; it records his computer science and mathematics studies at Purdue University, his software-engineering work at Microsoft on Lync, his leaving Harvard Business School to co-found Traveloka in 2012, and his 2016 Satyalancana Wira Karya award."
  es: "Artículo de la Wikipedia en inglés sobre Ferry Unardi (nacido el 16 de enero de 1988 en Padang), ingeniero de software y ejecutivo de negocios indonesio, director ejecutivo fundador de la agencia de viajes en línea Traveloka; en él se recogen sus estudios de informática y matemáticas en la Universidad de Purdue, su trabajo de ingeniería de software en Microsoft en Lync, su salida de la Escuela de Negocios de Harvard para cofundar Traveloka en 2012 y su premio Satyalancana Wira Karya de 2016."
  fr: "Article de Wikipédia en anglais sur Ferry Unardi (né le 16 janvier 1988 à Padang), ingénieur logiciel et dirigeant d'entreprise indonésien, fondateur et PDG de l'agence de voyages en ligne Traveloka; il relate ses études en informatique et en mathématiques à l'université Purdue, son travail d'ingénieur logiciel chez Microsoft sur Lync, son départ de la Harvard Business School pour cofonder Traveloka en 2012 et son prix Satyalancana Wira Karya 2016."
