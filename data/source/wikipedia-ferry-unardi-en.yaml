summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيري أوناردي (وُلد في 16 كانون الثاني 1988 في بادانغ)، مهندس برمجيات ورجل أعمال إندونيسي، المؤسس والرئيس التنفيذي لشركة ترافيلوكا لحجوزات السفر؛ تذكر دراسته لعلوم الحاسوب والرياضيات في جامعة بيردو، وعمله في مايكروسوفت على برنامج لينك، وتركه ماجستير إدارة الأعمال في هارفارد ليؤسس ترافيلوكا سنة 2012، ووسام ساتيالانكانا ويرا كاريا سنة 2016."
  en: "English Wikipedia article on Ferry Unardi (born 16 January 1988 in Padang), Indonesian software engineer and business executive, founding chief executive of the online travel agency Traveloka; it records his computer science and mathematics studies at Purdue University, his software-engineering work at Microsoft on Lync, his leaving Harvard Business School to co-found Traveloka in 2012, and his 2016 Satyalancana Wira Karya award."
