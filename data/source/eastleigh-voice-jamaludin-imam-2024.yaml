label: { en: "The Eastleigh Voice — 'Sheikh Jamaludin Osman Haji appointed Imam of Nairobi's Jamia Mosque' (8 May 2024)" }
summary:
  ar: "تقرير صحيفة «ذا إيستلي فويس» الكينية ⁦(8 مايو 2024)⁩ عن تعيين الشيخ جمال الدين عثمان حاجي إمامًا للجامع الكبير في نيروبي؛ يذكر أنه وُلد في 20 يوليو 1986، وأنه نال بكالوريوس الحديث من الجامعة الإسلامية بالمدينة المنورة سنة 2014، وأنه صار نائب الإمام في أكتوبر 2019 قبل تعيينه إمامًا خلفًا للإمام الراحل محمد سواليحو."
  en: "The Eastleigh Voice (Kenya) report of 8 May 2024 on Sheikh Jamaludin Osman Haji's appointment as Imam of Nairobi's Jamia Mosque; it states that he was born on 20 July 1986, earned a bachelor's degree in Hadith at the Islamic University of Madinah in 2014, became deputy imam in October 2019, and was then appointed Imam succeeding the late Imam Muhammad Swalihu."
  ur: "کینیا کے اخبار «دی ایسٹلی وائس» کی 8 مئی 2024ء کی رپورٹ، شیخ جمال الدین عثمان حاجی کی نیروبی کی جامع مسجد کے امام کے طور پر تقرری پر؛ اس میں لکھا ہے کہ وہ 20 جولائی 1986ء کو پیدا ہوئے، 2014ء میں مدینہ کی اسلامی یونیورسٹی سے حدیث میں بیچلر ڈگری حاصل کی، اکتوبر 2019ء میں نائب امام بنے، اور پھر مرحوم امام محمد سوالیحو کے جانشین کے طور پر امام مقرر ہوئے۔"
  es: "Según un informe del Eastleigh Voice (Kenia) del 8 de mayo de 2024 sobre el nombramiento del jeque Jamaludin Osman Haji como imán de la mezquita Jamia de Nairobi, nació el 20 de julio de 1986, obtuvo una licenciatura en Hadith en la Universidad Islámica de Medina en 2014, se convirtió en imán adjunto en octubre de 2019 y posteriormente fue nombrado imán en sucesión del difunto imán Muhammad Swalihu."
  fr: "L'article du Eastleigh Voice (Kenya) du 8 mai 2024 sur la nomination du cheikh Jamaludin Osman Haji comme imam de la mosquée Jamia de Nairobi indique qu'il est né le 20 juillet 1986, a obtenu une licence en hadith à l'université islamique de Médine en 2014, est devenu imam adjoint en octobre 2019, puis a été nommé imam pour succéder à feu l'imam Muhammad Swalihu."
  tr: "Kenya gazetesi 'The Eastleigh Voice'un (8 Mayıs 2024) Nairobi Mescid-Camii İmamı olarak Şeyh Cemaleddin Osman Haji'nin atanmasıyla ilgili bir haber; 20 Temmuz 1986'da doğduğu, 2014 yılında Medine İslam Üniversitesi'nden Hadis lisans derecesi aldığı ve Ekim 2019'da Yardımcı İmam olduktan sonra merhum İmam Muhammed Sualiho'nun yerine İmam olarak atandığı belirtilmektedir."
  id: "Sebuah laporan dari surat kabar Kenya 'The Eastleigh Voice' (8 Mei 2024) tentang pengangkatan Sheikh Jamal al-Din Osman Haji sebagai Imam Masjid Agung Nairobi; disebutkan bahwa ia lahir pada 20 Juli 1986, meraih gelar Sarjana Hadis dari Universitas Islam Madinah pada tahun 2014, dan menjadi Wakil Imam pada Oktober 2019 sebelum diangkat sebagai Imam menggantikan almarhum Imam Muhammad Sualiho."
