reliability_note: "Kenyan news report, read in full on 8 November 2026; the page is dated 8 May 2024. It states verbatim: 'Born on July 20, 1986, Sheikh Jamaludin's journey to the esteemed position reflects a life dedicated to scholarship and service'; 'His father, the late Osman Haji Jama, a renowned international businessman'; his schooling began at St Augustine Preparatory in Mombasa (KCPE in 2000), he was among the first students at the Abu Huraira Academy in Mombasa, took his KCSE in 2004, memorised the Qur'an under Qari Hussein at Baitul Maal in Eastleigh in 2005–2006, went to the University of Madinah in 2007 for a diploma in Arabic studies 'followed by a bachelor's degree in Hadith in 2014', worked as headmaster at Markaz Noor, Sparki, Mombasa in 2015 and as a Supervisor at RAF International University, Mombasa Branch in 2018–2019, and 'In October 2019, Sheikh Jamaludin assumed the role of deputy Imam at Jamia Mosque' before being 'officially appointed as the Imam, succeeding the late Imam Muhammad Swalihu'. The report names no school of law or order for him; his Madinah degree is formation, not an attestation."
