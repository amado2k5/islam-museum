summary:
  ar: "تقرير صحيفة «ذا إيستلي فويس» الكينية ⁦(8 مايو 2024)⁩ عن تعيين الشيخ جمال الدين عثمان حاجي إمامًا للجامع الكبير في نيروبي؛ يذكر أنه وُلد في 20 يوليو 1986، وأنه نال بكالوريوس الحديث من الجامعة الإسلامية بالمدينة المنورة سنة 2014، وأنه صار نائب الإمام في أكتوبر 2019 قبل تعيينه إمامًا خلفًا للإمام الراحل محمد سواليحو."
  en: "The Eastleigh Voice (Kenya) report of 8 May 2024 on Sheikh Jamaludin Osman Haji's appointment as Imam of Nairobi's Jamia Mosque; it states that he was born on 20 July 1986, earned a bachelor's degree in Hadith at the Islamic University of Madinah in 2014, became deputy imam in October 2019, and was then appointed Imam succeeding the late Imam Muhammad Swalihu."
  ur: "کینیا کے اخبار «دی ایسٹلی وائس» کی 8 مئی 2024ء کی رپورٹ، شیخ جمال الدین عثمان حاجی کی نیروبی کی جامع مسجد کے امام کے طور پر تقرری پر؛ اس میں لکھا ہے کہ وہ 20 جولائی 1986ء کو پیدا ہوئے، 2014ء میں مدینہ کی اسلامی یونیورسٹی سے حدیث میں بیچلر ڈگری حاصل کی، اکتوبر 2019ء میں نائب امام بنے، اور پھر مرحوم امام محمد سوالیحو کے جانشین کے طور پر امام مقرر ہوئے۔"
title: "Sheikh Jamaludin Osman Haji appointed Imam of Nairobi's Jamia Mosque"
