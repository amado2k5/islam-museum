  fr: 'La page « Islam in Southeast Asia (Encyclopedia of Religion) » sur Encyclopedia.com, résumée dans un fichier de recherche remis au musée et non ouverte par le musée ; utilisée pour la nombre de mots arabes courants en malais : bien plus d''un millier. Le fondateur a approuvé l''usage du résumé le 21 novembre 2026 sans nouvelle vérification.'
  es: 'La página «Islam in Southeast Asia (Encyclopedia of Religion)» en Encyclopedia.com, resumida en un archivo de investigación entregado al museo y no abierta por el museo; usada para la número de palabras árabes comunes en malayo: mucho más de un millar. El fundador aprobó el uso del resumen el 21 de noviembre de 2026 sin nueva verificación.'
