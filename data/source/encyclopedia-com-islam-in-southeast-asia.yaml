  ar: 'صفحة «Islam in Southeast Asia (Encyclopedia of Religion)» على Encyclopedia.com، ملخَّصة في ملف بحثي قُدّم إلى المتحف ولم يفتحها المتحف؛ تُستعمل لـعدد الألفاظ العربية الشائعة في الملايوية: يزيد كثيراً على الألف. أجاز المؤسس استعمال الملخص في 21 نوفمبر 2026 دون إعادة تحقق.'
  en: 'The page "Islam in Southeast Asia (Encyclopedia of Religion)" on Encyclopedia.com, summarised in a research file supplied to the museum and not opened by the museum; used for the Malay count of common Arabic words: well over a thousand. The founder approved using the summary on 21 November 2026 without re-verification.'
