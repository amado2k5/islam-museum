  id: "Artikel Wikipedia dalam bahasa Urdu tentang Ali Hassan Mweni; digunakan hanya untuk fakta entitas. Artikel ini menceritakan biografi dan masa kepresidenannya di Tanzania (1985–1995) serta kematiannya pada tahun 2024, tanpa menyebutkan agama atau sekolahnya."
