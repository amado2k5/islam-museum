summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الغفار خان؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 6 شباط 1890 في هشتنگار ووفاته في بيشاور في 20 كانون الثاني 1988، وتصفه بزعيم سياسي وروحي عُرف بالمقاومة اللاعنفية، وتذكر صندوق معلوماتها دينه «الإسلام» دون مذهب."
  en: "Arabic Wikipedia article on Abdul Ghaffar Khan; used for entity facts only. It gives his birth on 6 February 1890 in Hashtnagar and his death at Peshawar on 20 January 1988, describes him as a political and spiritual leader known for nonviolent resistance, and its infobox gives his religion as Islam with no school."
  es: "Artículo en árabe de la Wikipedia sobre Abdul Ghaffar Khan; utilizado únicamente para datos sobre la persona. Indica que nació el 6 de febrero de 1890 en Hashtnagar y falleció en Peshawar el 20 de enero de 1988, lo describe como un líder político y espiritual conocido por su resistencia no violenta, y su ficha informativa señala que su religión era el islam sin escuela."
  fr: "Article de Wikipédia en arabe sur Abdul Ghaffar Khan; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 6 février 1890 à Hashtnagar et sa mort à Peshawar le 20 janvier 1988, le décrit comme un chef politique et spirituel connu pour sa résistance non violente, et son infobox précise qu’il était de religion musulmane, sans école religieuse."
