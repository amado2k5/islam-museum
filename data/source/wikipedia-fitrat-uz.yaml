  ar: "مقالة ويكيبيديا الأوزبكية عن عبد الرؤوف فطرت (1886–1938)، المؤرخ والكاتب والمسرحي الأوزبكي وأحد مؤسسي الأدب الأوزبكي الحديث؛ تذكر صندوق معلوماتها سنة 1887 للمولد بينما يعطي متنها 1886 و4 أكتوبر 1938 للوفاة في طشقند."
  en: "The Uzbek Wikipedia article on Abdurauf Fitrat (1886–1938), the Uzbek historian, writer and dramatist and a founder of modern Uzbek literature; its infobox gives 1887 for the birth year while its text gives 1886 and 4 October 1938 for the death at Tashkent."
  es: "El artículo de Wikipedia en uzbeko sobre Abdurauf Fitrat (1886-1938), historiador, escritor y dramaturgo uzbeko y fundador de la literatura uzbeka moderna; su ficha informativa indica 1887 como año de nacimiento, mientras que el texto menciona 1886 y el 4 de octubre de 1938 como fecha de fallecimiento en Tashkent."
  fr: "L'article de Wikipédia en ouzbek sur Abdurauf Fitrat (1886-1938), historien, écrivain et dramaturge ouzbek et fondateur de la littérature ouzbèke moderne; son infobox indique 1887 comme année de naissance tandis que son texte indique 1886 et le 4 octobre 1938 comme date de décès à Tachkent."
  ur: "ازبک تاریخ دان، مصنف اور ڈرامہ نگار اور جدید ازبک ادب کے بانی عبدالروف فطرت (1886–1938) پر ازبک ویکیپیڈیا کا مضمون؛ اس کے معلوماتی خانے میں سال پیدائش کے لیے 1887 دیا گیا ہے جبکہ اس کے متن میں تاشقند میں موت کے لیے 1886 اور 4 اکتوبر 1938 بتایا گیا ہے۔"
