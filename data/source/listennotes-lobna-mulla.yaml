summary:
  ar: "صفحة بودكاست لبنى ملا لدى «مسلم سنترال» كما تعرضها منصة Listen Notes؛ تتضمن سيرتها: شهادة البكالوريوس في الاقتصاد من جامعة كاليفورنيا في إيرفاين، ودراساتها الإسلامية، وأدوارها القيادية في منظمات إسلامية وحديثها في المؤتمرات عن الروحانية والحياة الأسرية وقضايا المسلمين، ووصفًا لها بأنها متحدثة تحفيزية ومربية مجتمعية ومرشدة مسلمة في جامعة كاليفورنيا بلوس أنجلوس لدى معهد المعرفة."
  en: "The Listen Notes listing of Muslim Central's Lobna Mulla podcast page, carrying her biography: a bachelor's degree in Economics from the University of California, Irvine, Islamic studies pursued through various programs, leadership roles in Islamic organizations, conference speaking on spirituality, family life and social issues, and a description of her as a motivational speaker, community educator and IOK Muslim Chaplain at UCLA."
  es: "La ficha de Listen Notes de la página del podcast de Lobna Mulla en Muslim Central incluye su biografía: una licenciatura en Economía de la Universidad de California, Irvine, estudios islámicos realizados a través de diversos programas, roles de liderazgo en organizaciones islámicas, ponencias en conferencias sobre espiritualidad, vida familiar y temas sociales, y una descripción de ella como oradora motivacional, educadora comunitaria y capellana musulmana de IOK en UCLA."
  fr: "La section « Notes d'écoute » de la page du podcast de Lobna Mulla sur Muslim Central contient sa biographie: un baccalauréat en économie de l'Université de Californie à Irvine, des études islamiques poursuivies à travers divers programmes, des rôles de leadership dans des organisations islamiques, des interventions lors de conférences sur la spiritualité, la vie de famille et les questions sociales, et une description d'elle comme conférencière motivatrice, éducatrice communautaire et aumônière musulmane IOK à l'UCLA."
  ur: "مسلم سنٹرل کے لوبنا ملا کے پوڈ کاسٹ صفحہ کی سننے کے نوٹس کی فہرست، اس کی سوانح عمری: یونیورسٹی آف کیلیفورنیا، اروائن سے اکنامکس میں بیچلر کی ڈگری، مختلف پروگراموں کے ذریعے حاصل کی گئی اسلامی تعلیم، اسلامی تنظیموں میں قائدانہ کردار، روحانیت، خاندانی زندگی اور سماجی مسائل پر کانفرنس، اور ایک مسلم کمیونٹی کے طور پر اس کی وضاحت، اور اس کی وضاحت۔ یو سی ایل اے۔"
  tr: "Listen Notes platformu tarafından sunulan 'Muslim Central'daki Lubna Mulla podcast sayfasında biyografisi: California Üniversitesi, Irvine'dan ekonomi lisans derecesi, İslami çalışmalar, İslami organizasyonlarda liderlik rolleri ve maneviyat, aile yaşamı ve Müslüman konularındaki konferans konuşmaları yer alıyor. Kaliforniya Üniversitesi, Los Angeles Knowledge Institute'da motivasyon konuşmacısı, toplum eğitmeni ve Müslüman rehberi olarak tanımlandı."
  id: "Halaman podcast Lubna Mulla di 'Muslim Central' yang dipresentasikan oleh platform Listen Notes mencakup biografinya: gelar sarjana ekonomi dari University of California, Irvine, studi Islamnya, peran kepemimpinan di organisasi Islam, serta presentasi konferensinya tentang spiritualitas, kehidupan keluarga, dan isu Muslim. Dia digambarkan sebagai pembicara motivasi, pendidik komunitas, dan pembimbing Muslim di University of California, Los Angeles di Knowledge Institute."
