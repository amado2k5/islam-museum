label:
  ar: "الشفا بتعريف حقوق المصطفى — القاضي عياض، وبذيله «مزيل الخفاء عن ألفاظ الشفاء» للشمني ⁦(دار الكتب العلمية، بيروت، جزآن)⁩"
  en: "al-Shifa bi-Ta'rif Huquq al-Mustafa — al-Qadi Iyad, with al-Shumunni's Muzil al-Khafa' an Alfaz al-Shifa' beneath it (Dar al-Kutub al-Ilmiyya, Beirut, 2 vols)"
summary:
  ar: "طبعة دار الكتب العلمية ببيروت من «الشفا» للقاضي عياض ⁦(ت 544هـ)⁩ في جزأين، وفي ذيل صفحاتها حاشية «مزيل الخفاء عن ألفاظ الشفاء» لأحمد بن محمد الشمني ⁦(ت 872هـ)⁩، مع ترجمة للقاضي عياض منقولة من «الديباج المذهب» لابن فرحون، وترجمة للشمني من «البدر الطالع» المنتخب من «الضوء اللامع»، وفهرس لكل جزء. لم يظهر في النسخة المصورة تاريخ الطبع."
  en: "The Dar al-Kutub al-Ilmiyya (Beirut) printing of Qadi Iyad's al-Shifa (d. 544 AH) in two volumes, with Ahmad ibn Muhammad al-Shumunni's (d. 872 AH) gloss Muzil al-Khafa' an Alfaz al-Shifa' at the foot of each page, a biography of Qadi Iyad copied from Ibn Farhun's al-Dibaj al-Mudhhab, a biography of al-Shumunni from al-Badr al-Tali' as drawn from al-Daw' al-Lami', and a contents list for each volume. No printing date appears in the scanned copy."
  es: "Edición de Dar al-Kutub al-Ilmiyya (Beirut) de al-Shifa de Qadi Iyad (fallecido en 544 AH) en dos volúmenes, con la glosa de Ahmad ibn Muhammad al-Shumunni (fallecido en 872 AH), Muzil al-Khafa' an Alfaz al-Shifa', al pie de cada página, una biografía de Qadi Iyad copiada de al-Dibaj al-Mudhhab de Ibn Farhun, una biografía de al-Shumunni de al-Badr al-Tali', extraída de al-Daw' al-Lami', y un índice para cada volumen. La copia escaneada no incluye fecha de impresión."
  fr: "L'édition Dar al-Kutub al-Ilmiyya (Beyrouth) de l'ouvrage al-Shifa de Qadi Iyad (mort en 544 AH) en deux volumes, avec la glose Muzil al-Khafa' an Alfaz al-Shifa' d'Ahmad ibn Muhammad al-Shumunni (mort en 872 AH) en bas de chaque page, une biographie de Qadi Iyad copiée d'al-Dibaj al-Mudhhab d'Ibn Farhun, une biographie d'al-Shumunni tirée d'al-Badr al-Tali' elle-même extraite d'al-Daw' al-Lami', et une table des matières pour chaque volume. Aucune date d'impression n'apparaît sur la copie numérisée."
  ur: "دار الکتب العلمیہ ⁦(بیروت)⁩ نے قادی ایاد کی الشفاء ⁦(متوفی 544ھ)⁩ کی طباعت دو جلدوں میں، احمد بن محمد الشمنی ⁦(متوفی 872ھ)⁩ کی تالیف مزیل الخفاء اور الفاز الشفاء کے ساتھ قادیہ اول کے صفحہ اول کے حاشیہ نمبر ایک پر۔ ابن فرحون کی الدبج المذھب، البدر الطالی سے الشمونی کی سوانح عمری جیسا کہ الدعوۃ اللامی سے اخذ کیا گیا ہے، اور ہر جلد کے لیے مواد کی فہرست۔ اسکین شدہ کاپی میں پرنٹنگ کی کوئی تاریخ ظاہر نہیں ہوتی۔"
title: "الشفا بتعريف حقوق المصطفى"
