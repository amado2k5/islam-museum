label:
  ar: "الشفا بتعريف حقوق المصطفى — القاضي عياض، وبذيله «مزيل الخفاء عن ألفاظ الشفاء» للشمني (دار الكتب العلمية، بيروت، جزآن)"
  en: "al-Shifa bi-Ta'rif Huquq al-Mustafa — al-Qadi Iyad, with al-Shumunni's Muzil al-Khafa' an Alfaz al-Shifa' beneath it (Dar al-Kutub al-Ilmiyya, Beirut, 2 vols)"
summary:
  ar: "طبعة دار الكتب العلمية ببيروت من «الشفا» للقاضي عياض (ت 544هـ) في جزأين، وفي ذيل صفحاتها حاشية «مزيل الخفاء عن ألفاظ الشفاء» لأحمد بن محمد الشمني (ت 872هـ)، مع ترجمة للقاضي عياض منقولة من «الديباج المذهب» لابن فرحون، وترجمة للشمني من «البدر الطالع» المنتخب من «الضوء اللامع»، وفهرس لكل جزء. لم يظهر في النسخة المصورة تاريخ الطبع."
  en: "The Dar al-Kutub al-Ilmiyya (Beirut) printing of Qadi Iyad's al-Shifa (d. 544 AH) in two volumes, with Ahmad ibn Muhammad al-Shumunni's (d. 872 AH) gloss Muzil al-Khafa' an Alfaz al-Shifa' at the foot of each page, a biography of Qadi Iyad copied from Ibn Farhun's al-Dibaj al-Mudhhab, a biography of al-Shumunni from al-Badr al-Tali' as drawn from al-Daw' al-Lami', and a contents list for each volume. No printing date appears in the scanned copy."
title: "الشفا بتعريف حقوق المصطفى"
