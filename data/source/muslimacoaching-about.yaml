summary:
  ar: "صفحة التعريف الرسمية بمنصة «مسلمة كوتشينغ»؛ تقدّم نائلة أكبارالي مؤسِّسةً ومديرة تنفيذية، وتذكر أنها وُلدت في ترينيداد ونشأت في جنوب فلوريدا، ودرست العلوم الإسلامية في سوريا والأردن أكثر من خمس عشرة سنة، وحصلت على ماجستير الإرشاد والعلاج النفسي من جامعة باث سبا، وأنها مؤلفة كتب في الزواج وفقه الحيض، وتختم بأن المنصة لا تؤيد عالمًا أو طريقًا صوفيًا بعينه."
  en: "The official About page of Muslima Coaching. It presents Naielah Ackbarali as the service's founder and CEO, born in Trinidad and raised in South Florida, who studied the Islamic sciences in Syria and Jordan for over fifteen years, holds a master's degree in counselling and psychotherapy practice from Bath Spa University, and is the author of books on marriage and the fiqh of menstruation. It closes by stating that Muslima Coaching does not endorse any specific scholar or spiritual path (tariqa)."
