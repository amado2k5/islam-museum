summary:
  ar: "صفحة التعريف الرسمية بمنصة «مسلمة كوتشينغ»؛ تقدّم نائلة أكبارالي مؤسِّسةً ومديرة تنفيذية، وتذكر أنها وُلدت في ترينيداد ونشأت في جنوب فلوريدا، ودرست العلوم الإسلامية في سوريا والأردن أكثر من خمس عشرة سنة، وحصلت على ماجستير الإرشاد والعلاج النفسي من جامعة باث سبا، وأنها مؤلفة كتب في الزواج وفقه الحيض، وتختم بأن المنصة لا تؤيد عالمًا أو طريقًا صوفيًا بعينه."
  en: "The official About page of Muslima Coaching. It presents Naielah Ackbarali as the service's founder and CEO, born in Trinidad and raised in South Florida, who studied the Islamic sciences in Syria and Jordan for over fifteen years, holds a master's degree in counselling and psychotherapy practice from Bath Spa University, and is the author of books on marriage and the fiqh of menstruation. It closes by stating that Muslima Coaching does not endorse any specific scholar or spiritual path (tariqa)."
  es: "La página oficial de Muslima Coaching presenta a Naielah Ackbarali como su fundadora y directora ejecutiva, nacida en Trinidad y criada en el sur de Florida. Estudió ciencias islámicas en Siria y Jordania durante más de quince años, posee una maestría en consejería y psicoterapia por la Universidad de Bath Spa y es autora de libros sobre el matrimonio y el fiqh de la menstruación. Concluye aclarando que Muslima Coaching no respalda a ningún erudito ni camino espiritual (tariqa) en particular."
  fr: "La page « À propos » officielle de Muslima Coaching présente Naielah Ackbarali, fondatrice et PDG du service. Née à Trinité-et-Tobago et ayant grandi en Floride du Sud, elle a étudié les sciences islamiques en Syrie et en Jordanie pendant plus de quinze ans. Titulaire d'une maîtrise en conseil et psychothérapie de l'Université de Bath Spa, elle est également l'auteure d'ouvrages sur le mariage et la jurisprudence islamique (fiqh) relative aux menstruations. La page précise que Muslima Coaching ne soutient aucun érudit ni aucune voie spirituelle (tariqa) en particulier."
