reliability_note: "His own Facebook page: a primary source for his identity and output, not independent corroboration of biography. Facebook profile fetch is blocked in this environment, so the follower figure is NOT this writer's own read: it rests on the wave-195 harvest's same-day (7 November 2026) read of the post metadata across his posts dated 7 June 2026, 9 July 2026 and 22 July 2026, each showing 280,000 followers. The name on the page is Riyad Abdullah; scene posts spell him 'Ustaz Riyad Abdaallah'. A milestone post on the page dated 7 June 2026 marked the Ifa Rahmataa TV YouTube channel reaching 80,000 subscribers and more than 670 videos (harvest read). The page gives no birth date and names no school of law for him. Harvest read on 7 November 2026."
