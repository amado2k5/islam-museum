summary:
  ar: "صفحة رياض عبد الله على فيسبوك (@riyadabdaallah)؛ بلغت 280,000 متابع بحسب قراءة حصاد الموجة لبيانات منشوراته في 7 نوفمبر 2026، إذ تعذّر فتح ملف فيسبوك مباشرة في بيئة هذا البناء."
  en: "Riyad Abdullah's Facebook page (@riyadabdaallah): 280,000 followers by the wave harvest's read of his posts' metadata on 7 November 2026, Facebook profile fetch being blocked in this build environment."
  es: "Página de Facebook de Riyad Abdullah (@riyadabdaallah): 280.000 seguidores según la lectura de metadatos de sus publicaciones por parte de Wave Harvest el 7 de noviembre de 2026; la obtención del perfil de Facebook está bloqueada en este entorno de compilación."
  fr: "La page Facebook de Riyad Abdullah (@riyadabdaallah): 280 000 abonnés selon la lecture des métadonnées de ses publications par Wave Harvest le 7 novembre 2026, la récupération du profil Facebook étant bloquée dans cet environnement de construction."
  ur: "ریاض عبداللہ کا فیس بک پیج (@riyadabdaallah): 7 نومبر 2026 کو ان کی پوسٹس کے میٹا ڈیٹا کو پڑھ کر 280,000 فالوورز نے اس تعمیراتی ماحول میں فیس بک پروفائل کو بلاک کر دیا ہے۔"
  tr: "Riyad Abdullah'ın Facebook sayfası (@riyadabdaallah), Al-Mowja'nın 7 Kasım 2026'daki gönderi verilerini okumasına göre 280.000 takipçiye ulaştı; çünkü bu binanın ortamında doğrudan bir Facebook dosyası açılamadı."
  id: "Halaman Facebook Riyadh Abdullah (@riyadabdaallah) mencapai 280.000 pengikut menurut pembacaan data postingannya pada 7 November 2026, karena tidak memungkinkan membuka file Facebook langsung di lingkungan gedung ini."
