label: { ar: "IHSAN.KZ — استوديو «حكمت» في مسجد حضرت سلطان", en: "IHSAN.KZ — the Hikmet studio at the Hazret Sultan Mosque" }
summary:
  ar: "تقرير في بوابة IHSAN.KZ يذكر أن مسجد حضرت سلطان يضم في طابقه الثالث استوديو «حكمت» التلفزيوني الإذاعي وهيئة تحرير موقع Muslim.kz؛ يُستخدم لهذه الواقعة المؤسسية فقط."
  en: "A report on the IHSAN.KZ portal recording that the Hazret Sultan Mosque houses, on its third floor, the Hikmet television and radio studio and the editorial office of Muslim.kz; used for that institutional fact only."
  es: "Un informe del portal IHSAN.KZ registra que la Mezquita Hazret Sultan alberga, en su tercer piso, el estudio de radio y televisión Hikmet y la oficina editorial de Muslim.kz; se utiliza únicamente para ese dato institucional."
  fr: "Un article du portail IHSAN.KZ indique que la mosquée Hazret Sultan abrite, à son troisième étage, le studio de télévision et de radio Hikmet ainsi que la rédaction de Muslim.kz; utilisé uniquement à titre d'information institutionnelle."
  ur: "IHSAN.KZ پورٹل پر ایک رپورٹ جس کی ریکارڈنگ ہے کہ حضرت سلطان مسجد کی تیسری منزل پر حکمت ٹیلی ویژن اور ریڈیو اسٹوڈیو اور Muslim.kz کا ادارتی دفتر ہے۔ صرف اس ادارہ جاتی حقیقت کے لیے استعمال کیا جاتا ہے۔"
title: "ТҮРКИЯ ЕЛШІСІНІҢ БАС КЕҢЕСШІСІ «ӘЗІРЕТ СҰЛТАН» МЕШІТІН ЗИЯРАТ ЕТТІ (ФОТО)"
