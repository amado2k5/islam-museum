reliability_note: "A news report on IHSAN.KZ, the portal of the Ihsan centre of the Spiritual Administration of Muslims of Kazakhstan, read on 5 November 2026. Describing a visitor's tour of the mosque, it records that its third floor houses the Hikmet TV and radio studio and the Muslim.kz editorial office — the mosque's in-house media operation. Used only for that institutional fact, not for the channel's statistics."
