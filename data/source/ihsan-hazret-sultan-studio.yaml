summary:
  ar: "تقرير في بوابة IHSAN.KZ يذكر أن مسجد حضرت سلطان يضم في طابقه الثالث استوديو «حكمت» التلفزيوني الإذاعي وهيئة تحرير موقع Muslim.kz؛ يُستخدم لهذه الواقعة المؤسسية فقط."
  en: "A report on the IHSAN.KZ portal recording that the Hazret Sultan Mosque houses, on its third floor, the Hikmet television and radio studio and the editorial office of Muslim.kz; used for that institutional fact only."
