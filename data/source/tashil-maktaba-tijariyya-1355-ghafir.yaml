label:
  ar: "كتاب التسهيل لعلوم التنزيل — ابن جزي الكلبي، الجزء الذي يبدأ بسورة غافر (مطبعة مصطفى محمد، صاحب المكتبة التجارية الكبرى، القاهرة، ط1، 1355هـ)"
  en: "Kitab al-Tashil li-Ulum al-Tanzil — Ibn Juzayy al-Kalbi, the part beginning with Surat Ghafir (Matba'at Mustafa Muhammad, owner of al-Maktaba al-Tijariyya al-Kubra, Cairo, 1st ed., 1355 AH)"
  ur: "کتاب التسہیل لعلوم التنزیل — ابن جزی الکلبی، سورۂ غافر سے شروع ہونے والا جزء (مطبعۂ مصطفیٰ محمد، مالک المکتبۃ التجاریہ الکبریٰ، قاہرہ، پہلا ایڈیشن، 1355ھ)"
summary:
  ar: "الجزء الذي يبدأ بسورة غافر من الطبعة الأولى (1355هـ) لتفسير ابن جزي، التي عُني بمقابلتها على عدة نسخ مخطوطة بالمكتبة الملكية، وطبعت بمطبعة مصطفى محمد صاحب المكتبة التجارية الكبرى بمصر؛ والقرآن مطبوع في أعلى الصفحات والتفسير تحته."
  en: "the part beginning with Surat Ghafir of the first printing (1355 AH) of Ibn Juzayy's commentary, collated with several manuscripts in the Royal Library and printed at the press of Mustafa Muhammad, owner of al-Maktaba al-Tijariyya al-Kubra in Egypt; the Qur'anic text is printed at the top of each page with the commentary below."
  ur: "ابن جزی کی تفسیر کی پہلی طباعت (1355ھ) کا سورۂ غافر سے شروع ہونے والا جزء، جس کا شاہی کتب خانے کے کئی قلمی نسخوں سے مقابلہ کیا گیا اور جو مصر میں المکتبۃ التجاریہ الکبریٰ کے مالک مصطفیٰ محمد کے مطبع میں چھپی؛ قرآنی متن ہر صفحے کے اوپر اور تفسیر اس کے نیچے ہے۔"
