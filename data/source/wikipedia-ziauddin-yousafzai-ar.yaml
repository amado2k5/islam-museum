summary:
  ar: "مقالة ويكيبيديا العربية عن ضياء الدين يوسفزي؛ تُستخدم لوقائع الكيان فقط. تروي شهرته والدًا لملالا يوسفزي وعمله الدبلوماسي والتعليمي. تعطي سنة ولادته 1969 دون يوم أو شهر، ولا تسمي له مذهبًا أو انتماء."
  en: "Arabic Wikipedia article on Ziauddin Yousafzai; used for entity facts only. It covers his fame as Malala Yousafzai's father and his diplomatic and educational work. It gives his birth year as 1969 only, with no day or month, and names no school or affiliation for him."
  es: "Artículo de Wikipedia en árabe sobre Ziauddin Yousafzai; utilizado únicamente para obtener información sobre la persona. Describe su fama como padre de Malala Yousafzai y su labor diplomática y educativa. Solo indica que nació en 1969, sin especificar el día ni el mes, y no menciona ninguna escuela ni institución educativa a la que perteneciera."
  fr: "Article Wikipédia en arabe sur Ziauddin Yousafzai; utilisé uniquement à des fins d'information sur l'individu. Il aborde sa notoriété en tant que père de Malala Yousafzai ainsi que son action diplomatique et éducative. Il indique seulement son année de naissance, 1969, sans préciser le jour ni le mois, et ne mentionne ni son établissement scolaire ni son affiliation."
  ur: "ضیاء الدین یوسفزئی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ملالہ یوسفزئی کے والد کے طور پر ان کی شہرت اور ان کے سفارتی اور تعلیمی کام کا احاطہ کیا گیا ہے۔ یہ اس کا سال پیدائش صرف 1969 بتاتا ہے، جس میں کوئی دن یا مہینہ نہیں ہے، اور اس کے لیے کوئی اسکول یا وابستگی کا نام نہیں ہے۔"
  tr: "Diaauddin Yousafzai hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Malala Yousafzai'nin babası olarak ününü ve diplomatik ile eğitim çalışmalarını anlatır. Doğum yılını 1969 olarak verir, bir gün veya ay belirtmez ve mezhebi ya da bağlılığı belirtilmez."
  id: "Artikel Wikipedia berbahasa Arab tentang Diaauddin Yousafzai hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menceritakan ketenarannya sebagai ayah Malala Yousafzai serta pekerjaan diplomatik dan pendidikannya. Ia mencantumkan tahun kelahirannya sebagai 1969 tanpa hari atau bulan, dan tidak menyebutkan sekte atau afiliasinya."
