summary:
  ar: "صفحة تغطية في موقع عربية نيوز 24 لأخبار واعظات وزارة الأوقاف المصرية، تضم تصريحات للدكتورة وفاء عبد السلام تقول فيها إن تأهيلها وتأهيل واعظات الوزارة بدأ من عام 2017 بدورات لم يحصلن عليها من قبل، وإنها درست في أكاديمية الأوقاف الدولية دراسة متقدمة في اللغات والحاسب الآلي والفلسفة، وأنها من المكرَّمات من الرئيس عبد الفتاح السيسي في احتفالية المولد النبوي؛ كما تضم حديثها في برنامج «مع الناس» على قناة الناس عن الإيمان أولَ مقومات النصر."
  en: "A coverage page on the Arab Khabar site for news of Egypt's Ministry of Awqaf female preachers, carrying statements by Dr Wafaa Abdel Salam that her training, and that of the ministry's female preachers, began in 2017 with courses they had not previously received, that she studied advanced languages, computing and philosophy at the International Awqaf Academy, and that she was among those honoured by President Abdel Fattah el-Sisi at a Mawlid celebration; it also carries her remarks on the programme 'Ma'a al-Nas' (With the People) on Al-Nas channel, on faith as the first component of victory."
