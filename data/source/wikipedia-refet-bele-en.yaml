reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him as İbrahim Refet Bele, born in 1881 at Thessaloniki, a commander in the Sinai and Palestine campaign, Minister of the Interior twice in 1920–1921 and Minister of National Defence from August 1921 to January 1922, a member of the Grand National Assembly for İzmir and then Istanbul, dead on 3 October 1963 at Istanbul and buried at Zincirlikuyu Cemetery. It also records, citing Bayar (2024) and Beyoğlu (2011), that as Minister of the Interior in July 1921 he upheld Nureddin Pasha's orders for the deportation of Pontic Greeks from Ordu, including women, children and the elderly, against the protest of the district administrator, who resigned calling the orders criminal. It makes no statement of his religion in its text or infobox; its death date, 3 October 1963, differs by one day from the Turkish article's 2 October."
