  ar: "مقالة ويكيبيديا الإنجليزية عن رفعت بيله؛ تُستخدم لوقائع الكيان فقط. تروي قياداته العثمانية في فلسطين، ووزارتيه للداخلية والدفاع الوطني في حكومة أنقرة، وعضويته في البرلمان، ووفاته في إسطنبول سنة 1963 ودفنه في مقبرة زينجيرليكويو."
  en: "English Wikipedia article on Refet Bele; used for entity facts only. It recounts his Ottoman commands in Palestine, his two terms as Minister of the Interior and his term as Minister of National Defence in the Ankara government, his years in parliament, and his death at Istanbul in 1963 and burial at Zincirlikuyu Cemetery."
  es: "Artículo de la Wikipedia en inglés sobre Refet Bele; utilizado únicamente para obtener información sobre la persona. Relata sus mandos otomanos en Palestina, sus dos mandatos como Ministro del Interior y su mandato como Ministro de Defensa Nacional en el gobierno de Ankara, sus años en el parlamento y su muerte en Estambul en 1963 y su entierro en el cementerio de Zincirlikuyu."
  fr: "Article de Wikipédia en anglais sur Refet Bele; utilisé uniquement à des fins d’information sur l’entité. Il relate ses commandements ottomans en Palestine, ses deux mandats de ministre de l’Intérieur et son mandat de ministre de la Défense nationale au sein du gouvernement d’Ankara, ses années au Parlement, ainsi que sa mort à Istanbul en 1963 et son inhumation au cimetière de Zincirlikuyu."
