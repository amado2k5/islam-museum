summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هيفاء المنصور؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في الزلفي سنة 1974 ونشأتها في الأحساء ودراستها في القاهرة وسيدني وفيلم «وجدة» وتلقّيها انتقادات بأنها غير متدينة تنفيها."
  en: "English Wikipedia article on Haifaa al-Mansour; used for entity facts only. It records her birth in Al Zulfi in 1974, her upbringing in Al-Hasa, her studies in Cairo and Sydney, the film Wadjda, and the criticism that she was unreligious, which she denies."
  es: "Artículo de la Wikipedia en inglés sobre Haifaa al-Mansour; utilizado únicamente para datos biográficos. En él se recogen su nacimiento en Al Zulfi en 1974, su infancia en Al-Hasa, sus estudios en El Cairo y Sídney, la película Wadjda y las críticas que la tachaban de irreligiosa, algo que ella niega."
  fr: "Article de Wikipédia en anglais sur Haifaa al-Mansour; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Al Zulfi en 1974, son enfance à Al-Hasa, ses études au Caire et à Sydney, le film Wadjda, et les critiques selon lesquelles elle serait impie, ce qu’elle réfute."
  ur: "حائفہ المنصور پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1974 میں الزلفی میں اس کی پیدائش، الحاسہ میں اس کی پرورش، قاہرہ اور سڈنی میں اس کی تعلیم، فلم ودجدہ، اور اس تنقید کو درج کیا گیا ہے کہ وہ غیر مذہبی تھی، جس کی وہ تردید کرتی ہیں۔"
