reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Covers: birth 10 August 1974 in Al Zulfi; eighth of twelve children of the poet and lawyer Abdul Rahman Mansour; upbringing in Al-Hasa in a liberal, non-traditional family; comparative literature at the American University in Cairo and a master's in film studies at the University of Sydney; the shorts Who?, The Bitter Journey and The Only Way Out; the documentary Women Without Shadows (2005); Wadjda (2012), the first feature shot entirely in Saudi Arabia, directed from a van under gender segregation, backed by Rotana, and Saudi Arabia's first Oscar submission; Mary Shelley (2017), Nappily Ever After (2018) and The Perfect Candidate (2019); her seat on the 2015 Cannes Un Certain Regard jury and the 2019 Davos Crystal Award; the hate mail and criticism for being unreligious, which she denies; and her life in California with her husband Bradley Niemann and two children. It names no school or affiliation for her personally."
