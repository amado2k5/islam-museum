  ar: "مقالة ويكيبيديا الإنجليزية عن أكبر هاشمي رفسنجاني؛ تُستخدم لوقائع الكيان فقط. تقدّمه في مطلعها رجل دين شيعيًا وسياسيًا إيرانيًا كان رئيسًا لإيران 1989–1997 ورئيسًا لمجلس الخبراء ومجلس تشخيص مصلحة النظام، وتعطي اسمه عند الولادة علي أكبر هاشمي بهرماني وميلاده في بهرمان في 25 آب 1934 ووفاته في 8 كانون الثاني 2017. صندوقها لا يحمل حقلًا للدين أو المذهب."
  en: "English Wikipedia article on Akbar Hashemi Rafsanjani; used for entity facts only. Its lead presents him as an Iranian Shia cleric and politician who was president of Iran from 1989 to 1997 and headed the Assembly of Experts and the Expediency Discernment Council; it gives his birth name as Ali Akbar Hashemi Bahramani, his birth at Bahreman on 25 August 1934 and his death on 8 January 2017. Its infobox carries no religion or denomination field."
