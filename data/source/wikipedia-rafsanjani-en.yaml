summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أكبر هاشمي رفسنجاني؛ تُستخدم لوقائع الكيان فقط. تقدّمه في مطلعها رجل دين شيعيًا وسياسيًا إيرانيًا كان رئيسًا لإيران 1989–1997 ورئيسًا لمجلس الخبراء ومجلس تشخيص مصلحة النظام، وتعطي اسمه عند الولادة علي أكبر هاشمي بهرماني وميلاده في بهرمان في 25 آب 1934 ووفاته في 8 كانون الثاني 2017. صندوقها لا يحمل حقلًا للدين أو المذهب."
  en: "English Wikipedia article on Akbar Hashemi Rafsanjani; used for entity facts only. Its lead presents him as an Iranian Shia cleric and politician who was president of Iran from 1989 to 1997 and headed the Assembly of Experts and the Expediency Discernment Council; it gives his birth name as Ali Akbar Hashemi Bahramani, his birth at Bahreman on 25 August 1934 and his death on 8 January 2017. Its infobox carries no religion or denomination field."
  es: "Artículo de la Wikipedia en inglés sobre Akbar Hashemi Rafsanjani; utilizado únicamente para datos sobre la persona. Su introducción lo presenta como un clérigo y político chiíta iraní que fue presidente de Irán de 1989 a 1997 y dirigió la Asamblea de Expertos y el Consejo de Discernimiento de la Conveniencia; indica que su nombre de nacimiento era Ali Akbar Hashemi Bahramani, que nació en Bahreman el 25 de agosto de 1934 y que falleció el 8 de enero de 2017. Su ficha informativa no incluye información sobre religión o denominación religiosa."
  fr: "Article Wikipédia en anglais sur Akbar Hashemi Rafsanjani; utilisé uniquement pour les informations sur l'entité. Son introduction le présente comme un religieux chiite et homme politique iranien, président de l'Iran de 1989 à 1997 et ancien président de l'Assemblée des experts et du Conseil de discernement de l'intérêt supérieur du régime. Son nom de naissance est Ali Akbar Hashemi Bahramani, sa naissance a eu lieu à Bahreïn le 25 août 1934 et son décès le 8 janvier 2017. Son infobox ne comporte aucune information sur la religion ou la confession."
  ur: "اکبر ہاشمی رفسنجانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی قیادت انہیں ایک ایرانی شیعہ عالم اور سیاست دان کے طور پر پیش کرتی ہے جو 1989 سے 1997 تک ایران کے صدر رہے اور ماہرین کی اسمبلی اور Expediency Discernment Council کے سربراہ رہے۔ اس میں ان کا پیدائشی نام علی اکبر ہاشمی بہرامانی ہے، ان کی پیدائش 25 اگست 1934 کو بہریمن میں ہوئی اور ان کی وفات 8 جنوری 2017 کو ہوئی۔ اس کے معلوماتی باکس میں کوئی مذہب یا فرقہ نہیں ہے۔"
  tr: "Akbar Haşimi Rafsancani hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1989-1997 yılları arasında İran Cumhurbaşkanı ve Uzmanlar Meclisi ile Çıkar Ayırt Etme Konseyi Başkanı olarak görev yapmış bir Şii din adamı ve İranlı siyasetçiyle başlar. Doğum adı Ali Akbar Hashemi Bahramani olarak verilmiştir; 25 Ağustos 1934'te Bahraman'da doğmuş ve 8 Ocak 2017'de vefat etmiştir. Kutusunda din veya mezhep alanı yoktur."
  id: "Artikel Wikipedia bahasa Inggris tentang Akbar Hashemi Rafsanjani; hanya digunakan untuk fakta entitas. Artikel ini dimulai dengan seorang ulama Syiah dan politisi Iran yang menjabat sebagai Presiden Iran dari tahun 1989 hingga 1997 serta sebagai Ketua Majelis Ahli dan Dewan Discernment Expediency. Artikel tersebut mencantumkan nama lahirnya sebagai Ali Akbar Hashemi Bahramani, lahir di Bahraman pada 25 Agustus 1934, dan meninggal pada 8 Januari 2017. Kotaknya tidak memuat bidang agama atau sekte."
