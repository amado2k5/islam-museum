reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and its content checked against the recorded revision. It gives Ali Shaheed Muhammad, born 11 August 1970 in Brooklyn, New York City, raised in Bedford-Stuyvesant; his co-founding of A Tribe Called Quest in 1985; Lucy Pearl (2000); his solo album Shaheedullah and Stereotypes (2004); and his work with Adrian Younge (the Luke Cage soundtracks, The Midnight Hour, and the Jazz Is Dead series from 2020). On his faith the article states a single sentence — \"Muhammad is a Muslim\" — citing a forum page that is now a dead link, and files him in the categories Converts to Islam and African-American Muslims. No school is named. There is no Arabic or Urdu article."
