summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فراق گورکھپوری؛ تُستخدم لوقائع الكيان فقط. تقول في متنها إنه وُلد في «أسرة كائست هندوسية ميسورة ومتعلمة» — خلفية أسرية — وتروي استقالته من الخدمة المدنية لاتباع غاندي وتدريسه في جامعة الله آباد."
  en: "English Wikipedia article on Firaq Gorakhpuri; used for entity facts only. Its text says he was born in 'a well-to-do and educated Hindu Kayastha family' — family background — and recounts his resignation from the civil service to follow Gandhi and his teaching at Allahabad University."
  es: "Artículo de la Wikipedia en inglés sobre Firaq Gorakhpuri; utilizado únicamente para obtener información sobre la persona. Su texto indica que nació en una familia hindú Kayastha acomodada y educada (antecedentes familiares) y relata su renuncia al servicio civil para seguir a Gandhi y su labor docente en la Universidad de Allahabad."
  fr: "Article de Wikipédia en anglais sur Firaq Gorakhpuri; utilisé uniquement pour des informations sur l'entité. Son texte indique qu'il est né dans une famille hindoue Kayastha aisée et instruite (origine familiale) et relate sa démission de la fonction publique pour suivre Gandhi et son enseignement à l'université d'Allahabad."
  ur: "فراق گورکھپوری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے متن میں کہا گیا ہے کہ وہ ایک اچھے کام کرنے والے اور پڑھے لکھے ہندو کائستھ خاندان میں پیدا ہوا تھا - خاندانی پس منظر - اور الہ آباد یونیورسٹی میں گاندھی اور ان کی تعلیمات کی پیروی کرنے کے لیے سول سروس سے استعفیٰ دینے کا ذکر کرتا ہے۔"
