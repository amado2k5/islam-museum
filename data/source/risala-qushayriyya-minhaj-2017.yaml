summary:
  ar: "طبعة محققة مخرجة من الرسالة القشيرية «اعتمدت على اثنتي عشرة نسخة خطية، اثنتان منها منقولتان عن أصل عليه خط المؤلف»، مع الفهارس العامة، بمقدمة مطولة في سيرة القشيري والرسالة ونسخها."
  en: "A critical edition of al-Risala al-Qushayriyya with sources traced, 'based on twelve manuscripts, two of them copied from an original bearing the author's hand', with general indexes and a long introduction on al-Qushayri's life, the Risala and its manuscripts."
  ur: "الرسالۃ القشیریہ کا محقق اور مخرج ایڈیشن، «بارہ قلمی نسخوں پر مبنی، جن میں سے دو مصنف کے خط والے اصل سے منقول ہیں»، عام فہارس کے ساتھ، اور قشیری کی سیرت، رسالے اور اس کے نسخوں پر طویل مقدمے کے ساتھ۔"
