summary:
  ar: "مدخل موسوعة إيرانيكا «لاهوتي، أبو القاسم» بقلم كاميار عابدي؛ يُستخدم لوقائع الكيان. يعطي ولادته في كرمانشاه في 12 أكتوبر 1887 ووفاته في موسكو في 16 مارس 1957، ويتتبع انتقال شعره من الدين والتصوف إلى القومية ثم الشيوعية، وقيادته انتفاضة تبريز 1922، ومناصبه في طاجيكستان السوفييتية."
  en: "Encyclopaedia Iranica entry 'Lahuti, Abu'l-Qasem' by Kamyar Abedi; used for entity facts. It gives his birth at Kermanshah on 12 October 1887 and his death at Moscow on 16 March 1957, and traces his poetry's movement from religion and mysticism through nationalism to communism, his leadership of the 1922 Tabriz uprising, and his offices in Soviet Tajikistan."
