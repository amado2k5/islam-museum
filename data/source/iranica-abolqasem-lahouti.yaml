summary:
  ar: "مدخل موسوعة إيرانيكا «لاهوتي، أبو القاسم» بقلم كاميار عابدي؛ يُستخدم لوقائع الكيان. يعطي ولادته في كرمانشاه في 12 أكتوبر 1887 ووفاته في موسكو في 16 مارس 1957، ويتتبع انتقال شعره من الدين والتصوف إلى القومية ثم الشيوعية، وقيادته انتفاضة تبريز 1922، ومناصبه في طاجيكستان السوفييتية."
  en: "Encyclopaedia Iranica entry 'Lahuti, Abu'l-Qasem' by Kamyar Abedi; used for entity facts. It gives his birth at Kermanshah on 12 October 1887 and his death at Moscow on 16 March 1957, and traces his poetry's movement from religion and mysticism through nationalism to communism, his leadership of the 1922 Tabriz uprising, and his offices in Soviet Tajikistan."
  es: "Entrada de la Enciclopedia Iranica «Lahuti, Abu'l-Qasem» de Kamyar Abedi; utilizada para datos biográficos. Indica su nacimiento en Kermanshah el 12 de octubre de 1887 y su muerte en Moscú el 16 de marzo de 1957, y traza la evolución de su poesía desde la religión y el misticismo, pasando por el nacionalismo, hasta el comunismo, su liderazgo en el levantamiento de Tabriz de 1922 y sus cargos en el Tayikistán soviético."
  fr: "L'article « Lahuti, Abu'l-Qasem » de l'Encyclopaedia Iranica, rédigé par Kamyar Abedi, est utilisé pour les informations biographiques. Il indique sa naissance à Kermanshah le 12 octobre 1887 et sa mort à Moscou le 16 mars 1957, et retrace l'évolution de sa poésie, de la religion et du mysticisme au nationalisme puis au communisme, son rôle à la tête du soulèvement de Tabriz en 1922 et ses fonctions au Tadjikistan soviétique."
title: "LAHUTI, Abu'l-Qasem"
