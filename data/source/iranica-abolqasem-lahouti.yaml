reliability_note: "Scholarly encyclopedia entry, read in full on 26 October 2026. Its lead calls Lahouti a 'Marxist poet', describing his political ideology; it records that he was absorbed in religious and mystic poetry in youth through the Ni'matullahi teacher Heyran Alishah, that his poetry moved 'further and further away from religion and mysticism', and that he 'urged people to denounce religion, rise against the landowners, and embrace communism' (citing Sepanlu) - the advocacy of his writings. It makes no statement documenting a personal act or profession of unbelief, and names no madhhab for him."
