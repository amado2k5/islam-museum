summary:
  ar: "صفحة دار «House of Recitations» على ستوريتل للمصحف بصوت منصور السالمي؛ تذكر صيغة اسمه «منصور عابد السالمي» ودراسته في قسم العقيدة بجامعة أم القرى بمكة."
  en: "The House of Recitations audiobook page on Storytel for the Quran recitation by Mansour Al-Salimi; its biography gives his name in the form 'Mansur Abid Al-Salimi' and his graduation from the Department of Aqeedah at Umm al-Qura University in Makkah."
  es: "La página del audiolibro \"La Casa de las Recitaciones\" en Storytel contiene la recitación del Corán por Mansour Al-Salimi; su biografía indica que su nombre es \"Mansur Abid Al-Salimi\" y que se graduó del Departamento de Aqeedah de la Universidad Umm al-Qura en La Meca."
  fr: "La page du livre audio « House of Recitations » sur Storytel pour la récitation du Coran par Mansour Al-Salimi; sa biographie donne son nom sous la forme « Mansur Abid Al-Salimi » et son diplôme du département d’Aqeedah de l’université Umm al-Qura à La Mecque."
  ur: "منصور السلیمی کی تلاوت قرآن کے لیے اسٹوری ٹیل پر آڈیو بک کا صفحہ؛ اس کی سوانح عمری میں ان کا نام 'منصور عابد السلیمی' اور مکہ مکرمہ کی ام القری یونیورسٹی کے شعبہ عقیدہ سے گریجویشن کی صورت میں بیان کیا گیا ہے۔"
