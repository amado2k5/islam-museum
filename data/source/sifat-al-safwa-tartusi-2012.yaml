label:
  ar: "صفة الصفوة — ابن الجوزي ⁦(تحقيق خالد مصطفى طرطوسي، دار الكتاب العربي، بيروت 1433هـ/2012م)⁩"
  en: "Sifat al-Safwa — Ibn al-Jawzi (ed. Khalid Mustafa Tartusi, Dar al-Kitab al-Arabi, Beirut 1433/2012)"
summary:
  ar: "كتاب صفة الصفوة لأبي الفرج ابن الجوزي ⁦(510–597هـ)⁩ في أخبار الزهاد والعباد من النبي والصحابة ومن بعدهم مرتبين على البلدان، بتحقيق خالد مصطفى طرطوسي، دار الكتاب العربي، بيروت 1433هـ/2012م، في مجلد واحد مع 1031 ترجمة مرقمة وفهارس."
  en: "Abu al-Faraj Ibn al-Jawzi's (510–597 AH) Sifat al-Safwa on the ascetics and devout from the Prophet and the Companions onward, arranged by city, edited by Khalid Mustafa Tartusi, Dar al-Kitab al-Arabi, Beirut 1433/2012, one volume with 1,031 numbered entries and indexes."
  es: "Sifat al-Safwa de Abu al-Faraj Ibn al-Jawzi (510–597 AH) sobre los ascetas y devotos desde el Profeta y los Compañeros en adelante, ordenado por ciudad, editado por Khalid Mustafa Tartusi, Dar al-Kitab al-Arabi, Beirut 1433/2012, un volumen con 1.031 entradas numeradas e índices."
  fr: "Sifat al-Safwa d'Abu al-Faraj Ibn al-Jawzi (510–597 AH) sur les ascètes et les dévots du Prophète et des Compagnons à nos jours, organisé par ville, édité par Khalid Mustafa Tartusi, Dar al-Kitab al-Arabi, Beyrouth 1433/2012, un volume avec 1 031 entrées numérotées et des index."
  ur: "ابو الفراج ابن الجوزی کی ⁦(510-597 ہجری)⁩ سیفۃ الصفوی پر نبی اور صحابہ سے متقی اور شہر کے لحاظ سے ترتیب دی گئی، خالد مصطفی طرطوسی، دار الکتاب العربی، بیروت 1433، جلد نمبر 3/2012 کے ساتھ۔ اشاریہ جات"
  tr: "Abu al-Faraj Ibn al-Jawzi (510–597 H) tarafından yazılan 'Elitlerin Tanımı' adlı kitap, Peygamber, Sahabeler ve Sonrasında Keşişler ve İbadetçilerin Hesapları üzerine, topraklara göre düzenlenmiş, Halid Mustafa Tartusi tarafından düzenlenmiştir, Dar al-Kitab al-Arabi, Beyrut 1433 Hicri / 2012 M.S. tek cilt halinde 1.031 numaralı biyografi ve dizinle birlikte hazırlanmıştır."
  id: "Buku 'Deskripsi Kaum Elite' oleh Abu al-Faraj Ibn al-Jawzi (510–597 H) tentang Kisah Para Pertapa dan Penyembah dari Nabi, Para Sahabat, dan Setelahnya, diatur berdasarkan negeri, disunting oleh Khalid Mustafa Tartusi, Dar al-Kitab al-Arabi, Beirut 1433 H / 2012 M, dalam satu jilid dengan 1.031 biografi bernomor dan indeks."
