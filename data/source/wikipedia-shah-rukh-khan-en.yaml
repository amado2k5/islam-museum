reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A very long article, read in full on 25 October 2026. It gives his birth on 2 November 1965 in New Delhi 'into a Muslim family' — his father Mir Taj Mohammed Khan, an independence activist with Abdul Ghaffar Khan's Khudai Khidmatgar who moved to Delhi in 1946, and his mother Lateef Fatima, a magistrate — his Rajendra Nagar upbringing, St Columba's School and its Sword of Honour, economics at Hansraj College (1985–88), theatre with Barry John's Theatre Action Group, and his parents' deaths (1981 and 1991). Its personal-life section carries the statement on which the person record's faith note rests: 'According to Khan, while he strongly believes in Islam, he also values his wife's religion. His children follow both religions; at his home the Qur'an is situated next to the murti of Hindu deities.' It also records his marriage to Gauri Chibber, a Punjabi Hindu, in a traditional Hindu ceremony on 25 October 1991 after a six-year courtship, and their children Aryan (born 1997), Suhana (born 2000) and AbRam (born 2013, through a surrogate). Career coverage includes the Fauji television debut (1989), the film debut Deewana (1992), the anti-hero films Baazigar, Darr and Anjaam, the romantic-hero ascendancy of Dilwale Dulhania Le Jayenge (1995) — still running at Mumbai's Maratha Mandir after more than 1,000 weeks in early 2015 — Devdas (2002), Swades (2004), Chak De! India (2007), My Name Is Khan (2010), the slump and hiatus after Zero (2018), and the 2023 comeback of Pathaan, Jawan and Dunki, each a major commercial success, with the National Film Award for Best Actor for Jawan; his fifteen Filmfare Awards, eight of them for Best Actor, a record shared with Dilip Kumar; the Padma Shri (2005), the French Order of Arts and Letters (2007) and Legion of Honour (2014), five honorary doctorates; Red Chillies Entertainment, restructured from Dreamz Unlimited in 2004 with his wife Gauri as producer; the Kolkata Knight Riders, bought in 2008 for US$75.09 million and Indian Premier League champions in 2012, 2014 and 2024; the UNESCO Pyramide con Marni award (2011), the World Economic Forum's Crystal Award (2018) and TIME 100 (2023); and a net worth estimated at US$1.4 billion as of October 2025 (the article's figure, attributed as such)."
