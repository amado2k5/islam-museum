label:
  ar: "الزهد للإمام أحمد بن حنبل ⁦(دار الكتب العلمية، بيروت 1403هـ/1983م)⁩"
  en: "Ahmad ibn Hanbal, al-Zuhd (Dar al-Kutub al-'Ilmiyya, Beirut 1983)"
  ur: "احمد بن حنبل، الزہد ⁦(دار الکتب العلمیہ، بیروت 1983)⁩"
summary:
  ar: "طبعة دار الكتب العلمية الأولى لكتاب الزهد لأحمد بن حنبل برواية ابنه عبد الله، بمقدمة للناشر وترجمة موجزة للمؤلف، مرتبة على زهد الأنبياء ثم الصحابة ثم التابعين؛ نسخة ممسوحة من مكتبة الإسكندرية."
  en: "The first Dar al-Kutub al-'Ilmiyya printing of Ahmad ibn Hanbal's al-Zuhd in the transmission of his son Abd Allah, with a publisher's preface and a short biography of the author, arranged by the renunciation of the prophets, then the Companions, then the Successors; a Bibliotheca Alexandrina scan."
  ur: "احمد بن حنبل کی کتاب الزہد کا دار الکتب العلمیہ کا پہلا ایڈیشن، ان کے بیٹے عبد اللہ کی روایت سے، ناشر کے مقدمے اور مصنف کے مختصر تعارف کے ساتھ، انبیا پھر صحابہ پھر تابعین کے زہد پر مرتب؛ مکتبہ اسکندریہ کا اسکین۔"
  es: "La primera edición impresa de Dar al-Kutub al-'Ilmiyya de al-Zuhd de Ahmad ibn Hanbal, transmitida por su hijo Abd Allah, con un prefacio del editor y una breve biografía del autor, ordenada según la renuncia de los profetas, luego los Compañeros y finalmente los Sucesores; un escaneo de la Bibliotheca Alexandrina."
  fr: "La première édition Dar al-Kutub al-'Ilmiyya de l'ouvrage al-Zuhd d'Ahmad ibn Hanbal, transmis par son fils Abd Allah, avec une préface de l'éditeur et une courte biographie de l'auteur, classée selon la renonciation des prophètes, puis des Compagnons, puis des Successeurs; une numérisation de la Bibliotheca Alexandrina."
  tr: "Ahmed ibn Hanbal'ın oğlu Abdullah tarafından anlatılan, yayınevinin önsözü ve yazarın kısa biyografisiyle birlikte Dar al-Kutub Al-Ilmiyyah'ın ilk baskısı; önce Sahabeler, sonra Takipçiler gibi asketizm tarzında düzenlenmiştir; İskenderina Bibliotheca kitabından taranmış bir kopya."
  id: "Edisi pertama Dar Al-Kutub Al-Ilmiyyah dari buku Al-Zuhd karya Ahmad ibn Hanbal, yang dinarasikan oleh putranya Abdullah, dengan kata pengantar dari penerbit dan biografi singkat dari penulis, disusun sesuai dengan asketisme para Nabi, kemudian Para Sahabat, kemudian para Pengikut; salinan hasil scan dari Bibliotheca Alexandrina."
