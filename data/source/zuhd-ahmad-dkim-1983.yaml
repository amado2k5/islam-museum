summary:
  ar: "طبعة دار الكتب العلمية الأولى لكتاب الزهد لأحمد بن حنبل برواية ابنه عبد الله، بمقدمة للناشر وترجمة موجزة للمؤلف، مرتبة على زهد الأنبياء ثم الصحابة ثم التابعين؛ نسخة ممسوحة من مكتبة الإسكندرية."
  en: "The first Dar al-Kutub al-'Ilmiyya printing of Ahmad ibn Hanbal's al-Zuhd in the transmission of his son Abd Allah, with a publisher's preface and a short biography of the author, arranged by the renunciation of the prophets, then the Companions, then the Successors; a Bibliotheca Alexandrina scan."
  ur: "احمد بن حنبل کی کتاب الزہد کا دار الکتب العلمیہ کا پہلا ایڈیشن، ان کے بیٹے عبد اللہ کی روایت سے، ناشر کے مقدمے اور مصنف کے مختصر تعارف کے ساتھ، انبیا پھر صحابہ پھر تابعین کے زہد پر مرتب؛ مکتبہ اسکندریہ کا اسکین۔"
