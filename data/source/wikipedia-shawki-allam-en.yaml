summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شوقي علام ⁦(ولد 12 أغسطس 1961)⁩، مفتي مصر من 2013 إلى 2024؛ ينقل متنها عن تقرير لصحيفة إيجيبت إندبندنت بتاريخ 25 فبراير 2013 عبارة أن علام صوفي."
  en: "The English Wikipedia article on Shawki Allam (born 12 August 1961), Grand Mufti of Egypt from 2013 to 2024; its text, citing an Egypt Independent report of 25 February 2013, states that 'Allam is a Sufi'."
  es: "El artículo de la Wikipedia en inglés sobre Shawki Allam (nacido el 12 de agosto de 1961), Gran Muftí de Egipto de 2013 a 2024, cita un informe de Egypt Independent del 25 de febrero de 2013, en el que se afirma que \"Allam es un sufí\"."
  fr: "L'article de Wikipédia en anglais sur Shawki Allam (né le 12 août 1961), grand mufti d'Égypte de 2013 à 2024; son texte, citant un rapport d'Egypt Independent du 25 février 2013, indique qu'« Allam est un soufi »."
  ur: "شوکی علام ⁦(پیدائش 12 اگست 1961)⁩ پر انگریزی ویکیپیڈیا مضمون، 2013 سے 2024 تک مصر کے مفتی اعظم؛ اس کا متن، 25 فروری 2013 کی مصر کی آزاد رپورٹ کا حوالہ دیتے ہوئے کہتا ہے کہ 'عالم ایک صوفی ہے'۔"
  tr: "2013-2024 yılları arasında Mısır Müftüsü olan Shawky Allam (d. 12 Ağustos 1961) hakkında İngilizce Wikipedia makalesi; 25 Şubat 2013 tarihli Egypt Independent raporundan alıntı yaparak Allam'ın bir Sufi olduğunu belirtmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Shawky Allam (lahir 12 Agustus 1961), Mufti Mesir dari 2013 hingga 2024; mengutip laporan Egypt Independent tertanggal 25 Februari 2013, yang menyatakan bahwa Allam adalah seorang Sufi."
