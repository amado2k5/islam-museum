summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شركة ميتشلز للفواكه الباكستانية؛ تُستخدم هنا لخبر واحد عن سيد مراتب علي: أن فرانسيس ميتشل باعه سنة 1958 أغلب أسهم الشركة، وهو خبر موسوم في المقالة نفسها بطلب الاستشهاد."
  en: "English Wikipedia article on Mitchell's, the Pakistani fruit company; used here for a single statement about Syed Maratib Ali: that in 1958 Francis Mitchell sold him a majority of the company's shares, a statement the article itself tags as needing a citation."
  es: "Artículo de la Wikipedia en inglés sobre Mitchell's, la empresa frutícola pakistaní; utilizado aquí para una única afirmación sobre Syed Maratib Ali: que en 1958 Francis Mitchell le vendió la mayoría de las acciones de la empresa, una afirmación que el propio artículo señala como que necesita una cita."
  fr: "Article de Wikipédia en anglais sur Mitchell's, la société fruitière pakistanaise; utilisé ici pour une seule affirmation concernant Syed Maratib Ali: qu'en 1958, Francis Mitchell lui a vendu la majorité des actions de la société, une affirmation que l'article lui-même signale comme nécessitant une citation."
  ur: "پاکستانی فروٹ کمپنی مچلز پر انگریزی ویکیپیڈیا کا مضمون؛ سید مراتیب علی کے بارے میں ایک ہی بیان کے لیے یہاں استعمال کیا گیا ہے: کہ 1958 میں فرانسس مچل نے انھیں کمپنی کے زیادہ تر حصص بیچ دیے تھے، یہ بیان خود مضمون میں لکھا گیا ہے کہ ایک حوالہ درکار ہے۔"
  tr: "Burada Syed Maratib Ali hakkında bir haber için kullanılan İngilizce Wikipedia makalesi Syed Maratib Ali hakkında 1958'de Francis Mitchell'in şirketin hisselerinin çoğunu sattığı ve aynı makalede atıf talebi olarak da belirtilen bir haber."
  id: "Artikel Wikipedia bahasa Inggris tentang Mitchell Fruit Company of Pakistan digunakan di sini untuk satu berita tentang Syed Maratib Ali: bahwa Francis Mitchell menjual sebagian besar saham perusahaan kepadanya pada tahun 1958, sebuah berita yang dikutip dalam artikel yang sama sebagai permintaan kutipan."
