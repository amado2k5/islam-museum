summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هانونغ برامانتيو؛ تُستخدم لوقائع الكيان فقط. تفصّل ميلاده في يوجياكارتا سنة 1975 وبدايته سنة 1998 وفيلمه «آيات آيات تشينتا» ⁦(2008)⁩ ومسيرته بين أفلام المراهقين والدراما الدينية."
  en: "English Wikipedia article on Hanung Bramantyo; used for entity facts only. It details his 1975 Yogyakarta birth, his 1998 directorial debut, his 2008 film Ayat-Ayat Cinta, and a career spanning teen romances and religious dramas."
  es: "Artículo de la Wikipedia en inglés sobre Hanung Bramantyo; utilizado únicamente para obtener información sobre la persona. Detalla su nacimiento en Yogyakarta en 1975, su debut como director en 1998, su película Ayat-Ayat Cinta de 2008 y una trayectoria profesional que abarca romances juveniles y dramas religiosos."
  fr: "Article Wikipédia en anglais sur Hanung Bramantyo; utilisé uniquement à des fins d'information sur l'acteur. Il détaille sa naissance à Yogyakarta en 1975, ses débuts en tant que réalisateur en 1998, son film de 2008, Ayat-Ayat Cinta, et une carrière qui s'étend des romances pour adolescents aux drames religieux."
  ur: "Hanung Bramantyo پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی 1975 کی یوگیکارتا کی پیدائش، 1998 میں ان کی ہدایت کاری کی پہلی فلم، ان کی 2008 کی فلم آیت-آیات سنٹا، اور نوعمر رومانوی اور مذہبی ڈراموں پر محیط کیریئر کی تفصیلات ہیں۔"
  tr: "Hanong Bramanteau hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1975'te Yogyakarta'da doğdu, 1998'de başladı ve 'Ayat Ayat Chinta' (2008) filmi ile gençlik filmleri ile dini dramalar arasında kariyerini yaptı."
  id: "Artikel Wikipedia bahasa Inggris tentang Hanong Bramanteau; digunakan hanya untuk fakta entitas. Ia lahir di Yogyakarta pada tahun 1975, dimulai pada tahun 1998, dan filmnya 'Ayat Ayat Chinta' (2008), serta kariernya di antara film remaja dan drama religius."
