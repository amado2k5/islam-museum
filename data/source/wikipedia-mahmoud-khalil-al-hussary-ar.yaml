summary:
  ar: "مقالة ويكيبيديا العربية عن محمود خليل الحصري؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 1 ذي الحجة 1335هـ الموافق 17 سبتمبر 1917 في شبرا النملة، وتدرّبه ومسيرته الإذاعية ومناصبه، ووفاته مساء الاثنين 16 محرم 1401هـ الموافق 24 نوفمبر 1980؛ وصندوق معلوماتها يعطي عقيدته أهل السنة والجماعة ويترك المذهب خاليا."
  en: "Arabic Wikipedia article on Mahmoud Khalil al-Hussary; used for entity facts only. It gives his birth on 1 Dhu al-Hijjah 1335 AH (17 September 1917) at Shubra al-Namla, his training, radio career and posts, and his death on Monday evening 16 Muharram 1401 AH (24 November 1980); its infobox gives his creed as Ahl al-Sunna wa-l-Jama'a and leaves the madhhab field blank."
  es: "Artículo de Wikipedia en árabe sobre Mahmoud Khalil al-Hussary; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 1 de Dhu al-Hijjah de 1335 AH (17 de septiembre de 1917) en Shubra al-Namla, su formación, su carrera radiofónica y sus cargos, y su fallecimiento la noche del lunes 16 de Muharram de 1401 AH (24 de noviembre de 1980); su ficha informativa indica que pertenecía a la escuela Ahl al-Sunna wa-l-Jama'a y deja en blanco el campo de la escuela jurídica (madhhab)."
  fr: "Article de Wikipédia en arabe sur Mahmoud Khalil al-Hussary; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 1er Dhu al-Hijjah 1335 AH (17 septembre 1917) à Shubra al-Namla, sa formation, sa carrière à la radio et ses postes, ainsi que son décès le lundi soir 16 Muharram 1401 AH (24 novembre 1980); son infobox mentionne sa croyance comme Ahl al-Sunna wa-l-Jama'a et laisse le champ madhhab vide."
  ur: "عربی ویکیپیڈیا مضمون محمود خلیل الحسری پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ یکم ذی الحجہ 1335ھ ⁦(17 ستمبر 1917)⁩ کو شبرہ النملہ میں ان کی ولادت، ان کی تربیت، ریڈیو کیرئیر اور پوسٹس، اور پیر کی شام 16 محرم 1401 ہجری ⁦(24 نومبر 1980)⁩ کو ان کی وفات ہوئی؛ اس کا معلوماتی خانہ اپنا مسلک اہل السنۃ والجماعۃ دیتا ہے اور مذہب کا میدان خالی چھوڑ دیتا ہے۔"
