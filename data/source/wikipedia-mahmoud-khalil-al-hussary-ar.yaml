  ar: "مقالة ويكيبيديا العربية عن محمود خليل الحصري؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 1 ذي الحجة 1335هـ الموافق 17 سبتمبر 1917 في شبرا النملة، وتدرّبه ومسيرته الإذاعية ومناصبه، ووفاته مساء الاثنين 16 محرم 1401هـ الموافق 24 نوفمبر 1980؛ وصندوق معلوماتها يعطي عقيدته أهل السنة والجماعة ويترك المذهب خاليا."
  en: "Arabic Wikipedia article on Mahmoud Khalil al-Hussary; used for entity facts only. It gives his birth on 1 Dhu al-Hijjah 1335 AH (17 September 1917) at Shubra al-Namla, his training, radio career and posts, and his death on Monday evening 16 Muharram 1401 AH (24 November 1980); its infobox gives his creed as Ahl al-Sunna wa-l-Jama'a and leaves the madhhab field blank."
