label:
  ar: ذيل تاريخ الإسلام ⁦(701–750هـ)⁩ — الذهبي، اعتناء مازن بن سالم باوزير ⁦(دار المغني)⁩
  en: Dhayl Tarikh al-Islam (AH 701–750) — al-Dhahabi, ed. Mazin ibn Salim Bawazir (Dar al-Mughni)
  ur: ذیل تاریخ الاسلام ⁦(701–750ھ)⁩ — ذہبی، بہ اہتمام مازن بن سالم باوزیر ⁦(دار المغنی)⁩
summary:
  ar: ذيل الذهبي ⁦(ت 748هـ)⁩ على تاريخ الإسلام، يضم تراجم الأعلام وحوادث السنين من 701 إلى 750هـ، وهو من آخر ما كتبه عن معاصريه، اعتنى به مازن بن سالم باوزير ونشرته دار المغني {cite:dhayl-tarikh-islam-bawazir p. 2}.
  en: Al-Dhahabi's (d. 748 AH) continuation of his Tarikh al-Islam, with the notices of the notable dead and the events of the years 701–750 AH, much of it about people he knew; edited by Mazin ibn Salim Bawazir and published by Dar al-Mughni {cite:dhayl-tarikh-islam-bawazir p. 2}.
  ur: ذہبی ⁦(وفات 748ھ)⁩ کا تاریخ الاسلام پر ذیل، جس میں 701 تا 750ھ کے اعیان کے تراجم اور سالانہ واقعات ہیں، اور جس کا بڑا حصہ ان کے معاصرین سے متعلق ہے؛ مازن بن سالم باوزیر کی تحقیق و اعتنا سے دار المغنی نے شائع کیا {cite:dhayl-tarikh-islam-bawazir p. 2}۔
