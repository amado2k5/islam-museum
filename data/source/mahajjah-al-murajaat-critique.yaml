summary:
  ar: "كتاب «Shattering the Mirage: A Response to 'Abdul Hussain Sharaf al-Din's al Muraja'at» المنشور على موقع Mahajjah، وهو رد إنجليزي مطوّل على «المراجعات» يوثّق حجة المشكّكين في صحة نسبة المراسلات إلى الشيخ سليم البشري وكونها من تأليف المؤلف وحده؛ اطُّلع عليه في 17 نوفمبر 2026."
  en: "The book 'Shattering the Mirage: A Response to 'Abdul Hussain Sharaf al-Din's al Muraja'at' published on Mahajjah, an extended English critique of al-Muraja'at documenting the argument that the correspondence attributed to Shaykh Salim al-Bishri is composed by its author rather than historical; consulted on 17 November 2026."
  es: "El libro 'Shattering the Mirage: A Response to 'Abdul Hussain Sharaf al-Din's al Muraja'at', publicado en Mahajjah, es una extensa crítica en inglés de al-Muraja'at que documenta el argumento de que la correspondencia atribuida al Shaykh Salim al-Bishri fue compuesta por su autor en lugar de ser histórica; consultado el 17 de noviembre de 2026."
  fr: "Le livre « Briser le mirage: une réponse à « Abdul Hussain Sharaf al-Din's al Muraja'at » publié sur Mahajjah, une critique en anglais approfondie d'al-Muraja'at documentant l'argument selon lequel la correspondance attribuée à Shaykh Salim al-Bishri est composée par son auteur plutôt qu'historique; consulté le 17 novembre 2026."
  ur: "کتاب 'شٹرنگ دی میرج: اے رسپانس ٹو' عبد الحسین شرف الدین کی المراجعات' مہاجہ پر شائع ہوئی، المراجعات کی ایک توسیعی انگریزی تنقید اس دلیل کی دستاویز کرتی ہے کہ شیخ سلیم البشری سے منسوب خط و کتابت اس کے مصنف کی طرف سے تحریر کی گئی ہے نہ کہ تاریخی؛ 17 نومبر 2026 کو مشورہ کیا گیا۔"
