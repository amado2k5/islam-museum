reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his dates as 1675-1711 and his reign as seventh khan of Bukhara from 1702 to 1711, states that in 1702 Subhan Quli Khan's son Ubaydullah ascended the throne, explains that modern historians call the Ashtarkhanid 'Ubaydullah II' to avoid confusion with the Shaybanid Ubaydullah Khan (1533-1540), and records his failed centralisation, the debased-coinage reform of 1708, his killing in the conspiracy of 1711, his burial in the mazar of Bahauddin Naqshband beside his father, and his succession by his brother Abu'l-Fayz Khan. It names no school or order for the khan himself. Checked 1 November 2026."
