summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن المحرك البخاري؛ لوقائع الكيان فقط: آلة إيوليبيل هيرون الإسكندري القرن الأول، وصف تقي الدين لآلة توربينية بخارية بدائية بمصر العثمانية 1551، وجيوفاني برانكا بإيطاليا 1629، ثم دلا بورتا 1601 وأيانث 1606 ودو كوس 1615 وبابان 1679-1690، وأول محرك تجاري سايفري 1698 ونيوكومن 1712 وواط 1764."
  en: "English Wikipedia article on the steam engine; entity facts only: Hero of Alexandria's first-century aeolipile, Taqi al-Din's rudimentary steam-turbine device described in Ottoman Egypt in 1551 and Giovanni Branca's in Italy in 1629, then della Porta 1601, Ayanz 1606, de Caus 1615, Papin 1679-1690, the first commercial engine Savery 1698, Newcomen 1712 and Watt's separate condenser 1764."
  es: "Artículo de la Wikipedia en inglés sobre la máquina de vapor; solo datos sobre las entidades: la eolípila del siglo I de Herón de Alejandría, el rudimentario dispositivo de turbina de vapor de Taqi al-Din descrito en el Egipto otomano en 1551 y el de Giovanni Branca en Italia en 1629, luego della Porta 1601, Ayanz 1606, de Caus 1615, Papin 1679-1690, la primera máquina comercial Savery 1698, Newcomen 1712 y el condensador separado de Watt 1764."
