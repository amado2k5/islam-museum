summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن المحرك البخاري؛ لوقائع الكيان فقط: آلة إيوليبيل هيرون الإسكندري القرن الأول، وصف تقي الدين لآلة توربينية بخارية بدائية بمصر العثمانية 1551، وجيوفاني برانكا بإيطاليا 1629، ثم دلا بورتا 1601 وأيانث 1606 ودو كوس 1615 وبابان 1679-1690، وأول محرك تجاري سايفري 1698 ونيوكومن 1712 وواط 1764."
  en: "English Wikipedia article on the steam engine; entity facts only: Hero of Alexandria's first-century aeolipile, Taqi al-Din's rudimentary steam-turbine device described in Ottoman Egypt in 1551 and Giovanni Branca's in Italy in 1629, then della Porta 1601, Ayanz 1606, de Caus 1615, Papin 1679-1690, the first commercial engine Savery 1698, Newcomen 1712 and Watt's separate condenser 1764."
  es: "Artículo de la Wikipedia en inglés sobre la máquina de vapor; solo datos sobre las entidades: la eolípila del siglo I de Herón de Alejandría, el rudimentario dispositivo de turbina de vapor de Taqi al-Din descrito en el Egipto otomano en 1551 y el de Giovanni Branca en Italia en 1629, luego della Porta 1601, Ayanz 1606, de Caus 1615, Papin 1679-1690, la primera máquina comercial Savery 1698, Newcomen 1712 y el condensador separado de Watt 1764."
  fr: "Article de Wikipédia en anglais sur la machine à vapeur; faits uniquement sur l'entité: l'éolipile d'Héron d'Alexandrie au premier siècle, le dispositif rudimentaire de turbine à vapeur de Taqi al-Din décrit en Égypte ottomane en 1551 et celui de Giovanni Branca en Italie en 1629, puis della Porta 1601, Ayanz 1606, de Caus 1615, Papin 1679-1690, le premier moteur commercial Savery 1698, Newcomen 1712 et le condenseur séparé de Watt 1764."
  ur: "بھاپ کے انجن پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: اسکندریہ کی پہلی صدی کے ایولوپائل کا ہیرو، تقی الدین کا ابتدائی اسٹیم ٹربائن ڈیوائس جسے 1551 میں عثمانی مصر میں بیان کیا گیا اور جیوانی برانکا کا اٹلی میں 1629 میں، پھر ڈیلا پورٹا 1601، ایانز ڈی، 1610، 1610 1679-1690، پہلا کمرشل انجن سیوری 1698، نیوکومن 1712 اور واٹ کا الگ کنڈینسر 1764۔"
  tr: "Buhar makinesi hakkında İngilizce Wikipedia makalesi; sadece varlık için gerçekler: birinci yüzyılda İskenderiyeli Eulybel Heron, Taqi al-Din'in Osmanlı Mısır'ında ilkel bir buhar türbini makinesi tanımı 1551, Giovanni Branca 1629'da İtalya'da, ardından della Porta 1601'de, Aënth 1606'da, de Cos 1615'te, Papain 1679-1690'da, ilk ticari motor Cyphrey 1698'de, Neukomen 1712'de ve Watt 1764'te."
  id: "Artikel Wikipedia bahasa Inggris tentang mesin uap; hanya untuk fakta entitas: Eulybel Heron dari Alexandria pada abad pertama, deskripsi Taqi al-Din tentang mesin turbin uap primitif di Mesir Ottoman 1551, Giovanni Branca di Italia pada 1629, kemudian della Porta pada 1601, Aënth pada 1606, de Cos pada 1615, Papain pada 1679-1690, mesin komersial pertama Cyphrey pada 1698, Neukomen pada 1712, dan Watt pada 1764."
