summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن يحيى خان؛ تُستخدم لوقائع الكيان فقط. تروي مولده في جكوال في 4 فبراير 1917، والتحاقه بالجيش الهندي البريطاني سنة 1939، وقيادته الجيش الباكستاني من 1966، ورئاسته والأحكام العرفية من 1969، وانتخابات 1970، وعملية «شعلة البحث» وحرب 1971، واستقالته وإقامته الجبرية، ووفاته في راولبندي في 10 أغسطس 1980 ودفنه في بيشاور. وفي قسم حياته الشخصية فرع عن الدين يذكر أنه كان مسلما شيعيا اسميا."
  en: "English Wikipedia article on Yahya Khan; used for entity facts only. It recounts his birth at Chakwal on 4 February 1917, his commission in the British Indian Army in 1939, his command of the Pakistan Army from 1966, his presidency and martial law from 1969, the 1970 election, Operation Searchlight and the 1971 war, his resignation, house arrest, and his death at Rawalpindi on 10 August 1980 with burial at Peshawar. Its Personal life section has a Religion subsection stating he was nominally a Shia Muslim."
  es: "Artículo de la Wikipedia en inglés sobre Yahya Khan; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Chakwal el 4 de febrero de 1917, su ingreso en el Ejército Indio Británico en 1939, su mando del Ejército de Pakistán desde 1966, su presidencia y la ley marcial desde 1969, las elecciones de 1970, la Operación Searchlight y la guerra de 1971, su dimisión, arresto domiciliario y su muerte en Rawalpindi el 10 de agosto de 1980, con entierro en Peshawar. Su sección de Vida personal incluye una subsección sobre Religión que indica que era nominalmente musulmán chiíta."
  fr: "Article de Wikipédia en anglais sur Yahya Khan; utilisé uniquement pour les informations factuelles. Il relate sa naissance à Chakwal le 4 février 1917, son entrée dans l'armée des Indes britanniques en 1939, son commandement de l'armée pakistanaise à partir de 1966, sa présidence et l'instauration de la loi martiale en 1969, les élections de 1970, l'opération Searchlight et la guerre de 1971, sa démission, son assignation à résidence et sa mort à Rawalpindi le 10 août 1980, suivie de son inhumation à Peshawar. La section « Vie personnelle » comporte une sous-section « Religion » indiquant qu'il était nominalement musulman chiite."
  ur: "یحییٰ خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 4 فروری 1917 کو چکوال میں ان کی پیدائش، 1939 میں برٹش انڈین آرمی میں ان کا کمیشن، 1966 سے پاکستان آرمی میں ان کی کمانڈ، 1969 سے ان کی صدارت اور مارشل لاء، 1970 کے انتخابات، آپریشن سرچ لائٹ اور 1971 کی جنگ، ان کا استعفیٰ، گھر میں نظربندی اور 19 اگست 1900 کو راول پنڈی میں ان کی موت کا ذکر ہے۔ پشاور۔ اس کے ذاتی زندگی کے حصے میں مذہب کا ذیلی حصہ ہے جس میں کہا گیا ہے کہ وہ برائے نام شیعہ مسلمان تھا۔"
