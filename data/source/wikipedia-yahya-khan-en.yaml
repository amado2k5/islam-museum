summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن يحيى خان؛ تُستخدم لوقائع الكيان فقط. تروي مولده في جكوال في 4 فبراير 1917، والتحاقه بالجيش الهندي البريطاني سنة 1939، وقيادته الجيش الباكستاني من 1966، ورئاسته والأحكام العرفية من 1969، وانتخابات 1970، وعملية «شعلة البحث» وحرب 1971، واستقالته وإقامته الجبرية، ووفاته في راولبندي في 10 أغسطس 1980 ودفنه في بيشاور. وفي قسم حياته الشخصية فرع عن الدين يذكر أنه كان مسلما شيعيا اسميا."
  en: "English Wikipedia article on Yahya Khan; used for entity facts only. It recounts his birth at Chakwal on 4 February 1917, his commission in the British Indian Army in 1939, his command of the Pakistan Army from 1966, his presidency and martial law from 1969, the 1970 election, Operation Searchlight and the 1971 war, his resignation, house arrest, and his death at Rawalpindi on 10 August 1980 with burial at Peshawar. Its Personal life section has a Religion subsection stating he was nominally a Shia Muslim."
