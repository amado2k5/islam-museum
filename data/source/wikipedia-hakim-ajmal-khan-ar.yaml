  ar: "مقالة ويكيبيديا العربية عن محمد أجمل خان؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في 11 شباط 1868 (17 شوال 1284 هـ)، ودراسته الطب اليوناني في أسرته، ومؤسساته الثلاث في دلهي، ودوره في تأسيس الرابطة الإسلامية وحركة الخلافة، ووفاته في 29 كانون الأول 1927 ودفنه قرب كلية الطبية بكارول باغ."
  en: "Arabic Wikipedia article on Mohammad Ajmal Khan; used for entity facts only. It gives his birth as 11 February 1868, paired by the article itself with 17 Shawwal 1284 AH, recounts his Unani training in his family, his three Delhi institutions, his part in founding the Muslim League and in the Khilafat movement, and his death on 29 December 1927 and burial near the Tibbia College at Karol Bagh."
