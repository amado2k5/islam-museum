label:
  ar: "المنح القدسية على الحكم العطائية لعبد الله بن حجازي الشرقاوي، اعتنى به أحمد فريد المزيدي ⁦(دار الكتب العلمية، بيروت)⁩"
  en: "'Abd Allah ibn Hijazi al-Sharqawi, al-Minah al-Qudsiyya 'ala al-Hikam al-'Ata'iyya, ed. Ahmad Farid al-Mazidi (Dar al-Kutub al-'Ilmiyya, Beirut)"
  ur: "عبد اللہ بن حجازی شرقاوی، المنح القدسیہ علی الحکم العطائیہ، اعتنا احمد فرید مزیدی ⁦(دار الکتب العلمیہ، بیروت)⁩"
summary:
  ar: "طبعة دار الكتب العلمية من شرح الشرقاوي ⁦(ت 1227هـ)⁩ على الحكم العطائية، «ومعه إفادات لكبار علماء الصوفية»، اعتنى به وعلق عليه أحمد فريد المزيدي، وفي آخرها أن النص أعدّ عن المطبوعة بمصر في ذي القعدة سنة 1282هـ."
  en: "The Dar al-Kutub al-'Ilmiyya printing of al-Sharqawi's (d. 1227 AH) commentary on al-Hikam al-'Ata'iyya, 'with notes by great Sufi scholars', edited and annotated by Ahmad Farid al-Mazidi; its end states the text was prepared from the edition printed in Egypt in Dhu al-Qa'da 1282 AH."
  ur: "شرقاوی ⁦(م 1227ھ)⁩ کی الحکم العطائیہ پر شرح کا دار الکتب العلمیہ کا ایڈیشن، «بڑے صوفی علما کی افادات کے ساتھ»، اعتنا و تعلیق احمد فرید مزیدی؛ اس کے آخر میں ہے کہ متن ذی القعدہ 1282ھ میں مصر میں چھپے نسخے سے تیار کیا گیا۔"
  es: "La impresión de Dar al-Kutub al-'Ilmiyya del comentario de al-Sharqawi (m. 1227 d. H.) sobre al-Hikam al-'Ata'iyya, 'con notas de grandes eruditos sufíes', editado y anotado por Ahmad Farid al-Mazidi; su final indica que el texto fue preparado a partir de la edición impresa en Egipto en Dhu al-Qa'da 1282 AH."
  fr: "L'impression Dar al-Kutub al-'Ilmiyya du commentaire d'al-Sharqawi (mort en 1227 AH) sur al-Hikam al-'Ata'iyya, « avec des notes de grands érudits soufis », édité et annoté par Ahmad Farid al-Mazidi; sa fin indique que le texte a été préparé à partir de l'édition imprimée en Égypte en Dhu al-Qa'da 1282 AH."
  tr: "Dar al-Kutub al-Ilmiyyah baskısı, \"önde gelen Sufi alimlerinin görüşleriyle\" Sharh al-Sharqawi'nin (ö. 1227 H) Sharh al-Sharqawi baskısı, \"önde gelen Sufi alimlerinin görüşleriyle\" dikkatle incelenmiş ve yorumlanmıştır. Sonunda, metnin Mısır'da 1282 Hicri yılında Dhu al-Qi'dah adlı basılı baskıdan hazırlandığı belirtilmektedir."
  id: "Edisi Dar al-Kutub al-Ilmiyyah dari Sharh al-Sharqawi (wafat 1227 H) tentang al-Hakam al-'Ata'iyyah, \"dengan wawasan dari ulama Sufi terkemuka,\" ditinjau dan dikomentari dengan cermat oleh Ahmad Farid al-Muzaidi. Di akhir, disebutkan bahwa teks tersebut disiapkan dari edisi cetak di Mesir pada Dhu al-Qi'dah pada tahun 1282 H."
