label:
  ar: "المنح القدسية على الحكم العطائية لعبد الله بن حجازي الشرقاوي، اعتنى به أحمد فريد المزيدي ⁦(دار الكتب العلمية، بيروت)⁩"
  en: "'Abd Allah ibn Hijazi al-Sharqawi, al-Minah al-Qudsiyya 'ala al-Hikam al-'Ata'iyya, ed. Ahmad Farid al-Mazidi (Dar al-Kutub al-'Ilmiyya, Beirut)"
  ur: "عبد اللہ بن حجازی شرقاوی، المنح القدسیہ علی الحکم العطائیہ، اعتنا احمد فرید مزیدی ⁦(دار الکتب العلمیہ، بیروت)⁩"
summary:
  ar: "طبعة دار الكتب العلمية من شرح الشرقاوي ⁦(ت 1227هـ)⁩ على الحكم العطائية، «ومعه إفادات لكبار علماء الصوفية»، اعتنى به وعلق عليه أحمد فريد المزيدي، وفي آخرها أن النص أعدّ عن المطبوعة بمصر في ذي القعدة سنة 1282هـ."
  en: "The Dar al-Kutub al-'Ilmiyya printing of al-Sharqawi's (d. 1227 AH) commentary on al-Hikam al-'Ata'iyya, 'with notes by great Sufi scholars', edited and annotated by Ahmad Farid al-Mazidi; its end states the text was prepared from the edition printed in Egypt in Dhu al-Qa'da 1282 AH."
  ur: "شرقاوی ⁦(م 1227ھ)⁩ کی الحکم العطائیہ پر شرح کا دار الکتب العلمیہ کا ایڈیشن، «بڑے صوفی علما کی افادات کے ساتھ»، اعتنا و تعلیق احمد فرید مزیدی؛ اس کے آخر میں ہے کہ متن ذی القعدہ 1282ھ میں مصر میں چھپے نسخے سے تیار کیا گیا۔"
