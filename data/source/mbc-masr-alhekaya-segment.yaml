summary:
  ar: "وصف قناة إم بي سي مصر الرسمي لإحدى حلقات «الحكاية» على يوتيوب، وفيه صياغة القناة نفسها لشكل فقرة سعد الدين الهلالي: يعرض آراء الفقهاء في القضية بأسلوبه السلس المبسط بينما يطرح عمرو أديب أسئلة المشاهد."
  en: "MBC Masr's own description of an Al-Hekaya episode on its YouTube channel, giving the channel's own wording for the format of Saad El-Din El-Hilali's segment: he presents the jurists' opinions on the issue in his smooth, simplified style while Amr Adib asks the questions a viewer might ask."
  es: "Descripción que MBC Masr hace de un episodio de Al-Hekaya en su canal de YouTube, donde se ofrece la propia descripción del formato del segmento de Saad El-Din El-Hilali: él presenta las opiniones de los juristas sobre el tema con su estilo fluido y simplificado, mientras que Amr Adib formula las preguntas que un espectador podría hacer."
  fr: "Voici la description que MBC Masr donne d'un épisode d'Al-Hekaya sur sa chaîne YouTube, reprenant les termes propres à la chaîne pour le format du segment de Saad El-Din El-Hilali: il présente les opinions des juristes sur la question dans son style fluide et simplifié, tandis qu'Amr Adib pose les questions qu'un téléspectateur pourrait se poser."
