summary:
  ar: "كتاب النكت في إعجاز القرآن لـالرماني، تحقيق محمد خلف الله ومحمد زغلول سلام، دار المعارف، مصر، الطبعة الثالثة؛ قُرئ في نسخة المكتبة الشاملة الموافقة للمطبوع في 21 نوفمبر 2026، في موضوع: وجوه الإعجاز وأقسام البلاغة."
  en: "al-Nukat fi I'jaz al-Qur'an (in Thalath Rasa'il fi I'jaz al-Qur'an) by al-Rummani, eds. Muhammad Khalaf Allah and Muhammad Zaghlul Sallam, Dar al-Ma'arif, Egypt, 3rd ed., 1976; read on 21 November 2026 in the Shamela library copy, whose numbering follows the printed edition, for the seven aspects of inimitability and the ten parts of eloquence (pp. 75-76)."
  ur: "النكت في إعجاز القرآن، مصنف: الرماني؛ 21 نومبر 2026 کو المکتبۃ الشاملہ کے نسخے میں، جس کے صفحات مطبوعہ کے مطابق ہیں، اس موضوع کے لیے پڑھی گئی: وجوه الإعجاز وأقسام البلاغة۔"
  fr: "al-Nukat fi I'jaz al-Qur'an (in Thalath Rasa'il fi I'jaz al-Qur'an) de al-Rummani, eds. Muhammad Khalaf Allah and Muhammad Zaghlul Sallam, Dar al-Ma'arif, Egypt, 3rd ed., 1976 ; lu le 21 novembre 2026 dans la copie de la bibliothèque Shamela, dont la pagination suit l'édition imprimée, pour : the seven aspects of inimitability and the ten parts of eloquence (pp. 75-76)."
  es: "al-Nukat fi I'jaz al-Qur'an (in Thalath Rasa'il fi I'jaz al-Qur'an) de al-Rummani, eds. Muhammad Khalaf Allah and Muhammad Zaghlul Sallam, Dar al-Ma'arif, Egypt, 3rd ed., 1976; leído el 21 de noviembre de 2026 en la copia de la biblioteca Shamela, cuya paginación sigue la edición impresa, para: the seven aspects of inimitability and the ten parts of eloquence (pp. 75-76)."
  tr: "Al-Rummani tarafından yazılmış, Muhammed Halafallah ve Muhammed Zagluul Selam tarafından derlenen Al-Nukat fi I'jaz al-Qur'an kitabı, Dar al-Ma'arif, Mısır, üçüncü baskı; 21 Kasım 2026'da basılı baskıya karşılık gelen Al-Maktaba Al-Shamela baskısında, Mucizevi Yönler ve Retorik Bölümleri konusuyla okunmuştur."
  id: "Buku Al-Nukat fi I'jaz al-Qur'an oleh Al-Rummani, disunting oleh Muhammad Khalafallah dan Muhammad Zaghloul Salam, Dar Al-Ma'arif, Mesir, edisi ketiga; dibaca dalam edisi Al-Maktaba Al-Shamela yang sesuai dengan edisi cetak tanggal 21 November 2026, dengan topik: Aspek Keajaiban dan Bagian Retorika."
