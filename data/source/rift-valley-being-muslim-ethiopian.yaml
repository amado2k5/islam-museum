reliability_note: "The report's publication page was read in full on 7 November 2026. The report was written for the Ethiopia Peace Research Facility, managed by the Rift Valley Institute and funded by the UK government. Its summary states that developments since the Muslim protests 'have also seen the emergence of a new category of actor, commonly referred to as the ustazes. Deeply pious, these young activists have managed to engage in debates on non-religious issues while still being considered good Muslims. In doing so, they have become influential religious role models.' That is a scene-level framing of a category, not an attestation about any individual. The report's own follower figure for Ahmedin Jebel — 'over 900,000 followers', in a report accessed 12 November 2022 as flagged by the wave harvest — was NOT re-read in the report's full text in this run and is in any case superseded by the 2026 platform reads; it is not carried in the museum's record. The publication page gives no birth date and names no school for Ahmedin Jebel himself. Read on 7 November 2026."
