  ar: "مقالة ويكيبيديا الإنجليزية عن كاظم قرة بكر؛ تُستخدم لوقائع الكيان فقط. تروي قيادته الجبهة الشرقية ومعاهدتي ألكسندروبول وقارص، وعنايته بأيتام الحرب، وتأسيسه أول حزب معارضة في الجمهورية ومحاكمته وبراءته، ورئاسته البرلمان حتى وفاته سنة 1948."
  en: "English Wikipedia article on Kâzım Karabekir; used for entity facts only. It recounts his Eastern Front command and the Alexandropol and Kars treaties, his care for war orphans, his founding of the Republic's first opposition party, his trial and acquittal, and his speakership until his death in 1948."
