summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كاظم قرة بكر؛ تُستخدم لوقائع الكيان فقط. تروي قيادته الجبهة الشرقية ومعاهدتي ألكسندروبول وقارص، وعنايته بأيتام الحرب، وتأسيسه أول حزب معارضة في الجمهورية ومحاكمته وبراءته، ورئاسته البرلمان حتى وفاته سنة 1948."
  en: "English Wikipedia article on Kâzım Karabekir; used for entity facts only. It recounts his Eastern Front command and the Alexandropol and Kars treaties, his care for war orphans, his founding of the Republic's first opposition party, his trial and acquittal, and his speakership until his death in 1948."
  es: "Artículo de la Wikipedia en inglés sobre Kâzım Karabekir; utilizado únicamente para datos sobre la persona. Relata su mando en el Frente Oriental y los tratados de Alexandropol y Kars, su atención a los huérfanos de guerra, la fundación del primer partido de oposición de la República, su juicio y absolución, y su presidencia del Parlamento hasta su muerte en 1948."
  fr: "Article de Wikipédia en anglais sur Kazim Karabekir; utilisé uniquement pour les informations sur l'entité. Il relate son commandement sur le front de l'Est et les traités d'Alexandropol et de Kars, son engagement auprès des orphelins de guerre, la fondation du premier parti d'opposition de la République, son procès et son acquittement, ainsi que son mandat de président de la Chambre des communes jusqu'à sa mort en 1948."
  ur: "کاظم کارابیکیر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی مشرقی محاذ کی کمان اور الیگزینڈروپول اور کارس معاہدوں، جنگی یتیموں کی دیکھ بھال، جمہوریہ کی پہلی اپوزیشن پارٹی کے قیام، اس کے مقدمے اور بری ہونے اور 1948 میں اس کی موت تک اس کی اسپیکر شپ کا ذکر ہے۔"
  tr: "Kazem Qara Bakr hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğu Cephesi'ndeki liderliğini, İskenandropol ve Kars Antlaşmalarını, savaş yetimlerine olan ilgisini, cumhuriyetteki ilk muhalefet partisini kurmasını, yargılanmasını ve beraat etmesini ve 1948'deki ölümüne kadar parlamento başkanlığını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Kazem Qara Bakr; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kepemimpinannya di Front Timur, Perjanjian Alexandropol dan Kars, perhatiannya terhadap anak yatim perang, pendirian partai oposisi pertama di republik, persidangan dan pembebasannya, serta kepresidenannya di parlemen hingga kematiannya pada tahun 1948."
