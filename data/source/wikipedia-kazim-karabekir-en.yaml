reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him as born in 1882 (year only) at Kocamustafapaşa, Istanbul, son of the general Mehmet Emin Pasha; staff officer and intelligence chief, Gallipoli and Kut service, commander of the XV Corps and then of the Eastern Front, victor of the 1920 campaign that took Sarıkamış, Kars and Alexandropol, signatory of the Treaties of Alexandropol (1920) and Kars (1921); founder and leader of the Progressive Republican Party in 1924, tried by an Independence Tribunal and acquitted after the party's closure; Speaker of the Grand National Assembly from 5 August 1946 until his death of a heart attack at Ankara on 26 January 1948, his remains later moved to the Turkish State Cemetery. It makes no statement of his religion: its infobox has no religion field, its text discusses only his political position on the timing of the caliphate's abolition, and its categories file him under 'Turkish Muslims'."
