summary:
  ar: "مقالة ويكيبيديا العربية عن محمد مصطفى المراغي؛ تُستخدم لوقائع الكيان فقط. مقالة موسّعة توثّق سيرته القضائية في السودان ومصر، ومشيخته للأزهر مرتين، وقوانينه في الأحوال الشخصية، وحادثة رفضه فتوى الملك فاروق، ووفاته ليلة 14 رمضان 1364 هـ / 22 أغسطس 1945. خانة الدين والمذهب في صندوقها فارغة."
  en: "Arabic Wikipedia article on Muhammad Mustafa al-Maraghi; used for entity facts only. A long article recording his judicial career in the Sudan and Egypt, his two terms as Sheikh al-Azhar, his personal-status legislation, the episode of his refusal of King Farouk's fatwa demand, and his death on the night of 14 Ramadan 1364 AH / 22 August 1945. Its infobox religion and madhhab fields are blank."
  es: "Artículo de Wikipedia en árabe sobre Muhammad Mustafa al-Maraghi; utilizado únicamente para datos sobre la persona. Un extenso artículo que documenta su trayectoria judicial en Sudán y Egipto, sus dos mandatos como Sheikh al-Azhar, su legislación sobre el estado civil, el episodio de su negativa a la fatwa del rey Farouk y su fallecimiento la noche del 14 de Ramadán de 1364 AH / 22 de agosto de 1945. Los campos de religión y madhhab de su ficha informativa están en blanco."
  fr: "Article de Wikipédia en arabe sur Muhammad Mustafa al-Maraghi; utilisé uniquement pour les informations le concernant. Cet article détaillé retrace sa carrière judiciaire au Soudan et en Égypte, ses deux mandats de cheikh d'al-Azhar, sa législation sur le statut personnel, son refus d'obtempérer à la fatwa du roi Farouk et sa mort dans la nuit du 14 Ramadan 1364 AH / 22 août 1945. Les champs « religion » et « madhhab » de son infobox sont vides."
  ur: "عربی ویکیپیڈیا مضمون محمد مصطفی المراثی پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ سوڈان اور مصر میں ان کے عدالتی کیریئر، شیخ الازہر کے طور پر ان کے دو عہدوں، ان کی ذاتی حیثیت سے متعلق قانون سازی، شاہ فاروق کے فتویٰ کے مطالبے سے انکار کا واقعہ، اور 14 رمضان 1364 ہجری / 22 اگست 1945 کی رات ان کی وفات کا ایک طویل مضمون۔"
  tr: "Muhammed Mustafa el-Maraghi hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Sudan ve Mısır'daki yargı kariyerini, El-Ezher'in iki Büyük İmamını, kişisel statü yasalarını, Kral Faruk'un fetvasının reddedilmesi olayını ve 14 Ramazan 1364 H / 22 Ağustos 1945 gecesi vefatını belgeleyen kapsamlı bir makale. 'Din ve Doktrin' bölümü kutusunda boştur."
  id: "Artikel Wikipedia Arab tentang Muhammad Mustafa Al-Maraghi; hanya digunakan untuk fakta entitas. Artikel luas yang mendokumentasikan karier yudisialnya di Sudan dan Mesir, dua Imam Agung Al-Azhar, undang-undang status pribadinya, insiden penolakan fatwa Raja Farouk, dan kematiannya pada malam 14 Ramadan 1364 AH / 22 Agustus 1945. Bagian 'Agama dan Doktrin' kosong di kotaknya."
