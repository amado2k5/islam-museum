  ar: "مقالة ويكيبيديا العربية عن محمد مصطفى المراغي؛ تُستخدم لوقائع الكيان فقط. مقالة موسّعة توثّق سيرته القضائية في السودان ومصر، ومشيخته للأزهر مرتين، وقوانينه في الأحوال الشخصية، وحادثة رفضه فتوى الملك فاروق، ووفاته ليلة 14 رمضان 1364 هـ / 22 أغسطس 1945. خانة الدين والمذهب في صندوقها فارغة."
  en: "Arabic Wikipedia article on Muhammad Mustafa al-Maraghi; used for entity facts only. A long article recording his judicial career in the Sudan and Egypt, his two terms as Sheikh al-Azhar, his personal-status legislation, the episode of his refusal of King Farouk's fatwa demand, and his death on the night of 14 Ramadan 1364 AH / 22 August 1945. Its infobox religion and madhhab fields are blank."
