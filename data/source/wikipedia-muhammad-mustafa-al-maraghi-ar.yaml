reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 24 October 2026; the article rests on published Arabic biographies and Azhar literature (al-Bahiyy 2009; Shakir). It gives: born 9 March 1881 (7 Rabi' al-Akhar 1298 AH) at El Maragha, Sohag, into a family of judges and scholars; memorised the Qur'an; studied at al-Azhar under Ali al-Salihi and Muhammad Abduh; 'alimiyya degree 26 May 1904, first of his cohort; qadi of Dongola then Khartoum; resigned 1907; Grand Qadi of the Sudan 1 August 1908 – 1919, insisting on appointment by the Khedive's decree and winning his judges freedom to choose among the schools' opinions; refused the protocol for receiving King George V at Suakin (1911); led the Egyptians of the Sudan in the 1919 demonstrations for Saad Zaghloul and was put on indefinite leave; the Cairo posts (head of sharia inspection 1919; president of the Grand Sharia Court 1920; of the Supreme Sharia Court 1923) and the July 1920 personal-status law separating the judges from the Hanafi-only rule and his 1929 marriage law; first appointment as Sheikh al-Azhar dated 28 May 1928 (the German article and the TDV entry give 22 May 1928 — the record notes both); the 1928 reform memorandum; resignation on 10 October 1929 (the lead rounds this to 'resigned in 1930', and the German article frames the departure as a royal dismissal); reappointment April 1935; Law 26 of 1936; the Fatwa Committee founded 11 August 1935 with its cross-madhhab composition (3 Hanafi, 3 Maliki, 3 Shafi'i, 2 Hanbali members); the illness at the Mowasat hospital in Alexandria, his refusal of King Farouk's demand for a fatwa barring the king's divorced wife from remarrying, and his death — the infobox gives the place as Alexandria — on the night of Wednesday 14 Ramadan 1364 (22 August 1945). His works list includes Bahth fi tarjamat al-Qur'an wa-ahkamiha (Cairo 1355/1936), al-Zamala al-insaniyya, Tafsir Juz' Tabarak and al-Awliya' wa'l-mahjurun. Its infobox gives his religion as Islam, generically, and names no madhhab for him — a silence the record's faith note relies on."
