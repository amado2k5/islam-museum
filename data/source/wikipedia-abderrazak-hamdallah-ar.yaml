summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الرزاق حمد الله؛ تُستخدم لوقائع الكيان فقط. تروي تكوينه في آسفي وانتقاله إلى أوليسوند النرويجي ومسيرته اللاحقة، وتلقبه بالجلاد والساطي. ولا تذكر ديانته ولا مذهبه."
  en: "Arabic Wikipedia article on Abderrazak Hamdallah; used for entity facts only. It recounts his formation at Safi, his move to Norway's Aalesund and his later career, and his nicknames al-Jallad and al-Sati. It states neither his religion nor any school."
  es: "Artículo de Wikipedia en árabe sobre Abderrazak Hamdallah; se utiliza únicamente para obtener información sobre la persona. Relata su formación en Safi, su traslado a Ålesund (Noruega) y su trayectoria profesional posterior, así como sus apodos al-Jallad y al-Sati. No menciona su religión ni la escuela a la que asistió."
  fr: "Article de Wikipédia en arabe consacré à Abderrazak Hamdallah; utilisé uniquement à titre informatif. Il relate sa formation à Safi, son installation à Ålesund en Norvège et la suite de sa carrière, ainsi que ses surnoms al-Jallad et al-Sati. Il ne mentionne ni sa religion ni son école religieuse."
  ur: "عبدالرزاق حمداللہ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں صفی میں اس کی تشکیل، ناروے کے ایلینڈ میں اس کی منتقلی اور اس کے بعد کے کیریئر، اور اس کے عرفی نام الجلاد اور الساتی کا ذکر ہے۔ اس میں نہ تو اس کا مذہب بتایا گیا ہے اور نہ ہی کوئی مکتب۔"
  tr: "Abdul Razzaq Hamdallah hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılır. Safi'deki oluşumunu, Norveç'in Olesund'una taşınmasını ve sonraki kariyerini anlatır ve onu cellat ve kurtarıcı olarak adlandırır. Dini veya mezhebinden bahsetmez."
  id: "Artikel Wikipedia berbahasa Arab tentang Abdul Razzaq Hamdallah hanya digunakan untuk fakta-fakta entitas tersebut. Artikel ini menceritakan pembentukannya di Safi, kepindahannya ke Olesund di Norwegia, dan kariernya di kemudian hari, serta menyebutnya sebagai algojo dan penyelamat. Artikel tersebut tidak menyebutkan agama atau sektenya."
