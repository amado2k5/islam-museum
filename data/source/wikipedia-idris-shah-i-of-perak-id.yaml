summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن إدريس شاه الأول سلطان فيرق؛ تُستخدم لوقائع الكيان فقط. تعطي تاريخيه ⁦(19 حزيران 1849 – 14 كانون الثاني 1916)⁩ ونذر مسجد العبودية ودفنه في مقبرة الغفران الملكية، ويكرر صندوق معلوماتها قيمة «الإسلام السنّي» من صندوق المقالة الإنجليزية. يخطئ متنها في عدّه السلطان التاسع عشر وفي زعم أنه خلف أبا زوجته عبد الله محمد شاه سنة 1887، خلافًا للمقالتين الإنجليزية والملايوية."
  en: "Indonesian Wikipedia article on Idris Shah I of Perak; used for entity facts only. It gives his dates (19 June 1849 – 14 January 1916), his Ubudiah Mosque vow and his burial at the Al-Ghufran royal cemetery; its infobox repeats the English infobox's Sunni Islam value. Its text errs in calling him the 19th sultan and in saying he succeeded a stepfather, Abdullah Muhammad Shah, in 1887, against the English and Malay articles."
  es: "Artículo de la Wikipedia en indonesio sobre Idris Shah I de Perak; utilizado únicamente para datos sobre la entidad. Indica sus fechas (19 de junio de 1849 - 14 de enero de 1916), su voto en la mezquita de Ubudiah y su entierro en el cementerio real de Al-Ghufran; su ficha informativa repite el valor de \"islam sunita\" de la ficha informativa en inglés. Su texto contiene errores al referirse a él como el 19.º sultán y al afirmar que sucedió a su padrastro, Abdullah Muhammad Shah, en 1887, en contra de los artículos en inglés y malayo."
  fr: "Article de Wikipédia indonésien sur Idris Shah Ier de Perak; utilisé uniquement à titre informatif. Il indique ses dates (19 juin 1849 – 14 janvier 1916), son vœu de construction de la mosquée Ubudiah et son inhumation au cimetière royal d’Al-Ghufran; son infobox reprend la valeur « Islam sunnite » de l’infobox anglaise. Son texte comporte des erreurs: il le désigne comme le 19e sultan et affirme qu’il a succédé à son beau-père, Abdullah Muhammad Shah, en 1887, contrairement aux articles anglais et malais."
  ur: "پیراک کے ادریس شاہ اول پر انڈونیشیائی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی تاریخیں ⁦(19 جون 1849 - 14 جنوری 1916)⁩، اس کی عبودیہ مسجد کی نذر اور الغفران شاہی قبرستان میں اس کی تدفین؛ اس کا infobox انگریزی infobox کی سنی اسلام کی قدر کو دہراتا ہے۔ اس کے متن میں اسے 19 واں سلطان کہنے میں اور انگریزی اور مالائی مضامین کے خلاف 1887 میں ایک سوتیلے باپ عبداللہ محمد شاہ کی جگہ لینے میں غلطی ہوئی ہے۔"
