summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن إدريس شاه الأول سلطان فيرق؛ تُستخدم لوقائع الكيان فقط. تعطي تاريخيه (19 حزيران 1849 – 14 كانون الثاني 1916) ونذر مسجد العبودية ودفنه في مقبرة الغفران الملكية، ويكرر صندوق معلوماتها قيمة «الإسلام السنّي» من صندوق المقالة الإنجليزية. يخطئ متنها في عدّه السلطان التاسع عشر وفي زعم أنه خلف أبا زوجته عبد الله محمد شاه سنة 1887، خلافًا للمقالتين الإنجليزية والملايوية."
  en: "Indonesian Wikipedia article on Idris Shah I of Perak; used for entity facts only. It gives his dates (19 June 1849 – 14 January 1916), his Ubudiah Mosque vow and his burial at the Al-Ghufran royal cemetery; its infobox repeats the English infobox's Sunni Islam value. Its text errs in calling him the 19th sultan and in saying he succeeded a stepfather, Abdullah Muhammad Shah, in 1887, against the English and Malay articles."
