summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبيد كرومي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته سنة 1905 ⁦(مع نزاع حول مكانها بين نياسالاند وقرية مويرا في زنجبار)⁩ وعمله بحارا، وثورة زنجبار سنة 1964 واتحادها مع تنجانيقا، وسنواته أول رئيس لزنجبار ونائبا لرئيس تنزانيا، واغتياله في مدينة زنجبار سنة 1972. لا يسمي متنها دينا ولا مدرسة له."
  en: "English Wikipedia article on Abeid Karume; used for entity facts only. It recounts his birth in 1905 (the place disputed between Nyasaland and the village of Mwera in Zanzibar), his work as a seaman, the 1964 Zanzibar Revolution and the union with Tanganyika, his years as first president of Zanzibar and vice-president of Tanzania, and his assassination in Zanzibar Town in 1972. Its text names no religion or school for him."
  es: "Artículo de la Wikipedia en inglés sobre Abeid Karume; utilizado únicamente para datos sobre la persona. Relata su nacimiento en 1905 (en el lugar en disputa entre Nyasalandia y la aldea de Mwera en Zanzíbar), su trabajo como marinero, la Revolución de Zanzíbar de 1964 y la unión con Tanganica, sus años como primer presidente de Zanzíbar y vicepresidente de Tanzania, y su asesinato en la ciudad de Zanzíbar en 1972. El texto no menciona ninguna religión ni escuela a la que perteneciera."
  fr: "L'article de Wikipédia en anglais consacré à Abeid Karume, utilisé uniquement à des fins d'information sur l'entité, relate sa naissance en 1905 (lieu contesté entre le Nyassaland et le village de Mwera à Zanzibar), son travail de marin, la révolution zanzibarite de 1964 et l'union avec le Tanganyika, ses années en tant que premier président de Zanzibar et vice-président de la Tanzanie, ainsi que son assassinat à Zanzibar en 1972. Le texte ne mentionne ni sa religion ni son appartenance à une école."
  ur: "Abid Karume پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 1905 میں ⁦(وہ جگہ جو زنزیبار کے نیاس لینڈ اور میویرا گاؤں کے درمیان متنازعہ ہے)⁩، ایک سمندری آدمی کے طور پر اس کا کام، 1964 کا زنزبار انقلاب اور تانگانیکا کے ساتھ اتحاد، زنجبار کے پہلے صدر اور تنزانیہ کے نائب صدر کے طور پر اس کے سال، اور اس کے قتل کا ذکر کیا گیا ہے۔ اس کے لئے اسکول."
