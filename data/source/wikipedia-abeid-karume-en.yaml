summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبيد كرومي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته سنة 1905 (مع نزاع حول مكانها بين نياسالاند وقرية مويرا في زنجبار) وعمله بحارا، وثورة زنجبار سنة 1964 واتحادها مع تنجانيقا، وسنواته أول رئيس لزنجبار ونائبا لرئيس تنزانيا، واغتياله في مدينة زنجبار سنة 1972. لا يسمي متنها دينا ولا مدرسة له."
  en: "English Wikipedia article on Abeid Karume; used for entity facts only. It recounts his birth in 1905 (the place disputed between Nyasaland and the village of Mwera in Zanzibar), his work as a seaman, the 1964 Zanzibar Revolution and the union with Tanganyika, his years as first president of Zanzibar and vice-president of Tanzania, and his assassination in Zanzibar Town in 1972. Its text names no religion or school for him."
