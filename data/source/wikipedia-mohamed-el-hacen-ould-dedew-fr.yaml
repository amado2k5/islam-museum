  ar: "مقالة ويكيبيديا الفرنسية عن محمد الحسن ولد الددو الشنقيطي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه عالم مسلم سني وخطيب، وتذكر ميلاده في بوتلميت في 31 أكتوبر 1963، وتأسيسه مركز تكوين العلماء سنة 2007 وإغلاق السلطات له سنة 2018، وسجنه مرارًا في عهد الرئيس معاوية ولد سيد أحمد الطايع."
  en: "French Wikipedia article on Mohamed El Hassan Ould Dedew Al-Shanqeeti; used for entity facts only. It describes him as a Sunni Muslim scholar and preacher, records his birth in Boutilimit on 31 October 1963, his founding of the Centre de Formation des Oulémas in 2007 and its closure by the authorities in 2018, and his repeated imprisonment under President Maaouiya Ould Sid'Ahmed Taya."
