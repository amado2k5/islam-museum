summary:
  ar: "مقالة ويكيبيديا الفرنسية عن محمد الحسن ولد الددو الشنقيطي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه عالم مسلم سني وخطيب، وتذكر ميلاده في بوتلميت في 31 أكتوبر 1963، وتأسيسه مركز تكوين العلماء سنة 2007 وإغلاق السلطات له سنة 2018، وسجنه مرارًا في عهد الرئيس معاوية ولد سيد أحمد الطايع."
  en: "French Wikipedia article on Mohamed El Hassan Ould Dedew Al-Shanqeeti; used for entity facts only. It describes him as a Sunni Muslim scholar and preacher, records his birth in Boutilimit on 31 October 1963, his founding of the Centre de Formation des Oulémas in 2007 and its closure by the authorities in 2018, and his repeated imprisonment under President Maaouiya Ould Sid'Ahmed Taya."
  es: "Artículo de la Wikipedia en francés sobre Mohamed El Hassan Ould Dedew Al-Shanqeeti; utilizado únicamente para datos sobre la persona. Lo describe como un erudito y predicador musulmán sunita, registra su nacimiento en Boutilimit el 31 de octubre de 1963, la fundación del Centre de Formation des Oulémas en 2007 y su cierre por las autoridades en 2018, así como sus repetidos encarcelamientos durante el mandato del presidente Maaouiya Ould Sid'Ahmed Taya."
  fr: "Article de Wikipédia en français sur Mohamed El Hassan Ould Dedew Al-Shanqeeti; utilisé uniquement à des fins d’information sur l’entité. Il le décrit comme un érudit et prédicateur musulman sunnite, mentionne sa naissance à Boutilimit le 31 octobre 1963, la fondation du Centre de Formation des Oulémas en 2007 et sa fermeture par les autorités en 2018, ainsi que ses emprisonnements répétés sous la présidence de Maaouiya Ould Sid’Ahmed Taya."
