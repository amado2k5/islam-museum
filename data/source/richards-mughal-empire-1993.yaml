summary:
  ar: "المجلد الخامس من سلسلة تاريخ الهند الجديد من جامعة كامبريدج، يعرض تاريخ الدولة المغولية من تأسيسها سنة 1526م إلى تفككها سنة 1720م، ويتناول التوسع الإقليمي والإيرادات والعملة والتنظيم العسكري والعلاقة بالإسلام."
  en: "Volume five of the New Cambridge History of India, presenting the history of the Mughal state from its founding in 1526 to its disintegration in 1720, and covering regional expansion, revenue, currency, military organization and the relationship with Islam."
  es: "El quinto volumen de la Nueva Historia de la India de Cambridge presenta la historia del estado mogol desde su fundación en 1526 hasta su desintegración en 1720, y abarca la expansión regional, los ingresos, la moneda, la organización militar y la relación con el Islam."
  fr: "Le cinquième volume de la Nouvelle Histoire de l'Inde de Cambridge présente l'histoire de l'État moghol depuis sa fondation en 1526 jusqu'à sa désintégration en 1720, et couvre l'expansion régionale, les revenus, la monnaie, l'organisation militaire et la relation avec l'Islam."
  ur: "نئی کیمبرج ہسٹری آف انڈیا کی پانچویں جلد، 1526 میں مغل ریاست کے قیام سے لے کر 1720 میں اس کے ٹوٹنے تک کی تاریخ پیش کرتی ہے، اور علاقائی توسیع، محصول، کرنسی، فوجی تنظیم اور اسلام کے ساتھ تعلقات کا احاطہ کرتی ہے۔"
