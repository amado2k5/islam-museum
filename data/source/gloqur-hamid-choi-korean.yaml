  ar: "تدوينة لميخايلو ياكوبوفيتش، 9 فبراير 2024، عن ترجمة حامد يونغ كيل تشوي لمعاني القرآن إلى الكورية: طبعتها الأولى 1988 بتمويل من شركة إماراتية، وطبعتها الثنائية اللغة عن مجمع الملك فهد سنة 1997، ومصادرها ومنهجها وانتشارها."
