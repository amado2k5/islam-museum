reliability_note: "Signed research post, read in full in Chrome on 6 November 2026. Used for Choi's birth (1949), education (Hankuk University BA 1975, Islamic University of Madinah, Omdurman Islamic University), posts (Myongji University, chairman of the Korea Muslim Federation), the start of the work in the early 1980s from Yusuf Ali's English, the 1988 first edition, the Muslim World League's correspondence (1991, 1996), the 1997 King Fahd Complex edition, the use of al-Sabuni's Safwat al-Tafasir, the term Hananim, the two earlier Korean translations (1971; Ahmadiyya 1988) and its present standing. His 2008 King Abdullah translation award is reported but not recorded as an honour (no award record)."
