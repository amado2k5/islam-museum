reliability_note: "Platform statistics aggregator, not a museum-verified fact: vidIQ compiles public YouTube data and stated, as of 15 November 2026, 5,380,000 subscribers, 976,980,050 total views and 5,401 videos; the channel started on 6 November 2014 and its channel country is set to Indonesia. Its most-viewed uploads, as listed on 15 November 2026, are murottal recitation compilations — two by the reciter Muzammil Hasballah (May 2023; 1.85M and 1.05M views in the listing) and one by Ibrohim Elhaq (November 2021; 1.02M views) — which shows the channel carrying other men's recitation, not an operator's own work. vidIQ's estimated earnings are modelled and are not used. The page names no owner, manager or operator for the channel. Read on 15 November 2026; the figures agree with the wave-200 harvest's vidIQ read of 12 November 2026 (5,380,000 subscribers, 976,607,323 views, 5,398 videos)."
