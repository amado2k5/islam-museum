summary:
  ar: "ترجمة بدر الدين الحسني في موقع «أودا باشام» لتراجم الشام؛ تُستخدم لوقائع الكيان فقط. تذكر دروسه في جامع السادات ثم الجامع الأموي تحت قبة النسر ثم جامع سنان باشا ودار الحديث الأشرفية، وتفرد قسمًا بعنوان «مذهبه» يقول نصًا إنه كان شافعي المذهب كأبيه، وتؤرخ وفاته في دمشق نهار الجمعة 27 ربيع الأول 1354هـ الموافق 28 حزيران 1935م، وتصف جنازته الحاشدة وحفل تأبينه."
  en: "Biographical entry (tarjama) on Badreddin al-Hasani at Odabasham, a Damascus biographies site; used for entity facts only. It recounts his teaching at the al-Sadat mosque, then at the Umayyad Mosque under the Dome of the Eagle, then at the Sinan Pasha mosque and the Ashrafiyya Dar al-Hadith; a section headed 'his school' states plainly that he was Shafi'i in school, like his father; and it dates his death at Damascus to Friday 27 Rabi' al-Awwal 1354 AH, corresponding to 28 June 1935, describing his crowded funeral and memorial."
title: "محدث الشام الكبير الإمام المجاهد المصلح المجدد العلامة الشيخ محمد بن يوسف بدر الدين الحسني"
