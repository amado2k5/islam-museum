summary:
  ar: "«كتاب اللؤلؤ: تاريخ ملكة الجواهر وفنّها وعلمها وصناعتها» للأحجار الكريمة الأمريكي جورج فريدريك كونز والمهندس تشارلز هيو ستيفنسون، منشور عام 1908، وهو موسوعة إنجليزية عن اللؤلؤ في التاريخ والطبيعة والتجارة، وفيها باب مستقل عن مصائد اللؤلؤ في الخليج الفارسي: مراكب البحرين والحسا والساحل، وطواقم الغواصين وشدّادي الحبال، وحجارة الغطس وملاقط الأنف وأصابع الجلد، ومواسم الغوص وتجّار الهند الذين يموّلونه."
  en: "George Frederick Kunz and Charles Hugh Stevenson's The Book of the Pearl: The History, Art, Science and Industry of the Queen of Gems (1908), a standard English monograph on the pearl in history, nature and trade, with a full chapter on the pearl fisheries of the Persian Gulf: the boats of Bahrein, El-Hasa and the Pirate Coast, the crews of divers and rope-tenders, the diving-stones, nostril-clasps and leather finger-stalls, the diving season and the Indian traders who financed it."
  ur: "جارج فریڈرک کنز اور چارلز ہیو سٹیونسن کی «کتاب اللؤلؤ» ⁦(۱۹۰۸ء)⁩ موتیوں کی تاریخ، فطرت اور تجارت پر ایک معیاری انگریزی تصنیف ہے جس میں خلیج فارس کی غوص کی ایک مستقل باب ہے: بحرین، الاحسا اور ساحل قزاقوں کی کشتیاں، غواصوں اور رسہ سنبھالنے والوں کے دستے، غوطے کے پتھر، ناک کی چمٹیاں اور چمڑے کی انگلی پوشیاں، غوص کا موسم اور اس کی مالی معاونت کرنے والے ہندوستانی سوداگر۔"
