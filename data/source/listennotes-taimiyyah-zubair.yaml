summary:
  ar: "صفحة لسن نوتس لبث محاضرات تيمية زبير على مسلم سنترال ⁦(٤٢١٠ حلقات منذ ٨ فبراير ٢٠١٢)⁩، وتنشر النص التعريفي بها: أنها ابنة الدكتور إدريس زبير والدكتورة فرحت هاشمي، أكملت في منتصف مراهقتها دراسة ترجمة القرآن وتفسيره، ودرست النحو والفقه والتفسير، وتدرّس دراسات القرآن والحديث في معهد الهدى، وهي أم لطفلين."
  en: "The Listen Notes page for Taimiyyah Zubair's Muslim Central lecture feed (4,210 episodes since 8 February 2012), publishing the biography carried with the feed: that she is the daughter of Dr Idrees Zubair and Dr Farhat Hashmi, completed her first study of the translation and tafseer of the Qur'an in her mid teens, studied Arabic grammar, fiqh and tafseer under her parents, teaches Qur'an and Hadith studies at the AlHuda Institute, and is the mother of two children."
  es: "La página Listen Notes del canal de conferencias Muslim Central de Taimiyyah Zubair (4210 episodios desde el 8 de febrero de 2012) publica la biografía que acompaña al canal: que es hija del Dr. Idrees Zubair y la Dra. Farhat Hashmi, completó su primer estudio de traducción y tafsir del Corán en su adolescencia, estudió gramática árabe, fiqh y tafsir con sus padres, enseña estudios del Corán y Hadith en el Instituto AlHuda y es madre de dos hijos."
  fr: "La page Notes d'écoute du flux de conférences Muslim Central de Taimiyyah Zubair (4 210 épisodes depuis le 8 février 2012), publiant la biographie fournie avec le flux: qu'elle est la fille du Dr Idrees Zubair et du Dr Farhat Hashmi, qu'elle a terminé sa première étude de la traduction et du tafsir du Coran au milieu de son adolescence, qu'elle a étudié la grammaire arabe, le fiqh et le tafsir auprès de ses parents, qu'elle enseigne les études coraniques et hadithiques à l'Institut AlHuda et qu'elle est la mère de deux enfants."
  ur: "تیمیہ زبیر کی مسلم سنٹرل لیکچر فیڈ ⁦(8 فروری 2012 سے اب تک 4,210 اقساط)⁩ کے لیے سننے کے نوٹس کا صفحہ، فیڈ کے ساتھ کی جانے والی سوانح عمری کو شائع کر رہا ہے: کہ وہ ڈاکٹر ادریس زبیر اور ڈاکٹر فرحت ہاشمی کی بیٹی ہیں، انہوں نے قرآن کے ترجمے اور تفسیر کا پہلا مطالعہ مکمل کیا۔ اپنے والدین کے ماتحت تفسیر، الہدا انسٹی ٹیوٹ میں قرآن اور حدیث کی تعلیم دیتی ہیں، اور دو بچوں کی ماں ہیں۔"
  tr: "Taymiyyah Zubair'in Muslim Central üzerine verdiği dersleri yayınlamak için bir ders notları sayfası (8 Şubat 2012'den bu yana 4210 bölüm) ve giriş metni yayımlamaktadır: Dr. Idris Zubair ve Dr. Farhat Hashemi'nin kızıdır. Orta ergenlik döneminde Kur'an çevirisi ve terfümiyesi eğitimini tamamlamış, dilbilgisi, fıkıh ve tefsir eğitimi almış ve Al-Huda Enstitüsü'nde Kuran ve Hadisler eğitimi almıştır. İki çocuk annesidir."
  id: "Halaman untuk Catatan Pelajaran untuk menyiarkan kuliah Taymiyyah Zubair tentang Muslim Central (4210 episode sejak 8 Februari 2012), dan menerbitkan teks pengantar: Dia adalah putri dari Dr. Idris Zubair dan Dr. Farhat Hashemi. Dia menyelesaikan studinya di masa remaja dalam terjemahan dan interpretasi Al-Qur'an, mempelajari tata bahasa, yurisprudensi, dan tafsir, serta mempelajari Al-Quran dan Hadis di Institut Al-Huda. Dia adalah ibu dari dua anak."
