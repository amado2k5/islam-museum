  ar: "صفحة لسن نوتس لبث محاضرات تيمية زبير على مسلم سنترال (٤٢١٠ حلقات منذ ٨ فبراير ٢٠١٢)، وتنشر النص التعريفي بها: أنها ابنة الدكتور إدريس زبير والدكتورة فرحت هاشمي، أكملت في منتصف مراهقتها دراسة ترجمة القرآن وتفسيره، ودرست النحو والفقه والتفسير، وتدرّس دراسات القرآن والحديث في معهد الهدى، وهي أم لطفلين."
  en: "The Listen Notes page for Taimiyyah Zubair's Muslim Central lecture feed (4,210 episodes since 8 February 2012), publishing the biography carried with the feed: that she is the daughter of Dr Idrees Zubair and Dr Farhat Hashmi, completed her first study of the translation and tafseer of the Qur'an in her mid teens, studied Arabic grammar, fiqh and tafseer under her parents, teaches Qur'an and Hadith studies at the AlHuda Institute, and is the mother of two children."
