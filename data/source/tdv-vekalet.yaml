summary:
  ar: "مدخل «وكالة» في موسوعة TDV الإسلامية: عقد الوكالة في الفقه بأركانه وشروطه، ووكالة الخصومة، وأجرة الوكيل وواجباته، وانتهاء الوكالة بالعزل والاستقالة والموت وفقد الأهلية."
  en: "The TDV İslâm Ansiklopedisi entry on vekâlet (legal agency): the agency contract in fiqh, its elements and conditions, litigation agency (dava vekâleti), the agent's fee and duties, and the termination of agency by dismissal, resignation, death and loss of capacity."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre vekâlet (agencia legal): el contrato de agencia en fiqh, sus elementos y condiciones, la agencia litigiosa (dava vekâleti), los honorarios y deberes del agente, y la terminación de la agencia por despido, renuncia, muerte y pérdida de capacidad."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur vekâlet (mandat légal): le contrat de mandat en fiqh, ses éléments et conditions, le mandat de litige (dava vekâleti), les honoraires et devoirs de l'agent, et la résiliation du mandat par licenciement, démission, décès et perte de capacité."
  ur: "TDV İslâm Ansiklopedisi entry on vekâlet ⁦(قانونی ایجنسی)⁩: فقہ میں ایجنسی کا معاہدہ، اس کے عناصر اور شرائط، قانونی چارہ جوئی کی ایجنسی (dava vekâleti)، ایجنٹ کی فیس اور فرائض، اور برخاستگی، استعفیٰ، موت اور صلاحیت میں کمی کے ذریعے ایجنسی کا خاتمہ۔"
  tr: "İslami TDV Ansiklopedisi'nde \"Ajans\" maddesi: Ajansın hukuk sözleşmesi, temel taşları ve koşulları, uyuşmazlık acentesi, temsilci ücreti ve görevleri ile işten çıkarma, istifa, ölüm ve iş gücü kaybı ile ajansın sona erdirilmesi."
  id: "Entri tentang \"Agensi\" dalam Ensiklopedia TDV Islam: Kontrak agen dalam yurisprudensi dengan pilar dan ketentuannya, lembaga sengketa, biaya dan tugas agen, serta penghentian kewenangan dengan pemecatan, pengunduran diri, kematian, dan kehilangan kapasitas."
