summary:
  ar: "مقالة ويكيبيديا العربية عن إبراهيم قالن ⁦(وُلد في إسطنبول سنة 1971 وأصله من أرضروم)⁩، رئيس الاستخبارات الوطنية التركية؛ تذكر دراسته في إسطنبول وماليزيا وواشنطن وترؤسه مؤسسة سيتا (2005–2009) وكتابه «الإسلام والغرب»."
  en: "Arabic Wikipedia article on İbrahim Kalın (born in Istanbul in 1971 to a family from Erzurum), director of Turkey's National Intelligence Organization; it records his studies in Istanbul, Malaysia and Washington, his founding chairmanship of SETA (2005-2009) and his book Islam and the West."
  es: "Artículo en árabe de la Wikipedia sobre İbrahim Kalın (nacido en Estambul en 1971 en el seno de una familia originaria de Erzurum), director de la Organización Nacional de Inteligencia de Turquía; en él se recogen sus estudios en Estambul, Malasia y Washington, su presidencia fundadora de SETA (2005-2009) y su libro Islam y Occidente."
  fr: "Article de Wikipédia en arabe sur İbrahim Kalın (né à Istanbul en 1971 dans une famille d'Erzurum), directeur de l'Organisation nationale du renseignement de Turquie; il relate ses études à Istanbul, en Malaisie et à Washington, sa présidence fondatrice du SETA (2005-2009) et son livre Islam et l'Occident."
  ur: "ابراہیم کالن پر عربی ویکیپیڈیا کا مضمون ⁦(1971 میں استنبول میں ایرزورم کے ایک خاندان میں پیدا ہوا)⁩، ترکی کی نیشنل انٹیلی جنس آرگنائزیشن کے ڈائریکٹر؛ اس میں استنبول، ملائیشیا اور واشنگٹن میں ان کی تعلیم، SETA (2005-2009) کی ان کی بانی چیئرمین شپ اور ان کی کتاب اسلام اینڈ دی ویسٹ کو ریکارڈ کیا گیا ہے۔"
