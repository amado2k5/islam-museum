  ar: "مقالة ويكيبيديا الإنجليزية «بوكار بيرو» عن بوكار بيرو باري، آخر ألمامي مستقل لإمامة فوتا جالون؛ تُستخدم لوقائع الكيان فقط. تروي استيلاءه على السلطة سنة 1890 وفترتي حكمه ومقاومته للمطالب الفرنسية ووفاته في معركة بوريداكا في 13 نوفمبر 1896."
  en: "English Wikipedia article 'Bokar Biro' on Bokar Biro Barry, the last independent Almami of the Imamate of Futa Jallon; used for entity facts only. It recounts his seizure of power in 1890, his two periods in office, his resistance to French demands, the treaty he pretended to sign, and his death at the battle of Porédaka on 13 November 1896."
