summary:
  ar: "مقالة ويكيبيديا الإنجليزية «بوكار بيرو» عن بوكار بيرو باري، آخر ألمامي مستقل لإمامة فوتا جالون؛ تُستخدم لوقائع الكيان فقط. تروي استيلاءه على السلطة سنة 1890 وفترتي حكمه ومقاومته للمطالب الفرنسية ووفاته في معركة بوريداكا في 13 نوفمبر 1896."
  en: "English Wikipedia article 'Bokar Biro' on Bokar Biro Barry, the last independent Almami of the Imamate of Futa Jallon; used for entity facts only. It recounts his seizure of power in 1890, his two periods in office, his resistance to French demands, the treaty he pretended to sign, and his death at the battle of Porédaka on 13 November 1896."
  es: "Artículo de la Wikipedia en inglés «Bokar Biro» sobre Bokar Biro Barry, el último Almami independiente del Imamato de Futa Jallon; se utiliza únicamente para datos sobre la entidad. Relata su toma del poder en 1890, sus dos períodos en el cargo, su resistencia a las demandas francesas, el tratado que fingió firmar y su muerte en la batalla de Porédaka el 13 de noviembre de 1896."
  fr: "L'article « Bokar Biro » de Wikipédia en anglais, consacré à Bokar Biro Barry, dernier Almami indépendant de l'Imamat du Fouta-Djalon, est utilisé uniquement à des fins d'information. Il relate sa prise de pouvoir en 1890, ses deux mandats, sa résistance aux exigences françaises, le traité qu'il feignit de signer et sa mort à la bataille de Porédaka le 13 novembre 1896."
  ur: "Bokar Biro Barry پر انگریزی ویکیپیڈیا مضمون 'Bokar Biro'، Futa Jallon کی امامت کے آخری آزاد عالم؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1890 میں اس کے اقتدار پر قبضے، اس کے دفتر میں دو ادوار، فرانسیسی مطالبات کے خلاف اس کی مزاحمت، اس معاہدے پر جس پر اس نے دستخط کرنے کا ڈرامہ کیا، اور 13 نومبر 1896 کو پوریڈاکا کی جنگ میں اس کی موت کا ذکر کیا ہے۔"
