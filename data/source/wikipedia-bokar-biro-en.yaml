reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives no birth date at all (its category files him under 'Year of birth unknown'), names him Bokar Biro Barry (or Boubacar Biro), of the Soriya faction, based at Timbo, and dates his death to 13 November 1896: his army was destroyed by French artillery at Porédaka, he escaped, was captured by soldiers of his enemy Sori Illili and decapitated (citing Barry 1998 and Roche 2011). It names no religion, school or order for him personally; Islam appears only as the frame of the theocratic imamate he ruled."
