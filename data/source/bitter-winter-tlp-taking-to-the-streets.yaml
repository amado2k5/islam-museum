label:
  en: "Bitter Winter series article 'Tehreek-e-Labbaik Pakistan. 4. Taking to the Streets' (Massimo Introvigne, 2021)"
summary:
  ar: "مقالة ماسيمو إنتروفينيي في «بيتر وينتر» (2021) عن تحريك لبيك باكستان، توثق رفض أشرف آصف جلالي اتفاق فيض آباد 2017 وانشقاقه واعتقاله سنة 2020."
  en: "Massimo Introvigne's 2021 Bitter Winter series article on Tehreek-e-Labbaik Pakistan. It records that in November 2017 the senior leader Ashraf Asif Jalali rejected the army-brokered agreement that ended the Faizabad sit-in, continued protests in Lahore without Khadim Hussain Rizvi's support, left Tehreek-e-Labbaik Pakistan with his own splinter organisation, and claimed he had been the main founder of TLYRA rather than Rizvi; and that Jalali was arrested in 2020 after being accused of blasphemy over remarks about Fatimah."
  es: "Artículo de Massimo Introvigne de la serie \"Invierno Amargo\" de 2021 sobre Tehreek-e-Labbaik Pakistan. En él se recoge que en noviembre de 2017, el líder Ashraf Asif Jalali rechazó el acuerdo negociado por el ejército que puso fin a la sentada de Faizabad, continuó las protestas en Lahore sin el apoyo de Khadim Hussain Rizvi, abandonó Tehreek-e-Labbaik Pakistan con su propia organización disidente y afirmó haber sido el principal fundador de TLYRA en lugar de Rizvi; y que Jalali fue arrestado en 2020 tras ser acusado de blasfemia por sus comentarios sobre Fátima."
  fr: "L'article de Massimo Introvigne, paru dans sa série « Hiver amer » de 2021 et consacré au Tehreek-e-Labbaik Pakistan, relate qu'en novembre 2017, le dirigeant Ashraf Asif Jalali a rejeté l'accord négocié par l'armée qui mettait fin au sit-in de Faizabad, a poursuivi les manifestations à Lahore sans le soutien de Khadim Hussain Rizvi, a quitté le Tehreek-e-Labbaik Pakistan pour fonder sa propre organisation dissidente et a affirmé en être le principal fondateur, à la place de Rizvi. Jalali a été arrêté en 2020, accusé de blasphème pour des propos tenus à propos de Fatimah."
  ur: "Massimo Introvigne کا تحریک لبیک پاکستان پر 2021 کی کڑوی سرمائی سیریز کا مضمون۔ اس میں درج ہے کہ نومبر 2017 میں سینئر رہنما اشرف آصف جلالی نے فیض آباد دھرنا ختم کرنے والے فوج کی دلالی کے معاہدے کو مسترد کر دیا، خادم حسین رضوی کی حمایت کے بغیر لاہور میں احتجاج جاری رکھا، تحریک لبیک پاکستان کو اپنی الگ الگ تنظیم کے ساتھ چھوڑ دیا، اور دعویٰ کیا کہ وہ رضوی کے مرکزی بانی ہیں۔ اور یہ کہ جلالی کو 2020 میں فاطمہ کے بارے میں تبصرے پر توہین مذہب کا الزام لگانے کے بعد گرفتار کیا گیا تھا۔"
