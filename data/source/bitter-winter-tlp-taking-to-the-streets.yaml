  en: "Massimo Introvigne's 2021 Bitter Winter series article on Tehreek-e-Labbaik Pakistan. It records that in November 2017 the senior leader Ashraf Asif Jalali rejected the army-brokered agreement that ended the Faizabad sit-in, continued protests in Lahore without Khadim Hussain Rizvi's support, left Tehreek-e-Labbaik Pakistan with his own splinter organisation, and claimed he had been the main founder of TLYRA rather than Rizvi; and that Jalali was arrested in 2020 after being accused of blasphemy over remarks about Fatimah."
