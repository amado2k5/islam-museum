reliability_note: "Actual official catalogue read: F1930.71, December1315/Ramadan715, probably Syria, opaque watercolor/ink/gold on paper30.8×21.9cm, calligrapher Farruq ibn Abd al-Latif, detached folio from dispersed copy, recto illustration/text, verso21 lines; Purchase—Charles Lang Freer Endowment. Modern institutional restriction banner not a CC0 claim. Actual Commons https://commons.wikimedia.org/wiki/File:Al-Jazari_-_A_Candle_Clock.jpg description/PD-Art/history read;6305×8750 JPEG downloaded outside git, visually inspected via1800px local derivative; actual960×1332 Commons thumbnail also retrieved. Rights rely expressly on faithful reproduction of historical2D public-domain work. Commons labels calligrapher as artist but institutional specific calligrapher role retained, painter not independently identified. Visible seated sword figure, cap/flame, candle/ball column, cords/weight/falcon/pedestal; not surviving hardware or author portrait.1315 copy date separate from documentary book-date disagreement, no manuscript collation claimed."
