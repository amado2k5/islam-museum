summary:
  ar: "مدخل «سوزلوك» في موسوعة TDV الإسلامية بأقسامه الثلاثة: إسماعيل دورموش في المعاجم العربية وتاريخ اللغويين من سيبويه والخليل إلى الفيروزآبادي وابن منظور، تحسين يزجي في المعاجم الفارسية، وأحمد طوبال أوغلو ومصطفى كاجالين في المعاجم التركية حتى كاموس المحيط وترجمته."
  en: "The TDV İslâm Ansiklopedisi entry on the dictionary in three sections: İsmail Durmuş on Arabic lexicography from the gharib works and Khalil's Kitab al-Ayn to al-Firuzabadi and Ibn Manzur, Tahsin Yazıcı on Persian dictionaries, and Ahmet Topaloğlu and Mustafa S. Kaçalin on Turkish dictionaries down to the printed Kamus translation."
  ur: "TDV اسلام دائرۃ المعارف کا مضمون «سوزلوک» تین حصوں پر مشتمل: اسماعیل دورموش نے عربی لغت نگاری پر غریب رسائی سے خلیل کی کتاب العین تا فیروزآبادی و ابن منظور، تحسین یازیجی نے فارسی لغتوں پر، اور احمد طوپال اوغلو و مصطفیٰ کاچالین نے ترکی لغتوں پر قاموس کے مطبوعہ ترجمے تک لکھا۔"
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el diccionario se divide en tres secciones: İsmail Durmuş sobre la lexicografía árabe, desde las obras gharib y el Kitab al-Ayn de Khalil hasta al-Firuzabadi e Ibn Manzur; Tahsin Yazıcı sobre los diccionarios persas; y Ahmet Topaloğlu y Mustafa S. Kaçalin sobre los diccionarios turcos, hasta la traducción impresa del Kamus."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur le dictionnaire est divisée en trois sections: İsmail Durmuş sur la lexicographie arabe, des ouvrages gharib et du Kitab al-Ayn de Khalil à al-Firuzabadi et Ibn Manzur, Tahsin Yazıcı sur les dictionnaires persans, et Ahmet Topaloğlu et Mustafa S. Kaçalin sur les dictionnaires turcs jusqu'à la traduction imprimée du Kamus."
  tr: "İslami TDV Ansiklopedisi'nde 'Suzlük' adı üç bölümde yer alır: İsmail Durmuş'un Arapça sözlüklerde ve Sibawayh ile Hebron'dan El-Fayruzabadi ve İbn Manzur'a kadar dilbilimcilerin tarihi, Farsça sözlüklerde Tahsin Yazji, Türkçe sözlüklerde Ahmed Tobaloğlu ve Mustafa Kagalin'in Kamus Al-Muheet ve biyografisine kadar."
  id: "Entri 'Suzlük' dalam Ensiklopedia Islam TDV dalam tiga bagiannya: Ismail Durmuş dalam kamus Arab dan sejarah ahli bahasa dari Sibawayh dan Hebron hingga Al-Fayruzabadi dan Ibn Manzur, Tahseen Yazji dalam kamus Persia, serta Ahmed Tobaloglu dan Mustafa Kagalin dalam kamus Turki hingga Kamus Al-Muheet dan biografinya."
