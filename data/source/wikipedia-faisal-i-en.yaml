summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيصل الأول بن الحسين ⁦(20 مايو 1885 – 8 سبتمبر 1933)⁩، ثالث أبناء الشريف حسين، وقائد الجيش الشمالي في الثورة العربية الكبرى، وملك المملكة العربية السورية من مارس إلى يوليو 1920 حتى طرده الفرنسيون بعد ميسلون، ثم ملك العراق من 23 أغسطس 1921 حتى وفاته بأزمة قلبية في برن؛ تروي اتفاقه مع وايزمان، وسياسة الوحدة بين السنة والشيعة، واستقلال العراق سنة 1932، وعلاقته بفئات العراق الدينية."
  en: "English Wikipedia article on Faisal I bin Hussein (20 May 1885 – 8 September 1933), third son of Sharif Hussein, commander of the Northern Army in the Great Arab Revolt, King of the Arab Kingdom of Syria from March to July 1920 until the French expelled him after Maysalun, then King of Iraq from 23 August 1921 until his death by heart attack at Bern; it recounts his agreement with Weizmann, his policy of unity between Sunni and Shia, Iraq's independence in 1932, and his relations with Iraq's religious communities."
  es: "Artículo de la Wikipedia en inglés sobre Faisal I bin Hussein (20 de mayo de 1885 - 8 de septiembre de 1933), tercer hijo de Sharif Hussein, comandante del Ejército del Norte en la Gran Revuelta Árabe, rey del Reino Árabe de Siria desde marzo hasta julio de 1920 hasta que los franceses lo expulsaron después de Maysalun, y luego rey de Irak desde el 23 de agosto de 1921 hasta su muerte por un ataque al corazón en Berna; relata su acuerdo con Weizmann, su política de unidad entre suníes y chiíes, la independencia de Irak en 1932 y sus relaciones con las comunidades religiosas de Irak."
  fr: "L'article de Wikipédia en anglais sur Faisal Ier bin Hussein (20 mai 1885 – 8 septembre 1933), troisième fils du chérif Hussein, commandant de l'armée du Nord lors de la Grande Révolte arabe, roi du royaume arabe de Syrie de mars à juillet 1920 jusqu'à son expulsion par les Français après Maysalun, puis roi d'Irak du 23 août 1921 jusqu'à sa mort d'une crise cardiaque à Berne; il relate son accord avec Weizmann, sa politique d'unité entre sunnites et chiites, l'indépendance de l'Irak en 1932 et ses relations avec les communautés religieuses irakiennes."
  ur: "فیصل اول بن حسین ⁦(20 مئی 1885 - 8 ستمبر 1933)⁩ پر انگریزی ویکیپیڈیا کا مضمون، شریف حسین کے تیسرے بیٹے، عظیم عرب بغاوت میں شمالی فوج کے کمانڈر، عرب بادشاہت شام کے بادشاہ مارچ سے جولائی 1920 تک جب تک کہ فرانسیسیوں نے اسے میسالون کے بعد بے دخل کر دیا، پھر 3 اگست 1920 کو عراق کے بادشاہ بیرسٹر کے ہارٹ اٹیک سے ان کی موت تک۔ اس میں ویزمین کے ساتھ اس کے معاہدے، سنی اور شیعہ کے درمیان اتحاد کی اس کی پالیسی، 1932 میں عراق کی آزادی، اور عراق کی مذہبی برادریوں کے ساتھ اس کے تعلقات کا ذکر ہے۔"
  tr: "Büyük Arap İsyanı'nda Kuzey Ordusu komutanı ve Mart'tan Temmuz 1920'ye kadar Suriye Krallığı Kralı olan Şerif Hüseyin'in üçüncü oğlu Faysal I bin El-Hüseyin (20 Mayıs 1885 – 8 Eylül 1933) hakkında İngilizce Wikipedia makalesi; 23 Ağustos 1921'den Bern'de kalp krizi geçirip ölümüne kadar Irak Kralı olan Maysaloun'un Fransızlar tarafından sürgün edilmesine kadar bu makale Weizmann ile yaptığı anlaşmayı, Sünniler ve Şiiler arasındaki birlik politikasını, 1932'de Irak'ın bağımsızlığını ve Irak'ın dini gruplarıyla ilişkisini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Faisal I bin Al-Hussein (20 Mei 1885 – 8 September 1933), putra ketiga Sharif Hussein, komandan Tentara Utara dalam Pemberontakan Arab Besar, dan Raja Kerajaan Suriah dari Maret hingga Juli 1920 hingga diusir oleh Prancis setelah Maysaloun, lalu Raja Irak dari 23 Agustus 1921 hingga kematiannya akibat serangan jantung di Bern; artikel ini menceritakan perjanjiannya dengan Weizmann, kebijakan persatuan antara Sunni dan Syiah, kemerdekaan Irak pada 1932, serta hubungannya dengan kelompok agama Irak."
