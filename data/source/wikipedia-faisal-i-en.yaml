reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full at revision 1381807247 on 25 October 2026. The article gives his birth as 20 May 1885 at Mecca and his death as 8 September 1933 at Bern; the Arabic article agrees on both Gregorian dates but puts the birth at Taif, and the Urdu article keeps Taif with the year 1883 — the disagreements are stated in the record, not merged. On faith the article names no school for Faisal: it describes his fostering of unity between Sunni and Shia Muslims, quotes al-Rihani that his faith 'reflected all Islamic dominations' [denominations], and remarks that Iraq's Shia had regarded his father as 'a Sunni Muslim from the Hejaz' — a perception of the father, in a passage about Iraqi politics, not an attestation of the son's school."
