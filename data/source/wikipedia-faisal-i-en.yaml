summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيصل الأول بن الحسين (20 مايو 1885 – 8 سبتمبر 1933)، ثالث أبناء الشريف حسين، وقائد الجيش الشمالي في الثورة العربية الكبرى، وملك المملكة العربية السورية من مارس إلى يوليو 1920 حتى طرده الفرنسيون بعد ميسلون، ثم ملك العراق من 23 أغسطس 1921 حتى وفاته بأزمة قلبية في برن؛ تروي اتفاقه مع وايزمان، وسياسة الوحدة بين السنة والشيعة، واستقلال العراق سنة 1932، وعلاقته بفئات العراق الدينية."
  en: "English Wikipedia article on Faisal I bin Hussein (20 May 1885 – 8 September 1933), third son of Sharif Hussein, commander of the Northern Army in the Great Arab Revolt, King of the Arab Kingdom of Syria from March to July 1920 until the French expelled him after Maysalun, then King of Iraq from 23 August 1921 until his death by heart attack at Bern; it recounts his agreement with Weizmann, his policy of unity between Sunni and Shia, Iraq's independence in 1932, and his relations with Iraq's religious communities."
