summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نواب بيغوم فايز النساء تشودراني (1834-1903)، زميندار هومن آباد بشيم غاون في كوميلا؛ تُستخدم لوقائع الكيان فقط. تذكر حملتها لتعليم النساء ولقب «نواب» الذي منحتها إياه الملكة فكتوريا سنة 1889 فصارت أول امرأة نواب في جنوب آسيا، وكتابها «روب جلال» (1876) والمدارس والمستشفيات التي أسستها."
  en: "English Wikipedia article on Nawab Begum Faizunnesa Choudhurani (1834–1903), zamindar of Homnabad-Pashchimgaon in Comilla; used for entity facts only. It records her campaign for female education, the title of Nawab awarded by Queen Victoria in 1889 making her the first female Nawab in South Asia, her book Rupjalal (1876) and the schools and hospitals she founded."
