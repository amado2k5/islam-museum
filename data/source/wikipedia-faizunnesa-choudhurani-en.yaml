summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نواب بيغوم فايز النساء تشودراني (1834-1903)، زميندار هومن آباد بشيم غاون في كوميلا؛ تُستخدم لوقائع الكيان فقط. تذكر حملتها لتعليم النساء ولقب «نواب» الذي منحتها إياه الملكة فكتوريا سنة 1889 فصارت أول امرأة نواب في جنوب آسيا، وكتابها «روب جلال» (1876) والمدارس والمستشفيات التي أسستها."
  en: "English Wikipedia article on Nawab Begum Faizunnesa Choudhurani (1834–1903), zamindar of Homnabad-Pashchimgaon in Comilla; used for entity facts only. It records her campaign for female education, the title of Nawab awarded by Queen Victoria in 1889 making her the first female Nawab in South Asia, her book Rupjalal (1876) and the schools and hospitals she founded."
  es: "Artículo de la Wikipedia en inglés sobre Nawab Begum Faizunnesa Choudhurani (1834-1903), zamindar de Homnabad-Pashchimgaon en Comilla; utilizado únicamente para datos sobre la entidad. Documenta su campaña a favor de la educación femenina, el título de Nawab que le otorgó la reina Victoria en 1889, convirtiéndola en la primera mujer Nawab del sur de Asia, su libro Rupjalal (1876) y las escuelas y hospitales que fundó."
  fr: "Article de Wikipédia en anglais sur la Nawab Begum Faizunnesa Choudhurani (1834-1903), zamindar d'Homnabad-Pashchimgaon à Comilla; utilisé uniquement à des fins d'information sur l'entité. Il relate son engagement en faveur de l'éducation des filles, le titre de Nawab qui lui fut conféré par la reine Victoria en 1889, faisant d'elle la première femme Nawab d'Asie du Sud, son ouvrage Rupjalal (1876) ainsi que les écoles et hôpitaux qu'elle fonda."
  ur: "انگلش ویکیپیڈیا مضمون نواب بیگم فیض النساء چودھری (1834-1903)، کومیلا میں ہوم آباد-پشچیمگاؤں کی زمیندار؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں خواتین کی تعلیم کے لیے ان کی مہم، 1889 میں ملکہ وکٹوریہ کی طرف سے نواب کا خطاب، اسے جنوبی ایشیا کی پہلی خاتون نواب، ان کی کتاب روپجلال (1876) اور اس نے قائم کیے گئے اسکولوں اور اسپتالوں کو ریکارڈ کیا ہے۔"
  tr: "İngilizce Wikipedia'daki makale, Comilla'daki Shem Gaon'da Humanabad Zaminderi Nawab Begum Faiz al-Nisa Choudhary (1834-1903) hakkında; yalnızca varlığın gerçekleri için kullanılmıştır. Kadınların eğitimi için yürüttüğü kampanyadan ve 1889'da Kraliçe Victoria tarafından kendisine verilen 'Nawab' unvanından bahseder; bu unvanla Güney Asya'daki ilk kadın Nawab olur; 'Rob Jalal' (1876) adlı kitabı ve kurduğu okullar ile hastaneler yer alır."
  id: "Artikel Wikipedia bahasa Inggris tentang Nawab Begum Faiz al-Nisa Choudhary (1834-1903), Zamindar Humanabad di Shem Gaon di Comilla; digunakan hanya untuk fakta entitas. Ia menyebutkan kampanyenya untuk pendidikan perempuan dan gelar 'Nawab' yang diberikan oleh Ratu Victoria pada tahun 1889, menjadikannya Nawab perempuan pertama di Asia Selatan, bukunya 'Rob Jalal' (1876), serta sekolah dan rumah sakit yang ia dirikan."
