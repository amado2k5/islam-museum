reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The article rests on the Banglapedia entry, on a Nawab Faizunnesa Government College history page, on Bangladeshi press pieces and on Md. Mahmudul Hasan's 2010 review of Fayeza S. Hasanat's translation of Rupjalal (BRILL, 2009). It gives only the years 1834 and 1903, her birth at Pashchimgaon village under Laksam in Tipperah district to Khan Bahadur Ahmed Ali Chowdhury and Arfannessa Chowdhurani, her self-education in her library with proficiency in Arabic, Persian, Sanskrit and Bengali, her marriage in 1860 to her distant cousin Muhammad Gazi as his second wife and their separation after two daughters, Arshadunnesa and Badrunnesa, her inheritance and zamindari on her mother's death in 1883 (the infobox gives her reign as 1883–1903, preceded by Ahmed Ali Chowdhury and succeeded by Mohamed Ali Chowdhury), the girls' high school she established at Comilla in 1873 — one of the earliest privately established girls' schools in the subcontinent, now Nawab Faizunnesa Government Girls' High School — the Pashchimgaon school later upgraded to Nawab Faizunnesa Degree College, the 1893 charitable dispensary and the Faizunnesa Zenana Hospital, her building of mosques and work on roads and ponds, her patronage of the periodicals Bandhab, Dhaka Prakash, Musalman Bandhu, Sudhakar and Islam Pracharak, her donation of her entire property before her death, and an extended discussion of Rupjalal (Dhaka, 1876) and of her place as the first significant modern Muslim woman writer of Bengal known to scholarship. It names no religion or school for her in its infobox or text."
