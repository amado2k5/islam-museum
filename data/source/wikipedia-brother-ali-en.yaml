reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and its content checked against the recorded revision. It gives Jason Douglas Newman, born 30 July 1977 in Madison, Wisconsin; his albinism; the family moves to Michigan and to Minneapolis in 1992; his albums from The Undisputed Truth (2007) to Satisfied Soul (2025); and his advocacy for Palestinian liberation and the professional backlash he attributes to it since October 2023. Its Religion section states that he converted to Islam at age 15 and followed Imam Warith Deen Mohammed, citing an NPR piece of 5 October 2009, and quotes him crediting KRS-One and The Autobiography of Malcolm X for the conversion, citing Huck magazine. Following a movement leader is not the naming of a madhhab, and the article names no school for him."
