  ar: "مقالة ويكيبيديا العربية الموجزة عن عبد الرب نشتر (1899–1958)؛ تعطي مولده في 13 حزيران 1899 ووفاته في 14 شباط 1958، وقيادته للرابطة الإسلامية من 1956 إلى 1958، دون أي ذكر لدينه أو مذهبه."
