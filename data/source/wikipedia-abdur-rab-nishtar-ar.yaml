  fr: "Le court article de Wikipédia en arabe sur Abdur Rab Nishtar (1899-1958); il indique sa naissance le 13 juin 1899 et sa mort le 14 février 1958 et son rôle de dirigeant de la Ligue musulmane de 1956 à 1958, sans aucune mention de sa religion ou de son école."
