summary:
  ar: "مقالة أكاديمية في مجلة «ميدل إيست جورنال» عن السلفية في إقليم كردستان العراق؛ سجّلت أن عبداللطيف أحمد أعاد سنة 2013 تسمية محطته إلى «ئامۆژگاری» من الكردية بمعنى النصيحة."
  en: "An academic article in the Middle East Journal on Salafism in Iraqi Kurdistan; it records that in 2013 Abdullatif Ahmad renamed his station Amozhgary TV, from the Kurdish amozhgari, 'advice'."
  ur: "عراقی کردستان میں سلفیت پر «مڈل ایسٹ جرنل» کا تعلیمی مضمون؛ اس کے مطابق عبداللطیف احمد نے 2013ء میں اپنے اسٹیشن کا نام «ئامۆژگاری» رکھا، جو کردی لفظ سے ہے جس کے معنی نصیحت کے ہیں۔"
  es: "Un artículo académico publicado en el Middle East Journal sobre el salafismo en el Kurdistán iraquí recoge que en 2013 Abdullatif Ahmad cambió el nombre de su emisora a Amozhgary TV, del kurdo amozhgari, que significa \"consejo\"."
  fr: "Un article universitaire du Middle East Journal sur le salafisme au Kurdistan irakien; il indique qu'en 2013, Abdullatif Ahmad a renommé sa chaîne Amozhgary TV, du kurde amozhgari, « conseil »."
  tr: "Middle East Journal'da Irak Kürdistan Bölgesi'ndeki Selefizm hakkında akademik bir makalede, Abdul Latif Ahmed'in 2013 yılında istasyonunun adını Kürtçe'den 'Amozhgari' (tavsiye anlamına gelir) olarak değiştirdiği kaydedilmiştir."
  id: "Sebuah artikel akademik di Middle East Journal tentang Salafisme di Wilayah Kurdistan, Irak mencatat bahwa Abdul Latif Ahmed mengganti nama stasiunnya pada tahun 2013 menjadi 'Amozhgari' dari bahasa Kurdi, yang berarti nasihat."
