label:
  ar: "المستدرك على الصحيحين للحاكم — مع تلخيص الذهبي وتتبع أوهام الحاكم لمقبل الوادعي، دار الحرمين، القاهرة 1417هـ/1997م، الجزء الأول"
  en: "al-Mustadrak 'ala al-Sahihayn of al-Hakim — with al-Dhahabi's critique and Muqbil al-Wadi'i's Tatabbu' awham al-Hakim, Dar al-Haramayn, Cairo 1417 AH/1997 CE, vol. 1"
summary:
  ar: "طبعة دار الحرمين للطباعة والنشر والتوزيع ⁦(القاهرة)⁩، الطبعة الأولى 1417هـ/1997م، الجزء الأول، متضمنة انتقادات الذهبي وبذيلها «تتبع أوهام الحاكم التي سكت عليها الذهبي» لأبي عبد الرحمن مقبل بن هادي الوادعي؛ في أولها مقدمة الوادعي ⁦(ص 5-38، مؤرخة 4 ربيع الأول 1414هـ)⁩ ثم خطبة الحاكم ⁦(ص 39-40)⁩ وكتاب الإيمان. وتنبّه حاشية الناشر إلى أن التحقيق قام على الطبعة السابقة لا على مخطوطة."
  en: "The Dar al-Haramayn (Cairo) edition, 1st ed. 1417 AH/1997 CE, vol. 1, incorporating al-Dhahabi's critiques and, beneath them, Tatabbu' awham al-Hakim allati sakata 'alayha al-Dhahabi by Abu 'Abd al-Rahman Muqbil ibn Hadi al-Wadi'i; it opens with al-Wadi'i's introduction (pp. 5-38, dated 4 Rabi' I 1414 AH), then al-Hakim's preface (pp. 39-40) and the Book of Faith. A publisher's note warns that the text was prepared from the earlier printing, not from a manuscript."
