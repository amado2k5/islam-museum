summary:
  ar: "مقالة ويكيبيديا الصينية عن أغوباي ⁦(يعقوب بك)⁩؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1820 في بسكند ووفاته في 30 مايو 1877 في كورلا، وحكمه إمارة جديشهر من 1865 إلى 1877، ودينه في صندوق المعلومات «الإسلام» بلا مذهب."
  en: "Chinese Wikipedia article on Agubai (Yakub Beg); used for entity facts only. It gives his birth in 1820 at Pskent and his death on 30 May 1877 at Korla, his rule of the Yettishar emirate from 1865 to 1877, and an infobox religion field of 'Islam' with no school named."
  es: "Artículo de la Wikipedia en chino sobre Agubai (Yakub Beg); utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1820 en Pskent y su fallecimiento el 30 de mayo de 1877 en Korla, su gobierno del emirato de Yettishar desde 1865 hasta 1877, y un campo de información sobre religión con la palabra \"Islam\" sin especificar ninguna escuela."
  fr: "Article de Wikipédia en chinois sur Agubai (Yakub Beg); utilisé uniquement pour les informations sur l'entité. Il indique sa naissance en 1820 à Pskent et sa mort le 30 mai 1877 à Korla, son règne sur l'émirat de Yettishar de 1865 à 1877, et une infobox sur la religion avec la mention « Islam » sans indication d'école."
  ur: "چینی ویکیپیڈیا مضمون پر اگوبی ⁦(یعقوب بیگ)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1820 میں Pskent میں ان کی پیدائش اور 30 مئی 1877 کو کورلا میں ان کی موت، 1865 سے 1877 تک یتیشار کی امارت پر ان کی حکمرانی، اور 'اسلام' کا ایک معلوماتی خانہ مذہب جس کا نام اسکول نہیں ہے۔"
  tr: "Agubai (Yakub Bey) hakkındaki Çin Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılır. 1820'de Beskand'da doğdu ve 30 Mayıs 1877'de Korla'da öldü. 1865'ten 1877'ye kadar Jadisehir Prensliği olarak hüküm sürdü ve bilgi kutusundaki dini 'İslam' olarak herhangi bir mezhep olmadan belirtilmiştir."
  id: "Artikel Wikipedia Tiongkok tentang Agubai (Yakub Bey); digunakan hanya untuk fakta entitas tersebut. Ia lahir pada tahun 1820 di Beskand dan meninggal pada 30 Mei 1877 di Korla. Ia memerintah sebagai Kerajaannya Jadisehir dari tahun 1865 hingga 1877, dan agamanya di infobox adalah 'Islam' tanpa sekte apapun."
