summary:
  ar: "مقالة ويكيبيديا العربية عن صبغت الله مجددي؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1926 ورئاسته أفغانستان بعد سقوط حكومة نجيب الله وتأسيسه جبهة التحرير الوطني ورئاسته اللويا جيرغا سنة 2003، وتصنّفه فئاتها في «صوفيون أفغان» و«مسلمون سنة أفغان» وتقابل ميلاده بسنتي 1343 و1344 هـ ووفاته بسنة 1440 هـ."
  en: "Arabic Wikipedia article on Sibghatullah Mojaddedi; a stub used for entity facts only. It gives his birth in 1926, his presidency after the fall of Najibullah's government, his founding of the National Liberation Front and his chairing of the 2003 loya jirga. Its categories file him under 'Afghan Sufis' and 'Afghan Sunni Muslims' (filings) and place his birth under 1925 with Hijri years 1343 and 1344, and his death under 1440 AH."
