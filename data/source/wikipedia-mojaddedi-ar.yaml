summary:
  ar: "مقالة ويكيبيديا العربية عن صبغت الله مجددي؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1926 ورئاسته أفغانستان بعد سقوط حكومة نجيب الله وتأسيسه جبهة التحرير الوطني ورئاسته اللويا جيرغا سنة 2003، وتصنّفه فئاتها في «صوفيون أفغان» و«مسلمون سنة أفغان» وتقابل ميلاده بسنتي 1343 و1344 هـ ووفاته بسنة 1440 هـ."
  en: "Arabic Wikipedia article on Sibghatullah Mojaddedi; a stub used for entity facts only. It gives his birth in 1926, his presidency after the fall of Najibullah's government, his founding of the National Liberation Front and his chairing of the 2003 loya jirga. Its categories file him under 'Afghan Sufis' and 'Afghan Sunni Muslims' (filings) and place his birth under 1925 with Hijri years 1343 and 1344, and his death under 1440 AH."
  es: "Artículo en árabe de la Wikipedia sobre Sibghatullah Mojaddedi; un esbozo utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1926, su presidencia tras la caída del gobierno de Najibullah, la fundación del Frente de Liberación Nacional y su presidencia de la Loya Jirga de 2003. Sus categorías lo clasifican como «sufíes afganos» y «musulmanes sunitas afganos» (archivos) y sitúa su nacimiento en 1925, en los años 1343 y 1344 de la Hégira, y su muerte en 1440 de la Hégira."
  fr: "Article Wikipédia en arabe sur Sibghatullah Mojaddedi; une ébauche servant uniquement à fournir des informations factuelles. On y trouve la date de sa naissance en 1926, sa présidence après la chute du gouvernement de Najibullah, la fondation du Front national de libération et sa présidence de la Loya Jirga de 2003. Les catégories le classent dans les sous-catégories « Soufis afghans » et « Musulmans sunnites afghans », et situent sa naissance en 1925 (années 1343 et 1344 de l’Hégire) et sa mort en 1440 de l’Hégire."
  ur: "صبغت اللہ مجددی پر عربی ویکیپیڈیا مضمون؛ ایک اسٹب جو صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ یہ 1926 میں ان کی پیدائش، نجیب اللہ کی حکومت کے خاتمے کے بعد ان کی صدارت، نیشنل لبریشن فرنٹ کے قیام اور 2003 کے لویہ جرگہ کی صدارت کے بارے میں بتاتا ہے۔ اس کے زمرے اسے 'افغان صوفی' اور 'افغان سنی مسلمان' ⁦(فائلنگ)⁩ کے تحت درج کرتے ہیں اور ان کی پیدائش 1925 ہجری سال 1343 اور 1344 کے تحت اور ان کی وفات 1440 ہجری کے تحت کرتے ہیں۔"
