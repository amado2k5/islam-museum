summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هاشم أملا (مواليد 1983)، لاعب الكريكت الجنوب أفريقي السابق؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في ديربان في 31 مارس 1983، وكونه ثاني أعلى مسجلي جنوب أفريقيا في الاختبار برصيد 9282 جولة وله 28 مئوية اختبار و27 مئوية ليوم واحد، وأول ثلاثمائة لجنوب أفريقيا (311 بلا خروج سنة 2012)، وكونه أول قائد اختبار دائم غير أبيض لجنوب أفريقيا سنة 2014، واعتزاله الدولي سنة 2019، وتصفه بأنه مسلم متدين من أصل هندي."
  en: "English Wikipedia article on Hashim Amla (born 1983), the former South African cricketer; used for entity facts only. It records his birth in Durban on 31 March 1983, his standing as South Africa's second-highest Test run-scorer with 9,282 runs, his 28 Test and 27 ODI centuries, South Africa's first triple century (311 not out in 2012), his appointment as South Africa's first permanent non-white Test captain in 2014, his international retirement in 2019, and describes him as a devout Muslim of Indian descent."
