summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم إسماعيل جندريكار؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 15 سبتمبر 1897 في غودهـرا، ومناصبه وزيرًا للتجارة سنة 1947 وحاكمًا للمقاطعة الشمالية الغربية ثم البنجاب الغربية، ورئاسته للوزراء من 17 أكتوبر إلى 11 ديسمبر 1957، ووفاته في لندن في 26 سبتمبر 1960 ودفنه في كراتشي. لا يحمل صندوق معلوماتها أي قيمة للديانة، ولا يذكر متنها ديانة له."
  en: "English Wikipedia article on Ibrahim Ismail Chundrigar; used for entity facts only. It gives his birth on 15 September 1897 at Godhra, his offices as trade minister in 1947 and governor of the North-West Frontier Province and then West Punjab, his prime ministership from 17 October to 11 December 1957, and his death at London on 26 September 1960 with burial at Karachi. Its infobox carries no religion value, and its text names no religion for him."
  es: "Artículo de la Wikipedia en inglés sobre Ibrahim Ismail Chundrigar; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 15 de septiembre de 1897 en Godhra, sus cargos como ministro de Comercio en 1947 y gobernador de la Provincia de la Frontera Noroeste y posteriormente del Punjab Occidental, su mandato como primer ministro del 17 de octubre al 11 de diciembre de 1957, y su fallecimiento en Londres el 26 de septiembre de 1960, con sepultura en Karachi. Su ficha informativa no incluye información sobre su religión, y el texto no menciona ninguna religión para él."
  fr: "Article de Wikipédia en anglais sur Ibrahim Ismail Chundrigar; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 15 septembre 1897 à Godhra, ses fonctions de ministre du Commerce en 1947 et de gouverneur de la Province de la Frontière-Nord-Ouest puis du Pendjab occidental, son mandat de Premier ministre du 17 octobre au 11 décembre 1957, et son décès à Londres le 26 septembre 1960, avec inhumation à Karachi. Son infobox ne mentionne aucune religion, et son texte ne précise pas son appartenance religieuse."
  ur: "ابراہیم اسماعیل چندریگر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 15 ستمبر 1897 کو گودھرا میں ان کی پیدائش، 1947 میں وزیر تجارت اور شمال مغربی سرحدی صوبے اور پھر مغربی پنجاب کے گورنر کے طور پر ان کے دفاتر، 17 اکتوبر سے 11 دسمبر 1957 تک ان کی وزارت عظمیٰ، اور 26 ستمبر 1960 کو لندن میں ان کی وفات کراچی میں تدفین کے ساتھ ہوئی۔ اس کے معلوماتی خانے میں مذہب کی کوئی اہمیت نہیں ہے، اور اس کے متن میں اس کے لیے کوئی مذہب نہیں ہے۔"
