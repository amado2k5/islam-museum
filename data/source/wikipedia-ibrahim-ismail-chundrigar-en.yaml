summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم إسماعيل جندريكار؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 15 سبتمبر 1897 في غودهـرا، ومناصبه وزيرًا للتجارة سنة 1947 وحاكمًا للمقاطعة الشمالية الغربية ثم البنجاب الغربية، ورئاسته للوزراء من 17 أكتوبر إلى 11 ديسمبر 1957، ووفاته في لندن في 26 سبتمبر 1960 ودفنه في كراتشي. لا يحمل صندوق معلوماتها أي قيمة للديانة، ولا يذكر متنها ديانة له."
  en: "English Wikipedia article on Ibrahim Ismail Chundrigar; used for entity facts only. It gives his birth on 15 September 1897 at Godhra, his offices as trade minister in 1947 and governor of the North-West Frontier Province and then West Punjab, his prime ministership from 17 October to 11 December 1957, and his death at London on 26 September 1960 with burial at Karachi. Its infobox carries no religion value, and its text names no religion for him."
