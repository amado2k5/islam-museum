  ar: "مقالة ويكيبيديا العربية عن بطرس بطرس غالي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في القاهرة سنة 1922 لأسرة مسيحية قبطية ذات شأن، ومسيرته الدبلوماسية والأكاديمية وأمانته العامة للأمم المتحدة، ووفاته سنة 2016 وجنازته التي قاد صلاتها البابا القبطي تواضروس الثاني. صندوق معلوماتها يعطي دينه «مسيحي أرثوذكسي»."
  en: "Arabic Wikipedia article on Boutros Boutros-Ghali; used for entity facts only. It recounts his birth in Cairo in 1922 to a prominent Coptic Christian family, his diplomatic and academic career and his tenure as UN Secretary-General, and his death in 2016 and the funeral whose prayer was led by the Coptic Pope Tawadros II. Its infobox gives his religion as 'Christian Orthodox'."
