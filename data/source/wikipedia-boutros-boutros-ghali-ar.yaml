summary:
  ar: "مقالة ويكيبيديا العربية عن بطرس بطرس غالي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في القاهرة سنة 1922 لأسرة مسيحية قبطية ذات شأن، ومسيرته الدبلوماسية والأكاديمية وأمانته العامة للأمم المتحدة، ووفاته سنة 2016 وجنازته التي قاد صلاتها البابا القبطي تواضروس الثاني. صندوق معلوماتها يعطي دينه «مسيحي أرثوذكسي»."
  en: "Arabic Wikipedia article on Boutros Boutros-Ghali; used for entity facts only. It recounts his birth in Cairo in 1922 to a prominent Coptic Christian family, his diplomatic and academic career and his tenure as UN Secretary-General, and his death in 2016 and the funeral whose prayer was led by the Coptic Pope Tawadros II. Its infobox gives his religion as 'Christian Orthodox'."
  es: "Artículo en árabe de la Wikipedia sobre Boutros Boutros-Ghali; utilizado únicamente para datos biográficos. Relata su nacimiento en El Cairo en 1922 en el seno de una destacada familia cristiana copta, su trayectoria diplomática y académica, su mandato como Secretario General de la ONU, su fallecimiento en 2016 y su funeral, cuya oración fue dirigida por el Papa copto Tawadros II. Su ficha informativa indica que su religión era «cristiana ortodoxa»."
  fr: "Article de Wikipédia en arabe consacré à Boutros Boutros-Ghali; utilisé uniquement à des fins d’information sur la personne. Il relate sa naissance au Caire en 1922 au sein d’une importante famille copte, sa carrière diplomatique et universitaire, son mandat de secrétaire général de l’ONU, ainsi que son décès en 2016 et ses funérailles, dont la prière a été dirigée par le pape copte Tawadros II. Son infobox indique qu’il était de confession orthodoxe."
  ur: "عربی ویکیپیڈیا مضمون بوتروس بوتروس غالی پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں قاہرہ میں 1922 میں ایک ممتاز قبطی عیسائی گھرانے میں ان کی پیدائش، ان کے سفارتی اور علمی کیریئر اور اقوام متحدہ کے سیکرٹری جنرل کے طور پر ان کی مدت، اور 2016 میں ان کی موت اور جنازے کا ذکر ہے جس کی نماز قبطی پوپ توادروس II نے پڑھائی تھی۔ اس کا انفو باکس اس کا مذہب 'کرسچن آرتھوڈوکس' کے طور پر دیتا ہے۔"
  tr: "Boutros Boutros Ghali hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1922'de Kahire'de önde gelen bir Kıpti Hristiyan ailesinde doğumunu, diplomatik ve akademik kariyerini, Birleşmiş Milletler Sekretaryası'nı, 2016'daki ölümünü ve Kıpti Papa II. Tawadros tarafından yönetilen cenazesini anlatır. Bilgi kutusunda dini 'Ortodoks Hristiyan' olarak belirtilir."
  id: "Artikel Wikipedia berbahasa Arab tentang Boutros Boutros Ghali; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Kairo pada tahun 1922 dari keluarga Kristen Koptik terkemuka, karier diplomatik dan akademisnya, Sekretariat Perserikatan Bangsa-Bangsa, kematiannya pada tahun 2016, dan pemakamannya yang dipimpin oleh Paus Koptik Tawadros II. Kotak infonya mencantumkan agamanya sebagai 'Kristen Ortodoks.'"
