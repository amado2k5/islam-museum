summary:
  ar: "صفحة «Maghrib» على موقع Encyclopaedia Britannica؛ قُرئت في 21 نوفمبر 2026، في موضوع: العبارة أن العرب بعد فتح القرنين السابع والثامن فرضوا الإسلام والعربية على أهله الأصليين بحسب لفظ الصفحة."
  en: "The page \"Maghrib\" on the Encyclopaedia Britannica website; read on 21 November 2026 for the statement that after the conquest of the 7th and 8th centuries the Arabs imposed Islam and Arabic on the native peoples of the Maghrib (the page's word)."
  ur: "Encyclopaedia Britannica کی ویب سائٹ پر صفحہ «Maghrib»؛ 21 نومبر 2026 کو پڑھا گیا، اس موضوع کے لیے: یہ بیان کہ ساتویں اور آٹھویں صدی کی فتح کے بعد عربوں نے مغرب میں اسلام اور عربی مسلط کی۔"
  fr: "La page « Maghrib » du site de l'Encyclopaedia Britannica ; lue le 21 novembre 2026 pour : l'affirmation qu'après la conquête des VIIe et VIIIe siècles les Arabes ont imposé l'islam et l'arabe aux peuples natifs du Maghreb (le mot de la page)."
  es: "La página «Maghrib» del sitio de la Encyclopaedia Britannica; leída el 21 de noviembre de 2026 para: la afirmación de que tras la conquista de los siglos VII y VIII los árabes impusieron el islam y el árabe a los pueblos nativos del Magreb (la palabra de la página)."
