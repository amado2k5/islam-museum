summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الماجد الدريابادي ⁦(16 آذار 1892 – 6 كانون الثاني 1977)⁩ من درياباد ببارابنكي؛ أوسع مقالاته الثلاث، تروي فترة عقلانيته ولاأدريته نحو 1909–1918 ورجوعه إلى الإسلام، وتذكر في متنها أن مذهبه كان الحنفية أتباعًا لأبي حنيفة وأنه فسّر تفسيره على المذهب الحنفي، وتذكر أنه أخذ البيعة عن أشرف علي التهانوي سنة 1928 ثم جددها عند حسين أحمد المدني؛ ويحمل صندوقها المدمج حقول السنة والحنفية والماتريدية."
  en: "The English Wikipedia article on Abdul Majid Daryabadi (16 March 1892 – 6 January 1977) of Daryabad, Barabanki; the fullest of the three, it recounts his rationalist and agnostic period of about 1909–1918 and his return to Islam, states in its text that as a follower of Abu Hanifa's teachings his mazhab was Hanafism and that he interpreted his tafsir in the Hanafi school, and states that he took the oath of allegiance from Ashraf Ali Thanwi in 1928 and later renewed it under Hussain Ahmad Madani; its embedded infobox carries Sunni, Hanafi and Maturidi fields."
  es: "El artículo de la Wikipedia en inglés sobre Abdul Majid Daryabadi (16 de marzo de 1892 - 6 de enero de 1977) de Daryabad, Barabanki; el más completo de los tres, relata su período racionalista y agnóstico de alrededor de 1909-1918 y su regreso al Islam, afirma en su texto que como seguidor de las enseñanzas de Abu Hanifa su mazhab era el hanafismo y que interpretó su tafsir en la escuela hanafi, y afirma que prestó juramento de lealtad a Ashraf Ali Thanwi en 1928 y posteriormente lo renovó bajo Hussain Ahmad Madani; su infobox incrustado contiene campos suníes, hanafíes y maturidíes."
  fr: "L'article de Wikipédia en anglais sur Abdul Majid Daryabadi (16 mars 1892 – 6 janvier 1977) de Daryabad, Barabanki, le plus complet des trois, relate sa période rationaliste et agnostique d'environ 1909 à 1918 et son retour à l'islam. Il précise qu'en tant que disciple des enseignements d'Abu Hanifa, son école de pensée était le hanafisme et qu'il interprétait son tafsir dans l'école hanafite. L'article indique également qu'il a prêté serment d'allégeance à Ashraf Ali Thanwi en 1928 et l'a renouvelé plus tard sous Hussain Ahmad Madani. Son infobox intégrée comporte les champs sunnite, hanafite et maturidite."
  ur: "دریا آباد، بارہ بنکی کے عبدالمجید دریابادی ⁦(16 مارچ 1892 - 6 جنوری 1977)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ تینوں میں سے مکمل، یہ ان کے عقلیت پسند اور 1909-1918 کے دور اور اسلام میں ان کی واپسی کا ذکر کرتا ہے، اس کے متن میں کہتا ہے کہ ابو حنیفہ کی تعلیمات کے پیروکار کے طور پر ان کا مذہب حنفیت تھا اور اس نے حنفی مکتب میں اپنی تفسیر کی تشریح کی، اور کہا کہ اس نے بعد میں علی سے بیعت لی۔ حسین احمد مدنی کے تحت اس کی تجدید کی۔ اس کے ایمبیڈڈ انفو باکس میں سنی، حنفی اور ماتریدی فیلڈز ہیں۔"
  tr: "Barabanki'deki Daryabad'dan Abdul Majid Al-Daryabadi (16 Mart 1892 – 6 Ocak 1977) hakkında İngilizce Wikipedia makalesi; üç makale arasında en geniş olanı, 1909–1918 yılları arasındaki akıl ve bağsızlık dönemini ve İslam'a dönüşünü anlatır. Okulunun Ebu Hanifa sonrası Hanefi olduğu ve yorumunu Hanefi okuluna göre yorumladığı belirtilir. Ayrıca 1928'de Ashraf Ali al-Tahanawi'den bağlılık yemini aldığı ve ardından Hüseyin Ahmed al-Madani ile yenilediği belirtilir; kutu içinde Sünnet, Hanefi ve Maturidi tarlaları yer alır."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdul Majid Al-Daryabadi (16 Maret 1892 – 6 Januari 1977) dari Daryabad di Barabanki; artikel terluas dari tiga artikel tersebut, menceritakan masa rasionalitas dan ketidakberdayaannya sekitar tahun 1909–1918 serta kembalinya ia ke Islam. Artikel tersebut menyebutkan bahwa sekolahnya adalah Hanafi mengikuti Abu Hanifa dan bahwa ia menafsirkan interpretasinya sesuai dengan mazhab Hanafi. Artikel tersebut juga menyebutkan bahwa ia mengambil sumpah setia dari Ashraf Ali al-Tahanawi pada tahun 1928 dan kemudian memperbaruinya dengan Hussein Ahmad al-Madani; kotak terintegrasinya berisi bidang Sunnah, Hanafi, dan Maturidi."
