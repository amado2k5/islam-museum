summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الماجد الدريابادي (16 آذار 1892 – 6 كانون الثاني 1977) من درياباد ببارابنكي؛ أوسع مقالاته الثلاث، تروي فترة عقلانيته ولاأدريته نحو 1909–1918 ورجوعه إلى الإسلام، وتذكر في متنها أن مذهبه كان الحنفية أتباعًا لأبي حنيفة وأنه فسّر تفسيره على المذهب الحنفي، وتذكر أنه أخذ البيعة عن أشرف علي التهانوي سنة 1928 ثم جددها عند حسين أحمد المدني؛ ويحمل صندوقها المدمج حقول السنة والحنفية والماتريدية."
  en: "The English Wikipedia article on Abdul Majid Daryabadi (16 March 1892 – 6 January 1977) of Daryabad, Barabanki; the fullest of the three, it recounts his rationalist and agnostic period of about 1909–1918 and his return to Islam, states in its text that as a follower of Abu Hanifa's teachings his mazhab was Hanafism and that he interpreted his tafsir in the Hanafi school, and states that he took the oath of allegiance from Ashraf Ali Thanwi in 1928 and later renewed it under Hussain Ahmad Madani; its embedded infobox carries Sunni, Hanafi and Maturidi fields."
