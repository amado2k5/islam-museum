summary:
  ar: "الطبعة الأولى (جيزة، دار هجر، 1419هـ/1999م) للجزء الأول من مسند أبي داود الطيالسي، بتحقيق الدكتور محمد بن عبد المحسن التركي بالتعاون مع مركز البحوث والدراسات العربية والإسلامية بدار هجر. يتضمن تقديم عبد السند حسن يمامة، ومقدمة المحقق في نسبة الكتاب إلى المؤلف وقيمته العلمية."
  en: "First edition (Cairo, Dar Hajar, 1419 AH / 1999 CE) of volume 1 of the Musnad of Abu Dawud al-Tayalisi, edited by Muhammad ibn Abd al-Muhsin al-Turki with the Centre for Arab and Islamic Research and Studies at Dar Hajar. It has a foreword by Abd al-Sanad Hasan Yamama and the editor's introduction on the attribution of the book and its value."
