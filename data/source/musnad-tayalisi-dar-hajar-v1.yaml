summary:
  ar: "الطبعة الأولى ⁦(جيزة، دار هجر، 1419هـ/1999م)⁩ للجزء الأول من مسند أبي داود الطيالسي، بتحقيق الدكتور محمد بن عبد المحسن التركي بالتعاون مع مركز البحوث والدراسات العربية والإسلامية بدار هجر. يتضمن تقديم عبد السند حسن يمامة، ومقدمة المحقق في نسبة الكتاب إلى المؤلف وقيمته العلمية."
  en: "First edition (Cairo, Dar Hajar, 1419 AH / 1999 CE) of volume 1 of the Musnad of Abu Dawud al-Tayalisi, edited by Muhammad ibn Abd al-Muhsin al-Turki with the Centre for Arab and Islamic Research and Studies at Dar Hajar. It has a foreword by Abd al-Sanad Hasan Yamama and the editor's introduction on the attribution of the book and its value."
  es: "Primera edición (El Cairo, Dar Hajar, 1419 AH / 1999 d. C.) del volumen 1 del Musnad de Abu Dawud al-Tayalisi, editado por Muhammad ibn Abd al-Muhsin al-Turki con el Centro de Estudios Árabes e Islámicos de Dar Hajar. Incluye un prólogo de Abd al-Sanad Hasan Yamama y una introducción del editor sobre la autoría y el valor del libro."
  fr: "Première édition (Le Caire, Dar Hajar, 1419 AH / 1999 CE) du tome 1 du Musnad d'Abu Dawud al-Tayalisi, édité par Muhammad ibn Abd al-Muhsin al-Turki avec le Centre de recherche et d'études arabes et islamiques de Dar Hajar. Préface d'Abd al-Sanad Hasan Yamama et introduction de l'éditeur sur l'attribution de l'ouvrage et son importance."
  ur: "ابوداؤد الطیالسی کی مسند کی جلد 1 کا پہلا ایڈیشن ⁦(قاہرہ، دار حجر، 1419ھ / 1999 عیسوی)⁩، جسے محمد بن عبد المحسن الترکی نے دار حجر میں مرکز برائے عرب و اسلامی تحقیق و مطالعات کے ساتھ مرتب کیا ہے۔ اس میں عبد السناد حسن یمامہ کا پیش لفظ ہے اور کتاب کے انتساب اور اس کی قیمت پر مدیر کا تعارف ہے۔"
  tr: "Musnad Abu Dawood al-Tayalisi'nin ilk bölümünün ilk baskısı (Giza, Dar Hajr, 1419 H/1999 CE), Dr. Muhammad ibn Abd al-Muhsin al-Turki tarafından Dar Hacr Arap ve İslami Araştırma ve Araştırmalar Merkezi ile iş birliği içinde düzenlenmiştir. Kitapta Abd al-Sanad Hasan Yamama'nın bir önsözü ve editörün kitabın yazara ve akademik değerine atfedilmesi üzerine bir giriş yer almaktadır."
  id: "Edisi pertama (Giza, Dar Hajr, 1419 H/1999 M) dari bagian pertama Musnad Abu Dawood al-Tayalisi, disunting oleh Dr. Muhammad ibn Abd al-Muhsin al-Turki bekerja sama dengan Pusat Penelitian dan Studi Arab dan Islam di Dar Hajr. Edisi ini memuat pengantar oleh Abd al-Sanad Hasan Yamama, serta pengantar editor tentang atribusi buku tersebut kepada penulis dan nilai ilmiahnya."
