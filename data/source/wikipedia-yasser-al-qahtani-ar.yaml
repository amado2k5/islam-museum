summary:
  ar: "مقالة ويكيبيديا العربية عن ياسر القحطاني؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 10 أكتوبر 1982، وتضع مكان ميلاده في صندوق المعلومات «الرياض» خلافًا للمقالة الإنجليزية وويكيبيانات ⁦(الخبر)⁩، وتذكر بدايته في دورات رمضانية للشباب."
  en: "Arabic Wikipedia article on Yasser Al-Qahtani; used for entity facts only. It gives his birth on 10 October 1982 but puts his birthplace in its infobox as Riyadh, against the English article and Wikidata (Khobar), and describes his youth football in Ramadan tournaments."
  es: "Artículo en árabe de la Wikipedia sobre Yasser Al-Qahtani; utilizado únicamente para datos sobre la persona. Indica que nació el 10 de octubre de 1982, pero en su ficha informativa señala Riad como su lugar de nacimiento, en contraposición al artículo en inglés y a Wikidata (Khobar), y describe su participación en torneos de fútbol juvenil durante el Ramadán."
  fr: "Article Wikipédia en arabe sur Yasser Al-Qahtani; utilisé uniquement pour les informations sur l’entité. Il indique sa date de naissance, le 10 octobre 1982, mais mentionne Riyad comme lieu de naissance dans son infobox, contrairement à l’article en anglais et à Wikidata (Khobar), et décrit sa participation à des tournois de football pendant le Ramadan."
