reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. It gives his birth on 10 October 1982; its infobox gives Riyadh as his birthplace, against the English article and Wikidata, which give Khobar — the discrepancy is recorded in the person record and Khobar is followed. Its only religion-adjacent detail is that his early football was with neighbourhood teams and in Ramadan tournaments at Al-Ettifaq and Al-Qadsiah and an Aramco tournament in Dhahran. It makes no statement of his religion or school."
