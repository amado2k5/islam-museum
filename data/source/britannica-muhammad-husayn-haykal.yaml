  ar: "صفحة «Muhammad Husayn Haykal» لدى Encyclopaedia Britannica. لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملخص بحثي قُدّم إلى المتحف ووافق المؤسس على استعماله في 21 نوفمبر 2026. يُستشهد بها في: رواية زينب لهيكل سنة 1913 وعدّها أول رواية عربية."
  en: "The page \"Muhammad Husayn Haykal\" (Encyclopaedia Britannica). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum and approved for use by the founder on 21 November 2026. Cited for: Haykal's Zaynab of 1913 and its standing as the first Arabic novel."
  ur: "صفحہ «Muhammad Husayn Haykal»، Encyclopaedia Britannica۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ عجائب گھر کو دیے گئے ایک تحقیقی خلاصے سے ہے جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ اس کے لیے دیا گیا: ہیکل کا ناول زینب (1913) اور اسے پہلا عربی ناول کہا جانا۔"
  fr: "La page « Muhammad Husayn Haykal » (Encyclopaedia Britannica). Le musée ne l'a pas ouverte lui-même : ce qu'on en sait vient d'une synthèse de recherche remise au musée et approuvée pour usage par le fondateur le 21 novembre 2026. Citée pour : Zaynab de Haykal (1913) et son statut de premier roman arabe."
  es: "La página «Muhammad Husayn Haykal» (Encyclopaedia Britannica). El museo no la abrió por sí mismo: lo que se sabe de ella procede de un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026. Citada para: Zaynab de Haykal (1913) y su consideración como primera novela árabe."
  tr: "\"Muhammad Hüseyin Haykal\" sayfası Encyclopaedia Britannica'da. Müze kendisi açmadı; içeriği, kurucunun 21 Kasım 2026'da kullanıma onay verdiği müzeye sunulan bir araştırma özetinden biliniyordu. Eser, Haikal'ın 1913 tarihli Zeyneb Romanı'nda atıf edilmektedir; bu roman ilk Arap romanı olarak kabul edilir."
  id: "Halaman \"Muhammad Husayn Haykal\" di Encyclopaedia Britannica. Museum tidak membukanya sendiri; isinya diketahui dari ringkasan penelitian yang dikirim ke museum, yang disetujui pendiri untuk digunakan pada 21 November 2026. Novel ini dikutip dalam: Novel Zainab karya Haikal tahun 1913, yang dianggap sebagai novel Arab pertama."
