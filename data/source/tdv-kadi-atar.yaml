reliability_note: "Read in full on 1 November 2026 in the web edition, first part of the entry. The Ottoman part is the separate entry by İlber Ortaylı (tdv-kadi-osmanli-ortayli). Facts are rewritten in the museum's own words and cited by printed page. The entry's bibliography names classical works (al-Mawardi, Ibn Abi al-Dam, Sadr al-Shahid, Ibn Kudama, Ibn Farhun) and E. Tyan's EI2 article 'Ḳāḍī' (vol. 4, pp. 373–374); those were not read for this record."
