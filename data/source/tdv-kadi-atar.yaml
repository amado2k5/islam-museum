summary:
  ar: "مدخل «كادي» في موسوعة TDV الإسلامية التركية بقلم فخر الدين أتار (المجلد 24، إسطنبول 2001، ص 66–69)، ويتناول معنى الكلمة، وتاريخ القضاء من عهد النبي إلى العباسيين، وشروط القاضي وتعيينه وعزله وأجره وواجباته ومساءلته."
  en: "The TDV İslâm Ansiklopedisi entry 'KADI' by Fahrettin Atar (vol. 24, Istanbul 2001, pp. 66–69). It covers the meaning of the word, the history of the office from the Prophet to the Abbasids, the qualifications of a qadi, appointment, dismissal, pay, duties and accountability."
