summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد علي جناح؛ تعطي ميلاده في 25 ديسمبر 1876 ووفاته في كراتشي في 11 سبتمبر 1948 ودينه في الصندوق «إسلام» فقط، ويقول متنها إنه من خلفية غوجاراتية خوجية إسماعيلية شيعية ثم اتخذ المسلك الإثنا عشري، وهو تأكيد أحادي الجانب يضعه متن المقالة الإنجليزية في سياق الجدل الموثق وأحكام المحاكم."
  en: "Urdu Wikipedia article on Muhammad Ali Jinnah; it gives his birth on 25 December 1876 and his death at Karachi on 11 September 1948, gives his religion in the infobox as 'Islam' only, and states in its text that he came from a Gujarati Khoja Ismaili Shia background and later adopted the Twelver school — a one-sided assertion that the English article's text places inside the documented contest and the court rulings."
  es: "Artículo de Wikipedia en urdu sobre Muhammad Ali Jinnah; indica que nació el 25 de diciembre de 1876 y murió en Karachi el 11 de septiembre de 1948, menciona su religión en el cuadro informativo solo como \"Islam\" y afirma en su texto que provenía de un entorno chiíta ismaelita Khoja de Gujarat y que más tarde adoptó la escuela duodecimana, una afirmación unilateral que el texto del artículo en inglés sitúa dentro del contexto documentado del conflicto y las sentencias judiciales."
  fr: "L'article de Wikipédia en ourdou sur Muhammad Ali Jinnah indique sa naissance le 25 décembre 1876 et sa mort à Karachi le 11 septembre 1948, mentionne uniquement l'islam dans l'infobox comme religion, et affirme dans son texte qu'il était issu d'une famille chiite ismaélienne khoja gujarati et qu'il a ensuite adopté l'école duodécimale — une affirmation unilatérale que le texte de l'article en anglais replace dans le contexte des faits documentés et des décisions de justice."
  ur: "محمد علی جناح پر اردو ویکیپیڈیا مضمون؛ یہ 25 دسمبر 1876 کو ان کی پیدائش اور 11 ستمبر 1948 کو کراچی میں ان کی موت واقع ہوئی، معلومات کے خانے میں ان کا مذہب صرف 'اسلام' کے طور پر بتاتا ہے، اور اس کے متن میں کہا گیا ہے کہ وہ گجراتی خواجہ اسماعیلی شیعہ پس منظر سے آیا تھا اور بعد میں ٹویلور اسکول کو اپنایا - ایک یکطرفہ دعویٰ ہے کہ انگریزی مضمون کا متن عدالت کے اندر موجود ہے اور دستاویزی طور پر درج ہے۔"
  tr: "Muhammed Ali Cinnah hakkında Urduca Vikipedi makalesi, onun 25 Aralık 1876'da doğduğunu ve 11 Eylül 1948'de Karaçi'de öldüğünü ve dini olarak yalnızca \"İslam\" olarak listelendiğini belirtir. Makale, onun Gujarati, Hoca, İsmaili, Şii kökenli olduğunu ve daha sonra belgelenmiş tartışma ve mahkeme kararları bağlamında İngilizce makalede yer alan tek taraflı bir iddia olan On İki Kişi yolunu benimsediğini belirtir."
  id: "Artikel Wikipedia Urdu tentang Muhammad Ali Jinnah menceritakan kelahirannya pada 25 Desember 1876, dan kematiannya di Karachi pada 11 September 1948, dengan agamanya hanya tercantum sebagai \"Islam.\" Artikel tersebut menyatakan bahwa ia berasal dari latar belakang Gujarati, Khoja, Ismaili, Syiah, dan kemudian mengadopsi jalur Dua Belas, yang merupakan pernyataan sepihak yang ditempatkan dalam artikel berbahasa Inggris dalam konteks debat terdokumentasi dan putusan pengadilan."
