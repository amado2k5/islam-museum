  ar: "مقالة ويكيبيديا الأردية عن محمد علي جناح؛ تعطي ميلاده في 25 ديسمبر 1876 ووفاته في كراتشي في 11 سبتمبر 1948 ودينه في الصندوق «إسلام» فقط، ويقول متنها إنه من خلفية غوجاراتية خوجية إسماعيلية شيعية ثم اتخذ المسلك الإثنا عشري، وهو تأكيد أحادي الجانب يضعه متن المقالة الإنجليزية في سياق الجدل الموثق وأحكام المحاكم."
  en: "Urdu Wikipedia article on Muhammad Ali Jinnah; it gives his birth on 25 December 1876 and his death at Karachi on 11 September 1948, gives his religion in the infobox as 'Islam' only, and states in its text that he came from a Gujarati Khoja Ismaili Shia background and later adopted the Twelver school — a one-sided assertion that the English article's text places inside the documented contest and the court rulings."
