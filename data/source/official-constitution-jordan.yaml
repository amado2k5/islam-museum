label:
  ar: "«دستور المملكة الأردنية الهاشمية»، صندوق استثمار أموال الضمان الاجتماعي في الأردن، ملف رسمي"
  en: "Constitution of the Hashemite Kingdom of Jordan (Social Security Investment Fund of Jordan)"
summary:
  ar: "«دستور المملكة الأردنية الهاشمية»، كما يُنشر عند: صندوق استثمار أموال الضمان الاجتماعي في الأردن، ملف رسمي. العنوان ونص المادة 2 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Constitution of the Hashemite Kingdom of Jordan, as published at: Social Security Investment Fund of Jordan. The address and the wording of Article 2 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Constitution of the Hashemite Kingdom of Jordan، جیسا کہ Social Security Investment Fund of Jordan پر شائع ہے۔ پتہ اور دفعہ 2 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Constitution of the Hashemite Kingdom of Jordan, tel que publié à : Social Security Investment Fund of Jordan. L'adresse et le texte (article 2) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Constitution of the Hashemite Kingdom of Jordan, tal como se publica en: Social Security Investment Fund of Jordan. La dirección y el texto (artículo 2) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Haşimi Ürdün Krallığı Anayasası,\" yayımlandığı şekliyle: Ürdün Sosyal Güvenlik Yatırım Fonu, resmi dosya. Madde 2'nin başlığı ve metni, müze tarafından sağlanan bir araştırma özetinden alınmıştır ve müze sayfayı açmamıştır; kurucu metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Konstitusi Kerajaan Hasyemit Yordania,\" sebagaimana diterbitkan di: Dana Investasi Jaminan Sosial di Yordania, berkas resmi. Judul dan teks Pasal 2 diambil dari ringkasan penelitian yang disediakan oleh museum, dan museum tidak membuka halaman tersebut; pendiri mengizinkan penggunaan teks tersebut sebagaimana dinyatakan pada 21 November 2026."
