summary:
  ar: "مدخل «سمسار» في موسوعة TDV الإسلامية: مصطلح فقهي لمن يبيع ويشتري باسمه لحساب موكّله بأجر، مع أحكام عقد السمسرة في المذاهب وأنواع السماسرة والنساء السماسرات."
  en: "The TDV İslâm Ansiklopedisi entry on the simsar: the fiqh term for one who buys and sells in his own name on his principal's account for a fee, with the school rulings on the brokerage contract, the kinds of brokers, and women brokers."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el simsar: el término fiqh para aquel que compra y vende en su propio nombre por cuenta de su principal a cambio de una comisión, con las resoluciones de la escuela sobre el contrato de corretaje, los tipos de corredores y las mujeres corredoras."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur le simsar: le terme fiqh désignant celui qui achète et vend en son propre nom pour le compte de son mandant moyennant des honoraires, avec les décisions des écoles sur le contrat de courtage, les types de courtiers et les femmes courtiers."
  ur: "سمسار پر TDV İslâm Ansiklopedisi اندراج: فقہی اصطلاح جو اپنے پرنسپل کے اکاؤنٹ پر فیس کے عوض اپنے نام سے خرید و فروخت کرتا ہے، بروکریج کنٹریکٹ پر اسکول کے احکام، دلالوں کی اقسام، اور خواتین بروکرز۔"
  tr: "TDV İslami Ansiklopedisi'nde 'Broker' kavramına giriş: Müşterisi adına ücret karşılığında kendi adına alım ve satım yapan kişi için verilen hukuki terim; ayrıca düşünce okulları, broker türleri ve kadın brokerlar arasındaki kararlarla birlikte."
  id: "Pengantar 'Broker' dalam Ensiklopedia Islam TDV: Istilah yurisprudensi untuk seseorang yang membeli dan menjual atas nama mereka atas nama kliennya dengan biaya, bersama dengan putusan tentang kontrak broker dalam aliran pemikiran, jenis broker, dan broker wanita."
