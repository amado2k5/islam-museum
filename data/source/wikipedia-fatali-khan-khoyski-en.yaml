summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فتح علي خان خويسكي؛ تُستخدم لوقائع الكيان فقط. تروي مولده في نوخا في 7 ديسمبر 1875 (25 نوفمبر بالتقويم القديم)، ودراسته الحقوق في موسكو، وعضويته في مجلس الدوما الثاني، ومناصبه في جمهورية أذربيجان الديمقراطية رئيسًا أول لمجلس الوزراء، واغتياله في تفليس في 19 يونيو 1920 ودفنه بجانب ميرزا فتح علي أخوندوف."
  en: "English Wikipedia article on Fatali Khan Khoyski; used for entity facts only. It recounts his birth at Nukha on 7 December 1875 (25 November Old Style), his Moscow law studies, his seat in the Second State Duma, his Azerbaijan Democratic Republic offices culminating in the first premiership, his assassination at Tiflis on 19 June 1920 and his burial beside Mirza Fatali Akhundov."
