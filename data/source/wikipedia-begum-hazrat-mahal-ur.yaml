reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. The article is an unreferenced narrative essay: it gives no birth or death day, and reports — from 'some English writers', and in the name of P. J. O. Taylor — that her birth name was Iftikhar-un-Nisa, where the English and Arabic articles give Muhammadi Khanum. It names no religion for her in its text or infobox; its category filing under 'Indian Shia personalities' is a filing, not an attestation, and is not counted."
