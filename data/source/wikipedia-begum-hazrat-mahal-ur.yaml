summary:
  ar: "مقالة ويكيبيديا الأردية «بیگم حضرت محل»؛ تُستخدم لوقائع الكيان فقط. تروي قيادتها لأوده في حرب الاستقلال سنة 1857، وتوليتها ابنها برجس قادر، ورفضها عفو البريطانيين، ولجوءها إلى نيبال ووفاتها هناك سنة 1879 ودفنها قرب جامع مسجد كاتماندو، وتذكر عن بعض الكتّاب الإنجليز أن اسمها كان افتخار النساء."
  en: "Urdu Wikipedia article 'Begum Hazrat Mahal'; used for entity facts only. It recounts her leadership of Awadh in the 1857 war of independence, her installation of her son Birjis Qadr, her refusal of British terms, her asylum in Nepal and her death there in 1879 and burial near the Jama Masjid in Kathmandu, and reports from some English writers that her name was Iftikhar-un-Nisa."
  es: "Artículo de Wikipedia en urdu titulado \"Begum Hazrat Mahal\"; utilizado únicamente para datos sobre la persona. Relata su liderazgo de Awadh en la guerra de independencia de 1857, la entronización de su hijo Birjis Qadr, su rechazo a las condiciones británicas, su asilo en Nepal y su muerte allí en 1879, siendo enterrado cerca de la Jama Masjid en Katmandú. Algunos escritores ingleses afirman que su nombre era Iftikhar-un-Nisa."
  fr: "L'article de Wikipédia en ourdou intitulé « Begum Hazrat Mahal » est utilisé uniquement à des fins d'information sur la personne. Il relate son rôle à la tête de l'Awadh pendant la guerre d'indépendance de 1857, l'intronisation de son fils Birjis Qadr, son refus des conditions britanniques, son asile au Népal et sa mort dans ce pays en 1879, ainsi que son inhumation près de la Jama Masjid à Katmandou. Il mentionne également, d'après certains auteurs anglais, que son nom était Iftikhar-un-Nisa."
  ur: "اردو ویکیپیڈیا مضمون 'بیگم حضرت محل'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1857 کی جنگ آزادی میں اودھ کی اس کی قیادت، اس کے بیٹے برجیس قدر کی تنصیب، اس کی برطانوی شرائط سے انکار، نیپال میں اس کی پناہ اور 1879 میں وہاں اس کی موت اور کھٹمنڈو کی جامع مسجد کے قریب اس کی تدفین، اور کچھ انگریز مصنفین کی رپورٹوں کے مطابق اس کا نام افتخار تھا۔"
  tr: "Urduca Vikipedi makalesi \"Begum Hazrat Mahal\" yalnızca varlığın gerçekleri için kullanılmıştır. Bu makale, 1857'de Bağımsızlık Savaşı'nda Oudh'un liderliğini, oğlu Burjis Qadir tarafından atanmasını, İngiliz affını reddetmesini, Nepal'deki sığınmasını, 1879'da orada ölmesini ve Katmandu Camii yakınlarında defnedilmesini anlatır. Bazı İngiliz yazarlar onun adının 'Kadınların Gururu' olduğunu belirtir."
  id: "Artikel Wikipedia Urdu \"Begum Hazrat Mahal\" hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kepemimpinannya di Oudh dalam Perang Kemerdekaan tahun 1857, pengangkatannya oleh putranya Burjis Qadir, penolakannya atas pengampunan Inggris, perlindungannya di Nepal, kematiannya di sana pada tahun 1879, dan pemakamannya di dekat Masjid Kathmandu. Beberapa penulis Inggris menyebutkan bahwa namanya adalah 'Kebanggaan Perempuan.'"
