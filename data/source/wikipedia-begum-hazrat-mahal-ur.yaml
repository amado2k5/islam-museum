summary:
  ar: "مقالة ويكيبيديا الأردية «بیگم حضرت محل»؛ تُستخدم لوقائع الكيان فقط. تروي قيادتها لأوده في حرب الاستقلال سنة 1857، وتوليتها ابنها برجس قادر، ورفضها عفو البريطانيين، ولجوءها إلى نيبال ووفاتها هناك سنة 1879 ودفنها قرب جامع مسجد كاتماندو، وتذكر عن بعض الكتّاب الإنجليز أن اسمها كان افتخار النساء."
  en: "Urdu Wikipedia article 'Begum Hazrat Mahal'; used for entity facts only. It recounts her leadership of Awadh in the 1857 war of independence, her installation of her son Birjis Qadr, her refusal of British terms, her asylum in Nepal and her death there in 1879 and burial near the Jama Masjid in Kathmandu, and reports from some English writers that her name was Iftikhar-un-Nisa."
