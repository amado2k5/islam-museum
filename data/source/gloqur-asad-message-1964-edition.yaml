language: en
reliability_note: "Signed research post by a historian of Qur'an translation on the Münster project's blog; read in full in Chrome on 6 November 2026. Used for the 1964 partial edition (Islamic Center of Geneva, printed by Mouton, The Hague), the shift between the 1964 and 1980 texts, the 1979 fatwa of the Permanent Committee reporting that the League's Consulting Board had prohibited printing and distribution, that the translation has never been printed in Saudi Arabia, and its translation into German, Spanish, Bosnian, Turkish and Swedish. The post itself marks the print-run destruction as a rumour; the record keeps it as such."
