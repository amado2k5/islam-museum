label: { en: "GloQur, Qur'an translation of the week #178: the first, 1964 edition of Asad's Message of the Qur'an (Mykhaylo Yakubovych, 2023)" }
summary:
  ar: "تدوينة لميخايلو ياكوبوفيتش في مشروع «القرآن العالمي» بجامعة مونستر، 3 نوفمبر 2023، عن الطبعة الأولى الجزئية من «رسالة القرآن» لمحمد أسد ⁦(السور التسع الأولى، جنيف 1964، المركز الإسلامي في جنيف برعاية رابطة العالم الإسلامي)⁩، والفروق بينها وبين الطبعة الكاملة سنة 1980، وموقف الرابطة واللجنة الدائمة للبحوث العلمية والإفتاء منها."
  en: "A post by Mykhaylo Yakubovych for the Global Qur'an project at the University of Münster, 3 November 2023, on the first, partial edition of Asad's The Message of the Qur'an (the first nine suras, Geneva 1964, Islamic Center of Geneva under the Muslim World League), how it differs from the complete 1980 edition, and the position the League and the Saudi Permanent Committee for Scholarly Research and Ifta took on it."
  ur: "جامعہ مونسٹر کے منصوبے «گلوبل قرآن» میں میخائیلو یاکوبووچ کی تحریر، 3 نومبر 2023، محمد اسد کی «دی میسج آف دی قرآن» کی پہلی جزوی اشاعت پر: پہلی نو سورتیں، جنیوا 1964، رابطہ عالم اسلامی کی سرپرستی میں اسلامک سینٹر جنیوا؛ 1980 کی مکمل اشاعت سے فرق، اور رابطہ اور سعودی دائمی کمیٹی برائے علمی تحقیق و افتا کا موقف۔"
title: "Qur'an translation of the week #178: The Message of the Qur'an by Muhammad Asad: the forgotten story of the first, 1964 edition"
