summary:
  ar: مقالة ويكيبيديا الإنجليزية عن البشير صفر؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس في 27 فبراير 1856 ووفاته فيها في 1 مارس 1917، وتخرجه في أول دفعة من المدرسة الصادقية ودراسته في باريس، ورئاسته مجلس الحبوس واستقالته منه سنة 1898، وتأسيسه جمعية الخلدونية وجريدة «الحاضرة» (1888)، وتأسيسه مع علي باش حانبة حركة الشباب التونسي سنة 1907. لا تذكر المقالة دينًا أو مذهبًا له.
  en: English Wikipedia article on Béchir Sfar; used for entity facts only. It gives his birth in Tunis on 27 February 1856 and his death there on 1 March 1917, his place in the first graduating class of Sadiki College and his studies in Paris, his heading of the Habous Council and 1898 resignation, his founding of the Khaldounia association and the newspaper El Hadhira (1888), and his co-founding with Ali Bach Hamba of the Young Tunisians in 1907. The article states no religion or school for him.
