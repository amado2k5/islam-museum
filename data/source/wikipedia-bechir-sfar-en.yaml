summary:
  ar: مقالة ويكيبيديا الإنجليزية عن البشير صفر؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس في 27 فبراير 1856 ووفاته فيها في 1 مارس 1917، وتخرجه في أول دفعة من المدرسة الصادقية ودراسته في باريس، ورئاسته مجلس الحبوس واستقالته منه سنة 1898، وتأسيسه جمعية الخلدونية وجريدة «الحاضرة» (1888)، وتأسيسه مع علي باش حانبة حركة الشباب التونسي سنة 1907. لا تذكر المقالة دينًا أو مذهبًا له.
  en: English Wikipedia article on Béchir Sfar; used for entity facts only. It gives his birth in Tunis on 27 February 1856 and his death there on 1 March 1917, his place in the first graduating class of Sadiki College and his studies in Paris, his heading of the Habous Council and 1898 resignation, his founding of the Khaldounia association and the newspaper El Hadhira (1888), and his co-founding with Ali Bach Hamba of the Young Tunisians in 1907. The article states no religion or school for him.
  es: "Artículo de la Wikipedia en inglés sobre Béchir Sfar; utilizado únicamente para datos biográficos. Indica su nacimiento en Túnez el 27 de febrero de 1856 y su fallecimiento allí el 1 de marzo de 1917, su pertenencia a la primera promoción del Colegio Sadiki y sus estudios en París, su presidencia del Consejo Habous y su dimisión en 1898, la fundación de la asociación Khaldounia y del periódico El Hadhira (1888), y su cofundación, junto con Ali Bach Hamba, de los Jóvenes Tunecinos en 1907. El artículo no menciona su religión ni su escuela."
  fr: "L'article de Wikipédia en anglais consacré à Béchir Sfar, utilisé uniquement pour les informations le concernant, indique sa naissance à Tunis le 27 février 1856 et son décès dans cette même ville le 1er mars 1917, son appartenance à la première promotion du Collège Sadiki et ses études à Paris, sa présidence du Conseil des Habous et sa démission en 1898, la fondation de l'association Khaldounia et du journal El Hadhira (1888), ainsi que la cofondation, avec Ali Bach Hamba, des Jeunes Tunisiens en 1907. L'article ne mentionne ni sa religion ni son école."
