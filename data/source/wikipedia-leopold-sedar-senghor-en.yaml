reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth at Joal on 9 October 1906 (with the baptismal-certificate discrepancy of 9 August 1906 recorded in the article), his schooling at the Ngasobil boarding school of the Fathers of the Holy Spirit and at a Dakar seminary before he was told the religious life was not for him, his agrégation of 1935, the coining of négritude, his war service and two years as a prisoner of war, his career as deputy, minister and mayor of Thiès, the Mali Federation, his presidency of Senegal (1960-1980) including the arrest of Mamadou Dia and the one-party period, his voluntary retirement in 1980, his election to the Académie française in 1983, his marriages, and his death at Verson on 20 December 2001. Read in full on 24 October 2026."
