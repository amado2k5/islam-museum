summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن المغني والملحن المصري حمزة نمرة؛ لوقائع الكيان فقط: مولده في 1980 بالدرعية، وتخرجه في تجارة الإسكندرية في 2003، وألبوماته الخمسة (2008–2020)، وتلحينه «يا نبي سلام عليك» لماهر زين، وبرنامجه «ريمكس» منذ 2016، ومنع أغانيه في الإذاعة المصرية في نوفمبر 2014، وعودته إلى مصر في سبتمبر 2022؛ وتستند إلى العربية والجزيرة وبي بي سي وعرب نيوز ومعهد الشرق الأوسط."
  en: "English Wikipedia article on the Egyptian singer-songwriter Hamza Namira; entity facts only: birth in 1980 at Diriyah, a commerce degree from Alexandria in 2003, his five albums (2008–2020), his composition of Maher Zain's 'Ya Nabi Salam Alayka', his 'Remix' series from 2016, the November 2014 ban of his songs on Egyptian state radio and his return to Egypt in September 2022; it cites Al Arabiya, Al Jazeera, the BBC, Arab News and the Middle East Institute."
  es: "Artículo de la Wikipedia en inglés sobre el cantautor egipcio Hamza Namira; solo datos sobre la persona: nacimiento en 1980 en Diriyah, licenciatura en comercio por la Universidad de Alejandría en 2003, sus cinco álbumes (2008-2020), su composición de «Ya Nabi Salam Alayka» de Maher Zain, su serie «Remix» de 2016, la prohibición de sus canciones en la radio estatal egipcia en noviembre de 2014 y su regreso a Egipto en septiembre de 2022; cita a Al Arabiya, Al Jazeera, la BBC, Arab News y el Middle East Institute."
  fr: "Article de Wikipédia en anglais sur le chanteur-compositeur égyptien Hamza Namira; informations uniquement sur l’individu: naissance en 1980 à Diriyah, diplôme de commerce obtenu à Alexandrie en 2003, cinq albums (2008-2020), composition de « Ya Nabi Salam Alayka » de Maher Zain, série de remixes de 2016, interdiction de ses chansons sur les ondes de la radio d’État égyptienne en novembre 2014 et retour en Égypte en septembre 2022; l’article cite Al Arabiya, Al Jazeera, la BBC, Arab News et le Middle East Institute."
  ur: "مصری گلوکار اور نغمہ نگار حمزہ نمیرہ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: 1980 میں دیریا میں پیدائش، 2003 میں اسکندریہ سے کامرس کی ڈگری، اس کے پانچ البمز (2008-2020)، مہر زین کی 'یا نبی سلام علیکا' کی اس کی کمپوزیشن، 2016 سے اس کی 'ریمکس' سیریز، نومبر 2014 میں مصری ریاست میں اس کے گانوں پر پابندی اور ستمبر20 میں مصری ریاست میں ان کے گانوں پر پابندی اس میں العربیہ، الجزیرہ، بی بی سی، عرب نیوز اور مڈل ایسٹ انسٹی ٹیوٹ کا حوالہ دیا گیا ہے۔"
  tr: "Mısırlı şarkıcı ve besteci Hamza Namra hakkında İngilizce Wikipedia makalesi; sadece varlık için gerçekler: 1980'de Diriyah'da doğması, 2003'te Alexandria Commerce'den mezuniyeti, beş albümü (2008–2020), Maher Zein'in \"Ya Nabi Salam Alaik\" bestesi, 2016'dan beri \"Remix\" programı, şarkılarının Kasım 2014'te Mısır radyosunda yasaklanması ve Eylül 2022'de Mısır'a dönüşü; Al Arabiya, Al Jazeera, BBC, Arab News ve Middle East Institute temel alınarak hazırlanmıştır."
  id: "Artikel Wikipedia bahasa Inggris tentang penyanyi dan komposer Mesir Hamza Namra; untuk entitas saja, fakta: kelahirannya pada tahun 1980 di Diriyah, kelulusannya di Alexandria Commerce pada tahun 2003, lima albumnya (2008–2020), komposisinya \"Ya Nabi Salam Alaik\" oleh Maher Zein, programnya \"Remix\" sejak 2016, lagu-lagunya dilarang di radio Mesir pada November 2014, dan kepulangannya ke Mesir pada September 2022; didasarkan pada Al Arabiya, Al Jazeera, BBC, Arab News, dan Middle East Institute."
