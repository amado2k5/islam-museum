summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن المغني والملحن المصري حمزة نمرة؛ لوقائع الكيان فقط: مولده في 1980 بالدرعية، وتخرجه في تجارة الإسكندرية في 2003، وألبوماته الخمسة (2008–2020)، وتلحينه «يا نبي سلام عليك» لماهر زين، وبرنامجه «ريمكس» منذ 2016، ومنع أغانيه في الإذاعة المصرية في نوفمبر 2014، وعودته إلى مصر في سبتمبر 2022؛ وتستند إلى العربية والجزيرة وبي بي سي وعرب نيوز ومعهد الشرق الأوسط."
  en: "English Wikipedia article on the Egyptian singer-songwriter Hamza Namira; entity facts only: birth in 1980 at Diriyah, a commerce degree from Alexandria in 2003, his five albums (2008–2020), his composition of Maher Zain's 'Ya Nabi Salam Alayka', his 'Remix' series from 2016, the November 2014 ban of his songs on Egyptian state radio and his return to Egypt in September 2022; it cites Al Arabiya, Al Jazeera, the BBC, Arab News and the Middle East Institute."
