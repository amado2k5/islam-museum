summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0625\u0646\u062c\u0644\u064a\u0632\u064a\u0629 \u0639\u0646 \u0627\u0644\u0645\u063a\u0646\u064a \u0648\u0627\u0644\u0645\u0644\u062d\u0646 \u0627\u0644\u0645\u0635\u0631\u064a \u062d\u0645\u0632\u0629 \u0646\u0645\u0631\u0629\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a 1980 \u0628\u0627\u0644\u062f\u0631\u0639\u064a\u0629\u060c \u0648\u062a\u062e\u0631\u062c\u0647 \u0641\u064a \u062a\u062c\u0627\u0631\u0629 \u0627\u0644\u0625\u0633\u0643\u0646\u062f\u0631\u064a\u0629 \u0641\u064a 2003\u060c \u0648\u0623\u0644\u0628\u0648\u0645\u0627\u062a\u0647 \u0627\u0644\u062e\u0645\u0633\u0629 (2008\u20132020)\u060c \u0648\u062a\u0644\u062d\u064a\u0646\u0647 \u00ab\u064a\u0627 \u0646\u0628\u064a \u0633\u0644\u0627\u0645 \u0639\u0644\u064a\u0643\u00bb \u0644\u0645\u0627\u0647\u0631 \u0632\u064a\u0646\u060c \u0648\u0628\u0631\u0646\u0627\u0645\u062c\u0647 \u00ab\u0631\u064a\u0645\u0643\u0633\u00bb \u0645\u0646\u0630 2016\u060c \u0648\u0645\u0646\u0639 \u0623\u063a\u0627\u0646\u064a\u0647 \u0641\u064a \u0627\u0644\u0625\u0630\u0627\u0639\u0629 \u0627\u0644\u0645\u0635\u0631\u064a\u0629 \u0641\u064a \u0646\u0648\u0641\u0645\u0628\u0631 2014\u060c \u0648\u0639\u0648\u062f\u062a\u0647 \u0625\u0644\u0649 \u0645\u0635\u0631 \u0641\u064a \u0633\u0628\u062a\u0645\u0628\u0631 2022\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0648\u0627\u0644\u062c\u0632\u064a\u0631\u0629 \u0648\u0628\u064a \u0628\u064a \u0633\u064a \u0648\u0639\u0631\u0628 \u0646\u064a\u0648\u0632 \u0648\u0645\u0639\u0647\u062f \u0627\u0644\u0634\u0631\u0642 \u0627\u0644\u0623\u0648\u0633\u0637."
  en: "English Wikipedia article on the Egyptian singer-songwriter Hamza Namira; entity facts only: birth in 1980 at Diriyah, a commerce degree from Alexandria in 2003, his five albums (2008\u20132020), his composition of Maher Zain's 'Ya Nabi Salam Alayka', his 'Remix' series from 2016, the November 2014 ban of his songs on Egyptian state radio and his return to Egypt in September 2022; it cites Al Arabiya, Al Jazeera, the BBC, Arab News and the Middle East Institute."
