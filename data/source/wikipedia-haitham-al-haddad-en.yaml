summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هيثم الحداد: عالم مسلم بريطاني من أصل فلسطيني ومقدم تلفزيوني، نال الدكتوراه من SOAS بأطروحة قُدمت سنة 2010 في فقه الأقليات المسلمة السنية، ودرس في المدينة المنورة وحصل على شهادة هندسة مدنية في السودان، وهو رئيس مؤسسة MRDF ومستشارها التشغيلي وأمينها ويجلس في المجلس الاستشاري للمجلس الشرعي الإسلامي؛ ويذكر صندوق معلوماتها مذهبه «سني» دون مصدر مستقل."
  en: "The English Wikipedia article on Haitham al-Haddad: a British Muslim scholar of Palestinian origin and television presenter; PhD at SOAS with a thesis submitted in 2010 on Sunni Muslim minority fiqh; studied in Medina and took a civil engineering degree in Sudan; chair, operations advisor and trustee of the Muslim Research and Development Foundation and an advisor to the Islamic Sharia Council. Its infobox gives his denomination as Sunni, without a separate reference."
  es: "El artículo de Wikipedia en inglés sobre Haitham al-Haddad: un erudito musulmán británico de origen palestino y presentador de televisión; doctorado por la SOAS con una tesis presentada en 2010 sobre el fiqh de la minoría musulmana sunita; estudió en Medina y obtuvo un título de ingeniería civil en Sudán; presidente, asesor de operaciones y fideicomisario de la Fundación Musulmana para la Investigación y el Desarrollo y asesor del Consejo Islámico de la Sharia. Su ficha informativa indica que se identifica como sunita, sin una referencia aparte."
  fr: "L'article de Wikipédia en anglais consacré à Haitham al-Haddad le décrit comme un érudit musulman britannique d'origine palestinienne et présentateur de télévision; docteur de la SOAS (School of Eastern American Schools), sa thèse portant sur le fiqh sunnite minoritaire a été soutenue en 2010; il a étudié à Médine et obtenu un diplôme d'ingénieur civil au Soudan; il est président, conseiller opérationnel et administrateur de la Muslim Research and Development Foundation et conseiller auprès du Conseil islamique de la charia. Son infobox indique qu'il est sunnite, sans autre précision."
  ur: "ہیثم الحداد پر انگریزی ویکیپیڈیا کا مضمون: فلسطینی نژاد برطانوی مسلمان اسکالر اور ٹیلی ویژن پیش کرنے والا؛ SOAS میں 2010 میں سنی مسلم اقلیتی فقہ پر پیش کردہ مقالہ کے ساتھ پی ایچ ڈی؛ مدینہ میں تعلیم حاصل کی اور سوڈان میں سول انجینئرنگ کی ڈگری لی۔ مسلم ریسرچ اینڈ ڈویلپمنٹ فاؤنڈیشن کے چیئر، آپریشنز ایڈوائزر اور ٹرسٹی اور اسلامی شریعہ کونسل کے مشیر۔ اس کا معلوماتی خانہ بغیر کسی علیحدہ حوالہ کے اس کا فرقہ سنی دیتا ہے۔"
