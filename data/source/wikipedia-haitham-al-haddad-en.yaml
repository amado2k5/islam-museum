summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هيثم الحداد: عالم مسلم بريطاني من أصل فلسطيني ومقدم تلفزيوني، نال الدكتوراه من SOAS بأطروحة قُدمت سنة 2010 في فقه الأقليات المسلمة السنية، ودرس في المدينة المنورة وحصل على شهادة هندسة مدنية في السودان، وهو رئيس مؤسسة MRDF ومستشارها التشغيلي وأمينها ويجلس في المجلس الاستشاري للمجلس الشرعي الإسلامي؛ ويذكر صندوق معلوماتها مذهبه «سني» دون مصدر مستقل."
  en: "The English Wikipedia article on Haitham al-Haddad: a British Muslim scholar of Palestinian origin and television presenter; PhD at SOAS with a thesis submitted in 2010 on Sunni Muslim minority fiqh; studied in Medina and took a civil engineering degree in Sudan; chair, operations advisor and trustee of the Muslim Research and Development Foundation and an advisor to the Islamic Sharia Council. Its infobox gives his denomination as Sunni, without a separate reference."
