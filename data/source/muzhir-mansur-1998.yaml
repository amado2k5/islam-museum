summary:
  ar: "كتاب المزهر في علوم اللغة وأنواعها لـالسيوطي، تحقيق فؤاد علي منصور، دار الكتب العلمية، بيروت، الطبعة الأولى؛ قُرئ في نسخة المكتبة الشاملة الموافقة للمطبوع في 21 نوفمبر 2026، في موضوع: أصل اللغة والقبائل التي أُخذت عنها العربية."
  en: "al-Muzhir fi Ulum al-Lugha wa-Anwa'iha by al-Suyuti, ed. Fu'ad Ali Mansur, Dar al-Kutub al-Ilmiyya, Beirut, 1st ed., 1418 AH / 1998; read on 21 November 2026 in the Shamela library copy, whose numbering follows the printed edition, for the origin of language and the tribes from whom Arabic was taken (vol. 1, pp. 11-22, 167-168)."
  ur: "المزهر في علوم اللغة وأنواعها، مصنف: السيوطي؛ 21 نومبر 2026 کو المکتبۃ الشاملہ کے نسخے میں، جس کے صفحات مطبوعہ کے مطابق ہیں، اس موضوع کے لیے پڑھی گئی: أصل اللغة والقبائل التي أُخذت عنها العربية۔"
  fr: "al-Muzhir fi Ulum al-Lugha wa-Anwa'iha de al-Suyuti, ed. Fu'ad Ali Mansur, Dar al-Kutub al-Ilmiyya, Beirut, 1st ed., 1418 AH / 1998 ; lu le 21 novembre 2026 dans la copie de la bibliothèque Shamela, dont la pagination suit l'édition imprimée, pour : the origin of language and the tribes from whom Arabic was taken (vol. 1, pp. 11-22, 167-168)."
  es: "al-Muzhir fi Ulum al-Lugha wa-Anwa'iha de al-Suyuti, ed. Fu'ad Ali Mansur, Dar al-Kutub al-Ilmiyya, Beirut, 1st ed., 1418 AH / 1998; leído el 21 de noviembre de 2026 en la copia de la biblioteca Shamela, cuya paginación sigue la edición impresa, para: the origin of language and the tribes from whom Arabic was taken (vol. 1, pp. 11-22, 167-168)."
  tr: "Al-Suyuti tarafından yazılan Al-Mizhar fi 'Ulum al-Lugha wa Anwa'uhaha adlı kitap, Fouad Ali Mansour tarafından derlenmiştir, Dar Al-Kutub Al-Ilmiyyah, Beyrut, Birinci Baskı; 21 Kasım 2026'da basılı baskıya karşılık gelen Al-Maktaba Al-Shamila baskısında, Arapçanın öğrenildiği Dilin Kökeni ve Kabileler konusuyla okunmuştur."
  id: "Buku Al-Mizhar fi 'Ulum al-Lugha wa Anwa'uhaha oleh Al-Suyuti, disunting oleh Fouad Ali Mansour, Dar Al-Kutub Al-Ilmiyyah, Beirut, Edisi Pertama; dibaca dalam edisi Al-Maktaba Al-Shamila, sesuai dengan edisi cetak tanggal 21 November 2026, dengan topik: Asal Usul Bahasa dan Suku-suku dari mana bahasa Arab dipelajari."
