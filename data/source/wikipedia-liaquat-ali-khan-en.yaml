  ar: "مقالة ويكيبيديا الإنجليزية عن لياقت علي خان (1895–1951)، أول رئيس وزراء لباكستان؛ تعطي مولده في 1 تشرين الأول 1895 في كرنال واغتياله في 16 تشرين الأول 1951 في راولبندي ودفنه في مزار قائد بكراتشي، وتروي نقلاً عن سيرته تدينه في طفولته ومشاركته في مواكب التعزية في محرم دون أن تسمي مذهبه."
  en: "The English Wikipedia article on Liaquat Ali Khan (1895–1951), Pakistan's first prime minister; it gives his birth on 1 October 1895 at Karnal, his assassination on 16 October 1951 at Rawalpindi and his burial at Mazar-e-Quaid in Karachi, and, citing his biography, recounts his childhood religious devotion and his participation in tazia processions during Muharram, without naming any school for him."
