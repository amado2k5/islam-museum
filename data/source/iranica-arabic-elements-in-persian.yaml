summary:
  ar: 'صفحة «ARABIC LANGUAGE v. Arabic Elements in Persian (J. R. Perry)» على Encyclopaedia Iranica، ملخَّصة في ملف بحثي قُدّم إلى المتحف ولم يفتحها المتحف؛ تُستعمل لـنسبة الألفاظ العربية الدخيلة في الفارسية: نحو 8000 في مفردات أدبية يومية من 20000، أي نحو 40%. أجاز المؤسس استعمال الملخص في 21 نوفمبر 2026 دون إعادة تحقق.'
  en: 'The page "ARABIC LANGUAGE v. Arabic Elements in Persian (J. R. Perry)" on Encyclopaedia Iranica, summarised in a research file supplied to the museum and not opened by the museum; used for the Persian share of Arabic loanwords: about 8,000 in an everyday literary vocabulary of 20,000, about 40%. The founder approved using the summary on 21 November 2026 without re-verification.'
  ur: 'Encyclopaedia Iranica پر صفحہ «ARABIC LANGUAGE v. Arabic Elements in Persian (J. R. Perry)»، جو عجائب گھر کو فراہم کردہ تحقیقی فائل میں خلاصہ کیا گیا اور عجائب گھر نے نہیں کھولا؛ اس کے لیے استعمال ہوا: فارسی میں عربی مستعار الفاظ کا تناسب: روزمرہ ادبی 20,000 الفاظ میں تقریباً 8,000، یعنی تقریباً 40 فیصد۔ بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔'
  fr: 'La page « ARABIC LANGUAGE v. Arabic Elements in Persian (J. R. Perry) » sur Encyclopaedia Iranica, résumée dans un fichier de recherche remis au musée et non ouverte par le musée ; utilisée pour la part des emprunts arabes en persan : environ 8 000 dans un vocabulaire littéraire courant de 20 000, soit environ 40 %. Le fondateur a approuvé l''usage du résumé le 21 novembre 2026 sans nouvelle vérification.'
  es: 'La página «ARABIC LANGUAGE v. Arabic Elements in Persian (J. R. Perry)» en Encyclopaedia Iranica, resumida en un archivo de investigación entregado al museo y no abierta por el museo; usada para la parte de préstamos árabes en persa: unos 8.000 en un vocabulario literario corriente de 20.000, alrededor del 40 %. El fundador aprobó el uso del resumen el 21 de noviembre de 2026 sin nueva verificación.'
  tr: "İranica'daki \"ARAPÇA DİLİ vs. Farsçada Arap Unsurları (J. R. Perry)\" sayfası, müzeye sunulan ancak müze tarafından açılmayan bir araştırma dosyasında özetlenmiştir; Farsça'daki yabancı Arapça kelimelerin yüzdesini tahmin etmek için kullanılır: günlük edebi kelime dağarcığında yaklaşık 8.000, yani yaklaşık %40. Kurucu, özetin kullanımına 21 Kasım 2026'da yeniden doğrulama yapılmadan izin vermiştir."
  id: "Halaman \"BAHASA ARABIC vs. Unsur Arab dalam Bahasa Persia (J. R. Perry)\" di Encyclopaedia Iranica, yang dirangkum dalam berkas penelitian yang diserahkan ke museum namun tidak dibuka oleh museum; digunakan untuk memperkirakan persentase kata Arab asing dalam bahasa Persia: sekitar 8.000 dalam kosakata sastra harian dari 20.000, atau sekitar 40%. Pendiri mengizinkan penggunaan abstrak tersebut pada 21 November 2026, tanpa verifikasi ulang."
