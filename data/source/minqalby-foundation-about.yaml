summary:
  ar: "صفحة «من نحن» لمؤسسة من قلبي ⁦(Min Qalby Foundation)⁩؛ تحمل رسالة موقعة من رئيستها شزرينا أزمان ⁦(ميز نينا)⁩ تروي فيها بدء عملها الإنساني سنة 2014 ونشأة المؤسسة."
  en: "The Min Qalby Foundation's About page: it carries a message signed by its chairwoman Shazrina Azman (Mizz Nina), recounting her humanitarian work from 2014 and the foundation's formation, and describes the foundation's focus on social and business empowerment, education and humanitarian efforts."
  es: "La página \"Acerca de\" de la Fundación Min Qalby incluye un mensaje firmado por su presidenta, Shazrina Azman (Mizz Nina), en el que relata su labor humanitaria desde 2014 y la creación de la fundación, y describe el enfoque de la fundación en el empoderamiento social y empresarial, la educación y las iniciativas humanitarias."
  fr: "La page « À propos » de la Fondation Min Qalby contient un message signé par sa présidente Shazrina Azman (Mizz Nina), retraçant son travail humanitaire depuis 2014 et la création de la fondation, et décrivant l'orientation de la fondation vers l'autonomisation sociale et commerciale, l'éducation et les actions humanitaires."
  ur: "من قلبی فاؤنڈیشن کے بارے میں صفحہ: اس میں اس کی چیئر وومن شازرینا عزمان ⁦(مِز نینا)⁩ کے دستخط شدہ ایک پیغام ہے، جس میں 2014 سے ان کے انسانی ہمدردی کے کاموں اور فاؤنڈیشن کی تشکیل کا ذکر کیا گیا ہے، اور سماجی اور کاروباری بااختیار بنانے، تعلیم اور انسانی ہمدردی کی کوششوں پر فاؤنڈیشن کی توجہ کو بیان کیا گیا ہے۔"
  tr: "Min Qalby Vakfı'nın (Min Qalby Vakfı) \"Biz Kimiz\" sayfasında, başkanı Shzrina Azman (Miz Nina) tarafından imzalanan bir mektup yer alıyor; bu mektupta 2014'te insani yardım çalışmalarının başlamasını ve vakfın kuruluşunu anlatıyor."
  id: "Halaman \"Who Are We\" dari Yayasan Min Qalby (Yayasan Min Qalby) memuat surat yang ditandatangani oleh presidennya, Shzrina Azman (Miz Nina), yang menceritakan awal kerja kemanusiaannya pada tahun 2014 dan pendirian yayasan tersebut."
