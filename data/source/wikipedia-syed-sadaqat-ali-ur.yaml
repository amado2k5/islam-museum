summary:
  ar: "مقالة ويكيبيديا الأردية عن قاري سيد صداقت علي؛ تصف أسلوبه المصري في التلاوة وخدماته في إذاعة باكستان وتلفزيونها وجوائزه، ومنها فخر الأداء 1988 وستارة الامتياز 2015 وهلال الامتياز 2020، ولا تذكر سنة ميلاده."
  en: "Urdu Wikipedia article on Qari Syed Sadaqat Ali; it describes his Egyptian-style recitation, his Radio Pakistan and PTV service and his awards — the Pride of Performance (1988), Sitara-i-Imtiaz (2015) and Hilal-i-Imtiaz (2020) — and gives no birth year."
  es: "Artículo de Wikipedia en urdu sobre Qari Syed Sadaqat Ali; describe su recitación al estilo egipcio, su servicio en Radio Pakistán y PTV y sus premios —el Orgullo de Desempeño (1988), Sitara-i-Imtiaz (2015) y Hilal-i-Imtiaz (2020)— y no indica el año de nacimiento."
  fr: "L'article de Wikipédia en ourdou sur Qari Syed Sadaqat Ali décrit sa récitation de style égyptien, son service à Radio Pakistan et PTV et ses récompenses — le Pride of Performance (1988), le Sitara-i-Imtiaz (2015) et le Hilal-i-Imtiaz (2020) — et ne donne pas d'année de naissance."
  ur: "قاری سید صداقت علی پر اردو ویکیپیڈیا مضمون؛ اس میں ان کی مصری طرز کی تلاوت، ان کی ریڈیو پاکستان اور پی ٹی وی سروس اور ان کے ایوارڈز - پرائیڈ آف پرفارمنس (1988)، ستارہ امتیاز (2015) اور ہلال امتیاز (2020) - کی وضاحت کی گئی ہے اور اس کا کوئی سال پیدائش نہیں ہے۔"
  tr: "Qari Syed Siddiqat Ali hakkında Urduca Wikipedia makalesi, onun Mısır tarzındaki okuma tarzı, Pakistan Radyo ve Televizyonu'ndaki hizmetleri ve ödüllerini anlatıyor; bunlar arasında 1988 Performansın Gururu, 2015 İmtiaz Yıldızı ve 2020 İmtiaz Hilal'i yer alıyor, doğum yılını belirtmiyor."
  id: "Artikel Wikipedia berbahasa Urdu tentang Qari Syed Siddiqat Ali menggambarkan gaya pembacaan bahasa Mesir, jasanya di Radio dan Televisi Pakistan, serta penghargaan yang dimilikinya, termasuk Pride of Performance 1988, Star of Imtiaz 2015, dan Hilal of the Imtiaz 2020, tanpa menyebutkan tahun kelahirannya."
