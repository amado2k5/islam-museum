  ar: "مقالة ويكيبيديا الإنجليزية عن محمد حسني مبارك؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في كفر المصيلحة سنة 1928، ومسيرته في القوات الجوية وقيادتها، ونيابته للرئيس السادات، ورئاسته لمصر من 1981 حتى تنحيه في ثورة 2011، ومحاكماته، ووفاته في القاهرة سنة 2020 وجنازته العسكرية ودفنه في مصر الجديدة."
  en: "English Wikipedia article on Muhammad Hosni Mubarak; used for entity facts only. It recounts his birth in Kafr el-Meselha in 1928, his air force career and command, his vice-presidency under Sadat, his presidency of Egypt from 1981 until his resignation in the 2011 revolution, his trials, his death in Cairo in 2020, his military funeral and his burial in Heliopolis."
