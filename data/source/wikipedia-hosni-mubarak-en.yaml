summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد حسني مبارك؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في كفر المصيلحة سنة 1928، ومسيرته في القوات الجوية وقيادتها، ونيابته للرئيس السادات، ورئاسته لمصر من 1981 حتى تنحيه في ثورة 2011، ومحاكماته، ووفاته في القاهرة سنة 2020 وجنازته العسكرية ودفنه في مصر الجديدة."
  en: "English Wikipedia article on Muhammad Hosni Mubarak; used for entity facts only. It recounts his birth in Kafr el-Meselha in 1928, his air force career and command, his vice-presidency under Sadat, his presidency of Egypt from 1981 until his resignation in the 2011 revolution, his trials, his death in Cairo in 2020, his military funeral and his burial in Heliopolis."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad Hosni Mubarak; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Kafr el-Meselha en 1928, su carrera y mando en la fuerza aérea, su vicepresidencia bajo el mandato de Sadat, su presidencia de Egipto desde 1981 hasta su dimisión en la revolución de 2011, sus juicios, su muerte en El Cairo en 2020, su funeral militar y su entierro en Heliópolis."
  fr: "Article de Wikipédia en anglais sur Muhammad Hosni Moubarak; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Kafr el-Meselha en 1928, sa carrière dans l’armée de l’air et son commandement, sa vice-présidence sous Sadate, sa présidence de l’Égypte de 1981 jusqu’à sa démission lors de la révolution de 2011, ses procès, sa mort au Caire en 2020, ses funérailles militaires et son inhumation à Héliopolis."
  ur: "محمد حسنی مبارک پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1928 میں کفر المسیلہ میں ان کی پیدائش، ان کے فضائیہ کے کیریئر اور کمانڈ، سادات کے ماتحت ان کی نائب صدارت، 1981 سے 2011 کے انقلاب میں ان کے استعفیٰ تک مصر کی صدارت، ان کے ٹرائلز، 2020 میں قاہرہ میں ان کی موت، ان کی فوجی جنازہ اور ہیلیو پولی بروز کا ذکر ہے۔"
  tr: "Muhammed Hüsnü Mübarek hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1928'de Kafr Al-Mosilha'daki doğumunu, Hava Kuvvetleri'ndeki kariyerini ve liderliğini, Cumhurbaşkanı Sedat'ın yardımcısını, 1981'den 2011 devrimindeki istifasına kadar Mısır cumhurbaşkanlığını, yargılamalarını, 2020'de Kahire'de ölümünü, askeri cenazesini ve Heliopolis'teki defnini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Mohamed Hosni Mubarak; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Kafr Al-Mosilha pada tahun 1928, kariernya di Angkatan Udara dan kepemimpinannya, wakilnya kepada Presiden Sadat, masa kepresidenannya di Mesir dari tahun 1981 hingga pengunduran dirinya dalam revolusi 2011, persidangannya, kematiannya di Kairo pada tahun 2020, pemakaman militernya, dan pemakamannya di Heliopolis."
