reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 27 October 2026 and checked against the recorded revision. It gives Mubarak as born at Kafr el-Meselha on 4 May 1928, an Egyptian Air Force career officer who commanded the air force (1972–75), vice president from 1975, president from 14 October 1981 after Sadat's assassination, re-elected through 2005, forced to step down on 11 February 2011 after eighteen days of protest, tried from August 2011 (life sentence in 2012, retrial, corruption conviction in 2015, acquittal on the protester-killing charge and release in March 2017), dead in a Cairo military hospital on 25 February 2020 aged 91, given a full-honour military funeral and buried in a cemetery in Heliopolis. Its infobox carries no religion field and its text names no school for him."
