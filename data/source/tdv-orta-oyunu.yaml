summary:
  ar: "مدخل «أورطا أويونو» في موسوعة TDV الإسلامية: المسرح التركي التقليدي متعدد الممثلين الذي يُلعب في الميدان بلا خشبة ولا ستارة ولا ديكور، وأولى شهاداته في سرناميَّ لبيب وحضر في ثلاثينيات القرن التاسع عشر، وعناصره الأربعة: التمثيل المرتجل والموسيقى والرقص والمحاورة والتقليد، وبطلاه بيشكار وقاووقلو، وميدانه وأقسامه الأربعة، ومقاعد الجمهور، وانحساره أمام المسرح الغربي بعد التنظيمات."
  en: "The TDV İslâm Ansiklopedisi entry on orta oyunu, the multi-actor traditional Turkish theatre played in the round without stage, curtain or décor: its first attestations in the surnames of Lebîb (1834) and Hızır (1836), its elements — improvised temsil, music, dance by çengi, köçek and curcunabaz, muhâvere and mimicry — the Pişekâr–Kavuklu pair, the meydan and its fittings, the four-part play, the stock types, and its decline before the Western theatre the Tanzimat intellectuals favoured."
  ur: "TDV اسلام انسائیکلوپیڈیا کا «اورتا اویونو» مدخل: میدان میں بغیر اسٹیج، پردے اور سجاوٹ کے کھیلا جانے والا کثیر اداکار روایتی ترک تھیٹر؛ ۱۸۳۴ء اور ۱۸۳۶ء کی سرناموں میں اولین شہادتیں، عناصر — ارتجالی تمثیل، موسیقی، چنگی، کوچک اور جرجوناباز کا رقص، محاورہ اور تقلید — پیشکار–قاووقلو جوڑی، میدان کا سازوسامان، چار حصوں والا کھیل، نمونہ کردار، اور تنظیمات کے بعد مغربی تھیٹر کے سامنے زوال۔"
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el orta oyunu, el teatro tradicional turco con múltiples actores representado en círculo sin escenario, telón ni decorado: sus primeras atestaciones en los apellidos Lebîb (1834) y Hızır (1836), sus elementos —temsil improvisado, música, danza de çengi, köçek y curcunabaz, muhâvere y mímica— la pareja Pişekâr–Kavuklu, el meydan y sus accesorios, la obra en cuatro partes, los tipos de personajes y su declive ante el teatro occidental que favorecían los intelectuales de Tanzimat."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur l'orta oyunu, le théâtre traditionnel turc à plusieurs acteurs joué en rond sans scène, rideau ni décor: ses premières attestations dans les noms de famille de Lebîb (1834) et Hızır (1836), ses éléments — temsil improvisé, musique, danse par çengi, köçek et curcunabaz, muhâvere et mimique — le couple Pişekâr–Kavuklu, le meydan et ses aménagements, la pièce en quatre parties, les types de personnages et son déclin avant le théâtre occidental que les intellectuels du Tanzimat privilégiaient."
  tr: "TDV İslami Ansiklopedisi'ne 'Orta Uyono'nun girişi: sahne, perde veya süsleme olmadan sahada sahnelenen geleneksel Türk çok oyunculu tiyatrosu. En erken tanığı serenum Labib'de yer alır ve 1830'larda izlenmiştir. Dört unsuru doğaçlama oyunculuk, müzik, dans, diyalog ve taklittir; başrolleri Peşkar ve Kavğlu, meydanı ve dört bölümü, seyirci koltukları ve Tanzimat'tan sonra Batı tiyatrosu öncesindeki geri çekilişidir."
  id: "Masuknya 'Orta Uyono' dalam Ensiklopedia Islam TDV: teater multi-aktor tradisional Turki yang tampil di lapangan tanpa panggung, tirai, atau dekorasi. Bukti terawalnya ada di serenum Labib dan dihadiri pada tahun 1830-an. Empat elemennya adalah akting improvisasi, musik, tari, dialog, dan tiruan, dengan protagonisnya Peşkar dan Kavğlu, alun-alun dan empat bagiannya, tempat duduk penonton, serta peristirahatannya sebelum teater Barat setelah Tanzimat."
