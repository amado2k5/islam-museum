summary:
  ar: "مدخل «أورطا أويونو» في موسوعة TDV الإسلامية: المسرح التركي التقليدي متعدد الممثلين الذي يُلعب في الميدان بلا خشبة ولا ستارة ولا ديكور، وأولى شهاداته في سرناميَّ لبيب وحضر في ثلاثينيات القرن التاسع عشر، وعناصره الأربعة: التمثيل المرتجل والموسيقى والرقص والمحاورة والتقليد، وبطلاه بيشكار وقاووقلو، وميدانه وأقسامه الأربعة، ومقاعد الجمهور، وانحساره أمام المسرح الغربي بعد التنظيمات."
  en: "The TDV İslâm Ansiklopedisi entry on orta oyunu, the multi-actor traditional Turkish theatre played in the round without stage, curtain or décor: its first attestations in the surnames of Lebîb (1834) and Hızır (1836), its elements — improvised temsil, music, dance by çengi, köçek and curcunabaz, muhâvere and mimicry — the Pişekâr–Kavuklu pair, the meydan and its fittings, the four-part play, the stock types, and its decline before the Western theatre the Tanzimat intellectuals favoured."
  ur: "TDV اسلام انسائیکلوپیڈیا کا «اورتا اویونو» مدخل: میدان میں بغیر اسٹیج، پردے اور سجاوٹ کے کھیلا جانے والا کثیر اداکار روایتی ترک تھیٹر؛ ۱۸۳۴ء اور ۱۸۳۶ء کی سرناموں میں اولین شہادتیں، عناصر — ارتجالی تمثیل، موسیقی، چنگی، کوچک اور جرجوناباز کا رقص، محاورہ اور تقلید — پیشکار–قاووقلو جوڑی، میدان کا سازوسامان، چار حصوں والا کھیل، نمونہ کردار، اور تنظیمات کے بعد مغربی تھیٹر کے سامنے زوال۔"
