reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The infobox gives his birth date and place, citing the K-1 fighter profile, his kickboxing record (106 wins, 92 by knockout, 17 losses) and his teams and trainers. The early-life text says he was born and raised in Amsterdam, of Berber descent, his parents Moroccans of the Houara tribe who moved to the Netherlands before he was born, and that he has represented Morocco since 2005. The personal-life text covers his marriage, children, a 2007 rap song and his legal issues, including the 2014 Amsterdam sentence of one and a half years, raised on appeal to two years with ten months suspended and upheld by the Supreme Court in 2017. The article's text makes no statement of his religion; it files him only in the categories Dutch Muslims and Moroccan Muslims, which are filings, not attestation."
