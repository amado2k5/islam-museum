summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرب نشتر (1899–1958)؛ تعطي مولده في 13 حزيران 1899 في بيشاور ووفاته بنوبة قلبية في 14 شباط 1958 في كراتشي ودفنه في مزار قائد، وتصفه بأنه من بيت متدين وذا قناعات دينية عميقة واهتمام بالتصوف الإسلامي، دون أن تسمي مذهباً."
  en: "The English Wikipedia article on Abdur Rab Nishtar (1899–1958); it gives his birth on 13 June 1899 at Peshawar and his death by heart attack on 14 February 1958 at Karachi and burial at Mazar-e-Quaid, and describes his religious household, his deep religious convictions and his interest in Islamic mysticism, without naming any school for him."
  es: "El artículo de la Wikipedia en inglés sobre Abdur Rab Nishtar (1899-1958) indica que nació el 13 de junio de 1899 en Peshawar, falleció de un ataque al corazón el 14 de febrero de 1958 en Karachi y fue enterrado en Mazar-e-Quaid. Describe su entorno familiar religioso, sus profundas convicciones religiosas y su interés por el misticismo islámico, sin mencionar ninguna escuela a la que perteneciera."
  fr: "L'article de Wikipédia en anglais sur Abdur Rab Nishtar (1899-1958); il indique sa naissance le 13 juin 1899 à Peshawar et sa mort par crise cardiaque le 14 février 1958 à Karachi et son enterrement au Mazar-e-Quaid, et décrit sa famille religieuse, ses profondes convictions religieuses et son intérêt pour le mysticisme islamique, sans nommer d'école pour lui."
  ur: "عبدالرب نشتر (1899-1958) پر انگریزی ویکیپیڈیا کا مضمون؛ یہ 13 جون 1899 کو پشاور میں ان کی پیدائش اور 14 فروری 1958 کو کراچی میں دل کا دورہ پڑنے سے ان کی موت اور مزار قائد پر تدفین، اور ان کے مذہبی گھرانے، ان کے گہرے مذہبی عقائد اور اسلامی تصوف میں ان کی دلچسپی کو بیان کرتا ہے، بغیر کسی مکتب کا نام لیے۔"
  tr: "İngilizce Wikipedia'daki makale, Abdul Rabb Nashtar (1899–1958) hakkında; 13 Haziran 1899'da Peşaver'de doğduğunu, 14 Şubat 1958'de Karaçi'de kalp krizi sonucu öldüğünü ve Mazar-e-Quaid'de defnedilmesini anlatır. Onu, derin dini inançlara ve İslami Sufizme ilgi duyan bir dini aileden geldiği belirtilir, ancak herhangi bir mezhep belirtilmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdul Rabb Nashtar (1899–1958); menceritakan kelahirannya pada 13 Juni 1899 di Peshawar, kematiannya akibat serangan jantung pada 14 Februari 1958 di Karachi, dan pemakamannya di Mazar-e-Quaid. Artikel tersebut menggambarkan dia berasal dari keluarga religius dengan keyakinan agama yang mendalam dan minat pada Sufisme Islam, tanpa menyebutkan sekte tertentu."
