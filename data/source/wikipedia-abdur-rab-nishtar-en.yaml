  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرب نشتر (1899–1958)؛ تعطي مولده في 13 حزيران 1899 في بيشاور ووفاته بنوبة قلبية في 14 شباط 1958 في كراتشي ودفنه في مزار قائد، وتصفه بأنه من بيت متدين وذا قناعات دينية عميقة واهتمام بالتصوف الإسلامي، دون أن تسمي مذهباً."
  en: "The English Wikipedia article on Abdur Rab Nishtar (1899–1958); it gives his birth on 13 June 1899 at Peshawar and his death by heart attack on 14 February 1958 at Karachi and burial at Mazar-e-Quaid, and describes his religious household, his deep religious convictions and his interest in Islamic mysticism, without naming any school for him."
