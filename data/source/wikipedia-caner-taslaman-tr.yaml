  ar: "مقالة ويكيبيديا التركية عن جانر تسلمان؛ تُستخدم لوقائع الكيان فقط. تفصّل تعليمه في جامعات بوغازيتشي ومرمرة وإسطنبول، وأطروحاته في نظرية الانفجار العظيم ونظرية التطور والفيزياء الكمومية، ومنصبه أستاذًا في جامعة يلدز التقنية منذ 2014."
  en: "Turkish Wikipedia article on Caner Taslaman; used for entity facts only. It details his education at Boğaziçi, Marmara and Istanbul Universities, his theses on the Big Bang theory, the evolution theory and quantum physics, and his professorship at Yıldız Technical University from 2014."
  es: "Artículo de la Wikipedia en turco sobre Caner Taslaman; utilizado únicamente para datos sobre la persona. Detalla su formación académica en las universidades de Boğaziçi, Marmara e Estambul, sus tesis sobre la teoría del Big Bang, la teoría de la evolución y la física cuántica, y su cátedra en la Universidad Técnica de Yıldız desde 2014."
