summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن معاوية ولد سيدي أحمد الطايع؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أطار سنة 1941، ورئاسته الوزراء ⁦(1981–1984 و1984–1992)⁩ والرئاسة (1984–2005)، وخطّه القومي العربي وصلاته بعراق صدام حسين، والإطاحة به سنة 2005 ومنفاه في قطر وتدريسه في أكاديمية عسكرية قطرية. لا يذكر نصّها دينه؛ وتصنّفه في «المسلمين السنّة الموريتانيين»."
  en: "English Wikipedia article on Maaouya Ould Sid'Ahmed Taya; used for entity facts only. It recounts his birth at Atar in 1941, his premierships (1981–1984 and 1984–1992) and presidency (1984–2005), his Arab nationalist line and ties with Saddam Hussein's Iraq, his overthrow in 2005, his exile in Qatar and his teaching at a Qatari military academy. Its text says nothing about his religion; it files him under Mauritanian Sunni Muslims."
  es: "Artículo de la Wikipedia en inglés sobre Maaouya Ould Sid'Ahmed Taya; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Atar en 1941, sus mandatos como primer ministro (1981-1984 y 1984-1992) y presidente (1984-2005), su línea nacionalista árabe y sus vínculos con el Irak de Saddam Hussein, su derrocamiento en 2005, su exilio en Qatar y su labor docente en una academia militar qatarí. El texto no menciona su religión; lo clasifica dentro de la rama musulmana sunita de Mauritania."
  fr: "Article de Wikipédia en anglais sur Maaouya Ould Sid'Ahmed Taya; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Atar en 1941, ses mandats de Premier ministre (1981-1984 et 1984-1992) et de président (1984-2005), son idéologie nationaliste arabe et ses liens avec l'Irak de Saddam Hussein, son renversement en 2005, son exil au Qatar et son enseignement dans une académie militaire qatarie. Le texte ne mentionne pas sa religion; il est classé parmi les musulmans sunnites mauritaniens."
  ur: "معاویہ اولد سید احمد تایا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1941 میں عطار میں ان کی پیدائش، اس کی وزارت عظمیٰ ⁦(1981-1984 اور 1984-1992)⁩ اور صدارت (1984-2005)، اس کی عرب قوم پرست لائن اور صدام حسین کے عراق کے ساتھ تعلقات، 2005 میں اس کا تختہ الٹنے، قطری میں اس کی جلاوطنی اور قاری کیڈ میں اس کی جلاوطنی کا ذکر ہے۔ اس کا متن اس کے مذہب کے بارے میں کچھ نہیں کہتا۔ یہ اسے موریطانیہ کے سنی مسلمانوں کے تحت فائل کرتا ہے۔"
  tr: "Muawiya Walad Sidi Ahmed Al-Tayea hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1941'deki doğumunu, başbakanlığını (1981–1984 ve 1984–1992), cumhurbaşkanlığını (1984–2005), Arap milliyetçi çizgisini, Saddam Hüseyin'in Irak ile bağlarını, 2005'te devrilmesini, Katar'daki sürgününü ve Katar askeri akademisinde öğretmenliğini anlatır. Metinde dininden bahsedilmez; onu \"Moritanyalı Sünni Müslümanlar\" arasında sınıflandırır."
  id: "Artikel Wikipedia bahasa Inggris tentang Muawiya Walad Sidi Ahmed Al-Tayea; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada tahun 1941, masa jabatannya sebagai perdana menteri (1981–1984 dan 1984–1992), kepresidenan (1984–2005), garis nasionalis Arabnya, hubungannya dengan Irak Saddam Hussein, penggulingannya pada tahun 2005, pengasingannya di Qatar, dan pengajarannya di akademi militer Qatar. Teksnya tidak menyebutkan agamanya; teks tersebut mengklasifikasikannya di antara \"Muslim Sunni Mauritania.\""
