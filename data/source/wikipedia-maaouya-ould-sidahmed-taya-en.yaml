summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن معاوية ولد سيدي أحمد الطايع؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أطار سنة 1941، ورئاسته الوزراء (1981–1984 و1984–1992) والرئاسة (1984–2005)، وخطّه القومي العربي وصلاته بعراق صدام حسين، والإطاحة به سنة 2005 ومنفاه في قطر وتدريسه في أكاديمية عسكرية قطرية. لا يذكر نصّها دينه؛ وتصنّفه في «المسلمين السنّة الموريتانيين»."
  en: "English Wikipedia article on Maaouya Ould Sid'Ahmed Taya; used for entity facts only. It recounts his birth at Atar in 1941, his premierships (1981–1984 and 1984–1992) and presidency (1984–2005), his Arab nationalist line and ties with Saddam Hussein's Iraq, his overthrow in 2005, his exile in Qatar and his teaching at a Qatari military academy. Its text says nothing about his religion; it files him under Mauritanian Sunni Muslims."
