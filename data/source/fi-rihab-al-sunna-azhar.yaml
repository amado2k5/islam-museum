summary:
  ar: "كتاب الدكتور محمد محمد أبو شهبة (ت 1403هـ / 1983م)، ضمن السلسلة العلمية لمجمع البحوث الإسلامية: يبيّن منزلة السنة في التشريع وعلاقتها بالقرآن وحجيتها، ثم يعرّف بالكتب الستة ومؤلفيها ومنهج كل كتاب وقيمته العلمية: صحيح البخاري، وصحيح مسلم، وسنن النسائي، وسنن أبي داود، وسنن الترمذي، وسنن ابن ماجه؛ 152 صفحة، إشراف الأمين العام للمجمع."
  en: "Muhammad Muhammad Abu Shahba's book (d. 1403 AH / 1983) in the Scientific Series of the Islamic Research Academy of al-Azhar: the place of the Sunna in legislation and its relation to the Qur'an, then the six canonical hadith books, their authors, methods and scholarly value; 152 pages, supervised by the Academy's Secretary-General."
