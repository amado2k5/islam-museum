summary:
  ar: "مقالة ويكيبيديا العربية عن الخديوي توفيق؛ تؤرخ مولده في 15 نوفمبر 1852 ووفاته في 7 يناير 1892 في حلوان، وتروي عهده والثورة العرابية والاحتلال."
  en: "Arabic Wikipedia article on Khedive Tawfiq (Muhammad Tawfiq Pasha); used for entity facts only. It dates his birth to 15 November 1852 and his death to 7 January 1892 at Helwan, and recounts his reign, the Urabi revolt and the British occupation."
  es: "Artículo en árabe de la Wikipedia sobre el jedive Tawfiq (Muhammad Tawfiq Pasha); se utiliza únicamente para datos sobre la persona. Fecha su nacimiento el 15 de noviembre de 1852 y su muerte el 7 de enero de 1892 en Helwan, y relata su reinado, la revuelta de Urabi y la ocupación británica."
  fr: "L'article de Wikipédia en arabe sur le khédive Tawfiq (Muhammad Tawfiq Pacha) est utilisé uniquement à des fins d'information. Il situe sa naissance le 15 novembre 1852 et sa mort le 7 janvier 1892 à Helwan, et relate son règne, la révolte d'Urabi et l'occupation britannique."
  ur: "کھیڈیو توفیق پر عربی ویکیپیڈیا مضمون ⁦(محمد توفیق پاشا)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پیدائش 15 نومبر 1852 ہے اور اس کی موت 7 جنوری 1892 کو ہیلوان میں ہے، اور اس کے دور حکومت، عربی بغاوت اور برطانوی قبضے کا ذکر ہے۔"
  tr: "Haziv Tavfik hakkında Arapça Vikipedi makalesi, doğumunu 15 Kasım 1852'de ve ölümünü 7 Ocak 1892'de Helwan'da tarihlendirir ve dönemini, Urabi İsyanı'nı ve işgali anlatır."
  id: "Artikel Wikipedia berbahasa Arab tentang Khedive Tawfiq mencatat tanggal kelahirannya pada 15 November 1852, dan kematiannya pada 7 Januari 1892 di Helwan, yang menceritakan eranya, Pemberontakan Urabi, dan pendudukannya."
