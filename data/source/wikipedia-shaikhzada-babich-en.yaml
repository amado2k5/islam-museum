summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شايخزاده بابيتش؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 14 يناير 1895 في أسيانوفو بمحافظة أوفا، ووفاته مقتولا في 28 مارس 1919 في يلاير، وتعليمه الابتدائي في مدرسة أبيه محمد زكير الذي كان ملّا المحلّة، ودراسته في مدرسة غاليّة بأوفا 1911–1916، وعضويته في الحكومة الباشكيرية؛ ولا تسمي له دينا ولا مذهبا."
  en: "English Wikipedia article on Shaikhzada Babich; used for entity facts only. It gives his birth on 14 January 1895 at Asyanovo in Ufa Governorate and his murder on 28 March 1919 at Zilair, his primary schooling in the madrasa directed by his father Muhametzakir, a mahalla mullah, his study at the Ğəliyə madrasa in Ufa in 1911–1916, and his membership of the Bashkir government; it names no religion or school for him."
