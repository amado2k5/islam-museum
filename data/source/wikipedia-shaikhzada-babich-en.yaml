summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شايخزاده بابيتش؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 14 يناير 1895 في أسيانوفو بمحافظة أوفا، ووفاته مقتولا في 28 مارس 1919 في يلاير، وتعليمه الابتدائي في مدرسة أبيه محمد زكير الذي كان ملّا المحلّة، ودراسته في مدرسة غاليّة بأوفا 1911–1916، وعضويته في الحكومة الباشكيرية؛ ولا تسمي له دينا ولا مذهبا."
  en: "English Wikipedia article on Shaikhzada Babich; used for entity facts only. It gives his birth on 14 January 1895 at Asyanovo in Ufa Governorate and his murder on 28 March 1919 at Zilair, his primary schooling in the madrasa directed by his father Muhametzakir, a mahalla mullah, his study at the Ğəliyə madrasa in Ufa in 1911–1916, and his membership of the Bashkir government; it names no religion or school for him."
  es: "Artículo de la Wikipedia en inglés sobre Shaikhzada Babich; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 14 de enero de 1895 en Asyanovo, en la gobernación de Ufa, y su asesinato el 28 de marzo de 1919 en Zilair, su educación primaria en la madrasa dirigida por su padre, Muhametzakir, un mulá de mahalla, sus estudios en la madrasa Ğəliyə en Ufa entre 1911 y 1916, y su pertenencia al gobierno baskir; no menciona ninguna religión ni escuela a la que perteneciera."
  fr: "L'article de Wikipédia en anglais sur Shaikhzada Babich, utilisé uniquement pour les informations le concernant, indique sa naissance le 14 janvier 1895 à Asyanovo, dans le gouvernorat d'Oufa, son assassinat le 28 mars 1919 à Zilair, sa scolarité primaire à la madrasa dirigée par son père Muhametzakir, un mollah du mahalla, ses études à la madrasa Ğəliyə d'Oufa de 1911 à 1916, et son appartenance au gouvernement bachkir. Il ne mentionne ni sa religion ni son école."
  ur: "شیخزادہ بابیچ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 14 جنوری 1895 کو اوفا گورنریٹ کے اسیانوو میں اس کی پیدائش اور 28 مارچ 1919 کو زیلیر میں اس کا قتل ہوا، اس کی ابتدائی تعلیم اس کے والد محمد زاکر کے زیر ہدایت مدرسے میں ہوئی، جو ایک محلہ ملا، اس کی تعلیم اوفا کے Ğəliyə مدرسے میں 1961 میں اس کی حکومت کی رکنیت، اور اس کی رکنیت۔ اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
