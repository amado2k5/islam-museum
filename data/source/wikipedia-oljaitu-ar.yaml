summary:
  ar: "مقالة ويكيبيديا العربية عن محمد خدابنده أولجايتو؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 678هـ/1280م ووفاته في 16 ديسمبر 1316، وتوثّق تعمّده مسيحيًّا باسم نيقولا، وتحوّله إلى الإسلام السني ثم اعتناقه التشيع على يد ابن المطهر الحلي، ودفنه في قبة سلطانية."
  en: "Arabic Wikipedia article on Muhammad Khodabandeh Öljaitü; used for entity facts only. It gives his birth in 678 AH/1280 CE and his death on 16 December 1316, and documents his baptism as a Christian with the name Nicholas, his conversion to Sunni Islam and then his adoption of Shi'ism at the hands of Ibn al-Mutahhar al-Hilli, and his burial in the Dome of Soltaniyeh."
  es: "Artículo de Wikipedia en árabe sobre Muhammad Khodabandeh Öljaitü; utilizado únicamente para datos sobre la persona. Indica su nacimiento en el año 678 de la Hégira (1280 d. C.) y su fallecimiento el 16 de diciembre de 1316, y documenta su bautismo como cristiano con el nombre de Nicolás, su conversión al islam sunita y posteriormente su adopción del chiismo por medio de Ibn al-Mutahhar al-Hilli, así como su entierro en la Cúpula de Soltaniyeh."
  fr: "Article de Wikipédia en arabe sur Muhammad Khodabandeh Öljaitü; utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance en 678 AH/1280 CE et sa mort le 16 décembre 1316, et documente son baptême chrétien sous le nom de Nicolas, sa conversion à l'islam sunnite puis son adoption du chiisme par Ibn al-Mutahhar al-Hilli, et son inhumation au Dôme de Soltaniyeh."
  ur: "عربی ویکیپیڈیا مضمون محمد خدابندہ اولجائیتی پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 678 ہجری / 1280 عیسوی میں اور ان کی وفات 16 دسمبر 1316 کو ہوتی ہے، اور نکولس کے نام سے ایک عیسائی کے طور پر ان کے بپتسمہ، اس کے سنی اسلام میں تبدیل ہونے اور پھر ابن المطہر ہلی کے ہاتھوں اس کے شیعہ مذہب کو اختیار کرنے، اور گنبد سلطانیہ میں اس کی تدفین کی دستاویز کرتا ہے۔"
  tr: "Muhammed Khodabandeh Oljeitu hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 678 Hicri / 1280 M.S. tarihinde ve 16 Aralık 1316'da ölümünü belirtir; ayrıca Sünni İslam'a geçişini, ardından İbn el-Mutahhar el-Hilli tarafından Şiiliğe geçişini ve kraliyet kubbesine gömülmesini belgelemektedir."
  id: "Artikel Wikipedia Arab tentang Muhammad Khodabandeh Oljeitu; digunakan hanya untuk fakta entitas. Artikel ini mencantumkan kelahirannya pada tahun 678 H / 1280 M dan kematiannya pada 16 Desember 1316, serta mendokumentasikan pembaptisannya sebagai seorang Kristen bernama Nicholas, konversinya ke Islam Sunni, kemudian konversi ke Syiah di tangan Ibn al-Mutahhar al-Hilli, dan pemakamannya di kubah kerajaan."
