reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule). Read via the Wikipedia API on 3 November 2026; the revision ID was re-asserted with a repeat query. The article preserves both endings of his religious path (remaining Shia until death, or a late return to Sunni Islam), which the record likewise preserves. Its death section carries an obvious typographical slip (703 AH for 716 AH); the year 716 AH is taken from its own birth/death line and the English article."
