summary:
  ar: "مقالة ويكيبيديا العربية عن محمد خدابنده أولجايتو؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 678هـ/1280م ووفاته في 16 ديسمبر 1316، وتوثّق تعمّده مسيحيًّا باسم نيقولا، وتحوّله إلى الإسلام السني ثم اعتناقه التشيع على يد ابن المطهر الحلي، ودفنه في قبة سلطانية."
  en: "Arabic Wikipedia article on Muhammad Khodabandeh Öljaitü; used for entity facts only. It gives his birth in 678 AH/1280 CE and his death on 16 December 1316, and documents his baptism as a Christian with the name Nicholas, his conversion to Sunni Islam and then his adoption of Shi'ism at the hands of Ibn al-Mutahhar al-Hilli, and his burial in the Dome of Soltaniyeh."
