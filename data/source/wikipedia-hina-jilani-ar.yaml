summary:
  ar: "مقالة ويكيبيديا العربية الموجزة عن هينا جيلاني؛ تعطي ولادتها في لاهور سنة 1953 وبدء ممارستها المحاماة سنة 1979 وتأسيسها مع أختها أول منظمة مساعدة قانونية نسائية في لاهور سنة 1980، وحقل الديانة في صندوق معلوماتها فارغ."
  en: "Arabic Wikipedia stub on Hina Jilani; it gives her birth at Lahore in 1953, the start of her law practice in 1979, and her co-founding with her sister of the first all-women legal aid organisation at Lahore in 1980; the religion field of its infobox stands empty."
  es: "Breve reseña en árabe de Wikipedia sobre Hina Jilani; indica que nació en Lahore en 1953, que comenzó a ejercer la abogacía en 1979 y que cofundó con su hermana la primera organización de asistencia jurídica exclusivamente femenina en Lahore en 1980; el campo de religión de su ficha informativa está vacío."
  fr: "Ébauche de l'article Wikipédia en arabe sur Hina Jilani; il indique sa naissance à Lahore en 1953, le début de sa pratique du droit en 1979 et sa cofondation avec sa sœur de la première organisation d'aide juridique entièrement féminine à Lahore en 1980; le champ religion de son infobox est vide."
  ur: "حنا جیلانی پر عربی ویکیپیڈیا اسٹب؛ اس کی پیدائش 1953 میں لاہور میں ہوئی، 1979 میں اس کی لاء پریکٹس کا آغاز ہوا، اور 1980 میں لاہور میں خواتین کی پہلی قانونی امداد کی تنظیم کی اپنی بہن کے ساتھ اس کی شریک بانی۔ اس کے انفو باکس کا مذہب کا میدان خالی ہے۔"
  tr: "Arapça Wikipedia makalesi Hina Gilani hakkında öz; 1953'te Lahor'da doğduğunu, 1979'da avukatlık yapmasını ve 1980'de kız kardeşiyle birlikte Lahor'da ilk kadın hukuki yardım kuruluşunu kurduğunu anlatıyor; bilgi kutusundaki din alanı boş."
  id: "Artikel Wikipedia berbahasa Arab singkat tentang Hina Gilani; menceritakan kelahirannya di Lahore pada tahun 1953, praktik hukumnya pada tahun 1979, dan pendiriannya bersama saudara perempuannya organisasi bantuan hukum perempuan pertama di Lahore pada tahun 1980, dengan kolom agama di infobox kosong."
