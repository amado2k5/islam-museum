summary:
  ar: "مقالة ويكيبيديا العربية عن وهبي خزري؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته مع باستيا والأندية الفرنسية والإنجليزية ومشاركاته مع تونس في كأس العالم، ويذكر صندوق معلوماتها الديانة «الإسلام» بصيغة عامة."
  en: "Arabic Wikipedia article on Wahbi Khazri; used for entity facts only. It recounts his career with Bastia and his French and English clubs and his World Cup appearances for Tunisia; its infobox gives his religion as Islam, generically."
  es: "Artículo de Wikipedia en árabe sobre Wahbi Khazri; se utiliza únicamente para obtener información sobre la persona. Narra su trayectoria en el Bastia, sus clubes franceses e ingleses y sus participaciones en la Copa del Mundo con Túnez; su ficha informativa indica que su religión es el islam, de forma genérica."
  fr: "Article Wikipédia en arabe sur Wahbi Khazri; utilisé uniquement pour les informations le concernant. Il retrace sa carrière à Bastia, dans ses clubs français et anglais, ainsi que ses participations à la Coupe du monde avec la Tunisie; son infobox indique sa religion comme étant l’islam, de manière générale."
  ur: "وہبی خزری پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں باستیا اور اس کے فرانسیسی اور انگلش کلبوں کے ساتھ ان کے کیریئر اور تیونس کے لیے ورلڈ کپ میں شرکت کا ذکر ہے۔ اس کا انفو باکس عام طور پر اس کا مذہب اسلام دیتا ہے۔"
  tr: "Arapça Vikipedi makalesi Wahbi Khazri hakkında; yalnızca varlığın gerçekleri için kullanılmıştır. Bastia, Fransız ve İngiliz kulüplerindeki kariyerini, Tunus ile Dünya Kupası'ndaki katılımını anlatır ve bilgi kutusunda genel olarak \"İslam\" dininden bahsedilir."
  id: "Artikel Wikipedia berbahasa Arab tentang Wahbi Khazri; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kariernya bersama Bastia, klub Prancis dan Inggris, serta partisipasinya bersama Tunisia di Piala Dunia, dan infobox tersebut menyebutkan agama \"Islam\" dalam bentuk umum."
