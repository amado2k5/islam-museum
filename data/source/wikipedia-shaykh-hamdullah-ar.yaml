summary:
  ar: "مقالة ويكيبيديا العربية «حمد الله الأماسي» ⁦(833–927هـ / 1429–1520م في متنها، و1436 في صندوق معلوماتها)⁩: خطاط عثماني، ابن الشيخ مصطفى دده المهاجر من بخارى إلى أماسيا، تعلم لدى خير الدين المرعشي، وكتب سبعة وأربعين مصحفًا، وتوفي في إسطنبول."
  en: "Arabic Wikipedia article 'Hamdullah al-Amasi' (833–927 AH / 1429–1520 CE in its lead, 1436 in its infobox): the Ottoman calligrapher, son of Shaykh Mustafa Dede who migrated from Bukhara to Amasya, taught by Khayr al-Din al-Mar'ashi, writer of forty-seven Qur'an copies, died in Istanbul."
  es: "Artículo de Wikipedia en árabe 'Hamdullah al-Amasi' (833–927 AH / 1429–1520 CE en su introducción, 1436 en su ficha informativa): el calígrafo otomano, hijo del jeque Mustafa Dede, que emigró de Bujará a Amasya, discípulo de Khayr al-Din al-Mar'ashi, autor de cuarenta y siete copias del Corán, murió en Estambul."
  fr: "Article de Wikipédia en arabe « Hamdullah al-Amasi » (833–927 AH / 1429–1520 CE dans son introduction, 1436 dans son infobox): calligraphe ottoman, fils du cheikh Mustafa Dede qui a émigré de Boukhara à Amasya, élève de Khayr al-Din al-Mar'ashi, auteur de quarante-sept copies du Coran, mort à Istanbul."
  ur: "عربی ویکیپیڈیا کا مضمون 'حمداللہ العماسی' ⁦(833-927 ہجری / 1429-1520 عیسوی اس کی قیادت میں، 1436 اس کے معلوماتی خانے میں)⁩: عثمانی خطاط، شیخ مصطفی دید کے بیٹے جو بخارا سے اماسیہ کی طرف ہجرت کر گئے، خیر المرشیعین القرآن کے مصنف نے پڑھایا۔ کاپیاں، استنبول میں انتقال کر گئیں۔"
  tr: "Arapça Vikipedi makalesi \"Hamd Allah Al-Amasi\" (ana metninde 833–927 Hicri / 1429–1520 M.S., bilgi kutusunda ise 1436): Osmanlı hattatı olan Şeyh Mustafa Dedeh el-Muhacír'in oğlu, Buhara'dan Amasya'ya kadar olan Şeyh Mustafa Dedeh el-Muhacir'in oğlu, Hayreddin el-Mar'aşi'nin yanında eğitim aldı, kırk yedi Kur'an yazdı ve İstanbul'da öldü."
  id: "Artikel Wikipedia Arab \"Hamd Allah Al-Amasi\" (833–927 H / 1429–1520 M dalam teks utamanya, dan 1436 dalam infoboxnya): Seorang kaligrafer Ottoman, putra Sheikh Mustafa Dedeh al-Muhajir dari Bukhara ke Amasya, belajar di bawah Khair al-Din al-Mar'ashi, menulis empat puluh tujuh Al-Qur'an, dan meninggal di Istanbul."
