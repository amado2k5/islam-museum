  ar: "مقالة ويكيبيديا العربية «حمد الله الأماسي» ⁦(833–927هـ / 1429–1520م في متنها، و1436 في صندوق معلوماتها)⁩: خطاط عثماني، ابن الشيخ مصطفى دده المهاجر من بخارى إلى أماسيا، تعلم لدى خير الدين المرعشي، وكتب سبعة وأربعين مصحفًا، وتوفي في إسطنبول."
  en: "Arabic Wikipedia article 'Hamdullah al-Amasi' (833–927 AH / 1429–1520 CE in its lead, 1436 in its infobox): the Ottoman calligrapher, son of Shaykh Mustafa Dede who migrated from Bukhara to Amasya, taught by Khayr al-Din al-Mar'ashi, writer of forty-seven Qur'an copies, died in Istanbul."
