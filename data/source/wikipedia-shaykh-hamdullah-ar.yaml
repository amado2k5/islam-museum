reliability_note: "Encyclopedia article read in full on 3 November 2026 and re-fetched the same day with identical text; the reading tool does not expose the numeric revision id, so none is recorded. The article contradicts itself on the birth year (lead 833 AH/1429 CE against infobox 1436) and on the burial place (text: Abu Ayyub al-Ansari cemetery; infobox: Karacaahmet); both conflicts are disclosed in the person record, which follows the Sakıp Sabancı Museum and the majority of editions on 1436 and Karacaahmet. The article cites the Encyclopaedia of Islam 3 entry (DOI 10.1163/1573-3912_ei3_COM_30255) and the TDV İslâm Ansiklopedisi; neither was read in full for this build."
