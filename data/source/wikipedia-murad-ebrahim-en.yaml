summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مراد إبراهيم ⁦(وُلد 1949)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 15 مايو 1949 في كوتاباتو باسم آهود بالاواغ إبراهيم، وأن «مراد» اسمه الحربي، وقيادته للجبهة الإسلامية لتحرير مورو منذ 2003، وولايته أول رئيس وزراء مؤقت لمنطقة بانجسامورو ذاتية الحكم (2019–2025)."
  en: "English Wikipedia article on Murad Ebrahim (born 1949); used for entity facts only. It gives his birth on 15 May 1949 at Cotabato under the name Ahod Balawag Ebrahim, records that 'Murad' is his nom de guerre, and covers his chairmanship of the Moro Islamic Liberation Front since 2003 and his tenure as the first interim chief minister of the Bangsamoro Autonomous Region in Muslim Mindanao (2019–2025)."
  es: "Artículo de la Wikipedia en inglés sobre Murad Ebrahim (nacido en 1949); utilizado únicamente para datos sobre la persona. Indica que nació el 15 de mayo de 1949 en Cotabato con el nombre de Ahod Balawag Ebrahim, registra que 'Murad' es su nombre de guerra y abarca su presidencia del Frente Moro de Liberación Islámica desde 2003 y su mandato como primer ministro interino de la Región Autónoma de Bangsamoro en Mindanao Musulmán (2019-2025)."
  fr: "Article de Wikipédia en anglais sur Murad Ebrahim (né en 1949); utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 15 mai 1949 à Cotabato sous le nom d’Ahod Balawag Ebrahim, précise que « Murad » est son nom de guerre et aborde sa présidence du Front islamique de libération Moro depuis 2003 ainsi que son mandat de premier ministre par intérim de la Région autonome de Bangsamoro au Mindanao musulman (2019-2025)."
