  ar: "مقالة ويكيبيديا الإنجليزية عن مراد إبراهيم (وُلد 1949)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 15 مايو 1949 في كوتاباتو باسم آهود بالاواغ إبراهيم، وأن «مراد» اسمه الحربي، وقيادته للجبهة الإسلامية لتحرير مورو منذ 2003، وولايته أول رئيس وزراء مؤقت لمنطقة بانجسامورو ذاتية الحكم (2019–2025)."
  en: "English Wikipedia article on Murad Ebrahim (born 1949); used for entity facts only. It gives his birth on 15 May 1949 at Cotabato under the name Ahod Balawag Ebrahim, records that 'Murad' is his nom de guerre, and covers his chairmanship of the Moro Islamic Liberation Front since 2003 and his tenure as the first interim chief minister of the Bangsamoro Autonomous Region in Muslim Mindanao (2019–2025)."
