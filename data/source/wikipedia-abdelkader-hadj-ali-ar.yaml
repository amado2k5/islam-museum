summary:
  ar: "مقالة ويكيبيديا العربية عن عبد القادر الحاج علي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 23 ديسمبر 1883 ببلدة سيدي سعادة بولاية غليزان من عائلة من ملاك الأراضي، وعمله بمعسكر ثم هجرته إلى فرنسا 1905، وانضمامه إلى الحزب الشيوعي الفرنسي 1920، ودوره مؤسسًا وأول رئيس لنجم شمال إفريقيا (1926) قبل تسليم القيادة لمصالي الحاج. لا تذكر ديانة له."
  en: "Arabic Wikipedia article on Abdelkader Hadj Ali; used for entity facts only. It gives his birth on 23 December 1883 at Sidi Saada in Relizane province to a landowning family, his work at Mascara and emigration to France in 1905, his joining the French Communist Party in 1920, and his role as a founder and first president of the Étoile nord-africaine (1926) before handing its leadership to Messali Hadj. It names no religion for him."
  es: "Artículo de Wikipedia en árabe sobre Abdelkader Hadj Ali; utilizado únicamente para datos biográficos. Indica su nacimiento el 23 de diciembre de 1883 en Sidi Saada, provincia de Relizane, en el seno de una familia terrateniente; su trabajo en Mascara y su emigración a Francia en 1905; su ingreso al Partido Comunista Francés en 1920; y su papel como fundador y primer presidente de la Étoile nord-africaine (1926), antes de ceder su liderazgo a Messali Hadj. No menciona su religión."
  fr: "Article de Wikipédia en arabe sur Abdelkader Hadj Ali; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 23 décembre 1883 à Sidi Saada, dans la province de Relizane, au sein d'une famille de propriétaires terriens; son travail à Mascara et son émigration en France en 1905; son adhésion au Parti communiste français en 1920; et son rôle de fondateur et de premier président de l'Étoile nord-africaine (1926), avant d'en céder la direction à Messali Hadj. L'article ne mentionne pas sa religion."
  ur: "عبدالقادر حج علی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 23 دسمبر 1883 کو صوبہ ریلیزانے کے سیدی سعدا میں ایک زمیندار گھرانے میں پیدا ہوا، اس کا کاجل میں کام اور 1905 میں فرانس میں ہجرت، 1920 میں فرانسیسی کمیونسٹ پارٹی میں اس کی شمولیت، اور ایٹائل نورڈ-افریقی کے بانی اور پہلے صدر کے طور پر ان کا کردار ⁦(1926 میں اس کی قیادت میرے حوالے کرنا)⁩۔ اس کے لیے کسی مذہب کا نام نہیں۔"
  tr: "Abdelkader Al-Hajj Ali hakkında Arapça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 23 Aralık 1883'te Relizane Vilayeti'ndeki Sidi Saada kasabasında toprak sahibi bir ailede doğdu, bir kampta çalıştı, ardından 1905'te Fransa'ya göç etti, 1920'de Fransız Komünist Partisi'ne katıldı ve Kuzey Afrika Yıldızı'nın (1926) kurucusu ve ilk başkanı olarak görev yaptıktan sonra liderliği Messali Al-Hajj'a devretti. Kendi dinine ait hiçbir din belirtilmemektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang Abdelkader Al-Hajj Ali hanya digunakan untuk fakta entitas tersebut. Ia lahir pada 23 Desember 1883 di kota Sidi Saada di Wilaya Relizane dari keluarga pemilik tanah, bekerja di sebuah kamp, lalu bermigrasi ke Prancis pada tahun 1905, bergabung dengan Partai Komunis Prancis pada tahun 1920, dan menjalankan perannya sebagai pendiri dan presiden pertama North African Star (1926) sebelum menyerahkan kepemimpinan kepada Messali Al-Hajj. Tidak ada agama agamanya yang disebutkan."
