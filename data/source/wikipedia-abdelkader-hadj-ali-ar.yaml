summary:
  ar: "مقالة ويكيبيديا العربية عن عبد القادر الحاج علي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 23 ديسمبر 1883 ببلدة سيدي سعادة بولاية غليزان من عائلة من ملاك الأراضي، وعمله بمعسكر ثم هجرته إلى فرنسا 1905، وانضمامه إلى الحزب الشيوعي الفرنسي 1920، ودوره مؤسسًا وأول رئيس لنجم شمال إفريقيا (1926) قبل تسليم القيادة لمصالي الحاج. لا تذكر ديانة له."
  en: "Arabic Wikipedia article on Abdelkader Hadj Ali; used for entity facts only. It gives his birth on 23 December 1883 at Sidi Saada in Relizane province to a landowning family, his work at Mascara and emigration to France in 1905, his joining the French Communist Party in 1920, and his role as a founder and first president of the Étoile nord-africaine (1926) before handing its leadership to Messali Hadj. It names no religion for him."
