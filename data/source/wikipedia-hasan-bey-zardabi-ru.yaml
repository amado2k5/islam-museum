summary:
  ar: مقالة ويكيبيديا الروسية عن حسن بك زردابي؛ تُستخدم لوقائع الكيان فقط. تعطي مقدمتها مولده في 28 يونيو 1837 ووفاته في باكو في 28 نوفمبر 1907، وتنص في معتقده على أنه كان مسلمًا سنيًا، ناقلة عن «الصحافة الدورية في القوقاز» ⁦(تفليس، 1901، ص 50)⁩.
  en: Russian Wikipedia article on Hasan bey Zardabi (Gasanbek Zardabi); used for entity facts only. Its lead gives his birth on 28 June 1837 and death at Baku on 28 November 1907, and it states of his confession that he was a Muslim-Sunni, citing Periodical Press in the Caucasus (Tiflis, 1901, p. 50).
  es: "Artículo de la Wikipedia rusa sobre Hasan bey Zardabi (Gasanbek Zardabi); utilizado únicamente para datos sobre la persona. En su introducción se indica que nació el 28 de junio de 1837 y falleció en Bakú el 28 de noviembre de 1907, y se menciona su confesión de ser musulmán sunita, citando la publicación Periodical Press in the Caucasus (Tiflis, 1901, p. 50)."
  fr: "Article de Wikipédia en russe sur Hasan bey Zardabi (Gasanbek Zardabi); utilisé uniquement pour les informations sur l’entité. Son introduction indique sa naissance le 28 juin 1837 et sa mort à Bakou le 28 novembre 1907, et mentionne sa confession de musulman sunnite, citant la presse périodique du Caucase (Tiflis, 1901, p. 50)."
  ur: "حسن بے زردابی پر روسی ویکیپیڈیا مضمون ⁦(گاسن بیک زردابی)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ 28 جون 1837 کو اس کی پیدائش اور 28 نومبر 1907 کو باکو میں انتقال کرتا ہے، اور اس میں اس کے اعتراف کے بارے میں بتایا گیا ہے کہ وہ ایک مسلم سنی تھا، قفقاز میں متواتر پریس کا حوالہ دیتے ہوئے ⁦(تفلس، 1901، صفحہ 50)⁩۔"
  tr: "Hassan Bek Zerdabi hakkında Rusça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Girişinde 28 Haziran 1837'de doğduğu ve 28 Kasım 1907'de Bakü'de öldüğü belirtilir ve inancında \"Kafkasya'daki Periyodik Basın\"dan alıntı yaparak Sünni Müslüman olduğunu belirtir (Tiflis, 1901, s. 50)."
  id: "Artikel Wikipedia Rusia tentang Hassan Bek Zardabi; digunakan hanya untuk fakta entitas tersebut. Pendahuluannya menceritakan kelahirannya pada 28 Juni 1837, dan kematiannya di Baku pada 28 November 1907, serta menyatakan dalam keyakinannya bahwa ia adalah Muslim Sunni, mengutip dari \"Pers Berkala di Kaukasus\" (Tbilisi, 1901, hlm. 50)."
