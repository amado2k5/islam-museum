  en: Russian Wikipedia article on Hasan bey Zardabi (Gasanbek Zardabi); used for entity facts only. Its lead gives his birth on 28 June 1837 and death at Baku on 28 November 1907, and it states of his confession that he was a Muslim-Sunni, citing Periodical Press in the Caucasus (Tiflis, 1901, p. 50).
