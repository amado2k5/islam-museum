summary:
  ar: "مقالة ويكيبيديا العربية عن ماجد عبد الله؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل ماجد أحمد محمد عبد الله، وميلاده في 11 يناير 1959 في جدة، وأصله السوداني، ومسيرته مع النصر والمنتخب، وتروي أنه أدى عمرة عن والده المتوفى في العشر الأواخر من رمضان سنة 2000."
  en: "Arabic Wikipedia article on Majed Abdullah; used for entity facts only. It gives his full name as Majed Ahmed Mohammed Abdullah, his birth on 11 January 1959 in Jeddah and his Sudanese origin, his career with Al-Nassr and the national team, and recounts that he performed Umrah on behalf of his late father in the last ten days of Ramadan in 2000."
  es: "Artículo de Wikipedia en árabe sobre Majed Abdullah; utilizado únicamente para datos sobre la persona. Indica su nombre completo como Majed Ahmed Mohammed Abdullah, su fecha de nacimiento el 11 de enero de 1959 en Yeda y su origen sudanés, su trayectoria en el Al-Nassr y la selección nacional, y relata que realizó la Umrah en nombre de su difunto padre durante los últimos diez días del Ramadán del año 2000."
  fr: "Article de Wikipédia en arabe sur Majed Abdullah; utilisé uniquement à des fins d’information sur l’entité. Il indique son nom complet: Majed Ahmed Mohammed Abdullah, sa date de naissance: 11 janvier 1959 à Djeddah, ses origines soudanaises, sa carrière au sein du club Al-Nassr et de l’équipe nationale, et relate qu’il a accompli la Omra en mémoire de son défunt père durant les dix derniers jours du Ramadan 2000."
  ur: "مجید عبداللہ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا پورا نام مجید احمد محمد عبداللہ بتایا گیا ہے، ان کی پیدائش 11 جنوری 1959 کو جدہ میں ہوئی تھی اور ان کی اصل سوڈانی تھی، الناصر اور قومی ٹیم کے ساتھ ان کا کیریئر تھا، اور بتایا گیا ہے کہ انہوں نے 2000 میں رمضان کے آخری دس دنوں میں اپنے مرحوم والد کی جانب سے عمرہ ادا کیا تھا۔"
