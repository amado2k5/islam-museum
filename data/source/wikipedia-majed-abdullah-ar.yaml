  ar: "مقالة ويكيبيديا العربية عن ماجد عبد الله؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل ماجد أحمد محمد عبد الله، وميلاده في 11 يناير 1959 في جدة، وأصله السوداني، ومسيرته مع النصر والمنتخب، وتروي أنه أدى عمرة عن والده المتوفى في العشر الأواخر من رمضان سنة 2000."
  en: "Arabic Wikipedia article on Majed Abdullah; used for entity facts only. It gives his full name as Majed Ahmed Mohammed Abdullah, his birth on 11 January 1959 in Jeddah and his Sudanese origin, his career with Al-Nassr and the national team, and recounts that he performed Umrah on behalf of his late father in the last ten days of Ramadan in 2000."
