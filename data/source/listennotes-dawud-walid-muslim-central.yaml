reliability_note: "The page of his own lecture podcast on Muslim Central, the platform that carries his channel's audio; a primary source for his identity, offices and output, not independent corroboration (founder's sourcing ladder, 24 Oct 2026). Consulted 26 October 2026. Its biography describes him as a prominent American Islamic scholar, author and activist serving as executive director of CAIR-MI, a Senior Fellow at Auburn Seminary in New York and an active member of the Imams Council of Michigan, respected for advocacy on civil rights, anti-racism and Islamic spirituality, and lists his books: Blackness and Islam, Towards Sacred Activism, the two Centering Black Narrative volumes (co-authored), and Futuwwah and Raising Males Into Sacred Manhood. It names no legal school or order for him."
