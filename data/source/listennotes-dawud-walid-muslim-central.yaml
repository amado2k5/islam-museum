summary:
  ar: "صفحة بودكاست داود وليد على منصة مسلم سنترال: عالم وداعية ومؤلف أمريكي، المدير التنفيذي لفرع ميشيغان من مجلس العلاقات الأمريكية الإسلامية ⁦(كير)⁩، وزميل أقدم في معهد أوبورن، وعضو مجلس أئمة ميشيغان، ومؤلف كتب منها «السواد والإسلام» و«نحو نشاط مقدس» و«الفتوة وتربية الرجال»."
  en: "Podcast page for Dawud Walid on Muslim Central: an American Islamic scholar, author and activist, executive director of the Michigan chapter of the Council on American-Islamic Relations (CAIR-MI), a Senior Fellow at Auburn Seminary and a member of the Imams Council of Michigan, and author of Blackness and Islam, Towards Sacred Activism and Futuwwah and Raising Males Into Sacred Manhood."
  es: "Página del podcast de Dawud Walid en Muslim Central: un erudito islámico estadounidense, autor y activista, director ejecutivo del capítulo de Michigan del Consejo de Relaciones Americano-Islámicas (CAIR-MI), miembro sénior del Seminario de Auburn y miembro del Consejo de Imanes de Michigan, y autor de Blackness and Islam, Towards Sacred Activism y Futuwwah and Raising Males Into Sacred Manhood."
  fr: "Page de podcast pour Dawud Walid sur Muslim Central: un érudit islamique américain, auteur et militant, directeur exécutif de la section du Michigan du Conseil des relations américano-islamiques (CAIR-MI), chercheur principal au séminaire d’Auburn et membre du Conseil des imams du Michigan, et auteur de Blackness and Islam, Towards Sacred Activism and Futuwwah and Raising Males Into Sacred Manhood."
  ur: "مسلم سنٹرل پر داؤد ولید کے لیے پوڈ کاسٹ صفحہ: ایک امریکی اسلامی اسکالر، مصنف اور کارکن، کونسل آن امریکن-اسلامک ریلیشنز (CAIR-MI) کے مشی گن باب کے ایگزیکٹو ڈائریکٹر، آبرن سیمینری کے سینئر فیلو اور مشی گن کی امامس کونسل کے رکن، اور بلیک نیس اینڈ اسلام کے مصنف، مقدسات اور مقدسات کی طرف متوجہ ہیں۔ مردانگی"
  tr: "Dawood Waleed'in Muslim Central üzerine podcast sayfası: Amerikalı akademisyen, vaiz ve yazar, Amerikan-İslami İlişkiler Konseyi'nin (CARE) Michigan şubesinin icra direktörü, Auburn Enstitüsü'nde kıdemli araştırmacı, Michigan İmamlar Konseyi üyesi ve \"Siyahlık ve İslam\", \"Kutsal Bir Faaliyete Doğru\" ve \"Zorbalık ve Erkek Eğitimi\" gibi kitapların yazarı."
  id: "Halaman podcast Dawood Waleed tentang Muslim Central: cendekiawan Amerika, pengkhotbah, dan penulis, direktur eksekutif cabang Michigan Council on American-Islamic Relations (CARE), peneliti senior di Auburn Institute, anggota Michigan Council of Imams, dan penulis buku-buku seperti \"Blackness and Islam,\" \"Toward a Sacred Activity,\" dan \"Bullying and Men's Education.\""
