summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن المياسة بنت حمد آل ثاني، رئيسة متاحف قطر ومؤسسة معهد الدوحة للأفلام؛ تذكر مولدها في 29 سبتمبر 1983 في جنيف، ووالديها حمد بن خليفة آل ثاني وموزا بنت ناصر، ودراستها في جامعة ديوك وباريس، وتأسيسها منظمة أيادي الخير نحو آسيا، وزواجها سنة 2006."
  en: "English Wikipedia article on Al-Mayassa bint Hamad Al Thani, chairperson of Qatar Museums and founder of the Doha Film Institute; it gives her birth on 29 September 1983 in Geneva, her parents Hamad bin Khalifa Al Thani and Moza bint Nasser, her studies at Duke University and in Paris, her founding of Reach Out To Asia, and her 2006 marriage."
  es: "Artículo de la Wikipedia en inglés sobre Al-Mayassa bint Hamad Al Thani, presidenta de los Museos de Qatar y fundadora del Instituto de Cine de Doha; en él se indica que nació el 29 de septiembre de 1983 en Ginebra, quiénes eran sus padres, Hamad bin Khalifa Al Thani y Moza bint Nasser, sus estudios en la Universidad de Duke y en París, la fundación de Reach Out To Asia y su matrimonio en 2006."
  fr: "L'article de Wikipédia en anglais sur Al-Mayassa bint Hamad Al Thani, présidente des musées du Qatar et fondatrice de l'Institut du film de Doha; il indique sa naissance le 29 septembre 1983 à Genève, ses parents Hamad bin Khalifa Al Thani et Moza bint Nasser, ses études à l'université Duke et à Paris, la création de Reach Out To Asia et son mariage en 2006."
  ur: "قطر کے عجائب گھروں کی چیئرپرسن اور دوحہ فلم انسٹی ٹیوٹ کی بانی المیاسہ بنت حمد الثانی پر انگریزی ویکیپیڈیا کا مضمون؛ اس کی پیدائش 29 ستمبر 1983 کو جنیوا میں ہوئی، اس کے والدین حماد بن خلیفہ الثانی اور موزا بنت ناصر، ڈیوک یونیورسٹی اور پیرس میں اس کی تعلیم، اس کی ریچ آؤٹ ٹو ایشیا کی بنیاد، اور اس کی 2006 میں شادی ہوئی۔"
  tr: "Katar Müzeleri ve Doha Film Enstitüsü Vakfı Başkanı Al-Mayassa bint Hamad Al Thani hakkında İngilizce Wikipedia makalesi; 29 Eylül 1983'te Cenevre'de doğduğu, ebeveynleri Hamad bin Halife Al Thani ve Moza bint Nasser, Duke ve Paris üniversitelerindeki eğitimi, Asya'ya İyilik Elleri Organizasyonu'nu kurması ve 2006'daki evliliği belirtilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Al-Mayassa bint Hamad Al Thani, Presiden Qatar Museums dan Doha Film Institute Foundation; artikel tersebut menyebutkan kelahirannya pada 29 September 1983 di Jenewa, orang tuanya Hamad bin Khalifa Al Thani dan Moza bint Nasser, studinya di universitas Duke dan Paris, mendirikan Hands of Goodness Organization towards Asia, dan pernikahannya pada tahun 2006."
