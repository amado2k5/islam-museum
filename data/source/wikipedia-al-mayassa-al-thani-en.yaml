  ar: "مقالة ويكيبيديا الإنجليزية عن المياسة بنت حمد آل ثاني، رئيسة متاحف قطر ومؤسسة معهد الدوحة للأفلام؛ تذكر مولدها في 29 سبتمبر 1983 في جنيف، ووالديها حمد بن خليفة آل ثاني وموزا بنت ناصر، ودراستها في جامعة ديوك وباريس، وتأسيسها منظمة أيادي الخير نحو آسيا، وزواجها سنة 2006."
  en: "English Wikipedia article on Al-Mayassa bint Hamad Al Thani, chairperson of Qatar Museums and founder of the Doha Film Institute; it gives her birth on 29 September 1983 in Geneva, her parents Hamad bin Khalifa Al Thani and Moza bint Nasser, her studies at Duke University and in Paris, her founding of Reach Out To Asia, and her 2006 marriage."
