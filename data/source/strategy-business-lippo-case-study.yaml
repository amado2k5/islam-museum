  ar: "دراسة حالة مجلة strategy+business ⁦(العدد 4، 1996)⁩ بقلم روزابيث موس كانتر من كلية هارفارد للأعمال عن مجموعة ليبو؛ تصف بناء مختار ريادي شبكته المالية العالمية، وتقول إن الكونفوشيوسية فلسفته الموجهة وإن المسيحية مصدر روحانيته."
  en: "strategy+business magazine case study (Issue 4, 1996) by Rosabeth Moss Kanter of Harvard Business School on the Lippo Group; it describes how Mochtar Riady built his global financial network, and states that Confucianism is his guiding philosophy and Christianity the source of his spirituality."
  es: "Estudio de caso de la revista strategy+business (número 4, 1996) realizado por Rosabeth Moss Kanter de la Harvard Business School sobre el Grupo Lippo; describe cómo Mochtar Riady construyó su red financiera global y afirma que el confucianismo es su filosofía rectora y el cristianismo la fuente de su espiritualidad."
  fr: "Étude de cas du magazine strategy+business (numéro 4, 1996) par Rosabeth Moss Kanter de la Harvard Business School sur le groupe Lippo; elle décrit comment Mochtar Riady a construit son réseau financier mondial et affirme que le confucianisme est sa philosophie directrice et le christianisme la source de sa spiritualité."
  ur: "حکمت عملی+بزنس میگزین کیس اسٹڈی ⁦(4 شمارہ، 1996)⁩ لیپو گروپ پر ہارورڈ بزنس اسکول کی روزابتھ ماس کانٹر کی طرف سے؛ اس میں بتایا گیا ہے کہ موختار ریاڈی نے اپنا عالمی مالیاتی نیٹ ورک کیسے بنایا، اور کہا کہ کنفیوشس ازم اس کا رہنما فلسفہ ہے اور عیسائیت اس کی روحانیت کا ماخذ ہے۔"
