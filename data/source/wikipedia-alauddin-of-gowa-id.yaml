reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Its bibliography rests on Cummings, A Chain of Kings: The Makassarese Chronicles of Gowa and Talloq (KITLV Press, 2007). It gives his father Tunijalloq, his birth name I Mangerangi and noble title I Daeng Manrabbia, his conversion by Datuk ri Bandang on 22 September 1605, the campaigns against Bone, the forts Ana Gowa and Garassi, his open-trade declaration, his falling ill at Cikkoang on 10 June 1639 and his death five days later at Somba Opu; its infobox gives birth in 1586, death on 15 June 1639, reign 1593–1639, and his religion as 'Animism, then Islam'. The article's Hijri date for the conversion ('9 Jumada al-awwal 1051 AH') is internally impossible — 1051 AH fell in 1641–42 CE — and is not used. It names no branch or school for him."
