summary:
  ar: "مقالة ويكيبيديا الأردية الموجزة عن عبد الحميد الدبيبة؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 13 فبراير 1958 وتوجز تعيينه رئيسًا لوزراء حكومة الوحدة الوطنية عبر ملتقى الحوار السياسي الليبي في فبراير 2021. وسنة ولادتها 1958 تخالف 1959 الواردة في المقالتين الإنجليزية والعربية وفي ويكي بيانات."
  en: "Urdu Wikipedia stub on Abdul Hamid Dbeibeh; used for entity facts only. It gives his birth as 13 February 1958 and summarises his appointment as prime minister of the Government of National Unity through the Libyan Political Dialogue Forum in February 2021. Its 1958 birth year conflicts with the 1959 given by the English and Arabic articles and by Wikidata."
  es: "Breve entrada en urdu de la Wikipedia sobre Abdul Hamid Dbeibeh; se utiliza únicamente para datos sobre la persona. Indica que nació el 13 de febrero de 1958 y resume su nombramiento como primer ministro del Gobierno de Unidad Nacional a través del Foro de Diálogo Político Libio en febrero de 2021. Su año de nacimiento de 1958 contradice el de 1959 que aparece en los artículos en inglés y árabe, así como en Wikidata."
  fr: "Ébauche de l'article Wikipédia en ourdou sur Abdul Hamid Dbeibeh; utilisée uniquement à des fins d'information sur l'entité. Elle indique sa date de naissance comme étant le 13 février 1958 et résume sa nomination comme Premier ministre du Gouvernement d'union nationale par le Forum de dialogue politique libyen en février 2021. L'année de naissance 1958 mentionnée est en contradiction avec l'année 1959 indiquée par les articles en anglais et en arabe, ainsi que par Wikidata."
  ur: "عبدالحمید دبیبہ پر اردو ویکیپیڈیا اسٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 13 فروری 1958 ہے اور فروری 2021 میں لیبیا پولیٹیکل ڈائیلاگ فورم کے ذریعے قومی اتحاد کی حکومت کے وزیر اعظم کے طور پر ان کی تقرری کا خلاصہ پیش کیا گیا ہے۔ اس کا 1958 پیدائش کا سال انگریزی اور عربی مضامین اور وکی ڈیٹا کے ذریعہ دیے گئے 1959 سے متصادم ہے۔"
