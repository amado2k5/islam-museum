summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن داليا مجاهد؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها في القاهرة وتفتتح بسنة 1975، وعملها في غالوب ومعهد السياسات الاجتماعية والتفاهم، وكتابها المشترك «من يتحدث باسم الإسلام؟»، ولا تسمّي لها مذهبًا."
  en: "English Wikipedia article on Dalia Mogahed; used for entity facts only. It gives her birth in Cairo — its lead year is 1975 — her Gallup and ISPU work and her co-authored book 'Who Speaks for Islam?', and names no school for her."
  es: "Artículo de la Wikipedia en inglés sobre Dalia Mogahed; utilizado únicamente para datos sobre la persona. Indica que nació en El Cairo —su año principal es 1975—, su trabajo para Gallup e ISPU y su libro, del que es coautora, «¿Quién habla por el Islam?», pero no menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en anglais sur Dalia Mogahed; utilisé uniquement pour les informations la concernant. Il indique sa naissance au Caire (l’année de référence est 1975), ses travaux pour Gallup et l’ISPU, ainsi que son ouvrage coécrit « Qui parle au nom de l’islam ? », mais ne mentionne aucun établissement scolaire à son nom."
  ur: "Dalia Mogahed پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے قاہرہ میں اس کی پیدائش کی ہے - اس کا مرکزی سال 1975 ہے - اس کا گیلپ اور ISPU کام اور اس کی شریک تصنیف 'Who Speaks for Islam؟'، اور اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Dalia Mujahid hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kahire'de doğduğu ve 1975'te açıldığını, Gallup ve Sosyal Politika ve Anlayış Enstitüsü'ndeki çalışmalarını ve ortak kitabı \"Kim İslam Adına Konuşur?\" adlı kitabını belirtiyor. ve kendisi adına bir mezhep adı vermiyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Dalia Mujahid; hanya digunakan untuk fakta entitas. Dia menyebutkan kelahirannya di Kairo dan dibuka pada tahun 1975, karyanya di Gallup dan Institute for Social Policy and Understanding, serta buku bersamanya \"Who Speaks in the Name of Islam?\", dan tidak menyebutkan sekte untuknya."
