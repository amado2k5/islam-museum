summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زينب علواني؛ تُستخدم لوقائع الكيان فقط. تروي ولادتها في بغداد سنة 1962، وفرار أسرتها من العراق، ودراستها في جامعة الإمام محمد بن سعود الإسلامية، ودكتوراهها في أصول الفقه من الجامعة الإسلامية العالمية في ماليزيا، وكونها أول امرأة تجلس في مجلس الفقه لأمريكا الشمالية، ومنصبها أستاذة مشاركة للدراسات الإسلامية في كلية اللاهوت بجامعة هوارد."
  en: "English Wikipedia article on Zainab Alwani; used for entity facts only. It recounts her birth in Baghdad in 1962, her family's flight from Iraq, her study at Imam Mohammad Ibn Saud Islamic University, her PhD in Islamic jurisprudence from the International Islamic University Malaysia, her position as the first female jurist on the Fiqh Council of North America board, and her post as Associate Professor of Islamic Studies at Howard University School of Divinity."
