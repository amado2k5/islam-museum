reliability_note: "Read in the museum's session on 20 November 2026. It calls the book one of the oldest Arabic dictionaries arranged by roots and unique among them in combining the alphabetical order of letters (a, b, t, th, not articulation points as in al-Ayn) with al-Khalil's permutation system; says Ibn Durayd divided the book by pattern, from biliteral to quinqueliteral, with several sections in each chapter (sound, weak, doubled, extended), which made its structure complicated and put some roots in different chapters; and notes that the preface's claim that he chose the common speech of the Arabs and left aside the strange and rare does not fit the book's contents, which include rare and unfamiliar material. Used for entity facts only."
