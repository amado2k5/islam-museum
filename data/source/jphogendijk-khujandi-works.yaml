reliability_note: "Actual complete page read 2026-11-15 (dated 'Jan Hogendijk 2024' at foot). For the Comprehensive Instrument it records: bibliographic keys GAS VI p. 221 no. 1, RI p. 100 no. A1; no published edition or translation (Richard Lorch's unfinished work noted via Historia Mathematica 58, 2022); five manuscripts — Oxford Huntington 566, Birmingham 560, Bursa Haraççıoğlu 1217 (leaves reproduced in Sezgin 2010 vol. 2 pp. 152-153), Cairo Dār al-Kutub miqat 970 (King 1986 p. 40 no. B50, one leaf p. 276), Tehran Nasiri-library autograph copied by Hibatallah; Hibatallah's commentary modified the instrument for all latitudes against al-Khujandi's single-latitude design, extant with the original in Birmingham 560 and the Tehran autograph; a related text possibly in Oxford Marsh 663 ff. 163-189 (Rosenthal, Osiris 9, 1950); al-Marrakushi's timekeeping compendium Jāmiʿ al-mabādiʾ wa-l-ghāyāt fī ʿilm al-mīqāt presents the instrument apparently in Hibatallah's version without naming either author; the anonymous Berlin treatise (Ahlwardt 5857, Sprenger 1877) derived from al-Marrakushi, whose instrument Schirmer identified as al-Khujandi's via Ibn al-Qifti's Taʾrīkh al-Ḥukamāʾ; Hajji Khalifa (Katib Celebi) lists it as a horizontal plate called the comprehensive among the astrolabes, sixty chapters, plus a second version in a preliminary and fifteen chapters; Sezgin's catalogue reconstructs the original version at vol. 2 pp. 151-153. The same page documents the signed astrolabe in Doha's Museum of Islamic Art (374 H on the reverse). Personal scholarly page, not peer-reviewed, but the standard working bibliography for this author; manuscript shelfmarks and printed-page locators are precise and checkable."
