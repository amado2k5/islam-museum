summary:
  ar: "مدخل «ترجمان» في موسوعة TDV الإسلامية التركية. القسم الأول يتتبع الكلمة من اللغات السامية إلى ترجمان النبي، ثم إلى دواوين الأمويين والعباسيين والسلاجقة، وإلى نقل الكتب. والقسم الثاني يتتبع المترجم في الدولة العثمانية من أول الإشارات الدبلوماسية إلى رئيس المترجمين وغرفة الترجمة."
  en: "The TDV İslâm Ansiklopedisi entry on the tercüman. The first part follows the word from the Semitic languages to the Prophet's interpreter, then to the Umayyad, Abbasid and Seljuk chanceries, and to the translation of books. The second part follows the interpreter in the Ottoman state from the earliest diplomatic notices to the chief interpreter and the translation office."
