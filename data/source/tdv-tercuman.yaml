summary:
  ar: "مدخل «ترجمان» في موسوعة TDV الإسلامية التركية. القسم الأول يتتبع الكلمة من اللغات السامية إلى ترجمان النبي، ثم إلى دواوين الأمويين والعباسيين والسلاجقة، وإلى نقل الكتب. والقسم الثاني يتتبع المترجم في الدولة العثمانية من أول الإشارات الدبلوماسية إلى رئيس المترجمين وغرفة الترجمة."
  en: "The TDV İslâm Ansiklopedisi entry on the tercüman. The first part follows the word from the Semitic languages to the Prophet's interpreter, then to the Umayyad, Abbasid and Seljuk chanceries, and to the translation of books. The second part follows the interpreter in the Ottoman state from the earliest diplomatic notices to the chief interpreter and the translation office."
  es: "Entrada del TDV İslâm Ansiklopedisi sobre el término tercüman. La primera parte sigue la evolución de la palabra desde las lenguas semíticas hasta el intérprete del Profeta, pasando por las cancillerías omeya, abasí y selyúcida, y la traducción de libros. La segunda parte sigue la trayectoria del intérprete en el Estado otomano desde las primeras notificaciones diplomáticas hasta el intérprete jefe y la oficina de traducción."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le tercüman. La première partie retrace l'évolution du mot, des langues sémitiques à l'interprète du Prophète, puis aux chancelleries omeyyade, abbasside et seldjoukide, et enfin à la traduction des livres. La seconde partie suit le rôle de l'interprète dans l'État ottoman, depuis les premières communications diplomatiques jusqu'à l'interprète en chef et le bureau de traduction."
  ur: "TDV İslâm Ansiklopedisi tercüman پر اندراج۔ پہلا حصہ سامی زبانوں سے نبی کے مترجم تک، پھر اموی، عباسی اور سلجوقی حکومتوں اور کتابوں کے ترجمے کے لیے آتا ہے۔ دوسرا حصہ عثمانی ریاست میں مترجم کی پیروی کرتا ہے جو ابتدائی سفارتی نوٹس سے لے کر چیف مترجم اور ترجمے کے دفتر کو دیتا ہے۔"
  tr: "Türk İslami TDV Ansiklopedisi'nde 'Tarcuman' kaydı. İlk bölüm, kelimeyi Sami dillerinden Peygamber'in çevirmenine, ardından Emeviyeler, Abbasiler ve Selçukluların ofislerine ve kitap transferine kadar izler. İkinci bölüm, Osmanlı devletindeki çevirmeni en erken diplomatik referanslardan başlayıp çevirmenlerin başına ve çeviri odasına kadar izler."
  id: "Entri 'Tarjuman' dalam Ensiklopedia Islam Turki TDV. Bagian pertama menelusuri kata dari bahasa Semit ke penerjemah Nabi, kemudian ke kantor Umayyah, Abbasiyah, dan Seljuk, serta transfer buku. Bagian kedua menelusuri penerjemah di negara Ottoman dari referensi diplomatik paling awal ke kepala penerjemah dan ruang penerjemahan."
