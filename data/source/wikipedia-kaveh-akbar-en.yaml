reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). It records his birth in Tehran on 15 January 1989 to an Iranian father and a German-American mother, the family's move to the United States when he was two, his degrees from Purdue, Butler University and Florida State University, the poetry collections Calling a Wolf a Wolf (2017) and Pilgrim Bell (2021), the novel Martyr! (2024), his founding of Divedapper, his poetry editorship of The Nation, his direction of the University of Iowa undergraduate creative writing programme, his 2024 Guggenheim Fellowship and TIME100 Next listing, and his marriage to the poet Paige Lewis. It names no religion for him; his faith is attested only in the interview sources registered separately."
