reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). It records her birth in Tehran in 1962 (year only), her schooling in Trinidad and Eastbourne, her degrees at George Washington University, Northwestern University and Johns Hopkins University, her seven poetry collections and plays, her translations of Farrokhzad (Sin, 2007) and of Attar (The Conference of the Birds, 2017; The Invisible Sun, 2025), her anthology The Forbidden (2012), her Lois Roth Persian Translation Award of 2010 and PEN/Heim grant of 2014, her inaugural UCLA writer-in-residence post in 2018 and her present UC Irvine residency, and her life with her husband, the sociologist Edward Telles, in Barcelona and Irvine. It names no religion for her."
