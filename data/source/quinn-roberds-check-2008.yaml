summary:
  ar: "مسح تاريخي من البنك الاحتياطي الفيدرالي في أتلانتا؛ يفتتح بوصف ناصر خسرو للصك في البصرة مطلع القرن الحادي عشر ويسجّل اختلاف المشتقّين في نسبة كلمة check الإنجليزية إلى صك."
  en: "A Federal Reserve Bank of Atlanta historical survey; opens with Nasir-i Khusraw's early-eleventh-century Basra description of the sakk and records the disagreement between Ashtor's sakk etymology of 'check' and the Oxford derivation."
  ur: "فیڈرل ریزرو بینک آف اٹلانٹا کا تاریخی جائزہ؛ ناصر خسرو کے گیارہویں صدی کے بصرہ میں صک کے بیان سے شروع ہوتا اور انگریزی check کی اشتقاق پر آشٹر اور آکسفورڈ کے اختلاف محفوظ کرتا ہے۔"
  es: "Un estudio histórico del Banco de la Reserva Federal de Atlanta; comienza con la descripción del sakk que Nasir-i Khusraw hizo a principios del siglo XI en Basora y registra el desacuerdo entre la etimología de Ashtor para sakk, que significa \"cheque\", y la derivación de Oxford."
  fr: "Une étude historique de la Banque fédérale de réserve d'Atlanta; elle s'ouvre sur la description du sakk par Nasir-i Khusraw au début du XIe siècle à Bassora et relate le désaccord entre l'étymologie du sakk d'Ashtor, qui signifie « chèque », et la dérivation d'Oxford."
  tr: "Atlanta Federal Rezerv Bankası'ndan tarihsel bir inceleme; Nasir Khusraw'ın on birinci yüzyılın başında Basra'daki aracı tanımlamasıyla başlar ve İngilizce check kelimesinin tapu olarak atfedilmesi konusundaki türevler arasındaki farklılıkları kaydeder."
  id: "Survei sejarah dari Federal Reserve Bank of Atlanta; dibuka dengan deskripsi Nasir Khusraw tentang instrumen tersebut di Basra pada awal abad kesebelas dan mencatat perbedaan antar derivatif terkait atribusi kata Inggris check pada akta."
title: "The Evolution of the Check as a Means of Payment: A Historical Survey"
