  ar: "مقالة ويكيبيديا الأردية عن شهباز شريف؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 23 سبتمبر 1951، ووالده ميان محمد شريف صاحب مجموعة اتفاق وشقيقه نواز شريف، وولاياته الثلاث رئيسا لوزراء البنجاب، ومنفاه وعودته سنة 2007، ورئاسته للوزراء. وتضعه في تصنيف «سنة باكستانيون»."
  en: "Urdu Wikipedia article on Shehbaz Sharif; used for entity facts only. It gives his birth on 23 September 1951, his father Mian Muhammad Sharif of the Ittefaq Group and his brother Nawaz Sharif, his three terms as chief minister of Punjab, his exile and return in 2007, and his premierships. It files him in a 'Pakistani Sunnis' category."
