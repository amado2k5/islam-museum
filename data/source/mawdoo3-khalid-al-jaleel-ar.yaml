  ar: "مقالة موقع موضوع (Mawdoo3) عن القارئ خالد الجليل؛ تُستخدم لوقائع الكيان فقط لأنه لا توجد له مقالة ويكيبيديا ولا عنصر ويكيداتا: اسمه الكامل خالد بن فهد الجليل المطيري، وُلد في الرياض سنة 1963، وهو إمام وخطيب مسجد الملك خالد بالرياض منذ رمضان 2008."
  en: "Mawdoo3's article on the reciter Khalid Al-Jaleel; used for entity facts only, as he has no Wikipedia article and no Wikidata item: his full name is Khalid bin Fahd Al-Jaleel Al-Mutairi, he was born in Riyadh in 1963, and he has been imam and khateeb of the King Khalid Mosque in Riyadh since Ramadan 2008."
