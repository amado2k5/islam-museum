summary:
  ar: "مقالة موقع موضوع (Mawdoo3) عن القارئ خالد الجليل؛ تُستخدم لوقائع الكيان فقط لأنه لا توجد له مقالة ويكيبيديا ولا عنصر ويكيداتا: اسمه الكامل خالد بن فهد الجليل المطيري، وُلد في الرياض سنة 1963، وهو إمام وخطيب مسجد الملك خالد بالرياض منذ رمضان 2008."
  en: "Mawdoo3's article on the reciter Khalid Al-Jaleel; used for entity facts only, as he has no Wikipedia article and no Wikidata item: his full name is Khalid bin Fahd Al-Jaleel Al-Mutairi, he was born in Riyadh in 1963, and he has been imam and khateeb of the King Khalid Mosque in Riyadh since Ramadan 2008."
  es: "Artículo de Mawdoo3 sobre el recitador Khalid Al-Jaleel; utilizado únicamente para datos sobre la persona, ya que no tiene artículo en Wikipedia ni entrada en Wikidata: su nombre completo es Khalid bin Fahd Al-Jaleel Al-Mutairi, nació en Riad en 1963 y ha sido imán y predicador de la Mezquita Rey Khalid en Riad desde el Ramadán de 2008."
  fr: "Article de Mawdoo3 sur le récitant Khalid Al-Jaleel; utilisé uniquement pour les informations sur l'entité, car il n'a pas d'article Wikipédia ni d'élément Wikidata: son nom complet est Khalid bin Fahd Al-Jaleel Al-Mutairi, il est né à Riyad en 1963 et il est imam et khatib de la mosquée du roi Khalid à Riyad depuis le Ramadan 2008."
  ur: "قاری خالد الجلیل پر مودو 3 کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، کیونکہ اس کے پاس کوئی ویکیپیڈیا مضمون نہیں ہے اور نہ ہی کوئی ویکیڈیٹا آئٹم ہے: اس کا پورا نام خالد بن فہد الجلیل المطیری ہے، وہ 1963 میں ریاض میں پیدا ہوا تھا، اور وہ رمضان 2008 سے ریاض میں کنگ خالد مسجد کے امام اور خطیب ہیں۔"
  tr: "Mawdoo3 web sitesinde okuyucu Khalid Al-Jalil hakkında yer alan makale, yalnızca varlığın gerçekleri için kullanılmıştır çünkü onun Wikipedia makalesi veya Wikiveri girdisi yoktur: tam adı Khalid bin Fahd Al-Jalil Al-Mutairi, 1963 Riyad doğumlu ve 2008 Ramazanı'ndan beri Riyad'daki Kral Halid Camii'nin imamı ve vaizidir."
  id: "Artikel di situs Mawdoo3 tentang pembaca Khalid Al-Jalil hanya digunakan untuk fakta entitas tersebut karena ia tidak memiliki artikel Wikipedia atau entri Wikidata: nama lengkapnya Khalid bin Fahd Al-Jalil Al-Mutairi, lahir di Riyadh pada tahun 1963, dan ia telah menjadi imam serta pengkhotbah Masjid Raja Khalid di Riyadh sejak Ramadan 2008."
