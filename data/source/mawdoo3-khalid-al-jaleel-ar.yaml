reliability_note: "Read in full on 26 October 2026. Mawdoo3 is a general Arabic reference platform; this article (with its companion short article on the same site, one source family) is the fullest biography found for him — searches of Arabic, English, Urdu, Indonesian and Malay Wikipedia and of Wikidata on 26 October 2026 found no article and no item (a Wikidata item exists for a different man, Khalid al-Jalili, Q12209895). The article gives: Khalid bin Fahd Al-Jaleel Al-Mutairi, a Saudi reciter born in Riyadh in 1963 (its statement that he is 54 years old is stale and is not used); certificates in recitation and mastery of the ten readings, and a complete recording of the Qur'an in the Hafs reading; appointed imam and khateeb of the King Khalid Mosque in Riyadh by the King Khalid Charitable Foundation in Ramadan 2008, succeeding Adel Al-Kalbani; an unofficial website made by admirers; his official YouTube channel named as 'the official channel of Sheikh Khalid Al-Jaleel' (youtube.com/user/oo2111). It names no school, madhhab or creed for him."
