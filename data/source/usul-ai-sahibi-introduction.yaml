summary:
  ar: "صفحة الصاحبي في فقه اللغة على موقع Usul.ai ⁦(دار الكتب العلمية، بيروت، 1997)⁩، وهي بحسب الملخص البحثي تُظهر مقدمة المحقق موقّعة من أحمد حسن بسج في بيروت يوم 21 شعبان 1417هـ، الموافق 1 يناير 1997م. ذُكرت هذه الصفحة في ملخص بحثي قُدّم إلى المتحف وأجاز المؤسس استعماله في 21 نوفمبر 2026؛ ولم يفتح المتحف الصفحة نفسها."
  en: "The Usul.ai page of al-Sahibi fi Fiqh al-Lugha (Dar al-Kutub al-Ilmiyya, Beirut, 1997), which, according to the research summary, shows the editor's introduction signed by Ahmad Hasan Basaj at Beirut on 21 Sha'ban 1417 AH / 1 January 1997. The page was named in a research summary supplied to the museum and approved for use by the founder on 21 November 2026; the museum did not open it."
  ur: "Usul.ai پر الصاحبی فی فقہ اللغۃ ⁦(دار الکتب العلمیہ، بیروت، 1997)⁩ کا صفحہ، جو تحقیقی خلاصے کے مطابق مدیر کا مقدمہ دکھاتا ہے جس پر احمد حسن بسج کے بیروت میں 21 شعبان 1417ھ، یعنی یکم جنوری 1997ء کے دستخط ہیں۔ اس صفحے کا ذکر عجائب گھر کو دیے گئے ایک تحقیقی خلاصے میں تھا جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی؛ عجائب گھر نے یہ صفحہ خود نہیں کھولا۔"
  fr: "La page d'Usul.ai d'al-Sahibi fi Fiqh al-Lugha (Dar al-Kutub al-Ilmiyya, Beyrouth, 1997), qui, selon le résumé de recherche, montre l'introduction de l'éditeur signée par Ahmad Hasan Basaj à Beyrouth le 21 sha'ban 1417 H / 1er janvier 1997. La page est nommée dans un résumé de recherche remis au musée et approuvé pour usage par le fondateur le 21 novembre 2026 ; le musée ne l'a pas ouverte."
  es: "La página de Usul.ai de al-Sahibi fi Fiqh al-Lugha (Dar al-Kutub al-Ilmiyya, Beirut, 1997), que según el resumen de investigación muestra la introducción del editor firmada por Ahmad Hasan Basaj en Beirut el 21 de sha'ban de 1417 H / 1 de enero de 1997. La página figura en un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026; el museo no la abrió."
  tr: "Al-Sahibi'nin Usul.ai web sitesindeki Fiqh al-Lugha sayfası (Dar al-Kutub al-Ilmiyya, Beyrut, 1997), araştırma özetine göre, editörün girişini Ahmad Hassan Basij tarafından 21 Şa'ban 1417 Hile tarihinde Beyrut'ta imzaladığını ve 1 Ocak 1997'ye karşılık geldiğini göstermektedir. Bu sayfa, müzeye sunulan ve kurucu tarafından 21 Kasım 2026'da yetkilendirilen bir araştırma özetinde bahsedilmiştir; müze sayfayı kendisi açmamıştır."
  id: "Halaman Al-Sahibi tentang Fiqh al-Lugha di situs web Usul.ai (Dar al-Kutub al-Ilmiyya, Beirut, 1997), yang menurut abstrak penelitian, menunjukkan pengantar editor yang ditandatangani oleh Ahmad Hassan Basij di Beirut pada 21 Sha'ban 1417 H, sesuai dengan 1 Januari 1997. Halaman ini disebutkan dalam ringkasan penelitian yang diserahkan ke museum dan disetujui oleh pendiri pada 21 November 2026; museum tidak membuka halaman itu sendiri."
