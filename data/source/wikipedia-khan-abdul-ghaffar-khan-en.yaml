  ar: "مقالة ويكيبيديا الإنجليزية عن خان عبد الغفار خان؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أوتمانزاي سنة 1890 في أسرة محمدزية بشتونية سنية مسلمة، وتأسيسه حركة خداي خدمتگار 1929، ولاعنفه وصداقته لغاندي، ومعارضته تقسيم الهند وقرار بانو، وسنوات سجنه في باكستان، ووفاته في بيشاور سنة 1988 ودفنه في جلال آباد."
  en: "English Wikipedia article on Khan Abdul Ghaffar Khan; used for entity facts only. It recounts his 1890 birth at Utmanzai into a Sunni Muslim Muhammadzai Pashtun family, his founding of the Khudai Khidmatgar in 1929, his nonviolence and friendship with Gandhi, his opposition to Partition and the Bannu Resolution, his years of imprisonment in Pakistan, and his death at Peshawar in 1988 and burial at Jalalabad."
