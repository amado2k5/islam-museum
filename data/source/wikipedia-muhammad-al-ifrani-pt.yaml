summary:
  ar: "مقالة ويكيبيديا البرتغالية عن محمد الصغير الإفراني؛ تُستخدم لوقائع الكيان فقط. تعطي عمره بمراكش 1669/1670–1743~1747، ودراسته بفاس، واحتمال شغله منصباً في بلاط مولاي إسماعيل، وعمله إماماً وخطيباً في المدرسة اليوسفية ⁦(مدرسة ابن يوسف)⁩ بمراكش."
  en: "Portuguese Wikipedia article on Maomé Alifrani; used for entity facts only. It gives his lifespan as Marrakesh 1669/1670 – 1743~1747, his studies at Fes, a probable post at Moulay Ismail's court, and his service as imam and khatib of the Ben Yusuf Madrasa at Marrakesh. Its death range is the widest of the texts read and anchors the upper readings in the person record's debated died block."
  es: "Artículo de la Wikipedia en portugués sobre Maomé Alifrani; utilizado únicamente para datos sobre la persona. Indica que vivió en Marrakech entre 1669/1670 y 1743-1747, estudió en Fez, ocupó un probable cargo en la corte de Moulay Ismail y fue imán y khatib de la madrasa Ben Yusuf en Marrakech. El rango de fechas de su fallecimiento es el más amplio de los textos consultados y sirve de base para las lecturas superiores en el bloque de fechas de fallecimiento que genera debate en el registro de la persona."
  fr: "L'article de Wikipédia en portugais sur Maomé Alifrani, utilisé uniquement pour les informations relatives à l'entité, indique sa vie à Marrakech de 1669/1670 à 1743-1747, ses études à Fès, un poste probable à la cour de Moulay Ismaïl, et son service comme imam et khatib de la médersa Ben Yusuf à Marrakech. La période de décès indiquée est la plus large parmi les textes consultés et permet de situer les dates les plus anciennes dans la partie de la fiche relative au décès qui fait débat."
