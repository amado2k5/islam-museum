  ar: "مقالة ويكيبيديا البرتغالية عن محمد الصغير الإفراني؛ تُستخدم لوقائع الكيان فقط. تعطي عمره بمراكش 1669/1670–1743~1747، ودراسته بفاس، واحتمال شغله منصباً في بلاط مولاي إسماعيل، وعمله إماماً وخطيباً في المدرسة اليوسفية (مدرسة ابن يوسف) بمراكش."
