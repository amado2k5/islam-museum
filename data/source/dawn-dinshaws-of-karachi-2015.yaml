reliability_note: "Newspaper feature read in full on 3 November 2026. It opens: 'This is the story of a Parsi father and his son... The father was Edulji Dinshaw, and the son Nadirshaw Edulji Dinshaw', and it reports F. K. Dada Chalji calling the family's charitable drive the 'Zartashi jigra' (Zoroastrian spirit). This is a person-level attestation of Parsi identity in an independent text, and with the English article's lead it settles the record's zoroastrian value under the lane's two-text rule. Its figures for the Lady Dufferin Fund differ slightly from the English article's (it has the Dinshaws' total at Rs 85,000 against a committee and province total of Rs 15,000, with Rs 50,000 given in 1894); the record's prose follows the article on the fund."
