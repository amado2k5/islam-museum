summary:
  ar: مقالة ويكيبيديا الإنجليزية عن علي باش حانبة؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس سنة 1876 في أسرة من أصل تركي ووفاته في 29 أكتوبر 1918، ودراسته القانون في فرنسا، وتأسيسه مع البشير صفر حركة الشباب التونسي وجريدة «التونسي» سنة 1907، ونفيه سنة 1912. لا تذكر المقالة دينًا أو مذهبًا له.
  en: English Wikipedia article on Ali Bach Hamba; used for entity facts only. It gives his birth in Tunis in 1876 into a family of Turkish origin and his death on 29 October 1918, his legal studies in France, his co-founding with Béchir Sfar of the Young Tunisians and the newspaper Le Tunisien in 1907, and his exile in 1912. The article states no religion or school for him.
  es: "Artículo de la Wikipedia en inglés sobre Ali Bach Hamba; utilizado únicamente para datos biográficos. Indica su nacimiento en Túnez en 1876 en una familia de origen turco y su fallecimiento el 29 de octubre de 1918, sus estudios de derecho en Francia, su cofundación, junto con Béchir Sfar, de los Jóvenes Tunecinos y del periódico Le Tunisien en 1907, y su exilio en 1912. El artículo no menciona su religión ni su formación académica."
  fr: "L'article de Wikipédia en anglais consacré à Ali Bach Hamba, utilisé uniquement pour les informations biographiques, indique sa naissance à Tunis en 1876 dans une famille d'origine turque, son décès le 29 octobre 1918, ses études de droit en France, la fondation, avec Béchir Sfar, des Jeunes Tunisiens et du journal Le Tunisien en 1907, ainsi que son exil en 1912. L'article ne mentionne ni sa religion ni son parcours scolaire."
  ur: "علی بچ حمبا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1876 میں تیونس میں ایک ترک نژاد خاندان میں پیدا ہوا اور 29 اکتوبر 1918 کو اس کی موت، فرانس میں اس کی قانونی تعلیم، 1907 میں ینگ تیونس کے بیچیر سفار اور اخبار لی تیونسیئن کے ساتھ اس کی شریک بانی، اور 1912 میں اس کی جلاوطنی۔ مضمون اس کے لیے کوئی مذہب یا اسکول نہیں بتاتا ہے۔"
