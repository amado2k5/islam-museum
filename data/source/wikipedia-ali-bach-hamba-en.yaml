  ar: مقالة ويكيبيديا الإنجليزية عن علي باش حانبة؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس سنة 1876 في أسرة من أصل تركي ووفاته في 29 أكتوبر 1918، ودراسته القانون في فرنسا، وتأسيسه مع البشير صفر حركة الشباب التونسي وجريدة «التونسي» سنة 1907، ونفيه سنة 1912. لا تذكر المقالة دينًا أو مذهبًا له.
  en: English Wikipedia article on Ali Bach Hamba; used for entity facts only. It gives his birth in Tunis in 1876 into a family of Turkish origin and his death on 29 October 1918, his legal studies in France, his co-founding with Béchir Sfar of the Young Tunisians and the newspaper Le Tunisien in 1907, and his exile in 1912. The article states no religion or school for him.
