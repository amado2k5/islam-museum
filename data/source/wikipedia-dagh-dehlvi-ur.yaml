reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. A traditional Urdu biography, independent in wording of the English article: it gives his birth on 25 May 1831 at Delhi, his father's early death, his mother's marriage to Mirza Fakhru, his poetic formation under Zauq, his twenty-four years at Rampur under Nawabs Yusuf Ali Khan and Kalb Ali Khan, his court titles at Hyderabad, and his death there by paralysis in 1905. Its infobox misnames him 'Mirza Muhammad Ibrahim' — that is Zauq's name, an error in that article's infobox only; its text names him Nawab Mirza Khan throughout. Its text makes no statement of his religion or school."
