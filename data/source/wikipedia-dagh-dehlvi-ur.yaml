summary:
  ar: "مقالة ويكيبيديا الأردية عن داغ دهلوي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في دلهي في 25 مايو 1831، ونشأته في القلعة الحمراء، وسنواته الأربع والعشرين في رامبور، ووفاته في حيدر آباد سنة 1905، وتصنّفه في الشخصيات المسلمة الهندية تصنيفًا لا نصًّا."
  en: "Urdu Wikipedia article on Dagh Dehlvi; used for entity facts only. It recounts his birth in Delhi on 25 May 1831, his upbringing in the Red Fort, his twenty-four years at Rampur and his death at Hyderabad in 1905; its categories file him under Indian Muslim personalities, a filing and not a textual attestation."
  es: "Artículo de Wikipedia en urdu sobre Dagh Dehlvi; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Delhi el 25 de mayo de 1831, su crianza en el Fuerte Rojo, sus veinticuatro años en Rampur y su muerte en Hyderabad en 1905; sus categorías lo clasifican dentro de las personalidades musulmanas indias, una clasificación y no una constancia textual."
  fr: "Article de Wikipédia en ourdou sur Dagh Dehlvi; utilisé uniquement à titre informatif. Il relate sa naissance à Delhi le 25 mai 1831, son enfance au Fort Rouge, ses vingt-quatre années à Rampur et sa mort à Hyderabad en 1905; ses catégories le classent parmi les personnalités musulmanes indiennes, un classement et non une attestation textuelle."
  ur: "داغ دہلوی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 25 مئی 1831 کو دہلی میں ان کی پیدائش، لال قلعہ میں ان کی پرورش، رام پور میں ان کے چوبیس سال اور حیدرآباد میں 1905 میں ان کی موت کا ذکر ہے۔ اس کے زمرے اسے ہندوستانی مسلم شخصیات کے تحت فائل کرتے ہیں، ایک فائلنگ نہ کہ متنی تصدیق۔"
  tr: "Dag Dehlavi hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 25 Mayıs 1831'de Delhi'de doğduğunu, Kızıl Kale'de büyümesini, Rampur'daki yirmi dört yılını ve 1905'te Haydarabad'daki ölümünü anlatır ve onu bir tür olarak sınıflandırır, bir metin değil."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Dag Dehlavi; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Delhi pada 25 Mei 1831, masa kecilnya di Benteng Merah, dua puluh empat tahun di Rampur, dan kematiannya di Hyderabad pada tahun 1905, serta mengklasifikasikannya sebagai tokoh Muslim India sebagai sebuah tipe, bukan teks."
