  ar: "مقالة ويكيبيديا الأردية عن داغ دهلوي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في دلهي في 25 مايو 1831، ونشأته في القلعة الحمراء، وسنواته الأربع والعشرين في رامبور، ووفاته في حيدر آباد سنة 1905، وتصنّفه في الشخصيات المسلمة الهندية تصنيفًا لا نصًّا."
  en: "Urdu Wikipedia article on Dagh Dehlvi; used for entity facts only. It recounts his birth in Delhi on 25 May 1831, his upbringing in the Red Fort, his twenty-four years at Rampur and his death at Hyderabad in 1905; its categories file him under Indian Muslim personalities, a filing and not a textual attestation."
