summary:
  ar: "مقال رأي لكاتب مسلم نُشر في موقع الجامعة الإسلامية العالمية بماليزيا، يرى أن الوحي لا يثبت الحياة الفضائية ولا ينفيها وأن هذا الصمت علامة على أن العلم بها ليس لازماً."
  en: "An opinion essay by a Muslim writer on the International Islamic University Malaysia news site, holding that revelation neither affirms nor denies extraterrestrial life and that its silence signals the knowledge is not needed."
  es: "Un artículo de opinión de un escritor musulmán publicado en el sitio web de noticias de la Universidad Islámica Internacional de Malasia sostiene que la revelación no afirma ni niega la vida extraterrestre y que su silencio indica que no se necesita ese conocimiento."
  fr: "Un article d'opinion publié sur le site d'information de l'Université islamique internationale de Malaisie par un auteur musulman affirme que la révélation ne confirme ni n'infirme l'existence de vie extraterrestre et que son silence indique que cette connaissance n'est pas nécessaire."
  ur: "بین الاقوامی اسلامی یونیورسٹی ملائیشیا کی نیوز سائٹ پر ایک مسلمان مصنف کا ایک رائے مضمون، جس میں کہا گیا ہے کہ یہ انکشاف نہ تو زمینی زندگی کی تصدیق کرتا ہے اور نہ ہی اس کی تردید کرتا ہے اور اس کی خاموشی اس بات کا اشارہ دیتی ہے کہ علم کی ضرورت نہیں ہے۔"
