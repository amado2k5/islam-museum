summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الرحمن السديس؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بالبكيرية يوم 25 جمادى الآخرة 1382 هـ الموافق 22 نوفمبر 1962، وحفظه القرآن في الثانية عشرة، ودراسته بالرياض وأم القرى، وإمامته للحرم من 1404 هـ، ورئاسته لشؤون الحرمين 2012 ثم للشؤون الدينية 2023؛ ولا يسمي نصها مذهبا له، وتصنفه تصنيفاتها في الحنابلة والسلفيين السعوديين."
  en: "Arabic Wikipedia article on Abdul Rahman Al-Sudais; used for entity facts only. It gives his birth at Al-Bukayriyah on 25 Jumada al-Akhirah 1382 AH, 22 November 1962, citing the al-Shamela library and his official website, his memorisation of the Qur'an at twelve, his studies at Riyadh and Umm al-Qura, his imamate of the Grand Mosque from 1404 AH, and his presidency of the Two Holy Mosques' affairs from 2012 and of religious affairs from 2023; its text names no school for him, while its categories file him among Hanbalis and Saudi Salafis."
