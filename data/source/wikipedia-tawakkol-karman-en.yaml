reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers her birth on 7 February 1979 in Shara'b As Salam, Taiz Governorate, her father Abdel Salam Karman (a lawyer and former minister of legal affairs), her education (University of Science and Technology; University of Sana'a; a master's in international security from the University of Massachusetts Lowell; an honorary doctorate from the University of Alberta, 2012), the founding of Women Journalists Without Chains in 2005, the weekly Sana'a protests from 2007, her arrests in January and March 2011, the 2011 Nobel Peace Prize shared with Ellen Johnson Sirleaf and Leymah Gbowee, her senior membership of Al-Islah and her suspension from it in 2018, her Turkish citizenship (2012), her exile in Istanbul after the Houthi takeover of Sana'a, Belqees TV (founded 2014, closed in late 2025 after a Moroccan complaint, as the article reports), her seat on Facebook's Oversight Board (2020) and her 2023 earthquake relief work. The article's text calls her the mother of three children while its infobox says four; the text figure is used and the discrepancy is recorded in the prose. Read in full on 24 October 2026."
