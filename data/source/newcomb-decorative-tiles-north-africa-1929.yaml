summary:
  ar: "كراسة من سلسلة «دراسات معمارية في البلاط وأعماله» ⁦(رقم 7)⁩ لأستاذ تاريخ العمارة في جامعة إلينوي، نشرتها رابطة صانعي البلاط، تعرض عمارة المغرب الكبير وخزفه المعماري في تونس والجزائر والمغرب الأقصى."
  en: "No. 7 of the series Architectural Monographs on Tiles and Tilework, by the professor of architectural history at the University of Illinois, published by Associated Tile Manufacturers; it surveys Maghrebi architecture and architectural ceramics in Tunisia, Algeria and Morocco."
  es: "Número 7 de la serie Monografías arquitectónicas sobre azulejos y trabajos de azulejo, del profesor de historia de la arquitectura de la Universidad de Illinois, publicada por Associated Tile Manufacturers; en ella se examina la arquitectura magrebí y la cerámica arquitectónica en Túnez, Argelia y Marruecos."
  fr: "Le numéro 7 de la série Architectural Monographs on Tiles and Tilework, par le professeur d'histoire de l'architecture de l'Université de l'Illinois, publié par Associated Tile Manufacturers; il présente un panorama de l'architecture maghrébine et de la céramique architecturale en Tunisie, en Algérie et au Maroc."
  ur: "ٹائلز اور ٹائل ورک پر آرکیٹیکچرل مونوگرافس سیریز کا نمبر 7، الینوائے یونیورسٹی میں آرکیٹیکچرل ہسٹری کے پروفیسر کے ذریعہ، ایسوسی ایٹڈ ٹائل مینوفیکچررز کے ذریعہ شائع کیا گیا ہے۔ یہ تیونس، الجزائر اور مراکش میں مقریبی فن تعمیر اور آرکیٹیکچرل سیرامکس کا سروے کرتا ہے۔"
  tr: "Illinois Üniversitesi mimarlık tarihi profesörü tarafından yayımlanan ve Kiremitler Derneği tarafından yayımlanan \"Sarayda Mimarlık Çalışmaları ve Eserlerinde Mimarlık Çalışmaları\" (No. 7) serisinden bir broşür, Tunus, Cezayir ve Magrip'teki Mağrip'in mimarisi ve mimari seramiklerini sunmaktadır."
  id: "Sebuah buku kecil dari seri \"Studi Arsitektur di Pengadilan dan Karyanya\" (No. 7) oleh seorang profesor sejarah arsitektur di University of Illinois, yang diterbitkan oleh Tilemakers Association, menyajikan arsitektur dan keramik arsitektur Maghreb di Tunisia, Aljazair, dan Maghreb."
