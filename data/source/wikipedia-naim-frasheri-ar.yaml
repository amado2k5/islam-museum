reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article: it names him an Albanian writer, historian, poet and translator, the national poet of Albania and, with his brothers Sami and Abdyl, a figure of the Albanian National Awakening; it gives the dates 25 May 1846 – 20 October 1900; its short works list dates Lulet e verës to 1890, Qerbelaja to 1894 (against 1898 in the English and Albanian articles — recorded as a conflict), Histori e Skënderbeut to 1898 and Histori e Shqipërisë to 1899. It carries no statement about his religion."
