  ar: "مقالة ويكيبيديا الأردية عن حسني مبارك؛ تُستخدم لوقائع الكيان فقط. تؤكد ولادته سنة 1928 ورئاسته لمصر ووفاته سنة 2020، ويذكر صندوق معلوماتها دينه «أهل سنت» مع وسم «مطلوب مصدر» منذ 2011."
