  ar: "مقالة ويكيبيديا الإنجليزية عن فنسنت تان (وُلد في 23 شباط 1952 في باتو باهات)، مؤسس مجموعة برجايا الماليزية ومالك أندية كارديف سيتي وساراييفو وكورتريك؛ تذكر نشأته ومسيرته من موظف بنك وبائع تأمين إلى بناء برجايا، وأعماله الخيرية عبر مؤسسة ماليزيا الأفضل وتبرعاته لصالح ميرسي ماليزيا وتزو تشي ماليزيا."
  en: "English Wikipedia article on Vincent Tan (born 23 February 1952 at Batu Pahat), founder of Malaysia's Berjaya Corporation and owner of Cardiff City, FK Sarajevo and KV Kortrijk; it covers his start as a bank clerk and insurance salesman, the building of Berjaya, and his philanthropy through the Better Malaysia Foundation and donations to Mercy Malaysia and Tzu Chi Malaysia."
