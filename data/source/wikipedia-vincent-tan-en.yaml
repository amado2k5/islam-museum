summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فنسنت تان ⁦(وُلد في 23 شباط 1952 في باتو باهات)⁩، مؤسس مجموعة برجايا الماليزية ومالك أندية كارديف سيتي وساراييفو وكورتريك؛ تذكر نشأته ومسيرته من موظف بنك وبائع تأمين إلى بناء برجايا، وأعماله الخيرية عبر مؤسسة ماليزيا الأفضل وتبرعاته لصالح ميرسي ماليزيا وتزو تشي ماليزيا."
  en: "English Wikipedia article on Vincent Tan (born 23 February 1952 at Batu Pahat), founder of Malaysia's Berjaya Corporation and owner of Cardiff City, FK Sarajevo and KV Kortrijk; it covers his start as a bank clerk and insurance salesman, the building of Berjaya, and his philanthropy through the Better Malaysia Foundation and donations to Mercy Malaysia and Tzu Chi Malaysia."
  es: "Artículo de la Wikipedia en inglés sobre Vincent Tan (nacido el 23 de febrero de 1952 en Batu Pahat), fundador de la corporación malasia Berjaya y propietario del Cardiff City, el FK Sarajevo y el KV Kortrijk; abarca sus inicios como empleado de banca y vendedor de seguros, la creación de Berjaya y su filantropía a través de la Better Malaysia Foundation y sus donaciones a Mercy Malaysia y Tzu Chi Malaysia."
  fr: "Article de Wikipédia en anglais sur Vincent Tan (né le 23 février 1952 à Batu Pahat), fondateur de la Berjaya Corporation en Malaisie et propriétaire de Cardiff City, du FK Sarajevo et du KV Kortrijk; il couvre ses débuts comme employé de banque et vendeur d'assurances, la construction de Berjaya et sa philanthropie à travers la Better Malaysia Foundation et des dons à Mercy Malaysia et Tzu Chi Malaysia."
  ur: "ونسنٹ ٹین پر انگریزی ویکیپیڈیا کا مضمون ⁦(23 فروری 1952 کو بٹو پہاڑ میں پیدا ہوا)⁩، ملائیشیا کی برجایا کارپوریشن کے بانی اور کارڈف سٹی کے مالک، FK Sarajevo اور KV Kortrijk؛ اس میں بینک کلرک اور انشورنس سیلز مین کے طور پر ان کی شروعات، برجایا کی عمارت، اور بیٹر ملائیشیا فاؤنڈیشن کے ذریعے ان کی انسان دوستی اور مرسی ملائیشیا اور زو چی ملائیشیا کو عطیات شامل ہیں۔"
  tr: "Malezya Perjaya Grubu'nun kurucusu ve Cardiff City, Saraybosna ile Kortrijk kulüplerinin sahibi Vincent Tan (23 Şubat 1952, Batu Bahat doğumlu) hakkında İngilizce Wikipedia makalesi, banka çalışanı ve sigorta satıcısı olarak Perjaya'yı inşa etmeye, Better Malaysia Vakfı aracılığıyla yaptığı hayır çalışmalarına ve Mercy Malaysia ile Tzu Chi Malaysia'ya yaptığı bağışlardan bahseder."
  id: "Artikel Wikipedia bahasa Inggris tentang Vincent Tan (lahir 23 Februari 1952 di Batu Bahat), pendiri Malaysian Perjaya Group dan pemilik klub Cardiff City, Sarajevo, dan Kortrijk, menyebutkan masa kecil dan kariernya dari pegawai bank dan penjual asuransi hingga membangun Perjaya, kerja amalnya melalui Better Malaysia Foundation, serta donasinya kepada Mercy Malaysia dan Tzu Chi Malaysia."
