summary:
  ar: "مرجع كلاسيكي في تاريخ النار الحربية والبارود؛ يعالج مصنّف الحسن الرماح ⁦(ت 694/1294-95)⁩ «كتاب الفروسية والمناصب الحربية» بالتفصيل، ويصف تطهيره البارودَ ⁦(الملح)⁩ برماد الخشب والتبلور ويعدّه أول بيان واضح عرفه للعملية."
  en: "The classic history of incendiary warfare and gunpowder; it treats al-Hasan al-Rammah's (d. 1294-95) Kitab al-Furusiyya wa'l-manasib al-harbiyya in detail, describes his purification of saltpetre (barud) with wood ashes and crystallisation, and calls it the first clear account of the process known to the author."
  ur: "یونانی آگ اور بارود کی معیاری تاریخ؛ حسن رماح ⁦(وفات 1294-95)⁩ کی کتاب الفروسیۃ والمناصب الحربیۃ کا تفصیلی علاج، ملحِ بارود کی تصفیہ ⁦(لکڑی کی راکھ اور تبلور)⁩ کا بیان، جسے مؤلف نے اپنے عہد کا پہلا واضح بیان کہا۔"
  es: "La historia clásica de la guerra incendiaria y la pólvora; trata en detalle el Kitab al-Furusiyya wa'l-manasib al-harbiyya de al-Hasan al-Rammah (m. 1294-95), describe su purificación del salitre (barud) con cenizas de madera y cristalización, y lo considera el primer relato claro del proceso conocido por el autor."
