summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حمد بن عيسى آل خليفة؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في الرفاع في 28 يناير 1950، وتدريبه العسكري في بريطانيا والولايات المتحدة، وقيادته لقوة دفاع البحرين، وخلافته لوالده عيسى أميرًا في 6 مارس 1999، وإعلانه البحرين مملكةً ودستورَ 2002، واحتجاجات 2011 وقمعها. يقرأ حقل الدين في صندوق معلوماتها «الإسلام السنّي»، ويصف متنها الملكيةَ بأنها سنّية دون أن ينسب مذهبًا إليه شخصيًا."
  en: "English Wikipedia article on Hamad bin Isa Al Khalifa; used for entity facts only. It recounts his birth in Riffa on 28 January 1950, his military training in Britain and the United States, his command of the Bahrain Defence Force, his succession to his father Isa as Emir on 6 March 1999, his declaration of Bahrain as a kingdom with the 2002 constitution, and the 2011 protests and their suppression. Its infobox religion field reads 'Sunni Islam'; its text calls the monarchy Sunni Muslim without attributing a school to him personally."
