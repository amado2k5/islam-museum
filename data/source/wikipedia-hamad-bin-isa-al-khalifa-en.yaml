summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حمد بن عيسى آل خليفة؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في الرفاع في 28 يناير 1950، وتدريبه العسكري في بريطانيا والولايات المتحدة، وقيادته لقوة دفاع البحرين، وخلافته لوالده عيسى أميرًا في 6 مارس 1999، وإعلانه البحرين مملكةً ودستورَ 2002، واحتجاجات 2011 وقمعها. يقرأ حقل الدين في صندوق معلوماتها «الإسلام السنّي»، ويصف متنها الملكيةَ بأنها سنّية دون أن ينسب مذهبًا إليه شخصيًا."
  en: "English Wikipedia article on Hamad bin Isa Al Khalifa; used for entity facts only. It recounts his birth in Riffa on 28 January 1950, his military training in Britain and the United States, his command of the Bahrain Defence Force, his succession to his father Isa as Emir on 6 March 1999, his declaration of Bahrain as a kingdom with the 2002 constitution, and the 2011 protests and their suppression. Its infobox religion field reads 'Sunni Islam'; its text calls the monarchy Sunni Muslim without attributing a school to him personally."
  es: "Artículo de la Wikipedia en inglés sobre Hamad bin Isa Al Khalifa; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Riffa el 28 de enero de 1950, su formación militar en Gran Bretaña y Estados Unidos, su mando de las Fuerzas de Defensa de Baréin, su sucesión de su padre Isa como emir el 6 de marzo de 1999, su declaración de Baréin como reino con la constitución de 2002, y las protestas de 2011 y su represión. El campo de religión de su ficha informativa indica «Islam suní»; el texto se refiere a la monarquía como musulmana suní sin atribuirle ninguna escuela religiosa en particular."
  fr: "Article de Wikipédia en anglais sur Hamad bin Isa Al Khalifa; utilisé uniquement pour les informations relatives à l'entité. Il relate sa naissance à Riffa le 28 janvier 1950, sa formation militaire en Grande-Bretagne et aux États-Unis, son commandement des Forces de défense de Bahreïn, son accession au titre d'émir à la suite de son père Isa le 6 mars 1999, la proclamation du Bahreïn comme royaume avec la constitution de 2002, ainsi que les manifestations de 2011 et leur répression. L'infobox « Religion » indique « Islam sunnite »; le texte qualifie la monarchie de musulmane sunnite sans lui attribuer d'école religieuse."
  ur: "حمد بن عیسیٰ الخلیفہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں رففا میں 28 جنوری 1950 کو ان کی پیدائش، برطانیہ اور امریکہ میں ان کی فوجی تربیت، بحرین ڈیفنس فورس کی کمانڈ، 6 مارچ 1999 کو اپنے والد عیسیٰ کے امیر کے طور پر ان کی جانشینی، 2002 کے آئین کے ساتھ بحرین کو ایک مملکت کے طور پر اعلان کرنے، اور 2011 کے ان کے مظاہروں کو دبانے کا ذکر ہے۔ اس کا infobox مذہب کا میدان پڑھتا ہے 'سنی اسلام'؛ اس کا متن بادشاہت کو سنی مسلمان کہتا ہے بغیر کسی مکتب کو ذاتی طور پر منسوب کئے۔"
  tr: "Hamad bin İsa Al Halife hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 28 Ocak 1950'de Riffa'da doğmasını, Britanya ve Amerika Birleşik Devletleri'ndeki askeri eğitimini, Bahreyn Savunma Kuvvetleri'nin liderliğini, 6 Mart 1999'da babası İsa'nın Emir olarak devre dışı bırakılmasını, Bahreyn'i krallık ilan etmesi ve 2002 anayasasını ve 2011 protestolarını ve bunların bastırılmasını anlatır. Haql al-Din, bilgi kutusunda 'Sünni İslam' diye okur ve monarşiyi Sünni olarak tanımlar, ancak kendisine şahsen herhangi bir mezhep atfetmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Hamad bin Isa Al Khalifa; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Riffa pada 28 Januari 1950, pelatihan militernya di Inggris dan Amerika Serikat, kepemimpinannya di Angkatan Pertahanan Bahrain, suksesi ayahnya Isa sebagai Emir pada 6 Maret 1999, deklarasi Bahrain sebagai kerajaan dan konstitusi 2002, serta protes dan penindasan mereka pada 2011. Haql al-Din membaca di infobox 'Islam Sunni,' dan menggambarkan monarki sebagai Sunni tanpa mengaitkan sekte apa pun dengannya secara pribadi."
