summary:
  ar: "صفحة هبة قطب في دليل «من هي في مصر» لخبيرات مصر، الصادر عن ملتقى المرأة والذاكرة: منصبها أستاذة للطب الشرعي بجامعة القاهرة، وشهاداتها، وأدوارها الاستشارية، وأربعة تكريمات."
  en: "Heba Kotb's entry in the Women and Memory Forum's directory of Egyptian women experts: her post as Professor of Forensic Medicine at Cairo University, her degrees, her consultancies and four honours."
  es: "La entrada de Heba Kotb en el directorio de expertas egipcias del Foro Mujeres y Memoria incluye: su cargo como profesora de Medicina Forense en la Universidad de El Cairo, sus títulos académicos, sus consultorías y cuatro distinciones."
  fr: "La fiche d'Heba Kotb dans le répertoire des expertes égyptiennes du Forum Femmes et Mémoire: son poste de professeure de médecine légale à l'université du Caire, ses diplômes, ses missions de conseil et ses quatre distinctions."
  ur: "خواتین اور میموری فورم کی مصری خواتین ماہرین کی ڈائرکٹری میں ہیبا کوتب کا داخلہ: قاہرہ یونیورسٹی میں فارنزک میڈیسن کے پروفیسر کے طور پر ان کا عہدہ، اس کی ڈگریاں، اس کی مشاورت اور چار اعزازات۔"
  tr: "Kadınlar ve Hafıza Forumu tarafından yayımlanan Mısırlı kadın uzmanlar için 'O kimdir' rehberinde Heba Kotb'un sayfası: Kahire Üniversitesi'nde Adli Tıp Profesörü olarak pozisyonu, sertifikaları, danışmanlık görevleri ve dört onuru."
  id: "Halaman Heba Kotb dalam panduan 'Who is She in Egypt' untuk pakar perempuan Mesir, yang diterbitkan oleh Women and Memory Forum: Posisinya sebagai Profesor Kedokteran Forensik di Universitas Kairo, sertifikat, peran penasihat, dan empat penghargaan."
