  ar: "مقالة ويكيبيديا العربية عن يوويري موسيفيني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته سنة 1944 ودراسته في دار السلام وقيادته جبهة الإنقاذ الوطني ورئاسته لأوغندا منذ 1986، وتذكر صلات مبلغ عنها بمنظمة «العائلة» المسيحية الأمريكية في سياق سياسي. لا تذكر انتماءه الديني الشخصي."
  en: "Arabic Wikipedia article on Yoweri Museveni; used for entity facts only. It recounts his birth in 1944, his studies at Dar es Salaam, his leadership of the Front for National Salvation and his presidency of Uganda since 1986, and mentions reported ties to the American Christian organisation The Family in a political context. It states no personal religious affiliation for him."
