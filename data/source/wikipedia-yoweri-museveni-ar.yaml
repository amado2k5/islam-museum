summary:
  ar: "مقالة ويكيبيديا العربية عن يوويري موسيفيني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته سنة 1944 ودراسته في دار السلام وقيادته جبهة الإنقاذ الوطني ورئاسته لأوغندا منذ 1986، وتذكر صلات مبلغ عنها بمنظمة «العائلة» المسيحية الأمريكية في سياق سياسي. لا تذكر انتماءه الديني الشخصي."
  en: "Arabic Wikipedia article on Yoweri Museveni; used for entity facts only. It recounts his birth in 1944, his studies at Dar es Salaam, his leadership of the Front for National Salvation and his presidency of Uganda since 1986, and mentions reported ties to the American Christian organisation The Family in a political context. It states no personal religious affiliation for him."
  es: "Artículo de Wikipedia en árabe sobre Yoweri Museveni; utilizado únicamente para datos sobre la persona. Relata su nacimiento en 1944, sus estudios en Dar es Salaam, su liderazgo del Frente para la Salvación Nacional y su presidencia de Uganda desde 1986, y menciona supuestos vínculos con la organización cristiana estadounidense The Family en un contexto político. No se menciona ninguna afiliación religiosa personal por su parte."
  fr: "Article de Wikipédia en arabe sur Yoweri Museveni; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance en 1944, ses études à Dar es Salaam, son rôle à la tête du Front pour le salut national et sa présidence de l’Ouganda depuis 1986, et mentionne des liens supposés avec l’organisation chrétienne américaine The Family dans un contexte politique. Il ne fait état d’aucune appartenance religieuse personnelle à son égard."
  ur: "یوویری موسیوینی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1944 میں ان کی پیدائش، دارالسلام میں ان کی تعلیم، فرنٹ فار نیشنل سالویشن کی ان کی قیادت اور 1986 سے یوگنڈا کی صدارت کا ذکر ہے، اور سیاسی تناظر میں امریکی عیسائی تنظیم دی فیملی کے ساتھ مبینہ تعلقات کا ذکر ہے۔ اس میں اس کے لیے کوئی ذاتی مذہبی وابستگی نہیں ہے۔"
  tr: "Yoweri Museveni hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1944'teki doğumunu, Dar es Salaam'daki çalışmalarını, Ulusal Kurtuluş Cephesi liderliğini ve 1986'dan beri Uganda'yı yönetmesini anlatır ve siyasi bağlamda Amerikan Hristiyan örgütü \"Family\" ile bağlantılarından bahseder. Kişisel dini aidiyetinden bahsetmez."
  id: "Artikel Wikipedia berbahasa Arab tentang Yoweri Museveni; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada tahun 1944, studinya di Dar es Salaam, kepemimpinannya di Front Keselamatan Nasional, dan kepemimpinannya di Uganda sejak 1986, serta menyebutkan hubungan yang dilaporkan dengan organisasi Kristen Amerika \"Family\" dalam konteks politik. Artikel ini tidak menyebutkan afiliasi agama pribadinya."
