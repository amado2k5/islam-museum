summary:
  ar: "مدخلة ويكي بيانات لعبد الرؤوف فطرت (Q317907) تحمل قيمتين متنافستين لسنة الميلاد ⁦(1885 و1886)⁩، وتاريخ وفاة 5 أكتوبر 1938، وقيمة «الإسلام» العامة وحدها للدين، وأماكن بخارى وطشقند وإسطنبول."
  en: "The Wikidata item for Abdurauf Fitrat (Q317907) carries two competing year-precision birth values (1885 and 1886), a death date of 5 October 1938, Islam in general as the only religion value, and Bukhara, Tashkent and Istanbul among its places."
  es: "El elemento de Wikidata para Abdurauf Fitrat (Q317907) contiene dos valores de año de nacimiento que compiten entre sí (1885 y 1886), una fecha de muerte del 5 de octubre de 1938, el Islam en general como único valor religioso, y Bujará, Taskent e Estambul entre sus lugares."
  fr: "L'élément Wikidata pour Abdurauf Fitrat (Q317907) comporte deux valeurs de naissance concurrentes en termes d'année de précision (1885 et 1886), une date de décès du 5 octobre 1938, l'Islam en général comme seule valeur de religion, et Boukhara, Tachkent et Istanbul parmi ses lieux."
  ur: "عبدالروف فطرت (Q317907) کے لیے Wikidata آئٹم میں دو مسابقتی سال کی درستگی کی پیدائشی اقدار ⁦(1885 اور 1886)⁩ ہیں، جن کی تاریخ وفات 5 اکتوبر 1938 ہے، عام طور پر اسلام واحد مذہب کی حیثیت سے ہے، اور بخارا، تاشقند اور استنبول اس کے مقامات میں شامل ہیں۔"
  tr: "Abdul Rauf Fetrat (Q317907) tarafından yazılan Wikidata girişi, doğum yılı (1885 ve 1886), ölüm tarihi olan 5 Ekim 1938 ve \"İslam\"ın sadece din için genel değeri ile Buhara, Taşkent ve İstanbul gibi yerler için iki rakip değer taşır."
  id: "Entri Wikidata oleh Abdul Rauf Fetrat (Q317907) memuat dua nilai yang saling bersaing untuk tahun kelahiran (1885 dan 1886), tanggal kematian pada 5 Oktober 1938, dan nilai umum \"Islam\" hanya untuk agama, serta tempat Bukhara, Tashkent, dan Istanbul."
