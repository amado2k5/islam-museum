summary:
  ar: "مقالة ويكيبيديا السويدية القصيرة عن محمود كريمي: تصفه في متنها بأنه منشد مسلم شيعي يشارك في المراسم الدينية في إيران وينشد أيضا في الشؤون السياسية المتعلقة بالبلاد، بدأ الإنشاد في السابعة وكانت أول مرة في مسجد بشاهين شهر قرب أصفهان."
  en: "The short Swedish Wikipedia article on Mahmoud Karimi: its prose describes him as a Shia Muslim reciter who takes part in religious ceremonies in Iran and also recites on political matters relating to the country; he began reciting at seven, first at a mosque in Shahinshahr near Isfahan."
  es: "El breve artículo de la Wikipedia sueca sobre Mahmoud Karimi lo describe como un recitador musulmán chiíta que participa en ceremonias religiosas en Irán y también recita sobre asuntos políticos relacionados con el país; comenzó a recitar a los siete años, primero en una mezquita en Shahinshahr, cerca de Isfahán."
  fr: "Le court article de Wikipédia suédois sur Mahmoud Karimi le décrit comme un récitant musulman chiite qui participe à des cérémonies religieuses en Iran et récite également des textes sur des sujets politiques relatifs au pays; il a commencé à réciter à sept ans, d'abord dans une mosquée de Shahinshahr, près d'Ispahan."
  ur: "محمود کریمی پر مختصر سویڈش ویکیپیڈیا مضمون: اس کا نثر اسے ایک شیعہ مسلمان قاری کے طور پر بیان کرتا ہے جو ایران میں مذہبی تقریبات میں حصہ لیتا ہے اور ملک سے متعلق سیاسی معاملات پر بھی تلاوت کرتا ہے۔ اصفہان کے قریب شاہین شہر کی ایک مسجد میں اس نے سات بجے تلاوت شروع کی۔"
  tr: "Mahmud Kerimi hakkında kısa İsveç Vikipedi makalesi: Onu İran'da dini törenlere katılan ve ülkeyle ilgili siyasi işlerde şarkı söyleyen Şii Müslüman bir ilahi üyesi olarak tanımlıyor. Yedi yaşında ilahi söylemeye başladı ve ilk kez İsfahan yakınlarındaki Şahinşehr'deki bir camide seslendirildi."
  id: "Artikel singkat Wikipedia Swedia tentang Mahmoud Karimi: Artikel ini menggambarkannya sebagai seorang penyanyi Muslim Syiah yang berpartisipasi dalam upacara keagamaan di Iran dan juga bernyanyi dalam urusan politik yang berkaitan dengan negara. Ia mulai melantunkan pada usia tujuh tahun, dan pertama kali dipentaskan di sebuah masjid di Shahinshahr dekat Isfahan."
