reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026, and its content checked against the recorded revision. It gives Baaba Maal, of Toucouleur origin, born 13 June 1953 at Podor in Futa Toro (the Arabic article and Wikidata give 12 November 1953; the record carries the date as debated), into a fishing family; his father Baidy Mall, a veteran who became a muezzin, and his mother, a housewife and singer from whom he inherited music; a childhood at Ndioum herding cattle; Qur'an learning in a daara before the French school; primary school at Podor and the lycée Charles de Gaulle; the École des beaux-arts in Dakar and the Conservatoire in Paris; the kora and other traditional instruments learned with the group Lasly Fouta; tours of West Africa with the blind griot Mansour Seck; the founding of Daande Lenol with Seck at Dakar in 1985, adding keyboards and electric guitar to traditional sounds and Pulaar singing; Wango (1988) and Djam Leelii (1989); the 1990 European tour and his part in Peter Gabriel's Passion; Taara, Baayo and Lam Toro (1990–1993); world success in 1994 with Firin' in Fouta and the song 'African Woman'; opening for Santana at Wembley in 1996; Missing You (2001), recorded near Dakar; the Far Cry 2 soundtrack (2009) with Marc Canham; his presence as the only Senegalese artist invited to the 2009 Copenhagen climate conference; the 2016 Johannesburg recording with Mumford & Sons; the Prix des Arts received from President Macky Sall in 2017; and his voice on the Black Panther soundtrack (2018). Its only religious material touching the family — a namesake ancestor described as a disciple of Maodo Malick Sy, and the father's later work as a muezzin — concerns other people and his upbringing, not a school attested for Maal himself; the article states no religion for him."
