summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن برهم صالح؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 8 أيلول 1960 بالسليمانية ورئاسته للعراق 2018–2022 خلفًا لفؤاد معصوم وانتخابه مفوضًا ساميًا لشؤون اللاجئين من 1 كانون الثاني 2026، ولا تسمّي دينًا أو مذهبًا له في نصها ولا في صندوق معلوماتها."
  en: "English Wikipedia article on Barham Salih; used for entity facts only. It gives his birth on 8 September 1960 at Sulaymaniyah (its lead citing a UNHCR press release of 18 December 2025), his presidency of Iraq 2018–2022 in succession to Fuad Masum, and his election as UN High Commissioner for Refugees from 1 January 2026. It names no religion or school for him in text or infobox; its categories file him under 'Kurdish Muslims'."
  es: "Artículo de la Wikipedia en inglés sobre Barham Salih; utilizado únicamente para datos sobre la persona. Indica que nació el 8 de septiembre de 1960 en Sulaymaniyah (su introducción cita un comunicado de prensa del ACNUR del 18 de diciembre de 2025), su presidencia de Irak entre 2018 y 2022, sucediendo a Fuad Masum, y su elección como Alto Comisionado de las Naciones Unidas para los Refugiados a partir del 1 de enero de 2026. No menciona su religión ni escuela en el texto ni en la ficha informativa; sus categorías lo clasifican como «musulmán kurdo»."
  fr: "Article de Wikipédia en anglais sur Barham Salih; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 8 septembre 1960 à Souleimaniye (son introduction cite un communiqué de presse du HCR du 18 décembre 2025), sa présidence de l’Irak de 2018 à 2022, succédant à Fouad Masoum, et son élection comme Haut-Commissaire des Nations Unies pour les réfugiés à compter du 1er janvier 2026. Aucune mention de sa religion ou de son école n’est faite dans le texte ou l’infobox; il est classé dans la catégorie « Musulmans kurdes »."
  ur: "برہم صالح پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 8 ستمبر 1960 کو سلیمانیہ میں ہوئی ⁦(18 دسمبر 2025 کی UNHCR کی پریس ریلیز کا حوالہ دیتے ہوئے اس کی قیادت)⁩، فواد معصوم کے بعد عراق 2018–2022 کی صدارت، اور یکم جنوری 2026 سے اقوام متحدہ کے ہائی کمشنر برائے مہاجرین کے طور پر ان کا انتخاب۔ اس کے زمرے اسے 'کرد مسلمان' کے تحت درج کرتے ہیں۔"
  tr: "Barham Salih hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 8 Eylül 1960'ta Süleymaniye'de doğduğu, 2018–2022 yılları arasında Irak cumhurbaşkanlığı yaptığı ve Fuad Masum'un yerine geçtiği ve 1 Ocak 2026'dan itibaren Mülteci İşleri Yüksek Komiseri olarak seçildiği belirtilmiştir; metinde veya bilgi kutusunda hiçbir dini veya mezhebi belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Barham Salih; digunakan hanya untuk fakta entitas. Kelahirannya pada 8 September 1960 di Sulaymaniyah, serta masa kepresidenannya di Irak dari 2018–2022 menggantikan Fuad Masum, serta pemilihannya sebagai Komisaris Tinggi untuk Urusan Pengungsi pada 1 Januari 2026, disebutkan, dan tidak ada agama atau sekte yang disebutkan dalam teks atau kotak informasinya."
