  ar: "مقالة ويكيبيديا الإنجليزية عن برهم صالح؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 8 أيلول 1960 بالسليمانية ورئاسته للعراق 2018–2022 خلفًا لفؤاد معصوم وانتخابه مفوضًا ساميًا لشؤون اللاجئين من 1 كانون الثاني 2026، ولا تسمّي دينًا أو مذهبًا له في نصها ولا في صندوق معلوماتها."
  en: "English Wikipedia article on Barham Salih; used for entity facts only. It gives his birth on 8 September 1960 at Sulaymaniyah (its lead citing a UNHCR press release of 18 December 2025), his presidency of Iraq 2018–2022 in succession to Fuad Masum, and his election as UN High Commissioner for Refugees from 1 January 2026. It names no religion or school for him in text or infobox; its categories file him under 'Kurdish Muslims'."
