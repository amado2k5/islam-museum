summary:
  ar: "مقالة ويكيبيديا العربية «مصطفى بن حمزة»؛ المقالة الموسوعية الوحيدة عنه في أي لغة. تثبت ميلاده في 21 رمضان 1368 بوجدة، وتتلمذه على الفقيه بنسعيد مهداوي، وشهاداته من القرويين ودار الحديث الحسنية وجامعتي محمد الخامس ومحمد الأول، ورئاسته للمجلس العلمي بوجدة ثم المجلس العلمي الجهوي بالشرق، وعضويته في المجلس العلمي الأعلى، وقائمة مؤلفاته ومنها كتابه «شخصية الفقه المالكي»."
  en: "Arabic Wikipedia article 'Mustafa Ben Hamza'; the only encyclopedia article on him in any language. It gives his birth on 21 Ramadan 1368 at Oujda, his study under the jurist Bensaid Mahdawi, his degrees from al-Qarawiyyin, Dar al-Hadith al-Hassania and the universities Mohammed V and Mohammed I, his presidency of the Oujda scientific council and then of the regional scientific council for the Oriental region, his membership of the Supreme Scientific Council, and a list of his works including his book 'The Character of Maliki Jurisprudence'."
  es: "Artículo en árabe de la Wikipedia «Mustafa Ben Hamza»; el único artículo enciclopédico sobre él en cualquier idioma. En él se menciona su nacimiento el 21 de Ramadán de 1368 en Oujda, sus estudios con el jurista Bensaid Mahdawi, sus títulos de al-Qarawiyyin, Dar al-Hadith al-Hassania y las universidades Mohammed V y Mohammed I, su presidencia del consejo científico de Oujda y posteriormente del consejo científico regional para la región oriental, su pertenencia al Consejo Científico Supremo y una lista de sus obras, incluido su libro «El carácter de la jurisprudencia malikí»."
  fr: "L'article « Mustafa Ben Hamza » de Wikipédia en arabe est le seul article encyclopédique qui lui est consacré, toutes langues confondues. Il mentionne sa naissance le 21 Ramadan 1368 à Oujda, ses études auprès du juriste Bensaid Mahdawi, ses diplômes obtenus à al-Qarawiyyin, Dar al-Hadith al-Hassania et aux universités Mohammed V et Mohammed I, sa présidence du conseil scientifique d'Oujda puis du conseil scientifique régional pour la région orientale, son appartenance au Conseil scientifique suprême, ainsi qu'une liste de ses œuvres, dont son ouvrage « Le caractère de la jurisprudence malikite »."
  ur: "عربی ویکیپیڈیا مضمون 'مصطفی بن حمزہ'؛ کسی بھی زبان میں ان پر واحد انسائیکلوپیڈیا مضمون۔ یہ 21 رمضان 1368 کو اوجدہ میں ان کی ولادت، فقیہ بنسید مہدوی کے تحت ان کا مطالعہ، القرویین، دار الحدیث الحسنیہ اور جامعات محمد پنجم اور محمد اول سے ان کی ڈگریاں، اوجدہ سائنسی کونسل کی صدارت اور پھر علاقائی سائنسی کونسل کے رکن، علاقائی سائنسی کونسل کے رکن اور سائنسی کونسل کے رکن۔ ان کے کاموں کی فہرست بشمول ان کی کتاب 'مالکی فقہ کا کردار'۔"
