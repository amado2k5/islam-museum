summary:
  ar: "مقالة ويكيبيديا العربية «مصطفى بن حمزة»؛ المقالة الموسوعية الوحيدة عنه في أي لغة. تثبت ميلاده في 21 رمضان 1368 بوجدة، وتتلمذه على الفقيه بنسعيد مهداوي، وشهاداته من القرويين ودار الحديث الحسنية وجامعتي محمد الخامس ومحمد الأول، ورئاسته للمجلس العلمي بوجدة ثم المجلس العلمي الجهوي بالشرق، وعضويته في المجلس العلمي الأعلى، وقائمة مؤلفاته ومنها كتابه «شخصية الفقه المالكي»."
  en: "Arabic Wikipedia article 'Mustafa Ben Hamza'; the only encyclopedia article on him in any language. It gives his birth on 21 Ramadan 1368 at Oujda, his study under the jurist Bensaid Mahdawi, his degrees from al-Qarawiyyin, Dar al-Hadith al-Hassania and the universities Mohammed V and Mohammed I, his presidency of the Oujda scientific council and then of the regional scientific council for the Oriental region, his membership of the Supreme Scientific Council, and a list of his works including his book 'The Character of Maliki Jurisprudence'."
