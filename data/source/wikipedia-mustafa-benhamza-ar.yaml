reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026; the article was fetched by revision id through the MediaWiki API and the returned revid asserted equal to 76346719 before any claim was drawn. It gives his birth only in Hijri (21 Ramadan 1368) in its lead; its categories give the year 1949 and Oujda as his birthplace. It names no madhhab or creed for him in its text, and its categories file him only among Moroccan jurists and scholars. His book «شخصية الفقه المالكي» (The Character of Maliki Jurisprudence, 2004) is a work about the Maliki school; authorship of a book about a school is subject expertise, not an attestation of personal affiliation. It records his three Ramadan Hassania lectures before King Mohammed VI (1421, 1423 and 1427 AH) and his royal decorations, the last in 2007."
