summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمدو بلو؛ تُستخدم لوقائع الكيان فقط. تروي صعوده من معلّم ورئيس منطقة إلى لقب سردوانة صكتو، وقيادته مؤتمر الشعب الشمالي، ورئاسته حكومة المنطقة الشمالية (1954–1966)، واغتياله في انقلاب 15 يناير 1966."
  en: "English Wikipedia article on Ahmadu Bello; used for entity facts only. It recounts his rise from teacher and district head to the Sardauna title, his leadership of the Northern People's Congress, his premiership of the Northern Region (1954–1966), and his assassination in the coup of 15 January 1966."
  es: "Artículo de la Wikipedia en inglés sobre Ahmadu Bello; utilizado únicamente para datos sobre la persona. Relata su ascenso desde maestro y jefe de distrito hasta el título de Sardauna, su liderazgo del Congreso del Pueblo del Norte, su mandato como primer ministro de la Región Norte (1954-1966) y su asesinato en el golpe de Estado del 15 de enero de 1966."
  fr: "Article de Wikipédia en anglais sur Ahmadu Bello; utilisé uniquement pour des informations factuelles sur l'entité. Il relate son ascension, d'enseignant et chef de district à Sardauna, son rôle à la tête du Congrès du peuple du Nord, son mandat de Premier ministre de la Région du Nord (1954-1966) et son assassinat lors du coup d'État du 15 janvier 1966."
  ur: "احمدو بیلو پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں استاد اور ضلعی سربراہ سے سردونہ ٹائٹل تک ان کے عروج، شمالی پیپلز کانگریس کی ان کی قیادت، شمالی علاقہ میں ان کی پریمیئر شپ (1954–1966) اور 15 جنوری 1966 کی بغاوت میں ان کے قتل کا ذکر ہے۔"
