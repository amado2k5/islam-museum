reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Bello as born on 12 June 1910 in Rabah (citing his autobiography My Life) and killed on 15 January 1966 in Kaduna; the Dictionary of African Biography entry it cites is titled 'Bello, Ahmadu (1909–1966)', a birth-year variant preserved in the record. The text records his descent from Uthman dan Fodio through Muhammad Bello and Atiku na Raba (family background), his Islamic education at home in Qur'an, fiqh and Sunnah (formation), and explains the Sardauna as a Sokoto chieftaincy title conferred on him in 1938. Its categories file him under 'Nigerian Muslims'. No school, order affiliation or madhhab is stated of him personally."
