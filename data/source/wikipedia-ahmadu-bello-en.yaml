  en: "English Wikipedia article on Ahmadu Bello; used for entity facts only. It recounts his rise from teacher and district head to the Sardauna title, his leadership of the Northern People's Congress, his premiership of the Northern Region (1954–1966), and his assassination in the coup of 15 January 1966."
