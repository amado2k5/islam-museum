summary:
  ar: "مقالة ويكيبيديا الفرنسية عن أبي شعيب الدكالي ⁦(20 أكتوبر 1878 – 17 يوليو 1937 بالرباط)⁩، وزير العدل والتعليم؛ تنسب إليه مع محمد بن العربي العلوي تأسيس السلفية الجديدة ⁦(النيو سلفية)⁩، وتحيل وصف السلفي الوهابي إلى بلحاج، ولا تسمي له مذهبًا."
  en: "The French Wikipedia article on Abu Shuayb al-Doukkali (20 October 1878 – 17 July 1937 at Rabat), minister of justice and education; it credits him, with Muhammad ibn al-Arabi al-Alawi, as a founder of neo-Salafism (al-salafiyya al-jadida), attributes the Wahhabi-Salafi description to Belhaj, and names no madhhab for him."
  es: "El artículo de la Wikipedia en francés sobre Abu Shuayb al-Doukkali (20 de octubre de 1878 - 17 de julio de 1937 en Rabat), ministro de justicia y educación, lo considera, junto con Muhammad ibn al-Arabi al-Alawi, fundador del neosalafismo (al-salafiyya al-jadida), atribuye la descripción wahabí-salafista a Belhaj y no menciona ninguna escuela jurídica (madhhab) para él."
  fr: "L'article de Wikipédia en français sur Abu Shuayb al-Doukkali (20 octobre 1878 – 17 juillet 1937 à Rabat), ministre de la justice et de l'éducation; il le crédite, avec Muhammad ibn al-Arabi al-Alawi, comme fondateur du néo-salafisme (al-salafiyya al-jadida), attribue la description wahhabite-salafiste à Belhaj et ne nomme aucun madhhab pour lui."
  ur: "ابو شعیب الدوکلی ⁦(20 اکتوبر 1878 - 17 جولائی 1937 رباط)⁩ پر فرانسیسی ویکیپیڈیا کا مضمون، وزیر انصاف اور تعلیم؛ یہ اسے محمد بن العربی العلوی کے ساتھ، نو سلفیت ⁦(السلفیہ الجدیدہ)⁩ کے بانی کے طور پر، وہابی-سلفی کی وضاحت کو بلہاج سے منسوب کرتا ہے، اور اس کے لیے کوئی مذہب نہیں رکھتا۔"
  tr: "Adalet ve Eğitim Bakanı Abu Shuaib Doukkali (20 Ekim 1878 – 17 Temmuz 1937, Rabat) hakkında Fransızca Wikipedia makalesi; yeni Selefiliğin (Neo-Selefizm) kuruluşunu ona ve Muhammed ibn el-Arabi Alawi atfeder ve Vahhabi Selefi'nin tanımını Belhadj'a atıfta bulunur, ancak onu bir düşünce okulu olarak adlandırmaz."
  id: "Artikel Wikipedia Prancis tentang Abu Shuaib Doukkali (20 Oktober 1878 – 17 Juli 1937, Rabat), Menteri Kehakiman dan Pendidikan; artikel tersebut mengaitkan kepadanya, bersama Muhammad ibn al-Arabi Alawi, pendirian Salafisme baru (Neo-Salafisme), dan merujuk deskripsi Salafi Wahhabi kepada Belhadj, tanpa menyebut dia sebagai aliran pemikiran."
