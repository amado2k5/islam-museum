reliability_note: "Signed guest post, read in full in Chrome on 6 November 2026. Used for the translator (born Ciamis, 1943; lecturer in Sundanese at Padjadjaran University), the partial Al-Hikmah (2009, first juz'), completion of the whole in 2011, publication by the Padjadjaran University Alumni Association in five volumes, the method (interpretive, everyday Sundanese, speech registers, phonetic spelling of Arabic terms, no footnotes), its main source (the 1990 Saudi edition of the Indonesian government translation) and Tafsir al-Mishbah, and the reviewer's assessment."
