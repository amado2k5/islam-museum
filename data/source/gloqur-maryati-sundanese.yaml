  ur: "باندونگ کی یونیورسٹی سونان گونونگ جاتی کے جاجانگ رحمانا کی مہمان تحریر، 23 جون 2023، «انوگراہ» پر، ماریہ مریاتی ساستراوجایا کا قرآن کے معانی کا مکمل سونڈانی ترجمہ، جو کسی انڈونیشیائی خاتون کا واحد مکمل ترجمہ ہے۔"
