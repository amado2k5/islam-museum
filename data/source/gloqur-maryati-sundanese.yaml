  ar: "مقالة ضيف لجاجانغ رحمانا من جامعة سونان غونونغ جاتي الإسلامية في باندونغ، 23 يونيو 2023، عن «أنوغراه»، الترجمة السوندية الكاملة لمعاني القرآن التي وضعتها مارية مرياتي ساسترويجايا، وهي الترجمة الكاملة الوحيدة لامرأة إندونيسية."
