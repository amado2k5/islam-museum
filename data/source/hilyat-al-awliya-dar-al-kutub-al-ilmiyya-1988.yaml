  ar: "حلية الأولياء وطبقات الأصفياء للحافظ أبي نعيم أحمد بن عبد الله الأصفهاني ⁦(ت 430هـ)⁩ — دار الكتب العلمية، بيروت، الطبعة الأولى 1409هـ/1988م"
  en: "Abu Nu'aym Ahmad ibn 'Abd Allah al-Isfahani (d. 430 AH), Hilyat al-Awliya' wa-Tabaqat al-Asfiya' — Dar al-Kutub al-'Ilmiyya, Beirut, 1st edition 1409 AH/1988 CE"
summary:
  ar: "نشرة دار الكتب العلمية لحلية الأولياء في عشرة أجزاء، بنص مرقّم التراجم وحواش قليلة تذكر فروق نسختين يرمز لهما بـ«ح» و«ز»، بلا دراسة؛ تبدأ بمقدمة أبي نعيم في نعوت الأولياء والتصوف، ثم تراجم الصحابة بدءاً بأبي بكر الصديق، ثم التابعين ومن بعدهم من الزهاد والعباد والعلماء."
  en: "Dar al-Kutub al-'Ilmiyya's ten-part edition of Hilyat al-Awliya', with numbered notices and a few footnotes giving the variants of two manuscripts marked 'h' and 'z', without a study; it opens with Abu Nu'aym's introduction on the marks of God's friends and on Sufism, then the notices of the Companions beginning with Abu Bakr, then the Successors and later ascetics, worshippers and scholars."
