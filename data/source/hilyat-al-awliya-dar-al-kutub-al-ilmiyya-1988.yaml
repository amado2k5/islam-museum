reliability_note: "Classical Sunni biographical anthology of ascetics and saints (author d. 430 AH), public domain; the edition adds only short variant notes. Copies used: harvest items sahaba/hilyat-awliya/hilyah-01 … hilyah-07, hilyah-09, hilyah-10 (about 400 PDF pages each; vol. 8 is not in the folder). Vol. 1: title p. 1, imprint p. 2 (1st ed. 1409/1988), author's introduction pp. 3–28, notice no. 1 (Abu Bakr) from p. 28. Notice numbering runs through the set (vol. 2 begins at no. 88 'Abd Allah ibn Umm Maktum; vol. 7 ends at no. 394 Ibrahim ibn Adham; vol. 10 runs from no. 457 Ahmad ibn Abi al-Hawari to about no. 606). PRINTED PAGE = PDF PAGE in vol. 1 (checked on pp. 4–8, 17, 24, 28). Citations give 'vol/page'; for vols 2–10 the page is the PDF page of the harvest item (only vol. 1 was checked against printed numbers). Many of the reports are weak by hadith standards; Abu Nu'aym cites them with chains, and the museum reports them as his material."
