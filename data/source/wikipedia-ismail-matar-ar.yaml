  ar: "مقالة ويكيبيديا العربية عن إسماعيل مطر؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 7 أبريل 1983 في أبوظبي ومسيرته مع الوحدة وألقابه في كأس الخليج 2007، وتقرن سنة ميلاده بسنة 1403 هـ في تصنيفاتها. إحصاءاتها قديمة، فتُتبع الإنجليزية في أرقام المسيرة. ولا تذكر ديانته."
  en: "Arabic Wikipedia article on Ismail Matar; used for entity facts only. It gives his birth on 7 April 1983 in Abu Dhabi, his Al-Wahda career and his 2007 Gulf Cup honours, and pairs his birth year with 1403 AH in its categories. Its statistics are stale, so the English article is followed for career totals. It makes no statement about his religion."
