reliability_note: "Edition not verified. The local copy is an OCR text of a modern printing whose title page names the editor Ibrahim Shams al-Din and the publisher Dar al-Kutub al-Ilmiyya, Beirut; the year of this printing is not read in the OCR and is not recorded here. Page numbers cited in the museum are the page markers of the local OCR copy (406 PDF pages); on the pages read they agree with the printed page numbers (pp. 9, 13, 21, 31, 34). The editor states at p. 8 that notes marked as the author's own are Rida's. Every page number must be checked against the printed copy before publication. The Arabic in the OCR contains reading errors; quotations are not made from it."
