summary:
  ar: "المجلد الأول من تفسير المنار لمحمد رشيد رضا: تقديم المحقق إبراهيم شمس الدين، ثم مقدمة التفسير المقتبسة من دروس محمد عبده بالمعنى مع بسط المؤلف، ثم بداية تفسير سورة الفاتحة."
  en: "Volume 1 of Rashid Rida's Tafsir al-Manar: the editor's foreword, Rida's introduction to the tafsir drawn from Muhammad Abduh's lessons, and the opening of the commentary on al-Fatiha."
  es: "Volumen 1 del Tafsir al-Manar de Rashid Rida: el prólogo del editor, la introducción de Rida al tafsir basado en las lecciones de Muhammad Abduh y el comienzo del comentario sobre al-Fatiha."
  fr: "Volume 1 du Tafsir al-Manar de Rashid Rida: l'avant-propos de l'éditeur, l'introduction de Rida au tafsir tiré des leçons de Muhammad Abduh et l'ouverture du commentaire sur al-Fatiha."
  ur: "رشید ردا کی تفسیر المنار کی جلد 1: مدیر کا پیش لفظ، محمد عبدہ کے اسباق سے اخذ کردہ تفسیر سے ردا کا تعارف، اور الفاتحہ کی تفسیر کا آغاز۔"
  tr: "Muhammed Reşid Rida'nın Tefsir-menar'ın ilk cildi: editör İbrahim Şemseddin tarafından yapılan giriş, ardından tefsirin giriş kısmı Muhammed Abduh'un anlam derslerinden alıntı ve yazarın açıklaması, ardından Fatiha suresinin yorumunun başlangıcı."
  id: "Jilid pertama Tafsir al-Manar oleh Muhammad Rashid Rida: Pengantar oleh editor Ibrahim Shams al-Din, kemudian pengantar tafsir mengutip dari pelajaran Muhammad Abduh tentang makna dengan penjelasan penulis, kemudian awal penafsiran Surah Al-Fatiha."
