  ar: "مقالة ويكيبيديا العربية المختصرة عن عمر علي سيف الدين الثالث. تصفه بسلطان بروناي الثامن والعشرين، ابن محمد جمال العالم الثاني وأخ السلطان أحمد تاج الدين الأصغر ووالد حسن البلقية، تُوّج في 31 مايو 1951 وتنحّى في 4 أكتوبر 1967 لأسباب صحية."
  en: "Arabic Wikipedia stub on Omar Ali Saifuddien III. It identifies him as the 28th Sultan of Brunei, a son of Muhammad Jamalul Alam II, the younger brother of Sultan Ahmad Tajuddin and the father of Hassanal Bolkiah, crowned on 31 May 1951, who abdicated on 4 October 1967 citing health problems."
