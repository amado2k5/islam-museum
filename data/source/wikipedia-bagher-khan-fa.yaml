summary:
  ar: "مقالة ويكيبيديا الفارسية «باقرخان»؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في تبريز سنة 1240 شمسية ووفاته في قصر شيرين سنة 1295 شمسية، وقيادته مجاهدي حي خيابان، وتصنيفه الشخصي في تيار المتشرعة خلافًا لستارخان الشيخي، ومقتله في محرم 1335 بيد طالباني، ونقل رفاته إلى تبريز سنة 1354 شمسية."
  en: "Persian Wikipedia article 'Bagher Khan'; used for entity facts only. It gives his birth at Tabriz in 1240 Solar Hijri and his death at Qasr-e Shirin in 1295 Solar Hijri, his command of the mojahedin of the Khiaban quarter, its classification of him personally as of the Mutasharri'a current in contrast to the Sheikhi Sattar Khan, his killing in Muharram 1335 at Talebani's hands, and the transfer of his remains to Tabriz in 1354 Solar Hijri."
