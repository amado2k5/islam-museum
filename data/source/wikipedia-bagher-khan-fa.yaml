summary:
  ar: "مقالة ويكيبيديا الفارسية «باقرخان»؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في تبريز سنة 1240 شمسية ووفاته في قصر شيرين سنة 1295 شمسية، وقيادته مجاهدي حي خيابان، وتصنيفه الشخصي في تيار المتشرعة خلافًا لستارخان الشيخي، ومقتله في محرم 1335 بيد طالباني، ونقل رفاته إلى تبريز سنة 1354 شمسية."
  en: "Persian Wikipedia article 'Bagher Khan'; used for entity facts only. It gives his birth at Tabriz in 1240 Solar Hijri and his death at Qasr-e Shirin in 1295 Solar Hijri, his command of the mojahedin of the Khiaban quarter, its classification of him personally as of the Mutasharri'a current in contrast to the Sheikhi Sattar Khan, his killing in Muharram 1335 at Talebani's hands, and the transfer of his remains to Tabriz in 1354 Solar Hijri."
  es: "Artículo de Wikipedia en persa titulado \"Bagher Khan\"; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Tabriz en el año 1240 de la Hégira Solar y su muerte en Qasr-e Shirin en el año 1295 de la Hégira Solar, su mando de los muyahidines del barrio de Khiaban, su clasificación personal como perteneciente a la corriente Mutasharri'a en contraposición al Sheikhi Sattar Khan, su asesinato en Muharram de 1335 a manos de Talebani y el traslado de sus restos a Tabriz en el año 1354 de la Hégira Solar."
  fr: "L'article persan de Wikipédia intitulé « Bagher Khan » est utilisé uniquement pour des informations sur l'entité. Il indique sa naissance à Tabriz en 1240 de l'Hégire solaire et sa mort à Qasr-e Shirin en 1295 de l'Hégire solaire, son commandement des moudjahidines du quartier de Khiaban, son appartenance au courant Mutasharri'a par opposition au cheikh Sattar Khan, son assassinat en Muharram 1335 par Talebani et le transfert de sa dépouille à Tabriz en 1354 de l'Hégire solaire."
  ur: "فارسی ویکیپیڈیا مضمون 'باگھر خان'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1240 شمسی ہجری میں تبریز میں ان کی ولادت اور 1295 شمسی ہجری میں قصر شیرین میں ان کی وفات، ان کا خیابان سہ ماہی کے مجاہدین کا حکم، اس کی ذاتی طور پر شیخی ستار خان کے مقابلے میں موجودہ مطشریٰ کے طور پر درجہ بندی، محرم میں ان کا قتل اور 53 محرم کو ان کے ہاتھ میں منتقل ہونا۔ تبریز 1354 شمسی ہجری میں۔"
  tr: "Farsça Vikipedi makalesi \"Bakırkhan\" yalnızca varlığın gerçekleri için kullanılır. 1240 Hicri'de Tebriz'de doğmuş, 1295 SH yılında Şirin Sarayı'nda ölmüş, Khiaban mahallesinin Mücahitlerine liderlik etmiş ve şahsen Mutashriyya hareketinin bir parçası olarak sınıflandırılmış, Sattar Han el-Şeyhi'nin aksine 1335 Muharrım'da Talabani tarafından öldürülmüş ve naaşı 1354 SH yılında Tebriz'e nakledilmiştir."
  id: "Artikel Wikipedia Persia \"Baqirkhan\" hanya digunakan untuk fakta entitas tersebut. Ia lahir di Tabriz pada tahun 1240 H, meninggal di Istana Shirin pada tahun 1295 SH, memimpin Mujahidin di lingkungan Khiaban, dan secara pribadi diklasifikasikan sebagai bagian dari gerakan Mutashriyya berbeda dengan Sattar Khan al-Sheikhi, dibunuh pada Muharram 1335 oleh Talabani, dan jenazahnya dipindahkan ke Tabriz pada 1354 SH."
