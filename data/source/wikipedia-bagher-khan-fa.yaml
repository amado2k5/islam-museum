reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. Its lead dates him 1240-1295 Solar Hijri (1861/62-1916/17), against the Encyclopaedia Iranica's 'born in Tabriz in the 1870s' and the English article's 'c. 1870'; the conflict is disclosed in the record. Its faith sentence is explicit and personal: 'Bagher Khan, unlike Sattar Khan who was a Sheikhi, was of the Mutasharre'a, and sided with and respected the anti-constitutionalist ulama who were of the Mutasharre'a' — the Persian historiography behind it is the Kasravi tradition."
