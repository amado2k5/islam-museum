  ar: "مقالة ويكيبيديا الروسية عن نعمان چلبى جهان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1885 في قرية بييوك سوناك قرب جانكوي وأن والده كان إمام مسجد القرية، وتفصّل تعليمه في مدارس القرم وإسطنبول ونشاطه السياسي حتى إعدامه في سيفاستوبول في 23 فبراير 1918؛ ولا تذكر له مذهبا."
  en: "Russian Wikipedia article on Noman Chelebidjikhan; used for entity facts only. It gives his birth in 1885 at Büyük Sonaq village near Dzhankoy and that his father was the village mosque's imam, and details his schooling in Crimea and Istanbul and his political career to his execution at Sevastopol on 23 February 1918; it names no school for him."
