summary:
  ar: "مقالة ويكيبيديا الروسية عن نعمان چلبى جهان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1885 في قرية بييوك سوناك قرب جانكوي وأن والده كان إمام مسجد القرية، وتفصّل تعليمه في مدارس القرم وإسطنبول ونشاطه السياسي حتى إعدامه في سيفاستوبول في 23 فبراير 1918؛ ولا تذكر له مذهبا."
  en: "Russian Wikipedia article on Noman Chelebidjikhan; used for entity facts only. It gives his birth in 1885 at Büyük Sonaq village near Dzhankoy and that his father was the village mosque's imam, and details his schooling in Crimea and Istanbul and his political career to his execution at Sevastopol on 23 February 1918; it names no school for him."
  es: "Artículo de la Wikipedia rusa sobre Noman Chelebidjikhan; utilizado únicamente para datos sobre la persona. Indica que nació en 1885 en la aldea de Büyük Sonaq, cerca de Dzhankoy, que su padre era el imán de la mezquita del pueblo y detalla su educación en Crimea y Estambul, así como su carrera política hasta su ejecución en Sebastopol el 23 de febrero de 1918; no menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en russe sur Noman Chelebidjikhan; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance en 1885 au village de Büyük Sonaq, près de Dzhankoy, et précise que son père était l'imam de la mosquée du village. L'article détaille sa scolarité en Crimée et à Istanbul, ainsi que sa carrière politique jusqu'à son exécution à Sébastopol le 23 février 1918; aucune école n'est mentionnée."
  ur: "نعمان چیلیبیدجیخان پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 1885 میں Dzhankoy کے قریب Büyük Sonaq گاؤں میں ہوئی اور یہ کہ اس کے والد گاؤں کی مسجد کے امام تھے، اور کریمیا اور استنبول میں اس کی اسکول کی تعلیم اور 23 فروری 1918 کو سیواستوپول میں اس کی پھانسی تک ان کے سیاسی کیریئر کی تفصیلات بیان کی گئی ہیں۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Numan Gelbi Jahan hakkında Rusça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 1885 yılında Jankoy yakınlarındaki Büyuk Sunak köyünde doğduğu ve babasının köy caminin imamı olduğu belirtilmiştir. Kırım ve İstanbul okullarındaki eğitimini ve 23 Şubat 1918'de Sivastopol'da idamı olana kadar siyasi faaliyetlerini detaylandırır; herhangi bir mezhebinden bahsetmez."
  id: "Artikel Wikipedia Rusia tentang Numan Gelbi Jahan hanya digunakan untuk fakta entitas tersebut. Ia disebutkan lahir pada tahun 1885 di desa Buyuk Sunak dekat Jankoy, dan bahwa ayahnya adalah imam masjid desa. Artikel tersebut merinci pendidikannya di sekolah Krimea dan Istanbul serta aktivitas politiknya hingga eksekusi di Sevastopol pada 23 Februari 1918; tidak disebutkan sekte mana pun darinya."
