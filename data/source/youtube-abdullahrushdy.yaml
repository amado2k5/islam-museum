summary:
  ar: "القناة الرسمية للشيخ عبد الله رشدي على يوتيوب (@abdullahrushdy)؛ يصفها وصفها بأنها «القناة الرسمية للشيخ عبدالله رشدي، تعنى بتوضيح حقائق الدين الإسلامي والرد على تساؤلات المتابعين»، وفيها دروسه ومناظراته وسلاسله مثل «في كلمتين» و«عبثيات»."
  en: "The official YouTube channel of Sheikh Abdullah Rushdy (@abdullahrushdy); its description states in Arabic that it is 'the official channel of Sheikh Abdullah Rushdy, concerned with clarifying the truths of the Islamic religion and answering followers' questions', and it carries his lessons, debates and series such as Fi Kalimatayn and Abathiyyat."
  es: "El canal oficial de YouTube del jeque Abdullah Rushdy (@abdullahrushdy); su descripción en árabe indica que es \"el canal oficial del jeque Abdullah Rushdy, dedicado a aclarar las verdades de la religión islámica y a responder las preguntas de sus seguidores\", y en él se publican sus lecciones, debates y series como Fi Kalimatayn y Abathiyyat."
  fr: "La chaîne YouTube officielle du cheikh Abdullah Rushdy (@abdullahrushdy); sa description indique en arabe qu'il s'agit de « la chaîne officielle du cheikh Abdullah Rushdy, qui a pour but de clarifier les vérités de la religion islamique et de répondre aux questions des fidèles », et elle diffuse ses leçons, ses débats et ses séries telles que Fi Kalimatayn et Abathiyyat."
  ur: "شیخ عبداللہ رشدی (@abdullahrushdy) کا آفیشل یوٹیوب چینل؛ اس کی تفصیل عربی میں بتاتی ہے کہ یہ 'شیخ عبداللہ رشدی کا آفیشل چینل ہے، جو مذہب اسلام کی حقیقتوں کو واضح کرنے اور پیروکاروں کے سوالات کے جوابات دینے سے متعلق ہے'، اور اس میں ان کے اسباق، مباحثے اور سیریز جیسے فی کلماتین اور ابوحیات شامل ہیں۔"
