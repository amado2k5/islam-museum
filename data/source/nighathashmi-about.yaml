reliability_note: "Her own official biography, read in full on 5 November 2026; it is a first-party source and its claims are used as her ecosystem's account, attributed as such. It gives: founder and Chairperson of Al-Noor, established 1996, beginning as Al-Noor International in Bahawalpur with classes in her own home; born in Sargodha, Punjab, in 1960 (year only, no day or month — so no born block is written); daughter of the scholar Abdur Rehman Hashmi; master's degrees in Arabic and Islamic studies and an M.Phil. in education; Lecturer and Assistant Professor at Islamia University, Bahawalpur, from 1994 to 2007; her 1995 M.Phil. research on character building in Pakistan's religious institutes as the prompt for founding Al-Noor in 1996; her Urdu translation of the Qur'an and her tafseer 'Quran an Ajaba' in question-and-answer form; and the sentence 'she holds the distinction of being the first female Islamic scholar to translate the Quran with interpretive insights' — a distinction claimed by her own biography and recorded here only as that claim. The page names no school or order for her."
