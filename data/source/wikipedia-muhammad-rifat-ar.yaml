summary:
  ar: "مقالة ويكيبيديا العربية عن محمد رفعت؛ تُستخدم لوقائع الكيان فقط. سيرة وافية: مولده بدرب الأغوات بالمغربلين في 9 مايو 1882، وكتّاب بشتاك بمسجد فاضل باشا، وافتتاحه الإذاعة المصرية سنة 1934، وأسرته وتلاواته المحفوظة بأسطوانات زكريا باشا مهران، ومرضه ووفاته في 9 مايو 1950؛ وصندوقها يعطي الديانة مسلم والمذهب أهل السنة والجماعة، ويصفه نصها في قسم شخصيته بأنه كان «صوفي النزعة نقشبندي الطريقة»."
  en: "Arabic Wikipedia article on Muhammad Rifat; used for entity facts only. A full biography: his birth at Darb al-Aghawat, al-Maghreblin, on 9 May 1882, the Bushtak kuttab at Fadil Pasha Mosque, his opening of Egyptian Radio in 1934, his family, his recitations preserved on Zakariyya Pasha Mahran's gramophone discs, his illness and death on 9 May 1950; its infobox gives religion Muslim and madhhab Ahl al-Sunna wa-l-Jama'a, and its Personality section describes him in its own words as of Sufi inclination, Naqshbandi in tariqa."
