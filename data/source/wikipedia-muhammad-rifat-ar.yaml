summary:
  ar: "مقالة ويكيبيديا العربية عن محمد رفعت؛ تُستخدم لوقائع الكيان فقط. سيرة وافية: مولده بدرب الأغوات بالمغربلين في 9 مايو 1882، وكتّاب بشتاك بمسجد فاضل باشا، وافتتاحه الإذاعة المصرية سنة 1934، وأسرته وتلاواته المحفوظة بأسطوانات زكريا باشا مهران، ومرضه ووفاته في 9 مايو 1950؛ وصندوقها يعطي الديانة مسلم والمذهب أهل السنة والجماعة، ويصفه نصها في قسم شخصيته بأنه كان «صوفي النزعة نقشبندي الطريقة»."
  en: "Arabic Wikipedia article on Muhammad Rifat; used for entity facts only. A full biography: his birth at Darb al-Aghawat, al-Maghreblin, on 9 May 1882, the Bushtak kuttab at Fadil Pasha Mosque, his opening of Egyptian Radio in 1934, his family, his recitations preserved on Zakariyya Pasha Mahran's gramophone discs, his illness and death on 9 May 1950; its infobox gives religion Muslim and madhhab Ahl al-Sunna wa-l-Jama'a, and its Personality section describes him in its own words as of Sufi inclination, Naqshbandi in tariqa."
  es: "Artículo de Wikipedia en árabe sobre Muhammad Rifat; utilizado únicamente para datos sobre la entidad. Una biografía completa: su nacimiento en Darb al-Aghawat, al-Magreblín, el 9 de mayo de 1882, el Bushtak kuttab en la mezquita de Fadil Pasha, la inauguración de la Radio Egipcia en 1934, su familia, sus recitaciones conservadas en los discos de gramófono de Zakariyya Pasha Mahran, su enfermedad y muerte el 9 de mayo de 1950; su ficha informativa indica que su religión era musulmana y su madhhab Ahl al-Sunna wa-l-Jama'a, y su sección de Personalidad lo describe con sus propias palabras como de inclinación sufí, Naqshbandi en tariqa."
  fr: "Article Wikipédia en arabe sur Muhammad Rifat; utilisé uniquement pour les informations factuelles. Biographie complète: sa naissance à Darb al-Aghawat, Maghreb, le 9 mai 1882, le Bushtak kuttab à la mosquée Fadil Pacha, l’inauguration de la radio égyptienne en 1934, sa famille, ses récitations conservées sur les disques de gramophone de Zakariyya Pacha Mahran, sa maladie et sa mort le 9 mai 1950; son infobox indique sa religion: musulman, madhhab: Ahl al-Sunna wa-l-Jama’a, et sa section « Personnalité » le décrit comme ayant des penchants soufis et appartenant à la tariqa Naqshbandi."
  ur: "محمد رفعت پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ مکمل سوانح عمری: ان کی ولادت دارب الغوات، المغربلین میں، 9 مئی 1882 کو، فضیل پاشا مسجد میں بشطق کتب، 1934 میں ان کا مصری ریڈیو کا آغاز، ان کا خاندان، زکریا پاشا مہران کی گراموفون پر محفوظ کردہ قرات اور ان کی بیماری، 19 مئی 1999 پر ان کی وفات اس کا معلوماتی خانہ مذہب مسلم اور مذہب اہل السنۃ والجماعۃ دیتا ہے، اور اس کا پرسنالٹی سیکشن اسے اپنے الفاظ میں صوفی رجحان، نقشبندی طریقت میں بیان کرتا ہے۔"
  tr: "Muhammed Rifat hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kapsamlı biyografi: 9 Mayıs 1882'de Magripin'deki Darb al-Aghuwat'ta doğması, Fadel Paşa Camii'ndeki Baştak kitabı, 1934'te Mısır radyosunun açılışı, ailesi ve Zakeriya Paşa Mehran'ın kayıtlarında saklanan okumalar, hastalığı ve 9 Mayıs 1950'deki ölümü; kutusunda dini Müslüman, mezhebi Ehl-el-Sünnet vel-Cema'ah olarak atfeder ve kişilik bölümünde \"Nakşibendi tarikatının bir sufi\" olarak tanımlanır."
  id: "Artikel Wikipedia Arab tentang Muhammad Rifaat; hanya digunakan untuk fakta entitas. Biografi komprehensif: Kelahirannya di Darb Al-Aghuwat di Maghrebelin pada 9 Mei 1882, kitab Bashtak di Masjid Fadel Pasha, peresmian radio Mesir pada tahun 1934, keluarganya dan bacaan yang tercatat dalam catatan Zakaria Pasha Mehran, penyakit dan kematiannya pada 9 Mei 1950; kotaknya mengaitkan agama sebagai Muslim dan sekte sebagai Ahl al-Sunnah wal-Jama'ah, dan teks dalam bagian kepribadiannya menggambarkannya sebagai \"Sufi dari tarekat Naqshbandi.\""
