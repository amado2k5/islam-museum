summary:
  ar: "مدخل «ببليوغرافيات أكسفورد» الأكاديمي عن محمد عصري زين العابدين؛ يؤكد ولايته منصب مفتي برليس منذ 2015 وقبلها 2006–2008 وتعليمه ومنصبه الأكاديمي في جامعة العلوم الماليزية."
  en: "Oxford Bibliographies (Islamic Studies) reference entry on Mohd Asri Zainul Abidin: it confirms his Perlis muftiate since 2015 and previously 2006-2008, his education, and his associate professorship at Universiti Sains Malaysia."
  es: "La entrada de referencia sobre Mohd Asri Zainul Abidin en la bibliografía Oxford (Estudios Islámicos) confirma su muftiato en Perlis desde 2015 y anteriormente entre 2006 y 2008, su formación académica y su cátedra asociada en la Universiti Sains Malaysia."
  fr: "L'entrée de référence des Oxford Bibliographies (Études islamiques) sur Mohd Asri Zainul Abidin: elle confirme son muftiat de Perlis depuis 2015 et auparavant de 2006 à 2008, son éducation et son poste de professeur associé à l'Universiti Sains Malaysia."
  ur: "آکسفورڈ کتابیات ⁦(اسلامک اسٹڈیز)⁩ میں محمد اسری زین العابدین کے حوالے سے اندراج: یہ 2015 اور اس سے قبل 2006-2008 سے ان کے پرلیس مفتی، اس کی تعلیم، اور یونیورسٹی سینس ملائیشیا میں اس کے ایسوسی ایٹ پروفیسر کی تصدیق کرتا ہے۔"
  tr: "Oxford Bibliyografyası'nın Muhammed Asri Zain Al-Abidin Akademik Girişi, 2015'ten itibaren ve öncesinde 2006–2008 yılları arasında Perlis Müftüsü olarak görev yapmasını ve Malezya Bilim Üniversitesi'ndeki eğitim ve akademik pozisyonunu doğrulamaktadır."
  id: "Pengantar Akademik Oxford Bibliography tentang Muhammad Asri Zain Al-Abidin menegaskan masa jabatannya sebagai Mufti Perlis sejak 2015 dan sebelumnya dari 2006–2008, serta pendidikan dan posisi akademisnya di Universiti Science Malaysia."
