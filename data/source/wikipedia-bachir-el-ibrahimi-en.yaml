summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد البشير الإبراهيمي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بأولاد إبراهم في 13 يونيو 1889 ⁦(14 شوال 1306هـ)⁩ ووفاته بسطيف في 20 مايو 1965، ودراسته بالمدينة ودمشق، ودوره نائبًا لابن باديس ثم خليفته في رئاسة جمعية العلماء المسلمين. صندوق معلوماتها يعطي فقهه «مالكي» وعقيدته «أثري» وحركته «السلفية»."
  en: "English Wikipedia article on Mohamed Bachir El Ibrahimi; used for entity facts only. It gives his birth at Ouled Brahim on 13 June 1889 (14 Shawwal 1306 AH) and death at Setif on 20 May 1965, his studies in Medina and Damascus, and his role as Ben Badis's deputy and successor at the head of the Association of Algerian Muslim Ulama. Its infobox gives his jurisprudence as Maliki, his creed as Athari and his movement as Salafiyya."
  es: "Artículo de la Wikipedia en inglés sobre Mohamed Bachir El Ibrahimi; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Ouled Brahim el 13 de junio de 1889 (14 de Shawwal de 1306 AH) y su fallecimiento en Setif el 20 de mayo de 1965, sus estudios en Medina y Damasco, y su papel como adjunto y sucesor de Ben Badis al frente de la Asociación de Ulemas Musulmanes Argelinos. Su ficha informativa indica que su jurisprudencia era malikí, su credo athari y su movimiento salafista."
  fr: "Article de Wikipédia en anglais sur Mohamed Bachir El Ibrahimi; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance à Ouled Brahim le 13 juin 1889 (14 Shawwal 1306 AH) et son décès à Sétif le 20 mai 1965, ses études à Médine et à Damas, ainsi que son rôle d'adjoint et de successeur de Ben Badis à la tête de l'Association des oulémas musulmans d'Algérie. Son infobox précise qu'il était de confession malikite, de confession athari et de mouvement salafiste."
