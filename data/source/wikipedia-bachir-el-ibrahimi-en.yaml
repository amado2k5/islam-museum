summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد البشير الإبراهيمي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بأولاد إبراهم في 13 يونيو 1889 (14 شوال 1306هـ) ووفاته بسطيف في 20 مايو 1965، ودراسته بالمدينة ودمشق، ودوره نائبًا لابن باديس ثم خليفته في رئاسة جمعية العلماء المسلمين. صندوق معلوماتها يعطي فقهه «مالكي» وعقيدته «أثري» وحركته «السلفية»."
  en: "English Wikipedia article on Mohamed Bachir El Ibrahimi; used for entity facts only. It gives his birth at Ouled Brahim on 13 June 1889 (14 Shawwal 1306 AH) and death at Setif on 20 May 1965, his studies in Medina and Damascus, and his role as Ben Badis's deputy and successor at the head of the Association of Algerian Muslim Ulama. Its infobox gives his jurisprudence as Maliki, his creed as Athari and his movement as Salafiyya."
