summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الاقتصادي والسياسي الباكستاني خورشيد أحمد (1932–2025): مولده بدلهي، ودراسته في لاهور وكراتشي وليستر، وتأسيسه المؤسسة الإسلامية في ليستر، وعمله في الجماعة الإسلامية ومجلس الشيوخ (2002–2012)، ورئاسته لجنة التخطيط، ومؤلفاته، ونيشان امتياز 2011، وجائزة الملك فيصل 1990، ووفاته بليستر في 13 أبريل 2025."
  en: "English Wikipedia article on the Pakistani economist and politician Khurshid Ahmad (1932–2025): birth in Delhi, study in Lahore, Karachi and Leicester, co-founding of the Islamic Foundation in Leicester, Jamaat-e-Islami work and Senate seat (2002–2012), chairmanship of the Planning Commission, books, Nishan-e-Imtiaz 2011, King Faisal Prize 1990, and death in Leicester on 13 April 2025."
  es: "Artículo de la Wikipedia en inglés sobre el economista y político pakistaní Khurshid Ahmad (1932-2025): nacimiento en Delhi, estudios en Lahore, Karachi y Leicester, cofundación de la Fundación Islámica en Leicester, trabajo en Jamaat-e-Islami y escaño en el Senado (2002-2012), presidencia de la Comisión de Planificación, libros, Nishan-e-Imtiaz 2011, Premio Rey Faisal 1990 y muerte en Leicester el 13 de abril de 2025."
  fr: "Article de Wikipédia en anglais sur l'économiste et homme politique pakistanais Khurshid Ahmad (1932-2025): naissance à Delhi, études à Lahore, Karachi et Leicester, cofondation de la Fondation islamique à Leicester, travail au sein de Jamaat-e-Islami et siège au Sénat (2002-2012), présidence de la Commission de planification, livres, Nishan-e-Imtiaz 2011, Prix du roi Faisal 1990 et décès à Leicester le 13 avril 2025."
