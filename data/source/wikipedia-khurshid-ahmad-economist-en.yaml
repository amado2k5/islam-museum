summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الاقتصادي والسياسي الباكستاني خورشيد أحمد (1932–2025): مولده بدلهي، ودراسته في لاهور وكراتشي وليستر، وتأسيسه المؤسسة الإسلامية في ليستر، وعمله في الجماعة الإسلامية ومجلس الشيوخ (2002–2012)، ورئاسته لجنة التخطيط، ومؤلفاته، ونيشان امتياز 2011، وجائزة الملك فيصل 1990، ووفاته بليستر في 13 أبريل 2025."
  en: "English Wikipedia article on the Pakistani economist and politician Khurshid Ahmad (1932–2025): birth in Delhi, study in Lahore, Karachi and Leicester, co-founding of the Islamic Foundation in Leicester, Jamaat-e-Islami work and Senate seat (2002–2012), chairmanship of the Planning Commission, books, Nishan-e-Imtiaz 2011, King Faisal Prize 1990, and death in Leicester on 13 April 2025."
