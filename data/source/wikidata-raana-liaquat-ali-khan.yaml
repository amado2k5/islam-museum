  ar: "عنصر ويكيداتا Q1951764 لرعنا لياقت علي خان؛ يعطي مولدها في 13 شباط 1905 في ألمورا ووفاتها في 13 حزيران 1990 في كراتشي، وقرينها لياقت علي خان، وقيمة ديانته (P140) هي الإسلام فقط."
  en: "Wikidata item Q1951764 for Ra'ana Liaquat Ali Khan; it gives her birth on 13 February 1905 at Almora and her death on 13 June 1990 at Karachi, her spouse as Liaquat Ali Khan, and a single religion value (P140): Islam only."
  es: "Elemento de Wikidata Q1951764 para Ra'ana Liaquat Ali Khan; indica que nació el 13 de febrero de 1905 en Almora y murió el 13 de junio de 1990 en Karachi, que su esposo era Liaquat Ali Khan y que profesaba únicamente el Islam (P140)."
  fr: "L'élément Wikidata Q1951764 pour Ra'ana Liaquat Ali Khan; il indique sa naissance le 13 février 1905 à Almora et sa mort le 13 juin 1990 à Karachi, son époux comme Liaquat Ali Khan, et une seule valeur de religion (P140): l'Islam seulement."
  ur: "وکی ڈیٹا آئٹم Q1951764 برائے رانا لیاقت علی خان؛ اس کی پیدائش 13 فروری 1905 کو الموڑہ میں ہوئی اور اس کی موت 13 جون 1990 کو کراچی میں ہوئی، اس کی شریک حیات بطور لیاقت علی خان، اور واحد مذہب کی قدر (P140): صرف اسلام۔"
  tr: "Wikidata öğesi Q1951764 Rana Liaquat Ali Khan; doğum tarihi 13 Şubat 1905'te Almora'da ve ölümü 13 Haziran 1990'da Karaçi'de verilmiştir. Eşi Liaquat Ali Khan onun eşidir ve dininin değeri (P140) yalnızca İslam'dır."
  id: "Elemen Wikidata Q1951764 Rana Liaquat Ali Khan; tanggal lahirnya tercantum pada 13 Februari 1905 di Almora dan kematiannya pada 13 Juni 1990 di Karachi. Selirnya, Liaquat Ali Khan, adalah suaminya, dan nilai agamanya (P140) hanya Islam."
