  fr: "Fiche d'information sur le prix Nobel d'Ahmed Zewail: né à Damanhur en 1946 et élevé à Alexandrie; seul prix Nobel de chimie en 1999 pour ses études sur les états de transition des réactions chimiques utilisant la spectroscopie femtoseconde."
