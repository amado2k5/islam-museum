summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شهباز شريف؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 23 سبتمبر 1951 في لاهور، وخلفية أسرته التجارية، وولاياته الثلاث رئيسا لوزراء البنجاب (1997–1999 و2008–2013 و2013–2018)، ومنفاه في السعودية (2000–2007)، ورئاسته للرابطة الإسلامية الباكستانية (ن)، ورئاسته للوزراء (2022–2023 ومنذ 2024). وتذكر قضية القتل خارج القضاء في سبززار التي بُرئ منها سنة 2008، وقضية غسل الأموال التي اعتُقل فيها سنة 2020 وبُرئ من جميع تهمها في 12 أكتوبر 2022."
  en: "English Wikipedia article on Shehbaz Sharif; used for entity facts only. It recounts his birth on 23 September 1951 at Lahore, his family's business background, his three terms as chief minister of Punjab (1997–1999, 2008–2013, 2013–2018), his exile in Saudi Arabia (2000–2007), his presidency of the PML(N), and his premierships (2022–2023 and since 2024). It also records the Sabzazar extrajudicial-killings case, of which he was acquitted in 2008, and the money-laundering case, in which he was arrested in 2020 and acquitted on all charges on 12 October 2022."
