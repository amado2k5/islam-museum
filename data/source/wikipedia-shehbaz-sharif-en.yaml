summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شهباز شريف؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 23 سبتمبر 1951 في لاهور، وخلفية أسرته التجارية، وولاياته الثلاث رئيسا لوزراء البنجاب ⁦(1997–1999 و2008–2013 و2013–2018)⁩، ومنفاه في السعودية (2000–2007)، ورئاسته للرابطة الإسلامية الباكستانية ⁦(ن)⁩، ورئاسته للوزراء ⁦(2022–2023 ومنذ 2024)⁩. وتذكر قضية القتل خارج القضاء في سبززار التي بُرئ منها سنة 2008، وقضية غسل الأموال التي اعتُقل فيها سنة 2020 وبُرئ من جميع تهمها في 12 أكتوبر 2022."
  en: "English Wikipedia article on Shehbaz Sharif; used for entity facts only. It recounts his birth on 23 September 1951 at Lahore, his family's business background, his three terms as chief minister of Punjab (1997–1999, 2008–2013, 2013–2018), his exile in Saudi Arabia (2000–2007), his presidency of the PML(N), and his premierships (2022–2023 and since 2024). It also records the Sabzazar extrajudicial-killings case, of which he was acquitted in 2008, and the money-laundering case, in which he was arrested in 2020 and acquitted on all charges on 12 October 2022."
  es: "Artículo de la Wikipedia en inglés sobre Shehbaz Sharif; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 23 de septiembre de 1951 en Lahore, los antecedentes empresariales de su familia, sus tres mandatos como primer ministro de Punjab (1997-1999, 2008-2013, 2013-2018), su exilio en Arabia Saudita (2000-2007), su presidencia del PML(N) y sus mandatos como primer ministro (2022-2023 y desde 2024). También registra el caso de las ejecuciones extrajudiciales de Sabzazar, del que fue absuelto en 2008, y el caso de lavado de dinero, en el que fue arrestado en 2020 y absuelto de todos los cargos el 12 de octubre de 2022."
  fr: "Article de Wikipédia en anglais consacré à Shehbaz Sharif; utilisé uniquement pour les informations le concernant. Il relate sa naissance le 23 septembre 1951 à Lahore, les origines commerciales de sa famille, ses trois mandats de ministre en chef du Pendjab (1997-1999, 2008-2013, 2013-2018), son exil en Arabie saoudite (2000-2007), sa présidence du PML(N) et ses fonctions de Premier ministre (2022-2023 et depuis 2024). Il relate également l'affaire des exécutions extrajudiciaires de Sabzazar, dont il a été acquitté en 2008, et l'affaire de blanchiment d'argent, dans laquelle il a été arrêté en 2020 et acquitté de toutes les charges le 12 octobre 2022."
