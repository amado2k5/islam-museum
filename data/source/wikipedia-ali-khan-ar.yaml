summary:
  ar: "مقالة ويكيبيديا العربية عن بير مرشد محمد علي خان (1881–1958)؛ وهي ترجمة للمقالة الإنجليزية، تنص على زعامته للحركة الصوفية العالمية منذ 1948 حتى وفاته ووفاته في لاهاي ودفنه فيها."
  en: "The Arabic Wikipedia article on Pir-o-Murshid Muhammad Ali Khan (1881–1958); it is a translation of the English article, stating his leadership of the International Sufi Movement from 1948 until his death, and his death and burial at The Hague."
  es: "El artículo de Wikipedia en árabe sobre Pir-o-Murshid Muhammad Ali Khan (1881-1958) es una traducción del artículo en inglés que describe su liderazgo del Movimiento Sufí Internacional desde 1948 hasta su muerte, así como su fallecimiento y entierro en La Haya."
  fr: "L'article de Wikipédia en arabe sur Pir-o-Murshid Muhammad Ali Khan (1881–1958); il s'agit d'une traduction de l'article anglais, indiquant son rôle de chef du Mouvement soufi international de 1948 jusqu'à sa mort, ainsi que sa mort et son enterrement à La Haye."
  ur: "پیر و مرشد محمد علی خان (1881–1958) پر عربی ویکیپیڈیا مضمون؛ یہ انگریزی مضمون کا ترجمہ ہے، جس میں 1948 سے لے کر اپنی موت تک بین الاقوامی صوفی تحریک کی ان کی قیادت، اور دی ہیگ میں ان کی موت اور تدفین کے بارے میں بتایا گیا ہے۔"
  tr: "Pir Murşid Muhammed Ali Han (1881–1958) hakkında Arapça Vikipedi makalesi; İngilizce makalenin çevirisi olup, 1948'den ölümüne ve Lahey'de defnedilmesine kadar dünya Sufi hareketine liderliğini anlatır."
  id: "Artikel Wikipedia berbahasa Arab tentang Pir Murshid Muhammad Ali Khan (1881–1958); terjemahan dari artikel bahasa Inggris, menyatakan kepemimpinannya dalam gerakan Sufi dunia dari tahun 1948 hingga wafat dan dimakamkannya di Den Haag."
