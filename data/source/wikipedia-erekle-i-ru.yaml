  ar: "مقالة ويكيبيديا الروسية عن إركلي الأول ملك كارتلي وكاخيتي؛ تعطي ولادته سنة 1637 أو 1642 وقبوله الإسلام باسم نزار علي خان ووفاته في إصفهان سنة 1709؛ تُستخدم لوقائع الكيان فقط."
  en: "Russian Wikipedia article on Erekle I, king of Kartli and Kakheti; it gives his birth as 1637 or 1642, his acceptance of Islam under the name Nazar Ali Khan, and his death at Isfahan in 1709; used for entity facts only, each cited where the article gives its own source."
  es: "Artículo de la Wikipedia rusa sobre Erekle I, rey de Kartli y Kakheti; indica que nació en 1637 o 1642, que se convirtió al Islam con el nombre de Nazar Ali Khan y que murió en Isfahán en 1709; se utiliza únicamente para datos sobre las entidades, citados en el artículo donde se indica su fuente."
  fr: "Article de Wikipédia russe sur Erekle Ier, roi de Kartli et de Kakhétie; il indique sa naissance en 1637 ou 1642, sa conversion à l’islam sous le nom de Nazar Ali Khan et sa mort à Ispahan en 1709; utilisé uniquement pour les informations factuelles, chaque élément étant cité lorsque l’article donne sa propre source."
  ur: "کارتلی اور کاکھیتی کے بادشاہ Erekle I پر روسی ویکیپیڈیا کا مضمون؛ اس میں ان کی پیدائش 1637 یا 1642، نظر علی خان کے نام سے قبول اسلام، اور 1709 میں اصفہان میں ان کی موت؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک کا حوالہ دیا جاتا ہے جہاں مضمون اپنا ماخذ دیتا ہے۔"
  tr: "Kartli ve Kakheti Kralı Erkely I hakkında Rusça Wikipedia makalesi; 1637 veya 1642'de doğumunu, Nizar Ali Han olarak İslam'a geçişini ve 1709'da İsfahan'da öldüğünü belirtir; sadece varlığın gerçekleri için kullanılır."
  id: "Artikel Wikipedia Rusia tentang Erkely I, Raja Kartli dan Kakheti; menceritakan kelahirannya pada tahun 1637 atau 1642, konversinya ke Islam sebagai Nizar Ali Khan, dan kematiannya di Isfahan pada tahun 1709; artikel ini hanya digunakan untuk fakta-fakta entitas tersebut."
