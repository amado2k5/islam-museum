reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth as 1637 or 1642 — neither the 1643 of the English article and the Wikidata item nor a single settled year — and narrates that after his 1674 return the shah demanded a change of faith as the price of the throne, that after hesitation he accepted Islam and received the name Nazar Ali Khan, that he then spent fourteen years at the shah's court in Isfahan, was installed in Kartli in 1688, was transferred to Kakheti in 1703, handed that kingdom to his son David (Imam Quli Khan), and died at Isfahan in 1709. It names no branch or school of Islam for the king himself. Checked 1 November 2026."
