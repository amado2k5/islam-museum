reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives Salman Amin Khan, born 11 October 1976 in Metairie, Louisiana, into a Bengali Muslim family — family background, not a school attestation for Khan himself; his own quoted statement on his beliefs is a generic statement about making the best of life and being humbled by the universe, naming no religion or school. Covers: Grace King High School valedictorian 1994; MIT degrees 1998 and Harvard MBA 2003; hedge-fund analyst 2003-2009; tutoring his cousin from 2004, YouTube from 2006, Khan Academy, Khan Lab School founded 2014, Schoolhouse.world 2020; Time 100 2012; Padma Shri 2016."
