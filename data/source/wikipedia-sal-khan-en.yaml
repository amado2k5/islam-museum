summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سال خان؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في 11 أكتوبر 1976 في ميتايري بلويزيانا في أسرة بنغالية مسلمة، وتعليمه في معهد ماساتشوستس وهارفارد، وتأسيسه أكاديمية خان ومدرسة خان لاب، ولا تسمّي له مذهبًا."
  en: "English Wikipedia article on Sal Khan; used for entity facts only. It records his birth on 11 October 1976 in Metairie, Louisiana, into a Bengali Muslim family, his MIT and Harvard education, and his founding of Khan Academy and Khan Lab School, and names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Sal Khan; utilizado únicamente para datos sobre la persona. Registra su nacimiento el 11 de octubre de 1976 en Metairie, Luisiana, en el seno de una familia musulmana bengalí, su formación en el MIT y Harvard, y la fundación de la Khan Academy y la Khan Lab School, pero no menciona ninguna escuela en particular."
  fr: "Article Wikipédia en anglais sur Sal Khan; utilisé uniquement pour les informations le concernant. Il mentionne sa naissance le 11 octobre 1976 à Metairie, en Louisiane, dans une famille musulmane bengalie, ses études au MIT et à Harvard, ainsi que la création de la Khan Academy et de la Khan Lab School, sans toutefois préciser le nom de l’établissement scolaire auquel il a été rattaché."
  ur: "سال خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 11 اکتوبر 1976 کو میٹیری، لوزیانا میں ایک بنگالی مسلمان خاندان میں ان کی پیدائش، اس کی MIT اور ہارورڈ کی تعلیم، اور خان اکیڈمی اور خان لیب اسکول کی بنیاد رکھی گئی ہے، اور اس کے لیے کسی اسکول کا نام نہیں رکھا گیا ہے۔"
