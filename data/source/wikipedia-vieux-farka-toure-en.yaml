reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives Boureima 'Vieux' Farka Touré, born 12 March 1981 at Niafunké, son of Ali Farka Touré; his secret guitar study against his father's discouragement and enrolment at the Institut National des Arts in Bamako; the self-titled debut album (World Village, 12 February 2007) featuring Toumani Diabaté and his late father; Fondo (2009), number 5 on Billboard's World Albums chart in the week of 11 July 2009; the opening celebration of the 2010 FIFA World Cup; The Secret (2011), with the last collaboration with his father; Mon Pays (2013), its title a reminder of Mali's beauty amid the conflict begun in January 2012; Samba (2017) — 'Samba' being his childhood nickname as the second boy; Les Racines (10 June 2022); Ali (September 2022) with Khruangbin, covering his father's songs; and the Touré-Raichel Collective with Idan Raichel (The Tel Aviv Session, 2012; The Paris Session, 2014). The article states no religion for him."
