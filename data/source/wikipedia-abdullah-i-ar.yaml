summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الله الأول بن الحسين الهاشمي ⁦(1299–1370 هـ / 1882–1951 م)⁩، مؤسس المملكة الأردنية الهاشمية وأول ملوكها المعروف بلقب الملك المؤسس، وثاني أبناء الشريف حسين الأربعة؛ وُلد في مكة وتعلّم فيها وفي إسطنبول، وكان شاعرًا أديبًا، وقاد قوات عربية في الثورة العربية الكبرى، وأسس إمارة شرق الأردن في 11 أبريل 1921 ووضع دستورها الأول سنة 1928، ونال استقلالها في 25 مايو 1946، واغتيل عند مدخل المسجد الأقصى في القدس."
  en: "Arabic Wikipedia article on Abdullah I bin al-Hussein al-Hashimi (1299–1370 AH / 1882–1951 CE), founder of the Hashemite Kingdom of Jordan and its first king, known as the Founder King, and second of Sharif Hussein's four sons; born at Mecca and educated there and at Istanbul, a poet and man of letters, he led Arab forces in the Great Arab Revolt, founded the Emirate of Transjordan on 11 April 1921, gave it its first constitution in 1928, won its independence on 25 May 1946, and was assassinated at the entrance of al-Aqsa Mosque in Jerusalem."
  es: "Artículo de Wikipedia en árabe sobre Abdullah I bin al-Hussein al-Hashimi (1299–1370 AH / 1882–1951 CE), fundador del Reino Hachemita de Jordania y su primer rey, conocido como el Rey Fundador, y segundo de los cuatro hijos de Sharif Hussein; nacido en La Meca y educado allí y en Estambul, poeta y hombre de letras, dirigió las fuerzas árabes en la Gran Revuelta Árabe, fundó el Emirato de Transjordania el 11 de abril de 1921, le otorgó su primera constitución en 1928, obtuvo su independencia el 25 de mayo de 1946 y fue asesinado en la entrada de la Mezquita de Al-Aqsa en Jerusalén."
  fr: "Article de Wikipédia en arabe sur Abdullah I bin al-Hussein al-Hashimi (1299–1370 AH / 1882–1951 CE), fondateur du royaume hachémite de Jordanie et son premier roi, connu sous le nom de Roi fondateur, et deuxième des quatre fils du chérif Hussein; né à La Mecque et éduqué là-bas et à Istanbul, poète et homme de lettres, il a dirigé les forces arabes lors de la Grande Révolte arabe, fondé l'émirat de Transjordanie le 11 avril 1921, lui a donné sa première constitution en 1928, a obtenu son indépendance le 25 mai 1946 et a été assassiné à l'entrée de la mosquée al-Aqsa à Jérusalem."
  ur: "عبداللہ اول بن الحسین الہاشمی ⁦(1299–1370 ہجری / 1882–1951 عیسوی)⁩ پر عربی ویکیپیڈیا کا مضمون، اردن کی ہاشمی سلطنت کے بانی اور اس کے پہلے بادشاہ، جو بانی بادشاہ کے طور پر جانا جاتا ہے، اور شریف حسین کے چار بیٹوں میں سے دوسرا؛ مکہ میں پیدا ہوئے اور وہیں تعلیم حاصل کی اور استنبول میں، ایک شاعر اور خطاطی کے آدمی، انہوں نے عظیم عرب بغاوت میں عرب افواج کی قیادت کی، 11 اپریل 1921 کو امارات آف اردن کی بنیاد رکھی، 1928 میں اسے اپنا پہلا آئین دیا، 25 مئی 1946 کو اس کی آزادی حاصل کی، اور موقع پر قاتلانہ حملہ کیا گیا۔ یروشلم۔"
