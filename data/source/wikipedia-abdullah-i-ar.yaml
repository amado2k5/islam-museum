summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الله الأول بن الحسين الهاشمي (1299–1370 هـ / 1882–1951 م)، مؤسس المملكة الأردنية الهاشمية وأول ملوكها المعروف بلقب الملك المؤسس، وثاني أبناء الشريف حسين الأربعة؛ وُلد في مكة وتعلّم فيها وفي إسطنبول، وكان شاعرًا أديبًا، وقاد قوات عربية في الثورة العربية الكبرى، وأسس إمارة شرق الأردن في 11 أبريل 1921 ووضع دستورها الأول سنة 1928، ونال استقلالها في 25 مايو 1946، واغتيل عند مدخل المسجد الأقصى في القدس."
  en: "Arabic Wikipedia article on Abdullah I bin al-Hussein al-Hashimi (1299–1370 AH / 1882–1951 CE), founder of the Hashemite Kingdom of Jordan and its first king, known as the Founder King, and second of Sharif Hussein's four sons; born at Mecca and educated there and at Istanbul, a poet and man of letters, he led Arab forces in the Great Arab Revolt, founded the Emirate of Transjordan on 11 April 1921, gave it its first constitution in 1928, won its independence on 25 May 1946, and was assassinated at the entrance of al-Aqsa Mosque in Jerusalem."
