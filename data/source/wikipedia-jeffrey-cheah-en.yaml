summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جيفري تشياه ⁦(وُلد سنة 1945 في بوسينغ بولاية بيراك)⁩، مؤسس مجموعة صنواي وجامعة صنواي ومؤسسة جيفري تشياه؛ تذكر مسيرته من منجم قصدير صغير إلى مدينة صنواي، واستثماره في التعليم، وأوسمته الماليزية والبريطانية والأسترالية."
  en: "English Wikipedia article on Jeffrey Cheah (born 1945 at Pusing, Perak), founder of the Sunway Group, Sunway University and the Jeffrey Cheah Foundation; it covers his rise from a small tin-mining company to Sunway City, his investment in education, and his Malaysian, British and Australian honours."
  es: "Artículo de la Wikipedia en inglés sobre Jeffrey Cheah (nacido en 1945 en Pusing, Perak), fundador del Grupo Sunway, la Universidad Sunway y la Fundación Jeffrey Cheah; en él se narra su ascenso desde una pequeña empresa minera de estaño hasta Sunway City, su inversión en educación y los honores que recibió en Malasia, Gran Bretaña y Australia."
  fr: "Article de Wikipédia en anglais sur Jeffrey Cheah (né en 1945 à Pusing, Perak), fondateur du groupe Sunway, de l'université Sunway et de la fondation Jeffrey Cheah; il retrace son ascension, d'une petite entreprise d'extraction d'étain à Sunway City, son investissement dans l'éducation et ses distinctions malaisiennes, britanniques et australiennes."
  ur: "سن وے گروپ، سن وے یونیورسٹی اور جیفری چیہ فاؤنڈیشن کے بانی Jeffrey Cheah ⁦(پیدائش 1945 میں Pusing، Perak)⁩ پر انگریزی ویکیپیڈیا مضمون؛ اس میں ٹن مائننگ کی ایک چھوٹی کمپنی سے سن وے سٹی تک ان کے عروج، تعلیم میں ان کی سرمایہ کاری، اور ملائشین، برطانوی اور آسٹریلوی اعزازات شامل ہیں۔"
  tr: "Geoffrey Chiah (1945 doğumlu, Bussing, Perak Eyaleti doğumlu), Sunway Group, Sunway Üniversitesi ve Geoffrey Chiah Vakfı'nın kurucusu olan Geoffrey Chiah'ın İngilizce Wikipedia makalesi, küçük bir kalay madeninden Sunway şehrine olan yolculuğunu, eğitime yaptığı yatırımı ve Malezya, İngiliz ve Avustralya madalyalarını anlatıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Geoffrey Chiah (lahir 1945 di Bussing, Negara Bagian Perak), pendiri Sunway Group, Universitas Sunway, dan Geoffrey Chiah Foundation, mengenang perjalanannya dari tambang timah kecil ke kota Sunway, investasinya dalam pendidikan, serta medali Malaysia, Inggris, dan Australia."
