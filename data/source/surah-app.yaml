label:
  ar: "تطبيق سورة وواجهته العامة ⁦(Surah app / Public Sura API)⁩"
  en: "Surah app and Public Sura API (Tafsir Center for Quranic Studies)"
  ur: "سورہ ایپ اور عوامی سورہ API ⁦(Surah app)⁩"
summary:
  ar: "تطبيق ويب وواجهة برمجية عامة يصدرهما مركز تفسير للدراسات القرآنية، تعرض نص المصحف برواية حفص عن عاصم طبعة مجمع الملك فهد ١٤٤٠هـ، وعشرين مشروعًا علميًا على مستوى الكلمة والآية والصفحة والسورة، منها تفسير ابن كثير وتفسير السعدي والمختصر في تفسير القرآن الكريم وإعراب القرآن وبيان القراءات وأسباب النزول والمكي والمدني. يُستعمل هنا للحقائق الفهرسية عن هذه الطبعات فقط."
  en: "A web app and public API from the Tafsir Center for Quranic Studies. It carries the Hafs text of the King Fahd Complex edition (1440 AH) and twenty projects at word, verse, page and surah level, among them Ibn Kathir, al-Sa'di, al-Mukhtasar fi Tafsir al-Qur'an, grammatical analysis, variant readings, occasions of revelation and Makki and Madani studies. Used here only for catalogue facts about those editions."
  ur: "تفسیر مرکز برائے قرآنی مطالعات کی ویب ایپ اور عوامی API، جو مجمع الملک فہد کے ١٤٤٠ھ نسخے کی روایتِ حفص کے متن اور بیس علمی منصوبوں پر مشتمل ہے، جن میں ابن کثیر، سعدی، المختصر فی تفسیر القرآن، اعراب، قراءات، اسبابِ نزول اور مکی و مدنی کی بحثیں شامل ہیں۔ یہاں صرف ان ایڈیشنوں کے فہرستی حقائق کے لیے استعمال ہوتی ہے۔"
