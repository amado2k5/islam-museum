reliability_note: "Scored 14 Nov 2026 against the eight criteria of docs/agents/source-families.md. Authority: a named research centre, the editions are attributed to their authors, editors and printers. Citability: project slug plus sura and aya number at https://dev.surahapp.com/api/v1/. Terms: no terms or licence page found (the app links only About us, Contact us and Blog), robots.txt carries comment lines about content signals but sets none, the API is documented with Swagger and answers with open CORS; so facts-only, the default of criterion 3. The Qur'an wording is never taken from it (Tanzil only). The commentaries it carries are transcriptions of in-copyright printed editions, so only catalogue facts (author, editor, publisher, edition, pages) are used, and prose is rewritten in the museum's own words with a citation to the work. Rights, read 14 Nov 2026: the Arabic home page surahapp.com states the text is a digital copy of the Mushaf of the King Fahd Complex for the Printing of the Holy Quran in Madinah, riwaya of Hafs from Asim, issued 1440 AH; the web.surahapp.com footer reads all rights reserved for the Tafsir Center for Quranic Studies 2026 (surahapp.com footer 2025, 1446 AH, same holder). Related links named on the site: surahpedia.com, tafsir.net/articles, a Windows desktop app and the Public API at dev.surahapp.com. The site is therefore all rights reserved: facts-only, never copy its text or commentary wording, never use it for verse text (Tanzil only). The Tafsir and Translation tabs show no source names in the page text; the 20 API projects are the real catalogue. Longevity depends on the centre; cite the printed edition, not the URL."
