  ar: "مقالة ويكيبيديا الإنجليزية عن حماه الله بن محمد بن عمر؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه أول تلاميذ المصلح التيجاني سيدي محمد الأخضر والقائد الروحي لحركة الحمالية التيجانية، وتروي نفيه من نيورو سنة 1933 عبر موريتانيا وساحل العاج إلى فرنسا ووفاته في المنفى سنة 1943."
  en: "English Wikipedia article on Hamahullah bin Muhammad bin Umar; used for entity facts only. It describes him as the first disciple of the Tijani reformer Sidi Mohamed Lakhdar and the spiritual leader of the Hamallayya Tijani movement, and recounts his exile from Nioro in 1933 through Mauritania and Côte d'Ivoire to France and his death in exile in 1943."
