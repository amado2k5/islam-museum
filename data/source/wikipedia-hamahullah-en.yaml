reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. A short article resting on the UNESCO General History of Africa vol. VIII, Decalo's Historical Dictionary of Niger and Harrison's France and Islam in West Africa. Its lead gives his birth as 1882 while its own category files him under 1886 births — an internal conflict the record notes. Its text calls him a Sufi Muslim religious leader, the first disciple of the Tijaniyyah reformer Shaykh Sidi Mohamed Lakhdar (d. 1909 in Nioro), and spiritual leader of the Tijaniyyah reform movement that took his name, Hamallayya; it names Tierno Bokar and Yacouba Sylla as his most prominent disciples. It gives no exact death date or place beyond France, 1943."
