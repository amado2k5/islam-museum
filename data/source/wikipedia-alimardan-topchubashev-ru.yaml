summary:
  ar: "مقالة ويكيبيديا الروسية عن عليمردان بك توبتشوباشوف؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته القانونية والسياسية بالتفصيل، ويعطي صدرها ميلاده في 4 مايو 1863 في تفليس، وهو قراءة تخالف صدرَي المقالة الإنجليزية والأذربيجانية (1862)، ووفاته في باريس في 8 نوفمبر 1934."
  en: "Russian Wikipedia article on Alimardan bey Topchubashov; used for entity facts only. It recounts his legal and political career in detail; its lead gives his birth as 4 May 1863 at Tiflis, the reading that differs from the English and Azerbaijani leads (1862), and his death in Paris on 8 November 1934."
  es: "Artículo de la Wikipedia rusa sobre Alimardan bey Topchubashov; utilizado únicamente para datos sobre la persona. Relata en detalle su trayectoria jurídica y política; su introducción indica que nació el 4 de mayo de 1863 en Tiflis, fecha que difiere de las introducciones en inglés y azerbaiyano (1862), y que falleció en París el 8 de noviembre de 1934."
  fr: "Article de Wikipédia en russe sur Alimardan bey Topchubashov; utilisé uniquement pour les informations sur l’entité. Il relate en détail sa carrière juridique et politique; son introduction indique sa naissance le 4 mai 1863 à Tiflis, une date différente de celle des introductions anglaise et azerbaïdjanaise (1862), et son décès à Paris le 8 novembre 1934."
  ur: "روسی ویکیپیڈیا مضمون علیمردان پر ٹوپچوباشوف سے؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے قانونی اور سیاسی کیریئر کا تفصیل سے ذکر کیا گیا ہے۔ اس کے لیڈ نے اس کی پیدائش 4 مئی 1863 کو ٹفلس میں کی، یہ پڑھنا انگریزی اور آذربائیجانی لیڈز (1862) سے مختلف ہے، اور اس کی موت 8 نومبر 1934 کو پیرس میں ہوئی۔"
  tr: "Alimardanbek Topçubaşov hakkında Rusça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Makale, onun hukuki ve siyasi kariyerini ayrıntılı olarak anlatır ve doğum tarihini 4 Mayıs 1863'te Tiflis'te belirtir; bu okuma İngilizce ve Azerbaycan makaleleriyle (1862) çelişir ve 8 Kasım 1934'te Paris'te öldüğünü belirtir."
  id: "Artikel Wikipedia Rusia tentang Alimardanbek Topchubashov hanya digunakan untuk fakta-fakta entitas tersebut. Artikel ini menceritakan secara rinci karier hukum dan politiknya, serta mencantumkan tanggal lahirnya pada 4 Mei 1863 di Tbilisi, sebuah bacaan yang bertentangan dengan artikel Inggris dan Azerbaijan (1862), serta kematiannya di Paris pada 8 November 1934."
