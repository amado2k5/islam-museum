  ar: "مقالة ويكيبيديا الفارسية «ایرج میرزا»؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في مهر 1253 هـ.ش (رمضان 1291 هـ) في تبريز ووفاته في 22 اسفند 1304 هـ.ش في طهران، وفيها قسم «الآراء الدينية» يعرض الجدل حول معتقده بين شعره الديني وشعره الهجائي."
  en: "Persian Wikipedia article 'Iraj Mirza'; used for entity facts only. It gives his birth in Mehr 1253 SH (Ramadan 1291 AH) at Tabriz and his death on 22 Esfand 1304 SH at Tehran, and carries a 'religious views' section laying out the dispute over his belief between his devotional verse and his satire."
