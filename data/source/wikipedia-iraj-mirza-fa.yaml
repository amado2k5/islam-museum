summary:
  ar: "مقالة ويكيبيديا الفارسية «ایرج میرزا»؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في مهر 1253 هـ.ش ⁦(رمضان 1291 هـ)⁩ في تبريز ووفاته في 22 اسفند 1304 هـ.ش في طهران، وفيها قسم «الآراء الدينية» يعرض الجدل حول معتقده بين شعره الديني وشعره الهجائي."
  en: "Persian Wikipedia article 'Iraj Mirza'; used for entity facts only. It gives his birth in Mehr 1253 SH (Ramadan 1291 AH) at Tabriz and his death on 22 Esfand 1304 SH at Tehran, and carries a 'religious views' section laying out the dispute over his belief between his devotional verse and his satire."
  es: "Artículo de Wikipedia en persa titulado «Iraj Mirza»; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Mehr 1253 SH (Ramadán 1291 AH) en Tabriz y su muerte el 22 de Esfand 1304 SH en Teherán, e incluye una sección sobre sus «opiniones religiosas» que expone la controversia en torno a sus creencias entre su poesía devocional y su sátira."
  fr: "L'article Wikipédia persan « Iraj Mirza » est utilisé uniquement à des fins d'information sur l'entité. Il indique sa naissance en Mehr 1253 SH (Ramadan 1291 AH) à Tabriz et sa mort le 22 Esfand 1304 SH à Téhéran, et comporte une section « Points de vue religieux » exposant la controverse concernant ses croyances, entre ses poèmes dévotionnels et ses satires."
  ur: "فارسی ویکیپیڈیا مضمون 'ایراج مرزا'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش مہر 1253ھ ⁦(رمضان 1291ھ)⁩ میں تبریز میں ہوئی اور ان کی وفات 22 اسفند 1304ھ کو تہران میں ہوئی، اور اس میں ایک 'مذہبی نظریات' کا حصہ ہے جس میں ان کی عقیدتی آیت اور اس کے طنز کے درمیان ان کے عقیدے کے تنازعہ کو بیان کیا گیا ہے۔"
