reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read on 26 October 2026 and checked against the recorded revision. Its infobox religion field hedges 'Islam at first, probably later godless', citing one 2023 web article (Rasekhoon, 'Iraj Mirza: atheist poet or believer'); its religious-views section presents his na't of the Prophet, Ashura elegies and praise of Ali on one side and, on the other, an inference that his three religious odes were deliberately weak and insincere. Its infobox gives the death Hijri year as 1343, a slip (the date it pairs with 22 Esfand 1304 is 27 Sha'ban 1344)."
