reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It confirms her term as president from 7 April 2010 to 1 December 2011 — supporting the date the record follows against the English article's one stray '31 December' line — her birth at Frunze (now Bishkek) to Isak Otunbayev of the Kirghiz SSR Supreme Court (1967–1992) and the teacher Salika Daniyarova (1925–2020), her 1972 Moscow State University philosophy degree, her six years teaching at Kyrgyz State National University, her 1975 candidate dissertation on the Frankfurt School's critique of Marxist-Leninist dialectics, her party posts from 1981 and her 1986 appointment as deputy chair of the Council of Ministers and foreign minister of the Kirghiz SSR, and her 1989–1992 UNESCO roles. It describes her as a divorced mother of two, fluent in Kyrgyz, Russian, English, German and French, and gives her Afghanistan role — Special Representative of the UN Secretary-General and head of UNAMA from 2022 — in the present tense, where the English article dates that service to 2025. It names no religion for her."
