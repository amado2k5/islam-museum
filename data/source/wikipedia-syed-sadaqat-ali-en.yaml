summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن قاري سيد صداقت علي؛ تُستخدم لوقائع الكيان فقط. تروي برنامجه «القرآن» على تلفزيون باكستان منذ 1992 وتتلمذه على عبد الباسط عبد الصمد وجوائزه هلال الامتياز 2020 وستارة الامتياز 2015 وفخر الأداء، ولا تذكر سنة ميلاده."
  en: "English Wikipedia article on Qari Syed Sadaqat Ali; used for entity facts only. It recounts his PTV programme AlQuran (since 1992), his study under Abdul Basit 'Abd us-Samad, and his Hilal-i-Imtiaz (2020), Sitara-i-Imtiaz (2015) and Pride of Performance awards; it gives no birth year."
  es: "Artículo de la Wikipedia en inglés sobre Qari Syed Sadaqat Ali; utilizado únicamente para datos sobre la persona. Relata su programa de PTV AlQuran (desde 1992), sus estudios con Abdul Basit 'Abd us-Samad y sus premios Hilal-i-Imtiaz (2020), Sitara-i-Imtiaz (2015) y Orgullo de Desempeño; no indica el año de nacimiento."
  fr: "Article Wikipédia en anglais sur Qari Syed Sadaqat Ali; utilisé uniquement à titre informatif. Il relate son émission AlQuran sur PTV (depuis 1992), ses études auprès d’Abdul Basit 'Abd us-Samad, et ses distinctions Hilal-i-Imtiaz (2020), Sitara-i-Imtiaz (2015) et Pride of Performance; il ne mentionne pas son année de naissance."
  ur: "قاری سید صداقت علی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے پی ٹی وی پروگرام القرآن ⁦(1992 سے)⁩، عبدالباسط عبد الصمد کے زیر مطالعہ ان کا مطالعہ، اور ان کے ہلال امتیاز (2020)، ستارہ امتیاز (2015) اور پرائیڈ آف پرفارمنس ایوارڈز کا ذکر ہے۔ یہ کوئی سال پیدائش نہیں دیتا۔"
  tr: "Qari Syed Sadaqat Ali hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1992'den beri Pakistan Televizyonu'nda yayınlanan \"Kur'an\" programını, Abdul Basit Abdul Samad'ın yanında aldığı eğitimi ve ödülleri arasında Hilal-e-Imtiaz 2020, Sitara-e-Imtiaz 2015 ve Pride of Performance yer alır, doğum yılından bahsetmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Qari Syed Sadaqat Ali; digunakan hanya untuk fakta entitas. Artikel ini menceritakan programnya \"The Quran\" di Pakistan Television sejak 1992, bimbingan Abdul Basit Abdul Samad, dan penghargaan yang dimilikinya termasuk Hilal-e-Imtiaz 2020, Sitara-e-Imtiaz 2015, dan Pride of Performance, tanpa menyebutkan tahun kelahirannya."
