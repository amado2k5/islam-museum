summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الإخوة صابري؛ لوقائع الكيان فقط: تأسيس الفرقة في 1956 في كراتشي، وأعضاؤها ⁦(غلام فريد صابري ومقبول أحمد صابري ومحمود غزنوي صابري وكمال أحمد صابري)⁩، وأول تسجيل لهم في 1958، وحفل كارنيغي هول في 1975، وألبوماتهم مع ريل ورلد واليونسكو، ووسام حسن الأداء في 1978، ونهاية الفرقة بوفاة محمود غزنوي صابري في 21 يونيو 2021؛ وتستند إلى ذا غارديان وذا نيشن ونيويورك تايمز وداون."
  en: "English Wikipedia article on the Sabri Brothers; entity facts only: the party's founding in 1956 in Karachi, its members (Ghulam Farid, Maqbool Ahmed, Mehmood Ghaznavi and Kamal Ahmed Sabri), their first recording in 1958, the 1975 Carnegie Hall concert, their Real World and UNESCO albums, the Pride of Performance of 1978, and the end of the group with Mehmood Ghaznavi Sabri's death on 21 June 2021; it cites The Guardian, The Nation, The New York Times and Dawn."
  es: "Artículo de la Wikipedia en inglés sobre los hermanos Sabri; solo datos sobre la entidad: la fundación del grupo en 1956 en Karachi, sus miembros (Ghulam Farid, Maqbool Ahmed, Mehmood Ghaznavi y Kamal Ahmed Sabri), su primera grabación en 1958, el concierto de 1975 en el Carnegie Hall, sus álbumes Real World y UNESCO, el premio Pride of Performance de 1978 y el fin del grupo con la muerte de Mehmood Ghaznavi Sabri el 21 de junio de 2021; cita a The Guardian, The Nation, The New York Times y Dawn."
  fr: "Article de Wikipédia en anglais sur les Sabri Brothers; informations factuelles uniquement: la fondation du groupe en 1956 à Karachi, ses membres (Ghulam Farid, Maqbool Ahmed, Mehmood Ghaznavi et Kamal Ahmed Sabri), leur premier enregistrement en 1958, le concert de 1975 au Carnegie Hall, leurs albums Real World et UNESCO, le prix Pride of Performance de 1978 et la fin du groupe avec la mort de Mehmood Ghaznavi Sabri le 21 juin 2021; il cite The Guardian, The Nation, The New York Times et Dawn."
  ur: "صابری برادران پر انگریزی ویکیپیڈیا مضمون؛ ہستی کے حقائق صرف: کراچی میں 1956 میں پارٹی کی بنیاد، اس کے اراکین ⁦(غلام فرید، مقبول احمد، محمود غزنوی اور کمال احمد صابری)⁩، 1958 میں ان کی پہلی ریکارڈنگ، 1975 کا کارنیگی ہال کنسرٹ، ان کی حقیقی دنیا اور یونیسکو کے البمز، پرائیڈ آف پرفارمنس اور مہزنا گروپ کے اختتامی گروپ 1958 کے ساتھ۔ صابری کا انتقال 21 جون 2021 کو ہوا۔ اس نے دی گارڈین، دی نیشن، دی نیویارک ٹائمز اور ڈان کا حوالہ دیا ہے۔"
