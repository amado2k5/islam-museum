  ar: "مقالة ويكيبيديا الإنجليزية عن الإخوة صابري؛ لوقائع الكيان فقط: تأسيس الفرقة في 1956 في كراتشي، وأعضاؤها ⁦(غلام فريد صابري ومقبول أحمد صابري ومحمود غزنوي صابري وكمال أحمد صابري)⁩، وأول تسجيل لهم في 1958، وحفل كارنيغي هول في 1975، وألبوماتهم مع ريل ورلد واليونسكو، ووسام حسن الأداء في 1978، ونهاية الفرقة بوفاة محمود غزنوي صابري في 21 يونيو 2021؛ وتستند إلى ذا غارديان وذا نيشن ونيويورك تايمز وداون."
  en: "English Wikipedia article on the Sabri Brothers; entity facts only: the party's founding in 1956 in Karachi, its members (Ghulam Farid, Maqbool Ahmed, Mehmood Ghaznavi and Kamal Ahmed Sabri), their first recording in 1958, the 1975 Carnegie Hall concert, their Real World and UNESCO albums, the Pride of Performance of 1978, and the end of the group with Mehmood Ghaznavi Sabri's death on 21 June 2021; it cites The Guardian, The Nation, The New York Times and Dawn."
