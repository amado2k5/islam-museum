label: { en: "Mohsin-ul-Mulk — Abu al-Hasan Ali Nadwi's opinion on Ayat-e Bayyinat and its author" }
summary:
  ar: "رأي مولانا سيد أبو الحسن علي الحسني الندوي في كتاب «آيات بينات» ومؤلفه نواب محسن الملك، منقول من كتاب «الإسلام وأقدم المسلمين: صورتان متضادتان». ينصّ على أن محسن الملك «قبل عقيدة أهل السنة» بعد دراسة مستفيضة."
  en: "Maulana Syed Abu al-Hasan Ali al-Husayni Nadwi's opinion on the book Ayat-e Bayyinat and its author Nawab Mohsin-ul-Mulk, extracted from 'Islam and the earliest Muslims: Two conflicting portraits'. It states that Mohsin-ul-Mulk 'accepted the creed of the Ahlus Sunnah' owing to his extensive study."
  es: "Opinión de Maulana Syed Abu al-Hasan Ali al-Husayni Nadwi sobre el libro Ayat-e Bayyinat y su autor, Nawab Mohsin-ul-Mulk, extraída de «El Islam y los primeros musulmanes: dos retratos contradictorios». En ella se afirma que Mohsin-ul-Mulk «aceptó el credo de la Ahlus Sunnah» debido a sus extensos estudios."
  fr: "L'opinion de Maulana Syed Abu al-Hasan Ali al-Husayni Nadwi sur le livre Ayat-e Bayyinat et son auteur, Nawab Mohsin-ul-Mulk, extraite de « L'Islam et les premiers musulmans: deux portraits contradictoires ». Il y est affirmé que Mohsin-ul-Mulk « a adhéré à la doctrine des Ahlus Sunnah » en raison de ses études approfondies."
  ur: "مولانا سید ابو الحسن علی الحسینی ندوی کی کتاب آیتِ بینات اور اس کے مصنف نواب محسن الملک کے بارے میں رائے، 'اسلام اور قدیم ترین مسلمان: دو متضاد تصویریں' سے ماخوذ ہے۔ اس میں کہا گیا ہے کہ محسن الملک نے اپنے وسیع مطالعہ کی وجہ سے 'اہل سنت کے مسلک کو قبول کیا'۔"
title: "Moulana Sayyid Abu al-Hasan Ali al-Husayni Nadwi's Opinion Regarding the Book and the Author"
author: [{ family: "Nadwi", given: "Abu al-Hasan Ali" }]
publisher: "Mahajjah (extract of the printed opinion, also printed in the Difae Islam edition of Ayat-e Bayyinat)"
