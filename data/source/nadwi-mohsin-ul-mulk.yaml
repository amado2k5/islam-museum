summary:
  ar: "رأي مولانا سيد أبو الحسن علي الحسني الندوي في كتاب «آيات بينات» ومؤلفه نواب محسن الملك، منقول من كتاب «الإسلام وأقدم المسلمين: صورتان متضادتان». ينصّ على أن محسن الملك «قبل عقيدة أهل السنة» بعد دراسة مستفيضة."
  en: "Maulana Syed Abu al-Hasan Ali al-Husayni Nadwi's opinion on the book Ayat-e Bayyinat and its author Nawab Mohsin-ul-Mulk, extracted from 'Islam and the earliest Muslims: Two conflicting portraits'. It states that Mohsin-ul-Mulk 'accepted the creed of the Ahlus Sunnah' owing to his extensive study."
title: "Moulana Sayyid Abu al-Hasan Ali al-Husayni Nadwi's Opinion Regarding the Book and the Author"
author: [{ family: "Nadwi", given: "Abu al-Hasan Ali" }]
publisher: "Mahajjah (extract of the printed opinion, also printed in the Difae Islam edition of Ayat-e Bayyinat)"
URL: "https://mahajjah.com/moulana-sayyid-abu-al-hasan-ali-al-husayni-nadwis-opinion-regarding-the-book-and-the-author/"
language: en
reliability_note: "Independent scholarly text, read on 3 November 2026. Nadwi gives the author's Hijri dates (1253–1325 AH) and states in his own words that Mohsin-ul-Mulk accepted the creed of the Ahl al-Sunnah and wrote Ayat-e Bayyinat from his own observations. It is one of the two independent texts attesting 'Sunni' for the man himself; it names no legal school (madhhab) for him."
