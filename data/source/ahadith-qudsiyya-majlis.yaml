summary:
  ar: "جمع الأحاديث القدسية الواردة في موطأ مالك والكتب الستة، أعدته لجنة القرآن والحديث بالمجلس الأعلى للشئون الإسلامية بالقاهرة؛ نحو أربعمائة رواية مرقمة في جزأين مع شرح من القسطلاني والنووي. الطبعة العاشرة، القاهرة ١٤١٧هـ/١٩٩٧م، وزارة الأوقاف."
  en: "The hadith qudsi of the Muwatta and the six books, compiled by the Quran and Hadith Committee of the Supreme Council for Islamic Affairs in Cairo; about four hundred numbered narrations in two parts with commentary drawn from al-Qastallani and al-Nawawi. Tenth edition, Cairo 1417/1997, Ministry of Awqaf."
  es: "El hadiz qudsi del Muwatta y los seis libros, compilados por el Comité del Corán y el Hadiz del Consejo Supremo para Asuntos Islámicos en El Cairo; aproximadamente cuatrocientas narraciones numeradas en dos partes con comentarios de al-Qastallani y al-Nawawi. Décima edición, El Cairo 1417/1997, Ministerio de Awqaf."
  fr: "Le recueil de hadiths qudsi de la Muwatta et des six livres, compilé par le Comité du Coran et des hadiths du Conseil suprême des affaires islamiques du Caire; environ quatre cents récits numérotés en deux parties, avec des commentaires tirés d’al-Qastallani et d’al-Nawawi. Dixième édition, Le Caire 1417/1997, Ministère des Awqaf."
