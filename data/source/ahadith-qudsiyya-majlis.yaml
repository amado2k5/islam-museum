  ar: "جمع الأحاديث القدسية الواردة في موطأ مالك والكتب الستة، أعدته لجنة القرآن والحديث بالمجلس الأعلى للشئون الإسلامية بالقاهرة؛ نحو أربعمائة رواية مرقمة في جزأين مع شرح من القسطلاني والنووي. الطبعة العاشرة، القاهرة ١٤١٧هـ/١٩٩٧م، وزارة الأوقاف."
  en: "The hadith qudsi of the Muwatta and the six books, compiled by the Quran and Hadith Committee of the Supreme Council for Islamic Affairs in Cairo; about four hundred numbered narrations in two parts with commentary drawn from al-Qastallani and al-Nawawi. Tenth edition, Cairo 1417/1997, Ministry of Awqaf."
