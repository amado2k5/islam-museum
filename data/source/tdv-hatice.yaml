reliability_note: "Read on 1 November 2026 in the web edition, from the opening through her support for the Prophet in the early Meccan years. Facts taken from the sections read: her trade with trusted partners before her marriage, the partnership agreement she made with Muhammad and her sending him with her servant Maysara to Syria, his return and her proposal of marriage as the entry gives it. The entry presents the marriage narratives with their variants (the guardian, the mahr) and says some reports are weak; the record uses only the trade facts. Not read: the sections on her marriages to Muhammad's household, her death and the later reports, which are not cited here. The printed range pp. 465–466 is the one the page prints."
