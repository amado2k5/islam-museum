label: { ar: "خديجة — موسوعة TDV الإسلامية ⁦(م. ياشار كاندمير)⁩", en: "HATİCE (Khadija) — TDV İslâm Ansiklopedisi (M. Yaşar Kandemir)" }
summary:
  ar: "مدخل «خديجة» في موسوعة TDV الإسلامية التركية بقلم م. ياشار كاندمير، وحدّثه تحرير الموسوعة ⁦(المجلد 16، إسطنبول 1997، ص 465–466)⁩، ويذكر نشأتها وزواجها الأول والثاني، وتجارتها بالشراكة مع الأمناء، وعقد الشراكة مع النبي محمد وسفره إلى الشام، وزواجها منه، ودورها في أول الإسلام."
  en: "The TDV İslâm Ansiklopedisi entry 'Hatice' (Khadija) by M. Yaşar Kandemir, updated by the editorial team (vol. 16, Istanbul 1997, pp. 465–466). It covers her birth and marriages, her trade through trusted partners, the partnership agreement with Muhammad and his journey to Syria, her marriage to him, and her role in the early Muslim community."
  es: "La entrada «Hatice» (Khadija) de la TDV İslâm Ansiklopedisi, escrita por M. Yaşar Kandemir y actualizada por el equipo editorial (vol. 16, Estambul, 1997, págs. 465-466), abarca su nacimiento y matrimonios, su actividad comercial a través de socios de confianza, el acuerdo de asociación con Mahoma y su viaje a Siria, su matrimonio con él y su papel en la primera comunidad musulmana."
  fr: "L’article « Hatice » (Khadija) de M. Yaşar Kandemir, paru dans l’encyclopédie islamique TDV (vol. 16, Istanbul, 1997, p. 465-466) et mis à jour par l’équipe éditoriale, relate sa naissance et ses mariages, son commerce par l’intermédiaire de partenaires de confiance, son accord de partenariat avec Mahomet et son voyage en Syrie, son mariage avec lui, ainsi que son rôle au sein de la première communauté musulmane."
  ur: "TDV İslâm Ansiklopedisi اندراج 'Hatice' ⁦(خدیجہ)⁩ از M. Yaşar Kandemir، جسے ادارتی ٹیم نے اپ ڈیٹ کیا ہے ⁦(جلد 16، استنبول 1997، صفحہ 465–466)⁩۔ اس میں اس کی پیدائش اور شادیاں، قابل اعتماد شراکت داروں کے ذریعے اس کی تجارت، محمد کے ساتھ شراکت داری کا معاہدہ اور اس کا شام کا سفر، اس سے اس کی شادی، اور ابتدائی مسلم کمیونٹی میں اس کے کردار کا احاطہ کیا گیا ہے۔"
  tr: "M. Yaşar Kandemir'in Türk İslami TDV Ansiklopedisi'nde (Cilt 16, İstanbul 1997, ss. 465–466) \"Hadica\" maddesi, onun yetiştirilme tarzından, ilk ve ikinci evliliklerinden, mütevellilerle ortaklık mesleğinden, Peygamber Muhammed ile ortaklığından, onun Levant'a seyahatinden, onunla evliliğinden ve İslam'ın ilk günlerindeki rolünden bahseder."
  id: "Entri tentang \"Khadija\" dalam Ensiklopedia TDV Islam Turki oleh M. Yaşar Kandemir, yang diedit oleh ensiklopedia (Vol. 16, Istanbul 1997, hlm. 465–466), menyebutkan masa kecilnya, pernikahan pertama dan keduanya, kemitraannya dengan para wali, kemitraannya dengan Nabi Muhammad, perjalanannya ke Levant, pernikahannya dengannya, dan perannya di masa awal Islam."
