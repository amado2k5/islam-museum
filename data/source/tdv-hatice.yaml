summary:
  ar: "مدخل «خديجة» في موسوعة TDV الإسلامية التركية بقلم م. ياشار كاندمير، وحدّثه تحرير الموسوعة (المجلد 16، إسطنبول 1997، ص 465–466)، ويذكر نشأتها وزواجها الأول والثاني، وتجارتها بالشراكة مع الأمناء، وعقد الشراكة مع النبي محمد وسفره إلى الشام، وزواجها منه، ودورها في أول الإسلام."
  en: "The TDV İslâm Ansiklopedisi entry 'Hatice' (Khadija) by M. Yaşar Kandemir, updated by the editorial team (vol. 16, Istanbul 1997, pp. 465–466). It covers her birth and marriages, her trade through trusted partners, the partnership agreement with Muhammad and his journey to Syria, her marriage to him, and her role in the early Muslim community."
