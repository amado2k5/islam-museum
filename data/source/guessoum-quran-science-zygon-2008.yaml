summary:
  ar: "مقال أكاديمي لفيزيائي فلكي مسلم يعرض الخطاب الإسلامي المعاصر عن العلم، وينتقد نظرية الإعجاز العلمي بوصفها فهماً مغلوطاً لطبيعة العلم، ويدعو إلى تعدد قراءات القرآن."
  en: "An academic article by a Muslim astrophysicist surveying contemporary Muslim discourse on science, criticising the theory of the Qur'an's scientific miraculousness as a misunderstanding of science and promoting a plurality of readings of the Qur'an."
  es: "Artículo académico de un astrofísico musulmán que examina el discurso musulmán contemporáneo sobre la ciencia, criticando la teoría del carácter milagroso científico del Corán como una mala interpretación de la ciencia y promoviendo una pluralidad de lecturas del Corán."
  fr: "Un article universitaire rédigé par un astrophysicien musulman qui passe en revue le discours musulman contemporain sur la science, critiquant la théorie du miracle scientifique du Coran comme une incompréhension de la science et promouvant une pluralité d'interprétations du Coran."
