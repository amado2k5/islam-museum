summary:
  ar: "كتاب زكريا بن محمد القزويني ⁦(ت 682هـ/1283م)⁩ في عجائب الخلق، بابه الأول في الملأ الأعلى والسماوات والكواكب، والثاني في الأرض وبحارها وحيوانها ونباتها: مرجع المتحف لعلم الكونيات الإسلامي وأساطير الخلق."
  en: "Zakariyya ibn Muhammad al-Qazwini's ⁦(d. 682 AH / 1283 CE)⁩ book of the wonders of creation: its first part on the highest assembly, the heavens and the planets, its second on the earth, its seas, animals and plants — the museum's reference for Islamic cosmography and creation lore."
  ur: "زکریا بن محمد قزوینی ⁦(متوفی 682ھ/1283ء)⁩ کی کتاب عجائب خلقت: پہلا حصہ آسمانوں اور سیاروں پر، دوسرا زمین، سمندروں، حیوانات اور نباتات پر — اسلامی کونیات اور خلقت کے قصے۔"
