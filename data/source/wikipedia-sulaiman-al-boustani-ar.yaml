  ar: "مقالة ويكيبيديا العربية عن سليمان البستاني؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في بكشتين وتعليمه في المدرسة الوطنية ببيروت، وعمله في التدريس والصحافة، وترجمته الإلياذة الصادرة بالقاهرة سنة 1904، وإقامته في مصر حتى 1908، ووفاته في نيويورك سنة 1925."
  en: "Arabic Wikipedia article on Suleyman al-Boustani; used for entity facts only. It recounts his upbringing at Bkheshtin, his education at the National School in Beirut, his teaching and journalism, his Iliad translation published in Cairo in 1904, his residence in Egypt until 1908, and his death in New York in 1925."
