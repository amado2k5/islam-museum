reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his full name as Sulayman Khattar al-Bustani, born 22 May 1856 at Bkheshtin in Iqlim al-Kharroub, taught the elements of Arabic and Syriac by his father's uncle Bishop Abdullah, and educated at the National School in Beirut; it records his teaching, his work for al-Jinan and Dairat al-Ma'arif, his interpreting post at the United States consulate in Beirut, the Iliad's publication by Dar al-Hilal in Cairo in 1904 and the celebration held for him at Shepheard's Hotel on 14 June 1904, his residence in Egypt until 1908, and his death in New York on 1 June 1925, his body being carried back to Bkheshtin for burial. Its text names no religion for him; its categories file him under 'Lebanese Maronites', and pair his birth year 1856 with 1272 AH and his death year 1925 with 1343 AH."
