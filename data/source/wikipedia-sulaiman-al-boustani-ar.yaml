summary:
  ar: "مقالة ويكيبيديا العربية عن سليمان البستاني؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في بكشتين وتعليمه في المدرسة الوطنية ببيروت، وعمله في التدريس والصحافة، وترجمته الإلياذة الصادرة بالقاهرة سنة 1904، وإقامته في مصر حتى 1908، ووفاته في نيويورك سنة 1925."
  en: "Arabic Wikipedia article on Suleyman al-Boustani; used for entity facts only. It recounts his upbringing at Bkheshtin, his education at the National School in Beirut, his teaching and journalism, his Iliad translation published in Cairo in 1904, his residence in Egypt until 1908, and his death in New York in 1925."
  es: "Artículo en árabe de la Wikipedia sobre Suleyman al-Boustani; se utiliza únicamente para obtener información sobre la persona. Relata su infancia en Bkheshtin, su educación en la Escuela Nacional de Beirut, su labor docente y periodística, su traducción de la Ilíada publicada en El Cairo en 1904, su residencia en Egipto hasta 1908 y su fallecimiento en Nueva York en 1925."
  fr: "Article de Wikipédia en arabe sur Suleyman al-Boustani; utilisé uniquement à des fins d’information sur l’entité. Il relate son enfance à Bkheshtin, ses études à l’École nationale de Beyrouth, son enseignement et son travail de journaliste, sa traduction de l’Iliade publiée au Caire en 1904, son séjour en Égypte jusqu’en 1908 et sa mort à New York en 1925."
  ur: "سلیمان البوستانی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بخشتین میں ان کی پرورش، بیروت کے نیشنل اسکول میں ان کی تعلیم، ان کی تدریس اور صحافت، 1904 میں قاہرہ میں شائع ہونے والے اس کا الیاڈ ترجمہ، 1908 تک مصر میں ان کی رہائش اور 1925 میں نیویارک میں ان کی موت کا ذکر ہے۔"
