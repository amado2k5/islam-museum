summary:
  ar: "مقالة ويكيبيديا العربية عن بيير أميديار؛ تُستخدم لوقائع الكيان فقط. تروي أصله الإيراني وولادته في فرنسا وتأسيسه إيباي وشبكة أميديار وعطاءه الخيري. تعطي ولادته في 12 يونيو 1967 خلافًا لباقي المصادر، ولا تذكر دينه."
  en: "Arabic Wikipedia article on Pierre Omidyar; used for entity facts only. It recounts his Iranian origin, French birth, founding of eBay and of Omidyar Network, and his philanthropy. It gives his birth as 12 June 1967, against the other sources, and makes no statement of his religion."
  es: "Artículo de Wikipedia en árabe sobre Pierre Omidyar; utilizado únicamente para obtener información sobre la persona. Relata su origen iraní, su nacimiento en Francia, la fundación de eBay y de Omidyar Network, y su labor filantrópica. Indica que nació el 12 de junio de 1967, en contra de otras fuentes, y no menciona su religión."
  fr: "Article Wikipédia en arabe consacré à Pierre Omidyar; utilisé uniquement pour les informations sur l’entité. Il relate ses origines iraniennes, sa naissance en France, la fondation d’eBay et d’Omidyar Network, ainsi que ses actions philanthropiques. Contrairement à d’autres sources, il indique sa date de naissance au 12 juin 1967 et ne mentionne pas sa religion."
  ur: "پیئر اومیڈیار پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی ایرانی نژاد، فرانسیسی پیدائش، ای بے اور اومیڈیار نیٹ ورک کی بنیاد، اور اس کی انسان دوستی کا ذکر ہے۔ یہ دوسرے ذرائع کے خلاف 12 جون 1967 کو اس کی پیدائش دیتا ہے، اور اس کے مذہب کا کوئی بیان نہیں دیتا ہے۔"
  tr: "Pierre Amidyar hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. İran kökenini, Fransa'daki doğumunu, eBay'in kuruluşunu, Amadiar ağının kuruluşunu ve hayırsever katkılarını anlatır. Diğer kaynaklardan farklı olarak 12 Haziran 1967 doğumunu verir ve dininden bahsetmez."
  id: "Artikel Wikipedia bahasa Arab tentang Pierre Amidyar; digunakan hanya untuk fakta entitas. Artikel ini menceritakan asal-usulnya di Iran, kelahirannya di Prancis, pendirian eBay, jaringan Amadiar, dan kontribusi amalnya. Artikel ini menceritakan kelahirannya pada 12 Juni 1967, berbeda dengan sumber lain, dan tidak menyebutkan agamanya."
