summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الحبيب بورقيبة؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في المنستير ودراسته للحقوق في باريس، وقيادته حركة الاستقلال، ورئاسته للوزراء ثم رئاسته لتونس من 1957 إلى 1987، وعزله سنة 1987 ووفاته في المنستير سنة 2000."
  en: "English Wikipedia article on Habib Bourguiba; used for entity facts only. It recounts his Monastir childhood, his law studies in Paris, his leadership of the independence movement, his premiership and then his presidency of Tunisia from 1957 to 1987, his removal in 1987 and his death at Monastir in 2000."
  es: "Artículo de la Wikipedia en inglés sobre Habib Bourguiba; utilizado únicamente para datos sobre la persona. Relata su infancia en Monastir, sus estudios de derecho en París, su liderazgo del movimiento independentista, su mandato como primer ministro y posteriormente como presidente de Túnez desde 1957 hasta 1987, su destitución en 1987 y su fallecimiento en Monastir en el año 2000."
  fr: "Article de Wikipédia en anglais sur Habib Bourguiba; utilisé uniquement pour les informations sur l’entité. Il relate son enfance à Monastir, ses études de droit à Paris, son rôle de chef du mouvement d’indépendance, son poste de Premier ministre puis de président de la Tunisie de 1957 à 1987, sa destitution en 1987 et sa mort à Monastir en 2000."
  ur: "حبیب بورگوئیبا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے موناستیر کا بچپن، پیرس میں ان کی قانون کی تعلیم، تحریک آزادی کی ان کی قیادت، ان کی وزارت عظمیٰ اور پھر 1957 سے 1987 تک تیونس کی صدارت، 1987 میں ان کی برطرفی اور 2000 میں موناستیر میں ان کی موت کا ذکر ہے۔"
  tr: "Habib Bourguiba hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Monastir'deki yetiştirilme yıllarını, Paris'te hukuk eğitimlerini, bağımsızlık hareketine liderliğini, 1957-1987 yılları arasında Tunus başbakanlığını, 1987'de görevden alınmasını ve 2000'de Monastir'deki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Habib Bourguiba; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Monastir, studi hukumnya di Paris, kepemimpinannya dalam gerakan kemerdekaan, masa jabatannya sebagai perdana menteri Tunisia dari 1957 hingga 1987, pemecatannya pada 1987, dan kematiannya di Monastir pada 2000."
