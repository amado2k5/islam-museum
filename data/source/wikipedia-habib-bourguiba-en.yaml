  ar: "مقالة ويكيبيديا الإنجليزية عن الحبيب بورقيبة؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في المنستير ودراسته للحقوق في باريس، وقيادته حركة الاستقلال، ورئاسته للوزراء ثم رئاسته لتونس من 1957 إلى 1987، وعزله سنة 1987 ووفاته في المنستير سنة 2000."
  en: "English Wikipedia article on Habib Bourguiba; used for entity facts only. It recounts his Monastir childhood, his law studies in Paris, his leadership of the independence movement, his premiership and then his presidency of Tunisia from 1957 to 1987, his removal in 1987 and his death at Monastir in 2000."
