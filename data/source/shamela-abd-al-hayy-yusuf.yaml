summary:
  ar: "صفحة ترجمة عبد الحي يوسف في المكتبة الشاملة مع مقدمة كتاب دروسه المفرّغة: مولده في القاهرة 1384هـ/1964م، وتخرجه في الجامعة الإسلامية بالمدينة المنورة 1406–1407هـ، ودراساته العليا في جامعة الخرطوم 1998م، ورئاسته قسم الثقافة الإسلامية فيها وإمامته مسجد حي الدوحة بالخرطوم."
  en: "The Al-Maktaba al-Shamela author page for Abd al-Hayy Yusuf, with the introduction to his transcribed lessons: born in Cairo in 1384 AH / 1964 CE, graduated from the Islamic University of Madinah in 1406–1407 AH, postgraduate studies at the University of Khartoum in 1998, head of its Islamic Culture Department and imam of the al-Dawha mosque in Khartoum."
  es: "Página del autor de Al-Maktaba al-Shamela para Abd al-Hayy Yusuf, con la introducción a sus lecciones transcritas: nació en El Cairo en 1384 AH / 1964 CE, se graduó de la Universidad Islámica de Medina en 1406–1407 AH, realizó estudios de posgrado en la Universidad de Jartum en 1998, fue jefe de su Departamento de Cultura Islámica e imán de la mezquita al-Dawha en Jartum."
  fr: "La page d'auteur d'Al-Maktaba al-Shamela pour Abd al-Hayy Yusuf, avec l'introduction à ses leçons transcrites: né au Caire en 1384 AH / 1964 CE, diplômé de l'Université islamique de Médine en 1406-1407 AH, études post-universitaires à l'Université de Khartoum en 1998, chef de son département de culture islamique et imam de la mosquée al-Dawha à Khartoum."
  ur: "عبد الحی یوسف کے لیے المکتبہ الشمیلہ کا مصنف صفحہ، ان کے نقل شدہ اسباق کے تعارف کے ساتھ: قاہرہ میں 1384ھ / 1964 عیسوی میں پیدا ہوئے، 1406-1407 ہجری میں اسلامک یونیورسٹی آف مدینہ سے گریجویشن کیا، 1999 میں اسلامیہ کے شعبہ کے سربراہ اور 1999 میں اسلامی یونیورسٹی مدینہ سے گریجویٹ کیا۔ خرطوم میں الدعوہ مسجد کے امام۔"
