  ar: "صفحة ترجمة عبد الحي يوسف في المكتبة الشاملة مع مقدمة كتاب دروسه المفرّغة: مولده في القاهرة 1384هـ/1964م، وتخرجه في الجامعة الإسلامية بالمدينة المنورة 1406–1407هـ، ودراساته العليا في جامعة الخرطوم 1998م، ورئاسته قسم الثقافة الإسلامية فيها وإمامته مسجد حي الدوحة بالخرطوم."
  en: "The Al-Maktaba al-Shamela author page for Abd al-Hayy Yusuf, with the introduction to his transcribed lessons: born in Cairo in 1384 AH / 1964 CE, graduated from the Islamic University of Madinah in 1406–1407 AH, postgraduate studies at the University of Khartoum in 1998, head of its Islamic Culture Department and imam of the al-Dawha mosque in Khartoum."
