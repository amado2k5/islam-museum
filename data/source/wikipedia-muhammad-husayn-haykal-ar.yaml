reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. The article gives the Hijri dates of his birth and death directly (1305 and 1376 AH), his law studies at the Khedivial Law School (graduated 1909) and his Sorbonne doctorate of 1912, his membership of the Committee of Thirty that drafted the 1923 constitution, his editorship of Al-Siyasa al-Usbu'iyya from 1926, his repeated education ministries (1938–39, 1940–42, 1944–45, the last with Social Affairs added), his party vice-presidency (1941) and presidency (1943 until the parties were abolished after the July 1952 revolution), his presidency of the Senate from 1945 to June 1950, his representation of Saudi Arabia at the signing of the Arab League Charter in 1945, and his works with dates: Zaynab 1914, Hayat Muhammad 1935, Fi Manzil al-Wahy 1937, al-Siddiq Abu Bakr 1942, al-Faruq Umar 1944, Hakadha Khuliqt 1955, and posthumous works to 1969. Several dates differ from the English article's; the variants are recorded in the prose. It names no school for him. Read in full on 24 October 2026."
