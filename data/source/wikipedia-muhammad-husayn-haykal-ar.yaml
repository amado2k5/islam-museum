summary:
  ar: "مقالة ويكيبيديا العربية «محمد حسين هيكل»؛ تؤرخ ميلاده في 20 أغسطس 1888 الموافق 12 ذي الحجة 1305 هـ بكفر غنام، ووفاته في 8 ديسمبر 1956 الموافق 5 جمادى الأولى 1376 هـ، وتفصّل مناصبه الوزارية ورئاسته لحزب الأحرار الدستوريين ومجلس الشيوخ وقائمة مؤلفاته بتواريخها."
  en: "Arabic Wikipedia article 'Muhammad Husayn Haykal'; it dates his birth to 20 August 1888, corresponding to 12 Dhu al-Hijja 1305 AH, at Kafr Ghannam, and his death to 8 December 1956, corresponding to 5 Jumada al-awwal 1376 AH, and details his ministerial offices, his presidency of the Liberal Constitutional Party and of the Senate, and his works with their dates."
  es: "Artículo de Wikipedia en árabe titulado \"Muhammad Husayn Haykal\"; fecha su nacimiento el 20 de agosto de 1888, correspondiente al 12 de Dhu al-Hijja de 1305 AH, en Kafr Ghannam, y su muerte el 8 de diciembre de 1956, correspondiente al 5 de Jumada al-awwal de 1376 AH, y detalla sus cargos ministeriales, su presidencia del Partido Liberal Constitucional y del Senado, y sus obras con sus respectivas fechas."
  fr: "L'article de Wikipédia en arabe intitulé « Muhammad Husayn Haykal » date sa naissance du 20 août 1888, correspondant au 12 Dhu al-Hijja 1305 AH, à Kafr Ghannam, et sa mort du 8 décembre 1956, correspondant au 5 Jumada al-awwal 1376 AH, et détaille ses fonctions ministérielles, sa présidence du Parti constitutionnel libéral et du Sénat, ainsi que ses œuvres avec leurs dates."
  ur: "عربی ویکیپیڈیا مضمون 'محمد حسین ہیکل'؛ اس میں ان کی تاریخ پیدائش 20 اگست 1888 ہے، جو 12 ذی الحجہ 1305 ہجری کو کفر غنم میں ہے، اور ان کی وفات 8 دسمبر 1956 کو ہے، جو کہ 5 جمادی الاول 1376 ہجری کو ہے، اور ان کے وزارتی دفاتر، ان کی پارٹی کے صدارتی عہدوں اور صدارتی امور کی تفصیلات درج ہیں۔ ان کی تاریخوں کے ساتھ۔"
  tr: "Arapça Vikipedi makalesi \"Muhammed Hüseyin Haykal\" doğumunu 20 Ağustos 1888'de tarihlendirir; bu tarih 12 Dhu al-Hijjah 1305 Hicc Kafr Ghannam'a karşılık gelir ve ölümü 8 Aralık 1956'da, 5 Jumada al-Awwal 1376 Hile ile örtüşür. Bakanlık görevlerini, Anayasal Liberal Parti liderliğini, Senato'yu ve eserlerinin tarihlerine göre listesini detaylandırır."
  id: "Artikel Wikipedia berbahasa Arab \"Muhammad Hussein Heikal\" mencatat kelahirannya pada 20 Agustus 1888, yang bertepatan dengan 12 Dhu al-Hijjah 1305 H di Kafr Ghannam, dan kematiannya pada 8 Desember 1956, yang bertepatan dengan 5 Jumada al-Awwal 1376 H. Artikel tersebut merinci posisi menterinya, kepemimpinannya di Partai Liberal Konstitusional, Senat, dan daftar karyanya berdasarkan tanggalnya."
