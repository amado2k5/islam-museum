summary:
  ar: "مقالة ويكيبيديا العربية «محمد حسين هيكل»؛ تؤرخ ميلاده في 20 أغسطس 1888 الموافق 12 ذي الحجة 1305 هـ بكفر غنام، ووفاته في 8 ديسمبر 1956 الموافق 5 جمادى الأولى 1376 هـ، وتفصّل مناصبه الوزارية ورئاسته لحزب الأحرار الدستوريين ومجلس الشيوخ وقائمة مؤلفاته بتواريخها."
  en: "Arabic Wikipedia article 'Muhammad Husayn Haykal'; it dates his birth to 20 August 1888, corresponding to 12 Dhu al-Hijja 1305 AH, at Kafr Ghannam, and his death to 8 December 1956, corresponding to 5 Jumada al-awwal 1376 AH, and details his ministerial offices, his presidency of the Liberal Constitutional Party and of the Senate, and his works with their dates."
