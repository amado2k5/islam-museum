reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth at Bukhara in 1625 or 1624, his rule of Balkh 1651-1680 and of Bukhara 1681-1702, the Khivan raids of Abu al-Ghazi and Anusha Khan on the khanate and his victory of 1687, his exchanges with Aurangzeb and the Ottoman sultan Ahmed II, his medical and astronomical works and his poetry under the pen name Nishoni, and his death at Bukhara on 14 September 1702, burial near the tomb of Bahauddin Naqshband and succession by his son Ubaydullah Khan II. It names no school or order for the khan himself. Checked 1 November 2026."
