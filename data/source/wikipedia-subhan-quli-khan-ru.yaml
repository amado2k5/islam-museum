summary:
  ar: "مقالة ويكيبيديا الروسية عن سبحان قلي خان؛ تعطي ولادته في بخارى سنة 1625 أو 1624، ووفاته فيها في 14 أيلول 1702، واسم قلمه الشعري «نيشوني»، وخلافة ابنه عبيد الله الثاني له؛ تُستخدم لوقائع الكيان فقط."
  en: "Russian Wikipedia article on Subhan Quli Khan; it gives his birth at Bukhara in 1625 or 1624, his death there on 14 September 1702, his poetic pen name Nishoni and his succession by his son Ubaydullah II; used for entity facts only, each cited where the article gives its own source."
  es: "Artículo de la Wikipedia rusa sobre Subhan Quli Khan; indica su nacimiento en Bujará en 1625 o 1624, su muerte allí el 14 de septiembre de 1702, su seudónimo poético Nishoni y su sucesión por su hijo Ubaydullah II; se utiliza únicamente para datos de entidades, cada uno citado donde el artículo proporciona su propia fuente."
  fr: "Article de Wikipédia russe sur Subhan Quli Khan; il indique sa naissance à Boukhara en 1625 ou 1624, sa mort dans cette même ville le 14 septembre 1702, son nom de plume poétique Nishoni et sa succession par son fils Ubaydullah II; utilisé uniquement pour les faits concernant l’entité, chaque élément étant cité lorsque l’article donne sa propre source."
  ur: "سبحان قلی خان پر روسی ویکیپیڈیا مضمون؛ اس کی پیدائش بخارا میں 1625 یا 1624 میں ہوئی، وہاں ان کی وفات 14 ستمبر 1702 کو ہوئی، اس کا شاعرانہ قلمی نام نشانی اور اس کا جانشین اس کے بیٹے عبید اللہ دوم نے کیا۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک کا حوالہ دیا جاتا ہے جہاں مضمون اپنا ماخذ دیتا ہے۔"
  tr: "Subhan Quli Han hakkında Rusça Wikipedia makalesi, 1625 veya 1624'te Buhara doğumunu, 14 Eylül 1702'de orada öldüğünü, şiirsel takma adı 'Nishoni' olduğunu ve oğlu Ubaidullah II'ye geçtiğini anlatır; bu makale yalnızca varlığın gerçekleri için kullanılır."
  id: "Artikel Wikipedia Rusia tentang Subhan Quli Khan menceritakan kelahirannya di Bukhara pada tahun 1625 atau 1624, kematiannya di sana pada 14 September 1702, nama pena puitisnya 'Nishoni', dan suksesinya atas putranya Ubaidullah II; nama ini hanya digunakan untuk fakta entitas tersebut."
