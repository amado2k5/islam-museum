reliability_note: "A national business daily's reported feature, read in full on 5 November 2026. Its top-five popularity list (Mizanur Rahman Azhari, Hafizur Rahman, Giasuddin Taheri, Enayetullah Abbasi, Ahmadullah) is the paper's own assessment. For Abbasi it reports, in prose, that the pir groups 'mostly introduce them as adherent of Hanafi Islam', that he 'introduces himself as a Hanafi Muslim', and quotes him setting Salafists apart as a different firqa originating from Wahhabis and answering the paper's question about incitement by other preachers. These are one publication's reports and quotations, and are used as such; the self-introduction is preserved in his record's faith note but, being a single text, does not settle his faith under the lane's two-text rule."
