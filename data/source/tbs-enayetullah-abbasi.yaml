summary:
  ar: "تحقيق لصحيفة ذا بزنس ستاندرد البنغلاديشية (2021) عن صعود دعاة يوتيوب في بنغلاديش؛ يعدّ عناية الله عباسي بين أشهر خمسة دعاة في البلاد، ويقتبس تقديمه نفسه مسلما حنفيا وردوده على أسئلة الصحيفة."
  en: "A Business Standard (Bangladesh) feature of 2021 on the rise of YouTube preachers in Bangladesh; it counts Enayetullah Abbasi among the country's five most popular preachers, quotes his self-introduction as a Hanafi Muslim and his answers to the paper's questions."
  es: "Un reportaje de Business Standard (Bangladesh) de 2021 sobre el auge de los predicadores de YouTube en Bangladesh; incluye a Enayetullah Abbasi entre los cinco predicadores más populares del país, cita su presentación como musulmán hanafi y sus respuestas a las preguntas del periódico."
  fr: "Un article du Business Standard (Bangladesh) de 2021 sur la montée en puissance des prédicateurs sur YouTube au Bangladesh; il classe Enayetullah Abbasi parmi les cinq prédicateurs les plus populaires du pays, cite sa présentation en tant que musulman hanafite et ses réponses aux questions du journal."
  ur: "بنگلہ دیش میں یوٹیوب کے مبلغین کے عروج پر 2021 کا بزنس سٹینڈرڈ ⁦(بنگلہ دیش)⁩ فیچر؛ اس میں عنایت اللہ عباسی کا شمار ملک کے پانچ مقبول ترین مبلغین میں ہوتا ہے، ایک حنفی مسلمان کے طور پر اپنا تعارف اور پیپر کے سوالات کے جوابات کا حوالہ دیتے ہیں۔"
  tr: "Bangladeş'teki The Business Standard gazetesinin (2021) Bangladeş'teki YouTube vaizlerinin yükselişi üzerine yaptığı bir araştırma; İnayetullah Abbasi, ülkedeki en ünlü beş vaiz arasında yer almakta ve Hanefi Müslüman olarak tanıtılması, gazetenin sorularına verdiği yanıtlar olarak gösterilmektedir."
  id: "Sebuah investigasi oleh surat kabar The Business Standard di Bangladesh (2021) tentang meningkatnya pengkhotbah YouTube di Bangladesh; Inayatollah Abbasi termasuk di antara lima pengkhotbah paling terkenal di negara ini, dan pengenalan beliau sebagai Muslim Hanafi dikutip sebagai jawabannya atas pertanyaan surat kabar tersebut."
