summary:
  ar: "صفحة وردت في ملخص بحثي قُدِّم إلى المتحف واعتمده المؤسس في 21 نوفمبر 2026؛ لم تُفتح الصفحة، وأرقام الصفحات المذكورة هي ما في الملخص ولم يُتحقق منها. ناشرها: Dar al-Ifta al-Misriyya. يُستند إليها في: أوائل ترجمات القرآن: ترجمة سلمان الفارسي وروبرت الكيتوني وألكسندر روس."
  en: "A page listed in a research summary supplied to the museum and approved by the founder on 21 November 2026; the page was not opened, and any page numbers are the summary's and unchecked. Publisher: Dar al-Ifta al-Misriyya. Used for: the first translations of the Qur'an: Salman al-Farisi, Robert of Ketton and Alexander Ross."
  ur: "ایک صفحہ جو عجائب گھر کو دیے گئے تحقیقی خلاصے میں مذکور ہے اور جسے بانی نے 21 نومبر 2026 کو منظور کیا؛ صفحہ کھولا نہیں گیا، اور صفحات کے نمبر خلاصے کے ہیں اور جانچے نہیں گئے۔ ناشر: Dar al-Ifta al-Misriyya۔ اس سے استناد ان امور کے لیے ہے: قرآن کے ابتدائی تراجم: سلمان فارسی، رابرٹ آف کیٹن اور الیگزینڈر راس۔"
  fr: "Page citée dans un résumé de recherche remis au musée et approuvé par le fondateur le 21 novembre 2026 ; la page n'a pas été ouverte, et les numéros de page sont ceux du résumé, non vérifiés. Éditeur : Dar al-Ifta al-Misriyya. Utilisée pour : les premières traductions du Coran : Salman al-Farisi, Robert de Ketton et Alexander Ross."
  es: "Página citada en un resumen de investigación entregado al museo y aprobado por el fundador el 21 de noviembre de 2026; la página no se abrió, y los números de página son los del resumen, sin comprobar. Editor: Dar al-Ifta al-Misriyya. Usada para: las primeras traducciones del Corán: Salman al-Farisi, Roberto de Ketton y Alexander Ross."
  tr: "21 Kasım 2026'da müzeye sunulan ve kurucu tarafından onaylanan bir araştırma özetinde bahsedilen bir sayfa; sayfa açılmadı ve belirtilen sayfa numaraları özetteki numaralarla doğrulanmadı. Yayınevi: Dar al-Ifta al-Misriyya. Temeli: Erken Kur'an Çevirileri: Salman al-Farsi, Robert al-Kitoni ve Alexander Ross tarafından yapılan çeviriler."
  id: "Halaman yang disebutkan dalam abstrak penelitian yang diserahkan ke museum dan disetujui oleh pendiri pada 21 November 2026; halaman tersebut tidak dibuka, dan nomor halaman yang disebutkan adalah yang ada dalam abstrak dan belum diverifikasi. Penerbit: Dar al-Ifta al-Misriyya. Berdasarkan dalam: Terjemahan Al-Qur'an Awal: Terjemahan oleh Salman al-Farsi, Robert al-Kitoni, dan Alexander Ross."
