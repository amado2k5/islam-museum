summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سلمان بن عبد العزيز آل سعود؛ تُستخدم لوقائع الكيان فقط. تذكر أنه ملك السعودية منذ 23 يناير 2015، ابن الملك عبد العزيز وحصة بنت أحمد السديري، وأمير منطقة الرياض 48 عامًا (1963–2011)، ثم وزير الدفاع وولي العهد من 2012، وأنه وُلد في الرياض في 31 ديسمبر 1935. ويذكر حقل الدين في صندوق معلوماتها «الإسلام السني»، ويذكر متن نشأتها أنه درس الإسلام واللغة العربية مركزًا على الشريعة بالتفسير الوهابي على المذهب الحنبلي، وحفظ القرآن على عالم في التقليد الوهابي."
  en: "English Wikipedia article on Salman bin Abdulaziz Al Saud; used for entity facts only. It gives him as King of Saudi Arabia since 23 January 2015, a son of King Abdulaziz and Hassa bint Ahmed Al Sudairi, governor of Riyadh for 48 years (1963–2011), then Minister of Defense and Crown Prince from 2012, born at Riyadh on 31 December 1935. Its infobox religion field reads 'Sunni Islam', and its early-life text records that he studied Islam and Arabic, focusing on sharia in the Wahhabi interpretation under the Hanbali school of jurisprudence, and learned the Quran under a cleric in the Wahhabi tradition."
