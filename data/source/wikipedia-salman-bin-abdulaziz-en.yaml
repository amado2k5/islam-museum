summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سلمان بن عبد العزيز آل سعود؛ تُستخدم لوقائع الكيان فقط. تذكر أنه ملك السعودية منذ 23 يناير 2015، ابن الملك عبد العزيز وحصة بنت أحمد السديري، وأمير منطقة الرياض 48 عامًا (1963–2011)، ثم وزير الدفاع وولي العهد من 2012، وأنه وُلد في الرياض في 31 ديسمبر 1935. ويذكر حقل الدين في صندوق معلوماتها «الإسلام السني»، ويذكر متن نشأتها أنه درس الإسلام واللغة العربية مركزًا على الشريعة بالتفسير الوهابي على المذهب الحنبلي، وحفظ القرآن على عالم في التقليد الوهابي."
  en: "English Wikipedia article on Salman bin Abdulaziz Al Saud; used for entity facts only. It gives him as King of Saudi Arabia since 23 January 2015, a son of King Abdulaziz and Hassa bint Ahmed Al Sudairi, governor of Riyadh for 48 years (1963–2011), then Minister of Defense and Crown Prince from 2012, born at Riyadh on 31 December 1935. Its infobox religion field reads 'Sunni Islam', and its early-life text records that he studied Islam and Arabic, focusing on sharia in the Wahhabi interpretation under the Hanbali school of jurisprudence, and learned the Quran under a cleric in the Wahhabi tradition."
  es: "Artículo de la Wikipedia en inglés sobre Salman bin Abdulaziz Al Saud; utilizado únicamente para datos sobre la entidad. Lo describe como Rey de Arabia Saudita desde el 23 de enero de 2015, hijo del Rey Abdulaziz y Hassa bint Ahmed Al Sudairi, gobernador de Riad durante 48 años (1963-2011), luego Ministro de Defensa y Príncipe Heredero desde 2012, nacido en Riad el 31 de diciembre de 1935. Su campo de religión en la ficha informativa indica \"Islam sunita\", y su texto sobre su juventud registra que estudió Islam y árabe, centrándose en la sharia según la interpretación wahabí dentro de la escuela jurídica hanbalí, y aprendió el Corán con un clérigo de la tradición wahabí."
  fr: "Article de Wikipédia en anglais sur Salman bin Abdulaziz Al Saud; utilisé uniquement pour les informations le concernant. Il est présenté comme roi d'Arabie saoudite depuis le 23 janvier 2015, fils du roi Abdulaziz et de Hassa bint Ahmed Al Sudairi, gouverneur de Riyad pendant 48 ans (1963-2011), puis ministre de la Défense et prince héritier à partir de 2012, né à Riyad le 31 décembre 1935. Son infobox « Religion » indique « Islam sunnite », et sa biographie mentionne qu'il a étudié l'islam et l'arabe, se concentrant sur la charia selon l'interprétation wahhabite de l'école de jurisprudence hanbalite, et qu'il a appris le Coran auprès d'un religieux de tradition wahhabite."
  ur: "سلمان بن عبدالعزیز آل سعود پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انہیں 23 جنوری 2015 سے سعودی عرب کے بادشاہ کے طور پر دیتا ہے، شاہ عبدالعزیز اور حسہ بنت احمد السدیری کے بیٹے، 48 سال (1963-2011) تک ریاض کے گورنر، پھر وزیر دفاع اور 2012 سے ولی عہد، 31 دسمبر 1935 کو ریاض میں پیدا ہوئے۔ ریکارڈ کرتا ہے کہ اس نے اسلام اور عربی کی تعلیم حاصل کی، حنبلی مکتب فقہ کے تحت وہابی تشریح میں شریعت پر توجہ مرکوز کی، اور وہابی روایت کے ایک مولوی سے قرآن سیکھا۔"
  tr: "Salman bin Abdulaziz Al Saud hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 23 Ocak 2015'ten beri Suudi Arabistan Kralı olduğu, Kral Abdulaziz ve Hessa bint Ahmed Al-Sudairi'nin oğlu olduğu, 48 yıl boyunca Riyad Bölgesi Valisi olduğu (1963–2011) ve ardından 2012'den beri Savunma Bakanı ve Veliaht Prens olduğu ve 31 Aralık 1935'te Riyad'da doğduğu belirtilmektedir. Din alanı bilgi kutusunda \"Sünni İslam\" olarak anılmakta ve yetiştirilme tarzı metninde İslam ve Arapça çalıştığı, özellikle Hanbali okuluna göre Vahhabi yorumuyla Şeriat'a odaklandığı ve Kur'an'ı Vahhabi geleneğinden bir âlimin yanında ezberlediği belirtilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Salman bin Abdulaziz Al Saud hanya digunakan untuk fakta entitas tersebut. Disebutkan bahwa ia telah menjadi Raja Arab Saudi sejak 23 Januari 2015, putra Raja Abdulaziz dan Hessa bint Ahmed Al-Sudairi, serta pernah menjabat sebagai Gubernur Wilayah Riyadh selama 48 tahun (1963–2011), kemudian Menteri Pertahanan dan Putra Mahkota sejak 2012, serta lahir di Riyadh pada 31 Desember 1935. Bidang agama tersebut disebutkan dalam infobox sebagai \"Islam Sunni,\" dan teks masa kecilnya menyatakan bahwa ia mempelajari Islam dan bahasa Arab, dengan fokus pada Syariah melalui interpretasi Wahhabi menurut mazhab Hanbali, serta menghafal Al-Qur'an di bawah bimbingan seorang ulama tradisi Wahhabi."
