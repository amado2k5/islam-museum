reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A biographical notice of the classical type. It names him Abu al-Abbas Ahmad ibn Mubarak ibn Muhammad ibn Ali ibn Mubarak al-Sijilmasi al-Lamti, dates him 1090–1156 AH / 1679–1743 CE, calls him a Maliki jurist (faqih Maliki), lists his five teachers at Fez and his students, states that he was a disciple of Abd al-Aziz al-Dabbagh and collected his words in the al-Ibriz, lists his works, and dates his death to the night of Friday 19 Jumada I 1156 AH, buried beside his teacher al-Dabbagh. Checked 1 November 2026."
