  es: "La entrada de la TDV İslâm Ansiklopedisi sobre tafsir se divide en dos secciones: Abdulhamit Birışık sobre la naturaleza de la ciencia, las cualificaciones del exégeta y su historia, y M. Suat Mertoğlu sobre la literatura de tafsir desde el período profético hasta nuestros días."
  fr: "L'entrée de TDV İslâm Ansiklopedisi sur le tafsir est divisée en deux sections: Abdulhamit Birışık sur la nature de la science, les qualifications de l'exégète et son histoire, et M. Suat Mertoğlu sur la littérature du tafsir de la période prophétique à nos jours."
