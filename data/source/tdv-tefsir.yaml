summary:
  ar: "مدخل «تفسير» في موسوعة TDV الإسلامية، بابان: الأول لعبد الحميد بيريشك في ماهية علم التفسير وشروط المفسر وتاريخه، والثاني لسعاد ميرت أوغلو في أدبيات التفسير من العهد النبوي إلى العصر الحديث."
  en: "The TDV İslâm Ansiklopedisi entry on tafsir in two sections: Abdulhamit Birışık on the nature of the science, the qualifications of the exegete and its history, and M. Suat Mertoğlu on the tafsir literature from the prophetic period to the modern day."
