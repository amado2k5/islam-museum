  en: "Ibn Hazm, al-Muhalla bi-l-Athar, vol. 12 (Dar Ibn Hazm, Beirut, 1st ed., 1437/2016)"
  ur: "ابن حزم، المحلی بالآثار، جلد دوازدہم ⁦(دار ابن حزم، بیروت، طبع اول، 1437ھ/2016ء)⁩"
summary:
  ar: "المجلد الثاني عشر من طبعة دار ابن حزم لـ«المحلى»، بإشراف خالد الرباط ومشاركة باحثين، يضم كتب الوصايا وفعل المريض والإمامة والأقضية والشهادات وأول كتاب النكاح، مع تعليقات المحققين وتخريجاتهم وفهرس المسائل."
  en: "Volume 12 of the Dar Ibn Hazm edition of al-Muhalla, supervised by Khalid al-Rabbat with a team of researchers, holding the Books of Bequests, Acts of the Sick, the Imamate, Judgeship, Testimony and the beginning of the Book of Marriage, with the editors' notes, references and an index of questions."
  ur: "دار ابن حزم کے ایڈیشن «المحلی» کی جلد دوازدہم، خالد الرباط کی نگرانی میں محققین کی شرکت سے، جس میں کتاب الوصایا، مریض کے تصرفات، امامت، اقضیہ، شہادات اور کتاب النکاح کا آغاز ہیں، محققین کے حواشی، تخریجات اور مسائل کی فہرست کے ساتھ۔"
title: "المحلى بالآثار في شرح المجلى بالاختصار (المجلد الثاني عشر)"
