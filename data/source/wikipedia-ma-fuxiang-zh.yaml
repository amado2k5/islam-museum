  ar: "مقالة ويكيبيديا الصينية عن ما فوشيانغ؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكنية يونتينغ ومولده في 4 شباط 1876 في هتشو ووفاته في بيبينغ في 19 آب 1932، ومسيرته حاكمًا لنينغشيا وسويوان ورئيسًا للجنة الشؤون المنغولية والتبتية ومؤلفاته."
  en: "Chinese Wikipedia article on Ma Fuxiang; used for entity facts only. It gives his courtesy name Yunting, his birth on 4 February 1876 at Hezhou and his death at Beiping on 19 August 1932, his governorships of Ningxia and Suiyuan, his chairmanship of the Mongolian and Tibetan Affairs Commission, and his writings."
