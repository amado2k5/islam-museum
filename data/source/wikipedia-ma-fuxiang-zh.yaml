summary:
  ar: "مقالة ويكيبيديا الصينية عن ما فوشيانغ؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكنية يونتينغ ومولده في 4 شباط 1876 في هتشو ووفاته في بيبينغ في 19 آب 1932، ومسيرته حاكمًا لنينغشيا وسويوان ورئيسًا للجنة الشؤون المنغولية والتبتية ومؤلفاته."
  en: "Chinese Wikipedia article on Ma Fuxiang; used for entity facts only. It gives his courtesy name Yunting, his birth on 4 February 1876 at Hezhou and his death at Beiping on 19 August 1932, his governorships of Ningxia and Suiyuan, his chairmanship of the Mongolian and Tibetan Affairs Commission, and his writings."
  es: "Artículo de la Wikipedia en chino sobre Ma Fuxiang; utilizado únicamente para obtener información sobre la persona. Menciona su nombre de cortesía, Yunting, su nacimiento el 4 de febrero de 1876 en Hezhou y su fallecimiento en Beiping el 19 de agosto de 1932, sus mandatos como gobernador de Ningxia y Suiyuan, su presidencia de la Comisión de Asuntos Mongoles y Tibetanos y sus escritos."
  fr: "Article de Wikipédia en chinois sur Ma Fuxiang; utilisé uniquement pour les informations sur l’entité. Il mentionne son nom de courtoisie Yunting, sa naissance le 4 février 1876 à Hezhou et sa mort à Beiping le 19 août 1932, ses fonctions de gouverneur du Ningxia et de Suiyuan, sa présidence de la Commission des affaires mongoles et tibétaines, ainsi que ses écrits."
  ur: "Ma Fuxiang پر چینی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا شائستہ نام یونٹنگ، ان کی پیدائش 4 فروری 1876 کو ہیزو میں اور ان کی موت 19 اگست 1932 کو بیپنگ میں، ان کی ننگشیا اور سوئیوان کی گورنری، منگول اور تبتی امور کے کمیشن کی ان کی سربراہی، اور ان کی تحریریں ہیں۔"
  tr: "Ma Fuxiang hakkında Çin Vikipedi makalesi; yalnızca varlığın olayları için kullanılır. Soyadı Yunting olarak verilmiştir; 4 Şubat 1876'da Chu'da doğmuş ve 19 Ağustos 1932'de Beiping'de vefat etmiştir. Ningxia ve Suyuan valiliği, Moğol ve Tibet İşleri Komitesi başkanlığı ve yazıları."
  id: "Artikel Wikipedia Bahasa Mandarin tentang Ma Fuxiang; digunakan hanya untuk peristiwa entitas tersebut. Nama belakangnya diberikan sebagai Yunting, lahir pada 4 Februari 1876 di Chu, dan kematiannya di Beiping pada 19 Agustus 1932. Kariernya sebagai gubernur Ningxia dan Suyuan, ketua Komite Urusan Mongol dan Tibet, serta tulisan-tulisannya."
