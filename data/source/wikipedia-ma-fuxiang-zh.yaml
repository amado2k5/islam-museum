reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives him as a son of Ma Qianling (it counts him the third son, where the English article, citing a genealogy table, counts him the fourth — birth order only; the brotherhood is agreed), as educated at a mosque in childhood, and as skilled at mediating between ethnic groups and between religious sects. It names no school and no Sufi order for him, and its categories file him under Muslims of the Republic of China."
