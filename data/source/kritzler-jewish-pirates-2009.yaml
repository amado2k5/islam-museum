label:
  en: "Kritzler, Jewish Pirates of the Caribbean (2009)"
summary:
  ar: "كتاب إدوارد كريتزلر التاريخي المبسط ⁦(أنكور، 2009)⁩؛ تحمل ص 59–60 الدعوى الحديثة أن سنان ريس وُلد لعائلة يهودية سفاردية منفية من إيبيريا — استُشهد به للدعوى نفسها التي يتركها السجل دون حسم."
  en: "Edward Kritzler's popular history (Anchor Books, 2009); pp. 59–60 carry the modern claim that Sinan Reis was born to a Sephardic Jewish family exiled from Iberia — cited for the claim, which the record leaves unsettled."
  es: "La obra de divulgación histórica de Edward Kritzler (Anchor Books, 2009), págs. 59-60, recoge la afirmación moderna de que Sinan Reis nació en el seno de una familia judía sefardí exiliada de Iberia, citada como prueba de ello, aunque los registros no la aclaran."
  fr: "L'ouvrage populaire d'Edward Kritzler (Anchor Books, 2009); pp. 59-60 reprend l'affirmation moderne selon laquelle Sinan Reis serait né dans une famille juive séfarade exilée d'Ibérie — affirmation citée à l'appui, mais que les archives ne permettent pas de confirmer."
  ur: "ایڈورڈ کرٹزلر کی مقبول تاریخ ⁦(اینکر بکس، 2009)⁩؛ pp. 59-60 میں جدید دعویٰ ہے کہ سنان ریئس کی پیدائش آئبیریا سے جلاوطن ایک Sephardic یہودی خاندان میں ہوئی تھی - اس دعوے کے لیے حوالہ دیا گیا، جسے ریکارڈ نے بے ترتیب چھوڑ دیا۔"
type: book
title: "Jewish Pirates of the Caribbean: How a Generation of Swashbuckling Jews Carved Out an Empire in the New World in Their Quest for Treasure, Revenge and Religious Freedom"
author: [{family: "Kritzler", given: "Edward"}]
language: en
reliability_note: "Popular history; the main modern carrier of the claim that Sinan Reis was born to a Sephardic Jewish family exiled from Iberia (pp. 59–60). The claim is epithet-based and contested by a contemporary chronicler, so this source is cited for the claim itself, not as settled fact."
