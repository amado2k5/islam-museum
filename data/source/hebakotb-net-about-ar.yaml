summary:
  ar: "صفحة النبذة العربية في موقعها الرسمي: التكريمات، والمؤلفات ⁦(كتاب في الطب الشرعي وسبعة كتب في الطب الجنسي)⁩، والنشاط الصحفي."
  en: "The Arabic About page of her official site: honours, books (a forensic-medicine textbook and seven sexual-medicine books) and press work."
  es: "La sección \"Acerca de\" en árabe de su sitio web oficial incluye: reconocimientos, libros (un libro de texto de medicina forense y siete libros de medicina sexual) y trabajo de prensa."
  fr: "La page « À propos » en arabe de son site officiel: distinctions, livres (un manuel de médecine légale et sept ouvrages sur la médecine sexuelle) et travail de presse."
  ur: "اس کی آفیشل سائٹ کا عربی کے بارے میں صفحہ: اعزازات، کتابیں ⁦(ایک فرانزک میڈیسن کی درسی کتاب اور سات جنسی ادویات کی کتابیں)⁩ اور پریس ورک۔"
  tr: "Resmi web sitesindeki Arapça genel bakış sayfası: onurlar, yayınlar (adli tıp üzerine bir kitap ve cinsel tıp üzerine yedi kitap) ve gazetecilik faaliyetleri."
  id: "Halaman tinjauan bahasa Arab di situs resminya: penghargaan, publikasi (sebuah buku dalam kedokteran forensik dan tujuh buku tentang kedokteran seksual), dan aktivitas jurnalistik."
