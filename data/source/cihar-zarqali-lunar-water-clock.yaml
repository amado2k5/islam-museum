reliability_note: "Arabic repost actually read in full 2026-11-15 of a Spanish press report (original ABC coverage of Toledo water archaeology). Establishes: al-Zuhri (d. 1137) gives the most accurate description — two water vessels made by Abu al-Qasim ibn Abd al-Rahman known as al-Zarqil, letting people read the hour, tell day from night and calculate the lunar day; two great ponds in a house on Toledo's outskirts on the Tagus bank near the Tanners' Gate (Bab al-Dabbaghin), filling and emptying with the moon; new-crescent inflow through 'invisible channels', half a seventh per twenty-four hours, half-full after a week, full to overflowing the next, recession from the fifteenth night at the same rate, empty on the twenty-ninth. The page reports Toledo archaeologist Julián García Sánchez de Pedro's Las Tinerías spring hypothesis (hydrological-cycle spring near the Yuso Arab baths, Huerta de la Alcorna; excavators García, Gómez, Potes, Coral) as an unproven candidate water source, Julio Borrego's street-history note on 1973 San Sebastián finds, and Clara Delgado's 1987 'Toledo islámica' location criteria — while stating no reliable archaeological evidence exists and the clocks' fame 'oscillated between reality and legend'. The reposted biography gives al-Zarqali 420-480 AH (1029-1087 CE), a dating variant kept separate from the person record's 1029-1100."
