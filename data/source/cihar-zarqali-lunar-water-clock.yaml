summary:
  ar: "صفحة إخبارية عربية ⁦(CIHAR، 14 آب 2023)⁩ تعيد نشر تقرير ABC/ماريانو كالفو عن البيلتا في طليطلة: وصف ابن الزهري لوعاءَي ماء يحتمان التاريخ القمري، وفرضية أثرية حديثة لعين في لاس تينيrias لا دليل حاسمًا عليها، وصراحة أن صيتها تذبذب «بين الواقع والأسطورة»."
  en: "Arabic news page (CIHAR, 14 Aug 2023) reposting the ABC/Mariano Calvo report on Toledo's bays: al-Zuhri's description of twin lunar-time water vessels, a modern archaeological spring hypothesis at Las Tinerías with no decisive evidence, and the explicit note that its fame 'oscillated between reality and legend'."
  ur: "عربی نئی سائٹ ⁦(CIHAR، 14 اگست 2023)⁩ جس نے ABC/ماریانو کالفو کی طلیطلہ کی بيلتا کے بارے میں رپورٹ دوبارہ شائع کی: ابن زہری کا دو کتابوں کے قمری آبی وسطوں کا بیان، Las Tinerías میں جدید أثری چشمہ فرضیہ جس کی کوئی حتمی ثبوت نہیں، اور یہ تسلیم کہ اس کی شہرت «واقعیت اور افسانے کے درمیان» رہی۔"
  es: "La página de noticias árabe (CIHAR, 14 de agosto de 2023) republica el informe de ABC/Mariano Calvo sobre las bahías de Toledo: la descripción de al-Zuhri de dos recipientes de agua que datan de la época lunar, una hipótesis arqueológica moderna sobre un manantial en Las Tinerías sin pruebas concluyentes y la nota explícita de que su fama \"oscilaba entre la realidad y la leyenda\"."
  fr: "Page d'actualités arabes (CIHAR, 14 août 2023) republiant le reportage ABC/Mariano Calvo sur les baies de Tolède: la description par al-Zuhri de deux récipients d'eau datant de l'époque lunaire, une hypothèse archéologique moderne sur une source à Las Tinerías sans preuve décisive, et la note explicite selon laquelle sa renommée « oscillait entre réalité et légende »."
