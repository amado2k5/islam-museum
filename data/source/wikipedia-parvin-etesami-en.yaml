  ar: "مقالة ويكيبيديا الإنجليزية عن پروین اعتصامی؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاد رخشنده اعتصامی في 17 مارس 1907 في تبريز ووفاتها في 4 أبريل 1941 في طهران ودفنها في قم، ودراستها في مدرسة إيران بيت إيل وزواجها القصير وديوانها الذي يضم 209 قصيدة و5,606 بيتًا."
  en: "English Wikipedia article on Parvin E'tesami; used for entity facts only. It gives Rakhshandeh E'tesami's birth on 17 March 1907 at Tabriz and her death on 4 April 1941 at Tehran with burial at Qom, her schooling at Iran Bethel, her short marriage, and her Divan of 209 compositions and 5,606 distiches."
  es: "Artículo de la Wikipedia en inglés sobre Parvin E'tesami; utilizado únicamente para datos sobre la persona. Indica que Rakhshandeh E'tesami nació el 17 de marzo de 1907 en Tabriz y falleció el 4 de abril de 1941 en Teherán, siendo enterrada en Qom. También menciona su educación en Iran Bethel, su breve matrimonio y su Diván, compuesto por 209 obras y 5606 dísticos."
  fr: "Article de Wikipédia en anglais sur Parvin E'tesami; utilisé uniquement pour les informations relatives à l'entité. Il indique la naissance de Rakhshandeh E'tesami le 17 mars 1907 à Tabriz et sa mort le 4 avril 1941 à Téhéran, avec inhumation à Qom, sa scolarité à Iran Bethel, son court mariage et son Divan de 209 compositions et 5 606 distiques."
