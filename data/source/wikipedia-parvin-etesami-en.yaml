  ar: "مقالة ويكيبيديا الإنجليزية عن پروین اعتصامی؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاد رخشنده اعتصامی في 17 مارس 1907 في تبريز ووفاتها في 4 أبريل 1941 في طهران ودفنها في قم، ودراستها في مدرسة إيران بيت إيل وزواجها القصير وديوانها الذي يضم 209 قصيدة و5,606 بيتًا."
  en: "English Wikipedia article on Parvin E'tesami; used for entity facts only. It gives Rakhshandeh E'tesami's birth on 17 March 1907 at Tabriz and her death on 4 April 1941 at Tehran with burial at Qom, her schooling at Iran Bethel, her short marriage, and her Divan of 209 compositions and 5,606 distiches."
