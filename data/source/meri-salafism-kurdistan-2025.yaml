summary:
  ar: "ورقة لمعهد الشرق الأوسط للبحوث عن السلفية في إقليم كردستان؛ نسبت إلى قناة ئامۆژگاری مركزًا لتحفيظ القرآن وأكاديمية في السليمانية، وتأسيس المحطة سنة 2013 على يد عبداللطيف أحمد بداعمين من الخليج."
  en: "A Middle East Research Institute (MERI) paper on Salafism in the Kurdistan Region; it credits Amozhgary TV with a Qur'an memorisation centre and academy in Sulaymaniyah, and dates the station's founding to 2013 by Abdullatif Ahmad with Gulf backers."
  ur: "کردستان خطے میں سلفیت پر مڈل ایسٹ ریسرچ انسٹیٹیوٹ (MERI) کی تحقیق؛ اس کے مطابق اموژگاری ٹی وی سلیمانیہ میں قرآن حفظ کا مرکز اور اکیڈمی چلاتا ہے، اور یہ اسٹیشن 2013ء میں عبداللطیف احمد نے خلیجی معاونین کے ساتھ قائم کیا تھا۔"
  es: "Un documento del Instituto de Investigación de Oriente Medio (MERI) sobre el salafismo en la región del Kurdistán atribuye a Amozhgary TV la creación de un centro y academia de memorización del Corán en Sulaymaniyah, y fecha la fundación de la cadena en 2013 por Abdullatif Ahmad con el apoyo de inversores del Golfo."
  fr: "Un document du Middle East Research Institute (MERI) sur le salafisme dans la région du Kurdistan; il attribue à Amozhgary TV un centre de mémorisation du Coran et une académie à Sulaymaniyah, et date la fondation de la chaîne à 2013 par Abdullatif Ahmad avec des bailleurs de fonds du Golfe."
  tr: "Orta Doğu Araştırma Enstitüsü tarafından Kürdistan Bölgesi'nde Selefilik üzerine hazırlanan bir makale; Amuzhgari kanalına Kur'an ezberleme merkezi ve Süleymaniye'de bir akademi olarak atfedilen ve kanal 2013 yılında Abdul Latif Ahmed tarafından Körfez'den destekçilerle kurulmuştur."
  id: "Sebuah makalah dari Middle East Research Institute tentang Salafisme di Wilayah Kurdistan; dikaitkan dengan saluran Amuzhgari sebagai pusat hafalan Al-Qur'an dan akademi di Sulaymaniyah, dan stasiun ini didirikan pada tahun 2013 oleh Abdul Latif Ahmed dengan pendukung dari Teluk."
