  ar: "مقالة ويكيبيديا الإنجليزية عن موسى تراوري؛ تُستخدم لوقائع الكيان فقط. تروي قيادته انقلاب 1968 على موديبو كيتا ورئاسته مالي (1968–1991) والإطاحة به سنة 1991 ومحاكمته والحكم عليه بالإعدام ثم تخفيفه والعفو عنه سنة 2002، ووفاته في باماكو في 15 سبتمبر 2020. لا تذكر دينه في أي نص."
  en: "English Wikipedia article on Moussa Traoré; used for entity facts only. It recounts his leadership of the 1968 coup against Modibo Keïta, his presidency of Mali (1968–1991), his overthrow in 1991, his trials, death sentences and their commutation, his pardon in 2002, and his death in Bamako on 15 September 2020. Its text says nothing about his religion; it files him under Malian Muslims."
