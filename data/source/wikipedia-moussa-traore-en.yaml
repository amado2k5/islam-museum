summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن موسى تراوري؛ تُستخدم لوقائع الكيان فقط. تروي قيادته انقلاب 1968 على موديبو كيتا ورئاسته مالي (1968–1991) والإطاحة به سنة 1991 ومحاكمته والحكم عليه بالإعدام ثم تخفيفه والعفو عنه سنة 2002، ووفاته في باماكو في 15 سبتمبر 2020. لا تذكر دينه في أي نص."
  en: "English Wikipedia article on Moussa Traoré; used for entity facts only. It recounts his leadership of the 1968 coup against Modibo Keïta, his presidency of Mali (1968–1991), his overthrow in 1991, his trials, death sentences and their commutation, his pardon in 2002, and his death in Bamako on 15 September 2020. Its text says nothing about his religion; it files him under Malian Muslims."
  es: "Artículo de la Wikipedia en inglés sobre Moussa Traoré; utilizado únicamente para datos sobre la persona. Relata su liderazgo en el golpe de Estado de 1968 contra Modibo Keïta, su presidencia de Malí (1968-1991), su derrocamiento en 1991, sus juicios, sus condenas a muerte y su conmutación, su indulto en 2002 y su muerte en Bamako el 15 de septiembre de 2020. El texto no menciona su religión; lo clasifica dentro de la categoría de musulmanes malienses."
  fr: "Article de Wikipédia en anglais sur Moussa Traoré; utilisé uniquement à des fins d’information sur l’entité. Il relate son rôle dans le coup d’État de 1968 contre Modibo Keïta, sa présidence du Mali (1968-1991), son renversement en 1991, ses procès, ses condamnations à mort et leur commutation, sa grâce en 2002 et sa mort à Bamako le 15 septembre 2020. Le texte ne mentionne pas sa religion; il est classé parmi les musulmans maliens."
  ur: "Moussa Traoré پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں مودیبو کیتا کے خلاف 1968 کی بغاوت کی ان کی قیادت، مالی کی ان کی صدارت (1968–1991)، 1991 میں ان کا تختہ الٹنے، ان کے مقدمات، سزائے موت اور ان میں تبدیلی، 2002 میں ان کی معافی، اور 15 ستمبر 2020 کو باماکو میں ان کی موت کے بارے میں بیان کیا گیا ہے؛ یہ اس کے مذہب کے بارے میں کچھ نہیں کہتا۔ یہ اسے مالی کے مسلمانوں کے تحت فائل کرتا ہے۔"
