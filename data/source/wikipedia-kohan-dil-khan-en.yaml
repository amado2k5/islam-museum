summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كهندل خان؛ تُستخدم لوقائع الكيان فقط. تروي مولده سنة 1792 في قندهار لأبيه باينده خان وأم من الهوتك، وولايته على قندهار (1830–1839 و1842–1855) ضمن إمارة إخوته «دل»، ووفاته في هراة في 21 أغسطس 1855 ودفنه في جامع هراة الكبير، وتصفه بأنه الأخ غير الشقيق لدوست محمد خان."
  en: "English Wikipedia article on Kohan Dil Khan; used for entity facts only. It recounts his birth in 1792 at Kandahar to Payandah Khan and a Hotak mother, his two periods as Sardar of Kandahar (1830–1839 and 1842–1855) within the Dil brothers' principality, his death at Herat on 21 August 1855 and burial in the Great Mosque of Herat, and describes Dost Mohammad Khan as a half-brother of the Dil brothers. It carries no religion field and names no school for him."
  ur: "کہندل خان پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ اس میں ان کی پیدائش 1792ء میں قندھار میں، قندھار کی سرداری کے دو ادوار، 21 اگست 1855ء کو ہرات میں وفات اور وہیں دفن ہونے کا ذکر ہے۔"
