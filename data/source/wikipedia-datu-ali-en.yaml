  ar: "مقالة ويكيبيديا الإنجليزية عن داتو علي، راجا بويان (1902–1905)؛ تُستخدم لوقائع الكيان فقط. لا تعطي تاريخ مولد في أي موضع، وتعطي وفاته في 22 تشرين الأول 1905 عند نهر مالالا، وخلافته لابن عمه داتو أوتو، ودينه في مربع معلوماتها الإسلام السني؛ والمقالة تحمل منذ أيار 2024 لافتتي تنقيح وإعادة تنظيم وأسلوب مقالي."
  en: "English Wikipedia article on Datu Ali, Rajah of Buayan (1902–1905); used for entity facts only. It gives no birth date anywhere, his death on 22 October 1905 at the Malala River, his succession of his cousin Datu Uto, and his religion in its infobox as Sunni Islam; the article has carried cleanup-reorganize and essay-like banners since May 2024."
