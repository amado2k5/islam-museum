summary:
  ar: "مقالة ويكيبيديا العربية عن كوليت الخوري؛ تُستخدم لوقائع الكيان فقط. تعطي ولادتها في دمشق عام 1354هـ/ 1935م وتنصّ على أن هذا هو تاريخها الصحيح بتصريح منها في حوار صحفي، كما في معجم شهيرات النساء لنزار أباظة وحديث العبقريات لعبد الغني العطري وموسوعة الأسر الدمشقية للصواف، مع ذكر سنة 1936 عند عبد القادر عياش؛ وتقول إنها وُلدت لأسرة نصرانية مرموقة من طائفة الروم الأرثوذكس، وهو تأطير أسري لا انتماء شخصي؛ وتعطي وفاتها في دمشق يوم الجمعة 22 شوال 1447هـ الموافق 10 أبريل 2026م."
  en: "Arabic Wikipedia article on Colette Khoury; used for entity facts only. It gives her birth at Damascus in 1354 AH / 1935 CE and states that this is the correct year by her own statement in a press interview, as recorded in Nizar Abaza's dictionary of notable Syrian women, Abd al-Ghani al-Atri's Hadith al-Abqariyat and al-Sawaf's Encyclopedia of Damascene Families, with Abd al-Qadir Ayyash giving 1936. It says she was born to a notable Christian family of the Greek Orthodox community — family framing, not a personal affiliation — and gives her death at Damascus on Friday 22 Shawwal 1447 AH, corresponding to 10 April 2026."
