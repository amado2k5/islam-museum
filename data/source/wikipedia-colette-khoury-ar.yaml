summary:
  ar: "مقالة ويكيبيديا العربية عن كوليت الخوري؛ تُستخدم لوقائع الكيان فقط. تعطي ولادتها في دمشق عام 1354هـ/ 1935م وتنصّ على أن هذا هو تاريخها الصحيح بتصريح منها في حوار صحفي، كما في معجم شهيرات النساء لنزار أباظة وحديث العبقريات لعبد الغني العطري وموسوعة الأسر الدمشقية للصواف، مع ذكر سنة 1936 عند عبد القادر عياش؛ وتقول إنها وُلدت لأسرة نصرانية مرموقة من طائفة الروم الأرثوذكس، وهو تأطير أسري لا انتماء شخصي؛ وتعطي وفاتها في دمشق يوم الجمعة 22 شوال 1447هـ الموافق 10 أبريل 2026م."
  en: "Arabic Wikipedia article on Colette Khoury; used for entity facts only. It gives her birth at Damascus in 1354 AH / 1935 CE and states that this is the correct year by her own statement in a press interview, as recorded in Nizar Abaza's dictionary of notable Syrian women, Abd al-Ghani al-Atri's Hadith al-Abqariyat and al-Sawaf's Encyclopedia of Damascene Families, with Abd al-Qadir Ayyash giving 1936. It says she was born to a notable Christian family of the Greek Orthodox community — family framing, not a personal affiliation — and gives her death at Damascus on Friday 22 Shawwal 1447 AH, corresponding to 10 April 2026."
  es: "Artículo de Wikipedia en árabe sobre Colette Khoury; utilizado únicamente para datos sobre la persona. Indica que nació en Damasco en 1354 AH / 1935 d. C. y afirma que este es el año correcto según su propia declaración en una entrevista de prensa, tal como consta en el diccionario de mujeres sirias notables de Nizar Abaza, el Hadith al-Abqariyat de Abd al-Ghani al-Atri y la Enciclopedia de familias damascenas de al-Sawaf, con Abd al-Qadir Ayyash indicando 1936. Menciona que nació en una familia cristiana notable de la comunidad ortodoxa griega —un contexto familiar, no una afiliación personal— y sitúa su muerte en Damasco el viernes 22 de Shawwal de 1447 AH, correspondiente al 10 de abril de 2026."
  fr: "L'article de Wikipédia en arabe consacré à Colette Khoury, utilisé uniquement à des fins d'information, indique sa naissance à Damas en 1354 AH / 1935 CE. Cette date est confirmée par une déclaration de Colette Khoury lors d'une interview, ainsi que par le dictionnaire de Nizar Abaza sur les femmes syriennes notables, le Hadith al-Abqariyat d'Abd al-Ghani al-Atri et l'Encyclopédie des familles damascènes d'al-Sawaf, tandis qu'Abd al-Qadir Ayyash mentionne 1936. L'article précise qu'elle était issue d'une famille chrétienne notable de la communauté orthodoxe grecque – un lien de parenté, et non une appartenance personnelle – et indique son décès à Damas le vendredi 22 Shawwal 1447 AH, correspondant au 10 avril 2026."
  ur: "Colette Khoury پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے دمشق میں 1354 ہجری / 1935 عیسوی میں اس کی پیدائش کی ہے اور کہا ہے کہ یہ صحیح سال ہے اس نے ایک پریس انٹرویو میں اپنے بیان کے مطابق، جیسا کہ نزار ابازہ کی مشہور شامی خواتین کی لغت میں درج ہے، عبد الغنی العطری کی حدیث العبقریت اور الصوف کی انسائیکلوپیڈیا کے ساتھ عبد الغنی العطری کی انسائیکلوپیڈیا کے ساتھ۔ 1936۔ اس میں کہا گیا ہے کہ وہ یونانی آرتھوڈوکس کمیونٹی کے ایک قابل ذکر عیسائی گھرانے میں پیدا ہوئی تھی - خاندان کی تشکیل، ذاتی وابستگی نہیں - اور جمعہ 22 شوال 1447 ہجری کو دمشق میں 10 اپریل 2026 کی مناسبت سے اپنی موت واقع ہوئی۔"
  tr: "Colette Khoury hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 1354 Hicri / 1935 yılında Şam'da yapar ve bir basın röportajında bunun doğru tarih olduğunu belirtir; bu tarihin doğru tarih olduğunu bir basın röportajında belirtir; bu tarih Nizar Abaza'nın Ünlü Kadınlar Sözlüğü, Abdul Ghani Al-Atari'nin 'Dahilerin Hadisi' ve Al-Sawwaf'ın Şam Aileleri Ansiklopedisi'nde belirtilir; 1936'da Abdul Kadir Ayyash'tan bahseder; Yunan Ortodoks topluluğundan önde gelen bir Hristiyan ailede doğduğunu ve bunun kişisel bir bağlılık değil, bir aile çerçevesi olduğunu belirtir; ölümünü Şam'da 22 Şevval 1447 H Cuma günü, yani 10 Nisan 2026'da vermektedir."
  id: "Artikel Wikipedia bahasa Arab tentang Colette Khoury hanya digunakan untuk fakta entitas tersebut. Ia melahirkan di Damaskus pada tahun 1354 H / 1935 M dan menyatakan bahwa itu adalah tanggal yang benar dalam wawancara pers, seperti yang dinyatakan dalam Kamus Wanita Terkenal karya Nizar Abaza, 'Hadith of Geniuses' oleh Abdul Ghani Al-Atari, dan Encyclopedia of Damascene Families oleh Al-Sawwaf, menyebutkan tahun 1936 bersama Abdul Qadir Ayyash; ia mengatakan bahwa ia lahir dalam keluarga Kristen terkemuka dari komunitas Ortodoks Yunani, yang merupakan kerangka keluarga bukan afiliasi pribadi; ia menyebutkan kematiannya di Damaskus pada hari Jumat, 22 Shawwal 1447 H, yang bertepatan dengan 10 April 2026."
