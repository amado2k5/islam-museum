label:
  ar: "مصطفى محمود، رأيت الله ⁦(دار المعارف، القاهرة، 1976)⁩"
  en: "Mostafa Mahmoud, Ra'aytu Allah (Dar al-Ma'arif, Cairo, 1976)"
  ur: "مصطفیٰ محمود، رأیت اللہ ⁦(دار المعارف، قاہرہ، 1976)⁩"
summary:
  ar: "طبعة دار المعارف بمصر (1976) من كتاب مصطفى محمود «رأيت الله»، وهو مقالة في «رؤية العقل والبصيرة» يتلوها نقل وشرح لنصوص من «المواقف والمخاطبات» للنفري، وتعقيب للمؤلف في مذهب النفري في المعرفة الإلهية."
  en: "Dar al-Ma'arif's Cairo printing (1976) of Mostafa Mahmoud's Ra'aytu Allah: an essay on 'seeing with the mind and inner sight', followed by quotations from and commentary on al-Niffari's al-Mawaqif wa-l-Mukhatabat, and the author's closing essay on al-Niffari's doctrine of divine knowledge."
  ur: "مصطفیٰ محمود کی «رأیت اللہ» کا دار المعارف مصر (1976) کا ایڈیشن: «عقل اور بصیرت سے دیکھنے» پر ایک مضمون، اس کے بعد نفری کی «المواقف والمخاطبات» سے اقتباسات اور ان کی شرح، اور آخر میں نفری کے نظریۂ معرفتِ الٰہی پر مصنف کا تعقیب۔"
  es: "Edición de Dar al-Ma'arif en El Cairo (1976) de Ra'aytu Allah de Mostafa Mahmoud: un ensayo sobre 'ver con la mente y la visión interior', seguido de citas y comentarios de al-Mawaqif wa-l-Mukhatabat de al-Niffari, y el ensayo final del autor sobre la doctrina del conocimiento divino de al-Niffari."
  fr: "L'édition du Caire de Dar al-Ma'arif (1976) de Ra'aytu Allah de Mostafa Mahmoud: un essai sur « voir avec l'esprit et la vision intérieure », suivi de citations et de commentaires sur al-Mawaqif wa-l-Mukhatabat d'al-Niffari, et de l'essai final de l'auteur sur la doctrine de la connaissance divine d'al-Niffari."
  tr: "Dar Al-Ma'arif in Egypt (1976) baskısı, Mustafa Mahmoud'un \"Tanrı'yı Gördüm\" adlı kitabının baskısıdır; bu eser \"Akıl ve İçgörü Vizyonu\" üzerine bir denemedir, ardından Al-Nafri'nin \"Al-Mawaqif wa al-Mukhalabat\" adlı eserinden alıntılar ve açıklamalar içerir, ardından yazarın Al-Nafri'nin ilahi bilgi doktrini üzerine bir yorumu gelir."
  id: "Edisi Dar Al-Ma'arif di Mesir (1976) dari buku Mustafa Mahmoud \"Aku Melihat Tuhan,\" yang merupakan esai tentang \"Visi Akal dan Wawasan,\" diikuti kutipan dan penjelasan teks dari Al-Nafri \"Al-Mawaqif wa al-Mukhalabat\" karya Al-Nafri, diikuti komentar oleh penulis tentang doktrin pengetahuan ilahi Al-Nafri."
