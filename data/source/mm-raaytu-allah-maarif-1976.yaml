  ar: "مصطفى محمود، رأيت الله (دار المعارف، القاهرة، 1976)"
  en: "Mostafa Mahmoud, Ra'aytu Allah (Dar al-Ma'arif, Cairo, 1976)"
  ur: "مصطفیٰ محمود، رأیت اللہ (دار المعارف، قاہرہ، 1976)"
summary:
  ar: "طبعة دار المعارف بمصر (1976) من كتاب مصطفى محمود «رأيت الله»، وهو مقالة في «رؤية العقل والبصيرة» يتلوها نقل وشرح لنصوص من «المواقف والمخاطبات» للنفري، وتعقيب للمؤلف في مذهب النفري في المعرفة الإلهية."
  en: "Dar al-Ma'arif's Cairo printing (1976) of Mostafa Mahmoud's Ra'aytu Allah: an essay on 'seeing with the mind and inner sight', followed by quotations from and commentary on al-Niffari's al-Mawaqif wa-l-Mukhatabat, and the author's closing essay on al-Niffari's doctrine of divine knowledge."
  ur: "مصطفیٰ محمود کی «رأیت اللہ» کا دار المعارف مصر (1976) کا ایڈیشن: «عقل اور بصیرت سے دیکھنے» پر ایک مضمون، اس کے بعد نفری کی «المواقف والمخاطبات» سے اقتباسات اور ان کی شرح، اور آخر میں نفری کے نظریۂ معرفتِ الٰہی پر مصنف کا تعقیب۔"
