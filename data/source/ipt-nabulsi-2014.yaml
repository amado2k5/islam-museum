summary:
  ar: "تقرير لمنظمة «مشروع التحقيق في الإرهاب» الأمريكية عن جولة محمد راتب النابلسي في الولايات المتحدة، ينقل وينتقد مقالا نشره سنة 2001 في حكم العمليات الاستشهادية في فلسطين."
  en: "A report by the US Investigative Project on Terrorism on Mohammed Rateb al-Nabulsi's American tour, quoting and criticising an essay he published in 2001 on the ruling on martyrdom operations in Palestine."
  es: "Un informe del Proyecto de Investigación sobre Terrorismo de Estados Unidos sobre la gira estadounidense de Mohammed Rateb al-Nabulsi, que cita y critica un ensayo que publicó en 2001 sobre el fallo relativo a las operaciones de martirio en Palestina."
  fr: "Un rapport du Projet d'enquête américain sur le terrorisme concernant la tournée américaine de Mohammed Rateb al-Nabulsi, citant et critiquant un essai qu'il a publié en 2001 sur la décision relative aux opérations de martyre en Palestine."
  ur: "محمد راتب النبلسی کے امریکی دورے پر دہشت گردی کے بارے میں امریکی تحقیقاتی پروجیکٹ کی ایک رپورٹ، جس میں فلسطین میں شہادت کی کارروائیوں کے بارے میں 2001 میں شائع ہونے والے ایک مضمون کا حوالہ دیا گیا ہے اور اس پر تنقید کی گئی ہے۔"
title: "IPT Exclusive: Radical Syrian Cleric Secures US Visa Despite Endorsing Suicide Bombings"
