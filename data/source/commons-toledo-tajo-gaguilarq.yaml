  ar: "سجل ملف ويكيميديا كومنز لصورة «طليطلة ونهر تاجة» لمصوّر غاغويلارك؛ وصفها «المدينة القائمة على بعد ثلاثمئة قدم فوق الضفة اليمنى لنهر تاجا»، رخصة CC BY-SA 3.0 es، تُستخدم سياقًا لموقع البيلتا المروي لا كتصوير للأداة نفسها."
  en: "Wikimedia Commons file record for 'Toledo And Tajo River.jpg' by Gaguilarq: 'the city located a three hundred feet above the right bank of the Río Tajo', CC BY-SA 3.0 es; used only as setting context for the reported site, not as an image of the device."
  ur: "وکیمڈیا کامنز کا فائل ریکارڈ 'Toledo And Tajo River.jpg' اگرولارک کی — «دریائے تاجا کے دائیں کنارے سے تین سو فٹ اوپر واقع شہر»، CC BY-SA 3.0 es؛ صرف بیان شدہ مقام کے سیاق کے لیے استعمال، آلہ کی تصویر نہیں۔"
  es: "Registro de archivo de Wikimedia Commons para 'Toledo And Tajo River.jpg' de Gaguilarq: 'la ciudad ubicada a trescientos pies sobre la margen derecha del río Tajo', CC BY-SA 3.0 es; usado solo como contexto de configuración para el sitio reportado, no como una imagen del dispositivo."
  fr: "Notice Wikimedia Commons du fichier « Toledo And Tajo River.jpg » par Gaguilarq: « la ville située à trois cents pieds au-dessus de la rive droite du Río Tajo », CC BY-SA 3.0 es; utilisée uniquement comme contexte pour le site signalé, et non comme image de l'appareil."
  tr: "Wikimedia Commons dosyası, fotoğrafçı Gaguilark'ın \"Toledo ve Taga Nehri\" adlı görüntüsünü kaydetmiş; bunu \"Taga Nehri'nin sağ kıyısının üç yüz feet üzerinde duran şehir\" olarak tanımlamış, CC BY-SA 3.0 es lisansıyla lisanslanmış ve Pelta sitesinin anlatımı için bir bağlam olarak kullanılmış, enstrümanın kendisinin tasviri olarak değil."
  id: "File Wikimedia Commons merekam gambar \"Toledo dan Sungai Taga\" oleh fotografer Gaguilark; menggambarkannya sebagai \"kota yang berdiri tiga ratus kaki di atas tepi kanan Sungai Taga,\" berlisensi di bawah CC BY-SA 3.0 es, digunakan sebagai konteks untuk situs Pelta yang dinarasikan daripada sebagai penggambaran instrumen itu sendiri."
