summary:
  ar: "مقالة ويكيبيديا الروسية عن عزير حاجبايوف؛ تُستخدم لوقائع الكيان فقط. تروي سيرته وأعماله بالتفصيل، وتذكر بدورها شهادة ميلاده الصادرة عن الإدارة الروحية لمسلمي ما وراء القوقاز، ووفاته في باكو في 23 نوفمبر 1948."
  en: "Russian Wikipedia article on Uzeyir Hajibeyov; used for entity facts only. It recounts his life and works in detail, likewise records his birth certificate issued by the Transcaucasian Muslim Spiritual Administration, and gives his death at Baku on 23 November 1948."
  es: "Artículo de la Wikipedia en ruso sobre Uzeyir Hajibeyov; utilizado únicamente para obtener información sobre la persona. Relata su vida y obra en detalle, registra su certificado de nacimiento expedido por la Administración Espiritual Musulmana Transcaucásica e indica que falleció en Bakú el 23 de noviembre de 1948."
  fr: "Article de Wikipédia en russe sur Uzeyir Hajibeyov; utilisé uniquement à des fins d’information sur l’entité. Il relate sa vie et son œuvre en détail, mentionne son acte de naissance délivré par l’Administration spirituelle musulmane transcaucasienne et indique son décès à Bakou le 23 novembre 1948."
  ur: "عزیر حاجی بیوف پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی زندگی اور کام کو تفصیل سے بیان کیا گیا ہے، اسی طرح ٹرانسکاکیشین مسلم روحانی انتظامیہ کی طرف سے جاری کردہ ان کے پیدائشی سرٹیفکیٹ کو بھی ریکارڈ کیا گیا ہے، اور 23 نومبر 1948 کو باکو میں ان کی موت کا ذکر ہے۔"
