summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ريكو فيرهوفن؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل ريكاردو فيرهوفن وميلاده في بيرغن أوب زوم في 10 أبريل 1989، وبقاءه على عرش غلوري للوزن الثقيل 4220 يومًا مع 13 دفاعًا، ومنازلته أوسيك على لقب الملاكمة سنة 2026. ولا تذكر ديانته."
  en: "English Wikipedia article on Rico Verhoeven; used for entity facts only. It gives his full name Ricardo Verhoeven, his birth in Bergen op Zoom on 10 April 1989, his 4,220-day reign as Glory heavyweight champion with thirteen defences, and his 2026 challenge to Oleksandr Usyk for the WBC boxing title. It makes no statement of his religion."
  es: "Artículo de la Wikipedia en inglés sobre Rico Verhoeven; utilizado únicamente para datos sobre la persona. Menciona su nombre completo, Ricardo Verhoeven, su nacimiento en Bergen op Zoom el 10 de abril de 1989, su reinado de 4220 días como campeón de peso pesado de Glory con trece defensas, y su desafío a Oleksandr Usyk en 2026 por el título de boxeo del CMB. No se menciona su religión."
  fr: "Article Wikipédia en anglais sur Rico Verhoeven; utilisé uniquement pour les informations le concernant. Il indique son nom complet, Ricardo Verhoeven, sa naissance à Bergen op Zoom le 10 avril 1989, son règne de 4 220 jours en tant que champion poids lourd du Glory (avec treize défenses de titre), et son combat contre Oleksandr Usyk en 2026 pour le titre WBC de boxe. Il ne mentionne pas sa religion."
  ur: "Rico Verhoeven پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کا پورا نام ریکارڈو ورہوون، 10 اپریل 1989 کو برجن اوپ زوم میں اس کی پیدائش، تیرہ دفاعوں کے ساتھ گلوری ہیوی ویٹ چیمپیئن کے طور پر اس کا 4,220 دن کا دور، اور WBC باکسنگ ٹائٹل کے لیے 2026 میں اولیکسینڈر اسک کو چیلنج دیتا ہے۔ اس میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Rico Verhoeven hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için kullanılmıştır. Tam adı Ricardo Verhoeven ve 10 Nisan 1989'da Bergen op Zoom'da doğduğu, 4220 gün süren Glory ağır siklet tahtındaki 13 savunması ve 2026'daki boks unvanı için dövüşünü belirtmektedir. Dini belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Rico Verhoeven; digunakan hanya untuk fakta entitas. Artikel ini mencantumkan nama lengkapnya Ricardo Verhoeven dan kelahirannya di Bergen op Zoom pada 10 April 1989, masa jabatannya di tahta kelas berat Glory selama 4220 hari dengan 13 pertahanan, dan pertarungannya untuk gelar tinju pada 2026. Agamanya tidak disebutkan."
