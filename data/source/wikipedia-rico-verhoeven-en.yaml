reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The infobox gives his full name (birth name Ricardo Verhoeven, citing BN DeStem), birth date and place, his kickboxing record (66 wins, 21 by knockout, 10 losses), a 1-1 boxing record and one MMA knockout win. The lead says he formerly competed in Glory's heavyweight division as its longest-reigning champion, defended the title a record thirteen times over 4,220 days, and challenged for the WBC heavyweight title at the Giza Plateau, Egypt, in 2026. The early-life text says he began martial arts at the age of one with Kyokushin under his father and took up kickboxing at seven. Neither its text nor its categories makes any statement of his religion."
