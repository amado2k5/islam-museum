reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Used for his birth in London in 1973 and upbringing in Karachi — the birth year cited there to his University of Iowa International Writing Program biography — his Georgetown degrees of 1996, his World Bank years from 1997 to 2003, his Boston University creative writing studies under Ha Jin, his return to Karachi in 2007, Home Boy (2009) and its DSC Prize of January 2011, and The Selected Works of Abdullah the Cossack (2019). The article names no religion for him. Its birth year conflicts with Wikidata and the Literary Encyclopedia, which both give 1974; the record carries the conflict in the born note under the status debated."
