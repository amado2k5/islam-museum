summary:
  ar: "مقالة ويكيبيديا العربية عن محمد ولد الغزواني؛ تُستخدم لوقائع الكيان فقط. هي أطول من الإنجليزية، وفيها قسم للأصول يذكر أنه من سلالة صوفية مسلمة عريقة وأنه «يعرّف نفسه بأنه مسلم متمسك بقيم الإسلام والطقوس المالكية»، وهو نص يطابق المقالة الفرنسية ومصادرها نفسها، فهما أسرة مصدرية واحدة لا شاهدان مستقلان."
  en: "Arabic Wikipedia article on Mohamed Ould Ghazouani; used for entity facts only. It is longer than the English one; its lineage section says he descends from an old Sufi Muslim line and that he 'defines himself as a Muslim attached to the values of Islam and the Maliki rites'. That passage matches the French article's text and carries the same citations (Jeune Afrique 2012; La Libre 2019), so the Arabic and French articles are one source family for it, not two attestations. Its infobox gives his birth on 31 December 1956 at Boumdeid and his full name as Mohamed Ould Cheikh Mohamed Ahmed Ould Ghazouani."
  es: "Artículo en árabe de la Wikipedia sobre Mohamed Ould Ghazouani; utilizado únicamente para datos sobre la persona. Es más extenso que el artículo en inglés; su sección de linaje indica que desciende de una antigua estirpe musulmana sufí y que se define a sí mismo como un musulmán apegado a los valores del Islam y los ritos Maliki. Este pasaje coincide con el texto del artículo en francés y contiene las mismas citas (Jeune Afrique 2012; La Libre 2019), por lo que los artículos en árabe y francés constituyen una sola fuente, no dos testimonios distintos. Su ficha informativa indica que nació el 31 de diciembre de 1956 en Boumdeid y que su nombre completo es Mohamed Ould Cheikh Mohamed Ahmed Ould Ghazouani."
  fr: "Article Wikipédia en arabe sur Mohamed Ould Ghazouani; utilisé uniquement pour les informations le concernant. Plus long que l’article anglais, sa section sur sa lignée indique qu’il descend d’une ancienne lignée soufie et qu’il « se définit comme un musulman attaché aux valeurs de l’islam et aux rites malikites ». Ce passage correspond au texte de l’article français et reprend les mêmes citations (Jeune Afrique 2012; La Libre 2019), ce qui confirme que les articles arabe et français constituent une seule et même source, et non deux attestations distinctes. Son infobox mentionne sa naissance le 31 décembre 1956 à Boumdeid et son nom complet: Mohamed Ould Cheikh Mohamed Ahmed Ould Ghazouani."
