summary:
  ar: "مقالة ويكيبيديا العربية عن محمد ولد الغزواني؛ تُستخدم لوقائع الكيان فقط. هي أطول من الإنجليزية، وفيها قسم للأصول يذكر أنه من سلالة صوفية مسلمة عريقة وأنه «يعرّف نفسه بأنه مسلم متمسك بقيم الإسلام والطقوس المالكية»، وهو نص يطابق المقالة الفرنسية ومصادرها نفسها، فهما أسرة مصدرية واحدة لا شاهدان مستقلان."
  en: "Arabic Wikipedia article on Mohamed Ould Ghazouani; used for entity facts only. It is longer than the English one; its lineage section says he descends from an old Sufi Muslim line and that he 'defines himself as a Muslim attached to the values of Islam and the Maliki rites'. That passage matches the French article's text and carries the same citations (Jeune Afrique 2012; La Libre 2019), so the Arabic and French articles are one source family for it, not two attestations. Its infobox gives his birth on 31 December 1956 at Boumdeid and his full name as Mohamed Ould Cheikh Mohamed Ahmed Ould Ghazouani."
