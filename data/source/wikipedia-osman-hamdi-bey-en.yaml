reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). Its text gives his birth on 30 December 1842 and death on 24 February 1910, both at Constantinople; his father Ibrahim Edhem Pasha, grand vizier 1877–1878; his Paris law studies and painting training under Jean-Léon Gérôme and Gustave Boulanger; his Baghdad posting with Midhat Pasha's team; his Kadıköy mayoralty (1875); his directorship of the Imperial Museum from 1881, his founding of the Academy of Fine Arts in 1882, the 1884 antiquities regulation, his excavations at Nemrut Dağı, Lagina and Sidon (the Alexander Sarcophagus), and paintings including The Tortoise Trainer (1906) and Girl Reciting Qur'an (1880). It names no religion or school for him. Checked 24 October 2026."
