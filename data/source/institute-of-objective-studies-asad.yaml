summary:
  ar: "مذكرة مفهوم مؤتمر «شخصية محمد أسد ومساهمته» ⁦(معهد الدراسات الموضوعية، نيودلهي، بالتعاون مع المعهد العالمي للفكر الإسلامي، 2022)⁩؛ تنصّ على أنه «قبل الإسلام السني سنة 1926 ⁦(في برلين)⁩»."
  en: "Concept note of the 2022 conference 'Personality and Contribution of Muhammad Asad' (Institute of Objective Studies, New Delhi, with the International Institute of Islamic Thought); it states that 'He accepted Sunni Islam in 1926 (in Berlin)'."
  es: "Nota conceptual de la conferencia de 2022 \"Personalidad y contribución de Muhammad Asad\" (Instituto de Estudios Objetivos, Nueva Delhi, con el Instituto Internacional de Pensamiento Islámico); en ella se afirma que \"aceptó el Islam sunita en 1926 (en Berlín)\"."
  fr: "Note conceptuelle de la conférence de 2022 « Personnalité et contribution de Muhammad Asad » (Institut d'études objectives, New Delhi, avec l'Institut international de la pensée islamique); il y est indiqué qu'« il a accepté l'islam sunnite en 1926 (à Berlin) »."
  ur: "2022 کانفرنس کا تصوراتی نوٹ 'محمد اسد کی شخصیت اور شراکت' ⁦(انسٹی ٹیوٹ آف آبجیکٹیو اسٹڈیز، نئی دہلی، بین الاقوامی انسٹی ٹیوٹ آف اسلامک تھاٹ کے ساتھ)⁩؛ اس میں کہا گیا ہے کہ 'اس نے 1926 میں ⁦(برلن میں)⁩ سنی اسلام قبول کیا'۔"
  tr: "Konferansın \"Muhammed Asad'ın Kişiliği ve Katkısı\" (Tematik Çalışmalar Enstitüsü, Yeni Delhi, Uluslararası İslami Düşünce Enstitüsü ile iş birliği içinde, 2022) kavramsal notta; \"1926'da Sünni İslam'dan önce (Berlin'de)\" ifadesi yer alıyor."
  id: "Memorandum konsep konferensi \"Kepribadian dan Kontribusi Muhammad Asad\" (Institute of Thematic Studies, New Delhi, bekerja sama dengan International Institute of Islamic Thought, 2022); menyatakan bahwa konferensi ini \"mendahului Islam Sunni pada tahun 1926 (di Berlin).\""
title: "Concept Note: Personality and Contribution of Muhammad Asad as an International Journalist, Linguist, Political Theorist, Mufassir and Scholar of Religions in 20th Century"
