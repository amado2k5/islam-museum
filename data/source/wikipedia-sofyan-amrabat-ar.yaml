reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Amrabat as born on 21 August 1996 in Huizen and describes his family as Amazigh Moroccan, originating from the Driouch province in the Rif. Its infobox has no religion field and its text makes no religion statement. The article lags the English one: its statistics run to March 2024 and it still presents the Real Betis loan as current, so the English article is followed for his current club (Ajax, from August 2026)."
