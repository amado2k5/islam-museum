summary:
  ar: "مقالة ويكيبيديا العربية عن سفيان أمرابط؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 21 أغسطس 1996 في هاوزن بهولندا، وتصف أسرته بأنها أسرة مغربية أمازيغية تعود أصولها إلى إقليم الدريوش في الريف، وتسرد مسيرته مع الأندية والمنتخب المغربي."
  en: "Arabic Wikipedia article on Sofyan Amrabat; used for entity facts only. It confirms his birth on 21 August 1996 in Huizen, Netherlands, describes his family as an Amazigh Moroccan family originating from the Driouch province in the Rif, and lists his club and Morocco career."
  es: "Artículo de Wikipedia en árabe sobre Sofyan Amrabat; utilizado únicamente para datos sobre la persona. Confirma su nacimiento el 21 de agosto de 1996 en Huizen, Países Bajos, describe a su familia como una familia amazigh marroquí originaria de la provincia de Driouch, en el Rif, y enumera su trayectoria en clubes y con la selección de Marruecos."
  fr: "Article Wikipédia en arabe sur Sofyan Amrabat; utilisé uniquement à des fins d’information. Il confirme sa naissance le 21 août 1996 à Huizen, aux Pays-Bas, décrit sa famille comme une famille marocaine amazighe originaire de la province de Driouch, dans le Rif, et répertorie son parcours en club et en équipe nationale du Maroc."
  ur: "صوفیان امربت پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 21 اگست 1996 کو ہوزین، نیدرلینڈز میں اس کی پیدائش کی تصدیق کرتا ہے، اس کے خاندان کو ایک امازی مراکش کے خاندان کے طور پر بیان کرتا ہے جس کا تعلق Rif کے ڈریوچ صوبے سے ہے، اور اس کے کلب اور مراکش کے کیریئر کی فہرست دیتا ہے۔"
  tr: "Sofyan Amrabat hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Makale, 21 Ağustos 1996'da Hollanda'nın Hausen kentinde doğduğunu doğrular ve ailesini Rif'teki Driouch eyaletinden gelen Fas kökenli Amazigh ailesi olarak tanımlar; kulüpler ve Fas milli takımındaki kariyerini anlatır."
  id: "Artikel Wikipedia Arab tentang Sofyan Amrabat; hanya digunakan untuk fakta entitas. Artikel ini mengonfirmasi kelahirannya pada 21 Agustus 1996 di Hausen, Belanda, dan menggambarkan keluarganya sebagai keluarga Amazigh Maroko yang berasal dari provinsi Driouch di Rif, menceritakan kariernya bersama klub dan tim nasional Maroko."
