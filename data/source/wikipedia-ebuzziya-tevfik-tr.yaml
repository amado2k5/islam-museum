reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. Its infobox gives the place of death as Kadikoy, Istanbul, and its birth name as Ebüzziya Mehmed Tevfik, while its text says his real name was Mehmed Tevfik and that he took the signature Ebüzziya, from his son Ziya, in the Rhodes exile. Its infobox religion (din) field is present but left blank, and its text makes no statement of his religion."
