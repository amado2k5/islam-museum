summary:
  ar: "مقالة ويكيبيديا التركية عن أبي الضيا توفيق؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 17 فبراير 1849 في سلطان أحمد بإسطنبول ووفاته في 27 يناير 1913، وتروي بالتفصيل صحافته وألمنكاته ومطبعته ومنفاه إلى قونية وخطه الكوفي على مسجد يلدز الحميدية وقبة زهدي باشا."
  en: "Turkish Wikipedia article on Ebüzziya Tevfik; used for entity facts only. It gives his birth on 17 February 1849 at Sultanahmet, Istanbul, and his death on 27 January 1913, and recounts in detail his newspapers and almanacs, his press, his Konya exile, and his Kufic calligraphy at the Yildiz Hamidiye Mosque and the Zuhtupasa Mosque."
  es: "Artículo de la Wikipedia en turco sobre Ebüzziya Tevfik; utilizado únicamente para datos biográficos. Indica su nacimiento el 17 de febrero de 1849 en Sultanahmet, Estambul, y su fallecimiento el 27 de enero de 1913. Además, relata en detalle sus periódicos y almanaques, su actividad en la prensa, su exilio en Konya y su caligrafía cúfica en la mezquita Yildiz Hamidiye y la mezquita Zuhtupasa."
  fr: "Article de Wikipédia en turc sur Ebüzziya Tevfik; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 17 février 1849 à Sultanahmet, Istanbul, et sa mort le 27 janvier 1913, et relate en détail ses journaux et almanachs, son activité de presse, son exil à Konya et sa calligraphie coufique à la mosquée Yildiz Hamidiye et à la mosquée Zuhtupasa."
  ur: "Ebüzziya Tevfik پر ترکی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 17 فروری 1849 کو سلطان احمد، استنبول میں ان کی پیدائش اور 27 جنوری 1913 کو ان کی وفات ہوئی، اور یلدز حمیدیہ مسجد اور زوہتوپاسا مسجد میں اس کے اخبارات اور المنکس، اس کے پریس، اس کی قونیہ جلاوطنی، اور اس کی کوفی خطاطی کا تفصیل سے ذکر کرتا ہے۔"
  tr: "Ebu Diya Tevfik hakkında Türkçe Vikipedi makalesi; yalnızca varlığın olayları için kullanılmıştır. 17 Şubat 1849'da İstanbul'un Sultanahmet kentinde doğduğunu ve 27 Ocak 1913'te vefatını anlatır; gazeteciliği, el yazmaları, matbaası, Konya'ya sürgünü ve Yıldız Hamidiye Camii ile Zuhdi Paşa Kubbesi üzerindeki Kufi alfabesini detaylandırır."
  id: "Artikel Wikipedia Turki tentang Abu Diya Tawfiq; digunakan hanya untuk peristiwa entitas tersebut. Artikel ini menceritakan kelahirannya pada 17 Februari 1849 di Sultanahmet, Istanbul dan kematiannya pada 27 Januari 1913, serta merinci jurnalisme, naskah, percetakan, pengasingan ke Konya, dan aksara Kufiknya tentang Masjid Yildiz Hamidiya dan Kubah Zuhdi Pasha."
