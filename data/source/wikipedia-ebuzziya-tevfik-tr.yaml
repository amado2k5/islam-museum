  ar: "مقالة ويكيبيديا التركية عن أبي الضيا توفيق؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 17 فبراير 1849 في سلطان أحمد بإسطنبول ووفاته في 27 يناير 1913، وتروي بالتفصيل صحافته وألمنكاته ومطبعته ومنفاه إلى قونية وخطه الكوفي على مسجد يلدز الحميدية وقبة زهدي باشا."
  en: "Turkish Wikipedia article on Ebüzziya Tevfik; used for entity facts only. It gives his birth on 17 February 1849 at Sultanahmet, Istanbul, and his death on 27 January 1913, and recounts in detail his newspapers and almanacs, his press, his Konya exile, and his Kufic calligraphy at the Yildiz Hamidiye Mosque and the Zuhtupasa Mosque."
