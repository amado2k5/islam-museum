summary:
  ar: "الموقع الرسمي لمنصة «بالانسد مسلمة» التعليمية الإسلامية للنساء المسلمات، ويسمّي أثيا إقبال مؤسِّستها، ويصف برنامجها الشهري «ريسيت سيركل» وورشها في التوازن والرفاه وإرشادها الفردي ومحاضراتها في المساجد والمدارس، ومنهجها في الجمع بين العلم الشرعي والذكاء العاطفي."
  en: "The official website of Balanced Muslima, an Islamic education platform for Muslim women, which names Athea Iqbal as its founder and describes her Reset Circle monthly programme, her balance and well-being workshops, her one-to-one mentoring, her masjid and school talks, and her approach of combining sacred knowledge with emotional intelligence."
  es: "El sitio web oficial de Balanced Muslima, una plataforma de educación islámica para mujeres musulmanas, que nombra a Athea Iqbal como su fundadora y describe su programa mensual Reset Circle, sus talleres de equilibrio y bienestar, su mentoría individual, sus charlas en mezquitas y escuelas, y su enfoque de combinar el conocimiento sagrado con la inteligencia emocional."
  fr: "Le site officiel de Balanced Muslima, une plateforme d'éducation islamique pour les femmes musulmanes, qui cite Athea Iqbal comme sa fondatrice et décrit son programme mensuel Reset Circle, ses ateliers sur l'équilibre et le bien-être, son mentorat individuel, ses interventions dans les mosquées et les écoles, ainsi que son approche combinant connaissances sacrées et intelligence émotionnelle."
