  ar: "الموقع الرسمي لمنصة «بالانسد مسلمة» التعليمية الإسلامية للنساء المسلمات، ويسمّي أثيا إقبال مؤسِّستها، ويصف برنامجها الشهري «ريسيت سيركل» وورشها في التوازن والرفاه وإرشادها الفردي ومحاضراتها في المساجد والمدارس، ومنهجها في الجمع بين العلم الشرعي والذكاء العاطفي."
  en: "The official website of Balanced Muslima, an Islamic education platform for Muslim women, which names Athea Iqbal as its founder and describes her Reset Circle monthly programme, her balance and well-being workshops, her one-to-one mentoring, her masjid and school talks, and her approach of combining sacred knowledge with emotional intelligence."
