summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن برهان الدين رباني؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 20 سبتمبر 1940 في يفتال ببدخشان، وتعليمه في كابل والأزهر، وأستاذيته للشريعة واللاهوت الإسلامي في جامعة كابل، وقيادته للجمعية الإسلامية منذ 1972، ورئاسته لأفغانستان (1992–1996 ثم أواخر 2001)، واغتياله في كابل في 20 سبتمبر 2011 ودفنه فيها. لا يسمّي نصها ولا صندوق معلوماتها مذهباً له."
  en: "English Wikipedia article on Burhanuddin Rabbani; used for entity facts only. It recounts his birth on 20 September 1940 at Yaftal, Badakhshan, his education at Kabul and Al-Azhar, his professorship of Islamic law and theology at Kabul University, his leadership of Jamiat-e Islami from 1972, his presidency of Afghanistan (1992–1996, then late 2001), his assassination at Kabul on 20 September 2011 and his burial there. Neither its text nor its infobox names a school for him."
  ur: "برہان الدین ربانی پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 20 ستمبر 1940ء کو یفتال، بدخشاں میں ان کی پیدائش، کابل اور الازہر میں ان کی تعلیم، جامعہ کابل میں شریعت اور اسلامی الٰہیات کے استاد کی حیثیت سے ان کی خدمات، 1972ء سے جمعیت اسلامی کی قیادت، افغانستان کی صدارت (1992ء–1996ء، پھر 2001ء کے اواخر)، 20 ستمبر 2011ء کو کابل میں ان کا قتل اور وہیں ان کی تدفین بیان ہوئی ہے۔ نہ اس کے متن میں اور نہ معلوماتی خانے میں ان کے کسی مسلک کا نام درج ہے۔"
