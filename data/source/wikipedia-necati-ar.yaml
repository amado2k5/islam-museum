  ar: "مقالة ويكيبيديا العربية عن عيسى نجاتي (ت. 1509)؛ تتبع المقالةَ الإنجليزية: وُلد عبدًا في أدرنة واشترى حريته، وطوّر مهارته في الخط والشعر في قسطمونة، وخدم كاتبًا للأميرين عبد الله ومحمود، ومات في القسطنطينية في 17 آذار 1509."
  en: "Arabic Wikipedia article on İsa Necati (d. 1509); it follows the English article: born a slave at Edirne and bought his freedom, developed his calligraphy and poetry at Kastamonu, served as secretary to Princes Abdullah and Mahmud, and died at Constantinople on 17 March 1509."
