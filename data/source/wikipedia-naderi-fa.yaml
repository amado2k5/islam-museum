  ar: "مقالة ويكيبيديا الفارسية عن فيروز نادري؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 5 فروردين 1325 ووفاته في 19 خرداد 1402، وتفصّل مسيرته في ناسا، وتصرح أنه لم يكن له أي وابستگی مذهبی، وتنقل جوابه أنه لا يعتقد بأي دين أو مذهب وأن الله عنده منفصل عن الدين."
  en: "Persian Wikipedia article on Firouz Naderi; used for entity facts only. It gives his birth as 5 Farvardin 1325 and his death as 19 Khordad 1402, details his NASA career, states that he had no religious affiliation, and reports his answer that he believed in no religion or sect, God being for him separate from religion."
