  ar: "مقالة ويكيبيديا العربية عن حسن منهاج؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 23 سبتمبر 1985 وعمله معلقًا سياسيًا ومقدمًا شارك في «ذا ديلي شو» من 2014 إلى 2018."
  en: "Arabic Wikipedia article on Hasan Minhaj; used for entity facts only. It confirms his birth on 23 September 1985 and his work as a comedian and political commentator who served on The Daily Show from 2014 to 2018."
  es: "Artículo de Wikipedia en árabe sobre Hasan Minhaj; se utiliza únicamente para datos sobre la persona. Confirma su nacimiento el 23 de septiembre de 1985 y su trabajo como comediante y comentarista político, que participó en The Daily Show de 2014 a 2018."
  fr: "Article de Wikipédia en arabe sur Hasan Minhaj; utilisé uniquement à des fins d’information sur l’entité. Il confirme sa naissance le 23 septembre 1985 et son travail d’humoriste et de commentateur politique au Daily Show de 2014 à 2018."
  ur: "حسن منہاج پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 23 ستمبر 1985 کو ان کی پیدائش اور مزاح نگار اور سیاسی مبصر کے طور پر ان کے کام کی تصدیق کرتا ہے جس نے 2014 سے 2018 تک دی ڈیلی شو میں خدمات انجام دیں۔"
  tr: "Hassan Minhaj hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 23 Eylül 1985'te doğumunu ve 2014-2018 yılları arasında 'The Daily Show'da yer alan siyasi yorumcu ve sunucu olarak çalışmalarını doğrulamaktadır."
  id: "Artikel Wikipedia bahasa Arab tentang Hassan Minhaj; digunakan hanya untuk fakta entitas. Artikel ini mengonfirmasi kelahirannya pada 23 September 1985, dan karyanya sebagai komentator politik serta presenter yang berpartisipasi dalam 'The Daily Show' dari 2014 hingga 2018."
