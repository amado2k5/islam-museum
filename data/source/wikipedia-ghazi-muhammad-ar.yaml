  ar: "مقالة ويكيبيديا العربية «غازي محمد الغيمراوي»؛ تُستخدم لوقائع الكيان فقط. يقول متنها إنه وشاملًا انتسبا إلى المذاهب الصوفية وكان مرشده الملا محمد اليراغي، وتعطي 1795–1832؛ ويعطي صندوق معلوماتها دينه «مسلم سني»."
  en: "Arabic Wikipedia article 'Ghazi Muhammad al-Gimrawi'; used for entity facts only. Its text says that he and Shamil both affiliated to the Sufi orders and that Mulla Muhammad al-Yaraghi was his murshid, and gives 1795–1832; its infobox gives his religion as Sunni Muslim."
