reliability_note: "Independent encyclopedia account, first published 20 July 1998 and updated to 15 October 2026; read in full on 24 October 2026. It gives his birth on 1 November 1935 in Jerusalem and death on 25 September 2003 in New York, the family's 1947 move to Cairo, Princeton (BA 1957) and Harvard (MA 1960, PhD 1964), Columbia from 1963 with full professorship in 1969 and the first endowed chair in 1977, Orientalism (1978), the Palestine National Council election of 1977 and his later criticism of the Oslo process, and his books on Palestine. Its parenthesis — that he examined Western scholarship of the Arab Islamic world 'though he was an Arab Christian' — is, with the English article's account of his Protestant Christian family, the second independent attestation of his Christian identity used in the person record."
