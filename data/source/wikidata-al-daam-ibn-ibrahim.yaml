  id: "Anser Wikidata Q124746213 tentang Al-Da'am bin Ibrahim Al-Arhabi: Ia meninggal pada tahun 910; ia digambarkan sebagai Sheikh Kahlan dan penguasa Hamdan pada masanya, dan nama lengkapnya adalah Al-Da'am bin Ibrahim bin Abdullah bin Yas Al-Arhabi di antara nama alternatifnya; tanggal lahir Al-Ansar tidak disebutkan."
