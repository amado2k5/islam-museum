  en: "Wikidata item Q124746213 for al-Da'am al-Arhabi: died 910; recorded as sheikh of Kahlan and lord of Hamdan in his time, with the full name al-Da'am ibn Ibrahim ibn Abd Allah ibn Yas al-Arhabi as an alias; the item gives no birth date."
