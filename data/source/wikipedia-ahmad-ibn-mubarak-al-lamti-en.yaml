reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It calls him a Moroccan Islamic scholar of the Maliki school from Sijilmasa, born in 1679, moved with his family to Fez in 1698, where he studied at al-Qarawiyyin, adopted the Maliki school and received an ijaza, then became a disciple and close companion of Abd al-Aziz al-Dabbagh and compiled his lectures into the al-Ibriz after al-Dabbagh’s death in 1718–1719. It dates his own death to 1742, where the Arabic biographical article gives 1156 AH / 1743; both readings are preserved in the person record. Checked 1 November 2026."
