summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن غيتا ويرجاوان ⁦(وُلد في ٢١ أيلول ١٩٦٥ في جاكرتا)⁩، رجل الأعمال الإندونيسي ووزير التجارة الأسبق؛ تذكر نشأته ودراسته في تكساس وبايلور وهارفارد، ومسيرته المصرفية في سيتي بنك وغولدمان ساكس وجيه بي مورغان، وتأسيسه مجموعة أنكورا، ورئاسته هيئة تنسيق الاستثمار ثم وزارة التجارة وترؤسه مؤتمر منظمة التجارة العالمية في بالي ٢٠١٣، ورئاسته اتحاد كرة الريشة، وبودكاست «إندغيم» وأعماله الخيرية في التعليم."
  en: "English Wikipedia article on Gita Wirjawan (born 21 September 1965 in Jakarta), Indonesian entrepreneur and former Minister of Trade; it records his upbringing and studies at Texas, Baylor and Harvard, his banking career at Citibank, Goldman Sachs and JP Morgan, his founding of the Ancora Group, his chairmanship of the Investment Coordinating Board and the trade ministry, his chairing of the 2013 WTO Ministerial Conference in Bali, his headship of the Badminton Association of Indonesia, the Endgame podcast and his education philanthropy."
  es: "Artículo de la Wikipedia en inglés sobre Gita Wirjawan (nacido el 21 de septiembre de 1965 en Yakarta), empresario indonesio y exministro de Comercio; en él se recogen su infancia y sus estudios en Texas, Baylor y Harvard, su carrera bancaria en Citibank, Goldman Sachs y JP Morgan, la fundación del Grupo Ancora, su presidencia del Consejo Coordinador de Inversiones y del Ministerio de Comercio, su presidencia de la Conferencia Ministerial de la OMC de 2013 en Bali, su dirección de la Asociación de Bádminton de Indonesia, el podcast Endgame y su filantropía en el ámbito de la educación."
  fr: "L'article de Wikipédia en anglais sur Gita Wirjawan (né le 21 septembre 1965 à Jakarta), entrepreneur indonésien et ancien ministre du Commerce, retrace son enfance et ses études au Texas, à Baylor et à Harvard, sa carrière bancaire chez Citibank, Goldman Sachs et JP Morgan, la fondation du groupe Ancora, sa présidence du Conseil de coordination des investissements et du ministère du Commerce, sa présidence de la Conférence ministérielle de l'OMC de 2013 à Bali, sa direction de la Fédération indonésienne de badminton, le podcast Endgame et son engagement philanthropique dans le domaine de l'éducation."
  ur: "گیتا ویرجاوان ⁦(پیدائش 21 ستمبر 1965 جکارتہ)⁩ پر انگریزی ویکیپیڈیا مضمون، انڈونیشیائی کاروباری اور سابق وزیر تجارت؛ اس میں ٹیکساس، بیلر اور ہارورڈ میں ان کی پرورش اور تعلیم، سٹی بینک، گولڈمین سیکس اور جے پی مورگن میں ان کا بینکنگ کیریئر، انکورا گروپ کی بانی، انویسٹمنٹ کوآرڈینیٹنگ بورڈ اور وزارت تجارت کی ان کی چیئرمین شپ، بالی میں 2013 کی ڈبلیو ٹی او کی وزارتی کانفرنس کی صدارت، انڈونیمیا کی ایسوسی ایشن کی سربراہی، انڈونیمیا میں ان کی زیر صدارت پوڈ کاسٹ اور اس کی تعلیم کی انسان دوستی۔"
