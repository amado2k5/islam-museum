summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن غيتا ويرجاوان (وُلد في ٢١ أيلول ١٩٦٥ في جاكرتا)، رجل الأعمال الإندونيسي ووزير التجارة الأسبق؛ تذكر نشأته ودراسته في تكساس وبايلور وهارفارد، ومسيرته المصرفية في سيتي بنك وغولدمان ساكس وجيه بي مورغان، وتأسيسه مجموعة أنكورا، ورئاسته هيئة تنسيق الاستثمار ثم وزارة التجارة وترؤسه مؤتمر منظمة التجارة العالمية في بالي ٢٠١٣، ورئاسته اتحاد كرة الريشة، وبودكاست «إندغيم» وأعماله الخيرية في التعليم."
  en: "English Wikipedia article on Gita Wirjawan (born 21 September 1965 in Jakarta), Indonesian entrepreneur and former Minister of Trade; it records his upbringing and studies at Texas, Baylor and Harvard, his banking career at Citibank, Goldman Sachs and JP Morgan, his founding of the Ancora Group, his chairmanship of the Investment Coordinating Board and the trade ministry, his chairing of the 2013 WTO Ministerial Conference in Bali, his headship of the Badminton Association of Indonesia, the Endgame podcast and his education philanthropy."
