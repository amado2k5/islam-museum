summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيمي شيلت؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه سيم شيلت وميلاده في روتردام في 27 أكتوبر 1973، وبطولاته الأربع في كي-وان وبطولة غلوري 2012، واعتزاله سنة 2013 بسبب حالة في القلب. ولا تذكر ديانته."
  en: "English Wikipedia article on Semmy Schilt; used for entity facts only. It gives his name Sem Schilt, his birth in Rotterdam on 27 October 1973, his four K-1 World Grand Prix championships and 2012 Glory Heavyweight Grand Slam title, and his 2013 retirement because of a heart condition. It makes no statement of his religion."
  es: "Artículo de la Wikipedia en inglés sobre Semmy Schilt; utilizado únicamente para obtener información sobre la persona. Menciona su nombre, Sem Schilt, su nacimiento en Rotterdam el 27 de octubre de 1973, sus cuatro campeonatos mundiales del K-1 Grand Prix y su título del Glory Heavyweight Grand Slam de 2012, así como su retiro en 2013 debido a una afección cardíaca. No se menciona su religión."
  fr: "Article Wikipédia en anglais sur Semmy Schilt; utilisé uniquement pour les informations le concernant. Il mentionne son nom, Sem Schilt, sa naissance à Rotterdam le 27 octobre 1973, ses quatre titres de champion du monde de K-1 et son titre de champion du Glory Heavyweight Grand Slam en 2012, ainsi que sa retraite en 2013 pour raisons cardiaques. Sa religion n'est pas précisée."
  ur: "سیمی شلٹ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کا نام سیم شلٹ، 27 اکتوبر 1973 کو روٹرڈیم میں اس کی پیدائش، اس کی چار K-1 ورلڈ گراں پری چیمپئن شپ اور 2012 گلوری ہیوی ویٹ گرینڈ سلیم ٹائٹل، اور دل کی بیماری کی وجہ سے اس کی 2013 کی ریٹائرمنٹ بتائی گئی ہے۔ اس میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Simi Schilt hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Adı Sim Schilt olarak verilmiştir, 27 Ekim 1973'te Rotterdam'da doğmuş, dört K-1 şampiyonluğu ve 2012 Glory Şampiyonluğu ile 2013'te kalp rahatsızlığı nedeniyle emekli olmuştur. Dini belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Simi Schilt; digunakan hanya untuk fakta entitas tersebut. Artikel ini mencantumkan namanya sebagai Sim Schilt, kelahirannya di Rotterdam pada 27 Oktober 1973, empat kejuaraan K-1 dan Kejuaraan Kemuliaan 2012, serta pensiunnya pada 2013 karena kondisi jantung. Agamanya tidak disebutkan."
