summary:
  ar: "حلقة «أون بيئينغ» مع رامي النشاشيبي؛ يؤكد فيها أنه وُلد في الأردن وأن أباه كان دبلوماسيًا وأنه نشأ في بيت مسلم غير متدين — خلفية أسرية، لا إثبات مذهب له."
  en: "On Being programme with Rami Nashashibi; in it he confirms he was born in Jordan, that his father was a diplomat, and that he was raised in an areligious Muslim home — family background, not a school attestation for him."
  es: "En el programa \"On Being\" con Rami Nashashibi, confirma que nació en Jordania, que su padre era diplomático y que se crio en un hogar musulmán no religioso; antecedentes familiares, no una certificación escolar."
  fr: "Dans l'émission On Being avec Rami Nashashibi, il confirme être né en Jordanie, que son père était diplomate et qu'il a été élevé dans un foyer musulman non religieux — un contexte familial, et non une attestation scolaire."
  ur: "رامی ناشاشیبی کے ساتھ پروگرام پر؛ اس میں وہ تصدیق کرتا ہے کہ وہ اردن میں پیدا ہوا تھا، کہ اس کے والد ایک سفارت کار تھے، اور یہ کہ ان کی پرورش ایک مذہبی مسلم گھر میں ہوئی تھی - خاندانی پس منظر، اس کے لیے اسکول کی تصدیق نہیں۔"
  tr: "Rami Al-Nashashibi ile \"Satın Alma Üzerine\" adlı bölüm; burada Ürdün'de doğduğunu, babasının diplomat olduğunu ve mezhebinin kanıtı olmayan dini olmayan bir Müslüman ailede büyüdüğünü doğrular."
  id: "Episode \"On Buying\" bersama Rami Al-Nashashibi; di mana ia mengonfirmasi bahwa ia lahir di Yordania, bahwa ayahnya adalah diplomat, dan bahwa ia tumbuh di keluarga Muslim non-religius—keluarga tanpa bukti sektenya."
