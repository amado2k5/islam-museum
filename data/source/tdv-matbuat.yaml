label:
  ar: "المطبوعات — موسوعة TDV الإسلامية ⁦(أرول أيلدز وعلم قهرمان وتحسين يازجي)⁩"
  en: "MATBUAT (the press) — TDV İslâm Ansiklopedisi (Erol Ayyıldız, Alim Kahraman, Tahsin Yazıcı)"
summary:
  ar: "مدخل «المطبوعات» في موسوعة TDV الإسلامية بثلاثة أقسام: قسم أرول أيلدز في تاريخ الصحافة العربية من «الوقائع المصرية» ⁦(1828)⁩ و«حديقة الأخبار» ⁦(1858)⁩ و«الجوائب» ⁦(1860)⁩ و«الأهرام» ⁦(1875)⁩ ومصطلحات الصحيفة والصحافة والجريدة والمجلة، وقسما الأدب التركي والفارسي في المطبوعات."
  en: "The TDV İslâm Ansiklopedisi entry on the press, in three sections: Erol Ayyıldız's history of the Arabic press from al-Waqa'i' al-Misriyya (1828), Hadiqat al-akhbar (1858), al-Jawa'ib (1860) and al-Ahram (1875) with the coinage of the terms sahifa, sihafa, jarida and majalla; and the Turkish and Persian literature sections."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre la prensa, en tres secciones: la historia de la prensa árabe de Erol Ayyıldız desde al-Waqa'i' al-Misriyya (1828), Hadiqat al-akhbar (1858), al-Jawa'ib (1860) y al-Ahram (1875) con la creación de los términos sahifa, sihafa, jarida y majalla; y las secciones de literatura turca y persa."
  fr: "L'entrée de TDV İslâm Ansiklopedisi sur la presse, en trois sections: l'histoire de la presse arabe par Erol Ayyıldız à partir d'al-Waqa'i' al-Misriyya (1828), Hadiqat al-akhbar (1858), al-Jawa'ib (1860) et al-Ahram (1875) avec la création des termes sahifa, sihafa, jarida et majalla; et les sections sur la littérature turque et persane."
  ur: "پریس پر TDV İslâm Ansiklopedisi کا اندراج، تین حصوں میں: Erol Ayıldız کی عربی پریس کی تاریخ الوقائع المصریہ (1828)، حدیقۃ الاخبار (1858)، الجوائب (1860) کی اصطلاح (1860) اور الاحرام کے ساتھ۔ صحیفہ، صحیفہ، جریدہ اور مجلہ؛ اور ترکی اور فارسی ادب کے حصے۔"
  tr: "TDV İslami Ansiklopedisi'ndeki \"Yayınlar\" başlığı üç bölüme ayrılmıştır: Arol Ayldez'in Arap basınının tarihi bölümü, \"Mısır Kronikleri\" (1828), \"Haber Bahçesi\" (1858), \"El-Cevaib\" (1860) ve \"El-Ahram\" (1875) ile gazeteler, basın, gazete ve dergi terminolojisi; ve basılı materyallerdeki Türk ve Fars edebiyatı bölümleri."
  id: "Entri tentang \"Publikasi\" dalam Ensiklopedia Islam TDV dibagi menjadi tiga bagian: bagian oleh Arol Ayldez tentang sejarah pers Arab dari \"Kronik Mesir\" (1828), \"Taman Berita\" (1858), \"Al-Jawa'ib\" (1860), dan \"Al-Ahram\" (1875), serta terminologi surat kabar, pers, surat kabar, dan majalah; serta bagian tentang sastra Turki dan Persia dalam bahan cetak."
