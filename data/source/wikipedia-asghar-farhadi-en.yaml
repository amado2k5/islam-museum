reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Its infobox gives Asghar Farhadi, born 7 May 1972 in Homayoon Shahr (now Khomeyni Shahr), Isfahan province, educated at the University of Tehran and Tarbiat Modares University, spouse Parisa Bakhtavar (m. 1990) and two children including Sarina Farhadi; its text records his joining the Isfahan branch of the Iranian Youth Cinema Society at 15, his BA in dramatic arts and MA in stage direction, his early work for IRIB, his feature debut Dancing in the Dust (2003), About Elly (2009, Silver Bear for Best Director), A Separation (2011, Golden Bear and Academy Award for Best International Feature Film — the first Iranian film to win it), The Past (2013), The Salesman (2016, Cannes Best Screenplay and his second Academy Award), his refusal to attend the 2017 Academy Awards over the United States entry ban on Iranians and the statement read for him by Anousheh Ansari, Everybody Knows (2018) and A Hero (2021, Cannes Grand Prix). Its account of the plagiarism case records that The Hollywood Reporter mistakenly reported a guilty verdict in April 2022 when he had in fact been indicted, on Azadeh Masihzadeh's allegation that A Hero took its premise from her documentary, and that in March 2024 an Iranian court acquitted him, based on review by University of Tehran copyright experts and other experts. No religion is named anywhere in the article, which is why his person record's faith segment is unknown."
