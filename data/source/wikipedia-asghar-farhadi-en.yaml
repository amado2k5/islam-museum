summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أصغر فرهادي؛ تُستخدم لوقائع الكيان فقط. توثّق ميلاده في 7 مايو 1972 في همايون شهر قرب أصفهان، ودراسته المسرح في طهران، وأفلامه من «الرقص في الغبار» إلى «بطل»، وجائزتي الأوسكار عن «انفصال» و«البائع»، ومقاطعته أوسكار 2017، وقضية الانتحال في «بطل» وبراءته منها سنة 2024. لا تذكر المقالة أي دين له."
  en: "English Wikipedia article on Asghar Farhadi; used for entity facts only. It records his birth on 7 May 1972 in Homayoon Shahr near Isfahan, his theatre studies in Tehran, his films from Dancing in the Dust to A Hero, his two Academy Awards for A Separation and The Salesman, his boycott of the 2017 Academy Awards, and the A Hero plagiarism case ending in his acquittal in March 2024. The article names no religion for him."
