reliability_note: "A Bengali news report, read in full on 5 November 2026. It quotes the remark as made on Monday 19 October 2026 at the annual waz mahfil of Nishchintapur Hafizia Madrasa in Matlab, Chandpur, in the context of press coverage of a former state minister's anti-drug raid; records criticism from the fact-checking editor Qadruddin Shishir, the former National Press Club general secretary Elias Khan, Dhaka University professors Sajjad Siddiqui and Abul Mansur Ahmed, and the scholar Khalilur Rahman Madani; and quotes Abbasi's clarification the next day at a mahfil in Uttarkhan, Dhaka, that he had abused only 'yellow journalists' who take money to turn heroes into zeroes, not journalists as a whole. The quotations and attributions are the paper's reporting and are used as such."
