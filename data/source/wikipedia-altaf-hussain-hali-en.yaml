reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The article rests chiefly on Syeda Saiyidain Hameed's introduction to her edition of Hali's Musaddas (HarperCollins, 2003), on Dawn newspaper and on APNA/Rekhta materials. It covers his Panipat Ansari family and claimed descent from Abu Ayyub al-Ansari, his teachers in Panipat and Delhi, Ghalib's encouragement, his tutorship of Nawab Mustafa Khan Shefta's children (1863, eight years), the Lahore Government Book Depot (1871–1874), the Muqaddama-e-Shair-o-Shairi (introduction to his Divan, 1890; separately 1893), the Anglo Arabic School in Delhi (1874–1889), the Musaddas of 1879 and Sir Syed's letter of praise, Hayat-e-Javed (1901), his return to Panipat in 1889 and his death there on 31 December 1914, and Pakistan Post's commemorative stamp of 23 March 1979. It gives his birth year only, with no month or day."
