  ar: "مقالة ويكيبيديا الإنجليزية عن ألطاف حسين حالي؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في بانيبات سنة 1837 ووفاته فيها في 31 ديسمبر 1914، ودراسته في دلهي، وعمله في لاهور ودلهي، وتأليفه «المسدس» سنة 1879 بطلب من سيد أحمد خان، وسِيَره لغالب وسعدي وسيد أحمد خان."
  en: "English Wikipedia article on Altaf Hussain Hali; used for entity facts only. It records his birth at Panipat in 1837 and death there on 31 December 1914, his studies in Delhi, his posts in Lahore and Delhi, the composition of the Musaddas in 1879 at Sir Syed Ahmad Khan's urging, and his biographies of Ghalib, Saadi and Sir Syed."
