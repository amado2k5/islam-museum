  ar: "مقالة ويكيبيديا الإنجليزية عن أغوس سوبيانتو ⁦(وُلد في ٥ آب ١٩٦٧ في تشيماهي)⁩، الجنرال الإندونيسي الذي أصبح قائد القوات المسلحة الوطنية في تشرين الثاني ٢٠٢٣ بعد توليه رئاسة أركان الجيش؛ تذكر خدمته في القوات الخاصة وانتشاره في تيمور الشرقية وقياداته وحياته الأسرية والموسيقية، ولا تسمي له دينًا."
  en: "English Wikipedia article on Agus Subiyanto (born 5 August 1967 in Cimahi), Indonesian general who became Commander of the Indonesian National Armed Forces in November 2023 after serving as Chief of Staff of the Army; it records his Kopassus service, his East Timor deployment, his commands and his family and musical life, and names no faith for him."
