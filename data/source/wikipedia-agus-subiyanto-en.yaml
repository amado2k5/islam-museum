summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أغوس سوبيانتو ⁦(وُلد في ٥ آب ١٩٦٧ في تشيماهي)⁩، الجنرال الإندونيسي الذي أصبح قائد القوات المسلحة الوطنية في تشرين الثاني ٢٠٢٣ بعد توليه رئاسة أركان الجيش؛ تذكر خدمته في القوات الخاصة وانتشاره في تيمور الشرقية وقياداته وحياته الأسرية والموسيقية، ولا تسمي له دينًا."
  en: "English Wikipedia article on Agus Subiyanto (born 5 August 1967 in Cimahi), Indonesian general who became Commander of the Indonesian National Armed Forces in November 2023 after serving as Chief of Staff of the Army; it records his Kopassus service, his East Timor deployment, his commands and his family and musical life, and names no faith for him."
  es: "Artículo de la Wikipedia en inglés sobre Agus Subiyanto (nacido el 5 de agosto de 1967 en Cimahi), general indonesio que se convirtió en Comandante de las Fuerzas Armadas Nacionales de Indonesia en noviembre de 2023 después de servir como Jefe de Estado Mayor del Ejército; registra su servicio en Kopassus, su despliegue en Timor Oriental, sus mandos y su vida familiar y musical, y no menciona ninguna religión para él."
  fr: "L'article de Wikipédia en anglais sur Agus Subiyanto (né le 5 août 1967 à Cimahi), général indonésien devenu commandant des forces armées nationales indonésiennes en novembre 2023 après avoir été chef d'état-major de l'armée; il relate son service au Kopassus, son déploiement au Timor oriental, ses commandements et sa vie familiale et musicale, et ne mentionne aucune religion à son sujet."
  ur: "Agus Subianto ⁦(پیدائش 5 اگست 1967 Cimahi)⁩ پر انگریزی ویکیپیڈیا کا مضمون، انڈونیشین جنرل جو آرمی کے چیف آف اسٹاف کے طور پر خدمات انجام دینے کے بعد نومبر 2023 میں انڈونیشیائی نیشنل آرمڈ فورسز کے کمانڈر بنے؛ اس میں اس کی کوپاسس سروس، اس کی مشرقی تیمور کی تعیناتی، اس کے احکام اور اس کی خاندانی اور موسیقی کی زندگی کو ریکارڈ کیا گیا ہے، اور اس کے لیے کوئی عقیدہ نہیں ہے۔"
