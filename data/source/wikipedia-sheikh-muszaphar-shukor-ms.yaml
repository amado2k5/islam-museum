summary:
  ar: "مقالة ويكيبيديا الملايوية عن شيخ مظفر شكور، مراجعة 28 فبراير 2026؛ تُستخدم لوقائع الكيان فقط. تضيف تفاصيل الاختيار من بين 11,275 متقدما وبنود دليل العبادة في الفضاء وحياته الشخصية، وتصفه بأنه جراح عظام بينما تذكر الإنجليزية أنه لم يكمل تخصصه."
  en: "Malay Wikipedia article on Sheikh Muszaphar Shukor, revision of 28 February 2026; used for entity facts only. It adds the selection from 11,275 applicants, details of the worship-in-space guidelines and personal-life details, and calls him an orthopaedic surgeon where the English article says he never completed his specialisation."
  es: "Artículo de Wikipedia en malayo sobre el jeque Muszaphar Shukor, revisado el 28 de febrero de 2026; utilizado únicamente para datos sobre la persona. Añade la selección entre 11.275 solicitantes, detalles sobre las directrices para el culto en espacios públicos y detalles de su vida personal, y lo describe como cirujano ortopédico, mientras que el artículo en inglés afirma que nunca completó su especialización."
  fr: "Article malais de Wikipédia sur Cheikh Muszaphar Shukor, mis à jour le 28 février 2026; utilisé uniquement pour les informations relatives à l’entité. Il précise sa sélection parmi 11 275 candidats, les directives concernant le culte dans l’espace et des détails sur sa vie personnelle, et le qualifie de chirurgien orthopédiste alors que l’article anglais indique qu’il n’a jamais terminé sa spécialisation."
  ur: "شیخ مصظفر شکور پر مالائی ویکیپیڈیا کا مضمون، 28 فروری 2026 کی نظر ثانی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 11,275 درخواست دہندگان سے انتخاب شامل کیا گیا ہے، عبادت کی جگہ کے رہنما خطوط کی تفصیلات اور ذاتی زندگی کی تفصیلات، اور اسے آرتھوپیڈک سرجن کہا گیا ہے جہاں انگریزی مضمون میں کہا گیا ہے کہ اس نے کبھی اپنی مہارت مکمل نہیں کی۔"
  tr: "Şeyh Muzafar Shakur hakkında Malayca Vikipedi makalesi, revizyon 28 Şubat 2026; yalnızca varlık bilgileri için kullanılmıştır. 11.275 başvuru arasından seçim detayları arasında Uzay İbadeti Rehberi'nden ve kişisel hayatından maddeler yer almakta olup, onu ortopedi cerrahı olarak tanımlarken, İngilizce olarak uzmanlık alanını tamamlamadığını belirtmektedir."
  id: "Artikel Wikipedia Bahasa Melayu tentang Sheikh Muzafar Shakur, revisi 28 Februari 2026; hanya digunakan untuk fakta entitas. Rincian seleksi dari 11.275 pelamar mencakup item dari Space Worship Guide dan kehidupan pribadinya, yang menggambarkannya sebagai ahli bedah ortopedi sambil menyebutkan dalam bahasa Inggris bahwa ia tidak menyelesaikan spesialisasinya."
