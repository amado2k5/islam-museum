  ur: "ایک صفحہ جو عجائب گھر کو دیے گئے تحقیقی خلاصے میں مذکور ہے اور جسے بانی نے 21 نومبر 2026 کو منظور کیا؛ صفحہ کھولا نہیں گیا، اور صفحات کے نمبر خلاصے کے ہیں اور جانچے نہیں گئے۔ ناشر: Dar al-Ifta al-Misriyya۔ اس سے استناد ان امور کے لیے ہے: نماز میں قرآن کو غیر عربی میں پڑھنے کے بارے میں مذاہب کے اقوال۔"
  fr: "Page citée dans un résumé de recherche remis au musée et approuvé par le fondateur le 21 novembre 2026 ; la page n'a pas été ouverte, et les numéros de page sont ceux du résumé, non vérifiés. Éditeur : Dar al-Ifta al-Misriyya. Utilisée pour : les positions sur la récitation du Coran dans une langue autre que l'arabe dans la prière."
  es: "Página citada en un resumen de investigación entregado al museo y aprobado por el fundador el 21 de noviembre de 2026; la página no se abrió, y los números de página son los del resumen, sin comprobar. Editor: Dar al-Ifta al-Misriyya. Usada para: las posiciones sobre recitar el Corán en una lengua distinta del árabe en la oración."
