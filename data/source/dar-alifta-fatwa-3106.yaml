summary:
  ar: "صفحة وردت في ملخص بحثي قُدِّم إلى المتحف واعتمده المؤسس في 21 نوفمبر 2026؛ لم تُفتح الصفحة، وأرقام الصفحات المذكورة هي ما في الملخص ولم يُتحقق منها. ناشرها: Dar al-Ifta al-Misriyya. يُستند إليها في: أحكام قراءة القرآن بغير العربية في الصلاة عند المذاهب."
