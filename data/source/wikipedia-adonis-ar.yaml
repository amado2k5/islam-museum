summary:
  ar: "مقالة ويكيبيديا العربية الموسّعة عن أدونيس؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 1 يناير 1930 في قرية قصابين، وتفصّل سيرته وأعماله ومجلتيه، وتحمل في قسم حياته الشخصية وصفه نفسه بأنه «صوفي وثني» مترجمًا عن المصدر نفسه الذي تحمله المقالة الإنجليزية، وفيها أقسام عن آرائه في السلفية الوهابية وعن قضايا جدلية كطرده من اتحاد الكتاب العرب والتهديدات بقتله ودعوات حرق كتبه، ولا تنسب إليه ديانة شخصية."
  en: "The long Arabic Wikipedia article on Adonis; used for entity facts only. It gives his birth on 1 January 1930 at the village of Qassabin and details his life, works and magazines. Its personal-life section carries his self-description as a 'pagan mystic' in translation from the same source carried by the English article (one family, not two). It has sections on his views on Salafi-Wahhabism and on controversies — expulsion from the Arab Writers Union, death threats, calls to burn his books — and attributes no personal religion to him."
