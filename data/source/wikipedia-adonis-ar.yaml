summary:
  ar: "مقالة ويكيبيديا العربية الموسّعة عن أدونيس؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 1 يناير 1930 في قرية قصابين، وتفصّل سيرته وأعماله ومجلتيه، وتحمل في قسم حياته الشخصية وصفه نفسه بأنه «صوفي وثني» مترجمًا عن المصدر نفسه الذي تحمله المقالة الإنجليزية، وفيها أقسام عن آرائه في السلفية الوهابية وعن قضايا جدلية كطرده من اتحاد الكتاب العرب والتهديدات بقتله ودعوات حرق كتبه، ولا تنسب إليه ديانة شخصية."
  en: "The long Arabic Wikipedia article on Adonis; used for entity facts only. It gives his birth on 1 January 1930 at the village of Qassabin and details his life, works and magazines. Its personal-life section carries his self-description as a 'pagan mystic' in translation from the same source carried by the English article (one family, not two). It has sections on his views on Salafi-Wahhabism and on controversies — expulsion from the Arab Writers Union, death threats, calls to burn his books — and attributes no personal religion to him."
  es: "El extenso artículo de Wikipedia en árabe sobre Adonis se utiliza únicamente para datos biográficos. Indica su nacimiento el 1 de enero de 1930 en la aldea de Qassabin y detalla su vida, obras y revistas. En la sección sobre su vida personal, se describe a sí mismo como un «místico pagano», traducción de la misma fuente que el artículo en inglés (una sola familia, no dos). Incluye secciones sobre sus opiniones acerca del salafismo-wahabismo y sobre controversias —como su expulsión de la Unión de Escritores Árabes, amenazas de muerte y llamamientos a quemar sus libros— y no le atribuye ninguna religión personal."
  fr: "Le long article de Wikipédia en arabe consacré à Adonis; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 1er janvier 1930 au village de Qassabin et détaille sa vie, ses œuvres et ses publications. La section consacrée à sa vie personnelle reprend sa description de « mystique païen », traduction de la même source que l’article en anglais (une seule famille, et non deux). On y trouve des sections sur ses opinions concernant le salafisme-wahhabisme et les controverses – exclusion de l’Union des écrivains arabes, menaces de mort, appels à brûler ses livres – et aucune mention de sa religion personnelle ne lui est attribuée."
