reliability_note: "Independent encyclopedia attestation, alongside English Wikipedia, that Salam was a member of the Ahmadiyya community: it states he lived in exile after 1974 'in protest against a 1974 Pakistani law that defined Ahmadis (the religious group of which he was a member) as non-Muslims'. Also used for the Cambridge PhD (1952), the Lahore teaching years, the Imperial College professorship and the 1964/1983 Trieste foundings. Read as opened on 26 Oct 2026."
