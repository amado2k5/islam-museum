summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تونكو عبد الرحمن (1903–1990)؛ تُستخدم لوقائع الكيان فقط. سيرة مفصّلة تروي مولده في ألور ستر بقدح في 8 فبراير 1903 أميرا ابن سلطانها، ودراسته في كمبريدج، وقيادته حزب أمنو وتحالف الاستقلال، وإعلانه استقلال مالايا سنة 1957 أولَ رئيس وزراء، وتشكيله ماليزيا سنة 1963، ووفاته في كوالالمبور في 6 ديسمبر 1990."
  en: "English Wikipedia article on Tunku Abdul Rahman (1903–1990); used for entity facts only. A detailed biography recounting his birth at Alor Setar, Kedah, on 8 February 1903 as a son of its sultan, his Cambridge studies, his leadership of UMNO and the independence Alliance, his proclamation of Malaya's independence in 1957 as its first prime minister, his formation of Malaysia in 1963, and his death at Kuala Lumpur on 6 December 1990."
  es: "Artículo de la Wikipedia en inglés sobre Tunku Abdul Rahman (1903-1990); utilizado únicamente para datos sobre la persona. Una biografía detallada que relata su nacimiento en Alor Setar, Kedah, el 8 de febrero de 1903, como hijo del sultán, sus estudios en Cambridge, su liderazgo de la UMNO y la Alianza por la Independencia, su proclamación de la independencia de Malasia en 1957 como su primer ministro, la formación de Malasia en 1963 y su fallecimiento en Kuala Lumpur el 6 de diciembre de 1990."
  fr: "Article de Wikipédia en anglais sur Tunku Abdul Rahman (1903-1990); utilisé uniquement à des fins d'information sur l'entité. Biographie détaillée retraçant sa naissance à Alor Setar, Kedah, le 8 février 1903, fils du sultan, ses études à Cambridge, son rôle à la tête de l'UMNO et de l'Alliance pour l'indépendance, la proclamation de l'indépendance de la Malaisie en 1957 en tant que premier ministre, la formation de la Malaisie en 1963 et sa mort à Kuala Lumpur le 6 décembre 1990."
  ur: "ٹنکو عبدالرحمن (1903–1990) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک تفصیلی سوانح عمری جس میں 8 فروری 1903 کو الور سیٹار، کیداہ میں اس کی پیدائش، اس کے سلطان کے بیٹے کے طور پر، اس کی کیمبرج کی تعلیم، اس کی UMNO اور آزادی اتحاد کی قیادت، 1957 میں اس کے پہلے وزیر اعظم کے طور پر ملایا کی آزادی کا اعلان، اس کی موت 1963 کو ملیا پور میں ہوئی، اور ان کی موت 1963 میں ملیا میں ہوئی۔ دسمبر 1990۔"
  tr: "Tunku Abdul Rahman (1903–1990) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Detaylı bir biyografi, 8 Şubat 1903'te Babah'ın Alor Sattar kentinde Sultanının prens oğlu olarak doğmasını, Cambridge'deki eğitimini, Umno Partisi ve Bağımsızlık İttifakı'nın liderliğini, 1957'de ilk başbakan olarak Malaya bağımsızlığını ilan etmesini, 1963'te Malezya'nın kurulmasını ve 6 Aralık 1990'da Kuala Lumpur'da vefatını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Tunku Abdul Rahman (1903–1990); digunakan hanya untuk fakta entitas. Biografi rinci menceritakan kelahirannya di Alor Sattar, Badah pada 8 Februari 1903, sebagai putra pangeran Sultan, studinya di Cambridge, kepemimpinannya di Partai Umno dan Aliansi Kemerdekaan, deklarasi kemerdekaan Malaya pada 1957 sebagai Perdana Menteri pertama, pembentukan Malaysia pada 1963, dan kematiannya di Kuala Lumpur pada 6 Desember 1990."
