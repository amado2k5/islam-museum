  ar: "مقالة ويكيبيديا الإنجليزية عن تونكو عبد الرحمن (1903–1990)؛ تُستخدم لوقائع الكيان فقط. سيرة مفصّلة تروي مولده في ألور ستر بقدح في 8 فبراير 1903 أميرا ابن سلطانها، ودراسته في كمبريدج، وقيادته حزب أمنو وتحالف الاستقلال، وإعلانه استقلال مالايا سنة 1957 أولَ رئيس وزراء، وتشكيله ماليزيا سنة 1963، ووفاته في كوالالمبور في 6 ديسمبر 1990."
  en: "English Wikipedia article on Tunku Abdul Rahman (1903–1990); used for entity facts only. A detailed biography recounting his birth at Alor Setar, Kedah, on 8 February 1903 as a son of its sultan, his Cambridge studies, his leadership of UMNO and the independence Alliance, his proclamation of Malaya's independence in 1957 as its first prime minister, his formation of Malaysia in 1963, and his death at Kuala Lumpur on 6 December 1990."
