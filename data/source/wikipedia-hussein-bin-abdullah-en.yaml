summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الحسين بن عبد الله الثاني، ولي عهد الأردن؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في عمّان في 28 يونيو 1994، وتعليمه في الأردن وجامعة جورجتاون وتخرّجه في ساندهيرست سنة 2017، وصيرورته وريثًا ظاهرًا سنة 2004 ووليًا للعهد رسميًا سنة 2009، ومهامّه الرسمية ومؤسسة ولي العهد، وزواجه سنة 2023. يقرأ حقل الدين في صندوق معلوماتها «الإسلام السنّي»، أما نصها فلا يسمّي له مذهبًا."
  en: "English Wikipedia article on Hussein bin Abdullah, Crown Prince of Jordan; used for entity facts only. It recounts his birth in Amman on 28 June 1994, his schooling in Jordan, his Georgetown degree and his 2017 graduation from Sandhurst, his becoming heir apparent in 2004 and formally Crown Prince in 2009, his official duties and the Crown Prince Foundation, and his 2023 marriage. Its infobox religion field reads Sunni Islam; its text names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Hussein bin Abdullah, príncipe heredero de Jordania; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Amán el 28 de junio de 1994, su educación en Jordania, su título de Georgetown y su graduación de Sandhurst en 2017, su designación como heredero al trono en 2004 y formalmente como príncipe heredero en 2009, sus funciones oficiales y la Fundación del Príncipe Heredero, y su matrimonio en 2023. El campo de religión en su ficha informativa indica Islam sunita; el texto no menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en anglais sur Hussein bin Abdullah, prince héritier de Jordanie; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Amman le 28 juin 1994, sa scolarité en Jordanie, son diplôme de Georgetown et son diplôme de Sandhurst en 2017, sa désignation comme prince héritier en 2004 et officiellement prince héritier en 2009, ses fonctions officielles et la Fondation du prince héritier, ainsi que son mariage en 2023. L'infobox « Religion » indique « Islam sunnite »; le texte ne mentionne aucune école."
  ur: "حسین بن عبداللہ، اردن کے ولی عہد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 28 جون 1994 کو عمان میں اس کی پیدائش، اردن میں اس کی اسکولنگ، اس کی جارج ٹاؤن کی ڈگری اور سینڈہرسٹ سے اس کی 2017 کی گریجویشن، 2004 میں اس کے ظاہری وارث بننے اور 2009 میں رسمی طور پر ولی عہد بننے، اس کے سرکاری فرائض اور کراؤن پرنس فاؤنڈیشن، اور اس کی 2023 کی شادی کا ذکر ہے۔ اس کا infobox مذہب کا میدان سنی اسلام پڑھتا ہے؛ اس کا متن اس کے لیے کسی اسکول کا نام نہیں رکھتا۔"
