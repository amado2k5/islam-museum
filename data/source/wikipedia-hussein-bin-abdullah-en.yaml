  ar: "مقالة ويكيبيديا الإنجليزية عن الحسين بن عبد الله الثاني، ولي عهد الأردن؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في عمّان في 28 يونيو 1994، وتعليمه في الأردن وجامعة جورجتاون وتخرّجه في ساندهيرست سنة 2017، وصيرورته وريثًا ظاهرًا سنة 2004 ووليًا للعهد رسميًا سنة 2009، ومهامّه الرسمية ومؤسسة ولي العهد، وزواجه سنة 2023. يقرأ حقل الدين في صندوق معلوماتها «الإسلام السنّي»، أما نصها فلا يسمّي له مذهبًا."
  en: "English Wikipedia article on Hussein bin Abdullah, Crown Prince of Jordan; used for entity facts only. It recounts his birth in Amman on 28 June 1994, his schooling in Jordan, his Georgetown degree and his 2017 graduation from Sandhurst, his becoming heir apparent in 2004 and formally Crown Prince in 2009, his official duties and the Crown Prince Foundation, and his 2023 marriage. Its infobox religion field reads Sunni Islam; its text names no school for him."
