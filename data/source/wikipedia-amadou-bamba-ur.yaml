summary:
  ar: "مقالة ويكيبيديا الأردية عن الشيخ أحمد بمبا مباكي (1853-1927)؛ تُستخدم لوقائع الكيان فقط. هي ترجمة للمقالة العربية في معظمها، وتشاركها وقائعها: تأسيس الطريقة المريدية ومدينة طوبى سنة 1887 والنفي إلى الغابون سنة 1895."
  en: "Urdu Wikipedia article on Shaykh Ahmadou Bamba Mbacké (1853–1927); used for entity facts only. It is in most respects a translation of the Arabic article and shares its facts: the founding of the Muridiyya order and of Touba in 1887, and the exile to Gabon in 1895."
  es: "Artículo de Wikipedia en urdu sobre Shaykh Ahmadou Bamba Mbacké (1853-1927); se utiliza únicamente para datos sobre la persona. En la mayoría de los aspectos, es una traducción del artículo en árabe y comparte sus datos: la fundación de la orden Muridiyya y de Touba en 1887, y el exilio a Gabón en 1895."
  fr: "Article de Wikipédia en ourdou sur le cheikh Ahmadou Bamba Mbacké (1853-1927); utilisé uniquement pour les informations sur l’entité. Il s’agit, à bien des égards, d’une traduction de l’article arabe et il en reprend les faits: la fondation de l’ordre des Muridiyya et de Touba en 1887, et l’exil au Gabon en 1895."
  ur: "اردو ویکیپیڈیا مضمون پر شیخ احمدو بامبا Mbacké (1853–1927)؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ زیادہ تر لحاظ سے عربی مضمون کا ترجمہ ہے اور اس کے حقائق کا اشتراک کرتا ہے: 1887 میں مریدیہ آرڈر اور توبہ کی بنیاد، اور 1895 میں گیبون کی جلاوطنی۔"
