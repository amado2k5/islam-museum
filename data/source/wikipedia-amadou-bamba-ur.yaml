reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The article runs closely parallel to the Arabic article — the same lead facts (born 1853, died 1927; real name Ahmad ibn Muhammad ibn Habiballah; Khadim al-Rasul; Serigne Touba; a leading figure of Sufi Islam in West Africa who founded the Muridiyya order; Touba founded 1887; exiled to Gabon in 1895 for seven years; the Great Mosque of Touba built after his return, his tomb there) — and is therefore counted as the same source family as the Arabic article for any fact, not as an independent attestation. Its own additional sections treat his call to abandon superstition and turn to God, and his generosity. It does not name a school of law or theology for him."
