reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 at its recorded revision via the MediaWiki API. Its infobox agrees with the English article's infobox on both Sindh terms and on the governorship, and names his spouse as Fatima Sughra Begum (married 1940); its prose death section, however, gives '14 October 1948' — against its own infobox death-date template (4 October 1948), the English article and Wikidata — apparently confusing the date with his assumption of the chief ministership on 14 October 1942; the 4 October date is followed. It names no religion or school."
