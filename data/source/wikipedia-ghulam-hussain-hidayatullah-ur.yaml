summary:
  ar: "مقالة ويكيبيديا الأردية «غلام حسين هدايت الله»؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1879 في شكارپور وتعليمه في مدرسة الإسلام وكلية دي جي وكلية القانون الحكومية ببومباي، ورئاسته وزراء السند (1937–1938 ثم 1942–1947) وحاكميته للسند (1947–1948)، وزواجه سنة 1940 من فاطمة صغرى بيغم، ووفاته في كراتشي."
  en: "Urdu Wikipedia article 'Ghulam Hussain Hidayatullah'; used for entity facts only. It gives his birth in 1879 at Shikarpur, his education at Sindh Madressatul Islam, D. J. College and Government Law College, Bombay, his Sindh chief ministerships (1937–1938, then 1942–1947) and governorship (1947–1948), his 1940 marriage to Fatima Sughra Begum, and his death at Karachi."
