summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ما فوشينغ؛ تُستخدم لوقائع الكيان فقط. تروي أنه قائد مسلم من يونان حكم كاشغر تيتايًا (1916–1924) في عهد يانغ زنغشين، واشتهر بقسوته، حتى أرسل يانغ ما شاوو لقتله سنة 1924."
  en: "English Wikipedia article on Ma Fuxing; used for entity facts only. It recounts the Yunnanese Hui commander who ruled Kashgar as Titai (1916–1924) under Yang Zengxin, his reputation for brutality, and Yang's dispatch of Ma Shaowu to kill him in 1924."
  es: "Artículo de la Wikipedia en inglés sobre Ma Fuxing; utilizado únicamente para obtener información sobre la persona. Relata la historia del comandante hui de Yunnan que gobernó Kashgar como Titai (1916-1924) bajo el mando de Yang Zengxin, su reputación de brutalidad y el envío de Ma Shaowu por parte de Yang para asesinarlo en 1924."
  fr: "Article de Wikipédia en anglais sur Ma Fuxing; utilisé uniquement pour les informations factuelles. Il relate l'histoire de ce commandant Hui du Yunnan qui a dirigé Kashgar sous le nom de Titai (1916-1924) sous Yang Zengxin, sa réputation de brutalité et l'envoi par Yang de Ma Shaowu pour le tuer en 1924."
  ur: "Ma Fuxing پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں یونانی ہوئی کمانڈر کا ذکر ہے جس نے کاشغر پر تیتائی (1916–1924) کے طور پر یانگ زینگسین کے ماتحت حکومت کی، اس کی بربریت کی شہرت، اور 1924 میں اسے مارنے کے لیے یانگ کی طرف سے ما شاو کو بھیجا۔"
  tr: "Ma Fuxing hakkında İngilizce Wikipedia makalesi; sadece varlığın gerçekleri için kullanılmıştır. Anlatılanlara göre, Yunnanlı bir Müslüman lider olarak Yang Zhenxin döneminde Kashgar Titaya'yı (1916–1924) yönetmiş ve zalimliğiyle kötü şöhretliydi, ta ki Yang 1924'te Ma Shao'yu onu öldürmesi için gönderene kadar."
  id: "Artikel Wikipedia bahasa Inggris tentang Ma Fuxing; digunakan hanya untuk fakta entitas. Diceritakan bahwa ia adalah pemimpin Muslim dari Yunnan yang memerintah Kashgar Titaya (1916–1924) pada masa pemerintahan Yang Zhenxin, dan terkenal karena kekejamannya, hingga Yang mengirim Ma Shao untuk membunuhnya pada tahun 1924."
