label:
  ar: "دراسة عبد العزيز بن إبراهيم الشهوان لكتاب التوحيد لابن خزيمة ⁦(الجزء الأول، القسم الدراسي)⁩، دار الرشد، الرياض 1408هـ/1988م"
  en: "'Abd al-'Aziz ibn Ibrahim al-Shahwan's study of Ibn Khuzayma's Kitab al-Tawhid (vol. 1, the study section), Dar al-Rushd, Riyadh 1408 AH/1988 CE"
summary:
  ar: "القسم الدراسي من تحقيق الشهوان: تصدير صالح الفوزان، ثم ترجمة ابن خزيمة ⁦(نسبه ومولده ووفاته وأخلاقه ورحلاته وشيوخه وتلاميذه وثناء العلماء عليه ومؤلفاته وعقيدته ومذهبه الفقهي)⁩، ثم دراسة الكتاب ⁦(اسمه وموضوعه وسبب تأليفه وأجزاؤه وتوثيق نسبته وأسانيده)⁩، ثم دراسة تقويمية لمنهج المؤلف وقيمة الكتاب والمآخذ عليه، ثم وصف النسخ الخطية والطبعة المنيرية ومنهج التحقيق."
  en: "The study section of al-Shahwan's edition: a foreword by Salih al-Fawzan, a biography of Ibn Khuzayma (lineage, birth and death, character, travels, teachers and students, scholars' praise, works, creed and legal school), a study of the book (its title, subject, reason for writing, parts, attribution and chains), an evaluation of the author's method, the book's worth and the editor's criticisms, then a description of the manuscripts and the Muniriyya printing and the editorial method."
title: "كتاب التوحيد وإثبات صفات الرب عز وجل — دراسة وتحقيق الدكتور عبد العزيز بن إبراهيم الشهوان، الجزء الأول (الدراسة)"
