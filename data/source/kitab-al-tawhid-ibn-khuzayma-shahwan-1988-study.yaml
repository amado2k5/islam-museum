label:
  ar: "دراسة عبد العزيز بن إبراهيم الشهوان لكتاب التوحيد لابن خزيمة ⁦(الجزء الأول، القسم الدراسي)⁩، دار الرشد، الرياض 1408هـ/1988م"
  en: "'Abd al-'Aziz ibn Ibrahim al-Shahwan's study of Ibn Khuzayma's Kitab al-Tawhid (vol. 1, the study section), Dar al-Rushd, Riyadh 1408 AH/1988 CE"
summary:
  ar: "القسم الدراسي من تحقيق الشهوان: تصدير صالح الفوزان، ثم ترجمة ابن خزيمة ⁦(نسبه ومولده ووفاته وأخلاقه ورحلاته وشيوخه وتلاميذه وثناء العلماء عليه ومؤلفاته وعقيدته ومذهبه الفقهي)⁩، ثم دراسة الكتاب ⁦(اسمه وموضوعه وسبب تأليفه وأجزاؤه وتوثيق نسبته وأسانيده)⁩، ثم دراسة تقويمية لمنهج المؤلف وقيمة الكتاب والمآخذ عليه، ثم وصف النسخ الخطية والطبعة المنيرية ومنهج التحقيق."
  en: "The study section of al-Shahwan's edition: a foreword by Salih al-Fawzan, a biography of Ibn Khuzayma (lineage, birth and death, character, travels, teachers and students, scholars' praise, works, creed and legal school), a study of the book (its title, subject, reason for writing, parts, attribution and chains), an evaluation of the author's method, the book's worth and the editor's criticisms, then a description of the manuscripts and the Muniriyya printing and the editorial method."
  es: "La sección de estudio de la edición de al-Shahwan incluye: un prólogo de Salih al-Fawzan, una biografía de Ibn Khuzayma (linaje, nacimiento y muerte, carácter, viajes, maestros y alumnos, elogios de los eruditos, obras, credo y escuela jurídica), un estudio del libro (su título, tema, motivo de su escritura, partes, atribución y cadenas de transmisión), una evaluación del método del autor, el valor del libro y las críticas del editor, y, finalmente, una descripción de los manuscritos, la impresión de Muniriyya y el método editorial."
  fr: "La section d'étude de l'édition d'al-Shahwan: une préface de Salih al-Fawzan, une biographie d'Ibn Khuzayma (généalogie, naissance et mort, caractère, voyages, maîtres et élèves, éloges des érudits, œuvres, croyance et école juridique), une étude du livre (son titre, son sujet, la raison de son écriture, ses parties, son attribution et ses chaînes de transmission), une évaluation de la méthode de l'auteur, de la valeur du livre et des critiques de l'éditeur, puis une description des manuscrits, de l'impression Muniriyya et de la méthode éditoriale."
  ur: "الشہوان کے ایڈیشن کا مطالعہ سیکشن: صالح الفوزان کا پیش لفظ، ابن خزیمہ کی سوانح عمری ⁦(نسب، پیدائش اور موت، کردار، سفر، اساتذہ اور طلباء، علماء کی تعریف، کام، عقیدہ اور قانونی مکتب)⁩، کتاب کا مطالعہ ⁦(اس کا عنوان، موضوع، وجہ تحریر، حصے، انتساب کا طریقہ)⁩، کتابوں کے انتساب اور کتابوں کا طریقہ۔ اور ایڈیٹر کی تنقید، پھر مخطوطات کی تفصیل اور منیریہ طباعت اور ادارتی طریقہ۔"
title: "كتاب التوحيد وإثبات صفات الرب عز وجل — دراسة وتحقيق الدكتور عبد العزيز بن إبراهيم الشهوان، الجزء الأول ⁦(الدراسة)⁩"
