  ar: "مدخلة «موسوعة الدين» (1987) عن سيد أمير علي بقلم ديفيد ليليفلد؛ تُستخدم لوقائع الكيان فقط. تنص على أن أسرته انضمت إلى جماعة صغيرة من مسلمي الهند الشيعة ذوي الأصل الإيراني، وأنه بقي «ملتزما في النهاية بالإمامة الشيعية الرسولية»."
  en: "Encyclopedia of Religion (1987) entry on Syed Ameer Ali by David Lelyveld; used for entity facts only. It states that his family joined 'a small community of fellow Shīʿī Muslims of Iranian descent', and that Ameer Ali himself 'remained ultimately committed to the apostolic Shīʿī imamate'."
