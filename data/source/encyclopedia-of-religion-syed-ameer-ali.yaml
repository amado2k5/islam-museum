reliability_note: "A scholarly encyclopedia entry by a named historian of modern India, read in full on 25 October 2026 — one of the two independent attestations behind this record's faith segment, as the record's faith note sets out. It gives: born at Chinsura, Bengal (against the English Wikipedia article's and the Oxford Dictionary of National Biography's Cuttack, which the record follows, and Wikidata's Mohan — all three variants recorded in the record); his ancestors claimed descent from the Prophet through Imam Ali al-Rida, and 'the family settled permanently at Lucknow in the eighteenth century, joining a small community of fellow Shīʿī Muslims of Iranian descent'; he was 'greatly influenced' by Sayyid Karamat Ali's Arabic treatise 'expressive of the rationalistic Muʿtazili tradition of Shīʿī scholasticism'; education at Hooghly and the University of Calcutta, then the Inner Temple; posts through the Bengal Legislative Council (1878) to the Government of India's council (1883) and the Calcutta High Court (1890); founded the National Muhammedan Association at Calcutta in 1878 (a second dating, against the English article's 1877 and the Urdu article's 1879); The Spirit of Islam (1891) grown from the 1873 Critical Examination, whose first version the entry dates to 1872; that in The Spirit of Islam he argued for the Sunni caliphate as a 'pontifical' headship of the church yet 'remained ultimately committed to the apostolic Shīʿī imamate' — citing his own Mahommedan Law (1912 edition, vol. 1, p. 6), an attestation of Ameer Ali's own adherence, not merely his family's; his founding role in the Muslim League, the London association (1908), the London Mosque Fund (1910), the separate-electorates campaign, the Khilafat movement, and the 1924 joint appeal with the Aga Khan to Turkey to maintain the caliphate. Checked and silent on the sect question: the 1922 Encyclopaedia Britannica entry and the Rekhta biographical profile, both consulted on the same day, name no sect for him."
