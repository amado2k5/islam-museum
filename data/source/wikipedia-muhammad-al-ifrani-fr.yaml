summary:
  ar: "مقالة ويكيبيديا الفرنسية عن محمد الصغير الإفراني ⁦(بالأسماء الإفريني والوفراني واليفرني)⁩؛ تُستخدم لوقائع الكيان فقط. صدرها يعطي 1669–1744 ويجعل مولده بجهة إفران الأطلس الصغير جنوب أكادير، بخلاف سائر النصوص التي تجعل المولد بمراكش، ويصف «نزهة الحادي» بأنها المصدر الأساسي لتاريخ السعديين."
  en: "French Wikipedia article on Mohamed el saghir el Ifrini (also Wafrani, Eloufrani); used for entity facts only. Its lead gives 1669–1744 and puts his birth in the region of Ifrane in the Little Atlas south of Agadir — against the other texts' Marrakesh, a reading the person record preserves but does not follow — and calls the Nuzhat al-Hadi the essential source for Saadian history."
  es: "Artículo de la Wikipedia en francés sobre Mohamed el saghir el Ifrini (también Wafrani, Eloufrani); utilizado únicamente para datos sobre la persona. Su introducción indica 1669–1744 y sitúa su nacimiento en la región de Ifrane, en el Pequeño Atlas, al sur de Agadir —en contraposición a Marrakech, según otros textos, una lectura que el registro de la persona conserva pero no sigue— y considera al Nuzhat al-Hadi la fuente esencial para la historia saadí."
  fr: "L'article de Wikipédia en français sur Mohamed el saghir el Ifrini (également Wafrani, Eloufrani); utilisé uniquement pour les informations relatives à l'entité. Son introduction indique 1669-1744 et situe sa naissance dans la région d'Ifrane, dans le Petit Atlas, au sud d'Agadir — contrairement à ce qu'affirment d'autres textes (Marrakech), une lecture que la notice biographique conserve mais n'adopte pas — et qualifie le Nuzhat al-Hadi de source essentielle pour l'histoire saadienne."
  ur: "فرانسیسی ویکیپیڈیا مضمون محمد ال صغیر ال افرینی ⁦(بھی وفرانی، ایلوفرانی)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ 1669-1744 دیتا ہے اور اس کی پیدائش اگادیر کے جنوب میں لٹل اٹلس میں واقع افران کے علاقے میں ہوتی ہے - دوسری تحریروں کے خلاف مراکیش، جسے پڑھنے والا شخص ریکارڈ محفوظ رکھتا ہے لیکن اس کی پیروی نہیں کرتا ہے - اور نزہت الہادی کو سعدیہ کی تاریخ کا لازمی ماخذ قرار دیتا ہے۔"
