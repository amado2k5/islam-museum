  ar: "مقالة ويكيبيديا الفرنسية عن محمد الصغير الإفراني (بالأسماء الإفريني والوفراني واليفرني)؛ تُستخدم لوقائع الكيان فقط. صدرها يعطي 1669–1744 ويجعل مولده بجهة إفران الأطلس الصغير جنوب أكادير، بخلاف سائر النصوص التي تجعل المولد بمراكش، ويصف «نزهة الحادي» بأنها المصدر الأساسي لتاريخ السعديين."
  en: "French Wikipedia article on Mohamed el saghir el Ifrini (also Wafrani, Eloufrani); used for entity facts only. Its lead gives 1669–1744 and puts his birth in the region of Ifrane in the Little Atlas south of Agadir — against the other texts' Marrakesh, a reading the person record preserves but does not follow — and calls the Nuzhat al-Hadi the essential source for Saadian history."
