  ar: "مقالة ويكيبيديا الإنجليزية عن دمبا با؛ تُستخدم لوقائع الكيان فقط. تروي سيرة المهاجم السنغالي المولود في 25 مايو 1985 بسيفر في فرنسا: هوفنهايم ووست هام ونيوكاسل وتشيلسي وبشكتاش وشنغهاي شينهوا وباشاك شهير، و22 مباراة مع السنغال، وأنه مسلم ممارس يصوم رمضان ويحتفل بالسجود."
  en: "English Wikipedia article on Demba Ba; used for entity facts only. It records the Senegalese striker born 25 May 1985 at Sèvres, France: Hoffenheim, West Ham United, Newcastle United, Chelsea, Beşiktaş, Shanghai Shenhua and İstanbul Başakşehir, 22 Senegal caps, and that he is a practising Muslim who fasts during Ramadan and celebrates goals with the sujud."
