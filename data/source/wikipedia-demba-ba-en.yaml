summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن دمبا با؛ تُستخدم لوقائع الكيان فقط. تروي سيرة المهاجم السنغالي المولود في 25 مايو 1985 بسيفر في فرنسا: هوفنهايم ووست هام ونيوكاسل وتشيلسي وبشكتاش وشنغهاي شينهوا وباشاك شهير، و22 مباراة مع السنغال، وأنه مسلم ممارس يصوم رمضان ويحتفل بالسجود."
  en: "English Wikipedia article on Demba Ba; used for entity facts only. It records the Senegalese striker born 25 May 1985 at Sèvres, France: Hoffenheim, West Ham United, Newcastle United, Chelsea, Beşiktaş, Shanghai Shenhua and İstanbul Başakşehir, 22 Senegal caps, and that he is a practising Muslim who fasts during Ramadan and celebrates goals with the sujud."
  es: "Artículo de la Wikipedia en inglés sobre Demba Ba; utilizado únicamente para obtener información sobre la persona. En él se menciona al delantero senegalés nacido el 25 de mayo de 1985 en Sèvres, Francia: Hoffenheim, West Ham United, Newcastle United, Chelsea, Beşiktaş, Shanghai Shenhua e İstanbul Başakşehir, 22 partidos internacionales con Senegal, y que es musulmán practicante, ayuna durante el Ramadán y celebra los goles con la postración (sujud)."
  fr: "Article Wikipédia en anglais sur Demba Ba; utilisé uniquement pour les informations relatives à l'individu. Il mentionne l'attaquant sénégalais né le 25 mai 1985 à Sèvres, en France: Hoffenheim, West Ham United, Newcastle United, Chelsea, Beşiktaş, Shanghai Shenhua et İstanbul Başakşehir, 22 sélections en équipe nationale du Sénégal, et précise qu'il est un musulman pratiquant qui jeûne pendant le Ramadan et célèbre ses buts par la prosternation (sujud)."
