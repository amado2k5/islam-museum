summary:
  ar: "مدخل «موسوعة الإسلام» لمؤسسة الشؤون الدينية التركية TDV عن الخليل بن أحمد الفراهيدي، اطُّلع عليه في ٢٠ نوفمبر ٢٠٢٦؛ يُستخدم لوقائع الكيان: الولادة والإقامة والشيوخ والعقيدة وتاريخ الوفاة."
  en: "The TDV İslâm Ansiklopedisi entry on al-Khalil ibn Ahmad al-Farahidi (online edition), read on 20 November 2026; used for entity facts: birth, residence, teachers, creed, date of death."
  es: "Entrada de la TDV İslâm Ansiklopedisi sobre al-Khalil ibn Ahmad al-Farahidi (edición en línea), consultada el 20 de noviembre de 2026; utilizada para datos de la entidad: nacimiento, residencia, maestros, credo, fecha de muerte."
  fr: "Article de la TDV İslâm Ansiklopedisi sur al-Khalil ibn Ahmad al-Farahidi (édition en ligne), consulté le 20 novembre 2026 ; utilisé pour les données de l'entité : naissance, résidence, maîtres, credo, date de décès."
  ur: "TDV İslâm Ansiklopedisi ⁦(آن لائن ایڈیشن)⁩ میں al-Khalil ibn Ahmad al-Farahidi پر اندراج، 20 نومبر 2026 کو پڑھا؛ ہستی کے حقائق کے لیے استعمال: پیدائش، رہائش، اساتذہ، عقیدہ اور وفات کی تاریخ."
  tr: "Türk Dini İşler Vakfı (TDV) tarafından Al-Khalil bin Ahmed Al-Farahidi hakkında \"İslam Ansiklopedisi\" için 20 Kasım 2026 tarihinde erişilen madde; kuruluşun doğum, ikamet, şeyhler, inanç ve ölüm tarihi için kullanılmıştır."
  id: "Entri untuk \"Ensiklopedia Islam\" oleh Yayasan Urusan Agama Turki (TDV) tentang Al-Khalil bin Ahmad Al-Farahidi, diakses pada 20 November 2026; digunakan untuk peristiwa entitas: kelahiran, tempat tinggal, sheikh, kepercayaan, dan tanggal kematian."
