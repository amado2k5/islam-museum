reliability_note: "Read in the museum's session on 20 November 2026. It gives his birth in 100/718 in Oman and his upbringing and life in Basra; his death most probably in 175/791, with reports of 160/777 or 170/786; his teachers Isa ibn Umar al-Thaqafi, Abu Amr ibn al-Ala and al-Akhfash al-Akbar, and in hadith Ayyub al-Sakhtiyani; and that he briefly joined the Ibadi (or Sufri) branch of the Kharijites in his youth before returning to the Sunni creed under al-Sakhtiyani's influence. Used for entity facts only; the creed statement carries this source and no other."
