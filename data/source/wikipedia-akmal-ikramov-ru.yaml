summary:
  ar: "مقالة ويكيبيديا الروسية عن أكمل إكراموف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في سبتمبر 1898 في طشقند في أسرة فلاحية ووفاته في 13 مارس 1938 (وبرواية أخرى 15 مارس) على ميدان كوموناركا، ومساره الحزبي منذ 1918 ومنها ترؤسه المكتب الإسلامي للجنة نامانغان الحزبية في 1920–1921، ومناصبه في تركستان وأوزبكستان حتى سكرتاريته الأولى، واعتقاله في سبتمبر 1937 ومحاكمته وردّ اعتباره في يونيو 1957. لا يحمل صندوق معلوماتها حقلا للديانة."
  en: "Russian Wikipedia article on Akmal Ikramov; used for entity facts only. It gives his birth in September 1898 in Tashkent in a peasant family and his death on 13 March 1938 (by another account 15 March) at the Kommunarka shooting ground, his party career from 1918 — including his chairmanship of the Muslim Bureau of the Namangan party committee in 1920–1921 — his posts in Turkestan and Uzbekistan up to the first secretaryship, his arrest in September 1937, his trial, and his rehabilitation in June 1957. Its infobox carries no religion field."
