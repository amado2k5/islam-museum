reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision (revid asserted equal before use). It gives his full name as Bandar bin Abdul Aziz bin Siraj bin Abdul Malik Baleela, born in Mecca in 1975 (1395 AH); bachelor's and master's (2001, in fiqh) at Umm al-Qura, doctorate in fiqh at the Islamic University of Madinah (2008); assistant professor at Taif University; imam at several Mecca mosques before his official appointment to Masjid al-Haram, first leading Tarawih on 15 Ramadan 1434 (23 July 2013); khatib by royal decree in 2019; member of the Council of Senior Scholars from October 2020; delivered the Arafat sermon and the Eid al-Adha sermon in 2021. Its infobox, uncited, gives his jurisprudence as Hanbali; no text in the article names a school for him. Its claim that he was appointed Mufti of the Makkah Province in early 2026 rests on a single weak news site and is not carried into the person record; the Arabic article records the narrower appointment as fatwa commissioner for the Makkah region."
