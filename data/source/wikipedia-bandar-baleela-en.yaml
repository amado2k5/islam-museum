summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بندر بليلة؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه الكامل وميلاده بمكة سنة 1975 ⁦(1395هـ)⁩ ودراسته بجامعة أم القرى والجامعة الإسلامية بالمدينة، وتعيينه إمامًا رسميًا للمسجد الحرام سنة 2013 وخطيبًا بأمر ملكي سنة 2019، وعضويته في هيئة كبار العلماء منذ أكتوبر 2020، وخطبته يوم عرفة سنة 2021."
  en: "English Wikipedia article on Bandar Baleela; used for entity facts only. It gives his full name, his birth in Mecca in 1975 (1395 AH), his studies at Umm al-Qura University and the Islamic University of Madinah, his appointment as an official imam of Masjid al-Haram in 2013 and as a khatib by royal decree in 2019, his membership of the Council of Senior Scholars from October 2020, and his delivery of the 2021 Arafat sermon."
  es: "Artículo de la Wikipedia en inglés sobre Bandar Baleela; utilizado únicamente para datos sobre la persona. En él se indica su nombre completo, su nacimiento en La Meca en 1975 (1395 AH), sus estudios en la Universidad Umm al-Qura y la Universidad Islámica de Medina, su nombramiento como imán oficial de la Mezquita Sagrada (Masjid al-Haram) en 2013 y como khatib por decreto real en 2019, su pertenencia al Consejo de Altos Eruditos desde octubre de 2020 y su sermón de Arafat de 2021."
  fr: "Article de Wikipédia en anglais sur Bandar Baleela; utilisé uniquement pour les informations le concernant. Il mentionne son nom complet, sa naissance à La Mecque en 1975 (1395 AH), ses études à l’université Umm al-Qura et à l’université islamique de Médine, sa nomination comme imam officiel de la Masjid al-Haram en 2013 et comme khatib par décret royal en 2019, son appartenance au Conseil des grands oulémas depuis octobre 2020 et son sermon d’Arafat de 2021."
  ur: "بندر بلیلہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا پورا نام، مکہ میں ان کی پیدائش 1975 ⁦(1395 ہجری)⁩، ام القراء یونیورسٹی اور اسلامک یونیورسٹی آف مدینہ میں ان کی تعلیم، 2013 میں مسجد الحرام کے سرکاری امام کے طور پر ان کی تقرری اور 2019 میں شاہی فرمان کے ذریعے خطیب کے طور پر، ان کی کونسل آف سینئرز کی رکنیت، اکتوبر 20202020202020202020202020202020202020202020202020202020202020202020 عرفات کا خطبہ۔"
  tr: "Bandar Balila hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Tam adı geçmektedir; 1975'te Mekke'de doğduğu (1395 Hicri), Ümmüel-Kura Üniversitesi ve Medine'deki İslam Üniversitesi'ndeki eğitimi, 2013'te Büyük Camii resmi imamı olarak atanması ve 2019'da kraliyet fermanıyla vaiz olması, Ekim 2020'den beri Kıdemli Alimler Konseyi üyeliği ve 2021'de Arafah Günü'ndeki vaazı belirtilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Bandar Balila; digunakan hanya untuk fakta entitas. Nama lengkapnya disebutkan, kelahirannya di Mekah pada tahun 1975 (1395 H), studinya di Universitas um Al-Qura dan Universitas Islam di Madinah, pengangkatannya sebagai Imam resmi Masjid Agung pada tahun 2013, serta sebagai pengkhotbah melalui dekret kerajaan pada tahun 2019, keanggotaan Dewan Ulama Senior sejak Oktober 2020, serta khotbahnya pada Hari Arafah pada tahun 2021."
