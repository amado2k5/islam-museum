  ar: "مقالة ويكيبيديا الإنجليزية عن بندر بليلة؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه الكامل وميلاده بمكة سنة 1975 (1395هـ) ودراسته بجامعة أم القرى والجامعة الإسلامية بالمدينة، وتعيينه إمامًا رسميًا للمسجد الحرام سنة 2013 وخطيبًا بأمر ملكي سنة 2019، وعضويته في هيئة كبار العلماء منذ أكتوبر 2020، وخطبته يوم عرفة سنة 2021."
  en: "English Wikipedia article on Bandar Baleela; used for entity facts only. It gives his full name, his birth in Mecca in 1975 (1395 AH), his studies at Umm al-Qura University and the Islamic University of Madinah, his appointment as an official imam of Masjid al-Haram in 2013 and as a khatib by royal decree in 2019, his membership of the Council of Senior Scholars from October 2020, and his delivery of the 2021 Arafat sermon."
