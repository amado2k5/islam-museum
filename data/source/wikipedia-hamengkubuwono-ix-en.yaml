  ar: "مقالة ويكيبيديا الإنجليزية عن هامينغكوبوونو التاسع (1912–1988)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في يوغياكارتا في 12 أبريل 1912 باسم غوستي رادن ماس دورودجاتون، وتتويجه سلطانا سنة 1940، ودعمه للجمهورية، ومناصبه الوزارية، ونيابته الثانية لرئاسة إندونيسيا (1973–1978)، ووفاته في واشنطن في 2 أكتوبر 1988."
  en: "English Wikipedia article on Hamengkubuwono IX (1912–1988); used for entity facts only. It recounts his birth at Yogyakarta on 12 April 1912 as Gusti Raden Mas Dorodjatun, his coronation as sultan in 1940, his support for the republic, his ministerial offices, his tenure as Indonesia's second vice president (1973–1978), and his death at Washington, D.C. on 2 October 1988."
