summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هامينغكوبوونو التاسع (1912–1988)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في يوغياكارتا في 12 أبريل 1912 باسم غوستي رادن ماس دورودجاتون، وتتويجه سلطانا سنة 1940، ودعمه للجمهورية، ومناصبه الوزارية، ونيابته الثانية لرئاسة إندونيسيا (1973–1978)، ووفاته في واشنطن في 2 أكتوبر 1988."
  en: "English Wikipedia article on Hamengkubuwono IX (1912–1988); used for entity facts only. It recounts his birth at Yogyakarta on 12 April 1912 as Gusti Raden Mas Dorodjatun, his coronation as sultan in 1940, his support for the republic, his ministerial offices, his tenure as Indonesia's second vice president (1973–1978), and his death at Washington, D.C. on 2 October 1988."
  es: "Artículo de la Wikipedia en inglés sobre Hamengkubuwono IX (1912-1988); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Yogyakarta el 12 de abril de 1912 como Gusti Raden Mas Dorodjatun, su coronación como sultán en 1940, su apoyo a la república, sus cargos ministeriales, su mandato como segundo vicepresidente de Indonesia (1973-1978) y su fallecimiento en Washington, D.C. el 2 de octubre de 1988."
  fr: "Article de Wikipédia en anglais sur Hamengkubuwono IX (1912-1988); utilisé uniquement pour les informations biographiques. Il relate sa naissance à Yogyakarta le 12 avril 1912 sous le nom de Gusti Raden Mas Dorodjatun, son couronnement comme sultan en 1940, son soutien à la république, ses fonctions ministérielles, son mandat de deuxième vice-président de l'Indonésie (1973-1978) et sa mort à Washington, D.C., le 2 octobre 1988."
  ur: "Hamengkubuwono IX (1912–1988) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں یوگیکارتا میں 12 اپریل 1912 کو گسٹی راڈن ماس دورودجاتون کے طور پر ان کی پیدائش، 1940 میں سلطان کے طور پر ان کی تاجپوشی، جمہوریہ کے لیے ان کی حمایت، ان کے وزارتی دفاتر، انڈونیشیا کے دوسرے نائب صدر (1973–1978) کے طور پر ان کی مدت ملازمت اور 19 اکتوبر 82 کو Washton DC میں ان کی موت کا ذکر ہے۔"
  tr: "Hamingkobuno IX (1912–1988) hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılmıştır. 12 Nisan 1912'de Yogyakarta'da Gusti Raden Mas Dorodjatun olarak doğumunu, 1940'ta Sultan olarak taç giymesini, cumhuriyeti desteklemesini, bakanlık görevlerini, Endonezya'daki ikinci başkan yardımcılığını (1973–1978) ve 2 Ekim 1988'de Washington'daki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Hamingkobuno IX (1912–1988); hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya di Yogyakarta pada 12 April 1912 sebagai Gusti Raden Mas Dorodjatun, penobatannya sebagai Sultan pada tahun 1940, dukungannya terhadap republik, jabatan menterinya, wakil presiden kedua Indonesia (1973–1978), dan kematiannya di Washington pada 2 Oktober 1988."
