label: { en: "Fayż-e Kāšānī, Moḥsen — Encyclopaedia Iranica (Hamid Algar)" }
summary:
  ar: "مدخل «فيض الكاشاني» لحميد ألغار في الموسوعة الإيرانية؛ استُرجعت ببليوغرافيته، وقورنت مقالات الموسوعة المصاحبة في موضعه من الأخبارية وتلمذته لملا صدرا."
  en: "Hamid Algar's 'Fayz-e Kashani' entry in Encyclopaedia Iranica; its bibliography was retrieved, and companion Iranica articles were read for his place in the Akhbari tradition and his studentship under Mulla Sadra."
  es: "la entrada 'Fayz-e Kashani' de Hamid Algar en la Encyclopaedia Iranica; Se recuperó su bibliografía y se leyeron artículos complementarios de Iranica sobre su lugar en la tradición Akhbari y su beca bajo Mulla Sadra."
  fr: "l'entrée « Fayz-e Kashani » de Hamid Algar dans l'Encyclopédie Iranica; sa bibliographie a été récupérée et des articles complémentaires sur Iranica ont été lus sur sa place dans la tradition Akhbari et sa bourse d'études auprès de Mulla Sadra."
  ur: "انسائیکلوپیڈیا ایرانیکا میں حامد الگر کا 'فیض کاشانی' اندراج؛ اس کی کتابیات کو بازیافت کیا گیا، اور ساتھی ایرانی مضامین کو اخباری روایت میں اس کے مقام اور ملا صدرا کے دور میں ان کی شاگردی کے لیے پڑھا گیا۔"
  tr: "İran Ansiklopedisi'nde Hamid Algar'ın 'Fayd al-Kashani' adlı eserinin kaydı, onun bibliyografyasını hatırlattı ve eşlik eden ansiklopedinin haberler arasındaki yerini ve Molla Sadra'nın öğrenciliğini karşılaştırdı."
  id: "Entri 'Fayd al-Kashani' oleh Hamid Algar dalam Ensiklopedia Iran mengingatkan pada bibliografinya dan membandingkan artikel-artikel dalam ensiklopedia yang menyertainya sebagai penggantinya dengan berita dan pengikutannya terhadap Mulla Sadra."
title: "FAYŻ-E KĀŠĀNĪ, MOḤSEN"
