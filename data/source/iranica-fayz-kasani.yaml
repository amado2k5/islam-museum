reliability_note: "The standard scholarly encyclopaedia entry, by Hamid Algar. As retrieved in this session the article page returned its bibliography only (among it the standard Qom edition of al-Wafi, 3 vols., 1404/1984), so the article's biographical narrative was not relied on and no date or faith value in the person record rests on this source alone. Companion Encyclopaedia Iranica articles read in full in the same session place Fayz among the leading moderate Akhbaris within Imamite (Twelver) Shi'ism and name him among Mulla Sadra's students and sons-in-law, corroborating the two Wikipedia texts."
