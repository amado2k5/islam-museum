summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نشاة النساء موهاني؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها في لكنو ⁦(1884 في صندوق المعلومات والمقدمة، و1885 في متنها)⁩ ووفاتها في 18 نيسان 1937، وزواجها من حسرت موهاني، وعملها في حركتي عدم التعاون والخلافة، ومتجرها الخادي «متجر عليكرة خلافت»، واستمرارها في إصدار صحيفة زوجها «أردو معلى»."
  en: "English Wikipedia article on Nishatunnisa Mohani; used for entity facts only. It gives her birth at Lucknow (1884 in its infobox and lead, 1885 in its body text) and her death on 18 April 1937, her marriage to Hasrat Mohani, her work in the non-cooperation and Khilafat movements, her Aligarh Khilafat Store for khadi, and her keeping her husband's newspaper Urdu-e-Mualla in publication."
  es: "Artículo de la Wikipedia en inglés sobre Nishatunnisa Mohani; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Lucknow (1884 en su ficha informativa y en la introducción, 1885 en el cuerpo del texto) y su fallecimiento el 18 de abril de 1937, su matrimonio con Hasrat Mohani, su labor en los movimientos de no cooperación y Khilafat, su tienda Aligarh Khilafat Store de khadi y el hecho de que mantuviera en publicación el periódico de su marido, Urdu-e-Mualla."
  fr: "Article de Wikipédia en anglais sur Nishatunnisa Mohani; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance à Lucknow (1884 dans l'infobox et l'introduction, 1885 dans le corps du texte) et son décès le 18 avril 1937, son mariage avec Hasrat Mohani, son engagement dans les mouvements de non-coopération et du Califat, son magasin de khadi à Aligarh (Khilafat Store) et le maintien de la publication du journal de son mari, Urdu-e-Mualla."
  ur: "نشانتننسہ موہانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش لکھنؤ میں ہوئی ⁦(1884 اس کے معلوماتی خانے اور لیڈ میں، 1885 اس کے باڈی ٹیکسٹ میں)⁩ اور اس کی موت 18 اپریل 1937 کو، حسرت موہانی سے اس کی شادی، عدم تعاون اور خلافت کی تحریکوں میں اس کا کام، کھادی کے لیے اس کا علی گڑھ خلافت اسٹور، اور اس نے اپنے شوہر کا اخبار اردو میں عوامی اخبار رکھنا۔"
  tr: "Kadınların yetiştirilmesiyle ilgili İngilizce Vikipedi makalesi Mohani; yalnızca varlığın gerçekleri için kullanılmıştır. Lucknow'daki doğumundan (1884 bilgi kutusu ve girişte, 1885 ise gövdesinde), 18 Nisan 1937'deki ölümünden, Hasrat Mohani ile evliliğinden, İşbirliği Yapmama ve Halifelik hareketlerindeki çalışmalarından, Khadi dükkânı \"Alikra Khilafat Store\"dan ve kocasının gazetesi \"Urdu Ma'la\"nın yayımlanmaya devam etmesini belirtir."
  id: "Artikel Wikipedia bahasa Inggris tentang pengasuhan perempuan Mohani; digunakan hanya untuk fakta entitas. Ia menyebutkan kelahirannya di Lucknow (1884 di infobox dan pengantar, dan 1885 di tubuhnya), kematiannya pada 18 April 1937, pernikahannya dengan Hasrat Mohani, karyanya di gerakan Non-Cooperation dan Khalifah, toko Khadi-nya \"Alikra Khilafat Store,\" dan kelanjutannya menerbitkan surat kabar suaminya \"Urdu Ma'la.\""
