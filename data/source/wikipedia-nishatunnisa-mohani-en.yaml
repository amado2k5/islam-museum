summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نشاة النساء موهاني؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها في لكنو (1884 في صندوق المعلومات والمقدمة، و1885 في متنها) ووفاتها في 18 نيسان 1937، وزواجها من حسرت موهاني، وعملها في حركتي عدم التعاون والخلافة، ومتجرها الخادي «متجر عليكرة خلافت»، واستمرارها في إصدار صحيفة زوجها «أردو معلى»."
  en: "English Wikipedia article on Nishatunnisa Mohani; used for entity facts only. It gives her birth at Lucknow (1884 in its infobox and lead, 1885 in its body text) and her death on 18 April 1937, her marriage to Hasrat Mohani, her work in the non-cooperation and Khilafat movements, her Aligarh Khilafat Store for khadi, and her keeping her husband's newspaper Urdu-e-Mualla in publication."
