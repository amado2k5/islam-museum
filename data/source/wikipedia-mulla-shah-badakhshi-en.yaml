summary:
  ar: "مقالة ويكيبيديا الإنجليزية ⁦(بعنوان «Shah Badakhshi»)⁩ عن ملا شاه البدخشي؛ تصفه في استهلالها بأنه صوفي من القرن السابع عشر وخليفة ميان مير، من قرية في منطقة رستاق ببدخشان، منتسب إلى الطريقة القادرية ومرشد لدارا شكوه وجهان آرا."
  en: "English Wikipedia article (titled 'Shah Badakhshi') on Mulla Shah Badakhshi; its lede describes a 17th-century Sufi, spiritual successor of Mian Mir, from a village in the Rustaq area of Badakhshan, who belonged to the Qadiri order and mentored Dara Shikoh and Jahanara."
  es: "Artículo de Wikipedia en inglés (titulado 'Shah Badakhshi') sobre Mulla Shah Badakhshi; Su lede describe a un sufí del siglo XVII, sucesor espiritual de Mian Mir, de una aldea en la zona de Rustaq de Badakhshan, que pertenecía a la orden Qadiri y fue mentor de Dara Shikoh y Jahanara."
  fr: "Article Wikipédia en anglais (intitulé « Shah Badakhshi ») sur Mulla Shah Badakhshi; Son lede décrit un soufi du XVIIe siècle, successeur spirituel de Mian Mir, originaire d'un village de la région de Rustaq au Badakhshan, qui appartenait à l'ordre Qadiri et encadrait Dara Shikoh et Jahanara."
