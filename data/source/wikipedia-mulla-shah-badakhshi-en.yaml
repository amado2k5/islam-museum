  ar: "مقالة ويكيبيديا الإنجليزية (بعنوان «Shah Badakhshi») عن ملا شاه البدخشي؛ تصفه في استهلالها بأنه صوفي من القرن السابع عشر وخليفة ميان مير، من قرية في منطقة رستاق ببدخشان، منتسب إلى الطريقة القادرية ومرشد لدارا شكوه وجهان آرا."
  en: "English Wikipedia article (titled 'Shah Badakhshi') on Mulla Shah Badakhshi; its lede describes a 17th-century Sufi, spiritual successor of Mian Mir, from a village in the Rustaq area of Badakhshan, who belonged to the Qadiri order and mentored Dara Shikoh and Jahanara."
