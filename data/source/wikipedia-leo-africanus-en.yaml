  ar: "مقالة ويكيبيديا الإنجليزية عن ليون الأفريقي (الحسن بن محمد الوزان)؛ تعطي مولده نحو 1494 في غرناطة من تقديره هو لأعمارِه، وأسره سنة 1518، واعتناقه المسيحية على يد البابا ليو العاشر سنة 1520 باسم يوحنا ليو دي ميديتشي، ونظريات نهاية حياته الثلاث، منها رجوعه إلى تونس وارتداده إلى الإسلام عند فيدمانشتتر."
  en: "English Wikipedia article on Leo Africanus (al-Hasan ibn Muhammad al-Wazzan); it gives his birth about 1494 at Granada from his own self-reported ages, his capture in 1518, his baptism by Pope Leo X in 1520 as Johannes Leo de Medicis, and the three theories of his end, including Widmannstetter's report that he returned to Tunis and reconverted to Islam."
