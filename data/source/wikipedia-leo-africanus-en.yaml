summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ليون الأفريقي ⁦(الحسن بن محمد الوزان)⁩؛ تعطي مولده نحو 1494 في غرناطة من تقديره هو لأعمارِه، وأسره سنة 1518، واعتناقه المسيحية على يد البابا ليو العاشر سنة 1520 باسم يوحنا ليو دي ميديتشي، ونظريات نهاية حياته الثلاث، منها رجوعه إلى تونس وارتداده إلى الإسلام عند فيدمانشتتر."
  en: "English Wikipedia article on Leo Africanus (al-Hasan ibn Muhammad al-Wazzan); it gives his birth about 1494 at Granada from his own self-reported ages, his capture in 1518, his baptism by Pope Leo X in 1520 as Johannes Leo de Medicis, and the three theories of his end, including Widmannstetter's report that he returned to Tunis and reconverted to Islam."
  es: "Artículo de la Wikipedia en inglés sobre León el Africano (al-Hasan ibn Muhammad al-Wazzan); en él se indica que nació alrededor de 1494 en Granada según sus propias declaraciones sobre su edad, su captura en 1518, su bautismo por el Papa León X en 1520 como Johannes León de Médici, y las tres teorías sobre su muerte, incluido el informe de Widmannstetter de que regresó a Túnez y se reconvirtió al Islam."
  fr: "L'article de Wikipédia en anglais sur Léon l'Africain (al-Hasan ibn Muhammad al-Wazzan) donne sa naissance vers 1494 à Grenade d'après ses propres déclarations, sa capture en 1518, son baptême par le pape Léon X en 1520 sous le nom de Johannes Leo de Medicis, et les trois théories sur sa fin, y compris le rapport de Widmannstetter selon lequel il serait retourné à Tunis et se serait reconverti à l'islam."
