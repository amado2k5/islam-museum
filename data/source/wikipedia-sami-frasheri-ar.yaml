  ar: "مقالة ويكيبيديا العربية القصيرة عن شمس الدين سامي فراشري ⁦(1266-1322 هـ / 1850-1904 م)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر معاجمه الثلاثة ودعوته المبكرة لكتابة التركية بالحروف اللاتينية."
  en: "Short Arabic Wikipedia article on Shams al-Din Sami Frashëri (1266–1322 AH / 1850–1904); used for entity facts only. It names his three dictionaries and his early proposal — later retracted — to write Turkish in Latin letters."
  es: "Breve artículo en árabe de la Wikipedia sobre Shams al-Din Sami Frashëri (1266–1322 AH / 1850–1904); se utiliza únicamente para datos sobre la persona. Menciona sus tres diccionarios y su propuesta inicial —posteriormente retirada— de escribir el turco con caracteres latinos."
  fr: "Court article de Wikipédia en arabe sur Shams al-Din Sami Frashëri (1266–1322 AH / 1850–1904); utilisé uniquement pour des informations sur l’auteur. Il mentionne ses trois dictionnaires et sa première proposition — ultérieurement retirée — d’écrire le turc en caractères latins."
  ur: "شمس الدین سامی فریشری ⁦(1266-1322 ہجری / 1850-1904)⁩ پر مختصر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی تین لغتوں اور اس کی ابتدائی تجویز کے نام - بعد میں واپس لے لیے گئے - لاطینی حروف میں ترکی لکھنے کے لیے۔"
  tr: "Şemseddin Sami Farashri (1266-1322 Hicri / 1850-1904 M.S.) hakkında kısa Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Üç sözlüğü ve Türkçeyi Latince harflerle yazma çağrısı ilk kez belirtilmiştir."
  id: "Artikel singkat Wikipedia Arab tentang Shams al-Din Sami Farashri (1266-1322 H / 1850-1904 M); hanya digunakan untuk fakta entitas. Tiga kamusnya dan seruannya yang awal menulis bahasa Turki dengan huruf Latin disebutkan."
