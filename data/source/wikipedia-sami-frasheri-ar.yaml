reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article: an Albanian-Ottoman writer and linguist, brother of the writer Naim Frashëri, his years given in Hijri as 1266–1322 AH (1850–1904 CE); he knew Greek, Latin, French, Italian, Turkish, Arabic and Persian; he was among the first to propose openly abandoning the Arabic letters for Turkish and devising a Latin Turkish alphabet, though he later retracted the view; his fame rests on the French–Turkish and Turkish–French Qamus, the six-volume Qamus al-A'lam and the two-part Qamus Turki. It carries no statement about his religion."
