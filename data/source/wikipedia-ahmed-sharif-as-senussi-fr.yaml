summary:
  ar: "مقالة ويكيبيديا الفرنسية الموجزة عن أحمد الشريف السنوسي (1873–1933)؛ تصفه بأنه الرئيس الأعلى لأسرة السنوسي بين 1902 و1933، وتذكر مشاركته في النضال ضد الفرنسيين والإيطاليين ووفاته بالمدينة."
  en: "The short French Wikipedia article on Ahmed Sharif as-Senussi (1873–1933); it calls him supreme chief of the Al-Sanoussi family between 1902 and 1933, notes his part in the struggle against the French and Italians, and his death in Medina."
  es: "El breve artículo de la Wikipedia en francés sobre Ahmed Sharif as-Senussi (1873-1933) lo describe como jefe supremo de la familia Al-Sanoussi entre 1902 y 1933, destaca su participación en la lucha contra los franceses e italianos y su muerte en Medina."
  fr: "Le court article de Wikipédia en français sur Ahmed Sharif as-Senussi (1873-1933); il le qualifie de chef suprême de la famille Al-Sanoussi entre 1902 et 1933, note son rôle dans la lutte contre les Français et les Italiens, et sa mort à Médine."
  ur: "احمد شریف آس سینوسی (1873–1933) پر مختصر فرانسیسی ویکیپیڈیا مضمون؛ اس میں انہیں 1902 اور 1933 کے درمیان السنوسی خاندان کا سپریم چیف کہا جاتا ہے، فرانسیسی اور اطالویوں کے خلاف جدوجہد میں ان کے حصہ اور مدینہ میں ان کی موت کو نوٹ کیا جاتا ہے۔"
  tr: "Ahmed Sharif Al-Sanussi (1873–1933) hakkında Fransızca Wikipedia'daki kısa makale; onu 1902-1933 yılları arasında Al-Senussi ailesinin en yüksek reisi olarak tanımlar, Fransızlar ve İtalyanlara karşı mücadeleye katılımından ve şehirdeki ölümünden bahseder."
  id: "Artikel Wikipedia Prancis yang ringkas tentang Ahmed Sharif Al-Sanussi (1873–1933); menggambarkannya sebagai kepala tertinggi keluarga Al-Senussi antara tahun 1902 dan 1933, menyebutkan partisipasinya dalam perjuangan melawan Prancis dan Italia serta kematiannya di kota tersebut."
