reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it, chiefly Brodnicka's Encyclopedia of Empire entry (2016), Sandomirsky's Encyclopedia of African History entry (2005), Ajayi (1989) and Stewart (1989). Read in full on 25 October 2026. The article describes the state in its lead as a Sunni Muslim caliphate and its Grand Council's decisions as resting on the Maliki interpretation of Sharia — descriptors of the state, not of any ruler personally, and used in the records only as such. Its body dates Seku Amadu's death to 1844 (citing Sandomirsky) against the biographical article's 20 April 1845, and its decline narrative loosely calls Ba Lobbo Amadu III's brother against the biographical article's nephew of Seku Amadu (Bâ and Daget); both disagreements are stated in the records."
