  ar: "مقالة ويكيبيديا الإنجليزية عن خلافة حمد الله (إمبراطورية ماسينا)، الخلافة السنية في غرب أفريقيا التي أسسها شيخو أحمدو سنة 1818 في دلتا النيجر الداخلية؛ تسرد حكامها الأئمة: شيخو أحمدو (1818-1845)، أحمدو الثاني (1845-1852)، أحمدو الثالث (1852-1862)، با لبو (1863-1867)، وتروي تأسيسها وازدهارها وانحطاطها وسقوطها على يد عمر تال وخلفائه."
  en: "English Wikipedia article on the Caliphate of Hamdullahi (the Massina Empire), the Sunni caliphate in West Africa founded by Seku Amadu in 1818 in the Inner Niger Delta; its almami list runs Seku Amadu (1818–1845), Amadu II (1845–1852), Amadu III (1852–1862) and Ba Lobbo (1863–1867), and it narrates the state's founding, apogee, decline and destruction by Omar Tall and his successors."
