summary:
  ar: "مقالة ويكيبيديا الأردية عن سعد الغامدي؛ تُستخدم لوقائع الكيان فقط. سيرة موجزة في دراسته بالدمام وإمامته وتلاوته المؤثرة، ولا تسمي مذهبا له."
  en: "Urdu Wikipedia article on Saad Al-Ghamdi; used for entity facts only. A short biography of his studies at Dammam, his imamate and his affecting recitation; it names no school for him."
  es: "Artículo de Wikipedia en urdu sobre Saad Al-Ghamdi; se utiliza únicamente para datos sobre su persona. Breve biografía de sus estudios en Dammam, su imamato y su conmovedora recitación; no menciona ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en ourdou sur Saad Al-Ghamdi; utilisé uniquement pour les informations le concernant. Une courte biographie de ses études à Dammam, de son imamat et de ses récitations émouvantes; aucune école n'est mentionnée."
  ur: "سعد الغامدی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ دمام میں ان کی تعلیم، ان کی امامت اور ان کی متاثر کن تلاوت کی مختصر سوانح حیات؛ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Saad Al-Ghamdi hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Dammam'daki çalışmalarının, imatı ve etkileyici okumalarının kısa biyografisi, düşünce okulunu isimlendirmemektedir."
  id: "Artikel Wikipedia Urdu tentang Saad Al-Ghamdi; hanya digunakan untuk fakta entitas. Biografi singkat tentang studinya di Dammam, imamatnya, dan pembacaannya yang berdampak, dan tidak menyebutkan aliran pemikirannya."
