reliability_note: "Read in full. Gives 970–1050 AH (1563–1640), birth at Fenderesk in the Gorgan region, study at Qazvin and Isfahan under Chalabi Beg Tabrizi, teaching of Avicenna's Shifāʾ at Isfahan, students including Rajab Ali Tabrizi and Agha Husayn Khwansari, and burial at Takht-e Fulad. Its lead names his father as Abu Talib against its own infobox (Mirza Beg) and the other texts; that reading was not followed. Its infobox madhhab field (Shi'a) is structured data and was not used for the faith value."
