summary:
  ar: "مقالة ويكيبيديا العربية عن نور الدين النيبت؛ تُستخدم لوقائع الكيان فقط. يذكر متنها ميلاده في 10 فبراير 1970 في الدار البيضاء ومسيرته مع الوداد. حقل الديانة في صندوق معلوماتها موجود وفارغ، وتصنيفها الوحيد ذو الصلة «مسلمون مغاربة»."
  en: "Arabic Wikipedia article on Noureddine Naybet; used for entity facts only. Its lead gives his birth as 10 February 1970 in Casablanca and recounts his Wydad career. Its infobox carries a religion field and leaves it empty, and its only religion trace is the category 'Moroccan Muslims'."
  es: "Artículo de Wikipedia en árabe sobre Noureddine Naybet; utilizado únicamente para datos sobre la persona. En su introducción, indica que nació el 10 de febrero de 1970 en Casablanca y relata su trayectoria en el Wydad. Su ficha informativa incluye un campo de religión que queda vacío, y la única referencia a la religión es la categoría «musulmanes marroquíes»."
  fr: "Article Wikipédia en arabe sur Noureddine Naybet; utilisé uniquement pour les informations sur l'entité. Son introduction indique sa naissance le 10 février 1970 à Casablanca et retrace sa carrière au Wydad. Son infobox comporte un champ « religion » vide, et la seule mention de religion est la catégorie « Musulmans marocains »."
