  ar: "مقالة ويكيبيديا الإنجليزية عن يعقوب بك؛ تُستخدم لوقائع الكيان فقط. تروي الحاكم الكوكندي الذي أسس دولة يتشهر (كاشغاريا) في سنجان وحكمها من 1865 إلى 1877 بلقب أطاليق غازي، ومولده نحو 1820 في بسكند ووفاته في أواخر مايو 1877 في كورلا في ظروف متنازع عليها."
  en: "English Wikipedia article on Yakub Beg of Yettishar; used for entity facts only. It recounts the Kokandi ruler who founded and ruled the Yettishar (Kashgaria) state in Xinjiang from 1865 to 1877 under the title Ataliq Ghazi, his birth about 1820 at Pskent, and his death at Korla in late May 1877 in disputed circumstances."
