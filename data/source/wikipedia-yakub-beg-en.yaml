summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن يعقوب بك؛ تُستخدم لوقائع الكيان فقط. تروي الحاكم الكوكندي الذي أسس دولة يتشهر ⁦(كاشغاريا)⁩ في سنجان وحكمها من 1865 إلى 1877 بلقب أطاليق غازي، ومولده نحو 1820 في بسكند ووفاته في أواخر مايو 1877 في كورلا في ظروف متنازع عليها."
  en: "English Wikipedia article on Yakub Beg of Yettishar; used for entity facts only. It recounts the Kokandi ruler who founded and ruled the Yettishar (Kashgaria) state in Xinjiang from 1865 to 1877 under the title Ataliq Ghazi, his birth about 1820 at Pskent, and his death at Korla in late May 1877 in disputed circumstances."
  es: "Artículo de la Wikipedia en inglés sobre Yakub Beg de Yettishar; utilizado únicamente para datos sobre la entidad. Relata la vida del gobernante kokandi que fundó y gobernó el estado de Yettishar (Kashgaria) en Xinjiang desde 1865 hasta 1877 bajo el título de Ataliq Ghazi, su nacimiento alrededor de 1820 en Pskent y su muerte en Korla a finales de mayo de 1877 en circunstancias controvertidas."
  fr: "Article de Wikipédia en anglais sur Yakub Beg de Yettishar; utilisé uniquement à des fins d'information sur l'entité. Il relate l'histoire du souverain Kokandi qui fonda et gouverna l'État de Yettishar (Kashgarie) au Xinjiang de 1865 à 1877 sous le titre d'Ataliq Ghazi, sa naissance vers 1820 à Pskent et sa mort à Korla fin mai 1877 dans des circonstances controversées."
  ur: "یتیشار کے یعقوب بیگ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں کوکنڈی حکمران کا ذکر کیا گیا ہے جس نے سنکیانگ میں 1865 سے 1877 تک یتیشار ⁦(کاشگریہ)⁩ ریاست کی بنیاد رکھی اور اس پر اتالق غازی کے عنوان سے حکومت کی، اس کی پیدائش تقریباً 1820 میں پسکینٹ میں، اور مئی 1877 کے آخر میں کورلا میں اس کی موت متنازعہ حالات میں ہوئی۔"
  tr: "Yaqub Bey hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kitap, Xinjiang'da Kaşgarya devletini kuran ve 1865-1877 yılları arasında Atalik Ghazi unvanıyla yöneten Kokundi hükümdarını, yaklaşık 1820'de Pasakand'da doğmuş ve Mayıs 1877 sonlarında Kurla'da tartışmalı koşullarda vefat etmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Yaqub Bey; digunakan hanya untuk fakta entitas. Artikel ini menceritakan penguasa Kokundi yang mendirikan negara bagian Kashgaria di Xinjiang dan memerintahnya dari tahun 1865 hingga 1877 dengan judul Atalik Ghazi, lahir sekitar tahun 1820 di Pasakand, dan meninggal pada akhir Mei 1877 di Kurla dalam keadaan yang diperdebatkan."
