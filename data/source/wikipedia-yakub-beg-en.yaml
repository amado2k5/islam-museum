reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. Its lead gives him as circa 1820 to 30 May 1877 and its biography (citing Kim 2004, p. 77) gives his birth in 1820 at Pskent; its death section states that the exact date is uncertain — Sayrami's 28 April is impossible since Przewalski met him on 9 May, Chinese sources usually give 22 May, Kuropatkin thought 29 May, and late May 1877 is the most likely period — and that the manner (poisoning, suicide, battle, or natural death by stroke, which modern historians following Kim judge most plausible) is unclear. Its infobox carries a religion field 'Sunni Islam'; no text in the article names a legal school or order for him."
