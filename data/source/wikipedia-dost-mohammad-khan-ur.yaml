summary:
  ar: "مقالة ويكيبيديا الأردية عن دوست محمد خان؛ مقالة قصيرة جدا تُستخدم لوقائع الكيان فقط. تروي اعتلاءه العرش سنة 1826 والحرب الإنجليزية الأفغانية الأولى بقيادة ابنه وزير أكبر خان ونفيه وعودته وضمّه هراة قبل وفاته. لا تحمل أي تاريخ ميلاد أو وفاة ولا أي قيمة للديانة."
  en: "Urdu Wikipedia article on Dost Mohammad Khan; a very short stub used for entity facts only. It recounts his accession in 1826, the First Anglo-Afghan War led by his son Wazir Akbar Khan, his exile and return, and his annexation of Herat before his death. It carries no birth or death date and no religion value."
  es: "Artículo de Wikipedia en urdu sobre Dost Mohammad Khan; un breve esbozo que solo incluye información sobre la persona. Relata su ascenso al trono en 1826, la Primera Guerra Anglo-Afgana liderada por su hijo Wazir Akbar Khan, su exilio y regreso, y la anexión de Herat antes de su muerte. No contiene fechas de nacimiento ni de fallecimiento, ni tampoco información sobre su religión."
  fr: "Article Wikipédia en ourdou sur Dost Mohammad Khan; une brève ébauche servant uniquement à fournir des informations factuelles. Elle relate son accession au trône en 1826, la première guerre anglo-afghane menée par son fils, le vizir Akbar Khan, son exil et son retour, ainsi que l’annexion d’Hérat avant sa mort. Elle ne comporte aucune date de naissance ni de décès, et aucune mention de sa religion."
  ur: "دوست محمد خان پر اردو ویکیپیڈیا مضمون؛ ایک بہت ہی مختصر اسٹب جو صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ اس میں 1826 میں ان کے الحاق، ان کے بیٹے وزیر اکبر خان کی قیادت میں پہلی اینگلو-افغان جنگ، اس کی جلاوطنی اور واپسی، اور اس کی موت سے قبل ہرات کے الحاق کا ذکر ہے۔ اس میں کوئی تاریخ پیدائش یا موت نہیں ہے اور نہ ہی کوئی مذہب کی قدر ہے۔"
  tr: "Dost Muhammed Han hakkında Urduca Vikipedi makalesi; sadece varlığın gerçekleri için kullanılan çok kısa bir makale. 1826'da tahta çıkışını, oğlu Vezir Ekber Han'ın liderliğindeki Birinci İngiliz-Afgan Savaşı'nı, sürgününü ve ölümünden önce Herat'a dönüşünü ve ilhakını anlatır. Doğum veya ölüm tarihi ya da herhangi bir dini önemi yoktur."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Dost Muhammad Khan; artikel yang sangat singkat hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan naiknya ke tahta pada tahun 1826 dan Perang Anglo-Afghan Pertama yang dipimpin oleh putranya Wazir Akbar Khan, pengasingannya, serta kembalinya dan aneksasi Herat sebelum kematiannya. Artikel ini tidak memuat tanggal lahir atau kematian atau makna agama apa pun."
