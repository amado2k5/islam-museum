  id: "Artikel Wikipedia Prancis tentang Marwan Chamakh; digunakan hanya untuk fakta entitas. Ia lahir pada 10 Januari 1984 di Tunan dan kariernya bersama Bordeaux, klub-klub Inggris, dan tim nasional Maroko."
