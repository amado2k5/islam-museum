reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full at revision 1381678439 on 25 October 2026. The article is internally inconsistent on two dates, and the record states both readings rather than merging them: its lead parenthesis prints '1 May 1853 – 4 July 1931', while its body says he was born at Istanbul 'in 1853 or 1854' and twice that he died on 4 June 1931. On faith it says only that he 'had a Shafi'i and Hanafi education, but also allied with the Malikis and opposed the Wahhabis, at a time when adherence to a madhhab was more fluid' — an education in two schools, not an attestation of one school as his own. Its account of his Armenian protection decrees of 1917–18 and of his caliphate's mixed reception is carried in the prose with its attribution."
