summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الحسين بن علي الهاشمي (وُلد في إسطنبول 1853 أو 1854 – توفي في عمان 4 يونيو 1931)، شريف مكة وأميرها من 1908، وقائد الثورة العربية الكبرى سنة 1916، وملك الحجاز حتى تنازله سنة 1924، والمُعلَن خليفة في مارس 1924؛ تروي نشأته وتعليمه على أحمد زيني دحلان، وحملته على عسير، ومراسلاته مع مكماهون، ورفضه معاهدة فرساي وإعلانه حماية الأرمن، وهزيمته أمام ابن سعود ونفيه إلى قبرص وعودته إلى عمان ووفاته ودفنه في الحرم الشريف بالقدس."
  en: "English Wikipedia article on Hussein bin Ali al-Hashimi (born at Istanbul in 1853 or 1854 – died at Amman on 4 June 1931), Sharif and Emir of Mecca from 1908, leader of the Great Arab Revolt of 1916, King of the Hejaz until his abdication in 1924, and proclaimed Caliph in March 1924; it recounts his upbringing and education under Ahmad Zayni Dahlan, his Asir campaign, the McMahon correspondence, his refusal of the Treaty of Versailles and his protection of the Armenians, his defeat by Ibn Saud, exile to Cyprus, return to Amman, death and burial at the Haram al-Sharif in Jerusalem."
