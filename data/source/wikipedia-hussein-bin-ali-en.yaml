summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الحسين بن علي الهاشمي ⁦(وُلد في إسطنبول 1853 أو 1854 – توفي في عمان 4 يونيو 1931)⁩، شريف مكة وأميرها من 1908، وقائد الثورة العربية الكبرى سنة 1916، وملك الحجاز حتى تنازله سنة 1924، والمُعلَن خليفة في مارس 1924؛ تروي نشأته وتعليمه على أحمد زيني دحلان، وحملته على عسير، ومراسلاته مع مكماهون، ورفضه معاهدة فرساي وإعلانه حماية الأرمن، وهزيمته أمام ابن سعود ونفيه إلى قبرص وعودته إلى عمان ووفاته ودفنه في الحرم الشريف بالقدس."
  en: "English Wikipedia article on Hussein bin Ali al-Hashimi (born at Istanbul in 1853 or 1854 – died at Amman on 4 June 1931), Sharif and Emir of Mecca from 1908, leader of the Great Arab Revolt of 1916, King of the Hejaz until his abdication in 1924, and proclaimed Caliph in March 1924; it recounts his upbringing and education under Ahmad Zayni Dahlan, his Asir campaign, the McMahon correspondence, his refusal of the Treaty of Versailles and his protection of the Armenians, his defeat by Ibn Saud, exile to Cyprus, return to Amman, death and burial at the Haram al-Sharif in Jerusalem."
  es: "Artículo de la Wikipedia en inglés sobre Hussein bin Ali al-Hashimi (nacido en Estambul en 1853 o 1854 y fallecido en Amán el 4 de junio de 1931), jerife y emir de La Meca desde 1908, líder de la Gran Revuelta Árabe de 1916, rey del Hiyaz hasta su abdicación en 1924 y proclamado califa en marzo de 1924; relata su crianza y educación bajo la tutela de Ahmad Zayni Dahlan, su campaña de Asir, la correspondencia con McMahon, su rechazo al Tratado de Versalles y su protección de los armenios, su derrota ante Ibn Saud, su exilio a Chipre, su regreso a Amán, su muerte y su entierro en el Haram al-Sharif en Jerusalén."
  fr: "L'article de Wikipédia en anglais sur Hussein bin Ali al-Hashimi (né à Istanbul en 1853 ou 1854 – mort à Amman le 4 juin 1931), chérif et émir de La Mecque à partir de 1908, chef de la Grande Révolte arabe de 1916, roi du Hedjaz jusqu'à son abdication en 1924, et proclamé calife en mars 1924; il relate son éducation auprès d'Ahmad Zayni Dahlan, sa campagne d'Asir, la correspondance McMahon, son refus du traité de Versailles et sa protection des Arméniens, sa défaite face à Ibn Saoud, son exil à Chypre, son retour à Amman, sa mort et son inhumation au Haram al-Sharif à Jérusalem."
  ur: "حسین بن علی الہاشمی ⁦(1853 یا 1854 میں استنبول میں پیدا ہوئے - 4 جون 1931 کو عمان میں انتقال کر گئے)⁩ پر انگریزی ویکیپیڈیا کا مضمون، 1908 سے مکہ کے شریف اور امیر، 1916 کی عظیم عرب بغاوت کے رہنما، حجاز کے بادشاہ، 24 مارچ 1949 میں تخت سے دستبردار ہونے تک؛ اس میں احمد زینی دحلان کے تحت اس کی پرورش اور تعلیم، اس کی اسیر مہم، میک موہن کی خط و کتابت، اس کا معاہدہ ورسائی سے انکار اور آرمینیائیوں کے تحفظ، ابن سعود کے ہاتھوں اس کی شکست، قبرص سے جلاوطنی، عمان واپسی، حرم الشریف میں موت اور تدفین کا ذکر ہے۔"
  tr: "El-Hüseyin bin Ali El-Haşimi (1853 veya 1854'te İstanbul'da doğdu – 4 Haziran 1931'de Amman'da vefat etti), 1908'den itibaren Mekke Şerifi ve Emiri, 1916'da Büyük Arap İsyanı'nın lideri, 1924'te tahttan çekilene kadar Hicaz kralı ve Mart 1924'te halife ilan edilen Al-Hüseyin bin Ali El-Haşimi hakkında İngilizce Wikipedia makalesi; Ahmed Zaini Dahlan'ın yanında yetiştirilmesi ve eğitimi, Asir'deki seferi, McMahon ile yazışmaları, Versay Antlaşması'nı reddetmesi, Ermeni koruma ilanı, İbn Suud karşısındaki yenilgisi, Kıbrıs'a sürgünü, Umman'a dönüşü, ölümü ve Kudüs'teki Asil Türbesi'ne defnedilmesi anlatılır."
  id: "Artikel Wikipedia berbahasa Inggris tentang Al-Hussein bin Ali Al-Hashimi (lahir di Istanbul pada 1853 atau 1854 – meninggal di Amman pada 4 Juni 1931), Sharif Mekah dan Emirnya sejak 1908, pemimpin Pemberontakan Arab Besar pada 1916, raja Hejaz hingga turun tahta pada 1924, dan dinyatakan sebagai khalifah pada Maret 1924; artikel ini menceritakan masa kecil dan pendidikannya di bawah Ahmed Zaini Dahlan, kampanyenya di Asir, korespondensinya dengan McMahon, penolakannya terhadap Perjanjian Versailles, deklarasi perlindungan Armenia, kekalahannya di hadapan Ibn Saud, pengasingannya ke Siprus, kepulangannya ke Oman, kematiannya, dan pemakamannya di Sanctuary Bangsawan di Yerusalem."
