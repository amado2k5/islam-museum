summary:
  ar: "مقالة ويكيبيديا العربية عن مارون النقاش؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في صيدا سنة 1817، وأباه الياس بن ميخائيل، وأخاه نقولا (في صندوق المعلومات)، ومسرحياته الثلاث: «البخيل» (1848) و«أبو الحسن المغفل وهارون الرشيد» (1850) و«الحسود السليط» (1853)، وإقامته في إيطاليا سنة 1846، وتحويله مسرحه إلى كنيسة قبيل وفاته إزاء اعتراضات المحافظين ورجال الدين، ووفاته في طرسوس في 1 يونيو 1855 إثر حمى."
  en: "Arabic Wikipedia article on Marun al-Naqqash; used for entity facts only. It gives his birth at Sidon in 1817 (year only), his father as Ilyas ibn Mikhail, his brother Nicolas (infobox), his three plays — al-Bakhil (1848), Abu al-Hasan al-Mughaffal wa-Harun al-Rashid (1850) and al-Hasud al-Salit (1853) — his 1846 stay in Italy, his conversion of his theatre into a church shortly before his death under pressure from conservatives and clergy, and his death at Tarsus on 1 June 1855 after a fever. It makes no statement naming his religion."
