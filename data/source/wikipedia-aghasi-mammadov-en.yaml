summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أغاسي مامادوف؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل أغاسي أغاغول أوغلو مامادوف، وميلاده في 1 يونيو 1980 في باكو، وتمثيله تركيا في أولمبياد سيدني 2000 ثم أذربيجان، ولقبه العالمي في وزن البانتام سنة 2003 وبرونزية أولمبياد أثينا 2004."
  en: "English Wikipedia article on Aghasi Mammadov; used for entity facts only. It gives his full name as Aghasi Aghagul oghlu Mammadov, his birth on 1 June 1980 in Baku, his years competing for Turkey including the Sydney 2000 Olympics and his return to Azerbaijan, his 2003 world bantamweight title and his bronze medal at the Athens 2004 Olympics."
  es: "Artículo de la Wikipedia en inglés sobre Aghasi Mammadov; utilizado únicamente para datos biográficos. Indica su nombre completo como Aghasi Aghagul oghlu Mammadov, su fecha de nacimiento el 1 de junio de 1980 en Bakú, sus años compitiendo por Turquía, incluyendo los Juegos Olímpicos de Sídney 2000 y su regreso a Azerbaiyán, su título mundial de peso gallo en 2003 y su medalla de bronce en los Juegos Olímpicos de Atenas 2004."
  fr: "Article Wikipédia en anglais sur Aghasi Mammadov; utilisé uniquement pour les informations le concernant. Il indique son nom complet: Aghasi Aghagul oghlu Mammadov, sa date de naissance: 1er juin 1980 à Bakou, ses années de compétition pour la Turquie, notamment les Jeux olympiques de Sydney en 2000 et son retour en Azerbaïdjan, son titre de champion du monde des poids coqs en 2003 et sa médaille de bronze aux Jeux olympiques d’Athènes en 2004."
  ur: "آغاسی ممدوف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا پورا نام آغاسی آغاگل اوغلو ممدوف بتایا گیا ہے، اس کی پیدائش 1 جون 1980 کو باکو میں، اس کے سال ترکی کے لیے مقابلہ کرتے ہوئے سڈنی 2000 اولمپکس اور آذربائیجان واپسی، اس کا 2003 کا عالمی بینٹم ویٹ ٹائٹل اور ایتھنز 2004 O میں کانسی کا تمغہ۔"
