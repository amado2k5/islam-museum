  ar: "مقالة ويكيبيديا الإنجليزية عن أغاسي مامادوف؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل أغاسي أغاغول أوغلو مامادوف، وميلاده في 1 يونيو 1980 في باكو، وتمثيله تركيا في أولمبياد سيدني 2000 ثم أذربيجان، ولقبه العالمي في وزن البانتام سنة 2003 وبرونزية أولمبياد أثينا 2004."
  en: "English Wikipedia article on Aghasi Mammadov; used for entity facts only. It gives his full name as Aghasi Aghagul oghlu Mammadov, his birth on 1 June 1980 in Baku, his years competing for Turkey including the Sydney 2000 Olympics and his return to Azerbaijan, his 2003 world bantamweight title and his bronze medal at the Athens 2004 Olympics."
