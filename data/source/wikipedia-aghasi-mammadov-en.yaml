reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The article carries a 'needs more sources' banner. Its infobox gives his full name, his birth on 1 June 1980 in Baku, and his medals: the 2003 world title and 2004 Olympic bronze for Azerbaijan, and the 2000 European title, 2001 world silver and 2001 Mediterranean gold for Turkey. Its text says he competed for Turkey for several years under the name Aghasi Aghaguloghlu, at Sydney 2000 among other events, and returned to Azerbaijan before the 2002 European Championships, beating Guillermo Rigondeaux at the 2003 worlds on the way to the title. The article names no religion or school for him anywhere, in text, infobox or categories."
