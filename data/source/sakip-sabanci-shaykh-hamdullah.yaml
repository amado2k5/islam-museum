  en: "Şeyh Hamdullah on the 500th Anniversary of His Death — Sakıp Sabancı Museum"
summary:
  ar: "صفحة متحف صاقب صابانجي ⁦(جامعة صابانجي)⁩ لمعرض الذكرى الخمسمئة لوفاة الشيخ حمد الله (2020): وُلد في أماسيا، وأبوه مصطفى دده شيخ الطريقة السهروردية، وتعلّم الأقلام الستة لدى خير الدين المرعشي، وعلّم الشاهزاده بايزيد الخط، وانتقل إلى إسطنبول سنة 1481، واعتزل بعد 1512، وتوفي سنة 926هـ/1520م."
  en: "Sakıp Sabancı Museum (Sabancı University) page for its 2020 exhibition marking the 500th anniversary of Şeyh Hamdullah's death: born in Amasya; his father Mustafa Dede was a sheikh of the Suhrawardiyya order; he studied the six scripts under Hayreddin Mar'ashi, taught Prince Bayezid calligraphy, moved to Istanbul in 1481, withdrew from society after 1512, and died in 926 AH/1520 CE per Müstakimzade's chronogram."
  es: "Página del Museo Sakıp Sabancı (Universidad Sabancı) para su exposición de 2020 que conmemora el 500 aniversario de la muerte de Şeyh Hamdullah: nació en Amasya; su padre, Mustafa Dede, fue un jeque de la orden Suhrawardiyya; estudió las seis escrituras con Hayreddin Mar'ashi, enseñó caligrafía al príncipe Bayezid, se mudó a Estambul en 1481, se retiró de la sociedad después de 1512 y murió en 926 AH/1520 CE según el cronograma de Müstakimzade."
  fr: "Page du musée Sakıp Sabancı (université Sabancı) pour son exposition de 2020 marquant le 500e anniversaire de la mort de Şeyh Hamdullah: né à Amasya; son père Mustafa Dede était un cheikh de l'ordre Suhrawardiyya; il étudia les six écritures sous Hayreddin Mar'ashi, enseigna la calligraphie au prince Bayezid, s'installa à Istanbul en 1481, se retira de la société après 1512 et mourut en 926 AH/1520 CE selon le chronogramme de Müstakimzade."
  ur: "Sakıp Sabancı میوزیم ⁦(Sabancı یونیورسٹی)⁩ کا صفحہ اپنی 2020 نمائش کے لیے جو Şeyh Hamdullah کی وفات کی 500 ویں برسی کے موقع پر: اماسیا میں پیدا ہوا؛ ان کے والد مصطفیٰ دیدے سہروردیہ کے شیخ تھے۔ اس نے حائرالدین مرعشی کے تحت چھ رسم الخط کا مطالعہ کیا، شہزادہ بایزید کو خطاطی سکھائی، 1481 میں استنبول چلے گئے، 1512 کے بعد معاشرے سے کنارہ کش ہو گئے، اور 926 ہجری/1520 عیسوی میں مستقیم زادے کی تاریخ کے مطابق وفات پائی۔"
  tr: "Saqib Sabancı Müzesi'nin (Sabancı Üniversitesi) Şeyh Hamdallah'ın ölümünün 500. yıl sergisi sayfası (2020): Amasya'da doğdu, babası Suhrawardi tarikatının şeyhi Mustafa Dede'ydi. Altı alfafeyi Khaireddin al-Maraşi'den, hat sanatını Prens Bayezid'den öğrendi, 1481'de İstanbul'a taşındı, 1512'den sonra emekli oldu ve 926 Hicri / 1520 yılında öldü."
  id: "Halaman Museum Saqib Sabancı (Universitas Sabancı) untuk pameran ulang tahun ke-500 kematian Sheikh Hamdallah (2020): Ia lahir di Amasya, ayahnya adalah Mustafa Dede, sheikh ordo Suhrawardi. Ia mempelajari enam aksara dari Khair al-Din al-Marashi, belajar kaligrafi dari Pangeran Bayezid, pindah ke Istanbul pada tahun 1481, pensiun setelah 1512, dan meninggal pada tahun 926 H / 1520 M."
