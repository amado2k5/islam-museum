summary:
  ar: "صفحة متحف صاقب صابانجي ⁦(جامعة صابانجي)⁩ لمعرض الذكرى الخمسمئة لوفاة الشيخ حمد الله (2020): وُلد في أماسيا، وأبوه مصطفى دده شيخ الطريقة السهروردية، وتعلّم الأقلام الستة لدى خير الدين المرعشي، وعلّم الشاهزاده بايزيد الخط، وانتقل إلى إسطنبول سنة 1481، واعتزل بعد 1512، وتوفي سنة 926هـ/1520م."
  en: "Sakıp Sabancı Museum (Sabancı University) page for its 2020 exhibition marking the 500th anniversary of Şeyh Hamdullah's death: born in Amasya; his father Mustafa Dede was a sheikh of the Suhrawardiyya order; he studied the six scripts under Hayreddin Mar'ashi, taught Prince Bayezid calligraphy, moved to Istanbul in 1481, withdrew from society after 1512, and died in 926 AH/1520 CE per Müstakimzade's chronogram."
