  ar: "مقالة ويكيبيديا الأردية «بخت خان»؛ تُستخدم لوقائع الكيان فقط. تصفه روهيليًا أفغانيًا من قبيلة يوسفزئي، وتذكر ولادته سنة 1793 في بريلي خلافًا للإنجليزية، وخدمته صوبدارًا في جيش الإنجليز ومشاركته في حرب الاستقلال سنة 1857، ووفاته جريحًا في غابات التراي في 13 مايو 1859."
  en: "Urdu Wikipedia article 'Bakht Khan'; used for entity facts only. It describes him as a Rohilla Afghan of the Yusufzai tribe, gives his birth in 1793 at Bareilly — against the English article's 1797 at Bijnor — recounts his service as a subedar in the British army and his part in the 1857 war of independence, and gives his death, wounded, in the Terai forests on 13 May 1859."
