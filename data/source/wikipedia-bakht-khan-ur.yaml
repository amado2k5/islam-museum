summary:
  ar: "مقالة ويكيبيديا الأردية «بخت خان»؛ تُستخدم لوقائع الكيان فقط. تصفه روهيليًا أفغانيًا من قبيلة يوسفزئي، وتذكر ولادته سنة 1793 في بريلي خلافًا للإنجليزية، وخدمته صوبدارًا في جيش الإنجليز ومشاركته في حرب الاستقلال سنة 1857، ووفاته جريحًا في غابات التراي في 13 مايو 1859."
  en: "Urdu Wikipedia article 'Bakht Khan'; used for entity facts only. It describes him as a Rohilla Afghan of the Yusufzai tribe, gives his birth in 1793 at Bareilly — against the English article's 1797 at Bijnor — recounts his service as a subedar in the British army and his part in the 1857 war of independence, and gives his death, wounded, in the Terai forests on 13 May 1859."
  es: "Artículo de Wikipedia en urdu titulado \"Bakht Khan\"; utilizado únicamente para datos sobre la persona. Lo describe como un afgano rohilla de la tribu Yusufzai, indica que nació en 1793 en Bareilly —en contraposición a lo que indica el artículo en inglés, que nace en 1797 en Bijnor—, relata su servicio como subedar en el ejército británico y su participación en la guerra de independencia de 1857, y menciona su muerte, herido, en los bosques de Terai el 13 de mayo de 1859."
  fr: "L'article de Wikipédia en ourdou intitulé « Bakht Khan » est utilisé uniquement à des fins d'information sur l'entité. Il le décrit comme un Afghan Rohilla de la tribu Yusufzai, indique sa naissance en 1793 à Bareilly (contrairement à l'article anglais qui mentionne 1797 et Bijnor), relate son service comme subedar dans l'armée britannique et son rôle dans la guerre d'indépendance de 1857, et mentionne sa mort, des suites de ses blessures, dans les forêts du Teraï le 13 mai 1859."
