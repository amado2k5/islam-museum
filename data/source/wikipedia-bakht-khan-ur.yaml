reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. The article is a short, largely unreferenced biography (its infobox is a misplaced template about the 1857 war as a whole, not about him). It gives his birth in 1793 at Bareilly, where the English article and Wikidata give 1797 and the English article gives Bijnor; its own categories file him under both 1797 and 1798 births. It gives his death on 13 May 1859 — a day no other source read states, so the record carries the year 1859 on which all sources agree. It names no legal school or order for him."
