title: "The Book of the Ten Treatises on the Eye, ascribed to Hunain ibn Is-haq (809-877 A.D.): the earliest existing systematic text-book of ophthalmology"
summary:
  ar: "طبعة ماكس مايرهوف للقاهرة 1928 للنص العربي في نسختين مخطوطتين فقط مع ترجمة إنجليزية ومسرد؛ يعنونها بأنها أقدم كتاب منهجي موجود في طب العيون."
  en: "Max Meyerhof's 1928 Cairo edition of the Arabic text of Hunayn's Ten Treatises on the Eye from the only two known manuscripts, with English translation and glossary; subtitled the earliest existing systematic textbook of ophthalmology."
  ur: "حنین بن اسحاق کی «کتاب العشر مقالات فی العین» کا قاہرہ 1928ء میں میکس مائرہوف کا ایڈیشن — صرف دو معلوم مخطوطوں سے عربی متن، انگریزی ترجمہ اور فرہنگ؛ اس پر «قدیم ترین موجود منظم نگہداشتِ نگاہ کا نصابی کتابچہ» لکھا ہے۔"
  es: "Edición de 1928 de Max Meyerhof, publicada en El Cairo, del texto árabe de los Diez tratados sobre el ojo de Hunayn, a partir de los dos únicos manuscritos conocidos, con traducción al inglés y glosario; subtitulada como el primer libro de texto sistemático de oftalmología existente."
  fr: "L'édition cairote de Max Meyerhof de 1928 du texte arabe des Dix Traités de l'œil de Hunayn, à partir des deux seuls manuscrits connus, avec traduction anglaise et glossaire; sous-titrée le plus ancien manuel systématique d'ophtalmologie existant."
  tr: "Max Meyerhoff'un Kahire tarihli Arapça metni 1928'de sadece iki el yazması kopyasında, İngilizce çevirisi ve sözlüğü ile birlikte yayımladığı bu metni göz hastalıklarında mevcut en eski metodolojik kitap olarak kabul ederler."
  id: "Edisi teks Arab Max Meyerhoff tahun 1928 di Kairo hanya dalam dua salinan manuskrip, dengan terjemahan bahasa Inggris dan glosarium; mereka menganggapnya sebagai buku metodologi tertua yang masih ada dalam bidang oftalmologi."
