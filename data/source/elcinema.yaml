summary: { en: "The leading Arabic film and television database; used for Arabic-world work identifiers, years and cast lists, cross-checked against a second source for dated facts.", ar: "أكبر قاعدة بيانات عربية للسينما والتلفزيون؛ تُستخدم لمعرّفات الأعمال العربية وسنواتها وقوائم ممثليها، وتُفحص كل واقعة مؤرّخة مقابل مصدر ثانٍ.", es: "La principal base de datos de cine y televisión árabe; se utiliza para identificar obras del mundo árabe, sus años de producción y listas de reparto, y se contrasta con una segunda fuente para verificar la veracidad de los datos.", fr: "La principale base de données de films et de séries télévisées arabes; utilisée pour identifier les œuvres du monde arabe, les années et les listes de distribution, vérifiée auprès d'une deuxième source pour les informations datées.", ur: "معروف عربی فلم اور ٹیلی ویژن ڈیٹا بیس؛ عربی دنیا کے کام کے شناخت کنندگان، سالوں اور کاسٹ کی فہرستوں کے لیے استعمال کیا جاتا ہے، تاریخ کے حقائق کے لیے دوسرے ماخذ کے خلاف کراس چیک کیا جاتا ہے۔", tr: "Arap sineması ve televizyon veritabanı; Arap eserlerinin tanımlayıcıları, yılları ve oyuncu listeleri için kullanılır ve her tarihli olayı ikincil bir kaynakla karşılaştırır.", id: "Basis data sinema dan televisi Arab terbesar; digunakan untuk pengenal karya Arab, tahunnya, dan daftar aktornya, serta memeriksa setiap peristiwa yang sudah bertanggal dengan sumber sekunder." }
