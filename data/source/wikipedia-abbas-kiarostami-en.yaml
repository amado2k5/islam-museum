summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عباس كيارستمي؛ تُستخدم لوقائع الكيان فقط. توثّق ميلاده في طهران في 22 يونيو 1940 ووفاته في باريس في 4 يوليو 2016، وتأسيسه قسم السينما في كانون، وثلاثية كوكر و«كلوز أب» و«طعم الكرز» الحائز السعفة الذهبية و«ستحملنا الريح» و«نسخة مصدّقة»، وأعماله شاعرًا ومصورًا، والنزاع حول علاجه ووفاته. لا تذكر المقالة أي دين له."
  en: "English Wikipedia article on Abbas Kiarostami; used for entity facts only. It records his birth in Tehran on 22 June 1940 and his death in Paris on 4 July 2016, his founding of the Kanoon film department, the Koker trilogy, Close-Up, the Palme d'Or-winning Taste of Cherry, The Wind Will Carry Us and Certified Copy, his work as a poet and photographer, and the dispute over his medical treatment and death. The article names no religion for him."
