reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Its infobox gives Abbas Kiarostami, born 22 June 1940 in Tehran, died 4 July 2016 in Paris aged 76, burial at Tok Mazra'eh Cemetery, Lavasan, education University of Tehran, spouse Parvin Amir-Gholi (m. 1969, div. 1982) and children Ahmad and Bahman; its text records his painting and graphic design studies, his 1960s advertising work, his founding of the film department at the Institute for the Intellectual Development of Children and Young Adults (Kanoon) and his first film The Bread and Alley (1970), Where Is the Friend's Home? (1987), the Koker trilogy and the 1990 Manjil–Rudbar earthquake, Close-Up (1990), Taste of Cherry (1997, Palme d'Or at Cannes), The Wind Will Carry Us (1999, Venice Grand Jury Prize), Ten (2002), Certified Copy (2010, his first film shot outside Iran) and Like Someone in Love (2012, Japan), his poetry collection Walking with the Wind, his decision to remain in Iran after the 1979 revolution with his 'rooted tree' statement, and his death in a Paris hospital after treatment in Tehran and Paris, followed by his family's formal complaint of medical maltreatment, which the prose carries attributed. No religion is named anywhere in the article, which is why his person record's faith segment is unknown."
