summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عباس كيارستمي؛ تُستخدم لوقائع الكيان فقط. توثّق ميلاده في طهران في 22 يونيو 1940 ووفاته في باريس في 4 يوليو 2016، وتأسيسه قسم السينما في كانون، وثلاثية كوكر و«كلوز أب» و«طعم الكرز» الحائز السعفة الذهبية و«ستحملنا الريح» و«نسخة مصدّقة»، وأعماله شاعرًا ومصورًا، والنزاع حول علاجه ووفاته. لا تذكر المقالة أي دين له."
  en: "English Wikipedia article on Abbas Kiarostami; used for entity facts only. It records his birth in Tehran on 22 June 1940 and his death in Paris on 4 July 2016, his founding of the Kanoon film department, the Koker trilogy, Close-Up, the Palme d'Or-winning Taste of Cherry, The Wind Will Carry Us and Certified Copy, his work as a poet and photographer, and the dispute over his medical treatment and death. The article names no religion for him."
  es: "Artículo de la Wikipedia en inglés sobre Abbas Kiarostami; utilizado únicamente para datos sobre la persona. En él se recogen su nacimiento en Teherán el 22 de junio de 1940 y su fallecimiento en París el 4 de julio de 2016, la fundación del departamento de cine Kanoon, la trilogía de Koker, Close-Up, El sabor de la cereza (ganadora de la Palma de Oro), El viento nos llevará y Copia certificada, su obra como poeta y fotógrafo, y la controversia en torno a su tratamiento médico y su muerte. El artículo no menciona ninguna religión suya."
  fr: "Article de Wikipédia en anglais sur Abbas Kiarostami; utilisé uniquement pour les informations le concernant. Il relate sa naissance à Téhéran le 22 juin 1940 et sa mort à Paris le 4 juillet 2016, la fondation du département cinéma de Kanoon, la trilogie de Koker, Close-Up, Le Goût de la cerise (Palme d'or), Le Vent nous emportera et Copie conforme, son œuvre de poète et de photographe, ainsi que la controverse entourant son traitement médical et sa mort. L'article ne mentionne pas sa religion."
  ur: "عباس کیاروستامی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 22 جون 1940 کو تہران میں ان کی پیدائش اور 4 جولائی 2016 کو پیرس میں ان کی موت، کانون فلم ڈپارٹمنٹ کی ان کی بانی، کوکر ٹرائیلوجی، کلوز اپ، دی پالم ڈی اور جیتنے والا ذائقہ چیری، دی ونڈ ول کیری یوز اور سرٹیفائیڈ کاپی، ان کا کام، ایک شاعر کے طور پر ان کا کام اور علاج اور تصویر کشی کے بارے میں ان کی موت کو ریکارڈ کیا گیا ہے۔ مضمون میں اس کے لیے کسی مذہب کا نام نہیں ہے۔"
