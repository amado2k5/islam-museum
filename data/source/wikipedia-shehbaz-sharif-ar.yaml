  ar: "مقالة ويكيبيديا العربية عن شهباز شريف؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 23 سبتمبر 1951، وانتخابه لعضوية جمعية البنجاب سنة 1988 والجمعية الوطنية سنة 1990، وولاياته الثلاث رئيسا لوزراء البنجاب، ومنفاه في السعودية بعد انقلاب 1999 وعودته سنة 2007، ورئاسته للوزراء. وليس فيها أي محتوى ديني."
  en: "Arabic Wikipedia article on Shehbaz Sharif; used for entity facts only. It gives his birth on 23 September 1951, his election to the Punjab Assembly in 1988 and the National Assembly in 1990, his three terms as chief minister of Punjab, his exile in Saudi Arabia after the 1999 coup and return in 2007, and his premierships. It has no religion content."
