summary:
  ar: "مقالة ويكيبيديا العربية عن شهباز شريف؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 23 سبتمبر 1951، وانتخابه لعضوية جمعية البنجاب سنة 1988 والجمعية الوطنية سنة 1990، وولاياته الثلاث رئيسا لوزراء البنجاب، ومنفاه في السعودية بعد انقلاب 1999 وعودته سنة 2007، ورئاسته للوزراء. وليس فيها أي محتوى ديني."
  en: "Arabic Wikipedia article on Shehbaz Sharif; used for entity facts only. It gives his birth on 23 September 1951, his election to the Punjab Assembly in 1988 and the National Assembly in 1990, his three terms as chief minister of Punjab, his exile in Saudi Arabia after the 1999 coup and return in 2007, and his premierships. It has no religion content."
  es: "Artículo de Wikipedia en árabe sobre Shehbaz Sharif; se utiliza únicamente para datos biográficos. Menciona su fecha de nacimiento (23 de septiembre de 1951), su elección a la Asamblea de Punjab en 1988 y a la Asamblea Nacional en 1990, sus tres mandatos como primer ministro de Punjab, su exilio en Arabia Saudí tras el golpe de Estado de 1999 y su regreso en 2007, así como sus cargos como primer ministro del estado. No contiene contenido religioso."
  fr: "Article de Wikipédia en arabe sur Shehbaz Sharif; utilisé uniquement à des fins d'information sur la personne. Il mentionne sa naissance le 23 septembre 1951, son élection à l'Assemblée du Pendjab en 1988 et à l'Assemblée nationale en 1990, ses trois mandats de ministre en chef du Pendjab, son exil en Arabie saoudite après le coup d'État de 1999 et son retour en 2007, ainsi que ses fonctions de Premier ministre. Il ne contient aucun élément religieux."
  ur: "شہباز شریف پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 23 ستمبر 1951 کو ان کی پیدائش، 1988 میں پنجاب اسمبلی اور 1990 میں قومی اسمبلی کے لیے ان کا انتخاب، پنجاب کے وزیر اعلیٰ کے طور پر ان کی تین مدتیں، 1999 کی بغاوت کے بعد سعودی عرب میں جلاوطنی اور 2007 میں واپسی، اور ان کی وزارت عظمیٰ شامل ہیں۔ اس میں کوئی مذہبی مواد نہیں ہے۔"
