summary:
  ar: "مقالة ويكيبيديا العربية عن القارئ محمد جبريل؛ لوقائع الكيان فقط: مولده في طحوريا بشبين القناطر في 1964، وتخرجه في الشريعة والقانون بالأزهر، وإمامته التراويح في مسجد عمرو بن العاص من 1988 إلى 2015، وتأسيسه دار أبيّ بن كعب في 1996، وبرامجه التلفزيونية، وقرار وزارة الأوقاف بمنعه في يوليو 2015 ومنعه من السفر، وحكم القضاء الإداري في 27 أكتوبر 2015؛ وتستند إلى اليوم السابع."
  en: "Arabic Wikipedia article on the reciter Muhammad Jebril; entity facts only: birth at Tahouria, Shibin al-Qanatir, in 1964, a degree in Sharia and law from al-Azhar, leading the tarawih at the Mosque of Amr ibn al-As from 1988 to 2015, founding Dar Ubayy ibn Ka'b in 1996, his television programmes, the Ministry of Awqaf's ban of July 2015 and the travel ban, and the administrative court ruling of 27 October 2015; it cites Youm7."
  es: "Artículo de Wikipedia en árabe sobre el recitador Muhammad Jebril; solo datos sobre la entidad: nacimiento en Tahouria, Shibin al-Qanatir, en 1964, título en Sharia y derecho de al-Azhar, dirección del tarawih en la Mezquita de Amr ibn al-As de 1988 a 2015, fundación de Dar Ubayy ibn Ka'b en 1996, sus programas de televisión, la prohibición del Ministerio de Awqaf de julio de 2015 y la prohibición de viajar, y el fallo del tribunal administrativo del 27 de octubre de 2015; cita Youm7."
  fr: "Article de Wikipédia en arabe sur le récitant Muhammad Jebril; faits concernant l'entité uniquement: naissance à Tahouria, Shibin al-Qanatir, en 1964, un diplôme en charia et en droit d'al-Azhar, direction des prières de tarawih à la mosquée d'Amr ibn al-As de 1988 à 2015, fondation de Dar Ubayy ibn Ka'b en 1996, ses émissions de télévision, l'interdiction du ministère des Awqaf de juillet 2015 et l'interdiction de voyager, et la décision du tribunal administratif du 27 octobre 2015; il cite Youm7."
  ur: "قاری محمد جبریل پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: طہوریہ میں پیدائش، شبین القناطیر، 1964 میں، الازہر سے شریعت اور قانون کی ڈگری، 1988 سے 2015 تک مسجد عمرو ابن العاص میں تراویح کی امامت کی، دار ابی ابن کعب کی بنیاد رکھی، جو جولائی 1996 میں اپنے ٹیلی ویژن کے پروگرام Abayyabn Kaab کی بنیاد رکھی۔ 2015 اور سفری پابندی، اور 27 اکتوبر 2015 کا انتظامی عدالت کا فیصلہ؛ یہ Youm7 کا حوالہ دیتا ہے۔"
