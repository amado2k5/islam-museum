summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0639\u0646 \u0627\u0644\u0642\u0627\u0631\u0626 \u0645\u062d\u0645\u062f \u062c\u0628\u0631\u064a\u0644\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u0637\u062d\u0648\u0631\u064a\u0627 \u0628\u0634\u0628\u064a\u0646 \u0627\u0644\u0642\u0646\u0627\u0637\u0631 \u0641\u064a 1964\u060c \u0648\u062a\u062e\u0631\u062c\u0647 \u0641\u064a \u0627\u0644\u0634\u0631\u064a\u0639\u0629 \u0648\u0627\u0644\u0642\u0627\u0646\u0648\u0646 \u0628\u0627\u0644\u0623\u0632\u0647\u0631\u060c \u0648\u0625\u0645\u0627\u0645\u062a\u0647 \u0627\u0644\u062a\u0631\u0627\u0648\u064a\u062d \u0641\u064a \u0645\u0633\u062c\u062f \u0639\u0645\u0631\u0648 \u0628\u0646 \u0627\u0644\u0639\u0627\u0635 \u0645\u0646 1988 \u0625\u0644\u0649 2015\u060c \u0648\u062a\u0623\u0633\u064a\u0633\u0647 \u062f\u0627\u0631 \u0623\u0628\u064a\u0651 \u0628\u0646 \u0643\u0639\u0628 \u0641\u064a 1996\u060c \u0648\u0628\u0631\u0627\u0645\u062c\u0647 \u0627\u0644\u062a\u0644\u0641\u0632\u064a\u0648\u0646\u064a\u0629\u060c \u0648\u0642\u0631\u0627\u0631 \u0648\u0632\u0627\u0631\u0629 \u0627\u0644\u0623\u0648\u0642\u0627\u0641 \u0628\u0645\u0646\u0639\u0647 \u0641\u064a \u064a\u0648\u0644\u064a\u0648 2015 \u0648\u0645\u0646\u0639\u0647 \u0645\u0646 \u0627\u0644\u0633\u0641\u0631\u060c \u0648\u062d\u0643\u0645 \u0627\u0644\u0642\u0636\u0627\u0621 \u0627\u0644\u0625\u062f\u0627\u0631\u064a \u0641\u064a 27 \u0623\u0643\u062a\u0648\u0628\u0631 2015\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0627\u0644\u064a\u0648\u0645 \u0627\u0644\u0633\u0627\u0628\u0639."
  en: "Arabic Wikipedia article on the reciter Muhammad Jebril; entity facts only: birth at Tahouria, Shibin al-Qanatir, in 1964, a degree in Sharia and law from al-Azhar, leading the tarawih at the Mosque of Amr ibn al-As from 1988 to 2015, founding Dar Ubayy ibn Ka'b in 1996, his television programmes, the Ministry of Awqaf's ban of July 2015 and the travel ban, and the administrative court ruling of 27 October 2015; it cites Youm7."
