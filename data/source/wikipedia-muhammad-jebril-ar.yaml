summary:
  ar: "مقالة ويكيبيديا العربية عن القارئ محمد جبريل؛ لوقائع الكيان فقط: مولده في طحوريا بشبين القناطر في 1964، وتخرجه في الشريعة والقانون بالأزهر، وإمامته التراويح في مسجد عمرو بن العاص من 1988 إلى 2015، وتأسيسه دار أبيّ بن كعب في 1996، وبرامجه التلفزيونية، وقرار وزارة الأوقاف بمنعه في يوليو 2015 ومنعه من السفر، وحكم القضاء الإداري في 27 أكتوبر 2015؛ وتستند إلى اليوم السابع."
  en: "Arabic Wikipedia article on the reciter Muhammad Jebril; entity facts only: birth at Tahouria, Shibin al-Qanatir, in 1964, a degree in Sharia and law from al-Azhar, leading the tarawih at the Mosque of Amr ibn al-As from 1988 to 2015, founding Dar Ubayy ibn Ka'b in 1996, his television programmes, the Ministry of Awqaf's ban of July 2015 and the travel ban, and the administrative court ruling of 27 October 2015; it cites Youm7."
