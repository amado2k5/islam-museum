summary:
  ar: "مقال الإنجليزية عن سي قدور بن غبريط (1868-1954): تعليمه في الثعلبية والقرويين، خدمته مترجماً ودبلوماسياً لفرنسا ورئيس بروتوكول لسلطان المغرب، تأسيسه مسجد باريس الكبير ورئاسته له، إنقاذه اليهود في الحرب العالمية الثانية، ودفنه شمال المسجد وفق الشعائر المالكية."
  en: "English encyclopedia article on Si Kaddour Benghabrit (1868-1954): his education at the Thaalibiya and al-Karaouine, his service as French interpreter-diplomat and the Sultan of Morocco's head of protocol, his founding and rectorship of the Grand Mosque of Paris, his rescue of Jews in the Second World War, and his burial north of the mosque according to the Maliki rite."
  es: "Artículo de enciclopedia inglesa sobre Si Kaddour Benghabrit (1868-1954): su educación en Thaalibiya y al-Karaouine, su servicio como intérprete y diplomático francés y jefe de protocolo del sultán de Marruecos, la fundación y rectorado de la Gran Mezquita de París, el rescate de judíos durante la Segunda Guerra Mundial y su entierro al norte de la mezquita según el rito malikí."
  fr: "Article d'encyclopédie anglaise sur Si Kaddour Benghabrit (1868-1954): son éducation à Thaalibiya et al-Karaouine, son service en tant qu'interprète-diplomate français et chef du protocole du sultan du Maroc, sa fondation et son rectorat de la Grande Mosquée de Paris, son sauvetage de Juifs pendant la Seconde Guerre mondiale et son enterrement au nord de la mosquée selon le rite malikite."
  ur: "سی کدور بنگھبریت (1868-1954) پر انگریزی انسائیکلوپیڈیا کا مضمون: ثعلبیہ اور الکراوین میں ان کی تعلیم، فرانسیسی مترجم-سفارت کار اور مراکش کے سلطان کے پروٹوکول کے سربراہ کے طور پر ان کی خدمات، پیرس کی گرینڈ مسجد کی ان کی بانی اور سرپرستی، اس کا یہودیوں کا بچاؤ، دوسری عالمی جنگ کے مطابق شمالی مسجد میں یہودیوں کو بچانے کے لیے۔"
