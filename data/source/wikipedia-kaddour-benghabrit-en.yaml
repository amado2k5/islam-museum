  ar: "مقال الإنجليزية عن سي قدور بن غبريط (1868-1954): تعليمه في الثعلبية والقرويين، خدمته مترجماً ودبلوماسياً لفرنسا ورئيس بروتوكول لسلطان المغرب، تأسيسه مسجد باريس الكبير ورئاسته له، إنقاذه اليهود في الحرب العالمية الثانية، ودفنه شمال المسجد وفق الشعائر المالكية."
  en: "English encyclopedia article on Si Kaddour Benghabrit (1868-1954): his education at the Thaalibiya and al-Karaouine, his service as French interpreter-diplomat and the Sultan of Morocco's head of protocol, his founding and rectorship of the Grand Mosque of Paris, his rescue of Jews in the Second World War, and his burial north of the mosque according to the Maliki rite."
