summary:
  ar: "قناة محمد علي على يوتيوب (@MuhammadAlichannel)، وهو معلّم ومدرّب وخطيب تحفيزي مرتبط بـ«يوث كلوب» باكستان؛ تنشر القناة بياناته وسلسلة «بودكاست محمد علي» ومحاضراته الموجهة للشباب بالأردية، وهي مصدر أولي لهويته وعمله وانتشاره، لا مصدر مستقل مؤيد. هو غير الملاكم محمد علي وغير المهندس محمد علي ميرزا."
  en: "The YouTube channel of Muhammad Ali (@MuhammadAlichannel), a teacher, trainer and motivational speaker associated with Youth Club Pakistan; it publishes his Urdu reminders, his 'MA Podcast' series and his youth lectures. A primary source for his identity, work and reach, not independent corroboration. He is not the boxer Muhammad Ali and not Engineer Muhammad Ali Mirza."
  es: "El canal de YouTube de Muhammad Ali (@MuhammadAlichannel), profesor, formador y orador motivacional asociado al Club Juvenil de Pakistán, publica sus recordatorios en urdu, su serie de podcasts «MA Podcast» y sus charlas para jóvenes. Es una fuente primaria sobre su identidad, trabajo y alcance, pero no una corroboración independiente. No se trata del boxeador Muhammad Ali ni del ingeniero Muhammad Ali Mirza."
  fr: "La chaîne YouTube de Muhammad Ali (@MuhammadAlichannel), enseignant, formateur et conférencier motivateur associé au Youth Club Pakistan, publie ses rappels en ourdou, sa série de podcasts « MA Podcast » et ses conférences pour les jeunes. Il s'agit d'une source primaire concernant son identité, son travail et son influence, mais non d'une vérification indépendante. Il ne s'agit ni du boxeur Muhammad Ali, ni de l'ingénieur Muhammad Ali Mirza."
  ur: "محمد علی (@MuhammadAlichannel) کا یوٹیوب چینل، جو کہ یوتھ کلب پاکستان سے وابستہ استاد، ٹرینر اور موٹیویشنل سپیکر ہے۔ یہ ان کی اردو یاد دہانیوں، ان کی 'ایم اے پوڈ کاسٹ' سیریز اور ان کے نوجوانوں کے لیکچرز شائع کرتا ہے۔ اس کی شناخت، کام اور رسائی کا بنیادی ذریعہ، آزاد تصدیق نہیں۔ وہ باکسر محمد علی نہیں انجینئر محمد علی مرزا نہیں ہیں۔"
