  ar: "قناة محمد علي على يوتيوب (@MuhammadAlichannel)، وهو معلّم ومدرّب وخطيب تحفيزي مرتبط بـ«يوث كلوب» باكستان؛ تنشر القناة بياناته وسلسلة «بودكاست محمد علي» ومحاضراته الموجهة للشباب بالأردية، وهي مصدر أولي لهويته وعمله وانتشاره، لا مصدر مستقل مؤيد. هو غير الملاكم محمد علي وغير المهندس محمد علي ميرزا."
  en: "The YouTube channel of Muhammad Ali (@MuhammadAlichannel), a teacher, trainer and motivational speaker associated with Youth Club Pakistan; it publishes his Urdu reminders, his 'MA Podcast' series and his youth lectures. A primary source for his identity, work and reach, not independent corroboration. He is not the boxer Muhammad Ali and not Engineer Muhammad Ali Mirza."
