summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألبوم «بركة» لسامي يوسف؛ لوقائع الكيان فقط: صدوره في 1 فبراير 2016 عن أندانتي ريكوردز، وكونه المجلد الأول من مجموعة «سبيريتيك»، ومصوّراته، وقائمة أغانيه؛ تستند إلى آي تيونز وصحيفة ذا ناشونال."
  en: "English Wikipedia article on Sami Yusuf's album Barakah; entity facts only: its release on 1 February 2016 by Andante Records, its billing as volume 1 of the Spiritique Collection, its videos and its track list; it cites iTunes and The National."
  es: "Artículo de la Wikipedia en inglés sobre el álbum Barakah de Sami Yusuf; solo datos sobre la entidad: su lanzamiento el 1 de febrero de 2016 por Andante Records, su presentación como volumen 1 de la Spiritique Collection, sus videos y su lista de canciones; cita a iTunes y The National."
  fr: "Article de Wikipédia en anglais sur l'album Barakah de Sami Yusuf; informations uniquement sur l'entité: sa sortie le 1er février 2016 par Andante Records, sa présentation comme volume 1 de la Spiritique Collection, ses vidéos et sa liste de titres; il cite iTunes et The National."
  ur: "سمیع یوسف کے البم برقہ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: Andante Records کے ذریعہ 1 فروری 2016 کو اس کی ریلیز، Spiritique Collection کے والیم 1 کے طور پر اس کی بلنگ، اس کے ویڈیوز اور اس کی ٹریک لسٹ؛ یہ آئی ٹیونز اور دی نیشنل کا حوالہ دیتا ہے۔"
  tr: "Sami Youssef'in \"Baraka\" albümü hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için: 1 Şubat 2016'da Andante Records tarafından yayımlandı ve \"Spiritic\" koleksiyonunun, görüntü yönetmenlerinin ve parça listesinin ilk cildi; iTunes ve The National gazetesine dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang album Sami Youssef \"Baraka\"; hanya untuk fakta entitas: dirilis pada 1 Februari 2016 oleh Andante Records, dan merupakan volume pertama dari koleksi \"Spiritic\", sinematografernya, dan daftar lagunya; berdasarkan iTunes dan surat kabar The National."
