label: { ar: "نورهان الشيخ — خبر تواصل نيوز عن برنامج «قصة من نور»", en: "Nourhan El-Sheikh — Twasl News item on her programme 'Qissa min Nur'" }
summary:
  ar: "خبر في موقع تواصل نيوز نقلًا عن موقع البلد (elbalad.news)، منشور في 25 أكتوبر 2026، يعلن أن الإعلامية نورهان الشيخ تقدّم برنامج «قصة من نور» على قناة النهار لايف يومي السبت والأحد في السادسة والنصف مساء، وأنه يقدّم السيرة النبوية من منظور يبرز أخلاق النبي ورحمته وإنسانيته."
  en: "A news item on the Twasl News site, sourced from elbalad.news and published 25 October 2026, announcing that the media presenter Nourhan El-Sheikh presents the programme 'Qissa min Nur' (A Story of Light) on Al Nahar Live on Saturdays and Sundays at 6.30 p.m., presenting the Prophetic biography from a perspective highlighting the Prophet's ethics, mercy and humanity."
  es: "Una noticia publicada en el sitio web Twasl News, procedente de elbalad.news y con fecha del 25 de octubre de 2026, anuncia que la presentadora Nourhan El-Sheikh presenta el programa 'Qissa min Nur' (Una historia de luz) en Al Nahar Live los sábados y domingos a las 18:30, presentando la biografía profética desde una perspectiva que destaca la ética, la misericordia y la humanidad del Profeta."
  fr: "Un article du site Twasl News, provenant d'elbalad.news et publié le 25 octobre 2026, annonce que le présentateur Nourhan El-Sheikh présente l'émission « Qissa min Nur » (Une histoire de lumière) sur Al Nahar Live les samedis et dimanches à 18h30, présentant la biographie du Prophète sous un angle mettant en lumière son éthique, sa miséricorde et son humanité."
title: "نورهان الشيخ تبدأ تجربة إعلامية جديدة عبر «النهار لايف»"
