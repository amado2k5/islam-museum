summary:
  ar: "خبر في موقع تواصل نيوز نقلًا عن موقع البلد (elbalad.news)، منشور في 25 أكتوبر 2026، يعلن أن الإعلامية نورهان الشيخ تقدّم برنامج «قصة من نور» على قناة النهار لايف يومي السبت والأحد في السادسة والنصف مساء، وأنه يقدّم السيرة النبوية من منظور يبرز أخلاق النبي ورحمته وإنسانيته."
  en: "A news item on the Twasl News site, sourced from elbalad.news and published 25 October 2026, announcing that the media presenter Nourhan El-Sheikh presents the programme 'Qissa min Nur' (A Story of Light) on Al Nahar Live on Saturdays and Sundays at 6.30 p.m., presenting the Prophetic biography from a perspective highlighting the Prophet's ethics, mercy and humanity."
