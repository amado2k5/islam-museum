  ar: "مقالة ويكيبيديا الإنجليزية عن متين غوراك ⁦(وُلد في 20 آب 1960 في كيزيلتبه بماردين)⁩، رئيس الأركان العامة التركية الحادي والثلاثين ⁦(آب 2023 – آب 2025)⁩؛ تذكر تخرجه في الأكاديمية العسكرية 1981 وقياداته حتى قيادة الجيش الثاني."
  en: "English Wikipedia article on Metin Gürak (born 20 August 1960 in Kızıltepe, Mardin), the 31st chief of the Turkish General Staff (August 2023 to August 2025); it records his 1981 Military Academy graduation and his commands up to the Second Army."
  es: "Artículo de la Wikipedia en inglés sobre Metin Gürak (nacido el 20 de agosto de 1960 en Kızıltepe, Mardin), el 31.º jefe del Estado Mayor turco (de agosto de 2023 a agosto de 2025); en él se recoge su graduación en la Academia Militar en 1981 y sus mandos hasta el Segundo Ejército."
  fr: "Article de Wikipédia en anglais sur Metin Gürak (né le 20 août 1960 à Kızıltepe, Mardin), le 31e chef d'état-major général turc (août 2023 à août 2025); il relate sa remise de diplôme de l'Académie militaire en 1981 et ses commandements jusqu'à la Deuxième Armée."
  ur: "Metin Gürak ⁦(پیدائش 20 اگست 1960 Kızıltepe, Mardin)⁩ پر انگریزی ویکیپیڈیا کا مضمون، ترکی کے جنرل اسٹاف کے 31 ویں چیف ⁦(اگست 2023 سے اگست 2025)⁩؛ اس میں ان کی 1981 کی ملٹری اکیڈمی سے گریجویشن اور سیکنڈ آرمی تک ان کی کمانڈز کو ریکارڈ کیا گیا ہے۔"
  tr: "Türk Genelkurmay Başkanı (Ağustos 2023 – Ağustos 2025) Metin Gürak (20 Ağustos 1960, Kızıltepe, Mardin) hakkında İngilizce Wikipedia makalesi; 1981'de Askeri Akademi'den mezun olmasından ve İkinci Ordu komutanlığına kadar olan liderliğinden bahsedilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Metin Gürak (lahir 20 Agustus 1960, di Kızıltepe, Mardin), Kepala Staf Umum Turki ke-31 (Agustus 2023 – Agustus 2025); artikel tersebut menyebutkan kelulusannya dari Akademi Militer pada tahun 1981 dan kepemimpinannya hingga komando Angkatan Darat Kedua."
