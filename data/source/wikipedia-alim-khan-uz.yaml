summary:
  ar: "مقالة ويكيبيديا الأوزبكية عن سعيد عالم خان، آخر حكام المنغيط في بخارى؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 3 يناير 1880 ووفاته في 28 أبريل 1944 في قلعة فوتو بكابل، ولا يوجد فيها حقل للدين."
  en: "Uzbek Wikipedia article on Said Olimxon, the last Manghud ruler of Bukhara; used for entity facts only. It gives his birth on 3 January 1880 and his death on 28 April 1944 at Qal'ayi Fotu in Kabul, and carries no religion field."
  es: "Artículo de Wikipedia en uzbeko sobre Said Olimxon, el último gobernante manghud de Bujará; utilizado únicamente para datos sobre la persona. Indica que nació el 3 de enero de 1880 y falleció el 28 de abril de 1944 en Qal'ayi Fotu, Kabul, y no incluye información sobre su religión."
  fr: "L'article de Wikipédia en ouzbek sur Saïd Olimxon, dernier souverain manghud de Boukhara, est utilisé uniquement à titre informatif. Il indique sa naissance le 3 janvier 1880 et sa mort le 28 avril 1944 à Qal'ayi Fotu, près de Kaboul, et ne mentionne pas sa religion."
  ur: "بخارا کے آخری منگھود حکمران سید اولمکسن پر ازبک ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 3 جنوری 1880 کو ان کی پیدائش اور 28 اپریل 1944 کو کابل میں قلعہ فوتو میں ان کی موت ہوئی، اور اس کا کوئی مذہب نہیں ہے۔"
  tr: "Buhara'daki Mangit'in son hükümdarı Said Alam Han hakkında Özbek Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 3 Ocak 1880'de doğduğu ve 28 Nisan 1944'te Kabil'deki Futu Kalesi'nde öldüğü belirtilmektedir; orada dini bir alan yoktur."
  id: "Artikel Wikipedia Uzbekistan tentang Said Alam Khan, penguasa terakhir Mangit di Bukhara; digunakan hanya untuk fakta entitas. Ia disebutkan lahir pada 3 Januari 1880, dan meninggal pada 28 April 1944 di Benteng Futu di Kabul, dan tidak ada lapangan keagamaan di sana."
