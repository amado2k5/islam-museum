reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026), read through the MediaWiki API at revision 76928391 on 1 November 2026. Gives: born in the village of Mishal (Basyun district, Gharbia) on Friday 29 Rajab 1352 / 17 November 1933; BSc with honours, Faculty of Science, Cairo University, 1955 (Baraka prize in earth sciences); PhD in earth sciences, University of Wales, 1963; professor 1972; posts at King Saud University, Kuwait University, Qatar University, King Fahd University of Petroleum and Minerals (1978-1996), visiting professor at UCLA (1977-1978), head of al-Ahqaf University in Yemen (1999-2000), chair of the committee on scientific miracles of the Qur'an at Egypt's Supreme Council for Islamic Affairs (from 2001); founding member of the International Commission on Scientific Signs in the Qur'an and Sunna (Muslim World League, Mecca); weekly al-Ahram column 'Min Asrar al-Qur'an'; detained after a political demonstration and refused a university post for his membership of the Muslim Brotherhood; died in Amman on Sunday 18 Jumada al-Ula 1447 / 9 November 2025 and buried in the Umm al-Qutayn cemetery, Na'ur. The extract read names no school (madhhab or creed) for him. Recorded in docs/authenticity-ledger/pages/wikipedia-zaghloul-el-naggar-ar.yaml."
