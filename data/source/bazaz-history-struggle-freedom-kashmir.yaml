label:
  en: "Prem Nath Bazaz, The History of Struggle for Freedom in Kashmir (1954)"
summary:
  ar: "كتاب بريم ناث بازاز «تاريخ نضال الحرية في كشمير» (1954): يروي فيه — وهو معاصر عرف آزاد — أن موت ابن الشاعر ذي الأربع سنوات وهو مُنقَل في ترال جعله شكّاكاً عقلانياً ومضى به نحو اللاأدرية، وأنه شرع بعدها يشكّك في الحاجة إلى الدين وعصمة الكتب ووجود الله."
  en: "Prem Nath Bazaz's 1954 history of the Kashmir freedom struggle: Bazaz, who knew Azad from 1942, writes that the death of the poet's four-year-old son, which he could not attend while posted at Tral, made him a skeptic and a rationalist on the way to agnosticism, and that he went on to question the need of religion, the infallibility of scriptures and the existence of God."
  es: "En su obra de 1954 sobre la lucha por la libertad de Cachemira, Prem Nath Bazaz, quien conocía a Azad desde 1942, escribe que la muerte del hijo de cuatro años del poeta, a la que no pudo asistir mientras estaba destinado en Tral, lo convirtió en un escéptico y un racionalista en vías del agnosticismo, y que llegó a cuestionar la necesidad de la religión, la infalibilidad de las escrituras y la existencia de Dios."
  fr: "Dans son ouvrage de 1954 sur l'histoire de la lutte pour la liberté du Cachemire, Prem Nath Bazaz écrit: Bazaz, qui connaissait Azad depuis 1942, raconte que la mort du fils de quatre ans du poète, à laquelle il n'a pu assister pendant son affectation à Tral, a fait de lui un sceptique et un rationaliste sur la voie de l'agnosticisme, et qu'il a ensuite remis en question la nécessité de la religion, l'infaillibilité des écritures et l'existence de Dieu."
  ur: "پریم ناتھ بزاز کی 1954 کی کشمیر کی جدوجہد آزادی کی تاریخ: بزاز، جو آزاد کو 1942 سے جانتے تھے، لکھتے ہیں کہ شاعر کے چار سالہ بیٹے کی موت، جس میں وہ ترال میں تعیناتی کے دوران حاضر نہیں ہو سکے تھے، نے اسے ایک شکی اور عقلیت پسند بنا دیا تھا کہ وہ اجناسیت کی راہ پر گامزن ہو گئے، اور یہ کہ وہ مذہب کی ضرورت اور اس کے وجود پر سوالیہ نشان لگا رہے تھے۔ خدا"
  tr: "Prem Nath Bazaz'ın 'Keşmir'de Özgürlük Mücadelesinin Tarihi' (1954) adlı kitabında, Azad'ın çağdaşı olarak, şairin dört yaşındaki oğlunun ölümünün Tral'da çevirmen olduğunu anlatır; bu kişi onu mantıklı bir şüpheci haline getirmiş ve agnostisizme yöneltmiştir; ardından dinin gerekliliğini, kitapların yanılmazlığını ve Tanrı'nın varlığını sorgulamaya başlamıştır."
  id: "Buku Prem Nath Bazaz 'The History of the Freedom Struggle in Kashmir' (1954): di dalamnya, ia menceritakan—sezaman Azad—bahwa kematian putra penyair yang berusia empat tahun, yang merupakan penerjemah dalam bahasa Tral, membuatnya menjadi skeptis rasional dan membawanya ke arah agnostisisme, dan kemudian ia mulai mempertanyakan perlunya agama, ketidaksalahan buku, dan keberadaan Tuhan."
