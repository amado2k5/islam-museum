summary:
  ar: "كتاب بريم ناث بازاز «تاريخ نضال الحرية في كشمير» (1954): يروي فيه — وهو معاصر عرف آزاد — أن موت ابن الشاعر ذي الأربع سنوات وهو مُنقَل في ترال جعله شكّاكاً عقلانياً ومضى به نحو اللاأدرية، وأنه شرع بعدها يشكّك في الحاجة إلى الدين وعصمة الكتب ووجود الله."
  en: "Prem Nath Bazaz's 1954 history of the Kashmir freedom struggle: Bazaz, who knew Azad from 1942, writes that the death of the poet's four-year-old son, which he could not attend while posted at Tral, made him a skeptic and a rationalist on the way to agnosticism, and that he went on to question the need of religion, the infallibility of scriptures and the existence of God."
