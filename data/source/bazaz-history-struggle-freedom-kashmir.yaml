reliability_note: "Participant-historian's history, read in the full Internet Archive scan of the 1954 Kashmir Publishing Company edition; the Azad passage stands at pp. 299–300. Bazaz writes of the son's death: 'He became a skeptic and a rationalist and though he did not confess it even to himself he was on way to agnosticism', and of the phase that followed: 'He questioned the need of religion, the infallibility of scriptures and the existence of God.' This book — not Bazaz's Inside Kashmir (1941), whose full text contains no passage on Azad at all — is the origin of the 'skeptic, a rationalist' reading repeated in the English Wikipedia biography. A partisan contemporary account, used for Bazaz's own attested reading of Azad's crisis, not alone for dates."
