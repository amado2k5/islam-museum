reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The fullest treatment of his career: born 1 June 1839 at Frashër, died 23 October 1892 at Istanbul (the German and Turkish articles and Wikidata give 17 August 1839 and 11 October 1892 — recorded as conflicts, the record following this article with the English and Arabic articles); eldest of the eight children of Halit Bey Frashëri (1797–1859) and Emine (1814–1861); the family 'ndër familjet e shquara shqiptare myslimane të lidhura me tarikatin bektashi' — among the distinguished Albanian Muslim families connected with the Bektashi tariqa (family background, as elsewhere); lived some twenty years at Ioannina in Ottoman administrative posts; deputy for Yanina in the first constitutional parliament (1876–1877); organised the Janina committee (1877) and chaired the Central Committee for Defending Albanian Rights (1877); with his brother Naim and others prepared the League of Prizren (10 June 1878) and chaired its foreign affairs committee; the assembly at the Frashër tekke; led the 1879 delegation to the European capitals; drafted the autonomy programme at Gjirokastër; spokesman of the provisional government (1881); captured by Dervish Pasha, court-martialled and sentenced to death, commuted to hard-labour imprisonment (Prizren, 1882–1885), released 1886 and settled in Istanbul under surveillance, where he died. No statement in the article attests his own adherence to the order, and none is recorded."
