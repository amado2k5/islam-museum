summary:
  ar: "وثيقة «A Reference Grammar of Modern Standard Arabic»، Cambridge University Press (PDF copy on imamhamzatcoed.edu.ng). لم يفتح المتحف هذا المرجع بنفسه؛ عُرف ما قيل عنه من ملخص بحثي قدّمه المؤسس إلى المتحف ووافق على استعماله في 21 نوفمبر 2026. يُستشهد به في: الفروق بين فصحى التراث وفصحى العصر، نحو الفصحى المعاصرة، أوزان الفعل المزيد، الأسماء المشتقة، الإعراب، المثنى والجمع، العدد من ثلاثة إلى عشرة، الممنوع من الصرف، المراجع المتخصصة في اللهجات."
  en: "The document \"A Reference Grammar of Modern Standard Arabic\" (Cambridge University Press (PDF copy on imamhamzatcoed.edu.ng)). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum by the founder, who approved its use on 21 November 2026. Cited for: the differences between Classical and Modern Standard Arabic, the grammar of Modern Standard Arabic, the verb forms, derived nouns, case endings, the dual and the plural, the numbers three to ten, diptotes, specialist reference works on the dialects."
  ur: "دستاویز «A Reference Grammar of Modern Standard Arabic»، Cambridge University Press (PDF copy on imamhamzatcoed.edu.ng)۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ بانی کے فراہم کردہ تحقیقی خلاصے سے ہے، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ ان کے لیے دیا گیا: کلاسیکی اور جدید معیاری عربی کے فرق، جدید معیاری عربی کی قواعد، افعال کے اوزان، مشتق اسماء، اعراب، مثنیٰ اور جمع، تین سے دس تک کے اعداد، ممنوع من الصرف، بولیوں پر ماہرانہ مراجع۔"
  fr: "Le document « A Reference Grammar of Modern Standard Arabic » (Cambridge University Press (PDF copy on imamhamzatcoed.edu.ng)). Le musée ne l'a pas ouvert lui-même : ce qu'on en sait vient d'un résumé de recherche fourni au musée par le fondateur, qui en a approuvé l'usage le 21 novembre 2026. Cité pour : les différences entre l'arabe classique et l'arabe standard moderne, la grammaire de l'arabe standard moderne, les formes verbales, les noms dérivés, les cas et leurs terminaisons, le duel et le pluriel, les nombres de trois à dix, les diptotes, les ouvrages de référence spécialisés sur les dialectes."
  es: "El documento «A Reference Grammar of Modern Standard Arabic» (Cambridge University Press (PDF copy on imamhamzatcoed.edu.ng)). El museo no lo abrió por sí mismo: lo que se sabe de él procede de un resumen de investigación entregado al museo por el fundador, que aprobó su uso el 21 de noviembre de 2026. Citado para: las diferencias entre el árabe clásico y el árabe estándar moderno, la gramática del árabe estándar moderno, las formas verbales, los nombres derivados, los casos y sus terminaciones, el dual y el plural, los números del tres al diez, los diptotos, las obras de referencia especializadas sobre los dialectos."
  tr: "\"Modern Standart Arapçanın Referans Dilbilgisi\" belgesi, Cambridge University Press (PDF kopyası imamhamzatcoed.edu.ng üzerine). Müze bu referansı kendisi açmadı; kurucusunun müzeye sunduğu ve 21 Kasım 2026'da kullanımını onaylayan bir araştırma özetinden öğrendi. Kaynak şu kaynaklarda yer almıştır: Miras Standart Arapçası ile Modern Standart Arapça Arasındaki Farklar, Çağdaş Standart Arap Dilbilgisi, Daha Fazla Fiil Örüntüleri, Türetilmiş İsimler, Ayrıştırma, İkili ve Çoğul, Üçten On'a Sayı, Yasaklanmış Morfoloji, Uzmanlaşmış Lehçe Referansları."
  id: "Dokumen \"Tata Bahasa Referensi Arab Standar Modern,\" Cambridge University Press (salinan PDF pada imamhamzatcoed.edu.ng). Museum tidak membuka referensi ini sendiri; museum telah mengetahui apa yang dikatakan tentangnya dari ringkasan penelitian yang diajukan oleh pendiri museum dan menyetujui penggunaannya pada 21 November 2026. Dokumen ini dikutip dalam: Perbedaan Antara Arab Standar Warisan dan Arab Standar Modern, Tata Bahasa Arab Standar Kontemporer, Pola Kata Kerja Lebih Lanjut, Nomina Turunan, Parsing, Dual dan Jamak, Nomor Tiga sampai Sepuluh, Morfologi Terlarang, Referensi Dialek Khusus."
