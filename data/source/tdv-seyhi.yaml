summary:
  ar: "مدخل «شيخي» في موسوعة الإسلام التركية (TDV) بقلم خالد بيلتكين ⁦(المجلد 39، 2010)⁩؛ أوفى ترجمة علمية للشاعر: مولده بكوتاهية، واستنتاج زمن مولده 1371–1376 من معالجته عين السلطان محمد الأول سنة 818هـ/1415م وهو مشهور بلقب «حكيم سنان»، واسم أبيه أحمد مجد الدين، ودراسته الأولى على أحمدي ثم بإيران رفقة الشريف الجرجاني في الأدب والتصوف والطب، وانتسابه المنقول عن لطيفي إلى حاجي بيرام ولي بأنقرة، وخدمته ليعقوب الثاني الكرمياني مصاحباً وطبيباً، وتحليله النقدي لتواريخ وفاته المتنازعة ⁦(1423 و1426 و1451)⁩ وإثباته أنها بعد 832هـ/1429م مع قبول تاريخ تيمورتاش 834هـ/1431م، وردّه بالأدلة خلطَ الشاعر بشيخ سنان المنتسب إلى أمير سلطان."
  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'ŞEYHÎ' by Halit Biltekin (vol. 39, 2010); the fullest scholarly biography — his Kütahya birth, the 1371-1376 birth range reasoned from his treatment of Sultan Mehmed I's eye in 818/1415 when already famous as Hekim Sinan, his father Ahmed Mecdüddin, his first lessons under Ahmedi and his Iranian studies in literature, Sufism and medicine alongside al-Sharif al-Jurjani, Latifi's report of his intisab to Haci Bayram Veli at Ankara, his service to Yakub II of Germiyan as companion and physician, its critical sifting of the competing death dates (1423, 1426, 1451) down to a demonstrable 'after 832/1429' with Timurtas's 834/1431 accepted, and its documentary rejection of the poet's conflation with the Emir Sultan-affiliated Seyh Sinan."
  es: "La entrada de TDV İslâm Ansiklopedisi (enciclopedia turca del Islam) 'ŞEYHÎ' de Halit Biltekin (vol. 39, 2010); La biografía académica más completa: su nacimiento en Kütahya, el rango de nacimiento de 1371-1376 razonado a partir de su tratamiento del ojo del sultán Mehmed I en 818/1415 cuando ya era famoso como Hekim Sinan, su padre Ahmed Mecdüddin, sus primeras lecciones con Ahmedi y sus estudios iraníes en literatura, sufismo y medicina junto a al-Sharif al-Jurjani, el informe de Latifi sobre su intisab a Haci Bayram Veli en Ankara, su servicio a Yakub II de Germiyan como compañero y médico, su análisis crítico de las fechas de muerte en competencia (1423, 1426, 1451) hasta llegar a un demostrable \"después de 832/1429\" con la fecha de 834/1431 de Timurtas aceptada, y su rechazo documental de la confusión del poeta con Seyh Sinan, afiliado al emir Sultan."
  fr: "L'entrée « ŞEYHÎ » du TDV İslâm Ansiklopedisi (encyclopédie turque de l'Islam) par Halit Biltekin (vol. 39, 2010); La biographie scientifique la plus complète – sa naissance à Kütahya, la période de naissance 1371-1376 déduite de son traitement de l'œil du sultan Mehmed Ier en 818/1415 alors qu'il était déjà célèbre sous le nom de Hekim Sinan, son père Ahmed Mecdüddin, ses premières leçons auprès d'Ahmedi et ses études iraniennes en littérature, soufisme et médecine aux côtés d'al-Sharif al-Jurjani, le rapport de Latifi sur son intisab à Haci Bayram Veli à Ankara, son service auprès de Yakub II de Germiyan en tant que compagnon et médecin, son examen critique des dates de décès concurrentes (1423, 1426, 1451) pour aboutir à une date démontrable « après 832/1429 » avec l'acceptation de la date de Timurtas (834/1431), et son rejet documentaire de la confusion du poète avec Seyh Sinan, affilié à l'émir Sultan."
