summary:
  ar: "مدخل «شيخي» في موسوعة الإسلام التركية (TDV) بقلم خالد بيلتكين (المجلد 39، 2010)؛ أوفى ترجمة علمية للشاعر: مولده بكوتاهية، واستنتاج زمن مولده 1371–1376 من معالجته عين السلطان محمد الأول سنة 818هـ/1415م وهو مشهور بلقب «حكيم سنان»، واسم أبيه أحمد مجد الدين، ودراسته الأولى على أحمدي ثم بإيران رفقة الشريف الجرجاني في الأدب والتصوف والطب، وانتسابه المنقول عن لطيفي إلى حاجي بيرام ولي بأنقرة، وخدمته ليعقوب الثاني الكرمياني مصاحباً وطبيباً، وتحليله النقدي لتواريخ وفاته المتنازعة (1423 و1426 و1451) وإثباته أنها بعد 832هـ/1429م مع قبول تاريخ تيمورتاش 834هـ/1431م، وردّه بالأدلة خلطَ الشاعر بشيخ سنان المنتسب إلى أمير سلطان."
  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'ŞEYHÎ' by Halit Biltekin (vol. 39, 2010); the fullest scholarly biography — his Kütahya birth, the 1371-1376 birth range reasoned from his treatment of Sultan Mehmed I's eye in 818/1415 when already famous as Hekim Sinan, his father Ahmed Mecdüddin, his first lessons under Ahmedi and his Iranian studies in literature, Sufism and medicine alongside al-Sharif al-Jurjani, Latifi's report of his intisab to Haci Bayram Veli at Ankara, his service to Yakub II of Germiyan as companion and physician, its critical sifting of the competing death dates (1423, 1426, 1451) down to a demonstrable 'after 832/1429' with Timurtas's 834/1431 accepted, and its documentary rejection of the poet's conflation with the Emir Sultan-affiliated Seyh Sinan."
title: "ŞEYHÎ"
