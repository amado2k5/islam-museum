reliability_note: "Scholarly encyclopedia entry, read in full on 1 November 2026 (web edition), and the anchor source for this record's dates, career and affiliation. It works critically through a thin and contradictory biographical tradition: it derives the birth range 1371-1376 from the dated 818/1415 eye treatment rather than repeating a year, lists the older death dates (826/1423, 829/1426, 855/1451) and shows why only 'after 832/1429' is demonstrable before Timurtas's accepted 834/1431, and it dismantles the identification of the poet with the Emir Sultan-affiliated Seyh Sinan (d. 887/1482) on the latest documents. Its report of the Haci Bayram intisab rests on Latifi's Tezkire and is presented as a tradition the scholarship has accepted, which is exactly how this record's faith note presents it; it states expressly that whether Seyhi ever practised sheikhdom is unknown."
