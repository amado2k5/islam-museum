  ar: "مقالة ويكيبيديا الصينية عن تشين بينغياو (أنتوني تان، وُلد سنة 1982 في كوالالمبور)، ماليزي من أصل صيني يحمل الجنسية السنغافورية، شارك في تأسيس غراب ورئيسها التنفيذي؛ تذكر أن أباه تشين شينغتشو كان رئيس شركة تان تشونغ موتور، ودراسته في جامعة شيكاغو وكلية هارفارد للأعمال."
