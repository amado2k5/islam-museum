summary:
  ar: "مقالة ويكيبيديا الصينية عن تشين بينغياو ⁦(أنتوني تان، وُلد سنة 1982 في كوالالمبور)⁩، ماليزي من أصل صيني يحمل الجنسية السنغافورية، شارك في تأسيس غراب ورئيسها التنفيذي؛ تذكر أن أباه تشين شينغتشو كان رئيس شركة تان تشونغ موتور، ودراسته في جامعة شيكاغو وكلية هارفارد للأعمال."
  en: "Chinese Wikipedia article on Chen Bingyao (Anthony Tan, born 1982 in Kuala Lumpur), a Malaysian of Chinese descent holding Singapore citizenship, co-founder and chief executive of Grab; it records that his father Tan Heng Chew was president of Tan Chong Motor, and his studies at the University of Chicago and Harvard Business School."
  es: "Artículo de la Wikipedia en chino sobre Chen Bingyao (Anthony Tan, nacido en 1982 en Kuala Lumpur), un malasio de ascendencia china con ciudadanía singapurense, cofundador y director ejecutivo de Grab; en él se menciona que su padre, Tan Heng Chew, fue presidente de Tan Chong Motor, y que estudió en la Universidad de Chicago y en la Escuela de Negocios de Harvard."
  fr: "Article de Wikipédia en chinois sur Chen Bingyao (Anthony Tan, né en 1982 à Kuala Lumpur), un Malaisien d'origine chinoise possédant la citoyenneté singapourienne, cofondateur et directeur général de Grab; il indique que son père, Tan Heng Chew, était président de Tan Chong Motor, et qu'il a étudié à l'Université de Chicago et à la Harvard Business School."
  ur: "چینی ویکیپیڈیا مضمون چن بنگیاو ⁦(انتھونی ٹین، کوالالمپور میں 1982 میں پیدا ہوا)⁩، ایک چینی نژاد ملائیشیا جو سنگاپور کی شہریت رکھتا ہے، گراب کے شریک بانی اور چیف ایگزیکٹو؛ یہ ریکارڈ کرتا ہے کہ اس کے والد ٹین ہینگ چیو ٹین چونگ موٹر کے صدر تھے، اور ان کی تعلیم یونیورسٹی آف شکاگو اور ہارورڈ بزنس اسکول میں تھی۔"
