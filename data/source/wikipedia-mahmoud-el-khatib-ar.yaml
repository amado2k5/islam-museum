summary:
  ar: "مقالة ويكيبيديا العربية عن محمود الخطيب؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته مع النادي الأهلي ومنتخب مصر ورئاسته الحالية للنادي، ومولده في قرية تتبع مركز السنبلاوين بمحافظة الدقهلية وانتقال أسرته إلى القاهرة في طفولته. لا تذكر المقالة دينه في أي موضع."
  en: "Arabic Wikipedia article on Mahmoud El Khatib; used for entity facts only. It recounts his career with Al Ahly and the Egypt national team and his current presidency of the club; it gives his birth in a village under El Senbellawein, Dakahlia, and his family's move to Cairo in his childhood. It makes no mention of his religion anywhere."
  es: "Artículo de Wikipedia en árabe sobre Mahmoud El Khatib; utilizado únicamente para obtener información sobre la persona. Narra su trayectoria con el Al Ahly y la selección egipcia, así como su actual presidencia del club. Menciona su nacimiento en la aldea de El Senbellawein, Dakahlia, y el traslado de su familia a El Cairo durante su infancia. No hace referencia a su religión en ningún momento."
  fr: "Article Wikipédia en arabe sur Mahmoud El Khatib; utilisé uniquement à des fins d'information sur l'entité. Il retrace sa carrière au sein du club Al Ahly et de l'équipe nationale égyptienne, ainsi que sa présidence actuelle du club; il indique sa naissance dans un village près d'El Senbellawein, dans la province de Dakahlia, et le déménagement de sa famille au Caire durant son enfance. Sa religion n'y est mentionnée nulle part."
