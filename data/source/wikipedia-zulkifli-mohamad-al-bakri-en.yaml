reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The article records Zulkifli Mohamad Al-Bakri (born 16 January 1969 at Kampung Gong Pauh, Kemaman, Terengganu) as a Malaysian Islamic scholar who served as Minister in the Prime Minister's Department (Religious Affairs) from 10 March 2020 to 16 August 2021, as Senator from March 2020 to March 2023, and as 7th Mufti of the Federal Territories from 23 June 2014 to 9 March 2020; his education is listed as the Islamic University of Madinah, Al-Ulum Al-Islamiah Wa Al-Arabiah University in Damascus, and a PhD from Universiti Sains Malaysia. The offices are carried on the museum record as dated facts of office, exactly as reported. No school is named for him in the article. Read via search extract on 15 November 2026."
