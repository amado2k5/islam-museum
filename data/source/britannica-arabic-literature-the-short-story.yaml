summary:
  ar: "صفحة «Arabic literature: The short story» لدى Encyclopaedia Britannica. لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملخص بحثي قُدّم إلى المتحف ووافق المؤسس على استعماله في 21 نوفمبر 2026. يُستشهد بها في: أطوار الأدب العربي وأعلام كل طور وأعماله كما رتبها الملخص."
  en: "The page \"Arabic literature: The short story\" (Encyclopaedia Britannica). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum and approved for use by the founder on 21 November 2026. Cited for: the periods of Arabic literature and the representative author and work of each, as the summary arranges them."
  ur: "صفحہ «Arabic literature: The short story»، Encyclopaedia Britannica۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ عجائب گھر کو دیے گئے ایک تحقیقی خلاصے سے ہے جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ اس کے لیے دیا گیا: عربی ادب کے ادوار اور ہر دور کا نمائندہ ادیب اور تصنیف جیسا خلاصے نے ترتیب دی۔"
  fr: "La page « Arabic literature: The short story » (Encyclopaedia Britannica). Le musée ne l'a pas ouverte lui-même : ce qu'on en sait vient d'une synthèse de recherche remise au musée et approuvée pour usage par le fondateur le 21 novembre 2026. Citée pour : les périodes de la littérature arabe et l'auteur et l'œuvre représentatifs de chacune, tels que la synthèse les range."
  es: "La página «Arabic literature: The short story» (Encyclopaedia Britannica). El museo no la abrió por sí mismo: lo que se sabe de ella procede de un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026. Citada para: los periodos de la literatura árabe y el autor y la obra representativos de cada uno, tal como los ordena el resumen."
  tr: "Encyclopaedia Britannica'daki \"Arap edebiyatı: Kısa hikaye\" sayfası. Müze kendisi açmamıştır; içeriği, müzeye sunulan ve 21 Kasım 2026'da kurucu tarafından onaylanan bir araştırma özetinden bilinmektedir. Kitap, Arap Edebiyatının Aşamaları, Her Dönemin Önemli Kişileri ve Özet Olarak Düzenlenmiş Eserleri adlı bölümlerde atıfta bulunulmuştur."
  id: "Halaman \"Sastra Arab: Cerita pendek\" di Encyclopaedia Britannica. Museum tidak membukanya sendiri; isinya diketahui dari ringkasan penelitian yang diserahkan ke museum dan disetujui oleh pendiri pada 21 November 2026. Buku ini dikutip dalam: Phases of Arabic Literature, Notables of Each Period, and Its Works as arranged in the abstract."
