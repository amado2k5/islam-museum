summary:
  ar: مقالة ويكيبيديا الإنجليزية عن عمر الغبرا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في الخبر سنة 1969 ومسيرته البرلمانية؛ لا حقل للديانة فيها، وما تنقله عن «غلوب آند ميل» يصفه بأنه «نائب مسلم» بصيغة عامة.
  en: English Wikipedia article on Omar Alghabra; used for entity facts only. It gives his birth in Al-Khobar in 1969 and his parliamentary career; it has no religion field, and the Globe and Mail reporting it cites calls him a 'Muslim MP' generically.
  es: "Artículo de la Wikipedia en inglés sobre Omar Alghabra; utilizado únicamente para obtener información sobre la persona. Indica su nacimiento en Al-Khobar en 1969 y su trayectoria parlamentaria; no incluye información sobre religión, y el artículo del Globe and Mail que cita lo denomina genéricamente «diputado musulmán»."
  fr: "Article de Wikipédia en anglais sur Omar Alghabra; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance à Al-Khobar en 1969 et son parcours parlementaire; il ne comporte pas de champ « religion », et l’article du Globe and Mail cité le qualifie de « député musulman » de manière générique."
  ur: "عمر الغبرا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1969 میں الخوبر میں ان کی پیدائش اور ان کے پارلیمانی کیرئیر کو دیتا ہے۔ اس کا کوئی مذہب نہیں ہے، اور گلوب اینڈ میل کی رپورٹنگ میں اسے عام طور پر 'مسلم ایم پی' کہا جاتا ہے۔"
  tr: "Omar Al-Ghabra hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılır. 1969'da Al-Khobar'da doğduğunu ve parlamento kariyerini anlatır; içinde din için bir alan yoktur ve Globe and Mail'den alıntılar onu genel anlamda \"Müslüman milletvekili\" olarak tanımlar."
  id: "Artikel Wikipedia bahasa Inggris tentang Omar Al-Ghabra hanya digunakan untuk fakta-fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Al-Khobar pada tahun 1969 dan karier parlemennya; tidak ada bidang untuk agama di dalamnya, dan kutipan dari Globe and Mail menggambarkannya sebagai \"anggota parlemen Muslim\" secara umum."
