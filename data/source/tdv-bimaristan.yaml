reliability_note: "The historical text was read on 5 November 2026. Its first section calls Rufayda's tent a mobile war hospital and the first Islamic bimaristan, citing Ibn Hisham, II, p. 239, and Ahmad Isa, p. 9. It later reports al-Maqrizi's claim that al-Walid founded the first Islamic hospital in 88/707. The entry is used to establish what the secondary source says, not to settle the meaning or priority of either claim. For inventions-p3-b13, the section İlk Bîmâristan Tesisleri ve Doğu İslâm Dünyası was re-read through the early Abbasid hospital network: Harun's foundation on the Kerhaya canal, its Jundishapur model and physicians, the parallel Barmakid hospital, later Baghdad foundations, prison visits and the Sawad mobile hospital. The Ibn Abi Usaybia and Ibn al-Nadim passages it cites were not independently read for that batch."
