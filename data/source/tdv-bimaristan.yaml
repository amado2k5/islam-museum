summary:
  ar: "مدخل موسوعي تركي عن البيمارستانات وتاريخها؛ يصف خيمة رفيدة الأسلمية أثناء غزوة الخندق بأنها أول بيمارستان إسلامي متنقل، وينقل في موضع آخر دعوى المقريزي أن الوليد بن عبد الملك أسس أول مستشفى إسلامي سنة 88/707."
  en: "A Turkish encyclopedia entry on bimaristans. It describes Rufayda al-Aslamiyya's tent during the Battle of the Trench as the first mobile Islamic bimaristan, and separately reports al-Maqrizi's claim that al-Walid established the first Islamic hospital in 88/707."
  es: "Una entrada de una enciclopedia turca sobre los bimaristanes. Describe la tienda de Rufayda al-Aslamiyya durante la Batalla de la Trinchera como el primer bimaristán islámico móvil, e informa por separado de la afirmación de al-Maqrizi de que al-Walid estableció el primer hospital islámico en el año 88/707."
  fr: "Un article d'une encyclopédie turque sur les bimaristans. Il décrit la tente de Rufayda al-Aslamiyya pendant la bataille du Fossé comme le premier bimaristan islamique mobile, et rapporte séparément l'affirmation d'al-Maqrizi selon laquelle al-Walid a établi le premier hôpital islamique en 88/707."
  ur: "Bimaristans پر ایک ترک انسائیکلوپیڈیا اندراج۔ یہ خندق کی جنگ کے دوران رفائدہ الاسلمیہ کے خیمے کو پہلا موبائل اسلامی بیمارستان کے طور پر بیان کرتا ہے، اور الگ سے المقریزی کے اس دعوے کی رپورٹ کرتا ہے کہ الولید نے 88/707 میں پہلا اسلامی اسپتال قائم کیا۔"
  tr: "Bimaristanlar ve tarihleri üzerine Türk ansiklopedik bir giriş; Siper Muharebesi sırasında Rafidah İslami Çadırı'nı ilk hareketli İslami hastane olarak tanımlar ve başka yerlerde Al-Maqrizi'nin 707/88'de ilk İslami hastaneyi kurduğu iddiasından alıntı yapar."
  id: "Sebuah entri ensiklopedis Turki tentang bimaristan dan sejarah mereka; menggambarkan Tenda Islam Rafidah selama Pertempuran Parit sebagai rumah sakit Islam bergerak pertama, dan di tempat lain mengutip klaim Al-Maqrizi bahwa Al-Walid ibn Abd al-Malik mendirikan rumah sakit Islam pertama pada tahun 707/88."
