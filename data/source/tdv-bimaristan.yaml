  ar: "مدخل موسوعي تركي عن البيمارستانات وتاريخها؛ يصف خيمة رفيدة الأسلمية أثناء غزوة الخندق بأنها أول بيمارستان إسلامي متنقل، وينقل في موضع آخر دعوى المقريزي أن الوليد بن عبد الملك أسس أول مستشفى إسلامي سنة 88/707."
  en: "A Turkish encyclopedia entry on bimaristans. It describes Rufayda al-Aslamiyya's tent during the Battle of the Trench as the first mobile Islamic bimaristan, and separately reports al-Maqrizi's claim that al-Walid established the first Islamic hospital in 88/707."
