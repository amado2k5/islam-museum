  en: "Urdu Wikipedia article on Farhat Hashmi; used for entity facts only. It confirms her birth in Sargodha on 22 December 1957, her master's in Arabic from the University of Punjab, her doctorate from the University of Glasgow, her founding of the Al-Huda institute in 1994 and of its Toronto institute in 2004."
