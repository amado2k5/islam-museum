summary:
  ar: "مقالة ويكيبيديا الأردية عن فرحت ہاشمی؛ تُستخدم لوقائع الكيان فقط. تؤكد ميلادها في سرغودا في 22 ديسمبر 1957، وماجستير العربية من جامعة البنجاب، والدكتوراه من جامعة غلاسكو، وتأسيسها معهد الهدى سنة 1994 وفرعه في تورونتو سنة 2004."
  en: "Urdu Wikipedia article on Farhat Hashmi; used for entity facts only. It confirms her birth in Sargodha on 22 December 1957, her master's in Arabic from the University of Punjab, her doctorate from the University of Glasgow, her founding of the Al-Huda institute in 1994 and of its Toronto institute in 2004."
  es: "Artículo de Wikipedia en urdu sobre Farhat Hashmi; se utiliza únicamente para datos biográficos. Confirma su nacimiento en Sargodha el 22 de diciembre de 1957, su maestría en árabe por la Universidad de Punjab, su doctorado por la Universidad de Glasgow y la fundación del instituto Al-Huda en 1994 y de su instituto en Toronto en 2004."
  fr: "Article de Wikipédia en ourdou sur Farhat Hashmi; utilisé uniquement à des fins d'information sur l'entité. Il confirme sa naissance à Sargodha le 22 décembre 1957, sa maîtrise en arabe de l'Université du Pendjab, son doctorat de l'Université de Glasgow, la fondation de l'institut Al-Huda en 1994 et de son institut de Toronto en 2004."
  ur: "فرحت ہاشمی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی تصدیق 22 دسمبر 1957 کو سرگودھا میں ہوئی، پنجاب یونیورسٹی سے عربی میں اس نے ماسٹر کیا، گلاسگو یونیورسٹی سے ڈاکٹریٹ کی، 1994 میں الہدی انسٹی ٹیوٹ کی بنیاد رکھی اور 2004 میں اس کے ٹورنٹو انسٹی ٹیوٹ سے۔"
  tr: "Farhat Hashmi hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 22 Aralık 1957'de Sargoda'da doğduğunu doğrulamaktadır, Pencap Üniversitesi'nden Arapça yüksek lisans, Glasgow Üniversitesi'nden doktora derecesi vardır ve 1994'te Al-Huda Enstitüsü'nü, 2004'te ise Toronto'daki şubesini kurmuştur."
  id: "Artikel Urdu Wikipedia tentang Farhat Hashmi; digunakan hanya untuk fakta entitas. Dia mengonfirmasi kelahirannya di Sargoda pada 22 Desember 1957, meraih gelar master bahasa Arab dari University of the Punjab, PhD dari University of Glasgow, dan mendirikan Al-Huda Institute pada tahun 1994 serta cabangnya di Toronto pada tahun 2004."
