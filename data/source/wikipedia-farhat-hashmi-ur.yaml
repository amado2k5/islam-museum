reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 at the recorded revision (oldid=6850777; revision equality asserted). It gives her born in Sargodha, Pakistan on 22 December 1957; a master's in Arabic from the University of Punjab, Lahore; a doctorate from the University of Glasgow, Scotland; lecturer and assistant professor posts in the Usuluddin faculty of the International Islamic University, Islamabad; the founding of Al-Huda in 1994 for women's religious education and training; and the founding of the Al-Huda Institute in Toronto in 2004. It makes no statement of a school or sect for her."
