summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد بابر علي؛ تُستخدم هنا لوقائع عن والده سيد مراتب علي: تصفه بأنه تاجر لاهوري كانت له متاجر في المدينة المسوّرة وكان من كبار متعهدي الجيش الهندي البريطاني في التموين والخدمات اللوجستية، واستثمر ماله في الأراضي، وتذكر أن الأسرة تمارس الإسلام الشيعي."
  en: "English Wikipedia article on Syed Babar Ali; used here for facts about his father Syed Maratib Ali: it describes him as a Lahore businessman who owned shops in the Walled City and was a top contractor of the British Indian Army for supplies and logistics, who invested his money in land, and it states that the family practices Shia Islam."
  es: "Artículo de la Wikipedia en inglés sobre Syed Babar Ali; utilizado aquí para obtener información sobre su padre, Syed Maratib Ali: lo describe como un empresario de Lahore que poseía tiendas en la Ciudad Amurallada y era uno de los principales contratistas del Ejército Indio Británico para suministros y logística, que invirtió su dinero en tierras, y afirma que la familia practica el Islam chiíta."
  fr: "Article de Wikipédia en anglais sur Syed Babar Ali; utilisé ici pour des informations sur son père Syed Maratib Ali: il le décrit comme un homme d'affaires de Lahore qui possédait des boutiques dans la vieille ville et était un important fournisseur de l'armée britannique des Indes pour les approvisionnements et la logistique, qui a investi son argent dans l'immobilier, et il indique que la famille pratique l'islam chiite."
  ur: "سید بابر علی پر انگریزی ویکیپیڈیا مضمون؛ یہاں اپنے والد سید مراتیب علی کے بارے میں حقائق کے لیے استعمال کیا گیا ہے: اس میں انھیں لاہور کے ایک تاجر کے طور پر بیان کیا گیا ہے جو والڈ سٹی میں دکانوں کے مالک تھے اور برٹش انڈین آرمی کے سپلائیز اور لاجسٹکس کے لیے ایک اعلیٰ ٹھیکیدار تھے، جس نے اپنا پیسہ زمین میں لگایا، اور یہ بتاتا ہے کہ یہ خاندان شیعہ اسلام پر عمل کرتا ہے۔"
  tr: "Burada babası Syed Babur Ali hakkında İngilizce Wikipedia makalesi kullanılmıştır: onu surlarla çevrili şehirde dükkanları olan ve İngiliz Hindistan Ordusu'nun tedarik ve lojistik alanındaki başlıca müteahhitlerinden biri olan bir Lahori tüccar olarak tanımlar. Parasını araziye yatırmış ve ailesinin Şii İslam'ı uyguladığı belirtilmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Syed Babur Ali digunakan di sini untuk fakta tentang ayahnya, Syed Maratib Ali: menggambarkannya sebagai pedagang Lahori yang memiliki toko di kota bertembok dan merupakan salah satu kontraktor utama Tentara India Inggris dalam pasokan dan logistik. Ia menginvestasikan uangnya dalam tanah, dan dicatat bahwa keluarganya mempraktikkan Islam Syiah."
