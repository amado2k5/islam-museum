  ar: "مقالة ويكيبيديا الأردية عن سيد أمير علي (1849-1928)؛ تُستخدم لوقائع الكيان فقط. تذكر تأسيسه الجمعيةَ الوطنية المركزية المحمدية سنة 1879 — صيغة ثالثة لتاريخ التأسيس — وقائمة مؤلفاته."
  en: "Urdu Wikipedia article on Syed Ameer Ali (1849–1928); used for entity facts only. It dates his founding of the Central National Muhammedan Association to 1879 — a third variant of the founding year — and lists his works."
