  ur: "سید امیر علی (1849-1928) پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں سنٹرل نیشنل محمدن ایسوسی ایشن کی ان کی بنیاد 1879 تک بتائی گئی ہے - جو سال کے تاسیس کا تیسرا ورژن ہے - اور اس میں ان کے کاموں کی فہرست ہے۔"
  tr: "Syed Amir Ali (1849-1928) hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1879'da Merkezi Ulusal Müslüman Meclisi'nin kuruluşundan — kuruluş tarihinin üçüncü bir versiyonundan — ve eserlerinin bir listesini belirtir."
  id: "Artikel Wikipedia Urdu tentang Syed Amir Ali (1849-1928); digunakan hanya untuk fakta entitas. Artikel ini menyebutkan pendirian Majelis Nasional Mohammedan Pusat pada tahun 1879 — versi ketiga dari tanggal pendirian — dan daftar karyanya."
