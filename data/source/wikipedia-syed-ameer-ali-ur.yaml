reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 6 April 1849, died 3 August 1928; a distinguished jurist, judge, reformer and social reformer; legal education at Calcutta University and in London; 'In 1879 he founded the Central National Muhammedan Association' — a third dating of the founding, against the English article's 1877 and the Encyclopedia of Religion entry's 1878, all three recorded in the record; member of the Bengal Legislative Council and then of the central Legislative Council; member of the Privy Council, described as the first Indian and the first Muslim to hold that distinction; founded a branch of the Muslim League in London; worked for Indian unity and educational advancement; wrote numerous books in English and Urdu including The Spirit of Islam, A Short History of the Saracens, The Personal Law of the Mahomedans, Mahommedan Law, Ethics of Islam, Islam and The Legal Position of Women in Islam. The article names no sect or school for him."
