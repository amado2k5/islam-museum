summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن روبرت بودي هارتونو، المولود في 28 نيسان 1941 في سمارانغ، الابن الثاني لأوي وي غوان؛ تذكر وراثته مع أخيه الأكبر مايكل شركة جاروم للسجائر سنة 1963 وبناءهما المجموعة وبنك سنترال آسيا، وإقامته في كودوس."
  en: "English Wikipedia article on Robert Budi Hartono, born 28 April 1941 in Semarang, second son of Oei Wie Gwan; it records his inheritance of the Djarum cigarette company with his elder brother Michael in 1963, their building of the group and of Bank Central Asia, and his residence in Kudus."
  es: "Artículo de la Wikipedia en inglés sobre Robert Budi Hartono, nacido el 28 de abril de 1941 en Semarang, segundo hijo de Oei Wie Gwan; en él se recoge la herencia de la empresa de cigarrillos Djarum junto con su hermano mayor Michael en 1963, la creación del grupo y del Banco de Asia Central, y su residencia en Kudus."
  fr: "Article de Wikipédia en anglais sur Robert Budi Hartono, né le 28 avril 1941 à Semarang, deuxième fils d'Oei Wie Gwan; il relate son héritage de la société de cigarettes Djarum avec son frère aîné Michael en 1963, la construction du groupe et de la Bank Central Asia, et sa résidence à Kudus."
  ur: "رابرٹ بڈی ہارٹونو پر انگریزی ویکیپیڈیا کا مضمون، 28 اپریل 1941 کو سیمارنگ میں پیدا ہوا، اوئی وائی گوان کا دوسرا بیٹا؛ اس میں 1963 میں اپنے بڑے بھائی مائیکل کے ساتھ دجارم سگریٹ کمپنی کی وراثت، ان کے گروپ اور بینک سینٹرل ایشیا کی عمارت اور قدوس میں ان کی رہائش گاہ کا ریکارڈ درج ہے۔"
  tr: "28 Nisan 1941'de Semarang'da doğan ve Ui Wei Guan'ın ikinci oğlu Robert Bodie Hartono hakkında İngilizce Wikipedia makalesi; 1963'te ağabeyi Michael ile birlikte Garum Sigara Şirketi'nin mirasını, grubun ve Central Asia Bank'ın inşasını ve Kudos'taki ikametgahını anlatıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Robert Bodie Hartono, lahir pada 28 April 1941 di Semarang, putra kedua Ui Wei Guan; artikel ini menyebutkan warisannya bersama kakak laki-lakinya Michael dari Garum Cigarette Company pada tahun 1963, pembangunan grup dan Central Asia Bank, serta kediamannya di Kudos."
