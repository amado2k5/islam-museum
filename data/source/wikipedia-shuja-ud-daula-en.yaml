reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his full name Jalal-ud-din Haidar Abul Mansur Khan Shuja-ud-Daula, his birth on 19 January 1732, his father Safdar Jang, his offices as Nawab of Oudh and Grand Vizier from 5 October 1754 to his death on 26 January 1775, his part in the Third Battle of Panipat and the Battle of Buxar, and the Treaty of Allahabad. Its body describes Awadh under him as a Shi'a kingdom whose Kashmiri Shi'a migrants looked to the state as the sword-arm of the Shi'as in India; the article is filed under Indian Shia Muslims. The museum's record rests its faith settlement on the textual attestations set out in its faith note. Checked 1 November 2026."
