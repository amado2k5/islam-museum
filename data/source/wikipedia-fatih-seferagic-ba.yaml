reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Fetched by revision id through the MediaWiki API on 26 October 2026; the returned revision id equals the recorded one. The article gives Fatih Seferagić, born 1 March 1995 in Germany, a Bosniak and a United States citizen, a hafiz whose website is fatihseferagic.com. Its text: his family moved from Bosnia first to Germany and then to the United States; he began memorising the Qur'an at nine at a seminary and completed it at thirteen at the Islamic Society of Baltimore, then studied recitation styles and teaching methods for two more years; he went to Dallas, Texas, and studied classical Arabic in the Bayyinah Dream programme in the lessons of Nouman Ali Khan; he now travels the world teaching the Qur'an and lives in Houston, where he runs his own programme teaching children recitation and memorisation. It names no school or madhhab for him."
