  ar: "مقالة ويكيبيديا الباشقيرية عن فاتح سيفراغيتش؛ تُستخدم لوقائع الكيان فقط: وُلد في 1 مارس 1995 في ألمانيا لأسرة بوسنية انتقلت بعدها إلى الولايات المتحدة، وحفظ القرآن في الثالثة عشرة في الجمعية الإسلامية ببالتيمور، ودرس العربية في برنامج «دريم» التابع لمعهد بينة في دالاس، ويقيم في هيوستن حيث يعلّم الأطفال القرآن."
  en: "Bashkir Wikipedia article on Fatih Seferagic; used for entity facts only: born 1 March 1995 in Germany to a Bosnian family that later moved to the United States; he completed memorising the Qur'an at thirteen at the Islamic Society of Baltimore, studied Arabic in Bayyinah's Dream programme in Dallas, and lives in Houston teaching children the Qur'an."
