reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision, resting on Abdurrahman Atçıl, 'Çandarlızade Ali Paşa', Encyclopaedia of Islam, Third Edition (Brill, 2017) and R. Mantran, 'Alī Pas̲h̲a Čāndārli̊̊-Zāde', Encyclopaedia of Islam, Second Edition, vol. I, p. 394, with Dimitris Kastritsis, The Sons of Bayezid (2007). It names him the son of Grand Vizier Çandarlı Kara Halil Hayreddin Pasha, traces his rise from kadı to kazasker to the grand vizierate in 1387, and dates his death at Ankara to 18 December 1406 (its infobox gives his birth only as 'c. after 1330', a career inference, and no article text offers a birth year). It presents the Ottoman chroniclers' accusations against him — drunkenness and debauchery — expressly as the propaganda of his rivals, the partisans of Mehmed I."
