summary: { en: "The Internet Movie Database; used for screen-work identifiers, release years and credits, always cross-checked against a second source for dated facts.", ar: "قاعدة بيانات الأفلام على الإنترنت؛ تُستخدم لمعرّفات الأعمال المرئية وسنوات العرض وبيانات صنّاعها، وتُفحص كل واقعة مؤرّخة مقابل مصدر ثانٍ.", es: "La base de datos de películas de Internet (IMDb); se utiliza para identificar obras cinematográficas, años de estreno y créditos, siempre contrastada con una segunda fuente para verificar la información actualizada.", fr: "L'Internet Movie Database; utilisée pour identifier les films, les années de sortie et les crédits, toujours vérifiée auprès d'une deuxième source pour les informations datées.", ur: "انٹرنیٹ مووی ڈیٹا بیس؛ اسکرین ورک شناخت کنندگان، ریلیز کے سالوں اور کریڈٹس کے لیے استعمال کیا جاتا ہے، تاریخ کے حقائق کے لیے ہمیشہ دوسرے ماخذ سے کراس چیک کیا جاتا ہے۔", tr: "Çevrimiçi film veritabanı, görsel iş tanımlayıcıları, yayın yılları ve yaratıcı verileri için kullanılır ve her tarihli olayı ikincil bir kaynakla karşılaştırır.", id: "Basis data film online digunakan untuk pengidentifikasi bisnis visual, tahun rilis, dan data kreator, serta memeriksa setiap peristiwa yang sudah usang dengan sumber sekunder." }
