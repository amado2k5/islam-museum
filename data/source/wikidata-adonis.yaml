summary:
  ar: "عنصر ويكي بيانات Q380787 لأدونيس، ثُبّت عبر خصائص صفحة مقالة ويكيبيديا الإنجليزية «أدونيس (شاعر)»؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته في 1 يناير 1930 في القصابين، ويحمل خمس قيم متضاربة لحقل الدين: الإسلام، ومسلم لا طائفي، واللادينية، والوثنية، والإلحاد، وهو تضارب داخلي في أسرة بنيوية واحدة لا يُعطى أي وزن."
  en: "Wikidata item Q380787 for Adonis, grounded through the pageprops of the English article 'Adonis (poet)'; used for entity facts only. It gives his birth on 1 January 1930 at al-Qassabin, and carries five mutually contradictory religion values — Islam, nondenominational Muslim, irreligion, paganism and atheism — an internally incoherent single structured family that is given no weight in his record."
