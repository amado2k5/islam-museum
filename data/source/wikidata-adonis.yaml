summary:
  ar: "عنصر ويكي بيانات Q380787 لأدونيس، ثُبّت عبر خصائص صفحة مقالة ويكيبيديا الإنجليزية «أدونيس ⁦(شاعر)⁩»؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته في 1 يناير 1930 في القصابين، ويحمل خمس قيم متضاربة لحقل الدين: الإسلام، ومسلم لا طائفي، واللادينية، والوثنية، والإلحاد، وهو تضارب داخلي في أسرة بنيوية واحدة لا يُعطى أي وزن."
  en: "Wikidata item Q380787 for Adonis, grounded through the pageprops of the English article 'Adonis (poet)'; used for entity facts only. It gives his birth on 1 January 1930 at al-Qassabin, and carries five mutually contradictory religion values — Islam, nondenominational Muslim, irreligion, paganism and atheism — an internally incoherent single structured family that is given no weight in his record."
  es: "El elemento de Wikidata Q380787 para Adonis, basado en los atributos de la página del artículo en inglés 'Adonis (poeta)', se utiliza únicamente para datos sobre la entidad. Indica que nació el 1 de enero de 1930 en al-Qassabin y presenta cinco valores religiosos mutuamente contradictorios: el islam, el islam no confesional, la irreligión, el paganismo y el ateísmo; una estructura familiar única e internamente incoherente a la que no se le otorga ninguna importancia en su trayectoria."
  fr: "L'élément Wikidata Q380787 pour Adonis, basé sur les propriétés de la page de l'article anglais « Adonis (poète) », est utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance le 1er janvier 1930 à al-Qassabin et mentionne cinq valeurs religieuses contradictoires: l'islam, l'islam non confessionnel, l'irréligion, le paganisme et l'athéisme. Il évoque également une famille à la structure interne incohérente, dont l'importance n'est pas prise en compte dans son parcours."
  ur: "Adonis کے لیے Wikidata آئٹم Q380787، انگریزی مضمون 'Adonis (poet)' کے صفحہ کے ذریعے بنا ہوا؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 1 جنوری 1930 کو القصابین میں ہوئی، اور اس میں پانچ باہمی متضاد مذہبی اقدار ہیں - اسلام، غیر فرقہ وارانہ مسلم، غیر مذہب، کافر پرستی اور الحاد - ایک اندرونی طور پر متضاد واحد ساختہ خاندان جسے اس کے ریکارڈ میں کوئی وزن نہیں دیا گیا ہے۔"
  tr: "Adonis Q380787 Wikidata'da bir unsur, İngilizce Wikipedia makale sayfası \"Adonis (şair)\" aracılığıyla kurulmuştur; yalnızca varlığın gerçekleri için kullanılır. 1 Ocak 1930'da El-Kasabin'de doğdu ve dini alanda beş çelişkili değeri taşır: İslam, mezhepsiz Müslümanlık, laiklik, paganizm ve ateizm. Bu, tek bir yapısal aile içinde ağırlık kazanmayan içsel bir çatışmadır."
  id: "Elemen Wikidata Q380787 Adonis, didirikan melalui properti halaman artikel Wikipedia bahasa Inggris \"Adonis (penyair)\"; digunakan hanya untuk fakta entitas. Ia lahir pada 1 Januari 1930 di Al-Qasabin dan membawa lima nilai yang bertentangan di bidang agama: Islam, Muslim non-sektarian, sekularisme, paganisme, dan ateisme. Ini adalah konflik internal dalam satu keluarga struktural yang tidak mendapat bobot."
