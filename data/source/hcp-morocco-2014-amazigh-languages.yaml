  en: "HCP, speakers of Amazigh languages by the 2014 census results (HCP)"
summary:
  ar: "«المندوبية السامية للتخطيط، المتحدثون بالأمازيغية حسب نتائج إحصاء 2014»، المندوبية السامية للتخطيط HCP، 2014. ورد في ملخص بحثي زُوّد به المتحف مع إدخال نسب اللغات في المغرب؛ ولم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص كما ورد في 21 نوفمبر 2026."
  en: "HCP, speakers of Amazigh languages by the 2014 census results; HCP, 2014. Named in a research summary supplied to the museum with the language-share entry for Morocco; the museum did not open the page, and the founder approved using the summary as supplied on 21 November 2026."
  ur: "HCP, speakers of Amazigh languages by the 2014 census results؛ HCP, 2014۔ متحف کو فراہم کردہ تحقیقی خلاصے میں مراکش کے زبانوں کے تناسب کے اندراج کے ساتھ مذکور؛ متحف نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو خلاصے کو جیسا ملا اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "HCP, speakers of Amazigh languages by the 2014 census results ; HCP, 2014. Nommé dans un résumé de recherche remis au musée avec l'entrée des parts de langues pour le Maroc ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026."
  es: "HCP, speakers of Amazigh languages by the 2014 census results; HCP, 2014. Nombrado en un resumen de investigación entregado al museo con la entrada de proporciones de lenguas de Marruecos; el museo no abrió la página, y el fundador aprobó usar el resumen tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Planlama Yüksek Komisyonu, 2014 Nüfus Sayımı Sonuçlarına Göre Amazigh Konuşanlar,\" Yüksek Planlama Komiserliği HCP, 2014. Müze tarafından sağlanan bir araştırma özetinde ve Fas'taki dil yüzdelerinin girilmesiyle birlikte bahsedilmiştir; müze sayfayı açmamış ve kurucu 21 Kasım 2026'da belirtildiği gibi özetin kullanımına izin vermiştir."
  id: "\"Komisi Tinggi untuk Perencanaan, Penutur Amazigh Menurut Hasil Sensus 2014,\" Komisi Tinggi untuk Perencanaan HCP, 2014. Hal ini disebutkan dalam ringkasan penelitian yang disediakan oleh museum bersama dengan entri persentase bahasa di Maroko; museum tidak membuka halaman tersebut, dan pendiri mengizinkan penggunaan ringkasan tersebut seperti yang dinyatakan pada 21 November 2026."
