reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives him as born on 14 March 1892 at Hanchiachi in Linxia County, Gansu, and as dying on 14 January 1970 at Los Angeles. It states repeatedly that his father was Ma Fuxiang — citing the Who's Who in China volumes — and that Ma Fulu was his uncle; the brief for this record, which had made him a son of Ma Fulu, is corrected on this point. It records his cooperation with the Yihewani imam Hu Songshan in founding Sino-Arabic schools and Hu's takfir of him in 1935, and names no school and no Sufi order for Hongkui himself; its categories are filings."
