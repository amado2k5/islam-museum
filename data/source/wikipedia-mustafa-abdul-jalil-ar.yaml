summary:
  ar: "مقالة ويكيبيديا العربية عن مصطفى عبد الجليل؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها ولادته في 6 نوفمبر 1952 في البيضاء ودينه «مسلم» عمومًا، ويسجّل رئاسته المجلس الوطني الانتقالي (2011–2012) بعد أمانته للجنة الشعبية العامة للعدل (2007–2011). ولا يسمّي أي متن مذهبًا له."
  en: "Arabic Wikipedia article on Mustafa Abdul Jalil; used for entity facts only. Its infobox gives his birth on 6 November 1952 at Bayda and his religion as 'Muslim' in general, and records his chairmanship of the National Transitional Council (2011–2012) after his service as secretary of the General People's Committee for Justice (2007–2011). No article text names a school for him."
  es: "Artículo en árabe de la Wikipedia sobre Mustafa Abdul Jalil; utilizado únicamente para obtener información sobre la persona. Su ficha informativa indica que nació el 6 de noviembre de 1952 en Bayda y que su religión es musulmana. También registra su presidencia del Consejo Nacional de Transición (2011-2012) tras su servicio como secretario del Comité Popular General para la Justicia (2007-2011). El artículo no menciona ninguna escuela a la que haya asistido."
  fr: "Article Wikipédia en arabe sur Mustafa Abdul Jalil; utilisé uniquement pour les informations sur l'entité. Son infobox indique sa naissance le 6 novembre 1952 à Bayda et sa religion (musulmane). Elle mentionne également sa présidence du Conseil national de transition (2011-2012) après son poste de secrétaire du Comité populaire général pour la justice (2007-2011). L'article ne mentionne aucune école à son nom."
  ur: "مصطفی عبدالجلیل پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی خانہ 6 نومبر 1952 کو بیدا میں اس کی پیدائش اور اس کا مذہب عام طور پر 'مسلمان' کے طور پر دیتا ہے، اور جنرل پیپلز کمیٹی برائے انصاف (2007-2011) کے سیکرٹری کے طور پر خدمات انجام دینے کے بعد قومی عبوری کونسل (2011–2012) کی چیئرمین شپ کو ریکارڈ کرتا ہے۔ کوئی مضمون اس کے لیے اسکول کا نام نہیں رکھتا۔"
  tr: "Mustafa Abdel Jalil hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bilgi kutusunda doğum tarihi 6 Kasım 1952'de Kazablanka'da belirtilmiştir ve dini genellikle 'Müslüman'dır; ayrıca Genel Halk Adalet Komitesi sekreterliğinden (2007–2011) sonra Ulusal Geçiş Konseyi başkanlığını (2011–2012) kaydeder. Düşünce okulu olarak herhangi bir metin adı geçmemiştir."
  id: "Artikel Wikipedia berbahasa Arab tentang Mustafa Abdel Jalil; digunakan hanya untuk fakta entitas. Kotak infonya mencantumkan tanggal lahirnya pada 6 November 1952 di Casablanca, dan agamanya umumnya 'Muslim,' serta mencatat masa kepresidenannya di Dewan Transisi Nasional (2011–2012) setelah menjabat sebagai sekretariat Komite Umum Rakyat untuk Kehakiman (2007–2011). Tidak ada teks yang disebut sebagai aliran pemikirannya."
