  ar: "مقالة ويكيبيديا العربية عن مصطفى عبد الجليل؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها ولادته في 6 نوفمبر 1952 في البيضاء ودينه «مسلم» عمومًا، ويسجّل رئاسته المجلس الوطني الانتقالي (2011–2012) بعد أمانته للجنة الشعبية العامة للعدل (2007–2011). ولا يسمّي أي متن مذهبًا له."
  en: "Arabic Wikipedia article on Mustafa Abdul Jalil; used for entity facts only. Its infobox gives his birth on 6 November 1952 at Bayda and his religion as 'Muslim' in general, and records his chairmanship of the National Transitional Council (2011–2012) after his service as secretary of the General People's Committee for Justice (2007–2011). No article text names a school for him."
