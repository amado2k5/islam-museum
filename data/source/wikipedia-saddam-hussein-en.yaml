summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صدام حسين؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده الرسمي في 28 أبريل 1937 في العوجة قرب تكريت لأسرة فلاحية عربية سنية، مع حاشية تنص على أن تاريخ ميلاده الحقيقي لم يُسجَّل ويُعتقد أنه بين 1935 و1939، وتروي صعوده ورئاسته وحملة الإيمان منذ 1993 ومحاكمته وإعدامه شنقًا في بغداد في 30 ديسمبر 2006."
  en: "English Wikipedia article on Saddam Hussein; used for entity facts only. It gives his official birth on 28 April 1937 at al-Awja near Tikrit, to a peasant Sunni Arab family, with a footnote stating that his real date of birth was never recorded and is believed to fall between 1935 and 1939. It covers his rise, presidency, the Faith Campaign from 1993, his trial, and his execution by hanging at Baghdad on 30 December 2006. The Sunni reference in its text is to his family of birth; no text in the article names his own school."
  es: "Artículo de la Wikipedia en inglés sobre Saddam Hussein; utilizado únicamente para datos sobre la persona. Indica su nacimiento oficial el 28 de abril de 1937 en al-Awja, cerca de Tikrit, en el seno de una familia campesina árabe suní. Una nota al pie señala que su fecha real de nacimiento nunca se registró y se cree que se sitúa entre 1935 y 1939. El artículo abarca su ascenso al poder, su presidencia, la Campaña de la Fe de 1993, su juicio y su ejecución en la horca en Bagdad el 30 de diciembre de 2006. La referencia a la comunidad suní en el texto alude a su familia de nacimiento; el artículo no menciona su escuela."
  fr: "Article de Wikipédia en anglais sur Saddam Hussein; utilisé uniquement pour les informations relatives à l’entité. Il indique sa naissance officielle le 28 avril 1937 à al-Awja, près de Tikrit, dans une famille paysanne arabe sunnite. Une note de bas de page précise que sa véritable date de naissance n’a jamais été enregistrée et se situerait entre 1935 et 1939. L’article retrace son ascension, sa présidence, la Campagne de la Foi de 1993, son procès et son exécution par pendaison à Bagdad le 30 décembre 2006. La référence à l’appartenance à l’école sunnite dans le texte concerne sa famille d’origine; l’article ne mentionne pas son école."
