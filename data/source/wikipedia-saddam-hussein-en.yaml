summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صدام حسين؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده الرسمي في 28 أبريل 1937 في العوجة قرب تكريت لأسرة فلاحية عربية سنية، مع حاشية تنص على أن تاريخ ميلاده الحقيقي لم يُسجَّل ويُعتقد أنه بين 1935 و1939، وتروي صعوده ورئاسته وحملة الإيمان منذ 1993 ومحاكمته وإعدامه شنقًا في بغداد في 30 ديسمبر 2006."
  en: "English Wikipedia article on Saddam Hussein; used for entity facts only. It gives his official birth on 28 April 1937 at al-Awja near Tikrit, to a peasant Sunni Arab family, with a footnote stating that his real date of birth was never recorded and is believed to fall between 1935 and 1939. It covers his rise, presidency, the Faith Campaign from 1993, his trial, and his execution by hanging at Baghdad on 30 December 2006. The Sunni reference in its text is to his family of birth; no text in the article names his own school."
