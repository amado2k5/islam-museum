summary:
  ar: "مقالة ويكيبيديا الأردية عن المشير سيد عاصم منير أحمد شاه، رئيس أركان الجيش الباكستاني؛ تذكر أسرته السيدية البنجابية المهاجرة من جالندر ووالده سيد سرور منير إمام مسجد القريش ودراساته ومسيرته العسكرية."
  en: "Urdu Wikipedia article on Field Marshal Syed Asim Munir Ahmed Shah, Pakistan's chief of army staff; it records his Punjabi Syed family that migrated from Jalandhar, his father Syed Sarwar Munir, imam of Masjid Quresh, and his studies and military career."
  es: "Artículo en urdu de la Wikipedia sobre el mariscal de campo Syed Asim Munir Ahmed Shah, jefe del Estado Mayor del Ejército de Pakistán; en él se habla de su familia Syed punjabí que emigró de Jalandhar, de su padre Syed Sarwar Munir, imán de la mezquita Quresh, y de sus estudios y carrera militar."
  fr: "Article de Wikipédia en ourdou sur le maréchal Syed Asim Munir Ahmed Shah, chef d'état-major de l'armée pakistanaise; il relate son histoire familiale, la famille Syed du Pendjab, originaire de Jalandhar, son père Syed Sarwar Munir, imam de la mosquée Quresh, ainsi que ses études et sa carrière militaire."
  ur: "پاکستان کے چیف آف آرمی اسٹاف فیلڈ مارشل سید عاصم منیر احمد شاہ پر اردو ویکیپیڈیا کا مضمون؛ اس میں جالندھر سے ہجرت کرنے والے ان کے پنجابی سید خاندان، ان کے والد سید سرور منیر، مسجد قریش کے امام، اور ان کی تعلیم اور فوجی کیریئر کا ریکارڈ ہے۔"
