summary:
  ar: "ملخص بحثي قُدِّم إلى المتحف في 21 نوفمبر 2026 ولصقه المؤسس ولم تُرفق به روابط؛ موضوعه: القراءات العشر وقراؤها ورواتها وخصائصها، وصلة الأحرف السبعة بلهجات القبائل، وأبرز الكتب في الباب. اعتمد المؤسس استعماله دون إعادة تحقق، ويذكر الملخص أن أرقام الصفحات تختلف باختلاف الطبعة، ولم تُفتح الكتب المذكورة فيه."
  en: "A research summary supplied to the museum on 21 November 2026 and pasted by the founder, with no URLs; its subject: the ten qira'at with their readers, narrators and features, the link between the seven ahruf and the tribal dialects, and the main works on the subject. The founder approved using it without re-verification; the summary itself notes that page numbers vary by edition, and the books it names were not opened."
  ur: "عجائب گھر کو 21 نومبر 2026 کو دیا گیا ایک تحقیقی خلاصہ جو بانی نے چسپاں کیا اور جس کے ساتھ کوئی روابط نہیں تھے؛ موضوع: قراءات عشرہ، ان کے قراء، راوی اور خصوصیات، سات احرف کا قبائل کے لہجوں سے تعلق، اور اس باب کی اہم کتابیں۔ بانی نے اسے بغیر دوبارہ تصدیق کے استعمال کرنے کی منظوری دی، خلاصہ خود بتاتا ہے کہ صفحات کے نمبر طبعات کے لحاظ سے مختلف ہیں، اور اس میں مذکور کتابیں کھولی نہیں گئیں۔"
  fr: "Résumé de recherche remis au musée le 21 novembre 2026 et collé par le fondateur, sans URL ; son sujet : les dix qira'at avec leurs lecteurs, narrateurs et traits, le lien entre les sept ahruf et les dialectes tribaux, et les principaux ouvrages sur le sujet. Le fondateur a approuvé son usage sans nouvelle vérification ; le résumé note lui-même que les numéros de page varient selon l'édition, et les livres qu'il nomme n'ont pas été ouverts."
  es: "Resumen de investigación entregado al museo el 21 de noviembre de 2026 y pegado por el fundador, sin URL; su tema: las diez qira'at con sus lectores, narradores y rasgos, el vínculo entre los siete ahruf y los dialectos tribales, y las obras principales sobre el tema. El fundador aprobó su uso sin nueva verificación; el propio resumen señala que los números de página varían según la edición, y los libros que nombra no se abrieron."
