summary:
  ar: "صفحة «من نحن» لمؤسسة النور للرعاية؛ تأسست سنة 1996 على يد أستاذة نغت هاشمي، وبدأت بيتيا في بهاولبور، وتعمل في مدن باكستانية عديدة في تعليم النساء والشباب."
  en: "The Al-Noor Welfare Foundation's About page: established in 1996 by Ustazah Nighat Hashmi, begun home-based in Bahawalpur, now operating across Pakistani cities in the education of women and young people."
  es: "Página \"Acerca de\" de la Fundación de Bienestar Al-Noor: establecida en 1996 por la Ustazah Nighat Hashmi, comenzó operando desde casa en Bahawalpur, y ahora funciona en ciudades de Pakistán dedicadas a la educación de mujeres y jóvenes."
  fr: "Page « À propos » de la Fondation Al-Noor Welfare: créée en 1996 par Ustazah Nighat Hashmi, initialement basée à Bahawalpur, elle opère désormais dans plusieurs villes pakistanaises dans le domaine de l’éducation des femmes et des jeunes."
  ur: "النور ویلفیئر فاؤنڈیشن کا صفحہ: استاذہ نگہت ہاشمی کے ذریعہ 1996 میں قائم کیا گیا، بہاولپور میں گھریلو طور پر شروع کیا گیا، جو اب خواتین اور نوجوانوں کی تعلیم کے لیے پورے پاکستانی شہروں میں کام کر رہا ہے۔"
  tr: "Al-Noor Care Vakfı'nın \"Biz Kimiz\" sayfası; 1996 yılında Profesör Naghat Hashmi tarafından kurulan Neghat Hashmi, Bahawalpur'da evini kurdu ve Pakistan'ın birçok şehrinde kadınlar ve gençler eğitimi için çalışıyor."
  id: "Halaman \"Siapa Kami\" dari Al-Noor Care Foundation; didirikan pada tahun 1996 oleh Profesor Naghat Hashmi, ia memulai rumahnya di Bahawalpur dan bekerja di banyak kota Pakistan untuk mendidik perempuan dan pemuda."
