reliability_note: "The foundation's own page, read in full on 5 November 2026; a first-party source used for the organisation's own account of itself. It names Ustazah Nighat Hashmi as the foundation's visionary founder and Chairperson, dates Al-Noor's establishment to 1996 as a home-based organisation in Bahawalpur, records its incorporation as an NPO in 2007, its extension to 11 major Pakistani cities by 2011 and 17 campuses and 57 branches by 2018, the completion of the 'Quran An-Ajaba' tafseer in 2018, and her founding of Al-Noor School and Al-Noor College. Its impact figures (millions of graduates, over 4 million families assisted) are the foundation's own and are not used as verified facts."
