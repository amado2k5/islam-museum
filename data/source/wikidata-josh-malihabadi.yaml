  ur: "جوش ملیح آبادی کے لیے Wikidata آئٹم Q3631671: یہ 5 دسمبر 1898 کو ان کی پیدائش اور 22 فروری 1982 کو ان کی موت، اور ایک واحد ڈھانچہ شدہ مذہب کی قدر، شیعہ اسلام، جس کا کوئی مضمون متن تائید نہیں کرتا ہے۔"
  tr: "Josh Malihabadi tarafından Q3631671 Wikidata öğesi: 5 Aralık 1898'deki doğumundan, 22 Şubat 1982'deki ölümünden ve tek dini olan \"Şii İslam\"ın değerinden bahseder—herhangi bir metinle desteklenen tek bir yapısal değer."
  id: "Elemen Wikidata Q3631671 oleh Josh Malihabadi: Menyebutkan kelahirannya pada 5 Desember 1898, dan kematiannya pada 22 Februari 1982, serta nilai satu-satunya agamanya, \"Islam Syiah\"—satu nilai struktural tunggal yang didukung oleh teks apa pun."
