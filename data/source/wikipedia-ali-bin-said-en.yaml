  ar: "مقالة ويكيبيديا الإنجليزية عن علي بن سعيد، رابع سلاطين زنجبار (حكم 1890-1893)؛ تُستخدم لوقائع الكيان فقط. توثّق تولّيه بعد أخيه خليفة، ومعاهدات الحماية البريطانية الألمانية سنة 1890 وتنازله عن الشريط الساحلي، ووفاته في زنجبار في 5 مارس 1893. المقالة وصفت بأنها تستند إلى مصدر واحد غير موثوق."
  en: "English Wikipedia article on Ali bin Said, fourth Sultan of Zanzibar (reigned 1890–1893); used for entity facts only. It records his succession after his brother Khalifah, the 1890 Anglo-German protectorate agreements and the cession of the coastal strip, and his death at Zanzibar on 5 March 1893. The article is flagged as resting on one, partly unreliable, source."
