summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي بن سعيد، رابع سلاطين زنجبار ⁦(حكم 1890-1893)⁩؛ تُستخدم لوقائع الكيان فقط. توثّق تولّيه بعد أخيه خليفة، ومعاهدات الحماية البريطانية الألمانية سنة 1890 وتنازله عن الشريط الساحلي، ووفاته في زنجبار في 5 مارس 1893. المقالة وصفت بأنها تستند إلى مصدر واحد غير موثوق."
  en: "English Wikipedia article on Ali bin Said, fourth Sultan of Zanzibar (reigned 1890–1893); used for entity facts only. It records his succession after his brother Khalifah, the 1890 Anglo-German protectorate agreements and the cession of the coastal strip, and his death at Zanzibar on 5 March 1893. The article is flagged as resting on one, partly unreliable, source."
  es: "Artículo de la Wikipedia en inglés sobre Ali bin Said, cuarto sultán de Zanzíbar (reinó de 1890 a 1893); se utiliza únicamente para datos sobre la entidad. Documenta su sucesión tras su hermano Khalifah, los acuerdos de protectorado anglo-alemán de 1890 y la cesión de la franja costera, así como su muerte en Zanzíbar el 5 de marzo de 1893. El artículo se basa en una única fuente, parcialmente poco fiable."
  fr: "Article de Wikipédia en anglais sur Ali bin Said, quatrième sultan de Zanzibar (règne: 1890-1893); utilisé uniquement à des fins d’information sur l’entité. Il relate sa succession à son frère Khalifa, les accords de protectorat anglo-allemands de 1890 et la cession de la bande côtière, ainsi que sa mort à Zanzibar le 5 mars 1893. L’article est signalé comme reposant sur une seule source, partiellement peu fiable."
  ur: "علی بن سعید پر انگریزی ویکیپیڈیا کا مضمون، زنجبار کے چوتھے سلطان ⁦(حکومت 1890–1893)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے بھائی خلیفہ کے بعد ان کی جانشینی، 1890 کے اینگلو-جرمن پروٹوٹریٹ معاہدوں اور ساحلی پٹی کے خاتمے، اور 5 مارچ 1893 کو زنجبار میں ان کی موت کو ریکارڈ کیا گیا ہے۔ مضمون کو جزوی طور پر ناقابل اعتبار، ماخذ کے طور پر نشان زد کیا گیا ہے۔"
