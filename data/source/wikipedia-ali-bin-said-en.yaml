reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 24 October 2026; the article carries a maintenance banner (November 2018) warning that it relies largely or entirely on a single, possibly unreliable source (Royal Ark), so its facts are used only where the German and Arabic articles or Hertslet's treaty collection corroborate them. It gives: born 1854 (year only), youngest son of Said bin Sultan; succeeded his brother Khalifah bin Said on 13 February 1890; received the GCSI in 1890; signed the provisional protectorate agreement with Euan Smith on 14 June 1890; the Heligoland–Zanzibar Treaty (1 July 1890) settled sovereignty over the coastal strip and Witu, with Zanzibar and Pemba under British protection; the strip was formally ceded to Germany on 28 October 1890 against compensation; and it records criticism of his pro-British stance from his brother Barghash. He died at Zanzibar on 5 March 1893 and was succeeded by his nephew Hamad bin Thuwaini. The article states nothing about his religion."
