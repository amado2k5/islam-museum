summary:
  ar: "مقالة ويكيبيديا العربية عن جودت يلماز ⁦(وُلد في 1 نيسان 1967 في بينكل)⁩، السياسي التركي الزازاكي نائب رئيس الجمهورية منذ 3 حزيران 2023؛ تذكر دراسته ومسيرته في هيئة تخطيط الدولة ووزارة التنمية."
  en: "Arabic Wikipedia article on Cevdet Yılmaz (born 1 April 1967 in Bingöl), the Turkish Zaza politician who has been vice president since 3 June 2023; it records his studies and his career at the State Planning Organization and the development ministry."
  es: "Artículo en árabe de la Wikipedia sobre Cevdet Yılmaz (nacido el 1 de abril de 1967 en Bingöl), el político turco del partido Zaza que ha sido vicepresidente desde el 3 de junio de 2023; en él se recogen sus estudios y su trayectoria profesional en la Organización Estatal de Planificación y el Ministerio de Desarrollo."
  fr: "Article de Wikipédia en arabe sur Cevdet Yılmaz (né le 1er avril 1967 à Bingöl), homme politique turc Zaza qui est vice-président depuis le 3 juin 2023; il retrace ses études et sa carrière à l'Organisation nationale de planification et au ministère du Développement."
  ur: "Cevdet Yılmaz ⁦(پیدائش 1 اپریل 1967 Bingöl)⁩ پر عربی ویکیپیڈیا کا مضمون، ترک زازا سیاست دان جو 3 جون 2023 سے نائب صدر ہیں۔ یہ اسٹیٹ پلاننگ آرگنائزیشن اور وزارت ترقی میں اس کی تعلیم اور اس کے کیریئر کو ریکارڈ کرتا ہے۔"
  tr: "Zazak kökenli Türk siyasetçi ve 3 Haziran 2023'ten beri Cumhurbaşkanı Yardımcısı olan Cevdet Yılmaz (1 Nisan 1967, Pinkel doğumlu) hakkında Arapça Wikipedia makalesi; Devlet Planlama Otoritesi ve Kalkınma Bakanlığı'ndaki eğitimi ve kariyerinden bahsedilmektedir."
  id: "Artikel Wikipedia Arab tentang Cevdet Yilmaz (lahir 1 April 1967 di Pinkel), politisi Turki dari Zazakh dan Wakil Presiden sejak 3 Juni 2023; artikel ini menyebutkan studi dan kariernya di Otoritas Perencanaan Negara dan Kementerian Pembangunan."
