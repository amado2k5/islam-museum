  en: "Arabic Wikipedia article 'Islam Story (website)', revision 71512363 (26 July 2025); entity facts only: a multilingual Islamic history site supervised by Ragheb el-Sergani, its content, sections and stated aims."
  ur: "عربی ویکیپیڈیا کا مضمون «قصة الإسلام ⁦(موقع)⁩»، نظرِ ثانی 71512363 ⁦(26 جولائی 2025)⁩؛ صرف حقائق: راغب السرجانی کی نگرانی میں کثیر لسانی اسلامی تاریخ کی سائٹ، اس کا مواد، شعبے اور بیان کردہ مقاصد۔"
