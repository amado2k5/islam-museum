  fr: "Article Wikipédia arabe « Islam Story (site web) », révision 71512363 (26 juillet 2025); informations sur l'entité uniquement: un site d'histoire islamique multilingue supervisé par Ragheb el-Sergani, son contenu, ses sections et ses objectifs déclarés."
