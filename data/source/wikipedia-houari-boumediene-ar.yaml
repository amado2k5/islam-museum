  ar: "مقالة ويكيبيديا العربية عن هواري بومدين؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 23 أغسطس 1932 في مجاز عمار بولاية قالمة، وتؤكد خلافته لأحمد بن بلة في رئاسة الدولة سنة 1965 ثم في الرئاسة سنة 1976، وأن الشاذلي بن جديد خلفه بعد فترة مؤقتة لرابح بيطاط."
  en: "Arabic Wikipedia article on Houari Boumédiène; used for entity facts only. It gives his birth on 23 August 1932 at Medjaz Amar in Guelma province, confirms his succession to Ahmed Ben Bella as head of state in 1965 and as president in 1976, and shows Chadli Bendjedid succeeding him only after Rabah Bitat's interim."
