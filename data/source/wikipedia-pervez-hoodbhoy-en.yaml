summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن برويز هودبوي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 11 يوليو 1950 بكراتشي، وأنه وُلد ونشأ في أسرة من جماعة الخوجة الإسماعيلية الشيعية السندية، وأنه «تعرّف بوصفه إنسانيا» وصار موقعا رسميا على البيان الإنساني الثالث، وتدريسه في جامعة القائد الأعظم (1973–2020) وكتابه «الإسلام والعلم» (1991) وجائزة كالينغا 2003. خلفية الأسرة لا تُثبت انتماء شخصيا."
  en: "English Wikipedia article on Pervez Hoodbhoy; used for entity facts only. It gives his birth as 11 July 1950 at Karachi, that he was born and raised in a family of the Sindhi Khoja Ismaili Shia community, that he 'identified as a Humanist' and became an official signatory of Humanist Manifesto III, his teaching at Quaid-e-Azam University (1973–2020), his book Islam and Science (1991) and the 2003 Kalinga Prize. The family framing attests no personal affiliation."
