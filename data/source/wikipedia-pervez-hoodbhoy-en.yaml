summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن برويز هودبوي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 11 يوليو 1950 بكراتشي، وأنه وُلد ونشأ في أسرة من جماعة الخوجة الإسماعيلية الشيعية السندية، وأنه «تعرّف بوصفه إنسانيا» وصار موقعا رسميا على البيان الإنساني الثالث، وتدريسه في جامعة القائد الأعظم (1973–2020) وكتابه «الإسلام والعلم» (1991) وجائزة كالينغا 2003. خلفية الأسرة لا تُثبت انتماء شخصيا."
  en: "English Wikipedia article on Pervez Hoodbhoy; used for entity facts only. It gives his birth as 11 July 1950 at Karachi, that he was born and raised in a family of the Sindhi Khoja Ismaili Shia community, that he 'identified as a Humanist' and became an official signatory of Humanist Manifesto III, his teaching at Quaid-e-Azam University (1973–2020), his book Islam and Science (1991) and the 2003 Kalinga Prize. The family framing attests no personal affiliation."
  es: "Artículo de la Wikipedia en inglés sobre Pervez Hoodbhoy; utilizado únicamente para datos sobre la persona. Indica que nació el 11 de julio de 1950 en Karachi, que nació y se crió en una familia de la comunidad chiíta ismaelita Khoja Sindhi, que se identificó como humanista y se convirtió en firmante oficial del Manifiesto Humanista III, su labor docente en la Universidad Quaid-e-Azam (1973-2020), su libro Islam y Ciencia (1991) y el Premio Kalinga de 2003. La información sobre su familia no atestigua ninguna afiliación personal."
  fr: "L'article Wikipédia en anglais consacré à Pervez Hoodbhoy, utilisé uniquement pour les informations le concernant, indique sa naissance le 11 juillet 1950 à Karachi, son appartenance à la communauté chiite ismaélienne sindhi khoja, son statut d'humaniste et sa signature officielle du Manifeste humaniste III, son enseignement à l'Université Quaid-e-Azam (1973-2020), son ouvrage *Islam et Science* (1991) et l'obtention du prix Kalinga en 2003. L'article mentionne uniquement sa famille et son affiliation personnelle."
  ur: "پرویز ہودبھائے پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس سے ان کی پیدائش 11 جولائی 1950 کو کراچی میں ہوتی ہے، کہ وہ سندھی خواجہ اسماعیلی شیعہ برادری کے ایک خاندان میں پیدا ہوئے اور پرورش پائی، کہ وہ 'انسانیت پسند' کے طور پر پہچانے گئے اور ہیومنسٹ مینی فیسٹو III کے باضابطہ دستخط کنندہ بن گئے، قائداعظم یونیورسٹی (1973-2020) میں ان کی تعلیم، اس کی کتاب ⁦(کالا زے)⁩ اور سائنس کی کتابیں (1973-2020)۔ فیملی فریمنگ کسی ذاتی وابستگی کی تصدیق نہیں کرتی ہے۔"
