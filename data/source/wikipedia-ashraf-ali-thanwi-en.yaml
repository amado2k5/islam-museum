reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The article rests on the Oxford encyclopedias of Islam (Naeem 2009; Esposito 2003; Belhaj 2014), Dawn and academic studies. Its embedded religious-biography infobox gives: religion Islam, denomination Sunni, jurisprudence Hanafi, creed Maturidi (its creed reference carries a 'failed verification' tag in the article itself), movement Deobandi, disciple of Imdadullah Muhajir Makki, and a long list of his own disciples. Its category apparatus files him among Chishtis, Maturidis, Sufis and students of Mahmud Hasan Deobandi. It records his graduation from Darul Uloom Deoband in 1883, fourteen years teaching at Madrasa Faiz-e-Aam in Kanpur, his return to Thana Bhawan in 1315 AH and direction of the Khanqah-i-Imdadiyah and Madrasa Ashrafiya, some 1,000 trainees authorised for bay'ah, his support for the Muslim League and resignation from Deoband's management committee, and his principal works. Birth and death dates agree with Wikidata."
