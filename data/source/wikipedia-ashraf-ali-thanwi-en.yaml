  ar: "مقالة ويكيبيديا الإنجليزية عن أشرف علي التهانوي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 19 أغسطس 1863 في تهانه بهون ووفاته فيها في 20 يوليو 1943، وتخرجه من دار العلوم ديوبند، وتصف صندوقها الديني مذهبه بالسني الحنفي."
  en: "English Wikipedia article on Ashraf Ali Thanwi; used for entity facts only. It records his birth at Thana Bhawan on 19 August 1863 and death there on 20 July 1943, his graduation from Darul Uloom Deoband, and its religious-biography infobox gives his denomination as Sunni and his jurisprudence as Hanafi."
