summary:
  ar: "سجل عمل «ضوء القمر» في قاعدة ISMI للمخطوطات العلمية الإسلامية: تأليف عربي لأبي علي الحسن بن الحسن بن الهيثم البصري المصري، موضوعه البصريات، من تأليفه المبكر (matn)، «في ضوء القمر»، ألّفه قبل 7 آب 1031م؛ ثلاثة شهود مخطوطة: حلب ⁦⁦(بيت باسيل 720)⁩⁩، لندن ⁦⁦(المكتبة البريطانية IO Islamic 1270)⁩⁩، وسانت بطرسبورغ ⁦⁦(المكتبة الوطنية ANS 600)⁩⁩."
  en: "The ISMI record for the work 'Ḍawʾ al-qamar' (On the Light of the Moon) in the Islamic Scientific Manuscripts Initiative database: an Arabic composition by Abu Ali al-Hasan ibn al-Hasan ibn al-Haytham al-Basri al-Misri, subject optics, composed before 7 August 1031; three manuscript witnesses — Aleppo (Basil House 720), London (British Library IO Islamic 1270), St Petersburg (National Library ANS 600)."
  ur: "ISMIdatabase میں «ضوء القمر» کی ریکارڈ: ابو علی الحسن بن الحسن بن الہیثم البصری المصري کی عربی تصنیف، موضوع بصریات، 7 اگست 1031ء سے پہلے مرتب؛ تین مخطوطہ گواہ — حلب ⁦⁦(بیت باسیل 720)⁩⁩، لندن ⁦⁦(برٹش لائبریری IO Islamic 1270)⁩⁩، سینٹ پیٹرزبرگ ⁦⁦(قومی لائبریری ANS 600)⁩⁩۔"
  es: "El registro ISMI para la obra 'Ḍawʾ al-qamar' (Sobre la luz de la luna) en la base de datos de la Iniciativa de Manuscritos Científicos Islámicos: una composición árabe de Abu Ali al-Hasan ibn al-Hasan ibn al-Haytham al-Basri al-Misri, sobre óptica, compuesta antes del 7 de agosto de 1031; tres testigos manuscritos: Alepo (Basil House 720), Londres (British Library IO Islamic 1270), San Petersburgo (National Library ANS 600)."
  fr: "La notice ISMI de l'ouvrage « Ḍawʾ al-qamar » (Sur la lumière de la lune) dans la base de données de l'Initiative des manuscrits scientifiques islamiques: une composition arabe d'Abu Ali al-Hasan ibn al-Hasan ibn al-Haytham al-Basri al-Misri, sujet: optique, composée avant le 7 août 1031; trois témoins manuscrits: Alep (Basil House 720), Londres (British Library IO Islamic 1270), Saint-Pétersbourg (Bibliothèque nationale ANS 600)."
  tr: "\"Ay ışığı\" adlı eser, İslami bilimsel el yazmaları ISMI veri tabanında kaydedilmiştir: Ebu Ali el-Hasan ibn el-Hasan ibn el-Haytham el-Basri el-Masri'nin Arapça eseri, konusu optiktir; erken dönem eseri (matn) \"Ay Işığında\" (7 Ağustos 1031'den önce yazılmıştır); üç el yazması tanığı: Halep (Basil Hanedanı 720), Londra (British Library IO İslami 1270) ve Saint Petersburg (National Library ANS 600)."
  id: "Karya \"Moonlight\" tercatat dalam basis data ISMI tentang manuskrip ilmiah Islam: sebuah karya Arab oleh Abu Ali al-Hasan ibn al-Hasan ibn al-Haytham al-Basri al-Masri, subjeknya adalah optik, dari karya awalnya (matn), \"In the Light of the Moon,\" yang ditulis sebelum 7 Agustus 1031 M; tiga saksi manuskrip: Aleppo (Rumah Basil 720), London (British Library IO Islamic 1270), dan Saint Petersburg (National Library ANS 600)."
