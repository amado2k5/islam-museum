summary:
  ar: "مقالة ويكيبيديا الأردية عن إنغريد ماتسون؛ تُستخدم لوقائع الكيان فقط. تؤكد ولادتها في 24 أغسطس 1963 في كينغستون، واعتناقها الإسلام سنة 1987، ولا تسمّي لها مذهبًا."
  en: "Urdu Wikipedia article on Ingrid Mattson; used for entity facts only. It confirms her birth on 24 August 1963 in Kingston, her conversion to Islam in 1987, and names no school for her."
  es: "Artículo de Wikipedia en urdu sobre Ingrid Mattson; se utiliza únicamente para obtener información sobre la persona. Confirma su nacimiento el 24 de agosto de 1963 en Kingston, su conversión al islam en 1987 y no menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en ourdou sur Ingrid Mattson; utilisé uniquement pour les informations la concernant. Il confirme sa naissance le 24 août 1963 à Kingston, sa conversion à l’islam en 1987, et ne mentionne aucun établissement scolaire où elle aurait étudié."
  ur: "Ingrid Mattson پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ تصدیق کرتا ہے کہ اس کی پیدائش 24 اگست 1963 کو کنگسٹن میں ہوئی، 1987 میں اس کی اسلام قبول ہوئی، اور اس کے لیے کسی اسکول کا نام نہیں لیا۔"
  tr: "Ingrid Matson hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 24 Ağustos 1963'te Kingston'da doğduğunu, 1987'de İslam'a geçişini doğrular ve herhangi bir mezhepin mezhep olarak adını vermez."
  id: "Artikel Wikipedia Urdu tentang Ingrid Matson; digunakan hanya untuk fakta entitas tersebut. Dia mengonfirmasi kelahirannya pada 24 Agustus 1963 di Kingston, konversinya ke Islam pada tahun 1987, dan tidak menyebutkan namanya sebagai sekte oleh sekte tertentu."
