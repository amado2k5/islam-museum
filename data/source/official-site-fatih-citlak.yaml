summary:
  ar: "السيرة في الموقع الرسمي لمحمد فاتح تشيتلاك؛ تقول إنه وُلد سنة 1966 في حي الفاتح بإسطنبول، ودرس في ثانوية الفاتح للإمام الخطيب وقسم التركولوجيا بجامعة مرمرة، وألّف خمسة عشر عملًا، ويشارك بصفة بوستنيشين في برامج السماع والدوران لفرقة إسطنبول للموسيقى التركية."
  en: "Biography on Mehmed Fatih Çıtlak's official website; it states that he was born in 1966 in Istanbul's Fatih district, studied at Fatih Imam Hatip High School and Marmara University's Turkology department, wrote fifteen works, and takes part as postnişin in the sema and devran programmes of the Istanbul Turkish Music ensemble."
  es: "La biografía de Mehmed Fatih Çıtlak se encuentra en su sitio web oficial; en ella se indica que nació en 1966 en el distrito de Fatih de Estambul, estudió en la escuela secundaria Fatih Imam Hatip y en el departamento de Turcología de la Universidad de Marmara, escribió quince obras y participa como postnişin en los programas de sema y devran del conjunto de música turca de Estambul."
  fr: "Biographie sur le site officiel de Mehmed Fatih Çıtlak; il y est indiqué qu'il est né en 1966 dans le quartier de Fatih à Istanbul, qu'il a étudié au lycée Fatih Imam Hatip et au département de turcologie de l'université de Marmara, qu'il a écrit quinze œuvres et qu'il participe en tant que postnişin aux programmes sema et devran de l'ensemble de musique turque d'Istanbul."
  ur: "محمد فاتح Çıtlak کی سرکاری ویب سائٹ پر سوانح حیات؛ اس میں کہا گیا ہے کہ وہ 1966 میں استنبول کے فتح ضلع میں پیدا ہوئے، انہوں نے فتح امام ہاتیپ ہائی اسکول اور مارمارہ یونیورسٹی کے شعبہ ترکولوجی میں تعلیم حاصل کی، پندرہ کام لکھے، اور استنبول ترک موسیقی کے سما اور دیوران پروگراموں میں پوسٹنیشین کے طور پر حصہ لیا۔"
  tr: "Mehmet Fatih Çetlak'ın resmi web sitesindeki biyografisi, 1966 yılında İstanbul'un Fatih ilçesinde doğduğunu, Fatih İmam El-Hatib Lisesi ve Marmara Üniversitesi Türkoloji Bölümü'nde eğitim gördüğünü, on beş eser bestelediğini ve İstanbul Türk Müzik Topluluğu'nun dinleme ve rotasyon programlarında poster olarak yer aldığını belirtmektedir."
  id: "Biografi di situs resmi Mehmet Fatih Çetlak menyatakan bahwa ia lahir pada tahun 1966 di distrik Fatih, Istanbul, belajar di SMA Fatih Imam Al-Khatib dan Departemen Turkologi di Universitas Marmara, menggubah lima belas karya, dan berpartisipasi sebagai poster dalam program pendengaran dan rotasi Ansambel Musik Turki Istanbul."
