reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). It cites Sunyoto's Atlas Walisongo (2016) and Javanese chronicle material (Babad Daha-Kediri); the life it recounts — including wonder-working episodes such as diverting the Brantas river — is hagiographic tradition and is used as tradition, never as documented fact. Its infobox is the single structured attestation of his branch: denomination Sunni, jurisprudence blank."
