  en: "Sunan Bonang — Indonesian Wikipedia"
summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن سونن بونانغ؛ تعطي ولادته 1465 في لاسم ووفاته 1525 في توبان ودفنه في كوتوريجو بتوبان وأباه سونن أمبل وشيوخه، وصندوقها يعطي طائفته «سني» مع حقل الفقه فارغًا."
  en: "Indonesian Wikipedia article on Sunan Bonang; it gives his birth in 1465 at Lasem, death in 1525 at Tuban and burial at Kutorejo, Tuban, his father Sunan Ampel and his teachers; its Muslim-scholar infobox gives his denomination as Sunni with the jurisprudence field blank."
  es: "Artículo de la Wikipedia en indonesio sobre Sunan Bonang; indica que nació en 1465 en Lasem, murió en 1525 en Tuban y fue enterrado en Kutorejo, Tuban, y menciona a su padre, Sunan Ampel, y a sus maestros; su ficha informativa sobre el erudito musulmán indica que su denominación era sunita, con el campo de jurisprudencia en blanco."
  fr: "L'article de Wikipédia indonésien sur Sunan Bonang indique sa naissance en 1465 à Lasem, sa mort en 1525 à Tuban et son inhumation à Kutorejo, Tuban, son père Sunan Ampel et ses professeurs; son infobox sur les érudits musulmans indique qu'il est sunnite, mais le champ « jurisprudence » est vide."
  ur: "سنان بونانگ پر انڈونیشیائی ویکیپیڈیا مضمون؛ اس نے 1465 میں لیسم میں اس کی پیدائش، 1525 میں توبان میں موت اور کوٹوریجو، توبان میں تدفین، اس کے والد سنان امپل اور اس کے اساتذہ؛ اس کا مسلم اسکالر انفو باکس اپنے فرقے کو بطور سنی دیتا ہے اور فقہی فیلڈ خالی ہے۔"
