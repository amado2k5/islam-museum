  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth at Gwalior on 17 January 1945, the Salim–Javed partnership, his Rajya Sabha term and Richard Dawkins Award, and quotes his own words: “I’m an atheist, I have no religious beliefs.”"
