summary:
  ar: "مقالة ويكيبيديا الألمانية عن يعقوبا سيلا؛ تُستخدم لوقائع الكيان فقط. مقالة مطوّلة من الأدبيات الأكاديمية (تراوري وهانريتا وتشيسي وسافادوغو) تصفه في مستهلها بأنه داعية في الطريقة التيجانية، وتروي تعيين حماه الله له مقدّمًا سنة 1929 ونشاطه في كايدي ونفيه إلى ساساندرا وبناءه مجتمعه وشركاته في ساحل العاج."
  en: "German Wikipedia article on Yacouba Sylla; used for entity facts only. A long article from the scholarly literature (Traoré, Hanretta, Cissé, Savadogo) that calls him in its lead a preacher of the Tijaniyya order, and recounts Hamahullah's appointment of him as muqaddam in 1929, his preaching at Kaédi, his exile to Sassandra, and his community and businesses in Côte d'Ivoire."
