reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. The fullest of the articles on him, closely cited to Traoré (1983), Hanretta (2008, 2009), Cissé (2005) and Savadogo (2000). Its lead calls him a preacher of the Tijaniyya order and its person data a 'Sufi of the Tijaniyya order and entrepreneur in Côte d'Ivoire'. It narrates his Soninke parentage, his early attachment to Cheikh Hamahoullah, his appointment by him at the Tabaski gathering at Méderdra in 1929 as muqaddam to spread the Hamallist teaching, the Kaédi clashes between the 'eleven grains' and 'twelve grains' Tijanis, his trial at Nioro (18 October 1929), the shooting of more than 30 of his followers at Kaédi on 15 February 1930, his eight-year exile to Sassandra (27 February 1930), his release on 28 February 1938, his plantations, trucks, bakeries, butcheries and cinemas at Gagnoa and elsewhere, his financing of Gagnoa's electrification (1946–1958), his friendship with Houphouët-Boigny, and that before his death in 1988 he designated his eldest son Cheikna Sylla as successor and that his grave at Gagnoa is a pilgrimage goal. It gives his birth as 1906 at Nioro du Sahel and his death as 1988 at Gagnoa, with no day."
