  ar: "مقالة ويكيبيديا الإنجليزية عن ملالي مايواند؛ تُستخدم لوقائع الكيان فقط. تعطي مولدها سنة 1861 في خيغ قرب مايواند ووفاتها في معركة مايواند في 27 يوليو 1880، وتروي قصتها الشعبية، ثم تناقش في قسم الاستقبال تشكيك باحثين كثيرين في وجودها التاريخي وغياب أي ذكر معاصر لها. لا تسمي المقالة أي ديانة لها."
  en: "English Wikipedia article on Malalai of Maiwand; used for entity facts only. It gives her birth in 1861 at Khig near Maiwand and her death at the Battle of Maiwand on 27 July 1880, recounts her folk story, and then, in its reception section, records that many scholars question her historicity and that no contemporary account mentions her. The article names no religion for her."
