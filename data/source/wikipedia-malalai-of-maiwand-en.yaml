summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ملالي مايواند؛ تُستخدم لوقائع الكيان فقط. تعطي مولدها سنة 1861 في خيغ قرب مايواند ووفاتها في معركة مايواند في 27 يوليو 1880، وتروي قصتها الشعبية، ثم تناقش في قسم الاستقبال تشكيك باحثين كثيرين في وجودها التاريخي وغياب أي ذكر معاصر لها. لا تسمي المقالة أي ديانة لها."
  en: "English Wikipedia article on Malalai of Maiwand; used for entity facts only. It gives her birth in 1861 at Khig near Maiwand and her death at the Battle of Maiwand on 27 July 1880, recounts her folk story, and then, in its reception section, records that many scholars question her historicity and that no contemporary account mentions her. The article names no religion for her."
  es: "Artículo de la Wikipedia en inglés sobre Malalai de Maiwand; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1861 en Khig, cerca de Maiwand, y su muerte en la batalla de Maiwand el 27 de julio de 1880. Relata su leyenda popular y, en la sección de recepción, señala que muchos estudiosos cuestionan su historicidad y que ningún relato contemporáneo la menciona. El artículo no especifica su religión."
  fr: "L'article de Wikipédia en anglais sur Malalai de Maiwand, utilisé uniquement pour les informations factuelles, indique sa naissance en 1861 à Khig, près de Maiwand, et sa mort lors de la bataille de Maiwand le 27 juillet 1880. Il relate sa légende et, dans sa partie consacrée à sa réception, précise que de nombreux chercheurs remettent en question son existence historique et qu'aucun récit contemporain ne la mentionne. L'article ne lui attribue aucune affiliation religieuse."
  ur: "میوند کی ملائی پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1861 میں میوند کے قریب کھگ میں اس کی پیدائش اور 27 جولائی 1880 کو میوند کی لڑائی میں اس کی موت، اس کی لوک کہانی بیان کرتی ہے، اور پھر، اس کے استقبالیہ حصے میں، یہ ریکارڈ کرتی ہے کہ بہت سے اسکالرز اس کی تاریخ پر سوال کرتے ہیں اور کوئی بھی معاصر اکاؤنٹ اس کا ذکر نہیں کرتا ہے۔ مضمون میں اس کے لیے کسی مذہب کا نام نہیں ہے۔"
