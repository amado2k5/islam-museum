reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id. It gives his full name as Ali Abdullah Harib Al-Habsi, born 30 December 1981 with the infobox birthplace Muscat; career at Al-Mudhaibi and Al-Nasr in Oman, Lyn in Norway, Bolton Wanderers, Wigan Athletic (FA Cup winner 2013), Brighton & Hove Albion on loan, Reading, Al-Hilal and West Bromwich Albion, retiring on 21 August 2020; Oman’s goalkeeper from 2001 to 2019, his 100th cap in January 2015, best goalkeeper at four Arabian Gulf Cups including the 2009 tournament Oman won; before turning professional he worked as a fireman at Seeb airport. Its personal-life section calls him “a practising Muslim”, citing The Guardian of 9 December 2011, and says his faith plays a big part in his life, citing his 2012 interview for the Association of Muslim Footballers. It names Islam generically and no school."
