  ar: "الموقع الرسمي للمتحدث حسان بدران، يقدّمه شخصية بارزة في مجال التنمية الذاتية برؤية إسلامية، ويعرض دوراته التدريبية وجلسات استشارية خاصة وشهادات متابعين من الأردن وفلسطين ودول أخرى."
