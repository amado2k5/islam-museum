reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). WikiFeqh is the Persian seminary encyclopaedia maintained from Qom; its entry, drawing on the classical biographical tradition (A'yan al-Shia and others, cited in its notes), calls Jamal al-Din Muhammad ibn Aqa Husayn one of the Imami jurists, gives his laqab Jamal al-Muhaqqiqin, describes his running of the Shi'i seminary of Isfahan, and dates his death to 1125 AH / 1713 CE — the reading the person record builds, against the Persian Wikipedia's first-stated 1122 AH. It agrees with the Persian article that his birth is unrecorded. An independent text from the Persian Wikipedia for the faith settlement: it names him Imami where Wikipedia names him Shia. Read in-session 1 November 2026."
