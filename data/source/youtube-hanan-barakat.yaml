summary:
  ar: "قناة حنان بركات على يوتيوب، وهي قناة مخصصة للنساء لحفظ القرآن الكريم وتعليم قواعد التجويد بطريقة مبسطة، وفيها سلسلة سورة البقرة برواية ورش وأذكار الصباح ومواضيع دينية وتربوية."
  en: "Hanan Barakat's YouTube channel, dedicated to women, for Qur'an memorisation and simplified tajweed teaching, carrying a Surah al-Baqarah series in the Warsh recitation, the morning adhkar and religious and family topics."
  es: "El canal de YouTube de Hanan Barakat, dedicado a las mujeres, ofrece información sobre la memorización del Corán y la enseñanza simplificada del tajweed, incluyendo una serie sobre la Sura al-Baqarah en su recitación Warsh, las súplicas matutinas y temas religiosos y familiares."
  fr: "La chaîne YouTube de Hanan Barakat, dédiée aux femmes, propose la mémorisation du Coran et un enseignement simplifié du tajwid, avec une série sur la sourate al-Baqarah récitée selon la méthode Warsh, les invocations du matin (adhkar) et des sujets religieux et familiaux."
  ur: "حنان برکات کا یوٹیوب چینل، قرآن حفظ کرنے اور آسان تجوید کی تعلیم کے لیے خواتین کے لیے وقف ہے، جس میں سورۃ البقرہ کا سلسلہ وار تلاوت، صبح کا اذکار اور مذہبی اور خاندانی موضوعات شامل ہیں۔"
  tr: "Hanan Barakat'ın YouTube kanalı, kadınların Kur'an'ı ezberlemesine ve Tacvidi kurallarını basitleştirilmiş bir şekilde öğretmesine adanmıştır. Kanal, sabah okumaları, anmalar, dini ve eğitim konularıyla anlatılan bir dizi Bakarah suresini içerir."
  id: "Saluran YouTube Hanan Barakat didedikasikan untuk perempuan yang menghafal Al-Qur'an dan mengajarkan aturan Tajweed secara sederhana. Saluran ini menampilkan serangkaian Surah Al-Baqarah yang dinarasikan melalui pembacaan pagi, kenangan, serta topik keagamaan dan pendidikan."
