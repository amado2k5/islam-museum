summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حكيم محمد سعيد (بعنوان Hakeem Muhammad Saeed)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في دلهي في 9 يناير 1920 لأسرة أردية متعلمة متدينة، ودراسته في جامعة دلهي وجامعة أنقرة، وإعادة تأسيسه مختبرات همدرد في كراتشي سنة 1948 وتأسيسه جامعة همدرد ومدينة الحكمة، وتأليفه نحو 200 كتاب، وحاكميته للسند في 1993–1994، واغتياله في كراتشي في 17 أكتوبر 1998، وأنه الأخ الأصغر لحكيم عبد الحميد."
  en: "English Wikipedia article on Hakim Muhammad Said (titled 'Hakeem Muhammad Saeed'); used for entity facts only. It recounts his birth at Delhi on 9 January 1920 to an educated, religious Urdu-speaking family, his studies at the University of Delhi and Ankara University, his re-establishment of the Hamdard Laboratories at Karachi in 1948, his founding of Hamdard University and the Madinat-al-Hikmah campus, his authorship of some 200 books, his governorship of Sindh in 1993–1994, his assassination at Karachi on 17 October 1998, and that he was the younger brother of Hakim Abdul Hameed."
