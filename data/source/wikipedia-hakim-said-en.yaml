summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حكيم محمد سعيد ⁦(بعنوان Hakeem Muhammad Saeed)⁩؛ تُستخدم لوقائع الكيان فقط. تروي مولده في دلهي في 9 يناير 1920 لأسرة أردية متعلمة متدينة، ودراسته في جامعة دلهي وجامعة أنقرة، وإعادة تأسيسه مختبرات همدرد في كراتشي سنة 1948 وتأسيسه جامعة همدرد ومدينة الحكمة، وتأليفه نحو 200 كتاب، وحاكميته للسند في 1993–1994، واغتياله في كراتشي في 17 أكتوبر 1998، وأنه الأخ الأصغر لحكيم عبد الحميد."
  en: "English Wikipedia article on Hakim Muhammad Said (titled 'Hakeem Muhammad Saeed'); used for entity facts only. It recounts his birth at Delhi on 9 January 1920 to an educated, religious Urdu-speaking family, his studies at the University of Delhi and Ankara University, his re-establishment of the Hamdard Laboratories at Karachi in 1948, his founding of Hamdard University and the Madinat-al-Hikmah campus, his authorship of some 200 books, his governorship of Sindh in 1993–1994, his assassination at Karachi on 17 October 1998, and that he was the younger brother of Hakim Abdul Hameed."
  es: "Artículo de la Wikipedia en inglés sobre Hakim Muhammad Said (titulado 'Hakeem Muhammad Saeed'); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Delhi el 9 de enero de 1920 en el seno de una familia educada, religiosa y de habla urdu, sus estudios en la Universidad de Delhi y la Universidad de Ankara, el restablecimiento de los Laboratorios Hamdard en Karachi en 1948, la fundación de la Universidad Hamdard y el campus Madinat-al-Hikmah, la autoría de unos 200 libros, su mandato como gobernador de Sindh entre 1993 y 1994, su asesinato en Karachi el 17 de octubre de 1998 y que era el hermano menor de Hakim Abdul Hameed."
  fr: "L'article de Wikipédia en anglais sur Hakim Muhammad Said (intitulé « Hakeem Muhammad Saeed ») est utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Delhi le 9 janvier 1920 dans une famille éduquée, religieuse et de langue ourdou, ses études à l'Université de Delhi et à l'Université d'Ankara, la réouverture des Laboratoires Hamdard à Karachi en 1948, la fondation de l'Université Hamdard et du campus Madinat-al-Hikmah, la publication de quelque 200 ouvrages, son mandat de gouverneur du Sindh en 1993-1994, son assassinat à Karachi le 17 octobre 1998, et précise qu'il était le frère cadet de Hakim Abdul Hameed."
  ur: "حکیم محمد سعید پر انگریزی ویکیپیڈیا کا مضمون ⁦(عنوان 'حکیم محمد سعید')⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 9 جنوری 1920 کو دہلی میں ایک پڑھے لکھے، مذہبی اردو بولنے والے گھرانے میں ہوئی، دہلی یونیورسٹی اور انقرہ یونیورسٹی میں ان کی تعلیم، 1948 میں کراچی میں ہمدرد لیبارٹریز کا دوبارہ قیام، ہمدرد یونیورسٹی اور مدینۃ الحکمہ کیمپس کا قیام، سندھ میں ان کی تصنیفات، ان کی کچھ کتابیں شامل ہیں۔ 1993-1994، 17 اکتوبر 1998 کو کراچی میں ان کا قتل، اور یہ کہ وہ حکیم عبدالحمید کے چھوٹے بھائی تھے۔"
  tr: "Hakeem Muhammad Saeed hakkında İngilizce Wikipedia makalesi (başlıklı Hakeem Muhammad Saeed); yalnızca varlığın gerçekleri için kullanılmıştır. 9 Ocak 1920'de Delhi'de dini eğitimli bir Urdu ailesinde doğmasını, Delhi Üniversitesi ve Ankara Üniversitesi'ndeki eğitimini, 1948'de Karaçi'de Hamdard Laboratuvarları'nı yeniden kurmasını, Hamdard Üniversitesi ve Madinat Al-Hikma'nın kuruluşunu, yaklaşık 200 kitabın yazarlığını, 1993–1994 yıllarında Sindh valiliğini, 17 Ekim 1998'de Karaçi'de suikastını ve Hakim Abdul Hamid'in küçük kardeşini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Hakeem Muhammad Saeed (berjudul Hakeem Muhammad Saeed); digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Delhi pada 9 Januari 1920 dari keluarga Urdu yang berpendidikan agama, studinya di Universitas Delhi dan Universitas Ankara, pendirian kembali Hamdard Laboratories di Karachi pada tahun 1948, pendirian Universitas Hamdard dan Madinat Al-Hikma, kepenugangannya sekitar 200 buku, masa jabatannya sebagai gubernur Sindh pada 1993–1994, pembunuhannya di Karachi pada 17 Oktober 1998, dan adik laki-lakinya dari Hakim Abdul Hamid."
