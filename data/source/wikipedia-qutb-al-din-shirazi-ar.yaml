  ar: "مقالة ويكيبيديا العربية عن قطب الدين الشيرازي (1236–1311)؛ تجعل ولادته في كازرون لعائلة صوفية، وتذكر الخرقة التي ألبسه إياها أبوه في سن العاشرة وتتلمذه على نصير الدين الطوسي ووفاته بتبريز سنة 710 هـ (1311)؛ تُستخدم لوقائع الكيان فقط."
  en: "Arabic Wikipedia article on Qutb al-Din al-Shirazi (1236-1311); it places his birth at Kazerun in a Sufi family, records the khirqa his father gave him at the age of ten, his studies under Nasir al-Din al-Tusi, and his death at Tabriz in 710 AH (1311 CE); used for entity facts only."
