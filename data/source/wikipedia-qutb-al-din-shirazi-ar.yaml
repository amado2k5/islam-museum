reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It attests the khirqa initiation independently of the English article — his father, a physician and Sufi who had himself received the khirqa from Shihab al-Din Umar al-Suhrawardi, gave it to the boy at ten — and it confirms his study under al-Tusi and his death at Tabriz in 710 AH. Its Kazerun birthplace conflicts with the English article's Shiraz and is preserved as a variant, not followed for the edge. It names no legal school for him. Checked 2 November 2026."
