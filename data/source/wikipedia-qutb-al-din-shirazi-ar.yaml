summary:
  ar: "مقالة ويكيبيديا العربية عن قطب الدين الشيرازي (1236–1311)؛ تجعل ولادته في كازرون لعائلة صوفية، وتذكر الخرقة التي ألبسه إياها أبوه في سن العاشرة وتتلمذه على نصير الدين الطوسي ووفاته بتبريز سنة 710 هـ (1311)؛ تُستخدم لوقائع الكيان فقط."
  en: "Arabic Wikipedia article on Qutb al-Din al-Shirazi (1236-1311); it places his birth at Kazerun in a Sufi family, records the khirqa his father gave him at the age of ten, his studies under Nasir al-Din al-Tusi, and his death at Tabriz in 710 AH (1311 CE); used for entity facts only."
  es: "Artículo de Wikipedia en árabe sobre Qutb al-Din al-Shirazi (1236-1311); sitúa su nacimiento en Kazerun en una familia sufí, registra la khirqa que su padre le dio a la edad de diez años, sus estudios con Nasir al-Din al-Tusi y su muerte en Tabriz en el año 710 AH (1311 d. C.); utilizado únicamente para datos sobre la persona."
  fr: "Article de Wikipédia en arabe sur Qutb al-Din al-Shirazi (1236-1311); il situe sa naissance à Kazerun dans une famille soufie, relate la khirqa que son père lui a donnée à l'âge de dix ans, ses études sous Nasir al-Din al-Tusi et sa mort à Tabriz en 710 AH (1311 CE); utilisé uniquement pour les faits concernant l'entité."
  ur: "قطب الدین الشیرازی (1236-1311) پر عربی ویکیپیڈیا مضمون؛ اس میں ان کی پیدائش کازرون میں ایک صوفی گھرانے میں ہوئی ہے، اس کے والد نے دس سال کی عمر میں انہیں دیے گئے خرقے کو ریکارڈ کیا ہے، ناصر الدین الطوسی کے زیر تعلیم ان کی تعلیم، اور ان کی وفات 710 ہجری ⁦(1311 عیسوی)⁩ میں تبریز میں ہوئی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔"
  tr: "Arapça Vikipedi makalesi, Kutbeddin el-Şirazi (1236–1311) hakkında Kazeroon'da bir Sufi ailesinde doğduğunu, babasının on yaşında giydirdiği pelerini, Nasir al-Din al-Tusi'nin himayeti ve 710 Hicri (1311) yılında Tebriz'de ölümü gibi bilgileri içerir; bu makale yalnızca varlığın gerçekleri için kullanılır."
  id: "Artikel Wikipedia Arab tentang Qutb al-Din al-Shirazi (1236–1311) menyatakan bahwa ia lahir di Kazeroon dari keluarga Sufi, menyebutkan jubah yang dikenakan ayahnya pada usia sepuluh tahun, bimbingan di bawah Nasir al-Din al-Tusi, dan kematiannya di Tabriz pada 710 H (1311); jubah ini hanya digunakan untuk fakta-fakta entitas tersebut."
