reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision. It gives his birth on 5 February 1952 at Veliko Čajno near Visoko, the Gazi Husrev-beg Madrasa in Sarajevo, his Al-Azhar scholarship, his imamate at the Islamic Cultural Center of Greater Chicago in Northbrook from 1981, his PhD in Islamic studies at the University of Chicago, his return as an imam in Zagreb in 1987, his headship of the Islamic Community of Bosnia and Herzegovina from April 1993 (Grand Mufti formally from 1999) until 19 November 2012, his co-founding of the Bosniak Academy of Sciences and Arts (2011) and the World Bosniak Congress (2012), the 2003 UNESCO Félix Houphouët-Boigny Peace Prize and his unsuccessful 2014 candidacy for the Bosniak seat of the state Presidency. Its infobox religion field gives 'Sunni Islam' and the article files him under 'Hanafi scholars' and 'Maturidis'; the school is stated for the man himself in his own published interview, registered separately."
