summary:
  ar: "مدخل موسوعة بريتانيكا عن ماهرشالا علي؛ يؤكد مولده في أوكلاند سنة 1974، ويذكر صراحة أنه اعتنق «طائفة الإسلام الأحمدية» أثناء دراسته في جامعة نيويورك وغيّر اسمه الأخير إلى علي، ويوثّق مسيرته حتى 2026."
  en: "Encyclopaedia Britannica entry on Mahershala Ali; it confirms his birth in Oakland in 1974, states expressly that while at New York University he 'converted to the Aḥmadiyyah sect of Islam' and changed his last name to Ali, and documents his career to 2026."
  es: "Entrada de la Enciclopedia Británica sobre Mahershala Ali; confirma su nacimiento en Oakland en 1974, afirma expresamente que mientras estudiaba en la Universidad de Nueva York \"se convirtió a la secta Ahmadiyyah del Islam\" y cambió su apellido a Ali, y documenta su carrera hasta 2026."
  fr: "L'article de l'Encyclopædia Britannica sur Mahershala Ali confirme sa naissance à Oakland en 1974, indique expressément que, pendant ses études à l'Université de New York, il s'est « converti à la secte ahmadiyya de l'islam » et a changé son nom de famille en Ali, et documente sa carrière jusqu'en 2026."
  ur: "مہرشالہ علی پر انسائیکلوپیڈیا برٹانیکا کا اندراج؛ یہ 1974 میں اوکلینڈ میں ان کی پیدائش کی تصدیق کرتا ہے، واضح طور پر بیان کرتا ہے کہ نیویارک یونیورسٹی میں رہتے ہوئے اس نے 'اسلام کے احمدیہ فرقے میں تبدیل ہو گئے' اور اپنا آخری نام علی رکھ لیا، اور اپنے کیریئر کو 2026 میں دستاویز کرتا ہے۔"
