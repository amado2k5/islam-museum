reliability_note: "Reference entry read in full on 25 October 2026 (published 20 June 2017, updated 23 October 2026). It gives his birth on 16 February 1974 at Oakland, California, his Hayward upbringing by a Baptist minister mother, the Saint Mary's College basketball scholarship (graduated 1996), the California Shakespeare apprenticeship, and the NYU Tisch MFA (2000) — and states: 'While studying there, he converted to the Aḥmadiyyah sect of Islam and changed his last name to Ali'; its FAQ repeats that he 'converted to the Aḥmadiyyah sect of Islam when he was in his twenties'. This is one of the independent attestations on which the person record's ahmadiyya segment rests. Career coverage includes The 4400, The Curious Case of Benjamin Button (2008), the rap albums as Prince Ali, House of Cards, Free State of Jones, Moonlight and Green Book, his Sufi-leader role in Ramy (2020), Swan Song (2021), Leave the World Behind (2023), Jurassic World Rebirth (2025), Your Mother Your Mother Your Mother (2026), and the Blade voice cameo in Eternals (2021) with his 2026 statements that he would no longer appear as the character."
