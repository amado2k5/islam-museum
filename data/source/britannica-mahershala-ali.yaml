  ar: "مدخل موسوعة بريتانيكا عن ماهرشالا علي؛ يؤكد مولده في أوكلاند سنة 1974، ويذكر صراحة أنه اعتنق «طائفة الإسلام الأحمدية» أثناء دراسته في جامعة نيويورك وغيّر اسمه الأخير إلى علي، ويوثّق مسيرته حتى 2026."
  en: "Encyclopaedia Britannica entry on Mahershala Ali; it confirms his birth in Oakland in 1974, states expressly that while at New York University he 'converted to the Aḥmadiyyah sect of Islam' and changed his last name to Ali, and documents his career to 2026."
