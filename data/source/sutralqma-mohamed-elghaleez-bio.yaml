summary:
  ar: "سيرة منشورة عن الداعية المصري محمد الغليظ في موقع سطر القمة؛ تصفه بأسلوبه المباشر الموجه إلى الشباب وببرامجه «شهادة تقدير» و«الجواب» و«من أين أبدأ؟»، وتذكر أن قناته على يوتيوب تجاوزت 1.8 مليون مشترك."
  en: "A published biography of the Egyptian preacher Mohamed Elghaleez on the Sutralqma site, describing his direct style addressed to young people and his programmes Shahadat Taqdir, Al-Jawab and Min Ayna Abda, and recording that his YouTube channel passed 1.8 million subscribers."
  es: "En el sitio web Sutralqma se publicó una biografía del predicador egipcio Mohamed Elghaleez, que describe su estilo directo dirigido a los jóvenes y sus programas Shahadat Taqdir, Al-Jawab y Min Ayna Abda, y que indica que su canal de YouTube superó los 1,8 millones de suscriptores."
  fr: "Une biographie du prédicateur égyptien Mohamed Elghaleez a été publiée sur le site Sutralqma, décrivant son style direct adressé aux jeunes et ses émissions Shahadat Taqdir, Al-Jawab et Min Ayna Abda, et indiquant que sa chaîne YouTube a dépassé les 1,8 million d'abonnés."
  ur: "مصری مبلغ محمد الغالیز کی سوترالقما سائٹ پر شائع ہونے والی سوانح عمری، جس میں نوجوانوں سے خطاب کرتے ہوئے ان کے براہ راست انداز اور ان کے پروگرام شہادت تقدیر، الجواب اور من عینا عبدہ کو بیان کیا گیا، اور یہ ریکارڈ کیا گیا کہ ان کے یوٹیوب چینل کے 1.8 ملین سبسکرائبرز گزر چکے ہیں۔"
  tr: "Mısırlı vaiz Mohamed Al-Ghaliz hakkında 'Satr Al-Qimma' web sitesinde yayımlanan bir biyografi; onu gençlere yönelik doğrudan tarzı ve 'Certificate of Appreciation', 'The Answer' ve 'Where Do I Started?' programlarıyla tanımlıyor. ve YouTube kanalının 1,8 milyonu aştığı belirtiliyor."
  id: "Biografi yang diterbitkan tentang pengkhotbah Mesir Mohamed Al-Ghaliz di situs web 'Satr Al-Qimma'; menggambarkan dirinya dengan gaya langsungnya yang ditujukan kepada pemuda dan programnya 'Certificate of Appreciation,' 'The Answer,' dan 'Where Do I Start?', dan disebutkan bahwa saluran YouTube-nya telah melebihi 1,8 juta pelanggan."
title: "من هو محمد الغليظ ويكيبيديا، تاريخ ميلاده، كم عمره، زوجته، مذهبه، السيرة الذاتية"
