summary:
  ar: "مقالة ويكيبيديا الإندونيسية المفصلة عن خيرول تانجونغ، المولود في 18 حزيران 1962 في جاكرتا لأب صحفي من سومطرة الشمالية وأم من جاوة الغربية؛ تذكر بداياته التجارية طالبًا، وتأسيسه بارا غروب ثم سي تي كورب، ووزارته سنة 2014، وأستاذيته في جامعة أيرلانغا، وتعيينه في مجلس مستشاري الرئيس في 2 تشرين الأول 2026."
  en: "Detailed Indonesian Wikipedia article on Chairul Tanjung, born 18 June 1962 in Jakarta to a journalist father from North Sumatra and a mother from West Java; it records his student trading ventures, his founding of Para Group and then CT Corp, his 2014 ministry, his professorship at Airlangga University, and his appointment to the Presidential Advisory Council on 2 October 2026."
  es: "Artículo detallado de la Wikipedia en indonesio sobre Chairul Tanjung, nacido el 18 de junio de 1962 en Yakarta, hijo de un periodista originario de Sumatra del Norte y una madre de Java Occidental; en él se recogen sus emprendimientos comerciales como estudiante, la fundación de Para Group y posteriormente de CT Corp, su ministerio en 2014, su cátedra en la Universidad de Airlangga y su nombramiento en el Consejo Asesor Presidencial el 2 de octubre de 2026."
  fr: "Article détaillé de Wikipédia indonésien sur Chairul Tanjung, né le 18 juin 1962 à Jakarta d'un père journaliste originaire du nord de Sumatra et d'une mère originaire de Java occidental; il relate ses entreprises commerciales étudiantes, la fondation du groupe Para puis de CT Corp, son ministère en 2014, son poste de professeur à l'université Airlangga et sa nomination au Conseil consultatif présidentiel le 2 octobre 2026."
