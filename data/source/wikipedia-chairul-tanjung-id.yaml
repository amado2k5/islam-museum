  ar: "مقالة ويكيبيديا الإندونيسية المفصلة عن خيرول تانجونغ، المولود في 18 حزيران 1962 في جاكرتا لأب صحفي من سومطرة الشمالية وأم من جاوة الغربية؛ تذكر بداياته التجارية طالبًا، وتأسيسه بارا غروب ثم سي تي كورب، ووزارته سنة 2014، وأستاذيته في جامعة أيرلانغا، وتعيينه في مجلس مستشاري الرئيس في 2 تشرين الأول 2026."
  en: "Detailed Indonesian Wikipedia article on Chairul Tanjung, born 18 June 1962 in Jakarta to a journalist father from North Sumatra and a mother from West Java; it records his student trading ventures, his founding of Para Group and then CT Corp, his 2014 ministry, his professorship at Airlangga University, and his appointment to the Presidential Advisory Council on 2 October 2026."
