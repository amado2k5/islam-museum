summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله توقاي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 26 أبريل 1886 في قوشلاويتش (من 14 أبريل بالتقويم اليولياني) ووفاته بالسل في 15 أبريل 1913 في قازان (من 2 أبريل يوليانيا)، ويتمه المبكر ودراسته في مدرسة موتيغيا بأورالسك وعمله في صحافة قازان التترية، وتذكر أن أباه كان ملا القرية الوراثي وأن الفتى فقد في السادسة عشرة اهتمامه بدراسة القرآن بحسب سيرته المعيارية؛ ولا تسمي له مذهبا."
  en: "English Wikipedia article on Gabdulla Tukay; used for entity facts only. It gives his birth on 26 April 1886 at Quşlawıç (from 14 April, Julian) and his death from tuberculosis on 15 April 1913 at Kazan (from 2 April, Julian), his early orphaning, his years at the Motıyğiya madrasa in Uralsk and his work in the Tatar press of Kazan; it records that his father was the hereditary village mullah and that, in his standard biography, the sixteen-year-old lost interest in Qur'an study at the madrasa; it names no school for him."
