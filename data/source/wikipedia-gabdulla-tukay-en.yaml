summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله توقاي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 26 أبريل 1886 في قوشلاويتش ⁦(من 14 أبريل بالتقويم اليولياني)⁩ ووفاته بالسل في 15 أبريل 1913 في قازان ⁦(من 2 أبريل يوليانيا)⁩، ويتمه المبكر ودراسته في مدرسة موتيغيا بأورالسك وعمله في صحافة قازان التترية، وتذكر أن أباه كان ملا القرية الوراثي وأن الفتى فقد في السادسة عشرة اهتمامه بدراسة القرآن بحسب سيرته المعيارية؛ ولا تسمي له مذهبا."
  en: "English Wikipedia article on Gabdulla Tukay; used for entity facts only. It gives his birth on 26 April 1886 at Quşlawıç (from 14 April, Julian) and his death from tuberculosis on 15 April 1913 at Kazan (from 2 April, Julian), his early orphaning, his years at the Motıyğiya madrasa in Uralsk and his work in the Tatar press of Kazan; it records that his father was the hereditary village mullah and that, in his standard biography, the sixteen-year-old lost interest in Qur'an study at the madrasa; it names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Gabdulla Tukay; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 26 de abril de 1886 en Quşlawıç (a partir del 14 de abril, según el calendario juliano) y su muerte por tuberculosis el 15 de abril de 1913 en Kazán (a partir del 2 de abril, según el calendario juliano), su temprana orfandad, sus años en la madrasa Motıyğiya en Uralsk y su trabajo en la prensa tártara de Kazán; registra que su padre era el mulá hereditario del pueblo y que, en su biografía estándar, el joven de dieciséis años perdió el interés por el estudio del Corán en la madrasa; no menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en anglais sur Gabdulla Tukay; utilisé uniquement pour les informations factuelles. Il indique sa naissance le 26 avril 1886 à Quşlawıç (14 avril selon le calendrier julien) et sa mort de la tuberculose le 15 avril 1913 à Kazan (2 avril selon le calendrier julien), son orphelinat précoce, ses années à la madrasa Motıyğiya à Oural et son travail dans la presse tatare de Kazan; il mentionne que son père était le mollah héréditaire du village et que, dans sa biographie officielle, à l’âge de seize ans, il se désintéressa de l’étude du Coran à la madrasa; il ne cite aucune école à son sujet."
