  ar: "مقالة ويكيبيديا الإنجليزية عن جهان آرا شاه نواز (1896–1979)؛ تعطي مولدها في لاهور في 7 نيسان 1896 ووفاتها في 27 تشرين الثاني 1979، وتروي مسيرتها في الرابطة الإسلامية ومجلس البنجاب التشريعي وتأليفها لرواية ومذكرات، ولا تسمي لها ديناً أو مذهباً."
  en: "The English Wikipedia article on Jahanara Shahnawaz (1896–1979); it gives her birth at Lahore on 7 April 1896 and her death on 27 November 1979, and recounts her career in the Muslim League and the Punjab Legislative Assembly and her novel and memoirs; it names no religion or school for her."
