reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read at revision 76000198 on 25 October 2026 (lead and the early-life, revolt and Syria sections read in full). The article agrees with the English article on the Gregorian dates 20 May 1885 – 8 September 1933 but places the birth at Taif, against the English article's Mecca; and its Hijri birth year, 1300 AH, corresponds to 1882–83 CE — matching the Urdu article's 1883 variant, not the 1885 both articles print in Gregorian. Both discrepancies are stated in the record. It names no school for Faisal."
