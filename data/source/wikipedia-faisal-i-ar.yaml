summary:
  ar: "مقالة ويكيبيديا العربية عن الشريف أبي غازي فيصل الأول بن الحسين (20 مايو 1885 – 8 سبتمبر 1933)، المولود في الطائف والمترعرع عند قبيلة عتيبة في بادية الحجاز، وقائد الثورة العربية الكبرى، ثم ملك المملكة العربية السورية فملك المملكة العراقية؛ تروي دراسته في الأستانة، ووساطته لدى جمال باشا، وقيادته الجيش الشمالي ودخوله دمشق، وتتويجه في سوريا وخلعه بعد ميسلون."
  en: "Arabic Wikipedia article on Sharif Abu Ghazi Faisal I bin Hussein (20 May 1885 – 8 September 1933), born at Taif and raised among the Utayba tribe in the Hejaz desert, leader in the Great Arab Revolt, then King of the Arab Kingdom of Syria and King of the Kingdom of Iraq; it recounts his studies at Istanbul, his intercession with Djemal Pasha, his command of the Northern Army and entry into Damascus, his coronation in Syria and removal after Maysalun."
