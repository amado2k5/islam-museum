summary:
  ar: "مقالة ويكيبيديا العربية عن الشريف أبي غازي فيصل الأول بن الحسين ⁦(20 مايو 1885 – 8 سبتمبر 1933)⁩، المولود في الطائف والمترعرع عند قبيلة عتيبة في بادية الحجاز، وقائد الثورة العربية الكبرى، ثم ملك المملكة العربية السورية فملك المملكة العراقية؛ تروي دراسته في الأستانة، ووساطته لدى جمال باشا، وقيادته الجيش الشمالي ودخوله دمشق، وتتويجه في سوريا وخلعه بعد ميسلون."
  en: "Arabic Wikipedia article on Sharif Abu Ghazi Faisal I bin Hussein (20 May 1885 – 8 September 1933), born at Taif and raised among the Utayba tribe in the Hejaz desert, leader in the Great Arab Revolt, then King of the Arab Kingdom of Syria and King of the Kingdom of Iraq; it recounts his studies at Istanbul, his intercession with Djemal Pasha, his command of the Northern Army and entry into Damascus, his coronation in Syria and removal after Maysalun."
  es: "Artículo en la Wikipedia en árabe sobre Sharif Abu Ghazi Faisal I bin Hussein (20 de mayo de 1885 - 8 de septiembre de 1933), nacido en Taif y criado entre la tribu Utayba en el desierto de Hiyaz, líder de la Gran Revuelta Árabe, luego rey del Reino Árabe de Siria y rey del Reino de Irak; relata sus estudios en Estambul, su intercesión con Djemal Pasha, su mando del Ejército del Norte y su entrada en Damasco, su coronación en Siria y su destitución tras Maysalun."
  fr: "L'article de Wikipédia en arabe sur Sharif Abu Ghazi Faisal I bin Hussein (20 mai 1885 – 8 septembre 1933), né à Taïf et élevé au sein de la tribu Utayba dans le désert du Hedjaz, chef de la Grande Révolte arabe, puis roi du royaume arabe de Syrie et roi du royaume d'Irak; il relate ses études à Istanbul, son intercession auprès de Djemal Pacha, son commandement de l'armée du Nord et son entrée à Damas, son couronnement en Syrie et sa destitution après Maysalun."
  ur: "شریف ابو غازی فیصل اول بن حسین ⁦(20 مئی 1885 - 8 ستمبر 1933)⁩ پر عربی ویکیپیڈیا کا مضمون، طائف میں پیدا ہوا اور صحرائے حجاز میں عطیبہ قبیلے میں پرورش پایا، عظیم عرب بغاوت کے رہنما، اس وقت عرب مملکت شام کے بادشاہ اور عراق کی بادشاہت کے بادشاہ؛ اس میں استنبول میں ان کی تعلیم، جیمل پاشا کے ساتھ ان کی شفاعت، شمالی فوج کی کمانڈ اور دمشق میں داخلہ، شام میں اس کی تاجپوشی اور میسالون کے بعد ہٹائے جانے کا ذکر ہے۔"
