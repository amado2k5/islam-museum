  en: "Futuh Misr wa-l-Maghrib — Ibn Abd al-Hakam (ed. Abd al-Mun'im Amir, al-Hay'a al-Amma li-Qusur al-Thaqafa)"
  ur: "فتوح مصر والمغرب — ابن عبد الحکم (تحقیق عبد المنعم عامر، الہیئۃ العامۃ لقصور الثقافۃ)"
summary:
  ar: "كتاب عبد الرحمن بن عبد الله بن عبد الحكم المصري (ت 257هـ) في تاريخ مصر وفتحها وفتوح المغرب والأندلس، بتحقيق عبد المنعم عامر، في سلسلة الذخائر (رقم 49) عن الهيئة العامة لقصور الثقافة بالقاهرة، رقم الإيداع 99/7575. مجلد واحد فيه مقدمة المحقق بترقيم حرفي ثم المتن من ص 1 إلى نحو ص 303."
  en: "Abd al-Rahman ibn Abd Allah ibn Abd al-Hakam al-Misri's (d. 257 AH) history of Egypt, its conquest and the conquests of the Maghrib and al-Andalus, edited by Abd al-Mun'im Amir in the al-Dhakha'ir series (no. 49) of al-Hay'a al-Amma li-Qusur al-Thaqafa, Cairo, legal deposit no. 99/7575. One volume: the editor's introduction with letter pagination, then the text, pp. 1 to about 303."
  ur: "عبد الرحمن بن عبد اللہ بن عبد الحکم مصری (وفات 257ھ) کی کتاب جو مصر کی تاریخ، اس کی فتح اور مغرب و اندلس کی فتوحات پر ہے؛ تحقیق عبد المنعم عامر، سلسلہ الذخائر (نمبر 49)، الہیئۃ العامۃ لقصور الثقافۃ، قاہرہ، رقم الایداع 99/7575۔ ایک جلد: محقق کا مقدمہ حروفی صفحات کے ساتھ، پھر متن ص 1 سے تقریباً ص 303 تک۔"
