summary:
  ar: "الموقع الرسمي لـ«مسلمة ويلنس»، ممارسة علاج نفسي عبر الإنترنت للنساء المسلمات، وهو مكتوب بالكامل بصوت مؤسِّسته وطبيبتها الوحيدة زينب فرخ: يقدّمها معالجة نفسية متخصصة في الصدمات وطبيبة نفسية سريرية، ويذكر درجتيها في علم النفس السريري من جامعة العلوم والتكنولوجيا الوطنية (NUST) وعلم النفس من جامعة قائد أعظم، ودبلومها في الإرشاد والعلاج النفسي التكاملي، وسبع سنوات من الممارسة السريرية منها ثلاث سنوات في باكستان وعمل سابق مع «تيلوس هيلث»، وخدمتها عميلات في أمريكا الشمالية والمملكة المتحدة والشرق الأوسط وباكستان بالإنجليزية والأردية."
  en: "The official website of Muslimah Wellness, an online therapy practice for Muslim women, written entirely in the first-person voice of its sole therapist, Zainab Farrukh: it presents her as a trauma-informed therapist and clinical psychologist and records her master's in Clinical Psychology from the National University of Sciences and Technology (NUST), her master's in Psychology from Quaid-e-Azam University, her diploma in integrative counselling and psychotherapy, her seven-plus years of clinical practice including three years in Pakistan and prior work with Telus Health, and her work with clients across North America, the UK, the Middle East and Pakistan in English and Urdu."
