summary:
  ar: "الموقع الرسمي لـ«مسلمة ويلنس»، ممارسة علاج نفسي عبر الإنترنت للنساء المسلمات، وهو مكتوب بالكامل بصوت مؤسِّسته وطبيبتها الوحيدة زينب فرخ: يقدّمها معالجة نفسية متخصصة في الصدمات وطبيبة نفسية سريرية، ويذكر درجتيها في علم النفس السريري من جامعة العلوم والتكنولوجيا الوطنية (NUST) وعلم النفس من جامعة قائد أعظم، ودبلومها في الإرشاد والعلاج النفسي التكاملي، وسبع سنوات من الممارسة السريرية منها ثلاث سنوات في باكستان وعمل سابق مع «تيلوس هيلث»، وخدمتها عميلات في أمريكا الشمالية والمملكة المتحدة والشرق الأوسط وباكستان بالإنجليزية والأردية."
  en: "The official website of Muslimah Wellness, an online therapy practice for Muslim women, written entirely in the first-person voice of its sole therapist, Zainab Farrukh: it presents her as a trauma-informed therapist and clinical psychologist and records her master's in Clinical Psychology from the National University of Sciences and Technology (NUST), her master's in Psychology from Quaid-e-Azam University, her diploma in integrative counselling and psychotherapy, her seven-plus years of clinical practice including three years in Pakistan and prior work with Telus Health, and her work with clients across North America, the UK, the Middle East and Pakistan in English and Urdu."
  es: "El sitio web oficial de Muslimah Wellness, una consulta de terapia en línea para mujeres musulmanas, está escrito íntegramente en primera persona por su única terapeuta, Zainab Farrukh: la presenta como terapeuta especializada en trauma y psicóloga clínica, y recoge su máster en Psicología Clínica por la Universidad Nacional de Ciencias y Tecnología (NUST), su máster en Psicología por la Universidad Quaid-e-Azam, su diploma en consejería y psicoterapia integrativa, sus más de siete años de práctica clínica, incluidos tres años en Pakistán y su trabajo previo con Telus Health, y su trabajo con clientes en Norteamérica, el Reino Unido, Oriente Medio y Pakistán en inglés y urdu."
  fr: "Le site officiel de Muslimah Wellness, un cabinet de thérapie en ligne pour femmes musulmanes, est entièrement rédigé à la première personne par sa seule thérapeute, Zainab Farrukh: il la présente comme une thérapeute spécialisée dans les traumatismes et une psychologue clinicienne, et mentionne sa maîtrise en psychologie clinique de l’Université nationale des sciences et technologies (NUST), sa maîtrise en psychologie de l’Université Quaid-e-Azam, son diplôme en conseil et psychothérapie intégrative, ses plus de sept années de pratique clinique, dont trois au Pakistan et une expérience antérieure chez Telus Health, ainsi que son travail avec des clients en Amérique du Nord, au Royaume-Uni, au Moyen-Orient et au Pakistan, en anglais et en ourdou."
  ur: "Muslimah Wellness کی سرکاری ویب سائٹ، جو مسلم خواتین کے لیے ایک آن لائن تھراپی پریکٹس ہے، مکمل طور پر اس کی واحد تھراپسٹ، زینب فرخ کی پہلی شخصی آواز میں لکھی گئی ہے: یہ اسے ایک صدمے سے باخبر معالج اور طبی ماہر نفسیات کے طور پر پیش کرتی ہے اور نیشنل یونیورسٹی آف سائنسز اینڈ ٹیکنالوجی سے کلینیکل سائیکالوجی میں اپنے ماسٹرز کی ریکارڈنگ کرتی ہے۔ یونیورسٹی، انٹیگریٹیو کونسلنگ اور سائیکو تھراپی میں اس کا ڈپلومہ، اس کی سات سے زیادہ سال کی کلینیکل پریکٹس بشمول تین سال پاکستان میں اور ٹیلس ہیلتھ کے ساتھ پہلے کام، اور اس کا شمالی امریکہ، برطانیہ، مشرق وسطیٰ اور پاکستان کے کلائنٹس کے ساتھ انگریزی اور اردو میں کام۔"
  tr: "'Muslim Wellness'in resmi web sitesi, tamamen kurucusu ve tek doktoru Zainab Farkh'ın sesiyle yazılan çevrimiçi bir psikoterapi uygulamasıdır: kendisine travma alanında uzmanlaşmış bir psikoterapist ve bir klinik psikolog hizmet vermektedir. Ulusal Bilim ve Teknoloji Üniversitesi'nden (NUST) klinik psikoloji ve Quaid Azam Üniversitesi'nden psikoloji alanlarında iki diploma, danışmanlık ve bütünleştirici psikoterapi diploması, yedi yıl klinik uygulama (üç yıl Pakistan'da ve daha önce Telus Health'te çalışmıştır) bulunmaktadır. Kuzey Amerika, Birleşik Krallık, Orta Doğu ve Pakistan'daki danışanlarına İngilizce ve Urduca dillerinde hizmet vermiştir."
  id: "Situs resmi 'Muslim Wellness' adalah praktik psikoterapi daring untuk perempuan Muslim, ditulis sepenuhnya dengan suara pendiri sekaligus satu-satunya dokternya, Zainab Farkh: ia ditawarkan oleh seorang psikoterapis yang mengkhususkan diri dalam trauma dan seorang psikolog klinis. Ia memiliki dua gelar di bidang psikologi klinis dari National University of Science and Technology (NUST) dan psikologi dari Quaid Azam University, diploma konseling dan psikoterapi integratif, tujuh tahun praktik klinis, termasuk tiga tahun di Pakistan dan sebelumnya bekerja di Telus Health. Ia telah melayani klien di Amerika Utara, Inggris, Timur Tengah, dan Pakistan dalam bahasa Inggris dan Urdu."
