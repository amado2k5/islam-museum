  ar: "مدخل موسوعة بريتانيكا عن عثمان دان فودي؛ يؤرخ ميلاده في ديسمبر 1754 بماراتا في غوبير ووفاته سنة 1817 بصوكوتو، ويذكر قبوله في الطريقة القادرية وطرق صوفية أخرى على يد جبريل بن عمر."
  en: "Encyclopaedia Britannica entry on Usman dan Fodio; it dates his birth to December 1754 at Maratta in Gobir and his death to 1817 at Sokoto, and records that Jibril ibn Umar admitted him to the Qadiri and other Sufi orders."
