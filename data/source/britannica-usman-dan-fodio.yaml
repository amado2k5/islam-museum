reliability_note: "Reference entry read in full on 1 November 2026 (first published 20 July 1998). It calls him a Fulani mystic, philosopher and revolutionary reformer, gives his birth in December 1754 at Maratta, Gobir, and his death in 1817 at Sokoto, records his study at Degel and his admission by Jibril ibn Umar to the Qadiri and other Sufi orders, the concessions won from Sultan Bawa of Gobir, the hijra to Gudu in February 1804, the jihad and the caliphate's organisation, and names his brother Abdullahi and his son Muhammad Bello as his closest scholarly associates. It names no legal school for him."
