summary:
  ar: "مدخل موسوعة بريتانيكا عن عثمان دان فودي؛ يؤرخ ميلاده في ديسمبر 1754 بماراتا في غوبير ووفاته سنة 1817 بصوكوتو، ويذكر قبوله في الطريقة القادرية وطرق صوفية أخرى على يد جبريل بن عمر."
  en: "Encyclopaedia Britannica entry on Usman dan Fodio; it dates his birth to December 1754 at Maratta in Gobir and his death to 1817 at Sokoto, and records that Jibril ibn Umar admitted him to the Qadiri and other Sufi orders."
  es: "Entrada de la Encyclopaedia Britannica sobre Usman dan Fodio; fecha su nacimiento en diciembre de 1754 en Maratta en Gobir y su muerte en 1817 en Sokoto, y registra que Jibril ibn Umar lo admitió en el Qadiri y otras órdenes sufíes."
  fr: "Entrée de l'Encyclopaedia Britannica sur Usman dan Fodio; il date sa naissance en décembre 1754 à Maratta à Gobir et sa mort en 1817 à Sokoto, et rapporte que Jibril ibn Umar l'a admis dans les Qadiri et d'autres ordres soufis."
