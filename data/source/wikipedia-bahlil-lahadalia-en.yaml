summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بهليل لحاداليا ⁦(وُلد في ٧ آب ١٩٧٦ في باندا بجزر الملوك)⁩، رجل الأعمال والسياسي الإندونيسي؛ تذكر نشأته الفقيرة وعمله بائعًا وسائقًا، ودراسته ودكتوراه سنة ٢٠٢٤ المثيرة للجدل، ونشاطه في رابطة الطلاب المسلمين (HMI)، ورئاسته نقابة رجال الأعمال الشباب، وقيادته هيئة الاستثمار ووزارة الاستثمار، ووزارة الطاقة والموارد المعدنية، ورئاسته حزب غولكار، وجدلَي سياسة الغاز المسال وتراخيص التعدين."
  en: "English Wikipedia article on Bahlil Lahadalia (born 7 August 1976 in Banda, Central Maluku), Indonesian businessman and politician; it records his poor upbringing and work as a vendor and driver, his education and contested 2024 doctorate, his activism in the Muslim Students' Association (HMI), his chairmanship of the young entrepreneurs' association HIPMI, his leadership of the Investment Coordinating Board and the Investment Ministry, the energy and mineral resources ministry, his chairmanship of Golkar, and the LPG and mining-licence controversies."
  es: "Artículo de la Wikipedia en inglés sobre Bahlil Lahadalia (nacido el 7 de agosto de 1976 en Banda, Maluku Central), empresario y político indonesio; en él se narra su humilde infancia y su trabajo como vendedor y conductor, su formación académica y su controvertido doctorado de 2024, su activismo en la Asociación de Estudiantes Musulmanes (HMI), su presidencia de la asociación de jóvenes emprendedores HIPMI, su liderazgo en la Junta Coordinadora de Inversiones y el Ministerio de Inversiones, el Ministerio de Energía y Recursos Minerales, su presidencia de Golkar y las controversias sobre el GLP y las licencias mineras."
  fr: "L'article de Wikipédia en anglais sur Bahlil Lahadalia (né le 7 août 1976 à Banda, dans les Moluques centrales), homme d'affaires et homme politique indonésien, relate son enfance difficile et son travail de vendeur et de chauffeur, ses études et son doctorat contesté en 2024, son activisme au sein de l'Association des étudiants musulmans (HMI), sa présidence de l'association des jeunes entrepreneurs HIPMI, sa direction du Conseil de coordination des investissements et du ministère de l'Investissement, du ministère de l'Énergie et des Ressources minérales, sa présidence de Golkar, ainsi que les controverses liées au GPL et aux licences minières."
  ur: "بہلیل لہادالیہ ⁦(پیدائش 7 اگست 1976 باندا، وسطی مالوکو)⁩ پر انگریزی ویکیپیڈیا مضمون، انڈونیشیائی تاجر اور سیاست دان؛ اس میں ان کی ناقص پرورش اور ایک وینڈر اور ڈرائیور کے طور پر کام، ان کی تعلیم اور مقابلہ 2024 میں ڈاکٹریٹ، مسلم سٹوڈنٹس ایسوسی ایشن (HMI) میں ان کی سرگرمی، نوجوان تاجروں کی انجمن HIPMI کی ان کی چیئرمین شپ، انویسٹمنٹ کوآرڈینیٹنگ بورڈ کی قیادت اور سرمایہ کاری کی وزارت، توانائی اور معدنی وسائل کی سربراہی، جی پی جی کی چیئرمین شپ، ایل پی جی، منی لانڈری اور منی لانڈری کا ریکارڈ ہے۔ کان کنی کے لائسنس کے تنازعات۔"
  tr: "Bahlil Hadalia (7 Ağustos 1976, Banda, Kings Islands doğumlu) hakkında İngilizce Wikipedia makalesi, Endonezyalı bir iş insanı ve siyasetçidir; kötü yetiştirilme tarzını ve satış elemanı ile şoförlük çalışmalarını, tartışmalı 2024 doktora çalışmalarını, Müslüman Öğrenciler Derneği (HMI) faaliyetlerini, Genç İş Adamları Sendikası liderliğini, Yatırım Otoritesi, Yatırım Bakanlığı, Enerji ve Maden Kaynakları Bakanlığı'nın liderliğini, Golkar Partisi'nin liderliğini ve sıvılaştırılmış gaz politikası ile madencilik lisansları tartışmasını anımsamaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Bahlil Hadalia (lahir 7 Agustus 1976, di Banda, Kepulauan Kings), adalah seorang pengusaha dan politisi Indonesia; artikel ini mengenang masa kecilnya yang miskin dan pekerjaannya sebagai salesman dan sopir, studi doktoralnya yang kontroversial pada tahun 2024, aktivitasnya di Asosiasi Mahasiswa Muslim (HMI), kepemimpinannya di Young Businessmen's Syndicate, kepemimpinannya di Otoritas Investasi, Kementerian Investasi, Kementerian Energi dan Sumber Daya Mineral, kepemimpinannya di Partai Golkar, serta perdebatan mengenai kebijakan gas cair dan lisensi pertambangan."
