summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بهليل لحاداليا (وُلد في ٧ آب ١٩٧٦ في باندا بجزر الملوك)، رجل الأعمال والسياسي الإندونيسي؛ تذكر نشأته الفقيرة وعمله بائعًا وسائقًا، ودراسته ودكتوراه سنة ٢٠٢٤ المثيرة للجدل، ونشاطه في رابطة الطلاب المسلمين (HMI)، ورئاسته نقابة رجال الأعمال الشباب، وقيادته هيئة الاستثمار ووزارة الاستثمار، ووزارة الطاقة والموارد المعدنية، ورئاسته حزب غولكار، وجدلَي سياسة الغاز المسال وتراخيص التعدين."
  en: "English Wikipedia article on Bahlil Lahadalia (born 7 August 1976 in Banda, Central Maluku), Indonesian businessman and politician; it records his poor upbringing and work as a vendor and driver, his education and contested 2024 doctorate, his activism in the Muslim Students' Association (HMI), his chairmanship of the young entrepreneurs' association HIPMI, his leadership of the Investment Coordinating Board and the Investment Ministry, the energy and mineral resources ministry, his chairmanship of Golkar, and the LPG and mining-licence controversies."
