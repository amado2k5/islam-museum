summary:
  ar: "مقالة ويكيبيديا الأردية عن سر میان محمد شفیع ⁦(10 آذار 1869 – 7 كانون الثاني 1932)⁩؛ تُستخدم لوقائع الكيان فقط. هي ترجمة للمقالة الإنجليزية، وتروي مولده في لاهور وتعليمه ومحاماته وتأسيسه فرع البنجاب لرابطة مسلمي عموم الهند ووفاته ودفنه في باغبانبورا."
  en: "Urdu Wikipedia article on Sir Mian Muhammad Shafi (10 March 1869 – 7 January 1932); used for entity facts only. It is a translation of the English article — one source family with it — recounting his Lahore birth, education, legal career, founding of the Punjab Muslim League, and his death and burial at Baghbanpura."
  es: "Artículo de Wikipedia en urdu sobre Sir Mian Muhammad Shafi (10 de marzo de 1869 - 7 de enero de 1932); se utiliza únicamente para datos biográficos. Es una traducción del artículo en inglés —que incluye una fuente— que relata su nacimiento en Lahore, su educación, su carrera jurídica, la fundación de la Liga Musulmana del Punjab y su fallecimiento y entierro en Baghbanpura."
  fr: "Article de Wikipédia en ourdou sur Sir Mian Muhammad Shafi (10 mars 1869 – 7 janvier 1932); utilisé uniquement à des fins d’information. Il s’agit d’une traduction de l’article anglais (dont une source est issue) relatant sa naissance à Lahore, ses études, sa carrière juridique, la fondation de la Ligue musulmane du Pendjab, ainsi que sa mort et son inhumation à Baghbanpura."
  ur: "سر میاں محمد شفیع پر اردو ویکیپیڈیا مضمون ⁦(10 مارچ 1869 - 7 جنوری 1932)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انگریزی مضمون کا ترجمہ ہے - ایک ذریعہ خاندان اس کے ساتھ - اس کی لاہور پیدائش، تعلیم، قانونی کیریئر، پنجاب مسلم لیگ کی بنیاد، اور باغبانپورہ میں ان کی وفات اور تدفین کا ذکر کرتا ہے۔"
