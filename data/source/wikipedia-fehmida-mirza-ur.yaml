summary:
  ar: "مقالة ويكيبيديا الأردية عن فهميدة ميرزا؛ تُستخدم لوقائع الكيان فقط. توثّق طبّها وانتخاباتها من بدين ورئاستها للجمعية الوطنية، وتصف أسرتها بأنها «أسرة سياسية مسلمة شيعية سندية» — وهو وصف لخلفية الأسرة لا شهادة على مذهبها الشخصي."
  en: "Urdu Wikipedia article on Fehmida Mirza; used for entity facts only. It records her medicine, her Badin elections and her speakership, and describes her family as 'a Sindhi Shia Muslim political family' — a statement about her family's background, not an attestation of her personal school."
  es: "Artículo de Wikipedia en urdu sobre Fehmida Mirza; se utiliza únicamente para datos sobre la persona. En él se recogen su trayectoria médica, sus elecciones en Badin y su presidencia del parlamento, y se describe a su familia como «una familia política musulmana chiíta sindhi», una afirmación sobre los antecedentes familiares, no una declaración sobre su escuela política."
  fr: "Article de Wikipédia en ourdou sur Fehmida Mirza; utilisé uniquement pour des informations factuelles. Il relate sa formation médicale, ses élections à Badin et son mandat de présidente de l’Assemblée, et décrit sa famille comme « une famille politique musulmane chiite sindhie » — une affirmation concernant ses origines familiales, et non une attestation de son appartenance à une école."
  ur: "فہمیدہ مرزا پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی دوا، اس کے بدین کے انتخابات اور اس کی اسپیکر شپ کو ریکارڈ کیا گیا ہے، اور اس کے خاندان کو 'سندھی شیعہ مسلم سیاسی خاندان' کے طور پر بیان کیا گیا ہے - اس کے خاندان کے پس منظر کے بارے میں ایک بیان، نہ کہ اس کے ذاتی اسکول کی تصدیق۔"
