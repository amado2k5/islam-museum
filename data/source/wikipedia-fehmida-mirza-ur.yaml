reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers her medical degree from Liaquat Medical College, Jamshoro (1982), her three successive elections of 1997, 2002 and 2008 from Badin, her election as the first woman Speaker of the National Assembly on 19 March 2008 and her later ministry. Its family section describes her as belonging to 'a Sindhi Shia Muslim political family' (سندھی شیعہ مسلمان سیاسی گھرانے), known as the Qazis of Hyderabad, with her grandfather Qazi Abdul Qayyum the first Muslim president of Hyderabad Municipality and her father Qazi Abdul Majeed Abid a provincial minister. That sentence attests her family's identity, not her own attested school, and under the founder's rule family background never counts — the person record's faith note states this exactly. Read in full on 24 October 2026."
