reliability_note: "Tracker page for the channel @tebinnislam, which styles itself گەڕانەوە بۆ قورئان و سونەت ('Return to the Qur'an and Sunna'): 117,000 subscribers, 28,328,515 total views and 3,067 videos as of 8 November 2026; ranked #604,051 worldwide by subscribers; the channel held at 117,000 subscribers through October and November 2026 and gained about 88,300 views in the 28 days to 8 November 2026, so it is active. vidIQ also records the channel's start date as 19 February 2012; that date is documented here, but no founded date is asserted in the group record in this wave. The page's most-viewed listing shows the channel's content: Sorani lectures by several Kurdish preachers — among them Mamosta Hawre, whose tafsir talk on Ayat al-Kursi and whose eschatology talks appear among its most-viewed uploads — alongside Qur'an recitation uploads by named reciters; carriage of a preacher's lectures is not affiliation, and no speaker is credited with the channel's audience. Subscriber and view counts are dated platform measurements, not museum facts; vidIQ's earnings estimates are not used. The page names no individual author or operator for the channel, and no source read in the wave-199 harvest names one. This read (page updated 8 November 2026, read 9 November 2026) re-pins and supersedes the harvest's earlier vidIQ read as of 31 October 2026, at the same subscriber count. Read on 9 November 2026."
