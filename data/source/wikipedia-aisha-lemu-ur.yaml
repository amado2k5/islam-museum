summary:
  ar: "مقالة ويكيبيديا الأردية عن عائشہ لیمو؛ ترجمة للمقالة الإنجليزية. تثبت ميلادها في بول سنة 1940 باسم بريدجيت هوني واعتناقها الإسلام سنة 1961 وأنها مؤسسة اتحاد جمعيات المرأة المسلمة في نيجيريا وأول أميرة وطنية له."
  en: "Urdu Wikipedia article on Aisha Lemu; a translation of the English article. It gives her birth at Poole in 1940 as Bridget Honey, her conversion to Islam in 1961, and her founding of the Federation of Muslim Women's Associations of Nigeria and service as its first national Amirah."
  es: "Artículo de Wikipedia en urdu sobre Aisha Lemu; traducción del artículo en inglés. En él se menciona su nacimiento en Poole en 1940 con el nombre de Bridget Honey, su conversión al islam en 1961 y la fundación de la Federación de Asociaciones de Mujeres Musulmanas de Nigeria, donde ejerció como su primera Amirah nacional."
  fr: "Article de Wikipédia en ourdou sur Aisha Lemu; traduction de l’article anglais. Il retrace sa naissance à Poole en 1940 sous le nom de Bridget Honey, sa conversion à l’islam en 1961, ainsi que la fondation de la Fédération des associations de femmes musulmanes du Nigeria et son rôle de première Amirah nationale."
  ur: "عائشہ لیمو پر اردو ویکیپیڈیا مضمون؛ انگریزی مضمون کا ترجمہ۔ اس نے پول میں 1940 میں برجٹ ہنی کے طور پر جنم لیا، 1961 میں اس کا اسلام قبول کیا، اور اس کی فیڈریشن آف مسلم ویمن ایسوسی ایشن آف نائجیریا کی بنیاد رکھی اور اس کی پہلی قومی امیرہ کے طور پر خدمات انجام دیں۔"
  tr: "Aisha Limu hakkında Urduca Wikipedia makalesi; İngilizce makalenin çevirisi. 1940'ta Paul'da Bridget Honey olarak doğduğu, 1961'de İslam'a geçtiği ve Nijerya Müslüman Kadınlar Dernekleri Birliği'nin kurucusu ve ilk ulusal prensesi olduğu doğrulanmıştır."
  id: "Artikel Wikipedia Urdu tentang Aisha Limu; terjemahan artikel bahasa Inggris. Dia dikonfirmasi lahir di Paul pada tahun 1940 dengan nama Bridget Honey, memeluk Islam pada tahun 1961, dan merupakan pendiri Union of Muslim Women's Associations in Nigeria serta putri nasional pertamanya."
