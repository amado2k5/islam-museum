summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد علي محمد خان، راجا محمود آباد (4 حزيران 1878 – 23 آذار 1931)؛ تُستخدم لوقائع الكيان فقط. تروي خلافته أباه سنة 1903، وتأسيسه جامعة لكهنؤ مشاركةً، ونيابته الأولى رئاسة جامعة عليكرة الإسلامية (1920–1923)، ورئاساته لمؤتمرات رابطة مسلمي عموم الهند، وتأسيسه مدرسة الواعظين — مركزًا للتعليم الإسلامي الشيعي في لكهنؤ — سنة 1919، وشعره المرثوي بتخلّص «محب»."
  en: "English Wikipedia article on Mohammad Ali Mohammad Khan, Raja of Mahmudabad (4 June 1878 – 23 March 1931); used for entity facts only. It recounts his succession of his father in 1903, his part in founding Lucknow University, his first vice-chancellorship of Aligarh Muslim University (1920–1923), his presidencies of Muslim League conferences, his founding in 1919 of the Madrasatul Waizeen — a centre of Shia Islamic education in Lucknow — and his marsia poetry under the pen name Mohib. It files him under the category Indian Shia Muslims — a filing, not an attestation."
