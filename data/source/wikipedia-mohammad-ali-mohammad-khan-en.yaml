summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد علي محمد خان، راجا محمود آباد ⁦(4 حزيران 1878 – 23 آذار 1931)⁩؛ تُستخدم لوقائع الكيان فقط. تروي خلافته أباه سنة 1903، وتأسيسه جامعة لكهنؤ مشاركةً، ونيابته الأولى رئاسة جامعة عليكرة الإسلامية (1920–1923)، ورئاساته لمؤتمرات رابطة مسلمي عموم الهند، وتأسيسه مدرسة الواعظين — مركزًا للتعليم الإسلامي الشيعي في لكهنؤ — سنة 1919، وشعره المرثوي بتخلّص «محب»."
  en: "English Wikipedia article on Mohammad Ali Mohammad Khan, Raja of Mahmudabad (4 June 1878 – 23 March 1931); used for entity facts only. It recounts his succession of his father in 1903, his part in founding Lucknow University, his first vice-chancellorship of Aligarh Muslim University (1920–1923), his presidencies of Muslim League conferences, his founding in 1919 of the Madrasatul Waizeen — a centre of Shia Islamic education in Lucknow — and his marsia poetry under the pen name Mohib. It files him under the category Indian Shia Muslims — a filing, not an attestation."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Ali Mohammad Khan, Raja de Mahmudabad (4 de junio de 1878 - 23 de marzo de 1931); utilizado únicamente para datos sobre la entidad. Relata su sucesión de su padre en 1903, su participación en la fundación de la Universidad de Lucknow, su primer vicerrectorado de la Universidad Musulmana de Aligarh (1920-1923), sus presidencias de conferencias de la Liga Musulmana, la fundación en 1919 de la Madrasatul Waizeen —un centro de educación islámica chiíta en Lucknow— y su poesía marsia bajo el seudónimo de Mohib. Lo clasifica dentro de la categoría de musulmanes chiítas indios —una clasificación, no una certificación—."
  fr: "Article de Wikipédia en anglais sur Mohammad Ali Mohammad Khan, Raja de Mahmudabad (4 juin 1878 – 23 mars 1931); utilisé uniquement à des fins d’information. Il relate sa succession à son père en 1903, son rôle dans la fondation de l’université de Lucknow, son premier poste de vice-chancelier de l’université musulmane d’Aligarh (1920-1923), ses présidences de conférences de la Ligue musulmane, la fondation en 1919 de la Madrasatul Waizeen – un centre d’enseignement islamique chiite à Lucknow – et sa poésie marsia sous le pseudonyme de Mohib. Il est classé dans la catégorie « Musulmans chiites indiens » – un classement, et non une attestation."
  ur: "محمد علی محمد خان، راجہ محمود آباد ⁦(4 جون 1878 - 23 مارچ 1931)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1903 میں ان کے والد کی جانشینی، لکھنؤ یونیورسٹی کے قیام میں ان کا حصہ، علی گڑھ مسلم یونیورسٹی (1920-1923) کی پہلی وائس چانسلر شپ، مسلم لیگ کی کانفرنسوں کی ان کی صدارت، 1919 میں مدرسۃالواعظین کی بنیاد - لکھنؤ میں شیعہ اسلامی تعلیم کا مرکز - اور ان کی شاعری کا ذکر ہے۔ یہ اسے ہندوستانی شیعہ مسلمانوں کے زمرے کے تحت فائل کرتا ہے - ایک فائلنگ، ایک تصدیق نہیں۔"
