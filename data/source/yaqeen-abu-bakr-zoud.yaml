summary:
  ar: "صفحة معهد يقين عن حلقة من سلسلة «القرآن 30 في 30» يدرّسها أبو بكر زود؛ يقدمه المعهد فيها مدرسا في السلسلة، ويقدمه نص الحلقة بوصفه شيخا من أستراليا."
  en: "The Yaqeen Institute's page for its 'Qur'an 30 for 30' series instalment taught by Abu Bakr Zoud; the institute presents him as a teacher in the series and its transcript introduces him as a shaykh from Australia."
  es: "La página del Instituto Yaqeen para su entrega de la serie 'Corán 30 por 30' impartida por Abu Bakr Zoud; el instituto lo presenta como profesor en la serie y su transcripción lo presenta como un shaykh de Australia."
  fr: "La page de l'Institut Yaqeen consacrée à son épisode de la série « Coran 30 pour 30 » enseigné par Abu Bakr Zoud; l'institut le présente comme un enseignant de la série et sa transcription le présente comme un cheikh d'Australie."
  ur: "یقین انسٹی ٹیوٹ کا صفحہ اس کے 'قرآن 30 کے بدلے 30' سیریز کی قسط جو ابو بکر زود نے پڑھایا۔ انسٹی ٹیوٹ انہیں سیریز میں ایک استاد کے طور پر پیش کرتا ہے اور اس کا ٹرانسکرپٹ ان کا تعارف آسٹریلیا کے شیخ کے طور پر کرتا ہے۔"
  tr: "Yaqin Enstitüsü sayfası, Abu Bakr Zoud tarafından verilen \"Kur'an 30'a 30\" dizisinin bir bölümü hakkında; enstitü onu dizide öğretmen olarak sunarken, bölüm metni onu Avustralyalı bir yaşlı olarak tanıtır."
  id: "Halaman Institut Yaqin tentang sebuah episode serial \"Al-Qur'an 30 kali 30\" yang diajarkan oleh Abu Bakr Zoud; institut menampilkan dia sebagai guru dalam seri tersebut, dan teks episode menggambarkannya sebagai seorang tetua dari Australia."
