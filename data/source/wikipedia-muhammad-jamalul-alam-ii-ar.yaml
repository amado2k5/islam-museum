summary:
  ar: "مقالة ويكيبيديا العربية عن محمد جمال العالم الثاني؛ تُستخدم لوقائع الكيان فقط. وهي مقالة قصيرة: السلطان السادس والعشرون لبروناي، ابن السلطان هاشم جليل العالم ووالد أحمد تاج الدين وعمر علي سيف الدين الثالث، وُلد سنة 1889 وحكم من 1906 إلى وفاته سنة 1924 تحت مجلس وصاية حتى تتويجه سنة 1918، وشجّع التقدم في الزراعة والطب والتعليم؛ وتصنّف تصانيفها وفاته في سنة 1343 هـ وبين وفيات الملاريا. ولا تسمّي مذهبًا."
  en: "Arabic Wikipedia article on Muhammad Jamalul Alam II; used for entity facts only. A short article: the 26th sultan of Brunei, son of Sultan Hashim Jalilul Alam and father of Ahmad Tajuddin and Omar Ali Saifuddien III, born in 1889, who reigned from 1906 until his death in 1924 under a regency council until his coronation in 1918 and encouraged progress in agriculture, medicine and education; its categories file his death under the year 1343 AH and under malaria deaths. It names no school."
