summary:
  ar: "القناة الرسمية لحسين تشيفيك على يوتيوب ⁦(@huseyincevikhc)⁩؛ يقدّم نفسه في وصف قناته بأنه يعطي الدروس شارحًا الموضوعات العلمية والعملية، وتضم قناته آلاف الدروس في الفقه والتفسير والقصص الديني والشؤون الجارية."
  en: "The official YouTube channel of Hüseyin Çevik (@huseyincevikhc); in the channel's own description he presents himself as giving talks explaining scholarly and practical topics, and the channel carries thousands of lessons on fiqh, tafsir, religious stories and current affairs."
  es: "El canal oficial de YouTube de Hüseyin Çevik (@huseyincevikhc); en la descripción del propio canal, él se presenta como alguien que da charlas explicando temas académicos y prácticos, y el canal contiene miles de lecciones sobre fiqh, tafsir, historias religiosas y temas de actualidad."
  fr: "La chaîne YouTube officielle de Hüseyin Çevik (@huseyincevikhc); dans la description de la chaîne, il se présente comme donnant des conférences expliquant des sujets savants et pratiques, et la chaîne propose des milliers de leçons sur le fiqh, le tafsir, les histoires religieuses et l'actualité."
  ur: "Hüseyin Çevik (@huseyincevikhc) کا آفیشل یوٹیوب چینل؛ چینل کی اپنی وضاحت میں وہ اپنے آپ کو علمی اور عملی موضوعات کی وضاحت کرنے والے مذاکرہ کے طور پر پیش کرتا ہے، اور چینل فقہ، تفسیر، مذہبی کہانیوں اور حالات حاضرہ کے ہزاروں اسباق پیش کرتا ہے۔"
  tr: "Hüseyin Çevik'in resmi YouTube kanalı (@huseyincevikhc), kendisini bilimsel ve pratik konuları açıklayan dersler verdiği için tanımlıyor ve kanalında fıkıh, tefsir, dini hikayeler ve güncel konularda binlerce ders yer alıyor."
  id: "Saluran YouTube resmi Hüseyin Çevik (@huseyincevikhc) menggambarkan dirinya sebagai memberikan pelajaran yang menjelaskan topik ilmiah dan praktis, dan salurannya mencakup ribuan pelajaran tentang hukum, tafsir, cerita keagamaan, dan isu terkini."
