  en: "Thomas Bluett, Some Memoirs of the Life of Job (1734)"
summary:
  ar: "توماس بلوت، «مذكّرات من حياة جوب، ابن سليمان، كبير كهنة بوندا في أفريقيا» ⁦(لندن، 1734)⁩: أقدم سِيَر العبيد المطبوعة؛ يروي أسر أيوبا سليمان ديالو سنة 1730 واسترقاقه نحو سنتين في ماريلاند، واكتشاف بلوت له في محكمة مقاطعة كينت سنة 1731 وهو يكتب العربية وينطق بلفظَي الله ومحمد ويرفض الخمر، ورسالته إلى أبيه، وافتداءه وإطلاقه وعودته إلى بلاده سنة 1734."
  en: "Thomas Bluett, 'Some Memoirs of the Life of Job, the Son of Solomon, the High Priest of Boonda in Africa; Who was a Slave about Two Years in Maryland; and afterwards being brought to England, was Set Free, and sent to his Native Land in the Year 1734' (London, 1734): one of the earliest printed slave narratives. It recounts Ayuba Suleiman Diallo's capture in 1730, his two years enslaved in Maryland, Bluett's meeting him at the Kent County courthouse in 1731 — writing Arabic, pronouncing the words Allah and Mahommed, refusing wine — his letter to his father, his ransom, freedom and return home in 1734."
  es: "Thomas Bluett, «Algunas memorias de la vida de Job, hijo de Salomón, sumo sacerdote de Boonda en África; quien fue esclavo durante unos dos años en Maryland; y posteriormente, al ser llevado a Inglaterra, fue liberado y enviado a su tierra natal en el año 1734» (Londres, 1734): una de las primeras narrativas impresas sobre la esclavitud. Relata la captura de Ayuba Suleiman Diallo en 1730, sus dos años de esclavitud en Maryland, el encuentro de Bluett con él en el juzgado del condado de Kent en 1731 —donde escribía en árabe, pronunciaba las palabras Alá y Mahoma, y rechazaba el vino—, su carta a su padre, su rescate, su libertad y su regreso a casa en 1734."
  fr: "Thomas Bluett, « Mémoires de la vie de Job, fils de Salomon, grand prêtre de Boonda en Afrique; esclave pendant environ deux ans dans le Maryland; amené ensuite en Angleterre, il fut affranchi et renvoyé dans son pays natal en 1734 » (Londres, 1734): l’un des premiers récits d’esclaves imprimés. Il relate la capture d’Ayuba Suleiman Diallo en 1730, ses deux années d’esclavage dans le Maryland, la rencontre de Bluett avec lui au tribunal du comté de Kent en 1731 – où il écrivit en arabe, prononça les mots « Allah » et « Mahomet », et refusa le vin –, sa lettre à son père, sa rançon, sa liberté et son retour chez lui en 1734."
  ur: "تھامس بلوٹ، 'ایوب کی زندگی کی کچھ یادداشتیں، سلیمان کا بیٹا، افریقہ میں بوندا کے اعلیٰ پجاری؛ جو میری لینڈ میں تقریباً دو سال غلام تھا۔ اور اس کے بعد انگلستان لایا گیا، اسے آزاد کر دیا گیا، اور سال 1734 میں اس کی آبائی سرزمین بھیج دیا گیا'' ⁦(لندن، 1734)⁩: غلاموں کی ابتدائی مطبوعہ داستانوں میں سے ایک۔ اس میں ایوبا سلیمان ڈیالو کی 1730 میں گرفتاری، میری لینڈ میں اس کے دو سال غلامی، 1731 میں کینٹ کاؤنٹی کورٹ ہاؤس میں بلوٹ کی اس سے ملاقات کا ذکر ہے - عربی لکھنا، اللہ اور محمد کے الفاظ کا تلفظ کرنا، شراب سے انکار کرنا - اپنے والد کو اس کا خط، اس کا تاوان، آزادی اور گھر واپسی 1734 میں۔"
