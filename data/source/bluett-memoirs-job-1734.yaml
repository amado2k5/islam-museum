reliability_note: "Primary narrative, compiled by Bluett from Diallo's own telling through interpreters; it is not a first-person text, and Bluett wrote as an Anglican SPG clergyman with a conversionist hope he records Diallo disappointing. The Documenting the American South summary and the excerpts volume were read on 3 November 2026. Francis Moore's Travels into the Inland Parts of Africa (1738), which continues the story at first hand after the return, is cited within the English encyclopedia article but was not separately opened for this build."
