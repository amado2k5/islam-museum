summary:
  ar: "توماس بلوت، «مذكّرات من حياة جوب، ابن سليمان، كبير كهنة بوندا في أفريقيا» ⁦(لندن، 1734)⁩: أقدم سِيَر العبيد المطبوعة؛ يروي أسر أيوبا سليمان ديالو سنة 1730 واسترقاقه نحو سنتين في ماريلاند، واكتشاف بلوت له في محكمة مقاطعة كينت سنة 1731 وهو يكتب العربية وينطق بلفظَي الله ومحمد ويرفض الخمر، ورسالته إلى أبيه، وافتداءه وإطلاقه وعودته إلى بلاده سنة 1734."
  en: "Thomas Bluett, 'Some Memoirs of the Life of Job, the Son of Solomon, the High Priest of Boonda in Africa; Who was a Slave about Two Years in Maryland; and afterwards being brought to England, was Set Free, and sent to his Native Land in the Year 1734' (London, 1734): one of the earliest printed slave narratives. It recounts Ayuba Suleiman Diallo's capture in 1730, his two years enslaved in Maryland, Bluett's meeting him at the Kent County courthouse in 1731 — writing Arabic, pronouncing the words Allah and Mahommed, refusing wine — his letter to his father, his ransom, freedom and return home in 1734."
