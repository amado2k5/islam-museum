reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. Its notes document the birth date (29 June 1836 from the 1897 Al-Hilal obituary, quoted by Zaydan; 1835 in al-Himsi) and the death year (about 1873 in the obituary; 1874 supported by his sister Maryana's elegy, al-Himsi and Abu-Uksa, with his writings still appearing in Al-Jinan in 1874). On religion it says he was born 'to an old Melkite family of merchants' (citing Wielandt 1992 and Zeidan 1995) — family framing — and its categories file him under 'Syrian Melkite Greek Catholics'; its cited scholarship (Hawi; Jayyusi) describes his own thought in Christian terms — his belief in the benevolence of the Catholic Church's authority and his reading of the Christian belief in universal love — without naming an affiliation for him."
