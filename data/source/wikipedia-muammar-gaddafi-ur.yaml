summary:
  ar: "مقالة ويكيبيديا الأردية عن معمر القذافي؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 7 يونيو 1942 وقتله في سرت في 20 أكتوبر 2011 وحكمه ليبيا من 1969 إلى 2011. تصنيفاتها متضاربة: تدرجه في آنٍ ضمن الليبيين السنة وضمن القرآنيين وضمن مَن تاريخ ميلادهم مجهول، وهي تصنيفات لا نصوص."
  en: "Urdu Wikipedia article on Muammar Gaddafi; a short stub used for entity facts only. It gives his birth on 7 June 1942, his rule of Libya from 1969 to 2011, and his killing at Sirte on 20 October 2011. Its categories conflict with one another, filing him at once under Libyan Sunni Muslims, under Quranists, and under unknown birth dates; filings are not text statements."
  es: "Artículo de Wikipedia en urdu sobre Muamar Gadafi; un breve esbozo que solo contiene datos sobre la persona. Indica su nacimiento el 7 de junio de 1942, su gobierno de Libia desde 1969 hasta 2011 y su muerte en Sirte el 20 de octubre de 2011. Sus categorías son contradictorias, ya que lo clasifican simultáneamente como musulmán sunita libio, como coranista y como de fecha de nacimiento desconocida; estas clasificaciones no son declaraciones textuales."
  fr: "Article Wikipédia en ourdou sur Mouammar Kadhafi; une brève ébauche servant uniquement à décrire l’entité. On y trouve sa naissance le 7 juin 1942, son règne sur la Libye de 1969 à 2011 et sa mort à Syrte le 20 octobre 2011. Ses catégories sont contradictoires: il est classé à la fois parmi les musulmans sunnites libyens, parmi les coranistes et parmi les personnes dont la date de naissance est inconnue; ces classifications ne constituent pas des énoncés textuels."
  ur: "معمر قذافی پر اردو ویکیپیڈیا مضمون؛ ایک مختصر سٹب صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ یہ 7 جون 1942 کو اس کی پیدائش، 1969 سے 2011 تک لیبیا پر اس کی حکمرانی، اور 20 اکتوبر 2011 کو سرتے میں اس کا قتل۔ اس کے زمرے ایک دوسرے سے متصادم ہیں، اسے ایک ہی وقت میں لیبیا کے سنی مسلمانوں، قرآن پرستوں کے تحت، اور نامعلوم تاریخ پیدائش کے تحت درج کیا گیا ہے۔ فائلنگ ٹیکسٹ اسٹیٹمنٹ نہیں ہیں۔"
  tr: "Muammer Kaddafi hakkında Urduca Vikipedi makalesi; sadece varlığın gerçekleri için kullanılan kısa bir makale. 7 Haziran 1942'deki doğumundan, 20 Ekim 2011'de Sirte'de suikastından ve 1969'dan 2011'e kadar Libya'daki yönetiminden bahsediyor. Sınıflandırmaları çelişkili: aynı anda Libyalı Sünniler, Kur'anlar ve doğum tarihleri bilinmeyenler arasında sınıflandırılıyor; bunlar metin değil, sınıflandırmadır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Muammar Gaddafi; sebuah artikel pendek yang hanya digunakan untuk fakta entitas tersebut. Artikel ini menyebutkan kelahirannya pada 7 Juni 1942, pembunuhannya di Sirte pada 20 Oktober 2011, dan pemerintahannya di Libya dari 1969 hingga 2011. Klasifikasinya saling bertentangan: dia diklasifikasikan secara bersamaan di antara Sunni Libya, di antara para Al-Quranis, dan di antara mereka yang tanggal lahirnya tidak diketahui; ini adalah klasifikasi, bukan teks."
