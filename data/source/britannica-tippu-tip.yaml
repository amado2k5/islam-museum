  ar: "مدخل موسوعة بريتانيكا عن تيبو تيب: أشهر تاجر عربي في وسط أفريقيا وشرقها في أواخر القرن التاسع عشر، وُلد سنة 1837 وتوفي في 14 يونيو 1905 بزنجبار؛ أسّس دولة في حوض الكونغو الشرقي وقبِل ولاية مقاطعة الشلالات في دولة الكونغو الحرة في فبراير 1887."
  en: "Encyclopaedia Britannica entry on Tippu Tip: the most famous late nineteenth-century Arab trader in central and eastern Africa, born 1837, died 14 June 1905 at Zanzibar; he built a state in the eastern Congo basin and accepted the governorship of the Falls district of the Congo Free State in February 1887."
