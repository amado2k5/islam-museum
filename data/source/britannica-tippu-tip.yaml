summary:
  ar: "مدخل موسوعة بريتانيكا عن تيبو تيب: أشهر تاجر عربي في وسط أفريقيا وشرقها في أواخر القرن التاسع عشر، وُلد سنة 1837 وتوفي في 14 يونيو 1905 بزنجبار؛ أسّس دولة في حوض الكونغو الشرقي وقبِل ولاية مقاطعة الشلالات في دولة الكونغو الحرة في فبراير 1887."
  en: "Encyclopaedia Britannica entry on Tippu Tip: the most famous late nineteenth-century Arab trader in central and eastern Africa, born 1837, died 14 June 1905 at Zanzibar; he built a state in the eastern Congo basin and accepted the governorship of the Falls district of the Congo Free State in February 1887."
  es: "Entrada de la Enciclopedia Británica sobre Tippu Tip: el comerciante árabe más famoso de finales del siglo XIX en África central y oriental, nacido en 1837 y fallecido el 14 de junio de 1905 en Zanzíbar; fundó un estado en la cuenca oriental del Congo y aceptó el cargo de gobernador del distrito de Falls del Estado Libre del Congo en febrero de 1887."
  fr: "Article de l'Encyclopædia Britannica sur Tippu Tip: le plus célèbre commerçant arabe de la fin du XIXe siècle en Afrique centrale et orientale, né en 1837, mort le 14 juin 1905 à Zanzibar; il a construit un État dans le bassin oriental du Congo et a accepté le poste de gouverneur du district de Falls de l'État indépendant du Congo en février 1887."
  ur: "ٹیپو ٹِپ پر انسائیکلوپیڈیا برٹانیکا کا اندراج: وسطی اور مشرقی افریقہ میں انیسویں صدی کے آخر میں سب سے مشہور عرب تاجر، 1837 میں پیدا ہوئے، 14 جون 1905 کو زنجبار میں انتقال کر گئے۔ اس نے مشرقی کانگو بیسن میں ایک ریاست بنائی اور فروری 1887 میں کانگو فری اسٹیٹ کے فالس ڈسٹرکٹ کی گورنری قبول کی۔"
