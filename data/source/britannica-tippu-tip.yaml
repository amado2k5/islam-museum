reliability_note: "Independent encyclopedia account, read in full on 24 October 2026. It dates his birth to 1837 and his death to 14 June 1905 at Zanzibar — the dates the person record follows — and records his first trading trip to the interior in the late 1850s or early 1860s, his expeditions of 4,000 men by the late 1860s, his loosely organised state in the eastern and central Congo basin, his settlement at Kasongo in 1875, his journey with Henry Morton Stanley partway down the Congo in 1876–77, his alignment with Sultan Barghash in the early 1880s, his February 1887 agreement to govern the Falls district, the impossibility of that position (expected to control the Arab traders but denied the necessary weapons), and his final departure from the Falls in April 1890. It judges that the ivory trade remained his chief interest and his state-building a means to it. It names no religion or school for him."
