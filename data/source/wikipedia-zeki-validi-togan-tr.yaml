summary:
  ar: "مقالة ويكيبيديا التركية عن زكي وليدي توغان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 10 ديسمبر 1890 في كوزن ⁦(كوزيانوفو)⁩، ووفاته في 26 يوليو 1970 بإسطنبول ودفنه في مقبرة قراجه أحمد بها، وحياته الأكاديمية في تركيا؛ ولا يحمل صندوق معلوماتها ولا متنها دينا ولا مذهبا له."
  en: "Turkish Wikipedia article on Zeki Velidi Togan; used for entity facts only. It gives his birth on 10 December 1890 at Küzen (Kuzyanovo), his death on 26 July 1970 at Istanbul and his resting place in the Karacaahmet cemetery there, and his academic life in Turkey; neither its infobox nor its text names a religion or school for him."
  es: "Artículo de la Wikipedia en turco sobre Zeki Velidi Togan; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 10 de diciembre de 1890 en Küzen (Kuzyanovo), su fallecimiento el 26 de julio de 1970 en Estambul y su lugar de descanso en el cementerio de Karacaahmet, así como su vida académica en Turquía; ni su ficha informativa ni su texto mencionan su religión o escuela."
  fr: "Article de Wikipédia en turc sur Zeki Velidi Togan; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 10 décembre 1890 à Küzen (Kuzyanovo), son décès le 26 juillet 1970 à Istanbul et son lieu de sépulture au cimetière de Karacaahmet, ainsi que sa carrière universitaire en Turquie; ni son infobox ni son texte ne mentionnent sa religion ou son école."
  ur: "Zeki Velidi Togan پر ترک ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 10 دسمبر 1890 کو کوزن ⁦(کوزیانووو)⁩ میں ان کی پیدائش، 26 جولائی 1970 کو استنبول میں ان کی موت اور وہاں کاراکاہمت قبرستان میں ان کی آرام گاہ، اور ترکی میں ان کی تعلیمی زندگی؛ نہ اس کا انفو باکس اور نہ ہی اس کا متن اس کے لیے کسی مذہب یا اسکول کا نام رکھتا ہے۔"
  tr: "Zeki ve Lidi Togan hakkında Türkçe Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 10 Aralık 1890'da Kozinovo'da (Kozianovo), 26 Temmuz 1970'te İstanbul'da vefat ettiğini ve Türkiye'deki Karaca Ahmed Mezarlığı'na defnedilmesini ve Türkiye'deki akademik yaşamını anlatır; bilgi kutusunda herhangi bir din veya mezhep yer almıyor."
  id: "Artikel Wikipedia Turki tentang Zeki dan Lidi Togan; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 10 Desember 1890 di Kozinovo (Kozianovo), kematiannya pada 26 Juli 1970 di Istanbul, dan pemakamannya di Pemakaman Karaca Ahmed di Turki, serta kehidupan akademisnya di Turki; kotak info-nya tidak memuat agama atau sekte apapun."
