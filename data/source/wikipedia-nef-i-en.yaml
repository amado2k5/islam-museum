reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth about 1572 at Hasankale, Erzurum, his real name Ömer, his bureaucracy post as comptroller of mines, Murad IV's stipend, and his execution by strangulation in 1635 at Bayram Pasha's request. In its Works section it quotes the Tahir Efendi quatrain in which Nef'i calls his own madhhab Maliki, one of the two independent prose texts behind the person record's faith settlement. It gives the death year only, where the Turkish and Persian articles give 27 January 1635 and the Arabic article gives 1636; all readings are preserved in the person record. Checked 1 November 2026."
