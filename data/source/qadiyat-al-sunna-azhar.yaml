summary:
  ar: "رسالة لفضيلة الشيخ محمد متولي الشعراوي ضمن السلسلة العلمية لمجمع البحوث الإسلامية، بإشراف الأمين العام للمجمع. تتناول الرد على من قال إن السنة غير ملزمة، مستدلة بآيات الطاعة وبيان الرسول للتشريع، وبما في السنة من أحكام الصلاة والزكاة والحج، وبوقعة أحد؛ 56 صفحة، وتتضمن تصديراً لشيخ الأزهر ومقدمة من الأمين العام."
  en: "A booklet by Shaykh Muhammad Mutawalli al-Sha'rawi in the Scientific Series of the Islamic Research Academy, supervised by its Secretary-General. It answers those who say the Sunna is not binding, citing the verses on obedience, the Prophet's legislative role, the Sunna's detail on prayer, zakat and pilgrimage, and the lesson of Uhud; 56 pages, with a foreword by the Grand Imam and an introduction by the Secretary-General."
