label:
  ar: قضية السنة — محمد متولي الشعراوي
  en: The Question of the Sunna — Muhammad Mutawalli al-Sha'rawi
summary:
  ar: "رسالة لفضيلة الشيخ محمد متولي الشعراوي ضمن السلسلة العلمية لمجمع البحوث الإسلامية، بإشراف الأمين العام للمجمع. تتناول الرد على من قال إن السنة غير ملزمة، مستدلة بآيات الطاعة وبيان الرسول للتشريع، وبما في السنة من أحكام الصلاة والزكاة والحج، وبوقعة أحد؛ 56 صفحة، وتتضمن تصديراً لشيخ الأزهر ومقدمة من الأمين العام."
  en: "A booklet by Shaykh Muhammad Mutawalli al-Sha'rawi in the Scientific Series of the Islamic Research Academy, supervised by its Secretary-General. It answers those who say the Sunna is not binding, citing the verses on obedience, the Prophet's legislative role, the Sunna's detail on prayer, zakat and pilgrimage, and the lesson of Uhud; 56 pages, with a foreword by the Grand Imam and an introduction by the Secretary-General."
  es: "Un folleto del jeque Muhammad Mutawalli al-Sha'rawi, perteneciente a la Serie Científica de la Academia de Investigación Islámica, supervisada por su Secretario General. Responde a quienes afirman que la Sunna no es vinculante, citando versículos sobre la obediencia, el papel legislativo del Profeta, los detalles de la Sunna sobre la oración, el zakat y la peregrinación, y la lección del Uhud. Consta de 56 páginas, con un prólogo del Gran Imán y una introducción del Secretario General."
  fr: "Un livret du cheikh Muhammad Mutawalli al-Sha'rawi, publié dans la collection scientifique de l'Académie de recherche islamique et supervisé par son secrétaire général. Il répond à ceux qui affirment que la Sunna n'est pas contraignante, en citant les versets relatifs à l'obéissance, le rôle législatif du Prophète, les préceptes de la Sunna concernant la prière, la zakat et le pèlerinage, ainsi que l'enseignement du sacrifice d'Uhud; 56 pages, préface du Grand Imam et introduction du secrétaire général."
  ur: "اسلامک ریسرچ اکیڈمی کی سائنسی سیریز میں شیخ محمد متولی الشعراوی کا ایک کتابچہ جس کی نگرانی اس کے سیکرٹری جنرل نے کی۔ یہ ان لوگوں کا جواب دیتا ہے جو سنت کی پابندی نہیں کرتے، اطاعت سے متعلق آیات کا حوالہ دیتے ہوئے، پیغمبر کا قانون سازی کا کردار، نماز، زکوٰۃ اور حج کے بارے میں سنت کی تفصیل، اور احد کا سبق؛ 56 صفحات پر مشتمل ہے جس میں امام اعظم کا پیش لفظ اور سیکرٹری جنرل کا تعارف ہے۔"
  tr: "Akademi Genel Sekreteri tarafından denetlenen İslami Araştırma Akademisi'nin bilimsel dizisi içinde Eminansa Şeyh Muhammed Metvally El-Şaarawi'den bir mektup. Sünnitin bağlayıcı olmadığını söyleyenlerin çürütülmesine değiniyor; itaat ayetleri, Peygamber'in yasama açıklaması, Sünnet'teki namaz, zekat ve hac ile ilgili hükümler ve Uhud olayı ile destekleniyor; 56 sayfa, El-Ezher Büyük İmamının önsözü ve Genel Sekreter'in önsözü dahil."
  id: "Surat dari Yang Mulia Sheikh Muhammad Metwally Al-Shaarawi dalam rangkaian ilmiah Akademi Riset Islam, yang diawasi oleh Sekretaris Jenderal Akademi. Surat ini menanggapi penolakan mereka yang mengatakan bahwa Sunnah tidak mengikat, didukung oleh ayat-ayat ketaatan, penjelasan Nabi tentang legislasi, putusan Sunnah mengenai doa, zakat, dan ziarah, serta peristiwa Uhud; 56 halaman, termasuk kata pengantar oleh Imam Agung Al-Azhar dan kata pengantar oleh Sekretaris Jenderal."
