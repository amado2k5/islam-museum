summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سليمان الندوي ⁦(22 تشرين الثاني 1884 – 22 تشرين الثاني 1953)⁩، مؤرخ ديسنه الذي تخرج من دار العلوم ندوة العلماء سنة 1906 وأكمل «سيرة النبي» لشبلي النعماني وأسس دار المصنفين في أعظم كره وتوفي في كراتشي؛ ويذكر متنها أنه صار في آخر حياته مريدًا لأشرف علي التهانوي، ويسمّي صندوقها التهانوي شيخًا له."
  en: "The English Wikipedia article on Sulaiman Nadvi (22 November 1884 – 22 November 1953), the historian of Desna who graduated from Darul Uloom Nadwatul Ulama in 1906, completed Shibli Nomani's Sirat-un-Nabi, founded Darul Musannifeen at Azamgarh and died at Karachi; its text states that later in life he became a disciple of Ashraf Ali Thanwi, and its infobox names Thanwi among his teachers."
  es: "El artículo de la Wikipedia en inglés sobre Sulaiman Nadvi (22 de noviembre de 1884 - 22 de noviembre de 1953), el historiador de Desna que se graduó en Darul Uloom Nadwatul Ulama en 1906, completó el Sirat-un-Nabi de Shibli Nomani, fundó Darul Musannifeen en Azamgarh y murió en Karachi; su texto afirma que más tarde en su vida se convirtió en discípulo de Ashraf Ali Thanwi, y su ficha informativa nombra a Thanwi entre sus maestros."
  fr: "L'article de Wikipédia en anglais sur Sulaiman Nadvi (22 novembre 1884 – 22 novembre 1953), l'historien de Desna qui a obtenu son diplôme de Darul Uloom Nadwatul Ulama en 1906, a achevé le Sirat-un-Nabi de Shibli Nomani, a fondé Darul Musannifeen à Azamgarh et est mort à Karachi; son texte indique que plus tard dans sa vie, il est devenu un disciple d'Ashraf Ali Thanwi, et son infobox nomme Thanwi parmi ses enseignants."
  ur: "سلیمان ندوی ⁦(22 نومبر 1884 - 22 نومبر 1953)⁩ پر انگریزی ویکیپیڈیا کا مضمون، دیسنا کے مورخ جنہوں نے 1906 میں دارالعلوم ندوۃ العلماء سے گریجویشن کیا، شبلی نعمانی کی سیرت النبی مکمل کی، دارالمصنفین کی بنیاد رکھی اور کراچی میں وفات پائی۔ اس کے متن میں کہا گیا ہے کہ بعد کی زندگی میں وہ اشرف علی تھانوی کے شاگرد بن گئے، اور اس کے معلوماتی خانے نے اپنے اساتذہ میں تھانوی کا نام لیا۔"
  tr: "Suleiman Al-Nadwi (22 Kasım 1884 – 22 Kasım 1953) hakkında İngilizce Wikipedia makalesi; 1906'da Dar Al-Uloom Nadwa Al-Ulama'dan mezun olmuş, Shibli Al-Numani'nin \"Peygamberin Biyografisi\"ni tamamlamış, Dar Al-Musannifin fi Azam Al-Ghara'yı kurmuş ve Karaçi'de ölmüştür. Metinde, hayatının sonlarına doğru Ashraf Ali Al-Tihanawi'nin öğrencisi olduğu ve onun fonu Al-Tahanawi'yi şeyhi olarak atadığı belirtilir."
  id: "Artikel Wikipedia bahasa Inggris tentang Suleiman Al-Nadwi (22 November 1884 – 22 November 1953), seorang sejarawan yang lulus dari Dar Al-Uloom Nadwa Al-Ulama pada tahun 1906, menyelesaikan \"Biografi Nabi\" oleh Shibli Al-Numani, mendirikan Dar Al-Musannifin fi Azam Al-Ghara, dan meninggal di Karachi. Teks tersebut menyebutkan bahwa menjelang akhir hidupnya, ia menjadi murid Ashraf Ali Al-Tihanawi dan mengangkat dana tersebut sebagai al-Tahanawi sebagai sheikh-nya."
