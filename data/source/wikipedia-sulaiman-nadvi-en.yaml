summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سليمان الندوي (22 تشرين الثاني 1884 – 22 تشرين الثاني 1953)، مؤرخ ديسنه الذي تخرج من دار العلوم ندوة العلماء سنة 1906 وأكمل «سيرة النبي» لشبلي النعماني وأسس دار المصنفين في أعظم كره وتوفي في كراتشي؛ ويذكر متنها أنه صار في آخر حياته مريدًا لأشرف علي التهانوي، ويسمّي صندوقها التهانوي شيخًا له."
  en: "The English Wikipedia article on Sulaiman Nadvi (22 November 1884 – 22 November 1953), the historian of Desna who graduated from Darul Uloom Nadwatul Ulama in 1906, completed Shibli Nomani's Sirat-un-Nabi, founded Darul Musannifeen at Azamgarh and died at Karachi; its text states that later in life he became a disciple of Ashraf Ali Thanwi, and its infobox names Thanwi among his teachers."
