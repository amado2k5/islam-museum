summary:
  ar: "مدخل «سعيد حليم باشا» في موسوعة الإسلام التركية (TDV) بقلم م. حنفي بستان؛ يؤرخ ميلاده في 19 فبراير 1864 بالقاهرة وقتله في 5 ديسمبر 1921 بروما، ويفصّل مناصبه ومؤلفاته الثمانية في الفكر الإسلامي."
  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'Said Halim Pasha' by M. Hanefi Bostan; it dates his birth to 19 February 1864 at Cairo and his killing to 5 December 1921 at Rome, and details his offices and his eight treatises of Islamist thought."
  es: "La entrada \"Said Halim Pasha\" de M. Hanefi Bostan en la TDV İslâm Ansiklopedisi (enciclopedia turca del Islam) sitúa su nacimiento el 19 de febrero de 1864 en El Cairo y su asesinato el 5 de diciembre de 1921 en Roma, y detalla sus cargos y sus ocho tratados de pensamiento islamista."
  fr: "L'article « Said Halim Pasha » de M. Hanefi Bostan dans la TDV İslâm Ansiklopedisi (encyclopédie turque de l'islam) date sa naissance du 19 février 1864 au Caire et son assassinat du 5 décembre 1921 à Rome, et détaille ses fonctions et ses huit traités de pensée islamiste."
  ur: "TDV İslâm Ansiklopedisi ⁦(ترک انسائیکلوپیڈیا آف اسلام)⁩ اندراج 'سید حلیم پاشا' از ایم حنیفی بوستان؛ اس میں ان کی پیدائش 19 فروری 1864 کو قاہرہ میں اور ان کا قتل 5 دسمبر 1921 کو روم میں ہے، اور ان کے دفاتر اور اسلامی فکر کے ان کے آٹھ مقالوں کی تفصیل ہے۔"
  tr: "\"Said Halim Paşa\"nın M. Hanafi Bostan'ın Türk İslam Ansiklopedisi'nde (TDV) yer alan kaydı; 19 Şubat 1864'te Kahire'de doğduğu ve 5 Aralık 1921'de Roma'da öldürüldüğü tarihlendirir; İslami düşüncedeki sekiz pozisyonu ve eserlerini detaylandırır."
  id: "Entri \"Said Halim Pasha\" dalam Ensiklopedia Islam Turki (TDV) oleh M. Hanafi Bostan; catatan ini menandai kelahirannya pada 19 Februari 1864 di Kairo dan pembunuhannya pada 5 Desember 1921 di Roma, yang merinci delapan posisi dan karyanya dalam pemikiran Islam."
