  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'Said Halim Pasha' by M. Hanefi Bostan; it dates his birth to 19 February 1864 at Cairo and his killing to 5 December 1921 at Rome, and details his offices and his eight treatises of Islamist thought."
