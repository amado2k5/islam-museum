reliability_note: "Scholarly encyclopedia entry, read in full on 24 October 2026 — an independent source beyond Wikipedia. It confirms his birth at Cairo on 19 February 1864, his father Mehmed Abdülhalim Pasha, the move to Istanbul in 1870, Council of State membership (21 May 1888) and the Rumeli beylerbeyi rank (22 September 1900), his 1903 exile and Young Turk support, the Senate (14 December 1908), the Lausanne mission of July 1912, the foreign ministry and grand vizierate of June 1913, the alliance treaty signed at his own yalı on 2 August 1914 and the empire's entry into the war by an attack on Russia made without his approval, his resignation of the foreign ministry (15 October 1915) and of the grand vizierate (3 February 1917), his arrest (10 March 1919), Malta exile and release for lack of evidence (29 April 1921), his killing before his Rome residence on 5 December 1921, and his burial beside his father in the garden of the Mahmud II tomb (29 January 1922). It calls him one of the most important idea-leaders of the Islamism current and lists his eight treatises, mostly signed 'Mehmed', collected as Buhranlarımız (1919). It names no madhhab for him."
