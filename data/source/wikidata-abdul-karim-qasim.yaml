summary:
  ar: "عنصر ويكي بيانات Q299732 لعبد الكريم قاسم، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته في 21 نوفمبر 1914 ووفاته في 9 فبراير 1963 وبغداد مكانًا للولادة والوفاة، وقيمة دين هي الإسلام عمومًا فحسب."
  en: "Wikidata item Q299732 for Abdul-Karim Qasim, grounded through the English article's pageprops; used for entity facts only. It gives his birth on 21 November 1914, his death on 9 February 1963, Baghdad as birth and death place, and a religion value of Islam in general only."
  es: "El elemento de Wikidata Q299732 para Abdul-Karim Qasim, basado en los pageprops del artículo en inglés, se utiliza únicamente para datos sobre la entidad. Indica que nació el 21 de noviembre de 1914, falleció el 9 de febrero de 1963, nació y murió en Bagdad, y profesaba el islam en general."
  fr: "L'élément Wikidata Q299732 concernant Abdul-Karim Qasim, basé sur les propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance le 21 novembre 1914, son décès le 9 février 1963, Bagdad comme lieu de naissance et de décès, et son appartenance religieuse comme étant l'islam en général."
  ur: "عبدالکریم قاسم کے لیے ویکیڈیٹا آئٹم Q299732، انگریزی مضمون کے صفحہ کے پراپس کے ذریعے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 21 نومبر 1914 کو ان کی پیدائش، 9 فروری 1963 کو ان کی موت، بغداد کو پیدائش اور موت کی جگہ، اور عام طور پر صرف اسلام کی ایک مذہبی قدر بتاتی ہے۔"
  tr: "Abdul Karim Qasim tarafından Q299732 bir Wikidata öğesi, İngilizce makale sayfası properties aracılığıyla düzeltilmiştir; yalnızca varlığın gerçekleri için kullanılır. Doğumunu 21 Kasım 1914'te, ölümünü 9 Şubat 1963'te ve doğum ve ölüm yeri olarak Bağdat'ı vermektedir; bir dinin değeri genellikle sadece İslam'dır."
  id: "Elemen Wikidata Q299732 oleh Abdul Karim Qasim, diperbaiki melalui properti halaman artikel berbahasa Inggris; digunakan hanya untuk fakta entitas. Ia melahirkan pada 21 November 1914, dan kematiannya pada 9 Februari 1963, dan Baghdad sebagai tempat kelahiran dan kematian, dengan nilai agama umumnya hanya Islam."
