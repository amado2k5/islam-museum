summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مقصود العالم؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 14 ديسمبر 1954 في ماداريبور، وتعليمه في جامعة موسكو الحكومية ومعهد ماكس بلانك للكيمياء الحيوية (دكتوراهان)، وعمله أستاذًا في جامعة هاواي في مانوا، وقيادته مشاريع تسلسل جينوم البابايا والمطاط والجوت وفطر يهاجم الجوت، ووفاته في هونولولو في 20 ديسمبر 2014. لا تذكر المقالة أي دين له."
  en: "English Wikipedia article on Maqsudul Alam; used for entity facts only. It gives his birth on 14 December 1954 at Madaripur, his education at Moscow State University and the Max Planck Institute of Biochemistry (two doctorates), his professorship at the University of Hawaiʻi at Mānoa, his leadership of genome-sequencing projects for papaya, rubber, jute and a jute-attacking fungus, and his death at Honolulu on 20 December 2014. The article names no religion for him."
