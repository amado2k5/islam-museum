summary:
  ar: "مقالة ويكيبيديا العربية المفصّلة عن الشيخ جابر بن مبارك الصباح (1860 – 5 فبراير 1917 الموافق 13 ربيع الثاني 1335هـ)، حاكم الكويت الثامن؛ تروي مشاركته أباه في قتل عميه محمد وجراح سنة 1896 ونيابته عنه في معركة الصريف وقيادته جيش الكويت في جو لبن سنة 1904 وهدية سنة 1910، ثم حكمه القصير: إلغاء ضريبة الثلث وإعادة البيوت المصادرة وتوزيع الأموال، وميله خلافًا لأبيه إلى العثمانيين في الحرب العالمية الأولى وتسهيله القوافل، واجتماعه ببيرسي كوكس في 23 نوفمبر 1916، ووفاته بحمّى وخلفه أخوه سالم."
  en: "Detailed Arabic Wikipedia article on Sheikh Jaber bin Mubarak Al-Sabah (1860 – 5 February 1917, given as 13 Rabi' al-Thani 1335 AH), eighth ruler of Kuwait; it recounts his part with his father in the 1896 killing of his uncles Muhammad and Jarrah, his deputising for his father at the Sarif campaign, his command of Kuwait's army at Ju Lubn in 1904 and Hadiya in 1910, then his short reign — abolition of the one-third property tax, return of confiscated houses, distribution of money — his leaning, unlike his father, toward the Ottomans in the First World War by facilitating the caravans, his meeting with Percy Cox on 23 November 1916, his death of a fever and succession by his brother Salim."
