reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full at revision 76470948 on 25 October 2026. The article is internally inconsistent on his death: its lead and death section give 5 February 1917 (13 Rabi' al-Thani 1335 AH; tabular conversion gives 12 Rabi' al-Thani), while its First World War section says he 'died in January 1917' — the record follows 5 February, agreeing with the English article and Wikidata, and states the January reading. It also preserves the Kuwaiti historian Abd al-Aziz al-Rashid's character sketch of him, quoted in the prose with its attribution. It states no religion for him."
