label: { en: "Dawat-e-Islami — 'Successor of Ameer-e-Ahl-e-Sunnat visited Europe' (2018)" }
summary:
  ar: "تقرير مجلة دعوة إسلامي ⁦(14 يونيو 2018)⁩ عن جولة خليفة أمير أهل السنة مولانا عبيد رضا عطاري أوروبا من 19 أبريل إلى 11 مايو 2018 وخطبه في ألمانيا والنرويج واليونان وإيطاليا وإسبانيا وفرنسا وهولندا."
  en: "A Dawat-e-Islami magazine report (14 June 2018) on the successor of Ameer-e-Ahl-e-Sunnat, Maulana Ubaid Raza Attari Madani, touring Europe from 19 April to 11 May 2018 and preaching in Germany, Norway, Greece, Italy, Spain, France and Holland."
  es: "Un reportaje de la revista Dawat-e-Islami (14 de junio de 2018) sobre el sucesor de Ameer-e-Ahl-e-Sunnat, Maulana Ubaid Raza Attari Madani, quien realizó una gira por Europa del 19 de abril al 11 de mayo de 2018 y predicó en Alemania, Noruega, Grecia, Italia, España, Francia y Holanda."
  fr: "Un article du magazine Dawat-e-Islami (14 juin 2018) sur le successeur de l'Ameer-e-Ahl-e-Sunnat, Maulana Ubaid Raza Attari Madani, en tournée en Europe du 19 avril au 11 mai 2018 et prêchant en Allemagne, en Norvège, en Grèce, en Italie, en Espagne, en France et aux Pays-Bas."
  ur: "امیر اہلسنت مولانا عبید رضا عطاری مدنی کے جانشین کے بارے میں دعوت اسلامی میگزین کی رپورٹ ⁦(14 جون 2018)⁩ جو کہ 19 اپریل سے 11 مئی 2018 تک یورپ کا دورہ کر رہے ہیں اور جرمنی، ناروے، یونان، فرانس، اٹلی اور ہالینڈ میں تبلیغ کر رہے ہیں۔"
  tr: "Islamic Da'wah Magazine, 14 Haziran 2018 tarihli raporu, Ahl al-Sunnah Emiri Mawlana Ubaid Ridha Attari'nin 19 Nisan - 11 Mayıs 2018 tarihleri arasında Avrupa'daki turu ve Almanya, Norveç, Yunanistan, İtalya, İspanya, Fransa ve Hollanda'daki konuşmalarını anlatıyor."
  id: "Majalah Islam Da'wah melaporkan (14 Juni 2018) tentang tur Khalifah Emir Ahl al-Sunnah, Mawlana Ubaid Ridha Attari, Eropa dari 19 April hingga 11 Mei 2018, serta pidatonya di Jerman, Norwegia, Yunani, Italia, Spanyol, Prancis, dan Belanda."
