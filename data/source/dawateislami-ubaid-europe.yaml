reliability_note: "The movement's own magazine report, read in full on 5 November 2026; a first-party source used for the movement's account of its successor's preaching tours. It styles him throughout 'the successor of Ameer-e-Ahl-e-Sunnat, Maulana Abu Usayd, Ubayd Raza Attari Madani', records his inauguration of a new Faizan-e-Madinah in Offenbach, Germany, his Sunnah-inspired speeches across seven European countries, and a travelling companion's summary of his preaching method. It does not state the father–son tie in words; that attestation comes from the movement's founder page and its Holland announcement."
