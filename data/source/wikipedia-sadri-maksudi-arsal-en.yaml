summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صدري مقصودي أرسال؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1878 (السنة فقط) في قرية طاشسو قرب قازان، وشهادته في الحقوق من السوربون، ونيابته عن قازان في مجلس الدوما الروسي الثاني (1907) والثالث (1908)، ورئاسته لدولة إيديل أورال قصيرة العمر، وفراره عبر فنلندا إلى باريس وبرلين، وانتقاله إلى تركيا سنة 1925 وأستاذيته في أنقرة وإسطنبول، ونيابته ثلاث دورات في البرلمان التركي، ووفاته في إسطنبول في 20 فبراير 1957. ولا تسمي له ديانة ولا مدرسة."
  en: "English Wikipedia article on Sadri Maksudi Arsal; used for entity facts only. It gives his birth in 1878 (year only) at the village of Taşsu near Kazan, his law degree from the Sorbonne, his Kazan seats in the second (1907) and third (1908) Russian State Dumas, his presidency of the short-lived Idel-Ural State, his flight through Finland to Paris and Berlin, his move to Turkey in 1925 and professorships in Ankara and Istanbul, his three terms in the Turkish parliament, and his death at Istanbul on 20 February 1957. It names no religion or school for him."
