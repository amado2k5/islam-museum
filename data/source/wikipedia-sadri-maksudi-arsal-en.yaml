summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صدري مقصودي أرسال؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1878 ⁦(السنة فقط)⁩ في قرية طاشسو قرب قازان، وشهادته في الحقوق من السوربون، ونيابته عن قازان في مجلس الدوما الروسي الثاني (1907) والثالث (1908)، ورئاسته لدولة إيديل أورال قصيرة العمر، وفراره عبر فنلندا إلى باريس وبرلين، وانتقاله إلى تركيا سنة 1925 وأستاذيته في أنقرة وإسطنبول، ونيابته ثلاث دورات في البرلمان التركي، ووفاته في إسطنبول في 20 فبراير 1957. ولا تسمي له ديانة ولا مدرسة."
  en: "English Wikipedia article on Sadri Maksudi Arsal; used for entity facts only. It gives his birth in 1878 (year only) at the village of Taşsu near Kazan, his law degree from the Sorbonne, his Kazan seats in the second (1907) and third (1908) Russian State Dumas, his presidency of the short-lived Idel-Ural State, his flight through Finland to Paris and Berlin, his move to Turkey in 1925 and professorships in Ankara and Istanbul, his three terms in the Turkish parliament, and his death at Istanbul on 20 February 1957. It names no religion or school for him."
  es: "Artículo de la Wikipedia en inglés sobre Sadri Maksudi Arsal; utilizado únicamente para datos biográficos. Indica su nacimiento en 1878 (solo el año) en el pueblo de Taşsu, cerca de Kazán; su licenciatura en derecho por la Sorbona; sus escaños por Kazán en la segunda (1907) y tercera (1908) Duma Estatal rusa; su presidencia del efímero Estado de Idel-Ural; su huida a través de Finlandia hacia París y Berlín; su traslado a Turquía en 1925 y sus cátedras en Ankara e Estambul; sus tres mandatos en el parlamento turco; y su fallecimiento en Estambul el 20 de febrero de 1957. No menciona su religión ni su escuela."
  fr: "L'article de Wikipédia en anglais consacré à Sadri Maksudi Arsal, utilisé uniquement pour les informations biographiques, mentionne sa naissance en 1878 (année seulement) au village de Taşsu, près de Kazan, son diplôme de droit à la Sorbonne, ses mandats à la Douma d'État russe (deuxième en 1907 et troisième en 1908), sa présidence de l'éphémère État d'Idel-Oural, sa fuite via la Finlande vers Paris et Berlin, son installation en Turquie en 1925 et ses postes de professeur à Ankara et Istanbul, ses trois mandats au Parlement turc et son décès à Istanbul le 20 février 1957. Aucune mention n'est faite de sa religion ou de son école."
