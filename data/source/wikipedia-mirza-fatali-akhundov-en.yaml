summary:
  ar: مقالة ويكيبيديا الإنجليزية عن ميرزا فتح علي أخوندوف؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في نوخا سنة 1812 وعمله في تفليس مترجمًا ومدرسًا وكوميدياته الست وقصة «النجوم المخدوعة» وحملته لإصلاح الأبجدية، وتنقل عن موسوعة إيرانيكا وصفه بأنه من أوائل الملحدين الصرحاء في العالم الإسلامي.
  en: English Wikipedia article on Mirza Fatali Akhundov; used for entity facts only. It gives his birth at Nukha on 12 July 1812, his Tiflis career as a translator and teacher, his six comedies of the early 1850s, The Deceived Stars, his alphabet-reform campaign, and quotes the Encyclopaedia Iranica calling him one of the earliest and most outspoken atheists in the Islamic world.
  es: "Artículo de la Wikipedia en inglés sobre Mirza Fatali Akhundov; utilizado únicamente para datos sobre la persona. Menciona su nacimiento en Nukha el 12 de julio de 1812, su trayectoria como traductor y profesor en Tiflis, sus seis comedias de principios de la década de 1850, Las estrellas engañadas, su campaña de reforma del alfabeto, y cita la Encyclopaedia Iranica, que lo describe como uno de los primeros y más declarados ateos del mundo islámico."
  fr: "Article de Wikipédia en anglais sur Mirza Fatali Akhundov; utilisé uniquement pour les informations factuelles. Il mentionne sa naissance à Nukha le 12 juillet 1812, sa carrière de traducteur et d’enseignant à Tiflis, ses six comédies du début des années 1850, « Les Étoiles trompées », sa campagne pour la réforme de l’alphabet, et cite l’Encyclopaedia Iranica qui le qualifie de l’un des premiers et des plus fervents athées du monde islamique."
  ur: "مرزا فتالی اخوندوف پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 12 جولائی 1812 کو نخہ میں ان کی پیدائش، ایک مترجم اور استاد کے طور پر اس کا ٹفلس کیریئر، 1850 کی دہائی کے اوائل کی اس کی چھ مزاحیہ فلمیں، دی ڈیسیوڈ اسٹارز، اس کی حروف تہجی کی اصلاح کی مہم، اور انسائیکلوپیڈیا ایرانیکا کے حوالے سے اسے اسلامی دنیا کے ابتدائی اور سب سے زیادہ بولنے والے ملحدین میں سے ایک قرار دیا گیا ہے۔"
  tr: "Mirza Fath Ali Akhundov hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılır. 1812'de Nokha'da doğmasını, Tiflis'te çevirmen ve öğretmenlik çalışmalarını, altı komedisini, 'Deluded Stars' hikayesini ve alfabeyi reform etme kampanyasını anlatır. Encyclopaedia Iranica, onu İslam dünyasındaki en erken etkileyici ateistlerden biri olarak tanımlar."
  id: "Artikel Wikipedia bahasa Inggris tentang Mirza Fath Ali Akhundov hanya digunakan untuk fakta-fakta entitas tersebut. Ia menyebutkan kelahirannya di Nokha pada tahun 1812, karyanya di Tbilisi sebagai penerjemah dan guru, enam komedinya, cerita 'The Deluded Stars,' dan kampanyenya untuk mereformasi alfabet. Encyclopaedia Iranica menggambarkannya sebagai salah satu ateis paling awal yang fasih di dunia Islam."
