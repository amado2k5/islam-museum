summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن برديس ثابتي؛ تُستخدم لوقائع الكيان فقط. تروي ولادتها في طهران سنة 1975، وتعليمها في معهد ماساتشوستس للتقنية وأكسفورد وهارفارد، واختباراتها الإحصائية للانتقاء الطبيعي، وعملها الجينومي في إيبولا ولاسا، وشهرتها ⁦(تايم 2014/2015)⁩ وانتخابها للأكاديمية الوطنية للعلوم سنة 2026."
  en: "English Wikipedia article on Pardis Sabeti; used for entity facts only. It recounts her 1975 Tehran birth, her education at MIT, Oxford and Harvard, her statistical tests for natural selection, her genomic work on Ebola and Lassa, her Time honours (2014/2015) and her 2026 election to the National Academy of Sciences."
  es: "Artículo de la Wikipedia en inglés sobre Pardis Sabeti; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Teherán en 1975, su formación académica en el MIT, Oxford y Harvard, sus pruebas estadísticas sobre selección natural, su trabajo genómico sobre el ébola y el virus de Lassa, sus distinciones honoríficas (2014/2015) y su elección en 2026 a la Academia Nacional de Ciencias."
  fr: "Article de Wikipédia en anglais sur Pardis Sabeti; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance à Téhéran en 1975, ses études au MIT, à Oxford et à Harvard, ses tests statistiques sur la sélection naturelle, ses travaux génomiques sur Ebola et Lassa, ses distinctions honorifiques (2014/2015) et son élection à l’Académie nationale des sciences en 2026."
  ur: "Pardis Sabeti پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی 1975 کی تہران پیدائش، MIT، آکسفورڈ اور ہارورڈ میں اس کی تعلیم، قدرتی انتخاب کے لیے اس کے شماریاتی ٹیسٹ، ایبولا اور لاسا پر اس کے جینومک کام، اس کے ٹائم آنرز (2014/2015) اور نیشنل اکیڈمی آف سائنسز میں اس کے 2026 کے انتخاب کا ذکر ہے۔"
