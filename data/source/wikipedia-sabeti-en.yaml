  ar: "مقالة ويكيبيديا الإنجليزية عن برديس ثابتي؛ تُستخدم لوقائع الكيان فقط. تروي ولادتها في طهران سنة 1975، وتعليمها في معهد ماساتشوستس للتقنية وأكسفورد وهارفارد، واختباراتها الإحصائية للانتقاء الطبيعي، وعملها الجينومي في إيبولا ولاسا، وشهرتها (تايم 2014/2015) وانتخابها للأكاديمية الوطنية للعلوم سنة 2026."
  en: "English Wikipedia article on Pardis Sabeti; used for entity facts only. It recounts her 1975 Tehran birth, her education at MIT, Oxford and Harvard, her statistical tests for natural selection, her genomic work on Ebola and Lassa, her Time honours (2014/2015) and her 2026 election to the National Academy of Sciences."
