reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth name Raden Mas Said, his birth at Kartasura and death at Surakarta on 28 December 1795, his sixteen years of war and 250 battles against the Dutch East India Company, his rejection of the Treaty of Giyanti and his settlement under the Treaty of Salatiga in 1757, and his proclamation as a National Hero of Indonesia in 1988. Its birth year conflicts inside the article — 1725 in the lead and categories against 1726 in the infobox, the latter following Ricklefs's 2018 monograph — and both readings are preserved in the record; its category also files him under 1796 deaths against its own text. It names no religion or school for the man. Checked 1 November 2026."
