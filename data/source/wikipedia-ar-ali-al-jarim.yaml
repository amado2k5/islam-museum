summary:
  ar: "الصفحة «علي الجارم» — Wikipedia (Arabic)؛ لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: كتاب «al-Balagha al-Wadiha» ومؤلفه وتاريخه."
  en: "The page «علي الجارم» — Wikipedia (Arabic); summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the book «al-Balagha al-Wadiha»: its author and date."
  ur: "صفحہ «علي الجارم» — Wikipedia (Arabic)؛ اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: کتاب «al-Balagha al-Wadiha»، اس کے مصنف اور تاریخ کا بیان۔"
  fr: "La page «علي الجارم» — Wikipedia (Arabic) ; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : le livre « al-Balagha al-Wadiha » : son auteur et sa date."
  es: "La página «علي الجارم» — Wikipedia (Arabic); resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: el libro «al-Balagha al-Wadiha»: su autor y su fecha."
  tr: "\"Ali Al-Jarem\" sayfası — Wikipedia (Arapça); kurucusunun 21 Kasım 2026'da müzeye sunduğu bir araştırma özetiyle özetlenmiştir; müze sayfayı açmamış ve kurucu özetin geri çekilmeden kullanılmasını kabul etmiştir. Kullanıldığı alanlar: \"el-Balagha el-Vadiha\" kitabında, yazarı ve tarihçesi."
  id: "Halaman \"Ali Al-Jarem\" — Wikipedia (Arab); dirangkum oleh ringkasan penelitian yang diajukan oleh pendiri ke museum pada 21 November 2026; museum tidak membuka halaman tersebut, dan pendiri setuju menggunakan ringkasan tersebut tanpa verifikasi ulang. Digunakan dalam: buku \"al-Balagha al-Wadiha,\" penulisnya, dan sejarahnya."
