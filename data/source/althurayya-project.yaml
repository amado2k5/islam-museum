summary:
  ar: "الصفحة الرئيسية لمشروع «الثريا» كما قُرئت في 7 نوفمبر 2026: معجم أماكن ونموذج جغرافي للعالم الإسلامي المبكر لمعصومة سيدي ⁦(جامعة الآغا خان، لندن)⁩ وماكسيم رومانوف ⁦(جامعة هامبورغ)⁩، فيه أكثر من ألفي اسم موضع وقرابة ذلك من مقاطع الطرق، مأخوذة من أطلس جورجيت كورنو للعالم العربي الإسلامي في القرنين الثالث والرابع للهجرة ⁦(بريل، 1983)⁩، وبياناته مفتوحة على GitHub."
  en: "The home page of the al-Ṯurayyā Project as read on 7 November 2026: a gazetteer and geospatial model of the early Islamic world by Masoumeh Seydi (Aga Khan University, London) and Maxim Romanov (Universität Hamburg), with over 2,000 toponyms and almost as many route sections georeferenced from Georgette Cornu's Atlas du monde arabo-islamique à l'époque classique (Brill, 1983), its data open on GitHub."
  ur: "«الثریا» منصوبے کا مرکزی صفحہ، 7 نومبر 2026 کو پڑھا گیا: ابتدائی اسلامی دنیا کا مقامات نامہ اور جغرافیائی نمونہ، معصومہ سیدی ⁦(آغا خان یونیورسٹی، لندن)⁩ اور ماکسیم رومانوف ⁦(ہیمبرگ یونیورسٹی)⁩ کا؛ دو ہزار سے زیادہ مقامات اور تقریباً اتنے ہی راستوں کے حصے، جورجیٹ کورنو کے اطلس ⁦(بریل، 1983)⁩ سے، اور اس کا ڈیٹا GitHub پر کھلا۔"
