summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فرقة نيتف دين الأمريكية؛ لوقائع الكيان فقط: أعضاؤها الثلاثة من واشنطن، ونشأتها عبر منظمة شباب المسلمين في أمريكا الشمالية، وأسلوبها وآلاتها، وأعمالها الخيرية، وألبوماتها الثلاثة؛ تستند إلى مقالة لوزارة الخارجية الأمريكية وبوسطن غلوب وساذرن كاليفورنيا إنفوكس."
  en: "English Wikipedia article on the American group Native Deen; entity facts only: its three members from Washington, its origin through Muslim Youth of North America, its style and instruments, its charity work and its three albums; it cites a US State Department feature, The Boston Globe and Southern California InFocus."
  es: "Artículo de la Wikipedia en inglés sobre el grupo estadounidense Native Deen; solo datos sobre la entidad: sus tres miembros de Washington, su origen a través de la Juventud Musulmana de Norteamérica, su estilo e instrumentos, su labor benéfica y sus tres álbumes; cita un reportaje del Departamento de Estado de EE. UU., The Boston Globe y Southern California InFocus."
  fr: "Article de Wikipédia en anglais sur le groupe américain Native Deen; informations sur l’entité uniquement: ses trois membres originaires de Washington, son origine via Muslim Youth of North America, son style et ses instruments, son travail caritatif et ses trois albums; il cite un article du département d’État américain, le Boston Globe et Southern California InFocus."
  ur: "امریکی گروپ Native Deen پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: واشنگٹن سے اس کے تین اراکین، اس کی ابتدا مسلم یوتھ آف نارتھ امریکہ کے ذریعے ہوئی، اس کا انداز اور آلات، اس کا خیراتی کام اور اس کے تین البمز؛ یہ امریکی محکمہ خارجہ کی ایک خصوصیت، بوسٹن گلوب اور جنوبی کیلیفورنیا انفوکس کا حوالہ دیتا ہے۔"
  tr: "Amerikan grubu Native Religion hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için: Washington'dan üç üyesi, Kuzey Amerika'daki Müslüman Gençlik Örgütü aracılığıyla kökenleri, tarzı ve enstrümanları, hayır işleri ve üç albümü; ABD Dışişleri Bakanlığı, Boston Globe ve Southern California Invoc tarafından yayımlanan bir makaleye dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang band Amerika Native Religion; hanya untuk fakta entitas: tiga anggotanya dari Washington, asal-usulnya melalui Muslim Youth Organization di Amerika Utara, gaya dan instrumennya, karya amalnya, dan tiga albumnya; artikel ini didasarkan pada artikel dari Departemen Luar Negeri AS, Boston Globe, dan Southern California Invoc."
