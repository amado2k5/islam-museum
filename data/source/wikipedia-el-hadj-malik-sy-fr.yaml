reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Its lead is the independent attestation of his Tijaniyya leadership on which, with the English article's succession account, the record's sufi segment rests: 'un érudit de la Tariqa Tijaniyya, une voie soufie orthodoxe qu'il contribua largement à diffuser au Sénégal et en Afrique noire' (a scholar of the Tijaniyya tariqa, an orthodox Sufi path which he contributed greatly to spreading in Senegal and Black Africa). The same lead names him 'appartenant à l'école de jurisprudence Malikite et à l'école de théologie Asharite' — the fullest school attestation fetched; but the English article names the same schools while declaring itself partly translated from this article, so the school rests on one source family and no sunni segment is recorded, as the record's faith note states. It gives: full name Sheikh al-Saidi al-Hajj Malik ibn Ousmane ibn Demba ibn Chamseddine Sy; born at Gaé (Gaya) near Dagana 'vers 1855' — 'Sa date de naissance reste incertaine': the oral tradition's 25 February 1855 marks, on the tradition itself, his 'entrée dans ce village' (entry into the village), from which a birth date was inferred; Wikidata gives 18 February 1855 — a different day, equally inferred; the record therefore keeps year precision. He stayed in Mauritania, settled at Saint-Louis in 1884, then Louga and Pire, and finally Tivaouane in 1902, at the suggestion of his father-in-law the scholar Mor Massamba Diery Dieng and at the invitation of the notable Djibril Guèye; his zawiya at Tivaouane is on the national list of classified historic sites and monuments. Its bibliography lists the scholarship on him (Gomez; Robinson, 'Malick Sy, Teacher in the New Colonial Order'; Mbaye's Sorbonne thesis on his thought and action 'between the Shari'a and the Tariqa')."
