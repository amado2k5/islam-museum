  ar: "مقالة ويكيبيديا الفرنسية عن الشيخ الحاج مالك سي (1855-1922)؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه عالم من المدرسة الفقهية المالكية والمدرسة العقدية الأشعرية وعالم في الطريقة التيجانية أسهم إسهاما كبيرا في نشرها في السنغال وأفريقيا السوداء."
  en: "French Wikipedia article on Shaykh al-Hajj Malik Sy (1855–1922); used for entity facts only. It describes him as a scholar of the Maliki school of jurisprudence and the Ash'ari school of theology, and a scholar of the Tariqa Tijaniyya which he contributed greatly to spreading in Senegal and Black Africa."
