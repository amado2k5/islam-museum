summary:
  ar: "مقالة ويكيبيديا العربية عن محمد ناظم الحقاني (1922–2014)، تصفه في صدرها بأنه أحد مرجعيات الصوفية النقشبندية تلقّى الطريقة القادرية من والده والطريقة المولوية من جدّه لأمه، وتقرن ميلاده بلارنكا بـ23 أبريل 1922 الموافق عندها 26 شعبان 1340هـ."
  en: "The Arabic Wikipedia article on Muhammad Nazim al-Haqqani (1922–2014), whose lead calls him one of the authorities of Naqshbandi Sufism who received the Qadiri order from his father and the Mawlawi order from his maternal grandfather; it pairs his Larnaca birth with 23 April 1922, given as 26 Sha’ban 1340 AH."
  es: "El artículo árabe de Wikipedia sobre Muhammad Nazim al-Haqqani (1922-2014), cuyo líder lo llama una de las autoridades del sufismo naqshbandi que recibió la orden Qadiri de su padre y la orden Mawlawi de su abuelo materno; empareja su nacimiento en Larnaca con el 23 de abril de 1922, dado como 26 Sha'ban 1340 AH."
  fr: "L'article arabe de Wikipédia sur Muhammad Nazim al-Haqqani (1922-2014), dont le responsable le considère comme l'une des autorités du soufisme Naqshbandi qui a reçu l'ordre Qadiri de son père et l'ordre Mawlawi de son grand-père maternel; il associe sa naissance à Larnaca au 23 avril 1922, donné comme le 26 Sha'ban 1340 AH."
  ur: "محمد ناظم الحقانی (1922–2014) پر عربی ویکیپیڈیا کا مضمون، جس کی قیادت انہیں نقشبندی تصوف کے حکام میں سے ایک کہتی ہے جنہوں نے قادری حکم اپنے والد سے اور مولوی حکم اپنے نانا سے حاصل کیا۔ اس کی پیدائش 23 اپریل 1922 کو 26 شعبان 1340 ہجری سے ملتی ہے۔"
