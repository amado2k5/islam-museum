  ar: "مقالة ويكيبيديا العربية عن محمد ناظم الحقاني (1922–2014)، تصفه في صدرها بأنه أحد مرجعيات الصوفية النقشبندية تلقّى الطريقة القادرية من والده والطريقة المولوية من جدّه لأمه، وتقرن ميلاده بلارنكا بـ23 أبريل 1922 الموافق عندها 26 شعبان 1340هـ."
  en: "The Arabic Wikipedia article on Muhammad Nazim al-Haqqani (1922–2014), whose lead calls him one of the authorities of Naqshbandi Sufism who received the Qadiri order from his father and the Mawlawi order from his maternal grandfather; it pairs his Larnaca birth with 23 April 1922, given as 26 Sha’ban 1340 AH."
