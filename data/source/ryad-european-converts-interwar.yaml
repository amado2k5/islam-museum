summary:
  ar: "فصل عمر رياض الأكاديمي عن السلفية والأحمدية والمهتدين الأوروبيين بين الحربين، وفيه نشاط شيلدريك في بعثة ووكينغ، وطلبه فتوى الأزهر سنة 1932، وحرصه على إثبات قربه من الإسلام السائد وأملُه في وحدة سنية شيعية، ومطالبته جماعة لاهور بالتبرؤ من ميرزا غلام أحمد."
  en: "Umar Ryad's scholarly chapter on Salafiyya, Ahmadiyya and European converts in the interwar period, covering Sheldrake's Woking-mission activity, his 1932 fatwa request to al-Azhar, his anxiety to prove his closeness to mainstream Islam and his hope for Sunni-Shi'i unity, and his demand that the Lahore group disavow Mirza Ghulam Ahmad."
  es: "El erudito capítulo de Umar Ryad sobre los salafistas, los ahmadíes y los conversos europeos en el período de entreguerras, abarca la actividad de la misión de Sheldrake en Woking, su solicitud de fatwa a al-Azhar en 1932, su ansiedad por demostrar su cercanía al islam tradicional y su esperanza de unidad suní-chií, y su exigencia de que el grupo de Lahore repudiara a Mirza Ghulam Ahmad."
  fr: "Le chapitre érudit d'Umar Ryad sur les Salafiyya, les Ahmadiyya et les convertis européens durant l'entre-deux-guerres, couvrant l'activité de la mission de Sheldrake à Woking, sa demande de fatwa de 1932 à al-Azhar, son désir de prouver sa proximité avec l'islam traditionnel et son espoir d'unité sunnite-chiite, ainsi que sa demande que le groupe de Lahore désavoue Mirza Ghulam Ahmad."
