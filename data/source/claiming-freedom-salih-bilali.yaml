reliability_note: "Book chapter read on the publisher's own Manifold platform on 3 November 2026; the passage quoted is from chapter 1, at its note 68. Its dating (born 1765, captured 1790, arrived 1800) is one of three competing scholarly readings and is preserved as such in the person record. The chapter names John Couper as the plantation owner where the exhibit page names his son James Hamilton Couper, the account's author; the person record follows the exhibit on the son as the writer of the surviving account."
