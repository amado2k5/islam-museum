label:
  en: "Claiming Freedom: Race, Kinship, and Land in Nineteenth-Century Georgia — the Salih Bilali passage"
summary:
  ar: "من كتاب أكاديمي صادر عن مطبعة جامعة ساوث كارولينا ⁦(منصّة Manifold)⁩: «وُلد صالح [بلالي] سنة 1765، وأُسر على أيدي تجار العبيد سنة 1790... ووصل إلى أمريكا الشمالية سنة 1800 وصار السائق الرئيس في مزرعة كانونز بوينت بجزيرة سانت سايمنز التابعة لجون كوبر. ورغم أنه سُمّي توم، ظلّ صالح مسلمًا متدينًا وظلّ يشير إلى نفسه باسم صالح.»"
  en: "From a scholarly book published by the University of South Carolina Press, read on its Manifold platform, chapter 1 ('The Slave's Dream'): Salih Bilali was born in 1765, captured by slavers in 1790 as the Bambara consolidated control of the Upper Niger, confined at Anomabu on the Gold Coast, and arrived in North America in 1800, becoming head driver on John Couper's Cannon's Point plantation on St. Simons Island; given the name Tom, he 'remained a devout Muslim and continued to refer to himself as Salih'."
  es: "De un libro académico publicado por la editorial de la Universidad de Carolina del Sur, leído en su plataforma Manifold, capítulo 1 ('El sueño del esclavo'): Salih Bilali nació en 1765, fue capturado por traficantes de esclavos en 1790 cuando los bambara consolidaban su control del Alto Níger, fue confinado en Anomabu en la Costa de Oro y llegó a América del Norte en 1800, convirtiéndose en el capataz principal de la plantación Cannon's Point de John Couper en la isla de St. Simons; recibió el nombre de Tom, pero 'siguió siendo un musulmán devoto y continuó refiriéndose a sí mismo como Salih'."
  fr: "Extrait d'un ouvrage universitaire publié par les Presses universitaires de Caroline du Sud, disponible sur sa plateforme Manifold, chapitre 1 (« Le rêve de l'esclave »): Salih Bilali est né en 1765, capturé par des négriers en 1790 alors que les Bambara consolidaient leur contrôle sur le Haut-Niger, détenu à Anomabu sur la Côte de l'Or, et arrivé en Amérique du Nord en 1800, devenant chef d'équipe sur la plantation Cannon's Point de John Couper sur l'île de St. Simons; baptisé Tom, il « est resté un musulman fervent et a continué à se faire appeler Salih »."
  ur: "یونیورسٹی آف ساؤتھ کیرولائنا پریس کی طرف سے شائع کردہ ایک علمی کتاب سے، اس کے مینی فولڈ پلیٹ فارم پر پڑھیں، باب 1 ⁦('غلام کا خواب')⁩: صالح بلالی 1765 میں پیدا ہوا، 1790 میں غلاموں کے ہاتھوں پکڑا گیا، جب بامبرا نے بالائی نائجر کا کنٹرول مضبوط کر لیا، انومابو میں ڈرائیور بن گیا، اور 18 میں گولڈ 0 میں پہنچ گیا۔ سینٹ سائمنز جزیرے پر جان کوپر کی کینن پوائنٹ پلانٹیشن پر؛ ٹام کا نام دیا، وہ 'ایک متقی مسلمان رہا اور اپنے آپ کو صالح کہتا رہا'۔"
  tr: "University of South Carolina Press tarafından yayımlanan akademik bir kitaptan (Manifold platformu): \"Saleh [Bilali] 1765'te doğdu ve 1790'da köle tüccarları tarafından esir alındı... 1800'de Kuzey Amerika'ya geldi ve John Cooper'a ait St. Simons Adası'ndaki Cannons Point Çiftliği'nin baş sürücüsü oldu. Tom olarak adlandırılmasına rağmen, Saleh dindar bir Müslüman olarak kaldı ve kendisine Saleh demeye devam etti.\""
  id: "Dari sebuah buku akademik yang diterbitkan oleh University of South Carolina Press (platform Manifold): \"Saleh [Bilali] lahir pada tahun 1765 dan ditangkap oleh pedagang budak pada tahun 1790... Ia tiba di Amerika Utara pada tahun 1800 dan menjadi pengemudi utama di Cannons Point Ranch di Pulau St. Simons, milik John Cooper. Meskipun ia dipanggil Tom, Saleh tetap menjadi Muslim yang taat dan terus menyebut dirinya sebagai Saleh.\""
