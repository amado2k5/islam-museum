summary:
  ar: "كتاب فتاوى لمحمود خطاب السبكي (ت. 1352 هـ) جمع فتاوى علماء الأزهر في إنكار بدع الجنائز والأفراح والمولد وما شابهها، ومعه ردود على ما أنكره من أفعال."
  ur: "محمود خطاب السبکی کا جمع کردہ فتاوے کا مجموعہ جو جنازوں، تقریبات اور میلاد میں عوامی بدعات کے خلاف ازہر کے علماء کے جوابات پر مشتمل ہے۔"
  en: "A fatwa collection by Mahmud Khattab al-Subki (d. 1352 AH) gathering rulings from Al-Azhar scholars against popular innovations at funerals, celebrations and similar practices."
