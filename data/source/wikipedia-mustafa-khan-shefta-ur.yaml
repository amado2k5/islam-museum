summary:
  ar: "مقالة ويكيبيديا الأردية عن نواب مصطفى خان شيفتة؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تذكر مكتبته في دلهي التي نُهبت سنة 1857، وسجنه سبع سنوات ثم العفو عنه، وتصنّفه في مواليد 1809 ووفيات 1869."
  en: "Urdu Wikipedia article on Nawab Mustafa Khan Shefta; used for entity facts only. A short article noting his Delhi library looted and burned in 1857, his seven-year sentence and later pardon on Nawab Siddiq Hasan Khan's intercession, and his son and grandson; its categories file him under 1809 births and 1869 deaths."
  es: "Artículo en urdu de Wikipedia sobre Nawab Mustafa Khan Shefta; utilizado únicamente para datos sobre la persona. Un breve artículo que menciona el saqueo e incendio de su biblioteca en Delhi en 1857, su condena de siete años y su posterior indulto gracias a la intercesión de Nawab Siddiq Hasan Khan, así como a su hijo y nieto; sus categorías lo clasifican entre los nacidos en 1809 y los fallecidos en 1869."
  fr: "Article de Wikipédia en ourdou sur Nawab Mustafa Khan Shefta; utilisé uniquement à des fins d'information. Ce court article mentionne le pillage et l'incendie de sa bibliothèque à Delhi en 1857, sa condamnation à sept ans de prison et sa grâce ultérieure grâce à l'intervention de Nawab Siddiq Hasan Khan, ainsi que son fils et son petit-fils; il est classé parmi les naissances de 1809 et les décès de 1869."
