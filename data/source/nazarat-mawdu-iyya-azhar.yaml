summary:
  ar: "مجموعة مقالات وكلمات للدكتور محيي الدين عفيفي أحمد، الأمين العام لمجمع البحوث الإسلامية، ضمن السلسلة العلمية للمجمع، عن قضايا إنسانية معاصرة: السلام والحوار، والوقف والبحث العلمي، والمساواة، والاحتكار، وحماية البيئة، وثقافة الاختلاف، والتعايش، والعنف والتطرف، والروهينجا، والقدس؛ 252 صفحة، 1439هـ / 2018م."
  en: "A collection of essays and speeches by Dr Muhyi al-Din Afifi Ahmad, Secretary-General of the Islamic Research Academy, in the Academy's Scientific Series, on contemporary human questions: peace and dialogue, waqf and research, equality, hoarding, environmental protection, coexistence, violence and extremism, the Rohingya crisis and Jerusalem. 252 pages, 1439 AH / 2018 CE as printed."
