summary:
  ar: "مجموعة مقالات وكلمات للدكتور محيي الدين عفيفي أحمد، الأمين العام لمجمع البحوث الإسلامية، ضمن السلسلة العلمية للمجمع، عن قضايا إنسانية معاصرة: السلام والحوار، والوقف والبحث العلمي، والمساواة، والاحتكار، وحماية البيئة، وثقافة الاختلاف، والتعايش، والعنف والتطرف، والروهينجا، والقدس؛ 252 صفحة، 1439هـ / 2018م."
  en: "A collection of essays and speeches by Dr Muhyi al-Din Afifi Ahmad, Secretary-General of the Islamic Research Academy, in the Academy's Scientific Series, on contemporary human questions: peace and dialogue, waqf and research, equality, hoarding, environmental protection, coexistence, violence and extremism, the Rohingya crisis and Jerusalem. 252 pages, 1439 AH / 2018 CE as printed."
  es: "Recopilación de ensayos y discursos del Dr. Muhyi al-Din Afifi Ahmad, Secretario General de la Academia de Investigación Islámica, perteneciente a la Serie Científica de la Academia, sobre cuestiones humanas contemporáneas: paz y diálogo, waqf e investigación, igualdad, acaparamiento, protección del medio ambiente, coexistencia, violencia y extremismo, la crisis de los rohinyá y Jerusalén. 252 páginas, 1439 AH / 2018 d. C. (fecha de impresión)."
  fr: "Recueil d'essais et de discours du Dr Muhyi al-Din Afifi Ahmad, secrétaire général de l'Académie de recherche islamique, publié dans la collection scientifique de l'Académie, sur des questions humaines contemporaines: paix et dialogue, waqf et recherche, égalité, accaparement, protection de l'environnement, coexistence, violence et extrémisme, crise des Rohingyas et Jérusalem. 252 pages, 1439 AH / 2018 CE (édition imprimée)."
