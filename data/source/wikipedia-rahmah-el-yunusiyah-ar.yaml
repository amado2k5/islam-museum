  ar: "مقالة ويكيبيديا العربية عن رحمة اليونسية؛ تُستخدم لوقائع الكيان فقط. تختصر سيرة الإنجليزية: ميلادها سنة 1900 في عائلة علماء، وتأسيسها دينية بوتري سنة 1923، ووفاتها سنة 1969 عن 68 عامًا."
  en: "Arabic Wikipedia article on Rahmah el Yunusiyah; used for entity facts only. It abridges the English article's account: her birth in 1900 into a family of scholars, her founding of Diniyah Putri in 1923, and her death in 1969 aged 68."
