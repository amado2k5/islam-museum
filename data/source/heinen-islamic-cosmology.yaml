label:
  ar: "أنطون هاينن، الكوسمولوجيا الإسلامية: دراسة في «الهيئة السنية في الهيئة السنية» للسيوطي ⁦(بيروت، 1982)⁩"
  en: "Anton M. Heinen, Islamic Cosmology: A Study of as-Suyuti's al-Hay'a as-saniya fi l-hay'a as-sunniya (Beirut, 1982)"
summary:
  ar: "دراسة وتحقيق وترجمة إنجليزية وشرح لكتاب السيوطي في الهيئة المستندة إلى الأثر، مع تحليل تاريخي لمصادره من القرن التاسع إلى الحادي عشر ولإحيائه في القرنين الخامس عشر والسادس عشر، صدرت في سلسلة نصوص ودراسات بيروتية ⁦(المجلد 27)⁩."
  en: "A study, critical edition, English translation and commentary of al-Suyuti's tradition-based cosmology, with a historical analysis of its ninth- to eleventh-century sources and of its fifteenth- and sixteenth-century revival; Beiruter Texte und Studien 27."
  es: "Un estudio, edición crítica, traducción al inglés y comentario de la cosmología basada en la tradición de al-Suyuti, con un análisis histórico de sus fuentes de los siglos IX al XI y de su resurgimiento en los siglos XV y XVI; Beiruter Texte und Studien 27."
  fr: "Une étude, une édition critique, une traduction anglaise et un commentaire de la cosmologie traditionnelle d'al-Suyuti, avec une analyse historique de ses sources du IXe au XIe siècle et de sa renaissance aux XVe et XVIe siècles; Beiruter Texte und Studien 27."
  ur: "ایک مطالعہ، تنقیدی ایڈیشن، السیوطی کی روایت پر مبنی کاسمولوجی کا انگریزی ترجمہ اور تفسیر، اس کے نویں سے گیارہویں صدی کے ماخذ اور اس کے پندرہویں اور سولہویں صدی کے احیاء کے تاریخی تجزیے کے ساتھ؛ Beiruter Texte und Studien 27۔"
