  ar: "مقطع على تيك توك نشره عبد الله شفا في 22 أبريل 2026 بعنوان «ፍትህ ለአክሱም ሙስሊሞች‼ Ustaz Hayder Kedir» ⁦(عدالة لمسلمي أكسوم)⁩، وبلغ عند قراءته في 7 نوفمبر 2026 عدد 29,800 مشاهدة و5,110 إعجابات."
  en: "TikTok clip posted by Abdela Shifa on 22 April 2026, captioned 'ፍትህ ለአክሱም ሙስሊሞች‼ Ustaz Hayder Kedir' ('Justice for Aksum Muslims'); when read on 7 November 2026 it showed 29,800 plays and 5,110 likes."
