  fr: "Clip TikTok publié par Abdela Shifa le 22 avril 2026, légendé 'ፍትህ ለአክሱም ሙስሊሞች‼ Ustaz Hayder Kedir' (« Justice pour les musulmans d'Aksum »); lorsqu'il a été visionné le 7 novembre 2026, il affichait 29 800 vues et 5 110 mentions « J'aime »."
