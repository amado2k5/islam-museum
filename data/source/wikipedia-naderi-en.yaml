  ar: "مقالة ويكيبيديا الإنجليزية عن فيروز نادري؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في شيراز، ومسيرته في مختبر الدفع النفاث (برنامج المريخ، إدارة استكشاف المجموعة الشمسية)، وجوائزه، ووفاته في لوس أنجلوس سنة 2023، وتصرح أنه لم يكن له انتماء ديني ووصف نفسه بأنه روحاني النزعة."
  en: "English Wikipedia article on Firouz Naderi; used for entity facts only. It recounts his Shiraz birth, his JPL career (the Mars program, solar-system exploration), his awards, his 2023 death in Los Angeles, and states that he had no religious affiliation and called himself a 'spiritual' person."
