summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيروز نادري؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في شيراز، ومسيرته في مختبر الدفع النفاث ⁦(برنامج المريخ، إدارة استكشاف المجموعة الشمسية)⁩، وجوائزه، ووفاته في لوس أنجلوس سنة 2023، وتصرح أنه لم يكن له انتماء ديني ووصف نفسه بأنه روحاني النزعة."
  en: "English Wikipedia article on Firouz Naderi; used for entity facts only. It recounts his Shiraz birth, his JPL career (the Mars program, solar-system exploration), his awards, his 2023 death in Los Angeles, and states that he had no religious affiliation and called himself a 'spiritual' person."
  es: "Artículo de la Wikipedia en inglés sobre Firouz Naderi; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Shiraz, su trayectoria profesional en el JPL (el programa de Marte, la exploración del sistema solar), sus premios, su fallecimiento en Los Ángeles en 2023, y afirma que no profesaba ninguna religión y se consideraba una persona \"espiritual\"."
  fr: "Article de Wikipédia en anglais sur Firouz Naderi; utilisé uniquement pour des informations sur l’entité. Il relate sa naissance à Shiraz, sa carrière au JPL (programme martien, exploration du système solaire), ses récompenses, son décès en 2023 à Los Angeles, et précise qu’il n’avait aucune affiliation religieuse et se décrivait comme une personne « spirituelle »."
  ur: "فیروز نادری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی شیراز کی پیدائش، اس کے جے پی ایل کیریئر ⁦(مریخ پروگرام، شمسی نظام کی تلاش)⁩، اس کے ایوارڈز، لاس اینجلس میں اس کی 2023 کی موت کا ذکر کیا گیا ہے، اور بتایا گیا ہے کہ اس کی کوئی مذہبی وابستگی نہیں تھی اور وہ خود کو 'روحانی' شخص کہتے تھے۔"
