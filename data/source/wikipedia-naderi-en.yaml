reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. Its lead gives his birth as 25 March 1946 and his death as 9 June 2023; its early-life section adds that he was actually born on 15 March 1946 and the birth recorded on 25 March. Its political-affiliation section states: 'He had no religious affiliation,' and that in a 2011 interview he called himself a 'spiritual' person, believing in 'something' beyond himself 'but not within the framework of any religion.'"
