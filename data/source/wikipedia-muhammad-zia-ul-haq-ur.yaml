  ar: "مقالة ويكيبيديا الأردية عن محمد ضياء الحق؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1924 في جالندر في أسرة أرائية، وحصوله على التفويض سنة 1945، وخدمته في الأردن، وترقياته وتعيينه قائدا للجيش في 1 مارس 1976. ويعطي صندوق معلوماتها الدين «سني إسلام»."
