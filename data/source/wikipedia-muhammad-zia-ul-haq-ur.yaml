summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد ضياء الحق؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1924 في جالندر في أسرة أرائية، وحصوله على التفويض سنة 1945، وخدمته في الأردن، وترقياته وتعيينه قائدا للجيش في 1 مارس 1976. ويعطي صندوق معلوماتها الدين «سني إسلام»."
  en: "Urdu Wikipedia article on Muhammad Zia-ul-Haq; used for entity facts only. It gives his birth in 1924 at Jalandhar to an Arain family, his commission in 1945, his Jordan posting, his promotions and appointment as army chief on 1 March 1976. Its infobox religion field gives 'Sunni Islam'."
  es: "Artículo de Wikipedia en urdu sobre Muhammad Zia-ul-Haq; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1924 en Jalandhar en el seno de una familia Arain, su nombramiento como oficial en 1945, su destino en Jordania, sus ascensos y su designación como jefe del ejército el 1 de marzo de 1976. El campo de religión en su ficha informativa indica «Islam sunita»."
  fr: "Article de Wikipédia en ourdou sur Muhammad Zia-ul-Haq; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance en 1924 à Jalandhar dans une famille arain, son entrée en service en 1945, son affectation en Jordanie, ses promotions et sa nomination comme chef d'état-major de l'armée le 1er mars 1976. Son infobox « religion » indique « Islam sunnite »."
  ur: "محمد ضیاء الحق پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1924 میں جالندھر میں ایک آرائیں خاندان میں ان کی پیدائش، 1945 میں اس کا کمیشن، اس کی اردن میں پوسٹنگ، ان کی ترقیاں اور 1 مارچ 1976 کو آرمی چیف کے طور پر تقرری۔ اس کا معلوماتی باکس مذہب 'سنی اسلام' دیتا ہے۔"
