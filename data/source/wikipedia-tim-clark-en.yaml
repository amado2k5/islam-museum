  ar: "مقالة ويكيبيديا الإنجليزية عن تيم كلارك، رئيس طيران الإمارات منذ 2003؛ تذكر مولده في 22 تشرين الثاني 1949 في أروبا، ودراسته في كلية كنت وجامعة لندن، وانضمامه إلى فريق تأسيس طيران الإمارات سنة 1985، وإدارته الخطوط السريلانكية حتى 2008، وحصوله على الجنسية الإماراتية سنة 2021."
  en: "English Wikipedia article on Tim Clark, president of Emirates since 2003; it gives his birth on 22 November 1949 in Aruba, his education at Kent College and the University of London, his place in Emirates' 1985 founding team, his managing directorship of SriLankan Airlines until 2008, and his Emirati citizenship of 2021."
