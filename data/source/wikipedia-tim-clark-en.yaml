summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تيم كلارك، رئيس طيران الإمارات منذ 2003؛ تذكر مولده في 22 تشرين الثاني 1949 في أروبا، ودراسته في كلية كنت وجامعة لندن، وانضمامه إلى فريق تأسيس طيران الإمارات سنة 1985، وإدارته الخطوط السريلانكية حتى 2008، وحصوله على الجنسية الإماراتية سنة 2021."
  en: "English Wikipedia article on Tim Clark, president of Emirates since 2003; it gives his birth on 22 November 1949 in Aruba, his education at Kent College and the University of London, his place in Emirates' 1985 founding team, his managing directorship of SriLankan Airlines until 2008, and his Emirati citizenship of 2021."
  es: "Artículo de la Wikipedia en inglés sobre Tim Clark, presidente de Emirates desde 2003; en él se indica que nació el 22 de noviembre de 1949 en Aruba, su formación académica en el Kent College y la Universidad de Londres, su participación en el equipo fundador de Emirates en 1985, su cargo como director general de SriLankan Airlines hasta 2008 y su ciudadanía emiratí desde 2021."
  fr: "L'article de Wikipédia en anglais sur Tim Clark, président d'Emirates depuis 2003, mentionne sa naissance le 22 novembre 1949 à Aruba, ses études au Kent College et à l'Université de Londres, son rôle au sein de l'équipe fondatrice d'Emirates en 1985, son poste de directeur général de SriLankan Airlines jusqu'en 2008 et sa citoyenneté émiratie obtenue en 2021."
  ur: "2003 سے امارات کے صدر ٹم کلارک پر انگریزی ویکیپیڈیا کا مضمون؛ یہ 22 نومبر 1949 کو اروبا میں ان کی پیدائش، کینٹ کالج اور یونیورسٹی آف لندن میں ان کی تعلیم، امارات کی 1985 کی بانی ٹیم میں ان کی جگہ، 2008 تک سری لنکن ایئر لائنز کی ان کی منیجنگ ڈائریکٹر شپ، اور 2021 کی اماراتی شہریت۔"
  tr: "2003'ten beri Emirates Airlines'ın Başkanı olan Tim Clark hakkında İngilizce Wikipedia makalesi; 22 Kasım 1949'da Aruba'da doğduğunu, Kent College ve Londra Üniversitesi'ndeki eğitimini, 1985'te Emirates'in kurucu ekibine katılmasını, 2008'e kadar Sri Lankan Airlines'ı yönettiğini ve 2021'de BAE vatandaşlığını aldığını belirtiyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Tim Clark, Presiden Emirates Airlines sejak 2003; artikel tersebut menyebutkan kelahirannya pada 22 November 1949 di Aruba, studinya di Kent College dan University of London, bergabung dengan tim pendiri Emirates pada tahun 1985, mengelola SriLankan Airlines hingga 2008, dan memperoleh kewarganegaraan UEA pada tahun 2021."
