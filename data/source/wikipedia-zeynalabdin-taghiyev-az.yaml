summary:
  ar: "مقالة ويكيبيديا الأذربيجانية عن زين العابدين تقييف؛ تُستخدم لوقائع الكيان فقط. تفتتح بسنة 1838 مع التنبيه إلى أن مصدرًا آخر يعطي 1823، وتفصّل أعماله الخيرية ولا سيما مدرسة البنات ومعارضة بعض رجال الدين لها، ومنهاج المدرسة الذي شمل أحكام الشريعة."
  en: "Azerbaijani Wikipedia article on Zeynalabdin Taghiyev; used for entity facts only. It leads with 1838 while noting another source gives 1823, and details his philanthropy, above all the girls' school, the clerical opposition it drew, and the school's curriculum, which included the rulings of the sharia."
  es: "Artículo de la Wikipedia en azerbaiyano sobre Zeynalabdin Taghiyev; utilizado únicamente para obtener información sobre la persona. Comienza con 1838, aunque otra fuente indica 1823, y detalla su labor filantrópica, sobre todo la escuela para niñas, la oposición clerical que suscitó y el plan de estudios de la escuela, que incluía las normas de la sharia."
  fr: "Article Wikipédia azerbaïdjanais sur Zeynalabdin Taghiyev; utilisé uniquement pour les informations sur l'entité. Il commence par 1838, tout en mentionnant qu'une autre source donne 1823, et détaille sa philanthropie, notamment l'école de filles, l'opposition cléricale qu'elle a suscitée et le programme scolaire, qui comprenait les préceptes de la charia."
  ur: "زینالبدین تغییف پر آذربائیجانی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1838 کے ساتھ آگے بڑھتا ہے جبکہ ایک اور ذریعہ 1823 کو نوٹ کرتا ہے، اور اس کی انسان دوستی کی تفصیلات دیتا ہے، سب سے بڑھ کر لڑکیوں کے اسکول، اس کی طرف سے علما کی مخالفت، اور اسکول کے نصاب، جس میں شریعت کے احکام شامل تھے۔"
  tr: "Azerbaycan Vikipedisi'nde Zain al-Abidin hakkında bir kısıtlama maddesidir; yalnızca varlığın gerçekleri için kullanılır. 1838'de açılmıştır ve başka bir kaynağın 1823 yılını verdiği, özellikle kız okulu gibi hayır işleri faaliyetlerini, bazı dini âlimlerin muhalefetini ve okulun müfredatını, ki bu okulda Şeriat hükümleri yer aldığı yer alır, detaylandırır."
  id: "Artikel Wikipedia Azerbaijan tentang Zain al-Abidin adalah pembatasan; digunakan hanya untuk fakta entitas. Artikel ini dibuka pada tahun 1838, mencatat bahwa sumber lain menyebutkan tahun 1823, merinci karya amalnya, terutama sekolah perempuan, penolakan beberapa ulama agama terhadapnya, dan kurikulum sekolah yang mencakup putusan Syariah."
