title: "The Ancestors of Inhalational Anesthesia: The Soporific Sponges (XIth–XVIIth Centuries)"
summary:
  ar: "مقال في مجلة Anesthesiology يتتبع صيغ الإسفنج المنوم في المخطوطات من القرن الحادي عشر إلى السابع عشر، ويذكر أن أقدم صيغة معروفة له توجد في مجموع قسطنطين الإفريقي، ويحلل ما إذا كان الفعل استنشاقاً أم امتصاصاً عبر الأنف."
  en: "Anesthesiology article tracing soporific-sponge formulas in manuscripts from the 11th to 17th centuries, noting the earliest known formula in a Constantinus Africanus compilation and analysing whether action was by inhalation or nasal absorption."
  ur: "Anesthesiology کا مضمون جو گیارہویں سے سترہویں صدی تک کے مخطوطوں میں نیند دلانے والے اسفنج کی ترکیبوں کا سراغ کرتا ہے، بتاتا ہے کہ قدیم ترین معلوم ترکیب قسطنطین الافریقی کے مجموعے میں ہے، اور تجزیہ کرتا ہے کہ عمل سانس یا ناک کی جاذبیت سے تھا۔"
