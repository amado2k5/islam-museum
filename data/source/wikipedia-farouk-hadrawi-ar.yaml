summary:
  ar: "مقالة ويكيبيديا العربية عن فاروق عبد الرحمن حضراوي، مؤذن المسجد الحرام ومسجد نمرة؛ لوقائع الكيان فقط: مولده بالطائف في 10 رمضان 1365هـ، ونشأته في حارة الشامية بمكة، ودراسته، وعمله بوزارة الحج والأوقاف ⁦(1385–1431هـ)⁩، ومساجده قبل الحرم، وأذانه في نمرة من 1410هـ، وتعيينه في الحرم في محرم 1415هـ، وأذانه في لندن 1428 و1429هـ؛ ومرجعها خبر للرئاسة العامة لشؤون الحرمين."
  en: "Arabic Wikipedia article on Farouk Abd al-Rahman Hadrawi, muezzin of the Masjid al-Haram and of Namira Mosque; entity facts only: birth at Taif on 10 Ramadan 1365 AH, childhood in Mecca's Shamiyya quarter, schooling, his post at the Ministry of Hajj and Awqaf (1385–1431 AH), his mosques before the Haram, the Namira adhan from 1410 AH, appointment at the Haram in Muharram 1415 AH and his adhan in London in 1428 and 1429 AH; its reference is a news item of the presidency of the Two Holy Mosques."
  es: "Artículo de Wikipedia en árabe sobre Farouk Abd al-Rahman Hadrawi, muecín de la Mezquita Sagrada (Masjid al-Haram) y de la Mezquita de Namira; solo datos sobre la entidad: nacimiento en Taif el 10 de Ramadán de 1365 AH, infancia en el barrio Shamiyya de La Meca, escolarización, su puesto en el Ministerio de Hajj y Awqaf (1385-1431 AH), sus mezquitas frente al Haram, el adhan de Namira desde 1410 AH, nombramiento en el Haram en Muharram de 1415 AH y su adhan en Londres en 1428 y 1429 AH; su referencia es una noticia sobre la presidencia de las Dos Mezquitas Sagradas."
  fr: "Article de Wikipédia en arabe sur Farouk Abd al-Rahman Hadrawi, muezzin de la Masjid al-Haram et de la mosquée Namira; faits concernant uniquement l’entité: naissance à Taïf le 10 Ramadan 1365 AH, enfance dans le quartier Shamiyya de La Mecque, scolarité, son poste au ministère du Hajj et des Awqaf (1385-1431 AH), ses mosquées avant le Haram, l’adhan de Namira à partir de 1410 AH, nomination au Haram en Muharram 1415 AH et son adhan à Londres en 1428 et 1429 AH; sa référence est un article de presse sur la présidence des Deux Saintes Mosquées."
