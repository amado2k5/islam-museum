summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0639\u0646 \u0641\u0627\u0631\u0648\u0642 \u0639\u0628\u062f \u0627\u0644\u0631\u062d\u0645\u0646 \u062d\u0636\u0631\u0627\u0648\u064a\u060c \u0645\u0624\u0630\u0646 \u0627\u0644\u0645\u0633\u062c\u062f \u0627\u0644\u062d\u0631\u0627\u0645 \u0648\u0645\u0633\u062c\u062f \u0646\u0645\u0631\u0629\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0628\u0627\u0644\u0637\u0627\u0626\u0641 \u0641\u064a 10 \u0631\u0645\u0636\u0627\u0646 1365\u0647\u0640\u060c \u0648\u0646\u0634\u0623\u062a\u0647 \u0641\u064a \u062d\u0627\u0631\u0629 \u0627\u0644\u0634\u0627\u0645\u064a\u0629 \u0628\u0645\u0643\u0629\u060c \u0648\u062f\u0631\u0627\u0633\u062a\u0647\u060c \u0648\u0639\u0645\u0644\u0647 \u0628\u0648\u0632\u0627\u0631\u0629 \u0627\u0644\u062d\u062c \u0648\u0627\u0644\u0623\u0648\u0642\u0627\u0641 (1385\u20131431\u0647\u0640)\u060c \u0648\u0645\u0633\u0627\u062c\u062f\u0647 \u0642\u0628\u0644 \u0627\u0644\u062d\u0631\u0645\u060c \u0648\u0623\u0630\u0627\u0646\u0647 \u0641\u064a \u0646\u0645\u0631\u0629 \u0645\u0646 1410\u0647\u0640\u060c \u0648\u062a\u0639\u064a\u064a\u0646\u0647 \u0641\u064a \u0627\u0644\u062d\u0631\u0645 \u0641\u064a \u0645\u062d\u0631\u0645 1415\u0647\u0640\u060c \u0648\u0623\u0630\u0627\u0646\u0647 \u0641\u064a \u0644\u0646\u062f\u0646 1428 \u06481429\u0647\u0640\u061b \u0648\u0645\u0631\u062c\u0639\u0647\u0627 \u062e\u0628\u0631 \u0644\u0644\u0631\u0626\u0627\u0633\u0629 \u0627\u0644\u0639\u0627\u0645\u0629 \u0644\u0634\u0624\u0648\u0646 \u0627\u0644\u062d\u0631\u0645\u064a\u0646."
  en: "Arabic Wikipedia article on Farouk Abd al-Rahman Hadrawi, muezzin of the Masjid al-Haram and of Namira Mosque; entity facts only: birth at Taif on 10 Ramadan 1365 AH, childhood in Mecca's Shamiyya quarter, schooling, his post at the Ministry of Hajj and Awqaf (1385\u20131431 AH), his mosques before the Haram, the Namira adhan from 1410 AH, appointment at the Haram in Muharram 1415 AH and his adhan in London in 1428 and 1429 AH; its reference is a news item of the presidency of the Two Holy Mosques."
