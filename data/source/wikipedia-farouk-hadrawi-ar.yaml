summary:
  ar: "مقالة ويكيبيديا العربية عن فاروق عبد الرحمن حضراوي، مؤذن المسجد الحرام ومسجد نمرة؛ لوقائع الكيان فقط: مولده بالطائف في 10 رمضان 1365هـ، ونشأته في حارة الشامية بمكة، ودراسته، وعمله بوزارة الحج والأوقاف ⁦(1385–1431هـ)⁩، ومساجده قبل الحرم، وأذانه في نمرة من 1410هـ، وتعيينه في الحرم في محرم 1415هـ، وأذانه في لندن 1428 و1429هـ؛ ومرجعها خبر للرئاسة العامة لشؤون الحرمين."
  en: "Arabic Wikipedia article on Farouk Abd al-Rahman Hadrawi, muezzin of the Masjid al-Haram and of Namira Mosque; entity facts only: birth at Taif on 10 Ramadan 1365 AH, childhood in Mecca's Shamiyya quarter, schooling, his post at the Ministry of Hajj and Awqaf (1385–1431 AH), his mosques before the Haram, the Namira adhan from 1410 AH, appointment at the Haram in Muharram 1415 AH and his adhan in London in 1428 and 1429 AH; its reference is a news item of the presidency of the Two Holy Mosques."
