summary:
  ar: "مقالة ويكيبيديا العربية عن يحيى خان؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تذكر مولده في 4 فبراير 1917 ووفاته في 10 أغسطس 1980 في راولبندي ودفنه في بيشاور ومناصبه، وتذكر في مطلعها السنوات 1336–1400 هـ. يعطي صندوق معلوماتها الديانة «الإسلام» عموما ولا يسمي نصها مدرسة؛ وتضعه قائمة تصنيفاتها بين شيعة باكستان."
  en: "Arabic Wikipedia article on Yahya Khan; used for entity facts only. A short article: it gives his birth on 4 February 1917 and death on 10 August 1980 at Rawalpindi with burial at Peshawar, his offices, and the years 1336–1400 AH in its lead. Its infobox religion field gives Islam generically and its text names no school; its category list files him among Pakistani Shias."
  es: "Artículo de Wikipedia en árabe sobre Yahya Khan; utilizado únicamente para datos sobre la persona. Un artículo breve: indica su nacimiento el 4 de febrero de 1917 y su fallecimiento el 10 de agosto de 1980 en Rawalpindi, con sepultura en Peshawar, sus oficinas y los años 1336-1400 AH en su introducción. Su campo de religión en el recuadro informativo lo identifica como Islam de forma genérica y su texto no menciona ninguna escuela; su lista de categorías lo sitúa entre los chiítas pakistaníes."
  fr: "Article Wikipédia en arabe sur Yahya Khan; utilisé uniquement pour les informations biographiques. Cet article concis indique sa naissance le 4 février 1917 et sa mort le 10 août 1980 à Rawalpindi, avec inhumation à Peshawar. Il mentionne également ses fonctions et les années 1336-1400 de l'Hégire. L'infobox « Religion » mentionne l'islam de manière générique et le texte ne cite aucune école; la liste des catégories le classe parmi les chiites pakistanais."
  ur: "یحییٰ خان پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون: اس میں ان کی پیدائش 4 فروری 1917 اور وفات 10 اگست 1980 کو راولپنڈی میں پشاور، ان کے دفاتر میں تدفین اور سال 1336-1400 ہجری اس کی قیادت میں ہے۔ اس کا infobox مذہب کا میدان اسلام کو عمومی طور پر دیتا ہے اور اس کے متن کا کوئی اسکول نہیں ہے۔ اس کے زمرے کی فہرست اسے پاکستانی شیعوں میں درج کرتی ہے۔"
  tr: "Yahya Han hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 4 Şubat 1917'de doğduğunu, 10 Ağustos 1980'de Rawalpindi'de öldüğünü, Peşaver'de defnedilmesini ve görevlerini belirten kısa bir makale, başlangıçta 1336–1400 Hicri yıllarını belirtmektedir. Bilgi kutusunda dini genel olarak \"İslam\" olarak verilir ve metinde medrese olarak adlandırılmaz; Pakistan'daki Şiiler arasında listelenir."
  id: "Artikel Wikipedia berbahasa Arab tentang Yahya Khan; hanya digunakan untuk fakta entitas. Sebuah artikel singkat yang menyebutkan kelahirannya pada 4 Februari 1917, kematiannya pada 10 Agustus 1980 di Rawalpindi, dan pemakamannya di Peshawar serta posisinya, menyebutkan di awal tahun 1336–1400 H. Kotak infonya mencantumkan agama ini \"Islam\" secara umum dan tidak menyebutnya madrasah dalam teksnya; menyebutnya sebagai salah satu Syiah Pakistan."
