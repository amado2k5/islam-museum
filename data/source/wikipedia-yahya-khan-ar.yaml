  ar: "مقالة ويكيبيديا العربية عن يحيى خان؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تذكر مولده في 4 فبراير 1917 ووفاته في 10 أغسطس 1980 في راولبندي ودفنه في بيشاور ومناصبه، وتذكر في مطلعها السنوات 1336–1400 هـ. يعطي صندوق معلوماتها الديانة «الإسلام» عموما ولا يسمي نصها مدرسة؛ وتضعه قائمة تصنيفاتها بين شيعة باكستان."
  en: "Arabic Wikipedia article on Yahya Khan; used for entity facts only. A short article: it gives his birth on 4 February 1917 and death on 10 August 1980 at Rawalpindi with burial at Peshawar, his offices, and the years 1336–1400 AH in its lead. Its infobox religion field gives Islam generically and its text names no school; its category list files him among Pakistani Shias."
