label: { ar: "سيرة الإمام الهادي إلى الحق يحيى بن الحسين — علي بن محمد العباسي العلوي", en: "Sirat al-Imam al-Hadi ila al-Haqq Yahya ibn al-Husayn — Ali ibn Muhammad al-Abbasi al-Alawi" }
summary:
  ar: "سيرة الإمام الهادي إلى الحق يحيى بن الحسين بن القاسم الرسي، مؤسس الإمامة الزيدية بصعدة؛ ألفها مولَّده وكاتبه علي بن محمد بن عبيد الله العباسي العلوي الذي هاجر إليه ولازمه باليمن، وهي من أقدم السير الزيدية المكتوبة؛ نسخة ممسوحة أجريت عليها قراءة آلية في مكتبة الحصاد."
  en: "The sira of al-Hadi ila al-Haqq Yahya ibn al-Husayn ibn al-Qasim al-Rassi, founder of the Zaydi imamate at Sa'da, written by his client and secretary Ali ibn Muhammad ibn Ubayd Allah al-Abbasi al-Alawi, who emigrated to him in Yemen — among the earliest written Zaydi biographies; a scanned copy OCR'd in the local harvest."
  es: "La sira de al-Hadi ila al-Haqq Yahya ibn al-Husayn ibn al-Qasim al-Rassi, fundador del imamato zaidí en Sa'da, escrita por su cliente y secretario Ali ibn Muhammad ibn Ubayd Allah al-Abbasi al-Alawi, quien emigró a Yemen para reunirse con él, se encuentra entre las primeras biografías zaidíes escritas; una copia escaneada y procesada mediante OCR en la colección local."
  fr: "La sira d'al-Hadi ila al-Haqq Yahya ibn al-Husayn ibn al-Qasim al-Rassi, fondateur de l'imamat zaydite à Sa'da, écrite par son client et secrétaire Ali ibn Muhammad ibn Ubayd Allah al-Abbasi al-Alawi, qui a émigré auprès de lui au Yémen — parmi les premières biographies zaydites écrites; une copie scannée OCR dans la récolte locale."
title: "سيرة الإمام الهادي إلى الحق يحيى بن الحسين"
