summary:
  ar: "سيرة الإمام الهادي إلى الحق يحيى بن الحسين بن القاسم الرسي، مؤسس الإمامة الزيدية بصعدة؛ ألفها مولَّده وكاتبه علي بن محمد بن عبيد الله العباسي العلوي الذي هاجر إليه ولازمه باليمن، وهي من أقدم السير الزيدية المكتوبة؛ نسخة ممسوحة أجريت عليها قراءة آلية في مكتبة الحصاد."
  en: "The sira of al-Hadi ila al-Haqq Yahya ibn al-Husayn ibn al-Qasim al-Rassi, founder of the Zaydi imamate at Sa'da, written by his client and secretary Ali ibn Muhammad ibn Ubayd Allah al-Abbasi al-Alawi, who emigrated to him in Yemen — among the earliest written Zaydi biographies; a scanned copy OCR'd in the local harvest."
