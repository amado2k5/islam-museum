summary:
  ar: "مقالة ويكيبيديا العربية عن محمد بخاري؛ تُستخدم لوقائع الكيان فقط. تقول إنه وُلد سنة 1942 في قرية دورا «لأسرة مسلمة» في ولاية كاتسينا، وتصنّفه في مواليد 1361 هـ ووفيات 1447 هـ وضمن «مسلمون نيجيريون»."
  en: "Arabic Wikipedia article on Muhammadu Buhari; used for entity facts only. It says he was born in 1942 in the village of Daura 'to a Muslim family' in Katsina State, and files him under births of 1361 AH, deaths of 1447 AH and 'Nigerian Muslims'."
  es: "Artículo de Wikipedia en árabe sobre Muhammadu Buhari; utilizado únicamente para obtener información sobre la persona. Indica que nació en 1942 en la aldea de Daura, en el seno de una familia musulmana, en el estado de Katsina, y lo clasifica entre los nacidos en 1361 AH, fallecidos en 1447 AH y pertenecientes a la comunidad musulmana nigeriana."
  fr: "Article de Wikipédia en arabe sur Muhammadu Buhari; utilisé uniquement à des fins d'information sur l'entité. Il indique qu'il est né en 1942 dans le village de Daura, « dans une famille musulmane », dans l'État de Katsina, et le classe parmi les naissances de 1361 AH, les décès de 1447 AH et les « musulmans nigérians »."
  ur: "محمدو بخاری پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں کہا گیا ہے کہ وہ 1942 میں کاتسینا ریاست کے گاؤں دورا میں 'ایک مسلمان گھرانے میں' پیدا ہوا تھا، اور اس کی پیدائش 1361 ہجری، 1447 ہجری کی موت اور 'نائیجیرین مسلمان' کے تحت درج ہے۔"
  tr: "Muhammad Buhari hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1942'de Katsina Eyaleti'ndeki Dura köyünde 'Müslüman bir ailede' doğduğu yazıyor ve 1361 Hicri doğumlu ve 1447 Hicri yılında ölen olarak sınıflandırılıyor, ayrıca 'Nijeryalı Müslümanlar' arasında sınıflandırılıyor."
  id: "Artikel Wikipedia Arab tentang Muhammad Buhari; hanya digunakan untuk fakta entitas. Artikel tersebut menyatakan bahwa ia lahir pada tahun 1942 di desa Dura 'dari keluarga Muslim' di Negara Bagian Katsina, dan mengklasifikasikannya lahir pada tahun 1361 AH dan meninggal pada 1447 H, serta diklasifikasikan sebagai 'Muslim Nigeria.'"
