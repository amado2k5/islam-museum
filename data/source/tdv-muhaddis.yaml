summary:
  ar: "مدخل «محدِّث» في موسوعة TDV الإسلامية التركية بقلم محمد ياشار كاندمير ⁦(المجلد 30، أنقرة 2020، ص 390–392)⁩، ويتناول معنى الكلمة في اللغة والاصطلاح، وصفات المحدّث وشروطه، وآداب الطالب والمحدّث، وأعداد الحفظ المختلفة التي قيلت، وأعراف الرواية في المجلس."
  en: "The TDV İslâm Ansiklopedisi entry 'MUHADDİS' by M. Yaşar Kandemir (vol. 30, Ankara 2020, pp. 390–392). It covers the word in its lexical and technical senses, the qualities and conditions of the muhaddith, the manners of the student and the teacher, the numbers of memorised hadith that scholars proposed, and the customs of narration in the session."
  es: "La entrada «MUHADDİS» de la TDV İslâm Ansiklopedisi, de M. Yaşar Kandemir (vol. 30, Ankara 2020, pp. 390–392), abarca el término en sus sentidos léxico y técnico, las cualidades y condiciones del muhaddith, las maneras del estudiante y del maestro, la cantidad de hadices memorizados que propusieron los eruditos y las costumbres de narración en la sesión."
  fr: "L’article « MUHADDİS » de M. Yaşar Kandemir (vol. 30, Ankara 2020, pp. 390–392) de l’ouvrage TDV İslâm Ansiklopedisi traite du terme « muhaddith » dans ses acceptions lexicale et technique, des qualités et conditions requises pour ce métier, des comportements de l’étudiant et du maître, du nombre de hadiths à mémoriser proposé par les savants et des coutumes de narration lors des séances."
