reliability_note: "Read in full on 1 November 2026 in the web edition: the definition, the qualities and conditions, the manners of the student and the teacher, the numbers of memorised hadith, the customs of the session, and the bibliography. The printed page range 390–392 covers the whole entry, since the web edition gives no page marks inside the text, so citations give that range. Works named in the bibliography (al-Khatib al-Baghdadi, Ibn al-Salah, Ibn Jama'a, al-Suyuti and others) were not opened for this record. Facts are rewritten in the museum's own words."
