summary:
  ar: "مدخل «محدِّث» في موسوعة TDV الإسلامية التركية بقلم محمد ياشار كاندمير (المجلد 30، أنقرة 2020، ص 390–392)، ويتناول معنى الكلمة في اللغة والاصطلاح، وصفات المحدّث وشروطه، وآداب الطالب والمحدّث، وأعداد الحفظ المختلفة التي قيلت، وأعراف الرواية في المجلس."
  en: "The TDV İslâm Ansiklopedisi entry 'MUHADDİS' by M. Yaşar Kandemir (vol. 30, Ankara 2020, pp. 390–392). It covers the word in its lexical and technical senses, the qualities and conditions of the muhaddith, the manners of the student and the teacher, the numbers of memorised hadith that scholars proposed, and the customs of narration in the session."
