summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شيرينشو شوتمور؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 1 ديسمبر 1899 بمقاطعة شوغنون في إمارة بخارى، وعمله في مصنع بطشقند، ومسيرته الحزبية من 1921، ودوره في تأسيس جمهورية طاجيكستان ذاتية الحكم سنة 1924 وانفصال جمهورية طاجيكستان الاشتراكية السوفيتية عن أوزبكستان سنة 1929، ورئاسته اللجنة التنفيذية المركزية من 1933، وإعدامه في موسكو في 27 أكتوبر 1937 وإعادة اعتباره سنة 1956، وتسميته بطل طاجيكستان سنة 2006. ولا تذكر المقالة أي انتماء ديني له."
  en: "English Wikipedia article on Shirinsho Shotemur; used for entity facts only. It gives his birth on 1 December 1899 in Shughnon District in the Emirate of Bukhara, his factory work in Tashkent, his party career from 1921, his role in founding the Tajik ASSR in 1924 and the Tajik SSR's separation from Uzbekistan in 1929, his chairmanship of the Central Executive Committee from 1933, his execution in Moscow on 27 October 1937 and rehabilitation in 1956, and his posthumous naming as a Hero of Tajikistan in 2006. The article records no religious affiliation for him."
  es: "Artículo de la Wikipedia en inglés sobre Shirinsho Shotemur; utilizado únicamente para datos biográficos. Indica su nacimiento el 1 de diciembre de 1899 en el distrito de Shughnon, en el emirato de Bujará, su trabajo en una fábrica de Taskent, su trayectoria política desde 1921, su papel en la fundación de la RASS de Tayikistán en 1924 y la secesión de la RSS de Tayikistán de Uzbekistán en 1929, su presidencia del Comité Ejecutivo Central desde 1933, su ejecución en Moscú el 27 de octubre de 1937 y su rehabilitación en 1956, y su nombramiento póstumo como Héroe de Tayikistán en 2006. El artículo no registra ninguna afiliación religiosa."
  fr: "Article de Wikipédia en anglais sur Shirinsho Shotemur; utilisé uniquement pour les informations biographiques. Il mentionne sa naissance le 1er décembre 1899 dans le district de Shughnon, dans l’émirat de Boukhara, son travail en usine à Tachkent, son engagement au sein du parti à partir de 1921, son rôle dans la fondation de la RSSA du Tadjikistan en 1924 et la séparation de la RSS du Tadjikistan d’avec l’Ouzbékistan en 1929, sa présidence du Comité exécutif central à partir de 1933, son exécution à Moscou le 27 octobre 1937 et sa réhabilitation en 1956, ainsi que sa désignation à titre posthume comme Héros du Tadjikistan en 2006. L’article ne fait mention d’aucune appartenance religieuse."
