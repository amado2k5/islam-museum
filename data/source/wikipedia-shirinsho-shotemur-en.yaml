summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شيرينشو شوتمور؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 1 ديسمبر 1899 بمقاطعة شوغنون في إمارة بخارى، وعمله في مصنع بطشقند، ومسيرته الحزبية من 1921، ودوره في تأسيس جمهورية طاجيكستان ذاتية الحكم سنة 1924 وانفصال جمهورية طاجيكستان الاشتراكية السوفيتية عن أوزبكستان سنة 1929، ورئاسته اللجنة التنفيذية المركزية من 1933، وإعدامه في موسكو في 27 أكتوبر 1937 وإعادة اعتباره سنة 1956، وتسميته بطل طاجيكستان سنة 2006. ولا تذكر المقالة أي انتماء ديني له."
  en: "English Wikipedia article on Shirinsho Shotemur; used for entity facts only. It gives his birth on 1 December 1899 in Shughnon District in the Emirate of Bukhara, his factory work in Tashkent, his party career from 1921, his role in founding the Tajik ASSR in 1924 and the Tajik SSR's separation from Uzbekistan in 1929, his chairmanship of the Central Executive Committee from 1933, his execution in Moscow on 27 October 1937 and rehabilitation in 1956, and his posthumous naming as a Hero of Tajikistan in 2006. The article records no religious affiliation for him."
