summary:
  ar: "صفحة كندا دوكس عن إبراهيم هندي؛ فقرة سيرتها الافتتاحية تذكر أنه إمام مركز دار التوحيد الإسلامي في ميسيساغا والمدير الديني لفرع يقين كندا في معهد يقين، وأنه نال شهادة الدراسات الدينية من جامعة تورونتو ثم ماجستير أصول الفقه من جامعة المدينة العالمية في ماليزيا، وتسرد ظهوره الواسع في وسائل الإعلام الكندية."
  en: "CanadaDocs page on Ibrahim Hindy; its opening biographical paragraph states that he is the imam of Dar Al-Tawheed Islamic Centre in Mississauga and the Religious Director for Yaqeen Canada at the Yaqeen Institute for Islamic Research, that he attained a degree in Religious Studies at the University of Toronto and later an MA in Usul al-Fiqh from Al-Madinah International University in Malaysia, and that he has been featured extensively by Canadian national media."
  es: "La página de CanadaDocs sobre Ibrahim Hindy, en su párrafo biográfico inicial, indica que es el imán del Centro Islámico Dar Al-Tawheed en Mississauga y el Director Religioso de Yaqeen Canadá en el Instituto Yaqeen para la Investigación Islámica; que obtuvo una licenciatura en Estudios Religiosos en la Universidad de Toronto y posteriormente una maestría en Usul al-Fiqh de la Universidad Internacional Al-Madinah en Malasia; y que ha aparecido en numerosos medios de comunicación nacionales canadienses."
  fr: "La page CanadaDocs consacrée à Ibrahim Hindy; son premier paragraphe biographique indique qu'il est l'imam du centre islamique Dar Al-Tawheed à Mississauga et le directeur religieux de Yaqeen Canada à l'Institut Yaqeen de recherche islamique, qu'il a obtenu un diplôme en études religieuses à l'Université de Toronto et plus tard une maîtrise en Usul al-Fiqh à l'Université internationale Al-Madinah en Malaisie, et qu'il a été largement présenté par les médias nationaux canadiens."
  ur: "ابراہیم ہندی پر کینیڈا ڈاکس صفحہ؛ اس کے ابتدائی سوانحی پیراگراف میں کہا گیا ہے کہ وہ مسی ساگا میں دار التوحید اسلامک سنٹر کے امام اور یاقین انسٹی ٹیوٹ فار اسلامک ریسرچ میں یاقین کینیڈا کے مذہبی ڈائریکٹر ہیں، انہوں نے ٹورنٹو یونیورسٹی سے دینی علوم میں ڈگری حاصل کی اور بعد ازاں المدینہ سے اصول الفقہ میں ایم اے کی ڈگری حاصل کی، جسے ملائیشیا کی قومی یونیورسٹی اور بین الاقوامی یونیورسٹی میں شامل کیا گیا ہے۔ میڈیا"
title: "Ibrahim Hindy advocates building a global Muslim nation (ummah); not relying upon Jews, Christians"
