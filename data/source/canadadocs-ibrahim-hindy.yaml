summary:
  ar: "صفحة كندا دوكس عن إبراهيم هندي؛ فقرة سيرتها الافتتاحية تذكر أنه إمام مركز دار التوحيد الإسلامي في ميسيساغا والمدير الديني لفرع يقين كندا في معهد يقين، وأنه نال شهادة الدراسات الدينية من جامعة تورونتو ثم ماجستير أصول الفقه من جامعة المدينة العالمية في ماليزيا، وتسرد ظهوره الواسع في وسائل الإعلام الكندية."
  en: "CanadaDocs page on Ibrahim Hindy; its opening biographical paragraph states that he is the imam of Dar Al-Tawheed Islamic Centre in Mississauga and the Religious Director for Yaqeen Canada at the Yaqeen Institute for Islamic Research, that he attained a degree in Religious Studies at the University of Toronto and later an MA in Usul al-Fiqh from Al-Madinah International University in Malaysia, and that he has been featured extensively by Canadian national media."
title: "Ibrahim Hindy advocates building a global Muslim nation (ummah); not relying upon Jews, Christians"
