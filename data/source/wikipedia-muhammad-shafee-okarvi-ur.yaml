summary:
  ar: "مقالة ويكيبيديا الأردية عن حافظ محمد شفيع أوكاروي؛ تصفه في صدرها بأنه من ممتاز علماء أهل السنة والجماعة وبأنه مؤسس جماعة أهل السنة المركزية، وتذكر في قسم البيعة والإرادة أن بيره ومرشده هو ميان غلام الله الشرقبوري من السلسلة النقشبندية المجددية، وأنه نال الإجازة والخلافة من مشايخ كثيرين في جميع سلاسل الطريقة وأن مريديه بالآلاف في العالم، وتعطي مولده بسنة 1929 مع اقتران هجري (2 رمضان 1348هـ) يقابل 2 شباط 1930."
  en: "The Urdu Wikipedia article on Hafiz Muhammad Shafee Okarvi; its lead calls him a distinguished scholar of Ahl-e-Sunnat wa Jama'at and the founder of the central Jamaat Ahle Sunnat, its Bay'ah and Iradat section names his pir and murshid as Mian Ghulamullah Sharqpuri of the Naqshbandiyya Mujaddidiyya line, states that he held ijaza and khilafa from numerous shaykhs in all the tariqa silsilas and that his murids number in the thousands worldwide, and it gives his birth year as 1929 alongside a Hijri pairing (2 Ramadan 1348 AH) that converts to 2 February 1930."
