reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his Avar family at Gimry (father Dengau Muhammad, died 1828; mother Bakhu Mesidu), his imamate of Chechnya and Dagestan dated 1834-1859 in this article (the English article dates the Caucasian Imamate phase 1840-1859), the Sufi tariqa teaching in the Imamate's system, and his death dated March 1871 in this article — against 4 February 1871 in the English article and Wikidata; the discrepancy is recorded in the person record. The article names no madhhab in an infobox. Read in full on 24 October 2026."
