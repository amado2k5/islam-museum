summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حمزة حكيم زاده نيازي (1889–1929)، الشاعر والمسرحي والملحن الأوزبكي الذي رُجم في شاه مردان؛ يصرح متنها بأنه وُلد لأسرة مسلمة متدينة ثم «أصبح ملحدًا مع مرور الوقت» وحارب التعصب الديني والخرافة."
  en: "The English Wikipedia article on Hamza Hakimzade Niyazi (1889–1929), the Uzbek poet, playwright and composer stoned to death at Shohimardon; its lead states that he was born to a devout Muslim family and 'became an atheist over time', campaigning against religious fanaticism and superstition."
  es: "El artículo de la Wikipedia en inglés sobre Hamza Hakimzade Niyazi (1889-1929), el poeta, dramaturgo y compositor uzbeko lapidado hasta la muerte en Shohimardon, comienza diciendo que nació en una familia musulmana devota y que \"con el tiempo se convirtió en ateo\", haciendo campaña contra el fanatismo religioso y la superstición."
  fr: "L'article de Wikipédia en anglais sur Hamza Hakimzade Niyazi (1889-1929), le poète, dramaturge et compositeur ouzbek lapidé à mort à Shohimardon; son introduction indique qu'il est né dans une famille musulmane pieuse et qu'il « est devenu athée au fil du temps », militant contre le fanatisme religieux et la superstition."
