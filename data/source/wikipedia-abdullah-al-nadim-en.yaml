summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله النديم؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في الإسكندرية وتتلمذه على جمال الدين الأفغاني ودوره خطيبًا للثورة العرابية ونفيه ووفاته في إسطنبول سنة 1896."
  en: "English Wikipedia article on Abdullah al-Nadim; used for entity facts only. It recounts his Alexandria upbringing, his tutelage under Jamal al-Din al-Afghani, his role as orator of the Urabi revolt, his exiles, and his death at Istanbul in 1896."
  es: "Artículo de la Wikipedia en inglés sobre Abdullah al-Nadim; utilizado únicamente para obtener información sobre la persona. Relata su infancia en Alejandría, su formación con Jamal al-Din al-Afghani, su papel como orador de la revuelta de Urabi, sus exilios y su muerte en Estambul en 1896."
  fr: "Article de Wikipédia en anglais sur Abdullah al-Nadim; utilisé uniquement à des fins d’information sur l’entité. Il relate son enfance à Alexandrie, son apprentissage auprès de Jamal al-Din al-Afghani, son rôle d’orateur lors de la révolte d’Urabi, ses exils et sa mort à Istanbul en 1896."
  ur: "عبداللہ النادیم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی اسکندریہ کی پرورش، جمال الدین الافغانی کے ماتحت ان کی سرپرستی، عربی بغاوت کے خطیب کے طور پر ان کے کردار، اس کی جلاوطنی اور 1896 میں استنبول میں ان کی موت کا ذکر ہے۔"
  tr: "Abdullah el-Nadim hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. İskenderiye'deki yetiştirilme tarzını, Cemaleddin el-Afgani'nin öğrencisini, Urabi devriminin vaizi olarak rolünü, sürgününü ve 1896'da İstanbul'daki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdullah al-Nadim; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan masa kecilnya di Alexandria, muridnya di bawah Jamal al-Din al-Afghani, perannya sebagai pengkhotbah revolusi Urabi, pengasingannya, dan kematiannya di Istanbul pada tahun 1896."
