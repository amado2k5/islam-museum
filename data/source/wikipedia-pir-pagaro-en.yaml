summary:
  ar: "مقالة ويكيبيديا الإنجليزية «پير پگارو السادس» عن صبغت الله شاه الراشدي الثاني (1910–1943)؛ تُستخدم لوقائع الكيان فقط. تروي أنه الزعيم الروحي الوراثي لجماعة الحُرّ في السند، وأنه أيّد وحدة الهندوس والمسلمين والاستقلال، وأمر أتباعه المسلحين بحماية الهندوس في أحداث منزلكاه، وأن الحكومة الاستعمارية أعدمته شنقا في سجن حيدرآباد المركزي في 20 مارس 1943 وأن موضع دفنه ظل مجهولا."
  en: "English Wikipedia article 'Pir of Pagaro VI' on Sibghatullah Shah Rashdi II (1910–1943); used for entity facts only. It recounts that he was the hereditary spiritual leader of the Hur community in Sindh, that he championed Hindu-Muslim unity and Indian independence, that during the Manzilgah riots he ordered his armed followers to protect Hindus, and that the colonial government hanged him in Hyderabad Central Jail on 20 March 1943, his burial place remaining unknown."
  es: "Artículo de la Wikipedia en inglés «Pir de Pagaro VI» sobre Sibghatullah Shah Rashdi II (1910-1943); utilizado únicamente para datos sobre la persona. Relata que fue el líder espiritual hereditario de la comunidad Hur en Sindh, que defendió la unidad hindú-musulmana y la independencia de la India, que durante los disturbios de Manzilgah ordenó a sus seguidores armados que protegieran a los hindúes, y que el gobierno colonial lo ahorcó en la cárcel central de Hyderabad el 20 de marzo de 1943, permaneciendo desconocido el lugar de su entierro."
  fr: "L'article de Wikipédia en anglais intitulé « Pir de Pagaro VI » consacré à Sibghatullah Shah Rashdi II (1910-1943) est utilisé uniquement à titre informatif. Il relate qu'il était le chef spirituel héréditaire de la communauté Hur au Sindh, qu'il défendait l'unité hindou-musulmane et l'indépendance de l'Inde, que lors des émeutes de Manzilgah, il ordonna à ses partisans armés de protéger les hindous, et que le gouvernement colonial le pendit à la prison centrale d'Hyderabad le 20 mars 1943. Son lieu de sépulture demeure inconnu."
  ur: "صبغت اللہ شاہ راشدی ثانی (1910–1943) پر انگریزی ویکیپیڈیا مضمون 'پگارو VI کا پیر'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بتایا گیا ہے کہ وہ سندھ میں حور برادری کے موروثی روحانی پیشوا تھے، انہوں نے ہندو مسلم اتحاد اور ہندوستان کی آزادی کا علمبردار کیا، منزل گاہ کے فسادات کے دوران انہوں نے اپنے مسلح پیروکاروں کو ہندوؤں کی حفاظت کا حکم دیا، اور نوآبادیاتی حکومت نے انہیں 20 مارچ 1943 کو حیدرآباد سینٹرل جیل میں پھانسی دی، جو ان کی نامعلوم جگہ تھی۔"
  tr: "Sibbatullah Şah el-Rashidi II (1910–1943) hakkında İngilizce Wikipedia makalesi \"Pir Pagaru VI\"; yalnızca varlığın gerçekleri için kullanılır. Anlatılanlara göre, Sindh'teki Hurr grubunun kalıtsal manevi lideri olduğu, Hindu-Müslüman birliğini ve bağımsızlığını desteklediği, ikametgahındaki olaylar sırasında silahlı takipçilerine Hinduları korumalarını emrettiği anlatılır, sömürge hükümetinin 20 Mart 1943'te Hyderabad Merkez Hapishanesi'nde asılarak idam ettiği ve mezar yerinin bilinmediği anlatılır."
  id: "Artikel Wikipedia bahasa Inggris \"Pir Pagaru VI\" tentang Sibbatullah Shah al-Rashidi II (1910–1943); hanya digunakan untuk fakta-fakta entitas tersebut. Diceritakan bahwa ia adalah pemimpin spiritual turun-temurun kelompok Hurr di Sindh, mendukung persatuan dan kemerdekaan Hindu-Muslim, memerintahkan para pengikut bersenjatanya untuk melindungi umat Hindu selama peristiwa di kediamannya, bahwa pemerintah kolonial mengeksekusinya dengan cara digantung di Penjara Pusat Hyderabad pada 20 Maret 1943, dan tempat pemakamannya tetap tidak diketahui."
