summary:
  ar: "مقالة ويكيبيديا الإنجليزية «پير پگارو السادس» عن صبغت الله شاه الراشدي الثاني (1910–1943)؛ تُستخدم لوقائع الكيان فقط. تروي أنه الزعيم الروحي الوراثي لجماعة الحُرّ في السند، وأنه أيّد وحدة الهندوس والمسلمين والاستقلال، وأمر أتباعه المسلحين بحماية الهندوس في أحداث منزلكاه، وأن الحكومة الاستعمارية أعدمته شنقا في سجن حيدرآباد المركزي في 20 مارس 1943 وأن موضع دفنه ظل مجهولا."
  en: "English Wikipedia article 'Pir of Pagaro VI' on Sibghatullah Shah Rashdi II (1910–1943); used for entity facts only. It recounts that he was the hereditary spiritual leader of the Hur community in Sindh, that he championed Hindu-Muslim unity and Indian independence, that during the Manzilgah riots he ordered his armed followers to protect Hindus, and that the colonial government hanged him in Hyderabad Central Jail on 20 March 1943, his burial place remaining unknown."
