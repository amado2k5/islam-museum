reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 by its recorded revision id via the MediaWiki API, the returned id asserted equal before any claim was drawn. The article is a short stub resting on two 2022 web articles. It describes the Hurs as a Sufi Muslim community and him as its spiritual leader — an inherited office (his term is given as 1922–1943, from about the age of twelve) — and attests no personal initiation, discipleship or named order for him. It gives his birth as 1910 in the Khairpur State; Wikidata gives 16 March 1909 and the harvest queue 1908, and the three-way difference is carried as debated in the person record."
