summary:
  ar: "صفحة ترجمة محمد بن عمر بازمول في المكتبة الشاملة، تتضمن سيرته الذاتية: مولده في مكة المكرمة وجنسيته السعودية ودرجاته من جامعة أم القرى ومناصبه فيها أستاذا ووكيلا للكلية ومديرا لمركز إحياء التراث."
  en: "The Al-Maktaba al-Shamela author page for Muhammad ibn Umar Bazmool, carrying his CV: born in Makkah, Saudi nationality, degrees from Umm al-Qura University, and his posts there as professor, acting vice-dean and director of the Heritage Revival Centre."
  es: "La página del autor de Al-Maktaba al-Shamela, Muhammad ibn Umar Bazmool, incluye su currículum: nacido en La Meca, de nacionalidad saudí, graduado de la Universidad Umm al-Qura, y sus cargos allí como profesor, vicedecano interino y director del Centro de Revitalización del Patrimonio."
  fr: "La page d'auteur d'Al-Maktaba al-Shamela pour Muhammad ibn Umar Bazmool, contenant son CV: né à La Mecque, de nationalité saoudienne, diplômé de l'Université Umm al-Qura, et ses postes au sein de cette université en tant que professeur, vice-doyen par intérim et directeur du Centre de revitalisation du patrimoine."
  ur: "محمد بن عمر بازمول کے لیے المکتبہ الشمیلہ کا مصنف صفحہ، جس میں اپنا سی وی: مکہ مکرمہ میں پیدا ہوا، سعودی شہریت، ام القریٰ یونیورسٹی سے ڈگریاں، اور وہاں بطور پروفیسر، قائم مقام نائب ڈین اور ہیریٹیج ریوائیول سنٹر کے ڈائریکٹر کے عہدے۔"
  tr: "Kapsamlı Kütüphane'deki Muhammed bin Ömer Bazmoul'un biyografisi sayfasında biyografisi yer alıyor: Mekke'deki doğumu, Suudi vatandaşlığı, Um Al-Qura Üniversitesi'nden aldığı diplomalar ve oradaki profesör, fakülte dekan yardımcısı ve Miras Canlandırma Merkezi direktörlüğü görevleri."
  id: "Halaman biografi Muhammad bin Omar Bazmoul di Perpustakaan Komprehensif memuat biografinya: kelahirannya di Mekah, kewarganegaraan Saudi, gelar dari Universitas um Al-Qura, dan posisinya di sana sebagai profesor, wakil dekan perguruan tinggi, serta direktur Heritage Revival Center."
