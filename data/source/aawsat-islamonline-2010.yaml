label: { en: "'Islamonline Employees Protest Move to Qatar', Asharq Al-Awsat (English), 18 March 2010" }
summary:
  ar: "تقرير الشرق الأوسط ⁦(بالإنجليزية)⁩ في 18 مارس 2010 عن قرار إدارة إسلام أون لاين في قطر نقل العمل من القاهرة إلى الدوحة، واعتصام 338 موظفًا، وأقوال محامي الشركة القطرية وأقوال الموظفين."
  en: "Asharq Al-Awsat's English report of 18 March 2010 on the decision of IslamOnline's management in Qatar to move its operation from Cairo to Doha, the sit-in of 338 staff, and the statements of the Qatari company's lawyer and of the employees."
  ur: "الشرق الاوسط ⁦(انگریزی)⁩ کی 18 مارچ 2010 کی رپورٹ: اسلام آن لائن کی قطری انتظامیہ کا کام قاہرہ سے دوحہ منتقل کرنے کا فیصلہ، 338 ملازمین کا دھرنا، اور قطری کمپنی کے وکیل اور ملازمین کے بیانات۔"
  es: "Informe en inglés de Asharq Al-Awsat del 18 de marzo de 2010 sobre la decisión de la dirección de IslamOnline en Qatar de trasladar sus operaciones de El Cairo a Doha, la sentada de 338 empleados y las declaraciones del abogado de la empresa qatarí y de los empleados."
  fr: "Le rapport en anglais d'Asharq Al-Awsat du 18 mars 2010 sur la décision de la direction d'IslamOnline au Qatar de transférer ses activités du Caire à Doha, le sit-in de 338 employés et les déclarations de l'avocat de la société qatarie et des employés."
  tr: "Middle East Report (İngilizce) 18 Mart 2010 tarihinde, Islam Online'ın Katar'daki yönetimi Kahire'den Doha'ya taşıma kararı, 338 çalışanın oturma eylemi, Katar şirketinin avukatlarının açıklamaları ve çalışanların açıklamaları hakkında."
  id: "Laporan Timur Tengah (dalam bahasa Inggris) pada 18 Maret 2010, tentang keputusan manajemen Islam Online di Qatar untuk memindahkan pekerjaan dari Kairo ke Doha, aksi duduk 338 karyawan, pernyataan dari pengacara perusahaan Qatar tersebut, dan pernyataan karyawan."
