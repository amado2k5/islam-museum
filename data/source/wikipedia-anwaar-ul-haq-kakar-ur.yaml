summary:
  ar: "مقالة ويكيبيديا الأردية عن أنوار الحق كاكر؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 15 مايو 1971 في مسلم باغ من قبيلة كاكر البشتونية، وتعليمه في كويته وكوهات ولندن وماجستيره من جامعة بلوشستان، وانتخابه لمجلس الشيوخ سنة 2018 ورئاسته المؤقتة للوزراء حتى 3 مارس 2024. لا تذكر المقالة أي دين له في النص أو في صندوق المعلومات."
  en: "Urdu Wikipedia article on Anwaar-ul-Haq Kakar; used for entity facts only. It recounts his birth on 15 May 1971 at Muslim Bagh, of the Kakar Pashtun tribe, his schooling at Quetta and Kohat, his master's degree from the University of Balochistan, his election to the Senate in 2018 and his caretaker premiership ending 3 March 2024. The article names no religion for him, in text or infobox."
  ur: "انوار الحق کاکڑ پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 15 مئی 1971ء کو مسلم باغ میں کاکڑ پشتون قبیلے میں ان کی پیدائش، کوئٹہ اور کوہاٹ میں ان کی تعلیم، جامعہ بلوچستان سے ان کی ماسٹرز ڈگری، 2018ء میں سینیٹ کے لیے ان کا انتخاب اور 3 مارچ 2024ء تک ان کی نگران وزارت عظمیٰ بیان ہوئی ہے۔ مضمون میں متن یا معلوماتی خانے میں ان کا کوئی مذہب درج نہیں۔"
