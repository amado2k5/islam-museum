summary:
  ar: "مقالة ويكيبيديا الأردية عن أنوار الحق كاكر؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 15 مايو 1971 في مسلم باغ من قبيلة كاكر البشتونية، وتعليمه في كويته وكوهات ولندن وماجستيره من جامعة بلوشستان، وانتخابه لمجلس الشيوخ سنة 2018 ورئاسته المؤقتة للوزراء حتى 3 مارس 2024. لا تذكر المقالة أي دين له في النص أو في صندوق المعلومات."
  en: "Urdu Wikipedia article on Anwaar-ul-Haq Kakar; used for entity facts only. It recounts his birth on 15 May 1971 at Muslim Bagh, of the Kakar Pashtun tribe, his schooling at Quetta and Kohat, his master's degree from the University of Balochistan, his election to the Senate in 2018 and his caretaker premiership ending 3 March 2024. The article names no religion for him, in text or infobox."
  ur: "انوار الحق کاکڑ پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 15 مئی 1971ء کو مسلم باغ میں کاکڑ پشتون قبیلے میں ان کی پیدائش، کوئٹہ اور کوہاٹ میں ان کی تعلیم، جامعہ بلوچستان سے ان کی ماسٹرز ڈگری، 2018ء میں سینیٹ کے لیے ان کا انتخاب اور 3 مارچ 2024ء تک ان کی نگران وزارت عظمیٰ بیان ہوئی ہے۔ مضمون میں متن یا معلوماتی خانے میں ان کا کوئی مذہب درج نہیں۔"
  es: "Artículo de Wikipedia en urdu sobre Anwaar-ul-Haq Kakar; utilizado únicamente para datos biográficos. Relata su nacimiento el 15 de mayo de 1971 en Muslim Bagh, perteneciente a la tribu pastún Kakar; su educación en Quetta y Kohat; su maestría en la Universidad de Baluchistán; su elección al Senado en 2018; y su mandato como primer ministro interino, que finalizó el 3 de marzo de 2024. El artículo no menciona su religión, ni en el texto ni en el recuadro informativo."
  fr: "Article de Wikipédia en ourdou sur Anwaar-ul-Haq Kakar; utilisé uniquement à des fins d'information sur la personne. Il relate sa naissance le 15 mai 1971 à Muslim Bagh, au sein de la tribu pachtoune Kakar, sa scolarité à Quetta et Kohat, l'obtention de sa maîtrise à l'Université du Baloutchistan, son élection au Sénat en 2018 et son mandat de Premier ministre par intérim qui s'est achevé le 3 mars 2024. L'article ne mentionne aucune religion à son sujet, ni dans le texte ni dans l'encadré."
  tr: "Anwar-ul-Haq Kakir hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Makale, 15 Mayıs 1971'de Peştun Kakar kabilesinin bir parçası olan Muslim Bagh'da doğmasını, Kuveyt, Kohat ve Londra'daki eğitimini, Belucistan Üniversitesi'nden yüksek lisansını, 2018'de Senato'ya seçilmesini ve 3 Mart 2024'e kadar geçici bakanlar başkanlığını anlatmaktadır. Makale, metinde veya bilgi kutusunda onun herhangi bir dininden bahsetmemektedir."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Anwar-ul-Haq Kakir; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 15 Mei 1971 di Muslim Bagh, bagian dari suku Pashtun Kakar, pendidikannya di Kuwait, Kohat, dan London, gelar master dari Universitas Balochistan, terpilihnya ke Senat pada 2018, dan masa jabatan sementara menteri hingga 3 Maret 2024. Artikel tersebut tidak menyebutkan agama apapun darinya dalam teks maupun dalam kotak info."
