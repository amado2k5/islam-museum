summary:
  ar: مقالة ويكيبيديا الفرنسية عن علي باش حانبة؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس ووفاته في القسطنطينية في 29 أكتوبر 1918، وأسرته البورجوازية من أصل تركي، وإجازته في القانون من جامعة باريس، وعمله في إدارة الحبوس ثم المحاماة، ونشاطه مع البشير صفر في جمعية قدماء الصادقية. لا تذكر المقالة دينًا أو مذهبًا له.
  en: French Wikipedia article on Ali Bach Hamba; used for entity facts only. It gives his birth in Tunis and his death at Constantinople on 29 October 1918, his bourgeois family of Turkish origin, his law licence from the University of Paris, his work in the Habous administration and then at the bar, and his activity with Béchir Sfar in the Sadiki alumni association. The article states no religion or school for him.
  es: "Artículo de la Wikipedia en francés sobre Ali Bach Hamba; utilizado únicamente para datos sobre la persona. Menciona su nacimiento en Túnez y su fallecimiento en Constantinopla el 29 de octubre de 1918, su familia burguesa de origen turco, su licenciatura en derecho por la Universidad de París, su trabajo en la administración de Habous y posteriormente como abogado, y su actividad con Béchir Sfar en la asociación de exalumnos de Sadiki. El artículo no indica su religión ni su escuela."
  fr: "Article de Wikipédia en français sur Ali Bach Hamba; utilisé uniquement pour les informations biographiques. Il indique sa naissance à Tunis et sa mort à Constantinople le 29 octobre 1918, son appartenance à une famille bourgeoise d'origine turque, son diplôme de droit de l'Université de Paris, son travail au sein de l'administration des Habous puis comme avocat, et son engagement auprès de Béchir Sfar au sein de l'association des anciens élèves de Sadiki. L'article ne mentionne ni sa religion ni son école."
  ur: "علی بچ حمبا پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ تیونس میں اس کی پیدائش اور 29 اکتوبر 1918 کو قسطنطنیہ میں اس کی موت، ترک نژاد اس کے بورژوا خاندان، پیرس یونیورسٹی سے اس کا لاء لائسنس، حبس انتظامیہ اور پھر بار میں اس کا کام، اور صادقی سابق طلباء کی انجمن میں بیچیر سفار کے ساتھ اس کی سرگرمی۔ آرٹیکل میں اس کے لیے کوئی مذہب یا اسکول نہیں بتایا گیا ہے۔"
  tr: "Ali Bash Hanba hakkında Fransızca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Tunus'ta doğduğu ve 29 Ekim 1918'de İstanbul'da öldüğü, Türk kökenli burjuva ailesi, Paris Üniversitesi'nden hukuk diploması, cezaevi yönetimi ve ardından hukuk alanındaki çalışmaları ile Sadiqiya Yaşlılar Derneği'nde Bashir Safar ile olan faaliyetleri anlatılır. Makalede dini veya mezhebi belirtilmemektedir."
  id: "Artikel Wikipedia Prancis tentang Ali Bash Hanba; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Tunisia dan kematiannya di Konstantinopel pada 29 Oktober 1918, keluarga borjuis keturunan Turki, gelar hukum dari Universitas Paris, pekerjaannya di administrasi penjara dan kemudian hukum, serta aktivitasnya bersama Bashir Safar di Asosiasi Tetua Sadiqia. Artikel tersebut tidak menyebutkan agama atau sektenya."
