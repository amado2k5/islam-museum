summary:
  ar: مقالة ويكيبيديا الفرنسية عن علي باش حانبة؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس ووفاته في القسطنطينية في 29 أكتوبر 1918، وأسرته البورجوازية من أصل تركي، وإجازته في القانون من جامعة باريس، وعمله في إدارة الحبوس ثم المحاماة، ونشاطه مع البشير صفر في جمعية قدماء الصادقية. لا تذكر المقالة دينًا أو مذهبًا له.
  en: French Wikipedia article on Ali Bach Hamba; used for entity facts only. It gives his birth in Tunis and his death at Constantinople on 29 October 1918, his bourgeois family of Turkish origin, his law licence from the University of Paris, his work in the Habous administration and then at the bar, and his activity with Béchir Sfar in the Sadiki alumni association. The article states no religion or school for him.
