  ar: "مقالة ويكيبيديا العربية عن حبيب الله خان؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تعطي مولده في 3 يونيو 1872 ووفاته اغتيالا في لغمان في 20 فبراير 1919 ونسبه إلى عبد الرحمن خان، وحياد أفغانستان في الحرب العالمية الأولى. صندوق معلوماتها يذكر ديانته «الإسلام» بصورة عامة دون مذهب."
  en: "Arabic Wikipedia article on Habibullah Khan; a short stub used for entity facts only. It gives his birth on 3 June 1872, his assassination in Laghman on 20 February 1919 and his descent from Abdur Rahman Khan, and Afghanistan's neutrality in the First World War. Its infobox gives his religion as Islam, generically, naming no school."
