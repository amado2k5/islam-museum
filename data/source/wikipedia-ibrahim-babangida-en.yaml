summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم بابانغيدا؛ تُستخدم لوقائع الكيان فقط. تروي تعليمه الإسلامي المبكر، ومسيرته في الجيش، وانقلابه في 27 أغسطس 1985 على بخاري، ورئاسته العسكرية حتى 1993، وانضمام نيجيريا في عهده إلى منظمة التعاون الإسلامي سنة 1986، وإلغاءه انتخابات 12 يونيو 1993 وتنحّيه في أغسطس 1993."
  en: "English Wikipedia article on Ibrahim Babangida; used for entity facts only. It recounts his early Islamic education, his army career, his coup of 27 August 1985 against Buhari, his military presidency to 1993, Nigeria's entry into the Organisation of Islamic Cooperation under him in 1986, his annulment of the 12 June 1993 election and his stepping aside in August 1993."
  es: "Artículo de la Wikipedia en inglés sobre Ibrahim Babangida; utilizado únicamente para datos biográficos. Relata su educación islámica temprana, su carrera militar, su golpe de Estado del 27 de agosto de 1985 contra Buhari, su presidencia militar hasta 1993, el ingreso de Nigeria en la Organización para la Cooperación Islámica bajo su mandato en 1986, la anulación de las elecciones del 12 de junio de 1993 y su renuncia en agosto de 1993."
  fr: "Article de Wikipédia en anglais sur Ibrahim Babangida; utilisé uniquement à des fins d'information sur l'entité. Il relate son éducation islamique initiale, sa carrière militaire, son coup d'État du 27 août 1985 contre Buhari, sa présidence militaire jusqu'en 1993, l'entrée du Nigeria dans l'Organisation de la coopération islamique sous sa présidence en 1986, l'annulation de l'élection du 12 juin 1993 et sa démission en août 1993."
