summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نزار قباني؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في دمشق في 22 مارس 1923 (في مقدمتها وصندوقها؛ بينما تعطي المقالتان العربية والأردية وويكي بيانات 21 مارس)، وشهادته في الحقوق من جامعة دمشق سنة 1945، ومناصبه الدبلوماسية واستقالته سنة 1966، وديوانه الأول «قالت لي السمراء» (1942)، ومقتل زوجته بلقيس الراوي في تفجير سفارة العراق ببيروت سنة 1981، ووفاته في لندن في 30 أبريل 1998، وتسجّل وصيته أن يُدفن في دمشق. ولا يذكر متنها دينه."
  en: "English Wikipedia article on Nizar Qabbani; used for entity facts only. It gives his birth at Damascus on 22 March 1923 (its lead and infobox; the Arabic and Urdu articles and Wikidata give 21 March), his law degree from Damascus University in 1945, his diplomatic postings and resignation in 1966, his first collection 'The Brunette Told Me' (1942), the killing of his wife Balqis al-Rawi in the 1981 Beirut embassy bombing, and his death at London on 30 April 1998, recording his wish to be buried in Damascus. It makes no statement of his religion."
