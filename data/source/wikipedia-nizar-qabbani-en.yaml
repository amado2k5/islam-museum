summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نزار قباني؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في دمشق في 22 مارس 1923 ⁦(في مقدمتها وصندوقها؛ بينما تعطي المقالتان العربية والأردية وويكي بيانات 21 مارس)⁩، وشهادته في الحقوق من جامعة دمشق سنة 1945، ومناصبه الدبلوماسية واستقالته سنة 1966، وديوانه الأول «قالت لي السمراء» (1942)، ومقتل زوجته بلقيس الراوي في تفجير سفارة العراق ببيروت سنة 1981، ووفاته في لندن في 30 أبريل 1998، وتسجّل وصيته أن يُدفن في دمشق. ولا يذكر متنها دينه."
  en: "English Wikipedia article on Nizar Qabbani; used for entity facts only. It gives his birth at Damascus on 22 March 1923 (its lead and infobox; the Arabic and Urdu articles and Wikidata give 21 March), his law degree from Damascus University in 1945, his diplomatic postings and resignation in 1966, his first collection 'The Brunette Told Me' (1942), the killing of his wife Balqis al-Rawi in the 1981 Beirut embassy bombing, and his death at London on 30 April 1998, recording his wish to be buried in Damascus. It makes no statement of his religion."
  es: "Artículo de la Wikipedia en inglés sobre Nizar Qabbani; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Damasco el 22 de marzo de 1923 (su introducción y ficha informativa; los artículos en árabe y urdu, así como Wikidata, indican el 21 de marzo), su licenciatura en derecho por la Universidad de Damasco en 1945, sus destinos diplomáticos y su dimisión en 1966, su primera colección de poemas, «The Brunette Told Me» (1942), el asesinato de su esposa, Balqis al-Rawi, en el atentado con bomba contra la embajada de Beirut en 1981, y su fallecimiento en Londres el 30 de abril de 1998, donde expresó su deseo de ser enterrado en Damasco. No menciona su religión."
  fr: "L'article de Wikipédia en anglais consacré à Nizar Qabbani, utilisé uniquement pour les informations le concernant, indique sa naissance à Damas le 22 mars 1923 (son introduction et son infobox; les articles en arabe et en ourdou, ainsi que Wikidata, mentionnent le 21 mars), l'obtention de son diplôme de droit à l'université de Damas en 1945, ses affectations diplomatiques et sa démission en 1966, la publication de son premier recueil de nouvelles, « The Brunette Told Me » (1942), l'assassinat de son épouse, Balqis al-Rawi, lors de l'attentat contre l'ambassade de Beyrouth en 1981, et son décès à Londres le 30 avril 1998, pour lequel il a exprimé le souhait d'être inhumé à Damas. L'article ne mentionne pas sa religion."
  ur: "نزار قبانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 22 مارچ 1923 کو دمشق میں ہوئی ⁦(اس کا لیڈ اور انفو باکس؛ عربی اور اردو مضامین اور وکی ڈیٹا 21 مارچ کو دیتے ہیں)⁩، 1945 میں دمشق یونیورسٹی سے اس کی قانون کی ڈگری، اس کی سفارتی پوسٹنگ اور 1966 میں استعفیٰ، اس کا پہلا مجموعہ 'دی برونیٹ ٹولڈ می' (1942)، ان کی اہلیہ کا قتل۔ سفارت خانے پر بمباری، اور 30 اپریل 1998 کو لندن میں اس کی موت، دمشق میں دفن ہونے کی اپنی خواہش کو ریکارڈ کیا۔ اس میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Nizar Qabbani hakkında İngilizce Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 22 Mart 1923'te Şam'da doğması (giriş ve kutuda; Arapça ve Urduca makaleler ile Wikidata 21 Mart olarak veriyor), 1945'te Şam Üniversitesi'nden hukuk diploması, diplomatik görevleri ve 1966'daki istifası, ilk şiir kitabı \"Esmer Bana Söyledi\" (1942), 1981'de Beyrut'taki Irak büyükelçiliğinin bombalanmasında eşi Balqees Al-Rawi'nin öldürülmesi, 30 Nisan 1998'de Londra'da ölümü ve vasiyetinin Şam'da defnedildiği kaydedilmiştir. Dini metinde belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Nizar Qabbani hanya digunakan untuk fakta entitas tersebut. Kelahirannya di Damaskus pada 22 Maret 1923 (dalam pengantar dan kotak; sementara artikel Arab dan Urdu serta Wikidata mencantumkan 21 Maret), gelar hukumnya dari Universitas Damaskus pada 1945, posisi diplomatiknya dan pengunduran dirinya pada 1966, kumpulan puisi pertamanya \"The Brunette Told Me\" (1942), pembunuhan istrinya Balqees Al-Rawi dalam pengeboman kedutaan Irak di Beirut pada 1981, kematiannya di London pada 30 April 1998, dan wasiatnya tercatat dimakamkan di Damaskus. Agamanya tidak disebutkan dalam teks."
