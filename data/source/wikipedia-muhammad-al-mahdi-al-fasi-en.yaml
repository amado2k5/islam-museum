  ar: "مقالة ويكيبيديا الإنجليزية عن محمد المهدي الفاسي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه صوفي (mystic) معروف وكاتب سير ومؤرخ من فاس، وتذكر ميلاده بالقصر الكبير في 17 أيار 1624 ووفاته في 20 شباط 1698 ودفنه في ضريح جده الأكبر أبي المحاسن يوسف الفاسي ومؤلفاته."
  en: "English Wikipedia article on Mohammed al-Mahdi al-Fasi; used for entity facts only. It describes him as a well-known mystic, biographer and historian from Fes, gives his birth at Ksar al-Kebir on 17 May 1624, his death on 20 February 1698, his burial in the mausoleum of his great-grandfather Abu al-Mahasin Yusuf al-Fasi, and lists his works on Sufism and biography."
