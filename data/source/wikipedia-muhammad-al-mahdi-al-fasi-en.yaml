summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد المهدي الفاسي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه صوفي (mystic) معروف وكاتب سير ومؤرخ من فاس، وتذكر ميلاده بالقصر الكبير في 17 أيار 1624 ووفاته في 20 شباط 1698 ودفنه في ضريح جده الأكبر أبي المحاسن يوسف الفاسي ومؤلفاته."
  en: "English Wikipedia article on Mohammed al-Mahdi al-Fasi; used for entity facts only. It describes him as a well-known mystic, biographer and historian from Fes, gives his birth at Ksar al-Kebir on 17 May 1624, his death on 20 February 1698, his burial in the mausoleum of his great-grandfather Abu al-Mahasin Yusuf al-Fasi, and lists his works on Sufism and biography."
  es: "Artículo de la Wikipedia en inglés sobre Mohammed al-Mahdi al-Fasi; utilizado únicamente para datos sobre la persona. Lo describe como un conocido místico, biógrafo e historiador de Fez, indica su nacimiento en Ksar al-Kebir el 17 de mayo de 1624, su muerte el 20 de febrero de 1698, su entierro en el mausoleo de su bisabuelo Abu al-Mahasin Yusuf al-Fasi, y enumera sus obras sobre el sufismo y su biografía."
  fr: "Article de Wikipédia en anglais sur Mohammed al-Mahdi al-Fasi; utilisé uniquement à des fins d’information sur l’entité. Il le décrit comme un mystique, biographe et historien renommé de Fès, indique sa naissance à Ksar al-Kebir le 17 mai 1624, sa mort le 20 février 1698, son inhumation dans le mausolée de son arrière-grand-père Abu al-Mahasin Yusuf al-Fasi, et énumère ses ouvrages sur le soufisme et sa biographie."
  ur: "محمد المہدی الفاسی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں انہیں فیس کے ایک معروف صوفیانہ، سوانح نگار اور مورخ کے طور پر بیان کیا گیا ہے، ان کی پیدائش 17 مئی 1624 کو کسر الکبیر میں ہوئی، ان کی وفات 20 فروری 1698 کو ہوئی، ان کی تدفین ان کے پردادا ابو المحسین یوسف الفاسی کے مقبرے میں ہوئی، اور تصوف پر ان کے کاموں کی فہرست۔"
