summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زين العابدين الكبير؛ تُستخدم لوقائع الكيان فقط. تذكر مولده نحو سنة 1401 في سريناغار ابنًا ثانيًا لإسكندر شاه وميرا خاتون، وسنواته في سمرقند، وحكمه في 1418–1419 و1420–1470، ووفاته في 12 مايو 1470 (بالتقويم اليولياني) في نوشهر ودفنه في مزار السلاطين، وإلغاءه الجزية وسياساته المتسامحة، ودار ترجمته وحرفيّيه؛ صندوق معلوماتها يذكر «إسلام سنّي» مع ملاحظة تسمّي المدرسة الحنفية، ولا تسمّي متنها له مذهبًا."
  en: "English Wikipedia article on Zayn al-Abidin the Great; used for entity facts only. It gives his birth c. 1401 at Srinagar as second son of Sikandar Shah and Mira Khatun, his years in Samarkand, his reigns of 1418–1419 and 1420–1470, his death on 12 May 1470 (Julian calendar) at Naushahr and burial at Mazar-e-Salatin, his abolition of the jizya and tolerant policies, his translation bureau and crafts. Its infobox gives Sunni Islam with a note naming the Hanafi school of jurisprudence; the article's prose names no school for him."
