summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زين العابدين الكبير؛ تُستخدم لوقائع الكيان فقط. تذكر مولده نحو سنة 1401 في سريناغار ابنًا ثانيًا لإسكندر شاه وميرا خاتون، وسنواته في سمرقند، وحكمه في 1418–1419 و1420–1470، ووفاته في 12 مايو 1470 ⁦(بالتقويم اليولياني)⁩ في نوشهر ودفنه في مزار السلاطين، وإلغاءه الجزية وسياساته المتسامحة، ودار ترجمته وحرفيّيه؛ صندوق معلوماتها يذكر «إسلام سنّي» مع ملاحظة تسمّي المدرسة الحنفية، ولا تسمّي متنها له مذهبًا."
  en: "English Wikipedia article on Zayn al-Abidin the Great; used for entity facts only. It gives his birth c. 1401 at Srinagar as second son of Sikandar Shah and Mira Khatun, his years in Samarkand, his reigns of 1418–1419 and 1420–1470, his death on 12 May 1470 (Julian calendar) at Naushahr and burial at Mazar-e-Salatin, his abolition of the jizya and tolerant policies, his translation bureau and crafts. Its infobox gives Sunni Islam with a note naming the Hanafi school of jurisprudence; the article's prose names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Zayn al-Abidin el Grande; utilizado únicamente para datos sobre la persona. Indica su nacimiento alrededor de 1401 en Srinagar como segundo hijo de Sikandar Shah y Mira Khatun, sus años en Samarcanda, sus reinados de 1418-1419 y 1420-1470, su muerte el 12 de mayo de 1470 (calendario juliano) en Naushahr y su entierro en Mazar-e-Salatin, su abolición de la jizya y sus políticas de tolerancia, su oficina de traducción y sus oficios. Su ficha informativa indica que se trata del islam sunita, con una nota que menciona la escuela jurídica Hanafi; el texto del artículo no menciona ninguna escuela para él."
  fr: "L'article de Wikipédia en anglais consacré à Zayn al-Abidin le Grand, utilisé uniquement pour les informations le concernant, indique sa naissance vers 1401 à Srinagar, second fils de Sikandar Shah et de Mira Khatun, ses années à Samarcande, ses règnes de 1418 à 1419 et de 1420 à 1470, sa mort le 12 mai 1470 (calendrier julien) à Naushahr et son inhumation au Mazar-e-Salatin, l'abolition de la jizya et sa politique de tolérance, ainsi que son bureau de traduction et ses activités artisanales. L'infobox mentionne l'islam sunnite et cite l'école de jurisprudence hanafite; le texte de l'article ne précise toutefois pas son appartenance à une école de pensée."
  ur: "زین العابدین عظیم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش c. سکندر شاہ اور میرا خاتون کے دوسرے بیٹے کے طور پر سری نگر میں 1401، سمرقند میں اس کے سال، اس کے دور حکومت 1418-1419 اور 1420-1470، ان کی وفات 12 مئی 1470 ⁦(جولین کیلنڈر)⁩ کو نوشہر میں اور مزارِ صالطین میں تدفین، ان کی پالیسیوں کا ترجمہ بیورو اور دستکاری. اس کا معلوماتی باکس سنی اسلام کو ایک نوٹ کے ساتھ دیتا ہے جس کا نام حنفی مکتبہ فقہ ہے۔ مضمون کے نثر میں اس کے لیے کوئی اسکول نہیں ہے۔"
  tr: "Zeyn el-Edidin Büyük hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Yaklaşık 1401 yılında Srinagar'da doğduğundan, İskender Şah ve Mira Hatun'un ikinci oğlu olarak, Semerkant'taki yıllarından, 1418–1419 ve 1420–1470 yıllarındaki hükümdarlığından, 12 Mayıs 1470'te (Jülyen takvimi) Nowshahr'da ölümünden, sultanların türbesine defnedilmesinden, cizye'nin kaldırılmasından ve hoşgörülü politikalarından, çeviri evinden ve mektuplarından bahsedilmektedir; bilgi kutusunda 'Sünni İslam' adı ve Hanefi okulu olarak adlandırıldığı not vardır, ancak onun düşünce okulunun adını vermemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Zain al-Abidin yang Agung; digunakan hanya untuk fakta entitas tersebut. Artikel ini menyebutkan kelahirannya sekitar tahun 1401 di Srinagar, putra kedua Iskandar Shah dan Mira Khatun, tahun-tahunnya di Samarkand, pemerintahannya pada 1418–1419 dan 1420–1470, kematiannya pada 12 Mei 1470 (kalender Julian) di Nowshahr, pemakamannya di makam sultan, penghapusan jizya dan kebijakan tolerannya, rumah terjemahannya dan surat-suratnya; kotak infobox menyebutkan 'Islam Sunni' dengan catatan bahwa sekolah ini disebut aliran Hanafi, tetapi tidak menyebutkan aliran pemikirannya."
