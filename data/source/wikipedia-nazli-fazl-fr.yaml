reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born at Constantinople in 1853, eldest daughter of Prince Mustafa Fazıl Pasha and Dilazad Khanum; raised in Egypt until 1866, then educated at Constantinople; spoke Turkish, Arabic, French, English, Italian and German; married the diplomat Khalil Bey (Khalil Sherif Pasha) in 1872, widowed 1879, and settled at the Villa Henry near Abdeen Palace, where her salon gathered Abduh, Zaghloul, Qasim Amin, Lord Cromer and Lord Kitchener; Lucie Delarue-Mardrus's 1904 account of an evening there; her remarriage in 1898 (the English article dates the marriage 22 April 1900) to Khelil Bouhageb and settlement at La Marsa near Tunis, her salon there receiving Young Tunisian reformers such as Ali Bach Hamba; honorary president of the Muslim Sports Society of Tunisia from 1906 to 1913; death by cardiac arrest at Cairo on 12 December 1913 (the English article and Wikidata give 28 December 1913); burial in the Fazıl mausoleum by the Imam al-Shafi'i mosque, Cairo. It states nothing about her religion or school."
