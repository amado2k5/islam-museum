reliability_note: "Read in the museum's session on 20 November 2026. It gives his name, birth in 343 (954) at Isfahan, residence at Baghdad under the Buyids and death in 412 (1021); says reports about him in the sources are few, that dates of birth and death are disputed and that Muhammad Adnan al-Jawhari fixed them as 343-412 AH from a date he found on a manuscript of al-Mufradat; that the epistle al-I'tiqadat attributed to him shows him Sunni in creed; and that his works show he did not follow one legal school but reasoned from the evidence, while quoting Abu Hanifa and al-Shafi'i in his exegesis. The museum treats the creed statement as resting on this source and the attribution of that epistle. Used for entity facts only."
