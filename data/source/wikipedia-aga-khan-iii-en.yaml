summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن آغا خان الثالث، السلطان محمد شاه (1877-1957)، الإمام الثامن والأربعين للنزارية الإسماعيلية؛ يذكر صندوق معلوماتها أن دينه هو الإسلام الشيعي ومذهبه الإسماعيلية ومدرسته النزارية الإسماعيلية، وتسرد سيرته السياسية والدينية."
  en: "English Wikipedia article on Aga Khan III, Sultan Muhammad Shah (1877–1957), 48th Imam of the Nizari Ismailis; its infobox gives his religion as Shia Islam, his denomination as Isma'ilism and his school as Nizari Ismaili, and the article sets out his political and religious career."
  es: "Artículo de la Wikipedia en inglés sobre Aga Khan III, Sultan Muhammad Shah (1877-1957), 48.º imán de los ismaelitas nizaríes; su ficha informativa indica que su religión era el islam chiíta, su denominación el ismaelismo y su escuela el ismaelita nizarí, y el artículo expone su trayectoria política y religiosa."
  fr: "Article de Wikipédia en anglais sur Aga Khan III, Sultan Muhammad Shah (1877–1957), 48e imam des Nizari Ismailis; son infobox indique que sa religion est l'islam chiite, sa dénomination l'ismaélisme et son école l'ismaélisme nizari, et l'article décrit sa carrière politique et religieuse."
  ur: "آغا خان III، سلطان محمد شاہ (1877–1957)، نظری اسماعیلیوں کے 48ویں امام پر انگریزی ویکیپیڈیا کا مضمون؛ اس کے معلوماتی خانے میں اس کا مذہب شیعہ اسلام، اس کا فرقہ اسماعیلیت اور اس کا مکتب نظری اسماعیلی بتایا گیا ہے، اور مضمون اس کے سیاسی اور مذہبی کیریئر کا تعین کرتا ہے۔"
