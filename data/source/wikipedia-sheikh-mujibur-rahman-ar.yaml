summary:
  ar: "مقالة ويكيبيديا العربية عن مجيب الرحمن؛ تُستخدم لوقائع الكيان فقط. تتفق مع المقالة الإنجليزية في مولده في 17 مارس 1920 ووفاته في دكا في 15 أغسطس 1975، ويعطي صندوق معلوماتها ديانتَه «أهل السنة والجماعة» مع علامة مرجع، دون أن يذكر متنها انتماءً شخصيًا له."
  en: "Arabic Wikipedia article on Mujibur Rahman; used for entity facts only. It agrees with the English article on his birth on 17 March 1920 and his death at Dhaka on 15 August 1975, and its infobox gives his religion as Ahl al-Sunna wa'l-Jama'a (Sunni) with a reference marker, while its text states no personal affiliation for him."
  es: "Artículo de Wikipedia en árabe sobre Mujibur Rahman; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento el 17 de marzo de 1920 y su muerte en Dhaka el 15 de agosto de 1975, y su ficha informativa indica que su religión era Ahl al-Sunna wa'l-Jama'a (suní) con un marcador de referencia, mientras que el texto no menciona ninguna afiliación personal."
  fr: "Article de Wikipédia en arabe sur Mujibur Rahman; utilisé uniquement pour les informations sur l'entité. Il concorde avec l'article en anglais concernant sa naissance le 17 mars 1920 et son décès à Dacca le 15 août 1975. Son infobox indique qu'il appartenait à la religion sunnite (Ahl al-Sunna wa'l-Jama'a) avec une référence, mais le texte ne mentionne aucune appartenance personnelle."
