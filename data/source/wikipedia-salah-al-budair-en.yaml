summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صلاح البدير؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 7 يناير 1970 بالهفوف (مستشهدة بموقع أهل المدينة)، وإمامته للمسجد النبوي من 1998، وإمامته للتراويح بالمسجد الحرام في 2005–2006، وقضاءه بمحكمة المدينة العليا، ودكتوراه سنة 2023 بجامعة الملك فيصل عن مصنّف لمؤلف حنفي؛ وصندوقها يعطي الدين الإسلام فقط وتصنّفه فئاتها في الأئمة السنة والعلماء السنة السعوديين."
  en: "English Wikipedia article on Salah Al-Budair; used for entity facts only. It gives his birth on 7 January 1970 at Hofuf (citing People of Madina), his imamate of the Prophet's Mosque from 1998, his Tarawih imamate at Masjid al-Haram in 2005–2006, his judgeship at the Medina High Court, and his 2023 doctorate at King Faisal University on a Hanafi author's compilation; its infobox gives religion Islam only and its categories file him among Sunni imams and Saudi Sunni clerics."
