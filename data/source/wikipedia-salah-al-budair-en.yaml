summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صلاح البدير؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 7 يناير 1970 بالهفوف ⁦(مستشهدة بموقع أهل المدينة)⁩، وإمامته للمسجد النبوي من 1998، وإمامته للتراويح بالمسجد الحرام في 2005–2006، وقضاءه بمحكمة المدينة العليا، ودكتوراه سنة 2023 بجامعة الملك فيصل عن مصنّف لمؤلف حنفي؛ وصندوقها يعطي الدين الإسلام فقط وتصنّفه فئاتها في الأئمة السنة والعلماء السنة السعوديين."
  en: "English Wikipedia article on Salah Al-Budair; used for entity facts only. It gives his birth on 7 January 1970 at Hofuf (citing People of Madina), his imamate of the Prophet's Mosque from 1998, his Tarawih imamate at Masjid al-Haram in 2005–2006, his judgeship at the Medina High Court, and his 2023 doctorate at King Faisal University on a Hanafi author's compilation; its infobox gives religion Islam only and its categories file him among Sunni imams and Saudi Sunni clerics."
  es: "Artículo de la Wikipedia en inglés sobre Salah Al-Budair; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 7 de enero de 1970 en Hofuf (citando a People of Madina), su imamato de la Mezquita del Profeta desde 1998, su imamato de Tarawih en Masjid al-Haram entre 2005 y 2006, su cargo como juez en el Tribunal Superior de Medina y su doctorado en 2023 en la Universidad Rey Faisal sobre una compilación de un autor hanafi; su ficha informativa solo indica que profesa el Islam y sus categorías lo clasifican entre los imanes sunitas y los clérigos sunitas saudíes."
  fr: "L'article de Wikipédia en anglais consacré à Salah Al-Budair, utilisé uniquement pour les informations le concernant, indique sa naissance le 7 janvier 1970 à Hofuf (d'après les habitants de Médine), son imamat de la Mosquée du Prophète à partir de 1998, son imamat des prières de Tarawih à la Masjid al-Haram en 2005-2006, sa fonction de juge à la Haute Cour de Médine et son doctorat obtenu en 2023 à l'Université du Roi Faisal pour une compilation d'un auteur hanafite. Son infobox mentionne uniquement l'islam comme religion et ses catégories le classent parmi les imams sunnites et les religieux sunnites saoudiens."
  ur: "صلاح البدیر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 7 جنوری 1970 کو ہوفوف میں ہوئی ⁦(مدینہ کے لوگوں کا حوالہ دیتے ہوئے)⁩، 1998 سے مسجد نبوی کی امامت، 2005-2006 میں مسجد الحرام میں ان کی تراویح امامت، مدینہ ہائی کورٹ میں جج شپ، اور 2023 میں شاہ فیصل یونیورسٹی میں ڈاکٹریٹ کی ڈگری اس کا معلوماتی باکس صرف مذہب اسلام دیتا ہے اور اس کے زمرے اسے سنی اماموں اور سعودی سنی علما میں درج کرتے ہیں۔"
  tr: "Salah al-Badair hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 7 Ocak 1970'te Al-Hofuf'ta doğduğundan (Ahl al-Medina web sitesinde alıntılanmıştır), 1998'de Peygamber Camii imamitliğinden, 2005–2006 yıllarında Mescid'deki teravih namaz imaminden, Medine Yüksek Mahkemesi'ndeki yargısından ve 2023'te Hanefi bir yazar tarafından derlenen Kral Faysal Üniversitesi'nde doktorasından bahsedilmektedir; fonu sadece İslam'ı sağlar ve onu Sünni imamlar ile Suudi Sünni alimler arasında sınıflandırır."
  id: "Artikel Wikipedia bahasa Inggris tentang Salah Al-Badair; digunakan hanya untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya pada 7 Januari 1970 di Al-Hofuf (dikutip di situs Ahl al-Madina), imamannya Masjid Nabi dari tahun 1998, imaman shalat Taraweeh di Masjid Agung pada tahun 2005–2006, masa peradilannya di Mahkamah Agung Madinah, dan gelar doktornya pada tahun 2023 di Universitas King Faisal untuk kompilasi oleh penulis Hanafi; dana tersebut hanya memberikan Islam dan mengklasifikasikannya di antara kategori imam Sunni dan ulama Sunni Saudi."
