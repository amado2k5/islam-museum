summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد نبي ⁦(مواليد 1985)⁩، لاعب الكريكت الأفغاني؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في لوكر في 1 يناير 1985 مع التنبيه إلى أن كريكت أركايف وسكاي سبورتس تذكران 7 مارس 1985، ودوره في صعود أفغانستان إلى أول مباراة ليوم واحد سنة 2009 وأول اختبار سنة 2018، وقيادته الفريق في كأس آسيا 2014 وكأس العالم 2015، وكونه أول أفغاني يُشترى في مزاد الدوري الهندي الممتاز، وأول رامٍ أفغاني يبلغ 100 ويكيت في مباريات اليوم الواحد."
  en: "English Wikipedia article on Mohammad Nabi (born 1985), the Afghan cricketer; used for entity facts only. It records his birth in Logar on 1 January 1985, noting that CricketArchive and Sky Sports give 7 March 1985, his role in Afghanistan's rise to their first ODI in 2009 and first Test in 2018, his captaincy at the 2014 Asia Cup and 2015 World Cup, his standing as the first Afghan bought in the IPL auction, and as the first Afghan bowler to 100 ODI wickets."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Nabi (nacido en 1985), el jugador de críquet afgano; utilizado únicamente para datos de la entidad. Registra su nacimiento en Logar el 1 de enero de 1985, señalando que CricketArchive y Sky Sports indican el 7 de marzo de 1985, su papel en el ascenso de Afganistán a su primer ODI en 2009 y su primer Test en 2018, su capitanía en la Copa Asia de 2014 y la Copa Mundial de 2015, su condición de primer afgano comprado en la subasta de la IPL y como el primer lanzador afgano en alcanzar los 100 wickets en ODI."
  fr: "Article de Wikipédia en anglais sur Mohammad Nabi (né en 1985), le joueur de cricket afghan; utilisé uniquement à des fins d'information sur l'entité. Il indique sa naissance à Logar le 1er janvier 1985, notant que CricketArchive et Sky Sports donnent le 7 mars 1985, son rôle dans la qualification de l'Afghanistan pour son premier ODI en 2009 et son premier test en 2018, son capitanat lors de la Coupe d'Asie 2014 et de la Coupe du monde 2015, son statut de premier Afghan acheté lors de la vente aux enchères de l'IPL, et de premier lanceur afghan à atteindre 100 guichets en ODI."
  ur: "افغان کرکٹر محمد نبی ⁦(پیدائش 1985)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 1 جنوری 1985 کو لوگر میں ریکارڈ کی گئی ہے، یہ نوٹ کرتے ہوئے کہ کرکٹ آرکائیو اور اسکائی اسپورٹس نے 7 مارچ 1985 کو دیا، 2009 میں ان کے پہلے ون ڈے اور 2018 میں پہلے ٹیسٹ میں افغانستان کے عروج میں ان کا کردار، 2014 کے ایشیا کپ اور 2015 ورلڈ کپ میں ان کی کپتانی، پہلی افغان باؤلر کے طور پر آئی پی ایل میں ان کا پہلا باؤلنگ اور افغان باؤلر کے طور پر کھڑا ہونا۔ ون ڈے میں 100 وکٹیں"
  tr: "Mohammad Nabi (d. 1985), Afgan kriketçisi hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılmıştır. 1 Ocak 1985'te Locker'da doğdu ve Cricket Archive ile Sky Sports'un 7 Mart 1985'ten, Afganistan'ın 2009'daki ilk tek günlük maça ve 2018'deki ilk Test'e yükselmedeki rolünden, 2014 Asya Kupası ve 2015 Dünya Kupası'ndaki kaptanlığından, Hindistan Premier Ligi açık artırmasında satın alınan ilk Afgan ve 100 tek günlük wicket'e ulaşan ilk Afgan olduğundan bahsettiğini belirtti."
  id: "Artikel Wikipedia bahasa Inggris tentang Mohammad Nabi (lahir 1985), pemain kriket Afghanistan; hanya digunakan untuk fakta entitas. Ia lahir di Locker pada 1 Januari 1985, mencatat bahwa Cricket Archive dan Sky Sports menyebutkan 7 Maret 1985, perannya dalam promosi Afghanistan ke pertandingan satu hari pertama pada 2009 dan Test pertama pada 2018, kepemimpinannya di Piala Asia 2014 dan Piala Dunia 2015, menjadi pemain Afghanistan pertama yang dibeli dalam lelang Indian Premier League, dan Afghanistan pertama yang mencapai 100 wicket satu hari."
