summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد نبي (مواليد 1985)، لاعب الكريكت الأفغاني؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في لوكر في 1 يناير 1985 مع التنبيه إلى أن كريكت أركايف وسكاي سبورتس تذكران 7 مارس 1985، ودوره في صعود أفغانستان إلى أول مباراة ليوم واحد سنة 2009 وأول اختبار سنة 2018، وقيادته الفريق في كأس آسيا 2014 وكأس العالم 2015، وكونه أول أفغاني يُشترى في مزاد الدوري الهندي الممتاز، وأول رامٍ أفغاني يبلغ 100 ويكيت في مباريات اليوم الواحد."
  en: "English Wikipedia article on Mohammad Nabi (born 1985), the Afghan cricketer; used for entity facts only. It records his birth in Logar on 1 January 1985, noting that CricketArchive and Sky Sports give 7 March 1985, his role in Afghanistan's rise to their first ODI in 2009 and first Test in 2018, his captaincy at the 2014 Asia Cup and 2015 World Cup, his standing as the first Afghan bought in the IPL auction, and as the first Afghan bowler to 100 ODI wickets."
