reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. The article's infobox dates are empty; its categories file him under 1916 births and 1995 deaths, agreeing with the English article's years, and its succession boxes give his chief ministership (1951–1953, preceded by Iftikhar Hussain Khan Mamdot, followed by Feroz Khan Noon) and his defence ministry (1957, preceded by Huseyn Shaheed Suhrawardy, followed by Feroz Khan Noon). Its body is a history of the Johiya clan, including the tradition that the clan's forebears accepted Islam at the hand of Baba Farid — clan ancestry, not an attestation of Daultana's own school — and its infobox 'known for' line describes his part in the 1953 Lahore street protests as chief minister, a political act. It names no school for him."
