summary:
  ar: "مقالة ويكيبيديا الأردية عن ممتاز دولتانة؛ تُستخدم لوقائع الكيان فقط. هي في معظمها تاريخ لقبيلة جوئية التي ينتمي إليها آل دولتانة، وتفهرسه في مواليد 1916 ووفيات 1995 وزيرًا للدفاع ورئيس وزراء للبنجاب."
  en: "Urdu Wikipedia article on Mumtaz Daultana; used for entity facts only. It is mostly a history of the Johiya clan to which the Daultanas belong, filing him under 1916 births, 1995 deaths, defence ministers and chief ministers of Punjab."
  es: "Artículo de Wikipedia en urdu sobre Mumtaz Daultana; se utiliza únicamente para obtener información sobre la persona. Se trata principalmente de una historia del clan Johiya, al que pertenecen los Daultana, y lo ubica entre los nacimientos de 1916, las muertes de 1995, los ministros de defensa y los primeros ministros de Punjab."
  fr: "Article de Wikipédia en ourdou sur Mumtaz Daultana; utilisé uniquement à des fins d'information sur l'entité. Il retrace principalement l'histoire du clan Johiya auquel appartiennent les Daultana, en le classant parmi les naissances de 1916, les décès de 1995, ainsi que ses fonctions de ministre de la Défense et de ministre en chef du Pendjab."
  ur: "ممتاز دولتانہ پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ زیادہ تر جوہیا قبیلے کی تاریخ ہے جس سے دولتانہ تعلق رکھتے ہیں، انہیں 1916 کی پیدائش، 1995 کی اموات، وزیر دفاع اور پنجاب کے وزیراعلیٰ کے تحت درج کیا گیا ہے۔"
  tr: "Mumtaz Daultana hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Çoğunlukla Daulatana'nın mensup olduğu Joi kabilesinin tarihini içerir ve onu 1916'da Savunma Bakanı ve Pencap Başbakanı olarak listeler, 1995'te ölmüştür."
  id: "Artikel Wikipedia Urdu tentang Mumtaz Daultana; digunakan hanya untuk fakta entitas. Sebagian besar merupakan sejarah suku Joi tempat Daulatana berasal, dan mencantumkannya sebagai Menteri Pertahanan dan Perdana Menteri Punjab pada tahun 1916 dan meninggal pada tahun 1995."
