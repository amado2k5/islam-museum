summary:
  ar: "مقال في موقع إسلام أون لاين يسأل هل تدل آية سورة الشورى على وجود دواب في غير الأرض، ويجيب بأن الأمر متروك للبحث العقلي وأنه ليس من العقيدة."
  en: "An article on IslamOnline asking whether a verse of Surat al-Shura points to creatures beyond the earth, answering that the matter is left to rational inquiry and is not a point of creed."
  es: "Un artículo en IslamOnline pregunta si un versículo de la Sura al-Shura apunta a criaturas más allá de la tierra, respondiendo que el asunto se deja a la investigación racional y no es una cuestión de credo."
  fr: "Un article sur IslamOnline se demande si un verset de la sourate al-Shura fait référence à des créatures au-delà de la terre, et répond que la question relève de l'examen rationnel et n'est pas un point de croyance."
  ur: "اسلام آن لائن پر ایک مضمون جس میں پوچھا گیا کہ کیا سورۃ الشوری کی کوئی آیت زمین سے باہر مخلوقات کی طرف اشارہ کرتی ہے، اس کا جواب ہے کہ معاملہ عقلی تحقیقات پر چھوڑ دیا گیا ہے اور یہ عقیدہ نہیں ہے۔"
  tr: "Islam Online'da yayımlanan bir makale, Ash-Şura suresinin yeryüzünün dışındaki hayvanların varlığını gösterip göstermediğini sorar ve bu konunun mantıklı araştırmaya bırakıldığını, inancın bir parçası olmadığını belirtir."
  id: "Sebuah artikel di Islam Online menanyakan apakah ayat Surah Ash-Shura menunjukkan keberadaan hewan di luar bumi, dan menjawab bahwa masalah tersebut diserahkan kepada penelitian rasional dan bukan bagian dari kredo."
