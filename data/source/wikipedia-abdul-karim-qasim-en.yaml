  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الكريم قاسم، رئيس وزراء العراق 1958–1963؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 21 نوفمبر 1914 في بغداد وإعدامه في 9 فبراير 1963 في بغداد، وتصف أبويه بأن أباه عربي سني وأمه كردية شيعية، وهو تأطير أسري لا يسمّي مذهب قاسم نفسه."
  en: "English Wikipedia article on Abdul-Karim Qasim, prime minister of Iraq 1958–1963; used for entity facts only. It gives his birth on 21 November 1914 at Baghdad and his execution on 9 February 1963 at Baghdad. Citing Uriel Dann, it describes his father as a Sunni Arab and his mother as a Shia Kurd, and Qasim himself as of mixed Sunni-Shia parentage — family framing that names no school of Qasim's own."
