summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الكريم قاسم، رئيس وزراء العراق 1958–1963؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 21 نوفمبر 1914 في بغداد وإعدامه في 9 فبراير 1963 في بغداد، وتصف أبويه بأن أباه عربي سني وأمه كردية شيعية، وهو تأطير أسري لا يسمّي مذهب قاسم نفسه."
  en: "English Wikipedia article on Abdul-Karim Qasim, prime minister of Iraq 1958–1963; used for entity facts only. It gives his birth on 21 November 1914 at Baghdad and his execution on 9 February 1963 at Baghdad. Citing Uriel Dann, it describes his father as a Sunni Arab and his mother as a Shia Kurd, and Qasim himself as of mixed Sunni-Shia parentage — family framing that names no school of Qasim's own."
  es: "Artículo de la Wikipedia en inglés sobre Abdul-Karim Qasim, primer ministro de Irak entre 1958 y 1963; utilizado únicamente para datos sobre su persona. Indica que nació el 21 de noviembre de 1914 en Bagdad y que fue ejecutado el 9 de febrero de 1963 en la misma ciudad. Citando a Uriel Dann, describe a su padre como árabe suní y a su madre como kurda chií, y al propio Qasim como de ascendencia mixta suní-chií; esta descripción familiar no menciona ninguna escuela religiosa específica de Qasim."
  fr: "L'article de Wikipédia en anglais consacré à Abdul-Karim Qasim, Premier ministre d'Irak de 1958 à 1963, est utilisé uniquement à titre informatif. Il indique sa naissance le 21 novembre 1914 à Bagdad et son exécution le 9 février 1963 dans la même ville. Citant Uriel Dann, l'article décrit son père comme un Arabe sunnite et sa mère comme une Kurde chiite, et Qasim lui-même comme étant d'origine sunnite et chiite – une présentation de sa famille qui ne mentionne aucune école religieuse à laquelle il aurait appartenu."
  ur: "عبدالکریم قاسم پر انگریزی ویکیپیڈیا کا مضمون، عراق کے وزیر اعظم 1958-1963؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 21 نومبر 1914 کو بغداد میں ان کی پیدائش اور 9 فروری 1963 کو بغداد میں ان کی پھانسی کی خبر دیتا ہے۔ Uriel Dann کا حوالہ دیتے ہوئے، یہ اس کے والد کو ایک سنی عرب اور اس کی ماں کو شیعہ کرد کے طور پر بیان کرتا ہے، اور قاسم خود کو مخلوط سنی-شیعہ والدین کے طور پر بیان کرتا ہے - خاندان کی تشکیل جس میں قاسم کے اپنے کسی اسکول کا نام نہیں ہے۔"
  tr: "1958–1963 Irak Başbakanı Abdul Kerim Qasim hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 21 Kasım 1914'te Bağdat'ta ve 9 Şubat 1963'te Bağdat'ta idam edildiğini anlatır. Ailesi babasını Sünni Arap, annesini ise Şii Kürt olarak tanımlar; bu aile yetiştirilme tarzı kendisini Qasım'ın mezhebi olarak tanımlamaz."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdul Karim Qasim, Perdana Menteri Irak 1958–1963; hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada 21 November 1914 di Baghdad, dan eksekusinya pada 9 Februari 1963 di Baghdad. Orang tuanya menggambarkan ayahnya sebagai Arab Sunni dan ibunya sebagai Kurdi Syiah, sebuah keluarga yang tidak menyebut dirinya sebagai sekte Qasim."
