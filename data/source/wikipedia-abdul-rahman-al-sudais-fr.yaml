summary:
  ar: "مقالة ويكيبيديا الفرنسية عن عبد الرحمن السديس؛ تُستخدم لوقائع الكيان فقط. صندوقها يعطي مولده في 22 نوفمبر 1962 بالبكيرية ودينه «الإسلام السني»، بينما يقول نصها إنه وُلد في 10 فبراير 1960 بالرياض، فهي منقسمة داخليا بين الروايتين."
  en: "French Wikipedia article on Abdul Rahman Al-Sudais; used for entity facts only. Its infobox gives his birth on 22 November 1962 at Al-Bukayriyah and his religion as Sunni Islam, while its lead text says he was born on 10 February 1960 at Riyadh: the article is internally split between the two birth traditions."
  es: "Artículo de la Wikipedia en francés sobre Abdul Rahman Al-Sudais; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació el 22 de noviembre de 1962 en Al-Bukayriyah y que su religión era el islam sunita, mientras que el texto principal afirma que nació el 10 de febrero de 1960 en Riad: el artículo presenta discrepancias entre ambas versiones sobre su fecha de nacimiento."
  fr: "L'article de Wikipédia en français sur Abdul Rahman Al-Sudais, utilisé uniquement pour les informations sur l'entité, présente une infobox indiquant sa naissance le 22 novembre 1962 à Al-Bukayriyah et sa religion comme étant l'islam sunnite, tandis que son texte principal mentionne sa naissance le 10 février 1960 à Riyad: l'article est en effet divisé entre ces deux traditions de naissance."
  ur: "عبدالرحمن السدیس پر فرانسیسی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی خانہ 22 نومبر 1962 کو البوکریہ میں اس کی پیدائش اور اس کا مذہب بطور سنی اسلام دیتا ہے، جب کہ اس کا مرکزی متن کہتا ہے کہ وہ 10 فروری 1960 کو ریاض میں پیدا ہوا: مضمون اندرونی طور پر دو پیدائشی روایات کے درمیان تقسیم ہے۔"
  tr: "Abdul Rahman Al-Sudais hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kutusunda 22 Kasım 1962'de Al-Bukayriyah'da doğduğu yazılır ve dini \"Sünni İslam\"dır; metinde ise 10 Şubat 1960'ta Riyad'da doğduğu belirtilir, bu nedenle iki anlatı arasında içsel olarak bölünmüştür."
  id: "Artikel Wikipedia Prancis tentang Abdul Rahman Al-Sudais; digunakan hanya untuk fakta entitas tersebut. Kotaknya mencantumkan kelahirannya pada 22 November 1962 di Al-Bukayriyah, dan agamanya adalah \"Islam Sunni,\" sementara teksnya menyatakan bahwa dia lahir pada 10 Februari 1960 di Riyadh, sehingga secara internal terbagi antara kedua narasi tersebut."
