summary:
  ar: "مقالة ويكيبيديا الإنجليزية ⁦(بعنوان «Ezzaki Badou»)⁩ عن بادو الزاكي؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته حارساً في سلا والوداد ومايوركا والفتح، وجائزة أفضل لاعب أفريقي 1986، ومونديال 1986، ومسيرته التدريبية الطويلة حتى توليه منتخب الأردن سنة 2026."
  en: "English Wikipedia article (titled 'Ezzaki Badou') on Badou Zaki; used for entity facts only. It recounts his goalkeeping career at AS Salé, Wydad, Mallorca and FUS Rabat, the 1986 African Footballer of the Year award, the 1986 World Cup, and his long coaching career through to the Jordan appointment of 2026."
  es: "Artículo de la Wikipedia en inglés (titulado «Ezzaki Badou») sobre Badou Zaki; utilizado únicamente para obtener información sobre la persona. Narra su trayectoria como portero en el AS Salé, Wydad, Mallorca y FUS Rabat, el premio al Futbolista Africano del Año de 1986, la Copa Mundial de 1986 y su larga carrera como entrenador hasta su nombramiento en Jordania en 2026."
  fr: "Article de Wikipédia en anglais (intitulé « Ezzaki Badou ») consacré à Badou Zaki; utilisé uniquement à des fins d'information sur l'entité. Il retrace sa carrière de gardien de but à l'AS Salé, au Wydad, à Majorque et au FUS Rabat, son titre de Ballon d'Or africain en 1986, la Coupe du monde de 1986 et sa longue carrière d'entraîneur jusqu'à sa nomination à la tête de l'équipe nationale jordanienne en 2026."
  ur: "بدو زکی پر انگریزی ویکیپیڈیا مضمون ⁦(عنوان 'ایزاکی بدو')⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں AS Salé، Wydad، Mallorca اور FUS Rabat میں ان کے گول کیپنگ کیریئر، 1986 کے افریقی فٹ بالر آف دی ایئر کا ایوارڈ، 1986 ورلڈ کپ، اور 2026 کی اردن تقرری تک ان کے طویل کوچنگ کیریئر کا ذکر ہے۔"
