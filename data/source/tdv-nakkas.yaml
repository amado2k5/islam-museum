summary:
  ar: "مدخل «نقّاش» في موسوعة TDV الإسلامية لنبي بوزكورت: صنعة النقّاش رسّاماً ومذهّباً ونقّاش زخارف، وأسماء النقّاشين بحسب موادّهم، وورشات هراة وتبريز وإسفهان، ونقّاشو البابور الهنود، وجماعة نقّاشان في تنظيم أهل الحرف العثماني بأقسامها ومرتّباتها ورؤسائها."
  en: "The TDV İslâm Ansiklopedisi entry on nakkāş by Nebi Bozkurt: the craft of the painter-decorator in its many branches, the craftsmen's names by their materials, the workshops of Herat, Tabriz and Isfahan, the Mughal painters, and the Ottoman nakkāşān corps inside the ehl-i hiref organisation with its divisions, wage registers and chiefs."
  es: "La entrada de Nebi Bozkurt en la TDV İslâm Ansiklopedisi sobre nakkāş describe el oficio del pintor-decorador en sus múltiples ramas, los nombres de los artesanos según sus materiales, los talleres de Herat, Tabriz e Isfahán, los pintores mogoles y el cuerpo otomano de nakkāşān dentro de la organización ehl-i hiref con sus divisiones, registros salariales y jefes."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur le nakkāş par Nebi Bozkurt: le métier de peintre-décorateur dans ses nombreuses branches, les noms des artisans selon leurs matériaux, les ateliers d'Hérat, de Tabriz et d'Ispahan, les peintres moghols et le corps ottoman des nakkāşān au sein de l'organisation ehl-i hiref avec ses divisions, ses registres de salaires et ses chefs."
  ur: "TDV İslâm Ansiklopedisi entry on nakkāş by Nebi Bozkurt: پینٹر ڈیکوریٹر کا دستکاری اس کی بہت سی شاخوں میں، کاریگروں کے نام ان کے مواد کے لحاظ سے، ہرات، تبریز اور اصفہان کی ورکشاپس، مغل مصوروں، اور عثمانی نقشہ ہائر کی تنظیم کے اندر۔ اجرت کے رجسٹر اور سربراہان۔"
  tr: "TDV İslami Ansiklopedisi Nabi Buzkurt'ta \"Neqaş\"a Giriş: Neqqaş'ın ressam olarak zanaatları, doktrin ve dekoratif gravür, gravürcülerin konularına göre isimleri, Herat, Tebriz ve İsfahan'ın atölyeleri, Hint Babur gravürcüleri ve Osmanlı zanaatkârlarının bölümleri, rütbeleri ve başlarıyla organizasyonunda bir grup Nekaşkaş."
  id: "Pengantar \"Naqqash\" dalam Ensiklopedia Islam TDV karya Nabi Buzkurt: Kerajinan Naqqash sebagai pelukis, doktrin, dan ukiran dekoratif, nama-nama pengukir sesuai subjek mereka, bengkel Herat, Tabriz, dan Isfahan, pengukir Babur India, serta kelompok Naqashqash dalam organisasi pengrajin Ottoman dengan departemen, pangkat, dan kepala mereka."
