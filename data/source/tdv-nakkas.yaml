summary:
  ar: "مدخل «نقّاش» في موسوعة TDV الإسلامية لنبي بوزكورت: صنعة النقّاش رسّاماً ومذهّباً ونقّاش زخارف، وأسماء النقّاشين بحسب موادّهم، وورشات هراة وتبريز وإسفهان، ونقّاشو البابور الهنود، وجماعة نقّاشان في تنظيم أهل الحرف العثماني بأقسامها ومرتّباتها ورؤسائها."
  en: "The TDV İslâm Ansiklopedisi entry on nakkāş by Nebi Bozkurt: the craft of the painter-decorator in its many branches, the craftsmen's names by their materials, the workshops of Herat, Tabriz and Isfahan, the Mughal painters, and the Ottoman nakkāşān corps inside the ehl-i hiref organisation with its divisions, wage registers and chiefs."
