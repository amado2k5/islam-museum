summary:
  ar: "مقالة ويكيبيديا العربية عن محمد يعقوب بك؛ تُستخدم لوقائع الكيان فقط. تقدّمه قائدًا عسكريًا وحاكمًا لكاشغر من أصول طاجيكية أو أوزبكية، زعيمًا ليارقند من 1865 إلى 1877، ومولودًا سنة 1820 أو 1825 ومتوفى في مايو 1877."
  en: "Arabic Wikipedia article on Muhammad Yakub Beg; used for entity facts only. It presents the military commander and ruler of Kashgar of Tajik or Uzbek origin who led Yarkand from 1865 to 1877, born in 1820 or 1825 and died in May 1877."
  es: "Artículo en árabe de la Wikipedia sobre Muhammad Yakub Beg; se utiliza únicamente para obtener información sobre la persona. Presenta al comandante militar y gobernante de Kashgar, de origen tayiko o uzbeko, que dirigió Yarkand desde 1865 hasta 1877. Nació en 1820 o 1825 y falleció en mayo de 1877."
  fr: "Article de Wikipédia en arabe sur Muhammad Yakub Beg; utilisé uniquement à des fins d’information. Il présente le commandant militaire et dirigeant de Kashgar, d’origine tadjike ou ouzbèke, qui a dirigé Yarkand de 1865 à 1877, né en 1820 ou 1825 et décédé en mai 1877."
  ur: "محمد یعقوب بیگ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ تاجک یا ازبک نژاد کاشغر کے فوجی کمانڈر اور حکمران کو پیش کرتا ہے جس نے 1865 سے 1877 تک یارکند کی قیادت کی، جو 1820 یا 1825 میں پیدا ہوئے اور مئی 1877 میں فوت ہوئے۔"
  tr: "Muhammed Yaqub Bey hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Tacik veya Özbek kökenli bir askeri komutan ve Kaşgar hükümdarı, 1865-1877 yılları arasında Yarkand lideri, 1820 veya 1825 doğumlu ve Mayıs 1877'de ölmüş olarak sunulmaktadır."
  id: "Artikel Wikipedia bahasa Arab tentang Muhammad Yaqub Bey; digunakan hanya untuk fakta entitas. Ia digambarkan sebagai komandan militer dan penguasa Kashgar yang berasal dari Tajik atau Uzbek, pemimpin Yarkand dari tahun 1865 hingga 1877, lahir pada tahun 1820 atau 1825, dan meninggal pada Mei 1877."
