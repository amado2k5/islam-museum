  ar: "صفحة العدّاد الحي لمتابعي حساب حاج محمود كريمي على إنستغرام (@mahmuudkarimi) لدى موقع إنستاستاتيستكس؛ أظهرت 439,090 متابعا و2,115 منشورا عند قراءتها في 7 نوفمبر 2026، وسيرة الحساب تنص على أنه مجموعة راية العباس الإعلامية ويديره مسؤول."
