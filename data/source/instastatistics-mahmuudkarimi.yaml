reliability_note: "Platform counter, not a museum-verified fact: the page reports a live follower count drawn from Instagram's data and showed 439,090 followers (10 following, 2,115 posts) when read on 7 November 2026; the page copy available to this run was crawled on 10 June 2026, so the figure is the latest tracker figure obtainable today rather than a same-day crawl, and it is used only as a dated audience figure. DISCREPANCY RECORDED: dated maddah-ranking screenshots of 2025 read the same handle at 622K–771K followers, far above this tracker figure; no reconciliation of the two reads was obtainable (a fall after a page ban or rename is the usual pattern in this scene, but that is not verified for this account). The lower, later tracker figure is the one carried in the record. The account bio, as reproduced on the counter page, identifies the account as the media set of Rayat al-Abbas publishing Haj Mahmoud Karimi's works and sessions and states that the account is managed by an admin — the basis for treating @mahmuudkarimi as his official account."
