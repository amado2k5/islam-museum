  es: "Página de contador en vivo de Instastatistics para la cuenta de Instagram de Haj Mahmoud Karimi (@mahmuudkarimi); mostraba 439.090 seguidores y 2.115 publicaciones cuando se consultó el 7 de noviembre de 2026, y la biografía de la cuenta indica que es el conjunto de medios Rayat al-Abbas, administrado por un administrador, que publica sus trabajos y sesiones."
