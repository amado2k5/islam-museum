summary:
  ar: "مدخل موسوعة إيرانيكا «دهخدا، ميرزا علي‌أكبر قزويني» بقلم علي‌أكبر سعيدي سيرجاني؛ يُستخدم لوقائع الكيان. يعطي ميلاده في طهران نحو 1297 (1879) ووفاته في طهران في 7 اسفند 1334 هـ.ش ⁦(26 فبراير 1956)⁩، وعموده «چرند و پرند» في «صور اسرافیل» ومنفاه الأوروبي وعمله المعجمي."
  en: "Encyclopaedia Iranica entry 'Dehkhoda, Mirza Ali-Akbar Qazvini' by Ali-Akbar Sa'idi Sirjani; used for entity facts. It gives his birth at Tehran about 1297/1879 and his death at Tehran on 7 Esfand 1334 SH (26 February 1956), his Charand-o-Parand column in Sur-e Esrafil, his European exile, and his lexicographical work."
  es: "Entrada de la Enciclopedia Iranica «Dehkhoda, Mirza Ali-Akbar Qazvini» de Ali-Akbar Sa'idi Sirjani; utilizada para datos biográficos. Indica su nacimiento en Teherán alrededor de 1297/1879 y su fallecimiento en Teherán el 7 de Esfand de 1334 SH (26 de febrero de 1956), su columna Charand-o-Parand en Sur-e Esrafil, su exilio europeo y su obra lexicográfica."
  fr: "L'article « Dehkhoda, Mirza Ali-Akbar Qazvini » de l'Encyclopaedia Iranica, rédigé par Ali-Akbar Sa'idi Sirjani, est utilisé pour les informations relatives à cette personne. Il indique sa naissance à Téhéran vers 1297/1879 et sa mort à Téhéran le 7 Esfand 1334 SH (26 février 1956), sa chronique « Charand-o-Parand » dans le Sur-e Esrafil, son exil en Europe et son œuvre lexicographique."
  ur: "انسائیکلوپیڈیا ایرانیکا اندراج 'دیخودہ، مرزا علی اکبر قزوینی' از علی اکبر سعیدی سرجانی؛ ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ تہران میں 1297/1879 کے بارے میں ان کی پیدائش اور 7 اسفند 1334ھ ⁦(26 فروری 1956)⁩ کو تہران میں ان کی وفات، سورۃ اسرافیل میں ان کا چرند-او-پرند کالم، اس کی یورپی جلاوطنی، اور اس کے لغت نگاری کا کام ہے۔"
  tr: "Ali Akbar Saeedi Sirjani'nin \"Dehkhoda, Mirza Ali Akbar Qazvini\" Ansiklopedisi İranica'nın kaydı; varlığın olayları için kullanılmıştır. Yaklaşık 1297 (1879) yılında Tahran'da doğdu ve 7 Esfand 1334 Hicri'de (26 Şubat 1956) Tahran'da öldü; \"Sur Israfil\"deki \"Charand and Bird\" köşesi, Avrupa'daki sürgünü ve sözlük çalışmaları ile birlikte vefat etti."
  id: "Entri untuk Ensiklopedia Iranica \"Dehkhoda, Mirza Ali Akbar Qazvini\" oleh Ali Akbar Saeedi Sirjani; digunakan untuk peristiwa entitas tersebut. Ia lahir di Teheran sekitar tahun 1297 (1879) dan meninggal di Teheran pada 7 Esfand 1334 AH (26 Februari 1956), bersama kolomnya \"Charand and Bird\" di \"Sur Israfil,\" pengasingannya di Eropa, dan karya leksikalnya."
title: "DEHḴODĀ, MĪRZĀ ʿALĪ-AKBAR QAZVĪNĪ"
