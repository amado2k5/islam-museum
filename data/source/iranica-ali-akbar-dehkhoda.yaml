summary:
  ar: "مدخل موسوعة إيرانيكا «دهخدا، ميرزا علي‌أكبر قزويني» بقلم علي‌أكبر سعيدي سيرجاني؛ يُستخدم لوقائع الكيان. يعطي ميلاده في طهران نحو 1297 (1879) ووفاته في طهران في 7 اسفند 1334 هـ.ش (26 فبراير 1956)، وعموده «چرند و پرند» في «صور اسرافیل» ومنفاه الأوروبي وعمله المعجمي."
  en: "Encyclopaedia Iranica entry 'Dehkhoda, Mirza Ali-Akbar Qazvini' by Ali-Akbar Sa'idi Sirjani; used for entity facts. It gives his birth at Tehran about 1297/1879 and his death at Tehran on 7 Esfand 1334 SH (26 February 1956), his Charand-o-Parand column in Sur-e Esrafil, his European exile, and his lexicographical work."
