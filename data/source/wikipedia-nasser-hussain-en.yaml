summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ناصر حسين ⁦(مواليد 1968)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في مدراس في 28 مارس 1968 لأسرة مسلمة وانتقال أسرته إلى إنجلترا سنة 1975، ولعبه لإسيكس وإنجلترا ⁦(96 اختبارا و88 مباراة ليوم واحد)⁩، وقيادته إنجلترا (1999-2003)، وأعلى نتيجة له 207 سنة 1997، وعمله معلقا في سكاي سبورتس وسيرته الذاتية سنة 2005."
  en: "English Wikipedia article on Nasser Hussain (born 1968); used for entity facts only. It records his birth in Madras on 28 March 1968 into a Muslim family, his family's move to England in 1975, his career for Essex and England (96 Tests, 88 ODIs), his England captaincy (1999–2003), his highest Test score of 207 in 1997, his Sky Sports commentary work and his 2005 autobiography."
  es: "Artículo de la Wikipedia en inglés sobre Nasser Hussain (nacido en 1968); utilizado únicamente para datos biográficos. En él se recoge su nacimiento en Madrás el 28 de marzo de 1968 en el seno de una familia musulmana, la mudanza de su familia a Inglaterra en 1975, su carrera para Essex e Inglaterra (96 partidos de prueba, 88 partidos internacionales de un día), su capitanía de Inglaterra (1999-2003), su puntuación más alta en un partido de prueba de 207 en 1997, su trabajo como comentarista en Sky Sports y su autobiografía de 2005."
  fr: "Article de Wikipédia en anglais sur Nasser Hussain (né en 1968); utilisé uniquement pour les informations sur l'entité. Il relate sa naissance à Madras le 28 mars 1968 dans une famille musulmane, le déménagement de sa famille en Angleterre en 1975, sa carrière pour l'Essex et l'Angleterre (96 tests, 88 ODI), son capitanat de l'Angleterre (1999-2003), son meilleur score en test de 207 en 1997, son travail de commentateur pour Sky Sports et son autobiographie de 2005."
  ur: "ناصر حسین ⁦(پیدائش 1968)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 28 مارچ 1968 کو مدراس میں ایک مسلم گھرانے میں ان کی پیدائش، 1975 میں ان کے خاندان کا انگلینڈ منتقل ہونا، اسیکس اور انگلینڈ کے لیے ان کا کیریئر ⁦(96 ٹیسٹ، 88 ون ڈے)⁩، ان کی انگلینڈ کی کپتانی (1999–2003)، 1997 میں ان کا سب سے زیادہ ٹیسٹ اسکور 207، اس کی اسکائی اسپورٹس کمنٹری اور اس کی آٹو بائیو گرافی 207 کا ریکارڈ ہے۔"
