  ar: "مقالة ويكيبيديا الإنجليزية عن ناصر حسين (مواليد 1968)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في مدراس في 28 مارس 1968 لأسرة مسلمة وانتقال أسرته إلى إنجلترا سنة 1975، ولعبه لإسيكس وإنجلترا (96 اختبارا و88 مباراة ليوم واحد)، وقيادته إنجلترا (1999-2003)، وأعلى نتيجة له 207 سنة 1997، وعمله معلقا في سكاي سبورتس وسيرته الذاتية سنة 2005."
  en: "English Wikipedia article on Nasser Hussain (born 1968); used for entity facts only. It records his birth in Madras on 28 March 1968 into a Muslim family, his family's move to England in 1975, his career for Essex and England (96 Tests, 88 ODIs), his England captaincy (1999–2003), his highest Test score of 207 in 1997, his Sky Sports commentary work and his 2005 autobiography."
