summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ضياء الرحمن؛ تُستخدم لوقائع الكيان فقط. تروي مولده في باغباري ببوغرا في 19 يناير 1936، وخدمته في الجيش الباكستاني، وإذاعته إعلان الاستقلال من شيتاغونغ في مارس 1971 وقيادته قطاعًا في حرب التحرير، وتوليه رئاسة أركان الجيش ثم رئاسة الجمهورية من 1977 حتى اغتياله في شيتاغونغ في 30 مايو 1981، وتأسيسه الحزب الوطني البنغلاديشي، ودفنه في ضريح ضياء الرحمن بدكا. لا يحمل صندوق معلوماتها حقلًا للديانة."
  en: "English Wikipedia article on Ziaur Rahman; used for entity facts only. It recounts his birth at Bagbari, Bogra, on 19 January 1936, his Pakistan Army service, his broadcast of the declaration of independence from Chittagong in March 1971 and his sector command in the Liberation War, his army chiefship and then his presidency from 1977 until his assassination at Chittagong on 30 May 1981, his founding of the Bangladesh Nationalist Party, and his burial at the Mausoleum of Ziaur Rahman in Dhaka. Its infobox carries no religion field."
  es: "Artículo de la Wikipedia en inglés sobre Ziaur Rahman; se utiliza únicamente para obtener información sobre la persona. Relata su nacimiento en Bagbari, Bogra, el 19 de enero de 1936, su servicio en el Ejército de Pakistán, su transmisión de la declaración de independencia desde Chittagong en marzo de 1971 y su mando de sector en la Guerra de Liberación, su cargo como jefe del ejército y posteriormente su presidencia desde 1977 hasta su asesinato en Chittagong el 30 de mayo de 1981, la fundación del Partido Nacionalista de Bangladesh y su entierro en el Mausoleo de Ziaur Rahman en Dhaka. Su ficha informativa no incluye información sobre religión."
  fr: "Article de Wikipédia en anglais sur Ziaur Rahman; utilisé uniquement pour les informations le concernant. Il relate sa naissance à Bagbari, Bogra, le 19 janvier 1936, son service dans l’armée pakistanaise, la diffusion de la déclaration d’indépendance depuis Chittagong en mars 1971, son commandement de secteur pendant la guerre de libération, son poste de chef d’état-major puis sa présidence de 1977 jusqu’à son assassinat à Chittagong le 30 mai 1981, la fondation du Parti nationaliste du Bangladesh et son inhumation au mausolée de Ziaur Rahman à Dacca. Son infobox ne comporte pas de champ relatif à la religion."
  ur: "ضیاء الرحمن پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 19 جنوری 1936 کو باگ باڑی، بوگرہ میں ان کی پیدائش، ان کی پاکستان آرمی سروس، مارچ 1971 میں چٹاگانگ سے آزادی کے اعلان کی نشریات اور جنگ آزادی میں ان کی سیکٹر کمانڈ، ان کی آرمی چیف شپ اور پھر ان کی صدارت 1977 سے لے کر 19 مئی کو بنگلہ دیش میں ان کے قتل تک، 18 مئی کو ان کے قتل تک کا ذکر ہے۔ نیشنلسٹ پارٹی، اور ڈھاکہ میں ضیاء الرحمن کے مزار پر ان کی تدفین۔ اس کے معلوماتی خانے میں کوئی مذہب نہیں ہے۔"
