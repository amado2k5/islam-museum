summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ضياء الرحمن؛ تُستخدم لوقائع الكيان فقط. تروي مولده في باغباري ببوغرا في 19 يناير 1936، وخدمته في الجيش الباكستاني، وإذاعته إعلان الاستقلال من شيتاغونغ في مارس 1971 وقيادته قطاعًا في حرب التحرير، وتوليه رئاسة أركان الجيش ثم رئاسة الجمهورية من 1977 حتى اغتياله في شيتاغونغ في 30 مايو 1981، وتأسيسه الحزب الوطني البنغلاديشي، ودفنه في ضريح ضياء الرحمن بدكا. لا يحمل صندوق معلوماتها حقلًا للديانة."
  en: "English Wikipedia article on Ziaur Rahman; used for entity facts only. It recounts his birth at Bagbari, Bogra, on 19 January 1936, his Pakistan Army service, his broadcast of the declaration of independence from Chittagong in March 1971 and his sector command in the Liberation War, his army chiefship and then his presidency from 1977 until his assassination at Chittagong on 30 May 1981, his founding of the Bangladesh Nationalist Party, and his burial at the Mausoleum of Ziaur Rahman in Dhaka. Its infobox carries no religion field."
