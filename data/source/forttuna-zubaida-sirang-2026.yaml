label: { en: "Forttuna Game Changers 2026: Zubaida Sirang profile" }
summary:
  ar: "ملف تعريفي لزبيدة سيرانغ في قائمة «Forttuna Game Changers 2026»: يذكر أنها استشارية جراحة عيون وقائدة طب العيون المجتمعي في جامعة الآغا خان بكراتشي، وأنها رائدة نموذج «المحور والأذرع» لطب العيون في باكستان، ومؤلفة كتاب «Optics Made Easy»، وأنها تتابع زمالة متقدمة في جراحة محجر العين بجامعة كالغاري."
  en: "Forttuna Game Changers 2026 honoree profile of Zubaida Sirang: consultant ophthalmic surgeon and Lead of Community Ophthalmology at Aga Khan University, Karachi; pioneer of the hub-and-spoke model of ophthalmology in Pakistan; author of Optics Made Easy; currently pursuing an advanced fellowship in orbit and oculofacial surgery at the University of Calgary."
  es: "Perfil de Zubaida Sirang, homenajeada en el programa Forttuna Game Changers 2026: cirujana oftalmóloga consultora y jefa de Oftalmología Comunitaria en la Universidad Aga Khan de Karachi; pionera del modelo de red centralizada de oftalmología en Pakistán; autora de Optics Made Easy; actualmente cursa una beca de especialización en cirugía orbitaria y oculofacial en la Universidad de Calgary."
  fr: "Profil de Zubaida Sirang, lauréate du programme Forttuna Game Changers 2026: chirurgienne ophtalmologue consultante et responsable de l’ophtalmologie communautaire à l’Université Aga Khan de Karachi; pionnière du modèle de soins ophtalmologiques en étoile au Pakistan; auteure de « Optics Made Easy »; poursuit actuellement une formation spécialisée en chirurgie orbitaire et oculofaciale à l’Université de Calgary."
  ur: "فورٹونا گیم چینجرز 2026 زبیدہ سرنگ کا اعزازی پروفائل: کنسلٹنٹ آپتھلمک سرجن اور آغا خان یونیورسٹی، کراچی میں کمیونٹی آپتھلمولوجی کی رہنما؛ پاکستان میں امراض چشم کے حب اینڈ اسپوک ماڈل کا علمبردار؛ آپٹکس میڈ ایز کے مصنف؛ فی الحال کیلگری یونیورسٹی میں مدار اور آکولوفیسیل سرجری میں ایک اعلی درجے کی فیلوشپ کا تعاقب کر رہے ہیں۔"
  tr: "Zubaida Serang'ın 'Forttuna Game Changers 2026' listesindeki profili: Karaçi'deki Aga Khan Üniversitesi'nde danışman göz doktoru ve topluluk oftalmolojisi lideridir, Pakistan'da 'eksen ve kollar' optik modelinin öncüsü, 'Optics Made Easy' kitabının yazarı ve Calgary Üniversitesi'nde göz çukuru cerrahisi alanında ileri düzey burs peşindedir."
  id: "Profil Zubaida Serang dalam daftar 'Forttuna Game Changers 2026': Dia adalah konsultan oftalmologi dan pemimpin oftalmologi komunitas di Universitas Aga Khan di Karachi, pelopor model oftalmologi 'axis and arms' di Pakistan, penulis buku 'Optics Made Easy,' dan sedang menempuh fellowship lanjutan dalam bedah soket mata di University of Calgary."
