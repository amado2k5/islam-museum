summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خليفة بن زايد آل نهيان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في العين في 7 سبتمبر 1948، الابن الأكبر لزايد بن سلطان، وخلف والده حاكمًا لأبوظبي في 2 نوفمبر 2004 وانتُخب رئيسًا للإمارات في اليوم التالي، وبقي حتى وفاته في أبوظبي في 13 مايو 2022 ودُفن في مقبرة البطين. ويقرأ حقل الدين في صندوق معلوماتها «الإسلام السني»؛ ولا يذكر متنها مدرسة له."
  en: "English Wikipedia article on Khalifa bin Zayed Al Nahyan; used for entity facts only. It gives him as born at Al Ain on 7 September 1948, the eldest son of Zayed bin Sultan, succeeding his father as ruler of Abu Dhabi on 2 November 2004 and elected president of the UAE the next day, until his death at Abu Dhabi on 13 May 2022; he is buried at Al Bateen Cemetery. Its infobox religion field reads 'Sunni Islam'; no text in it names a school for him."
