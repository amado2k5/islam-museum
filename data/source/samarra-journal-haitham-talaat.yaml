  ar: "دراسة أكاديمية في مجلة «سر من رأى للدراسات الإنسانية» عن هيثم طلعت ودوره في معالجة الإلحاد؛ تذكر مولده بمحافظة أسيوط سنة 1981 وبكالوريوس الطب والجراحة سنة 2004 وإدارته قسم العلوم الإنسانية بمركز براهين سابقًا وقنواته على يوتيوب."
  en: "An academic study in the Samarra Journal for Human Studies on Haitham Talaat and his role in addressing atheism; it gives his birth in Asyut Governorate in 1981, his 2004 bachelor's degree in medicine and surgery, his former directorship of the Humanities Department at the Braheen Center, and his YouTube channels."
