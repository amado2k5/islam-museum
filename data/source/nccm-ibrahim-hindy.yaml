summary:
  ar: "بيان المجلس الوطني لمسلمي كندا بتاريخ 19 أبريل 2017 عن حوادث كراهية ضد المسلمين في أوتاوا وتورونتو؛ يسمي إبراهيم هندي إماما محليا في تورونتو ويقتطف قوله عن تلقي التهديدات وضرورة وقوف الكنديين جميعا ضد الكراهية."
  en: "The National Council of Canadian Muslims' press release of 19 April 2017 on anti-Muslim hate incidents in Ottawa and Toronto; it names Ibrahim Hindy as a local Toronto imam, reports the violent threats he had received, and quotes him that it is up to all Canadians to stand together against all forms of hatred."
  es: "El comunicado de prensa del Consejo Nacional de Musulmanes Canadienses del 19 de abril de 2017 sobre incidentes de odio antimusulmán en Ottawa y Toronto; menciona a Ibrahim Hindy como un imán local de Toronto, informa sobre las amenazas violentas que había recibido y lo cita diciendo que depende de todos los canadienses unirse contra todas las formas de odio."
  fr: "Communiqué de presse du Conseil national des musulmans canadiens du 19 avril 2017 sur les incidents haineux antimusulmans à Ottawa et à Toronto; il cite Ibrahim Hindy comme imam local de Toronto, rapporte les menaces violentes qu’il a reçues et rapporte ses propos selon lesquels il appartient à tous les Canadiens de s’unir contre toutes les formes de haine."
  ur: "اوٹاوا اور ٹورنٹو میں مسلم مخالف نفرت انگیز واقعات پر 19 اپریل 2017 کی نیشنل کونسل آف کینیڈین مسلمانوں کی پریس ریلیز؛ اس میں ابراہیم ہندی کا نام ٹورنٹو کے ایک مقامی امام کے طور پر رکھا گیا ہے، اسے موصول ہونے والی پرتشدد دھمکیوں کی اطلاع دی گئی ہے، اور اس کا حوالہ دیا گیا ہے کہ یہ تمام کینیڈینوں پر منحصر ہے کہ وہ ہر قسم کی نفرت کے خلاف ایک ساتھ کھڑے ہوں۔"
  tr: "Kanada Ulusal Müslümanlar Konseyi'nin 19 Nisan 2017 tarihli açıklaması, Ottawa ve Toronto'daki Müslümanlara karşı nefret olaylarıyla ilgili; İbrahim Hindi, Toronto'da yerel bir imam olarak atanmış ve tehditlere maruz kalması ile tüm Kanadalıların nefrete karşı durması gerektiği konusundaki sözlerini aktarmaktadır."
  id: "Pernyataan Dewan Nasional Muslim Kanada tertanggal 19 April 2017, mengenai insiden kebencian terhadap Muslim di Ottawa dan Toronto; Ibrahim Hindi diangkat sebagai imam lokal di Toronto dan mengutip kata-katanya tentang menerima ancaman serta perlunya semua warga Kanada untuk melawan kebencian."
title: "NCCM raises concerns about reports of numerous anti-Muslim hate incidents in Ottawa and Toronto"
