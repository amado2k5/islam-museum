reliability_note: "A magazine interview with the poet herself, read in full on the publisher's site on 1 November 2026. Asked about describing her upbringing as 'a Muslim Calvinist in faith', she answers that she described herself as 'a Scottish Calvinist Muslim adopted by India and married into Wales', and adds, in terms, 'I wasn't really talking about faith', explaining that the phrase refuses easy labels. It is the primary evidence that her famous self-description is an identity statement rather than an attestation of belief."
