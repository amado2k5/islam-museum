summary:
  ar: "مقالة ويكيبيديا العربية عن محمد عبد الله محمد ⁦(فرماجو)⁩؛ تُستخدم لوقائع الكيان فقط. تروي رئاسته وزراء الصومال ثم رئاسته للجمهورية. لا تذكر دينه شخصيا ولا مدرسته؛ وتصنيفاتها «مسلمون سنة صوماليون» تصنيفات لا شهادات."
  en: "Arabic Wikipedia article on Mohamed Abdullahi Mohamed (Farmajo); used for entity facts only. It recounts his premiership and presidency of Somalia. It does not discuss his own religion or school; its 'Somali Sunni Muslims' categories are filings, not attestations."
  es: "Artículo de Wikipedia en árabe sobre Mohamed Abdullahi Mohamed (Farmajo); se utiliza únicamente para datos sobre la persona. Relata su mandato como primer ministro y presidente de Somalia. No aborda su religión ni su escuela; las categorías de «musulmanes sunitas somalíes» son declaraciones, no certificaciones."
  fr: "Article de Wikipédia en arabe sur Mohamed Abdullahi Mohamed (Farmajo); utilisé uniquement à titre informatif. Il relate son mandat de Premier ministre et de président de la Somalie. Il n'aborde ni sa religion ni son école de pensée; les catégories « Musulmans sunnites somaliens » sont des classements, et non des attestations."
  ur: "عربی ویکیپیڈیا مضمون محمد عبداللہ محمد ⁦(فرماجو)⁩ پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی صومالیہ کی پریمیئر شپ اور صدارت کا ذکر ہے۔ یہ اس کے اپنے مذہب یا مکتب پر بحث نہیں کرتا۔ اس کے 'صومالی سنی مسلمانوں' کے زمرے فائلنگ ہیں، تصدیقی نہیں۔"
  tr: "Mohamed Abdullah Mohamed (Farmajo) hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Somali bakanları olarak başkanlığını ve ardından cumhuriyet başkanlığını anlatır. Dini veya okulu belirtilmez; sınıflandırmaları \"Somali Sünni Müslümanları\" olarak sınıflandırmadır, tanıklık değildir."
  id: "Artikel Wikipedia berbahasa Arab tentang Mohamed Abdullah Mohamed (Farmajo); digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kepresidenannya sebagai menteri Somalia dan kemudian masa kepresidenannya di republik. Artikel ini tidak menyebutkan agama atau sekolahnya; klasifikasinya adalah \"Muslim Sunni Somalia\" sebagai klasifikasi, bukan kesaksian."
