reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The article is a stub — a lead paragraph and a references section. It gives: 'Adama ɓii Ardo Hassana (1786-1847), known more commonly as Modibbo Adama, was a Fulani scholar and holy warrior, descending from the Ba'en clan of the Fulbe. He led a jihad in the region of Fombina (in present-day Cameroon and Nigeria) and opened the region to Fulani settlement.' The clan attribution differs from the English article's detail, which makes him of the Yillaga (Yirlaɓe) clan and has him join the Ba'en Fulbe only later, after his father's death; the record follows the English article's fuller account and records the Arabic lead's attribution here. The article names no school of law or theology for him."
