  ar: "مقالة ويكيبيديا الإنجليزية عن في-في لي؛ تُستخدم لوقائع الكيان فقط. تروي ولادتها في بكين سنة 1976 ونشأتها في تشنغدو وهجرتها إلى الولايات المتحدة، ودراستها في برينستون وكالتيك، وأستاذيّتها في ستانفورد، وإنشاءها قاعدة بيانات إيماج نت، وتأسيسها وورلد لابز، وجوائزها. لا تذكر المقالة أي دين أو انتماء ديني لها."
  en: "English Wikipedia article on Fei-Fei Li; used for entity facts only. It covers her 1976 birth in Beijing, her upbringing in Chengdu and emigration to the United States, her study at Princeton and Caltech, her Stanford professorship, the creation of ImageNet, the founding of World Labs, and her honours. The article states no religion or religious affiliation for her."
