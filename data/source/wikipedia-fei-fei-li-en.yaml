summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن في-في لي؛ تُستخدم لوقائع الكيان فقط. تروي ولادتها في بكين سنة 1976 ونشأتها في تشنغدو وهجرتها إلى الولايات المتحدة، ودراستها في برينستون وكالتيك، وأستاذيّتها في ستانفورد، وإنشاءها قاعدة بيانات إيماج نت، وتأسيسها وورلد لابز، وجوائزها. لا تذكر المقالة أي دين أو انتماء ديني لها."
  en: "English Wikipedia article on Fei-Fei Li; used for entity facts only. It covers her 1976 birth in Beijing, her upbringing in Chengdu and emigration to the United States, her study at Princeton and Caltech, her Stanford professorship, the creation of ImageNet, the founding of World Labs, and her honours. The article states no religion or religious affiliation for her."
  es: "Artículo de Wikipedia en inglés sobre Fei-Fei Li; se utiliza únicamente para obtener información sobre la persona. Abarca su nacimiento en Pekín en 1976, su infancia en Chengdu y su emigración a Estados Unidos, sus estudios en Princeton y Caltech, su cátedra en Stanford, la creación de ImageNet, la fundación de World Labs y sus distinciones. El artículo no menciona ninguna religión ni afiliación religiosa por su parte."
  fr: "Article de Wikipédia en anglais sur Fei-Fei Li; utilisé uniquement à titre informatif. Il relate sa naissance à Pékin en 1976, son enfance à Chengdu et son émigration aux États-Unis, ses études à Princeton et Caltech, son poste de professeure à Stanford, la création d’ImageNet, la fondation de World Labs et ses distinctions. L’article ne mentionne aucune religion ni appartenance religieuse."
  ur: "Fei-Fei Li پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بیجنگ میں اس کی 1976 کی پیدائش، چینگدو میں اس کی پرورش اور ریاستہائے متحدہ میں ہجرت، پرنسٹن اور کالٹیک میں اس کی تعلیم، اس کی اسٹینفورڈ پروفیسر شپ، امیج نیٹ کی تخلیق، ورلڈ لیبز کی بنیاد، اور اس کے اعزازات شامل ہیں۔ آرٹیکل میں اس کے لیے کوئی مذہب یا مذہبی وابستگی نہیں بتائی گئی ہے۔"
  tr: "Vi-Vi Li hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılmıştır. 1976'da Pekin'de doğmasını, Chengdu'daki yetiştirilme tarzını, Amerika Birleşik Devletleri'ne göçünü, Princeton ve Caltech'teki eğitimlerini, Stanford'daki görev süresini, ImageNet veritabanının oluşturulmasını, World Labs'ın kuruluşunu ve ödüllerini anlatır. Makalede onunla ilgili herhangi bir din veya dini bağlılık belirtilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Vi-Vi Li; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Beijing pada tahun 1976, masa kecilnya di Chengdu, imigrasinya ke Amerika Serikat, studinya di Princeton dan Caltech, masa kerjanya di Stanford, penciptaan basis data ImageNet, pendirian World Labs, dan penghargaan yang dimilikinya. Artikel tersebut tidak menyebutkan agama atau afiliasi agama apa pun dengannya."
