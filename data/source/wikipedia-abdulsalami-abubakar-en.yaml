  ar: "مقالة ويكيبيديا الإنجليزية عن عبد السلام أبو بكر؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في مينا في 13 يونيو 1942، وخدمته رئيسا لأركان الدفاع (1997–1998)، وتولّيه حكم نيجيريا بعد وفاة أباتشا في 9 يونيو 1998، وانتقاله بالبلاد إلى دستور جديد وانتخابات متعددة الأحزاب وتسليمه السلطة لأوباسانجو المنتخب في 29 مايو 1999، ورئاسته لاحقا لجنة السلام الوطنية."
  en: "English Wikipedia article on Abdulsalami Abubakar; used for entity facts only. It recounts his birth in Minna on 13 June 1942, his service as Chief of Defence Staff (1997–1998), his becoming Nigeria's head of state after Abacha's death on 9 June 1998, his transition programme (new constitution, multiparty elections) and handover to the elected Obasanjo on 29 May 1999, and his later chairmanship of the National Peace Committee."
