summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد السلام أبو بكر؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في مينا في 13 يونيو 1942، وخدمته رئيسا لأركان الدفاع (1997–1998)، وتولّيه حكم نيجيريا بعد وفاة أباتشا في 9 يونيو 1998، وانتقاله بالبلاد إلى دستور جديد وانتخابات متعددة الأحزاب وتسليمه السلطة لأوباسانجو المنتخب في 29 مايو 1999، ورئاسته لاحقا لجنة السلام الوطنية."
  en: "English Wikipedia article on Abdulsalami Abubakar; used for entity facts only. It recounts his birth in Minna on 13 June 1942, his service as Chief of Defence Staff (1997–1998), his becoming Nigeria's head of state after Abacha's death on 9 June 1998, his transition programme (new constitution, multiparty elections) and handover to the elected Obasanjo on 29 May 1999, and his later chairmanship of the National Peace Committee."
  es: "Artículo de la Wikipedia en inglés sobre Abdulsalami Abubakar; utilizado únicamente para obtener información sobre la persona. Relata su nacimiento en Minna el 13 de junio de 1942, su servicio como Jefe del Estado Mayor de la Defensa (1997-1998), su ascenso al poder como jefe de Estado de Nigeria tras la muerte de Abacha el 9 de junio de 1998, su programa de transición (nueva constitución, elecciones multipartidistas) y el traspaso del poder al electo Obasanjo el 29 de mayo de 1999, y su posterior presidencia del Comité Nacional de Paz."
  fr: "Article de Wikipédia en anglais sur Abdulsalami Abubakar; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Minna le 13 juin 1942, son mandat de chef d'état-major des armées (1997-1998), son accession à la tête de l'État nigérian après la mort d'Abacha le 9 juin 1998, son programme de transition (nouvelle constitution, élections multipartites) et la passation de pouvoir à Obasanjo, élu, le 29 mai 1999, ainsi que sa présidence ultérieure du Comité national pour la paix."
  ur: "عبدالسلامی ابوبکر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 13 جون 1942 کو مننا میں ان کی پیدائش، چیف آف ڈیفنس اسٹاف (1997–1998) کے طور پر ان کی خدمات، 9 جون 1998 کو اباچا کی موت کے بعد ان کا نائیجیریا کا سربراہ مملکت بننے، ان کا عبوری پروگرام ⁦(نیا آئین، کثیر الجماعتی انتخابات)⁩ اور بعد ازاں 29 مئی کو منتخب اوباسانجو کو ان کی قومی کمیٹی کے چیئرمین اور 29 مئی کو پی ای 1 کے چیئرمین کے حوالے کیا گیا ہے۔"
  tr: "Abdulsalam Abu Bakr hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 13 Haziran 1942'de Mina'da doğmasını, Savunma Genelkurmay Başkanı olarak görevini (1997–1998), Abacha'nın 9 Haziran 1998'deki ölümünden sonra Nijerya'da iktidarı devralmasını, yeni anayasaya geçişini ve çok partili seçimleri anlatır; 29 Mayıs 1999'da iktidarı seçilmiş Obasanjo'ya devretmesini ve daha sonra Ulusal Barış Komitesi'ne başkanlık etmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdulsalam Abu Bakr; hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Mina pada 13 Juni 1942, masa jabatannya sebagai Kepala Staf Pertahanan (1997–1998), pengambilalihannya ke Nigeria setelah kematian Abacha pada 9 Juni 1998, transisinya ke konstitusi baru dan pemilihan multi-partai, penyerahan kekuasaan kepada Obasanjo yang terpilih pada 29 Mei 1999, dan kemudian memimpin Komite Perdamaian Nasional."
