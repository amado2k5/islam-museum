  id: "Artikel Wikipedia dalam bahasa Urdu tentang Mohsin al-Mulk; digunakan hanya untuk fakta entitas. Tanggal-tanggal mengonfirmasi bahwa ia adalah salah satu pendiri All India Muslim League dan teman dekat Sir Syed Ahmad Khan."
