  ur: "محسن الملک پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ تاریخوں کی تصدیق کرتا ہے اور اسے آل انڈیا مسلم لیگ کے بانی اور سر سید احمد خان کے قریبی دوست کے طور پر ریکارڈ کرتا ہے۔"
