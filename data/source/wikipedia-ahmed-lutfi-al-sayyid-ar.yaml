summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد لطفي السيد؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في برقين سنة 1872 ولقبه «أستاذ الجيل»، وتذكر تأثره بمحمد عبده وملازمته جمال الدين الأفغاني في إسطنبول ومناصبه ووفاته بالقاهرة سنة 1963."
  en: "Arabic Wikipedia article on Ahmed Lutfi al-Sayyid; used for entity facts only. It gives his birth at Berqin in 1872 and his byname 'Professor of the Generation', and records his formation under Muhammad Abduh, his companionship of Jamal al-Din al-Afghani in Istanbul, his offices, and his death at Cairo in 1963."
  es: "Artículo de Wikipedia en árabe sobre Ahmed Lutfi al-Sayyid; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Berqin en 1872 y su sobrenombre de \"Profesor de la Generación\", y registra su formación con Muhammad Abduh, su relación con Jamal al-Din al-Afghani en Estambul, sus cargos y su fallecimiento en El Cairo en 1963."
  fr: "Article de Wikipédia en arabe sur Ahmed Lutfi al-Sayyid; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance à Berqin en 1872 et son surnom de « Professeur de la Génération », et relate sa formation auprès de Muhammad Abduh, sa collaboration avec Jamal al-Din al-Afghani à Istanbul, ses fonctions et sa mort au Caire en 1963."
  ur: "احمد لطفی السید پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1872 میں برقین میں اس کی پیدائش اور اس کا نام 'پروفیسر آف دی جنریشن' ہے، اور محمد عبدہ کے تحت اس کی تشکیل، استنبول میں جمال الدین الافغانی کی صحبت، ان کے دفاتر، اور 1963 میں قاہرہ میں اس کی موت کو ریکارڈ کرتا ہے۔"
  tr: "Ahmed Lutfi Al-Sayyid hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Bu makalede 1872'de Burqin'de doğduğu ve 'Nesil Profesörü' unvanı verildiği, Muhammed Abduh'un etkisi, İstanbul'daki Cemaleddin el-Afghani ile arkadaşlığı, görevleri ve 1963'te Kahire'deki ölümü yer almaktadır."
  id: "Artikel Wikipedia berbahasa Arab tentang Ahmed Lutfi Al-Sayyid hanya digunakan untuk fakta-fakta entitas tersebut. Artikel ini mencantumkan kelahirannya di Burqin pada tahun 1872 dan gelarnya 'Profesor Generasi,' yang menyebutkan pengaruhnya oleh Muhammad Abduh, kebersamaannya dengan Jamal al-Din al-Afghani di Istanbul, posisinya, dan kematiannya di Kairo pada tahun 1963."
