summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عليخان بوكيخانوف؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 5 مارس 1866 في أسرة كازاخية مسلمة، ودراسته في أومسك وبطرسبورغ، وعضويته في الدوما، وقيادته حزب ألاش وحكومة ألاش أوردا، وإعدامه في 27 سبتمبر 1937."
  en: "English Wikipedia article on Alikhan Bukeikhanov; used for entity facts only. It recounts his birth on 5 March 1866 into a Kazakh Muslim family, his schooling at Omsk and St Petersburg, his seat in the State Duma, his leadership of the Alash party and the Alash Orda government, and his execution on 27 September 1937."
  es: "Artículo de la Wikipedia en inglés sobre Alikhan Bukeikhanov; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 5 de marzo de 1866 en el seno de una familia musulmana kazaja, su educación en Omsk y San Petersburgo, su escaño en la Duma Estatal, su liderazgo del partido Alash y del gobierno de Alash Orda, y su ejecución el 27 de septiembre de 1937."
  fr: "Article de Wikipédia en anglais sur Alikhan Bukeikhanov; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance le 5 mars 1866 dans une famille musulmane kazakhe, ses études à Omsk et à Saint-Pétersbourg, son siège à la Douma d’État, son rôle à la tête du parti Alash et du gouvernement Alash Orda, et son exécution le 27 septembre 1937."
  ur: "علیخان بوکیخانوف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 5 مارچ 1866 کو ایک قازق مسلمان خاندان میں اس کی پیدائش، اومسک اور سینٹ پیٹرزبرگ میں اس کی تعلیم، ریاست ڈوما میں اس کی نشست، الاش پارٹی اور الاش اوردا حکومت کی قیادت، اور 27 ستمبر 1937 کو اس کی پھانسی کا ذکر ہے۔"
  tr: "Alikhan Bukihanov hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 5 Mart 1866'da Müslüman bir Kazak ailesinde doğmasını, Omsk ve St. Petersburg'daki eğitimlerini, Duma'daki üyeliğini, Alash Partisi ve Alash-Orda hükümetindeki liderliğini ve 27 Eylül 1937'de idam edilmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Alikhan Bukikhanov; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 5 Maret 1866 dalam keluarga Kazakh Muslim, studinya di Omsk dan St. Petersburg, keanggotaannya di Duma, kepemimpinannya di Partai Alash dan pemerintahan Alash-Orda, serta eksekusinya pada 27 September 1937."
