summary:
  ar: "مقالة ويكيبيديا الأردية عن بينغو وا موثاريكا؛ تُستخدم لوقائع الكيان فقط. وهي بذرة: تكتفي بأنه سياسي واقتصادي ملاوي ورئيس من مايو 2004 حتى وفاته في أبريل 2012، وتصنّفه ضمن رومان كاثوليك ملاوي؛ ولا يناقش متنها الدين."
  en: "Urdu Wikipedia article on Bingu wa Mutharika; used for entity facts only. A stub: it states only that he was a Malawian politician and economist and president from May 2004 until his death in April 2012, and files him under Malawian Roman Catholics; its text discusses no religion."
  es: "Artículo de Wikipedia en urdu sobre Bingu wa Mutharika; se utiliza únicamente para datos sobre la persona. Esbozo: solo indica que fue un político y economista malauí, presidente desde mayo de 2004 hasta su muerte en abril de 2012, y lo clasifica dentro de los católicos romanos malauíes; el texto no menciona ninguna religión."
  fr: "Article Wikipédia en ourdou sur Bingu wa Mutharika; utilisé uniquement pour des informations factuelles. Ébauche: il indique seulement qu’il était un homme politique, économiste et président du Malawi de mai 2004 à sa mort en avril 2012, et le classe parmi les catholiques romains du Malawi; le texte n’aborde pas la religion."
  ur: "Bingu wa Mutharika پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک سٹب: اس میں صرف یہ بتایا گیا ہے کہ وہ مئی 2004 سے اپریل 2012 میں اپنی موت تک ملاویائی سیاست دان اور ماہر اقتصادیات اور صدر تھے، اور انہیں ملاوین رومن کیتھولک کے تحت فائل کرتے ہیں۔ اس کا متن کسی مذہب پر بحث نہیں کرتا۔"
