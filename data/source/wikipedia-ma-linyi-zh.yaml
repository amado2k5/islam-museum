  ar: "مقالة ويكيبيديا الصينية عن ما ليني (ما لين يي)؛ تُستخدم لوقائع الكيان فقط. تروي المربّي الهوي من باوتشينغ في خونان (1864–1938)، الناجح في امتحانات الإمبراطورية والدّارس في اليابان، الذي تولّى تعليم قانسو وآنهوي وجلي وكان نائب وزير التعليم، وألّف في التربية وفي مقدمة الإسلام."
  en: "Chinese Wikipedia article on Ma Linyi; used for entity facts only. It recounts the Hui educator from Baoqing, Hunan (1864 – 17 September 1938), an imperial examination graduate who studied in Japan, headed education in Gansu, Anhui and Zhili, served as vice-minister of education, and wrote on education and an introduction to Islam."
