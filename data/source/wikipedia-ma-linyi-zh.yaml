reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives him as born in 1864 and died on 17 September 1938, a Hui from Baoqing in Hunan, courtesy name Zhenwu (also written Zhenwu with a different second character), an educator and Islamic scholar; it lists his posts (Gansu education commissioner and director-general, Anhui and Zhili education chief, vice-minister of education in 1921, director of the Beijing Library, Mongolian and Tibetan Affairs Commission posts) and his books, among them an Outline of Islam. It names no school, order or movement for him."
