summary:
  ar: "ملف إيلينا نيكولوفا في مجتمع ترافل ماسيف المهني للسفر: منشئة موقع MuslimTravelGirl.com، وأول امرأة تحصل على اعتماد المُسوِّق الإسلامي المعتمد في المملكة المتحدة، ونشأتها في كورفو، وكتاباتها الشهرية في مجلات نمط الحياة الإسلامية وحديثها في مؤتمرات السفر."
  en: "Elena Nikolova's profile on the Travel Massive travel-industry community: creator of MuslimTravelGirl.com, the first woman to become a Chartered Islamic Marketer in the UK, her upbringing in Corfu, her monthly travel writing for Muslim lifestyle magazines and her conference speaking."
  es: "Perfil de Elena Nikolova en la comunidad de la industria turística Travel Massive: creadora de MuslimTravelGirl.com, la primera mujer en convertirse en especialista en marketing islámico certificada en el Reino Unido, su infancia en Corfú, sus artículos mensuales sobre viajes para revistas de estilo de vida musulmán y sus ponencias en conferencias."
  fr: "Profil d'Elena Nikolova sur Travel Massive, la communauté de l'industrie du voyage: créatrice de MuslimTravelGirl.com, première femme à devenir spécialiste agréée en marketing islamique au Royaume-Uni, son enfance à Corfou, ses articles de voyage mensuels pour des magazines de style de vie musulmans et ses interventions lors de conférences."
  ur: "ٹریول میسیو ٹریول انڈسٹری کمیونٹی پر ایلینا نکولووا کا پروفائل: MuslimTravelGirl.com کی خالق، برطانیہ میں چارٹرڈ اسلامک مارکیٹر بننے والی پہلی خاتون، کورفو میں اس کی پرورش، مسلم طرز زندگی کے میگزین کے لیے اس کی ماہانہ سفری تحریر اور اس کی کانفرنس میں تقریر۔"
