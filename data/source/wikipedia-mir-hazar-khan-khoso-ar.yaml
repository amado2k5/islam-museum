summary:
  ar: "مقالة ويكيبيديا العربية عن مير هزار خان كهوسو؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 30 سبتمبر 1929، ورئاسته المؤقتة لوزراء باكستان من 25 مارس 2013 إلى 5 يونيو 2013، ورئاسته السابقة للمحكمة الشرعبة الفدرالية، ودراسته في جامعتي السند وكراتشي، وأبناءه الثلاثة. ويعطي صندوق معلوماتها دينه «الإسلام» بصورة عامة."
  en: "Arabic Wikipedia article on Mir Hazar Khan Khoso; used for entity facts only. It gives his birth on 30 September 1929, his caretaker premiership of Pakistan from 25 March 2013 to 5 June 2013, his earlier chief justiceship of the Federal Shariat Court, his studies at the Universities of Sindh and Karachi, and his three sons. Its infobox gives his religion as Islam, generically."
  es: "Artículo en árabe de la Wikipedia sobre Mir Hazar Khan Khoso; utilizado únicamente para datos biográficos. Indica su fecha de nacimiento (30 de septiembre de 1929), su mandato como primer ministro interino de Pakistán (del 25 de marzo al 5 de junio de 2013), su anterior cargo como presidente del Tribunal Federal de la Sharia, sus estudios en las Universidades de Sindh y Karachi, y sus tres hijos. Su ficha informativa lo identifica como musulmán, de forma genérica."
  fr: "Article Wikipédia en arabe consacré à Mir Hazar Khan Khoso; utilisé uniquement pour les informations le concernant. On y apprend sa naissance le 30 septembre 1929, son intérim à la tête du Pakistan du 25 mars au 5 juin 2013, son ancien poste de juge en chef de la Cour fédérale de la charia, ses études aux universités du Sindh et de Karachi, ainsi que la présence de ses trois fils. Son infobox indique qu'il est musulman."
  ur: "میر ہزار خان کھوسو پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 30 ستمبر 1929 کو ان کی پیدائش، 25 مارچ 2013 سے 5 جون 2013 تک پاکستان کی نگران وزیر اعظم، وفاقی شرعی عدالت کی اس سے قبل کی چیف جسٹس شپ، سندھ اور کراچی کی یونیورسٹیوں میں ان کی تعلیم، اور ان کے تین بیٹے۔ اس کا معلوماتی خانہ عام طور پر اس کے مذہب کو بطور اسلام دیتا ہے۔"
  tr: "Mir Hazar Khan Kahusu hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Makalede 30 Eylül 1929'daki doğumu, 25 Mart 2013'ten 5 Haziran 2013'e kadar Pakistan bakanlarının geçici başkanlığı, önceki Federal Şeriat Mahkemesi başkanlığı, Sindh ve Karaçi üniversitelerindeki eğitimi ve üç oğlu yer alır. Bilgi kutusunda genellikle dini \"İslam\" olarak verilir."
  id: "Artikel Wikipedia berbahasa Arab tentang Mir Hazar Khan Kahusu; digunakan hanya untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya pada 30 September 1929, masa kepresidenan sementara menteri-menteri Pakistan dari 25 Maret 2013 hingga 5 Juni 2013, kepresidenan sebelumnya di Pengadilan Syariah Federal, studinya di universitas Sindh dan Karachi, serta tiga putranya. Infobox umumnya mencantumkan agamanya sebagai \"Islam.\""
