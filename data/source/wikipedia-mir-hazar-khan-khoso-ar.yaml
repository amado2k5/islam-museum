  ar: "مقالة ويكيبيديا العربية عن مير هزار خان كهوسو؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 30 سبتمبر 1929، ورئاسته المؤقتة لوزراء باكستان من 25 مارس 2013 إلى 5 يونيو 2013، ورئاسته السابقة للمحكمة الشرعبة الفدرالية، ودراسته في جامعتي السند وكراتشي، وأبناءه الثلاثة. ويعطي صندوق معلوماتها دينه «الإسلام» بصورة عامة."
  en: "Arabic Wikipedia article on Mir Hazar Khan Khoso; used for entity facts only. It gives his birth on 30 September 1929, his caretaker premiership of Pakistan from 25 March 2013 to 5 June 2013, his earlier chief justiceship of the Federal Shariat Court, his studies at the Universities of Sindh and Karachi, and his three sons. Its infobox gives his religion as Islam, generically."
