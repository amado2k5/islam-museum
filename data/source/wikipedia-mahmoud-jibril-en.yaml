  ar: "مقالة ويكيبيديا الإنجليزية عن محمود جبريل؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 28 مايو 1952 بالبيضاء، ورئاسته للمكتب التنفيذي للمجلس الوطني الانتقالي (رئيس وزراء مؤقتًا) من مارس إلى أكتوبر 2011، ورئاسته لتحالف القوى الوطنية، ووفاته بالقاهرة في 5 أبريل 2020. لا تذكر المقالة دينه في نصها ولا في صندوق معلوماتها."
  en: "English Wikipedia article on Mahmoud Jibril; used for entity facts only. It gives his birth on 28 May 1952 at Bayda, his chairmanship of the National Transitional Council's executive board (as interim prime minister) from March to October 2011, his leadership of the National Forces Alliance, and his death in Cairo on 5 April 2020. The article states no religion for him in its text or infobox."
