summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمود جبريل؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 28 مايو 1952 بالبيضاء، ورئاسته للمكتب التنفيذي للمجلس الوطني الانتقالي ⁦(رئيس وزراء مؤقتًا)⁩ من مارس إلى أكتوبر 2011، ورئاسته لتحالف القوى الوطنية، ووفاته بالقاهرة في 5 أبريل 2020. لا تذكر المقالة دينه في نصها ولا في صندوق معلوماتها."
  en: "English Wikipedia article on Mahmoud Jibril; used for entity facts only. It gives his birth on 28 May 1952 at Bayda, his chairmanship of the National Transitional Council's executive board (as interim prime minister) from March to October 2011, his leadership of the National Forces Alliance, and his death in Cairo on 5 April 2020. The article states no religion for him in its text or infobox."
  es: "Artículo de la Wikipedia en inglés sobre Mahmoud Jibril; utilizado únicamente para obtener información sobre la persona. Indica su nacimiento el 28 de mayo de 1952 en Bayda, su presidencia del consejo ejecutivo del Consejo Nacional de Transición (como primer ministro interino) de marzo a octubre de 2011, su liderazgo de la Alianza de Fuerzas Nacionales y su fallecimiento en El Cairo el 5 de abril de 2020. El artículo no menciona su religión ni en el texto ni en el recuadro informativo."
  fr: "Article de Wikipédia en anglais sur Mahmoud Jibril; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 28 mai 1952 à Bayda, sa présidence du conseil exécutif du Conseil national de transition (en tant que Premier ministre par intérim) de mars à octobre 2011, son rôle à la tête de l’Alliance des forces nationales et son décès au Caire le 5 avril 2020. L’article ne mentionne aucune religion, ni dans son texte ni dans son infobox."
  ur: "محمود جبریل پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 28 مئی 1952 کو بیدا میں ہوئی، مارچ سے اکتوبر 2011 تک قومی عبوری کونسل کے ایگزیکٹو بورڈ کی ان کی سربراہی ⁦(بطور عبوری وزیر اعظم)⁩، نیشنل فورسز الائنس کی ان کی قیادت، اور 5 اپریل 2020 کو قاہرہ میں ان کی موت۔ مضمون اپنے متن یا معلومات کے خانے میں اس کے لیے کوئی مذہب نہیں بتاتا۔"
  tr: "Mahmoud Jibril hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Makalede 28 Mayıs 1952'de Kazablanka'da doğduğu, Mart-Ekim 2011 arasında Ulusal Geçiş Konseyi Yürütme Ofisi başkanlığı (geçici başbakan) görevi, Ulusal Kuvvetler İttifakı başkanlığı ve 5 Nisan 2020'de Kahire'de vefat ettiği belirtilmektedir. Makale, metninde veya bilgi kutusunda dininden bahsetmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Mahmoud Jibril; hanya digunakan untuk fakta entitas. Artikel ini menyebutkan kelahirannya pada 28 Mei 1952 di Casablanca, masa jabatannya sebagai ketua Kantor Eksekutif Dewan Transisi Nasional (Perdana Menteri sementara) dari Maret hingga Oktober 2011, masa kepresidenannya di Aliansi Pasukan Nasional, dan kematiannya di Kairo pada 5 April 2020. Artikel tersebut tidak menyebutkan agamanya dalam teks maupun dalam kotak informasinya."
