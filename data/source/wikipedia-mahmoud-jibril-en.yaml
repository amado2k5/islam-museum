reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 27 October 2026 at the recorded revision, fetched by revision id with the returned id asserted equal. The birth date is cited in the infobox to the Library of Congress authority record, and the birthplace Bayda to the University of Pittsburgh and the Daily Telegraph. The article records his Cairo University degree (1975), his Pittsburgh master's (1980) and doctorate in strategic planning (1984), his heading of Libya's National Planning Council and National Economic Development Board (2007–2011), and his death in Cairo on 5 April 2020 after a cardiac arrest and a positive COVID-19 test."
