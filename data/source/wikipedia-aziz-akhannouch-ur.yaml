summary:
  ar: "مقالة ويكيبيديا الأردية عن عزيز أخنوش؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 31 ديسمبر 1961 — وهو تاريخ يخالف المقالات الأخرى — وأنه رجل أعمال وسياسي مغربي ورئيس مجموعة أكوا ووزير للفلاحة (2007–2021)، وتقدّمه بوصفه رئيس وزراء حاليًّا. تصنيفاتها تدرجه ضمن المغاربة المسلمين، وهو تصنيف لا نصّ."
  en: "Urdu Wikipedia article on Aziz Akhannouch; a short stub used for entity facts only. It gives his birth as 31 December 1961 — a date that conflicts with the other articles — and describes him as a Moroccan businessman and politician, CEO of the Akwa Group and agriculture minister (2007–2021), presented as the sitting prime minister. Its categories file him under Moroccan Muslims, which is a filing, not a text statement."
  es: "Artículo de Wikipedia en urdu sobre Aziz Akhannouch; un breve esbozo que solo incluye datos sobre la persona. Indica que nació el 31 de diciembre de 1961 —fecha que contradice otros artículos— y lo describe como un empresario y político marroquí, director ejecutivo del Grupo Akwa y ministro de agricultura (2007-2021), presentado como el primer ministro en funciones. Sus categorías lo clasifican dentro de la sección de musulmanes marroquíes, lo cual constituye una clasificación, no una declaración textual."
  fr: "L'article Wikipédia en ourdou sur Aziz Akhannouch est une brève ébauche servant uniquement à fournir des informations factuelles. Il indique sa date de naissance comme étant le 31 décembre 1961 – une date qui contredit les autres articles – et le décrit comme un homme d'affaires et homme politique marocain, PDG du groupe Akwa et ministre de l'Agriculture (2007-2021), présenté comme le Premier ministre en exercice. Il est classé dans la catégorie « Musulmans marocains », ce qui relève du classement et non d'une affirmation textuelle."
  ur: "عزیز اخانوچ پر اردو ویکیپیڈیا مضمون؛ ایک مختصر سٹب صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ اس میں ان کی پیدائش 31 دسمبر 1961 ہے - ایک تاریخ جو دوسرے مضامین سے متصادم ہے - اور اسے ایک مراکشی تاجر اور سیاست دان، اکوا گروپ کے سی ای او اور وزیر زراعت (2007–2021) کے طور پر بیان کرتی ہے، جسے موجودہ وزیر اعظم کے طور پر پیش کیا گیا۔ اس کے زمرے اسے مراکش کے مسلمانوں کے تحت فائل کرتے ہیں، جو کہ فائلنگ ہے، ٹیکسٹ سٹیٹمنٹ نہیں۔"
  tr: "Aziz Akhannouch hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılan kısa bir makale. Doğumunun 31 Aralık 1961'de olduğu belirtilir — bu tarih diğer makalelerden farklıdır — ve kendisinin Faslı bir iş insanı, politikacı, ACWA grubunun başkanı ve Tarım Bakanı (2007–2021) olduğu belirtilir; şu anda başbakan olarak sunulur. Sınıflandırmalarında onu Fas Müslümanları arasında da yer alır, ancak bu sınıflandırma metin değildir."
  id: "Artikel Wikipedia Urdu tentang Aziz Akhannouch; artikel singkat yang hanya digunakan untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya pada 31 Desember 1961 — tanggal yang berbeda dari artikel lain — dan bahwa ia adalah pengusaha Maroko, politisi, presiden kelompok ACWA, dan Menteri Pertanian (2007–2021), yang saat ini dipresentasikan sebagai perdana menteri. Klasifikasinya termasuk ia di antara Muslim Maroko, klasifikasi yang bukan teks."
