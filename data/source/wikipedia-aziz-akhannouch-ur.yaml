  ar: "مقالة ويكيبيديا الأردية عن عزيز أخنوش؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 31 ديسمبر 1961 — وهو تاريخ يخالف المقالات الأخرى — وأنه رجل أعمال وسياسي مغربي ورئيس مجموعة أكوا ووزير للفلاحة (2007–2021)، وتقدّمه بوصفه رئيس وزراء حاليًّا. تصنيفاتها تدرجه ضمن المغاربة المسلمين، وهو تصنيف لا نصّ."
  en: "Urdu Wikipedia article on Aziz Akhannouch; a short stub used for entity facts only. It gives his birth as 31 December 1961 — a date that conflicts with the other articles — and describes him as a Moroccan businessman and politician, CEO of the Akwa Group and agriculture minister (2007–2021), presented as the sitting prime minister. Its categories file him under Moroccan Muslims, which is a filing, not a text statement."
