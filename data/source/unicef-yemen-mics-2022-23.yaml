  tr: "\"Yemen, MICS Çoklu Gösterge Küme Anketi 2022-23, Sonuç Raporu,\" UNICEF, MICS Anketleri, Yemen, 2023. Müze tarafından sağlanan ve Yemen'deki dil oranlarını içeren bir araştırma özetinde bahsedilmiştir; müze sayfayı açmamış ve kurucu 21 Kasım 2026'da belirtildiği gibi özetin kullanımına izin vermiştir."
