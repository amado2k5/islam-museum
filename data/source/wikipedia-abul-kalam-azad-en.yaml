summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أبي الكلام آزاد (1888–1958)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في مكة في 11 نوفمبر 1888، وتكوينه العلمي على أيدي معلمين خاصين في المذاهب الفقهية الأربعة، وصحيفته «الهلال»، واعتقاله في رانشي، ورئاسته المؤتمر الوطني الهندي 1923 و1940–1946، ومعارضته تقسيم الهند، ووزارته للتعليم 1947–1958، وكتبه ومنها «ترجمان القرآن» و«غبار خاطر»، ووفاته في دلهي في 22 فبراير 1958."
  en: "English Wikipedia article on Maulana Azad (Abul Kalam Azad, 1888–1958); used for entity facts only. It recounts his birth in Mecca on 11 November 1888, his private formation in the four schools of fiqh, his journal Al-Hilal, his Ranchi internment, his Congress presidencies of 1923 and 1940–1946, his opposition to partition, his tenure as India's first Minister of Education (1947–1958), his books including Tarjuman-ul-Quran and Ghubar-e-Khatir, and his death at Delhi on 22 February 1958."
  es: "Artículo de la Wikipedia en inglés sobre Maulana Azad (Abul Kalam Azad, 1888–1958); utilizado únicamente para datos sobre la persona. Relata su nacimiento en La Meca el 11 de noviembre de 1888, su formación privada en las cuatro escuelas de fiqh, su revista Al-Hilal, su internamiento en Ranchi, sus presidencias del Congreso en 1923 y entre 1940 y 1946, su oposición a la partición, su mandato como primer Ministro de Educación de la India (1947–1958), sus libros, entre ellos Tarjuman-ul-Quran y Ghubar-e-Khatir, y su muerte en Delhi el 22 de febrero de 1958."
  fr: "Article de Wikipédia en anglais sur Maulana Azad (Abul Kalam Azad, 1888-1958); utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à La Mecque le 11 novembre 1888, sa formation privée dans les quatre écoles de fiqh, son journal Al-Hilal, son internement à Ranchi, ses présidences du Congrès en 1923 et de 1940 à 1946, son opposition à la partition, son mandat de premier ministre de l'Éducation de l'Inde (1947-1958), ses ouvrages, notamment Tarjuman-ul-Quran et Ghubar-e-Khatir, et sa mort à Delhi le 22 février 1958."
