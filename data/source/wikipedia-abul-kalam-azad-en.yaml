summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أبي الكلام آزاد (1888–1958)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في مكة في 11 نوفمبر 1888، وتكوينه العلمي على أيدي معلمين خاصين في المذاهب الفقهية الأربعة، وصحيفته «الهلال»، واعتقاله في رانشي، ورئاسته المؤتمر الوطني الهندي 1923 و1940–1946، ومعارضته تقسيم الهند، ووزارته للتعليم 1947–1958، وكتبه ومنها «ترجمان القرآن» و«غبار خاطر»، ووفاته في دلهي في 22 فبراير 1958."
  en: "English Wikipedia article on Maulana Azad (Abul Kalam Azad, 1888–1958); used for entity facts only. It recounts his birth in Mecca on 11 November 1888, his private formation in the four schools of fiqh, his journal Al-Hilal, his Ranchi internment, his Congress presidencies of 1923 and 1940–1946, his opposition to partition, his tenure as India's first Minister of Education (1947–1958), his books including Tarjuman-ul-Quran and Ghubar-e-Khatir, and his death at Delhi on 22 February 1958."
