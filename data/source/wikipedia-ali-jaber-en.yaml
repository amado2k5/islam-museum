  ar: "مقالة ويكيبيديا الإنجليزية عن علي عبد الله جابر؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في أغسطس 1954 (ذي الحجة 1373) ووفاته في 14 ديسمبر 2005، وإمامته الرسمية للمسجد الحرام بين 1981 و1983، وإمامته ضيفاً في رمضان بين 1986 و1989، ومحاضرته في الفقه المقارن بجامعة الملك عبد العزيز بجدة، ولقب «إمام الملك»؛ وصندوقها غير المرجعي يعطي المذهب سني والفقه حنبلي والعقيدة أثري."
  en: "English Wikipedia article on Ali Abdullah Jaber; used for entity facts only. It gives his birth in August 1954 (Dhu al-Hijjah 1373) and death on 14 December 2005, his official imamate of Masjid al-Haram from 1981 to 1983, his Ramadan guest imamates from 1986 to 1989, his lectureship in comparative fiqh at King Abdulaziz University in Jeddah, and the title 'King's Imam'; its unreferenced infobox gives denomination Sunni, jurisprudence Hanbali and creed Athari."
