reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Daei as born on 21 March 1969 in Ardabil. Its infobox gives his religion, uncited, as al-Shi'a (الشيعة); the same value, carried from Wikidata, appears in the Hebrew and Catalan infoboxes, so all of them are counted together as the one infobox source family in the person record's faith note. The article gives 149 caps and 109 goals against the English article's sourced correction to 148 and 108, which is followed."
