summary:
  ar: "مقالة ويكيبيديا العربية عن علي دائي؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 21 مارس 1969 في أردبيل بإيران ومسيرته مهاجمًا وقائدًا للمنتخب الإيراني ومدربًا، ويذكر صندوق معلوماتها ديانته بأنها «الشيعة»."
  en: "Arabic Wikipedia article on Ali Daei; used for entity facts only. It confirms his birth on 21 March 1969 in Ardabil, Iran, and his career as Iran's striker and captain and later as a manager; its infobox gives his religion as 'the Shia' (al-Shi'a)."
  es: "Artículo de Wikipedia en árabe sobre Ali Daei; utilizado únicamente para datos sobre la persona. Confirma su nacimiento el 21 de marzo de 1969 en Ardabil, Irán, y su carrera como delantero y capitán de la selección iraní, y posteriormente como entrenador; su ficha informativa indica que su religión es chiíta (al-Shi'a)."
  fr: "Article Wikipédia en arabe sur Ali Daei; utilisé uniquement pour les informations sur l'entité. Il confirme sa naissance le 21 mars 1969 à Ardabil, en Iran, ainsi que sa carrière d'attaquant et de capitaine de l'équipe nationale iranienne, puis d'entraîneur; son infobox indique qu'il est chiite (al-Shi'a)."
  ur: "علی داعی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 21 مارچ 1969 کو اردبیل، ایران میں اس کی پیدائش کی تصدیق کرتا ہے، اور ایران کے اسٹرائیکر اور کپتان کے طور پر اور بعد میں ایک منیجر کے طور پر ان کا کیریئر؛ اس کا انفو باکس اس کا مذہب 'شیعہ' ⁦(الشیعہ)⁩ دیتا ہے۔"
  tr: "Ali Daei hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Bu makale, 21 Mart 1969'da İran'ın Erdebil kentinde doğduğunu ve forvet, İran milli takımı kaptanı ve antrenör olarak kariyerini doğrular. Bilgi kutusunda dini 'Şii' olarak belirtilmiştir."
  id: "Artikel Wikipedia berbahasa Arab tentang Ali Daei hanya digunakan untuk fakta entitas tersebut. Artikel ini mengonfirmasi kelahirannya pada 21 Maret 1969 di Ardabil, Iran, dan kariernya sebagai penyerang, kapten tim nasional Iran, dan pelatih. Infobox tersebut menyebutkan agamanya sebagai 'Syiah'."
