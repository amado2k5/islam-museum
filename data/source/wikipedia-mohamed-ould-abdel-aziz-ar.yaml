summary:
  ar: "مقالة ويكيبيديا العربية عن محمد ولد عبد العزيز؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه عند الولادة محمد ولد عبد العزيز ولد اعلية، وولادته في 20 ديسمبر 1956 في أكجوجت، ورئاسته الثامنة لموريتانيا (2009–2019)، وإدانته لاحقا. لا تذكر دينه في نصّها؛ وتصنّفه في «المسلمين الموريتانيين»."
  en: "Arabic Wikipedia article on Mohamed Ould Abdel Aziz; used for entity facts only. It gives his name at birth as Mohamed Ould Abdel Aziz Ould Eleya, his birth on 20 December 1956 at Akjoujt, his presidency as Mauritania's eighth president (2009–2019), and his later conviction. Its text says nothing about his religion; it files him under Mauritanian Muslims."
  es: "Artículo de Wikipedia en árabe sobre Mohamed Ould Abdel Aziz; utilizado únicamente para datos sobre la persona. Indica que su nombre de nacimiento era Mohamed Ould Abdel Aziz Ould Eleya, que nació el 20 de diciembre de 1956 en Akjoujt, que fue el octavo presidente de Mauritania (2009-2019) y que posteriormente fue condenado. El texto no menciona su religión; lo clasifica dentro de la categoría de musulmanes mauritanos."
  fr: "Article Wikipédia en arabe sur Mohamed Ould Abdel Aziz; utilisé uniquement pour les informations relatives à l'entité. Il indique son nom de naissance, Mohamed Ould Abdel Aziz Ould Eleya, sa date de naissance, le 20 décembre 1956 à Akjoujt, sa présidence en tant que huitième président de la Mauritanie (2009-2019) et sa condamnation ultérieure. Le texte ne mentionne rien de sa religion; il est classé parmi les musulmans mauritaniens."
  ur: "عربی ویکیپیڈیا مضمون محمد اولد عبدالعزیز پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ پیدائش کے وقت ان کا نام محمد اولد عبدالعزیز اولڈ ایلیا، 20 دسمبر 1956 کو اکجوجٹ میں ان کی پیدائش، موریطانیہ کے آٹھویں صدر (2009–2019) کے طور پر ان کی صدارت، اور بعد میں ان کی سزایابی کے نام سے منسوب ہے۔ اس کا متن اس کے مذہب کے بارے میں کچھ نہیں کہتا۔ یہ اسے موریطانیہ کے مسلمانوں کے تحت فائل کرتا ہے۔"
