  ar: "مقالة ويكيبيديا العربية عن محمد ولد عبد العزيز؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه عند الولادة محمد ولد عبد العزيز ولد اعلية، وولادته في 20 ديسمبر 1956 في أكجوجت، ورئاسته الثامنة لموريتانيا (2009–2019)، وإدانته لاحقا. لا تذكر دينه في نصّها؛ وتصنّفه في «المسلمين الموريتانيين»."
  en: "Arabic Wikipedia article on Mohamed Ould Abdel Aziz; used for entity facts only. It gives his name at birth as Mohamed Ould Abdel Aziz Ould Eleya, his birth on 20 December 1956 at Akjoujt, his presidency as Mauritania's eighth president (2009–2019), and his later conviction. Its text says nothing about his religion; it files him under Mauritanian Muslims."
