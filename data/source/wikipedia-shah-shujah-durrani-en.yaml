summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شجاع شاه الدراني؛ تُستخدم لوقائع الكيان فقط. تروي مولده في قندهار في 4 نوفمبر 1785 وحكمه للإمبراطورية الدرانية ⁦(1803-1809 ثم 1839-1842)⁩، ومنفاه في البنجاب والهند وتنازله عن ألماستي كوه نور ودرياي نور لرانجيت سينغ، وعودته إلى العرش بدعم بريطاني وسيخي سنة 1839، واغتياله في كابل في 5 أبريل 1842. لا يعطي صندوق معلوماتها أي قيمة للدين."
  en: "English Wikipedia article on Shuja Shah Durrani; used for entity facts only. It recounts his birth at Kandahar on 4 November 1785, his two reigns over the Durrani Empire (1803–1809 and 1839–1842), his exile in the Punjab and India and his surrender of the Koh-i-Noor and Darya-i-Noor diamonds to Ranjit Singh, his restoration by British and Sikh arms in 1839, and his assassination at Kabul on 5 April 1842. Its infobox carries no religion value."
  es: "Artículo de la Wikipedia en inglés sobre Shuja Shah Durrani; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Kandahar el 4 de noviembre de 1785, sus dos reinados sobre el Imperio Durrani (1803-1809 y 1839-1842), su exilio en el Punjab y la India, la entrega de los diamantes Koh-i-Noor y Darya-i-Noor a Ranjit Singh, su restauración por las fuerzas británicas y sij en 1839 y su asesinato en Kabul el 5 de abril de 1842. Su ficha informativa no tiene relevancia religiosa."
  fr: "Article de Wikipédia en anglais sur Shuja Shah Durrani; utilisé uniquement pour les informations sur l'entité. Il relate sa naissance à Kandahar le 4 novembre 1785, ses deux règnes sur l'empire Durrani (1803-1809 et 1839-1842), son exil au Pendjab et en Inde et sa remise des diamants Koh-i-Noor et Darya-i-Noor à Ranjit Singh, sa restauration par les Britanniques et les Sikhs en 1839, et son assassinat à Kaboul le 5 avril 1842. Son infobox ne contient aucune information sur la religion."
  ur: "شجاع شاہ درانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 4 نومبر 1785 کو قندھار میں ان کی پیدائش، درانی سلطنت پر ان کے دو دور حکومت ⁦(1803-1809 اور 1839-1842)⁩، پنجاب اور ہندوستان میں اس کی جلاوطنی اور کوہ نور اور دریا نور ہیروں کے حوالے کرنے کا ذکر ہے، اس کے سکھوں اور انگریزوں کے ہاتھوں رنجیت سنگھ اور اس کے آرام دہ اور پرسکون بادشاہوں کے ہاتھوں 5 اپریل 1842 کو کابل میں قتل۔ اس کے انفو باکس میں مذہب کی کوئی اہمیت نہیں ہے۔"
  tr: "Şuca Şah el-Durrani hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 4 Kasım 1785'te Kandahar'daki doğumunu, Durrani İmparatorluğu'nu yönetmesini (1803-1809 ve ardından 1839-1842), Pencap ve Hindistan'a sürgününü, Almasti Koh-i-Noor ve Daryai Noor'u Ranjit Singh'e devrini, 1839'da İngiliz ve Sih desteğiyle tahta dönüşünü ve 5 Nisan 1842'de Kabil'de suikastını anlatır. Bilgi kutusu dine hiçbir değer vermez."
  id: "Artikel Wikipedia bahasa Inggris tentang Shuja Shah al-Durrani; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Kandahar pada 4 November 1785, pemerintahannya atas Kekaisaran Durrani (1803-1809 dan kemudian 1839-1842), pengasingannya di Punjab dan India, penyerahan Almasti Koh-i-Noor dan Daryai Noor kepada Ranjit Singh, kembalinya tahta dengan dukungan Inggris dan Sikh pada tahun 1839, serta pembunuhannya di Kabul pada 5 April 1842. Kotak info-nya tidak memberikan nilai pada agama."
