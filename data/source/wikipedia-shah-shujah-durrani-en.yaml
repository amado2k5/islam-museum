summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شجاع شاه الدراني؛ تُستخدم لوقائع الكيان فقط. تروي مولده في قندهار في 4 نوفمبر 1785 وحكمه للإمبراطورية الدرانية (1803-1809 ثم 1839-1842)، ومنفاه في البنجاب والهند وتنازله عن ألماستي كوه نور ودرياي نور لرانجيت سينغ، وعودته إلى العرش بدعم بريطاني وسيخي سنة 1839، واغتياله في كابل في 5 أبريل 1842. لا يعطي صندوق معلوماتها أي قيمة للدين."
  en: "English Wikipedia article on Shuja Shah Durrani; used for entity facts only. It recounts his birth at Kandahar on 4 November 1785, his two reigns over the Durrani Empire (1803–1809 and 1839–1842), his exile in the Punjab and India and his surrender of the Koh-i-Noor and Darya-i-Noor diamonds to Ranjit Singh, his restoration by British and Sikh arms in 1839, and his assassination at Kabul on 5 April 1842. Its infobox carries no religion value."
