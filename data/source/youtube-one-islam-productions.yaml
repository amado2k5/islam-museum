summary:
  ar: "قناة «ون إسلام برودكشنز» على يوتيوب (@OneIslamProductions)، وهي قناة محاضرات وتذكيرات تنسب أوصاف مقاطعها إنتاج أعمالها وإخراجها إلى صبحي الشيخ وتربط بشركته «ون فور كيدز»؛ مصدر أولي لمؤلف القناة وعملها وانتشارها، لا مصدر مستقل مؤيد."
  en: "The One Islam Productions YouTube channel (@OneIslamProductions), a lectures and reminders channel whose own video descriptions credit its productions to Subhi Alshaik as producer and director and link his company One 4 Kids; a primary source for the channel's authorship, work and reach, not independent corroboration."
  es: "El canal de YouTube One Islam Productions (@OneIslamProductions), un canal de conferencias y recordatorios cuyas propias descripciones de video atribuyen sus producciones a Subhi Alshaik como productor y director y vinculan a su compañía One 4 Kids; una fuente primaria para la autoría, el trabajo y el alcance del canal, no una corroboración independiente."
  fr: "La chaîne YouTube One Islam Productions (@OneIslamProductions), une chaîne de conférences et de rappels dont les descriptions vidéo attribuent ses productions à Subhi Alshaik en tant que producteur et réalisateur et mentionnent sa société One 4 Kids; une source principale pour l'auteur, le travail et la portée de la chaîne, et non une corroboration indépendante."
  ur: "ون اسلام پروڈکشنز کا یوٹیوب چینل (@OneIslamProductions)، ایک لیکچرز اور ریمائنڈرز چینل جس کی اپنی ویڈیو کی تفصیل اس کی پروڈکشنز کا کریڈٹ سبی الشائیک کو بطور پروڈیوسر اور ڈائریکٹر اور اس کی کمپنی One 4 Kids کو لنک کرتی ہے۔ چینل کی تصنیف، کام اور رسائی کے لیے ایک بنیادی ذریعہ، نہ کہ آزاد تصدیق۔"
