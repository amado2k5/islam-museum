  ar: "مقالة ويكيبيديا الإنجليزية عن رحمان تشيشتي (وُلد في 4 تشرين الأول 1978 في مظفر آباد)، سياسي المحافظين البريطاني والمحامي، عضو البرلمان عن غيلينغهام ورينهام 2010–2024 والمبعوث الخاص لرئيس الوزراء لحرية الدين أو المعتقد 2019–2020. تقول المقالة إنه مسلم ممارس وأنه أدى قسم الولاء الأول على القرآن."
  en: "English Wikipedia article on Rehman Chishti (born 4 October 1978 in Muzaffarabad), the British Conservative politician and barrister, MP for Gillingham and Rainham 2010-2024 and the Prime Minister's Special Envoy for Freedom of Religion or Belief 2019-2020. The article states that he is a practising Muslim and took his first oath of allegiance on a Quran."
