reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Used for his birth on 4 October 1978 in Muzaffarabad, his arrival in the United Kingdom aged six in 1984, his call to the Bar by Lincoln's Inn in 2001, his years as a political adviser to Benazir Bhutto 1999-2007, his election as MP in 2010, his envoy post 2019-2020 and his resignation from it on 14 September 2020, and his junior ministerial post in 2022. For faith, its personal-life section states in its own text that he is a practising Muslim and took his first oath of allegiance on a Quran, citing his own page on the UK Parliament website; no school or order is named. His father's posts as an imam and as a religious-affairs adviser are family background and were not used."
