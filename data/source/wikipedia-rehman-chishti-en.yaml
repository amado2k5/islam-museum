summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رحمان تشيشتي ⁦(وُلد في 4 تشرين الأول 1978 في مظفر آباد)⁩، سياسي المحافظين البريطاني والمحامي، عضو البرلمان عن غيلينغهام ورينهام 2010–2024 والمبعوث الخاص لرئيس الوزراء لحرية الدين أو المعتقد 2019–2020. تقول المقالة إنه مسلم ممارس وأنه أدى قسم الولاء الأول على القرآن."
  en: "English Wikipedia article on Rehman Chishti (born 4 October 1978 in Muzaffarabad), the British Conservative politician and barrister, MP for Gillingham and Rainham 2010-2024 and the Prime Minister's Special Envoy for Freedom of Religion or Belief 2019-2020. The article states that he is a practising Muslim and took his first oath of allegiance on a Quran."
  es: "Artículo de la Wikipedia en inglés sobre Rehman Chishti (nacido el 4 de octubre de 1978 en Muzaffarabad), político y abogado conservador británico, diputado por Gillingham y Rainham entre 2010 y 2024 y enviado especial del Primer Ministro para la libertad de religión o creencia entre 2019 y 2020. El artículo afirma que es musulmán practicante y que prestó su primer juramento de lealtad sobre el Corán."
  fr: "Article de Wikipédia en anglais sur Rehman Chishti (né le 4 octobre 1978 à Muzaffarabad), homme politique conservateur britannique et avocat, député de Gillingham et Rainham de 2010 à 2024 et envoyé spécial du Premier ministre pour la liberté de religion ou de conviction de 2019 à 2020. L'article indique qu'il est un musulman pratiquant et qu'il a prêté son premier serment d'allégeance sur le Coran."
  ur: "رحمن چشتی ⁦(4 اکتوبر 1978 کو مظفرآباد میں پیدا ہوئے)⁩، برطانوی کنزرویٹو سیاست دان اور بیرسٹر، گلنگھم اور رینہم کے ایم پی 2010-2024 اور وزیر اعظم کے خصوصی ایلچی برائے آزادی یا عقیدہ 2019-2020 پر انگریزی ویکیپیڈیا کا مضمون۔ مضمون میں کہا گیا ہے کہ وہ ایک باعمل مسلمان ہے اور اس نے قرآن پر اپنی بیعت کا پہلا حلف اٹھایا۔"
