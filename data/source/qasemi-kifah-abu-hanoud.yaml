summary:
  ar: «خبر أكاديمية القاسمي عن استضافة قسم الدراسات الإسلامية فيها الدكتورة كفاح أبو هنود (نُشر في 14 فبراير 2024). المصدر المستقل لمنصبها محاضِرة في جامعة العلوم التطبيقية في الأردن ولمحاضرتها في ديسمبر 2023 عن مفهوم الجندر في الإسلام.»
  en: "Al-Qasemi Academic College's news item on its Islamic Studies department hosting Dr. Kifah Abu Hanoud (published 14 February 2024). The independent source for her post as a lecturer at the Applied Science University in Jordan and her December 2023 lecture on the concept of gender in Islam."
  ur: «القاسمی کالج کی خبر (14 فروری 2024ء)۔»
