  ur: "دستاویز «Yemen's Tourist Guide (Learn Useful Arabic Phrases, p. 27)»، Yemen Times۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ بانی کے فراہم کردہ تحقیقی خلاصے سے ہے، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ ان کے لیے دیا گیا: یمنی عربی کے عام جملے۔"
  fr: "Le document « Yemen's Tourist Guide (Learn Useful Arabic Phrases, p. 27) » (Yemen Times). Le musée ne l'a pas ouvert lui-même : ce qu'on en sait vient d'un résumé de recherche fourni au musée par le fondateur, qui en a approuvé l'usage le 21 novembre 2026. Cité pour : les expressions courantes de l'arabe yéménite."
  es: "El documento «Yemen's Tourist Guide (Learn Useful Arabic Phrases, p. 27)» (Yemen Times). El museo no lo abrió por sí mismo: lo que se sabe de él procede de un resumen de investigación entregado al museo por el fundador, que aprobó su uso el 21 de noviembre de 2026. Citado para: las expresiones comunes del árabe yemení."
  tr: "\"Yemen's Tourist Guide (Faydalı Arapça İfadeleri Öğrenin), s. 27\" adlı belge, Yemen Times. Müze bu referansı kendisi açmadı; kurucusunun müzeye sunduğu bir araştırma özetinden söylenenleri öğrendi ve 21 Kasım 2026'da kullanımını onayladı. Atıf alanı: Yemen Günlük Dilinde Yaygın İfadeler."
