  ar: "وثيقة «Yemen's Tourist Guide (Learn Useful Arabic Phrases, p. 27)»، Yemen Times. لم يفتح المتحف هذا المرجع بنفسه؛ عُرف ما قيل عنه من ملخص بحثي قدّمه المؤسس إلى المتحف ووافق على استعماله في 21 نوفمبر 2026. يُستشهد به في: عبارات شائعة في العامية اليمنية."
