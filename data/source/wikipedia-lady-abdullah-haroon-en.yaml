summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ليدي عبد الله هارون (1886–1966)، واسمها الحقيقي نصرت خانم؛ تُستخدم لوقائع الكيان فقط. تذكر أنها وُلدت في إيران في أسرة شيعية، ثم استقرت في كراتشي حيث تزوجت عبد الله هارون سنة 1914، وأنها أسست مدرسة في بيتها وجمعية «أنجمن خواتين» لتعليم نساء السند ورفاههن، ودعمت حركة الخلافة، وانتُخبت سنة 1943 رئيسة لرابطة نساء مسلمي عموم الهند، وكانت نائبة رئيس جمعية نساء باكستان."
  en: "English Wikipedia article on Lady Abdullah Haroon (1886–1966), real name Nusrat Khanum; used for entity facts only. It states that she was born in Iran into a Shia family, later settled in Karachi, where in 1914 she married Abdullah Haroon, that she started a school at her home and founded the Anjuman-i-Khawateen for the education and welfare of the women of Sindh, supported the Khilafat Movement, was elected president of the All India Women Muslim League in 1943, and was vice-president of the All Pakistan Women's Association."
  es: "Artículo de la Wikipedia en inglés sobre Lady Abdullah Haroon (1886-1966), cuyo nombre real era Nusrat Khanum; utilizado únicamente para datos biográficos. En él se afirma que nació en Irán en el seno de una familia chiíta, que posteriormente se estableció en Karachi, donde en 1914 se casó con Abdullah Haroon, que fundó una escuela en su casa y la Anjuman-i-Khawateen para la educación y el bienestar de las mujeres de Sindh, que apoyó el Movimiento Khilafat, que fue elegida presidenta de la Liga Musulmana de Mujeres de la India en 1943 y que fue vicepresidenta de la Asociación de Mujeres de Pakistán."
  fr: "L'article de Wikipédia en anglais consacré à Lady Abdullah Haroon (1886-1966), de son vrai nom Nusrat Khanum, est utilisé uniquement à titre informatif. Il indique qu'elle est née en Iran dans une famille chiite, qu'elle s'est ensuite installée à Karachi où, en 1914, elle a épousé Abdullah Haroon, qu'elle a ouvert une école à son domicile et fondé l'Anjuman-i-Khawateen pour l'éducation et le bien-être des femmes du Sindh, qu'elle a soutenu le mouvement Khilafat, qu'elle a été élue présidente de la Ligue musulmane des femmes de toute l'Inde en 1943 et vice-présidente de l'Association des femmes du Pakistan."
  ur: "لیڈی عبداللہ ہارون (1886-1966) پر انگریزی ویکیپیڈیا مضمون، اصل نام نصرت خانم؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بتایا گیا ہے کہ وہ ایران میں ایک شیعہ گھرانے میں پیدا ہوئیں، بعد ازاں کراچی میں آباد ہوئیں، جہاں 1914 میں عبداللہ ہارون سے شادی کی، کہ اس نے اپنے گھر پر ایک اسکول شروع کیا اور سندھ کی خواتین کی تعلیم و بہبود کے لیے انجمن الخواتین کی بنیاد رکھی، تحریک خلافت کی حمایت کی، آل انڈیا ویمن مسلم لیگ کی صدر منتخب ہوئیں اور 1943 میں آل انڈیا ویمن مسلم لیگ کی صدر منتخب ہوئیں اور 1943 میں خواتین کی پاکستان کی صدر منتخب ہوئیں۔"
  tr: "Gerçek adı Nusrat Hanım olan Lady Abdullah Haroon (1886–1966) hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmaktadır. İran'da Şii bir ailede doğduğu, ardından Karaçi'ye yerleştiği ve 1914'te Abdullah Haroon ile evlendiği belirtilmektedir. Evinde bir okul ve Sindh kadınlarını eğitmek ve refahını sağlamak için 'Anjman Khawateen' derneğini kurmuş, Hilafe Hareketi'ni desteklemiş, 1943'te Tüm Hindistan Müslüman Kadınlar Derneği başkanı seçilmiş ve Pakistan Kadınlar Derneği başkan yardımcılığını üstlenmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Lady Abdullah Haroon (1886–1966), yang nama aslinya Nusrat Khanum; hanya digunakan untuk fakta entitas tersebut. Dicatat bahwa dia lahir di Iran dalam keluarga Syiah, kemudian menetap di Karachi, di mana dia menikah dengan Abdullah Haroon pada tahun 1914. Dia mendirikan sebuah sekolah di rumahnya dan asosiasi 'Anjman Khawateen' untuk mendidik dan menyejahterai perempuan Sindh, mendukung Gerakan Khilafa, dan terpilih sebagai presiden Asosiasi Perempuan Muslim India Seluruh India pada tahun 1943, serta menjadi wakil presiden Asosiasi Perempuan Pakistan."
