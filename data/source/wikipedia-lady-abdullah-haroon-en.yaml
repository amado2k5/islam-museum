summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ليدي عبد الله هارون (1886–1966)، واسمها الحقيقي نصرت خانم؛ تُستخدم لوقائع الكيان فقط. تذكر أنها وُلدت في إيران في أسرة شيعية، ثم استقرت في كراتشي حيث تزوجت عبد الله هارون سنة 1914، وأنها أسست مدرسة في بيتها وجمعية «أنجمن خواتين» لتعليم نساء السند ورفاههن، ودعمت حركة الخلافة، وانتُخبت سنة 1943 رئيسة لرابطة نساء مسلمي عموم الهند، وكانت نائبة رئيس جمعية نساء باكستان."
  en: "English Wikipedia article on Lady Abdullah Haroon (1886–1966), real name Nusrat Khanum; used for entity facts only. It states that she was born in Iran into a Shia family, later settled in Karachi, where in 1914 she married Abdullah Haroon, that she started a school at her home and founded the Anjuman-i-Khawateen for the education and welfare of the women of Sindh, supported the Khilafat Movement, was elected president of the All India Women Muslim League in 1943, and was vice-president of the All Pakistan Women's Association."
