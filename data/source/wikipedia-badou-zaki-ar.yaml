summary:
  ar: "مقالة ويكيبيديا العربية عن بادو الزاكي؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 2 أبريل 1959 في سيدي قاسم، وقيادته منتخب المغرب إلى نهائي كأس الأمم الأفريقية 2004، وتوليه تدريب منتخب الأردن حالياً."
  en: "Arabic Wikipedia article on Badou Zaki; used for entity facts only. It gives his birth as 2 April 1959 in Sidi Kacem, records that he led Morocco to the 2004 Africa Cup of Nations final, and that he currently coaches Jordan."
  es: "Artículo en árabe de la Wikipedia sobre Badou Zaki; utilizado únicamente para obtener información sobre la persona. Indica que nació el 2 de abril de 1959 en Sidi Kacem, que dirigió a Marruecos hasta la final de la Copa Africana de Naciones de 2004 y que actualmente entrena a Jordania."
  fr: "Article Wikipédia en arabe sur Badou Zaki; utilisé uniquement pour les informations le concernant. Il indique sa date de naissance, le 2 avril 1959, à Sidi Kacem, mentionne qu'il a mené le Maroc en finale de la Coupe d'Afrique des Nations 2004 et qu'il est actuellement entraîneur de la Jordanie."
  ur: "بدو زکی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 2 اپریل 1959 کو سیدی کاسیم میں ہوئی، ریکارڈ ہے کہ اس نے مراکش کو 2004 کے افریقہ کپ آف نیشنز کے فائنل تک پہنچایا، اور یہ کہ وہ فی الحال اردن کے کوچ ہیں۔"
  tr: "Badou Zaki hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılır. 2 Nisan 1959'da Sidi Kacem'de doğmasıyla hatırlanır; Fas milli takımını 2004 Afrika Uluslar Kupası finaline taşımış ve şu anda Ürdün milli takımını çalıştırmaktadır."
  id: "Artikel Wikipedia bahasa Arab tentang Badou Zaki; hanya digunakan untuk fakta entitas. Ia dikenang karena kelahirannya pada 2 April 1959 di Sidi Kacem, memimpin tim nasional Maroko ke final Piala Afrika 2004, dan saat ini melatih tim nasional Yordania."
