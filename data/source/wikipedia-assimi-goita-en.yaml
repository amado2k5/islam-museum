summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أسيمي غويتا؛ تُستخدم لوقائع الكيان فقط. تروي قيادته انقلاب 2020 ورئاسته اللجنة الوطنية لإنقاذ الشعب ثم منصب نائب الرئيس المؤقت، واستيلاءه على السلطة في مايو 2021 ورئاسته المؤقتة ثم رئاسته السادسة لمالي منذ 2025، وانسحاب مالي من الإيكواس وتأسيس تحالف دول الساحل. وفي حياته الشخصية تقول نصا إنه مسلم، وتروي الاعتداء عليه أثناء صلاته في الجامع الكبير في باماكو في عيد الأضحى 2021؛ وتصنّفه ضمن «مسلمي مالي السنة» تصنيفا لا نصا."
  en: "English Wikipedia article on Assimi Goïta; used for entity facts only. It recounts his leadership of the 2020 coup and the CNSP junta, his interim vice presidency under Bah Ndaw, his May 2021 seizure of power and interim presidency, his position as sixth President of Mali since 2025, Mali's withdrawal from ECOWAS and the founding of the Alliance of Sahel States. Its Personal life section states in text that he is Muslim, and it recounts the knife attack on him while he was praying at Bamako's Grand Mosque during Eid al-Adha in 2021; it files him under Malian Sunni Muslims, a category filing rather than a text statement."
  es: "Artículo de la Wikipedia en inglés sobre Assimi Goïta; utilizado únicamente para datos sobre la persona. Relata su liderazgo en el golpe de Estado de 2020 y la junta del CNSP, su vicepresidencia interina bajo Bah Ndaw, su toma del poder y presidencia interina en mayo de 2021, su posición como sexto presidente de Malí desde 2025, la retirada de Malí de la CEDEAO y la fundación de la Alianza de Estados del Sahel. En la sección de Vida personal se indica que es musulmán y se relata el ataque con cuchillo que sufrió mientras rezaba en la Gran Mezquita de Bamako durante el Eid al-Adha de 2021; se le clasifica como musulmán sunita maliense, una categoría que no se especifica en el texto."
  fr: "L'article Wikipédia en anglais consacré à Assimi Goïta, utilisé uniquement à des fins d'information, relate son rôle à la tête du coup d'État de 2020 et de la junte du CNSP, sa vice-présidence par intérim sous Bah Ndaw, sa prise de pouvoir et sa présidence par intérim en mai 2021, sa fonction de sixième président du Mali depuis 2025, le retrait du Mali de la CEDEAO et la création de l'Alliance des États du Sahel. La section « Vie personnelle » indique qu'il est musulman et relate l'agression au couteau dont il a été victime alors qu'il priait à la Grande Mosquée de Bamako pendant l'Aïd al-Adha en 2021; il est classé dans la catégorie « Musulmans sunnites maliens », une classification par catégorie plutôt qu'une affirmation textuelle."
  ur: "Assimi Goïta پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی 2020 کی بغاوت اور CNSP جنتا کی قیادت، باہ ندو کے تحت ان کی عبوری نائب صدارت، مئی 2021 میں اقتدار پر قبضہ اور عبوری صدارت، 2025 سے مالی کے چھٹے صدر کی حیثیت سے ان کی پوزیشن، ECOWAS سے مالی کی دستبرداری اور Sahel Alliance کے قیام کا ذکر ہے۔ اس کے ذاتی زندگی کے حصے میں متن میں لکھا گیا ہے کہ وہ مسلمان ہے، اور اس میں اس پر چاقو سے حملے کا ذکر ہے جب وہ 2021 میں عید الاضحی کے دوران بماکو کی عظیم الشان مسجد میں نماز ادا کر رہے تھے۔ یہ اسے مالیان سنی مسلمانوں کے تحت فائل کرتا ہے، ٹیکسٹ سٹیٹمنٹ کے بجائے ایک زمرہ فائلنگ۔"
  tr: "Assimi Goita hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Liderliği, 2020 darbesini, Halkın Kurtuluşu Ulusal Komitesi başkanlığını, ardından geçici başkan yardımcılığını, Mayıs 2021'de iktidarı ele geçirmesini, geçici başkanlığını, ardından 2025'ten bu yana Mali'nin altıncı başkanlığını, Mali'nin ECOWAS'tan çekilmesini ve Sahel İttifakı'nın kurulmasını anlatır. Kişisel hayatında açıkça Müslüman olduğunu belirtir ve 2021 Kurban Bayramı sırasında Bamako'daki Büyük Camii namazı sırasında kendisine yapılan saldırıyı anlatır; onu \"Mali'nin Sünni Müslümanları\" arasında açıkça belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Assimi Goita; digunakan hanya untuk fakta entitas tersebut. Kepemimpinannya menceritakan kudeta 2020, kepemimpinannya di Komite Nasional untuk Penyelamatan Rakyat, kemudian wakil presiden sementara, pengambilalihan kekuasaannya pada Mei 2021, kepresidenan sementara, kemudian kepresidenan keenam Mali sejak 2025, penarikan Mali dari ECOWAS, dan pembentukan Aliansi Sahel. Dalam kehidupan pribadinya, secara eksplisit dinyatakan bahwa ia beragama Muslim, dan menceritakan serangan terhadapnya saat salat di Masjid Agung Bamako pada Idul Fitri 2021; mengklasifikasikannya di antara \"Muslim Sunni Mali\" dengan cara yang tidak eksplisit."
