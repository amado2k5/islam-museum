summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أسيمي غويتا؛ تُستخدم لوقائع الكيان فقط. تروي قيادته انقلاب 2020 ورئاسته اللجنة الوطنية لإنقاذ الشعب ثم منصب نائب الرئيس المؤقت، واستيلاءه على السلطة في مايو 2021 ورئاسته المؤقتة ثم رئاسته السادسة لمالي منذ 2025، وانسحاب مالي من الإيكواس وتأسيس تحالف دول الساحل. وفي حياته الشخصية تقول نصا إنه مسلم، وتروي الاعتداء عليه أثناء صلاته في الجامع الكبير في باماكو في عيد الأضحى 2021؛ وتصنّفه ضمن «مسلمي مالي السنة» تصنيفا لا نصا."
  en: "English Wikipedia article on Assimi Goïta; used for entity facts only. It recounts his leadership of the 2020 coup and the CNSP junta, his interim vice presidency under Bah Ndaw, his May 2021 seizure of power and interim presidency, his position as sixth President of Mali since 2025, Mali's withdrawal from ECOWAS and the founding of the Alliance of Sahel States. Its Personal life section states in text that he is Muslim, and it recounts the knife attack on him while he was praying at Bamako's Grand Mosque during Eid al-Adha in 2021; it files him under Malian Sunni Muslims, a category filing rather than a text statement."
