summary:
  ar: "مقالة ويكيبيديا الأردية عن رتھ فاؤ؛ تُستخدم لوقائع الكيان فقط. تصفها بأنها طبيبة وجراحة وعضوة في جمعية بنات قلب مريم، وُلدت في 9 سبتمبر 1929 في لايبزيغ، وكرّست حياتها منذ الستينيات لعلاج الجذام في باكستان، وتوفيت في 10 أغسطس 2017 في كراتشي."
  en: "Urdu Wikipedia article on Ruth Pfau; used for entity facts only. It describes her as a physician and surgeon and a member of the Society of the Daughters of the Heart of Mary, born 9 September 1929 at Leipzig, who devoted her life from the 1960s to treating leprosy in Pakistan and died on 10 August 2017 at Karachi."
  es: "Artículo de Wikipedia en urdu sobre Ruth Pfau; utilizado únicamente para datos sobre la persona. La describe como médica y cirujana, miembro de la Sociedad de las Hijas del Corazón de María, nacida el 9 de septiembre de 1929 en Leipzig, quien dedicó su vida desde la década de 1960 al tratamiento de la lepra en Pakistán y falleció el 10 de agosto de 2017 en Karachi."
  fr: "Article de Wikipédia en ourdou sur Ruth Pfau; utilisé uniquement à des fins d’information sur l’entité. Il la décrit comme médecin et chirurgienne, membre de la Société des Filles du Cœur de Marie, née le 9 septembre 1929 à Leipzig, qui a consacré sa vie, à partir des années 1960, au traitement de la lèpre au Pakistan et est décédée le 10 août 2017 à Karachi."
