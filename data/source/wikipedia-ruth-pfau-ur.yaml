  ar: "مقالة ويكيبيديا الأردية عن رتھ فاؤ؛ تُستخدم لوقائع الكيان فقط. تصفها بأنها طبيبة وجراحة وعضوة في جمعية بنات قلب مريم، وُلدت في 9 سبتمبر 1929 في لايبزيغ، وكرّست حياتها منذ الستينيات لعلاج الجذام في باكستان، وتوفيت في 10 أغسطس 2017 في كراتشي."
  en: "Urdu Wikipedia article on Ruth Pfau; used for entity facts only. It describes her as a physician and surgeon and a member of the Society of the Daughters of the Heart of Mary, born 9 September 1929 at Leipzig, who devoted her life from the 1960s to treating leprosy in Pakistan and died on 10 August 2017 at Karachi."
