  ar: "مقالة ويكيبيديا التركية عن أدهم باشا؛ تُستخدم لوقائع الكيان فقط، وتعتمد على مدخل «غازي أدهم باشا» في الموسوعة الإسلامية التركية. تعطي ميلاده سنة 1844 في إسطنبول ووفاته في 17 ديسمبر 1909 في مصر ودفنه في مقبرة أيوب بإسطنبول."
  en: "Turkish Wikipedia article on Edhem Paşa; used for entity facts only, resting on the TDV İslâm Ansiklopedisi entry Gazi Edhem Paşa. It gives his birth in 1844 at Istanbul, his death on 17 December 1909 in Egypt and his burial in Eyüp Cemetery, Istanbul."
