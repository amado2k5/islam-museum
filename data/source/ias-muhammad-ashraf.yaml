summary:
  ar: "سيرة محمد أشرف في أكاديمية العالم الإسلامي للعلوم؛ توثّق دكتوراهه في علم النبات من جامعة ليفربول سنة 1986 في تحسين تحمّل الملوحة، ومنصبه نائبًا لرئيس جامعة الزراعة في فيصل آباد، وأبحاثه في فسيولوجيا إجهاد النبات، وجوائزه ومنها جائزة الإنجاز مدى الحياة (2013) وهلال الامتياز (2016). لا تذكر سنة ميلاده."
  en: "Biographical profile of Muhammad Ashraf at the Islamic World Academy of Sciences; it records his Liverpool PhD of 1986 in botany on improving salinity tolerance, his vice-chancellorship of the University of Agriculture, Faisalabad, his plant stress physiology research programme, and his awards including the HEC Lifetime Achievement Award (2013) and the Hilal-i-Imtiaz (2016). It gives no birth year."
  es: "Perfil biográfico de Muhammad Ashraf en la Academia Islámica Mundial de Ciencias; en él se recoge su doctorado en botánica por la Universidad de Liverpool en 1986, centrado en la mejora de la tolerancia a la salinidad, su cargo como vicerrector de la Universidad de Agricultura de Faisalabad, su programa de investigación sobre fisiología del estrés vegetal y sus premios, entre los que destacan el Premio HEC a la Trayectoria Profesional (2013) y el Hilal-i-Imtiaz (2016). No se indica el año de nacimiento."
  fr: "Profil biographique de Muhammad Ashraf sur le site de l'Académie des sciences du monde islamique; il mentionne son doctorat en botanique obtenu à Liverpool en 1986, portant sur l'amélioration de la tolérance à la salinité, son poste de vice-chancelier de l'Université d'agriculture de Faisalabad, son programme de recherche sur la physiologie du stress chez les plantes, ainsi que les distinctions qu'il a reçues, notamment le prix HEC pour l'ensemble de sa carrière (2013) et la médaille Hilal-i-Imtiaz (2016). L'année de naissance n'y est pas précisée."
