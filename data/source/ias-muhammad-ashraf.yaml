reliability_note: "The Academy's fellow profile, written substantially in the first person, read in full on 1 November 2026. It states that he began his research career in 1983 with admission to the Department of Botany, University of Liverpool, for the project 'Improvement of salinity tolerance in some forage crops'; took his PhD there in 1986 with over twenty papers from the doctoral and postdoctoral work; held a US Fulbright award at the University of Arizona in 1993; and was later awarded the DSc by Liverpool. It names him Vice Chancellor of the University of Agriculture, Faisalabad, credits him with the salt-tolerant wheat line S24 and a hand in the Ramzan mungbean (2006), Nifa-2005 chickpea and MNH-988 cotton varieties, counts 74 PhD students supervised, and lists the honours relied on here (PCST Productive Scientists of Pakistan directories, 26th Khwarizmi Award 2012, FAO medal, HEC Distinguished National Professor 2005, COMSTECH first position in biosciences, HEC Lifetime Achievement Award 2013, Hilal-i-Imtiaz 2016). The page is undated and states no birth date or birth year anywhere."
