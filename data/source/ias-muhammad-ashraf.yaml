summary:
  ar: "سيرة محمد أشرف في أكاديمية العالم الإسلامي للعلوم؛ توثّق دكتوراهه في علم النبات من جامعة ليفربول سنة 1986 في تحسين تحمّل الملوحة، ومنصبه نائبًا لرئيس جامعة الزراعة في فيصل آباد، وأبحاثه في فسيولوجيا إجهاد النبات، وجوائزه ومنها جائزة الإنجاز مدى الحياة (2013) وهلال الامتياز (2016). لا تذكر سنة ميلاده."
  en: "Biographical profile of Muhammad Ashraf at the Islamic World Academy of Sciences; it records his Liverpool PhD of 1986 in botany on improving salinity tolerance, his vice-chancellorship of the University of Agriculture, Faisalabad, his plant stress physiology research programme, and his awards including the HEC Lifetime Achievement Award (2013) and the Hilal-i-Imtiaz (2016). It gives no birth year."
