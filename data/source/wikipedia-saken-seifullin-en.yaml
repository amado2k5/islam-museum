summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ساكن سيفولين؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 15 أكتوبر 1894 في معسكر رحّل بما هو اليوم منطقة قراغندا، وإعدامه في ألماتي سنة 1938 وردّ اعتباره سنة 1957، وتعليمه وتدريسه الروسية في مدرسة مسلمين، وانضمامه إلى الحزب سنة 1918، وتأسيسه اتحاد كتّاب كازاخستان. تصنيفاها «مسلمو كازاخستان» و«الاشتراكيون المسلمون» إيداعات تصنيفية، ومتنها لا يسمي له دينا ولا مذهبا."
  en: "English Wikipedia article on Saken Seifullin; used for entity facts only. It gives his birth on 15 October 1894 in a nomadic settlement in what is today Karaganda Region, his execution at Almaty in 1938 and rehabilitation in 1957, his schooling and his teaching of Russian at a Muslim madrasa, his admission to the Party in 1918, and his founding of the Union of Writers of Kazakhstan. Its categories 'Kazakhstani Muslims' and 'Muslim socialists' are category filings; its text names no religion or school for him."
