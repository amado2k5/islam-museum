summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ساكن سيفولين؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 15 أكتوبر 1894 في معسكر رحّل بما هو اليوم منطقة قراغندا، وإعدامه في ألماتي سنة 1938 وردّ اعتباره سنة 1957، وتعليمه وتدريسه الروسية في مدرسة مسلمين، وانضمامه إلى الحزب سنة 1918، وتأسيسه اتحاد كتّاب كازاخستان. تصنيفاها «مسلمو كازاخستان» و«الاشتراكيون المسلمون» إيداعات تصنيفية، ومتنها لا يسمي له دينا ولا مذهبا."
  en: "English Wikipedia article on Saken Seifullin; used for entity facts only. It gives his birth on 15 October 1894 in a nomadic settlement in what is today Karaganda Region, his execution at Almaty in 1938 and rehabilitation in 1957, his schooling and his teaching of Russian at a Muslim madrasa, his admission to the Party in 1918, and his founding of the Union of Writers of Kazakhstan. Its categories 'Kazakhstani Muslims' and 'Muslim socialists' are category filings; its text names no religion or school for him."
  es: "Artículo de la Wikipedia en inglés sobre Saken Seifullin; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 15 de octubre de 1894 en un asentamiento nómada en lo que hoy es la región de Karaganda, su ejecución en Almaty en 1938 y su rehabilitación en 1957, su educación y su enseñanza de ruso en una madrasa musulmana, su ingreso al Partido en 1918 y la fundación de la Unión de Escritores de Kazajistán. Las categorías «Musulmanes kazajos» y «Socialistas musulmanes» son categorías gramaticales; el texto no menciona ninguna religión ni escuela a la que perteneciera."
  fr: "Article de Wikipédia en anglais sur Saken Seifullin; utilisé uniquement pour les informations biographiques. Il indique sa naissance le 15 octobre 1894 dans un campement nomade de l’actuelle région de Karaganda, son exécution à Almaty en 1938 et sa réhabilitation en 1957, sa scolarité et son enseignement du russe dans une madrasa musulmane, son adhésion au Parti en 1918 et la fondation de l’Union des écrivains du Kazakhstan. Les catégories « Musulmans kazakhs » et « Socialistes musulmans » sont des catégories d’entrée; le texte ne mentionne ni sa religion ni son école."
  ur: "Saken Seifullin پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 15 اکتوبر 1894 کو ایک خانہ بدوش بستی میں ہوئی جو آج کاراگنڈہ علاقہ ہے، 1938 میں الماتی میں ان کی پھانسی اور 1957 میں بحالی، اس کی اسکولنگ اور ایک مسلم مدرسہ میں روسی زبان کی تعلیم، 1918 میں پارٹی میں ان کا داخلہ، اور کازہ یونین کے ان کے بانی اس کے زمرے 'قازقستانی مسلمان' اور 'مسلم سوشلسٹ' زمرہ جات کی فائلنگ ہیں۔ اس کے متن میں اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
