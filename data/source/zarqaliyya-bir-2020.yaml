summary:
  ar: "دراسة تشرح بنية الصفيحة الجامعة وإسقاطها وشبكاتها، وتقدم ترجمة مشروحة لدليل المراكشي؛ ليست النسخة الأصلية بخط الزرقالي."
  en: "Study of the universal plate's structure, projection and grids, with an annotated translation of Marrakushi's construction guide; not an autograph by al-Zarqali."
  ur: "جامع تختی کی ساخت، اسقاط اور جالیوں کی تحقیق، مراکشی کے تعمیراتی بیان کے مشروح ترجمے کے ساتھ؛ الزرقالی کا اصل خطی نسخہ نہیں۔"
  es: "Estudio de la estructura, proyección y cuadrículas de la placa universal, con una traducción anotada de la guía de construcción de Marrakech; no es un autógrafo de al-Zarqali."
  fr: "Étude de la structure, de la projection et des grilles de la plaque universelle, avec une traduction annotée du guide de construction de Marrakushi; il ne s'agit pas d'un autographe d'al-Zarqali."
  tr: "Evrensel plakanın yapısını, projeksiyonunu ve kafeslerini açıklayan bir çalışma, Marrakushi rehberinin açıklamalı bir çevirisini sunar; bu, Zarqali'nin el yazısıyla orijinal versiyon değildir."
  id: "Sebuah studi yang menjelaskan struktur pelat universal, proyeksinya, dan kisi-kisinya, serta menyediakan terjemahan beranotasi dari panduan Marrakushi; ini bukan versi asli dalam tulisan tangan Zarqali."
title: "The Production Guide for the Zarqaliyya (Universal Astrolabe) in the Work of Abu al-Hasan al-Marrakushi"
