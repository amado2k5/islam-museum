summary:
  ar: "صفحة ماكتوتر التي تعيد حساب مسح سنجار كما يرويه البيروني في «Determining the Coordinates of Cities»: قراءة خمسمائة ستيج للدرجة، فريقان شمالاً وجنوباً، وتصحيح الميل، ونتيجتان 56 و56 وثلثي ميل."
  en: "MacTutor page relaying the Sinjar survey as al-Biruni reports it in Coordinates of Cities: the 500-stadia reading, two north/south parties, declination correction, and the 56 and 56 2/3 mile results."
  ur: "میک ٹیوٹر کا صفحہ جو بیرونی کی «Determining the Coordinates of Cities» کے مطابق سنجار کی پیمائش بیان کرتا ہے: 500 سٹیڈیا کی پڑھی ہوئی قدر، شمال و جنوب دو دستے، میل کی تصحیح اور 56 و 56 دو تہائی میل کے نتائج۔"
