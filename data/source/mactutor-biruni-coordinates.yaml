reliability_note: "Page footer reads 'Last Updated March 2006' with authors DJF/JOC/EFR. Read in full 2026-11-15. The page quotes al-Biruni's Coordinates of Cities via David A. King and Mary Helen Kennedy (eds.), Studies in the Islamic Exact Sciences (American University of Beirut, 1983); it reports al-Ma'mun ordering the Sinjar survey after the Greek stade's length proved unresolved for translators, two parties marching north and south from the plain ~70 miles west of Mosul, solar meridian-altitude observation to a one-degree change corrected for declination, distance measurement, marker arrows, and a verifying second survey on the return; results 56 miles and 56 2/3 miles per degree, the latter used by al-Biruni in his own computations; Habash reports hearing Khalid dictate the figure to judge Yahya b. Aktham, chief justice of Basra. Secondary relay of a primary account; the original Arabic text was not independently inspected."
