summary:
  ar: "طبعة مؤسسة هنداوي لكتاب «حياة محمد» لمحمد حسين هيكل، بنصّ الطبعة الثالثة ومقدماتها: تعريف الشيخ محمد مصطفى المراغي، وتقديم المؤلف، وتقديما الطبعتين الثانية والثالثة، ثم واحد وثلاثون فصلاً وخاتمة في مبحثين."
  en: "The Hindawi Foundation edition of Muhammad Husayn Haykal's Hayat Muhammad, with the text of the third edition and its prefaces: Shaykh Muhammad Mustafa al-Maraghi's introduction, the author's preface and the prefaces to the second and third editions, followed by thirty-one chapters and a two-part conclusion."
