summary:
  ar: "مقالة ويكيبيديا العربية عن راشد بن سعيد آل مكتوم؛ تُستخدم لوقائع الكيان فقط. تروي طفولته وتعليمه وولايته للعهد ثم حكمه لدبي من 10 سبتمبر 1958، ودوره مع زايد بن سلطان في قيام اتحاد الإمارات في 2 ديسمبر 1971، ونائبًا لرئيس الدولة ورئيسًا للوزراء حتى وفاته في 7 أكتوبر 1990. ولا يحمل صندوق معلوماتها حقلًا للدين، ولا يذكر متنها مدرسة له."
  en: "Arabic Wikipedia article on Rashid bin Saeed Al Maktoum; used for entity facts only. It recounts his childhood and education, his years as crown prince, his rule of Dubai from 10 September 1958, his work with Zayed bin Sultan toward the UAE federation of 2 December 1971, and his service as vice president and prime minister until his death on 7 October 1990. Its infobox carries no religion field and no text in it names a school for him."
  es: "Artículo de Wikipedia en árabe sobre Rashid bin Saeed Al Maktoum; utilizado únicamente para datos biográficos. Relata su infancia y educación, sus años como príncipe heredero, su gobierno de Dubái desde el 10 de septiembre de 1958, su colaboración con Zayed bin Sultan para la federación de los Emiratos Árabes Unidos el 2 de diciembre de 1971, y su servicio como vicepresidente y primer ministro hasta su fallecimiento el 7 de octubre de 1990. Su ficha informativa no incluye información sobre religión ni menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en arabe sur Rashid bin Saeed Al Maktoum; utilisé uniquement à des fins d'information sur l'entité. Il relate son enfance et son éducation, ses années en tant que prince héritier, son règne sur Dubaï à partir du 10 septembre 1958, sa collaboration avec Zayed bin Sultan pour la fédération des Émirats arabes unis le 2 décembre 1971, et son mandat de vice-président et de Premier ministre jusqu'à sa mort le 7 octobre 1990. Son infobox ne comporte aucun champ relatif à la religion et aucun texte ne mentionne d'établissement scolaire lui ayant été attribué."
  ur: "راشد بن سعید المکتوم پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے بچپن اور تعلیم، ولی عہد کے طور پر ان کے سال، 10 ستمبر 1958 سے دبئی پر ان کی حکمرانی، 2 دسمبر 1971 کو یو اے ای فیڈریشن کے لیے زید بن سلطان کے ساتھ ان کا کام، اور 7 اکتوبر 1990 کو اپنی موت تک نائب صدر اور وزیر اعظم کے طور پر ان کی خدمات کا ذکر ہے۔"
  tr: "Rashid bin Saeed Al Maktoum hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Çocukluğunu, eğitimini, veliaht prens olarak atanmasını, ardından 10 Eylül 1958'den itibaren Dubai yönetimini, 2 Aralık 1971'de BAE Birliği'nin kurulmasında Zayed bin Sultan ile birlikte oynadığı rolü ve 7 Ekim 1990'daki ölümüne kadar Başkan Yardımcısı ve Başbakan olarak görevini anlatır. Bilgi kutusunda din için bir alan yoktur ve kökeninden bir okuldan bahsetmez."
  id: "Artikel Wikipedia Arab tentang Rashid bin Saeed Al Maktoum; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya, pendidikan, pengangkatannya sebagai putra mahkota, kemudian pemerintahannya di Dubai sejak 10 September 1958, perannya bersama Zayed bin Sultan dalam pembentukan Uni UEA pada 2 Desember 1971, dan sebagai Wakil Presiden serta Perdana Menteri hingga wafatnya pada 7 Oktober 1990. Kotak infonya tidak memuat bidang agama, juga tidak menyebutkan aliran asalnya."
