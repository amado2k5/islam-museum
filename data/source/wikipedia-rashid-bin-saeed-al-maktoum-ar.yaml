summary:
  ar: "مقالة ويكيبيديا العربية عن راشد بن سعيد آل مكتوم؛ تُستخدم لوقائع الكيان فقط. تروي طفولته وتعليمه وولايته للعهد ثم حكمه لدبي من 10 سبتمبر 1958، ودوره مع زايد بن سلطان في قيام اتحاد الإمارات في 2 ديسمبر 1971، ونائبًا لرئيس الدولة ورئيسًا للوزراء حتى وفاته في 7 أكتوبر 1990. ولا يحمل صندوق معلوماتها حقلًا للدين، ولا يذكر متنها مدرسة له."
  en: "Arabic Wikipedia article on Rashid bin Saeed Al Maktoum; used for entity facts only. It recounts his childhood and education, his years as crown prince, his rule of Dubai from 10 September 1958, his work with Zayed bin Sultan toward the UAE federation of 2 December 1971, and his service as vice president and prime minister until his death on 7 October 1990. Its infobox carries no religion field and no text in it names a school for him."
