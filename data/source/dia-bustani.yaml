reliability_note: "Read in the museum's session on 20 November 2026. It gives his birth in 1819 at Dibbiye near Beirut into a Maronite family; describes Muhit al-muhit as the first modern Arabic-Arabic dictionary, built on al-Fayruzabadi's al-Qamus al-Muhit with new terms added, in two volumes (Beirut 1870); and its abridgement Qutr al-Muhit (Beirut 1867-1871), whose title the author's preface gives as Qutr, not Qatr. Used for entity facts only."
