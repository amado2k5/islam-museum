summary:
  ar: "مقالة ويكيبيديا الأردية عن مشعل الأحمد الجابر الصباح، وهي مختصر؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته سنة 1940 وولايته للعهد ثم إمارته للكويت من 2023، وتصنّفه في زمرها ضمن «مسلمي الكويت السنة» — وهو تصنيف زمري لا شهادة."
  en: "Urdu Wikipedia article on Mishal Al-Ahmad Al-Jaber Al-Sabah, a stub; used for entity facts only. It gives his birth in 1940, his crown-princeship and his emirate of Kuwait from 2023. Its categories file him under 'Kuwaiti Sunni Muslims' — a category filing, which never attests a school."
  es: "Artículo de Wikipedia en urdu sobre Mishal Al-Ahmad Al-Jaber Al-Sabah, un esbozo; utilizado únicamente para datos personales. Indica su fecha de nacimiento en 1940, su título de príncipe heredero y su emirato de Kuwait desde 2023. Sus categorías lo clasifican como «musulmanes sunitas kuwaitíes», una categoría que nunca especifica a qué escuela religiosa pertenece."
  fr: "L'article Wikipédia en ourdou sur Mishal Al-Ahmad Al-Jaber Al-Sabah est une ébauche; il sert uniquement à fournir des informations sur l'entité. Il indique sa naissance en 1940, son titre de prince héritier et son émirat du Koweït depuis 2023. Ses catégories le classent dans la catégorie « Musulmans sunnites koweïtiens » — une classification qui n'atteste jamais d'appartenance à une école."
  ur: "مشال الاحمد الجابر الصباح پر اردو ویکیپیڈیا کا مضمون، ایک نامکمل؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1940 میں اس کی پیدائش، اس کی ولی عہد اور 2023 سے اس کی امارت کویت۔ اس کے زمرے اسے 'کویتی سنی مسلمان' کے تحت فائل کرتے ہیں - ایک زمرہ فائلنگ، جو کبھی بھی اسکول کی تصدیق نہیں کرتا ہے۔"
  tr: "Mishaal Al-Ahmad Al-Jaber Al-Sabah hakkında kısa olan Urduca Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılıyor. 1940'taki doğumundan, Veliaht Prens olarak atanmasından, ardından 2023'ten itibaren Kuveyt Emirliği'nden bahsediyor ve onu \"Kuveyt'in Sünni Müslümanları\" arasında sınıflandırıyor — bu bir sertifika değil, Zimri sınıflandırması."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Mishaal Al-Ahmad Al-Jaber Al-Sabah, yang singkat; hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada tahun 1940, pengangkatannya sebagai Putra Mahkota, kemudian Emirat Kuwait sejak 2023, dan mengklasifikasikannya sebagai \"Muslim Sunni Kuwait\" — sebuah klasifikasi Zimri bukan sertifikat."
