  ar: "مقالة ويكيبيديا الإنجليزية عن انضمام الحق (مواليد 1970)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في ملتان في 3 مارس 1970، ومسيرته مع باكستان (8,830 جولة اختبار و11,739 جولة ليوم واحد)، ودوره في فوز باكستان بكأس العالم 1992، وقيادته المنتخب (2003-2007)، وعمله كبيرا لمختاري المنتخب ومدربا لأفغانستان."
  en: "English Wikipedia article on Inzamam-ul-Haq (born 1970); used for entity facts only. It records his birth in Multan on 3 March 1970, his Pakistan career (8,830 Test runs and 11,739 ODI runs), his role in Pakistan's 1992 World Cup win, his captaincy (2003–2007), his work as Pakistan chief selector and his coaching of Afghanistan. Its early-life section describes his family as a Punjabi family professing Sunni Islam and notes his membership of the Tablighi Jamaat — family background and movement affiliation, neither of which is a school attestation for him."
