summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن انضمام الحق ⁦(مواليد 1970)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في ملتان في 3 مارس 1970، ومسيرته مع باكستان ⁦(8,830 جولة اختبار و11,739 جولة ليوم واحد)⁩، ودوره في فوز باكستان بكأس العالم 1992، وقيادته المنتخب (2003-2007)، وعمله كبيرا لمختاري المنتخب ومدربا لأفغانستان."
  en: "English Wikipedia article on Inzamam-ul-Haq (born 1970); used for entity facts only. It records his birth in Multan on 3 March 1970, his Pakistan career (8,830 Test runs and 11,739 ODI runs), his role in Pakistan's 1992 World Cup win, his captaincy (2003–2007), his work as Pakistan chief selector and his coaching of Afghanistan. Its early-life section describes his family as a Punjabi family professing Sunni Islam and notes his membership of the Tablighi Jamaat — family background and movement affiliation, neither of which is a school attestation for him."
  es: "Artículo de la Wikipedia en inglés sobre Inzamam-ul-Haq (nacido en 1970); utilizado únicamente para datos sobre la persona. Registra su nacimiento en Multan el 3 de marzo de 1970, su carrera con Pakistán (8.830 carreras en Test y 11.739 en ODI), su papel en la victoria de Pakistán en la Copa Mundial de 1992, su capitanía (2003-2007), su labor como seleccionador jefe de Pakistán y su entrenamiento de Afganistán. La sección sobre su infancia describe a su familia como una familia punjabí que profesa el islam sunita y señala su pertenencia a la Tablighi Jamaat; antecedentes familiares y afiliación al movimiento, ninguno de los cuales constituye una certificación escolar para él."
  fr: "Article de Wikipédia en anglais sur Inzamam-ul-Haq (né en 1970); utilisé uniquement pour les informations le concernant. Il relate sa naissance à Multan le 3 mars 1970, sa carrière au Pakistan (8 830 courses en Test et 11 739 en ODI), son rôle dans la victoire du Pakistan à la Coupe du monde de 1992, son capitanat (2003-2007), son poste de sélectionneur en chef du Pakistan et son rôle d'entraîneur de l'Afghanistan. La section consacrée à son enfance décrit sa famille comme une famille punjabi de confession sunnite et mentionne son appartenance à la Tablighi Jamaat – des informations sur son milieu familial et son affiliation à un mouvement, qui ne figurent pas dans son dossier scolaire."
  ur: "انضمام الحق پر انگریزی ویکیپیڈیا مضمون ⁦(پیدائش 1970)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 3 مارچ 1970 کو ملتان میں ان کی پیدائش، ان کا پاکستانی کیریئر ⁦(8,830 ٹیسٹ رنز اور 11,739 ون ڈے رنز)⁩، پاکستان کی 1992 ورلڈ کپ جیتنے میں ان کا کردار، ان کی کپتانی (2003-2007)، پاکستان کے چیف سلیکٹر کے طور پر ان کا کام اور افغانستان کی ان کی کوچنگ کو ریکارڈ کیا گیا ہے۔ اس کا ابتدائی زندگی کا حصہ اس کے خاندان کو ایک پنجابی خاندان کے طور پر بیان کرتا ہے جو سنی اسلام کا دعویٰ کرتا ہے اور تبلیغی جماعت کی اس کی رکنیت کو نوٹ کرتا ہے - خاندانی پس منظر اور تحریک سے وابستگی، جن میں سے کوئی بھی اس کے لیے اسکول کی تصدیق نہیں ہے۔"
  tr: "Al-Haq'a katılım hakkında İngilizce Wikipedia makalesi (1970 doğumlu); yalnızca varlık bilgileri için kullanılmıştır. 3 Mart 1970'te Multan'da doğdu ve Pakistan'daki kariyeri (8.830 Test maçı ve 11.739 tek günlük tur), Pakistan'ın 1992 Dünya Kupası zaferindeki rolü, kaptanlığı (2003-2007), milli takım antrenörü olarak kıdemli rolü ve Afganistan'ın teknik direktörü olarak görevi yer aldı."
  id: "Artikel Wikipedia bahasa Inggris tentang bergabung dengan Al-Haq (lahir 1970); hanya digunakan untuk fakta entitas. Ia lahir di Multan pada 3 Maret 1970, dan kariernya bersama Pakistan (8.830 pertandingan Test dan 11.739 tur satu hari), perannya dalam kemenangan Piala Dunia 1992 Pakistan, kepemimpinannya (2003-2007), peran seniornya sebagai pelatih tim nasional, serta perannya sebagai pelatih Afghanistan."
