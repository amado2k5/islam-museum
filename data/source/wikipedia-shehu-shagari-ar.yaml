summary:
  ar: "مقالة ويكيبيديا العربية عن شيخو شاجاري؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تذكر رئاسته السابقة لنيجيريا وإطاحة انقلاب 1983 به، وتصنّفه في مواليد 1343 هـ ووفيات 1440 هـ وضمن «مسلمون سنة نيجيريون»."
  en: "Arabic Wikipedia article on Shehu Shagari, a short stub; used for entity facts only. It records his former presidency of Nigeria and his overthrow in the 1983 coup, and files him under births of 1343 AH, deaths of 1440 AH, and 'Nigerian Sunni Muslims'."
  es: "Artículo de Wikipedia en árabe sobre Shehu Shagari, un breve esbozo; utilizado únicamente para datos sobre la persona. Documenta su anterior presidencia de Nigeria y su derrocamiento en el golpe de Estado de 1983, y lo clasifica bajo los nombres de nacimientos de 1343 AH, muertes de 1440 AH y \"musulmanes sunitas nigerianos\"."
  fr: "Article Wikipédia en arabe sur Shehu Shagari, une ébauche succincte; utilisée uniquement à des fins d'information. Elle relate son ancienne présidence du Nigeria et son renversement lors du coup d'État de 1983, et le classe parmi les personnes nées en 1343 AH, décédées en 1440 AH et appartenant à la catégorie « Musulmans sunnites nigérians »."
  ur: "شیہو شگاری پر عربی ویکیپیڈیا مضمون، ایک مختصر سٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں نائیجیریا کی ان کی سابقہ صدارت اور 1983 کی بغاوت میں ان کا تختہ الٹنے کو ریکارڈ کیا گیا ہے، اور اسے 1343 ہجری کی پیدائش، 1440 ہجری کی موت، اور 'نائیجیرین سنی مسلمان' کے تحت درج کیا گیا ہے۔"
  tr: "Şeyho Shajari hakkında Arapça Wikipedia makalesi; sadece varlığın gerçekleri için kullanılan kısa bir makale. Önceki Nijerya başkanlığından ve 1983 darbesinin devrildiğinden bahsederek, 1343 Hicri doğumlu ve 1440 Hicri'de ölmüş olarak sınıflandırılmış ve 'Nijerya'nın Sünni Müslümanları' arasında yer almıştır."
  id: "Artikel Wikipedia berbahasa Arab tentang Sheikho Shajari; sebuah artikel singkat yang hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan masa kepresidenannya sebelumnya di Nigeria dan penggulingan kudeta 1983, mengklasifikasikannya sebagai lahir pada tahun 1343 AH dan meninggal pada 1440 H, serta termasuk di antara 'Muslim Sunni Nigeria.'"
