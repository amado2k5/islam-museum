reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 1839, son of Kahreman Pasha Vrioni and Gjylje Hanëm, daughter of Neim Bey Alizoti; chamberlain of Sultan Abdülaziz; his father founded Fier in the 1860s and Omer developed and rebuilt it to a modern plan in 1877 (against the English and Turkish articles, which make Omer the founder in 1864 with a son Kahreman); signatory of the memorandum sent to Count Andrássy at the Congress of Berlin by the Albanians of Istanbul in the League of Prizren events, pledging to raise 3,000 men if needed; arrested with the other southern leaders and held at Çanakkale castle until November 1883 (the English article says deported in 1882); contributor to the Elbasan Normale's first fund; on 25 November 1912 Ismail Qemali's caravan lunched at his konak in Fier on the way to proclaim independence at Vlorë; he tried to support Prince Wied against the Central Albania uprising; 'he served as a member of the High Council of Regency, where he replaced Aqif Pasha Elbasani as representative of the Bektashi element, from where he resigned on 3 October 1922, when Xhafer Ypi's second government was formed' — the second independent attestation of the Bektashi seat, and a resignation date (October 1922) against the English and Turkish office dating (to 11 March 1922); died at Fier in 1928. The Albanian Wikipedia's article on the OTHER Omer Vrioni — the commander of Alamana, Gravia and the first Missolonghi siege, d. after 1828 — is a separate article and was used only to confirm the two men are distinct."
