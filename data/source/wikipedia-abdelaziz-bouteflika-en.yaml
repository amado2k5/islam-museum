reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth at Oujda on 2 March 1937 to parents from Tlemcen, his Qur'anic schooling and reported affiliation, as a schoolboy, with a Qadiriyya zawiya in Oujda, his joining the National Liberation Army in 1956 and his role in the Oujda Group, his years as foreign minister (1963-1979) and president of the UN General Assembly (1974-75), the 1983 embezzlement conviction and amnesty, his exile and return, his four presidential terms (1999-2019) including the end of the civil war, the reconciliation charter, the 2013 stroke and the 2019 Hirak protests that forced his resignation on 2 April 2019, and his death at Zéralda on 17 September 2021. Election-fraud and corruption allegations are carried in the article and are used only attributed. The article names no madhhab for him. Read in full on 24 October 2026."
