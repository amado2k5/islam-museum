reliability_note: "A peer-reviewed journal article (file 6_v5_2_19 in the journal's archive), consulted on 26 October 2026; the PDF carries no web revision identifier, so this source is recorded in consultation-date form. It is the source followed for Karamat Husain's birth and death years, giving 'Sayyid Karamat Hussain, (1854-1917) a scholar and a judge'; the same years are given in the biographical scholarship on Syed Mahmood (Habibullah, as quoted in the thesis literature), which also records his appointment as law lecturer at the Muhammadan Anglo-Oriental College on 1 November 1891 and his later appointment in 1908 as the first Muslim judge of the Allahabad High Court after Syed Mahmood's resignation, and that he studied with his uncle Sayyid Hamid Husayn, described there as a learned mujtahid, before training as a barrister at the Middle Temple."
