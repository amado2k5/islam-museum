  ar: "مقالة في مجلة الدراسات الهندية بجامعة البنجاب عن تعليم المرأة المسلمة في شمال الهند؛ تُستخدم لوقائع الكيان فقط. تذكر سيد كرامت حسين (1854–1917) عالمًا وقاضيًا ومن أوائل المنادين بتعليم الإناث، وتأسيسه بعد تقاعده مدرسة البنات المسلمات في لكناو سنة 1912 ووقفه لدعمها بمساعدة راجا صاحب محمود آباد."
  en: "An article in the Journal of Indian Studies (University of the Punjab) on Muslim women's education in north India; used for entity facts only. It gives Sayyid Karamat Hussain (1854–1917) as a scholar and judge and an early promoter of female schooling, and records his founding, after retirement and with the Raja of Mahmudabad's support, of the Muslim Girls' school at Lucknow in 1912 and the waqf he set up for its support."
