summary:
  ar: "كتاب «مستويات العربية المعاصرة في مصر»، السعيد محمد بدوي. لم يفتح المتحف هذا المرجع بنفسه؛ عُرف ما قيل عنه من ملخص بحثي قدّمه المؤسس إلى المتحف ووافق على استعماله في 21 نوفمبر 2026. يُستشهد به في: سلّم المستويات بين الفصحى والعاميات."
  en: "The book \"مستويات العربية المعاصرة في مصر\" ⁦(السعيد محمد بدوي)⁩. The museum did not open it itself: what is known of it comes from a research summary supplied to the museum by the founder, who approved its use on 21 November 2026. Cited for: the continuum between standard Arabic and the dialects."
  ur: "کتاب «مستويات العربية المعاصرة في مصر»، السعيد محمد بدوي۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ بانی کے فراہم کردہ تحقیقی خلاصے سے ہے، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ ان کے لیے دیا گیا: فصیح اور بولیوں کے درمیان درجوں کا سلسلہ۔"
  fr: "L'ouvrage « مستويات العربية المعاصرة في مصر » ⁦(السعيد محمد بدوي)⁩. Le musée ne l'a pas ouvert lui-même : ce qu'on en sait vient d'un résumé de recherche fourni au musée par le fondateur, qui en a approuvé l'usage le 21 novembre 2026. Cité pour : le continuum entre l'arabe standard et les dialectes."
  es: "La obra «مستويات العربية المعاصرة في مصر» ⁦(السعيد محمد بدوي)⁩. El museo no lo abrió por sí mismo: lo que se sabe de él procede de un resumen de investigación entregado al museo por el fundador, que aprobó su uso el 21 de noviembre de 2026. Citado para: el continuo entre el árabe estándar y los dialectos."
