summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شهاب الدين أحمد؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بيماي بقضاء كندوا في 1 فبراير 1930، ومسيرته في الخدمة المدنية ثم القضاء حتى رئاسة قضاة بنغلاديش (1990–1995)، ورئاسته بالوكالة في 1990–1991 على رأس الحكومة المؤقتة التي أجرت انتخابات 1991، ورئاسته الكاملة (1996–2001)، ووفاته في دكا في 19 مارس 2022. لا يحمل صندوق معلوماتها حقلًا للديانة ولا يذكر متنها انتماءً دينيًا شخصيًا له."
  en: "English Wikipedia article on Shahabuddin Ahmed; used for entity facts only. It recounts his birth at Pemai, Kendua, on 1 February 1930, his civil-service and judicial career to chief justice of Bangladesh (1990–1995), his acting presidency in 1990–91 at the head of the interim government that held the 1991 election, his full presidential term (1996–2001), and his death at Dhaka on 19 March 2022. Its infobox carries no religion field and its text states no personal religious affiliation for him; his Red Crescent chairmanship and his place in a government delegation to a 1979 OIC foreign ministers' conference are recorded as official activity."
  es: "Artículo de la Wikipedia en inglés sobre Shahabuddin Ahmed; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Pemai, Kendua, el 1 de febrero de 1930, su carrera en la administración pública y judicial hasta convertirse en presidente del Tribunal Supremo de Bangladesh (1990-1995), su presidencia interina en 1990-1991 al frente del gobierno provisional que celebró las elecciones de 1991, su mandato presidencial completo (1996-2001) y su fallecimiento en Dhaka el 19 de marzo de 2022. Su ficha informativa no incluye ningún campo sobre religión y su texto no indica ninguna afiliación religiosa personal; su presidencia de la Media Luna Roja y su participación en una delegación gubernamental en la conferencia de ministros de Asuntos Exteriores de la OIC de 1979 se registran como actividad oficial."
  fr: "Article de Wikipédia en anglais sur Shahabuddin Ahmed; utilisé uniquement pour les informations biographiques. Il retrace sa naissance à Pemai, dans le district de Kendua, le 1er février 1930, sa carrière dans la fonction publique et la magistrature jusqu'à son poste de juge en chef du Bangladesh (1990-1995), sa présidence par intérim en 1990-1991 à la tête du gouvernement intérimaire qui a organisé les élections de 1991, son mandat présidentiel complet (1996-2001) et son décès à Dacca le 19 mars 2022. Son infobox ne comporte pas de champ relatif à la religion et son texte ne mentionne aucune appartenance religieuse personnelle; sa présidence du Croissant-Rouge et sa participation à une délégation gouvernementale à la conférence des ministres des Affaires étrangères de l'OCI en 1979 sont répertoriées comme activités officielles."
  ur: "شہاب الدین احمد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں یکم فروری 1930 کو پیمائی، کینڈوا میں ان کی پیدائش، بنگلہ دیش کے چیف جسٹس (1990-1995) تک ان کی سول سروس اور عدالتی کیرئیر، 1990-91 میں عبوری حکومت کے سربراہ کے طور پر 1991 کے انتخابات میں ان کی قائم مقام صدارت، ان کی مکمل صدارتی مدت (1996-2019) ڈھاکہ میں ان کی موت، 1990-91 میں ان کی موت کا ذکر ہے۔ 2022. اس کے معلوماتی خانے میں کوئی مذہب نہیں ہے اور اس کے متن میں اس کے لیے کوئی ذاتی مذہبی وابستگی نہیں ہے۔ ان کی ہلال احمر کی سربراہی اور 1979 میں او آئی سی کے وزرائے خارجہ کی کانفرنس میں حکومتی وفد میں ان کی جگہ کو سرکاری سرگرمی کے طور پر ریکارڈ کیا گیا ہے۔"
  tr: "Shihabuddin Ahmed hakkında İngilizce Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. 1 Şubat 1930'da Kandwa bölgesindeki Bimay'daki doğumunu, Bangladeş Baş Yargıcı olana kadar kamu hizmeti ve ardından yargı kariyerini (1990–1995), 1990–1991'de geçici hükümetin başkanı olarak 1990–1991 yıllarında geçici başkanlığını, tam cumhurbaşkanlığını (1996–2001) ve 19 Mart 2022'de Dakka'da vefatını anlatır. Bilgi kutusunda din alanı bulunmaz ve kişisel dini aidiyetten bahsedilmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Shihabuddin Ahmed; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Bimay, distrik Kandwa pada 1 Februari 1930, kariernya di layanan sipil dan kemudian peradilan hingga ia menjadi Ketua Hakim Bangladesh (1990–1995), masa kepresidenannya sementara pada 1990–1991 sebagai kepala pemerintahan sementara yang mengadakan pemilihan 1991, masa kepresidenannya penuh (1996–2001), dan kematiannya di Dhaka pada 19 Maret 2022. Infobox tersebut tidak memuat kolom agama dan tidak menyebutkan afiliasi agama pribadi apa pun."
