summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شهاب الدين أحمد؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بيماي بقضاء كندوا في 1 فبراير 1930، ومسيرته في الخدمة المدنية ثم القضاء حتى رئاسة قضاة بنغلاديش (1990–1995)، ورئاسته بالوكالة في 1990–1991 على رأس الحكومة المؤقتة التي أجرت انتخابات 1991، ورئاسته الكاملة (1996–2001)، ووفاته في دكا في 19 مارس 2022. لا يحمل صندوق معلوماتها حقلًا للديانة ولا يذكر متنها انتماءً دينيًا شخصيًا له."
  en: "English Wikipedia article on Shahabuddin Ahmed; used for entity facts only. It recounts his birth at Pemai, Kendua, on 1 February 1930, his civil-service and judicial career to chief justice of Bangladesh (1990–1995), his acting presidency in 1990–91 at the head of the interim government that held the 1991 election, his full presidential term (1996–2001), and his death at Dhaka on 19 March 2022. Its infobox carries no religion field and its text states no personal religious affiliation for him; his Red Crescent chairmanship and his place in a government delegation to a 1979 OIC foreign ministers' conference are recorded as official activity."
