summary:
  ar: "مقالة ويكيبيديا الصينية عن ما انليانغ؛ تُستخدم لوقائع الكيان فقط. تجعله الابن الأكبر لما جان آو، واسمه الأصلي ما سبعة وخمسة (马七五)، وتذكر أنه قاد قوات المنحوان سنة 1911 مستخدمًا شبكة منحوان أسرته، وخاض صراع قانسو السياسي في أوائل الجمهورية، ومات مريضًا في هتشو سنة 1918؛ ولا تنصّ على انتمائه الشخصي إلى طريقة."
  en: "Chinese Wikipedia article on Ma Anliang; used for entity facts only. It makes him the eldest son of Ma Zhan'ao, gives his original name as Ma Qiwu, records that in 1911 he levied menhuan troops using his family's menhuan network, fought the Gansu political struggles of the early Republic, and died of illness at Hezhou in 1918; it does not state his personal membership of an order."
  es: "Artículo de la Wikipedia en chino sobre Ma Anliang; utilizado únicamente para datos sobre la persona. Lo presenta como el hijo mayor de Ma Zhan'ao, indica que su nombre original era Ma Qiwu, y registra que en 1911 reclutó tropas menhuan utilizando la red menhuan de su familia, luchó en las luchas políticas de Gansu durante los inicios de la República y murió de una enfermedad en Hezhou en 1918; no menciona su pertenencia personal a ninguna orden."
  fr: "Article de Wikipédia en chinois sur Ma Anliang; utilisé uniquement pour les informations sur l'entité. Il le présente comme le fils aîné de Ma Zhan'ao, indique que son nom d'origine était Ma Qiwu, et mentionne qu'en 1911 il leva des troupes menhuan grâce au réseau menhuan de sa famille, participa aux luttes politiques du Gansu au début de la République, et mourut de maladie à Hezhou en 1918; son appartenance personnelle à un ordre n'est pas mentionnée."
  ur: "ما اینلیانگ پر چینی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے ما زہاناؤ کا سب سے بڑا بیٹا بناتا ہے، اس کا اصل نام ما کیوو بتاتا ہے، ریکارڈ کرتا ہے کہ 1911 میں اس نے اپنے خاندان کے مینہون نیٹ ورک کا استعمال کرتے ہوئے مینہون فوجیوں پر قبضہ کیا، ابتدائی جمہوریہ کے گانسو سیاسی جدوجہد کا مقابلہ کیا، اور 1918 میں ہیزو میں بیماری کی وجہ سے انتقال کر گئے۔ یہ کسی آرڈر کی اس کی ذاتی رکنیت کو بیان نہیں کرتا ہے۔"
  tr: "Ma Enliang hakkında Çin Vikipedi makalesi; yalnızca varlık gerçekleri için kullanılır. Onu, orijinal adı Ma Yedi ve Beş (马七五) olan Ma Jan Ao'nun en büyük oğlu yapar ve 1911'de ailesinin Ma Huan ağını kullanarak Ma Huan kuvvetlerine liderlik ettiğini, cumhuriyetin başlarında Gansu siyasi mücadelesinde savaştığını ve 1918'de Huzhou'da hasta olarak öldüğünü belirtir; kişisel bağlılığı belirtilmemektedir."
  id: "Artikel Wikipedia Tiongkok tentang Ma Enliang; hanya digunakan untuk fakta entitas. Artikel ini menjadikannya putra sulung Ma Jan Ao, yang nama aslinya adalah Ma Tujuh dan Lima (马七五), dan menyebutkan bahwa ia memimpin pasukan Ma Huan pada tahun 1911 menggunakan jaringan Ma Huan keluarganya, bertempur dalam perjuangan politik Gansu pada awal republik, dan meninggal sakit di Huzhou pada tahun 1918; tidak disebutkan afiliasi pribadinya dengan ordo manapun."
