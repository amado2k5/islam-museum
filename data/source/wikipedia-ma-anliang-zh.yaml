reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026, fetched through the MediaWiki API by its recorded revision id with the returned id asserted equal. An independent Chinese tradition, not a translation of the English article: it rests chiefly on Zhao Songyao, 'Ma Anliang and the Gansu political struggles of the early Republic' (1989), and Gao Wende (ed.), Dictionary of Chinese Ethnic History Figures (1990), and gives his birth and death years (1855, 1918) from Beijing archival material. Its menhuan passage says he 'used the menhuan to levy menhuan troops' （利用门宦强拔门兵） in 1911–12 — an organisational use of the network, not a statement of his personal membership — and photographs his tomb's gongbei arch at Dahejia."
