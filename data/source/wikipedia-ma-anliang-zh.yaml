summary:
  ar: "مقالة ويكيبيديا الصينية عن ما انليانغ؛ تُستخدم لوقائع الكيان فقط. تجعله الابن الأكبر لما جان آو، واسمه الأصلي ما سبعة وخمسة (马七五)، وتذكر أنه قاد قوات المنحوان سنة 1911 مستخدمًا شبكة منحوان أسرته، وخاض صراع قانسو السياسي في أوائل الجمهورية، ومات مريضًا في هتشو سنة 1918؛ ولا تنصّ على انتمائه الشخصي إلى طريقة."
  en: "Chinese Wikipedia article on Ma Anliang; used for entity facts only. It makes him the eldest son of Ma Zhan'ao, gives his original name as Ma Qiwu, records that in 1911 he levied menhuan troops using his family's menhuan network, fought the Gansu political struggles of the early Republic, and died of illness at Hezhou in 1918; it does not state his personal membership of an order."
