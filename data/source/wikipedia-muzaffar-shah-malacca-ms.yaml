reliability_note: "Read in full on 1 November 2026. The Malay edition is fuller than the English on the reign's institutional side (the sultan title, the law code, the Ayutthaya overlordship) and gives the accession as 1445 with an August 1445 coronation, while its own succession box still prints 1446–1459; both years are preserved in the record. It substantially reports the same Malay Annals tradition as the English article, so for questions of personal attestation the two editions count as one family, not two. Its infobox carries 'Islam Sunni', the same template attestation as the English infobox. No birth date is given."
