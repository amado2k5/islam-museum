  ar: "مقالة ويكيبيديا الملايوية عن سلطان مظفر شاه، خامس سلاطين ملقا (1445–1459)؛ تذكر تتويجه في أغسطس 1445، وأنه أول حكام ملقا تلقّب بالسلطان، وتحريره ملقا من تبعية أيوتايا، وإصداره قانون ملقا، ووفاته سنة 1459 بعد الهجوم السيامي."
  en: "Malay Wikipedia article on Sultan Muzaffar Shah, fifth sultan of Malacca (1445–1459); it records his coronation in August 1445, that he was the first Malacca ruler to bear the title of sultan, his freeing of Malacca from Ayutthaya's overlordship, his promulgation of Malacca's law code, and his death in 1459 after the Siamese attack."
