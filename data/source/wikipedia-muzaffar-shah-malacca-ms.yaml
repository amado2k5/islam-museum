summary:
  ar: "مقالة ويكيبيديا الملايوية عن سلطان مظفر شاه، خامس سلاطين ملقا (1445–1459)؛ تذكر تتويجه في أغسطس 1445، وأنه أول حكام ملقا تلقّب بالسلطان، وتحريره ملقا من تبعية أيوتايا، وإصداره قانون ملقا، ووفاته سنة 1459 بعد الهجوم السيامي."
  en: "Malay Wikipedia article on Sultan Muzaffar Shah, fifth sultan of Malacca (1445–1459); it records his coronation in August 1445, that he was the first Malacca ruler to bear the title of sultan, his freeing of Malacca from Ayutthaya's overlordship, his promulgation of Malacca's law code, and his death in 1459 after the Siamese attack."
  es: "Artículo de Wikipedia en malayo sobre el sultán Muzaffar Shah, quinto sultán de Malaca (1445-1459); en él se registra su coronación en agosto de 1445, que fue el primer gobernante de Malaca en ostentar el título de sultán, su liberación de Malaca del dominio de Ayutthaya, la promulgación del código legal de Malaca y su muerte en 1459 tras el ataque siamés."
  fr: "Article malais de Wikipédia sur le sultan Muzaffar Shah, cinquième sultan de Malacca (1445-1459); il relate son couronnement en août 1445, qu'il fut le premier souverain de Malacca à porter le titre de sultan, la libération de Malacca de la suzeraineté d'Ayutthaya, la promulgation du code de lois de Malacca et sa mort en 1459 après l'attaque siamoise."
  ur: "سلطان مظفر شاہ، ملاکا کے پانچویں سلطان (1445–1459) پر مالے ویکیپیڈیا کا مضمون؛ اس میں اگست 1445 میں اس کی تاجپوشی کو ریکارڈ کیا گیا ہے، کہ وہ سلطان کا خطاب حاصل کرنے والے پہلے ملاکا حکمران تھے، اس کا ملاکا کو ایوتھایا کی بالادستی سے آزاد کرانا، اس کا ملاکا کے قانون کا نفاذ، اور 1459 میں سیام کے حملے کے بعد اس کی موت۔"
