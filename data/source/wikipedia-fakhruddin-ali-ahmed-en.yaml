summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فخر الدين علي أحمد (1905–1977)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في دلهي ودراسته الحقوق في كمبريدج و«إنر تمبل»، ووزارة مالية آسام ومحاماتها العامة، ووزاراته المركزية منذ 1966، ورئاسته الهند 1974–1977 وإعلانه الطوارئ ووفاته في المنصب."
  en: "English Wikipedia article on Fakhruddin Ali Ahmed (1905–1977); used for entity facts only. It recounts his Delhi birth, his legal studies at Cambridge and the Inner Temple, his Assam finance ministries and advocate-generalship, his Union cabinet posts from 1966, and his 1974–1977 presidency, the Emergency proclamation and his death in office."
  es: "Artículo de la Wikipedia en inglés sobre Fakhruddin Ali Ahmed (1905-1977); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Delhi, sus estudios de derecho en Cambridge y el Inner Temple, sus ministerios de finanzas y su cargo como fiscal general en Assam, sus puestos en el gabinete de la Unión desde 1966, su presidencia entre 1974 y 1977, la proclamación del estado de emergencia y su fallecimiento en el cargo."
  fr: "Article de Wikipédia en anglais sur Fakhruddin Ali Ahmed (1905-1977); utilisé uniquement pour les informations relatives à l’entité. Il relate sa naissance à Delhi, ses études de droit à Cambridge et à l’Inner Temple, ses ministères des Finances et son poste d’avocat général de l’Assam, ses fonctions au sein du gouvernement de l’Union à partir de 1966, sa présidence de 1974 à 1977, la proclamation de l’état d’urgence et son décès en fonction."
  ur: "فخرالدین علی احمد (1905-1977) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی دہلی کی پیدائش، کیمبرج اور اندرونی مندر میں ان کی قانونی تعلیم، آسام کی وزارت خزانہ اور ایڈووکیٹ جنرل شپ، 1966 سے ان کی مرکزی کابینہ کے عہدے، اور ان کی 1974-1977 کی صدارت، ایمرجنسی کا اعلان اور دفتر میں ان کی موت کا ذکر ہے۔"
