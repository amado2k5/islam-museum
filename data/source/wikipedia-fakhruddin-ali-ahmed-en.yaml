  ar: "مقالة ويكيبيديا الإنجليزية عن فخر الدين علي أحمد (1905–1977)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في دلهي ودراسته الحقوق في كمبريدج و«إنر تمبل»، ووزارة مالية آسام ومحاماتها العامة، ووزاراته المركزية منذ 1966، ورئاسته الهند 1974–1977 وإعلانه الطوارئ ووفاته في المنصب."
  en: "English Wikipedia article on Fakhruddin Ali Ahmed (1905–1977); used for entity facts only. It recounts his Delhi birth, his legal studies at Cambridge and the Inner Temple, his Assam finance ministries and advocate-generalship, his Union cabinet posts from 1966, and his 1974–1977 presidency, the Emergency proclamation and his death in office."
