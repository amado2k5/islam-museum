label:
  ar: "كتاب الزهد لأحمد بن حنبل، الجزء الثالث عشر، قطعة تطبع لأول مرة، اعتنى به أبو عمر محمود بن شوقي بن مفلح ⁦(دار الرياحين، عمّان 1447هـ/2026م)⁩"
  en: "Ahmad ibn Hanbal, Kitab al-Zuhd, part 13, first edition of a manuscript fragment, ed. Abu Umar Mahmud ibn Shawqi ibn Muflih (Dar al-Rayahin, Amman 2026)"
  ur: "احمد بن حنبل، کتاب الزہد، تیرھواں جزء، پہلی بار شائع ہونے والا قلمی ٹکڑا، اعتنا ابو عمر محمود بن شوقی بن مفلح ⁦(دار الریاحین، عمان 2026)⁩"
summary:
  ar: "نشرة أولى للجزء الثالث عشر من كتاب الزهد لأحمد برواية ابنه عبد الله وزياداته، من طريق أبي القاسم يحيى بن أسعد بن بوش الأزجي، عن مخطوط الظاهرية بدمشق رقم 1131؛ فيه 592 أثراً جلّها عن أبي الدرداء والحسن البصري وعمر بن عبد العزيز."
  en: "First publication of part 13 of Ahmad's Kitab al-Zuhd in the transmission of his son Abd Allah with his additions, through Abu al-Qasim Yahya ibn As'ad ibn Bawsh al-Azaji, from Zahiriyya manuscript no. 1131 in Damascus; it holds 592 reports, most from Abu al-Darda', al-Hasan al-Basri and Umar ibn Abd al-Aziz."
  ur: "احمد کی کتاب الزہد کے تیرھویں جزء کی پہلی اشاعت، ان کے بیٹے عبد اللہ کی روایت اور زیادات کے ساتھ، ابو القاسم یحییٰ بن اسعد بن بوش ازجی کے طریق سے، دمشق کی ظاہریہ کے مخطوطہ نمبر 1131 سے؛ اس میں 592 آثار ہیں، اکثر ابو الدرداء، حسن بصری اور عمر بن عبد العزیز سے۔"
  es: "Primera publicación de la parte 13 del Kitab al-Zuhd de Ahmad, transmitida por su hijo Abd Allah con sus añadidos, a través de Abu al-Qasim Yahya ibn As'ad ibn Bawsh al-Azaji, del manuscrito Zahiriyya n.º 1131 de Damasco; contiene 592 informes, la mayoría de Abu al-Darda', al-Hasan al-Basri y Umar ibn Abd al-Aziz."
  fr: "Première publication de la partie 13 du Kitab al-Zuhd d'Ahmad dans la transmission de son fils Abd Allah avec ses ajouts, par l'intermédiaire d'Abu al-Qasim Yahya ibn As'ad ibn Bawsh al-Azaji, à partir du manuscrit Zahiriyya n° 1131 à Damas; il contient 592 rapports, la plupart d'Abu al-Darda', al-Hasan al-Basri et Umar ibn Abd al-Aziz."
  tr: "Ahmad tarafından yazılmış Al-Zuhd kitabının on üçüncü bölümünün ilk baskısı, oğlu Abdullah tarafından anlatılan, Şam'daki el-Zahiriye el yazmasından 1131 numaralı Ebu el-Kasım Yahya bin As'ad ibn Bush al-Azji aracılığıyla eklenmiştir; 592 eser içerir, bunların çoğu Ebu el-Derde, el-Hasan el-Basri ve Ömer bin Abdülaziz'den gelir."
  id: "Edisi Pertama bagian ketiga belas dari buku Al-Zuhd karya Ahmad, yang diceritakan oleh putranya Abdullah dan tambahannya, melalui Abu al-Qasim Yahya ibn As'ad ibn Bush al-Azji, dari manuskrip al-Zahiriyah di Damaskus, nomor 1131; memuat 592 karya, sebagian besar dari Abu al-Darda, al-Hasan al-Basri, dan Umar ibn Abd al-Aziz."
