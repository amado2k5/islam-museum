label:
  ar: "كتاب الزهد لأحمد بن حنبل، الجزء الثالث عشر، قطعة تطبع لأول مرة، اعتنى به أبو عمر محمود بن شوقي بن مفلح (دار الرياحين، عمّان 1447هـ/2026م)"
  en: "Ahmad ibn Hanbal, Kitab al-Zuhd, part 13, first edition of a manuscript fragment, ed. Abu Umar Mahmud ibn Shawqi ibn Muflih (Dar al-Rayahin, Amman 2026)"
  ur: "احمد بن حنبل، کتاب الزہد، تیرھواں جزء، پہلی بار شائع ہونے والا قلمی ٹکڑا، اعتنا ابو عمر محمود بن شوقی بن مفلح (دار الریاحین، عمان 2026)"
summary:
  ar: "نشرة أولى للجزء الثالث عشر من كتاب الزهد لأحمد برواية ابنه عبد الله وزياداته، من طريق أبي القاسم يحيى بن أسعد بن بوش الأزجي، عن مخطوط الظاهرية بدمشق رقم 1131؛ فيه 592 أثراً جلّها عن أبي الدرداء والحسن البصري وعمر بن عبد العزيز."
  en: "First publication of part 13 of Ahmad's Kitab al-Zuhd in the transmission of his son Abd Allah with his additions, through Abu al-Qasim Yahya ibn As'ad ibn Bawsh al-Azaji, from Zahiriyya manuscript no. 1131 in Damascus; it holds 592 reports, most from Abu al-Darda', al-Hasan al-Basri and Umar ibn Abd al-Aziz."
  ur: "احمد کی کتاب الزہد کے تیرھویں جزء کی پہلی اشاعت، ان کے بیٹے عبد اللہ کی روایت اور زیادات کے ساتھ، ابو القاسم یحییٰ بن اسعد بن بوش ازجی کے طریق سے، دمشق کی ظاہریہ کے مخطوطہ نمبر 1131 سے؛ اس میں 592 آثار ہیں، اکثر ابو الدرداء، حسن بصری اور عمر بن عبد العزیز سے۔"
