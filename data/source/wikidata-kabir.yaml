  ar: "عنصر ويكيداتا لكبير (Q312551)؛ يحمل قيمتين متنافستين للميلاد ⁦(1398 و1440)⁩ ووفاة سنة 1518، وقيمة دين هي الهندوسية، ومكان ميلاده فاراناسي ووفاته ماغار."
  en: "Wikidata item for Kabir (Q312551); it carries two rival birth values (1398 and 1440), a death year of 1518, a religion value of Hinduism, and birth and death places of Varanasi and Maghar."
  es: "Elemento de Wikidata para Kabir (Q312551); contiene dos valores de nacimiento rivales (1398 y 1440), un año de muerte de 1518, un valor de religión de hinduismo y lugares de nacimiento y muerte de Varanasi y Maghar."
  fr: "L'élément Wikidata pour Kabir (Q312551); il comporte deux valeurs de naissance rivales (1398 et 1440), une année de décès de 1518, une valeur religieuse de l'hindouisme et des lieux de naissance et de décès de Varanasi et Maghar."
  ur: "وکی ڈیٹا آئٹم برائے کبیر (Q312551)؛ اس میں دو حریف پیدائشی اقدار ⁦(1398 اور 1440)⁩، 1518 کا سال موت، ہندو مذہب کی ایک مذہبی قدر، اور وارانسی اور مگہر کی پیدائش اور موت کے مقامات ہیں۔"
  tr: "Kabir (Q312551) için Wikidata öğesi, doğum (1398 ve 1440) ve 1518'deki ölüm için iki rakip değer taşır ve dinin değeri Hinduizm'dir; Varanasi'nin doğum yeri ve ölüm yeri Magar'dır."
  id: "Elemen Wikidata untuk Kabir (Q312551) memiliki dua nilai yang saling bersaing antara kelahiran (1398 dan 1440) dan kematian pada tahun 1518, dan nilai agama adalah Hindu, dengan tempat kelahiran Varanasi dan kematiannya adalah Magar."
