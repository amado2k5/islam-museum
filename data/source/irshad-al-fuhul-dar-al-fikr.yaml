label:
  ar: "الشوكاني، إرشاد الفحول إلى تحقيق الحق من علم الأصول ⁦(دار الفكر، وبهامشه شرح العبادي على شرح المحلي على الورقات)⁩"
  en: "al-Shawkani, Irshad al-Fuhul ila Tahqiq al-Haqq min Ilm al-Usul (Dar al-Fikr; with al-Abbadi's commentary on al-Mahalli's commentary on al-Waraqat in the margin)"
  ur: "شوکانی، ارشاد الفحول الی تحقیق الحق من علم الاصول ⁦(دار الفکر؛ حاشیے پر ورقات کی محلی والی شرح پر عبادی کی شرح)⁩"
summary:
  ar: "طبعة دار الفكر للطباعة والنشر والتوزيع من «إرشاد الفحول» لمحمد بن علي الشوكاني، في مجلد واحد ⁦(289 صفحة مطبوعة مع الفهرس)⁩، وبهامشه شرح الشيخ أحمد بن قاسم العبادي الشافعي على شرح جلال الدين المحلي على «الورقات» لإمام الحرمين الجويني. لا يذكر الغلاف المصور سنة الطبع، والنسخة من مقتنيات مكتبة الإسكندرية."
  en: "The Dar al-Fikr printing of Irshad al-Fuhul by Muhammad ibn Ali al-Shawkani, one volume (289 printed pages with the index), with, in the margin, the commentary of Shaykh Ahmad ibn Qasim al-Abbadi al-Shafi'i on Jalal al-Din al-Mahalli's commentary on al-Waraqat by Imam al-Haramayn al-Juwayni. The scanned title page gives no year of printing; the copy is from the Bibliotheca Alexandrina."
  es: "Edición de Dar al-Fikr de Irshad al-Fuhul de Muhammad ibn Ali al-Shawkani, un volumen (289 páginas impresas con índice), con el comentario marginal del Shaykh Ahmad ibn Qasim al-Abbadi al-Shafi'i sobre el comentario de Jalal al-Din al-Mahalli a al-Waraqat del Imam al-Haramayn al-Juwayni. La portada escaneada no indica el año de impresión; el ejemplar procede de la Biblioteca de Alejandría."
  fr: "L'édition Dar al-Fikr d'Irshad al-Fuhul de Muhammad ibn Ali al-Shawkani, en un volume (289 pages imprimées avec l'index), comprend, en marge, le commentaire du cheikh Ahmad ibn Qasim al-Abbadi al-Shafi'i sur le commentaire de Jalal al-Din al-Mahalli sur al-Waraqat de l'imam al-Haramayn al-Juwayni. La page de titre numérisée ne mentionne pas l'année d'impression; cet exemplaire provient de la Bibliotheca Alexandrina."
  ur: "محمد ابن علی الشوکانی کی ارشاد الفضول کی شرح الفکر طباعت، ایک جلد ⁦(289 مطبوعہ صفحات بمعہ اشاریہ)⁩، حاشیہ میں، شیخ احمد بن قاسم العبادی الشافعی کی تفسیر جلال الدین المحلی کی تفسیر امام القراء المعروف امام عالی مقام پر ہے۔ الجوینی اسکین شدہ عنوان کا صفحہ پرنٹنگ کا کوئی سال نہیں دیتا ہے۔ کاپی Bibliotheca Alexandrina سے ہے۔"
