summary:
  ar: "طبعة دار الفكر للطباعة والنشر والتوزيع من «إرشاد الفحول» لمحمد بن علي الشوكاني، في مجلد واحد ⁦(289 صفحة مطبوعة مع الفهرس)⁩، وبهامشه شرح الشيخ أحمد بن قاسم العبادي الشافعي على شرح جلال الدين المحلي على «الورقات» لإمام الحرمين الجويني. لا يذكر الغلاف المصور سنة الطبع، والنسخة من مقتنيات مكتبة الإسكندرية."
  en: "The Dar al-Fikr printing of Irshad al-Fuhul by Muhammad ibn Ali al-Shawkani, one volume (289 printed pages with the index), with, in the margin, the commentary of Shaykh Ahmad ibn Qasim al-Abbadi al-Shafi'i on Jalal al-Din al-Mahalli's commentary on al-Waraqat by Imam al-Haramayn al-Juwayni. The scanned title page gives no year of printing; the copy is from the Bibliotheca Alexandrina."
