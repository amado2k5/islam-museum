  en: "Recipes of Ancient Egyptian kohls more diverse than previously thought (2022)"
summary:
  ar: "دراسة محكّمة مفتوحة الوصول تحلل محتويات 11 وعاء كحل من مجموعة متحف بتري؛ ويذكر تمهيدها أن الكحل استُخدم منذ ما لا يقل عن 5000 قبل الميلاد، مع إحالة هذا التاريخ إلى دراسات سابقة."
  en: "A peer-reviewed open-access study of 11 kohl containers in the Petrie Museum collection. Its introduction says kohl has been used since at least 5000 BCE, citing earlier studies."
  es: "Un estudio revisado por pares y de acceso abierto sobre 11 recipientes de kohl de la colección del Museo Petrie. En su introducción se afirma que el kohl se ha utilizado desde al menos el año 5000 a. C., citando estudios anteriores."
  fr: "Une étude en libre accès, évaluée par des pairs, portant sur 11 récipients à khôl de la collection du musée Petrie. Son introduction indique que le khôl est utilisé depuis au moins 5000 avant notre ère, citant des études antérieures."
  ur: "پیٹری میوزیم کے مجموعے میں 11 کوہل کنٹینرز کا ہم مرتبہ جائزہ لیا کھلا رسائی کا مطالعہ۔ اس کے تعارف میں کہا گیا ہے کہ کوہل کم از کم 5000 قبل مسیح سے استعمال ہوتا رہا ہے، ابتدائی مطالعات کا حوالہ دیتے ہوئے"
  tr: "Hakemli açık erişimli bir çalışma, Petri Müzesi koleksiyonundan 11 kohl kasesinin içeriğini analiz etmektedir; girişinde kohl'un en az MÖ 5000'den beri kullanıldığı belirtilmiştir ve bu tarih daha önceki çalışmalara atıfta bulunulmuştur."
  id: "Sebuah studi akses terbuka yang ditinjau sejawat menganalisis isi 11 mangkuk kohl dari koleksi Museum Petri; pendahuluannya menyatakan bahwa kohl telah digunakan setidaknya sejak 5000 SM, dengan tanggal ini merujuk pada studi sebelumnya."
title: "Recipes of Ancient Egyptian kohls more diverse than previously thought"
