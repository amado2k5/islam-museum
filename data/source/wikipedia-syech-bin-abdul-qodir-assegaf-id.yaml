summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن الشيخ بن عبد القادر السقاف ⁦(الحبيب شيخ)⁩، مراجعة 18 سبتمبر 2026؛ تُستخدم لوقائع الكيان فقط. تفصّل مولده في سوراكارتا سنة 1961 وتربيته على يد أبيه ودراسته على الحبيب أنيس الحبشي، وقيادته مجلس أحباب المصطفى وأداءه الصلوات، وعضويته في مجلس نهضة العلماء المركزي 2022–2027."
  en: "Indonesian Wikipedia article on Syech bin Abdul Qodir Assegaf (Habib Syech), revision of 18 September 2026; used for entity facts only. It details his birth in Surakarta in 1961, his upbringing by his father and study with Habib Anis bin Alwi al-Habsyi, his leadership of the Majlis Ahbaabul Musthofa and his sholawat performance, and his seat as A'wan of Nahdlatul Ulama's central board for 2022–2027."
  es: "Artículo de la Wikipedia en indonesio sobre Habib Syech, revisado el 18 de septiembre de 2026; utilizado únicamente para datos sobre la entidad. Detalla su nacimiento en Surakarta en 1961, su crianza por su padre y sus estudios con Habib Anis bin Alwi al-Habsyi, su liderazgo del Majlis Ahbaabul Musthofa y su desempeño en sholawat, y su puesto como A'wan de la Junta Central de Nahdlatul Ulama para 2022–2"
  fr: "Article de Wikipédia indonésien sur Habib Syech, mis à jour le 18 septembre 2026; utilisé uniquement à des fins d’information sur l’entité. Il détaille sa naissance à Surakarta en 1961, son éducation par son père et ses études auprès de Habib Anis bin Alwi al-Habsyi, son rôle à la tête du Majlis Ahbaabul Musthofa et ses prestations de sholawat, ainsi que son poste d’A’wan au sein du Conseil central de Nahdlatul Ulama pour l’année 2022-2023."
  ur: "حبیب سیچ پر انڈونیشین ویکیپیڈیا مضمون، 18 ستمبر 2026 کو نظر ثانی شدہ؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1961 میں سوراکارتہ میں ان کی پیدائش، ان کی پرورش ان کے والد نے کی اور حبیب انیس بن علوی الحبسی کے ساتھ تعلیم، ان کی مجلس احباب المصطوفہ کی قیادت اور ان کی شوالات کی کارکردگی، اور 2022-2 کے لیے نہدلۃ العلماء کے مرکزی بورڈ کے اعوان کے طور پر ان کی نشست کی تفصیلات بیان کی گئیں۔"
