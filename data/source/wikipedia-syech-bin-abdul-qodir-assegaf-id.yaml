reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. Much of the article is thinly referenced — its reference list is short and its YouTube subscriber figure cites the channel's own About page — so the record built from it is correspondingly spare. It records: born 20 September 1961 at Semanggi, Pasar Kliwon, Surakarta; his first teacher his father, Habib Abdul Qodir bin Abdurrahman as-Segaf, imam of the Jami' Assegaf mosque; further guidance from Habib Anis bin Alwi al-Habsyi; the Majlis Ahbaabul Musthofa founded about 1998 at Mertodranan, Solo, out of its Rotibul Haddad, Burdah and Simthud Duror gatherings; his albums from 2005; and his A'wan seat on Nahdlatul Ulama's central board for 2022–2027. It names no school for him. Read in full on 15 November 2026."
