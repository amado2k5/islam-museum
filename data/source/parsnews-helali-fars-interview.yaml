reliability_note: "Read in full on 7 November 2026. His own words in interview: a primary source for his birth — 'I was born on 12 Aban 1360 in Khorramshahr, but they backdated my birth certificate a little for schooling and wrote the month of Shahrivar; we were war-displaced in Khorramshahr at the time and I received my certificate in Tehran, so I was born in Khorramshahr and raised in Tehran' — which resolves the September/November discrepancy in the English Wikipedia article, and for his schooling (building drafting at high school; two terms of judicial law, then withdrawal), his entry into Heyat al-Reza as a schoolboy, taking over its sessions after Abbas Saberi's martyrdom in 1374, crowds of seven to eight thousand at his hey'at's busiest nights, and his preference for the shoor style. It attests no school for him; he speaks throughout as a maddah and zakir of the Ahl al-Bayt, which is his profession."
