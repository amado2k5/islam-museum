summary:
  ar: "مقابلة مطوّلة لوكالة فارس مع عبد الرضا هلالي أعادت بارس نيوز نشرها: يقول فيها إنه وُلد في 12 آبان 1360 في خرمشهر ونشأ في طهران، وإن شهادة ميلاده أُرّخت بشهر شهريور، وإنه بدأ المدح فتىً في هيئة الرضا بعد استشهاد عباس صابري، ويدافع عن أسلوب الشور."
  en: "A long Fars News Agency interview with Abdolreza Helali, republished by Pars News: he states he was born on 12 Aban 1360 in Khorramshahr and raised in Tehran, that his birth certificate was backdated into the month of Shahrivar, that he began eulogising as a boy at Heyat al-Reza after Abbas Saberi's martyrdom, and he defends the shoor style."
title: "ماجرای سرمه و خراب‌شدن حنجره هلالی"
