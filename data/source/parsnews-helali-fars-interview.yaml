label: { ar: "مقابلة عبد الرضا هلالي مع فارس — بارس نيوز", en: "Interview with Abdolreza Helali (Fars, via Pars News)" }
summary:
  ar: "مقابلة مطوّلة لوكالة فارس مع عبد الرضا هلالي أعادت بارس نيوز نشرها: يقول فيها إنه وُلد في 12 آبان 1360 في خرمشهر ونشأ في طهران، وإن شهادة ميلاده أُرّخت بشهر شهريور، وإنه بدأ المدح فتىً في هيئة الرضا بعد استشهاد عباس صابري، ويدافع عن أسلوب الشور."
  en: "A long Fars News Agency interview with Abdolreza Helali, republished by Pars News: he states he was born on 12 Aban 1360 in Khorramshahr and raised in Tehran, that his birth certificate was backdated into the month of Shahrivar, that he began eulogising as a boy at Heyat al-Reza after Abbas Saberi's martyrdom, and he defends the shoor style."
  es: "Una larga entrevista de la agencia de noticias Fars con Abdolreza Helali, republicada por Pars News: afirma que nació el 12 de Aban de 1360 en Khorramshahr y se crió en Teherán, que su certificado de nacimiento fue fechado retroactivamente en el mes de Shahrivar, que comenzó a pronunciar elogios desde niño en Heyat al-Reza después del martirio de Abbas Saberi, y defiende el estilo shoor."
  fr: "Un long entretien de l'agence de presse Fars avec Abdolreza Helali, republié par Pars News: il déclare être né le 12 Aban 1360 à Khorramshahr et avoir grandi à Téhéran, que son acte de naissance a été antidaté au mois de Shahrivar, qu'il a commencé à prononcer des éloges funèbres dès son enfance à Heyat al-Reza après le martyre d'Abbas Saberi, et il défend le style shoor."
  ur: "عبدالرضا ہلالی کے ساتھ فارس نیوز ایجنسی کا ایک طویل انٹرویو، جسے پارس نیوز نے دوبارہ شائع کیا: وہ بتاتا ہے کہ وہ 12 ابان 1360 کو خرمشہر میں پیدا ہوئے اور تہران میں پرورش پائی، کہ اس کی پیدائش کا سرٹیفکیٹ ماہِ شہروار سے منسوب ہے، کہ اس نے حیاۃ الرضا میں لڑکوں کے طور پر عباس صابری کے طرز کے بعد تعریف کرنا شروع کر دی، اور اس نے مارفین کے انداز سے کہا۔"
  tr: "Fars Ajansı'nın Abdolreza Hilali ile yaptığı kapsamlı bir röportajda, Pars News tarafından yeniden yayımlanan, 3 Kasım 1981'de Khorramshahr'da doğduğu, Tahran'da büyüdüğü, doğum belgesinin Eylül tarihli olduğu ve Abbas Saberi'nin şehitliğinden sonra genç bir adamı Reza şeklinde övmeye başladığı ve Şur tarzını savunduğu belirtiliyor."
  id: "Wawancara panjang oleh Fars Agency dengan Abdolreza Hilali, yang diterbitkan ulang oleh Pars News, menyatakan bahwa ia lahir pada 3 November 1981 di Khorramshahr dan dibesarkan di Teheran, akta kelahirannya bertanggal September, dan ia mulai memuji seorang pemuda dalam wujud Reza setelah Abbas Saberi menjadi syahid, serta membela gaya Shur."
title: "ماجرای سرمه و خراب‌شدن حنجره هلالی"
