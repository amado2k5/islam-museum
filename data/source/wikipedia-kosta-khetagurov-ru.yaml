summary:
  ar: "مقالة ويكيبيديا الروسية عن كوستا خيتاغوروف؛ تُستخدم لوقائع الكيان فقط. توثّق حضوره صلوات الكنيسة الأوسيتية في فلاديقوقاز، وجنازته الأرثوذكسية فيها بالروسية والأوسيتية، ودفنه في مقبرتها، دون أن تسمّي انتماءه الديني صراحة."
  en: "Russian Wikipedia article on Kosta Khetagurov; used for entity facts only. It documents his attendance at services of the Ossetian Church in Vladikavkaz, his Orthodox funeral rite there in Russian and Ossetian, and his burial in its necropolis, without naming his religious affiliation in so many words."
  es: "Artículo de la Wikipedia en ruso sobre Kosta Khetagurov; utilizado únicamente para obtener información sobre la persona. Documenta su asistencia a los servicios religiosos de la Iglesia Osetia en Vladikavkaz, su rito funerario ortodoxo celebrado allí en ruso y osetio, y su entierro en la necrópolis, sin mencionar explícitamente su afiliación religiosa."
  fr: "Article de Wikipédia en russe sur Kosta Khetagurov; utilisé uniquement à titre informatif. Il relate sa fréquentation des offices de l’Église ossète de Vladikavkaz, ses funérailles orthodoxes célébrées en russe et en ossète, et son inhumation dans sa nécropole, sans toutefois mentionner explicitement son appartenance religieuse."
  ur: "کوسٹا کھیٹاگورو پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ولادیکاوکاز میں اوسیشین چرچ کی خدمات میں اس کی حاضری، روسی اور اوسیشین زبان میں اس کے آرتھوڈوکس جنازے کی رسم، اور اس کے مقبرے میں اس کی تدفین، ان کی مذہبی وابستگی کا اتنے الفاظ میں نام لیے بغیر دستاویزی ہے۔"
  tr: "Kosta Khitagorov hakkında Rusça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Katılımı, Vladikavkaz'daki Osetya Kilisesi'nin dualarını, oradaki Ortodoks cenazesini Rusça ve Osetçece olarak ve mezarlığında defnedilmesini belgelemektedir, dini aidiyeti açıkça belirtilmemektedir."
  id: "Artikel Wikipedia Rusia tentang Kosta Khitagorov; digunakan hanya untuk fakta entitas tersebut. Kehadirannya mendokumentasikan doa Gereja Ossetia di Vladikavkaz, pemakamannya yang Ortodoks di sana dalam bahasa Rusia dan Ossetia, serta pemakamannya di pemakaman gereja tersebut, tanpa secara eksplisit menyebutkan afiliasi agamanya."
