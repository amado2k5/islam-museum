summary:
  ar: "مقالة ويكيبيديا العربية عن صدام حسين؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 28 أبريل 1937 في العوجة ونشأته في بيت خاله خيرالله طلفاح وانتسابه إلى عشيرة البيجات السنية من قبيلة ألبو ناصر، وهو تأطير عشائري أسري، ورئاسته وإعدامه في معسكر العدالة بالكاظمية في بغداد في 30 ديسمبر 2006، ولا يحمل صندوق معلوماتها حقل ديانة ولا يسمّي نصّها مذهبًا شخصيًا له."
  en: "Arabic Wikipedia article on Saddam Hussein; used for entity facts only. It gives his birth on 28 April 1937 at al-Awja, his upbringing in the house of his uncle Khairallah Talfah, and his belonging to the al-Bayjat clan, described as Sunni, of the Albu Nasir tribe — clan and family framing — his presidency, and his execution at Camp Justice in Kadhimiya, Baghdad, on 30 December 2006. Its infobox carries no religion field and its text names no personal school for him."
