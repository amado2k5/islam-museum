summary:
  ar: "مقالة ويكيبيديا العربية عن صدام حسين؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 28 أبريل 1937 في العوجة ونشأته في بيت خاله خيرالله طلفاح وانتسابه إلى عشيرة البيجات السنية من قبيلة ألبو ناصر، وهو تأطير عشائري أسري، ورئاسته وإعدامه في معسكر العدالة بالكاظمية في بغداد في 30 ديسمبر 2006، ولا يحمل صندوق معلوماتها حقل ديانة ولا يسمّي نصّها مذهبًا شخصيًا له."
  en: "Arabic Wikipedia article on Saddam Hussein; used for entity facts only. It gives his birth on 28 April 1937 at al-Awja, his upbringing in the house of his uncle Khairallah Talfah, and his belonging to the al-Bayjat clan, described as Sunni, of the Albu Nasir tribe — clan and family framing — his presidency, and his execution at Camp Justice in Kadhimiya, Baghdad, on 30 December 2006. Its infobox carries no religion field and its text names no personal school for him."
  es: "Artículo de Wikipedia en árabe sobre Saddam Hussein; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 28 de abril de 1937 en al-Awja, su crianza en la casa de su tío Khairallah Talfah y su pertenencia al clan al-Bayjat, descrito como sunita, de la tribu Albu Nasir (un marco de clan y familia), su presidencia y su ejecución en el Campo de Justicia en Kadhimiya, Bagdad, el 30 de diciembre de 2006. Su ficha informativa no incluye información sobre religión y su texto no menciona ninguna escuela a la que perteneciera."
  fr: "Article de Wikipédia en arabe sur Saddam Hussein; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 28 avril 1937 à al-Awja, son enfance chez son oncle Khairallah Talfah, son appartenance au clan al-Bayjat, décrit comme sunnite, de la tribu Albu Nasir (structuration clanique et familiale), sa présidence et son exécution au camp de justice de Kadhimiya, à Bagdad, le 30 décembre 2006. Son infobox ne comporte aucun champ « religion » et le texte ne mentionne aucune école personnelle."
