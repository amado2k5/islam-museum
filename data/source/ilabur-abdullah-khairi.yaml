reliability_note: "A Malaysian biodata aggregator with named editorial review, used for entity facts: Abdullah Khairi, born 15 September 1968 at Sidam Kanan, Kedah; independent preacher, writer and business owner; founder of Maahad Tahfiz As-Syafie (MATAS) on 18 January 2015; owner of Kafe UAK at Glenmarie, Shah Alam, run on an eat-and-donate concept; author of Insan Rabbani Pelajar Cemerlang, Tuhan Bayar Cash, Sound Direct and Syurga Pak Hang; a ceramah voice on Radio Mutiara FM, Radio IKIM and Kedah FM. His listed higher education (UPM forestry diploma and electrical-engineering degree, Arabic diploma, Islamic-education degree, counselling master's and PhD) is carried in the museum record as this profile reports it. Read via search extract on 15 November 2026."
