summary:
  ar: "مقالة ويكيبيديا الأردية عن ناصر حسين؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 28 مارس 1968 وقيادته إنجلترا بين 1999 و2003 ومسيرته الدولية (1990-2004) وأعلى نتيجة له 207."
  en: "Urdu Wikipedia article on Nasser Hussain; used for entity facts only. It records his birth on 28 March 1968, his England captaincy between 1999 and 2003, his international career from 1990 to 2004 and his highest Test score of 207."
  es: "Artículo de Wikipedia en urdu sobre Nasser Hussain; se utiliza únicamente para datos biográficos. En él se registra su fecha de nacimiento, el 28 de marzo de 1968, su capitanía de Inglaterra entre 1999 y 2003, su carrera internacional desde 1990 hasta 2004 y su puntuación más alta en partidos de prueba, de 207."
  fr: "Article de Wikipédia en ourdou sur Nasser Hussain; utilisé uniquement pour les informations biographiques. Il mentionne sa naissance le 28 mars 1968, son capitanat de l’équipe d’Angleterre entre 1999 et 2003, sa carrière internationale de 1990 à 2004 et son meilleur score en test-match: 207."
  ur: "ناصر حسین پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 28 مارچ 1968 کو ان کی پیدائش، 1999 اور 2003 کے درمیان انگلینڈ کی کپتانی، 1990 سے 2004 تک ان کا بین الاقوامی کیریئر اور 207 کا ان کا سب سے زیادہ ٹیسٹ سکور ریکارڈ کیا گیا ہے۔"
  tr: "Nasser Hussein hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 28 Mart 1968'de doğdu, 1999-2003 yılları arasında İngiltere'yi yönetti, uluslararası kariyeri (1990-2004) ve en yüksek puanı 207 idi."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Nasser Hussein; digunakan hanya untuk fakta entitas. Ia lahir pada 28 Maret 1968, memimpin Inggris antara 1999 dan 2003, karier internasionalnya (1990-2004), dan skor tertingginya adalah 207."
