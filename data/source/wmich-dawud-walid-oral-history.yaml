summary:
  ar: "مقابلة تاريخ شفوي مع الإمام داود وليد ضمن مشروع «حلم» لرواية القصص في جامعة وسترن ميشيغان (أكتوبر 2020): وُلد في ديترويت في 22 نوفمبر 1971، واعتنق الإسلام في أواخر مراهقته، وخدم في البحرية الأمريكية، وعاد إلى ديترويت سنة 1998، وهو أول مدير تنفيذي أمريكي من أصل أفريقي لفرع ميشيغان من مجلس العلاقات الأمريكية الإسلامية (كير)."
  en: "Oral history interview with Imam Dawud Walid in the Dream Storytelling Project at Western Michigan University (October 2020): born in Detroit on 22 November 1971, he embraced Islam in his late adolescence, served in the United States Navy, returned to Detroit in 1998, and is the first African American executive director of the Michigan chapter of the Council on American-Islamic Relations (CAIR)."
