reliability_note: "His own oral-history testimony, in two sessions (5 and 25 October 2020) conducted by Zayd Walid and written up with the project's research director, Dr Alisa Perkins; a primary source for his biography, consulted 26 October 2026. It states that he was born in Detroit, Michigan on 22 November 1971 to parents from Virginia and Michigan; that he embraced Islam from Christianity in his late adolescence, influenced by The Autobiography of Malcolm X and conscious rap; that he served four years in the Navy; that after returning to Detroit in 1998 he attended Historic Masjid Wali Muhammad and studied Islam and Arabic with teachers locally and abroad; that he taught at Al-Ikhlas Training Academy and Wayne County Community College and reported for The Muslim Journal and The Muslim Observer; and that he serves as the first African American executive director of CAIR's Michigan chapter. It names no legal school or order for him."
