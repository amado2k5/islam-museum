reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Covers her birth on 23 August 1954 at the family home on Queen Street, Singapore, to an Indian-Muslim father who worked as a watchman and died when she was eight, and a Malay mother; the family's poverty and her childhood help selling nasi padang; Singapore Chinese Girls' School and Tanjong Katong Girls' School; her law degree from the University of Singapore in 1978, call to the Bar in 1981, NUS master's in law in 2001 and honorary doctorate in 2016; her NTUC career from legal officer in 1978 to director of legal services in 1992 and deputy secretary-general from 2007 to 2011, and her ILO workers' roles; her election as MP in 2001 for Jurong GRC and later Marsiling–Yew Tee (2015–2017); her minister-of-state posts; her election on 14 January 2013 as the first woman Speaker of Parliament; the 2017 presidential election, reserved for the Malay community under the 2016 constitutional amendment, her resignation as Speaker, MP and PAP member on 7 August 2017, her status as sole candidate issued a Certificate of Eligibility, and her swearing-in on 14 September 2017 as Singapore's eighth president — its first woman president and first Malay president in 47 years; her condemnations as an MP of the Islamic State's acts as un-Islamic; her initial residence in her Yishun HDB flat and her October 2017 move on security advice; her approval of draws on past reserves totalling S$52 billion during the 2020 COVID-19 budgets, the largest since independence; her 29 May 2023 announcement that she would not seek re-election, the end of her term on 13 September 2023 and her succession by Tharman Shanmugaratnam; her chancellorship of the Singapore University of Social Sciences from 1 October 2023; and her honours, including the Order of Temasek (with High Distinction) in 2023, Saudi Arabia's Collar of the Order of King Abdulaziz in 2019 and Kazakhstan's Order of Friendship, first class, in 2023. It records that her identity card categorises her as Indian by paternal lineage while she identifies with, and ran as a member of, the Malay–Muslim community, that she 'identifies as a Muslim', and the attributed criticism of her uncontested election, including Tan Cheng Bock's description of hers as Singapore's 'most controversial presidency'. It names no school for her."
