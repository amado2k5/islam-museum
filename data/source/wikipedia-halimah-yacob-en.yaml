  ar: "مقالة ويكيبيديا الإنجليزية عن حليمة يعقوب؛ تُستخدم لوقائع الكيان فقط. توثّق نشأتها في فقر في سنغافورة، ومسيرتها في النقابات والقانون، ورئاستها البرلمان، ثم رئاستها لسنغافورة 2017–2023 بوصفها أول امرأة وأول رئيس ملايوي منذ 47 عامًا."
  en: "English Wikipedia article on Halimah Yacob; used for entity facts only. It records her poor childhood in Singapore, her union and legal career, her speakership of Parliament, and her presidency of Singapore in 2017–2023 as its first woman president and first Malay president in 47 years."
