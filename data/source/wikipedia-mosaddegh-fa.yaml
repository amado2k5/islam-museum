summary:
  ar: "مقالة ويكيبيديا الفارسية عن محمد مصدق؛ تُستخدم لوقائع الكيان فقط. تروي دراسته للحقوق في فرنسا وسويسرا ورئاسته للحكومة ومعركته مع البلاط، وتقتبس حرفيًا من كتاب محاكمته العسكرية تصريحه في الجلسة السابعة عشرة من محاكمته في 7 آذر 1332 أنه يعترف بأنه مسلم وشيعي اثنا عشري وأن مسلكه مسلك سيد الشهداء، وتذكر أطروحته للدكتوراه عن الوصية في الفقه الإسلامي ومذهب الشيعة، ووفاته في مستشفى نجميه بطهران في 14 اسفند 1345."
  en: "Persian Wikipedia article on Mohammad Mosaddegh; used for entity facts only. It recounts his legal studies in France and Switzerland, his premiership and his trial, and quotes verbatim, from the published record of his military trial, his declaration at the seventeenth session on 7 Azar 1332 that he confessed himself a Muslim and a Twelver Shia whose path was that of Husayn; it also records his doctoral thesis on wills in Islamic law and the Shia school, and his death at Najmieh Hospital in Tehran on 14 Esfand 1345, corresponding to 5 March 1967."
  es: "Artículo de Wikipedia en persa sobre Mohammad Mosaddegh; utilizado únicamente para datos sobre la persona. Relata sus estudios jurídicos en Francia y Suiza, su mandato como primer ministro y su juicio, y cita textualmente, del acta publicada de su juicio militar, su declaración en la decimoséptima sesión, el 7 de Azar de 1332, en la que se confesó musulmán y chií duodecimano, cuyo camino era el de Husayn; también recoge su tesis doctoral sobre testamentos en el derecho islámico y la escuela chií, y su fallecimiento en el Hospital Najmieh de Teherán el 14 de Esfand de 1345, correspondiente al 5 de marzo de 1967."
  fr: "Article de Wikipédia en persan sur Mohammad Mossadegh; utilisé uniquement pour les informations factuelles. Il relate ses études de droit en France et en Suisse, son mandat de Premier ministre et son procès, et cite textuellement, d'après le compte rendu publié de son procès militaire, sa déclaration lors de la dix-septième session, le 7 Azar 1332, dans laquelle il confessait être musulman et chiite duodécimain, suivant la voie de Husayn; il mentionne également sa thèse de doctorat sur les testaments en droit islamique et dans l'école chiite, ainsi que sa mort à l'hôpital Najmieh de Téhéran le 14 Esfand 1345, correspondant au 5 mars 1967."
  ur: "محمد مصدق پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں فرانس اور سوئٹزرلینڈ میں اس کی قانونی تعلیم، اس کی وزارت عظمیٰ اور اس کے مقدمے کا تذکرہ کیا گیا ہے، اور اس کے فوجی مقدمے کے شائع شدہ ریکارڈ، 7 آزار 1332 کو سترہویں اجلاس میں اس کے اس اعلان سے لفظی طور پر نقل کیا گیا ہے کہ اس نے اپنے آپ کو ایک مسلمان اور بارہویں شیعہ کا اعتراف کیا ہے جس کا راستہ حسین کا تھا۔ اس میں اسلامی قانون اور شیعہ مکتب میں وصیت پر ان کا ڈاکٹریٹ کا مقالہ بھی درج ہے، اور تہران کے نجمیہ ہسپتال میں ان کی وفات 14 اسفند 1345 کو، جو کہ 5 مارچ 1967 کو ہوئی تھی۔"
