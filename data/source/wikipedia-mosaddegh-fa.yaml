summary:
  ar: "مقالة ويكيبيديا الفارسية عن محمد مصدق؛ تُستخدم لوقائع الكيان فقط. تروي دراسته للحقوق في فرنسا وسويسرا ورئاسته للحكومة ومعركته مع البلاط، وتقتبس حرفيًا من كتاب محاكمته العسكرية تصريحه في الجلسة السابعة عشرة من محاكمته في 7 آذر 1332 أنه يعترف بأنه مسلم وشيعي اثنا عشري وأن مسلكه مسلك سيد الشهداء، وتذكر أطروحته للدكتوراه عن الوصية في الفقه الإسلامي ومذهب الشيعة، ووفاته في مستشفى نجميه بطهران في 14 اسفند 1345."
  en: "Persian Wikipedia article on Mohammad Mosaddegh; used for entity facts only. It recounts his legal studies in France and Switzerland, his premiership and his trial, and quotes verbatim, from the published record of his military trial, his declaration at the seventeenth session on 7 Azar 1332 that he confessed himself a Muslim and a Twelver Shia whose path was that of Husayn; it also records his doctoral thesis on wills in Islamic law and the Shia school, and his death at Najmieh Hospital in Tehran on 14 Esfand 1345, corresponding to 5 March 1967."
