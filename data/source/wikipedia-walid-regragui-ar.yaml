summary:
  ar: "مقالة ويكيبيديا العربية عن وليد الركراكي؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 23 سبتمبر 1975 في كورباي إيسون بفرنسا ونشأته في أسرة مغربية من مدينة الفنيدق، وتسرد مسيرته لاعبًا ومدربًا حتى قيادته المغرب إلى المركز الرابع في مونديال 2022."
  en: "Arabic Wikipedia article on Walid Regragui; used for entity facts only. It confirms his birth on 23 September 1975 in Corbeil-Essonnes, France, and his upbringing in a Moroccan family from Fnideq, and lists his playing and coaching career through Morocco's fourth place at the 2022 World Cup."
  es: "Artículo en árabe de la Wikipedia sobre Walid Regragui; utilizado únicamente para datos sobre la persona. Confirma su nacimiento el 23 de septiembre de 1975 en Corbeil-Essonnes, Francia, y su crianza en una familia marroquí de Fnideq. Asimismo, detalla su trayectoria como jugador y entrenador hasta el cuarto puesto de Marruecos en la Copa Mundial de 2022."
  fr: "Article Wikipédia en arabe sur Walid Regragui; utilisé uniquement à des fins d'information sur l'entité. Il confirme sa naissance le 23 septembre 1975 à Corbeil-Essonnes, en France, et son enfance au sein d'une famille marocaine originaire de Fnideq, et retrace sa carrière de joueur et d'entraîneur jusqu'à la quatrième place du Maroc lors de la Coupe du monde 2022."
