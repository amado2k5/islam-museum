reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Regragui as born on 23 September 1975 in Corbeil-Essonnes and raised in a Moroccan family originating from Fnideq in northern Morocco. Its infobox has no religion field and its text makes no religion statement. It gives 45 Morocco caps against the English article's 44, and its honours list lags the English article (it does not record the 2025 Africa Cup of Nations title); the English article is followed on both points."
