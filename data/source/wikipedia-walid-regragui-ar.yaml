  ar: "مقالة ويكيبيديا العربية عن وليد الركراكي؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 23 سبتمبر 1975 في كورباي إيسون بفرنسا ونشأته في أسرة مغربية من مدينة الفنيدق، وتسرد مسيرته لاعبًا ومدربًا حتى قيادته المغرب إلى المركز الرابع في مونديال 2022."
