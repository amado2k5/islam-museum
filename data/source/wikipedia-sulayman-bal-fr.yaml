reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives no birth year; it places his overthrow of the Denianke dynasty in 1776 alongside Abdoul Kader Kane, who succeeded him, and has him die soon after, on his way to fight the Moors. It records his Qur'anic studies at Cayor, in Mauritania, in Futa Jallon, at Pir and in Bundu, his abolition of slavery and of the caste regime, and his celebrated charge to the people of Futa against any imam who grows rich or makes the imamate hereditary. Checked 1 November 2026."
