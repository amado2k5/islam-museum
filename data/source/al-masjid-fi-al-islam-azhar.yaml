label:
  ar: "المسجد في الإسلام: عبادة وثقافة ⁦(الجزء الأول)⁩ — محمد رجب البيومي"
  en: "The Mosque in Islam: Worship and Culture (Part One) — Muhammad Rajab al-Bayoumi"
summary:
  ar: "كتاب الدكتور محمد رجب البيومي، ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، عن دور المساجد في التربية والثقافة العلمية، وفيه فصول عن المسجد النبوي والمسجد الحرام وعبد الله بن عمر؛ 166 صفحة، إشراف الأمين العام للمجمع."
  en: "Muhammad Rajab al-Bayoumi's book in the Scientific Series of the Islamic Research Academy of al-Azhar, on the role of mosques in religious education and learning; part one covers the Prophet's Mosque, the Sacred Mosque and Abdullah ibn Umar; 166 pages, supervised by the Academy's Secretary-General."
  es: "El libro de Muhammad Rajab al-Bayoumi, perteneciente a la Serie Científica de la Academia de Investigación Islámica de al-Azhar, trata sobre el papel de las mezquitas en la educación y el aprendizaje religioso; la primera parte abarca la Mezquita del Profeta, la Mezquita Sagrada y Abdullah ibn Umar; consta de 166 páginas y fue supervisado por el Secretario General de la Academia."
  fr: "L'ouvrage de Muhammad Rajab al-Bayoumi dans la série scientifique de l'Académie de recherche islamique d'al-Azhar, sur le rôle des mosquées dans l'éducation et l'apprentissage religieux; la première partie couvre la Mosquée du Prophète, la Mosquée sacrée et Abdullah ibn Umar; 166 pages, supervisé par le secrétaire général de l'Académie."
  ur: "اسلامک ریسرچ اکیڈمی آف الازہر کی سائنسی سیریز میں محمد رجب البیومی کی کتاب، مذہبی تعلیم اور سیکھنے میں مساجد کے کردار پر؛ پہلا حصہ مسجد نبوی، مسجد حرام اور عبداللہ ابن عمر کا احاطہ کرتا ہے۔ اکیڈمی کے سیکرٹری جنرل کی زیر نگرانی 166 صفحات۔"
