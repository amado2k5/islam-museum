summary:
  ar: "مقالة ويكيبيديا التركية عن إسماعيل أنور باشا؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها دينه «الإسلام»، وتختلف في مولده بين 23 نوفمبر 1881 و6 ديسمبر 1882، وتروي مقتله عند قرية تشيغن سنة 1922."
  en: "Turkish Wikipedia article on İsmail Enver Pasha; used for entity facts only. Its infobox gives his religion as Islam, its birth date is given alternatively as 23 November 1881 or 6 December 1882, and it recounts his death at the village of Çeğen in 1922."
  es: "Artículo de la Wikipedia en turco sobre İsmail Enver Pasha; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que su religión era el Islam, su fecha de nacimiento aparece indistintamente como el 23 de noviembre de 1881 o el 6 de diciembre de 1882, y relata su fallecimiento en la aldea de Çeğen en 1922."
  fr: "Article de Wikipédia en turc sur İsmail Enver Pasha; utilisé uniquement pour les informations sur l'entité. Son infobox indique qu'il était de religion musulmane, sa date de naissance est mentionnée tantôt comme le 23 novembre 1881, tantôt comme le 6 décembre 1882, et il relate son décès au village de Çeğen en 1922."
  ur: "اسماعیل انور پاشا پر ترکی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے معلوماتی خانے میں اس کا مذہب اسلام بتایا گیا ہے، اس کی تاریخ پیدائش متبادل طور پر 23 نومبر 1881 یا 6 دسمبر 1882 دی گئی ہے، اور یہ 1922 میں Çeğen کے گاؤں میں اس کی موت کا ذکر کرتا ہے۔"
  tr: "İsmail Enver Paşa hakkında Türkçe Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bilgi kutusunda dini \"İslam\" olarak verilmiştir ve doğumu 23 Kasım 1881 ile 6 Aralık 1882 arasında değişir; ayrıca 1922'de Cheğen köyünde öldüğü anı anlatır."
  id: "Artikel Wikipedia Turki tentang İsmail Enver Pasha; digunakan hanya untuk fakta entitas. Kotak infonya mencantumkan agamanya sebagai \"Islam,\" dan kelahirannya bervariasi antara 23 November 1881 hingga 6 Desember 1882, serta menceritakan kematiannya di desa Cheğen pada tahun 1922."
