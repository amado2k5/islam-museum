reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. Its infobox gives his birth as 23 November 1881 'or 6 December 1882', with a note that his Turkish and German autobiographies give different dates, citing the TDV İslâm Ansiklopedisi; its lead repeats both readings, while the age computation in its death template uses 22 November 1881. It gives his birthplace as Istanbul, his death on 4 August 1922 at the village of Çeğen (Chaghan), in present-day Tajikistan, his first burial at Cegan Tepesi, and his resting place as the Abide-i Hürriyet (Monument of Liberty), Istanbul. Its infobox gives his religion (dini) as Islam, generically; its text names no school and no order for him."
