reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. Following a Dawn newspaper profile by Rauf Parekh, it gives his life as 1829 – 13 October 1900, educated at Farangi Mahal in Lucknow, driven from Lucknow by the 1857 rebellion to Kakori and then Rampur, where he served in the judiciary, headed the state library and succeeded Ghalib as the ruler's official poetic mentor, and dead at Hyderabad barely a month after arriving to seek support for his dictionary Ameer-ul-Lughaat. The article is internally inconsistent on the birth year: its lead and infobox give 1829, while its own death-date template computes his age from 1828; the Urdu article and Wikidata both give 21 February 1828, and the record follows those, marking the year debated. It lists 'mysticism' among the subjects of his poetry — a theme, not an affiliation — and makes no statement of his religion or school."
