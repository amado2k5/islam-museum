summary:
  ar: "مقالة ويكيبيديا العربية عن الداعية السعودي بدر بن نادر المشاري؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في الرياض سنة 1973، وتخرجه من كلية الشريعة بجامعة الإمام محمد بن سعود الإسلامية، وشيوخه، وعمله في الحرس الوطني وإمامته لجامع حطين، وسلاسل دروسه التلفزيونية، واعتقاله سنة 2023."
  en: "Arabic Wikipedia article on the Saudi preacher Badr ibn Nadir al-Mashari; used for entity facts only. It gives his birth in Riyadh in 1973, his graduation from the College of Sharia at Imam Muhammad ibn Saud Islamic University, his teachers, his work in the National Guard and as imam of the Hatin Mosque, his televised lesson series, and his arrest in 2023."
  es: "Artículo en árabe de la Wikipedia sobre el predicador saudí Badr ibn Nadir al-Mashari; utilizado únicamente para obtener información sobre la persona. En él se detallan su nacimiento en Riad en 1973, su graduación en la Facultad de Sharia de la Universidad Islámica Imam Muhammad ibn Saud, sus maestros, su trabajo en la Guardia Nacional y como imán de la Mezquita Hatin, su serie de lecciones televisadas y su arresto en 2023."
  fr: "Article de Wikipédia en arabe consacré au prédicateur saoudien Badr ibn Nadir al-Mashari; utilisé uniquement à des fins d’information sur l’entité. Il mentionne sa naissance à Riyad en 1973, son diplôme de la faculté de charia de l’université islamique Imam Muhammad ibn Saud, ses professeurs, son engagement dans la Garde nationale et comme imam de la mosquée Hatin, ses émissions de prédication télévisées et son arrestation en 2023."
  ur: "سعودی مبلغ بدر بن نادر المشاری پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1973 میں ریاض میں ان کی پیدائش، امام محمد بن سعود اسلامی یونیورسٹی کے کالج آف شریعہ سے اس کی گریجویشن، اس کے اساتذہ، نیشنل گارڈ میں ان کا کام اور حطین مسجد کے امام کی حیثیت سے، اس کی ٹیلی ویژن پر سبق آموز سیریز، اور 2023 میں اس کی گرفتاری شامل ہے۔"
  tr: "Suudi vaizi Badr bin Nader Al-Mishari hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1973'te Riyad'da doğduğu, İmam Muhammed bin Suud İslam Üniversitesi Şeriat Fakültesi'nden mezuniyeti, öğretmenleri, Ulusal Muhafızdaki çalışmaları ve Hittin Camii'ndeki imamı, televizyon dersleri serisi ve 2023'teki tutuklanışı gibi konuları içermektedir."
  id: "Artikel Wikipedia Arab tentang pendakwah Saudi Badr bin Nader Al-Mishari; hanya digunakan untuk fakta entitas. Artikel ini menyebutkan kelahirannya di Riyadh pada tahun 1973, kelulusannya dari Fakultas Syariah di Universitas Islam Imam Muhammad bin Saud, para gurunya, pekerjaannya di Garda Nasional dan imamnya di Masjid Hittin, rangkaian pelajaran televisinya, serta penangkapannya pada tahun 2023."
