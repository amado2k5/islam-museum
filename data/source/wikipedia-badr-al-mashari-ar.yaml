  ar: "مقالة ويكيبيديا العربية عن الداعية السعودي بدر بن نادر المشاري؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في الرياض سنة 1973، وتخرجه من كلية الشريعة بجامعة الإمام محمد بن سعود الإسلامية، وشيوخه، وعمله في الحرس الوطني وإمامته لجامع حطين، وسلاسل دروسه التلفزيونية، واعتقاله سنة 2023."
