reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision (fetched by oldid and asserted). The lead and infobox, citing his IslamWay scholar page, give his full name as Badr ibn Nadir ibn Sulayman al-Mashari al-Dosari, born in Riyadh in 1973 (paired in the lead with 1393 AH), imam of the Hatin Mosque of the National Guard in Riyadh; the body gives his Sharia degree from Imam Muhammad ibn Saud Islamic University, a master's on the life and legacy of Ibn Baz taken in Beirut, a doctorate (institution not named), his teachers (Ibn Baz, Ibn Uthaymeen, Salih al-Fawzan, Abd al-Rahman al-Barrak and Abdullah ibn Jibreen), his former post heading the National Guard's awareness and guidance section in Riyadh, and his television series on the Bedaya and Iqraa channels. His arrest on 17 July 2023 is cited in the article to BBC News Arabic of 20 July 2023; the release date of 21 January 2026 that the article reports is flagged in the article itself as unreferenced. The article names no school or madhhab for him in its text or infobox; its categories file him under Saudi Salafis, which is a category filing, not an attestation of his own school."
