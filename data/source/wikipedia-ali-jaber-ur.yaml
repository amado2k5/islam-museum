summary:
  ar: "مقالة ويكيبيديا الأردية عن علي عبد الله جابر؛ تُستخدم لوقائع الكيان فقط. تتبع المقالة الإنجليزية: مولده في أغسطس 1954 ⁦(ذي الحجة 1373)⁩ ووفاته في 14 ديسمبر 2005 ⁦(12 ذي القعدة 1426)⁩، وإمامته للحرم ومحاضرته بجدة؛ ولا تسمي مذهباً، وإن صنّفته فئاتها في الحنابلة."
  en: "Urdu Wikipedia article on Ali Abdullah Jaber; used for entity facts only. It follows the English article: birth in August 1954 (Dhu al-Hijjah 1373), death on 14 December 2005 (12 Dhu al-Qi'dah 1426), the Haram imamate and the Jeddah lectureship; it names no school, though its categories file him among Hanbalis."
  es: "Artículo de Wikipedia en urdu sobre Ali Abdullah Jaber; se utiliza únicamente para datos sobre la persona. Sigue al artículo en inglés: nacimiento en agosto de 1954 (Dhu al-Hijjah 1373), fallecimiento el 14 de diciembre de 2005 (12 Dhu al-Qi'dah 1426), el imamato del Haram y la cátedra de Jeddah; no menciona ninguna escuela, aunque sus categorías lo clasifican entre los hanbalíes."
  fr: "Article de Wikipédia en ourdou sur Ali Abdullah Jaber; utilisé uniquement pour les informations le concernant. Il reprend l’article en anglais: naissance en août 1954 (Dhu al-Hijjah 1373), décès le 14 décembre 2005 (12 Dhu al-Qi’dah 1426), imamat du Haram et chaire de Djeddah; il ne mentionne aucune école, bien que ses catégories le classent parmi les hanbalites."
  ur: "علی عبداللہ جابر پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انگریزی مضمون کی پیروی کرتا ہے: پیدائش اگست 1954 ⁦(ذی الحجہ 1373)⁩، وفات 14 دسمبر 2005 ⁦(12 ذی القعدہ 1426)⁩، حرم امامت اور جدہ لیکچر شپ؛ اس میں کسی مکتب کا نام نہیں ہے، حالانکہ اس کے زمرے اسے حنبلیوں میں درج کرتے ہیں۔"
  tr: "Ali Abdullah Caber hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. İngilizce makale şöyledir: Ağustos 1954'te doğduğu (Dhu al-Hijjah 1373) ve 14 Aralık 2005'teki ölümü (12 Dhu al-Qi'dah 1426), Haram imamı ve Cidde'deki dersi; bir düşünce okulu adı verilmemiştir, ancak grupları onu Hanbaliler arasında sınıflandırmıştır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Ali Abdullah Jaber; digunakan hanya untuk fakta entitas. Artikel dalam bahasa Inggris sebagai berikut: Kelahirannya pada Agustus 1954 (Dhu al-Hijjah 1373) dan kematiannya pada 14 Desember 2005 (12 Dhu al-Qi'dah 1426), imam Haram-nya dan kuliahnya di Jeddah; tidak menyebutkan aliran pemikiran manapun, meskipun kelompok-kelompoknya mengklasifikasikannya di antara Hanbali."
