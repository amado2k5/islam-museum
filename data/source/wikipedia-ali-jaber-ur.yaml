  ar: "مقالة ويكيبيديا الأردية عن علي عبد الله جابر؛ تُستخدم لوقائع الكيان فقط. تتبع المقالة الإنجليزية: مولده في أغسطس 1954 (ذي الحجة 1373) ووفاته في 14 ديسمبر 2005 (12 ذي القعدة 1426)، وإمامته للحرم ومحاضرته بجدة؛ ولا تسمي مذهباً، وإن صنّفته فئاتها في الحنابلة."
  en: "Urdu Wikipedia article on Ali Abdullah Jaber; used for entity facts only. It follows the English article: birth in August 1954 (Dhu al-Hijjah 1373), death on 14 December 2005 (12 Dhu al-Qi'dah 1426), the Haram imamate and the Jeddah lectureship; it names no school, though its categories file him among Hanbalis."
