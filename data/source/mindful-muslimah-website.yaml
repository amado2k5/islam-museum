summary:
  ar: "الموقع الرسمي لـ«مايندفل مسلمة»: سيرتها المنشورة تصفها قائدة مجتمعية ومتحدثة دولية ومعلمة ومرشدة، ومؤسِّسة «مدرسة اليقظة الذهنية للمسلمين»، ومقدمة بودكاست «المسلمة الواعية تتحدث»، مع عملها مديرة ومستشارة في أنظمة تعليمية في الولايات المتحدة ودبي."
  en: "The official Mindful Muslimah website: her published biography describes a community leader, international speaker, educator and mentor, the founder of the Muslim Mindfulness School and host of the Mindful Muslimah Speaks podcast, who has worked as an administrator and consultant in education systems in the United States and Dubai."
  es: "La página web oficial de Mindful Muslimah describe su biografía publicada como una líder comunitaria, oradora internacional, educadora y mentora, fundadora de la Escuela de Conciencia Plena Musulmana y presentadora del podcast Mindful Muslimah Speaks, que ha trabajado como administradora y consultora en sistemas educativos en Estados Unidos y Dubái."
  fr: "Le site officiel de Mindful Muslimah: sa biographie publiée décrit une leader communautaire, conférencière internationale, éducatrice et mentor, fondatrice de la Muslim Mindfulness School et animatrice du podcast Mindful Muslimah Speaks, qui a travaillé comme administratrice et consultante dans les systèmes éducatifs aux États-Unis et à Dubaï."
  ur: "Mindful Muslimah کی آفیشل ویب سائٹ: اس کی شائع شدہ سوانح عمری ایک کمیونٹی لیڈر، بین الاقوامی مقرر، معلم اور سرپرست، مسلم مائنڈفلنیس اسکول کے بانی اور Mindful Muslimah Speaks podcast کے میزبان کی وضاحت کرتی ہے، جس نے ریاستہائے متحدہ اور دبئی میں تعلیمی نظام میں بطور ایڈمنسٹریٹر اور کنسلٹنٹ کام کیا ہے۔"
