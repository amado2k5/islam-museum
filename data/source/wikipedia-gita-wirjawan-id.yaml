summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن غيتا ويرجاوان؛ تؤكد مولده في جاكرتا في ٢١ أيلول ١٩٦٥ من أب جاوي وأم ميناهاسية، ودراسته ومسيرته المصرفية، وتأسيسه أنكورا، ورئاسته هيئة تنسيق الاستثمار ووزارة التجارة، وأنشطة مؤسسة أنكورا التعليمية."
  en: "Indonesian Wikipedia article on Gita Wirjawan; it confirms his birth in Jakarta on 21 September 1965 to a Javanese father and a Minahasan mother, his education and banking career, his founding of Ancora, his chairmanship of the Investment Coordinating Board and the trade ministry, and the Ancora Foundation's education work."
  es: "Artículo de la Wikipedia en indonesio sobre Gita Wirjawan; confirma su nacimiento en Yakarta el 21 de septiembre de 1965, hijo de padre javanés y madre minahasan, su formación académica y su carrera bancaria, la fundación de Ancora, su presidencia del Consejo Coordinador de Inversiones y del Ministerio de Comercio, y la labor educativa de la Fundación Ancora."
  fr: "L'article de Wikipédia indonésien sur Gita Wirjawan confirme sa naissance à Jakarta le 21 septembre 1965 d'un père javanais et d'une mère minahasan, ses études et sa carrière dans le secteur bancaire, la fondation d'Ancora, sa présidence du Conseil de coordination des investissements et du ministère du Commerce, ainsi que le travail éducatif de la Fondation Ancora."
  ur: "گیتا ویرجاوان پر انڈونیشیائی ویکیپیڈیا مضمون؛ یہ 21 ستمبر 1965 کو جکارتہ میں ایک جاوانی والد اور مناہاسن کی والدہ کے ہاں اس کی پیدائش، ان کی تعلیم اور بینکنگ کیریئر، انکورا کی بانی، سرمایہ کاری کوآرڈینیٹنگ بورڈ اور وزارت تجارت کی ان کی چیئرمین شپ، اور انکورا فاؤنڈیشن کے تعلیمی کام کی تصدیق کرتا ہے۔"
