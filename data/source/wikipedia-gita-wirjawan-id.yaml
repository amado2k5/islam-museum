  ar: "مقالة ويكيبيديا الإندونيسية عن غيتا ويرجاوان؛ تؤكد مولده في جاكرتا في ٢١ أيلول ١٩٦٥ من أب جاوي وأم ميناهاسية، ودراسته ومسيرته المصرفية، وتأسيسه أنكورا، ورئاسته هيئة تنسيق الاستثمار ووزارة التجارة، وأنشطة مؤسسة أنكورا التعليمية."
