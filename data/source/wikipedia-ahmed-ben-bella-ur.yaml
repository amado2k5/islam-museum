summary:
  ar: "مقالة ويكيبيديا الأردية عن أحمد بن بلة؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تؤكد ولادته في 25 ديسمبر 1916 في مغنية ووفاته في 11 أبريل 2012 في الجزائر العاصمة، ويذكر صندوق معلوماتها دينه «الإسلام» بصورة عامة."
  en: "Urdu Wikipedia article on Ahmed Ben Bella; used for entity facts only. A short article confirming his birth on 25 December 1916 at Maghnia and his death on 11 April 2012 in Algiers; its infobox gives his religion as Islam in general."
  es: "Artículo de Wikipedia en urdu sobre Ahmed Ben Bella; utilizado únicamente para datos sobre la persona. Un breve artículo que confirma su nacimiento el 25 de diciembre de 1916 en Maghnia y su fallecimiento el 11 de abril de 2012 en Argel; su ficha informativa indica que profesaba el islam en general."
  fr: "Article de Wikipédia en ourdou sur Ahmed Ben Bella; utilisé uniquement à des fins d’information sur l’entité. Un court article confirme sa naissance le 25 décembre 1916 à Maghnia et son décès le 11 avril 2012 à Alger; son infobox indique qu’il était de confession musulmane."
  ur: "احمد بن بیلا پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 25 دسمبر 1916 کو مگنیہ میں اس کی پیدائش اور 11 اپریل 2012 کو الجزائر میں ان کی موت کی تصدیق کرنے والا ایک مختصر مضمون۔ اس کا انفو باکس اس کا مذہب عام طور پر اسلام کے طور پر دیتا ہے۔"
  tr: "Ahmed Ben Bella hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 25 Aralık 1916'da Maghnia'da doğduğunu ve 11 Nisan 2012'de Cezayir'de öldüğünü doğrulayan kısa bir makale ve bilgi kutusunda dinini genel olarak \"İslam\" olarak anmaktadır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Ahmed Ben Bella; hanya digunakan untuk fakta entitas. Sebuah artikel singkat yang mengonfirmasi kelahirannya pada 25 Desember 1916 di Maghnia dan kematiannya pada 11 April 2012 di Aljir, serta infobox-nya menyebutkan agamanya sebagai \"Islam\" secara umum."
