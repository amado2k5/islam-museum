label:
  ar: فتوح البلدان — البلاذري ⁦(طبعة مؤسسة المعارف)⁩
  en: Futuh al-Buldan — al-Baladhuri (Mu'assasat al-Ma'arif edition)
summary:
  ar: "كتاب البلاذري أحمد بن يحيى بن جابر ⁦(ت نحو 279هـ)⁩ في الفتوحات: طبعة مؤسسة المعارف، بيروت، بتاريخ غرة ذي الحجة 1407هـ الموافق 26 تموز ⁦(يوليو)⁩ 1987م، بتحقيق محققين لم تذكر أسماؤهم في صفحات المسح، مجلد واحد يليه فهرس مطول للأعلام والبلدان."
  en: "Al-Baladhuri's (d. c. 279 AH) book of the conquests: Mu'assasat al-Ma'arif edition, Beirut, dated 1 Dhu al-Hijja 1407 AH / 26 July 1987 CE, verified by two unnamed editors ⁦('المحققان')⁩, one volume followed by an extensive index of persons and places."
  es: "Libro de las conquistas de Al-Baladhuri (dc 279 AH): edición de Mu'assasat al-Ma'arif, Beirut, fechado el 1 de Dhu al-Hijja de 1407 AH / 26 de julio de 1987 CE, verificado por dos editores anónimos ⁦('المحققان')⁩, un volumen seguido de un extenso índice de personas y lugares."
  fr: "Livre des conquêtes d'Al-Baladhuri (dc 279 AH): édition Mu'assasat al-Ma'arif, Beyrouth, datée du 1 Dhu al-Hijja 1407 AH / 26 juillet 1987 CE, vérifié par deux éditeurs anonymes ⁦(« المحققان »)⁩, un volume suivi d'un index détaillé des personnes et des lieux."
  ur: "البلادھوری کی کتاب فتوحات: معاصص المعارف ایڈیشن، بیروت، مورخہ 1 ذی الحجہ 1407 ہجری / 26 جولائی 1987 عیسوی، جس کی تصدیق دو بے نام ایڈیٹروں ⁦('المحققان')⁩ سے ہوئی، ایک شخصی جلد اور اس کے بعد وسیع مقامات کا اشاریہ۔"
  tr: "Al-Baladhuri Ahmed ibn Yahya ibn Jabir'in (ö. yaklaşık 279 H) fetihler üzerine kitabı: Al-Ma'arif Vakfı, Beyrut baskısı, 1 Dhu al-Hicjah 1407 tarihli, 26 Temmuz 1987 M.S. tarihli, isimleri açıklanmayan editörler tarafından düzenlenmiş, inceleme sayfalarında adı geçmeyen isimsiz editörler tarafından tek bir cilt halinde ve ardından önemli kişiler ve ülkelerin uzun bir dizini yayımlanmıştır."
  id: "Buku Al-Baladhuri Ahmad ibn Yahya ibn Jabir (wafat sekitar 279 H) tentang penaklukan: Edisi Yayasan Al-Ma'arif, Beirut, bertanggal 1 Dhu al-Hijjah 1407 H, sesuai dengan 26 Juli 1987 M, disunting oleh editor yang tidak disebutkan namanya dalam halaman survei, dalam satu jilid diikuti dengan indeks panjang tokoh dan negara terkemuka."
