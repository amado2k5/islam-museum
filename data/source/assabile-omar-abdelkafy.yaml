reliability_note: "The speaker's own recorded lessons, published by the archive. The founder's standing instruction (25 October 2026) treats him as a trusted resource, and his statements in these recordings may be used and cited. This is a primary source for what he says (his teaching, his works and programmes, his accounts, his positions), not for historical events; history he narrates is recorded as his account. Episode pages give titles and durations but no recording dates; any date he gives is his statement. The archive's biography gives the birth as 1952 (on the 'labour day'), the English Wikipedia article gives 1 May 1951; both are kept as a conflict, never settled by choice. Transcripts are made locally (mlx-whisper, large-v3) and are imperfect: a name, number or date from a transcript is used only when a second pass agrees or a person has listened at the anchor. No licence statement was found on the site; robots.txt does not disallow the lesson pages or the media host. Checked 25 October 2026."
