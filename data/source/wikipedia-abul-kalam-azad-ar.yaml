  ar: "مقالة ويكيبيديا العربية عن أبي الكلام آزاد (1888–1958)؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في مكة سنة 1306 هـ / 1888 م ووفاته في 3 شعبان 1377 هـ / 22 فبراير 1958 م، وتربيته الصوفية، وتأسيسه مجلة «الهلال» سنة 1912 واعتقاله في رانشي، ورئاسته حزب المؤتمر 1923 و1940–1946، ومعارضته التقسيم، وكتبه ومنها «ترجمان القرآن»."
  en: "Arabic Wikipedia article on Abul Kalam Azad (1888–1958); used for entity facts only. It pairs his birth at Mecca as 1306 AH / 1888 and his death as 3 Sha'ban 1377 AH / 22 February 1958, mentions his Sufi upbringing, his founding of Al-Hilal in 1912 and his Ranchi imprisonment, his Congress presidencies of 1923 and 1940–1946, his opposition to partition, and his books including Tarjuman al-Quran."
