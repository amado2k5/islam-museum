summary:
  ar: "مقالة ويكيبيديا العربية عن أبي الكلام آزاد (1888–1958)؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في مكة سنة 1306 هـ / 1888 م ووفاته في 3 شعبان 1377 هـ / 22 فبراير 1958 م، وتربيته الصوفية، وتأسيسه مجلة «الهلال» سنة 1912 واعتقاله في رانشي، ورئاسته حزب المؤتمر 1923 و1940–1946، ومعارضته التقسيم، وكتبه ومنها «ترجمان القرآن»."
  en: "Arabic Wikipedia article on Abul Kalam Azad (1888–1958); used for entity facts only. It pairs his birth at Mecca as 1306 AH / 1888 and his death as 3 Sha'ban 1377 AH / 22 February 1958, mentions his Sufi upbringing, his founding of Al-Hilal in 1912 and his Ranchi imprisonment, his Congress presidencies of 1923 and 1940–1946, his opposition to partition, and his books including Tarjuman al-Quran."
  es: "Artículo de Wikipedia en árabe sobre Abul Kalam Azad (1888-1958); utilizado únicamente para datos sobre la persona. En él se indica su nacimiento en La Meca en 1306 AH / 1888 y su muerte el 3 de Sha'ban de 1377 AH / 22 de febrero de 1958, y se menciona su educación sufí, la fundación de Al-Hilal en 1912 y su encarcelamiento en Ranchi, sus presidencias del Congreso en 1923 y entre 1940 y 1946, su oposición a la partición y sus libros, entre ellos Tarjuman al-Quran."
  fr: "L'article de Wikipédia en arabe sur Abul Kalam Azad (1888-1958) est utilisé uniquement pour des informations sur l'entité. Il indique sa naissance à La Mecque en 1306 AH / 1888 et sa mort le 3 Sha'ban 1377 AH / 22 février 1958, mentionne son éducation soufie, la fondation d'Al-Hilal en 1912 et son emprisonnement à Ranchi, ses présidences du Congrès en 1923 et de 1940 à 1946, son opposition à la partition et ses ouvrages, dont Tarjuman al-Quran."
