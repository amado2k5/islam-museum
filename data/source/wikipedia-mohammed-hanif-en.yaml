reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Used for his birth in Okara in November 1964 — the article's stated date, which conflicts with Wikidata's 1965 and is therefore built as debated — his graduation from the Pakistan Air Force Academy as a pilot officer and move into journalism, his work for Newsline, the Washington Post and India Today, his 1996 move to London for the BBC and his headship of its Urdu service, his return to Pakistan in 2008, his novels from A Case of Exploding Mangoes (2008) to Red Birds (2018), his Sitara-e-Imtiaz of 2018 and his return of the award in December 2023, and his marriage to the actress Nimra Bucha. The article names no school or order for his faith."
