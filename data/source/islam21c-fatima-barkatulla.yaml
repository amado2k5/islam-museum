  en: "Islam21c: Fatima Barkatulla author page"
  ur: "«اسلام 21c: فاطمہ برکۃ اللہ کی مصنفہ صفحہ»"
summary:
  ar: "«صفحة المؤلفة فاطمة بركة الله في موقع Islam21c ⁦(رُوجعت في أكتوبر 2026)⁩. تصف شهادتين في العالمية: واحدة من كلية إبراهيم بتخصص الفقه، وأخرى من معهد السلام بامتياز منحها محمد أكرم الندوي، ودراستها الماجستير في الشريعة في سواس.»"
  en: "The author page of Fatima Barkatulla on Islam21c (consulted October 2026). It describes two Alimiyyah degrees — one from Ebrahim College with a fiqh specialisation and one from the AlSalam Institute with distinction, awarded by Muhammad Akram Nadwi — and her SOAS master's studies in Islamic law."
  ur: «Islam21c پر فاطمہ برکۃ اللہ کی مصنفہ صفحہ ⁦(اکتوبر 2026 میں رجوع کیا گیا)⁩۔»
  es: "Página de la autora Fatima Barkatulla en Islam21c (consultada en octubre de 2026). En ella describe dos títulos de Alimiyyah: uno del Ebrahim College con especialización en fiqh y otro del Instituto AlSalam con distinción, otorgado por Muhammad Akram Nadwi, y sus estudios de maestría en derecho islámico en la SOAS."
  fr: "La page d'auteur de Fatima Barkatulla sur Islam21c (consultée en octobre 2026) mentionne deux diplômes d'Alimiyyah: l'un du Ebrahim College avec une spécialisation en fiqh et l'autre de l'Institut AlSalam avec distinction, décerné par Muhammad Akram Nadwi; ainsi que ses études de master en droit islamique à la SOAS."
  tr: "\"Yazar Fatima Baraka Allah'ın İslam21c sayfasını (Ekim 2026'da incelenmiştir). İki uluslararası dereceyi anlatıyor: biri İbrahim Koleji'nden Fıkıh alanında uzmanlaşmış, diğeri ise Muhammed Ekrem El-Nadvi tarafından üstün başarıyla verilen Barış Enstitüsü'nden ve Soas'ta Şeriat alanında yüksek lisans derecesi.\""
  id: "\"Halaman penulis Fatima Baraka Allah tentang Islam21c (ditinjau pada Oktober 2026). Dia menggambarkan dua gelar internasional: satu dari Ibrahim College yang mengkhususkan diri dalam Jurisprudensi, dan satu lagi dari Institute of Peace dengan predikat penghargaan yang diberikan oleh Muhammad Akram Al-Nadwi, serta gelar master dalam Syariah di Soas.\""
