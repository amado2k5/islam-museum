summary:
  ar: "«صفحة المؤلفة فاطمة بركة الله في موقع Islam21c (رُوجعت في أكتوبر 2026). تصف شهادتين في العالمية: واحدة من كلية إبراهيم بتخصص الفقه، وأخرى من معهد السلام بامتياز منحها محمد أكرم الندوي، ودراستها الماجستير في الشريعة في سواس.»"
  en: "The author page of Fatima Barkatulla on Islam21c (consulted October 2026). It describes two Alimiyyah degrees — one from Ebrahim College with a fiqh specialisation and one from the AlSalam Institute with distinction, awarded by Muhammad Akram Nadwi — and her SOAS master's studies in Islamic law."
  ur: «Islam21c پر فاطمہ برکۃ اللہ کی مصنفہ صفحہ (اکتوبر 2026 میں رجوع کیا گیا)۔»
