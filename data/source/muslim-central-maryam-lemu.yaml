summary:
  ar: "صفحة بودكاست مريم ليمو على «مسلم سنترال» كما يعرضها فهرس ليستن نوتس؛ تحمل سيرتها الرسمية: متحدثة دولية وميسّرة ندوات، رئيسة الإدارة وإدارة الموارد في كلية نيو هورايزنز بمينا، مديرة في بروستارت للاستشارات، مقدمة برنامج «سيسترلي» على قناة أليف وبرامج رمضانية على شبكات عدة، تنتج سلاسل فيديو على يوتيوب وتستشير مدارس إسلامية في بناء الشخصية والقيادة القيمية؛ ويسرد الفهرس 74 حلقة منذ فبراير 2020."
  en: "The Muslim Central podcast page for Maryam Lemu as carried by the Listen Notes directory. It carries her official biography — international speaker and seminar facilitator, Head of Administration and Resource Management at New Horizons College, Minna, a director of ProStart Consultants, host of the talk show Sisterly on Alif TV and of Ramadan shows on several networks, producer of YouTube video series, and a consultant to Islamic schools on character development and values-driven leadership — and lists 74 episodes since February 2020."
