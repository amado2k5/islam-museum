summary:
  ar: "صفحة بودكاست مريم ليمو على «مسلم سنترال» كما يعرضها فهرس ليستن نوتس؛ تحمل سيرتها الرسمية: متحدثة دولية وميسّرة ندوات، رئيسة الإدارة وإدارة الموارد في كلية نيو هورايزنز بمينا، مديرة في بروستارت للاستشارات، مقدمة برنامج «سيسترلي» على قناة أليف وبرامج رمضانية على شبكات عدة، تنتج سلاسل فيديو على يوتيوب وتستشير مدارس إسلامية في بناء الشخصية والقيادة القيمية؛ ويسرد الفهرس 74 حلقة منذ فبراير 2020."
  en: "The Muslim Central podcast page for Maryam Lemu as carried by the Listen Notes directory. It carries her official biography — international speaker and seminar facilitator, Head of Administration and Resource Management at New Horizons College, Minna, a director of ProStart Consultants, host of the talk show Sisterly on Alif TV and of Ramadan shows on several networks, producer of YouTube video series, and a consultant to Islamic schools on character development and values-driven leadership — and lists 74 episodes since February 2020."
  es: "La página del podcast Muslim Central dedicada a Maryam Lemu, tal como aparece en el directorio Listen Notes, incluye su biografía oficial: oradora internacional y facilitadora de seminarios, jefa de administración y gestión de recursos en New Horizons College, Minna, directora de ProStart Consultants, presentadora del programa de entrevistas Sisterly en Alif TV y de programas especiales de Ramadán en varias cadenas, productora de series de vídeos de YouTube y consultora de escuelas islámicas en desarrollo del carácter y liderazgo basado en valores. La página enumera 74 episodios desde febrero de 2020."
  fr: "La page du podcast Muslim Central consacrée à Maryam Lemu, référencée dans l'annuaire Listen Notes, contient sa biographie officielle: conférencière internationale et animatrice de séminaires, responsable de l'administration et de la gestion des ressources au New Horizons College de Minna, directrice de ProStart Consultants, animatrice de l'émission Sisterly sur Alif TV et d'émissions sur le Ramadan diffusées sur plusieurs chaînes, productrice de séries vidéo sur YouTube et consultante auprès d'écoles islamiques en matière de développement du caractère et de leadership fondé sur les valeurs. On y trouve également la liste de 74 épisodes publiés depuis février 2020."
