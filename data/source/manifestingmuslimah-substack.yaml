summary:
  ar: "نصوص زهرة بيدرسن على سبستاك تحت علامة «مانيفستنغ مسلمة»؛ منها مقالتها «حين فقد الصبر معناه» التي تستعرض معاني الصبر الثلاثة في القرآن وتختمها بتوقيعها المعتاد «عيشوا في محبة، زهرة» — وهو التوقيع نفسه الذي تختم به حلقات بودكاستها."
  en: "Zahra Pedersen's Substack essays under the Manifesting Muslimah brand; among them 'When Sabr lost its meaning', on the three kinds of patience (sabr) in the Quran, signed with her customary 'Live in Love, Zahra' — the same sign-off she uses at the end of her podcast episodes."
  es: "Los ensayos de Zahra Pedersen en Substack, bajo la marca Manifesting Muslimah, incluyen \"Cuando el Sabr perdió su significado\", sobre los tres tipos de paciencia (sabr) en el Corán, firmado con su habitual \"Vive con amor, Zahra\", la misma despedida que usa al final de los episodios de su podcast."
  fr: "Les essais de Zahra Pedersen sur Substack sous la marque Manifesting Muslimah; parmi eux, « Quand la patience a perdu son sens », sur les trois types de patience (sabr) dans le Coran, signé de sa formule habituelle « Vis dans l'amour, Zahra » — la même formule qu'elle utilise à la fin de ses épisodes de podcast."
  ur: "مینی فیسٹنگ مسلمہ برانڈ کے تحت زہرہ پیڈرسن کے سب اسٹیک مضامین؛ ان میں سے 'جب صابر نے اپنا مطلب کھو دیا'، قرآن میں تین قسم کے صبر ⁦(صبر)⁩ پر، اپنے روایتی 'لیو ان لو، زہرا' کے ساتھ دستخط کیے - وہی سائن آف جو وہ اپنے پوڈ کاسٹ ایپی سوڈز کے آخر میں استعمال کرتی ہیں۔"
  tr: "Zahra Pedersen'in \"Manifesting Muslims\" başlığı altında Sebastak üzerine yazdığı metinler; bunlar arasında Kur'an'daki sabırın üç anlamını gözden geçiren ve podcast bölümlerini tamamlamak için kullandığı \"Aşkta Yaşa, Zahra\" imzasıyla bitirdiği \"Sabır Anlamını Kaybettiğinde\" adlı makalesi de var."
  id: "Teks Zahra Pedersen tentang Sebastak dengan label \"Manifesting Muslims\"; termasuk artikelnya \"When Patience Lost Its Meaning,\" yang mengulas tiga makna kesabaran dalam Al-Quran dan mengakhiri dengan tanda tangan khasnya \"Hidup dalam cinta, Zahra\" — tanda tangan yang sama yang dia gunakan untuk menutup episode podcastnya."
