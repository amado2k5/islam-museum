summary:
  ar: "مقالة ويكيبيديا العربية عن مهدي طارمي؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 18 يوليو 1992 في بوشهر بإيران ومسيرته مع برسيبوليس وبورتو والمنتخب الإيراني، ويذكر صندوق معلوماتها ديانته بأنها «مسلم شيعي» دون استشهاد."
  en: "Arabic Wikipedia article on Mehdi Taremi; used for entity facts only. It confirms his birth on 18 July 1992 in Bushehr, Iran, and his career with Persepolis, Porto and the Iran national team; its infobox gives his religion, uncited, as 'Muslim Shia'."
  es: "Artículo de Wikipedia en árabe sobre Mehdi Taremi; utilizado únicamente para datos sobre la persona. Confirma su nacimiento el 18 de julio de 1992 en Bushehr, Irán, y su trayectoria en el Persepolis, el Porto y la selección nacional de Irán; su ficha informativa indica, sin citar fuentes, que su religión es «musulmán chiíta»."
  fr: "Article Wikipédia en arabe sur Mehdi Taremi; utilisé uniquement pour les informations le concernant. Il confirme sa naissance le 18 juillet 1992 à Bushehr, en Iran, et sa carrière au Persépolis, au FC Porto et en équipe nationale iranienne; son infobox indique sa religion, sans source, comme étant « musulman chiite »."
  ur: "مہدی ترینی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 18 جولائی 1992 کو بوشہر، ایران میں اس کی پیدائش کی تصدیق کرتا ہے، اور پرسیپولیس، پورٹو اور ایران کی قومی ٹیم کے ساتھ اس کا کیریئر۔ اس کا انفو باکس اس کا مذہب، بغیر کسی حوالہ کے، بطور 'مسلم شیعہ' دیتا ہے۔"
