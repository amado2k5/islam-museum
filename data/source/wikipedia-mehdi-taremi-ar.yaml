reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Taremi as born on 18 July 1992 in Bushehr. Its infobox gives his religion, uncited, as 'Muslim Shia' ⁦(مسلم شيعي)⁩, a value drawn from Wikidata — one source family, as the person record's faith note states; the article's text makes no religion statement. The article is stale: its statistics run to 2021 and its infobox still lists Inter Milan as his club, so the English article is followed for his later career."
