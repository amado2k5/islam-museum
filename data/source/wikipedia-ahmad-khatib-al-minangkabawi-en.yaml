  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد الخطيب المنكباوي؛ تُستخدم لوقائع الكيان فقط. تقدّمه عالمًا سنيًا أرثوذكسيًا رأس إمامة الشافعية في الحرم المكي، وتسرد كتبه في الفقه الشافعي ونقده للطريقة النقشبندية، وتجعل وفاته بمكة في 9 تشرين الأول 1915."
  en: "English Wikipedia article on Ahmad Khatib al-Minangkabawi; used for entity facts only. It presents him as an orthodox Sunni scholar who headed the Shafi'i school's imamate at the Meccan sanctuary, lists his Shafi'i fiqh works and his critique of the Naqshbandi order, and puts his death at Mecca on 9 October 1915."
