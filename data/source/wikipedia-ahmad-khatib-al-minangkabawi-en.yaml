reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by revision id through the MediaWiki API with the returned id asserted equal. Its text, resting on Von der Mehden (1993) and Mudhafier (2013), calls him an orthodox Sunni Muslim and head (imam) of the Shafi'i school at the Meccan mosque, and his infobox gives religion Sunni Islam and creed Shafi'i — the text and the infobox are one source family. Its death date of 9 October 1915 is contested: the Indonesian article's body gives 13 March 1916, Wikidata carries 1916, and this article's own category files him under 1916 deaths."
