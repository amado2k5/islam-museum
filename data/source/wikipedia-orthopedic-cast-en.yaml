summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الجبيرة العظمية؛ لوقائع الكيان فقط: جبس باريس كبريتات كالسيوم مسحوقة من الجص المكلس تعود متصلبة عند إضافة الماء، أطباء العرب استعملوا الجير من صدف البحر والألبومين من بياض البيض لتصليب الضمادات، دبلوماسي بريطاني ⁦(ويليام إيتون)⁩ وصف نحو 1800 طريقة تركية بتشكيل الجبس حول الطرف المكسور، ماتيسن 1852 لصاقة الجبس على الضماد، وبيروغوف في القرم."
  en: "English Wikipedia article on the orthopedic cast; entity facts only: plaster of Paris as calcined gypsum ground to powder that re-hardens when wetted, Arab physicians' use of lime from sea shells and albumen from egg whites to stiffen bandages, William Eton's c.1800 account of gypsum plaster moulded around limbs in Turkey, Mathijsen's 1852 plaster-impregnated bandage and Pirogov's Crimean War use."
  es: "Artículo de la Wikipedia en inglés sobre el yeso ortopédico; solo datos sobre la entidad: yeso de París como yeso calcinado molido hasta convertirlo en polvo que se endurece al humedecerse, uso por parte de médicos árabes de cal de conchas marinas y albúmina de claras de huevo para endurecer vendajes, relato de William Eton hacia 1800 sobre el yeso moldeado alrededor de las extremidades en Turquía, vendaje impregnado de yeso de Mathijsen de 1852 y el uso de Pirogov en la Guerra de Crimea."
  fr: "Article de Wikipédia en anglais sur le plâtre orthopédique; informations uniquement sur l’entité: le plâtre de Paris est du gypse calciné réduit en poudre qui durcit à nouveau lorsqu’il est humidifié; utilisation par les médecins arabes de chaux provenant de coquillages et d’albumine provenant de blancs d’œufs pour rigidifier les bandages; récit de William Eton vers 1800 sur le plâtre de gypse moulé autour des membres en Turquie; bandage imprégné de plâtre de Mathijsen en 1852 et utilisation par Pirogov pendant la guerre de Crimée."
  ur: "آرتھوپیڈک کاسٹ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: پلاسٹر آف پیرس بطور کیلکائنڈ جپسم گراؤنڈ ٹو پاؤڈر جو گیلے ہونے پر دوبارہ سخت ہو جاتا ہے، عرب معالجین کا سمندری چھلکے سے چونے کا استعمال اور انڈے کی سفیدی سے البومین کو سخت پٹیاں بنانے کے لیے، ولیم ایٹن کا جپسم پلاسٹر کا c.1800 اکاؤنٹ اعضاء کے گرد ڈھالا گیا، ترکی میں پلاسٹر 1800 میں پلاسٹر۔ اور پیروگوف کا کریمین جنگ کا استعمال۔"
