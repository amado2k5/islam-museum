summary:
  ar: "مقالة ويكيبيديا الفرنسية عن الأمين دياك؛ تُستخدم لوقائع الكيان فقط. تفصّل مسيرته رياضيا ومدربا ورئيس بلدية داكار (1978–1980) ونائبا (1978–1993) ورئيسا للاتحاد الدولي لألعاب القوى ومحاكمته وعودته إلى السنغال في مايو 2021 ووفاته في بيته بداكار في 3 ديسمبر 2021. لا تذكر دينه."
  en: "French Wikipedia article on Lamine Diack; used for entity facts only. It details his career as athlete and coach, president of the Senegalese Olympic committee, secretary of state, mayor of Dakar (1978–1980) and parliamentarian (1978–1993), his IAAF presidency, his trial, his return to Senegal in May 2021 and his death at home in Dakar on 3 December 2021. It says nothing about his religion."
  es: "Artículo de la Wikipedia en francés sobre Lamine Diack; utilizado únicamente para obtener información sobre la persona. Detalla su trayectoria como atleta y entrenador, presidente del Comité Olímpico Senegalés, secretario de Estado, alcalde de Dakar (1978-1980) y parlamentario (1978-1993), su presidencia de la IAAF, su juicio, su regreso a Senegal en mayo de 2021 y su fallecimiento en su domicilio en Dakar el 3 de diciembre de 2021. No menciona nada sobre su religión."
  fr: "Article de Wikipédia en français sur Lamine Diack; utilisé uniquement pour les informations relatives à l’entité. Il détaille sa carrière d’athlète et d’entraîneur, sa présidence du Comité olympique sénégalais, son poste de secrétaire d’État, de maire de Dakar (1978-1980) et de parlementaire (1978-1993), sa présidence de l’IAAF, son procès, son retour au Sénégal en mai 2021 et son décès à son domicile de Dakar le 3 décembre 2021. Il ne mentionne rien de sa religion."
