  ar: "مقالة ويكيبيديا الفرنسية عن الأمين دياك؛ تُستخدم لوقائع الكيان فقط. تفصّل مسيرته رياضيا ومدربا ورئيس بلدية داكار (1978–1980) ونائبا (1978–1993) ورئيسا للاتحاد الدولي لألعاب القوى ومحاكمته وعودته إلى السنغال في مايو 2021 ووفاته في بيته بداكار في 3 ديسمبر 2021. لا تذكر دينه."
  en: "French Wikipedia article on Lamine Diack; used for entity facts only. It details his career as athlete and coach, president of the Senegalese Olympic committee, secretary of state, mayor of Dakar (1978–1980) and parliamentarian (1978–1993), his IAAF presidency, his trial, his return to Senegal in May 2021 and his death at home in Dakar on 3 December 2021. It says nothing about his religion."
