  ar: "عنصر ويكيداتا Q3595825 لشوكت علي: يذكر ولادته في 10 مارس 1873 ووفاته في 26 نوفمبر 1938، وقيمة دينه «الإسلام» فقط دون مذهب، وإن وصفه الإنجليزي يخطئ فيذكر وفاته سنة 1939."
