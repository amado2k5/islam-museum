  ur: "شوکت علی کے لیے وکی ڈیٹا آئٹم Q3595825: یہ 10 مارچ 1873 کو ان کی پیدائش اور 26 نومبر 1938 کو ان کی موت، اور صرف اسلام کی ایک مذہبی قدر ہے، جس میں کوئی اسکول نہیں ہے۔ اس کی انگریزی تفصیل اس کے باوجود اس کی وفات کا سال 1939 بتاتی ہے۔"
