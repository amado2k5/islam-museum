label: { ar: "أحسن التقاسيم في معرفة الأقاليم للمقدسي، طبعة دي خويه ⁦(ليدن، بريل، 1877)⁩، المكتبة الجغرافية العربية 3", en: "al-Muqaddasi, Ahsan al-taqasim fi ma'rifat al-aqalim, ed. M. J. de Goeje (Leiden: Brill, 1877), Bibliotheca Geographorum Arabicorum III" }
summary:
  ar: "الطبعة الأولى النقدية لكتاب المقدسي، المجلد الثالث من «المكتبة الجغرافية العربية» التي نشرها دي خويه، طُبعت في مدينة ليدن بمطبعة بريل سنة 1877م، بحواشٍ تثبت فروق مخطوطتي برلين (B) والقسطنطينية (C)."
  en: "The first critical edition of al-Muqaddasi's book, volume III of de Goeje's Bibliotheca Geographorum Arabicorum, printed in Leiden by Brill in 1877, with an apparatus giving the variants of the Berlin (B) and Constantinople (C) manuscripts."
  es: "La primera edición crítica del libro de al-Muqaddasi, volumen III de la Bibliotheca Geographorum Arabicorum de de Goeje, impresa en Leiden por Brill en 1877, con un aparato crítico que muestra las variantes de los manuscritos de Berlín (B) y Constantinopla (C)."
  fr: "La première édition critique du livre d'al-Muqaddasi, volume III de la Bibliotheca Geographorum Arabicorum de de Goeje, imprimée à Leiden par Brill en 1877, avec un appareil critique donnant les variantes des manuscrits de Berlin (B) et de Constantinople (C)."
  ur: "المقدسی کی کتاب کا پہلا تنقیدی ایڈیشن، ڈی گوجی کی ببلیوتھیکا جیوگرافورم عربیکورم کی جلد III، برل کے ذریعہ 1877 میں لیڈن میں چھپی، جس میں برلن (B) اور قسطنطنیہ (C) کے مخطوطات کی مختلف شکلیں دی گئی ہیں۔"
  tr: "Al-Maqdisi'nin kitabının ilk eleştirel baskısı, de Joye tarafından yayımlanan \"Arap Coğrafya Kütüphanesi\"nin üçüncü cildi, 1877'de Leiden'de Brill Press'te basıldı; Berlin (B) ve Konstantinopolis (C) el yazmaları arasındaki farkları kanıtlayan açıklamalarla birlikte."
  id: "Edisi kritis pertama dari buku Al-Maqdisi, volume tiga dari \"Perpustakaan Geografi Arab\" yang diterbitkan oleh de Joye, dicetak di Leiden di Brill Press pada tahun 1877, dengan anotasi yang membuktikan perbedaan antara manuskrip Berlin (B) dan Konstantinopel (C)."
