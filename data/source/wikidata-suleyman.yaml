  es: "El elemento de Wikidata Q16847797 para Mustafa Suleyman, basado en los atributos de página del artículo en inglés, se utiliza únicamente para datos de la entidad. Indica que nació en agosto de 1984 en Londres y presenta un valor religioso de ateísmo en rango obsoleto, que se conserva en la nota sobre la fe del registro y no se utiliza como referencia."
  fr: "L'élément Wikidata Q16847797 concernant Mustafa Suleyman, référencé via les propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance en août 1984 à Londres et mentionne l'athéisme comme religion, information désormais obsolète, conservée dans la note relative à la foi et non prise en compte."
  ur: "Wikidata آئٹم Q16847797 مصطفیٰ سلیمان کے لیے، انگریزی مضمون کے صفحہ پروپس کے ذریعے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے اگست 1984 کو لندن میں اس کی پیدائش کی، اور فرسودہ درجے پر الحاد کی مذہبی قدر کی حامل ہے، جو کہ ریکارڈ کے ایمانی نوٹ میں محفوظ ہے اور اس پر انحصار نہیں کیا گیا ہے۔"
  tr: "Wikidata öğesi Mustafa Suleiman tarafından Q16847797, İngilizce makale sayfası properties üzerinden düzeltilmiştir; yalnızca varlık gerçekleri için kullanılır. Ağustos 1984'te Londra'da doğdu ve kabul edilmeyen değersiz bir statüye sahip ateizm dininin değerini taşımaktadır."
  id: "Elemen Wikidata Q16847797 oleh Mustafa Suleiman, diperbaiki melalui properti halaman artikel berbahasa Inggris; digunakan hanya untuk fakta entitas. Ia lahir pada Agustus 1984 di London dan membawa nilai agama ateisme dengan status yang sudah usang dan tidak diterima."
