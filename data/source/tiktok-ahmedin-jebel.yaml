reliability_note: "His own account: a primary source for his identity, his self-presentation and his short-form dawah output, not independent corroboration of biography. The profile was read directly on TikTok on 7 November 2026 (page crawled 8 November 2026 UTC) and showed 263,700 followers, 21 following, 1,400,000 total likes and 148 videos, with no verification badge; the figures are dated platform figures, not museum measurements. The display name is 'Ahmedin Jebel - አሕመዲን ጀበል' and the Amharic bio — ይህ አካውንት የአሕመዲን ጀበል ይፋዊ የTikTok አካውንት ነው — states that this is the official TikTok account of Ahmedin Jebel. An older search-index crawl of the same profile (188 days before the read) showed 242,400 followers, 20 following and 1.3 million likes; the difference is growth over time, and the fresh direct read is the figure carried. The profile gives no birth date and no school of law. Read on 7 November 2026."
