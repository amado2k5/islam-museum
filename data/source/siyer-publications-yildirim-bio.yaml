reliability_note: "Publisher's author biography, a primary source for the foundation association stated in the Siyer TV group record's prose: it states that Muhammed Emin Yıldırım was born in Horasan, Erzurum in 1973, that in October 2010 he pioneered the establishment of the Siyer Foundation, whose studies had begun in the historic Zekayi Dede Mansion in Eyüp, Istanbul, that he gives weekly public lectures there on the sirah and the Companions, and that those lessons are published on www.siyertv.com. It is the foundation's own publisher speaking about its founder figure, so it is used for that association in prose only and no founded_by edge is written from it. Read on 16 November 2026."
