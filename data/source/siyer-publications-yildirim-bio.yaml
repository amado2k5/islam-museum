summary:
  ar: "سيرة المؤلف محمد أمين يلدرم المطبوعة في كتاب من منشورات السيرة؛ تقول إنه بادر في أكتوبر 2010 إلى تأسيس وقف السيرة في أيوب بإسطنبول، وأن دروسه الأسبوعية تُنشر على موقع سيير تي في."
  en: "The author biography of Muhammed Emin Yıldırım printed in a Siyer Publications book: in October 2010 he pioneered the establishment of the Siyer Foundation in Eyüp, Istanbul, and his weekly lectures are published on the Siyer TV website."
  ur: "سیر مطبوعات کی ایک کتاب میں چھپی محمد امین یلدرم کی مصنف سوانح؛ اکتوبر 2010ء میں اس نے ایوب، استنبول میں سیر فاؤنڈیشن کے قیام کی پیش قدمی کی، اور اس کے ہفتہ وار دروس سیر ٹی وی کی ویب سائٹ پر شائع ہوتے ہیں۔"
  es: "La biografía del autor Muhammed Emin Yıldırım está impresa en un libro de Siyer Publications: en octubre de 2010 fue pionero en la creación de la Fundación Siyer en Eyüp, Estambul, y sus conferencias semanales se publican en el sitio web de Siyer TV."
