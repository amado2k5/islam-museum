summary:
  ar: "مقالة ويكيبيديا الصينية عن ما هونغكوي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 9 آذار 1892 ووفاته في لوس أنجلوس في 14 كانون الثاني 1970 ودفنه في مقبرة تايبيه الإسلامية، وتصفه بأنه مسلم كان يرفض تسمية «قومية الهوي»."
  en: "Chinese Wikipedia article on Ma Hongkui; used for entity facts only. It gives his birth on 9 March 1892, his death at Los Angeles on 14 January 1970 and his burial in Taipei's Muslim cemetery, and describes a Muslim who rejected the label of a separate 'Hui nationality'."
  es: "Artículo de la Wikipedia en chino sobre Ma Hongkui; utilizado únicamente para obtener información sobre la persona. Indica su nacimiento el 9 de marzo de 1892, su fallecimiento en Los Ángeles el 14 de enero de 1970 y su entierro en el cementerio musulmán de Taipéi, y describe a un musulmán que rechazó la etiqueta de \"nacionalidad Hui\" separada."
  fr: "Article de Wikipédia en chinois sur Ma Hongkui; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 9 mars 1892, son décès à Los Angeles le 14 janvier 1970 et son inhumation au cimetière musulman de Taipei, et décrit un musulman qui rejetait l’étiquette de « nationalité Hui » distincte."
  ur: "Ma Hongkui پر چینی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 9 مارچ 1892 کو ان کی پیدائش، 14 جنوری 1970 کو لاس اینجلس میں ان کی موت اور تائی پے کے مسلم قبرستان میں ان کی تدفین کی گئی ہے، اور ایک ایسے مسلمان کی وضاحت کی گئی ہے جس نے علیحدہ 'ہوئی قومیت' کے لیبل کو مسترد کر دیا تھا۔"
  tr: "Ma Hongkui hakkında Çin Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 9 Mart 1892'de doğduğunu, 14 Ocak 1970'te Los Angeles'ta öldüğünü ve Taipei İslami Mezarlığı'nda defnedilmesini vererek, kendisini \"milliyetçi kimlik\" olarak adlandırmayı reddeden bir Müslüman olarak tanımlar."
  id: "Artikel Wikipedia Bahasa Mandarin tentang Ma Hongkui; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada 9 Maret 1892, kematiannya di Los Angeles pada 14 Januari 1970, dan pemakamannya di Pemakaman Islam Taipei, menggambarkannya sebagai Muslim yang menolak menyebutnya sebagai \"identitas nasionalis.\""
