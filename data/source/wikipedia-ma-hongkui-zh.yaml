reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision; its narrative rests chiefly on the official Biographies of Senior Generals of the Republic (vol. 3, 1998) and on Ma Hongkui's own memoirs. It gives his courtesy name as Shaoyun and his milk name as Sanyuan, his birth on 9 March 1892 — one day-reading against 14 March in the English article and Wikidata — and his death at Los Angeles on 14 January 1970, after which his remains were flown to Taiwan and buried in the Muslim cemetery at Sanzhangli, Taipei. Its lead describes him as a Muslim who professed Islam while holding that the Hui are part of the Chinese nation, quoting his own rebuttal recorded by Gu Jiegang; it lists his directorship of the China Islamic Association and chairmanship of its Ningxia branch among his posts, and names no school and no Sufi order for him."
