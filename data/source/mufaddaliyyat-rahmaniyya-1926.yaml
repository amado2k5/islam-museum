summary:
  ar: "طبعة المطبعة الرحمانية ⁦(القاهرة 1926م)⁩ من المفضليات، مجموعة القصائد التي اختارها المفضل الضبي، ممسوحة في أرشيف الإنترنت ⁦(المعرّف AAlexandrina-162009)⁩ وتُقرأ محلياً بالقراءة الآلية والمعاينة المباشرة للصفحة."
  en: "The 1926 Rahmaniyya Press (Cairo) edition of the Mufaddaliyyat, the anthology of poems chosen by al-Mufaddal al-Dabbi, scanned on the Internet Archive (identifier AAlexandrina-162009) and read locally by OCR and direct viewing of the page."
  es: "La edición de 1926 de Rahmaniyya Press (El Cairo) de Mufaddaliyyat, la antología de poemas seleccionados por al-Mufaddal al-Dabbi, escaneada en Internet Archive (identificador AAlexandrina-162009) y leída localmente mediante OCR y visualización directa de la página."
  fr: "L'édition de 1926 de la Mufaddaliyyat, anthologie de poèmes choisis par al-Mufaddal al-Dabbi, publiée par Rahmaniyya Press (Le Caire), numérisée sur Internet Archive (identifiant AAlexandrina-162009) et lue localement par OCR et visualisation directe de la page."
  ur: "مفدلیت کا 1926 رحمانیہ پریس ⁦(قاہرہ)⁩ ایڈیشن، المفضل الدبی کے ذریعہ منتخب کردہ نظموں کا مجموعہ، انٹرنیٹ آرکائیو ⁦(شناخت کنندہ AAlexandrina-162009)⁩ پر اسکین کیا گیا اور OCR کے ذریعے مقامی طور پر پڑھا گیا اور صفحہ کو براہ راست دیکھا گیا۔"
  tr: "Al-Mufaddal Al-Dabi'nin seçtiği şiir koleksiyonu olan Al-Mufaddal Al-Rahmaniyya'nın (Kahire, 1926) baskısı, Internet Archive'da taranmış (ID AAlexandrina-162009) ve yerel olarak makine okuma ile doğrudan sayfa görüntüleme ile okunmaktadır."
  id: "Edisi Al-Matba Al-Rahmaniyya (Kairo 1926) dari Al-Mufaddaliyat, kumpulan puisi yang dipilih oleh Al-Mufaddal Al-Dhabi, dipindai di Internet Archive (ID AAlexandrina-162009) dan dibaca secara lokal dengan pembacaan mesin dan tampilan halaman langsung."
