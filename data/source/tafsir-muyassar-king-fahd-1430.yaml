  en: "al-Tafsir al-Muyassar — prepared by a group of scholars (King Fahd Complex for the Printing of the Holy Qur'an, Medina, 2nd ed., revised and enlarged, 2009)"
  ur: "التفسیر المیسر — اعداد علما کی ایک جماعت ⁦(مجمع الملک فہد لطباعۃ المصحف الشریف، مدینہ منورہ، دوسرا نظرثانی شدہ ایڈیشن، 2009ء)⁩"
summary:
  ar: "الطبعة الثانية المزيدة والمنقحة ⁦(1430هـ/2009م)⁩ من التفسير الميسر، في 624 صفحة بالحجم الجامعي، صادرة عن الأمانة العامة للشؤون العلمية بمجمع الملك فهد لطباعة المصحف الشريف التابع لوزارة الشؤون الإسلامية والأوقاف والدعوة والإرشاد، بمقدمة الوزير المشرف العام على المجمع صالح بن عبد العزيز بن محمد آل الشيخ."
  en: "The second, revised and enlarged edition (1430 AH / 2009) of al-Tafsir al-Muyassar, 624 pages in university format, issued by the General Secretariat for Scholarly Affairs of the King Fahd Complex for the Printing of the Holy Qur'an under the Ministry of Islamic Affairs, Endowments, Da'wa and Guidance, with an introduction by the minister and supervisor general of the Complex, Salih ibn Abd al-Aziz ibn Muhammad Al al-Shaykh."
  ur: "التفسیر المیسر کا دوسرا نظرثانی شدہ اور اضافہ شدہ ایڈیشن ⁦(1430ھ / 2009ء)⁩، یونیورسٹی سائز میں 624 صفحات، جو وزارتِ اسلامی امور، اوقاف، دعوت و ارشاد کے تحت مجمع الملک فہد لطباعۃ المصحف الشریف کی امانتِ عامہ برائے علمی امور نے شائع کیا، وزیر اور مجمع کے نگرانِ اعلیٰ صالح بن عبد العزیز بن محمد آل الشیخ کے مقدمے کے ساتھ۔"
