  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0625\u0646\u062c\u0644\u064a\u0632\u064a\u0629 \u0639\u0646 \u0627\u0644\u0645\u0646\u0634\u062f \u0627\u0644\u062d\u0644\u0628\u064a \u0635\u0628\u0631\u064a \u0645\u062f\u0644\u0644\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u0627\u0644\u062c\u0644\u0648\u0645 \u0628\u062d\u0644\u0628 \u0641\u064a 1918\u060c \u0648\u062a\u0639\u0644\u0651\u0645\u0647 \u0639\u0644\u0649 \u0639\u0645\u0631 \u0627\u0644\u0628\u0637\u0634\u060c \u0648\u0623\u0630\u0627\u0646\u0647 \u0641\u064a \u0627\u0644\u062c\u0627\u0645\u0639 \u0627\u0644\u0623\u0645\u0648\u064a \u0628\u062d\u0644\u0628\u060c \u0648\u0623\u0648\u0644 \u063a\u0646\u0627\u0626\u0647 \u0641\u064a \u0627\u0644\u0625\u0630\u0627\u0639\u0629 \u0627\u0644\u0633\u0648\u0631\u064a\u0629 \u0641\u064a 1949\u060c \u0648\u0641\u0631\u0642\u062a\u0647 \u0645\u0639 \u062d\u0633\u0646 \u0627\u0644\u062d\u0641\u0627\u0631 \u0645\u0646\u0630 1954\u060c \u0648\u062d\u0641\u0644 \u0628\u0627\u0631\u064a\u0633 1975 \u0648\u0623\u0633\u0637\u0648\u0627\u0646\u062a\u0647 \u0627\u0644\u0623\u0648\u0644\u0649 1980\u060c \u0648\u0627\u0644\u0641\u064a\u0644\u0645 \u0627\u0644\u0648\u062b\u0627\u0626\u0642\u064a 1997\u060c \u0648\u0648\u0641\u0627\u062a\u0647 \u0641\u064a \u0623\u063a\u0633\u0637\u0633 2006\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0627\u0644\u0628\u064a\u0627\u0646 \u0648\u0642\u0646\u0637\u0631\u0629 \u0648\u062f\u0631\u0627\u0633\u0629 \u0645\u062d\u0645\u062f \u0642\u062f\u0631\u064a \u062f\u0644\u0627\u0644 (2006)."
  en: "English Wikipedia article on the Aleppine singer Sabri Moudallal; entity facts only: birth in al-Jalloum, Aleppo, in 1918, training under Omar al-Batsh, work as muezzin of the Great Mosque of Aleppo, first broadcast on Syrian radio in 1949, his ensemble with Hassan Haffar from 1954, the 1975 Paris concert and first album of 1980, the 1997 documentary, and death in August 2006; it cites al-Bayan, Qantara and Muhammad Qadri Dallal's 2006 study."
