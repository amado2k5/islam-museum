summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن المنشد الحلبي صبري مدلل؛ لوقائع الكيان فقط: مولده في الجلوم بحلب في 1918، وتعلّمه على عمر البطش، وأذانه في الجامع الأموي بحلب، وأول غنائه في الإذاعة السورية في 1949، وفرقته مع حسن الحفار منذ 1954، وحفل باريس 1975 وأسطوانته الأولى 1980، والفيلم الوثائقي 1997، ووفاته في أغسطس 2006؛ وتستند إلى البيان وقنطرة ودراسة محمد قدري دلال (2006)."
  en: "English Wikipedia article on the Aleppine singer Sabri Moudallal; entity facts only: birth in al-Jalloum, Aleppo, in 1918, training under Omar al-Batsh, work as muezzin of the Great Mosque of Aleppo, first broadcast on Syrian radio in 1949, his ensemble with Hassan Haffar from 1954, the 1975 Paris concert and first album of 1980, the 1997 documentary, and death in August 2006; it cites al-Bayan, Qantara and Muhammad Qadri Dallal's 2006 study."
  es: "Artículo de la Wikipedia en inglés sobre el cantante alepino Sabri Moudallal; solo datos sobre la persona: nacimiento en al-Jalloum, Alepo, en 1918, formación con Omar al-Batsh, trabajo como muecín de la Gran Mezquita de Alepo, primera emisión en la radio siria en 1949, su conjunto con Hassan Haffar desde 1954, el concierto de París de 1975 y su primer álbum de 1980, el documental de 1997 y su muerte en agosto de 2006; cita el estudio de 2006 de al-Bayan, Qantara y Muhammad Qadri Dallal."
  fr: "Article de Wikipédia en anglais sur le chanteur aleppinais Sabri Moudallal; faits biographiques uniquement: naissance à al-Jalloum, Alep, en 1918, formation auprès d’Omar al-Batsh, travail comme muezzin de la Grande Mosquée d’Alep, première diffusion à la radio syrienne en 1949, son ensemble avec Hassan Haffar à partir de 1954, le concert parisien de 1975 et le premier album de 1980, le documentaire de 1997 et décès en août 2006; il cite al-Bayan, Qantara et l’étude de Muhammad Qadri Dallal de 2006."
