  ar: "مقالة ويكيبيديا العربية عن إدي مصطفى محمد؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 30 أبريل 1952 في بروكلين وبطولته لرابطة الملاكمة العالمية، وتصفه في متنها بأنه ملاكم أمريكي مسلم معتزل، دون أن تسمي مذهباً له."
  en: "Arabic Wikipedia article on Eddie Mustafa Muhammad; a short article used for entity facts only. It gives his birth on 30 April 1952 in Brooklyn and his WBA title, and describes him in its text as a retired American Muslim boxer, without naming any school for him."
  es: "Artículo en árabe de la Wikipedia sobre Eddie Mustafa Muhammad; un breve artículo que solo incluye datos sobre él. Menciona su fecha de nacimiento, el 30 de abril de 1952 en Brooklyn, su título de la AMB y lo describe como un boxeador estadounidense musulmán retirado, sin mencionar ninguna escuela a la que haya asistido."
  fr: "Article Wikipédia en arabe sur Eddie Mustafa Muhammad; un court article fournissant uniquement des informations factuelles. Il indique sa date de naissance, le 30 avril 1952 à Brooklyn, son titre WBA et le décrit comme un boxeur américain musulman retraité, sans mentionner d'école de boxe."
  ur: "ایڈی مصطفی محمد پر عربی ویکیپیڈیا مضمون؛ ایک مختصر مضمون جو صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ یہ 30 اپریل 1952 کو بروکلین میں اس کی پیدائش اور اس کا WBA ٹائٹل ہے، اور اس کے متن میں اسے ایک ریٹائرڈ امریکی مسلمان باکسر کے طور پر بیان کرتا ہے، بغیر اس کے کسی اسکول کا نام لیے۔"
