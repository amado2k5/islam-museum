reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth in Savur, Mardin Province, on 8 September 1946 as the seventh of eight children, his parents' lack of schooling and emphasis on education, his MD from Istanbul University (1969, top of his class), his work as a doctor in Savur and the interrupted Johns Hopkins period (TÜBİTAK scholarship; returned to Savur in 1973), his PhD at the University of Texas at Dallas (1977) under Claud Stan Rupert on the photolyase enzyme, five years at Yale working on nucleotide excision repair, his move to the University of North Carolina at Chapel Hill, his election to the National Academy of Sciences (2005) as its first Turkish member, the 2015 Nobel Prize in Chemistry, his marriage to Gwen Boles Sancar (1978), the Aziz & Gwen Sancar Foundation and the Carolina Turkish House, the debate over his ethnic origins and his own statements about them, his youthful involvement with the Grey Wolves as the article reports it alongside his own description of himself as an idealist who did not participate in activities, and his self-description as a practising Muslim who is proud to be Muslim. The article dates his Savur medical practice at 1.5 years, where his Nobel autobiographical account and other profiles give about two years; both are recorded in the prose. Read in full on 24 October 2026."
