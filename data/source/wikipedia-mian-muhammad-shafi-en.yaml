summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميان محمد شافي ⁦(10 آذار 1869 – 7 كانون الثاني 1932)⁩؛ تُستخدم لوقائع الكيان فقط. تروي مولده في باغبانبورا بلاهور وتعليمه في لاهور ولندن ومحاماته، ودوره المؤسس في رابطة مسلمي عموم الهند (1906) وفرعها البنجابي، وعضويته في مجلس الوالي التنفيذي (1919–1924)، ووفاته في لاهور ودفنه في مقبرة أسلافه في باغبانبورا."
  en: "English Wikipedia article on Mian Muhammad Shafi (10 March 1869 – 7 January 1932); used for entity facts only. It recounts his birth at Baghbanpura, Lahore, his education at Lahore and London and his legal career, his founding part in the All-India Muslim League (1906) and its Punjab branch, his membership of the Viceroy's Executive Council (1919–1924), and his death at Lahore and burial in the family graveyard at Baghbanpura. It names no religion or school for him in text or infobox."
  es: "Artículo de la Wikipedia en inglés sobre Mian Muhammad Shafi (10 de marzo de 1869 - 7 de enero de 1932); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Baghbanpura, Lahore, su educación en Lahore y Londres y su carrera jurídica, su participación fundadora en la Liga Musulmana de la India (1906) y su rama en Punjab, su pertenencia al Consejo Ejecutivo del Virrey (1919-1924) y su fallecimiento en Lahore y su entierro en el cementerio familiar de Baghbanpura. No menciona su religión ni su escuela en el texto ni en el recuadro informativo."
  fr: "L'article de Wikipédia en anglais consacré à Mian Muhammad Shafi (10 mars 1869 – 7 janvier 1932) est utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Baghbanpura, Lahore, ses études à Lahore et à Londres, sa carrière juridique, son rôle fondateur dans la Ligue musulmane panindienne (1906) et sa branche du Pendjab, son appartenance au Conseil exécutif du vice-roi (1919-1924), ainsi que sa mort à Lahore et son inhumation dans le cimetière familial de Baghbanpura. Aucune mention de sa religion ou de son école n'est faite dans le texte ou l'infobox."
  ur: "میاں محمد شفیع پر انگریزی ویکیپیڈیا مضمون ⁦(10 مارچ 1869 - 7 جنوری 1932)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں باغبانپورہ، لاہور میں ان کی پیدائش، لاہور اور لندن میں ان کی تعلیم اور ان کے قانونی کیریئر، آل انڈیا مسلم لیگ (1906) اور اس کی پنجاب شاخ میں ان کا بانی حصہ، وائسرائے کی ایگزیکٹو کونسل کی رکنیت (1919-1924) اور لاہور میں ان کی وفات اور باغبانپورہ کے خاندانی قبرستان میں تدفین کا ذکر ہے۔ متن یا معلوماتی خانے میں اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
  tr: "Mian Muhammad Shafi hakkında İngilizce Wikipedia makalesi (10 Mart 1869 – 7 Ocak 1932); yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu Lahore, Bagbanpura'da, Lahor ve Londra'daki eğitimini, avukatlık rolünü, All India Muslim League (1906) ve Pencap şubesindeki kurucu rolünü, Yürütme Vali Konseyi üyeliğini (1919–1924), Lahor'daki ölümünü ve atalarının Bagbanpura'daki mezarlığında defnedilmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Mian Muhammad Shafi (10 Maret 1869 – 7 Januari 1932); digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Bagbanpura, Lahore, pendidikannya di Lahore dan London, peran pengacaranya, peran pendiriannya di All India Muslim League (1906) dan cabang Punjabi-nya, keanggotaannya di Dewan Wali Eksekutif (1919–1924), kematiannya di Lahore, dan pemakamannya di pemakaman leluhurnya di Bagbanpura."
