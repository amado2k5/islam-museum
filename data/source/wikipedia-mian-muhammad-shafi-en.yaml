summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميان محمد شافي (10 آذار 1869 – 7 كانون الثاني 1932)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في باغبانبورا بلاهور وتعليمه في لاهور ولندن ومحاماته، ودوره المؤسس في رابطة مسلمي عموم الهند (1906) وفرعها البنجابي، وعضويته في مجلس الوالي التنفيذي (1919–1924)، ووفاته في لاهور ودفنه في مقبرة أسلافه في باغبانبورا."
  en: "English Wikipedia article on Mian Muhammad Shafi (10 March 1869 – 7 January 1932); used for entity facts only. It recounts his birth at Baghbanpura, Lahore, his education at Lahore and London and his legal career, his founding part in the All-India Muslim League (1906) and its Punjab branch, his membership of the Viceroy's Executive Council (1919–1924), and his death at Lahore and burial in the family graveyard at Baghbanpura. It names no religion or school for him in text or infobox."
