summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مير عماد الحسني؛ تعطي ولادته 1554 في قزوين ووفاته 15 أغسطس 1615 في أصفهان، وتدريبه على عيسى رنكار وملك الديلمي ومحمد حسين التبريزي، ومنافسته علي رضا عباسي، واتهامه بأنه سنّي واغتياله بأمر ضمني من الشاه عباس."
  en: "English Wikipedia article on Mir Emad Hassani; it gives his birth in 1554 in Qazvin and death on 15 August 1615 in Isfahan, his training under Isa Rangkar, Malek Deylami and Mohammad Hossein Tabrizi, his rivalry with Ali Reza Abbasi, and his accusation of being Sunni and assassination with Shah Abbas's implicit approval."
  es: "Artículo de la Wikipedia en inglés sobre Mir Emad Hassani; en él se menciona su nacimiento en 1554 en Qazvin y su muerte el 15 de agosto de 1615 en Isfahán, su formación con Isa Rangkar, Malek Deylami y Mohammad Hossein Tabrizi, su rivalidad con Ali Reza Abbasi y su acusación de ser sunita y su asesinato con la aprobación implícita del Shah Abbas."
  fr: "L'article de Wikipédia en anglais sur Mir Emad Hassani indique sa naissance en 1554 à Qazvin et sa mort le 15 août 1615 à Ispahan, sa formation auprès d'Isa Rangkar, Malek Deylami et Mohammad Hossein Tabrizi, sa rivalité avec Ali Reza Abbasi, ainsi que son accusation d'être sunnite et son assassinat avec l'approbation implicite du Shah Abbas."
  ur: "میر عماد حسنی پر انگریزی ویکیپیڈیا مضمون؛ یہ 1554 میں قزوین میں اس کی پیدائش اور 15 اگست 1615 کو اصفہان میں موت، عیسیٰ رنگکر، ملک دیلمی اور محمد حسین تبریزی کے زیر تربیت، علی رضا عباسی کے ساتھ اس کی دشمنی، اور اس پر سنی ہونے کا الزام اور شاہ عباس کی واضح منظوری سے قتل۔"
