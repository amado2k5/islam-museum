  ar: "مقالة ويكيبيديا الإنجليزية عن مير عماد الحسني؛ تعطي ولادته 1554 في قزوين ووفاته 15 أغسطس 1615 في أصفهان، وتدريبه على عيسى رنكار وملك الديلمي ومحمد حسين التبريزي، ومنافسته علي رضا عباسي، واتهامه بأنه سنّي واغتياله بأمر ضمني من الشاه عباس."
  en: "English Wikipedia article on Mir Emad Hassani; it gives his birth in 1554 in Qazvin and death on 15 August 1615 in Isfahan, his training under Isa Rangkar, Malek Deylami and Mohammad Hossein Tabrizi, his rivalry with Ali Reza Abbasi, and his accusation of being Sunni and assassination with Shah Abbas's implicit approval."
