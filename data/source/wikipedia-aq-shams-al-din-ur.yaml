  ar: "مقالة ويكيبيديا الأردية عن آق شمس الدين، مراجعة 14 آذار 2026؛ تعتمد كثيراً على «دائرة المعارف الإسلامية» الأردية (المجلد 1، ص 87) والشقائق النعمانية، وتؤرخ بيعته لحاجي بيرام ولي بسنة 830هـ/1427م وإلباسه خرقة الخلافة بعدها بأيام، وتذكر نشأته وتعليمه وطبّه ووفاته."
  en: "Urdu Wikipedia article on Aq Shams al-Din, revision of 14 March 2026; it rests largely on the Urdu Encyclopaedia of Islam (vol. 1, p. 87) and Taskopruluzade's Shaqaiq al-Numaniyya, dates his bay'a to Haci Bayram Veli to 830/1427 with the conferral of the khirqa of khilafa days later, and covers his upbringing, education, medicine and death."
