summary:
  ar: 'مقالة ويكيبيديا الأردية عن حسنين محمد مخلوف؛ تُستخدم لوقائع الكيان فقط. نسخة أقصر من المقالة العربية: المولد والوفاة نفسيهما، وشيوخه في الأزهر ومنهم والده ومحمد بخيت المطيعي ويوسف الدجوي، وحقل الديانة في صندوقها فارغ.'
  en: 'Urdu Wikipedia article on Hassanein Muhammad Makhlouf; used for entity facts only. A shorter version of the Arabic article: the same birth and death dates, his Azhar teachers including his father, Muhammad Bakhit al-Muti''i and Yusuf al-Dijwi; the religion field of its infobox is blank and it names no school for him.'
  es: "Artículo de Wikipedia en urdu sobre Hassanein Muhammad Makhlouf; se utiliza únicamente para datos sobre la persona. Una versión más corta del artículo en árabe: las mismas fechas de nacimiento y muerte, sus maestros de Al-Azhar, incluyendo a su padre, Muhammad Bakhit al-Muti'i y Yusuf al-Dijwi; el campo de religión de su ficha informativa está en blanco y no menciona ninguna escuela para él."
  fr: "Article de Wikipédia en ourdou sur Hassanein Muhammad Makhlouf; utilisé uniquement pour les informations le concernant. Version abrégée de l’article en arabe: mêmes dates de naissance et de décès, ses professeurs d’Al-Azhar, dont son père, Muhammad Bakhit al-Muti’i et Yusuf al-Dijwi; le champ « religion » de son infobox est vide et aucune école n’y est mentionnée."
  ur: "حسنین محمد مخلوف پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ عربی مضمون کا ایک چھوٹا ورژن: وہی تاریخ پیدائش اور موت، اس کے ازہر اساتذہ بشمول ان کے والد، محمد بخیت المطیعی اور یوسف الدجوی؛ اس کے معلوماتی خانے کا مذہب خالی ہے اور اس میں اس کے لیے کسی اسکول کا نام نہیں ہے۔"
