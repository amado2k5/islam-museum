summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سعيدة وارسي، البارونة وارسي: سياسية ومحامية بريطانية وُلدت في ديوزبري سنة 1971 لأبوين مهاجرين باكستانيين. كانت أول مسلمة تخدم في مجلس الوزراء البريطاني، واستقالت من الحكومة سنة 2014 احتجاجًا على سياستها تجاه غزة، وتركت حزب المحافظين سنة 2024."
  en: "English Wikipedia article on Sayeeda Warsi, Baroness Warsi, the British politician and lawyer born in Dewsbury in 1971 to Pakistani immigrant parents. She was the first Muslim to serve in the British Cabinet, resigned from the government in 2014 over its Gaza policy, and left the Conservative Party in 2024."
  es: "Artículo de la Wikipedia en inglés sobre Sayeeda Warsi, baronesa Warsi, política y abogada británica nacida en Dewsbury en 1971 de padres inmigrantes pakistaníes. Fue la primera musulmana en formar parte del Gabinete británico, dimitió del gobierno en 2014 por su política respecto a Gaza y abandonó el Partido Conservador en 2024."
  fr: "Article de Wikipédia en anglais sur Sayeeda Warsi, baronne Warsi, femme politique et avocate britannique née à Dewsbury en 1971 de parents immigrés pakistanais. Elle fut la première musulmane à siéger au sein du gouvernement britannique, démissionna en 2014 en raison de sa politique à l'égard de Gaza et quitta le Parti conservateur en 2024."
  ur: "سعیدہ وارثی، بیرونس وارثی، برطانوی سیاست دان اور وکیل پر انگریزی ویکیپیڈیا کا مضمون 1971 میں ڈیوسبری میں پاکستانی تارکین وطن والدین کے ہاں پیدا ہوا۔ وہ برطانوی کابینہ میں خدمات انجام دینے والی پہلی مسلمان تھیں، انہوں نے 2014 میں اپنی غزہ پالیسی پر حکومت سے استعفیٰ دے دیا، اور 2024 میں کنزرویٹو پارٹی کو چھوڑ دیا۔"
  tr: "Saida Warsi, Barones Warsi hakkında İngilizce Wikipedia makalesi: 1971'de Dewsbury'de Pakistanlı göçmen ebeveynlerin çocuğu olarak doğmuş bir İngiliz politikacı ve avukat. Britanya Kabinesinde görev yapan ilk Müslüman kadın oldu, 2014'te Gazze politikasına karşı protesto olarak hükümetten istifa etti ve 2024'te Muhafazakar Parti'den ayrıldı."
  id: "Artikel Wikipedia bahasa Inggris tentang Saida Warsi, Baroness Warsi: seorang politikus dan pengacara Inggris yang lahir di Dewsbury pada tahun 1971 dari orang tua imigran Pakistan. Dia adalah wanita Muslim pertama yang menjabat di Kabinet Inggris, mengundurkan diri dari pemerintahan pada 2014 sebagai protes terhadap kebijakannya terhadap Gaza, dan meninggalkan Partai Konservatif pada 2024."
