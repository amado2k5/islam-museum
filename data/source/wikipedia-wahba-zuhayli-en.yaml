summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن وهبة الزحيلي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في دير عطية سنة 1932، ودراسته في دمشق والأزهر، ودكتوراه 1963، وأستاذيته في جامعة دمشق منذ 1975، وعضوياته في المجامع الفقهية، ووفاته في أغسطس 2015، ومواقفه العقدية ومؤلفاته؛ وصندوق معلوماتها يعطي طائفته سنية وفقهه شافعيا وعقيدته أشعرية."
  en: "English Wikipedia article on Wahbah al-Zuhayli; used for entity facts only. It gives his birth at Dair Atiah in 1932, his studies at Damascus and al-Azhar, his doctorate of 1963, his professorship at Damascus University from 1975, his fiqh-academy memberships and preaching, his death in August 2015, his doctrinal positions and his works; its infobox gives denomination Sunni, jurisprudence Shafi'i and creed Ash'ari."
