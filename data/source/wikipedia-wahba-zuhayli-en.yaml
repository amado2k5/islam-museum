summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن وهبة الزحيلي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في دير عطية سنة 1932، ودراسته في دمشق والأزهر، ودكتوراه 1963، وأستاذيته في جامعة دمشق منذ 1975، وعضوياته في المجامع الفقهية، ووفاته في أغسطس 2015، ومواقفه العقدية ومؤلفاته؛ وصندوق معلوماتها يعطي طائفته سنية وفقهه شافعيا وعقيدته أشعرية."
  en: "English Wikipedia article on Wahbah al-Zuhayli; used for entity facts only. It gives his birth at Dair Atiah in 1932, his studies at Damascus and al-Azhar, his doctorate of 1963, his professorship at Damascus University from 1975, his fiqh-academy memberships and preaching, his death in August 2015, his doctrinal positions and his works; its infobox gives denomination Sunni, jurisprudence Shafi'i and creed Ash'ari."
  es: "Artículo de la Wikipedia en inglés sobre Wahbah al-Zuhayli; utilizado únicamente para datos biográficos. Menciona su nacimiento en Dair Atiah en 1932, sus estudios en Damasco y Al-Azhar, su doctorado en 1963, su cátedra en la Universidad de Damasco desde 1975, su pertenencia a academias de fiqh y su labor de predicación, su fallecimiento en agosto de 2015, sus posturas doctrinales y sus obras. Su ficha informativa indica su denominación sunita, su jurisprudencia shafi'í y su credo ash'ari."
  fr: "L'article de Wikipédia en anglais consacré à Wahbah al-Zuhayli, utilisé uniquement pour les informations le concernant, mentionne sa naissance à Dair Atiah en 1932, ses études à Damas et à al-Azhar, son doctorat obtenu en 1963, son poste de professeur à l'université de Damas à partir de 1975, son appartenance à des académies de fiqh et ses sermons, son décès en août 2015, ses positions doctrinales et ses œuvres. Son infobox précise son appartenance à l'islam sunnite, à la jurisprudence chaféite et au judaïsme ash'arite."
  ur: "وہبہ الزحیلی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1932 میں دیر عطیہ میں ان کی پیدائش، دمشق اور الازہر میں ان کی تعلیم، 1963 میں ڈاکٹریٹ، 1975 سے دمشق یونیورسٹی میں پروفیسری، ان کی فقہ اکیڈمی کی رکنیت اور تبلیغ، اگست 2015 میں ان کی وفات، ان کے نظریاتی عہدے اور ان کے کام؛ اس کا معلوماتی خانہ فرقہ سنی، فقہ شافعی اور عقیدہ اشعری دیتا ہے۔"
  tr: "Wahba Al-Zuhayli hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1932'de Deyr Etiye'deki doğumundan, 1963'te Şam ve El-Ezher'deki eğitimlerinden, 1963'teki doktora derecesinden, 1975'ten itibaren Şam Üniversitesi'ndeki profesörlüğünden, fıkıh kurullarına üyeliğinden, Ağustos 2015'teki ölümünden, doktrinsel duruşlarından ve kitaplarından bahseder; bilgi kutusunda Sünni mezhebi, Şafii fıkıhi ve Aş'eri inancı yer alır."
  id: "Artikel Wikipedia bahasa Inggris tentang Wahba Al-Zuhayli; digunakan hanya untuk fakta entitas. Artikel ini menyebutkan kelahirannya di Deir Atiyah pada tahun 1932, studinya di Damaskus dan Al-Azhar, PhD pada tahun 1963, jabatan profesornya di Universitas Damaskus sejak 1975, keanggotaannya dalam dewan yurisprudensi, kematiannya pada Agustus 2015, sikap doktrinnya, dan buku-bukunya; kotak infonya menyediakan sekte Sunni, yurisprudensi Shafi'i, dan kredo Ash'ari."
