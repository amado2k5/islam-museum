summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن توك جانغوت (1853–1915)، قائد تمرد كلنتن سنة 1915؛ تُستخدم لوقائع الكيان فقط. تسميه «حاجي حسن بن مونس»، وتذكر مولده سنة 1853 في كامبونغ جيرام بباسير بوتيه، وتعليمه في كلنتن ومكة، وقيادته الانتفاضة ضد الإدارة البريطانية ومقتله؛ وتعطي مقدمتها وفاته في 25 أيار 1915 بينما يصف متنها زحفًا أخيرًا على باسير بوتيه في 25 حزيران 1915 قُتل فيه، وهو تعارض داخلي في المقالة."
  en: "English Wikipedia article on Tok Janggut (1853–1915), the leader of the 1915 Kelantan rebellion; used for entity facts only. It names him Haji Hassan bin Munas, gives his birth in 1853 at Kampung Jeram, Pasir Puteh, his pondok education in Kelantan and Mecca, and his leadership of the rising against the British administration and his death in it. Its lead gives his death as 25 May 1915, while its narrative describes a final march on Pasir Puteh on 25 June 1915 in which he was killed — an internal conflict within the article."
