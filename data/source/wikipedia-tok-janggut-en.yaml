reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026; the article was fetched by its recorded revision id through the MediaWiki API and the returned id asserted equal before use. Its narrative cites Cheah Boon Kheng's 2006 study of the rebellion by page. The article is internally inconsistent on the death date (lead 25 May 1915; narrative 25 June 1915); the fuller Malay article supports 25 May, while Wikidata carries 25 June — the record follows 25 May and records the conflict. Neither its text nor its categories name any school for him."
