reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his full name as Abu al-Muzaffar Muhammad Anusha Khan, his khanate of Khiva as 1663-1686, calls him the son and successor of the khan Abu al-Ghazi who continued his father's policy, records his raids on Bukhara and temporary capture of Samarkand in 1685, his embassies toward Russia, the madrasa, bath and two canals built under him at Khiva, and his death in 1686 — 1687 according to the Kazakhstan National Encyclopedia — after a court conspiracy deposed and blinded him. It names no school or order for the khan himself. Checked 1 November 2026."
