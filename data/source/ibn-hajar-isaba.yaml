label:
  ar: الإصابة في تمييز الصحابة — ابن حجر العسقلاني
  en: al-Isaba fi tamyiz al-sahaba — Ibn Hajar al-Asqalani
summary:
  ar: معجم تراجم الصحابة والصحابيات لابن حجر العسقلاني ⁦(ت 852هـ)⁩، مرتب على الحروف في أقسام الرجال والنساء والكنى؛ يجمع ما في الاستيعاب وأسد الغابة وغيرهما مع إسناد الأخبار ونقد صحبة المختلف فيهم.
  en: Ibn Hajar al-Asqalani's (d. 852 AH) biographical dictionary of the Companions, men and women, arranged alphabetically; it gathers earlier dictionaries with the chains of the reports and a critique of disputed companionship.
  es: "Diccionario biográfico de los Compañeros, hombres y mujeres, de Ibn Hajar al-Asqalani (fallecido en 852 AH), ordenado alfabéticamente; reúne diccionarios anteriores con las cadenas de transmisión de los relatos y una crítica de la controvertida pertenencia a la Compañía."
  fr: "Le dictionnaire biographique des Compagnons, hommes et femmes, classés par ordre alphabétique, d'Ibn Hajar al-Asqalani (mort en 852 AH); il rassemble des dictionnaires antérieurs avec les chaînes de transmission des récits et une critique des compagnonnages contestés."
  ur: "ابن حجر عسقلانی کی ⁦(متوفی 852ھ)⁩ صحابہ کرام، مردوں اور عورتوں کی سوانحی لغت، حروف تہجی کے لحاظ سے ترتیب دی گئی ہے۔ یہ رپورٹوں کی زنجیروں اور متنازعہ صحبت کی تنقید کے ساتھ پہلے کی لغات جمع کرتا ہے۔"
  tr: "İbn Hajar al-Asqalani (ö. 852 H) tarafından yazılan Sahabeler ve Kadın Sahabeler Biyografileri Sözlüğü, erkek, kadın ve kunya bölümlerine alfabetik olarak düzenlenmiştir; El-İsti'ab, Esad-Gabah ve diğerlerinde bulunanları, farklı olanların arkadaşlık eleştirileri ve anlatılar zincirini derler."
  id: "Kamus Biografi Para Sahabat dan Sahabat Wanita oleh Ibn Hajar al-Asqalani (wafat 852 H), disusun secara alfabetis dalam bagian pria, wanita, dan kunya; kamus ini mengumpulkan apa yang ditemukan dalam Al-Isti'ab, Asad al-Ghabah, dan lainnya, beserta rangkaian narasi dan kritik terhadap persahabatan mereka yang berbeda pendapat di dalamnya."
