summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الله ديا خان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في 10 أغسطس 1855 في أونيارة لأسرة موسيقية مسلمة شيعية، وأنه أسّس غرانة جايبور-أتراولي، وخدم بلاط كولهابور، وتوفي في بومباي في 16 مارس 1946."
  en: "English Wikipedia article on Alladiya Khan; used for entity facts only. It gives him born on 10 August 1855 at Uniara to a Shia Muslim family of musicians, founder of the Jaipur-Atrauli gharana, court musician at Kolhapur, and died at Bombay on 16 March 1946."
  es: "Artículo de la Wikipedia en inglés sobre Alladiya Khan; utilizado únicamente para datos sobre la persona. Indica que nació el 10 de agosto de 1855 en Uniara en el seno de una familia musulmana chiíta de músicos, fue fundador de la gharana Jaipur-Atrauli, músico de la corte en Kolhapur y falleció en Bombay el 16 de marzo de 1946."
  fr: "Article Wikipédia en anglais sur Alladiya Khan; utilisé uniquement pour les informations biographiques. Il indique qu'il est né le 10 août 1855 à Uniara dans une famille de musiciens musulmans chiites, fondateur du gharana Jaipur-Atrauli, musicien de cour à Kolhapur, et décédé à Bombay le 16 mars 1946."
  ur: "علادیہ خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس سے وہ 10 اگست 1855 کو یونیارا میں موسیقاروں کے ایک شیعہ مسلم خاندان میں پیدا ہوئے، جے پور-اتراولی گھرانے کے بانی، کولہاپور میں درباری موسیقار، اور 16 مارچ 1946 کو بمبئی میں انتقال کر گئے۔"
  tr: "Allah Dia Khan hakkında İngilizce Wikipedia makalesi; yalnızca varlık gerçekleri için kullanılır. 10 Ağustos 1855'te Uniyara'da Şii Müslüman bir müzik ailesinde doğduğu, Jaipur-Atrauli Granada'yı kurduğu, Kolhapur sarayına hizmet ettiği ve 16 Mart 1946'da Bombay'da öldüğü belirtilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Allah Dia Khan; digunakan hanya untuk fakta entitas. Dicatat bahwa ia lahir pada 10 Agustus 1855 di Uniyara dari keluarga musik Muslim Syiah, mendirikan Jaipur-Atrauli Granada, melayani istana Kolhapur, dan meninggal di Bombay pada 16 Maret 1946."
