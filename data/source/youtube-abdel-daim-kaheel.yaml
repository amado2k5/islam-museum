summary:
  ar: "قناة عبد الدائم الكحيل الرسمية على يوتيوب (@kaheel777)، وهي قناة مشروع موسوعة الإعجاز العلمي كما يسميها موقعه الرسمي. تعرّف بنفسها قناة علمية تعرض حقائق العلم الحديث على ضوء القرآن والسنة، وتنشر مقاطع الإعجاز العلمي والعددي."
  en: "Abdel Daim Kaheel's official YouTube channel (@kaheel777), the channel of his Encyclopedia of Scientific Miracles project as named by his official site. It describes itself as a science channel presenting modern scientific facts in the light of the Qur'an and Sunnah, and publishes his scientific and numerical miracle videos."
  es: "El canal oficial de YouTube de Abdel Daim Kaheel (@kaheel777), perteneciente a su proyecto Enciclopedia de Milagros Científicos, como se indica en su sitio web oficial, se describe a sí mismo como un canal de ciencia que presenta hechos científicos modernos a la luz del Corán y la Sunnah, y publica sus videos sobre milagros científicos y numéricos."
  fr: "La chaîne YouTube officielle d'Abdel Daim Kaheel (@kaheel777), dédiée à son projet d'Encyclopédie des miracles scientifiques (tel que présenté sur son site officiel), se décrit comme une chaîne scientifique exposant des faits scientifiques modernes à la lumière du Coran et de la Sunna. Elle y publie des vidéos sur des miracles scientifiques et numériques."
  ur: "عبدل دائم کاہیل کا آفیشل یوٹیوب چینل (@kaheel777)، اس کے انسائیکلوپیڈیا آف سائنٹفک معجزات پروجیکٹ کا چینل جس کا نام اس کی آفیشل سائٹ نے رکھا ہے۔ یہ خود کو ایک سائنس چینل بتاتا ہے جو جدید سائنسی حقائق کو قرآن و سنت کی روشنی میں پیش کرتا ہے اور اس کی سائنسی اور عددی معجزاتی ویڈیوز شائع کرتا ہے۔"
