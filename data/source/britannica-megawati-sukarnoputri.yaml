reliability_note: "Reference entry read in full on 25 October 2026. Used for entity facts: her leadership of the PDI-P, its 1999 legislative victory (34 per cent in Britannica's figure, against the English article's 33), her vice-presidency under Abdurrahman Wahid and her presidency from July 2001 to October 2004. Its one conflict with the rest of the record is the birthplace: it says she was born in Jakarta, where the English and Arabic articles, the Urdu article and Wikidata all give Yogyakarta; the record follows Yogyakarta and records Britannica's variant. It names no religion or school for her."
