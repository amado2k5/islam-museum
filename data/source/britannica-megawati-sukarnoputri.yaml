summary:
  ar: "مدخل موسوعة بريتانيكا عن ميجاواتي سوكارنوبوتري؛ يؤكد رئاستها لإندونيسيا 2001–2004 ومسيرتها الحزبية، لكنه يذكر ميلادها في جاكرتا خلافًا للمقالات الثلاث وويكيداتا التي تذكر يوغياكارتا."
  en: "Encyclopaedia Britannica entry on Megawati Sukarnoputri; it confirms her presidency of Indonesia in 2001–2004 and her party career, but gives her birthplace as Jakarta, against the three Wikipedia articles and Wikidata, which give Yogyakarta."
  es: "La entrada de la Enciclopedia Británica sobre Megawati Sukarnoputri confirma su presidencia de Indonesia entre 2001 y 2004 y su trayectoria política, pero indica que su lugar de nacimiento es Yakarta, en contra de los tres artículos de Wikipedia y Wikidata, que señalan Yogyakarta."
  fr: "L'article de l'Encyclopædia Britannica sur Megawati Sukarnoputri confirme sa présidence de l'Indonésie de 2001 à 2004 et sa carrière politique, mais indique Jakarta comme lieu de naissance, contrairement aux trois articles de Wikipédia et à Wikidata qui mentionnent Yogyakarta."
  ur: "میگاوتی سوکرنپوتری پر انسائیکلوپیڈیا برٹانیکا کا اندراج؛ یہ 2001-2004 میں انڈونیشیا کی ان کی صدارت اور اس کے پارٹی کیریئر کی تصدیق کرتا ہے، لیکن اس کی جائے پیدائش جکارتہ کے طور پر، تین ویکیپیڈیا مضامین اور وکی ڈیٹا کے خلاف، جو یوگیاکارتا کو دیتا ہے۔"
  tr: "Britannica'nın Megawati Sukarnoputri hakkındaki maddesi, 2001–2004 yılları arasında Endonezya başkanlığını ve parti kariyerini doğrular, ancak Yogyakarta'dan bahseden üç makale ve Wikidata'nın aksine, Jakarta'daki doğumundan bahseder."
  id: "Entri Britannica tentang Megawati Sukarnoputri mengonfirmasi masa jabatannya sebagai presiden Indonesia dari 2001–2004 dan karier partainya, tetapi menyebutkan kelahirannya di Jakarta, berbeda dengan tiga artikel dan Wikidata yang menyebutkan Yogyakarta."
