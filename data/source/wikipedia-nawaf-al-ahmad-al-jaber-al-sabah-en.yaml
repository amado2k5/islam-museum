summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نواف الأحمد الجابر الصباح؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في مدينة الكويت في 25 يونيو 1937، وكان محافظًا لحولي 1962–1978 ووزيرًا للداخلية 1978–1988 ثم 2003–2006 ووزيرًا للدفاع 1988–1991 ووليًا للعهد من 2006، ثم أمير الكويت من 29 سبتمبر 2020 حتى وفاته في 16 ديسمبر 2023، ودُفن في مقبرة صليبيخات في اليوم التالي. ويقرأ حقل الدين في صندوق معلوماتها «إسلام سني»، وهي قيمة بنيوية."
  en: "English Wikipedia article on Nawaf Al-Ahmad Al-Jaber Al-Sabah; used for entity facts only. It gives him as born at Kuwait City on 25 June 1937, governor of Hawalli 1962–1978, minister of interior 1978–1988 and again 2003–2006, minister of defence 1988–1991, crown prince from 2006, then Emir of Kuwait from 29 September 2020 until his death on 16 December 2023, buried at Sulaibikhat Cemetery the next day. Its infobox religion field reads 'Sunni Islam' — a structured value, not a statement in its text."
