  ar: "مقالة ويكيبيديا العربية عن عبد الله بن بيه (ولد 1935 في تمبدغة بموريتانيا)، وزير التعليم والعدل الموريتاني الأسبق؛ يعطي صندوق معلوماتها العقيدة أهل السنة والجماعة والمذهب المالكي، وتصنفه تصنيفاتها في المالكية والأشاعرة والصوفية."
