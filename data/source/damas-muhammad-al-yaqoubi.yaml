summary:
  ar: "صفحة جمعية دمشق الثقافية الجامعة لتراجم محمد اليعقوبي: ملف «المسلمون الخمسمائة» الذي يصفه بأنه شيخ مرشد في الطريقة الشاذلية، وسيرة «المعرفة المقدسة»، وسيرة منشورات التذكير التي تذكر ولادته في 13 ذي الحجة 1382هـ (1963م) وتتلمذه الطويل على والده إبراهيم اليعقوبي."
  en: "The Damas Cultural Society page compiling biographies of Muhammad al-Yaqoubi: The Muslim 500's profile, which calls him a spiritual master in the Shadhili order; the Sacred Knowledge biography; and the Remembrance Publications biography, which gives his birth as 13 Dhu al-Hijjah 1382 AH (1963 CE) and describes his long training under his father Ibrahim al-Yaqoubi."
