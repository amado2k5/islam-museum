reliability_note: "A compilation page, read in full on 26 October 2026. The Muslim 500 profile it reproduces (an external, independently edited annual) calls him 'a spiritual master in the Shadhili order' and records his training by his father, his Friday speakership at eighteen, his Refuting ISIS and his 2011 flight from Syria to Morocco. The Remembrance Publications biography gives his birth as 'the 13th of Dhul Hijja, 1382 AH (1963 CE)'; the page's own header prints '(7 May 1962)', which conflicts with the Hijri year 1382 printed alongside it and is treated in the person record as a misprint. The Sacred Knowledge biography reproduced on the page is his own initiative's text and is not used for the faith attestation."
