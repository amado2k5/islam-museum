summary:
  ar: "صفحة جمعية دمشق الثقافية الجامعة لتراجم محمد اليعقوبي: ملف «المسلمون الخمسمائة» الذي يصفه بأنه شيخ مرشد في الطريقة الشاذلية، وسيرة «المعرفة المقدسة»، وسيرة منشورات التذكير التي تذكر ولادته في 13 ذي الحجة 1382هـ ⁦(1963م)⁩ وتتلمذه الطويل على والده إبراهيم اليعقوبي."
  en: "The Damas Cultural Society page compiling biographies of Muhammad al-Yaqoubi: The Muslim 500's profile, which calls him a spiritual master in the Shadhili order; the Sacred Knowledge biography; and the Remembrance Publications biography, which gives his birth as 13 Dhu al-Hijjah 1382 AH (1963 CE) and describes his long training under his father Ibrahim al-Yaqoubi."
  es: "La página de la Sociedad Cultural Damas que recopila biografías de Muhammad al-Yaqoubi: el perfil de Muslim 500, que lo llama maestro espiritual en la orden Shadhili; la biografía de Sacred Knowledge; y la biografía de Remembrance Publications, que indica que nació el 13 de Dhu al-Hijjah de 1382 AH (1963 d. C.) y describe su larga formación bajo la tutela de su padre Ibrahim al-Yaqoubi."
  fr: "La page de la Société culturelle de Damas compilant les biographies de Muhammad al-Yaqoubi: le profil de Muslim 500, qui le qualifie de maître spirituel de l’ordre Shadhili; la biographie de Sacred Knowledge; et la biographie de Remembrance Publications, qui indique sa naissance le 13 Dhu al-Hijjah 1382 AH (1963 CE) et décrit sa longue formation auprès de son père Ibrahim al-Yaqoubi."
  ur: "داماس کلچرل سوسائٹی کا صفحہ محمد ال یعقوبی کی سوانح حیات مرتب کرتا ہے: مسلم 500 کا پروفائل، جو اسے شادھیلی ترتیب میں ایک روحانی استاد کہتا ہے۔ مقدس علم کی سوانح حیات؛ اور Remembrance Publications کی سوانح عمری، جو ان کی پیدائش 13 ذی الحجہ 1382 ہجری ⁦(1963 عیسوی)⁩ بتاتی ہے اور اپنے والد ابراہیم ال یعقوبی کے زیر سایہ ان کی طویل تربیت کو بیان کرتی ہے۔"
  tr: "Şam Kültür Derneği'nin Muhammed el-Ya'qubi Biyografileri sayfası: 'Beş Yüz Müslüman' dosyası, onu Şadhili tarikatında şeyh ve rehber olarak tanımlar, 'Kutsal Bilgi' biyografisi ve 13 Zulhice 1382 Hicce (1963 M) tarihindeki doğumunu ve babası İbrahim el-Ya'qubi'nin uzun vesayetini anlatan El-Tadkir yayınlarının biyografisi."
  id: "Halaman Asosiasi Kebudayaan Damaskus untuk Biografi Muhammad Al-Ya'qubi: Berkas 'Lima Ratus Muslim,' yang menggambarkannya sebagai seorang sheikh dan pembimbing dalam tarekat Shadhili, biografi 'Pengetahuan Suci,' dan biografi publikasi Al-Tadkir yang menyebutkan kelahirannya pada 13 Dhu al-Hijjah 1382 H (1963 M) dan bimbingan panjangnya di bawah ayahnya, Ibrahim al-Ya'qubi."
