  ar: "مقالة ويكيبيديا العربية «بيجوم حضرة محل»؛ تُستخدم لوقائع الكيان فقط. تروي حياتها زوجة ثانية لوواجد علي شاه ووصية على أوده في 1857–1858، وقيادتها للتمرد ضد شركة الهند الشرقية، ولجوءها إلى نيبال ووفاتها ودفنها عند الجامع الكبير في كاتماندو، ويعطي صندوق معلوماتها ديانتها «مسلمة شيعية»."
  en: "Arabic Wikipedia article 'Begum Hazrat Mahal'; used for entity facts only. It recounts her life as second wife of Wajid Ali Shah and regent of Awadh in 1857–1858, her leadership of the rebellion against the East India Company, her asylum in Nepal and her death and burial by the Jama Masjid in Kathmandu; its infobox gives her religion as 'Muslim, Shia'."
