reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. The article substantially follows the English article (same structure and the same cited authorities — Edwardes, Hibbert, David, Dalrymple, Maps of India), so the two are one source family. Its infobox gives her religion as 'Muslim, Shia' without a reference; its text names no religion for her. It gives her birth in 1820 at Faizabad and her death in 1879 at Kathmandu, buried in an unmarked grave in the grounds of the Jama Masjid there."
