summary:
  ar: "مقالة ويكيبيديا العربية «بيجوم حضرة محل»؛ تُستخدم لوقائع الكيان فقط. تروي حياتها زوجة ثانية لوواجد علي شاه ووصية على أوده في 1857–1858، وقيادتها للتمرد ضد شركة الهند الشرقية، ولجوءها إلى نيبال ووفاتها ودفنها عند الجامع الكبير في كاتماندو، ويعطي صندوق معلوماتها ديانتها «مسلمة شيعية»."
  en: "Arabic Wikipedia article 'Begum Hazrat Mahal'; used for entity facts only. It recounts her life as second wife of Wajid Ali Shah and regent of Awadh in 1857–1858, her leadership of the rebellion against the East India Company, her asylum in Nepal and her death and burial by the Jama Masjid in Kathmandu; its infobox gives her religion as 'Muslim, Shia'."
  es: "Artículo en árabe de la Wikipedia «Begum Hazrat Mahal»; utilizado únicamente para datos sobre la persona. Relata su vida como segunda esposa de Wajid Ali Shah y regente de Awadh entre 1857 y 1858, su liderazgo en la rebelión contra la Compañía Británica de las Indias Orientales, su asilo en Nepal y su muerte y entierro junto a la mezquita Jama Masjid en Katmandú; su ficha informativa indica que su religión era «musulmana chiíta»."
  fr: "L'article Wikipédia en arabe intitulé « Begum Hazrat Mahal » est utilisé uniquement à des fins d'information sur l'entité. Il relate sa vie en tant que seconde épouse de Wajid Ali Shah et régente d'Awadh en 1857-1858, son rôle à la tête de la rébellion contre la Compagnie des Indes orientales, son refuge au Népal, ainsi que sa mort et son inhumation près de la Jama Masjid à Katmandou. Son infobox indique qu'elle était de confession musulmane chiite."
  ur: "عربی ویکیپیڈیا مضمون 'بیگم حضرت محل'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں واجد علی شاہ کی دوسری بیوی اور 1857-1858 میں اودھ کے ریجنٹ کے طور پر ان کی زندگی، ایسٹ انڈیا کمپنی کے خلاف بغاوت کی اس کی قیادت، نیپال میں اس کی پناہ اور کھٹمنڈو کی جامع مسجد میں اس کی موت اور تدفین؛ اس کا انفو باکس اس کا مذہب بطور 'مسلم، شیعہ' دیتا ہے۔"
