  ur: "کمیونٹی کی طرف سے ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظر ثانی پر بازیافت کیا گیا؛ یہ اکتوبر 1945 میں گوالیار میں ان کی پیدائش پر متفق ہے اور اپنے والد کا نام موسیقار حافظ علی خان رکھتا ہے۔ ان کے لیے کوئی اردو مضمون موجود نہیں ہے ⁦(اردو کا عنوان کسی دوسرے آدمی کے لیے ہے)⁩۔"
