reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision, resting on al-Mukhtar al-Soussi's al-Ma'sul, al-Talib Akhyar ibn Shaykh Mamin's history of Ma al-'Aynayn, and the family's own site. It gives his birth natively in Hijri — Sunday 14 Rabi' al-Awwal 1298 AH / 13 February 1881, in the Tirs of Wadi al-Dhahab — and his death on 19 Rabi' al-Thani 1361 AH / 4 May 1942 at Tafoudart; it names him the twelfth son of Ma al-'Aynayn, records his fighting beside his father and his brother Ahmed al-Hiba, his bay'a as leader at the Kerdous conference of 25 Ramadan 1337, his two zawiyas (1913 and 1937) and his many works on tasawwuf, fiqh and other sciences. Its category filings place him among Malikis, Moroccan Sufis and Moroccan Sunni scholars — the readings the record's faith note preserves; no second family names a school or an order for him."
