summary:
  ar: "مقالة ويكيبيديا العربية عن زين العابدين شاه مير؛ تُستخدم لوقائع الكيان فقط. تجعله ثامن سلاطين كشمير من أسرة شاه مير، حكم في 1418–1419 و1420–1470، ابنًا لإسكندر شاه، وتذكر صراعه مع أخيه علي شاه وعودته من سيالكوت، وحملاته على لداخ وبلتستان وأوهند، وسياساته الدينية: إلغاء الجزية عن الهندوس وحظر ذبح الأبقار والسماح ببناء المعابد. صندوق معلوماتها يذكر الإسلام فقط دون مذهب، والميلاد في القرن الخامس عشر دون سنة، والوفاة سنة 1470."
  en: "Arabic Wikipedia article on Zayn al-Abidin Shah Mir; used for entity facts only. It makes him the eighth sultan of Kashmir of the Shah Mir dynasty, reigning 1418–1419 and 1420–1470, a son of Sikandar Shah, and records his struggle with his brother Ali Shah and return from Sialkot, his campaigns in Ladakh, Baltistan and Ohind, and his religious policies: abolition of the jizya on Hindus, a ban on cow slaughter, and permission to build temples. Its infobox gives Islam only, with no school; the birth only as the fifteenth century, the death as 1470."
  es: "Artículo de Wikipedia en árabe sobre Zayn al-Abidin Shah Mir; utilizado únicamente para datos sobre la persona. Lo describe como el octavo sultán de Cachemira de la dinastía Shah Mir, que reinó entre 1418 y 1419 y entre 1420 y 1470, hijo de Sikandar Shah, y registra su lucha con su hermano Ali Shah y su regreso de Sialkot, sus campañas en Ladakh, Baltistán y Ohind, y sus políticas religiosas: la abolición de la jizya para los hindúes, la prohibición del sacrificio de vacas y el permiso para construir templos. Su ficha informativa solo menciona el islam, sin ninguna escuela; su nacimiento se sitúa en el siglo XV y su muerte en 1470."
  fr: "L'article de Wikipédia en arabe consacré à Zayn al-Abidin Shah Mir, utilisé uniquement pour les informations le concernant, le présente comme le huitième sultan du Cachemire de la dynastie Shah Mir, ayant régné de 1418 à 1419 et de 1420 à 1470. Fils de Sikandar Shah, il relate sa lutte contre son frère Ali Shah et son retour de Sialkot, ses campagnes au Ladakh, au Baltistan et à Ohind, ainsi que sa politique religieuse: l'abolition de la jizya sur les hindous, l'interdiction de l'abattage des vaches et l'autorisation de construire des temples. L'infobox mentionne uniquement l'islam, sans préciser d'école; sa naissance est située au XVe siècle et sa mort en 1470."
  ur: "زین العابدین شاہ میر پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے شاہ میر خاندان کے کشمیر کا آٹھواں سلطان بناتا ہے، سکندر شاہ کا بیٹا 1418-1419 اور 1420-1470 حکومت کرتا تھا، اور اپنے بھائی علی شاہ کے ساتھ اس کی جدوجہد اور سیالکوٹ سے واپسی، لداخ، بلتستان اور اوہند میں اس کی مہمات، اور اس کی مذہبی پالیسیوں: ہندوؤں پر پابندی، اتحاد کے خاتمے پر ذبح، اور مندر بنانے کی اجازت۔ اس کا انفو باکس صرف اسلام دیتا ہے، کوئی اسکول نہیں؛ پیدائش صرف پندرہویں صدی میں، موت 1470 میں۔"
