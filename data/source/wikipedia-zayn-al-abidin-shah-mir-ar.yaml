summary:
  ar: "مقالة ويكيبيديا العربية عن زين العابدين شاه مير؛ تُستخدم لوقائع الكيان فقط. تجعله ثامن سلاطين كشمير من أسرة شاه مير، حكم في 1418–1419 و1420–1470، ابنًا لإسكندر شاه، وتذكر صراعه مع أخيه علي شاه وعودته من سيالكوت، وحملاته على لداخ وبلتستان وأوهند، وسياساته الدينية: إلغاء الجزية عن الهندوس وحظر ذبح الأبقار والسماح ببناء المعابد. صندوق معلوماتها يذكر الإسلام فقط دون مذهب، والميلاد في القرن الخامس عشر دون سنة، والوفاة سنة 1470."
  en: "Arabic Wikipedia article on Zayn al-Abidin Shah Mir; used for entity facts only. It makes him the eighth sultan of Kashmir of the Shah Mir dynasty, reigning 1418–1419 and 1420–1470, a son of Sikandar Shah, and records his struggle with his brother Ali Shah and return from Sialkot, his campaigns in Ladakh, Baltistan and Ohind, and his religious policies: abolition of the jizya on Hindus, a ban on cow slaughter, and permission to build temples. Its infobox gives Islam only, with no school; the birth only as the fifteenth century, the death as 1470."
