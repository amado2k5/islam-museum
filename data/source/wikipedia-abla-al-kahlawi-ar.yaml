reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026), read through the MediaWiki API at revision 76168910 on 1 November 2026. Gives: full name Abla Muhammad Mursi Abd al-Latif al-Kahlawi, born 15 December 1948 in the Zamalek quarter of Cairo, eldest daughter of the religious singer Muhammad al-Kahlawi; married young to the engineer and army officer Muhammad Yasin Basyuni, who was killed in the October War, and mother of three daughters; Al-Azhar degree in 1969, master's in comparative fiqh in 1974 (thesis on shura as the rule of Islamic government) and doctorate in 1978; professor of comparative fiqh at the Faculty of Islamic and Arabic Studies for Women at Al-Azhar and dean of that faculty; posts at the College of Education for Girls in Riyadh; head of the Sharia department at the College of Education in Mecca in 1979; daily lessons for women at the Ka'ba after the sunset prayer from 1987 to 1989; lessons at her father's mosque in al-Basatin, at Al-Azhar Mosque and at Bayt al-Hamd in al-Muqattam; presented the programme 'Fi Hubb al-Mustafa' broadcast in Ramadan 1428 AH on the al-Risala channel, and other programmes on Iqra' and al-Nas; founded the al-Baqiyat al-Salihat charity in al-Muqattam (orphans, cancer and Alzheimer's patients, the elderly); chosen ideal mother of Egypt in 2020; died on 24 January 2021, aged 72, of Covid-19. Books listed include 'Ahibbuhu kama ahabbakum' (2011), 'Qalbi ma'ak' (2011), 'Qadaya al-mar'a fi al-hajj wa-l-'umra' (2005), 'al-Bunuwwa wa-l-ubuwwa' (2005), 'Musafir bila tariq' (2003) and 'al-Khul' dawa' ma la dawa' lahu' (2000). The infobox gives her religion only as Islam and names no school. Recorded in docs/authenticity-ledger/pages/wikipedia-abla-al-kahlawi-ar.yaml."
