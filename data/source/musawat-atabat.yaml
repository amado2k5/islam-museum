summary:
  ar: "موسوعة العتبات المقدسة لجعفر الخليلي ⁦(ت 1985م)⁩؛ قسم سامراء يروي تاريخ تشييد ضريح العسكريين وقبة الغيبة وأخبار المدينة، مستنداً إلى تاريخ شيخ السرا؛ نسخة ممسوحة أجريت عليها قراءة آلية في مكتبة الحصاد."
  en: "Mawsu'at al-Atabat al-Muqaddasa by Ja'far al-Khalili (d. 1985); the Samarra section narrates the construction history of the Askari shrine and the Ghayba dome, drawing on Tarikh Shaykh al-Sarra; a scanned copy OCR'd in the local harvest."
  es: "Mawsu'at al-Atabat al-Muqaddasa de Ja'far al-Khalili (fallecido en 1985); la sección de Samarra narra la historia de la construcción del santuario Askari y la cúpula de Ghayba, basándose en Tarikh Shaykh al-Sarra; una copia escaneada procesada mediante OCR en la colección local."
  fr: "Mawsu'at al-Atabat al-Muqaddasa par Ja'far al-Khalili (d. 1985); la section Samarra relate l'histoire de la construction du sanctuaire Askari et du dôme Ghayba, en s'appuyant sur Tarikh Shaykh al-Sarra; une copie scannée OCR dans la récolte locale."
  ur: "موصوف الاطباط المقدسہ از جعفر الخلیلی ⁦(متوفی 1985)⁩؛ سامرا سیکشن عسکری مزار اور غیبہ کے گنبد کی تعمیر کی تاریخ بیان کرتا ہے، تاریخ شیخ السررہ کی تصویر کشی کرتا ہے۔ مقامی فصل میں ایک اسکین شدہ کاپی OCR'd۔"
