summary:
  ar: "طبعة سنة 1916م من ديوان الحماسة، المختارات التي جمعها أبو تمام حبيب بن أوس، بشرح هامشي، ممسوحة في أرشيف الإنترنت ⁦(المعرّف AAlexandrina-206563)⁩ وتُقرأ محلياً بالقراءة الآلية والمعاينة المباشرة للصفحة."
  en: "An edition of 1916 of the Diwan al-Hamasa, the anthology compiled by Abu Tammam Habib ibn Aws, with marginal commentary, scanned on the Internet Archive (identifier AAlexandrina-206563) and read locally by OCR and direct viewing of the page."
  es: "Edición de 1916 del Diwan al-Hamasa, la antología compilada por Abu Tammam Habib ibn Aws, con comentarios marginales, escaneada en Internet Archive (identificador AAlexandrina-206563) y leída localmente mediante OCR y visualización directa de la página."
  fr: "Une édition de 1916 du Diwan al-Hamasa, l'anthologie compilée par Abu Tammam Habib ibn Aws, avec des commentaires marginaux, numérisée sur Internet Archive (identifiant AAlexandrina-206563) et lue localement par OCR et visualisation directe de la page."
  ur: "دیوان الحمسہ کا 1916 کا ایک ایڈیشن، ابو تمام حبیب ابن اوس کی مرتب کردہ انتھولوجی، معمولی تفسیر کے ساتھ، انٹرنیٹ آرکائیو ⁦(شناخت کنندہ AAlexandrina-206563)⁩ پر اسکین کیا گیا اور OCR کے ذریعے مقامی طور پر پڑھا گیا اور صفحہ کو براہ راست دیکھا گیا۔"
  tr: "1916 tarihli Diwan al-Hamesa baskısı, Abu Tammam Habib ibn Aws tarafından derlenmiş seçkiler, kenar yorumlarıyla birlikte Internet Archive'da taranmış (ID AAlexandrina-206563) ve yerel olarak makine okuma ve doğrudan sayfa görüntüleme ile okunabilmektedir."
  id: "Edisi 1916 dari Diwan al-Hamasa, pilihan yang dikumpulkan oleh Abu Tammam Habib ibn Aws, dengan komentar di pinggir, dipindai di Internet Archive (ID AAlexandrina-206563), dan dapat dibaca secara lokal melalui pembacaan mesin dan tampilan halaman langsung."
