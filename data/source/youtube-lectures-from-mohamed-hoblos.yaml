summary:
  ar: "قناة «محاضرات من محمد حبلص» على يوتيوب؛ تحمل أوصاف مقاطعها سيرته القياسية ⁦(من لبنان، يقيم في سيدني، محاضرات في بلدان كثيرة، فيديوهات لشبكة ون باث، وفريق سيدني دين الإذاعي، والفيلم القصير «الفرصة الأخيرة»)⁩ وتنبّه إلى أنه ليس شيخًا، وتدرج حساباته الرسمية على المنصات."
  en: "The 'Lectures From Mohamed Hoblos' YouTube channel; its video descriptions carry his standard biography (from Lebanon, living in Sydney, lectures in many countries, videos for One Path Network, the Sydney Deen Team radio programme and the short film 'Last Chance'), note that he is not a shaykh, and list his official platform accounts."
  es: "El canal de YouTube 'Lectures From Mohamed Hoblos' incluye en sus descripciones de vídeo su biografía habitual (originario del Líbano, residente en Sídney, imparte conferencias en muchos países, ha realizado vídeos para One Path Network, el programa de radio Sydney Deen Team y el cortometraje 'Last Chance'), aclara que no es un jeque y enumera sus cuentas oficiales en plataformas digitales."
  fr: "La chaîne YouTube « Lectures From Mohamed Hoblos »; ses descriptions de vidéos reprennent sa biographie habituelle (originaire du Liban, vivant à Sydney, conférencier dans de nombreux pays, vidéos pour One Path Network, l'émission de radio Sydney Deen Team et le court métrage « Last Chance »), précisent qu'il n'est pas un cheikh et listent ses comptes officiels sur les plateformes."
  ur: "'محمد ہوبلوس کے لیکچرز' یوٹیوب چینل؛ اس کی ویڈیو کی تفصیل ان کی معیاری سوانح عمری ⁦(لبنان سے، سڈنی میں رہائش پذیر، کئی ممالک میں لیکچرز، ون پاتھ نیٹ ورک، سڈنی دین ٹیم ریڈیو پروگرام اور مختصر فلم 'لاسٹ چانس' کے لیے ویڈیوز)⁩، نوٹ کریں کہ وہ شیخ نہیں ہیں، اور ان کے آفیشل پلیٹ فارم اکاؤنٹس کی فہرست بنائیں۔"
  tr: "\"Mohamed Hablas'tan Dersler\" adlı YouTube kanalı, onun sicilini (Lübnan'dan, Sydney'de ikamet etmesi, birçok ülkede konferanslar vermesi, One Path ağı için videolar, Sydney Dean radyo ekibi ve kısa film \"The Last Chance\") anlatan klipler içeriyor; ayrıca yaşlı olmadığını, resmi hesaplarının platformlarda listelendiğini belirtiyor."
  id: "Saluran YouTube \"Lectures from Mohamed Hablas\" menampilkan klip yang menggambarkan rekam jejaknya (dari Lebanon, tinggal di Sydney, memberikan kuliah di banyak negara, video untuk jaringan One Path, tim radio Sydney Dean, dan film pendek \"The Last Chance\") serta mencatat bahwa ia bukan seorang tetua, dan akun resminya tercantum di platform."
