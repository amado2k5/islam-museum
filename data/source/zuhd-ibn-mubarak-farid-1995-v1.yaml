summary:
  ar: "المجلد الأول من تحقيق أحمد فريد لكتاب الزهد، وفيه مقدمته في معنى الزهد ومنهجه في التحقيق وتراجم رواة نسخة المروزي ومعجم رجال الكتاب، ثم النص مرقماً من جديد بعد حذف زيادات التلاميذ من غير طريق ابن المبارك."
  en: "Volume 1 of Ahmad Farid's edition of al-Zuhd, with his introduction on the meaning of renunciation, his editorial method, biographies of the transmitters of the al-Marwazi recension and a dictionary of the book's narrators, followed by the text renumbered after removing students' additions not transmitted through Ibn al-Mubarak."
  ur: "احمد فرید کی تحقیق کی پہلی جلد، جس میں زہد کے معنی، منہجِ تحقیق، مروزی کے نسخے کے راویوں کے تراجم اور کتاب کے رجال کی فہرست پر ان کا مقدمہ ہے، پھر متن، ابن المبارک کے طریق کے بغیر شاگردوں کے اضافے حذف کر کے نئے نمبروں کے ساتھ۔"
