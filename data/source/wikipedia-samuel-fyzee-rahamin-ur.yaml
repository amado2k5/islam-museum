summary:
  ar: "مقالة ويكيبيديا الأردية الموجزة غير الموثقة بالمصادر عن سموئيل فيضي رحيمين؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 19 كانون الأول 1880 ووفاته في 22 تشرين الأول 1967، وتصفه بأنه زوج عطية فيضي، وتصنّفه بين من اعتنقوا الإسلام من اليهودية."
  en: "Urdu Wikipedia stub article on Samuel Fyzee-Rahamin, carrying an 'unreferenced' banner; used for entity facts only. It gives his birth on 19 December 1880 and his death on 22 October 1967, describes him as the husband of Atiya Fyzee, and files him among converts to Islam from Judaism."
  es: "Artículo incompleto de la Wikipedia en urdu sobre Samuel Fyzee-Rahamin, con la etiqueta \"sin referencias\"; utilizado únicamente para datos sobre la persona. Indica su fecha de nacimiento (19 de diciembre de 1880) y su fallecimiento (22 de octubre de 1967), lo describe como el esposo de Atiya Fyzee y lo incluye entre los conversos al islam provenientes del judaísmo."
  fr: "Ébauche d'article Wikipédia en ourdou sur Samuel Fyzee-Rahamin, portant la mention « non référencé »; utilisé uniquement à des fins d'information. Il indique sa naissance le 19 décembre 1880 et son décès le 22 octobre 1967, le décrit comme l'époux d'Atiya Fyzee et le classe parmi les convertis du judaïsme à l'islam."
  ur: "سیموئیل فائزی-رحمن پر اردو ویکیپیڈیا کا نامکمل مضمون، ایک 'غیر حوالہ' بینر کے ساتھ؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 19 دسمبر 1880 کو اس کی پیدائش اور 22 اکتوبر 1967 کو اس کی موت کا ذکر کرتا ہے، اسے عطیہ فیزی کے شوہر کے طور پر بیان کرتا ہے، اور اسے یہودیت سے اسلام قبول کرنے والوں میں شامل کرتا ہے۔"
  tr: "Samuel Faydi Rahimin hakkında kısa Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 19 Aralık 1880'de ve ölümünü 22 Ekim 1967'de veriyor, onu Atiya Faydi'nin eşi olarak tanımlıyor ve Yahudilikten İslam'a geçenler arasında sınıflandırıyor."
  id: "Artikel Wikipedia Urdu singkat tentang Samuel Faydi Rahimin; digunakan hanya untuk fakta entitas. Artikel ini menyebutkan kelahirannya pada 19 Desember 1880, dan kematiannya pada 22 Oktober 1967, menggambarkannya sebagai suami Atiya Faydi, dan mengklasifikasikannya di antara mereka yang berpindah agama ke Islam dari Yudaisme."
