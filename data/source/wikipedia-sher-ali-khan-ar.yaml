  ar: "مقالة ويكيبيديا العربية عن شير علي خان؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تعطي سنواته 1825-1879 وولايته إمارة أفغانستان مرتين بعد وفاة أبيه دوست محمد خان، وتحوله عن صداقة البريطانيين إلى روسيا ونشوب الحرب الإنجليزية الأفغانية الثانية ووفاته في المنفى. حقل الديانة في صندوق معلوماتها فارغ."
  en: "Arabic Wikipedia article on Sher Ali Khan; a short article used for entity facts only. It gives his years as 1825–1879, his two tenures of the emirate of Afghanistan after the death of his father Dost Mohammad Khan, his turn from friendship with the British towards Russia, the outbreak of the Second Anglo-Afghan War and his death in exile. The religion field of its infobox is empty."
