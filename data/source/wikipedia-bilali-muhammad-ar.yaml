  ar: "مقالة ويكيبيديا العربية عن مخطوطة بلالي؛ تُستخدم لوقائع الكيان فقط. تروي ولادة بلالي محمد في تيمبو بغينيا نحو سنة 1770 لأسرة مسلمة متعلمة، وعمله في مزرعة سبالدينغ بجزيرة سابيلو، ووفاته سنة 1857 واكتشاف مخطوطته."
  en: "Arabic Wikipedia article on the Bilali manuscript; used for entity facts only. It recounts Bilali Muhammad's birth in Timbo, Guinea, about 1770 to a well-educated Muslim family, his work on Spalding's plantation on Sapelo Island, his death in 1857 and the discovery of his manuscript."
