reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. The article follows the English article's content closely and is treated as the same source family, not an independent tradition; its one independent value is that, citing William Brown Hodgson, it gives Bilali's birth as in Timbo, Guinea, about 1770, where the English article gives the range 1760–1779. It agrees with the English article on the ten years on Middle Caicos under Dr. Bell, the sale of 1802, the purchase by Thomas Spalding, the plantation managership, the War of 1812 defence, the death in 1857 and the manuscript's derivation from the Risalah of Abu Zayd al-Qayrawani. It names no madhhab or order for Bilali personally."
