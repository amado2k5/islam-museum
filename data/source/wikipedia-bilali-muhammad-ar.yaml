summary:
  ar: "مقالة ويكيبيديا العربية عن مخطوطة بلالي؛ تُستخدم لوقائع الكيان فقط. تروي ولادة بلالي محمد في تيمبو بغينيا نحو سنة 1770 لأسرة مسلمة متعلمة، وعمله في مزرعة سبالدينغ بجزيرة سابيلو، ووفاته سنة 1857 واكتشاف مخطوطته."
  en: "Arabic Wikipedia article on the Bilali manuscript; used for entity facts only. It recounts Bilali Muhammad's birth in Timbo, Guinea, about 1770 to a well-educated Muslim family, his work on Spalding's plantation on Sapelo Island, his death in 1857 and the discovery of his manuscript."
  es: "Artículo en árabe de la Wikipedia sobre el manuscrito de Bilali; se utiliza únicamente para obtener información sobre la persona. Relata el nacimiento de Bilali Muhammad en Timbo, Guinea, alrededor de 1770, en el seno de una familia musulmana culta, su trabajo en la plantación de Spalding en la isla de Sapelo, su muerte en 1857 y el descubrimiento de su manuscrito."
  fr: "Article de Wikipédia en arabe sur le manuscrit de Bilali; utilisé uniquement à des fins d'information. Il relate la naissance de Bilali Muhammad à Timbo, en Guinée, vers 1770, au sein d'une famille musulmane instruite, son travail dans la plantation de Spalding sur l'île de Sapelo, sa mort en 1857 et la découverte de son manuscrit."
  ur: "بلالی مخطوطہ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بلالی محمد کی پیدائش ٹمبو، گنی میں تقریباً 1770 میں ایک پڑھے لکھے مسلمان خاندان میں ہوئی، اس کا جزیرہ ساپیلو پر اسپلڈنگ کے شجرکاری پر کام، 1857 میں اس کی موت اور اس کے مخطوطہ کی دریافت کا ذکر ہے۔"
