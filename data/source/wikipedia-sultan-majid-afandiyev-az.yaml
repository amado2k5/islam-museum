  ar: "مقالة ويكيبيديا الأذربيجانية عن سلطان مجيد أفندييف؛ تُستخدم لوقائع الكيان فقط. تعطي تاريخيه 14 (26) مايو 1887 – 21 أبريل 1938 وتصفه بأنه من أوائل السياسيين الماركسيين في أذربيجان، وتذكر مناصبه ومنها مفوض شؤون مسلمي ما وراء القوقاز سنة 1919. لا تسمي مذهبًا له ولا تشهد بإلحاده شخصيًا."
