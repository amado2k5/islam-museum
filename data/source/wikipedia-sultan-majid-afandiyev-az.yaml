summary:
  ar: "مقالة ويكيبيديا الأذربيجانية عن سلطان مجيد أفندييف؛ تُستخدم لوقائع الكيان فقط. تعطي تاريخيه 14 (26) مايو 1887 – 21 أبريل 1938 وتصفه بأنه من أوائل السياسيين الماركسيين في أذربيجان، وتذكر مناصبه ومنها مفوض شؤون مسلمي ما وراء القوقاز سنة 1919. لا تسمي مذهبًا له ولا تشهد بإلحاده شخصيًا."
  en: "Azerbaijani Wikipedia article on Sultan Majid Afandiyev; used for entity facts only. It gives his dates as 14 (26) May 1887 – 21 April 1938, calls him one of Azerbaijan's first Marxist-minded politicians, and lists his offices, among them Commissar for the Affairs of the Muslims of the Transcaucasus in 1919. It names no school for him and does not attest atheism for him personally."
  es: "Artículo de Wikipedia en azerbaiyano sobre el sultán Majid Afandiyev; utilizado únicamente para datos sobre la persona. Indica que nació el 14 (26) de mayo de 1887 y falleció el 21 de abril de 1938, lo describe como uno de los primeros políticos de Azerbaiyán con mentalidad marxista y enumera sus cargos, entre ellos el de Comisario para los Asuntos de los Musulmanes del Transcaucasia en 1919. No menciona ninguna escuela a la que perteneció ni atestigua su ateísmo personal."
  fr: "L'article de Wikipédia azerbaïdjanais consacré au sultan Majid Afandiyev, utilisé uniquement à des fins d'information, indique ses dates de naissance et de décès: 14 (26) mai 1887 – 21 avril 1938. Il le présente comme l'un des premiers hommes politiques azerbaïdjanais d'inspiration marxiste et énumère ses fonctions, notamment celle de commissaire aux affaires des musulmans du Caucase du Sud en 1919. L'article ne mentionne aucune école qu'il aurait fréquentée et ne fait pas état de son athéisme."
  ur: "سلطان ماجد آفندیف پر آذربائیجانی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی تاریخیں 14 (26) مئی 1887 - 21 اپریل 1938 دی گئی ہیں، انہیں آذربائیجان کے پہلے مارکسی سوچ رکھنے والے سیاست دانوں میں سے ایک قرار دیا گیا ہے، اور ان کے دفاتر کی فہرست دی گئی ہے، ان میں سے 1919 میں ٹرانسکاکیسس کے مسلمانوں کے امور کے لیے کمیسر۔"
  tr: "Sultan Mejid Afandiyev hakkında Azerbaycan Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Tarihi 14 (26) Mayıs 1887 – 21 Nisan 1938 tarihleri arasında olup, onu Azerbaycan'ın en erken Marksist politikacılarından biri olarak tanımlar; 1919'da Transkafkasya Müslüman İşleri Komiserliği de dahil olmak üzere görevlerinden bahseder. Mezhebi isimlendirilmez ve ateizmini şahsen doğrulamaz."
  id: "Artikel Wikipedia Azerbaijan tentang Sultan Mejid Afandiyev; digunakan hanya untuk fakta entitas tersebut. Sejarahnya bertanggal 14 (26) Mei 1887 – 21 April 1938, menggambarkannya sebagai salah satu politisi Marxis paling awal di Azerbaijan, menyebutkan posisinya, termasuk Komisaris Urusan Muslim Transkaukasia pada tahun 1919. Tidak disebutkan sektenya maupun secara pribadi membuktikan ateismenya."
