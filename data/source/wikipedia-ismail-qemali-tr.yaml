reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 24 January 1844 at Avlonya (Vlorë) to a distinguished noble Albanian family (the birth day agrees with the Albanian article against the English, Arabic and Wikidata 16 January); schooling at Vlorë, the Zosimaia at Ioannina and law at Istanbul; marriage to a Greek woman and his children's schooling in Greece; wartime exile in Paris, the memoirs written with Somerville Story of the Daily Mail; in 1918 travel to Italy, detention there as the Italian government's involuntary guest at a Perugia hotel, and death at a dinner of a heart attack; 'his body was brought to Vlorë and buried in the local tekke of the Bektashi Order'. The tekke burial is a funeral fact, stated in the prose; like the English article, this article makes no statement about his own school."
