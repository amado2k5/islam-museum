reliability_note: "A Bangladeshi online daily's report, published 24 October 2026 and read in full on 8 November 2026. It reports the statement he posted on his verified Facebook page on Friday 23 October 2026, prompted by a child-abuse case at a Tongi madrasa that had drawn nationwide discussion: that covering up wrongdoing inside religious educational institutions while speaking out against others' wrongdoing is a grave moral offence and doubly harmful; that a teacher's discipline, affection and care toward students have a definite limit, and the moral standard for religious teachers must be stricter; that such allegations require impartial investigation and, where guilt is proven, exemplary punishment; and, in his words as reported, that there is no compromise over the safety of one's own children. The report styles him 'জনপ্রিয় ইসলামি বক্তা ও গবেষক ড. আব্দুল হাই মুহাম্মাদ সাইফুল্লাহ' (popular Islamic speaker and researcher Dr Abdul Hai Muhammad Saifullah). The same statement was reported the same day, 24 October 2026, by Agamir Somoy, Duaa News, Desher Potro, Cox's Bazar Bulletin and Ajker Samacharpatra, which likewise identify him as an Islamic speaker/researcher and as khatib of Masjidul Juma Complex, Pallabi, Mirpur, Dhaka. These are reports of his own published statement, quoted and paraphrased as such; they attest his public role and his reported position, and they name no school of law or order for him."
