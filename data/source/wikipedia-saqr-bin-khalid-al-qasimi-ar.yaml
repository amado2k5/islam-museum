  ar: "مقالة ويكيبيديا العربية القصيرة عن صقر بن خالد القاسمي (حكم 1883–1914)، حاكم الشارقة وحاكم رأس الخيمة 1900–1910؛ تصف سياسته الواقعية المرنة داخل الأسرة الحاكمة وملاينته لبريطانيا، وتسمي ابنيه سلطان الثاني ومحمد اللذين حكما الشارقة من بعده لاحقًا."
  en: "Short Arabic Wikipedia article on Saqr bin Khalid Al Qasimi (reigned 1883–1914), ruler of Sharjah and ruler of Ras Al Khaimah 1900–1910; it describes his pragmatic, flexible policy within the ruling family and his accommodation of Britain, and names his sons Sultan II and Muhammad, who later ruled Sharjah after him."
