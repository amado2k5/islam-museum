summary:
  ar: "مقالة ويكيبيديا العربية عن خورشيدبانو ناتوان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها 6 أغسطس 1832 في صدرها و5 أغسطس في متنها، ووفاتها في 2 أكتوبر 1897 في شوشا ودفنها في مقبرة الإيمارات بآقدام، وأعمالها الخيرية وخط الماء وخيول قره باغ. لا تذكر شيئًا عن مذهبها الشخصي."
  en: "Arabic Wikipedia article on Khurshidbanu Natavan; used for entity facts only. It gives her birth as 6 August 1832 in its lead and 5 August in its Life section, her death at Shusha on 2 October 1897 and burial in the Imarat cemetery at Aghdam, her philanthropy, water main and Karabakh horses. It makes no statement about her personal school of religion."
  es: "Artículo de Wikipedia en árabe sobre Khurshidbanu Natavan; utilizado únicamente para datos sobre la persona. En su introducción, indica que nació el 6 de agosto de 1832 y, en la sección de su biografía, el 5 de agosto. Menciona su fallecimiento en Shusha el 2 de octubre de 1897 y su entierro en el cementerio de Imarat en Aghdam, así como su labor filantrópica, la construcción de una tubería principal de agua y la donación de caballos en Karabaj. No hace ninguna mención a su escuela religiosa."
  fr: "Article Wikipédia en arabe sur Khurshidbanu Natavan; utilisé uniquement pour les informations la concernant. Il indique sa naissance le 6 août 1832 dans l’introduction et le 5 août dans la section « Vie », son décès à Choucha le 2 octobre 1897 et son inhumation au cimetière Imarat d’Aghdam. Il mentionne également ses œuvres philanthropiques, la construction d’une conduite d’eau et l’acquisition de chevaux du Karabakh. Aucune information n’est donnée sur son école religieuse."
  ur: "خورشید بانو نتاوان پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 6 اگست 1832 کو اس کی قیادت میں اور 5 اگست کو اس کے لائف سیکشن میں ہوئی، اس کی موت 2 اکتوبر 1897 کو شوشا میں ہوئی اور اس کی تدفین، اس کی انسان دوستی، پانی کے مین اور قرابخ کے گھوڑوں میں واقع امارت قبرستان میں ہوئی۔ یہ اس کے ذاتی اسکول آف مذہب کے بارے میں کوئی بیان نہیں دیتا۔"
