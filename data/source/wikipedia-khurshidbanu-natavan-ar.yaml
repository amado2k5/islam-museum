  ar: "مقالة ويكيبيديا العربية عن خورشيدبانو ناتوان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها 6 أغسطس 1832 في صدرها و5 أغسطس في متنها، ووفاتها في 2 أكتوبر 1897 في شوشا ودفنها في مقبرة الإيمارات بآقدام، وأعمالها الخيرية وخط الماء وخيول قره باغ. لا تذكر شيئًا عن مذهبها الشخصي."
