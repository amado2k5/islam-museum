summary:
  ar: "طبعة المكتب الإسلامي (بيروت ودمشق) لكتاب السنة للحافظ أبي بكر أحمد بن عمرو بن أبي عاصم الشيباني (ت 287هـ)، في جزأين، مع تخريج الألباني لأحاديثه المسمى «ظلال الجنة في تخريج السنة» وحكمه على أسانيدها؛ وفي أول الجزء الأول مقدمة الناشر زهير الشاويش."
  en: "The al-Maktab al-Islami (Beirut and Damascus) printing of Kitab al-Sunna by the hadith master Abu Bakr Ahmad ibn Amr Ibn Abi Asim al-Shaybani (d. 287 AH), in two parts, with al-Albani's commentary on its hadiths, Zilal al-Janna fi Takhrij al-Sunna, grading their chains; part 1 opens with the publisher Zuhayr al-Shawish's preface."
