summary:
  ar: "مقالة ويكيبيديا الألمانية عن غلام حسين؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1876 في خرابات بكابل ووفاته فيها في 18 سبتمبر 1967، وأباه أستاذ عطا حسين من مدرسة باتيالا، وتعلمه السارنغي والراغا، وتأسيسه مدرسة موسيقية في خرابات ووضع منهج الموسيقى المدرسي وتدريسه في مدارس كابل، وانضمام فرقته إلى أوركسترا إذاعة أفغانستان، وأن ابنه محمد حسين سرآهنگ واصل عمله. تستند إلى كتاب وهاب مددي في تاريخ الموسيقى الأفغانية (طهران 1996). لا تسمي دينا ولا مذهبا."
  en: "German Wikipedia article on Ghulam Hossein; used for entity facts only. It gives his birth in 1876 at Kharabat, Kabul and his death there on 18 September 1967, his father Ustad Atta Hossein of the Patiala school, his training in sarangi and raga, his founding of a music school in Kharabat, his devising of the school music curriculum and teaching in Kabul's schools, the absorption of his ensemble into the Radio Afghanistan orchestra, and his son Mohammad Hossein Sarahang continuing his work. It rests on Wahab Madadi's history of Afghan music (Tehran 1996). It names no religion or school."
