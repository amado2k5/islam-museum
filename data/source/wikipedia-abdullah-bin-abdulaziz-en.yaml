summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله بن عبد العزيز آل سعود؛ تُستخدم لوقائع الكيان فقط. تذكر أنه ملك السعودية من 1 أغسطس 2005 حتى وفاته في 23 يناير 2015، الابن العاشر للملك عبد العزيز، وأمين مكة سنة 1961، وقائد الحرس الوطني من 1962 — وقد نقل مهام منصبه إلى ابنه سنة 2010 — وولي العهد من 13 يونيو 1982 والحاكم الفعلي بعد جلطة الملك فهد سنة 1995. وتذكر ولادته في الرياض في 1 أغسطس 1924، ولا تذكر له دينًا في متنها أو صندوق معلوماتها؛ وتصنيفاتها تدرجه في «Saudi Arabian Sunni Muslims»."
  en: "English Wikipedia article on Abdullah bin Abdulaziz Al Saud; used for entity facts only. It gives him as King of Saudi Arabia from 1 August 2005 until his death on 23 January 2015, the tenth son of King Abdulaziz, mayor of Mecca in 1961, commander of the Saudi Arabian National Guard from 1962 — a post whose duties he transferred to his son in 2010 — Crown Prince from 13 June 1982 and de facto ruler after King Fahd's 1995 stroke. It gives his birth at Riyadh on 1 August 1924 and names no religion for him in text or infobox; its categories file him under 'Saudi Arabian Sunni Muslims'."
