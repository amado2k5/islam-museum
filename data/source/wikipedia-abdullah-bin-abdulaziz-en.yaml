summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله بن عبد العزيز آل سعود؛ تُستخدم لوقائع الكيان فقط. تذكر أنه ملك السعودية من 1 أغسطس 2005 حتى وفاته في 23 يناير 2015، الابن العاشر للملك عبد العزيز، وأمين مكة سنة 1961، وقائد الحرس الوطني من 1962 — وقد نقل مهام منصبه إلى ابنه سنة 2010 — وولي العهد من 13 يونيو 1982 والحاكم الفعلي بعد جلطة الملك فهد سنة 1995. وتذكر ولادته في الرياض في 1 أغسطس 1924، ولا تذكر له دينًا في متنها أو صندوق معلوماتها؛ وتصنيفاتها تدرجه في «Saudi Arabian Sunni Muslims»."
  en: "English Wikipedia article on Abdullah bin Abdulaziz Al Saud; used for entity facts only. It gives him as King of Saudi Arabia from 1 August 2005 until his death on 23 January 2015, the tenth son of King Abdulaziz, mayor of Mecca in 1961, commander of the Saudi Arabian National Guard from 1962 — a post whose duties he transferred to his son in 2010 — Crown Prince from 13 June 1982 and de facto ruler after King Fahd's 1995 stroke. It gives his birth at Riyadh on 1 August 1924 and names no religion for him in text or infobox; its categories file him under 'Saudi Arabian Sunni Muslims'."
  es: "Artículo de la Wikipedia en inglés sobre Abdullah bin Abdulaziz Al Saud; utilizado únicamente para datos sobre la entidad. Lo describe como rey de Arabia Saudita desde el 1 de agosto de 2005 hasta su muerte el 23 de enero de 2015, décimo hijo del rey Abdulaziz, alcalde de La Meca en 1961, comandante de la Guardia Nacional Saudita desde 1962 —cargo cuyas funciones transfirió a su hijo en 2010—, príncipe heredero desde el 13 de junio de 1982 y gobernante de facto tras el derrame cerebral del rey Fahd en 1995. Indica que nació en Riad el 1 de agosto de 1924 y no menciona su religión en el texto ni en el recuadro informativo; sus categorías lo clasifican como «musulmanes sunitas sauditas»."
  fr: "L'article de Wikipédia en anglais consacré à Abdullah bin Abdulaziz Al Saud, utilisé uniquement pour les informations sur l'entité, le présente comme roi d'Arabie saoudite du 1er août 2005 à sa mort le 23 janvier 2015, dixième fils du roi Abdulaziz, maire de La Mecque en 1961, commandant de la Garde nationale saoudienne à partir de 1962 (poste qu'il a confié à son fils en 2010), prince héritier à partir du 13 juin 1982 et dirigeant de facto après l'accident vasculaire cérébral du roi Fahd en 1995. L'article indique sa naissance à Riyad le 1er août 1924 et ne mentionne aucune religion pour lui, ni dans le texte ni dans l'infobox; il est classé dans la catégorie « Musulmans sunnites d'Arabie saoudite »."
  ur: "عبداللہ بن عبدالعزیز آل سعود پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انہیں 1 اگست 2005 سے لے کر 23 جنوری 2015 کو ان کی موت تک سعودی عرب کے بادشاہ کے طور پر دیتا ہے، شاہ عبدالعزیز کے دسویں بیٹے، 1961 میں مکہ کے میئر، 1962 سے سعودی عرب نیشنل گارڈ کے کمانڈر - ایک ایسا عہدہ جس کی ذمہ داریاں اس نے اپنے بیٹے کو 2010 میں منتقل کیں - ولی عہد شہزادہ اور 12 جون سے 13 جون کے بعد حقیقت میں بادشاہ بنے۔ 1995 فالج۔ اس کی پیدائش 1 اگست 1924 کو ریاض میں ہوئی اور متن یا معلوماتی خانے میں اس کے لیے کسی مذہب کا نام نہیں لیا گیا۔ اس کے زمرے اسے 'سعودی عرب سنی مسلمان' کے تحت فائل کرتے ہیں۔"
  tr: "Abdullah bin Abdulaziz Al Saud hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1 Ağustos 2005'ten 23 Ocak 2015'teki ölümüne kadar Suudi Arabistan Kralı olduğu, 1961'de Mekke Belediye Başkanı olan Kral Abdülaziz'in onuncu oğlu, 1962'den beri Ulusal Muhafız komutanı olduğu belirtilmiştir—2010'da görevini oğluna devretmiş—ve 13 Haziran 1982'den itibaren veliaht prens, 1995'te Kral Fahd'ın felci sonrası fiili hükümdardır. 1 Ağustos 1924'te Riyad'da doğduğu belirtilmektedir, ancak metinde veya bilgi kutusunda herhangi bir din belirtilmemiştir; sınıflandırmalarında \"Suudi Arabistan Sünni Müslümanları\" olarak yer almaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdullah bin Abdulaziz Al Saud; digunakan hanya untuk fakta entitas. Dicatat bahwa ia menjadi Raja Arab Saudi dari 1 Agustus 2005 hingga wafatnya pada 23 Januari 2015, putra kesepuluh Raja Abdulaziz, Wali Kota Mekah pada tahun 1961, komandan Garda Nasional sejak 1962—ia menyerahkan tugasnya kepada putranya pada tahun 2010—dan putra mahkota sejak 13 Juni 1982, serta penguasa de facto setelah stroke Raja Fahd pada tahun 1995. Ia disebutkan lahir di Riyadh pada 1 Agustus 1924, tetapi tidak menyebutkan agama apa pun dalam teks atau kotak info; klasifikasinya mencantumkannya dalam \"Muslim Sunni Arab Saudi.\""
