reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id. It gives his full name as Medhi Amine El Mouttaqi Benatia, born 17 April 1987 in Courcouronnes, France, to a Moroccan father and an Algerian mother; a centre-back who came through Marseille, played for Clermont, Udinese, Roma, Bayern Munich (signed for 26 million euros in 2014, Bundesliga winner in both his seasons), Juventus (three league titles, the 2017 Champions League final, two goals in the 2018 Coppa Italia final), Al-Duhail and Fatih Karagümrük before retiring in 2021; 66 caps for Morocco, whom he captained at the 2018 World Cup; and afterwards sporting director of Marseille. It makes no statement of his religion in its text or infobox."
