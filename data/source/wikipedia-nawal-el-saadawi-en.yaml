reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers her birth at Kafr Tahla on 27 October 1931, her genital cutting at six, her father's exile after the 1919 revolution, her medical graduation in 1955, the Columbia master's of 1966, her three marriages, her health-ministry career and dismissal, Woman at Point Zero (1975), the 1981 imprisonment under Sadat and Memoirs from the Women's Prison, the Arab Women's Solidarity Association (1982), the flight from Egypt in 1993 and return in 1996, the failed 2002 hisba divorce suit and the failed 2008 nationality suit, her awards, her death at Cairo on 21 March 2021, and her reported views — including her 2014 statement on religious fundamentalism, her 2015 comments on the Hajj, and her description of the veil as a tool of oppression. The article is internally inconsistent on Women and Sex: its narrative dates the book to 1972 while its bibliography and Britannica give 1969; the earlier date is followed and the conflict recorded. Read in full on 24 October 2026."
