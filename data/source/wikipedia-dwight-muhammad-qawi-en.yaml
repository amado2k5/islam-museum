summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن دوايت محمد قاوي؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده باسم دوايت براكستون في 5 يناير 1953 في بالتيمور ووفاته في 25 يوليو 2025، وبطولتيه العالميتين في وزن خفيف الثقيل والكروزر، ودخوله قاعة المشاهير سنة 2004، وسجله 41 فوزاً. وتذكر في متنها أنه اعتنق الإسلام في أوائل الثمانينيات وغيّر اسمه، مستشهدة بنعي CBS Sports."
  en: "English Wikipedia article on Dwight Muhammad Qawi; used for entity facts only. It gives his birth as Dwight Braxton on 5 January 1953 in Baltimore and his death on 25 July 2025, his world titles at light heavyweight and cruiserweight, his 2004 Hall of Fame induction, and his record of 41 wins. Its text states that he converted to Islam in the early 1980s and changed his name, citing the CBS Sports obituary."
  es: "Artículo de la Wikipedia en inglés sobre Dwight Muhammad Qawi; utilizado únicamente para datos biográficos. Indica que nació como Dwight Braxton el 5 de enero de 1953 en Baltimore y falleció el 25 de julio de 2025, obtuvo sus títulos mundiales en las categorías de peso semipesado y crucero, ingresó al Salón de la Fama en 2004 y registró un récord de 41 victorias. El texto menciona que se convirtió al islam a principios de la década de 1980 y cambió su nombre, citando el obituario de CBS Sports."
  fr: "Article Wikipédia en anglais sur Dwight Muhammad Qawi; utilisé uniquement pour les informations le concernant. Il indique sa naissance sous le nom de Dwight Braxton le 5 janvier 1953 à Baltimore et son décès le 25 juillet 2025, ses titres mondiaux en mi-lourds et en lourds-légers, son intronisation au Hall of Fame en 2004 et son palmarès de 41 victoires. Le texte précise qu'il s'est converti à l'islam au début des années 1980 et a changé de nom, citant la nécrologie de CBS Sports."
