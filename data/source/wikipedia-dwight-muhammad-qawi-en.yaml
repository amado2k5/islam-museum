  ar: "مقالة ويكيبيديا الإنجليزية عن دوايت محمد قاوي؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده باسم دوايت براكستون في 5 يناير 1953 في بالتيمور ووفاته في 25 يوليو 2025، وبطولتيه العالميتين في وزن خفيف الثقيل والكروزر، ودخوله قاعة المشاهير سنة 2004، وسجله 41 فوزاً. وتذكر في متنها أنه اعتنق الإسلام في أوائل الثمانينيات وغيّر اسمه، مستشهدة بنعي CBS Sports."
  en: "English Wikipedia article on Dwight Muhammad Qawi; used for entity facts only. It gives his birth as Dwight Braxton on 5 January 1953 in Baltimore and his death on 25 July 2025, his world titles at light heavyweight and cruiserweight, his 2004 Hall of Fame induction, and his record of 41 wins. Its text states that he converted to Islam in the early 1980s and changed his name, citing the CBS Sports obituary."
