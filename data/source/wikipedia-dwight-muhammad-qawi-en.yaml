reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The infobox gives his birth name Dwight Braxton, his birth on 5 January 1953 in Baltimore, his death on 25 July 2025 in Baltimore, his nickname Camden Buzzsaw, and his record of 41 wins, 11 losses and a draw. The text records his Camden upbringing, his armed-robbery sentence and the Rahway prison boxing programme, his December 1981 WBC title win over Matthew Saad Muhammad, his 1985 WBA cruiserweight title, his 1986 and 1987 fights with Evander Holyfield, his later work as a trainer and as a counsellor at the Lighthouse rehabilitation centre in Mays Landing, and his death at a Baltimore nursing home after five years with dementia, citing the New York Times obituary of 29 July 2025 for the dementia. The conversion sentence cites the CBS Sports obituary; the article files him in the categories African-American Muslims and Converts to Islam — filings, not attestation."
