summary:
  ar: "دراسة ديفيد روبنسون الأكاديمية عن مجتمعات السنغال وموريتانيا المسلمة والسلطات الاستعمارية الفرنسية (1880–1920)، وفيها معالجة مطوّلة للشيخ سيديا بابا وزاوية بوتلميت وفتواه سنة 1903."
  en: "David Robinson's scholarly study of Muslim societies and French colonial authorities in Senegal and Mauritania (1880–1920), with an extended treatment of Shaykh Sidiyya Baba, the Boutilimit zawiya and his fatwa of 1903."
  es: "El estudio académico de David Robinson sobre las sociedades musulmanas y las autoridades coloniales francesas en Senegal y Mauritania (1880-1920), con un análisis extenso del jeque Sidiyya Baba, la zawiya Boutilimit y su fatwa de 1903."
  fr: "L'étude érudite de David Robinson sur les sociétés musulmanes et les autorités coloniales françaises au Sénégal et en Mauritanie (1880-1920), avec un traitement approfondi du cheikh Sidiyya Baba, de la zawiya de Boutilimit et de sa fatwa de 1903."
  ur: "ڈیوڈ رابنسن کا سینیگال اور موریطانیہ (1880-1920) میں مسلم معاشروں اور فرانسیسی نوآبادیاتی حکام کا علمی مطالعہ، شیخ سیدیہ بابا، بوتیلمیت زاویہ اور ان کے 1903 کے فتوے کے ساتھ ایک وسیع سلوک کے ساتھ۔"
  tr: "David Robinson'ın Senegal, Moritanya ve Fransız sömürge otoriteleri (1880–1920) Müslüman toplumları üzerine akademik çalışması; Şeyh Sidia Baba, Boutilimit zawiyat ve 1903'teki fetvasının kapsamlı bir incelemesini içermektedir."
  id: "Studi akademis David Robinson tentang masyarakat Muslim Senegal, Mauritania, dan otoritas kolonial Prancis (1880–1920), termasuk pembahasan mendalam tentang Sheikh Sidia Baba, Boutilimit zawiyat, dan fatwanya pada tahun 1903."
title: "Paths of Accommodation: Muslim Societies and French Colonial Authorities in Senegal and Mauritania, 1880–1920"
