reliability_note: "The standard scholarly monograph on its subject, drawn from archival, oral and Arabic sources; its author's companion presentation of the same research in Michigan State University's African Online Digital Library gallery 'Islam and Modernity' dates Sidiyya Baba 'circa 1862–1924', describes his zawiya and network of influence across southwestern Mauritania and Senegal from his base at Boutilimit, his close bond with Xavier Coppolani, and his fatwa of January 1903 justifying acceptance of French overrule. The work treats Baba as the head of the Sidiyya — the Qadiri branch his grandfather Sidiyya al-Kabir had founded at Boutilimit — which he consolidated and led."
