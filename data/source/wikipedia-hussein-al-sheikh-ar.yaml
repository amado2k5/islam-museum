  ar: "مقالة ويكيبيديا العربية عن حسين بن عبد العزيز آل الشيخ؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1384هـ ونسبه إلى محمد بن عبد الوهاب ودراسته بالرياض وقضاءه بنجران والرياض والمدينة وإمامته للمسجد النبوي، ولا تسمي له مذهباً."
  en: "Arabic Wikipedia article on Hussein Al-Sheikh; used for entity facts only. It gives his birth in 1384 AH, his descent from Muhammad ibn Abd al-Wahhab, his studies in Riyadh, his judgeships in Najran, Riyadh and Medina and his imamate of the Prophet's Mosque; it names no school for him."
