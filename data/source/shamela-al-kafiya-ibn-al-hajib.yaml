summary:
  ar: "رابط «الكافية في علم النحو» في المكتبة الشاملة كما ورد في ملخص بحثي قُدّم إلى المتحف؛ لم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص دون إعادة تحقق في 21 نوفمبر 2026، في موضوع: وجود الكتاب في المكتبة الشاملة."
  en: "The Shamela link that a research summary supplied to the museum lists beside al-Kafiya of Ibn al-Hajib: it is the link for a commentary on the book, Sharh al-Radi, which the summary says is indexed; the museum did not open the page, and the founder approved using the summary without re-verification on 21 November 2026."
  ur: "«الکافیہ فی علم النحو» کا المکتبۃ الشاملہ میں لنک، جیسا عجائب گھر کو دیے گئے ایک تحقیقی خلاصے میں مذکور ہے؛ عجائب گھر نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصے کے استعمال کی منظوری دی، موضوع: کتاب کی الشاملہ میں موجودگی۔"
  fr: "Le lien de al-Kafiya fi Ilm al-Nahw dans la bibliothèque Shamela, tel que le liste un résumé de recherche remis au musée ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé sans nouvelle vérification le 21 novembre 2026, pour la présence de l'ouvrage dans la bibliothèque Shamela."
  es: "El enlace de al-Kafiya fi Ilm al-Nahw en la biblioteca Shamela, tal como lo lista un resumen de investigación entregado al museo; el museo no abrió la página, y el fundador aprobó usar el resumen sin nueva verificación el 21 de noviembre de 2026, para la presencia de la obra en la biblioteca Shamela."
  tr: "Kapsamlı Kütüphane'deki \"Al-Kafiya fi Ilm al-Nahw\" bağlantısı, müzeye sunulan bir araştırma özetinde belirtilmiştir; müze sayfayı açmamış ve kurucu 21 Kasım 2026'da özetin yeniden doğrulama yapılmadan kullanılmasına izin vermiştir: Kitabın Kapsamlı Kütüphane'deki varlığı."
  id: "Tautan ke \"Al-Kafiya fi Ilm al-Nahw\" di Perpustakaan Komprehensif seperti yang disebutkan dalam ringkasan penelitian yang dikirimkan ke museum; museum tidak membuka halaman tersebut, dan pendiri mengizinkan penggunaan ringkasan tanpa verifikasi ulang pada 21 November 2026, dengan topik: Keberadaan buku di Perpustakaan Komprehensif."
