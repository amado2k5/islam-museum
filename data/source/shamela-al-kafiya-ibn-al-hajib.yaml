  en: "Sharh al-Radi on al-Kafiya in the Shamela library (link listed for al-Kafiya)"
  ur: "شرح الرضی علی الکافیہ المکتبۃ الشاملہ میں ⁦(کافیہ کے لیے مذکور لنک)⁩"
  fr: "Sharh al-Radi sur al-Kafiya dans la bibliothèque Shamela (lien indiqué pour al-Kafiya)"
