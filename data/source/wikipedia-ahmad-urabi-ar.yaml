reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 24 October 2026. It gives his full name (Ahmad Muhammad 'Urabi ... al-Husayni), his birth on 31 March 1841 at Hurriyat Razna near Zagazig in Sharqia, his father the village 'umda/shaykh, his childhood memorisation of the Qur'an and schooling by the village scribe Mikhayil Ghattas, his entry to al-Azhar at eight, his conscription and rapid promotion, and the framing the record follows for his office: Minister of War and deputy head of the council in al-Barudi's nationalist ministry from 4 February 1882 — against the English infobox's prime-minister styling. Its infobox records his religion as Islam (al-Islam), generically, and no madhhab — a position the record's faith note relies on. Neither Zagazig nor Hurriyat Razna has a place entity in the museum yet."
