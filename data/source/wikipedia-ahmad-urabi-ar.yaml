summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد عرابي؛ تُستخدم لوقائع الكيان فقط. توثّق نشأته في قرية هرية رزنة قرب الزقازيق لأسرة فلاحية ميسورة، وتعليمه الأزهري، وصعوده العسكري، وكونه وزيرا للحربية ونائبا لرئيس مجلس النظار في وزارة محمود سامي البارودي من 4 فبراير 1882. يذكر صندوقها دينه «الإسلام» دون مذهب."
  en: "Arabic Wikipedia article on Ahmed Urabi; used for entity facts only. It records his birth at Hurriyat Razna near Zagazig into a wealthier fellah family, his Azhar schooling, his military rise, and his office as Minister of War and deputy head of the council of ministers in Mahmud Sami al-Barudi's ministry from 4 February 1882. Its infobox gives his religion as Islam, with no school."
