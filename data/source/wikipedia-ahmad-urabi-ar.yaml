summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد عرابي؛ تُستخدم لوقائع الكيان فقط. توثّق نشأته في قرية هرية رزنة قرب الزقازيق لأسرة فلاحية ميسورة، وتعليمه الأزهري، وصعوده العسكري، وكونه وزيرا للحربية ونائبا لرئيس مجلس النظار في وزارة محمود سامي البارودي من 4 فبراير 1882. يذكر صندوقها دينه «الإسلام» دون مذهب."
  en: "Arabic Wikipedia article on Ahmed Urabi; used for entity facts only. It records his birth at Hurriyat Razna near Zagazig into a wealthier fellah family, his Azhar schooling, his military rise, and his office as Minister of War and deputy head of the council of ministers in Mahmud Sami al-Barudi's ministry from 4 February 1882. Its infobox gives his religion as Islam, with no school."
  es: "Artículo de Wikipedia en árabe sobre Ahmed Urabi; se utiliza únicamente para obtener información sobre la persona. En él se registra su nacimiento en Hurriyat Razna, cerca de Zagazig, en el seno de una familia adinerada, su educación en Al-Azhar, su ascenso militar y su cargo como Ministro de Guerra y subdirector del consejo de ministros en el ministerio de Mahmud Sami al-Barudi desde el 4 de febrero de 1882. Su ficha informativa indica que su religión era el islam, sin mencionar ninguna escuela a la que perteneciera."
  fr: "Article Wikipédia en arabe sur Ahmed Urabi; utilisé uniquement pour les informations le concernant. Il relate sa naissance à Hurriyat Razna, près de Zagazig, au sein d'une famille fellah aisée, ses études à Al-Azhar, son ascension militaire et sa fonction de ministre de la Guerre et de vice-président du Conseil des ministres dans le gouvernement de Mahmoud Sami al-Barudi à partir du 4 février 1882. Son infobox indique qu'il est musulman, sans mention d'école."
