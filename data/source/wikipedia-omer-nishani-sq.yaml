  ar: "مقالة ويكيبيديا الألبانية عن عمر نيشاني (1887-1954)؛ تُستخدم لوقائع الكيان فقط. هي أغنى المقالات بتفاصيل خدمته الطبية ومنفاه، وتروي وفاته برصاصتين قيل إنهما انتحار بينما تشهد شهادة بأنه قُتل."
  en: "Albanian Wikipedia article on Omer Nishani (1887–1954); used for entity facts only. The richest of the articles on his medical service and exile; it reports his death by two gunshots, officially suicide, against testimony that he was killed."
