reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives his medical postings year by year (battalion physician at Gjirokastër and Vlorë 1914; sent to Vienna clinics; municipal physician at Ballsh 1915–1918; Tirana hospital 1920; Durrës municipality 1923–24); two weeks' imprisonment in early 1924 for the attempt on Zog in parliament; exile from December 1924 (Italy, then Austria); co-founder of KONARE in 1925 and director of 'Liria Kombëtare' in Geneva (his name headed the paper until 22 July 1932); political emigrant on Zante, Greece, 1933–1939; member of the Council of State 1940 to 13 January 1944, though he had joined the Front's ranks in August 1943; chairman of the KANÇ presidium and foreign minister 1944–46; deputy 1946–54 and president of the Presidium until 1953; death at Tirana on 26 May 1954 'after two gunshot wounds caused by a firearm, reported as suicide with two shots near the heart', while testimony holds he was killed by the eldest son of M. Peza; the dailies announced his death at 67 briefly, 'after a grave illness'; the Gjirokastër hospital was named after him on 13 October 1989. The article's own lead misprints his death year as 1956 while its body, and every other source, give 1954. It states nothing about his religion — his career was that of a nationalist physician and a non-party head of state in a communist republic."
