reliability_note: "A primary source for the channel's identity, output and reach — not independent corroboration of biography. The identification was completed on 25 October 2026 (a Batch 21 follow-up, run at the founder's direction after Wikidata's data endpoints returned 403 to the batch writer): Wikidata item Q61589's YouTube channel ID statement (P2397) records channel UCS-XgiMGKaiQsZNkgwsDbYg, named in the statement «موقع الشيخ صالح الفوزان» (his official website), and that ID resolves to this channel, whose handle @aforgsa22 derives from his official website's domain (alfawzan.af.org.sa). The channel page showed about 475,000 subscribers on 25 October 2026; Wikidata's own recorded figure is 473,000 at 26 October 2025; platform figures change constantly and are recorded only with their date. A different channel, @dralfawzann (UCi7vzSJrU3beV_6Sdgpowng), presents his lectures under the Kibar al-Ulama project and is NOT the channel Wikidata records for him; it is not registered on his record."
