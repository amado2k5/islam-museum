summary:
  ar: "مقالة ويكيبيديا العربية عن التهامي المزواري الكلاوي (1879–1956)، باشا مراكش وحليف الحماية الفرنسية؛ يعطي صندوق معلوماتها مكان وفاته مراكش، ولا تعطي قيمة للمذهب أو المدرسة الدينية."
  en: "The Arabic Wikipedia article on Thami El Mezouari El Glaoui (1879–1956), Pasha of Marrakesh and ally of the French protectorate; its infobox places his death at Marrakech and gives no school or madhhab value for him."
  es: "El artículo de la Wikipedia en árabe sobre Thami El Mezouari El Glaoui (1879-1956), pachá de Marrakech y aliado del protectorado francés; su ficha informativa sitúa su muerte en Marrakech y no le atribuye ninguna escuela ni madhhab."
  fr: "L'article de Wikipédia en arabe sur Thami El Mezouari El Glaoui (1879–1956), pacha de Marrakech et allié du protectorat français; son infobox situe sa mort à Marrakech et ne lui attribue aucune école ou madhhab."
  ur: "عربی ویکیپیڈیا مضمون تھامی ال میزوری ایل گلووی (1879–1956)، مراکیش کے پاشا اور فرانسیسی محافظوں کے اتحادی؛ اس کے معلوماتی خانے نے اس کی موت ماراکیچ میں کی ہے اور اس کے لیے کوئی مکتب یا مذہب اہمیت نہیں دیتا ہے۔"
  tr: "Fransız himayesi müttefiki ve Marakeş Paşası'nın müttefiki Al-Tihami Al-Mazowari Al-Kalawi (1879–1956) hakkında Arapça Wikipedia makalesi; bilgi kutusu Marakeş'e ölüm yerini verir ve mezhep veya dini okula değer kazandırmaz."
  id: "Artikel Wikipedia berbahasa Arab tentang Al-Tihami Al-Mazowari Al-Kalawi (1879–1956), Pasha Marrakech dan sekutu protektorat Prancis; infobox-nya memberikan Marrakech tempat kematiannya dan tidak memberikan nilai pada sekte atau aliran agama tersebut."
