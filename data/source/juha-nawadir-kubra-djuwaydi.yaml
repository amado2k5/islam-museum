summary:
  en: "A modern Arabic edition of the anecdotes of Juha, edited by Darwish al-Juwaydi and published by al-Dar al-Namudhajiya in Sidon and Beirut. Its introduction collects the early references to Juha and the Turkish Nasreddin Hoca; the anecdotes themselves are not yet read."
  ar: "طبعة عربية حديثة لنوادر جحا، اعتنى بها درويش الجويدي، ونشرتها الدار النموذجية في صيدا وبيروت. تجمع مقدمتها الإشارات المبكرة إلى جحا وإلى نصر الدين الرومي، ولم تُقرأ الحكايات بعد."
