summary:
  en: "A modern Arabic edition of the anecdotes of Juha, edited by Darwish al-Juwaydi and published by al-Dar al-Namudhajiya in Sidon and Beirut. Its introduction collects the early references to Juha and the Turkish Nasreddin Hoca; the anecdotes themselves are not yet read."
  ar: "طبعة عربية حديثة لنوادر جحا، اعتنى بها درويش الجويدي، ونشرتها الدار النموذجية في صيدا وبيروت. تجمع مقدمتها الإشارات المبكرة إلى جحا وإلى نصر الدين الرومي، ولم تُقرأ الحكايات بعد."
  es: "Edición moderna en árabe de las anécdotas de Juha, editada por Darwish al-Juwaydi y publicada por al-Dar al-Namudhajiya en Sidón y Beirut. Su introducción recoge las primeras referencias a Juha y al turco Nasreddin Hoca; las anécdotas en sí aún no han sido leídas."
  fr: "Une édition arabe moderne des anecdotes de Juha, éditée par Darwish al-Juwaydi et publiée par al-Dar al-Namudhajiya à Saïda et Beyrouth. Son introduction rassemble les premières mentions de Juha et du Turc Nasreddin Hoca; les anecdotes elles-mêmes ne sont pas encore lues."
  ur: "جوہا کے قصوں کا ایک جدید عربی ایڈیشن جسے درویش الجویدی نے تدوین کیا ہے اور الدار النمودجیہ نے سائڈن اور بیروت میں شائع کیا ہے۔ اس کا تعارف جوہا اور ترک نصرالدین ہوکا کے ابتدائی حوالہ جات جمع کرتا ہے۔ کہانیاں خود ابھی تک نہیں پڑھی گئی ہیں۔"
  tr: "Juha'nın anekdotlarının modern Arapça baskısı, Darwish Al-Juwaidi tarafından hazırlanmış ve Sidon ile Beyrut'taki Al-Namundiyya Yayınevi tarafından yayımlanmıştır. Girişinde Juha ve Nasr al-Din al-Rumi'ye erken göndermeler yer alır ve hikayeler henüz okunmamıştır."
  id: "Edisi Arab modern dari anekdot Juha, dirawat oleh Darwish Al-Juwaidi, dan diterbitkan oleh Penerbit Al-Namundiyya di Sidon dan Beirut. Pendahuluannya mencakup referensi awal tentang Juha dan Nasr al-Din al-Rumi, dan cerita-ceritanya belum pernah dibaca."
