summary:
  ar: "مقالة ويكيبيديا العربية عن علي عبد الله جابر؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 18 ذي الحجة 1372هـ الموافق 27 أغسطس 1953 بجدة في صندوقها ومقدمتها وقسم نسبها، ووفاته في 14 ديسمبر 2005، وشيوخه ⁦(خليل القاري)⁩ وتلاميذه، وإمامته الرسمية للمسجد الحرام ومحاضرته بجامعة الملك عبد العزيز؛ وصندوقها يترك خانة الفقه فارغة ويعطي العقيدة الإسلام."
  en: "Arabic Wikipedia article on Ali Abdullah Jaber; used for entity facts only. It gives his birth on 18 Dhu al-Hijjah 1372 AH = 27 August 1953 at Jeddah in its infobox, lead and lineage section, his death on 14 December 2005, his teachers (Khalil al-Qari) and students, his official imamate of Masjid al-Haram and his King Abdulaziz University lectureship; its infobox leaves the fiqh field empty and gives his creed as Islam."
  es: "Artículo de Wikipedia en árabe sobre Ali Abdullah Jaber; utilizado únicamente para datos sobre la persona. En su ficha informativa, sección principal y linaje, indica su nacimiento el 18 de Dhu al-Hijjah de 1372 AH = 27 de agosto de 1953 en Jeddah, su muerte el 14 de diciembre de 2005, sus maestros (Khalil al-Qari) y estudiantes, su imanato oficial de Masjid al-Haram y su cátedra en la Universidad Rey Abdulaziz; su ficha informativa deja el campo de fiqh vacío e indica que su credo era el Islam."
  fr: "L'article Wikipédia en arabe consacré à Ali Abdullah Jaber, utilisé uniquement pour les informations biographiques, indique sa naissance le 18 Dhu al-Hijjah 1372 AH (27 août 1953) à Djeddah (dans sa fiche descriptive, section « Généalogie »), son décès le 14 décembre 2005, ses maîtres (Khalil al-Qari) et ses élèves, son imamat officiel de la Masjid al-Haram et son poste de maître de conférences à l'Université du Roi Abdulaziz. La fiche descriptive ne mentionne pas le domaine juridique (fiqh) et indique que sa religion est l'islam."
  ur: "علی عبداللہ جابر پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 18 ذی الحجہ 1372 ہجری = 27 اگست 1953 کو جدہ میں اپنے معلوماتی خانے، سیسہ اور نسب کے حصے میں ان کی ولادت، 14 دسمبر 2005 کو ان کی وفات، ان کے اساتذہ ⁦(خلیل القاری)⁩ اور طلباء، مسجد الحرام کے ان کے سرکاری امام اور کنگ عبدالعزیز یونیورسٹی؛ اس کا معلوماتی خانہ فقہ کو خالی چھوڑ دیتا ہے اور اپنا عقیدہ اسلام دیتا ہے۔"
