summary:
  ar: "مقالة ويكيبيديا العربية عن علي عبد الله جابر؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 18 ذي الحجة 1372هـ الموافق 27 أغسطس 1953 بجدة في صندوقها ومقدمتها وقسم نسبها، ووفاته في 14 ديسمبر 2005، وشيوخه (خليل القاري) وتلاميذه، وإمامته الرسمية للمسجد الحرام ومحاضرته بجامعة الملك عبد العزيز؛ وصندوقها يترك خانة الفقه فارغة ويعطي العقيدة الإسلام."
  en: "Arabic Wikipedia article on Ali Abdullah Jaber; used for entity facts only. It gives his birth on 18 Dhu al-Hijjah 1372 AH = 27 August 1953 at Jeddah in its infobox, lead and lineage section, his death on 14 December 2005, his teachers (Khalil al-Qari) and students, his official imamate of Masjid al-Haram and his King Abdulaziz University lectureship; its infobox leaves the fiqh field empty and gives his creed as Islam."
