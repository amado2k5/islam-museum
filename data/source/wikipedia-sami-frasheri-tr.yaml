summary:
  ar: "مقالة ويكيبيديا التركية عن شمس الدين سامي؛ تُستخدم لوقائع الكيان فقط. تذكر تعليمه الأول في تكية نصيبي طاهر بابا البكتاشية وأنه «واصل الذهاب إلى التكية البكتاشية وفق تقليد الأسرة»، وتؤرخ وفاته في 1 يوليو 1904 خلافا للإنجليزية."
  en: "Turkish Wikipedia article on Şemseddin Sami; used for entity facts only. It records his first education at the Nasibi Tahir Baba Bektashi tekke and that he 'continued attending the Bektashi tekke in line with family tradition', and dates his death to 1 July 1904 against the English article."
  es: "Artículo de la Wikipedia en turco sobre Şemseddin Sami; utilizado únicamente para datos sobre la persona. En él se registra su primera educación en el Nasibi Tahir Baba Bektashi tekke y que «continuó asistiendo al Bektashi tekke siguiendo la tradición familiar», y se fecha su muerte el 1 de julio de 1904, en contraposición al artículo en inglés."
  fr: "Article de Wikipédia en turc sur Şemseddin Sami; utilisé uniquement à des fins d'information sur l'entité. Il mentionne sa première scolarité à la tekke Bektashi de Nasibi Tahir Baba et précise qu'il « continua à fréquenter la tekke Bektashi conformément à la tradition familiale », et date sa mort du 1er juillet 1904, contrairement à l'article en anglais."
  ur: "ترکی ویکیپیڈیا مضمون Şemseddin Sami پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پہلی تعلیم نصیبی طاہر بابا بکتاشی تکے میں درج ہے اور یہ کہ اس نے 'خاندانی روایت کے مطابق بکتاشی تکے میں شرکت جاری رکھی'، اور انگریزی مضمون کے خلاف ان کی وفات کی تاریخ 1 جولائی 1904 ہے۔"
  tr: "Şemseddin Sami hakkında Türkçe Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Nasibi Tahir Baba Bektaşi Tekkeh'teki ilk eğitimini ve \"aile geleneğine göre Bektaşi Tekyeh'e devam ettiğini\" belirtir; ölümünün İngilizce olmaktan farklı olarak 1 Temmuz 1904 tarihli olduğunu belirtir."
  id: "Artikel Wikipedia Turki tentang Shams al-Din Sami hanya digunakan untuk fakta entitas tersebut. Ia menyebutkan pendidikan awalnya di Nasibi Tahir Baba Bektashi Tekkeh dan bahwa ia \"terus menghadiri Bektashi Tekyeh sesuai tradisi keluarga,\" dan kematiannya bertanggal 1 Juli 1904, berbeda dengan bahasa Inggris."
