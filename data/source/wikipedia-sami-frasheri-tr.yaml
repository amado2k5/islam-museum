reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 1 June 1850 at Fraşır (Frashër); first education at the Bektashi Nasibi Tahir Baba Tekke; Zosimea high school at Ioannina, completed 1868; 'Aile geleneği doğrultusunda Bektaşi tekkesine devam etti' — 'in line with family tradition he continued attending the Bektashi tekke' — an upbringing and attendance statement in one source, expressly tied to family tradition; the record cites it in the faith note as practice within a family tradition, not as an attestation of personal adherence naming a school. His novel Taaşşuk-ı Talat ve Fitnat was serialised from November 1872; the article itself corrects the common 'first Turkish novel' label, noting Vartan Pasha's Akabi Hikayesi (1851) precedes it; the Albanian manifesto booklet is 'attributed to Şemseddin Sami in the Albanian national tradition', with Turkish historians generally rejecting the attribution (as the English article also records); he is described as one of the Ottoman intellectuals who reconciled Islam with socialism; died 1 July 1904 at his Erenköy home (against 18 June 1904 in the English and Albanian articles and Wikidata, and 5 June 1904 in the German article — all recorded as conflicts)."
