summary:
  ar: 'سيرة زبيدة جعفر في موقع «تاريخ جنوب أفريقيا على الإنترنت»: وُلدت سنة 1958؛ نالت درجة الصحافة من جامعة رودس سنة 1979؛ اعتُقلت شهرين سنة 1980 بعد كشفها قتل الشرطة للمتظاهرين، واحتُجزت انفراديًا وعُذّبت وضُربت؛ اعتُقلت مجددًا سنة 1986 وهي حامل؛ رأست قسم الإعلام بجامعة كيب الغربية 1987–1989؛ نالت ماجستير الصحافة من كولومبيا سنة 1996؛ وأصبحت محررة الشؤون البرلمانية لمجموعة إندبندنت منذ مايو 1997. حُدّثت السيرة في 23 نوفمبر 2020.'
  en: 'South African History Online''s biography of Zubeida Jaffer: born 1958; Rhodes journalism degree in 1979; detained for two months in 1980 after exposing police killings, held in solitary confinement, tortured and beaten; detained again in 1986 while pregnant; head of the University of the Western Cape''s media department 1987–1989; Columbia master''s in journalism in 1996; group parliamentary editor of Independent Newspapers from May 1997. The record was updated on 23 November 2020.'
