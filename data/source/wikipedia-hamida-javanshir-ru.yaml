summary:
  ar: "مقالة ويكيبيديا الروسية عن غاميدا محمد قلي زاده (جوانشير)؛ تُستخدم لوقائع الكيان فقط. تذكر ميلادها في كهريزلي سنة 1873 (السنة فقط)، ووفاة زوجها الأول داوتداروف سنة 1902، وزواجها من جليل في 15 يونيو 1907، ومستشفاها ومصنع النسيج ومدرستها في كهريزلي (1909)، وأنها من مؤسسات جمعية نساء القوقاز المسلمات الخيرية (1906–1917)، ودفنها في رواق الشرف. لا تذكر شيئًا عن مذهبها."
  en: "Russian Wikipedia article on Gamida Mamedkulizade (Javanshir); used for entity facts only. It gives her birth at Kahrizli in 1873 (year only), her first husband Davatdarov's death in 1902, her marriage to Jalil on 15 June 1907, her Kahrizli hospital, weaving factory and school (1909), her place among the founders of the Caucasian Muslim Women's Benevolent Society (1906–1917), and her burial in the Alley of Honour. It makes no statement about her school of religion."
