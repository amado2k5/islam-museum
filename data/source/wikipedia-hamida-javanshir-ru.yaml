summary:
  ar: "مقالة ويكيبيديا الروسية عن غاميدا محمد قلي زاده ⁦(جوانشير)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر ميلادها في كهريزلي سنة 1873 ⁦(السنة فقط)⁩، ووفاة زوجها الأول داوتداروف سنة 1902، وزواجها من جليل في 15 يونيو 1907، ومستشفاها ومصنع النسيج ومدرستها في كهريزلي (1909)، وأنها من مؤسسات جمعية نساء القوقاز المسلمات الخيرية (1906–1917)، ودفنها في رواق الشرف. لا تذكر شيئًا عن مذهبها."
  en: "Russian Wikipedia article on Gamida Mamedkulizade (Javanshir); used for entity facts only. It gives her birth at Kahrizli in 1873 (year only), her first husband Davatdarov's death in 1902, her marriage to Jalil on 15 June 1907, her Kahrizli hospital, weaving factory and school (1909), her place among the founders of the Caucasian Muslim Women's Benevolent Society (1906–1917), and her burial in the Alley of Honour. It makes no statement about her school of religion."
  es: "Artículo de la Wikipedia rusa sobre Gamida Mamedkulizade (Javanshir); utilizado únicamente para datos biográficos. Menciona su nacimiento en Kahrizli en 1873 (solo el año), la muerte de su primer esposo, Davatdarov, en 1902, su matrimonio con Jalil el 15 de junio de 1907, su hospital, fábrica textil y escuela en Kahrizli (1909), su lugar entre las fundadoras de la Sociedad Benéfica de Mujeres Musulmanas del Cáucaso (1906-1917) y su entierro en el Paseo de Honor. No se menciona su escuela religiosa."
  fr: "L'article de Wikipédia en russe consacré à Gamida Mamedkulizade (Javanshir) ne mentionne que des informations biographiques. Il indique sa naissance à Kahrizli en 1873 (année seulement), le décès de son premier époux, Davatdarov, en 1902, son mariage avec Jalil le 15 juin 1907, la création de son hôpital, de son atelier de tissage et de son école à Kahrizli (1909), son rôle parmi les fondatrices de la Société de bienfaisance des femmes musulmanes du Caucase (1906-1917) et son inhumation dans l'Allée d'honneur. Il ne fait aucune mention de son école religieuse."
  ur: "Gamida Mamedkulizade (Javanshir) پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1873 میں کہریزلی میں اس کی پیدائش ⁦(صرف سال)⁩، 1902 میں اس کے پہلے شوہر دعوت داروف کی موت، 15 جون 1907 کو جلیل سے اس کی شادی، اس کا کہریزلی ہسپتال، بنائی فیکٹری اور اسکول (1909)، کاکیشین مسلم ویمنز بینوولنٹ سوسائٹی کے بانیوں میں اس کا مقام، البروری 1919 میں اس کا مقام عزت یہ اس کے مکتبہ فکر کے بارے میں کوئی بیان نہیں دیتا۔"
