reliability_note: "Read in the museum's session on 20 November 2026. It says that, according to the sources, Hulagu could not stay long in the city because of the smell of the corpses and that the river ran first with blood and then, because of the books thrown into it, the colour of ink, and presents these as reports (rivayet) found in the sources; that al-Musta'sim-Billah was killed after being tortured to reveal the place of his treasure, on 20 Muharram 656 (27 January 1258), with which the Abbasid caliphate of Baghdad passed into history; and that he built beside the caliphal palace in Baghdad a library of two facing buildings called Khizanat al-Musta'sim-Billah, where Safi al-Din al-Urmawi worked, copied books by the caliph's order and held the keys. Used for the statements it makes, each attributed to it; the museum does not treat them as settled where the article itself speaks of reports."
