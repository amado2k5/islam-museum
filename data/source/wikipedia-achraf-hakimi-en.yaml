  ar: "مقالة ويكيبيديا الإنجليزية عن أشرف حكيمي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في خيتافي لأب من وادي زم وأم من القصر الكبير، ومسيرته من ريال مدريد ودورتموند وإنتر إلى باريس سان جيرمان، وإنجازاته مع المغرب في كأس العالم وكأس أمم أفريقيا."
  en: "English Wikipedia article on Achraf Hakimi; used for entity facts only. It recounts his upbringing in Getafe to a father from Oued Zem and a mother from Ksar el-Kebir, his career from Real Madrid, Dortmund and Inter to Paris Saint-Germain, and his record with Morocco at the World Cup and the Africa Cup of Nations."
