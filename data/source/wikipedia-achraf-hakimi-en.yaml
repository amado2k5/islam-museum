summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أشرف حكيمي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في خيتافي لأب من وادي زم وأم من القصر الكبير، ومسيرته من ريال مدريد ودورتموند وإنتر إلى باريس سان جيرمان، وإنجازاته مع المغرب في كأس العالم وكأس أمم أفريقيا."
  en: "English Wikipedia article on Achraf Hakimi; used for entity facts only. It recounts his upbringing in Getafe to a father from Oued Zem and a mother from Ksar el-Kebir, his career from Real Madrid, Dortmund and Inter to Paris Saint-Germain, and his record with Morocco at the World Cup and the Africa Cup of Nations."
  es: "Artículo de la Wikipedia en inglés sobre Achraf Hakimi; utilizado únicamente para obtener información sobre la persona. Narra su infancia en Getafe, con un padre originario de Oued Zem y una madre de Ksar el-Kebir, su trayectoria profesional desde el Real Madrid, el Dortmund y el Inter hasta el Paris Saint-Germain, y su récord con Marruecos en la Copa del Mundo y la Copa Africana de Naciones."
  fr: "Article Wikipédia en anglais sur Achraf Hakimi; utilisé uniquement à des fins d'information sur l'entité. Il relate son enfance à Getafe, fils d'un père originaire d'Oued Zem et d'une mère de Ksar el-Kebir, sa carrière au Real Madrid, à Dortmund et à l'Inter Milan jusqu'au Paris Saint-Germain, ainsi que son parcours avec le Maroc lors de la Coupe du monde et de la Coupe d'Afrique des Nations."
  ur: "اچراف حکیمی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں گیتافے میں اس کی پرورش Oued Zem سے ایک والد اور Ksar El-Kebir سے ہوئی، اس کا کیریئر ریئل میڈرڈ، ڈورٹمنڈ اور انٹر سے پیرس سینٹ جرمین تک، اور ورلڈ کپ اور افریقہ کپ آف نیشنز میں مراکش کے ساتھ اس کے ریکارڈ کا ذکر ہے۔"
  tr: "Achraf Hakimi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Getafe'deki çocukluğunu, Oued Zem'den bir babaya ve Ksar El Kebir'den bir anneye anlatır; Real Madrid, Dortmund ve Inter'den Paris Saint-Germain'e yolculuğunu, Fas ile Dünya Kupası ve Afrika Uluslar Kupası'ndaki başarılarını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Achraf Hakimi; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Getafe kepada seorang ayah dari Oued Zem dan seorang ibu dari Ksar El Kebir, perjalanannya dari Real Madrid, Dortmund, dan Inter ke Paris Saint-Germain, serta pencapaiannya bersama Maroko di Piala Dunia dan Piala Afrika."
