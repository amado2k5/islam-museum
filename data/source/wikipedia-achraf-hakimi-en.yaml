reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Hakimi (birth name Achraf Hakimi Mouh) as born on 4 November 1998 in Madrid to Moroccan parents — his father Mohamed, a street vendor from Oued Zem, his mother Saida, a housewife from Ksar el-Kebir — and raised in Getafe. Career: Real Madrid academy from 2006, Castilla from 2016, first team from 2017 (Champions League 2017-18); Borussia Dortmund on loan 2018-2020 (DFL-Supercup 2019); Inter Milan from 2020 (Serie A 2020-21); Paris Saint-Germain from July 2021 (Champions League 2025, scoring the first goal of the final, and 2026). For Morocco: senior debut on 11 October 2016 aged seventeen; World Cups 2018, 2022 (semi-final) and 2026; Africa Cup of Nations winner 2025 as captain; Olympic bronze at Paris 2024; sixth in the 2025 Ballon d'Or; African Player of the Year 2025. On religion, the article quotes him describing the household he grew up in as 'shaped by Arab and Muslim culture', and its references preserve his September 2025 interview words: 'I don't know if I'm the most important Muslim or Arab figure; there's Salah, too'. It names no school. It also records, in attributed terms, that he was indicted in Paris in March 2023 over a rape allegation which his lawyer says he strongly denies, and that in September 2026 France's highest criminal court rejected his appeal against standing trial."
