  ar: "مقالة ويكيبيديا الإنجليزية عن الله بخش سومرو (1900–1943)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في شكارپور سنة 1900، وتأسيسه حزب اتحاد السند، ورئاسته وزراء السند مرتين (1938–1940 و1941–1942)، وقيادته مؤتمر آزاد المسلم لعموم الهند المعارض لتقسيم الهند، وتنازله عن ألقابه البريطانية سنة 1942، واغتياله في شكارپور في 14 مايو 1943."
  en: "English Wikipedia article on Allah Bux Soomro (1900–1943); used for entity facts only. It recounts his birth at Shikarpur in 1900, his founding of the Sind Ittehad Party, his two terms as Premier of Sindh (1938–1940 and 1941–1942), his leadership of the All India Azad Muslim Conference against the partition of India, his renunciation of his British titles in 1942, and his assassination at Shikarpur on 14 May 1943."
