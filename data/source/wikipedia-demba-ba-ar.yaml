summary:
  ar: "مقالة ويكيبيديا العربية عن دمبا با؛ تُستخدم لوقائع الكيان فقط. تغطي ميلاده سنة 1985 ومسيرته مع الأندية، وتذكر في حياته الشخصية أنه يدين بالإسلام ويصوم رمضان ويؤدي السجود احتفالًا بالأهداف."
  en: "Arabic Wikipedia article on Demba Ba; used for entity facts only. It covers his 1985 birth and his club career, and states in its personal life section that he professes Islam, fasts during Ramadan and performs the sujud when celebrating goals."
  es: "Artículo de Wikipedia en árabe sobre Demba Ba; se utiliza únicamente para obtener información sobre la persona. Cubre su nacimiento en 1985 y su trayectoria en clubes, y en la sección de vida personal indica que profesa el islam, ayuna durante el Ramadán y realiza la postración (sujud) al celebrar sus goles."
  fr: "Article Wikipédia en arabe sur Demba Ba; utilisé uniquement pour les informations le concernant. Il relate sa naissance en 1985 et sa carrière en club, et précise dans sa section « Vie personnelle » qu’il est musulman, qu’il jeûne pendant le Ramadan et qu’il effectue la prosternation (sujud) lorsqu’il célèbre un but."
  ur: "ڈیمبا پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی 1985 کی پیدائش اور اس کے کلب کیرئیر کا احاطہ کیا گیا ہے، اور اس کے ذاتی زندگی کے حصے میں کہا گیا ہے کہ وہ اسلام کا دعویٰ کرتا ہے، رمضان کے روزے رکھتا ہے اور اہداف کا جشن مناتے وقت سجدہ کرتا ہے۔"
  tr: "Damba Ba hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1985'teki doğumunu ve kulüplerdeki kariyerini anlatır; kişisel hayatında İslam'a inandığını, Ramazan'ı oruç tuttuğu ve hedeflerini kutlamak için secde ettiğini belirtir."
  id: "Artikel Wikipedia berbahasa Arab tentang Damba Ba; digunakan hanya untuk fakta entitas. Artikel ini membahas kelahirannya pada tahun 1985 dan kariernya di klub, menyebutkan dalam kehidupan pribadinya bahwa ia adalah penganut Islam, berpuasa Ramadan, dan melakukan sujud untuk merayakan tujuan."
