summary:
  ar: "صفحة تعريف برياض الورزازي في دليل Muslim Agent للمتحدثين؛ تذكر أنه مقيم في تورونتو، وعضو في مجلس الأئمة الكندي، ومدير الشؤون الدينية في ICNA كندا، وأنه يدرّس منذ 1991 ودرّس في معهد المغرب، وتسرد شهاداته: الشريعة والأدب العربي من جامعة عبد الله بالدار البيضاء 1987، وبكالوريوس الإدارة الدولية من غولدن غيت 1994، وماجستير نظم المعلومات الحاسوبية منها 1996."
  en: "Muslim Agent's speaker profile of Riad Ouarzazi; it records him as Toronto-based, a member of the Canadian Council of Imams and Director of Religious Affairs at ICNA Canada, teaching since 1991 and formerly with AlMaghrib Institute, and lists his education: a degree in Islamic Sharia'a and Arabic literature from Abdullah University, Casablanca, in 1987, a bachelor's in international management from Golden Gate University in 1994 and a master's in computer information systems there in 1996."
  es: "Perfil de Riad Ouarzazi en Muslim Agent; en él se le describe como residente de Toronto, miembro del Consejo Canadiense de Imanes y Director de Asuntos Religiosos en ICNA Canadá, profesor desde 1991 y anteriormente en el Instituto AlMaghrib, y se enumeran sus estudios: una licenciatura en Sharia islámica y literatura árabe de la Universidad Abdullah de Casablanca en 1987, una licenciatura en gestión internacional de la Universidad Golden Gate en 1994 y una maestría en sistemas de información informática de la misma universidad en 1996."
  fr: "Le profil de Riad Ouarzazi sur Muslim Agent le décrit comme étant basé à Toronto, membre du Conseil canadien des imams et directeur des affaires religieuses à ICNA Canada, enseignant depuis 1991 et ayant auparavant travaillé à l'Institut AlMaghrib. Il y est également indiqué sa formation: un diplôme en charia islamique et littérature arabe de l'Université Abdullah de Casablanca (1987), une licence en gestion internationale de l'Université Golden Gate (1994) et une maîtrise en systèmes d'information informatique de la même université (1996)."
  ur: "مسلم ایجنٹ ریاض اوارزازی کی اسپیکر پروفائل؛ اس میں اسے ٹورنٹو میں مقیم، کینیڈین کونسل آف امامس کے رکن اور ICNA کینیڈا میں مذہبی امور کے ڈائریکٹر کے طور پر ریکارڈ کیا گیا ہے، جو 1991 سے پڑھا رہے ہیں اور پہلے المغرب انسٹی ٹیوٹ کے ساتھ پڑھ رہے ہیں، اور ان کی تعلیم کی فہرست درج کرتے ہیں: عبداللہ یونیورسٹی، کاسابلانکا سے اسلامی شریعت اور عربی ادب میں ڈگری، 1987 میں، G1949 میں بین الاقوامی مینجمنٹ میں ایک بیچلر اور G1949 کی بین الاقوامی یونیورسٹی سے۔ وہاں 1996 میں کمپیوٹر انفارمیشن سسٹم میں ماسٹرز کیا۔"
