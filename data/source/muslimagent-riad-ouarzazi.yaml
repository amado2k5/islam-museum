summary:
  ar: "صفحة تعريف برياض الورزازي في دليل Muslim Agent للمتحدثين؛ تذكر أنه مقيم في تورونتو، وعضو في مجلس الأئمة الكندي، ومدير الشؤون الدينية في ICNA كندا، وأنه يدرّس منذ 1991 ودرّس في معهد المغرب، وتسرد شهاداته: الشريعة والأدب العربي من جامعة عبد الله بالدار البيضاء 1987، وبكالوريوس الإدارة الدولية من غولدن غيت 1994، وماجستير نظم المعلومات الحاسوبية منها 1996."
  en: "Muslim Agent's speaker profile of Riad Ouarzazi; it records him as Toronto-based, a member of the Canadian Council of Imams and Director of Religious Affairs at ICNA Canada, teaching since 1991 and formerly with AlMaghrib Institute, and lists his education: a degree in Islamic Sharia'a and Arabic literature from Abdullah University, Casablanca, in 1987, a bachelor's in international management from Golden Gate University in 1994 and a master's in computer information systems there in 1996."
