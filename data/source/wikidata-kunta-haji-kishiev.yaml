summary:
  ar: "عنصر ويكيداتا Q2634976 لكونتا حاجي كيشييف؛ يُستخدم للمعرّفات والوقائع المنظّمة فقط. يذكر مولده سنة 1800 ووفاته في 19 مايو 1867 ⁦(اليوم اليولياني تحت نموذج غريغوري)⁩، وقيمته للدين هي «الإسلام» عامة."
  en: "Wikidata item Q2634976 for Kunta-Haji Kishiev; used for identifiers and structured facts only. It gives his birth in 1800 (the Encyclopaedia of Islam end of the attested range) and his death on 19 May 1867 — the Julian day stored under a Gregorian calendar model — and its religion value is Islam in general."
  es: "Elemento de Wikidata Q2634976 para Kunta-Haji Kishiev; se utiliza únicamente para identificadores y datos estructurados. Indica su nacimiento en 1800 (el final del rango documentado en la Enciclopedia del Islam) y su muerte el 19 de mayo de 1867 —día juliano almacenado según un modelo de calendario gregoriano— y su valor religioso es el Islam en general."
  fr: "L'élément Wikidata Q2634976 concerne Kunta-Haji Kishiev; il sert uniquement aux identifiants et aux informations structurées. Il indique sa naissance en 1800 (date limite de l'Encyclopédie de l'Islam pour les données attestées) et son décès le 19 mai 1867 (date julien enregistrée selon le calendrier grégorien). Sa valeur religieuse est « Islam en général »."
  ur: "وکی ڈیٹا آئٹم Q2634976 برائے کنتا-حاجی کیشیف؛ صرف شناخت کنندگان اور ساختی حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1800 میں ان کی پیدائش ⁦(انسائیکلوپیڈیا آف اسلام کی تصدیق شدہ رینج کا اختتام)⁩ اور 19 مئی 1867 کو اس کی موت - جولین ڈے کو گریگورین کیلنڈر ماڈل کے تحت محفوظ کیا گیا - اور اس کی مذہب کی قدر عام طور پر اسلام ہے۔"
