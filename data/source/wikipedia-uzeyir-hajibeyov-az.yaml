reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 26 October 2026 and checked against the recorded revision. Its lead prints the birth as 5 (18) September 1885 at Aghjabadi, and its text preserves the certificate detail and the Great Soviet Encyclopedia's 17 September reading, which the record discloses. The Shia reference in it attaches to the Spiritual Administration that issued the birth certificate — the registering body of his milieu — and the article nowhere calls Hajibeyov himself Shia or names any school for him."
