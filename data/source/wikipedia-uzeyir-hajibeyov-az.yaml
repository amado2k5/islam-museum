summary:
  ar: "مقالة ويكيبيديا الأذربيجانية عن عزير حاجبايوف؛ تُستخدم لوقائع الكيان فقط. أغنى المقالات عنه، وتنقل نص شهادة ميلاده الصادرة عن إدارة مسلمي ما وراء القوقاز الروحية للمذهب الشيعي، بتاريخ 7 ذي الحجة 1302 ⁦(5 سبتمبر 1885 بالتقويم القديم، 17 سبتمبر بالجديد)⁩، وتذكر أن الموسوعة السوفيتية الكبرى تعطي 17 سبتمبر، بينما يعطي صدر المقالة 18 سبتمبر. والمذهب المذكور في الشهادة هو مذهب الإدارة المُصدِرة، لا مذهب حاجبايوف الشخصي."
  en: "Azerbaijani Wikipedia article on Uzeyir Hajibeyov; used for entity facts only. The richest of the articles on him. It quotes his metrical (birth) certificate, issued by the Transcaucasian Muslim Spiritual Administration of the Shia madhhab, recording the birth as 7 Dhu al-Hijja 1302 (5 September 1885 Old Style, 17 September New Style), and notes that the Great Soviet Encyclopedia gives 17 September, while its own lead prints 18 September. The madhhab named in the certificate is that of the issuing administration, not Hajibeyov's personal school."
  es: "Artículo de la Wikipedia en azerbaiyano sobre Uzeyir Hajibeyov; utilizado únicamente para datos sobre la persona. Es el artículo más completo sobre él. Cita su certificado de nacimiento, emitido por la Administración Espiritual Musulmana Transcaucásica de la escuela chiíta, que registra el nacimiento como el 7 de Dhu al-Hijja de 1302 (5 de septiembre de 1885 según el calendario antiguo, 17 de septiembre según el calendario nuevo), y señala que la Gran Enciclopedia Soviética indica el 17 de septiembre, mientras que su propia portada indica el 18 de septiembre. La escuela jurídica mencionada en el certificado es la de la administración emisora, no la escuela personal de Hajibeyov."
  fr: "Article de Wikipédia en azerbaïdjanais sur Uzeyir Hajibeyov; utilisé uniquement pour les informations le concernant. C'est l'article le plus complet à son sujet. Il cite son acte de naissance, délivré par l'Administration spirituelle musulmane transcaucasienne du madhhab chiite, qui indique la date de naissance: le 7 Dhu al-Hijja 1302 (5 septembre 1885 selon l'ancien calendrier, 17 septembre selon le nouveau calendrier). L'article note que la Grande Encyclopédie soviétique mentionne le 17 septembre, tandis que ses propres éditions en première page indiquent le 18 septembre. Le madhhab mentionné sur l'acte est celui de l'administration émettrice, et non l'école personnelle de Hajibeyov."
  ur: "عزیر حاجی بیوف پر آذربائیجانی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس پر سب سے امیر مضامین۔ اس میں اس کے میٹریکل ⁦(پیدائش)⁩ سرٹیفکیٹ کا حوالہ دیا گیا ہے، جسے ٹرانسکاکیشین مسلم اسپرچوئل ایڈمنسٹریشن آف شیعہ مذہب نے جاری کیا ہے، جس میں ولادت کو 7 ذی الحجہ 1302 ⁦(5 ستمبر 1885 پرانا انداز، 17 ستمبر نیو اسٹائل)⁩ درج کیا گیا ہے، اور نوٹ کیا گیا ہے کہ عظیم سوویت انسائیکلوپیڈیا 17 ستمبر، 18 ستمبر کو اپنا لیڈ پرنٹ کرتا ہے۔ سرٹیفکیٹ میں مذھب کا نام جاری کرنے والی انتظامیہ کا ہے، حاجی بیوف کے ذاتی اسکول کا نہیں۔"
