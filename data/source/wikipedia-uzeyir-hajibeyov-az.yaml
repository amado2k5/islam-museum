summary:
  ar: "مقالة ويكيبيديا الأذربيجانية عن عزير حاجبايوف؛ تُستخدم لوقائع الكيان فقط. أغنى المقالات عنه، وتنقل نص شهادة ميلاده الصادرة عن إدارة مسلمي ما وراء القوقاز الروحية للمذهب الشيعي، بتاريخ 7 ذي الحجة 1302 (5 سبتمبر 1885 بالتقويم القديم، 17 سبتمبر بالجديد)، وتذكر أن الموسوعة السوفيتية الكبرى تعطي 17 سبتمبر، بينما يعطي صدر المقالة 18 سبتمبر. والمذهب المذكور في الشهادة هو مذهب الإدارة المُصدِرة، لا مذهب حاجبايوف الشخصي."
  en: "Azerbaijani Wikipedia article on Uzeyir Hajibeyov; used for entity facts only. The richest of the articles on him. It quotes his metrical (birth) certificate, issued by the Transcaucasian Muslim Spiritual Administration of the Shia madhhab, recording the birth as 7 Dhu al-Hijja 1302 (5 September 1885 Old Style, 17 September New Style), and notes that the Great Soviet Encyclopedia gives 17 September, while its own lead prints 18 September. The madhhab named in the certificate is that of the issuing administration, not Hajibeyov's personal school."
