summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن أبي بكر الجوهري؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تعطي تاريخيه ⁦(3 شباط 1833 – 4 حزيران 1895)⁩ ومناصبه ⁦(تمنغكونغ ثم مهراجا ثم سلطان جوهر من 13 شباط 1886)⁩ وخلافته أباه داينغ إبراهيم سنة 1862. لا تحمل بيان ديانة."
  en: "Indonesian Wikipedia article on Abu Bakar of Johor; used for entity facts only. A short article giving his dates (3 February 1833 – 4 June 1895), his offices (Temenggong, then Maharaja, then Sultan of Johor from 13 February 1886) and his succession to his father Daeng Ibrahim in 1862. It carries no religion datum."
  es: "Artículo de la Wikipedia en indonesio sobre Abu Bakar de Johor; utilizado únicamente para datos sobre la persona. Un breve artículo que indica sus fechas (3 de febrero de 1833 - 4 de junio de 1895), sus cargos (Temenggong, luego Maharaja, luego Sultán de Johor desde el 13 de febrero de 1886) y su sucesión a su padre, Daeng Ibrahim, en 1862. No incluye datos sobre su religión."
  fr: "Article de Wikipédia indonésien sur Abu Bakar de Johor; utilisé uniquement à des fins d'information sur l'entité. Ce court article indique ses dates (3 février 1833 – 4 juin 1895), ses fonctions (Temenggong, puis Maharaja, puis Sultan de Johor à partir du 13 février 1886) et sa succession à son père Daeng Ibrahim en 1862. Il ne contient aucune information sur sa religion."
  ur: "جوہر کے ابوبکر پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون جس میں ان کی تاریخیں ⁦(3 فروری 1833 - 4 جون 1895)⁩، ان کے دفاتر ⁦(تیمنگ گونگ، پھر مہاراجہ، پھر 13 فروری 1886 سے جوہر کے سلطان)⁩ اور 1862 میں اپنے والد ڈینگ ابراہیم کی جانشینی۔ اس میں کوئی مذہب نہیں ہے۔"
