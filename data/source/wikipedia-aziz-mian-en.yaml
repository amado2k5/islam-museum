  ar: "مقالة ويكيبيديا الإنجليزية عن القوّال الباكستاني عزيز ميان؛ لوقائع الكيان فقط: مولده في ميروت في 1942، ودراسته في جامعة البنجاب، وقوالياته في ضريح داتا كنج بخش، ورقمه في أطول قوالي تجارية «حشر کے روز یہ پوچھوں گا» ⁦(نحو 115 دقيقة)⁩، ووسام حسن الأداء في 1989، ووفاته في قم في 6 ديسمبر 2000 ودفنه في ملتان؛ وتستند إلى داون وباكستان توداي وإذاعة باكستان."
  en: "English Wikipedia article on the Pakistani qawwal Aziz Mian; entity facts only: birth at Meerut in 1942, study at the University of the Punjab, his qawwali at the shrine of Data Ganj Bakhsh, the record for the longest commercially released qawwali, 'Hashr Ke Roz Yeh Poochhunga' (about 115 minutes), the Pride of Performance in 1989, and death at Qom on 6 December 2000 with burial in Multan; it cites Dawn, Pakistan Today and Radio Pakistan."
