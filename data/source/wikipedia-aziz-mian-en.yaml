summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن القوّال الباكستاني عزيز ميان؛ لوقائع الكيان فقط: مولده في ميروت في 1942، ودراسته في جامعة البنجاب، وقوالياته في ضريح داتا كنج بخش، ورقمه في أطول قوالي تجارية «حشر کے روز یہ پوچھوں گا» ⁦(نحو 115 دقيقة)⁩، ووسام حسن الأداء في 1989، ووفاته في قم في 6 ديسمبر 2000 ودفنه في ملتان؛ وتستند إلى داون وباكستان توداي وإذاعة باكستان."
  en: "English Wikipedia article on the Pakistani qawwal Aziz Mian; entity facts only: birth at Meerut in 1942, study at the University of the Punjab, his qawwali at the shrine of Data Ganj Bakhsh, the record for the longest commercially released qawwali, 'Hashr Ke Roz Yeh Poochhunga' (about 115 minutes), the Pride of Performance in 1989, and death at Qom on 6 December 2000 with burial in Multan; it cites Dawn, Pakistan Today and Radio Pakistan."
  es: "Artículo de la Wikipedia en inglés sobre el qawwal pakistaní Aziz Mian; solo datos sobre la persona: nacimiento en Meerut en 1942, estudios en la Universidad de Punjab, su qawwali en el santuario de Data Ganj Bakhsh, el récord del qawwali lanzado comercialmente más largo, 'Hashr Ke Roz Yeh Poochhunga' (unos 115 minutos), el premio Pride of Performance en 1989 y muerte en Qom el 6 de diciembre de 2000 con entierro en Multan; cita a Dawn, Pakistan Today y Radio Pakistan."
  fr: "Article de Wikipédia en anglais sur le qawwal pakistanais Aziz Mian; faits concernant uniquement l’entité: naissance à Meerut en 1942, études à l’Université du Pendjab, son qawwali au sanctuaire de Data Ganj Bakhsh, le record du qawwali commercialisé le plus long, « Hashr Ke Roz Yeh Poochhunga » (environ 115 minutes), le prix Pride of Performance en 1989 et décès à Qom le 6 décembre 2000 avec inhumation à Multan; il cite Dawn, Pakistan Today et Radio Pakistan."
