reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision; it rests chiefly on Stéphanie Soubrier's article in The Conversation (2021) and her entry in the Encyclopédie d'histoire numérique de l'Europe (EHNE). It gives his birth at Souïma, near Podor, as 1838 or 28 March 1842, and states that his birth date and place are not known with certainty. It attests his Muslim formation and practice — trained in the Muslim religion as a child, he became an instructor in Quranic studies, and in 1872 he led the prayer at the mosque of Bakel wearing a boubou and was reprimanded for it — but it names no school or order for him personally. It gives his death at Kita, Mali, on 24 February 1902."
