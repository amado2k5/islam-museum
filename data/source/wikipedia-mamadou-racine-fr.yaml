  en: "French Wikipedia article 'Mamadou Racine' on Mamadou Racine Sy; used for entity facts only. It recounts his Quranic formation as a child, his service in the Senegalese tirailleurs, his exceptional promotion to captain in 1883, and his death at Kita on 24 February 1902."
