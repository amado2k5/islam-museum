  ar: "مقالة ويكيبيديا العربية عن مصطفى دنيزلي؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 10 نوفمبر 1949 في إزمير ومسيرته مع آلتاي وغلطة سراي لاعبًا وألقابه التدريبية مع الأندية الثلاثة الكبرى، ولا تذكر شيئًا عن ديانته."
  en: "Arabic Wikipedia article on Mustafa Denizli; used for entity facts only. It gives his birth on 10 November 1949 in İzmir, his playing career with Altay and Galatasaray and his title-winning spells with all three Istanbul giants. It makes no statement of his religion."
  es: "Artículo de Wikipedia en árabe sobre Mustafa Denizli; se utiliza únicamente para obtener información sobre el jugador. Indica que nació el 10 de noviembre de 1949 en Esmirna, su trayectoria como jugador en el Altay y el Galatasaray, y sus etapas victoriosas con los tres grandes clubes de Estambul. No menciona su religión."
  fr: "Article Wikipédia en arabe sur Mustafa Denizli; utilisé uniquement pour les informations le concernant. Il indique sa date de naissance, le 10 novembre 1949, à Izmir, sa carrière de joueur à Altay et Galatasaray, ainsi que ses titres de champion avec les trois grands clubs stambouliotes. Sa religion n’est pas mentionnée."
  ur: "مصطفی ڈینیزلی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 10 نومبر 1949 کو ازمیر میں ہوئی، اس کا الٹے اور گالاتاسرائے کے ساتھ کھیل کا کیریئر اور استنبول کے تینوں جنات کے ساتھ اس کا ٹائٹل جیتنے والا جادو۔ اس میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
