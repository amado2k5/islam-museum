summary:
  ar: "مقالة ويكيبيديا العربية الموجزة عن محمد تقي الأميني؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه «عالم هندي مسلم ومؤلف باللغة الأردية» وعميد سابق لكلية اللاهوت في جامعة عليكرة الإسلامية، دون أن تسمّي مذهبا في متنها."
  en: "Arabic Wikipedia stub article on Muhammad Taqi Amini; used for entity facts only. It describes him as an Indian Muslim scholar and Urdu author and a former dean of the Faculty of Theology at Aligarh Muslim University, naming no school in its text."
  es: "Artículo esbozado en la Wikipedia en árabe sobre Muhammad Taqi Amini; se utiliza únicamente para datos sobre la persona. Lo describe como un erudito musulmán indio, autor en urdu y ex decano de la Facultad de Teología de la Universidad Musulmana de Aligarh, sin mencionar ninguna institución educativa en su texto."
  fr: "Ébauche d'article Wikipédia en arabe sur Muhammad Taqi Amini; utilisé uniquement à titre informatif. Il le décrit comme un érudit musulman indien, auteur en ourdou et ancien doyen de la faculté de théologie de l'université musulmane d'Aligarh, sans toutefois préciser d'établissement."
  ur: "محمد تقی امینی پر عربی ویکیپیڈیا کا نامکمل مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں انہیں ایک ہندوستانی مسلمان اسکالر اور اردو مصنف اور علی گڑھ مسلم یونیورسٹی میں فیکلٹی آف تھیالوجی کے سابق ڈین کے طور پر بیان کیا گیا ہے، اس کے متن میں کسی اسکول کا نام نہیں لیا گیا ہے۔"
  tr: "Arapça Vikipedi makalesi, Muhammed Taki Al-Amini hakkında öz; yalnızca varlığın gerçekleri için kullanılmıştır. Onu \"Hintli Müslüman alim ve Urduca yazar\" ve Aligarh İslam Üniversitesi İlahiyat Fakültesi eski dekanı olarak tanımlar, içeriğinde herhangi bir mezhep belirtmemektedir."
  id: "Artikel Wikipedia berbahasa Arab ringkas tentang Muhammad Taqi Al-Amini; digunakan hanya untuk fakta entitas tersebut. Ia menggambarkannya sebagai \"ulama dan penulis Muslim India dalam bahasa Urdu\" serta mantan dekan Fakultas Teologi di Universitas Islam Aligarh, tanpa menyebutkan sekte apapun dalam isinya."
