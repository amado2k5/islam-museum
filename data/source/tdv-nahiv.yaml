summary:
  ar: "مدخل «نحو» في موسوعة TDV الإسلامية لإسماعيل دورموش: علم قواعد التركيب والإعراب في العربية، وقصة تأسيسه على يد أبي الأسود الدؤلي، وطبقات نحويي البصرة والكوفة ثم مدرسة بغداد، وكتب الاختصار والشرح، ونقد ابن مضاء للنحويين، والنحو في المدارس والجامعات الحديثة."
  en: "The TDV İslâm Ansiklopedisi entry on nahiv by İsmail Durmuş: the science of Arabic syntax and i'rab, the founding story of Abu al-Aswad al-Du'ali, the generations of Basra and Kufa grammarians and the later Baghdad school, the epitome and commentary tradition, Ibn Mada's critique of the grammarians, and grammar teaching in the madrasas and modern universities."
  ur: "TDV اسلام دائرۃ المعارف کا مضمون «نحو» اسماعیل دورموش کی تحریر: عربی نحو و اعراب کا علم، ابوالاسود دؤلی کے ہاتھوں تاسیس کی روایت، بصرہ اور کوفہ کے نحویوں کی طبقات اور بغداد مکتب، مختصر و شرح کی روایت، ابن مضاء کی نحویوں پر تنقید، اور مدارس و جامعات میں نحو کی تعلیم۔"
  es: "La entrada de İsmail Durmuş en la TDV İslâm Ansiklopedisi sobre nahiv: la ciencia de la sintaxis árabe y el i'rab, la historia fundacional de Abu al-Aswad al-Du'ali, las generaciones de gramáticos de Basora y Kufa y la posterior escuela de Bagdad, la tradición de epítomes y comentarios, la crítica de Ibn Mada a los gramáticos y la enseñanza de la gramática en las madrasas y universidades modernas."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le nahiv par İsmail Durmuş: la science de la syntaxe arabe et de l'i'rab, l'histoire fondatrice d'Abu al-Aswad al-Du'ali, les générations de grammairiens de Bassora et de Kufa et l'école de Bagdad ultérieure, la tradition de l'épitomé et du commentaire, la critique des grammairiens par Ibn Mada et l'enseignement de la grammaire dans les madrasas et les universités modernes."
  tr: "TDV İslami Ansiklopedisi'nde \"Dilbilgisi\"ne Giriş, İsmail Durmoş: Arapça'da sözdizimsel bilimi ve kuralları ayrıştırma bilimi, Ebu el-Asvad el-Du'ali'nin kuruluş hikayesi, Basra ve Kufa'daki dilbilgisi sınıfları, ardından Bağdat okulu, kısaltma ve yorum kitapları, İbn Muda'nın dilbilgisi eleştirileri ve modern okullar ile üniversitelerdeki dilbilgisi."
  id: "Pengantar \"Tata Bahasa\" dalam Ensiklopedia Islam TDV oleh Ismail Durmoş: Ilmu aturan sintaksis dan penguraian dalam bahasa Arab, kisah pendiriannya oleh Abu al-Aswad al-Du'ali, kelas ahli tata bahasa di Basra dan Kufa lalu sekolah Baghdad, buku ringkasan dan komentar, kritik Ibn Muda terhadap ahli tata bahasa, serta tata bahasa di sekolah dan universitas modern."
