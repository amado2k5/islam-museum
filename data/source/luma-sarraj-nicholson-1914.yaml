  en: "The Kitab al-Luma' fi 'l-Tasawwuf of Abu Nasr al-Sarraj, ed. Reynold A. Nicholson (Leiden: Brill; London: Luzac, 1914, E. J. W. Gibb Memorial Series)"
  ur: "ابو نصر سراج کی کتاب اللمع فی التصوف، تدوین رینولڈ نکلسن ⁦(لائیڈن: بریل، 1914، گب میموریل سلسلہ)⁩"
summary:
  ar: "أول نشرة لكتاب اللمع، أعدها رينولد ألين نيكلسون عن مخطوطتين وطبعت في ليدن سنة 1914 لأمناء وقف جب التذكاري، وفيها النص العربي ثم قسم إنجليزي فيه مقدمة عن حياة السراج وخلاصة لمحتويات الكتاب وكشاف للمصطلحات ومسرد."
  en: "The first edition of al-Luma', prepared by Reynold Alleyne Nicholson from two manuscripts and printed at Leiden in 1914 for the trustees of the E. J. W. Gibb Memorial; it contains the Arabic text followed by an English portion with an introduction on al-Sarraj's life, an abstract of contents, an index of terms and a glossary."
  ur: "کتاب اللمع کا پہلا ایڈیشن، جسے رینولڈ ایلین نکلسن نے دو مخطوطات سے تیار کیا اور گب میموریل کے امنا کے لیے 1914ء میں لائیڈن میں چھپا؛ اس میں عربی متن اور پھر انگریزی حصہ ہے جس میں سراج کی زندگی پر مقدمہ، کتاب کے مشمولات کا خلاصہ، اصطلاحات کا اشاریہ اور فرہنگ ہے۔"
