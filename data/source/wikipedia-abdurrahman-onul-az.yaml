summary:
  ar: "مقالة ويكيبيديا الأذربيجانية عن عبد الرحمن أونول؛ تُستخدم لوقائع الكيان فقط. تفصّل ميلاده في 1 ديسمبر 1973 في بايبورت، وتخرّجه في ثانوية الإمام الخطيب بحي الفاتح في إسطنبول، ودخوله سوق الموسيقى سنة 1990 بألبومه الأول، وقائمة ألبوماته الكثيرة."
  en: "Azerbaijani Wikipedia article on Abdurrahman Önül; used for entity facts only. It details his birth on 1 December 1973 in Bayburt, his graduation from the Fatih Imam Hatip High School in Istanbul, his entry into the music market in 1990 with his first album, and his long list of albums."
  es: "Artículo de la Wikipedia en azerbaiyano sobre Abdurrahman Önül; utilizado únicamente para datos sobre la persona. Detalla su nacimiento el 1 de diciembre de 1973 en Bayburt, su graduación del instituto Fatih Imam Hatip en Estambul, su entrada en el mercado musical en 1990 con su primer álbum y su extensa discografía."
  fr: "Article Wikipédia azerbaïdjanais sur Abdurrahman Önül; utilisé uniquement à des fins d’information sur l’individu. Il détaille sa naissance le 1er décembre 1973 à Bayburt, son diplôme du lycée Fatih Imam Hatip d’Istanbul, son entrée sur le marché musical en 1990 avec son premier album, et sa longue discographie."
  ur: "عبدالرحمن اونول پر آذربائیجانی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1 دسمبر 1973 کو بے برٹ میں ان کی پیدائش، استنبول کے فاتح امام ہتیپ ہائی اسکول سے ان کی گریجویشن، 1990 میں اپنے پہلے البم کے ساتھ میوزک مارکیٹ میں ان کا داخلہ، اور البمز کی طویل فہرست کی تفصیلات درج ہیں۔"
  tr: "Abdul Rahman Önul hakkında Azerbaycan Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1 Aralık 1973'te Bayport'ta doğdu, İstanbul'un Fatih ilçesindeki İmam El-Hatib Lisesi'nden mezun oldu ve 1990 yılında ilk albümü ve birçok albüm listesiyle müzik pazarına girdi."
  id: "Artikel Wikipedia Azerbaijan tentang Abdul Rahman Önul; digunakan hanya untuk fakta entitas. Ia lahir pada 1 Desember 1973 di Bayport, lulus dari SMA Imam Al-Khatib di distrik Fatih, Istanbul, dan memasuki pasar musik pada tahun 1990 dengan album pertamanya dan banyak daftar album."
