reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. The article describes him as a Turkish ilahi (hymn) artist, writer and composer, active since 1990; its biographical lines rest on his official website, and the same birth date, birthplace, school and 1990 debut are carried independently by the Turkish Ministry of Education page registered separately. Its claim that he long held the title of best-selling ilahi artist in Turkey and Europe is the article's own unsourced framing and is carried, if at all, as the article's report, not as a museum fact. No Turkish Wikipedia article on him was found in this build — the editions found are Azerbaijani, Arabic and Kurdish — and that absence is recorded in his provenance. The article names no school or order for him. Read in full on 16 November 2026."
