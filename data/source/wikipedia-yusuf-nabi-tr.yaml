reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The fullest of his three articles, resting on Abdulkadir Erkal's TEİS (Turkish encyclopaedia of names in Islamic literature) entry and Bilkan's study of Nabi's Aleppo years. It gives his birth at Urfa in 1642, the move to Istanbul at twenty-four, the 1672 Kamaniçe campaign and its Fetihname, the 1679 Hajj and Tuhfetü'l-Harameyn, the Hayriyye composed at Aleppo in 1701 for his son Ebulhayr, the mint superintendency and chief registrarship under Baltacı Mehmed Pasha, and his death at Istanbul — 13 April 1712 in its lead, 12/13 April in its body — with burial in Karacaahmet cemetery, Üsküdar. The death day built in the person record is its lead's; the English stub's 10 April is preserved as a rival. Checked 1 November 2026."
