summary:
  ar: "مقالة ويكيبيديا العربية عن محمد علي جناح؛ تؤكد ميلاده في كراتشي في 25 ديسمبر 1876 ووفاته فيها في 11 سبتمبر 1948 ومناصبه، وتصف أسرته بأنها من فرقة البهرة الإسماعيلية وأنه درس تعاليم الإثنا عشرية ومذاهب أهل السنة، وتسمّي فاطمة جناح في إخوته؛ وصندوق معلوماتها يعطي الديانة «مسلم (علماني)» وهو قيمة بنيوية لا تسمّي مذهبًا."
  en: "Arabic Wikipedia article on Muhammad Ali Jinnah; it confirms his birth at Karachi on 25 December 1876, his death there on 11 September 1948 and his offices, describes his family as of the Bohra Ismaili branch and records that he studied the Twelver teachings and the Sunni schools, and names Fatima Jinnah among his siblings; its infobox gives the religion as 'Muslim (secular)', a structured value that names no school."
