summary:
  ar: "مقالة ويكيبيديا العربية عن محمد علي جناح؛ تؤكد ميلاده في كراتشي في 25 ديسمبر 1876 ووفاته فيها في 11 سبتمبر 1948 ومناصبه، وتصف أسرته بأنها من فرقة البهرة الإسماعيلية وأنه درس تعاليم الإثنا عشرية ومذاهب أهل السنة، وتسمّي فاطمة جناح في إخوته؛ وصندوق معلوماتها يعطي الديانة «مسلم ⁦(علماني)⁩» وهو قيمة بنيوية لا تسمّي مذهبًا."
  en: "Arabic Wikipedia article on Muhammad Ali Jinnah; it confirms his birth at Karachi on 25 December 1876, his death there on 11 September 1948 and his offices, describes his family as of the Bohra Ismaili branch and records that he studied the Twelver teachings and the Sunni schools, and names Fatima Jinnah among his siblings; its infobox gives the religion as 'Muslim (secular)', a structured value that names no school."
  es: "Artículo de Wikipedia en árabe sobre Muhammad Ali Jinnah; confirma su nacimiento en Karachi el 25 de diciembre de 1876, su muerte allí el 11 de septiembre de 1948 y sus cargos, describe a su familia como perteneciente a la rama ismaelita Bohra y registra que estudió las enseñanzas duodecimanas y las escuelas sunitas, y nombra a Fatima Jinnah entre sus hermanos; su ficha informativa indica que su religión era \"musulmana (secular)\", un valor estructurado que no menciona ninguna escuela."
  fr: "L'article de Wikipédia en arabe sur Muhammad Ali Jinnah confirme sa naissance à Karachi le 25 décembre 1876, sa mort dans cette même ville le 11 septembre 1948 et ses fonctions, décrit sa famille comme appartenant à la branche ismaélienne Bohra et indique qu'il a étudié les enseignements duodécimains et les écoles sunnites, et mentionne Fatima Jinnah parmi ses frères et sœurs; son infobox indique la religion comme « musulman (laïque) », une valeur structurée qui ne nomme aucune école."
  ur: "محمد علی جناح پر عربی ویکیپیڈیا مضمون؛ یہ 25 دسمبر 1876 کو کراچی میں ان کی پیدائش، 11 ستمبر 1948 کو ان کی موت اور ان کے دفاتر کی تصدیق کرتا ہے، ان کے خاندان کو بوہرہ اسماعیلی شاخ سے بیان کرتا ہے اور ریکارڈ کرتا ہے کہ اس نے بارہویں کی تعلیمات اور سنی مکاتب کی تعلیم حاصل کی، اور اپنے بہن بھائیوں میں فاطمہ جناح کا نام رکھا؛ اس کا معلوماتی باکس مذہب کو 'مسلم ⁦(سیکولر)⁩' کے طور پر دیتا ہے، ایک ایسی ساختی قدر جس کا نام کسی اسکول کا نہیں ہے۔"
  tr: "Muhammed Ali Cinnah hakkında Arapça Vikipedi makalesi, onun 25 Aralık 1876'da Karaçi'de doğduğunu, 11 Eylül 1948'de orada öldüğünü ve görevlerini doğrular. Ailesinin İsmaili Bohra mezhebine ait olduğunu ve On İki İmam öğretileri ile Sünni mezhepleri incelediği belirtilir. Fatima Cinnah'ı kardeşleri arasında sayar; bilgi kutusu ise 'Müslüman (seküler)' dine yapısal bir değer verir ve bir mezhep belirtmez."
  id: "Artikel Wikipedia berbahasa Arab tentang Muhammad Ali Jinnah mengonfirmasi kelahirannya di Karachi pada 25 Desember 1876, kematiannya di sana pada 11 September 1948, dan posisinya. Artikel tersebut menggambarkan keluarganya sebagai anggota sekte Ismaili Bohra dan bahwa ia mempelajari ajaran Dua Belas dan sekte Sunni. Dia menyebut Fatima Jinnah di antara saudara-saudaranya; infobox-nya memberikan nilai struktural pada agama tersebut 'Muslim (sekuler),' yang tidak menyebutkan sekte."
