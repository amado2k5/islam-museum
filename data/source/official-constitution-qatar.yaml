summary:
  ar: "«الدستور الدائم لدولة قطر»، كما يُنشر عند: ميزان، البوابة القانونية لدولة قطر. العنوان ونص المادة 1 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Permanent Constitution of Qatar, as published at: Al Meezan, the Qatar Legal Portal. The address and the wording of Article 1 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Permanent Constitution of Qatar، جیسا کہ Al Meezan, the Qatar Legal Portal پر شائع ہے۔ پتہ اور دفعہ 1 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Permanent Constitution of Qatar, tel que publié à : Al Meezan, the Qatar Legal Portal. L'adresse et le texte (article 1) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Permanent Constitution of Qatar, tal como se publica en: Al Meezan, the Qatar Legal Portal. La dirección y el texto (artículo 1) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Katar Devleti'nin Daimi Anayasası\", Katar Devleti'nin yasal portalı Mizan adresinde yayımlandığı şekliyle. Madde 1'in başlığı ve metni, müze tarafından sağlanan bir araştırma özetinden alınmıştır ve müze sayfayı açmamıştır; kurucu, metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Konstitusi Permanen Negara Qatar,\" sebagaimana diterbitkan di: Mizan, portal hukum Negara Qatar. Judul dan teks Pasal 1 diambil dari ringkasan penelitian yang disediakan oleh museum, dan museum tidak membuka halaman tersebut; pendiri mengizinkan penggunaan teks tersebut seperti yang dinyatakan pada 21 November 2026."
