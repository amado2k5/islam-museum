label: { ar: "علم الفلك — موسوعة TDV الإسلامية ⁦(توفيق فهد)⁩", en: "İLM-i FELEK — TDV İslâm Ansiklopedisi (Tevfik Fehd)" }
summary:
  ar: "مدخل «علم الفلك» في موسوعة TDV الإسلامية بقلم توفيق فهد ⁦(المجلد 22، إسطنبول 2000، ص 126–129)⁩، ويتناول معنى المصطلح وتصنيف العلوم الرياضية، وتاريخ علم الفلك في الإسلام في أربع مراحل، والفرق بينه وبين أحكام النجوم."
  en: "The TDV İslâm Ansiklopedisi entry 'İLM-i FELEK' by Tevfik Fehd (vol. 22, Istanbul 2000, pp. 126–129). It covers the meaning of the term, the classification of the mathematical sciences, the history of astronomy in Islam in four periods, and its separation from astrology."
  es: "La entrada «İLM-i FELEK» de la TDV İslâm Ansiklopedisi, de Tevfik Fehd (vol. 22, Estambul 2000, pp. 126-129), abarca el significado del término, la clasificación de las ciencias matemáticas, la historia de la astronomía en el Islam en cuatro períodos y su separación de la astrología."
  fr: "L’article « İLM-i FELEK » de Tevfik Fehd (vol. 22, Istanbul, 2000, p. 126-129) de la TDV İslâm Ansiklopedisi traite de la signification du terme, de la classification des sciences mathématiques, de l’histoire de l’astronomie en Islam en quatre périodes et de sa distinction avec l’astrologie."
  ur: "TDV İslâm Ansiklopedisi اندراج 'ILM-i FELEK' از تیوفیک فہد ⁦(جلد 22، استنبول 2000، صفحہ 126-129)⁩۔ اس میں اصطلاح کے معنی، ریاضی کے علوم کی درجہ بندی، چار ادوار میں اسلام میں فلکیات کی تاریخ، اور علم نجوم سے اس کی علیحدگی کا احاطہ کیا گیا ہے۔"
  tr: "Tawfiq Fahd'ın TDV İslami Ansiklopedisi'nde (Cilt 22, İstanbul 2000, ss. 126–129) yer alan \"Astronomi\" maddesi, terimin anlamını, matematiksel bilimlerin sınıflandırılmasını, İslam'da astronominin dört aşamalı tarihini ve yıldızların hükümlerinden farkını ele almaktadır."
  id: "Entri \"Astronomi\" dalam Ensiklopedia Islam TDV oleh Tawfiq Fahd (Vol. 22, Istanbul 2000, hlm. 126–129), yang membahas makna istilah tersebut, klasifikasi ilmu matematika, sejarah astronomi dalam Islam dalam empat tahap, dan perbedaan antara istilah tersebut dan aturan bintang."
