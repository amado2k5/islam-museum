summary:
  ar: "مدخل «علم الفلك» في موسوعة TDV الإسلامية بقلم توفيق فهد (المجلد 22، إسطنبول 2000، ص 126–129)، ويتناول معنى المصطلح وتصنيف العلوم الرياضية، وتاريخ علم الفلك في الإسلام في أربع مراحل، والفرق بينه وبين أحكام النجوم."
  en: "The TDV İslâm Ansiklopedisi entry 'İLM-i FELEK' by Tevfik Fehd (vol. 22, Istanbul 2000, pp. 126–129). It covers the meaning of the term, the classification of the mathematical sciences, the history of astronomy in Islam in four periods, and its separation from astrology."
