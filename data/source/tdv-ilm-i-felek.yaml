reliability_note: "Read on 1 November 2026 in the web edition, body text in full (the four periods of Islamic astronomy, the classification of the sciences, the separation from astrology). The printed range 126–129 is taken from the page's own line. The bibliography was read only in part and is not relied on directly. The Ibn Khaldun passage is used as the entry quotes it; the Muqaddima itself was not read for this record. Facts are rewritten in the museum's own words."
