  ar: "كتاب الشيخ أحمد محمد البري، من علماء الأزهر، في ثمانية أصول للتربية والتعليم يستخلصها من القرآن الكريم والسنة النبوية، 224 صفحة؛ نشره مجمع البحوث الإسلامية سنة 1447هـ/2025م مع تصدير من أمينه العام، ويقوم على مخطوطة للمؤلف بكلية اللغة العربية."
  en: "A book by Ahmad Muhammad al-Bari, a scholar of al-Azhar, setting out eight principles of education drawn from the Qur'an and the Prophetic Sunna; 224 pages, published by the Islamic Research Academy in 2025 with a preface by its Secretary-General, based on the author's manuscript held at the Faculty of Arabic Language."
