summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن راسونا سعيد؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في الميلاد والوفاة، وتضيف تعلّمها الدين على عبد الكريم أمر الله ⁦(حاجي رسول)⁩ وتفاصيل تعليمها في سومطرة طوالب ودفنها في مقبرة أبطال كاليباتا."
  en: "Indonesian Wikipedia article on Rasuna Said; used for entity facts only. It agrees with the English article on her birth and death, and adds her study of religion under Abdul Karim Amrullah (Haji Rasul), her schooling at Sumatera Thawalib, and her burial at the Kalibata Heroes' Cemetery."
  es: "Artículo de la Wikipedia en indonesio sobre Rasuna Said; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento y muerte, y añade que estudió religión con Abdul Karim Amrullah (Haji Rasul), que cursó estudios en Sumatera Thawalib y que fue enterrada en el cementerio de los héroes de Kalibata."
  fr: "Article de Wikipédia indonésien sur Rasuna Said; utilisé uniquement pour les informations biographiques. Il concorde avec l’article anglais concernant sa naissance et sa mort, et ajoute ses études religieuses auprès d’Abdul Karim Amrullah (Haji Rasul), sa scolarité à Sumatera Thawalib et son inhumation au cimetière des héros de Kalibata."
  ur: "انڈونیشیائی ویکیپیڈیا مضمون رسونا سید پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش اور موت پر انگریزی مضمون سے اتفاق کرتا ہے، اور عبدالکریم امر اللہ ⁦(حاجی رسول)⁩ کے تحت اس کے مذہب کے مطالعہ، سماترا تھالیب میں اس کی اسکولنگ، اور کالیباٹا ہیروز کے قبرستان میں اس کی تدفین کو شامل کرتا ہے۔"
  tr: "Rasuna Saeed hakkında Endonezya Vikipedi makalesi; sadece varlık bilgileri için kullanılmıştır. Doğum ve ölüm konularında İngilizce ile hemfikirdir, dini bilgisini Abdul Karim Amrullah'a (Hacı Rasul) ekler, Sumatra'daki eğitimi detayları ve Kalipata Kahramanlar Mezarlığı'na defnedilmesini içerir."
  id: "Artikel Wikipedia Indonesia tentang Rasuna Saeed; digunakan hanya untuk fakta entitas. Dia setuju dengan bahasa Inggris tentang kelahiran dan kematian, menambahkan pengetahuan agamanya ke Abdul Karim Amrullah (Haji Rasul), rincian pendidikannya di Sumatra, dan pemakamannya di Pemakaman Pahlawan Kalipata."
