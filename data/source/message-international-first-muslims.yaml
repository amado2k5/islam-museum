summary:
  ar: "مقال مجلة «مسج إنترناشونال» عن أوائل المسلمين في أمريكا: قضى صالح بلالي معظم حياته مستعبدًا في جزيرة سانت سايمنز بجورجيا، بعيدًا عن مولده في ماسينا ⁦(مالي اليوم)⁩ في سبعينيات القرن الثامن عشر؛ خُطف وبِيع وهو في نحو الثانية عشرة، وعمل في البهاما حتى اشترته عائلة كوبر؛ ووصفه ابن مالكه بأنه أشدّ رجل تديّنًا عرفه، وأن آخر كلماته كانت الشهادة."
  en: "Message International magazine article on America's first Muslims: Salih Bilali spent most of his life enslaved on St. Simons Island, Georgia, far from his birthplace in Massina (present-day Mali) in the 1770s; kidnapped and sold at about twelve, he worked in the Bahamas until the Couper family bought him; his owner's son characterised him as the most religious man he had ever known and reported his last words as the shahada, 'Allah is God and Mohammed his prophet'."
  es: "Artículo de la revista Message International sobre los primeros musulmanes de América: Salih Bilali pasó la mayor parte de su vida esclavizado en la isla de St. Simons, Georgia, lejos de su lugar de nacimiento en Massina (actual Malí) en la década de 1770; secuestrado y vendido a los doce años, trabajó en las Bahamas hasta que la familia Couper lo compró; el hijo de su dueño lo describió como el hombre más religioso que jamás había conocido y relató que sus últimas palabras fueron la shahada: \"Alá es Dios y Mahoma su profeta\"."
  fr: "Article du magazine Message International sur les premiers musulmans d'Amérique: Salih Bilali a passé la majeure partie de sa vie en esclavage sur l'île de St. Simons, en Géorgie, loin de son lieu de naissance à Massina (actuel Mali) dans les années 1770; kidnappé et vendu vers l'âge de douze ans, il a travaillé aux Bahamas jusqu'à ce que la famille Couper l'achète; le fils de son propriétaire l'a décrit comme l'homme le plus religieux qu'il ait jamais connu et a rapporté que ses dernières paroles étaient la shahada: « Allah est Dieu et Mohammed son prophète »."
