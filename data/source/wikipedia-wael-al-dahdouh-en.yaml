  ar: "مقال موسوعي عن وائل الدحدوح ⁦(مواليد 1970)⁩، الصحفي الفلسطيني مدير مكتب الجزيرة في غزة منذ 2004."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth on 30 April 1970 in the al-Zaytoun neighbourhood of Gaza City, his career from 1998 (Al-Quds, Voice of Palestine, Al Arabiya, then Al Jazeera from 2004), the killing of his family members in the Gaza war and his own wounding, and his press-freedom awards. It carries no religion content."
  es: "Artículo de enciclopedia editado por la comunidad, recuperado íntegramente en la revisión indicada; en él se detalla su nacimiento el 30 de abril de 1970 en el barrio de al-Zaytoun de la ciudad de Gaza, su trayectoria profesional desde 1998 (Al-Quds, Voz de Palestina, Al Arabiya y, posteriormente, Al Jazeera desde 2004), el asesinato de sus familiares en la guerra de Gaza y sus propias heridas, así como sus premios a la libertad de prensa. No contiene contenido religioso."
  fr: "Article encyclopédique collaboratif, consulté intégralement à la date indiquée; il retrace sa naissance le 30 avril 1970 dans le quartier d’al-Zaytoun à Gaza, sa carrière depuis 1998 (Al-Quds, Voix de la Palestine, Al Arabiya, puis Al Jazeera à partir de 2004), l’assassinat de membres de sa famille pendant la guerre de Gaza et ses propres blessures, ainsi que les prix qu’il a reçus pour sa défense de la liberté de la presse. Il ne contient aucun élément religieux."
  ur: "کمیونٹی میں ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظرثانی پر مکمل طور پر بازیافت کیا گیا؛ اس کی پیدائش 30 اپریل 1970 کو غزہ شہر کے الزیتون محلے میں ہوئی، اس کا کیریئر 1998 سے ⁦(القدس، وائس آف فلسطین، العربیہ، پھر 2004 سے الجزیرہ)⁩، غزہ جنگ میں اس کے خاندان کے افراد کی ہلاکت اور اس کے اپنے زخمی ہونے، اور اس کے پریس فریڈم ایوارڈز۔ اس میں کوئی مذہبی مواد نہیں ہے۔"
