  ar: "مقالة ويكيبيديا الإنجليزية عن طارق علي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في لاهور سنة 1943 في أسرة سياسية، ودراسته في أكسفورد وقيادته اتحاد طلابه، ونشاطه اليساري وكتبه التاريخية والسياسية، وتصريحه عن نفسه بأنه ملحد في مقال له بالغارديان سنة 2006 وفي مقابلة الإندبندنت."
  en: "English Wikipedia article on Tariq Ali; used for entity facts only. It covers his 1943 birth in Lahore into a political family, his Oxford studies and presidency of the Oxford Union, his left-wing activism and his historical and political books, and his self-description as an atheist — in his own 2006 Guardian column and as reported in The Independent's Hunter Davies interview."
