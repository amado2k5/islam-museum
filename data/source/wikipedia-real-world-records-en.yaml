summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شركة ريل وورلد ريكوردز البريطانية؛ لوقائع الكيان فقط: تأسيسها سنة 1989 على يد بيتر غابرييل وأعضاء مهرجان ووماد، وغايتها، ومبيعاتها وعدد ألبوماتها، وفنانوها ومنهم نصرت فتح علي خان؛ تستند إلى ميوزيك آند ميديا وبيلبورد وأول أباوت جاز."
  en: "English Wikipedia article on the British label Real World Records; entity facts only: its founding in 1989 by Peter Gabriel and WOMAD's original members, its aims, its sales and album count, and its artists, among them Nusrat Fateh Ali Khan; it cites Music & Media, Billboard and All About Jazz."
  es: "Artículo de la Wikipedia en inglés sobre el sello británico Real World Records; solo datos sobre la entidad: su fundación en 1989 por Peter Gabriel y los miembros originales de WOMAD, sus objetivos, sus ventas y número de álbumes, y sus artistas, entre ellos Nusrat Fateh Ali Khan; cita a Music & Media, Billboard y All About Jazz."
  fr: "Article de Wikipédia en anglais sur le label britannique Real World Records; informations sur l’entité uniquement: sa fondation en 1989 par Peter Gabriel et les membres originaux de WOMAD, ses objectifs, ses ventes et le nombre d’albums qu’elle a sortis, ainsi que ses artistes, parmi lesquels Nusrat Fateh Ali Khan; l’article cite Music & Media, Billboard et All About Jazz."
  ur: "برطانوی لیبل ریئل ورلڈ ریکارڈز پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: پیٹر گیبریل اور WOMAD کے اصل اراکین کے ذریعہ 1989 میں اس کی بنیاد، اس کے مقاصد، اس کی فروخت اور البم کی تعداد، اور اس کے فنکار، ان میں نصرت فتح علی خان؛ یہ موسیقی اور میڈیا، بل بورڈ اور جاز کے بارے میں سب کا حوالہ دیتا ہے۔"
  tr: "İngiliz şirketi Real World Records hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için: 1989 yılında Peter Gabriel ve Womad festivali üyeleri tarafından kurulan, amacı, satışları, albüm sayısı ve sanatçıları, Nusrat Fateh Ali Khan dahil; Music & Media, Billboard ve All About Jazz temelinde."
  id: "Artikel Wikipedia bahasa Inggris tentang perusahaan Inggris Real World Records; hanya untuk fakta entitas: didirikan pada tahun 1989 oleh Peter Gabriel dan anggota festival Womad, tujuannya, penjualan, jumlah album, dan artis, termasuk Nusrat Fateh Ali Khan; berdasarkan Music & Media, Billboard, dan All About Jazz."
