  ar: "مقالة ويكيبيديا العربية عن سلمان خان التربوي؛ تُستخدم لوقائع الكيان فقط. تقول إنه وُلد ونشأ في نيو أورليانز، وتوثّق أكاديمية خان، ولا تسمّي له مذهبًا."
  en: "Arabic Wikipedia article on Salman Khan the educator; used for entity facts only. It says he was born and raised in New Orleans, documents Khan Academy, and names no school for him."
  es: "Artículo de Wikipedia en árabe sobre Salman Khan como educador; se utiliza únicamente para obtener información sobre su persona. Indica que nació y se crió en Nueva Orleans, documenta la Khan Academy y no menciona ninguna escuela a la que pertenezca."
  fr: "Article Wikipédia en arabe sur Salman Khan, l'éducateur; utilisé uniquement pour des informations factuelles. Il indique qu'il est né et a grandi à La Nouvelle-Orléans, mentionne la Khan Academy, mais ne cite aucune école à son nom."
  ur: "سلمان خان معلم پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا کہنا ہے کہ وہ نیو اورلینز میں پیدا ہوا اور پرورش پایا، خان اکیڈمی کو دستاویز کرتا ہے، اور اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Salman Khan adlı eğitimci hakkında Arapça Wikipedia makalesi; sadece varlığın gerçekleri için kullanılmıştır. New Orleans'ta doğup büyüdüğünü söylüyor ve Khan Akademisi onu belgelemiş, ancak bir tarikat olarak adlandırılmamış."
  id: "Artikel Wikipedia berbahasa Arab tentang Salman Khan sang pendidik; digunakan hanya untuk fakta entitas tersebut. Artikel itu menyatakan dia lahir dan besar di New Orleans, dan Khan Academy mendokumentasikannya, tetapi tidak menyebutkan dia sebagai sekte."
