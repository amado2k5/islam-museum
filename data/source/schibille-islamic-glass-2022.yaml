  ar: "نادين شيبيل، الزجاج الإسلامي في طور الصنع: الأبعاد الزمانية والمكانية ⁦(لوفان، 2022)⁩"
  en: "Nadine Schibille, Islamic Glass in the Making: Chronological and Geographical Dimensions (Leuven University Press, 2022)"
summary:
  ar: "دراسة تحليلية شاملة لتركيب الزجاج الإسلامي المبكر من الأندلس إلى آسيا الوسطى، تعتمد على أكثر من خمسة آلاف تحليل، وتتتبع الانتقال من زجاج النطرون إلى زجاج رماد النباتات، منشورة بالوصول المفتوح."
  en: "A comprehensive analytical study of early Islamic glass compositions from al-Andalus to Central Asia, based on over five thousand analyses, tracing the transition from natron to plant-ash glass; open access."
  es: "Un estudio analítico exhaustivo de las composiciones de vidrio del Islam primitivo, desde al-Ándalus hasta Asia Central, basado en más de cinco mil análisis, que rastrea la transición del vidrio de natrón al vidrio de ceniza vegetal; acceso abierto."
  fr: "Une étude analytique complète des compositions des premiers verres islamiques d'al-Andalus à l'Asie centrale, basée sur plus de cinq mille analyses, retraçant la transition du verre au natron au verre à base de cendres végétales; accès libre."
  ur: "الاندلس سے وسطی ایشیا تک ابتدائی اسلامی شیشے کی ساخت کا ایک جامع تجزیاتی مطالعہ، پانچ ہزار سے زائد تجزیوں پر مبنی، نیٹرون سے پلانٹ ایش شیشے میں منتقلی کا پتہ لگانا؛ کھلی رسائی."
  tr: "Endülüs'ten Orta Asya'ya kadar erken İslami camın bileşimini inceleyen kapsamlı bir analitik çalışma, natron camdan bitkisel kül camına geçişi izleyen beş binden fazla analize dayanıyor ve Open Access'te yayımlanıyor."
  id: "Studi analitis komprehensif tentang komposisi kaca Islam awal dari Andalusia hingga Asia Tengah, berdasarkan lebih dari lima ribu analisis, menelusuri transisi dari kaca natron ke kaca abu tanaman, diterbitkan di Open Access."
