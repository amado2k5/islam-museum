reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 at the recorded revision, fetched by its revision id with the returned id asserted equal. It names his father Sultan Bangon Marajanun Sa Didagen and mother Tuan Bai Sa Buayan, his predecessor as his uncle Sultan Bayao, and Datu Ali, Datu Djimbangan and Datu Piang among his successors; the death month comes from its infobox, with its text adding that he had disappeared from the political scene by 1900 and died two years later. No text in the article names a school for him; the Sunni reading stands in its infobox alone. Its 'List of Sunni Muslim dynasties' see-also is a filing, not evidence."
