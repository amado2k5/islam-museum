summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن داتو أوتو، السلطان الثامن عشر لبويان (حكم 1875–1902)؛ تُستخدم لوقائع الكيان فقط. يعطي مربع معلوماتها تاريخ مولده «غير معروف» ومولده في ساباكان ووفاته في آذار 1902 هناك، ودينه الإسلام السني؛ ويستند متنها إلى قاموس غييرمو التاريخي (2011) واللجنة التاريخية الوطنية الفلبينية ودراسة إيليتو (2007)."
  en: "English Wikipedia article on Datu Uto, the 18th Sultan of Buayan (reigned 1875–1902); used for entity facts only. Its infobox gives his birth date as 'Unknown', his birth at Sapakan, his death in March 1902 there, and his religion as Sunni Islam; its text rests on Guillermo's Historical Dictionary of the Philippines (2011), the National Historical Commission of the Philippines, and Ileto's study of his career (2007)."
