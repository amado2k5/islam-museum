summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن داتو أوتو، السلطان الثامن عشر لبويان ⁦(حكم 1875–1902)⁩؛ تُستخدم لوقائع الكيان فقط. يعطي مربع معلوماتها تاريخ مولده «غير معروف» ومولده في ساباكان ووفاته في آذار 1902 هناك، ودينه الإسلام السني؛ ويستند متنها إلى قاموس غييرمو التاريخي (2011) واللجنة التاريخية الوطنية الفلبينية ودراسة إيليتو (2007)."
  en: "English Wikipedia article on Datu Uto, the 18th Sultan of Buayan (reigned 1875–1902); used for entity facts only. Its infobox gives his birth date as 'Unknown', his birth at Sapakan, his death in March 1902 there, and his religion as Sunni Islam; its text rests on Guillermo's Historical Dictionary of the Philippines (2011), the National Historical Commission of the Philippines, and Ileto's study of his career (2007)."
  es: "Artículo de la Wikipedia en inglés sobre Datu Uto, el 18.º sultán de Buayan (reinó entre 1875 y 1902); utilizado únicamente para datos sobre la entidad. Su ficha informativa indica que su fecha de nacimiento es «Desconocida», que nació en Sapakan, que falleció allí en marzo de 1902 y que profesaba el islam sunita. El texto se basa en el Diccionario histórico de Filipinas de Guillermo (2011), la Comisión Histórica Nacional de Filipinas y el estudio de Ileto sobre su trayectoria (2007)."
  fr: "L'article de Wikipédia en anglais sur Datu Uto, 18e sultan de Buayan (règne: 1875-1902), est utilisé uniquement pour les informations biographiques. Son infobox indique une date de naissance inconnue, un lieu de naissance à Sapakan, un décès survenu à Sapakan en mars 1902 et une religion sunnite. Son texte s'appuie sur le Dictionnaire historique des Philippines de Guillermo (2011), la Commission historique nationale des Philippines et l'étude d'Ileto sur sa carrière (2007)."
  ur: "انگلش ویکیپیڈیا مضمون Datu Uto پر، بویان کے 18ویں سلطان ⁦(حکومت 1875–1902)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے معلوماتی خانے میں ان کی تاریخ پیدائش 'نامعلوم'، ان کی پیدائش ساپکان میں، ان کی وفات مارچ 1902 میں، اور اس کا مذہب بطور سنی اسلام دیا گیا ہے۔ اس کا متن Guillermo's Historical Dictionary of the Philippines (2011)، فلپائن کے قومی تاریخی کمیشن، اور Ileto کے اپنے کیریئر کے مطالعہ (2007) پر منحصر ہے۔"
  tr: "Boyan'ın on sekizinci sultanı Dato Otto hakkında İngilizce Vikipedi makalesi (1875–1902 yılları arasında hüküm sürdü); yalnızca varlık gerçekleri için kullanılmıştır. Bilgi kutusunda doğum tarihi 'bilinmiyor' olarak belirtilmiş, Sabakan'da doğduğu ve Mart 1902'de orada öldüğü belirtilmiş, dini ise Sünni İslam'dır; içeriği Guillermo'nun Tarihsel Sözlüğü (2011), Filipinler Ulusal Tarih Komisyonu ve Ilito Çalışması (2007) temel alınmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Dato Otto, Sultan Boyan kedelapan belas (memerintah 1875–1902); digunakan hanya untuk fakta entitas. Infobox-nya mencantumkan tanggal lahirnya sebagai 'tidak diketahui,' kelahirannya di Sabakan, dan kematiannya di sana pada Maret 1902, serta agamanya adalah Islam Sunni; isinya didasarkan pada Kamus Sejarah Guillermo (2011), Komisi Sejarah Nasional Filipina, dan Studi Ilito (2007)."
