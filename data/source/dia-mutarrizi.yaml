reliability_note: "Read in the museum's session on 20 November 2026. It gives his birth in 538 (1143) at Jurjaniyya, the capital of Khwarazm, and his death there on 8 October 1213; his teaching under pupils of al-Zamakhshari, whence the name 'al-Zamakhshari's successor'; his creed as Mu'tazili and his practice as Hanafi; a stay in Baghdad in 601/1204-5; and describes al-Mughrib fi tartib al-mu'rib as a revision, abridgement and extension of his larger al-Mu'rib fi lughat al-fiqh, explaining the rare words and expressions of Hanafi legal books, with words ordered alphabetically by the first two letters of the root as in al-Zamakhshari's Asas (and by the last letter for roots of more than three letters), with cross-references that are not always easy to follow. Used for entity facts only."
