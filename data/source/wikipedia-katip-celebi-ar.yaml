reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The article (a second Arabic title, «كاتب جلبي», redirects here) rests on his own autobiographical notices in the Sullam al-Wusul and the Mizan al-Haqq, worked up in Orhan Şaik Gökyay's study. It is one of the two texts behind the person record's faith settlement: reporting how he introduces himself, it quotes his own words — Hanafi in madhhab, Ishraqi in orientation. It gives his birth at Constantinople in Dhu'l-Qa'da 1017 AH / February 1609 and pairs his life loosely as 1017–1068 AH; the day-level death date is taken from the Turkish article, the TDV entry and Wikidata instead. Checked 1 November 2026."
