summary:
  ar: "مقالة ويكيبيديا العربية «عزان بن قيس بن عزان» ⁦(المراجعة 74695739)⁩: يعطي صندوقها وفاته سنة 1870 ومسقط مسقط رأسه، بينما يقول متنها إنه قُتل في مطرح في يناير 1871، ويعرض برنامجه: إعادة حكم الشورى وإنهاء التدخل البريطاني وتوحيد عُمان وزنجبار."
  en: "The Arabic Wikipedia article 'Azzan bin Qais bin Azzan' (revision 74695739): its infobox dates his death 1870 and gives Muscat as his birthplace, while its text says he was killed at Muttrah in January 1871; it sets out his programme of restoring shura rule, ending British interference and reuniting Oman and Zanzibar."
  ur: "عربی ویکیپیڈیا کا مضمون «عزان بن قیس بن عزان» ⁦(نظرثانی 74695739)⁩: خانے میں وفات 1870ء اور جائے پیدائش مسقط ہے جبکہ متن میں قتل جنوری 1871ء کو مطرح میں درج ہے؛ ان کا پروگرام شورائی حکومت کی بحالی، برطانوی مداخلت کا خاتمہ اور عمان و زنجبار کا اتحاد بتایا گیا ہے۔"
  es: "El artículo de Wikipedia en árabe «Azzan bin Qais bin Azzan» (revisión 74695739): su ficha informativa fecha su muerte en 1870 y da Mascate como su lugar de nacimiento, mientras que su texto dice que fue asesinado en Muttrah en enero de 1871; expone su programa de restaurar el gobierno de la shura, poner fin a la interferencia británica y reunificar Omán y Zanzíbar."
  fr: "L'article de Wikipédia en arabe « Azzan bin Qais bin Azzan » (révision 74695739): son infobox date sa mort de 1870 et indique Mascate comme lieu de naissance, tandis que son texte dit qu'il a été tué à Muttrah en janvier 1871; il expose son programme de restauration du pouvoir de la shura, de fin de l'ingérence britannique et de réunification d'Oman et de Zanzibar."
