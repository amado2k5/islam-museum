  ar: "مقالة ويكيبيديا العربية «عزان بن قيس بن عزان» (المراجعة 74695739): يعطي صندوقها وفاته سنة 1870 ومسقط مسقط رأسه، بينما يقول متنها إنه قُتل في مطرح في يناير 1871، ويعرض برنامجه: إعادة حكم الشورى وإنهاء التدخل البريطاني وتوحيد عُمان وزنجبار."
  en: "The Arabic Wikipedia article 'Azzan bin Qais bin Azzan' (revision 74695739): its infobox dates his death 1870 and gives Muscat as his birthplace, while its text says he was killed at Muttrah in January 1871; it sets out his programme of restoring shura rule, ending British interference and reuniting Oman and Zanzibar."
