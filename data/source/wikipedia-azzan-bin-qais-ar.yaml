reliability_note: "Arabic Wikipedia, revision 74695739 (wikitext consulted in full). It contradicts itself on the death: the infobox gives 1870 while the text gives January 1871 at Muttrah citing Lorimer's Gazetteer, and its categories carry both 1870 and 1871 death years; the record follows the Lorimer-backed January 1871 of both articles' texts with the English infobox's day. It is the only source giving a birthplace (Muscat, infobox); no source gives a birth year — its infobox says only '19th century'. Its account of his programme (shura rule, ending British interference, reuniting Oman and Zanzibar) and of the imamate he declared as Ibadi mirrors the English article's literature, so the two articles are one family for the faith question. Consulted on 26 October 2026."
