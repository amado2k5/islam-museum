summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مير هزار خان خوسو (تكتب اسمه «خوسا»)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 30 سبتمبر 1929 في قرية غوت أعظم خان بقضاء جعفر آباد في بلوشستان، ودراسته في جامعة السند وجامعة كراتشي، ومسيرته القضائية: قاضيا في محكمة بلوشستان العليا ثم رئيسا لها، وحاكما لبلوشستان مرتين لفترتين قصيرتين، وقاضيا في المحكمة الشرعبة الفدرالية ثم رئيسا لها، ورئاسته المؤقتة للوزراء (مارس–يونيو 2013)، ووفاته في 26 يونيو 2021 في كويته. ولا تسمّي دينا له في متنها."
  en: "English Wikipedia article on Mir Hazar Khan Khoso (it spells the name 'Khosa'); used for entity facts only. It recounts his birth on 30 September 1929 at Goth Azam Khan village, Jaffarabad District, Balochistan, his studies at the University of Sindh and the University of Karachi, his judicial career — judge and then chief justice of the Balochistan High Court, twice briefly governor of Balochistan, judge and then chief justice of the Federal Shariat Court — his caretaker premiership (March–June 2013), and his death on 26 June 2021 at Quetta. Its text names no religion for him."
