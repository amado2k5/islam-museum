summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مير هزار خان خوسو ⁦(تكتب اسمه «خوسا»)⁩؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 30 سبتمبر 1929 في قرية غوت أعظم خان بقضاء جعفر آباد في بلوشستان، ودراسته في جامعة السند وجامعة كراتشي، ومسيرته القضائية: قاضيا في محكمة بلوشستان العليا ثم رئيسا لها، وحاكما لبلوشستان مرتين لفترتين قصيرتين، وقاضيا في المحكمة الشرعبة الفدرالية ثم رئيسا لها، ورئاسته المؤقتة للوزراء ⁦(مارس–يونيو 2013)⁩، ووفاته في 26 يونيو 2021 في كويته. ولا تسمّي دينا له في متنها."
  en: "English Wikipedia article on Mir Hazar Khan Khoso (it spells the name 'Khosa'); used for entity facts only. It recounts his birth on 30 September 1929 at Goth Azam Khan village, Jaffarabad District, Balochistan, his studies at the University of Sindh and the University of Karachi, his judicial career — judge and then chief justice of the Balochistan High Court, twice briefly governor of Balochistan, judge and then chief justice of the Federal Shariat Court — his caretaker premiership (March–June 2013), and his death on 26 June 2021 at Quetta. Its text names no religion for him."
  es: "Artículo de la Wikipedia en inglés sobre Mir Hazar Khan Khoso (donde se escribe \"Khosa\"; utilizado únicamente para datos sobre la persona). Relata su nacimiento el 30 de septiembre de 1929 en la aldea de Goth Azam Khan, distrito de Jaffarabad, Baluchistán; sus estudios en la Universidad de Sindh y la Universidad de Karachi; su carrera judicial —juez y luego presidente del Tribunal Superior de Baluchistán, dos breves períodos como gobernador de Baluchistán, juez y luego presidente del Tribunal Federal de la Sharia—; su mandato como primer ministro interino (marzo-junio de 2013); y su fallecimiento el 26 de junio de 2021 en Quetta. El texto no menciona su religión."
  fr: "L'article de Wikipédia en anglais consacré à Mir Hazar Khan Khoso (orthographié « Khosa ») est utilisé uniquement à titre informatif. Il relate sa naissance le 30 septembre 1929 au village de Goth Azam Khan, dans le district de Jaffarabad (Baloutchistan), ses études à l'Université du Sindh et à l'Université de Karachi, sa carrière judiciaire – juge puis président de la Haute Cour du Baloutchistan, gouverneur du Baloutchistan à deux reprises (de façon brève), juge puis président de la Cour fédérale de la charia –, son intérim au poste de Premier ministre (mars-juin 2013) et son décès le 26 juin 2021 à Quetta. Le texte ne mentionne aucune religion."
  ur: "میر ہزار خان کھوسو پر انگریزی ویکیپیڈیا مضمون ⁦(اس میں 'کھوسہ' نام لکھا گیا ہے)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 30 ستمبر 1929 کو بلوچستان کے ضلع جعفرآباد کے گاؤں گوٹھ اعظم خان میں ان کی پیدائش، سندھ یونیورسٹی اور کراچی یونیورسٹی میں تعلیم، ان کا عدالتی کیریئر - بلوچستان ہائی کورٹ کے جج اور اس وقت کے چیف جسٹس، دو بار مختصر طور پر بلوچستان کے گورنر، جج اور پھر وفاقی شرعی عدالت کے چیف جسٹس رہ چکے ہیں۔ 2013) اور ان کی موت 26 جون 2021 کو کوئٹہ میں ہوئی۔ اس کا متن اس کے لیے کسی مذہب کا نام نہیں رکھتا۔"
  tr: "Mir Hazar Khan Khusu ('Khosa' olarak yazılır) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 30 Eylül 1929'da Belucistan'ın Jafarabad bölgesindeki Ghot Azam Khan köyünde doğduğunu, Sindh Üniversitesi ve Karaçi Üniversitesi'ndeki eğitimini ve yargı kariyerini anlatır: Belucistan Yüksek Mahkemesi'nde yargıç olarak ve ardından başkan olarak, iki kez Belucistan valisi olarak iki kısa dönem, Federal Şeriat Mahkemesi'nde yargıç ve ardından başkanlık, geçici başbakan olarak (Mart–Haziran 2013) ve 26 Haziran 2021'de Kuveyt'te vefat etmiştir. Metinde onun adına bir din yer almamaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Mir Hazar Khan Khusu (dieja sebagai 'Khosa'); hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada 30 September 1929 di desa Ghot Azam Khan di distrik Jafarabad, Balochistan, studinya di Universitas Sindh dan Universitas Karachi, serta karier yudisialnya: sebagai hakim di Pengadilan Tinggi Balochistan dan kemudian sebagai presidennya, dua kali sebagai gubernur Balochistan selama dua periode singkat, sebagai hakim di Pengadilan Syariah Federal dan kemudian sebagai presidennya, menjabat sebagai perdana menteri sementara (Maret–Juni 2013), dan meninggal dunia pada 26 Juni 2021 di Kuwait. Tidak ada agama yang dinamai menurut namanya dalam teksnya."
