reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id. It gives his full name as Nashat Akram Abid Ali Al-Eissa, born 12 September 1984 in Al Hillah, Babylon; a playmaker nicknamed “The Maestro” whose clubs include Al-Shorta, Al-Nassr, Al-Shabab and Al-Ain; in January 2008 he agreed to join Manchester City after a trial but was refused a work permit because Iraq stood outside FIFA’s top 70; he then played for Al-Gharafa and FC Twente, who won the Dutch league in 2009–10, and later in Qatar, Dubai and China. It makes no statement of his religion anywhere in its text, and none of its categories is a religion category."
