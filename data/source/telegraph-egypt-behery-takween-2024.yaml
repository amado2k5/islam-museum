label: { en: "Telegraph Egypt: upheld three-year sentence and Behery's removal from the Takween board (September 2024)", ar: "تليجراف مصر: تأييد حبس بحيري وإبعاده عن مجلس أمناء تكوين" }
summary:
  ar: "تقرير تليجراف مصر في سبتمبر 2024: بعد تأييد حكم حبس إسلام بحيري ثلاث سنوات في قضية شيك، أعلنت مؤسسة تكوين الفكر العربي إبعاده عن مجلس أمنائها الذي كان من أعضائه المؤسسين منذ إطلاقها في مايو 2024."
  en: "A Telegraph Egypt report of September 2024: after a court upheld a three-year sentence against Behery in a cheque case, the Takween Foundation for Arab Thought announced his removal from its board of trustees, of which he had been a founding member since the foundation's launch in May 2024."
  es: "Según un informe de The Telegraph Egypt de septiembre de 2024, después de que un tribunal confirmara una condena de tres años contra Behery en un caso relacionado con cheques, la Fundación Takween para el Pensamiento Árabe anunció su destitución de su junta directiva, de la que había sido miembro fundador desde el lanzamiento de la fundación en mayo de 2024."
  fr: "Un article du Telegraph Egypt de septembre 2024: après qu’un tribunal a confirmé une peine de trois ans de prison contre Behery dans une affaire de chèque, la Fondation Takween pour la pensée arabe a annoncé son éviction de son conseil d’administration, dont il était membre fondateur depuis le lancement de la fondation en mai 2024."
  ur: "ستمبر 2024 کی ٹیلی گراف مصر کی رپورٹ: ایک عدالت نے چیک کیس میں بیہری کے خلاف تین سال کی سزا کو برقرار رکھنے کے بعد، تکوین فاؤنڈیشن فار عرب تھاٹ نے اسے اپنے بورڈ آف ٹرسٹیز سے ہٹانے کا اعلان کیا، جس میں سے وہ مئی 2024 میں فاؤنڈیشن کے آغاز کے بعد سے بانی رکن تھے۔"
