summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن إسماعيل صبري يعقوب ⁦(وُلد 1960)⁩؛ تُستخدم لوقائع الكيان فقط. سيرة كاملة تروي مولده في تيميرلوه ومسيرته القانونية ومناصبه الوزارية ورئاسته لوزراء ماليزيا ومفهومه «أسرة ماليزيا»."
  en: "Indonesian Wikipedia article on Ismail Sabri Yaakob (born 1960); used for entity facts only. A full biography recounting his birth at Temerloh, his legal career, his cabinet posts, his Malaysian premiership and his 'Keluarga Malaysia' concept."
  es: "Artículo de la Wikipedia en indonesio sobre Ismail Sabri Yaakob (nacido en 1960); utilizado únicamente para datos sobre la persona. Una biografía completa que relata su nacimiento en Temerloh, su trayectoria jurídica, sus cargos ministeriales, su mandato como primer ministro de Malasia y su concepto de «Keluarga Malaysia»."
  fr: "Article de Wikipédia indonésien sur Ismail Sabri Yaakob (né en 1960); utilisé uniquement à des fins d’information sur l’entité. Biographie complète retraçant sa naissance à Temerloh, sa carrière juridique, ses fonctions ministérielles, son mandat de Premier ministre de Malaisie et son concept de « Keluarga Malaysia » (famille de Malaisie)."
  ur: "اسماعیل صابری یعقوب ⁦(پیدائش 1960)⁩ پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ تیمرلوہ میں اس کی پیدائش، اس کے قانونی کیریئر، اس کی کابینہ کے عہدوں، اس کی ملائیشیا کی وزیر اعظم اور اس کے 'کیلوارگا ملائیشیا' کے تصور کو بیان کرنے والی ایک مکمل سوانح حیات۔"
