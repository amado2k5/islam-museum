  ur: "فخر الدین علی احمد پر عربی ویکیپیڈیا کا سٹب۔ یہ ان کے ہندوستان کی صدارت (1974-1977) کی تصدیق کرتا ہے، کہ وہ اس پر فائز ہونے والے دوسرے مسلمان تھے، اور اس عہدے پر ان کی موت ہوئی۔"
