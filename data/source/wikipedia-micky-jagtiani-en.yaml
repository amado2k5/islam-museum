summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميكي جاغتياني مؤسس مجموعة لاندمارك: تذكر أنه من أصل سندي، وأنه أسس المجموعة في البحرين سنة 1973، وأن زوجته رينوكا التحقت بها سنة 1993 وتولت رئاستها بعد وفاته في 26 أيار 2023."
  en: "English Wikipedia article on Micky Jagtiani, founder of the Landmark Group; it states that he was of Sindhi heritage, founded the group in Bahrain in 1973, and that his wife Renuka joined the group in 1993 and became its chairwoman after his death on 26 May 2023."
  es: "Artículo de la Wikipedia en inglés sobre Micky Jagtiani, fundador del Landmark Group; en él se afirma que era de ascendencia sindhi, fundó el grupo en Bahréin en 1973 y que su esposa Renuka se unió al grupo en 1993 y se convirtió en su presidenta tras su muerte el 26 de mayo de 2023."
  fr: "L'article de Wikipédia en anglais sur Micky Jagtiani, fondateur du groupe Landmark, indique qu'il était d'origine sindhi, qu'il a fondé le groupe à Bahreïn en 1973 et que son épouse Renuka a rejoint le groupe en 1993 et en est devenue la présidente après son décès le 26 mai 2023."
  ur: "لینڈ مارک گروپ کے بانی مکی جگٹیانی پر انگریزی ویکیپیڈیا کا مضمون؛ اس میں کہا گیا ہے کہ وہ سندھی ورثے سے تعلق رکھتے تھے، اس نے 1973 میں بحرین میں اس گروپ کی بنیاد رکھی، اور ان کی اہلیہ رینوکا نے 1993 میں اس گروپ میں شمولیت اختیار کی اور 26 مئی 2023 کو ان کی موت کے بعد اس کی چیئر وومن بن گئیں۔"
  tr: "Landmark Group'un kurucusu Mickey Jagtiani hakkında İngilizce Wikipedia makalesi: Sindhi kökenli olduğu, grubu 1973'te Bahreyn'de kurduğu ve eşi Renuka'nın 1993'te katıldığı ve 26 Mayıs 2023'teki ölümünden sonra liderliği devraldığı belirtilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Mickey Jagtiani, pendiri Landmark Group: Disebutkan bahwa ia berasal dari Sindhi, mendirikan grup ini di Bahrain pada tahun 1973, dan bahwa istrinya Renuka bergabung pada tahun 1993 serta mengambil alih kepemimpinan setelah kematiannya pada 26 Mei 2023."
