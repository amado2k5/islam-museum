reliability_note: "A mirror crawl of his public X profile — a grade below a vidIQ or direct platform read, and recorded with exactly that caveat wherever the figure is used, as the wave-200 record of Salim A. Fillah recorded his mirror-crawl figure. The wave-201 harvest read several agreeing TwStalker/Instalker mirrors on 15 November 2026 and recorded 336,000 followers for @bachtiarnasir from crawls of about 9-12 November 2026 (older mirrors read 337,000-340,000); no fresh dated count could be pinned for his own YouTube or Instagram in this build, and the roughly 311,000 YouTube figure from a snippet crawled about May 2026 is not relied on."
