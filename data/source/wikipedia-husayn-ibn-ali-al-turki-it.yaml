summary:
  ar: "مقالة ويكيبيديا الإيطالية عن الحسين بن علي التركي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بالكاف في 20 نيسان 1675 — دقة يوم لا يؤيدها نص ثانٍ — ووفاته بالقيروان في 13 أيار 1740، وبيعته في 12 تموز 1705 وتسلمه الحكم في 15 تموز."
  en: "Italian Wikipedia article on Al-Husayn I ibn Ali al-Turki; used for entity facts only. It gives his birth at Le Kef on 20 April 1675 — a day precision no second text supports, not built in the person record — his proclamation on 12 July 1705 and taking office on 15 July, and his execution at Kairouan on 13 May 1740, agreeing with the French and Spanish articles on the death day against the English article's 13 September."
  es: "Artículo de la Wikipedia en italiano sobre Al-Husayn I ibn Ali al-Turki; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Le Kef el 20 de abril de 1675 —una precisión de fecha que ningún otro texto respalda, no consta en el registro de la persona—, su proclamación el 12 de julio de 1705 y su toma de posesión el 15 de julio, y su ejecución en Kairouan el 13 de mayo de 1740, coincidiendo con los artículos en francés y español en cuanto al día de su muerte, frente al 13 de septiembre que indica el artículo en inglés."
  fr: "L'article de Wikipédia en italien sur Al-Husayn I ibn Ali al-Turki, utilisé uniquement pour les informations relatives à l'entité, indique sa naissance à Le Kef le 20 avril 1675 (une date précise non confirmée par d'autres sources et non mentionnée dans la fiche descriptive), sa proclamation le 12 juillet 1705 et son entrée en fonction le 15 juillet, ainsi que son exécution à Kairouan le 13 mai 1740. Cette date concorde avec les articles français et espagnols concernant le jour de son décès, contrairement à l'article anglais qui mentionne le 13 septembre."
  ur: "الحسین اول ابن علی الترکی پر اطالوی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے 20 اپریل 1675 کو لی کیف میں اس کی پیدائش کی - ایک دن کی درستگی جس کی کوئی دوسری عبارت کی حمایت نہیں کرتا ہے، شخصی ریکارڈ میں نہیں بنایا گیا ہے - اس کا اعلان 12 جولائی 1705 کو ہوا اور 15 جولائی کو عہدہ سنبھالا، اور 13 مئی 1740 کو کیروآن میں اس کی پھانسی، فرانسیسی اور ہسپانوی مضامین سے اتفاق کرتے ہوئے، 3 ستمبر 1740 کو انگریزی آرٹیکل کے خلاف فرانسیسی اور ہسپانوی آرٹیکلز سے اتفاق کیا۔"
  tr: "Al-Hüseyin bin Ali El-Turki hakkında İtalyan Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 20 Nisan 1675'te Kef'te verir — ikinci bir metinle desteklenmeyen bir tarih — 13 Mayıs 1740'ta Kairouan'daki ölümünü, 12 Temmuz 1705'te bağlılık yemini ve 15 Temmuz'da iktidara geldiğini belirtir."
  id: "Artikel Wikipedia Italia tentang Al-Husayn ibn Ali Al-Turki; digunakan hanya untuk fakta entitas tersebut. Artikel ini mencantumkan kelahirannya di Kef pada 20 April 1675 — tanggal yang tidak didukung oleh teks kedua — kematiannya di Kairouan pada 13 Mei 1740, sumpah setia pada 12 Juli 1705, dan pengambilalihan kekuasaannya pada 15 Juli."
