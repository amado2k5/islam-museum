summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سلطنة هوبيو، التي أسسها يوسف علي كيناديد بين سبعينيات القرن التاسع عشر وسنة 1884، وصارت محمية إيطالية سنة 1889 ودُمجت أخيرا في الصومال الإيطالي سنة 1927؛ تصف إدارتها المركزية وجيشها وسجلاتها المكتوبة، وتروي نشأتها من انشقاق داخل سلطنة ماجرتين وعودة كيناديد من المنفى في اليمن."
  en: "English Wikipedia article on the Sultanate of Hobyo, established by Yusuf Ali Kenadid between the 1870s and 1884, an Italian protectorate from 1889 and finally integrated into Italian Somaliland in 1927; it describes the sultanate's centralised administration, professional army and written records, and recounts its origin in a rift within the Majeerteen Sultanate and Kenadid's return from exile in Yemen."
  es: "Artículo de la Wikipedia en inglés sobre el Sultanato de Hobyo, establecido por Yusuf Ali Kenadid entre las décadas de 1870 y 1884, protectorado italiano desde 1889 y finalmente integrado en la Somalia italiana en 1927; describe la administración centralizada del sultanato, su ejército profesional y sus registros escritos, y relata su origen en una escisión dentro del Sultanato de Majeerteen y el regreso de Kenadid del exilio en Yemen."
  fr: "L'article de Wikipédia en anglais sur le sultanat de Hobyo, établi par Yusuf Ali Kenadid entre les années 1870 et 1884, protectorat italien à partir de 1889 et finalement intégré à la Somalie italienne en 1927; il décrit l'administration centralisée du sultanat, son armée professionnelle et ses archives écrites, et relate son origine dans une scission au sein du sultanat de Majeerteen et le retour de Kenadid de son exil au Yémen."
  ur: "1870 اور 1884 کے درمیان یوسف علی کناڈیڈ کی طرف سے قائم کردہ سلطنت ہوبیو پر انگریزی ویکیپیڈیا کا مضمون، 1889 سے ایک اطالوی محافظ ریاست اور آخر کار 1927 میں اطالوی صومالی لینڈ میں ضم ہو گیا۔ اس میں سلطنت کی مرکزی انتظامیہ، پیشہ ورانہ فوج اور تحریری ریکارڈ کی وضاحت کی گئی ہے، اور اس کی اصلیت کو مجیرتین سلطنت اور کناڈید کی یمن میں جلاوطنی سے واپسی کے اندر پیدا ہونے والے اختلافات کو بیان کیا گیا ہے۔"
