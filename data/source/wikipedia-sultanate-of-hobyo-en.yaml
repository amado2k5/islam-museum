  ar: "مقالة ويكيبيديا الإنجليزية عن سلطنة هوبيو، التي أسسها يوسف علي كيناديد بين سبعينيات القرن التاسع عشر وسنة 1884، وصارت محمية إيطالية سنة 1889 ودُمجت أخيرا في الصومال الإيطالي سنة 1927؛ تصف إدارتها المركزية وجيشها وسجلاتها المكتوبة، وتروي نشأتها من انشقاق داخل سلطنة ماجرتين وعودة كيناديد من المنفى في اليمن."
  en: "English Wikipedia article on the Sultanate of Hobyo, established by Yusuf Ali Kenadid between the 1870s and 1884, an Italian protectorate from 1889 and finally integrated into Italian Somaliland in 1927; it describes the sultanate's centralised administration, professional army and written records, and recounts its origin in a rift within the Majeerteen Sultanate and Kenadid's return from exile in Yemen."
