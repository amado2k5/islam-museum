summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن السير محمد فتحي أحمد إبراهيم «مو إبراهيم» ⁦(ولد 3 أيار 1946)⁩، رجل الأعمال السوداني البريطاني مؤسس شركة سيلتل التي باعها سنة 2005 بمبلغ 3.4 مليار دولار، ومؤسس مؤسسة مو إبراهيم ومؤشرها وجائزتها للقيادة الأفريقية؛ لا يرد في متنها أي ذكر لدينه."
  en: "English Wikipedia article on Sir Mohammed Fathi Ahmed Ibrahim, 'Mo Ibrahim' (born 3 May 1946), the Sudanese-British businessman who founded Celtel, sold it in 2005 for $3.4 billion, and founded the Mo Ibrahim Foundation, its Index of African Governance and its Prize for Achievement in African Leadership; the article nowhere mentions his religion."
  es: "Artículo de la Wikipedia en inglés sobre Sir Mohammed Fathi Ahmed Ibrahim, 'Mo Ibrahim' (nacido el 3 de mayo de 1946), el empresario sudanés-británico que fundó Celtel, la vendió en 2005 por 3.400 millones de dólares y fundó la Fundación Mo Ibrahim, su Índice de Gobernanza Africana y su Premio al Logro en el Liderazgo Africano; el artículo no menciona en ningún momento su religión."
  fr: "L'article de Wikipédia en anglais sur Sir Mohammed Fathi Ahmed Ibrahim, « Mo Ibrahim » (né le 3 mai 1946), l'homme d'affaires soudano-britannique qui a fondé Celtel, l'a vendue en 2005 pour 3,4 milliards de dollars, et a fondé la Fondation Mo Ibrahim, son Index de la gouvernance africaine et son Prix pour l'excellence du leadership africain; l'article ne mentionne nulle part sa religion."
  ur: "سر محمد فاتح احمد ابراہیم پر انگریزی ویکیپیڈیا کا مضمون، 'مو ابراہیم' ⁦(پیدائش 3 مئی 1946)⁩، سوڈانی-برطانوی تاجر جس نے سیلٹیل کی بنیاد رکھی، اسے 2005 میں 3.4 بلین ڈالر میں فروخت کیا، اور مو ابراہیم فاؤنڈیشن کی بنیاد رکھی، اس کا افریقی گورننس کا اشاریہ اور اس کا انعام برائے کامیابی افریقہ میں؛ مضمون میں کہیں بھی ان کے مذہب کا ذکر نہیں ہے۔"
