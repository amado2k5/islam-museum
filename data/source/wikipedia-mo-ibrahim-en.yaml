  ar: "مقالة ويكيبيديا الإنجليزية عن السير محمد فتحي أحمد إبراهيم «مو إبراهيم» ⁦(ولد 3 أيار 1946)⁩، رجل الأعمال السوداني البريطاني مؤسس شركة سيلتل التي باعها سنة 2005 بمبلغ 3.4 مليار دولار، ومؤسس مؤسسة مو إبراهيم ومؤشرها وجائزتها للقيادة الأفريقية؛ لا يرد في متنها أي ذكر لدينه."
