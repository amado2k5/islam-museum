summary:
  ar: "«الإعلان الدستوري الليبي، 2011»، كما يُنشر عند: المجلس الأعلى للقضاء في ليبيا. العنوان ونص المادة 1 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Constitutional Declaration of Libya, 2011, as published at: Supreme Judicial Council of Libya. The address and the wording of Article 1 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Constitutional Declaration of Libya, 2011، جیسا کہ Supreme Judicial Council of Libya پر شائع ہے۔ پتہ اور دفعہ 1 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Constitutional Declaration of Libya, 2011, tel que publié à : Supreme Judicial Council of Libya. L'adresse et le texte (article 1) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Constitutional Declaration of Libya, 2011, tal como se publica en: Supreme Judicial Council of Libya. La dirección y el texto (artículo 1) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
