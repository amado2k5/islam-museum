summary:
  ar: "مقال مجلة «إميريتس وومان» عن صعود اللياقة النسائية الخالصة في الإمارات وخارجها؛ يذكر أن المدربة الشخصية زهرة بيدرسن، وهي مسلمة بريطانية، أسست سنة 2014 شركة «الحجاب الصحي» (The Healthy Hijab) لتدريب النساء في بيئات نسائية خالصة أو في منازلهن، مراعاةً لحاجة النساء المحتشمات إلى الخصوصية."
  en: "Emirates Woman's article on the rise of female-only fitness in the UAE and beyond; it records that personal trainer Zahra Pedersen, a British Muslim, set up The Healthy Hijab in 2014, a company allowing women to train in women-only environments or in their own homes, after seeing that the industry did not cater to modest women's need for privacy."
title: "No Boys Allowed: The Rise Of Female-Only Fitness In The UAE And Beyond"
