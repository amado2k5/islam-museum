summary:
  ar: "مقال مجلة «إميريتس وومان» عن صعود اللياقة النسائية الخالصة في الإمارات وخارجها؛ يذكر أن المدربة الشخصية زهرة بيدرسن، وهي مسلمة بريطانية، أسست سنة 2014 شركة «الحجاب الصحي» (The Healthy Hijab) لتدريب النساء في بيئات نسائية خالصة أو في منازلهن، مراعاةً لحاجة النساء المحتشمات إلى الخصوصية."
  en: "Emirates Woman's article on the rise of female-only fitness in the UAE and beyond; it records that personal trainer Zahra Pedersen, a British Muslim, set up The Healthy Hijab in 2014, a company allowing women to train in women-only environments or in their own homes, after seeing that the industry did not cater to modest women's need for privacy."
  es: "Un artículo de Emirates Woman sobre el auge del fitness exclusivamente femenino en los Emiratos Árabes Unidos y otros países relata que la entrenadora personal Zahra Pedersen, una musulmana británica, fundó The Healthy Hijab en 2014, una empresa que permite a las mujeres entrenar en entornos exclusivos para mujeres o en sus propios hogares, tras constatar que el sector no satisfacía la necesidad de privacidad de las mujeres que visten con modestia."
  fr: "L'article d'Emirates Woman sur l'essor du fitness réservé aux femmes aux Émirats arabes unis et au-delà; il relate que la coach sportive Zahra Pedersen, une musulmane britannique, a créé The Healthy Hijab en 2014, une entreprise permettant aux femmes de s'entraîner dans des environnements réservés aux femmes ou à leur domicile, après avoir constaté que le secteur ne répondait pas au besoin d'intimité des femmes pudiques."
  ur: "متحدہ عرب امارات اور اس سے آگے خواتین کی فٹنس کے عروج پر ایمریٹس ویمن کا مضمون؛ یہ ریکارڈ کرتا ہے کہ ذاتی ٹرینر زہرہ پیڈرسن، ایک برطانوی مسلمان، نے 2014 میں صحت مند حجاب قائم کیا، ایک کمپنی جو خواتین کو صرف خواتین کے ماحول میں یا ان کے اپنے گھروں میں تربیت دینے کی اجازت دیتی ہے، یہ دیکھنے کے بعد کہ یہ صنعت خواتین کی پرائیویسی کی معمولی ضرورت کو پورا نہیں کرتی ہے۔"
title: "No Boys Allowed: The Rise Of Female-Only Fitness In The UAE And Beyond"
