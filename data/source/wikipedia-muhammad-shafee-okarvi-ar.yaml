summary:
  ar: "مقالة ويكيبيديا العربية عن محمد شفيع أوكاروي ⁦(2 شباط 1930 – 24 نيسان 1984)⁩، القائد الديني وخطيب باكستان؛ تذكر في صدرها ألقابه ومنها «مجدد مسلك أهل السنة» و«خطيب باكستان الأعظم»، وأنه ألقى أكثر من 18,000 خطاب في 38 عاماً، وأن مريديه صاروا بالآلاف في العالم أجمع، وأنه أسس باسم جماعة أهل السنة مجالس المحرم ومواكب عيد ميلاد النبي في كراتشي."
  en: "The Arabic Wikipedia article on Muhammad Shafee Okarvi (2 February 1930 – 24 April 1984), the Pakistani religious leader and orator; its lead gives his titles, among them 'reviver of the maslak of Ahl al-Sunna' and 'greatest orator of Pakistan', states that he delivered over 18,000 speeches in 38 years and gained thousands of murids across the world, and records that he started the Muharram gatherings and Mawlid processions in Karachi in the name of Jamaat Ahle Sunnat."
  es: "El artículo de Wikipedia en árabe sobre Muhammad Shafee Okarvi (2 de febrero de 1930 - 24 de abril de 1984), líder religioso y orador pakistaní, comienza mencionando sus títulos, entre ellos \"revividor del maslak de Ahl al-Sunna\" y \"el orador más grande de Pakistán\", y afirma que pronunció más de 18.000 discursos en 38 años y que ganó miles de murids en todo el mundo. Asimismo, registra que inició las reuniones de Muharram y las procesiones de Mawlid en Karachi en nombre de Jamaat Ahle Sunnat."
  fr: "L'article de Wikipédia en arabe sur Muhammad Shafee Okarvi (2 février 1930 – 24 avril 1984), le chef religieux et orateur pakistanais; son introduction donne ses titres, parmi lesquels « raviveur du maslak d'Ahl al-Sunna » et « plus grand orateur du Pakistan », indique qu'il a prononcé plus de 18 000 discours en 38 ans et a gagné des milliers de murids à travers le monde, et rapporte qu'il a lancé les rassemblements de Muharram et les processions du Mawlid à Karachi au nom de Jamaat Ahle Sunnat."
