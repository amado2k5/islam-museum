summary:
  ar: "مقالة ويكيبيديا العربية عن محمد شفيع أوكاروي (2 شباط 1930 – 24 نيسان 1984)، القائد الديني وخطيب باكستان؛ تذكر في صدرها ألقابه ومنها «مجدد مسلك أهل السنة» و«خطيب باكستان الأعظم»، وأنه ألقى أكثر من 18,000 خطاب في 38 عاماً، وأن مريديه صاروا بالآلاف في العالم أجمع، وأنه أسس باسم جماعة أهل السنة مجالس المحرم ومواكب عيد ميلاد النبي في كراتشي."
  en: "The Arabic Wikipedia article on Muhammad Shafee Okarvi (2 February 1930 – 24 April 1984), the Pakistani religious leader and orator; its lead gives his titles, among them 'reviver of the maslak of Ahl al-Sunna' and 'greatest orator of Pakistan', states that he delivered over 18,000 speeches in 38 years and gained thousands of murids across the world, and records that he started the Muharram gatherings and Mawlid processions in Karachi in the name of Jamaat Ahle Sunnat."
