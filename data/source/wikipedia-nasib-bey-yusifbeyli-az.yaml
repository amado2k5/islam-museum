summary:
  ar: "مقالة ويكيبيديا الأذربيجانية عن نصيب بك يوسف بكلي؛ تُستخدم لوقائع الكيان فقط. سيرة مفصلة لمولده في غنجه سنة 1881 وتعليمه وصحافته وحزبه وحكومتيه، وتذكر أن بعض المصادر تجعل مقتله في أوائل مايو 1920 في قضاء كوردمير."
  en: "Azerbaijani Wikipedia article on Nasib bey Yusifbeyli; used for entity facts only. A detailed biography of his 1881 Ganja birth, education, journalism, party and two cabinets; it records that some sources place his killing in early May 1920 in Kurdamir district."
  es: "Artículo de la Wikipedia en azerbaiyano sobre Nasib bey Yusifbeyli; utilizado únicamente para datos sobre la persona. Una biografía detallada de su nacimiento en Ganja en 1881, su educación, su trayectoria periodística, su partido y sus dos gabinetes; registra que algunas fuentes sitúan su asesinato a principios de mayo de 1920 en el distrito de Kurdamir."
  fr: "Article Wikipédia azerbaïdjanais sur Nasib bey Yusifbeyli; utilisé uniquement à des fins d’information. Biographie détaillée de sa naissance à Gandja en 1881, de ses études, de son parcours journalistique, de son appartenance à un parti et de ses deux mandats ministériels; l’article indique que certaines sources situent son assassinat début mai 1920 dans le district de Kurdamir."
  ur: "آذربائیجانی ویکیپیڈیا کا مضمون Nasib bey Yusifbeyli پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ان کی 1881 گنجا پیدائش، تعلیم، صحافت، پارٹی اور دو کابینہ کی تفصیلی سوانح عمری۔ اس میں درج ہے کہ کچھ ذرائع نے مئی 1920 کے اوائل میں کردامیر ضلع میں اس کی ہلاکت کی اطلاع دی۔"
  tr: "Naseeb Bek Yusuf Bekli hakkında Azerbaycan Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1881'de Gence'de doğduğuna, eğitimine, gazeteciliğine, partisine ve hükümetlerine dair ayrıntılı biyografi ve bazı kaynaklar ölümünün 1920 Mayıs başında Kurdamir bölgesinde gerçekleştiğini belirtmektedir."
  id: "Artikel Wikipedia Azerbaijan tentang Naseeb Bek Yusuf Bekli; digunakan hanya untuk fakta entitas. Biografi rinci tentang kelahirannya di Ganja pada tahun 1881, pendidikan, jurnalisme, partai, dan pemerintahannya, serta beberapa sumber menyebutkan bahwa kematiannya terjadi pada awal Mei 1920 di distrik Kurdamir."
