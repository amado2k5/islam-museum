  ar: "عنصر ويكيبيانات Q2640707 لموسى بيغييف: ثلاث قيم متنافسة لتاريخ المولد: 24 سبتمبر 1874، وسنة 1875، وسنة 1878، ومكان المولد كيكينو (Q18780125)؛ ومتوفى في القاهرة (Q85) في 28 أكتوبر 1949؛ وقيمته الوحيدة للديانة هي «الإسلام» (Q432) بصيغة عامة دون مدرسة."
  en: "Wikidata item Q2640707 for Musa Bigiev: three competing birth-date values — 24 September 1874, the year 1875, and the year 1878 — with birthplace Kikino (Q18780125); died at Cairo (Q85) on 28 October 1949; its only religion value is Islam (Q432), generic, naming no school."
  es: "Elemento de Wikidata Q2640707 para Musa Bigiev: tres valores de fecha de nacimiento en competencia: 24 de septiembre de 1874, el año 1875 y el año 1878, con lugar de nacimiento Kikino (Q18780125); murió en El Cairo (Q85) el 28 de octubre de 1949; su único valor de religión es Islam (Q432), genérico, sin nombrar ninguna escuela."
  fr: "L'élément Wikidata Q2640707 pour Musa Bigiev: trois valeurs de date de naissance concurrentes — le 24 septembre 1874, l'année 1875 et l'année 1878 — avec un lieu de naissance Kikino (Q18780125); décédé au Caire (Q85) le 28 octobre 1949; sa seule valeur de religion est l'Islam (Q432), générique, ne nommant aucune école."
