  tr: "Musa Begiev tarafından Wikidata maddesi Q2640707: doğum tarihi için üç rakip değer: 24 Eylül 1874, 1875 ve 1878; doğum yeri Kikino (Q18780125); 28 Ekim 1949'da Kahire'de (Q85) öldü; ve tek dini değeri genel olarak okulsuz \"İslam\"dır (Q432)."
