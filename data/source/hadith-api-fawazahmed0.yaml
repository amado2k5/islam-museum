summary:
  ar: "مستودع مفتوح على GitHub ينشر نصوص الكتب الستة وموطأ مالك وغيرها بالعربية والإنجليزية في ملفات JSON بالترقيم المعتمد، مع الدرجات عند بعضها، تحت رخصة Unlicense. استُعمل لمقتطفات المتون وأرقامها في متصفح الأحاديث القدسية."
  en: "An open GitHub repository that publishes the six books, the Muwatta of Malik and other collections in Arabic and English as JSON files with the standard numbering, and grades for some, under the Unlicense. Used for the matn excerpts and numbers in the Hadith Qudsi Browser."
  es: "Un repositorio abierto de GitHub que publica los seis libros, el Muwatta de Malik y otras colecciones en árabe e inglés como archivos JSON con la numeración estándar y grados para algunos, bajo la licencia Unlicense. Se utiliza para los extractos y números de matn en el navegador Hadith Qudsi."
  fr: "Un dépôt GitHub ouvert qui publie les six livres, la Muwatta de Malik et d'autres recueils en arabe et en anglais sous forme de fichiers JSON avec une numérotation standard et des notes pour certains, sous licence Unlicense. Utilisé pour les extraits et les numéros matrimoniaux dans le navigateur Hadith Qudsi."
