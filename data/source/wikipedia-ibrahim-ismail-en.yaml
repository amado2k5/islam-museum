summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم إسكندر سلطان جوهر (وُلد 1958)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في جوهر بهرو أكبر أبناء السلطان إسكندر، وتعليمه في سيدني وتدريبه العسكري في ماليزيا والولايات المتحدة، وثلاثة عقوده وليا للعهد ووصايته 1984–1989، واعتلاءه عرش جوهر سنة 2010 وتتويجه سنة 2015، وإعادته عطلة الجمعة والسبت، وانتخابه وتنصيبه سابع عشر ملوك ماليزيا في 2023–2024."
  en: "English Wikipedia article on Ibrahim Iskandar of Johor (born 1958); used for entity facts only. It recounts his Johor Bahru birth as the eldest son of Sultan Iskandar, his Sydney schooling and military training in Malaysia and the United States, his three decades as crown prince and his regency of 1984–1989, his accession as Sultan of Johor in 2010 and coronation in 2015, his restoration of the Friday–Saturday weekend in Johor, and his election and installation as the seventeenth Yang di-Pertuan Agong in 2023–2024."
