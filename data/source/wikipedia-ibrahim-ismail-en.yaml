summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم إسكندر سلطان جوهر ⁦(وُلد 1958)⁩؛ تُستخدم لوقائع الكيان فقط. تروي مولده في جوهر بهرو أكبر أبناء السلطان إسكندر، وتعليمه في سيدني وتدريبه العسكري في ماليزيا والولايات المتحدة، وثلاثة عقوده وليا للعهد ووصايته 1984–1989، واعتلاءه عرش جوهر سنة 2010 وتتويجه سنة 2015، وإعادته عطلة الجمعة والسبت، وانتخابه وتنصيبه سابع عشر ملوك ماليزيا في 2023–2024."
  en: "English Wikipedia article on Ibrahim Iskandar of Johor (born 1958); used for entity facts only. It recounts his Johor Bahru birth as the eldest son of Sultan Iskandar, his Sydney schooling and military training in Malaysia and the United States, his three decades as crown prince and his regency of 1984–1989, his accession as Sultan of Johor in 2010 and coronation in 2015, his restoration of the Friday–Saturday weekend in Johor, and his election and installation as the seventeenth Yang di-Pertuan Agong in 2023–2024."
  es: "Artículo de la Wikipedia en inglés sobre Ibrahim Iskandar de Johor (nacido en 1958); utilizado únicamente para datos sobre la entidad. Relata su nacimiento en Johor Bahru como hijo mayor del sultán Iskandar, su educación en Sídney y su formación militar en Malasia y Estados Unidos, sus tres décadas como príncipe heredero y su regencia de 1984 a 1989, su ascenso al trono como sultán de Johor en 2010 y su coronación en 2015, la restauración del fin de semana de viernes a sábado en Johor, y su elección e investidura como el decimoséptimo Yang di-Pertuan Agong en 2023-2024."
  fr: "Article de Wikipédia en anglais sur Ibrahim Iskandar de Johor (né en 1958); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Johor Bahru, fils aîné du sultan Iskandar, sa scolarité à Sydney et sa formation militaire en Malaisie et aux États-Unis, ses trois décennies en tant que prince héritier et sa régence de 1984 à 1989, son accession au trône en tant que sultan de Johor en 2010 et son couronnement en 2015, le rétablissement du week-end du vendredi au samedi à Johor, ainsi que son élection et son installation en tant que dix-septième Yang di-Pertuan Agong en 2023-2024."
