summary:
  ar: "مقالة ويكيبيديا العربية عن محمد منظور النعماني ⁦(15 كانون الأول 1905 – 4 أيار 1997)⁩؛ تصفه في صدرها بأنه عالم إسلامي سني هندي مناهض للشيعة، وتسرد سيرته ودراسته في ديوبند وعضويته التأسيسية في الجماعة الإسلامية ثم انتسابه إلى جماعة التبليغ ومؤلفاته ومنها «معارف الحديث»، وهي ترجمة للمقالة الإنجليزية بنفس مراجعها."
  en: "The Arabic Wikipedia article on Muhammad Manzoor Nomani (15 December 1905 – 4 May 1997); its lead calls him an Indian Sunni Islamic scholar opposed to Shi'ism, and it gives his biography, his Deoband studies, his founding membership of Jamaat-e-Islami, his later Tablighi Jamaat affiliation and his works including Maariful Hadith. It is a translation of the English article, carrying the same citations, and is counted as the same text family."
  es: "El artículo de Wikipedia en árabe sobre Muhammad Manzoor Nomani (15 de diciembre de 1905 - 4 de mayo de 1997) lo describe como un erudito islámico sunita indio opuesto al chiismo, y ofrece su biografía, sus estudios de Deoband, su membresía fundadora en Jamaat-e-Islami, su posterior afiliación a Tablighi Jamaat y sus obras, incluyendo Maariful Hadith. Se trata de una traducción del artículo en inglés, con las mismas citas, y pertenece a la misma familia textual."
  fr: "L'article de Wikipédia en arabe consacré à Muhammad Manzoor Nomani (15 décembre 1905 – 4 mai 1997) le présente comme un érudit islamique sunnite indien opposé au chiisme. Il retrace sa biographie, ses études sur Deoband, son rôle de membre fondateur de Jamaat-e-Islami, son affiliation ultérieure à Tablighi Jamaat et ses œuvres, dont Maariful Hadith. Cet article est une traduction de l'article anglais, dont il reprend les citations, et appartient à la même famille de textes."
  ur: "محمد منظور نعمانی پر عربی ویکیپیڈیا مضمون ⁦(15 دسمبر 1905 - 4 مئی 1997)⁩؛ اس کی قیادت انہیں شیعہ مذہب کے خلاف ایک ہندوستانی سنی اسلامی اسکالر کہتی ہے، اور اس میں ان کی سوانح عمری، ان کے دیوبند کے علوم، جماعت اسلامی کی ان کی بانی رکنیت، بعد میں تبلیغی جماعت سے وابستگی اور معارف حدیث سمیت ان کے کاموں کو پیش کیا گیا ہے۔ یہ انگریزی مضمون کا ترجمہ ہے، جس میں ایک جیسے حوالہ جات ہیں، اور اسی متن کے خاندان میں شمار ہوتے ہیں۔"
  tr: "Muhammed Manzoor Al-Numani hakkında Arapça Wikipedia makalesi (15 Aralık 1905 – 4 Mayıs 1997); onu başlangıçta Şiilere karşı olan bir Hintli Sünni İslam alimi olarak tanımlar; biyografisini, Deoband'daki çalışmalarını, Jamaat-e-Islami'ye kurucu üyeliğini, Jamaat-e-Tablighi ile bağlantısını ve aynı referansları içeren İngilizce makalenin çevirisi olan 'Ma'arif al-Hadis' dahil eserlerini anlatır."
  id: "Artikel Wikipedia berbahasa Arab tentang Muhammad Manzoor Al-Numani (15 Desember 1905 – 4 Mei 1997); awalnya menggambarkan dia sebagai seorang ulama Islam Sunni India yang menentang Syiah, menceritakan biografinya, studi di Deoband, keanggotaan pendiriannya di Jamaat-e-Islami, serta afiliasinya dengan Jamaat-e-Tablighi dan karya-karyanya, termasuk 'Ma'arif al-Hadith,' yang merupakan terjemahan dari artikel bahasa Inggris dengan referensi yang sama."
