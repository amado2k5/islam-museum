summary:
  ar: "مقالة ويكيبيديا العربية عن محمد منظور النعماني (15 كانون الأول 1905 – 4 أيار 1997)؛ تصفه في صدرها بأنه عالم إسلامي سني هندي مناهض للشيعة، وتسرد سيرته ودراسته في ديوبند وعضويته التأسيسية في الجماعة الإسلامية ثم انتسابه إلى جماعة التبليغ ومؤلفاته ومنها «معارف الحديث»، وهي ترجمة للمقالة الإنجليزية بنفس مراجعها."
  en: "The Arabic Wikipedia article on Muhammad Manzoor Nomani (15 December 1905 – 4 May 1997); its lead calls him an Indian Sunni Islamic scholar opposed to Shi'ism, and it gives his biography, his Deoband studies, his founding membership of Jamaat-e-Islami, his later Tablighi Jamaat affiliation and his works including Maariful Hadith. It is a translation of the English article, carrying the same citations, and is counted as the same text family."
