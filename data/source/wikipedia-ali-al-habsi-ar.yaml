reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id. It gives his full name as علي عبد الله بن حارب الحبسي, born 30 December 1981, with the infobox birthplace الولاية المضيبي (Al-Mudhaibi) — which conflicts with the English article’s Muscat and is disclosed in the person record rather than resolved here — and his career from Al-Mudhaibi and Al-Nasr through Lyn, Bolton and Wigan to Reading, Al-Hilal and West Bromwich Albion. Its personal-life section says «الحبسي مسلم ملتزم» (Al-Habsi is a committed Muslim), citing the same Guardian article of 9 December 2011 as the English article; its categories file him among «مسلمون عمانيون», a filing. It names no school."
