summary:
  ar: "مقالة ويكيبيديا العربية عن علي الحبسي؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده سنة 1981 ومكان ميلاده المضيبي ⁦(بخلاف الإنجليزية التي تعطي مسقط)⁩، وتسمّيه في حياته الشخصية «مسلم ملتزم» دون أن تسمّي مدرسة."
  en: "Arabic Wikipedia article on Ali Al-Habsi; used for entity facts only. It gives his 1981 birth with the birthplace Al-Mudhaibi (where the English article gives Muscat), and calls him a committed Muslim in its personal-life section without naming any school."
  es: "Artículo de Wikipedia en árabe sobre Ali Al-Habsi; utilizado únicamente para datos sobre la persona. Indica que nació en 1981 en Al-Mudhaibi (mientras que el artículo en inglés menciona Mascate) y lo describe como un musulmán devoto en la sección sobre su vida personal, sin mencionar ninguna escuela."
  fr: "L'article de Wikipédia en arabe consacré à Ali Al-Habsi est utilisé uniquement pour les informations le concernant. Il indique sa naissance en 1981 à Al-Mudhaibi (alors que l'article en anglais mentionne Mascate) et le décrit comme un musulman pratiquant dans sa section personnelle, sans toutefois préciser d'école de pensée."
  ur: "علی الحبسی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی 1981 میں جائے پیدائش المذیبی ⁦(جہاں انگریزی مضمون مسقط کا نام دیتا ہے)⁩ کے ساتھ جنم لیتا ہے، اور کسی اسکول کا نام لیے بغیر اسے اپنی ذاتی زندگی کے حصے میں ایک پرعزم مسلمان قرار دیتا ہے۔"
  tr: "Ali Al-Habsi hakkında Arapça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Doğum yılı 1981, doğum yeri ise Al-Mudhaibi (İngilizce'de Muskat'ın aksine) belirtilmiş ve kişisel hayatında okul belirtmeden \"bağlı Müslüman\" olarak tanımlanmıştır."
  id: "Artikel Wikipedia berbahasa Arab tentang Ali Al-Habsi hanya digunakan untuk fakta entitas tersebut. Artikel tersebut mencantumkan tahun kelahirannya sebagai 1981 dan tempat kelahirannya sebagai Al-Mudhaibi (berbeda dengan bahasa Inggris yang menyebutkan Muscat), dan menyebutnya sebagai \"Muslim yang berdedikasi\" dalam kehidupan pribadinya tanpa menyebutkan sekolah."
