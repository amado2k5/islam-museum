summary:
  ar: "مقالة ويكيبيديا الملايوية عن زين العابدين بن أحمد (زعبا)؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 16 أيلول 1895 في قرية بوكيت كيرداس بباتو كيكير في جمبول، وتعليمه الذاتي المبكر ثم دراسته في لنغي وسرمبان، ومساره في التدريس والترجمة وخدمته القصيرة أمينًا عامًا أول لمنظمة أمنو، وكتاباته، ووفاته في 23 تشرين الأول 1973 ودفنه في مقبرة جالان أمبانغ الإسلامية بكوالالمبور. يعطي صندوق معلوماتها ديانته «الإسلام» إجمالًا."
  en: "Malay Wikipedia article on Zainal Abidin bin Ahmad (Za'ba); used for entity facts only. It gives his birth on 16 September 1895 at Kampung Bukit Kerdas, Batu Kikir, Jempol, his self-taught early literacy and schooling at Linggi and St Paul's Institution, Seremban, his teaching and translation career, his brief service as the first secretary-general of UMNO, his writings, his death on 23 October 1973 and his burial at the Jalan Ampang Muslim Cemetery, Kuala Lumpur. Its infobox gives his religion as Islam in general."
