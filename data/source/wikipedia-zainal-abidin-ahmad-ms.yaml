summary:
  ar: "مقالة ويكيبيديا الملايوية عن زين العابدين بن أحمد ⁦(زعبا)⁩؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 16 أيلول 1895 في قرية بوكيت كيرداس بباتو كيكير في جمبول، وتعليمه الذاتي المبكر ثم دراسته في لنغي وسرمبان، ومساره في التدريس والترجمة وخدمته القصيرة أمينًا عامًا أول لمنظمة أمنو، وكتاباته، ووفاته في 23 تشرين الأول 1973 ودفنه في مقبرة جالان أمبانغ الإسلامية بكوالالمبور. يعطي صندوق معلوماتها ديانته «الإسلام» إجمالًا."
  en: "Malay Wikipedia article on Zainal Abidin bin Ahmad (Za'ba); used for entity facts only. It gives his birth on 16 September 1895 at Kampung Bukit Kerdas, Batu Kikir, Jempol, his self-taught early literacy and schooling at Linggi and St Paul's Institution, Seremban, his teaching and translation career, his brief service as the first secretary-general of UMNO, his writings, his death on 23 October 1973 and his burial at the Jalan Ampang Muslim Cemetery, Kuala Lumpur. Its infobox gives his religion as Islam in general."
  es: "Artículo de Wikipedia en malayo sobre Zainal Abidin bin Ahmad (Za'ba); utilizado únicamente para datos biográficos. Indica su nacimiento el 16 de septiembre de 1895 en Kampung Bukit Kerdas, Batu Kikir, Jempol, su alfabetización temprana autodidacta y su escolarización en Linggi y St Paul's Institution, Seremban, su carrera como profesor y traductor, su breve período como primer secretario general de la UMNO, sus escritos, su fallecimiento el 23 de octubre de 1973 y su entierro en el cementerio musulmán de Jalan Ampang, Kuala Lumpur. Su ficha informativa indica que profesaba el islam en general."
  fr: "Article Wikipédia en malais sur Zainal Abidin bin Ahmad (Za'ba); utilisé uniquement pour les informations biographiques. Il indique sa naissance le 16 septembre 1895 à Kampung Bukit Kerdas, Batu Kikir, Jempol, son apprentissage autodidacte de la lecture et de l'écriture, sa scolarité à Linggi et à la St Paul's Institution de Seremban, sa carrière d'enseignant et de traducteur, son bref passage comme premier secrétaire général de l'UMNO, ses écrits, son décès le 23 octobre 1973 et son inhumation au cimetière musulman de Jalan Ampang, à Kuala Lumpur. Son infobox précise qu'il était de confession musulmane."
  ur: "زینل عابدین بن احمد (Za'ba) پر مالائی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 16 ستمبر 1895 کو کمپونگ بکیت کیرداس، بٹو کیکر، جیمپول میں پیدا ہوا، لنگی اور سینٹ پالز انسٹی ٹیوشن، سیرمبن میں ان کی ابتدائی خواندگی اور اسکول کی تعلیم، ان کا تدریسی اور ترجمے کا کیریئر، یو ایم این او کے پہلے سیکرٹری جنرل کے طور پر ان کی مختصر خدمات، ان کی تحریریں اور 23 اکتوبر کو ان کی وفات۔ امپانگ مسلم قبرستان، کوالالمپور۔ اس کا انفو باکس عام طور پر اس کا مذہب اسلام کے طور پر دیتا ہے۔"
