summary:
  ar: "مقال أدبي لراؤ فرمان علي في «كشمير تايمز» ⁦(23 أكتوبر 2025)⁩ عن ثلاثة شعراء دورو — محمود غامي ورسول مير وأسد مير — يذكر سنوات غامي (1765–1855) ورسول مير (1840–1870) بصوت الصحيفة، ويصف غامي بأنه المتصوف صاحب الضريح وشاعر الأولياء."
  en: "Rao Farman Ali’s Kashmir Times literary feature (23 October 2025) on the three poets of Dooru — Mahmud Gami, Rasul Mir and Asad Mir — giving Gami’s years as 1765–1855 and Rasul Mir’s as 1840–1870 in the newspaper’s own voice, and presenting Gami as the mystic saint-poet of Dooru, with Kashmir University scholars quoted."
  es: "El artículo literario de Rao Farman Ali en el Kashmir Times (23 de octubre de 2025) sobre los tres poetas de Dooru — Mahmud Gami, Rasul Mir y Asad Mir — indicando los años de Gami como 1765-1855 y los de Rasul Mir como 1840-1870, según la propia redacción del periódico, y presentando a Gami como el místico santo-poeta de Dooru, con citas de académicos de la Universidad de Cachemira."
  fr: "L'article littéraire de Rao Farman Ali dans le Kashmir Times (23 octobre 2025) sur les trois poètes de Dooru — Mahmud Gami, Rasul Mir et Asad Mir — donne les années de Gami comme 1765-1855 et celles de Rasul Mir comme 1840-1870 dans la voix même du journal, et présente Gami comme le saint-poète mystique de Dooru, avec des érudits de l'Université du Cachemire cités."
