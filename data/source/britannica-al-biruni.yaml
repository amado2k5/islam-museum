summary:
  en: "Britannica biography of al-Bīrūnī by George Saliba and the Britannica editors; it gives his birth at Khwārezm in 973, the civil war of 996–998 that drove him to the Sāmānid court at Bukhara, his stay with Qābūs at Gurgān where he met Ibn Sīnā and dedicated the Chronology of Ancient Nations, Maḥmūd's summons to Ghazna, the book on India, the Masʿūdic Canon, and his death at Ghazna about 1052."
  es: "La biografía de al-Bīrūnī publicada por la Enciclopedia Británica, escrita por George Saliba y los editores de la misma, relata su nacimiento en Khwārezm en 973, la guerra civil de 996-998 que lo llevó a la corte sāmāní en Bukhara, su estancia con Qābūs en Gurgān, donde conoció a Ibn Sīnā y le dedicó la Cronología de las Naciones Antiguas, la convocatoria de Mahmūd a Ghazna, el libro sobre la India, el Canon Masʿūdic, y su muerte en Ghazna alrededor de 1052."
  fr: "Biographie d'al-Bīrūnī dans Britannica par George Saliba et les éditeurs de Britannica; elle relate sa naissance à Khwārezm en 973, la guerre civile de 996-998 qui le poussa à se rendre à la cour samanide de Boukhara, son séjour auprès de Qābūs à Gurgān où il rencontra Ibn Sīnā et lui dédia la Chronologie des nations anciennes, la convocation de Maḥmūd à Ghazna, le livre sur l'Inde, le Canon masʿūdique, et sa mort à Ghazna vers 1052."
  ur: "برٹانیکا سوانح عمری البیرونی کی جارج سلیبا اور برٹانیکا ایڈیٹرز کی طرف سے؛ یہ 973 میں خوارزم میں اس کی پیدائش ہے، 996-998 کی خانہ جنگی جس نے اسے بخارا کے سامانی دربار میں لے جایا، گرگان میں قابوس کے ساتھ اس کا قیام جہاں اس نے ابن سینا سے ملاقات کی اور قدیم اقوام کی تاریخ، محمود کی کتاب، مسنون، تھیمسون، ہندوستان کے لیے وقف کی۔ اور ان کی وفات 1052 میں غزنہ میں ہوئی۔"
