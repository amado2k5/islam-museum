summary:
  ar: "مقالة ويكيبيديا الصينية عن ما جان آو؛ تُستخدم لوقائع الكيان فقط. تذكر أن أسرته توارثت منصب مشيخة الإسلام، وأنه درس في العشرين من عمره في الجامع الكبير بحي داشيوشيانغ في شيآن حتى «ارتدى اللباس» (تخرّج أهونغًا)، ثم عمل أهونغًا في مسجدي مونيغو وداخجيا منتميًا إلى منحوان هواسي (花寺门宦)، وقاد ثوّار هتشو ثم استسلم للتشينغ سنة 1872 وأرسل ابنه ما سبعة وخمسة (ما انليانغ) إلى معسكر العدو، وتقاعد في آخر عمره أهونغًا في داخجيا؛ وتؤرّخ مولده سنة 1830 ووفاته سنة 1886."
  en: "Chinese Wikipedia article on Ma Zhan'ao; used for entity facts only. It records that his family were hereditary Islamic religious leaders, that at twenty he studied at the Great Mosque of Daxuexiang in Xi'an until he 'received the vestment' (graduated as an ahong), then served as ahong at the Monigou and Dahejia mosques belonging to the Huasi menhuan, led the Hezhou rebels, surrendered to the Qing in 1872 sending his son Ma Qiwu (Ma Anliang) to the enemy camp, and retired to Dahejia as an ahong; it dates his birth to 1830 and his death to 1886."
