summary:
  ar: "عنصر ويكي بيانات Q389030 لشيخي، مراجعة 29 أيلول 2026؛ يُستخدم للمعرّفات فقط: سنة وفاته 1431، ومكان مولده كوتاهية ومكان وفاته دوملوبينار كما ورد فيه، ومعرّف مدخل موسوعة TDV «seyhi» الذي تستند إليه قيمه، وروابط مقالاته بالتركية والألمانية والأذربيجانية والكردية. وقيمة الدين فيه «الإسلام» عموماً (Q432) دون مذهب أو طريقة."
  en: "Wikidata item Q389030 for Şeyhi, revision of 29 September 2026; used for identifiers only — its death year 1431, its Kütahya place of birth and Dumlupınar place of death values, the TDV encyclopedia identifier (P7314 'seyhi') to which its sourced values refer, and its sitelinks to the Turkish, German, Azerbaijani and Kurdish articles. Its religion value is Islam in general (Q432), naming no school or order."
  es: "Elemento de Wikidata Q389030 para Şeyhi, revisión del 29 de septiembre de 2026; utilizado solo para identificadores: su año de muerte 1431, sus valores de lugar de nacimiento Kütahya y lugar de muerte Dumlupınar, el identificador de la enciclopedia TDV (P7314 'seyhi') al que se refieren sus valores de origen, y sus enlaces a los artículos en turco, alemán, azerbaiyano y kurdo. Su valor religioso es el islam en general (Q432), sin nombrar ninguna escuela u orden."
  fr: "L'élément Wikidata Q389030 pour Şeyhi, révisé le 29 septembre 2026, est utilisé uniquement pour les identifiants: son année de décès (1431), ses lieux de naissance (Kütahya) et de décès (Dumlupınar), l'identifiant de l'encyclopédie TDV (P7314 « seyhi ») auquel se réfèrent ses données, et ses liens vers les articles turc, allemand, azerbaïdjanais et kurde. Sa religion est l'islam en général (Q432), sans précision d'école ni d'ordre."
  ur: "ویکی ڈیٹا آئٹم Q389030 برائے Şeyhi، 29 ستمبر 2026 کی نظر ثانی؛ صرف شناخت کنندگان کے لیے استعمال کیا جاتا ہے — اس کا سال وفات 1431، اس کا کوتاہیا جائے پیدائش اور موت کی جگہ Dumlupınar اقدار، TDV انسائیکلوپیڈیا شناخت کنندہ (P7314 'seyhi') جس سے اس کی منبع اقدار کا حوالہ دیا گیا ہے، اور اس کے سائٹ لنکس ترکی، جرمن، آذربائیجانی اور کرد مضامین سے ہیں۔ اس کی مذہبی قدر عمومی طور پر اسلام ہے (Q432)، کسی اسکول یا آرڈر کا نام نہیں ہے۔"
  tr: "Wikidata öğesi Q389030 Sheikhi tarafından, revizyon 29 Eylül 2026; yalnızca tanımlayıcılar için kullanılır: ölüm yılı 1431, doğum yeri Kutahya'da ve ölüm yeri Dumlupinar'da belirtildiği gibi, TDV ansiklopedisi \"seyhi\"nin giriş kimliği ve Türkçe, Almanca, Azerbaycanca ve Kürtçe makalelerine bağlantılar. Dinin değeri genel olarak \"İslam\"dır (Q432), herhangi bir mezhep veya yöntem olmaksızın."
  id: "Item Wikidata Q389030 oleh Sheikhi, revisi 29 September 2026; hanya digunakan untuk pengidentifikasi: tahun kematian 1431, tempat lahir di Kutahya dan tempat kematian seperti yang tercantum dalam Dumlupinar, ID entri ensiklopedia TDV \"seyhi\" yang menjadi dasar nilai-nilainya, dan tautan ke artikelnya dalam bahasa Turki, Jerman, Azerbaijan, dan Kurdi. Nilai agama di dalamnya adalah \"Islam\" secara umum (Q432) tanpa sekte atau metode apa pun."
