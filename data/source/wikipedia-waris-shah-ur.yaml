reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth at Jandiala Sher Khan on 5 Rabi al-thani 1130 AH, which it pairs with 1718 CE, against the English article's and Wikidata's 1722; it records his education at Kasur under Ghulam Murtaza alongside Bulleh Shah, and the tradition that, where Bulleh Shah took bay'a from Shah Inayat Qadiri, Waris Shah took bay'a in the line of Khwaja Fariduddin Ganjshakar; it gives his death aged 76 on 24 June 1798 and his tomb at Jandiala Sher Khan, while warning that neither year is certain and preserving Afzal Haq's tradition of 10 Muharram 1220 AH for the death. Checked 1 November 2026."
