summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن منظمة دعوت إسلامي الباكستانية: تأسست رسميًا في كراتشي في سبتمبر 1981 بقيادة إلياس قادري، وتدير قناة مدني التلفزيونية التي انطلقت سنة 2008 بالأردية ثم بالإنجليزية والعربية والبنغالية، وموقعها الرسمي dawateislami.net."
  en: "The English Wikipedia article on Dawat-e-Islami, the Pakistan-based organisation officially founded in Karachi in September 1981 with Ilyas Qadri as its main leader; it runs the Madani Channel television station, operating since 2008 and launched in Urdu before English, Arabic and Bengali services, and its website is given as www.dawateislami.net."
  es: "El artículo de Wikipedia en inglés sobre Dawat-e-Islami, la organización con sede en Pakistán fundada oficialmente en Karachi en septiembre de 1981 con Ilyas Qadri como su principal líder; gestiona la estación de televisión Madani Channel, que opera desde 2008 y se lanzó en urdu antes de los servicios en inglés, árabe y bengalí, y su sitio web es www.dawateislami.net."
  fr: "L'article de Wikipédia en anglais sur Dawat-e-Islami, l'organisation basée au Pakistan et officiellement fondée à Karachi en septembre 1981 avec Ilyas Qadri comme principal dirigeant; elle gère la chaîne de télévision Madani Channel, qui fonctionne depuis 2008 et a été lancée en ourdou avant les services en anglais, en arabe et en bengali, et son site web est www.dawateislami.net."
