  ar: "مقالة ويكيبيديا الإنجليزية عن منظمة دعوت إسلامي الباكستانية: تأسست رسميًا في كراتشي في سبتمبر 1981 بقيادة إلياس قادري، وتدير قناة مدني التلفزيونية التي انطلقت سنة 2008 بالأردية ثم بالإنجليزية والعربية والبنغالية، وموقعها الرسمي dawateislami.net."
  en: "The English Wikipedia article on Dawat-e-Islami, the Pakistan-based organisation officially founded in Karachi in September 1981 with Ilyas Qadri as its main leader; it runs the Madani Channel television station, operating since 2008 and launched in Urdu before English, Arabic and Bengali services, and its website is given as www.dawateislami.net."
