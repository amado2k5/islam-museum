reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A short, independent Arabic article. It gives his full regnal style and his birth name Soltan Mohammad Mirza, his accession on 16 Safar 1052 AH aged ten, the recovery of Kandahar in 1059 AH, his death at the palace of Khosrow Abad in Damghan in 1078 AH — or 1077 AH by another reading, both preserved in the person record — and his burial at Qom. It pairs his birth with 30 August 1632 but with the year 1043 AH, which does not match that date, so no Hijri year is built from it. It says nothing of his personal faith. Checked 1 November 2026."
