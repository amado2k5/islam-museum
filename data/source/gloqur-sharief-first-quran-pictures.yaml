  es: "Publicación de Yulia Riswan, 15 de diciembre de 2023, sobre \"My First Qur'an with Pictures: Juz' Amma\" de Shereen Sharief, una traducción ilustrada al inglés para niños publicada por primera vez en 2018 y revisada por Abdullah ibn Yusuf al-Judai."
  fr: "Article de Yulia Riswan, 15 décembre 2023, sur My First Qur'an with Pictures: Juz' Amma de Shereen Sharief, une traduction illustrée en anglais pour enfants, initialement publiée en 2018 et vérifiée par Abdullah ibn Yusuf al-Judai."
