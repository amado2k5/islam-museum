summary:
  ar: "مقالة ويكيبيديا الفارسية «سيد حسن تقي زاده»؛ تُستخدم لوقائع الكيان فقط. تروي نشأته وسفره 1904-05، ودفاعه في المجلس الثاني عن فصل الدين عن السياسة حتى أفتى علماء النجف بـ«فساد مسلكه السياسي»، وتحقيقه في تقويم إيران القديم، ومناصبه في العهد البهلوي حتى رئاسة مجلس الشيوخ، ووفاته في طهران في 8 بهمن 1348 شمسية ودفنه في مقبرة ظهير الدولة."
  en: "Persian Wikipedia article 'Sayyed Hasan Taqizadeh'; used for entity facts only. It recounts his upbringing and his 1904-05 travels, his defence in the Second Majles of the separation of religion from politics until the Najaf ulama issued a fatwa on the 'corruption of his political path', his research on the old Iranian calendar, his Pahlavi-era offices up to the presidency of the Senate, and his death at Tehran on 8 Bahman 1348 Solar Hijri and burial in the Zahir al-Dawla cemetery."
