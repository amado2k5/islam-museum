summary:
  ar: "مقالة ويكيبيديا الفارسية «سيد حسن تقي زاده»؛ تُستخدم لوقائع الكيان فقط. تروي نشأته وسفره 1904-05، ودفاعه في المجلس الثاني عن فصل الدين عن السياسة حتى أفتى علماء النجف بـ«فساد مسلكه السياسي»، وتحقيقه في تقويم إيران القديم، ومناصبه في العهد البهلوي حتى رئاسة مجلس الشيوخ، ووفاته في طهران في 8 بهمن 1348 شمسية ودفنه في مقبرة ظهير الدولة."
  en: "Persian Wikipedia article 'Sayyed Hasan Taqizadeh'; used for entity facts only. It recounts his upbringing and his 1904-05 travels, his defence in the Second Majles of the separation of religion from politics until the Najaf ulama issued a fatwa on the 'corruption of his political path', his research on the old Iranian calendar, his Pahlavi-era offices up to the presidency of the Senate, and his death at Tehran on 8 Bahman 1348 Solar Hijri and burial in the Zahir al-Dawla cemetery."
  es: "Artículo de Wikipedia en persa titulado \"Sayyed Hasan Taqizadeh\"; utilizado únicamente para datos sobre la persona. Relata su infancia y sus viajes entre 1904 y 1905, su defensa en el Segundo Majlis de la separación entre religión y política hasta que los ulemas de Najaf emitieron una fatwa sobre la \"corrupción de su trayectoria política\", su investigación sobre el antiguo calendario iraní, sus cargos durante la era Pahlavi hasta la presidencia del Senado, y su fallecimiento en Teherán el 8 de Bahman de 1348 del calendario islámico y su entierro en el cementerio de Zahir al-Dawla."
  fr: "L'article Wikipédia persan « Sayyed Hasan Taqizadeh » est utilisé uniquement à des fins documentaires. Il relate son enfance et ses voyages de 1904-1905, sa défense devant le Second Majlis de la séparation de la religion et de la politique jusqu'à ce que les oulémas de Najaf émettent une fatwa sur la « corruption de son parcours politique », ses recherches sur l'ancien calendrier iranien, ses fonctions sous le règne des Pahlavi jusqu'à la présidence du Sénat, et sa mort à Téhéran le 8 Bahman 1348 de l'Hégire solaire et son inhumation au cimetière de Zahir al-Dawla."
  ur: "فارسی ویکیپیڈیا مضمون 'سید حسن تقی زادہ'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پرورش اور ان کے 1904-05 کے سفر کا ذکر ہے، دوسری مجلس میں مذہب کی سیاست سے علیحدگی کے بارے میں ان کا دفاع یہاں تک کہ نجف کے علماء نے 'اس کے سیاسی راستے کی بدعنوانی' پر فتویٰ جاری کیا، پرانے ایرانی کیلنڈر پر ان کی تحقیق، سینیٹ کی صدارت تک ان کے پہلوی دور کے دفاتر، اور تہران 18 ہجری کو ان کی وفات۔ اور ظہیر الدولہ قبرستان میں تدفین۔"
  tr: "Farsça Vikipedi makalesi \"Seyyid Hassan Taqi Zadeh\" yalnızca varlığın gerçekleri için kullanılmıştır. 1904-05 yılları arasında yetiştirilmesini ve seyahatlerini, ikinci Meclis'te dini siyasetten ayırmayı savunmasını anlatır; ta ki Necef âlimleri \"siyasi yolunun yozlaşması\" fetvası, eski İran takvimini doğrulaması, Pehlevi dönemindeki pozisyonları ve Senato başkanlığına kadar olan dönemi, 8 Bahman 1348 SH tarihinde Tahran'daki ölümü ve Zahir al-Dowla mezarlığında defnedilmesi gibi konuları anlatır."
  id: "Artikel Wikipedia Persia \"Seyyed Hassan Taqi Zadeh\" hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan masa kecilnya dan perjalanannya dari tahun 1904-05, pembelaannya di Majlis kedua tentang pemisahan agama dari politik, hingga para sarjana Najaf mengeluarkan fatwa yang menyatakan \"korupsi jalur politiknya,\" verifikasi kalender kuno Iran, posisinya selama era Pahlavi hingga masa kepresidenannya di Senat, kematiannya di Teheran pada 8 Bahman 1348 SH, dan pemakamannya di pemakaman Zahir al-Dowla."
