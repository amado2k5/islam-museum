reliability_note: "Read in the museum's session on 20 November 2026. It calls al-Jamhara the third dictionary after Kitab al-Ayn and Kitab al-Jim; says Ibn Durayd dedicated it to Abdallah ibn Muhammad ibn Mikali and opened it with a preface on arrangement, letters, their articulation points and noun patterns; that he named it Jamhara because he meant to gather the greater part of Arabic in common use; that he followed the root-based system of al-Ayn but gave up its order by articulation point for alphabetical order; and that words are first divided into chapters by root length (biliteral, triliteral, quadriliteral, quinqueliteral, light words, rare words) and then ordered from hamza to ya, with the permutations of a root treated together. Used for entity facts only."
