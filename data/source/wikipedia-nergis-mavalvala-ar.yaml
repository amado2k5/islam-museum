summary:
  ar: "مقالة ويكيبيديا العربية عن نيرجيس مافالفالا؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها مولدها سنة 1968 في لاهور وإقامتها في كامبريدج بولاية ماساتشوستس، ويحمل حقل «الديانة» فيها قيمة «الزرادشتية» — قيمة منظمة وحيدة في طبعة واحدة من طبعات ويكيبيديا، لا يعضدها نص المقال."
  en: "Arabic Wikipedia article on Nergis Mavalvala; used for entity facts only. Its infobox gives her birth in 1968 at Lahore and her residence in Cambridge, Massachusetts, and its religion field carries the single structured value 'Zoroastrianism' — a lone structured value in one Wikipedia edition, not supported by any statement in the article's text."
  es: "Artículo de Wikipedia en árabe sobre Nergis Mavalvala; utilizado únicamente para datos sobre la entidad. Su ficha informativa indica que nació en 1968 en Lahore y residía en Cambridge, Massachusetts, y su campo de religión contiene el único valor estructurado «zoroastrismo», un único valor estructurado en una edición de Wikipedia, sin respaldo en el texto del artículo."
  fr: "Article de Wikipédia en arabe sur Nergis Mavalvala; utilisé uniquement pour les informations sur l'entité. Son infobox indique sa naissance en 1968 à Lahore et sa résidence à Cambridge, dans le Massachusetts, et son champ religion ne contient que la valeur structurée « zoroastrisme » — une valeur unique dans une édition de Wikipédia, non étayée par le texte de l'article."
  ur: "عربی ویکیپیڈیا مضمون نرگس ماول والا پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا انفو باکس 1968 میں لاہور میں اور کیمبرج، میساچوسٹس میں اس کی رہائش گاہ میں پیدا ہوا، اور اس کے مذہب کے شعبے میں واحد ساختی قدر 'زروتشتی ازم' ہے - ایک ویکیپیڈیا ایڈیشن میں واحد ساختی قدر، مضمون کے متن میں کسی بیان سے اس کی تائید نہیں کی گئی ہے۔"
