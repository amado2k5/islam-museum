summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فرقة النشيد الماليزية ريحان؛ لوقائع الكيان فقط: ألبومها الأول «بوجي بوجيان» في أكتوبر 1996 ومبيعاته، ووفاة مؤسسها أزهري أحمد في 2001، وحفلات الكومنولث 1997 وقاعة ألبرت الملكية، وجولاتها، وشهادات البلاتين؛ قسم الجوائز فيها بلا مصادر فلا يُستعمل."
  en: "English Wikipedia article on the Malaysian nasheed group Raihan; entity facts only: its debut album Puji-Pujian (October 1996) and its sales, the death of the founding member Azhari Ahmad in 2001, the 1997 Commonwealth performance and the Royal Albert Hall, its tours and its platinum certifications; its awards section cites no sources and is not used."
  es: "Artículo de la Wikipedia en inglés sobre el grupo malasio de nasheed Raihan; solo datos sobre la entidad: su álbum debut Puji-Pujian (octubre de 1996) y sus ventas, la muerte del miembro fundador Azhari Ahmad en 2001, la actuación en los Juegos de la Commonwealth de 1997 y en el Royal Albert Hall, sus giras y sus certificaciones de platino; su sección de premios no cita fuentes y no se utiliza."
  fr: "Article Wikipédia en anglais sur le groupe malaisien de nasheed Raihan; informations uniquement sur l’entité: son premier album Puji-Pujian (octobre 1996) et ses ventes, le décès du membre fondateur Azhari Ahmad en 2001, la performance aux Jeux du Commonwealth de 1997 et au Royal Albert Hall, ses tournées et ses certifications platine; sa section sur les récompenses ne cite aucune source et n’est pas utilisée."
  ur: "ملائیشیا کے نشید گروپ ریحان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: اس کا پہلا البم Puji-Pujian ⁦(اکتوبر 1996)⁩ اور اس کی فروخت، 2001 میں بانی رکن ازہری احمد کی موت، 1997 کی دولت مشترکہ کی کارکردگی اور رائل البرٹ ہال، اس کے دورے اور اس کے پلاٹینم سرٹیفیکیشن؛ اس کے ایوارڈز سیکشن میں کسی ذرائع کا حوالہ نہیں دیا گیا اور نہ ہی استعمال کیا جاتا ہے۔"
  tr: "Malezya marş grubu Rehan hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için: Ekim 1996'daki ilk albümleri 'Boogie Bojian' ve satışları, kurucusu Azhari Ahmed'in 2001'deki ölümü, 1997 Milletler Topluluğu konserleri, Royal Albert Hall, turneleri ve platin sertifikaları; ödül bölümü kaynak gösterilmemiş ve kullanılmamaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang band anthem Malaysia Rehan; hanya untuk fakta entitas: album pertama mereka 'Boogie Bojian' pada Oktober 1996 dan penjualannya, kematian pendirinya Azhari Ahmed pada 2001, konser Persemakmuran 1997, Royal Albert Hall, turnya, dan sertifikat platinum; bagian penghargaan tidak bersumber dan tidak digunakan."
