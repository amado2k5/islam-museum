summary:
  ar: "«دستور جيبوتي، 1992، المعدل في نوفمبر 2025»، كما يُنشر عند: الجريدة الرسمية لجيبوتي، القسم العربي. العنوان ونص المادتان 1 و93 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Constitution of Djibouti, 1992, revised November 2025, as published at: Journal Officiel de Djibouti, Arabic section. The address and the wording of Article 1 and Article 93 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Constitution of Djibouti, 1992, revised November 2025، جیسا کہ Journal Officiel de Djibouti, Arabic section پر شائع ہے۔ پتہ اور دفعات 1 اور 93 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Constitution of Djibouti, 1992, revised November 2025, tel que publié à : Journal Officiel de Djibouti, Arabic section. L'adresse et le texte (articles 1 et 93) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Constitution of Djibouti, 1992, revised November 2025, tal como se publica en: Journal Officiel de Djibouti, Arabic section. La dirección y el texto (artículos 1 y 93) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Cibuti Anayasası, 1992, Kasım 2025'te değiştirildi,\" şu şekilde yayımlanmıştır: Cibuti Resmi Gazetesi, Arapça bölüm. 1. ve 93. maddelerin başlığı ve metni, müze tarafından sağlanan bir araştırma özetinden alınmıştır ve müze sayfayı açmamıştır; kurucu metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Konstitusi Djibouti, 1992, diubah pada November 2025,\" sebagaimana diterbitkan dalam: Lembaran Negara Djibouti, bagian Arab. Judul dan teks Pasal 1 dan 93 diambil dari ringkasan penelitian yang disediakan oleh museum, dan museum tidak membuka halaman tersebut; pendiri mengizinkan penggunaan teks tersebut seperti yang dinyatakan pada 21 November 2026."
