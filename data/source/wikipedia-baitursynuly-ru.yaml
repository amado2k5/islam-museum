summary:
  ar: "مقالة ويكيبيديا الروسية عن أحمد بايتورسينوف ⁦(5 سبتمبر 1872 – 8 ديسمبر 1937)⁩؛ تُستخدم لوقائع الكيان فقط. توثّق علمه وأبجديته العربية للكازاخية ومسيرته في التعليم والنشر وصحيفة «قازاق» التي افتتحها في أورينبورغ سنة 1913 مع عليخان بوكيخانوف وميرجاقيب دولاتوف وإعدامه سنة 1937."
  en: "Russian Wikipedia article on Akhmet Baitursynov (5 September 1872 – 8 December 1937); used for entity facts only. It documents his scholarship, the Baitursynov Arabic alphabet for Kazakh, his teaching and publishing career, the Qazaq newspaper opened in Orenburg in 1913 with Alikhan Bukeikhanov and Mirjaqip Dulatov, and his execution in 1937."
  es: "Artículo de la Wikipedia rusa sobre Akhmet Baitursynov (5 de septiembre de 1872 - 8 de diciembre de 1937); utilizado únicamente para datos sobre la entidad. Documenta su erudición, el alfabeto árabe Baitursynov para el kazajo, su carrera docente y editorial, el periódico Qazaq fundado en Orenburg en 1913 con Alikhan Bukeikhanov y Mirjaqip Dulatov, y su ejecución en"
  fr: "Article de Wikipédia en russe sur Akhmet Baitursynov (5 septembre 1872 – 8 décembre 1937); utilisé uniquement à des fins descriptives. Il documente son érudition, l’alphabet arabe Baitursynov pour le kazakh, sa carrière d’enseignant et d’éditeur, le journal Qazaq, fondé à Orenbourg en 1913 avec Alikhan Bukeikhanov et Mirjaqip Dulatov, et son exécution en 1937."
  ur: "اخمت بیتورسینوف پر روسی ویکیپیڈیا مضمون ⁦(5 ستمبر 1872 - 8 دسمبر 1937)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی اسکالرشپ، بیتورسینوف عربی حروف تہجی، قازق کے لیے ان کے تدریسی اور اشاعتی کیریئر، قزاق اخبار کو 1913 میں اورینبرگ میں علیخان بوکیخانوف اور میرجاکیپ دلتوف کے ساتھ کھولا گیا، اور اس کی پھانسی کی دستاویز کی گئی ہے۔"
  tr: "Akhmad Baitursinov hakkında Rusça Vikipedi makalesi (5 Eylül 1872 – 8 Aralık 1937); yalnızca varlığın olayları için kullanılmıştır. Bilgisini, Kazak alfabesini, eğitim ve yayıncılık kariyerini, 1913'te Orenburg'da Alikhan Bukikhanov ve Miryakib Dolatov ile açtığı \"Kazak\" gazetesini ve 1937'deki idamını belgelemektedir."
  id: "Artikel Wikipedia Rusia tentang Akhmad Baitursinov (5 September 1872 – 8 Desember 1937); hanya digunakan untuk peristiwa entitas tersebut. Artikel ini mendokumentasikan pengetahuannya, alfabet Arab Kazakh, kariernya di bidang pendidikan dan penerbitan, serta surat kabar \"Kazakh,\" yang ia buka di Orenburg pada tahun 1913 bersama Alikhan Bukikhanov dan Mirjakib Dolatov, serta eksekusinya pada tahun 1937."
