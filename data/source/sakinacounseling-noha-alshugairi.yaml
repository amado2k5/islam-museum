reliability_note: "Her own practice website: a primary source for her identity, role, education and work, not independent corroboration (founder's sourcing ladder, 24 Oct 2026). Its About page states she was born in Cairo, Egypt, lived in Nigeria, Lebanon and Saudi Arabia before settling in the United States, took a B.A. in Zoology from Rutgers University (1986), an M.S. in Counseling from California State University, Fullerton (2007) and a Ph.D. in Islamic Studies from the Graduate Theological Foundation (2018), and has been a certified Positive Discipline trainer since 2008. It names no madhhab or sect affiliation for her personally. Read in full (home, About and Videos & Publications pages) on 26 October 2026."
