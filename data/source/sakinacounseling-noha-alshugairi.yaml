summary:
  ar: "الموقع الرسمي لعيادة سكينة كاونسلنغ في مقاطعة أورانج بكاليفورنيا، وهي عيادة المعالجة نهى الشقيري المرخّصة في علاج الزواج والأسرة والمدرّبة القيادية المعتمدة في الانضباط الإيجابي؛ يقدّم الموقع سيرتها وتعليمها وورشها في التربية والعلاقات الأسرية الموجهة للمجتمع المسلم."
  en: "The official website of Sakina Counseling in Orange County, California, the practice of Noha Alshugairi, licensed marriage and family therapist and certified Positive Discipline lead trainer; the site gives her biography, education and her workshops on parenting and family relationships for the Muslim community."
