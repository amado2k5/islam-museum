summary:
  ar: "الموقع الرسمي لعيادة سكينة كاونسلنغ في مقاطعة أورانج بكاليفورنيا، وهي عيادة المعالجة نهى الشقيري المرخّصة في علاج الزواج والأسرة والمدرّبة القيادية المعتمدة في الانضباط الإيجابي؛ يقدّم الموقع سيرتها وتعليمها وورشها في التربية والعلاقات الأسرية الموجهة للمجتمع المسلم."
  en: "The official website of Sakina Counseling in Orange County, California, the practice of Noha Alshugairi, licensed marriage and family therapist and certified Positive Discipline lead trainer; the site gives her biography, education and her workshops on parenting and family relationships for the Muslim community."
  es: "El sitio web oficial de Sakina Counseling en el condado de Orange, California, la consulta de Noha Alshugairi, terapeuta matrimonial y familiar licenciada y formadora principal certificada en Disciplina Positiva; el sitio ofrece su biografía, formación académica y sus talleres sobre crianza y relaciones familiares para la comunidad musulmana."
  fr: "Le site officiel de Sakina Counseling, cabinet de Noha Alshugairi, thérapeute conjugale et familiale agréée et formatrice principale certifiée en Discipline Positive, situé dans le comté d'Orange en Californie, présente sa biographie, sa formation et ses ateliers sur la parentalité et les relations familiales destinés à la communauté musulmane."
  ur: "اورنج کاؤنٹی، کیلیفورنیا میں سکینہ کونسلنگ کی آفیشل ویب سائٹ، نوہا الشوگیری کی پریکٹس، لائسنس یافتہ شادی اور فیملی تھراپسٹ اور تصدیق شدہ مثبت نظم و ضبط کے لیڈ ٹرینر؛ یہ سائٹ اس کی سوانح عمری، تعلیم اور مسلم کمیونٹی کے لیے والدین اور خاندانی تعلقات پر اس کی ورکشاپس پیش کرتی ہے۔"
  tr: "Orange County, California'daki Sakina Danışmanlık Kliniği'nin resmi web sitesi, lisanslı evlilik ve aile terapisti ve pozitif disiplin alanında sertifikalı liderlik eğitmeni Noha Al-Shuqairi için lisanslı bir terapist kliniğidir; site, Müslüman topluluğa yönelik biyografisi, eğitimi ve eğitim ile aile ilişkileri atölyelerini sunmaktadır."
  id: "Situs resmi Sakina Counseling Clinic di Orange County, California, adalah klinik terapis berlisensi untuk Noha Al-Shuqairi, terapis pernikahan dan keluarga berlisensi serta pelatih kepemimpinan bersertifikat dalam disiplin positif; situs ini menyajikan biografi, pendidikan, dan lokakarya tentang pendidikan dan hubungan keluarga yang ditujukan untuk komunitas Muslim."
