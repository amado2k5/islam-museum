summary:
  ar: "مقالة ويكيبيديا الإندونيسية ⁦(بعنوان برايوغو بانغيستو)⁩ عن براجوغو بانغيستو، المولود في 13 أيار 1944، مؤسس مجموعة باريتو باسيفيك؛ تذكر شركات المجموعة في البتروكيماويات والطاقة المتجددة، ومؤسسة باكتي باريتو الخيرية التي أسسها مع زوجته، ووسام نجمة الخدمة الرئيسة سنة 2019."
  en: "Indonesian Wikipedia article (titled Prayogo Pangestu) on Prajogo Pangestu, born 13 May 1944, founder of the Barito Pacific Group; it records the group's petrochemical and renewable-energy companies, the Bakti Barito Foundation he founded with his wife, and his Bintang Jasa Utama award in 2019."
  es: "Artículo de la Wikipedia en indonesio (titulado Prayogo Pangestu) sobre Prayogo Pangestu, nacido el 13 de mayo de 1944, fundador del Grupo Barito Pacific; en él se recogen las empresas petroquímicas y de energías renovables del grupo, la Fundación Bakti Barito que fundó con su esposa y su premio Bintang Jasa Utama en 2019."
  fr: "L'article de Wikipédia indonésien (intitulé Prayogo Pangestu) sur Prajogo Pangestu, né le 13 mai 1944, fondateur du groupe Barito Pacific; il recense les sociétés pétrochimiques et d'énergies renouvelables du groupe, la Fondation Bakti Barito qu'il a fondée avec sa femme, et son prix Bintang Jasa Utama en 2019."
  ur: "پراجوگو پانگسٹو پر انڈونیشیائی ویکیپیڈیا کا مضمون ⁦(عنوان پریوگو پانگسٹو)⁩، پیدائش 13 مئی 1944، باریٹو پیسفک گروپ کے بانی؛ اس میں گروپ کی پیٹرو کیمیکل اور قابل تجدید توانائی کی کمپنیوں، بکتی باریتو فاؤنڈیشن جو اس نے اپنی اہلیہ کے ساتھ قائم کی تھی، اور 2019 میں ان کے بنتانگ جاسا اوٹاما ایوارڈ کو ریکارڈ کیا ہے۔"
  tr: "Endonezya Vikipedi makalesi (Prayogo Pangisto başlıklı), 13 Mayıs 1944 doğumlu, Pareto Pacific Grubu'nun kurucusu Prajugo Pangisto'yu konu alır; grubun petrokimya ve yenilenebilir enerji şirketlerinden, eşiyle birlikte kurduğu Pakti Pareto Hayırseverlik Vakfı'ndan ve 2019'da Büyük Hizmet Yıldızı Madalyası'ndan bahseder."
  id: "Artikel Wikipedia Indonesia (berjudul Prayogo Pangisto) tentang Prajugo Pangisto, lahir 13 Mei 1944, pendiri Pareto Pacific Group; menyebutkan perusahaan petrokimia dan energi terbarukan grup tersebut, Pakti Pareto Charitable Foundation yang ia dirikan bersama istrinya, dan Major Service Star Medal pada tahun 2019."
