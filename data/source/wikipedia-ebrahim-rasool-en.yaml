summary:
  ar: مقالة ويكيبيديا الإنجليزية عن إبراهيم رسول؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 15 يوليو 1962 في المنطقة السادسة بكيب تاون «لأسرة مسلمة من أصول مختلطة إنجليزية وجاوية وهولندية وهندية»، وتعليمه، وسجله في مناهضة الأبارتايد، ورئاسته لحكومة كيب الغربية (2004–2008)، وسفارتيه لدى الولايات المتحدة ⁦(2010–2015 و2025)⁩ وطرده منها في 14 مارس 2025.
  en: English Wikipedia article on Ebrahim Rasool; used for entity facts only. It gives his birth on 15 July 1962 in District Six, Cape Town, 'to a Muslim family of mixed English-Javanese-Dutch-Indian heritage', his education, his anti-apartheid record, his Western Cape premiership (2004–2008), his ambassadorships to the United States (2010–2015 and 2025) and his expulsion from the United States on 14 March 2025.
  es: "Artículo de la Wikipedia en inglés sobre Ebrahim Rasool; utilizado únicamente para datos sobre la persona. En él se indica su nacimiento el 15 de julio de 1962 en District Six, Ciudad del Cabo, «en el seno de una familia musulmana de ascendencia mixta inglesa, javanesa, holandesa e india», su educación, su trayectoria en la lucha contra el apartheid, su mandato como primer ministro de la provincia del Cabo Occidental (2004-2008), sus embajadas en los Estados Unidos (2010-2015 y 2025) y su expulsión de los Estados Unidos el 14 de marzo de 2025."
  fr: "Article de Wikipédia en anglais sur Ebrahim Rasool; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 15 juillet 1962 dans le District Six, au Cap, « dans une famille musulmane d’origine anglo-javanaise-néerlandaise-indienne », son parcours scolaire, son engagement anti-apartheid, son poste de Premier ministre de la province du Cap-Occidental (2004-2008), ses fonctions d’ambassadeur aux États-Unis (2010-2015 et 2025) et son expulsion des États-Unis le 14 mars 2025."
  ur: "ابراہیم رسول پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 15 جولائی 1962 کو ڈسٹرکٹ سکس، کیپ ٹاؤن میں ہوئی، 'مخلوط انگریزی-جاوانی-ڈچ-ہندوستانی ورثے کے ایک مسلم خاندان میں'، اس کی تعلیم، اس کا نسل پرستی کے خلاف ریکارڈ، اس کا ویسٹرن کیپ پریمیئر شپ (2004-2008)، ریاستہائے متحدہ میں اس کی سفیر شپ اور 2015-2020 سے ان کی برطرفی (2015) ریاستہائے متحدہ امریکہ 14 مارچ 2025 کو۔"
  tr: "İbrahim Rasul hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 15 Temmuz 1962'de Cape Town'un Altıncı Bölgesi'nde \"İngiliz, Cava, Hollanda ve Hint kökenli karışık Müslüman bir ailede\" doğdu; eğitimi, apartheid karşıtı sicili, Batı Cape hükümetindeki liderliği (2004–2008) ve Amerika Birleşik Devletleri'ndeki iki büyükelçiliği (2010–2015 ve 2025) ile 14 Mart 2025'te sınır dışı edildi."
  id: "Artikel Wikipedia bahasa Inggris tentang Ibrahim Rasul; digunakan hanya untuk fakta entitas tersebut. Ia lahir pada 15 Juli 1962 di Distrik Keenam Cape Town \"dari keluarga Muslim yang berasal campuran Inggris, Jawa, Belanda, dan India,\" pendidikannya, rekam jejak anti-apartheid, kepemimpinannya di pemerintahan Western Cape (2004–2008), dan dua kedutaannya di Amerika Serikat (2010–2015 dan 2025), serta pengusirannya pada 14 Maret 2025."
