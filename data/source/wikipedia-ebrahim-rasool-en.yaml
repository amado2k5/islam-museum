  ar: مقالة ويكيبيديا الإنجليزية عن إبراهيم رسول؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 15 يوليو 1962 في المنطقة السادسة بكيب تاون «لأسرة مسلمة من أصول مختلطة إنجليزية وجاوية وهولندية وهندية»، وتعليمه، وسجله في مناهضة الأبارتايد، ورئاسته لحكومة كيب الغربية (2004–2008)، وسفارتيه لدى الولايات المتحدة (2010–2015 و2025) وطرده منها في 14 مارس 2025.
  en: English Wikipedia article on Ebrahim Rasool; used for entity facts only. It gives his birth on 15 July 1962 in District Six, Cape Town, 'to a Muslim family of mixed English-Javanese-Dutch-Indian heritage', his education, his anti-apartheid record, his Western Cape premiership (2004–2008), his ambassadorships to the United States (2010–2015 and 2025) and his expulsion from the United States on 14 March 2025.
