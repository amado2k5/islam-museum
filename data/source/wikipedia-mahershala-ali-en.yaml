reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives his birth on 16 February 1974 in Oakland, California, to Willicia Goines and Phillip Gilmore, his Christian upbringing in Hayward by his mother, an ordained Baptist minister, his basketball scholarship to Saint Mary's College of California (graduated 1996), and his MFA from New York University's Tisch School (2000). Its personal-life section states, citing a February 2017 Mic profile, that he converted to Islam in 2000, changing his surname from Gilmore to Ali, and that 'in 2001 he became an Ahmadi Muslim'; it also records the racial profiling at airports and banks he described in interviews after the September 11 attacks. Career coverage includes Crossing Jordan and The 4400, The Curious Case of Benjamin Button (2008), House of Cards, Luke Cage, the Academy Awards for Moonlight (2016) and Green Book (2018) — the first Muslim actor to win an Oscar — True Detective (2019), his season in Ramy (2020), the Blade casting of 2019 and his confirmed exit from the project in July 2026, his rap albums as Prince Ali (2006, 2007) and his guest appearance on Riz Ahmed's The Long Goodbye (2020), his marriage to Amatus Sami-Karim and their daughter (born February 2017), and his Artists4Ceasefire signature and Gaza advocacy of 2023–2025."
