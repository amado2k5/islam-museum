reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives him as Kamaru Usman, born on 11 May 1987, a Nigerian-American mixed martial artist and former freestyle and collegiate wrestler, former UFC welterweight champion and The Ultimate Fighter 21 winner, and considered one of the greatest welterweights in history. It mirrors the English article's faith statement — born to a Muslim father and Christian mother, identifying as a Muslim — naming no school; the Arabic text is a translation of the same underlying article family, so it does not count as a second independent source for any school."
