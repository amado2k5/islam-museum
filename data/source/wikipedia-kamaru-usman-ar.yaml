summary:
  ar: "مقالة ويكيبيديا العربية عن كامارو عثمان؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في نيجيريا ثم تكساس، ومسيرته في المصارعة الجامعية وفنون القتال المختلطة، وبطولته في يو إف سي لوزن الوسط، وتصنيفه من أعظم مقاتلي وزن الوسط."
  en: "Arabic Wikipedia article on Kamaru Usman; used for entity facts only. It recounts his upbringing in Nigeria and then Texas, his collegiate wrestling and MMA career, his UFC welterweight championship, and his standing as one of the greatest welterweights."
  es: "Artículo de Wikipedia en árabe sobre Kamaru Usman; se utiliza únicamente para obtener información sobre la persona. Narra su infancia en Nigeria y posteriormente en Texas, su trayectoria en la lucha libre universitaria y las artes marciales mixtas, su campeonato de peso wélter de la UFC y su reconocimiento como uno de los mejores pesos wélter de la historia."
  fr: "Article Wikipédia en arabe sur Kamaru Usman; utilisé uniquement à des fins d’information sur l’entité. Il relate son enfance au Nigeria puis au Texas, sa carrière universitaire en lutte et en MMA, son titre de champion UFC des poids welters et son statut de l’un des plus grands poids welters de tous les temps."
  ur: "کمارو عثمان پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں نائیجیریا اور پھر ٹیکساس میں اس کی پرورش، اس کی کولیجیٹ ریسلنگ اور MMA کیریئر، اس کی UFC ویلٹر ویٹ چیمپین شپ، اور سب سے بڑے ویلٹر ویٹ کے طور پر اس کی حیثیت کا ذکر کیا گیا ہے۔"
