  ar: "مقالة ويكيبيديا الإنجليزية عن فضل بوكويا تنغال، أي السيد فضل بن علوي؛ تذكر أنه وُلد نحو 1820 في مامبورام بمالابار وتوفي سنة 1901 (1318 هـ) في إسطنبول، وتسرد تعليمه وثورات مابيلا ونفيه سنة 1852 ومؤلفاته. تختلف تواريخها عن الدراسات الأكاديمية التي تعطي 1824-1900."
  en: "English Wikipedia article on Fazal Pookoya Thangal, that is Sayyid Fadl ibn Alawi; it gives his birth as c. 1820 at Mampuram in Malabar and his death as 1901 (1318 AH) at Istanbul, and sets out his education, the Mappila revolts, his exile in 1852 and his works. Its dates differ from the academic studies, which give 1824–1900."
