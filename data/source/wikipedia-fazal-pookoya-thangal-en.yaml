summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فضل بوكويا تنغال، أي السيد فضل بن علوي؛ تذكر أنه وُلد نحو 1820 في مامبورام بمالابار وتوفي سنة 1901 ⁦(1318 هـ)⁩ في إسطنبول، وتسرد تعليمه وثورات مابيلا ونفيه سنة 1852 ومؤلفاته. تختلف تواريخها عن الدراسات الأكاديمية التي تعطي 1824-1900."
  en: "English Wikipedia article on Fazal Pookoya Thangal, that is Sayyid Fadl ibn Alawi; it gives his birth as c. 1820 at Mampuram in Malabar and his death as 1901 (1318 AH) at Istanbul, and sets out his education, the Mappila revolts, his exile in 1852 and his works. Its dates differ from the academic studies, which give 1824–1900."
  es: "Artículo de la Wikipedia en inglés sobre Fazal Pookoya Thangal, es decir, Sayyid Fadl ibn Alawi; indica que nació alrededor de 1820 en Mampuram, Malabar, y falleció en 1901 (1318 AH) en Estambul. Describe su educación, las revueltas Mappila, su exilio en 1852 y sus obras. Sus fechas difieren de los estudios académicos, que sitúan su nacimiento entre 1824 y 1900."
  fr: "L'article de Wikipédia en anglais consacré à Fazal Pookoya Thangal (Sayyid Fadl ibn Alawi) situe sa naissance vers 1820 à Mampuram, dans le Malabar, et sa mort en 1901 (1318 AH) à Istanbul. Il retrace son parcours, les révoltes mappilas, son exil en 1852 et ses œuvres. Ces dates diffèrent des études universitaires qui les situent entre 1824 et 1900."
