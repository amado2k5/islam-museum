summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أنس سرور ⁦(مواليد 1983)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في غلاسكو في 14 مارس 1983 لأبوين باكستانيين مسلمين، ودراسته لطب الأسنان في جامعة غلاسكو وعمله طبيب أسنان في بيزلي، وانتخابه نائبا عن غلاسكو الوسطى سنة 2010 خلفا لوالده، ومناصبه نائبا لزعيم حزب العمال الإسكتلندي (2011-2014) وعضوا في البرلمان الإسكتلندي منذ 2016 وزعيما لحزب العمال الإسكتلندي (2021-2026)، ثم وزير دولة للتجارة ولقب بارون سرور سنة 2026."
  en: "English Wikipedia article on Anas Sarwar (born 1983); used for entity facts only. It records his birth in Glasgow on 14 March 1983 to Pakistani Muslim parents, his dentistry degree at the University of Glasgow and work as a dentist in Paisley, his election as MP for Glasgow Central in 2010 succeeding his father, his offices as deputy leader of the Scottish Labour Party (2011–2014), MSP from 2016 and leader of the Scottish Labour Party (2021–2026), and his appointment as Minister of State for Trade and creation as Baron Sarwar in 2026."
  es: "Artículo de la Wikipedia en inglés sobre Anas Sarwar (nacido en 1983); utilizado únicamente para datos sobre la persona. En él se registra su nacimiento en Glasgow el 14 de marzo de 1983, hijo de padres musulmanes pakistaníes, su licenciatura en odontología por la Universidad de Glasgow y su trabajo como dentista en Paisley, su elección como diputado por Glasgow Central en 2010, sucediendo a su padre, sus cargos como subdirector del Partido Laborista Escocés (2011-2014), miembro del Parlamento escocés desde 2016 y líder del Partido Laborista Escocés (2021-2026), y su nombramiento como Ministro de Estado de Comercio y su creación como Barón Sarwar en 2026."
  fr: "Article de Wikipédia en anglais sur Anas Sarwar (né en 1983); utilisé uniquement pour les informations relatives à l’entité. Il relate sa naissance à Glasgow le 14 mars 1983 de parents musulmans pakistanais, son diplôme de chirurgie dentaire à l’Université de Glasgow et son travail de dentiste à Paisley, son élection comme député de Glasgow Central en 2010, succédant à son père, ses fonctions de chef adjoint du Parti travailliste écossais (2011-2014), de membre du Parlement écossais à partir de 2016 et de chef du Parti travailliste écossais (2021-2026), et sa nomination comme ministre d’État au Commerce et sa création en tant que baron Sarwar en 2026."
  ur: "انس سرور ⁦(پیدائش 1983)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں گلاسگو میں ان کی پیدائش 14 مارچ 1983 کو پاکستانی مسلمان والدین کے نام درج ہے، گلاسگو یونیورسٹی میں اس کی دندان سازی کی ڈگری اور پیسلے میں ڈینٹسٹ کے طور پر کام، 2010 میں گلاسگو سینٹرل کے لیے اپنے والد کے بعد ایم پی کے طور پر انتخاب، سکاٹش لیبر پارٹی کے ڈپٹی لیڈر کے طور پر ان کے دفاتر ⁦(2011–1620 سے SSP2011)⁩ کے رہنما لیبر پارٹی (2021–2026)، اور 2026 میں بطور وزیر تجارت اور تخلیق کے وزیر مملکت کے طور پر ان کی تقرری۔"
  tr: "Anas Sarwar hakkında İngilizce Wikipedia makalesi (1983 doğumlu); yalnızca varlık gerçekleri için kullanılır. 14 Mart 1983'te Glasgow'da Pakistanlı Müslüman ebeveynlerin çocuğu olarak doğduğu, Glasgow Üniversitesi'nde diş hekimliği okuduğu, Paisley'de diş hekimi olarak çalıştığı, 2010'da babasının yerine Central Glasgow milletvekili seçildiği, İskoçya İşçi Partisi Başkan Yardımcısı (2011-2014), 2016'dan beri İskoçya Parlamentosu Üyesi, İskoçya İşçi Partisi lideri (2021-2026), ardından Ticaret Bakanı Devlet Bakanı olarak görev yaptığı ve 2026'da Baron Sarwar unvanını aldığı belirtilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Anas Sarwar (lahir 1983); hanya digunakan untuk fakta entitas. Ia disebutkan lahir di Glasgow pada 14 Maret 1983, dari orang tua Muslim Pakistan, belajar kedokteran gigi di University of Glasgow, bekerja sebagai dokter gigi di Paisley, terpilih sebagai MP untuk Central Glasgow pada 2010 menggantikan ayahnya, menjabat sebagai Wakil Pemimpin Partai Buruh Skotlandia (2011-2014), Anggota Parlemen Skotlandia sejak 2016, pemimpin Partai Buruh Skotlandia (2021-2026), kemudian Menteri Negara untuk Perdagangan dan diberi gelar Baron Sarwar pada 2026."
