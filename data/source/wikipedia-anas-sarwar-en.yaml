  ar: "مقالة ويكيبيديا الإنجليزية عن أنس سرور (مواليد 1983)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في غلاسكو في 14 مارس 1983 لأبوين باكستانيين مسلمين، ودراسته لطب الأسنان في جامعة غلاسكو وعمله طبيب أسنان في بيزلي، وانتخابه نائبا عن غلاسكو الوسطى سنة 2010 خلفا لوالده، ومناصبه نائبا لزعيم حزب العمال الإسكتلندي (2011-2014) وعضوا في البرلمان الإسكتلندي منذ 2016 وزعيما لحزب العمال الإسكتلندي (2021-2026)، ثم وزير دولة للتجارة ولقب بارون سرور سنة 2026."
  en: "English Wikipedia article on Anas Sarwar (born 1983); used for entity facts only. It records his birth in Glasgow on 14 March 1983 to Pakistani Muslim parents, his dentistry degree at the University of Glasgow and work as a dentist in Paisley, his election as MP for Glasgow Central in 2010 succeeding his father, his offices as deputy leader of the Scottish Labour Party (2011–2014), MSP from 2016 and leader of the Scottish Labour Party (2021–2026), and his appointment as Minister of State for Trade and creation as Baron Sarwar in 2026."
