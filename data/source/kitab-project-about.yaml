summary:
  ar: "صفحة «عن المشروع» في موقع KITAB كما قُرئت في 7 نوفمبر 2026، رسالة من سارة بوين سافانت: مشروع «المعرفة وتقنية المعلومات والكتاب العربي» لكشف نقل المؤلفين العرب عن الكتب السابقة، بتمويل من مجلس البحوث الأوروبي ومكتبة قطر الوطنية، ويتواصل منذ يناير 2026 في «KITAB-Transform» لكشف إعادة الصياغة والترجمة في مدونة OpenITI."
  en: "The About page of KITAB as read on 7 November 2026, a message from Sarah Bowen Savant: the project 'Knowledge, Information Technology, and the Arabic Book', which detects how Arabic authors copied from earlier works, funded by the European Research Council and the Qatar National Library, continuing from January 2026 as KITAB-Transform to detect paraphrase and translation across the OpenITI corpus."
  ur: "KITAB کا «تعارف» صفحہ، 7 نومبر 2026 کو پڑھا گیا، سارہ بوون ساوانت کا پیغام: «علم، انفارمیشن ٹیکنالوجی اور عربی کتاب» منصوبہ، جو یہ دیکھتا ہے کہ عربی مصنفین نے پچھلی کتابوں سے کیسے نقل کیا؛ یورپی ریسرچ کونسل اور قطر نیشنل لائبریری کی مالی مدد؛ جنوری 2026 سے KITAB-Transform کے نام سے OpenITI مجموعے میں دوبارہ بیان اور ترجمے کی شناخت۔"
