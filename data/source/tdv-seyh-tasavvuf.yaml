label:
  ar: "شيخ ⁦(التصوف)⁩ — موسوعة TDV الإسلامية ⁦(أونغورن)⁩"
  en: "ŞEYH, tasavvuf section (the Sufi shaykh) — TDV İslâm Ansiklopedisi (Reşat Öngören)"
summary:
  ar: "قسم التصوف من مدخل «شيخ» في موسوعة TDV الإسلامية: الشيخ مرشداً ومربّياً في التصوف، شروط الشيخ وأصنافه ⁦(شيخ التعليم والصحبة والتربية)⁩، الإجازة ولبس الخرقة وسيلسيلة الفيض، والأسماء الإقليمية للشيخ من خواجه وأتا وبابا إلى دده بابا."
  en: "The tasavvuf section of the TDV İslâm Ansiklopedisi entry ŞEYH: the shaykh as guide and trainer of murids, the required qualities and kinds of shaykh (ta'lim, sohbet and terbiye shaykhs), the ijaza, the investiture with the cloak and the chain of feyz, and the regional names of the office from hoca and ata to baba and dede-baba."
  es: "La sección tasavvuf de la entrada ŞEYH de la TDV İslâm Ansiklopedisi: el shaykh como guía y entrenador de murids, las cualidades requeridas y los tipos de shaykh (ta'lim, sohbet y terbiye shaykhs), la ijaza, la investidura con la capa y la cadena de feyz, y los nombres regionales del cargo desde hoca y ata hasta baba y dede-baba."
  fr: "La section tasavvuf de l'entrée ŞEYH de TDV İslâm Ansiklopedisi: le cheikh comme guide et formateur des murids, les qualités requises et les types de cheikh (cheikhs ta'lim, sohbet et terbiye), l'ijaza, l'investiture avec le manteau et la chaîne de feyz, et les noms régionaux de la fonction de hoca et ata à baba et dede-baba."
  ur: "TDV İslâm Ansiklopedisi entry ŞEYH کا تصوف سیکشن: مریدوں کے رہنما اور ٹرینر کے طور پر شیخ، شیخ کی مطلوبہ صفات اور قسمیں ⁦(تعلیم، صحبت اور تربیہ شیخ)⁩، اعجاز، چادر کے ساتھ سرمایہ کاری اور بعثت سے لے کر حوزہ کا سلسلہ اور دفتر کا سلسلہ ڈیڈ بابا"
