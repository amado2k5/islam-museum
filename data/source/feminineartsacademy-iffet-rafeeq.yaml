summary:
  ar: "صفحة أكاديمية الفنون الأنثوية التي تُدرّس فيها عفت رفيق؛ تصفها معلمة علوم شرعية وعافية شمولية متخصصة في صحة الدورة الشهرية والعلاقة الزوجية في الإسلام، درست العلوم الإسلامية في معاهد رائدة داخل بلدها وخارجه، ودورتها «الفصول الداخلية» مشهورة عالميًا بأكثر من ألف طالبة في أكثر من خمس عشرة دولة، وُلدت ونشأت في المملكة المتحدة من أصل جنوب آسيوي، وتقيم حاليًا في كيب تاون بجنوب أفريقيا، وهي شريكة مؤسسة لمعهد وتطبيق «الفانوس الأزرق»."
  en: "The Feminine Arts Academy page for Ustadha Iffet Rafeeq. It describes her as a dedicated teacher of sacred sciences and holistic wellness specialising in womb cycle health and intimacy in Islam, who has studied Islamic sciences at leading institutes nationally and internationally; her 'Season Within' course is taught to over 1,000 students across more than 15 countries; she was born and raised in the UK of South Asian heritage and currently resides in Cape Town, South Africa; and she is a co-founder of the Blue Lantern Institute and app."
