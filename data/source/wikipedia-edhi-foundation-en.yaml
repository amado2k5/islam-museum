summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مؤسسة إيدهي؛ تُستخدم لوقائع الكيان فقط. تروي تأسيس عبد الستار إيدهي لها وخلفية بلقيس إيدهي له في الإشراف، وشبكتها من المراكز والإسعاف والملاجئ في باكستان والخارج، وتصف فيصل إيدهي بأنه رئيس المنظمة الحالي وتروي رسالته في 23 أبريل 2021 إلى رئيس وزراء الهند عارضًا دخول الهند بخمسين سيارة إسعاف لمساعدة جهود مكافحة جائحة كورونا."
  en: "English Wikipedia article on the Edhi Foundation; used for entity facts only. It recounts the foundation's founding by Abdul Sattar Edhi, Bilquis Edhi's oversight of its maternity and adoption services, its nationwide network of centres, ambulances and shelters and its international offices, names Faisal Edhi as the organisation's current head, and records his 23 April 2021 letter to the Prime Minister of India offering to enter India with 50 ambulances and volunteers to assist against the Covid-19 pandemic."
