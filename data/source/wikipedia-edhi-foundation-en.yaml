summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مؤسسة إيدهي؛ تُستخدم لوقائع الكيان فقط. تروي تأسيس عبد الستار إيدهي لها وخلفية بلقيس إيدهي له في الإشراف، وشبكتها من المراكز والإسعاف والملاجئ في باكستان والخارج، وتصف فيصل إيدهي بأنه رئيس المنظمة الحالي وتروي رسالته في 23 أبريل 2021 إلى رئيس وزراء الهند عارضًا دخول الهند بخمسين سيارة إسعاف لمساعدة جهود مكافحة جائحة كورونا."
  en: "English Wikipedia article on the Edhi Foundation; used for entity facts only. It recounts the foundation's founding by Abdul Sattar Edhi, Bilquis Edhi's oversight of its maternity and adoption services, its nationwide network of centres, ambulances and shelters and its international offices, names Faisal Edhi as the organisation's current head, and records his 23 April 2021 letter to the Prime Minister of India offering to enter India with 50 ambulances and volunteers to assist against the Covid-19 pandemic."
  es: "Artículo de la Wikipedia en inglés sobre la Fundación Edhi; utilizado únicamente para obtener información sobre la entidad. Relata la fundación de la organización por Abdul Sattar Edhi, la supervisión de Bilquis Edhi de sus servicios de maternidad y adopción, su red nacional de centros, ambulancias y refugios, y sus oficinas internacionales. Menciona a Faisal Edhi como el actual director de la organización y recoge su carta del 23 de abril de 2021 al Primer Ministro de la India, en la que ofrecía entrar en el país con 50 ambulancias y voluntarios para ayudar a combatir la pandemia de Covid-19."
  fr: "Article de Wikipédia en anglais sur la Fondation Edhi; utilisé uniquement à des fins d'information sur l'entité. Il relate la création de la fondation par Abdul Sattar Edhi, la supervision par Bilquis Edhi de ses services de maternité et d'adoption, son réseau national de centres, d'ambulances et de refuges, ainsi que ses bureaux internationaux. Il mentionne Faisal Edhi comme l'actuel directeur de l'organisation et relate sa lettre du 23 avril 2021 adressée au Premier ministre indien, dans laquelle il proposait d'envoyer en Inde 50 ambulances et des volontaires pour lutter contre la pandémie de Covid-19."
  ur: "ایدھی فاؤنڈیشن پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں عبدالستار ایدھی کے ذریعہ فاؤنڈیشن کی بنیاد، بلقیس ایدھی کی زچگی اور گود لینے کی خدمات کی نگرانی، اس کے مراکز، ایمبولینسز اور پناہ گاہوں اور اس کے بین الاقوامی دفاتر کے ملک گیر نیٹ ورک، تنظیم کے موجودہ سربراہ کے طور پر فیصل ایدھی کا نام درج کیا گیا ہے، اور 23 اپریل 2021 کو بھارت کے وزیر اعظم کو پیش کردہ خط اور 2020 میں بھارت کے وزیر اعظم کو پیش کیے گئے خط کو ریکارڈ کیا گیا ہے۔ CoVID-19 وبائی مرض کے خلاف مدد کے لیے رضاکار۔"
  tr: "Edhi Vakfı hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Bu makale, Abdul Sattar Edhi'nin kuruluşunu ve Balqis Edhi'nin onu denetleme geçmişini, ayrıca Pakistan ve yurt dışındaki merkezleri, ambulanslar ve barınaklar ağını anlatmaktadır. Faisal Edhi'yi kuruluşun mevcut başkanı olarak tanımlar ve 23 Nisan 2021'de Hindistan Başbakanı'na yazdığı mektubu aktararak, koronavirüs pandemisiyle mücadele çabalarına yardımcı olmak için elli ambulansla Hindistan'a girmeyi teklif etmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Yayasan Edhi hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan pendirian Abdul Sattar Edhi dan latar belakang Balqis Edhi dalam mengawasinya, serta jaringan pusat, ambulans, dan tempat penampungannya di Pakistan dan luar negeri. Artikel tersebut menggambarkan Faisal Edhi sebagai kepala organisasi saat ini dan menceritakan suratnya pada 23 April 2021 kepada Perdana Menteri India, menawarkan untuk masuk ke India dengan lima puluh ambulans guna membantu upaya memerangi pandemi virus corona."
