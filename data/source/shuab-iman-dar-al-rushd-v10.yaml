summary:
  ar: "الطبعة الأولى لدار الرشد بالرياض سنة 1423هـ/2003م للجزء العاشر من الجامع لشعب الإيمان للبيهقي، بتحقيق مختار أحمد الندوي؛ يضم الأبواب من الخمسين إلى السابع والخمسين."
  en: "First edition (Riyadh, Dar al-Rushd, 1423 AH / 2003 CE) of volume 10 of al-Bayhaqi's al-Jami' li-Shu'ab al-Iman, edited by Mukhtar Ahmad al-Nadawi; this volume covers branches 50 to 57."
  es: "Primera edición (Riad, Dar al-Rushd, 1423 AH / 2003 CE) del volumen 10 de al-Jami' li-Shu'ab al-Iman de al-Bayhaqi, editado por Mukhtar Ahmad al-Nadawi; este volumen cubre las ramas 50 a 57."
  fr: "Première édition (Riyad, Dar al-Rushd, 1423 AH / 2003 CE) du volume 10 d'al-Jami' li-Shu'ab al-Iman d'al-Bayhaqi, édité par Mukhtar Ahmad al-Nadawi; ce volume couvre les branches 50 à 57."
  ur: "پہلا ایڈیشن ⁦(ریاض، دارالرشد، 1423 ہجری / 2003 عیسوی)⁩ البیہقی کی الجامع لِشعب الایمان کی جلد 10 کا، مختار احمد ندوی کی تدوین؛ یہ حجم 50 سے 57 شاخوں پر محیط ہے۔"
  tr: "Dar Al-Rushd'un ilk baskısı, 1423 Hicri / 2003 yılında Riyad'da Al-Jami' li-Shu'ab Al-Iman adlı eserin onuncu bölümü için Al-Bayhaqi tarafından yayımlanmıştır, Mukhtar Ahmad Al-Nadwi tarafından düzenlenmiştir; elli ile elli yedi arasında bölümler içerir."
  id: "Edisi pertama Dar Al-Rushd di Riyadh pada tahun 1423 H / 2003 M untuk bagian kesepuluh Al-Jami' li-Shu'ab Al-Iman oleh Al-Bayhaqi, disunting oleh Mukhtar Ahmad Al-Nadwi; memuat bab dari lima puluh hingga lima puluh tujuh."
