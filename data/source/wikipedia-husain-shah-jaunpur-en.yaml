summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسين شاه الشرقي، سادس سلاطين جونبور وآخرهم؛ خلف أخاه محمد شاه سنة 1458، وحارب بهلول لودي صاحب دلهي حتى طُرد من جونبور سنة 1479، ولجأ إلى كهلغاون في بهار حيث توفي سنة 1505 ودُفن في جونبور؛ وتذكر المقالة اهتمامه بالفن والموسيقى وإعجابه بمحمد الجونبوري مدّعي المهدية."
  en: "English Wikipedia article on Husain Shah Sharqi, sixth and last sultan of Jaunpur; he succeeded his brother Muhammad Shah in 1458, warred with Bahlul Lodi of Delhi until he was driven from Jaunpur in 1479, took asylum at Kahalgaon in Bihar, died there in 1505 and was buried at Jaunpur; the article also records his interest in art and music and his admiration for the Mahdi claimant Muhammad Jaunpuri."
  es: "Artículo de la Wikipedia en inglés sobre Husain Shah Sharqi, sexto y último sultán de Jaunpur; sucedió a su hermano Muhammad Shah en 1458, guerreó con Bahlul Lodi de Delhi hasta que fue expulsado de Jaunpur en 1479, se refugió en Kahalgaon en Bihar, murió allí en 1505 y fue enterrado en Jaunpur; el artículo también recoge su interés por el arte y la música y su admiración por el pretendiente al Mahdi, Muhammad Jaunpuri."
  fr: "Article de Wikipédia en anglais sur Husain Shah Sharqi, sixième et dernier sultan de Jaunpur; il succéda à son frère Muhammad Shah en 1458, fit la guerre à Bahlul Lodi de Delhi jusqu’à ce qu’il soit chassé de Jaunpur en 1479, prit asile à Kahalgaon au Bihar, y mourut en 1505 et fut enterré à Jaunpur; l’article mentionne également son intérêt pour l’art et la musique et son admiration pour le prétendant au titre de Mahdi, Muhammad Jaunpuri."
  ur: "جونپور کے چھٹے اور آخری سلطان حسین شاہ شرقی پر انگریزی ویکیپیڈیا کا مضمون؛ اس نے 1458 میں اپنے بھائی محمد شاہ کی جانشینی کی، دہلی کے بہلول لودی کے ساتھ جنگ کی یہاں تک کہ اسے جونپور سے 1479 میں بھگا دیا گیا، بہار کے کہلگاؤں میں پناہ لی، وہیں 1505 میں وفات پائی اور جونپور میں دفن ہوئے۔ مضمون میں آرٹ اور موسیقی میں ان کی دلچسپی اور مہدی کے دعویدار محمد جونپوری کے لیے ان کی تعریف بھی درج ہے۔"
