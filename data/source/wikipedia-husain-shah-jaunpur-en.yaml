reliability_note: "The only encyclopedia article on this sultan in any language edition (Wikidata lists no other sitelink), read in full (text and wikitext) on 1 November 2026. Its narrative rests on the standard scholarly works it cites — Saeed's The Sharqi of Jaunpur (1972), Majumdar's The Delhi Sultanate (2006) and Hussain's Shiraz-i Hind (2017). Its infobox gives his reign as 1458–1494 while its own narrative has him expelled from Jaunpur in 1479 and a Lodi prince installed there in 1486, so the infobox figure is preserved as a variant, not asserted. The article files him under 'Year of birth unknown' and gives no birth date; its one religious-biographical claim, his admiration for Muhammad Jaunpuri, is flagged in the article itself as needing a citation (May 2024) and is carried with that flag disclosed. It names no religion or school for him."
