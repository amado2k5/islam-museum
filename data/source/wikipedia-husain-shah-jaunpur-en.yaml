  ar: "مقالة ويكيبيديا الإنجليزية عن حسين شاه الشرقي، سادس سلاطين جونبور وآخرهم؛ خلف أخاه محمد شاه سنة 1458، وحارب بهلول لودي صاحب دلهي حتى طُرد من جونبور سنة 1479، ولجأ إلى كهلغاون في بهار حيث توفي سنة 1505 ودُفن في جونبور؛ وتذكر المقالة اهتمامه بالفن والموسيقى وإعجابه بمحمد الجونبوري مدّعي المهدية."
  en: "English Wikipedia article on Husain Shah Sharqi, sixth and last sultan of Jaunpur; he succeeded his brother Muhammad Shah in 1458, warred with Bahlul Lodi of Delhi until he was driven from Jaunpur in 1479, took asylum at Kahalgaon in Bihar, died there in 1505 and was buried at Jaunpur; the article also records his interest in art and music and his admiration for the Mahdi claimant Muhammad Jaunpuri."
