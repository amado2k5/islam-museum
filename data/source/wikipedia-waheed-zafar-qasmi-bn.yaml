summary:
  ar: "مقالة ويكيبيديا البنغالية عن وحيد ظفر قاسمي؛ يعطي صندوقها ميلاده سنة 1962 بأوتار براديش بالهند ومهنته قارئاً وناعتاً وتصف مسيرته في المسابقات والإذاعة وجائزة فخر الأداء 1984."
  en: "Bengali Wikipedia article on Waheed Zafar Qasmi; its infobox gives his birth in 1962 in Uttar Pradesh, India, and his occupations as qari and naat reciter, and the text covers his competition career, Radio Pakistan work and the 1984 Pride of Performance."
  es: "Artículo de Wikipedia en bengalí sobre Waheed Zafar Qasmi; su ficha informativa indica que nació en 1962 en Uttar Pradesh, India, y que se desempeñó como recitador de qari y naat. El texto abarca su trayectoria en concursos, su trabajo en Radio Pakistán y el premio Pride of Performance de 1984."
  fr: "Article de Wikipédia en bengali sur Waheed Zafar Qasmi; son infobox indique sa naissance en 1962 dans l'Uttar Pradesh, en Inde, et ses professions de qari et de récitant de naat, et le texte couvre sa carrière de compétiteur, son travail à Radio Pakistan et le Pride of Performance de 1984."
  ur: "وحید ظفر قاسمی پر بنگالی ویکیپیڈیا کا مضمون؛ اس کا معلوماتی باکس ان کی پیدائش 1962 میں اتر پردیش، ہندوستان میں کرتا ہے، اور قاری اور نعت خوانی کے طور پر ان کے مشاغل، اور متن میں ان کے مسابقتی کیریئر، ریڈیو پاکستان کے کام اور 1984 کے پرائیڈ آف پرفارمنس کا احاطہ کیا گیا ہے۔"
  tr: "Waheed Zafar Qasmi hakkında Bengalce Wikipedia makalesi; fonu onun 1962'de Hindistan'ın Uttar Pradesh kentinde doğduğunu ve şarkıcı ve anlatıcı olarak mesleğini anlatıyor; yarışmalar, radyo ve 1984'teki Performans Gururu Ödülü'nü anlatıyor."
  id: "Artikel Wikipedia Bengali tentang Waheed Zafar Qasmi; dana yang diterbitkan menceritakan kelahirannya pada tahun 1962 di Uttar Pradesh, India, dan profesinya sebagai penyanyi serta narator, yang menggambarkan kariernya di kompetisi, radio, dan Penghargaan Kebanggaan Pertunjukan pada tahun 1984."
