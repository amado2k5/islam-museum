summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كامران وفا؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في طهران سنة 1960، ودكتوراه برينستون بإشراف إدوارد ويتن، ومسيرته في هارفارد، ونظرية F، وجوائزه ومنها جائزة مصطفى 2021 وتنصيبه أستاذًا جامعيًا ⁦(تيمكين)⁩ سنة 2025."
  en: "English Wikipedia article on Cumrun Vafa; used for entity facts only. It recounts his birth in Tehran in 1960, his Princeton doctorate under Edward Witten, his Harvard career, F-theory, and his awards, including the 2021 Mustafa Prize and his 2025 appointment as Timken University Professor."
  es: "Artículo de la Wikipedia en inglés sobre Cumrun Vafa; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Teherán en 1960, su doctorado en Princeton bajo la dirección de Edward Witten, su trayectoria en Harvard, la teoría F y sus premios, entre los que destacan el Premio Mustafa de 2021 y su nombramiento como profesor universitario Timken en 2025."
  fr: "Article Wikipédia en anglais sur Cumrun Vafa; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Téhéran en 1960, son doctorat à Princeton sous la direction d’Edward Witten, sa carrière à Harvard, la théorie F et ses distinctions, dont le prix Mustafa 2021 et sa nomination en 2025 comme professeur universitaire Timken."
  ur: "کمرون وفا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1960 میں تہران میں ان کی پیدائش، ایڈورڈ وٹن کے تحت ان کی پرنسٹن ڈاکٹریٹ، ان کا ہارورڈ کیریئر، ایف تھیوری، اور ان کے ایوارڈز، بشمول 2021 مصطفی انعام اور 2025 میں ٹمکن یونیورسٹی کے پروفیسر کے طور پر ان کی تقرری کا ذکر کرتا ہے۔"
  tr: "Kamran Wafa hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. 1960'ta Tahran'daki doğumunu, Princeton'da Edward Witten'in danışmanlığında doktora çalışmasını, Harvard'daki kariyerini, F teorisini ve 2021'de Mustafa Ödülü ile 2025'te üniversite profesörü (Temkin) olarak atanması gibi ödüllerini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Kamran Wafa; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya di Teheran pada tahun 1960, gelar PhD di Princeton di bawah bimbingan Edward Witten, kariernya di Harvard, teori F, dan penghargaan yang diraihnya termasuk Mustafa Prize pada 2021 dan pengangkatannya sebagai profesor universitas (Temkin) pada 2025."
