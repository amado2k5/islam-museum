summary:
  ar: "مقالة ويكيبيديا الأردية عن مختار أحمد أنصاري؛ تُستخدم لوقائع الكيان فقط. تروي ريادته القومية ورئاسته المؤتمر الوطني الهندي والرابطة الإسلامية، ودوره في تأسيس الجامعة الملية الإسلامية وشيخوخته لها من 1928 إلى 1936 خلفًا لحكيم أجمل خان."
  en: "Urdu Wikipedia article on Mukhtar Ahmed Ansari; used for entity facts only. It recounts his nationalist leadership and his presidencies of the Indian National Congress and the Muslim League, and his part in founding Jamia Millia Islamia and his chancellorship of it from 1928 to 1936 in succession to Hakim Ajmal Khan."
  es: "Artículo de Wikipedia en urdu sobre Mukhtar Ahmed Ansari; utilizado únicamente para datos sobre la persona. Relata su liderazgo nacionalista y sus presidencias del Congreso Nacional Indio y la Liga Musulmana, así como su participación en la fundación de Jamia Millia Islamia y su rectorado de la misma entre 1928 y 1936, sucediendo a Hakim Ajmal Khan."
  fr: "Article de Wikipédia en ourdou sur Mukhtar Ahmed Ansari; utilisé uniquement à des fins d’information sur l’entité. Il relate son rôle de leader nationaliste, ses présidences du Congrès national indien et de la Ligue musulmane, ainsi que sa participation à la fondation de Jamia Millia Islamia et sa fonction de chancelier de cette université de 1928 à 1936, succédant à Hakim Ajmal Khan."
  ur: "مختار احمد انصاری پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی قوم پرست قیادت اور انڈین نیشنل کانگریس اور مسلم لیگ کی صدارتوں اور جامعہ ملیہ اسلامیہ کے قیام اور حکیم اجمل خان کے بعد 1928 سے 1936 تک اس کی چانسلر شپ میں ان کے کردار کا ذکر ہے۔"
  tr: "Mukhtar Ahmad Ansari hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Milliyetçi liderliğini, Hindistan Ulusal Kongresi ve Müslüman Birliği başkanlığını, Millia İslam Üniversitesi'nin kuruluşundaki rolünü ve 1928-1936 yılları arasında Hakim Ajmal Khan'ın yerine geçen liderliğini anlatır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Mukhtar Ahmad Ansari; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kepemimpinan nasionalisnya, kepresidenannya di Kongres Nasional India dan Liga Muslim, perannya dalam mendirikan Universitas Islam Millia, serta kepemimpinannya dari tahun 1928 hingga 1936, menggantikan Hakim Ajmal Khan."
