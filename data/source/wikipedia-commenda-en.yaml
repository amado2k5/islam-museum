summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الكومندا؛ لوقائع الكيان فقط: عقد متوسطي إيطالي القرن الثالث عشر وشكل مبكر للشراكة المحدودة، أحادية ⁦(ربح 3/4-1/4 والمخاطرة على المستثمر)⁩ وثنائية ⁦(2/3-1/3 رأساً ومناصفة ربحاً)⁩، تسميتها كوليغنسيا في البندقية وسوسييتس في جنوة، أول ذكر 1073 وسبقه استعمال من القرن العاشر، قانون مرسيليا 1253، ومرشحو الأصل ⁦(تپوتم البابلية وسوسييتس وفوينس ناوتيكم وخريوكوينونيا وإسقا وقراض)⁩ مع قرب القراض الأشد لعدم تحمل العامل الخسارة."
  en: "English Wikipedia article on the commenda; entity facts only: the thirteenth-century Italian contract and early limited partnership, its unilateral form (3/4-1/4 profit split, loss on the investor) and bilateral form (2/3-1/3 capital, even profit), the Venetian collegantia and Genoese societas names, the 1073 first mention with tenth-century use, the 1253 Statutes of Marseille, and the candidate origins (Babylonian tapputum, Roman societas and foenus nauticum, Byzantine chreokoinonia, the Jewish isqa, the Muslim qirad) with the qirad standing closest because the travelling partner bears no risk."
  es: "Artículo de la Wikipedia en inglés sobre la commenda; solo datos de la entidad: el contrato italiano del siglo XIII y la primera sociedad limitada, su forma unilateral (reparto de beneficios de 3/4-1/4, pérdida para el inversor) y forma bilateral (capital de 2/3-1/3, beneficio igual), los nombres de collegantia veneciana y societas genovesa, la primera mención de 1073 con uso en el siglo X, los Estatutos de Marsella de 1253 y los orígenes candidatos (taputum babilónico, societas y foenus nauticum romanos, chreokoinonia bizantina, isqa judía, qirad musulmán) siendo el qirad el más cercano porque el socio viajero no corre ningún riesgo."
  fr: "Article de Wikipédia en anglais sur la commenda; faits relatifs à l’entité uniquement: le contrat italien du XIIIe siècle et les débuts de la société en commandite, sa forme unilatérale (répartition des bénéfices de 3/4 à 1/4, perte pour l’investisseur) et sa forme bilatérale (2/3 à 1/3 du capital, bénéfices égaux), les noms vénitiens collegantia et génois societas, la première mention en 1073 avec un usage au Xe siècle, les Statuts de Marseille de 1253 et les origines candidates (tapputum babylonien, societas et foenus nauticum romains, chreokoinonia byzantine, isqa juive, qirad musulmane) avec le qirad comme étant le plus proche car le partenaire voyageur ne supporte aucun risque."
  ur: "Commenda پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: تیرہویں صدی کا اطالوی معاہدہ اور ابتدائی محدود شراکت داری، اس کی یکطرفہ شکل ⁦(3/4-1/4 منافع کی تقسیم، سرمایہ کار پر نقصان)⁩ اور دو طرفہ شکل ⁦(2/3-1/3 سرمایہ، حتی کہ منافع)⁩، وینیشین کولیگینٹیا اور جینویس سوسائٹی کے نام، پہلے 1027، 1027 کے استعمال کے ساتھ مارسیل کے قوانین، اور امیدوار کی ابتداء ⁦(بیبیلونی ٹیپپٹم، رومن سوسیٹاس اور فینس ناٹیکم، بازنطینی کریوکوئنیا، یہودی اسقاء، مسلم قراد)⁩ قراد کے ساتھ قریب ترین کھڑے ہیں کیونکہ سفر کرنے والے ساتھی کو کوئی خطرہ نہیں ہے۔"
  tr: "Omanda hakkında İngilizce Vikipedi makalesi; sadece varlık bilgileri için: 13. yüzyıl İtalyan Akdeniz sözleşmesi ve erken bir sınırlı ortaklık biçimi, monolitik (kâr 3/4-1/4 ve yatırımcı için risk) ve ikili (2/3-1/3 baş ve paylaşılan kâr), Venedik'te Colligencia ve Cenova'da Societes olarak adlandırılan, ilk adı 1073'te geçilmiş ve onuncu yüzyıldan itibaren kullanılmıştır, 1253 Marsilya Kanunu ve zararı karşılayamadıkları için en yakın krediye sahip orijinal adaylar (Babil Teputum, Sosietes, Fuence Nauticum, Cherioquinnia, Esqa ve Qard)."
  id: "Artikel Wikipedia bahasa Inggris tentang comanda; hanya untuk fakta entitas: kontrak Mediterania Italia abad ke-13 dan bentuk awal kemitraan terbatas, monolitik (keuntungan 3/4-1/4 dan risiko bagi investor) dan biner (2/3-1/3 kepala dan keuntungan bersama), bernama Colligencia di Venesia dan Societes di Genoa, yang pertama kali disebutkan pada 1073 dan didahului oleh penggunaan sejak abad kesepuluh, Kode Marseille tahun 1253, serta kandidat asli (Babylonian Teputum, Sosietes, Fuence Nauticum, Cherioquinnia, Esqa dan Qard) dengan pinjaman terdekat karena ketidakmampuan menanggung kerugian."
