summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الكومندا؛ لوقائع الكيان فقط: عقد متوسطي إيطالي القرن الثالث عشر وشكل مبكر للشراكة المحدودة، أحادية ⁦(ربح 3/4-1/4 والمخاطرة على المستثمر)⁩ وثنائية ⁦(2/3-1/3 رأساً ومناصفة ربحاً)⁩، تسميتها كوليغنسيا في البندقية وسوسييتس في جنوة، أول ذكر 1073 وسبقه استعمال من القرن العاشر، قانون مرسيليا 1253، ومرشحو الأصل ⁦(تپوتم البابلية وسوسييتس وفوينس ناوتيكم وخريوكوينونيا وإسقا وقراض)⁩ مع قرب القراض الأشد لعدم تحمل العامل الخسارة."
  en: "English Wikipedia article on the commenda; entity facts only: the thirteenth-century Italian contract and early limited partnership, its unilateral form (3/4-1/4 profit split, loss on the investor) and bilateral form (2/3-1/3 capital, even profit), the Venetian collegantia and Genoese societas names, the 1073 first mention with tenth-century use, the 1253 Statutes of Marseille, and the candidate origins (Babylonian tapputum, Roman societas and foenus nauticum, Byzantine chreokoinonia, the Jewish isqa, the Muslim qirad) with the qirad standing closest because the travelling partner bears no risk."
  es: "Artículo de la Wikipedia en inglés sobre la commenda; solo datos de la entidad: el contrato italiano del siglo XIII y la primera sociedad limitada, su forma unilateral (reparto de beneficios de 3/4-1/4, pérdida para el inversor) y forma bilateral (capital de 2/3-1/3, beneficio igual), los nombres de collegantia veneciana y societas genovesa, la primera mención de 1073 con uso en el siglo X, los Estatutos de Marsella de 1253 y los orígenes candidatos (taputum babilónico, societas y foenus nauticum romanos, chreokoinonia bizantina, isqa judía, qirad musulmán) siendo el qirad el más cercano porque el socio viajero no corre ningún riesgo."
