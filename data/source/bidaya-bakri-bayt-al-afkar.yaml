label:
  ar: "ابن رشد الحفيد، بداية المجتهد ونهاية المقتصد (صححه وعلق عليه أبو أوس يوسف بن أحمد البكري، بيت الأفكار الدولية)"
  en: "Ibn Rushd al-Hafid, Bidayat al-Mujtahid wa-Nihayat al-Muqtasid (corrected and annotated by Abu Aws Yusuf ibn Ahmad al-Bakri, Bayt al-Afkar al-Dawliyya)"
  ur: "ابن رشد الحفید، بدایۃ المجتہد و نہایۃ المقتصد (تصحیح و تعلیق ابو اوس یوسف بن احمد البکری، بیت الافکار الدولیہ)"
summary:
  ar: "طبعة في مجلد واحد من «بداية المجتهد ونهاية المقتصد» لابن رشد الحفيد (520-595هـ)، «مصححة ومنقحة مضبوطة النص، قوبلت على عدة نسخ مطبوعة، مخرجة الأحاديث» مع أحكام الألباني، صححها وعلق عليها أبو أوس يوسف بن أحمد البكري (الزرقاء، الأردن)، نشر بيت الأفكار الدولية (عمّان/الرياض)؛ في بطاقة الفهرسة سنة 2007 و1038 صفحة، وفي صفحة الحقوق أنه طبع عام 2009 في لبنان. فيها ترجمة المؤلف والتعريف بالكتاب ونص الكتاب كاملاً من الطهارة إلى الأقضية."
  en: "A one-volume edition of Ibn Rushd al-Hafid's (520-595 AH) Bidayat al-Mujtahid, 'corrected, revised, with the text vowelled, collated against several printed copies, with the hadith referenced' and al-Albani's gradings, corrected and annotated by Abu Aws Yusuf ibn Ahmad al-Bakri (al-Zarqa', Jordan), published by Bayt al-Afkar al-Dawliyya (Amman/Riyadh); the catalogue card gives 2007 and 1038 pages, the rights page says it was printed in 2009 in Lebanon. It contains a life of the author, a presentation of the book and the full text from Purity to Judgeships."
  ur: "ابن رشد الحفید (520-595ھ) کی «بدایۃ المجتہد» کا ایک جلدی ایڈیشن، «تصحیح و تنقیح شدہ، متن مضبوط، متعدد مطبوعہ نسخوں سے مقابلہ شدہ، احادیث کی تخریج کے ساتھ» اور البانی کے احکام سمیت؛ تصحیح و تعلیق ابو اوس یوسف بن احمد البکری (الزرقاء، اردن)، ناشر بیت الافکار الدولیہ (عمان/ریاض)؛ فہرست کارڈ میں 2007 اور 1038 صفحات، اور حقوق کے صفحے پر 2009 میں لبنان میں طباعت درج ہے۔ اس میں مصنف کا ترجمہ، کتاب کا تعارف اور طہارت سے اقضیہ تک پورا متن ہے۔"
title: "بداية المجتهد ونهاية المقتصد"
