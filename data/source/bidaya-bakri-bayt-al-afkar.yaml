label:
  ar: "ابن رشد الحفيد، بداية المجتهد ونهاية المقتصد ⁦(صححه وعلق عليه أبو أوس يوسف بن أحمد البكري، بيت الأفكار الدولية)⁩"
  en: "Ibn Rushd al-Hafid, Bidayat al-Mujtahid wa-Nihayat al-Muqtasid (corrected and annotated by Abu Aws Yusuf ibn Ahmad al-Bakri, Bayt al-Afkar al-Dawliyya)"
  ur: "ابن رشد الحفید، بدایۃ المجتہد و نہایۃ المقتصد ⁦(تصحیح و تعلیق ابو اوس یوسف بن احمد البکری، بیت الافکار الدولیہ)⁩"
summary:
  ar: "طبعة في مجلد واحد من «بداية المجتهد ونهاية المقتصد» لابن رشد الحفيد ⁦(520-595هـ)⁩، «مصححة ومنقحة مضبوطة النص، قوبلت على عدة نسخ مطبوعة، مخرجة الأحاديث» مع أحكام الألباني، صححها وعلق عليها أبو أوس يوسف بن أحمد البكري ⁦(الزرقاء، الأردن)⁩، نشر بيت الأفكار الدولية ⁦(عمّان/الرياض)⁩؛ في بطاقة الفهرسة سنة 2007 و1038 صفحة، وفي صفحة الحقوق أنه طبع عام 2009 في لبنان. فيها ترجمة المؤلف والتعريف بالكتاب ونص الكتاب كاملاً من الطهارة إلى الأقضية."
  en: "A one-volume edition of Ibn Rushd al-Hafid's (520-595 AH) Bidayat al-Mujtahid, 'corrected, revised, with the text vowelled, collated against several printed copies, with the hadith referenced' and al-Albani's gradings, corrected and annotated by Abu Aws Yusuf ibn Ahmad al-Bakri (al-Zarqa', Jordan), published by Bayt al-Afkar al-Dawliyya (Amman/Riyadh); the catalogue card gives 2007 and 1038 pages, the rights page says it was printed in 2009 in Lebanon. It contains a life of the author, a presentation of the book and the full text from Purity to Judgeships."
  ur: "ابن رشد الحفید ⁦(520-595ھ)⁩ کی «بدایۃ المجتہد» کا ایک جلدی ایڈیشن، «تصحیح و تنقیح شدہ، متن مضبوط، متعدد مطبوعہ نسخوں سے مقابلہ شدہ، احادیث کی تخریج کے ساتھ» اور البانی کے احکام سمیت؛ تصحیح و تعلیق ابو اوس یوسف بن احمد البکری ⁦(الزرقاء، اردن)⁩، ناشر بیت الافکار الدولیہ ⁦(عمان/ریاض)⁩؛ فہرست کارڈ میں 2007 اور 1038 صفحات، اور حقوق کے صفحے پر 2009 میں لبنان میں طباعت درج ہے۔ اس میں مصنف کا ترجمہ، کتاب کا تعارف اور طہارت سے اقضیہ تک پورا متن ہے۔"
  es: "Edición en un solo volumen de Bidayat al-Mujtahid de Ibn Rushd al-Hafid (520-595 AH), «corregida, revisada, con el texto vocalizado, cotejada con varias copias impresas, con los hadices referenciados» y las clasificaciones de al-Albani, corregida y anotada por Abu Aws Yusuf ibn Ahmad al-Bakri (al-Zarqa', Jordania), publicada por Bayt al-Afkar al-Dawliyya (Amán/Riad); la ficha del catálogo indica 2007 y 1038 páginas, la página de derechos dice que fue impresa en 2009 en Líbano. Contiene una biografía del autor, una presentación del libro y el texto completo desde Pureza hasta Jueces."
  fr: "Édition en un volume de la Bidayat al-Mujtahid d'Ibn Rushd al-Hafid (520-595 AH), corrigée, révisée, avec le texte vocalisé, collationnée d'après plusieurs exemplaires imprimés, avec les hadiths référencés, et intégrant les classifications d'al-Albani, corrigée et annotée par Abu Aws Yusuf ibn Ahmad al-Bakri (al-Zarqa', Jordanie), publiée par Bayt al-Afkar al-Dawliyya (Amman/Riyad). La fiche de catalogue indique 2007 et 1038 pages, tandis que la page des droits précise que l'ouvrage a été imprimé en 2009 au Liban. Il contient une biographie de l'auteur, une présentation du livre et le texte intégral, de la section « Pureté » à la section « Jugements »."
  tr: "İbn Rüşd el-Hafid (520-595 H) tarafından yazılmış 'Bidayat al-Mujtahid wa Nihayat al-Muqtasid' adlı tek ciltlik baskı, 'düzeltilmiş ve revize edilmiş, kesin metinle birlikte birkaç basılı kopya almıştır', al-Albani tarafından hükümler çıkarılmıştır, Abu Aws Yusuf ibn Ahmad al-Bakri tarafından düzenlenmiş ve açıklamalıdır (Zarqa, Ürdün), Bayt al-Afkar al-Dawlaya (Amman/Riyad) tarafından yayımlanmıştır; 2007 ve 1038 sayfalık indeks kartında ve 2009 yılında Lübnan'da basılmıştır. Yazarın biyografisi, kitaba giriş ve kitabın arınmadan yargıya kadar tam metni içerir."
  id: "Edisi satu jilid 'Bidayat al-Mujtahid wa Nihayat al-Muqtasid' oleh Ibn Rushd al-Hafid (520-595 H), 'dikoreksi dan direvisi, dengan teks yang tepat, dan menerima beberapa salinan cetak, hadits diekstrak' dengan putusan oleh al-Albani, diedit dan diberi anotasi oleh Abu Aws Yusuf ibn Ahmad al-Bakri (Zarqa, Yordania), diterbitkan oleh Bayt al-Afkar al-Dawlaya (Amman/Riyadh); dalam kartu indeks tahun 2007 dan 1038 halaman, serta di halaman kanan, dicetak pada tahun 2009 di Lebanon. Buku ini memuat biografi penulis, pengantar buku, dan teks lengkap dari penyucian hingga penghakiman."
