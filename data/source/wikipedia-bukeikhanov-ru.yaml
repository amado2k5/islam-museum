summary:
  ar: "مقالة ويكيبيديا الروسية عن عليخان بوكيخانوف؛ تُستخدم لوقائع الكيان فقط. أوسع سيرة له: نشاطه في حزب الكاديت والدوما، ومؤتمرات الكازاخ سنة 1917، وألاش أوردا، واعتقالاته وإعدامه سنة 1937، ويعطي قالبها معتقده «الإسلام على المذهب السني»."
  en: "Russian Wikipedia article on Alikhan Bukeikhanov; used for entity facts only. The fullest biography: his Kadet and Duma activity, the 1917 Kazakh congresses, Alash Orda, his arrests and his execution in 1937; its infobox gives his confession as 'Islam of the Sunni persuasion'."
  es: "Artículo de la Wikipedia rusa sobre Alikhan Bukeikhanov; utilizado únicamente para datos sobre la persona. La biografía más completa: su actividad en el Kadet y la Duma, los congresos kazajos de 1917, Alash Orda, sus arrestos y su ejecución en 1937; su ficha informativa indica que confesó ser \"islam sunita\"."
  fr: "Article de Wikipédia en russe sur Alikhan Bukeikhanov; utilisé uniquement pour les informations sur l'entité. Biographie complète: son activité au sein des Cadets et de la Douma, les congrès kazakhs de 1917, Alash Orda, ses arrestations et son exécution en 1937; son infobox indique qu'il se déclarait « islam sunnite »."
  ur: "علیخان بوکیخانوف پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ مکمل سوانح عمری: اس کی کاڈیٹ اور ڈوما کی سرگرمی، 1917 کی قازق کانگریس، الاش اردا، اس کی گرفتاریاں اور 1937 میں اس کی پھانسی؛ اس کا انفو باکس 'سنی قائل کا اسلام' کے طور پر اس کا اعتراف کرتا ہے۔"
  tr: "Alikhan Bukihanov hakkında Rusça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. En geniş biyografisi: Kadet Partisi ve Duma'daki faaliyetleri, 1917 Kazak kongreleri, Alash Orda, 1937'deki tutuklanmaları ve idamları ile inancının formatını \"İslam Sünni mezhebi\" olarak tanımlamıştır."
  id: "Artikel Wikipedia Rusia tentang Alikhan Bukikhanov; digunakan hanya untuk fakta entitas. Biografi terluasnya: aktivitasnya di Partai Kadet dan Duma, kongres Kazakhstan tahun 1917, Alash Orda, penangkapan dan eksekusinya pada tahun 1937, dan ia memberikan format pada keyakinannya \"Islam pada sekte Sunni.\""
