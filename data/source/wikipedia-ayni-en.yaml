summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صدر الدين عيني (1878–1954)، المثقف الطاجيكي المولود في ساكتاره بإمارة بخارى والمتعلم في مدرسة مير عرب في بخارى، المشارك في حركة الجديد التنويرية، ومؤلف «دوخوندا» وأول رئيس لأكاديمية علوم طاجيكستان؛ تعطي مولده 15 أبريل 1878 بالتقويم اليولياني ووفاته 15 يوليو 1954."
  en: "The English Wikipedia article on Sadriddin Ayni (1878–1954), the Tajik intellectual born at Saktare in the Emirate of Bukhara and educated at Bukhara's Mir-i-Arab madrasa, a participant in the Jadid enlightenment movement, author of Dokhunda and first president of the Tajik Academy of Sciences; it gives his birth as 15 April 1878 in the Julian form and his death as 15 July 1954."
