summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صدر الدين عيني (1878–1954)، المثقف الطاجيكي المولود في ساكتاره بإمارة بخارى والمتعلم في مدرسة مير عرب في بخارى، المشارك في حركة الجديد التنويرية، ومؤلف «دوخوندا» وأول رئيس لأكاديمية علوم طاجيكستان؛ تعطي مولده 15 أبريل 1878 بالتقويم اليولياني ووفاته 15 يوليو 1954."
  en: "The English Wikipedia article on Sadriddin Ayni (1878–1954), the Tajik intellectual born at Saktare in the Emirate of Bukhara and educated at Bukhara's Mir-i-Arab madrasa, a participant in the Jadid enlightenment movement, author of Dokhunda and first president of the Tajik Academy of Sciences; it gives his birth as 15 April 1878 in the Julian form and his death as 15 July 1954."
  es: "El artículo de la Wikipedia en inglés sobre Sadriddin Ayni (1878-1954), el intelectual tayiko nacido en Saktare, en el emirato de Bujará, y educado en la madrasa Mir-i-Arab de Bujará, participante del movimiento ilustrado Jadid, autor de Dokhunda y primer presidente de la Academia de Ciencias de Tayikistán, indica que nació el 15 de abril de 1878 según el calendario juliano y que falleció el 15 de julio de 1954."
  fr: "L'article de Wikipédia en anglais sur Sadriddin Ayni (1878-1954), intellectuel tadjik né à Saktare dans l'émirat de Boukhara et ayant fait ses études à la madrasa Mir-i-Arab de Boukhara, participant au mouvement des Lumières Jadid, auteur de Dokhunda et premier président de l'Académie des sciences du Tadjikistan; il indique sa naissance au 15 avril 1878 au calendrier julien et sa mort au 15 juillet 1954."
  ur: "صدرالدین عینی (1878-1954) پر انگریزی ویکیپیڈیا کا مضمون، تاجک دانشور جو امارت بخارا کے سکترے میں پیدا ہوا اور بخارا کے میر-عرب مدرسہ میں تعلیم یافتہ، جدید روشن خیالی کی تحریک میں شریک، دوخونڈہ کے مصنف اور تاجی سائنس اکیڈمی کے پہلے صدر؛ اس کی پیدائش جولین کی شکل میں 15 اپریل 1878 اور اس کی موت 15 جولائی 1954 کو ہوتی ہے۔"
  tr: "Buhara'nın Saktara kentinde doğmuş, Buhara Arap okulunda eğitim görmüş, Aydınlanma hareketinin bir katılımcısı, 'Dokhunda'nın yazarı ve Tacikistan Bilimler Akademisi'nin ilk başkanı olan Tacik entelektüel Sadruddin Aini (1878–1954) hakkında İngilizce Wikipedia makalesi; Jülyen takvimine göre 15 Nisan 1878, ölümünü ise 15 Temmuz 1954 olarak kaydetmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Sadruddin Aini (1878–1954), intelektual Tajik yang lahir di Saktara, Emirat Bukhara, dididik di sekolah Arab Mir di Bukhara, peserta gerakan Pencerahan, penulis 'Dokhunda,' dan presiden pertama Akademi Ilmu Pengetahuan Tajikistan; mencatat kelahirannya pada 15 April 1878 dalam kalender Julian, dan kematiannya pada 15 Juli 1954."
