label:
  ar: "ميزان الاعتدال في نقد الرجال — الذهبي، طبعة حجرية هندية بأمر محمد خادم حسين العظيم آبادي، المجلد الثاني"
  en: "Mizan al-I'tidal fi Naqd al-Rijal — al-Dhahabi, Indian lithograph printed by order of Muhammad Khadim Husayn al-Azimabadi, vol. 2"
summary:
  ar: "المجلد الثاني من الطبعة الحجرية الهندية لـ«ميزان الاعتدال»، يبدأ من حرف العين وينتهي بفصول المبهمات من النساء ثم «تمّ الكتاب»، وتليه كلمة للناشر في التعريف بالذهبي ومصنفاته وفي سبب طبع الكتاب."
  en: "Volume 2 of the Indian lithograph of Mizan al-I'tidal, running from the letter 'ayn to the closing sections on unnamed women and the words 'the book is complete', followed by a publisher's note introducing al-Dhahabi and his works and explaining why the book was printed."
  es: "Volumen 2 de la litografía india de Mizan al-I'tidal, que abarca desde la letra 'ayn hasta las secciones finales sobre mujeres sin nombre y las palabras 'el libro está completo', seguidas de una nota del editor que presenta a al-Dhahabi y sus obras y explica por qué se imprimió el libro."
  fr: "Volume 2 de la lithographie indienne de Mizan al-I'tidal, allant de la lettre 'ayn aux sections finales sur des femmes non nommées et aux mots « le livre est complet », suivi d'une note de l'éditeur présentant al-Dhahabi et ses œuvres et expliquant pourquoi le livre a été imprimé."
  ur: "میزان الاعتدال کے ہندوستانی لتھوگراف کی جلد 2، خط 'عین سے لے کر بے نام خواتین پر اختتامی حصے اور 'کتاب مکمل ہے' کے الفاظ تک چلتی ہے، اس کے بعد ایک پبلشر کا نوٹ الذہبی اور ان کی تخلیقات کا تعارف کراتے ہوئے اور یہ بتاتا ہے کہ کتاب کیوں چھپی تھی۔"
  tr: "'Mizan al-I'tidal'ın Hindistan litografi baskısının ikinci cildi 'Ayn' harfiyle başlar ve belirsiz kadınlar üzerine bölümlerle, ardından 'Kitap Tamamlandı' ile sona erer; ardından yayınevinden Al-Dhahabi ve eserlerini tanıtan bir sözü ile kitabın basım nedenini izler."
  id: "Volume kedua edisi litografi India 'Mizan al-I'tidal' dimulai dengan huruf 'Ayn' dan diakhiri dengan bab-bab tentang perempuan ambigu lalu 'Buku Telah Selesai,' diikuti oleh kata dari penerbit yang memperkenalkan Al-Dhahabi dan karya-karyanya serta alasan pencetakan buku tersebut."
