summary:
  ar: "مقالة ويكيبيديا الفارسية عن جمال الدين واعظ الإصفهاني؛ تُستخدم لوقائع الكيان فقط. تروي شهرته واعظًا دستوريًا في طهران، وفراره متنكرًا بعد قصف المجلس سنة 1908 قاصدًا النجف عبر همدان، وخيانة مظفر الملك له وإرساله إلى بروجرد حيث قُتل بأمر محمد علي شاه، والتقليد الموسوعي الفارسي الذي يعطي ميلاده في همدان سنة 1279 هـ ووفاته سنة 1326 هـ."
  en: "Persian Wikipedia article on Jamal al-Din Va'iz Esfahani; used for entity facts only. It recounts his fame as Tehran's leading constitutional preacher, his flight in disguise after the bombardment of the Majles in 1908 toward Najaf by way of Hamadan, his betrayal by Mozaffar al-Molk and dispatch to Borujerd, where he was killed on Mohammad Ali Shah's order, and the Persian encyclopedia tradition that gives his birth at Hamadan in 1279 AH and his death in 1326 AH."
