summary:
  ar: "مقالة ويكيبيديا الفارسية عن جمال الدين واعظ الإصفهاني؛ تُستخدم لوقائع الكيان فقط. تروي شهرته واعظًا دستوريًا في طهران، وفراره متنكرًا بعد قصف المجلس سنة 1908 قاصدًا النجف عبر همدان، وخيانة مظفر الملك له وإرساله إلى بروجرد حيث قُتل بأمر محمد علي شاه، والتقليد الموسوعي الفارسي الذي يعطي ميلاده في همدان سنة 1279 هـ ووفاته سنة 1326 هـ."
  en: "Persian Wikipedia article on Jamal al-Din Va'iz Esfahani; used for entity facts only. It recounts his fame as Tehran's leading constitutional preacher, his flight in disguise after the bombardment of the Majles in 1908 toward Najaf by way of Hamadan, his betrayal by Mozaffar al-Molk and dispatch to Borujerd, where he was killed on Mohammad Ali Shah's order, and the Persian encyclopedia tradition that gives his birth at Hamadan in 1279 AH and his death in 1326 AH."
  es: "Artículo de la Wikipedia en persa sobre Jamal al-Din Va'iz Esfahani; utilizado únicamente para datos sobre la persona. Relata su fama como el principal predicador constitucional de Teherán, su huida disfrazado tras el bombardeo del Majlis en 1908 hacia Nayaf vía Hamadán, su traición por parte de Mozaffar al-Molk y su envío a Borujerd, donde fue asesinado por orden de Mohammad Ali Shah, y la tradición de las enciclopedias persas que sitúa su nacimiento en Hamadán en 1279 AH y su muerte en 1326 AH."
  fr: "Article de Wikipédia en persan sur Jamal al-Din Va'iz Esfahani; utilisé uniquement à des fins d'information sur l'entité. Il relate sa renommée en tant que principal prédicateur constitutionnel de Téhéran, sa fuite déguisée après le bombardement du Majlis en 1908 vers Najaf via Hamadan, sa trahison par Mozaffar al-Molk et son envoi à Borujerd, où il fut tué sur ordre de Mohammad Ali Shah, ainsi que la tradition encyclopédique persane qui situe sa naissance à Hamadan en 1279 AH et sa mort en 1326 AH."
