summary:
  ar: "مقالة ويكيبيديا الأردية عن هواري بومدين؛ تُستخدم لوقائع الكيان فقط. نبذة قصيرة بلا صندوق معلومات تروي تعليمه في قسنطينة والأزهر وقيادته جيش التحرير ودوره في استقلال الجزائر وانقلابه سنة 1965، وتصنيفاتها تحسبه على المسلمين الجزائريين والاشتراكيين الإسلاميين."
  en: "Urdu Wikipedia article on Houari Boumédiène; used for entity facts only. A short prose stub without an infobox recounting his education at Constantine and al-Azhar, his command of the liberation army, his role in independence and his 1965 coup; its categories file him under Algerian Muslims and Islamic socialists."
  es: "Artículo de Wikipedia en urdu sobre Houari Boumédiène; utilizado únicamente para datos sobre la persona. Un breve texto en prosa, sin ficha informativa, que relata su educación en Constantina y Al-Azhar, su mando del ejército de liberación, su papel en la independencia y su golpe de Estado de 1965; sus categorías lo clasifican dentro de los musulmanes argelinos y los socialistas islámicos."
  fr: "Article de Wikipédia en ourdou sur Houari Boumédiène; utilisé uniquement pour les informations sur l'entité. Court texte sans encadré relatant ses études à Constantinople et à al-Azhar, son commandement de l'armée de libération, son rôle dans l'indépendance et son coup d'État de 1965; ses catégories le classent parmi les musulmans algériens et les socialistes islamistes."
  ur: "Houari Boumédiène پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ قسطنطنیہ اور الازہر میں ان کی تعلیم، آزادی کی فوج کی کمان، آزادی میں ان کا کردار اور 1965 کی بغاوت؛ اس کے زمرے اسے الجزائر کے مسلمانوں اور اسلامی سوشلسٹوں کے تحت فائل کرتے ہیں۔"
