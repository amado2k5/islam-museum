summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شريف شيخ أحمد؛ تُستخدم لوقائع الكيان فقط. تروي دراسته الإسلام والشريعة في السودان وليبيا، ورئاسته اتحاد المحاكم الإسلامية (2004–2007) ثم تحالف إعادة تحرير الصومال، ورئاسته للصومال (2009–2012). النص يذكر مناصبه ودراسته لا مدرسته الشخصية؛ ويعطي ولادته سنة 1965 خلافا للعربية وويكيداتا (1964)."
  en: "English Wikipedia article on Sharif Sheikh Ahmed; used for entity facts only. It recounts his study of Islam and Shariah in Sudan and Libya, his chairmanship of the Islamic Courts Union (2004–2007) and then of the Alliance for the Re-liberation of Somalia, and his presidency of Somalia (2009–2012). The text gives his offices and education, never his personal school; it gives his birth in 1965, against the Arabic article and Wikidata (1964)."
  es: "Artículo de la Wikipedia en inglés sobre Sharif Sheikh Ahmed; utilizado únicamente para datos sobre la entidad. Relata sus estudios de islam y sharia en Sudán y Libia, su presidencia de la Unión de Tribunales Islámicos (2004-2007) y posteriormente de la Alianza para la Liberación de Somalia, y su presidencia de Somalia (2009-2012). El texto menciona sus cargos y formación académica, pero no su escuela; indica que nació en 1965, en contraposición al artículo en árabe y a Wikidata (1964)."
  fr: "Article de Wikipédia en anglais sur Sharif Sheikh Ahmed; utilisé uniquement à des fins d’information sur l’entité. Il relate ses études de l’islam et de la charia au Soudan et en Libye, sa présidence de l’Union des tribunaux islamiques (2004-2007) puis de l’Alliance pour la libération de la Somalie, et sa présidence de la Somalie (2009-2012). Le texte mentionne ses fonctions et sa formation, mais jamais son école; il indique sa naissance en 1965, contrairement à l’article en arabe et à Wikidata (1964)."
  ur: "شریف شیخ احمد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں سوڈان اور لیبیا میں اسلام اور شریعت کے بارے میں ان کے مطالعہ، اسلامک کورٹس یونین (2004–2007) اور پھر الائنس فار دی ری لیبریشن آف صومالیہ کی سربراہی اور صومالیہ کی ان کی صدارت (2009–2012) کا ذکر ہے۔ متن اس کے دفاتر اور تعلیم دیتا ہے، کبھی بھی اس کا ذاتی اسکول نہیں؛ یہ عربی مضمون اور وکی ڈیٹا (1964) کے خلاف 1965 میں اپنی پیدائش دیتا ہے۔"
