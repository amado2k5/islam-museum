summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شريف شيخ أحمد؛ تُستخدم لوقائع الكيان فقط. تروي دراسته الإسلام والشريعة في السودان وليبيا، ورئاسته اتحاد المحاكم الإسلامية (2004–2007) ثم تحالف إعادة تحرير الصومال، ورئاسته للصومال (2009–2012). النص يذكر مناصبه ودراسته لا مدرسته الشخصية؛ ويعطي ولادته سنة 1965 خلافا للعربية وويكيداتا (1964)."
  en: "English Wikipedia article on Sharif Sheikh Ahmed; used for entity facts only. It recounts his study of Islam and Shariah in Sudan and Libya, his chairmanship of the Islamic Courts Union (2004–2007) and then of the Alliance for the Re-liberation of Somalia, and his presidency of Somalia (2009–2012). The text gives his offices and education, never his personal school; it gives his birth in 1965, against the Arabic article and Wikidata (1964)."
