reliability_note: "A scholarly national encyclopedia survey, independent of Wikipedia. Read in full on 1 November 2026. Its Mughal-period passage states in prose: 'Great Mughal subahdars like mir jumla and shaista khan were Shias. They were accompanied to Bengal by many Shia followers who occupied important posts.' That sentence is one of the two independent texts on which Mir Jumla II's shia-twelver settlement rests, and the single naming that leaves Shaista Khan short of the two-text standard; the two settlements are set out in the respective person records. The entry's bibliography cites Jagadish Narayan Sarkar's Islam in Bengal (1972) and Abdul Karim's Social History of the Muslims in Bengal (2nd ed., 1985)."
