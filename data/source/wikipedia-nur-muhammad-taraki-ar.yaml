summary:
  ar: "مقالة ويكيبيديا العربية المسماة عن نور محمد تركي؛ سُجلت ولم تُستخدم لوقائع. نصها يروي حياة مختلطة: مولد في 15 يوليو 1913 في بغمان ودرجات في الاقتصاد من كولومبيا وهارفارد، وهو ما يناقض المقالة الإنجليزية وويكي بيانات ولا يطابق حياة تركي الموثقة."
  en: "Arabic Wikipedia article named for Nur Muhammad Taraki; registered but NOT used for facts. Its text narrates a conflated life — birth on 15 July 1913 at Paghman and economics degrees from Columbia and Harvard — which contradicts the English article and Wikidata and matches no documented life of Taraki."
  es: "Artículo en árabe de la Wikipedia que lleva el nombre de Nur Muhammad Taraki; registrado pero NO utilizado para verificar datos. Su texto narra una biografía distorsionada —nacimiento el 15 de julio de 1913 en Paghman y títulos en economía de Columbia y Harvard— que contradice el artículo en inglés y Wikidata, y no coincide con ninguna biografía documentada de Taraki."
  fr: "L'article de Wikipédia en arabe porte le nom de Nur Muhammad Taraki; il est enregistré mais n'est PAS utilisé pour vérifier les faits. Son texte relate une vie apocryphe — naissance le 15 juillet 1913 à Paghman et diplômes d'économie de Columbia et Harvard — ce qui contredit l'article en anglais et Wikidata et ne correspond à aucune biographie documentée de Taraki."
  ur: "نور محمد تراکی کے لیے عربی ویکیپیڈیا کا مضمون؛ رجسٹرڈ لیکن حقائق کے لیے استعمال نہیں کیا گیا۔ اس کا متن ایک متضاد زندگی کو بیان کرتا ہے - 15 جولائی 1913 کو پگمان میں پیدائش اور کولمبیا اور ہارورڈ سے معاشیات کی ڈگریاں - جو انگریزی مضمون اور وکی ڈیٹا سے متصادم ہے اور تراکی کی کسی دستاویزی زندگی سے میل نہیں کھاتی۔"
  tr: "Nur Muhammad Turki'nin adını taşıyan Arapça Vikipedi makalesi; kaydedilmiş ancak gerçekler için kullanılmamıştır. Metni karışık bir hayat anlatır: 15 Temmuz 1913'te Bogman'da doğmuş ve Columbia ile Harvard'dan ekonomi diplomalarına sahiptir; bu, İngilizce makale ve Wikidata'ya aykırıdır ve Turki'nin belgelenen yaşamıyla örtüşmez."
  id: "Artikel Wikipedia berbahasa Arab yang dinamai menurut Nur Muhammad Turki; tercatat tetapi tidak digunakan sebagai fakta. Teksnya menceritakan kehidupan campuran: lahir pada 15 Juli 1913 di Bogman dan memiliki gelar ekonomi dari Columbia dan Harvard, yang bertentangan dengan artikel bahasa Inggris dan Wikidata serta tidak sesuai dengan kehidupan Turki yang terdokumentasi."
