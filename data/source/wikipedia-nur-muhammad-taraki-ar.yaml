reliability_note: "READ AND REJECTED for facts on 27 October 2026: the biography it narrates (born 1913 at Paghman; clerk in Bombay; master's at Columbia and doctorate in economics at Harvard; PDPA founded in 1956) contradicts the English Good Article and Wikidata on birth year, birthplace, education and party history, and appears to conflate Taraki with the biography of Hafizullah Amin. It is registered so the conflation is on record; no fact in the person record is taken from it, and no faith value is taken from it (it gives none). Its recorded revision was fetched by revision id and a second query returned the same revision id."
