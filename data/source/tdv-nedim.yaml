summary:
  ar: "مدخل «نديم» في موسوعة TDV الإسلامية التركية، في معنى صاحب السلطان في المنادمة. يتتبع الكلمة من الجاهلية إلى مجالس الشراب في قصور الأمويين والعباسيين، ثم إلى ما يُطلب من النديم في الدول التركية المسلمة، وإلى لباسه وتدريبه."
  en: "The TDV İslâm Ansiklopedisi entry on the nadim, the ruler's companion at the drinking gathering. It follows the word from the pre-Islamic period to the drinking gatherings of the Umayyad and Abbasid courts, then to what the Turkic Muslim states asked of a nadim, and to his dress and his training."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre el nadim, el acompañante del gobernante en las reuniones para beber, sigue la evolución de la palabra desde el período preislámico hasta las reuniones de las cortes omeyas y abasíes, y luego describe lo que los estados turcos musulmanes exigían de un nadim, así como su vestimenta y su formación."
  fr: "L'article de TDV İslâm Ansiklopedisi consacré au nadim, le compagnon du souverain lors des festivités, retrace l'évolution du terme depuis la période préislamique jusqu'aux assemblées omeyyades et abbassides, en passant par les attentes des États turco-musulmans à l'égard du nadim, ainsi que son habillement et sa formation."
  ur: "پینے کی محفل میں حکمران کے ساتھی ندیم پر TDV İslâm Ansiklopedisi اندراج۔ اس میں زمانہ جاہلیت سے لے کر اموی اور عباسی درباروں کے شراب نوشی کے اجتماعات، پھر ترک مسلم ریاستوں نے ایک ندیم سے کیا کہا، اور اس کے لباس اور اس کی تربیت تک۔"
