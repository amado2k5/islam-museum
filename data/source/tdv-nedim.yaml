summary:
  ar: "مدخل «نديم» في موسوعة TDV الإسلامية التركية، في معنى صاحب السلطان في المنادمة. يتتبع الكلمة من الجاهلية إلى مجالس الشراب في قصور الأمويين والعباسيين، ثم إلى ما يُطلب من النديم في الدول التركية المسلمة، وإلى لباسه وتدريبه."
  en: "The TDV İslâm Ansiklopedisi entry on the nadim, the ruler's companion at the drinking gathering. It follows the word from the pre-Islamic period to the drinking gatherings of the Umayyad and Abbasid courts, then to what the Turkic Muslim states asked of a nadim, and to his dress and his training."
