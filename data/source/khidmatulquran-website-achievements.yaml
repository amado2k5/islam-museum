summary:
  ar: "صفحة «الإنجازات» في الموقع الرسمي لمؤسسة خدمة القرآن الإسلامية؛ تسرد ما تذكره المؤسسة عن نفسها: أول حدث تجويد كبير في تنزانيا، ومسابقة شرق أفريقيا للتجويد سنة 2008، واستضافة قرّاء عالميين، وتنظيم مسابقة دولية للتلاوة والتجويد."
  en: "The Achievements page of the Khidmatulquran Islamic Foundation's official website; it lists the foundation's own account of its record: the first big Quran tajweed event in Tanzania, the 2008 East Africa Quran Tajweed Competition, hosting world-renowned reciters, and organising an international tilawat and tajweed competition."
  es: "La página de Logros del sitio web oficial de la Fundación Islámica Khidmatulquran enumera el propio relato de la fundación sobre su trayectoria: el primer gran evento de tajweed del Corán en Tanzania, el Concurso de Tajweed del Corán de África Oriental de 2008, la acogida de recitadores de renombre mundial y la organización de un concurso internacional de tilawat y tajweed."
  fr: "La page « Réalisations » du site officiel de la Fondation islamique Khidmatulquran; elle répertorie le bilan de la fondation: le premier grand événement de tajwid du Coran en Tanzanie, le concours de tajwid du Coran d’Afrique de l’Est de 2008, l’accueil de récitants de renommée mondiale et l’organisation d’un concours international de tilawat et de tajwid."
  ur: "خدمت القرآن اسلامک فاؤنڈیشن کی آفیشل ویب سائٹ کا حاصلات کا صفحہ؛ یہ فاؤنڈیشن کے اپنے ریکارڈ کی فہرست دیتا ہے: تنزانیہ میں پہلا بڑا قرآن تجوید ایونٹ، 2008 کا مشرقی افریقہ قرآن تجوید مقابلہ، عالمی شہرت یافتہ قاریوں کی میزبانی، اور بین الاقوامی تلاوات اور تجوید مقابلے کا انعقاد۔"
title: "Achievement – KHIDMATULQURAN ISLAMIC FOUNDATION"
