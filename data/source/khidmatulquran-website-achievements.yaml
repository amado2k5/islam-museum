reliability_note: "The foundation's own claims, recorded as its claims: that it was the first organisation in Tanzania to establish a big Quran Tajweed event; that in 2008 it was the first organisation in East Africa to organise an East Africa Quran Tajweed Competition with participants from Kenya, Uganda and Burundi; that it invites world-renowned reciters such as Dr Ahmad Nuayna and Dr Abdelfatah Tarooty; and that it organises an international Quran Tilawat Tajweed competition bringing reciters from different parts of the world and promotes Tanzanian reciters to international events. Read on 5 November 2026."
