  ar: "صفحة «الإنجازات» في الموقع الرسمي لمؤسسة خدمة القرآن الإسلامية؛ تسرد ما تذكره المؤسسة عن نفسها: أول حدث تجويد كبير في تنزانيا، ومسابقة شرق أفريقيا للتجويد سنة 2008، واستضافة قرّاء عالميين، وتنظيم مسابقة دولية للتلاوة والتجويد."
  en: "The Achievements page of the Khidmatulquran Islamic Foundation's official website; it lists the foundation's own account of its record: the first big Quran tajweed event in Tanzania, the 2008 East Africa Quran Tajweed Competition, hosting world-renowned reciters, and organising an international tilawat and tajweed competition."
