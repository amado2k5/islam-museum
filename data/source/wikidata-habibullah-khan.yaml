  ar: "بطاقة ويكي بيانات لحبيب الله خان؛ معرّفات منظمة وتواريخ فقط. تحمل مولده بقيمة دقيقة اليوم 3 يونيو 1872 ⁦(والإنجليزية المنقولة عن مصدر تعطي 2 يوليو 1872)⁩ ووفاته في 20 فبراير 1919، وسمرقند وطشقند مكانين للولادة، ولا تحمل أي قيمة للديانة."
  en: "Wikidata item for Habibullah Khan; structured identifiers and dates only. It carries his birth with a day-precision value of 3 June 1872 (the cited English article gives 2 July 1872), his death on 20 February 1919, Samarkand and Tashkent as birthplaces, and no religion value at all."
  es: "Entrada de Wikidata para Habibullah Khan; solo identificadores estructurados y fechas. Contiene su fecha de nacimiento con una precisión de día del 3 de junio de 1872 (el artículo en inglés citado indica el 2 de julio de 1872), su muerte el 20 de febrero de 1919, Samarcanda y Tashkent como lugares de nacimiento, y ninguna información sobre su religión."
  fr: "Fiche Wikidata concernant Habibullah Khan; elle ne contient que des identifiants structurés et des dates. On y trouve sa date de naissance, le 3 juin 1872 (l’article anglais cité indique le 2 juillet 1872), sa date de décès, le 20 février 1919, Samarcande et Tachkent comme lieux de naissance, et aucune information sur sa religion."
