summary:
  ar: "الملف الرسمي لزينب علواني في جامعة هوارد؛ يقدّمها أول أستاذة مشاركة للدراسات الإسلامية في كلية اللاهوت بالجامعة ورئيسة برنامج ماجستير الدراسات الدينية، ويذكر دكتوراهها من الجامعة الإسلامية العالمية في ماليزيا في العلوم الإسلامية والفقه، ونائب رئاستها لمجلس الفقه لأمريكا الشمالية، ورئاستها لتحرير مجلة الإيمان والممارسة الإسلامية، ورئاستها لمعهد المصباح الزجاجي."
  en: "Howard University's official profile of Zainab Alwani: the first Associate Professor of Islamic Studies at the School of Divinity and chair of its Master of Arts in Religious Studies program, PhD in Islamic sciences and jurisprudence from the International Islamic University Malaysia, Vice-Chair of the Fiqh Council of North America, Editor-in-Chief of the Journal of Islamic Faith and Practice, and President and Chairwoman of the Glass Lamp Institute."
  es: "Perfil oficial de Zainab Alwani en la Universidad de Howard: primera profesora asociada de Estudios Islámicos en la Facultad de Teología y directora de su programa de Maestría en Estudios Religiosos, doctora en ciencias islámicas y jurisprudencia por la Universidad Islámica Internacional de Malasia, vicepresidenta del Consejo de Fiqh de América del Norte, editora jefe de la Revista de Fe y Práctica Islámicas y presidenta del Instituto de la Lámpara de Cristal."
  fr: "Profil officiel de Zainab Alwani à l'Université Howard: première professeure agrégée d'études islamiques à la Faculté de théologie et directrice de son programme de maîtrise ès arts en études religieuses, docteure en sciences et jurisprudence islamiques de l'Université islamique internationale de Malaisie, vice-présidente du Conseil de jurisprudence islamique d'Amérique du Nord, rédactrice en chef du Journal of Islamic Faith and Practice, et présidente du Glass Lamp Institute."
