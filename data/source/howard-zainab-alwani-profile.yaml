reliability_note: "Her university's official faculty profile, an independent institutional source for her posts and qualifications. It records her dissertation topic (the higher aims of Islamic law within the American Muslim family), her focus on Quranic studies, women scholarship and family law, her Glass Lamp Institute and its Taddabur al-Qur'an work, and her Orphan Care Project. It names no madhhab or sect affiliation for her. Checked 26 October 2026."
