summary:
  ar: "الملف الرسمي لزينب علواني في جامعة هوارد؛ يقدّمها أول أستاذة مشاركة للدراسات الإسلامية في كلية اللاهوت بالجامعة ورئيسة برنامج ماجستير الدراسات الدينية، ويذكر دكتوراهها من الجامعة الإسلامية العالمية في ماليزيا في العلوم الإسلامية والفقه، ونائب رئاستها لمجلس الفقه لأمريكا الشمالية، ورئاستها لتحرير مجلة الإيمان والممارسة الإسلامية، ورئاستها لمعهد المصباح الزجاجي."
  en: "Howard University's official profile of Zainab Alwani: the first Associate Professor of Islamic Studies at the School of Divinity and chair of its Master of Arts in Religious Studies program, PhD in Islamic sciences and jurisprudence from the International Islamic University Malaysia, Vice-Chair of the Fiqh Council of North America, Editor-in-Chief of the Journal of Islamic Faith and Practice, and President and Chairwoman of the Glass Lamp Institute."
