summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن موسى بيغييف؛ تُستخدم لوقائع الكيان فقط. يؤرخ صدرها له من 25 ديسمبر 1873 إلى 28 أكتوبر 1949، بينما يصرح قسم حياتها بأن تاريخ مولده ومكانه متنازع عليهما: فالسنة 1870 أو 1875 أو 1873، والمكان قرية ميشار أو نوفوتشركاسك. وتتناول تعليمه في مدارس قازان وبخارى وسمرقند والقاهرة ودمشق وإسطنبول، ونشاطه في حزب «اتفاق المسلمين»، وتدريسه في المدرسة الحسينية بأورنبورغ، واعتقاله سنة 1923 وإطلاقه، وهربه من الاتحاد السوفيتي سنة 1930، وأسفاره العالمية، وإقامته الجبرية في بيشاور (1939–1945)، ووفاته في القاهرة في 28 أكتوبر 1949 ودفنه في مقبرة الخديويين الملكية. ويعرض قسم آرائها حجته في عموم الرحمة الإلهية ونقد مصطفى صبري له ولقب «لوثر الإسلام»، ويصفه، في توصيف سجالاته، بأنه من «أشهر المنافحين السنّة ضد الشيعة»."
  en: "English Wikipedia article on Musa Bigiev; used for entity facts only. Its lead dates him 25 December 1873 – 28 October 1949, while its Life section states plainly that both his birth date and place are disputed — 1870, 1875 or 1873 for the year; the village of Mishar or Novocherkassk for the place. It covers his madrasa education in Kazan, Bukhara, Samarkand, Cairo, Damascus and Istanbul, his Ittifaq activism, his teaching at the Husayniya madrasa in Orenburg, his 1923 arrest and release, his flight from the USSR in 1930, his world travels, his house arrest in Peshawar (1939–1945), and his death at Cairo on 28 October 1949, buried in the royal cemetery of the Khedives. Its Views section sets out his argument for the universality of divine mercy, Mustafa Sabri's criticism and the 'Luther of Islam' epithet, and describes him, characterising his polemics, as one of the 'most notorious Sunnite polemicists against Shiism'."
  es: "Artículo de la Wikipedia en inglés sobre Musa Bigiev; utilizado únicamente para datos sobre la persona. Su introducción lo fecha entre el 25 de diciembre de 1873 y el 28 de octubre de 1949, mientras que su sección de Vida afirma claramente que tanto su fecha como su lugar de nacimiento son objeto de controversia: 1870, 1875 o 1873 para el año; el pueblo de Mishar o Novocherkassk para el lugar. Cubre su educación en madrasas en Kazán, Bujará, Samarcanda, El Cairo, Damasco e Estambul, su activismo en Ittifaq, su enseñanza en la madrasa Husayniya en Orenburg, su arresto y liberación en 1923, su huida de la URSS en 1930, sus viajes por el mundo, su arresto domiciliario en Peshawar (1939-1945) y su muerte en El Cairo el 28 de octubre de 1949, donde fue enterrado en el cementerio real de los jedives. En su sección de Opiniones, expone su argumento a favor de la universalidad de la misericordia divina, la crítica de Mustafa Sabri y el epíteto de \"Lutero del Islam\", y lo describe, caracterizando sus polémicas, como uno de los \"polemistas sunitas más notorios contra el chiismo\"."
  fr: "Article de Wikipédia en anglais sur Musa Bigiev; utilisé uniquement pour les informations biographiques. Son introduction situe sa naissance entre le 25 décembre 1873 et le 28 octobre 1949, tandis que sa biographie précise que sa date et son lieu de naissance sont incertains: 1870, 1875 ou 1873 pour l’année; le village de Mishar ou Novocherkassk pour le lieu. L’article relate ses études dans les madrasas de Kazan, Boukhara, Samarcande, Le Caire, Damas et Istanbul, son militantisme ittifaq, son enseignement à la madrasa Husayniya d’Orenbourg, son arrestation et sa libération en 1923, sa fuite d’URSS en 1930, ses voyages à travers le monde, son assignation à résidence à Peshawar (1939-1945) et sa mort au Caire le 28 octobre 1949, inhumé au cimetière royal des Khédives. Sa section « Points de vue » expose son argumentation en faveur de l'universalité de la miséricorde divine, la critique de Mustafa Sabri et l'épithète de « Luther de l'islam », et le décrit, en caractérisant ses polémiques, comme l'un des « polémistes sunnites les plus notoires contre le chiisme »."
  ur: "موسی بگئیف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے لیڈ میں اس کی تاریخ 25 دسمبر 1873 - 28 اکتوبر 1949 ہے، جبکہ اس کے لائف سیکشن میں واضح طور پر کہا گیا ہے کہ اس کی تاریخ پیدائش اور جگہ دونوں متنازعہ ہیں - سال کے لیے 1870، 1875 یا 1873؛ جگہ کے لیے مشار یا نووچرکاسک گاؤں۔ اس میں قازان، بخارا، سمرقند، قاہرہ، دمشق اور استنبول میں ان کی مدرسہ تعلیم، ان کی اتفاق سرگرمی، اورینبرگ کے حسینیہ مدرسہ میں ان کی تدریس، ان کی 1923 میں گرفتاری اور رہائی، 1930 میں یو ایس ایس آر سے ان کی پرواز، ان کی دنیا کا سفر، پشاور میں ان کی نظر بندی اور اکتوبر 1924 میں ان کی وفات ⁦(1924 میں وفات)⁩ شامل ہیں۔ 1949، کھیڈیو کے شاہی قبرستان میں دفن ہوئے۔ اس کا ویوز سیکشن رحمت الٰہی کی آفاقیت، مصطفیٰ صابری کی تنقید اور 'لوتھر آف اسلام' کی خصوصیت کے لیے اس کی دلیل پیش کرتا ہے، اور اسے 'شیعہ کے خلاف سب سے بدنام سنی سیاست دان' میں سے ایک کے طور پر بیان کرتا ہے۔"
