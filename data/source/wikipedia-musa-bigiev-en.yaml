summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن موسى بيغييف؛ تُستخدم لوقائع الكيان فقط. يؤرخ صدرها له من 25 ديسمبر 1873 إلى 28 أكتوبر 1949، بينما يصرح قسم حياتها بأن تاريخ مولده ومكانه متنازع عليهما: فالسنة 1870 أو 1875 أو 1873، والمكان قرية ميشار أو نوفوتشركاسك. وتتناول تعليمه في مدارس قازان وبخارى وسمرقند والقاهرة ودمشق وإسطنبول، ونشاطه في حزب «اتفاق المسلمين»، وتدريسه في المدرسة الحسينية بأورنبورغ، واعتقاله سنة 1923 وإطلاقه، وهربه من الاتحاد السوفيتي سنة 1930، وأسفاره العالمية، وإقامته الجبرية في بيشاور (1939–1945)، ووفاته في القاهرة في 28 أكتوبر 1949 ودفنه في مقبرة الخديويين الملكية. ويعرض قسم آرائها حجته في عموم الرحمة الإلهية ونقد مصطفى صبري له ولقب «لوثر الإسلام»، ويصفه، في توصيف سجالاته، بأنه من «أشهر المنافحين السنّة ضد الشيعة»."
  en: "English Wikipedia article on Musa Bigiev; used for entity facts only. Its lead dates him 25 December 1873 – 28 October 1949, while its Life section states plainly that both his birth date and place are disputed — 1870, 1875 or 1873 for the year; the village of Mishar or Novocherkassk for the place. It covers his madrasa education in Kazan, Bukhara, Samarkand, Cairo, Damascus and Istanbul, his Ittifaq activism, his teaching at the Husayniya madrasa in Orenburg, his 1923 arrest and release, his flight from the USSR in 1930, his world travels, his house arrest in Peshawar (1939–1945), and his death at Cairo on 28 October 1949, buried in the royal cemetery of the Khedives. Its Views section sets out his argument for the universality of divine mercy, Mustafa Sabri's criticism and the 'Luther of Islam' epithet, and describes him, characterising his polemics, as one of the 'most notorious Sunnite polemicists against Shiism'."
