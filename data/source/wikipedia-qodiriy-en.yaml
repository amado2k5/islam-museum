summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله قادري ⁦(10 أبريل 1894 – 4 أكتوبر 1938)⁩، الروائي والمسرحي والشاعر الأوزبكي من طشقند، مؤسس الرواية الأوزبكية بـ«الأيام الماضية» (1922)، الذي كتب باسم جولقونبوي وأُعدم في التطهير الكبير."
  en: "The English Wikipedia article on Abdulla Qodiriy (10 April 1894 – 4 October 1938), the Tashkent-born Uzbek novelist, playwright and poet, founder of the Uzbek novel with Oʻtgan kunlar (Bygone Days, 1922), who wrote as Julqunboy and was executed in the Great Purge."
  es: "El artículo de la Wikipedia en inglés sobre Abdulla Qodiriy (10 de abril de 1894 - 4 de octubre de 1938), novelista, dramaturgo y poeta uzbeko nacido en Tashkent, fundador de la novela uzbeka con Oʻtgan kunlar (Días pasados, 1922), que escribía bajo el seudónimo de Julqunboy y fue ejecutado en la Gran Purga."
  fr: "L'article de Wikipédia en anglais sur Abdulla Qodiriy (10 avril 1894 – 4 octobre 1938), romancier, dramaturge et poète ouzbek né à Tachkent, fondateur du roman ouzbek avec Oʻtgan kunlar (Jours passés, 1922), qui écrivait sous le pseudonyme de Julqunboy et fut exécuté lors des Grandes Purges."
  ur: "عبداللہ قدیری ⁦(10 اپریل 1894 - 4 اکتوبر 1938)⁩ پر انگریزی ویکیپیڈیا کا مضمون، تاشقند میں پیدا ہونے والے ازبک ناول نگار، ڈرامہ نگار اور شاعر، ازبک ناول کے بانی اوتگن کنلر ⁦(بائیگون ڈیز، 1922)⁩ کے ساتھ، جنہوں نے جلقونبوجی کے نام سے لکھا اور اسے جلاوطن کیا گیا۔"
  tr: "Özbek romancı, oyun yazarı ve şair Abdullah Qadri (10 Nisan 1894 – 4 Ekim 1938) hakkında İngilizce Vikipedi makalesi; Özbek romanı \"Geçmiş Günler\"in (1922) kurucusu ve Gulqunboy adıyla yazmış ve Büyük Temizlik sırasında idam edilmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdullah Qadri (10 April 1894 – 4 Oktober 1938), novelis, dramawan, dan penyair Uzbek dari Tashkent, pendiri novel Uzbek \"Days Past\" (1922), yang menulis dengan nama Gulqunboy dan dieksekusi selama Pembersihan Besar."
