summary:
  ar: "مقالة ويكيبيديا العربية عن فيصل بن عبد العزيز آل سعود؛ تُستخدم لوقائع الكيان فقط. تقرن ولادته بـ14 صفر 1324هـ ⁦(14 أبريل 1906)⁩ ووفاته بـ12 ربيع الأول 1395هـ ⁦(25 مارس 1975)⁩، وتروي نشأته عند أخواله آل الشيخ ومسيرته وحكمه وانتقال السلطة سنة 1964 بالتفصيل؛ ولا يذكر متنها له مذهبًا."
  en: "Arabic Wikipedia article on Faisal bin Abdulaziz Al Saud; used for entity facts only. It pairs his birth with 14 Safar 1324 AH (14 April 1906) and his death with 12 Rabi' al-Awwal 1395 AH (25 March 1975), and recounts his upbringing by his Al ash-Sheikh maternal grandparents, his career and reign and the 1964 transfer of power in detail; its text names no madhhab for him."
  es: "Artículo de Wikipedia en árabe sobre Faisal bin Abdulaziz Al Saud; utilizado únicamente para datos sobre la persona. Sitúa su nacimiento el 14 de Safar de 1324 AH (14 de abril de 1906) y su muerte el 12 de Rabi' al-Awwal de 1395 AH (25 de marzo de 1975), y relata con detalle su crianza por sus abuelos maternos Al ash-Sheikh, su carrera y reinado, y la transferencia de poder de 1964; el texto no menciona ninguna escuela jurídica (madhhab) para él."
  fr: "Article de Wikipédia en arabe sur Faisal bin Abdulaziz Al Saud; utilisé uniquement pour les informations relatives à l'entité. Il situe sa naissance le 14 Safar 1324 AH (14 avril 1906) et sa mort le 12 Rabi' al-Awwal 1395 AH (25 mars 1975), et relate en détail son éducation par ses grands-parents maternels Al ash-Sheikh, sa carrière et son règne, ainsi que la transition du pouvoir en 1964; le texte ne mentionne aucune école de pensée (madhhab) à son sujet."
  ur: "فیصل بن عبدالعزیز آل سعود پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی ولادت 14 صفر 1324 ہجری ⁦(14 اپریل 1906)⁩ اور ان کی وفات 12 ربیع الاول 1395 ہجری ⁦(25 مارچ 1975)⁩ کے ساتھ ملتی ہے، اور ان کی پرورش ان کے الشیخ ماموں، ان کے کیریئر اور دور حکومت اور 16 میں اقتدار کی منتقلی کا ذکر کرتی ہے۔ اس کے متن کا نام اس کے لیے کوئی مذہب نہیں ہے۔"
