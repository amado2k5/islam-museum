  ar: "مقالة ويكيبيديا العربية عن فيصل بن عبد العزيز آل سعود؛ تُستخدم لوقائع الكيان فقط. تقرن ولادته بـ14 صفر 1324هـ (14 أبريل 1906) ووفاته بـ12 ربيع الأول 1395هـ (25 مارس 1975)، وتروي نشأته عند أخواله آل الشيخ ومسيرته وحكمه وانتقال السلطة سنة 1964 بالتفصيل؛ ولا يذكر متنها له مذهبًا."
  en: "Arabic Wikipedia article on Faisal bin Abdulaziz Al Saud; used for entity facts only. It pairs his birth with 14 Safar 1324 AH (14 April 1906) and his death with 12 Rabi' al-Awwal 1395 AH (25 March 1975), and recounts his upbringing by his Al ash-Sheikh maternal grandparents, his career and reign and the 1964 transfer of power in detail; its text names no madhhab for him."
