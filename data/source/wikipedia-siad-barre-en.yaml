summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد سياد بري؛ تُستخدم لوقائع الكيان فقط. تروي ولادته المتنازع عليها (نحو 1919)، وانقلاب 1969، ورئاسته الصومال (1969–1991) وأيديولوجية نظامه التي وفقت بين الاشتراكية العلمية والمبادئ الإسلامية، وإعدامه عشرة شيوخ في يناير 1975 عارضوا قانون الأسرة، وسقوطه ووفاته في لاغوس في 2 يناير 1995؛ ولا يسمي متنها مذهبا له شخصيا."
  en: "English Wikipedia article on Siad Barre; used for entity facts only. It recounts his disputed birth (c. 1919), the 1969 coup, his presidency of Somalia (1969–1991), his regime's ideology reconciling scientific socialism with Islamic tenets, his January 1975 execution of ten sheikhs who had opposed the new family law, his fall and his death in Lagos on 2 January 1995. Its text names no school for Barre personally."
