summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد سياد بري؛ تُستخدم لوقائع الكيان فقط. تروي ولادته المتنازع عليها ⁦(نحو 1919)⁩، وانقلاب 1969، ورئاسته الصومال (1969–1991) وأيديولوجية نظامه التي وفقت بين الاشتراكية العلمية والمبادئ الإسلامية، وإعدامه عشرة شيوخ في يناير 1975 عارضوا قانون الأسرة، وسقوطه ووفاته في لاغوس في 2 يناير 1995؛ ولا يسمي متنها مذهبا له شخصيا."
  en: "English Wikipedia article on Siad Barre; used for entity facts only. It recounts his disputed birth (c. 1919), the 1969 coup, his presidency of Somalia (1969–1991), his regime's ideology reconciling scientific socialism with Islamic tenets, his January 1975 execution of ten sheikhs who had opposed the new family law, his fall and his death in Lagos on 2 January 1995. Its text names no school for Barre personally."
  es: "Artículo de la Wikipedia en inglés sobre Siad Barre; utilizado únicamente para datos sobre la persona. Relata su controvertido nacimiento (c. 1919), el golpe de Estado de 1969, su presidencia de Somalia (1969-1991), la ideología de su régimen que conciliaba el socialismo científico con los principios islámicos, la ejecución en enero de 1975 de diez jeques que se habían opuesto a la nueva ley de familia, su caída y su muerte en Lagos el 2 de enero de 1995. El texto no menciona ninguna escuela a la que perteneciera Barre."
  fr: "Article de Wikipédia en anglais sur Siad Barre; utilisé uniquement pour les informations relatives à l'entité. Il relate sa naissance contestée (vers 1919), le coup d'État de 1969, sa présidence de la Somalie (1969-1991), l'idéologie de son régime conciliant socialisme scientifique et préceptes islamiques, l'exécution par ses soins, en janvier 1975, de dix cheikhs qui s'étaient opposés à la nouvelle loi sur la famille, sa chute et sa mort à Lagos le 2 janvier 1995. Le texte ne mentionne aucune école à laquelle Barre aurait été personnellement associé."
