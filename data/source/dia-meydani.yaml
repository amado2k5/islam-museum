reliability_note: "Read in the museum's session on 20 November 2026. It gives his birth in the Maydan-i Ziyad quarter of Nishapur and his death there on 25 Ramadan 518 (5 November 1124); reports that al-Zamakhshari was among those who envied him for his Majma' al-amthal; and describes the book as the best and most comprehensive study of Arabic proverbs, with more than 6,000 alphabetical proverbs and information on their origin, use and linguistic difficulties, and, in two chapters (29 and 30), the days of the Arabs, various hadith and sayings of the four caliphs and other figures. Used for entity facts only."
