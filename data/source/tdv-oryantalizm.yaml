summary:
  ar: "مدخل «استشراق» ⁦(ORYANTALİZM)⁩ في موسوعة TDV الإسلامية بقلم يوجال بولوت: تاريخ معنى كلمة «مستشرق» من عضو الكنيسة الشرقية إلى المتخصص في دراسات الشرق، والتحوّل من الترجمة الكنسية — مجمع كلوني وكرسيّات مجمع فيين سنة 1312 — إلى الكراسي الأكاديمية في باريس ولايدن وأكسفورد، والجمعيات والمجلات في القرن التاسع عشر، ونقد إدوارد سعيد للاستشراق."
  en: "The TDV İslâm Ansiklopedisi entry 'ORYANTALİZM' by Yücel Bulut: the history of the word 'orientalist' from a member of the Eastern church to the specialist in Eastern studies, the shift from church translation — the Cluny corpus and the chairs decreed by the Council of Vienne in 1312 — to the academic chairs of Paris, Leiden and Oxford, the nineteenth-century societies and journals, and Edward Said's critique of orientalism."
  es: "La entrada \"ORYANTALİZM\" de Yücel Bulut en la base de datos TDV İslâm Ansiklopedisi trata sobre la historia de la palabra \"orientalista\", desde su origen como miembro de la Iglesia Oriental hasta su especialización en estudios orientales; el paso de la traducción eclesiástica —el corpus de Cluny y las cátedras decretadas por el Concilio de Vienne en 1312— a las cátedras académicas de París, Leiden y Oxford, las sociedades y revistas del siglo XIX, y la crítica de Edward Said al orientalismo."
  fr: "L'article « ORIANTALIZM » de Yücel Bulut dans la TDV İslâm Ansiklopedisi: l'histoire du mot « orientaliste », depuis le membre de l'Église d'Orient jusqu'au spécialiste des études orientales, le passage de la traduction ecclésiastique — le corpus de Cluny et les chaires décrétées par le concile de Vienne en 1312 — aux chaires universitaires de Paris, Leyde et Oxford, aux sociétés et revues du XIXe siècle, et à la critique de l'orientalisme par Edward Said."
  ur: "TDV İslâm Ansiklopedisi entry 'ORYANTALİZM' از Yücel Bulut: مشرقی کلیسیا کے ایک رکن سے مشرقی علوم کے ماہر تک لفظ 'اورینٹلسٹ' کی تاریخ، چرچ کے ترجمے سے منتقلی - کلینی کارپس اور کونسل کی کرسیوں نے 12 میں 12 میں فیصلہ کیا پیرس، لیڈن اور آکسفورڈ کی کرسیاں، انیسویں صدی کے معاشروں اور جرائد، اور مشرقیت پر ایڈورڈ سعید کی تنقید۔"
  tr: "TDV İslami Ansiklopedisi'nde Yucel Bulut'un \"Oryantalizm\" (ORYANTALİZM) başlıklı maddesi: \"Oryantalist\" kelimesinin anlamının tarihi, Doğu Kilisesi üyesinden Doğu araştırmaları uzmanına geçiş, kilise çevirisinden — Cluny Konsili ve 1312'deki Viyana Konsili başkanlıkları — Paris, Leiden ve Oxford'daki akademik koltuklara, ayrıca on dokuzuncu yüzyılda dernekler ve dergilere geçiş ve Edward Said'in Oryantalizm eleştirisi."
  id: "Entri tentang \"Orientalisme\" (ORYANTALİZM) dalam Ensiklopedia Islam TDV oleh Yucel Bulut: Sejarah makna kata \"Orientalis\" dari anggota Gereja Timur menjadi spesialis studi Oriental, transisi dari terjemahan gerejawi — Konsili Cluny dan kursi Konsili Wina pada tahun 1312 — ke kursi akademik di Paris, Leiden, dan Oxford, serta masyarakat dan majalah pada abad kesembilan belas, dan kritik Edward Said terhadap Orientalisme."
