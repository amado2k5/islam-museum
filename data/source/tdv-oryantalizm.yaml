summary:
  ar: "مدخل «استشراق» ⁦(ORYANTALİZM)⁩ في موسوعة TDV الإسلامية بقلم يوجال بولوت: تاريخ معنى كلمة «مستشرق» من عضو الكنيسة الشرقية إلى المتخصص في دراسات الشرق، والتحوّل من الترجمة الكنسية — مجمع كلوني وكرسيّات مجمع فيين سنة 1312 — إلى الكراسي الأكاديمية في باريس ولايدن وأكسفورد، والجمعيات والمجلات في القرن التاسع عشر، ونقد إدوارد سعيد للاستشراق."
  en: "The TDV İslâm Ansiklopedisi entry 'ORYANTALİZM' by Yücel Bulut: the history of the word 'orientalist' from a member of the Eastern church to the specialist in Eastern studies, the shift from church translation — the Cluny corpus and the chairs decreed by the Council of Vienne in 1312 — to the academic chairs of Paris, Leiden and Oxford, the nineteenth-century societies and journals, and Edward Said's critique of orientalism."
