  en: "English Wikipedia article on Qutb al-Din al-Shirazi (1236-1311), Persian polymath; it gives his birth in October 1236 at Shiraz, records that he received the Sufi khirqa from his father at the age of ten and later from Najib al-Din Bozgush, and that he studied under Nasir al-Din al-Tusi at Maragha; used for entity facts only."
