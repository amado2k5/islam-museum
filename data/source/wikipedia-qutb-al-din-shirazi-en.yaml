summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن قطب الدين الشيرازي (1236–1311)، العالم الفارسي الموسوعي؛ تعطي ولادته في أكتوبر 1236 بشيراز، وتذكر أنه لبس الخرقة الصوفية من أبيه في سن العاشرة ثم من نجيب الدين بوزگوش، وأنه تتلمذ على نصير الدين الطوسي في مراغة؛ تُستخدم لوقائع الكيان فقط."
  en: "English Wikipedia article on Qutb al-Din al-Shirazi (1236-1311), Persian polymath; it gives his birth in October 1236 at Shiraz, records that he received the Sufi khirqa from his father at the age of ten and later from Najib al-Din Bozgush, and that he studied under Nasir al-Din al-Tusi at Maragha; used for entity facts only."
  es: "Artículo de la Wikipedia en inglés sobre Qutb al-Din al-Shirazi (1236-1311), polímata persa; indica que nació en octubre de 1236 en Shiraz, registra que recibió la khirqa sufí de su padre a la edad de diez años y más tarde de Najib al-Din Bozgush, y que estudió con Nasir al-Din al-Tusi en Maragha; utilizado solo para datos de la entidad."
  fr: "Article de Wikipédia en anglais sur Qutb al-Din al-Shirazi (1236-1311), polymathe persan; il indique sa naissance en octobre 1236 à Shiraz, rapporte qu'il a reçu la khirqa soufie de son père à l'âge de dix ans et plus tard de Najib al-Din Bozgush, et qu'il a étudié sous Nasir al-Din al-Tusi à Maragha; utilisé uniquement pour les faits concernant l'entité."
  ur: "قطب الدین الشیرازی (1236-1311) پر انگریزی ویکیپیڈیا مضمون، فارسی پولی میتھ؛ اس کی پیدائش اکتوبر 1236 میں شیراز میں ہوئی، ریکارڈ ہے کہ اس نے دس سال کی عمر میں اپنے والد سے اور بعد میں نجیب الدین بوزگش سے صوفی خیرہ حاصل کیا، اور یہ کہ اس نے مراثہ میں ناصر الدین الطوسی کے پاس تعلیم حاصل کی۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔"
