  ar: "مقالة ويكيبيديا العربية عن صفر بي زانوقه؛ تُستخدم لوقائع الكيان فقط، وهي ترجمة للمقالة الإنجليزية فتعد معها أسرة مصدر واحدة. تعطي مولده سنة 1798 قرب أنابا ووفاته في 1 يناير 1860، وسيرته زعيما للمقاومة الشركسية ودبلوماسيا لدى الباب العالي."
  en: "Arabic Wikipedia article on Seferbiy Zaneqo; used for entity facts only. It is a translation of the English article, so the two form one source family. It gives his birth in 1798 near Anapa, his death on 1 January 1860, and his career as a Circassian resistance leader and diplomat at the Ottoman Porte."
