summary:
  ar: "مقالة ويكيبيديا العربية عن صفر بي زانوقه؛ تُستخدم لوقائع الكيان فقط، وهي ترجمة للمقالة الإنجليزية فتعد معها أسرة مصدر واحدة. تعطي مولده سنة 1798 قرب أنابا ووفاته في 1 يناير 1860، وسيرته زعيما للمقاومة الشركسية ودبلوماسيا لدى الباب العالي."
  en: "Arabic Wikipedia article on Seferbiy Zaneqo; used for entity facts only. It is a translation of the English article, so the two form one source family. It gives his birth in 1798 near Anapa, his death on 1 January 1860, and his career as a Circassian resistance leader and diplomat at the Ottoman Porte."
  es: "Artículo de Wikipedia en árabe sobre Seferbiy Zaneqo; se utiliza únicamente para obtener información sobre la persona. Es una traducción del artículo en inglés, por lo que ambos forman una misma fuente. Indica su nacimiento en 1798 cerca de Anapa, su muerte el 1 de enero de 1860 y su trayectoria como líder de la resistencia circasiana y diplomático en la Sublime Puerta."
  fr: "Article de Wikipédia en arabe sur Seferbiy Zaneqo; utilisé uniquement pour les informations le concernant. Il s'agit d'une traduction de l'article anglais, les deux sources formant ainsi une seule et même famille. On y apprend sa naissance en 1798 près d'Anapa, sa mort le 1er janvier 1860 et sa carrière de chef de la résistance circassienne et de diplomate auprès de la Sublime Porte."
  ur: "Seferbiy Zaneqo پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انگریزی مضمون کا ترجمہ ہے، اس لیے دونوں ایک ذریعہ خاندان بناتے ہیں۔ یہ انپا کے قریب 1798 میں ان کی پیدائش، 1 جنوری 1860 کو اس کی موت، اور عثمانی پورٹ میں سرکیسیئن مزاحمتی رہنما اور سفارت کار کے طور پر اس کا کیریئر ہے۔"
