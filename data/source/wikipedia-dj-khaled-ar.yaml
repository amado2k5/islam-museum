reliability_note: "The Arabic article confirms his birth in 1975 in New Orleans to Palestinian immigrant parents and the outline of his career, and repeats the two faith points of the English article (the 2014 \"devout Muslim\" self-description and the December 2022 Umrah with Mike Tyson, citing The New Arab). It gives his name as \"Khaled Mohammed Khaled Abadi\"; the element \"Abadi\" appears in neither the English article nor Wikidata and is not carried into the record’s names. It names no legal school. Read on 26 October 2026 and checked against the recorded revision."
