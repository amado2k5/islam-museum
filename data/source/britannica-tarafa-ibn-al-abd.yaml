summary:
  ar: "صفحة «Tarafah ibn al-ʿAbd» لدى Encyclopaedia Britannica. لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملخص بحثي قُدّم إلى المتحف ووافق المؤسس على استعماله في 21 نوفمبر 2026. يُستشهد بها في: قبيلة هذا الشاعر وتاريخه التقريبي كما يدرجهما الملخص البحثي في جدول."
  en: "The page \"Tarafah ibn al-ʿAbd\" (Encyclopaedia Britannica). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum and approved for use by the founder on 21 November 2026. Cited for: this poet's tribe and approximate dates as the research summary tabulates them."
  ur: "صفحہ «Tarafah ibn al-ʿAbd»، Encyclopaedia Britannica۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ عجائب گھر کو دیے گئے ایک تحقیقی خلاصے سے ہے جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ اس کے لیے دیا گیا: اس شاعر کا قبیلہ اور تخمینی زمانہ جیسا تحقیقی خلاصہ جدول میں درج کرتا ہے۔"
  fr: "La page « Tarafah ibn al-ʿAbd » (Encyclopaedia Britannica). Le musée ne l'a pas ouverte lui-même : ce qu'on en sait vient d'une synthèse de recherche remise au musée et approuvée pour usage par le fondateur le 21 novembre 2026. Citée pour : la tribu de ce poète et ses dates approximatives telles que la synthèse de recherche les tabule."
  es: "La página «Tarafah ibn al-ʿAbd» (Encyclopaedia Britannica). El museo no la abrió por sí mismo: lo que se sabe de ella procede de un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026. Citada para: la tribu de este poeta y sus fechas aproximadas tal como las tabula el resumen de investigación."
  tr: "\"Tarafah ibn al-ʿAbd\" sayfası Encyclopaedia Britannica'da. Müze kendisi açmamıştır; içeriği, kurucunun 21 Kasım 2026'da kullanıma onay verdiği müzeye sunulan bir araştırma özetinden bilinmektedir. Şairin kabilesi ve yaklaşık tarihi, araştırma özetinde bir tabloda listelenmiştir."
  id: "Halaman \"Tarafah ibn al-ʿAbd\" di Encyclopaedia Britannica. Museum itu sendiri tidak membukanya; isinya diketahui dari ringkasan penelitian yang dikirim ke museum, yang disetujui pendiri untuk digunakan pada 21 November 2026. Ringkasan ini dikutip dalam: Suku penyair ini dan sejarah perkiraannya, sebagaimana tercantum dalam ringkasan penelitian dalam sebuah tabel."
