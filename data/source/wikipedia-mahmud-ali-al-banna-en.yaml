summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن القارئ محمود علي البنا؛ لوقائع الكيان فقط: مولده في شبرا باص بالمنوفية في 17 ديسمبر 1926، ودراسته في طنطا والقاهرة، والتحاقه بالإذاعة في 1948، ومساجده ⁦(عين الحياة والرفاعي والأحمدي والحسين)⁩، ونيابته لنقيب القراء من 1984، ووفاته في 20 يوليو 1985، ووسام العلوم والفنون في 1990؛ وتستند إلى الأهرام واليوم السابع والمصري اليوم والجزيرة."
  en: "English Wikipedia article on the reciter Mahmud Ali al-Banna; entity facts only: birth at Shubra Bas, Monufia, on 17 December 1926, study at Tanta and Cairo, joining the radio in 1948, his mosques (Ain al-Hayat, al-Rifa'i, al-Badawi, al-Hussein), deputy headship of the reciters' syndicate from 1984, death on 20 July 1985 and the Order of Sciences and Arts in 1990; it cites al-Ahram, Youm7, al-Masry al-Youm and Al Jazeera."
  es: "Artículo de la Wikipedia en inglés sobre el recitador Mahmud Ali al-Banna; solo datos sobre la entidad: nacimiento en Shubra Bas, Monufia, el 17 de diciembre de 1926, estudios en Tanta y El Cairo, incorporación a la radio en 1948, sus mezquitas (Ain al-Hayat, al-Rifa'i, al-Badawi, al-Hussein), vicepresidencia del sindicato de recitadores desde 1984, fallecimiento el 20 de julio de 1985 y la Orden de las Ciencias y las Artes en 1990; cita a al-Ahram, Youm7, al-Masry al-Youm y Al Jazeera."
  fr: "Article de Wikipédia en anglais sur le récitant Mahmud Ali al-Banna; faits concernant uniquement l’entité: naissance à Shubra Bas, Monufia, le 17 décembre 1926, études à Tanta et au Caire, entrée à la radio en 1948, ses mosquées (Ain al-Hayat, al-Rifa'i, al-Badawi, al-Hussein), vice-président du syndicat des récitants à partir de 1984, décès le 20 juillet 1985 et Ordre des Sciences et des Arts en 1990; il cite al-Ahram, Youm7, al-Masry al-Youm et Al Jazeera."
  ur: "قاری محمود علی البنا پر انگریزی ویکیپیڈیا کا مضمون؛ ہستی کے حقائق صرف: شبرہ بس، مونوفیہ میں 17 دسمبر 1926 کو پیدائش، طنطہ اور قاہرہ میں تعلیم حاصل کی، 1948 میں ریڈیو سے منسلک، اس کی مساجد ⁦(عین الحیات، الرفاعی، البداوی، الحسین)⁩، قاریوں کے سنڈیکیٹ کی نائب سربراہی اور 19 جولائی 1948 کو وفات پائی۔ 1990 میں سائنس اور آرٹس کے; اس میں الاحرام، یوم 7، المصری الیووم اور الجزیرہ کا حوالہ دیا گیا ہے۔"
  tr: "Okuyucu Mahmoud Ali Al-Banna hakkında İngilizce Wikipedia makalesi; sadece varlığın gerçekleri için: 17 Aralık 1926'da Menufya'daki Shubra Bus'ta doğması, Tanta ve Kahire'deki eğitimi, 1948'de radyoya katılması, camileri (Ain Al-Hayat, Al-Rifai, Al-Ahmadi ve Al-Hussein), 1984'ten itibaren Reciters' Sendikası başkanlığı yardımcısı, 20 Temmuz 1985'teki ölümü ve 1990'daki Bilim ve Sanat Nişanı; Al-Ahram, Youm7, Al-Masry Al-Youm ve Al-Jazeera'ya dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang pembaca Mahmoud Ali Al-Banna; hanya untuk fakta entitas: kelahirannya di Shubra Bus di Menoufia pada 17 Desember 1926, studinya di Tanta dan Kairo, bergabung dengan radio pada tahun 1948, masjid-masjidnya (Ain Al-Hayat, Al-Rifai, Al-Ahmadi, dan Al-Hussein), wakilnya sebagai kepala Sindikat Reciter sejak 1984, kematiannya pada 20 Juli 1985, dan Ordo Ilmu Pengetahuan dan Seni pada 1990; didasarkan pada Al-Ahram, Youm7, Al-Masry Al-Youm, dan Al-Jazeera."
