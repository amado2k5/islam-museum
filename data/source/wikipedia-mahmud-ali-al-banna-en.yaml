summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0625\u0646\u062c\u0644\u064a\u0632\u064a\u0629 \u0639\u0646 \u0627\u0644\u0642\u0627\u0631\u0626 \u0645\u062d\u0645\u0648\u062f \u0639\u0644\u064a \u0627\u0644\u0628\u0646\u0627\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u0634\u0628\u0631\u0627 \u0628\u0627\u0635 \u0628\u0627\u0644\u0645\u0646\u0648\u0641\u064a\u0629 \u0641\u064a 17 \u062f\u064a\u0633\u0645\u0628\u0631 1926\u060c \u0648\u062f\u0631\u0627\u0633\u062a\u0647 \u0641\u064a \u0637\u0646\u0637\u0627 \u0648\u0627\u0644\u0642\u0627\u0647\u0631\u0629\u060c \u0648\u0627\u0644\u062a\u062d\u0627\u0642\u0647 \u0628\u0627\u0644\u0625\u0630\u0627\u0639\u0629 \u0641\u064a 1948\u060c \u0648\u0645\u0633\u0627\u062c\u062f\u0647 (\u0639\u064a\u0646 \u0627\u0644\u062d\u064a\u0627\u0629 \u0648\u0627\u0644\u0631\u0641\u0627\u0639\u064a \u0648\u0627\u0644\u0623\u062d\u0645\u062f\u064a \u0648\u0627\u0644\u062d\u0633\u064a\u0646)\u060c \u0648\u0646\u064a\u0627\u0628\u062a\u0647 \u0644\u0646\u0642\u064a\u0628 \u0627\u0644\u0642\u0631\u0627\u0621 \u0645\u0646 1984\u060c \u0648\u0648\u0641\u0627\u062a\u0647 \u0641\u064a 20 \u064a\u0648\u0644\u064a\u0648 1985\u060c \u0648\u0648\u0633\u0627\u0645 \u0627\u0644\u0639\u0644\u0648\u0645 \u0648\u0627\u0644\u0641\u0646\u0648\u0646 \u0641\u064a 1990\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0627\u0644\u0623\u0647\u0631\u0627\u0645 \u0648\u0627\u0644\u064a\u0648\u0645 \u0627\u0644\u0633\u0627\u0628\u0639 \u0648\u0627\u0644\u0645\u0635\u0631\u064a \u0627\u0644\u064a\u0648\u0645 \u0648\u0627\u0644\u062c\u0632\u064a\u0631\u0629."
  en: "English Wikipedia article on the reciter Mahmud Ali al-Banna; entity facts only: birth at Shubra Bas, Monufia, on 17 December 1926, study at Tanta and Cairo, joining the radio in 1948, his mosques (Ain al-Hayat, al-Rifa'i, al-Badawi, al-Hussein), deputy headship of the reciters' syndicate from 1984, death on 20 July 1985 and the Order of Sciences and Arts in 1990; it cites al-Ahram, Youm7, al-Masry al-Youm and Al Jazeera."
