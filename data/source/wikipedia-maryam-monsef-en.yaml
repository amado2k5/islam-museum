  ar: مقالة ويكيبيديا الإنجليزية عن مريم منصف؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في 7 نوفمبر 1984 في مشهد بإيران لأبوين أفغانيين، وتسجل رحلاتها بتأشيرات زيارة إلى ضريح الإمام الرضا في 2010 و2013 و2014؛ ولا تسمّي ديانة في متنها.
  en: English Wikipedia article on Maryam Monsef; used for entity facts only. It gives her birth on 7 November 1984 at Mashhad, Iran, to Afghan parents, and records her 2010, 2013 and 2014 pilgrimage-visa trips to the Imam Reza shrine; it names no religion in its text.
  es: "Artículo de la Wikipedia en inglés sobre Maryam Monsef; utilizado únicamente para datos sobre la persona. Indica que nació el 7 de noviembre de 1984 en Mashhad, Irán, de padres afganos, y registra sus viajes de peregrinación con visa al santuario del Imam Reza en 2010, 2013 y 2014; no menciona ninguna religión en su texto."
  fr: "Article de Wikipédia en anglais sur Maryam Monsef; utilisé uniquement à des fins d’information sur la personne. Il indique sa naissance le 7 novembre 1984 à Mashhad, en Iran, de parents afghans, et mentionne ses voyages en pèlerinage au sanctuaire de l’imam Reza en 2010, 2013 et 2014, effectués dans le cadre d’un visa de pèlerinage; aucune religion n’est mentionnée dans le texte."
  ur: "مریم منصف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 7 نومبر 1984 کو مشہد، ایران میں، افغان والدین کے ہاں اس کی پیدائش ہوئی، اور اس کے 2010، 2013 اور 2014 کے امام رضا کے مزار کی زیارت کے ویزے کے سفر کو ریکارڈ کرتا ہے۔ اس کے متن میں کسی مذہب کا نام نہیں ہے۔"
