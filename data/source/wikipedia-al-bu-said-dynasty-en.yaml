reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 24 October 2026. The article's infobox records the house's traditions as Ibadi Islam, and the article is categorised among Omani Ibadi Muslims; its stated realms include the Sultanate of Zanzibar (1856–1964) and its cadet branches include the Royal Family of Zanzibar. It is cited in the record of Ali bin Said of Zanzibar for the dynasty's attested affiliation — the article does not discuss Ali bin Said's personal religion, and it is not used for any biographical fact about him."
