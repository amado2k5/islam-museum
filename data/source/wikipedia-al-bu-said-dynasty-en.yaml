summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أسرة آل بوسعيد الحاكمة في عُمان وزنجبار؛ تُستخدم هنا لتوثيق تقليد الأسرة الديني: يذكر صندوق معلوماتها أن تقليدها هو الإسلام الإباضي، وتشمل ممالكها سلطنة زنجبار (1856-1964)."
  en: "English Wikipedia article on the Al Bu Said dynasty, ruling house of Oman and Zanzibar; used here for the dynasty's recorded religious tradition: its infobox gives the house's traditions as Ibadi Islam, and its realms include the Sultanate of Zanzibar (1856–1964)."
  es: "Artículo de la Wikipedia en inglés sobre la dinastía Al Bu Said, casa gobernante de Omán y Zanzíbar; utilizado aquí para la tradición religiosa registrada de la dinastía: su ficha informativa indica que las tradiciones de la casa eran del Islam ibadí, y sus dominios incluyen el Sultanato de Zanzíbar (1856-1964)."
  fr: "Article de Wikipédia en anglais sur la dynastie Al Bu Said, maison régnante d'Oman et de Zanzibar; utilisé ici pour la tradition religieuse enregistrée de la dynastie: son infobox donne les traditions de la maison comme étant l'islam ibadite, et ses royaumes comprennent le sultanat de Zanzibar (1856-1964)."
  ur: "انگریزی ویکیپیڈیا مضمون البو سعید خاندان پر، عمان اور زنجبار کے حکمران گھرانے؛ یہاں خاندان کی ریکارڈ شدہ مذہبی روایت کے لیے استعمال کیا جاتا ہے: اس کا معلومات خانہ عبادی اسلام کے طور پر گھر کی روایات دیتا ہے، اور اس کے دائروں میں زنجبار کی سلطنت (1856–1964) شامل ہے۔"
