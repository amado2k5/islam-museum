summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد اللطيف رشيد؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 10 آب 1944 بالسليمانية استنادًا إلى سيرته الرسمية، ورئاسته للعراق من 2022 إلى 2026 خلفًا لبرهم صالح وخلفه نزار آميدي، ولا تسمّي دينًا له في نصها ولا صندوقها وتصنّفه ضمن «مسلمون سنة عراقيون»."
  en: "English Wikipedia article on Abdul Latif Rashid; used for entity facts only. It gives his birth on 10 August 1944 at Sulaymaniyah, citing his official curriculum vitae, and his presidency of Iraq from 2022 to 2026 in succession to Barham Salih, with Nizar Amidi as his successor. It names no religion for him in text or infobox; its categories file him under 'Iraqi Sunni Muslims'."
