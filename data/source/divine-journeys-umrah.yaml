summary:
  ar: "صفحات شركة ديفاين جيرنيز المنظّمة لباقات عمرة مركز الفرقان في مانشستر؛ تسمّي إمام المركز في باقتي أكتوبر 2025 وأكتوبر 2026، وهي مصدر مستقل عن قناة المركز لهوية إمامه ودوره."
  en: "The Divine Journeys pages for the Alfurqan Manchester Umrah packages; they name the centre's imam in both the October 2025 and October 2026 packages, an attestation of his identity and role independent of the centre's own channel."
  es: "Las páginas de Divine Journeys para los paquetes de Umrah de Alfurqan Manchester mencionan al imán del centro tanto en los paquetes de octubre de 2025 como en los de octubre de 2026, lo que atestigua su identidad y función independientemente del canal propio del centro."
  fr: "Les pages Divine Journeys pour les forfaits Omra d'Alfurqan Manchester mentionnent l'imam du centre dans les forfaits d'octobre 2025 et d'octobre 2026, attestant ainsi de son identité et de son rôle indépendamment du canal propre au centre."
  ur: "الفرقان مانچسٹر عمرہ پیکجز کے لیے الہی سفر کے صفحات؛ انہوں نے اکتوبر 2025 اور اکتوبر 2026 دونوں پیکجوں میں مرکز کے امام کا نام لیا، جو اس کی شناخت اور مرکز کے اپنے چینل سے آزاد کردار کی تصدیق کرتا ہے۔"
  tr: "Manchester'daki Al-Furqan Merkezi'nde Umre paketlerini organize eden Divine Journeys sayfaları; Ekim 2025 ve Ekim 2026 paketlerinde Merkezin İmamı olarak adlandırılmış ve Merkezin kanalından İmamın kimliği ve rolü için bağımsız bir kaynaktır."
  id: "Halaman Divine Journeys, perusahaan penyelenggara paket Umrah di Al-Furqan Center di Manchester; mereka dinobatkan sebagai Imam Pusat dalam paket Oktober 2025 dan Oktober 2026, dan merupakan sumber independen dari saluran Pusat untuk identitas dan peran Imamnya."
