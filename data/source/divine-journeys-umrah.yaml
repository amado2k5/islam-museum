reliability_note: "Divine Journeys is the travel company operating the Alfurqan Manchester Umrah packages, linked from the centre's own site. Its October 2025 and October 2026 package pages both advertise: 'experience the Umrah with our Imam Sheikh Mohamed Ali Mowleed' — an attestation, outside the centre's own channel, that Mohamed Ali Mowleed is the imam of Alfurqan Islamic Centre in Manchester and leads its Umrah groups. It names no school or affiliation for him and gives no biographical details. Checked 24 October 2026."
