summary:
  ar: "مقال موسوعي عن بسم الله خان (1916–2006)، عازف الشهناي الذي رفع الآلة إلى منصة الحفلات ونال بهارات راتنا."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth at Dumraon on 21 March 1916 and death at Varanasi on 21 August 2006, his Red Fort performance of 15 August 1947 and Bharat Ratna, describes him as a devout Muslim and symbol of religious harmony, and files him in its “Indian Shia Muslims” category."
  es: "Artículo de enciclopedia editado por la comunidad, recuperado íntegramente en la revisión indicada; en él se menciona su nacimiento en Dumraon el 21 de marzo de 1916 y su muerte en Varanasi el 21 de agosto de 2006, su actuación en el Fuerte Rojo el 15 de agosto de 1947 y el Bharat Ratna, se le describe como un musulmán devoto y un símbolo de armonía religiosa, y se le clasifica en la categoría de \"musulmanes chiítas indios\"."
  fr: "Article encyclopédique édité par la communauté, récupéré intégralement à la version indiquée; il donne sa naissance à Dumraon le 21 mars 1916 et sa mort à Varanasi le 21 août 2006, sa performance au Fort Rouge le 15 août 1947 et le Bharat Ratna, le décrit comme un musulman dévot et un symbole d’harmonie religieuse, et le classe dans sa catégorie « Musulmans chiites indiens »."
  ur: "کمیونٹی میں ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظرثانی پر مکمل طور پر بازیافت کیا گیا؛ یہ ان کی پیدائش 21 مارچ 1916 کو دمراون میں ہوئی اور موت 21 اگست 2006 کو وارانسی میں ہوئی، اس کی 15 اگست 1947 کی لال قلعہ کی کارکردگی اور بھارت رتن، اسے ایک متقی مسلمان اور مذہبی ہم آہنگی کی علامت کے طور پر بیان کرتا ہے، اور اسے اپنے \"ہندوستانی شیعہ مسلمانوں\" کے زمرے میں درج کرتا ہے۔"
