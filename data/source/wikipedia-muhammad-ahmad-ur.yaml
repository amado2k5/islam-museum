reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). A short article: it gives his birth as 12 August 1845 (a further variant against 1843 in the English and Arabic articles and 1844 in Wikidata) and his death as 22 June 1885, and it carries claims not corroborated by the English or Arabic articles — that he studied at al-Azhar and met Jamal al-Din al-Afghani in Egypt — which are NOT used in this record. Its corroborated outline (Sammaniyya leadership at Aba Island, the call of 29 June 1881, Khartoum's fall on 26 January 1885, his reforms and his tomb at Omdurman) agrees with the fuller articles. Read on 24 October 2026."
