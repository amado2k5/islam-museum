reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: a member of the Vrioni landowning family of Berat, Fier and Myzeqe; founder of the city of Fier in 1864 'together with his son, Kahreman Pasha Vrioni' (the Albanian article instead makes Kahreman his father and the city's founder — the conflict is recorded in the record); member of the League of Prizren (1878), arrested at Preveza and deported to the Dardanelles in 1882; contributor to the first Albanian teachers' school, the Shkolla Normale e Elbasanit (1 December 1909); father of Sami Bey Vrioni, delegate at the 1912 Assembly of Vlorë; 'elected member of Albanian High Council of Regency as a representative of the Bektashi community in December 1921', resigning in opposition to Ahmet Zogu, his office box dating the membership 24 December 1921 – 11 March 1922. The Bektashi-seat statement is one of three independent articles (with the Albanian and Turkish) on which the record's sufi segment rests, with the basis stated in the faith note."
