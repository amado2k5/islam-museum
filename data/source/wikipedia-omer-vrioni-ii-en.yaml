summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمر باشا فريوني الثاني (1839-1928)؛ تُستخدم لوقائع الكيان فقط. توثّق تأسيسه مدينة فيير وعضويته في رابطة بريزرن وجلوسه في مجلس الوصاية العالي ممثلا للطائفة البكتاشية في ديسمبر 1921. وهي غير مقالة جدّه عمر فريوني قائد حرب الاستقلال اليونانية."
  en: "English Wikipedia article on Omer Pasha Vrioni II (1839–1928); used for entity facts only. It records his founding of Fier, his League of Prizren membership, and his seat on the High Council of Regency as representative of the Bektashi community in December 1921. It is not the article on his grandfather Omer Vrioni of the Greek War of Independence."
