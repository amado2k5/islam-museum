summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمر باشا فريوني الثاني (1839-1928)؛ تُستخدم لوقائع الكيان فقط. توثّق تأسيسه مدينة فيير وعضويته في رابطة بريزرن وجلوسه في مجلس الوصاية العالي ممثلا للطائفة البكتاشية في ديسمبر 1921. وهي غير مقالة جدّه عمر فريوني قائد حرب الاستقلال اليونانية."
  en: "English Wikipedia article on Omer Pasha Vrioni II (1839–1928); used for entity facts only. It records his founding of Fier, his League of Prizren membership, and his seat on the High Council of Regency as representative of the Bektashi community in December 1921. It is not the article on his grandfather Omer Vrioni of the Greek War of Independence."
  es: "Artículo de la Wikipedia en inglés sobre Omer Pasha Vrioni II (1839-1928); se utiliza únicamente para datos sobre la entidad. En él se registra la fundación de Fier, su pertenencia a la Liga de Prizren y su puesto en el Alto Consejo de Regencia como representante de la comunidad bektashi en diciembre de 1921. No se trata del artículo sobre su abuelo, Omer Vrioni, participante en la Guerra de Independencia griega."
  fr: "Article de Wikipédia en anglais sur Omer Pacha Vrioni II (1839-1928); utilisé uniquement pour des informations sur l'entité. Il relate la fondation de Fier, son appartenance à la Ligue de Prizren et son siège au Haut Conseil de Régence en tant que représentant de la communauté Bektashi en décembre 1921. Il ne s'agit pas de l'article consacré à son grand-père, Omer Vrioni, héros de la guerre d'indépendance grecque."
  ur: "عمر پاشا ورونی II (1839-1928) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی Fier کی بنیاد، اس کی لیگ آف پریزرین کی رکنیت، اور دسمبر 1921 میں بیکتاشی کمیونٹی کے نمائندے کے طور پر ہائی کونسل آف ریجنسی میں ان کی نشست کو ریکارڈ کیا گیا ہے۔ یہ یونانی جنگ آزادی کے ان کے دادا عمر ورونی پر مضمون نہیں ہے۔"
