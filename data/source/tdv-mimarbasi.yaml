summary:
  ar: "مدخل «مِعْمارْباشي» في موسوعة TDV الإسلامية التركية بقلم شرف الدين توران (المجلد 30، أنقرة 2020، ص 90–91)، ويصف ديوان المعماريين الخاص بالقصر (ocak الحاصّة)، ومهامه وطريقة تعيين رئيسه وأجره وعدد أفراده ومعماري الولايات، ثم إصلاحات القرن التاسع عشر."
  en: "The TDV İslâm Ansiklopedisi entry 'MİMARBAŞI' (chief architect) by Şerafettin Turan (vol. 30, Ankara 2020, pp. 90–91). It describes the Hassa Architects' Office of the palace: its duties, how its head was appointed, his pay and fees, the number of members, provincial architects, and the reforms of 1831 to 1839."
