summary:
  ar: "مدخل «مِعْمارْباشي» في موسوعة TDV الإسلامية التركية بقلم شرف الدين توران ⁦(المجلد 30، أنقرة 2020، ص 90–91)⁩، ويصف ديوان المعماريين الخاص بالقصر ⁦(ocak الحاصّة)⁩، ومهامه وطريقة تعيين رئيسه وأجره وعدد أفراده ومعماري الولايات، ثم إصلاحات القرن التاسع عشر."
  en: "The TDV İslâm Ansiklopedisi entry 'MİMARBAŞI' (chief architect) by Şerafettin Turan (vol. 30, Ankara 2020, pp. 90–91). It describes the Hassa Architects' Office of the palace: its duties, how its head was appointed, his pay and fees, the number of members, provincial architects, and the reforms of 1831 to 1839."
  es: "La entrada «MİMARBAŞI» (arquitecto jefe) de Şerafettin Turan en la TDV İslâm Ansiklopedisi (vol. 30, Ankara 2020, pp. 90-91) describe la Oficina de Arquitectos de Hassa del palacio: sus funciones, cómo se nombró a su director, su salario y honorarios, el número de miembros, los arquitectos provinciales y las reformas de 1831 a 1839."
  fr: "L'article « MİMARBAŞI » (architecte en chef) de Şerafettin Turan (vol. 30, Ankara 2020, p. 90-91) de la TDV İslâm Ansiklopedisi décrit le Bureau des architectes Hassa du palais: ses attributions, la nomination de son chef, sa rémunération et ses honoraires, le nombre de ses membres, les architectes provinciaux et les réformes de 1831 à 1839."
