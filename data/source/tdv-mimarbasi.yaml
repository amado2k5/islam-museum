reliability_note: "Read in full on 1 November 2026 in the web edition at islamansiklopedisi.org.tr/mimarbasi. The page's list of related entries (Sinan, Kasım Ağa, Sedefkar Mehmed Ağa, Dâvud Ağa, Acem Ali, Abdülhalim Efendi) is read only as the page's one-line descriptions, not as the full entries. The bibliography (Afyoncu on the Hassa architects, Beydilli, Evliya Çelebi, Uzunçarşılı and others) was not opened. The page gives the printed range of the whole entry, so citations use that range."
