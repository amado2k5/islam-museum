summary:
  ar: "سيرة أبي أسامة الذهبي في صفحة «نجوم هدى» على موقع قناة هدى؛ سيرة منظومته الخاصة. تذكر مولده في نيوجيرسي سنة 1964، واعتناقه الإسلام سنة 1986، ودراسته ثماني سنوات في الجامعة الإسلامية بالمدينة المنورة وتخرجه في كلية الدعوة وأصول الدين، ومناصبه إمامًا في الولايات المتحدة ثم في بريطانيا."
  en: "Huda TV's 'Huda Stars' profile of Abu Usamah at-Thahabi — his own ecosystem's biography. It gives his birth in New Jersey in 1964, his embrace of Islam in 1986, eight years of study at the Islamic University of Madinah graduating from the College of Da'wah and Usul al-Din, and his imam posts in the United States and then the United Kingdom."
  es: "El programa \"Huda Stars\" de Huda TV presenta a Abu Usamah at-Thahabi, una biografía que refleja su propia trayectoria. En ella se narra su nacimiento en Nueva Jersey en 1964, su conversión al Islam en 1986, sus ocho años de estudio en la Universidad Islámica de Medina, donde se graduó en la Facultad de Da'wah y Usul al-Din, y sus cargos como imán en Estados Unidos y posteriormente en el Reino Unido."
  fr: "Le reportage « Huda Stars » de Huda TV retrace le parcours d'Abu Usamah at-Thahabi, de sa naissance dans le New Jersey en 1964 à sa conversion à l'islam en 1986, en passant par ses huit années d'études à l'Université islamique de Médine, où il a obtenu son diplôme du Collège de Da'wah et d'Usul al-Din, et ses fonctions d'imam aux États-Unis puis au Royaume-Uni."
  ur: "ہدا ٹی وی کا 'ہدا اسٹارز' ابو اسامہ الثہبی کا پروفائل - ان کے اپنے ماحولیاتی نظام کی سوانح حیات۔ یہ 1964 میں نیو جرسی میں ان کی پیدائش، 1986 میں اسلام قبول کرنے، مدینہ کی اسلامی یونیورسٹی میں آٹھ سال کی تعلیم کے بعد دعوت و اصول الدین کالج سے فارغ التحصیل ہوئے، اور امریکہ اور پھر برطانیہ میں ان کی امامت کے عہدے پر فائز ہوئے۔"
