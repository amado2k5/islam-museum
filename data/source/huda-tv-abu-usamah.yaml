  ar: "سيرة أبي أسامة الذهبي في صفحة «نجوم هدى» على موقع قناة هدى؛ سيرة منظومته الخاصة. تذكر مولده في نيوجيرسي سنة 1964، واعتناقه الإسلام سنة 1986، ودراسته ثماني سنوات في الجامعة الإسلامية بالمدينة المنورة وتخرجه في كلية الدعوة وأصول الدين، ومناصبه إمامًا في الولايات المتحدة ثم في بريطانيا."
  en: "Huda TV's 'Huda Stars' profile of Abu Usamah at-Thahabi — his own ecosystem's biography. It gives his birth in New Jersey in 1964, his embrace of Islam in 1986, eight years of study at the Islamic University of Madinah graduating from the College of Da'wah and Usul al-Din, and his imam posts in the United States and then the United Kingdom."
