reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers her birth at Bhopal on 9 July 1858 as the only surviving child of Sultan Shah Jahan Begum and Baqi Muhammad Khan, her proclamation as heiress apparent in 1868, her succession in 1901, the free and compulsory primary education of 1918, her founding chancellorship of Aligarh Muslim University from 1920, the Executive and Legislative State Council of 1922, her books (Gauhar-i-Iqbal 1912, Akhtar-i-Iqbal 1922/1927, Iffat-ul-Muslimaat 1918), her abdication in 1926 in favour of her son Hamidullah Khan, and her death on 12 May 1930. The article names no school of Islam for her. Read in full on 24 October 2026."
