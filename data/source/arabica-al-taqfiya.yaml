summary:
  ar: "مدخل «أرابيكا» ⁦(معهد الدوحة للدراسات العليا)⁩ عن التقفية في اللغة، بقلم Ramzi Baalbaki، اطُّلع عليه في ٢٠ نوفمبر ٢٠٢٦؛ يُستخدم لـالقول بأن البندنيجي لا الجوهري ابتدأ ترتيب القافية."
  en: "Arabica (Doha Institute) entry on al-Taqfiya fi l-Lugha, by Ramzi Baalbaki, read on 20 November 2026; used for: the claim that al-Bandaniji, not al-Jawhari, began the rhyme arrangement."
  es: "Entrada de Arabica (Instituto de Doha) sobre al-Taqfiya fi l-Lugha, de Ramzi Baalbaki, consultada el 20 de noviembre de 2026; utilizada para: la afirmación de que al-Bandaniyi, y no al-Jawhari, inició la ordenación por rima."
  fr: "Article d'Arabica (Institut de Doha) sur al-Taqfiya fi l-Lugha, par Ramzi Baalbaki, consulté le 20 novembre 2026 ; utilisé pour : l'affirmation qu'al-Bandaniji, et non al-Jawhari, a inauguré le classement par la rime."
  ur: "Arabica ⁦(دوحہ انسٹی ٹیوٹ)⁩ میں al-Taqfiya fi l-Lugha پر اندراج، از Ramzi Baalbaki، 20 نومبر 2026 کو پڑھا؛ استعمال: یہ دعویٰ کہ بندنیجی نے، نہ کہ جوہری نے، قافیہ کی ترتیب شروع کی."
  tr: "Ramzi Baalbaki tarafından yazılan dilde uyak üzerine 'Arabica' (Doha Lisansüstü Enstitüsü) maddesi, 20 Kasım 2026'da erişildi; bu giriş, kafiye düzenlemesini özden değil, bandiniji'nin başlattığını belirtmek için kullanılır."
  id: "Entri 'Arabica' (Institut Studi Pascasarjana Doha) tentang rima dalam bahasa, oleh Ramzi Baalbaki, diakses pada 20 November 2026; digunakan untuk mengatakan bahwa bandiniji, bukan esensi, yang memulai susunan rima."
title: "التقفية في اللغة"
