reliability_note: "Read in the museum's session on 20 November 2026. It describes al-Taqfiya of al-Bandaniji (Abu Bishr al-Yaman ibn Abi l-Yaman, d. 284/897) as the first dictionary that has reached us arranged by the last letters of words, the method that the later Sihah followed, and says the edited text showed that al-Bandaniji, not al-Jawhari, was the originator of ordering words by the final letter. Used for entity facts only."
