summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميان افتخار الدين (1907–1962)؛ تعطي مولده في 8 نيسان 1907 في لاهور ووفاته بنوبة قلبية في 6 حزيران 1962 فيها، وتروي رئاسته لمؤتمر البنجاب، وانضمامه إلى الرابطة الإسلامية سنة 1945، وتأسيسه لصحف باكستان تايمز وإمروز وليل ونهار. لا يرد فيها أي بيان عن دينه."
  en: "The English Wikipedia article on Mian Iftikharuddin (1907–1962); it gives his birth on 8 April 1907 at Lahore and his death by heart attack on 6 June 1962 there, and recounts his Punjab Congress presidency, his joining the Muslim League in 1945, and his founding of The Pakistan Times, Imroze and Lail-o-Nahar. It makes no statement of his religion."
