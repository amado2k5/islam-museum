summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميان افتخار الدين (1907–1962)؛ تعطي مولده في 8 نيسان 1907 في لاهور ووفاته بنوبة قلبية في 6 حزيران 1962 فيها، وتروي رئاسته لمؤتمر البنجاب، وانضمامه إلى الرابطة الإسلامية سنة 1945، وتأسيسه لصحف باكستان تايمز وإمروز وليل ونهار. لا يرد فيها أي بيان عن دينه."
  en: "The English Wikipedia article on Mian Iftikharuddin (1907–1962); it gives his birth on 8 April 1907 at Lahore and his death by heart attack on 6 June 1962 there, and recounts his Punjab Congress presidency, his joining the Muslim League in 1945, and his founding of The Pakistan Times, Imroze and Lail-o-Nahar. It makes no statement of his religion."
  es: "El artículo de Wikipedia en inglés sobre Mian Iftikharuddin (1907-1962) indica que nació el 8 de abril de 1907 en Lahore y falleció allí de un ataque al corazón el 6 de junio de 1962. También relata su presidencia del Congreso de Punjab, su ingreso a la Liga Musulmana en 1945 y la fundación de The Pakistan Times, Imroze y Lail-o-Nahar. No menciona su religión."
  fr: "L'article de Wikipédia en anglais consacré à Mian Iftikharuddin (1907-1962) indique sa naissance le 8 avril 1907 à Lahore et son décès par crise cardiaque le 6 juin 1962 dans la même ville. Il relate également sa présidence du Congrès du Pendjab, son adhésion à la Ligue musulmane en 1945 et la fondation des journaux The Pakistan Times, Imroze et Lail-o-Nahar. Aucune mention n'est faite de sa religion."
  ur: "میاں افتخار الدین (1907-1962) پر انگریزی ویکیپیڈیا کا مضمون؛ یہ 8 اپریل 1907 کو لاہور میں ان کی پیدائش اور وہیں 6 جون 1962 کو دل کا دورہ پڑنے سے ان کی موت ہوئی، اور ان کی پنجاب کانگریس کی صدارت، 1945 میں مسلم لیگ میں شمولیت، اور دی پاکستان ٹائمز، امروز اور لیلۃ النہار کے قیام کا ذکر کرتا ہے۔ اس میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Mian Iftikharuddin (1907–1962) hakkında İngilizce Wikipedia makalesi; 8 Nisan 1907'de Lahor'da doğduğunu ve 6 Haziran 1962'de kalp krizi sonucu öldüğünü anlatır; Pencap Kongresi'ndeki liderliğini, 1945'te Müslüman Birliği'ne katılmasını ve Pakistan Times, Emrooz ile Lail and Nahar gazetelerini kurmasını anlatır. Dini hakkında herhangi bir açıklama içermez."
  id: "Artikel Wikipedia bahasa Inggris tentang Mian Iftikharuddin (1907–1962); menceritakan kelahirannya pada 8 April 1907 di Lahore, dan kematiannya akibat serangan jantung pada 6 Juni 1962, menceritakan kepemimpinannya di Kongres Punjab, bergabung dengan Liga Muslim pada tahun 1945, dan mendirikan surat kabar Pakistan Times, Emrooz, dan Lail and Nahar. Artikel tersebut tidak memuat pernyataan tentang agamanya."
