summary:
  ar: "مقالة ويكيبيديا العربية عن أغوس سالم ⁦(بعنوان «سليم آغوس»)⁩؛ بذرة قصيرة تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 8 تشرين الأول 1884 ووفاته في 4 تشرين الثاني 1954، وتصف اهتمامه بعلم الكلام وميوله إلى عقلانية المعتزلة ودعوته إلى فكرة تشبه الاشتراكية الإسلامية، وتذكر كتابه «الشرح الفلسفي للتوحيد والتقدير والتوكل» (1953). حقل «المدرسة/التقليد» في صندوقها فارغ."
  en: "Arabic Wikipedia article on Agus Salim (titled 'Salim Agus'); a short stub used for entity facts only. It gives his birth on 8 October 1884 and death on 4 November 1954, describes his interest in kalam and his sympathy for Mu'tazilite rationalism, and his advocacy of an idea resembling Islamic socialism, and lists his 1953 book on tawhid, takdir and tawakal. Its infobox school/tradition field is empty."
  es: "Artículo de Wikipedia en árabe sobre Agus Salim (titulado «Salim Agus»); un breve esbozo utilizado únicamente para datos sobre la persona. Indica su nacimiento el 8 de octubre de 1884 y su fallecimiento el 4 de noviembre de 1954, describe su interés por el kalam y su simpatía por el racionalismo mutazilí, así como su defensa de una idea similar al socialismo islámico, y enumera su libro de 1953 sobre tawhid, takdir y tawakal. El campo de escuela/tradición de su ficha informativa está vacío."
  fr: "Article Wikipédia en arabe sur Agus Salim (intitulé « Salim Agus »); une brève ébauche servant uniquement à fournir des informations factuelles. On y trouve sa date de naissance, le 8 octobre 1884, et sa date de décès, le 4 novembre 1954. L’article décrit son intérêt pour le kalam et sa sympathie pour le rationalisme mu’tazilite, ainsi que sa défense d’une idée proche du socialisme islamique. Il mentionne également son ouvrage de 1953 sur le tawhid, le takdir et le tawakal. Le champ « école/tradition » de l’infobox est vide."
  ur: "اگس سلیم پر عربی ویکیپیڈیا مضمون ⁦(عنوان 'سلیم اگس')⁩؛ ایک مختصر سٹب صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ یہ 8 اکتوبر 1884 کو ان کی پیدائش اور 4 نومبر 1954 کو موت کا ذکر کرتا ہے، کلام میں ان کی دلچسپی اور معتزلی عقلیت کے لیے ان کی ہمدردی، اور اسلامی سوشلزم سے مشابہت رکھنے والے خیال کی وکالت کو بیان کرتا ہے، اور ان کی 1953 کی کتاب توحید، تکدیر اور توکل کی فہرست دیتا ہے۔ اس کا انفو باکس اسکول/روایتی فیلڈ خالی ہے۔"
