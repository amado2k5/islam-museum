summary:
  ar: "مقالة ويكيبيديا العربية عن أغوس سالم (بعنوان «سليم آغوس»)؛ بذرة قصيرة تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 8 تشرين الأول 1884 ووفاته في 4 تشرين الثاني 1954، وتصف اهتمامه بعلم الكلام وميوله إلى عقلانية المعتزلة ودعوته إلى فكرة تشبه الاشتراكية الإسلامية، وتذكر كتابه «الشرح الفلسفي للتوحيد والتقدير والتوكل» (1953). حقل «المدرسة/التقليد» في صندوقها فارغ."
  en: "Arabic Wikipedia article on Agus Salim (titled 'Salim Agus'); a short stub used for entity facts only. It gives his birth on 8 October 1884 and death on 4 November 1954, describes his interest in kalam and his sympathy for Mu'tazilite rationalism, and his advocacy of an idea resembling Islamic socialism, and lists his 1953 book on tawhid, takdir and tawakal. Its infobox school/tradition field is empty."
