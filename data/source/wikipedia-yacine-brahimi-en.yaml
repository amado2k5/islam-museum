  ar: "مقالة ويكيبيديا الإنجليزية عن ياسين براهيمي؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من كليرفونتين ورين إلى غرناطة وبورتو والأندية القطرية، ومبارياته الدولية مع الجزائر وبطولتي الأمم الأفريقية 2019 وكأس العرب 2021، وتذكر في حياته الشخصية أنه مسلم ممارس."
  en: "English Wikipedia article on Yacine Brahimi; used for entity facts only. It recounts his career from Clairefontaine and Rennes to Granada, Porto and the Qatari clubs, his Algeria caps and the 2019 Africa Cup of Nations and 2021 Arab Cup titles, and states in its personal-life section that he is a practising Muslim."
