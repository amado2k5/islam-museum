summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ياسين براهيمي؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من كليرفونتين ورين إلى غرناطة وبورتو والأندية القطرية، ومبارياته الدولية مع الجزائر وبطولتي الأمم الأفريقية 2019 وكأس العرب 2021، وتذكر في حياته الشخصية أنه مسلم ممارس."
  en: "English Wikipedia article on Yacine Brahimi; used for entity facts only. It recounts his career from Clairefontaine and Rennes to Granada, Porto and the Qatari clubs, his Algeria caps and the 2019 Africa Cup of Nations and 2021 Arab Cup titles, and states in its personal-life section that he is a practising Muslim."
  es: "Artículo de la Wikipedia en inglés sobre Yacine Brahimi; utilizado únicamente para obtener información sobre la persona. Narra su trayectoria desde Clairefontaine y Rennes hasta Granada, Porto y los clubes cataríes, sus partidos con la selección de Argelia y los títulos de la Copa Africana de Naciones 2019 y la Copa Árabe 2021, y afirma en su sección sobre su vida personal que es musulmán practicante."
  fr: "Article Wikipédia en anglais sur Yacine Brahimi; utilisé uniquement pour les informations le concernant. Il retrace sa carrière, de Clairefontaine et Rennes à Grenade, Porto et les clubs qataris, ses sélections en équipe d'Algérie et ses titres à la Coupe d'Afrique des Nations 2019 et à la Coupe arabe 2021. La section consacrée à sa vie privée précise qu'il est musulman pratiquant."
  ur: "یاسین براہیمی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں کلیئرفونٹین اور رینس سے لے کر گراناڈا، پورٹو اور قطری کلبوں تک، اس کے الجیریا کیپس اور 2019 کے افریقہ کپ آف نیشنز اور 2021 کے عرب کپ کے ٹائٹل کا ذکر کیا گیا ہے، اور اس کے ذاتی زندگی کے حصے میں کہا گیا ہے کہ وہ ایک مشق کرنے والا مسلمان ہے۔"
