  id: "Berkas Dawood Kim (Kim Jae-han) di StarsUnfolded; lahir di Seoul pada 21 Juli 1992, mantan penyanyi bernama Jae Kim, memeluk Islam pada September 2019, dan mencakup peristiwa kasus 2019 serta kampanye masjid Incheon yang dikaitkan dengan Korea Times."
