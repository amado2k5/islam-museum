summary:
  ar: "ملف سيرة داود كيم ⁦(كيم جاي هان)⁩ لدى موقع StarsUnfolded؛ مولود في سيول في 21 يوليو 1992، مغنٍّ سابق باسم جاي كيم، اعتنق الإسلام في سبتمبر 2019، وفيه وقائع قضية 2019 وحملة مسجد إنتشون منسوبة إلى صحيفة كوريا تايمز."
  en: "StarsUnfolded biography profile of Daud Kim (Kim Jae-han): born in Seoul on 21 July 1992, a singer under the name Jay Kim who embraced Islam in September 2019; its account of the 2019 case and the Incheon mosque campaign is footnoted to The Korea Times."
  es: "Perfil biográfico de StarsUnfolded sobre Daud Kim (Kim Jae-han): nacido en Seúl el 21 de julio de 1992, cantante conocido como Jay Kim, que se convirtió al Islam en septiembre de 2019; su relato del caso de 2019 y la campaña de la mezquita de Incheon se cita en una nota a pie de página de The Korea Times."
  fr: "Profil biographique de Daud Kim (Kim Jae-han) par StarsUnfolded: né à Séoul le 21 juillet 1992, chanteur sous le nom de Jay Kim qui s'est converti à l'islam en septembre 2019; son récit de l'affaire de 2019 et de la campagne de la mosquée d'Incheon est accompagné d'une note de bas de page du Korea Times."
  ur: "StarsUnfolded سوانح عمری کی پروفائل داؤد کم (Kim Jae-han): 21 جولائی 1992 کو سیول میں پیدا ہوئے، جے کم کے نام سے ایک گلوکارہ جس نے ستمبر 2019 میں اسلام قبول کیا؛ اس کا 2019 کیس کا اکاؤنٹ اور انچیون مسجد مہم کو دی کوریا ٹائمز میں فوٹ نوٹ کیا گیا ہے۔"
