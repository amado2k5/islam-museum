summary:
  ar: "قناة «الإسلام مع عائشة» على يوتيوب (@IslamwithAisha) لعائشة خالد؛ قناة تعليمية نسائية تقدّم ترجمة القرآن وتفسيره بالأردية، وهي مصدر أولي لهويتها وعملها وانتشارها، لا مصدر مستقل مؤيد."
  en: "Aisha Khalid's YouTube channel Islam with Aisha (@IslamwithAisha), a women-only channel teaching the Qur'an with word-by-word Urdu translation and tafseer; a primary source for her identity, work and reach, not independent corroboration."
  es: "El canal de YouTube de Aisha Khalid, Islam with Aisha (@IslamwithAisha), un canal exclusivamente para mujeres que enseña el Corán con traducción palabra por palabra al urdu y tafsir (exégesis coránica); una fuente primaria para su identidad, trabajo y alcance, no una corroboración independiente."
  fr: "La chaîne YouTube d'Aisha Khalid, Islam with Aisha (@IslamwithAisha), une chaîne réservée aux femmes qui enseigne le Coran avec une traduction mot à mot en ourdou et un tafsir; une source principale pour son identité, son travail et sa portée, et non une corroboration indépendante."
  ur: "عائشہ خالد کا یوٹیوب چینل Islam with Aisha (@IslamwithAisha)، ایک صرف خواتین کا چینل ہے جو لفظ بہ لفظ اردو ترجمہ اور تفسیر کے ساتھ قرآن کی تعلیم دیتا ہے۔ اس کی شناخت، کام اور رسائی کا بنیادی ذریعہ، نہ کہ آزاد تصدیق۔"
  tr: "YouTube'da Aisha Khaled tarafından (@IslamwithAisha) yayınlanan \"İslam ile Aişe\" kanalı; Urduca Kur'an çevirisi ve yorumu sunan kadınlara yönelik bir eğitim kanalı. Bu, kimliği, çalışmaları ve yayılımı için birincil kaynaktır, bağımsız bir destekleyici kaynak değildir."
  id: "Saluran \"Islam with Aisha\" di YouTube (@IslamwithAisha) oleh Aisha Khaled; saluran pendidikan perempuan yang menawarkan terjemahan dan interpretasi Al-Qur'an dalam bahasa Urdu. Saluran ini merupakan sumber utama untuk identitas, karya, dan penyebarannya, bukan sumber pendukung independen."
