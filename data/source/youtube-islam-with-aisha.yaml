reliability_note: "The person's own channel: a primary source for identity, work and reach, not independent corroboration (founder's sourcing ladder, 24 Oct 2026). Her video descriptions, in her own channel's words, present Aisha Khalid as a successful businesswoman and a teacher of the Qur'an for many years, with students all around the world, teaching through easy word-by-word translation and tafseer of the Qur'an in Urdu, in live classes; the channel describes itself as a women-only channel for Islamic learning. Her linked accounts are Instagram @aisha_khalid10, Facebook /islamwithaisha and TikTok /islamwithaisha. Subscriber figure of about 663,000 is a dated platform figure from the founder's harvest of October 2026; platform figures change constantly. Checked 24 October 2026."
