summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشراع اللاتيني؛ لوقائع الكيان فقط: شراع مثلث على قائم طويل مائل بالصارية طولياً، نشأ بالمتوسط مبكراً من القرن الثاني الميلادي وشاع بالخامس، شواهد لوحة قبرية القرن الثاني وسفينة ياسي أدا الثانية نحو 400م وفسيفساء كلندريس وأثر كليا، حلّ محل الشراع المربع بالقرن السادس لأسباب كلفة لا أداء ملاحي ⁦(وايت رايت)⁩، صار شراع الدرومون البيزنطي المعياري، تبنّاه العرب عبر البحارة الأقباط المشاركين في التقاليد المتوسطية بمصطلحات يونانية-رومانية، أقدم شاهد متوسطي إسلامي آمن طبق دانية المزجج القرن الحادي عشر، غلب المربع بالمحيط الهندي حتى نحو 1500 ثم انتشر اللاتيني، استعماله في مقدمة سفن الكرافل ثم قصره على صارية المؤخرة بالكراكة، وخلطه للتقاليد المتوسطية والشمالية بالقرن السادس عشر."
  en: "English Wikipedia article on the lateen sail; entity facts only: a triangular sail on a long angled yard set fore-and-aft, developed in the Mediterranean as early as the 2nd century AD and common by the 5th, the gravestone, Yassi Ada II (c. 400), Kelenderis mosaic and Kellia graffito witnesses, its replacement of the square sail by the 6th century argued on cost rather than sailing performance (Whitewright), the standard rig of the Byzantine dromon, Arab adoption through the Coptic seafaring population with Greco-Roman-derived terminology, the earliest securely identifiable Islamic Mediterranean depiction an 11th-century glazed dish from Denia, square rig dominating the Indian Ocean until c. 1500 after which lateen spread there, the caravel's lateen masts and its restriction to the mizzen in the carrack, and its role in the 16th-century merging of Mediterranean and Northern European shipbuilding."
  es: "Artículo de la Wikipedia en inglés sobre la vela latina; solo datos de la entidad: una vela triangular en una verga larga en ángulo colocada de proa a popa, desarrollada en el Mediterráneo ya en el siglo II d. C. y común en el siglo V, la lápida de Yassi Ada II (c. 400), el mosaico de Kelenderis y el grafito de Kellia dan testimonio de ello, su sustitución de la vela cuadrada en el siglo VI se argumentó en función del coste más que del rendimiento de navegación (Whitewright), el aparejo estándar del dromón bizantino, la adopción árabe a través de la población marítima copta con terminología derivada del grecorromano, la representación islámica mediterránea más antigua identificable con seguridad, un plato vidriado del siglo XI de Denia, el aparejo cuadrado dominando el Océano Índico hasta c. 1500, después de lo cual la vela latina se extendió allí, los mástiles latinos de la carabela y su restricción al palo de mesana en la carraca, y su papel en la fusión del siglo XVI de la construcción naval mediterránea y del norte de Europa."
  fr: "Article de Wikipédia en anglais sur la voile latine; faits concernant l’entité uniquement: voile triangulaire sur une longue vergue inclinée placée dans le sens de la longueur, développée en Méditerranée dès le IIe siècle après J.-C. et courante au Ve siècle, la pierre tombale de Yassi Ada II (vers 400), la mosaïque de Kelenderis et le graffiti de Kellia en témoignent, son remplacement de la voile carrée au VIe siècle étant justifié par des raisons de coût plutôt que de performance (Whitewright), le gréement standard du dromon byzantin, son adoption par les Arabes via la population maritime copte avec une terminologie d’origine gréco-romaine, la plus ancienne représentation islamique méditerranéenne identifiable avec certitude sur un plat vernissé du XIe siècle provenant de Dénia, le gréement carré dominant l’océan Indien jusqu’aux alentours de 1500, après quoi la voile latine s’y est répandue, les mâts latins de la caravelle et leur restriction à la voile d’artimon dans la caraque, et son rôle dans la fusion au XVIe siècle de la construction navale méditerranéenne et nord-européenne."
  ur: "لیٹین سیل پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: ایک لمبے زاویہ والے صحن پر ایک مثلثی جہاز آگے پیچھے، بحیرہ روم میں دوسری صدی عیسوی کے اوائل میں تیار ہوا اور 5ویں تک عام، قبر کا پتھر، یاسی اڈا II (c. 400)، Kelenderis mosaic اور Kellia graffito کی جگہ اس کے مربع کے گواہوں کی قیمت 6 ویں صدی میں رکھی گئی۔ جہاز رانی کی کارکردگی ⁦(وائٹ رائٹ)⁩ کے بجائے، بازنطینی ڈرومن کی معیاری رگ، گریکو-رومن سے ماخوذ اصطلاحات کے ساتھ قبطی سمندری آبادی کے ذریعے عربوں کو اپنانا، قدیم ترین محفوظ طریقے سے قابل شناخت اسلامی بحیرہ روم کی تصویر کشی 11ویں صدی کی چمکیلی ڈش ڈینیا سے لے کر Ocean اسکوائر تک۔ 1500 جس کے بعد لیٹین وہاں پھیل گیا، کیریول کے لیٹین مستول اور کیریک میں میزین تک اس کی پابندی، اور 16ویں صدی میں بحیرہ روم اور شمالی یورپی جہاز سازی کے انضمام میں اس کا کردار۔"
