summary:
  ar: "المقال العربي عن إبراهيم حمد القاضي (1925–2020) بعنوان «أبو المسرح الهندي»، يذكر نشأته في بيئة دينية منفتحة ويضع الوفاة في مومباي في صندوق المعلومات."
  en: "Community-edited encyclopedia article in Arabic, retrieved in full at the stated revision; it styles him Ibrahim Hamad al-Qadi, father of Indian theatre, records his upbringing in an open religious environment, and its infobox places his death at Mumbai against the English article’s New Delhi, preserved as a variant."
  es: "Artículo de enciclopedia editado por la comunidad en árabe, recuperado íntegramente en la revisión indicada; lo denomina Ibrahim Hamad al-Qadi, padre del teatro indio, relata su crianza en un entorno religioso abierto, y su ficha informativa sitúa su muerte en Bombay en contraposición a Nueva Delhi, como se conserva en el artículo en inglés."
  fr: "Article encyclopédique en arabe, édité par la communauté et retrouvé intégralement à la version indiquée; il le nomme Ibrahim Hamad al-Qadi, père du théâtre indien, relate son éducation dans un environnement religieux ouvert, et son infobox situe sa mort à Mumbai, contrairement à l’article anglais qui mentionne New Delhi, conservée comme variante."
  ur: "عربی میں کمیونٹی کی طرف سے ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظر ثانی پر مکمل طور پر بازیافت کیا گیا؛ اس میں اسے ابراہیم حماد القادی، ہندوستانی تھیٹر کا باپ، ایک کھلے مذہبی ماحول میں پرورش کا ریکارڈ بنایا گیا ہے، اور اس کے معلوماتی خانے میں ان کی موت ممبئی میں انگریزی مضمون کے نئی دہلی کے خلاف ہے، جو کہ ایک قسم کے طور پر محفوظ ہے۔"
  tr: "İbrahim Hamad El-Kadi (1925–2020) hakkında \"Hint Tiyatrosunun Babası\" başlıklı Arapça makale, onun açık dini bir ortamda yetiştirildiğinden bahseder ve bilgi kutusunda Mumbai'deki ölümü belirtir."
  id: "Artikel Arab tentang Ibrahim Hamad Al-Qadi (1925–2020) berjudul \"Bapak Teater India\" menyebutkan masa kecilnya dalam lingkungan keagamaan terbuka dan menempatkan kematian di Mumbai dalam infobox."
