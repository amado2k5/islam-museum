summary:
  ar: "مقالة ويكيبيديا العربية «شبكة الألوكة»، المراجعة 73239964 ⁦(29 يناير 2026)⁩؛ لوقائع الكيان فقط: شبكة إسلامية من ثلاثة عشر موقعًا أُسست سنة 1427هـ/2006م، ومعنى اسمها، وأهدافها، ومواقعها كما يصفها كل موقع."
  en: "Arabic Wikipedia article 'Alukah Network', revision 73239964 (29 January 2026); entity facts only: an Islamic network of thirteen sites founded in 1427 AH / 2006, the meaning of its name, its aims, and its sites as each describes itself."
  ur: "عربی ویکیپیڈیا کا مضمون «شبكة الألوكة»، نظرِ ثانی 73239964 ⁦(29 جنوری 2026)⁩؛ صرف حقائق: تیرہ سائٹوں کا اسلامی نیٹ ورک جو 1427ھ/2006 میں قائم ہوا، نام کا مطلب، مقاصد، اور ہر سائٹ کا اپنا تعارف۔"
  es: "Artículo de Wikipedia en árabe «Red Alukah», revisión 73239964 (29 de enero de 2026); solo datos sobre la entidad: una red islámica de trece sitios fundada en 1427 AH / 2006, el significado de su nombre, sus objetivos y sus sitios tal como se describen a sí mismos."
  fr: "Article Wikipédia arabe « Réseau Alukah », révision 73239964 (29 janvier 2026); informations sur l'entité uniquement: un réseau islamique de treize sites fondé en 1427 AH / 2006, la signification de son nom, ses objectifs et ses sites tels que chacun se décrit."
  tr: "Arapça Vikipedi makalesi \"Al-Awqa Ağı\", 73239964 (29 Ocak 2026) tarihinde incelenmiştir; yalnızca varlık için gerçekler: 1427 Hicri / 2006 yılında kurulmuş, her bir sitenin tanımladığı isim, amaçlar ve konumlar ile ilgili on üç siteden oluşan İslami bir ağ."
  id: "Artikel Wikipedia Arab \"Jaringan Al-Awqa,\" ditinjau 73239964 (29 Januari 2026); hanya untuk fakta entitas: jaringan Islam yang terdiri dari tiga belas situs didirikan pada tahun 1427 H / 2006 M, dengan makna nama, tujuan, dan lokasi seperti yang dijelaskan oleh setiap situs."
