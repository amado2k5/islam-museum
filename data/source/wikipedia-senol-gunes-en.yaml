reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Güneş as born on 1 June 1952 in Trabzon; a goalkeeper for Trabzonspor (1975–1987) who won six league titles, set the Süper Lig clean-sheet record of 1,110 minutes in 1978–79 and earned 31 caps for Turkey; and a manager who took Turkey to third place at the 2002 FIFA World Cup (UEFA Coach of the Year 2002), won two Süper Lig titles with Beşiktaş (2016, 2017) and coached FC Seoul before returning to Trabzonspor. It makes no statement of his religion anywhere in its text."
