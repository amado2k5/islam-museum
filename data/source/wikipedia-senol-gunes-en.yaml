summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شينول غونيش؛ تُستخدم لوقائع الكيان فقط. تروي اثني عشر موسمًا مع طرابزون سبور حارسًا ورقمه القياسي في الشباك النظيفة، ثم قيادته تركيا إلى المركز الثالث في كأس العالم 2002 ولقبيه مع بشكتاش."
  en: "English Wikipedia article on Şenol Güneş; used for entity facts only. It recounts his twelve years as Trabzonspor's goalkeeper and his league clean-sheet record, then his management of Turkey to third place at the 2002 World Cup and his two Süper Lig titles with Beşiktaş."
  es: "Artículo de la Wikipedia en inglés sobre Şenol Güneş; utilizado únicamente para obtener información sobre la persona. En él se narran sus doce años como portero del Trabzonspor y su récord de partidos sin encajar goles en la liga, su gestión de la selección turca hasta el tercer puesto en el Mundial de 2002 y sus dos títulos de la Süper Lig con el Beşiktaş."
  fr: "Article de Wikipédia en anglais sur Şenol Güneş; utilisé uniquement pour les informations sur l'entité. Il relate ses douze années comme gardien de but de Trabzonspor et son record de matchs sans encaisser de but en championnat, puis son rôle de sélectionneur de la Turquie, qui a terminé troisième de la Coupe du monde 2002, et ses deux titres de champion de Süper Lig avec Beşiktaş."
