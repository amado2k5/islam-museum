  en: "English Wikipedia article on Şenol Güneş; used for entity facts only. It recounts his twelve years as Trabzonspor's goalkeeper and his league clean-sheet record, then his management of Turkey to third place at the 2002 World Cup and his two Süper Lig titles with Beşiktaş."
