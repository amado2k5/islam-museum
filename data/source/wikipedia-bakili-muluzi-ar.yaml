  ar: "مقالة ويكيبيديا العربية عن باكيلي مولوزي؛ تُستخدم لوقائع الكيان فقط. مقالة موجزة تروي ولادته في ماشينغا في 17 مارس 1943 ورئاسته مالاوي من 1994 إلى 2004 وفوزه على باندا وإعادة انتخابه سنة 1999 ودعمه بينجو وا موثاريكا خلفا، واعتقاله سنة 2006 ورفض ترشحه سنة 2009. لا يذكر متنها دينه."
  en: "Arabic Wikipedia article on Bakili Muluzi; used for entity facts only. A short article recounting his birth at Machinga on 17 March 1943, his presidency of Malawi from 1994 to 2004, his victory over Banda and 1999 re-election, his backing of Bingu wa Mutharika as successor, his 2006 arrest and the rejection of his 2009 candidacy. Its text makes no statement of his religion."
