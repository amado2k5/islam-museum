summary:
  ar: "مقالة ويكيبيديا العربية عن باكيلي مولوزي؛ تُستخدم لوقائع الكيان فقط. مقالة موجزة تروي ولادته في ماشينغا في 17 مارس 1943 ورئاسته مالاوي من 1994 إلى 2004 وفوزه على باندا وإعادة انتخابه سنة 1999 ودعمه بينجو وا موثاريكا خلفا، واعتقاله سنة 2006 ورفض ترشحه سنة 2009. لا يذكر متنها دينه."
  en: "Arabic Wikipedia article on Bakili Muluzi; used for entity facts only. A short article recounting his birth at Machinga on 17 March 1943, his presidency of Malawi from 1994 to 2004, his victory over Banda and 1999 re-election, his backing of Bingu wa Mutharika as successor, his 2006 arrest and the rejection of his 2009 candidacy. Its text makes no statement of his religion."
  es: "Artículo en árabe de la Wikipedia sobre Bakili Muluzi; utilizado únicamente para datos sobre la persona. Un breve artículo que relata su nacimiento en Machinga el 17 de marzo de 1943, su presidencia de Malawi de 1994 a 2004, su victoria sobre Banda y su reelección en 1999, su apoyo a Bingu wa Mutharika como sucesor, su arresto en 2006 y el rechazo de su candidatura en 2009. El texto no menciona su religión."
  fr: "Article de Wikipédia en arabe sur Bakili Muluzi; utilisé uniquement à des fins d'information sur l'entité. Ce court article relate sa naissance à Machinga le 17 mars 1943, sa présidence du Malawi de 1994 à 2004, sa victoire sur Banda et sa réélection en 1999, son soutien à Bingu wa Mutharika comme successeur, son arrestation en 2006 et le rejet de sa candidature en 2009. Le texte ne mentionne pas sa religion."
  ur: "بکلی مولوزی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 17 مارچ 1943 کو مچنگا میں ان کی پیدائش، 1994 سے 2004 تک ملاوی کی صدارت، بندہ پر ان کی فتح اور 1999 کے دوبارہ انتخاب، جانشین کے طور پر بنگو وا مطھریکا کی حمایت، ان کی 2006 کی گرفتاری اور 2009 میں ان کی عہد سازی کو مسترد کرنے کا ایک مختصر مضمون۔ اس کے متن میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
