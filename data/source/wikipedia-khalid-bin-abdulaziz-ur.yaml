summary:
  ar: "مقالة ويكيبيديا الأردية عن خالد بن عبد العزيز آل سعود؛ تُستخدم لوقائع الكيان فقط. وهي سيرة قصيرة: وُلد في الرياض وتعلّم في مدارس المملكة الدينية، وصار وليًا للعهد بعد اعتلاء فيصل العرش سنة 1964، وملكًا من 24/25 مارس 1975 حتى وفاته سنة 1982 عن 71 عامًا؛ ولا يذكر متنها له مدرسة."
  en: "Urdu Wikipedia article on Khalid bin Abdulaziz Al Saud; used for entity facts only. A short biography: born at Riyadh, educated in the kingdom's religious schools, crown prince after Faisal's accession in 1964, king from 24/25 March 1975 until his death in 1982 at the age of 71; its text names no school for him."
  es: "Artículo de Wikipedia en urdu sobre Khalid bin Abdulaziz Al Saud; utilizado únicamente para datos sobre la persona. Breve biografía: nació en Riad, se educó en las escuelas religiosas del reino, fue príncipe heredero tras la ascensión de Faisal al trono en 1964 y rey desde el 24/25 de marzo de 1975 hasta su muerte en 1982 a los 71 años; el texto no menciona ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en ourdou sur Khalid bin Abdulaziz Al Saud; utilisé uniquement pour les informations relatives à l'entité. Brève biographie: né à Riyad, scolarisé dans les écoles religieuses du royaume, prince héritier après l'accession au trône de Fayçal en 1964, roi du 24/25 mars 1975 jusqu'à sa mort en 1982 à l'âge de 71 ans; le texte ne mentionne aucune école."
  ur: "خالد بن عبدالعزیز آل سعود پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر سوانح عمری: ریاض میں پیدا ہوئے، مملکت کے مذہبی اسکولوں میں تعلیم حاصل کی، 1964 میں فیصل کے الحاق کے بعد ولی عہد، 24/25 مارچ 1975 سے 1982 میں 71 سال کی عمر میں اپنی موت تک بادشاہ؛ اس کا متن اس کے لیے کسی اسکول کا نام نہیں رکھتا۔"
  tr: "Halid bin Abdulaziz Al Saud hakkında Urduca Wikipedia makalesi yalnızca varlığın olayları için kullanılmıştır. Kısa bir biyografidir: Riyad'da doğmuş ve Krallığın dini okullarında eğitim görmüştür, 1964'te Faisal tahta çıkınca veliaht prens olmuştur ve 24-25 Mart 1975 tarihleri arasında 1982'de 71 yaşında vefat edene kadar kral olmuştur; bu tarihte herhangi bir okuldan bahsedilmemektedir."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Khalid bin Abdulaziz Al Saud hanya digunakan untuk peristiwa entitas tersebut. Ini adalah biografi singkat: Ia lahir di Riyadh dan dididik di sekolah agama Kerajaan, menjadi putra mahkota setelah Faisal naik takhta pada tahun 1964, dan menjadi raja dari 24-25 Maret 1975 hingga kematiannya pada tahun 1982 di usia 71 tahun; tidak ada sekolah yang disebutkan di dalamnya."
