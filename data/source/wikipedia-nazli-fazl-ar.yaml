  en: "Arabic Wikipedia article on Princess Nazli Fazl (1853–1913); used for entity facts only. It documents her cultural salon at the Villa Henry behind Abdeen Palace and her influence on Muhammad Abduh, Saad Zaghloul and Qasim Amin, and dates her death 28 January 1914, against the other sources."
