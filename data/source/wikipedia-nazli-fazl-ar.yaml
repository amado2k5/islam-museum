reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: her full name Nazli bint Mustafa Fazl Pasha ibn Ibrahim Pasha ibn Muhammad Ali; the eldest of her father's children and her mother Dal Azad Hanim's only daughter; the family's removal to Istanbul when she was 13; her return to Egypt after her father's death (the Khedive's 1875 decree preparing al-Haswa palace); her marriage to Khalil Pasha Sherif, Ottoman minister and ambassador to Paris (1877); her fluency in Arabic, Turkish, English, French, Italian and German; the salon she founded in the early 1880s at the 'Villa Henri' in the street behind Abdeen Palace, frequented by Abduh, Zaghloul, Qasim Amin and Abd al-Rahman al-Kawakibi, with Huda Sha'arawi among its later circle; her role in Abduh's pardon and return; her urging Abduh and Zaghloul to study French; the long account of Qasim Amin's reversal after his 1894 book 'Les Égyptiens' — her anger, his apology at her salon, and his 'Tahrir al-Mar'a' printed at her expense under her patronage in 1900; her Tunisian journeys from 1896 to visit her sister Ruqayya, her honorary presidency of the Khalduniyya association, and her marriage in 1900 to Khelil Bouhageb, son of the judge Salem Bouhageb; criticism recorded against her (the salon attacked as westernising; Muhammad Farid's memoirs call her a supporter of the English); the Order of Compassion (Shafqat), first class, from Sultan Abdul Hamid. It dates her death 28 January 1914 — against 28 December 1913 in the English article and Wikidata, and 12 December 1913 in the French article. It states nothing about her school; its framing of her unveiling and mixing is social description, not a faith attestation."
