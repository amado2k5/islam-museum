reliability_note: "Statement by the Evangelical Alliance, the UK evangelical umbrella body, published on its own site on 5 July 2018 (page updated 20 June 2019) and read in full on 1 November 2026. It is an organisation independent of Wikipedia and of Lord Ahmad himself, and it attests his Ahmadiyya membership in its own voice - 'Lord Ahmad is an Ahmadiyya Muslim, a group that has often been persecuted by more dominant strands of Islam' - making it the second independent text, alongside the English Wikipedia article, on which this record's ahmadiyya/documented settlement rests. It also quotes his own words on taking up the envoy role, 'As a man of faith, I feel this very keenly.'"
