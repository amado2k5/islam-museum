summary:
  ar: "بيان التحالف الإنجيليكي في 5 تموز 2018 مرحّبًا بتعيين اللورد أحمد مبعوثًا خاصًا لرئيسة الوزراء لحرية الدين أو المعتقد. يصف البيان اللورد أحمد صراحة بأنه «مسلم أحمدي» ويقتبس قوله عند توليه المنصب: «بصفتي رجل إيمان، أشعر بهذا بعمق»."
  en: "Evangelical Alliance statement of 5 July 2018 welcoming Lord Ahmad's appointment as the Prime Minister's Special Envoy on Freedom of Religion or Belief. It states in its own text that 'Lord Ahmad is an Ahmadiyya Muslim' and quotes him on taking up the role: 'As a man of faith, I feel this very keenly.'"
