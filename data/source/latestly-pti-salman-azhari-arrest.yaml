label: { en: "Gujarat Police arrest Mufti Salman Azhari in hate speech case — PTI via LatestLY, 5 February 2024" }
summary:
  ar: "خبر وكالة PTI ⁦(5 فبراير 2024)⁩ عن اعتقال شرطة غوجارات للمفتي سلمان أزهري في مومباي في قضية خطاب ألقاه في جوناغاد ليلة 31 يناير 2024، وتسجيل دعوى بموجب المادتين 153B و505(2) من قانون العقوبات الهندي."
  en: "PTI report (5 February 2024) of the Gujarat Police arrest of Mufti Salman Azhari in Mumbai over a speech delivered at Junagadh on the night of 31 January 2024, with an FIR under Indian Penal Code sections 153B and 505(2)."
  es: "Informe de PTI (5 de febrero de 2024) sobre el arresto por parte de la policía de Gujarat del Mufti Salman Azhari en Mumbai por un discurso pronunciado en Junagadh la noche del 31 de enero de 2024, con una denuncia bajo las secciones 153B y 505(2) del Código Penal de la India."
  fr: "Rapport PTI (5 février 2024) de l'arrestation par la police du Gujarat du mufti Salman Azhari à Mumbai suite à un discours prononcé à Junagadh dans la nuit du 31 janvier 2024, avec un FIR en vertu des articles 153B et 505(2) du Code pénal indien."
  ur: "PTI رپورٹ ⁦(5 فروری 2024)⁩ گجرات پولیس نے مفتی سلمان ازہری کی ممبئی میں 31 جنوری 2024 کی رات جوناگڑھ میں کی گئی تقریر پر گرفتاری، تعزیرات ہند کی دفعہ 153B اور 505(2) کے تحت ایف آئی آر کے ساتھ۔"
  tr: "PTI ajansının raporu (5 Şubat 2024), Mufti Salman Azhari'nin 31 Ocak 2024 gecesi Junagadh'da yaptığı konuşmayla bağlantılı olarak Mumbai'de Gujarat Polisi tarafından tutuklanması ve Hindistan Ceza Kanunu'nun 153B ve 505(2) maddeleri uyarınca davanın kaydedilmesi hakkında."
  id: "Laporan lembaga PTI (5 Februari 2024) tentang penangkapan Mufti Salman Azhari oleh Polisi Gujarat di Mumbai terkait pidato yang ia sampaikan di Junagadh pada malam 31 Januari 2024, serta pendaftaran kasus berdasarkan Pasal 153B dan 505(2) Kitab Undang-Undang Hukum Pidana India."
