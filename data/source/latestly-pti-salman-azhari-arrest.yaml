reliability_note: "Wire report by India's Press Trust of India, read in full on 5 November 2026. It reports that the speech was delivered at an event on an open ground near the 'B' division police station in Junagadh on the night of 31 January 2024; that after a video went viral an FIR was registered against Azhari and local organisers Mohammad Yousuf Malek and Azim Habib Odedara under IPC sections 153B and 505(2); that Gujarat Police traced Azhari to Mumbai and arrested him on Sunday 4 February 2024 with the help of the Gujarat Anti-Terrorist Squad, securing a transit remand to bring him to Junagadh; that officials said permission had been sought for a religious and de-addiction awareness gathering; and that hundreds of supporters gathered outside Ghatkopar police station demanding his release. Allegations are reported as allegations; no verdict is claimed."
