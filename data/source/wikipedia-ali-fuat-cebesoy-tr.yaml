reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives his birth as 23 September 1882 at Salacak, Üsküdar, Istanbul — the district precision the English article lacks — his father as İsmail Fâzıl Pasha and his mother Zekiye as a daughter of Müşir Mehmed Ali Pasha, and his resting place (yattığı yer) as the Merkez Mosque at Alifuatpaşa, Geyve, Sakarya. Its infobox has no religion field and its text makes no statement of his religion at all."
