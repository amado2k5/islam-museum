reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id through the MediaWiki API. It gives Okonjo-Iweala as born on 13 June 1954 in Ogwashi-Uku, Delta State, daughter of Professor Chukwuka Okonjo of the Obahai royal family; educated at Harvard (BA in economics, magna cum laude, 1976) and MIT (PhD in regional economics and development, 1981); twenty-five years at the World Bank, rising to Managing Director, Operations (2007–2011); Nigeria's finance minister twice (2003–2006 and 2011–2015) and briefly foreign minister in 2006; negotiator of the Paris Club deal that eliminated some US$30 billion of Nigeria's debt; and Director-General of the WTO from 1 March 2021, the first woman and first African in the post, since reappointed for a second term. It makes no statement of her religion anywhere in its text, infobox or categories."
