summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نجوزي أوكونجو إيويالا؛ تُستخدم لوقائع الكيان فقط. تروي عملها في البنك الدولي خمسة وعشرين عاما، ووزراتها للمالية مرتين، وتفاوضها على إعفاء نادي باريس من الديون، وقيادتها لمنظمة التجارة العالمية منذ 2021."
  en: "English Wikipedia article on Ngozi Okonjo-Iweala; used for entity facts only. It recounts her twenty-five years at the World Bank, her two terms as Nigeria's finance minister, the Paris Club debt-relief negotiation, and her leadership of the World Trade Organization since 2021."
  es: "Artículo de la Wikipedia en inglés sobre Ngozi Okonjo-Iweala; utilizado únicamente para obtener información sobre la persona. En él se detallan sus veinticinco años en el Banco Mundial, sus dos mandatos como ministra de Finanzas de Nigeria, la negociación del Club de París para el alivio de la deuda y su liderazgo de la Organización Mundial del Comercio desde 2021."
  fr: "Article de Wikipédia en anglais sur Ngozi Okonjo-Iweala; utilisé uniquement à des fins d’information sur l’entité. Il retrace ses vingt-cinq années à la Banque mondiale, ses deux mandats de ministre des Finances du Nigeria, les négociations sur l’allègement de la dette du Club de Paris et sa direction de l’Organisation mondiale du commerce depuis 2021."
  ur: "Ngozi Okonjo-Iweala پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ورلڈ بینک میں ان کے پچیس سال، نائیجیریا کے وزیر خزانہ کے طور پر ان کی دو میعادوں، پیرس کلب کے قرضوں سے نجات کے مذاکرات، اور 2021 سے عالمی تجارتی تنظیم کی ان کی قیادت کا ذکر ہے۔"
  tr: "Ngozi Okonjo-Iweela hakkında İngilizce Wikipedia makalesi; yalnızca varlık gerçekleri için kullanılmıştır. Dünya Bankası'ndaki yirmi beş yıllık çalışmalarını, iki kez maliye bakanlığı yapmasını, Paris Kulübü'nü borçtan kurtarmak için yaptığı müzakereleri ve 2021'den bu yana Dünya Ticaret Örgütü'ndeki liderliğini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ngozi Okonjo-Iweala; hanya digunakan untuk fakta entitas. Artikel ini menceritakan dua puluh lima tahun pekerjaannya di Bank Dunia, dua kali menjabat sebagai menteri keuangan, negosiasinya untuk membebaskan Paris Club dari utang, dan kepemimpinannya di Organisasi Perdagangan Dunia sejak 2021."
