  en: "Fath al-Qadir al-Jami' bayna Fannay al-Riwaya wa'l-Diraya min 'Ilm al-Tafsir — al-Shawkani (Dar al-Ma'rifa, 4th ed., 2007)"
  ur: "فتح القدیر الجامع بین فنی الروایۃ والدرایۃ من علم التفسیر — شوکانی (دار المعرفہ، چوتھا ایڈیشن، 2007ء)"
summary:
  ar: "طبعة دار المعرفة في بيروت من تفسير الشوكاني في مجلد واحد، اعتنى به وراجع أصوله يوسف الغوش؛ الطبعة الرابعة 1428هـ / 2007م. يتقدمها ترجمة للمؤلف وسند رواية الكتاب عن محمد بن محمد بن يحيى زبارة، وتنتهي بتعليقة سماع على المؤلف مؤرخة في 5 ربيع الأول 1241هـ."
  en: "The Dar al-Ma'rifa (Beirut) one-volume printing of al-Shawkani's commentary, prepared and checked against its originals by Yusuf al-Ghush; 4th edition, 1428 AH / 2007. It opens with a biography of the author and the chain of transmission of the book through Muhammad ibn Muhammad ibn Yahya Zabara, and closes with a note of audition read back to the author, dated 5 Rabi' I 1241 AH."
  ur: "دار المعرفہ بیروت کا ایک جلد میں شوکانی کی تفسیر کا ایڈیشن، جس کی تیاری اور اصل نسخوں سے مقابلہ یوسف الغوش نے کیا؛ چوتھا ایڈیشن 1428ھ / 2007ء۔ اس کے آغاز میں مصنف کی سوانح اور محمد بن محمد بن یحییٰ زبارہ کے واسطے سے کتاب کی سند ہے، اور اختتام پر مصنف پر سماع کی 5 ربیع الاول 1241ھ کی تحریر ہے۔"
