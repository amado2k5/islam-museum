summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن قاضي ظفر الله؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في أبريل 1947، أكبر أبناء قاضي محبوب الله وبيغوم زبون النساء، وتعليمه في مدرسة القديس غريغوريوس وكلية دكا وجامعة دكا، وعضويته في هيئة رئاسة رابطة عوامي وعضويته السابقة في البرلمان عن فريدبور-5، وإصابته في هجوم القنابل سنة 2004، وقضايا الفساد التي بُرّئ منها سنة 2009. لا تذكر المقالة أي دين له."
  en: "English Wikipedia article on Kazi Zafarullah; used for entity facts only. It gives his birth in April 1947, as the eldest son of Kazi Mahbubullah and Begum Zebunnessa, his education at St. Gregory's High School, Dhaka College and the University of Dhaka, his membership of the Awami League presidium and his former membership of parliament for Faridpur-5, his injury in the 2004 grenade attack, and the corruption charges of which he was cleared in 2009. The article names no religion for him."
  es: "Artículo de la Wikipedia en inglés sobre Kazi Zafarullah; utilizado únicamente para obtener información sobre la persona. En él se indica que nació en abril de 1947, como hijo mayor de Kazi Mahbubullah y Begum Zebunnessa, su educación en la escuela secundaria St. Gregory's, el Dhaka College y la Universidad de Dhaka, su pertenencia al presidium de la Liga Awami y su anterior escaño en el parlamento por Faridpur-5, su lesión en el ataque con granadas de 2004 y los cargos de corrupción de los que fue absuelto en 2009. El artículo no menciona su religión."
  fr: "Article de Wikipédia en anglais sur Kazi Zafarullah; utilisé uniquement à titre informatif. On y apprend sa naissance en avril 1947, fils aîné de Kazi Mahbubullah et de Begum Zebunnessa, ses études à la St. Gregory's High School, au Dhaka College et à l'Université de Dhaka, son appartenance au présidium de la Ligue Awami et son mandat de député de Faridpur-5, sa blessure lors de l'attentat à la grenade de 2004 et les accusations de corruption dont il a été innocenté en 2009. L'article ne mentionne pas sa religion."
  ur: "قاضی ظفر اللہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اپریل 1947 میں قاضی محبوب اللہ اور بیگم زیبونیسہ کے بڑے بیٹے کی حیثیت سے پیدا ہوا، سینٹ گریگوری ہائی سکول، ڈھاکہ کالج اور ڈھاکہ یونیورسٹی میں ان کی تعلیم، عوامی لیگ کے صدارتی رکنیت اور فرید پور-5 کے لیے ان کی سابقہ رکن پارلیمنٹ، 2004 میں ان کی چوٹ، گرینیڈ حملے اور کرپشن کے آرٹیکل 2009 میں ان پر لگنے والی چوٹ شامل ہیں۔ اس کے لیے کسی مذہب کا نام نہیں۔"
  tr: "Qazi Zafarullah hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Nisan 1947'de doğduğu Qazi Mahbubullah ve Begum Zaboon'un en büyük oğlu olarak, St. Gregory's School, Dhaka College ve Dakka Üniversitesi'ndeki eğitiminden, Awami League liderliğindeki üyeliğinden ve Faridpur-5 için önceki parlamento üyeliğinden, 2004'te bir bombalı saldırıda yaralanmasından ve 2009'da beraat ettiği yolsuzluk davalarından bahsedilmektedir. Makalede herhangi bir dininden bahsedilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Qazi Zafarullah; digunakan hanya untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya pada April 1947, putra sulung Qazi Mahbubullah dan Begum Zaboon, pendidikannya di St. Gregory's School, Dhaka College, dan Universitas Dhaka, keanggotaannya dalam kepemimpinan Awami League dan keanggotaan parlemen sebelumnya untuk Faridpur-5, cederanya dalam serangan bom pada 2004, serta kasus korupsi yang membebaskannya pada 2009. Artikel tersebut tidak menyebutkan agama apapun miliknya."
