summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن قاضي ظفر الله؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في أبريل 1947، أكبر أبناء قاضي محبوب الله وبيغوم زبون النساء، وتعليمه في مدرسة القديس غريغوريوس وكلية دكا وجامعة دكا، وعضويته في هيئة رئاسة رابطة عوامي وعضويته السابقة في البرلمان عن فريدبور-5، وإصابته في هجوم القنابل سنة 2004، وقضايا الفساد التي بُرّئ منها سنة 2009. لا تذكر المقالة أي دين له."
  en: "English Wikipedia article on Kazi Zafarullah; used for entity facts only. It gives his birth in April 1947, as the eldest son of Kazi Mahbubullah and Begum Zebunnessa, his education at St. Gregory's High School, Dhaka College and the University of Dhaka, his membership of the Awami League presidium and his former membership of parliament for Faridpur-5, his injury in the 2004 grenade attack, and the corruption charges of which he was cleared in 2009. The article names no religion for him."
