summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مولوي عبد الحق، بابا الأردية؛ تُستخدم لوقائع الكيان فقط. تروي أمانته لأنجمن ترقي اردو منذ 1912، وتقاعده من عثمانية سنة 1930، وهجرته إلى باكستان سنة 1948، ووفاته في كراتشي سنة 1961، دون أي ذكر لدينه في متنها."
  en: "English Wikipedia article on Maulvi Abdul Haq, Baba-e-Urdu; used for entity facts only. It recounts his secretaryship of the Anjuman Taraqqi-i-Urdu from 1912, his 1930 retirement from Osmania, his 1948 migration to Pakistan and his death at Karachi in 1961, and makes no statement of his religion in its text."
  es: "Artículo de la Wikipedia en inglés sobre Maulvi Abdul Haq, Baba-e-Urdu; utilizado únicamente para datos sobre la persona. Relata su labor como secretario de la Anjuman Taraqqi-i-Urdu desde 1912, su retiro de Osmania en 1930, su migración a Pakistán en 1948 y su fallecimiento en Karachi en 1961, sin mencionar su religión en el texto."
  fr: "Article de Wikipédia en anglais sur Maulvi Abdul Haq, Baba-e-Urdu; utilisé uniquement à des fins d'information sur l'entité. Il relate son poste de secrétaire de l'Anjuman Taraqqi-i-Urdu à partir de 1912, sa retraite d'Osmania en 1930, son émigration au Pakistan en 1948 et sa mort à Karachi en 1961, sans faire mention de sa religion."
  ur: "مولوی عبدالحق پر انگریزی ویکیپیڈیا مضمون، بابائے اردو؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی 1912 سے انجمن تعلیم اردو کی سیکرٹری شپ، 1930 میں عثمانیہ سے ریٹائرمنٹ، 1948 میں پاکستان کی طرف ہجرت اور 1961 میں کراچی میں ان کی وفات کا ذکر ہے، اور اس کے متن میں ان کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Mawlawi Abdul Haq, Urduca Baba hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. 1912'den beri Anjuman Taraqqi Urdu'ya olan güvenini, 1930'da Osmanlı İmparatorluğu'ndan emekli olmasını, 1948'de Pakistan'a göçünü ve 1961'de Karaçi'de ölümünü anlatır; içeriğinde dinine hiç yer verilmez."
  id: "Artikel Wikipedia berbahasa Inggris tentang Mawlawi Abdul Haq, Baba dari bahasa Urdu; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kepercayaannya pada Anjuman Taraqqi Urdu sejak 1912, pensiun dari Kekaisaran Ottoman pada 1930, migrasinya ke Pakistan pada 1948, dan kematiannya di Karachi pada 1961, tanpa menyebutkan agamanya dalam isinya."
