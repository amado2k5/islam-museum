  ar: "مقالة ويكيبيديا الأوزبكية عن محمودخوجا بهبودي ⁦(20 يناير 1875 – 25 مارس 1919)⁩؛ تُستخدم لوقائع الكيان فقط. وهي أوسع طبعة: توثّق حياته في سمرقند وعمله قاضيًا ومفتيًا وصحافته ومسرحه وإعدامه في قرشي."
  en: "Uzbek Wikipedia article on Mahmudxo'ja Behbudiy (20 January 1875 – 25 March 1919); used for entity facts only. The fullest edition: it documents his life in Samarkand, his work as qadi and mufti, his press and theatre, and his execution at Qarshi."
  es: "Artículo de Wikipedia en uzbeko sobre Mahmudxo'ja Behbudiy (20 de enero de 1875 - 25 de marzo de 1919); Se utiliza únicamente para hechos de entidades. La edición más completa: documenta su vida en Samarcanda, su trabajo como cadí y mufti, su prensa y teatro, y su ejecución en Qarshi."
  fr: "Article Wikipédia ouzbek sur Mahmudxo'ja Behbudiy (20 janvier 1875 – 25 mars 1919); utilisé uniquement pour les faits d’entité. L'édition la plus complète: elle documente sa vie à Samarkand, son travail de cadi et de mufti, sa presse et son théâtre, et son exécution à Qarshi."
  ur: "ازبک ویکیپیڈیا مضمون محمودکسوجا بہبودی ⁦(20 جنوری 1875 - 25 مارچ 1919)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ مکمل ایڈیشن: اس میں سمرقند میں ان کی زندگی، قاضی اور مفتی کے طور پر ان کے کام، پریس اور تھیٹر، اور قرشی میں ان کی پھانسی کی دستاویز کی گئی ہے۔"
