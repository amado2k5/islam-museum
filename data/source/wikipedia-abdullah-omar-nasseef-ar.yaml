summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الله بن عمر نصيف (1939–2025): مولده بجدة في 18 جمادى الأولى 1358هـ، ودراسته في جامعة الملك سعود وليدز، ووظائفه في جامعة الملك عبد العزيز حتى إدارتها، وأمانته العامة لرابطة العالم الإسلامي ⁦(1403–1414هـ)⁩، ونيابته لرئيس مجلس الشورى، وعضوياته ومؤلفاته، وأحديته، ووفاته في 20 ربيع الآخر 1447هـ."
  en: "Arabic Wikipedia article on Abd Allah ibn Umar Nasif (1939–2025): birth in Jeddah on 18 Jumada I 1358, study at King Saud University and Leeds, posts at King Abdulaziz University up to its presidency, secretary-generalship of the Muslim World League (1403–1414 AH), deputy chairmanship of the Shura Council, memberships, writings, his Sunday salon, and death on 20 Rabi' II 1447."
