summary:
  ar: "مقالة ويكيبيديا الروسية عن غالب عسكر كمال؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 25 ديسمبر 1878 (يولياني) / 6 يناير 1879 في قازان، وطفولته في قرية نيجنيايا ماسرا، ودراسته في مدرسة محمدية، ولقب بطل العمل سنة 1923، ودفنه في مقبرة براتسكويه بقازان. يعطي صندوق معلوماتها وفاته في 16 يونيو 1933 بينما يذكر متنها 8 يونيو؛ ولا تسمي له دينا ولا مذهبا."
  en: "Russian Wikipedia article on Galiaskar Kamal; used for entity facts only. It dual-dates his birth 25 December 1878 (Julian) / 6 January 1879 at Kazan, records his childhood in the village of Nizhnyaya Masra, his study at the Muhammadiya madrasa, the Hero of Labour title of 1923, and his burial in the Bratskoye cemetery at Kazan. Its infobox gives his death as 16 June 1933 while its lead gives 8 June; it names no religion or school for him."
