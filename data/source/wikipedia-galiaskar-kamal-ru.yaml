summary:
  ar: "مقالة ويكيبيديا الروسية عن غالب عسكر كمال؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 25 ديسمبر 1878 ⁦(يولياني)⁩ / 6 يناير 1879 في قازان، وطفولته في قرية نيجنيايا ماسرا، ودراسته في مدرسة محمدية، ولقب بطل العمل سنة 1923، ودفنه في مقبرة براتسكويه بقازان. يعطي صندوق معلوماتها وفاته في 16 يونيو 1933 بينما يذكر متنها 8 يونيو؛ ولا تسمي له دينا ولا مذهبا."
  en: "Russian Wikipedia article on Galiaskar Kamal; used for entity facts only. It dual-dates his birth 25 December 1878 (Julian) / 6 January 1879 at Kazan, records his childhood in the village of Nizhnyaya Masra, his study at the Muhammadiya madrasa, the Hero of Labour title of 1923, and his burial in the Bratskoye cemetery at Kazan. Its infobox gives his death as 16 June 1933 while its lead gives 8 June; it names no religion or school for him."
  es: "Artículo de la Wikipedia rusa sobre Galiaskar Kamal; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 25 de diciembre de 1878 (juliano) / 6 de enero de 1879 en Kazán, su infancia en la aldea de Nizhnyaya Masra, sus estudios en la madrasa Muhammadiya, el título de Héroe del Trabajo de 1923 y su entierro en el cementerio de Bratskoye en Kazán. Su ficha informativa indica que falleció el 16 de junio de 1933, mientras que el titular menciona el 8 de junio; no especifica su religión ni su escuela."
  fr: "Article de Wikipédia en russe sur Galiaskar Kamal; utilisé uniquement pour les informations le concernant. Il mentionne deux dates de naissance: le 25 décembre 1878 (calendrier julien) / le 6 janvier 1879 à Kazan. Il relate son enfance dans le village de Nijniaïa Masra, ses études à la madrasa Muhammadiya, l’obtention du titre de Héros du Travail en 1923 et son inhumation au cimetière de Bratskoïe à Kazan. Son infobox indique le 16 juin 1933 comme date de décès, tandis que son introduction mentionne le 8 juin. Aucune mention n’est faite de sa religion ni de son école."
