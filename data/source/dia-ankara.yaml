reliability_note: "Read in the museum's session on 21 November 2026. The section of the entry covering the Ottoman and modern periods (printed in volume 3 of the encyclopaedia, Istanbul, 1991, at pages 204–209) says that Ankara was joined to the Ottoman lands in 1354 by Süleyman Paşa, son of Orhan Gazi; that the city was the scene of the battle between Bayezid I and Timur in 1402; that Mustafa Kemal arrived on 27 December 1919 and the Grand National Assembly convened there on 23 April 1920; and that Ankara was accepted as the capital of the new Turkish state on 13 October 1923, the republic being proclaimed in the city on 29 October 1923. Used for the statements it makes, each attributed to it."
