summary:
  ar: "مقالة ويكيبيديا الروسية عن نجم الدين غوتسينسكي؛ تُستخدم لوقائع الكيان فقط. تروي سيرته عالمًا ومفتيًا وإمامًا، وتنص صراحة على أنه لم يكن منتميًا إلى أي طريقة صوفية رغم مدحه بعض شيوخها، وصندوق معلوماتها يذكر «إسلامًا سنيًا»."
  en: "Russian Wikipedia article on Najmuddin Hotsinsky; used for entity facts only. It recounts his career as scholar, mufti and imam, and states expressly that he did not belong to any Sufi tariqa although he praised some Sufi sheikhs; its infobox gives Sunni Islam."
  es: "Artículo de la Wikipedia rusa sobre Najmuddin Hotsinsky; utilizado únicamente para datos sobre la persona. Relata su trayectoria como erudito, muftí e imán, y afirma expresamente que no perteneció a ninguna tariqa sufí, aunque elogió a algunos jeques sufíes; su ficha informativa indica que se trata del islam sunita."
  fr: "Article de Wikipédia en russe sur Najmuddin Hotsinsky; utilisé uniquement pour les informations sur l’entité. Il relate sa carrière d’érudit, de mufti et d’imam, et précise qu’il n’appartenait à aucune confrérie soufie, bien qu’il ait fait l’éloge de certains cheikhs soufis; son infobox mentionne l’islam sunnite."
  ur: "نجم الدین ہوٹسنسکی پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ عالم، مفتی اور امام کے طور پر ان کے کیریئر کا ذکر کرتا ہے، اور واضح طور پر کہتا ہے کہ ان کا تعلق کسی صوفی طریقت سے نہیں تھا حالانکہ اس نے کچھ صوفی شیخوں کی تعریف کی تھی۔ اس کا انفو باکس سنی اسلام دیتا ہے۔"
