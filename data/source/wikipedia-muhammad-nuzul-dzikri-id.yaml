summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن محمد نزل ذكري؛ تُستخدم لوقائع الكيان فقط. تفصّل نشأته في جاكرتا، ودراسته في معهد العلوم الإسلامية والعربية ⁦(ليبيا)⁩ وتخرّجه سنة 2009، ودروسه المنتظمة في مسجد نور الإيمان ببلوك إم ومحاضراته عبر الإنترنت، ومنصبه في معهد التخصّص البركة (2010–2015)."
  en: "Indonesian Wikipedia article on Muhammad Nuzul Dzikri; used for entity facts only. It details his Jakarta upbringing, his studies at the Institute of Islamic and Arabic Sciences (LIPIA), graduating in 2009, his regular study sessions at the Nurul Iman Mosque, Blok M Square, and online, and his post at the Al Barkah Takhassus institute (2010–2015)."
  es: "Artículo de la Wikipedia en indonesio sobre Muhammad Nuzul Dzikri; utilizado únicamente para datos sobre la persona. Detalla su infancia en Yakarta, sus estudios en el Instituto de Ciencias Islámicas y Árabes (LIPIA), donde se graduó en 2009, sus sesiones de estudio regulares en la Mezquita Nurul Iman, en la Plaza Blok M y en línea, y su cargo en el Instituto Al Barkah Takhassus (2010-2015)."
  fr: "Article de Wikipédia indonésien sur Muhammad Nuzul Dzikri; utilisé uniquement à des fins d’information sur l’entité. Il détaille son enfance à Jakarta, ses études à l’Institut des sciences islamiques et arabes (LIPIA), dont il est sorti diplômé en 2009, ses séances d’étude régulières à la mosquée Nurul Iman, place Blok M et en ligne, ainsi que son poste à l’institut Al Barkah Takhassus (2010-2015)."
  ur: "محمد نزول ذکری پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی جکارتہ کی پرورش، انسٹی ٹیوٹ آف اسلامک اینڈ عربک سائنسز (LIPIA) میں ان کی تعلیم، 2009 میں گریجویشن، نورالایمان مسجد، بلاک ایم اسکوائر، اور آن لائن میں ان کے باقاعدہ مطالعاتی سیشنز اور البرکۃ تخصس انسٹی ٹیوٹ (2010-2015) میں ان کی پوسٹ کی تفصیلات بیان کی گئی ہیں۔"
  tr: "Muhammed Nazal Zikri hakkında Endonezya Vikipedi makalesi; yalnızca varlık bilgileri için kullanılmıştır. Cakarta'da büyümüş, Libya'daki İslami ve Arap Bilimleri Enstitüsü'nde eğitim görmüş, 2009 yılında mezun olmuş, düzenli derslerini M Blok'taki Nur el-İman Camii'nde ve çevrimiçi derslerini almış, ayrıca Al-Baraka Uzmanlık Enstitüsü'ndeki görevini (2010–2015) tamamlamıştır."
  id: "Artikel Wikipedia Indonesia tentang Muhammad Nazal Zikri; digunakan hanya untuk fakta entitas. Ia dibesarkan di Jakarta, belajar di Institut Ilmu Islam dan Arab (Libya), lulus pada 2009, kelas reguler di Masjid Noor Al-Iman di Blok M dan kuliahnya secara daring, serta posisinya di Institut Spesialisasi Al-Baraka (2010–2015)."
