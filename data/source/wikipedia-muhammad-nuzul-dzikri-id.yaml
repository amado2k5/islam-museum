reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it — the biographical facts used here rest on the article's citations to his official site and to Uloom.id. Read on 15 November 2026 (browser copy crawled 30 August 2026); the article was read in full. Its infobox (updated 18 August 2026) gives his denomination as Sunni and his movement as Salafiyah, the movement field citing an Inside Indonesia piece of 15 November 2023 on Salafism becoming fashionable: an infobox is structured data and never settles faith under this lane's rules, and a movement label in an infobox is not a prose attestation of a school. The revision-id endpoint was not reachable in this session, so no revision id is recorded; the access date stands in its place."
