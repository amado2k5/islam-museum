reliability_note: "Read 2026-11-15 through the search-result excerpt of the article; a direct page fetch returned an access block, so only the excerpted opening was seen. The excerpt identifies Farghani as a Muslim astronomer flourishing at Samarra during the Abbasid capital period (836-92 CE); reports that Sa'id al-Andalusi counted him among al-Ma'mun's astronomers; notes his canal project entrusted by al-Mutawakkil through the Banu Musa engineers and completed with the nilometer restoration in 247/861; and lists the chapter plan of the Ketab jawami' 'ilm al-nujum: ch.1 calendars, chs.2-5 celestial spheres and motions, chs.6-9 geography and climes, chs.10-11 ascensions and hours, chs.12-18 models and motions of luminaries and planets, chs.19-20 fixed stars and lunar mansions, chs.21-22 distances and sizes, chs.23-24 meridian transits, risings, settings and occultations, ch.25 lunar phases, ch.26 first visibilities, with later chapters on eclipses. Treat the chapter list and biographical details as the article's statements, not independently verified."
