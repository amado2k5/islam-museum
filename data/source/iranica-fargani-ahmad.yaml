summary:
  ar: "مقالة تصنف الفرغاني فلكياً مسلماً مزدهراً في سامراء عاصمة الخلافة العباسية، وتلخص كتابه في ثلاثين فصلاً وتعدد موضوعات فصوله من التقاويم إلى كسوفات القمر والشمس."
  en: "An article classing al-Farghani as a Muslim astronomer flourishing at Samarra, the Abbasid capital, summarising his thirty-chapter book and listing its chapter topics from calendars to lunar and solar eclipses."
  ur: "ایک مضمون جو فرغانی کو سامرا میں ابھرتا ہوا مسلمان ماہر فلکیات قرار دیتا ہے، ان کی تیس ابواب والی کتاب کا خلاصہ پیش کرتا ہے اور تقویم سے لے کر گرہنوں تک ابواب کی فہرست دیتا ہے۔"
  es: "Un artículo que clasifica a al-Farghani como un astrónomo musulmán que floreció en Samarra, la capital abasí, resume su libro de treinta capítulos y enumera los temas que tratan, desde calendarios hasta eclipses lunares y solares."
  fr: "Un article classant al-Farghani comme un astronome musulman ayant prospéré à Samarra, la capitale abbasside, résumant son livre en trente chapitres et énumérant les sujets abordés, des calendriers aux éclipses lunaires et solaires."
  tr: "Abbasi Halifeliği'nin başkenti Samarra'da Al-Farghani'yi gelişen bir Müslüman astronom olarak sınıflandıran, kitabını otuz bölümde özetleyen ve takvimlerden ay ve güneş tutulmalarına kadar çeşitli konuları kapsayan bir makale."
  id: "Sebuah artikel yang mengklasifikasikan Al-Farghani sebagai astronom Muslim yang berkembang di Samarra, ibu kota Kekhalifahan Abbasiyah, merangkum bukunya dalam tiga puluh bab dan membahas berbagai topik, mulai dari kalender hingga gerhana bulan dan matahari."
