label:
  ar: "الكشاف عن حقائق التنزيل وعيون الأقاويل في وجوه التأويل — الزمخشري، اعتنى به خليل مأمون شيحا ⁦(دار المعرفة، ط3، 1430هـ/2009م)⁩"
  en: "al-Kashshaf 'an Haqa'iq al-Tanzil — al-Zamakhshari, ed. Khalil Ma'mun Shiha (Dar al-Ma'rifa, 3rd ed., 2009)"
  ur: "الکشاف عن حقائق التنزیل — زمخشری، اعتنا خلیل مامون شیحا ⁦(دار المعرفہ، تیسرا ایڈیشن، 2009ء)⁩"
summary:
  ar: "طبعة دار المعرفة ببيروت للكشاف في مجلد واحد، اعتنى به وخرّج أحاديثه وعلّق عليه خليل مأمون شيحا، وعليه تعليقات «الانتصاف فيما تضمنه الكشاف من الاعتزال» لناصر الدين ابن المنير المالكي؛ الطبعة الثالثة 1430هـ/2009م. وفيها مقدمة للمعتني في ترجمة الزمخشري والتعريف بالكشاف ومنهجه وما كُتب عليه."
  en: "Dar al-Ma'rifa's (Beirut) one-volume printing of al-Kashshaf, prepared, hadith-referenced and annotated by Khalil Ma'mun Shiha, with the comments of Nasir al-Din Ibn al-Munayyir the Maliki's al-Intisaf on the Mu'tazili content of al-Kashshaf; 3rd edition 1430 AH / 2009. The editor's introduction covers al-Zamakhshari's life, the book, its method and the works written on it."
  ur: "دار المعرفہ بیروت کا الکشاف کا ایک جلد والا ایڈیشن، جس کی تیاری، احادیث کی تخریج اور تعلیقات خلیل مامون شیحا نے کیں، اور اس پر ناصر الدین ابن المنیر مالکی کی «الانتصاف» کی تعلیقات ہیں؛ تیسرا ایڈیشن 1430ھ / 2009ء۔ اس میں زمخشری کی سوانح، کتاب کے تعارف، منہج اور اس پر لکھی گئی کتابوں پر معتنی کا مقدمہ ہے۔"
  es: "Edición en un solo volumen de al-Kashshaf, publicada por Dar al-Ma'rifa (Beirut), preparada, referenciada con hadices y anotada por Khalil Ma'mun Shiha; 3.ª edición, 1430 AH / 2009. La introducción del editor abarca la vida de al-Zamakhshari, el libro, su método y las obras escritas sobre él."
  fr: "Édition en un volume d'al-Kashshaf par Dar al-Ma'rifa (Beyrouth), préparée, référencée par des hadiths et annotée par Khalil Ma'mun Shiha; 3e édition 1430 AH / 2009. L'introduction de l'éditeur couvre la vie d'al-Zamakhshari, le livre, sa méthode et les œuvres écrites à son sujet."
  tr: "Dar al-Ma'rifa, Beyrut baskısında tek cilt halinde yer almıştır; bu baskıya özen göstermiştir, hadisler çıkarmıştır ve Halil Ma'mun Şiha tarafından yorumlanmıştır; ayrıca Nasir al-Din İbn el-Munir el-Maliki tarafından yazılmış \"Al-Intisaf fima Tadhmah al-Kashshaf min al-I'tazila\" başlıklı açıklamalar bulunmaktadır; üçüncü baskı 1430 Hicri / 2009 CE. El-Mu'attani'nin el-Zemakşeri'nin biyografisi üzerine bir girişi, el-Kaşşaf'a, metodolojisine ve üzerine yazılanlara dair bir giriş içerir."
  id: "Dar al-Ma'rifa dalam edisi Beirut Al-Kashshaf dalam satu jilid, yang ia rawat, ekstrak hadits, dan komentari oleh Khalil Ma'mun Shiha, serta di dalamnya terdapat anotasi berjudul \"Al-Intisaf fima Tadhmah al-Kashshaf min al-I'tazila\" oleh Nasir al-Din Ibn al-Munir al-Maliki; edisi ketiga 1430 H / 2009 M. Buku ini memuat pengantar oleh Al-Mu'attani tentang biografi al-Zamakhshari, pengantar tentang al-Kashshaf, metodologinya, dan apa yang ditulis tentangnya."
