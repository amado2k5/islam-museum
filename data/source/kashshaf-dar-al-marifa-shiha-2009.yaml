  en: "al-Kashshaf 'an Haqa'iq al-Tanzil — al-Zamakhshari, ed. Khalil Ma'mun Shiha (Dar al-Ma'rifa, 3rd ed., 2009)"
  ur: "الکشاف عن حقائق التنزیل — زمخشری، اعتنا خلیل مامون شیحا (دار المعرفہ، تیسرا ایڈیشن، 2009ء)"
summary:
  ar: "طبعة دار المعرفة ببيروت للكشاف في مجلد واحد، اعتنى به وخرّج أحاديثه وعلّق عليه خليل مأمون شيحا، وعليه تعليقات «الانتصاف فيما تضمنه الكشاف من الاعتزال» لناصر الدين ابن المنير المالكي؛ الطبعة الثالثة 1430هـ/2009م. وفيها مقدمة للمعتني في ترجمة الزمخشري والتعريف بالكشاف ومنهجه وما كُتب عليه."
  en: "Dar al-Ma'rifa's (Beirut) one-volume printing of al-Kashshaf, prepared, hadith-referenced and annotated by Khalil Ma'mun Shiha, with the comments of Nasir al-Din Ibn al-Munayyir the Maliki's al-Intisaf on the Mu'tazili content of al-Kashshaf; 3rd edition 1430 AH / 2009. The editor's introduction covers al-Zamakhshari's life, the book, its method and the works written on it."
  ur: "دار المعرفہ بیروت کا الکشاف کا ایک جلد والا ایڈیشن، جس کی تیاری، احادیث کی تخریج اور تعلیقات خلیل مامون شیحا نے کیں، اور اس پر ناصر الدین ابن المنیر مالکی کی «الانتصاف» کی تعلیقات ہیں؛ تیسرا ایڈیشن 1430ھ / 2009ء۔ اس میں زمخشری کی سوانح، کتاب کے تعارف، منہج اور اس پر لکھی گئی کتابوں پر معتنی کا مقدمہ ہے۔"
