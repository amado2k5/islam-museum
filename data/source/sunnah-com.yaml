  ar: "موقع سنن.كوم، يعرض نصوص الكتب الستة وغيرها بالعربية والإنجليزية مع أرقام الأحاديث والدرجات. استُخدم لعدد الأبواب والأحاديث وأسماء المترجمين في صفحات فهرس كل مجموعة، ولا يُستشهد به إلا بما تقوله صفحاته."
  en: "Sunnah.com presents the canonical hadith collections in Arabic and English with hadith numbers and grades. Used here for the book counts, hadith counts and translator names on each collection's index page, and cited only for what those pages state."
  es: "Sunnah.com presenta las colecciones canónicas de hadices en árabe e inglés, con sus números y grados de clasificación. Aquí se utilizan los números de libro, los números de hadices y los nombres de los traductores en la página de índice de cada colección, y se citan únicamente según lo que indican dichas páginas."
  fr: "Sunnah.com présente les recueils canoniques de hadiths en arabe et en anglais, avec leur numérotation et leur classement. Ces informations sont utilisées ici pour le nombre de livres, le nombre de hadiths et les noms des traducteurs figurant sur la page d'index de chaque recueil, et ne sont citées que pour les informations qui y sont mentionnées."
