summary:
  ar: "مقالة ويكيبيديا العربية عن أسيمي غويتا؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تذكر ولادته في 9 نوفمبر 1983 ورئاسته اللجنة الوطنية لإنقاذ الشعب التي أطاحت بالرئيس إبراهيم أبو بكر كيتا في انقلاب 2020. لا تذكر دينه في أي نص."
  en: "Arabic Wikipedia article on Assimi Goïta; used for entity facts only. A short article giving his birth on 9 November 1983 and his chairmanship of the National Committee for the Salvation of the People, the junta that overthrew President Ibrahim Boubacar Keïta in the 2020 coup. Its text says nothing about his religion."
  es: "Artículo en árabe de la Wikipedia sobre Assimi Goïta; utilizado únicamente para obtener información sobre la persona. Un breve artículo que indica su fecha de nacimiento, el 9 de noviembre de 1983, y su presidencia del Comité Nacional para la Salvación del Pueblo, la junta militar que derrocó al presidente Ibrahim Boubacar Keïta en el golpe de Estado de 2020. El texto no menciona su religión."
  fr: "Article Wikipédia en arabe sur Assimi Goïta; utilisé uniquement à des fins d'information sur l'entité. Ce court article mentionne sa naissance le 9 novembre 1983 et sa présidence du Comité national pour le salut du peuple, la junte qui a renversé le président Ibrahim Boubacar Keïta lors du coup d'État de 2020. Le texte ne fait aucune mention de sa religion."
  ur: "Assimi Goïta پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 9 نومبر 1983 کو ان کی پیدائش اور عوام کی نجات کے لیے قومی کمیٹی کی سربراہی کا ایک مختصر مضمون، جس نے 2020 کی بغاوت میں صدر ابراہیم بوبکر کیٹا کا تختہ الٹ دیا تھا۔ اس کا متن اس کے مذہب کے بارے میں کچھ نہیں کہتا۔"
  tr: "Assimi Goita hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kısa bir makalede 9 Kasım 1983'teki doğumundan ve 2020 darbesinde Cumhurbaşkanı İbrahim Boubacar Keita'yı deviren Halkın Kurtuluşu Ulusal Komitesi başkanlığından bahsedilmektedir. Dini hiçbir metinde belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Arab tentang Assimi Goita; hanya digunakan untuk fakta entitas. Sebuah artikel singkat menyebutkan kelahirannya pada 9 November 1983, dan masa kepemimpinannya di Komite Nasional untuk Penyelamatan Rakyat yang menggulingkan Presiden Ibrahim Boubacar Keita dalam kudeta 2020. Agamanya tidak disebutkan dalam teks manapun."
