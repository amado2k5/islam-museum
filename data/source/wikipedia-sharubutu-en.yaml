  en: "English Wikipedia article on Osman Nuhu Sharubutu; used for entity facts only. It recounts his birth at Accra on 23 April 1919 or 1923, his studies at Kumasi, his appointment as Deputy Regional Chief Imam in 1974 and as National Chief Imam of Ghana in 1993, his charitable foundations and his role in national peace work."
