reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives him as born on 23 April 1919 or 23 April 1923 at Old Zango (Cow Lane), Accra, to Nuhu Sharubutu and Hajja Ayishatu Abbass; taught at home, then at Kumasi under Abdullah Dan Tano (Arabic grammar and literature, fiqh and hadith); a teacher of Muslim youth; Deputy Regional Chief Imam from 1974, deputising for his cousin Imam Muhammed Mukhtar Abbas; National Chief Imam of Ghana from 1993; founder of the SONSETFund education trust and of the Islamic Peace and Security Council of Ghana (IPASEC), and a member of the National Peace Council; he led the first Friday prayer at the Ghana National Mosque on 16 July 2021, and his wife Hajia Rahmatu died on 27 March 2024. Its infobox carries a denomination field naming the Tijaniyyah for him personally, referenced to a 2019 Pulse Ghana profile — a referenced infobox value, hence one attestation family; the article's text never mentions the Tijaniyyah or any school."
