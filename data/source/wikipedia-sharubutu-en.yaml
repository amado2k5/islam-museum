summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عثمان نوح شاروبوتو؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أكرا في 23 أبريل 1919 أو 1923، ودراسته في كوماسي، وتعيينه نائبًا للإمام الإقليمي سنة 1974 ثم إمامًا وطنيًا لغانا سنة 1993، ومؤسساته الخيرية ودوره في السلم الأهلي."
  en: "English Wikipedia article on Osman Nuhu Sharubutu; used for entity facts only. It recounts his birth at Accra on 23 April 1919 or 1923, his studies at Kumasi, his appointment as Deputy Regional Chief Imam in 1974 and as National Chief Imam of Ghana in 1993, his charitable foundations and his role in national peace work."
  es: "Artículo de la Wikipedia en inglés sobre Osman Nuhu Sharubutu; utilizado únicamente para obtener información sobre la persona. Relata su nacimiento en Accra el 23 de abril de 1919 o 1923, sus estudios en Kumasi, su nombramiento como Imán Regional Adjunto en 1974 y como Imán Nacional de Ghana en 1993, sus fundaciones benéficas y su papel en la labor por la paz nacional."
  fr: "Article de Wikipédia en anglais sur Osman Nuhu Sharubutu; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Accra le 23 avril 1919 ou 1923, ses études à Kumasi, sa nomination comme imam régional adjoint en 1974 et comme grand imam national du Ghana en 1993, ses fondations caritatives et son rôle dans le travail pour la paix au Ghana."
  ur: "عثمان نوہو شروبتو پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 23 اپریل 1919 یا 1923 کو اکرا میں ان کی پیدائش، کماسی میں ان کی تعلیم، 1974 میں ڈپٹی ریجنل چیف امام کے طور پر ان کی تقرری اور 1993 میں گھانا کے قومی چیف امام کے طور پر، ان کی خیراتی بنیادوں اور قومی امن کے کاموں میں ان کے کردار کا ذکر ہے۔"
