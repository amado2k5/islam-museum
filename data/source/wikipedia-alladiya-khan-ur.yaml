  ar: "مقالة ويكيبيديا الأردية عن الله ديا خان؛ تُستخدم لوقائع الكيان فقط. تؤكد ولادته في 10 أغسطس 1855 في أنيارا واسمه عند الولادة غلام أحمد خان، وتعلّمه على يد عمه جهانغير خان، وإقامته في كولهابور حتى 1922 ثم بمبئی، ووفاته فيها في 16 مارس 1946. لا تذكر المقالة شيئا عن دينه."
  en: "Urdu Wikipedia article on Alladiya Khan; used for entity facts only. It confirms his birth on 10 August 1855 at Uniara, his birth name Ghulam Ahmad Khan, his training under his uncle Jehangir Khan, his Kolhapur years to 1922 and his death at Bombay on 16 March 1946. It makes no statement about his religion."
