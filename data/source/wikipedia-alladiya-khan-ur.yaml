summary:
  ar: "مقالة ويكيبيديا الأردية عن الله ديا خان؛ تُستخدم لوقائع الكيان فقط. تؤكد ولادته في 10 أغسطس 1855 في أنيارا واسمه عند الولادة غلام أحمد خان، وتعلّمه على يد عمه جهانغير خان، وإقامته في كولهابور حتى 1922 ثم بمبئی، ووفاته فيها في 16 مارس 1946. لا تذكر المقالة شيئا عن دينه."
  en: "Urdu Wikipedia article on Alladiya Khan; used for entity facts only. It confirms his birth on 10 August 1855 at Uniara, his birth name Ghulam Ahmad Khan, his training under his uncle Jehangir Khan, his Kolhapur years to 1922 and his death at Bombay on 16 March 1946. It makes no statement about his religion."
  es: "Artículo de Wikipedia en urdu sobre Alladiya Khan; se utiliza únicamente para datos biográficos. Confirma su nacimiento el 10 de agosto de 1855 en Uniara, su nombre de nacimiento Ghulam Ahmad Khan, su formación con su tío Jehangir Khan, su estancia en Kolhapur hasta 1922 y su fallecimiento en Bombay el 16 de marzo de 1946. No menciona su religión."
  fr: "L'article de Wikipédia en ourdou consacré à Alladiya Khan, utilisé uniquement à titre informatif, confirme sa naissance le 10 août 1855 à Uniara, son nom de naissance Ghulam Ahmad Khan, sa formation auprès de son oncle Jehangir Khan, ses années à Kolhapur jusqu'en 1922 et son décès à Bombay le 16 mars 1946. Il ne mentionne pas sa religion."
  ur: "علادیہ خان پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ تصدیق کرتا ہے کہ ان کی پیدائش 10 اگست 1855 کو اونیارہ میں ہوئی، اس کا پیدائشی نام غلام احمد خان، ان کے چچا جہانگیر خان کے زیر تربیت ان کی تربیت، 1922 تک کولہاپور اور 16 مارچ 1946 کو بمبئی میں ان کی موت۔"
