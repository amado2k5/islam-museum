summary:
  ar: "صفحة «الأشباه والنظائر في النحو» في ويكيبيديا العربية، وهي الصفحة الموثِّقة التي سماها ملخص بحثي قُدّم إلى المتحف للكتاب «الأشباه والنظائر في النحو»؛ لم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص دون إعادة تحقق في 21 نوفمبر 2026، في موضوع: نسبة الكتاب إلى مؤلفه وتاريخه."
  en: "The page \"الأشباه والنظائر في النحو\" on the Arabic Wikipedia, named by a research summary supplied to the museum as the documenting page for al-Ashbah wa-l-Naza'ir fi al-Nahw; the museum did not open the page, and the founder approved using the summary without re-verification on 21 November 2026, for the ascription of the work to its author and its date."
  ur: "عربی ویکیپیڈیا پر صفحہ «الأشباه والنظائر في النحو»، جسے عجائب گھر کو دیے گئے ایک تحقیقی خلاصے نے «الاشباہ و النظائر فی النحو» کا مستند صفحہ بتایا؛ عجائب گھر نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصے کے استعمال کی منظوری دی، موضوع: کتاب کی مصنف سے نسبت اور اس کی تاریخ۔"
  fr: "La page « الأشباه والنظائر في النحو » de Wikipédia (arabe), nommée par un résumé de recherche remis au musée comme page documentaire de al-Ashbah wa-l-Naza'ir fi al-Nahw ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé sans nouvelle vérification le 21 novembre 2026, pour l'attribution de l'ouvrage à son auteur et sa date."
  es: "La página «الأشباه والنظائر في النحو» de Wikipedia (en árabe), nombrada por un resumen de investigación entregado al museo como página documental de al-Ashbah wa-l-Naza'ir fi al-Nahw; el museo no abrió la página, y el fundador aprobó usar el resumen sin nueva verificación el 21 de noviembre de 2026, para la atribución de la obra a su autor y su fecha."
  tr: "Arapça Vikipedi'deki \"Dilbilgisinde Benzerlikler ve Karşılıklar\" sayfası, belgelenmiş sayfa olarak müzeye \"Dilbilgisinde Benzerlikler ve Karşılıklar\" kitabı için sunulan bir araştırma özeti olarak adlandırıldı; müze sayfayı açmadı ve kurucu, 21 Kasım 2026'da özetin yeniden doğrulama olmaksızın kullanılmasına izin verdi: kitabın yazarına ve tarihine atfedilmesi konusunda."
  id: "Halaman \"Kesamaan dan Padanan dalam Tata Bahasa\" di Wikipedia Arab, yang merupakan halaman terdokumentasi yang disebut ringkasan riset yang dikirim ke museum untuk buku \"Kesamaan dan Padanan dalam Tata Bahasa\"; museum tidak membuka halaman tersebut, dan pendiri mengizinkan penggunaan ringkasan tanpa verifikasi ulang pada 21 November 2026, dengan topik: atribusi buku kepada penulisnya dan sejarahnya."
