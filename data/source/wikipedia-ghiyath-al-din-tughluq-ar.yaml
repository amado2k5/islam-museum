summary:
  ar: "مقالة ويكيبيديا العربية عن غياث الدين تغلق ⁦(غازي ملك)⁩؛ تُستخدم لوقائع الكيان فقط. توثّق حكمه من 1320م/720هـ إلى 1325م/725هـ، ووفاته في أفغانبور سنة 725هـ بانهيار الفسطاط الخشبي المعدّ لاستقباله."
  en: "Arabic Wikipedia article on Ghiyath al-Din Tughluq (Ghazi Malik); used for entity facts only. It documents his reign from 1320 CE/720 AH to 1325/725 and his death at Afghanpur in 725 AH when the wooden reception pavilion collapsed."
  es: "Artículo de Wikipedia en árabe sobre Ghiyath al-Din Tughluq (Ghazi Malik); utilizado únicamente para datos sobre la persona. Documenta su reinado desde 1320 d. C./720 d. H. hasta 1325/725 d. H. y su muerte en Afghanpur en 725 d. H., cuando se derrumbó el pabellón de recepción de madera."
  fr: "Article de Wikipédia en arabe sur Ghiyath al-Din Tughluq (Ghazi Malik); utilisé uniquement à des fins d’information sur l’entité. Il documente son règne de 1320 EC/720 AH à 1325/725 et sa mort à Afghanpur en 725 AH lors de l’effondrement du pavillon de réception en bois."
  ur: "غیاث الدین تغلق ⁦(غازی ملک)⁩ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1320 عیسوی/720 ہجری سے 1325/725 تک اس کے دور حکومت اور 725 ہجری میں افغان پور میں اس کی موت کا دستاویز کرتا ہے جب لکڑی کا استقبالیہ منڈپ گر گیا۔"
  tr: "Ghayath al-Din hakkında Arapça Vikipedi makalesi kapalıdır (Ghazi Malik); yalnızca varlığın gerçekleri için kullanılır. Saltanatı 1320 MS/720 Hicri ile 1325 M.S. 725 H arasında belgelenmiştir ve 725 Hicri yıllarında Afganistan'da kendisini karşılamak için hazırlanan ahşap fustatın çökmesi nedeniyle ölmüştür."
  id: "Artikel Wikipedia bahasa Arab tentang Ghayath al-Din ditutup (Ghazi Malik); hanya digunakan untuk fakta entitas. Masa pemerintahannya terdokumentasi dari tahun 1320 M/720 H hingga 1325 M/725 H, dan kematiannya di Afghanistan pada 725 H akibat runtuhnya fustat kayu yang disiapkan untuk menyambutnya."
