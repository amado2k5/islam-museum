summary:
  ar: "الجزء الأول من «شرح مشكل الآثار» للطحاوي، حققه شعيب الأرنؤوط وخرّج أحاديثه ووضع فهارسه، ويصدر عن مؤسسة الرسالة ⁦(الطبعة الثانية 1427هـ / 2006م؛ الطبعة الثالثة 1431هـ / 2010م)⁩؛ ويرجع إليه هذا السجل بأرقام صفحات المسح."
  en: "Volume one of al-Tahawi's Sharh mushkil al-athar, edited and graded by Shu'ayb al-Arna'ut (Al-Risala; second edition 1427 AH / 2006 CE, third edition 1431 AH / 2010 CE); this record cites its scan pages."
  es: "Volumen uno de Sharh mushkil al-athar de al-Tahawi, editado y clasificado por Shu'ayb al-Arna'ut (Al-Risala; segunda edición 1427 AH / 2006 CE, tercera edición 1431 AH / 2010 CE); este registro cita sus páginas escaneadas."
  fr: "Volume un du Sharh mushkil al-athar d'al-Tahawi, édité et classé par Shu'ayb al-Arna'ut (Al-Risala; deuxième édition 1427 AH / 2006 CE, troisième édition 1431 AH / 2010 CE); cette notice cite ses pages numérisées."
  ur: "الطحاوی کی شرح مشکیل الاطہر میں سے ایک جلد، شعیب الارناوت کی طرف سے ترمیم اور درجہ بندی ⁦(الرسالہ؛ دوسرا ایڈیشن 1427 ہجری / 2006 عیسوی، تیسرا ایڈیشن 1431 ہجری / 2010 عیسوی)⁩؛ یہ ریکارڈ اس کے اسکین صفحات کا حوالہ دیتا ہے۔"
  tr: "Al-Tahawi'nin 'Şerh Müşkil el-Athar' adlı eserinin ilk bölümü, Shu'ayb al-Arna'ut tarafından düzenlenmiştir; hadisleri çıkarılıp indekslenmiştir ve Al-Risalah Vakfı tarafından yayımlanmıştır (ikinci baskı 1427 Hicri / 2006 M.S; üçüncü baskı 1431 Hicri / 2010 M.S.); bu kayıt, anketten sayfa numaralarıyla referans alınmıştır."
  id: "Bagian pertama dari 'Sharh Mushkil al-Athar' oleh Al-Tahawi, disunting oleh Shu'ayb al-Arna'ut, yang haditsnya diekstrak dan diindeks, dan diterbitkan oleh Yayasan Al-Risalah (edisi kedua 1427 H / 2006 M; edisi ketiga 1431 H / 2010 M); catatan ini dirujuk dengan nomor halaman dari survei."
