  en: "Tarikh Madinat Dimashq — Ibn Asakir, ed. Umar ibn Gharama al-Amrawi, Dar al-Fikr 1415 AH, vol. 5"
summary:
  ar: "الجزء الخامس من «تاريخ مدينة دمشق وذكر فضلها وتسمية من حلها من الأماثل أو اجتاز بنواحيها من واردها وأهلها» لابن عساكر علي بن الحسن بن هبة الله الشافعي ⁦(499–571هـ)⁩، دراسة وتحقيق محب الدين أبي سعيد عمر بن غرامة العمروي، دار الفكر، بيروت، 1415هـ/1995م. يحوي تراجم من اسمه أحمد، من أحمد بن عتبة بن مكين إلى أواخر من اسمه أحمد بن محمد، ومنها ترجمة أحمد بن حنبل الطويلة."
  en: "Volume 5 of Ibn Asakir's (Ali ibn al-Hasan ibn Hibat Allah al-Shafi'i, 499–571 AH) History of the City of Damascus, study and edition by Muhibb al-Din Abu Sa'id Umar ibn Gharama al-Amrawi, Dar al-Fikr, Beirut, 1415 AH / 1995 CE. It holds entries for men named Ahmad, from Ahmad ibn Utba ibn Makin to the later Ahmad ibn Muhammads, including the long entry on Ahmad ibn Hanbal."
