summary:
  ar: "مدخل «لوند» في موسوعة TDV الإسلامية: اللوند جندي البحرية العثمانية في السفن الحربية من القرن الخامس عشر، وأعداد اللوندين في كل سفينة وضبطهم بالكفلاء وثكنات لوند في إسطنبول، ثم لوند البرّ وأزمتهم الاجتماعية حتى إلغاء الصفة."
  en: "The TDV İslâm Ansiklopedisi entry on the levent: the Ottoman naval soldier of the war fleets from the fifteenth century, the number of levents carried on each ship type, their discipline by sureties and the Levent barracks of Istanbul, then the land levents and their social crisis until the status was abolished."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el levent: el soldado naval otomano de las flotas de guerra desde el siglo XV, el número de levents que se transportaban en cada tipo de barco, su disciplina por parte de los fiadores y los cuarteles de levents de Estambul, luego los levents terrestres y su crisis social hasta que se abolió su estatus."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le levent: le soldat de la marine ottomane des flottes de guerre à partir du XVe siècle, le nombre de levents embarqués sur chaque type de navire, leur discipline par des cautions et les casernes de levents d'Istanbul, puis les levents terrestres et leur crise sociale jusqu'à l'abolition du statut."
  ur: "لیونٹ پر TDV İslâm Ansiklopedisi اندراج: پندرہویں صدی سے جنگی بیڑے کے عثمانی بحریہ کے سپاہی، ہر قسم کے بحری جہاز پر لیوینٹ کی تعداد، ضامنوں کے ذریعے ان کا نظم و ضبط اور استنبول کی لیونٹ بیرکیں، پھر زمینی لیونٹ اور ان کا سماجی بحران جب تک اس حیثیت کو ختم نہیں کیا جاتا۔"
  tr: "İslami TDV Ansiklopedisi'nde 'Lund' adının kaydı: Lund, on beşinci yüzyıldan itibaren Osmanlı donanmasının savaş gemilerinde görev yapan bir askerdi; her gemideki Lund sayısı ve kefil olarak kayıtları, ardından İstanbul'daki Lund kışlası, ardından kara Lund ve statü kaldırılana kadar sosyal krizi yaşandı."
  id: "Entri 'Lund' dalam Ensiklopedia TDV Islam: Lund adalah seorang prajurit angkatan laut Ottoman yang naik kapal perang sejak abad kelima belas, jumlah Lund di setiap kapal dan pendaftaran mereka sebagai penjamin, serta barak Lund di Istanbul, kemudian tanah Lund dan krisis sosial mereka sampai status tersebut dihapuskan."
