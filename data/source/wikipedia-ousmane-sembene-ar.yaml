reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). A stub-length article: its infobox gives birth on 1 January 1923 at Ziguinchor and death on 9 June 2007 at Dakar with burial at Yoff, while its text gives the birth as 8 January 1923 — the variant is recorded in the person record. Its awards list (Legion of Honour, officer, 2006; Carrosse d'Or 2005; Un Certain Regard 2004; Grand prix littéraire d'Afrique noire 1997; Prix Jean Vigo and Tanit d'or 1966) is imported from Wikidata by bot, as the article itself notes. Read in full on 24 October 2026."
