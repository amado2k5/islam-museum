summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرشيد علي شرماركي (عنوانها الحالي بصيغة «Abdirashid Shermarke»)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في 8 يونيو 1919 في حررطيري ونشأته في مقديشو ودراسته في المدارس القرآنية صبيا، ورئاسته الوزراء (1960–1964) ثم الرئاسة (1967–1969)، واغتياله في لاس عانود في 15 أكتوبر 1969؛ ولا تسمي مذهبا له."
  en: "English Wikipedia article on Abdirashid Ali Shermarke (its current title spells the name 'Abdirashid Shermarke'); used for entity facts only. It recounts his birth on 8 June 1919 at Harardhere, his upbringing in Mogadishu and attendance at Qur'anic schools as a boy, his premiership (1960–1964) and presidency (1967–1969), and his assassination at Las Anod on 15 October 1969. It names no school for him."
