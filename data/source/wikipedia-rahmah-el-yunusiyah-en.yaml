  ar: "مقالة ويكيبيديا الإنجليزية عن رحمة اليونسية؛ تُستخدم لوقائع الكيان فقط. تروي تأسيسها مدرسة دينية بوتري للبنات سنة 1923 في بادانغ بانجانغ، وسجنها قبل الاستقلال وعضويتها في مجلس الشعب الاستشاري عن حزب ماشومي، ووفاتها سنة 1969."
  en: "English Wikipedia article on Rahmah el Yunusiyah; used for entity facts only. It recounts her founding of the Diniyah Putri girls' school in 1923 at Padang Panjang, her imprisonment before independence and her seat in the People's Consultative Assembly for the Masyumi Party, and her death in 1969."
  es: "Artículo de la Wikipedia en inglés sobre Rahmah el Yunusiyah; utilizado únicamente para obtener información sobre la persona. Relata la fundación de la escuela para niñas Diniyah Putri en 1923 en Padang Panjang, su encarcelamiento antes de la independencia, su escaño en la Asamblea Consultiva del Pueblo por el Partido Masyumi y su fallecimiento en 1969."
  fr: "Article de Wikipédia en anglais sur Rahmah el Yunusiyah; utilisé uniquement à des fins d'information sur l'entité. Il relate la fondation par cette dernière de l'école de filles Diniyah Putri en 1923 à Padang Panjang, son emprisonnement avant l'indépendance et son siège à l'Assemblée consultative du peuple pour le parti Masyumi, ainsi que sa mort en 1969."
