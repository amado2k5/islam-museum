summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أكبر الباكر، الرئيس التنفيذي السابق للخطوط الجوية القطرية (1997–2023)؛ تذكر مولده سنة 1962 في الدوحة، ودراسته في بانشغاني ومومباي، وقيادته تطوير مطار حمد الدولي، ورئاسته هيئة قطر للسياحة حتى أكتوبر 2023."
  en: "English Wikipedia article on Akbar Al Baker, the former CEO of Qatar Airways (1997–2023); it gives his birth in 1962 in Doha, his schooling in Panchgani and Mumbai, his leadership of the Hamad International Airport development, and his chairmanship of Qatar Tourism until October 2023."
  es: "Artículo en inglés de la Wikipedia sobre Akbar Al Baker, ex director ejecutivo de Qatar Airways (1997-2023); en él se indica que nació en 1962 en Doha, que estudió en Panchgani y Bombay, que lideró el desarrollo del Aeropuerto Internacional Hamad y que presidió Qatar Tourism hasta octubre de 2023."
  fr: "Article de Wikipédia en anglais sur Akbar Al Baker, l'ancien PDG de Qatar Airways (1997-2023); il indique sa naissance en 1962 à Doha, sa scolarité à Panchgani et à Mumbai, son rôle à la tête du développement de l'aéroport international Hamad et sa présidence de Qatar Tourism jusqu'en octobre 2023."
  ur: "قطر ایئرویز کے سابق سی ای او اکبر البکر پر انگریزی ویکیپیڈیا کا مضمون (1997–2023)؛ یہ 1962 میں دوحہ میں ان کی پیدائش، پنچگنی اور ممبئی میں ان کی اسکولنگ، حماد بین الاقوامی ہوائی اڈے کی ترقی کی قیادت، اور اکتوبر 2023 تک قطر ٹورازم کی ان کی سربراہی کرتی ہے۔"
  tr: "Akbar Al Baker (1997–2023) hakkında İngilizce Wikipedia makalesi, 1962'de Doha'da doğduğundan, Panshgani ve Mumbai'deki eğitimlerinden, Hamad Uluslararası Havalimanı'nın geliştirilmesindeki liderliğinden ve Ekim 2023'e kadar Katar Turizm Otoritesi başkanlığından bahsetmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Akbar Al Baker, mantan CEO Qatar Airways (1997–2023); menyebutkan kelahirannya pada tahun 1962 di Doha, studinya di Panshgani dan Mumbai, kepemimpinannya dalam pengembangan Bandara Internasional Hamad, serta kepresidenannya di Qatar Tourism Authority hingga Oktober 2023."
