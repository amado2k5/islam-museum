summary:
  ar: "مقالة ويكيبيديا العربية عن سيلو دالين ديالو؛ بذرة قصيرة تُستخدم لوقائع الكيان فقط. تسمّيه اقتصاديا وسياسيا غينيا من لابي من شعب الفولاني، خريج جامعة كوناكري، وتشير إلى رئاسته الوزراء. لا تذكر دينه. تحمل في مطلعها تاريخ وفاة ⁦(3 مارس 2019)⁩ وهو خطأ: فالمقالة الإنجليزية وويكيداتا لا يذكران وفاة، وكان نشطا سياسيا حتى 2021، فلم يُستخدم ذلك التاريخ."
  en: "Arabic Wikipedia article on Cellou Dalein Diallo; a short stub used for entity facts only. It names him a Guinean economist and politician from Labé, of the Fula people, a University of Conakry alumnus, and notes his premiership. It says nothing about his religion. Its lead carries a death date (3 March 2019) which is an error — the English article and Wikidata record no death and he was politically active through 2021 — so that date is not used."
  es: "Artículo en árabe de la Wikipedia sobre Cellou Dalein Diallo; un breve esbozo utilizado únicamente para datos sobre la persona. Lo describe como un economista y político guineano de Labé, perteneciente al pueblo Fula, exalumno de la Universidad de Conakry, y menciona su cargo como primer ministro. No dice nada sobre su religión. El texto inicial incluye una fecha de fallecimiento (3 de marzo de 2019), lo cual es erróneo: el artículo en inglés y Wikidata no registran su muerte y se mantuvo políticamente activo hasta 2021; por lo tanto, esa fecha no se utiliza."
  fr: "Article Wikipédia en arabe sur Cellou Dalein Diallo; une brève ébauche servant uniquement à fournir des informations factuelles. Il est présenté comme un économiste et homme politique guinéen originaire de Labé, appartenant à l’ethnie peule, ancien élève de l’université de Conakry, et mentionne son mandat de Premier ministre. L’article ne dit rien de sa religion. Son introduction indique une date de décès (3 mars 2019), ce qui est erroné: l’article en anglais et Wikidata ne font état d’aucun décès et il était politiquement actif jusqu’en 2021. Cette date n’est donc pas utilisée."
  ur: "Cellou Dalein Diallo پر عربی ویکیپیڈیا مضمون؛ ایک مختصر سٹب صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ اس نے اسے گنی کے ایک ماہر اقتصادیات اور فلا کے لوگوں کے لیبی سے سیاست دان کا نام دیا ہے، جو کوناکری یونیورسٹی کے سابق طالب علم ہیں، اور ان کی پریمیئر شپ کو نوٹ کرتے ہیں۔ یہ اس کے مذہب کے بارے میں کچھ نہیں کہتا۔ اس کے لیڈ میں موت کی تاریخ ⁦(3 مارچ 2019)⁩ ہے جو کہ ایک غلطی ہے — انگریزی مضمون اور Wikidata میں کوئی موت درج نہیں ہے اور وہ 2021 تک سیاسی طور پر سرگرم تھا — اس لیے اس تاریخ کو استعمال نہیں کیا گیا ہے۔"
  tr: "Silo Dalin Diallo hakkında Arapça Vikipedi makalesi; sadece varlığın gerçekleri için kullanılan kısa bir taslak. Onu Labi'den bir Fulani halkından bir Gineli ekonomist ve politikacı olarak tanımlıyor, Conakry Üniversitesi mezunu ve başbakanlığına atıfta bulunuyor. Dini belirtilmemektedir. Başında ölüm tarihi (3 Mart 2019) yer alır, ki bu yanlıştır: İngilizce makale ve Wikidata ölümden bahsetmez ve 2021'e kadar siyasi olarak aktifti, bu yüzden bu tarih kullanılmamıştır."
  id: "Artikel Wikipedia berbahasa Arab tentang Silo Dalin Diallo; sebuah stub singkat yang hanya digunakan untuk fakta entitas. Artikel tersebut menyebutnya sebagai ekonom dan politisi dari Guinea dari Labi dari suku Fulani, lulusan Universitas Conakry, dan merujuk pada masa jabatannya. Artikel tersebut tidak menyebutkan agamanya. Artikel tersebut mencantumkan tanggal kematian (3 Maret 2019) di awal, yang tidak benar: artikel bahasa Inggris dan Wikidata tidak menyebutkan kematian, dan ia aktif secara politik hingga 2021, sehingga tanggal itu tidak digunakan."
