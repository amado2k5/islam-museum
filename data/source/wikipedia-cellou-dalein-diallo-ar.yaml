summary:
  ar: "مقالة ويكيبيديا العربية عن سيلو دالين ديالو؛ بذرة قصيرة تُستخدم لوقائع الكيان فقط. تسمّيه اقتصاديا وسياسيا غينيا من لابي من شعب الفولاني، خريج جامعة كوناكري، وتشير إلى رئاسته الوزراء. لا تذكر دينه. تحمل في مطلعها تاريخ وفاة (3 مارس 2019) وهو خطأ: فالمقالة الإنجليزية وويكيداتا لا يذكران وفاة، وكان نشطا سياسيا حتى 2021، فلم يُستخدم ذلك التاريخ."
  en: "Arabic Wikipedia article on Cellou Dalein Diallo; a short stub used for entity facts only. It names him a Guinean economist and politician from Labé, of the Fula people, a University of Conakry alumnus, and notes his premiership. It says nothing about his religion. Its lead carries a death date (3 March 2019) which is an error — the English article and Wikidata record no death and he was politically active through 2021 — so that date is not used."
