reliability_note: "Community-edited encyclopedia article (a short entry), retrieved in full at the stated revision. It supplies his kunya, Abu Abd Allah — the attestation that settles the identity question in the record: the queue's 'Abu Yaqub Yusuf al-Warraq' garbles his name, since Yusuf is his father and his own kunya is Abu Abd Allah. It gives his birth in 904 at Wadi al-Hijara (Guadalajara), his upbringing in Kairouan, his death at Cordoba in 973, his standing with the caliph al-Mustansir (al-Hakam II), his great book 'Ifriqiya and its kingdoms' and his works on Tahert, Oran, Ténès and Sijilmasa, and the preservation of his material by al-Bakri and in fragments by Ibn Idhari."
