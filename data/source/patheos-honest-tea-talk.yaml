summary:
  ar: "صفحة بودكاست «Honest Tea Talk» على باثيوس، تحمل وصف البرنامج بقلم أصحابه: «مع عالية ولاينكا وسمية» — ثلاث مسلمات أسسن منصة للحديث الصريح عن قضايا النساء المسلمات والمجتمع، مستوحاة من برنامج «Red Table Talk» — وأرشيف حلقاته من 2019 إلى موسمه الرابع."
  en: "The Patheos podcast page for Honest Tea Talk, carrying the show's own description — 'with Aliyah, LaYinka & Sumayah', three Muslim women who set up a platform, inspired by Red Table Talk, for open discussion of matters concerning Muslim women and the wider community — and its episode archive from 2019 through its fourth season."
  es: "La página del podcast Honest Tea Talk en Patheos incluye la descripción del programa —\"con Aliyah, LaYinka y Sumayah\", tres mujeres musulmanas que crearon una plataforma, inspirada en Red Table Talk, para el debate abierto sobre temas que conciernen a las mujeres musulmanas y a la comunidad en general— y su archivo de episodios desde 2019 hasta su cuarta temporada."
  fr: "La page du podcast Patheos pour Honest Tea Talk, contenant la description de l'émission elle-même — « avec Aliyah, LaYinka et Sumayah », trois femmes musulmanes qui ont créé une plateforme, inspirée de Red Table Talk, pour une discussion ouverte sur les questions concernant les femmes musulmanes et la communauté au sens large — et ses archives d'épisodes de 2019 jusqu'à sa quatrième saison."
