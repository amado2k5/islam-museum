summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن القاضي سيد محمود؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في دلهي في 24 مايو 1850 ووفاته في سيتابور في 8 مايو 1903، وكونه الابن الثاني لسيد أحمد خان، ودراسته في إنجلترا ودعوته إلى نقابة المحاماة سنة 1872، وقضاءه في محكمة الله آباد العليا (1887-1893) بوصفه أول قاضٍ مسلم في محكمة عليا في الهند البريطانية، ودوره في تأسيس الكلية الشرقية الأنجلو-محمدية، وأحكامه المنشورة."
  en: "English Wikipedia article on Justice Syed Mahmood; used for entity facts only. It records his birth in Delhi on 24 May 1850 and death at Sitapur on 8 May 1903, that he was the second son of Syed Ahmad Khan, his studies in England and call to the Bar in 1872, his judgeship of the Allahabad High Court (1887–1893) as the first Muslim High Court judge in British India, his role in founding the Muhammadan Anglo-Oriental College, and his published judgments."
