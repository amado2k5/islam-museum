summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن القاضي سيد محمود؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في دلهي في 24 مايو 1850 ووفاته في سيتابور في 8 مايو 1903، وكونه الابن الثاني لسيد أحمد خان، ودراسته في إنجلترا ودعوته إلى نقابة المحاماة سنة 1872، وقضاءه في محكمة الله آباد العليا (1887-1893) بوصفه أول قاضٍ مسلم في محكمة عليا في الهند البريطانية، ودوره في تأسيس الكلية الشرقية الأنجلو-محمدية، وأحكامه المنشورة."
  en: "English Wikipedia article on Justice Syed Mahmood; used for entity facts only. It records his birth in Delhi on 24 May 1850 and death at Sitapur on 8 May 1903, that he was the second son of Syed Ahmad Khan, his studies in England and call to the Bar in 1872, his judgeship of the Allahabad High Court (1887–1893) as the first Muslim High Court judge in British India, his role in founding the Muhammadan Anglo-Oriental College, and his published judgments."
  es: "Artículo de la Wikipedia en inglés sobre el juez Syed Mahmood; utilizado únicamente para datos biográficos. En él se registra su nacimiento en Delhi el 24 de mayo de 1850 y su fallecimiento en Sitapur el 8 de mayo de 1903, que fue el segundo hijo de Syed Ahmad Khan, sus estudios en Inglaterra y su admisión al Colegio de Abogados en 1872, su cargo como juez del Tribunal Superior de Allahabad (1887-1893) como el primer juez musulmán del Tribunal Superior en la India británica, su papel en la fundación del Colegio Anglo-Oriental Muhammadano y sus sentencias publicadas."
  fr: "Article de Wikipédia en anglais sur le juge Syed Mahmood; utilisé uniquement pour les informations relatives à l’entité. Il relate sa naissance à Delhi le 24 mai 1850 et son décès à Sitapur le 8 mai 1903, qu’il était le deuxième fils de Syed Ahmad Khan, ses études en Angleterre et son admission au barreau en 1872, son poste de juge à la Haute Cour d’Allahabad (1887-1893) en tant que premier juge musulman de la Haute Cour de l’Inde britannique, son rôle dans la fondation du Muhammadan Anglo-Oriental College et ses jugements publiés."
  ur: "جسٹس سید محمود پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 24 مئی 1850 کو دہلی میں اور وفات 8 مئی 1903 کو سیتا پور میں درج ہے کہ وہ سید احمد خان کے دوسرے بیٹے تھے، ان کی تعلیم انگلینڈ میں ہوئی اور 1872 میں بار میں کال کی، ان کی الہ آباد ہائی کورٹ کی جج شپ (1887-1893) برٹش انڈیا میں پہلے مسلم ہائی کورٹ کے جج کے طور پر، ان کی انجمن محمدی کالج کی بنیاد رکھنے میں ان کا کردار۔"
