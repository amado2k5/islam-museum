reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. It gives his birth on 26 April 1779 (infobox and text) — the Arabic and Urdu articles and Wikidata give 29 April 1779 for the same Hijri date — his education at Madrasah-i Rahimiyah, his death at Balakot on 6 May 1831, and his works Taqwiyat al-Iman and Sirat al-Mustaqim. Its lead calls him a Sunni scholar, Naqshbandi Sufi reformer and Hanafi jurist, each description referenced to a published book; its Jurisprudence section records that he has been identified varyingly as a Hanafi or as a ghayr muqallid, that it has been argued he repudiated taqlid, and that Ashraf Ali Thanwi cited him as performing raf' al-yadayn, a practice alien to the Hanafi school."
