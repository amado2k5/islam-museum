summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشاه إسماعيل الدهلوي؛ تُستخدم لوقائع الكيان فقط. تروي حياته بوصفه عالمًا سنيًا ومصلحًا صوفيًا نقشبنديًا وفقيهًا حنفيًا، وشريكًا مؤسسًا مع سيد أحمد بريلوي في حركة «الطريقة المحمدية»، وقتله في بالاكوت سنة 1831، وتسجّل الخلاف في تراثه الفقهي بين من عده حنفيًا ومن عده غير مقلد."
  en: "English Wikipedia article on Shah Ismail Dehlvi; used for entity facts only. It presents him as a Sunni scholar, Naqshbandi Sufi reformer and Hanafi jurist, co-founder with Syed Ahmad Barelvi of the Tariqah-i-Muhammadiyah movement, killed at Balakot in 1831, and records the dispute over his legal allegiance between those who identify him as a Hanafi and those who identify him as a ghayr muqallid."
