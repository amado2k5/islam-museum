summary:
  ar: "مقالة ويكيبيديا العربية عن فارس الخوري؛ تُستخدم لوقائع الكيان فقط. تعطي سنيه 1877–1962، وتروي أصل عائلته الأرثوذكسي الشرقي واعتناق جدّه لأبيه البروتستانتية، وتصفه بأنه أول مسيحي يعتلي سدة السلطة التشريعية في سوريا، ويعطي صندوق معلوماتها مذهبه البروتستانتية. وتتناول أدواره التأسيسية في وزارة المالية السورية وكلية الحقوق بدمشق ووفد سوريا إلى الأمم المتحدة سنة 1945."
  en: "Arabic Wikipedia article on Fares al-Khoury; used for entity facts only. It gives his years as 1877–1962, recounts his family's Eastern Orthodox origin and his paternal grandfather's adoption of Protestantism, calls him the first Christian to head the legislative authority in Syria, and gives his denomination in its infobox as Protestantism. It covers his founding roles in the Syrian finance ministry, the Damascus law faculty and the United Nations delegation of 1945."
