  ar: مقالة ويكيبيديا العربية عن إبراهيم رسول؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 15 يوليو 1962 في المنطقة السادسة بكيب تاون، ودراسته ودرجاته من جامعة كيب تاون، ومناصبه الإقليمية منذ 1994، ورئاسته لحكومة المقاطعة (2004–2008)، وسفارته (2010–2015) وإبعاده سنة 2025 بوصفه شخصًا غير مرغوب فيه.
  en: Arabic Wikipedia article on Ebrahim Rasool; used for entity facts only. It gives his birth on 15 July 1962 in District Six, Cape Town, his schooling and University of Cape Town degrees, his provincial posts from 1994, his premiership (2004–2008), his ambassadorship (2010–2015) and his 2025 removal as persona non grata.
  es: "Artículo en árabe de la Wikipedia sobre Ebrahim Rasool; utilizado únicamente para datos sobre la persona. En él se indica su fecha de nacimiento, el 15 de julio de 1962, en el Distrito Seis de Ciudad del Cabo, su formación académica y sus títulos universitarios en la Universidad de Ciudad del Cabo, sus cargos provinciales desde 1994, su mandato como primer ministro (2004-2008), su etapa como embajador (2010-2015) y su declaración de persona non grata en 2025."
  fr: "Article de Wikipédia en arabe sur Ebrahim Rasool; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 15 juillet 1962 dans le district 6 du Cap, sa scolarité et ses diplômes de l’Université du Cap, ses postes provinciaux à partir de 1994, son mandat de Premier ministre (2004-2008), son mandat d’ambassadeur (2010-2015) et sa destitution en 2025 en tant que persona non grata."
