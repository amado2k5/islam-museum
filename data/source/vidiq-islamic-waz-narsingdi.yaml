reliability_note: "Platform statistics aggregator, not a museum-verified fact: the figure of 2,350,000 subscribers (about 301 million total views, 4,539 videos) was read from vidIQ on 8 November 2026 and is used only as a dated audience figure. The page ranks the channel #264 in Bangladesh by subscribers; the channel is a Narsingdi-based waz aggregator whose catalogue carries heavy carriage of Mizanur Rahman Azhari mahfils, with January 2025 mahfil videos at 0.7–1.2 million views. No channel creation date was captured in this pass, so none is asserted. The page names no owner, head or operator for the channel. vidIQ's estimated earnings are modelled and are not used."
