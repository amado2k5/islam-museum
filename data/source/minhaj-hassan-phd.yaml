label: { en: "Minhaj-ul-Quran — 'Hassan Mohi-ud-Din Qadri completes his PhD thesis from Arab League University' (2012)" }
summary:
  ar: "تقرير منهاج القرآن عن إتمام حسن محي الدين قادري — رئيس المجلس الأعلى للمنظمة والابن الأكبر لمحمد طاهر القادري — أطروحة الدكتوراه في جامعة الدول العربية، ومناقشتها في 3 نوفمبر 2012."
  en: "Minhaj-ul-Quran's report that Hassan Mohi-ud-Din Qadri — President of MQI's Supreme Council and elder son of Muhammad Tahir-ul-Qadri — completed his PhD at Arab League University, with the viva on 3 November 2012."
  es: "Según informa Minhaj-ul-Quran, Hassan Mohi-ud-Din Qadri, presidente del Consejo Supremo de MQI e hijo mayor de Muhammad Tahir-ul-Qadri, completó su doctorado en la Universidad de la Liga Árabe, defendiendo la tesis el 3 de noviembre de 2012."
  fr: "Minhaj-ul-Quran rapporte que Hassan Mohi-ud-Din Qadri — président du Conseil suprême du MQI et fils aîné de Muhammad Tahir-ul-Qadri — a terminé son doctorat à l'Université de la Ligue arabe, avec la soutenance le 3 novembre 2012."
  ur: "منہاج القرآن کی رپورٹ کے مطابق حسن محی الدین قادری - صدر MQI کی سپریم کونسل اور محمد طاہر القادری کے بڑے صاحبزادے - نے 3 نومبر 2012 کو وائیوا کے ساتھ عرب لیگ یونیورسٹی سے پی ایچ ڈی مکمل کی۔"
  tr: "Örgüt Yüksek Konseyi Başkanı ve Muhammed Tahir El-Qadri'nin en büyük oğlu Hassan Mohieddin Qadri hakkında Kur'an Müfredat Raporu, Arap Ligi'nde doktora tezini tamamlayan ve 3 Kasım 2012'de tartışıyor."
  id: "Laporan Kurikulum Al-Qur'an tentang Hassan Mohieddin Qadri — Ketua Dewan Tertinggi Organisasi dan putra sulung Muhammad Tahir Al-Qadri — menyelesaikan disertasi doktoralnya di Liga Arab dan membahasnya pada 3 November 2012."
