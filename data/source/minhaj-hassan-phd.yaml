reliability_note: "The organisation's own news report, read in full on 5 November 2026; a first-party source. Its first sentence is the attestation used for his child_of relation: 'Sahibzada Hassan Mohi-ud-Din Qadri, President of MQI's Supreme Council and elder son of Shaykh-ul-Islam Dr Muhammad Tahir-ul-Qadri, has completed his PhD from Arab League University. His viva voce was conducted on November 3, 2012.' It gives the thesis subject as 'Constitution of Medina and Modern Constitutional Principles (A Comparative and Analytical Study)', written in Arabic at around 800 pages, supervised by Dr Yahya al-Jamal. A companion Minhaj report of the degree's conferral repeats the elder-son wording."
