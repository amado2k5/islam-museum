  ar: "صفحة أرشيف موقع عرب خبر لتقاريرها عن سعد الدين الهلالي؛ تُستخدم لوقائع محددة منقولة عنها: قوله إن الأزهر ولي الأمر في الأمانة العلمية لا في الدين، ورده الهاتفي على قناة الحدث على تبرؤ الأزهر من رأيه في الميراث، وتقارير الدعوى القضائية المرفوعة ضده."
  en: "arabkhabar.com's tag archive of its reports on Saad El-Din El-Hilali; used for specific items reported there: his statement that Al-Azhar is guardian of the scholarly trust, not of religion itself, his Al-Hadath phone-in response to Al-Azhar's disavowal of his inheritance opinion, and reports of the lawsuit filed against him."
