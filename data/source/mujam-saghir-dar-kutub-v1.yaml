summary:
  ar: "طبعة دار الكتب العلمية ببيروت ⁦(1403هـ/1983م)⁩ للجزء الأول من المعجم الصغير للحافظ سليمان بن أحمد الطبراني، ويليه «غنية الألمعي» للعلامة شمس الحق العظيم آبادي؛ يضم أحاديث الشيوخ من باب الألف إلى باب الكاف في ترتيب أسماء الشيوخ."
  en: "Dar al-Kutub al-Ilmiyya, Beirut (1403 AH / 1983 CE), vol. 1 of al-Tabarani's al-Mu'jam al-Saghir, followed by the treatise Ghunyat al-Alma'i by Shams al-Haqq al-Azimabadi. The volume covers the shaykhs arranged by name, from the letter alif to kaf."
  es: "Dar al-Kutub al-Ilmiyya, Beirut (1403 d. H. / 1983 d. C.), vol. 1 de al-Mu'jam al-Saghir de al-Tabarani, seguido del tratado Ghunyat al-Alma'i de Shams al-Haqq al-Azimabadi. El volumen cubre a los shaykhs ordenados por nombre, desde la letra alif hasta kaf."
  fr: "Dar al-Kutub al-Ilmiyya, Beyrouth (1403 AH / 1983 CE), vol. 1 de al-Mu'jam al-Saghir d'al-Tabarani, suivi du traité Ghunyat al-Alma'i de Shams al-Haqq al-Azimabadi. Le volume couvre les cheikhs classés par nom, de la lettre alif à kaf."
  ur: "دار الکتب العلمیہ، بیروت ⁦(1403ھ / 1983 عیسوی)⁩، جلد 1۔ الطبرانی کی المعجم الصغیر کا 1، اس کے بعد شمس الحق العظیم آبادی کا مقالہ غنیۃ العلمی ہے۔ یہ حجم خط الف سے لے کر کہف تک شیخوں کے نام کے ساتھ ترتیب دیا گیا ہے۔"
  tr: "Hafız Süleyman bin Ahmed al-Tabarani tarafından yazılmış Beyrut'taki Dar al-Kutub al-Ilmiyya'nın (1403 Hicri / 1983 M.S.) Dar al-Kutub al-Ilmiyya'nın baskısı, ardından alim Şems el-Hak el-Azim Abadi'nin 'Ghaniyya al-Alma'i' adlı eseri gelir; şeyhlerin isimlerini düzenlerken elif resiminden Kaf bölümüne kadar şeyhlerin hadislerini içerir."
  id: "Edisi Dar al-Kutub al-Ilmiyya di Beirut (1403 H / 1983 M) dari bagian pertama Al-Mu'jam al-Saghir oleh hafiz Sulayman ibn Ahmad al-Tabarani, diikuti oleh 'Ghaniyya al-Alma'i' oleh ulama Shams al-Haq al-Azim Abadi; ini mencakup hadits para sheikh dari bab alif hingga bab kaf dalam menyusun nama-nama sheikh."
