summary:
  ar: "مقالة ويكيبيديا الأذربيجانية عن عليمردان بك توبتشوباشوف؛ تُستخدم لوقائع الكيان فقط. أطول المقالات عنه، وتروي حياته من تفليس إلى بطرسبورغ وباكو وباريس، وأدواره في دوما الدولة وفي جمهورية أذربيجان الديمقراطية. صدرها يعطي ميلاده في 4 مايو 1862 في تفليس ووفاته في 8 نوفمبر 1934."
  en: "Azerbaijani Wikipedia article on Alimardan bey Topchubashov; used for entity facts only. The longest of the articles on him, tracing his life from Tiflis to St Petersburg, Baku and Paris and his roles in the State Duma and the Azerbaijan Democratic Republic. Its lead gives his birth as 4 May 1862 at Tiflis and his death as 8 November 1934."
  es: "Artículo de la Wikipedia en azerbaiyano sobre Alimardan bey Topchubashov; utilizado únicamente para datos sobre la persona. Es el artículo más extenso sobre él, que narra su vida desde Tiflis hasta San Petersburgo, Bakú y París, así como su papel en la Duma Estatal y la República Democrática de Azerbaiyán. En su introducción, indica que nació el 4 de mayo de 1862 en Tiflis y falleció el 8 de noviembre de 1934."
  fr: "Article de Wikipédia en azerbaïdjanais consacré à Alimardan bey Topchubashov; utilisé uniquement à des fins d'information. Il s'agit du plus long article qui lui est consacré, retraçant sa vie de Tiflis à Saint-Pétersbourg, Bakou et Paris, ainsi que son rôle au sein de la Douma d'État et de la République démocratique d'Azerbaïdjan. Son introduction indique sa naissance le 4 mai 1862 à Tiflis et son décès le 8 novembre 1934."
  ur: "آذربائیجانی ویکیپیڈیا کا مضمون علیمردان بی ٹوپچوباشوف پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ان پر سب سے طویل مضامین، ٹفلس سے سینٹ پیٹرزبرگ، باکو اور پیرس تک ان کی زندگی اور ریاست ڈوما اور آذربائیجان ڈیموکریٹک ریپبلک میں ان کے کردار کا سراغ لگاتے ہیں۔ اس کا لیڈ اس کی پیدائش 4 مئی 1862 کو ٹفلس میں اور اس کی موت 8 نومبر 1934 کو ہوتی ہے۔"
