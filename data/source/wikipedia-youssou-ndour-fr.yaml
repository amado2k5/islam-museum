reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026, and its content checked against the recorded revision. It gives Youssou Madjiguène Ndour, born 1 October 1959 at Dakar, 'king of mbalax', raised in the Médina quarter, his Serer father Elimane Ndour and his mother Ndeye Sokhna Mboup, a Wolof griotte; the start of his career with Étoile de Dakar and the founding of his own Super Étoile de Dakar in 1979; collaborations with Peter Gabriel, Paul Simon and others; '7 Seconds' with Neneh Cherry; the 1998 World Cup anthem; the score of Kirikou et la Sorcière (1997); his role as Olaudah Equiano in Amazing Grace (2006); the Grammy Award of 13 February 2005 for Egypt, with two gold discs; the Polar Music Prize (2013); and his entry into the Royal Swedish Academy of Music in October 2020. For his faith, in the family-life section it states in terms that he is of Muslim confession and a member of the Mouride brotherhood of Senegal ('De confession musulmane, membre de la confrérie mouride du Sénégal'). That is an attestation of his own affiliation, independent of the English article's differently placed and differently worded statement, and is the second of the two attestations on which the record's sufi segment rests; it names no madhhab. Family details in that section (spouses and children) are not used in the record or prose, following the museum's practice."
