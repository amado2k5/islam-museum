summary:
  ar: "الصفحة «عبده الراجحي» — Wikipedia (Arabic)؛ لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: كتاب «al-Tatbiq al-Sarfi» ومؤلفه وتاريخه."
  en: "The page «عبده الراجحي» — Wikipedia (Arabic); summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the book «al-Tatbiq al-Sarfi»: its author and date."
  ur: "صفحہ «عبده الراجحي» — Wikipedia (Arabic)؛ اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: کتاب «al-Tatbiq al-Sarfi»، اس کے مصنف اور تاریخ کا بیان۔"
  fr: "La page «عبده الراجحي» — Wikipedia (Arabic) ; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : le livre « al-Tatbiq al-Sarfi » : son auteur et sa date."
  es: "La página «عبده الراجحي» — Wikipedia (Arabic); resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: el libro «al-Tatbiq al-Sarfi»: su autor y su fecha."
