  ar: "مقالة ويكيبيديا الإنجليزية عن منتيمير شايمييف، رئيس تتارستان (1991–2010): مولده في أنياكوفو في 20 يناير 1937، ودراسته في معهد قازان الزراعي، ومناصبه السوفيتية، وإعلان سيادة تتارستان (1990) واستفتاء 1992، وتنحّيه في 2010، وتأسيسه حزب روسيا الموحدة، ورئاسته مؤسسة «يانارِش»، وأوسمته، وجائزة الملك فيصل (2007)."
  en: "English Wikipedia article on Mintimer Shaimiev, President of Tatarstan (1991–2010): birth in Anyakovo on 20 January 1937, study at the Kazan Agricultural Institute, Soviet posts, Tatarstan's sovereignty declaration (1990) and the 1992 referendum, his stepping down in 2010, co-founding of United Russia, chairmanship of the Yanarysh Foundation, honours, and the King Faisal Prize (2007)."
