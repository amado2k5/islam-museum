summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن منتيمير شايمييف، رئيس تتارستان (1991–2010): مولده في أنياكوفو في 20 يناير 1937، ودراسته في معهد قازان الزراعي، ومناصبه السوفيتية، وإعلان سيادة تتارستان (1990) واستفتاء 1992، وتنحّيه في 2010، وتأسيسه حزب روسيا الموحدة، ورئاسته مؤسسة «يانارِش»، وأوسمته، وجائزة الملك فيصل (2007)."
  en: "English Wikipedia article on Mintimer Shaimiev, President of Tatarstan (1991–2010): birth in Anyakovo on 20 January 1937, study at the Kazan Agricultural Institute, Soviet posts, Tatarstan's sovereignty declaration (1990) and the 1992 referendum, his stepping down in 2010, co-founding of United Russia, chairmanship of the Yanarysh Foundation, honours, and the King Faisal Prize (2007)."
  es: "Artículo de la Wikipedia en inglés sobre Mintimer Shaimiev, presidente de Tatarstán (1991-2010): nacimiento en Anyakovo el 20 de enero de 1937, estudios en el Instituto Agrícola de Kazán, cargos soviéticos, declaración de soberanía de Tatarstán (1990) y referéndum de 1992, su dimisión en 2010, cofundación de Rusia Unida, presidencia de la Fundación Yanarysh, honores y el Premio Rey Faisal (2007)."
  fr: "Article de Wikipédia en anglais sur Mintimer Shaimiev, président du Tatarstan (1991-2010): naissance à Anyakovo le 20 janvier 1937, études à l’Institut agricole de Kazan, postes soviétiques, déclaration de souveraineté du Tatarstan (1990) et référendum de 1992, sa démission en 2010, cofondation de Russie unie, présidence de la Fondation Yanarysh, distinctions et prix du roi Faisal (2007)."
