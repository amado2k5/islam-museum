  ar: "مقالة ويكيبيديا العربية عن عبد اللطيف رشيد؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 10 آب 1944 بالسليمانية، ويعطي صندوق معلوماتها حقل دين هو «الإسلام، أهل السنة والجماعة»، وهو حقل صندوق واحد لا شهادة نصية، وتصنّفه ضمن «مسلمون سنة عراقيون»."
  en: "Arabic Wikipedia article on Abdul Latif Rashid; used for entity facts only. It gives his birth on 10 August 1944 at Sulaymaniyah; its infobox carries a religion field 'Islam, Ahl al-Sunnah wa'l-Jama'a' — one infobox field, not a textual attestation — and it files him under 'Iraqi Sunni Muslims'. Its term dates (13 October 2022 – 11 April 2026) differ by a day from the English article's at each end."
