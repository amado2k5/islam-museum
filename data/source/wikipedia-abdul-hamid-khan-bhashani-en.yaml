summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الحميد خان بهشاني؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 12 ديسمبر 1880 (وسنة ميلاده مختلف فيها بين 1880 و1885)، وأخذه طالبَ علمٍ عن البير سيد ناصر الدين البغدادي سنة 1904 ودراسته في ديوبند (1907–1909)، وبلوغه مقام البير، وتأسيسه رابطة مسلمي عوامي سنة 1949 وحزب عوامي الوطني سنة 1957، ووفاته في دكا في 17 نوفمبر 1976 ودفنه في سانتوش. صندوق حياته الدينية يذكر الإسلام والسنة والحنفية والديوبندية."
  en: "English Wikipedia article on Abdul Hamid Khan Bhashani; used for entity facts only. It gives his birth on 12 December 1880 (his birth year is disputed, 1880–1885), his taking as a disciple (talib-e-ilm) by the pir Sayyid Nasir al-Din al-Baghdadi in 1904 and his study at Deoband (1907–1909), his attaining pir status, his founding of the Awami Muslim League in 1949 and the National Awami Party in 1957, and his death at Dhaka on 17 November 1976 with burial at Santosh. Its religious-life infobox gives Islam, Sunni, Hanafi and Deobandi."
