summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الحميد خان بهشاني؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 12 ديسمبر 1880 ⁦(وسنة ميلاده مختلف فيها بين 1880 و1885)⁩، وأخذه طالبَ علمٍ عن البير سيد ناصر الدين البغدادي سنة 1904 ودراسته في ديوبند (1907–1909)، وبلوغه مقام البير، وتأسيسه رابطة مسلمي عوامي سنة 1949 وحزب عوامي الوطني سنة 1957، ووفاته في دكا في 17 نوفمبر 1976 ودفنه في سانتوش. صندوق حياته الدينية يذكر الإسلام والسنة والحنفية والديوبندية."
  en: "English Wikipedia article on Abdul Hamid Khan Bhashani; used for entity facts only. It gives his birth on 12 December 1880 (his birth year is disputed, 1880–1885), his taking as a disciple (talib-e-ilm) by the pir Sayyid Nasir al-Din al-Baghdadi in 1904 and his study at Deoband (1907–1909), his attaining pir status, his founding of the Awami Muslim League in 1949 and the National Awami Party in 1957, and his death at Dhaka on 17 November 1976 with burial at Santosh. Its religious-life infobox gives Islam, Sunni, Hanafi and Deobandi."
  es: "Artículo de la Wikipedia en inglés sobre Abdul Hamid Khan Bhashani; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 12 de diciembre de 1880 (su año de nacimiento es objeto de controversia, entre 1880 y 1885), su ingreso como discípulo (talib-e-ilm) por el pir Sayyid Nasir al-Din al-Baghdadi en 1904 y sus estudios en Deoband (1907-1909), su obtención del estatus de pir, la fundación de la Liga Musulmana Awami en 1949 y del Partido Nacional Awami en 1957, y su fallecimiento en Dhaka el 17 de noviembre de 1976, con sepultura en Santosh. Su ficha informativa sobre la vida religiosa indica que profesaba el islam, el sunismo, la escuela hanafi y la deobandi."
  fr: "L'article de Wikipédia en anglais consacré à Abdul Hamid Khan Bhashani, utilisé uniquement pour les informations le concernant, indique sa naissance le 12 décembre 1880 (l'année de naissance exacte est sujette à controverse, entre 1880 et 1885), son initiation comme disciple (talib-e-ilm) par le pir Sayyid Nasir al-Din al-Baghdadi en 1904 et ses études à Deoband (1907-1909), son accession au titre de pir, la fondation de la Ligue musulmane Awami en 1949 et du Parti national Awami en 1957, ainsi que sa mort à Dacca le 17 novembre 1976 et son inhumation à Santosh. L'encadré relatif à sa vie religieuse précise qu'il était musulman, sunnite, hanafite et deobandi."
  ur: "عبدالحمید خان بھاشانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 12 دسمبر 1880 ⁦(اس کا سال پیدائش متنازعہ ہے، 1880-1885)⁩، 1904 میں پیر سید ناصر الدین البغدادی کی طرف سے ان کا شاگرد ⁦(طالب علم)⁩ قبول کرنا اور دیوبند میں ان کے مطالعہ (1907-1909)، عوامی لیگ میں ان کے پیر کی حیثیت اور مسلم لیگ 19 کو حاصل کرنا۔ 1957 میں نیشنل عوامی پارٹی، اور ان کی موت 17 نومبر 1976 کو ڈھاکہ میں سنتوش میں تدفین کے ساتھ ہوئی۔ اس کا مذہبی زندگی کی معلومات کا باکس اسلام، سنی، حنفی اور دیوبندی دیتا ہے۔"
  tr: "Abdul Hamid Khan Behshani hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 12 Aralık 1880'de doğdu (doğum yılı 1880 ile 1885 arasında farklıydı), 1904'te Al-Bir Syed Nasiruddin Al-Baghdadi'nin yanında eğitim aldı ve Deoband'da (1907–1909) eğitim gördü, Al-Bir rütbesine ulaştı, 1949'da Awami Müslüman Ligi'ni ve 1957'de Awami Partisi Ulusal Partisi'ni kurdu. 17 Kasım 1976'da Dakka'da vefat etti ve Santosh Mezarlığı'na defnedildi. Dini yaşam kutusunda İslam, Sünnet, Hanafizm ve Deobandizm yer alır."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdul Hamid Khan Behshani; digunakan hanya untuk fakta entitas. Ia lahir pada 12 Desember 1880 (dengan tahun lahir yang berbeda antara 1880 dan 1885), ia belajar di bawah bimbingan Al-Bir Syed Nasiruddin Al-Baghdadi pada tahun 1904 dan belajar di Deoband (1907–1909), mencapai pangkat Al-Bir, mendirikan Liga Muslim Awami pada tahun 1949, dan Partai Nasional Partai Awami pada tahun 1957. Ia meninggal di Dhaka pada 17 November 1976, dan dimakamkan di Pemakaman Santosh. Kotak kehidupan religiusnya menyebutkan Islam, Sunnah, Hanafisme, dan Deobandisme."
