summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد يوسف الكاندهلوي (20 آذار 1917 – 2 نيسان 1965)، الأمير الثاني لجماعة التبليغ؛ تذكر أنه حفظ القرآن في العاشرة وتخرج من مظاهر علوم سنة 1936 وتوفي في لاهور سنة 1965 ودُفن بجوار والده محمد إلياس الكاندهلوي في دلهي، وتعدّد كتابيه «حياة الصحابة» و«أماني الأحبار»؛ ويحمل صندوقها حقلي السنة والحنفية وحركة الديوبندية، وهي ليست شهادات نصية."
  en: "The English Wikipedia article on Muhammad Yusuf Kandhlawi (20 March 1917 – 2 April 1965), second amir of the Tablighi Jamaat; it states that he memorised the Qur'an at ten, graduated from Mazahir Uloom in 1936, died at Lahore in 1965 and was buried beside his father Muhammad Ilyas Kandhlawi at Delhi, and lists his Hayat al-Sahaba and Amani al-Ahbar; its infobox carries Sunni denomination, Hanafi jurisprudence and Deobandi movement fields, which are not text attestations."
