summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد يوسف الكاندهلوي ⁦(20 آذار 1917 – 2 نيسان 1965)⁩، الأمير الثاني لجماعة التبليغ؛ تذكر أنه حفظ القرآن في العاشرة وتخرج من مظاهر علوم سنة 1936 وتوفي في لاهور سنة 1965 ودُفن بجوار والده محمد إلياس الكاندهلوي في دلهي، وتعدّد كتابيه «حياة الصحابة» و«أماني الأحبار»؛ ويحمل صندوقها حقلي السنة والحنفية وحركة الديوبندية، وهي ليست شهادات نصية."
  en: "The English Wikipedia article on Muhammad Yusuf Kandhlawi (20 March 1917 – 2 April 1965), second amir of the Tablighi Jamaat; it states that he memorised the Qur'an at ten, graduated from Mazahir Uloom in 1936, died at Lahore in 1965 and was buried beside his father Muhammad Ilyas Kandhlawi at Delhi, and lists his Hayat al-Sahaba and Amani al-Ahbar; its infobox carries Sunni denomination, Hanafi jurisprudence and Deobandi movement fields, which are not text attestations."
  es: "El artículo de la Wikipedia en inglés sobre Muhammad Yusuf Kandhlawi (20 de marzo de 1917 - 2 de abril de 1965), segundo emir de la Tablighi Jamaat, afirma que memorizó el Corán a los diez años, se graduó de Mazahir Uloom en 1936, murió en Lahore en 1965 y fue enterrado junto a su padre Muhammad Ilyas Kandhlawi en Delhi, y enumera sus Hayat al-Sahaba y Amani al-Ahbar; su ficha informativa contiene campos sobre la denominación sunita, la jurisprudencia hanafi y el movimiento deobandi, que no son atestaciones textuales."
  fr: "L'article de Wikipédia en anglais sur Muhammad Yusuf Kandhlawi (20 mars 1917 – 2 avril 1965), deuxième émir de la Tablighi Jamaat, indique qu'il a mémorisé le Coran à l'âge de dix ans, obtenu son diplôme de Mazahir Uloom en 1936, est décédé à Lahore en 1965 et a été enterré aux côtés de son père Muhammad Ilyas Kandhlawi à Delhi. L'article mentionne également ses Hayat al-Sahaba et Amani al-Ahbar. Son infobox comporte des champs relatifs à l'appartenance à l'école sunnite, à la jurisprudence hanafite et au mouvement déobandi, qui ne constituent pas des attestations textuelles."
  ur: "تبلیغی جماعت کے دوسرے امیر محمد یوسف کاندھلوی ⁦(20 مارچ 1917 - 2 اپریل 1965)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ اس میں بتایا گیا ہے کہ اس نے دس سال کی عمر میں قرآن حفظ کیا، 1936 میں مظاہر العلوم سے گریجویشن کیا، 1965 میں لاہور میں وفات پائی اور دہلی میں اپنے والد محمد الیاس کاندھلوی کے پاس دفن ہوئے، اور ان کی حیات الصحابہ اور امانی الاحبار کی فہرست ہے۔ اس کے معلوماتی خانے میں سنی فرقہ، فقہ حنفی اور دیوبندی تحریک کے شعبوں پر مشتمل ہے، جو متن کی تصدیق نہیں ہیں۔"
