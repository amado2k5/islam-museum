summary:
  ar: "مقالة ويكيبيديا الروسية عن أباي قونانباييف؛ تُستخدم لوقائع الكيان فقط. تعطي تاريخيه بالتقويم اليولياني ⁦(29 يوليو 1845 – 23 يونيو 1904)⁩، ودراسته في مدرسة أحمد ريزا في سيميبالاتينسك، ودوره مصلحًا ثقافيًا على أساس «الإسلام المستنير»."
  en: "Russian Wikipedia article on Abai Kunanbaev; used for entity facts only. It gives his dates in the Julian calendar (29 July 1845 – 23 June 1904), his schooling at Ahmed Ryza's madrasa in Semipalatinsk, and his role as a cultural reformer building on 'enlightened Islam'."
  es: "Artículo de la Wikipedia en ruso sobre Abai Kunanbaev; se utiliza únicamente para obtener información sobre la persona. En él se indican sus fechas en el calendario juliano (29 de julio de 1845 - 23 de junio de 1904), su formación en la madrasa de Ahmed Ryza en Semipalatinsk y su papel como reformador cultural que impulsó el \"islam ilustrado\"."
  fr: "Article de Wikipédia en russe sur Abai Kunanbaev; utilisé uniquement pour les informations sur l'entité. Il indique ses dates dans le calendrier julien (29 juillet 1845 – 23 juin 1904), sa scolarité à la madrasa d'Ahmed Ryza à Semipalatinsk et son rôle de réformateur culturel s'appuyant sur un « islam éclairé »."
  ur: "Abai Kunanbaev پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں جولین کیلنڈر میں ان کی تاریخیں ⁦(29 جولائی 1845 - 23 جون 1904)⁩، سیمیپلاٹنسک میں احمد رائزا کے مدرسے میں ان کی تعلیم، اور 'روشن خیال اسلام' پر ثقافتی مصلح کی عمارت کے طور پر ان کا کردار ہے۔"
  tr: "Abay Qunanbayev hakkında Rusça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Jülyen takvimindeki tarihini (29 Temmuz 1845 – 23 Haziran 1904), Semipalatinsk'teki Ahmad Riza Okulu'ndaki eğitimini ve 'aydınlanmış İslam'a dayalı kültürel reformcu olarak rolünü anlatır."
  id: "Artikel Wikipedia Rusia tentang Abay Qunanbayev; digunakan hanya untuk fakta entitas tersebut. Artikel ini mencantumkan sejarahnya dalam kalender Julian (29 Juli 1845 – 23 Juni 1904), studinya di Sekolah Ahmad Riza di Semipalatinsk, dan perannya sebagai reformis budaya yang didasarkan pada 'Islam tercerahkan.'"
