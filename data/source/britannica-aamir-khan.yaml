reliability_note: "Reference entry read in full on 25 October 2026 (published 29 May 2012, updated 24 October 2026). It gives his birth on 14 March 1965 at Bombay (now Mumbai), his film family (father Tahir Hussain, uncle Nasir Hussain, cousin Mansoor Khan), his state-level tennis, his marriages to Reena Dutta (1986–2002), Kiran Rao (2005–2021) and Gauri Spratt (July 2026), the breakthrough of Qayamat Se Qayamat Tak (1988), the mid-1990s versatility, the year of Lagaan and Dil Chahta Hai (2001), Aamir Khan Productions (founded 1999) and the directorial debut Taare Zameen Par (2007), the talk show Satyamev Jayate (2012–14), and the Padma Shri (2003) and Padma Bhushan (2010). Its controversy section records the 2015 debate over his remarks on rising intolerance, the backlash (Snapdeal dropping him, removal from the Incredible India campaign) and his later clarification. The entry names no religion or school for Khan himself."
