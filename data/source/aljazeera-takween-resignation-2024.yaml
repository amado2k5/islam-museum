summary:
  ar: "تقرير الجزيرة ⁦(24 يونيو 2024، أعاد نشره موقع عرب خبر)⁩ عن إعلان يوسف زيدان في 23 يونيو 2024 استقالته من مجلس أمناء مؤسسة تكوين الفكر العربي لتخصيص وقته للكتابة، وما أثاره الإعلان من ردود، وبيان المؤسسة الذي شكره وأبدى احترام قراره في ظل الضغوط والهجمات."
  en: "Al Jazeera report (24 June 2024, republished by Arab Khabar) on Youssef Ziedan's announcement on 23 June 2024 that he was resigning from the board of trustees of the Takween Foundation for Arab Thought to devote his time to writing, the reactions the announcement drew, and the foundation's statement thanking him and respecting his decision in light of the pressures and attacks."
  es: "Informe de Al Jazeera (24 de junio de 2024, republicado por Arab Khabar) sobre el anuncio de Youssef Ziedan el 23 de junio de 2024 de que renunciaba al consejo de administración de la Fundación Takween para el Pensamiento Árabe para dedicarse a escribir, las reacciones que suscitó el anuncio y la declaración de la fundación agradeciéndole y respetando su decisión a la luz de las presiones y los ataques."
  fr: "Article d'Al Jazeera (24 juin 2024, republié par Arab Khabar) sur l'annonce faite le 23 juin 2024 par Youssef Ziedan de sa démission du conseil d'administration de la Fondation Takween pour la pensée arabe afin de se consacrer à l'écriture, les réactions suscitées par cette annonce et la déclaration de la fondation le remerciant et respectant sa décision face aux pressions et aux attaques."
  ur: "الجزیرہ کی رپورٹ ⁦(24 جون 2024، عرب خبر کے ذریعہ دوبارہ شائع ہوئی)⁩ یوسف زیدان کے 23 جون 2024 کو اس اعلان پر کہ وہ تکوین فاؤنڈیشن فار عرب تھاٹ کے بورڈ آف ٹرسٹیز سے استعفیٰ دے رہے ہیں تاکہ وہ اپنا وقت لکھنے کے لیے وقف کر سکیں، اس اعلان کے رد عمل اور ان کے فیصلے کے احترام میں ان پر دباؤ ڈالا گیا اور ان کا شکریہ ادا کیا گیا۔ حملے"
  tr: "Al Jazeera'nın raporu (24 Haziran 2024, Arab Khabar web sitesi tarafından yeniden yayımlandı) Youssef Zidan'ın 23 Haziran 2024'te Arap Düşünce Oluşumu Vakfı Mütevelli Heyeti'nden istifa ederek zamanını yazmaya ayıracağını açıklaması, duyurunun tetiklediği tepkiler ve vakfın baskılar ve saldırılar arasında kendisine teşekkür ve saygı gösterdiği açıklaması hakkında."
  id: "Laporan Al Jazeera (24 Juni 2024, diterbitkan ulang oleh situs Arab Khabar) tentang pengumuman Youssef Zidan pada 23 Juni 2024, pengunduran dirinya dari Dewan Pengawas Arab Thought Formation Foundation untuk mendedikasikan waktunya menulis, respons yang muncul dari pengumuman tersebut, serta pernyataan yayasan yang mengucapkan terima kasih dan menghormati keputusannya di tengah tekanan dan serangan."
