summary:
  ar: "تقرير الجزيرة ⁦(24 يونيو 2024، أعاد نشره موقع عرب خبر)⁩ عن إعلان يوسف زيدان في 23 يونيو 2024 استقالته من مجلس أمناء مؤسسة تكوين الفكر العربي لتخصيص وقته للكتابة، وما أثاره الإعلان من ردود، وبيان المؤسسة الذي شكره وأبدى احترام قراره في ظل الضغوط والهجمات."
  en: "Al Jazeera report (24 June 2024, republished by Arab Khabar) on Youssef Ziedan's announcement on 23 June 2024 that he was resigning from the board of trustees of the Takween Foundation for Arab Thought to devote his time to writing, the reactions the announcement drew, and the foundation's statement thanking him and respecting his decision in light of the pressures and attacks."
  es: "Informe de Al Jazeera (24 de junio de 2024, republicado por Arab Khabar) sobre el anuncio de Youssef Ziedan el 23 de junio de 2024 de que renunciaba al consejo de administración de la Fundación Takween para el Pensamiento Árabe para dedicarse a escribir, las reacciones que suscitó el anuncio y la declaración de la fundación agradeciéndole y respetando su decisión a la luz de las presiones y los ataques."
