reliability_note: "Read on 8 November 2026 via Al Huda TV's individual programme videos: 'MIMBAR YA Al HUDA | UNDUGU WA KWELI | SHEIKH ABDULRAHMAN KUTURA' (video JhhfLThoBxI, updated three days before the read) and 'MAWLID YA MTUME // BUSIA SUGAR KENYA' (video I2lgWrMpcmg). Both carry the same keyword list, which names, verbatim and in this order, 'Al Huda Tv, Masjid Al Huda, Nabawy Tv, Kenya, Muslims, Nairobi, Mombasa, Malindi, Ahlusunna wal Jamaa, Shk. Mbarak Ahmed Awes, Shk. Izudin Alwy Ahmed, Shk. Othman Maalim, Shk. Hamza Yusuf, Al Habib Ali Jifry, Al Habib Omar Al Hafidh, Shk. Muhammad Ninnowy'. This is the trusted linked profile the wave brief required: a Kenyan Islamic broadcaster naming him among its regular sheikhs. The keyword phrase 'Ahlusunna wal Jamaa' is channel-level metadata in a list covering many named sheikhs; it is NOT a text attesting a school for Izudin Alwy Ahmed himself, and no faith value is taken from it. The videos give no birth date. Read on 8 November 2026."
