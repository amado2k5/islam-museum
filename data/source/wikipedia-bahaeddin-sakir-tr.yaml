summary:
  ar: "مقالة ويكيبيديا التركية عن بهاء الدين شاكر؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته سنة 1874 في إسليمية ⁦(سليفن)⁩ ووفاته في 17 أبريل 1922 في شارلوتنبورغ ببرلين، وتصفه بأنه مؤسس الطب الشرعي في تركيا وصاحب أول كتاب فيه."
  en: "Turkish Wikipedia article on Bahâeddin Şâkir; used for entity facts only. It gives his birth in 1874 at İslimiye (Sliven) and his death on 17 April 1922 at Charlottenburg, Berlin, and calls him the founder of forensic medicine in Turkey and the author of its first copyrighted textbook in the field."
  es: "Artículo de la Wikipedia en turco sobre Bahâeddin Şâkir; utilizado únicamente para datos sobre la persona. Indica que nació en 1874 en İslimiye (Sliven) y falleció el 17 de abril de 1922 en Charlottenburg, Berlín, y lo considera el fundador de la medicina forense en Turquía y el autor del primer libro de texto con derechos de autor en este campo."
  fr: "Article de Wikipédia en turc sur Bahâeddin Şâkir; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance en 1874 à İslimiye (Sliven) et son décès le 17 avril 1922 à Charlottenburg, Berlin, et le présente comme le fondateur de la médecine légale en Turquie et l’auteur du premier manuel protégé par le droit d’auteur dans ce domaine."
