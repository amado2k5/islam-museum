summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمود طرزي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 23 أغسطس 1865 في غزنة، ومنفاه مع أسرته إلى كراتشي ثم الدولة العثمانية، ولقاءه جمال الدين الأفغاني، وعودته إلى أفغانستان سنة 1902 وتأسيسه صحيفة سراج الأخبار (1911-1919)، ووزارته للخارجية (1919-1922 و1924-1927) ودوره في استقلال 1919، ووفاته في إسطنبول في 22 نوفمبر 1933 ودفنه فيها. لا تسمي المقالة دينا ولا مذهبا له شخصيا."
  en: "English Wikipedia article on Mahmud Tarzi; used for entity facts only. It gives his birth on 23 August 1865 at Ghazni, his family's exile to Karachi and then the Ottoman Empire, his meeting with Jamal al-Din al-Afghani, his return to Afghanistan in 1902 and his founding of the newspaper Seraj al-Akhbar (1911–1919), his two terms as foreign minister (1919–1922 and 1924–1927) and his part in the independence of 1919, and his death at Istanbul on 22 November 1933 with his resting place there. The article names no religion or school for him personally."
