summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمود طرزي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 23 أغسطس 1865 في غزنة، ومنفاه مع أسرته إلى كراتشي ثم الدولة العثمانية، ولقاءه جمال الدين الأفغاني، وعودته إلى أفغانستان سنة 1902 وتأسيسه صحيفة سراج الأخبار (1911-1919)، ووزارته للخارجية ⁦(1919-1922 و1924-1927)⁩ ودوره في استقلال 1919، ووفاته في إسطنبول في 22 نوفمبر 1933 ودفنه فيها. لا تسمي المقالة دينا ولا مذهبا له شخصيا."
  en: "English Wikipedia article on Mahmud Tarzi; used for entity facts only. It gives his birth on 23 August 1865 at Ghazni, his family's exile to Karachi and then the Ottoman Empire, his meeting with Jamal al-Din al-Afghani, his return to Afghanistan in 1902 and his founding of the newspaper Seraj al-Akhbar (1911–1919), his two terms as foreign minister (1919–1922 and 1924–1927) and his part in the independence of 1919, and his death at Istanbul on 22 November 1933 with his resting place there. The article names no religion or school for him personally."
  es: "Artículo de la Wikipedia en inglés sobre Mahmud Tarzi; utilizado únicamente para datos sobre la persona. Describe su nacimiento el 23 de agosto de 1865 en Ghazni, el exilio de su familia a Karachi y luego al Imperio Otomano, su encuentro con Jamal al-Din al-Afghani, su regreso a Afganistán en 1902 y la fundación del periódico Seraj al-Akhbar (1911-1919), sus dos mandatos como ministro de Asuntos Exteriores (1919-1922 y 1924-1927) y su participación en la independencia de 1919, y su muerte en Estambul el 22 de noviembre de 1933, donde se encuentra su lugar de descanso final. El artículo no menciona ninguna religión ni escuela a la que perteneciera."
  fr: "Article de Wikipédia en anglais sur Mahmud Tarzi; utilisé uniquement pour les informations le concernant. Il mentionne sa naissance le 23 août 1865 à Ghazni, l’exil de sa famille à Karachi puis dans l’Empire ottoman, sa rencontre avec Jamal al-Din al-Afghani, son retour en Afghanistan en 1902 et la fondation du journal Seraj al-Akhbar (1911-1919), ses deux mandats de ministre des Affaires étrangères (1919-1922 et 1924-1927) et son rôle dans l’indépendance de l’Afghanistan en 1919, ainsi que sa mort à Istanbul le 22 novembre 1933 et son lieu de sépulture. L’article ne précise ni sa religion ni son école."
  ur: "محمود طرزی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 23 اگست 1865 کو غزنی میں ان کی پیدائش، ان کے خاندان کی کراچی اور پھر سلطنت عثمانیہ کی جلاوطنی، جمال الدین الافغانی سے ان کی ملاقات، 1902 میں افغانستان واپسی اور اخبار سراج الاخبار (1911-1919) کی بنیاد، ان کی دو مدتیں بطور وزیر خارجہ اور 1922-1922 1924-1927) اور 1919 کی آزادی میں ان کا حصہ، اور 22 نومبر 1933 کو استنبول میں ان کی آرام گاہ کے ساتھ ان کی موت۔ مضمون میں ذاتی طور پر اس کے لیے کسی مذہب یا اسکول کا نام نہیں لیا گیا ہے۔"
  tr: "Mahmoud Tarzi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 23 Ağustos 1865'te Gazni'de doğduğunu, ailesiyle birlikte Karaçi'ye sürgün edilmesini, ardından Osmanlı İmparatorluğu'na gönderildiğini, Cemaleddin el-Afgan ile görüşmesini, 1902'de Afganistan'a dönüşünü, Siraj al-Akhbar gazetesini kurmasını (1911-1919), dışişleri bakanlığını (1919-1922 ve 1924-1927), 1919'da bağımsızlıktaki rolünü, 22 Kasım 1933'te İstanbul'da ölmesini ve orada defnedilmesini anlatır. Makalede dini veya mezhebi adı verilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Mahmoud Tarzi; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 23 Agustus 1865 di Ghazni, pengasingannya bersama keluarganya ke Karachi dan kemudian Kekaisaran Ottoman, pertemuannya dengan Jamal al-Din al-Afghani, kepulangannya ke Afghanistan pada tahun 1902, pendirian surat kabar Siraj al-Akhbar (1911-1919), kementerian luar negerinya (1919-1922 dan 1924-1927), perannya dalam kemerdekaan pada tahun 1919, kematiannya di Istanbul pada 22 November 1933, dan pemakamannya di sana. Artikel tersebut tidak menyebutkan agama atau sektenya."
