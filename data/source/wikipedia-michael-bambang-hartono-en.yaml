summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مايكل بامبانغ هارتونو، المولود في 2 تشرين الأول 1939 في كودوس والمتوفى في 19 آذار 2026 في سنغافورة، الذي ورث مع أخيه الأصغر روبرت بودي شركة جاروم سنة 1963 وبنى معه المجموعة وبنك سنترال آسيا؛ تذكر دراسته في جامعة ديبونيغورو وميداليته البرونزية في البريدج في ألعاب آسيا 2018 ودفنه في رمبانغ."
  en: "English Wikipedia article on Michael Bambang Hartono, born 2 October 1939 in Kudus and died 19 March 2026 in Singapore, who inherited Djarum with his younger brother Robert Budi in 1963 and built the group and Bank Central Asia with him; it records his studies at Diponegoro University, his bridge bronze medal at the 2018 Asian Games, and his burial in Rembang."
  es: "Artículo de la Wikipedia en inglés sobre Michael Bambang Hartono, nacido el 2 de octubre de 1939 en Kudus y fallecido el 19 de marzo de 2026 en Singapur, quien heredó Djarum con su hermano menor Robert Budi en 1963 y construyó el grupo y el Banco Central Asia con él; en él se recogen sus estudios en la Universidad de Diponegoro, su medalla de bronce en bridge en los Juegos Asiáticos de 2018 y su entierro en Rembang."
  fr: "L'article de Wikipédia en anglais sur Michael Bambang Hartono, né le 2 octobre 1939 à Kudus et décédé le 19 mars 2026 à Singapour, qui a hérité de Djarum avec son jeune frère Robert Budi en 1963 et a construit le groupe et la Bank Central Asia avec lui; il relate ses études à l'université Diponegoro, sa médaille de bronze en bridge aux Jeux asiatiques de 2018 et son enterrement à Rembang."
  ur: "مائیکل بامبنگ ہارٹونو پر انگریزی ویکیپیڈیا کا مضمون، 2 اکتوبر 1939 کو کدوس میں پیدا ہوا اور 19 مارچ 2026 کو سنگاپور میں فوت ہوا، جس نے 1963 میں اپنے چھوٹے بھائی رابرٹ بوڈی کے ساتھ دجارم کو وراثت میں ملا اور اس کے ساتھ گروپ اور بینک سینٹرل ایشیا بنایا؛ اس میں ڈیپونیگورو یونیورسٹی میں ان کی تعلیم، 2018 کے ایشین گیمز میں اس کے برج کانسی کا تمغہ، اور ریمبنگ میں اس کی تدفین کو ریکارڈ کیا گیا ہے۔"
  tr: "Michael Bambang Hartono hakkında, 2 Ekim 1939'da Kudos'ta doğan ve 19 Mart 2026'da Singapur'da vefat eden Michael Bambang Hartono hakkında, 1963'te küçük kardeşi Robert Bodhi ile birlikte grubu ve Central Asia Bank'ı kurduğu Garum şirketini devraldığı İngilizce Wikipedia makalesi; Debonguru Üniversitesi'ndeki eğitimi, 2018 Asya Oyunları'nda briçte bronz madalya kazanması ve Rampang'daki defnedilmesi gibi bir durum yer almaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Michael Bambang Hartono, lahir 2 Oktober 1939 di Kudos dan meninggal pada 19 Maret 2026 di Singapura, yang mewarisi perusahaan Garum pada tahun 1963 bersama adik laki-lakinya Robert Bodhi, yang bersama-sama membangun grup dan Central Asia Bank; artikel tersebut menyebutkan studinya di Universitas Debonguru, medali perunggu dalam bidang bridge pada Asian Games 2018, dan pemakamannya di Rampang."
