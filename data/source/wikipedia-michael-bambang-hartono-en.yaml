  ar: "مقالة ويكيبيديا الإنجليزية عن مايكل بامبانغ هارتونو، المولود في 2 تشرين الأول 1939 في كودوس والمتوفى في 19 آذار 2026 في سنغافورة، الذي ورث مع أخيه الأصغر روبرت بودي شركة جاروم سنة 1963 وبنى معه المجموعة وبنك سنترال آسيا؛ تذكر دراسته في جامعة ديبونيغورو وميداليته البرونزية في البريدج في ألعاب آسيا 2018 ودفنه في رمبانغ."
  en: "English Wikipedia article on Michael Bambang Hartono, born 2 October 1939 in Kudus and died 19 March 2026 in Singapore, who inherited Djarum with his younger brother Robert Budi in 1963 and built the group and Bank Central Asia with him; it records his studies at Diponegoro University, his bridge bronze medal at the 2018 Asian Games, and his burial in Rembang."
