reliability_note: "User-uploaded scan of the Indonesian translation. Its imprint page gives the original as Muhammad: Prophet for Our Time, HarperCollins Publishers, London, 2006; translator Yuhani Liputo; first printing April 2007, Penerbit Mizan, Bandung. The contents show an introduction by Jalaluddin Rakhmat titled 'Simpatik tapi Tidak Kritis' (sympathetic but not critical) and five chapters, the first three titled Makkah, Jahiliah and Hijrah and the fifth Salam. Read on 24 November 2026."
