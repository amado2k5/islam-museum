reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The article rests on the introduction to Mohsen Naji Nasrabadi's edition of the Tazkira (Asatir, Tehran, 1999), on Golchin Ma'ani's history of Persian tazkiras and on his Karavan-e Hend. It gives Nasrabadi's birth in 1027 AH, his origin in Nasrabad of Isfahan and his noted family, his studies and his travels to Mecca, the shrine cities and Mashhad, his association with the poets of his age — Saib Tabrizi the most famous — and his works, among them Mir'at al-Kamal, selections from Saib's divan and from the Shahnameh, and Gul-i Rana, none as famous as the Tazkirat al-Shu'ara. It states no death date, recording only that he was alive in 1088 AH, so no died block is built in the person record. Checked 1 November 2026."
