  ar: "مقالة ويكيبيديا الإنجليزية عن عبيد الله السندي (1872–1944)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في سيالكوت في أسرة سيخية باسم بوتا سينغ أوبال، ودوره في حركة رسائل الحرير وحكومة الهند المؤقتة في كابل وزيرًا للشؤون الداخلية، وسنواته في روسيا وتركيا والحجاز، ووفاته في دين بور في 21 أغسطس 1944."
  en: "English Wikipedia article on Ubaidullah Sindhi (1872–1944); used for entity facts only. It recounts his birth at Sialkot in a Sikh family as Buta Singh Uppal, his part in the Silk Letter movement and the Provisional Government of India at Kabul as its home minister, his years in Russia, Turkey and the Hijaz, and his death at Deen Pur on 21 August 1944."
