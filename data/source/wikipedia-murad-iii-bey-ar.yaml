  ar: "مقالة ويكيبيديا العربية عن مراد باي الثالث؛ تُستخدم لوقائع الكيان فقط. تعطي 1680–9 حزيران 1702 وتجعله آخر بايات المراديين، وتذكر وفاته عن نحو اثنين وعشرين عاماً، وإن خالفت المقالين الإنجليزية والفرنسية في قاتل أبيه علي باي فجعلته رمضان باي لا محمد باي."
  en: "Arabic Wikipedia article on Murad III Bey; used for entity facts only. It gives 1680 – 9 June 1702, makes him the last Muradid bey and has him die aged about twenty-two, but names Ramadan Bey as his father Ali Bey's killer, against the English and French articles' Muhammad Bey — a conflict preserved in the person record's born note."
