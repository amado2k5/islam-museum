reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia; used for entity facts only. Read in full on 25 October 2026. It dates Hali's life 1837–1915 and gives his death at Panipat on 1 January 1915 — one day later than the 31 December 1914 given by all three Wikipedia editions and Wikidata; both dates are recorded in the person record. It adds that his ancestors settled at Panipat in the reign of Balaban (1266–1287), that he went to Delhi in 1854, that he remained in Nawab Mustafa Khan Shefta's service until the Nawab's death in 1872 before moving to Lahore, that Hyderabad granted him a pension in 1887 and the Shamsul Ulema title came in 1904, that the Musaddas (composed 1879) was a source of inspiration to Muhammad Iqbal, that Chup ki Daad was written in 1905 and treats women's education, and dates for the biographies (Hayat-e-Saadi 1884, Yadgar-e-Ghalib 1897, Hayat-e-Javed 1901). It names no school for Hali."
