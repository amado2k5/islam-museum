  ar: "مدخل حالي في موسوعة الإسلام التركية (TDV)، بقلم حنيف فوق؛ تُستخدم لوقائع الكيان فقط. يذكر مولده في بانيبات ووفاته فيها في 1 يناير 1915، ولقاءه بغالب وسيد أحمد خان، ومنحه لقب شمس العلماء سنة 1904."
  en: "Entry 'HÂLÎ' in the TDV İslâm Ansiklopedisi, by Hanif Fauq; used for entity facts only. It records his birth at Panipat, his death there on 1 January 1915, his meetings with Ghalib and Sir Syed Ahmad Khan, and the Shamsul Ulema title in 1904."
