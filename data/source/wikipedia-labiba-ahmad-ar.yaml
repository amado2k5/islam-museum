reliability_note: "Pointer for entity facts only. Read at the recorded revision and checked against it on 26 October 2026. Gives her full name Labiba Ahmad Abd al-Nabi and records that Hassan al-Banna appointed her the first head of the Muslim Brotherhood's women's section, which she led from the section's founding in 1933 until 1937; her part in the 1919 women's demonstration; her journal al-Nahda al-Nisa'iyya (1921, sixteen years) and her Society of Egyptian Ladies' Awakening. Its text gives her birth at Cairo in 1870 while its infobox gives 1875 and a death on 1 January 1955 at Cairo — both in conflict with the English article's Baron-based 1870s and 1951, as the person record's date notes set out. It names no school of Islam for her."
