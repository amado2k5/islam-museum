  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله جودت؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 9 سبتمبر 1869 في عربكير ووفاته في 29 نوفمبر 1932 في إسطنبول، وتوثق تحوّله من التدين إلى عداء الدين المؤسسي وتقلّبه بين البكتاشية والبهائية، وتسمية خصومه له عدوًّا للإسلام."
  en: "English Wikipedia article on Abdullah Cevdet; used for entity facts only. It gives his birth on 9 September 1869 at Arapgir and his death on 29 November 1932 at Istanbul, documents his path from piety to opposition to institutionalised religion and his turns toward Bektashism and the Baháʼí Faith, and records his opponents' label of 'eternal enemy of Islam'."
