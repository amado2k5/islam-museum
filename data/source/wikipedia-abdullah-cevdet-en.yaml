summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله جودت؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 9 سبتمبر 1869 في عربكير ووفاته في 29 نوفمبر 1932 في إسطنبول، وتوثق تحوّله من التدين إلى عداء الدين المؤسسي وتقلّبه بين البكتاشية والبهائية، وتسمية خصومه له عدوًّا للإسلام."
  en: "English Wikipedia article on Abdullah Cevdet; used for entity facts only. It gives his birth on 9 September 1869 at Arapgir and his death on 29 November 1932 at Istanbul, documents his path from piety to opposition to institutionalised religion and his turns toward Bektashism and the Baháʼí Faith, and records his opponents' label of 'eternal enemy of Islam'."
  es: "Artículo de la Wikipedia en inglés sobre Abdullah Cevdet; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 9 de septiembre de 1869 en Arapgir y su muerte el 29 de noviembre de 1932 en Estambul, documenta su trayectoria desde la piedad hasta la oposición a la religión institucionalizada y su acercamiento al bektashismo y la fe baháʼí, y recoge la etiqueta de sus oponentes de «enemigo eterno del Islam»."
  fr: "Article de Wikipédia en anglais sur Abdullah Cevdet; utilisé uniquement pour les informations biographiques. Il indique sa naissance le 9 septembre 1869 à Arapgir et sa mort le 29 novembre 1932 à Istanbul, retrace son parcours, de la piété à l’opposition à la religion institutionnalisée, en passant par ses conversions au bektashisme et à la foi bahá’íe, et mentionne l’étiquette d’« ennemi éternel de l’islam » que lui ont attribuée ses adversaires."
  ur: "عبداللہ Cevdet پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 9 ستمبر 1869 کو اراپگیر میں ان کی پیدائش اور 29 نومبر 1932 کو استنبول میں ان کی موت، ان کے تقویٰ سے لے کر ادارہ جاتی مذہب کی مخالفت اور بکتاشزم اور بہائی عقیدے کی طرف اس کے رخ کی دستاویز کرتا ہے، اور اس کے مخالفین کو 'اسلام کے ازلی دشمن' کا لیبل درج کرتا ہے۔"
  tr: "Abdullah Jawdat hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 9 Eylül 1869'da Arabkir'de doğduğunu ve 29 Kasım 1932'de İstanbul'da ölümünü anlatır; dindarlıktan düşmanlığa, kurumsal dine dönüşümünü ve Bektaşizm ile Bahaizm arasındaki geçişini ve rakiplerinin onu İslam düşmanı olarak nitelendirmesini belgelemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdullah Jawdat; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada 9 September 1869 di Arabkir dan kematiannya pada 29 November 1932 di Istanbul, mendokumentasikan transformasinya dari religiusitas menjadi permusuhan ke agama institusional dan pergeseran antara Bektashisme dan Baha'isme, serta para penentangnya melabelinya sebagai musuh Islam."
