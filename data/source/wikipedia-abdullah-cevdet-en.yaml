reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full on 26 October 2026 and re-fetched by revision id with content verified identical. Its text says he was initially a pious Muslim, was turned against institutionalised religion by materialist philosophies, and sought to fuse Islam with materialism; it nowhere settles him as an atheist in its own voice, though its categories file him under 'Kurdish atheists' and 'Turkish atheists'."
