label: { ar: "نص فتوح الشام المنسوب إلى الواقدي وسياقه ⁦(أطروحة دكتوراه، يونس دهقاني فارساني، جامعة غوتنغن)⁩", en: "Text und Kontext des al-Wāqidī zugeschriebenen Futūḥ aš-Šām (doctoral dissertation, Yoones Dehghani Farsani, University of Göttingen)" }
summary:
  ar: "أطروحة دكتوراه بالألمانية في جامعة غوتنغن، بإشراف ينس شاينر، عن نص «فتوح الشام» المنسوب إلى الواقدي وسياقه، وعن الجدل البحثي في كتب الفتوح المبكرة. يُستعمل منها هنا ملخصها الإنجليزي المنشور في مستودع الجامعة."
  en: "A German-language doctoral dissertation at the University of Göttingen, supervised by Jens Scheiner, on the text and context of the Futuh al-Sham ascribed to al-Waqidi and on the research debate about early futuh works. Only its English abstract, published in the university repository, is used here."
  es: "Tesis doctoral en alemán presentada en la Universidad de Gotinga, bajo la dirección de Jens Scheiner, sobre el texto y el contexto del Futuh al-Sham atribuido a al-Waqidi y sobre el debate en torno a las primeras obras de futuh. Aquí solo se incluye el resumen en inglés, publicado en el repositorio de la universidad."
  fr: "Thèse de doctorat en langue allemande, soutenue à l'Université de Göttingen sous la direction de Jens Scheiner, portant sur le texte et le contexte du Futuh al-Sham attribué à al-Waqidi et sur le débat de recherche concernant les premiers ouvrages de futuh. Seul son résumé en anglais, publié dans l'archive institutionnelle de l'université, est utilisé ici."
  ur: "گوٹنگن یونیورسٹی میں جرمن زبان کا ڈاکٹریٹ مقالہ، جس کی نگرانی جینز شینر نے کی، الواقدی سے منسوب فتوح الشام کے متن اور سیاق و سباق اور ابتدائی فتوح کاموں کے بارے میں تحقیقی بحث پر۔ یونیورسٹی کے مخزن میں شائع ہونے والا صرف اس کا انگریزی خلاصہ یہاں استعمال ہوا ہے۔"
  tr: "Göttingen Üniversitesi'nde Jens Scheiner'in danışmanlığında, al-Waqidi'ye atfedilen \"Futuh al-Sham\" metni ve bağlamı ile erken fetih kitaplarındaki araştırma tartışmaları üzerine Almanca doktora tezi yapılmıştır. Burada, üniversite arşivinde yayımlanan İngilizce özeti kullanılmıştır."
  id: "Disertasi doktoral dalam bahasa Jerman di Universitas Göttingen, dibimbing oleh Jens Scheiner, tentang teks \"Futuh al-Sham\" yang dikaitkan dengan al-Waqidi dan konteksnya, serta tentang kontroversi penelitian dalam buku-buku penaklukan awal. Di sini, ringkasan bahasa Inggrisnya yang diterbitkan di repositori universitas digunakan."
title: "Text und Kontext des al-Wāqidī zugeschriebenen Futūḥ aš-Šām: Ein Beitrag zur Forschungsdebatte über frühe futūḥ-Werke"
