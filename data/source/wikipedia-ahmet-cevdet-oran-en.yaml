  ar: "مقالة ويكيبيديا الإنجليزية عن الصحفي العثماني التركي أحمد جودت أوران (1862–1935)؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في إسطنبول سنة 1862 ووفاته في أنقرة في 27 مايو 1935، وتروي تأسيسه صحيفة «إقدام» (1894–1928) ومعارضته جمعية الاتحاد والترقي ومنفاه في سويسرا ودعمه حرب الاستقلال التركية."
  en: "English Wikipedia article on the Ottoman-Turkish journalist Ahmet Cevdet Oran (1862-1935); used for entity facts only. It gives his birth at Istanbul in 1862 and his death at Ankara on 27 May 1935, and recounts his founding of the newspaper Ikdam (1894-1928), his opposition to the Committee of Union and Progress, his exile in Switzerland, and his support for the Turkish War of Independence."
