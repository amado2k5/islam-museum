reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. The article opens with a hatnote distinguishing its subject from Ahmed Cevdet Pasha (1822-1895), the statesman, who is a different man and a separate museum record; its biography rests chiefly on the TDV Islam Ansiklopedisi entry 'Ahmet Cevdet, Ikdamci' and on Baskut's 1964 survey of Turkish journalism. It makes no statement of Oran's religion anywhere in its text."
