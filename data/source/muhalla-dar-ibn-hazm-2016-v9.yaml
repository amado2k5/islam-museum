summary:
  ar: "المجلد التاسع من طبعة دار ابن حزم لـ«المحلى»، بإشراف خالد الرباط ومشاركة باحثين، يضم كتب الحوالة والكفالة والشركة والقسمة والصلح والمداينات والإجارات والمزارعة والمغارسة وما يليها، مع تعليقات المحققين وتخريجاتهم وفهرس المسائل."
  en: "Volume 9 of the Dar Ibn Hazm edition of al-Muhalla, supervised by Khalid al-Rabbat with a team of researchers, holding the Books of Transfer of Debt, Surety, Partnership, Division, Settlement, Debts, Hire, Sharecropping and Planting and what follows, with the editors' notes, references and an index of questions."
  ur: "دار ابن حزم کے ایڈیشن «المحلی» کی جلد نہم، خالد الرباط کی نگرانی میں محققین کی شرکت سے، جس میں حوالہ، کفالہ، شرکت، تقسیم، صلح، قرض، اجارہ، مزارعت و مغارست وغیرہ کی کتابیں ہیں، محققین کے حواشی، تخریجات اور مسائل کی فہرست کے ساتھ۔"
title: "المحلى بالآثار في شرح المجلى بالاختصار (المجلد التاسع)"
