reliability_note: "A short stub. Read on 27 October 2026 at the recorded revision. It gives her full name as بلقيس بانو إيدهي, born 14 August 1947 at Bantva, British India, died 15 April 2022 at Karachi, buried at Mewa Shah Graveyard, Karachi; spouse Abdul Sattar Edhi (marriage 1965 until his death in 2016); a nurse and philanthropist, co-chair of the Edhi Foundation; Ramon Magsaysay Award 1986 and the Mother Teresa Memorial Award 2015. It makes no statement of her religion."
