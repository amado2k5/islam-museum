summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألبوم «أنا مؤمن» للمغني الكندي عرفان مكي؛ لوقائع الكيان فقط: صدوره في 28 يوليو 2011 عن أوايكننغ، وقائمة أغانيه، والشائعة الكاذبة حول أغنية «Waiting for the Call» وتكذيب مكي لها؛ تستند إلى لاست إف إم وموقع دوباوا لتدقيق الأخبار."
  en: "English Wikipedia article on the Canadian singer Irfan Makki's album I Believe; entity facts only: its release on 28 July 2011 by Awakening, its track list, and the internet hoax about 'Waiting for the Call' with Makki's denial; it cites Last.fm and the fact-checker Dubawa."
  es: "Artículo de la Wikipedia en inglés sobre el álbum I Believe del cantante canadiense Irfan Makki; solo datos sobre la entidad: su lanzamiento el 28 de julio de 2011 por Awakening, su lista de canciones y el bulo de internet sobre 'Waiting for the Call' con la negación de Makki; cita Last.fm y al verificador de datos Dubawa."
  fr: "Article de Wikipédia en anglais sur l'album I Believe du chanteur canadien Irfan Makki; informations factuelles uniquement: sa sortie le 28 juillet 2011 chez Awakening, sa liste de titres et le canular internet concernant « Waiting for the Call » démenti par Makki; l'article cite Last.fm et le vérificateur de faits Dubawa."
  ur: "کینیڈین گلوکار عرفان مکی کے البم I Believe پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: 28 جولائی 2011 کو اس کی ریلیز بیداری، اس کی ٹریک لسٹ، اور مکی کے انکار کے ساتھ 'ویٹنگ فار دی کال' کے بارے میں انٹرنیٹ پر دھوکہ دہی؛ اس میں Last.fm اور حقائق کی جانچ کرنے والے Dubawa کا حوالہ دیا گیا ہے۔"
  tr: "Kanadalı şarkıcı Irfan Mekky'nin 'Ana Moamen' albümü hakkında İngilizce Wikipedia makalesi; sadece varlık için gerçekler: 28 Temmuz 2011'de Awakening tarafından yayımlanması, parça listesi ve 'Waiting for the Call' şarkısıyla ilgili yanlış söylenti ile Meki'nin bunu reddetmesi; Last FM ve haber doğrulama sitesi Dupau'ya dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang album 'Ana Moamen' oleh penyanyi Kanada Irfan Mekky; hanya untuk fakta entitas: perilisan album pada 28 Juli 2011 oleh Awakening, daftar lagunya, dan rumor palsu tentang lagu 'Waiting for the Call' serta penolakan terhadapnya; didasarkan pada Last FM dan situs verifikasi berita Dupau."
