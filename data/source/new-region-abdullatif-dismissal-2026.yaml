reliability_note: "A reported news article (byline as carried on the outlet's homepage listing) built around an official document the outlet obtained and a senior KRG official's confirmation of its authenticity. Facts taken from it: the ministry's decision, dated 1 July 2026, permanently removed him from his academic position, stripped his pension rights and barred him from future public employment, under Article 4 of Law No. 14 of 1991; the decision followed a formal investigation by the ministry and the University of Sulaimani after alleged conversations and audio recordings circulated on Kurdish social media in June 2026; he denies the allegations, claiming the chats and recordings were fabricated using artificial intelligence, and said in a statement that he will appeal the decision in court, claiming it was reached 'under a lot of pressure'. The same article identifies him independently of The Amargi: 'Abdul Latif is one of the Kurdistan Region's most prominent Salafi figures. He lectures at the College of Islamic Sciences at the University of Sulaimani, founded the Kurdish-language Salafi television channel Amozhgari, and serves as chief imam of Bahasht Mosque.' No criminal conviction is reported in it. Read in full on 9 November 2026."
