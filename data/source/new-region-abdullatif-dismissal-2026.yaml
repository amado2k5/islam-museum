summary:
  ar: "تقرير «ذا نيو ريجون» المؤرخ في 1 يوليو 2026 عن قرار وزارة التعليم العالي في حكومة إقليم كردستان بفصل عبداللطيف أحمد مصطفى نهائيًا من منصبه الأكاديمي وتجريده من حقوقه التقاعدية ومنعه من العمل العام مستقبلًا، استنادًا إلى وثيقة رسمية حصلت عليها الصحيفة؛ وهو مؤسس قناة ئامۆژگاری وكبير أئمة مسجد بهشت."
  en: "The New Region's report of 1 July 2026 on the KRG Ministry of Higher Education's decision to permanently remove Abdullatif Ahmad Mustafa from his academic position, stripping his pension rights and barring him from future public employment, based on an official document the outlet obtained; he founded the Amozhgari channel and serves as chief imam of Bahasht Mosque."
  ur: "عبداللطیف احمد مصطفیٰ کو ان کے تعلیمی عہدے سے مستقل طور پر ہٹانے، ان کی پنشن کے حقوق ختم کرنے اور آئندہ سرکاری ملازمت سے روکنے کے کردستان ریجنل گورنمنٹ کی وزارتِ تعلیمِ عالی کے فیصلے پر یکم جولائی 2026ء کی «دی نیو ریجن» کی رپورٹ، جو اخبار کو حاصل ایک سرکاری دستاویز پر مبنی ہے؛ وہ اموژگاری چینل کے بانی اور بہشت مسجد کے بڑے امام ہیں۔"
