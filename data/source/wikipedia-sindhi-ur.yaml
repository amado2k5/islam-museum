summary:
  ar: "مقالة ويكيبيديا الأردية عن عبيد الله السندي (1872–1944)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته قرب سيالكوت في أسرة سيخية، واعتناقه الإسلام، ودراسته وخدماته في حركة الاستقلال، وإقامته في كابل، ووفاته في رحيم يار خان."
  en: "Urdu Wikipedia article on Obaidullah Sindhi (1872–1944); used for entity facts only. It recounts his birth near Sialkot in a Sikh family, his conversion to Islam, his studies and his work for the independence movement, his Kabul years, and his death at Rahim Yar Khan."
  es: "Artículo de Wikipedia en urdu sobre Obaidullah Sindhi (1872-1944); utilizado únicamente para datos biográficos. Relata su nacimiento cerca de Sialkot en una familia sij, su conversión al islam, sus estudios y su trabajo para el movimiento independentista, sus años en Kabul y su muerte en Rahim Yar Khan."
  fr: "Article de Wikipédia en ourdou sur Obaidullah Sindhi (1872-1944); utilisé uniquement à titre informatif. Il relate sa naissance près de Sialkot dans une famille sikh, sa conversion à l’islam, ses études et son engagement pour le mouvement d’indépendance, ses années à Kaboul et sa mort à Rahim Yar Khan."
  ur: "عبید اللہ سندھی (1872–1944) پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں سیالکوٹ کے قریب ایک سکھ خاندان میں ان کی پیدائش، اسلام قبول کرنے، ان کی تعلیم اور تحریک آزادی کے لیے ان کے کام، کابل کے سالوں، اور رحیم یار خان میں ان کی موت کا ذکر ہے۔"
  tr: "Ubeydullah El-Sindi (1872–1944) hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Sialkot yakınlarında bir Sih ailesinde doğmasını, İslam'a geçişini, bağımsızlık hareketindeki çalışmalarını ve hizmetlerini, Kabil'deki ikametini ve Rahim Yar Han'daki ölümünü anlatır."
  id: "Artikel Wikipedia Urdu tentang Ubaidullah Al-Sindi (1872–1944); digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya di dekat Sialkot dalam keluarga Sikh, konversinya ke Islam, studi dan jasanya dalam gerakan kemerdekaan, kediamannya di Kabul, dan kematiannya di Rahim Yar Khan."
