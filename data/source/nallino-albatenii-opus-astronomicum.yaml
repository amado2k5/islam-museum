label:
  ar: "البتاني، الزيج (Opus astronomicum)، تحقيق كرلو ألفونسو نالينو، الأجزاء 1–3 ⁦(ميلانو 1899–1907)⁩"
  en: "al-Battani sive Albatenii Opus astronomicum, ed. and Latin tr. Carlo Alfonso Nallino, Parts I–III (Milan: Hoepli, 1899–1907)"
  ur: "بتانی کی زیج، نالینو کا عربی ایڈیشن و لاطینی ترجمہ، حصے1–3، میلان1899–1907"
summary:
  ar: "نشرة كرلو ألفونسو نالينو لزيج البتاني عن مخطوطة الإسكوريال، في ثلاثة أجزاء ضمن منشورات مرصد بريرا في ميلانو ⁦(رقم 40)⁩: الجزء الأول ترجمة لاتينية للأبواب مع حواشٍ ومقدمة طويلة في حياة البتاني وكتبه، والثاني ترجمة الجداول مع الحواشي والمسرد والفهارس، والثالث النص العربي."
  en: "Carlo Alfonso Nallino's edition of al-Battani's Zij from the Escorial manuscript, in three parts in the Publications of the Brera Observatory, Milan (no. 40): Part I the Latin version of the chapters with notes and a long preface on al-Battani's life and writings; Part II the version of the tables with notes, glossary and indexes; Part III the Arabic text."
  ur: "اسکوریال کے مخطوطے سے نالینو کی بتانی کی زیج کی تین حصوں میں اشاعت: لاطینی ابواب و مقدمہ، جدول و فہرستیں، اور عربی متن؛ اس دور میں عربی باب3 اور متعلقہ لاطینی صفحات بھی دیکھے گئے۔"
  es: "Edición de Carlo Alfonso Nallino del Zij de al-Battani a partir del manuscrito de El Escorial, en tres partes, en las Publicaciones del Observatorio de Brera, Milán (n.º 40): Parte I, la versión latina de los capítulos con notas y un extenso prefacio sobre la vida y los escritos de al-Battani; Parte II, la versión de las tablas con notas, glosario e índices; Parte III, el texto árabe."
  fr: "L'édition par Carlo Alfonso Nallino du Zij d'al-Battani à partir du manuscrit de l'Escorial, en trois parties dans les Publications de l'Observatoire de Brera, Milan (n° 40): Partie I la version latine des chapitres avec des notes et une longue préface sur la vie et les écrits d'al-Battani; Partie II la version des tableaux avec des notes, un glossaire et des index; Partie III le texte arabe."
  tr: "Carlo Alfonso Nalino'nun Zig al-Battani tarafından Escorial el yazması üzerine yayımlanan bülteni, Milano'daki Pereira Gözlemevi'nin yayınları içinde üç bölüm halinde (No. 40): birinci bölüm, dipnotlar ve al-Battani'nin hayatı ile kitaplarına uzun bir girişle birlikte bölümlerin Latince çevirisi; ikinci bölüm dipnotlar, sözlükler ve dizinlerle birlikte tabloların çevirisi; üçüncü bölüm ise Arapça metindir."
  id: "Buletin Carlo Alfonso Nalino oleh Zig al-Battani tentang manuskrip Escorial, dalam tiga bagian dalam publikasi Observatorium Pereira di Milan (No. 40): bagian pertama adalah terjemahan Latin dari bab-bab dengan catatan kaki dan pengantar panjang tentang kehidupan dan buku al-Battani; bagian kedua adalah terjemahan tabel dengan catatan kaki, glosarium, dan indeks; dan bagian ketiga adalah teks Arab."
