summary:
  ar: "نشرة كرلو ألفونسو نالينو لزيج البتاني عن مخطوطة الإسكوريال، في ثلاثة أجزاء ضمن منشورات مرصد بريرا في ميلانو (رقم 40): الجزء الأول ترجمة لاتينية للأبواب مع حواشٍ ومقدمة طويلة في حياة البتاني وكتبه، والثاني ترجمة الجداول مع الحواشي والمسرد والفهارس، والثالث النص العربي."
  en: "Carlo Alfonso Nallino's edition of al-Battani's Zij from the Escorial manuscript, in three parts in the Publications of the Brera Observatory, Milan (no. 40): Part I the Latin version of the chapters with notes and a long preface on al-Battani's life and writings; Part II the version of the tables with notes, glossary and indexes; Part III the Arabic text."
