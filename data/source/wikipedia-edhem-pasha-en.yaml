summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أدهم باشا المشير؛ تُستخدم لوقائع الكيان فقط. تعطيه نائبًا لعثمان نوري باشا في بلفنة وقائد الجيش الذي هزم اليونان في تساليا سنة 1897، وتميّزه صراحة عن الوزير إبراهيم أدهم باشا."
  en: "English Wikipedia article on Edhem Pasha the field marshal; used for entity facts only. It gives him as Osman Nuri Pasha’s deputy at Plevna and the commander who defeated Greece on the Thessalian front in 1897, and its hatnote expressly distinguishes him from the minister Ibrahim Edhem Pasha."
  es: "Artículo de la Wikipedia en inglés sobre Edhem Pasha, el mariscal de campo; utilizado únicamente para datos sobre la persona. Lo presenta como el lugarteniente de Osman Nuri Pasha en Plevna y el comandante que derrotó a Grecia en el frente de Tesalia en 1897, y su nota aclaratoria lo distingue expresamente del ministro Ibrahim Edhem Pasha."
  fr: "L'article de Wikipédia en anglais sur Edhem Pacha, maréchal, est utilisé uniquement à des fins d'information. Il le présente comme l'adjoint d'Osman Nouri Pacha à Plevna et le commandant qui a vaincu la Grèce sur le front thessalien en 1897, et sa note de bas de page le distingue expressément du ministre Ibrahim Edhem Pacha."
  ur: "ایدھم پاشا فیلڈ مارشل پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے پلیونا میں عثمان نوری پاشا کے نائب اور کمانڈر کے طور پر دیتا ہے جس نے 1897 میں یونان کو تھیسالین کے محاذ پر شکست دی تھی، اور اس کا ہیٹ نوٹ اسے وزیر ابراہیم ایدھم پاشا سے واضح طور پر ممتاز کرتا ہے۔"
  tr: "Adham Paşa Mareşal hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. Bu makale ona Belvina'da Osman Nuri Paşa'nın yardımcısı ve 1897'de Teselya'da Yunanistan'ı yenen ordunun komutanı olarak verilir; bu da onu vezir İbrahim Adham Paşa'dan açıkça ayırır."
  id: "Artikel Wikipedia bahasa Inggris tentang Adham Pasha sang Marsekal; hanya digunakan untuk fakta entitas. Artikel itu memberinya posisi sebagai wakil Osman Nuri Pasha di Belvina dan komandan tentara yang mengalahkan Yunani di Thessaly pada tahun 1897, secara eksplisit membedakannya dari wazir Ibrahim Adham Pasha."
