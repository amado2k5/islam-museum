reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by revision id with content verified identical. The article names no religion or school for him personally: its text says he was born to a Muslim Turkish family at Trabzon — his family background, which does not attest his own affiliation — and its infobox carries no religion field. The infobox is internally inconsistent: it gives birth year 1844 and Trabzon as birthplace, a death template implying birth in 1851, and Constantinople as death place, while its own text says he died in Egypt and was buried at Constantinople in 1909. Its cited source for the life is the TDV İslâm Ansiklopedisi entry Gazi Edhem Paşa."
