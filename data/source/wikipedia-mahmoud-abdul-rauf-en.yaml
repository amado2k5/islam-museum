summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمود عبد الرؤوف: مولده في غولفبورت سنة 1969 باسم كريس جاكسون، ومسيرته الجامعية والاحترافية، واعتناقه الإسلام وتغيير اسمه سنة 1993، واحتجاجه على النشيد الوطني سنة 1996 وإيقافه ثم التسوية، ومسيرته اللاحقة في أنحاء العالم."
  en: "The English Wikipedia article on Mahmoud Abdul-Rauf: his birth in Gulfport in 1969 as Chris Jackson, his college and professional career, his conversion to Islam and 1993 name change, his 1996 national-anthem protest, suspension and settlement, and his later career around the world."
  es: "El artículo de la Wikipedia en inglés sobre Mahmoud Abdul-Rauf: su nacimiento en Gulfport en 1969 como Chris Jackson, su etapa universitaria y profesional, su conversión al Islam y el cambio de nombre en 1993, su protesta durante el himno nacional en 1996, su suspensión y el acuerdo alcanzado, y su posterior carrera profesional por todo el mundo."
  fr: "L'article de Wikipédia en anglais sur Mahmoud Abdul-Rauf: sa naissance à Gulfport en 1969 sous le nom de Chris Jackson, ses études universitaires et sa carrière professionnelle, sa conversion à l'islam et son changement de nom en 1993, sa protestation contre l'hymne national en 1996, sa suspension et l'accord qu'il a pris, et sa carrière ultérieure à travers le monde."
  ur: "محمود عبدالرؤف پر انگریزی ویکیپیڈیا کا مضمون: کرس جیکسن کے طور پر 1969 میں گلف پورٹ میں اس کی پیدائش، اس کا کالج اور پیشہ ورانہ کیریئر، اس کا اسلام قبول کرنا اور 1993 میں نام کی تبدیلی، اس کا 1996 کا قومی ترانہ احتجاج، معطلی اور تصفیہ، اور دنیا بھر میں اس کے بعد کا کیریئر۔"
  tr: "Mahmoud Abdel Raouf hakkında İngilizce Wikipedia makalesi: 1969'da Gulfport'ta Chris Jackson olarak doğması, üniversite ve profesyonel kariyeri, 1993'te İslam'a geçişi ve adını değiştirmesi, 1996'da milli marşa karşı protestosu, askıya alınması ve ardından kabul edilmesi ile dünya çapındaki kariyeri."
  id: "Artikel Wikipedia bahasa Inggris tentang Mahmoud Abdel Raouf: Kelahirannya di Gulfport pada tahun 1969 sebagai Chris Jackson, karier universitas dan profesionalnya, konversinya ke Islam dan mengganti namanya pada tahun 1993, protesnya terhadap lagu kebangsaan pada tahun 1996, penangguhan dan penyelesaiannya, serta kariernya di seluruh dunia."
