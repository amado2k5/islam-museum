label:
  ar: "محمد أبو الفرج العش، «كنز أم حجرة الفضي: ساساني، عربي ساساني، أموي، عباسي، محفوظ في المتحف الوطني بدمشق»، الطبعة الأولى، دمشق: المديرية العامة للآثار والمتاحف، 1972"
  en: "Muhammad Abu al-Faraj al-Ush, Kanz Umm Hajara al-fiddi [The Umm Hajara silver hoard: Sasanian, Arab-Sasanian, Umayyad, Abbasid, in the National Museum, Damascus], 1st ed., Damascus: Directorate-General of Antiquities and Museums, 1972"
summary:
  ar: "دراسة لكنز من 409 دراهم فضية وُجد قرب قرية أم حجرة شمالي الحسكة وسُلّم إلى المديرية العامة للآثار والمتاحف سنة 1970."
  en: "A study of a hoard of 409 silver dirhams found near the village of Umm Hajara north of al-Hasaka and handed to the Directorate-General of Antiquities and Museums in 1970."
  es: "Estudio de un tesoro de 409 dirhams de plata hallado cerca del pueblo de Umm Hajara, al norte de al-Hasaka, y entregado a la Dirección General de Antigüedades y Museos en 1970."
  fr: "Une étude d'un trésor de 409 dirhams d'argent trouvé près du village d'Umm Hajara au nord d'al-Hasaka et remis à la Direction générale des antiquités et des musées en 1970."
  ur: "409 چاندی کے درہم کے ذخیرے کا مطالعہ جو الحساکہ کے شمال میں ام حجرہ گاؤں کے قریب پایا گیا اور 1970 میں ڈائریکٹوریٹ جنرل آف نوادرات اور عجائب گھر کے حوالے کیا گیا۔"
  tr: "Hasekah'ın kuzeyindeki um Hajrah köyü yakınlarında bulunan 409 gümüş dirhem değerindeki bir hazinenin incelenmesi, 1970 yılında Antikalar ve Müzeler Genel Müdürlüğü'ne teslim edilmiştir."
  id: "Sebuah studi tentang harta senilai 409 dirham perak yang ditemukan di dekat desa um Hajrah di utara Hasakah diserahkan kepada Direktorat Jenderal Antik dan Museum pada tahun 1970."
