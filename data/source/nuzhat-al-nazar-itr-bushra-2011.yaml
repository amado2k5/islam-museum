reliability_note: "Classical Shafi'i hadith-methodology text (author d. 852 AH, public domain); Nur al-Din 'Itr's apparatus (preface, introduction, headings, notes) is copyrighted, so only facts and short attributed quotations are taken. Copy used: harvest item hadith-sciences/nukhbat-fikar/sharahnukhba (153 PDF pages, OCR text). Title pages PDF pp. 1–2, imprint p. 3 (1432/2011, 152 pages). PRINTED PAGE = PDF PAGE − 1 (checked pp. 6, 10, 23, 34, 41, 55, 72); citations give the PRINTED page. The editor's preface is pp. 5–6, the life of Ibn Hajar pp. 9–17, his method pp. 18–21, manuscripts pp. 22–23, the editing pp. 24–26, manuscript photographs pp. 27–31 (OCR noise), the text from p. 33. The al-Bushra publisher notes (pp. 24–25) that it departed from 'Itr's layout in places (base text in red, no separate matn at the end); the page references inside 'Itr's own introduction refer to his earlier pagination, not to this printing."
