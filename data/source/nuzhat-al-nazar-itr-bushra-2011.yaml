  en: "Sharh Nukhbat al-Fikar: Nuzhat al-Nazar fi Tawdih Nukhbat al-Fikar fi Mustalah Ahl al-Athar — Ibn Hajar al-'Asqalani, ed. Nur al-Din 'Itr, Maktabat al-Bushra, Karachi 2011"
summary:
  ar: "طبعة مكتبة البشرى (كراتشي، 1432هـ/2011م، «طبعة جديدة مصححة ملونة»، 152 صفحة) لشرح ابن حجر على متنه «نخبة الفكر»، بتحقيق نور الدين عتر على نسخة قرئت على المؤلف؛ فيها خطبة المحقق، وترجمة ابن حجر، ومنهجه في الكتاب، ووصف النسخ الخطية وعمل المحقق، ثم نص الشرح ممزوجاً بالمتن مع عناوين المحقق بين معقوفين وتعليقاته في الحاشية."
  en: "The Maktabat al-Bushra printing (Karachi, 1432 AH/2011 CE, 'new corrected colour edition', 152 pages) of Ibn Hajar's commentary on his own Nukhbat al-Fikar, edited by Nur al-Din 'Itr from a manuscript read to the author; it holds the editor's preface, a life of Ibn Hajar, an account of his method, a description of the manuscripts and of the editing, then the commentary merged with the base text, with the editor's headings in square brackets and his notes in the footnotes."
