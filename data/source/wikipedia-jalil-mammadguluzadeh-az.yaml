summary:
  ar: مقالة ويكيبيديا الأذربيجانية عن جليل ممدقولوزاده؛ تُستخدم لوقائع الكيان فقط. مقالة طويلة تعطي مولده في نخجوان في 22 فبراير 1869 مع حفظ قراءة 1866 عند بعض المصادر، وتنقل حرفيًا شهادة تخرجه من معهد غوري سنة 1887، وتروي بالتفصيل تدريسه ومجلة «ملا نصر الدين» ومسيرته الأدبية.
  en: Azerbaijani Wikipedia article on Jalil Mammadguluzadeh; used for entity facts only. A long article giving his birth at Nakhchivan on 22 February 1869 (10 February Old Style) while preserving the 1866 reading of some sources, quoting his 1887 Gori seminary graduation certificate verbatim, and recounting his teaching, the Molla Nasreddin magazine and his literary career in detail.
  es: "Artículo de la Wikipedia en azerbaiyano sobre Jalil Mammadguluzadeh; utilizado únicamente para datos sobre la persona. Un extenso artículo que indica su nacimiento en Najicheván el 22 de febrero de 1869 (10 de febrero según el calendario antiguo), conservando la lectura de 1866 de algunas fuentes, citando textualmente su certificado de graduación del seminario de Gori de 1887 y relatando en detalle su labor docente, la revista Molla Nasreddin y su trayectoria literaria."
  fr: "Article Wikipédia azerbaïdjanais sur Jalil Mammadguluzadeh; utilisé uniquement pour les informations sur l’entité. Cet article détaillé indique sa naissance à Nakhitchevan le 22 février 1869 (10 février, ancien style), tout en conservant la date de 1866 mentionnée dans certaines sources. Il cite textuellement son certificat de fin d’études du séminaire de Gori (1887) et relate en détail son enseignement, la revue Molla Nasreddin et sa carrière littéraire."
  ur: "جلیل ممد گلزادہ پر آذربائیجانی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 22 فروری 1869 کو نخچیوان میں ان کی پیدائش کا ایک طویل مضمون ⁦(10 فروری پرانا انداز)⁩ کچھ ذرائع کے 1866 کے پڑھنے کو محفوظ کرتے ہوئے، اس کے 1887 کے گوری مدرسے کے گریجویشن سرٹیفکیٹ کا لفظی حوالہ دیتے ہوئے، اور ان کی تدریس، مولا نصرالدین میگزین اور ان کے ادبی کیریئر کا تفصیل سے ذکر کیا۔"
  tr: "Celil Mamdquluzadeh hakkında Azerbaycan Vikipedi makalesi; sadece varlığın gerçekleri için kullanılmıştır. 22 Şubat 1869'da Nahçıvan'da doğduğunu anlatan uzun bir makale, bazı kaynaklarda 1866 okumasını ezberleyerek, 1887'de Ghori Enstitüsü'nden mezuniyet belgesini kelimenin tam anlamıyla alıntılayarak, öğretimi, \"Mulla Nasruddin\" dergisi ve edebi kariyerini detaylandırmaktadır."
  id: "Artikel Wikipedia Azerbaijan tentang Jalil Mamdquluzadeh; hanya digunakan untuk fakta entitas. Sebuah artikel panjang yang menyebutkan kelahirannya di Nakhchivan pada 22 Februari 1869, sambil menghafal bacaan tahun 1866 dalam beberapa sumber, secara harfiah mengutip sertifikat kelulusannya dari Institut Ghori pada tahun 1887, dan merinci pengajarannya, majalah \"Mulla Nasruddin,\" serta karier sastranya."
