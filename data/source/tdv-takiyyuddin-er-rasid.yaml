  ar: "مدخل «تقي الدين الراصد» في موسوعة TDV الإسلامية بقلم حسين غازي توبدمير (المجلد 39، إسطنبول 2010، ص 454–456). يتناول نشأته وتعليمه ومنصبه بوصفه منجماً باشياً، ورصدخانة إسطنبول، وأعماله في الرياضيات والبصريات والآلات."
  en: "The TDV İslâm Ansiklopedisi entry 'TAKIYYÜDDİN er-RÂSID' by Hüseyin Gazi Topdemir (vol. 39, Istanbul 2010, pp. 454–456). It covers his life and training, his post as müneccimbaşı, the Istanbul observatory, and his works in mathematics, optics and instruments."
