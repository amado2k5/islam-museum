reliability_note: "Read on 1 November 2026 in the web edition: the biography, the Istanbul observatory and its closure in full; the works list read through its fifteenth item. The printed range 454–456 is taken from the page's own line. The remaining works and the bibliography were not read. The entry dates the Istanbul observatory from 985 AH (1577), while the Samarkand entry gives 1575; both are recorded in the job file. Facts are rewritten in the museum's own words."
