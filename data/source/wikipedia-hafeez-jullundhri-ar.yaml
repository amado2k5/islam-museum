summary:
  ar: "مقالة ويكيبيديا العربية عن حفيظ جالندهري؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 14 كانون الثاني 1900 ووفاته في 21 كانون الأول 1982 في لاهور، وتسجل سنتي مولده ووفاته الهجريتين ⁦(1317 و1403 هـ)⁩ وتصفه بأنه مؤلف النشيد الوطني الباكستاني و«شاهنامة الإسلام»."
  en: "Arabic Wikipedia article on Hafeez Jullundhri; used for entity facts only. It gives his birth on 14 January 1900 and his death on 21 December 1982 in Lahore, records the Hijri years of his birth and death (1317 and 1403 AH) in its lead and categories, and describes him as the author of Pakistan's national anthem and of the Shahnama-e-Islam."
  es: "Artículo de Wikipedia en árabe sobre Hafeez Jullundhri; utilizado únicamente para datos biográficos. Indica que nació el 14 de enero de 1900 y falleció el 21 de diciembre de 1982 en Lahore, registra los años Hijri de su nacimiento y muerte (1317 y 1403 AH) en su introducción y categorías, y lo describe como el autor del himno nacional de Pakistán y del Shahnama-e-Islam."
  fr: "Article de Wikipédia en arabe sur Hafeez Jullundhri; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 14 janvier 1900 et sa mort le 21 décembre 1982 à Lahore, mentionne les années hégiriennes de sa naissance et de sa mort (1317 et 1403 AH) dans son introduction et ses catégories, et le décrit comme l'auteur de l'hymne national du Pakistan et du Shahnama-e-Islam."
  ur: "حفیظ جالندھری پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 14 جنوری 1900 کو ان کی پیدائش اور 21 دسمبر 1982 کو لاہور میں ان کی وفات کا ذکر کرتا ہے، ان کی پیدائش اور وفات کے ہجری سال ⁦(1317 اور 1403 ہجری)⁩ کو اپنی برتری اور زمروں میں درج کرتا ہے، اور انہیں پاکستان کے قومی ترانے اور شاہنامہ اسلام کے مصنف کے طور پر بیان کرتا ہے۔"
  tr: "Hafiz Celendhari hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 14 Ocak 1900'de ve 21 Aralık 1982'de Lahor'da vefat ettiğini belirtir, doğum ve ölüm yıllarının ikisini (1317 ve 1403 Hicri) kaydeder ve onu Pakistan milli marşı ile 'İslam'ın Şehnamesi'nin yazarı olarak tanımlar."
  id: "Artikel Wikipedia bahasa Arab tentang Hafeez Jalandhari; digunakan hanya untuk fakta entitas. Artikel ini menyebutkan kelahirannya pada 14 Januari 1900, dan kematiannya pada 21 Desember 1982 di Lahore, mencatat dua tahun kelahiran dan kematian Hijriyah (1317 dan 1403 H), serta menggambarkannya sebagai penulis lagu kebangsaan Pakistan dan 'Shahnameh Islam.'"
