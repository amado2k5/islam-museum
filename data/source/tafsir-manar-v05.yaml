label: { ar: "تفسير المنار، المجلد الخامس", en: "Tafsir al-Manar, volume 5" }
summary:
  ar: "المجلد الخامس من تفسير المنار لمحمد رشيد رضا، يبدأ بتفسير الآية 24 من سورة النساء، وفيه الكلام في المحصنات وما ملكت الأيمان والسبي في الحرب الدينية، بتحقيق إبراهيم شمس الدين."
  en: "Volume 5 of Rashid Rida's Tafsir al-Manar, opening with the commentary on Q. 4:24, including the discussion of married women, those whom the right hand possesses, and captives taken in a religious war. Edited by Ibrahim Shams al-Din."
  es: "Volumen 5 del Tafsir al-Manar de Rashid Rida, que comienza con el comentario sobre el Corán 4:24, incluyendo el análisis de las mujeres casadas, aquellas a quienes posee la mano derecha y los cautivos tomados en una guerra religiosa. Editado por Ibrahim Shams al-Din."
  fr: "Cinquième volume du Tafsir al-Manar de Rashid Rida, s'ouvrant sur le commentaire du verset 24 de la sourate 4, et abordant notamment la question des femmes mariées, des personnes soumises à la main droite et des captifs faits lors d'une guerre religieuse. Édité par Ibrahim Shams al-Din."
  ur: "رشید ردا کی تفسیر المنار کی جلد 5، سوال 4:24 کی تفسیر کے ساتھ شروع ہوتی ہے، جس میں شادی شدہ عورتوں، دائیں ہاتھ والوں اور مذہبی جنگ میں قیدیوں کی بحث بھی شامل ہے۔ جس کی تدوین ابراہیم شمس الدین نے کی۔"
  tr: "Muhammed Reşid Rida'nın Tafsir al-Manar'ın beşinci cildi, En-Nisa Suresi'nin 24. ayetinin yorumuyla başlar; burada iffetli kadınlar, dini savaşta yeminler ve esaret neler taşıdığı ele alınır; bu ayet İbrahim Şemseddin tarafından düzenlenmiştir."
  id: "Jilid kelima Tafsir al-Manar karya Muhammad Rashid Rida dimulai dengan penafsiran ayat 24 Surah An-Nisa, membahas wanita suci, apa yang dimiliki sumpah dan penawanan dalam perang agama, disunting oleh Ibrahim Shams al-Din."
title: "تفسير القرآن الحكيم المشهور بتفسير المنار، المجلد الخامس"
