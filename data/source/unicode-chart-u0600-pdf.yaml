  ar: "الصفحة «Unicode Standard chart U0600 (Arabic), version 18.0.0» في Unicode Consortium؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: الحروف الطباعية والطباعة العربية وكتلة يونيكود العربية."
  en: "The page \"Unicode Standard chart U0600 (Arabic), version 18.0.0\" (Unicode Consortium), named in a research file supplied to the museum on 21 November 2026; the museum did not open the page, and the founder approved using the file without re-verification. Used for: Arabic typography and the Unicode Arabic block."
  ur: "صفحہ «Unicode Standard chart U0600 (Arabic), version 18.0.0» (Unicode Consortium)؛ یہ عجائب گھر کو 21 نومبر 2026ء کو دی گئی تحقیقی فائل میں مذکور ہے، عجائب گھر نے صفحہ نہیں کھولا اور بانی نے دوبارہ تصدیق کے بغیر فائل کے استعمال کی منظوری دی۔ استعمال: عربی ٹائپوگرافی اور یونی کوڈ کا عربی بلاک۔"
  fr: "La page « Unicode Standard chart U0600 (Arabic), version 18.0.0 » (Unicode Consortium), citée dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisée pour : la typographie arabe et le bloc arabe d'Unicode."
  es: "La página «Unicode Standard chart U0600 (Arabic), version 18.0.0» (Unicode Consortium), citada en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el archivo sin volver a verificar. Usada para: la tipografía árabe y el bloque árabe de Unicode."
  tr: "Unicode Konsorsiyumu'nda \"Unicode Standard chart U0600 (Arapça), sürüm 18.0.0\" sayfası; 21 Kasım 2026'da müzeye sunulan bir araştırma dosyasında belirtilmiştir. Müze sayfayı açmamış ve kurucu dosyanın kullanımını geri alma olmadan onaylamıştır. Kullanım alanı: yazı tipleri, Arapça baskı ve Arap Unicode bloğu."
  id: "Halaman \"Unicode Standard chart U0600 (Arab), versi 18.0.0\" di Unicode Consortium; disebutkan dalam file penelitian yang dikirim ke museum pada 21 November 2026. Museum tidak membuka halaman tersebut, dan pendiri menyetujui penggunaan file tersebut tanpa verifikasi ulang. Digunakan dalam: jenis huruf, pencetakan Arab, dan blok Unicode Arab."
