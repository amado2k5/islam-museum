summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد مصالي الحاج؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بتلمسان في 16 مايو 1898 ووفاته بباريس في 3 يونيو 1974 ودفنه بمقبرة الشيخ السنوسي بتلمسان، وتأسيسه نجم شمال إفريقيا وحزب الشعب وحركة الانتصار والحركة الوطنية. وتقول عنه شخصيًا إنه «كان من الطريقة الدرقاوية» (عن جان-بيار شارل)."
  en: "Arabic Wikipedia article on Ahmed Messali Hadj; used for entity facts only. It gives his birth at Tlemcen on 16 May 1898, death in Paris on 3 June 1974 and burial in the Shaykh al-Sanusi cemetery at Tlemcen, and his founding of the Étoile nord-africaine, the PPA, the MTLD and the MNA. Of him personally it states that he 'was of the Darqawiyya order', in a passage sourced to Jean-Pierre Charles."
