summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد مصالي الحاج؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بتلمسان في 16 مايو 1898 ووفاته بباريس في 3 يونيو 1974 ودفنه بمقبرة الشيخ السنوسي بتلمسان، وتأسيسه نجم شمال إفريقيا وحزب الشعب وحركة الانتصار والحركة الوطنية. وتقول عنه شخصيًا إنه «كان من الطريقة الدرقاوية» ⁦(عن جان-بيار شارل)⁩."
  en: "Arabic Wikipedia article on Ahmed Messali Hadj; used for entity facts only. It gives his birth at Tlemcen on 16 May 1898, death in Paris on 3 June 1974 and burial in the Shaykh al-Sanusi cemetery at Tlemcen, and his founding of the Étoile nord-africaine, the PPA, the MTLD and the MNA. Of him personally it states that he 'was of the Darqawiyya order', in a passage sourced to Jean-Pierre Charles."
  es: "Artículo de Wikipedia en árabe sobre Ahmed Messali Hadj; utilizado únicamente para datos biográficos. Indica su nacimiento en Tlemcen el 16 de mayo de 1898, su fallecimiento en París el 3 de junio de 1974 y su sepultura en el cementerio Shaykh al-Sanusi de Tlemcen, así como la fundación de la Étoile nord-africaine, la PPA, la MTLD y la MNA. Sobre su persona, se afirma que «pertenecía a la orden Darqawiyya», según un pasaje atribuido a Jean-Pierre Charles."
  fr: "Article de Wikipédia en arabe sur Ahmed Messali Hadj; utilisé uniquement pour les informations relatives à l’entité. Il indique sa naissance à Tlemcen le 16 mai 1898, son décès à Paris le 3 juin 1974 et son inhumation au cimetière Cheikh al-Sanusi de Tlemcen, ainsi que la fondation de l’Étoile nord-africaine, du PPA, du MTLD et du MNA. À son sujet, il est précisé qu’il « appartenait à l’ordre Darqawiyya », une information attribuée à Jean-Pierre Charles."
  ur: "احمد میسلی حج پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 16 مئی 1898 کو ٹیلمسن میں ان کی پیدائش، 3 جون 1974 کو پیرس میں موت اور ٹیلمسن کے شیخ السنوسی قبرستان میں تدفین، اور اس کی Étoile nord-africaine، PPA، MTLD اور MNA کی بنیاد رکھی گئی۔ ان کے بارے میں ذاتی طور پر یہ بیان کیا گیا ہے کہ وہ 'درقاویہ کے حکم سے تھے'، جین پیئر چارلس کے حوالے سے ایک حوالے سے۔"
  tr: "Ahmed Messali Al-Hajj hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılır. Bu makalede 16 Mayıs 1898'de Tlemcen'de doğmuş, 3 Haziran 1974'te Paris'te ölmüş, Tlemcen'deki Sheikh Sanussi mezarlığında defnedilmiş ve Kuzey Afrika yıldızı olarak kurulmuş, Halk Partisi, Zafer Hareketi ve ulusal hareket olarak kurulmuştur. Kişisel olarak onun \"Darqawiya tarikatından\" olduğu (Jean-Pierre Charles'tan) söylenmektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang Ahmed Messali Al-Hajj hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Tlemcen pada 16 Mei 1898, kematiannya di Paris pada 3 Juni 1974, pemakamannya di pemakaman Sheikh Sanussi di Tlemcen, dan pendiriannya sebagai bintang Afrika Utara, Partai Rakyat, Gerakan Kemenangan, dan gerakan nasional. Artikel ini menyatakan tentang dirinya secara pribadi bahwa dia \"berasal dari ordo Darqawiya\" (dari Jean-Pierre Charles)."
