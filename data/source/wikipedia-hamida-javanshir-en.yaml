summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حميدة جوانشير؛ تُستخدم لوقائع الكيان فقط. تروي ميلادها في كهريزلي سنة 1873 وتعليمها المنزلي، وزواجها الأول من داوتداروف ووفاته، ولقاءها جليل محمد قلي زاده في تفليس سنة 1905 وزواجهما سنة 1907، وعملها في مجلة «ملا نصر الدين»، ومدرستها المختلطة (1908)، وجمعية نساء القوقاز المسلمات الخيرية (1910)، ووفاتها في باكو سنة 1955. لا تذكر شيئًا عن مذهبها الشخصي."
  en: "English Wikipedia article on Hamida Javanshir; used for entity facts only. It recounts her birth at Kahrizli in 1873 and home education, her first marriage to Davatdarov and his death, her meeting Jalil Mammadguluzadeh at Tiflis in 1905 and their marriage in 1907, her work on Molla Nasreddin, her coeducational school (1908), the Muslim Women's Caucasian Benevolent Society (1910), and her death at Baku in 1955. It makes no statement about her personal school of religion."
