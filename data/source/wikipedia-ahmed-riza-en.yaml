reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full at revision 1378306443 on 26 October 2026. It gives the birth year as 1858 while citing the Atatürk Encyclopedia entry headed 1858/1859, and the Arabic article and Wikidata give 1859 — the split is stated in the record. On religion it gives a philosophy, not a school: his professed positivism, his service as the Société Positiviste Muslim/Ottoman representative, and his opponents accusations of atheism; it also reports him condemning the Hamidian massacres as contrary to Islam and the Qurʾan."
