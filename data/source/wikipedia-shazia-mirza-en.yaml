reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Used for her birth in Birmingham as the eldest daughter of Punjabi Pakistani parents, her biochemistry degree at Manchester and PGCE at Goldsmiths, her years as a science teacher (including teaching Dylan Mills, later Dizzee Rascal), her stand-up career and shows (The Kardashians Made Me Do It; Coconut), her columns for The Guardian, New Statesman, The Daily Telegraph, the Financial Times and Dawn, her place among the BBC's 100 Women of 2013, and her 2025 EastEnders role. The infobox pointedly carries no birth date, with an editor's note that her date of birth 'has been frequently altered without citation', and the article files her under 'Year of birth missing (living people)' and '1970s births'. Much of her act and writing is framed around her life as a Muslim woman, but the article names no school or order for her."
