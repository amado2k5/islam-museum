summary:
  ar: "قناة برنامج «هدى للناس» على يوتيوب (@huda_lennas)؛ يقول وصفها: «هدى للناس | د. أحمد عبد المنعم، هو برنامج تبسيط القرآن لهداية الناس، تفسير مبسط باستخدام مصطلحات سهلة»، وفيها حلقات تفسيره المرقمة."
  en: "The YouTube channel of the 'Huda li'l-Nas' (Guidance for the People) programme (@huda_lennas); its description reads 'Huda li'l-Nas | Dr Ahmed Abdel Monem — a programme simplifying the Quran to guide people, a simplified exegesis in easy terms', and it carries his numbered exegesis episodes."
  es: "El canal de YouTube del programa 'Huda li'l-Nas' (Guía para el Pueblo) (@huda_lennas); su descripción dice 'Huda li'l-Nas | Dr. Ahmed Abdel Monem: un programa que simplifica el Corán para guiar a la gente, una exégesis simplificada en términos sencillos', y contiene sus episodios de exégesis numerados."
  fr: "La chaîne YouTube du programme « Huda li'l-Nas » (Guidance pour le peuple) (@huda_lennas); sa description indique « Huda li'l-Nas | Dr Ahmed Abdel Monem — un programme simplifiant le Coran pour guider les gens, une exégèse simplifiée en termes simples », et elle diffuse ses épisodes d'exégèse numérotés."
  ur: "'ہدا ل الناس' ⁦(لوگوں کے لیے رہنمائی)⁩ پروگرام کا یوٹیوب چینل (@huda_lennas)؛ اس کی تفصیل پڑھتی ہے 'ہُدا لِل الناس | ڈاکٹر احمد عبدالمنیم - لوگوں کی رہنمائی کے لیے قرآن کو آسان بنانے والا ایک پروگرام، آسان الفاظ میں ایک آسان تفسیر'، اور اس میں ان کی نمبری تفسیر کی اقساط شامل ہیں۔"
