summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ساليف كيتا لاعب كرة القدم (1946–2023)؛ تُستخدم لوقائع الكيان فقط. تروي مسيرة المهاجم المالي المولود في 6 ديسمبر 1946 بباماكو والمتوفى في 2 سبتمبر 2023: ريال باماكو وسانت إتيان ومرسيليا وفالنسيا وسبورتينغ، وأول فائز بجائزة أفضل لاعب أفريقي سنة 1970، ولقبه «النمر الأسود». لا تذكر ديانته في أي موضع. وهو غير الموسيقي ساليف كيتا (مواليد 1949)."
  en: "English Wikipedia article on Salif Keïta the footballer (1946–2023); used for entity facts only. It records the Malian striker born 6 December 1946 at Bamako and died 2 September 2023: Real Bamako, Saint-Étienne, Marseille, Valencia and Sporting CP, the first African Footballer of the Year in 1970, nicknamed the 'Black Panther'. It makes no statement of his religion anywhere. He is not the musician Salif Keita (born 1949)."
