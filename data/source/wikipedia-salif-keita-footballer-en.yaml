summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ساليف كيتا لاعب كرة القدم (1946–2023)؛ تُستخدم لوقائع الكيان فقط. تروي مسيرة المهاجم المالي المولود في 6 ديسمبر 1946 بباماكو والمتوفى في 2 سبتمبر 2023: ريال باماكو وسانت إتيان ومرسيليا وفالنسيا وسبورتينغ، وأول فائز بجائزة أفضل لاعب أفريقي سنة 1970، ولقبه «النمر الأسود». لا تذكر ديانته في أي موضع. وهو غير الموسيقي ساليف كيتا ⁦(مواليد 1949)⁩."
  en: "English Wikipedia article on Salif Keïta the footballer (1946–2023); used for entity facts only. It records the Malian striker born 6 December 1946 at Bamako and died 2 September 2023: Real Bamako, Saint-Étienne, Marseille, Valencia and Sporting CP, the first African Footballer of the Year in 1970, nicknamed the 'Black Panther'. It makes no statement of his religion anywhere. He is not the musician Salif Keita (born 1949)."
  es: "Artículo de la Wikipedia en inglés sobre el futbolista Salif Keïta (1946-2023); utilizado únicamente para datos biográficos. Describe al delantero maliense nacido el 6 de diciembre de 1946 en Bamako y fallecido el 2 de septiembre de 2023: Real Bamako, Saint-Étienne, Marsella, Valencia y Sporting CP, primer Futbolista Africano del Año en 1970, apodado la «Pantera Negra». No menciona su religión en ningún momento. No se trata del músico Salif Keita (nacido en 1949)."
  fr: "Article Wikipédia en anglais sur Salif Keïta, le footballeur (1946-2023); utilisé uniquement à titre informatif. Il mentionne l'attaquant malien né le 6 décembre 1946 à Bamako et décédé le 2 septembre 2023: Real Bamako, Saint-Étienne, Marseille, Valence et Sporting CP, premier Ballon d'Or africain en 1970, surnommé la « Panthère noire ». L'article ne fait aucune mention de sa religion. Il ne s'agit pas du musicien Salif Keita (né en 1949)."
