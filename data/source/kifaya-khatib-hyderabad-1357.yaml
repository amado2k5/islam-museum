label:
  ar: "الكفاية في علم الرواية — الخطيب البغدادي، طبعة دائرة المعارف العثمانية، حيدر آباد الدكن 1357هـ"
  en: "al-Kifaya fi Ilm al-Riwaya — al-Khatib al-Baghdadi, Da'irat al-Ma'arif al-Uthmaniyya edition, Hyderabad Deccan 1357 AH"
summary:
  ar: "«الكفاية في علم الرواية» لأبي بكر أحمد بن علي بن ثابت الخطيب البغدادي ⁦(ت 463هـ)⁩، طبعة جمعية دائرة المعارف العثمانية بحيدر آباد الدكن، تم طبعها يوم الأربعاء عاشر شعبان سنة 1357هـ، عن نسخة المكتبة الآصفية بحيدر آباد ⁦(رمزها «صف»)⁩ ونسخة مصورة من إستانبول ⁦(رمزها «قط»)⁩، صححها أبو عبد الله السورتي ثم مصححو الدائرة ومنهم السيد هاشم الندوي وعبد الرحمن بن يحيى اليماني، ونظر فيها ثانية محمود حسن صاحب «معجم المصنفين». في آخرها فهرس الأبواب وترجمة للمؤلف."
  en: "al-Kifaya fi Ilm al-Riwaya by Abu Bakr Ahmad ibn Ali ibn Thabit al-Khatib al-Baghdadi (d. 463 AH), printed by the Da'irat al-Ma'arif al-Uthmaniyya society, Hyderabad Deccan, completed Wednesday 10 Sha'ban 1357 AH, from the Asafiyya Library manuscript ⁦(siglum 'صف')⁩ and a photographed Istanbul manuscript ⁦(siglum 'قط')⁩; corrected by Abu Abd Allah al-Surti, then by the society's correctors including al-Sayyid Hashim al-Nadwi and Abd al-Rahman ibn Yahya al-Yamani, with a second reading by Mahmud Hasan, author of Mu'jam al-Musannifin. It ends with an index of chapters and a biography of the author."
  es: "al-Kifaya fi Ilm al-Riwaya de Abu Bakr Ahmad ibn Ali ibn Thabit al-Khatib al-Baghdadi (m. 463 AH), impreso por la sociedad Da'irat al-Ma'arif al-Uthmaniyya, Hyderabad Deccan, completado el miércoles 10 Sha'ban 1357 AH, a partir del manuscrito de la Biblioteca Asafiyya ⁦(siglum 'صف')⁩ y un manuscrito de Estambul fotografiado ⁦(siglum 'قط')⁩; corregido por Abu Abd Allah al-Surti, luego por los correctores de la sociedad, incluidos al-Sayyid Hashim al-Nadwi y Abd al-Rahman ibn Yahya al-Yamani, con una segunda lectura de Mahmud Hasan, autor de Mu'jam al-Musannifin. Finaliza con un índice de capítulos y una biografía del autor."
  fr: "L'ouvrage « al-Kifaya fi Ilm al-Riwaya » d'Abu Bakr Ahmad ibn Ali ibn Thabit al-Khatib al-Baghdadi (mort en 463 AH), imprimé par la société Da'irat al-Ma'arif al-Uthmaniyya à Hyderabad (Deccan), fut achevé le mercredi 10 Sha'ban 1357 AH, à partir du manuscrit de la bibliothèque Asafiyya ⁦(sigle « صف »)⁩ et d'un manuscrit d'Istanbul photographié ⁦(sigle « قط »)⁩. Il fut corrigé par Abu Abd Allah al-Surti, puis par les correcteurs de la société, notamment al-Sayyid Hashim al-Nadwi et Abd al-Rahman ibn Yahya al-Yamani, et relu par Mahmud Hasan, auteur de « Mu'jam al-Musannifin ». L'ouvrage se termine par un index des chapitres et une biographie de l'auteur."
