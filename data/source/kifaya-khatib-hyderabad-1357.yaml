label:
  ar: "الكفاية في علم الرواية — الخطيب البغدادي، طبعة دائرة المعارف العثمانية، حيدر آباد الدكن 1357هـ"
  en: "al-Kifaya fi Ilm al-Riwaya — al-Khatib al-Baghdadi, Da'irat al-Ma'arif al-Uthmaniyya edition, Hyderabad Deccan 1357 AH"
summary:
  ar: "«الكفاية في علم الرواية» لأبي بكر أحمد بن علي بن ثابت الخطيب البغدادي ⁦(ت 463هـ)⁩، طبعة جمعية دائرة المعارف العثمانية بحيدر آباد الدكن، تم طبعها يوم الأربعاء عاشر شعبان سنة 1357هـ، عن نسخة المكتبة الآصفية بحيدر آباد ⁦(رمزها «صف»)⁩ ونسخة مصورة من إستانبول ⁦(رمزها «قط»)⁩، صححها أبو عبد الله السورتي ثم مصححو الدائرة ومنهم السيد هاشم الندوي وعبد الرحمن بن يحيى اليماني، ونظر فيها ثانية محمود حسن صاحب «معجم المصنفين». في آخرها فهرس الأبواب وترجمة للمؤلف."
  en: "al-Kifaya fi Ilm al-Riwaya by Abu Bakr Ahmad ibn Ali ibn Thabit al-Khatib al-Baghdadi (d. 463 AH), printed by the Da'irat al-Ma'arif al-Uthmaniyya society, Hyderabad Deccan, completed Wednesday 10 Sha'ban 1357 AH, from the Asafiyya Library manuscript (siglum 'صف') and a photographed Istanbul manuscript (siglum 'قط'); corrected by Abu Abd Allah al-Surti, then by the society's correctors including al-Sayyid Hashim al-Nadwi and Abd al-Rahman ibn Yahya al-Yamani, with a second reading by Mahmud Hasan, author of Mu'jam al-Musannifin. It ends with an index of chapters and a biography of the author."
title: "كتاب الكفاية في علم الرواية"
