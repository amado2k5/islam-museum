summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مهاتير محمد، مراجعة 19 أكتوبر 2026؛ تُستخدم لوقائع الكيان فقط، ويُستشهد بكل واقعة بمصدرها كما ذكرته المقالة. تقول إن آراءه تشكّلها قوميته الملايوية ومعتقداته الإسلامية، دون أن تسمّي مدرسة، وتسجل وفاة زوجته سيتي حازمة سنة 2026."
  en: "English Wikipedia article on Mahathir Mohamad, revision of 19 October 2026; used for entity facts only, each cited where the article gives its own source. It says his views are shaped by Malay nationalism and Islamic religious beliefs without naming a school, and records the 2026 death of his wife Siti Hasmah."
  es: "Artículo de la Wikipedia en inglés sobre Mahathir Mohamad, revisado el 19 de octubre de 2026; se utiliza únicamente para datos sobre la persona, citados donde el artículo proporciona su propia fuente. Indica que sus ideas están influenciadas por el nacionalismo malayo y las creencias religiosas islámicas, sin mencionar ninguna escuela, y registra el fallecimiento de su esposa, Siti Hasmah, en 2026."
  fr: "Article de Wikipédia en anglais sur Mahathir Mohamad, mis à jour le 19 octobre 2026; utilisé uniquement pour les informations le concernant, chaque information étant citée lorsque l’article indique sa source. Il y est indiqué que ses opinions sont influencées par le nationalisme malais et les croyances religieuses islamiques, sans mentionner d’école particulière, et il est fait mention du décès de son épouse, Siti Hasmah, en 2026."
  ur: "مہاتیر محمد پر انگریزی ویکیپیڈیا مضمون، 19 اکتوبر 2026 کی نظر ثانی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک کا حوالہ دیا جاتا ہے جہاں مضمون اپنا ماخذ دیتا ہے۔ اس میں کہا گیا ہے کہ ان کے خیالات کو مالائی قوم پرستی اور اسلامی مذہبی عقائد نے کسی اسکول کا نام لیے بغیر تشکیل دیا ہے، اور اس میں ان کی اہلیہ سیتی حسمہ کی 2026 کی موت کو ریکارڈ کیا گیا ہے۔"
