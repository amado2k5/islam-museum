  ar: "مقالة ويكيبيديا الإنجليزية عن إسماعيل كمال (1844-1919)، مؤسس ألبانيا الحديثة وأول رئيس وزرائها؛ تُستخدم لوقائع الكيان فقط. توثّق مسيرته العثمانية ومنفاه ومؤتمر المعارضة 1902 وإعلان الاستقلال في فلوره في 28 نوفمبر 1912 ووفاته في بيروجيا في 26 يناير 1919 ودفنه في تكية البكتاشية بفلوره."
  en: "English Wikipedia article on Ismail Qemali (1844–1919), founder of modern Albania and its first prime minister; used for entity facts only. It documents his Ottoman career, exile, the 1902 Congress of Ottoman Opposition, the Vlorë declaration of independence of 28 November 1912, his death at Perugia on 26 January 1919 and his burial in the Bektashi tekke at Vlorë."
