reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The fullest narrative source. It gives: born 16 January 1844 at Vlorë 'to an Albanian Muslim family' — a statement of family background, not a personal attestation of any school; primary schooling at Vlorë, the Zosimaia School at Ioannina, law at Istanbul; married the Greek Kleoniki Sourmeli; Ottoman civil servant from May 1860, close collaborator of Midhat Pasha, governor of Balkan towns; exiled to western Anatolia after Midhat's dismissal, recalled as governor of Beirut; his 1892 Balkan Confederation plan; governor (wali) of Tripoli, which he viewed as exile; fled by the British ambassador's yacht in May 1900 and lived eight years in exile; the Paris Congress of Ottoman Opposition (1902) and his chairmanship of its new central committee; the 1902–03 coup plot against Abdulhamid II and its failure; the 1907 secret agreement with Greece; deputy for Berat after the 1908 revolution and briefly President of the Ottoman National Assembly during the 31 March incident, afterwards cleared by investigation; the Greçë Memorandum (23 June 1911); organisation of the 1912 revolt; the declaration of independence at Vlorë on 28 November 1912 and his election as head of the Provisional Government, prime minister and foreign minister from 4 December 1912; the intercepted Bekir Fikri plot and his cabinet's resignation in January 1914; wartime exile in Paris and his memoirs, written with Somerville Story; death of an apparent heart attack at Perugia on 26 January 1919 (Wikidata gives 24 January); burial in 'the local tekke of the Bektashi Order' at Vlorë. A burial place is a fact about his funeral, not an attestation of his own affiliation, and is not used as one."
