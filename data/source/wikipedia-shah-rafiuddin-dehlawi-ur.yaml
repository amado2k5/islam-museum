reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It names him Shah Muhammad Rafiuddin, gives his full name as Rafiuddin Abd al-Wahhab on Lakhnawi's authority, pairs his birth and death as 1163/1750 and 1233/1818 on the Urdu Encyclopaedia of Islam (vol. 10, p. 318), makes him a son of Shah Waliullah and younger brother of Shah Abdul Aziz, counts some twenty works to him, and names his literal Urdu translation of the Qur'an, completed in 1200 AH, as his greatest achievement. It describes him as a scholar of dervish character and quotes Hada'iq al-Hanafiyya on his succession to the teaching seat. It names no legal school for him in its text. Checked 1 November 2026."
