summary:
  ar: "مدخل «جمي» في موسوعة TDV الإسلامية: تاريخ السفينة والملاحة الإسلامية والعثمانية، وأقسام رجال السفينة كما أحصاها المسعودي والمقدسي: الناخودة المالك، والربّان أو الرئيس القبطان، والديدبان الرقيب، والمعلّم رجل الخرائط والآلات، والإشتيام دليل الركاب، والنواتية البحّارة وقائدهم."
  en: "The TDV İslâm Ansiklopedisi entry on the ship: the history of Islamic and Ottoman seafaring and shipbuilding, and the ship's officers as al-Mas'udi and al-Maqdisi enumerate them — the nâhudâ owner, the rubbân or reis captain, the dîdebân lookout, the muallim of charts and instruments, the iştiyâm passengers' adviser, and the nevâtiyye crew under their qa'id."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el barco: la historia de la navegación y la construcción naval islámica y otomana, y los oficiales del barco como los enumeran al-Mas'udi y al-Maqdisi: el propietario nâhudâ, el capitán rubbân o reis, el vigía dîdebân, el muallim de cartas e instrumentos, el asesor de pasajeros iştiyâm y la tripulación nevâtiyye bajo su qa'id."
