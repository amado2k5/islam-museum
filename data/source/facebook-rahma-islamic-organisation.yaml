summary:
  ar: "صفحة منظمة الرحمة الإسلامية على فيسبوك، واسمها «ራህማ እስላማዊ ድርጅት የጎዳና ደዕዋ»؛ 240,000 متابع بحسب بيانات وصفية لمنشور على فيسبوك مؤرخ في 19 يناير 2026 قرأها حصاد الموجة 195 في 7 نوفمبر 2026 — جلب صفحات فيسبوك محظور في هذه البيئة، فهذا الرقم ليس قراءة مباشرة في هذه الجولة، ولم يمكن تثبيت الرابط الدقيق للصفحة فلم يُسجَّل أي رابط."
  en: "Rahma Islamic Organisation's Facebook page, named 'ራህማ እስላማዊ ድርጅት የጎዳና ደዕዋ' (Rahma Islamic Organisation — Street Dawah): 240,000 followers by Facebook post metadata on a post dated 19 January 2026, read by the wave-195 harvest on 7 November 2026 — Facebook page fetch is blocked in this environment, so this figure is not a direct read in this run, and the page's exact URL could not be pinned, so no URL is recorded."
  es: "Página de Facebook de la Organización Islámica Rahma, llamada 'ራህማ እስላማዊ ድርጅት የጎዳና ደዕዋ' (Organización Islámica Rahma - Dawah Callejera): 240.000 seguidores según los metadatos de una publicación de Facebook del 19 de enero de 2026, leída por la cosecha wave-195 el 7 de noviembre de 2026. La obtención de páginas de Facebook está bloqueada en este entorno, por lo que esta cifra no es una lectura directa en esta ejecución, y no se pudo fijar la URL exacta de la página, por lo que no se registra ninguna URL."
  fr: "La page Facebook de l'Organisation islamique Rahma, nommée 'ራህማ እስላማዊ ድርጅት የጎዳና ደዕዋ' (Organisation islamique Rahma — Street Dawah): 240 000 abonnés selon les métadonnées d'une publication Facebook datée du 19 janvier 2026, lue par la vague 195 le 7 novembre 2026 — La récupération de pages Facebook étant bloquée dans cet environnement, ce chiffre ne correspond pas à une lecture directe lors de cette exécution, et l'URL exacte de la page n'a pas pu être enregistrée."
  ur: "رحمہ اسلامک آرگنائزیشن کا فیس بک پیج، جس کا نام 'ራህማ እስላማዊ ድርጅት የጎዳና ደዕዋ' ⁦(رحمہ اسلامک آرگنائزیشن — Street Dawah)⁩ کے نام سے ہے: فیس بک پر پوسٹ 240 پر فالو کریں 19 جنوری 2026، 7 نومبر 2026 کو لہر-195 فصل کے ذریعے پڑھا گیا — اس ماحول میں فیس بک پیج کی بازیافت کو بلاک کر دیا گیا ہے، اس لیے یہ اعداد و شمار اس رن میں براہ راست پڑھے جانے والے نہیں ہیں، اور صفحہ کا درست URL پن نہیں کیا جا سکا، اس لیے کوئی URL ریکارڈ نہیں کیا گیا۔"
