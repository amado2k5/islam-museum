reliability_note: "The organisation's own Facebook page and its main channel, named ራህማ እስላማዊ ድርጅት የጎዳና ደዕዋ (Rahma Islamic Organisation — Street Dawah). Facebook profile fetch is blocked in this environment, so the page was NOT opened or read directly in this run: the figure of 240,000 followers rests on the wave-195 harvest's same-day read (7 November 2026) of Facebook post metadata on a post dated 19 January 2026, and that provenance is stated wherever the figure is used; it is never presented as this writer's own read. Web searches in this run on 7 November 2026 for the page's exact URL returned the organisation's TikTok account but no Facebook page URL, so no URL field is recorded here rather than a guessed one. No source read in this run or in the harvest names an owner or head of the organisation, and no founding date is documented. Checked via the harvest read on 7 November 2026."
