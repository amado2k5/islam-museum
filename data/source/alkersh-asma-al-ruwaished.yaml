summary:
  ar: "مدخل «جوال المرأة» في موسوعة الجوال الإسلامي المنشورة في منتديات الشيخ جمال القرش؛ يقدّم الخدمة بأنها «تحت إشراف د. أسماء الرويشد، المشرفة على مؤسسة آسية»، ويعرض قنواتها في الفوائد والتجارب والأفكار الموجهة إلى النساء."
  en: "The 'Women's Mobile' (Jawwal al-Mar'a) entry in the Encyclopaedia of Islamic Mobile Services hosted on the forums of Shaykh Jamal al-Qirsh; it presents the service as running 'under the supervision of Dr Asma Al-Ruwaished, the supervisor of the Asiyah Foundation', with channels of benefits, experiences and ideas addressed to women."
  es: "La entrada \"Móvil para Mujeres\" (Jawwal al-Mar'a) en la Enciclopedia de Servicios Móviles Islámicos alojada en los foros del Shaykh Jamal al-Qirsh; presenta el servicio como operando \"bajo la supervisión de la Dra. Asma Al-Ruwaished, supervisora de la Fundación Asiyah\", con canales de beneficios, experiencias e ideas dirigidas a las mujeres."
  fr: "L'entrée « Mobile des femmes » (Jawwal al-Mar'a) dans l'Encyclopédie des services mobiles islamiques hébergée sur les forums du cheikh Jamal al-Qirsh; elle présente le service comme fonctionnant « sous la supervision du Dr Asma Al-Ruwaished, superviseur de la Fondation Asiyah », avec des canaux d'avantages, d'expériences et d'idées destinés aux femmes."
  ur: "انسائیکلوپیڈیا آف اسلامک موبائل سروسز میں 'خواتین کا موبائل' ⁦(جوال المرع)⁩ کا اندراج شیخ جمال القرش کے فورمز پر ہوسٹ؛ یہ سروس کو 'عاصیہ فاؤنڈیشن کی نگران ڈاکٹر اسماء الروایش کی نگرانی میں' چلانے کے طور پر پیش کرتا ہے، جس میں خواتین کے لیے فوائد، تجربات اور خیالات کے چینلز ہیں۔"
  tr: "İslami Mobil Ansiklopedi'de Şeyh Cemal Al-Qurash'ın forumlarında yayımlanan \"Kadınların Mobil\" başlığı, hizmeti \"Asya Vakfı süpervizörü Dr. Asma Al-Ruwaished'in denetiminde\" olarak sunuyor ve kadınlara yönelik faydalar, deneyimler ve fikirler üzerine kanallarını sunuyor."
  id: "Entri untuk \"Women's Mobile\" dalam Ensiklopedia Bergerak Islam yang diterbitkan di forum Sheikh Jamal Al-Qurash menawarkan layanan ini sebagai \"di bawah pengawasan Dr. Asma Al-Ruwaished, pengawas Asia Foundation,\" dan menyajikan saluran-salurannya tentang manfaat, pengalaman, dan ide yang ditujukan untuk perempuan."
