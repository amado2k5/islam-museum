summary:
  ar: "مدخل «جوال المرأة» في موسوعة الجوال الإسلامي المنشورة في منتديات الشيخ جمال القرش؛ يقدّم الخدمة بأنها «تحت إشراف د. أسماء الرويشد، المشرفة على مؤسسة آسية»، ويعرض قنواتها في الفوائد والتجارب والأفكار الموجهة إلى النساء."
  en: "The 'Women's Mobile' (Jawwal al-Mar'a) entry in the Encyclopaedia of Islamic Mobile Services hosted on the forums of Shaykh Jamal al-Qirsh; it presents the service as running 'under the supervision of Dr Asma Al-Ruwaished, the supervisor of the Asiyah Foundation', with channels of benefits, experiences and ideas addressed to women."
