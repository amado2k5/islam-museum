  fr: "L'élément Wikidata Q186111 concernant Akbar Hashemi Rafsanjani, basé sur les propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Il indique sa date de naissance: le 25 août 1934; sa date de décès: le 8 janvier 2017; et une seule valeur religieuse est mentionnée: l'islam chiite en général (Q9585), sans précision de branche."
  ur: "اکبر ہاشمی رفسنجانی کے لیے Wikidata آئٹم Q186111، انگریزی مضمون کے صفحہ کے پراپس پر مبنی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 25 اگست 1934 اور اس کی موت 8 جنوری 2017 بتاتی ہے، اور ایک ہی مذہب کی قدر، عام طور پر شیعہ اسلام (Q9585)، جس کی کوئی شاخ نہیں ہے۔"
