  ar: "عنصر ويكي بيانات Q186111 لأكبر هاشمي رفسنجاني، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته 25 آب 1934 ووفاته 8 كانون الثاني 2017، وقيمة دين وحيدة هي الشيعة عمومًا (Q9585) بلا فرع مسمّى."
  en: "Wikidata item Q186111 for Akbar Hashemi Rafsanjani, grounded through the English article's pageprops; used for entity facts only. It gives his birth as 25 August 1934 and his death as 8 January 2017, and a single religion value, Shia Islam in general (Q9585), naming no branch."
