summary:
  ar: "مقالة ويكيبيديا العربية عن فتح علي خان خويسكي؛ تُستخدم لوقائع الكيان فقط. تعرض مناصبه بالتواريخ ⁦(رئاسة مجلس الوزراء من 28 مايو 1918 إلى 14 أبريل 1919، ووزارات الداخلية والدفاع والخارجية)⁩ ونشأته في نوخا وأسرته."
  en: "Arabic Wikipedia article on Fatali Khan Khoyski; used for entity facts only. It tabulates his offices with dates (chairman of the Council of Ministers 28 May 1918 – 14 April 1919; interior, defence and foreign ministries) and covers his Nukha origins and family."
  es: "Artículo en árabe de la Wikipedia sobre Fatali Khan Khoyski; se utiliza únicamente para obtener información sobre la persona. En él se detallan sus cargos con las fechas correspondientes (presidente del Consejo de Ministros del 28 de mayo de 1918 al 14 de abril de 1919; ministros del Interior, Defensa y Asuntos Exteriores) y se abordan sus orígenes en Nukha y su familia."
  fr: "Article de Wikipédia en arabe sur Fatali Khan Khoyski; utilisé uniquement pour les informations sur l’entité. Il répertorie ses fonctions avec les dates (président du Conseil des ministres du 28 mai 1918 au 14 avril 1919; ministères de l’Intérieur, de la Défense et des Affaires étrangères) et décrit ses origines nukha et sa famille."
  ur: "فتالی خان خویسکی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کے دفاتر کو تاریخوں کے ساتھ ٹیبل کرتا ہے ⁦(چیئرمین کونسل آف منسٹرز 28 مئی 1918 - 14 اپریل 1919؛ داخلہ، دفاع اور وزارت خارجہ)⁩ اور اس کے نوخا کی اصل اور خاندان کا احاطہ کرتا ہے۔"
