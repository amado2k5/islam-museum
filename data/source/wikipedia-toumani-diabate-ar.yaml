reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026, and its content checked against the recorded revision. It is a short article: it gives his dates (10 August 1965 – 19 July 2024), his Malian kora playing across traditional, flamenco, blues and jazz styles, and its one biographical section covers the October 2008 removal of the Arabic lyrics of 'Tapha Niang' from the game LittleBigPlanet after Muslim objections to its inclusion of verses from the Qur'an, the publisher's week-long delay and recall of discs, and the sale of some original copies in the Middle East and the United States. The article states no religion for him."
