summary:
  ar: "مقالة ويكيبيديا العربية عن محسن الملك؛ تُستخدم لوقائع الكيان فقط. تؤكد التواريخ وخدمته لحيدر آباد ولقبيه منير نواز جنغ ونواب محسن الملك وقربه من السيد أحمد خان."
  en: "Arabic Wikipedia article on Mohsin-ul-Mulk; used for entity facts only. It corroborates the dates, his Hyderabad service, his titles Munir Nawaz Jang and Nawab Mohsin-ul-Mulk, and his closeness to Syed Ahmad Khan."
  es: "Artículo de Wikipedia en árabe sobre Mohsin-ul-Mulk; se utiliza únicamente para datos sobre la persona. Corrobora las fechas, su servicio en Hyderabad, sus títulos Munir Nawaz Jang y Nawab Mohsin-ul-Mulk, y su cercanía con Syed Ahmad Khan."
  fr: "Article de Wikipédia en arabe sur Mohsin-ul-Mulk; utilisé uniquement pour des informations factuelles. Il confirme les dates, son service à Hyderabad, ses titres de Munir Nawaz Jang et de Nawab Mohsin-ul-Mulk, ainsi que sa proximité avec Syed Ahmad Khan."
  ur: "محسن الملک پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں تاریخوں، ان کی حیدرآباد سروس، ان کے لقب منیر نواز جنگ اور نواب محسن الملک، اور سید احمد خان سے ان کی قربت کی تصدیق ہوتی ہے۔"
  tr: "Mohsin al-Mulk hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Tarihler, onun Haydarabad'a hizmetini, Munir Nawaz Jang unvanını, Mohsin'in yardımcılarını ve Sayyid Ahmad Khan ile yakınlığını doğrulamaktadır."
  id: "Artikel Wikipedia Arab tentang Mohsin al-Mulk; hanya digunakan untuk fakta entitas. Tanggal-tanggal tersebut mengonfirmasi pengabdiannya kepada Hyderabad, gelarnya Munir Nawaz Jang, wakil Mohsin dan kedekatannya dengan Sayyid Ahmad Khan."
