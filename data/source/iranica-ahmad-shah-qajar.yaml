reliability_note: "Scholarly encyclopedia entry (Vol. I, Fasc. 6, pp. 657-660), read in full on 26 October 2026; with the English Wikipedia article, one of the record's two text sources for Ahmad Shah. It is a political biography — the regency of Azod-al-molk and then Naser-al-molk, the 1919 agreement, Reza Khan's rise, the republican agitation of 1924 and the deposition votes of 1925 (80 for, 20 abstentions, 5 against) — and it makes no statement of Ahmad Shah's personal religion anywhere. It gives his age at accession as twelve, where the English article gives eleven."
