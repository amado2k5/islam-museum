summary:
  ar: "مدخل موسوعة إيرانيكا «أحمد شاه قاجار» بقلم محمد جواد شيخ الإسلامي؛ يُستخدم لوقائع الكيان. يروي الوصاية بعد جلوسه سنة 1909، والاتفاقية الإنجليزية-الفارسية سنة 1919، وانقلاب 1921، ومغادرته إيران سنة 1923، وتصويت المجلس على خلع القاجاريين في 31 أكتوبر 1925، ووفاته في فرنسا بعد ذلك بأربع سنوات عن اثنتين وثلاثين سنة."
  en: "Encyclopaedia Iranica entry 'Ahmad Shah Qajar' by Mohammad Javad Sheikh-ol-Islami; used for entity facts. It recounts the regency after his accession in 1909, the Anglo-Persian Agreement of 1919, the coup of 1921, his departure from Iran in 1923, the Majlis vote deposing the Qajars on 31 October 1925, and his death in France four years later at the age of thirty-two."
