summary:
  ar: "مقالة ويكيبيديا الألمانية العلمية المفصّلة عن عبدول فراشري؛ تُستخدم لوقائع الكيان فقط. تؤرخ ميلاده في 17 أغسطس 1839 ووفاته في 11 أكتوبر 1892 خلافا للألبانية والإنجليزية والعربية، وتذكر انعقاد جمعية 1878 في تكية فراشر."
  en: "Detailed scholarly German Wikipedia article on Abdyl Frashëri; used for entity facts only. It dates his birth to 17 August 1839 and his death to 11 October 1892 against the Albanian, English and Arabic articles, and records the 1878 assembly held in the Frashër tekke."
  es: "Artículo académico detallado en la Wikipedia en alemán sobre Abdyl Frashëri; utilizado únicamente para datos sobre la persona. En él se fecha su nacimiento el 17 de agosto de 1839 y su muerte el 11 de octubre de 1892, en contraposición a los artículos en albanés, inglés y árabe, y se registra la asamblea celebrada en 1878 en la tekke de Frashër."
  fr: "Article détaillé et érudit de Wikipédia en allemand sur Abdyl Frashëri; utilisé uniquement pour les informations factuelles. Il situe sa naissance au 17 août 1839 et sa mort au 11 octobre 1892, contrairement aux articles albanais, anglais et arabe, et mentionne l’assemblée de 1878 tenue au Frashër tekke."
  ur: "عبدل فریشری پر تفصیلی علمی جرمن ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی تاریخ پیدائش 17 اگست 1839 ہے اور اس کی موت 11 اکتوبر 1892 کو البانی، انگریزی اور عربی مضامین کے خلاف ہے، اور Frashër tekke میں منعقد ہونے والی 1878 کی اسمبلی کو ریکارڈ کرتی ہے۔"
  tr: "Abdul Frascher hakkında ayrıntılı Almanca Vikipedi bilimsel makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Arnavutça, İngilizce ve Arapça'nın aksine 17 Ağustos 1839 tarihli ve ölümü 11 Ekim 1892 olarak belirlenmiş olup, 1878'de Frasher Tekyeh'de toplanan meclisten bahsetmektedir."
  id: "Artikel ilmiah Wikipedia Jerman yang rinci tentang Abdul Frascher; hanya digunakan untuk fakta entitas tersebut. Ia bertanggal 17 Agustus 1839, dan kematiannya pada 11 Oktober 1892, berbeda dengan bahasa Albania, Inggris, dan Arab, serta menyebutkan pertemuan tahun 1878 di Frasher Tekyeh."
