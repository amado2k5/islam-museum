reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The most fully referenced treatment: born 17 August 1839 at Frashër, died 11 October 1892 at Istanbul — the dates also given by the Turkish article and Wikidata, recorded in the record as the variant against the Albanian, English and Arabic articles' 1 June 1839 and 23 October 1892, which the record follows; his brothers are given as Naim and Sami, with the notation that the family enjoyed standing and influence as Bektashis — again a family statement; Ottoman official at Ioannina, about forty years of service; deputy for Yanya in 1876; founder of the Istanbul Central Committee (1877); the assembly of Albanian leaders at Prizren on 10 June 1878 and the same year's assembly in the tekke at Frashër (a political use of the family's tekke, not a statement of his own adherence); commissioner for Epirus, the attempted separate arrangement with Greece after the Berlin Treaty; arrested 1881, sentenced to death, pardoned to life imprisonment and exiled to Balıkesir and Bandırma (a variant on the English and Albanian articles' Prizren prison, recorded); amnestied 1886; until his death an advocate of an independent Albanian principality within a Balkan confederation or under a European great power's guarantee."
