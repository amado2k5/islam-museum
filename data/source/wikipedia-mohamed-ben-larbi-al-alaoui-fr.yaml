reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision, resting on Moha Khettouch's monograph Cheikh al-Islam Mohamed Belarbi Alaoui (2003). It dates his birth to 1880 at M'daghra — the reading the record preserves against the Arabic and Spanish articles' 1884 — and agrees on the death in 1964, the Qarawiyyin studies under Abu Shu'ayb al-Dukkali, the grand-qadi office of 1915, the ministry of justice (1936–1944) and the Tiznit exile of 1953. It describes his adherence to reformist Salafism against the maraboutic practices of the zawiyas, and names no school of law for him."
