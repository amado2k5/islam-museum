summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مريانا مراش؛ تُستخدم لوقائع الكيان فقط. تروي حياتها في حلب وتعليمها، ومجموعتها «بنت فكر» (1893)، وصالونها الأدبي الشهير."
  en: "English Wikipedia article on Maryana Marrash; used for entity facts only. A good article: it recounts her Aleppo upbringing and education in missionary schools, her poetry collection Bint fikr (1893), her articles in al-Jinan and Lisan al-hal, and the literary salon she held with her husband Habib Ghadban."
  es: "Artículo de la Wikipedia en inglés sobre Maryana Marrash; utilizado únicamente para obtener información sobre la persona. Un buen artículo: relata su infancia en Alepo y su educación en escuelas misioneras, su poemario Bint fikr (1893), sus artículos en al-Jinan y Lisan al-hal, y el salón literario que organizó con su esposo Habib Ghadban."
  fr: "Article de Wikipédia en anglais sur Maryana Marrash; utilisé uniquement pour les informations la concernant. Un bon article: il relate son enfance à Alep et ses études dans des écoles missionnaires, son recueil de poésie Bint fikr (1893), ses articles dans al-Jinan et Lisan al-hal, ainsi que le salon littéraire qu’elle tenait avec son mari Habib Ghadban."
  ur: "مریانہ ماراش پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک اچھا مضمون: اس میں ان کی حلب کی پرورش اور مشنری اسکولوں میں تعلیم، اس کا شعری مجموعہ بنت فکر (1893)، الجنان اور لسان الحل میں اس کے مضامین، اور اپنے شوہر حبیب غدبان کے ساتھ اس کے ادبی سیلون کا ذکر ہے۔"
  tr: "Mariana Marash hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Halep'teki hayatını, eğitimini, 'Bint Fikr' (1893) adlı koleksiyonunu ve ünlü edebi salonunu anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Mariana Marash; digunakan hanya untuk fakta entitas. Ia menceritakan kehidupannya di Aleppo dan pendidikannya, koleksi 'Bint Fikr' (1893), dan salon sastra terkenalnya."
