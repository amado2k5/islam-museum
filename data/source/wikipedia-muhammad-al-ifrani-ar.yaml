summary:
  ar: "مقالة ويكيبيديا العربية عن محمد الصغير الإفراني؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه مؤرخ وأديب وفقيه مغربي، مولود نحو 1080هـ بمراكش، درس بها ثم بالقرويين بفاس وعاد سنة 1717 فدرّس العلوم الإسلامية وعمل إماماً وخطيباً في المسجد اليوسفي بمراكش، وتوفي بمراكش في سنة اختلف فيها المؤرخون بين 1138هـ و1156هـ."
  en: "Arabic Wikipedia article on Muhammad al-Saghir al-Ifrani; used for entity facts only. It calls him a Moroccan historian, man of letters and jurist, born about 1080 AH at Marrakesh, educated there and at al-Qarawiyyin in Fes, returning in 1717 to teach the Islamic sciences and serve as imam and khatib of the Yusufi mosque at Marrakesh; it dates his death at Marrakesh to a year the historians dispute between 1138 and 1156 AH (1726–1744), while its lead gives about 1156 AH."
