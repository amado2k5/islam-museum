label: { ar: "بلال فيليبس مناصرا للسلفية التقليدية الجديدة — دراسة دودريا ورسول 2019", en: "Bilal Philips as a Proponent of Neo-Traditional Salafism — Duderija and Rasool 2019" }
summary:
  ar: "دراسة أكاديمية محكّمة لأديس دودريا وغلام رسول في مجلة «الأديان» (Religions) سنة 2019 تحلّل بلال فيليبس مناصرا للسلفية التقليدية الجديدة داخل التقليد الإسلامي السني: كندي من أصل جامايكي اعتنق الإسلام سنة 1972، نال شهاداته من جامعتي المدينة المنورة والملك سعود ودكتوراه جامعة ويلز، وأسس الجامعة الإسلامية المفتوحة عبر الإنترنت ويقيم في قطر."
  en: "A peer-reviewed study by Adis Duderija and Ghulam Rasool in the journal Religions (2019) analysing Bilal Philips as a proponent of neo-traditional Salafism within the Sunni Islamic tradition: a Canadian citizen of Jamaican ancestry who adopted Islam in 1972, took his qualifications at the universities of Madinah and King Saud and his PhD at the University of Wales, founded the Islamic Online University and resides in Qatar."
  es: "Un estudio revisado por pares realizado por Adis Duderija y Ghulam Rasool en la revista Religions (2019) analiza a Bilal Philips como defensor del salafismo neotradicional dentro de la tradición islámica sunita: un ciudadano canadiense de ascendencia jamaicana que adoptó el Islam en 1972, obtuvo sus títulos en las universidades de Medina y Rey Saud y su doctorado en la Universidad de Gales, fundó la Universidad Islámica en Línea y reside en Qatar."
  fr: "Une étude évaluée par des pairs par Adis Duderija et Ghulam Rasool dans la revue Religions (2019) analysant Bilal Philips comme un partisan du salafisme néo-traditionnel au sein de la tradition islamique sunnite: un citoyen canadien d'origine jamaïcaine qui a adopté l'islam en 1972, a obtenu ses qualifications aux universités de Médine et du Roi Saoud et son doctorat à l'Université du Pays de Galles, a fondé l'Université islamique en ligne et réside au Qatar."
  ur: "ادیس دودیریجا اور غلام رسول کا ایک ہم مرتبہ جائزہ شدہ مطالعہ جریدے ریلیجنز (2019) میں بلال فلپس کا تجزیہ کرتے ہوئے سنّی اسلامی روایت کے اندر نو روایتی سلفیت کے حامی کے طور پر: جمیکن نسب کے ایک کینیڈین شہری جس نے 1972 میں اسلام کو اپنایا، مدینہ میں اپنی اہلیت اور بادشاہت کو قبول کیا۔ یونیورسٹی آف ویلز میں پی ایچ ڈی، اسلامک آن لائن یونیورسٹی کی بنیاد رکھی اور قطر میں مقیم ہیں۔"
  tr: "Addis Dodria ve Ghulam Rasool tarafından 2019 yılında \"Religions\" dergisinde yayımlanan hakemli akademik çalışma, Bilal Phillips'i Sünni İslam geleneği içindeki yeni geleneksel Selefizmin destekçisi olarak analiz ediyor: 1972'de İslam'a geçen, Medine Üniversitesi ve Kral Suud Üniversitesi'nden dereceler alan, Galler Üniversitesi'nden doktora yapan, Açık İslami Üniversitesi'ni kuran ve Katar'da yaşayan Jamaika kökenli bir Kanadalı."
  id: "Sebuah studi akademik yang ditinjau sejawat oleh Addis Dodria dan Ghulam Rasool di jurnal \"Religions\" pada tahun 2019 menganalisis Bilal Phillips sebagai pendukung Salafisme tradisional baru dalam tradisi Islam Sunni: seorang Kanada keturunan Jamaika yang memeluk Islam pada tahun 1972, meraih gelar dari University of Madinah dan King Saud University, meraih gelar PhD dari University of Wales, mendirikan Open Islamic University, dan tinggal di Qatar."
title: "Bilal Philips as a Proponent of Neo-Traditional Salafism and His Significance for Understanding Salafism in the West"
