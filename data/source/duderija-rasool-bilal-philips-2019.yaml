reliability_note: "Peer-reviewed journal article, read in full on 26 October 2026. It is the underlying citation for the English Wikipedia article's description of Philips as a Salafi, and is registered and cited directly rather than through the article. Its statement that he founded the Islamic Online University in 2007 conflicts with the Eaalim profile's 2001 date, so no founding year is taken from either."
