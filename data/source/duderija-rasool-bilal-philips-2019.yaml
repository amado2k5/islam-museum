summary:
  ar: "دراسة أكاديمية محكّمة لأديس دودريا وغلام رسول في مجلة «الأديان» (Religions) سنة 2019 تحلّل بلال فيليبس مناصرا للسلفية التقليدية الجديدة داخل التقليد الإسلامي السني: كندي من أصل جامايكي اعتنق الإسلام سنة 1972، نال شهاداته من جامعتي المدينة المنورة والملك سعود ودكتوراه جامعة ويلز، وأسس الجامعة الإسلامية المفتوحة عبر الإنترنت ويقيم في قطر."
  en: "A peer-reviewed study by Adis Duderija and Ghulam Rasool in the journal Religions (2019) analysing Bilal Philips as a proponent of neo-traditional Salafism within the Sunni Islamic tradition: a Canadian citizen of Jamaican ancestry who adopted Islam in 1972, took his qualifications at the universities of Madinah and King Saud and his PhD at the University of Wales, founded the Islamic Online University and resides in Qatar."
title: "Bilal Philips as a Proponent of Neo-Traditional Salafism and His Significance for Understanding Salafism in the West"
