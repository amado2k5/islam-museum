summary:
  ar: "مقالة ويكيبيديا الإنجليزية القصيرة عن سرين محمدو فالو مباكي؛ تُستخدم لوقائع الكيان فقط. تذكر خدمته خليفة ثانيًا للمريدية من 1945 إلى وفاته سنة 1968، وأنه ابن أحمدو بمبا، وتدشينه توسعة الجامع الكبير في طوبى سنة 1963."
  en: "Short English Wikipedia article on Serigne Mouhamadou Fallou Mbacké; used for entity facts only. It records his service as second Caliph of the Mouride brotherhood from 1945 until his death in 1968, that he was a son of Amadou Bamba, and his inauguration of the Great Mosque of Touba expansion on 7 June 1963."
  es: "Breve artículo en inglés de la Wikipedia sobre Serigne Mouhamadou Fallou Mbacké; utilizado únicamente para datos biográficos. En él se registra su servicio como segundo califa de la hermandad Mouride desde 1945 hasta su muerte en 1968, que era hijo de Amadou Bamba y su inauguración de la ampliación de la Gran Mezquita de Touba el 7 de junio de 1963."
  fr: "Court article de Wikipédia en anglais sur Serigne Mouhamadou Fallou Mbacké; utilisé uniquement à des fins d’information sur l’entité. Il relate son mandat de deuxième calife de la confrérie mouride de 1945 à sa mort en 1968, qu’il était le fils d’Amadou Bamba et qu’il a inauguré l’agrandissement de la Grande Mosquée de Touba le 7 juin 1963."
  ur: "Serigne Mouhamadou Fallou Mbacké پر مختصر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1945 سے لے کر 1968 میں ان کی موت تک موریڈ اخوان المسلمین کے دوسرے خلیفہ کے طور پر ان کی خدمات کو ریکارڈ کرتا ہے، کہ وہ امادو بامبا کا بیٹا تھا، اور 7 جون 1963 کو توبہ کی عظیم مسجد کی توسیع کا ان کا افتتاح ہوا۔"
