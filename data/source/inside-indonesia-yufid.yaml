reliability_note: "A scholarly magazine article by a Cambridge researcher of Indonesian Salafism, based on fieldwork with the network's founders: the Yufid founders were IT-department alumni of Gadjah Mada University who met at Salafi campus lectures run by the al-Atsari Islamic Education Foundation (YPIA), and their first project was the yufid.com search engine restricted to approved Salafi sources, run from an office north of central Yogyakarta. A descriptive source for the network's origin and milieu, not for any individual's faith. Read on 4 November 2026."
