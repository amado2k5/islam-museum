reliability_note: "Pointer for entity facts only. Read at the recorded revision and checked against it on 26 October 2026. Born 1853 at Jerusalem, died in Jerusalem on 27 March 1934. Educated at Istanbul's Maktab Malkiya; a long Ottoman governorship career; appointed mayor of Jerusalem in 1918 and dismissed after the April 1920 Nabi Musa riots; elected president of the Executive Committee at the third Palestine Arab Congress (Haifa, December 1920) and led it until his death; led delegations to London and to Ankara and Lausanne. The article makes no statement of his religion."
