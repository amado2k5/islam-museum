reliability_note: "Urdu Wikipedia, revision 12087623 (wikitext consulted in full). Its infobox birthplace (Doha) conflicts with both other articles' Fuwayrit and is not followed; its religion field ('Ahl al-Sunna wa'l-Jama'a') is that one family's uncited value and in any case names no school or madhhab; its infobox names his son Muhammad bin Jassim as successor where the English article's note has his brother Ahmed running the country 1898–1905 and the Arabic infobox names Abdullah as successor on his death. It agrees with the English article on the birth year 1825 and the death day and place (17 July 1913, Lusail), and it attests the name form Qasim bin Mohammed. Consulted on 26 October 2026."
