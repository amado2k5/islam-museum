summary:
  ar: "مدخل عبد الحميد خان بهشاني في بنغلابيديا، الموسوعة الوطنية لبنغلاديش؛ يُستخدم لوقائع الكيان فقط. يعطي مولده سنة 1880 في دانغارا بسيراجغانج ووفاته في دكا في 17 نوفمبر 1976 ودفنه في سانتوش، ومسيرته من حركة الخلافة إلى تأسيس رابطة مسلمي عوامي وحزب عوامي الوطني وجماعة حكومة الربانية سنة 1974، ولا يذكر له مذهبًا ولا قراءة روحية."
  en: "Entry 'Bhashani, Maulana Abdul Hamid Khan' in Banglapedia, the national encyclopedia of Bangladesh; used for entity facts only. It gives his birth in 1880 at Dhangara, Sirajganj, his death at Dhaka on 17 November 1976 and burial at Santosh, and his career from the Khilafat movement to the founding of the Awami Muslim League, the National Awami Party and the Hukumat-e-Rabbania Society in 1974, and names no school and no Sufi affiliation for him."
