summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن أحمد زكي سيف الدين، المولود في سراغين بجاوة الوسطى في 24 آب 1986 لأبوين معلمين؛ تذكر فوزه في أولمبياد العلوم الوطني في علوم الحاسوب، ودراسته في معهد باندونغ للتكنولوجيا وحصوله على العلامة الكاملة في سنته الأولى، ومشروع عد الأصوات السريع، وتأسيسه وكالة سويتميديا ثم بوكالاباك سنة 2010 مع محمد فجرين رشيد ونوغروهو هيروكاهيونو."
  en: "Indonesian Wikipedia article on Achmad Zaky Syaifudin, born in Sragen, Central Java, on 24 August 1986 to schoolteacher parents; it records his National Science Olympiad win in computer science, his studies at the Bandung Institute of Technology with a perfect first-year GPA, his election quick-count software, his founding of the Suitmedia agency, and his co-founding of Bukalapak in 2010 with Muhammad Fajrin Rasyid and Nugroho Herucahyono."
