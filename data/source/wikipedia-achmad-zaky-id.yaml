summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن أحمد زكي سيف الدين، المولود في سراغين بجاوة الوسطى في 24 آب 1986 لأبوين معلمين؛ تذكر فوزه في أولمبياد العلوم الوطني في علوم الحاسوب، ودراسته في معهد باندونغ للتكنولوجيا وحصوله على العلامة الكاملة في سنته الأولى، ومشروع عد الأصوات السريع، وتأسيسه وكالة سويتميديا ثم بوكالاباك سنة 2010 مع محمد فجرين رشيد ونوغروهو هيروكاهيونو."
  en: "Indonesian Wikipedia article on Achmad Zaky Syaifudin, born in Sragen, Central Java, on 24 August 1986 to schoolteacher parents; it records his National Science Olympiad win in computer science, his studies at the Bandung Institute of Technology with a perfect first-year GPA, his election quick-count software, his founding of the Suitmedia agency, and his co-founding of Bukalapak in 2010 with Muhammad Fajrin Rasyid and Nugroho Herucahyono."
  es: "Artículo de la Wikipedia en indonesio sobre Achmad Zaky Syaifudin, nacido en Sragen, Java Central, el 24 de agosto de 1986, hijo de padres maestros; en él se recoge su victoria en la Olimpiada Nacional de Ciencias en informática, sus estudios en el Instituto Tecnológico de Bandung con un promedio de calificaciones perfecto en su primer año, su software de recuento rápido de votos para elecciones, la fundación de la agencia Suitmedia y la cofundación de Bukalapak en 2010 con Muhammad Fajrin Rasyid y Nugroho Herucahyono."
  fr: "L'article de Wikipédia indonésien sur Achmad Zaky Syaifudin, né à Sragen, dans le centre de Java, le 24 août 1986 de parents enseignants, relate sa victoire aux Olympiades nationales des sciences en informatique, ses études à l'Institut de technologie de Bandung avec une moyenne parfaite en première année, son logiciel de comptage rapide des voix pour les élections, la fondation de l'agence Suitmedia et la cofondation de Bukalapak en 2010 avec Muhammad Fajrin Rasyid et Nugroho Herucahyono."
