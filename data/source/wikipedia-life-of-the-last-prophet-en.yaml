summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألبوم «حياة النبي الخاتم» ليوسف إسلام؛ لوقائع الكيان فقط: صدوره في 1 أبريل 1995 عن ماونتن أوف لايت وجمال، وكونه أول ألبوم له بعد تركه البوب سنة 1978، وغايته، وفصوله؛ تستند إلى موقع الفنان."
  en: "English Wikipedia article on Yusuf Islam's album The Life of the Last Prophet; entity facts only: its release on 1 April 1995 on Mountain of Light/Jamal, its place as his first album after leaving pop in 1978, its aims and its sections; it cites the artist's website."
  es: "Artículo de la Wikipedia en inglés sobre el álbum de Yusuf Islam, The Life of the Last Prophet; solo datos sobre la entidad: su lanzamiento el 1 de abril de 1995 en Mountain of Light/Jamal, su lugar como su primer álbum después de dejar el pop en 1978, sus objetivos y sus secciones; cita el sitio web del artista."
  fr: "Article de Wikipédia en anglais sur l'album The Life of the Last Prophet de Yusuf Islam; informations factuelles uniquement: sa sortie le 1er avril 1995 sur Mountain of Light/Jamal, sa place en tant que premier album après son départ de la pop en 1978, ses objectifs et ses sections; il cite le site web de l'artiste."
  ur: "یوسف اسلام کے البم The Life of the Last Prophet پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: اس کی ریلیز 1 اپریل 1995 کو ماؤنٹین آف لائٹ/جمال پر ہوئی، 1978 میں پاپ چھوڑنے کے بعد اس کے پہلے البم کے طور پر اس کا مقام، اس کے مقاصد اور اس کے حصے؛ یہ مصور کی ویب سائٹ کا حوالہ دیتا ہے۔"
