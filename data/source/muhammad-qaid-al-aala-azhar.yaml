  en: Muhammad the Supreme Commander — Abd al-Majid Ibrahim Hindi
summary:
  ar: "كتاب الدكتور عبد المجيد إبراهيم هندي ⁦(ت 1981م)⁩، صدر عن مجمع البحوث الإسلامية بالأزهر الشريف، الطبعة الأولى 1447هـ = 2025م، في 198 صفحة. يقرأ القيادة السياسية والعسكرية للنبي في اثنتي عشرة محطة من السيرة النبوية، من بدر إلى تبوك، بمنهج يجمع التحليل التاريخي والقراءة المقاصدية. صدّره الأمين العام للمجمع محمد عبد الدايم الجندي."
  en: "Abd al-Majid Ibrahim Hindi's book (d. 1981), published by the Academy of Islamic Research at al-Azhar, first edition 1447 AH = 2025 CE, 198 pages. It reads the Prophet's political and military leadership across twelve episodes of the biography, from Badr to Tabuk, combining historical analysis with a maqasid reading. Foreword by the Academy's Secretary-General Muhammad Abd al-Dayim al-Jundi."
  es: "El libro de Abd al-Majid Ibrahim Hindi (fallecido en 1981), publicado por la Academia de Investigación Islámica de Al-Azhar, primera edición 1447 AH = 2025 d. C., 198 páginas. Analiza el liderazgo político y militar del Profeta a lo largo de doce episodios de su biografía, desde Badr hasta Tabuk, combinando el análisis histórico con una interpretación de los maqasid (objetivos divinos). Prólogo del Secretario General de la Academia, Muhammad Abd al-Dayim al-Jundi."
  fr: "L'ouvrage d'Abd al-Majid Ibrahim Hindi (décédé en 1981), publié par l'Académie de la recherche islamique d'al-Azhar (première édition: 1447 AH = 2025 CE), compte 198 pages. Il analyse le rôle politique et militaire du Prophète à travers douze épisodes de sa biographie, de Badr à Tabuk, en combinant analyse historique et lecture des maqasid. Préface du secrétaire général de l'Académie, Muhammad Abd al-Dayim al-Jundi."
  ur: "عبد المجید ابراہیم ہندی کی کتاب ⁦(متوفی 1981)⁩، اکیڈمی آف اسلامک ریسرچ الازہر نے شائع کی، پہلا ایڈیشن 1447ھ = 2025 عیسوی، 198 صفحات۔ اس میں سیرت کی بارہ اقساط میں نبی کی سیاسی اور عسکری قیادت کا مطالعہ کیا گیا ہے، بدر سے تبوک تک، تاریخی تجزیے کو ایک مقاصد پڑھنے کے ساتھ ملایا گیا ہے۔ پیش لفظ اکیڈمی کے سیکرٹری جنرل محمد عبد الدائم الجندی۔"
  tr: "Dr. Abdul Majid Ibrahim Hindi'nin (ö. 1981 M.S.) kitabı, El-Ezher El-Şerif İslami Araştırma Akademisi tarafından yayımlanmıştır, ilk baskı 1447 Hicri = 2025 M.S. ve 198 sayfa kapsamaktadır. Peygamber'in biyografisinin on iki bölümünde, Bedr'den Tabuk'a kadar Peygamber'in siyasi ve askeri liderliğini, tarihsel analiz ile makazî okumasını birleştiren bir metodoloji kullanarak okumaktadır. Akademi Genel Sekreteri Muhammed Abdul Dayem Al-Jundi tarafından yayımlanmıştır."
  id: "Buku karya Dr. Abdul Majid Ibrahim Hindi (wafat 1981 M), diterbitkan oleh Akademi Riset Islam di Al-Azhar Al-Sharif, edisi pertama 1447 H = 2025 M, mencakup 198 halaman. Ia membacakan kepemimpinan politik dan militer Nabi dalam dua belas bab biografi Nabi, dari Badr hingga Tabuk, menggunakan metodologi yang menggabungkan analisis sejarah dan pembacaan maqasid. Diterbitkan oleh Sekretaris Jenderal Akademi, Muhammad Abdul Dayem Al-Jundi."
