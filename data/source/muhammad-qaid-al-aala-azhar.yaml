summary:
  ar: "كتاب الدكتور عبد المجيد إبراهيم هندي (ت 1981م)، صدر عن مجمع البحوث الإسلامية بالأزهر الشريف، الطبعة الأولى 1447هـ = 2025م، في 198 صفحة. يقرأ القيادة السياسية والعسكرية للنبي في اثنتي عشرة محطة من السيرة النبوية، من بدر إلى تبوك، بمنهج يجمع التحليل التاريخي والقراءة المقاصدية. صدّره الأمين العام للمجمع محمد عبد الدايم الجندي."
  en: "Abd al-Majid Ibrahim Hindi's book (d. 1981), published by the Academy of Islamic Research at al-Azhar, first edition 1447 AH = 2025 CE, 198 pages. It reads the Prophet's political and military leadership across twelve episodes of the biography, from Badr to Tabuk, combining historical analysis with a maqasid reading. Foreword by the Academy's Secretary-General Muhammad Abd al-Dayim al-Jundi."
