summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رابح ماجر؛ تُستخدم لوقائع الكيان فقط. تروي سيرة المهاجم الجزائري المولود في 15 ديسمبر 1958 بحسين داي في الجزائر العاصمة: لعب لنصر حسين داي وراسينغ باريس وبورتو ⁦(تسعة ألقاب كبرى منها كأس أوروبا 1987)⁩ وبلنسية وقطر، وخاض 87 مباراة مع الجزائر وكأسي عالم، ثم درّب المنتخب الجزائري في فترات لاحقة."
  en: "English Wikipedia article on Rabah Madjer; used for entity facts only. It records the Algerian striker born 15 December 1958 at Hussein Dey, Algiers: NA Hussein Dey, Racing Paris, Porto (nine major titles including the 1987 European Cup), Valencia and Qatar SC, 87 Algeria caps and two World Cups, and later spells coaching Algeria."
  es: "Artículo de la Wikipedia en inglés sobre Rabah Madjer; utilizado únicamente para datos sobre la persona. Registra al delantero argelino nacido el 15 de diciembre de 1958 en Hussein Dey, Argel: NA Hussein Dey, Racing Paris, Porto (nueve títulos importantes, incluida la Copa de Europa de 1987), Valencia y Qatar SC, 87 partidos internacionales con Argelia y dos Copas del Mundo, y posteriormente etapas como entrenador de Argelia."
  fr: "Article Wikipédia en anglais sur Rabah Madjer; utilisé uniquement pour les informations sur l'entité. Il retrace le parcours de l'attaquant algérien né le 15 décembre 1958 à Hussein Dey, Alger: Hussein Dey, Racing Paris, Porto (neuf titres majeurs dont la Coupe d'Europe 1987), Valence et Qatar SC, 87 sélections en équipe nationale d'Algérie et deux Coupes du monde, et passages ultérieurs au poste d'entraîneur de l'Algérie."
