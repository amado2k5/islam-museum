  ar: "مقالة ويكيبيديا الإنجليزية عن رابح ماجر؛ تُستخدم لوقائع الكيان فقط. تروي سيرة المهاجم الجزائري المولود في 15 ديسمبر 1958 بحسين داي في الجزائر العاصمة: لعب لنصر حسين داي وراسينغ باريس وبورتو (تسعة ألقاب كبرى منها كأس أوروبا 1987) وبلنسية وقطر، وخاض 87 مباراة مع الجزائر وكأسي عالم، ثم درّب المنتخب الجزائري في فترات لاحقة."
  en: "English Wikipedia article on Rabah Madjer; used for entity facts only. It records the Algerian striker born 15 December 1958 at Hussein Dey, Algiers: NA Hussein Dey, Racing Paris, Porto (nine major titles including the 1987 European Cup), Valencia and Qatar SC, 87 Algeria caps and two World Cups, and later spells coaching Algeria."
