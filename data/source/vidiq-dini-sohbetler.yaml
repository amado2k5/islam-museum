reliability_note: "Third-party YouTube analytics page, read on 4 November 2026, for the channel 'Dini Sohbetler' (handle @dinisohbetlertv, channel UCd81TH6WbMSP1czssmAsDQg, based in Türkiye). The figures are the channel's, not the preacher's own: the channel distributes recordings of his sermons, and nothing read in this wave shows it to be a channel he owns or operates; his personal handle, given in his own video descriptions, is @1allahinkulu, for which no verified subscriber count was found. The channel figures are therefore used only as distribution figures and are labelled as such wherever they appear. Its most-viewed videos are his sermons, at 2.14 million, 1.8 million, 996 thousand and 882 thousand views."
