  ar: "صفحة إحصاءات vidIQ لقناة «ديني صحبتلر» على يوتيوب ⁦(قناة توزيع لخطب خليل كوناكجي)⁩: 206 آلاف مشترك و38.61 مليون مشاهدة إجمالية و1751 مقطعا بحسب إحصاءات أواخر أكتوبر 2026؛ أكثر مقاطعها مشاهدة هي خطب كوناكجي."
  en: "vidIQ statistics page for the YouTube channel 'Dini Sohbetler', a distribution channel for Halil Konakcı's sermons: 206K subscribers, 38.61M total views and 1,751 videos in its late-October 2026 statistics, with Konakcı's sermons as its most-viewed videos."
