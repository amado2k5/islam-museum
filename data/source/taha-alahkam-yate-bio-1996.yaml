reliability_note: "Publisher's biographical note printed in the edition itself (ISBN 1-897940-41-6), read in full in this session. It states that Dr Asadullah Yate studied at the University of Cambridge and received his doctorate in 1987, that he studied with Shaykh Abdal Qadir al-Murabit as-Sufi and translated books on his behalf, among them Shabistari's Secret Garden, and that his dissertation concerned Ibn Rushd as a jurist. It gives no birth date."
