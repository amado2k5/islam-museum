summary:
  ar: "نبذة المترجم المطبوعة في طبعة طه للنشر من «الأحكام السلطانية» للماوردي (1996)، وفيها دكتوراه أسد الله ييت من كامبريدج سنة 1987 وتتلمذه على عبد القادر الصوفي."
  en: "The translator's biography printed in Ta-Ha Publishers' edition of al-Mawardi's Al-Ahkam as-Sultaniyyah (1996), recording Asadullah Yate's Cambridge doctorate of 1987 and his study with Abdalqadir as-Sufi."
  es: "Biografía del traductor impresa en la edición de Ta-Ha Publishers de Al-Ahkam as-Sultaniyyah (1996) de al-Mawardi, que registra el doctorado de Asadullah Yate en Cambridge de 1987 y su estudio con Abdalqadir as-Sufi."
  fr: "Biographie du traducteur imprimée dans l'édition Ta-Ha Publishers d'Al-Ahkam as-Sultaniyyah d'al-Mawardi (1996), enregistrant le doctorat de Cambridge d'Asadullah Yate en 1987 et son étude avec Abdalqadir as-Sufi."
  ur: "مترجم کی سوانح عمری الماوردی کے الاحکام السلطانیہ (1996) کے Ta-Ha پبلشرز کے ایڈیشن میں چھپی ہے، جس میں اسد اللہ یٹ کی 1987 کی کیمبرج ڈاکٹریٹ اور عبدالقادر صوفی کے ساتھ اس کا مطالعہ ریکارڈ کیا گیا ہے۔"
  tr: "Al-Mawardi tarafından yayımlanan \"Al-Ahkam al-Sultaniyya\" adlı eserinin Taha Yayıncılık baskısında (1996) yayımlanan kısa bir biyografi, Asadullah Yit'in 1987'de Cambridge'den doktora derecesi ve Abdul Kadir el-Sufi'nin rehberliğini içermektedir."
  id: "Biografi singkat yang dicetak dalam edisi Taha Publishing dari \"Al-Ahkam al-Sultaniyya\" oleh Al-Mawardi (1996), yang mencakup gelar PhD Asadullah Yit dari Cambridge pada tahun 1987 dan bimbingan beliau di bawah bimbingan Abdul Qadir al-Sufi."
title: "Al-Ahkam as-Sultaniyyah: The Laws of Islamic Governance"
