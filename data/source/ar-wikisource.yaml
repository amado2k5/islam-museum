summary:
  ar: "ويكي مصدر العربية (ar.wikisource.org) هي مكتبة نصوص حرة collaborative يراجعها متطوعون؛ تُنشر نصوصها برخصة المشاع الإبداعي Attribution-ShareAlike 4.0. استُخدمت هنا طبعة الكتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني، المنقولة حرفياً من تصدير ويكي النص (wikitext) بتاريخ التعديلات الأخيرة على الصفحات."
  en: "Arabic Wikisource (ar.wikisource.org) is a collaboratively edited free-text library publishing under Creative Commons Attribution-ShareAlike 4.0. The edition of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa used here was taken verbatim from the wikitext export of the book's pages at their latest revisions."
  ur: "عربی ویکی ماخذ (ar.wikisource.org) رضاکاروں کی تدوین شدہ آزاد کتب خانہ ہے جو کریئیٹو کامنز Attribution-ShareAlike 4.0 لائسنس کے تحت شائع ہوتا ہے۔ یہاں قاضی عبد الجبار ہمدانی کی «تثبیت دلائل نبوت» کا متن ان صفحات کی تازہ ترین نظرثانی کے وکی ٹیکسٹ برآمد سے لیا گیا ہے۔"
