summary:
  ar: "المجلد الثامن من طبعة دار ابن حزم لـ«المحلى»، بإشراف خالد الرباط ومشاركة باحثين، يضم كتاب الأطعمة والأشربة والتذكية والصيد والعقيقة والنذور والأيمان والقرض والرهن، مع تعليقات المحققين وتخريجاتهم وفهرس المسائل."
  en: "Volume 8 of the Dar Ibn Hazm edition of al-Muhalla, supervised by Khalid al-Rabbat with a team of researchers, holding the Books of Food and Drink, Slaughter, Hunting, the Aqiqa, Vows, Oaths, Loans and Pledges, with the editors' notes, references and an index of questions."
  ur: "دار ابن حزم کے ایڈیشن «المحلی» کی جلد ہشتم، خالد الرباط کی نگرانی میں محققین کی شرکت سے، جس میں کتاب الاطعمہ والاشربہ، ذبح، شکار، عقیقہ، نذر، قسمیں، قرض اور رہن ہیں، محققین کے حواشی، تخریجات اور مسائل کی فہرست کے ساتھ۔"
title: "المحلى بالآثار في شرح المجلى بالاختصار (المجلد الثامن)"
