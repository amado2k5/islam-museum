summary:
  ar: "قائمة Listen Notes لبودكاست مسلم سنترال الخاص بحسن علي ⁦(537 حلقة منذ ديسمبر 2016)⁩؛ تذكر سيرته تخرجه عالما سنة 1997، وماجستيره في علم النفس التربوي سنة 2006 من معهد التربية بجامعة لندن، وتأسيسه أكاديمية سفر أثناء إمامته للجمعية الثقافية الإسلامية في لندن، ومناصبه اللاحقة في كلية بروندزبري وكلية إبراهيم."
  en: "The Listen Notes listing of Muslim Central's Hasan Ali podcast (537 episodes since December 2016); its biography records his 1997 graduation as an 'alim, his 2006 master's in educational psychology at the University of London's Institute of Education, his founding of Safar Academy while imam of the London Islamic Cultural Society, and his later posts at Brondesbury College and Ebrahim College."
  es: "La ficha de Listen Notes del podcast de Hasan Ali de Muslim Central (537 episodios desde diciembre de 2016) incluye en su biografía su graduación como 'alim en 1997, su máster en psicología educativa en el Instituto de Educación de la Universidad de Londres en 2006, la fundación de la Academia Safar mientras era imán de la Sociedad Cultural Islámica de Londres y sus posteriores cargos en el Brondesbury College y el Ebrahim College."
  fr: "La liste des notes d'écoute du podcast Hasan Ali de Muslim Central (537 épisodes depuis décembre 2016); sa biographie retrace son diplôme d'« alim » en 1997, sa maîtrise en psychologie de l'éducation en 2006 à l'Institut d'éducation de l'Université de Londres, la fondation de la Safar Academy alors qu'il était imam de la London Islamic Cultural Society, et ses postes ultérieurs au Brondesbury College et à l'Ebrahim College."
  ur: "مسلم سنٹرل کے حسن علی پوڈ کاسٹ کی لسٹنگ نوٹس ⁦(دسمبر 2016 سے 537 اقساط)⁩؛ اس کی سوانح عمری میں ان کی 1997 کی گریجویشن بطور 'علیم، 2006 میں ان کی یونیورسٹی آف لندن کے انسٹی ٹیوٹ آف ایجوکیشن میں تعلیمی نفسیات میں ماسٹرز، لندن اسلامک کلچرل سوسائٹی کے امام رہتے ہوئے سفر اکیڈمی کی بنیاد، اور برونڈیسبری کالج اور ابراہیم کالج میں ان کے بعد کے عہدوں کو ریکارڈ کیا گیا ہے۔"
  tr: "Hassan Ali'nin Muslim Central podcast'i için dinleme notları listesi (Aralık 2016'dan bu yana 537 bölüm); biyografisinde 1997'de bilim insanı olarak mezun olması, 2006'da Londra Üniversitesi Eğitim Enstitüsü'nden eğitim psikolojisi alanında yüksek lisans derecesi, Londra'da İslami Kültür Derneği'ni yönetirken bir seyahat akademisi kurması ve ardından Brandesbury College ile Ibrahim College'daki görevleri yer almaktadır."
  id: "Dengarkan daftar catatan untuk podcast Muslim Central karya Hassan Ali (537 episode sejak Desember 2016); biografinya menyebutkan kelulusannya sebagai ilmuwan pada tahun 1997, gelar magister psikologi pendidikan pada tahun 2006 dari Institute of Education di University of London, pendirian akademi perjalanan saat memimpin Islamic Cultural Society di London, serta posisi-posisinya berikutnya di Brandesbury College dan Ibrahim College."
