  ar: "قائمة Listen Notes لبودكاست مسلم سنترال الخاص بحسن علي (537 حلقة منذ ديسمبر 2016)؛ تذكر سيرته تخرجه عالما سنة 1997، وماجستيره في علم النفس التربوي سنة 2006 من معهد التربية بجامعة لندن، وتأسيسه أكاديمية سفر أثناء إمامته للجمعية الثقافية الإسلامية في لندن، ومناصبه اللاحقة في كلية بروندزبري وكلية إبراهيم."
  en: "The Listen Notes listing of Muslim Central's Hasan Ali podcast (537 episodes since December 2016); its biography records his 1997 graduation as an 'alim, his 2006 master's in educational psychology at the University of London's Institute of Education, his founding of Safar Academy while imam of the London Islamic Cultural Society, and his later posts at Brondesbury College and Ebrahim College."
