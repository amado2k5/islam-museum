summary:
  ar: "خبر صحيفة ليد باكستان (26 مايو 2019) عن إعادة حكومة خيبر بختونخوا عبد الصمد إلى منصبه مديرا للآثار بعد أن اعتقله مكتب المحاسبة الوطني في فبراير 2019 بتهم إساءة استعمال السلطة وتعيينات غير قانونية، ثم أفرجت عنه محكمة بيشاور العليا بكفالة في 15 مايو فعاد إلى عمله في 16 مايو؛ يصفه بأنه الباحث الوحيد في آسيا الحاصل على دكتوراه في السنسكريتية وحائز منحة فولبرايت وميدالية ذهبية في الآثار."
  en: "Lead Pakistan news report of 26 May 2019 on the Khyber Pakhtunkhwa government reinstating Abdul Samad as Director Archaeology: he had been arrested by the National Accountability Bureau in February 2019 on allegations of misuse of authority and illegal appointments, was granted bail by the Peshawar High Court on 15 May, resumed duty on 16 May, and was then reinstated; it describes him as Asia's only Sanskrit PhD scholar, a Fulbright scholar and a gold medallist in archaeology."
