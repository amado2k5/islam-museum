label: { en: "Lead Pakistan (2019): KP government reinstates Samad as Director Archaeology" }
summary:
  ar: "خبر صحيفة ليد باكستان ⁦(26 مايو 2019)⁩ عن إعادة حكومة خيبر بختونخوا عبد الصمد إلى منصبه مديرا للآثار بعد أن اعتقله مكتب المحاسبة الوطني في فبراير 2019 بتهم إساءة استعمال السلطة وتعيينات غير قانونية، ثم أفرجت عنه محكمة بيشاور العليا بكفالة في 15 مايو فعاد إلى عمله في 16 مايو؛ يصفه بأنه الباحث الوحيد في آسيا الحاصل على دكتوراه في السنسكريتية وحائز منحة فولبرايت وميدالية ذهبية في الآثار."
  en: "Lead Pakistan news report of 26 May 2019 on the Khyber Pakhtunkhwa government reinstating Abdul Samad as Director Archaeology: he had been arrested by the National Accountability Bureau in February 2019 on allegations of misuse of authority and illegal appointments, was granted bail by the Peshawar High Court on 15 May, resumed duty on 16 May, and was then reinstated; it describes him as Asia's only Sanskrit PhD scholar, a Fulbright scholar and a gold medallist in archaeology."
  es: "Según un informe de Lead Pakistan del 26 de mayo de 2019 sobre la restitución de Abdul Samad como Director de Arqueología por parte del gobierno de Khyber Pakhtunkhwa: Samad había sido arrestado por la Oficina Nacional de Responsabilidad en febrero de 2019 por acusaciones de abuso de autoridad y nombramientos ilegales, obtuvo la libertad bajo fianza del Tribunal Superior de Peshawar el 15 de mayo, retomó sus funciones el 16 de mayo y posteriormente fue restituido en su cargo; el informe lo describe como el único doctor en sánscrito de Asia, becario Fulbright y medallista de oro en arqueología."
  fr: "L'article de Lead Pakistan du 26 mai 2019 concernant la réintégration d'Abdul Samad au poste de directeur de l'archéologie par le gouvernement de Khyber Pakhtunkhwa indique qu'il avait été arrêté par le Bureau national de la responsabilité en février 2019 pour abus de pouvoir et nominations illégales, libéré sous caution par la Haute Cour de Peshawar le 15 mai, avait repris ses fonctions le 16 mai, puis avait été réintégré. L'article le décrit comme le seul docteur en sanskrit d'Asie, boursier Fulbright et médaillé d'or en archéologie."
  ur: "خیبرپختونخوا حکومت کی جانب سے عبدالصمد کو ڈائریکٹر آثار قدیمہ کے عہدے پر بحال کرنے کے بارے میں 26 مئی 2019 کی لیڈ پاکستان نیوز رپورٹ: انہیں قومی احتساب بیورو نے فروری 2019 میں اختیارات کے ناجائز استعمال اور غیر قانونی تقرریوں کے الزام میں گرفتار کیا تھا، پشاور ہائی کورٹ نے 15 مئی کو ضمانت دی تھی اور پھر 16 مئی کو دوبارہ کام شروع کیا گیا تھا۔ اس میں اسے ایشیا کے واحد سنسکرت پی ایچ ڈی اسکالر، فلبرائٹ اسکالر اور آثار قدیمہ میں گولڈ میڈلسٹ کے طور پر بیان کیا گیا ہے۔"
title: "KP govt reinstates Samad as Director Archaeology"
