  ar: "مقالة ويكيبيديا الإنجليزية عن نصر الله خان الأفغاني؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها مولده في 7 أبريل 1875 بسمرقند بينما يعطي متنها سنة 1874، ووفاته في 31 مايو 1920 بكابل ودفنه في كوه آسمايي، وإمارته لأسبوع واحد في فبراير 1919 وزيارته لإنجلترا سنة 1895، وتصفه متنها بأنه متدين تدينا عميقا وحافظ للقرآن. لا تحمل المقالة أي حقل للديانة ولا يسمي متنها مذهبا."
  en: "English Wikipedia article on Nasrullah Khan of Afghanistan; used for entity facts only. Its infobox gives his birth as 7 April 1875 at Samarkand while its text gives the year 1874, and his death as 31 May 1920 at Kabul with burial at Koh-e Asamai; it recounts his one week as Emir in February 1919 and his 1895 visit to England, and its text describes him as deeply religious and a Hafiz, a memorizer of the Qur'an. The article carries no religion field and its text names no school."
