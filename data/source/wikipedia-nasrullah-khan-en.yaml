summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نصر الله خان الأفغاني؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها مولده في 7 أبريل 1875 بسمرقند بينما يعطي متنها سنة 1874، ووفاته في 31 مايو 1920 بكابل ودفنه في كوه آسمايي، وإمارته لأسبوع واحد في فبراير 1919 وزيارته لإنجلترا سنة 1895، وتصفه متنها بأنه متدين تدينا عميقا وحافظ للقرآن. لا تحمل المقالة أي حقل للديانة ولا يسمي متنها مذهبا."
  en: "English Wikipedia article on Nasrullah Khan of Afghanistan; used for entity facts only. Its infobox gives his birth as 7 April 1875 at Samarkand while its text gives the year 1874, and his death as 31 May 1920 at Kabul with burial at Koh-e Asamai; it recounts his one week as Emir in February 1919 and his 1895 visit to England, and its text describes him as deeply religious and a Hafiz, a memorizer of the Qur'an. The article carries no religion field and its text names no school."
  es: "Artículo de la Wikipedia en inglés sobre Nasrullah Khan de Afganistán; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació el 7 de abril de 1875 en Samarcanda, mientras que el texto menciona el año 1874, y su muerte el 31 de mayo de 1920 en Kabul, con sepultura en Koh-e Asamai. Relata su semana como emir en febrero de 1919 y su visita a Inglaterra en 1895. El texto lo describe como profundamente religioso y hafiz (memorizador del Corán). El artículo no incluye información sobre religión ni menciona ninguna escuela."
  fr: "L'article de Wikipédia en anglais sur Nasrullah Khan d'Afghanistan, utilisé uniquement pour les informations sur l'entité, indique sa naissance le 7 avril 1875 à Samarcande, tandis que le texte mentionne l'année 1874 et sa mort le 31 mai 1920 à Kaboul, avec inhumation à Koh-e Asamai. Il relate son règne d'une semaine en tant qu'émir en février 1919 et sa visite en Angleterre en 1895. Le texte le décrit comme profondément religieux et hafiz (mémorisateur du Coran). L'article ne comporte pas de champ « religion » et le texte ne mentionne aucune école."
  ur: "افغانستان کے نصراللہ خان پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے معلوماتی خانے میں ان کی پیدائش 7 اپریل 1875 کو سمرقند میں دی گئی ہے جبکہ اس کے متن میں 1874 کا سال بتایا گیا ہے اور ان کی وفات 31 مئی 1920 کو کابل میں کوہ اسمائی میں تدفین کے ساتھ ہوئی ہے۔ اس میں فروری 1919 میں امیر کی حیثیت سے ان کے ایک ہفتہ اور انگلینڈ کے 1895 کے دورے کا ذکر کیا گیا ہے، اور اس کے متن میں انھیں گہرے مذہبی اور حافظ، قرآن کے حافظ کے طور پر بیان کیا گیا ہے۔ مضمون میں کوئی مذہب نہیں ہے اور اس کے متن کا کوئی اسکول نہیں ہے۔"
  tr: "Nasrullah Han el-Afghani hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bilgi kutusunda 7 Nisan 1875'te Semerkant'ta doğduğu belirtilirken, metinde 1874 yılı, 31 Mayıs 1920'de Kabil'deki ölümü, Aşmay Dağı'nda defnedilmesi, Şubat 1919'da bir haftalık emirliği ve 1895'te İngiltere ziyareti yer almaktadır. Metin onu derin dindar ve Kur'an'ı ezberleyen biri olarak tanımlar. Makalede herhangi bir dini alan yer almamakta ve mezhep olarak adlandırılmamaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Nasrullah Khan al-Afghani; hanya digunakan untuk fakta entitas. Infobox tersebut mencantumkan kelahirannya pada 7 April 1875 di Samarkand, sementara teksnya menyebutkan tahun 1874, kematiannya pada 31 Mei 1920 di Kabul, pemakamannya di Gunung Asmay, emirnya selama satu minggu pada Februari 1919, dan kunjungannya ke Inggris pada tahun 1895. Teks tersebut menggambarkannya sebagai sosok yang sangat religius dan seorang pengapal Al-Quran. Artikel tersebut tidak memuat bidang keagamaan apapun dan tidak menyebutnya sebagai sekte."
