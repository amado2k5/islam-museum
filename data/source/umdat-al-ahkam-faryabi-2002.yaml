  en: "Abd al-Ghani al-Maqdisi, al-Umda fi al-Ahkam, ed. Abu Qutayba Nazar Muhammad al-Faryabi (Dar Tayba, Riyadh, 1st ed., 1423/2002)"
  ur: "عبد الغنی مقدسی، العمدۃ فی الاحکام، تحقیق ابو قتیبہ نظر محمد فاریابی (دار طیبہ، ریاض، طبع اول، 1423ھ/2002ء)"
summary:
  ar: "«العمدة في الأحكام في معالم الحلال والحرام عن خير الأنام مما اتفق عليه الشيخان البخاري ومسلم» للحافظ عبد الغني بن عبد الواحد المقدسي ⁦(ت 600هـ)⁩، حققه أبو قتيبة نظر محمد الفاريابي على سبع نسخ خطية، وقدّم له الشيخ عبد الله بن عبد الرحمن السعد، دار طيبة للنشر والتوزيع، الرياض، الطبعة الأولى 1423هـ/2002م. فيه ترجمة المصنف، ودراسة الكتاب ⁦(نسبته، ورواياته، ونسخه)⁩، وقائمة بأربعة وثلاثين من شروحه وكتب رجاله، ثم النص في 423 حديثاً."
  en: "al-Umda fi al-Ahkam fi Ma'alim al-Halal wa-l-Haram an Khayr al-Anam mimma Ittafaqa alayhi al-Shaykhan al-Bukhari wa-Muslim by al-Hafiz Abd al-Ghani ibn Abd al-Wahid al-Maqdisi (d. 600 AH), edited by Abu Qutayba Nazar Muhammad al-Faryabi from seven manuscripts, with a foreword by Shaykh Abd Allah ibn Abd al-Rahman al-Sa'd, Dar Tayba, Riyadh, 1st ed. 1423/2002. It has a life of the author, a study of the book (attribution, transmissions, manuscripts), a list of thirty-four commentaries and works on its narrators, and the text in 423 hadiths."
title: "العمدة في الأحكام في معالم الحلال والحرام عن خير الأنام مما اتفق عليه الشيخان البخاري ومسلم"
