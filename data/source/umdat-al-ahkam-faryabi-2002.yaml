label:
  ar: "عبد الغني المقدسي، العمدة في الأحكام، تحقيق أبي قتيبة نظر محمد الفاريابي ⁦(دار طيبة، الرياض، ط1، 1423هـ/2002م)⁩"
  en: "Abd al-Ghani al-Maqdisi, al-Umda fi al-Ahkam, ed. Abu Qutayba Nazar Muhammad al-Faryabi (Dar Tayba, Riyadh, 1st ed., 1423/2002)"
  ur: "عبد الغنی مقدسی، العمدۃ فی الاحکام، تحقیق ابو قتیبہ نظر محمد فاریابی ⁦(دار طیبہ، ریاض، طبع اول، 1423ھ/2002ء)⁩"
summary:
  ar: "«العمدة في الأحكام في معالم الحلال والحرام عن خير الأنام مما اتفق عليه الشيخان البخاري ومسلم» للحافظ عبد الغني بن عبد الواحد المقدسي ⁦(ت 600هـ)⁩، حققه أبو قتيبة نظر محمد الفاريابي على سبع نسخ خطية، وقدّم له الشيخ عبد الله بن عبد الرحمن السعد، دار طيبة للنشر والتوزيع، الرياض، الطبعة الأولى 1423هـ/2002م. فيه ترجمة المصنف، ودراسة الكتاب ⁦(نسبته، ورواياته، ونسخه)⁩، وقائمة بأربعة وثلاثين من شروحه وكتب رجاله، ثم النص في 423 حديثاً."
  en: "al-Umda fi al-Ahkam fi Ma'alim al-Halal wa-l-Haram an Khayr al-Anam mimma Ittafaqa alayhi al-Shaykhan al-Bukhari wa-Muslim by al-Hafiz Abd al-Ghani ibn Abd al-Wahid al-Maqdisi (d. 600 AH), edited by Abu Qutayba Nazar Muhammad al-Faryabi from seven manuscripts, with a foreword by Shaykh Abd Allah ibn Abd al-Rahman al-Sa'd, Dar Tayba, Riyadh, 1st ed. 1423/2002. It has a life of the author, a study of the book (attribution, transmissions, manuscripts), a list of thirty-four commentaries and works on its narrators, and the text in 423 hadiths."
  es: "al-Umda fi al-Ahkam fi Ma'alim al-Halal wa-l-Haram an Khayr al-Anam mimma Ittafaqa alayhi al-Shaykhan al-Bukhari wa-Muslim por al-Hafiz Abd al-Ghani ibn Abd al-Wahid al-Maqdisi (m. 600 AH), editado por Abu Qutayba Nazar Muhammad al-Faryabi de siete Manuscritos, con prólogo de Shaykh Abd Allah ibn Abd al-Rahman al-Sa'd, Dar Tayba, Riyadh, 1ª ed. 1423/2002. Tiene una biografía del autor, un estudio del libro (atribución, transmisiones, manuscritos), una lista de treinta y cuatro comentarios y obras sobre sus narradores, y el texto en 423 hadices."
  fr: "al-Umda fi al-Ahkam fi Ma'alim al-Halal wa-l-Haram an Khayr al-Anam mimma Ittafaqa alayhi al-Shaykhan al-Bukhari wa-Muslim par al-Hafiz Abd al-Ghani ibn Abd al-Wahid al-Maqdisi (mort en 600 AH), édité par Abu Qutayba Nazar Muhammad al-Faryabi à partir de sept manuscrits, avec une préface de Shaykh Abd Allah ibn Abd al-Rahman al-Sa'd, Dar Tayba, Riyad, 1ère éd. 1423/2002. Il comporte une biographie de l'auteur, une étude du livre (attribution, transmissions, manuscrits), une liste de trente-quatre commentaires et ouvrages sur ses narrateurs, et le texte en 423 hadiths."
  ur: "العمدہ فی الاحکام فی المعلم الحلال والحرام عن خیر الانعم مما اتفاق علی الشیخن البخاری و مسلم از الحافظ عبد الغنی ابن عبد الواحد المقدسی ⁦(متوفی 600)⁩ از ابوذر البیضاری۔ سات مخطوطات، شیخ عبد اللہ بن عبدالرحمن السعد، دار طیبہ، ریاض، پہلا ایڈیشن کے پیش لفظ کے ساتھ۔ 1423/2002۔ اس میں مصنف کی سوانح عمری، کتاب کا مطالعہ ⁦(انتساب، نقل، مخطوطات)⁩، چونتیس تفسیروں کی فہرست اور اس کے راویوں پر کام اور 423 احادیث کا متن ہے۔"
  tr: "\"Al-'Umdah fi al-Ahkam fi Ma'alim al-Halal wal-Haram 'an Khair al-Anam, iki Şeyh el-Buhari ve Müslüman tarafından kabul edilen\" el-Hafız Abd al-Ghani ibn Abd al-Wahid al-Maqdisi (ö. 600 H) tarafından, Abu Qutaybah tarafından Muhammed al-Faryabi tarafından yedi el yazması kopya üzerinde düzenlenmiş ve Şeyh Abdullah ibn Abd al-Rahman al-Sa'd tarafından tanıtılmış, Dar Taybah for Publishing and Distribution, Riyad, ilk baskı 1423 Hicri / 2002 CE. Kitap, yazarın biyografisini, kitabın bir incelemesini (atıfları, rivayetleri ve kopyaları), rivayetçilerinin otuz dört tefsiri ve kitaplarının listesini ve ardından 423 hadis metnini içerir."
  id: "\"Al-'Umdah fi al-Ahkam fi Ma'alim al-Halal wal-Haram 'an Khair al-Anam, disepakati oleh dua Shaykh al-Bukhari dan Muslim\" oleh al-Hafiz Abd al-Ghani ibn Abd al-Wahid al-Maqdisi (wafat 600 H), disunting oleh Abu Qutaybah oleh Muhammad al-Faryabi dalam tujuh salinan manuskrip, dan diperkenalkan oleh Sheikh Abdullah ibn Abd al-Rahman al-Sa'd, Dar Taybah untuk Penerbitan dan Distribusi, Riyadh, edisi pertama 1423 H / 2002 M. Buku ini memuat biografi penulis, studi tentang kitab (atribusi, narasi, dan salinan), daftar tiga puluh empat komentar dan buku para naratornya, diikuti oleh teks dalam 423 hadits."
