summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله رحيم باييف؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تعطي مولده في 1 يونيو 1896 في خوجند ووفاته في 7 مايو 1938 في سجن ليفورتوفو وكوموناركا مكانا لمدفنه، ورئاسته لحكومة طاجيكستان السوفييتية 1933–1937 وعضويته في اللجنة التنفيذية المركزية للاتحاد السوفييتي عن طاجيكستان، واعتقاله وإعدامه في التطهير الكبير وردّ اعتباره. لا يرد فيها أي محتوى ديني."
  en: "English Wikipedia article on Abdullo Rakhimbayev; used for entity facts only. A short article giving his birth on 1 June 1896 in Khujand, his death on 7 May 1938 at Lefortovo Prison and Kommunarka as his resting place, his premiership of the Tajik SSR 1933–1937 and his seat on the Central Executive Committee of the USSR for Tajikistan, his arrest and execution in the Great Purge and his rehabilitation. It contains no religion content."
  es: "Artículo de la Wikipedia en inglés sobre Abdullo Rakhimbayev; utilizado únicamente para datos sobre la persona. Un breve artículo que indica su nacimiento el 1 de junio de 1896 en Khujand, su muerte el 7 de mayo de 1938 en la prisión de Lefortovo y su lugar de descanso en Kommunarka, su mandato como primer ministro de la RSS de Tayikistán entre 1933 y 1937 y su puesto en el Comité Ejecutivo Central de la URSS para Tayikistán, su arresto y ejecución durante la Gran Purga y su rehabilitación. No contiene contenido religioso."
  fr: "Article de Wikipédia en anglais sur Abdullo Rakhimbayev; utilisé uniquement à des fins d'information sur la personne. Ce court article retrace sa naissance le 1er juin 1896 à Khodjent, sa mort le 7 mai 1938 à la prison de Lefortovo et son inhumation à Kommunarka, son mandat de Premier ministre de la RSS du Tadjikistan de 1933 à 1937, son siège au Comité exécutif central de l'URSS pour le Tadjikistan, son arrestation et son exécution lors des Grandes Purges, ainsi que sa réhabilitation. Il ne contient aucun élément religieux."
  ur: "عبد اللہ رخم بائیف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 1 جون 1896 کو خجند میں ان کی پیدائش، 7 مئی 1938 کو لیفورٹوو جیل اور کومونارکا میں ان کی آرام گاہ کے طور پر ان کی موت، تاجک ایس ایس آر 1933-1937 میں ان کی وزارت عظمیٰ اور تاجکستان کے لیے سوویت یونین کی سینٹرل ایگزیکٹو کمیٹی میں ان کی نشست، اس کی گرفتاری اور دوبارہ گرفتاری کے حوالے سے ایک مختصر مضمون۔ اس میں کوئی مذہب کا مواد نہیں ہے۔"
  tr: "Abdulla Rahim Bayev hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1 Haziran 1896'da Hujand'da doğduğu ve 7 Mayıs 1938'de Livortovo ve Komunarka hapishanelerinde öldüğü kısa bir makale, 1933-1937 yılları arasında Sovyet Tacikistan hükümetinin başkanlığı, Sovyetler Birliği Tacikistan Merkez Yürütme Komitesi üyeliği, Büyük Temizlik sırasında tutuklanması ve idam edilmesi ile rehabilitasyonu hakkında kısa bir makale. Dini içerik içermemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdulla Rahim Bayev; digunakan hanya untuk fakta entitas. Artikel singkat yang mencantumkan kelahirannya pada 1 Juni 1896 di Khujand dan kematiannya pada 7 Mei 1938 di penjara Livortovo dan Komunarka, sebagai tempat pemakamannya, masa kepresidenannya di pemerintahan Soviet Tajikistan dari 1933 hingga 1937, keanggotaannya di Komite Eksekutif Pusat Uni Soviet tentang Tajikistan, penangkapannya dan eksekusinya selama Pembersihan Besar, serta rehabilitasinya. Artikel tersebut tidak memuat konten keagamaan."
