  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله رحيم باييف؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تعطي مولده في 1 يونيو 1896 في خوجند ووفاته في 7 مايو 1938 في سجن ليفورتوفو وكوموناركا مكانا لمدفنه، ورئاسته لحكومة طاجيكستان السوفييتية 1933–1937 وعضويته في اللجنة التنفيذية المركزية للاتحاد السوفييتي عن طاجيكستان، واعتقاله وإعدامه في التطهير الكبير وردّ اعتباره. لا يرد فيها أي محتوى ديني."
  en: "English Wikipedia article on Abdullo Rakhimbayev; used for entity facts only. A short article giving his birth on 1 June 1896 in Khujand, his death on 7 May 1938 at Lefortovo Prison and Kommunarka as his resting place, his premiership of the Tajik SSR 1933–1937 and his seat on the Central Executive Committee of the USSR for Tajikistan, his arrest and execution in the Great Purge and his rehabilitation. It contains no religion content."
