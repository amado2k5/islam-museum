  ar: "مقالة ويكيبيديا الإنجليزية عن أولوبي بويناكسكي؛ تُستخدم لوقائع الكيان فقط. تعطي في مطلعها مولده في 8 سبتمبر 1890 ووفاته في 16 أغسطس 1919، بينما يروي متنها أن حكم الإعدام نُفّذ في 18 أغسطس 1919 عند محطة تميرغويه، وتصف سيرته ثوريا بلشفيا ورئيسا للجنة داغستان الإقليمية للحزب الشيوعي؛ ولا يرد في متنها أي ذكر لدينه الشخصي."
  en: "English Wikipedia article on Ullu-biy Buynaksky; used for entity facts only. Its lead gives his birth on 8 September 1890 and death on 16 August 1919, while its text narrates that the death sentence was carried out on 18 August 1919 near the Temirgoe station; it describes his career as a Bolshevik revolutionary and chairman of the Dagestan Regional Committee of the Communist Party, and contains no statement of his personal religion."
