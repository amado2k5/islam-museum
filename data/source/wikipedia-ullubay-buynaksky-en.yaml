summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أولوبي بويناكسكي؛ تُستخدم لوقائع الكيان فقط. تعطي في مطلعها مولده في 8 سبتمبر 1890 ووفاته في 16 أغسطس 1919، بينما يروي متنها أن حكم الإعدام نُفّذ في 18 أغسطس 1919 عند محطة تميرغويه، وتصف سيرته ثوريا بلشفيا ورئيسا للجنة داغستان الإقليمية للحزب الشيوعي؛ ولا يرد في متنها أي ذكر لدينه الشخصي."
  en: "English Wikipedia article on Ullu-biy Buynaksky; used for entity facts only. Its lead gives his birth on 8 September 1890 and death on 16 August 1919, while its text narrates that the death sentence was carried out on 18 August 1919 near the Temirgoe station; it describes his career as a Bolshevik revolutionary and chairman of the Dagestan Regional Committee of the Communist Party, and contains no statement of his personal religion."
  es: "Artículo de la Wikipedia en inglés sobre Ullu-biy Buynaksky; utilizado únicamente para datos sobre la persona. Su introducción indica que nació el 8 de septiembre de 1890 y falleció el 16 de agosto de 1919, mientras que el texto narra que la sentencia de muerte se ejecutó el 18 de agosto de 1919 cerca de la estación de Temirgoe; describe su trayectoria como revolucionario bolchevique y presidente del Comité Regional de Daguestán del Partido Comunista, y no contiene ninguna declaración sobre su religión personal."
  fr: "Article de Wikipédia en anglais sur Ullu-biy Buynaksky; utilisé uniquement pour les informations le concernant. Son introduction indique sa naissance le 8 septembre 1890 et sa mort le 16 août 1919, tandis que son texte relate que la sentence de mort a été exécutée le 18 août 1919 près de la gare de Temirgoe; il décrit sa carrière de révolutionnaire bolchevique et de président du Comité régional du Daghestan du Parti communiste, et ne mentionne pas sa religion."
  ur: "Ullu-biy Buynaksky پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا سیسہ 8 ستمبر 1890 کو اس کی پیدائش اور 16 اگست 1919 کو موت دیتا ہے، جبکہ اس کا متن بیان کرتا ہے کہ سزائے موت 18 اگست 1919 کو تیمرگو اسٹیشن کے قریب دی گئی تھی۔ اس میں بالشویک انقلابی اور کمیونسٹ پارٹی کی داغستان علاقائی کمیٹی کے چیئرمین کے طور پر ان کے کیریئر کی وضاحت کی گئی ہے، اور اس میں ان کے ذاتی مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Olubi Boyanakski hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 8 Eylül 1890'daki doğumuyla başlar ve 16 Ağustos 1919'daki ölümüyle başlar; metin ise ölüm cezasının 18 Ağustos 1919'da Temergoye istasyonunda infaz edildiğini anlatır; biyografisi ise Bolşevik devrimci ve Komünist Parti Dağıstan Bölge Komitesi başkanı olarak tanımlanır; kişisel dini hakkında hiçbir bilgi yoktur."
  id: "Artikel Wikipedia bahasa Inggris tentang Olubi Boyanakski; digunakan hanya untuk fakta-fakta entitas. Artikel ini dimulai dengan kelahirannya pada 8 September 1890, dan kematiannya pada 16 Agustus 1919, sementara teks menceritakan bahwa hukuman mati dilaksanakan pada 18 Agustus 1919 di stasiun Temergoye, menggambarkan biografinya sebagai revolusioner Bolshevik dan kepala Komite Regional Dagestan Partai Komunis; tidak ada penyebutan agama pribadinya."
