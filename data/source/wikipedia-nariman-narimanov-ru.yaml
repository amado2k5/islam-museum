summary:
  ar: "مقالة ويكيبيديا الروسية عن ناريمان ناريمانوف؛ تُستخدم لوقائع الكيان فقط. سيرة وافية بتاريخيه 14 أبريل 1870 – 19 مارس 1925، وتصف أحد أعماله بأنه من أفضل نماذج الأدب الدعائي «المعادي للدين» — وصفٌ لعمل لا شهادة بعقيدته — وتروي استنكار شيخ الإسلام لمكتبته. لا تسمي مذهبًا له ولا تشهد بإلحاده شخصيًا."
  en: "Russian Wikipedia article on Nariman Narimanov; used for entity facts only. A full biography with his dates 14 April 1870 – 19 March 1925; it calls one of his works a model of agitational 'anti-religious' literature — a characterisation of a work, not an attestation of his belief — and recounts the Sheikh-ul-Islam's denunciation of his Baku library. It names no school for him and does not attest atheism for him personally."
  es: "Artículo de la Wikipedia rusa sobre Nariman Narimanov; utilizado únicamente para datos sobre la persona. Una biografía completa con sus fechas 14 de abril de 1870 – 19 de marzo de 1925; califica una de sus obras como un modelo de literatura agitadora «antirreligiosa» —una caracterización de la obra, no una afirmación de su creencia— y relata la denuncia del Sheikh-ul-Islam contra su biblioteca en Bakú. No menciona ninguna escuela a la que pertenezca ni afirma que fuera ateo."
  fr: "Article de Wikipédia en russe sur Nariman Narimanov; utilisé uniquement à titre informatif. Biographie complète indiquant ses dates de naissance et de décès (14 avril 1870 – 19 mars 1925); l’une de ses œuvres est qualifiée de modèle de littérature « antireligieuse » à visée militante – une caractérisation de l’œuvre, et non une attestation de ses convictions – et le texte relate la dénonciation de sa bibliothèque de Bakou par le Cheikh al-Islam. Aucune école n’est mentionnée à son sujet et son athéisme personnel n’est pas attesté."
title: "Нариманов, Нариман Наджаф оглы"
