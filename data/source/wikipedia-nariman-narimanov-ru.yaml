summary:
  ar: "مقالة ويكيبيديا الروسية عن ناريمان ناريمانوف؛ تُستخدم لوقائع الكيان فقط. سيرة وافية بتاريخيه 14 أبريل 1870 – 19 مارس 1925، وتصف أحد أعماله بأنه من أفضل نماذج الأدب الدعائي «المعادي للدين» — وصفٌ لعمل لا شهادة بعقيدته — وتروي استنكار شيخ الإسلام لمكتبته. لا تسمي مذهبًا له ولا تشهد بإلحاده شخصيًا."
  en: "Russian Wikipedia article on Nariman Narimanov; used for entity facts only. A full biography with his dates 14 April 1870 – 19 March 1925; it calls one of his works a model of agitational 'anti-religious' literature — a characterisation of a work, not an attestation of his belief — and recounts the Sheikh-ul-Islam's denunciation of his Baku library. It names no school for him and does not attest atheism for him personally."
