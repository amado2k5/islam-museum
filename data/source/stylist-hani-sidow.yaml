summary:
  ar: "مقابلة مجلة «ستايلست» مع هاني سيدو، مدونة الجمال المعروفة على إنستغرام باسم @hanihanns، بمناسبة صدور كتابها الأول «إنستا-غلام» (Insta-glam) عن دار أوكتوبوس؛ تتحدث فيها عن دراستها الجامعية للإعلان والعلاقات العامة، وعن غياب وجوه تشبهها في عالم التدوين، وعن تنسيق الموضة المحتشمة للنساء المحجبات، وعن جمهورها من النساء الصوماليات أساسًا."
  en: "Stylist magazine's interview with Hani Sidow, the beauty blogger known on Instagram as @hanihanns, on the release of her first book Insta-glam (Octopus); she discusses studying advertising and public relations at university, the absence of faces like hers in the blogging world, styling modest fashion for hijab-wearing women, and her mainly Somali female audience."
  es: "La revista Stylist entrevistó a Hani Sidow, la bloguera de belleza conocida en Instagram como @hanihanns, con motivo del lanzamiento de su primer libro, Insta-glam (Pulpo); en él habla sobre sus estudios de publicidad y relaciones públicas en la universidad, la ausencia de rostros como el suyo en el mundo de los blogs, el estilismo de moda modesta para mujeres que usan hiyab y su público, mayoritariamente femenino somalí."
  fr: "Dans une interview accordée au magazine Stylist, Hani Sidow, la blogueuse beauté connue sur Instagram sous le nom de @hanihanns, à l'occasion de la sortie de son premier livre Insta-glam (Octopus), évoque ses études de publicité et de relations publiques à l'université, l'absence de personnalités comme la sienne dans le monde du blogging, la création de vêtements pudiques pour les femmes portant le hijab et son public majoritairement féminin somalien."
  ur: "ہانی سیڈو کے ساتھ اسٹائلسٹ میگزین کا انٹرویو، انسٹاگرام پر @hanihanns کے نام سے مشہور بیوٹی بلاگر، ان کی پہلی کتاب Insta-glam (Octopus) کی ریلیز پر؛ وہ یونیورسٹی میں ایڈورٹائزنگ اور پبلک ریلیشنز کی تعلیم، بلاگنگ کی دنیا میں اپنے جیسے چہروں کی عدم موجودگی، حجاب پہننے والی خواتین کے لیے معمولی فیشن کے اسٹائل اور اس کی بنیادی طور پر صومالی خواتین سامعین پر گفتگو کرتی ہے۔"
