  ar: "مقابلة مجلة «ستايلست» مع هاني سيدو، مدونة الجمال المعروفة على إنستغرام باسم @hanihanns، بمناسبة صدور كتابها الأول «إنستا-غلام» (Insta-glam) عن دار أوكتوبوس؛ تتحدث فيها عن دراستها الجامعية للإعلان والعلاقات العامة، وعن غياب وجوه تشبهها في عالم التدوين، وعن تنسيق الموضة المحتشمة للنساء المحجبات، وعن جمهورها من النساء الصوماليات أساسًا."
  en: "Stylist magazine's interview with Hani Sidow, the beauty blogger known on Instagram as @hanihanns, on the release of her first book Insta-glam (Octopus); she discusses studying advertising and public relations at university, the absence of faces like hers in the blogging world, styling modest fashion for hijab-wearing women, and her mainly Somali female audience."
