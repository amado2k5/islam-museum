summary:
  ar: "صفحة حلقة بودكاست «المسلم المفكر» التي تستضيف الإمام توم فاكين؛ تذكر سيرتها أنه اعتنق الإسلام سنة 2010 وهو طالب في فاسار، وأنه باحث مقيم وإمام في مسجد يوتيكا بنيويورك ومدير أبحاث في معهد يقين."
  en: "The Thinking Muslim podcast episode page presenting Imam Tom Facchine; its biography states that he accepted Islam in 2010 while at Vassar College, and that he is resident scholar and imam of Utica Masjid in New York and a research director at the Yaqeen Institute."
  es: "La página del episodio del podcast Thinking Muslim que presenta al imán Tom Facchine indica en su biografía que se convirtió al Islam en 2010 mientras estudiaba en Vassar College, y que es erudito residente e imán de la mezquita Utica en Nueva York y director de investigación en el Instituto Yaqeen."
  fr: "La page de l'épisode du podcast Thinking Muslim présentant l'imam Tom Facchine; sa biographie indique qu'il s'est converti à l'islam en 2010 alors qu'il était étudiant au Vassar College, et qu'il est érudit résident et imam de la mosquée Utica à New York et directeur de recherche à l'Institut Yaqeen."
  ur: "تھنکنگ مسلم پوڈ کاسٹ ایپیسوڈ کا صفحہ امام ٹام فیچائن کو پیش کرتا ہے۔ اس کی سوانح عمری میں بتایا گیا ہے کہ اس نے 2010 میں اسلام قبول کیا تھا جب وہ وسر کالج میں تھا، اور وہ رہائشی عالم اور نیویارک میں یوٹیکا مسجد کے امام اور یقین انسٹی ٹیوٹ میں ریسرچ ڈائریکٹر ہیں۔"
  tr: "İmam Tom Vakin'in sunuculuğunu yaptığı podcast bölümünün \"The Thinking Muslim\" sayfasında, 2010 yılında Vassar'da öğrenciyken İslam'a geçtiği ve New York'taki Utica Camii'nde yerleşik araştırmacı, imam ve Yaqeen Enstitüsü'nde araştırma direktörü olduğu belirtiliyor."
  id: "Halaman episode podcast \"The Thinking Muslim,\" yang dihadiri oleh Imam Tom Vakin, menyebutkan bahwa ia memeluk Islam pada tahun 2010 saat menjadi mahasiswa di Vassar, dan bahwa ia adalah peneliti tetap, imam di Masjid Utica di New York, serta direktur riset di Yaqeen Institute."
title: "Caliphate, Liberalism and the Modern World — Imam Tom Facchine, The Thinking Muslim"
