summary:
  ar: "سيرة ميرزا غياث بك (اعتماد الدولة) في ويكيبيديا الإنجليزية، استنادًا إلى مدخل شكوهي في الموسوعة الإيرانية وسيرة نور جهان لبنكس فندلي: مولده نحو 1544 في طهران، وهجرة أسرته إلى الهند بعد وفاة أبيه سنة 1576، وولادة ابنته مهر النساء (نور جهان لاحقًا) في قندهار أثناء الرحلة، وخدمته ديوانًا لكابل عند أكبر ثم وكيلًا (وزيرًا أعظم) لجهانغير 1611–1621، ووفاته قرب كانغرا في كانون الثاني 1621 حسب المقالة ودفنه في أغرا حيث ضريح اعتماد الدولة."
  en: "English Wikipedia biography of Mirza Ghiyas Beg (I'timad-ud-Daulah), resting on Shokoohy's Encyclopaedia Iranica entry and Banks Findly's Nur Jahan biography: born c. 1544 at Tehran, the family's fall and emigration to India after his father's death in 1576, the birth of his daughter Mihr-un-Nissa (the future Nur Jahan) at Kandahar on the journey, service as diwan of Kabul under Akbar and as Vakil (grand vizier) under Jahangir 1611-1621, death near Kangra (given as January 1621) and burial at Agra, where his tomb stands."
  ur: "مرزا غیاث بیگ (اعتماد الدولہ) کی انگریزی ویکیپیڈیا سوانح، ماخذ شکوہی کا ایرانیکا مدخل اور بینکس فنڈلی کی نور جہاں سوانح: تقریباً 1544ء تہران میں پیدائش، والد کی وفات (1576ء) کے بعد خاندان کی ہندوستان ہجرت، راستے میں قندھار میں بیٹی مہر النساء (نور جہاں) کی ولادت، اکبر کے دور میں کابل کے دیوان اور جہانگیر کے وکیل (وزیر اعظم) 1611ء–1621ء، کانگڑہ کے قریب وفات اور آگرہ میں تدفین۔"
