summary:
  ar: "مقالة ويكيبيديا الأردية عن عناية الله خان المشرقي (1888–1963)؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في أمريتسار في 25 أغسطس 1888 ووفاته في لاهور في 27 أغسطس 1963، ودراسته في جامعة البنجاب وكرايستس كوليدج بكمبريدج، وحركته الخاكسار."
  en: "Urdu Wikipedia article on Inayatullah Khan Mashriqi (1888–1963); used for entity facts only. It gives his birth at Amritsar on 25 August 1888 and his death at Lahore on 27 August 1963, his studies at the University of the Punjab and Christ's College, Cambridge, and his Khaksar movement."
  es: "Artículo de Wikipedia en urdu sobre Inayatullah Khan Mashriqi (1888-1963); utilizado únicamente para datos sobre la persona. Indica su nacimiento en Amritsar el 25 de agosto de 1888 y su fallecimiento en Lahore el 27 de agosto de 1963, sus estudios en la Universidad de Punjab y en el Christ's College de Cambridge, y su participación en el movimiento Khaksar."
  fr: "Article de Wikipédia en ourdou sur Inayatullah Khan Mashriqi (1888-1963); utilisé uniquement pour les informations biographiques. Il indique sa naissance à Amritsar le 25 août 1888 et sa mort à Lahore le 27 août 1963, ses études à l’Université du Pendjab et au Christ’s College de Cambridge, ainsi que son implication dans le mouvement Khaksar."
  ur: "عنایت اللہ خان مشرقی (1888-1963) پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 25 اگست 1888 کو امرتسر میں ان کی پیدائش اور 27 اگست 1963 کو لاہور میں ان کی موت، پنجاب یونیورسٹی اور کرائسٹ کالج، کیمبرج میں ان کی تعلیم اور ان کی خاکسار تحریک شامل ہیں۔"
