summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن براجوغو بانغيستو، المولود باسم فانغ دجوين فين في 13 أيار 1944 في بنغكايانغ بكاليمانتان الغربية، مؤسس مجموعة باريتو باسيفيك للبتروكيماويات والطاقة؛ تذكر بدايته في شركة أخشاب وبناءه أكبر شركة مدرجة في بورصة جاكرتا سنة 1993 وسيطرته على تشاندرا أسري وستار إنرجي."
  en: "English Wikipedia article on Prajogo Pangestu, born Phang Djoen Phen on 13 May 1944 in Bengkayang, West Kalimantan, founder of the Barito Pacific Group in petrochemicals and energy; it records his start in a timber company, his building of the Jakarta exchange's largest listed company in 1993, and his control of Chandra Asri and Star Energy."
  es: "Artículo de la Wikipedia en inglés sobre Prajogo Pangestu, nacido Phang Djoen Phen el 13 de mayo de 1944 en Bengkayang, Kalimantan Occidental, fundador del Grupo Barito Pacific en el sector petroquímico y energético; en él se narran sus inicios en una empresa maderera, la creación de la mayor empresa cotizada en la bolsa de Yakarta en 1993 y su control de Chandra Asri y Star Energy."
  fr: "L'article de Wikipédia en anglais sur Prajogo Pangestu, né Phang Djoen Phen le 13 mai 1944 à Bengkayang, dans le Kalimantan occidental, fondateur du groupe Barito Pacific dans les secteurs de la pétrochimie et de l'énergie; il relate ses débuts dans une entreprise forestière, la création par ce dernier de la plus grande société cotée à la bourse de Jakarta en 1993, et sa prise de contrôle de Chandra Asri et de Star Energy."
  ur: "انگریزی ویکیپیڈیا کا مضمون Prajogo Pangestu پر، Phang Djoen Phen 13 مئی 1944 کو Bengkayang، West Kalimantan میں پیدا ہوئے، پیٹرو کیمیکلز اور توانائی میں Barito Pacific Group کے بانی؛ اس میں لکڑی کی کمپنی میں اس کی شروعات، 1993 میں جکارتہ ایکسچینج کی سب سے بڑی لسٹڈ کمپنی کی عمارت، اور چندر اسری اور اسٹار انرجی پر اس کا کنٹرول ریکارڈ کیا گیا ہے۔"
  tr: "13 Mayıs 1944'te Batı Kalimantan, Pangkayang'da doğan ve Pareto Pacific petrokimya ve enerji grubunun kurucusu olan Prajugo Pangisto, 13 Mayıs 1944'te Batı Kalimantan'da Fang Dguen Vinh adıyla doğan Prajugo Pangisto'nun İngilizce Wikipedia makalesi, 1993'te Jakarta Borsası'nda işlem gören en büyük şirketi kurduğu ve Chandra Asri ile Star Energy'yi kontrol ettiği bir kereste şirketindeki başlangıcını hatırlatıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Prajugo Pangisto, lahir dengan nama Fang Dguen Vinh pada 13 Mei 1944 di Pangkayang, Kalimantan Barat, pendiri grup petrokimia dan energi Pareto Pacific, mengenang awal kariernya di perusahaan kayu, membangun perusahaan terbesar yang terdaftar di Bursa Efek Jakarta pada tahun 1993, serta mengendalikan Chandra Asri dan Star Energy."
