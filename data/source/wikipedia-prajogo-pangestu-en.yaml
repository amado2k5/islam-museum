  ar: "مقالة ويكيبيديا الإنجليزية عن براجوغو بانغيستو، المولود باسم فانغ دجوين فين في 13 أيار 1944 في بنغكايانغ بكاليمانتان الغربية، مؤسس مجموعة باريتو باسيفيك للبتروكيماويات والطاقة؛ تذكر بدايته في شركة أخشاب وبناءه أكبر شركة مدرجة في بورصة جاكرتا سنة 1993 وسيطرته على تشاندرا أسري وستار إنرجي."
  en: "English Wikipedia article on Prajogo Pangestu, born Phang Djoen Phen on 13 May 1944 in Bengkayang, West Kalimantan, founder of the Barito Pacific Group in petrochemicals and energy; it records his start in a timber company, his building of the Jakarta exchange's largest listed company in 1993, and his control of Chandra Asri and Star Energy."
