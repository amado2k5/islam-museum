summary:
  ar: "مقالة ويكيبيديا العربية القصيرة عن حمزة بك الهوتسالي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه تعلم على مشايخ الطرق الصوفية وصار تابعا مخلصا لهم، وتعطي اسمه الكامل حمزة بك بن علي إسكندر بك الهوتسالي وسنتي 1789–1834؛ وهي بذرة قصيرة غير مسندة، وتسمّيه خطأ «الإمام الثالث» بينما هو الثاني، فلا يُعتمد عليها حيث تعارضها المقالة الإنجليزية المسندة إلى غامر وكمبر."
  en: "Short Arabic Wikipedia stub on Hamzat Bek al-Hutsali; used for entity facts only. It describes him as having learned from the sheikhs of the Sufi orders and become a devoted follower of theirs, gives his full name as Hamzat Bek ibn Ali Iskandar Bek al-Hutsali and the years 1789–1834; it is a brief unsourced stub and mistakenly calls him the third imam (he was the second), so it is not followed where the sourced English article contradicts it."
