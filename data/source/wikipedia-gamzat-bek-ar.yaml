summary:
  ar: "مقالة ويكيبيديا العربية القصيرة عن حمزة بك الهوتسالي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه تعلم على مشايخ الطرق الصوفية وصار تابعا مخلصا لهم، وتعطي اسمه الكامل حمزة بك بن علي إسكندر بك الهوتسالي وسنتي 1789–1834؛ وهي بذرة قصيرة غير مسندة، وتسمّيه خطأ «الإمام الثالث» بينما هو الثاني، فلا يُعتمد عليها حيث تعارضها المقالة الإنجليزية المسندة إلى غامر وكمبر."
  en: "Short Arabic Wikipedia stub on Hamzat Bek al-Hutsali; used for entity facts only. It describes him as having learned from the sheikhs of the Sufi orders and become a devoted follower of theirs, gives his full name as Hamzat Bek ibn Ali Iskandar Bek al-Hutsali and the years 1789–1834; it is a brief unsourced stub and mistakenly calls him the third imam (he was the second), so it is not followed where the sourced English article contradicts it."
  es: "Breve extracto en árabe de Wikipedia sobre Hamzat Bek al-Hutsali; se utiliza únicamente para datos sobre la persona. Lo describe como alguien que aprendió de los jeques de las órdenes sufíes y se convirtió en un devoto seguidor de ellas, indica su nombre completo como Hamzat Bek ibn Ali Iskandar Bek al-Hutsali y los años 1789-1834; es un extracto breve sin fuentes y lo llama erróneamente el tercer imán (fue el segundo), por lo que no se sigue cuando el artículo en inglés con fuentes lo contradice."
  fr: "Brève ébauche de page Wikipédia en arabe sur Hamzat Bek al-Hutsali; utilisée uniquement à titre informatif. Elle le décrit comme ayant étudié auprès des cheikhs des ordres soufis et étant devenu un fervent disciple, donne son nom complet: Hamzat Bek ibn Ali Iskandar Bek al-Hutsali, et les années 1789-1834. Cette ébauche, non sourcée, le désigne par erreur comme le troisième imam (il était le deuxième); elle n’est donc pas prise en compte lorsque l’article anglais sourcé la contredit."
