summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الوحيد هاشم؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 1 حزيران 1914 بجومبانغ أكبرَ أبناء هاشم أشعري، وتعليمه في مدارس تيبويرينغ وسيوالان وليربويو وحجّه سنة 1932، ووزارته الأولى للشؤون الدينية سنة 1945 ثم من 1949 إلى 1952، ووفاته في 19 نيسان 1953 بعد حادث سير في تشيماهي."
  en: "English Wikipedia article on Abdul Wahid Hasyim; used for entity facts only. It gives his birth on 1 June 1914 at Jombang as the eldest son of Hasyim Asy'ari, his schooling at the Tebuireng, Siwalan and Lirboyo pesantrens and his Hajj of 1932, his service as the first Minister of Religious Affairs in 1945 and again from 1949 to 1952, and his death on 19 April 1953 after a traffic collision at Cimahi."
  es: "Artículo de la Wikipedia en inglés sobre Abdul Wahid Hasyim; utilizado únicamente para datos sobre la persona. Indica que nació el 1 de junio de 1914 en Jombang como el hijo mayor de Hasyim Asy'ari, su educación en los pesantrens de Tebuireng, Siwalan y Lirboyo y su Hajj de 1932, su servicio como primer Ministro de Asuntos Religiosos en 1945 y nuevamente de 1949 a 1952, y su muerte el 19 de abril de 1953 después de una colisión de tráfico en Cimahi."
  fr: "Article de Wikipédia en anglais sur Abdul Wahid Hasyim; utilisé uniquement pour les informations biographiques. Il indique sa naissance le 1er juin 1914 à Jombang, fils aîné de Hasyim Asy'ari, sa scolarité dans les pesantrens de Tebuireng, Siwalan et Lirboyo, son pèlerinage à La Mecque en 1932, son mandat de premier ministre des Affaires religieuses en 1945 puis de 1949 à 1952, et son décès le 19 avril 1953 suite à un accident de la route à Cimahi."
