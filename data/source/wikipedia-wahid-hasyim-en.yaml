  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الوحيد هاشم؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 1 حزيران 1914 بجومبانغ أكبرَ أبناء هاشم أشعري، وتعليمه في مدارس تيبويرينغ وسيوالان وليربويو وحجّه سنة 1932، ووزارته الأولى للشؤون الدينية سنة 1945 ثم من 1949 إلى 1952، ووفاته في 19 نيسان 1953 بعد حادث سير في تشيماهي."
  en: "English Wikipedia article on Abdul Wahid Hasyim; used for entity facts only. It gives his birth on 1 June 1914 at Jombang as the eldest son of Hasyim Asy'ari, his schooling at the Tebuireng, Siwalan and Lirboyo pesantrens and his Hajj of 1932, his service as the first Minister of Religious Affairs in 1945 and again from 1949 to 1952, and his death on 19 April 1953 after a traffic collision at Cimahi."
