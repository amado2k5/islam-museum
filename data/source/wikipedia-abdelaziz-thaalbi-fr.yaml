summary:
  ar: مقالة ويكيبيديا الفرنسية عن عبد العزيز الثعالبي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس في أسرة من أصل جزائري ووفاته فيها، ودراسته في الزيتونة، ومجلته «سبيل الرشاد» وميله فيها إلى النقاشات الدينية، ومحاكمته وحبسه شهرين، وتأسيسه الحزب الدستوري سنة 1920 وكتابه «تونس الشهيدة». لا تسمّي المقالة مذهبًا فقهيًا له.
  en: French Wikipedia article on Abdelaziz Thâalbi; used for entity facts only. It gives his birth in Tunis to a family of Algerian origin and his death there, his Zaytuna studies, his journal Sabil Errachad with its bent for religious discussion, his trial and two-month imprisonment, his founding of the Destour in 1920 and his book La Tunisie martyre. The article names no legal school for him.
  es: "Artículo de la Wikipedia en francés sobre Abdelaziz Thâalbi; utilizado únicamente para datos sobre su persona. Describe su nacimiento en Túnez en el seno de una familia de origen argelino y su fallecimiento allí, sus estudios en Zaytuna, su revista Sabil Errachad, con su inclinación hacia el debate religioso, su juicio y dos meses de prisión, la fundación del Destour en 1920 y su libro La Tunisie martyre. El artículo no menciona ninguna escuela jurídica a la que pertenezca."
  fr: "L'article de Wikipédia en français consacré à Abdelaziz Thâalbi, utilisé uniquement pour les informations le concernant, mentionne sa naissance à Tunis dans une famille d'origine algérienne, sa mort dans cette même ville, ses études à Zaytuna, sa revue « Sabil Errachad » à vocation religieuse, son procès et ses deux mois d'emprisonnement, la fondation de l'école Destour en 1920 et son ouvrage « La Tunisie martyre ». L'article ne fait mention d'aucune école juridique à son sujet."
  ur: "عبدالعزیز تھالبی پر فرانسیسی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ تیونس میں الجزائر کے ایک خاندان میں اس کی پیدائش اور وہیں اس کی موت، اس کی زیتونا کی تعلیم، اس کا جریدہ سبیل ایراچاد جس میں مذہبی بحث کے لیے جھکاؤ ہے، اس کا مقدمہ اور دو ماہ کی قید، 1920 میں اس کی ڈیسٹور کی بنیاد اور اس کی کتاب لا تیونس شہید۔ مضمون میں اس کے لیے کسی قانونی اسکول کا نام نہیں ہے۔"
