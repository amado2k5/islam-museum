summary:
  ar: مقالة ويكيبيديا الفرنسية عن عبد العزيز الثعالبي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس في أسرة من أصل جزائري ووفاته فيها، ودراسته في الزيتونة، ومجلته «سبيل الرشاد» وميله فيها إلى النقاشات الدينية، ومحاكمته وحبسه شهرين، وتأسيسه الحزب الدستوري سنة 1920 وكتابه «تونس الشهيدة». لا تسمّي المقالة مذهبًا فقهيًا له.
  en: French Wikipedia article on Abdelaziz Thâalbi; used for entity facts only. It gives his birth in Tunis to a family of Algerian origin and his death there, his Zaytuna studies, his journal Sabil Errachad with its bent for religious discussion, his trial and two-month imprisonment, his founding of the Destour in 1920 and his book La Tunisie martyre. The article names no legal school for him.
