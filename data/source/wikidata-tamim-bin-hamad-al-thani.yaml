summary:
  ar: "عنصر ويكيداتا Q1855372 لتميم بن حمد آل ثاني: والده حمد بن خليفة آل ثاني (Q57360) ووالدته موزا بنت ناصر (Q238774). قيمة الدين (P140) هي الإسلام (Q432) فقط، دون فرع أو مدرسة. أما قيمة تاريخ الولادة فتقرأ 25 مارس 1980، وهي مخالفة للمقالات الثلاث جميعًا ⁦(3 يونيو 1980)⁩ فلم تُتّبع."
  en: "Wikidata item Q1855372 for Tamim bin Hamad Al Thani: father Hamad bin Khalifa Al Thani (Q57360), mother Moza bint Nasser (Q238774). The religion (P140) value is Islam (Q432) only, with no branch or school. Its date-of-birth value reads 25 March 1980, which contradicts all three articles (3 June 1980) and was not followed."
  es: "Wikidata Q1855372 para Tamim bin Hamad Al Thani: padre Hamad bin Khalifa Al Thani (Q57360), madre Moza bint Nasser (Q238774). La religión (P140) es solo Islam (Q432), sin rama ni escuela. Su fecha de nacimiento es el 25 de marzo de 1980, lo cual contradice los tres artículos (3 de junio de 1980) y no se siguió."
  fr: "L'élément Wikidata Q1855372 concerne Tamim bin Hamad Al Thani: son père est Hamad bin Khalifa Al Thani (Q57360) et sa mère Moza bint Nasser (Q238774). La religion (P140) est indiquée comme étant l'islam (Q432), sans précision quant à l'appartenance à une branche ou une école. Sa date de naissance, le 25 mars 1980, est erronée car elle contredit les trois articles (3 juin 1980)."
  ur: "تمیم بن حمد الثانی کے لیے وکی ڈیٹا آئٹم Q1855372: والد حماد بن خلیفہ الثانی (Q57360)، والدہ موزا بنت ناصر (Q238774)۔ مذہب (P140) کی قدر صرف اسلام (Q432) ہے، جس کی کوئی شاخ یا اسکول نہیں ہے۔ اس کی تاریخ پیدائش کی قیمت 25 مارچ 1980 ہے، جو تینوں مضامین ⁦(3 جون 1980)⁩ سے متصادم ہے اور اس کی پیروی نہیں کی گئی۔"
  tr: "Tamim bin Hamad Al Thani tarafından Q1855372 Wikidata öğesi: Babası Hamad bin Khalifa Al Thani (Q57360) ve annesi Moza bint Nasser (Q238774). Dinin değeri (P140) yalnızca İslam'dır (Q432), dal veya okul olmadan. Doğum tarihi ise 25 Mart 1980 olarak yazmaktadır, bu da üç maddenin tamamını (3 Haziran 1980) çelitür ve takip edilmemiştir."
  id: "Elemen Wikidata Q1855372 oleh Tamim bin Hamad Al Thani: Ayahnya Hamad bin Khalifa Al Thani (Q57360) dan ibunya Moza bint Nasser (Q238774). Nilai agama (P140) hanya Islam (Q432), tanpa cabang atau sekolah. Adapun tanggal lahir, tertulis 25 Maret 1980, yang bertentangan dengan ketiga pasal tersebut (3 Juni 1980) dan tidak diikuti."
