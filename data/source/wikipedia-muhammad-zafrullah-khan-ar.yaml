summary:
  ar: "مقالة ويكيبيديا العربية الموجزة عن محمد ظفر الله خان (1893–1985)؛ تعطي مولده في 6 شباط 1893 ووفاته في 1 أيلول 1985 في لاهور، وتصفه في متنها بأنه باحث من الجماعة الإسلامية الأحمدية، وتذكر وزارته الأولى لخارجية باكستان ورئاستيه في الأمم المتحدة ومحكمة العدل الدولية."
  en: "The short Arabic Wikipedia article on Muhammad Zafrullah Khan (1893–1985); it gives his birth on 6 February 1893 and his death on 1 September 1985 at Lahore, describes him in its lead as a scholar of the Ahmadiyya Muslim Community, and notes his first foreign ministership of Pakistan and his UN and ICJ presidencies."
  es: "El breve artículo de Wikipedia en árabe sobre Muhammad Zafrullah Khan (1893-1985) indica que nació el 6 de febrero de 1893 y murió el 1 de septiembre de 1985 en Lahore, lo describe en su introducción como un erudito de la comunidad musulmana Ahmadiyya y menciona su primer cargo como ministro de Asuntos Exteriores de Pakistán y sus presidencias de la ONU y la CIJ."
  fr: "Le court article de Wikipédia en arabe sur Muhammad Zafrullah Khan (1893-1985); il indique sa naissance le 6 février 1893 et sa mort le 1er septembre 1985 à Lahore, le décrit dans son introduction comme un érudit de la communauté musulmane Ahmadiyya et note son premier poste de ministre des Affaires étrangères du Pakistan et ses présidences de l'ONU et de la CIJ."
  ur: "محمد ظفر اللہ خان (1893-1985) پر مختصر عربی ویکیپیڈیا مضمون؛ یہ 6 فروری 1893 کو ان کی پیدائش اور 1 ستمبر 1985 کو لاہور میں ان کی موت واقع ہوئی، اسے احمدیہ مسلم کمیونٹی کے اسکالر کے طور پر اپنی قیادت میں بیان کرتا ہے، اور پاکستان کی ان کی پہلی وزارت خارجہ اور اقوام متحدہ اور آئی سی جے کی صدارتوں کو نوٹ کرتا ہے۔"
