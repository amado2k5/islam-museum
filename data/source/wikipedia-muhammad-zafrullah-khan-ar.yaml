  ar: "مقالة ويكيبيديا العربية الموجزة عن محمد ظفر الله خان (1893–1985)؛ تعطي مولده في 6 شباط 1893 ووفاته في 1 أيلول 1985 في لاهور، وتصفه في متنها بأنه باحث من الجماعة الإسلامية الأحمدية، وتذكر وزارته الأولى لخارجية باكستان ورئاستيه في الأمم المتحدة ومحكمة العدل الدولية."
  en: "The short Arabic Wikipedia article on Muhammad Zafrullah Khan (1893–1985); it gives his birth on 6 February 1893 and his death on 1 September 1985 at Lahore, describes him in its lead as a scholar of the Ahmadiyya Muslim Community, and notes his first foreign ministership of Pakistan and his UN and ICJ presidencies."
