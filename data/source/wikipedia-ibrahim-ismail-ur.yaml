summary:
  ar: "مقالة ويكيبيديا الأردية عن إبراهيم إسكندر سلطان جوهر. تؤكد مولده في 22 نوفمبر 1958 واعتلاءه عرش جوهر سنة 2010 بعد وفاة أبيه السلطان إسكندر، وحلفه اليمين سابع عشر ملوك ماليزيا في 31 يناير 2024."
  en: "Urdu Wikipedia article on Ibrahim Iskandar, Sultan of Johor. It confirms his birth on 22 November 1958, his accession in Johor in 2010 on his father Sultan Iskandar's death, and his swearing-in as the seventeenth Yang di-Pertuan Agong on 31 January 2024."
  es: "Artículo de Wikipedia en urdu sobre Ibrahim Iskandar, sultán de Johor. Confirma su nacimiento el 22 de noviembre de 1958, su acceso a Johor en 2010 tras la muerte de su padre, el Sultán Iskandar, y su juramento como decimoséptimo Yang di-Pertuan Agong el 31 de enero de 2024."
  fr: "Article Wikipédia en ourdou sur Ibrahim Iskandar, sultan de Johor. Il confirme sa naissance le 22 novembre 1958, son accession à Johor en 2010 à la mort de son père, le sultan Iskandar, et sa prestation de serment en tant que dix-septième Yang di-Pertuan Agong le 31 janvier 2024."
  ur: "جوہر کے سلطان ابراہیم اسکندر پر اردو ویکیپیڈیا کا مضمون۔ یہ 22 نومبر 1958 کو ان کی پیدائش، ان کے والد سلطان اسکندر کی موت پر 2010 میں جوہر میں ان کے الحاق، اور 31 جنوری 2024 کو سترھویں یانگ دی-پرتوان اگونگ کے طور پر ان کی حلف برداری کی تصدیق کرتا ہے۔"
