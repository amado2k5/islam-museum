summary:
  ar: "مقالة ويكيبيديا العربية عن موديبو كيتا؛ تُستخدم لوقائع الكيان فقط. تروي رئاسته مالي (1960–1968) واتفاقات باماكو 1963، وتقول إن عائلته من المسلمين الماليين المدّعين النسب المباشر إلى مؤسسي إمبراطورية مالي، وتصنّفه ضمن مسلمي مالي والاشتراكيين المسلمين."
  en: "Arabic Wikipedia article on Modibo Keïta; used for entity facts only. It recounts his presidency of Mali (1960–1968) and the 1963 Bamako Accords, says his family were Malian Muslims claiming direct descent from the founders of the Mali Empire, and files him under Malian Muslims and Muslim socialists."
  es: "Artículo de Wikipedia en árabe sobre Modibo Keïta; utilizado únicamente para datos sobre la persona. Relata su presidencia de Malí (1960-1968) y los Acuerdos de Bamako de 1963, afirma que su familia era musulmana maliense y que descendía directamente de los fundadores del Imperio de Malí, y lo clasifica dentro de los musulmanes malienses y los socialistas musulmanes."
  fr: "Article de Wikipédia en arabe sur Modibo Keïta; utilisé uniquement à des fins d’information sur l’entité. Il relate sa présidence du Mali (1960-1968) et les accords de Bamako de 1963, indique que sa famille était composée de musulmans maliens se réclamant d’une descendance directe des fondateurs de l’empire du Mali, et le classe parmi les musulmans maliens et les socialistes musulmans."
  ur: "مودیبو کیٹا پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں مالی کی ان کی صدارت (1960–1968) اور 1963 کے بماکو معاہدے کا ذکر ہے، کہتا ہے کہ ان کا خاندان مالیائی مسلمان تھا جو مالی سلطنت کے بانیوں سے براہ راست نسل کا دعویٰ کرتا ہے، اور اسے مالیائی مسلمانوں اور مسلم سوشلسٹوں کے تحت فائل کرتا ہے۔"
  tr: "Modibo Keita hakkında Arapça Vikipedi makalesi; yalnızca varlık gerçekleri için kullanılmıştır. Mali'deki başkanlığını (1960–1968) ve 1963 Bamako Anlaşmaları'nı anlatır; ailesinin Malili Müslüman olduğunu, Mali İmparatorluğu'nun kurucularına doğrudan bağlı olduğunu iddia eden ve onu Malili Müslümanlar ile Müslüman sosyalistler arasında sınıflandırdığı belirtilir."
  id: "Artikel Wikipedia Arab tentang Modibo Keita; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kepresidenannya di Mali (1960–1968) dan Perjanjian Bamako tahun 1963, menyatakan bahwa keluarganya adalah Muslim Mali yang mengklaim garis keturunan langsung dari para pendiri Kekaisaran Mali, mengklasifikasikannya di antara Muslim Mali dan sosialis Muslim."
