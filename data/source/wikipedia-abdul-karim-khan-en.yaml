summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الكريم خان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه مغنٍّ كلاسيكي هندي وُلد في 11 تشرين الثاني 1872 في كيرانا وتوفي في 27 تشرين الأول 1937، وأنه أسّس مع ابن عمه عبد الواحد خان غرانة كيرانا، وأسّس مدرسة آريا سانغيت فيديالايا في بونا سنة 1913، وأن نصّها يصفه في ساعاته الأخيرة مؤدّيا الصلاة ومردّدا الكلمة — ممارسة شخصية، لا تسمية لمذهب."
  en: "English Wikipedia article on Abdul Karim Khan; used for entity facts only. It gives him as an Indian classical singer born 11 November 1872 at Kairana and died 27 October 1937, founder with his cousin Abdul Wahid Khan of the Kirana gharana, founder of the Arya Sangeet Vidyalaya at Poona in 1913. Its death narrative describes him offering namaz and reciting the kalma in his last hours — personal practice, naming no school."
  es: "Artículo de la Wikipedia en inglés sobre Abdul Karim Khan; utilizado únicamente para datos sobre la persona. Lo describe como un cantante de música clásica india nacido el 11 de noviembre de 1872 en Kairana y fallecido el 27 de octubre de 1937, fundador, junto con su primo Abdul Wahid Khan, de la escuela Kirana gharana, y fundador del Arya Sangeet Vidyalaya en Poona en 1913. La narración de su muerte lo describe rezando y recitando el kalma en sus últimas horas —una práctica personal—, sin mencionar ninguna escuela."
  fr: "L'article de Wikipédia en anglais consacré à Abdul Karim Khan, utilisé uniquement pour les informations le concernant, le présente comme un chanteur de musique classique indienne né le 11 novembre 1872 à Kairana et décédé le 27 octobre 1937. Il fut le fondateur, avec son cousin Abdul Wahid Khan, du gharana de Kirana et de l'Arya Sangeet Vidyalaya de Pune en 1913. Le récit de sa mort le décrit en train d'accomplir la prière (namaz) et de réciter la kalma durant ses dernières heures – une pratique personnelle, sans mention d'école."
  ur: "عبدالکریم خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انہیں ایک ہندوستانی کلاسیکی گلوکار کے طور پر پیش کرتا ہے جو 11 نومبر 1872 کو کیرانہ میں پیدا ہوا اور 27 اکتوبر 1937 کو انتقال ہوا، کرانہ گھرانہ کے اپنے کزن عبدالواحد خان کے ساتھ بانی، 1913 میں پونا میں آریہ سنگیت ودیالیہ کے بانی۔"
  tr: "Abdul Karim Khan hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 11 Kasım 1872'de Kirana'da doğmuş ve 27 Ekim 1937'de ölmüş bir Hintli klasik şarkıcı olduğu, kuzeni Abdul Wahid Khan ile birlikte Grana Kirana'yı kurduğu ve 1913'te Pune'de Arya Sangeet Vidyalaya Okulu'nu kurduğu belirtilmiştir; metinde son saatlerinde dua ederken ve kelimeyi tekrar ederken anlatılır — bu kişisel bir uygulama, bir mezhep adı değil."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdul Karim Khan; digunakan hanya untuk fakta entitas. Dicatat bahwa ia adalah penyanyi klasik India yang lahir pada 11 November 1872 di Kirana dan meninggal pada 27 Oktober 1937, serta mendirikan Grana Kirana bersama sepupunya Abdul Wahid Khan dan mendirikan Sekolah Arya Sangeet Vidyalaya di Pune pada tahun 1913, dan teksnya menggambarkan ia di jam-jam terakhirnya melakukan doa dan mengulang kata — sebuah praktik pribadi, bukan nama sekte."
