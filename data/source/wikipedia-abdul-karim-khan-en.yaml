summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الكريم خان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه مغنٍّ كلاسيكي هندي وُلد في 11 تشرين الثاني 1872 في كيرانا وتوفي في 27 تشرين الأول 1937، وأنه أسّس مع ابن عمه عبد الواحد خان غرانة كيرانا، وأسّس مدرسة آريا سانغيت فيديالايا في بونا سنة 1913، وأن نصّها يصفه في ساعاته الأخيرة مؤدّيا الصلاة ومردّدا الكلمة — ممارسة شخصية، لا تسمية لمذهب."
  en: "English Wikipedia article on Abdul Karim Khan; used for entity facts only. It gives him as an Indian classical singer born 11 November 1872 at Kairana and died 27 October 1937, founder with his cousin Abdul Wahid Khan of the Kirana gharana, founder of the Arya Sangeet Vidyalaya at Poona in 1913. Its death narrative describes him offering namaz and reciting the kalma in his last hours — personal practice, naming no school."
