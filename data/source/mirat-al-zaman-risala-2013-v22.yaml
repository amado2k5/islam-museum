label: { ar: "مرآة الزمان لسبط ابن الجوزي — الجزء الثاني والعشرون ⁦(588–654هـ)⁩، تحقيق إبراهيم الزيبق", en: "Sibt ibn al-Jawzi, Mir'at al-zaman — vol. 22 (588-654 AH), ed. Ibrahim al-Zaybaq" }
summary:
  ar: "الجزء الثاني والعشرون والأخير من حوادث «مرآة الزمان» ⁦(588–654هـ)⁩، عصر المؤلف نفسه، حققه وعلّق عليه إبراهيم الزيبق، دار الرسالة العالمية، الطبعة الأولى 2013م؛ وفيه أخبار يرويها المؤلف بصيغة «قال المصنف» عن نفسه."
  en: "Vol. 22, the last volume of events in Mir'at al-zaman (588-654 AH), the author's own lifetime, edited and annotated by Ibrahim al-Zaybaq, Dar al-Risala al-Alamiyya, 1st ed. 2013; it includes passages in which the author speaks of himself under 'the author said'."
  es: "Vol. 22, el último volumen de eventos en Mir'at al-zaman (588-654 AH), la vida del propio autor, editado y anotado por Ibrahim al-Zaybaq, Dar al-Risala al-Alamiyya, 1.ª ed. 2013; incluye pasajes en los que el autor habla de sí mismo bajo la frase \"el autor dijo\"."
  fr: "Vol. 22, le dernier volume des événements de Mir'at al-zaman (588-654 AH), de la vie de l'auteur, édité et annoté par Ibrahim al-Zaybaq, Dar al-Risala al-Alamiyya, 1re éd. 2013; il comprend des passages dans lesquels l'auteur parle de lui-même sous « l'auteur a dit »."
  ur: "والیوم 22، میرات الزمان ⁦(588-654 ہجری)⁩ کے واقعات کی آخری جلد، مصنف کی اپنی زندگی، ابراہیم الزیبق، دار الرسالہ العالمیہ، 1st ایڈیشن کے ذریعہ ترمیم و تشریح۔ 2013; اس میں وہ اقتباسات شامل ہیں جن میں مصنف 'مصنف نے کہا' کے تحت اپنے بارے میں بات کرتا ہے۔"
  tr: "'Mir'at al-Zaman'ın (588–654 H) olaylarının yirmi ikinci ve son bölümü, yazarın kendi döneminde, İbrahim el-Zaybaq tarafından düzenlenip açıklama yapılmış, Dar al-Risalah al-Alamiyya, ilk baskı 2013 CE; yazarın kendisi hakkında 'yazar söyledi' şeklinde anlattığı raporları içerir."
  id: "Bagian kedua puluh dua dan terakhir dari peristiwa 'Mir'at al-Zaman' (588–654 H), pada era penulis sendiri, disunting dan diberi anotasi oleh Ibrahim al-Zaybaq, Dar al-Risalah al-Alamiyya, edisi pertama 2013 M; berisi laporan yang diceritakan oleh penulis dalam bentuk 'penulis berkata' tentang dirinya."
