summary:
  ar: "مقالة ويكيبيديا العربية عن موسى جار الله ⁦(بيغييف)⁩؛ تُستخدم لوقائع الكيان فقط. تؤرخ له 1295–1369هـ / 1878–1949م، وسنة مولده 1878 إحدى قراءات متنافسة عدة، وتصفه بأنه شيخ الإسلام في روسيا قبل الثورة البلشفية وفي إبانها، وتذكر مولده في روستوف على الدون، وتتناول مطبعته في بتروغراد ومصادرتها وسجنه وهجرته الاضطرارية سنة 1930 عبر تركستان الصينية وأفغانستان واعتقال الإنجليز له في الهند خلال الحرب العالمية الثانية ووفاته في ملجأ للعجزة بالقاهرة. ولا تسمي له مدرسة."
  en: "Arabic Wikipedia article on Musa Jarullah (Bigiev); used for entity facts only. It dates him 1295–1369 AH / 1878–1949 CE — the 1878 birth year is one of several competing readings — calls him Shaykh al-Islam of Russia before and during the Bolshevik revolution, gives his birth at Rostov-on-Don, and covers his Petrograd printing press and its confiscation, his imprisonment, his forced emigration in 1930 through Chinese Turkestan and Afghanistan, his detention by the British in India during the Second World War, and his death in a Cairo poorhouse. It names no school for him."
  es: "Artículo de Wikipedia en árabe sobre Musa Jarullah (Bigiev); utilizado únicamente para datos sobre la persona. Lo fecha entre 1295 y 1369 AH / 1878 y 1949 d. C. —el año de nacimiento de 1878 es una de las varias lecturas contradictorias—, lo llama Shaykh al-Islam de Rusia antes y durante la Revolución Bolchevique, indica que nació en Rostov del Don y abarca su imprenta de Petrogrado y su confiscación, su encarcelamiento, su emigración forzada en 1930 a través del Turquestán chino y Afganistán, su detención por los británicos en la India durante la Segunda Guerra Mundial y su muerte en un asilo de pobres de El Cairo. No menciona ninguna escuela a la que pertenezca."
  fr: "L'article de Wikipédia en arabe consacré à Musa Jarullah (Bigiev) est utilisé uniquement pour les informations biographiques. Il situe sa naissance entre 1295 et 1369 AH (1878-1949 ap. J.-C.), l'année 1878 étant l'une des dates possibles. Il le qualifie de Cheikh al-Islam de Russie avant et pendant la révolution bolchevique, indique sa naissance à Rostov-sur-le-Don et relate l'histoire de son imprimerie à Petrograd et sa confiscation, son emprisonnement, son exil forcé en 1930 via le Turkestan chinois et l'Afghanistan, sa détention par les Britanniques en Inde pendant la Seconde Guerre mondiale et sa mort dans un hospice du Caire. Aucune école ne lui est attribuée."
  ur: "عربی ویکیپیڈیا مضمون موسی جار اللہ ⁦(بیگیف)⁩ پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی تاریخ 1295-1369 ہجری / 1878-1949 عیسوی ہے - 1878 کا سال پیدائش متعدد مسابقتی ریڈنگز میں سے ایک ہے - اسے بالشویک انقلاب سے پہلے اور اس کے دوران روس کا شیخ الاسلام کہتے ہیں، ان کی پیدائش روسٹوو آن ڈان میں ہوئی، اور پیٹرو گراڈ میں اس کی پرنٹنگ پریس، ان کی جبری پرنٹنگ اور ان کی پرنٹنگ کا احاطہ کرتا ہے۔ 1930 چینی ترکستان اور افغانستان کے ذریعے، دوسری جنگ عظیم کے دوران ہندوستان میں انگریزوں کے ہاتھوں اس کی حراست، اور قاہرہ کے ایک غریب خانے میں اس کی موت۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Musa Jarallah (Begiev) hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1295–1369 Hicri / 1878–1949 yıllarına tarihlendirilmiş ve 1878 doğumlu olup, Bolşevik Devrimi öncesi ve sırasında Rusya'da İslam'ın Şeyhi olarak tanımlanan çeşitli rakip okumalar arasında, Rostov-na-Donu'daki doğumundan, Petrograd'daki matbaasından, onun el konulmasından, hapsedilmesinden, 1930'da Çin Türkistanı ve Afganistan'dan zorla göç etmesinden, II. Dünya Savaşı sırasında Hindistan'da İngilizler tarafından tutuklanmasından ve Kahire'deki bir huzurevinde ölümünden bahsedilmektedir. Okul olarak adlandırılmaz."
  id: "Artikel Wikipedia berbahasa Arab tentang Musa Jarallah (Begiev); hanya digunakan untuk fakta entitas tersebut. Ia diperkirakan berasal dari tahun 1295–1369 AH / 1878–1949 M, dan lahir pada tahun 1878, di antara beberapa bacaan yang bersaing, menggambarkannya sebagai Sheikh Islam di Rusia sebelum dan selama Revolusi Bolshevik, menyebutkan kelahirannya di Rostov-on-Don, mesin cetaknya di Petrograd, penyitaan, penahanan, migrasi paksa pada tahun 1930 melintasi Turkestan Tiongkok dan Afghanistan, penangkapannya oleh Inggris di India selama Perang Dunia II, serta kematiannya di panti jompo di Kairo. Ia tidak disebut sebagai sekolah."
