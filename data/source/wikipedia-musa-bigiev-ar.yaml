summary:
  ar: "مقالة ويكيبيديا العربية عن موسى جار الله (بيغييف)؛ تُستخدم لوقائع الكيان فقط. تؤرخ له 1295–1369هـ / 1878–1949م، وسنة مولده 1878 إحدى قراءات متنافسة عدة، وتصفه بأنه شيخ الإسلام في روسيا قبل الثورة البلشفية وفي إبانها، وتذكر مولده في روستوف على الدون، وتتناول مطبعته في بتروغراد ومصادرتها وسجنه وهجرته الاضطرارية سنة 1930 عبر تركستان الصينية وأفغانستان واعتقال الإنجليز له في الهند خلال الحرب العالمية الثانية ووفاته في ملجأ للعجزة بالقاهرة. ولا تسمي له مدرسة."
  en: "Arabic Wikipedia article on Musa Jarullah (Bigiev); used for entity facts only. It dates him 1295–1369 AH / 1878–1949 CE — the 1878 birth year is one of several competing readings — calls him Shaykh al-Islam of Russia before and during the Bolshevik revolution, gives his birth at Rostov-on-Don, and covers his Petrograd printing press and its confiscation, his imprisonment, his forced emigration in 1930 through Chinese Turkestan and Afghanistan, his detention by the British in India during the Second World War, and his death in a Cairo poorhouse. It names no school for him."
