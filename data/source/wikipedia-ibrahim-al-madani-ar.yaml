summary:
  ar: "مقالة ويكيبيديا العربية عن إبراهيم بن عادل المدني، مؤذن المسجد الحرام؛ لوقائع الكيان فقط: مولده بالمدينة في 1974، وأذانه في مسجد المدّاح من 1428هـ، وتعيينه في الحرم في 14 مايو 2018 وأول أذان له في 6 رمضان 1439هـ، وعمله في التبليغ، ووفاته في 10 ربيع الآخر 1448هـ / 21 سبتمبر 2026 ودفنه في المعلاة؛ وتستند إلى الأناضول والعربية وصدى وأخبار 24."
  en: "Arabic Wikipedia article on Ibrahim ibn Adil al-Madani, muezzin of the Masjid al-Haram; entity facts only: birth in Medina in 1974, his adhan at the Maddah Mosque from 1428 AH, appointment at the Haram on 14 May 2018 and first adhan there on 6 Ramadan 1439 AH, his role as relayer (muballigh), and death on 10 Rabi' II 1448 / 21 September 2026 with burial at al-Ma'la; it cites Anadolu, Al Arabiya, Sada and Akhbaar24."
