summary:
  ar: "مقالة ويكيبيديا العربية عن إبراهيم بن عادل المدني، مؤذن المسجد الحرام؛ لوقائع الكيان فقط: مولده بالمدينة في 1974، وأذانه في مسجد المدّاح من 1428هـ، وتعيينه في الحرم في 14 مايو 2018 وأول أذان له في 6 رمضان 1439هـ، وعمله في التبليغ، ووفاته في 10 ربيع الآخر 1448هـ / 21 سبتمبر 2026 ودفنه في المعلاة؛ وتستند إلى الأناضول والعربية وصدى وأخبار 24."
  en: "Arabic Wikipedia article on Ibrahim ibn Adil al-Madani, muezzin of the Masjid al-Haram; entity facts only: birth in Medina in 1974, his adhan at the Maddah Mosque from 1428 AH, appointment at the Haram on 14 May 2018 and first adhan there on 6 Ramadan 1439 AH, his role as relayer (muballigh), and death on 10 Rabi' II 1448 / 21 September 2026 with burial at al-Ma'la; it cites Anadolu, Al Arabiya, Sada and Akhbaar24."
  es: "Artículo de Wikipedia en árabe sobre Ibrahim ibn Adil al-Madani, muecín de la Mezquita Al-Haram; solo datos sobre la entidad: nacimiento en Medina en 1974, su adhan en la Mezquita de Maddah desde 1428 AH, nombramiento en el Haram el 14 de mayo de 2018 y primer adhan allí el 6 de Ramadán de 1439 AH, su papel como transmisor (muballigh) y muerte el 10 de Rabi' II de 1448 / 21 de septiembre de 2026 con entierro en al-Ma'la; cita a Anadolu, Al Arabiya, Sada y Akhbaar24."
  fr: "Article de Wikipédia en arabe sur Ibrahim ibn Adil al-Madani, muezzin de la Masjid al-Haram; faits concernant uniquement l’entité: naissance à Médine en 1974, son adhan à la mosquée Maddah à partir de 1428 AH, nomination au Haram le 14 mai 2018 et premier adhan là-bas le 6 Ramadan 1439 AH, son rôle de relais (muballigh), et décès le 10 Rabi' II 1448 / 21 septembre 2026 avec inhumation à al-Ma'la; il cite Anadolu, Al Arabiya, Sada et Akhbaar24."
  ur: "مسجد الحرام کے مؤذن ابراہیم بن عادل المدنی پر عربی ویکیپیڈیا کا مضمون؛ ہستی کے حقائق صرف: مدینہ منورہ میں 1974 میں پیدائش، 1428 ہجری کو مسجد حرام میں ان کی اذان، 14 مئی 2018 کو حرم میں تقرری اور وہاں پہلی اذان 6 رمضان 1439 ہجری کو، آپ کا بطور رعایا ⁦(مبلغ)⁩ اور وفات 10 ربیع الثانی 21/21/2020 کو المعہ؛ اس میں انادولو، العربیہ، صدا اور اخبار24 کا حوالہ دیا گیا ہے۔"
  tr: "Büyük Camii müezzini İbrahim bin Adel Al-Madani hakkında Arapça Wikipedia makalesi yalnızca varlığın olaylarına dayanmaktadır: 1974'te Medine'de doğması, 1428 Hicri yılında El-Maddeh Camii'nde ezan etmesi, 14 Mayıs 2018'de Haram'a atanması, 6 Ramazan 1439 H.'de ilk ezan çağrısı, vaaz verme çalışmaları, 10 Rabi'al-Thani 1448 Hicri / 21 Eylül 2026'da ölümü ve El-Ma'la'da defnedilmesi; Anadolu ve Arapça ile Sada ve Akhbar 24 üzerine yazılmıştır."
  id: "Artikel Wikipedia berbahasa Arab tentang Ibrahim bin Adel Al-Madani, muezzin Masjid Agung, sepenuhnya didasarkan pada peristiwa entitas tersebut: kelahirannya di Madinah pada tahun 1974, panggilan salat di Masjid Al-Maddah pada tahun 1428 H, pengangkatannya di Haram pada 14 Mei 2018, panggilan salat pertamanya pada 6 Ramadan 1439 H, karya khotbahnya, kematiannya pada 10 Rabi' al-Thani 1448 H/21 September 2026, dan pemakamannya di Al-Ma'la; didasarkan pada Anadolu dan Arab serta Sada dan Akhbar 24."
