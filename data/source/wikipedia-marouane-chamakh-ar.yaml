  ar: "مقالة ويكيبيديا العربية عن مروان الشماخ؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه الكامل مروان مصطفى الشماخ وميلاده في 10 يناير 1984 في تونان بفرنسا ومسيرته مع بوردو وأرسنال. تصنيفها الوحيد ذو الصلة «مسلمون فرنسيون»، ولا بيان فيها عن ديانته في المتن."
  en: "Arabic Wikipedia article on Marouane Chamakh; used for entity facts only. It gives his full name as Marouane Mustapha Chamakh, his birth as 10 January 1984 in Tonneins, France, and his Bordeaux and Arsenal career. Its only religion trace is the category 'French Muslims'; its text makes no statement of his religion."
