summary:
  ar: "مقالة ويكيبيديا العربية عن مروان الشماخ؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه الكامل مروان مصطفى الشماخ وميلاده في 10 يناير 1984 في تونان بفرنسا ومسيرته مع بوردو وأرسنال. تصنيفها الوحيد ذو الصلة «مسلمون فرنسيون»، ولا بيان فيها عن ديانته في المتن."
  en: "Arabic Wikipedia article on Marouane Chamakh; used for entity facts only. It gives his full name as Marouane Mustapha Chamakh, his birth as 10 January 1984 in Tonneins, France, and his Bordeaux and Arsenal career. Its only religion trace is the category 'French Muslims'; its text makes no statement of his religion."
  es: "Artículo de Wikipedia en árabe sobre Marouane Chamakh; se utiliza únicamente para obtener información sobre la persona. Indica su nombre completo como Marouane Mustapha Chamakh, su fecha de nacimiento el 10 de enero de 1984 en Tonneins, Francia, y su trayectoria en el Girondins de Burdeos y el Arsenal. La única referencia a su religión es la categoría «musulmanes franceses»; el texto no menciona su religión."
  fr: "Article Wikipédia en arabe sur Marouane Chamakh; utilisé uniquement pour les informations le concernant. Il indique son nom complet: Marouane Mustapha Chamakh, sa date de naissance: 10 janvier 1984 à Tonneins (France), et sa carrière à Bordeaux et à Arsenal. La seule mention de sa religion est la catégorie « Musulmans français »; le texte ne fait aucune déclaration à ce sujet."
  ur: "مروانے چماخ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کا پورا نام ماروانے مصطفی چماخ بتایا گیا ہے، اس کی پیدائش 10 جنوری 1984 کو ٹونینز، فرانس میں، اور اس کا بورڈو اور آرسنل کیریئر ہے۔ اس کا واحد مذہب 'فرانسیسی مسلمان' زمرہ ہے۔ اس کے متن میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
