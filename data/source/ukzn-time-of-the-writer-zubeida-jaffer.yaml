label:
  en: Zubeida Jaffer — Time of the Writer festival biography (University of KwaZulu-Natal)
summary:
  ar: 'سيرة زبيدة جعفر في مهرجان «وقت الكاتب» بجامعة كوازولو ناتال: بدأت في صحيفة كيب تايمز سنة 1980، وهي زميلة باحثة في علوم الاتصال بجامعة الدولة الحرة، وفازت بجائزة «مسلم فيوز» للإنجاز وبميدالية الشرف للخدمة المتميزة في الصحافة من جامعة ميزوري، وألّفت «جيلنا» و«الحب في زمن الخيانة» و«جمال القلب»، وتنشر موقع «الصحفي»، وأسست «نمبر 10 للنشر» سنة 2021، وتسكن واينبرغ بكيب تاون.'
  en: 'The University of KwaZulu-Natal festival biography of Zubeida Jaffer: she began at the Cape Times in 1980, is a research fellow in Communication Sciences at the University of the Free State, won the Muslim Views Achiever Award and the University of Missouri''s Honor Medal for Distinguished Service to Journalism, wrote Our Generation, Love in the Time of Treason and Beauty of the Heart, publishes The Journalist website, founded Number 10 Publishers in 2021, and lives in Wynberg, Cape Town.'
  es: "Biografía de Zubeida Jaffer en el festival de la Universidad de KwaZulu-Natal: comenzó en el Cape Times en 1980, es investigadora asociada en Ciencias de la Comunicación en la Universidad del Estado Libre, ganó el premio Muslim Views Achiever Award y la Medalla de Honor de la Universidad de Missouri por su distinguido servicio al periodismo, escribió Our Generation, Love in the Time of Treason y Beauty of the Heart, publica el sitio web The Journalist, fundó Number 10 Publishers en 2021 y vive en Wynberg, Ciudad del Cabo."
  fr: "Biographie de Zubeida Jaffer, présentée au festival de l'Université du KwaZulu-Natal: elle a débuté au Cape Times en 1980, est chercheuse en sciences de la communication à l'Université de l'État libre, a remporté le Muslim Views Achiever Award et la médaille d'honneur de l'Université du Missouri pour services distingués rendus au journalisme, a écrit Our Generation, Love in the Time of Treason et Beauty of the Heart, publie le site web The Journalist, a fondé Number 10 Publishers en 2021 et vit à Wynberg, au Cap."
  ur: "زبیدہ جعفر کی یونیورسٹی آف KwaZulu-Natal فیسٹیول کی سوانح عمری: اس کا آغاز 1980 میں کیپ ٹائمز سے ہوا، یونیورسٹی آف دی فری اسٹیٹ میں کمیونیکیشن سائنسز میں ریسرچ فیلو ہے، مسلم ویوز اچیور ایوارڈ جیتا اور یونیورسٹی آف میسوری کا اعزازی تمغہ برائے امتیازی خدمات حاصل کیں، انہوں نے ٹائم آف جرنلزم، بیوٹی آف جرنلزم اور ٹائم آف جرنلزم میں لکھا۔ The Journalist ویب سائٹ شائع کرتی ہے، 2021 میں نمبر 10 پبلشرز کی بنیاد رکھی، اور Wynberg، Cape Town میں رہتی ہے۔"
  tr: "Zubaida Jaafar'ın biyografisi, KwaZulu-Natal Üniversitesi'ndeki 'Writer's Time' festivalinde: 1980'de Cape Times'ta çalışmaya başladı. Free State Üniversitesi'nde iletişim bilimleri alanında araştırma görevlisidir, Missouri Üniversitesi'nden 'Muslim Views' Başarı Ödülü ve Gazetecilikte Üstün Hizmet Madalyası kazanmıştır, 'Our Generation', 'Love in the Time of Betrayal' ve 'Beauty of the Heart' kitaplarının yazarıdır, 'Al-Sahafi' web sitesini yayınlamaktadır, 2021'de 'Number 10 Publishing'i kurmuş ve Weinberg, Cape Town'da yaşamaktadır."
  id: "Biografi Zubaida Jaafar di festival 'Writer's Time' di University of KwaZulu-Natal: Ia memulai karier di Cape Times pada tahun 1980. Ia adalah peneliti ilmu komunikasi di Free State University, memenangkan 'Muslim Views' Achievement Award dan Medal of Honor for Distinguished Service in Journalism dari University of Missouri, menulis 'Our Generation,' 'Love in the Time of Betrayal,' dan 'Beauty of the Heart,' menerbitkan situs web 'Al-Sahafi', mendirikan 'Number 10 Publishing' pada tahun 2021, dan tinggal di Weinberg, Cape Town."
