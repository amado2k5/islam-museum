summary:
  ar: 'سيرة زبيدة جعفر في مهرجان «وقت الكاتب» بجامعة كوازولو ناتال: بدأت في صحيفة كيب تايمز سنة 1980، وهي زميلة باحثة في علوم الاتصال بجامعة الدولة الحرة، وفازت بجائزة «مسلم فيوز» للإنجاز وبميدالية الشرف للخدمة المتميزة في الصحافة من جامعة ميزوري، وألّفت «جيلنا» و«الحب في زمن الخيانة» و«جمال القلب»، وتنشر موقع «الصحفي»، وأسست «نمبر 10 للنشر» سنة 2021، وتسكن واينبرغ بكيب تاون.'
  en: 'The University of KwaZulu-Natal festival biography of Zubeida Jaffer: she began at the Cape Times in 1980, is a research fellow in Communication Sciences at the University of the Free State, won the Muslim Views Achiever Award and the University of Missouri''s Honor Medal for Distinguished Service to Journalism, wrote Our Generation, Love in the Time of Treason and Beauty of the Heart, publishes The Journalist website, founded Number 10 Publishers in 2021, and lives in Wynberg, Cape Town.'
