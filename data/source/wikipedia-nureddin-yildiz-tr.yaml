summary:
  ar: "مقالة ويكيبيديا التركية عن نور الدين يلدز؛ تُستخدم لوقائع الكيان فقط. تفصّل ميلاده سنة 1960 في أوف بولاية طرابزون، وحفظه على يد أبيه، ودراسته في جامعة مرمرة ثم في جامعة أم القرى بمكة في أصول الفقه، وأعماله في التعليم والعمل الأهلي وتأسيسه جمعية النسيج الاجتماعي."
  en: "Turkish Wikipedia article on Nurettin Yıldız; used for entity facts only. It details his birth in 1960 in Of, Trabzon, his memorisation of the Qur'an under his father, his studies at Marmara University and then in usul al-fiqh at Umm al-Qura University in Mecca, his education and civil-society work, and his founding of the Sosyal Doku association."
  es: "Artículo de la Wikipedia en turco sobre Nurettin Yıldız; utilizado únicamente para datos sobre la persona. Detalla su nacimiento en 1960 en Of, Trabzon, su memorización del Corán con su padre, sus estudios en la Universidad de Marmara y posteriormente en usul al-fiqh en la Universidad Umm al-Qura de La Meca, su formación académica y su labor en la sociedad civil, así como la fundación de la asociación Sosyal Doku."
  fr: "Article de Wikipédia en turc sur Nurettin Yıldız; utilisé uniquement à des fins d'information sur l'entité. Il détaille sa naissance en 1960 à Of, Trabzon, sa mémorisation du Coran auprès de son père, ses études à l'université de Marmara puis en usul al-fiqh à l'université Umm al-Qura de La Mecque, son parcours scolaire et son engagement dans la société civile, ainsi que la fondation de l'association Sosyal Doku."
