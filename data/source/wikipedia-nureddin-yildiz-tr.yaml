reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. The article's biographical core rests on a single cited biographical notice (Mumsema, 2013); its criticism section cites Turkish press reports (T24, 2014; Milliyet, 2015; OdaTV, 2016) that some of his public statements drew criticism and that events of his were cancelled in several provinces — carried in his record as attributed press reporting only, with no detail and no verdict. The article's infobox records his religion as Islam (Sunni): structured data, which never settles faith. The article's prose names no school for him. The spelling of his name varies: the article and his foundation use 'Nurettin Yıldız', his own site and channel use 'Nureddin Yıldız'; both spellings are recorded. Read in full on 16 November 2026."
