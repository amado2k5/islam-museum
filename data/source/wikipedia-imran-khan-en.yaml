summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمران خان (مواليد 1952)، لاعب الكريكت ورئيس وزراء باكستان الأسبق؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في لاهور في 5 أكتوبر 1952، ومسيرته مع باكستان (362 ويكيت اختبار و3,807 جولات)، وقيادته باكستان إلى كأس العالم 1992، وتأسيسه مستشفى شوكت خانم وحزب حركة الإنصاف، ورئاسته الوزراء (2018-2022) وعزله بتصويت حجب ثقة وسجنه منذ 2023 كما تنقله المصادر."
  en: "English Wikipedia article on Imran Khan (born 1952), the former cricketer and prime minister of Pakistan; used for entity facts only. It records his birth in Lahore on 5 October 1952, his Pakistan career (362 Test wickets and 3,807 Test runs), his captaincy of Pakistan to the 1992 World Cup, his founding of the Shaukat Khanum hospital and of Pakistan Tehreek-e-Insaf, his premiership (2018–2022), his removal by a no-confidence vote and his imprisonment since 2023 as the sources report it. The article names no school for him; his public religious statements are political and personal material, not a school attestation."
