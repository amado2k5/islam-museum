summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمران خان ⁦(مواليد 1952)⁩، لاعب الكريكت ورئيس وزراء باكستان الأسبق؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في لاهور في 5 أكتوبر 1952، ومسيرته مع باكستان ⁦(362 ويكيت اختبار و3,807 جولات)⁩، وقيادته باكستان إلى كأس العالم 1992، وتأسيسه مستشفى شوكت خانم وحزب حركة الإنصاف، ورئاسته الوزراء (2018-2022) وعزله بتصويت حجب ثقة وسجنه منذ 2023 كما تنقله المصادر."
  en: "English Wikipedia article on Imran Khan (born 1952), the former cricketer and prime minister of Pakistan; used for entity facts only. It records his birth in Lahore on 5 October 1952, his Pakistan career (362 Test wickets and 3,807 Test runs), his captaincy of Pakistan to the 1992 World Cup, his founding of the Shaukat Khanum hospital and of Pakistan Tehreek-e-Insaf, his premiership (2018–2022), his removal by a no-confidence vote and his imprisonment since 2023 as the sources report it. The article names no school for him; his public religious statements are political and personal material, not a school attestation."
  es: "Artículo de la Wikipedia en inglés sobre Imran Khan (nacido en 1952), exjugador de críquet y exprimer ministro de Pakistán; utilizado únicamente para datos biográficos. Registra su nacimiento en Lahore el 5 de octubre de 1952, su trayectoria con la selección pakistaní (362 wickets y 3807 carreras en partidos de prueba), su capitanía en la Copa Mundial de 1992, la fundación del hospital Shaukat Khanum y del partido Pakistan Tehreek-e-Insaf, su mandato como primer ministro (2018-2022), su destitución por una moción de censura y su encarcelamiento desde 2023, según las fuentes. El artículo no menciona ninguna escuela a la que haya asistido; sus declaraciones religiosas públicas son de índole política y personal, no una certificación académica."
  fr: "Article de Wikipédia en anglais sur Imran Khan (né en 1952), ancien joueur de cricket et Premier ministre du Pakistan; utilisé uniquement à des fins d'information. Il relate sa naissance à Lahore le 5 octobre 1952, sa carrière internationale (362 guichets et 3 807 courses en Test-match), son capitanat de l'équipe du Pakistan lors de la Coupe du monde de 1992, la fondation de l'hôpital Shaukat Khanum et du Pakistan Tehreek-e-Insaf, son mandat de Premier ministre (2018-2022), sa destitution par une motion de censure et son emprisonnement depuis 2023, selon les sources. L'article ne mentionne aucun établissement scolaire; ses déclarations publiques sur sa religion relèvent du domaine politique et personnel et ne constituent pas une attestation scolaire."
  ur: "پاکستان کے سابق کرکٹر اور وزیر اعظم عمران خان ⁦(پیدائش 1952)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 5 اکتوبر 1952 کو لاہور میں ان کی پیدائش، ان کا پاکستانی کیریئر ⁦(362 ٹیسٹ وکٹیں اور 3,807 ٹیسٹ رنز)⁩، 1992 کے ورلڈ کپ میں پاکستان کی کپتانی، شوکت خانم ہسپتال اور پاکستان تحریک انصاف کی ان کی بنیاد، ان کی وزارت عظمیٰ (2018–2022)، ان کی برطرفی کے بعد ووٹ نہ دینے کا ریکارڈ درج ہے۔ ذرائع کے مطابق 2023۔ مضمون میں اس کے لیے کسی اسکول کا نام نہیں ہے۔ اس کے عوامی مذہبی بیانات سیاسی اور ذاتی مواد ہیں، اسکول کی تصدیق نہیں۔"
