  ar: "مقالة ويكيبيديا الإنجليزية عن علي الحذيفي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 22 مايو 1947، وإمامته للمسجد النبوي من 1979 (كبير الأئمة من 1982)، وأستاذيته بالجامعة الإسلامية بالمدينة، وإلقاءه خطبة عرفة في حج 2026؛ وصندوقها غير المرجعي يعطي العقيدة أثري والحركة سني والفقه حنبلي، وتصنّفه فئاتها في السلفيين والوهابيين السعوديين."
  en: "English Wikipedia article on Ali al-Hudhaify; used for entity facts only. It gives his birth on 22 May 1947, his imamate of the Prophet's Mosque from 1979 (chief imam from 1982), his Islamic University of Madinah professorship and his delivery of the Arafat sermon at the 2026 Hajj; its unreferenced infobox gives creed Athari, movement Sunni and jurisprudence Hanbali, and its categories file him among Saudi Salafis and Wahhabis."
