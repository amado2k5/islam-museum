summary:
  ar: "مقالة ويكيبيديا العربية عن شاه أحمد نوراني (1 تشرين الأول 1926 – 11 كانون الأول 2003)، العالم والسياسي الباكستاني وابن محمد عبد العليم صديقي؛ تذكر دراسته في الله آباد وميروت وعضويته في مجلس الأمة الباكستاني ومجلس الشيوخ، ووفاته بأزمة قلبية في 11 كانون الأول 2003 ودفنه في ضريح عبد الله شاه غازي بكراتشي، وهي مختصر مترجم عن المقالة الإنجليزية بنفس مراجعها."
  en: "The Arabic Wikipedia article on Shah Ahmad Noorani (1 October 1926 – 11 December 2003), the Pakistani scholar and politician and son of Muhammad Abdul Aleem Siddiqi; it records his studies at Allahabad and Meerut, his membership of Pakistan's National Assembly and Senate, and his death by heart attack on 11 December 2003 with burial at the Abdullah Shah Ghazi shrine in Karachi. It is a condensed translation of the English article, carrying the same citations, and is counted as the same text family."
