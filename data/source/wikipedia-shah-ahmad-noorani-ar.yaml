summary:
  ar: "مقالة ويكيبيديا العربية عن شاه أحمد نوراني ⁦(1 تشرين الأول 1926 – 11 كانون الأول 2003)⁩، العالم والسياسي الباكستاني وابن محمد عبد العليم صديقي؛ تذكر دراسته في الله آباد وميروت وعضويته في مجلس الأمة الباكستاني ومجلس الشيوخ، ووفاته بأزمة قلبية في 11 كانون الأول 2003 ودفنه في ضريح عبد الله شاه غازي بكراتشي، وهي مختصر مترجم عن المقالة الإنجليزية بنفس مراجعها."
  en: "The Arabic Wikipedia article on Shah Ahmad Noorani (1 October 1926 – 11 December 2003), the Pakistani scholar and politician and son of Muhammad Abdul Aleem Siddiqi; it records his studies at Allahabad and Meerut, his membership of Pakistan's National Assembly and Senate, and his death by heart attack on 11 December 2003 with burial at the Abdullah Shah Ghazi shrine in Karachi. It is a condensed translation of the English article, carrying the same citations, and is counted as the same text family."
  es: "El artículo de Wikipedia en árabe sobre Shah Ahmad Noorani (1 de octubre de 1926 - 11 de diciembre de 2003), erudito y político pakistaní e hijo de Muhammad Abdul Aleem Siddiqi, recoge sus estudios en Allahabad y Meerut, su pertenencia a la Asamblea Nacional y al Senado de Pakistán, y su fallecimiento por infarto el 11 de diciembre de 2003, siendo enterrado en el santuario de Abdullah Shah Ghazi en Karachi. Se trata de una traducción abreviada del artículo en inglés, que conserva las mismas citas, y pertenece a la misma familia textual."
  fr: "L'article de Wikipédia en arabe consacré à Shah Ahmad Noorani (1er octobre 1926 – 11 décembre 2003), érudit et homme politique pakistanais, fils de Muhammad Abdul Aleem Siddiqi, relate ses études à Allahabad et Meerut, son mandat à l'Assemblée nationale et au Sénat du Pakistan, ainsi que son décès par crise cardiaque le 11 décembre 2003 et son inhumation au mausolée d'Abdullah Shah Ghazi à Karachi. Il s'agit d'une traduction abrégée de l'article anglais, reprenant les mêmes citations et appartenant à la même famille de textes."
  ur: "شاہ احمد نورانی ⁦(1 اکتوبر 1926 - 11 دسمبر 2003)⁩ پر عربی ویکیپیڈیا مضمون، پاکستانی اسکالر اور سیاست دان اور محمد عبدالعلیم صدیقی کے بیٹے؛ اس میں الہ آباد اور میرٹھ میں ان کی تعلیم، پاکستان کی قومی اسمبلی اور سینیٹ کی رکنیت اور 11 دسمبر 2003 کو کراچی میں عبداللہ شاہ غازی کے مزار پر تدفین کے ساتھ دل کا دورہ پڑنے سے ان کی موت کو ریکارڈ کیا گیا ہے۔ یہ انگریزی مضمون کا گاڑھا ترجمہ ہے، جس میں ایک جیسے حوالہ جات ہیں، اور اسی متن کے خاندان میں شمار ہوتے ہیں۔"
