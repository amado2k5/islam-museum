summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بهبود خان جوانشير؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في 24 يوليو 1878 في آزاد قره قويونلو، ودراسته الهندسة في فرايبرغ (1902–1906)، وعضويته في تنظيم «دفاعي» بحسب وثائق الأرشيف، ووزارته الداخلية (1918)، واغتياله في القسطنطينية في 18 يوليو 1921 ضمن «عملية نمسيس». لا تذكر شيئًا عن دينه."
  en: "English Wikipedia article on Behbud Khan Javanshir; used for entity facts only. It recounts his birth on 24 July 1878 at Azad Qaraqoyunlu, his engineering studies at Freiberg (1902–1906), his membership of the Difai organisation according to archival documents, his interior ministry (1918), and his assassination at Constantinople on 18 July 1921 in Operation Nemesis. It makes no statement about his religion."
  es: "Artículo de la Wikipedia en inglés sobre Behbud Khan Javanshir; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 24 de julio de 1878 en Azad Qaraqoyunlu, sus estudios de ingeniería en Freiberg (1902-1906), su pertenencia a la organización Difai según documentos de archivo, su cargo en el Ministerio del Interior (1918) y su asesinato en Constantinopla el 18 de julio de 1921 durante la Operación Némesis. No menciona su religión."
  fr: "Article de Wikipédia en anglais sur Behbud Khan Javanshir; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance le 24 juillet 1878 à Azad Qaraqoyunlu, ses études d'ingénieur à Freiberg (1902-1906), son appartenance à l'organisation Difai d'après des documents d'archives, son ministère de l'Intérieur (1918) et son assassinat à Constantinople le 18 juillet 1921 lors de l'opération Némésis. Il ne mentionne pas sa religion."
  ur: "بہبود خان جوانشیر پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 24 جولائی 1878 کو آزاد قراقونلو میں ان کی پیدائش، فریبرگ میں ان کی انجینئرنگ کی تعلیم (1902–1906)، آرکائیول دستاویزات کے مطابق ڈیفائی تنظیم کی رکنیت، ان کی وزارت داخلہ (1918)، اور 18 جولائی 2019 کو قسطنطنیہ میں ان کے قتل کا ذکر ہے۔ اس کے مذہب کے بارے میں کوئی بیان نہیں ہے۔"
  tr: "Behbood Khan Javanashir hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 24 Temmuz 1878'de Azad Qara Qoyunlu'da doğmasını, Freiburg'da mühendislik eğitimini (1902–1906), arşiv belgelerine göre \"savunmacı\" bir örgüte üyeliğini, İçişleri Bakanlığını (1918) ve 18 Temmuz 1921'de \"Nemesis Operasyonu\" kapsamında Konstantinopolis'te suikastını anlatır. Dini hakkında hiçbir şey belirtilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Behbood Khan Javanashir; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 24 Juli 1878 di Azad Qara Qoyunlu, studinya tentang teknik di Freiburg (1902–1906), keanggotaannya dalam organisasi \"defensif\" menurut dokumen arsip, Kementerian Dalam Negeri (1918), dan pembunuhannya di Konstantinopel pada 18 Juli 1921, sebagai bagian dari \"Operasi Nemesis.\" Tidak menyebutkan apa pun tentang agamanya."
