  ar: "مقالة ويكيبيديا الإنجليزية عن بهبود خان جوانشير؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في 24 يوليو 1878 في آزاد قره قويونلو، ودراسته الهندسة في فرايبرغ (1902–1906)، وعضويته في تنظيم «دفاعي» بحسب وثائق الأرشيف، ووزارته الداخلية (1918)، واغتياله في القسطنطينية في 18 يوليو 1921 ضمن «عملية نمسيس». لا تذكر شيئًا عن دينه."
  en: "English Wikipedia article on Behbud Khan Javanshir; used for entity facts only. It recounts his birth on 24 July 1878 at Azad Qaraqoyunlu, his engineering studies at Freiberg (1902–1906), his membership of the Difai organisation according to archival documents, his interior ministry (1918), and his assassination at Constantinople on 18 July 1921 in Operation Nemesis. It makes no statement about his religion."
