reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him as born 23 September 1882 (place given only as Istanbul), son of Ismail Fazil Pasha and of Zekiye Hanım, daughter of Müşir Mehmed Ali Pasha; a Military College classmate of Mustafa Kemal Atatürk and Kâzım Karabekir; organiser of the western Anatolian resistance and first general commander of the National Forces; ambassador to Moscow, where he signed the Treaty of Moscow on 16 March 1921; general secretary of the Progressive Republican Party, tried at İzmir and acquitted in 1926; Minister of Public Works 1939–1943 and of Transport 1943–1946; Speaker of the Parliament from 30 January to 1 November 1948; deputy until the 1960 coup; dead at Istanbul on 10 January 1968, buried in accordance with his will in the yard of a mosque near Geyve station — its further statement that his remains were later moved to the Turkish State Cemetery carries the article's own 'citation needed' flag, and the Turkish article still gives Geyve as his resting place. It makes no statement of his religion: its infobox has no religion field and its text names none."
