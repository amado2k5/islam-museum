  ar: "مقالة ويكيبيديا الإنجليزية عن علي فؤاد جيبسوي؛ تُستخدم لوقائع الكيان فقط. تروي تنظيمه المقاومة في غرب الأناضول، وسفارته في موسكو وتوقيعه معاهدتها سنة 1921، ووزارتيه ورئاسته البرلمان سنة 1948، ووفاته ودفنه وفق وصيته في غيفه."
  en: "English Wikipedia article on Ali Fuat Cebesoy; used for entity facts only. It recounts his organisation of the resistance in western Anatolia, his Moscow embassy and the 1921 Treaty of Moscow, his ministries and his 1948 speakership, and his death and burial at Geyve in accordance with his will."
