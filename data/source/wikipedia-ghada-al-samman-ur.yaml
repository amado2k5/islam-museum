  ar: "مقالة ويكيبيديا الأردية القصيرة عن غادة السمان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في دمشق سنة 1942 لأسرة دمشقية مرموقة محافظة ووالدها أحمد السمان رئيس الجامعة السورية، وهي مترجمة عن المقالة الإنجليزية، وتصنّفها تصنيفاتها في الشخصيات المسلمة السورية وهو تصنيف ملفّ لا نصّ."
  en: "Short Urdu Wikipedia article on Ghada al-Samman; used for entity facts only. It gives her birth in Damascus in 1942 to a prominent, conservative Damascene family and her father Ahmad al-Samman, president of the Syrian University; it is a translation of the English article. Its categories file her under Syrian Muslim personalities — a category filing, not a text attestation."
