summary:
  ar: "مقالة ويكيبيديا الأردية القصيرة عن غادة السمان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في دمشق سنة 1942 لأسرة دمشقية مرموقة محافظة ووالدها أحمد السمان رئيس الجامعة السورية، وهي مترجمة عن المقالة الإنجليزية، وتصنّفها تصنيفاتها في الشخصيات المسلمة السورية وهو تصنيف ملفّ لا نصّ."
  en: "Short Urdu Wikipedia article on Ghada al-Samman; used for entity facts only. It gives her birth in Damascus in 1942 to a prominent, conservative Damascene family and her father Ahmad al-Samman, president of the Syrian University; it is a translation of the English article. Its categories file her under Syrian Muslim personalities — a category filing, not a text attestation."
  es: "Breve artículo de Wikipedia en urdu sobre Ghada al-Samman; se utiliza únicamente para datos sobre la persona. Indica que nació en Damasco en 1942 en el seno de una familia damascena prominente y conservadora, y que su padre era Ahmad al-Samman, rector de la Universidad Siria. Se trata de una traducción del artículo en inglés. La clasifican dentro de la categoría de personalidades musulmanas sirias, una clasificación que no constituye una declaración textual."
  fr: "Court article de Wikipédia en ourdou sur Ghada al-Samman; utilisé uniquement à titre informatif. Il indique qu'elle est née à Damas en 1942, au sein d'une famille damascène conservatrice et influente, et que son père, Ahmad al-Samman, était président de l'Université syrienne. Il s'agit d'une traduction de l'article anglais. Ses catégories la classent dans la catégorie « Personnalités musulmanes syriennes » – un classement par catégorie, et non une attestation textuelle."
  ur: "غدہ الصمان پر مختصر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 1942 میں دمشق میں ایک ممتاز، قدامت پسند دمشق خاندان اور اس کے والد احمد الصمان، شامی یونیورسٹی کے صدر کے ہاں ہوئی۔ یہ انگریزی مضمون کا ترجمہ ہے۔ اس کے زمرے اسے شامی مسلم شخصیات کے تحت فائل کرتے ہیں - ایک زمرہ فائلنگ، نہ کہ متن کی تصدیق۔"
