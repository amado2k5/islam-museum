summary:
  ar: "مدخل «أبو سفيان» في موسوعة TDV الإسلامية التركية بقلم إرفان أيجان (المجلد 10، إسطنبول 1994، ص 230–232)، ويذكر نشأته وتجارته وإدارته لتجارة قبيلته، وقيادته لقافلة الشام ومعركة بدر، ثم قيادته في أحد والخندق، وإسلامه يوم الفتح."
  en: "The TDV İslâm Ansiklopedisi entry 'Ebû Süfyân' (Abu Sufyan ibn Harb) by İrfan Aycan (vol. 10, Istanbul 1994, pp. 230–232). It covers his trade and the management of his clan's commerce, the Syrian caravan that led to Badr, his command at Uhud and the Trench, and his conversion at the conquest of Mecca."
