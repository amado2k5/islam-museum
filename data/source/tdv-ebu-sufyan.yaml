summary:
  ar: "مدخل «أبو سفيان» في موسوعة TDV الإسلامية التركية بقلم إرفان أيجان ⁦(المجلد 10، إسطنبول 1994، ص 230–232)⁩، ويذكر نشأته وتجارته وإدارته لتجارة قبيلته، وقيادته لقافلة الشام ومعركة بدر، ثم قيادته في أحد والخندق، وإسلامه يوم الفتح."
  en: "The TDV İslâm Ansiklopedisi entry 'Ebû Süfyân' (Abu Sufyan ibn Harb) by İrfan Aycan (vol. 10, Istanbul 1994, pp. 230–232). It covers his trade and the management of his clan's commerce, the Syrian caravan that led to Badr, his command at Uhud and the Trench, and his conversion at the conquest of Mecca."
  es: "La entrada «Ebû Süfyân» (Abu Sufyan ibn Harb) de la TDV İslâm Ansiklopedisi, escrita por İrfan Aycan (vol. 10, Estambul, 1994, págs. 230-232), abarca su actividad comercial y la gestión del comercio de su clan, la caravana siria que condujo a Badr, su mando en Uhud y la Trinchera, y su conversión durante la conquista de La Meca."
  fr: "L'article « Ebû Süfyân » (Abu Sufyan ibn Harb) de l'encyclopédie islamique TDV (vol. 10, Istanbul, 1994, p. 230-232) traite de son commerce et de la gestion des affaires de son clan, de la caravane syrienne qui mena à Badr, de son commandement à Uhud et au Fossé, ainsi que de sa conversion lors de la conquête de La Mecque."
  ur: "TDV İslâm Ansiklopedisi entry 'Ebû Süfyan' ⁦(ابو سفیان ابن حرب)⁩ از عرفان آیکن ⁦(جلد 10، استنبول 1994، صفحہ 230-232)⁩۔ اس میں اس کی تجارت اور اس کے قبیلے کی تجارت کا انتظام، بدر کی طرف جانے والا شامی قافلہ، احد اور خندق میں اس کی کمان، اور فتح مکہ کے وقت اس کی تبدیلی کا احاطہ کیا گیا ہے۔"
