reliability_note: "Read on 1 November 2026 in the web edition, from the opening through the events after the Conquest of Mecca up to Huneyn. Facts taken: his birth and family, his trade like his father's and his role in managing his clan's trade, the Syrian caravan he led and its diversion that the entry links to Badr, the goods of that caravan assigned to the war, his 628 trade journey to Syria with thirty men, and his later command in the Meccan forces. Not read: the rest of the entry after Huneyn. The entry is separate from 'Ebû Süfyân el-Hâşimî' (a different person); that entry was not read. The printed range pp. 230–232 is the one the page prints."
