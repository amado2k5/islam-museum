label: { ar: "فوائد من تفسير سورة لقمان للشيخ عبد الله الشنقيطي — مجلس الألوكة", en: "Benefits from the tafsir of Surat Luqman by Shaykh Abdullah al-Shanqeeti — Alukah Majlis" }
summary:
  ar: "موضوع في مجلس الألوكة يسجل فيه أحد الطلبة فوائد مدونة من تفسير الشيخ عبد الله الشنقيطي لسورة لقمان: في التوحيد وبر الوالدين والصلاة والصبر والأدب مع الناس، وتعليقاته على كتب التفسير والمصطلح؛ ويختم بالدعاء أن يحفظ الله الشيخ عبد الله الشنقيطي."
  en: "A thread on the Alukah Majlis forum in which a student records noted benefits from Shaykh Abdullah al-Shanqeeti's tafsir of Surat Luqman: on tawhid, kindness to parents, prayer, patience and conduct with people, together with his remarks on works of tafsir and hadith terminology. It closes with a prayer that God preserve Shaykh Abdullah al-Shanqeeti."
  es: "En un hilo del foro Alukah Majlis, un estudiante recoge los beneficios que ha obtenido del tafsir de la Sura Luqman del Shaykh Abdullah al-Shanqeeti: sobre el tawhid (la unicidad de Dios), la bondad hacia los padres, la oración, la paciencia y el trato con los demás, junto con sus comentarios sobre obras de tafsir y terminología de hadices. Finaliza con una oración para que Dios preserve al Shaykh Abdullah al-Shanqeeti."
  fr: "Sur le forum Alukah Majlis, un étudiant relate les bienfaits qu'il a tirés du tafsir de la sourate Luqman par le cheikh Abdullah al-Shanqeeti: l'unicité d'autrui (tawhid), la bienveillance envers les parents, la prière, la patience et la conduite envers autrui, ainsi que ses remarques sur les ouvrages de tafsir et la terminologie des hadiths. Il conclut par une prière pour la protection divine du cheikh Abdullah al-Shanqeeti."
  ur: "علوقہ مجلس فورم پر ایک دھاگہ جس میں ایک طالب علم نے شیخ عبداللہ الشنقیطی کی سورۃ لقمان کی تفسیر سے نمایاں فوائد درج کیے ہیں: توحید، والدین کے ساتھ حسن سلوک، دعا، صبر اور لوگوں کے ساتھ برتاؤ، تفسیر اور حدیث کی اصطلاحات پر اپنے تبصرے کے ساتھ۔ اس کا اختتام اس دعا کے ساتھ ہوتا ہے کہ اللہ تعالیٰ شیخ عبداللہ الشنقیطی کو سلامت رکھے۔"
  tr: "Alukah toplantısında, öğrencilerden biri Şeyh Abdullah Al-Shanqeeti'nin Kutman Suresi'nin tefsirinden kaydedilen faydaları kaydeder: tek tanrıcılık, ebeveynlere saygı, dua, sabır ve insanlarla görgü kuralları ile tefsir kitapları ve terminoloji kitapları üzerine yorumları kaydeder; son olarak, Allah'ın Şeyh Abdullah Al-Shanqeeti'yi korusun diye dua eder."
  id: "Topik dalam pertemuan Alukah di mana salah satu murid mencatat manfaat yang tercatat dari Tafsir Surah Luqman karya Sheikh Abdullah Al-Shanqeeti: tentang monoteisme, menghormati orang tua, doa, kesabaran, dan tata krama dengan orang lain, serta komentarnya tentang buku tafsir dan terminologi; ia menutup dengan doa agar Tuhan melindungi Sheikh Abdullah Al-Shanqeeti."
