summary:
  ar: "موضوع في مجلس الألوكة يسجل فيه أحد الطلبة فوائد مدونة من تفسير الشيخ عبد الله الشنقيطي لسورة لقمان: في التوحيد وبر الوالدين والصلاة والصبر والأدب مع الناس، وتعليقاته على كتب التفسير والمصطلح؛ ويختم بالدعاء أن يحفظ الله الشيخ عبد الله الشنقيطي."
  en: "A thread on the Alukah Majlis forum in which a student records noted benefits from Shaykh Abdullah al-Shanqeeti's tafsir of Surat Luqman: on tawhid, kindness to parents, prayer, patience and conduct with people, together with his remarks on works of tafsir and hadith terminology. It closes with a prayer that God preserve Shaykh Abdullah al-Shanqeeti."
