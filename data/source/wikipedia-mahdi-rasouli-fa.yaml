reliability_note: "Read in full on 7 November 2026; the reading tools available in this run did not expose a revision id, so none is recorded. Used for the exact birth date — 12 Mordad 1367 in the Persian calendar (3 August 1988) in Zanjan — and for his education as stated in the lead (civil engineering at the University of Zanjan; a bachelor's in cultural-affairs management and a master's in Qur'an and hadith sciences from Dar al-Hadith University, citing ILNA), and for his father's death in Aban 1369 (November 1990). Its lead calls him only a 'maddah of the Ahl al-Bayt' (مداح اهل بیت) and nowhere attests a school for him in prose."
