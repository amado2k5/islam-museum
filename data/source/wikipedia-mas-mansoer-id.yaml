summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن ماس منصور؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في تاريخي الميلاد والوفاة، وتفصّل تعليمه في معاهد بانغكالان ومكة والأزهر، ونشاطه في «تصوير الأفكار» ونهدة الوطن، ورئاسته للمحمدية وتسليمه إياها إلى كي باغوس هاديكوسومو، ووفاته في سجن كاليسوسوك ودفنه في لانغار غيبو بسورابايا. حقلا الديانة والطائفة في صندوقها فارغان."
  en: "Indonesian Wikipedia article on Mas Mansoer; used for entity facts only. It agrees with the English article on his birth and death dates, and details his education at Bangkalan, in Mecca and at al-Azhar, his Taswir al-Afkar and Nahdlatul Wathan activity, his Muhammadiyah chairmanship and its handover to Ki Bagoes Hadikoesoemo, and his death in Kalisosok Prison with burial at Langgar Gipo, Surabaya. Its infobox religion and denomination fields are empty."
  es: "Artículo de la Wikipedia en indonesio sobre Mas Mansoer; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés en cuanto a sus fechas de nacimiento y muerte, y detalla su educación en Bangkalan, en La Meca y en Al-Azhar, su actividad en Taswir al-Afkar y Nahdlatul Wathan, su presidencia de Muhammadiyah y su traspaso a Ki Bagoes Hadikoesoemo, y su muerte en la prisión de Kalisosok, con sepultura en Langgar Gipo, Surabaya. Los campos de religión y denominación en su ficha informativa están vacíos."
  fr: "Article de Wikipédia indonésien sur Mas Mansoer; utilisé uniquement pour les informations le concernant. Il concorde avec l’article anglais quant à ses dates de naissance et de décès, et détaille ses études à Bangkalan, à La Mecque et à al-Azhar, son activité au sein de Taswir al-Afkar et de Nahdlatul Wathan, sa présidence de Muhammadiyah et sa passation de pouvoir à Ki Bagoes Hadikoesoemo, ainsi que sa mort à la prison de Kalisosok et son inhumation à Langgar Gipo, à Surabaya. Les champs « religion » et « dénomination » de son infobox sont vides."
  ur: "انڈونیشیائی ویکیپیڈیا مضمون ماس مانسور پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش اور وفات کی تاریخوں کے انگریزی مضمون سے متفق ہے، اور مکہ اور الازہر میں بنکلان میں اس کی تعلیم، اس کی تسویر الافکار اور نہدلۃ الواتھن کی سرگرمی، اس کی محمدیہ کی سربراہی اور اسے کی باگوس ہادیکوسوئیمو کے حوالے کرنے، اور کالیسوسوک جیل میں اس کی موت، لنگر گیپو میں تدفین کے ساتھ۔ اس کے معلوماتی خانے کے مذہب اور فرقے خالی ہیں۔"
