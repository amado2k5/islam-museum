summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن ماس منصور؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في تاريخي الميلاد والوفاة، وتفصّل تعليمه في معاهد بانغكالان ومكة والأزهر، ونشاطه في «تصوير الأفكار» ونهدة الوطن، ورئاسته للمحمدية وتسليمه إياها إلى كي باغوس هاديكوسومو، ووفاته في سجن كاليسوسوك ودفنه في لانغار غيبو بسورابايا. حقلا الديانة والطائفة في صندوقها فارغان."
  en: "Indonesian Wikipedia article on Mas Mansoer; used for entity facts only. It agrees with the English article on his birth and death dates, and details his education at Bangkalan, in Mecca and at al-Azhar, his Taswir al-Afkar and Nahdlatul Wathan activity, his Muhammadiyah chairmanship and its handover to Ki Bagoes Hadikoesoemo, and his death in Kalisosok Prison with burial at Langgar Gipo, Surabaya. Its infobox religion and denomination fields are empty."
