summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن آزاد موبين: طبيب من كيرالا أسس أستر دي إم للرعاية الصحية في دبي سنة 1987، تذكر مولده بسنة 1953 بيومين مختلفين، وأنه مؤسس جمعية مسلمي الهند في الإمارات."
  en: "English Wikipedia article on Azad Moopen, the Kerala physician who founded Aster DM Healthcare in Dubai in 1987; it gives his 1953 birth with two different days, and records him as founding chairman of the Association of Indian Muslims in the UAE."
  es: "Artículo de la Wikipedia en inglés sobre Azad Moopen, el médico de Kerala que fundó Aster DM Healthcare en Dubái en 1987; en él se indica que nació en 1953 con dos días diferentes y se le menciona como presidente fundador de la Asociación de Musulmanes Indios en los Emiratos Árabes Unidos."
  fr: "L'article de Wikipédia en anglais sur Azad Moopen, le médecin du Kerala qui a fondé Aster DM Healthcare à Dubaï en 1987, indique sa naissance en 1953 avec deux dates différentes et le mentionne comme président fondateur de l'Association des musulmans indiens aux Émirats arabes unis."
  ur: "آزاد موپن پر انگریزی ویکیپیڈیا کا مضمون، کیرالہ کے معالج جنہوں نے 1987 میں دبئی میں Aster DM Healthcare کی بنیاد رکھی۔ یہ ان کی 1953 کی پیدائش دو مختلف دنوں کے ساتھ کرتا ہے، اور اسے متحدہ عرب امارات میں ہندوستانی مسلمانوں کی ایسوسی ایشن کے بانی چیئرمین کے طور پر ریکارڈ کرتا ہے۔"
