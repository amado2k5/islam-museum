reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. The article is a translation of the English article and so forms one source family with it; it adds no independent attestation. It calls him a Chinese Muslim scholar and translator, gives his birth at Shadian in Yunnan in 1906 and death in 1978, his move to Shanghai for study, his dispatch to al-Azhar in 1931 in the first Chinese government mission, his Arabic book on Islam in China and his translations of the Analects and of Muhammad Abduh's Risalat al-Tawhid, and his Peking University chair from 1946. It names no school, order or movement."
