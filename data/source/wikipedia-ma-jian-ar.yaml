summary:
  ar: "مقالة ويكيبيديا العربية عن محمد ماكين الصيني ⁦(ما جيان)⁩؛ تُستخدم لوقائع الكيان فقط. وهي ترجمة للمقالة الإنجليزية: تروي العالم والمترجم من شاديان (1906–1978) الموفد إلى الأزهر سنة 1931، وأستاذ جامعة بكين منذ 1946، ومترجم القرآن إلى الصينية والداعي إلى التوافق بين الماركسية والإسلام."
  en: "Arabic Wikipedia article on Muhammad Ma Jian; used for entity facts only. It is a translation of the English article: the scholar and translator from Shadian (1906–1978) sent to al-Azhar in 1931, Peking University professor from 1946, translator of the Qur'an into Chinese who argued for the compatibility of Marxism and Islam."
  es: "Artículo en árabe de la Wikipedia sobre Muhammad Ma Jian; se utiliza únicamente para datos sobre la persona. Es una traducción del artículo en inglés: el erudito y traductor de Shadian (1906-1978) enviado a al-Azhar en 1931, profesor de la Universidad de Pekín desde 1946, traductor del Corán al chino que defendió la compatibilidad del marxismo y el islam."
  fr: "Article de Wikipédia en arabe sur Muhammad Ma Jian; utilisé uniquement à des fins descriptives. Il s'agit d'une traduction de l'article anglais: érudit et traducteur originaire de Shadian (1906-1978), envoyé à al-Azhar en 1931, professeur à l'Université de Pékin à partir de 1946, traducteur du Coran en chinois, qui défendait la compatibilité du marxisme et de l'islam."
  ur: "محمد ما جیان پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انگریزی مضمون کا ترجمہ ہے: شادیان (1906-1978) کے عالم اور مترجم نے 1931 میں الازہر کو بھیجا، پیکنگ یونیورسٹی کے پروفیسر 1946 سے، چینی زبان میں قرآن کا ترجمہ کرنے والا جس نے مارکسزم اور اسلام کی مطابقت پر بحث کی۔"
  tr: "Çinli Muhammed Makin (Ma Jian) hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. İngilizce makale olan Shadian (1906–1978) adlı makalenin çevirisi; Shadian 1931'de El-Ezher'e gönderilmiş, 1946'dan beri Pekin Üniversitesi'nde profesör, Kur'an'ı Çince'ye çevirmiş ve Marksizm ile İslam arasında uzlaşmayı savunmuştur."
  id: "Artikel Wikipedia bahasa Arab tentang Muhammad Makin (Ma Jian) dari Tiongkok; digunakan hanya untuk fakta entitas tersebut. Ini adalah terjemahan dari artikel berbahasa Inggris: The Narrator of the World and Translator from Shadian (1906–1978), yang dikirim ke Al-Azhar pada tahun 1931, menjadi profesor di Universitas Peking sejak 1946, dan penerjemah Al-Qur'an ke dalam bahasa Cina serta mengadvokasi rekonsiliasi antara Marxisme dan Islam."
