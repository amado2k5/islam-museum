  en: "Arabic Wikipedia article on Muhammad Ma Jian; used for entity facts only. It is a translation of the English article: the scholar and translator from Shadian (1906–1978) sent to al-Azhar in 1931, Peking University professor from 1946, translator of the Qur'an into Chinese who argued for the compatibility of Marxism and Islam."
