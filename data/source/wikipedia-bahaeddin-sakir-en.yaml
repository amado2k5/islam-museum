summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بهاء الدين شاكر؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته سنة 1874 في سليفن ووفاته اغتيالًا في 17 أبريل 1922 في برلين، وتوثق ترؤّسه القسم السياسي في التشكيلات المخصوصة ودوره في تهجير الأرمن."
  en: "English Wikipedia article on Bahaeddin Şakir; used for entity facts only. It gives his birth in 1874 at Sliven and his assassination on 17 April 1922 at Berlin, and documents his headship of the Special Organization's political section and his role in the Armenian deportations."
  es: "Artículo de la Wikipedia en inglés sobre Bahaeddin Şakir; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1874 en Sliven y su asesinato el 17 de abril de 1922 en Berlín, y documenta su liderazgo de la sección política de la Organización Especial y su papel en las deportaciones de armenios."
  fr: "Article de Wikipédia en anglais sur Bahaeddin Şakir; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance en 1874 à Sliven et son assassinat le 17 avril 1922 à Berlin, et documente son poste à la tête de la section politique de l'Organisation spéciale ainsi que son rôle dans les déportations arméniennes."
  ur: "بہاء الدین Şakir پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1874 میں سلوین میں اس کی پیدائش اور 17 اپریل 1922 کو برلن میں اس کا قتل، اور اسپیشل آرگنائزیشن کے سیاسی حصے کی سربراہی اور آرمینیائی جلاوطنی میں اس کے کردار کو دستاویز کرتا ہے۔"
  tr: "Bahaa al-Din Şakir hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1874'te Sliven'de doğması ve 17 Nisan 1922'de Berlin'de ölümü, özel oluşumlarda siyasi bölümün liderliğini ve Ermenilerin yerinden edilmesindeki rolünü belgeleyen bir suikastı işaret eder."
  id: "Artikel Wikipedia bahasa Inggris tentang Bahaa al-Din Shakir; digunakan hanya untuk fakta entitas. Kelahirannya pada tahun 1874 di Sliven dan kematiannya pada 17 April 1922 di Berlin menunjukkan sebuah pembunuhan, mendokumentasikan kepemimpinannya atas seksi politik dalam formasi khusus dan perannya dalam pengusiran orang Armenia."
