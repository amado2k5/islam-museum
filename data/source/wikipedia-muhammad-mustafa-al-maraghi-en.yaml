reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 24 October 2026; a short article resting on the Encyclopaedia of Islam (Skovgaard-Petersen), the TDV entry and the Oxford Dictionary of Islam. It gives: born 5 March 1881 at al-Maragha, Sohag (the Arabic article, the Urdu article and the TDV entry all give 9 March 1881, which the record follows); pupil of Muhammad Abduh at al-Azhar; Grand Qadi of the Sudan; member of the 1924 Greater Committee on the caliphate; Sheikh al-Azhar 1928–1929 (forced out over his reform proposals, including opening the door of ijtihad and integrating the schools of law) and again from April 1935 until his death; honorary OBE 1918; advocate of modern sciences in the Azhar curriculum; met Marmaduke Pickthall over authorising the latter's Qur'an translation; led Azhar delegations to the interfaith congresses in London 1936, The Hague 1937 and Paris 1939; died 1945. It names no madhhab for him — one of the silences the record's faith note relies on."
