summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد مصطفى المراغي، شيخ الأزهر مرتين ⁦(1928-1929 و1935-1945)⁩؛ تُستخدم لوقائع الكيان فقط. توثّق تلمذته على محمد عبده، وقضاءه الأعلى في السودان، ومقترحاته الإصلاحية ونشاطه في مؤتمرات الأديان، ووفاته سنة 1945. لا تذكر مذهبا فقهيا له."
  en: "English Wikipedia article on Muhammad Mustafa al-Maraghi, twice Grand Imam of al-Azhar (1928–1929 and 1935–1945); used for entity facts only. It records his studies under Muhammad Abduh, his chief judgeship of the Sudan, his reform proposals and his interfaith-congress activity, and his death in 1945. It names no fiqh school for him."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad Mustafa al-Maraghi, dos veces Gran Imán de al-Azhar (1928-1929 y 1935-1945); utilizado únicamente para datos sobre la persona. Documenta sus estudios con Muhammad Abduh, su cargo como juez principal de Sudán, sus propuestas de reforma, su actividad en congresos interreligiosos y su fallecimiento en 1945. No menciona ninguna escuela de jurisprudencia islámica (fiqh) relacionada con él."
  fr: "L'article de Wikipédia en anglais consacré à Muhammad Mustafa al-Maraghi, deux fois grand imam d'al-Azhar (1928-1929 et 1935-1945), est utilisé uniquement à des fins d'information sur l'entité. Il relate ses études auprès de Muhammad Abduh, son poste de juge en chef du Soudan, ses propositions de réforme, son activité au sein de congrès interreligieux et sa mort en 1945. Aucune école de jurisprudence islamique (fiqh) n'est mentionnée à son sujet."
  ur: "محمد مصطفیٰ المراغی پر انگریزی ویکیپیڈیا کا مضمون، الازہر کے دو مرتبہ عظیم الشان امام ⁦(1928-1929 اور 1935-1945)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں محمد عبدہ کے تحت ان کی تعلیم، سوڈان کے چیف منصف، ان کی اصلاحی تجاویز اور ان کی بین المذاہب کانگریس سرگرمی، اور 1945 میں ان کی وفات کو درج کیا گیا ہے۔ اس میں ان کے لیے کسی فقہ کا نام نہیں ہے۔"
  tr: "Muhammed Mustafa Al-Maraghi, El-Ezher Şeyhi hakkında İngilizce Wikipedia makalesi iki kez (1928-1929 ve 1935-1945); yalnızca varlığın gerçekleri için kullanılmıştır. Muhammed Abduh'un öğrencisini, Sudan'daki yüksek yargıçlığını, reform önerilerini, dini konferanslardaki faaliyetlerini ve 1945'teki ölümünü belgelemektedir. Onun bir hukuk okulu yoktur."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad Mustafa Al-Maraghi, Sheikh Al-Azhar dua kali (1928-1929 dan 1935-1945); hanya digunakan untuk fakta entitas. Artikel ini mendokumentasikan muridnya di bawah Muhammad Abduh, jabatan hakim tertinggi di Sudan, proposal reformasinya, aktivitasnya dalam konferensi agama, dan kematiannya pada tahun 1945. Tidak ada sekolah yurisprudensi darinya."
