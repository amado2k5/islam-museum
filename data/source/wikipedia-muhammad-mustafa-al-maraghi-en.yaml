  ar: "مقالة ويكيبيديا الإنجليزية عن محمد مصطفى المراغي، شيخ الأزهر مرتين (1928-1929 و1935-1945)؛ تُستخدم لوقائع الكيان فقط. توثّق تلمذته على محمد عبده، وقضاءه الأعلى في السودان، ومقترحاته الإصلاحية ونشاطه في مؤتمرات الأديان، ووفاته سنة 1945. لا تذكر مذهبا فقهيا له."
  en: "English Wikipedia article on Muhammad Mustafa al-Maraghi, twice Grand Imam of al-Azhar (1928–1929 and 1935–1945); used for entity facts only. It records his studies under Muhammad Abduh, his chief judgeship of the Sudan, his reform proposals and his interfaith-congress activity, and his death in 1945. It names no fiqh school for him."
