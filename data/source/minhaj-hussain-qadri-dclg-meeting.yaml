label:
  en: "Minhaj-ul-Quran news report: Hussain Mohi-ud-Din Qadri meets the British Department of Communities and Local Government (2009)"
summary:
  ar: "خبر من موقع منهاج القرآن عن لقاء حسين محيي الدين قادري بوزارة المجتمعات البريطانية سنة 2009، يصفه بأنه ابن الشيخ محمد طاهر القادري."
  en: "Minhaj-ul-Quran International news report of 25 February 2009 on Hussain Mohi-ud-Din Qadri's meeting with the British Department of Communities and Local Government, which introduces him as 'Sahibzada Hussain Mohi-ud-Din Qadri, the son of Shaykh-ul-Islam Dr Muhammad Tahir-ul-Qadri'."
  es: "Noticia de Minhaj-ul-Quran International del 25 de febrero de 2009 sobre la reunión de Hussain Mohi-ud-Din Qadri con el Departamento Británico de Comunidades y Gobierno Local, que lo presenta como 'Sahibzada Hussain Mohi-ud-Din Qadri, hijo de Shaykh-ul-Islam Dr. Muhammad Tahir-ul-Qadri'."
  fr: "Article de Minhaj-ul-Quran International du 25 février 2009 sur la rencontre de Hussain Mohi-ud-Din Qadri avec le ministère britannique des Communautés et du Gouvernement local, qui le présente comme « Sahibzada Hussain Mohi-ud-Din Qadri, fils de Shaykh-ul-Islam Dr Muhammad Tahir-ul-Qadri »."
  ur: "منہاج القرآن انٹرنیشنل کی 25 فروری 2009 کی حسین محی الدین قادری کی برطانوی ڈیپارٹمنٹ آف کمیونٹیز اینڈ لوکل گورنمنٹ سے ملاقات کے بارے میں خبر کی رپورٹ، جس میں ان کا تعارف شیخ الاسلام ڈاکٹر محمد طاہرالقادری کے صاحبزادے صاحبزادہ حسین محی الدین قادری کے نام سے کرایا گیا ہے۔"
  tr: "Minhaj al-Quran web sitesinden çıkan bir haber, 2009'da Hüseyin Mohieddin Qadri'nin Britanya Toplulukları Departmanı ile yaptığı görüşmede kendisini Şeyh Muhammed Tahir Qadri'nin oğlu olarak tanımlıyor."
  id: "Sebuah laporan dari situs Minhaj al-Quran tentang pertemuan Hussein Mohieddin Qadri dengan Departemen Komunitas Inggris pada tahun 2009, menggambarkannya sebagai putra Sheikh Muhammad Tahir Qadri."
