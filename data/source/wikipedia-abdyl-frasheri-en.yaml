reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born at Frashër in 1839 (the lead gives 1 June 1839; the German and Turkish articles and Wikidata give 17 August 1839 — recorded as a conflict, the record following the Albanian-national tradition of the Albanian, English and Arabic articles); eldest son of Halit Bey Frashëri; served until 18 in his father's irregular Albanian contingents; after his father's death (1859) head of the household, moving the family to Ioannina in 1865; deputy for Yanina in the first Ottoman parliament 1876–1877, his speech of 14 January 1878; chairman of the Albanian Committee of Janina (1877) and founder-chairman of the Central Committee for Defending Albanian Rights in Istanbul; co-organiser of the League of Prizren (founded 10 June 1878), chairman of its foreign affairs committee and its de facto foreign minister; the Rome delegation of April 1879; the Gjirokastër autonomy programme of 1880; foreign minister of the League's provisional government (1881); the failed Debar assassination attempt of December 1881; captured by Dervish Pasha, death sentence commuted by Abdülhamid II to prison with hard labour at Prizren castle 1882–1885, released 1886 on condition he abandon political activity; died 23 October 1892 at Istanbul (the German and Turkish articles and Wikidata give 11 October 1892 — recorded as a conflict); his son Mit'hat Frashëri. On faith: the family's 'Bektashi religious affiliations' is family background, and his visits to Bektashi tekkes and invitations to their babas 'to join an armed uprising' are political mobilisation narrated in the article itself; neither is an attestation of his own adherence, so the record's faith is unknown, as the faith note states."
