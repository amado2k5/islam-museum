  ar: "مقالة ويكيبيديا الإنجليزية عن عبدول فراشري (1839-1892)؛ تُستخدم لوقائع الكيان فقط. تصف أسرته بأنها أسرة ألبانية مسلمة ذات انتماءات بكتاشية وتذكر زياراته لتكايا بكتاشية لإقناع كبارها بدعم العصبة، وتسرد وقائع قيادته لعصبة بريزرن ومحاكمته وسجنه وعفوه ووفاته."
  en: "English Wikipedia article on Abdyl Frashëri (1839–1892); used for entity facts only. It describes his family as a Muslim Albanian family 'of Bektashi religious affiliations', records his visits to Bektashi tekkes to win their babas for the League, and narrates his League leadership, trial, imprisonment, pardon and death."
