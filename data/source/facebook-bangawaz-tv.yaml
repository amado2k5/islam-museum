summary:
  ar: "صفحة بانغواز تي في على فيسبوك ⁦(بالسورانية: بانگەواز)⁩؛ 2.7 مليون متابع بحسب بيانات وصفية لمنشورات على فيسبوك مؤرخة في 18 فبراير و23 مارس 2026 قرأها حصاد الموجة 199 في 9 نوفمبر 2026 — جلب صفحات فيسبوك محظور في هذه البيئة، فهذا الرقم ليس قراءة مباشرة في هذه الجولة، وقراءة الحصاد الوصفية لم تسجّل اسم مستخدم الصفحة."
  en: "Bangawaz TV's Facebook page ⁦(Sorani: بانگەواز)⁩: 2.7 million followers by Facebook post metadata on posts dated 18 February and 23 March 2026, read by the wave-199 harvest on 9 November 2026 — Facebook page fetch is blocked in this environment, so this figure is not a direct read in this run, and the harvest's metadata read did not record the page's handle."
  ur: "بانگاواز ٹی وی کا فیس بک پیج ⁦(سورانی: بانگەواز)⁩؛ 18 فروری اور 23 مارچ 2026ء کی فیس بک پوسٹوں کے میٹا ڈیٹا کے مطابق 2.7 ملین فالوورز، جو ویو 199 کے ہارویسٹ نے 9 نومبر 2026ء کو پڑھا — اس ماحول میں فیس بک پیج فیچ مسدود ہے، اس لیے یہ تعداد اس رن میں براہِ راست ریڈنگ نہیں، اور ہارویسٹ کی میٹا ڈیٹا ریڈنگ نے پیج کا ہینڈل درج نہیں کیا۔"
  es: "Página de Facebook de Bangawaz TV ⁦(Sorani: بانگەواز)⁩: 2,7 millones de seguidores según los metadatos de las publicaciones de Facebook en publicaciones con fecha del 18 de febrero y del 23 de marzo de 2026, leídas por la cosecha wave-199 el 9 de noviembre de 2026. La obtención de páginas de Facebook está bloqueada en este entorno, por lo que esta cifra no es una lectura directa en esta ejecución, y la lectura de metadatos de la cosecha no registró el identificador de la página."
  fr: "Page Facebook de Bangawaz TV ⁦(Sorani: بانگەواز)⁩: 2,7 millions d'abonnés selon les métadonnées des publications Facebook datées du 18 février et du 23 mars 2026, lues par la vague de récolte 199 le 9 novembre 2026 — La récupération de pages Facebook est bloquée dans cet environnement, ce chiffre ne correspond donc pas à une lecture directe lors de cette exécution, et la lecture des métadonnées de la récolte n'a pas enregistré le nom d'utilisateur de la page."
  tr: "Pangwaz TV Facebook sayfası ⁦(Sorani: بنگووا)⁩, 2,7 milyon takipçi 18 Şubat ve 23 Mart 2026 tarihli Facebook paylaşımlarından alınan meta verilere göre, Harvest Wave 199 tarafından 9 Kasım 2026 tarihlerinde okundu — Facebook sayfalarının açılması bu ortamda yasaktır, çünkü bu sayı bu turda doğrudan okunmamaktadır ve Harvest'ın meta okuması sayfa kullanıcı adını kaydetmemiştir."
  id: "Halaman TV Pangwaz di Facebook ⁦(dalam bahasa Sorani: بنگووا)⁩, 2,7 juta pengikut Menurut metadata dari posting Facebook tertanggal 18 Februari dan 23 Maret 2026, dibacakan oleh Harvest Wave 199 pada 9 November 2026 — Membawa halaman Facebook dilarang dalam lingkungan ini, karena angka ini bukan pembacaan langsung pada putaran ini, dan meta-reading Harvest tidak merekam nama pengguna halaman."
