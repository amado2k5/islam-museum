summary:
  ar: "صفحة بانغواز تي في على فيسبوك ⁦(بالسورانية: بانگەواز)⁩؛ 2.7 مليون متابع بحسب بيانات وصفية لمنشورات على فيسبوك مؤرخة في 18 فبراير و23 مارس 2026 قرأها حصاد الموجة 199 في 9 نوفمبر 2026 — جلب صفحات فيسبوك محظور في هذه البيئة، فهذا الرقم ليس قراءة مباشرة في هذه الجولة، وقراءة الحصاد الوصفية لم تسجّل اسم مستخدم الصفحة."
  en: "Bangawaz TV's Facebook page ⁦(Sorani: بانگەواز)⁩: 2.7 million followers by Facebook post metadata on posts dated 18 February and 23 March 2026, read by the wave-199 harvest on 9 November 2026 — Facebook page fetch is blocked in this environment, so this figure is not a direct read in this run, and the harvest's metadata read did not record the page's handle."
  ur: "بانگاواز ٹی وی کا فیس بک پیج ⁦(سورانی: بانگەواز)⁩؛ 18 فروری اور 23 مارچ 2026ء کی فیس بک پوسٹوں کے میٹا ڈیٹا کے مطابق 2.7 ملین فالوورز، جو ویو 199 کے ہارویسٹ نے 9 نومبر 2026ء کو پڑھا — اس ماحول میں فیس بک پیج فیچ مسدود ہے، اس لیے یہ تعداد اس رن میں براہِ راست ریڈنگ نہیں، اور ہارویسٹ کی میٹا ڈیٹا ریڈنگ نے پیج کا ہینڈل درج نہیں کیا۔"
