reliability_note: "The channel's own Facebook page and its main channel: a primary source for its identity and reach, not independent corroboration. Facebook profile fetch is blocked in this environment, so the page was NOT opened or read directly in this run: the figure of 2.7 million followers rests on the wave-199 harvest's read (9 November 2026) of Facebook post metadata on the page's posts dated 18 February 2026 and 23 March 2026, which named the page 'Bangawaz TV' ⁦(بانگەواز)⁩. The harvest's metadata read did not record the page's handle, and searches in this run (9 November 2026) did not re-pin it — the brand's TikTok (@bangawaztv.official) and Telegram (@bangawaztv23) handles were found, but no Facebook handle or URL is asserted here rather than guessed, so this source record carries no URL. That provenance is stated wherever the figure is used, and the figure is never presented as this writer's own read. The metadata read gives no page creation date, and no source read in this run documents one, so no Facebook page creation date is asserted. The page names no individual author or operator for the channel. Checked via the harvest read on 9 November 2026."
