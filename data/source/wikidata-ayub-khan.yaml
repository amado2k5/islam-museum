reliability_note: "Structured identifiers and dates only. Read on 27 October 2026; the item was grounded through the page properties of the English Wikipedia article on the president, not by name search — the name is shared with the Afghan commander of Maiwand (Q-item distinct), whose record is separate — and its identifier was grepped across all data/person files with no match before this record was written. Its Sunni Islam (P140) value is the only place anywhere a school is named for him, and it is structured data of one family, preserved in the person record's faith note rather than recorded as his faith."
