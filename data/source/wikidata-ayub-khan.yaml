summary:
  ar: "بطاقة ويكي بيانات لأيوب خان رئيس باكستان؛ معرّفات منظمة وتواريخ فقط. تحمل مولده في 14 مايو 1907 ووفاته في 19 أبريل 1974 في إسلام آباد، وقيمتين لدينه: الإسلام عامة والإسلام السني، وكلاهما بيانات منظمة لا نصوص."
  en: "Wikidata item for Ayub Khan, president of Pakistan; structured identifiers and dates only. It carries his birth on 14 May 1907, his death on 19 April 1974 at Islamabad, and two religion values — Islam in general and Sunni Islam — both structured data, not texts."
  es: "Entrada de Wikidata sobre Ayub Khan, presidente de Pakistán; solo contiene identificadores estructurados y fechas. Incluye su fecha de nacimiento, el 14 de mayo de 1907, su fallecimiento, el 19 de abril de 1974 en Islamabad, y dos valores religiosos: el islam en general y el islam sunita; ambos datos estructurados, no textos."
  fr: "Fiche Wikidata concernant Ayub Khan, président du Pakistan; elle ne contient que des identifiants structurés et des dates. On y trouve sa date de naissance (14 mai 1907), sa date de décès (19 avril 1974 à Islamabad) et deux valeurs religieuses: l’islam en général et l’islam sunnite. Il s’agit de données structurées, et non de texte."
  ur: "پاکستان کے صدر ایوب خان کے لیے وکی ڈیٹا آئٹم؛ صرف ساختی شناخت کنندگان اور تاریخیں۔ اس میں 14 مئی 1907 کو ان کی پیدائش، 19 اپریل 1974 کو اسلام آباد میں ان کی موت، اور دو مذہبی اقدار — عمومی طور پر اسلام اور سنی اسلام — دونوں کا ساختی ڈیٹا ہے، متن نہیں۔"
  tr: "Pakistan Cumhurbaşkanı Ayub Khan için Wikidata kartı; yalnızca düzenlenmiş tanımlayıcılar ve tarihler. 14 Mayıs 1907'de doğduğu ve 19 Nisan 1974'te İslamabad'da vefat ettiği iki dinin değerini taşıyor; her ikisi de metin değil, organize veri olan İslam genel olarak ve Sünni İslam."
  id: "Kartu Wikidata untuk Ayub Khan, Presiden Pakistan; hanya pengenal dan tanggal yang terorganisir. Memiliki kelahiran pada 14 Mei 1907, dan kematiannya pada 19 April 1974 di Islamabad, serta dua nilai agamanya: Islam secara umum dan Islam Sunni, keduanya adalah data terorganisir, bukan teks."
