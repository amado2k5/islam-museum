  ar: "مقالة ويكيبيديا الفرنسية عن سعد الغامدي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بالدمام في 7 أغسطس 1967 وحفظه القرآن سنة 1990 وإمامته لجامع كانو من 2012 ومشاركته في تراويح المسجد النبوي رمضان 2009، ولا تسمي مذهبا له."
  en: "French Wikipedia article on Saad Al-Ghamdi; used for entity facts only. It gives his birth at Dammam on 7 August 1967, his memorisation of the Qur'an in 1990, his imamate of the Kanoo Mosque from 2012 and his part in the Prophet's Mosque Tarawih of Ramadan 2009; it names no school for him."
