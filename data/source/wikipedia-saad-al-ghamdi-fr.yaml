summary:
  ar: "مقالة ويكيبيديا الفرنسية عن سعد الغامدي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بالدمام في 7 أغسطس 1967 وحفظه القرآن سنة 1990 وإمامته لجامع كانو من 2012 ومشاركته في تراويح المسجد النبوي رمضان 2009، ولا تسمي مذهبا له."
  en: "French Wikipedia article on Saad Al-Ghamdi; used for entity facts only. It gives his birth at Dammam on 7 August 1967, his memorisation of the Qur'an in 1990, his imamate of the Kanoo Mosque from 2012 and his part in the Prophet's Mosque Tarawih of Ramadan 2009; it names no school for him."
  es: "Artículo de la Wikipedia en francés sobre Saad Al-Ghamdi; utilizado únicamente para datos biográficos. Indica que nació en Dammam el 7 de agosto de 1967, que memorizó el Corán en 1990, que fue imamato de la Mezquita de Kanoo desde 2012 y que participó en las oraciones de Tarawih de la Mezquita del Profeta durante el Ramadán de 2009; no menciona ninguna escuela a la que pertenezca."
  fr: "L'article de Wikipédia en français sur Saad Al-Ghamdi, utilisé uniquement pour les informations le concernant, indique sa naissance à Dammam le 7 août 1967, sa mémorisation du Coran en 1990, son imamat de la mosquée Kanoo depuis 2012 et sa participation aux prières de Tarawih à la mosquée du Prophète pendant le Ramadan 2009. Aucune école n'est mentionnée."
  ur: "سعد الغامدی پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 7 اگست 1967 کو دمام میں ان کی پیدائش، 1990 میں ان کا قرآن حفظ، 2012 سے کنو مسجد کی امامت اور رمضان 2009 میں مسجد نبوی میں تراویح میں حصہ لینے سے۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Saad Al-Ghamdi hakkında Fransızca Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Makalede 7 Ağustos 1967'de Dammam'da doğduğu, 1990'da Kur'an'ı ezberlediği, 2012'den beri Kano Camii imamı ve 2009 Ramazan ayında Peygamber Camii'nde Teravih namazlarına katıldığı belirtilir, ancak onun düşünce okulu adı verilmez."
  id: "Artikel Wikipedia Prancis tentang Saad Al-Ghamdi hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya di Dammam pada 7 Agustus 1967, hafalan Al-Qur'an pada tahun 1990, imamnya di Masjid Kano sejak 2012, dan partisipasinya dalam shalat Taraweeh di Masjid Nabi pada Ramadan 2009, namun tidak menyebutkan aliran pemikirannya."
