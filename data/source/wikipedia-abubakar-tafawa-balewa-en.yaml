reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Balewa as born in December 1912 (month precision only) in the village of Tafawa Balewa in Bauchi province, and as overthrown and murdered on 15 January 1966, his body found at a roadside near Lagos and buried in Bauchi. The text makes no statement of his own religion: his Bauchi madrasa schooling is formation, and the 'pious Muslim' of its literary section is the protagonist of his novella Shaihu Umar, not Balewa himself. Its categories file him under 'Nigerian Muslims'. No school is named."
