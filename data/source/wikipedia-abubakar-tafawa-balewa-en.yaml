summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أبي بكر تفاوى باعليوه؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من معلّم ومدير مدرسة إلى أول رئيس وزراء لنيجيريا عند الاستقلال، وروايته «شايحو عمر»، واغتياله في انقلاب 15 يناير 1966."
  en: "English Wikipedia article on Abubakar Tafawa Balewa; used for entity facts only. It recounts his career from teacher and headmaster to Nigeria's first prime minister at independence, his novella Shaihu Umar, and his murder in the coup of 15 January 1966."
  es: "Artículo de la Wikipedia en inglés sobre Abubakar Tafawa Balewa; utilizado únicamente para obtener información sobre la persona. Narra su trayectoria desde maestro y director de escuela hasta convertirse en el primer ministro de Nigeria tras la independencia, su novela corta Shaihu Umar y su asesinato durante el golpe de Estado del 15 de enero de 1966."
  fr: "Article de Wikipédia en anglais sur Abubakar Tafawa Balewa; utilisé uniquement à des fins d'information. Il retrace son parcours, d'enseignant et directeur d'école à premier ministre du Nigeria après l'indépendance, son roman Shaihu Umar et son assassinat lors du coup d'État du 15 janvier 1966."
  ur: "ابوبکر تفوا بلیوا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں استاد اور ہیڈ ماسٹر سے لے کر نائیجیریا کے آزادی کے پہلے وزیر اعظم تک ان کے کیریئر، ان کے ناول شیہو عمر، اور 15 جنوری 1966 کی بغاوت میں ان کے قتل کا ذکر کیا گیا ہے۔"
  tr: "Ebu Bekir hakkında İngilizce Vikipedi makalesi görüşlerinde farklılık göstermiştir; sadece varlığın gerçekleri için kullanılır. Kitap, öğretmen ve okul müdürlüğünden Nijerya'nın bağımsızlık sonrası ilk başbakanına uzanan yolculuğunu, romanı 'Şeyho Ömer'i ve 15 Ocak 1966 darbesindeki suikastını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Abu Bakr berbeda pandangannya; hanya digunakan untuk fakta entitas. Artikel ini menceritakan perjalanannya dari guru dan kepala sekolah hingga Perdana Menteri pertama Nigeria setelah merdeka, novelnya 'Shayho Omar,' dan pembunuhannya dalam kudeta 15 Januari 1966."
