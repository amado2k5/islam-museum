reliability_note: "Tracker page for the channel @warbaahintanoloshaislaamka7774 (channel ID UCaZfAJtb8J4DKBOV7wdYDoA): 282,000 subscribers, 43,769,442 total views and 6,943 videos as of 8 November 2026; channel started 20 February 2018; channel country set to Canada; ranked #269,881 worldwide and #2,950 in Canada by subscribers; about 461,000 views in the 28 days to the read, so the channel is active. Subscriber and view counts are dated platform measurements, not museum facts; vidIQ's earnings estimates are not used. The page names no individual author or operator for the channel, and no source read in the wave-198 harvest names one. Content sampled on the channel in the wave-198 harvest and the coordinator's pass consisted of Somali-language lectures (muxaadaro) by several Somali scholars — among them Maxamuud Xaliiki and Xuseen Cali Jabuuti — together with nasheed; the same speakers are carried by the scene's other aggregator channels, and carriage is not affiliation. Read on 9 November 2026."
