summary:
  ar: "الموقع الرسمي للمجلس الفقهي لأمريكا الشمالية ⁦(FCNA)⁩، ينشر قراراته وفتاواه الجماعية مؤرّخة بالإنجليزية، بصيغة سؤال وجواب مع إجابة مختصرة وأخرى مفصلة."
  en: "The official website of the Fiqh Council of North America (FCNA), publishing its collective resolutions and fatwas dated in English, in question-and-answer form with a summarised and a detailed answer."
  ur: "فقہ کونسل آف نارتھ امریکہ ⁦(FCNA)⁩ کی سرکاری ویب سائٹ، جو اپنے اجتماعی فیصلے اور فتاویٰ انگریزی میں مورخہ شائع کرتی ہے — سوال و جواب کی صورت میں مختصر اور مفصل جواب کے ساتھ۔"
  es: "El sitio web oficial del Consejo de Fiqh de Norteamérica (FCNA), que publica sus resoluciones colectivas y fatuas fechadas en inglés, en formato de preguntas y respuestas con una respuesta resumida y otra detallada."
  fr: "Le site officiel du Conseil Fiqh d'Amérique du Nord (FCNA), publiant ses résolutions collectives et ses fatwas datées en anglais, sous forme de questions-réponses avec une réponse résumée et une réponse détaillée."
  tr: "Kuzey Amerika Fıkıh Konseyi'nin (FCNA) resmi web sitesi, kararlarını ve toplu fetvalarını, İngilizce tarihli soru-cevap formatında, kısa ve ayrıntılı bir yanıtla yayımlar."
  id: "Situs resmi Dewan Yurisprudensi Amerika Utara (FCNA) menerbitkan keputusan dan fatwa kolektifnya, bertanggal dalam bahasa Inggris, dalam format tanya jawab dengan jawaban singkat dan rinci."
