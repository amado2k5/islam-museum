label:
  ar: "علل الحديث لابن أبي حاتم الرازي — الجزء الثاني، المطبعة السلفية بالقاهرة 1344هـ"
  en: "Ilal al-Hadith by Ibn Abi Hatim al-Razi — part 2, al-Matba'a al-Salafiyya, Cairo 1344 AH"
summary:
  ar: "«علل الحديث» لأبي محمد عبد الرحمن بن أبي حاتم الرازي ⁦(240–327هـ)⁩، طبع بنفقة الشيخ محمد نصيف وشركائه، بالمطبعة السلفية ومكتبتها بالقاهرة لصاحبيها محب الدين الخطيب وعبد الفتاح قتلان، سنة 1344هـ، عن نسختين خطيتين إحداهما في خزانة أحمد تيمور باشا والأخرى في دار الكتب المصرية. الجزء الثاني: من الأطعمة والأشربة إلى التفسير والزهد والإيمان والدعاء والأدب والطب والفضائل ودلائل النبوة والخراج."
  en: "Ilal al-Hadith by Abu Muhammad Abd al-Rahman ibn Abi Hatim al-Razi (240–327 AH), printed at the expense of Shaykh Muhammad Nasif and partners by al-Matba'a al-Salafiyya and its bookshop in Cairo, owned by Muhibb al-Din al-Khatib and Abd al-Fattah Qatlan, in 1344 AH, from two manuscripts, one in the library of Ahmad Taymur Pasha and one in the Egyptian National Library; part 2: from foods and drinks to Qur'an commentary, renunciation, faith, supplication, manners, medicine, virtues, the signs of prophethood and land tax."
  es: "Ilal al-Hadith de Abu Muhammad Abd al-Rahman ibn Abi Hatim al-Razi (240–327 AH), impreso a expensas del Shaykh Muhammad Nasif y socios por al-Matba'a al-Salafiyya y su librería en El Cairo, propiedad de Muhibb al-Din al-Khatib y Abd al-Fattah Qatlan, en 1344 AH, a partir de dos manuscritos, uno en la biblioteca de Ahmad Taymur Pasha y otro en la Biblioteca Nacional Egipcia; parte 2: desde alimentos y bebidas hasta comentarios del Corán, renuncia, fe, súplica, modales, medicina, virtudes, los signos de la profecía y el impuesto sobre la tierra."
  fr: "Ilal al-Hadith par Abu Muhammad Abd al-Rahman ibn Abi Hatim al-Razi (240–327 AH), imprimé aux frais du cheikh Muhammad Nasif et de ses associés par al-Matba'a al-Salafiyya et sa librairie du Caire, appartenant à Muhibb al-Din al-Khatib et Abd al-Fattah Qatlan, en 1344 AH, à partir de deux manuscrits, l'un dans la bibliothèque d'Ahmad Taymur Pasha et l'autre dans la Bibliothèque nationale égyptienne; partie 2: des aliments et des boissons au commentaire du Coran, en passant par le renoncement, la foi, la supplication, les bonnes manières, la médecine, les vertus, les signes de la prophétie et l'impôt foncier."
  ur: "ابو محمد عبدالرحمٰن بن ابی حاتم الرازی ⁦(240-327ھ)⁩ کی اِلال الحدیث، شیخ محمد ناصف اور شراکت داروں کے خرچ پر المطبع السلفیہ اور قاہرہ میں اس کی کتابوں کی دکان کے ذریعے طبع کی گئی، جس کی ملکیت محب الدین اور عبد القحطان، 144 میں ہے۔ دو نسخوں سے، ایک احمد تیمور پاشا کی لائبریری میں اور ایک مصری نیشنل لائبریری میں؛ حصہ 2: کھانے پینے کی اشیاء سے لے کر تفسیر قرآن، ترک، ایمان، دعا، آداب، طب، فضائل، نشانِ نبوت اور زمین پر ٹیکس۔"
  tr: "\"Illal al-Hadis\" adlı eseri, Ebu Muhammed Abdülrahman bin Ebi Hatim el-Razi (240–327 H) tarafından, Şeyh Muhammed Nasif ve ortaklarının masraflarıyla, Kahire'deki Selefi Matbaa ve Kütüphanesi'nde, Muhibdin el-Hatib ve Abdülfettah Katlan'a ait, 1344 Hicri yılında, iki el yazması kopyası olarak basılmıştır: biri Ahmed Timur Paşa'nın kütüphanesinde, diğeri Mısır Milli Kütüphanesi'nde. İkinci Bölüm: Yiyecek ve İçecekten Tafsir'e, Münzeviyet, İnanç, Yalvarış, Edebiyat, Tıp, Erdemler, Peygamberlik Işaretleri ve Kharaj'a."
  id: "\"Illal al-Hadith\" oleh Abu Muhammad Abd al-Rahman ibn Abi Hatim al-Razi (240–327 H), dicetak atas biaya Sheikh Muhammad Nasif dan mitranya, di Salafi Press and Library di Kairo, milik Muhib al-Din al-Khatib dan Abd al-Fattah Qatlan, pada tahun 1344 H, dalam dua salinan manuskrip: satu di perpustakaan Ahmad Timur Pasha dan satu lagi di Perpustakaan Nasional Mesir. Bagian Dua: Dari Makanan dan Minuman ke Tafsir, Asketisme, Iman, Permohonan, Sastra, Pengobatan, Kebajikan, Tanda-tanda Kenabian, dan Kharaj."
