  en: "Ilal al-Hadith by Ibn Abi Hatim al-Razi — part 2, al-Matba'a al-Salafiyya, Cairo 1344 AH"
summary:
  ar: "«علل الحديث» لأبي محمد عبد الرحمن بن أبي حاتم الرازي ⁦(240–327هـ)⁩، طبع بنفقة الشيخ محمد نصيف وشركائه، بالمطبعة السلفية ومكتبتها بالقاهرة لصاحبيها محب الدين الخطيب وعبد الفتاح قتلان، سنة 1344هـ، عن نسختين خطيتين إحداهما في خزانة أحمد تيمور باشا والأخرى في دار الكتب المصرية. الجزء الثاني: من الأطعمة والأشربة إلى التفسير والزهد والإيمان والدعاء والأدب والطب والفضائل ودلائل النبوة والخراج."
  en: "Ilal al-Hadith by Abu Muhammad Abd al-Rahman ibn Abi Hatim al-Razi (240–327 AH), printed at the expense of Shaykh Muhammad Nasif and partners by al-Matba'a al-Salafiyya and its bookshop in Cairo, owned by Muhibb al-Din al-Khatib and Abd al-Fattah Qatlan, in 1344 AH, from two manuscripts, one in the library of Ahmad Taymur Pasha and one in the Egyptian National Library; part 2: from foods and drinks to Qur'an commentary, renunciation, faith, supplication, manners, medicine, virtues, the signs of prophethood and land tax."
