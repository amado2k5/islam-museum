summary:
  ar: "صفحة السيرة في الموقع الرسمي للشيخ ساجد عمر: قاضٍ مؤهل ومعلم ومؤلف وباحث، وُلد في ليستر بالمملكة المتحدة ونشأ في هراري بزيمبابوي حيث أكمل تعليمه وأسّس عملًا في تقنية المعلومات قبل العشرين، وحفظ القرآن في الثامنة عشرة، ثم درس في جامعة الإمام محمد بن سعود بالرياض حتى الدكتوراه في الفقه المقارن والقضاء."
  en: "The biography page of Sheikh Sajid Umar's official website: a qualified judge, educator, author and researcher, born in Leicester, UK and brought up in Harare, Zimbabwe, where he completed his schooling, founded an IT business before the age of twenty and memorised the Qur'an at eighteen, before studying at Imam Muhammad bin Saud Islamic University in Riyadh through to a PhD in comparative fiqh and judiciary."
  es: "La biografía que se puede encontrar en la página web oficial del jeque Sajid Umar: juez cualificado, educador, autor e investigador, nacido en Leicester, Reino Unido, y criado en Harare, Zimbabue, donde completó sus estudios, fundó una empresa de informática antes de los veinte años y memorizó el Corán a los dieciocho, antes de estudiar en la Universidad Islámica Imam Muhammad bin Saud en Riad hasta obtener un doctorado en fiqh comparado y derecho judicial."
  fr: "La page biographique du site officiel du cheikh Sajid Umar: juge qualifié, éducateur, auteur et chercheur, né à Leicester, au Royaume-Uni, et élevé à Harare, au Zimbabwe, où il a terminé sa scolarité, fondé une entreprise informatique avant l'âge de vingt ans et mémorisé le Coran à dix-huit ans, avant d'étudier à l'Université islamique Imam Muhammad bin Saud de Riyad jusqu'à un doctorat en fiqh comparé et en droit judiciaire."
  ur: "شیخ ساجد عمر کی آفیشل ویب سائٹ کا سوانح عمری کا صفحہ: ایک قابل جج، ماہر تعلیم، مصنف اور محقق، لیسٹر، یو کے میں پیدا ہوئے اور ہرارے، زمبابوے میں پرورش پائی، جہاں اس نے اپنی اسکولی تعلیم مکمل کی، بیس سال کی عمر سے پہلے آئی ٹی کا کاروبار قائم کیا اور اٹھارہ سال کی عمر میں قرآن حفظ کیا، اس سے پہلے امام محمد بن ریاض میں جامعہ اسلامیہ میں پی ایچ ڈی کی تعلیم حاصل کی۔ عدلیہ"
  tr: "Şeyh Sajid Omar'ın resmi web sitesindeki biyografi sayfası: Leicester, Birleşik Krallık'ta doğmuş ve Harare, Zimbabve'de büyüyen nitelikli bir yargıç, öğretmen, yazar ve araştırmacı; eğitimini tamamlayıp yirmi yaşından önce bilgi teknolojisi alanında kariyer kurmuş, on sekiz yaşında Kur'an'ı ezberlemiş, ardından Riyad'daki İmam Muhammed bin Suud Üniversitesi'nde karşılaştırmalı hukuk ve yargı alanında doktora yapmıştır."
  id: "Halaman biografi di situs resmi Sheikh Sajid Omar: Seorang hakim, guru, penulis, dan peneliti yang berkualifikasi, lahir di Leicester, Inggris Raya, dan dibesarkan di Harare, Zimbabwe, di mana ia menyelesaikan pendidikannya dan membangun karier di bidang teknologi informasi sebelum usia dua puluh tahun, menghafal Al-Qur'an pada usia delapan belas tahun, kemudian belajar di Universitas Imam Muhammad bin Saud di Riyadh hingga meraih gelar PhD dalam bidang hukum komparatif dan peradilan."
