summary:
  ar: "صفحة السيرة في الموقع الرسمي للشيخ ساجد عمر: قاضٍ مؤهل ومعلم ومؤلف وباحث، وُلد في ليستر بالمملكة المتحدة ونشأ في هراري بزيمبابوي حيث أكمل تعليمه وأسّس عملًا في تقنية المعلومات قبل العشرين، وحفظ القرآن في الثامنة عشرة، ثم درس في جامعة الإمام محمد بن سعود بالرياض حتى الدكتوراه في الفقه المقارن والقضاء."
  en: "The biography page of Sheikh Sajid Umar's official website: a qualified judge, educator, author and researcher, born in Leicester, UK and brought up in Harare, Zimbabwe, where he completed his schooling, founded an IT business before the age of twenty and memorised the Qur'an at eighteen, before studying at Imam Muhammad bin Saud Islamic University in Riyadh through to a PhD in comparative fiqh and judiciary."
