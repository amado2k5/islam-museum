summary:
  ar: "صفحة صيد الفوائد الجامعة لتغريدات موسى بن راشد العازمي في السيرة النبوية ⁦(770 تغريدة، من 23 مايو إلى 7 أغسطس 2013)⁩، وتقدمها بأنه مؤلف كتاب «اللؤلؤ المكنون في سيرة النبي المأمون» في أربع مجلدات، زكّاه عثمان الخميس، واستغرق بحثه عشر سنوات ومراجعته سنتين."
  en: "The Saaid page collecting Musa ibn Rashid al-Azmi's tweets on the Prophetic biography (770 tweets, 23 May to 7 August 2013), introducing him as the author of 'Al-Lu'lu' al-Maknun fi Sirat al-Nabi al-Ma'mun' in four volumes, endorsed by Othman al-Khamees, the fruit of ten years' research and two years' review."
  es: "La página de Saaid recopila los tuits de Musa ibn Rashid al-Azmi sobre la biografía profética (770 tuits, del 23 de mayo al 7 de agosto de 2013), presentándolo como el autor de 'Al-Lu'lu' al-Maknun fi Sirat al-Nabi al-Ma'mun' en cuatro volúmenes, avalado por Othman al-Khamees, fruto de diez años de investigación y dos años de revisión."
  fr: "La page Saaid rassemblant les tweets de Musa ibn Rashid al-Azmi sur la biographie prophétique (770 tweets, du 23 mai au 7 août 2013), le présentant comme l'auteur de 'Al-Lu'lu' al-Maknun fi Sirat al-Nabi al-Ma'mun' en quatre volumes, approuvé par Othman al-Khamees, fruit de dix ans de recherche et de deux ans de révision."
  ur: "سیرت نبوی پر موسیٰ بن راشد العجمی کے ٹویٹس کو جمع کرنے والا سعید صفحہ ⁦(770 ٹویٹس، 23 مئی تا 7 اگست 2013)⁩، ان کا تعارف 'اللولو' المکنون فی سیرت النبی المومن' کے مصنف کے طور پر کر رہا ہے، جس میں چار جلدوں میں پھلوں کی تحقیق، دسویں اور آخر میں تحقیق کی گئی ہے۔ دو سال کا جائزہ."
  tr: "Musa bin Raşid El-Azmi'nin Peygamberlik biyografisinde (770 tweet, 23 Mayıs - 7 Ağustos 2013 tarihleri arasında) tweetleri için Hunt Al-Fawa'id Al-Jami' sayfası; bu kitap, dört ciltlik \"Peygamber El-Me'mun'un Biyografisindeki Gizli İnci\" kitabının yazarı olarak sunulmuştur, bu kitap Osman El-Hamis tarafından onaylanmış ve araştırmaları on yıl iki yıl sürmüştür."
  id: "Halaman 'Hunt Al-Fawa'id Al-Jami' untuk cuitan Musa bin Rashid Al-Azmi dalam biografi Nabi (770 cuitan, dari 23 Mei hingga 7 Agustus 2013), yang menyajikannya sebagai penulis buku \"Mutiara Tersembunyi dalam Biografi Al-Ma'mun yang Nabi\" dalam empat jilid, yang didukung oleh Othman Al-Khamis, dan penelitiannya memakan waktu sepuluh tahun dua tahun untuk ditinjau."
title: "770 تغريدة في السيرة النبوية — تغريدات موسى بن راشد العازمي"
