  ar: "صفحة صيد الفوائد الجامعة لتغريدات موسى بن راشد العازمي في السيرة النبوية (770 تغريدة، من 23 مايو إلى 7 أغسطس 2013)، وتقدمها بأنه مؤلف كتاب «اللؤلؤ المكنون في سيرة النبي المأمون» في أربع مجلدات، زكّاه عثمان الخميس، واستغرق بحثه عشر سنوات ومراجعته سنتين."
  en: "The Saaid page collecting Musa ibn Rashid al-Azmi's tweets on the Prophetic biography (770 tweets, 23 May to 7 August 2013), introducing him as the author of 'Al-Lu'lu' al-Maknun fi Sirat al-Nabi al-Ma'mun' in four volumes, endorsed by Othman al-Khamees, the fruit of ten years' research and two years' review."
