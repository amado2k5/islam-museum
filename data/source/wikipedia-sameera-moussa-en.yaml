summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سميرة موسى ⁦(3 آذار 1917 – 15 آب 1952)⁩، أول عالمة ذرة مصرية وأول معيدة في كلية العلوم بجامعة القاهرة؛ تعرض بحوثها في الإشعاع الذري ومؤتمر «الذرة من أجل السلام» ووفاتها في حادث سيارة قرب شيريدان بولاية وايومنغ، وما قيل من مزاعم اغتيال الموساد لها."
  en: "English Wikipedia article on Sameera Moussa (3 March 1917 – 15 August 1952), Egypt's first woman nuclear physicist and the first woman to work at Cairo University; it covers her research in atomic radiation, her Atomic Energy for Peace conference, her death in a car crash near Sheridan, Wyoming, and the claims that the Mossad assassinated her."
  es: "Artículo de la Wikipedia en inglés sobre Sameera Moussa (3 de marzo de 1917 - 15 de agosto de 1952), la primera mujer física nuclear de Egipto y la primera mujer en trabajar en la Universidad de El Cairo; abarca su investigación sobre la radiación atómica, su conferencia Energía Atómica para la Paz, su muerte en un accidente automovilístico cerca de Sheridan, Wyoming, y las afirmaciones de que el Mossad la asesinó."
  fr: "Article de Wikipédia en anglais sur Sameera Moussa (3 mars 1917 – 15 août 1952), première femme physicienne nucléaire d'Égypte et première femme à travailler à l'Université du Caire; il couvre ses recherches sur le rayonnement atomique, sa conférence sur l'énergie atomique pour la paix, sa mort dans un accident de voiture près de Sheridan, Wyoming, et les allégations selon lesquelles le Mossad l'aurait assassinée."
  ur: "سمیرا موسیٰ ⁦(3 مارچ 1917 - 15 اگست 1952)⁩ پر انگریزی ویکیپیڈیا مضمون، مصر کی پہلی خاتون جوہری طبیعیات دان اور قاہرہ یونیورسٹی میں کام کرنے والی پہلی خاتون؛ اس میں ایٹم ریڈی ایشن، اس کی اٹامک انرجی فار پیس کانفرنس، شیریڈن، وومنگ کے قریب کار حادثے میں اس کی موت، اور ان دعووں کا احاطہ کیا گیا ہے کہ موساد نے اسے قتل کیا۔"
