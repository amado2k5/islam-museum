  ar: "مقالة ويكيبيديا الإنجليزية عن سميرة موسى ⁦(3 آذار 1917 – 15 آب 1952)⁩، أول عالمة ذرة مصرية وأول معيدة في كلية العلوم بجامعة القاهرة؛ تعرض بحوثها في الإشعاع الذري ومؤتمر «الذرة من أجل السلام» ووفاتها في حادث سيارة قرب شيريدان بولاية وايومنغ، وما قيل من مزاعم اغتيال الموساد لها."
  en: "English Wikipedia article on Sameera Moussa (3 March 1917 – 15 August 1952), Egypt's first woman nuclear physicist and the first woman to work at Cairo University; it covers her research in atomic radiation, her Atomic Energy for Peace conference, her death in a car crash near Sheridan, Wyoming, and the claims that the Mossad assassinated her."
