summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن آدم مالك (1917–1984)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بيماتانغسيانتار في 22 يوليو 1917 في أسرة مسلمة من باتاك ماندايلينغ، وتأسيسه وكالة أنتارا للأنباء، ووزارته للخارجية (1966–1977)، ورئاسته للجمعية العامة للأمم المتحدة، ونيابته الثالثة للرئاسة (1978–1983)، ووفاته في باندونغ في 5 سبتمبر 1984."
  en: "English Wikipedia article on Adam Malik (1917–1984); used for entity facts only. It recounts his birth at Pematangsiantar on 22 July 1917 into a Muslim Mandailing Batak family, his co-founding of the Antara news agency, his foreign ministry (1966–1977), his presidency of the UN General Assembly, his tenure as third vice president (1978–1983), and his death at Bandung on 5 September 1984."
  es: "Artículo de la Wikipedia en inglés sobre Adam Malik (1917-1984); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Pematangsiantar el 22 de julio de 1917 en el seno de una familia musulmana Mandailing Batak, su cofundación de la agencia de noticias Antara, su ministerio de Asuntos Exteriores (1966-1977), su presidencia de la Asamblea General de la ONU, su mandato como tercer vicepresidente (1978-1983) y su fallecimiento en Bandung el 5 de septiembre de 1984."
  fr: "Article de Wikipédia en anglais sur Adam Malik (1917-1984); utilisé uniquement pour les informations biographiques. Il relate sa naissance à Pematangsiantar le 22 juillet 1917 au sein d’une famille musulmane Mandailing Batak, sa cofondation de l’agence de presse Antara, son ministère des Affaires étrangères (1966-1977), sa présidence de l’Assemblée générale des Nations Unies, son mandat de troisième vice-président (1978-1983) et sa mort à Bandung le 5 septembre 1984."
