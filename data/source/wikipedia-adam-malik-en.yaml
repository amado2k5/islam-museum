  ar: "مقالة ويكيبيديا الإنجليزية عن آدم مالك (1917–1984)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بيماتانغسيانتار في 22 يوليو 1917 في أسرة مسلمة من باتاك ماندايلينغ، وتأسيسه وكالة أنتارا للأنباء، ووزارته للخارجية (1966–1977)، ورئاسته للجمعية العامة للأمم المتحدة، ونيابته الثالثة للرئاسة (1978–1983)، ووفاته في باندونغ في 5 سبتمبر 1984."
  en: "English Wikipedia article on Adam Malik (1917–1984); used for entity facts only. It recounts his birth at Pematangsiantar on 22 July 1917 into a Muslim Mandailing Batak family, his co-founding of the Antara news agency, his foreign ministry (1966–1977), his presidency of the UN General Assembly, his tenure as third vice president (1978–1983), and his death at Bandung on 5 September 1984."
