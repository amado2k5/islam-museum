reliability_note: "Arabic Wikipedia, revision 74536154 (wikitext consulted in full). It gives only the birth year 1864 (against the English article's and Wikidata's 8 June), its categories misfile his birthplace as Muscat although the English article and Wikidata give Bombay, and its lead prose dates the death 15 October 1913 against its own infobox template's 4 October 1913, the reading the English and Urdu articles and Wikidata share and the record follows. Its infobox religion field reads only 'Islam'; the single Ibadi mention in its text concerns the imamate camp that rose against him in 1913. Its reign narrative (Nizwa and Samail governorships, the 1894 French consulate agreement, the delegation of the capital and the interior) is fuller than the English article's. Its article title names him Faisal bin Turki bin Said. Consulted on 26 October 2026."
