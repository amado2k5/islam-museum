summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد حسين نصر؛ تُستخدم لوقائع الكيان فقط، وتؤكد ولادته في 7 أبريل 1933 في طهران وتعليمه في MIT وهارفارد وأستاذيته في طهران وجامعة جورج واشنطن."
  en: "English Wikipedia article on Seyyed Hossein Nasr; used for entity facts only. It confirms his birth on 7 April 1933 in Tehran, his MIT and Harvard education, his professorships in Tehran and at George Washington University, and in its archived infobox listed Twelver Shi'ism among his schools."
  es: "Artículo de la Wikipedia en inglés sobre Seyyed Hossein Nasr; utilizado únicamente para datos sobre la persona. Confirma su nacimiento el 7 de abril de 1933 en Teherán, su formación en el MIT y Harvard, sus cátedras en Teherán y en la Universidad George Washington, y en su ficha informativa archivada mencionaba el chiismo duodecimano entre sus escuelas."
  fr: "L'article de Wikipédia en anglais consacré à Seyyed Hossein Nasr, utilisé uniquement pour les informations le concernant, confirme sa naissance le 7 avril 1933 à Téhéran, ses études au MIT et à Harvard, ses postes de professeur à Téhéran et à l'Université George Washington, et mentionne, dans son infobox archivée, le chiisme duodécimain parmi ses écoles de pensée."
  ur: "سید حسین نصر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 7 اپریل 1933 کو تہران میں اس کی پیدائش، اس کی MIT اور ہارورڈ کی تعلیم، تہران اور جارج واشنگٹن یونیورسٹی میں اس کی پروفیسر شپ کی تصدیق کرتا ہے، اور اس کے محفوظ شدہ معلومات باکس میں ان کے اسکولوں میں بارہ شیعہ مذہب کو درج کیا گیا ہے۔"
  tr: "Seyyid Hüseyin Nasr hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır; 7 Nisan 1933'te Tahran'da doğduğunu, MIT ve Harvard'daki eğitimini ve Tahran ile George Washington Üniversitesi'ndeki profesörlüğünü doğrular."
  id: "Artikel Wikipedia bahasa Inggris tentang Seyyed Hossein Nasr; hanya digunakan untuk fakta entitas, mengonfirmasi kelahirannya pada 7 April 1933 di Teheran, pendidikannya di MIT dan Harvard, serta jabatan profesornya di Teheran dan Universitas George Washington."
