label:
  ar: "صحيح ابن حبان بترتيب الأمير علاء الدين الفارسي — تحقيق أحمد محمد شاكر، دار المعارف بمصر، الجزء الأول ⁦(1372هـ/1952م)⁩"
  en: "Sahih Ibn Hibban in the arrangement of al-Amir 'Ala' al-Din al-Farisi — ed. Ahmad Muhammad Shakir, Dar al-Ma'arif, Egypt, vol. 1 (1372/1952)"
summary:
  ar: "الجزء الأول من طبعة أحمد محمد شاكر، وهو أول نشرة علمية للكتاب: مقدمة المحقق في اسم الكتاب ومنزلته ومخطوطاته ⁦(ص 5-42)⁩، وترجمتا ابن حبان والأمير علاء الدين ⁦(ص 43-45، مؤرخة 3 جمادى الأولى 1371هـ / 30 يناير 1952م)⁩، ثم مقدمة «الإحسان» بفصولها الثلاثة: ترجمة ابن حبان، ونص خطبته وشرطه وتراجم أنواعه الأربعمائة، وأبواب الترتيب الجديد ⁦(ص 49-127)⁩، ثم المتن إلى أوائل كتاب الإيمان؛ تم طبعه بمطابع دار المعارف يوم الجمعة 10 ربيع الأول 1372هـ ⁦(28 نوفمبر 1952م)⁩."
  en: "Volume 1 of Ahmad Muhammad Shakir's edition, the first scholarly edition of the book: the editor's introduction on the book's title, standing and manuscripts (pp. 5-42), his notices on Ibn Hibban and al-Amir 'Ala' al-Din (pp. 43-45, dated 3 Jumada I 1371 / 30 January 1952), then the introduction of al-Ihsan in its three sections — Ibn Hibban's biography, the text of his preface, condition and list of four hundred types, and the chapters of the new arrangement (pp. 49-127) — then the text up to the opening of the Book of Faith; printing was completed at the Dar al-Ma'arif presses on Friday 10 Rabi' I 1372 (28 November 1952)."
