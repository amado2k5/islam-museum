label:
  ar: "صحيح ابن حبان بترتيب الأمير علاء الدين الفارسي — تحقيق أحمد محمد شاكر، دار المعارف بمصر، الجزء الأول ⁦(1372هـ/1952م)⁩"
  en: "Sahih Ibn Hibban in the arrangement of al-Amir 'Ala' al-Din al-Farisi — ed. Ahmad Muhammad Shakir, Dar al-Ma'arif, Egypt, vol. 1 (1372/1952)"
summary:
  ar: "الجزء الأول من طبعة أحمد محمد شاكر، وهو أول نشرة علمية للكتاب: مقدمة المحقق في اسم الكتاب ومنزلته ومخطوطاته ⁦(ص 5-42)⁩، وترجمتا ابن حبان والأمير علاء الدين ⁦(ص 43-45، مؤرخة 3 جمادى الأولى 1371هـ / 30 يناير 1952م)⁩، ثم مقدمة «الإحسان» بفصولها الثلاثة: ترجمة ابن حبان، ونص خطبته وشرطه وتراجم أنواعه الأربعمائة، وأبواب الترتيب الجديد ⁦(ص 49-127)⁩، ثم المتن إلى أوائل كتاب الإيمان؛ تم طبعه بمطابع دار المعارف يوم الجمعة 10 ربيع الأول 1372هـ ⁦(28 نوفمبر 1952م)⁩."
  en: "Volume 1 of Ahmad Muhammad Shakir's edition, the first scholarly edition of the book: the editor's introduction on the book's title, standing and manuscripts (pp. 5-42), his notices on Ibn Hibban and al-Amir 'Ala' al-Din (pp. 43-45, dated 3 Jumada I 1371 / 30 January 1952), then the introduction of al-Ihsan in its three sections — Ibn Hibban's biography, the text of his preface, condition and list of four hundred types, and the chapters of the new arrangement (pp. 49-127) — then the text up to the opening of the Book of Faith; printing was completed at the Dar al-Ma'arif presses on Friday 10 Rabi' I 1372 (28 November 1952)."
  es: "Volumen 1 de la edición de Ahmad Muhammad Shakir, la primera edición académica del libro: la introducción del editor sobre el título, la posición y los manuscritos del libro (págs. 5-42), sus notas sobre Ibn Hibban y al-Amir 'Ala' al-Din (págs. 43-45, fechado el 3 de Jumada I de 1371 / 30 de enero de 1952), luego la introducción de al-Ihsan en sus tres secciones: la biografía de Ibn Hibban, el texto de su prefacio, el estado y la lista de cuatrocientos tipos, y los capítulos de la nueva disposición (págs. 49-127) — luego el texto hasta el comienzo del Libro de la Fe; la impresión se completó en las imprentas de Dar al-Ma'arif el viernes 10 de Rabi' I de 1372 (28 de noviembre de 1952)."
  fr: "Volume 1 de l'édition d'Ahmad Muhammad Shakir, la première édition savante du livre: introduction de l'éditeur sur le titre, le statut et les manuscrits du livre (pp. 5-42), ses notices sur Ibn Hibban et al-Amir 'Ala' al-Din (pp. 43-45, datées du 3 Jumada I 1371 / 30 janvier 1952), puis l'introduction d'al-Ihsan en ses trois sections — la biographie d'Ibn Hibban, le texte de sa préface, son état et la liste des quatre cents caractères, et les chapitres du nouvel arrangement (pp. 49-127) — puis le texte jusqu'à l'ouverture du Livre de la Foi; l'impression a été achevée aux presses Dar al-Ma'arif le vendredi 10 Rabi' I 1372 (28 novembre 1952)."
  ur: "احمد محمد شاکر کے ایڈیشن کی جلد 1، کتاب کا پہلا علمی ایڈیشن: کتاب کے عنوان، موقف اور مخطوطات پر مدیر کا تعارف ⁦(صفحہ 5-42)⁩، ابن حبان اور الامیر 'علاوہ الدین' پر ان کے نوٹس ⁦(صفحہ 43-45، مورخہ 3 جنوری 1313ء)⁩، پھر اس کے تین حصوں میں الاحسان کا تعارف - ابن حبان کی سوانح، اس کے دیباچے کا متن، حالت اور چار سو اقسام کی فہرست، اور نئی ترتیب کے ابواب ⁦(صفحہ 49-127)⁩ - پھر کتاب ایمان کے آغاز تک کا متن؛ دار المعارف پریس میں جمعہ 10 ربیع الثانی 1372 ⁦(28 نومبر 1952)⁩ کو طباعت مکمل ہوئی۔"
  tr: "Ahmed Muhammed Şakir'in baskısının ilk bölümü, kitabın ilk akademik yayınıdır: editörün kitabın adı, durumu ve el yazmalarına giriş (s. 5-42), İbn Hibban ve Prens Alaa al-Din'in biyografileri (s. 43-45, 3 Cumeda'l-Avvel 1371 H / 30 Ocak 1952 CE), ardından 'İhsan'ın üç bölüm halinde girişi: İbn Hibban'ın biyografisi, vaazının ve durumu metni, dört yüz türünün biyografileri, yeni düzenlemenin bölümleri (s. 49-127), ardından İnanç Kitabı'nın başlangıcına kadar olan metin; Dar al-Ma'arif Matbaası'nda 10 Rabi'al-Awwal 1372 Hicri Cuma günü basılmıştır (28 Kasım 1952)."
  id: "Bagian pertama edisi Ahmed Muhammad Shakir, yang merupakan publikasi ilmiah pertama buku ini: pengantar editor atas nama, status, dan manuskrip buku (hlm. 5-42), biografi Ibn Hibban dan Pangeran Alaa al-Din (hlm. 43-45, tertanggal 3 Jumada al-Awwal 1371 H / 30 Januari 1952 M), kemudian pengantar 'Al-Ihsan' dalam tiga bab: biografi Ibn Hibban, teks khotbah dan kondisinya, biografi dari empat ratus jenisnya, bab-bab dari susunan baru (hlm. 49-127), kemudian teks hingga awal Kitab Iman; dicetak di Dar Al-Ma'arif Press pada hari Jumat, 10 Rabi al-Awwal 1372 H (28 November 1952 M)."
