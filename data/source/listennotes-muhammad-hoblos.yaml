summary:
  ar: "صفحة بودكاست مسلم سنترال لمحمد حبلص مع سيرته القياسية: واعظ أصله من لبنان ويقيم في سيدني بأستراليا، معروف بأسلوبه الحماسي الوجداني في الوعظ خاصة بين الشباب، ينتج محتوى لشبكة «ون باث»، وشارك في برنامج إذاعي «سيدني دين تيم» والفيلم القصير «الفرصة الأخيرة»."
  en: "Muslim Central's podcast page for Muhammad Hoblos with his standard biography: a preacher originally from Lebanon, now residing in Sydney, Australia, renowned for a passionate and emotional style of preaching especially among young Muslims; he produces content for One Path Network, was part of the Sydney Deen Team radio programme and took part in the Islamic short film 'Last Chance'."
  es: "Página de podcasts de Muslim Central dedicada a Muhammad Hoblos con su biografía habitual: predicador originario del Líbano, que reside actualmente en Sídney, Australia, conocido por su estilo de predicación apasionado y emotivo, especialmente entre los jóvenes musulmanes; produce contenido para One Path Network, formó parte del programa de radio Sydney Deen Team y participó en el cortometraje islámico 'Last Chance'."
  fr: "La page du podcast de Muslim Central consacrée à Muhammad Hoblos contient sa biographie habituelle: prédicateur originaire du Liban, résidant actuellement à Sydney, en Australie, réputé pour son style de prédication passionné et émotionnel, notamment auprès des jeunes musulmans; il produit du contenu pour One Path Network, a fait partie de l’émission de radio Sydney Deen Team et a participé au court-métrage islamique « Last Chance »."
  ur: "مسلم سنٹرل کا پوڈ کاسٹ صفحہ محمد ہوبلوس کے لیے ان کی معیاری سوانح عمری کے ساتھ: ایک مبلغ جو اصل میں لبنان سے ہے، جو اب سڈنی، آسٹریلیا میں مقیم ہے، خاص طور پر نوجوان مسلمانوں میں تبلیغ کے پرجوش اور جذباتی انداز کے لیے مشہور ہے۔ وہ ون پاتھ نیٹ ورک کے لیے مواد تیار کرتا ہے، سڈنی دین ٹیم ریڈیو پروگرام کا حصہ تھا اور اسلامی مختصر فلم 'لاسٹ چانس' میں حصہ لیا۔"
  tr: "Mohammed Hablas'ın kaydıyla ilgili Muslim Central podcast sayfası: aslen Lübnanlı, Sydney, Avustralya'da yaşayan bir vaiz, özellikle gençler arasında tutkulu ve duygusal vaaz tarzıyla tanınıyor. One Path ağı için içerik üretiyor, \"Sydney Dean Team\" radyo programına ve \"The Last Chance\" adlı kısa filme katıldı."
  id: "Halaman podcast Muslim Central untuk Mohammed Hablas dengan rekam jejaknya: seorang pengkhotbah asal Lebanon yang tinggal di Sydney, Australia, dikenal dengan gaya khotbahnya yang penuh semangat dan emosional, terutama di kalangan pemuda. Ia memproduksi konten untuk jaringan One Path, berpartisipasi dalam program radio \"Sydney Dean Team,\" dan film pendek \"The Last Chance.\""
