summary:
  ar: "ملف صحفي في جريدة «آرا» الكتالونية ⁦(أبريل 2024)⁩ عن زيارة وائل الدحدوح إلى بلنسية، يصفه بأنه «مسلم ملتزم» ويذكر صلاته في المسجد في عيد الفطر وأن الإيمان يمنحه القوة."
  en: "Profile published by the Catalan newspaper Ara in April 2024, on the occasion of Al-Dahdouh's visit to Valencia to receive a press-freedom award: it calls him 'a committed Muslim', records that Eid al-Fitr fell during the visit and that he went to the mosque to pray, and that 'faith helps him be strong'. It names no school."
  es: "Perfil publicado por el periódico catalán Ara en abril de 2024, con motivo de la visita de Al-Dahdouh a Valencia para recibir un premio a la libertad de prensa: lo describe como \"un musulmán comprometido\", menciona que el Eid al-Fitr coincidió con la visita y que acudió a la mezquita a rezar, y que \"la fe le ayuda a ser fuerte\". No menciona ninguna escuela."
  fr: "Un portrait publié par le quotidien catalan Ara en avril 2024, à l'occasion de la visite d'Al-Dahdouh à Valence pour recevoir un prix de la liberté de la presse, le décrit comme « un musulman engagé », précise que l'Aïd el-Fitr coïncidait avec sa visite et qu'il s'est rendu à la mosquée pour prier, et indique que « sa foi le fortifie ». Aucune école n'est mentionnée."
