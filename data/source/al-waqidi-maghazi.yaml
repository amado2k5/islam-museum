summary:
  ar: "نص رقمي من المكتبة الشاملة ⁦(shamela.ws/book/23680)⁩ لكتاب المغازي لمحمد بن عمر بن واقد الأسلمي ⁦(ت 207هـ)⁩، في ثلاثة أجزاء، وهو نص طبعة مارسدن جونز، أكسفورد 1966. رقم الصفحة المستشهد به هو رقم صفحة الطبعة المطبوعة كما يظهر في تذييل المكتبة الشاملة."
  en: "Digital text from al-Maktaba al-Shamila (shamela.ws/book/23680) of Kitab al-Maghazi by Muhammad ibn Umar ibn Waqid al-Aslami (d. 207 AH), in three parts — the Marsden Jones edition, Oxford University Press, 1966. Cited pages are the printed edition's page numbers as shown in the Shamela page footer."
  es: "Texto digital de al-Maktaba al-Shamila (shamela.ws/book/23680) del Kitab al-Maghazi de Muhammad ibn Umar ibn Waqid al-Aslami (fallecido en el año 207 de la Hégira), en tres partes — edición de Marsden Jones, Oxford University Press, 1966. Las páginas citadas corresponden a los números de página de la edición impresa, tal como aparecen en el pie de página de Shamela."
  fr: "Texte numérique d'al-Maktaba al-Shamila (shamela.ws/book/23680) du Kitab al-Maghazi de Muhammad ibn Umar ibn Waqid al-Aslami (d. 207 AH), en trois parties — l'édition Marsden Jones, Oxford University Press, 1966. Les pages citées sont les numéros de page de l'édition imprimée tels qu'ils apparaissent dans le pied de page de Shamela."
  ur: "کتاب المغازی کے المکتبہ الشمائلہ (shamela.ws/book/23680) سے ڈیجیٹل متن از محمد ابن عمر ابن واقد الاسلمی ⁦(متوفی 207ھ)⁩، تین حصوں میں - مارسڈن جونز ایڈیشن، آکسفورڈ یونیورسٹی پریس، 1966۔ شالہ کے صفحہ پرنٹر کے صفحہ نمبر کے طور پر حوالہ دیا گیا ہے۔"
  tr: "Muhammed bin Ömer ibn Vaqid El-Esami'nin (ö. 207 Ahri yılı) üç ciltlik Al-Maghazi kitabının Al-Maktabah Al-Shamela (shamela.ws/book/23680) dijital metni, bu metin Marsden Jones baskısının metnidir, Oxford 1966. Belirtilen sayfa numarası, Al-Maktaba Al-Shamela'nın dipnotunda gösterilen basılı baskının sayfa numarasıdır."
  id: "Teks digital dari Al-Maktabah Al-Shamela (shamela.ws/book/23680) dari buku Al-Maghazi karya Muhammad ibn Umar ibn Waqid Al-Aslami (wafat 207 H), dalam tiga volume, yang merupakan teks edisi Marsden Jones, Oxford 1966. Nomor halaman yang dikutip adalah nomor halaman edisi cetak seperti yang ditunjukkan dalam catatan kaki Al-Maktaba Al-Shamela."
