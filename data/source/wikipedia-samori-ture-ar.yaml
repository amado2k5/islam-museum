reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 24 October 2026. The article is a partial translation of the English article (its lead repeats the English lead's school sentence verbatim: 'a Muslim, Sunni, of the Maliki school'), and its infobox dates him 1828–1900 while its lead says c. 1830. Because its Maliki sentence is the English sentence in translation, the museum does not count it as a second independent source naming a school, and the record's faith value is unknown with that basis stated. Its narrative otherwise follows the English article (Wassoulou Empire 1878–1898, the 1884 proclamation, capture in 1898, exile and death at Ndjolé on 2 June 1900)."
