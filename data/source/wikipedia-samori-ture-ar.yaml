  ar: "مقالة ويكيبيديا العربية عن ساموري توري؛ تُستخدم لوقائع الكيان فقط. تفتتح بوصفه زعيما مسلما سنّيا من المدرسة المالكية — وهي عبارة مترجمة عن الإنجليزية لا شهادة مستقلة — وتسرد قيامه بإمبراطورية واسولو ومقاومته فرنسا وأسره ونفيه ووفاته في الغابون."
