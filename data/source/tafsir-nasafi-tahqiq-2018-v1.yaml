label:
  ar: "مدارك التنزيل وحقائق التأويل ⁦(تفسير النسفي)⁩ — تحقيق محمد محمد علي درويش، مراجعة أحمد محمد الفاضل، دار تحقيق الكتاب، ط1 2018، المجلد الأول"
  en: "Madarik al-Tanzil wa-Haqa'iq al-Ta'wil (Tafsir al-Nasafi) — ed. Muhammad Muhammad 'Ali Darwish, reviewed by Ahmad Muhammad al-Fadil, Dar Tahqiq al-Kitab, 1st ed. 2018, vol. 1"
summary:
  ar: "المجلد الأول ⁦(696 صفحة)⁩ من طبعة دار تحقيق الكتاب ⁦(إسطنبول، طبع في لبنان)⁩، بمقدمة المراجع أحمد محمد الفاضل ⁦(مؤرخة 1/8/2017)⁩ ومقدمة المحقق محمد محمد علي درويش (2/8/2017) في ترجمة النسفي ومنهج التفسير ومصادره، ووصف ثلاث نسخ خطية تركية ⁦(ولي الدين 254، فيض الله 231، راغب باشا 229)⁩، ثم مقدمة المؤلف والتفسير من الفاتحة."
  en: "Volume 1 (696 pages) of the Dar Tahqiq al-Kitab edition (Istanbul, printed in Lebanon), with an introduction by the reviewer Ahmad Muhammad al-Fadil (dated 1 August 2017) and one by the editor Muhammad Muhammad 'Ali Darwish (2 August 2017) on al-Nasafi's life and the tafsir's method and sources, a description of three Turkish manuscripts (Veliyüddin 254, Feyzullah 231, Ragıp Paşa 229), then the author's preface and the commentary from al-Fatiha."
  es: "Volumen 1 (696 páginas) de la edición Dar Tahqiq al-Kitab (Estambul, impreso en Líbano), con una introducción del crítico Ahmad Muhammad al-Fadil (fechada el 1 de agosto de 2017) y otra del editor Muhammad Muhammad 'Ali Darwish (2 de agosto de 2017) sobre la vida de al-Nasafi y el método y las fuentes del tafsir, una descripción de tres manuscritos turcos (Veliyüddin 254, Feyzullah 231, Ragıp Paşa 229), seguido del prefacio del autor y el comentario de al-Fatiha."
  fr: "Volume 1 (696 pages) de l'édition Dar Tahqiq al-Kitab (Istanbul, imprimé au Liban), avec une introduction du critique Ahmad Muhammad al-Fadil (datée du 1er août 2017) et une autre de l'éditeur Muhammad Muhammad 'Ali Darwish (2 août 2017) sur la vie d'al-Nasafi et la méthode et les sources du tafsir, une description de trois manuscrits turcs (Veliyüddin 254, Feyzullah 231, Ragıp Paşa 229), puis la préface de l'auteur et le commentaire d'al-Fatiha."
  ur: "دار التحقیق الکتاب ایڈیشن ⁦(استنبول، لبنان میں مطبوعہ)⁩ کی جلد 1 ⁦(696 صفحات)⁩، ایک تعارف کے ساتھ جائزہ نگار احمد محمد الفادل ⁦(مورخہ 1 اگست 2017)⁩ اور ایک ایڈیٹر محمد محمد علی درویش ⁦(2 اگست 2017)⁩ نے النساء کے تین مآخذات اور تصریحات النساء پر۔ ترکی کے مخطوطات ⁦(ویلیو الدین 254، فیض اللہ 231، راگپ پاشا 229)⁩، پھر مصنف کا دیباچہ اور الفاتحہ کی تفسیر۔"
  tr: "Dar Tahqiq al-Kitab (İstanbul, Lübnan'da basım) baskısından Birinci Cilt (696 sayfa), marajib Ahmed Muhammed El-Fadzil'in (8.01.017 tarihli) önsözü ve editör Muhammed Ali Derviş'in (8.02.2017) Al-Nasafi'nin biyografisi, tefsir metodolojisi ve kaynakları üzerine yazdığı giriş, üç Türk el yazmasının açıklaması (Veliddin 254, Feydullah 231, Raghib Paşa 229) ile birlikte, ardından yazarın giriş ve El-Fatiha'dan tafsirle birlikte."
  id: "Volume Satu (696 halaman) dari edisi Dar Tahqiq al-Kitab (Istanbul, dicetak di Lebanon), dengan pengantar oleh marajib Ahmad Muhammad Al-Fadhil (tanggal 8/1/2017) dan pengantar oleh editor Muhammad Muhammad Ali Darwish (8/2/2017) tentang biografi Al-Nasafi, metodologi eksposisi dan sumbernya, beserta deskripsi tiga manuskrip Turki (Wali al-Din 254, Faydullah 231, Raghib Pasha 229), kemudian pengantar penulis dan tafsir dari Al-Fatiha."
