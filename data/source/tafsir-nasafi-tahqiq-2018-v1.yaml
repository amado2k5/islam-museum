  en: "Madarik al-Tanzil wa-Haqa'iq al-Ta'wil (Tafsir al-Nasafi) — ed. Muhammad Muhammad 'Ali Darwish, reviewed by Ahmad Muhammad al-Fadil, Dar Tahqiq al-Kitab, 1st ed. 2018, vol. 1"
summary:
  ar: "المجلد الأول ⁦(696 صفحة)⁩ من طبعة دار تحقيق الكتاب ⁦(إسطنبول، طبع في لبنان)⁩، بمقدمة المراجع أحمد محمد الفاضل ⁦(مؤرخة 1/8/2017)⁩ ومقدمة المحقق محمد محمد علي درويش (2/8/2017) في ترجمة النسفي ومنهج التفسير ومصادره، ووصف ثلاث نسخ خطية تركية ⁦(ولي الدين 254، فيض الله 231، راغب باشا 229)⁩، ثم مقدمة المؤلف والتفسير من الفاتحة."
  en: "Volume 1 (696 pages) of the Dar Tahqiq al-Kitab edition (Istanbul, printed in Lebanon), with an introduction by the reviewer Ahmad Muhammad al-Fadil (dated 1 August 2017) and one by the editor Muhammad Muhammad 'Ali Darwish (2 August 2017) on al-Nasafi's life and the tafsir's method and sources, a description of three Turkish manuscripts (Veliyüddin 254, Feyzullah 231, Ragıp Paşa 229), then the author's preface and the commentary from al-Fatiha."
