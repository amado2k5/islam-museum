summary:
  ar: "مقالة ويكيبيديا الصينية عن ماموتي محيطي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده «ثمانينيات القرن التاسع عشر، 1887؟» في أستانا قرب توربان ووفاته سنة 1944، وقيادته العسكرية في كاشغر."
  en: "Chinese Wikipedia article on Mamuti Muhiti (Mahmut Muhiti); used for entity facts only. It gives his birth as '1880s, 1887?' at Astana near Turpan and his death in 1944, and his military command in Kashgar."
  es: "Artículo de la Wikipedia en chino sobre Mamuti Muhiti (Mahmut Muhiti); utilizado únicamente para datos sobre la persona. Indica que nació en la década de 1880 o en 1887 en Astaná, cerca de Turpan, y que falleció en 1944, además de haber ejercido como comandante militar en Kashgar."
  fr: "Article de Wikipédia en chinois sur Mamuti Muhiti (Mahmut Muhiti); utilisé uniquement pour les informations sur l'entité. Il indique sa naissance entre 1880 et 1887 à Astana, près de Turpan, sa mort en 1944 et son commandement militaire à Kashgar."
  ur: "چینی ویکیپیڈیا مضمون پر Mamuti Muhiti (Mahmut Muhiti); صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش '1880، 1887؟' ترپن کے قریب آستانہ اور 1944 میں اس کی موت اور کاشغر میں اس کی فوجی کمان۔"
  tr: "Okyanusal mamutlar hakkında Çin Vikipedi makalesi; sadece varlık bilgileri için kullanılmıştır. Doğumunu \"1887-1880'ler mi?\" olarak Astana, Turpan yakınlarında ve 1944'te öldüğünü, Askeri komutanlığını ise Kaşgar'da vermektedir."
  id: "Artikel Wikipedia Tiongkok tentang mammoth laut; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya sebagai \"1887 1880s?\" di Astana dekat Turpan, dan kematiannya pada tahun 1944, serta komando militernya di Kashgar."
