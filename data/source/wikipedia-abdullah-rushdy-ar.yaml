reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule). The article gives his full name (Abdullah Muhammad Rushdy Muhammad al-Saadawi), his birth in Cairo on 3 February 1984, his two Azhar bachelor's degrees (Islamic dawah; sharia and law) and his master's in religions and schools, his post as imam and preacher of the Sayyida Nafisa Mosque for the Ministry of Awqaf, his 2011 Fajr TV programme Al-Qawl al-Fasl and his televised debates, his removal from preaching in 2017 and court-ordered reinstatement in August 2019, and three books. Its infobox gives his affiliation as Ahl al-Sunna wa'l-Jama'a and his jurisprudence as Shafi'i — a single-infobox attestation, treated as such in the faith note of his record. Checked 25 October 2026."
