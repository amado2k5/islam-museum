  en: "English Wikipedia article on Moeen Ali (born 1987); used for entity facts only. It records his birth in Sparkhill, Birmingham, on 18 June 1987, his career for Warwickshire, Worcestershire and England (2014–2024), his 2019 and 2022 World Cup wins, his international retirement in September 2024 and his 2018 autobiography."
