  fr: "La page « Bahrain » du site de l'Encyclopaedia Britannica ; lue le 21 novembre 2026 pour : l'énoncé sur l'arabe langue officielle, l'anglais seconde langue obligatoire à l'école, le persan parlé surtout à la maison et les langues des expatriés."
