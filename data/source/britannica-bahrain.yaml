  ar: "صفحة «Bahrain» على موقع Encyclopaedia Britannica؛ قُرئت في 21 نوفمبر 2026، في موضوع: العبارة عن العربية لغة رسمية والإنجليزية لغة ثانية إلزامية في المدارس والفارسية في البيوت غالباً ولغات الوافدين."
  en: "The page \"Bahrain\" on the Encyclopaedia Britannica website; read on 21 November 2026 for the statement on Arabic as the official language, English as a compulsory second language in schools, Persian spoken mostly at home and the expatriate languages."
