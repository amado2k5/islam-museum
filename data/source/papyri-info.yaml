  en: "Papyri.info (Duke Databank of Documentary Papyri and the Heidelberg register, HGV)"
  ur: "پاپائری ڈاٹ انفو: ڈیوک کا دستاویزی بردیات کا ذخیرہ اور ہائیڈلبرگ کی فہرست"
summary:
  ar: "بوابة البرديات الوثائقية التي يرعاها مركز ديوك للحوسبة في الدراسات الكلاسيكية. تجمع نصوص قاعدة بيانات ديوك للبرديات الوثائقية، وبيانات فهرس هايدلبرغ عن تاريخ كل وثيقة ومكانها وموضوعها، وفهارس مجموعات البردي. بياناتها منشورة برخصة المشاع الإبداعي «نسبة المصنف 3.0». وفيها وثائق يونانية وقبطية من مصر في القرن الأول الهجري، وهي شواهد معاصرة على الإدارة والضرائب والحياة اليومية."
  en: "The documentary papyrology portal maintained by the Duke Collaboratory for Classics Computing. It brings together the texts of the Duke Databank of Documentary Papyri, the Heidelberg register's metadata on each document's date, place and subject, and the catalogues of papyrus collections. Its data is published under a Creative Commons Attribution 3.0 licence. It holds Greek and Coptic documents from Egypt in the first Islamic century, contemporary witnesses to administration, taxation and daily life."
  ur: "دستاویزی بردیات کا یہ ذخیرہ ڈیوک یونیورسٹی کا ایک علمی مرکز چلاتا ہے۔ اس میں ڈیوک کے ذخیرے کے متون جمع ہیں۔ ہائیڈلبرگ کی فہرست ہر دستاویز کی تاریخ، مقام اور موضوع بتاتی ہے۔ بردیات کے مجموعوں کی فہرستیں بھی اس میں شامل ہیں۔ اس کا ڈیٹا کری ایٹو کامنز انتساب 3.0 اجازت نامے کے تحت شائع ہے۔ اس میں پہلی صدی ہجری کے مصر کی یونانی اور قبطی دستاویزات ہیں۔ یہ دستاویزات انتظام، محصول اور روزمرہ زندگی کی ہم عصر شہادتیں ہیں۔"
