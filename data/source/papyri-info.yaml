reliability_note: "The standard digital corpus of documentary papyri: the Duke Databank of Documentary Papyri (DDbDP) texts, the Heidelberger Gesamtverzeichnis (HGV) metadata (date, provenance, subject keywords, Trismegistos and Pleiades place references), APIS collection catalogues and a copy of Arabic Papyrology Database texts, each revised through editorial boards. Licence: the project's data repository states Creative Commons Attribution 3.0 with copyright and attribution to the respective projects (github.com/papyri/idp.data README, read 11 Nov 2026); the museum's {cite:papyri-info <ddb-id>} is the attribution. Anchor: the DDbDP hybrid id (for example sb;6;9576), which resolves at papyri.info/ddbdp/<id>; the Trismegistos number is recorded beside it where a fact is taken from HGV. Harvest channel: the public data repository only (EpiDoc XML under DDbDP/ and HGV_meta_EpiDoc/, synchronised hourly with the site). The live site answers automated clients with a bot challenge (seen 11 Nov 2026) and is never read by script. Posture: facts-only by lane rule. Dates, provenance, parties and document type are restated in the museum's own words; edition text and translations are never republished, although the licence would allow quotation with attribution. Citable for what a document is, when and where it was written and whom it names, never for a reading of the Greek, Coptic or Arabic text itself. Provenance marked uncertain by HGV is reported as uncertain. Tier 2. Assessment: web-sources lane, 11 Nov 2026; registered by decision dec-20261112-265 (override)."
