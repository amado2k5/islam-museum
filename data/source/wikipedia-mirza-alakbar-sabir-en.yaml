reliability_note: 'Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. Two cautions. (1) Its infobox and text give his death place as Baku, against the Azerbaijani, Russian and Arabic articles and Wikidata (Shamakhi), and its own narrative records his return to Shamakhi for treatment before the death; the record follows Shamakhi and discloses the split. (2) It carries the record''s only affiliation attestation — ''he was an adherent of Shia Islam'', citing Rezvani (2015, p. 154) — a single source, so the faith value is unknown with the wording preserved; it also quotes his verse professing to be ''a Shi''ite, but not in the ways you desire; a Sunni, but not like the examples you like; a Sufi, but not like the ones you describe'', and describes his religious, middle-class household, which is upbringing.'
