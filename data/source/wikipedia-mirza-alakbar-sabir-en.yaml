summary:
  ar: مقالة ويكيبيديا الإنجليزية عن ميرزا علي أكبر صابر؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في شماخي في 30 مايو 1862 ودراسته على يد سيد عظيم شيرواني وخمس عشرة سنة في صناعة الصابون وأول قصيدة منشورة له سنة 1903 وكتابته في «ملا نصر الدين» من 1909 وشعره الساخر والعداء الذي جرّه عليه ووفاته في 12 يوليو 1911.
  en: English Wikipedia article on Mirza Ali-Akbar Sabir; used for entity facts only. It gives his birth at Shamakhi on 30 May 1862, his schooling under Seyid Azim Shirvani, his fifteen years making soap, his first published poem of 1903, his writing for Molla Nasraddin from 1909, his satirical verse and the hostility it drew, and his death on 12 July 1911.
  es: "Artículo de la Wikipedia en inglés sobre Mirza Ali-Akbar Sabir; utilizado únicamente para datos sobre la persona. Describe su nacimiento en Shamakhi el 30 de mayo de 1862, su educación con Seyid Azim Shirvani, sus quince años fabricando jabón, su primer poema publicado en 1903, su colaboración con Molla Nasraddin desde 1909, su poesía satírica y la hostilidad que generó, y su fallecimiento el 12 de julio de 1911."
  fr: "Article de Wikipédia en anglais sur Mirza Ali-Akbar Sabir; utilisé uniquement pour les informations biographiques. Il mentionne sa naissance à Shamakhi le 30 mai 1862, sa scolarité auprès de Seyid Azim Shirvani, ses quinze années passées à fabriquer du savon, son premier poème publié en 1903, sa collaboration avec Molla Nasraddin à partir de 1909, ses vers satiriques et l’hostilité qu’ils ont suscitée, ainsi que sa mort le 12 juillet 1911."
  ur: "مرزا علی اکبر صابر پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 30 مئی 1862 کو شماکھی میں ان کی پیدائش، سید عظیم شیروانی کے تحت ان کی اسکولنگ، ان کے پندرہ سال صابن بنانے، ان کی پہلی شائع شدہ نظم 1903، ان کی 1909 سے ملا نصرالدین کے لیے تحریر، ان کی طنزیہ نظم اور اس سے پیدا ہونے والی دشمنی، اور 12 جولائی کو ان کی موت واقع ہوئی۔"
  tr: "Mirza Ali Akbar Sabir hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 30 Mayıs 1862'de Şamakhi'de doğdu, Seyyid Azim Şirvani'nin yanında eğitim aldı, on beş yıl sabun yapımcılığında çalıştı, ilk yayımlanan şiiri 1903'te, 1909'da 'Mulla Nasruddin'de yazdı, hicivli şiirleri ve ona karşı duyduğu düşmanlık ve 12 Temmuz 1911'de vefat etti."
  id: "Artikel Wikipedia bahasa Inggris tentang Mirza Ali Akbar Sabir; digunakan hanya untuk fakta entitas. Ia lahir di Shamakhi pada 30 Mei 1862, belajar di bawah bimbingan Sayyid Azim Shirwani, menghabiskan lima belas tahun di bidang pembuatan sinetron, puisi pertamanya yang diterbitkan pada tahun 1903, tulisannya dalam 'Mulla Nasruddin' dari tahun 1909, puisi satirnya, dan permusuhan yang ia timbulkan terhadapnya, serta kematiannya pada 12 Juli 1911."
