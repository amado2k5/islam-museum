  ar: مقالة ويكيبيديا الإنجليزية عن ميرزا علي أكبر صابر؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في شماخي في 30 مايو 1862 ودراسته على يد سيد عظيم شيرواني وخمس عشرة سنة في صناعة الصابون وأول قصيدة منشورة له سنة 1903 وكتابته في «ملا نصر الدين» من 1909 وشعره الساخر والعداء الذي جرّه عليه ووفاته في 12 يوليو 1911.
  en: English Wikipedia article on Mirza Ali-Akbar Sabir; used for entity facts only. It gives his birth at Shamakhi on 30 May 1862, his schooling under Seyid Azim Shirvani, his fifteen years making soap, his first published poem of 1903, his writing for Molla Nasraddin from 1909, his satirical verse and the hostility it drew, and his death on 12 July 1911.
