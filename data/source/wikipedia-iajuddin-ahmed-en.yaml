summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عياض الدين أحمد؛ تُستخدم لوقائع الكيان فقط. تروي مولده في ناياغاون ببكرمبور في 1 فبراير 1931 ابنًا لعالم دين مسلم، ومسيرته أستاذًا لعلوم التربة في جامعة دكا، ورئاسته (2002–2009) وتولّيه منصب المستشار الرئيسي للحكومة المؤقتة (2006–2007) حتى حالة الطوارئ المدعومة عسكريًا في يناير 2007، ووفاته في بانكوك في 10 ديسمبر 2012 ودفنه في مقبرة بناني بدكا. لا يحمل صندوق معلوماتها حقلًا للديانة ولا يذكر متنها مذهبًا له."
  en: "English Wikipedia article on Iajuddin Ahmed; used for entity facts only. It recounts his birth at Nayagaon, Bikrampur, on 1 February 1931, the son of a Muslim cleric, his career as a professor of soil science at the University of Dhaka, his presidency (2002–2009) and his tenure as chief adviser of the caretaker government (2006–07) ending in the military-backed emergency of January 2007, and his death at Bangkok on 10 December 2012 and burial at Banani graveyard, Dhaka. Its infobox carries no religion field and its text names no school for him."
