summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عياض الدين أحمد؛ تُستخدم لوقائع الكيان فقط. تروي مولده في ناياغاون ببكرمبور في 1 فبراير 1931 ابنًا لعالم دين مسلم، ومسيرته أستاذًا لعلوم التربة في جامعة دكا، ورئاسته (2002–2009) وتولّيه منصب المستشار الرئيسي للحكومة المؤقتة (2006–2007) حتى حالة الطوارئ المدعومة عسكريًا في يناير 2007، ووفاته في بانكوك في 10 ديسمبر 2012 ودفنه في مقبرة بناني بدكا. لا يحمل صندوق معلوماتها حقلًا للديانة ولا يذكر متنها مذهبًا له."
  en: "English Wikipedia article on Iajuddin Ahmed; used for entity facts only. It recounts his birth at Nayagaon, Bikrampur, on 1 February 1931, the son of a Muslim cleric, his career as a professor of soil science at the University of Dhaka, his presidency (2002–2009) and his tenure as chief adviser of the caretaker government (2006–07) ending in the military-backed emergency of January 2007, and his death at Bangkok on 10 December 2012 and burial at Banani graveyard, Dhaka. Its infobox carries no religion field and its text names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Iajuddin Ahmed; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Nayagaon, Bikrampur, el 1 de febrero de 1931, hijo de un clérigo musulmán; su carrera como profesor de ciencias del suelo en la Universidad de Dhaka; su presidencia (2002-2009) y su mandato como asesor principal del gobierno interino (2006-2007), que culminó con el estado de emergencia respaldado por los militares en enero de 2007; y su fallecimiento en Bangkok el 10 de diciembre de 2012 y su entierro en el cementerio de Banani, Dhaka. Su ficha informativa no incluye información sobre religión y su texto no menciona ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en anglais sur Iajuddin Ahmed; utilisé uniquement pour les informations le concernant. Il relate sa naissance à Nayagaon, Bikrampur, le 1er février 1931, fils d'un religieux musulman, sa carrière de professeur de pédologie à l'Université de Dhaka, sa présidence (2002-2009) et son mandat de conseiller principal du gouvernement intérimaire (2006-2007), qui prit fin avec l'état d'urgence décrété par l'armée en janvier 2007, ainsi que son décès à Bangkok le 10 décembre 2012 et son inhumation au cimetière de Banani, à Dhaka. Son infobox ne comporte pas de champ relatif à la religion et son texte ne mentionne aucun établissement scolaire."
  ur: "انگلش ویکیپیڈیا مضمون ایاج الدین احمد پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں یکم فروری 1931 کو نیاگون، بکرم پور میں ان کی پیدائش، ایک مسلمان عالم کے بیٹے، ڈھاکہ یونیورسٹی میں مٹی سائنس کے پروفیسر کے طور پر ان کا کیریئر، ان کی صدارت (2002-2009) اور نگراں حکومت کے چیف ایڈوائزر کے طور پر ان کی مدت کا ذکر ہے (2006-07) جنوری 2007 میں ایمرجنسی کے بعد ان کی موت، 2006-07 میں موت ہوئی۔ 10 دسمبر 2012 کو بنکاک اور تدفین بنانی قبرستان، ڈھاکہ میں۔ اس کے معلوماتی خانے میں کوئی مذہب نہیں ہے اور اس کے متن میں اس کے لیے کوئی اسکول نہیں ہے۔"
