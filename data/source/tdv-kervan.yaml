summary:
  ar: "مدخل «قافلة⁦/⁩كروان» في موسوعة TDV الإسلامية: قوافل الحيوانات الحاملة للبضائع والمسافرين من عهد مستعمرات آشور التجارية إلى قوافل الحج والإبل العثمانية، وتنظيم السير والحماية والأدلّاء وانحطاط التجارة البرية بعد قناة السويس."
  en: "The TDV İslâm Ansiklopedisi entry on the caravan: pack-animal trains carrying goods and travellers from the Assyrian trade colonies to the hajj caravans and Ottoman camel trains; the organisation of the march, guards and guides, and the decline of overland trade after the Suez Canal."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre la caravana: caravanas de animales de carga que transportaban mercancías y viajeros desde las colonias comerciales asirias hasta las caravanas del Hajj y las caravanas de camellos otomanas; la organización de la marcha, los guardias y los guías, y el declive del comercio terrestre tras el Canal de Suez."
  fr: "L'article de TDV İslâm Ansiklopedisi sur la caravane: les convois d'animaux de bât transportant des marchandises et des voyageurs des colonies commerciales assyriennes aux caravanes du hajj et aux convois de chameaux ottomans; l'organisation de la marche, les gardes et les guides, et le déclin du commerce terrestre après le canal de Suez."
  ur: "قافلے میں TDV İslâm Ansiklopedisi کا داخلہ: سامان اور مسافروں کو اسوری تجارتی کالونیوں سے حج کارواں اور عثمانی اونٹ ٹرینوں تک لے جانے والی پیک جانوروں کی ٹرینیں؛ مارچ کی تنظیم، گارڈز اور گائیڈز، اور نہر سویز کے بعد زمینی تجارت میں کمی۔"
  tr: "TDV İslami Ansiklopedisi'nde \"Kervan/Kervan\" hakkında bir giriş: Asur ticaret kolonilerinden Osmanlı hac ve deve kervanlarına kadar mal ve yolcu taşıyan hayvan kervanları, trafiğin organizasyonu, koruma, rehberler ve Süveyş Kanalı'ndan sonra kara ticaretinin gerilemesi."
  id: "Entri tentang \"Karavan/Karavan\" dalam Ensiklopedia Islam TDV: Karavan hewan yang membawa barang dan pelancong dari era koloni perdagangan Asyur hingga ziarah Ottoman dan karavan unta, organisasi lalu lintas, perlindungan, pemandu, dan penurunan perdagangan darat setelah Terusan Suez."
