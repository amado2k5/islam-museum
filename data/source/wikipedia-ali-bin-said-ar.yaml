summary:
  ar: "مقالة ويكيبيديا العربية عن علي بن سعيد البوسعيدي؛ تُستخدم لوقائع الكيان فقط. تذكر أنه الابن الثاني والعشرون لسعيد بن سلطان وأمه حبشية، وأنه عُيّن وليا للعهد سنة 1888، وباع الشريط الساحلي لألمانيا، وقَبِل الحماية البريطانية رسميا في 7 نوفمبر 1890، ووضع أول دستور لزنجبار سنة 1891."
  en: "Arabic Wikipedia article on Ali bin Said al-Busaidi; used for entity facts only. It records that he was the twenty-second son of Said bin Sultan by an Abyssinian mother, was named heir apparent in 1888, sold the coastal strip to Germany, formally accepted the British protectorate on 7 November 1890, and gave Zanzibar its first constitution in 1891."
