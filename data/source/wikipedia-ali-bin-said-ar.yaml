reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 24 October 2026; its family data rests on Royal Ark's Al Bu Said genealogy (accessed April 2020). It gives: born about 1854 at Muscat (infobox), the twenty-second son of Said bin Sultan by the Abyssinian lady Nur al-Sabah; named heir apparent on 27 March 1888; on his accession after Khalifah's death he demolished the ruined palace at Beit al-Hukm; sold the Tanganyika coastal strip to Germany on 17 October 1890; formally accepted the British protectorate on 7 November 1890 (the English and German articles date the provisional protectorate agreement to 14 June 1890 — the record notes both dates); promulgated Zanzibar's first constitution and constitutional government in 1891; died 5 March 1893, leaving one son (Said, born 1893) and four daughters. The article states nothing about his religion."
