summary:
  ar: "مقالة ويكيبيديا الأردية المختصرة في جملتين عن علي بن الحسين حجازي: ملك الحجاز وشريف مكة من أكتوبر 1924 إلى ديسمبر 1925 وأكبر أبناء حسين بن علي شريف مكة، وتخطئ فتسميه أول ملوك مملكة الحجاز بينما كان أبوه أولهم وهو ثانيهم."
  en: "Two-sentence Urdu Wikipedia stub on Ali bin Hussein of Hejaz: King of the Hejaz and Sharif of Mecca from October 1924 to December 1925 and the eldest son of Hussein bin Ali, Sharif of Mecca; it errs in calling him the first king of the Kingdom of Hejaz, where his father was the first king and he the second."
  es: "Breve reseña de dos frases en urdu de Wikipedia sobre Ali bin Hussein de Hiyaz: Rey de Hiyaz y Sharif de La Meca desde octubre de 1924 hasta diciembre de 1925 y el hijo mayor de Hussein bin Ali, Sharif de La Meca; se equivoca al llamarlo el primer rey del Reino de Hiyaz, donde su padre fue el primer rey y él el segundo."
  fr: "Ébauche de deux phrases de l'article Wikipédia en ourdou sur Ali bin Hussein du Hedjaz: roi du Hedjaz et chérif de La Mecque d'octobre 1924 à décembre 1925 et fils aîné de Hussein bin Ali, chérif de La Mecque; l'article commet une erreur en le qualifiant de premier roi du royaume du Hedjaz, alors que son père fut le premier roi et lui le deuxième."
  ur: "حجاز کے علی بن حسین پر دو جملوں پر مشتمل اردو ویکیپیڈیا اسٹب: اکتوبر 1924 سے دسمبر 1925 تک حجاز کے بادشاہ اور مکہ کے شریف اور حسین بن علی کے بڑے بیٹے، شریف آف مکہ؛ یہ اسے حجاز کی بادشاہی کا پہلا بادشاہ کہنے میں غلطی کرتا ہے، جہاں اس کا باپ پہلا بادشاہ تھا اور وہ دوسرا۔"
  tr: "Urduca Vikipedi makalesi, Ali ibn al-Hüseyin Hiceci hakkında iki cümleyle özetlenmiştir: Hicaz Kralı ve Mekke'nin Ekim 1924'ten Aralık 1925'e kadar Şehrifi ve Mekke'nin Şerifi Hüseyin bin Ali'nin en büyük oğlu. Onu yanlışlıkla Hicaz Krallığı'nın ilk kralı olarak adlandırıyorsunuz, oysa babası birinci ve ikinci kraldı."
  id: "Artikel Wikipedia dalam bahasa Urdu dirangkum dalam dua kalimat tentang Ali ibn al-Husayn Hijazi: Raja Hijaz dan Sharif Mekah dari Oktober 1924 hingga Desember 1925, serta putra sulung Husayn ibn Ali, Sharif dari Mekah. Anda keliru menyebutnya raja pertama Kerajaan Hejaz sementara ayahnya adalah raja pertama dan kedua."
