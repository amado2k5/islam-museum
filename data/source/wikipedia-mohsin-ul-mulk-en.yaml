  ar: "مقالة ويكيبيديا الإنجليزية عن نواب محسن الملك ⁦(سيد مير مهدي علي)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 9 ديسمبر 1837 في إيتاوا ووفاته في 16 أكتوبر 1907، وأنه اعتنق المذهب السني رغم مولده شيعيًا وألّف «آيات بينات»."
  en: "English Wikipedia article on Nawab Mohsin-ul-Mulk (Syed Mir Mehdi Ali); used for entity facts only. It records his birth on 9 December 1837 at Etawah and death on 16 October 1907, and states that he converted to Sunnism despite being born a Shia and authored Ayat-i Bayanat showing why the Sunni faith was preferable."
