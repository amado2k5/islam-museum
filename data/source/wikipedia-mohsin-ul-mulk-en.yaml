summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نواب محسن الملك ⁦(سيد مير مهدي علي)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 9 ديسمبر 1837 في إيتاوا ووفاته في 16 أكتوبر 1907، وأنه اعتنق المذهب السني رغم مولده شيعيًا وألّف «آيات بينات»."
  en: "English Wikipedia article on Nawab Mohsin-ul-Mulk (Syed Mir Mehdi Ali); used for entity facts only. It records his birth on 9 December 1837 at Etawah and death on 16 October 1907, and states that he converted to Sunnism despite being born a Shia and authored Ayat-i Bayanat showing why the Sunni faith was preferable."
  es: "Artículo de la Wikipedia en inglés sobre Nawab Mohsin-ul-Mulk (Syed Mir Mehdi Ali); utilizado únicamente para datos biográficos. Registra su nacimiento el 9 de diciembre de 1837 en Etawah y su fallecimiento el 16 de octubre de 1907, y afirma que se convirtió al sunismo a pesar de haber nacido chiíta y que fue autor de Ayat-i Bayanat, donde explica por qué la fe suní era preferible."
  fr: "L'article de Wikipédia en anglais sur Nawab Mohsin-ul-Mulk (Syed Mir Mehdi Ali) est utilisé uniquement à des fins d'information. Il indique sa naissance le 9 décembre 1837 à Etawah et son décès le 16 octobre 1907, et précise qu'il s'est converti au sunnisme bien que né chiite. Il est également mentionné qu'il est l'auteur d'Ayat-i Bayanat, un ouvrage démontrant la supériorité de la foi sunnite."
  ur: "نواب محسن الملک ⁦(سید میر مہدی علی)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 9 دسمبر 1837 کو اٹاوہ میں اور موت 16 اکتوبر 1907 کو درج ہے، اور بتایا گیا ہے کہ اس نے شیعہ پیدا ہونے کے باوجود سنّت اختیار کر لی اور آیات بیانات کی تصنیف کی کہ یہ بتاتا ہے کہ سنی عقیدہ کیوں افضل ہے۔"
