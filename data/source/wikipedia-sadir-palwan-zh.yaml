summary:
  ar: "مقالة ويكيبيديا الصينية عن سادير بالوان؛ تُستخدم لوقائع الكيان فقط. تجعله أويغوريًا قاد جيش الانتفاضة في نوفمبر 1864 فاحتل منطقة إيلي كلها، مولودًا سنة 1798 في قرية بإقليم إيلي ومتوفى بالمرض سنة 1871."
  en: "Chinese Wikipedia article on Sadir Palwan; used for entity facts only. It gives him as a Uyghur who in November 1864 led the rebel army that took the whole Ili region, born in 1798 in a village of the Ili region (now Balati Maili village, Yining County) and died of illness in 1871."
  es: "Artículo de la Wikipedia en chino sobre Sadir Palwan; utilizado únicamente para obtener información sobre la persona. Lo describe como un uigur que en noviembre de 1864 lideró el ejército rebelde que tomó toda la región de Ili, nacido en 1798 en una aldea de la región de Ili (actualmente aldea de Balati Maili, condado de Yining) y fallecido por enfermedad en 1871."
  fr: "Article de Wikipédia en chinois sur Sadir Palwan; utilisé uniquement pour les informations sur l’entité. Il est présenté comme un Ouïghour qui, en novembre 1864, a dirigé l’armée rebelle qui a pris le contrôle de toute la région d’Ili, né en 1798 dans un village de la région d’Ili (aujourd’hui le village de Balati Maili, comté de Yining) et décédé de maladie en 1871."
  ur: "سدیر پالوان پر چینی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے ایک ایغور کے طور پر دیتا ہے جس نے نومبر 1864 میں باغی فوج کی قیادت کی جس نے پورے الی علاقے کو اپنے قبضے میں لے لیا، 1798 میں الی علاقے کے ایک گاؤں ⁦(اب بلاتی میلی گاؤں، یننگ کاؤنٹی)⁩ میں پیدا ہوا اور 1871 میں بیماری کی وجہ سے انتقال کر گیا۔"
  tr: "Sadir Balwan hakkında Çin Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Ouyguria, Kasım 1864'te ayaklanma ordusuna liderlik eder, tüm Ili bölgesini işgal eder, 1798'de Ili eyaletinde bir köyde doğmuş ve 1871'de hastalıktan ölür."
  id: "Artikel Wikipedia Tiongkok tentang Sadir Balwan; digunakan hanya untuk fakta entitas. Ouyguria memimpin pasukan pemberontakan pada November 1864, menduduki seluruh wilayah Ili, lahir pada tahun 1798 di sebuah desa di provinsi Ili, dan meninggal karena sakit pada tahun 1871."
