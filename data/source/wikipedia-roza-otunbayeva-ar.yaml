summary:
  ar: "مقالة ويكيبيديا العربية عن روزا أوتونباييفا؛ مقالة قصيرة جدًا تُستخدم لوقائع الكيان فقط، تؤكد توليها تنسيق الحكومة الانتقالية في 7 أبريل 2010 بعد أحداث دامية، وبرنامجها المعلن لحل البرلمان وإعداد دستور جديد."
  en: "Arabic Wikipedia article on Roza Otunbayeva; a very short article used for entity facts only, confirming her assumption of the interim government's coordination on 7 April 2010 after bloody events, and her announced programme of dissolving parliament and preparing a new constitution."
  es: "Artículo en la Wikipedia en árabe sobre Roza Otunbayeva; un artículo muy breve que se utiliza únicamente para presentar datos objetivos, confirmando su asunción de la coordinación del gobierno interino el 7 de abril de 2010 tras los sangrientos sucesos, y su programa anunciado de disolver el parlamento y preparar una nueva constitución."
  fr: "Article de Wikipédia en arabe sur Roza Otunbayeva; un article très court servant uniquement à présenter les faits concernant l’entité, confirmant sa prise de fonction à la tête du gouvernement intérimaire le 7 avril 2010 après des événements sanglants, et son programme annoncé de dissolution du parlement et de préparation d’une nouvelle constitution."
  ur: "روزا اوتن بائیفا پر عربی ویکیپیڈیا مضمون؛ 7 اپریل 2010 کو خونی واقعات کے بعد عبوری حکومت کے ہم آہنگی کے بارے میں ان کے مفروضے کی تصدیق اور پارلیمنٹ کو تحلیل کرنے اور ایک نیا آئین تیار کرنے کے اعلان کردہ پروگرام کے بارے میں صرف ہستی کے حقائق کے لیے استعمال ہونے والا ایک بہت ہی مختصر مضمون۔"
  tr: "Roza Otunbayeva hakkında Arapça Wikipedia makalesi; sadece varlığın gerçekleri için kullanılan çok kısa bir makale; kanlı olayların ardından 7 Nisan 2010'da geçiş hükümetinin koordinasyonunu üstlendiğini ve parlamentoyu feshedip yeni bir anayasa hazırlama programını açıkladığını doğrulamaktadır."
  id: "Artikel Wikipedia berbahasa Arab tentang Roza Otunbayeva; artikel sangat singkat yang hanya digunakan untuk fakta entitas, mengonfirmasi asumsinya tentang koordinasi pemerintahan transisi pada 7 April 2010, setelah peristiwa berdarah, dan program yang diumumkan untuk membubarkan parlemen dan menyiapkan konstitusi baru."
