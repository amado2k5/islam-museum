reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A very short article, read in full on 25 October 2026 and used only to confirm the frame of her April 2010 accession in Arabic-language reference: that on 7 April 2010 she announced herself coordinator of Kyrgyzstan's transitional government after bloody events in which more than 60 people were killed, that she would dissolve parliament, govern for six months, prepare a new constitution and hold democratic elections, and that she vowed not to repeat the mistakes of Kurmanbek Bakiyev's government. It names no religion for her."
