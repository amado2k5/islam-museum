summary:
  ar: "عنصر ويكيداتا Q4098474 لأولوبي بويناكسكي؛ يُستخدم للمعرّفات والوقائع المنظّمة فقط. يذكر مولده بقيمتي 27 أغسطس 1890 بالنموذج اليولياني و8 سبتمبر 1890 بالنموذج الغريغوري، ووفاته في 16 أغسطس 1919، وعضويته في الحزب الشيوعي، ولا يحمل أي قيمة للدين."
  en: "Wikidata item Q4098474 for Ullubay Buynaksky; used for identifiers and structured facts only. It gives his birth under both calendar values — 27 August 1890 (Julian model) and 8 September 1890 (Gregorian model) — his death on 16 August 1919, his Communist Party membership, and carries no religion value at all."
  es: "Elemento de Wikidata Q4098474 para Ullubay Buynaksky; se utiliza únicamente para identificadores y datos estructurados. Indica su nacimiento según ambos calendarios: el 27 de agosto de 1890 (modelo juliano) y el 8 de septiembre de 1890 (modelo gregoriano), su fallecimiento el 16 de agosto de 1919, su afiliación al Partido Comunista y no contiene ninguna información sobre su religión."
  fr: "L'élément Wikidata Q4098474 pour Ullubay Buynaksky; il sert uniquement aux identifiants et aux faits structurés. Il indique sa date de naissance selon les deux calendriers — le 27 août 1890 (calendrier julien) et le 8 septembre 1890 (calendrier grégorien) —, sa date de décès le 16 août 1919, son appartenance au Parti communiste, mais ne contient aucune information sur sa religion."
  ur: "وکی ڈیٹا آئٹم Q4098474 برائے Ullubay Buynaksky؛ صرف شناخت کنندگان اور ساختی حقائق کے لیے استعمال کیا جاتا ہے۔ یہ دونوں کیلنڈر اقدار کے تحت اس کی پیدائش کرتا ہے - 27 اگست 1890 ⁦(جولین ماڈل)⁩ اور 8 ستمبر 1890 ⁦(گریگورین ماڈل)⁩ - اس کی موت 16 اگست 1919 کو، اس کی کمیونسٹ پارٹی کی رکنیت، اور اس میں مذہب کی کوئی اہمیت نہیں ہے۔"
  tr: "Wikidata öğesi Olubi Poynacski tarafından Q4098474; yalnızca organize tanımlayıcılar ve gerçekler için kullanılır. Doğumu, Jülian modeline göre 27 Ağustos 1890, 8 Eylül 1890 olarak belirtilmiş, ayrıca 16 Ağustos 1919'daki ölümü ve dini değeri olmayan Komünist Parti üyeliği olarak belirtilmiştir."
  id: "Elemen Wikidata Q4098474 oleh Olubi Poynacski; digunakan hanya untuk pengenal terorganisir dan fakta. Kelahirannya disebutkan pada 27 Agustus 1890, menurut model Julian, 8 September 1890, serta kematiannya pada 16 Agustus 1919, dan keanggotaannya di Partai Komunis, tanpa nilai agama."
