  ar: "مقالة ويكيبيديا الإنجليزية عن قاضي نذر الإسلام؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 24 مايو 1899 في تشوروليا ووفاته في 29 أغسطس 1976 في دكا، وشعره وموسيقاه ونضاله ضد الاستعمار ولقبه «الشاعر المتمرد» ومكانته شاعرًا وطنيًا لبنغلاديش، وتصفه في قسم المعتقدات بأنه وُلد مسلمًا دون أن تسمّي له مذهبًا."
  en: "English Wikipedia article on Kazi Nazrul Islam; used for entity facts only. It gives his birth on 24 May 1899 at Churulia and his death on 29 August 1976 in Dhaka, his poetry, music and anti-colonial activism, his title 'Rebel Poet' and his standing as national poet of Bangladesh. Its religious-beliefs section describes him as born a Muslim and names no school."
