summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن قاضي نذر الإسلام؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 24 مايو 1899 في تشوروليا ووفاته في 29 أغسطس 1976 في دكا، وشعره وموسيقاه ونضاله ضد الاستعمار ولقبه «الشاعر المتمرد» ومكانته شاعرًا وطنيًا لبنغلاديش، وتصفه في قسم المعتقدات بأنه وُلد مسلمًا دون أن تسمّي له مذهبًا."
  en: "English Wikipedia article on Kazi Nazrul Islam; used for entity facts only. It gives his birth on 24 May 1899 at Churulia and his death on 29 August 1976 in Dhaka, his poetry, music and anti-colonial activism, his title 'Rebel Poet' and his standing as national poet of Bangladesh. Its religious-beliefs section describes him as born a Muslim and names no school."
  es: "Artículo de la Wikipedia en inglés sobre Kazi Nazrul Islam; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 24 de mayo de 1899 en Churulia y su fallecimiento el 29 de agosto de 1976 en Dhaka, su poesía, música y activismo anticolonial, su título de «Poeta Rebelde» y su condición de poeta nacional de Bangladesh. En la sección sobre creencias religiosas se le describe como musulmán de nacimiento y no se menciona ninguna escuela."
  fr: "Article de Wikipédia en anglais sur Kazi Nazrul Islam; utilisé uniquement pour les informations biographiques. Il indique sa naissance le 24 mai 1899 à Churulia et sa mort le 29 août 1976 à Dhaka, son œuvre poétique et musicale, son engagement anticolonial, son titre de « Poète rebelle » et son statut de poète national du Bangladesh. La section consacrée à ses convictions religieuses précise qu’il est né musulman et ne mentionne aucune école."
  ur: "قاضی نذر اسلام پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 24 مئی 1899 کو چورولیا میں ان کی پیدائش اور ڈھاکہ میں 29 اگست 1976 کو ان کی موت، ان کی شاعری، موسیقی اور نوآبادیاتی مخالف سرگرمی، ان کا لقب 'باغی شاعر' اور بنگلہ دیش کے قومی شاعر کے طور پر ان کا موقف بیان کرتا ہے۔ اس کا مذہبی عقائد والا حصہ اسے ایک مسلمان کے طور پر بیان کرتا ہے اور کسی اسکول کا نام نہیں رکھتا۔"
  tr: "Qadi Nazr al-Islam hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 24 Mayıs 1899'da Chorulia'da doğduğu ve 29 Ağustos 1976'da Dakka'da öldüğü belirtilmektedir. Şiirleri, müziği, sömürgeciliğe karşı mücadelesi, 'İsyancı Şair' lakabı ve Bangladeş'in ulusal şairi olarak statüsü bahsedilmektedir. İnançlar bölümünde, herhangi bir mezhep isimlendirilmeden Müslüman olarak doğduğu belirtilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Qadi Nazr al-Islam; digunakan hanya untuk fakta entitas. Ia disebutkan lahir pada 24 Mei 1899 di Chorulia dan meninggal pada 29 Agustus 1976 di Dhaka. Puisi, musik, perjuangan melawan kolonialisme, julukannya 'Penyair Pemberontak,' dan statusnya sebagai penyair nasional Bangladesh disebutkan. Dalam bagian kepercayaan, ia digambarkan lahir Muslim tanpa menyebutkan sekte apa pun untuknya."
