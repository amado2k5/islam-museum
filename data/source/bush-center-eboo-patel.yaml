summary:
  ar: "مقابلة مركز جورج دبليو بوش الرئاسي مع إيبو باتل؛ يقول فيها بنفسه: «أنا جزء من جماعة الإسلام الإسماعيلية، وهي جماعة شيعية صغيرة» — شهادة ذاتية على انتمائه الإسماعيلي."
  en: "George W. Bush Presidential Center interview with Eboo Patel; in it he says in his own words that he is part of the Ismaili Community of Islam, which is a small Shia community — a self-attestation of his Ismaili affiliation."
  es: "Entrevista del Centro Presidencial George W. Bush con Eboo Patel; en ella, afirma con sus propias palabras que forma parte de la comunidad ismaelita del Islam, que es una pequeña comunidad chiíta, lo que constituye una autoafirmación de su afiliación ismaelita."
  fr: "Interview d'Eboo Patel au Centre présidentiel George W. Bush; il y déclare lui-même faire partie de la communauté ismaélienne de l'islam, une petite communauté chiite — une auto-attestation de son appartenance à l'ismaélisme."
  ur: "ایبو پٹیل کے ساتھ جارج ڈبلیو بش کے صدارتی مرکز کا انٹرویو؛ اس میں وہ اپنے الفاظ میں کہتا ہے کہ وہ اسلام کی اسماعیلی کمیونٹی کا حصہ ہیں، جو کہ ایک چھوٹی شیعہ برادری ہے - اس کی اسماعیلی وابستگی کی خود تصدیق۔"
  tr: "George W. Bush Başkanlık Merkezi'nin Ibbo Patel ile yaptığı röportaj; kendisi de şöyle diyor: \"Ben İsmaili İslam grubunun, küçük bir Şii grubunun\" parçasıyım — bu, onun İsmaili aidiyetine dair bir özgüven."
  id: "Wawancara George W. Bush Presidential Center dengan Ibbo Patel; di mana ia sendiri berkata: \"Saya adalah bagian dari kelompok Islam Ismaili, kelompok Syiah kecil\" — sebuah kesaksian diri atas afiliasi Ismaili-nya."
