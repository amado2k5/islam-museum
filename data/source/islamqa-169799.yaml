  ar: "صفحة «تلاوة القرآن على المقامات» في إسلام سؤال وجواب؛ تستعمل في: عد المقامات الستة كما يوردها أهل الفن، وأقوال أهل العلم في القراءة بالألحان المصنوعة، ونقل ابن القيم عن أحوال السلف في التطريب الفطري. نُقلت الصفحة من موقع IslamQA باستعراض متصفح في 24 نوفمبر 2026."
