reliability_note: "An event organiser's biography, independent of her own site: it is the source that ties her widely used kunya to the legal name Mouna Parkin. A podcast interview (Deep Discussions, Developing Diamonds) independently gives her revert year as 1989 and her birth name as Michelle, with Mouna as the name she is known by. The listing also records that she launched her online Shariah classes in 2020 and is a wife and mother of five. It names no madhhab or sect affiliation for her. Checked 26 October 2026."
