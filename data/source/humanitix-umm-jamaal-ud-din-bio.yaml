summary:
  ar: "سيرة الشيخة أم جمال الدين في إعلان فعالية نسائية في كانبرا نظمها «مسلمو كانبرا المتحدون»؛ تنشر اسمها القانوني بين قوسين «منى باركن» تحت كنيتها، وتروي اعتناقها الإسلام وأكثر من خمسة وعشرين عاما في طلب العلم وشهاداتها في العربية والفقه وأصوله وحفظها القرآن وماجستيرها في الفقه وخبرتها التعليمية التي تتجاوز عشرين عاما وريادتها في المجلس الوطني للأئمة في أستراليا."
  en: "The biography of Shaykha Umm Jamaal ud-Din in the listing for a Canberra women's event organised by United Muslims of Canberra; it publishes her legal name in parentheses, (Mouna Parkin), under her kunya, and recounts her embracing Islam, more than twenty-five years of study, her degrees in Arabic, Fiqh and Usul al-Fiqh, her memorisation of the Quran, her Master's in Fiqh, over twenty years of teaching, and her position among the first qualified female scholars at the Australian National Imams Council."
