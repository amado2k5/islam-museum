summary:
  ar: "مقالة تعريفية بموقع نستفيد عن الشيخ علاء حامد، تصفه بأنه داعية إسلامي مصري ينشر محتوى دينيا تعليميا مبسطا على المنصات الرقمية، وتذكر برنامجه الشبابي «تعلّمت من يوسف» ودوراته ودروسه وبودكاسته."
  en: "A profile article on the Nastafed site about Sheikh Alaa Hamed, describing him as an Egyptian Islamic preacher who publishes simplified educational religious content on digital platforms, and noting his youth programme 'I Learned from Yusuf', his courses and lessons, and his podcast."
  es: "En el sitio web de Nastafed se publicó un artículo sobre el jeque Alaa Hamed, describiéndolo como un predicador islámico egipcio que publica contenido religioso educativo simplificado en plataformas digitales, y mencionando su programa juvenil \"Aprendí de Yusuf\", sus cursos y lecciones, y su podcast."
  fr: "Un article de profil sur le site Nastafed consacré au cheikh Alaa Hamed le décrit comme un prédicateur islamique égyptien qui publie du contenu religieux éducatif simplifié sur des plateformes numériques, et mentionne son programme jeunesse « J'ai appris de Yusuf », ses cours et ses leçons, ainsi que son podcast."
  ur: "شیخ علاء حمید کے بارے میں Nastafed سائٹ پر ایک پروفائل مضمون، جس میں انہیں ایک مصری اسلامی مبلغ کے طور پر بیان کیا گیا ہے جو ڈیجیٹل پلیٹ فارمز پر آسان تعلیمی مذہبی مواد شائع کرتا ہے، اور ان کے نوجوانوں کے پروگرام 'میں نے یوسف سے سیکھا'، اس کے کورسز اور اسباق، اور اس کے پوڈ کاسٹ کو نوٹ کیا ہے۔"
  tr: "Nesfimf web sitesinde Şeyh Alaa Hamed hakkında bir giriş makalesi; onu dijital platformlarda basitleştirilmiş dini ve eğitim içerikleri yayımlayan Mısırlı bir İslami vaiz olarak tanımlıyor, gençlik programı 'Yusuf'tan Öğrendim', kursları, dersleri ve podcast'i anıyor."
  id: "Sebuah artikel pengantar di situs web Nesfimf tentang Sheikh Alaa Hamed, menggambarkannya sebagai seorang pengkhotbah Islam Mesir yang menerbitkan konten keagamaan dan pendidikan yang disederhanakan di platform digital, menyebutkan program remajanya 'I Learned from Joseph,' kursus, pelajaran, dan podcastnya."
title: "من الشاشة إلى القلب: كيف يغير الشيخ علاء حامد حياة متابعيه؟"
