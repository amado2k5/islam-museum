summary:
  ar: "ملف غلف بيزنس عن فايزال كوتيكولون في قائمتها لأبرز 100 هندي لسنة 2025 ⁦(12 تشرين الثاني 2025)⁩: يلخص مجموعة كيف وبيع كيف إنفرا إلى كاتيرا ومستشفى ميترا ومؤسسة فايزال وشبّانة، دون ذكر أي دين."
  en: "Gulf Business profile of Faizal Kottikollon in its Top 100 Indians 2025 list (12 November 2025); it summarises KEF Holdings, the sale of KEF Infra to Katerra, Meitra Hospital and the Faizal & Shabana Foundation, and names no religion for him."
  es: "Gulf Business incluye un perfil de Faizal Kottikollon en su lista de los 100 indios más influyentes de 2025 (12 de noviembre de 2025); en él se resumen KEF Holdings, la venta de KEF Infra a Katerra, el Hospital Meitra y la Fundación Faizal & Shabana, y no se menciona ninguna religión en su nombre."
  fr: "Le profil de Faizal Kottikollon dans la liste des 100 Indiens les plus influents de Gulf Business en 2025 (12 novembre 2025) résume KEF Holdings, la vente de KEF Infra à Katerra, l'hôpital Meitra et la fondation Faizal & Shabana, sans mentionner sa religion."
  ur: "اس کی ٹاپ 100 انڈینز 2025 کی فہرست ⁦(12 نومبر 2025)⁩ میں فیضل کوٹیکولن کا گلف بزنس پروفائل؛ یہ KEF ہولڈنگز کا خلاصہ کرتا ہے، KEF انفرا کی کترا، میترا ہسپتال اور فیضل اینڈ شبانہ فاؤنڈیشن کو فروخت کرتا ہے، اور اس کے لیے کسی مذہب کا نام نہیں لیتا ہے۔"
  tr: "Gulf Business'ın 2025 yılı için en iyi 100 Hintli listesindeki Faisal Kotikulon dosyası (12 Kasım 2025): Kaif ve Sale Kaif grubu Infra to Katira, Mitra Hastanesi, Faizal ve Shabana Vakfı'nı özetliyor, herhangi bir borçtan bahsetmiyor."
  id: "Berkas Gulf Business tentang Faisal Kotikulon dalam daftar 100 orang India teratas untuk tahun 2025 (12 November 2025): merangkum grup Kaif dan Sale Kaif Infra ke Katira, Rumah Sakit Mitra, Faizal, dan Shabana Foundation, tanpa menyebutkan utang apapun."
