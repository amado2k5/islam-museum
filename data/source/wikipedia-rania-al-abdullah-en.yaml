summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رانيا العبد الله؛ تُستخدم لوقائع الكيان فقط. تروي ولادتها باسم رانيا الياسين في مدينة الكويت في 31 أغسطس 1970 لأبوين أردنيين من أصل فلسطيني، ودراستها في الجامعة الأمريكية بالقاهرة وعملها في سيتي بنك وأبل، وزواجها من عبد الله الثاني سنة 1993 وصيرورتها ملكةً سنة 1999، ومؤسسة نهر الأردن التي أسستها سنة 1995 وعملها في التعليم وحقوق الطفل وكتبها الثلاثة للأطفال وحملاتها العالمية. يقرأ حقل الدين في صندوق معلوماتها «الإسلام» فقط، دون مذهب."
  en: "English Wikipedia article on Rania Al-Abdullah; used for entity facts only. It recounts her birth as Rania Al-Yassin in Kuwait City on 31 August 1970 to Jordanian parents of Palestinian origin, her studies at the American University in Cairo and her work for Citibank and Apple, her 1993 marriage to Abdullah II and her becoming queen in 1999, the Jordan River Foundation she founded in 1995, her education and child-welfare work, her three children's books and her global campaigns. Its infobox religion field reads 'Islam' only, with no school named."
  es: "Artículo de Wikipedia en inglés sobre Rania Al-Abdullah; utilizado únicamente para datos sobre la persona. Relata su nacimiento como Rania Al-Yassin en la ciudad de Kuwait el 31 de agosto de 1970, de padres jordanos de origen palestino; sus estudios en la Universidad Americana de El Cairo y su trabajo para Citibank y Apple; su matrimonio con Abdullah II en 1993 y su ascenso al trono en 1999; la Fundación del Río Jordán que fundó en 1995; su labor en educación y bienestar infantil; sus tres libros infantiles y sus campañas internacionales. El campo de religión de su ficha informativa solo indica «Islam», sin mencionar ninguna escuela."
  fr: "Article Wikipédia en anglais sur Rania Al-Abdullah; utilisé uniquement pour les informations la concernant. Il relate sa naissance sous le nom de Rania Al-Yassin à Koweït City le 31 août 1970, de parents jordaniens d'origine palestinienne, ses études à l'Université américaine du Caire et son travail pour Citibank et Apple, son mariage en 1993 avec Abdallah II et son accession au trône en 1999, la Fondation du fleuve Jourdain qu'elle a fondée en 1995, son engagement dans l'éducation et la protection de l'enfance, ses trois livres pour enfants et ses campagnes internationales. L'infobox « Religion » indique seulement « Islam », sans mention d'école."
