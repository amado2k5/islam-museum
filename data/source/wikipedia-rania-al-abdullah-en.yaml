summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رانيا العبد الله؛ تُستخدم لوقائع الكيان فقط. تروي ولادتها باسم رانيا الياسين في مدينة الكويت في 31 أغسطس 1970 لأبوين أردنيين من أصل فلسطيني، ودراستها في الجامعة الأمريكية بالقاهرة وعملها في سيتي بنك وأبل، وزواجها من عبد الله الثاني سنة 1993 وصيرورتها ملكةً سنة 1999، ومؤسسة نهر الأردن التي أسستها سنة 1995 وعملها في التعليم وحقوق الطفل وكتبها الثلاثة للأطفال وحملاتها العالمية. يقرأ حقل الدين في صندوق معلوماتها «الإسلام» فقط، دون مذهب."
  en: "English Wikipedia article on Rania Al-Abdullah; used for entity facts only. It recounts her birth as Rania Al-Yassin in Kuwait City on 31 August 1970 to Jordanian parents of Palestinian origin, her studies at the American University in Cairo and her work for Citibank and Apple, her 1993 marriage to Abdullah II and her becoming queen in 1999, the Jordan River Foundation she founded in 1995, her education and child-welfare work, her three children's books and her global campaigns. Its infobox religion field reads 'Islam' only, with no school named."
