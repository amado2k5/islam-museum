summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كولو توريه؛ تُستخدم لوقائع الكيان فقط. تروي مسيرة المدافع العاجي المولود في 19 مارس 1981 ببواكي: أرسنال «الذي لا يُقهر» 2003–04، ومانشستر سيتي ولقب 2012، وليفربول وسيلتيك، و120 مباراة مع ساحل العاج ولقب أمم أفريقيا 2015، وتذكر في حياته الشخصية أنه مسلم يصوم رمضان."
  en: "English Wikipedia article on Kolo Touré; used for entity facts only. It records the Ivorian defender born 19 March 1981 at Bouaké: the Arsenal 'Invincibles' of 2003–04, Manchester City and the 2012 title, Liverpool and Celtic, 120 Ivory Coast caps and the 2015 Africa Cup of Nations title, and states in its personal life section that he is a Muslim who fasts in Ramadan."
  es: "Artículo de la Wikipedia en inglés sobre Kolo Touré; utilizado únicamente para obtener información sobre la persona. En él se menciona al defensa marfileño nacido el 19 de marzo de 1981 en Bouaké: los 'Invencibles' del Arsenal de la temporada 2003-04, el Manchester City y el título de 2012, el Liverpool y el Celtic, 120 partidos con la selección de Costa de Marfil y el título de la Copa Africana de Naciones de 2015, y en la sección de su vida personal se indica que es musulmán y que ayuna durante el Ramadán."
  fr: "Article Wikipédia en anglais sur Kolo Touré; utilisé uniquement pour les informations relatives à l'individu. Il retrace le parcours du défenseur ivoirien né le 19 mars 1981 à Bouaké: l'équipe des « Invincibles » d'Arsenal en 2003-2004, le titre de champion d'Angleterre remporté par Manchester City en 2012, les passages à Liverpool et au Celtic, ses 120 sélections en équipe nationale de Côte d'Ivoire et le titre de champion d'Afrique des Nations remporté en 2015. La section consacrée à sa vie privée précise qu'il est musulman et observe le jeûne du Ramadan."
  ur: "Kolo Touré پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 19 مارچ 1981 کو Bouaké میں پیدا ہونے والے Ivorian محافظ کو ریکارڈ کیا گیا ہے: 2003-04 کے Arsenal 'Invincibles'، مانچسٹر سٹی اور 2012 کا ٹائٹل، Liverpool and Celtic، 120 Ivory Coast کیپس اور 2015 Africa Cup of Nations میں ایک مسلم لیگ کا ٹائٹل ہے، اور یہ کہ وہ اپنی ذاتی زندگی میں تیزی سے حصہ لے رہا ہے۔"
  tr: "Kolo Touré hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 19 Mart 1981'de Bouaké'de doğan Fildişi Sahilli savunmacının kariyerini anlatır: Arsenal, 'Yenilmez' 2003–04, Manchester City ve 2012 şampiyonluğu, Liverpool ve Celtic, Fildişi Sahili ile 120 maç ve 2015 Afrika Uluslar Kupası. Kişisel hayatında Ramazan oruç tutan bir Müslüman olduğu belirtilir."
  id: "Artikel Wikipedia bahasa Inggris tentang Kolo Touré; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan karier bek asal Pantai Gading yang lahir pada 19 Maret 1981 di Bouaké: Arsenal, 'Tak terkalahkan' 2003–04, Manchester City dan gelar 2012, Liverpool dan Celtic, 120 pertandingan melawan Pantai Gading, dan Piala Afrika 2015. Disebutkan dalam kehidupan pribadinya bahwa ia adalah seorang Muslim yang berpuasa Ramadan."
