reliability_note: "Signed research post, read in full in Chrome on 7 November 2026. Used for Özek's dates (1932–2021) and Marmara University post, his 1982 Turkish translation, the 1992 Istanbul edition (Ilmi Nesriyat) and its team (Nureddin Uzunoğlu, Tevfik Rüştü Topuzoğlu, Mehmet Maksutoğlu), the 2000 edition by the Nawawi Foundation and the Ibn Khaldun Foundation with English reviewers (Abdal Hakim Murad, Uthman Hutchinson, Mostafa al-Badawi), the prefaces' stated aims, about 809 footnotes, Kidwai's criticism of unacknowledged borrowings from Pickthall (2004) and the reviewer's own assessment, the 2018 Server Yayınları edition, and Uzunoğlu's 1998 translation and its 2022 Japanese descendant."
