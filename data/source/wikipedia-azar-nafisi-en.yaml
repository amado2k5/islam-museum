reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). The article states no birth date at all. It records her birth in Tehran to Ahmad Nafisi (mayor of Tehran 1961-1963) and Nezhat Nafisi, her schooling in Lancaster, England (1961-1963) and Switzerland, her doctorate from the University of Oklahoma, her teaching at the University of Tehran and her 1981 expulsion for refusing the mandatory veil, her later expulsion from Allameh Tabataba'i University, her 1995-1997 Thursday-morning book group, her emigration to the United States in June 1997 and US citizenship in 2008, her books (Reading Lolita in Tehran, 2003; Things I've Been Silent About, 2008; The Republic of Imagination, 2014; That Other World; Read Dangerously, 2022) and her Johns Hopkins SAIS and Georgetown roles. It describes her, in a sentence the article itself flags as needing a citation, as 'a secular woman'; it names no religion or school for her."
