reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his entry to al-Azhar in 1902 and his teachers there (among them Sayyid al-Marsafi, Mustafa al-Maraghi, Muhammad Bakhit and Muhammad Abduh, whose reformist views he first admired), his doctorate of 1914 on Abu al-Ala' al-Ma'arri and the parliamentary accusation of deviation that followed, the Azhar examining committee's refusal of the 'alamiyya degree, the 1914 scholarship to Montpellier, the brief loss and restoration of his grant through Sultan Hussein Kamel's intervention, his Paris doctorate on Ibn Khaldun's social philosophy (dated 1918 in this article, 1917 in the English), his marriage to Suzanne Bresseau, the 1926 book On Pre-Islamic Poetry — its Cartesian method, the charge that pre-Islamic poetry was largely fabricated after Islam, the law suits brought by Azhar scholars, his acquittal for want of proof of deliberate insult to the religion, and the book's reissue as On Pre-Islamic Literature with four passages removed — his later visit to the Hijaz and his own words about Mecca and Medina as a Muslim visitor, his presidency of the Academy of the Arabic Language, the Order of the Nile (1965), and honorary doctorates. Read in full on 24 October 2026."
