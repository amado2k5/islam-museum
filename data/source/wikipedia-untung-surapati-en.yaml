reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives him as born Surawiraaji at Gelgel, Bali, about 1660, sold as a slave in Batavia, nicknamed Untung under his owner Moor, imprisoned over Moor's daughter Suzanne, and taught Islam in prison by Wirayuda and Kiai Ebun Jaladirya — the only article read that mentions Islam being taught to him; it also records the name Surapati's Cirebon origin, his service and break with the VOC in 1683-1684, the killing of Captain Tack at Kartasura in 1686, his stronghold at Pasuruan, and his death on 5 December 1706 (lead; the infobox gives the year as circa). It names no school or order for the man himself. Checked 1 November 2026."
