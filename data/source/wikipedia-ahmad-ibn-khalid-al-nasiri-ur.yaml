  en: "The Urdu Wikipedia article on Ahmad ibn Khalid al-Nasiri al-Salawi (1835–1897), the Salé historian considered Morocco's greatest of the 19th century; it describes him as a member of the family that founded the Nasiriyya Sufi order."
