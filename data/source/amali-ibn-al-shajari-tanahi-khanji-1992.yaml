  en: "Amali Ibn al-Shajari, Hibat Allah ibn 'Ali ibn Muhammad ibn Hamza al-Hasani al-'Alawi (450–542 AH) — edition and study by Mahmud Muhammad al-Tanahi, Maktabat al-Khanji, Cairo, 1st edition 1413 AH/1992 CE"
summary:
  ar: "تحقيق محمود الطناحي لأمالي ابن الشجري في ثلاثة أجزاء، أصله رسالة دكتوراه في دار العلوم بجامعة القاهرة نوقشت سنة 1398هـ/1978م، مع دراسة في ثلاثة أبواب: حياة ابن الشجري وعصره، وآراؤه النحوية، وكتاب الأمالي ومنهجه ونسخه؛ والأصل المعتمد نسخة كُتبت سنة 581هـ بعد وفاة المؤلف بتسع وثلاثين سنة."
  en: "Mahmud al-Tanahi's edition of Ibn al-Shajari's Amali in three volumes, growing out of a doctoral thesis at Dar al-'Ulum, Cairo University, defended in 1398 AH/1978 CE. It has a study in three parts: Ibn al-Shajari's life and age, his grammatical views, and the Amali with its method and manuscripts. The base manuscript was copied in 581 AH, thirty-nine years after the author's death."
