label: { ar: "الصواعق المرسلة على الجهمية والمعطلة لابن قيم الجوزية، تحقيق حسين بن عكاشة بن رمضان، دار عطاءات العلم ⁦(نص الكتاب، مسح متصل الترقيم)⁩", en: "al-Sawa'iq al-Mursala of Ibn Qayyim al-Jawziyya, ed. Husayn ibn Ukasha ibn Ramadan, Dar Ata'at al-'Ilm (text of the book, continuously paginated scan)" }
summary:
  ar: "مسح لنص الصواعق المرسلة في طبعة دار عطاءات العلم بتحقيق حسين بن عكاشة بن رمضان، مع مطبوعات مجمع الفقه الإسلامي، يبدأ بخطبة ابن القيم وينتهي بالفهارس، متصل الترقيم في نحو 1300 صفحة، وعلى هوامشه رموز النسخ الخطية وأرقام أوراقها."
  en: "A scan of the text of al-Sawa'iq al-Mursala in the Dar Ata'at al-'Ilm printing edited by Husayn ibn Ukasha ibn Ramadan (with the publications of the Islamic Fiqh Academy), from Ibn al-Qayyim's preface to the indexes, continuously paginated in about 1,300 pages, with the manuscript sigla and folio numbers in the apparatus."
  es: "Un escaneo del texto de al-Sawa'iq al-Mursala en la edición de Dar Ata'at al-'Ilm editada por Husayn ibn Ukasha ibn Ramadan (con las publicaciones de la Academia Islámica de Fiqh), desde el prefacio de Ibn al-Qayyim hasta los índices, paginado de forma continua en aproximadamente 1300 páginas, con las signaturas manuscritas y los números de folio en el aparato crítico."
  fr: "Une numérisation du texte d'al-Sawa'iq al-Mursala dans l'édition Dar Ata'at al-'Ilm éditée par Husayn ibn Ukasha ibn Ramadan (avec les publications de l'Académie islamique de Fiqh), depuis la préface d'Ibn al-Qayyim jusqu'aux index, paginé en continu sur environ 1 300 pages, avec le sigle du manuscrit et les numéros de folio dans l'apparat."
  ur: "دار عطاء العلم طباعت میں السواعق المرسلا کے متن کا ایک سکین جو حسین بن عکاشہ بن رمضان ⁦(اسلامک فقہ اکیڈمی کی اشاعتوں کے ساتھ)⁩ کی تدوین میں ہے، ابن القیم کے دیباچے سے لے کر اشاریہ جات تک، مسلسل صفحہ نمبر 1،30 کے ساتھ صفحہ نمبر 1،30 میں صفحہ بند ہے۔ اپریٹس"
  tr: "Hüseyin bin Ukaşa bin Ramazan tarafından düzenlenen Dar At'at Al-Ilm baskısında Al-Sawa'iq Al-Mursalah metninin bir incelemesi, İslami Fiqh Akademisi'nden yayınlar içermektedir. İbn el-Kayyim'in vaazıyla başlar ve yaklaşık 1300 sayfalık dizinlerle sona erer; kenar boşluklarında el yazmalarının sembolleri ve sayfa numaraları yer alır."
  id: "Survei teks Al-Sawa'iq Al-Mursalah dalam edisi Dar At'at Al-Ilm, yang disunting oleh Hussein bin Ukasha bin Ramadan, dengan publikasi dari Akademi Fiqh Islam. Dimulai dengan khotbah Ibn al-Qayyim dan diakhiri dengan indeks, bernomor sekitar 1300 halaman, dengan margin berisi simbol manuskrip dan nomor halamannya."
