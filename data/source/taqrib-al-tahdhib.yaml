summary:
  ar: "تقريب التهذيب لابن حجر العسقلاني ⁦(ت 852هـ)⁩، مختصر تهذيب التهذيب مرتب على حروف أسماء الرواة يذكر فيه درجة كل راوٍ وطبقته وسنة وفاته؛ المسح المحلي يشمل التراجم كاملة على الترتيب الأبجدي."
  en: "Ibn Hajar al-Asqalani's (d. 852 AH) Taqrib al-Tahdhib, the abridged alphabetical register of hadith transmitters giving each narrator's grade, generation-layer and death year; the local scan covers the entries in alphabetical order."
  es: "El Taqrib al-Tahdhib de Ibn Hajar al-Asqalani (fallecido en 852 AH) es un registro alfabético abreviado de transmisores de hadices que indica el grado, la generación y el año de fallecimiento de cada narrador; el escaneo local muestra las entradas en orden alfabético."
  fr: "Le Taqrib al-Tahdhib d'Ibn Hajar al-Asqalani (mort en 852 AH), le registre alphabétique abrégé des transmetteurs de hadiths donnant à chaque narrateur le grade, la génération et l'année de décès; le scan local couvre les entrées par ordre alphabétique."
  ur: "ابن حجر العسقلانی کی ⁦(متوفی 852ھ)⁩ تکریب التہذیب، حدیث کی ترسیل کرنے والوں کا مختصر حروف تہجی کا رجسٹر جس میں ہر راوی کا درجہ، نسل کی تہہ اور سال وفات؛ مقامی اسکین حروف تہجی کی ترتیب میں اندراجات کا احاطہ کرتا ہے۔"
  tr: "İbn Hajar al-Asqalani'nin (ö. 852 H yılı) Tahdhib al-Tahdhib'in kısaltılmış bir eseri, anlatıcıların isimlerine göre alfabetik sırada her anlatıcının rütbesi, sınıfı ve ölüm yılı belirtilmiştir; yerel derleme, alfabetik sırayla tam biyografileri içerir."
  id: "Taqrib al-Tahdhib oleh Ibn Hajar al-Asqalani (wafat 852 H), sebuah ringkasan dari Tahdhib al-Tahdhib, yang disusun secara alfabetis berdasarkan nama narator, menyebutkan pangkat, kelas, dan tahun kematian setiap narator; survei lokal mencakup biografi lengkap dalam urutan alfabetis."
