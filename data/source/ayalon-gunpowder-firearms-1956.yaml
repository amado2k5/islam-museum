label: { ar: "أيالون، البارود والأسلحة النارية في المملكة المملوكية ⁦(1956)⁩", en: "Ayalon, Gunpowder and Firearms in the Mamluk Kingdom ⁦(1956)⁩", ur: "ایالون، مملوک سلطنت میں بارود اور اسلحہ ناری ⁦(1956)⁩" }
summary:
  ar: "دراسة ديفيد أيالون المرجعية في تاريخ البارود والأسلحة النارية بسلطنة المماليك: يتتبع ألفاظ المدفع والنافع والبارود في المصادر المملوكية، ويؤرخ دخول المدافع والأسلحة اليدوية إلى الجيش المملوكي ومقاومة المؤسسة العسكرية لها."
  en: "David Ayalon's classic study of gunpowder and firearms in the Mamluk Sultanate: traces the terms midfa, naffat and barud in Mamluk sources, dates the entry of cannon and handguns into the Mamluk army, and documents the military establishment's resistance to firearms."
  es: "El estudio clásico de David Ayalon sobre la pólvora y las armas de fuego en el Sultanato mameluco: rastrea los términos midfa, naffat y barud en fuentes mamelucas, fecha la entrada de cañones y pistolas en el ejército mameluco y documenta la resistencia de la cúpula militar a las armas de fuego."
  fr: "L'étude classique de David Ayalon sur la poudre à canon et les armes à feu dans le sultanat mamelouk: retrace les termes midfa, naffat et barud dans les sources mameloukes, date l'introduction des canons et des armes de poing dans l'armée mamelouke et documente la résistance de l'establishment militaire aux armes à feu."
  ur: "مملوک سلطنت میں بارود اور آتشیں اسلحے کے بارے میں ڈیوڈ آیالون کا کلاسیکی مطالعہ: مملوک کے ذرائع میں مڈفا، نفت اور بارود کی اصطلاحات کا پتہ لگاتا ہے، مملوک فوج میں توپ اور ہینڈ گن کے داخلے کی تاریخیں، اور آتشیں اسلحے کے خلاف فوجی اسٹیبلشمنٹ کی مزاحمت کو دستاویز کرتا ہے۔"
  tr: "David Ayalon'un Memlük Sultanlığı'nda Barut ve Ateşli Silahların Tarihi Üzerine Referans Çalışması: Memlük kaynaklarında top, nafi' ve barut terimlerini izler ve topların Memlük ordusuna girişini ve askeri kurumun bunlara karşı direnişini kronikleşir."
  id: "Studi Referensi David Ayalon tentang Sejarah Bubuk Mesiu dan Senjata Api di Kesultanan Mamluk: Studi ini menelusuri istilah meriam, nafi', dan bubuk mesiu dalam sumber Mamluk, serta mendokumentasikan pengenalan meriam dan pistol ke dalam tentara Mamluk serta perlawanan institusi militer terhadapnya."
title: "Gunpowder and Firearms in the Mamluk Kingdom: A Challenge to a Mediaeval Society"
