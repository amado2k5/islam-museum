summary:
  ar: "مقالة ويكيبيديا العربية عن مصطفى الزرقا، وهي المقالة الوحيدة عنه في أي لغة؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في حلب سنة 1322هـ/1904، وأسرته العلمية الحنفية، ودراسته وشيوخه، وتدريسه ونيابته ووزارتيه، وجائزة الملك فيصل سنة 1404هـ/1984، ووفاته في الرياض في 19 ربيع الأول 1420هـ الموافق 3 يوليو 1999."
  en: "Arabic Wikipedia article on Mustafa al-Zarqa — the only Wikipedia article on him in any language; used for entity facts only. It gives his birth at Aleppo in 1322 AH/1904, his Hanafi scholarly family, his studies and teachers, his teaching posts, deputyship and ministries, the King Faisal Prize of 1404 AH/1984, and his death at Riyadh on 19 Rabi' al-Awwal 1420 AH (3 July 1999)."
  es: "Artículo en árabe de la Wikipedia sobre Mustafa al-Zarqa: el único artículo de Wikipedia sobre él en cualquier idioma; se utiliza únicamente para datos sobre la persona. Describe su nacimiento en Alepo en 1322 AH/1904, su familia de eruditos hanafíes, sus estudios y maestros, sus cargos docentes, su vicepresidencia y ministerios, el Premio Rey Faisal de 1404 AH/1984 y su muerte en Riad el 19 de Rabi' al-Awwal de 1420 AH (3 de julio de 1999)."
  fr: "Article Wikipédia en arabe sur Mustafa al-Zarqa — le seul article Wikipédia le concernant, toutes langues confondues; utilisé uniquement pour des informations factuelles. Il mentionne sa naissance à Alep en 1322 AH/1904, sa famille d'érudits hanafites, ses études et ses maîtres, ses postes d'enseignement, ses fonctions de député et ses ministères, le prix du roi Fayçal de 1404 AH/1984 et son décès à Riyad le 19 Rabi' al-Awwal 1420 AH (3 juillet 1999)."
  ur: "مصطفیٰ الزرقا پر عربی ویکیپیڈیا مضمون — کسی بھی زبان میں ان پر واحد ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی ولادت حلب میں 1322ھ/1904ء میں ہوئی، ان کا حنفی علمی خاندان، ان کے علوم اور اساتذہ، ان کے تدریسی عہدے، نائب اور وزارتیں، 1404ھ/1984 کا شاہ فیصل انعام، اور ان کی وفات 19 ربیع الاول ⁦(14399 ہجری)⁩ کو ریاض میں ہوئی۔"
  tr: "Mustafa Al-Zarqa hakkında herhangi bir dilde tek makale olan Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. 1322 Hicri/1904'te Halep'teki doğumundan, Hanefi alim ailesinden, eğitimlerinden, öğretmenliklerinden, öğretmenliklerinden, vekilliklerinden ve bakanlıklarından, 1404 Hicri/1984'te Kral Faysal Ödülü'nden ve 19 Rabi'al-Awwal 1420 H.'de Riyad'da ölümünden bahseder; bu tarih 3 Temmuz 1999'a karşılık gelir."
  id: "Artikel Wikipedia berbahasa Arab tentang Mustafa Al-Zarqa, yang merupakan satu-satunya artikel tentangnya dalam bahasa apa pun; hanya digunakan untuk fakta entitas tersebut. Artikel ini menyebutkan kelahirannya di Aleppo pada tahun 1322 H/1904, keluarga ilmunya yang berbakat Hanafi, studinya, guru, pengajaran, jabatan wakil, dan pelayanannya, Hadiah Raja Faisal pada tahun 1404 H/1984, serta kematiannya di Riyadh pada 19 Rabi' al-Awwal 1420 H, yang bertepatan dengan 3 Juli 1999."
