summary:
  ar: "مقالة ويكيبيديا العربية عن مصطفى الزرقا، وهي المقالة الوحيدة عنه في أي لغة؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في حلب سنة 1322هـ/1904، وأسرته العلمية الحنفية، ودراسته وشيوخه، وتدريسه ونيابته ووزارتيه، وجائزة الملك فيصل سنة 1404هـ/1984، ووفاته في الرياض في 19 ربيع الأول 1420هـ الموافق 3 يوليو 1999."
  en: "Arabic Wikipedia article on Mustafa al-Zarqa — the only Wikipedia article on him in any language; used for entity facts only. It gives his birth at Aleppo in 1322 AH/1904, his Hanafi scholarly family, his studies and teachers, his teaching posts, deputyship and ministries, the King Faisal Prize of 1404 AH/1984, and his death at Riyadh on 19 Rabi' al-Awwal 1420 AH (3 July 1999)."
