summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ضياء كوك ألب؛ تُستخدم لوقائع الكيان فقط حيث تستشهد المقالة بمصدر. تؤرخ ميلاده في 23 مارس 1876 بديار بكر ووفاته في 25 أكتوبر 1924 بإسطنبول، وتفصّل مساره في جمعية الاتحاد والترقي ومنفاه إلى مالطا وفكره القومي وتأثيره في الكمالية."
  en: "English Wikipedia article on Ziya Gökalp; used for entity facts only where the article cites a source. It dates his birth to 23 March 1876 at Diyarbakır and his death to 25 October 1924 at Istanbul, and details his Committee of Union and Progress career, his Malta exile, his nationalist thought and his influence on Kemalism."
  es: "Artículo de la Wikipedia en inglés sobre Ziya Gökalp; se utiliza únicamente para datos sobre la persona cuando el artículo cita una fuente. En él se fecha su nacimiento el 23 de marzo de 1876 en Diyarbakır y su muerte el 25 de octubre de 1924 en Estambul, y se detalla su trayectoria en el Comité de Unión y Progreso, su exilio en Malta, su pensamiento nacionalista y su influencia en el kemalismo."
  fr: "Article de Wikipédia en anglais sur Ziya Gökalp; utilisé uniquement pour les informations factuelles relatives à l’entité, lorsque l’article cite une source. Il situe sa naissance le 23 mars 1876 à Diyarbakır et sa mort le 25 octobre 1924 à Istanbul, et détaille son parcours au sein du Comité Union et Progrès, son exil à Malte, sa pensée nationaliste et son influence sur le kémalisme."
  ur: "Ziya Gökalp پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے جہاں مضمون کسی ماخذ کا حوالہ دیتا ہے۔ اس میں ان کی پیدائش 23 مارچ 1876 کو دیار باقر میں اور اس کی موت 25 اکتوبر 1924 کو استنبول میں ہے، اور اس کی کمیٹی آف یونین اینڈ پروگریس کیریئر، اس کی مالٹا جلاوطنی، اس کی قوم پرست سوچ اور کمالیت پر اس کے اثرات کی تفصیلات بتائی گئی ہیں۔"
  tr: "Diyaya Kok Alp hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır, çünkü makalede kaynak gösterilmiştir. 23 Mart 1876'da Diyarbakır'da doğmuş ve 25 Ekim 1924'te İstanbul'da vefat etmiştir; Birlik ve İlerleme Derneği'ndeki yolunu, Malta'ya sürgününü, milliyetçi düşüncesini ve Kemalizm üzerindeki etkisini detaylandırmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Diyaya Kok Alp; digunakan hanya untuk fakta entitas, karena artikel tersebut mengutip sumbernya. Ia lahir pada 23 Maret 1876 di Diyarbakır dan meninggal pada 25 Oktober 1924 di Istanbul, menceritakan perjalanannya di Union and Progress Association, pengasingannya ke Malta, pemikiran nasionalisnya, dan pengaruhnya terhadap Kemalisme."
