  ar: "مقالة ويكيبيديا الإنجليزية عن ضياء كوك ألب؛ تُستخدم لوقائع الكيان فقط حيث تستشهد المقالة بمصدر. تؤرخ ميلاده في 23 مارس 1876 بديار بكر ووفاته في 25 أكتوبر 1924 بإسطنبول، وتفصّل مساره في جمعية الاتحاد والترقي ومنفاه إلى مالطا وفكره القومي وتأثيره في الكمالية."
  en: "English Wikipedia article on Ziya Gökalp; used for entity facts only where the article cites a source. It dates his birth to 23 March 1876 at Diyarbakır and his death to 25 October 1924 at Istanbul, and details his Committee of Union and Progress career, his Malta exile, his nationalist thought and his influence on Kemalism."
