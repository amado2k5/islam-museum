reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A long, well-referenced article (Parla, Kieser, Uzer, Jongerden among its sources). It covers his birth at Diyarbakır to Muhammad Tefvik Bey and Zeliha Hanım, the debate over his family's origins and his own answer that nationality rests on upbringing, his 1895 suicide attempt, his veterinary studies and ten months in prison, the founding of the Diyarbakır CUP office in July 1908, Genç Kalemler at Salonica, his move to Istanbul in 1912, his Malta exile of 1919–1921 during which he drafted The Principles of Turkism (1923), his return, his education-committee work and death on 25 October 1924; his thought — the rejection of Ottomanism and Islamism for Turkish nationalism under Durkheim's influence, the Turkification programme, the three stages of Turkist identity, the formula of Turkification, Islamization and Westernization (via Seyhun), and, via Alp Eren Topal, the neglected influence of Sufism and his admiration for the Naqshbandiyya's solidarity and for Ibn Arabi's idealism; and his legacy, including the opposed readings of his Turanism (Parla) and the suggestion by some historians that his nationalism contributed to the context of the Armenian genocide. It names no madhhab for him. Read in full on 24 October 2026."
