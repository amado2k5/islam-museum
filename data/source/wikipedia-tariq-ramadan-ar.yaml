summary:
  ar: "مقالة ويكيبيديا العربية عن طارق رمضان؛ تُستخدم لوقائع الكيان فقط. توثّق أسرته — سعيد رمضان ووفاء البنا ابنة مؤسس الإخوان المسلمين — وميلاده في جنيف سنة 1962، وشقيقه هاني مدير المركز الإسلامي في جنيف."
  en: "Arabic Wikipedia article on Tariq Ramadan; used for entity facts only. It records his family — Said Ramadan and Wafa al-Banna, daughter of the Muslim Brotherhood's founder — his birth in Geneva in 1962, and his brother Hani, director of the Islamic Centre of Geneva."
  es: "Artículo en árabe de la Wikipedia sobre Tariq Ramadan; se utiliza únicamente para obtener información sobre la persona. En él se mencionan su familia —Said Ramadan y Wafa al-Banna, hija del fundador de los Hermanos Musulmanes—, su nacimiento en Ginebra en 1962 y su hermano Hani, director del Centro Islámico de Ginebra."
  fr: "Article de Wikipédia en arabe sur Tariq Ramadan; utilisé uniquement à des fins d'information sur l'entité. Il mentionne sa famille — Said Ramadan et Wafa al-Banna, fille du fondateur des Frères musulmans — sa naissance à Genève en 1962 et son frère Hani, directeur du Centre islamique de Genève."
  ur: "طارق رمضان پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے خاندان — سید رمضان اور اخوان المسلمون کے بانی کی بیٹی وفا البنا — ان کی پیدائش 1962 میں جنیوا میں ہوئی، اور ان کے بھائی ہانی، جنیوا کے اسلامک سنٹر کے ڈائریکٹر کا ریکارڈ ہے۔"
  tr: "Tariq Ramazan hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Ailesi — Saeed Ramazan ve Müslüman Kardeşler'in kurucusunun kızı Wafaa al-Banna, 1962'de Cenevre'de doğduğunu ve Cenevre'deki İslam Merkezi'nin direktörü olan kardeşi Hani belgelemektedir."
  id: "Artikel Wikipedia Arab tentang Tariq Ramadan; hanya digunakan untuk fakta entitas. Keluarganya — Saeed Ramadan dan Wafaa al-Banna, putri pendiri Ikhwanul Muslimin — mendokumentasikan kelahirannya di Jenewa pada tahun 1962, dan saudaranya Hani, direktur Pusat Islam di Jenewa."
