  ar: "مقالة ويكيبيديا العربية عن أحمد ياسين؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في الجورة في 28 يونيو 1936 ووفاته في 22 مارس 2004، وتروي تعليمه وعمله ونشاطه الدعوي وتأسيسه حماس وسجنه واغتياله، ويقرأ حقل المذهب في صندوق معلوماتها «أهل السنة والجماعة» — قيمة صندوق وحيدة."
