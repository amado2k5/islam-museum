reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth in 1710 at Fez (its lead names Meknes against its own biographical section), his reign from 20 Safar 1171 AH, his death on 24 Rajab 1204 AH (9 April 1790) — at Meknes in its infobox and biographical section, at Ain Atiq near Rabat in its death section — his education under his grandmother Khannatha bint Bakkar, his taking of the Nasiri tariqa at Marrakesh, his wars and building works, and a creed section quoting his reported saying 'I am Maliki in madhhab, Wahhabi in creed' from Charles-André Julien's history. Its infobox pairs his birth year 1710 with 1134 AH, an inconsistent pairing, since 1134 AH falls in 1721–1722. Checked 1 November 2026."
