summary:
  ar: "الطبعة السنوية من كتاب «المسلمون الخمسمئة» الصادرة عن المركز الملكي للدراسات والبحوث والدراسات الإسلامية الاستراتيجية في عمّان؛ مرجع قوائم وتراجم الشخصيات في سجلات موجة ulama-m500-final."
  en: "The annual edition of The Muslim 500 published by the Royal Islamic Strategic Studies Centre (RISSC) in Amman; the reference for the list entries and profiles behind the ulama-m500-final wave records."
  es: "La edición anual de The Muslim 500, publicada por el Centro Real de Estudios Estratégicos Islámicos (RISSC) en Amán; la referencia para las entradas de la lista y los perfiles que respaldan los récords de la ola final de ulama-m500."
  fr: "L'édition annuelle de The Muslim 500 publiée par le Centre royal d'études stratégiques islamiques (RISSC) à Amman; la référence pour les entrées de la liste et les profils derrière les records de la vague finale ulama-m500."
  ur: "عمان میں رائل اسلامک اسٹریٹجک اسٹڈیز سینٹر (RISSC) کی طرف سے شائع ہونے والا مسلم 500 کا سالانہ ایڈیشن؛ ulama-m500-final wave ریکارڈز کے پیچھے فہرست اندراجات اور پروفائلز کا حوالہ۔"
  tr: "Amman'daki Kraliyet İslami Çalışmalar, Araştırma ve Stratejik Çalışmalar Merkezi tarafından yayımlanan \"Beş Yüz Müslüman\" adlı kitabın yıllık baskısı; ULAMA-M500-Final dalgasının kayıtlarındaki kişiliklerin listeleri ve biyografileri için bir referans."
  id: "Edisi tahunan buku \"Lima Ratus Muslim\" yang diterbitkan oleh Pusat Kerajaan untuk Studi Islam, Penelitian, dan Studi Strategis di Amman; referensi untuk daftar dan biografi tokoh dalam catatan gelombang ULAMA-M500-Final."
