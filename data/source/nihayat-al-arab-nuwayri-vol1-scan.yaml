summary:
  en: "Volume 1 of al-Nuwayri's encyclopaedia of adab, as a scan on archive.org (item nefa01). Its first art covers the heavens, the earth, times, plants and animals, and the chapter on days, nights, months and feasts gathers the sayings and verses about time. Read so far: the chapter on days and the verses on the day."
  ar: "الجزء الأول من موسوعة النويري في الأدب، نسخة ممسوحة على الأرشيف ⁦(المعرّف nefa01)⁩. يتناول فنه الأول السماء والأرض والأزمنة والنبات والحيوان، ويجمع باب الليالي والأيام والشهور والمواسم أقوال الناس والأبيات فيها. قُرئ حتى الآن باب الأيام وأبيات الوصف."
  es: "Volumen 1 de la enciclopedia de adab de al-Nuwayri, escaneado en archive.org (elemento nefa01). Su primer capítulo abarca los cielos, la tierra, el tiempo, las plantas y los animales, y el capítulo sobre los días, las noches, los meses y las fiestas recopila dichos y versículos sobre el tiempo. Leído hasta ahora: el capítulo sobre los días y los versículos sobre el día."
  fr: "Le premier volume de l'encyclopédie d'adab d'al-Nuwayri, disponible en version numérisée sur archive.org (référence nefa01), aborde dans sa première partie les thèmes du ciel, de la terre, du temps, des plantes et des animaux. Le chapitre consacré aux jours, aux nuits, aux mois et aux fêtes rassemble les hadiths et les versets relatifs au temps. Lecture effectuée jusqu'à présent: le chapitre sur les jours et les versets s'y rapportant."
  ur: "النویری کے انسائیکلوپیڈیا آف ادب کا جلد 1، بطور اسکین آرکائیو ڈاٹ آر جی ⁦(آئٹم nefa01)⁩۔ اس کا پہلا فن آسمانوں، زمین، اوقات، پودوں اور جانوروں کا احاطہ کرتا ہے اور دنوں، راتوں، مہینوں اور عیدوں کے باب میں وقت کے بارے میں اقوال اور آیات کو جمع کیا گیا ہے۔ اب تک پڑھیں: ایام کا باب اور دن کی آیات۔"
