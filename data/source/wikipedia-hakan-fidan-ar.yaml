summary:
  ar: "مقالة ويكيبيديا العربية عن هاكان فيدان ⁦(وُلد في 17 تموز 1968)⁩، وزير خارجية تركيا منذ 2023 ورئيس استخباراتها السابق؛ تذكر أباه الكردي من فان وأمه التركية من دنيزلي ودراساته ودوره في محادثات السلام الكردية ومحاولة انقلاب 2016."
  en: "Arabic Wikipedia article on Hakan Fidan (born 17 July 1968), Turkey's foreign minister since 2023 and former intelligence director; it records his Kurdish father from Van and Turkish mother from Denizli, his studies, his role in the Kurdish peace talks and the 2016 coup attempt."
  es: "Artículo en árabe de la Wikipedia sobre Hakan Fidan (nacido el 17 de julio de 1968), ministro de Asuntos Exteriores de Turquía desde 2023 y exdirector de inteligencia; en él se menciona a su padre kurdo de Van y a su madre turca de Denizli, sus estudios, su papel en las conversaciones de paz kurdas y el intento de golpe de Estado de 2016."
  fr: "Article de Wikipédia en arabe sur Hakan Fidan (né le 17 juillet 1968), ministre des Affaires étrangères de la Turquie depuis 2023 et ancien directeur du renseignement; il relate ses origines: un père kurde de Van et une mère turque de Denizli, ses études, son rôle dans les pourparlers de paix kurdes et la tentative de coup d'État de 2016."
  ur: "Hakan Fidan ⁦(پیدائش 17 جولائی 1968)⁩ پر عربی ویکیپیڈیا مضمون، 2023 سے ترکی کے وزیر خارجہ اور سابق انٹیلی جنس ڈائریکٹر؛ اس میں وان سے اس کے کرد باپ اور ڈینیزلی سے ترک ماں، اس کی پڑھائی، کرد امن مذاکرات میں اس کے کردار اور 2016 کی بغاوت کی کوشش کو ریکارڈ کیا گیا ہے۔"
