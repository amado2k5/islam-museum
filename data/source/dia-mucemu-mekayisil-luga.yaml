reliability_note: "Read in the museum's session on 20 November 2026. It says Ibn Faris tried in this dictionary to prove two theories: that triliteral roots hold basic meanings (maqayis) from which the derived words come, and that roots of more than three letters are mostly artificial words blended from several words (manhut); that his preface names al-Khalil's Kitab al-Ayn and Ibn Durayd's al-Jamhara, which he calls the two Kitabs, as his chief sources; and that he credits the idea of basic meanings to al-Khalil. Used for entity facts only."
