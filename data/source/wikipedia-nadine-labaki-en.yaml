reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Covers: birth as Nadine Antoine Labaki on 18 February 1974 in Baabdat to Maronite parents Antoine and Antoinette Labaki — the article names her parents' religion only, never a religion for Labaki herself; her first seventeen years in wartime Lebanon, three years in Montreal from 1989 and Canadian citizenship; a degree in audiovisual studies at Saint Joseph University in Beirut and the graduation film 11 Rue Pasteur (1997); music videos and advertisements; Caramel (2007, Cannes Directors' Fortnight); Where Do We Go Now? (2011, Cannes Un Certain Regard, Toronto People's Choice Award); Capernaum (2018, Cannes Jury Prize, Oscar nomination as the first female Arab director so nominated); her marriage to Khaled Mouzanar in 2007 and their two children; and her 2016 Beirut Madinati candidacy. It states no religion for her personally."
