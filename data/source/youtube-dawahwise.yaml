  tr: "Mansour ve Hashem tarafından yönetilen YouTube'daki 'DawahWise' kanalı (@DawahWise), Londra'daki Hyde Park'taki Vaizler Köşesi'nden tartışmaları, canlı yayınları ve dinlerarası sohbet programlarını yayınlamaktadır."
