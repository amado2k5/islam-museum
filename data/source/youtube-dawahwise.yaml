  ar: "قناة «دعوة وايز» (DawahWise) على يوتيوب (@DawahWise)؛ يديرها منصور وهاشم، وتنشر مناظرات ركن الخطباء في هايد بارك بلندن وبثوثا مباشرة وبرامج حوارية بين الأديان."
  en: "The DawahWise YouTube channel (@DawahWise), run by Mansur and Hashim; it publishes Speakers' Corner debates from London's Hyde Park, live streams and interfaith discussion programmes."
