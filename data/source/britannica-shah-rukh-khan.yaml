  ar: "مدخل موسوعة بريتانيكا عن شاه روخ خان؛ يؤكد ميلاده في دلهي سنة 1965 ومسيرته وجوائزه، ويوثّق احتجازاته للفحص الثانوي في مطارات أمريكية (2009 و2012 و2016) وانتقاده سنة 2015 لوصفه الهند بأنها «غير متسامحة» وقضية اعتقال ابنه آريان سنة 2021 وتبرئته لاحقًا."
  en: "Encyclopaedia Britannica entry on Shah Rukh Khan; it confirms his 1965 Delhi birth, career and awards, and documents his detentions for secondary screening at U.S. airports (2009, 2012 and 2016), the 2015 criticism of his describing India as 'intolerant', and his son Aryan's 2021 arrest and later clearing."
