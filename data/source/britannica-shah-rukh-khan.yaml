reliability_note: "Reference entry read in full on 25 October 2026. It gives his birth on 2 November 1965 at Delhi, the economics degree at Hans Raj College (1988), the dropped-out master's in mass communication at Jamia Millia Islamia, the theatre and television start (Fauji, 1988; Circus, 1989), the film debut Deewana (1992), the antihero phase, the romantic-hero ascendancy of DDLJ (1995), the acclaimed performances (Swades, Chak De! India, My Name Is Khan, Dear Zindagi, Raees), the 2018–2023 break after Jab Harry Met Sejal and Zero, and the 2023 comeback of Pathaan, Jawan and Dunki, with Jawan addressing corruption and Dunki illegal 'donkey flight' migration; the Padma Shri (2005); the 2025 National Film Award for best actor for Jawan, shared with Vikrant Massey; eight Filmfare best-actor awards, the record shared with Dilip Kumar; TIME 100 (2023); the Met Gala debut (2025); and the co-ownership with his wife Gauri of Red Chillies Entertainment and, from 2008, of the Kolkata Knight Riders. Its controversies section records that he was detained at U.S. airports on three occasions (2009 Newark; 2012 Westchester County; 2016 Los Angeles) for secondary screening, allegedly because his name matched an entry on a terror watch list; that in 2015 he was widely criticised for describing India as 'intolerant' in an interview; and that in 2021 his son Aryan was arrested in a drug case, released on bail after nearly a month, and later cleared of all charges. The entry names no religion or school for Khan himself."
