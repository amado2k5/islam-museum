summary:
  ar: "مدخل موسوعة بريتانيكا عن شاه روخ خان؛ يؤكد ميلاده في دلهي سنة 1965 ومسيرته وجوائزه، ويوثّق احتجازاته للفحص الثانوي في مطارات أمريكية ⁦(2009 و2012 و2016)⁩ وانتقاده سنة 2015 لوصفه الهند بأنها «غير متسامحة» وقضية اعتقال ابنه آريان سنة 2021 وتبرئته لاحقًا."
  en: "Encyclopaedia Britannica entry on Shah Rukh Khan; it confirms his 1965 Delhi birth, career and awards, and documents his detentions for secondary screening at U.S. airports (2009, 2012 and 2016), the 2015 criticism of his describing India as 'intolerant', and his son Aryan's 2021 arrest and later clearing."
  es: "Entrada de la Enciclopedia Británica sobre Shah Rukh Khan; confirma su nacimiento en Delhi en 1965, su trayectoria profesional y sus premios, y documenta sus detenciones para controles secundarios en aeropuertos estadounidenses (2009, 2012 y 2016), las críticas de 2015 por describir a la India como \"intolerante\", y el arresto de su hijo Aryan en 2021 y su posterior absolución."
  fr: "L'article de l'Encyclopædia Britannica sur Shah Rukh Khan confirme sa naissance à Delhi en 1965, sa carrière et ses récompenses, et documente ses détentions pour contrôle secondaire dans les aéroports américains (2009, 2012 et 2016), les critiques de 2015 concernant sa description de l'Inde comme « intolérante », et l'arrestation de son fils Aryan en 2021 puis sa libération ultérieure."
  ur: "شاہ رخ خان پر انسائیکلوپیڈیا برٹانیکا کا اندراج؛ یہ اس کی دہلی میں 1965 کی پیدائش، کیریئر اور ایوارڈز کی تصدیق کرتا ہے، اور امریکی ہوائی اڈوں ⁦(2009، 2012 اور 2016)⁩ پر ثانوی اسکریننگ کے لیے ان کی حراستوں، 2015 میں ہندوستان کو 'عدم برداشت' کے طور پر بیان کرنے پر تنقید، اور اس کے بیٹے آرین کی 2021 میں گرفتاری اور بعد میں کلیئر ہونے کی دستاویز کرتا ہے۔"
  tr: "Encyclopaedia Britannica'daki Shah Rukh Khan hakkındaki madde, onun 1965'te Delhi'de doğduğunu, kariyerini ve ödüllerini doğruluyor; Amerikan havaalanlarında ikincil tarama için aldığı gözaltıları (2009, 2012 ve 2016), 2015'te Hindistan'ı 'hoşgörüsüz' olarak tanımlaması nedeniyle eleştirisi ve oğlu Aryan'ın 2021'de tutuklanması ve sonrasında beraat etmesi vakasını belgeliyor."
  id: "Entri dalam Encyclopaedia Britannica tentang Shah Rukh Khan mengonfirmasi kelahirannya di Delhi pada tahun 1965, kariernya, dan penghargaan yang diterimanya, mendokumentasikan penahanannya untuk pemeriksaan sekunder di bandara-bandara Amerika (2009, 2012, dan 2016), kritiknya pada 2015 karena menggambarkan India sebagai 'tidak toleran,' serta kasus penangkapan putranya Aryan pada 2021 dan pembebasannya kemudian."
