reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 31 October 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). It gives his reign as c. 1514–1530, the conquests of Daya (1520), Pidie (1521) and Pasai (1524), and his death at Banda Aceh on 7 August 1530 on the testimony of his gravestone, against chronicle variants of 1511 and 1522; its infobox gives his religion as Islam and classes his year of birth as unknown. Caution: the infobox also carries a duplicated second reign block (a 'Meukuta Alam' reign from 1495) inconsistent with its own text; only the main succession is used."
