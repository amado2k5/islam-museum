summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن سوتان صاهرير (1909–1966)؛ تُستخدم لوقائع الكيان فقط. سيرة مفصّلة تذكر مولده في بادانغ بانجانغ في 5 مارس 1909، ونشاطه الوطني، ورئاسته للوزراء، وحزبه الاشتراكي، وسنواته الأخيرة ووفاته في زيورخ."
  en: "Indonesian Wikipedia article on Sutan Sjahrir (1909–1966); used for entity facts only. A detailed biography giving his birth at Padang Panjang on 5 March 1909, his nationalist activity, his premiership, his socialist party, his final years and his death at Zürich."
  es: "Artículo de la Wikipedia en indonesio sobre Sutan Sjahrir (1909-1966); utilizado únicamente para datos sobre la persona. Una biografía detallada que abarca su nacimiento en Padang Panjang el 5 de marzo de 1909, su actividad nacionalista, su mandato como primer ministro, su partido socialista, sus últimos años y su fallecimiento en Zúrich."
  fr: "Article de Wikipédia indonésien sur Sutan Sjahrir (1909-1966); utilisé uniquement à des fins d'information sur l'entité. Biographie détaillée retraçant sa naissance à Padang Panjang le 5 mars 1909, son engagement nationaliste, son mandat de Premier ministre, son parti socialiste, ses dernières années et sa mort à Zurich."
  ur: "انڈونیشیائی ویکیپیڈیا مضمون سوتان سجحریر (1909–1966) پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 5 مارچ 1909 کو پڈانگ پنجانگ میں ان کی پیدائش، ان کی قوم پرست سرگرمی، اس کی وزارت عظمیٰ، اس کی سوشلسٹ پارٹی، اس کے آخری سال اور زیورخ میں ان کی موت کے بارے میں ایک تفصیلی سوانح حیات۔"
