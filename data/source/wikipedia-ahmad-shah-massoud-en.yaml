summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد شاه مسعود؛ تُستخدم لوقائع الكيان فقط. تروي مولده نحو 1953 في بنجشير لأسرة طاجيكية، ودراسته في هراة وكابل، وتمرد بنجشير 1975، وقيادته للمقاومة ضد السوفيت، ووزارته للدفاع منذ 1992، وقيادته لتحالف الشمال واغتياله في 9 سبتمبر 2001. يقول نصها إنه من «خلفية مسلمة سنية طاجيكية»، ولا يحمل صندوق معلوماتها قيمة للدين."
  en: "English Wikipedia article on Ahmad Shah Massoud; used for entity facts only. It recounts his birth c. 1953 in the Panjshir Valley to a Tajik family, his schooling at Herat and Kabul, the 1975 Panjshir uprising, his command of the resistance against the Soviets, his defence ministry from 1992, his leadership of the Northern Alliance and his assassination on 9 September 2001. Its text says he came from a Tajik Sunni Muslim background; its infobox carries no religion value."
  ur: "احمد شاہ مسعود پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں قریباً 1953ء میں پنجشیر میں ایک تاجک خاندان میں ان کی پیدائش، ہرات اور کابل میں ان کی تعلیم، 1975ء کی پنجشیر بغاوت، سوویتوں کے خلاف مزاحمت کی ان کی قیادت، 1992ء سے ان کی وزارت دفاع، شمالی اتحاد کی قیادت اور 9 ستمبر 2001ء کو ان کا قتل بیان ہوا ہے۔ اس کے متن کے مطابق ان کا تعلق تاجک سنی مسلم پس منظر سے تھا؛ اس کے معلوماتی خانے میں مذہب کی کوئی قدر درج نہیں۔"
