summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد شاه مسعود؛ تُستخدم لوقائع الكيان فقط. تروي مولده نحو 1953 في بنجشير لأسرة طاجيكية، ودراسته في هراة وكابل، وتمرد بنجشير 1975، وقيادته للمقاومة ضد السوفيت، ووزارته للدفاع منذ 1992، وقيادته لتحالف الشمال واغتياله في 9 سبتمبر 2001. يقول نصها إنه من «خلفية مسلمة سنية طاجيكية»، ولا يحمل صندوق معلوماتها قيمة للدين."
  en: "English Wikipedia article on Ahmad Shah Massoud; used for entity facts only. It recounts his birth c. 1953 in the Panjshir Valley to a Tajik family, his schooling at Herat and Kabul, the 1975 Panjshir uprising, his command of the resistance against the Soviets, his defence ministry from 1992, his leadership of the Northern Alliance and his assassination on 9 September 2001. Its text says he came from a Tajik Sunni Muslim background; its infobox carries no religion value."
  ur: "احمد شاہ مسعود پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں قریباً 1953ء میں پنجشیر میں ایک تاجک خاندان میں ان کی پیدائش، ہرات اور کابل میں ان کی تعلیم، 1975ء کی پنجشیر بغاوت، سوویتوں کے خلاف مزاحمت کی ان کی قیادت، 1992ء سے ان کی وزارت دفاع، شمالی اتحاد کی قیادت اور 9 ستمبر 2001ء کو ان کا قتل بیان ہوا ہے۔ اس کے متن کے مطابق ان کا تعلق تاجک سنی مسلم پس منظر سے تھا؛ اس کے معلوماتی خانے میں مذہب کی کوئی قدر درج نہیں۔"
  es: "Artículo de la Wikipedia en inglés sobre Ahmad Shah Massoud; utilizado únicamente para datos sobre la persona. Relata su nacimiento alrededor de 1953 en el valle de Panjshir en el seno de una familia tayika, su educación en Herat y Kabul, el levantamiento de Panjshir de 1975, su liderazgo de la resistencia contra los soviéticos, su ministerio de defensa desde 1992, su liderazgo de la Alianza del Norte y su asesinato el 9 de septiembre de 2001. El texto indica que provenía de una familia tayika musulmana sunita; la ficha informativa no contiene información sobre su religión."
  fr: "Article de Wikipédia en anglais sur Ahmad Shah Massoud; utilisé uniquement pour les informations sur l'entité. Il relate sa naissance vers 1953 dans la vallée du Panjshir, au sein d'une famille tadjike, sa scolarité à Hérat et à Kaboul, le soulèvement du Panjshir de 1975, son commandement de la résistance contre les Soviétiques, son ministère de la Défense à partir de 1992, son rôle à la tête de l'Alliance du Nord et son assassinat le 9 septembre 2001. Le texte indique qu'il était issu d'une famille musulmane sunnite tadjike; son infobox ne mentionne pas sa religion."
  tr: "Ahmad Şah Masud hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Makale, yaklaşık 1953'te Penjşir'de Tacik bir ailede doğmasını, Herat ve Kabil'deki eğitimlerini, 1975 Panjshir isyanını, Sovyetlere karşı direnişi yönetmesini, 1992'den beri Savunma Bakanlığını, Kuzey İttifakı'nın liderliğini ve 9 Eylül 2001'deki suikastını anlatır. Metinde onun \"Sünni Tacik Müslüman geçmişi\" olduğu belirtilir ve bilgi kutusu dini bir değer taşımamaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ahmad Shah Massoud; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya sekitar tahun 1953 di Panjshir dari keluarga Tajik, studinya di Herat dan Kabul, pemberontakan Panjshir tahun 1975, kepemimpinannya dalam perlawanan melawan Soviet, Kementerian Pertahanannya sejak 1992, kepemimpinannya di Aliansi Utara, dan pembunuhannya pada 9 September 2001. Teksnya menyatakan bahwa ia berasal dari \"latar belakang Muslim Sunni Tajik,\" dan kotak informasinya tidak memiliki nilai agama."
