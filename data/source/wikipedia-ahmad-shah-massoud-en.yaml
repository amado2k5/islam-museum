reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 27 October 2026. This writer's fetch route exposed no revision id, so the article is cited by consultation date under the consultation-date fallback and no revision is asserted. The article gives his birth only as c. 1953. Its human-rights section presents the Afshar operation of February 1993 as the major criticism of his record: an Afghanistan Justice Project report describes him as failing to prevent atrocities by his forces and their allies, while Roy Gutman is cited arguing the witness reports implicated only the allied Ittihad forces; both positions are carried in the museum's prose in that attributed balance."
