summary:
  ar: "مقالة ويكيبيديا الأردية عن عبد اللطيف رشيد؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 10 آب 1944 استنادًا إلى سيرته الرسمية ورئاسته للعراق، وتصنّفه ضمن «عراقی سنی مسلم» وهو تصنيف ملفات."
  en: "Urdu Wikipedia article on Abdul Latif Rashid; used for entity facts only. It gives his birth on 10 August 1944, citing his official curriculum vitae, and his presidency of Iraq; it files him under 'Iraqi Sunni Muslims', a category filing, and names no school in its text."
  es: "Artículo de Wikipedia en urdu sobre Abdul Latif Rashid; utilizado únicamente para datos sobre la persona. Indica que nació el 10 de agosto de 1944, cita su currículum vitae oficial y su presidencia de Irak; lo clasifica dentro de la categoría de \"musulmanes sunitas iraquíes\" y no menciona ninguna escuela en su texto."
  fr: "Article de Wikipédia en ourdou sur Abdul Latif Rashid; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 10 août 1944, cite son curriculum vitae officiel, et mentionne sa présidence de l'Irak; il le classe dans la catégorie « Musulmans sunnites irakiens », et ne cite aucune école dans son texte."
  ur: "عبداللطیف راشد پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 10 اگست 1944 کو اپنے سرکاری نصاب کی زندگی اور عراق کی صدارت کا حوالہ دیتے ہوئے کرتا ہے۔ یہ اسے 'عراقی سنی مسلمان' کے تحت فائل کرتا ہے، ایک زمرہ فائلنگ، اور اس کے متن میں کسی اسکول کا نام نہیں ہے۔"
  tr: "Abdul Latif Rashid hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumu, resmi biyografisi ve Irak başkanlığı temelinde 10 Ağustos 1944'te verilmiştir ve 'Sünni Iraklı Müslüman' kategorisi altında sınıflandırılmıştır; bu kategori bir dosya sınıflandırmasıdır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Abdul Latif Rashid; digunakan hanya untuk fakta entitas. Tanggal lahirnya dicatat pada 10 Agustus 1944, berdasarkan biografi resmi dan masa kepresidenannya di Irak, dan ia diklasifikasikan dalam kategori 'Muslim Sunni Irak', yang merupakan klasifikasi berkas."
