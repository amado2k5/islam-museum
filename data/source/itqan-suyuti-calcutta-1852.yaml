label:
  ar: "السيوطي، الإتقان في علوم القرآن ⁦(نشرة سبرنجر ومولوي بشير الدين ونور الحق، كلكتا، مكتبة الهند 1852)⁩"
  en: "al-Suyuti, al-Itqan fi 'Ulum al-Qur'an (ed. A. Sprenger with Maulawi Bashir al-Din and Nur al-Haqq, Calcutta, Bibliotheca Indica, 1852)"
  ur: "سیوطی، الاتقان فی علوم القرآن ⁦⁦(ایڈیٹر اے۔ سپرنگر بمع مولوی بشیر الدین و نور الحق، کلکتہ، بیبلیوتھیکا انڈیکا 1852)⁩⁩"
summary:
  ar: "نشرة كلكتا الأولى من «الإتقان في علوم القرآن» لجلال الدين السيوطي ⁦(ت 911هـ)⁩ في سلسلة «مكتبة الهند» بإشراف جمعية آسيا البنغالية، عُني بها ألويس سبرنجر ومولوي بشير الدين ومولوي نور الحق؛ وفيها فصول عن الأحرف السبعة والقراءات والقراء من الصحابة والتابعين وعن جمع المصحف ورسمه ونقطه وشكله."
  en: "The first Calcutta printing of Jalal al-Din al-Suyuti's (d. 911 AH) al-Itqan fi 'Ulum al-Qur'an in the Bibliotheca Indica series of the Asiatic Society of Bengal, edited by Aloys Sprenger with Maulawi Bashir al-Din and Nur al-Haqq; it holds chapters on the seven ahruf, the readings, the Companions and Successors who taught the Qur'an, and the collection, orthography, dotting and vowelling of the mushaf."
  ur: "جلال الدین سیوطی ⁦(م 911ھ)⁩ کی «الاتقان فی علوم القرآن» کی کلکتہ کی پہلی طباعت، بنگال ایشیاٹک سوسائٹی کی «بیبلیوتھیکا انڈیکا» سلسلے میں، ایڈیٹر الوئس سپرنگر بمع مولوی بشیر الدین و مولوی نور الحق؛ اس میں سات احرف، قراءات، قرآن پڑھانے والے صحابہ و تابعین، اور مصحف کی جمع، رسم، نقط و شکل کے ابواب ہیں۔"
  es: "La primera edición impresa en Calcuta de al-Itqan fi 'Ulum al-Qur'an de Jalal al-Din al-Suyuti (fallecido en el año 911 de la Hégira) en la serie Bibliotheca Indica de la Sociedad Asiática de Bengala, editada por Aloys Sprenger con Maulawi Bashir al-Din y Nur al-Haqq; contiene capítulos sobre los siete ahruf, las lecturas, los Compañeros y Sucesores que enseñaron el Corán, y la recopilación, ortografía, puntuación y vocalización del mushaf."
  fr: "La première impression à Calcutta de l'ouvrage de Jalal al-Din al-Suyuti (mort en 911 AH) al-Itqan fi 'Ulum al-Qur'an dans la série Bibliotheca Indica de la Société asiatique du Bengale, édité par Aloys Sprenger avec Maulawi Bashir al-Din et Nur al-Haqq; il contient des chapitres sur les sept ahruf, les lectures, les Compagnons et les Successeurs qui ont enseigné le Coran, et la collecte, l'orthographe, la ponctuation et la vocalisation du mushaf."
  tr: "Celaluddin al-Suyuti (ö. 911 H yılı) tarafından hazırlanan 'Al-Itqan fi Uloom al-Qur'an' adlı ilk Kalküta bülteni, Asya-Bengal Cemiyeti tarafından denetlenen 'Hindistan Kütüphanesi' serisinde Alois Springer, Mawlawi Beshir al-Din ve Mawlawi Nur al-Haq tarafından ele alınmıştır; yedi mektup, Sahabeler ve Takipçiler arasında okumalar, okumalar ve Muşaf'ın derlenmesi, yazısı, noktası ve şekli üzerine bölümler içerir."
  id: "Buletin Calcutta pertama 'Al-Itqan fi Uloom al-Qur'an' oleh Jalaluddin al-Suyuti (wafat 911 H) dalam seri 'Perpustakaan India' yang diawasi oleh Asia-Bengal Society, diliput oleh Alois Springer, Mawlawi Bashir al-Din, dan Mawlawi Nur al-Haq; mencakup bab tentang tujuh surat, pembacaan, pembacaan di antara Para Sahabat dan Pengikut, serta tentang kompilasi, aksara, titik, dan bentuk Mushaf."
