  ar: "مقالة ويكيبيديا الإنجليزية عن أمير كبير (ميرزا تقي خان فراهاني)؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في هزاوه في 9 يناير 1807، ووزارته الأولى لناصر الدين شاه (1848-1851) وإصلاحاته وتأسيسه دار الفنون، وعزله ونفيه إلى كاشان وقتله في حمام فين في 10 يناير 1852 بأمر الشاه."
  en: "English Wikipedia article on Amir Kabir (Mirza Taghi Khan Farahani); used for entity facts only. It gives his birth at Hazaveh on 9 January 1807, his chief ministry under Naser al-Din Shah (1848-1851), his reforms and his founding of the Dar ol-Fonun, and his dismissal, exile to Kashan and murder in the Fin Garden on 10 January 1852 on the Shah's order."
