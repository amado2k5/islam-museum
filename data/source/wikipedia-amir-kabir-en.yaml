reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision; its biographical substance follows Hamid Algar's Encyclopaedia Iranica entry 'Amir Kabir, Mirza Taqi Khan' (1989), which its bibliography cites. The article's current infobox carries no religion field, and its text makes no statement of his personal religion: what it records is religious policy — the suppression of the Babi upheavals and the order for the Bab's execution, and his efforts to curb clerical power and to prohibit ta'ziyeh and self-flagellation. An older state of the infobox, preserved on mirror sites, read 'Twelver Shi'a Islam'; a mirror is the same infobox family, not a second tradition."
