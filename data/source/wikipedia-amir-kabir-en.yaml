summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أمير كبير ⁦(ميرزا تقي خان فراهاني)⁩؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في هزاوه في 9 يناير 1807، ووزارته الأولى لناصر الدين شاه (1848-1851) وإصلاحاته وتأسيسه دار الفنون، وعزله ونفيه إلى كاشان وقتله في حمام فين في 10 يناير 1852 بأمر الشاه."
  en: "English Wikipedia article on Amir Kabir (Mirza Taghi Khan Farahani); used for entity facts only. It gives his birth at Hazaveh on 9 January 1807, his chief ministry under Naser al-Din Shah (1848-1851), his reforms and his founding of the Dar ol-Fonun, and his dismissal, exile to Kashan and murder in the Fin Garden on 10 January 1852 on the Shah's order."
  es: "Artículo de la Wikipedia en inglés sobre Amir Kabir (Mirza Taghi Khan Farahani); utilizado únicamente para datos sobre la persona. Describe su nacimiento en Hazaveh el 9 de enero de 1807, su ministerio principal bajo Naser al-Din Shah (1848-1851), sus reformas y la fundación del Dar ol-Fonun, así como su destitución, exilio a Kashan y asesinato en el Jardín Fin el 10 de enero de 1852 por orden del Shah."
  fr: "Article de Wikipédia en anglais sur Amir Kabir (Mirza Taghi Khan Farahani); utilisé uniquement pour les informations factuelles. Il indique sa naissance à Hazaveh le 9 janvier 1807, son poste de ministre principal sous Naser al-Din Shah (1848-1851), ses réformes et la fondation du Dar ol-Fonun, ainsi que sa destitution, son exil à Kashan et son assassinat dans le jardin de Fin le 10 janvier 1852 sur ordre du Shah."
  ur: "امیر کبیر پر انگریزی ویکیپیڈیا مضمون ⁦(مرزا طغی خان فراہانی)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 9 جنوری 1807 کو ہزاویہ میں اس کی پیدائش، ناصر الدین شاہ (1848-1851) کے تحت اس کی وزارت اعلیٰ، اس کی اصلاحات اور دارالفونون کی بنیاد، اور اس کی برطرفی، کاشان میں جلاوطنی اور 10 جنوری 1852 کو شاہ کے حکم پر فن گارڈن میں قتل۔"
