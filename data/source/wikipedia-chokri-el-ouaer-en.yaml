summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شكري الواعر؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته حارساً للترجي التونسي (1983–2002) مع فترة قصيرة في جنوة، وألقابه القارية، واعتزاله سنة 2002، وتعيينه نائباً لرئيس الترجي مكلفاً بكرة القدم في مايو 2026."
  en: "English Wikipedia article on Chokri El Ouaer; used for entity facts only. It recounts his career as Espérance de Tunis goalkeeper (1983–2002) with a short spell at Genoa, his continental honours, his 2002 retirement, and his appointment in May 2026 as Espérance vice-president in charge of football."
  es: "Artículo de la Wikipedia en inglés sobre Chokri El Ouaer; utilizado únicamente para obtener información sobre la persona. Narra su trayectoria como portero del Espérance de Tunis (1983-2002), con un breve paso por el Genoa, sus títulos continentales, su retirada en 2002 y su nombramiento en mayo de 2026 como vicepresidente del Espérance a cargo del fútbol."
  fr: "Article de Wikipédia en anglais sur Chokri El Ouaer; utilisé uniquement à des fins d’information sur l’entité. Il retrace sa carrière de gardien de but de l’Espérance de Tunis (1983-2002) avec un bref passage au Genoa, ses titres continentaux, sa retraite en 2002 et sa nomination en mai 2026 au poste de vice-président de l’Espérance en charge du football."
  ur: "Chokri El Ouaer پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسپرنس ڈی ٹیونس کے گول کیپر (1983–2002) کے بطور جینوا میں ایک مختصر اسپیل، اس کے براعظمی اعزازات، اس کی 2002 کی ریٹائرمنٹ، اور مئی 2026 میں اسپرنس کے نائب صدر کے فٹ بال کے انچارج کے طور پر ان کی تقرری کا ذکر ہے۔"
  tr: "Chokri El Waer hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Espérance Tunis'in kaleciliği kariyerini (1983–2002) kısa bir süre Cenova'da oynamasını, kıta şampiyonluklarını, 2002'de emekliliğini ve Mayıs 2026'da Espérance'ın futboldan sorumlu başkan yardımcısı olarak atanmasını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Chokri El Waer; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kariernya sebagai penjaga gawang Espérance Tunis (1983–2002) dengan masa singkat di Genoa, gelar kontinentalnya, pensiun pada 2002, dan pengangkatannya sebagai Wakil Presiden Espérance yang bertanggung jawab atas sepak bola pada Mei 2026."
