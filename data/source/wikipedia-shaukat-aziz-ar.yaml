  ar: "مقالة ويكيبيديا العربية عن شوكت عزيز؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 6 مارس 1949 في كراتشي، ووزارته للمالية من نوفمبر 1999، ورئاسته الوزراء من 28 أغسطس 2004 إلى 15 نوفمبر 2007، وإقامته في لندن، ومحاولة اغتياله في يوليو 2004. وليس في صندوق معلوماتها حقل للدين."
  en: "Arabic Wikipedia article on Shaukat Aziz; used for entity facts only. It gives his birth on 6 March 1949 at Karachi, his finance ministry from November 1999, his premiership from 28 August 2004 to 15 November 2007, his residence in London, and the July 2004 assassination attempt on him. Its infobox has no religion field."
