summary:
  ar: "مقالة ويكيبيديا العربية عن شوكت عزيز؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 6 مارس 1949 في كراتشي، ووزارته للمالية من نوفمبر 1999، ورئاسته الوزراء من 28 أغسطس 2004 إلى 15 نوفمبر 2007، وإقامته في لندن، ومحاولة اغتياله في يوليو 2004. وليس في صندوق معلوماتها حقل للدين."
  en: "Arabic Wikipedia article on Shaukat Aziz; used for entity facts only. It gives his birth on 6 March 1949 at Karachi, his finance ministry from November 1999, his premiership from 28 August 2004 to 15 November 2007, his residence in London, and the July 2004 assassination attempt on him. Its infobox has no religion field."
  es: "Artículo de Wikipedia en árabe sobre Shaukat Aziz; se utiliza únicamente para obtener información sobre la persona. Indica que nació el 6 de marzo de 1949 en Karachi, fue ministro de Finanzas desde noviembre de 1999, ocupó el cargo de primer ministro desde el 28 de agosto de 2004 hasta el 15 de noviembre de 2007, residió en Londres y sufrió un intento de asesinato en julio de 2004. Su ficha informativa no incluye información sobre religión."
  fr: "Article Wikipédia en arabe consacré à Shaukat Aziz; utilisé uniquement pour les informations biographiques. On y apprend sa naissance le 6 mars 1949 à Karachi, son poste de ministre des Finances à partir de novembre 1999, son mandat de Premier ministre du 28 août 2004 au 15 novembre 2007, sa résidence à Londres et la tentative d'assassinat dont il a été victime en juillet 2004. Son infobox ne comporte pas de champ « religion »."
  ur: "شوکت عزیز پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 6 مارچ 1949 کو کراچی میں ان کی پیدائش، نومبر 1999 سے ان کی وزارت خزانہ، 28 اگست 2004 سے 15 نومبر 2007 تک ان کی وزارت عظمیٰ، لندن میں ان کی رہائش، اور جولائی 2004 میں ان پر قاتلانہ حملے کے واقعات شامل ہیں۔ اس کے انفو باکس کا کوئی مذہب نہیں ہے۔"
  tr: "Shaukat Aziz hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 6 Mart 1949'da Karaçi'de doğduğundan, Kasım 1999'dan Maliye Bakanlığından, 28 Ağustos 2004'ten 15 Kasım 2007'ye kadar başbakanlığından, Londra'daki ikametgahından ve Temmuz 2004'te kendisine yönelik suikast girişiminden bahsedilmektedir. Bilgi kutusunda din için bir alan yoktur."
  id: "Artikel Wikipedia berbahasa Arab tentang Shaukat Aziz; hanya digunakan untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya pada 6 Maret 1949 di Karachi, Kementerian Keuangannya dari November 1999, masa jabatannya dari 28 Agustus 2004 hingga 15 November 2007, kediamannya di London, dan upaya pembunuhan terhadapnya pada Juli 2004. Tidak ada bidang untuk agama di kotak info-nya."
