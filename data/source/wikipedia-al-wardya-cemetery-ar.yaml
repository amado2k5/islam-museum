reliability_note: "Pointer for facts about the place only (AGENTS.md, Wikipedia rule of 26 October 2026), read through the MediaWiki API at revision 70599944 (4 May 2025) on 11 November 2026. Gives: an old cemetery on the al-Rusafa side of Baghdad by the old city wall, once called al-Wardiyya and now the cemetery of Shaykh Umar (cited to al-Durubi, al-Baghdadiyyun, Baghdad 1958, p. 360); its ground surrounds the mosque of Shaykh Umar al-Suhrawardi (cited to the Sunni Endowment Office's guide to heritage mosques, p. 60). The article gives no coordinates; the point on the place record is the mosque's, from Wikidata Q28716432."
