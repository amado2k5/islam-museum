reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision. It heads his years 513–592 AH (paired in the article with 1116–1196 CE; 513 AH in fact corresponds to 1119 CE, the alternative birth year the English article records, and the pairing is preserved as a conflict in the record). It calls him an authority in Zahiri fiqh — the madhhab of the Almohad state — records his judgeships at Fes and Béjaïa and his appointment as chief judge of the whole state in 580 AH, names his three books against the grammarians (al-Mashriq, Tanzih al-Qur'an, and al-Radd 'ala al-Nuhat, the one that survives), and gives his death in 592 AH. Like the English article, it attests the Zahiri adherence and does not frame him within Ahl al-Sunna in terms."
