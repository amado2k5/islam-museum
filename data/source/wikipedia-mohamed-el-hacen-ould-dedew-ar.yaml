  ar: "مقالة ويكيبيديا العربية عن محمد الحسن بن الددو الشنقيطي؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في بوتلميت بموريتانيا في 31 أكتوبر 1963 وموقعه الرسمي وأعماله؛ ويجعل صندوق معلوماتها فقهه مالكيًا وعقيدته أهل السنة والجماعة دون أن يسمي متنها مدرسة له."
  en: "Arabic Wikipedia article on Mohamed El Hacen Ould Dedew; used for entity facts only. It records his birth in Boutilimit, Mauritania, on 31 October 1963, his official website and his works; its infobox gives his jurisprudence as Maliki and his creed as Ahl al-Sunnah wa'l-Jama'ah, while its text names no school for him."
