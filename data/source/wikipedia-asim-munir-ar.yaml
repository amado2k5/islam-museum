  ar: "مقالة ويكيبيديا العربية عن المشير عاصم منير ⁦(وُلد سنة 1968 في راولبندي)⁩، رئيس أركان الجيش الباكستاني منذ 29 تشرين الثاني 2022؛ تذكر تعليمه الديني المبكر في المدرسة المركزية دار التجويد وخدمته في الرياض وترؤسه جهاز الاستخبارات (2018–2019) وتعيينه أول رئيس لقوات الدفاع في كانون الأول 2025."
  en: "Arabic Wikipedia article on Field Marshal Asim Munir (born 1968 in Rawalpindi), Pakistan's chief of army staff since 29 November 2022; it records his early religious education at the Markazi Madrasah Dar-ul-Tajweed, his service in Riyadh, his headship of the ISI (2018-2019) and his appointment as first chief of defence forces in December 2025."
