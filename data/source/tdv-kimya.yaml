summary:
  ar: "مدخل «الكيمياء» في موسوعة TDV الإسلامية بقلم أمره دولان: أصل الاسم وأسماء الصنعة الأخرى، ومكان الكيمياء القديمة في تصانيف العلوم، والميراث الإسكندري الهرمسي، وخالد بن يزيد أول من اشتغل بها، وجابر بن حيان المؤسس وأبو بكر الرازي الذي بلغ بها الذروة وأدوات مخبره، وموقف ابن سينا وابن خلدون منها."
  en: "The TDV İslâm Ansiklopedisi entry on chemistry by Emre Dölen: the name's etymology and the craft's other names, early chemistry's place in the classifications of the sciences, the Alexandrian Hermetic inheritance, Khalid ibn Yazid as the first Muslim patron of the art, Jabir ibn Hayyan the founder and al-Razi who carried it to its height with his laboratory instruments, and the judgements of Ibn Sina and Ibn Khaldun."
  es: "La entrada de Emre Dölen en la Ansiklopédisi de TDV İslâm sobre química: la etimología del nombre y otros nombres de la disciplina, el lugar de la química primitiva en las clasificaciones de las ciencias, la herencia hermética alejandrina, Khalid ibn Yazid como el primer mecenas musulmán de este arte, Jabir ibn Hayyan, el fundador, y al-Razi, quien lo llevó a su máximo esplendor con sus instrumentos de laboratorio, y los juicios de Ibn Sina e Ibn Khaldun."
  fr: "L'article d'Emre Dölen sur la chimie dans la TDV İslâm Ansiklopedisi: l'étymologie du nom et les autres noms de la discipline, la place de la chimie ancienne dans les classifications des sciences, l'héritage hermétique alexandrin, Khalid ibn Yazid comme premier mécène musulman de cet art, Jabir ibn Hayyan le fondateur et al-Razi qui l'a porté à son apogée grâce à ses instruments de laboratoire, et les jugements d'Ibn Sina et d'Ibn Khaldun."
