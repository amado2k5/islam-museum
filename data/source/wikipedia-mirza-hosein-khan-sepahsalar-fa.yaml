summary:
  ar: "سيرة فارسية تعطي وفاته في 30 آبان 1260 شمسي بمشهد، ولا ترد فيها كلمة «مذهب» إلا في بند حرية المذهب بمشروع دستور، لا في انتمائه هو."
  en: "Persian biography giving his death on 30 Aban 1260 SH (21 November 1881) at Mashhad. Its only use of the word madhhab concerns a draft constitution's freedom-of-religion clause, not his own affiliation."
  es: "Biografía en persa que indica que falleció el 30 de Aban de 1260 SH (21 de noviembre de 1881) en Mashhad. El único uso que hace del término madhhab se refiere a la cláusula de libertad religiosa de un borrador de constitución, no a su propia afiliación."
  fr: "Une biographie persane indique sa mort le 30 Aban 1260 SH (21 novembre 1881) à Mashhad. La seule occurrence du terme « madhhab » se rapporte à la clause de liberté de religion d'un projet de constitution, et non à son appartenance religieuse."
  ur: "فارسی سوانح عمری 30 ابان 1260ھ ⁦(21 نومبر 1881)⁩ کو مشہد میں وفات پائی۔ اس کا صرف لفظ مذہب کا استعمال آئین کے مسودے کی آزادی مذہب کی شق سے متعلق ہے، نہ کہ اس کی اپنی وابستگی سے۔"
  tr: "Bir Fars biyografisi, 30 Aban 1260 SH tarihinde Meşhed'de öldüğünü belirtir ve \"medhhab\" kelimesi yalnızca mezhep özgürlüğü maddesinde geçer, kendi bağlılığında değil."
  id: "Biografi Persia mencatat kematiannya pada 30 Aban 1260 SH di Mashhad, dan kata \"madhhab\" hanya muncul dalam klausul tentang kebebasan sekte melalui rancangan konstitusi, bukan dalam afiliasinya sendiri."
