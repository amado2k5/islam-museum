reliability_note: "Signed research post, read in full in Chrome on 6 November 2026. Used for the 1995 Cyrillic translation by Atamyrat Atabayev and Devletmyrat Kerimov, the late-1990s government-sponsored translation by Hojja-Ahmed Orazgilidzhev and the reported burning of its 40,000 copies in March 2000 ('according to local reports', kept as such), the 2006 Mufti Directorate translation (parallel Arabic, sura introductions, bracketed insertions, notes corresponding mainly to mainstream Sunni readings, no named translators, the introduction's reference to the President's initiative), its limited print run and online circulation, and its near-monopoly among Turkmen readers."
