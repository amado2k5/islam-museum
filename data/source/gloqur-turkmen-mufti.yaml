summary:
  ar: "تدوينة لميخايلو ياكوبوفيتش، 26 مايو 2023، عن ترجمة معاني القرآن إلى التركمانية التي أصدرتها إدارة مفتي تركمانستان سنة 2006، وعن الترجمات التي سبقتها في 1995 وأواخر التسعينيات."
  en: "A post by Mykhaylo Yakubovych, 26 May 2023, on the Turkmen translation of the meanings of the Qur'an issued by the Directorate of the Mufti of Turkmenistan in 2006, and on the translations of 1995 and the late 1990s before it."
  ur: "میخائیلو یاکوبووچ کی تحریر، 26 مئی 2023، ترکمانستان کے مفتی کی انتظامیہ کے 2006 کے ترکمانی ترجمۂ قرآن پر، اور اس سے پہلے 1995 اور 1990 کی دہائی کے آخر کے تراجم پر۔"
  es: "Publicación de Mykhaylo Yakubovych, del 26 de mayo de 2023, sobre la traducción al turcomano de los significados del Corán publicada por la Dirección del Muftí de Turkmenistán en 2006, y sobre las traducciones de 1995 y de finales de la década de 1990 anteriores a esta."
  fr: "Article de Mykhaylo Yakubovych, 26 mai 2023, sur la traduction turkmène des significations du Coran publiée par la Direction du Mufti du Turkménistan en 2006, et sur les traductions de 1995 et de la fin des années 1990 qui l'ont précédée."
  tr: "Mikhailo Yakupovich'in 26 Mayıs 2023 tarihli yazısı, 2006'da Türkmenistan yönetimi Müftüsü tarafından yayımlanan Kur'an'ın Türkmençe anlamlarının Türkmençeye çevirisi hakkında ve 1995 ile 1990'ların sonundaki önceki çeviriler hakkında."
  id: "Sebuah tulisan oleh Mikhailo Yakupovich, 26 Mei 2023, tentang terjemahan makna Al-Qur'an ke dalam bahasa Turkmen yang diterbitkan oleh Mufti pemerintahan Turkmenistan pada tahun 2006, serta tentang terjemahan sebelumnya pada tahun 1995 dan akhir 1990-an."
