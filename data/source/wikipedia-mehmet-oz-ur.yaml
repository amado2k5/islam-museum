summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد أوز، مراجعة 16 مايو 2026؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 12 يونيو 1960، وهو ما يخالف الإنجليزية والعربية وويكيداتا ⁦(11 يونيو)⁩، وتصفه بأنه جرّاح قلب تركي أمريكي ومقدم تلفزيوني."
  en: "Urdu Wikipedia article on Mehmet Oz, revision of 16 May 2026; used for entity facts only. It gives his birth as 12 June 1960 — against the English and Arabic articles and Wikidata (11 June) — and describes him as a Turkish-American heart surgeon and television host."
  es: "Artículo de Wikipedia en urdu sobre Mehmet Oz, revisado el 16 de mayo de 2026; utilizado únicamente para datos sobre la persona. Indica que nació el 12 de junio de 1960 —en contra de los artículos en inglés y árabe y de Wikidata (11 de junio)— y lo describe como un cirujano cardíaco y presentador de televisión turco-estadounidense."
  fr: "Article de Wikipédia en ourdou sur Mehmet Oz, mis à jour le 16 mai 2026; utilisé uniquement pour les informations sur l’entité. Il indique sa date de naissance comme étant le 12 juin 1960 — contrairement aux articles en anglais et en arabe et à Wikidata (11 juin) — et le décrit comme un chirurgien cardiaque turco-américain et animateur de télévision."
  ur: "مہمت اوز پر اردو ویکیپیڈیا مضمون، 16 مئی 2026 کی نظر ثانی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 12 جون 1960 کے طور پر کرتا ہے - انگریزی اور عربی مضامین اور Wikidata کے خلاف ⁦(11 جون)⁩ - اور اسے ایک ترک-امریکی ہارٹ سرجن اور ٹیلی ویژن میزبان کے طور پر بیان کرتا ہے۔"
  tr: "Muhammad Oz hakkında Urduca Wikipedia makalesi, revizyon 16 Mayıs 2026; yalnızca varlık bilgileri için kullanılmıştır. 12 Haziran 1960 doğumlu olduğu belirtilir, bu İngilizce, Arapça ve Wikidata (11 Haziran) ile çelişir ve onu Türk-Amerikalı kalp cerrahı ve televizyon sunucusu olarak tanımlar."
  id: "Artikel Wikipedia Urdu tentang Muhammad Oz, revisi 16 Mei 2026; digunakan hanya untuk fakta entitas. Ia disebutkan lahir pada 12 Juni 1960, yang bertentangan dengan bahasa Inggris, Arab, dan Wikidata (11 Juni), dan menggambarkannya sebagai ahli bedah jantung dan presenter televisi Turki-Amerika."
