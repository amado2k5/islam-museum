reliability_note: "Signed research post, read in full in Chrome on 7 November 2026. Used for the translator (Mehmed Tabakov, 1937–2010, a village preacher of the Turkish-speaking minority, reportedly once arrested for religious activity), the start of the work in the mid-1980s, the typewritten first edition of 1986 under the title Budilnik na Muslimanite and the revised second edition of late 1990 (Korani Kerim), its survival in libraries and on Bgislam.com, its foreword, its sura introductions and lack of commentary, and the reviewer's finding that its main source was Ali Fikri Yavuz's Turkish translation (1967)."
