summary:
  ar: "تدوينة لميخايلو ياكوبوفيتش، 24 يناير 2025، عن ترجمة محمد شمس الدين البلغارية للقرآن، التي كُتبت سرًّا في العهد الشيوعي وتداولت نسخة مطبوعة على الآلة الكاتبة سنة 1986، ثم طبعة ثانية آخر سنة 1990."
  en: "A post by Mykhaylo Yakubovych, 24 January 2025, on Mohammed Shemsuddin's Bulgarian translation of the Qur'an, written clandestinely under communism and circulated as a typescript in 1986, with a second edition at the end of 1990."
  ur: "میخائیلو یاکوبووچ کی تحریر، 24 جنوری 2025، محمد شمس الدین کے بلغاری ترجمۂ قرآن پر، جو کمیونسٹ دور میں خفیہ طور پر لکھا گیا اور 1986 میں ٹائپ شدہ نسخے کی صورت میں پھیلا، اور 1990 کے آخر میں دوسری اشاعت آئی۔"
  es: "Artículo de Mykhaylo Yakubovych, del 24 de enero de 2025, sobre la traducción búlgara del Corán realizada por Mohammed Shemsuddin, escrita clandestinamente bajo el comunismo y difundida como manuscrito en 1986, con una segunda edición a finales de 1990."
  fr: "Article de Mykhaylo Yakubovych, 24 janvier 2025, sur la traduction bulgare du Coran par Mohammed Shemsuddin, écrite clandestinement sous le régime communiste et diffusée sous forme de manuscrit dactylographié en 1986, avec une seconde édition fin 1990."
  tr: "Mikhailo Yakupovich tarafından 24 Ocak 2025 tarihli bir yazı, Muhammed Şemseddin'in Komünist dönemde gizlice yazdığı ve 1986'da daktilo olarak dolaşıma giren Bulgarca Kur'an çevirisi hakkında, ardından 1990 sonunda ikinci baskısı yayımlanmıştır."
  id: "Sebuah tulisan oleh Mikhailo Yakupovich, 24 Januari 2025, tentang terjemahan Al-Qur'an dalam bahasa Bulgaria Muhammad Shamseddin, yang ditulis secara rahasia selama era komunis dan beredar sebagai mesin tik pada tahun 1986, diikuti oleh edisi kedua pada akhir tahun 1990."
title: "Qur'an translation of the week #210: Korani Kerim by Mohammed Shemsuddin: an illegal Bulgarian translation of the Qur'an composed during the communist era"
