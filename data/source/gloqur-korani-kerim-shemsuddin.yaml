  ur: "میخائیلو یاکوبووچ کی تحریر، 24 جنوری 2025، محمد شمس الدین کے بلغاری ترجمۂ قرآن پر، جو کمیونسٹ دور میں خفیہ طور پر لکھا گیا اور 1986 میں ٹائپ شدہ نسخے کی صورت میں پھیلا، اور 1990 کے آخر میں دوسری اشاعت آئی۔"
