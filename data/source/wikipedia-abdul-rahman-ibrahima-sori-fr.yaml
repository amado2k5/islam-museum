reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. An independent French text tradition drawing on Austin (1997) and Diouf (1998): it gives his birth in 1762 at Timbo, his father the Almami Ibrahima Sory, his study of the Qur'an at Timbo and of Islamic sciences at Timbuktu (Sankoré, 1781 in its text), his capture in 1788, his thirty-eight years on Thomas Foster's plantation, his release at the Sultan of Morocco's request, and his death on 6 July 1829. It describes him as of a Muslim Fula family; it names no madhhab or order for him."
