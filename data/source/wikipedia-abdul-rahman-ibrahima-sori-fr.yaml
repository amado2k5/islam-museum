summary:
  ar: "مقالة ويكيبيديا الفرنسية عن عبد الرحمن بن إبراهيم سوري؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في تيمبو سنة 1762 في أسرة فولانية مسلمة، ودراسته في تمبكتو، وأسره سنة 1788، وتحريره، ووفاته في 6 يوليو 1829."
  en: "French Wikipedia article on Abdul Rahman ibn Ibrahima Sori; used for entity facts only. It recounts his birth at Timbo in 1762 into a Muslim Fula family, his studies at Timbuktu, his capture in 1788, his freeing, and his death on 6 July 1829."
  es: "Artículo de la Wikipedia en francés sobre Abdul Rahman ibn Ibrahima Sori; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Timbo en 1762 en el seno de una familia musulmana fulani, sus estudios en Tombuctú, su captura en 1788, su liberación y su muerte el 6 de julio de 1829."
  fr: "Article de Wikipédia en français sur Abdul Rahman ibn Ibrahima Sori; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance à Timbo en 1762 dans une famille musulmane peule, ses études à Tombouctou, sa capture en 1788, sa libération et sa mort le 6 juillet 1829."
  ur: "عبدالرحمن بن ابراہیم سوری پر فرانسیسی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1762 میں ٹمبو میں ایک مسلم فولا خاندان میں اس کی پیدائش، ٹمبکٹو میں اس کی تعلیم، 1788 میں اس کی گرفتاری، اس کی رہائی اور 6 جولائی 1829 کو اس کی موت کا ذکر ہے۔"
  tr: "Abdul Rahman bin İbrahim Suri hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1762'de Timbo'da Müslüman bir Fulani ailesinde doğmasını, Timbuktu'daki eğitimlerini, 1788'de yakalanmasını, özgürlüğünü ve 6 Temmuz 1829'daki ölümünü anlatır."
  id: "Artikel Wikipedia Prancis tentang Abdul Rahman bin Ibrahim Suri; digunakan hanya untuk fakta-fakta entitas. Artikel ini menceritakan kelahirannya di Timbo pada tahun 1762 dalam keluarga Muslim Fulani, studinya di Timbuktu, penangkapannya pada tahun 1788, pembebasannya, dan kematiannya pada 6 Juli 1829."
