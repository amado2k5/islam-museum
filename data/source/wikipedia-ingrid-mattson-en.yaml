summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إنغريد ماتسون؛ تُستخدم لوقائع الكيان فقط. تؤكد ولادتها في 24 أغسطس 1963 في كينغستون بأونتاريو، واعتناقها الإسلام سنة 1987، ورئاستها للجمعية الإسلامية لأمريكا الشمالية، ولا تسمّي لها مذهبًا."
  en: "English Wikipedia article on Ingrid Mattson; used for entity facts only. It confirms her birth on 24 August 1963 in Kingston, Ontario, her conversion to Islam in 1987 and her presidency of the Islamic Society of North America, and names no school for her."
  es: "Artículo de la Wikipedia en inglés sobre Ingrid Mattson; utilizado únicamente para obtener información sobre la persona. Confirma su nacimiento el 24 de agosto de 1963 en Kingston, Ontario, su conversión al islam en 1987 y su presidencia de la Sociedad Islámica de Norteamérica, pero no menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en anglais sur Ingrid Mattson; utilisé uniquement pour des informations sur l’entité. Il confirme sa naissance le 24 août 1963 à Kingston (Ontario), sa conversion à l’islam en 1987 et sa présidence de la Société islamique d’Amérique du Nord, mais ne mentionne aucune école à son nom."
  ur: "Ingrid Mattson پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ تصدیق کرتا ہے کہ 24 اگست 1963 کو کنگسٹن، اونٹاریو میں اس کی پیدائش، 1987 میں اسلام قبول کرنے اور اسلامک سوسائٹی آف نارتھ امریکہ کی اس کی صدارت، اور اس کے لیے کسی اسکول کا نام نہیں لیا۔"
