summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شهره آغداشلو؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها في طهران في 11 مايو 1952 باسم شهره وزیری‌تبار، وبدايتها في السينما الإيرانية، وهجرتها سنة 1979، وترشيحها للأوسكار عن «بيت الرمل والضباب» وجائزة إيمي عن «بيت صدام» ودورها في «ذا إكسبانس»، وتذكر أنها وُلدت لأسرة مسلمة وقالت إنها غير ممارسة."
  en: "English Wikipedia article on Shohreh Aghdashloo; used for entity facts only. It records her birth in Tehran on 11 May 1952 as Shohreh Vaziri-Tabar, her start in Iranian cinema, her departure in 1979, her Academy Award nomination for House of Sand and Fog, her Emmy Award for House of Saddam and her role in The Expanse, and states that she was born to a Muslim family and has stated she is non-practicing."
