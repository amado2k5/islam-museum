reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Its infobox gives Shohreh Vaziri-Tabar, born 11 May 1952 in Tehran, citizenship Iran and the United States, education Brunel University, spouses Aydin Aghdashloo (m. 1972, div. 1980) and Houshang Touzie (m. 1987) and one child; its text records her film debut in Chess of the Wind (1976), The Report (1977) and Sooteh Delan (1977), her move to England during the 1979 Revolution and then to the United States, her Academy Award nomination for House of Sand and Fog (2003), Dina Araz in season 4 of 24 — with her statement to Time that she had previously resisted roles reinforcing the stereotype of Muslims as terrorists — Sajida Talfah in House of Saddam (2008), for which she won the Primetime Emmy Award for Outstanding Supporting Actress in a Limited Series or Movie, the lead in The Stoning of Soraya M. (2008) and film scholar Hamid Naficy's criticism of that role, Chrisjen Avasarala in The Expanse (2015–2022), her 2013 autobiography The Alley of Love and Yellow Jasmines, and her daughter Tara Touzie, born 1989. Its early-life passage states, citing a 2009 HuffPost interview: 'Though born to a Muslim family, she has stated that she is non-practicing' — a statement about family background and practice, naming no school for her, which is why her person record's faith segment is unknown."
