summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شهره آغداشلو؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها في طهران في 11 مايو 1952 باسم شهره وزیری‌تبار، وبدايتها في السينما الإيرانية، وهجرتها سنة 1979، وترشيحها للأوسكار عن «بيت الرمل والضباب» وجائزة إيمي عن «بيت صدام» ودورها في «ذا إكسبانس»، وتذكر أنها وُلدت لأسرة مسلمة وقالت إنها غير ممارسة."
  en: "English Wikipedia article on Shohreh Aghdashloo; used for entity facts only. It records her birth in Tehran on 11 May 1952 as Shohreh Vaziri-Tabar, her start in Iranian cinema, her departure in 1979, her Academy Award nomination for House of Sand and Fog, her Emmy Award for House of Saddam and her role in The Expanse, and states that she was born to a Muslim family and has stated she is non-practicing."
  es: "Artículo de la Wikipedia en inglés sobre Shohreh Aghdashloo; utilizado únicamente para datos sobre la persona. Registra su nacimiento en Teherán el 11 de mayo de 1952 como Shohreh Vaziri-Tabar, sus inicios en el cine iraní, su salida en 1979, su nominación al Premio Óscar por La casa de arena y niebla, su premio Emmy por La casa de Saddam y su papel en The Expanse, y afirma que nació en una familia musulmana y que ha declarado no ser practicante."
  fr: "Article de Wikipédia en anglais sur Shohreh Aghdashloo; utilisé uniquement pour des informations sur sa personne. Il relate sa naissance à Téhéran le 11 mai 1952 sous le nom de Shohreh Vaziri-Tabar, ses débuts dans le cinéma iranien, son départ en 1979, sa nomination aux Oscars pour « House of Sand and Fog », son Emmy Award pour « House of Saddam » et son rôle dans « The Expanse ». L’article précise également qu’elle est née dans une famille musulmane et qu’elle a déclaré ne pas être pratiquante."
  ur: "انگریزی ویکیپیڈیا مضمون شوھرہ اگداشلو پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 11 مئی 1952 کو تہران میں اس کی پیدائش شہرہ وزیری تبار کے طور پر، ایرانی سنیما میں اس کی شروعات، 1979 میں اس کی روانگی، ہاؤس آف سینڈ اینڈ فوگ کے لیے اس کی اکیڈمی ایوارڈ نامزدگی، ہاؤس آف صدام کے لیے اس کا ایمی ایوارڈ اور دی ایکسپینس میں اس کے کردار کو ریکارڈ کیا گیا ہے، اور بتایا گیا ہے کہ وہ ایک غیر مسلم خاندان میں پیدا ہوئی تھی اور وہ ایک غیر مسلم ریاست ہے۔"
