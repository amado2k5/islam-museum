reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. Read in full on 4 November 2026. The career section records in prose that he served as Rais Aam of the Nahdlatul Ulama executive board from 3 March 2014 to 6 August 2015, succeeding KH Sahal Mahfudz, and that he received the Yap Thiam Hien human-rights award in 2017; the awards section records the 2005 Mastera Asian literature award, the 2009 honorary doctorate of UIN Sunan Kalijaga and the 2015 Bintang Budaya Parama Dharma (the last footnoted to detikcom's report of the state ceremony). Birth date and place and his parents' names are in the infobox. The article names no legal school for him. The revision-id endpoint was not reachable in this session, so no revision id is recorded; the access date stands in its place."
