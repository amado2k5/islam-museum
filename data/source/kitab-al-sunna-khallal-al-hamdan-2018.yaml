reliability_note: "Classical Hanbali creed collection (author d. 311 AH, public domain); the 2018 apparatus (introduction, notes, appendix compilation) is copyrighted, so only facts and short attributed quotations are taken. Copy used: harvest item sunnah-aqeedah/kitab-sunnah-khallal/20210227_20210227_0936 (1,337 PDF pages, OCR text; a single file holding the whole edition). Imprint PDF p. 2, introduction pp. 3–6, notice of al-Khallal pp. 7–10, editions and errata pp. 11–13, manuscript pp. 14–15, method pp. 16–17, text from p. 19, appendix from p. 948. The printed folio numbers in the OCR are inconsistent (the appendix restarts its own numbering), so ALL CITATIONS OF THIS SOURCE GIVE PDF PAGES. The editor's notes are polemical towards those who rejected the Mujahid report; such wording is reported as his, never adopted."
