label:
  ar: "كتاب السنة لأبي بكر الخلال، ومعه ذيل فيه «الرد على الزنادقة والجهمية» للإمام أحمد وما وُجد من «السنة» لغلام الخلال — تحقيق عادل بن عبد الله آل حمدان، الطبعة الثالثة 1439هـ/2018م"
  en: "Kitab al-Sunna of Abu Bakr al-Khallal, with an appendix holding Ahmad ibn Hanbal's al-Radd 'ala al-Zanadiqa wa-al-Jahmiyya and the surviving part of Ghulam al-Khallal's al-Sunna — ed. 'Adil ibn 'Abd Allah Al Hamdan, 3rd edition 1439 AH/2018 CE"
summary:
  ar: "الطبعة الثالثة (1439هـ/2018م، دار نشر في جدة كما في صفحة الحقوق) من تحقيق عادل آل حمدان لكتاب «السنة» للخلال (ت 311هـ) عن نسخة المتحف البريطاني الوحيدة، وفيها مقدمة المحقق وترجمة المصنف ووصف المخطوط ومنهج التحقيق، ثم الجزء الموجود من الكتاب (المجلد الأول، الأجزاء السبعة عدا الثاني والثالث)، ثم ذيل جمع فيه المحقق نحو 263 أثراً منقولة من الأجزاء المفقودة، وكتاب أحمد «الرد على الزنادقة والجهمية»، وقطعة من «السنة» لغلام الخلال."
  en: "The third edition (1439 AH/2018 CE, a Jeddah publisher per the imprint page) of 'Adil Al Hamdan's edition of al-Khallal's (d. 311 AH) Kitab al-Sunna from the single British Museum manuscript, with the editor's introduction, a notice of the author, a description of the manuscript and the editorial method, then the surviving part of the book (the first volume, its seven parts less the second and third), then an appendix gathering some 263 quotations from the lost parts, Ahmad's al-Radd 'ala al-Zanadiqa wa-al-Jahmiyya, and a fragment of Ghulam al-Khallal's al-Sunna."
