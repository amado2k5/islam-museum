label:
  ar: "كتاب السنة لأبي بكر الخلال، ومعه ذيل فيه «الرد على الزنادقة والجهمية» للإمام أحمد وما وُجد من «السنة» لغلام الخلال — تحقيق عادل بن عبد الله آل حمدان، الطبعة الثالثة 1439هـ/2018م"
  en: "Kitab al-Sunna of Abu Bakr al-Khallal, with an appendix holding Ahmad ibn Hanbal's al-Radd 'ala al-Zanadiqa wa-al-Jahmiyya and the surviving part of Ghulam al-Khallal's al-Sunna — ed. 'Adil ibn 'Abd Allah Al Hamdan, 3rd edition 1439 AH/2018 CE"
summary:
  ar: "الطبعة الثالثة ⁦(1439هـ/2018م، دار نشر في جدة كما في صفحة الحقوق)⁩ من تحقيق عادل آل حمدان لكتاب «السنة» للخلال ⁦(ت 311هـ)⁩ عن نسخة المتحف البريطاني الوحيدة، وفيها مقدمة المحقق وترجمة المصنف ووصف المخطوط ومنهج التحقيق، ثم الجزء الموجود من الكتاب ⁦(المجلد الأول، الأجزاء السبعة عدا الثاني والثالث)⁩، ثم ذيل جمع فيه المحقق نحو 263 أثراً منقولة من الأجزاء المفقودة، وكتاب أحمد «الرد على الزنادقة والجهمية»، وقطعة من «السنة» لغلام الخلال."
  en: "The third edition (1439 AH/2018 CE, a Jeddah publisher per the imprint page) of 'Adil Al Hamdan's edition of al-Khallal's (d. 311 AH) Kitab al-Sunna from the single British Museum manuscript, with the editor's introduction, a notice of the author, a description of the manuscript and the editorial method, then the surviving part of the book (the first volume, its seven parts less the second and third), then an appendix gathering some 263 quotations from the lost parts, Ahmad's al-Radd 'ala al-Zanadiqa wa-al-Jahmiyya, and a fragment of Ghulam al-Khallal's al-Sunna."
  es: "La tercera edición (1439 AH/2018 CE, una editorial de Jeddah según la página de impresión) de la edición de 'Adil Al Hamdan del Kitab al-Sunna de al-Khallal (m. 311 AH) del único manuscrito del Museo Británico, con la introducción del editor, una nota del autor, una descripción del manuscrito y el método editorial, luego la parte superviviente del libro (el primer volumen, sus siete partes menos la segunda y la tercera), luego un apéndice que reúne unas 263 citas de las partes perdidas, al-Radd 'ala al-Zanadiqa wa-al-Jahmiyya de Ahmad y un fragmento de al-Sunna de Ghulam al-Khallal."
  fr: "La troisième édition (1439 AH/2018 CE, un éditeur de Djeddah selon la page d'impression) de l'édition par 'Adil Al Hamdan du Kitab al-Sunna d'al-Khallal (d. 311 AH) à partir du manuscrit unique du British Museum, avec l'introduction de l'éditeur, une notice sur l'auteur, une description du manuscrit et de la méthode éditoriale, puis la partie survivante du livre (le premier volume, ses sept parties moins le deuxième et le troisième), puis un appendice rassemblant quelque 263 citations des parties perdues, al-Radd 'ala al-Zanadiqa wa-al-Jahmiyya d'Ahmad, et un fragment d'al-Sunna de Ghulam al-Khallal."
  ur: "تیسرا ایڈیشن ⁦(1439 ہجری / 2018 عیسوی، جدہ کے ناشر فی امپرنٹ صفحہ)⁩ عادل الحمدان کے ایڈیشن الخلال ⁦(متوفی 311 ہجری)⁩ کتاب السنۃ کے واحد برٹش میوزیم کے مخطوطہ سے، ایڈیٹر کے تعارف کے ساتھ، مصنف کا ایک طریقہ اور اس کے بعد مصنف کی تحریری تحریر کی تفصیل۔ کتاب کا بچ جانے والا حصہ ⁦(پہلی جلد، اس کے سات حصے دوسرے اور تیسرے سے کم)⁩، پھر ایک ضمیمہ جس میں گمشدہ حصوں سے تقریباً 263 اقتباسات جمع کیے گئے، احمد کی الرد العلا الزنادیقہ و الجہمیہ، اور غلام الخلال کی السنۃ کا ایک ٹکڑا۔"
title: "كتاب السنة — أبو بكر أحمد بن محمد بن هارون الخلال"
