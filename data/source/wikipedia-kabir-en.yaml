summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كبير ⁦(ازدهر في القرن الخامس عشر)⁩، الشاعر الصوفي البهاكتي من فاراناسي؛ تعرض نشأته في بيت نسّاج مسلم وتلمذته المنسوبة إلى رامانندا، ونقده للأديان المنظمة جميعًا، وأشعاره في الغورو غرانث صاحب والبيجاك، وتنازع الهندوس والمسلمين والسيخ عليه بعد موته."
  en: "English Wikipedia article on Kabir (fl. 15th century), the Bhakti mystic poet of Varanasi; it sets out his upbringing in a Muslim weaver household and his attributed discipleship under Ramananda, his criticism of all organised religions, his verses in the Guru Granth Sahib and the Bijak, and the Hindu, Muslim and Sikh claims made on him after his death."
  es: "Artículo de la Wikipedia en inglés sobre Kabir (activo en el siglo XV), el poeta místico Bhakti de Varanasi; en él se expone su crianza en una familia musulmana de tejedores y su supuesto discipulado con Ramananda, su crítica a todas las religiones organizadas, sus versos en el Guru Granth Sahib y el Bijak, y las reivindicaciones hindúes, musulmanas y sij que se hicieron sobre él después de su muerte."
  fr: "Article de Wikipédia en anglais sur Kabir (actif au XVe siècle), le poète mystique Bhakti de Varanasi; il décrit son éducation dans une famille de tisserands musulmans et son enseignement supposé auprès de Ramananda, sa critique de toutes les religions organisées, ses versets dans le Guru Granth Sahib et le Bijak, ainsi que les revendications hindoues, musulmanes et sikhes formulées à son sujet après sa mort."
  ur: "وارانسی کے بھکتی صوفیانہ شاعر کبیر ⁦(fl. 15 ویں صدی)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ یہ ایک مسلم بنکر گھرانے میں اس کی پرورش اور رامانند کے تحت اس کی منسوب شاگردی، تمام منظم مذاہب پر اس کی تنقید، گرو گرنتھ صاحب اور بیجک میں اس کی آیات، اور اس کی موت کے بعد اس پر کیے گئے ہندو، مسلم اور سکھ دعووں کو بیان کرتا ہے۔"
