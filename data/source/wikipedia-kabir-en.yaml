reliability_note: "Read in full on 1 November 2026. The article is frank that his birth and death years are uncertain: some historians favour 1398–1448, others 1440–1518, and both datings are preserved in the record as debated. Its scholarly apparatus (Linda Hess, Charlotte Vaudeville, David Lorenzen, Irfan Habib, Ronald McGregor) does not converge on one tradition for the man himself: the Dabestan-e Mazaheb calls him a Bairagi and a disciple of Ramananda, McGregor states that he left Islam, Hess warns that presenting him as a synthesizer of Hinduism and Islam is a false picture, and the article records that he declared his independence from both religions and was claimed by Hindus and Muslims alike at his death. His verses, transmitted orally for two centuries, survive in distinct recensions (the Bijak, the Granthawali and the Adi Granth), a transmission history the article sets out in detail."
