  ar: "مقالة ويكيبيديا الإنجليزية عن كبير (ازدهر في القرن الخامس عشر)، الشاعر الصوفي البهاكتي من فاراناسي؛ تعرض نشأته في بيت نسّاج مسلم وتلمذته المنسوبة إلى رامانندا، ونقده للأديان المنظمة جميعًا، وأشعاره في الغورو غرانث صاحب والبيجاك، وتنازع الهندوس والمسلمين والسيخ عليه بعد موته."
  en: "English Wikipedia article on Kabir (fl. 15th century), the Bhakti mystic poet of Varanasi; it sets out his upbringing in a Muslim weaver household and his attributed discipleship under Ramananda, his criticism of all organised religions, his verses in the Guru Granth Sahib and the Bijak, and the Hindu, Muslim and Sikh claims made on him after his death."
