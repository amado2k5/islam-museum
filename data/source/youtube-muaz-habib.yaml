reliability_note: "The artist's own channel: a primary source for his identity, his self-presentation and his output, not independent corroboration of biography. Its Amharic description states it is the official channel of the munshid Muaz Habib and lists new neshida albums, distinctive covers, recitations and religious programmes among its content; its keywords name iNaya Records. Its most-viewed uploads as read on 5 November 2026 include the menzuma 'Resul Jalele' (about 15 million views), 'Nur Amba — Warida 6' (about 11 million) and a February 2025 cover neshida (about 10 million), alongside a Somali-language neshida, 'Ya Nural Ceyni' (about 8 million). It gives no birth date and names no school of law for him. Read on 5 November 2026."
