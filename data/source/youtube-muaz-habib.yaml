summary:
  ar: "قناة معاذ حبيب الرسمية على يوتيوب؛ يصفها وصفها الأمهرية بأنها قناته الرسمية وأنها تنشر ألبومات النشيد الجديدة وأعمال الكوفر والتلاوات وبرامج دينية، وقراءتها في 5 نوفمبر 2026 أظهرت مقاطع منشورة قبل أربعة إلى ثمانية أشهر."
  en: "Muaz Habib's official YouTube channel; its Amharic description calls it the official channel of the munshid Muaz Habib and lists new neshida albums, cover works, recitations and religious programmes; read on 5 November 2026, it showed uploads from four to eight months earlier."
  es: "El canal oficial de YouTube de Muaz Habib, cuya descripción en amárico lo denomina el canal oficial del munshid Muaz Habib, incluye nuevos álbumes de neshida, versiones de canciones, recitaciones y programas religiosos. Al consultarlo el 5 de noviembre de 2026, mostraba subidas de entre cuatro y ocho meses antes."
  fr: "La chaîne YouTube officielle de Muaz Habib; sa description en amharique la présente comme la chaîne officielle du munshid Muaz Habib et répertorie les nouveaux albums de neshida, les reprises, les récitations et les programmes religieux; consultée le 5 novembre 2026, elle affichait des mises en ligne datant de quatre à huit mois auparavant."
  ur: "معاذ حبیب کا آفیشل یوٹیوب چینل؛ اس کی امہاری وضاحت اسے منشد معاذ حبیب کا آفیشل چینل کہتی ہے اور اس میں نئے نیشیدہ البمز، کور ورکس، تلاوت اور مذہبی پروگراموں کی فہرست ہے۔ 5 نومبر 2026 کو پڑھا، اس میں چار سے آٹھ ماہ پہلے کے اپ لوڈز دکھائے گئے۔"
  tr: "Muath Habib'in resmi YouTube kanalı onu Amharca olarak tanımlıyor; bu da onun resmi kanalı olarak tanımlanıyor ve yeni marş albümleri, kapak eserleri, okunuşlar ve dini programlar yayınlıyor. 5 Kasım 2026'da okuduğunda, dört ila sekiz ay önce yayınlanan klipler görüldü."
  id: "Saluran YouTube resmi Muath Habib menggambarkannya sebagai Amharik, yang disebut sebagai saluran resminya, dan menerbitkan album anthem baru, karya cover, pembacaan, dan program keagamaan. Membacanya pada 5 November 2026, menampilkan klip-klip yang diposting empat hingga delapan bulan lalu."
