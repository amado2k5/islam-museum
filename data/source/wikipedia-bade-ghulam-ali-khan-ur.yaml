  ar: "مقالة ويكيبيديا الأردية عن بادي غلام علي خان؛ تُستخدم لوقائع الكيان فقط. صندوقها يجعل ولادته في 2 نيسان 1902 في قصور ووفاته في 23 نيسان 1968 في حيدر آباد، بينما يجعل متنها وفاته في 25 نيسان — وهو الانقسام المسجّل في سجلّ الرجل."
  en: "Urdu Wikipedia article on Bade Ghulam Ali Khan; used for entity facts only. Its infobox gives him born 2 April 1902 at Kasur and died 23 April 1968 at Hyderabad, while its lead gives his death as 25 April — the split recorded in his record."
  es: "Artículo de Wikipedia en urdu sobre Bade Ghulam Ali Khan; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació el 2 de abril de 1902 en Kasur y falleció el 23 de abril de 1968 en Hyderabad, mientras que el titular señala que su muerte fue el 25 de abril, fecha que consta en su expediente."
  fr: "Article de Wikipédia en ourdou sur Bade Ghulam Ali Khan; utilisé uniquement pour les informations sur l'entité. Son infobox indique qu'il est né le 2 avril 1902 à Kasur et décédé le 23 avril 1968 à Hyderabad, tandis que son introduction mentionne le 25 avril comme date de décès – la différence figurant dans son dossier."
  ur: "بڑے غلام علی خان پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا انفو باکس بتاتا ہے کہ وہ 2 اپریل 1902 کو قصور میں پیدا ہوا اور 23 اپریل 1968 کو حیدر آباد میں انتقال ہوا، جب کہ اس کا لیڈ ان کی موت 25 اپریل بتاتا ہے - جو اس کے ریکارڈ میں درج ہے۔"
