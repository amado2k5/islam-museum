summary:
  ar: "ملف تعريفي في موقع جاواوا الإخباري نشر في ١ تشرين الأول ٢٠٢٦ يوم تنصيب بهليل لحاداليا وزيرًا منسقًا لشؤون التصنيع التكميلي والتحول الطاقي في التعديل الوزاري، مع إبقائه على وزارة الطاقة والموارد المعدنية بالوكالة المشتركة؛ يلخص مولده في باندا سنة ١٩٧٦ ونشاطه في رابطة الطلاب المسلمين وأمانته العامة لماليتها، ومسيرته عبر هيئة الاستثمار ووزارتي الاستثمار والطاقة، وثروته المُعلنة."
  en: "Jawawa news profile published 1 October 2026, the day Bahlil Lahadalia was inaugurated as Coordinating Minister for Downstreaming and Energy Transition in the cabinet reshuffle, keeping the energy and mineral resources ministry concurrently; it summarises his birth in Banda in 1976, his Muslim Students' Association activism and general treasurership, his path through the Investment Coordinating Board and the investment and energy ministries, and his declared wealth."
