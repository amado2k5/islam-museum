label: { en: "Jawawa profile of Bahlil Lahadalia on his appointment as Coordinating Minister for Downstreaming and Energy Transition (1 October 2026)" }
summary:
  ar: "ملف تعريفي في موقع جاواوا الإخباري نشر في ١ تشرين الأول ٢٠٢٦ يوم تنصيب بهليل لحاداليا وزيرًا منسقًا لشؤون التصنيع التكميلي والتحول الطاقي في التعديل الوزاري، مع إبقائه على وزارة الطاقة والموارد المعدنية بالوكالة المشتركة؛ يلخص مولده في باندا سنة ١٩٧٦ ونشاطه في رابطة الطلاب المسلمين وأمانته العامة لماليتها، ومسيرته عبر هيئة الاستثمار ووزارتي الاستثمار والطاقة، وثروته المُعلنة."
  en: "Jawawa news profile published 1 October 2026, the day Bahlil Lahadalia was inaugurated as Coordinating Minister for Downstreaming and Energy Transition in the cabinet reshuffle, keeping the energy and mineral resources ministry concurrently; it summarises his birth in Banda in 1976, his Muslim Students' Association activism and general treasurership, his path through the Investment Coordinating Board and the investment and energy ministries, and his declared wealth."
  es: "Perfil de noticias de Jawawa publicado el 1 de octubre de 2026, día en que Bahlil Lahadalia fue investido como Ministro Coordinador de Transición Energética y de Procesamiento de Petróleo en la reorganización del gabinete, manteniendo simultáneamente el ministerio de energía y recursos minerales; resume su nacimiento en Banda en 1976, su activismo en la Asociación de Estudiantes Musulmanes y su cargo como tesorero general, su trayectoria a través de la Junta Coordinadora de Inversiones y los ministerios de inversión y energía, y su patrimonio declarado."
  fr: "Profil de Bahlil Lahadalia publié par Jawawa le 1er octobre 2026, jour de son investiture comme ministre coordinateur de l'aval et de la transition énergétique lors du remaniement ministériel, tout en conservant le ministère de l'énergie et des ressources minérales; il résume sa naissance à Banda en 1976, son activisme au sein de l'Association des étudiants musulmans et son rôle de trésorier général, son parcours au sein du Conseil de coordination des investissements et des ministères de l'investissement et de l'énergie, ainsi que sa fortune déclarée."
  ur: "جاوا نیوز پروفائل 1 اکتوبر 2026 کو شائع ہوا، جس دن بہلیل لہادالیہ کا کابینہ میں ردوبدل اور توانائی اور معدنی وسائل کی وزارت کو ساتھ رکھتے ہوئے، کوآرڈینیٹنگ وزیر برائے ڈاؤن اسٹریمنگ اور توانائی کی منتقلی کے طور پر افتتاح کیا گیا تھا۔ اس میں 1976 میں بندہ میں ان کی پیدائش، ان کی مسلم اسٹوڈنٹس ایسوسی ایشن کی سرگرمی اور جنرل خزانچی، انویسٹمنٹ کوآرڈینیٹنگ بورڈ اور سرمایہ کاری اور توانائی کی وزارتوں کے ذریعے ان کے راستے اور ان کی اعلان کردہ دولت کا خلاصہ بیان کیا گیا ہے۔"
  tr: "Java News web sitesinde 1 Ekim 2026'da yayımlanan bir profil, Bahlil Lahdalia'nın kabine değişikliğinde Tamamlayıcı Üretim ve Enerji Dönüşümü Koordinasyon Bakanı olarak atandığı gün, Enerji ve Mineral Kaynaklar Ortak Vekil Bakanlığı'nı korurken; 1976'da Banda'daki doğumunu, Müslüman Öğrenciler Derneği ve Genel Sekreterliği'ndeki faaliyetlerini, Yatırım Otoritesi ve Yatırım ve Enerji Bakanlıkları aracılığıyla kariyerini ve beyan edilen servetini özetlemektedir."
  id: "Profil di situs Java News yang diterbitkan pada 1 Oktober 2026, hari Bahlil Lahdalia diangkat sebagai Menteri Koordinasi Manufaktur Pelengkap dan Transisi Energi dalam perombakan kabinet, sambil tetap mempertahankan Kementerian Sementara Gabungan Energi dan Sumber Daya Mineral; ini merangkum kelahirannya di Banda pada tahun 1976, aktivitasnya di Asosiasi Mahasiswa Muslim dan Sekretariat Jenderalnya, kariernya melalui Otoritas Investasi dan Kementerian Investasi dan Energi, serta kekayaan yang diumumkan."
