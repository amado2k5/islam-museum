summary:
  ar: "مقالة ويكيبيديا العربية عن بدر الدين الحسني؛ تُستخدم لوقائع الكيان فقط. تصفه في صدرها شخصيًا بأنه «شافعي المذهب أشعري العقيدة صوفي شاذلي الطريقة»، وتفرد قسمًا لمذهبه تنقل فيه عن «الأعلام» للزركلي قوله بلسانه «أنا شافعي». تذكر مولده في دمشق سنة 1267هـ/1850م، وأباه يوسف المتوفى وله اثنتا عشرة سنة، وأمه عائشة من آل الكزبري أهل الحديث، وشيخه أبا الخير الخطيب، وابنه تاج الدين، ووفاته في دمشق يوم الجمعة 27 ربيع الأول 1354هـ (28 يونيو 1935) ودفنه في مقبرة الباب الصغير."
  en: "Arabic Wikipedia article on Badreddin al-Hasani; used for entity facts only. Its lead names him personally as 'Shafi'i in school, Ash'ari in creed, a Sufi of the Shadhili path', and a dedicated section on his school, citing al-Zirikli's al-A'lam, records his own words 'I am a Shafi'i'. It gives his birth at Damascus in 1267 AH / 1850 CE, his father Yusuf (who died when the boy was twelve), his mother Aisha of the Kuzbari hadith family, his teacher Abu al-Khayr al-Khatib, his son Taj al-Din, and his death at Damascus on Friday 27 Rabi' al-Awwal 1354 AH (28 June 1935), buried in Bab al-Saghir cemetery."
