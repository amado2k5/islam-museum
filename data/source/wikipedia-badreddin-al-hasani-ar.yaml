summary:
  ar: "مقالة ويكيبيديا العربية عن بدر الدين الحسني؛ تُستخدم لوقائع الكيان فقط. تصفه في صدرها شخصيًا بأنه «شافعي المذهب أشعري العقيدة صوفي شاذلي الطريقة»، وتفرد قسمًا لمذهبه تنقل فيه عن «الأعلام» للزركلي قوله بلسانه «أنا شافعي». تذكر مولده في دمشق سنة 1267هـ/1850م، وأباه يوسف المتوفى وله اثنتا عشرة سنة، وأمه عائشة من آل الكزبري أهل الحديث، وشيخه أبا الخير الخطيب، وابنه تاج الدين، ووفاته في دمشق يوم الجمعة 27 ربيع الأول 1354هـ ⁦(28 يونيو 1935)⁩ ودفنه في مقبرة الباب الصغير."
  en: "Arabic Wikipedia article on Badreddin al-Hasani; used for entity facts only. Its lead names him personally as 'Shafi'i in school, Ash'ari in creed, a Sufi of the Shadhili path', and a dedicated section on his school, citing al-Zirikli's al-A'lam, records his own words 'I am a Shafi'i'. It gives his birth at Damascus in 1267 AH / 1850 CE, his father Yusuf (who died when the boy was twelve), his mother Aisha of the Kuzbari hadith family, his teacher Abu al-Khayr al-Khatib, his son Taj al-Din, and his death at Damascus on Friday 27 Rabi' al-Awwal 1354 AH (28 June 1935), buried in Bab al-Saghir cemetery."
  es: "Artículo de Wikipedia en árabe sobre Badreddin al-Hasani; utilizado únicamente para datos sobre la persona. Su introducción lo identifica personalmente como \"Shafi'i en la escuela, Ash'ari en el credo, un sufí de la senda Shadhili\", y una sección dedicada a su escuela, citando al-A'lam de al-Zirikli, recoge sus propias palabras \"Soy un Shafi'i\". Menciona su nacimiento en Damasco en 1267 AH / 1850 d. C., su padre Yusuf (quien murió cuando el niño tenía doce años), su madre Aisha de la familia hadith Kuzbari, su maestro Abu al-Khayr al-Khatib, su hijo Taj al-Din, y su muerte en Damasco el viernes 27 Rabi' al-Awwal 1354 AH (28 de junio de 1935), enterrado en el cementerio Bab al-Saghir."
  fr: "Article de Wikipédia en arabe sur Badreddin al-Hasani; utilisé uniquement pour les informations le concernant. Son introduction le décrit comme « shafi'ite par son école, ash'arite par sa croyance, soufi de la voie shadhili », et une section dédiée à son école, citant al-A'lam d'al-Zirikli, rapporte ses propres paroles: « Je suis shafi'ite ». L'article indique sa naissance à Damas en 1267 AH / 1850 apr. J.-C., son père Yusuf (décédé alors que le garçon avait douze ans), sa mère Aisha, issue de la famille de hadiths kuzbari, son maître Abu al-Khayr al-Khatib, son fils Taj al-Din, et sa mort à Damas le vendredi 27 Rabi' al-Awwal 1354 AH (28 juin 1935), inhumé au cimetière de Bab al-Saghir."
  ur: "بدرالدین الحسنی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ اسے ذاتی طور پر 'مکتب میں شافعی'، عقیدہ میں اشعری، شاذلی راہ کا صوفی' کے نام سے موسوم کرتا ہے، اور اس کے مکتب کے ایک وقف شدہ حصے نے، الزرکلی کے العالم کا حوالہ دیتے ہوئے، ان کے اپنے الفاظ 'میں ایک شافعی ہوں' درج کیا ہے۔ اس کی ولادت دمشق میں 1267ھ / 1850 عیسوی میں ہوئی، اس کے والد یوسف ⁦(جو لڑکا بارہ سال کا تھا اس وقت فوت ہوئے)⁩، ان کی والدہ عائشہ کزبری حدیث خاندان سے، ان کے استاد ابو الخیر الخطیب، ان کے بیٹے تاج الدین، اور ان کی وفات جمعہ 27 ربیع الاول 1353ء کو دمشق میں ہوئی۔ باب الصغیر قبرستان میں سپرد خاک کیا گیا۔"
