  ar: "مقالة ويكيبيديا الأردية عن كفاية الله الدهلوي (1875–1952)؛ تُستخدم لوقائع الكيان فقط. تصفه في متنها بأنه عالم دين هندي وفقيه حنفي، وتروي ولادته سنة 1292 هـ في شاه جهان بور، ودراسته في ديوبند، وأساتذته ومنهم محمود حسن، وتدريسه في مدرسة أمينيا، ووفاته في 13 ربيع الثاني 1372 هـ الموافق 31 ديسمبر 1952."
  en: "Urdu Wikipedia article on Kifayatullah Dehlvi (1875–1952); used for entity facts only. Its lead calls him in text an Indian religious scholar and a Hanafi jurist; it gives his birth in 1292 AH at Shahjahanpur, his studies at Deoband, his teachers including Mahmud Hasan, his teaching at Madrasa Aminia, and his death on 13 Rabi' al-thani 1372 AH, paired with 31 December 1952."
