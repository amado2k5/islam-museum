label: { ar: "لبنى ملا — محاضرة في معهد يقين", en: "Lobna Mulla — Yaqeen Institute lecture" }
summary:
  ar: "صفحة معهد يقين للبحوث الإسلامية لمحاضرة لبنى ملا «الشكر والحداثة والحاجة إلى الله في المعادلة»، وهي جلسة من المؤتمر الأكاديمي للمعهد ضمن مؤتمر MAS-ICNA سنة 2021؛ تصفها الصفحة بأنها تذكّر بوعد الله بأن الشكر يزيد الإنسان، وأن ممارسة الشكر صفة المؤمن الحقيقي."
  en: "The Yaqeen Institute for Islamic Research page for Lobna Mulla's lecture 'Gratitude, Modernity and the Need for God in the Equation', a session of the Yaqeen Academic Conference at the 2021 MAS-ICNA convention; the page describes her teaching that gratitude is a quality of a true believer in times of ease and of darkness."
  es: "La página del Instituto Yaqeen para la Investigación Islámica dedica a la conferencia de Lobna Mulla titulada \"Gratitud, modernidad y la necesidad de Dios en la ecuación\", impartida durante la Conferencia Académica Yaqeen en la convención MAS-ICNA de 2021. En ella se describe su enseñanza de que la gratitud es una cualidad propia de un verdadero creyente, tanto en tiempos de bonanza como de adversidad."
  fr: "La page de l'Institut Yaqeen de recherche islamique consacrée à la conférence de Lobna Mulla intitulée « Gratitude, modernité et la nécessité de Dieu dans l'équation », une session de la conférence académique Yaqeen lors du congrès MAS-ICNA de 2021, décrit son enseignement selon lequel la gratitude est une qualité du véritable croyant, aussi bien dans les moments de facilité que dans les moments difficiles."
  ur: "یاقین انسٹی ٹیوٹ فار اسلامک ریسرچ پیج لبنا ملا کے لیکچر 'شکریہ، جدیدیت اور مساوات میں خدا کی ضرورت' کے لیے، 2021 MAS-ICNA کنونشن میں Yaqeen اکیڈمک کانفرنس کا ایک سیشن؛ صفحہ اس کی تعلیم کو بیان کرتا ہے کہ شکر گزاری ایک سچے مومن کی آسانی اور تاریکی کے اوقات میں ایک خوبی ہے۔"
  tr: "Yaqeen İslami Araştırmalar Enstitüsü'nün Lubna Mulla'nın 2021'de MAS-ICNA konferansı kapsamında düzenlenen akademik konferansından \"Minnettarlık, Modernlik ve Denklemde Tanrı'ya İhtiyac\" başlıklı konferansı için sayfa; sayfa, bunu Tanrı'nın şükran vaatini hatırlatan bir şey olarak tanımlıyor; şükran uygulamanın gerçek bir inananın özelliği olduğunu belirtiyor."
  id: "Halaman Yaqeen Institute for Islamic Research untuk kuliah Lubna Mulla \"Syukur, Modernitas, dan Kebutuhan akan Tuhan dalam Persamaan,\" sebuah sesi dari konferensi akademik institut dalam konferensi MAS-ICNA tahun 2021; halaman tersebut menggambarkannya sebagai pengingat janji Tuhan bahwa rasa syukur meningkatkan seseorang, dan bahwa mempraktikkan rasa syukur adalah sifat dari orang beriman sejati."
title: "Gratitude, Modernity and the Need for God in the Equation (Part 1) — Yaqeen Institute"
