reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The article gives his full name (Fahad bin Salem bin Ali al-Kandari), his birth in Kuwait on 28 June 1982, his completion of Qur'an memorisation at fifteen under Shaykh Rashad ibn Muhammad Sayyid Ahmad Alam, his imam posts (Al-Omair Mosque in Yarmouk 1999–2001, then Al-Kolaib Mosque in Qortuba, and the Grand Mosque of Kuwait City), his leading of the tahajjud prayer at the Muhammad ibn Abd al-Wahhab Mosque in Doha in Ramadan 1433 AH / 2012, and his television programmes from Musafir ma'a al-Qur'an (2012) to Masra (2024). Its infobox gives his religion only as Muslim. A line in the article claiming billion-dollar wealth is unsourced and is not used. Checked 25 October 2026."
