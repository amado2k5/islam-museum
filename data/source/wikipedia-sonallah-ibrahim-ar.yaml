reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026. Used for his Cairo birth and death, his imprisonment from 1959 to 1964 in Nasser's campaign against the Egyptian left, his refusal of the 2003 Cairo novel prize, and his death in Cairo on 13 August 2025 (19 Safar 1447) aged 88. Its birth date, 24 February 1937 paired with 13 Dhu al-Hijja 1355, conflicts with the English article and Wikidata (3 August 1937); the record keeps both under debated status rather than silently choosing. The article calls him a leftist writer and names no religion for him."
