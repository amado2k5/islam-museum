reliability_note: "Signed post, read in full in Chrome on 7 November 2026. Used for the Indonesian context (the memorisation movement, demand of about 37 million copies a year against about 7 million produced), alQosbah's founding in 2020, its distribution of over ten million copies and its 2022 award from the Ministry's Lajnah Pentashihan Mushaf, and the features of Al-Qur'an Adventure (the official translation, thematic subheadings, a word-for-word translation based on Ibn Kathir's linguistic exegesis, QR codes to animated stories, 31 stories and 76 lessons, colour-coded tajwid and memorisation aids), and the publisher's foreign-language editions and Frankfurt Book Fair presence in 2023 and 2024. The post gives no publication year for the Adventure edition itself."
