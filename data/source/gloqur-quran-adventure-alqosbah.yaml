summary:
  ar: "تدوينة ليوليا ريسوان، 27 ديسمبر 2024، عن «مغامرة القرآن»، المصحف الإندونيسي التفاعلي من دار القصبة التي تأسست سنة 2020، مع الترجمة الرسمية لوزارة الشؤون الدينية وترجمة كلمة بكلمة ورموز تفتح قصصًا مصوّرة."
