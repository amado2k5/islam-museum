  fr: "Article de Yulia Riswan, 27 décembre 2024, sur Al-Qur'an Adventure, le Coran indonésien interactif d'alQosbah, une maison d'édition fondée en 2020, avec la traduction du ministère des Affaires religieuses, une traduction mot à mot et des codes QR qui ouvrent des histoires animées."
