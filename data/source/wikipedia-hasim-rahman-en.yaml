summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هاشم رحمن؛ تُستخدم لوقائع الكيان فقط. تذكر مولده باسم هاشم شريف رحمن في 7 نوفمبر 1972 في بالتيمور بولاية ماريلاند، وفترتي بطولته للعالم في الوزن الثقيل ⁦(الألقاب الموحدة التي انتزعها من لينوكس لويس في أبريل 2001 ولقب المجلس العالمي للملاكمة 2005–2006)⁩، وسجل مسيرته، وتذكر أنه مسلم ممارس كان صائماً في رمضان حين واجه لويس."
  en: "English Wikipedia article on Hasim Rahman; used for entity facts only. It gives his birth as Hasim Shariff Rahman on 7 November 1972 in Baltimore, Maryland, his two heavyweight title reigns (the unified titles won from Lennox Lewis in April 2001 and the WBC title of 2005-2006), his career record, and states that he is a practising Muslim who was fasting during Ramadan when he faced Lewis."
  es: "Artículo de la Wikipedia en inglés sobre Hasim Rahman; utilizado únicamente para datos sobre la persona. Indica que nació como Hasim Shariff Rahman el 7 de noviembre de 1972 en Baltimore, Maryland, sus dos reinados como campeón de peso pesado (los títulos unificados que ganó a Lennox Lewis en abril de 2001 y el título del CMB de 2005-2006), su historial profesional y afirma que es un musulmán practicante que estaba ayunando durante el Ramadán cuando se enfrentó a Lewis."
  fr: "Article Wikipédia en anglais sur Hasim Rahman; utilisé uniquement pour les informations le concernant. Il indique sa naissance sous le nom de Hasim Shariff Rahman le 7 novembre 1972 à Baltimore, dans le Maryland, ses deux règnes de champion du monde des poids lourds (les titres unifiés remportés contre Lennox Lewis en avril 2001 et le titre WBC de 2005 à 2006), son palmarès et précise qu'il est un musulman pratiquant qui jeûnait pendant le Ramadan lorsqu'il a affronté Lewis."
  ur: "حسیم رحمان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ بالٹی مور، میری لینڈ میں 7 نومبر 1972 کو حسیم شریف رحمن کے طور پر ان کی پیدائش ہوئی، اس کے دو ہیوی ویٹ ٹائٹلز ⁦(اپریل 2001 میں لینکس لیوس سے جیتنے والے متحد ٹائٹلز اور 2005-2006 کے ڈبلیو بی سی ٹائٹل)⁩، ان کے کیریئر کا ریکارڈ، اور یہ بتاتا ہے کہ وہ ایک مشق کرنے والا مسلمان ہے جو روزے کی حالت میں لیوی کا سامنا کرتا تھا۔"
