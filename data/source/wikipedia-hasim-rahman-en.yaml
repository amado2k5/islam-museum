  ar: "مقالة ويكيبيديا الإنجليزية عن هاشم رحمن؛ تُستخدم لوقائع الكيان فقط. تذكر مولده باسم هاشم شريف رحمن في 7 نوفمبر 1972 في بالتيمور بولاية ماريلاند، وفترتي بطولته للعالم في الوزن الثقيل (الألقاب الموحدة التي انتزعها من لينوكس لويس في أبريل 2001 ولقب المجلس العالمي للملاكمة 2005–2006)، وسجل مسيرته، وتذكر أنه مسلم ممارس كان صائماً في رمضان حين واجه لويس."
  en: "English Wikipedia article on Hasim Rahman; used for entity facts only. It gives his birth as Hasim Shariff Rahman on 7 November 1972 in Baltimore, Maryland, his two heavyweight title reigns (the unified titles won from Lennox Lewis in April 2001 and the WBC title of 2005-2006), his career record, and states that he is a practising Muslim who was fasting during Ramadan when he faced Lewis."
