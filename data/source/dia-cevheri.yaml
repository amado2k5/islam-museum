reliability_note: "Read in the museum's session on 20 November 2026 (author Hulusi Kılıç, print edition 1993). It gives al-Jawhari as Turkic by origin, born at Farab; taught first by his maternal uncle Ishaq ibn Ibrahim al-Farabi (d. 350/961), then in Baghdad by Abu Sa'id al-Sirafi and Abu Ali al-Farisi; his long stay among the Rabi'a and Mudar tribes to collect material; and his death before 400/1009. It does not name his school. Used for entity facts only."
