reliability_note: "Read in full on 1 November 2026. A short article carrying the Arabic biographical tradition's own form of his name, Ahmad ibn Ishaq (so also al-Zirikli's al-A'lam), where the Brill sketch and the English and Urdu articles give Ahmad ibn Abi Ya'qub. It states he was born in Baghdad and died in Egypt in 284 AH (897 CE), adding 'and in other accounts 284 or 298 AH'; the 284 date is the traditional one the English article's scholarship now treats as a conflation, preserved here as the tradition's reading. Its madhhab section is the record's second attestation family for the faith question: it cites Muhsin al-Amin's A'yan al-Shia and Aqa Buzurg al-Tihrani's al-Dhari'a for the Shi'i affirmation and a Sunni heritage study for the Sunni affirmation — the Arabic tradition itself is divided, and neither side names a specific branch that the other accepts."
