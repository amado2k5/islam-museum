  ar: "مقالة ويكيبيديا العربية عن اليعقوبي؛ تسميه أحمد بن إسحاق بن جعفر بن وهب بن واضح، وتذكر ولادته في بغداد ووفاته في مصر سنة 284هـ مع رواية أخرى بسنة 298هـ، وفيها قسم عن مذهبه يثبت الخلاف: من يؤكد أنه شيعي ومن يؤكد أنه سني."
  en: "Arabic Wikipedia article on al-Ya'qubi; it names him Ahmad ibn Ishaq ibn Ja'far ibn Wahb ibn Wadih, states he was born in Baghdad and died in Egypt in 284 AH (897) with a variant report of 298 AH, and its section on his madhhab records the split plainly: some affirm he was a Shi'i, others that he was a Sunni."
