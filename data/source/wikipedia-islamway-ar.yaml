summary:
  ar: "مقالة ويكيبيديا العربية «موقع طريق الإسلام»، المراجعة 76998738 ⁦(17 أكتوبر 2026)⁩؛ لوقائع الكيان فقط: موقع صوتيات إسلامية بدأه شخصان أواخر 1998، ومنهجه وأهدافه كما يعلنها، وأقسامه وأعداد مواده كما يذكرها الموقع."
  en: "Arabic Wikipedia article 'Islamway website', revision 76998738 (17 October 2026); entity facts only: an Islamic audio site begun by two people in late 1998, its method and aims as it states them, and its sections and item counts as the site gives them."
  ur: "عربی ویکیپیڈیا کا مضمون «موقع طريق الإسلام»، نظرِ ثانی 76998738 ⁦(17 اکتوبر 2026)⁩؛ صرف حقائق: 1998 کے آخر میں دو افراد کی شروع کی ہوئی اسلامی صوتیات کی سائٹ، اس کا بیان کردہ منہج اور مقاصد، اور سائٹ کے بتائے ہوئے شعبے اور اعداد۔"
  es: "Artículo de Wikipedia en árabe «Sitio web Islamway», revisión 76998738 (17 de octubre de 2026); solo información sobre la entidad: un sitio de audio islámico creado por dos personas a finales de 1998, su método y objetivos tal como los declara, y sus secciones y recuentos de elementos tal como los proporciona el sitio."
  fr: "Article Wikipédia arabe « Site Web Islamway », révision 76998738 (17 octobre 2026); informations sur l'entité uniquement: un site audio islamique lancé par deux personnes à la fin de 1998, sa méthode et ses objectifs tels qu'ils sont énoncés, et ses sections et le nombre d'éléments tels que le site les indique."
  tr: "Arapça Vikipedi makalesi \"İslam'ın Yolu Sitesi\", revizyon 76998738 (17 Ekim 2026); sadece varlık için etkinlikler: 1998 sonlarında iki kişi tarafından başlatılan bir İslami Ses web sitesi, yaklaşımı ve hedefleri, bölümleri ve site tarafından belirtilen materyal sayısı ile."
  id: "Artikel Wikipedia Arab \"Situs Jalan Islam,\" revisi 76998738 (17 Oktober 2026); untuk acara entitas saja: sebuah situs Audio Islam yang didirikan oleh dua orang pada akhir 1998, dengan pendekatan dan tujuan yang diumumkan, bagian-bagiannya, serta jumlah materi yang disebutkan oleh situs tersebut."
