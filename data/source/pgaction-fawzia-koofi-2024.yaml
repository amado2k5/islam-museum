label: { en: "Fawzia Koofi — Parliamentarians for Global Action, Defender of Democracy Award 2024" }
summary:
  ar: "صفحة منظمة برلمانيون من أجل العمل العالمي عن جائزة المدافع عن الديمقراطية 2024؛ تصف كوفي بأنها أول نائبة لرئيس مجلس النواب الأفغاني وعضوة في فريق التفاوض على السلام، وأن عملها جعلها هدفًا للتهديدات."
  en: "Parliamentarians for Global Action page for the 2024 Defender of Democracy Award; it describes Koofi as the first female deputy speaker of the Afghan National Assembly and one of the few women on the peace negotiation team, whose work made her a target."
  es: "La página de Parlamentarios por la Acción Global para el Premio Defensor de la Democracia 2024 describe a Koofi como la primera mujer vicepresidenta de la Asamblea Nacional afgana y una de las pocas mujeres en el equipo de negociación de paz, cuyo trabajo la convirtió en objetivo."
  fr: "La page de Parliamentarians for Global Action consacrée au prix du défenseur de la démocratie 2024 décrit Koofi comme la première femme vice-présidente de l'Assemblée nationale afghane et l'une des rares femmes de l'équipe de négociation de paix, dont le travail a fait d'elle une cible."
  ur: "2024 ڈیفنڈر آف ڈیموکریسی ایوارڈ کے لیے پارلیمنٹرینز برائے گلوبل ایکشن صفحہ؛ اس میں کوفی کو افغان قومی اسمبلی کی پہلی خاتون ڈپٹی اسپیکر اور امن مذاکراتی ٹیم میں شامل چند خواتین میں سے ایک کے طور پر بیان کیا گیا ہے، جن کے کام نے انہیں ہدف بنایا۔"
  tr: "2024 Demokrasi Savunucuları Ödülü için Küresel Eylem Parlamenterleri sayfasında, Kofi Afgan Temsilciler Meclisi'nin ilk Başkan Yardımcısı ve barış müzakere ekibinin bir üyesi olarak tanımlanıyor ve çalışmaları onu tehditlerin hedefi haline getirmiş."
  id: "Halaman Parliamentarians for Global Action untuk Penghargaan Defenders of Democracy 2024 menggambarkan Kofi sebagai Wakil Ketua pertama Dewan Perwakilan Afghanistan dan anggota tim negosiasi perdamaian, serta pekerjaannya telah menjadikannya sasaran ancaman."
title: "PGA Honors Hina Jilani and Fawzia Koofi with the 2024 Defender of Democracy Award"
