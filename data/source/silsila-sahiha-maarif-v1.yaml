  en: "Silsilat al-Ahadith al-Sahiha wa-Shay' min Fiqhiha wa-Fawa'idiha — Muhammad Nasir al-Din al-Albani, Maktabat al-Ma'arif, Riyadh, vol. 1 (new edition)"
summary:
  ar: "المجلد الأول من الطبعة الجديدة لسلسلة الأحاديث الصحيحة للألباني ⁦(ت 1420هـ)⁩، نشر مكتبة المعارف للنشر والتوزيع لصاحبها سعد بن عبد الرحمن الراشد بالرياض؛ فيه مقدمة الطبعة الجديدة المؤرخة بعمّان في 8 رجب 1413هـ، ومقدمة الطبعة الأولى المؤرخة بدمشق في 14/12/1378هـ، ثم الأحاديث مرقمة بدءاً بباب «المستقبل للإسلام»."
  en: "Volume 1 of the new edition of al-Albani's (d. 1420 AH) Silsilat al-Ahadith al-Sahiha, published by Maktabat al-Ma'arif (owner Sa'd b. 'Abd al-Rahman al-Rashid), Riyadh; it contains the new-edition preface dated Amman, 8 Rajab 1413 AH, the first-edition preface dated Damascus, 14/12/1378 AH, and the numbered hadiths beginning with the section 'The future belongs to Islam'."
