  ar: "مقالة ويكيبيديا الإنجليزية عن منير الحدادي؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من أكاديمية برشلونة وهدفه في أول ظهور له سنة 2014 إلى إعاراته ومحطاته في إشبيلية وختافي ولاس بالماس وليغانيس، وفوزه بدوري أبطال أوروبا 2015 وبالدوري الأوروبي 2020، وتمثيله إسبانيا مرة ثم المغرب من 2021."
  en: "English Wikipedia article on Munir El Haddadi; used for entity facts only. It recounts his career from Barcelona's academy and his debut goal in 2014 through his loans and spells at Sevilla, Getafe, Las Palmas and Leganés, his 2015 Champions League and 2020 Europa League wins, his single Spain cap and his switch to Morocco in 2021."
