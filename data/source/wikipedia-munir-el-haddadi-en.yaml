summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن منير الحدادي؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من أكاديمية برشلونة وهدفه في أول ظهور له سنة 2014 إلى إعاراته ومحطاته في إشبيلية وختافي ولاس بالماس وليغانيس، وفوزه بدوري أبطال أوروبا 2015 وبالدوري الأوروبي 2020، وتمثيله إسبانيا مرة ثم المغرب من 2021."
  en: "English Wikipedia article on Munir El Haddadi; used for entity facts only. It recounts his career from Barcelona's academy and his debut goal in 2014 through his loans and spells at Sevilla, Getafe, Las Palmas and Leganés, his 2015 Champions League and 2020 Europa League wins, his single Spain cap and his switch to Morocco in 2021."
  es: "Artículo de la Wikipedia en inglés sobre Munir El Haddadi; utilizado únicamente para datos sobre la persona. Narra su trayectoria desde la cantera del Barcelona y su primer gol en 2014, pasando por sus cesiones y etapas en el Sevilla, Getafe, Las Palmas y Leganés, sus victorias en la Liga de Campeones de 2015 y la Liga Europa de 2020, su única convocatoria con la selección española y su fichaje por la selección de Marruecos en 2021."
  fr: "Article Wikipédia en anglais sur Munir El Haddadi; utilisé uniquement pour les informations sur l'entité. Il retrace son parcours depuis le centre de formation du FC Barcelone et son premier but en 2014, en passant par ses prêts et ses passages à Séville, Getafe, Las Palmas et Leganés, ses victoires en Ligue des champions en 2015 et en Ligue Europa en 2020, sa seule sélection en équipe nationale d'Espagne et son transfert au Maroc en 2021."
  ur: "منیر الحدادی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بارسلونا کی اکیڈمی سے اس کے کیریئر اور 2014 میں سیویلا، گیٹافے، لاس پالماس اور لیگانس میں اس کے قرضوں اور منتروں، اس کی 2015 کی چیمپئنز لیگ اور 2020 یوروپا لیگ کی جیت، اس کی واحد اسپین کیپ اور 2012 میں مراکش میں اس کے سوئچ کے ذریعے 2014 میں اس کے پہلے گول کا ذکر ہے۔"
