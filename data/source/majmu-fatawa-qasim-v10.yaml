label: { ar: "مجموع فتاوى شيخ الإسلام أحمد بن تيمية، جمع وترتيب عبد الرحمن بن محمد بن قاسم، المجلد العاشر ⁦(علم السلوك)⁩، مجمع الملك فهد، 1425هـ/2004م", en: "Majmu' Fatawa Shaykh al-Islam Ahmad ibn Taymiyya, compiled and arranged by Abd al-Rahman ibn Muhammad ibn Qasim, vol. 10 ('Ilm al-Suluk), King Fahd Complex, 1425 AH / 2004" }
summary:
  ar: "المجلد العاشر من مجموع فتاوى ابن تيمية في جمع عبد الرحمن بن محمد بن قاسم وابنه محمد، بعنوان «كتاب علم السلوك»، طبع في مجمع الملك فهد لطباعة المصحف الشريف بالمدينة المنورة سنة 1425هـ/2004م في 792 صفحة، وفيه التحفة العراقية وأمراض القلوب والعبودية ورسائل وفتاوى في التصوف وأعمال القلوب."
  en: "Volume 10 of Ibn Taymiyya's collected fatwas as compiled by Abd al-Rahman ibn Muhammad ibn Qasim with his son Muhammad, titled 'Kitab 'Ilm al-Suluk', printed by the King Fahd Complex for the Printing of the Holy Qur'an in Medina in 1425 AH / 2004 in 792 pages; it contains al-Tuhfa al-'Iraqiyya, Amrad al-Qulub, al-'Ubudiyya and treatises and fatwas on Sufism and the works of the heart."
title: "مجموع فتاوى شيخ الإسلام أحمد بن تيمية، المجلد العاشر: علم السلوك"
