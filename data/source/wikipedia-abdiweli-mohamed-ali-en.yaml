summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الولي محمد علي (غاس)؛ تُستخدم لوقائع الكيان فقط. تروي عمله أستاذ اقتصاد مشاركا في جامعة نياغرا، ورئاسته وزراء الصومال (2011–2012) خلفا لمحمد عبد الله محمد، ورئاسته بونتلاند (2014–2019). لا يذكر النص دينه شخصيا ولا مدرسته؛ وصندوقها يعطي ولادته سنة 1967 خلافا للعربية وويكيداتا (1965)."
  en: "English Wikipedia article on Abdiweli Mohamed Ali (Gaas); used for entity facts only. It recounts his work as an associate professor of economics at Niagara University, his premiership of Somalia (2011–2012) succeeding Mohamed Abdullahi Mohamed, and his presidency of Puntland (2014–2019). The text does not discuss his own religion or school; its infobox gives his birth in 1967, against the Arabic article and Wikidata (1965)."
