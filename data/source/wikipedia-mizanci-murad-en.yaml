reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. The article is a short stub flagged as resting on a single source (Zürcher) and asking for the Turkish article to be translated into it. Its birth year 1853 matches only the Turkish biography section's alternative reading, its death year 1912 is supported by no other source read, and its birthplace Tbilisi appears in no other source - the Turkish article and Wikidata place his birth in Dagestan and his death at Istanbul on 15 April 1917. It describes his stance as pan-Islamist, a political position, and names no madhhab for him."
