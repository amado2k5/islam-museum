  ar: "مقالة ويكيبيديا الإنجليزية القصيرة عن الصحفي والمؤرخ العثماني ميزانجي مراد؛ تُستخدم بحذر لوقائع الكيان فقط. تؤكد إطلاقه صحيفة «ميزان» سنة 1886 وعضويته في تركيا الفتاة ونفيه بعد 1909، لكن سنواتها (1853–1912) ومكان ولادتها (تبليسي) يخالفان المقال التركي وويكيبيانات ولا يُتّبعان."
  en: "Short English Wikipedia article on the Ottoman journalist and historian Mizanci Murad; used with caution for entity facts only. It confirms his launching of the Mizan newspaper in 1886, his Young Turk membership and his exile after 1909, but its dates (1853-1912) and its birthplace (Tbilisi) are contradicted by the Turkish article and Wikidata and are not followed."
