summary:
  ar: "مقالة ويكيبيديا الإنجليزية القصيرة عن الصحفي والمؤرخ العثماني ميزانجي مراد؛ تُستخدم بحذر لوقائع الكيان فقط. تؤكد إطلاقه صحيفة «ميزان» سنة 1886 وعضويته في تركيا الفتاة ونفيه بعد 1909، لكن سنواتها (1853–1912) ومكان ولادتها ⁦(تبليسي)⁩ يخالفان المقال التركي وويكيبيانات ولا يُتّبعان."
  en: "Short English Wikipedia article on the Ottoman journalist and historian Mizanci Murad; used with caution for entity facts only. It confirms his launching of the Mizan newspaper in 1886, his Young Turk membership and his exile after 1909, but its dates (1853-1912) and its birthplace (Tbilisi) are contradicted by the Turkish article and Wikidata and are not followed."
  es: "Breve artículo en inglés de la Wikipedia sobre el periodista e historiador otomano Mizanci Murad; úsese con precaución para verificar únicamente los datos sobre la persona. Confirma la fundación del periódico Mizan en 1886, su pertenencia a los Jóvenes Turcos y su exilio tras 1909, pero las fechas (1853-1912) y su lugar de nacimiento (Tiflis) se contradicen con el artículo en turco y Wikidata, y no se siguen."
  fr: "Court article de Wikipédia en anglais sur le journaliste et historien ottoman Mizanci Murad; à utiliser avec prudence, uniquement pour vérifier les informations factuelles le concernant. Il confirme la création du journal Mizan en 1886, son appartenance au mouvement Jeunes-Turcs et son exil après 1909, mais ses dates (1853-1912) et son lieu de naissance (Tbilissi) sont contredits par l’article turc et Wikidata et ne sont donc pas pris en compte."
  ur: "عثمانی صحافی اور مورخ میزانچی مراد پر مختصر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے احتیاط کے ساتھ استعمال کیا جاتا ہے۔ یہ 1886 میں میزان اخبار کے آغاز، اس کی ینگ ترک رکنیت اور 1909 کے بعد اس کی جلاوطنی کی تصدیق کرتا ہے، لیکن اس کی تاریخیں (1853-1912) اور اس کی جائے پیدائش ⁦(تبلیسی)⁩ ترکی کے مضمون اور وکی ڈیٹا سے متصادم ہیں اور اس کی پیروی نہیں کی گئی ہے۔"
  tr: "Osmanlı gazeteci ve tarihçi Mizancı Murad hakkında kısa İngilizce Vikipedi makalesi, yalnızca varlık hakkında temkinli bir şekilde kullanılmıştır. 1886'da 'Mizan' gazetesinin kurulmasını, Genç Türkiye'ye üyeliğini ve 1909'dan sonra sürgününü doğrular, ancak yılları (1853–1912) ve doğum yeri (Tiflis) Türkçe makale ve Vikipedilerle çelişir ve takip edilmez."
  id: "Artikel singkat Wikipedia bahasa Inggris tentang jurnalis dan sejarawan Ottoman Mizanci Murad digunakan dengan hati-hati hanya untuk fakta entitas tersebut. Ia mengonfirmasi peluncuran surat kabar 'Mizan' pada tahun 1886, keanggotaannya di Turki Muda, dan pengasingannya setelah 1909, tetapi tahun-tahun (1853–1912) dan tempat lahirnya (Tbilisi) bertentangan dengan artikel Turki dan Wikipedia serta tidak diikuti."
