summary:
  ar: "عنصر ويكي بيانات Q38823 لروح الله الخميني، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي للدين قيمتين: الإسلام (Q432) والتشيع الاثنا عشري (Q269785)، ويعطي للولادة قيمتين متنازعتين 24 أيلول 1902 و17 أيار 1900، وللوفاة 3 حزيران 1989 وقيمة شاردة 3 آذار 1989 لم تُتّبع."
  en: "Wikidata item Q38823 for Ruhollah Khomeini, grounded through the English article's pageprops; used for entity facts only. Its religion values are Islam (Q432) and Twelver Shi'ism (Q269785); its birth values are the two contested dates, 24 September 1902 and 17 May 1900; its death values are 3 June 1989 and a stray 3 March 1989 that is not followed."
  es: "Elemento de Wikidata Q38823 para Ruhollah Khomeini, basado en los pageprops del artículo en inglés; utilizado solo para datos de la entidad. Sus valores religiosos son Islam (Q432) y Chiismo duodecimano (Q269785); sus valores de nacimiento son las dos fechas controvertidas, 24 de septiembre de 1902 y 17 de mayo de 1900; sus valores de muerte son 3 de junio de 1989 y un 3 de marzo de 1989 que no se sigue."
  fr: "L'élément Wikidata Q38823 concernant Rouhollah Khomeini, basé sur les propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Ses valeurs religieuses sont l'islam (Q432) et le chiisme duodécimain (Q269785); ses dates de naissance sont contestées: le 24 septembre 1902 et le 17 mai 1900; ses dates de décès sont le 3 juin 1989 et une date isolée, le 3 mars 1989, qui n'est pas reprise."
  ur: "روح اللہ خمینی کے لیے Wikidata آئٹم Q38823، انگریزی مضمون کے صفحہ پروپس پر مبنی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی مذہبی اقدار ہیں اسلام (Q432) اور بارہویں شیعہ ازم (Q269785)؛ اس کی پیدائشی اقدار دو متنازعہ تاریخیں ہیں، 24 ستمبر 1902 اور 17 مئی 1900؛ اس کی موت کی قیمتیں 3 جون 1989 اور ایک آوارہ 3 مارچ 1989 ہے جس کی پیروی نہیں کی جاتی ہے۔"
  tr: "Wikidata öğesi Q38823 Ruhollah Khomeini'nin İngilizce makale sayfası properties aracılığıyla düzeltildi; yalnızca varlık gerçekleri için kullanılır. Dine iki değer atar: İslam (Q432) ve On İki Dönem Şiizmi (Q269785), doğumlara çelişkili değerler atar: 24 Eylül 1902 ve 17 Mayıs 1900, ölüme 3 Haziran 1989 ve rastgele değer olarak 3 Mart 1989 olarak uygulanmaz."
  id: "Elemen Wikidata Q38823 oleh Ruhollah Khomeini, diperbaiki melalui properti halaman artikel Inggris; digunakan hanya untuk fakta entitas. Atribut ini memberikan dua nilai pada agama: Islam (Q432) dan Syiah Dua Belas (Q269785), serta memberikan nilai yang bertentangan pada kelahiran pada 24 September 1902 dan 17 Mei 1900, serta pada kematian pada 3 Juni 1989, dan sebagai nilai liar pada 3 Maret 1989, yang tidak diikuti."
