summary:
  ar: "مدخل موسوعة سعوديبيديا عن عمر ياغي: نحو مئتي ورقة علمية، وجوائزه من جائزة إكسون 1998 إلى جائزة الملك فيصل 2015 وولف 2018 ونوابغ العرب 2024، وفوزه بجائزة نوبل في الكيمياء في 8 أكتوبر 2025 لتأسيسه الكيمياء الشبكية."
  en: "Saudipedia's entry on Omar Yaghi: nearly two hundred scientific papers, his awards from the 1998 Exxon Award to the 2015 King Faisal Prize, the 2018 Wolf Prize and the 2024 Great Arab Minds Award, and his Nobel Prize in Chemistry of 8 October 2025 for founding reticular chemistry."
  es: "La entrada de Saudipedia sobre Omar Yaghi incluye casi doscientos artículos científicos, sus premios, desde el Premio Exxon de 1998 hasta el Premio Rey Faisal de 2015, el Premio Wolf de 2018 y el Premio Grandes Mentes Árabes de 2024, y su Premio Nobel de Química del 8 de octubre de 2025 por fundar la química reticular."
  fr: "L'article de Saudipedia sur Omar Yaghi: près de deux cents articles scientifiques, ses récompenses allant du prix Exxon de 1998 au prix du roi Faisal de 2015, en passant par le prix Wolf de 2018 et le prix des grands esprits arabes de 2024, et son prix Nobel de chimie du 8 octobre 2025 pour ses travaux fondateurs sur la chimie réticulaire."
