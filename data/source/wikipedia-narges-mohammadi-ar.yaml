summary:
  ar: "مقالة ويكيبيديا العربية عن نرجس محمدي، الناشطة الحقوقية الإيرانية وحائزة جائزة نوبل للسلام؛ توافق المقالة الإنجليزية على مولدها في ٢١ نيسان ١٩٧٢ وعلى الخطوط العامة لنشاطها وسجونها."
  en: "Arabic Wikipedia article on Narges Mohammadi, Iranian human-rights activist and Nobel Peace Prize laureate; it agrees with the English article on her birth on 21 April 1972 and on the outline of her activism and imprisonments."
  es: "Artículo en árabe de la Wikipedia sobre Narges Mohammadi, activista iraní de derechos humanos y premio Nobel de la Paz; coincide con el artículo en inglés sobre su nacimiento el 21 de abril de 1972 y sobre el resumen de su activismo y sus encarcelamientos."
  fr: "L'article de Wikipédia en arabe sur Narges Mohammadi, militante iranienne des droits de l'homme et lauréate du prix Nobel de la paix, est en accord avec l'article en anglais concernant sa naissance le 21 avril 1972 et les grandes lignes de son militantisme et de ses emprisonnements."
  ur: "عربی ویکیپیڈیا مضمون نرگس محمدی، ایرانی انسانی حقوق کی کارکن اور نوبل امن انعام یافتہ؛ یہ 21 اپریل 1972 کو اس کی پیدائش اور اس کی سرگرمی اور قید کے خاکہ سے متعلق انگریزی مضمون سے متفق ہے۔"
  tr: "İranlı insan hakları aktivisti ve Nobel Barış Ödülü sahibi Narges Mohammadi hakkında Arapça Wikipedia makalesi; İngilizce makale, onun 21 Nisan 1972'deki doğumunu ve faaliyetlerinin genel çizgilerini ve hapishanelerini yansıtmaktadır."
  id: "Artikel Wikipedia berbahasa Arab tentang Narges Mohammadi, aktivis hak asasi manusia Iran dan peraih Nobel Perdamaian; artikel berbahasa Inggris sejalan dengan kelahirannya pada 21 April 1972, serta garis besar aktivitas dan penjaranya."
