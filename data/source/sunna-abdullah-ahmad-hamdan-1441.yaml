summary:
  ar: "تحقيق عادل بن عبد الله آل حمدان لكتاب السنة لأبي عبد الرحمن عبد الله ابن الإمام أحمد بن حنبل (213–290هـ)، الكتاب الأول من سلسلته «كتب السنة والاعتقاد»، على نسختي الظاهرية (644هـ) وجامعة أم القرى (783هـ)، الطبعة الرابعة 1441هـ/2020م، وفي أوله ترجمة المصنف ووصف النسخ وتوثيق النسبة وملاحظات على الطبعات السابقة."
  en: "Adil ibn Abd Allah Al Hamdan's edition of Kitab al-Sunna by Abu Abd al-Rahman Abd Allah, son of Imam Ahmad ibn Hanbal (213–290 AH), the first book of his series 'Books of the Sunna and Creed', based on the Zahiriyya manuscript (644 AH) and the Umm al-Qura University manuscript (783 AH), 4th edition 1441 AH / 2020; it opens with a biography of the author, the description of the manuscripts, the evidence for the attribution and remarks on earlier editions."
