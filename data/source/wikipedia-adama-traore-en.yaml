summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أداما تراوري ديارا؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من برشلونة إلى وولفرهامبتون وفولهام، وتصفه بأنه مسلم ممارس في سياق تقارير عن رمضان دون أن تسمّي أي مذهب."
  en: "English Wikipedia article on Adama Traoré Diarra; used for entity facts only. It recounts his career from Barcelona to Wolverhampton Wanderers and Fulham, and describes him as a practising Muslim in Ramadan reporting, without naming any school."
  es: "Artículo de la Wikipedia en inglés sobre Adama Traoré Diarra; utilizado únicamente para obtener información sobre la persona. Narra su trayectoria desde el Barcelona hasta el Wolverhampton Wanderers y el Fulham, y lo describe como un musulmán practicante que realizaba reportajes durante el Ramadán, sin mencionar ninguna escuela."
  fr: "Article Wikipédia en anglais sur Adama Traoré Diarra; utilisé uniquement à titre informatif. Il retrace sa carrière, de Barcelone à Wolverhampton Wanderers puis Fulham, et le décrit comme un musulman pratiquant lors de ses reportages sur le Ramadan, sans toutefois mentionner d'établissement scolaire."
  ur: "Adama Traoré Diarra پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بارسلونا سے وولور ہیمپٹن وانڈررز اور فلہم تک ان کے کیریئر کا ذکر کیا گیا ہے، اور کسی بھی اسکول کا نام لیے بغیر، رمضان کی رپورٹنگ میں اسے ایک عملی مسلمان کے طور پر بیان کیا گیا ہے۔"
  tr: "Adama Traoré Diarra hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Barcelona'dan Wolverhampton ve Fulham'a yolculuğunu anlatır; Ramazan haberlerinde herhangi bir mezhep belirtilmeden onu uygulayan bir Müslüman olarak tanımlar."
  id: "Artikel Wikipedia bahasa Inggris tentang Adama Traoré Diarra; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan perjalanannya dari Barcelona ke Wolverhampton dan Fulham, menggambarkannya sebagai Muslim yang taat dalam konteks laporan tentang Ramadan tanpa menyebutkan sekte manapun."
