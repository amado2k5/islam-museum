  ar: "مقالة ويكيبيديا الإنجليزية عن المترجم الكوري حامد تشوي ⁦(تشوي يونغ كيل، مولود 1949)⁩: دراسته في جامعة هانكوك والجامعة الإسلامية بالمدينة وجامعة أم درمان الإسلامية (1986)، وأستاذيته في جامعة ميونغجي، ورئاسته الاتحاد الإسلامي الكوري، وترجمته معاني القرآن (1997) وصحيح البخاري، وجائزة خادم الحرمين للترجمة (2009) وجائزة الملك فيصل (2023)."
  en: "English Wikipedia article on the Korean translator Hamid Choi (Choi Young-kil, born 1949): study at Hankuk University of Foreign Studies, the Islamic University of Madinah and Omdurman Islamic University (1986), his professorship at Myongji University, chairmanship of the Korea Muslim Federation, translations of the meanings of the Qur'an (1997) and Sahih al-Bukhari, the King Abdullah translation award (2009) and the King Faisal Prize (2023)."
