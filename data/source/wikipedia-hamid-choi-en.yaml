summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن المترجم الكوري حامد تشوي ⁦(تشوي يونغ كيل، مولود 1949)⁩: دراسته في جامعة هانكوك والجامعة الإسلامية بالمدينة وجامعة أم درمان الإسلامية (1986)، وأستاذيته في جامعة ميونغجي، ورئاسته الاتحاد الإسلامي الكوري، وترجمته معاني القرآن (1997) وصحيح البخاري، وجائزة خادم الحرمين للترجمة (2009) وجائزة الملك فيصل (2023)."
  en: "English Wikipedia article on the Korean translator Hamid Choi (Choi Young-kil, born 1949): study at Hankuk University of Foreign Studies, the Islamic University of Madinah and Omdurman Islamic University (1986), his professorship at Myongji University, chairmanship of the Korea Muslim Federation, translations of the meanings of the Qur'an (1997) and Sahih al-Bukhari, the King Abdullah translation award (2009) and the King Faisal Prize (2023)."
  es: "Artículo de la Wikipedia en inglés sobre el traductor coreano Hamid Choi (Choi Young-kil, nacido en 1949): estudios en la Universidad Hankuk de Estudios Extranjeros, la Universidad Islámica de Medina y la Universidad Islámica de Omdurman (1986), su cátedra en la Universidad Myongji, la presidencia de la Federación Musulmana de Corea, traducciones de los significados del Corán (1997) y Sahih al-Bukhari, el premio de traducción Rey Abdullah (2009) y el Premio Rey Faisal (2023)."
  fr: "Article de Wikipédia en anglais sur le traducteur coréen Hamid Choi (Choi Young-kil, né en 1949): études à l’Université Hankuk d’études étrangères, à l’Université islamique de Médine et à l’Université islamique d’Omdurman (1986), son poste de professeur à l’Université Myongji, sa présidence de la Fédération musulmane de Corée, ses traductions des significations du Coran (1997) et du Sahih al-Bukhari, le prix de traduction du roi Abdallah (2009) et le prix du roi Faisal (2023)."
  ur: "کورین مترجم حامد چوئی پر انگریزی ویکیپیڈیا کا مضمون ⁦(چوئی ینگ کِل، پیدائش 1949)⁩: ہانکوک یونیورسٹی آف فارن اسٹڈیز، اسلامک یونیورسٹی آف مدینہ اور اومدرمان اسلامک یونیورسٹی (1986) میں مطالعہ، میونگجی یونیورسٹی میں ان کی پروفیسری، کوریا مسلم فیڈریشن کی چیئرمین شپ، قرآن شریف کے ترجمے کنگ عبداللہ ترجمہ ایوارڈ (2009) اور شاہ فیصل انعام (2023)۔"
  tr: "Korece çevirmen Hamid Choi (Choi Yong Kil, 1949 doğumlu) hakkında İngilizce Wikipedia makalesi: Hankok Üniversitesi, Medine İslam Üniversitesi ve Omdurman İslam Üniversitesi'ndeki eğitimi (1986), Myeongji Üniversitesi'ndeki profesörlüğü, Kore İslam Federasyonu başkanlığı, Ma'ani al-Quran çevirisi (1997), İki Kutsal Cami Koruyucusu Çeviri Ödülü (2009) ve Kral Faysal Ödülü (2023)."
  id: "Artikel Wikipedia bahasa Inggris tentang penerjemah Korea Hamid Choi (Choi Yong Kil, lahir 1949): Studinya di Universitas Hankok, Universitas Islam Madinah, dan Universitas Islam Omdurman (1986), jabatan profesor di Universitas Myeongji, kepresidenannya di Federasi Islam Korea, terjemahan Ma'ani al-Quran (1997), Sahih al-Bukhari, Penghargaan Penjaga Terjemahan Dua Masjid Suci (2009), dan Penghargaan King Faisal (2023)."
