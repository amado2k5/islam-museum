  ar: "مقالة ويكيبيديا الملايوية عن سلطان منصور شاه، سادس سلاطين ملقا (1459 – أكتوبر 1477)؛ اسمه عند الولادة راجا عبد الله، ولقبه بعد الوفاة «مرحوم بوكيت»، وتذكر توسّعه ونظامه الضريبي وتعمّقه في الدين حتى التصوف وتتلمذه على مولانا أبي بكر وأمره بترجمة دار المنظوم وبناءه مسجدًا عند سفح بوكيت ملقا."
  en: "Malay Wikipedia article on Sultan Mansur Shah, sixth sultan of Malacca (1459 – October 1477); his birth name was Raja Abdullah and his posthumous name Marhum Bukit; it records his expansion, his tariff system, his deep study of religion up to Sufism as a pupil of Maulana Abu Bakar, his order to translate the Darul Manzum, and his building of a mosque at the foot of Bukit Melaka."
