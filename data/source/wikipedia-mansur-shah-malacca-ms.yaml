summary:
  ar: "مقالة ويكيبيديا الملايوية عن سلطان منصور شاه، سادس سلاطين ملقا ⁦(1459 – أكتوبر 1477)⁩؛ اسمه عند الولادة راجا عبد الله، ولقبه بعد الوفاة «مرحوم بوكيت»، وتذكر توسّعه ونظامه الضريبي وتعمّقه في الدين حتى التصوف وتتلمذه على مولانا أبي بكر وأمره بترجمة دار المنظوم وبناءه مسجدًا عند سفح بوكيت ملقا."
  en: "Malay Wikipedia article on Sultan Mansur Shah, sixth sultan of Malacca (1459 – October 1477); his birth name was Raja Abdullah and his posthumous name Marhum Bukit; it records his expansion, his tariff system, his deep study of religion up to Sufism as a pupil of Maulana Abu Bakar, his order to translate the Darul Manzum, and his building of a mosque at the foot of Bukit Melaka."
  es: "Artículo de Wikipedia en malayo sobre el sultán Mansur Shah, sexto sultán de Malaca (1459 - octubre de 1477); su nombre de nacimiento era Raja Abdullah y su nombre póstumo Marhum Bukit; en él se recogen su expansión, su sistema arancelario, su profundo estudio de la religión hasta el sufismo como discípulo de Maulana Abu Bakar, su orden de traducir el Darul Manzum y la construcción de una mezquita al pie de Bukit Melaka."
  fr: "Article malais de Wikipédia sur le sultan Mansur Shah, sixième sultan de Malacca (1459 – octobre 1477); son nom de naissance était Raja Abdullah et son nom posthume Marhum Bukit; il relate son expansion, son système tarifaire, son étude approfondie de la religion jusqu'au soufisme en tant qu'élève de Maulana Abu Bakar, son ordre de traduire le Darul Manzum et la construction d'une mosquée au pied de Bukit Melaka."
  ur: "ملاکا کے چھٹے سلطان، سلطان منصور شاہ ⁦(1459 - اکتوبر 1477)⁩ پر مالے ویکیپیڈیا کا مضمون؛ ان کا پیدائشی نام راجہ عبداللہ اور بعد از مرگ نام مرہم بکت تھا۔ اس میں ان کی توسیع، ان کے نرخوں کا نظام، مولانا ابوبکر کے شاگرد کی حیثیت سے تصوف تک مذہب کا گہرا مطالعہ، دارالمنظم کا ترجمہ کرنے کا ان کا حکم اور بکیت میلاکا کے دامن میں ان کی مسجد کی تعمیر کو درج کیا گیا ہے۔"
