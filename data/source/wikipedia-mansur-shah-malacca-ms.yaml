reliability_note: "Read in full on 1 November 2026. The Malay edition adds the birth name (Raja Abdullah, son of Raja Kassim — consistent with his father's birth name), the posthumous name, and an October 1477 death month that agrees with the tombstone's Rajab 882 AH; it quotes Tomé Pires' Suma Oriental on his wise rule and his mosque. On religion it substantially repeats the English article's tradition (the Malay Annals line, through Winstedt's scholarship), so the two editions count as one family for personal attestation; its infobox carries the same 'Islam Sunni' template value. No birth date is given, and its statement that the translation was made at Pasai complements rather than contradicts the English article's naming of the translator Makhdum Patakan."
