  en: "Muhammad ibn Salih al-'Uthaymin, al-Diya' al-Lami' min al-Khutab al-Jawami' — series of the Shaykh's works (28), printed under the supervision of the Shaykh Muhammad ibn Salih al-'Uthaymin Charitable Foundation, Dar al-Thurayya, Riyadh, 1440 AH/2019 CE"
summary:
  ar: "النشرة الموسعة لخطب ابن عثيمين، وفيها ما نشره المؤلف سنة 1392هـ ⁦(أكثر من 125 خطبة)⁩ وملحقه ⁦(118 خطبة)⁩، وأضافت إليها المؤسسة جميع الخطب الأولى المكتوبة بخطه التي ألقاها في الجامع الكبير بعنيزة من سنة 1376هـ إلى 1421هـ، ورتبها موضوعياً فهد بن ناصر السليمان؛ مع مقدمة اللجنة العلمية للمؤسسة ⁦(1424هـ)⁩ ومقدمتي المؤلف."
  en: "The expanded edition of Ibn 'Uthaymin's sermons. It holds what the author published in 1392 AH (more than 125 sermons) and his supplement (118 sermons), to which the Foundation added all the first sermons written in his own hand that he gave in the Great Mosque of 'Unayza from 1376 to 1421 AH, arranged by subject by Fahd ibn Nasir al-Sulayman. It has a preface by the Foundation's scholarly committee (1424 AH) and the author's two prefaces."
