label:
  ar: "الضياء اللامع من الخطب الجوامع لمحمد بن صالح العثيمين — سلسلة مؤلفات فضيلة الشيخ (28)، طُبع بإشراف مؤسسة الشيخ محمد بن صالح العثيمين الخيرية، دار الثريا، الرياض، 1440هـ/2019م"
  en: "Muhammad ibn Salih al-'Uthaymin, al-Diya' al-Lami' min al-Khutab al-Jawami' — series of the Shaykh's works (28), printed under the supervision of the Shaykh Muhammad ibn Salih al-'Uthaymin Charitable Foundation, Dar al-Thurayya, Riyadh, 1440 AH/2019 CE"
summary:
  ar: "النشرة الموسعة لخطب ابن عثيمين، وفيها ما نشره المؤلف سنة 1392هـ ⁦(أكثر من 125 خطبة)⁩ وملحقه ⁦(118 خطبة)⁩، وأضافت إليها المؤسسة جميع الخطب الأولى المكتوبة بخطه التي ألقاها في الجامع الكبير بعنيزة من سنة 1376هـ إلى 1421هـ، ورتبها موضوعياً فهد بن ناصر السليمان؛ مع مقدمة اللجنة العلمية للمؤسسة ⁦(1424هـ)⁩ ومقدمتي المؤلف."
  en: "The expanded edition of Ibn 'Uthaymin's sermons. It holds what the author published in 1392 AH (more than 125 sermons) and his supplement (118 sermons), to which the Foundation added all the first sermons written in his own hand that he gave in the Great Mosque of 'Unayza from 1376 to 1421 AH, arranged by subject by Fahd ibn Nasir al-Sulayman. It has a preface by the Foundation's scholarly committee (1424 AH) and the author's two prefaces."
  es: "Edición ampliada de los sermones de Ibn Uthaymin. Contiene lo que el autor publicó en 1392 AH (más de 125 sermones) y su suplemento (118 sermones), al que la Fundación añadió todos los primeros sermones escritos de su puño y letra que pronunció en la Gran Mezquita de Unayza entre 1376 y 1421 AH, ordenados por tema por Fahd ibn Nasir al-Sulayman. Incluye un prefacio del comité académico de la Fundación (1424 AH) y los dos prefacios del autor."
  fr: "L'édition augmentée des sermons d'Ibn 'Uthaymin comprend les sermons publiés par l'auteur en 1392 AH (plus de 125 sermons) et son supplément (118 sermons), auquel la Fondation a ajouté tous les premiers sermons manuscrits prononcés à la Grande Mosquée d'Unayza entre 1376 et 1421 AH, classés par sujet par Fahd ibn Nasir al-Sulayman. Elle est préfacée par le comité scientifique de la Fondation (1424 AH) et comprend deux préfaces de l'auteur."
  ur: "ابن عثیمین کے خطبات کا توسیعی ایڈیشن۔ اس میں مصنف نے 1392 ہجری میں شائع کردہ ⁦(125 سے زیادہ خطبات)⁩ اور اس کے ضمیمہ ⁦(118 خطبات)⁩ کو شامل کیا ہے، جس میں فاؤنڈیشن نے اپنے ہاتھ سے لکھے ہوئے تمام پہلے خطبات کو شامل کیا ہے جو اس نے 1376 سے 1421 ہجری تک جامع مسجد عنائزہ میں دیے تھے، جن کا اہتمام ابن الصغیر نے کیا تھا۔ اس کا ایک دیباچہ فاؤنڈیشن کی علمی کمیٹی ⁦(1424ھ)⁩ اور مصنف کے دو دیباچے ہیں۔"
  tr: "İbn Uthaymeen'in vaazlarının genişletilmiş yayımlanması; bu vaazlar, yazarın 1392 Hicri yılında yayımladığı (125'ten fazla vaaz) ve eklerini (118 vaaz) içermektedir. Vakıf, 1376 Hicri ile 1421 Hicri arasında Unaizah'taki Büyük Camii'de kendi el yazısıyla yazdığı tüm vaazları, Fahd bin Nasser Al-Sulaiman tarafından esaslı olarak düzenlenmiş ve vakfın bilimsel komitesinin (1424 Hicri) giriş ve yazarın girişlerini eklemiştir."
  id: "Publikasi yang diperluas dari khotbah Ibn Uthaymeen, yang mencakup apa yang diterbitkan penulis pada tahun 1392 H (lebih dari 125 khotbah) dan lampirannya (118 khotbah). Yayasan menambahkan semua khotbah pertama yang ditulis dengan tulisan tangannya sendiri yang disampaikan di Masjid Besar di Unaizah dari tahun 1376 H hingga 1421 H, yang diatur secara substansial oleh Fahd bin Nasser Al-Sulaiman, bersama dengan pengantar oleh komite ilmiah yayasan (1424 H) dan pengantar dari penulis."
