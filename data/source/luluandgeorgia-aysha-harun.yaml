summary:
  ar: "مقابلة لولو وجورجيا مع عائشة هارون بمناسبة تجديد غرفة نومها في لوس أنجلوس؛ تقول فيها إنها وُلدت ونشأت في تورونتو، وأنشأت أول فيديو لها صيف 2011 في السادسة عشرة، وبعد أحد عشر عامًا صار العمل مهنتها من منزلها في لوس أنجلوس، وتتحدث عن غياب تمثيل المبدعات السود والمسلمات المحجبات في الجمال، وعن إطلاق مجموعتها «المظهر السعيد يناسبك»."
  en: "Lulu and Georgia's interview with Aysha Harun, published for her Los Angeles bedroom makeover. In it she says she was born and raised in Toronto, created her first YouTube video in the summer of 2011 at sixteen, and that eleven years later content creation is her full-time career from her home in Los Angeles; she discusses the lack of representation of Black and Muslim hijab-wearing creators in beauty, and the launch of her apparel collection Happy Looks Good On You."
title: "Happy Looks Good On Aysha Harun — Lulu and Georgia"
