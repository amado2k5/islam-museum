summary:
  ar: "مقابلة لولو وجورجيا مع عائشة هارون بمناسبة تجديد غرفة نومها في لوس أنجلوس؛ تقول فيها إنها وُلدت ونشأت في تورونتو، وأنشأت أول فيديو لها صيف 2011 في السادسة عشرة، وبعد أحد عشر عامًا صار العمل مهنتها من منزلها في لوس أنجلوس، وتتحدث عن غياب تمثيل المبدعات السود والمسلمات المحجبات في الجمال، وعن إطلاق مجموعتها «المظهر السعيد يناسبك»."
  en: "Lulu and Georgia's interview with Aysha Harun, published for her Los Angeles bedroom makeover. In it she says she was born and raised in Toronto, created her first YouTube video in the summer of 2011 at sixteen, and that eleven years later content creation is her full-time career from her home in Los Angeles; she discusses the lack of representation of Black and Muslim hijab-wearing creators in beauty, and the launch of her apparel collection Happy Looks Good On You."
  es: "Entrevista de Lulu y Georgia con Aysha Harun, publicada con motivo de la renovación de su habitación en Los Ángeles. En ella, Aysha cuenta que nació y creció en Toronto, que creó su primer vídeo de YouTube en el verano de 2011 a los dieciséis años, y que once años después la creación de contenido es su profesión a tiempo completo desde su casa en Los Ángeles. Habla sobre la falta de representación de creadoras negras y musulmanas que usan hiyab en el mundo de la belleza, y sobre el lanzamiento de su colección de ropa Happy Looks Good On You."
  fr: "Lulu et Georgia ont interviewé Aysha Harun à l'occasion de la rénovation de sa chambre à Los Angeles. Elle y raconte être née et avoir grandi à Toronto, avoir créé sa première vidéo YouTube à l'été 2011, à l'âge de seize ans, et que, onze ans plus tard, la création de contenu est devenue son activité principale depuis son domicile à Los Angeles. Elle y aborde le manque de représentation des créatrices noires et musulmanes portant le hijab dans le secteur de la beauté, ainsi que le lancement de sa collection de vêtements « Happy Looks Good On You »."
  ur: "لولو اور جارجیا کا عائشہ ہارون کے ساتھ انٹرویو، اس کے لاس اینجلس کے بیڈروم میک اوور کے لیے شائع ہوا۔ اس میں وہ کہتی ہیں کہ وہ ٹورنٹو میں پیدا ہوئی اور پرورش پائی، اپنی پہلی یوٹیوب ویڈیو 2011 کے موسم گرما میں سولہ سال کی عمر میں بنائی، اور گیارہ سال بعد مواد کی تخلیق لاس اینجلس میں اپنے گھر سے اس کا کل وقتی کیریئر ہے۔ وہ خوبصورتی میں سیاہ فام اور مسلم حجاب پہننے والے تخلیق کاروں کی نمائندگی کی کمی، اور اپنے ملبوسات کے مجموعہ Happy Looks Good On You کے اجراء پر بات کرتی ہے۔"
  tr: "Los Angeles'taki yatak odasını yenileme vesilesiyle Lulu ve Georgia ile Aisha Haroun ile yapılan röportaj; Toronto'da doğup büyüdüğünü, ilk videosunu 2011 yazında on altı yaşında çektiğini ve on bir yıl sonra Los Angeles'taki evinden çalışmanın mesleği haline geldiğini söylüyor. Güzellikte Siyah ve Müslüman başörtüsü takan kadın yaratıcıların temsilinin eksikliğinden ve \"The Happy Appearance Suits You\" adlı koleksiyonunu başlatmaktan bahsediyor."
  id: "Wawancara dengan Lulu dan Georgia bersama Aisha Haroun dalam rangka renovasi kamar tidurnya di Los Angeles; ia mengatakan bahwa ia lahir dan besar di Toronto, membuat video pertamanya pada musim panas 2011 saat berusia enam belas tahun, dan setelah sebelas tahun, bekerja dari rumahnya di Los Angeles menjadi profesinya. Ia membahas tentang kurangnya representasi kreator perempuan kulit hitam dan Muslim yang mengenakan hijab dalam dunia kecantikan, serta tentang peluncuran koleksinya \"The Happy Appearance Suits You.\""
