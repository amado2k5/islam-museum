summary:
  ar: "الصفحة «Shamela index: literature and rhetoric books» — mr-mas.com؛ لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: توافر كتاب «al-Bayan wa-l-Tabyin» في المكتبة الشاملة، وهذا الرابط إحالة ببليوغرافية."
  en: "The page «Shamela index: literature and rhetoric books» — mr-mas.com; summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the availability of «al-Bayan wa-l-Tabyin» in the Shamela library; the link is a bibliographic pointer."
  ur: "صفحہ «Shamela index: literature and rhetoric books» — mr-mas.com؛ اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: شاملہ میں کتاب «al-Bayan wa-l-Tabyin» کی دستیابی؛ یہ ربط صرف کتابیاتی اشارہ ہے۔"
  fr: "La page «Shamela index: literature and rhetoric books» — mr-mas.com ; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : la présence de « al-Bayan wa-l-Tabyin » dans la bibliothèque Shamela ; le lien est un simple renvoi bibliographique."
  es: "La página «Shamela index: literature and rhetoric books» — mr-mas.com; resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: la presencia de «al-Bayan wa-l-Tabyin» en la biblioteca Shamela; el enlace es solo una referencia bibliográfica."
  tr: "\"Shamela index: literature and retoric books\" sayfası — mr-mas.com; kurucusu tarafından 21 Kasım 2026'da müzeye sunulan bir araştırma özetiyle özetlenmiştir; müze sayfayı açmamış ve kurucu özetin yeniden doğrulama yapılmadan kullanılmasını kabul etmiştir. Kitap şu bölümlerde kullanılmıştır: \"al-Bayan wa-l-Tabyin\" kitabının Kapsamlı Kütüphane'de bulunabilirliği ve bu bağlantı bibliyografik bir referanstır."
  id: "Halaman \"Indeks Shamala: buku sastra dan retorika\" — mr-mas.com; dirangkum oleh ringkasan penelitian yang diserahkan oleh pendiri ke museum pada 21 November 2026; museum tidak membuka halaman tersebut, dan pendiri setuju menggunakan ringkasan tanpa verifikasi ulang. Ringkasan tersebut digunakan dalam: Ketersediaan buku \"al-Bayan wa-l-Tabyin\" di Perpustakaan Komprehensif, dan tautan ini merupakan referensi bibliografi."
