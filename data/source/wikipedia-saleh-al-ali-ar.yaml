summary:
  ar: "مقالة ويكيبيديا العربية عن الشيخ صالح العلي؛ تُستخدم لوقائع الكيان فقط. تروي نسبه ونشأته في منطقة الشيخ بدر، وأن والده كان من مشايخ الطائفة العلوية المعروفين، وثورته على العثمانيين ثم الفرنسيين، ورفضه قيام الدولة العلوية."
  en: "Arabic Wikipedia article on Sheikh Saleh al-Ali; used for entity facts only. It recounts his origins at al-Shaykh Badr, that his father was one of the known sheikhs of the Alawite ta'ifa, his revolts against the Ottomans and then the French, and his refusal of a separate Alawite state."
  es: "Artículo en árabe de la Wikipedia sobre el jeque Saleh al-Ali; se utiliza únicamente para obtener información sobre su persona. Relata sus orígenes en al-Shaykh Badr, que su padre fue uno de los jeques más conocidos de la ta'ifa alauita, sus revueltas contra los otomanos y luego contra los franceses, y su rechazo a la creación de un estado alauita independiente."
  fr: "Article de Wikipédia en arabe sur le cheikh Saleh al-Ali; utilisé uniquement à des fins d'information sur l'entité. Il relate ses origines à al-Shaykh Badr, le fait que son père était l'un des cheikhs connus de la taïfa alaouite, ses révoltes contre les Ottomans puis les Français, et son refus d'un État alaouite séparé."
  ur: "شیخ صالح العلی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں الشیخ بدر میں ان کی ابتدا کا ذکر ہے، کہ ان کے والد علوی طائفہ کے معروف شیخوں میں سے ایک تھے، ان کی عثمانیوں اور پھر فرانسیسیوں کے خلاف بغاوتیں، اور علیحدہ علوی ریاست سے انکار۔"
  tr: "Şeyh Salih El-Ali hakkında Arapça Vikipedi makalesi; sadece varlığın olayları için kullanılmıştır. Şeyh Badr bölgesindeki soyundan ve yetiştirilme tarzından, babasının Alevi mezhebinin tanınmış şeyhlerinden biri olduğunu, Osmanlılara ve ardından Fransızlara karşı isyanını ve Alevi devletinin kurulmasını reddetmesini anlatır."
  id: "Artikel Wikipedia Arab tentang Sheikh Saleh Al-Ali; digunakan hanya untuk peristiwa entitas tersebut. Artikel ini menceritakan garis keturunan dan latar belakangnya di daerah Sheikh Badr, bahwa ayahnya adalah salah satu sheikh terkenal dari sekte Alawi, pemberontakannya terhadap Ottoman dan kemudian Prancis, serta penolakannya terhadap pendirian negara Alawi."
