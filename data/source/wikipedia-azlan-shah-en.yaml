summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عزلن شاه سلطان فيرق (1928–2014)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في باتو غاجه وشهادته في القانون من نوتنغهام، وتعيينيه القياسيين شابا قاضيا في المحكمة العليا (1965) ورئيسا للمحكمة الاتحادية (1982)، واعتلاءه عرش فيرق سنة 1984 وولايته تاسع ملوك ماليزيا (1989–1994)، وأزمة فيرق الدستورية سنة 2009، وقيادته للهوكي الماليزي والآسيوي، ووفاته في كوالالمبور في 28 مايو 2014."
  en: "English Wikipedia article on Azlan Shah of Perak (1928–2014); used for entity facts only. It recounts his Batu Gajah birth and Nottingham law degree, his record-young appointments as a High Court judge (1965) and as Lord President of the Federal Court (1982), his accession as Sultan of Perak in 1984 and his term as ninth Yang di-Pertuan Agong (1989–1994), the 2009 Perak constitutional crisis, his leadership of Malaysian and Asian hockey, and his death at Kuala Lumpur on 28 May 2014."
  es: "Artículo de la Wikipedia en inglés sobre Azlan Shah de Perak (1928-2014); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Batu Gajah y su licenciatura en derecho por la Universidad de Nottingham, sus nombramientos a una edad temprana como juez del Tribunal Superior (1965) y como Lord Presidente del Tribunal Federal (1982), su ascenso al trono como Sultán de Perak en 1984 y su mandato como noveno Yang di-Pertuan Agong (1989-1994), la crisis constitucional de Perak de 2009, su liderazgo en el hockey malasio y asiático, y su fallecimiento en Kuala Lumpur el 28 de mayo de 2014."
  fr: "Article de Wikipédia en anglais sur Azlan Shah de Perak (1928-2014); utilisé uniquement pour les informations relatives à l’entité. Il relate sa naissance à Batu Gajah et ses études de droit à Nottingham, ses nominations très précoces comme juge de la Haute Cour (1965) et comme Lord Président de la Cour fédérale (1982), son accession au trône de sultan de Perak en 1984 et son mandat de neuvième Yang di-Pertuan Agong (1989-1994), la crise constitutionnelle de Perak en 2009, son rôle à la tête du hockey malaisien et asiatique, et son décès à Kuala Lumpur le 28 mai 2014."
