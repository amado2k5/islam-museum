summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عزلن شاه سلطان فيرق (1928–2014)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في باتو غاجه وشهادته في القانون من نوتنغهام، وتعيينيه القياسيين شابا قاضيا في المحكمة العليا (1965) ورئيسا للمحكمة الاتحادية (1982)، واعتلاءه عرش فيرق سنة 1984 وولايته تاسع ملوك ماليزيا (1989–1994)، وأزمة فيرق الدستورية سنة 2009، وقيادته للهوكي الماليزي والآسيوي، ووفاته في كوالالمبور في 28 مايو 2014."
  en: "English Wikipedia article on Azlan Shah of Perak (1928–2014); used for entity facts only. It recounts his Batu Gajah birth and Nottingham law degree, his record-young appointments as a High Court judge (1965) and as Lord President of the Federal Court (1982), his accession as Sultan of Perak in 1984 and his term as ninth Yang di-Pertuan Agong (1989–1994), the 2009 Perak constitutional crisis, his leadership of Malaysian and Asian hockey, and his death at Kuala Lumpur on 28 May 2014."
