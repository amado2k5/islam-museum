  ar: "مقالة ويكيبيديا الإنجليزية عن جمال الكرام الثاني، سلطان سولو (1894–1915، وصاحب اللقب حتى وفاته)؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 27 آذار 1868 في جولو باسم أمير الكرام، ووفاته في 7 حزيران 1936 في مايمبونغ؛ ومربع معلوماتها لا يحمل حقل دين، ومتنها لا يسمي مذهبًا."
  en: "English Wikipedia article on Jamalul Kiram II, Sultan of Sulu (1894–1915, titular until his death); used for entity facts only. It gives his birth as 27 March 1868 at Jolo, with birth name Amirul Kiram, and his death as 7 June 1936 at Maimbung; its infobox carries no religion field and its text names no school."
