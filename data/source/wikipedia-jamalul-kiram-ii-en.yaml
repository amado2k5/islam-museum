  fr: "L'article de Wikipédia en anglais sur Jamalul Kiram II, sultan de Sulu (1894-1915, titre honorifique jusqu'à sa mort); il est utilisé uniquement pour les informations le concernant. Il indique sa naissance le 27 mars 1868 à Jolo, sous le nom d'Amirul Kiram, et son décès le 7 juin 1936 à Maimbung; son infobox ne comporte pas de champ sur la religion et son texte ne mentionne aucune école."
