reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 at the recorded revision, fetched by its revision id with the returned id asserted equal. The birth date is cited to the American Chamber of Commerce Journal of February 1927 and the reign dates to Forbes (1928); the article gives his reign as 22 February 1894 to 22 March 1915, titular thereafter, his father as Jamal ul-Azam, his predecessor as Harun Ar-Rashid, and his Senate service as 1931–1934. A footnote records that under the 1915 Carpenter Agreement he kept his title and his role as head of Islam in Sulu — an office, not a school. The article's categories incongruously file him under '1884 births' against its own cited 1868; the filing is not followed."
