  ar: "مقالة ويكيبيديا الإنجليزية عن علاء الدين خان (بهجاء Allauddin)؛ تُستخدم لوقائع الكيان فقط. تجعل مولده على الأرجح نحو 1881 في شيببور بالبنغال (وتذكر أعوام 1862 و1869 و1871 المتنازع عليها)، ووفاته في 6 سبتمبر 1972 في مَيهار، وتصف في قسم الدين صلاته اليومية (النماز) وولاءه العميق لمعبد ما شاردا في ميهار، دون أن تسمّي له انتماء أو مذهبا."
  en: "English Wikipedia article on Alauddin Khan (spelled Allauddin); used for entity facts only. It makes his birth most likely circa 1881 at Shibpur, Bengal (recording the rival years 1862, 1869 and 1871), his death on 6 September 1972 at Maihar, and in its Religion section describes his daily namaz alongside his deep devotion to the Maa Sharda temple at Maihar, naming no affiliation or school for him."
