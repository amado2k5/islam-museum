summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علاء الدين خان ⁦(بهجاء Allauddin)⁩؛ تُستخدم لوقائع الكيان فقط. تجعل مولده على الأرجح نحو 1881 في شيببور بالبنغال ⁦(وتذكر أعوام 1862 و1869 و1871 المتنازع عليها)⁩، ووفاته في 6 سبتمبر 1972 في مَيهار، وتصف في قسم الدين صلاته اليومية ⁦(النماز)⁩ وولاءه العميق لمعبد ما شاردا في ميهار، دون أن تسمّي له انتماء أو مذهبا."
  en: "English Wikipedia article on Alauddin Khan (spelled Allauddin); used for entity facts only. It makes his birth most likely circa 1881 at Shibpur, Bengal (recording the rival years 1862, 1869 and 1871), his death on 6 September 1972 at Maihar, and in its Religion section describes his daily namaz alongside his deep devotion to the Maa Sharda temple at Maihar, naming no affiliation or school for him."
  es: "Artículo de la Wikipedia en inglés sobre Alauddin Khan (escrito Allauddin); utilizado únicamente para datos sobre la persona. Indica que su nacimiento fue probablemente alrededor de 1881 en Shibpur, Bengala (registrando los años 1862, 1869 y 1871), su muerte el 6 de septiembre de 1972 en Maihar, y en su sección de Religión describe su oración diaria junto con su profunda devoción al templo Maa Sharda en Maihar, sin mencionar ninguna afiliación o escuela a la que perteneciera."
  fr: "L'article de Wikipédia en anglais sur Alauddin Khan (orthographié Allauddin) est utilisé uniquement pour les informations relatives à l'entité. Il situe sa naissance vers 1881 à Shibpur, au Bengale (avec les dates parfois contradictoires de 1862, 1869 et 1871), son décès le 6 septembre 1972 à Maihar, et décrit dans sa section « Religion » sa prière quotidienne ainsi que sa profonde dévotion au temple de Maa Sharda à Maihar, sans mentionner d'affiliation ni d'établissement scolaire."
  ur: "علاء الدین خان پر انگریزی ویکیپیڈیا مضمون ⁦(ہجے علاء الدین)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پیدائش تقریباً 1881 میں شیب پور، بنگال میں ہوئی ہے ⁦(مقابلے کے سال 1862، 1869 اور 1871 کی ریکارڈنگ)⁩، 6 ستمبر 1972 کو میہار میں ان کی موت، اور اس کے مذہبی حصے میں ان کی روزانہ کی نماز کے ساتھ ساتھ ماں شاردا کے مندر میں ان کی گہری عقیدت کو بیان کیا گیا ہے۔"
  tr: "Alauddin Khan (Bahja Allauddin) hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu muhtemelen 1881 civarında Bengal, Shippur'da (tartışmalı yıllar 1862, 1869 ve 1871), 6 Eylül 1972'de Mehar'da vefat ettiği ve dini bölümde olduğu belirtilir; günlük dualarını (dualarını) ve Mehar'daki Ma Derda tapınağına olan derin bağlılığını anlatır, ancak kendisi veya herhangi bir mezhebi adı verilmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Alauddin Khan (Bahja Allauddin); digunakan hanya untuk fakta entitas. Artikel ini menempatkan kelahirannya kemungkinan sekitar tahun 1881 di Shippur, Bengal (mencatat tahun yang diperdebatkan 1862, 1869, dan 1871), kematiannya pada 6 September 1972 di Mehar, dan di bagian agama, menggambarkan doa harian dan kesetiaannya yang mendalam kepada kuil Ma Derda di Mehar, tanpa menyebutkan namanya atau sekte mana pun untuknya."
