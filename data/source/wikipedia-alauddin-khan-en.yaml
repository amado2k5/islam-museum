reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. The Religion section (sourced to Nikhil Banerjee's memoir of his teacher) states that Khan performed his daily prayer or namaz while directing his student to his Gayatri Japa, that he would utter namaz while crying 'Ma, Ma' to Goddess Saraswati, and that he was deeply devoted to the Maa Sharda Devi temple at Maihar; his burial was attended by Hindus and Muslims alike and by the temple's chief priest. This is attested personal practice and devotion in one text; the article names no religious affiliation or school for him."
