summary:
  ar: "تقرير «مجلة دي» (دالاس) عن «روتس كوميونيتي سبيس» في إيرفينغ: عبد الرحمن ميرفي إمام مصري-أمريكي في دالاس يدير الفضاء ويدرّس في معهد قلم في أرلينغتون، أدار روتس أولا في نوكسفيل (افتتح 2011) حيث صار أول مرشد ديني مسلم في جامعة تينيسي، وجاء إلى دالاس سنة 2015 ليفتتح الفرع الثاني، ويعمل إماما مساعدا في مسجد بساوثليك."
  en: "D Magazine's (Dallas) report on the Roots Community Space in Irving: Abdel Rahman Murphy, an Egyptian-American imam in Dallas, directs the space and teaches at the Qalam Institute in Arlington; he first ran Roots in Knoxville (opened 2011), becoming the first Muslim chaplain at the University of Tennessee, came to Dallas in 2015 to start the second location, and works as an associate imam at a Southlake mosque."
