summary:
  ar: "تقرير «مجلة دي» ⁦(دالاس)⁩ عن «روتس كوميونيتي سبيس» في إيرفينغ: عبد الرحمن ميرفي إمام مصري-أمريكي في دالاس يدير الفضاء ويدرّس في معهد قلم في أرلينغتون، أدار روتس أولا في نوكسفيل ⁦(افتتح 2011)⁩ حيث صار أول مرشد ديني مسلم في جامعة تينيسي، وجاء إلى دالاس سنة 2015 ليفتتح الفرع الثاني، ويعمل إماما مساعدا في مسجد بساوثليك."
  en: "D Magazine's (Dallas) report on the Roots Community Space in Irving: Abdel Rahman Murphy, an Egyptian-American imam in Dallas, directs the space and teaches at the Qalam Institute in Arlington; he first ran Roots in Knoxville (opened 2011), becoming the first Muslim chaplain at the University of Tennessee, came to Dallas in 2015 to start the second location, and works as an associate imam at a Southlake mosque."
  es: "Según el reportaje de la revista D Magazine (Dallas) sobre el espacio comunitario Roots en Irving: Abdel Rahman Murphy, un imán egipcio-estadounidense de Dallas, dirige el espacio e imparte clases en el Instituto Qalam en Arlington; dirigió Roots por primera vez en Knoxville (inaugurado en 2011), convirtiéndose en el primer capellán musulmán de la Universidad de Tennessee, llegó a Dallas en 2015 para abrir la segunda sede y trabaja como imán asociado en una mezquita de Southlake."
  fr: "D'après le reportage de D Magazine (Dallas) sur l'espace communautaire Roots à Irving: Abdel Rahman Murphy, un imam égypto-américain de Dallas, dirige cet espace et enseigne à l'Institut Qalam d'Arlington; il a d'abord dirigé Roots à Knoxville (ouvert en 2011), devenant le premier aumônier musulman de l'Université du Tennessee, est venu à Dallas en 2015 pour ouvrir le deuxième site et travaille comme imam associé dans une mosquée de Southlake."
  ur: "ارونگ میں روٹس کمیونٹی اسپیس کے بارے میں ڈی میگزین ⁦(ڈلاس)⁩ کی رپورٹ: ڈیلاس میں ایک مصری نژاد امریکی امام، عبدالرحمن مرفی، خلاء کی ہدایت کرتے ہیں اور آرلنگٹن کے قلم انسٹی ٹیوٹ میں پڑھاتے ہیں۔ اس نے سب سے پہلے روٹس کو ناکس وِل میں چلایا ⁦(2011 کھولا)⁩، ٹینیسی یونیورسٹی میں پہلا مسلمان پادری بن گیا، دوسری جگہ شروع کرنے کے لیے 2015 میں ڈیلاس آیا، اور ساؤتھ لیک مسجد میں بطور ایسوسی ایٹ امام کام کرتا ہے۔"
  tr: "D Magazine (Dallas) tarafından Irving'deki Roots Community Space üzerine bir rapor: Abdel Rahman Murphy, Dallas'ta Mısır-Amerikalı bir imamdır, mekânı yönetir ve Arlington'daki Pen Institute'da ders vermektedir. İlk olarak Roots in Knoxville'i (2011'de açıldı) yönetti ve burada Tennessee Üniversitesi'nde ilk Müslüman dini lider oldu. 2015'te Dallas'a geldi, ikinci şubeyi açtı ve Southlake'teki bir camide yardımcı imam olarak çalışıyor."
  id: "Laporan oleh D Magazine (Dallas) tentang Roots Community Space di Irving: Abdel Rahman Murphy adalah imam Mesir-Amerika di Dallas yang mengelola ruang tersebut dan mengajar di Pen Institute di Arlington. Ia pertama kali mengelola Roots di Knoxville (dibuka 2011), di mana ia menjadi pemimpin agama Muslim pertama di University of Tennessee. Ia datang ke Dallas pada 2015 untuk membuka cabang kedua dan bekerja sebagai imam asisten di sebuah masjid di Southlake."
