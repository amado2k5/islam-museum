reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth in Istanbul on 7 June 1952, his education (Robert College; three years of architecture at Istanbul Technical University; journalism degree from Istanbul University, 1976), his novels from Cevdet Bey ve Oğulları (1982) to Nights of Plague (2021), My Name Is Red and its 2002–2003 awards, Snow (2002), the Museum of Innocence and the real museum he created for it in Istanbul, his Columbia University professorship, the 2006 Nobel Prize in Literature, the 2005–2006 prosecution over his Swiss-magazine remarks and its dismissal on 22 January 2006, the 27 March 2011 civil judgment ordering him to pay 6,000 liras in compensation, the plagiarism accusations reported against him and his refusal to answer them, and his self-description as a 'Cultural Muslim' who identifies with Islam historically and culturally while not believing in a personal connection to God. Read in full on 24 October 2026."
