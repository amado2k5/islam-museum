summary:
  ar: "يذكر المؤلف أنه انتهى من الكتاب سنة 1422هـ/2001م في نحو 1200 صفحة، وطُبع أكثر من عشر طبعات."
  en: "The author says he finished it in 1422/2001, about 1,200 pages, printed more than ten times."
  es: "El autor afirma haberlo terminado en 1422/2001, unas 1.200 páginas, impresas más de diez veces."
  fr: "L'auteur affirme l'avoir terminé en 1422/2001, environ 1 200 pages, imprimé plus de dix fois."
  ur: "مصنف کا کہنا ہے کہ اس نے اسے 1422/2001 میں مکمل کیا، تقریباً 1,200 صفحات، دس سے زیادہ مرتبہ پرنٹ ہوئے۔"
  tr: "Yazar, kitabı 1422 Hicri / 2001 M.S'de yaklaşık 1200 sayfada bitirdiğini ve ondan fazla baskı bastığını belirtir."
  id: "Penulis menyebutkan bahwa ia menyelesaikan buku ini pada tahun 1422 AH / 2001 M dalam sekitar 1200 halaman, dan telah mencetak lebih dari sepuluh edisi."
