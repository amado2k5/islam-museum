summary:
  ar: "مقالة ويكيبيديا العربية عن محمد كرد علي؛ تُستخدم لوقائع الكيان فقط. تروي سيرته ودراسته على شيوخ دمشق وصحافته وتأسيسه المجمع العلمي العربي، وتقرن حياته بعامي 1293–1372 هـ."
  en: "Arabic Wikipedia article on Muhammad Kurd Ali; used for entity facts only. It recounts his studies under Damascus scholars including Tahir al-Jazairi, his journalism in Cairo and Damascus and the founding of the Arab Academy, and pairs his life with the years 1293–1372 AH."
  es: "Artículo de Wikipedia en árabe sobre Muhammad Kurd Ali; utilizado únicamente para datos sobre la persona. Relata sus estudios con eruditos de Damasco, entre ellos Tahir al-Jazairi, su labor periodística en El Cairo y Damasco, la fundación de la Academia Árabe y sitúa su vida entre los años 1293 y 1372 de la Hégira."
  fr: "Article de Wikipédia en arabe sur Muhammad Kurd Ali; utilisé uniquement à des fins d’information sur l’entité. Il relate ses études auprès de savants damassiens, notamment Tahir al-Jazairi, son activité de journaliste au Caire et à Damas, ainsi que la fondation de l’Académie arabe, et situe sa vie entre 1293 et 1372 de l’Hégire."
  ur: "محمد کرد علی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں طاہر الجزائری، قاہرہ اور دمشق میں ان کی صحافت اور عرب اکیڈمی کے قیام سمیت دمشق کے علماء کے تحت ان کی تعلیم کا ذکر کیا گیا ہے، اور ان کی زندگی کو 1293-1372 ہجری کے ساتھ جوڑ دیا گیا ہے۔"
