reliability_note: "Caltech Archives oral history OH_Zewail_A, interview sessions 17 June and 21 November 2015 plus the full transcript PDF (2.36 MB). Read: the collection landing page with the full abstract and the opening of the transcript (table of contents and early sessions). The abstract and transcript confirm: Desouk childhood on the Nile, the 'moderate, intellectually rich' Islam of his day, mosque study after school with friends and the imam blessing their pursuit of knowledge, BSc 1967 and MSc 1969 at Alexandria, PhD 1974 at Pennsylvania with R. Hochstrasser, Berkeley postdoc with C. Harris, Caltech faculty 1976 after turning down other posts including one in Iraq, the decade of work leading in 1987 to the first direct observations of bond making and breaking with R. Bernstein, the King Faisal and Wolf Prizes, the 1999 Nobel announcement, post-Nobel 4D electron microscopy and the Physical Biology Center for Ultrafast Science and Technology, Zewail City discussions with President Mubarak, and the 2011 Egyptian Spring. Copyright Caltech 2017."
