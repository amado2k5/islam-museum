  en: "Ahmed H. Zewail Oral History Interview, Caltech Archives"
  ur: "کیلیفورنیا انسٹیٹیوٹ آف ٹیکنالوجی آرکائیوز میں احمد زویل کا زبانی حلیہ"
summary:
  ar: "مقابلة شفهية في سبع جلسات ⁦(يونيو-نوفمبر 2015)⁩ أجرتها هايدي أسباتوريان مع زويل: نشأته في دسوق على ضفاف النيل، إسلام معتدل «مليء فكرياً» في شبابه، دراسته في الإسكندرية وبيركلي وكاليفورنيا، وعقد من العمل قاد في 1987 إلى أول الملاحظات المباشرة لتكوين الروابط الكيميائية وكسرها."
  en: "An oral history in seven sessions (June-November 2015) conducted by Heidi Aspaturian with Zewail: his upbringing in Desouk on the Nile, the 'moderate, intellectually rich' Islam of his youth, his studies at Alexandria, Berkeley and Caltech, and the decade of work that led in 1987 to the first direct observations of chemical bond making and breaking."
  ur: "ہیدی اسپاتوریان کی طرف سے سات سیشنوں ⁦(جون-نومبر 2015)⁩ میں زویل کا زبانی انٹرویو: نیل کے کنارے دسوق میں پرورش، جوانی کا «معتدل، فکری طور پر مالا مال» اسلام، الیکزینڈریا، برکلے اور کیلیفورnia کی تعلیم، اور وہ دہائی کا کام جس نے 1987 میں کیمیائی جوڑوں کے بننے اور ٹوٹنے کے پہلے براہ راست مشاہدات دیے۔"
  es: "Una historia oral en siete sesiones (junio-noviembre de 2015) realizada por Heidi Aspaturian con Zewail: su infancia en Desouk, a orillas del Nilo, el Islam \"moderado e intelectualmente rico\" de su juventud, sus estudios en Alejandría, Berkeley y Caltech, y la década de trabajo que condujo en 1987 a las primeras observaciones directas de la formación y ruptura de enlaces químicos."
  fr: "Une histoire orale en sept séances (juin-novembre 2015) menée par Heidi Aspaturian avec Zewail: son éducation à Desouk sur le Nil, l'islam « modéré et intellectuellement riche » de sa jeunesse, ses études à Alexandria, Berkeley et Caltech, et la décennie de travail qui a conduit en 1987 aux premières observations directes de la formation et de la rupture des liaisons chimiques."
  tr: "Heidi Spatorian tarafından Zewail ile yapılan yedi oturumda (Haziran-Kasım 2015) yapılan sözlü röportaj: Nil kıyısındaki Desouk'ta yetiştirilmesi, gençliğinde ılımlı İslam'ı 'entelektüel olarak dolu', Alexandria, Berkeley ve California'daki çalışmaları ve 1987'de kimyasal bağların oluşumu ve kırılması üzerine ilk doğrudan gözlemlere yol açan on yıllık çalışmaları."
  id: "Wawancara lisan yang dilakukan dalam tujuh sesi (Juni-November 2015) oleh Heidi Spatorian bersama Zewail: masa kecilnya di Desouk di tepi Sungai Nil, Islam moderat yang 'penuh intelektual' saat muda, studinya di Alexandria, Berkeley, dan California, serta satu dekade kerja yang pada tahun 1987 mengarah pada pengamatan langsung pertama tentang pembentukan dan pemutusan ikatan kimia."
