  en: "Transitional Constitutional Document of Sudan, as amended in 2025 (Direct PDF of the Official Gazette of the Sudan Ministry of Justice)"
summary:
  ar: "«الوثيقة الدستورية الانتقالية السودانية بعد تعديل 2025»، كما يُنشر عند: ملف PDF المباشر للجريدة الرسمية لوزارة العدل السودانية. العنوان ونص المادة 6 ب مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Transitional Constitutional Document of Sudan, as amended in 2025, as published at: Direct PDF of the Official Gazette of the Sudan Ministry of Justice. The address and the wording of Article 6(b) come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Transitional Constitutional Document of Sudan, as amended in 2025، جیسا کہ Direct PDF of the Official Gazette of the Sudan Ministry of Justice پر شائع ہے۔ پتہ اور دفعہ 6 ب کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Transitional Constitutional Document of Sudan, as amended in 2025, tel que publié à : Direct PDF of the Official Gazette of the Sudan Ministry of Justice. L'adresse et le texte (article 6, lettre b) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Transitional Constitutional Document of Sudan, as amended in 2025, tal como se publica en: Direct PDF of the Official Gazette of the Sudan Ministry of Justice. La dirección y el texto (artículo 6, letra b) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"2025 Değişikliği Sonrası Sudan Geçiş Anayasa Belgesi,\" şu adreste yayımlanmıştır: Sudan Adalet Bakanlığı Resmi Gazetesi'nin Canlı PDF dosyası. Madde 6b'nin başlığı ve metni, müze tarafından sağlanan bir araştırma özetinden alınmıştır ve müze sayfayı açmamıştır; kurucu, metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Dokumen Konstitusi Transisi Sudan setelah Amandemen 2025,\" sebagaimana diterbitkan di: File PDF Langsung Lembaran Negara Kementerian Kehakiman Sudan. Judul dan teks Pasal 6b diambil dari ringkasan penelitian yang disediakan oleh museum, dan museum tidak membuka halaman tersebut; pendiri mengizinkan penggunaan teks tersebut sebagaimana dinyatakan pada 21 November 2026."
