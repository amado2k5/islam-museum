summary:
  ar: "مقالة ويكيبيديا الأردية عن مايك تايسون؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 30 يونيو 1966 في بروكلين ورواية لمسيرته ⁦(58 نزالاً، 50 فوزاً، 44 بالضربة القاضية، 6 هزائم في النسخة المستشارة)⁩، وتذكر أنه قبل الإسلام اقتداءً بمحمد علي."
  en: "Urdu Wikipedia article on Mike Tyson; used for entity facts only. It gives his birth on 30 June 1966 in Brooklyn and a career account (58 bouts, 50 wins, 44 by knockout, 6 losses in the version consulted), and states that, following Muhammad Ali, he accepted Islam."
  es: "Artículo de Wikipedia en urdu sobre Mike Tyson; utilizado únicamente para obtener información sobre la persona. Indica que nació el 30 de junio de 1966 en Brooklyn y ofrece un resumen de su carrera (58 combates, 50 victorias, 44 por nocaut, 6 derrotas en la versión consultada), y afirma que, siguiendo los pasos de Muhammad Ali, se convirtió al islam."
  fr: "Article de Wikipédia en ourdou sur Mike Tyson; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 30 juin 1966 à Brooklyn et un compte rendu de sa carrière (58 combats, 50 victoires, dont 44 par KO, 6 défaites dans la version consultée), et précise que, suivant Muhammad Ali, il s’est converti à l’islam."
  ur: "مائیک ٹائسن پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 30 جون 1966 کو بروکلین میں اس کی پیدائش اور کیریئر کے اکاؤنٹ ⁦(58 مقابلے، 50 جیت، 44 ناک آؤٹ، 6 ہارے ہوئے ورژن میں مشورہ)⁩ بتاتا ہے اور بتاتا ہے کہ محمد علی کی پیروی کرتے ہوئے، اس نے اسلام قبول کیا۔"
  tr: "Mike Tyson hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Makale, 30 Haziran 1966'da Brooklyn'de doğduğundan ve kariyerinin anlatısından (danışma versiyonunda 58 dövüş, 50 galibiyet, 44 nakavt, 6 mağlubiyet) ve Muhammed Ali örneğini takip ederek İslam'ı kabul ettiğini belirtir."
  id: "Artikel Wikipedia Urdu tentang Mike Tyson; digunakan hanya untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya pada 30 Juni 1966 di Brooklyn dan narasi kariernya (58 pertarungan, 50 kemenangan, 44 KO, 6 kekalahan dalam versi advisor), dan disebutkan bahwa ia menerima Islam mengikuti contoh Muhammad Ali."
