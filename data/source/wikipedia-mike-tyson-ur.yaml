reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026. It asserts that after accepting Islam he took the name Malik Umar bin Abdul Aziz and now lives as a practising Muslim; this conflicts with the English and Arabic articles, which state that the reported Muslim name is false and that he never changed his name, and the museum follows the English and Arabic articles on the point. It names no school for him. Its career figures predate his 2024 comeback bout and are not followed."
