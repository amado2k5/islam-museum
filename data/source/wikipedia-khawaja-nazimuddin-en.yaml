  ar: "مقالة ويكيبيديا الإنجليزية عن خواجة ناظم الدين (1894–1964)، ثاني حاكم عام لباكستان (1948–1951) وثاني رئيس وزرائها (1951–1953)؛ تعطي مولده في 19 تموز 1894 في دكا ووفاته فيها في 22 تشرين الأول 1964 ودفنه في ضريح القادة الثلاثة، وتصفه بأنه وُلد في أسرة مسلمة ثرية دون أن تسمي مذهبه في أي نص."
  en: "The English Wikipedia article on Khawaja Nazimuddin (1894–1964), Pakistan's second governor-general (1948–1951) and second prime minister (1951–1953); it gives his birth on 19 July 1894 at Dacca, his death there on 22 October 1964 and his burial in the Mausoleum of Three Leaders, and says he was born into a wealthy Muslim family without naming any school for him in its text."
