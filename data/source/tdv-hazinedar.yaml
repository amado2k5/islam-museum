summary:
  ar: "مدخل «حازندار» في موسوعة TDV الإسلامية التركية، ويتناول وظيفة حفظ المال وصرفه من عهد النبي والخلفاء الراشدين، وخزانة الخليفة الخاصة في العهد العباسي، ومن بعدها الحزانة في الدول البويهية والسامانية والقراخانية والغزنوية والسلجوقية والأيوبية والمملوكية والمغولية، ثم الخزانة في الدولة العثمانية وبخاصة رئاسة الحزانة في الإنديرون."
  en: "The TDV İslâm Ansiklopedisi entry 'Hazinedar' (treasurer). It covers the keeping and paying out of public funds from the time of the Prophet and the Rightly Guided caliphs, the caliph's private treasury under the Abbasids, the treasury offices of the Buyid, Samanid, Karakhanid, Ghaznavid, Seljuk, Ayyubid, Mamluk and Mongol states, and the Ottoman palace treasury, especially the chief treasurer of the Enderun. The entry is by Erdoğan Merçil."
