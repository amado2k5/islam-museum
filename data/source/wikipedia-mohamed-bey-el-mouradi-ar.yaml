summary:
  ar: "مقالة ويكيبيديا العربية عن محمد باي المرادي؛ تُستخدم لوقائع الكيان فقط. تجعله باي تونس الخامس من 1686 إلى وفاته في 14 تشرين الأول 1696، الابن الأكبر لمراد باي الثاني، وتسرد صراعه مع أخيه علي وعمه محمد الحفصي ومنشآته في تونس وداخل البلاد وخلفه رمضان باي."
  en: "Arabic Wikipedia article on Muhammad Bey al-Muradi; used for entity facts only. It makes him the fifth Bey of Tunis from 1686 to his death on 14 October 1696, the eldest son of Murad II Bey, narrates his struggle with his brother Ali and his uncle Muhammad al-Hafsi, lists his buildings in Tunis and the interior — including the Al Bey Mosque at Kairouan — and gives his brother Ramadan Bey as successor."
  es: "Artículo de Wikipedia en árabe sobre Muhammad Bey al-Muradi; utilizado únicamente para datos sobre la persona. Lo describe como el quinto Bey de Túnez desde 1686 hasta su muerte el 14 de octubre de 1696, el hijo mayor de Murad II Bey, narra su lucha con su hermano Ali y su tío Muhammad al-Hafsi, enumera sus construcciones en Túnez y el interior del país —incluida la Mezquita Al Bey en Kairouan— y nombra a su hermano Ramadan Bey como su sucesor."
  fr: "Article de Wikipédia en arabe sur Muhammad Bey al-Muradi; utilisé uniquement à des fins d’information sur l’entité. Il le présente comme le cinquième bey de Tunis de 1686 à sa mort le 14 octobre 1696, fils aîné de Murad II Bey, relate sa lutte contre son frère Ali et son oncle Muhammad al-Hafsi, énumère ses constructions à Tunis et à l’intérieur du pays — dont la mosquée Al Bey à Kairouan — et désigne son frère Ramadan Bey comme successeur."
  ur: "عربی ویکیپیڈیا مضمون محمد بی المرادی پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے اسے 1686 سے 14 اکتوبر 1696 کو اپنی موت تک تیونس کا پانچواں بے بنا دیا، مراد II بے کا بڑا بیٹا، اپنے بھائی علی اور اپنے چچا محمد الحفصی کے ساتھ اپنی جدوجہد بیان کرتا ہے، تیونس میں اپنی عمارتوں اور اندرونی حصوں کی فہرست بناتا ہے - جس میں کیروان کی البی مسجد بھی شامل ہے - اور بی راورما کو اپنے بھائی کے طور پر کامیابی عطا کرتا ہے۔"
