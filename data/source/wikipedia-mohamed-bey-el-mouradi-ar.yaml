  ar: "مقالة ويكيبيديا العربية عن محمد باي المرادي؛ تُستخدم لوقائع الكيان فقط. تجعله باي تونس الخامس من 1686 إلى وفاته في 14 تشرين الأول 1696، الابن الأكبر لمراد باي الثاني، وتسرد صراعه مع أخيه علي وعمه محمد الحفصي ومنشآته في تونس وداخل البلاد وخلفه رمضان باي."
  en: "Arabic Wikipedia article on Muhammad Bey al-Muradi; used for entity facts only. It makes him the fifth Bey of Tunis from 1686 to his death on 14 October 1696, the eldest son of Murad II Bey, narrates his struggle with his brother Ali and his uncle Muhammad al-Hafsi, lists his buildings in Tunis and the interior — including the Al Bey Mosque at Kairouan — and gives his brother Ramadan Bey as successor."
