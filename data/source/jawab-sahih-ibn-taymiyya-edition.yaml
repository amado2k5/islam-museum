reliability_note: "نسخة مطبوعة (الجزء الأول) ممسوحة ضوئياً ومقروءة آلياً (OCR)؛ الملف الكامل في الدرايف ضخم ولم يُقرأ منه بعد إلا الصفحات الأولى (p1–p4) من التعريف بالكتاب. دار النشر والمحقق والمحرر غير مقروءين بوضوح في الصفحات المقروءة؛ المقدمة التعريفية في p3 تُنسب في النص إلى «السيد علي صبح المدني» وتحتاج إلى تأكيد من الغلاف الداخلي. تواريخ المؤلف (661–728هـ) من صفحة العنوان p1 وحدها. أرقام الاستشهاد هي أرقام صفحات الملف الممسوح ([pN])."
