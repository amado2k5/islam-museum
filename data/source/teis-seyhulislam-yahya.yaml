reliability_note: "Scholarly biographical dictionary entry; the biography and works sections were read in full. Gives the rival birth years 960/1552 and 969/1561 and follows the testimony of contemporaries for 1561, death on 18 Dhu'l-Hijja 1053 / 27 February 1644 at Istanbul, burial beside his father Bayramzade Zekeriya Efendi's medrese at Sultan Selim, the three Shaykh al-Islam terms totalling 18 years, 2 months and 25 days, and the works (Divan, the Fera'iz commentary, the Burda tahmis, the Nigâristân, the Fetâvâ). It expressly distinguishes him from Bostanzade Yahya Efendi, the author of the Vak'a-i Sultan Osman. It names no madhhab for him."
