summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن داون كانغ ⁦(1931–1992)⁩؛ لوقائع الكيان فقط: مهندس كهربائي كوري-أمريكي وُلد في كيجو ⁦(سول اليوم)⁩ ودرس الفيزياء في جامعة سول الوطنية وهاجر إلى الولايات المتحدة 1955 فنال الدكتوراه من جامعة ولاية أوهايو 1959، عمل باحثاً في مختبرات بِل بموراي هيل وصنع مع محمد عطا الله أول موسفت عام 1959 بعمليتي PMOS وNMOS بمقياس 20 ميكرومتراً، وشاركه ريادة أجهزة الحامل الحار ⁦(شوتكي)⁩ وترانزستور القاعدة النانوية، ثم اخترع مع سيمون من تسي موسفت البوابة العائمة عام 1967 أساس EPROM وEEPROM والذاكرة الوميضية، ورأس معهد NEC للبحوث، ونال ميدالية بالانتين 1975 وأُدخل قاعة مشاهير المخترعين 2009."
  en: "English Wikipedia article on Dawon Kahng ⁦(1931–1992)⁩; entity facts only: Korean-American electrical engineer born in Keijo ⁦(now Seoul)⁩, physics at Seoul National University, emigrated to the United States in 1955 and took his doctorate at Ohio State University in 1959, researcher at Bell Telephone Laboratories in Murray Hill, built the first MOSFET with Mohamed Atalla in 1959 with both PMOS and NMOS processes at 20 micrometres, co-pioneered hot-carrier (Schottky) devices and the metal nanolayer-base transistor, invented the floating-gate MOSFET with Simon Min Sze in 1967 — the basis of EPROM, EEPROM and flash memory — became founding president of the NEC Research Institute, won the Stuart Ballantine Medal in 1975 and entered the National Inventors Hall of Fame in 2009."
  es: "Artículo de la Wikipedia en inglés sobre Dawon Kahng (1931–1992); solo datos de la entidad: ingeniero eléctrico coreano-estadounidense nacido en Keijo (ahora Seúl), físico en la Universidad Nacional de Seúl, emigró a los Estados Unidos en 1955 y obtuvo su doctorado en la Universidad Estatal de Ohio en 1959, investigador en los Laboratorios Bell Telephone en Murray Hill, construyó el primer MOSFET con Mohamed Atalla en 1959 con procesos PMOS y NMOS a 20 micrómetros, fue co-pionero de los dispositivos de portadores calientes (Schottky) y del transistor basado en nanocapas metálicas, inventó el MOSFET de puerta flotante con Simon Min Sze en 1967 —la base de la EPROM, la EEPROM y la memoria flash— se convirtió en presidente fundador del Instituto de Investigación NEC, ganó la Medalla Stuart Ballantine en 1975 e ingresó en el Salón Nacional de la Fama de los Inventores en 2009."
  fr: "Article de Wikipédia en anglais sur Dawon Kahng (1931-1992); faits concernant l’entité uniquement: ingénieur électricien coréano-américain né à Keijo (aujourd’hui Séoul), physique à l’Université nationale de Séoul, a émigré aux États-Unis en 1955 et a obtenu son doctorat à l’Université d’État de l’Ohio en 1959, chercheur aux Laboratoires Bell Telephone à Murray Hill, a construit le premier MOSFET avec Mohamed Atalla en 1959 avec des procédés PMOS et NMOS à 20 micromètres, a été co-pionnier des dispositifs à porteurs chauds (Schottky) et du transistor à base de nanocouche métallique, a inventé le MOSFET à grille flottante avec Simon Min Sze en 1967 — la base de l’EPROM, de l’EEPROM et de la mémoire flash — est devenu président fondateur du NEC Research Institute, a remporté la médaille Stuart Ballantine en 1975 et est entré au National Inventors Hall of Fame en 2009."
