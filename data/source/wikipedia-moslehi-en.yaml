summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن روكسانا مصيلحي؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تروي تعليمها في جامعة كولومبيا البريطانية وزمالتها في المعاهد الوطنية للصحة ومنصبها في جامعة ألباني ومجالات بحثها في سرطانات وراثية. لا تعطي تاريخ ولادة ولا أي ذكر للدين."
  en: "English Wikipedia article on Roxana Moslehi; used for entity facts only. A short article recounting her University of British Columbia education, her NIH fellowship, her University at Albany post and her research areas in hereditary cancers. It gives no birth date and no mention of religion."
  es: "Artículo de Wikipedia en inglés sobre Roxana Moslehi; utilizado únicamente para obtener información sobre la persona. Un breve artículo que relata su formación en la Universidad de Columbia Británica, su beca en los NIH, su puesto en la Universidad de Albany y sus áreas de investigación en cánceres hereditarios. No incluye fecha de nacimiento ni mención de su religión."
  fr: "Article Wikipédia en anglais sur Roxana Moslehi; utilisé uniquement à des fins d'information sur l'entité. Ce court article retrace son parcours universitaire à l'Université de Colombie-Britannique, sa bourse de recherche aux NIH, son poste à l'Université d'Albany et ses travaux sur les cancers héréditaires. Il ne mentionne ni sa date de naissance ni sa religion."
  ur: "Roxana Moslehi پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون جس میں اس کی یونیورسٹی آف برٹش کولمبیا کی تعلیم، اس کی NIH فیلوشپ، البانی پوسٹ میں اس کی یونیورسٹی اور موروثی کینسر میں اس کے تحقیقی شعبوں کا ذکر کیا گیا ہے۔ اس میں تاریخ پیدائش اور مذہب کا کوئی ذکر نہیں ہے۔"
  tr: "Roxana Meselhi hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılır. British Columbia Üniversitesi'ndeki eğitimini, Ulusal Sağlık Enstitüleri'ndeki burslarını, Albany Üniversitesi'ndeki pozisyonunu ve kalıtsal kanserler araştırma alanlarını anlatan kısa bir makale. Doğum tarihi veya din hakkında herhangi bir bilgi verilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Roxana Meselhi; digunakan hanya untuk fakta entitas. Artikel singkat yang menceritakan pendidikannya di University of British Columbia, fellowship di National Institutes of Health, posisinya di University at Albany, dan bidang penelitiannya dalam kanker herediter. Artikel tersebut tidak memberikan tanggal lahir atau penyebutan agama."
