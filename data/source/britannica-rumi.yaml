summary:
  en: "Britannica biography of Rumi by Annemarie Schimmel; it gives his birth about 30 September 1207 at Balkh, the family's departure about 1218, the arrival at Konya in 1228, his father Baha al-Din Walad's death in 1231, the meeting with Shams al-Din of Tabriz on 30 November 1244, Shams's final disappearance in 1247, and Rumi's death at Konya on 17 December 1273."
  es: "Biografía de Rumi en la Enciclopedia Británica, escrita por Annemarie Schimmel; en ella se indica su nacimiento alrededor del 30 de septiembre de 1207 en Balkh, la partida de la familia alrededor de 1218, la llegada a Konya en 1228, la muerte de su padre Baha al-Din Walad en 1231, el encuentro con Shams al-Din de Tabriz el 30 de noviembre de 1244, la desaparición definitiva de Shams en 1247 y la muerte de Rumi en Konya el 17 de diciembre de 1273."
  fr: "La biographie de Rumi par Annemarie Schimmel dans Britannica indique sa naissance vers le 30 septembre 1207 à Balkh, le départ de sa famille vers 1218, son arrivée à Konya en 1228, la mort de son père Baha al-Din Walad en 1231, sa rencontre avec Shams al-Din de Tabriz le 30 novembre 1244, la disparition définitive de Shams en 1247 et la mort de Rumi à Konya le 17 décembre 1273."
  ur: "رومی کی برٹانیکا سوانح عمری از اینمیری شمل؛ یہ 30 ستمبر 1207 کو بلخ میں اس کی پیدائش، 1218 میں اس خاندان کی روانگی، 1228 میں قونیہ آمد، اس کے والد بہاء الدین ولاد کی 1231 میں موت، 30 نومبر 1244 کو تبریز کے شمس الدین سے ملاقات، 1244 میں شمس کی آخری موت، 1244 میں شمس الدین کی موت، 1217 میں قونیہ میں انتقال۔ دسمبر 1273۔"
