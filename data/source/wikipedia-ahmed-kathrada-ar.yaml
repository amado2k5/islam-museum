summary:
  ar: مقالة ويكيبيديا العربية الموجزة عن أحمد كاثرادا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 21 أغسطس 1929 في الترانسفال ووفاته في 28 مارس 2017، وسجنه في جزيرة روبن إلى جانب مانديلا، وأدواره بعد 1994 نائبًا ومستشارًا للرئيس مانديلا. ويعطي صندوق معلوماتها ديانته بكلمة «الإسلام» العامة وحدها.
  en: Arabic Wikipedia stub on Ahmed Kathrada; used for entity facts only. It gives his birth on 21 August 1929 in the Transvaal and his death on 28 March 2017, his Robben Island imprisonment alongside Mandela, and his post-1994 roles as MP and adviser to President Mandela. Its infobox gives his religion with the single generic word 'Islam' ⁦(الإسلام)⁩.
  es: "Breve entrada en árabe de la Wikipedia sobre Ahmed Kathrada; se utiliza únicamente para datos sobre la persona. Indica su nacimiento el 21 de agosto de 1929 en Transvaal y su fallecimiento el 28 de marzo de 2017, su encarcelamiento en Robben Island junto a Mandela y sus funciones posteriores a 1994 como diputado y asesor del presidente Mandela. Su ficha informativa menciona su religión con la palabra genérica «Islam» ⁦(الإسلام)⁩."
  fr: "Ébauche de l'article Wikipédia en arabe sur Ahmed Kathrada; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 21 août 1929 au Transvaal et son décès le 28 mars 2017, son emprisonnement à Robben Island aux côtés de Mandela, ainsi que ses fonctions de député et de conseiller du président Mandela après 1994. Son infobox mentionne sa religion par le seul terme générique « Islam » ⁦(الإسلام)⁩."
  ur: "احمد کترادہ پر عربی ویکیپیڈیا کا سٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 21 اگست 1929 کو ٹرانسوال میں ان کی پیدائش اور 28 مارچ 2017 کو ان کی موت، منڈیلا کے ساتھ ان کی رابن جزیرے کی قید، اور 1994 کے بعد کے بطور ایم پی اور صدر منڈیلا کے مشیر کے کرداروں کو بیان کرتا ہے۔ اس کا معلوماتی خانہ اس کے مذہب کو واحد عام لفظ 'اسلام' ⁦(الإسلام)⁩ کے ساتھ دیتا ہے۔"
  tr: "Ahmed Kathrada hakkında Arapça Vikipedi makalesi öz; yalnızca varlığın gerçekleri için kullanılmıştır. 21 Ağustos 1929'da Transvaal'da doğduğunu ve 28 Mart 2017'deki ölümünü, Mandela ile birlikte Robben Adası'nda hapsedilmesini ve 1994 sonrası Başkan Yardımcısı ve Başkan Mandela'nın danışmanı olarak görevlerini anlatır. Bilgi kutusunda dinini yalnızca genel \"İslam\" kelimesi olarak verir."
  id: "Artikel Wikipedia berbahasa Arab singkat tentang Ahmed Kathrada; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 21 Agustus 1929 di Transvaal dan kematiannya pada 28 Maret 2017, penahanannya di Pulau Robben bersama Mandela, serta perannya setelah 1994 sebagai Wakil Presiden dan penasihat Presiden Mandela. Kotak infonya hanya mencantumkan agama sebagai kata generik \"Islam\"."
