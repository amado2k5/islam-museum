reliability_note: "Scholarly encyclopedia entry, read on 24 October 2026 — an independent source beyond Wikipedia. It confirms his birth at Diyarbakır on 23 March 1876 (his family, the Müftüzadeler, having come from Çermik), his father Tevfik Efendi's posts and editorship of the provincial gazette, his uncle Hacı Hasib Efendi's lessons to him in Arabic, Persian, Sufism and kalam, his reading of Ghazali, Farabi, Ibn Rushd, Ibn Arabi and Rumi beside Western works, Abdullah Cevdet's influence and his enrolment by Cevdet in the secret CUP, his suicide attempt (treated by Cevdet), the veterinary school, his 1898 arrest and twelve months in Taşkışla and Mehterhane prisons — ten of them, he said, spent reading the Qur'an, which he credited with ending his spiritual crisis — his 1900 marriage to his uncle's daughter Vecihe, the founding of the CUP's Diyarbakır branch on 22 October 1908, his first sociology lessons in Turkey at Salonica in 1911, his Ergani Madeni seat of March 1912, his Darülfünun teaching of 1913–1919, his arrest on 28 January 1919, the Limni then Malta exile ending 19 May 1921, the Telif ve Tercüme presidency of March 1923, his Diyarbakır seat in the second Assembly from 11 August 1923, his death at the French Hospital in Istanbul on 25 October 1924 and burial in the Mahmud II tomb precinct, and the making of his birth house into the Ziya Gökalp Museum on 23 March 1956. It names no madhhab for him."
