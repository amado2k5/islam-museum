summary:
  ar: "مدخل «كوك ألب، ضياء» في موسوعة الإسلام التركية (TDV) بقلم م. أورخان أوكاي؛ يجعل مولده في ديار بكر نفسها في 23 مارس 1876 ووفاته في مستشفى بإسطنبول في 25 أكتوبر 1924، ويفصّل تعليمه وسجنه ومنفاه إلى مالطا ⁦(سنتان وأربعة أشهر)⁩ ومناصبه وأعماله."
  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'Gökalp, Ziya' by M. Orhan Okay; it places his birth in Diyarbakır city itself on 23 March 1876 and his death in an Istanbul hospital on 25 October 1924, and details his schooling, imprisonment, Malta exile (two years and four months), offices and works."
  es: "La entrada \"Gökalp, Ziya\" de M. Orhan Okay en la TDV İslâm Ansiklopedisi (enciclopedia turca del Islam) sitúa su nacimiento en la propia ciudad de Diyarbakır el 23 de marzo de 1876 y su muerte en un hospital de Estambul el 25 de octubre de 1924, y detalla su educación, encarcelamiento, exilio en Malta (dos años y cuatro meses), cargos y obras."
  fr: "L'article « Gökalp, Ziya » de M. Orhan Okay dans la TDV İslâm Ansiklopedisi (encyclopédie turque de l'Islam) situe sa naissance dans la ville de Diyarbakır le 23 mars 1876 et sa mort dans un hôpital d'Istanbul le 25 octobre 1924, et détaille sa scolarité, son emprisonnement, son exil à Malte (deux ans et quatre mois), ses fonctions et ses travaux."
