  ar: "مدخل «كوك ألب، ضياء» في موسوعة الإسلام التركية (TDV) بقلم م. أورخان أوكاي؛ يجعل مولده في ديار بكر نفسها في 23 مارس 1876 ووفاته في مستشفى بإسطنبول في 25 أكتوبر 1924، ويفصّل تعليمه وسجنه ومنفاه إلى مالطا (سنتان وأربعة أشهر) ومناصبه وأعماله."
  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'Gökalp, Ziya' by M. Orhan Okay; it places his birth in Diyarbakır city itself on 23 March 1876 and his death in an Istanbul hospital on 25 October 1924, and details his schooling, imprisonment, Malta exile (two years and four months), offices and works."
