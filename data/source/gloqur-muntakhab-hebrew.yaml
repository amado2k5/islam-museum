summary:
  ar: "تدوينة لميخايلو ياكوبوفيتش، 15 سبتمبر 2023، عن الترجمة العبرية لـ«المنتخب في تفسير القرآن الكريم» التي نشرتها وزارة الأوقاف المصرية سنة 2023، من عمل سعيد مطاوع وعلي عنان، وعن مكانتها بين الترجمات العبرية."
  en: "A post by Mykhaylo Yakubovych, 15 September 2023, on the Hebrew translation of al-Muntakhab fi Tafsir al-Qur'an al-Karim published by the Egyptian Ministry of Awqaf in 2023, the work of Sa'id Muttawi' and Ali Annan, and its place among Hebrew translations."
  ur: "میخائیلو یاکوبووچ کی تحریر، 15 ستمبر 2023، مصری وزارتِ اوقاف کی 2023 میں شائع کردہ «المنتخب فی تفسیر القرآن الکریم» کے عبرانی ترجمے پر، جو سعید مطاوع اور علی عنان کا کام ہے، اور عبرانی تراجم میں اس کے مقام پر۔"
