reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The article rests on Golam Murshid's Bengali Culture across the Millennia (2016), on the Banglapedia entry by Bimal Guha, on Abdul Mannan Syed's Muslims in Bengali Literature (2009) and on Banglapedia's Bisad-Sindhu entry. Its dates are internally divided: the body and personal-life text give birth on 13 November 1847 (with 26 October 1847 also claimed by some researchers) and death on 19 December 1911, while its infobox gives 15 November 1847 for the birth; Banglapedia and Wikidata give the death year as 1912. The person record follows 13 November 1847 for the birth and 19 December with the year 1912 for the death, recording the English article's 1911 as a variant. On affiliation the article says in its lead that he is 'considered to be the first major writer to emerge from the Shia society of Bengal', in its literary section that he was 'one of the first Shia writers to emerge from colonial British India' and that Bishad Shindhu depicts 'the Shia version' of the tale, and in its early-life text that his father was 'a Bengali Shia Muslim aristocrat' — all within this one article; Banglapedia, its own cited source, names no affiliation for him at all, and the person record therefore leaves the faith unknown under the two-source rule, stating these attestations in the note. It also covers his home learning of Arabic and Persian, his schooling at Kushtia and Krishnanagar and his unfinished admission to Kalighat School, Calcutta, his service of the Faridpur Padamdi estate and from 1885 of the Delduar estate, his Kolkata residence 1903–1909, his student reporting for the Sangbad Prabhakar and Gram Barta Prokashika, his assistance to Rowshan Ali Chowdhury's Kohinoor, his marriages to Aziz-un-Nesa in 1865 and Bibi Kulsum in 1874, and his works in prose, drama, poetry and autobiography."
