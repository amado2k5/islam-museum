summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مير مشرف حسين (1847-1911 في متنها)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في لاهيني بارا في 13 نوفمبر 1847 ووفاته في بادامدي في 19 ديسمبر، وتصفه بأنه أول كاتب كبير خرج من شيعة البنغال وأن أباه كان مسلما شيعيا، وتجعل رائعته «بيشاد سيندو» راوية للنسخة الشيعية من مأساة كربلاء."
  en: "English Wikipedia article on Mir Mosharraf Hossain (its text gives 1847–1911); used for entity facts only. It records his birth at Lahinipara on 13 November 1847 and his death at Padamdi on 19 December, describes him as the first major writer to emerge from the Shia society of Bengal and his father as a Bengali Shia Muslim, and makes his magnum opus Bishad Shindhu a telling of the Shia version of the Karbala martyrdom tale."
