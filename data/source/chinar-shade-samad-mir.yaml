summary:
  ar: "بورتريه أدبي لأفتار موتا في مدونته «تشينار شيد» ⁦(14 أكتوبر 2026)⁩ عن صمد مير بعنوان «مساعد النجار الذي أصبح شاعراً صوفياً عارفاً»، مرسوم على مونوغراف موتي لال ساقي لأكاديمية ساهيتيا، ويذكر مولده سنة 1894 في سيكيدفر."
  en: "Avtar Mota’s Chinar Shade literary portrait (14 October 2026), “Samad Mir (1893–1959): The Carpenter’s Assistant Who Became a Mystic Sufi Poet”, drawn on Moti Lal Saqi’s Sahitya Akademi monograph and his eyewitness recollections; it gives the birth as 1894 at Sekidafar against the encyclopedias’ 1893."
  es: "El retrato literario de Avtar Mota para Chinar Shade (14 de octubre de 2026), “Samad Mir (1893–1959): El ayudante del carpintero que se convirtió en un poeta sufí místico”, se basa en la monografía de Moti Lal Saqi para la Sahitya Akademi y en sus recuerdos de testigo presencial; indica que nació en 1894 en Sekidafar, en contraposición a 1893, como indican las enciclopedias."
  fr: "Le portrait littéraire d'Avtar Mota pour Chinar Shade (14 octobre 2026), « Samad Mir (1893-1959): L'assistant charpentier devenu poète soufi mystique », tiré de la monographie de Moti Lal Saqi pour la Sahitya Akademi et de ses souvenirs de témoin oculaire; il donne la naissance en 1894 à Sekidafar contre 1893 dans les encyclopédies."
  ur: "اوتار موٹا کا چنار شیڈ ادبی پورٹریٹ ⁦(14 اکتوبر 2026)⁩، \"صمد میر (1893–1959): کارپینٹر کا اسسٹنٹ جو ایک صوفیانہ صوفی شاعر بن گیا\"، موتی لال ساقی کے ساہتیہ اکادمی کے مونوگراف اور ان کے عینی شاہد کی یادوں پر تیار کردہ؛ یہ انسائیکلوپیڈیا 1893 کے مقابلے میں سیکیدافر میں 1894 کو جنم دیتا ہے۔"
  tr: "Avtar Mota'nın 'Chenar Shade' adlı blogunda (14 Ekim 2026) Samad Mir hakkında yazdığı 'Sufi Şairi ve Bilici Marangozun Asistanı' başlıklı edebi portresi, Moti Lal Saqi tarafından Sahitya Akademisi için yazılmış bir monografide resimlenmiştir ve 1894'te Sikedfer'de doğduğundan bahsedilmektedir."
  id: "Potret sastra Avtar Mota dalam blognya 'Chenar Shade' (14 Oktober 2026) tentang Samad Mir berjudul 'Asisten Tukang Kayu yang Menjadi Penyair dan Pengenalan Sufi,' diilustrasikan dalam monograf oleh Moti Lal Saqi untuk Akademi Sahitya, menyebutkan kelahirannya pada tahun 1894 di Sikedfer."
