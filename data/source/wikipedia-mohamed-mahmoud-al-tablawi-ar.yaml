summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0639\u0646 \u0627\u0644\u0642\u0627\u0631\u0626 \u0645\u062d\u0645\u062f \u0645\u062d\u0645\u0648\u062f \u0627\u0644\u0637\u0628\u0644\u0627\u0648\u064a\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a 14 \u0646\u0648\u0641\u0645\u0628\u0631 1934\u060c \u0648\u062d\u0641\u0638\u0647 \u0627\u0644\u0642\u0631\u0622\u0646 \u0641\u064a \u0627\u0644\u062a\u0627\u0633\u0639\u0629 \u0639\u0644\u0649 \u0645\u0634\u0627\u064a\u062e \u0645\u0646\u0647\u0645 \u0639\u0628\u062f \u0627\u0644\u0641\u062a\u0627\u062d \u0627\u0644\u0642\u0627\u0636\u064a\u060c \u0648\u062a\u062d\u0643\u064a\u0645\u0647 \u0641\u064a \u0627\u0644\u0645\u0633\u0627\u0628\u0642\u0627\u062a \u0627\u0644\u062f\u0648\u0644\u064a\u0629\u060c \u0648\u0648\u0641\u0627\u062a\u0647 \u0641\u064a 12 \u0631\u0645\u0636\u0627\u0646 1441\u0647\u0640 / 5 \u0645\u0627\u064a\u0648 2020 \u0648\u062f\u0641\u0646\u0647 \u0641\u064a \u0645\u0642\u0627\u0628\u0631 \u0627\u0644\u0628\u0633\u0627\u062a\u064a\u0646."
