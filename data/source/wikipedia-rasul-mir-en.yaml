  en: "Encyclopedia article on Rasul Mir, the Kashmiri romantic ghazal poet of Doru Shahabad: his undocumented dates, the Taing edition of his Kulliyat, his late-life discipleship to Sheikh Ahmad Tarabali, and his poem on the death of Muhammad."
