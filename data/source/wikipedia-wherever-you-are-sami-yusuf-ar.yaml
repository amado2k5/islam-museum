summary:
  ar: "مقالة ويكيبيديا العربية عن ألبوم «حيث تكن» لسامي يوسف (2010)؛ لوقائع الكيان فقط: الإصدار في 29 أكتوبر 2010 عن إي تي إم إنترناشونال، ومواضع التسجيل، والمصوّرات، وقائمة الأغاني وكتّابها؛ تستند إلى الكتاب الإلكتروني للألبوم على موقع سامي يوسف."
  en: "Arabic Wikipedia article on Sami Yusuf's album Wherever You Are (2010); entity facts only: its release on 29 October 2010 by ETM International, where it was recorded, the videos, and the track list with its writers; it cites the album's e-book on Sami Yusuf's site."
  es: "Artículo en la Wikipedia en árabe sobre el álbum Wherever You Are (2010) de Sami Yusuf; solo datos sobre la entidad: su lanzamiento el 29 de octubre de 2010 por ETM International, donde se grabó, los vídeos y la lista de canciones con sus autores; cita el libro electrónico del álbum en el sitio web de Sami Yusuf."
  fr: "Article Wikipédia arabe sur l'album Wherever You Are (2010) de Sami Yusuf; informations uniquement sur l'entité: sa sortie le 29 octobre 2010 par ETM International, où il a été enregistré, les vidéos et la liste des titres avec ses auteurs; il cite le livre électronique de l'album sur le site de Sami Yusuf."
  ur: "سمیع یوسف کے البم پر عربی ویکیپیڈیا کا مضمون جہاں آپ ہو (2010)؛ صرف ہستی کے حقائق: ETM انٹرنیشنل کے ذریعہ 29 اکتوبر 2010 کو اس کی ریلیز، جہاں اسے ریکارڈ کیا گیا، ویڈیوز، اور اس کے مصنفین کے ساتھ ٹریک لسٹ؛ اس میں سمیع یوسف کی سائٹ پر البم کی ای بک کا حوالہ دیا گیا ہے۔"
  tr: "Sami Youssef'in \"Where You Are\" (2010) albümü hakkında Arapça Wikipedia makalesi; sadece varlık kayıtları için: 29 Ekim 2010'da ETM International tarafından yayımlandı, kayıt mekanları, videolar, parça listesi ve kitap; albümün Sami Youssef'in web sitesindeki e-kitabına dayanmaktadır."
  id: "Artikel Wikipedia Arab tentang album Sami Youssef \"Where You Are\" (2010); hanya untuk catatan entitas: dirilis pada 29 Oktober 2010 oleh ETM International, lokasi rekaman, video, daftar lagu, dan buku; berdasarkan e-book album di situs web Sami Youssef."
