  ar: "مقالة ويكيبيديا العربية عن عمر بن حفيظ (ولد 27 مايو 1963 في تريم بحضرموت)، مؤسس دار المصطفى؛ تقدمه في صدرها على أنه من المشار إليهم بالبنان في علم السلوك خاصة في طريقة آل باعلوي، ويعطي صندوق معلوماتها الطائفة أهل السنة والجماعة والعقيدة الأشعرية والمذهب الشافعي."
  en: "The Arabic Wikipedia article on Umar bin Hafiz (born 27 May 1963 in Tarim, Hadhramaut), founder of Dar al-Mustafa; its lead places him among those pointed to as foremost in the science of spiritual wayfaring, especially in the Ba 'Alawi tariqa, and its infobox gives Ahl al-Sunna wal-Jama'a, the Ash'ari creed and the Shafi'i madhhab."
