summary:
  ar: "مقالة ويكيبيديا العربية عن عمر بن حفيظ ⁦(ولد 27 مايو 1963 في تريم بحضرموت)⁩، مؤسس دار المصطفى؛ تقدمه في صدرها على أنه من المشار إليهم بالبنان في علم السلوك خاصة في طريقة آل باعلوي، ويعطي صندوق معلوماتها الطائفة أهل السنة والجماعة والعقيدة الأشعرية والمذهب الشافعي."
  en: "The Arabic Wikipedia article on Umar bin Hafiz (born 27 May 1963 in Tarim, Hadhramaut), founder of Dar al-Mustafa; its lead places him among those pointed to as foremost in the science of spiritual wayfaring, especially in the Ba 'Alawi tariqa, and its infobox gives Ahl al-Sunna wal-Jama'a, the Ash'ari creed and the Shafi'i madhhab."
  es: "El artículo de Wikipedia en árabe sobre Umar bin Hafiz (nacido el 27 de mayo de 1963 en Tarim, Hadhramaut), fundador de Dar al-Mustafa, lo sitúa entre los señalados como los más importantes en la ciencia del camino espiritual, especialmente en la tariqa Ba 'Alawi, y su ficha informativa menciona a Ahl al-Sunna wal-Jama'a, el credo Ash'ari y la madhhab Shafi'i."
  fr: "L'article de Wikipédia en arabe sur Umar bin Hafiz (né le 27 mai 1963 à Tarim, Hadramaout), fondateur de Dar al-Mustafa; son introduction le place parmi ceux qui sont considérés comme les plus importants dans la science du cheminement spirituel, en particulier dans la tariqa Ba 'Alawi, et son infobox donne Ahl al-Sunna wal-Jama'a, la croyance Ash'ari et le madhhab Shafi'i."
  ur: "دار المصطفیٰ کے بانی عمر بن حافظ ⁦(پیدائش 27 مئی 1963 کو ترم، حضرموت)⁩ پر عربی ویکیپیڈیا کا مضمون؛ اس کا لیڈ اسے ان لوگوں میں شامل کرتا ہے جن کی طرف روحانی سفر کی سائنس میں خاص طور پر با علوی طریقہ میں اشارہ کیا جاتا ہے، اور اس کا معلومات خانہ اہل السنۃ والجماعۃ، اشعری عقیدہ اور شافعی مذھب دیتا ہے۔"
  tr: "Dar Al-Mustafa'nın kurucusu Omar bin Hafız (27 Mayıs 1963, Tarim, Hadramawt doğumlu) hakkında Arapça Wikipedia makalesi; başta özellikle Ba'alawi tarikatında davranış biliminin en önemli figürlerinden biri olarak sunulur ve bilgi kutusu Ehl-el-Sünnet ve Cema'ah, Aş'ari mezhebi ve Şafii okulunu içerir."
  id: "Artikel Wikipedia Arab tentang Omar bin Hafiz (lahir 27 Mei 1963, di Tarim, Hadramawt), pendiri Dar Al-Mustafa; artikel ini disajikan di awal sebagai salah satu tokoh paling menonjol dalam ilmu perilaku, terutama dalam tarekat Ba'alawi, dan infoboxnya menyediakan Ahl al-Sunnah wa al-Jama'ah, ajaran Ash'ari, dan mazhab Shafi'i."
