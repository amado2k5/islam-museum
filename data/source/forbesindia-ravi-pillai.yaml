summary:
  ar: "ملف مجلة فوربس إنديا ⁦(21 تشرين الثاني 2013)⁩ عن رافي بيلاي بقلم أشيش ك. ميشرا: يوثق أداءه السنوي لطقس أوداياستامانا بوجا في معبد تيروباتي في يوم ميلاده منذ ثلاثين سنة وبكلماته هو، ومسيرته من كيرالا إلى الخليج."
  en: "Forbes India magazine profile of Ravi Pillai by Ashish K Mishra (21 November 2013); it records his annual udayasthamana pooja at the Tirupati temple on his birthday, performed for thirty years and described in his own words, and his rise from a Kerala farming family to the Gulf."
  es: "Perfil de Ravi Pillai en la revista Forbes India, escrito por Ashish K Mishra (21 de noviembre de 2013); en él se recoge su puja anual de Udayasthamana en el templo de Tirupati en su cumpleaños, que se realizó durante treinta años y que él mismo describe con sus propias palabras, y su ascenso desde una familia de agricultores de Kerala hasta el Golfo Pérsico."
  fr: "Profil de Ravi Pillai par Ashish K Mishra dans le magazine Forbes India (21 novembre 2013); il relate sa puja annuelle udayasthamana au temple de Tirupati le jour de son anniversaire, pratiquée pendant trente ans et décrite dans ses propres mots, ainsi que son ascension d'une famille d'agriculteurs du Kerala jusqu'au Golfe."
  ur: "روی پلئی کی فوربس انڈیا میگزین پروفائل از آشیش کے مشرا ⁦(21 نومبر 2013)⁩؛ اس میں اس کی سالگرہ کے موقع پر تروپتی مندر میں ان کی سالانہ اُدیاستھان پوجا ریکارڈ کی گئی ہے، جو تیس سال تک کی گئی اور اس کے اپنے الفاظ میں بیان کی گئی، اور کیرالہ کے ایک کاشتکار خاندان سے خلیج میں اس کا عروج۔"
  tr: "Forbes India Magazine Dosyası (21 Kasım 2013) Ravi Pillai hakkında, Ashish K. Mishra'nın Ravi Pillai hakkında: Otuz yıl önce doğum gününde Tirupati tapınağında Udayastamana Puja ritüelini kendi sözleriyle ve Kerala'dan Körfez'e yolculuğunu belgelemek."
  id: "Forbes India Magazine File (21 November 2013) tentang Ravi Pillai oleh Ashish K. Mishra: Mendokumentasikan pertunjukan tahunan ritual Udayastamana Puja di kuil Tirupati pada hari ulang tahunnya tiga puluh tahun lalu, dengan kata-katanya sendiri, dan perjalanannya dari Kerala ke Teluk."
