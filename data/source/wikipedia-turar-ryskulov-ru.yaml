summary:
  ar: "مقالة ويكيبيديا الروسية عن تورار ريسقولوف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 26 ديسمبر 1894 في مضيق بيساغاش بمنطقة طلغار، ودراسته وأدواره في تركستان ومنغوليا ونائب رئيس مجلس مفوضي الشعب في روسيا، وإعدامه في 10 فبراير 1938 ودفنه في كوموناركا بحسب بيانات جهاز الأمن المنقولة إلى مؤسسة ميموريال. صندوق معلوماتها وحده يذكر دينه «الإسلام» بصورة عامة دون مذهب، ويذكر المتن أنه ترأس سنة 1919 المكتب الإسلامي للحزب الشيوعي التركستاني، وهو منصب تنظيمي."
  en: "Russian Wikipedia article on Turar Ryskulov; used for entity facts only. It gives his birth on 26 December 1894 at the Besagash tract in Talgar district, his schooling and his posts in Turkestan, Mongolia and as deputy chairman of the Council of People's Commissars of the RSFSR, his execution on 10 February 1938 and his burial at Kommunarka according to FSB data passed to the Memorial foundation. Its infobox alone gives his religion as Islam, generically, naming no school; the text records that in 1919 he chaired the Muslim Bureau of the Turkestan Communist Party, an organisational post."
  es: "Artículo de la Wikipedia rusa sobre Turar Ryskulov; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 26 de diciembre de 1894 en el distrito de Besagash, en Talgar, su educación y sus cargos en Turkestán, Mongolia y como vicepresidente del Consejo de Comisarios del Pueblo de la RSFSR, su ejecución el 10 de febrero de 1938 y su entierro en Kommunarka, según datos del FSB entregados a la Fundación Memorial. Su ficha informativa solo indica que su religión era el islam, de forma genérica, sin mencionar ninguna escuela; el texto registra que en 1919 presidió la Oficina Musulmana del Partido Comunista de Turkestán, un cargo organizativo."
  fr: "Article de Wikipédia en russe sur Turar Ryskulov; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 26 décembre 1894 dans le canton de Besagash, district de Talgar, sa scolarité et ses fonctions au Turkestan, en Mongolie et comme vice-président du Conseil des commissaires du peuple de la RSFSR, son exécution le 10 février 1938 et son inhumation à Kommunarka, selon les données du FSB transmises à la Fondation du Mémorial. Son infobox mentionne uniquement sa religion comme étant l’islam, de manière générique, sans préciser d’établissement scolaire; le texte indique qu’en 1919, il a présidé le Bureau musulman du Parti communiste du Turkestan, un poste à vocation organisationnelle."
  ur: "Turar Ryskulov پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 26 دسمبر 1894 کو ضلع تلگر کے بیساگش ٹریکٹ میں اس کی پیدائش، ترکستان، منگولیا میں اس کی تعلیم اور اس کی پوسٹس اور آر ایس ایف ایس آر کی عوامی کمیسار کی کونسل کے ڈپٹی چیئرمین کے طور پر، 10 فروری 1938 کو اس کی پھانسی اور کومونارکا میں اس کی تدفین می ایف ایس بی کے ڈیٹا کے مطابق منظور ہوئی۔ اس کا معلوماتی خانہ صرف اس کا مذہب اسلام دیتا ہے، عام طور پر، کسی اسکول کا نام نہیں دیتا۔ متن ریکارڈ کرتا ہے کہ 1919 میں انہوں نے ترکستان کمیونسٹ پارٹی کے مسلم بیورو کی سربراہی کی، جو ایک تنظیمی عہدہ تھا۔"
