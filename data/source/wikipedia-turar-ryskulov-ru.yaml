summary:
  ar: "مقالة ويكيبيديا الروسية عن تورار ريسقولوف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 26 ديسمبر 1894 في مضيق بيساغاش بمنطقة طلغار، ودراسته وأدواره في تركستان ومنغوليا ونائب رئيس مجلس مفوضي الشعب في روسيا، وإعدامه في 10 فبراير 1938 ودفنه في كوموناركا بحسب بيانات جهاز الأمن المنقولة إلى مؤسسة ميموريال. صندوق معلوماتها وحده يذكر دينه «الإسلام» بصورة عامة دون مذهب، ويذكر المتن أنه ترأس سنة 1919 المكتب الإسلامي للحزب الشيوعي التركستاني، وهو منصب تنظيمي."
  en: "Russian Wikipedia article on Turar Ryskulov; used for entity facts only. It gives his birth on 26 December 1894 at the Besagash tract in Talgar district, his schooling and his posts in Turkestan, Mongolia and as deputy chairman of the Council of People's Commissars of the RSFSR, his execution on 10 February 1938 and his burial at Kommunarka according to FSB data passed to the Memorial foundation. Its infobox alone gives his religion as Islam, generically, naming no school; the text records that in 1919 he chaired the Muslim Bureau of the Turkestan Communist Party, an organisational post."
