reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article: Albanian writer, historian, poet and translator, national poet of Albania, a leading figure of the Albanian National Awakening alongside his brothers Sami and Abdyl; dates 25 May 1846 – 20 October 1900; its works list gives Lulet e verës 1890, Qerbelaja 1894 (the Arabic article's date, against 1898 elsewhere — recorded as a conflict), Histori e Skënderbeut 1898, the Iliad of Omar Khayyam (Rubaiyat) 1899 and Histori e Shqipërisë 1899. It carries no statement about his religion."
