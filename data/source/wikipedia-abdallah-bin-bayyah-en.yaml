  en: "The English Wikipedia article on Abdallah Bin Bayyah (born 1935), the Mauritanian jurist who chairs the UAE Council for Fatwa and presides over the Forum for Promoting Peace in Muslim Societies; its religious infobox, referenced to the Princeton Encyclopedia of Islamic Political Thought, gives denomination Sunni, creed Ash'ari and jurisprudence Maliki."
