summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تسنيم زهرة حسين؛ تُستخدم لوقائع الكيان فقط. تصفها بأنها أول باكستانية تعمل في نظرية الأوتار، وتذكر تعليمها في كينايرد وكليتي القائد الأعظم وستوكهولم ⁦(دكتوراه 2003 بإشراف أنصار فياض الدين)⁩، ومنصبها المؤسس في جامعة لاهور للعلوم الإدارية، وروايتها «الخيوط الأطول فقط» (2014). لا يذكر المقال تاريخ مولدها، ولا يحتوي أي محتوى ديني."
  en: "English Wikipedia article on Tasneem Zehra Husain; used for entity facts only. It describes her as the first Pakistani woman string theorist and covers her education at Kinnaird, Quaid-i-Azam and Stockholm (PhD 2003 under Ansar Fayyazuddin), her founding faculty post at LUMS, and her novel Only the Longest Threads (2014). The article gives no birth date, and contains no religion content."
  es: "Artículo de Wikipedia en inglés sobre Tasneem Zehra Husain; utilizado únicamente para datos sobre la persona. La describe como la primera mujer pakistaní teórica de cuerdas y abarca su formación académica en Kinnaird, Quaid-i-Azam y Estocolmo (doctorado en 2003 bajo la dirección de Ansar Fayyazuddin), su puesto como profesora fundadora en LUMS y su novela Only the Longest Threads (2014). El artículo no proporciona fecha de nacimiento ni contiene contenido religioso."
  fr: "Article de Wikipédia en anglais sur Tasneem Zehra Husain; utilisé uniquement à des fins d'information sur l'entité. Il la décrit comme la première femme pakistanaise spécialiste de la théorie des cordes et retrace son parcours universitaire à Kinnaird, Quaid-i-Azam et Stockholm (doctorat obtenu en 2003 sous la direction d'Ansar Fayyazuddin), son poste de professeure fondatrice à la LUMS et son roman *Only the Longest Threads* (2014). L'article ne mentionne pas sa date de naissance et ne contient aucune information relative à sa religion."
  ur: "تسنیم زہرہ حسین پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں انہیں پہلی پاکستانی خاتون سٹرنگ تھیوریسٹ کے طور پر بیان کیا گیا ہے اور کنیئرڈ، قائداعظم اور سٹاک ہوم میں ان کی تعلیم ⁦(انصار فیاض الدین کے تحت پی ایچ ڈی 2003)⁩، LUMS میں ان کی بانی فیکلٹی پوسٹ، اور ان کے ناول Only the Longest Threads (2014) کا احاطہ کیا گیا ہے۔ مضمون میں کوئی تاریخ پیدائش نہیں ہے، اور اس میں کوئی مذہب کا مواد نہیں ہے۔"
  tr: "Tasneem Zahra Hussain hakkında İngilizce Wikipedia makalesi; yalnızca varlık gerçekleri için kullanılır. Sicim teorisi alanında çalışan ilk Pakistanlı olarak tanımlanır, Kinnaird ve Great Quaid ile Stockholm kolejlerindeki eğitiminden (doktora 2003, Fayyaduddin'in destekçileri tarafından denetlenmiştir), Lahor İdari Bilimler Üniversitesi'ndeki kurucu pozisyonundan ve \"Only the Longest Threads\" (2014) adlı romanından bahseder. Makalede doğum tarihi belirtilmez ve dini içerik içermez."
  id: "Artikel Wikipedia bahasa Inggris tentang Tasneem Zahra Hussain; hanya digunakan untuk fakta entitas. Dia digambarkan sebagai orang Pakistan pertama yang bekerja di bidang teori string, menyebutkan pendidikannya di Kinnaird dan perguruan tinggi Great Quaid dan Stockholm (PhD 2003 dibimbing oleh pendukung Fayyaduddin), posisi pendirinya di Universitas Ilmu Administrasi Lahore, dan novelnya \"Only the Longest Threads\" (2014). Artikel tersebut tidak menyebutkan tanggal lahirnya, maupun mengandung konten keagamaan apapun."
