summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تسنيم زهرة حسين؛ تُستخدم لوقائع الكيان فقط. تصفها بأنها أول باكستانية تعمل في نظرية الأوتار، وتذكر تعليمها في كينايرد وكليتي القائد الأعظم وستوكهولم (دكتوراه 2003 بإشراف أنصار فياض الدين)، ومنصبها المؤسس في جامعة لاهور للعلوم الإدارية، وروايتها «الخيوط الأطول فقط» (2014). لا يذكر المقال تاريخ مولدها، ولا يحتوي أي محتوى ديني."
  en: "English Wikipedia article on Tasneem Zehra Husain; used for entity facts only. It describes her as the first Pakistani woman string theorist and covers her education at Kinnaird, Quaid-i-Azam and Stockholm (PhD 2003 under Ansar Fayyazuddin), her founding faculty post at LUMS, and her novel Only the Longest Threads (2014). The article gives no birth date, and contains no religion content."
