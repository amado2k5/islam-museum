  ar: "مقالة ويكيبيديا الإنجليزية عن محمد ناظم عادل القبرصي الحقاني (21 أبريل 1922 – 7 مايو 2014)، قائد صوفي تركي قبرصي وشيخ الفرع الحقاني من الطريقة النقشبندية؛ تسرد مبايعته في الطريقة وتدريبه على يد عبد الله الداغستاني ونشاطه الدعوي ووفاته في نيقوسيا الشمالية."
  en: "The English Wikipedia article on Muhammad Nazim Adil al-Qubrusi al-Haqqani (21 April 1922 – 7 May 2014), Turkish Cypriot Sufi leader and Grand Shaykh of the Haqqani branch of the Naqshbandi order; it records his initiation into the order and training under Abdullah ad-Daghistani, his missionary activity, and his death in North Nicosia."
