summary:
  ar: "مقالة ويكيبيديا العربية عن المنشد الدمشقي حمزة شكور؛ لوقائع الكيان فقط: مولده في القابون بدمشق في 1944، وأبوه مؤذن، ونشأته في الزوايا الصوفية، وتسجيله في التلفزيون في 1958، وبطولاته في كمال الأجسام ⁦(1963 و1966)⁩، ورئاسته رابطة المنشدين منذ 1974، وتأسيسه مع جوليان ⁦(جلال الدين)⁩ فايس فرقة الكندي في 1983، وحفلاته مع الأب إلياس زحلاوي منذ 2001، ووفاته في 4 فبراير 2009؛ وتستند إلى الاتحاد وMusicBrainz."
  en: "Arabic Wikipedia article on the Damascene munshid Hamza Shakkur; entity facts only: birth at al-Qaboun, Damascus, in 1944, his father a muezzin, his upbringing in the Sufi lodges, his first television recording in 1958, bodybuilding titles (1963, 1966), his presidency of the munshids' league from 1974, the founding with Julien (Jalal al-Din) Weiss of Ensemble Al-Kindi in 1983, concerts with Father Elias Zahlaoui from 2001, and death on 4 February 2009; it cites al-Ittihad and MusicBrainz."
