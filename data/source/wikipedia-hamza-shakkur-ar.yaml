summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0639\u0646 \u0627\u0644\u0645\u0646\u0634\u062f \u0627\u0644\u062f\u0645\u0634\u0642\u064a \u062d\u0645\u0632\u0629 \u0634\u0643\u0648\u0631\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u0627\u0644\u0642\u0627\u0628\u0648\u0646 \u0628\u062f\u0645\u0634\u0642 \u0641\u064a 1944\u060c \u0648\u0623\u0628\u0648\u0647 \u0645\u0624\u0630\u0646\u060c \u0648\u0646\u0634\u0623\u062a\u0647 \u0641\u064a \u0627\u0644\u0632\u0648\u0627\u064a\u0627 \u0627\u0644\u0635\u0648\u0641\u064a\u0629\u060c \u0648\u062a\u0633\u062c\u064a\u0644\u0647 \u0641\u064a \u0627\u0644\u062a\u0644\u0641\u0632\u064a\u0648\u0646 \u0641\u064a 1958\u060c \u0648\u0628\u0637\u0648\u0644\u0627\u062a\u0647 \u0641\u064a \u0643\u0645\u0627\u0644 \u0627\u0644\u0623\u062c\u0633\u0627\u0645 (1963 \u06481966)\u060c \u0648\u0631\u0626\u0627\u0633\u062a\u0647 \u0631\u0627\u0628\u0637\u0629 \u0627\u0644\u0645\u0646\u0634\u062f\u064a\u0646 \u0645\u0646\u0630 1974\u060c \u0648\u062a\u0623\u0633\u064a\u0633\u0647 \u0645\u0639 \u062c\u0648\u0644\u064a\u0627\u0646 (\u062c\u0644\u0627\u0644 \u0627\u0644\u062f\u064a\u0646) \u0641\u0627\u064a\u0633 \u0641\u0631\u0642\u0629 \u0627\u0644\u0643\u0646\u062f\u064a \u0641\u064a 1983\u060c \u0648\u062d\u0641\u0644\u0627\u062a\u0647 \u0645\u0639 \u0627\u0644\u0623\u0628 \u0625\u0644\u064a\u0627\u0633 \u0632\u062d\u0644\u0627\u0648\u064a \u0645\u0646\u0630 2001\u060c \u0648\u0648\u0641\u0627\u062a\u0647 \u0641\u064a 4 \u0641\u0628\u0631\u0627\u064a\u0631 2009\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0627\u0644\u0627\u062a\u062d\u0627\u062f \u0648MusicBrainz."
  en: "Arabic Wikipedia article on the Damascene munshid Hamza Shakkur; entity facts only: birth at al-Qaboun, Damascus, in 1944, his father a muezzin, his upbringing in the Sufi lodges, his first television recording in 1958, bodybuilding titles (1963, 1966), his presidency of the munshids' league from 1974, the founding with Julien (Jalal al-Din) Weiss of Ensemble Al-Kindi in 1983, concerts with Father Elias Zahlaoui from 2001, and death on 4 February 2009; it cites al-Ittihad and MusicBrainz."
