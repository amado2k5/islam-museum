summary:
  ar: "مقالة ويكيبيديا العربية عن المنشد الدمشقي حمزة شكور؛ لوقائع الكيان فقط: مولده في القابون بدمشق في 1944، وأبوه مؤذن، ونشأته في الزوايا الصوفية، وتسجيله في التلفزيون في 1958، وبطولاته في كمال الأجسام ⁦(1963 و1966)⁩، ورئاسته رابطة المنشدين منذ 1974، وتأسيسه مع جوليان ⁦(جلال الدين)⁩ فايس فرقة الكندي في 1983، وحفلاته مع الأب إلياس زحلاوي منذ 2001، ووفاته في 4 فبراير 2009؛ وتستند إلى الاتحاد وMusicBrainz."
  en: "Arabic Wikipedia article on the Damascene munshid Hamza Shakkur; entity facts only: birth at al-Qaboun, Damascus, in 1944, his father a muezzin, his upbringing in the Sufi lodges, his first television recording in 1958, bodybuilding titles (1963, 1966), his presidency of the munshids' league from 1974, the founding with Julien (Jalal al-Din) Weiss of Ensemble Al-Kindi in 1983, concerts with Father Elias Zahlaoui from 2001, and death on 4 February 2009; it cites al-Ittihad and MusicBrainz."
  es: "Artículo de Wikipedia en árabe sobre el munshid damasceno Hamza Shakkur; Sólo datos de la entidad: nacimiento en al-Qaboun, Damasco, en 1944, su padre era muecín, su educación en las logias sufíes, su primera grabación televisiva en 1958, títulos de culturismo (1963, 1966), su presidencia de la liga de munshids desde 1974, la fundación con Julien (Jalal al-Din) Weiss del Ensemble Al-Kindi. en 1983, conciertos con el Padre Elias Zahlaoui a partir de 2001, y fallecimiento el 4 de febrero de 2009; cita a al-Ittihad y MusicBrainz."
  fr: "Article Wikipédia en arabe sur le munshid damascène Hamza Shakkur; faits uniquement: naissance à al-Qaboun, Damas, en 1944, son père muezzin, son éducation dans les loges soufies, son premier enregistrement télévisé en 1958, ses titres de culturiste (1963, 1966), sa présidence de la ligue des munshids à partir de 1974, la fondation avec Julien (Jalal al-Din) Weiss de l'Ensemble Al-Kindi en 1983, concerts avec le Père Elias Zahlaoui à partir de 2001, et décès le 4 février 2009; il cite al-Ittihad et MusicBrainz."
  ur: "دمشقی منشد حمزہ شکور پر عربی ویکیپیڈیا کا مضمون؛ ہستی کے حقائق صرف: 1944 میں القابون، دمشق میں پیدائش، ان کے والد ایک موذن، صوفی لاجز میں ان کی پرورش، 1958 میں ان کی پہلی ٹیلی ویژن ریکارڈنگ، باڈی بلڈنگ ٹائٹل ⁦(1963، 1966)⁩، منشد لیگ کی صدارت، ان کی صدارت، 1944ء میں 1983 میں ویس آف اینسمبل الکندی، 2001 سے فادر الیاس زہلاوی کے ساتھ کنسرٹ، اور 4 فروری 2009 کو موت؛ اس میں التحاد اور میوزک برینز کا حوالہ دیا گیا ہے۔"
