  ar: "مقالة ويكيبيديا الإندونيسية المختصرة عن أنتوني تان (وُلد في ماليزيا سنة 1982)، الرئيس التنفيذي لغراب ذي الجنسية السنغافورية؛ تذكر مولده في أسرة تان تشونغ موتورز الغنية، ودراسته في جامعة شيكاغو وكلية هارفارد للأعمال، وحلوله مع تان هوي لينغ في المركز الثاني في مسابقة أعمال هارفارد وإطلاقهما ماي تكسي في حزيران 2012."
  en: "Short Indonesian Wikipedia article on Anthony Tan (born in Malaysia in 1982), the Singaporean chief executive of Grab; it records his birth into the wealthy Tan Chong Motors family, his studies at the University of Chicago and Harvard Business School, his second prize with Tan Hooi Ling in the Harvard business competition, and their launch of My Teksi in June 2012."
