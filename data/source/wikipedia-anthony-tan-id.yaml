summary:
  ar: "مقالة ويكيبيديا الإندونيسية المختصرة عن أنتوني تان ⁦(وُلد في ماليزيا سنة 1982)⁩، الرئيس التنفيذي لغراب ذي الجنسية السنغافورية؛ تذكر مولده في أسرة تان تشونغ موتورز الغنية، ودراسته في جامعة شيكاغو وكلية هارفارد للأعمال، وحلوله مع تان هوي لينغ في المركز الثاني في مسابقة أعمال هارفارد وإطلاقهما ماي تكسي في حزيران 2012."
  en: "Short Indonesian Wikipedia article on Anthony Tan (born in Malaysia in 1982), the Singaporean chief executive of Grab; it records his birth into the wealthy Tan Chong Motors family, his studies at the University of Chicago and Harvard Business School, his second prize with Tan Hooi Ling in the Harvard business competition, and their launch of My Teksi in June 2012."
  es: "Breve artículo de la Wikipedia en indonesio sobre Anthony Tan (nacido en Malasia en 1982), el director ejecutivo singapurense de Grab; en él se narra su nacimiento en la acaudalada familia Tan Chong Motors, sus estudios en la Universidad de Chicago y la Escuela de Negocios de Harvard, su segundo premio junto con Tan Hooi Ling en la competición empresarial de Harvard y el lanzamiento de My Teksi en junio de 2012."
  fr: "Court article de Wikipédia indonésien sur Anthony Tan (né en Malaisie en 1982), le PDG singapourien de Grab; il relate sa naissance au sein de la riche famille Tan Chong Motors, ses études à l'Université de Chicago et à la Harvard Business School, son deuxième prix avec Tan Hooi Ling au concours de commerce de Harvard, et le lancement de My Teksi en juin 2012."
  ur: "انتھونی ٹین پر مختصر انڈونیشی ویکیپیڈیا مضمون ⁦(1982 میں ملائیشیا میں پیدا ہوا)⁩، گریب کے سنگاپور کے چیف ایگزیکٹو؛ اس میں ٹین چونگ موٹرز کے امیر خاندان میں اس کی پیدائش، یونیورسٹی آف شکاگو اور ہارورڈ بزنس اسکول میں اس کی تعلیم، ہارورڈ کے کاروباری مقابلے میں ٹین ہوئی لنگ کے ساتھ اس کا دوسرا انعام، اور جون 2012 میں مائی ٹیکسی کے آغاز کو ریکارڈ کیا گیا ہے۔"
