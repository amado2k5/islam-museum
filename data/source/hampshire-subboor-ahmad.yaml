  ar: "سيرة صبور أحمد في بوابة «العلم والإسلام» المرئية بكلية هامبشير؛ ملف أكاديمي مستقل عن منظمته. تذكر دراسته الهندسة في جامعة سيتي بلندن، وعمله الدراسي في فلسفة العلوم، وتخصصه في وجود الله وفلسفة التطور، وإدارته شركة النشر «ون ريزن»، ومناظراته في ركن الخطباء."
