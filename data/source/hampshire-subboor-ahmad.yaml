summary:
  ar: "سيرة صبور أحمد في بوابة «العلم والإسلام» المرئية بكلية هامبشير؛ ملف أكاديمي مستقل عن منظمته. تذكر دراسته الهندسة في جامعة سيتي بلندن، وعمله الدراسي في فلسفة العلوم، وتخصصه في وجود الله وفلسفة التطور، وإدارته شركة النشر «ون ريزن»، ومناظراته في ركن الخطباء."
  en: "Hampshire College's Science and Islam Video Portal profile of Subboor Ahmad; an academic profile independent of his organisation. It records his engineering studies at City University London, postgraduate work in philosophy of science, his specialisation in God's existence and the philosophy of evolution, his management of the One Reason publishing company, and his Speakers' Corner debates."
  es: "Perfil de Subboor Ahmad en el portal de vídeos de Ciencia e Islam del Hampshire College; un perfil académico independiente de su organización. En él se recogen sus estudios de ingeniería en la City University de Londres, su trabajo de posgrado en filosofía de la ciencia, su especialización en la existencia de Dios y la filosofía de la evolución, su gestión de la editorial One Reason y sus debates en Speakers' Corner."
  fr: "Profil de Subboor Ahmad sur le portail vidéo « Science et Islam » du Hampshire College: un profil académique indépendant de son organisation. Il retrace ses études d'ingénieur à la City University de Londres, ses travaux de troisième cycle en philosophie des sciences, sa spécialisation sur l'existence de Dieu et la philosophie de l'évolution, sa direction de la maison d'édition One Reason et ses interventions dans l'émission Speakers' Corner."
  ur: "ہیمپشائر کالج کا سائنس اینڈ اسلام ویڈیو پورٹل سبور احمد کا پروفائل؛ اس کی تنظیم سے آزاد ایک تعلیمی پروفائل۔ اس میں سٹی یونیورسٹی لندن میں ان کی انجینئرنگ کی تعلیم، سائنس کے فلسفے میں پوسٹ گریجویٹ کام، خدا کے وجود اور فلسفہ ارتقاء میں اس کی مہارت، ون ریزن پبلشنگ کمپنی کی انتظامیہ، اور اس کے اسپیکرز کارنر مباحثوں کو ریکارڈ کیا گیا ہے۔"
