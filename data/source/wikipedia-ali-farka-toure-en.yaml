reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives his birth on 31 October 1939 at Kanau, Gourma-Rharous Cercle, Tombouctou region, to a Songhai family; the move to Niafunké in infancy; his given name Ali Ibrahim and the nickname 'Farka' (donkey), explained in his own quoted words; the griot-caste prohibition on his playing; work as chauffeur and ambulance boatman; the 1956 Guinean national ballet performance that turned him to the guitar; national competitions in the 1960s and singing in seven languages; sound engineer at Radio Mali in the 1970s; the Sonafric albums; the 1986 British discovery of the 'red album' by Andy Kershaw; World Circuit albums The River (1990) and The Source (1992, with Taj Mahal); Talking Timbuktu (1994) with Ry Cooder and the Grammy for Best World Music Album; Niafunké (1999); Mississippi to Mali (2002) with Corey Harris and Martin Scorsese's Feel Like Going Home (2003); his election as mayor of Niafunké in 2004 at his own expense for roads, sewers and a generator; In the Heart of the Moon (2005) with Toumani Diabaté and a second Grammy; the posthumous Savane (July 2006), World Music Charts Europe album of the year 2006; Rolling Stone's 76th and Spin's 37th place among guitarists. Its lead dates his death 6 March 2006 and its death section says the Malian Ministry of Culture announced his death, in Bamako from bone cancer, on 6 March 2006; the French and Arabic articles give 7 March and Wikidata carries both claims — the conflict is recorded in the person record, which follows 7 March. The article states no religion for him."
