  ar: "مقالة ويكيبيديا الإنجليزية عن الحسن الثاني؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 9 يوليو 1929 في الرباط ووفاته فيها في 23 يوليو 1999 ودفنه في الضريح الملكي بالرباط، وأنه الابن الأكبر لمحمد الخامس وخلفه في الملك سنة 1961، وأحداث عهده من أول دستور سنة 1962 إلى المسيرة الخضراء سنة 1975."
  en: "English Wikipedia article on Hassan II of Morocco; used for entity facts only. It gives his birth on 9 July 1929 at Rabat, his death there on 23 July 1999 and his burial in the Royal Mausoleum at Rabat, that he was the eldest son of Mohammed V and succeeded him as king in 1961, and the events of his reign from the first constitution of 1962 to the Green March of 1975."
