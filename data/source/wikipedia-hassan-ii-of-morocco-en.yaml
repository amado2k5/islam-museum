summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الحسن الثاني؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 9 يوليو 1929 في الرباط ووفاته فيها في 23 يوليو 1999 ودفنه في الضريح الملكي بالرباط، وأنه الابن الأكبر لمحمد الخامس وخلفه في الملك سنة 1961، وأحداث عهده من أول دستور سنة 1962 إلى المسيرة الخضراء سنة 1975."
  en: "English Wikipedia article on Hassan II of Morocco; used for entity facts only. It gives his birth on 9 July 1929 at Rabat, his death there on 23 July 1999 and his burial in the Royal Mausoleum at Rabat, that he was the eldest son of Mohammed V and succeeded him as king in 1961, and the events of his reign from the first constitution of 1962 to the Green March of 1975."
  es: "Artículo de la Wikipedia en inglés sobre Hassan II de Marruecos; utilizado únicamente para datos sobre la persona. Indica que nació el 9 de julio de 1929 en Rabat, falleció allí el 23 de julio de 1999 y fue enterrado en el Mausoleo Real de Rabat. Menciona que fue el hijo mayor de Mohammed V y que le sucedió como rey en 1961, así como los acontecimientos de su reinado desde la primera constitución de 1962 hasta la Marcha Verde de 1975."
  fr: "Article de Wikipédia en anglais sur Hassan II du Maroc; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 9 juillet 1929 à Rabat, son décès dans cette même ville le 23 juillet 1999 et son inhumation au Mausolée royal de Rabat, qu’il était le fils aîné de Mohammed V et lui a succédé comme roi en 1961, et relate les événements de son règne, de la première constitution de 1962 à la Marche verte de 1975."
