  ar: "كتاب مغني اللبيب عن كتب الأعاريب لابن هشام الأنصاري، تحقيق مازن المبارك ومحمد علي حمد الله، دار الفكر، دمشق، الطبعة السادسة ١٩٨٥؛ قُرئ في نسخة المكتبة الشاملة التي تذكر أن ترقيمها موافق للمطبوع، في 21 نوفمبر 2026، في موضوع: مقدمة المؤلف وأبواب الكتاب الثمانية وأسباب طول كتب الإعراب."
