summary:
  ar: "كتاب جماعي من السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، يضم خمسة عشر بحثا لعلماء الأزهر، منها بحوث لمحمود شلتوت ومحمد عبد الله دراز ومحمود حمدي زقزوق وأحمد عمر هاشم ومحمد شوقي الفنجري، عن العقل والعلم والسلام والوحدة والوطن والفقر والأخوة في الإسلام؛ 210 صفحات، إشراف الأمين العام للمجمع محيي الدين عفيفي أحمد."
  en: "A collective volume in the Scientific Series of the Islamic Research Academy of al-Azhar, gathering fifteen essays by Azhar scholars, among them Mahmud Shaltut, Muhammad Abdullah Draz, Mahmud Hamdi Zaqzuq, Ahmad Umar Hashim and Muhammad Shawqi al-Fanjari, on reason, knowledge, peace, unity, homeland, poverty and brotherhood in Islam; 210 pages, supervised by the Academy's Secretary-General."
