label:
  ar: هذا هو الإسلام — مجموعة من العلماء
  en: "This Is Islam — a group of Azhar scholars"
summary:
  ar: "كتاب جماعي من السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، يضم خمسة عشر بحثا لعلماء الأزهر، منها بحوث لمحمود شلتوت ومحمد عبد الله دراز ومحمود حمدي زقزوق وأحمد عمر هاشم ومحمد شوقي الفنجري، عن العقل والعلم والسلام والوحدة والوطن والفقر والأخوة في الإسلام؛ 210 صفحات، إشراف الأمين العام للمجمع محيي الدين عفيفي أحمد."
  en: "A collective volume in the Scientific Series of the Islamic Research Academy of al-Azhar, gathering fifteen essays by Azhar scholars, among them Mahmud Shaltut, Muhammad Abdullah Draz, Mahmud Hamdi Zaqzuq, Ahmad Umar Hashim and Muhammad Shawqi al-Fanjari, on reason, knowledge, peace, unity, homeland, poverty and brotherhood in Islam; 210 pages, supervised by the Academy's Secretary-General."
  es: "Un volumen colectivo de la Serie Científica de la Academia Islámica de Investigación de Al-Azhar, que reúne quince ensayos de académicos de Al-Azhar, entre ellos Mahmud Shaltut, Muhammad Abdullah Draz, Mahmud Hamdi Zaqzuq, Ahmad Umar Hashim y Muhammad Shawqi al-Fanjari, sobre la razón, el conocimiento, la paz, la unidad, la patria, la pobreza y la fraternidad en el Islam; 210 páginas, supervisado por el Secretario General de la Academia."
  fr: "Un ouvrage collectif de la série scientifique de l'Académie de recherche islamique d'al-Azhar, rassemblant quinze essais de savants d'Azhar, parmi lesquels Mahmud Shaltut, Muhammad Abdullah Draz, Mahmud Hamdi Zaqzuq, Ahmad Umar Hashim et Muhammad Shawqi al-Fanjari, sur la raison, la connaissance, la paix, l'unité, la patrie, la pauvreté et la fraternité en Islam; 210 pages, supervisé par le secrétaire général de l'Académie."
  ur: "الازہر کی اسلامک ریسرچ اکیڈمی کی سائنسی سیریز کا ایک مجموعہ، جس میں ازہر کے علماء کے پندرہ مقالے جمع کیے گئے ہیں، جن میں محمود شلتوت، محمد عبداللہ دراز، محمود حمدی زقوق، احمد عمر ہاشم اور محمد شوقی الفنجری، عقل، علم، امن، اتحاد، وطن اور اسلام میں بھائی چارہ؛ اکیڈمی کے سیکرٹری جنرل کی زیر نگرانی 210 صفحات۔"
