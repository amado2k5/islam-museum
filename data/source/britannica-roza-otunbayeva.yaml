reliability_note: "Reference entry read in full on 25 October 2026. Used for entity facts: her philosophy degree from Moscow State University in 1972 and her move to the philosophy faculty of Kyrgyz State University; her governmental posts of the 1980s; her appointment as independent Kyrgyzstan's first ambassador to the United States in 1992, her foreign ministership under President Akayev, her ambassadorship to the United Kingdom from 1997 and her UN envoy work in Georgia; her 2004 break with Akayev and the blocking of her Ata Zhurt party from the 2005 elections; her loss of the foreign minister post when parliament refused to approve her appointment under Bakiyev; her 2007 parliamentary seat with the Social Democratic Party; the April 2010 uprising and her interim presidency; and her stepping down on 1 December 2011, which Britannica calls Kyrgyzstan's first peaceful transfer of power, crediting her with quelling the June 2010 unrest and bringing stability. Two conflicts with the longer record are noted: Britannica gives her birthplace as Osh, where the English, Arabic and Urdu articles and Wikidata give Frunze (Bishkek) — the latter is followed; and it describes her 1980s Soviet service as including an ambassadorship to Malaysia, where the English article gives her UNESCO committee and Executive Board roles instead. It names no religion for her."
