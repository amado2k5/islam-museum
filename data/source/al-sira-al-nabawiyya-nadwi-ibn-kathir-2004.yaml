  en: "Abu al-Hasan 'Ali al-Hasani al-Nadwi, al-Sira al-Nabawiyya — edited and annotated by Sayyid 'Abd al-Majid al-Ghawri, Dar Ibn Kathir, Damascus–Beirut, 12th printing (Dar Ibn Kathir's 3rd) 1425 AH/2004 CE"
summary:
  ar: "نشرة دار ابن كثير لكتاب الندوي في السيرة، أُلحقت بها إضافات المؤلف في طبعة لكهنؤ (1416هـ/1995م)، وخُرّجت فيها الأحاديث وشُرحت الألفاظ الغريبة وأضيفت 41 خريطة ملونة، ومقدمة عماد الدين خليل، وترجمة مستوفاة للمؤلف، وجداول للغزوات والسرايا من «رحمة للعالمين» للمنصورفوري، وفهارس عامة."
  en: "Dar Ibn Kathir's edition of al-Nadwi's biography of the Prophet, incorporating the author's additions in the Lucknow printing (1416 AH/1995 CE), with takhrij of the reports, glosses on rare words, 41 coloured maps, an introduction by 'Imad al-Din Khalil, a full biography of the author, tables of campaigns and expeditions taken from al-Mansurpuri's Rahmat lil-'Alamin, and general indexes."
