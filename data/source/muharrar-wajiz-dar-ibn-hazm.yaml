label:
  ar: "المحرر الوجيز في تفسير الكتاب العزيز — ابن عطية ⁦(دار ابن حزم، مجلد واحد، بمقدمة مجد مكي)⁩"
  en: "al-Muharrar al-Wajiz fi Tafsir al-Kitab al-'Aziz — Ibn Atiyya (Dar Ibn Hazm, one volume, introduced by Majd Makki)"
  ur: "المحرر الوجیز فی تفسیر الکتاب العزیز — ابن عطیہ (دار ابن حزم، ایک جلد، مجد مکی کے مقدمے کے ساتھ)"
summary:
  ar: "طبعة دار ابن حزم ببيروت لتفسير ابن عطية في مجلد واحد، «طبعة جديدة منقحة ومرتبة» مأخوذة عن طبعة قطر المحققة، مع مقدمة لمجد مكي في ترجمة ابن عطية ومنهجه ومصادره ومكانة تفسيره وطبعاته."
  en: "Dar Ibn Hazm's (Beirut) one-volume printing of Ibn Atiyya's commentary, a 'new revised and arranged edition' based on the critical Qatar edition, with an introduction by Majd Makki on Ibn Atiyya's life, method, sources, the standing of his commentary and its editions."
  ur: "دار ابن حزم بیروت کا ابن عطیہ کی تفسیر کا ایک جلد والا ایڈیشن، قطر کے محقق ایڈیشن سے ماخوذ «نیا نظرثانی شدہ اور مرتب ایڈیشن»، مجد مکی کے مقدمے کے ساتھ جو ابن عطیہ کی سوانح، منہج، مآخذ، تفسیر کے مقام اور ایڈیشنوں پر ہے۔"
title: "المحرر الوجيز في تفسير الكتاب العزيز"
