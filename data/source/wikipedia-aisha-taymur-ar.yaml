reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers her birth in a Darb Saada palace in Cairo's Darb al-Ahmar, her father Isma'il Pasha Taymur (head of the Khedivial diwan's foreign bureau, then of the diwan itself) and her Circassian mother Mahtab Hanum, her two tutors in Persian and the Arabic sciences, her marriage at fourteen in 1854 to Muhammad Bey Tawfiq al-Islambuli (the English article names him Mahmud Bey al-Islambuli — discrepancy recorded), her tutoring with two women teachers in grammar, morphology and prosody, her raising of her brother Ahmed Taymur, the death of her daughter Tawhida at twelve and her seven years of elegies, and her articles in al-Adab and al-Mu'ayyad opposing Qasim Amin's call for unveiling. The article is internally inconsistent on her death: one passage gives 2 May 1902, another 25 May 1902, against Wikidata's 26 May 1902 — the person record therefore dates her death at year precision only. The article names no school of Islam for her. Read in full on 24 October 2026."
