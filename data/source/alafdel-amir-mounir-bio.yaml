summary:
  ar: "سيرة منشورة عن الداعية المصري أمير منير في موقع الأفضل؛ تذكر أن اسمه في بطاقته الشخصية «أمير منير»، وأنه وُلد في القاهرة في 22 أغسطس 1993، وأنه صيدلي وصانع محتوى حاصل على بكالوريوس الصيدلة، وتروي جدل «عمرة البدل» وبيان وزارة الأوقاف أنه لا علاقة له بها ولا تصريح له بالخطابة."
  en: "A published biography of the Egyptian preacher Amir Mounir on the Alafdel site, recording that his identity-card name is simply 'Amir Mounir', that he was born in Cairo on 22 August 1993, and that he is a pharmacist and content creator holding a bachelor's degree in pharmacy; it also recounts the 'Umra-by-proxy' controversy and the Ministry of Awqaf statement that he has no connection with it and no preaching licence."
title: "من هو الداعية امير منير ويكيبيديا؛ 12 معلومة تخص هذه الشخصية"
