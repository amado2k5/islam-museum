summary:
  ar: "سيرة منشورة عن الداعية المصري أمير منير في موقع الأفضل؛ تذكر أن اسمه في بطاقته الشخصية «أمير منير»، وأنه وُلد في القاهرة في 22 أغسطس 1993، وأنه صيدلي وصانع محتوى حاصل على بكالوريوس الصيدلة، وتروي جدل «عمرة البدل» وبيان وزارة الأوقاف أنه لا علاقة له بها ولا تصريح له بالخطابة."
  en: "A published biography of the Egyptian preacher Amir Mounir on the Alafdel site, recording that his identity-card name is simply 'Amir Mounir', that he was born in Cairo on 22 August 1993, and that he is a pharmacist and content creator holding a bachelor's degree in pharmacy; it also recounts the 'Umra-by-proxy' controversy and the Ministry of Awqaf statement that he has no connection with it and no preaching licence."
  es: "En el sitio web Alafdel se publica una biografía del predicador egipcio Amir Mounir, en la que se indica que su nombre en el documento de identidad es simplemente \"Amir Mounir\", que nació en El Cairo el 22 de agosto de 1993 y que es farmacéutico y creador de contenido con una licenciatura en farmacia; también se relata la controversia sobre la \"Umra por poder\" y la declaración del Ministerio de Asuntos Religiosos (Awqaf) de que no tiene ninguna relación con ella ni licencia para predicar."
  fr: "Une biographie publiée sur le site Alafdel du prédicateur égyptien Amir Mounir indique que son nom sur sa carte d'identité est simplement « Amir Mounir », qu'il est né au Caire le 22 août 1993 et qu'il est pharmacien et créateur de contenu, titulaire d'une licence en pharmacie; elle relate également la controverse de « l'Umra par procuration » et la déclaration du ministère des Awqaf selon laquelle il n'a aucun lien avec cette affaire et ne possède aucune licence de prédication."
  ur: "الفڈیل سائٹ پر مصری مبلغ امیر منیر کی ایک شائع شدہ سوانح عمری، جس میں یہ ریکارڈ کیا گیا ہے کہ ان کے شناختی کارڈ کا نام صرف 'امیر منیر' ہے، کہ وہ 22 اگست 1993 کو قاہرہ میں پیدا ہوا تھا، اور یہ کہ وہ ایک فارماسسٹ اور مواد تخلیق کرنے والا ہے جس نے فارمیسی میں بیچلر کی ڈگری حاصل کی ہے۔ اس میں 'عمرہ بہ پراکسی' تنازعہ اور وزارت اوقاف کے بیان کا بھی ذکر کیا گیا ہے کہ اس کا اس سے کوئی تعلق نہیں ہے اور نہ ہی تبلیغ کا کوئی لائسنس ہے۔"
  tr: "Al-Afdal web sitesinde Mısırlı vaiz Amir Mounir hakkında yayımlanan bir biyografide, kimlik kartında adının 'Amir Mounir' olduğu, 22 Ağustos 1993'te Kahire'de doğduğu ve eczacılık lisans derecesine sahip eczacı ve içerik üreticisi olduğu belirtiliyor. 'Umre vekili' ile ilgili tartışmaları ve Awqaf Bakanlığı'nın bununla hiçbir bağlantısı olmadığını ve vaaz verme izni olmadığını açıklamasını anlatıyor."
  id: "Biografi yang diterbitkan tentang pengkhotbah Mesir Amir Mounir di situs Al-Afdal; disebutkan bahwa namanya di kartu identitas adalah 'Amir Mounir,' bahwa ia lahir di Kairo pada 22 Agustus 1993, dan bahwa ia adalah apoteker serta pembuat konten yang memiliki gelar sarjana farmasi. Biografi tersebut menceritakan kontroversi tentang 'pengganti Umrah' dan pernyataan Kementerian Awqaf bahwa ia tidak memiliki hubungan dengan hal itu dan tidak memiliki izin untuk berkhotbah."
