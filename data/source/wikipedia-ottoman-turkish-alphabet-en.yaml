summary:
  ar: "الصفحة «Ottoman Turkish alphabet» في Wikipedia (English)؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: اللغات المكتوبة بالحرف العربي وحروفها المضافة."
  en: "The page \"Ottoman Turkish alphabet\" (Wikipedia (English)), named in a research file supplied to the museum on 21 November 2026; the museum did not open the page, and the founder approved using the file without re-verification. Used for: the languages written in the Arabic script and their added letters."
  ur: "صفحہ «Ottoman Turkish alphabet» (Wikipedia (English))؛ یہ عجائب گھر کو 21 نومبر 2026ء کو دی گئی تحقیقی فائل میں مذکور ہے، عجائب گھر نے صفحہ نہیں کھولا اور بانی نے دوبارہ تصدیق کے بغیر فائل کے استعمال کی منظوری دی۔ استعمال: عربی رسم الخط میں لکھی جانے والی زبانیں اور ان کے اضافی حروف۔"
  fr: "La page « Ottoman Turkish alphabet » (Wikipedia (English)), citée dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisée pour : les langues écrites en alphabet arabe et leurs lettres ajoutées."
  es: "La página «Ottoman Turkish alphabet» (Wikipedia (English)), citada en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el archivo sin volver a verificar. Usada para: las lenguas escritas en escritura árabe y sus letras añadidas."
  tr: "Wikipedia'daki \"Osmanlı Türk alfabesi\" sayfası (İngilizce); 21 Kasım 2026'da müzeye sunulan bir araştırma dosyasında bahsedilmiş, ancak müze sayfayı açmamış ve kurucu dosyayı yeniden doğrulama gerektirmeden kullanmayı kabul etmiştir. Kullanım: Arap alfabesiyle yazılmış diller ve eklenen harfler."
  id: "Halaman \"Alfabet Turki Ottoman\" di Wikipedia (Inggris); disebutkan dalam berkas penelitian yang dikirim ke museum pada 21 November 2026, tetapi museum tidak membuka halaman tersebut, dan pendiri setuju menggunakan berkas tersebut tanpa verifikasi ulang. Digunakan dalam: bahasa yang ditulis dengan aksara Arab dan huruf-huruf tambahannya."
