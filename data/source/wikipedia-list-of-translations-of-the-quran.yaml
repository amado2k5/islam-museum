summary:
  ar: "صفحة وردت في ملخص بحثي قُدِّم إلى المتحف واعتمده المؤسس في 21 نوفمبر 2026؛ لم تُفتح الصفحة، وأرقام الصفحات المذكورة هي ما في الملخص ولم يُتحقق منها. ناشرها: Wikipedia. يُستند إليها في: تاريخ ترجمات القرآن بعدة لغات؛ ترجمات القرآن إلى الإنجليزية؛ ترجمات القرآن إلى الفرنسية؛ ترجمات القرآن إلى الأردية؛ ترجمات القرآن إلى الفارسية؛ ترجمات القرآن إلى التركية."
  en: "A page listed in a research summary supplied to the museum and approved by the founder on 21 November 2026; the page was not opened, and any page numbers are the summary's and unchecked. Publisher: Wikipedia. Used for: the history of Qur'an translations in several languages; English translations of the Qur'an; French translations of the Qur'an; Urdu translations of the Qur'an; Persian translations of the Qur'an; Turkish translations of the Qur'an."
  ur: "ایک صفحہ جو عجائب گھر کو دیے گئے تحقیقی خلاصے میں مذکور ہے اور جسے بانی نے 21 نومبر 2026 کو منظور کیا؛ صفحہ کھولا نہیں گیا، اور صفحات کے نمبر خلاصے کے ہیں اور جانچے نہیں گئے۔ ناشر: Wikipedia۔ اس سے استناد ان امور کے لیے ہے: کئی زبانوں میں قرآن کے تراجم کی تاریخ؛ قرآن کے انگریزی تراجم؛ قرآن کے فرانسیسی تراجم؛ قرآن کے اردو تراجم؛ قرآن کے فارسی تراجم؛ قرآن کے ترکی تراجم۔"
  fr: "Page citée dans un résumé de recherche remis au musée et approuvé par le fondateur le 21 novembre 2026 ; la page n'a pas été ouverte, et les numéros de page sont ceux du résumé, non vérifiés. Éditeur : Wikipedia. Utilisée pour : l'histoire des traductions du Coran en plusieurs langues; les traductions anglaises du Coran; les traductions françaises du Coran; les traductions ourdoues du Coran; les traductions persanes du Coran; les traductions turques du Coran."
  es: "Página citada en un resumen de investigación entregado al museo y aprobado por el fundador el 21 de noviembre de 2026; la página no se abrió, y los números de página son los del resumen, sin comprobar. Editor: Wikipedia. Usada para: la historia de las traducciones del Corán en varias lenguas; las traducciones inglesas del Corán; las traducciones francesas del Corán; las traducciones urdu del Corán; las traducciones persas del Corán; las traducciones turcas del Corán."
  tr: "Müzeye sunulan ve kurucu tarafından 21 Kasım 2026'da onaylanan bir araştırma özetinde bahsedilen bir sayfa; sayfa açılmamış ve belirtilen sayfa numaraları özetle aynı olup doğrulanmamıştır. Yayıncı: Wikipedia. Temel alanları şunlardır: Kur'an'ın Çok Dilde Çevirilerinin Tarihi; Kur'an'ın İngilizceye Çevirileri; Kur'an'ın Fransızcaya Çevirileri; Kur'an'ın Urduca Çevirileri; Kur'an'ın Farsçaya Çevirileri; Kur'an'ın Türkçeye Çevirileri."
  id: "Halaman yang disebutkan dalam abstrak penelitian yang diserahkan ke museum dan disetujui oleh pendiri pada 21 November 2026; halaman tersebut tidak dibuka, dan nomor halaman yang disebutkan adalah yang abstrak dan belum diverifikasi. Penerbit: Wikipedia. Halaman ini berdasar: Sejarah Terjemahan Al-Qur'an dalam Banyak Bahasa; Terjemahan Al-Quran ke dalam bahasa Inggris; Terjemahan Al-Qur'an ke dalam bahasa Prancis; Terjemahan Al-Qur'an ke dalam bahasa Urdu; Terjemahan Al-Qur'an ke dalam bahasa Persia; Terjemahan Al-Qur'an ke dalam bahasa Turki."
