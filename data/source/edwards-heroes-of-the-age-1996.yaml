summary:
  ar: "كتاب ديفيد إدواردز (1996) عن السلطة الأخلاقية على الحدود الأفغانية. يخصّص فصلا لحياة ملا هده — نجم الدين آخوندزاده — فيروي تلمذته على آخوند سوات وأداءه ذكر الطريقة وإرساله إلى هده لنشر الإسلام والطريقة، وتلاميذه وخلفاءه (حضرت بوتخاك وحاجي تورنغزي وغيرهما)، وأصله من منطقة غزني، ووفاته شيخا كبيرا سنة 1903 في روايته. ويصف ملا مشك عالم بأنه من أساتذة الصوفية الذين قادوا مقاومة الحرب الإنجليزية الأفغانية الثانية، ويروي دور سعيد الله (سرتور فقير) في ثورة 1897."
  en: "David B. Edwards' study of moral authority on the Afghan frontier (University of California Press, 1996). Its chapter on the Mulla of Hadda — Najmuddin Akhundzada — recounts his discipleship under the Akhund of Swat, his performance of the zikr of the Sufi order, his dispatch to Hadda to propagate Islam and tariqat, his many disciples and deputies (among them the Hazrat of Butkhak and the Haji of Turangzai), his origin in the Ghazni region, and, in Edwards' account, his death as an old man in 1903. The same book describes Mulla Mushk-i Alam among the Sufi masters who led resistance in the Second Anglo-Afghan War, and gives an extended account of Saidullah, the Sartor Faqir, in the 1897 uprising."
title: "Heroes of the Age: Moral Fault Lines on the Afghan Frontier"
