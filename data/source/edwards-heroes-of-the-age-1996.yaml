reliability_note: "Read on 27 October 2026 in the UC Press E-Books Collection full text. Edwards' account of Najmuddin rests on oral histories collected from descendants of the Mulla's disciples and is explicit about what is story and what is established; his death year 1903 differs from the 1902 of the International Encyclopedia of the First World War, and the difference is carried as debated in the person record. His description of Mushk-i Alam as a Sufi master is a single scholarly attestation and is treated as one source family in that record."
