summary:
  ar: "كتاب ديفيد إدواردز (1996) عن السلطة الأخلاقية على الحدود الأفغانية. يخصّص فصلا لحياة ملا هده — نجم الدين آخوندزاده — فيروي تلمذته على آخوند سوات وأداءه ذكر الطريقة وإرساله إلى هده لنشر الإسلام والطريقة، وتلاميذه وخلفاءه ⁦(حضرت بوتخاك وحاجي تورنغزي وغيرهما)⁩، وأصله من منطقة غزني، ووفاته شيخا كبيرا سنة 1903 في روايته. ويصف ملا مشك عالم بأنه من أساتذة الصوفية الذين قادوا مقاومة الحرب الإنجليزية الأفغانية الثانية، ويروي دور سعيد الله ⁦(سرتور فقير)⁩ في ثورة 1897."
  en: "David B. Edwards' study of moral authority on the Afghan frontier (University of California Press, 1996). Its chapter on the Mulla of Hadda — Najmuddin Akhundzada — recounts his discipleship under the Akhund of Swat, his performance of the zikr of the Sufi order, his dispatch to Hadda to propagate Islam and tariqat, his many disciples and deputies (among them the Hazrat of Butkhak and the Haji of Turangzai), his origin in the Ghazni region, and, in Edwards' account, his death as an old man in 1903. The same book describes Mulla Mushk-i Alam among the Sufi masters who led resistance in the Second Anglo-Afghan War, and gives an extended account of Saidullah, the Sartor Faqir, in the 1897 uprising."
  es: "El estudio de David B. Edwards sobre la autoridad moral en la frontera afgana (University of California Press, 1996). Su capítulo sobre el Mulla de Hadda —Najmuddin Akhundzada— relata su discipulado con el Akhund de Swat, su práctica del zikr de la orden sufí, su envío a Hadda para propagar el islam y la tariqa, sus numerosos discípulos y lugartenientes (entre ellos el Hazrat de Butkhak y el Haji de Turangzai), su origen en la región de Ghazni y, según Edwards, su muerte en 1903, ya anciano. El mismo libro describe al Mulla Mushk-i Alam entre los maestros sufíes que lideraron la resistencia en la Segunda Guerra Anglo-Afgana y ofrece un relato extenso de Saidullah, el Sartor Faqir, en el levantamiento de 1897."
  fr: "L'étude de David B. Edwards sur l'autorité morale à la frontière afghane (University of California Press, 1996) comprend un chapitre consacré au Mulla de Hadda – Najmuddin Akhundzada – relatant son apprentissage auprès de l'Akhund de Swat, sa pratique du zikr soufi, son envoi à Hadda pour propager l'islam et la tariqa, ses nombreux disciples et adjoints (parmi lesquels le Hazrat de Butkhak et le Haji de Turangzai), ses origines dans la région de Ghazni et, selon Edwards, sa mort en 1903, alors qu'il était âgé. Le même ouvrage décrit Mulla Mushk-i Alam parmi les maîtres soufis qui ont mené la résistance lors de la Seconde Guerre anglo-afghane et présente un récit détaillé de Saidullah, le Sartor Faqir, lors du soulèvement de 1897."
  ur: "ڈیوڈ بی ایڈورڈز کا افغان سرحد پر اخلاقی اتھارٹی کا مطالعہ ⁦(یونیورسٹی آف کیلیفورنیا پریس، 1996)⁩۔ ہدہ کے ملا پر اس کا باب - نجم الدین اخندزادہ - سوات کے آخوند کے تحت ان کی شاگردی، صوفی حکم کے ذکر کی کارکردگی، اسلام اور طریقت کی تبلیغ کے لیے ان کی ہدہ کی روانگی، ان کے بہت سے شاگرد اور نائبین ⁦(ان میں سے حضرت بطخاک اور ان کے خطہ غازی، اور غازی میں)⁩ کا ذکر ہے۔ ایڈورڈز کا بیان، 1903 میں ایک بوڑھے آدمی کے طور پر ان کی موت۔ اسی کتاب میں ملا مشک عالم کو صوفی آقاؤں میں سے بیان کیا گیا ہے جنہوں نے دوسری اینگلو-افغان جنگ میں مزاحمت کی قیادت کی، اور 1897 کی بغاوت میں سید اللہ، سارتر فقیر، کا تفصیلی بیان دیا ہے۔"
