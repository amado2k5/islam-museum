summary:
  ar: "آخر تدوينات سلسلة «ترجمة القرآن في الأسبوع»، لجوانا بينك، 2 مايو 2025، عن مشروع ترجمة القرآن إلى لغة الروهينغا: ترجمة صوتية أُنجزت بين 2021 وأغسطس 2023، وترجمة مكتوبة بخط حنيفي ما تزال جارية."
  en: "The last post of the 'Qur'an translation of the week' series, by Johanna Pink, 2 May 2025, on the project to translate the Qur'an into Rohingya: a spoken translation made between early 2021 and August 2023, and a written one in the Hanifi script still in progress."
  ur: "«ہفتے کا ترجمۂ قرآن» سلسلے کی آخری تحریر، از یوہانا پنک، 2 مئی 2025، روہنگیا زبان میں ترجمۂ قرآن کے منصوبے پر: 2021 سے اگست 2023 تک مکمل ہونے والا صوتی ترجمہ، اور حنیفی رسم الخط میں جاری تحریری ترجمہ۔"
title: "Qur'an translation of the week #217: The Rohingya Qur'an – an oral and written translation for a persecuted community"
