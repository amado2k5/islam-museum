label: { en: "GloQur, Qur'an translation of the week #217 (Pink Johanna, 2025)" }
summary:
  ar: "آخر تدوينات سلسلة «ترجمة القرآن في الأسبوع»، لجوانا بينك، 2 مايو 2025، عن مشروع ترجمة القرآن إلى لغة الروهينغا: ترجمة صوتية أُنجزت بين 2021 وأغسطس 2023، وترجمة مكتوبة بخط حنيفي ما تزال جارية."
  en: "The last post of the 'Qur'an translation of the week' series, by Johanna Pink, 2 May 2025, on the project to translate the Qur'an into Rohingya: a spoken translation made between early 2021 and August 2023, and a written one in the Hanifi script still in progress."
  ur: "«ہفتے کا ترجمۂ قرآن» سلسلے کی آخری تحریر، از یوہانا پنک، 2 مئی 2025، روہنگیا زبان میں ترجمۂ قرآن کے منصوبے پر: 2021 سے اگست 2023 تک مکمل ہونے والا صوتی ترجمہ، اور حنیفی رسم الخط میں جاری تحریری ترجمہ۔"
  es: "La última entrada de la serie \"Traducción semanal del Corán\", de Johanna Pink, del 2 de mayo de 2025, trata sobre el proyecto de traducción del Corán al idioma rohingya: una traducción oral realizada entre principios de 2021 y agosto de 2023, y una escrita en la escritura hanifi que aún está en proceso."
  fr: "Le dernier article de la série « Traduction du Coran de la semaine », par Johanna Pink, le 2 mai 2025, sur le projet de traduction du Coran en rohingya: une traduction orale réalisée entre début 2021 et août 2023, et une traduction écrite en écriture hanifi toujours en cours."
  tr: "Joanna Pink'in 2 Mayıs 2025 tarihli \"Kur'an Çevirisi Haftada\" serisinin en son yazıları; Kur'an'ın Rohingya diline çevrilmesi projesiyle ilgili: 2021 ile Ağustos 2023 arasında tamamlanan sesli çeviri ve Hanifi alfabesiyle çevirisi hâlâ devam ediyor."
  id: "Postingan terbaru dalam seri \"Terjemahan Al-Qur'an dalam Minggu Ini,\" oleh Joanna Pink, 2 Mei 2025, tentang proyek menerjemahkan Al-Qur'an ke dalam bahasa Rohingya: terjemahan audio yang selesai antara 2021 dan Agustus 2023, dengan terjemahan aksara Hanifi yang masih berlangsung."
title: "Qur'an translation of the week #217: The Rohingya Qur'an – an oral and written translation for a persecuted community"
