reliability_note: "Signed research post by the project's principal investigator, read in full in Chrome on 7 November 2026. Used for the project's initiator and main translator Qutub Shah (a PhD candidate at the International Islamic University Malaysia), its publisher Dakwah Corner Bookstore (Petaling Jaya), its sources (commentaries and the King Fahd Complex's English, Urdu, Bengali and Burmese translations), the spoken translation (early 2021 to August 2023) set with the recitation of Muhammad Ayyub, the app and website, the written version in the Hanifi script (first five suras so far), the planned print run of 2,000, and the background on the Rohingya language and script as the author gives them."
