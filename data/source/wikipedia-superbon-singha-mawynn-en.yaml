  ar: "مقالة ويكيبيديا الإنجليزية عن سوبربون سينغها ماوين؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه عند الولادة سوباتشاي موينسانغ وميلاده في فتهالونغ في 16 أغسطس 1990، وبطولته الأولى لبطولة ون للكيك بوكسينغ لوزن الريشة سنة 2021 حين أطاح بجورجيو بتروسيان، واستعادته اللقب سنة 2024. ولا تذكر أي ديانة له."
  en: "English Wikipedia article on Superbon Singha Mawynn; used for entity facts only. It gives his birth name Suppachai Muensang and his birth in Phatthalung on 16 August 1990, his first ONE Featherweight Kickboxing World Championship in 2021, won by knocking out Giorgio Petrosyan, and his return to the title in 2024. It makes no statement of any religion for him."
