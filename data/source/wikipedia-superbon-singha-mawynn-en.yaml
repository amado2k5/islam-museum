reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The infobox gives his birth name Suppachai Muensang, his birth on 16 August 1990 in Phatthalung, Thailand, his other ring names Superbon Banchamek and Superbon Lookjaomaesaivaree, his record of 117 wins (29 by knockout) and 37 losses, and his trainers Buakaw Banchamek and Suthat Muangmun (Trainer Gae). The lead calls him the current and two-time ONE Featherweight Kickboxing World Champion; the text records the inaugural title win over Giorgio Petrosyan on 15 October 2021, the defence against Marat Grigorian on 25 March 2022, the title loss to Chingiz Allazov on 14 January 2023, the interim title win over Grigorian on 5 April 2024, his 2016 Kunlun Fight World Max tournament title, his 2018 Enfusion tournament title and his IFMA world golds of 2015, 2016 and 2017. The article makes no statement of his religion in its text or categories."
