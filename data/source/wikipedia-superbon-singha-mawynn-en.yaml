summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سوبربون سينغها ماوين؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه عند الولادة سوباتشاي موينسانغ وميلاده في فتهالونغ في 16 أغسطس 1990، وبطولته الأولى لبطولة ون للكيك بوكسينغ لوزن الريشة سنة 2021 حين أطاح بجورجيو بتروسيان، واستعادته اللقب سنة 2024. ولا تذكر أي ديانة له."
  en: "English Wikipedia article on Superbon Singha Mawynn; used for entity facts only. It gives his birth name Suppachai Muensang and his birth in Phatthalung on 16 August 1990, his first ONE Featherweight Kickboxing World Championship in 2021, won by knocking out Giorgio Petrosyan, and his return to the title in 2024. It makes no statement of any religion for him."
  es: "Artículo de Wikipedia en inglés sobre Superbon Singha Mawynn; utilizado únicamente para datos sobre la persona. Indica que su nombre de nacimiento es Suppachai Muensang y que nació en Phatthalung el 16 de agosto de 1990, que ganó su primer Campeonato Mundial de Kickboxing de Peso Pluma de ONE Championship en 2021 por nocaut contra Giorgio Petrosyan, y que volvió a disputar el título en 2024. No menciona ninguna religión suya."
  fr: "Article Wikipédia en anglais sur Superbon Singha Mawynn; utilisé uniquement à titre informatif. Il mentionne son nom de naissance, Suppachai Muensang, sa naissance à Phatthalung le 16 août 1990, son premier titre de champion du monde ONE de kickboxing poids plume en 2021 (victoire par KO contre Giorgio Petrosyan) et son retour pour le titre en 2024. Aucune information n'est fournie concernant sa religion."
