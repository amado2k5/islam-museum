summary:
  ar: "صفحة «Levantine Arabic – Sociology of Language» لدى CUNY Academic Commons، 2024. لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملف بحث قدمه المؤسس إلى المتحف ووافق على استعماله في 21 نوفمبر 2026. يُستشهد بها في: التصنيف والتجميع، النحو، المفردات، أعداد المتكلمين أو غيابها."
  en: "The page \"Levantine Arabic – Sociology of Language\" (CUNY Academic Commons; 2024). The museum did not open it itself: its content is known from a research file supplied to the museum by the founder, who approved its use on 21 November 2026. Cited for: classification and grouping, syntax, lexicon, speaker numbers or the lack of them."
  ur: "صفحہ «Levantine Arabic – Sociology of Language»، CUNY Academic Commons، 2024۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کا مواد بانی کی فراہم کردہ تحقیقی فائل سے معلوم ہوا، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ ان کے لیے دیا گیا: درجہ بندی اور گروہ بندی، نحو، ذخیرہ الفاظ، بولنے والوں کی تعداد یا اس کی عدم دستیابی۔"
  fr: "La page « Levantine Arabic – Sociology of Language » (CUNY Academic Commons ; 2024). Le musée ne l'a pas ouverte lui-même : son contenu est connu par un dossier de recherche fourni au musée par le fondateur, qui en a approuvé l'usage le 21 novembre 2026. Citée pour : la classification et le regroupement, la syntaxe, le lexique, le nombre de locuteurs ou son absence."
  es: "La página «Levantine Arabic – Sociology of Language» (CUNY Academic Commons; 2024). El museo no la abrió por sí mismo: su contenido se conoce por un archivo de investigación entregado al museo por el fundador, que aprobó su uso el 21 de noviembre de 2026. Citada para: la clasificación y la agrupación, la sintaxis, el léxico, el número de hablantes o su ausencia."
  tr: "\"Levant Arapçası – Dil Sosyolojisi\" sayfası, CUNY Academic Commons, 2024. Müze bunu kendisi açmadı; içeriği kurucu tarafından müzeye sunulan bir araştırma dosyasından biliniyordu ve 21 Kasım 2026'da kullanmayı kabul etti. Atıf alanlar: sınıflandırma ve gruplama, dilbilgisi, kelime dağarcığı, konuşmacı sayısı veya devamsızlık."
  id: "Halaman \"Bahasa Arab Levant – Sosiologi Bahasa\" di CUNY Academic Commons, 2024. Museum tidak membukanya sendiri; isinya diketahui dari berkas penelitian yang diserahkan oleh pendiri ke museum dan ia setuju untuk menggunakannya pada 21 November 2026. Dikutip dalam: klasifikasi dan pengelompokan, tata bahasa, kosakata, jumlah penutur atau ketidakhadiran."
