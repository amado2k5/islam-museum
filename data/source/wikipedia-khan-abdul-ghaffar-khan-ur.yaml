summary:
  ar: "مقالة ويكيبيديا الأردية عن خان عبد الغفار خان؛ تُستخدم لوقائع الكيان فقط. تروي نشأته وحركته خداي خدمتگار ونضاله اللاعنفي، وحملته عبر «أنجمن إصلاح» للقضاء على الرسوم المخالفة للإسلام بين المسلمين، وسنوات سجنه ووفاته سنة 1988."
  en: "Urdu Wikipedia article on Khan Abdul Ghaffar Khan; used for entity facts only. It recounts his life, the Khudai Khidmatgar movement and his nonviolent struggle, his campaign through the Anjuman-e Islah against un-Islamic customs among Muslims, his years of imprisonment and his death in 1988."
  es: "Artículo de Wikipedia en urdu sobre Khan Abdul Ghaffar Khan; utilizado únicamente para datos sobre la persona. Narra su vida, el movimiento Khudai Khidmatgar y su lucha no violenta, su campaña a través de Anjuman-e Islah contra las costumbres antiislámicas entre los musulmanes, sus años de prisión y su muerte en 1988."
  fr: "Article de Wikipédia en ourdou sur Khan Abdul Ghaffar Khan; utilisé uniquement à des fins d’information. Il relate sa vie, le mouvement Khudai Khidmatgar et sa lutte non-violente, sa campagne menée par l’Anjuman-e Islah contre les coutumes non islamiques chez les musulmans, ses années d’emprisonnement et sa mort en 1988."
  ur: "خان عبدالغفار خان پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی زندگی، خدائی خدمتگار تحریک اور ان کی عدم تشدد کی جدوجہد، انجمن اصلاح کے ذریعے مسلمانوں میں غیر اسلامی رسم و رواج کے خلاف ان کی مہم، ان کی قید کے سالوں اور 1988 میں ان کی موت کا ذکر ہے۔"
