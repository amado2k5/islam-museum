summary:
  ar: "مقالة ويكيبيديا الإندونيسية المطوّلة عن علاء الدين القهار؛ تنص على أنه لا مصدر معاصر لولادته، وتؤرخ وفاته بنقش قبره: 8 جمادى الأولى 979هـ / 28 سبتمبر 1571."
  en: "Long Indonesian Wikipedia article on Alauddin al-Qahhar; it states that no contemporary source gives his birth date and dates his death from his grave inscription to 8 Jumada al-awwal 979 AH / 28 September 1571."
  es: "Artículo extenso de la Wikipedia en indonesio sobre Alauddin al-Qahhar; afirma que ninguna fuente contemporánea da su fecha de nacimiento y fecha su muerte a partir de la inscripción de su tumba en el 8 de Jumada al-Awwal de 979 AH / 28 de septiembre de 1571."
  fr: "Long article de Wikipédia indonésien sur Alauddin al-Qahhar; il indique qu'aucune source contemporaine ne donne sa date de naissance et date sa mort d'après l'inscription de sa tombe au 8 Jumada al-Awwal 979 AH / 28 septembre 1571."
  ur: "علاء الدین القہار پر طویل انڈونیشین ویکیپیڈیا مضمون؛ اس میں کہا گیا ہے کہ کوئی بھی عصری ماخذ ان کی تاریخ پیدائش اور وفات کی تاریخ ان کے مقبرے سے 8 جمادی الاول 979 ہجری / 28 ستمبر 1571 بتاتا ہے۔"
  tr: "Aladdin Al-Qahar hakkında kapsamlı Endonezya Vikipedi makalesi, doğumuna dair çağdaş bir kaynak olmadığını belirtir ve mezarındaki yazıtla ölümünü tarihlendirir: 8 Jumada al-Awwal 979 Hicri / 28 Eylül 1571."
  id: "Artikel Wikipedia Indonesia yang luas tentang Aladdin Al-Qahar menyatakan bahwa tidak ada sumber kontemporer untuk kelahirannya, dan menandai kematiannya dengan tulisan di makamnya: 8 Jumada al-Awwal 979 AH / 28 September 1571."
