summary:
  ar: "مقالة ويكيبيديا العربية عن تسجيلات أوايكننغ؛ لوقائع الكيان فقط: التأسيس سنة 2000، واستحواذ بي فور يو على حصة الأغلبية سنة 2018، وجائزة أفضل شركة إعلامية إسلامية، وعدد الموظفين سنة 2023، والألبومات والفنانون."
  en: "Arabic Wikipedia article on Awakening Records; entity facts only: founding in 2000, the 2018 majority stake taken by B4U, the best Islamic media company award, the staff count in 2023, and the albums and artists."
  es: "Artículo en árabe de la Wikipedia sobre Awakening Records; solo datos sobre la entidad: fundación en 2000, la participación mayoritaria adquirida por B4U en 2018, el premio a la mejor empresa de medios islámicos, el número de empleados en 2023 y los álbumes y artistas."
  fr: "Article Wikipédia en arabe sur Awakening Records; informations sur l'entité uniquement: fondation en 2000, prise de participation majoritaire par B4U en 2018, prix de la meilleure entreprise de médias islamiques, nombre d'employés en 2023, et albums et artistes."
  ur: "بیداری کے ریکارڈز پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: 2000 میں بانی، 2018 کا اکثریتی حصہ B4U نے لیا، بہترین اسلامی میڈیا کمپنی کا ایوارڈ، 2023 میں عملے کی تعداد، اور البمز اور فنکار۔"
  tr: "Awakening kayıtları hakkında Arapça Vikipedi makalesi; sadece kuruluşun gerçekleri için: 2000'de kurulması, B For You'nun 2018'de çoğunluk hissesini edinmesi, En İyi İslami Medya Şirketi ödülü, 2023'te çalışan sayısı, albümler ve sanatçılar."
  id: "Artikel Wikipedia Arab tentang rekaman Awakening; hanya untuk fakta entitas: didirikan pada tahun 2000, B For You memperoleh saham mayoritas pada 2018, penghargaan Perusahaan Media Islam Terbaik, jumlah karyawan pada 2023, album, dan artis."
