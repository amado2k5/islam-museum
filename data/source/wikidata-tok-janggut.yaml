summary:
  ar: "عنصر ويكيداتا Q7813447 لتوك جانغوت؛ يحمل ميلاده سنة 1853 ووفاته في 25 حزيران 1915 ⁦(وهو التاريخ المختلف فيه)⁩، ويعطي ديانته «الإسلام» إجمالًا دون مذهب."
  en: "Wikidata item Q7813447 for Tok Janggut; it carries his birth in 1853 (year only) and his death on 25 June 1915 — the contested variant of the death date — and gives his religion as Islam in general, with no school."
  es: "El elemento Q7813447 de Wikidata para Tok Janggut; contiene su nacimiento en 1853 (solo el año) y su muerte el 25 de junio de 1915 —la variante controvertida de la fecha de muerte— y dice que su religión era el Islam en general, sin ninguna escuela."
  fr: "L'élément Wikidata Q7813447 pour Tok Janggut; il indique sa naissance en 1853 (année seulement) et sa mort le 25 juin 1915 — la variante contestée de la date de décès — et indique sa religion comme étant l'islam en général, sans école."
  ur: "ٹوک جنگگٹ کے لیے وکی ڈیٹا آئٹم Q7813447؛ اس میں ان کی پیدائش 1853 ⁦(صرف سال)⁩ اور اس کی موت 25 جون 1915 کو ہوتی ہے - تاریخ موت کا متنازعہ شکل - اور اس کا مذہب عام طور پر اسلام کے طور پر دیتا ہے، جس میں کوئی اسکول نہیں ہے۔"
  tr: "Wikidata öğesi Tuk Jangut tarafından Q7813447; 1853 doğumlu ve 25 Haziran 1915'te (tartışmalı tarih) vefat etmiştir ve dini olarak genel olarak \"İslam\" olarak verilmiştir, herhangi bir mezhep belirtilmemiştir."
  id: "Elemen Wikidata Q7813447 oleh Tuk Jangut; ia lahir pada tahun 1853 dan meninggal pada 25 Juni 1915 (yang merupakan tanggal yang diperdebatkan), dan menyebutkan agamanya sebagai \"Islam\" secara umum tanpa sekte apa pun."
