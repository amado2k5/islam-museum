  ar: "مقالة ويكيبيديا العربية عن سعد زغلول؛ تُستخدم لوقائع الكيان فقط. تروي مولده في إبيانة ونشأته يتيمًا وقيادته ثورة 1919 ورئاسته الوزراء ثم مجلس النواب حتى وفاته سنة 1927، وتنبّه إلى تضارب الروايات حول سنة مولده بين 1857 و1858 و1860."
  en: "Arabic Wikipedia article on Saad Zaghloul; used for entity facts only. It recounts his birth at Ibyana, his orphaned upbringing, his leadership of the 1919 revolution, his premiership and then his presidency of the Chamber of Deputies until his death in 1927, and notes that reports of his birth year conflict between 1857, 1858 and 1860."
