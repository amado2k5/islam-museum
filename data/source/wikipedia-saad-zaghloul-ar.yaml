summary:
  ar: "مقالة ويكيبيديا العربية عن سعد زغلول؛ تُستخدم لوقائع الكيان فقط. تروي مولده في إبيانة ونشأته يتيمًا وقيادته ثورة 1919 ورئاسته الوزراء ثم مجلس النواب حتى وفاته سنة 1927، وتنبّه إلى تضارب الروايات حول سنة مولده بين 1857 و1858 و1860."
  en: "Arabic Wikipedia article on Saad Zaghloul; used for entity facts only. It recounts his birth at Ibyana, his orphaned upbringing, his leadership of the 1919 revolution, his premiership and then his presidency of the Chamber of Deputies until his death in 1927, and notes that reports of his birth year conflict between 1857, 1858 and 1860."
  es: "Artículo en árabe de la Wikipedia sobre Saad Zaghloul; utilizado únicamente para datos biográficos. Relata su nacimiento en Ibyana, su infancia como huérfano, su liderazgo en la revolución de 1919, su mandato como primer ministro y posteriormente su presidencia de la Cámara de Diputados hasta su fallecimiento en 1927, y señala que existen discrepancias sobre la fecha de su nacimiento, situándola entre 1857, 1858 y 1860."
  fr: "Article de Wikipédia en arabe sur Saad Zaghloul; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Ibyana, son enfance d’orphelin, son rôle à la tête de la révolution de 1919, son mandat de Premier ministre puis sa présidence de la Chambre des députés jusqu’à sa mort en 1927, et note que les sources concernant son année de naissance divergent entre 1857, 1858 et 1860."
  ur: "سعد زغلول پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ایبیانا میں اس کی پیدائش، اس کی یتیم پرورش، 1919 کے انقلاب کی قیادت، اس کی وزارت عظمیٰ اور پھر 1927 میں اس کی موت تک چیمبر آف ڈیپٹیز کی صدارت کا ذکر کیا گیا ہے، اور یہ نوٹ کیا گیا ہے کہ اس کی پیدائش کے سال 1857، 1858 اور 1860 کے درمیان تنازعات کی اطلاع ہے۔"
  tr: "Saad Zaghloul hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılır. Ibiana'daki doğumunu, yetim olarak yetiştirilme biçimini, 1919 devrimi sırasında liderliğini, başbakanlığını ve ardından 1927'deki ölümüne kadar Temsilciler Meclisi'ndeki görevini anlatır ve 1857, 1858 ve 1860 yılları arasındaki doğum yılına dair çelişkili anlatımları içerir."
  id: "Artikel Wikipedia berbahasa Arab tentang Saad Zaghloul hanya digunakan untuk fakta-fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Ibiana, masa kecilnya sebagai yatim piatu, kepemimpinannya selama revolusi 1919, masa jabatannya sebagai perdana menteri, dan kemudian masa jabatannya di Dewan Perwakilan Rakyat hingga kematiannya pada tahun 1927, serta mencatat catatan yang saling bertentangan mengenai tahun kelahirannya antara 1857, 1858, dan 1860."
