reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. Its lead dates him 1858–1927, while its text states that reports of his birth conflict: some give July 1857, others July 1858, and his law-certificate records make him born in June 1860; its infobox death template computes his age from 1 July 1859, and it gives his death on 23 August 1927 at Cairo. It gives his birthplace as Ibyana, then in the Gharbia directorate, now in Kafr el-Sheikh, his father's death when Saad was five, his brother Ahmad Fathy Zaghlul, his premiership and his presidency of the Chamber of Deputies from 10 June 1926 until his death. Its infobox has no religion field and its text names no school for him."
