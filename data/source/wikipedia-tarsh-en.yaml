summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الطرش؛ لوقائع الكيان فقط: الطرش قالب محفور من خشب أو قصدير مستعمل نحو 900 إلى 1436/1444م، أكثر من مئة مطبوع عربي على ورق ورقّ وربما برديّ معظمها أشرطة تمائم، شواهد أثرية بالفسطاط، لا قالب طرش باقٍ، نشأته بين نقل صيني واختراع مستقل متنازع عليها، مفردات الطباعة بلهجة بني ساسان، شهادة أبي دلف الخزرجي نحو 952 وابن النديم والجوبري نحو 1232-1248، الطوابع الفاطمية الرسمية لإيصالات الضريبة بختم «الإمام الحاكم»، طبع المراسيم الموحدية، ونقود الإيلخان خان الورقية."
  en: "English Wikipedia article on the tarsh; entity facts only: an engraved block of wood or tin in use c. 900 to 1436/1444, over a hundred known Arabic blockprints on paper, parchment and possibly papyrus, mostly small amulet strips, archaeological finds at Fustat, no surviving tarsh block itself, origin disputed between Chinese transmission and independent invention, the printing vocabulary in the Banu Sasan dialect, the Abu Dulaf (c. 952), Ibn al-Nadim and al-Jawbari (c. 1232-1248) witnesses, Fatimid chancery tax-receipt stamps reading al-Imam al-Hakim, Almohad decree printing, and the Ilkhanid paper-money printing of 1294."
  es: "Artículo de la Wikipedia en inglés sobre el tarsh; solo datos sobre la entidad: un bloque grabado de madera o estaño en uso c. 900 a 1436/1444, más de cien grabados árabes conocidos en papel, pergamino y posiblemente papiro, en su mayoría pequeñas tiras de amuletos, hallazgos arqueológicos en Fustat, ningún bloque de tarsh sobrevivió, origen disputado entre transmisión china e invención independiente, el vocabulario de impresión en el dialecto Banu Sasan, los testigos Abu Dulaf (c. 952), Ibn al-Nadim y al-Jawbari (c. 1232-1248), sellos de recibos de impuestos de la cancillería fatimí que dicen al-Imam al-Hakim, impresión de decretos almohades y la impresión de papel moneda iljánida de 1294."
  fr: "Article de Wikipédia en anglais sur le tarsh; faits concernant l’entité uniquement: un bloc de bois ou d’étain gravé utilisé entre 900 et 1436/1444 environ, plus d’une centaine d’estampes arabes connues sur papier, parchemin et peut-être papyrus, principalement de petites bandes d’amulettes, des découvertes archéologiques à Fustat, aucun bloc de tarsh lui-même n’a survécu, l’origine est contestée entre transmission chinoise et invention indépendante, le vocabulaire d’impression dans le dialecte Banu Sasan, les témoins Abu Dulaf (vers 952), Ibn al-Nadim et al-Jawbari (vers 1232-1248), des timbres fiscaux de la chancellerie fatimide portant la mention al-Imam al-Hakim, l’impression de décrets almohades et l’impression de papier-monnaie ilkhanide de 1294."
  ur: "ترش پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: استعمال میں لکڑی یا ٹن کا ایک کندہ شدہ بلاک c. 900 تا 1436/1444، کاغذ پر سو سے زیادہ مشہور عربی بلاک پرنٹس، پارچمنٹ اور ممکنہ طور پر پاپائرس، زیادہ تر چھوٹے تعویذ کی پٹیاں، فوسٹاٹ میں آثار قدیمہ کی دریافت، خود کوئی ترش بلاک نہیں، اصل چینی ٹرانسمیشن اور آزاد ایجاد کے درمیان متنازعہ ہے، طباعت کے الفاظ، ابوسفیان میں ابوسفیان۔ 952)، ابن الندیم اور الجوباری (c. 1232-1248) گواہ، فاطمی چانسری ٹیکس رسید مہریں پڑھتے ہوئے الامام الحکیم، الموحد فرمان پرنٹنگ، اور الخانید پیپر منی پرنٹنگ 1294۔"
  tr: "Al-Taraş hakkında İngilizce Wikipedia makalesi; sadece varlığın gerçekleri için: Al-Taraş, yaklaşık 900 ila 1436/1444 yılları arasında kullanılan ahşap veya teneke üzerine oyulmuş bir kalıptır, kağıt üzerine yüzün üzerinde Arap baskısı ve muhtemelen papirüsü, çoğu muska kurdeleleri, Fustat'tan arkeolojik kanıtlar, Çin aktarımı ile bağımsız tartışmalı bir icat arasında kalan tarsh kalıbı kalmamıştır, Sasani lehçesinde kelime dağarcığı basmak, 952 civarında Ebu Dulf el-Hazraji'nin ve 1232-1248 civarında İbn el-Nadim ile el-Cübri'nin tanıklığı, 'İmam el-Hakim' tarafından damgalanmış vergi makbuzları için resmi Fatimi pulları, Almohad fermanlarının basımı ve İlhan Han'ın kağıt paraları."
  id: "Artikel Wikipedia bahasa Inggris tentang Al-Tarash; hanya untuk fakta entitas: Al-Tarash adalah cetakan yang diukir dari kayu atau timah yang digunakan sekitar tahun 900 hingga 1436/1444 M, lebih dari seratus cetakan Arab di atas kertas dan kemungkinan papirus, sebagian besar adalah pita jimat, bukti arkeologi dari Fustat, tidak ada cetakan tarsh yang tersisa, berasal dari transmisi Tiongkok dan penemuan independen yang diperdebatkan, kosakata cetak dalam dialek Sasanian, kesaksian Abu Dulf al-Khazraji sekitar tahun 952 dan Ibn al-Nadim serta al-Jubri sekitar 1232-1248, perangko resmi Fatimiyah untuk tanda terima pajak yang distempel oleh 'Imam al-Hakim,' pencetakan dekret Almohad, dan koin kertas Ilkhan Khan."
