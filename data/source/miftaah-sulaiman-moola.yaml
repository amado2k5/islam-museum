summary:
  ar: "ملف معهد «مفتاح» عن المدرّس سليمان مولا: بدأ دراسة العلوم الشرعية صغيرا، وحفظ القرآن في الرابعة عشرة، ودرس سبع سنوات العربية والتفسير والحديث والعقيدة والفقه «متخصصا في المذهب الحنفي»، ودرّس في دار العلوم زكريا بجنوب أفريقيا، ويحاضر إذاعيا وفي خطب الجمعة، وهو مستشار أول ومدرّس في مثابة وناشر كتاب «الشمس التي لا تغيب أبدا»."
  en: "The Miftaah Institute's instructor profile of Shaykh Sulaiman Moola: he began studying the sacred sciences young, memorised the Qur'an at fourteen, studied Arabic, tafsir, hadith, aqidah and fiqh for seven years '[specializing in the Hanafi School]', taught at Dar al-Uloom Zakariyya in South Africa, addresses radio programmes and Friday sermons, and is a senior advisor and teacher at Mathabah who recently published The Sun That Never Set."
  es: "El perfil del instructor del Instituto Miftaah, Shaykh Sulaiman Moola, indica que comenzó a estudiar las ciencias sagradas a una edad temprana, memorizó el Corán a los catorce años, estudió árabe, tafsir, hadith, aqidah y fiqh durante siete años, especializándose en la escuela Hanafi, impartió clases en Dar al-Uloom Zakariyya en Sudáfrica, participa en programas de radio y sermones de los viernes, y es asesor principal y profesor en Mathabah, donde recientemente publicó El sol que nunca se puso."
  fr: "Profil de l'instructeur de l'Institut Miftaah, Cheikh Sulaiman Moola: il a commencé à étudier les sciences sacrées très jeune, a mémorisé le Coran à quatorze ans, a étudié l'arabe, le tafsir, le hadith, l'aqida et le fiqh pendant sept ans [se spécialisant dans l'école hanafite], a enseigné à Dar al-Uloom Zakariyya en Afrique du Sud, intervient dans des émissions de radio et des sermons du vendredi, et est conseiller principal et enseignant à Mathabah, où il a récemment publié « Le soleil qui ne se couchait jamais »."
  ur: "مفتاح انسٹی ٹیوٹ کا شیخ سلیمان مولا کا انسٹرکٹر پروفائل: انہوں نے چھوٹی عمر میں علوم مقدسہ کا مطالعہ شروع کیا، چودہ سال کی عمر میں قرآن حفظ کیا، سات سال تک عربی، تفسیر، حدیث، عقیدہ اور فقہ کی تعلیم حاصل کی، ''[حنفی مکتب میں مہارت]''، دارالعلوم جنوبی افریقہ میں خطبہ جمعہ اور جمعہ کے پروگرام میں پڑھایا۔ خطبات، اور مطابہ کے ایک سینئر مشیر اور استاد ہیں جنہوں نے حال ہی میں The Sun جو کبھی غروب نہیں کیا شائع کیا۔"
  tr: "Miftah Enstitüsü dosyası, öğretmen Süleyman Molla hakkında: Küçük yaşta İslam bilimleri okumaya başladı, on dört yaşında Kur'an'ı ezberledi ve yedi yıl boyunca Arapça, Tefsir, Hadis, İnanç ve Fıkh dersleri verdi; Hanefi düşünce ekoline odaklandı. Güney Afrika'daki Dar Al-Uloom Zakaria'da ders verdi, radyoda konferanslar verdi ve Cuma vaazları verdi, festivalde kıdemli danışman ve öğretmen olarak görev yaptı ve \"Asla Batmayan Güneş\" kitabının yayıncısıdır."
  id: "Berkas Institut Miftah tentang guru Suleiman Molla: Ia mulai mempelajari ilmu Islam sejak usia muda, menghafal Al-Qur'an pada usia empat belas tahun, dan mengajar bahasa Arab, Tafsir, Hadis, Iman, dan Hukum selama tujuh tahun, dengan spesialisasi dalam aliran pemikiran Hanafi. Ia mengajar di Dar Al-Uloom Zakaria di Afrika Selatan, memberikan kuliah di radio dan menyampaikan khotbah pada hari Jumat, serta menjadi penasihat senior dan pengajar di festival serta penerbit buku \"The Sun That Never Sinks.\""
