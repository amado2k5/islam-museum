summary:
  ar: "ملف معهد «مفتاح» عن المدرّس سليمان مولا: بدأ دراسة العلوم الشرعية صغيرا، وحفظ القرآن في الرابعة عشرة، ودرس سبع سنوات العربية والتفسير والحديث والعقيدة والفقه «متخصصا في المذهب الحنفي»، ودرّس في دار العلوم زكريا بجنوب أفريقيا، ويحاضر إذاعيا وفي خطب الجمعة، وهو مستشار أول ومدرّس في مثابة وناشر كتاب «الشمس التي لا تغيب أبدا»."
  en: "The Miftaah Institute's instructor profile of Shaykh Sulaiman Moola: he began studying the sacred sciences young, memorised the Qur'an at fourteen, studied Arabic, tafsir, hadith, aqidah and fiqh for seven years '[specializing in the Hanafi School]', taught at Dar al-Uloom Zakariyya in South Africa, addresses radio programmes and Friday sermons, and is a senior advisor and teacher at Mathabah who recently published The Sun That Never Set."
