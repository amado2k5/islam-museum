summary:
  ar: "مقالة ويكيبيديا الفرنسية عن توفيق باشا؛ يعطي صندوقها دينه «الإسلام» بصورة عامة دون مذهب، وتواريخها توافق المقالة الإنجليزية."
  en: "French Wikipedia article on Tawfiq Pacha, Khedive of Egypt; used for entity facts only. Its infobox gives his religion as Islam in generic form, with no school named, and its dates (15 November 1852 – 7 January 1892, Helwan) agree with the English article."
  es: "Artículo de la Wikipedia en francés sobre Tawfiq Pacha, jedive de Egipto; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que su religión era el islam de forma genérica, sin mencionar ninguna escuela, y sus fechas (15 de noviembre de 1852 - 7 de enero de 1892, Helwan) coinciden con el artículo en inglés."
  fr: "Article de Wikipédia en français sur Tawfiq Pacha, khédive d'Égypte; utilisé uniquement pour les informations sur l'entité. Son infobox indique que sa religion était l'islam de manière générique, sans préciser d'école, et ses dates (15 novembre 1852 – 7 janvier 1892, Helwan) correspondent à celles de l'article en anglais."
  ur: "فرانسیسی ویکیپیڈیا مضمون برائے توفیق پاچا، کھیڈیو مصر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی خانہ اس کے مذہب کو اسلام کے طور پر عام شکل میں دیتا ہے، جس میں کسی اسکول کا نام نہیں ہے، اور اس کی تاریخیں ⁦(15 نومبر 1852 - 7 جنوری 1892، ہیلوان)⁩ انگریزی مضمون سے متفق ہیں۔"
  tr: "Tawfiq Paşa hakkında Fransızca Wikipedia makalesi; kutusunda genellikle dini \"İslam\" olarak herhangi bir mezhep belirtilmez ve tarihleri İngilizce makaleyle eşleşir."
  id: "Artikel Wikipedia Prancis tentang Tawfiq Pasha; kotaknya umumnya mencantumkan agamanya \"Islam\" tanpa sekte, dan tanggalnya sesuai dengan artikel bahasa Inggris."
