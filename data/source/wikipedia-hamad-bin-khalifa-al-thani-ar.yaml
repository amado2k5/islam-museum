  ar: "مقالة ويكيبيديا العربية عن حمد بن خليفة آل ثاني؛ تُستخدم لوقائع الكيان فقط. توافق المقالة الإنجليزية في الولادة (1 يناير 1952) والحكم (1995–2013) والوفاة في 12 يوليو 2026، وتسمّيه «الأمير الوالد» وتذكر كنيته «أبو مشعل». لا يرد في صندوق معلوماتها ولا في نصها أي ذكر لدينه أو مذهبه."
