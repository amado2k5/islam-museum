summary:
  ar: "مقال موسوعي عن جوسوف نركيتش ⁦(مواليد 1994)⁩: ميلاده في 23 أغسطس 1994 في زيفينيتشا، واختياره في درافت 2014، ومواسمه في دنفر وبورتلاند وفينيكس وشارلوت ويوتا. ويذكر المقال أنه مسلم ممارس وأنه أحيا بدء رمضان في أبريل 2021، دون أن يسمي مذهباً."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth on 23 August 1994 at Živinice, his drafting 16th overall in 2014 and his seasons in Denver, Portland, Phoenix, Charlotte and Utah. Its personal-life section states that he is a practicing Muslim and records his marking of Ramadan's start in April 2021. It names no school."
  es: "Artículo de enciclopedia editado por la comunidad, recuperado íntegramente en la revisión indicada; menciona su nacimiento el 23 de agosto de 1994 en Živinice, su selección en el puesto 16 del draft de 2014 y sus temporadas en Denver, Portland, Phoenix, Charlotte y Utah. En la sección sobre su vida personal se indica que es musulmán practicante y se registra que celebró el inicio del Ramadán en abril de 2021. No se menciona ninguna universidad."
  fr: "Article encyclopédique collaboratif, consulté intégralement à la date indiquée; il mentionne sa naissance le 23 août 1994 à Živinice, sa sélection en 16e position lors de la draft 2014 et ses saisons à Denver, Portland, Phoenix, Charlotte et Utah. La section consacrée à sa vie personnelle précise qu'il est musulman pratiquant et mentionne qu'il a célébré le début du Ramadan en avril 2021. Aucune école n'est citée."
  ur: "کمیونٹی میں ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظرثانی پر مکمل طور پر بازیافت کیا گیا؛ یہ اس کی پیدائش 23 اگست 1994 کو Živinice میں ہوئی، اس کا 2014 میں مجموعی طور پر 16 واں ڈرافٹنگ اور ڈینور، پورٹ لینڈ، فینکس، شارلٹ اور یوٹاہ میں اس کے سیزن۔ اس کے ذاتی زندگی کے حصے میں کہا گیا ہے کہ وہ ایک مشق کرنے والا مسلمان ہے اور اپریل 2021 میں رمضان کے آغاز کی اپنی نشانی ریکارڈ کرتا ہے۔ اس میں کسی اسکول کا نام نہیں ہے۔"
