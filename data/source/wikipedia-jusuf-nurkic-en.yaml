  ar: "مقال موسوعي عن جوسوف نركيتش (مواليد 1994): ميلاده في 23 أغسطس 1994 في زيفينيتشا، واختياره في درافت 2014، ومواسمه في دنفر وبورتلاند وفينيكس وشارلوت ويوتا. ويذكر المقال أنه مسلم ممارس وأنه أحيا بدء رمضان في أبريل 2021، دون أن يسمي مذهباً."
