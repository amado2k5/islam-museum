summary:
  ar: "تدوينة لجوانا بينك، 4 أغسطس 2023، عن «القرآن العزيز» التركي، المترجم عن الترجمة الفرنسية لمحمد حميد الله، الصادر عن دار بيان سنة 2003، وعن سيرة حميد الله وانتشار ترجمته."
  en: "A post by Johanna Pink, 4 August 2023, on Aziz Kur'an, the Turkish translation made from Muhammad Hamidullah's French translation and published by Bayan in 2003, and on Hamidullah's life and the spread of his translation."
  ur: "یوہانا پنک کی تحریر، 4 اگست 2023، ترکی «عزیز قرآن» پر، جو محمد حمید اللہ کے فرانسیسی ترجمے سے کیا گیا اور 2003 میں بیان یاینلاری نے شائع کیا، اور حمید اللہ کی زندگی اور ان کے ترجمے کے پھیلاؤ پر۔"
  es: "Artículo de Johanna Pink, del 4 de agosto de 2023, sobre Aziz Kur'an, la traducción turca realizada a partir de la traducción francesa de Muhammad Hamidullah y publicada por Bayan en 2003, y sobre la vida de Hamidullah y la difusión de su traducción."
  fr: "Article de Johanna Pink, 4 août 2023, sur Aziz Kur'an, la traduction turque réalisée à partir de la traduction française de Muhammad Hamidullah et publiée par Bayan en 2003, ainsi que sur la vie de Hamidullah et la diffusion de sa traduction."
  tr: "Joanna Pink'in 4 Ağustos 2023 tarihli bir yazısı, Dar Bayan tarafından 2003'te yayımlanan Muhammed' Hamidullah'ın Fransızca çevirisinden çevrilen Türkçe 'El-Aziz Kur'an' hakkında, Hamidullah'ın biyografisi ve çevirisinin yayılması hakkında."
  id: "Sebuah tulisan oleh Joanna Pink, 4 Agustus 2023, tentang 'Al-Aziz Quran' dalam bahasa Turki, yang diterjemahkan dari terjemahan Prancis oleh Muhammad Hamidullah, diterbitkan oleh Dar Bayan pada tahun 2003, serta tentang biografi Hamidullah dan penyebaran terjemahannya."
