summary:
  ar: "طبعة دار الغرب الإسلامي، بيروت، الطبعة الثانية، 1417هـ/1997م، تحقيق الدكتور بشار عواد معروف. المجلد الأول من نسخة PDF الرقمية (Noor-Book). الأصل الكلاسيكي للمتن مال إلى الملك العام؛ ويبقى تحقيق المحقق وتعليقاته محفوظةً حقوقها، فلا يُنقل منها إلى المتحف إلا الأرقام والإحالات."
  en: "Dar al-Gharb al-Islami, Beirut, 2nd ed. 1417 AH / 1997 CE, edited by Dr. Bashar Awwad Ma'ruf. Volume 1 (digital PDF, Noor-Book scan). The classical text is in the public domain; the editor's apparatus is not republished."
  es: "Dar al-Gharb al-Islami, Beirut, 2.ª ed. 1417 AH / 1997 d. C., editado por el Dr. Bashar Awwad Ma'ruf. Volumen 1 (PDF digital, escaneo de Noor-Book). El texto clásico es de dominio público; el aparato crítico del editor no se ha vuelto a publicar."
  fr: "Dar al-Gharb al-Islami, Beyrouth, 2e éd. 1417 AH / 1997 CE, sous la direction du Dr Bashar Awwad Ma'ruf. Volume 1 (PDF numérique, numérisation Noor-Book). Le texte classique est dans le domaine public; l'apparat critique de l'éditeur n'est pas reproduit."
  ur: "دار الغرب الاسلامی، بیروت، دوسرا ایڈیشن۔ 1417ھ / 1997 عیسوی، ڈاکٹر بشر عواد معروف کی تدوین۔ جلد 1 ⁦(ڈیجیٹل پی ڈی ایف، نور بک اسکین)⁩۔ کلاسیکی متن عوامی ڈومین میں ہے؛ ایڈیٹر کا سامان دوبارہ شائع نہیں کیا گیا ہے۔"
  tr: "Dar Al-Gharb Al-Islami Baskısı, Beyrut, İkinci Baskı, 1417 Hicri / 1997 AD, Dr. Bashar Awad Ma'ruf tarafından düzenlenmiştir. Dijital PDF Versiyonunun Birinci Cildi (Noor-Book). Metnin klasik orijinali kamu malıdır; editörün düzenleme ve açıklamaları telif hakkına tabi kalır, bu nedenle müzeye yalnızca numaralar ve referanslar aktarılır."
  id: "Dar Al-Gharb Al-Islami Edition, Beirut, Edisi Kedua, 1417 AH / 1997 M, disunting oleh Dr. Bashar Awad Ma'ruf. Volume Satu dari Versi PDF Digital (Noor-Book). Versi klasik teks ini termasuk dalam domain publik; penyuntingan dan anotasi editor tetap dilindungi hak cipta, sehingga hanya nomor dan referensi yang dipindahkan ke museum."
