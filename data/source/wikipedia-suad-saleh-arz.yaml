label:
  ar: "«ويكيبيديا المصرية: سعاد صالح»"
  en: "Egyptian Arabic Wikipedia: Suad Saleh"
  ur: "«مصری عربی ویکیپیڈیا: سعاد صالح»"
summary:
  ar: «مقالة ويكيبيديا بالمصرية عن سعاد صالح ⁦(مراجعة 10016028، رُوجعت في أكتوبر 2026)⁩. تذكر دراستها في الأزهر، وتطبع تاريخ ميلادها «1 يناير 1945» دون مصدر مسند.»
  en: "The Egyptian Arabic (arz) Wikipedia article on Suad Saleh (revision 10016028, consulted October 2026). It records her studies at Al-Azhar and prints her birth date as '1 January 1945' without a cited source."
  ur: «سعاد صالح پر مصری عربی ویکیپیڈیا کا مضمون ⁦(نظرثانی 10016028، اکتوبر 2026 میں رجوع کیا گیا)⁩۔»
  es: "El artículo de Wikipedia en árabe egipcio (arz) sobre Suad Saleh (revisión 10016028, consultado en octubre de 2026) registra sus estudios en Al-Azhar e indica su fecha de nacimiento como «1 de enero de 1945» sin citar la fuente."
  fr: "L'article de Wikipédia en arabe égyptien (arz) consacré à Suad Saleh (révision 10016028, consulté en octobre 2026) mentionne ses études à Al-Azhar et indique sa date de naissance comme étant le « 1er janvier 1945 » sans citer de source."
  tr: "\"Suad Salih hakkında Mısırca Wikipedia makalesi (10016028 inceleme, Ekim 2026'da incelenmiştir). El-Ezher'deki eğitiminden bahsediyor ve doğum tarihini güvenilir bir kaynak olmadan '1 Ocak 1945' olarak yazıyor.\""
  id: "\"Artikel Wikipedia dalam bahasa Mesir tentang Suad Saleh (10016028 ulasan, ditinjau pada Oktober 2026). Dia menyebutkan studinya di Al-Azhar dan mencetak tanggal lahirnya sebagai '1 Januari 1945' tanpa sumber yang dapat dipercaya.\""
