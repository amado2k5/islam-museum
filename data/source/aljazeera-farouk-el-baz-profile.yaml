summary:
  ar: "ملف الجزيرة التعريفي بفاروق الباز ⁦(نُشر 21 فبراير 2024، وأعاد نشره موقع عرب خبر)⁩: اسمه الكامل فاروق محمد سيد الباز، وأسرته من طوخ الأقلام بالسنبلاوين، وأبوه الشيخ محمد الباز خريج الأزهر وأستاذ الشيخ محمد متولي الشعراوي، وأخوه أسامة الباز، وحادثة تعيينه مدرس كيمياء بالسويس بعد عودته."
  en: "Al Jazeera's profile of Farouk El-Baz (published 21 February 2024, republished by Arab Khabar): his full name Farouk Mohamed Sayed El-Baz, his family from Toukh el-Aqlam in Senbellawein, his father Sheikh Mohamed El-Baz, an Al-Azhar graduate who taught Mohamed Metwalli Al-Sha'rawi, his brother Osama El-Baz, and the episode of his posting as a chemistry teacher in Suez on his return."
  es: "Perfil de Farouk El-Baz publicado por Al Jazeera (el 21 de febrero de 2024, republicado por Arab Khabar): su nombre completo, Farouk Mohamed Sayed El-Baz; su familia, originaria de Toukh el-Aqlam en Senbellawein; su padre, el jeque Mohamed El-Baz, graduado de Al-Azhar que fue profesor de Mohamed Metwalli Al-Sha'rawi; su hermano, Osama El-Baz; y el episodio de su nombramiento como profesor de química en Suez a su regreso."
  fr: "Profil d'Al Jazeera sur Farouk El-Baz (publié le 21 février 2024, republié par Arab Khabar): son nom complet Farouk Mohamed Sayed El-Baz, sa famille originaire de Toukh el-Aqlam à Senbellawein, son père Cheikh Mohamed El-Baz, diplômé d'Al-Azhar et professeur de Mohamed Metwalli Al-Sha'rawi, son frère Osama El-Baz, et l'épisode de son affectation comme professeur de chimie à Suez à son retour."
