  ar: "ملف الجزيرة التعريفي بفاروق الباز (نُشر 21 فبراير 2024، وأعاد نشره موقع عرب خبر): اسمه الكامل فاروق محمد سيد الباز، وأسرته من طوخ الأقلام بالسنبلاوين، وأبوه الشيخ محمد الباز خريج الأزهر وأستاذ الشيخ محمد متولي الشعراوي، وأخوه أسامة الباز، وحادثة تعيينه مدرس كيمياء بالسويس بعد عودته."
  en: "Al Jazeera's profile of Farouk El-Baz (published 21 February 2024, republished by Arab Khabar): his full name Farouk Mohamed Sayed El-Baz, his family from Toukh el-Aqlam in Senbellawein, his father Sheikh Mohamed El-Baz, an Al-Azhar graduate who taught Mohamed Metwalli Al-Sha'rawi, his brother Osama El-Baz, and the episode of his posting as a chemistry teacher in Suez on his return."
