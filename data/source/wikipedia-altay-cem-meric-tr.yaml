summary:
  ar: "مقالة ويكيبيديا التركية عن ألطاي جم مريتش؛ تُستخدم لوقائع الكيان فقط. تفصّل ميلاده سنة 1991 في أنقرة، وتخرّجه في كلية الطب بجامعة نجم الدين أربكان في قونية وممارسته الطب، وتحوّله الاعتقادي من الإلحاد إلى الإسلام، وتأسيسه دار تين للنشر، وكتبه وقناته على يوتيوب."
  en: "Turkish Wikipedia article on Altay Cem Meriç; used for entity facts only. It details his birth in 1991 in Ankara, his graduation from Necmettin Erbakan University's Faculty of Medicine in Konya and his practice as a physician, his intellectual journey from atheism back to Islam, his founding of the Tin publishing house, his books and his YouTube channel."
  es: "Artículo de la Wikipedia en turco sobre Altay Cem Meriç; utilizado únicamente para datos sobre la persona. Detalla su nacimiento en 1991 en Ankara, su graduación de la Facultad de Medicina de la Universidad Necmettin Erbakan en Konya y su práctica como médico, su trayectoria intelectual desde el ateísmo hasta el islam, la fundación de la editorial Tin, sus libros y su canal de YouTube."
  fr: "Article de Wikipédia en turc sur Altay Cem Meriç; utilisé uniquement à des fins d'information sur l'individu. Il détaille sa naissance en 1991 à Ankara, ses études à la faculté de médecine de l'université Necmettin Erbakan de Konya et son exercice de la médecine, son cheminement intellectuel de l'athéisme à l'islam, la fondation de sa maison d'édition Tin, ses livres et sa chaîne YouTube."
