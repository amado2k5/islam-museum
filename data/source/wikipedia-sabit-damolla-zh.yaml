summary:
  ar: "مقالة ويكيبيديا الصينية عن شابيتي داموللا عبد الباقي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1883 في أتوش ووفاته سنة 1934 في ديهوا ⁦(أورومتشي)⁩، ورئاسته وزراء جمهورية تركستان الشرقية الإسلامية، ودينه في صندوق المعلومات «الإسلام» بلا مذهب."
  en: "Chinese Wikipedia article on Sabit Damulla Abdulbaki; used for entity facts only. It gives his birth in 1883 at Atush and his death in 1934 at Dihua (Ürümqi), his premiership of the Islamic Republic of East Turkestan, and an infobox religion field of 'Islam' with no school named."
  es: "Artículo de la Wikipedia en chino sobre Sabit Damulla Abdulbaki; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1883 en Atush y su fallecimiento en 1934 en Dihua (Ürümqi), su mandato como primer ministro de la República Islámica del Turquestán Oriental y un campo de información sobre religión con la palabra \"Islam\" sin especificar ninguna escuela."
  fr: "Article de Wikipédia en chinois sur Sabit Damulla Abdulbaki; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance en 1883 à Atush et sa mort en 1934 à Dihua (Ürümqi), son mandat de Premier ministre de la République islamique du Turkestan oriental, et une infobox sur la religion avec la mention « Islam » sans indication d'école."
