reliability_note: "The person's own official channel, managed under the supervision of Dawat-e-Islami's Social Media Department: a primary source for his identity, office and biography as his organisation presents them, not independent corroboration. The standard description read in full on 5 November 2026 states that Haji Muhammad Imran Attari was born on 8 July 1970 in Karachi, completed his education in business studies, worked in his family business and then founded his own garment enterprise, joined Dawat-e-Islami in 1992 as a volunteer, and is the current Nigran-e-Markazi Majlis-e-Shura of Dawat-e-Islami. The birth date rests on this single organisational self-presentation and is recorded on that basis alone, flagged in the person record."
