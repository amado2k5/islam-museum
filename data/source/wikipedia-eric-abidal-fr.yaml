  fr: "Article Wikipédia en français sur Éric Abidal; utilisé uniquement pour les informations le concernant. Il retrace sa naissance en 1979 et sa carrière à Lyon et à Barcelone, et précise dans sa section consacrée à sa vie privée qu’il a été élevé dans une famille catholique et s’est converti à l’islam en 2007."
  ur: "فرانسیسی ویکیپیڈیا کا مضمون Éric Abidal پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی 1979 کی پیدائش اور لیون اور بارسلونا کے ساتھ اس کے کیریئر کا احاطہ کیا گیا ہے، اور اس کے نجی زندگی کے حصے میں بتایا گیا ہے کہ اس کی پرورش ایک عیسائی کیتھولک خاندان میں ہوئی اور 2007 میں اسلام قبول کیا۔"
