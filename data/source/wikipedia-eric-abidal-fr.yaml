  ar: "مقالة ويكيبيديا الفرنسية عن إريك أبيدال؛ تُستخدم لوقائع الكيان فقط. تغطي ميلاده سنة 1979 ومسيرته مع ليون وبرشلونة، وتذكر في حياته الخاصة أنه تربى في عائلة مسيحية كاثوليكية واعتنق الإسلام سنة 2007."
  en: "French Wikipedia article on Éric Abidal; used for entity facts only. It covers his 1979 birth and his career with Lyon and Barcelona, and states in its private life section that he was raised in a Christian Catholic family and converted to Islam in 2007."
