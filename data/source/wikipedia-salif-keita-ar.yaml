reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Care was taken not to merge this article with the Arabic article on Salif Keïta the footballer (1946–2023), who has his own Wikidata item (Q964530). The singer's article gives his birth at Djoliba on 25 August 1949; his ambition to teach, defeated by unemployment and by the poor eyesight that comes with his albinism; the family scandal at his becoming a singer, music being reserved in Mandinka culture to the griot caste while the Keita are a princely family; his rejection and move to Bamako (1968 here; the English article has him leave Djoliba in 1967); nightclub singing with a brother; the government-backed Rail Band; Les Ambassadeurs from 1973; success in Paris with some criticism of finish in his early work; and his children's village for children with albinism and homeless children, which he funds and where he teaches music. The article states no religion for him."
