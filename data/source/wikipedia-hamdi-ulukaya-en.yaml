  ar: "مقالة ويكيبيديا الإنجليزية عن حمدي علوقيا ⁦(وُلد سنة ١٩٧٢ في إيليتش بتركيا)⁩، رجل الأعمال التركي الأمريكي من أصل كردي الذي أسس شركة تشوباني للزبادي؛ تذكر نشأته في أسرة لمنتجات الألبان ونشاطه لحقوق الأكراد وانتقاله إلى الولايات المتحدة سنة ١٩٩٤ وبناءه تشوباني وأعماله الخيرية ودفاعه عن اللاجئين، ولا تسمي له دينًا."
  en: "English Wikipedia article on Hamdi Ulukaya (born 1972 in Ilic, Turkey), Turkish-American businessman of Kurdish ethnicity who founded the Chobani yogurt company; it records his dairy-farming upbringing, his Kurdish-rights activism and move to the United States in 1994, the building of Chobani, his philanthropy and his refugee advocacy, and names no faith for him."
