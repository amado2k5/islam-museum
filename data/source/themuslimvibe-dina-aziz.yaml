summary:
  ar: "مقابلة «ذا مسلم فايب» مع دينا عزيز بمناسبة صدور «مخطط رمضان»؛ تقول فيها إنها مؤلفة منشورة ومحللة بيانات، وإن فكرة المخطط جاءت من مشاهدة صديقة حديثة عهد بالإسلام تكافح لمواكبة الشهر، وإنها صممته ليكون دليلًا للمسلمين على اختلاف خلفياتهم وخبراتهم."
  en: "The Muslim Vibe's interview with Dina Aziz on the publication of her Ramadan Planner. In it she describes herself as a published author and data analyst; says the planner's idea came from watching a friend who had recently reverted to Islam struggle to keep up with the month; and says she designed it as a guide for Muslims of every background and level of experience."
  es: "Entrevista de The Muslim Vibe con Dina Aziz sobre la publicación de su planificador de Ramadán. En ella, se describe a sí misma como autora publicada y analista de datos; cuenta que la idea del planificador surgió al ver a una amiga que se había convertido recientemente al islam tener dificultades para seguir el ritmo del mes; y afirma que lo diseñó como una guía para musulmanes de todos los orígenes y niveles de experiencia."
  fr: "Dans une interview accordée à Muslim Vibe, Dina Aziz revient sur la publication de son agenda du Ramadan. Elle se présente comme auteure et analyste de données; elle explique que l’idée de cet agenda lui est venue en observant une amie récemment convertie à l’islam qui peinait à suivre le rythme du mois; et elle précise l’avoir conçu comme un guide pour les musulmans de tous horizons et de tous niveaux de pratique."
