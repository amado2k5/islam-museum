summary:
  ar: "مقابلة «ذا مسلم فايب» مع دينا عزيز بمناسبة صدور «مخطط رمضان»؛ تقول فيها إنها مؤلفة منشورة ومحللة بيانات، وإن فكرة المخطط جاءت من مشاهدة صديقة حديثة عهد بالإسلام تكافح لمواكبة الشهر، وإنها صممته ليكون دليلًا للمسلمين على اختلاف خلفياتهم وخبراتهم."
  en: "The Muslim Vibe's interview with Dina Aziz on the publication of her Ramadan Planner. In it she describes herself as a published author and data analyst; says the planner's idea came from watching a friend who had recently reverted to Islam struggle to keep up with the month; and says she designed it as a guide for Muslims of every background and level of experience."
