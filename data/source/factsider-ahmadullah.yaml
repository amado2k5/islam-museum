summary:
  ar: "صفحة سيرة منخفضة الموثوقية من موقع factsider عن الشيخ أحمد الله؛ تُستخدم لنقطة واحدة فقط: أنها وصفت مقاطعه في 2022–2023 بأنها تُنشر على قناة مؤسسة السنة وأنه لا قناة شخصية له."
  en: "A low-authority biography page from factsider on Sheikh Ahmadullah; used for one point only: that in 2022–2023 it described his videos as published on the As-Sunnah Foundation's YouTube channel and stated he had no personal channel."
  es: "Una página biográfica poco fiable de Factsider sobre el jeque Ahmadullah; utilizada únicamente para un punto: que en 2022-2023 describía sus vídeos como publicados en el canal de YouTube de la Fundación As-Sunnah y afirmaba que no tenía ningún canal personal."
  fr: "Une page biographique peu fiable de factsider sur le cheikh Ahmadullah; utilisée pour un seul point: qu'en 2022-2023, elle décrivait ses vidéos comme étant publiées sur la chaîne YouTube de la Fondation As-Sunnah et affirmait qu'il n'avait pas de chaîne personnelle."
  ur: "شیخ احمد اللہ پر فیکٹسائیڈر کی طرف سے ایک کم اتھارٹی سیرت کا صفحہ؛ صرف ایک نکتے کے لیے استعمال کیا گیا: کہ 2022-2023 میں اس نے اس کی ویڈیوز کو بیان کیا جیسا کہ السنۃ فاؤنڈیشن کے یوٹیوب چینل پر شائع ہوا اور کہا کہ اس کا کوئی ذاتی چینل نہیں ہے۔"
  tr: "Factsider'dan Şeyh Ahmadullah hakkında düşük güvenilirlikli bir biyografi sayfası sadece bir nokta için kullanılıyor: 2022–2023 kliplerinin Sünni Vakfı kanalında yayınlandığını ve kişisel kanalı olmadığını belirtiyor."
  id: "Halaman biografi dengan keandalan rendah dari Factsider tentang Sheikh Ahmadullah hanya digunakan untuk satu poin: halaman tersebut menggambarkan klip-klip 2022–2023 miliknya diterbitkan di saluran Sunni Foundation dan bahwa ia tidak memiliki saluran pribadi."
