reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by revision id through the MediaWiki API with the returned id asserted equal. It gives his birth near Purworejo on 25 February 1904 (with a footnote recording that many official records list 1908, because he misstated his age on entering school) and his death at Jakarta on 25 October 1982. It names no school of Islam for him: it says he was born to a Muslim family, that his father was a local Islamic functionary, and that he argued a political case for Islam as the state basis."
