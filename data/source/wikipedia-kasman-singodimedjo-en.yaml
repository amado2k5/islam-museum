summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كاسمان سينغوديميدجو؛ تُستخدم لوقائع الكيان فقط. تروي رئاسته للجنة الوطنية الإندونيسية المركزية سنة 1945 ومنصبه نائبًا عامًا (1945–1946)، ودفاعه في الجمعية التأسيسية عن الإسلام أساسًا للدولة، وسجنه مرتين، وتكريمه بطلًا قوميًا سنة 2018."
  en: "English Wikipedia article on Kasman Singodimedjo; used for entity facts only. It recounts his chairmanship of the Central Indonesian National Committee in 1945 and his term as attorney general (1945–1946), his Constitutional Assembly advocacy of Islam as the basis of the state, his two imprisonments, and his naming as a National Hero in 2018."
  es: "Artículo de la Wikipedia en inglés sobre Kasman Singodimedjo; utilizado únicamente para datos sobre la persona. Relata su presidencia del Comité Nacional de Indonesia Central en 1945 y su mandato como fiscal general (1945-1946), su defensa ante la Asamblea Constituyente del islam como base del Estado, sus dos encarcelamientos y su nombramiento como Héroe Nacional en 2018."
  fr: "Article de Wikipédia en anglais sur Kasman Singodimedjo; utilisé uniquement à des fins d’information sur l’entité. Il relate sa présidence du Comité national d’Indonésie centrale en 1945 et son mandat de procureur général (1945-1946), son plaidoyer devant l’Assemblée constituante en faveur de l’islam comme fondement de l’État, ses deux emprisonnements et sa désignation comme héros national en 2018."
  ur: "Kasman Singodimedjo پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں سنٹرل انڈونیشیائی نیشنل کمیٹی کی 1945 میں ان کی صدارت اور اٹارنی جنرل (1945-1946) کے طور پر ان کی مدت، ریاست کی بنیاد کے طور پر ان کی آئینی اسمبلی میں اسلام کی وکالت، ان کی دو قید اور 2018 میں قومی ہیرو کے طور پر ان کے نام کا ذکر ہے۔"
  tr: "Kasman Sengudimidjo hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1945'te Endonezya Merkez Ulusal Komitesi başkanlığını, 1945–1946 yılları arasında Genel Yardımcılık görevini, İslam'ın Kurucu Meclisi'nde devletin temeli olarak savunmasını, iki kez hapsedilmesini ve 2018'de ulusal kahraman olarak onurunu anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Kasman Sengudimidjo; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa jabatannya sebagai ketua Komite Nasional Pusat Indonesia pada tahun 1945, posisinya sebagai Wakil Jenderal (1945–1946), pembelaannya di Majelis Konstituante Islam sebagai fondasi negara, penahanannya dua kali, dan kehormatannya sebagai pahlawan nasional pada tahun 2018."
