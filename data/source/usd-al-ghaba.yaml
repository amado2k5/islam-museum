summary:
  ar: 'معجم تراجم الصحابة لعز الدين ابن الأثير ⁦(ت 630هـ)⁩، مرتب على الحروف، يجمع ما قبله مع أسانيد ونقد؛ الطبعة المعتمدة هنا: دار ابن حزم، بيروت، الطبعة الأولى 1433هـ/2012م، من نسخة مصورة في المستودع المحلي، والأرقام صفحات المطبوع.'
  en: 'Ibn al-Athir''s (d. 630 AH) alphabetical dictionary of the Companions; edition used: Dar Ibn Hazm, Beirut, first edition 1433 AH / 2012 CE, from a local scan; page numbers are the printed pages.'
  es: "Diccionario alfabético de los Compañeros de Ibn al-Athir (fallecido en 630 AH); edición utilizada: Dar Ibn Hazm, Beirut, primera edición 1433 AH / 2012 CE, a partir de un escaneo local; los números de página corresponden a las páginas impresas."
  fr: "Dictionnaire alphabétique des Compagnons d'Ibn al-Athir (mort en 630 AH); édition utilisée: Dar Ibn Hazm, Beyrouth, première édition 1433 AH / 2012 CE, à partir d'un scan local; les numéros de page sont les pages imprimées."
  ur: "ابن اثیر کی ⁦(متوفی 630ھ)⁩ حروف تہجی کی لغت صحابہ۔ ایڈیشن مستعمل: دار ابن حزم، بیروت، پہلا ایڈیشن 1433ھ / 2012 عیسوی، مقامی اسکین سے؛ صفحہ نمبر طباعت شدہ صفحات ہیں۔"
  tr: "Izz al-Din Ibn al-Athir'in (ö. 630 H yılı) Yoldaşların Biyografileri Sözlüğü, alfabetik olarak düzenlenmiş, öncekileri iletim ve eleştiri zincirleriyle birleştirmiştir; burada kabul edilen baskı: Dar İbn Hazm, Beyrut, ilk baskı 1433 Hicri / 2012 M.S., yerel arşivdeki bir fotokopiden, basılı sayfalarda numaralarla."
  id: "Kamus Biografi Para Sahabat oleh Izz al-Din Ibn al-Athir (wafat 630 H), disusun secara alfabetis, menggabungkan apa yang mendahuluinya dengan rantai transmisi dan kritik; edisi yang diadopsi di sini: Dar Ibn Hazm, Beirut, edisi pertama 1433 H / 2012 M, dari fotokopi di repositori lokal, dengan nomor pada halaman cetak."
