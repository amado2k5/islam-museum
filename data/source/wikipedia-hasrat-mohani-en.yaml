  ar: "مقالة ويكيبيديا الإنجليزية عن حسرت موهاني؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في موهان وتعليمه في عليكرة، وشعره الأردي ومجلته «أردو معلى»، ومطالبته بالاستقلال التام 1921 وشعاره «انقلاب زنده باد»، ودوره في الحزب الشيوعي الهندي، وحياته الدينية البسيطة وحجه المتكرر، ووفاته في لكنو في 13 أيار 1951."
  en: "English Wikipedia article on Hasrat Mohani; used for entity facts only. It recounts his birth at Mohan and education at Aligarh, his Urdu poetry and his journal Urdu-e-Mualla, his 1921 demand for complete independence and his slogan 'Inquilab Zindabad', his role in the Communist Party of India, his simple religious life and repeated Hajj, and his death at Lucknow on 13 May 1951."
