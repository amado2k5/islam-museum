reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The standard scholarly encyclopaedia entry, by the author of the standard monograph on him (Başhoca İshak Efendi, 1989). It heads him (ö. 1836), gives his birth at Narda (Arta) in the Yanya province, and records that he was of a Jewish family and that he and his brother Esad Efendi entered Islam after their father's death and came to Istanbul — the fullest account of the conversion, which the person record states in full without treating conversion or family background as a school attestation. Read in-session 1 November 2026."
