  en: "English Wikipedia article on Razia Sultan (c. 1205 - October 1240), sultan of Delhi and daughter of Iltutmish; its lead gives her death on 15 October 1240 while its narrative judges 13 October more likely; used for entity facts only, each cited where the article gives its own source."
  es: "Artículo de la Wikipedia en inglés sobre Razia Sultan (c. 1205 - octubre de 1240), sultana de Delhi e hija de Iltutmish; su introducción indica que murió el 15 de octubre de 1240, mientras que su narración considera más probable el 13 de octubre; se utiliza únicamente para datos sobre la entidad, citados donde el artículo proporciona su propia fuente."
