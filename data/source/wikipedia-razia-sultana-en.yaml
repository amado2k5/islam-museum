reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives her birth as c. 1205 and states repeatedly that she was Iltutmish's daughter (her coins style her 'bint al-Sultan'); its lead dates her death to 15 October 1240 while its death section judges it more likely that she and Altunia were killed by their captors on 13 October 1240 after their defeat on 14 October near Kaithal — the record is therefore built at month precision with both days preserved. Its mentions of Hanafi, Shafi'i, Sunni and Shia concern the Qarmatian attack on Delhi's Jama Masjid and the city's worshippers, not the sultana herself; it also records her devotion to the Sufi saint Shah Turkman Bayabani, at whose hospice she is said to be buried — devotion, not an order named for her. Checked 1 November 2026."
