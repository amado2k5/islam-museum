summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمر علي سيف الدين الثالث (1914–1986)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في مدينة بروناي وتعليمه في القصر والكلية المالايوية بكوالا كانغسار، وخدمته في الغابات والقضاء وسنواته بندهارا، وتنصيبه سلطانا ثامنا وعشرين في يونيو 1950 وتتويجه في مايو 1951، ودستور 1959، وثورة 1962 وقرار البقاء خارج ماليزيا، وإصلاحاته للإدارة الدينية والتعليم، وتنحّيه في 4 أكتوبر 1967 لابنه حسن البلقية، ووفاته في 7 سبتمبر 1986."
  en: "English Wikipedia article on Omar Ali Saifuddien III (1914–1986); used for entity facts only. It recounts his Brunei Town birth and his palace and Malay College Kuala Kangsar education, his forestry and judiciary service and his years as Pengiran Bendahara, his proclamation as the 28th Sultan in June 1950 and coronation in May 1951, the 1959 constitution, the 1962 revolt and the decision to stay out of Malaysia, his religious-administration and education reforms, his abdication on 4 October 1967 in favour of his son Hassanal Bolkiah, and his death on 7 September 1986."
  es: "Artículo de la Wikipedia en inglés sobre Omar Ali Saifuddien III (1914-1986); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Brunei Town y su educación en el palacio y en el Malay College Kuala Kangsar, su servicio forestal y judicial y sus años como Pengiran Bendahara, su proclamación como el 28.º sultán en junio de 1950 y su coronación en mayo de 1951, la constitución de 1959, la revuelta de 1962 y la decisión de no unirse a Malasia, sus reformas religiosas, administrativas y educativas, su abdicación el 4 de octubre de 1967 en favor de su hijo Hassanal Bolkiah y su muerte el 7 de septiembre de 1986."
  fr: "Article de Wikipédia en anglais sur Omar Ali Saifuddien III (1914-1986); utilisé uniquement pour les informations sur l’entité. Il relate sa naissance à Brunei Town, ses études au palais et au Malay College de Kuala Kangsar, son service dans les domaines forestier et judiciaire, ses années en tant que Pengiran Bendahara, sa proclamation comme 28e sultan en juin 1950 et son couronnement en mai 1951, la constitution de 1959, la révolte de 1962 et la décision de rester en dehors de la Malaisie, ses réformes de l’administration religieuse et de l’éducation, son abdication le 4 octobre 1967 en faveur de son fils Hassanal Bolkiah et sa mort le 7 septembre 1986."
  ur: "عمر علی سیف الدین III (1914–1986) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی برونائی ٹاؤن کی پیدائش اور اس کے محل اور مالے کالج کوالا کانگسار کی تعلیم، اس کی جنگلات اور عدلیہ کی خدمات اور پینگیرن بیندہارا کے طور پر اس کے سال، جون 1950 میں 28 ویں سلطان کے طور پر اس کا اعلان اور مئی 1951 میں تاجپوشی، 1959 کا آئین، 1962 میں اس کے ملک کے قیام کے فیصلے اور 1962 میں اس کے قیام کا ذکر کیا گیا ہے۔ مذہبی-انتظامی اور تعلیمی اصلاحات، 4 اکتوبر 1967 کو اپنے بیٹے حسنال بولکیہ کے حق میں ان کا استعفیٰ، اور 7 ستمبر 1986 کو ان کی موت۔"
  tr: "Omar Ali Saifuddin III (1914–1986) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Brunei'deki doğumunu, Kuala Kangsar'daki Malay sarayı ve kolejindeki eğitimini, ormancılık ve yargı hizmetlerini, Pandhara olarak geçirdiği yılları, Haziran 1950'de Yirmi Sekizinci Sultan olarak atanmasını ve Mayıs 1951'de taç giyme törenini, 1959 Anayasası'nı, 1962 devrimi ve Malezya dışında kalma kararını, dini yönetim ve eğitimdeki reformlarını, 4 Ekim 1967'de oğlu Hassan Al-Bolkiah'a tahttan çekilmesini ve 7 Eylül 1986'daki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Omar Ali Saifuddin III (1914–1986); digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Brunei, pendidikannya di istana dan perguruan tinggi Melayu di Kuala Kangsar, pengabdiannya di bidang kehutanan dan peradilan, tahun-tahunnya sebagai Pandhara, pengangkatannya sebagai Sultan Dua Puluh Delapan pada Juni 1950 dan penobatannya pada Mei 1951, Konstitusi 1959, revolusi 1962 dan keputusannya untuk tetap berada di luar Malaysia, reformasi dalam administrasi dan pendidikan agama, pengunduran dirinya pada 4 Oktober 1967 kepada putranya Hassan Al-Bolkiah, serta kematiannya pada 7 September 1986."
