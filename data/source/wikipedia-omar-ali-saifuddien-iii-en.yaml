summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمر علي سيف الدين الثالث (1914–1986)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في مدينة بروناي وتعليمه في القصر والكلية المالايوية بكوالا كانغسار، وخدمته في الغابات والقضاء وسنواته بندهارا، وتنصيبه سلطانا ثامنا وعشرين في يونيو 1950 وتتويجه في مايو 1951، ودستور 1959، وثورة 1962 وقرار البقاء خارج ماليزيا، وإصلاحاته للإدارة الدينية والتعليم، وتنحّيه في 4 أكتوبر 1967 لابنه حسن البلقية، ووفاته في 7 سبتمبر 1986."
  en: "English Wikipedia article on Omar Ali Saifuddien III (1914–1986); used for entity facts only. It recounts his Brunei Town birth and his palace and Malay College Kuala Kangsar education, his forestry and judiciary service and his years as Pengiran Bendahara, his proclamation as the 28th Sultan in June 1950 and coronation in May 1951, the 1959 constitution, the 1962 revolt and the decision to stay out of Malaysia, his religious-administration and education reforms, his abdication on 4 October 1967 in favour of his son Hassanal Bolkiah, and his death on 7 September 1986."
