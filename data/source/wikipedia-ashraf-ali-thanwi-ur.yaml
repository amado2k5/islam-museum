  ar: "مقالة ويكيبيديا الأردية عن اشرف علي التهانوي؛ تُستخدم لوقائع الكيان فقط. يذكر صندوقها مذهبه سنيًّا حنفيًّا مع عقيدة ماتريدية، وسلسلته الصوفية جشتية، وتصف مطلعها صاحبها بأنه مرشد جشتي؛ ويفصّل تعليمه وسلوكه وخلافته من إمداد الله مهاجر مكي."
  en: "Urdu Wikipedia article on Ashraf Ali Thanwi; used for entity facts only. Its infobox gives his denomination as Sunni, his madhhab as Hanafi, his creed as Maturidi and his Sufi order as Chishti, and its lead calls him a Chishti murshid; it details his education, his bay'ah to Imdadullah Muhajir Makki and the khilafa he received from him."
