reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A separately edited article, sourced chiefly to the Sunni Online biography. Its religious-biography infobox is one of the independent attestations used for the faith segments: denomination Sunni, Madh'hab Hanafi, creed Maturidi, Sufi order Chishti. Its lead calls him 'a Deobandi Hanafi scholar, Sufi and Chishti murshid'. It gives his birth as 5 Rabi' al-Thani 1280 AH (converting to about 19 September 1863 — a month later than the 19 August 1863 of the English article, the Arabic infobox and Wikidata; the conflict is recorded in the person record) and his death as 16 Rajab 1362 AH / 20 July 1943, agreeing on the day. It details his early studies at Meerut and Thana Bhawan, his five years at Darul Uloom Deoband (entered Dhu al-Qa'da 1295 AH, graduated 1301 AH) and closeness to Muhammad Yaqub Nanautawi, his Hajj journeys, his bay'ah to Imdadullah Muhajir Makki at Mecca and the khilafa granted after a six-month stay in 1310 AH, his Kanpur teaching and Thana Bhawan settlement, his funeral prayer led by Zafar Ahmad Usmani and burial at Thana Bhawan, and puts his works at up to 800 titles."
