summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الكريم أمر الله؛ تُستخدم لوقائع الكيان فقط. ترجمة للمقالة الإنجليزية: مولده محمد رسول سنة 1879 ابنًا لشيخ نقشبندي، ودراسته بمكة سبع سنوات، وإصلاحه التعليمي، ووفاته سنة 1945."
  en: "Arabic Wikipedia article on Abdul Karim Amrullah; used for entity facts only. A translation of the English article: his birth as Muhammad Rasul in 1879, the son of a Naqshbandi sheikh, his seven years of study at Mecca, his educational reform, and his death in 1945."
  es: "Artículo de Wikipedia en árabe sobre Abdul Karim Amrullah; utilizado únicamente para datos sobre la persona. Traducción del artículo en inglés: su nacimiento como Muhammad Rasul en 1879, hijo de un jeque Naqshbandi, sus siete años de estudio en La Meca, su reforma educativa y su muerte en 1945."
  fr: "Article de Wikipédia en arabe sur Abdul Karim Amrullah; utilisé uniquement pour les informations sur l’entité. Traduction de l’article anglais: sa naissance sous le nom de Muhammad Rasul en 1879, fils d’un cheikh naqshbandi, ses sept années d’études à La Mecque, sa réforme de l’éducation et sa mort en 1945."
  ur: "عبدالکریم امر اللہ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ انگریزی مضمون کا ترجمہ: ان کی پیدائش 1879 میں محمد رسول کے طور پر، ایک نقشبندی شیخ کے بیٹے، مکہ میں ان کی سات سال کی تعلیم، ان کی تعلیمی اصلاحات، اور ان کی وفات 1945 میں۔"
  tr: "Abdul Karim Amr Allah hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. İngilizce makalenin çevirisi: Muhammed Rasul 1879'da doğdu, Şeyh Nakşibendi'nin oğlu, yedi yıl Mekke'de eğitim gördü, eğitim aldı ve 1945'te vefat etti."
  id: "Artikel Wikipedia bahasa Arab tentang Abdul Karim Amr Allah; digunakan hanya untuk fakta entitas. Terjemahan artikel bahasa Inggris: Muhammad Rasul lahir pada tahun 1879, putra Sheikh Naqshbandi, belajar di Mekah selama tujuh tahun, berpendidikan, dan meninggal pada tahun 1945."
