summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن عبد الصمد باتوبارا؛ تُستخدم لوقائع الكيان فقط. تفصّل نسبه وتعليمه من آساهان إلى الأزهر ودار الحديث الحسنية وجامعة أم درمان، ومسيرته محاضراً في جامعة سلطان شريف قاسم الإسلامية (2009–2019)، ومناصبه في بيرتي والوصيلة ومؤلفاته وجدلياته."
  en: "Indonesian Wikipedia article on Abdul Somad Batubara; used for entity facts only. It details his family background and education from Asahan to Al-Azhar, Dar al-Hadith al-Hasaniyyah and Omdurman Islamic University, his lectureship at UIN Sultan Syarif Kasim (2009–2019), his offices in PERTI and Al Washliyah, his books and his controversies."
  es: "Artículo de la Wikipedia en indonesio sobre Abdul Somad Batubara; utilizado únicamente para obtener información sobre la persona. Detalla sus antecedentes familiares y su formación académica desde Asahan hasta Al-Azhar, Dar al-Hadith al-Hasaniyyah y la Universidad Islámica de Omdurman, su labor como profesor en la UIN Sultan Syarif Kasim (2009-2019) y sus cargos en PERTI y Al Washliyah."
  fr: "Article de Wikipédia indonésien sur Abdul Somad Batubara; utilisé uniquement à des fins d’information sur l’entité. Il détaille son parcours familial et ses études, d’Asahan à Al-Azhar, en passant par Dar al-Hadith al-Hasaniyyah et l’Université islamique d’Omdurman, son poste de maître de conférences à l’UIN Sultan Syarif Kasim (2009-2019), ainsi que ses fonctions au sein de PERTI et d’Al Washliyah."
