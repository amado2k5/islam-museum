  ar: "مقالة ويكيبيديا الإندونيسية عن عبد الصمد باتوبارا؛ تُستخدم لوقائع الكيان فقط. تفصّل نسبه وتعليمه من آساهان إلى الأزهر ودار الحديث الحسنية وجامعة أم درمان، ومسيرته محاضراً في جامعة سلطان شريف قاسم الإسلامية (2009–2019)، ومناصبه في بيرتي والوصيلة ومؤلفاته وجدلياته."
