summary:
  ar: "مقالة ويكيبيديا الأردية عن أمين أحسن الإصلاحي؛ تعطي مولده سنة 1904 في بمهور بأعظم كره ودخوله مدرسة الإصلاح في 9 كانون الثاني 1915 وصحافته في بجنور وتفرغه للدرس على الفراهي منذ 1925 وعضويته في الجماعة الإسلامية وخروجه منها في 18 كانون الثاني 1958 ووفاته في 15 كانون الأول 1997؛ ويحمل صندوقها حقل تقليد مدرسي «سني ⁦(غير مقلد)⁩» وهو ليس شهادة نصية، ولا يسمّي متنها مذهبًا."
  en: "The Urdu Wikipedia article on Amin Ahsan Islahi; it gives his birth in 1904 at Bamhur in Azamgarh, his admission to Madrasatul Islah on 9 January 1915, his journalism at Bijnor, his full-time study under Farahi from 1925, his membership of Jamaat-e-Islami and his leaving it on 18 January 1958, and his death on 15 December 1997; its philosopher infobox carries a 'Sunni (non-muqallid)' school-tradition field, which is not a text attestation, and its prose names no school."
  es: "El artículo de Wikipedia en urdu sobre Amin Ahsan Islahi; menciona su nacimiento en 1904 en Bamhur en Azamgarh, su admisión a Madrasatul Islah el 9 de enero de 1915, su periodismo en Bijnor, sus estudios a tiempo completo con Farahi desde 1925, su membresía en Jamaat-e-Islami y su salida de la misma el 18 de enero de 1958, y su muerte el 15 de diciembre de 1997; su ficha informativa sobre el filósofo contiene un campo de tradición escolar 'Sunni (non-muqallid)', que no es una atestación textual, y su prosa no menciona ninguna escuela."
  fr: "L'article de Wikipédia en ourdou sur Amin Ahsan Islahi indique sa naissance en 1904 à Bamhur, dans le district d'Azamgarh, son admission à la Madrasatul Islah le 9 janvier 1915, son expérience de journaliste à Bijnor, ses études à plein temps auprès de Farahi à partir de 1925, son appartenance à la Jamaat-e-Islami et son départ le 18 janvier 1958, ainsi que sa mort le 15 décembre 1997. L'encadré consacré au philosophe mentionne une école ou une tradition « sunnite (non-muqallid) », ce qui ne constitue pas une attestation textuelle, et le texte ne cite aucune école."
