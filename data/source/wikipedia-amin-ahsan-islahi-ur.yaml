summary:
  ar: "مقالة ويكيبيديا الأردية عن أمين أحسن الإصلاحي؛ تعطي مولده سنة 1904 في بمهور بأعظم كره ودخوله مدرسة الإصلاح في 9 كانون الثاني 1915 وصحافته في بجنور وتفرغه للدرس على الفراهي منذ 1925 وعضويته في الجماعة الإسلامية وخروجه منها في 18 كانون الثاني 1958 ووفاته في 15 كانون الأول 1997؛ ويحمل صندوقها حقل تقليد مدرسي «سني (غير مقلد)» وهو ليس شهادة نصية، ولا يسمّي متنها مذهبًا."
  en: "The Urdu Wikipedia article on Amin Ahsan Islahi; it gives his birth in 1904 at Bamhur in Azamgarh, his admission to Madrasatul Islah on 9 January 1915, his journalism at Bijnor, his full-time study under Farahi from 1925, his membership of Jamaat-e-Islami and his leaving it on 18 January 1958, and his death on 15 December 1997; its philosopher infobox carries a 'Sunni (non-muqallid)' school-tradition field, which is not a text attestation, and its prose names no school."
