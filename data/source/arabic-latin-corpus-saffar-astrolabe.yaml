  ar: "فهرس تفريغ النص العربي لرسالة ابن الصف في العمل بالأسطرلاب في مشروع مدونة العربية واللاتينية بجامعة فورتسبورغ، يعرض أبواب الرسالة: تسوية الشمس، ارتفاع الشمس والنجوم، ساعات النهار والليل، أوقات الصلاة، القبلة وتحويل الساعات."
  en: "Index of the Arabic transcription of Ibn al-Saffar's astrolabe treatise in the University of Würzburg's Arabic-Latin Corpus project, listing its chapters: solar adjustment, solar and stellar altitude, day and night hours, prayer times, qibla and hour conversion."
