  es: "Índice de la transcripción árabe del tratado sobre el astrolabio de Ibn al-Saffar en el proyecto del Corpus Árabe-Latino de la Universidad de Würzburg, que enumera sus capítulos: ajuste solar, altitud solar y estelar, horas del día y de la noche, horarios de oración, qibla y conversión de horas."
  fr: "Index de la transcription arabe du traité d'astrolabe d'Ibn al-Saffar dans le projet de corpus arabo-latin de l'Université de Würzburg, listant ses chapitres: ajustement solaire, altitude solaire et stellaire, heures du jour et de la nuit, heures de prière, qibla et conversion horaire."
