summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن التهامي الكلاوي ⁦(1879 – 23 يناير 1956)⁩، باشا مراكش من 1912 إلى 1956، حليف الحماية الفرنسية الذي تآمر على عزل محمد الخامس ثم قبل عودته سنة 1955؛ لا تنص على مدرسته الدينية."
  en: "The English Wikipedia article on Thami El Glaoui (1879 – 23 January 1956), Pasha of Marrakesh from 1912 to 1956, the French protectorate ally who conspired in the overthrow of Mohammed V and then accepted his restoration in 1955; it names no religious school for him."
  es: "El artículo de la Wikipedia en inglés sobre Thami El Glaoui (1879 – 23 de enero de 1956), pachá de Marrakech desde 1912 hasta 1956, aliado del protectorado francés que conspiró en el derrocamiento de Mohammed V y luego aceptó su restauración en 1955; no menciona ninguna escuela religiosa para él."
  fr: "L'article de Wikipédia en anglais sur Thami El Glaoui (1879 – 23 janvier 1956), pacha de Marrakech de 1912 à 1956, allié du protectorat français qui a conspiré pour renverser Mohammed V puis a accepté sa restauration en 1955; il ne mentionne aucune école religieuse à son sujet."
  ur: "انگریزی ویکیپیڈیا مضمون تھامی ایل گلوئی ⁦(1879 - 23 جنوری 1956)⁩، مراکش کا پاشا 1912 سے 1956 تک، فرانسیسی محافظ اتحادی جس نے محمد پنجم کی معزولی کی سازش کی اور پھر 1955 میں اس کی بحالی کو قبول کیا۔ اس نے اس کے لیے کسی مذہبی اسکول کا نام نہیں لیا۔"
