summary:
  ar: "مقالة ويكيبيديا الأردية عن وانغ جينغزهاي؛ تُستخدم لوقائع الكيان فقط. تروي باختصار العالم من تيانجين (1879–1949) الذي ترجم القرآن كاملًا إلى الصينية بطلب من ابن العالمة دينغ يونهوي، وحجّ ودرس في الأزهر، وأسّس مجلات تدعو المسلمين إلى المشاركة في بناء الأمة."
  en: "Urdu Wikipedia article on Wang Jingzhai; used for entity facts only. It briefly recounts the Tianjin scholar (1879–1949) who translated the entire Qur'an into Chinese at the request of the scholar Ding Yunhui's son, performed the hajj and studied at al-Azhar, and founded periodicals urging Muslims to take part in building the nation."
  es: "Artículo de Wikipedia en urdu sobre Wang Jingzhai; utilizado únicamente para datos sobre la persona. Relata brevemente la vida del erudito de Tianjin (1879-1949) que tradujo el Corán completo al chino a petición del hijo del erudito Ding Yunhui, realizó la peregrinación a La Meca (Hajj), estudió en Al-Azhar y fundó publicaciones periódicas que instaban a los musulmanes a participar en la construcción de la nación."
  fr: "Article de Wikipédia en ourdou sur Wang Jingzhai; utilisé uniquement à des fins d'information. Il relate brièvement la vie de cet érudit de Tianjin (1879-1949) qui traduisit l'intégralité du Coran en chinois à la demande du fils de l'érudit Ding Yunhui, accomplit le hajj, étudia à al-Azhar et fonda des périodiques incitant les musulmans à participer à la construction de la nation."
  ur: "Wang Jingzhai پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں مختصر طور پر تیانجن کے اسکالر (1879-1949) کا ذکر کیا گیا ہے جس نے عالم ڈنگ یونہوئی کے بیٹے کی درخواست پر پورے قرآن کا چینی زبان میں ترجمہ کیا، حج کیا اور الازہر میں تعلیم حاصل کی، اور مسلمانوں کو قوم کی تعمیر میں حصہ لینے کی ترغیب دینے والے اخبارات کی بنیاد رکھی۔"
