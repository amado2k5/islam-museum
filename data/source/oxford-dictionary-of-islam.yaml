reliability_note: "Short encyclopaedic entries, written for general readers, not for primary-source depth: use it for the standard summary of a term, a name or a practice, never as the only witness for a contested claim. Entries carry loose wording in places (for example the entry on the pillars dates the hajj to 'the first ten days' of Dhu al-Hijjah and names nine essential rites, where fiqh books list the rites differently), so the museum reports such statements as the Dictionary's own wording and does not adopt them as settled. Proprietary (OUP, All Rights Reserved): facts in the museum's own words only, quotations of 40 words or fewer. Anchor: article id in the form t125/eNNNN; cite `{cite:oxford-dictionary-of-islam eNNNN}` and give the Wayback URL with timestamp in the record's notes. Family posture: source/oxford-islamic-studies-online."
