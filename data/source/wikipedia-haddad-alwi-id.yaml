reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The article names him Abdullah Haddad bin Alwi Assegaf (born 13 March 1966), an Indonesian Islamic religious singer and actor whose album Cinta Rasul (1999) is described as the best-selling religious album in Indonesian music history; his music career is listed as religious genre, active 1997 to the present. Its infobox gives his birthplace as Banjarnegara, Central Java, while the English article's text and Indonesian biographical writing give Jakarta — the conflict is recorded on the museum record and no birthplace edge is written. No school is named for him. Read via search extract on 15 November 2026."
