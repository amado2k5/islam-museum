reliability_note: "Read in the museum's session on 20 November 2026. It says one aim of the Arabic Language Academy founded at Cairo in 1932 was a dictionary showing the historical development of Arabic; that August Fischer's work towards an Arabic counterpart of the Oxford English Dictionary stopped with the Second World War and his death in 1949; that preparations for al-Mu'jam al-kabir went on and a 500-page specimen volume was submitted to specialists in 1956; and that the Egyptian Ministry of Education's request in 1936 for a medium-sized dictionary of scientific and technical terms, with figures and illustrations, led to al-Mu'jam al-wasit. Used for entity facts only."
