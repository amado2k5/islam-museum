reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 26 October 2026 and checked against the recorded revision. It gives his birth at Choueifat on 25 December 1869 and his death on 9 December 1946, but its infobox places the death at Choueifat where the English article's infobox and Wikidata give Beirut — the dispute is preserved in his record. On religion its infobox gives his sect as Ahl al-Sunna wa-l-Jama'a and describes him as formerly Druze; the text discusses his work among the Druze of the Hauran without naming his own affiliation."
