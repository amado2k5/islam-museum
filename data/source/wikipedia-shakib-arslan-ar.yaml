summary:
  ar: "مقالة ويكيبيديا العربية عن شكيب أرسلان؛ تُستخدم لوقائع الكيان فقط. تروي نسبه ونشأته في الشويفات ونشاطه السياسي والأدبي ورحلاته، وتقرن مولده بغرة رمضان 1286 هـ ووفاته بـ15 محرم 1366 هـ."
  en: "Arabic Wikipedia article on Shakib Arslan; used for entity facts only. It gives his lineage and Choueifat upbringing, his political and literary career and his travels, and pairs his birth with 1 Ramadan 1286 AH and his death with 15 Muharram 1366 AH."
  es: "Artículo en árabe de la Wikipedia sobre Shakib Arslan; se utiliza únicamente para obtener información sobre la persona. Describe su linaje y su educación en Choueifat, su trayectoria política y literaria, sus viajes, y sitúa su nacimiento el 1 de Ramadán de 1286 AH y su muerte el 15 de Muharram de 1366 AH."
  fr: "Article de Wikipédia en arabe sur Shakib Arslan; utilisé uniquement pour les informations le concernant. Il retrace sa lignée et son éducation Choueifat, sa carrière politique et littéraire ainsi que ses voyages, et situe sa naissance au 1er Ramadan 1286 AH et sa mort au 15 Muharram 1366 AH."
  ur: "شکیب ارسلان پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس سے ان کا سلسلہ نسب اور چوفیت کی پرورش، ان کے سیاسی و ادبی کیریئر اور سفر کا پتہ چلتا ہے اور ان کی پیدائش یکم رمضان 1286 ہجری اور وفات 15 محرم 1366 ہجری سے ملتی ہے۔"
