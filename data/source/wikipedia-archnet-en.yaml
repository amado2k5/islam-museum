  ar: "مقالة ويكيبيديا الإنجليزية عن «آرك نت»، المراجعة 1373882875؛ لوقائع الكيان فقط: مشروع رقمي مفتوح للعمارة الإسلامية والبيئة المبنية في المجتمعات المسلمة، تصوَّر سنة 1998 بين الآغا خان ومعهد ماساتشوستس للتقنية، وأُطلق رسميًا في 27 سبتمبر 2002، وأُعيد إطلاقه مفتوحًا بلا تسجيل في يناير 2014."
  en: "English Wikipedia article on Archnet, revision 1373882875; entity facts only: an open digital project on Islamic architecture and the built environment of Muslim societies, conceived in 1998 between the Aga Khan and MIT, officially launched on 27 September 2002, and relaunched without logins in January 2014."
  ur: "آرک نیٹ پر انگریزی ویکیپیڈیا کا مضمون، نظرِ ثانی 1373882875؛ صرف حقائق: اسلامی فنِ تعمیر اور مسلم معاشروں کے تعمیری ماحول کا کھلا ڈیجیٹل منصوبہ، 1998 میں آغا خان اور ایم آئی ٹی کے درمیان تصور، 27 ستمبر 2002 کو باضابطہ اجرا، اور جنوری 2014 میں بغیر لاگ اِن کے دوبارہ اجرا۔"
