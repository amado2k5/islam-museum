summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن «آرك نت»، المراجعة 1373882875؛ لوقائع الكيان فقط: مشروع رقمي مفتوح للعمارة الإسلامية والبيئة المبنية في المجتمعات المسلمة، تصوَّر سنة 1998 بين الآغا خان ومعهد ماساتشوستس للتقنية، وأُطلق رسميًا في 27 سبتمبر 2002، وأُعيد إطلاقه مفتوحًا بلا تسجيل في يناير 2014."
  en: "English Wikipedia article on Archnet, revision 1373882875; entity facts only: an open digital project on Islamic architecture and the built environment of Muslim societies, conceived in 1998 between the Aga Khan and MIT, officially launched on 27 September 2002, and relaunched without logins in January 2014."
  ur: "آرک نیٹ پر انگریزی ویکیپیڈیا کا مضمون، نظرِ ثانی 1373882875؛ صرف حقائق: اسلامی فنِ تعمیر اور مسلم معاشروں کے تعمیری ماحول کا کھلا ڈیجیٹل منصوبہ، 1998 میں آغا خان اور ایم آئی ٹی کے درمیان تصور، 27 ستمبر 2002 کو باضابطہ اجرا، اور جنوری 2014 میں بغیر لاگ اِن کے دوبارہ اجرا۔"
  es: "Artículo de la Wikipedia en inglés sobre Archnet, revisión 1373882875; solo datos de la entidad: un proyecto digital abierto sobre arquitectura islámica y el entorno construido de las sociedades musulmanas, concebido en 1998 entre el Aga Khan y el MIT, lanzado oficialmente el 27 de septiembre de 2002 y relanzado sin inicios de sesión en enero de 2014."
  fr: "Article Wikipédia en anglais sur Archnet, révision 1373882875; informations sur l'entité uniquement: un projet numérique ouvert sur l'architecture islamique et l'environnement bâti des sociétés musulmanes, conçu en 1998 entre l'Aga Khan et le MIT, officiellement lancé le 27 septembre 2002 et relancé sans connexion en janvier 2014."
  tr: "İngilizce Wikipedia makalesi 'Arknet' üzerine 1373882875 ve Entity Facts Only: Müslüman topluluklarda İslami mimari ve yapılı çevre üzerine açık kaynaklı dijital bir proje, 1998'de Aga Khan ile Massachusetts Teknoloji Enstitüsü arasında tasarlanmış, 27 Eylül 2002'de resmi olarak başlatılmış ve Ocak 2014'te kayıt olmadan açık uçlu yeniden başlatılmıştır."
  id: "Artikel Wikipedia bahasa Inggris tentang 'Arknet', 1373882875 ulasan Entity Facts Only: Sebuah proyek digital sumber terbuka tentang arsitektur Islam dan lingkungan binaan dalam komunitas Muslim, yang digagas pada tahun 1998 antara Aga Khan dan Massachusetts Institute of Technology, secara resmi diluncurkan pada 27 September 2002, dan diluncurkan kembali secara terbuka tanpa pendaftaran pada Januari 2014."
