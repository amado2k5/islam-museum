summary:
  ar: "فهرس معرض «الهند!» في متحف المتروبوليتان (1985–1986)، بقلم ستيوارت كاري ولش، في خمسة أبواب: التقليد الكبير، والقبيلة والقرية، والبلاطات المسلمة ⁦(السلطنة، والمغول، وسلاطين الدكن)⁩، وعالم الراجبوت، والعهد البريطاني."
  en: "The catalogue of the INDIA! exhibition at the Metropolitan Museum (1985-86), by Stuart Cary Welch, in five parts: the Great Tradition, Tribe and Village, the Muslim Courts (Sultanate, Mughals, Deccani sultans), the Rajput World and the British Period."
  es: "El catálogo de la exposición INDIA! en el Museo Metropolitano (1985-86), de Stuart Cary Welch, consta de cinco partes: la Gran Tradición, la Tribu y la Aldea, las Cortes Musulmanas (Sultanato, Mogoles, sultanes del Decán), el Mundo Rajput y el Período Británico."
  fr: "Le catalogue de l'exposition INDIA! au Metropolitan Museum (1985-86), par Stuart Cary Welch, en cinq parties: la Grande Tradition, la Tribu et le Village, les Cours Musulmanes (Sultanat, Moghols, Sultans du Deccan), le Monde Rajput et la Période Britannique."
  ur: "ہندوستان کا کیٹلاگ! میٹروپولیٹن میوزیم میں نمائش (1985-86)، اسٹورٹ کیری ویلچ کی طرف سے، پانچ حصوں میں: عظیم روایت، قبیلہ اور گاؤں، مسلم عدالتیں ⁦(سلطنت، مغل، دکنی سلاطین)⁩، راجپوت دنیا اور برطانوی دور۔"
  tr: "Metropolitan Müzesi'ndeki \"Hindistan!\" sergisi (1985–1986), Stuart Carey Welch'in beş bölümde indekslenmiştir: Büyük Gelenek, Kabile ve Köy, Müslüman Sarayları (Sultanlık, Babürler, Dekkan Sultanları), Rajputların Dünyası ve Britanya Dönemi."
  id: "Pameran \"India!\" di Metropolitan Museum (1985–1986), karya Stuart Carey Welch, diindeks dalam lima bagian: Tradisi Agung, Suku dan Desa, Pengadilan Muslim (Kesultanan, Mughal, Sultan Deccan), Dunia Rajput, dan Era Inggris."
