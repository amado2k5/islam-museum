summary:
  ar: "خبر برودواي وورلد عن ألبوم سارية عيدان الأول «بريكينغ شادوز» (2019)؛ يُستخدم لوقائع الكيان فقط. يصفها بأنها مغنية وكاتبة أغانٍ وعازفة أمريكية وُلدت في نيويورك، ويذكر جذورها اليهودية الأشكنازية بوصفها خلفية ثقافية."
  en: "BroadwayWorld item on Sariyah Idan's debut album Breaking Shadows (2019); used for entity facts only. It describes her as an American songwriter, vocalist and multi-instrumentalist born in New York, and mentions her Ashkenazi Jewish roots as cultural background."
  es: "Artículo de BroadwayWorld sobre el álbum debut de Sariyah Idan, Breaking Shadows (2019); utilizado únicamente para obtener información sobre la artista. La describe como una compositora, vocalista y multiinstrumentista estadounidense nacida en Nueva York, y menciona sus raíces judías asquenazíes como parte de su bagaje cultural."
  fr: "Article de BroadwayWorld sur le premier album de Sariyah Idan, Breaking Shadows (2019); utilisé uniquement à titre informatif. Il la décrit comme une auteure-compositrice-interprète et multi-instrumentiste américaine née à New York, et mentionne ses origines juives ashkénazes."
  ur: "BroadwayWorld آئٹم Sariyah Idan کی پہلی البم Breaking Shadows (2019) پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ نیویارک میں پیدا ہونے والی ایک امریکی نغمہ نگار، گلوکار اور کثیر ساز ساز کے طور پر بیان کرتا ہے، اور ثقافتی پس منظر کے طور پر اس کی اشکنازی یہودی جڑوں کا ذکر کرتا ہے۔"
  tr: "Broadway World'ün Sariya Edan'ın ilk albümü \"Breaking Shadows\" (2019) ile ilgili haberler, yalnızca varlığın gerçekleri için kullanılıyor. Onu New York doğumlu Amerikalı bir şarkıcı, söz yazarı ve müzisyen olarak tanımlıyor ve kültürel arka plan olarak Aşkenaz Yahudi kökenlerinden bahsediyor."
  id: "Berita Broadway World tentang album debut Sariya Edan \"Breaking Shadows\" (2019) hanya digunakan untuk fakta-fakta entitas tersebut. Berita ini menggambarkannya sebagai penyanyi, penulis lagu, dan musisi Amerika yang lahir di New York, dengan menyebutkan akar Yahudi Ashkenazi sebagai latar belakang budaya."
