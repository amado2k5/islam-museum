summary:
  ar: "مدخل موسوعة بريتانيكا عن أ. ر. رحمان؛ يؤرخ ميلاده 6 يناير 1967 بمدراس، ويؤكد اعتناقه الإسلام مع أسرته في مطلع عشرينياته، ويختصر مسيرته وجوائزه ومنها بادما شري (2000) وبادما بوشان (2010)."
  en: "Encyclopaedia Britannica entry on A. R. Rahman; it dates his birth to 6 January 1967 at Madras, corroborates his conversion to Islam with his family in his early twenties, and summarises his career and honours, including the Padma Shri (2000) and Padma Bhushan (2010)."
  es: "Entrada de la Enciclopedia Británica sobre AR Rahman; en ella se fecha su nacimiento el 6 de enero de 1967 en Madrás, se corrobora su conversión al Islam con su familia a principios de sus veinte años y se resumen su trayectoria y sus honores, incluidos el Padma Shri (2000) y el Padma Bhushan (2010)."
  fr: "L'article de l'Encyclopædia Britannica sur AR Rahman; il date sa naissance du 6 janvier 1967 à Madras, corrobore sa conversion à l'islam avec sa famille au début de la vingtaine et résume sa carrière et ses distinctions, dont le Padma Shri (2000) et le Padma Bhushan (2010)."
  ur: "اے آر رحمان پر انسائیکلوپیڈیا برٹانیکا کا اندراج؛ اس میں ان کی پیدائش 6 جنوری 1967 کو مدراس میں ہے، بیس کی دہائی کے اوائل میں ان کے خاندان کے ساتھ اسلام قبول کرنے کی تصدیق کرتا ہے، اور ان کے کیریئر اور اعزازات کا خلاصہ پیش کرتا ہے، بشمول پدم شری (2000) اور پدم بھوشن (2010)۔"
