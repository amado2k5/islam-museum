  ar: "مدخل موسوعة بريتانيكا عن أ. ر. رحمان؛ يؤرخ ميلاده 6 يناير 1967 بمدراس، ويؤكد اعتناقه الإسلام مع أسرته في مطلع عشرينياته، ويختصر مسيرته وجوائزه ومنها بادما شري (2000) وبادما بوشان (2010)."
  en: "Encyclopaedia Britannica entry on A. R. Rahman; it dates his birth to 6 January 1967 at Madras, corroborates his conversion to Islam with his family in his early twenties, and summarises his career and honours, including the Padma Shri (2000) and Padma Bhushan (2010)."
