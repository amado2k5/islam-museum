reliability_note: "Reference entry read in full on 25 October 2026. It gives his birth as 6 January 1967 at Madras (now Chennai), his birth name as A.S. Dileep Kumar, his father as the Malayalam film composer R.K. Sekhar (the spelling differs from the English Wikipedia article's 'Shekhar'; a variant, recorded here), piano study from the age of four and professional playing after his father's death, and the Western classical qualification through Trinity College, London. On the conversion it says only: 'In his early 20s Rahman, along with his family, converted to Islam, and he then adopted the name by which he is now known' — corroboration of the conversion, with no mention of Sufism, so it is not one of the two attestations behind the sufi segment. It also confirms the Roja breakthrough (1992), Bombay Dreams (2002) with Don Black for Andrew Lloyd Webber, the Slumdog Millionaire awards (BAFTA, Golden Globe and Academy Award for the score; the shared Academy Award for 'Jai Ho' with Gulzar; two Grammys in 2010), 127 Hours (2010), and the Padma Shri (2000) and Padma Bhushan (2010)."
