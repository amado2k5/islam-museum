summary:
  ar: "مقالة ويكيبيديا الأردية عن طارق جميل؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في الميلاد ⁦(1 أكتوبر 1953، ميان جنو)⁩ والتعليم في مدرسة عربية رائيوند وعضوية جماعة التبليغ، ويعطي صندوق معلوماتها الفرقة أهل السنة والفقه الحنفي والمعتقد الديوبندي."
  en: "Urdu Wikipedia article on Tariq Jamil; used for entity facts only. It agrees with the English article on his birth (1 October 1953, Mian Channu), his education at Madrasa Arabia Raiwind and his Tablighi Jama'at membership; its infobox gives his sect as Ahl-e-Sunnat, his fiqh as Hanafi and his creed as Deobandi."
  es: "Artículo de Wikipedia en urdu sobre Tariq Jamil; Se utiliza únicamente para hechos de entidades. Concuerda con el artículo inglés sobre su nacimiento (1 de octubre de 1953, Mian Channu), su educación en Madrasa Arabia Raiwind y su membresía en Tablighi Jama'at; su cuadro de información muestra su secta como Ahl-e-Sunnat, su fiqh como Hanafi y su credo como Deobandi."
  fr: "Article Wikipédia en ourdou sur Tariq Jamil; utilisé uniquement pour les faits d’entité. Il est en accord avec l'article anglais sur sa naissance (1er octobre 1953, Mian Channu), son éducation à la Madrasa Arabia Raiwind et son appartenance au Tablighi Jama'at; sa infobox donne sa secte comme Ahl-e-Sunnat, son fiqh comme Hanafi et son credo comme Deobandi."
  ur: "طارق جمیل پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش ⁦(1 اکتوبر 1953، میاں چنوں)⁩، مدرسہ عربیہ رائے ونڈ میں ان کی تعلیم اور تبلیغی جماعت کی رکنیت سے متعلق انگریزی مضمون سے متفق ہے۔ اس کا معلومات خانہ اس کا فرقہ اہلسنت، اس کا فقہ حنفی اور اس کا مسلک دیوبندی بتاتا ہے۔"
  tr: "Tariq Jamil hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumda İngilizce (1 Ekim 1953, Mian Geno), Raiwind'deki bir Arap okulunda eğitim, Tabligh Grubu üyeliği ve bilgi kutusu Ahl al-Sunnah mezhebi, Hanefi fıkıh ve Deobandi inancını içerir."
  id: "Artikel Wikipedia Urdu tentang Tariq Jamil; digunakan hanya untuk fakta entitas. Artikel ini sesuai dengan bahasa Inggris sejak lahir (1 Oktober 1953, Mian Geno), pendidikan di sekolah Arab di Raiwind, keanggotaan Kelompok Tabligh, dan infoboxnya mencakup sekte Ahl al-Sunnah, yurisprudensi Hanafi, dan kepercayaan Deobandi."
