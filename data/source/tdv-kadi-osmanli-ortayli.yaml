summary:
  ar: "الجزء الثاني من مدخل «كادي» في موسوعة TDV الإسلامية، بقلم إلبير أورتايلي (المجلد 24، إسطنبول 2001، ص 69–73)، ويتناول القاضي في الدولة العثمانية: تعيينه بالبراءة، وتكوينه في المدارس، وترتيب مناصبه، ومدة ولايته، ودوره المحلي."
  en: "The second part of the 'KADI' entry in the TDV İslâm Ansiklopedisi, 'Osmanlı Devleti'nde Kadı' by İlber Ortaylı (vol. 24, Istanbul 2001, pp. 69–73). It covers the Ottoman qadi: appointment by imperial berat, training in the madrasas, the rank system, the length of service and the local role."
