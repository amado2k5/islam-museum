label: { ar: "قاضي الدولة العثمانية — موسوعة TDV الإسلامية ⁦(إلبير أورتايلي)⁩", en: "Osmanlı Devleti'nde Kadı — TDV İslâm Ansiklopedisi (İlber Ortaylı)" }
summary:
  ar: "الجزء الثاني من مدخل «كادي» في موسوعة TDV الإسلامية، بقلم إلبير أورتايلي ⁦(المجلد 24، إسطنبول 2001، ص 69–73)⁩، ويتناول القاضي في الدولة العثمانية: تعيينه بالبراءة، وتكوينه في المدارس، وترتيب مناصبه، ومدة ولايته، ودوره المحلي."
  en: "The second part of the 'KADI' entry in the TDV İslâm Ansiklopedisi, 'Osmanlı Devleti'nde Kadı' by İlber Ortaylı (vol. 24, Istanbul 2001, pp. 69–73). It covers the Ottoman qadi: appointment by imperial berat, training in the madrasas, the rank system, the length of service and the local role."
  es: "La segunda parte de la entrada «KADI» en la TDV İslâm Ansiklopedisi, «Osmanlı Devleti'nde Kadı», de İlber Ortaylı (vol. 24, Estambul, 2001, págs. 69-73), abarca al cadí otomano: su nombramiento por el berat imperial, su formación en las madrasas, el sistema de rangos, la duración de su servicio y su función local."
  fr: "La deuxième partie de l'article « KADI » dans l'ouvrage TDV İslâm Ansiklopedisi, « Osmanlı Devleti'nde Kadı » d'İlber Ortaylı (vol. 24, Istanbul, 2001, p. 69-73), traite du cadi ottoman: sa nomination par le berat impérial, sa formation dans les madrasas, son système de grades, la durée de son mandat et son rôle local."
  ur: "TDV İslâm Ansiklopedisi میں 'KADI' کے اندراج کا دوسرا حصہ، 'Osmanlı Devleti'nde Kadı' از İlber Ortaylı ⁦(جلد 24، استنبول 2001، صفحہ 69-73)⁩۔ اس میں عثمانی قضا کا احاطہ کیا گیا ہے: شاہی برات کے ذریعے تقرری، مدارس میں تربیت، درجہ بندی کا نظام، خدمت کی لمبائی اور مقامی کردار۔"
  tr: "TDV İslami Ansiklopedisi'ndeki \"Kadi\" maddesinin ikinci bölümü, Albert Orteili tarafından (Cilt 24, İstanbul 2001, ss. 69–73), Osmanlı devletindeki hakime hitap eder: beraat yoluyla atanması, okullarda aldığı eğitim, pozisyonlarının düzeni, görev süresi ve yerel rolü."
  id: "Bagian kedua dari entri \"Kadi\" dalam Ensiklopedia Islam TDV, oleh Albert Orteili (Vol. 24, Istanbul 2001, hlm. 69–73), membahas hakim di negara Ottoman: pengangkatannya melalui pembebasan, pelatihannya di sekolah, pengaturan jabatannya, durasi masa jabatannya, dan perannya di tingkat lokal."
