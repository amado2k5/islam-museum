label: { en: "Internet Archive capture of waqfeya.com, 14 December 2005" }
summary:
  ar: "أقدم لقطة في أرشيف الإنترنت لموقع waqfeya.com بتاريخ 14 ديسمبر 2005، بعنوان «تحت الإنشاء»: «المكتبة الوقفية» بخزانة للكتب المصورة ضوئيًا، وخزانة للمخطوطات تزيد على 12 غيغابايت وخزانة للمتون الصوتية والإصدار الثاني من «الموسوعة الشاملة» بوصفها قادمة قريبًا."
  en: "The earliest Internet Archive capture of waqfeya.com, 14 December 2005, titled 'under construction': al-Maktaba al-Waqfiya with a store of scanned books, and a manuscripts store of more than 12 GB, a store of recited texts and the second release of 'al-Mawsu'a al-Shamila' announced as coming soon."
  ur: "waqfeya.com کی سب سے پرانی انٹرنیٹ آرکائیو تصویر، 14 دسمبر 2005، عنوان «زیرِ تعمیر»: اسکین شدہ کتابوں کا ذخیرہ، اور مخطوطات ⁦(12 گیگا بائٹ سے زیادہ)⁩، صوتی متون اور «الموسوعۃ الشاملہ» کا دوسرا نسخہ «جلد»۔"
  es: "La primera captura de waqfeya.com en Internet Archive, del 14 de diciembre de 2005, titulada \"en construcción\": al-Maktaba al-Waqfiya con un archivo de libros escaneados y un archivo de manuscritos de más de 12 GB, un archivo de textos recitados y el anuncio del segundo lanzamiento de \"al-Mawsu'a al-Shamila\" como próximamente disponible."
  fr: "La première capture d'Internet Archive de waqfeya.com, datée du 14 décembre 2005, intitulée « en construction »: al-Maktaba al-Waqfiya avec une réserve de livres numérisés, une réserve de manuscrits de plus de 12 Go, une réserve de textes récités et la deuxième version d'« al-Mawsu'a al-Shamila » annoncée comme prochainement disponible."
  tr: "waqfeya.com web sitesi internet arşivinden 14 Aralık 2005 tarihli en eski anlık görüntü, \"Yapım Aşamasında\" başlıklı: \"Vakıf Kütüphanesi\"; aydınlatmalı kitaplar için bir kütüphane, 12 gigabaytı aşan bir el yazması kütüphanesi, sesli metinler için bir kütüphane ve yakında gelecek olan \"Kapsamlı Ansiklopedi\"nin ikinci baskısı."
  id: "Cuplikan tertua dari arsip internet situs web waqfeya.com tanggal 14 Desember 2005, berjudul \"Under Construction\": \"The Endowment Library\" dengan perpustakaan untuk buku iluminasi, perpustakaan manuskrip berukuran lebih dari 12 gigabyte, perpustakaan untuk teks audio, dan edisi kedua \"Comprehensive Encyclopedia\" yang akan segera hadir."
