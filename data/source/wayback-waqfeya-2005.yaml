summary:
  ar: "أقدم لقطة في أرشيف الإنترنت لموقع waqfeya.com بتاريخ 14 ديسمبر 2005، بعنوان «تحت الإنشاء»: «المكتبة الوقفية» بخزانة للكتب المصورة ضوئيًا، وخزانة للمخطوطات تزيد على 12 غيغابايت وخزانة للمتون الصوتية والإصدار الثاني من «الموسوعة الشاملة» بوصفها قادمة قريبًا."
  en: "The earliest Internet Archive capture of waqfeya.com, 14 December 2005, titled 'under construction': al-Maktaba al-Waqfiya with a store of scanned books, and a manuscripts store of more than 12 GB, a store of recited texts and the second release of 'al-Mawsu'a al-Shamila' announced as coming soon."
  ur: "waqfeya.com کی سب سے پرانی انٹرنیٹ آرکائیو تصویر، 14 دسمبر 2005، عنوان «زیرِ تعمیر»: اسکین شدہ کتابوں کا ذخیرہ، اور مخطوطات ⁦(12 گیگا بائٹ سے زیادہ)⁩، صوتی متون اور «الموسوعۃ الشاملہ» کا دوسرا نسخہ «جلد»۔"
