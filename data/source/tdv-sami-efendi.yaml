reliability_note: "Scholarly encyclopedia entry by the leading historian of Ottoman calligraphy; the record's anchor source for Sami Efendi's dates, teachers, students and career, read in full on 26 October 2026. It gives no madhhab, school or order for Sami Efendi himself; the only order it names is Naqshbandi, attached to his marbling teacher Edhem Efendi, and it notes a variant narration attributing the marbling lessons to his ta'liq teacher instead."
