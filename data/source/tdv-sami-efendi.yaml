summary:
  ar: "مدخل موسوعة الإسلام التابعة لوقف الديانة التركي (TDV) عن سامي أفندي بقلم م. أوغور درمان؛ تُستخدم لوقائع الكيان. يعطي اسمه الكامل إسماعيل حقي، وميلاده في 16 ذي الحجة 1253 (13 مارس 1838) في حي حيدر خانه بالفاتح في إسطنبول، وأساتذته وتلاميذه، ومناصبه في ديوان الهمايون وتدريسه في قصر طوب قابي، ووفاته في 1 يوليو 1912 ودفنه في حظيرة جامع الفاتح. ويذكر أنه تعلّم الإبرو من أدهم أفندي، شيخ الطريقة النقشبندية في تكية أوزبكلر — وهي نسبة أستاذه لا نسبة سامي نفسه."
  en: "TDV İslâm Ansiklopedisi entry on Sami Efendi by M. Uğur Derman; used for entity facts. It gives his full name İsmâil Hakkı, his birth on 16 Zilhicce 1253 (13 March 1838) in the Haydarhâne quarter of Fatih, Istanbul, his teachers and students, his posts in the Imperial Council and his teaching at the Topkapi Palace, and his death on 1 July 1912 with burial in the hazire of the Fatih Mosque. It records that he learned ebru (marbling) from Edhem Efendi, the Naqshbandi shaykh of the Özbekler Tekkesi — his teacher's affiliation, not Sami Efendi's own."
title: "Sâmi Efendi, İsmâil Hakkı"
