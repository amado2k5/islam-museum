summary:
  ar: "مدخل موسوعة الإسلام التابعة لوقف الديانة التركي (TDV) عن سامي أفندي بقلم م. أوغور درمان؛ تُستخدم لوقائع الكيان. يعطي اسمه الكامل إسماعيل حقي، وميلاده في 16 ذي الحجة 1253 ⁦(13 مارس 1838)⁩ في حي حيدر خانه بالفاتح في إسطنبول، وأساتذته وتلاميذه، ومناصبه في ديوان الهمايون وتدريسه في قصر طوب قابي، ووفاته في 1 يوليو 1912 ودفنه في حظيرة جامع الفاتح. ويذكر أنه تعلّم الإبرو من أدهم أفندي، شيخ الطريقة النقشبندية في تكية أوزبكلر — وهي نسبة أستاذه لا نسبة سامي نفسه."
  en: "TDV İslâm Ansiklopedisi entry on Sami Efendi by M. Uğur Derman; used for entity facts. It gives his full name İsmâil Hakkı, his birth on 16 Zilhicce 1253 (13 March 1838) in the Haydarhâne quarter of Fatih, Istanbul, his teachers and students, his posts in the Imperial Council and his teaching at the Topkapi Palace, and his death on 1 July 1912 with burial in the hazire of the Fatih Mosque. It records that he learned ebru (marbling) from Edhem Efendi, the Naqshbandi shaykh of the Özbekler Tekkesi — his teacher's affiliation, not Sami Efendi's own."
  es: "Entrada de TDV İslâm Ansiklopedisi sobre Sami Efendi por M. Uğur Derman; utilizada para datos biográficos. Indica su nombre completo, İsmâil Hakkı, su nacimiento el 16 de Zilhicce de 1253 (13 de marzo de 1838) en el barrio de Haydarhâne de Fatih, Estambul, sus maestros y alumnos, sus cargos en el Consejo Imperial y su enseñanza en el Palacio de Topkapi, y su fallecimiento el 1 de julio de 1912, siendo enterrado en el cementerio de la Mezquita de Fatih. Registra que aprendió ebru (marmolado) de Edhem Efendi, el shaykh Naqshbandi de la Özbekler Tekkesi —afiliación de su maestro, no la de Sami Efendi—."
  fr: "Notice de l'Ansiklopedisi de l'İslâm TDV consacrée à Sami Efendi par M. Uğur Derman; utilisée pour les informations sur les personnes. Elle indique son nom complet İsmâil Hakkı, sa naissance le 16 Zilhicce 1253 (13 mars 1838) dans le quartier Haydarhâne de Fatih, à Istanbul, ses maîtres et élèves, ses fonctions au Conseil impérial et son enseignement au palais de Topkapi, ainsi que sa mort le 1er juillet 1912 et son inhumation au hazire de la mosquée Fatih. Elle précise qu'il a appris l'ebru (marbrure) auprès d'Edhem Efendi, le cheikh naqshbandi de l'Özbekler Tekkesi — l'affiliation de son maître, et non celle de Sami Efendi lui-même."
  ur: "سمیع ایفندی پر TDV İslâm Ansiklopedisi entry by M. Uğur Derman; ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کا پورا نام اسماعیل حقی بتایا گیا ہے، اس کی پیدائش 16 ذی الحجہ 1253 ⁦(13 مارچ 1838)⁩ کو فتح، استنبول کے حیدرہانے کوارٹر میں ہوئی، اس کے اساتذہ اور طلباء، امپیریل کونسل میں ان کے عہدے اور توپکاپی محل میں ان کی تدریس، اور ان کی وفات 1 جولائی 2019 کو 2 ذی الحجہ کو ہوئی۔ مسجد۔ یہ ریکارڈ کرتا ہے کہ اس نے ایبرو ⁦(ماربلنگ)⁩ ایدھم آفندی سے سیکھا، جو ازبیکلر ٹیکسی کے نقشبندی شیخ ہے - اس کے استاد سے وابستگی ہے، نہ کہ سمیع آفندی کی اپنی۔"
