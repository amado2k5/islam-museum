summary:
  ar: "مقالة تأليف مونيكا ريوس في The Biographical Encyclopedia of Astronomers ⁦(Springer، 2007، ص566-567)⁩ عن أبي القاسم أحمد بن عبد الله ابن الصفار الغافقي الأندلسي ⁦(ت 1035م)⁩، تلميذ مسلمة المجريطي في قرطبة ثم دانية، وأشهر كتبه رسالة في استعمال الأسطرلاب المترجمة إلى اللاتينية والعبرية والإسبانية القديمة والمستعملة في بلاط ألفونسو العاشر."
  en: "Mònica Rius's entry on Abu al-Qasim Ahmad ibn Abdallah Ibn al-Saffar al-Andalusi (d. 1035) in The Biographical Encyclopedia of Astronomers (Springer, 2007, pp. 566-567): pupil of Maslama al-Majriti at Cordoba then Denia; his most popular work, a treatise on astrolabe use translated into Latin, Hebrew and Old Spanish and used at Alfonso X's court."
  ur: "مونیكا ریوس کا مضمون The Biographical Encyclopedia of Astronomers ⁦(Springer، 2007، ص566-567)⁩ میں اندلسی ابو القاسم احمد بن عبد اللہ ابن الصفار الغافقی ⁦(ت 1035ء)⁩ پر: قرطبہ میں مسلمہ المجریطی کا شاگرد پھر دانیہ؛ مشہور ترین کتاب اسطرلاب کے استعمال کا رسالہ جس کا لاطینی، عبرانی اور پرانی ہسپانوی ترجمہ ہوا اور الفانسو دہم کے دربار میں استعمال ہوا۔"
  es: "Entrada de Mònica Rius sobre Abu al-Qasim Ahmad ibn Abdallah Ibn al-Saffar al-Andalusi (m. 1035) en The Biographical Encyclopedia of Astronomers (Springer, 2007, pp. 566-567): discípulo de Maslama al-Majriti en Córdoba y luego en Denia; su obra más popular, un tratado sobre el uso del astrolabio traducido al latín, hebreo y español antiguo y utilizado en la corte de Alfonso X."
  fr: "L'article de Mònica Rius sur Abu al-Qasim Ahmad ibn Abdallah Ibn al-Saffar al-Andalusi (mort en 1035) dans The Biographical Encyclopedia of Astronomers (Springer, 2007, pp. 566-567): élève de Maslama al-Majriti à Cordoue puis à Dénia; son œuvre la plus populaire, un traité sur l'utilisation de l'astrolabe traduit en latin, en hébreu et en vieil espagnol et utilisé à la cour d'Alphonse X."
