reliability_note: "Full entry text read on 2026-11-15 via the McGill-hosted Springer page. It documents the Cordoban school, disciples, move to Denia, the Sindhind recensions, the astrolabe treatise's popularity and translations (Johannes Hispalensis's Maslama misattribution explained by a borrowed final chapter, Plato of Tivoli's dedication, Hebrew by Jacob ben Makhir, Old Spanish), Alfonso X's use, the qibla value for Cordoba and the sundial attribution with its 'in the manner of' caveat. Death given as 1035; used only as an open bound."
