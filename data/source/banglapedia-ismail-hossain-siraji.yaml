reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia in editorship; the English Wikipedia article in turn cites it for most claims. Read in full on 25 October 2026. It gives only the years 1880–1931 and the birth district, Sirajganj, from which he took the suffix 'Shiraji' he gave himself; the exact birth and death days in the person record come from the English article and are recorded on its authority. It gives his father Abdul Karim Khandkar (1856–1924) as a practitioner of Unani medicine who was not financially well off (the English article adds that he was a police sub-inspector). Its lists date Anal Prabaha to 1900 (the English article's career text says he published it in 1899 at nineteen; both are recorded), and it names his journals Al-Eslam, Islam Pracharak, Prabasi, Pracharak, Kohinoor, Soltan, Mohammadi, Saogat, Nabajug and Nabanur, his organisations the Indian National Congress, the Muslim League, the Anjuman-i-Ulama-i-Bangla, the Jamiat-e-Ulama-i-Hind, the Swarajya Party and the Krishak Samiti, and his verse books and four novels Ray Nandini (1915), Tara Bai (1916), Feroza Begum (1918) and Nooruddin (1919). It names no school for him."
