summary:
  ar: "مدخل إسماعيل حسين سراجي في بنغلابيديا، الموسوعة الوطنية لبنغلاديش، بقلم رنا رزاق؛ تُستخدم لوقائع الكيان فقط. يصفه كاتبا وخطيبا وقائد فلاحين، ويذكر عجزه عن الدراسة الجامعية لفقر أسرته، وشهرته خطيبا، ودفاعه عن مصالح المسلمين مع إيمانه بالوحدة الهندوسية الإسلامية، وتأثره بشبلي النعماني ومحمد إقبال، وقيادته حركة الفلاحين في سراج غنج، وقوائم قصائده ورواياته."
  en: "Entry 'Shiraji, Ismail Hossain' in Banglapedia, the national encyclopedia of Bangladesh, by Rana Razzaq; used for entity facts only. It styles him writer, orator and peasant leader, and records his inability to afford college, his reputation as an orator, his advocacy of Muslim interests with a belief in Hindu–Muslim amity, the influence of Shibli Nomani and Mohammad Iqbal on him, his leadership of the Sirajganj peasant movement, and lists of his verse and novels."
title: "Shiraji, Ismail Hossain"
