reliability_note: "Community-edited boxing encyclopedia page, read in full on 26 October 2026 at the recorded revision permalink (oldid 588292). Used for entity facts only, and for its statement of his conversion, which is its own text: 'Eddie Mustafa Muhammad became a Muslim in the early 1970s and changed his name from Eddie Gregory after he won the WBA light heavyweight title in 1980.' Its birth name, Edward Lee Gregory, conflicts with the English Wikipedia article's Edward Dean Gregory (which cites The Boxing Register); both are recorded in the person record. It names no school of Islam for him."
