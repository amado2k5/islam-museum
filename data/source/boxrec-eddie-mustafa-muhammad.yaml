summary:
  ar: "صفحة موسوعة BoxRec عن إدي مصطفى محمد، بالمراجعة المسجلة 588292. تذكر في متنها أنه أصبح مسلماً في أوائل السبعينيات وغيّر اسمه من إدي غريغوري بعد فوزه بلقب رابطة الملاكمة العالمية سنة 1980، وتعطي اسم ميلاده «إدوارد لي غريغوري» — بخلاف «إدوارد دين غريغوري» في المقالة الإنجليزية — ومسيرته مدرباً ومؤسساً لنقابة الملاكمين JAB."
  en: "BoxRec encyclopedia page on Eddie Mustafa Muhammad, at its recorded revision 588292. It states in its text that he became a Muslim in the early 1970s and changed his name from Eddie Gregory after he won the WBA light heavyweight title in 1980, gives his birth name as Edward Lee Gregory — against the English article's Edward Dean Gregory — and records his training career and his founding of the JAB boxers' union."
