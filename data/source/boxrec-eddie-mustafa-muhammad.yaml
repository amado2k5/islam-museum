summary:
  ar: "صفحة موسوعة BoxRec عن إدي مصطفى محمد، بالمراجعة المسجلة 588292. تذكر في متنها أنه أصبح مسلماً في أوائل السبعينيات وغيّر اسمه من إدي غريغوري بعد فوزه بلقب رابطة الملاكمة العالمية سنة 1980، وتعطي اسم ميلاده «إدوارد لي غريغوري» — بخلاف «إدوارد دين غريغوري» في المقالة الإنجليزية — ومسيرته مدرباً ومؤسساً لنقابة الملاكمين JAB."
  en: "BoxRec encyclopedia page on Eddie Mustafa Muhammad, at its recorded revision 588292. It states in its text that he became a Muslim in the early 1970s and changed his name from Eddie Gregory after he won the WBA light heavyweight title in 1980, gives his birth name as Edward Lee Gregory — against the English article's Edward Dean Gregory — and records his training career and his founding of the JAB boxers' union."
  es: "Página de la enciclopedia BoxRec sobre Eddie Mustafa Muhammad, en su revisión registrada 588292. En su texto se afirma que se convirtió al Islam a principios de la década de 1970 y cambió su nombre de Eddie Gregory después de ganar el título de peso semipesado de la AMB en 1980, da su nombre de nacimiento como Edward Lee Gregory —en contraposición a Edward Dean Gregory del artículo en inglés— y registra su carrera como entrenador y la fundación del sindicato de boxeadores JAB."
  fr: "La page de l'encyclopédie BoxRec sur Eddie Mustafa Muhammad, à sa révision enregistrée 588292. Elle indique dans son texte qu'il est devenu musulman au début des années 1970 et a changé son nom d'Eddie Gregory après avoir remporté le titre WBA des poids mi-lourds en 1980, donne son nom de naissance comme Edward Lee Gregory — contre Edward Dean Gregory dans l'article anglais — et relate sa carrière d'entraîneur et sa fondation du syndicat des boxeurs JAB."
