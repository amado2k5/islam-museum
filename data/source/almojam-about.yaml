summary:
  ar: "صفحة «عن المعجم» ومقدمة الرئيس التنفيذي للمعجم التاريخي للغة العربية بالشارقة، اطُّلع عليها في ٢٠ نوفمبر ٢٠٢٦؛ تُستخدم لبيان ماهية المشروع ومن يقف وراءه."
  en: "The about page and executive president's preface of the Sharjah Historical Dictionary of Arabic, read on 20 November 2026; used for what the project is and who stands behind it."
  es: "La página «acerca de» y el prefacio del presidente ejecutivo del Diccionario Histórico de la Lengua Árabe de Sharjah, consultados el 20 de noviembre de 2026; usados para saber qué es el proyecto y quién está detrás."
  fr: "La page « à propos » et la préface du président exécutif du Dictionnaire historique de la langue arabe de Sharjah, consultées le 20 novembre 2026 ; utilisées pour ce qu'est le projet et qui le porte."
  ur: "شارجہ کی تاریخی معجمِ عربی زبان کا تعارفی صفحہ اور چیف ایگزیکٹو کا دیباچہ، 20 نومبر 2026 کو پڑھا؛ منصوبہ کیا ہے اور اس کے پیچھے کون ہے، اس کے لیے استعمال۔"
