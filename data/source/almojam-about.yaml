reliability_note: "Read in the museum's session on 20 November 2026. The about page says the dictionary is a large language project aiming to document the history of Arabic words and their meanings across the ages, under the supervision of the Arabic Language Academy in Sharjah; it carries the preface of Dr Sultan bin Muhammad al-Qasimi, executive president of the project, dated Sharjah, 15 Dhu al-Hijja 1442 / 25 July 2021, which says the work was done by scholars of the academies under the banner of the Union of Arabic Language Academies. The page also lists prefaces by the president of the Union, the scientific director and the executive director and a page on the method (not read). Used for facts about the project only."
