summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تشودري خليق الزمان (1889–1973)؛ تعطي مولده في 25 كانون الأول 1889 في تشونار ووفاته في 18 أيار 1973، وتروي ترؤسه للرابطة الإسلامية ⁦(باكستان)⁩، وحاكميته لبنغال الشرقية (1953–1954) خلفاً لفيروز خان نون، وسفارته لدى إندونيسيا والفلبين، ومذكراته «درب إلى باكستان». لا يسمي نصها مذهباً له؛ وتصنيفاتها تضعه بين مسلمي باكستان السنة."
  en: "The English Wikipedia article on Chaudhry Khaliquzzaman (1889–1973); it gives his birth on 25 December 1889 at Chunar and his death on 18 May 1973, and recounts his presidency of the Muslim League (Pakistan), his governorship of East Bengal (1953–1954) succeeding Feroz Khan Noon, his ambassadorship to Indonesia and the Philippines, and his memoir Pathway to Pakistan. Its text names no school for him; its categories file him among Pakistani Sunni Muslims."
  es: "El artículo de Wikipedia en inglés sobre Chaudhry Khaliquzzaman (1889-1973) indica su nacimiento el 25 de diciembre de 1889 en Chunar y su fallecimiento el 18 de mayo de 1973. También relata su presidencia de la Liga Musulmana (Pakistán), su mandato como gobernador de Bengala Oriental (1953-1954) sucediendo a Feroz Khan Noon, su embajada en Indonesia y Filipinas, y sus memorias tituladas \"Camino a Pakistán\". El texto no menciona ninguna escuela a la que pertenezca; sus categorías lo clasifican entre los musulmanes sunitas pakistaníes."
  fr: "L'article de Wikipédia en anglais consacré à Chaudhry Khaliquzzaman (1889-1973) indique sa naissance le 25 décembre 1889 à Chunar et son décès le 18 mai 1973. Il relate sa présidence de la Ligue musulmane (Pakistan), son poste de gouverneur du Bengale oriental (1953-1954) succédant à Feroz Khan Noon, ses fonctions d'ambassadeur en Indonésie et aux Philippines, ainsi que ses mémoires, « Pathway to Pakistan ». Le texte ne mentionne aucune école à laquelle il aurait été inscrit; il est classé parmi les musulmans sunnites pakistanais."
