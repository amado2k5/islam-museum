summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تشودري خليق الزمان (1889–1973)؛ تعطي مولده في 25 كانون الأول 1889 في تشونار ووفاته في 18 أيار 1973، وتروي ترؤسه للرابطة الإسلامية (باكستان)، وحاكميته لبنغال الشرقية (1953–1954) خلفاً لفيروز خان نون، وسفارته لدى إندونيسيا والفلبين، ومذكراته «درب إلى باكستان». لا يسمي نصها مذهباً له؛ وتصنيفاتها تضعه بين مسلمي باكستان السنة."
  en: "The English Wikipedia article on Chaudhry Khaliquzzaman (1889–1973); it gives his birth on 25 December 1889 at Chunar and his death on 18 May 1973, and recounts his presidency of the Muslim League (Pakistan), his governorship of East Bengal (1953–1954) succeeding Feroz Khan Noon, his ambassadorship to Indonesia and the Philippines, and his memoir Pathway to Pakistan. Its text names no school for him; its categories file him among Pakistani Sunni Muslims."
