  fr: "La notice sur Makki dans les Siyar A'lam al-Nubala' d'al-Dhahabi (vol. 17, pp. 591-592) sur Islamweb, qui, selon le résumé de recherche, donne son nom complet et sa mort en muharram 437 H. La page est nommée dans un résumé de recherche remis au musée et approuvé pour usage par le fondateur le 21 novembre 2026 ; le musée ne l'a pas ouverte."
  es: "La entrada sobre Makki en los Siyar A'lam al-Nubala' de al-Dhahabi (vol. 17, pp. 591-592) en Islamweb, que según el resumen de investigación da su nombre completo y su muerte en muharram de 437 H. La página figura en un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026; el museo no la abrió."
