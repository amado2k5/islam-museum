  ar: "ترجمة مكي في سير أعلام النبلاء للذهبي ⁦(ج 17، ص 591-592)⁩ على إسلام ويب، وهي بحسب الملخص البحثي تذكر اسمه الكامل ووفاته في المحرم سنة 437هـ. ذُكرت هذه الصفحة في ملخص بحثي قُدّم إلى المتحف وأجاز المؤسس استعماله في 21 نوفمبر 2026؛ ولم يفتح المتحف الصفحة نفسها."
  en: "The entry on Makki in al-Dhahabi's Siyar A'lam al-Nubala' (vol. 17, pp. 591-592) on Islamweb, which, according to the research summary, gives his full name and his death in Muharram 437 AH. The page was named in a research summary supplied to the museum and approved for use by the founder on 21 November 2026; the museum did not open it."
