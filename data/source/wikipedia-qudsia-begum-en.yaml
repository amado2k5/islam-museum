summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن قدسية بيكم، نواب بوبال (1801–1881)؛ تُستخدم لوقائع الكيان فقط. تروي زواجها من نضر محمد خان سنة 1817 وخلافتها إياه سنة 1819 وتنازلها سنة 1837 لصالح ابنتها سكندر بيكم وزوج ابنتها."
  en: "English Wikipedia article on Qudsia Begum, Nawab of Bhopal (1801–1881); used for entity facts only. It recounts her marriage to Nazar Mohammad Khan in 1817, her succession of her husband in 1819, and her abdication in 1837 in favour of her daughter Sikandar Begum and her son-in-law."
  es: "Artículo de la Wikipedia en inglés sobre Qudsia Begum, Nawab de Bhopal (1801-1881); utilizado únicamente para datos sobre la persona. Relata su matrimonio con Nazar Mohammad Khan en 1817, la sucesión de su esposo en 1819 y su abdicación en 1837 en favor de su hija Sikandar Begum y su yerno."
  fr: "Article de Wikipédia en anglais sur Qudsia Begum, Nawab de Bhopal (1801-1881); utilisé uniquement à des fins d’information sur l’entité. Il relate son mariage avec Nazar Mohammad Khan en 1817, l’accession au trône de son époux en 1819 et son abdication en 1837 en faveur de sa fille Sikandar Begum et de son gendre."
  ur: "قدسیہ بیگم، نواب آف بھوپال (1801–1881) پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1817 میں نظر محمد خان سے اس کی شادی، 1819 میں اس کے شوہر کی جانشینی اور 1837 میں اس کی بیٹی سکندر بیگم اور اس کے داماد کے حق میں اس کی دستبرداری کا ذکر ہے۔"
  tr: "Bhopal Nawabı Bekum'un kutsallığı hakkında İngilizce Wikipedia makalesi (1801–1881); yalnızca varlığın gerçekleri için kullanılmıştır. 1817'de Nazar Muhammad Khan ile evliliğini, 1819'da ona tahta geçişini ve 1837'de kızı Sikandar Bek ile kızının eşi lehine tahttan çekilmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang kesucian Bekum, Nawab Bhopal (1801–1881); hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan pernikahannya dengan Nazar Muhammad Khan pada tahun 1817, suksesinya pada tahun 1819, dan pengunduran dirinya pada tahun 1837 demi putrinya Sikandar Bek dan suami putrinya."
