  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرزاق قرنح ⁦(ولد 20 كانون الأول 1948 في سلطنة زنجبار)⁩، الروائي والأكاديمي التنزاني من أصل يمني الحائز على جائزة نوبل في الأدب سنة 2021؛ تعرض نشأته في زنجبار ولجوءه إلى بريطانيا ورواياته من «الجنة» إلى «السرقة» وأستاذيته في جامعة كينت ثم جامعة نيويورك أبو ظبي منذ 2024."
  en: "English Wikipedia article on Abdulrazak Gurnah (born 20 December 1948 in the Sultanate of Zanzibar), the Tanzanian novelist and academic of Yemeni origin who won the Nobel Prize in Literature in 2021; it covers his Zanzibar childhood, his flight to Britain as a refugee, his novels from Paradise to Theft, and his professorships at the University of Kent and, from 2024, New York University Abu Dhabi."
