summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرزاق قرنح ⁦(ولد 20 كانون الأول 1948 في سلطنة زنجبار)⁩، الروائي والأكاديمي التنزاني من أصل يمني الحائز على جائزة نوبل في الأدب سنة 2021؛ تعرض نشأته في زنجبار ولجوءه إلى بريطانيا ورواياته من «الجنة» إلى «السرقة» وأستاذيته في جامعة كينت ثم جامعة نيويورك أبو ظبي منذ 2024."
  en: "English Wikipedia article on Abdulrazak Gurnah (born 20 December 1948 in the Sultanate of Zanzibar), the Tanzanian novelist and academic of Yemeni origin who won the Nobel Prize in Literature in 2021; it covers his Zanzibar childhood, his flight to Britain as a refugee, his novels from Paradise to Theft, and his professorships at the University of Kent and, from 2024, New York University Abu Dhabi."
  es: "Artículo de la Wikipedia en inglés sobre Abdulrazak Gurnah (nacido el 20 de diciembre de 1948 en el Sultanato de Zanzíbar), novelista y académico tanzano de origen yemení que ganó el Premio Nobel de Literatura en 2021; abarca su infancia en Zanzíbar, su huida a Gran Bretaña como refugiado, sus novelas desde Paradise hasta Theft, y sus cátedras en la Universidad de Kent y, a partir de 2024, en la Universidad de Nueva York en Abu Dabi."
  fr: "Article de Wikipédia en anglais sur Abdulrazak Gurnah (né le 20 décembre 1948 dans le sultanat de Zanzibar), romancier et universitaire tanzanien d'origine yéménite, lauréat du prix Nobel de littérature en 2021; il retrace son enfance à Zanzibar, sa fuite vers la Grande-Bretagne en tant que réfugié, ses romans de Paradise à Theft, et ses postes de professeur à l'université du Kent et, à partir de 2024, à l'université de New York à Abou Dhabi."
