  ur: "صفحہ «مجمع اللغة العربية بدمشق» (Wikipedia (Arabic))؛ عجائب گھر نے اسے نہیں کھولا، یہ اس کو فراہم کردہ تحقیقی فائل میں بانی کی 21 نومبر 2026ء کی منظوری سے خلاصہ شدہ ہے، اور صرف ادارے کے حقائق کے لیے استعمال ہوتا ہے۔"
