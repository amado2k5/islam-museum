summary:
  ar: "مقالة ويكيبيديا العربية عن كلارا محمد: زوجة إلايجا محمد الأولى، وأم ثمانية من أبنائه منهم وارث الدين محمد، وفضلها في تعريف زوجها بتعاليم فارد، وقيادتها المنظمة أثناء غيابه من 1935 إلى 1946."
  en: "The Arabic Wikipedia article on Clara Muhammad: first wife of Elijah Muhammad and mother of eight of his children including Warith Deen Mohammed, credited with introducing her husband to Fard's teachings and with leading the organisation during his absence from 1935 to 1946."
  es: "El artículo de la Wikipedia en árabe sobre Clara Muhammad: primera esposa de Elijah Muhammad y madre de ocho de sus hijos, entre ellos Warith Deen Mohammed, a quien se le atribuye haber introducido a su marido en las enseñanzas de Fard y haber dirigido la organización durante su ausencia, de 1935 a 1946."
  fr: "L'article de Wikipédia en arabe sur Clara Muhammad: première épouse d'Elijah Muhammad et mère de huit de ses enfants, dont Warith Deen Mohammed, à qui l'on attribue le mérite d'avoir initié son mari aux enseignements du Fard et d'avoir dirigé l'organisation pendant son absence de 1935 à 1946."
  ur: "کلارا محمد پر عربی ویکیپیڈیا کا مضمون: ایلیاہ محمد کی پہلی بیوی اور وارث دین محمد سمیت ان کے آٹھ بچوں کی ماں، نے اپنے شوہر کو فرد کی تعلیمات سے متعارف کرانے اور 1935 سے 1946 تک اپنی غیر موجودگی کے دوران تنظیم کی قیادت کرنے کا سہرا دیا۔"
