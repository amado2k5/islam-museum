summary:
  ar: "مدخل «عاشق» في موسوعة TDV الإسلامية: شاعر الساز الذي يعزف ويغني شعره أو شعر غيره ويروي الحكايات الشعبية، ونشأة التسمية، وحياة الترحال، وطقس شرب الباده، وسنوات الصنع لدى الأستاذ، وفصول الأداء الاثني عشر، وأصناف العاشقين، وانحسار المهنة منذ أواخر عهد السلطان عبد العزيز."
  en: "The TDV İslâm Ansiklopedisi entry on the âşık: the saz-poet who plays and sings his own or others' verse and tells folk tales; the name's fifteenth-century rise, the itinerant life, the bâde-drinking vocation dream, the long apprenticeship under a master and the granting of a mahlas, the twelve-part âşık fasıl, the classes of âşıks, and the craft's decline from the late reign of Sultan Abdülaziz."
  ur: "TDV اسلام انسائیکلوپیڈیا کا «عاشق» مدخل: ساز شاعر جو اپنی یا دوسروں کی شاعری ساز کے ساتھ گاتا اور لوک کہانیاں سناتا ہے؛ نام کا پندرہویں صدی کا آغاز، خانہ بدوش طرزِ حیات، بادہ پینے کا خواب، استاد کے ہاں طویل چاقری اور مخلص کا عطا، بارہ حصوں والا عاشق فصل، عاشقوں کے درجات، اور سلطان عبدالعزیز کے آخری عہد سے پیشے کا زوال۔"
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el âşık: el poeta saz que toca y canta sus propios versos o los de otros y cuenta cuentos populares; el auge del nombre en el siglo XV, la vida itinerante, el sueño de la vocación de beber bâde, el largo aprendizaje bajo un maestro y la concesión de un mahlas, el âşık fasıl de doce partes, las clases de âşıks y el declive del oficio desde finales del reinado del sultán Abdülaziz."
  fr: "L'entrée de TDV İslâm Ansiklopedisi sur l'âşık: le poète saz qui joue et chante ses propres vers ou ceux d'autres personnes et raconte des contes populaires; l'essor du nom au XVe siècle, la vie itinérante, le rêve de vocation lié à la consommation de bâde, le long apprentissage auprès d'un maître et l'octroi d'un mahlas, le fasıl en douze parties de l'âşık, les classes d'âşıks et le déclin de ce métier à partir de la fin du règne du sultan Abdülaziz."
  tr: "TDV İslami Ansiklopedisi'nde 'Ashiq' adı geçiyor: kendi veya başkalarının şiirlerini çalıp söyleyen, halk hikayelerini, ismin kökenini, seyahat hayatını, badeh içme ritüelini, usta için yapıldığı yılları, on iki performans perdesini, aşıkların türlerini ve Sultan Abdulaziz'in son saltanatından bu yana mesleğin gerilemesini anlatan saz şairi."
  id: "Entri 'Ashiq' dalam Ensiklopedia Islam TDV: penyair saz yang memainkan dan menyanyikan puisi miliknya atau orang lain, menceritakan cerita rakyat, asal-usul nama, kehidupan perjalanan, ritual minum badeh, tahun-tahun membuatnya untuk sang maestro, dua belas tindakan pertunjukan, jenis-jenis kekasih, dan kemunduran profesi sejak akhir pemerintahan Sultan Abdulaziz."
