label: { en: "Prominent Salafi cleric dismissed on charges of sexually harassing students — The Amargi news report (July 2026)" }
summary:
  ar: "تقرير إخباري في «ذا أمارغي» عن الفصل النهائي لعبداللطيف أحمد مصطفى من منصبه الأكاديمي في كلية العلوم الإسلامية بجامعة السليماني بقرار وزاري مؤرخ في 1 يوليو 2026، عقب تحقيق رسمي في ادعاءات تحرش جنسي؛ مع نفيه الادعاءات وادعائه أن التسجيلات مفبركة بالذكاء الاصطناعي."
  en: "The Amargi's news report of the permanent dismissal of Abdullatif Ahmad Mustafa from his academic post at the University of Sulaimani's College of Islamic Sciences by ministerial order of 1 July 2026, following an official investigation into sexual-harassment allegations; with his denial of the allegations and his claim that the recordings were fabricated using artificial intelligence."
  ur: "عبداللطیف احمد مصطفیٰ کی سلیمانیہ یونیورسٹی کے کالج آف اسلامک سائنسز کے تعلیمی عہدے سے یکم جولائی 2026ء کے وزارتی حکم کے ذریعے مستقل برطرفی پر «دی امارگی» کی خبر، جو جنسی ہراسانی کے الزامات کی سرکاری تحقیقات کے بعد ہوئی؛ اس میں ان کی جانب سے الزامات کی تردید اور یہ دعویٰ بھی شامل ہے کہ ریکارڈنگز مصنوعی ذہانت سے من گھڑت ہیں۔"
  es: "El medio Amargi informa sobre el despido definitivo de Abdullatif Ahmad Mustafa de su puesto académico en la Facultad de Ciencias Islámicas de la Universidad de Sulaimani mediante decreto ministerial del 1 de julio de 2026, tras una investigación oficial sobre acusaciones de acoso sexual; con su negación de las acusaciones y su afirmación de que las grabaciones fueron fabricadas mediante inteligencia artificial."
  fr: "L'article d'Amargi relate le licenciement définitif d'Abdullatif Ahmad Mustafa de son poste universitaire au Collège des sciences islamiques de l'Université de Sulaimani par arrêté ministériel du 1er juillet 2026, suite à une enquête officielle sur des allégations de harcèlement sexuel; avec son déni des allégations et son affirmation que les enregistrements avaient été fabriqués à l'aide d'intelligence artificielle."
  tr: "'The Amargy'de yayımlanan bir haber, Abdul Latif Ahmed Mustafa'nın 1 Temmuz 2026 tarihli bakanlık kararıyla cinsel taciz iddialarına ilişkin resmi soruşturma sonrasında, Süleymani Üniversitesi İslam Bilimleri Fakültesi'ndeki akademik görevinden nihai olarak görevden alınmasıyla ilgili bir haber; iddiaların reddedilmesi ve kayıtların yapay zeka tarafından uydurulduğu iddiasıyla ilgili."
  id: "Sebuah laporan berita di 'The Amargy' tentang pemecatan akhir Abdul Latif Ahmed Mustafa dari posisi akademisnya di Fakultas Ilmu Islam Universitas Sulaimani melalui keputusan menteri tertanggal 1 Juli 2026, setelah penyelidikan resmi atas tuduhan pelecehan seksual; dengan penyangkalan tuduhan tersebut dan klaimnya bahwa rekaman tersebut dipalsukan oleh kecerdasan buatan."
