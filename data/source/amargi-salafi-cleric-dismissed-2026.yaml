reliability_note: "A news report from the same outlet as the long-form profile (source/amargi-abdullatif-salafi-profile-2026): the two are one outlet, so this report is NOT counted as an independent text for the faith settlement, even though it also identifies him in prose ('He is generally considered one of the main Sheikh of the Salafists in the Kurdistan Region who are more or less affiliated with the Saudi Wahhabi school of Islam'). Facts taken from it: the investigation began after audio recordings and private messages circulated on Kurdish social media in June 2026; the University of Sulaimani announced its investigative committee on 18 June 2026; Minister Aram Qadir's order of Wednesday 1 July 2026 permanently dismissed him; he had 30 days to appeal; the report states plainly that 'the dismissal is therefore an administrative sanction and does not amount to a criminal conviction. No court ruling concerning the allegations has been announced', and that the order 'does not prevent him from preaching at his mosque'. It also records his denial ('fabricated using artificial intelligence') and that in 2016 recordings of private conversations between him and one of his female students were made public. Read in full on 9 November 2026."
