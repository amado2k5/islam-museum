  ar: "تقرير إخباري في «ذا أمارغي» عن الفصل النهائي لعبداللطيف أحمد مصطفى من منصبه الأكاديمي في كلية العلوم الإسلامية بجامعة السليماني بقرار وزاري مؤرخ في 1 يوليو 2026، عقب تحقيق رسمي في ادعاءات تحرش جنسي؛ مع نفيه الادعاءات وادعائه أن التسجيلات مفبركة بالذكاء الاصطناعي."
  en: "The Amargi's news report of the permanent dismissal of Abdullatif Ahmad Mustafa from his academic post at the University of Sulaimani's College of Islamic Sciences by ministerial order of 1 July 2026, following an official investigation into sexual-harassment allegations; with his denial of the allegations and his claim that the recordings were fabricated using artificial intelligence."
