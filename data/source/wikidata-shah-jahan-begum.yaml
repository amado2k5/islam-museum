summary:
  ar: "عنصر ويكيداتا Q2364796 لشاه جهان بيكم؛ يعطي مولدها في 29 تموز 1838 ووفاتها في 16 حزيران 1901، ووالدتها سكندر بيكم وابنتها سلطان جهان وزوجها صديق حسن خان، ويسجل دينها الإسلام (Q432) فقط."
  en: "Wikidata item Q2364796 for Shah Jahan Begum; it gives her birth on 29 July 1838 and death on 16 June 1901, her mother as Sikandar Begum, her child as Sultan Jahan and a spouse as Siddiq Hasan Khan, and records her religion as Islam (Q432) only."
  es: "Elemento de Wikidata Q2364796 para Shah Jahan Begum; indica que nació el 29 de julio de 1838 y murió el 16 de junio de 1901, su madre fue Sikandar Begum, su hijo fue Sultan Jahan y su esposo fue Siddiq Hasan Khan, y registra su religión como Islam (Q432) solamente."
  fr: "L'élément Wikidata Q2364796 pour Shah Jahan Begum; il indique sa naissance le 29 juillet 1838 et sa mort le 16 juin 1901, sa mère comme Sikandar Begum, son enfant comme Sultan Jahan et son époux comme Siddiq Hasan Khan, et enregistre sa religion comme l'Islam (Q432) seulement."
  ur: "شاہ جہاں بیگم کے لیے ویکی ڈیٹا آئٹم Q2364796؛ اس کی پیدائش 29 جولائی 1838 اور موت 16 جون 1901 کو ہوئی، اس کی ماں سکندر بیگم، اس کے بچے کو سلطان جہاں اور ایک شریک حیات صدیق حسن خان کے طور پر، اور اس کا مذہب صرف اسلام (Q432) کے طور پر درج ہے۔"
