  ar: "مقالة ويكيبيديا الإنجليزية عن ألف شفق ⁦(وُلدت في ٢٥ تشرين الأول ١٩٧١ في ستراسبورغ)⁩، الروائية التركية البريطانية وعالمة السياسة، مؤلفة «قواعد العشق الأربعون» و«لقيطة إسطنبول»؛ تذكر نشأتها ومناصبها الأكاديمية ومحاكمتها وتبرئتها في تركيا والتصوف موضوعًا في رواياتها، دون أن تثبت انتماءً دينيًا لشفق نفسها."
  en: "English Wikipedia article on Elif Shafak (born 25 October 1971 in Strasbourg), Turkish-British novelist and political scientist, author of The Forty Rules of Love, The Bastard of Istanbul and There Are Rivers in the Sky; it records her upbringing, her academic posts, her prosecution and acquittal in Turkey, and Sufism as a theme of her fiction, without attesting a religious affiliation for Shafak herself."
