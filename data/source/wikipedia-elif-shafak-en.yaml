summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألف شفق ⁦(وُلدت في ٢٥ تشرين الأول ١٩٧١ في ستراسبورغ)⁩، الروائية التركية البريطانية وعالمة السياسة، مؤلفة «قواعد العشق الأربعون» و«لقيطة إسطنبول»؛ تذكر نشأتها ومناصبها الأكاديمية ومحاكمتها وتبرئتها في تركيا والتصوف موضوعًا في رواياتها، دون أن تثبت انتماءً دينيًا لشفق نفسها."
  en: "English Wikipedia article on Elif Shafak (born 25 October 1971 in Strasbourg), Turkish-British novelist and political scientist, author of The Forty Rules of Love, The Bastard of Istanbul and There Are Rivers in the Sky; it records her upbringing, her academic posts, her prosecution and acquittal in Turkey, and Sufism as a theme of her fiction, without attesting a religious affiliation for Shafak herself."
  es: "Artículo de la Wikipedia en inglés sobre Elif Shafak (nacida el 25 de octubre de 1971 en Estrasburgo), novelista y politóloga turco-británica, autora de *Las cuarenta reglas del amor*, *El bastardo de Estambul* y *Hay ríos en el cielo*; en él se narra su infancia, sus cargos académicos, su procesamiento y absolución en Turquía, y el sufismo como tema recurrente en su obra de ficción, sin que se mencione ninguna afiliación religiosa por parte de la propia Shafak."
  fr: "L'article de Wikipédia en anglais sur Elif Shafak (née le 25 octobre 1971 à Strasbourg), romancière et politologue turco-britannique, auteure de « Les Quarante Règles de l'amour », « La Bâtarde d'Istanbul » et « Il y a des rivières dans le ciel », relate son enfance, ses postes universitaires, ses poursuites et son acquittement en Turquie, ainsi que le soufisme comme thème de son œuvre, sans toutefois attester d'une appartenance religieuse pour Shafak elle-même."
  ur: "ایلیف شفاک ⁦(25 اکتوبر 1971 کو اسٹراسبرگ میں پیدا ہوا)⁩ پر انگریزی ویکیپیڈیا کا مضمون، ترک-برطانوی ناول نگار اور سیاسی سائنس دان، The Forty Rules of Love، The Bastard of Istanbul and There are Rivers in the Sky; اس میں اس کی پرورش، اس کی علمی پوسٹس، ترکی میں اس کا مقدمہ چلانے اور بری ہونے اور تصوف کو اس کے افسانوں کے موضوع کے طور پر، شفق کے لیے مذہبی وابستگی کی تصدیق کیے بغیر ریکارڈ کیا گیا ہے۔"
