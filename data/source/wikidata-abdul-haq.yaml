summary:
  ar: "عنصر ويكيداتا Q2993002 لمولوي عبد الحق: يذكر ولادته في 20 أبريل 1870 ⁦(ومعه قيمة سنوية فقط لسنة 1869)⁩ ووفاته في 16 أغسطس 1961 في كراتشي، وقيمة دينه «الإسلام» فقط دون مذهب."
  en: "Wikidata item Q2993002 for Maulvi Abdul Haq: it gives his birth on 20 April 1870 (with a redundant year-only value of 1869 alongside), his death on 16 August 1961 at Karachi, and a religion value of Islam only, with no school."
  es: "El elemento de Wikidata Q2993002 para Maulvi Abdul Haq indica que nació el 20 de abril de 1870 (con un valor redundante de solo año de 1869 al lado), murió el 16 de agosto de 1961 en Karachi y profesa únicamente el Islam, sin mencionar ninguna escuela."
  fr: "L'élément Wikidata Q2993002 pour Maulvi Abdul Haq: il indique sa naissance le 20 avril 1870 (avec une valeur redondante de 1869 à côté), sa mort le 16 août 1961 à Karachi et une valeur de religion uniquement l'Islam, sans école."
  ur: "مولوی عبدالحق کے لیے ویکی ڈیٹا آئٹم Q2993002: یہ ان کی پیدائش 20 اپریل 1870 کو ⁦(ایک بے کار سال کی قیمت کے ساتھ 1869 کے ساتھ)⁩، کراچی میں 16 اگست 1961 کو ان کی موت، اور صرف اسلام کی ایک مذہبی قدر، جس میں کوئی اسکول نہیں ہے۔"
  tr: "Wikidata öğesi Q2993002 Mawlawi Abdul Haq: doğumunu 20 Nisan 1870'te (yıllık değeri sadece 1869 için belirtir) ve 16 Ağustos 1961'de Karaçi'de öldüğünü belirtir; dini ise sadece 'İslam'dır, herhangi bir mezhep yoktur."
  id: "Elemen Wikidata Q2993002 Mawlawi Abdul Haq: menyebutkan kelahirannya pada 20 April 1870 (dengan nilai tahunan hanya untuk tahun 1869) dan kematiannya pada 16 Agustus 1961 di Karachi, dan agamanya hanya 'Islam' tanpa sekte apapun."
