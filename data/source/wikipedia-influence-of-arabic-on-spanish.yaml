summary:
  ar: 'صفحة «Influence of Arabic on Spanish» على Wikipedia (English)، ملخَّصة في ملف بحثي قُدّم إلى المتحف ولم يفتحها المتحف؛ تُستعمل لـنسبة الكلمات العربية في الإسبانية: نحو 1000 جذر و3000 كلمة مشتقة، أي نحو 4000 كلمة أو 8% من القاموس. أجاز المؤسس استعمال الملخص في 21 نوفمبر 2026 دون إعادة تحقق.'
  en: 'The page "Influence of Arabic on Spanish" on Wikipedia (English), summarised in a research file supplied to the museum and not opened by the museum; used for the Spanish share of Arabic words: about 1,000 roots and 3,000 derived words, around 4,000 words or 8% of the dictionary. The founder approved using the summary on 21 November 2026 without re-verification.'
  ur: 'Wikipedia (English) پر صفحہ «Influence of Arabic on Spanish»، جو عجائب گھر کو فراہم کردہ تحقیقی فائل میں خلاصہ کیا گیا اور عجائب گھر نے نہیں کھولا؛ اس کے لیے استعمال ہوا: ہسپانوی میں عربی الفاظ کا تناسب: تقریباً 1,000 مادّے اور 3,000 مشتق الفاظ، یعنی تقریباً 4,000 الفاظ یا لغت کا 8 فیصد۔ بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔'
  fr: 'La page « Influence of Arabic on Spanish » sur Wikipedia (English), résumée dans un fichier de recherche remis au musée et non ouverte par le musée ; utilisée pour la part des mots arabes en espagnol : environ 1 000 racines et 3 000 mots dérivés, soit près de 4 000 mots ou 8 % du dictionnaire. Le fondateur a approuvé l''usage du résumé le 21 novembre 2026 sans nouvelle vérification.'
  es: 'La página «Influence of Arabic on Spanish» en Wikipedia (English), resumida en un archivo de investigación entregado al museo y no abierta por el museo; usada para la parte de palabras árabes en español: unas 1.000 raíces y 3.000 palabras derivadas, en torno a 4.000 palabras o el 8 % del diccionario. El fundador aprobó el uso del resumen el 21 de noviembre de 2026 sin nueva verificación.'
