summary:
  ar: "مقالہ ویکیپیڈیا اردو مضمون سردار عبدالرب نشتر ⁦(1899ء–1958ء)⁩ کے بارے میں؛ پیدائش 13 جون 1899ء پشاور اور وفات 14 فروری 1958ء کراچی دیتا ہے، پنجاب کی گورنری ⁦(1949ء–1951ء)⁩ درج کرتا ہے؛ اس کے خانہ معلومات میں مذہب کا خانہ خالی ہے اور متن میں کوئی مسلک نہیں ملتا۔"
  en: "The Urdu Wikipedia article on Sardar Abdur Rab Nishtar (1899–1958); it gives his birth on 13 June 1899 at Peshawar and his death on 14 February 1958 at Karachi, and records his governorship of Punjab (1949–1951); its infobox religion field is empty and its text names no school for him."
  es: "El artículo de Wikipedia en urdu sobre Sardar Abdur Rab Nishtar (1899-1958) indica que nació el 13 de junio de 1899 en Peshawar y falleció el 14 de febrero de 1958 en Karachi, y registra su mandato como gobernador de Punjab (1949-1951). El campo de religión de su ficha informativa está vacío y el texto no menciona ninguna escuela a la que haya asistido."
  fr: "L'article de Wikipédia en ourdou sur Sardar Abdur Rab Nishtar (1899-1958); il indique sa naissance le 13 juin 1899 à Peshawar et sa mort le 14 février 1958 à Karachi, et mentionne son mandat de gouverneur du Pendjab (1949-1951); son champ religion dans l'infobox est vide et son texte ne mentionne aucune école pour lui."
  ur: "سردار عبدالرب نشتر (1899-1958) پر اردو ویکیپیڈیا کا مضمون؛ یہ 13 جون 1899 کو پشاور میں ان کی پیدائش اور 14 فروری 1958 کو کراچی میں ان کی موت، اور پنجاب کی گورنر شپ (1949-1951) کو ریکارڈ کرتا ہے۔ اس کا انفو باکس مذہب کا میدان خالی ہے اور اس کے متن میں اس کے لیے کوئی اسکول نہیں ہے۔"
