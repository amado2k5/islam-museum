  en: "Abu 'Abd al-Rahman al-Sulami, Tabaqat al-Sufiyya, ed. Nur al-Din Shurayba (Maktabat al-Khanji, Cairo, 3rd ed., 1406 AH / 1986)"
  ur: "ابو عبد الرحمن سلمی، طبقات الصوفیہ، تحقیق نور الدین شریبہ (مکتبۃ الخانجی، قاہرہ، تیسرا ایڈیشن 1406ھ/1986ء)"
summary:
  ar: "الطبعة الثالثة من «طبقات الصوفية» للسلمي ⁦(ت 412هـ)⁩ بتحقيق نور الدين شريبة من علماء الأزهر، نشرتها مكتبة الخانجي بالقاهرة سنة 1406هـ/1986م، وفي صدرها «تصدير» طويل للمحقق في عصر السلمي وسيرته ومؤلفاته وموقف العلماء منه ومصادر الكتاب ونسخه."
  en: "The third edition of al-Sulami's (d. 412 AH) Tabaqat al-Sufiyya edited by Nur al-Din Shurayba of al-Azhar, published by Maktabat al-Khanji in Cairo in 1406 AH / 1986, opening with the editor's long introduction on al-Sulami's age, life, works, the scholars' views of him, and the book's sources and manuscripts."
  ur: "سلمی (م 412ھ) کی «طبقات الصوفیہ» کا تیسرا ایڈیشن، تحقیق نور الدین شریبہ (علمائے ازہر میں سے)، مکتبۃ الخانجی قاہرہ نے 1406ھ/1986ء میں شائع کیا، جس کے آغاز میں محقق کا طویل «تصدیر» ہے: سلمی کا زمانہ، سیرت، تصانیف، ان کے بارے میں علما کا موقف، اور کتاب کے مصادر و نسخے۔"
