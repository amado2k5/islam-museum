summary:
  ar: "مقالة ويكيبيديا الهولندية عن عمر دونغل أوغلو؛ تُستخدم لوقائع الكيان فقط. تفصّل ميلاده في 1 يونيو 1968 في زيله، ودراسته في جامعة سقاريا، وعمله إمامًا وخطيبًا في طوكات بين 1986 و1996، ووفاته بكوفيد-19 في 3 مايو 2020."
  en: "Dutch Wikipedia article on Ömer Döngeloğlu; used for entity facts only. It details his birth on 1 June 1968 in Zile, his studies at Sakarya University, his work as an imam-hatip in Tokat between 1986 and 1996, and his death from COVID-19 on 3 May 2020."
  es: "Artículo de la Wikipedia en neerlandés sobre Ömer Döngeloğlu; utilizado únicamente para datos biográficos. Detalla su nacimiento el 1 de junio de 1968 en Zile, sus estudios en la Universidad de Sakarya, su labor como imán en Tokat entre 1986 y 1996, y su fallecimiento por COVID-19 el 3 de mayo de 2020."
  fr: "Article de Wikipédia en néerlandais sur Ömer Döngeloğlu; utilisé uniquement à des fins d’information sur l’entité. Il détaille sa naissance le 1er juin 1968 à Zile, ses études à l’université de Sakarya, son travail d’imam-hatip à Tokat entre 1986 et 1996, et son décès des suites de la COVID-19 le 3 mai 2020."
  ur: "Ömer Döngeloğlu پر ڈچ ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1 جون 1968 کو زیل میں اس کی پیدائش، ساکریا یونیورسٹی میں اس کی تعلیم، 1986 اور 1996 کے درمیان ٹوکاٹ میں بطور امام خطیب کے کام اور 3 مئی 2020 کو COVID-19 سے ان کی موت کی تفصیلات درج ہیں۔"
  tr: "Omar Dongluoğlu hakkında Hollanda Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1 Haziran 1968'de Zile'de doğdu, Sakarya Üniversitesi'nde eğitim gördü, 1986-1996 yılları arasında Tok'ta imam ve vaiz olarak çalıştı ve 3 Mayıs 2020'de COVID-19'dan hayatını kaybetti."
  id: "Artikel Wikipedia Belanda tentang Omar Dongluoglu; digunakan hanya untuk fakta entitas. Ia lahir pada 1 Juni 1968 di Zile, belajar di Universitas Sakarya, bekerja sebagai imam dan penceramah di Tokat antara tahun 1986 dan 1996, dan meninggal karena COVID-19 pada 3 Mei 2020."
