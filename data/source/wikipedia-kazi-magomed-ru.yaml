summary:
  ar: "مقالة ويكيبيديا الروسية عن ابن الإمام شامل؛ تُستخدم لوقائع الكيان فقط. توثق صيغ اسمه ⁦(ومنها قاضي محمد وقاضي ماغوما)⁩، ومولده سنة 1833 في غيمري ووفاته سنة 1902 في المدينة؛ وصندوق معلوماتها العسكري لا يحمل حقلًا للدين."
  en: "Russian Wikipedia article on Imam Shamil's son; used for entity facts only. It documents his name variants (including Kazi-Muhammad and Kazi-Magoma), his birth in 1833 at Gimry and his death in 1902 at Medina; its military infobox carries no religion field."
  es: "Artículo de la Wikipedia rusa sobre el hijo del imán Shamil; se utiliza únicamente para obtener información sobre la persona. Documenta las variantes de su nombre (incluidas Kazi-Muhammad y Kazi-Magoma), su nacimiento en 1833 en Gimry y su muerte en 1902 en Medina; su ficha informativa militar no incluye el campo de religión."
  fr: "Article de Wikipédia en russe sur le fils de l'imam Chamil; utilisé uniquement pour les informations le concernant. Il mentionne les variantes de son nom (dont Kazi-Muhammad et Kazi-Magoma), sa naissance en 1833 à Gimry et sa mort en 1902 à Médine; son infobox militaire ne comporte pas de champ sur la religion."
  ur: "امام شامل کے بیٹے پر روسی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کے نام کی مختلف قسمیں ⁦(بشمول کازی محمد اور کازی-مگوما)⁩، اس کی پیدائش 1833 میں جمری میں اور ان کی وفات 1902 میں مدینہ میں ہے۔ اس کے ملٹری انفو باکس میں کوئی مذہب نہیں ہے۔"
  tr: "İmam Şamil'in oğlu hakkında Rusça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. İsmin (Kadi Muhammed ve Kaddi Magoma dahil) versiyonları belgelenmiştir; 1833'te Gemeri'de doğduğu ve 1902'de şehirde öldüğü belirtilmiştir; askeri bilgi kutusunda din alanı bulunmamaktadır."
  id: "Artikel Wikipedia Rusia tentang putra Imam Shamil; digunakan hanya untuk fakta entitas. Versi namanya (termasuk Qadi Muhammad dan Qadi Magoma) didokumentasikan, kelahirannya pada tahun 1833 di Gemri dan kematiannya pada tahun 1902 di kota tersebut; kotak informasi militernya tidak memuat bidang agama."
