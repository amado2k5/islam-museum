summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حمزة بك (غمزت بك)؛ تُستخدم لوقائع الكيان فقط. ينصّ متنها صراحة، مرتين، على أنه لم يكن عضوا في الطريقة النقشبندية الخالدية وأنه لم ينضم إليها قط، بخلاف سلفه غازي محمد وخلفه شامل؛ ويعطي مولده سنة 1789 في غوتساتل، وتعليمه في الفقه الشافعي، ووفاته في 1 أكتوبر (19 سبتمبر بالتقويم اليولياني) 1834 في خونزاخ، وأنه خلف غازي محمد في الإمامة فور وفاته."
  en: "English Wikipedia article on Hamzat Bek (Gamzat-bek); used for entity facts only. Its text states expressly, twice, that he was not a member of the Naqshbandiyya-Khalidiyya Sufi order and never joined it, unlike his predecessor Ghazi Muhammad and his successor Shamil; it gives his birth in 1789 at Gotsatl, his education in Shafi'i law, his death on 1 October [O.S. 19 September] 1834 at Khunzakh, and his immediate succession to Ghazi Muhammad as imam."
