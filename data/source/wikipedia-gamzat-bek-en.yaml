summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حمزة بك ⁦(غمزت بك)⁩؛ تُستخدم لوقائع الكيان فقط. ينصّ متنها صراحة، مرتين، على أنه لم يكن عضوا في الطريقة النقشبندية الخالدية وأنه لم ينضم إليها قط، بخلاف سلفه غازي محمد وخلفه شامل؛ ويعطي مولده سنة 1789 في غوتساتل، وتعليمه في الفقه الشافعي، ووفاته في 1 أكتوبر ⁦(19 سبتمبر بالتقويم اليولياني)⁩ 1834 في خونزاخ، وأنه خلف غازي محمد في الإمامة فور وفاته."
  en: "English Wikipedia article on Hamzat Bek (Gamzat-bek); used for entity facts only. Its text states expressly, twice, that he was not a member of the Naqshbandiyya-Khalidiyya Sufi order and never joined it, unlike his predecessor Ghazi Muhammad and his successor Shamil; it gives his birth in 1789 at Gotsatl, his education in Shafi'i law, his death on 1 October [O.S. 19 September] 1834 at Khunzakh, and his immediate succession to Ghazi Muhammad as imam."
  es: "Artículo de la Wikipedia en inglés sobre Hamzat Bek (Gamzat-bek); utilizado únicamente para datos sobre la persona. Su texto afirma expresamente, en dos ocasiones, que no fue miembro de la orden sufí Naqshbandiyya-Khalidiyya y que nunca se unió a ella, a diferencia de su predecesor Ghazi Muhammad y su sucesor Shamil; indica su nacimiento en 1789 en Gotsatl, su educación en derecho shafi'í, su muerte el 1 de octubre [19 de septiembre según el calendario antiguo] de 1834 en Khunzakh, y su sucesión inmediata de Ghazi Muhammad como imán."
  fr: "Article de Wikipédia en anglais sur Hamzat Bek (Gamzat-bek); utilisé uniquement pour les informations sur l'entité. Son texte indique expressément, à deux reprises, qu'il n'était pas membre de l'ordre soufi Naqshbandiyya-Khalidiyya et ne l'a jamais rejoint, contrairement à son prédécesseur Ghazi Muhammad et à son successeur Shamil; il mentionne sa naissance en 1789 à Gotsatl, sa formation en droit chaféite, sa mort le 1er octobre [19 septembre du calendrier julien] 1834 à Khunzakh, et sa succession immédiate de Ghazi Muhammad comme imam."
