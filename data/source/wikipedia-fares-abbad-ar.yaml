summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0639\u0646 \u0627\u0644\u0642\u0627\u0631\u0626 \u0627\u0644\u064a\u0645\u0646\u064a \u0641\u0627\u0631\u0633 \u0639\u0628\u0627\u062f\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a 11 \u0623\u0628\u0631\u064a\u0644 1980\u060c \u0648\u062a\u062e\u0631\u062c\u0647 \u0641\u064a \u062d\u0644\u0642\u0627\u062a \u062c\u0627\u0645\u0639 \u0628\u0644\u0627\u0644 \u0628\u0646 \u0631\u0628\u0627\u062d \u0628\u0635\u0646\u0639\u0627\u0621\u060c \u0648\u0625\u0645\u0627\u0645\u062a\u0647 \u0627\u0644\u062a\u0631\u0627\u0648\u064a\u062d \u0641\u064a\u0647 \u0645\u0646 1994\u060c \u0648\u062a\u0633\u062c\u064a\u0644\u0647 \u0627\u0644\u0645\u0635\u062d\u0641 \u0648\u0646\u0648\u0646\u064a\u0629 \u0627\u0644\u0642\u062d\u0637\u0627\u0646\u064a\u060c \u0648\u0625\u0645\u0627\u0645\u062a\u0647 \u0641\u064a \u0627\u0644\u0638\u0647\u0631\u0627\u0646 \u0645\u0646\u0630 2006\u060c \u0648\u0642\u0631\u0627\u0621\u062a\u0647 \u0641\u064a \u0642\u0646\u0627\u0629 \u0627\u0644\u0645\u062c\u062f\u061b \u0648\u062a\u0646\u0642\u0644 \u0631\u0648\u0627\u064a\u062a\u0647 \u0639\u0646 \u0646\u0641\u0633\u0647\u060c \u0648\u0645\u0631\u0627\u062c\u0639\u0647\u0627 \u0645\u0648\u0642\u0639 \u062a\u0633\u062c\u064a\u0644\u0627\u062a \u0648\u0645\u0646\u062a\u062f\u0649."
  en: "Arabic Wikipedia article on the Yemeni reciter Fares Abbad; entity facts only: birth on 11 April 1980, his schooling in the memorisation circles of the Bilal ibn Rabah Mosque in Sanaa, leading the tarawih there from 1994, recording the complete Qur'an and al-Qahtani's Nuniyya, his imamate in Dhahran from 2006 and his recitation on Al-Majd channel; it quotes his own account and cites a recordings site and a forum."
