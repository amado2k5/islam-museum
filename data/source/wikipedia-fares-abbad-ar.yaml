summary:
  ar: "مقالة ويكيبيديا العربية عن القارئ اليمني فارس عباد؛ لوقائع الكيان فقط: مولده في 11 أبريل 1980، وتخرجه في حلقات جامع بلال بن رباح بصنعاء، وإمامته التراويح فيه من 1994، وتسجيله المصحف ونونية القحطاني، وإمامته في الظهران منذ 2006، وقراءته في قناة المجد؛ وتنقل روايته عن نفسه، ومراجعها موقع تسجيلات ومنتدى."
  en: "Arabic Wikipedia article on the Yemeni reciter Fares Abbad; entity facts only: birth on 11 April 1980, his schooling in the memorisation circles of the Bilal ibn Rabah Mosque in Sanaa, leading the tarawih there from 1994, recording the complete Qur'an and al-Qahtani's Nuniyya, his imamate in Dhahran from 2006 and his recitation on Al-Majd channel; it quotes his own account and cites a recordings site and a forum."
  es: "Artículo en árabe de la Wikipedia sobre el recitador yemení Fares Abbad; solo datos sobre la persona: nacimiento el 11 de abril de 1980, su formación en los círculos de memorización de la mezquita Bilal ibn Rabah en Sanaa, dirección de las oraciones de Tarawih allí desde 1994, grabación del Corán completo y de la Nuniyya de al-Qahtani, su imamato en Dhahran desde 2006 y su recitación en el canal Al-Majd; cita su propio relato y hace referencia a un sitio web de grabaciones y a un foro."
  fr: "Article de Wikipédia en arabe sur le récitant yéménite Fares Abbad; informations uniquement sur l’entité: naissance le 11 avril 1980, sa formation dans les cercles de mémorisation de la mosquée Bilal ibn Rabah à Sanaa, direction des prières de tarawih dans cette mosquée à partir de 1994, enregistrement du Coran complet et de la Nuniyya d’al-Qahtani, son imamat à Dhahran à partir de 2006 et sa récitation sur la chaîne Al-Majd; l’article cite son propre récit et mentionne un site d’enregistrements et un forum."
  ur: "عربی ویکیپیڈیا کا مضمون یمنی قاری فارس آباد پر؛ صرف ہستی کے حقائق: 11 اپریل 1980 کو پیدائش، صنعاء میں بلال بن رباح مسجد کے حافظوں کے حلقوں میں ان کی تعلیم، 1994 سے وہاں تراویح کی امامت، مکمل قرآن اور القحطانی کی نونیہ کی ریکارڈنگ، ظہران میں ان کی امامت اور 2006 سے ان کے چینل کی تلاوت؛ یہ اس کے اپنے اکاؤنٹ کا حوالہ دیتا ہے اور ایک ریکارڈنگ سائٹ اور ایک فورم کا حوالہ دیتا ہے۔"
