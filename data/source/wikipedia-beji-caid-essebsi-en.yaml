summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الباجي قائد السبسي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في سيدي بوسعيد سنة 1926 ومسيرته القانونية والسياسية الطويلة، ورئاسته للوزراء سنة 2011 ثم رئاسته لتونس من 2014 حتى وفاته في المنصب سنة 2019."
  en: "English Wikipedia article on Beji Caid Essebsi; used for entity facts only. It recounts his birth at Sidi Bou Said in 1926, his long legal and political career, his premiership in 2011 and then his presidency of Tunisia from 2014 until his death in office in 2019."
  es: "Artículo de la Wikipedia en inglés sobre Beji Caid Essebsi; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Sidi Bou Said en 1926, su larga trayectoria jurídica y política, su nombramiento como primer ministro en 2011 y, posteriormente, su presidencia de Túnez desde 2014 hasta su fallecimiento en el cargo en 2019."
  fr: "Article de Wikipédia en anglais sur Béji Caïd Essebsi; utilisé uniquement à des fins d’information sur l’entité. Il retrace sa naissance à Sidi Bou Saïd en 1926, sa longue carrière juridique et politique, son poste de Premier ministre en 2011, puis sa présidence de la Tunisie de 2014 jusqu’à son décès en fonction en 2019."
  ur: "Beji Caid Essebsi پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1926 میں سیدی بو سید میں ان کی پیدائش، ان کا طویل قانونی اور سیاسی کیریئر، 2011 میں ان کی وزارت عظمیٰ اور پھر 2014 سے تیونس کی صدارت 2019 میں ان کی موت تک کا ذکر ہے۔"
  tr: "Beji Caid Essebsi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1926'da Sidi Bou Said'deki doğumunu, uzun hukuki ve siyasi kariyerini, 2011'de başbakanlığı ve 2014'ten 2019'daki görev süresindeki ölümüne kadar Tunus başkanlığını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Beji Caid Essebsi; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya di Sidi Bou Said pada tahun 1926, karier hukum dan politiknya yang panjang, masa jabatannya sebagai perdana menteri pada tahun 2011, dan kemudian masa kepresidenannya di Tunisia dari tahun 2014 hingga wafatnya saat menjabat pada tahun 2019."
