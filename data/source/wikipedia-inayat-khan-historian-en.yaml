reliability_note: "Pointer for entity facts only. It identifies the chronicler as Muhammad Tahir, titled Inayat Khan, born 1628, author of the Shahjahannama; its lead gives his death in 1671 while its Later days section says he died in Kashmir in 1666 — an internal rivalry preserved in the person record. It gives his father Zafar Khan and his maternal grandfather Saif Khan, his darogha post and his office in the Imperial Library. It names no school for him. Checked 1 November 2026."
