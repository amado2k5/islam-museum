summary:
  ar: "مقالة ويكيبيديا العربية عن أكبر هاشمي رفسنجاني؛ تُستخدم لوقائع الكيان فقط. يعطي صندوقها ميلاده في بهرمان في 25 آب 1934 ووفاته في طهران في 8 كانون الثاني 2017 وسلفه في الرئاسة علي خامنئي وخلفه محمد خاتمي، وتروي مسيرته في الثورة والبرلمان والحرب والرئاسة. لا ينصّ نصّها على انتماء ديني شخصي له."
  en: "Arabic Wikipedia article on Akbar Hashemi Rafsanjani; used for entity facts only. Its infobox gives his birth at Bahreman on 25 August 1934, his death in Tehran on 8 January 2017, his predecessor as president, Ali Khamenei, and his successor, Mohammad Khatami; it recounts his career in the revolution, parliament, the war and the presidency. Its text makes no statement of his personal religious affiliation."
  es: "Artículo en árabe de la Wikipedia sobre Akbar Hashemi Rafsanjani; se utiliza únicamente para obtener información sobre la persona. Su ficha informativa indica su nacimiento en Bahreman el 25 de agosto de 1934, su fallecimiento en Teherán el 8 de enero de 2017, su predecesor en la presidencia, Ali Khamenei, y su sucesor, Mohammad Khatami; además, relata su trayectoria en la revolución, el parlamento, la guerra y la presidencia. El texto no menciona su afiliación religiosa personal."
  fr: "Article Wikipédia en arabe consacré à Akbar Hashemi Rafsanjani; utilisé uniquement à des fins d'information sur l'entité. Son infobox indique sa naissance à Bahreman le 25 août 1934, son décès à Téhéran le 8 janvier 2017, son prédécesseur à la présidence, Ali Khamenei, et son successeur, Mohammad Khatami; elle retrace son parcours durant la révolution, au Parlement, pendant la guerre et à la présidence. Le texte ne mentionne aucune appartenance religieuse personnelle."
  ur: "اکبر ہاشمی رفسنجانی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی باکس 25 اگست 1934 کو بہریمن میں ان کی پیدائش، 8 جنوری 2017 کو تہران میں ان کی موت، ان کے پیشرو صدر علی خامنہ ای، اور ان کے جانشین محمد خاتمی؛ یہ انقلاب، پارلیمنٹ، جنگ اور صدارت میں ان کے کیریئر کا ذکر کرتا ہے۔ اس کے متن میں اس کی ذاتی مذہبی وابستگی کا کوئی بیان نہیں ہے۔"
  tr: "Ekber Haşimi Rafsancani hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kutusunda 25 Ağustos 1934'te Bahraman'da doğduğu, 8 Ocak 2017'de Tahran'da öldüğü, cumhurbaşkanlığındaki selefi Ali Hamanei ve halefi Muhammed Hatemi yer alır ve devrim, parlamento, savaş ve cumhurbaşkanlığı yolculuğunu anlatır. Metinde kendisiyle ilgili kişisel dini bir aidiyeti açıkça belirtilmez."
  id: "Artikel Wikipedia berbahasa Arab tentang Akbar Hashemi Rafsanjani; digunakan hanya untuk fakta entitas. Kotak tersebut menceritakan kelahirannya di Bahraman pada 25 Agustus 1934, kematiannya di Teheran pada 8 Januari 2017, pendahulunya dalam kepresidenan Ali Khamenei dan penerusnya Mohammad Khatami, serta menceritakan perjalanannya melalui revolusi, parlemen, perang, dan kepresidenan. Teksnya tidak secara eksplisit menyatakan afiliasi agama pribadi kepadanya."
