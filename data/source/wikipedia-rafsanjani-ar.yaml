  ar: "مقالة ويكيبيديا العربية عن أكبر هاشمي رفسنجاني؛ تُستخدم لوقائع الكيان فقط. يعطي صندوقها ميلاده في بهرمان في 25 آب 1934 ووفاته في طهران في 8 كانون الثاني 2017 وسلفه في الرئاسة علي خامنئي وخلفه محمد خاتمي، وتروي مسيرته في الثورة والبرلمان والحرب والرئاسة. لا ينصّ نصّها على انتماء ديني شخصي له."
  en: "Arabic Wikipedia article on Akbar Hashemi Rafsanjani; used for entity facts only. Its infobox gives his birth at Bahreman on 25 August 1934, his death in Tehran on 8 January 2017, his predecessor as president, Ali Khamenei, and his successor, Mohammad Khatami; it recounts his career in the revolution, parliament, the war and the presidency. Its text makes no statement of his personal religious affiliation."
