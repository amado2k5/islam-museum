summary:
  ar: "عنصر ويكي بيانات Q1419231 لفيروز نادري، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته 25 مارس 1946 في شيراز ووفاته 9 يونيو 2023 في لوس أنجلوس ⁦(قيمة مفضلة لمكان الوفاة)⁩، ولا يحمل أي قيمة للدين."
  en: "Wikidata item Q1419231 for Firouz Naderi, grounded through the English article's pageprops; used for entity facts only. It gives his birth as 25 March 1946 at Shiraz and his death as 9 June 2023 with Los Angeles as preferred death place, and carries no religion value at all."
  es: "El elemento de Wikidata Q1419231 para Firouz Naderi, basado en los atributos de la página del artículo en inglés, se utiliza únicamente para datos sobre la entidad. Indica que nació el 25 de marzo de 1946 en Shiraz y falleció el 9 de junio de 2023, con Los Ángeles como lugar de fallecimiento preferido, y no tiene ningún valor religioso."
  fr: "L'élément Wikidata Q1419231 concernant Firouz Naderi, basé sur les propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance le 25 mars 1946 à Shiraz et son décès le 9 juin 2023, Los Angeles étant le lieu de décès privilégié. Aucune information religieuse n'est fournie."
  ur: "فیروز نادری کے لیے ویکی ڈیٹا آئٹم Q1419231، جو انگریزی مضمون کے صفحہ پروپس پر مبنی ہے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 25 مارچ 1946 کو شیراز میں اس کی پیدائش اور اس کی موت 9 جون 2023 کو لاس اینجلس کے ساتھ ترجیحی موت کی جگہ کے طور پر دیتا ہے، اور اس میں مذہب کی کوئی اہمیت نہیں ہے۔"
  tr: "Fairuz Naderi tarafından Q1419231 bir Wikidata öğesi, İngilizce makale sayfası properties aracılığıyla kurulmuştur; yalnızca varlığın gerçekleri için kullanılır. 25 Mart 1946'da Şiraz'da doğdu ve 9 Haziran 2023'te Los Angeles'ta (ölüm yerinin tercih edildiği yer) vefat etti; herhangi bir dini değeri yoktur."
  id: "Item Wikidata Q1419231 oleh Fairuz Naderi, didirikan melalui properti halaman artikel berbahasa Inggris; digunakan hanya untuk fakta entitas. Ia lahir pada 25 Maret 1946 di Shiraz dan meninggal pada 9 Juni 2023 di Los Angeles (tempat kematian yang dipilih), dan tidak memiliki nilai keagamaan."
