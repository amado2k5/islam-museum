  ar: "مقالة ويكيبيديا الإنجليزية عن مبارك أحمد خان؛ تُستخدم لوقائع الكيان فقط. تروي عمله في هيئة الطاقة الذرية البنغلاديشية حتى المدير العام، ومستشارا علميا لمؤسسة مصانع الجوت، واختراعيه «سونالي باغ» و«جوتين»، وجائزة الاستقلال 2024. لا يعطي المقال تاريخ ولادة ولا مكانها (يصنّفه ضمن «سنة الولادة مفقودة») ولا أي محتوى عن دينه."
  en: "English Wikipedia article on Mubarak Ahmad Khan; used for entity facts only. It covers his career at the Bangladesh Atomic Energy Commission up to director general, his role as scientific adviser to the Bangladesh Jute Mills Corporation, his inventions the Sonali Bag and Jutin, and the 2024 Independence Award. The article gives no birth date or place (it files him under 'Year of birth missing' and 'Place of birth missing') and contains no religion content."
