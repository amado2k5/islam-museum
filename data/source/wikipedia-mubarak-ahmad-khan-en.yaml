summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مبارك أحمد خان؛ تُستخدم لوقائع الكيان فقط. تروي عمله في هيئة الطاقة الذرية البنغلاديشية حتى المدير العام، ومستشارا علميا لمؤسسة مصانع الجوت، واختراعيه «سونالي باغ» و«جوتين»، وجائزة الاستقلال 2024. لا يعطي المقال تاريخ ولادة ولا مكانها ⁦(يصنّفه ضمن «سنة الولادة مفقودة»)⁩ ولا أي محتوى عن دينه."
  en: "English Wikipedia article on Mubarak Ahmad Khan; used for entity facts only. It covers his career at the Bangladesh Atomic Energy Commission up to director general, his role as scientific adviser to the Bangladesh Jute Mills Corporation, his inventions the Sonali Bag and Jutin, and the 2024 Independence Award. The article gives no birth date or place (it files him under 'Year of birth missing' and 'Place of birth missing') and contains no religion content."
  es: "Artículo de la Wikipedia en inglés sobre Mubarak Ahmad Khan; utilizado únicamente para datos sobre la persona. Abarca su trayectoria en la Comisión de Energía Atómica de Bangladesh hasta alcanzar el cargo de director general, su papel como asesor científico de la Corporación de Fábricas de Yute de Bangladesh, sus inventos Sonali Bag y Jutin, y el Premio Nobel de la Independencia de 2024. El artículo no proporciona fecha ni lugar de nacimiento (se le clasifica como «Año de nacimiento desconocido» y «Lugar de nacimiento desconocido») y no contiene información sobre religión."
  fr: "Article Wikipédia en anglais sur Mubarak Ahmad Khan; utilisé uniquement à titre informatif. Il retrace son parcours au sein de la Commission de l'énergie atomique du Bangladesh jusqu'à son poste de directeur général, son rôle de conseiller scientifique auprès de la Bangladesh Jute Mills Corporation, ses inventions (le sac Sonali et le jutin) et le prix de l'indépendance qu'il a reçu en 2024. L'article ne mentionne ni date ni lieu de naissance (il est classé dans les catégories « Année de naissance inconnue » et « Lieu de naissance inconnu ») et ne contient aucune information relative à la religion."
