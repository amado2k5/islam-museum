summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن طوني فرنانديز، رجل الأعمال الماليزي مؤسس مجموعة تيون ومشتري طيران آسيا سنة 2001؛ تذكر مولده في 30 نيسان 1964 في كوالالمبور، وأباه الهندي من غوا وأمه من أصول ماليالية وكريستانغية، ودراسته في كلية إبسوم وكلية لندن للاقتصاد، ومسيرته في وارنر ميوزك ثم الطيران."
  en: "English Wikipedia article on Tony Fernandes, the Malaysian entrepreneur who founded the Tune Group and bought AirAsia in 2001; it gives his birth on 30 April 1964 in Kuala Lumpur, his Indian father from Goa and his mother of Malayali and Kristang descent, his schooling at Epsom College and the London School of Economics, and his Warner Music career before aviation."
  es: "Artículo de la Wikipedia en inglés sobre Tony Fernandes, el empresario malasio que fundó Tune Group y compró AirAsia en 2001; en él se menciona su nacimiento el 30 de abril de 1964 en Kuala Lumpur, su padre indio originario de Goa y su madre de ascendencia malayalí y cristiana, su formación académica en Epsom College y la London School of Economics, y su carrera en Warner Music antes de dedicarse a la aviación."
  fr: "L'article de Wikipédia en anglais sur Tony Fernandes, l'entrepreneur malaisien qui a fondé le groupe Tune et racheté AirAsia en 2001, indique sa naissance le 30 avril 1964 à Kuala Lumpur, son père indien originaire de Goa et sa mère d'origine malayali et kristang, sa scolarité à Epsom College et à la London School of Economics, et sa carrière chez Warner Music avant l'aviation."
  ur: "ٹونی فرنینڈس پر انگریزی ویکیپیڈیا کا مضمون، ملائیشیا کے کاروباری شخص جس نے ٹیون گروپ کی بنیاد رکھی اور 2001 میں AirAsia کو خریدا۔ اس کی پیدائش 30 اپریل 1964 کو کوالالمپور میں ہوئی، اس کے ہندوستانی والد گوا سے ہیں اور ان کی والدہ ملیالی اور کرسٹانگ نسل کی ہیں، ایپسم کالج اور لندن اسکول آف اکنامکس میں اس کی اسکولنگ، اور ہوا بازی سے پہلے اس کا وارنر میوزک کیریئر۔"
  tr: "2001'de Tune Group'un kurucusu ve AirAsia'nın alıcısı olan Malezyalı iş insanı Tony Fernandez hakkında İngilizce Wikipedia makalesi; 30 Nisan 1964'te Kuala Lumpur'da doğduğunu, Goa'dan Hintli babası, Malayali ve Hristiyan kökenli annesini, Epsom College ve London School of Economics'teki eğitimini, Warner Music'teki kariyerini ve ardından havacılıktan bahsediyor."
  id: "Artikel Wikipedia berbahasa Inggris tentang Tony Fernandez, pengusaha Malaysia dan pendiri Tune Group serta pembeli AirAsia pada tahun 2001; artikel tersebut menyebutkan kelahirannya pada 30 April 1964 di Kuala Lumpur, ayahnya yang berasal dari India dari Goa, ibunya yang berasal dari Malayali dan Kristen, studinya di Epsom College dan London School of Economics, kariernya di Warner Music dan kemudian penerbangan."
