  ar: "مقالة ويكيبيديا الإنجليزية عن طوني فرنانديز، رجل الأعمال الماليزي مؤسس مجموعة تيون ومشتري طيران آسيا سنة 2001؛ تذكر مولده في 30 نيسان 1964 في كوالالمبور، وأباه الهندي من غوا وأمه من أصول ماليالية وكريستانغية، ودراسته في كلية إبسوم وكلية لندن للاقتصاد، ومسيرته في وارنر ميوزك ثم الطيران."
  en: "English Wikipedia article on Tony Fernandes, the Malaysian entrepreneur who founded the Tune Group and bought AirAsia in 2001; it gives his birth on 30 April 1964 in Kuala Lumpur, his Indian father from Goa and his mother of Malayali and Kristang descent, his schooling at Epsom College and the London School of Economics, and his Warner Music career before aviation."
