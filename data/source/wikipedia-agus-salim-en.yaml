summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أغوس سالم؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده باسم مشود الحق سالم في كوتو غادانغ في 8 تشرين الأول 1884، وعمله في القنصلية الهولندية في جدة، وقيادته في شريكة الإسلام، وعضويته في المجلس الشعبي، ووزارته للخارجية (1947–1949)، ووفاته في جاكرتا في 4 تشرين الثاني 1954 ودفنه في مقبرة أبطال كاليباتا. لا تسمي له مذهبًا."
  en: "English Wikipedia article on Agus Salim; used for entity facts only. It recounts his birth as Masjhoedoelhaq Salim at Koto Gadang on 8 October 1884, his work at the Dutch consulate in Jeddah, his leadership in Sarekat Islam, his Volksraad membership, his terms as foreign minister (1947–1949), and his death in Jakarta on 4 November 1954 with burial at Kalibata Heroes' Cemetery. It names no school of Islam for him."
