summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أغوس سالم؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده باسم مشود الحق سالم في كوتو غادانغ في 8 تشرين الأول 1884، وعمله في القنصلية الهولندية في جدة، وقيادته في شريكة الإسلام، وعضويته في المجلس الشعبي، ووزارته للخارجية (1947–1949)، ووفاته في جاكرتا في 4 تشرين الثاني 1954 ودفنه في مقبرة أبطال كاليباتا. لا تسمي له مذهبًا."
  en: "English Wikipedia article on Agus Salim; used for entity facts only. It recounts his birth as Masjhoedoelhaq Salim at Koto Gadang on 8 October 1884, his work at the Dutch consulate in Jeddah, his leadership in Sarekat Islam, his Volksraad membership, his terms as foreign minister (1947–1949), and his death in Jakarta on 4 November 1954 with burial at Kalibata Heroes' Cemetery. It names no school of Islam for him."
  es: "Artículo de la Wikipedia en inglés sobre Agus Salim; utilizado únicamente para datos sobre la persona. Relata su nacimiento como Masjhoedoelhaq Salim en Koto Gadang el 8 de octubre de 1884, su trabajo en el consulado neerlandés en Yeda, su liderazgo en Sarekat Islam, su pertenencia al Volksraad, sus mandatos como ministro de Asuntos Exteriores (1947-1949) y su fallecimiento en Yakarta el 4 de noviembre de 1954, siendo enterrado en el Cementerio de los Héroes de Kalibata. No menciona ninguna escuela del islam a la que perteneciera."
  fr: "Article de Wikipédia en anglais sur Agus Salim; utilisé uniquement pour les informations biographiques. Il relate sa naissance sous le nom de Masjhoedoelhaq Salim à Koto Gadang le 8 octobre 1884, son travail au consulat néerlandais de Djeddah, son rôle au sein de Sarekat Islam, son appartenance au Volksraad, ses mandats de ministre des Affaires étrangères (1947-1949) et sa mort à Jakarta le 4 novembre 1954, avec inhumation au cimetière des héros de Kalibata. L'article ne mentionne aucune école de l'islam à laquelle il aurait appartenu."
  ur: "اگس سلیم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 8 اکتوبر 1884 کو کوٹو گدانگ میں ان کی پیدائش مسجود الحق سلیم کے طور پر، جدہ میں ڈچ قونصل خانے میں ان کا کام، سراکت اسلام میں ان کی قیادت، ان کی ووکسراڈ کی رکنیت، وزیر خارجہ کے طور پر ان کی شرائط (1947-1949) اور جکارتہ میں ان کی موت 4 نومبر 1954 کو کالیبرو میٹر کے ساتھ 4 نومبر 1954 کو بتائی گئی ہے۔ اس نے اس کے لیے اسلام کے کسی مکتب کا نام نہیں لیا۔"
  tr: "Agus Salem hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 8 Ekim 1884'te Koto Gadang'da Mashad Al-Haq Salem olarak doğumunu, Cidde'deki Hollanda konsolosluğundaki çalışmalarını, Sharikat al-Islam'daki liderliğini, Halk Meclisi üyeliğini, Dışişleri Bakanlığını (1947–1949), 4 Kasım 1954'te Cakarta'daki ölümünü ve Kalipata Kahramanlar Mezarlığı'na defnedilmesini anlatır. Ona bir tarikat demeyin."
  id: "Artikel Wikipedia bahasa Inggris tentang Agus Salem; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya sebagai Mashad Al-Haq Salem di Koto Gadang pada 8 Oktober 1884, pekerjaannya di konsulat Belanda di Jeddah, kepemimpinannya di Sharikat al-Islam, keanggotaannya di Majelis Rakyat, Kementerian Luar Negeri (1947–1949), kematiannya di Jakarta pada 4 November 1954, dan pemakamannya di Pemakaman Pahlawan Kalipata. Jangan menyebutnya sekte."
