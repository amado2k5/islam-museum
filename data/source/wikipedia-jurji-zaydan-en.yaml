reliability_note: "Pointer for entity facts only: a fact is used only where the article cites a source for it (chiefly Thomas Philipp's biography and Marilyn Booth). Read at the recorded revision and checked against it on 26 October 2026. Gives Jurji Zaydan born 14 December 1861 in Beirut and died 21 July 1914 in Cairo; founder of Al-Hilal (1892) and Dar al-Hilal; twenty-three historical novels. On religion it says he was born to an Eastern Orthodox Christian family of limited means, and that in 1910 the Muslim public objected to his Christian origins and secular leanings when he was offered a university chair — both framings concern his origins and family, as the person record's faith note sets out."
