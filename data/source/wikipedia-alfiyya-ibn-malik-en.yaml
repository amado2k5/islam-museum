summary:
  ar: "صفحة «Alfiyya of Ibn Malik» في ويكيبيديا الإنجليزية، وهي الصفحة الموثِّقة التي سماها ملخص بحثي قُدّم إلى المتحف للكتاب «ألفية ابن مالك ⁦(الخلاصة الألفية)⁩»؛ لم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص دون إعادة تحقق في 21 نوفمبر 2026، في موضوع: نسبة الكتاب إلى مؤلفه وتاريخه."
  en: "The page \"Alfiyya of Ibn Malik\" on the English Wikipedia, named by a research summary supplied to the museum as the documenting page for Alfiyya of Ibn Malik (al-Khulasa al-Alfiyya); the museum did not open the page, and the founder approved using the summary without re-verification on 21 November 2026, for the ascription of the work to its author and its date."
  ur: "انگریزی ویکیپیڈیا پر صفحہ «Alfiyya of Ibn Malik»، جسے عجائب گھر کو دیے گئے ایک تحقیقی خلاصے نے «الفیہ ابن مالک ⁦(الخلاصۃ الالفیہ)⁩» کا مستند صفحہ بتایا؛ عجائب گھر نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصے کے استعمال کی منظوری دی، موضوع: کتاب کی مصنف سے نسبت اور اس کی تاریخ۔"
  fr: "La page « Alfiyya of Ibn Malik » de Wikipédia (anglaise), nommée par un résumé de recherche remis au musée comme page documentaire de Alfiyya of Ibn Malik (al-Khulasa al-Alfiyya) ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé sans nouvelle vérification le 21 novembre 2026, pour l'attribution de l'ouvrage à son auteur et sa date."
  es: "La página «Alfiyya of Ibn Malik» de Wikipedia (en inglés), nombrada por un resumen de investigación entregado al museo como página documental de Alfiyya of Ibn Malik (al-Khulasa al-Alfiyya); el museo no abrió la página, y el fundador aprobó usar el resumen sin nueva verificación el 21 de noviembre de 2026, para la atribución de la obra a su autor y su fecha."
