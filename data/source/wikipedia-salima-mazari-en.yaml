  ar: "مقالة ويكيبيديا الإنجليزية عن سليمة مزاري؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في إيران سنة 1980، ودراستها في جامعة طهران، وتعيينها حاكمة لمديرية تشاركنت سنة 2018، ومقاومتها هجوم طالبان سنة 2021 وهربها إلى الولايات المتحدة، ولا تذكر لها دينًا ولا مذهبًا."
  en: "English Wikipedia article on Salima Mazari; used for entity facts only. It records her birth in Iran in 1980, her University of Tehran degree, her 2018 appointment as district governor of Charkint, her district's resistance in the 2021 Taliban offensive and her escape to the United States, and names no religion or school for her."
