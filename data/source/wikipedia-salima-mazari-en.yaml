summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سليمة مزاري؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في إيران سنة 1980، ودراستها في جامعة طهران، وتعيينها حاكمة لمديرية تشاركنت سنة 2018، ومقاومتها هجوم طالبان سنة 2021 وهربها إلى الولايات المتحدة، ولا تذكر لها دينًا ولا مذهبًا."
  en: "English Wikipedia article on Salima Mazari; used for entity facts only. It records her birth in Iran in 1980, her University of Tehran degree, her 2018 appointment as district governor of Charkint, her district's resistance in the 2021 Taliban offensive and her escape to the United States, and names no religion or school for her."
  es: "Artículo de la Wikipedia en inglés sobre Salima Mazari; utilizado únicamente para datos sobre la persona. En él se registra su nacimiento en Irán en 1980, su título de la Universidad de Teherán, su nombramiento en 2018 como gobernadora del distrito de Charkint, la resistencia de su distrito en la ofensiva talibán de 2021 y su huida a Estados Unidos, pero no se menciona su religión ni su escuela."
  fr: "Article de Wikipédia en anglais sur Salima Mazari; utilisé uniquement à titre informatif. Il relate sa naissance en Iran en 1980, son diplôme de l’Université de Téhéran, sa nomination en 2018 comme gouverneure du district de Charkint, la résistance de son district lors de l’offensive des talibans en 2021 et sa fuite aux États-Unis, sans mentionner sa religion ni son école."
  ur: "سلیمہ مزاری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1980 میں ایران میں اس کی پیدائش، اس کی تہران یونیورسٹی کی ڈگری، 2018 میں چارکنت کے ضلعی گورنر کے طور پر اس کی تقرری، 2021 میں طالبان کے حملے میں اس کے ضلع کی مزاحمت اور اس کا امریکہ فرار، اور اس کے لیے کسی مذہب یا اسکول کا نام نہیں لیا گیا ہے۔"
