summary:
  ar: "مقالة ويكيبيديا الألمانية عن الحافظ عزيز عليلي؛ لوقائع الكيان فقط: مولده في كومانوفو في 29 مايو 1968، وحفظه القرآن في تسع سنين وثمانية أشهر، ودراسته في مدرسة الغازي خسرو بك بسراييفو، وأذانه في جامع القيصر (1984–1986)، وإمامته في جامع الغازي خسرو بك (1989–1993)، ومسابقاته الدولية، ورئاسته للجماعة الإسلامية في زغرب؛ ومرجعها مقالة في برلينر تسايتونغ ⁦(25 أبريل 2008)⁩."
  en: "German Wikipedia article on Hafiz Aziz Alili; entity facts only: birth at Kumanovo on 29 May 1968, memorisation of the Qur'an at nine years and eight months, study at the Gazi Husrev-beg Madrasa in Sarajevo, muezzin of the Emperor's Mosque (1984–1986), imam of the Gazi Husrev-beg Mosque (1989–1993), international competitions, and his leadership of the Islamic Community in Zagreb; its reference is a Berliner Zeitung article of 25 April 2008."
