summary:
  ar: "مقالة ويكيبيديا الألمانية عن الحافظ عزيز عليلي؛ لوقائع الكيان فقط: مولده في كومانوفو في 29 مايو 1968، وحفظه القرآن في تسع سنين وثمانية أشهر، ودراسته في مدرسة الغازي خسرو بك بسراييفو، وأذانه في جامع القيصر (1984–1986)، وإمامته في جامع الغازي خسرو بك (1989–1993)، ومسابقاته الدولية، ورئاسته للجماعة الإسلامية في زغرب؛ ومرجعها مقالة في برلينر تسايتونغ ⁦(25 أبريل 2008)⁩."
  en: "German Wikipedia article on Hafiz Aziz Alili; entity facts only: birth at Kumanovo on 29 May 1968, memorisation of the Qur'an at nine years and eight months, study at the Gazi Husrev-beg Madrasa in Sarajevo, muezzin of the Emperor's Mosque (1984–1986), imam of the Gazi Husrev-beg Mosque (1989–1993), international competitions, and his leadership of the Islamic Community in Zagreb; its reference is a Berliner Zeitung article of 25 April 2008."
  es: "Artículo de la Wikipedia en alemán sobre Hafiz Aziz Alili; solo datos sobre la persona: nacimiento en Kumanovo el 29 de mayo de 1968, memorización del Corán a los nueve años y ocho meses, estudios en la madrasa Gazi Husrev-beg en Sarajevo, muecín de la Mezquita del Emperador (1984-1986), imán de la Mezquita Gazi Husrev-beg (1989-1993), competiciones internacionales y su liderazgo de la Comunidad Islámica en Zagreb; su referencia es un artículo del Berliner Zeitung del 25 de abril de 2008."
  fr: "Article de Wikipédia en allemand sur Hafiz Aziz Alili; informations uniquement sur l’individu: naissance à Kumanovo le 29 mai 1968, mémorisation du Coran à neuf ans et huit mois, études à la madrasa Gazi Husrev-beg de Sarajevo, muezzin de la mosquée de l’Empereur (1984-1986), imam de la mosquée Gazi Husrev-beg (1989-1993), compétitions internationales et son rôle de dirigeant de la communauté islamique de Zagreb; sa référence est un article de la Berliner Zeitung du 25 avril 2008."
  ur: "حافظ عزیز علیلی پر جرمن ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: کمانووو میں 29 مئی 1968 کو پیدائش، نو سال اور آٹھ ماہ کی عمر میں قرآن حفظ، سراجیوو میں غازی حسریو بیگ مدرسہ میں تعلیم، شہنشاہ کی مسجد کے مؤذن (1984–1986)، غازی مسجد کے امام، اور بین الاقوامی مقابلہ (1984-1986) زگریب میں اسلامی کمیونٹی کی ان کی قیادت؛ اس کا حوالہ 25 اپریل 2008 کا ایک Berliner Zeitung مضمون ہے۔"
