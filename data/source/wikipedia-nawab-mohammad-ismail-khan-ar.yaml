  ar: "مقالة ويكيبيديا العربية عن نواب محمد إسماعيل خان (آب 1884 – 28 حزيران 1958)؛ تُستخدم لوقائع الكيان فقط. هي ترجمة للمقالة الإنجليزية، وتروي نشأته في ميروت وتعليمه في إنجلترا وقيادته في رابطة مسلمي عموم الهند ونيابته رئاسة جامعة عليكرة الإسلامية ودفنه في المقبرة العائلية عند حضرة نظام الدين."
  en: "Arabic Wikipedia article on Nawab Mohammad Ismail Khan (August 1884 – 28 June 1958); used for entity facts only. It is a translation of the English article — one source family with it — recounting his Meerut birth, English education, Muslim League leadership, Aligarh vice-chancellorships and burial in the family graveyard at the Nizamuddin shrine."
