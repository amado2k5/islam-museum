  ar: "قناة «دي يو إس دعوة» على يوتيوب (@DUSDawah)، وهي منصة الدعوة بالفيديو لمسجد دار السنة في لندن؛ يتصدّر محتواها الأصلي مناظرات الداعية الشمسي في ركن المتحدثين بهايد بارك ولندن، إلى جانب محاضرات لمتحدثين آخرين وتسجيلات، وهي مصدر أولي لهوية المنصة وعملها وانتشارها، لا مصدر مستقل مؤيد."
  en: "The DUS Dawah YouTube channel (@DUSDawah), the video dawah platform of Masjid Daar us Sunnah in London; its signature original content is the debater Shamsi's Speakers' Corner encounters in Hyde Park, London, alongside lectures by other speakers and recordings. A primary source for the platform's identity, work and reach, not independent corroboration."
