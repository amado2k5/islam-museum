summary:
  ar: "قناة «دي يو إس دعوة» على يوتيوب (@DUSDawah)، وهي منصة الدعوة بالفيديو لمسجد دار السنة في لندن؛ يتصدّر محتواها الأصلي مناظرات الداعية الشمسي في ركن المتحدثين بهايد بارك ولندن، إلى جانب محاضرات لمتحدثين آخرين وتسجيلات، وهي مصدر أولي لهوية المنصة وعملها وانتشارها، لا مصدر مستقل مؤيد."
  en: "The DUS Dawah YouTube channel (@DUSDawah), the video dawah platform of Masjid Daar us Sunnah in London; its signature original content is the debater Shamsi's Speakers' Corner encounters in Hyde Park, London, alongside lectures by other speakers and recordings. A primary source for the platform's identity, work and reach, not independent corroboration."
  es: "El canal de YouTube DUS Dawah (@DUSDawah), la plataforma de vídeos de prédica islámica de la Mezquita Daar us Sunnah en Londres, se caracteriza por presentar los encuentros del orador Shamsi en Speakers' Corner en Hyde Park, Londres, junto con conferencias de otros oradores y grabaciones. Esta información es una fuente primaria sobre la identidad, el trabajo y el alcance de la plataforma, pero no constituye una corroboración independiente."
  fr: "La chaîne YouTube DUS Dawah (@DUSDawah), plateforme vidéo de prédication de la mosquée Daar us Sunnah à Londres, propose notamment les débats de Shamsi dans son Speakers' Corner à Hyde Park, ainsi que des conférences et des enregistrements d'autres intervenants. Cette chaîne constitue une source primaire pour l'identité, le travail et la portée de la plateforme, mais ne fait l'objet d'aucune vérification indépendante."
  ur: "DUS Dawah YouTube چینل (@DUSDawah)، لندن میں مسجد دار السنۃ کا ویڈیو پلیٹ فارم؛ اس کے دستخط کا اصل مواد ڈیبیٹر شمسی کا ہائیڈ پارک، لندن میں اسپیکرز کارنر مقابلوں میں دوسرے مقررین کے لیکچرز اور ریکارڈنگز کے ساتھ ہے۔ پلیٹ فارم کی شناخت، کام اور رسائی کے لیے ایک بنیادی ذریعہ، نہ کہ آزاد تصدیق۔"
