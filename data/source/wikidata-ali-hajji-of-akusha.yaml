summary:
  ar: "عنصر ويكيداتا Q4062222 لعلي حاجي الأكوشي؛ يُستخدم للمعرّفات والوقائع المنظّمة فقط. يذكر مولده سنة 1847 ووفاته في 8 أبريل 1930، وقيمته للدين هي «الإسلام» عامة، وله قيمة «تلميذ عند» تشير إلى عنصر أستاذه عبد الرحمن حاجي السوغوري الذي لا سجل له في المتحف بعد."
  en: "Wikidata item Q4062222 for Ali-Hajji of Akusha; used for identifiers and structured facts only. It gives his birth in 1847 and death on 8 April 1930, its religion value is Islam in general, and its student-of value points to the item of his teacher Abdurrahman-Hajji as-Suguri, who has no museum record yet."
  es: "Entrada de Wikidata Q4062222 para Ali-Hajji de Akusha; se utiliza solo para identificadores y datos estructurados. Indica que nació en 1847 y murió el 8 de abril de 1930, su valor religioso es el Islam en general, y su valor de discípulo apunta a la entrada de su maestro Abdurrahman-Hajji as-Suguri, de quien aún no hay registro en ningún museo."
  fr: "L'élément Wikidata Q4062222 concernant Ali-Hajji d'Akusha est utilisé uniquement à des fins d'identification et de structuration des données. Il indique sa naissance en 1847 et son décès le 8 avril 1930. Sa valeur religieuse est « Islam en général », et sa valeur relative à son élève renvoie à l'élément concernant son maître, Abdurrahman-Hajji as-Suguri, qui ne possède pas encore de notice muséale."
  ur: "وکی ڈیٹا آئٹم Q4062222 علی حاجی عکوشہ کے لیے؛ صرف شناخت کنندگان اور ساختی حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1847 میں اس کی پیدائش اور 8 اپریل 1930 کو موت واقع ہوئی، اس کی مذہبی قدر عام طور پر اسلام ہے، اور اس کا طالب علم اس کے استاد عبدالرحمن-حاجی الصغوری کی چیز کی طرف اشارہ کرتا ہے، جن کا ابھی تک کوئی میوزیم ریکارڈ نہیں ہے۔"
  tr: "Wikidata öğesi Ali Hacı Al-Akoshi tarafından Q4062222; yalnızca organize tanımlayıcılar ve gerçekler için kullanılır. 1847 doğumlu ve 8 Nisan 1930'da öldüğü belirtilir; din için değeri genel olarak 'İslam'dır; 'öğrenci' terimi ise henüz müzede kayıtlı olmayan öğretmeni Abdul Rahman Hacı Al-Sughouri'nin unsuruna atıfta bulunur."
  id: "Item Wikidata Q4062222 oleh Ali Haji Al-Akoshi; hanya digunakan untuk pengenal dan fakta yang terorganisir. Ia disebutkan lahir pada tahun 1847 dan meninggal pada 8 April 1930, dan nilainya terhadap agama adalah 'Islam' secara umum, dan ia memiliki nilai 'murid dengan' yang merujuk pada unsur gurunya Abdul Rahman Haji Al-Sughouri, yang belum terdaftar di museum."
