  ar: "عنصر ويكيداتا Q4062222 لعلي حاجي الأكوشي؛ يُستخدم للمعرّفات والوقائع المنظّمة فقط. يذكر مولده سنة 1847 ووفاته في 8 أبريل 1930، وقيمته للدين هي «الإسلام» عامة، وله قيمة «تلميذ عند» تشير إلى عنصر أستاذه عبد الرحمن حاجي السوغوري الذي لا سجل له في المتحف بعد."
