summary:
  ar: مقالة ويكيبيديا الأردية عن عبد العزيز الثعالبي؛ تُستخدم لوقائع الكيان فقط. ترجمة للمقالة العربية تكرر تاريخ مطلعها «15 شعبان 1293هـ / 5 سبتمبر 1874م» ووفاته في 1 أكتوبر 1944، وتصفه زعيمًا سياسيًا ومذهبيًا ⁦(دينيًا)⁩ تونسيًا. لا تسمّي مذهبًا فقهيًا له.
  en: 'Urdu Wikipedia article on Abdelaziz Thâalbi; used for entity facts only. A translation of the Arabic article: it repeats the lead date ''15 Sha''ban 1293 AH / 5 September 1874'' and his death on 1 October 1944, and describes him as a Tunisian political and religious leader. It names no legal school for him.'
  es: "Artículo de Wikipedia en urdu sobre Abdelaziz Thâalbi; utilizado únicamente para datos sobre la persona. Traducción del artículo en árabe: repite la fecha principal «15 Sha'ban 1293 AH / 5 de septiembre de 1874» y su muerte el 1 de octubre de 1944, y lo describe como un líder político y religioso tunecino. No menciona ninguna escuela jurídica a la que pertenezca."
  fr: "Article de Wikipédia en ourdou sur Abdelaziz Thâalbi; utilisé uniquement pour les informations factuelles. Traduction de l'article arabe: il reprend la date principale « 15 Sha'ban 1293 AH / 5 septembre 1874 » et sa date de décès, le 1er octobre 1944, et le décrit comme un chef politique et religieux tunisien. Aucune école juridique n'est mentionnée à son sujet."
  ur: "عبدالعزیز ثعلبی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ عربی مضمون کا ترجمہ: اس میں لیڈ ڈیٹ '15 شعبان 1293 ہجری / 5 ستمبر 1874' اور ان کی وفات یکم اکتوبر 1944 کو دہرائی گئی ہے اور انہیں تیونس کے ایک سیاسی اور مذہبی رہنما کے طور پر بیان کیا گیا ہے۔ اس میں اس کے لیے کسی قانونی اسکول کا نام نہیں ہے۔"
  tr: "Abdul Aziz Al-Thaalibi hakkında Urduca Vikipedi makalesi; yalnızca varlığın etkinlikleri için kullanılmıştır. Arapça makalenin çevirisi, açılış tarihini \"15 Şa'ban 1293 Hicri / 5 Eylül 1874\" olarak ve 1 Ekim 1944'teki ölümünü tekrarlayarak Tunuslu bir siyasi ve mezhepçi (dini) lider olarak tanımlanmıştır. Onun fıkıh okulunun adını vermeyin."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Abdul Aziz Al-Thaalibi; digunakan hanya untuk peristiwa entitas tersebut. Terjemahan artikel berbahasa Arab mengulangi tanggal pembukaannya sebagai \"15 Sha'ban 1293 AH / 5 September 1874 M\" dan kematiannya pada 1 Oktober 1944, menggambarkannya sebagai pemimpin politik dan sektarian (agama) Tunisia. Jangan sebutkan aliran pemikiran yurisprudensinya."
