summary:
  ar: "مقالة ويكيبيديا العربية «نوال العيد»؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها في شقراء سنة 1397 هـ، ومنصبها أستاذا للسنة في جامعة الأميرة نورة، وفوزها بجائزة الأمير نايف العالمية للسنة النبوية، ومسيرتها التعليمية والمناصب والنشاطات وقائمة مؤلفاتها ومحاضراتها، وتربط في وصلاتها الخارجية بموقعها الرسمي وحساباتها وقناتها على يوتيوب."
  en: "Arabic Wikipedia article on Nawal Al-Eid; used for entity facts only. It gives her birth in Shaqra in 1397 AH, her professorship of the Sunnah at Princess Nourah University, her Prince Naif International Prize for the Prophet's Sunnah, her education, posts, activities, a list of her books and lectures, and external links to her official website, her social accounts and her own YouTube channel."
