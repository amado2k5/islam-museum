reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. The article gives her birth in the city of Shaqra in 1397 AH, her bachelor (1419/1420 AH), master and doctorate (1424 AH) at the College of Education for Girls in Riyadh, her appointment as a teaching assistant, her memberships, the Prince Naif Prize for her research on women's rights in the Sunnah, a weekly lesson on the Names of God, radio programmes on women's rights and family affairs, and lists of her books, lectures and articles. Its infobox gives only her birthplace (Shaqra), Saudi nationality and her occupation, 'religious scholar'; it names no legal school or theological affiliation for her. Its external links point to her official website, her Twitter and Facebook accounts and her own YouTube channel."
