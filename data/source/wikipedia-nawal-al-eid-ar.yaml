summary:
  ar: "مقالة ويكيبيديا العربية «نوال العيد»؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها في شقراء سنة 1397 هـ، ومنصبها أستاذا للسنة في جامعة الأميرة نورة، وفوزها بجائزة الأمير نايف العالمية للسنة النبوية، ومسيرتها التعليمية والمناصب والنشاطات وقائمة مؤلفاتها ومحاضراتها، وتربط في وصلاتها الخارجية بموقعها الرسمي وحساباتها وقناتها على يوتيوب."
  en: "Arabic Wikipedia article on Nawal Al-Eid; used for entity facts only. It gives her birth in Shaqra in 1397 AH, her professorship of the Sunnah at Princess Nourah University, her Prince Naif International Prize for the Prophet's Sunnah, her education, posts, activities, a list of her books and lectures, and external links to her official website, her social accounts and her own YouTube channel."
  es: "Artículo de Wikipedia en árabe sobre Nawal Al-Eid; utilizado únicamente para obtener información sobre la persona. En él se menciona su nacimiento en Shaqra en el año 1397 de la Hégira, su cátedra de Sunnah en la Universidad Princesa Nourah, su Premio Internacional Príncipe Naif a la Sunnah del Profeta, su formación académica, sus publicaciones, sus actividades, una lista de sus libros y conferencias, y enlaces externos a su sitio web oficial, sus redes sociales y su canal de YouTube."
  fr: "Article Wikipédia en arabe consacré à Nawal Al-Eid; utilisé uniquement à des fins d'information sur la personne. On y trouve des informations sur sa naissance à Shaqra en 1397 AH, son poste de professeure de Sunna à l'Université Princesse Nourah, son Prix international Prince Naif pour la Sunna du Prophète, sa formation, ses fonctions, ses activités, une liste de ses livres et conférences, ainsi que des liens externes vers son site web officiel, ses comptes sur les réseaux sociaux et sa chaîne YouTube."
  ur: "عربی ویکیپیڈیا مضمون نوالعید پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1397 ہجری میں شقرہ میں اس کی پیدائش، شہزادی نورہ یونیورسٹی میں سنت کی پروفیسری، سنت نبوی کے لیے اس کا شہزادہ نائف انٹرنیشنل پرائز، اس کی تعلیم، پوسٹس، سرگرمیاں، اس کی کتابوں اور لیکچرز کی فہرست، اور اس کی آفیشل ویب سائٹ، اس کے سوشل اکاؤنٹس اور اس کے اپنے یوٹیوب چینل کے بیرونی لنکس۔"
