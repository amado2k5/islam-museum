  ar: "مقالة ويكيبيديا الفرنسية عن محمد سياد بري؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في 6 أكتوبر 1919 في شيلابو ووفاته في لاغوس في 2 يناير 1995 وانقلاب 1969 ورئاسته، وتذكر في صندوقها أن دينه «الإسلام» وأن سلفه المباشر كان مختار محمد حسين رئيسا بالوكالة؛ ولا يسمي متنها مذهبا له."
  en: "French Wikipedia article on Mohamed Siad Barre; used for entity facts only. It recounts his birth on 6 October 1919 at Shilabo, his death in Lagos on 2 January 1995, the 1969 coup and his presidency; its infobox gives his religion as Islam and lists his immediate predecessor as Sheikh Mukhtar Mohamed Hussein (acting). Its text names no school for him."
