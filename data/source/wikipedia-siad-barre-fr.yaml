summary:
  ar: "مقالة ويكيبيديا الفرنسية عن محمد سياد بري؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في 6 أكتوبر 1919 في شيلابو ووفاته في لاغوس في 2 يناير 1995 وانقلاب 1969 ورئاسته، وتذكر في صندوقها أن دينه «الإسلام» وأن سلفه المباشر كان مختار محمد حسين رئيسا بالوكالة؛ ولا يسمي متنها مذهبا له."
  en: "French Wikipedia article on Mohamed Siad Barre; used for entity facts only. It recounts his birth on 6 October 1919 at Shilabo, his death in Lagos on 2 January 1995, the 1969 coup and his presidency; its infobox gives his religion as Islam and lists his immediate predecessor as Sheikh Mukhtar Mohamed Hussein (acting). Its text names no school for him."
  es: "Artículo de la Wikipedia en francés sobre Mohamed Siad Barre; utilizado únicamente para datos biográficos. Relata su nacimiento el 6 de octubre de 1919 en Shilabo, su fallecimiento en Lagos el 2 de enero de 1995, el golpe de Estado de 1969 y su presidencia. Su ficha informativa indica que su religión era el islam y menciona a su predecesor inmediato como el jeque Mukhtar Mohamed Hussein (en funciones). El texto no menciona ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en français sur Mohamed Siad Barre; utilisé uniquement pour les informations le concernant. Il relate sa naissance le 6 octobre 1919 à Shilabo, sa mort à Lagos le 2 janvier 1995, le coup d'État de 1969 et sa présidence; son infobox indique qu'il était musulman et mentionne comme prédécesseur immédiat le cheikh Mukhtar Mohamed Hussein (par intérim). Le texte ne cite aucune école à son sujet."
  ur: "محمد سیاد بیرے پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 6 اکتوبر 1919 کو شیلابو میں ان کی پیدائش، 2 جنوری 1995 کو لاگوس میں ان کی موت، 1969 کی بغاوت اور ان کی صدارت کا ذکر ہے۔ اس کا معلوماتی باکس اس کا مذہب اسلام دیتا ہے اور اس کے فوری پیشرو کو شیخ مختار محمد حسین ⁦(قائم مقام)⁩ کے طور پر درج کرتا ہے۔ اس کے متن میں اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Mohamed Siad Barre hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 6 Ekim 1919'da Chilabo'da doğduğunu, 2 Ocak 1995'te Lagos'taki ölümünü, 1969 darbesini ve başkanlığını anlatır. Kutusunda dininin \"İslam\" olduğu ve doğrudan selefinin geçici cumhurbaşkanı olarak Mukhtar Muhammad Hüseyin olduğu belirtilir; içeriğini mezhebi olarak adlandırmaz."
  id: "Artikel Wikipedia Prancis tentang Mohamed Siad Barre; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 6 Oktober 1919 di Chilabo, kematiannya di Lagos pada 2 Januari 1995, kudeta 1969, dan kepresidenannya. Artikel tersebut menyebutkan dalam kotaknya bahwa agamanya adalah \"Islam\" dan pendahulunya yang langsung adalah Mukhtar Muhammad Hussein sebagai presiden sementara; tidak menyebutkan isinya sebagai sektenya."
