  ur: "نواف الاحمد الجابر الصباح پر اردو ویکیپیڈیا کا مضمون، ایک مختصر سٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں درج ہے کہ وہ 2020 سے 2023 تک کویت کے امیر تھے اور اس میں ان کے مذہب یا مکتب کا کوئی بیان نہیں ہے۔"
