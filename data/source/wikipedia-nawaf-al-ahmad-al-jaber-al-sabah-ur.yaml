  id: "Artikel Wikipedia dalam bahasa Urdu tentang Nawaf Al-Ahmad Al-Jaber Al-Sabah, yang merupakan ringkasan singkat, hanya digunakan untuk fakta entitas tersebut. Ingat bahwa dia adalah Emir Kuwait dari tahun 2020 hingga 2023, dan tidak memuat pernyataan apapun tentang agama atau sekolahnya."
