summary:
  ar: "مقالة ويكيبيديا الأردية عن حکیم محمد سعید؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه حكيم بارز ألّف وحرّر أكثر من 200 كتاب في الدين والطب والحكمة، وأسس همدرد باكستان وجامعة همدرد، وتروي بصبغة تعظيمية اغتياله في كراتشي في 17 أكتوبر 1998 وصيامه في أيام عيادته للمرضى."
  en: "Urdu Wikipedia article on Hakim Muhammad Said; used for entity facts only. It describes him as a leading hakim who authored and compiled more than 200 books on religion, medicine and Unani practice and founded Hamdard Pakistan and Hamdard University, and recounts in devotional framing his assassination at Karachi on 17 October 1998 and his practice of fasting on clinic days."
  es: "Artículo de Wikipedia en urdu sobre Hakim Muhammad Said; utilizado únicamente para obtener información sobre la persona. Lo describe como un destacado médico tradicional que escribió y compiló más de 200 libros sobre religión, medicina y práctica Unani, y fundó Hamdard Pakistan y la Universidad Hamdard. Además, relata, con un tono devocional, su asesinato en Karachi el 17 de octubre de 1998 y su práctica de ayunar los días de consulta."
  fr: "Article de Wikipédia en ourdou sur Hakim Muhammad Said; utilisé uniquement à titre informatif. Il le décrit comme un hakim éminent, auteur et compilateur de plus de 200 ouvrages sur la religion, la médecine et la pratique unani, fondateur de Hamdard Pakistan et de l’Université Hamdard, et relate, dans un style dévotionnel, son assassinat à Karachi le 17 octobre 1998 et sa pratique du jeûne les jours de consultation."
  ur: "حکیم محمد سعید پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں انہیں ایک سرکردہ حکیم کے طور پر بیان کیا گیا ہے جس نے مذہب، طب اور یونانی پریکٹس پر 200 سے زائد کتابیں تصنیف اور مرتب کیں اور ہمدرد پاکستان اور ہمدرد یونیورسٹی کی بنیاد رکھی، اور 17 اکتوبر 1998 کو کراچی میں ان کے قتل اور کلینک کے دنوں میں روزہ رکھنے کے عمل کو عقیدت کے ساتھ بیان کیا۔"
