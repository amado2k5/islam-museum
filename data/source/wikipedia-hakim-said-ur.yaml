  ar: "مقالة ويكيبيديا الأردية عن حکیم محمد سعید؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه حكيم بارز ألّف وحرّر أكثر من 200 كتاب في الدين والطب والحكمة، وأسس همدرد باكستان وجامعة همدرد، وتروي بصبغة تعظيمية اغتياله في كراتشي في 17 أكتوبر 1998 وصيامه في أيام عيادته للمرضى."
  en: "Urdu Wikipedia article on Hakim Muhammad Said; used for entity facts only. It describes him as a leading hakim who authored and compiled more than 200 books on religion, medicine and Unani practice and founded Hamdard Pakistan and Hamdard University, and recounts in devotional framing his assassination at Karachi on 17 October 1998 and his practice of fasting on clinic days."
