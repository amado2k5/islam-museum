  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth on 18 September 1985 at Jablanica, his six years with Saski Baskonia, six NBA seasons, his captaincy of Bosnia and Herzegovina and his federation presidency of 2018–2022. Its personal-life section states: 'He is a practicing Muslim.' It names no school."
