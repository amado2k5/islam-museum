summary:
  ar: "مقال موسوعي عن ميرزا تلتوفيتش ⁦(مواليد 1985)⁩: ميلاده في 18 سبتمبر 1985 في يابلانيتسا، وسنواته مع ساسكي باسكونيا وNBA، وقيادته منتخب البوسنة، ورئاسته اتحادها 2018–2022. ويذكر المقال أنه مسلم ممارس، دون أن يسمي مذهباً."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth on 18 September 1985 at Jablanica, his six years with Saski Baskonia, six NBA seasons, his captaincy of Bosnia and Herzegovina and his federation presidency of 2018–2022. Its personal-life section states: 'He is a practicing Muslim.' It names no school."
  es: "Artículo de enciclopedia editado por la comunidad, recuperado íntegramente en la revisión indicada; menciona su nacimiento el 18 de septiembre de 1985 en Jablanica, sus seis años con el Saski Baskonia, seis temporadas en la NBA, su capitanía de Bosnia y Herzegovina y su presidencia de la federación entre 2018 y 2022. En la sección sobre su vida personal se indica: «Es musulmán practicante». No menciona ninguna escuela."
  fr: "Article encyclopédique collaboratif, consulté intégralement à la version indiquée; il mentionne sa naissance le 18 septembre 1985 à Jablanica, ses six années au Saski Baskonia, ses six saisons en NBA, son capitanat de l’équipe nationale de Bosnie-Herzégovine et sa présidence de la fédération de 2018 à 2022. La section consacrée à sa vie personnelle précise: « Il est musulman pratiquant. » Aucune école n’est mentionnée."
  ur: "کمیونٹی میں ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظرثانی پر مکمل طور پر بازیافت کیا گیا؛ اس کی پیدائش 18 ستمبر 1985 کو جبلانیکا میں ہوئی، ساسکی باسکونیا کے ساتھ اس کے چھ سال، چھ این بی اے سیزن، بوسنیا اور ہرزیگووینا کی کپتانی اور 2018-2022 کی فیڈریشن کی صدارت۔ اس کے ذاتی زندگی کے حصے میں کہا گیا ہے: 'وہ ایک باعمل مسلمان ہے۔' اس میں کسی اسکول کا نام نہیں ہے۔"
