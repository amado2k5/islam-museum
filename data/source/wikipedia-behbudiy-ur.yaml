summary:
  ar: "مقالة ويكيبيديا الأردية عن محمود خواجه بهبودي ⁦(20 جنوری 1875 – 25 مارچ 1919)⁩؛ تُستخدم لوقائع الكيان فقط. وهي الصياغة الأردية لرواية المقالة الإنجليزية: مولده في سمرقند ومنصبه قاضيًا بعد تعليم المدرسة ومجلته «آيينه» وإعدامه في قرشي."
  en: "Urdu Wikipedia article on Mahmud Khoja Behbudiy (20 January 1875 – 25 March 1919); used for entity facts only. It is the Urdu rendering of the English article's account: his Samarkand birth, his qadi office after madrasa education, his magazine Ayina, and his execution at Qarshi."
  es: "Mahmud Khoja Behbudiy (20 de enero de 1875 – 25 de marzo de 1919); se utiliza únicamente para datos sobre la persona. Es la traducción al urdu del relato del artículo en inglés: su nacimiento en Samarcanda, su cargo como cadí tras su educación en la madrasa, su revista Ayina y su ejecución en Qarshi."
  fr: "Mahmud Khoja Behbudiy (20 janvier 1875 – 25 mars 1919); utilisé uniquement à titre informatif. Il s’agit de la traduction ourdou du récit de l’article en anglais: sa naissance à Samarcande, sa fonction de cadi après ses études à la madrasa, son magazine Ayina et son exécution à Qarshi."
