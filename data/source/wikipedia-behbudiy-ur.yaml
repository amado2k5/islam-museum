  ar: "مقالة ويكيبيديا الأردية عن محمود خواجه بهبودي (20 جنوری 1875 – 25 مارچ 1919)؛ تُستخدم لوقائع الكيان فقط. وهي الصياغة الأردية لرواية المقالة الإنجليزية: مولده في سمرقند ومنصبه قاضيًا بعد تعليم المدرسة ومجلته «آيينه» وإعدامه في قرشي."
  en: "Urdu Wikipedia article on Mahmud Khoja Behbudiy (20 January 1875 – 25 March 1919); used for entity facts only. It is the Urdu rendering of the English article's account: his Samarkand birth, his qadi office after madrasa education, his magazine Ayina, and his execution at Qarshi."
