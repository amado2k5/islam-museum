reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A tertiary digest of the same scholarship the TDV entry represents at first hand, used here as corroboration: it agrees with the TDV entry on the birth range, the 818/1415 eye treatment and the accepted 1431 death, and it carries the Haci Bayram affiliation in a stronger form (his becoming the sheikh's khalifa) than Latifi's intisab as the TDV entry reports it — this record follows the weaker, better-sourced form. It also lists the medical compilation Kenzu'l-menafi among his works without the TDV entry's warning that the attribution fails on style, content and language, and gives the Hüsrev ü Şirin at 6,694 couplets against the TDV entry's 6,944. Read live on 1 November 2026; the article's own page property grounds Wikidata item Q389030."
