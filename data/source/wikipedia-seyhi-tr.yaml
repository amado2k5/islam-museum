summary:
  ar: "مقالة ويكيبيديا التركية عن شيخي، مراجعة 7 كانون الأول 2025؛ مولده بكوتاهية «في 1371–1376 على التقدير»، وخدمته طبيباً خاصاً ليعقوب الثاني الكرمياني والسلطانين محمد الأول ومراد الثاني، ودراسته بإيران في الطب والتصوف، ونبأ صيرورته خليفة لحاجي بيرام ولي بأنقرة واتخاذه لقبه «شيخي» منه، وشهرته بمثنويي «خسرو وشيرين» و«هارنامه»، وسنة وفاته المقبولة عموماً 1431 وقبره في حي دوملوبينار بكوتاهية."
  en: "Turkish Wikipedia article on Şeyhi, revision of 7 December 2025 — his Kütahya birth 'presumably in 1371-1376', his service as personal physician to Yakub II of Germiyan and to Sultans Mehmed I and Murad II, his Iranian studies in medicine and Sufism, the report that he became Haci Bayram Veli's khalifa at Ankara and took his pen name Şeyhi from it, his fame from the mesnevis Hüsrev ü Şirin and Harname, and the generally accepted death year 1431 with his tomb in Kütahya's Dumlupınar quarter."
  es: "Artículo de la Wikipedia turca sobre Şeyhi, revisión del 7 de diciembre de 2025: su nacimiento en Kütahya 'presumiblemente entre 1371 y 1376', su servicio como médico personal de Yakub II de Germiyan y de los sultanes Mehmed I y Murad II, sus estudios iraníes de medicina y sufismo, el informe de que se convirtió en califa de Haci Bayram Veli en Ankara y adoptó su seudónimo Şeyhi de ello, su fama gracias a los mesnevis Hüsrev ü Şirin y Harname, y el año de su muerte generalmente aceptado de 1431, con su tumba en el barrio de Dumlupınar de Kütahya."
  fr: "Article de Wikipédia turc sur Şeyhi, révision du 7 décembre 2025 — sa naissance à Kütahya « vraisemblablement entre 1371 et 1376 », son service en tant que médecin personnel de Yakub II de Germiyan et des sultans Mehmed Ier et Murad II, ses études iraniennes en médecine et en soufisme, le récit selon lequel il serait devenu le calife de Haci Bayram Veli à Ankara et aurait tiré son nom de plume Şeyhi de là, sa renommée grâce aux mesnevis Hüsrev ü Şirin et Harname, et l'année de décès généralement acceptée de 1431 avec son tombeau dans le quartier Dumlupınar de Kütahya."
  ur: "ترک ویکیپیڈیا مضمون Şeyhi پر، 7 دسمبر 2025 کی نظرثانی - اس کی کوتاہیا کی پیدائش 'ممکنہ طور پر 1371-1376 میں'، اس کی ذاتی طبیب کی حیثیت سے جرمیان کے یعقوب دوم اور سلطان محمود اول اور مراد دوئم کے لیے خدمات، طب اور تصوف میں ان کی ایرانی تعلیم، ایک رپورٹ میں کہا گیا ہے کہ وہ Balikharam's میں شائع ہوا۔ اس سے اس کا قلمی نام Şeyhi، اس کی شہرت mesnevis Hüsrev ü Şirin اور Harname سے، اور عام طور پر قبول شدہ موت کا سال 1431 کوتاہیا کے Dumlupınar کوارٹر میں اس کی قبر کے ساتھ۔"
