summary:
  ar: "مقالة ويكيبيديا التركية عن شيخي، مراجعة 7 كانون الأول 2025؛ مولده بكوتاهية «في 1371–1376 على التقدير»، وخدمته طبيباً خاصاً ليعقوب الثاني الكرمياني والسلطانين محمد الأول ومراد الثاني، ودراسته بإيران في الطب والتصوف، ونبأ صيرورته خليفة لحاجي بيرام ولي بأنقرة واتخاذه لقبه «شيخي» منه، وشهرته بمثنويي «خسرو وشيرين» و«هارنامه»، وسنة وفاته المقبولة عموماً 1431 وقبره في حي دوملوبينار بكوتاهية."
  en: "Turkish Wikipedia article on Şeyhi, revision of 7 December 2025 — his Kütahya birth 'presumably in 1371-1376', his service as personal physician to Yakub II of Germiyan and to Sultans Mehmed I and Murad II, his Iranian studies in medicine and Sufism, the report that he became Haci Bayram Veli's khalifa at Ankara and took his pen name Şeyhi from it, his fame from the mesnevis Hüsrev ü Şirin and Harname, and the generally accepted death year 1431 with his tomb in Kütahya's Dumlupınar quarter."
