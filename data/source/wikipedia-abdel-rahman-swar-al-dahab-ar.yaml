  ar: "مقالة ويكيبيديا العربية عن المشير عبد الرحمن سوار الذهب (1934–2018): مولده في أم درمان ونشأته في الأبيض، وتخرجه في الكلية الحربية (1958)، وعمله في قطر (1972–1975)، وتولّيه السلطة في 6 أبريل 1985 وتسليمها لحكومة منتخبة في 1986، ورئاسته منظمة الدعوة الإسلامية، ووفاته بالرياض في 18 أكتوبر 2018 ودفنه في البقيع."
  en: "Arabic Wikipedia article on Field Marshal Abd al-Rahman Siwar al-Dhahab (1934–2018): birth in Omdurman and upbringing in El-Obeid, graduation from the Military College (1958), service in Qatar (1972–1975), taking power on 6 April 1985 and handing it to an elected government in 1986, chairmanship of the Islamic Call Organization, and death in Riyadh on 18 October 2018 with burial at al-Baqi'."
