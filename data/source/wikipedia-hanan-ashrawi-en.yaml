summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حنان عشراوي؛ تُستخدم لوقائع الكيان فقط. تروي ولادتها في نابلس في 8 أكتوبر 1946 لأبوين فلسطينيين مسيحيين، ونشأتها في رام الله وتعليمها في الجامعة الأمريكية ببيروت وجامعة فيرجينيا، وعملها في جامعة بيرزيت، ومتحدثةً رسمية في مؤتمر مدريد 1991، ووزارة التعليم العالي 1996، وعضويتها اللجنة التنفيذية لمنظمة التحرير 2009 و2018 واستقالتها 2020، وتأسيسها «مفتاح». نصها الإنجليزي يذكر مسيحية أسرتها ولا يسمّي انتماءها هي."
  en: "English Wikipedia article on Hanan Ashrawi; used for entity facts only. It recounts her birth in Nablus on 8 October 1946 to Palestinian Christian parents, her upbringing in Ramallah, her studies at the American University of Beirut and the University of Virginia, her career at Birzeit University, her role as official spokesperson at the 1991 Madrid conference, her ministry of higher education in 1996, her election to the PLO Executive Committee in 2009 and 2018 and her 2020 resignation, and her founding of MIFTAH. Its text gives her family's Christianity and does not name her own affiliation."
  es: "Artículo de la Wikipedia en inglés sobre Hanan Ashrawi; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Nablus el 8 de octubre de 1946, de padres cristianos palestinos; su infancia en Ramallah; sus estudios en la Universidad Americana de Beirut y la Universidad de Virginia; su trayectoria profesional en la Universidad de Birzeit; su papel como portavoz oficial en la conferencia de Madrid de 1991; su cargo en el Ministerio de Educación Superior en 1996; su elección al Comité Ejecutivo de la OLP en 2009 y 2018; su dimisión en 2020; y la fundación de MIFTAH. El texto menciona la religión cristiana de su familia, pero no especifica su propia afiliación religiosa."
  fr: "Article de Wikipédia en anglais sur Hanan Ashrawi; utilisé uniquement pour les informations la concernant. Il relate sa naissance à Naplouse le 8 octobre 1946 de parents chrétiens palestiniens, son enfance à Ramallah, ses études à l’Université américaine de Beyrouth et à l’Université de Virginie, sa carrière à l’Université de Birzeit, son rôle de porte-parole officielle à la conférence de Madrid de 1991, son ministère de l’Enseignement supérieur en 1996, son élection au Comité exécutif de l’OLP en 2009 et 2018, sa démission en 2020 et la fondation de MIFTAH. Le texte mentionne la religion chrétienne de sa famille, mais ne précise pas son appartenance religieuse."
  ur: "حنان اشراوی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں نابلس میں 8 اکتوبر 1946 کو فلسطینی عیسائی والدین کے ہاں اس کی پیدائش، رام اللہ میں اس کی پرورش، بیروت کی امریکن یونیورسٹی اور ورجینیا یونیورسٹی میں اس کی تعلیم، برزیت یونیورسٹی میں اس کا کیریئر، 1991 کی میڈرڈ کانفرنس میں سرکاری ترجمان کے طور پر اس کا کردار، اس کی وزارت اعلیٰ تعلیم، 1991 کے انتخابات میں اس کی اعلیٰ تعلیم کمیٹی، 1991 کے انتخابات میں 1991 میں ان کی اعلیٰ تعلیم کے بارے میں بتایا گیا ہے۔ اور 2018 اور اس کا 2020 استعفیٰ، اور اس کا MIFTAH کا بانی۔ اس کا متن اس کے خاندان کی عیسائیت دیتا ہے اور اس کی اپنی وابستگی کا نام نہیں لیتا۔"
