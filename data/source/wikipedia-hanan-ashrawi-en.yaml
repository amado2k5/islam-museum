summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حنان عشراوي؛ تُستخدم لوقائع الكيان فقط. تروي ولادتها في نابلس في 8 أكتوبر 1946 لأبوين فلسطينيين مسيحيين، ونشأتها في رام الله وتعليمها في الجامعة الأمريكية ببيروت وجامعة فيرجينيا، وعملها في جامعة بيرزيت، ومتحدثةً رسمية في مؤتمر مدريد 1991، ووزارة التعليم العالي 1996، وعضويتها اللجنة التنفيذية لمنظمة التحرير 2009 و2018 واستقالتها 2020، وتأسيسها «مفتاح». نصها الإنجليزي يذكر مسيحية أسرتها ولا يسمّي انتماءها هي."
  en: "English Wikipedia article on Hanan Ashrawi; used for entity facts only. It recounts her birth in Nablus on 8 October 1946 to Palestinian Christian parents, her upbringing in Ramallah, her studies at the American University of Beirut and the University of Virginia, her career at Birzeit University, her role as official spokesperson at the 1991 Madrid conference, her ministry of higher education in 1996, her election to the PLO Executive Committee in 2009 and 2018 and her 2020 resignation, and her founding of MIFTAH. Its text gives her family's Christianity and does not name her own affiliation."
