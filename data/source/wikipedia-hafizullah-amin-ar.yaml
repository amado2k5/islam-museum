summary:
  ar: "مقالة ويكيبيديا العربية عن حفيظ الله أمين؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 1 أغسطس 1929 في بغمان ووفاته بكابل في 27 ديسمبر 1979، وخانة الديانة في صندوق معلوماتها فارغة."
  en: "Arabic Wikipedia article on Hafizullah Amin; used for entity facts only. It gives his birth on 1 August 1929 at Paghman and his death at Kabul on 27 December 1979; the religion field of its infobox is blank."
  es: "Artículo en árabe de la Wikipedia sobre Hafizullah Amin; se utiliza únicamente para obtener información sobre la persona. Indica que nació el 1 de agosto de 1929 en Paghman y falleció en Kabul el 27 de diciembre de 1979; el campo de religión de su ficha informativa está en blanco."
  fr: "Article Wikipédia en arabe sur Hafizullah Amin; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 1er août 1929 à Paghman et son décès à Kaboul le 27 décembre 1979; le champ « religion » de son infobox est vide."
  ur: "حفیظ اللہ امین پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش یکم اگست 1929 کو پغمان میں ہوئی اور ان کی موت 27 دسمبر 1979 کو کابل میں ہوئی۔ اس کے انفو باکس کا مذہب کا میدان خالی ہے۔"
  tr: "Hafizullah Amin hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 1 Ağustos 1929'da Bagman'da ve ölümünü 27 Aralık 1979'da Kabil'de vermektedir ve bilgi kutusundaki din alanı boştur."
  id: "Artikel Wikipedia Arab tentang Hafizullah Amin; digunakan hanya untuk fakta entitas. Artikel ini mencantumkan kelahirannya pada 1 Agustus 1929 di Bagman dan kematiannya di Kabul pada 27 Desember 1979, dan kolom agama di infobox kosong."
