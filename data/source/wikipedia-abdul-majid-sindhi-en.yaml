summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شيخ عبد المجيد السندي (1889–1978)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في تته سنة 1889 في أسرة هندوسية باسم جيتا ناند، واعتناقه الإسلام في 10 فبراير 1908 في حيدرآباد (السند)، وعمله صحفيا ومحررا لصحيفتي الأمين والوحيد، ومشاركته في حركة الرسائل الحريرية وسجنه مرتين، وانتخابه لعضوية جمعية السند سنة 1937 وصيرورته وزيرا سنة 1940، ووفاته في حيدرآباد في 24 مايو 1978 ودفنه في مقبرة مكلي."
  en: "English Wikipedia article on Shaikh Abdul Majeed Sindhi (1889–1978); used for entity facts only. It recounts his birth at Thatta in 1889 into a Hindu family, under the name Jetha Nand, his conversion to Islam on 10 February 1908 at Hyderabad in Sindh, his work as a journalist and editor of Al-Amin and Al-Waheed, his part in the Silk Letter Movement and two imprisonments, his election to the Sindh Assembly in 1937 and ministership in 1940, and his death at Hyderabad on 24 May 1978 and burial at the Makli graveyard."
