summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شيخ عبد المجيد السندي (1889–1978)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في تته سنة 1889 في أسرة هندوسية باسم جيتا ناند، واعتناقه الإسلام في 10 فبراير 1908 في حيدرآباد ⁦(السند)⁩، وعمله صحفيا ومحررا لصحيفتي الأمين والوحيد، ومشاركته في حركة الرسائل الحريرية وسجنه مرتين، وانتخابه لعضوية جمعية السند سنة 1937 وصيرورته وزيرا سنة 1940، ووفاته في حيدرآباد في 24 مايو 1978 ودفنه في مقبرة مكلي."
  en: "English Wikipedia article on Shaikh Abdul Majeed Sindhi (1889–1978); used for entity facts only. It recounts his birth at Thatta in 1889 into a Hindu family, under the name Jetha Nand, his conversion to Islam on 10 February 1908 at Hyderabad in Sindh, his work as a journalist and editor of Al-Amin and Al-Waheed, his part in the Silk Letter Movement and two imprisonments, his election to the Sindh Assembly in 1937 and ministership in 1940, and his death at Hyderabad on 24 May 1978 and burial at the Makli graveyard."
  es: "Artículo de la Wikipedia en inglés sobre Shaikh Abdul Majeed Sindhi (1889-1978); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Thatta en 1889 en el seno de una familia hindú, con el nombre de Jetha Nand, su conversión al Islam el 10 de febrero de 1908 en Hyderabad, Sindh, su labor como periodista y editor de Al-Amin y Al-Waheed, su participación en el Movimiento de la Carta de Seda y dos encarcelamientos, su elección a la Asamblea de Sindh en 1937 y su nombramiento como ministro en 1940, y su fallecimiento en Hyderabad el 24 de mayo de 1978 y su entierro en el cementerio de Makli."
  fr: "Article de Wikipédia en anglais sur Cheikh Abdul Majeed Sindhi (1889-1978); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Thatta en 1889 dans une famille hindoue, sous le nom de Jetha Nand, sa conversion à l’islam le 10 février 1908 à Hyderabad (Sindh), son travail de journaliste et de rédacteur en chef d’Al-Amin et d’Al-Waheed, son rôle dans le Mouvement des Lettres de Soie et ses deux emprisonnements, son élection à l’Assemblée du Sindh en 1937 et son poste de ministre en 1940, ainsi que sa mort à Hyderabad le 24 mai 1978 et son inhumation au cimetière de Makli."
  ur: "شیخ عبدالمجید سندھی (1889-1978) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ٹھٹھہ میں 1889 میں ایک ہندو گھرانے میں ان کی پیدائش، جیٹھا نند کے نام سے، 10 فروری 1908 کو سندھ کے حیدرآباد میں اسلام قبول کرنے، الامین اور الوحید کے صحافی اور ایڈیٹر کے طور پر ان کا کام، خط ریشم کی تحریک میں ان کا حصہ اور دو قید، سندھ اسمبلی میں ان کا انتخاب اور 1974 میں حیدرآباد میں ان کی وفات، 1907 میں سندھ اسمبلی میں ان کی موت، 1889 میں ٹھٹھہ میں ایک ہندو گھرانے میں ان کی وفات کا ذکر ہے۔ 24 مئی 1978 اور مکلی قبرستان میں تدفین۔"
