reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 by its recorded revision id via the MediaWiki API, the returned id asserted equal before any claim was drawn. Its 'Conversion to Islam' section, citing the Sindh Adabi Board profile and Dawn, states that he was born into a Hindu family at Thatta and converted to Islam on 10 February 1908 at Hyderabad, at the hands of Shaikh Abdul Rahim; no school or order is named anywhere in the article, and its infobox has no religion field. It gives his birth as 7 July 1889 and his death as 24 May 1978; Wikidata gives the death as 25 May 1978, and the two-article agreement on 24 May is followed."
