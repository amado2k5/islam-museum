summary:
  ar: "تقرير إخباري ⁦(خبر جنوب شرق آسيا، 28 يناير 2014)⁩ عن انطلاق قناة المحمدية «تي في مو» في نوفمبر 2013 تحت شعار «ذكيّ منوّر»، بعد توجيه من المؤتمر الوطني للجمعية سنة 2005 وقناة مجتمعية في يوغياكارتا سنة 2010."
  en: "A Khabar Southeast Asia news report of 28 January 2014 on Muhammadiyah's tvMu channel, broadcasting daily since its November 2013 launch under the tagline Cerdas Mencerahkan ('smart, enlightening'), following a 2005 Muhammadiyah national assembly directive and a 2010 community television channel in Yogyakarta."
  ur: "خبر ساؤتھ ایسٹ ایشیا کی 28 جنوری 2014ء کی رپورٹ محمدیہ کے چینل ٹی وی مو کے بارے میں، جو نومبر 2013ء کے آغاز سے «چرداس منچراہکن» ⁦(ذہین، روشن کرنے والا)⁩ کے نعرے کے تحت روزانہ نشر ہو رہا تھا؛ اس سے پہلے 2005ء میں تنظیم کی قومی مجلس کی ہدایت اور 2010ء میں یوگیاکارتا میں کمیونٹی ٹیلی ویژن چینل قائم ہوا تھا۔"
  es: "Un reportaje de Khabar Southeast Asia del 28 de enero de 2014 sobre el canal tvMu de Muhammadiyah, que emite diariamente desde su lanzamiento en noviembre de 2013 bajo el lema Cerdas Mencerahkan ('inteligente, esclarecedor'), tras una directiva de la asamblea nacional de Muhammadiyah de 2005 y un canal de televisión comunitario de 2010 en Yogyakarta."
title: "Muhammadiyah preaches enlightenment on new TV station"
