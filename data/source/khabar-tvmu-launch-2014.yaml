reliability_note: "News report read on 15 November 2026. It records tvMu broadcasting daily from 5am to 9am since its November launch (November 2013), with the tagline Cerdas Mencerahkan; Dadang Kahmad, the Muhammadiyah chairman in charge of television, states the channel's establishment follows a 2005 Muhammadiyah national assembly directive and that a community television channel was established in Yogyakarta in 2010; the channel was then accessible on the Telkom 1 satellite and streamed worldwide, and it features educational, cultural, women's studies and religious content along with news programmes and interviews. Read on 15 November 2026."
