summary:
  ar: "مدخل «قصّاص» في موسوعة TDV الإسلامية لحسن جيريت: القصّاص بمعنى حاكي القصة والواعظ، ونشأة القصص بعد مقتل عثمان، واعتراض المحدثين عليهم، وشروط الإذن والصفات في من يقصّ، وتحوّلهم إلى الترفيه."
  en: "The TDV İslâm Ansiklopedisi entry on kussâs by Hasan Cirit: the storyteller-preacher office, its rise after the killing of Uthman, the hadith scholars' objections, the required licence and qualities of the qāss, and their slide toward entertainment."
  es: "La entrada de Hasan Cirit en la TDV İslâm Ansiklopedisi sobre el kussâs: el oficio de narrador-predicador, su auge tras el asesinato de Uthman, las objeciones de los eruditos del hadiz, la licencia y las cualidades requeridas del qāss, y su deriva hacia el entretenimiento."
  fr: "L'article de la TDV İslâm Ansiklopedisi sur les kussâs par Hasan Cirit: la fonction de conteur-prédicateur, son essor après la mort d'Uthman, les objections des érudits du hadith, la licence et les qualités requises du qāss, et leur dérive vers le divertissement."
  ur: "TDV İslâm Ansiklopedisi entry on kussas by Hassan Crit: قصہ گو-مبلغ کا دفتر، عثمان کے قتل کے بعد اس کا عروج، اہل حدیث کے اعتراضات، قصاص کے مطلوبہ لائسنس اور خصوصیات، اور تفریح کی طرف ان کا سلائیڈ۔"
  tr: "TDV İslami Ansiklopedisi'nde Hasan Jirit'in 'Kisa' Girişi: Kısas, anlatıcı ve vaiz, Osman öldürülmesinden sonra hikâyelerin ortaya çıkışı, hadis âlimlerinin bunlara itirazları, rivayet edenlerin izin ve sıfatlarının koşulları ile bunların eğlenceye dönüşmesi anlamına gelir."
  id: "Pengantar 'Qisas' dalam Ensiklopedia Islam TDV oleh Hassan Jirit: Qisas berarti narator dan pengkhotbah, munculnya cerita setelah pembunuhan Uthman, keberatan para ulama hadis terhadapnya, syarat izin dan atribut bagi para narator, serta transformasinya menjadi hiburan."
