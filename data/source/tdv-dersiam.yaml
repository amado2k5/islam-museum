summary:
  ar: "مدخل «درسيام» في موسوعة TDV الإسلامية بقلم محمد إيبشيرلي ⁦(المجلد 9، إسطنبول 1994، ص 185–186)⁩، ويتناول اللقب الذي يُمنح للمدرّس المرخّص له بإلقاء الدرس العام في المساجد: أصل التعبير، والامتحان بعد الإجازة، ومساجد إسطنبول الكبرى، وعدد الدرسيامات سنة 1869، وامتحان اللقب في القرن التاسع عشر، ومكانه في الديانة في أوائل الجمهورية."
  en: "The entry 'DERSİÂM' in the TDV İslâm Ansiklopedisi by Mehmet İpşirli (vol. 9, Istanbul 1994, pp. 185–186). It covers the title given to a müderris licensed to give public lessons in mosques: the origin of the phrase, the examination after the ijaza, the great Istanbul mosques, the count of 1869, the title's examination in the nineteenth century, and its place in the Diyanet in the early Republic."
  es: "La entrada «DERSİÂM» en la TDV İslâm Ansiklopedisi de Mehmet İpşirli (vol. 9, Estambul, 1994, págs. 185-186) abarca el título otorgado a un müderris con licencia para impartir clases públicas en las mezquitas: el origen de la expresión, el examen posterior a la ijaza, las grandes mezquitas de Estambul, el conteo de 1869, el examen del título en el siglo XIX y su lugar en el Diyanet a principios de la República."
  fr: "L'article « DERSİÂM » dans l'ouvrage TDV İslâm Ansiklopedisi de Mehmet İpşirli (vol. 9, Istanbul 1994, pp. 185–186) traite du titre donné à un müderris autorisé à donner des cours publics dans les mosquées: l'origine de l'expression, l'examen après l'ijaza, les grandes mosquées d'Istanbul, le recensement de 1869, l'examen du titre au XIXe siècle et sa place au sein de la Diyanet au début de la République."
