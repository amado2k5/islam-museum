summary:
  ar: "مدخل «درسيام» في موسوعة TDV الإسلامية بقلم محمد إيبشيرلي (المجلد 9، إسطنبول 1994، ص 185–186)، ويتناول اللقب الذي يُمنح للمدرّس المرخّص له بإلقاء الدرس العام في المساجد: أصل التعبير، والامتحان بعد الإجازة، ومساجد إسطنبول الكبرى، وعدد الدرسيامات سنة 1869، وامتحان اللقب في القرن التاسع عشر، ومكانه في الديانة في أوائل الجمهورية."
  en: "The entry 'DERSİÂM' in the TDV İslâm Ansiklopedisi by Mehmet İpşirli (vol. 9, Istanbul 1994, pp. 185–186). It covers the title given to a müderris licensed to give public lessons in mosques: the origin of the phrase, the examination after the ijaza, the great Istanbul mosques, the count of 1869, the title's examination in the nineteenth century, and its place in the Diyanet in the early Republic."
