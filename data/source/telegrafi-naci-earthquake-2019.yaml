reliability_note: "News report read on 4 November 2026. It relays Naçi's own announcement on Facebook that the Firdeus Foundation's appeal had passed 7 million euros, with donation channels listed; the figure is the foundation's announced running total as reported, not an audited figure, and is presented that way in the record that cites it. The report's text misprints the earthquake's date as 'December 26'; the earthquake struck Albania on 26 November 2019, and the announcement followed in December 2019 (AINA's parallel report is dated December 2019)."
