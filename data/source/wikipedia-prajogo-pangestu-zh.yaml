  ar: "مقالة ويكيبيديا الصينية (بنغ يون بنغ) عن براجوغو بانغيستو، المولود في 13 أيار 1944 في بنغكايانغ بكاليمانتان الغربية وأصله من شانوي في قوانغدونغ، مؤسس مجموعة باريتو باسيفيك؛ تذكر عمله في مجموعة دجاجانتي للأخشاب منذ 1970 وتأسيسه شركته سنة 1977 واستحواذه الكامل على ستار إنرجي سنة 2022."
  en: "Chinese Wikipedia article (Peng Yunpeng) on Prajogo Pangestu, born 13 May 1944 in Bengkayang, West Kalimantan, with ancestral roots in Shanwei, Guangdong, founder of the Barito Pacific Group; it records his work at the Djajanti timber group from 1970, his own company's founding in 1977, and his full takeover of Star Energy in 2022."
