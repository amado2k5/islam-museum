summary:
  ar: "مقالة ويكيبيديا الصينية ⁦(بنغ يون بنغ)⁩ عن براجوغو بانغيستو، المولود في 13 أيار 1944 في بنغكايانغ بكاليمانتان الغربية وأصله من شانوي في قوانغدونغ، مؤسس مجموعة باريتو باسيفيك؛ تذكر عمله في مجموعة دجاجانتي للأخشاب منذ 1970 وتأسيسه شركته سنة 1977 واستحواذه الكامل على ستار إنرجي سنة 2022."
  en: "Chinese Wikipedia article (Peng Yunpeng) on Prajogo Pangestu, born 13 May 1944 in Bengkayang, West Kalimantan, with ancestral roots in Shanwei, Guangdong, founder of the Barito Pacific Group; it records his work at the Djajanti timber group from 1970, his own company's founding in 1977, and his full takeover of Star Energy in 2022."
  es: "Artículo de la Wikipedia en chino (Peng Yunpeng) sobre Prajogo Pangestu, nacido el 13 de mayo de 1944 en Bengkayang, Kalimantan Occidental, con raíces ancestrales en Shanwei, Guangdong, fundador del Grupo Barito Pacific; en él se recoge su trabajo en el grupo maderero Djajanti desde 1970, la fundación de su propia empresa en 1977 y la adquisición total de Star Energy en 2022."
  fr: "L'article de Wikipédia chinois (Peng Yunpeng) sur Prajogo Pangestu, né le 13 mai 1944 à Bengkayang, dans le Kalimantan occidental, avec des racines ancestrales à Shanwei, dans le Guangdong, fondateur du groupe Barito Pacific; il relate son travail au sein du groupe forestier Djajanti à partir de 1970, la fondation de sa propre entreprise en 1977 et sa prise de contrôle totale de Star Energy en 2022."
