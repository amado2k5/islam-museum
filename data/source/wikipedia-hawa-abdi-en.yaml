summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حواء عبدي؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في 17 مايو 1947 في مقديشو ووفاتها فيها في 5 أغسطس 2020، ودراستها الطب في كييف والقانون في مقديشو، وتأسيسها عيادتها سنة 1983 ومؤسستها، وحصار الميليشيات لمجمّعها، وجوائزها، ولا تذكر لها مذهبًا."
  en: "English Wikipedia article on Hawa Abdi; used for entity facts only. It records her birth on 17 May 1947 in Mogadishu and her death there on 5 August 2020, her medical studies in Kiev and law studies in Mogadishu, her 1983 clinic and her foundation, the militant sieges of her compound, and her awards, and names no school for her."
  es: "Artículo de la Wikipedia en inglés sobre Hawa Abdi; utilizado únicamente para datos biográficos. En él se registra su nacimiento el 17 de mayo de 1947 en Mogadiscio y su fallecimiento allí el 5 de agosto de 2020, sus estudios de medicina en Kiev y de derecho en Mogadiscio, su clínica de 1983 y su fundación, los asedios de militantes a su complejo y sus premios, pero no menciona ninguna escuela a la que pertenezca."
  fr: "L'article de Wikipédia en anglais consacré à Hawa Abdi, utilisé uniquement pour les informations la concernant, mentionne sa naissance le 17 mai 1947 à Mogadiscio et son décès dans cette même ville le 5 août 2020, ses études de médecine à Kiev et de droit à Mogadiscio, sa clinique et sa fondation fondées en 1983, les sièges de son domicile par des militants, ainsi que les distinctions qu'elle a reçues. Aucune école ne porte son nom."
  ur: "حوا عبدی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 17 مئی 1947 کو موغادیشو میں اس کی پیدائش اور 5 اگست 2020 کو اس کی موت، کیف میں اس کی طبی تعلیم اور موغادیشو میں قانون کی تعلیم، اس کا 1983 کا کلینک اور اس کی فاؤنڈیشن، اس کے کمپاؤنڈ کے عسکریت پسندوں کے محاصرے، اور اس کے ایوارڈز، اور اس کے لیے کسی اسکول کا نام درج نہیں ہے۔"
