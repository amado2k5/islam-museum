summary:
  ar: "مقالة ويكيبيديا التركية عن جودت يلماز ⁦(وُلد في 1 نيسان 1967 في بينكل)⁩، نائب رئيس تركيا منذ 3 حزيران 2023؛ تذكر والديه كمال وفاطمة وانتخابه نائبًا عن بينكل منذ 2007 ووزارتيه ونائبيته لرئيس الوزراء في الحكومة الانتخابية سنة 2015."
  en: "Turkish Wikipedia article on Cevdet Yılmaz (born 1 April 1967 in Bingöl), Vice President of Turkey since 3 June 2023; it names his parents Kemal and Fatma, records his election as a Bingöl deputy from 2007, his ministries and his deputy premiership in the 2015 interim election government."
  es: "Artículo de la Wikipedia en turco sobre Cevdet Yılmaz (nacido el 1 de abril de 1967 en Bingöl), vicepresidente de Turquía desde el 3 de junio de 2023; menciona a sus padres, Kemal y Fatma, y registra su elección como diputado de Bingöl desde 2007, sus ministerios y su cargo de viceprimer ministro en el gobierno interino de las elecciones de 2015."
  fr: "Article de Wikipédia turc sur Cevdet Yılmaz (né le 1er avril 1967 à Bingöl), vice-président de la Turquie depuis le 3 juin 2023; il mentionne ses parents Kemal et Fatma, retrace son élection comme député de Bingöl à partir de 2007, ses ministères et son poste de vice-premier ministre dans le gouvernement intérimaire issu des élections de 2015."
  ur: "Cevdet Yılmaz ⁦(پیدائش 1 اپریل 1967 Bingöl میں)⁩، 3 جون 2023 سے ترکی کے نائب صدر پر ترک ویکیپیڈیا کا مضمون؛ اس میں اس کے والدین کا نام کمال اور فاطمہ ہے، 2007 سے بنگول کے نائب کے طور پر اس کے انتخاب، اس کی وزارتوں اور 2015 کی عبوری انتخابی حکومت میں اس کی نائب وزیر اعظم کے طور پر اس کا انتخاب ریکارڈ کیا گیا ہے۔"
