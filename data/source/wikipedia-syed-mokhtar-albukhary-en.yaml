summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد مختار البخاري، رجل الأعمال والمحسن الماليزي؛ تذكر مولده في 12 كانون الأول 1951 في ألور ستار بقدح، وجذور أسرته في حضرموت، ومسيرته من تجارة الأرز إلى مجموعتي إم إم سي ودي آر بي-هيكوم وبيرناس، وتأسيسه مؤسسة البخاري سنة 1996 على القيم الإسلامية ومتحف الفنون الإسلامية بماليزيا سنة 1998."
  en: "English Wikipedia article on Syed Mokhtar Albukhary, the Malaysian tycoon and philanthropist; it gives his birth on 12 December 1951 at Alor Setar, Kedah, his family's roots in Hadramawt, his rise from the rice trade to the MMC and DRB-HICOM groups and Bernas, and his founding of the Albukhary Foundation in 1996 on Islamic values and of the Islamic Arts Museum Malaysia in 1998."
  es: "Artículo de la Wikipedia en inglés sobre Syed Mokhtar Albukhary, el magnate y filántropo malasio; en él se menciona su nacimiento el 12 de diciembre de 1951 en Alor Setar, Kedah, las raíces de su familia en Hadramawt, su ascenso desde el comercio de arroz hasta los grupos MMC y DRB-HICOM y Bernas, y la fundación de la Fundación Albukhary en 1996, basada en valores islámicos, y del Museo de Artes Islámicas de Malasia en 1998."
  fr: "L'article de Wikipédia en anglais sur Syed Mokhtar Albukhary, magnat et philanthrope malaisien, retrace sa naissance le 12 décembre 1951 à Alor Setar, dans l'État de Kedah, les origines de sa famille dans le Hadramaout, son ascension du commerce du riz aux groupes MMC et DRB-HICOM et à Bernas, ainsi que la création de la Fondation Albukhary en 1996, axée sur les valeurs islamiques, et du Musée des arts islamiques de Malaisie en 1998."
  ur: "سید مختار البخاری پر انگریزی ویکیپیڈیا کا مضمون، ملائیشین ٹائیکون اور انسان دوست؛ اس کی پیدائش 12 دسمبر 1951 کو الور سیٹار، کیداہ میں ہوئی، اس کے خاندان کی جڑیں ہدراماوت میں، چاول کی تجارت سے MMC اور DRB-HICOM گروپس اور برناس میں اس کا عروج، اور 1996 میں البخاری فاؤنڈیشن کی اسلامی اقدار اور اسلامی آرٹس میوزیم ملائیشیا کی بنیاد۔"
