  ar: "مقالة ويكيبيديا الإنجليزية عن سيد مختار البخاري، رجل الأعمال والمحسن الماليزي؛ تذكر مولده في 12 كانون الأول 1951 في ألور ستار بقدح، وجذور أسرته في حضرموت، ومسيرته من تجارة الأرز إلى مجموعتي إم إم سي ودي آر بي-هيكوم وبيرناس، وتأسيسه مؤسسة البخاري سنة 1996 على القيم الإسلامية ومتحف الفنون الإسلامية بماليزيا سنة 1998."
  en: "English Wikipedia article on Syed Mokhtar Albukhary, the Malaysian tycoon and philanthropist; it gives his birth on 12 December 1951 at Alor Setar, Kedah, his family's roots in Hadramawt, his rise from the rice trade to the MMC and DRB-HICOM groups and Bernas, and his founding of the Albukhary Foundation in 1996 on Islamic values and of the Islamic Arts Museum Malaysia in 1998."
