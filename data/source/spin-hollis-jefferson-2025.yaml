summary:
  ar: "تقرير «سبين» الفلبيني ⁦(11 مارس 2025)⁩ يصف هوليس جيفرسون بأنه مسلم ملتزم يصوم رمضان ويصلي، وينقل كلماته عن قضاء أيام الصيام، دون أن يسمي مذهباً."
  en: "SPIN.ph report of 11 March 2025 from the PBA: it describes Hollis-Jefferson as a devout Muslim observing Ramadan with prayers and fasting, and quotes him on making up missed fast days — 'The thing about Islam is you can make up the days' — and on wanting to grow closer to God. It names no school or tradition."
  es: "Según un informe de SPIN.ph del 11 de marzo de 2025 de la PBA, Hollis-Jefferson es un musulmán devoto que observa el Ramadán con oraciones y ayuno, y lo cita hablando sobre recuperar los días de ayuno perdidos —«Lo bueno del Islam es que puedes recuperar los días»— y sobre su deseo de acercarse más a Dios. No menciona ninguna escuela ni tradición."
  fr: "L'article de SPIN.ph du 11 mars 2025, publié par la PBA, décrit Hollis-Jefferson comme un musulman fervent observant le Ramadan par la prière et le jeûne. Il y est cité à propos du rattrapage des jours de jeûne manqués: « Ce qui est formidable avec l'islam, c'est qu'on peut rattraper les jours », et de son désir de se rapprocher de Dieu. L'article ne mentionne aucune école ni tradition."
  ur: "PBA سے 11 مارچ 2025 کی SPIN.ph رپورٹ: اس میں Hollis-Jefferson کو رمضان المبارک کو نماز اور روزے کے ساتھ منانے والے ایک دیندار مسلمان کے طور پر بیان کیا گیا ہے، اور اس کا حوالہ دیتے ہوئے کہا گیا ہے کہ - 'اسلام کی بات یہ ہے کہ آپ ان دنوں کی قضاء کر سکتے ہیں' — اور خدا کے قریب ہونے کی خواہش پر۔ اس میں کسی اسکول یا روایت کا نام نہیں ہے۔"
