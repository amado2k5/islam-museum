summary:
  ar: "القناة الرسمية للمقرئ عمر هشام العربي على يوتيوب؛ تُستخدم لواقع وحيد: أن القناة قناته الرسمية وأن تلاواته منشورة عليها منذ نحو تسع سنوات وبلغت مشاهدات بعضها عشرات الملايين."
  en: "The official YouTube channel of the reciter Omar Hisham Al-Arabi; used for the single fact that the channel is his official one, that his recitations have been published on it for about nine years, and that individual recitations have reached tens of millions of views."
  es: "El canal oficial de YouTube del recitador Omar Hisham Al-Arabi; utilizado por el simple hecho de que es su canal oficial, que sus recitaciones se han publicado en él durante unos nueve años y que algunas recitaciones individuales han alcanzado decenas de millones de visualizaciones."
  fr: "La chaîne YouTube officielle du récitant Omar Hisham Al-Arabi; utilisée pour la simple raison qu'il s'agit de sa chaîne officielle, que ses récitations y sont publiées depuis environ neuf ans et que certaines de ses récitations ont atteint des dizaines de millions de vues."
  ur: "قاری عمر ہشام العربی کا آفیشل یوٹیوب چینل؛ اس واحد حقیقت کے لیے استعمال کیا جاتا ہے کہ یہ چینل اس کا آفیشل ہے، اس پر تقریباً نو سال سے اس کی تلاوتیں شائع ہوتی رہی ہیں، اور یہ کہ انفرادی قرات دسیوں ملین آراء تک پہنچ چکی ہے۔"
  tr: "Omar Hisham Al-Arabi'nin YouTube'daki resmi kanalı tek bir gerçek için kullanılıyor: kanal onun resmi kanalı ve onun anlatımları yaklaşık dokuz yıldır orada yayınlanıyor, bazıları on milyonlarca izlenmeye ulaştı."
  id: "Saluran resmi pembaca Omar Hisham Al-Arabi di YouTube digunakan untuk satu kenyataan: bahwa saluran tersebut adalah saluran resminya, dan pembacaannya telah dipublikasikan di sana selama sekitar sembilan tahun, dengan beberapa di antaranya mencapai puluhan juta penayangan."
