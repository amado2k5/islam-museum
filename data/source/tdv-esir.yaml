summary:
  ar: "مدخل «أسير» في موسوعة TDV الإسلامية: أحكام أسير الحرب عند الأمم القديمة وفي الفقه الإسلامي، وملاحظة استعمال العثمانيين كلمة أسير و«أسيرجي وسوق الأسير وشيخ الأسيرجية» في معنى بيع الرقيق وتجارته."
  en: "The TDV İslâm Ansiklopedisi entry on the captive: the treatment of war captives among the ancient peoples and in Islamic law, with the note that Ottoman usage took esir for slave in general, and 'esirci, esir tüccarı, esir pazarı, esirciler şeyhi' for the slave trade."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el cautivo: el trato a los cautivos de guerra entre los pueblos antiguos y en la ley islámica, con la nota de que el uso otomano tomó esir para esclavo en general, y 'esirci, esir tüccarı, esir pazarı, esirciler şeyhi' para el comercio de esclavos."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur le captif: le traitement des captifs de guerre parmi les peuples anciens et dans le droit islamique, avec la note que l'usage ottoman prenait esir pour esclave en général, et 'esirci, esir tüccarı, esir pazarı, esirciler şeyhi' pour le commerce des esclaves."
  ur: "اسیر پر TDV İslâm Ansiklopedisi اندراج: قدیم لوگوں کے درمیان جنگی اسیروں کے ساتھ سلوک اور اسلامی قانون میں، اس نوٹ کے ساتھ کہ عثمانی استعمال عام طور پر غلام کے لیے esir لیا گیا، اور 'esirci, esir tüccarı, esir pazarı, esirciler theslavehi' تجارت کے لیے۔"
  tr: "İslami TDV Ansiklopedisi: Eski Uluslar ve İslami Fıkıh Arasında Savaş Esiri Kuralları ve İslam Fıkıhı'nda \"Aseer\" hakkında bir madde ve Osmanlıların köle satışı ve ticareti anlamında Aseer ve \"Aseerji, Mahkum Pazarı ve Şeyhi\" kelimelerini kullandıklarına dikkat çekmektedir."
  id: "Entri tentang \"Aseer\" dalam Ensiklopedia TDV Islam: Aturan Tawanan Perang di Antara Bangsa Kuno dan Fiqhèdemen Islam, serta mencatat penggunaan kata Aseer oleh Ottoman dan \"Aseerji, Pasar Tahanan, dan Sheikh Aseerji\" dalam arti penjualan dan perdagangan budak."
