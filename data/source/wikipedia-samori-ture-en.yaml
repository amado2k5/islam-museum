  ar: "مقالة ويكيبيديا الإنجليزية عن ساموري توري مؤسس إمبراطورية واسولو؛ تُستخدم لوقائع الكيان فقط. توثّق مسيرته من تاجر ديولا إلى إمام أعلى (ألمامي) أعلن الإسلام دينا رسميا لدولته سنة 1884، وحروبه مع فرنسا وأسره سنة 1898 ووفاته في الغابون في 2 يونيو 1900، وتصفه بأنه مسلم متدين من المدرسة المالكية."
  en: "English Wikipedia article on Samori Ture, founder of the Wassoulou Empire; used for entity facts only. It records his rise from Dyula trader to Almamy who in 1884 proclaimed Islam the state religion, his wars against France, his capture in 1898 and his death in Gabon on 2 June 1900, and describes him as a deeply religious Muslim of the Maliki school of Sunni Islam."
