summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ساموري توري مؤسس إمبراطورية واسولو؛ تُستخدم لوقائع الكيان فقط. توثّق مسيرته من تاجر ديولا إلى إمام أعلى ⁦(ألمامي)⁩ أعلن الإسلام دينا رسميا لدولته سنة 1884، وحروبه مع فرنسا وأسره سنة 1898 ووفاته في الغابون في 2 يونيو 1900، وتصفه بأنه مسلم متدين من المدرسة المالكية."
  en: "English Wikipedia article on Samori Ture, founder of the Wassoulou Empire; used for entity facts only. It records his rise from Dyula trader to Almamy who in 1884 proclaimed Islam the state religion, his wars against France, his capture in 1898 and his death in Gabon on 2 June 1900, and describes him as a deeply religious Muslim of the Maliki school of Sunni Islam."
  es: "Artículo de la Wikipedia en inglés sobre Samori Ture, fundador del Imperio Wassoulou; utilizado únicamente para datos sobre la persona. Narra su ascenso desde comerciante de Dyula hasta Almamy, quien en 1884 proclamó el Islam como religión de Estado, sus guerras contra Francia, su captura en 1898 y su muerte en Gabón el 2 de junio de 1900, y lo describe como un musulmán profundamente religioso de la escuela Maliki del Islam sunita."
  fr: "Article de Wikipédia en anglais sur Samori Ture, fondateur de l'empire Wassoulou; utilisé uniquement pour les informations sur l'entité. Il retrace son ascension, de commerçant Dyula à Almamy, qui proclama l'islam religion d'État en 1884, ses guerres contre la France, sa capture en 1898 et sa mort au Gabon le 2 juin 1900. Il le décrit comme un musulman profondément religieux, appartenant à l'école malikite de l'islam sunnite."
  ur: "ساموری ٹور پر انگریزی ویکیپیڈیا مضمون، وسولو سلطنت کے بانی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ڈیولا تاجر سے المامی تک اس کا عروج ریکارڈ کیا گیا ہے جس نے 1884 میں اسلام کو ریاستی مذہب کا اعلان کیا، فرانس کے خلاف اس کی جنگیں، 1898 میں اس کی گرفتاری اور 2 جون 1900 کو گیبون میں اس کی موت، اور اسے سنی اسلام کے مالکی مکتب کے ایک گہرے مذہبی مسلمان کے طور پر بیان کیا گیا ہے۔"
  tr: "Vasolo İmparatorluğu'nun kurucusu Samori Tori hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Diaula tüccarından en yüksek imama (Almami) geçişini belgelemektedir. 1884'te İslam'ı devletinin resmi dini ilan etmiş, Fransa ile savaşları, 1898'de yakalanması ve 2 Haziran 1900'de Gabon'da ölmüş ve onu Maliki okulundan dindar bir Müslüman olarak tanımlamaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Samori Tori, pendiri Kekaisaran Vasolo; digunakan hanya untuk fakta entitas tersebut. Artikel ini mendokumentasikan perjalanannya dari pedagang Diaula menjadi imam tertinggi (Almami). Ia menyatakan Islam sebagai agama resmi negaranya pada tahun 1884, perangnya dengan Prancis, penangkapannya pada tahun 1898, dan kematiannya di Gabon pada 2 Juni 1900, serta menggambarkannya sebagai Muslim taat dari aliran Maliki."
