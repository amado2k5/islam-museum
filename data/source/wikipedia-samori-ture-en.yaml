reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 24 October 2026; the article rests on the scholarly literature of the Wassoulou wars (Fofana 1998; Person 1968–75, in English 1975; Peterson 2008). It records his birth c. 1830 at Manyambaladugu (the short description dates him 1828–1900), his service with the Cissé to free his captured mother and his conversion to Islam in that service, his conquests and the Wassoulou Empire (1878–1898) across what is now Guinea, Sierra Leone, Mali, Côte d'Ivoire and Burkina Faso, his treaties with France (1886, 1889), the July 1884 council that proclaimed Islam the state religion and gave him the title Almamy, the forced conversions and the suppression of the ensuing rebellion by 1887, the failed siege of Sikasso, the eastward scorched-earth campaign, the destruction of Kong (23 May 1897), his capture by Captain Gouraud at Guelemou on 29 September 1898, his exile, and his death of pneumonia on Missanga Island near Ndjolé, Gabon, on 2 June 1900. The lead describes him as 'a deeply religious Muslim of the Maliki school of fiqh of Sunni Islam' — the only language edition that names a school for him in its own words; the record treats that sentence as a single attestation (the Arabic article repeats it in translation), and no second independent source naming the school was found, so the faith value in his record is unknown with the basis stated."
