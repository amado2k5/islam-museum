reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article. It gives Oumou Sangaré (also written أومو سنغاري), born 25 February 1968 at Bamako — agreeing with the English article against the French article's 2 February — a Wassoulou singer called 'the Songbird of Wassoulou', daughter of the singer Aminata Diakité, and a defender of women's rights opposed to child marriage and polygamy; its album list runs from Moussolou (1990) to Seya (2009). The article states no religion for her."
