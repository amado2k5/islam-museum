reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article whose opening infobox-style lines carry the load: full name 'Ahmad al-Madani al-Kabir at-Tijani ibn Umar ibn Sa'id al-Futi al-Turi', born 21 June 1836 (its pairing with 22 Rabi' al-Awwal 1252 AH converts to about 8 June 1836 — an internal mismatch recorded in the record's birth note), sovereignty 1864–1893, coronation 1864, died 15 December 1897 at Maykouki, Sokoto, Nigeria. The article's body text is very thin and partly garbled (it calls him a 'military dictator and pasha' in broken phrasing), so the record uses it only for the name form, the dates and the death place, which agree with the English and French articles; its transliteration of his surname (طعل) is not the form the museum's Arabic label uses. It makes no statement about his personal religious affiliation."
