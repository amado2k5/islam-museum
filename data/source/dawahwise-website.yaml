summary:
  ar: "الموقع الرسمي لمشروع «دعوة وايز»؛ يصرح في قسم «من نحن» بأن القناة يديرها منصور وهاشم، وأن هدفها تعميق فهم الإسلام وتشجيع الحوارات الهادفة، ويربط قنوات المشروع بلغات عدة."
  en: "The DawahWise project's official website; its 'Who we are' section states that the channel is run by Mansur and Hashim, that its mission is to empower a deeper understanding of Islam and foster meaningful conversations, and it links the project's channels in several languages."
  es: "El sitio web oficial del proyecto DawahWise, en su sección \"Quiénes somos\", indica que el canal está dirigido por Mansur y Hashim, que su misión es fomentar una comprensión más profunda del Islam y promover conversaciones significativas, y enlaza con los canales del proyecto en varios idiomas."
  fr: "Le site web officiel du projet DawahWise; sa section « Qui sommes-nous ? » indique que la chaîne est gérée par Mansur et Hashim, que sa mission est de favoriser une compréhension plus approfondie de l'islam et d'encourager des conversations significatives, et elle propose des liens vers les chaînes du projet dans plusieurs langues."
  ur: "DawahWise پروجیکٹ کی آفیشل ویب سائٹ؛ اس کے 'ہم کون ہیں' سیکشن میں کہا گیا ہے کہ یہ چینل منصور اور ہاشم چلا رہے ہیں، کہ اس کا مشن اسلام کی گہری تفہیم اور بامعنی گفتگو کو فروغ دینا ہے، اور یہ پروجیکٹ کے چینلز کو کئی زبانوں میں جوڑتا ہے۔"
