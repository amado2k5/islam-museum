reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his birth at al-Qrayya on 5 March 1891 and his death there on 26 March 1982 (heart attack). On community, it says he was born into the famous Druze family of al-Atrash, which had nominally governed the region since 1879, calls him one of the most influential figures in Syrian and Druze history, and files him under 'Syrian Druze people' — birth into, and leadership of, the Druze community; it records his secular slogan 'Religion is for God, the fatherland is for all' and makes no statement of a personal profession of faith apart from that communal identity."
