summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سلطان الأطرش؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في القريا لأسرة الأطرش الدرزية، وخدمته العثمانية، ودوره في الثورة العربية، وقيادته للثورة السورية الكبرى 1925–1927، ونفيه وعودته، ورفضه المناصب، ووفاته في القريا سنة 1982."
  en: "English Wikipedia article on Sultan al-Atrash; used for entity facts only. It recounts his birth at al-Qrayya into the Druze al-Atrash family, his Ottoman service, his role in the Arab Revolt, his command of the Great Syrian Revolt of 1925–1927, his exile and return, his refusal of office, and his death at al-Qrayya in 1982."
  es: "Artículo de la Wikipedia en inglés sobre el sultán al-Atrash; utilizado únicamente para datos sobre la persona. Relata su nacimiento en al-Qrayya en el seno de la familia drusa al-Atrash, su servicio en el Imperio Otomano, su papel en la Revuelta Árabe, su mando de la Gran Revuelta Siria de 1925-1927, su exilio y regreso, su negativa a aceptar el cargo y su muerte en al-Qrayya en 1982."
  fr: "Article de Wikipédia en anglais sur le sultan al-Atrash; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à al-Qrayya au sein de la famille druze al-Atrash, son service ottoman, son rôle dans la révolte arabe, son commandement de la Grande Révolte syrienne de 1925-1927, son exil et son retour, son refus du pouvoir et sa mort à al-Qrayya en 1982."
  ur: "سلطان العطرش پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں القریہ میں دروز التراش خاندان میں ان کی پیدائش، ان کی عثمانی خدمات، عرب بغاوت میں ان کا کردار، 1925-1927 کی عظیم شامی بغاوت کی کمانڈ، ان کی جلاوطنی اور واپسی، ان کے عہدے سے انکار، اور 1982 میں القریہ میں ان کی موت کا ذکر ہے۔"
  tr: "Sultan el-Atrash hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kitap, El-Kuraya'da Dürzî El-Atreş ailesine doğumunu, Osmanlı hizmetini, Arap İsyanı'ndaki rolünü, 1925–1927 Büyük Suriye İsyanı'nı yönetmesini, sürgününü ve dönüşünü, görevleri reddetmesini ve 1982'de El-Kuraya'daki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Sultan al-Atrash; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Al-Quraya kepada keluarga Druze Al-Atrash, pengabdiannya di Ottoman, perannya dalam Pemberontakan Arab, kepemimpinannya dalam Pemberontakan Besar Suriah 1925–1927, pengasingan dan kembalinya, penolakannya dari jabatan, serta kematiannya di Al-Quraya pada tahun 1982."
