  ar: "مقالة ويكيبيديا الإنجليزية عن سلطان الأطرش؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في القريا لأسرة الأطرش الدرزية، وخدمته العثمانية، ودوره في الثورة العربية، وقيادته للثورة السورية الكبرى 1925–1927، ونفيه وعودته، ورفضه المناصب، ووفاته في القريا سنة 1982."
  en: "English Wikipedia article on Sultan al-Atrash; used for entity facts only. It recounts his birth at al-Qrayya into the Druze al-Atrash family, his Ottoman service, his role in the Arab Revolt, his command of the Great Syrian Revolt of 1925–1927, his exile and return, his refusal of office, and his death at al-Qrayya in 1982."
