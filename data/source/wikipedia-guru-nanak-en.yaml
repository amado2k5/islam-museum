  ar: "مقالة ويكيبيديا الإنجليزية عن غورو ناناك (1469–1539)، مؤسس السيخية وأول غورواتها العشرة؛ تعرض ميلاده في تالواندي ووفاته في كرتاربور، وتعاليمه في وحدانية الله، ورحلاته المنسوبة إليه في الحكايات (الأوداسي) ومنها مكة وبغداد، وأبيات فرید الدین غنج شكر في الغورو غرانث صاحب ورفقة المسلم مردانا له."
  en: "English Wikipedia article on Guru Nanak (1469–1539), founder of Sikhism and the first of its ten Gurus; it sets out his birth at Talwandi and death at Kartarpur, his teaching of Ik Onkar, the journey traditions (udasis) attributed to him including Mecca and Baghdad, the verses of Fariduddin Ganjshakar in the Guru Granth Sahib, and the companionship of the Muslim musician Mardana."
