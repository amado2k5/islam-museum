reliability_note: "Read in full on 1 November 2026. The article is explicit that almost everything known of Nanak's life comes from the janamsakhi hagiographies, which mix history, mythology and teaching stories, and that modern scholarship disputes the travel narratives in particular: the Mecca and Baghdad journeys rest on later janamsakhi tradition, and the Baghdad inscription is read by some scholars as a 19th-century stone, so the western journey is recorded in the record as tradition, not as established itinerary. Its birth account sets the majority janamsakhi date of 15 April 1469 (Vaisakh, Samvat 1526) against the Bala janamsakhi's Kattak full moon, corresponding to 20 October 1469, which the Sikh community later adopted for the Gurpurab; its death date of 22 September 1539 rests on the Sikh records' own dating, whose stated age at death (70 years, 5 months, 7 days) is internally consistent with the April birth. The article's lead attests him as the founder of Sikhism and the first of the ten Sikh Gurus."
