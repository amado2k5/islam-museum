summary:
  ar: "مقابلة هيئة الأمم المتحدة للمرأة ⁦(حملة HeForShe)⁩ مع بواكاو بانشاميك؛ تُستخدم لوقائع الكيان فقط. يقدَّم فيها بطلاً للمواي تاي فاز ببطولة كي-وان ماكس مرتين، ويتحدث عن المساواة بين الجنسين، ويُدخل نفسه في كلامه ضمن البوذيين."
  en: "UN Women HeForShe interview with Buakaw Banchamek; used for entity facts only. It presents him as a Muay Thai champion who won the K-1 World MAX Championship twice, and in his own answers on gender equality he includes himself among Buddhists."
  es: "Entrevista de ONU Mujeres HeForShe con Buakaw Banchamek; utilizada únicamente para obtener información sobre la entidad. En ella se le presenta como campeón de Muay Thai que ganó dos veces el Campeonato Mundial K-1 MAX, y en sus propias respuestas sobre igualdad de género se incluye entre los budistas."
  fr: "Interview de Buakaw Banchamek par ONU Femmes dans le cadre du programme HeForShe; utilisée à titre informatif uniquement. Il y est présenté comme un champion de Muay Thaï ayant remporté deux fois le championnat du monde K-1 MAX, et dans ses réponses sur l’égalité des sexes, il se considère comme bouddhiste."
  ur: "UN Women HeForShe Buakaw Banchamek کے ساتھ انٹرویو؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے ایک موئے تھائی چیمپئن کے طور پر پیش کرتا ہے جس نے K-1 ورلڈ MAX چیمپئن شپ دو بار جیتا، اور صنفی مساوات پر اپنے جوابات میں اس نے خود کو بدھ مت کے ماننے والوں میں شامل کیا۔"
  tr: "Bwakkau Panchamik ile röportaj (HeForShe kampanyası) yalnızca varlık etkinlikleri için kullanılıyor. K-1 Max şampiyonluğunu iki kez kazanan bir Muay Thai şampiyonu yer alıyor, cinsiyet eşitliğinden bahsediyor ve konuşmasında kendini Budistler arasına yerleştiriyor."
  id: "Wawancara dengan Bwakkau Panchamik (kampanye HeForShe) hanya digunakan untuk acara entitas. Wawancara ini menampilkan seorang juara Muay Thai yang memenangkan kejuaraan K-1 Max dua kali, membahas kesetaraan gender, dan menempatkan dirinya di antara umat Buddha dalam pidatonya."
