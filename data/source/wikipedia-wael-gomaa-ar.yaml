  ar: "مقالة ويكيبيديا العربية عن وائل جمعة؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته مع غزل المحلة والأهلي والسيلية ومنتخب مصر، ولقبه «الصخرة»، وتذكر في صندوق معلوماتها أن مولده في قرية الشين بمحافظة الغربية وأن ديانته الإسلام بصيغة عامة، وتدرجه في تصنيف «مسلمون مصريون» دون تسمية أي مذهب له."
  en: "Arabic Wikipedia article on Wael Gomaa; used for entity facts only. It recounts his career at Ghazl El Mahalla, Al Ahly, Al-Sailiya and with the Egypt national team, and his nickname 'The Rock'; its infobox gives his birthplace as the village of El Shain in Gharbia and his religion as Islam, generically, and its categories file him under 'Egyptian Muslims', naming no school."
