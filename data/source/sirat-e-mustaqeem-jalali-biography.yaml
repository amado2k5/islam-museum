  en: "Official biography of Dr Muhammad Ashraf Asif Jalali on the website of his organisation Idarah Sirat-e-Mustaqeem Pakistan, read in full on 5 November 2026. It gives his birth on 12 April 1968 in Bhikhi Sharif, district Mandi Bahauddin; his full name Muhammad Ashraf Asif, son of Sufi Ghulam Sarwar; his memorisation of the Qur'an, Dars-e-Nizami studies (1984–1993), Arabic diploma at Mustansiriyah University Baghdad and PhD at the University of Punjab (2001); his bay'ah in 1981; his teaching in Lahore from the mid-1990s; his founding of Idarah Sirat Mustaqeem Pakistan on 11 May 2007; and that the organisation's present centre is in Lahore (Markaz Sirat Mustaqeem, Taj Bagh, Lahore)."
