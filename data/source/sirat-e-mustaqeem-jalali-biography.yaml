label:
  en: "Official biography of Dr Muhammad Ashraf Asif Jalali (Idarah Sirat-e-Mustaqeem)"
summary:
  ar: "السيرة الرسمية لمحمد أشرف آصف جلالي على موقع إدارة صراط مستقيم، كما قُرئت في 5 نوفمبر 2026."
  en: "Official biography of Dr Muhammad Ashraf Asif Jalali on the website of his organisation Idarah Sirat-e-Mustaqeem Pakistan, read in full on 5 November 2026. It gives his birth on 12 April 1968 in Bhikhi Sharif, district Mandi Bahauddin; his full name Muhammad Ashraf Asif, son of Sufi Ghulam Sarwar; his memorisation of the Qur'an, Dars-e-Nizami studies (1984–1993), Arabic diploma at Mustansiriyah University Baghdad and PhD at the University of Punjab (2001); his bay'ah in 1981; his teaching in Lahore from the mid-1990s; his founding of Idarah Sirat Mustaqeem Pakistan on 11 May 2007; and that the organisation's present centre is in Lahore (Markaz Sirat Mustaqeem, Taj Bagh, Lahore)."
  es: "Biografía oficial del Dr. Muhammad Ashraf Asif Jalali en el sitio web de su organización Idarah Sirat-e-Mustaqeem Pakistan, leída íntegramente el 5 de noviembre de 2026. En ella se indica que nació el 12 de abril de 1968 en Bhikhi Sharif, distrito de Mandi Bahauddin; su nombre completo Muhammad Ashraf Asif, hijo del sufí Ghulam Sarwar; su memorización del Corán, sus estudios de Dars-e-Nizami (1984-1993), su diploma en árabe en la Universidad Mustansiriyah de Bagdad y su doctorado en la Universidad de Punjab (2001); su bay'ah en 1981; su labor docente en Lahore desde mediados de la década de 1990; la fundación de Idarah Sirat Mustaqeem Pakistan el 11 de mayo de 2007; y que el centro actual de la organización se encuentra en Lahore (Markaz Sirat Mustaqeem, Taj Bagh, Lahore)."
  fr: "Biographie officielle du Dr Muhammad Ashraf Asif Jalali sur le site web de son organisation, Idarah Sirat-e-Mustaqeem Pakistan, consultée intégralement le 5 novembre 2026. Elle indique sa naissance le 12 avril 1968 à Bhikhi Sharif, district de Mandi Bahauddin; son nom complet, Muhammad Ashraf Asif, fils du soufi Ghulam Sarwar; sa mémorisation du Coran, ses études à Dars-e-Nizami (1984-1993), son diplôme d'arabe à l'Université Mustansiriyah de Bagdad et son doctorat à l'Université du Pendjab (2001); sa prestation de serment d'allégeance en 1981; son enseignement à Lahore à partir du milieu des années 1990; la fondation d'Idarah Sirat Mustaqeem Pakistan le 11 mai 2007; et que le centre actuel de l'organisation se trouve à Lahore (Markaz Sirat Mustaqeem, Taj Bagh, Lahore)."
