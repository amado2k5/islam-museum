summary:
  ar: "خبر قناة روسيا اليوم ⁦(RT بالعربية)⁩ عن توقيف مصطفى العدوي في 3 نوفمبر 2025 بعد مقطع مصور عن المتحف المصري الكبير، وإخلاء سبيله بكفالة عشرة آلاف جنيه بعد عرضه على النيابة في المنصورة."
