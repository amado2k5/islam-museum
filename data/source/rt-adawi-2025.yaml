  fr: "Le reportage de RT Arabic sur l'arrestation de Mostafa al-Adawi le 3 novembre 2025 après la diffusion d'une vidéo sur le Grand Musée Égyptien, et sa libération sous caution de 10 000 livres égyptiennes après son interrogatoire au parquet de Mansoura."
  ur: "RT عربی کی 3 نومبر 2025 کو گرینڈ مصری میوزیم کے بارے میں ایک ویڈیو کے بعد مصطفیٰ العدوی کی گرفتاری اور منصورہ پراسیکیوشن میں پوچھ گچھ کے بعد 10,000 مصری پاؤنڈز کی ضمانت پر رہائی کی رپورٹ۔"
