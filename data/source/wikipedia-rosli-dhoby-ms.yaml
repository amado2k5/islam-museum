summary:
  ar: "مقالة ويكيبيديا الملايوية عن روسلي دوبي؛ تُستخدم لوقائع الكيان فقط. تؤكد تاريخيه، وتوثّق إعدامه في سجن كوتشينغ المركزي مع ثلاثة من رفاقه، ودفنهم داخل السجن، ثم إعادة دفنهم سنة 1996 بتكريم رسمي في مقبرة أبطال سراواك قرب سيبو."
  en: "Malay Wikipedia article on Rosli Dhoby; used for entity facts only. It confirms his dates and records his hanging at Kuching Central Prison with three comrades, their burial inside the prison grounds, and their state-honoured reburial in 1996 at the Sarawak Warriors' Mausoleum near Sibu."
  es: "Artículo de Wikipedia en malayo sobre Rosli Dhoby; utilizado únicamente para datos sobre la persona. Confirma sus fechas y registra su ahorcamiento en la prisión central de Kuching junto con tres compañeros, su entierro dentro del recinto penitenciario y su posterior sepelio con honores de Estado en 1996 en el Mausoleo de los Guerreros de Sarawak, cerca de Sibu."
  fr: "Article Wikipédia en malais sur Rosli Dhoby; utilisé uniquement à titre informatif. Il confirme les dates de son existence et relate sa pendaison à la prison centrale de Kuching avec trois camarades, leur inhumation dans l'enceinte de la prison et leur réinhumation avec les honneurs d'État en 1996 au mausolée des guerriers du Sarawak près de Sibu."
  ur: "Rosli Dhoby پر مالائی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی تاریخوں کی تصدیق کرتا ہے اور تین ساتھیوں کے ساتھ کچنگ سینٹرل جیل میں اس کی پھانسی، جیل کے اندر ان کی تدفین، اور 1996 میں سیبو کے قریب سراواک واریرز کے مقبرے میں ان کی سرکاری اعزاز کے ساتھ تدفین کا ریکارڈ رکھتا ہے۔"
