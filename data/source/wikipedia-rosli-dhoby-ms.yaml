reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full on 1 November 2026. It gives his dates as 18 March 1932 – 2 March 1950, describes him as a Sarawak independence fighter of Malay descent, records that he stabbed Governor Duncan Stewart at Sibu on 3 December 1949, that he was hanged at Kuching on 2 March 1950 together with Morshidi Sidek, Awang Ramli and Bujang Suntong, that the four were buried unmarked within Kuching Central Prison, and that on 2 March 1996 they were reburied with a state funeral at the Sarawak Warriors' Mausoleum (Makam Pahlawan) near the Sibu divisional mosque. It names no school or branch for him."
