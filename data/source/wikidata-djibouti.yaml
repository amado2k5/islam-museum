summary:
  ar: "عنصر ويكيداتا Q977 لجيبوتي، كما ورد في ملخص بحثي زُوّد به المتحف ولم يفتح المتحف الصفحة: الاسم الرسمي جمهورية جيبوتي، وإحداثيات الموقع 11°48′ شمالاً و42°26′ شرقاً تقريباً، ومركزها الجغرافي 11°49′30.36″ شمالاً و42°35′25.08″ شرقاً، دولة ذات سيادة، عضو في الأمم المتحدة منذ 20 سبتمبر 1977 وفي جامعة الدول العربية والاتحاد الأفريقي والمنظمة الدولية للفرنكوفونية، واللغتان الرسميتان الفرنسية والعربية، واللغات المستعملة العربية الفصحى والصومالية والفرنسية والعفرية."
  en: "Wikidata item Q977 for Djibouti, as given in a research summary supplied to the museum; the museum did not open the page: the official name Republic of Djibouti, the coordinate location about 11 48 N 42 26 E (42 25 59.99), the geographic centre 11 49 30.36 N 42 35 25.08 E, a sovereign state, a United Nations member since 20 September 1977 and a member of the Arab League, the African Union and the Organisation internationale de la Francophonie, with French and Arabic as official languages and Modern Standard Arabic, Somali, French and Afar as languages used."
  ur: "جبوتی کا وکی ڈیٹا آئٹم Q977، جیسا ایک تحقیقی خلاصے میں ملا جو متحف کو دیا گیا؛ متحف نے صفحہ نہیں کھولا: سرکاری نام جمہوریہ جبوتی، مقام کے نقاط تقریباً 11°48′ شمال اور 42°26′ مشرق، جغرافیائی مرکز 11°49′30.36″ شمال اور 42°35′25.08″ مشرق، خودمختار ریاست، 20 ستمبر 1977 سے اقوام متحدہ کی رکن اور عرب لیگ، افریقی یونین اور فرانکوفونی کی بین الاقوامی تنظیم کی رکن، سرکاری زبانیں فرانسیسی اور عربی، استعمال ہونے والی زبانیں فصیح عربی، صومالی، فرانسیسی اور عفر۔"
  fr: "Élément Wikidata Q977 pour Djibouti, tel que donné dans un résumé de recherche fourni au musée ; le musée n'a pas ouvert la page : le nom officiel République de Djibouti, la localisation environ 11°48′ N 42°26′ E, le centre géographique 11°49′30,36″ N 42°35′25,08″ E, un État souverain, membre de l'ONU depuis le 20 septembre 1977 et de la Ligue arabe, de l'Union africaine et de l'Organisation internationale de la Francophonie, avec le français et l'arabe comme langues officielles et l'arabe standard moderne, le somali, le français et l'afar comme langues utilisées."
  es: "Entrada de Wikidata Q977 para Yibuti, tal como figura en un resumen de investigación entregado al museo; el museo no abrió la página: el nombre oficial República de Yibuti, la ubicación aproximadamente 11°48′ N 42°26′ E, el centro geográfico 11°49′30,36″ N 42°35′25,08″ E, un Estado soberano, miembro de la ONU desde el 20 de septiembre de 1977 y de la Liga Árabe, la Unión Africana y la Organización Internacional de la Francofonía, con el francés y el árabe como lenguas oficiales y el árabe estándar moderno, el somalí, el francés y el afar como lenguas usadas."
