reliability_note: "Encyclopedia entry of BlackPast (a scholarly reference project on African and African-American history), published 14 June 2008 and updated 20 May 2025; read in full on 24 October 2026. It records that his parents gave him a European name reflecting 'their Catholic faith', that he was sent to a Catholic mission school at seven, decided at thirteen to enter the Catholic priesthood, and attended the Libermann seminary in Dakar before switching to a secular lycée in 1926. Used, with Wikidata's religion statement, as the second independent attestation of his Catholicism."
