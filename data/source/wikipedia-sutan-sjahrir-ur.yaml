summary:
  ar: "مقالة ويكيبيديا الأردية عن سوتان صاهرير ⁦(1909ء–1966ء)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 5 مارچ 1909ء ووفاته في 9 اپریل 1966ء وخدمته أولَ وزيرِ اعظم لانڈونیشیا ⁦(1945ء–1947ء)⁩."
  en: "Urdu Wikipedia article on Sutan Sjahrir (1909–1966); used for entity facts only. It gives his birth on 5 March 1909, his death on 9 April 1966, and his service as Indonesia's first prime minister (1945–1947)."
  es: "Artículo de Wikipedia en urdu sobre Sutan Sjahrir (1909-1966); utilizado únicamente para datos sobre la persona. Indica su nacimiento el 5 de marzo de 1909, su fallecimiento el 9 de abril de 1966 y su mandato como primer ministro de Indonesia (1945-1947)."
  fr: "Article de Wikipédia en ourdou sur Sutan Sjahrir (1909-1966); utilisé uniquement pour les informations biographiques. Il indique sa naissance le 5 mars 1909, son décès le 9 avril 1966 et son mandat de premier ministre d'Indonésie (1945-1947)."
  ur: "اردو ویکیپیڈیا مضمون سوتن شہریر (1909-1966) پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 5 مارچ 1909 کو ان کی پیدائش، 9 اپریل 1966 کو ان کی موت، اور انڈونیشیا کے پہلے وزیر اعظم (1945–1947) کے طور پر ان کی خدمات پیش کرتا ہے۔"
  tr: "Sutan Sahirir (1909–1966) hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 5 Mart 1909'da doğdu, 9 Nisan 1966'da vefat etti ve Endonezya'nın ilk Başbakanı olarak görev yaptı (1945–1947)."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Sutan Sahirir (1909–1966); hanya digunakan untuk fakta entitas. Ia lahir pada 5 Maret 1909, meninggal pada 9 April 1966, dan menjabat sebagai Perdana Menteri pertama Indonesia (1945–1947)."
