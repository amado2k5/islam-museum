  ar: "مقالة ويكيبيديا العربية عن أحمد الشريف السنوسي (1873–1933)؛ تعطي ميلاده بالجغبوب في 18 ديسمبر 1873 (27 شوال 1290هـ نقلاً عن كتابه «الدر الفريد») ووفاته بالمدينة المنورة في 10 مارس 1933 ودفنه بالبقيع، وتزعّمه للحركة السنوسية خلفًا لعمه محمد المهدي."
