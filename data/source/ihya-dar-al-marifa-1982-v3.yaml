  ur: "دار المعرفہ بیروت کے ایڈیشن (1402ھ/1982ء) کی تیسری جلد، جس کے نیچے عراقی کی «المغنی عن حمل الاسفار» ہے؛ یہ ربعِ مہلکات کی پہلی کتاب «شرح عجائب القلب» سے شروع ہو کر «ذم الغرور» پر ختم ہوتی ہے۔ مکتبہ اسکندریہ کا اسکین۔"
