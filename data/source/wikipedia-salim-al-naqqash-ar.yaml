summary:
  ar: "مقالة ويكيبيديا العربية عن سليم النقاش؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تستند إلى «الأعلام» للزركلي و«معجم أعلام المورد»، تروي مولده في بيروت وانتقاله إلى الإسكندرية سنة 1876 وإصداره مع أديب إسحاق جرائد «مصر» و«التجارة» و«المحروسة»، وكتابه «مصر للمصريين»، ووفاته في الإسكندرية سنة 1884."
  en: "Arabic Wikipedia article on Salim al-Naqqash; used for entity facts only. A short article resting on al-Zirikli's al-A'lam and Baalbaki's Mu'jam A'lam al-Mawrid: born in Beirut, he moved to Alexandria in 1876 and with Adib Ishaq published the newspapers Misr, al-Tijara and al-Mahrousa, wrote Misr lil-Misriyyin, and died in Alexandria in 1884."
