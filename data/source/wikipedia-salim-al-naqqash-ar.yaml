summary:
  ar: "مقالة ويكيبيديا العربية عن سليم النقاش؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تستند إلى «الأعلام» للزركلي و«معجم أعلام المورد»، تروي مولده في بيروت وانتقاله إلى الإسكندرية سنة 1876 وإصداره مع أديب إسحاق جرائد «مصر» و«التجارة» و«المحروسة»، وكتابه «مصر للمصريين»، ووفاته في الإسكندرية سنة 1884."
  en: "Arabic Wikipedia article on Salim al-Naqqash; used for entity facts only. A short article resting on al-Zirikli's al-A'lam and Baalbaki's Mu'jam A'lam al-Mawrid: born in Beirut, he moved to Alexandria in 1876 and with Adib Ishaq published the newspapers Misr, al-Tijara and al-Mahrousa, wrote Misr lil-Misriyyin, and died in Alexandria in 1884."
  es: "Artículo de Wikipedia en árabe sobre Salim al-Naqqash; utilizado únicamente para datos sobre la persona. Un breve artículo basado en al-A'lam de al-Zirikli y Mu'jam A'lam al-Mawrid de Baalbaki: nacido en Beirut, se trasladó a Alejandría en 1876 y, junto con Adib Ishaq, publicó los periódicos Misr, al-Tijara y al-Mahrousa, escribió Misr lil-Misriyyin y falleció en Alejandría en 1884."
  fr: "Article de Wikipédia en arabe sur Salim al-Naqqash; utilisé uniquement à des fins d'information sur l'entité. Un court article s'appuyant sur al-Zirikli (al-A'lam) et Baalbaki (Mu'jam A'lam al-Mawrid): né à Beyrouth, il s'installe à Alexandrie en 1876 et publie avec Adib Ishaq les journaux Misr, al-Tijara et al-Mahrousa, écrit Misr lil-Misriyyin, et meurt à Alexandrie en 1884."
  ur: "سلیم النقاش پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ الزرقلی کے الاعلام اور بعلبکی کے معجم عالم المورد پر ایک مختصر مضمون: بیروت میں پیدا ہوئے، وہ 1876 میں اسکندریہ چلے گئے اور ادیب اسحاق کے ساتھ مل کر مصر، التجارہ اور المہروصہ اخبارات شائع کیے، مصر لیلۃ المصری میں لکھا اور 1848ء میں اسکندریہ میں وفات پائی۔"
  tr: "Salim Al-Naqqash hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Al-Zarkali'nin \"Al-A'lam\" ve \"Al-Mawrid Ünlüleri\" eserlerine dayanan kısa bir makale; Beyrut'taki doğumunu, 1876'da İskenderiye'ye taşınmasını, Adib Ishaq ile birlikte \"Misr\", \"Al-Tijara\" ve \"Al-Mahrousa\" gazetelerini yayımlaması, ayrıca \"Mısır için Mısır\" kitabını ve 1884'te İskenderiye'deki ölümünü anlatır."
  id: "Artikel Wikipedia Arab tentang Salim Al-Naqqash; digunakan hanya untuk fakta entitas. Sebuah artikel singkat berdasarkan \"Al-A'lam\" dan \"Al-Mawrid Notables\" karya Al-Zarkali, yang menceritakan kelahirannya di Beirut, kepindahannya ke Alexandria pada tahun 1876, dan publikasinya bersama Adib Ishaq atas surat kabar \"Misr,\" \"Al-Tijara,\" dan \"Al-Mahrousa,\" serta bukunya \"Egypt for the Egyptians,\" dan kematiannya di Alexandria pada tahun 1884."
