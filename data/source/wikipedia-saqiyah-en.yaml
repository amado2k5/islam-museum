summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الساقية؛ لوقائع الكيان فقط: آلة رفع ماء بسلسلة دلاء يديرها حيوان عبر تروس أفقية-عمودية، ترفع من عشرة إلى عشرين متراً مقابل ثلاثة للشادوف، أصلها محتمل مصر البطلمية أو فارس أو كوش أو الهند، شاهد اللوحة القبرية البطلمية القرن الثاني ق.م وقصة حرب قيصر 48 ق.م، استعمالها بقصير عمرة للحمّام الملكي، آلة الجزري المركبة ببقر على سطح خزان علوي وشفرات مائية بخزان سفلي، أول ذُقن ⁦(كرنك)⁩ معروف في ساقية عند الجزري وفكرة تقليل التقطع، استعمالها بدمشق منذ القرن الثالث عشر وانتشارها بالعالم الإسلامي وإسبانيا والهند، واشتقاق acequia الإسبانية من ساقية."
  en: "English Wikipedia article on the saqiyah; entity facts only: an animal-powered chain-of-pots water-lifter geared through horizontal and vertical wheels, raising water from ten to twenty metres against the shaduf's three, its possible invention in Ptolemaic Egypt, Persia, Kush or India, the 2nd-century-BC Ptolemaic tomb painting and the 48 BC Civil War episode, its use at Qusayr Amra for a royal bathhouse, al-Jazari's composite machine driven by an ox on an upper reservoir roof plus water falling onto scoop pallets below, the first known crank in a saqiya and the earliest implied minimising of intermittence in his designs, Damascus use since the 13th century, spread across the Islamic world, Spain and India, and the derivation of Spanish acequia from saqiya."
  es: "Artículo de la Wikipedia en inglés sobre la saqiyah; solo datos sobre la entidad: un elevador de agua de cadena de ollas accionado por animales mediante engranajes horizontales y verticales, que eleva el agua de diez a veinte metros frente a los tres del shaduf, su posible invención en el Egipto ptolemaico, Persia, Kush o India, la pintura de la tumba ptolemaica del siglo II a. C. y el episodio de la Guerra Civil del 48 a. C., su uso en Qusayr Amra para un baño real, la máquina compuesta de al-Jazari impulsada por un buey en el techo de un depósito superior más el agua que cae sobre paletas de recolección debajo, la primera manivela conocida en una saqiya y la primera minimización implícita de la intermitencia en sus diseños, uso en Damasco desde el siglo XIII, extendido por todo el mundo islámico, España e India, y la derivación de la acequia española de saqiya."
  fr: "Article de Wikipédia en anglais sur la saqiyah; faits concernant l’objet uniquement: un système de levage d’eau actionné par une chaîne de pots à propulsion animale, enclenché par des roues horizontales et verticales, élevant l’eau de dix à vingt mètres contre trois pour le chadouf; son invention possible en Égypte ptolémaïque, en Perse, à Koush ou en Inde; la peinture d’une tombe ptolémaïque du IIe siècle av. J.-C. et l’épisode de la guerre civile de 48 av. J.-C.; son utilisation à Qusayr Amra pour un bain royal; la machine composite d’al-Jazari, actionnée par un bœuf sur le toit d’un réservoir supérieur et l’eau tombant sur des palettes en contrebas; la première manivelle connue dans une saqiyah et la première minimisation implicite de l’intermittence dans ses conceptions; son utilisation à Damas depuis le XIIIe siècle; sa diffusion dans le monde islamique, en Espagne et en Inde; et l’origine du mot espagnol acequia à partir de saqiyah."
  ur: "سقیہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: افقی اور عمودی پہیوں کے ذریعے تیار کردہ جانوروں سے چلنے والی چین آف پاٹس واٹر لفٹر، شدوف کے تینوں کے مقابلے میں پانی کو دس سے بیس میٹر تک بڑھاتا ہے، بطلیما مصر، فارس، کش یا ہندوستان میں اس کی ممکنہ ایجاد، دوسری صدی سے قبل از مسیح اور CMB 4-8 کی پینٹنگ۔ قسط، شاہی حمام کے لیے قصیر امرا میں اس کا استعمال، الجزاری کی جامع مشین جو ایک بیل کے ذریعے چلائی گئی بالائی حوض کی چھت پر اور پانی جو نیچے کے ٹکڑوں پر گرتا ہے، ساقیہ میں پہلا مشہور کرینک اور اس کے استعمال کے بعد اسلامی دنیا میں سب سے اولین مفہوم ہے، اسلامی دنیا میں اس کے استعمال اور 3 ویں صدی کے بعد سے اسپام کے پھیلاؤ میں۔ ہندوستان، اور ساقیہ سے ہسپانوی اکیویا کا ماخوذ۔"
  tr: "Su çarkı hakkında İngilizce Wikipedia makalesi; sadece varlık için gerçekler: yatay-dikey dişlilerle çalışan bir hayvan tarafından çalıştırılan bir dizi kovaya sahip su kaldırma makinesi, şaduf için üç metreye kıyasla on ila yirmi metre arasında yükseltilmiş, muhtemelen Ptolemaios Mısırı, Pers, Kuş veya Hindistan'dan gelmektedir. M.Ö. ikinci yüzyıla ait Ptolemaios mezar taşı plaketine ve MÖ 48'deki Sezar savaşının hikayesine, kraliyet hamamı için kısa bir umre olarak kullanımına, üst tankın üstüne ineklerin monte edildiği ve alt tankta su bıçaklarının bulunduğu Jazari makinesine, Al-Jazari'deki su çarkındaki bilinen ilk krank (karnak) ve parçalanmayı azaltma fikrine bakınız. On üçüncü yüzyıldan itibaren Şam'da kullanımı ve İslam dünyasına, İspanya'ya yayılması, ayrıca İspanyol acequia'nın su çarkı kökenine sahip olması."
  id: "Artikel Wikipedia bahasa Inggris tentang roda air; hanya untuk fakta entitas: mesin pengangkat air dengan serangkaian ember yang dioperasikan oleh hewan menggunakan roda gigi horizontal-vertikal, dinaikkan dari sepuluh hingga dua puluh meter dibandingkan tiga meter untuk shaduf, kemungkinan berasal dari Mesir Ptolemaik, Persia, Kush, atau India. Lihat plakat batu nisan Ptolemaik dari abad kedua SM dan kisah perang Caesar pada tahun 48 SM, penggunaannya sebagai umrah pendek untuk pemandian kerajaan, mesin Jazari yang dipasang dengan sapi di atas tangki atas dan bilah air di kolam bawah, engkol (karnak) pertama yang diketahui dalam roda air di Al-Jazari, serta gagasan mengurangi fragmentasi. Penggunaannya di Damaskus sejak abad ketiga belas dan penyebarannya ke seluruh dunia Islam, Spanyol, dan India, serta acequia Spanyol berasal dari roda air."
