summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الساقية؛ لوقائع الكيان فقط: آلة رفع ماء بسلسلة دلاء يديرها حيوان عبر تروس أفقية-عمودية، ترفع من عشرة إلى عشرين متراً مقابل ثلاثة للشادوف، أصلها محتمل مصر البطلمية أو فارس أو كوش أو الهند، شاهد اللوحة القبرية البطلمية القرن الثاني ق.م وقصة حرب قيصر 48 ق.م، استعمالها بقصير عمرة للحمّام الملكي، آلة الجزري المركبة ببقر على سطح خزان علوي وشفرات مائية بخزان سفلي، أول ذُقن ⁦(كرنك)⁩ معروف في ساقية عند الجزري وفكرة تقليل التقطع، استعمالها بدمشق منذ القرن الثالث عشر وانتشارها بالعالم الإسلامي وإسبانيا والهند، واشتقاق acequia الإسبانية من ساقية."
  en: "English Wikipedia article on the saqiyah; entity facts only: an animal-powered chain-of-pots water-lifter geared through horizontal and vertical wheels, raising water from ten to twenty metres against the shaduf's three, its possible invention in Ptolemaic Egypt, Persia, Kush or India, the 2nd-century-BC Ptolemaic tomb painting and the 48 BC Civil War episode, its use at Qusayr Amra for a royal bathhouse, al-Jazari's composite machine driven by an ox on an upper reservoir roof plus water falling onto scoop pallets below, the first known crank in a saqiya and the earliest implied minimising of intermittence in his designs, Damascus use since the 13th century, spread across the Islamic world, Spain and India, and the derivation of Spanish acequia from saqiya."
  es: "Artículo de la Wikipedia en inglés sobre la saqiyah; solo datos sobre la entidad: un elevador de agua de cadena de ollas accionado por animales mediante engranajes horizontales y verticales, que eleva el agua de diez a veinte metros frente a los tres del shaduf, su posible invención en el Egipto ptolemaico, Persia, Kush o India, la pintura de la tumba ptolemaica del siglo II a. C. y el episodio de la Guerra Civil del 48 a. C., su uso en Qusayr Amra para un baño real, la máquina compuesta de al-Jazari impulsada por un buey en el techo de un depósito superior más el agua que cae sobre paletas de recolección debajo, la primera manivela conocida en una saqiya y la primera minimización implícita de la intermitencia en sus diseños, uso en Damasco desde el siglo XIII, extendido por todo el mundo islámico, España e India, y la derivación de la acequia española de saqiya."
