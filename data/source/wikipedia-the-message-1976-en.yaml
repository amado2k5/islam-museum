reliability_note: "Pointer for entity facts only, used where the article cites a source: London premiere 29 July 1976 (Variety, 7 July 1976) and New York 9 March 1977; running times 178 minutes (English) and 207 minutes (Arabic, BBFC record of 20 August 1976); budget 17 million dollars and gross about 5 million (Medved and Medved 1984); title change five days before the London opening after threatening calls (The Times, 27 July 1976; The Guardian, 29 July 1976); filming in Morocco from April 1974 stopped on 5 August 1974, then Libya October 1974 to May 1975 (Kansas City Star 1975; Berkeley Gazette 1975); bans in Egypt, Kuwait and Saudi Arabia, the last until 2018 (NPR 2016; Variety 11 June 2018); the March 1977 Washington siege (Brockopp 2010; Deming); the Hindi-Urdu dub of December 2007 and the Hyderabad stoppage of February 2008 (India Forums; rediff 23 February 2008); the 4K restoration at the Dubai International Film Festival in December 2017; the critics' notices (Sunday Times, Variety, Los Angeles Times, Chicago Tribune, Evening Standard, AP, New York Times, Monthly Film Bulletin); the nomination for Best Original Score at the 50th Academy Awards. Lines marked 'citation needed' (the Muslim World League's rejection, the deaths during the siege) are not used. Read in Chrome on 6 November 2026."
