reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth name Mirza Ali Gauhar, his birth on 25 June 1728 at Shahjahanabad, his two reigns (1760-1788 and 1788-1806), his blinding by Ghulam Qadir in 1788, his Diwan and the pen name Aftab, his Ajaib-ul-Qasas, and his death on 19 November 1806 at Delhi. Its infobox gives his religion as Sunni Islam (Hanafi) — a structured attestation the article body does not corroborate and no other consulted source repeats for the man himself; the museum's record preserves it in the faith note and does not settle a school on it. Checked 1 November 2026."
