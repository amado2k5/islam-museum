  en: "Sunan Drajat — Indonesian Wikipedia"
summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن سونن درجات؛ صندوق معلوماتها ⁦(قالب عالم مسلم)⁩ يعطي طائفته سنّية وحقل فقهه فارغًا، وأساتذته سونن أمبل وسونن غونونغ جاتي، ووفاته 1533 في لامونغان، وتسرد فلسفته الاجتماعية في محاربة الفقر وتلحينه التمبانغ «بنكور»."
  en: "Indonesian Wikipedia article on Sunan Drajat; its Muslim-scholar infobox gives his denomination as Sunni with the jurisprudence field blank, names Sunan Ampel and Sunan Gunung Jati as his teachers, and gives his death in 1533 at Lamongan; the text recounts his social philosophy against poverty and his composing of the tembang Pangkur."
  es: "Artículo de la Wikipedia en indonesio sobre Sunan Drajat; su ficha informativa sobre el erudito musulmán indica que se identificaba como sunita, dejando en blanco el campo de jurisprudencia, nombrando a Sunan Ampel y Sunan Gunung Jati como sus maestros, y mencionando su muerte en 1533 en Lamongan; el texto relata su filosofía social contra la pobreza y la composición del tembang Pangkur."
  fr: "L'article de Wikipédia indonésien sur Sunan Drajat; son infobox sur les érudits musulmans indique qu'il est sunnite, le champ « jurisprudence » étant vide, cite Sunan Ampel et Sunan Gunung Jati comme ses maîtres, et mentionne sa mort en 1533 à Lamongan; le texte relate sa philosophie sociale contre la pauvreté et la composition du tembang Pangkur."
  ur: "سنن دراجات پر انڈونیشیائی ویکیپیڈیا مضمون؛ اس کا مسلم اسکالر انفو باکس فقہی فیلڈ خالی کے ساتھ اپنے فرقے کو سنی دیتا ہے، سنن امپل اور سنن گنونگ جاتی کو اپنے اساتذہ کے طور پر نامزد کرتا ہے، اور 1533 میں لامونگن میں ان کی موت بتاتا ہے۔ متن غربت کے خلاف اس کے سماجی فلسفے اور ٹیمبانگ پنگکور کی اس کی تشکیل کو بیان کرتا ہے۔"
  tr: "Endonezya Vikipedi'sinde Sunen Dajdat hakkında yer alan bilgi kutusu (Müslüman alim şablonu), mezhebi Sünniliği ve boş bir hukuk alanı, öğretmenleri Sunen Ambel ve Sunen Gunung Jati'yi, 1533'te Lamungan'da ölmesini ve yoksullukla mücadele sosyal felsefesini ve tambang (Benkor) yazmasını anlatır."
  id: "Artikel Wikipedia Indonesia tentang Sunen Dajdat; infobox (template ulama Muslim) memuat aliran Sunniisme dan bidang hukum kosong, gurunya Sunen Ambel dan Sunen Gunung Jati, serta kematiannya pada tahun 1533 di Lamungan, yang menceritakan filosofi sosialnya dalam memerangi kemiskinan dan komposisi tambang (Benkor)."
