  ar: "مقالة ويكيبيديا الإندونيسية عن سونن درجات؛ صندوق معلوماتها (قالب عالم مسلم) يعطي طائفته سنّية وحقل فقهه فارغًا، وأساتذته سونن أمبل وسونن غونونغ جاتي، ووفاته 1533 في لامونغان، وتسرد فلسفته الاجتماعية في محاربة الفقر وتلحينه التمبانغ «بنكور»."
  en: "Indonesian Wikipedia article on Sunan Drajat; its Muslim-scholar infobox gives his denomination as Sunni with the jurisprudence field blank, names Sunan Ampel and Sunan Gunung Jati as his teachers, and gives his death in 1533 at Lamongan; the text recounts his social philosophy against poverty and his composing of the tembang Pangkur."
