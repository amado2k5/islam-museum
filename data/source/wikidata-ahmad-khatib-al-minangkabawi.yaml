  ur: "احمد خطیب المننگکابوی کے لیے ویکی ڈیٹا آئٹم Q4260016؛ اس میں ان کی پیدائش 26 جون 1860 ہے، اس کی موت صرف 1916 میں ہے، اور مکہ کو ان کی موت کا مقام ہے، اور اس کے مذہب کو عام طور پر اسلام کے طور پر پیش کیا گیا ہے، جس میں کوئی اسکول نہیں ہے۔"
