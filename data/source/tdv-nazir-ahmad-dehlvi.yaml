  ar: "مدخل نذير أحمد الدهلوي في موسوعة الإسلام التركية (TDV)؛ تُستخدم لوقائع الكيان فقط. يحسم سنة مولده بأنها 6 ديسمبر 1830 وأن تاريخ 1833 خطأ، ويفصّل مسيرته في التعليم والإدارة وحيدر آباد ومؤلفاته وتواريخ طبعاتها."
  en: "Entry 'NEZÎR AHMED DİHLEVÎ' in the TDV İslâm Ansiklopedisi; used for entity facts only. It adjudicates his birth as 6 December 1830 and states expressly that the 1833 date is wrong, and details his career in education, the revenue service and Hyderabad, and his works with their print dates."
