reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia, resting on Iftikhar Ahmad Siddiqi's monograph on Nazir Ahmad (Lahore, 1971), Cemil Calibi's history of Urdu literature, Abdul Qadir, Minault and Oesterheld. Read in full on 25 October 2026. On the birth year it is decisive: 'born on 6 December 1830 in the village of Rehar near Bijnor; the information that he was born in 1833 is wrong' (citing Siddiqi, pp. 21–22) — the person record follows it. It adds: his study under Nasrullah Khan (three years from age nine) and under Mawlvi Abdul Khaliq in Delhi; the Arabic section of Delhi College (January 1846 – 1854); elementary English learned privately from Munshi Abdullah Khan, not the college's English programme, at his father's insistence; his marriage in early 1851 to Abdul Khaliq's granddaughter through his son Abdul Qadir; his teachers Ram Chandra and Mamluk Ali Nanautawi; the Allahabad deputy-inspector post after 1857; the first place in the examination that took him into the revenue service and the 1863 deputy-collectorship at Kanpur and Gorakhpur (the origin of 'Deputy'); Hyderabad service from 27 April 1877 at Rs 1,200 (the Urdu article gives Rs 800); the seven treatises written for the young Nizam Mir Mahbub Ali Khan's education at Salar Jung I's request; his memorising the Qur'an in six months at Hyderabad; resignation in February 1884; the Shamsul Ulema title dated 22 June 1894 (the Urdu article gives 1897); the Edinburgh honorary doctorate of 3 April 1903 (the Urdu article gives 1902); forty-four lectures 1888–1905; death on Friday 3 May 1912 and burial in the Khwaja Baqi Billah cemetery, Delhi. On works it dates the Qur'an translation's completion to 1895, Binat-un-Nash to 1872, Tawbat-un-Nasuh to 1874 and Ruya-e-Sadiqa to 1894, and records the government's purchase of 2,000 copies of Mirat-ul-Uroos and its adoption in school curricula. It names no school for him; his ancestors' link to the Chishti-Sabiri shaykh Abdul Quddus Gangohi is family background."
