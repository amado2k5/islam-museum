summary:
  ar: "مدخل نذير أحمد الدهلوي في موسوعة الإسلام التركية (TDV)؛ تُستخدم لوقائع الكيان فقط. يحسم سنة مولده بأنها 6 ديسمبر 1830 وأن تاريخ 1833 خطأ، ويفصّل مسيرته في التعليم والإدارة وحيدر آباد ومؤلفاته وتواريخ طبعاتها."
  en: "Entry 'NEZÎR AHMED DİHLEVÎ' in the TDV İslâm Ansiklopedisi; used for entity facts only. It adjudicates his birth as 6 December 1830 and states expressly that the 1833 date is wrong, and details his career in education, the revenue service and Hyderabad, and his works with their print dates."
  es: "Entrada 'NEZÎR AHMED DİHLEVÎ' en el TDV İslâm Ansiklopedisi; utilizada únicamente para datos sobre la persona. Determina que nació el 6 de diciembre de 1830 y declara expresamente que la fecha de 1833 es errónea, y detalla su trayectoria profesional en la educación, el servicio de hacienda y Hyderabad, así como sus obras con sus fechas de impresión."
  fr: "L'entrée « NEZÎR AHMED DİHLEVÎ » dans la TDV İslâm Ansiklopedisi, utilisée uniquement à des fins d'information sur l'entité, indique sa naissance au 6 décembre 1830 et précise que la date de 1833 est erronée. Elle détaille sa carrière dans l'éducation, l'administration fiscale et à Hyderabad, ainsi que ses œuvres et leurs dates d'impression."
  ur: "TDV İslâm Ansiklopedisi میں 'NEZÎR AHMED DİHLEVÎ' کا اندراج؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 6 دسمبر 1830 بتائی گئی ہے اور واضح طور پر کہا گیا ہے کہ 1833 کی تاریخ غلط ہے، اور تعلیم، ریونیو سروس اور حیدرآباد میں ان کے کیریئر کی تفصیلات اور ان کے کاموں کو ان کی پرنٹ تاریخوں کے ساتھ بیان کیا گیا ہے۔"
  tr: "Nadhir Ahmad Dehlawi'nin Türk İslam Ansiklopedisi'ndeki (TDV) maddesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğum yılının 6 Aralık 1830 olduğunu, 1833'ün yanlış olduğunu belirtir ve eğitim, idare, Haydarabad kariyerini, yayınlarını ve bunların baskı tarihlerini detaylandırır."
  id: "Entri Nadhir Ahmad Dehlawi dalam Ensiklopedia Islam Turki (TDV); hanya digunakan untuk fakta entitas. Ia menyatakan bahwa tahun kelahirannya adalah 6 Desember 1830, dan 1833 tidak benar, serta merinci kariernya di bidang pendidikan, administrasi, Hyderabad, publikasinya, dan tanggal edisinya."
