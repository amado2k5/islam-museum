summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أتوبيلي مولوزي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في ليلونغوي سنة 1978 نجلا للرئيس باكيلي مولوزي، وعضويته في البرلمان عن ماشينغا الشمالية الشرقية (2004–2019) وقيادته الجبهة الديمقراطية للوحدة، واعتقاله سنة 2012 وحقائبه الوزارية في حكومتي باندا وموثاريكا وترشحه الرئاسي سنة 2019 ومرافقته موثاريكا نائبا سنة 2020. يصفه متنها بأنه مسلم، دون مدرسة."
  en: "English Wikipedia article on Atupele Muluzi; used for entity facts only. It recounts his birth in Lilongwe in 1978, the son of President Bakili Muluzi, his parliamentary seat for Machinga North East (2004–2019) and leadership of the United Democratic Front, his 2012 arrest, his ministerial posts under Presidents Banda and Mutharika, his 2019 presidential candidacy and his 2020 place as Mutharika's running mate. Its text calls him a Muslim and names no school."
