summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أتوبيلي مولوزي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في ليلونغوي سنة 1978 نجلا للرئيس باكيلي مولوزي، وعضويته في البرلمان عن ماشينغا الشمالية الشرقية (2004–2019) وقيادته الجبهة الديمقراطية للوحدة، واعتقاله سنة 2012 وحقائبه الوزارية في حكومتي باندا وموثاريكا وترشحه الرئاسي سنة 2019 ومرافقته موثاريكا نائبا سنة 2020. يصفه متنها بأنه مسلم، دون مدرسة."
  en: "English Wikipedia article on Atupele Muluzi; used for entity facts only. It recounts his birth in Lilongwe in 1978, the son of President Bakili Muluzi, his parliamentary seat for Machinga North East (2004–2019) and leadership of the United Democratic Front, his 2012 arrest, his ministerial posts under Presidents Banda and Mutharika, his 2019 presidential candidacy and his 2020 place as Mutharika's running mate. Its text calls him a Muslim and names no school."
  es: "Artículo de la Wikipedia en inglés sobre Atupele Muluzi; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Lilongwe en 1978, su condición de hijo del presidente Bakili Muluzi, su escaño parlamentario por Machinga Noreste (2004-2019) y su liderazgo del Frente Democrático Unido, su arresto en 2012, sus cargos ministeriales bajo los presidentes Banda y Mutharika, su candidatura presidencial en 2019 y su elección como compañero de fórmula de Mutharika en 2020. El texto lo describe como musulmán y no menciona ninguna escuela."
  fr: "Article Wikipédia en anglais sur Atupele Muluzi; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Lilongwe en 1978, son statut de fils du président Bakili Muluzi, son mandat de député de Machinga Nord-Est (2004-2019) et son rôle à la tête du Front démocratique uni, son arrestation en 2012, ses fonctions ministérielles sous les présidences de Banda et Mutharika, sa candidature à l'élection présidentielle de 2019 et sa nomination comme colistier de Mutharika en 2020. Le texte le présente comme musulman et ne mentionne aucun établissement scolaire."
