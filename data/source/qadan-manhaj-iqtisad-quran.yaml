label:
  ar: منهج القرآن في الاقتصاد — زيدان عبد الفتاح قعدات
  en: The Qur'anic Method in Economics — Ziyadan Abd al-Fattah Qa'dat
summary:
  ar: "كتاب في الاقتصاد من منظور قرآني لزيدان عبد الفتاح قعدات، يعرض فيه المؤلف معنى الاقتصاد في القرآن بوصفه التوازن والاعتدال والعدل، ثم ينقد المذهبين الرأسمالي والشيوعي، ويعرض عناصر الإنتاج والموارد الطبيعية وأنواع النشاط الطبيعي وغير الطبيعي والإنفاق والاكتناز. نُشر في منشورات جمعية الدعوة الإسلامية العالمية، وفي صفحة العنوان تاريخ هجري: رجب 1399."
  en: "A study of economics from a Qur'anic standpoint by Ziyadan Abd al-Fattah Qa'dat. The author treats the meaning of economics in the Qur'an as balance, moderation and justice, criticises the capitalist and communist systems, and sets out the factors of production, natural resources, natural and unnatural activity, spending and hoarding. Published by the World Islamic Call Society; the title page gives the Hijri date Rajab 1399."
  es: "Un estudio de economía desde una perspectiva coránica, de Ziyadan Abd al-Fattah Qa'dat. El autor aborda el significado de la economía en el Corán como equilibrio, moderación y justicia, critica los sistemas capitalista y comunista, y expone los factores de producción, los recursos naturales, la actividad natural y artificial, el gasto y el acaparamiento. Publicado por la Sociedad Islámica Mundial; la portada indica la fecha Hijri: Rajab 1399."
  fr: "Une étude de l'économie d'un point de vue coranique par Ziyadan Abd al-Fattah Qa'dat. L'auteur y aborde la signification de l'économie dans le Coran, envisagée comme un équilibre, une modération et une justice, critique les systèmes capitaliste et communiste, et expose les facteurs de production, les ressources naturelles, les activités naturelles et artificielles, la consommation et l'accumulation. Publié par la World Islamic Call Society, l'ouvrage porte la date hégirienne de Rajab 1399."
  ur: "زیادان عبد الفتاح قدات کی طرف سے قرآنی نقطہ نظر سے معاشیات کا مطالعہ۔ مصنف نے قرآن میں معاشیات کے مفہوم کو توازن، اعتدال اور انصاف کے طور پر پیش کیا ہے، سرمایہ دارانہ اور اشتراکی نظاموں پر تنقید کی ہے، اور پیداوار، قدرتی وسائل، قدرتی اور غیر فطری سرگرمیوں، خرچ اور ذخیرہ اندوزی کے عوامل کا تعین کیا ہے۔ ورلڈ اسلامک کال سوسائٹی کے ذریعہ شائع کردہ؛ عنوان کے صفحے پر ہجری تاریخ رجب 1399 ہے۔"
  tr: "Zidan Abdel Fattah Qaadat'ın Kur'an bakış açısından ekonomi üzerine yazdığı bir kitap, yazarın Kur'an'daki ekonominin denge, denge ve adalet anlamını sunması, kapitalist ve komünist düşünce okullarını eleştirmesi ve üretim, doğal kaynaklar, doğal ve yapay faaliyet türleri, harcama ve biriktirme unsurlarını sunmasıdır. Dünya İslami Davah Derneği yayınlarında, Hicri tarih: Recep 1399 başlık sayfasında yayımlanmıştır."
  id: "Sebuah buku tentang ekonomi dari perspektif Al-Qur'an oleh Zidan Abdel Fattah Qaadat, di mana penulis menyajikan makna ekonomi dalam Al-Qur'an sebagai keseimbangan, keseimbangan, dan keadilan, kemudian mengkritik aliran pemikiran kapitalis dan komunis, serta menyajikan unsur produksi, sumber daya alam, jenis aktivitas alami dan tidak alami, pengeluaran, dan penimbunan. Diterbitkan dalam publikasi Asosiasi Da'wah Islam Dunia, pada halaman judul tanggal Hijriah: Rajab 1399."
