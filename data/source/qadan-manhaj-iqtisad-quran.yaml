summary:
  ar: "كتاب في الاقتصاد من منظور قرآني لزيدان عبد الفتاح قعدات، يعرض فيه المؤلف معنى الاقتصاد في القرآن بوصفه التوازن والاعتدال والعدل، ثم ينقد المذهبين الرأسمالي والشيوعي، ويعرض عناصر الإنتاج والموارد الطبيعية وأنواع النشاط الطبيعي وغير الطبيعي والإنفاق والاكتناز. نُشر في منشورات جمعية الدعوة الإسلامية العالمية، وفي صفحة العنوان تاريخ هجري: رجب 1399."
  en: "A study of economics from a Qur'anic standpoint by Ziyadan Abd al-Fattah Qa'dat. The author treats the meaning of economics in the Qur'an as balance, moderation and justice, criticises the capitalist and communist systems, and sets out the factors of production, natural resources, natural and unnatural activity, spending and hoarding. Published by the World Islamic Call Society; the title page gives the Hijri date Rajab 1399."
