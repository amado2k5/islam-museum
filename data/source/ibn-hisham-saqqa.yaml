label: { ar: "السيرة النبوية لابن هشام — طبعة السقا 1355هـ/1936م", en: "al-Sira al-Nabawiyya — Ibn Hisham, al-Saqqa edition (1355/1936)" }
summary:
  ar: "الجزء الرابع من سيرة ابن إسحاق برواية ابن هشام، بتحقيق مصطفى السقا وإبراهيم الأبياري وعبد الحفيظ شلبي، مطبعة مصطفى البابي الحلبي وأولاده بمصر، الطبعة الأولى 1355هـ/1936م. يستشهد به في المتحف بصيغة {cite:ibn-hisham-saqqa 4/N} حيث N رقم الصفحة المطبوعة."
  en: "Juz' 4 of Ibn Ishaq's Sira in Ibn Hisham's recension, edited by Mustafa al-Saqqa, Ibrahim al-Abyari and Abd al-Hafiz Shalabi; Mustafa al-Babi al-Halabi, Cairo, first printing 1355/1936. Cited as {cite:ibn-hisham-saqqa 4/N} where N is the printed page."
  es: "Juz' 4 de Sira de Ibn Ishaq en la recensión de Ibn Hisham, editado por Mustafa al-Saqqa, Ibrahim al-Abyari y Abd al-Hafiz Shalabi; Mustafa al-Babi al-Halabi, El Cairo, primera impresión 1355/1936. Citado como {cite:ibn-hisham-saqqa 4/N} donde N es la página impresa."
  fr: "Juz' 4 de la Sira d'Ibn Ishaq dans la recension d'Ibn Hisham, édité par Mustafa al-Saqqa, Ibrahim al-Abyari et Abd al-Hafiz Shalabi; Mustafa al-Babi al-Halabi, Le Caire, premier tirage 1355/1936. Cité comme {cite:ibn-hisham-saqqa 4/N} où N est la page imprimée."
  ur: "ابن ہشام کی تجدید میں ابن اسحاق کی سیرت کا جز 4، جس کی تدوین مصطفیٰ الصقاء، ابراہیم العبیاری اور عبد الحفیظ شلبی نے کی ہے۔ مصطفٰی البابی الحلبی، قاہرہ، پہلی طباعت 1355/1936۔ بطور حوالہ {حوالہ: ابن ہشام-صقاء 4/N} جہاں N مطبوعہ صفحہ ہے۔"
  tr: "İbn İshaq'ın biyografisinin dördüncü bölümü, Mustafa Al-Saqqa, İbrahim El-Abyari ve Abdul Hafiz Şalebi tarafından düzenlenen İbn Hişam anlatımına göre, Mısır'da Mustafa Al-Babi Al-Halabi ve Oğulları Matbaası, ilk baskı 1355 Hicri / 1936 M.S. Müzede {cite:ibn-hisham-saqqa 4/N} formatında yer almaktadır; burada N basılı sayfa numarasıdır."
  id: "Bagian keempat biografi Ibn Ishaq menurut narasi Ibn Hisham, disunting oleh Mustafa Al-Saqqa, Ibrahim Al-Abyari, dan Abdul Hafiz Shalabi, Mustafa Al-Babi Al-Halabi and Sons Press di Mesir, edisi pertama 1355 H / 1936 M. Buku ini dikutip di museum dalam format {cite:ibn-hisham-saqqa 4/N} di mana N adalah nomor halaman cetak."
