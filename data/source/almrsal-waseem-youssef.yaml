summary:
  ar: "سيرة وسيم يوسف في موقع المرسال؛ تذكر اسمه الكامل ودراسته الجامعية والماجستير وخطابته في جامع الشيخ زايد الكبير، وهي من مراجع مقالة ويكيبيديا العربية عنه."
  en: "Al-Marsal's biography of Waseem Youssef; it gives his full name, his bachelor's and master's studies and his preaching at the Sheikh Zayed Grand Mosque, and is one of the references of his Arabic Wikipedia article."
  es: "La biografía de Waseem Youssef escrita por Al-Marsal incluye su nombre completo, sus estudios de licenciatura y maestría, y su predicación en la Gran Mezquita Sheikh Zayed. Además, es una de las referencias de su artículo en la Wikipedia en árabe."
  fr: "La biographie de Waseem Youssef par Al-Marsal; elle donne son nom complet, ses études de licence et de maîtrise et ses prédications à la Grande Mosquée Sheikh Zayed, et est l'une des références de son article Wikipédia en arabe."
  ur: "وسیم یوسف کی المرسل کی سوانح عمری؛ اس میں ان کا پورا نام، ان کے بیچلر اور ماسٹرز کی تعلیم اور شیخ زاید گرینڈ مسجد میں ان کی تبلیغ بتائی گئی ہے، اور یہ ان کے عربی ویکیپیڈیا مضمون کے حوالہ جات میں سے ایک ہے۔"
