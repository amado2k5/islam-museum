summary:
  ar: "عنصر ويكي بيانات Q17410819 لفؤاد معصوم، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته سنة 1938 ومكان ولادته كوي سنجق، وقيمة دين هي الإسلام السني، وهي والترجمة البنيوية لقيمة صندوق معلومات المقالة الإنجليزية أسرة مصدرية واحدة."
  en: "Wikidata item Q17410819 for Fuad Masum, grounded through the English article's pageprops; used for entity facts only. It gives his birth in 1938, his birthplace as Koy Sanjaq, and a religion value of Sunni Islam — the structured echo of the English article's infobox value, one source family with it."
  es: "Elemento de Wikidata Q17410819 para Fuad Masum, basado en los pageprops del artículo en inglés; utilizado únicamente para datos de la entidad. Indica que nació en 1938, que su lugar de nacimiento es Koy Sanjaq y que su religión es el islam sunita, lo que refleja el valor del infobox del artículo en inglés, perteneciente a una familia de fuentes similar."
  fr: "L'élément Wikidata Q17410819 concernant Fuad Masum, basé sur les propriétés de la page de l'article anglais, est utilisé uniquement pour les informations sur l'entité. Il indique sa date de naissance en 1938, son lieu de naissance à Koy Sanjaq et son appartenance religieuse à l'islam sunnite – une information identique à celle figurant dans l'infobox de l'article anglais."
  ur: "وکی ڈیٹا آئٹم Q17410819 فواد معصوم کے لیے، انگریزی مضمون کے صفحہ کے پراپس کے ذریعے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1938 میں ان کی پیدائش، کوئے سنجاق کے طور پر ان کی جائے پیدائش، اور سنی اسلام کی ایک مذہبی قدر - انگریزی آرٹیکل کی انفو باکس ویلیو کی تشکیل شدہ بازگشت، اس کے ساتھ ایک ذریعہ خاندان۔"
