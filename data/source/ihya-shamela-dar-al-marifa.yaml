reliability_note: "Title page (PDF p. 2) gives author al-Ghazali (d. 505 AH), publisher Dar al-Ma'rifa, Beirut, 4 parts, and states that the book's numbering follows the print; but this e-reader file carries no printed page markers, so every citation 'p. N' is the PDF page of this file (8,992 pages), not the printed page. Part 3 begins at PDF p. 4131 and part 4 at p. 6250. The text is clean digital text, not OCR, but the conversion scrambled most Qur'anic and some hadith wording (letters reversed), so no Qur'anic text is taken from it. Al-Iraqi's hadith grades are in the footnotes and are attributed to him."
