summary:
  ar: "النص الكامل لإحياء علوم الدين في أربعة أجزاء كما أعدّته المكتبة الشاملة آلياً عن طبعة دار المعرفة ببيروت، وفي حواشيه «المغني عن حمل الأسفار في الأسفار» للحافظ العراقي؛ والملف مهيّأ لأجهزة القراءة في 8992 صفحة."
  en: "The complete text of the Ihya' in four parts, generated automatically by al-Maktaba al-Shamila from the Dar al-Ma'rifa (Beirut) edition, with al-Iraqi's al-Mughni 'an Haml al-Asfar as footnotes; the file is laid out for e-readers in 8,992 pages."
  ur: "احیاء علوم الدین کا مکمل متن چار اجزا میں، جسے مکتبہ شاملہ نے دار المعرفہ ⁦(بیروت)⁩ کے نسخے سے خودکار طور پر تیار کیا، حاشیے میں حافظ عراقی کی «المغنی عن حمل الاسفار»؛ یہ فائل ای ریڈر کے لیے 8992 صفحات میں ہے۔"
