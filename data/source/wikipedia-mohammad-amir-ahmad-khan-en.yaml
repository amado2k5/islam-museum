summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد عامر أحمد خان، راجا محمود آباد (5 تشرين الثاني 1914 – 14 تشرين الأول 1973)؛ تُستخدم لوقائع الكيان فقط. تروي وراثته إقطاعية أبيه سنة 1931، وإدارته مدرسة الواعظين (1940–1944)، ومعارضته التقسيم أولًا ثم قيادته في حركة باكستان، وهجرته إلى العراق ثم باكستان ثم لندن، ووفاته في لندن ودفنه عند ضريح الإمام الرضا في مشهد، وشعره بتخلّصي «بحر» و«محبوب»."
  en: "English Wikipedia article on Mohammad Amir Ahmed Khan, Raja of Mahmudabad (5 November 1914 – 14 October 1973); used for entity facts only. It recounts his inheritance of his father's estate in 1931, his managing trusteeship of the Madrasatul Waizeen (1940–1944), his early opposition to partition and later Pakistan Movement leadership, his moves to Iraq, Pakistan and London, his death in London and burial at the Imam Reza shrine in Mashhad, and his poetry under the pen names Bahr and Mahbub. It files him under the category Pakistani Shia Muslims — a filing, not an attestation."
