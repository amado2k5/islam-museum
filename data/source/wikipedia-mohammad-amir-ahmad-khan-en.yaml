summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد عامر أحمد خان، راجا محمود آباد ⁦(5 تشرين الثاني 1914 – 14 تشرين الأول 1973)⁩؛ تُستخدم لوقائع الكيان فقط. تروي وراثته إقطاعية أبيه سنة 1931، وإدارته مدرسة الواعظين (1940–1944)، ومعارضته التقسيم أولًا ثم قيادته في حركة باكستان، وهجرته إلى العراق ثم باكستان ثم لندن، ووفاته في لندن ودفنه عند ضريح الإمام الرضا في مشهد، وشعره بتخلّصي «بحر» و«محبوب»."
  en: "English Wikipedia article on Mohammad Amir Ahmed Khan, Raja of Mahmudabad (5 November 1914 – 14 October 1973); used for entity facts only. It recounts his inheritance of his father's estate in 1931, his managing trusteeship of the Madrasatul Waizeen (1940–1944), his early opposition to partition and later Pakistan Movement leadership, his moves to Iraq, Pakistan and London, his death in London and burial at the Imam Reza shrine in Mashhad, and his poetry under the pen names Bahr and Mahbub. It files him under the category Pakistani Shia Muslims — a filing, not an attestation."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Amir Ahmed Khan, Raja de Mahmudabad (5 de noviembre de 1914 - 14 de octubre de 1973); utilizado únicamente para datos sobre la persona. Relata su herencia de la herencia de su padre en 1931, su gestión como administrador fiduciario de la Madrasatul Waizeen (1940-1944), su temprana oposición a la partición y su posterior liderazgo del Movimiento de Pakistán, sus traslados a Irak, Pakistán y Londres, su muerte en Londres y su entierro en el santuario del Imam Reza en Mashhad, y su poesía bajo los seudónimos Bahr y Mahbub. Lo clasifica dentro de la categoría de musulmanes chiítas pakistaníes, una clasificación, no una certificación."
  fr: "Article de Wikipédia en anglais sur Mohammad Amir Ahmed Khan, Raja de Mahmudabad (5 novembre 1914 – 14 octobre 1973); utilisé uniquement à des fins d'information. Il relate son héritage du domaine de son père en 1931, sa gestion de la Madrasatul Waizeen (1940-1944), son opposition initiale à la partition et son rôle ultérieur à la tête du Mouvement pour le Pakistan, ses séjours en Irak, au Pakistan et à Londres, sa mort à Londres et son inhumation au mausolée de l'Imam Reza à Mashhad, ainsi que sa poésie publiée sous les pseudonymes de Bahr et Mahbub. Il est classé dans la catégorie « Musulmans chiites pakistanais » – il s'agit d'un classement, et non d'une attestation."
