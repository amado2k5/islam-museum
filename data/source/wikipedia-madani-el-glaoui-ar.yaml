  es: "El artículo árabe de Wikipedia sobre Madani El Mezouari El Glaoui (1860-1918), el caid Makhzen nombrado califa en el sur por Hassan I, quien dirigió el levantamiento de Abdelhafid en Marrakech en 1907; su cuadro de información indica que su religión es Islam únicamente."
