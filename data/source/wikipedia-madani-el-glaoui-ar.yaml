  ar: "مقالة ويكيبيديا العربية عن المدني المزواري الكلاوي (1860–1918)، القائد المخزني الذي عينه الحسن الأول خليفة بالجنوب وقاد انقلاب عبد الحفيظ بمراكش سنة 1907؛ يعطي صندوق معلوماتها دينه: الإسلام فقط."
