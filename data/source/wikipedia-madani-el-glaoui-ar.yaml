  ur: "مدنی المزوری ال گلووی (1860–1918) پر عربی ویکیپیڈیا کا مضمون، مخزن قائد نے حسن اول کے ذریعے جنوب میں خلیفہ مقرر کیا، جس نے 1907 میں مراکیچ میں عبد الحفید کے قیام کی قیادت کی۔ اس کا انفو باکس اس کا مذہب صرف اسلام دیتا ہے۔"
