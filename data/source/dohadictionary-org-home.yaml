summary:
  ar: "الصفحة «Doha Historical Dictionary, home page» في Doha Historical Dictionary of the Arabic Language؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: مؤسسات اللغة العربية في الخليج والجزيرة العربية."
  en: "The page \"Doha Historical Dictionary, home page\" (Doha Historical Dictionary of the Arabic Language), named in a research file supplied to the museum on 21 November 2026; the museum did not open the page, and the founder approved using the file without re-verification. Used for: the Arabic-language institutions of the Gulf and the Arabian Peninsula."
  ur: "صفحہ «Doha Historical Dictionary, home page» (Doha Historical Dictionary of the Arabic Language)؛ یہ عجائب گھر کو 21 نومبر 2026ء کو دی گئی تحقیقی فائل میں مذکور ہے، عجائب گھر نے صفحہ نہیں کھولا اور بانی نے دوبارہ تصدیق کے بغیر فائل کے استعمال کی منظوری دی۔ استعمال: خلیج اور جزیرہ نما عرب میں عربی زبان کے ادارے۔"
  fr: "La page « Doha Historical Dictionary, home page » (Doha Historical Dictionary of the Arabic Language), citée dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisée pour : les institutions de langue arabe du Golfe et de la péninsule Arabique."
  es: "La página «Doha Historical Dictionary, home page» (Doha Historical Dictionary of the Arabic Language), citada en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el archivo sin volver a verificar. Usada para: las instituciones de la lengua árabe del Golfo y la península arábiga."
  tr: "Doha Arap Dili Tarih Sözlüğü'ndeki \"Doha Tarih Sözlüğü, ana sayfa\" sayfası, 21 Kasım 2026'da müzeye sunulan bir araştırma dosyasında bahsedilmiştir. Müze sayfayı açmamış ve kurucu dosyayı yeniden doğrulama gerektirmeden kullanmayı kabul etmiştir. Kullanım: Körfez ve Arap Yarımadası'ndaki Arapça dil kurumları."
  id: "Halaman \"Kamus Sejarah Doha, halaman utama\" dalam Kamus Sejarah Bahasa Arab Doha disebutkan dalam berkas penelitian yang dikirimkan ke museum pada 21 November 2026. Museum tidak membuka halaman tersebut, dan pendiri setuju menggunakan berkas tersebut tanpa verifikasi ulang. Digunakan dalam: institusi berbahasa Arab di Teluk dan Semenanjung Arab."
