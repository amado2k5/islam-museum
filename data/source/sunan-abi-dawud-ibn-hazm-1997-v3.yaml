label:
  ar: "سنن أبي داود ومعه معالم السنن للخطابي — إعداد وتعليق عزت عبيد الدعاس وعادل السيد، دار ابن حزم، الجزء الثالث"
  en: "Sunan Abi Dawud with al-Khattabi's Ma'alim al-Sunan — prepared and annotated by 'Izzat 'Ubayd al-Da''as and 'Adil al-Sayyid, Dar Ibn Hazm, vol. 3"
summary:
  ar: "الجزء الثالث من نشرة دار ابن حزم ⁦(بيروت، الطبعة الأولى 1418هـ/1997م)⁩ لسنن أبي داود مع شرح الخطابي «معالم السنن» في الحاشية، وفيه كتب: الجهاد، والضحايا، والصيد، والوصايا، والفرائض، والخراج والإمارة والفيء، والجنائز، والأيمان والنذور، والبيوع والإجارات."
  en: "Volume 3 of the Dar Ibn Hazm edition (Beirut, first edition 1418 AH/1997 CE) of the Sunan of Abu Dawud with al-Khattabi's Ma'alim al-Sunan in the footnotes, holding the books of Jihad, Sacrifices, Hunting, Bequests, Inheritance, Land-tax, Rule and Fay', Funerals, Oaths and Vows, and Sales and Hire."
  es: "Volumen 3 de la edición Dar Ibn Hazm (Beirut, primera edición 1418 AH/1997 CE) del Sunan de Abu Dawud con Ma'alim al-Sunan de al-Khattabi en las notas a pie de página, que contiene los libros de Yihad, Sacrificios, Caza, Legados, Herencia, Impuesto sobre la tierra, Regla y Fay', Funerales, Juramentos y votos, y Ventas y alquileres."
  fr: "Volume 3 de l'édition Dar Ibn Hazm (Beyrouth, première édition 1418 AH/1997 CE) du Sunan d'Abu Dawud avec Ma'alim al-Sunan d'al-Khattabi en notes de bas de page, contenant les livres du Jihad, des Sacrifices, de la Chasse, des Legs, de l'Héritage, de l'Impôt foncier, du Règlement et du Fay', des Funérailles, des Serments et des Vœux, et des Ventes et des Locations."
  ur: "دار ابن حزم ایڈیشن کی جلد 3 ⁦(بیروت، پہلا ایڈیشن 1418 ہجری / 1997 عیسوی)⁩ سنن ابوداؤد کے ساتھ الخطابی کی معالیم السنان حاشیہ میں، جس میں جہاد، قربانی، شکار، وصیت، وصیت، اراضی، فضیلت اور زمین کی کتابیں موجود ہیں۔ قسمیں اور نذریں، اور فروخت اور کرایہ۔"
  tr: "Dar İbn Hazm bülteninin üçüncü bölümü (Beyrut, ilk baskı 1418 Hicri / 1997 M.S.) ve kenar notunda El-Hattabi'nin \"Ma'alim al-Sunan\" tefsiri yer alır; bu kitapta cihad, kurbanlar, avcılık, vasiyetler, miraslar, vergilendirme, yönetim, cenazeler, yemin ve yeminler ile satış ve kiralama gibi kitaplar yer alır."
  id: "Bagian ketiga dari buletin Dar Ibn Hazm (Beirut, edisi pertama 1418 H / 1997 M) tentang Sunan Abi Dawood dengan komentar Al-Khattabi \"Ma'alim al-Sunan\" di catatan pinggir, yang mencakup buku-buku seperti: jihad, pengorbanan, perburuan, wasiat, warisan, perpajakan, pemerintahan, pemakaman, sumpah dan sumpah, serta penjualan dan sewa."
