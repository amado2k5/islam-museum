  ar: "مقالة ويكيبيديا الإنجليزية عن خواجة عبد الغني، ثاني نواب دكا؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 30 يوليو 1813 ووفاته في منزل إحسان في 24 أغسطس 1896، وأعماله في تطوير دكا وبناءه منزل إحسان، وتذكر في صندوقها أن دينه الإسلام السني."
  en: "English Wikipedia article on Khwaja Abdul Ghani, second Nawab of Dhaka; used for entity facts only. It records his birth on 30 July 1813 and his death at Ahsan Manzil on 24 August 1896, his development of Dhaka and his building of Ahsan Manzil; its infobox records his religion as Sunni Islam."
