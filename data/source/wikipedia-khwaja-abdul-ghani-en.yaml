reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The article rests on Banglapedia, on Muhammad Mojlum Khan's The Muslim Heritage of Bengal (2013), on Ahmad Hasan Dani's Dacca (1962) and on Buckland's Bengal under the Lieutenant-Governors (1901). Its infobox records 'religion: Sunni Islam' and its text says of his patronage of the Shia Hoseni Dalan that he acted 'though he was a Sunni himself' — a single source family for the school; the Arabic article, Banglapedia and Wikidata name no school, so the person record leaves the faith unknown with this attestation stated. The article covers the 1846 waqfnama that made him mutawalli of the estate, his support of the British in 1857 and his quoted statement, his municipal and legislative posts (1864–1867), the titles (CSI 1871; Nawab 1875, hereditary 1877; KCSI 1886; Nawab Bahadur 1892), the building of Ahsan Manzil through Martin & Company (1859–1872), Shahbag, the Buckland Bund, Dilkusha, the water works (about Rs 250,000; foundation stone laid by Lord Northbrook on 6 August 1874), the Langarkhana (1866), the Kumartuli high school (1863), the first female ward at Mitford Hospital, the Weekly Dhaka News (1856–1858) and his patronage of theatre and baijee performance. Burial is given as the Kartalab Khan Mosque, Dhaka."
