summary:
  ar: "السيرة الرسمية لتمارا غراي على موقع منظمة رابطة التي أسستها وترأسها تنفيذيا؛ تذكر دكتوراهها في القيادة وماجستيرها في نظريات المناهج والتعليم، وعشرين سنة قضتها في دمشق تدرس العلوم الإسلامية والقرآن والعربية، وكتابيها «قطرات الفرح» و«مشروع لينا»، وترجماتها المشتركة لأعمال سميرة زايد."
  en: "The official biography of Tamara Gray on the website of Rabata, the organisation she founded and leads as CEO: her doctorate in leadership, her master's in Curriculum Theory and Instruction, twenty years in Damascus studying Islamic sciences, Quran and Arabic, her books Joy Jots and Project Lina, and her co-translations of works by Samira Zayid."
