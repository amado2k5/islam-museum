label: { ar: "تمارا غراي — سيرة رابطة", en: "Tamara Gray — Rabata biography" }
summary:
  ar: "السيرة الرسمية لتمارا غراي على موقع منظمة رابطة التي أسستها وترأسها تنفيذيا؛ تذكر دكتوراهها في القيادة وماجستيرها في نظريات المناهج والتعليم، وعشرين سنة قضتها في دمشق تدرس العلوم الإسلامية والقرآن والعربية، وكتابيها «قطرات الفرح» و«مشروع لينا»، وترجماتها المشتركة لأعمال سميرة زايد."
  en: "The official biography of Tamara Gray on the website of Rabata, the organisation she founded and leads as CEO: her doctorate in leadership, her master's in Curriculum Theory and Instruction, twenty years in Damascus studying Islamic sciences, Quran and Arabic, her books Joy Jots and Project Lina, and her co-translations of works by Samira Zayid."
  es: "La biografía oficial de Tamara Gray en el sitio web de Rabata, la organización que fundó y dirige como directora ejecutiva, incluye: su doctorado en liderazgo, su maestría en teoría e instrucción curricular, veinte años en Damasco estudiando ciencias islámicas, el Corán y el árabe, sus libros Joy Jots y Project Lina, y sus cotraducciones de obras de Samira Zayid."
  fr: "La biographie officielle de Tamara Gray sur le site web de Rabata, l'organisation qu'elle a fondée et qu'elle dirige en tant que PDG: son doctorat en leadership, sa maîtrise en théorie et enseignement des programmes d'études, vingt ans passés à Damas à étudier les sciences islamiques, le Coran et l'arabe, ses livres Joy Jots et Project Lina, et ses co-traductions d'œuvres de Samira Zayid."
  ur: "Rabata کی ویب سائٹ پر تمارا گرے کی باضابطہ سوانح عمری، جس تنظیم کی اس نے بنیاد رکھی اور بطور سی ای او اس کی رہنمائی کرتی ہے: اس کی قیادت میں ڈاکٹریٹ، نصابی تھیوری اور انسٹرکشن میں اس کا ماسٹر، بیس سال دمشق میں اسلامی علوم، قرآن اور عربی کا مطالعہ، اس کی کتابیں جوائے جوٹس اور پروجیکٹ لینا، اور اس کے زاوی کے کاموں کے مشترکہ تراجم۔"
  tr: "Kurucu ve yönetim başkanlığını üstlendiği Rabita organizasyonu üzerine Tamara Gray'in resmi biyografisi, liderlik alanında doktora ve müfredat ile eğitim teorileri alanında yüksek lisansını, Şam'da İslam bilimleri, Kur'an ve Arapça eğitimi aldığı yirmi yıl deneyimini, \"Drops of Joy\" ve \"Lina Project\" kitaplarını ve Samira Zayed'in eserlerinin ortak çevirilerini belirtmektedir."
  id: "Biografi resmi Tamara Gray tentang organisasi Rabita, yang ia dirikan dan pimpin secara eksekutif, menyebutkan gelar PhD dalam kepemimpinan dan gelar master dalam kurikulum serta teori pendidikan, serta dua puluh tahun di Damaskus mempelajari ilmu Islam, Al-Qur'an, dan Arab, serta bukunya \"Drops of Joy\" dan \"Lina Project,\" serta terjemahan bersama karya-karya Samira Zayed."
