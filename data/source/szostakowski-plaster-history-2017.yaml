summary:
  ar: "مقالة مراجعة في The Open Orthopaedics Journal ⁦(11، 2017، ص 291)⁩ تستعرض تاريخ تثبيت الأطراف المصابة: جبائر خشبية مصرية من الأسرة الخامسة، ضمادات أبقراط بالشمع والراتنج، وصف الزهراوي ⁦(960–1013)⁩ مواد الجبس كالطين مع صمغ والدقيق مع بياض البيض، الرازي «Athuriscus» قبله، استعمال العرب الجبس السائل في القرن العاشر لعلاج العظام بحسب المراجع الجراحية التي تستشهد بها، ثم لودران ولاري وسوتن ولافارغ وماتيسن ⁦(1852)⁩ وبيروغوف."
  en: "A review article in The Open Orthopaedics Journal (vol. 11, 2017, p. 291) surveying limb immobilisation: Egyptian wooden splints of the Fifth Dynasty, Hippocratic wax-and-resin bandages, the casting described by the Arab physician Rhazes Athuriscus, El Zahrawi's (960-1013) description of clay-gum mixtures and flour-and-egg-white as casting materials, the surgical literature's note that tenth-century Arabs used liquid plaster in orthopaedic treatment, then Le Dran, Larrey, Seutin, Lafargue, Mathijsen (1852) and Pirogov."
title: "Plaster of Paris — Short History of Casting and Injured Limb Immobilization"
