summary:
  ar: "صفحة «عن المبادرة» في موقع OpenITI كما قُرئت في 7 نوفمبر 2026: مبادرة متعددة المؤسسات منذ 2016 تقودها جامعة الآغا خان ⁦(معهد دراسة الحضارات الإسلامية بلندن)⁩ ومعهد روشن للدراسات الفارسية بجامعة ميريلاند وجامعة هامبورغ، لبناء البنية الرقمية لدراسة الثقافات الإسلامية: التعرف الضوئي على الحروف العربية وخط اليد، ومعايير الترميز، ومدونة نصوص."
  en: "The About page of OpenITI as read on 7 November 2026: a multi-institutional initiative since 2016 led by researchers at the Aga Khan University's Institute for the Study of Muslim Civilisations in London, the Roshan Institute for Persian Studies at the University of Maryland and Universität Hamburg, building digital infrastructure for Islamicate studies: Arabic-script OCR and handwritten text recognition, encoding standards, and a text corpus."
  ur: "OpenITI کا «تعارف» صفحہ، 7 نومبر 2026 کو پڑھا گیا: 2016 سے کئی اداروں کی مبادرت جس کی قیادت آغا خان یونیورسٹی ⁦(لندن میں مسلم تہذیبوں کے مطالعے کا ادارہ)⁩، یونیورسٹی آف میری لینڈ کا روشن انسٹی ٹیوٹ برائے فارسی مطالعات اور ہیمبرگ یونیورسٹی کرتے ہیں؛ اسلامی ثقافتوں کے مطالعے کے لیے ڈیجیٹل ڈھانچہ: عربی رسم الخط کی او سی آر اور تحریر شناسی، ترمیز کے معیارات اور متون کا مجموعہ۔"
