summary:
  ar: "مقالة ويكيبيديا التركية عن عمر دونغل أوغلو؛ تُستخدم لوقائع الكيان فقط. تفصّل ميلاده في 1 يونيو 1968 في زيله بولاية طوكات، وتعليمه وتخرّجه في كلية الإلهيات بجامعة سقاريا، وعمله إمامًا وخطيبًا في طوكات بين 1986 و1996، ووفاته بكوفيد-19 في 3 مايو 2020 ودفنه في مقبرة شهداء أدرنة قابي."
  en: "Turkish Wikipedia article on Ömer Döngeloğlu; used for entity facts only. It details his birth on 1 June 1968 in Zile, Tokat, his schooling and graduation from Sakarya University's theology faculty, his work as an imam-hatip in Tokat between 1986 and 1996, his death from COVID-19 on 3 May 2020 and his burial at Edirnekapı Martyr's Cemetery."
  es: "Artículo de la Wikipedia en turco sobre Ömer Döngeloğlu; utilizado únicamente para datos sobre la persona. Detalla su nacimiento el 1 de junio de 1968 en Zile, Tokat, su formación académica y su graduación de la facultad de teología de la Universidad de Sakarya, su labor como imán en Tokat entre 1986 y 1996, su fallecimiento por COVID-19 el 3 de mayo de 2020 y su entierro en el cementerio de los mártires de Edirnekapı."
  fr: "Article de Wikipédia en turc sur Ömer Döngeloğlu; utilisé uniquement à des fins d'information sur l'entité. Il détaille sa naissance le 1er juin 1968 à Zile, dans le Tokat, ses études et son diplôme de la faculté de théologie de l'université de Sakarya, son travail d'imam-hatip à Tokat entre 1986 et 1996, son décès des suites de la COVID-19 le 3 mai 2020 et son inhumation au cimetière des martyrs d'Edirnekapı."
