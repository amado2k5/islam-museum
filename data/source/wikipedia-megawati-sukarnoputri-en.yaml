  ar: "مقالة ويكيبيديا الإنجليزية عن ميجاواتي سوكارنوبوتري؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها في يوغياكارتا سنة 1947 بوصفها ابنة سوكارنو الكبرى، وقيادتها حزب النضال الديمقراطي، ونيابتها لرئاسة الجمهورية ثم رئاستها 2001–2004، وحياتها السياسية بعد ذلك."
  en: "English Wikipedia article on Megawati Sukarnoputri; used for entity facts only. It records her birth at Yogyakarta in 1947 as Sukarno's eldest daughter, her leadership of the PDI and PDI-P, her vice-presidency and her presidency of 2001–2004, and her political life since."
