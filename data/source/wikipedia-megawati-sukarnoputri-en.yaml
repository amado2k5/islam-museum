reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Covers her full name, Diah Permata Megawati Setiawati Sukarnoputri — 'Megawati' from Sanskrit for 'cloud goddess', the name given by the Indian politician Biju Patnaik at her father's request — her birth on 23 January 1947 at Yogyakarta as the second child and eldest daughter of President Sukarno and Fatmawati, her Merdeka Palace upbringing, and her unfinished studies (agriculture at Padjadjaran, left in 1967; psychology at the University of Indonesia, left after two years); her entry into the PDI in 1987 and election to the People's Representative Council; her election as PDI chair in December 1993, the New Order government's refusal to recognise her, the June 1996 Medan congress that reimposed Suryadi, and the 27 July 1996 attack on PDI headquarters and the Jakarta riots that followed; the founding congress of the PDI-P in October 1998 with her as chair, its 1999 legislative victory, the November 1998 Ciganjur Statement, her loss of the 20 October 1999 presidential vote to Abdurrahman Wahid (313–373) and her election as vice president the next day (396–284 against Hamzah Haz); Wahid's August 2000 decree handing her day-to-day government and her accession to the presidency on 23 July 2001; her Mutual Assistance Cabinet of 10 August 2001, the constitutional reforms of her term — a Constitutional Court, the first direct presidential elections, and the Corruption Eradication Commission (KPK), for which the article records her title 'Mother of Upholding the Constitution' — the 12 October 2002 Bali bombings (202 killed, including 88 Australians) and the arrest of Abu Bakar Ba'asyir, the December 2002 Aceh ceasefire's collapse and the martial law and offensive from 19 May 2003 (with the human-rights abuses the article attributes to that campaign), the criticised Indosat privatisation, and the 2003 end of the IMF programme; her 2004 runoff loss to Susilo Bambang Yudhoyono (39–61) and her 2009 loss (26.79 per cent, with Prabowo Subianto as running mate); her continued PDI-P chairmanship through the Jokowi era and their recorded tensions; and her steering roles at the Pancasila Ideology Development Agency (from 22 March 2018) and the National Research and Innovation Agency (from 2021). Her three marriages are recorded: Surindro Supjarso (1968, killed in the 1970 Biak plane crash), Hassan Gamal Ahmad Hassan (1972, annulled within three months) and Taufiq Kiemas (1973 until his death in 2013), and her three children. The article names no religion or school for her."
