summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسن الكتاني؛ تُستخدم لوقائع الكيان فقط. تثبت اسمه الكامل محمد حسن الشريف الكتاني وميلاده في سلا في 16 أغسطس 1972، ودراسته على محمد أبو خبزة وعبد الله وعبد العزيز الغماري وغيرهم، واعتقاله سنة 2003 والحكم عليه بعشرين سنة في قضية تفجيرات الدار البيضاء، والعفو الملكي عنه في 5 فبراير 2012، ومواقفه بعد الإفراج."
  en: "English Wikipedia article on Hassan Kettani; used for entity facts only. It gives his full name as Mohamed Hassan Echerif El Kettani and his birth at Salé on 16 August 1972, his studies under Muhammad Abu Khubza, Abdullah and Abd al-Aziz al-Ghumari and others, his 2003 arrest and twenty-year sentence in the Casablanca bombings case, the royal pardon of 5 February 2012, and his positions after his release."
