reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the article was fetched by revision id through the MediaWiki API and the returned revid asserted equal to 1361433747 before any claim was drawn. The article carries a 'BLP sources' notice. Its lead, body and categories give his birth as 16 August 1972 at Salé, while its infobox birth-date template carries the year 1976 against its own text; the 1972 date is the one carried by the Arabic article (7 Rajab 1392) and Wikidata. Its infobox — a single unreferenced infobox — gives denomination Sunni, jurisprudence Maliki, creed Athari and movement Salafi. Its text reports that he and fellow detainees saw themselves as normal Sunni Muslims with a Salafist orientation, and calls him an expert in both the Zahiri and Maliki schools of law; expertise in a school and a movement description are not attestations of a personal school affiliation. It names his teachers as Muhammad Abu Khubza, Abdullah al-Ghumari, Abd al-Aziz al-Ghumari, Muhammad ibn al-Uthaymin, Abu Bakr al-Jazaeri and Abdul Qader Arnaoot."
