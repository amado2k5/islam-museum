summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسن الكتاني؛ تُستخدم لوقائع الكيان فقط. تثبت اسمه الكامل محمد حسن الشريف الكتاني وميلاده في سلا في 16 أغسطس 1972، ودراسته على محمد أبو خبزة وعبد الله وعبد العزيز الغماري وغيرهم، واعتقاله سنة 2003 والحكم عليه بعشرين سنة في قضية تفجيرات الدار البيضاء، والعفو الملكي عنه في 5 فبراير 2012، ومواقفه بعد الإفراج."
  en: "English Wikipedia article on Hassan Kettani; used for entity facts only. It gives his full name as Mohamed Hassan Echerif El Kettani and his birth at Salé on 16 August 1972, his studies under Muhammad Abu Khubza, Abdullah and Abd al-Aziz al-Ghumari and others, his 2003 arrest and twenty-year sentence in the Casablanca bombings case, the royal pardon of 5 February 2012, and his positions after his release."
  es: "Artículo de la Wikipedia en inglés sobre Hassan Kettani; utilizado únicamente para datos sobre la persona. Indica su nombre completo como Mohamed Hassan Echerif El Kettani y su nacimiento en Salé el 16 de agosto de 1972, sus estudios con Muhammad Abu Khubza, Abdullah y Abd al-Aziz al-Ghumari y otros, su arresto en 2003 y su condena a veinte años por los atentados de Casablanca, el indulto real del 5 de febrero de 2012 y sus cargos tras su liberación."
  fr: "Article de Wikipédia en anglais sur Hassan Kettani; utilisé uniquement pour les informations relatives à l’entité. Il indique son nom complet: Mohamed Hassan Echerif El Kettani; sa naissance à Salé le 16 août 1972; ses études auprès de Muhammad Abu Khubza, Abdullah et Abd al-Aziz al-Ghumari, entre autres; son arrestation en 2003 et sa condamnation à vingt ans de prison dans l’affaire des attentats de Casablanca; sa grâce royale du 5 février 2012; et les fonctions qu’il a occupées après sa libération."
  ur: "حسن کیتانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا پورا نام محمد حسن ایچریف ال کیطانی بتایا گیا ہے اور ان کی پیدائش 16 اگست 1972 کو سالے میں ہوئی، محمد ابو خبزہ، عبداللہ اور عبدالعزیز الغماری اور دیگر کے تحت ان کی تعلیم، 2003 میں ان کی گرفتاری اور کیسابلانکا بم دھماکوں کے کیس میں بیس سال کی سزا، شاہی معافی، 5 فروری 2012 کو ان کے عہدے کی رہائی کے بعد۔"
