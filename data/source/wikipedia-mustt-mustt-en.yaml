summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألبوم «مست مست» لنصرت فتح علي خان مع مايكل بروك (1990)؛ لوقائع الكيان فقط: الإصدار عن ريل وورلد، واقتراح بيتر غابرييل التعاون، وريمكس ماسيف أتاك، والمبيعات المنسوبة إلى الشركة، والاستقبال، والمرتبة في بيلبورد؛ تستند إلى كيو ونيو ميوزيكال إكسبرس وبيلبورد وذا أوبزرفر."
  en: "English Wikipedia article on the album Mustt Mustt by Nusrat Fateh Ali Khan with Michael Brook (1990); entity facts only: its release on Real World, Peter Gabriel's suggestion, the Massive Attack remix, the label's sales claim, the reception and the Billboard peak; it cites Q, NME, Billboard and The Observer."
  es: "Artículo de la Wikipedia en inglés sobre el álbum Mustt Mustt de Nusrat Fateh Ali Khan con Michael Brook (1990); solo datos sobre la entidad: su lanzamiento en Real World, la sugerencia de Peter Gabriel, el remix de Massive Attack, la afirmación de ventas del sello, la recepción y el pico alcanzado en Billboard; cita a Q, NME, Billboard y The Observer."
  fr: "Article de Wikipédia en anglais sur l'album Mustt Mustt de Nusrat Fateh Ali Khan avec Michael Brook (1990); faits concernant l'album uniquement: sa sortie sur Real World, la suggestion de Peter Gabriel, le remix de Massive Attack, les chiffres de vente du label, l'accueil et le pic du classement Billboard; il cite Q, NME, Billboard et The Observer."
  ur: "مائیکل بروک کے ساتھ نصرت فتح علی خان کے البم مست مست پر انگریزی ویکیپیڈیا کا مضمون (1990)؛ صرف ہستی کے حقائق: حقیقی دنیا پر اس کی ریلیز، پیٹر گیبریل کی تجویز، بڑے پیمانے پر حملے کا ریمکس، لیبل کی فروخت کا دعوی، استقبالیہ اور بل بورڈ کی چوٹی؛ یہ Q، NME، بل بورڈ اور دی آبزرور کا حوالہ دیتا ہے۔"
  tr: "Nusrat Fateh Ali Khan'ın Michael Brook ile yaptığı \"Mist Mist\" albümü (1990) hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için: Real World'den çıkış, Peter Gabriel'in iş birliği teklifi, Massive Attack remix, şirkete atfedilen satışlar, tepkiler ve Billboard'un sıralaması; Q, New Musical Express, Billboard ve The Observer'a dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang album Nusrat Fateh Ali Khan \"Mist Mist\" bersama Michael Brook (1990); hanya untuk fakta entitas: rilis dari Real World, proposal kolaborasi Peter Gabriel, remix Massive Attack, penjualan yang dikaitkan dengan perusahaan, resepsi, dan peringkat Billboard; berdasarkan Q, New Musical Express, Billboard, dan The Observer."
