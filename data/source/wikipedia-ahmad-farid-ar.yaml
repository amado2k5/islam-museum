reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026), read through the MediaWiki API at revision 73779172 (7 March 2026) on 2 November 2026. Gives: Egyptian preacher, one of the shaykhs of Salafism in Egypt and a member of the board of trustees of al-Da'wa al-Salafiyya in Alexandria; born in July 1952 in Minya al-Qamh; father an employee of the agrarian reform administration; mother died of cancer in his youth; secondary school in al-Sinbillawayn (Dakahlia); preparatory year at the Faculty of Medicine in Mansoura, then a bachelor's degree in medicine from Alexandria University; helped form the student Islamic association at Alexandria University, met Muhammad Ismail al-Muqaddam there and declined to join the Muslim Brotherhood; imprisoned during reserve-officer service for refusing to shave his beard, then dismissed from the army; joined the Salafi school, whose magazine Sawt al-Da'wa ran until its activity was stopped in 1994; detained in 1987 (38 days) and in May 2002 (about six months); after 25 January 2011 the school became the registered body al-Da'wa al-Salafiyya. Lists about thirty books, among them al-Bahr al-ra'iq fi al-zuhd wa-l-raqa'iq (called his best-known, translated into several languages), Tazkiyat al-nufus, Shajarat al-iman and al-Taqwa al-ghaya al-manshuda wa-l-durra al-mafquda. The references section is empty in the text read. Of the two sources read, it is the only one that names a school (Salafi); Wikidata gives only Islam. Recorded in docs/authenticity-ledger/pages/wikipedia-ahmad-farid-ar.yaml."
