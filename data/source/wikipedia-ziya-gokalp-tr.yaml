reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. It gives his father Tevfik Efendi (1851–1890) and mother Zeliha Hanım of the Pirinççizade family, his schooling from 1886, his Islamic-science lessons from his uncle Müderris Hacı Hasip Bey from 1890, his departure from the İdadi in 1894, his Arabic, Persian and Sufism studies, his meeting with Abdullah Cevdet, his suicide attempt and the bullet's removal, his 1896 move to Istanbul and the veterinary school, his 1898 arrest and year in prison, his marriage to his cousin Vecihe and their children, the two telegraph-office occupations against the Hamidiye commander İbrahim Paşa, his 1909 Salonica congress role, his March 1912 election as deputy for Ergani/Maden, his refusal of the education ministry in 1913–14, his 1915 appointment as Istanbul University's first professor of sociology, his co-founding of the Türk Ocağı, the journals he wrote for, his 1919 arrest, four months at Bekirağa, the occupation court's trial at which he defended the mutual-killing thesis, the Malta exile, and his death at Istanbul on 25 October 1924 with burial in the Mahmud II tomb precinct. It names no madhhab for him. Read in full on 24 October 2026."
