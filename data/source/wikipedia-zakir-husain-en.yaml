summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ذاكر حسين (1897–1969)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في حيدر آباد في أسرة پشتونية أفريدية، ودراسته في عليكرة وبرلين، وتأسيسه الجامعة الملية الإسلامية ونيابته رئاستها 1926–1948، ونيابته رئاسة جامعة عليكرة الإسلامية، وحاكميته لبيهار، ونيابته رئاسة الهند ثم رئاستها من 1967 حتى وفاته في المنصب."
  en: "English Wikipedia article on Zakir Husain (1897–1969); used for entity facts only. It recounts his Hyderabad birth into an Afridi Pashtun family, his studies at Aligarh and Berlin, his founding membership and 1926–1948 vice-chancellorship of Jamia Millia Islamia, his Aligarh Muslim University vice-chancellorship, the Bihar governorship, and his vice-presidency and presidency of India from 1967 until his death in office."
