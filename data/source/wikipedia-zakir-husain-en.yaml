summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ذاكر حسين (1897–1969)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في حيدر آباد في أسرة پشتونية أفريدية، ودراسته في عليكرة وبرلين، وتأسيسه الجامعة الملية الإسلامية ونيابته رئاستها 1926–1948، ونيابته رئاسة جامعة عليكرة الإسلامية، وحاكميته لبيهار، ونيابته رئاسة الهند ثم رئاستها من 1967 حتى وفاته في المنصب."
  en: "English Wikipedia article on Zakir Husain (1897–1969); used for entity facts only. It recounts his Hyderabad birth into an Afridi Pashtun family, his studies at Aligarh and Berlin, his founding membership and 1926–1948 vice-chancellorship of Jamia Millia Islamia, his Aligarh Muslim University vice-chancellorship, the Bihar governorship, and his vice-presidency and presidency of India from 1967 until his death in office."
  es: "Artículo de la Wikipedia en inglés sobre Zakir Husain (1897-1969); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Hyderabad en el seno de una familia pastún afridi, sus estudios en Aligarh y Berlín, su membresía fundadora y vicerrectoría de Jamia Millia Islamia entre 1926 y 1948, su vicerrectoría de la Universidad Musulmana de Aligarh, su cargo como gobernador de Bihar y su vicepresidencia y presidencia de la India desde 1967 hasta su fallecimiento en el cargo."
  fr: "Article de Wikipédia en anglais sur Zakir Husain (1897-1969); utilisé uniquement pour les informations biographiques. Il relate sa naissance à Hyderabad au sein d'une famille pachtoune afridi, ses études à Aligarh et à Berlin, son rôle de membre fondateur et de vice-chancelier de Jamia Millia Islamia de 1926 à 1948, son poste de vice-chancelier de l'Université musulmane d'Aligarh, son mandat de gouverneur du Bihar, ainsi que sa vice-présidence et sa présidence de l'Inde de 1967 jusqu'à sa mort en fonction."
