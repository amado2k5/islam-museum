summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن البوري ندياي (وُلد ح. 1848 في تيال بمملكة جولوف، وتوفي سنة 1901 في دوسو بالنيجر)، آخر بوربا لجولوف المستقلة والمشهور بمقاومته العازمة للغزو الفرنسي للسنغال؛ تروي نشأته في كايور إلى جانب ابن عمه الأكبر لات جور، واعتناقهما الإسلام معا بقيادة المرابط مابا دياخو با في ستينيات القرن التاسع عشر، وحكمه من 1875 وأسلمته البلاد، ودفاعه عن جولوف حتى سقوط يانغ يانغ سنة 1890، ورحلته شرقا ووفاته في دوسو."
  en: "English Wikipedia article on Alboury Ndiaye (born c. 1848 at Tyal in the Kingdom of Jolof, died 1901 at Dosso, Niger), the last Buurba of an independent Jolof and famed for his determined resistance to the French conquest of Senegal; it recounts his upbringing in Cayor alongside his older cousin Lat Jor, their joint conversion to Islam under the marabout Maba Diakhou Ba in the 1860s, his rule from 1875 and Islamization of the country, his defence of Jolof until the fall of Yang-Yang in 1890, his journey east and his death at Dosso."
