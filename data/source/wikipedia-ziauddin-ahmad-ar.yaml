summary:
  ar: "مقالة ويكيبيديا العربية عن ضياء الدين أحمد؛ تُستخدم لوقائع الكيان فقط. تؤكد ميلاده في 13 شباط 1873 ووفاته في 23 كانون الأول 1947، وتصفه بأنه رياضياتي وبرلماني وتربوي هندي شغل نيابة رئاسة جامعة عليكرة الإسلامية ثلاث فترات."
  en: "Arabic Wikipedia article on Ziauddin Ahmad; used for entity facts only. It confirms his birth on 13 February 1873 and death on 23 December 1947, and describes him as an Indian mathematician, parliamentarian and educationist who held the Aligarh Muslim University vice-chancellorship for three terms."
  es: "Artículo en árabe de la Wikipedia sobre Ziauddin Ahmad; utilizado únicamente para datos sobre la persona. Confirma su nacimiento el 13 de febrero de 1873 y su fallecimiento el 23 de diciembre de 1947, y lo describe como un matemático, parlamentario y pedagogo indio que ocupó el cargo de vicerrector de la Universidad Musulmana de Aligarh durante tres mandatos."
  fr: "Article de Wikipédia en arabe sur Ziauddin Ahmad; utilisé uniquement à des fins d’information sur l’entité. Il confirme sa naissance le 13 février 1873 et son décès le 23 décembre 1947, et le décrit comme un mathématicien, parlementaire et pédagogue indien qui a occupé le poste de vice-chancelier de l’Université musulmane d’Aligarh pendant trois mandats."
