summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زايد بن سلطان آل نهيان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه كان حاكم المنطقة الشرقية (العين) من 1946، وحاكم أبوظبي من 6 أغسطس 1966 بعد خلع أخيه شخبوط، وأول رئيس لدولة الإمارات العربية المتحدة من 2 ديسمبر 1971 حتى وفاته في 2 نوفمبر 2004، وأنه وُلد في أبوظبي في 6 مايو 1918. ويذكر حقل الدين في صندوق معلوماتها «الإسلام السني»؛ ولا يذكر متنها مدرسة له."
  en: "English Wikipedia article on Zayed bin Sultan Al Nahyan; used for entity facts only. It gives him as governor of the Eastern Region (Al Ain) from 1946, ruler of Abu Dhabi from 6 August 1966 after the deposition of his brother Shakhbut, and first President of the United Arab Emirates from 2 December 1971 until his death on 2 November 2004, born at Abu Dhabi on 6 May 1918. Its infobox religion field reads 'Sunni Islam'; no text in it names a school for him."
