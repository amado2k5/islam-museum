summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زايد بن سلطان آل نهيان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه كان حاكم المنطقة الشرقية ⁦(العين)⁩ من 1946، وحاكم أبوظبي من 6 أغسطس 1966 بعد خلع أخيه شخبوط، وأول رئيس لدولة الإمارات العربية المتحدة من 2 ديسمبر 1971 حتى وفاته في 2 نوفمبر 2004، وأنه وُلد في أبوظبي في 6 مايو 1918. ويذكر حقل الدين في صندوق معلوماتها «الإسلام السني»؛ ولا يذكر متنها مدرسة له."
  en: "English Wikipedia article on Zayed bin Sultan Al Nahyan; used for entity facts only. It gives him as governor of the Eastern Region (Al Ain) from 1946, ruler of Abu Dhabi from 6 August 1966 after the deposition of his brother Shakhbut, and first President of the United Arab Emirates from 2 December 1971 until his death on 2 November 2004, born at Abu Dhabi on 6 May 1918. Its infobox religion field reads 'Sunni Islam'; no text in it names a school for him."
  es: "Artículo de la Wikipedia en inglés sobre Zayed bin Sultan Al Nahyan; utilizado únicamente para datos sobre la persona. Lo describe como gobernador de la Región Oriental (Al Ain) desde 1946, gobernante de Abu Dabi desde el 6 de agosto de 1966 tras la deposición de su hermano Shakhbut, y primer presidente de los Emiratos Árabes Unidos desde el 2 de diciembre de 1971 hasta su muerte el 2 de noviembre de 2004. Nació en Abu Dabi el 6 de mayo de 1918. El campo de religión de su ficha informativa indica «Islam sunita»; no contiene ningún texto que mencione una escuela religiosa a la que pertenezca."
  fr: "L'article de Wikipédia en anglais consacré à Zayed ben Sultan Al Nahyan, utilisé uniquement pour les informations le concernant, indique qu'il fut gouverneur de la région orientale (Al Ain) à partir de 1946, souverain d'Abou Dhabi à partir du 6 août 1966 après la destitution de son frère Shakhbut, et premier président des Émirats arabes unis du 2 décembre 1971 jusqu'à sa mort le 2 novembre 2004. Il est né à Abou Dhabi le 6 mai 1918. La rubrique « Religion » de son infobox mentionne « Islam sunnite », sans faire mention d'une école religieuse."
  ur: "زید بن سلطان النہیان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انہیں 1946 سے مشرقی علاقے ⁦(العین)⁩ کے گورنر، اپنے بھائی شخبوت کی معزولی کے بعد 6 اگست 1966 سے ابوظہبی کے حکمران، اور 2 دسمبر 1971 سے 2 نومبر 2004 کو اپنی موت تک متحدہ عرب امارات کے پہلے صدر کے طور پر دیتا ہے، جو ابوظہبی کے میدان میں پیدا ہوئے۔ 'سنی اسلام'؛ اس میں کوئی متن اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Zayed bin Sultan Al Nahyan hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1946'dan itibaren Doğu Eyaleti (Al Ain) hükümdarı, kardeşi Shakhbut'un tahttan indirilmesinden 6 Ağustos 1966'dan itibaren Abu Dabi'nin hükümdarı olduğu ve 2 Aralık 1971'den 2 Kasım 2004'teki ölümüne kadar Birleşik Arap Emirlikleri'nin ilk cumhurbaşkanı olduğu ve 6 Mayıs 1918'de Abu Dabi'de doğduğu belirtilmiştir. Haql al-Din, bilgi kutusunda 'Sünni İslam'dan bahseder; kendi okulundan bahsetmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Zayed bin Sultan Al Nahyan; digunakan hanya untuk fakta entitas. Dicatat bahwa ia adalah penguasa Provinsi Timur (Al Ain) sejak 1946, penguasa Abu Dhabi sejak 6 Agustus 1966 setelah penggulingan saudaranya Shakhbut, dan presiden pertama Uni Emirat Arab dari 2 Desember 1971 hingga wafatnya pada 2 November 2004, dan lahir di Abu Dhabi pada 6 Mei 1918. Haql al-Din menyebutkan 'Islam Sunni' dalam infoboxnya; tidak menyebutkan aliran miliknya sendiri."
