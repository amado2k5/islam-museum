summary:
  ar: "الصفحة «Marah al-Arwah» — KetabOnline؛ لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: كتاب «Marah al-Arwah» ومؤلفه وتاريخه."
  en: "The page «Marah al-Arwah» — KetabOnline; summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the book «Marah al-Arwah»: its author and date."
  ur: "صفحہ «Marah al-Arwah» — KetabOnline؛ اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: کتاب «Marah al-Arwah»، اس کے مصنف اور تاریخ کا بیان۔"
  fr: "La page «Marah al-Arwah» — KetabOnline ; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : le livre « Marah al-Arwah » : son auteur et sa date."
  es: "La página «Marah al-Arwah» — KetabOnline; resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: el libro «Marah al-Arwah»: su autor y su fecha."
  tr: "\"Marah al-Arwah\" sayfası — KetabOnline; kurucusunun 21 Kasım 2026'da müzeye sunduğu bir araştırma özetiyle özetlenmiştir; müze sayfayı açmamış ve kurucu özeti yeniden doğrulama yapmadan kullanmayı kabul etmiştir. Kullanıldığı alanlar: \"Marah al-Arwah\" kitabında, yazarı ve tarihçesi."
  id: "Halaman \"Marah al-Arwah\" — KetabOnline; dirangkum oleh ringkasan penelitian yang diajukan oleh pendiri ke museum pada 21 November 2026; museum tidak membuka halaman tersebut, dan pendiri setuju menggunakan ringkasan tersebut tanpa verifikasi ulang. Digunakan dalam: buku \"Marah al-Arwah,\" penulisnya, dan sejarahnya."
