  fr: "La page « The Diwāns of ʿAbid ibn al-Abraṣ (Lyall edition) » (Internet Archive). Le musée ne l'a pas ouverte lui-même : ce qu'on en sait vient d'une synthèse de recherche remise au musée et approuvée pour usage par le fondateur le 21 novembre 2026. Citée pour : le Diwan d'Abid ibn al-Abras dans l'édition de Lyall, donné comme référence du troisième poète ajouté à la recension à dix odes."
