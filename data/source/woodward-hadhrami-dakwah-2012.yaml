reliability_note: "Scholarly journal article, read in this session. It presents Habib Syech bin Abulkadir Assegaf of Surakarta (Solo) as a gifted and enormously popular salawat performer, born in 1961, one of the sixteen children of Habib Abdulkadir bin Abdurrahman Assegaf, imam of the Jami' Assegaf mosque; it describes both its subjects as sayyid rooted in the Ba'Alawi Sufism of the Hadhramaut and the Tariqa 'Alawiyya, and Habib Syech's dakwah as ordering what is right by encouraging love of God, the Prophet, his family and fellow humans through salawat, rejecting all forms of religious and political violence. This is a description of his tradition and method — it names no legal school for the man himself, and it is not used as a faith attestation."
