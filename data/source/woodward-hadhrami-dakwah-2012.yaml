summary:
  ar: "دراسة أكاديمية محكّمة ⁦(مجلة شؤون إندونيسيا وماليزيا، 2012)⁩ تصف الحبيب شيخ سيدًا من الشتات الحضرمي متجذرًا في التصوف الباعلوي، يروّج للتقوى الصوفية التقليدية بالصلوات ويرفض العنف الديني والسياسي."
  en: "Peer-reviewed journal study (Review of Indonesian and Malaysian Affairs, 2012) describing Habib Syech as a sayyid of the Hadhrami diaspora rooted in Ba'Alawi Sufism, promoting traditional Sufi piety through salawat and rejecting religious and political violence."
  es: "Un estudio publicado en una revista revisada por pares (Review of Indonesian and Malaysian Affairs, 2012) describe a Habib Syech como un sayyid de la diáspora hadhrami arraigado en el sufismo ba'alawi, que promueve la piedad sufí tradicional a través del salawat y rechaza la violencia religiosa y política."
  fr: "Une étude publiée dans une revue à comité de lecture (Review of Indonesian and Malaysian Affairs, 2012) décrit Habib Syech comme un sayyid de la diaspora hadhramie enracinée dans le soufisme ba'alaouvi, promouvant la piété soufie traditionnelle à travers le salawat et rejetant la violence religieuse et politique."
title: "Ordering what is right, forbidding what is wrong: two faces of Hadhrami dakwah in contemporary Indonesia"
