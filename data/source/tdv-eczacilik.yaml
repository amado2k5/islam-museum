  ar: "مدخل «صيدلة» في موسوعة TDV الإسلامية لطورهان بايتوب: انفصال الصيدلة عن الطب في العصر العباسي، وأول صيدلية في بغداد، وكتب الصيدلة من البيروني إلى ابن البيطار، ثم الصيدلة عند العثمانيين: دكاكين العطّارين، ونشوء الصيدليات الحديثة، وامتحانات الصيادلة ومدارسهم."
  en: "The TDV İslâm Ansiklopedisi entry on pharmacy by Turhan Baytop: the separation of pharmacy from medicine in the Abbasid era, the first pharmacy in Baghdad, the pharmacological literature from al-Biruni to Ibn al-Baytar, then Ottoman pharmacy: the attar shops, the rise of the modern eczahane, and the examination, licensing and schooling of pharmacists."
