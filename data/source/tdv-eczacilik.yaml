summary:
  ar: "مدخل «صيدلة» في موسوعة TDV الإسلامية لطورهان بايتوب: انفصال الصيدلة عن الطب في العصر العباسي، وأول صيدلية في بغداد، وكتب الصيدلة من البيروني إلى ابن البيطار، ثم الصيدلة عند العثمانيين: دكاكين العطّارين، ونشوء الصيدليات الحديثة، وامتحانات الصيادلة ومدارسهم."
  en: "The TDV İslâm Ansiklopedisi entry on pharmacy by Turhan Baytop: the separation of pharmacy from medicine in the Abbasid era, the first pharmacy in Baghdad, the pharmacological literature from al-Biruni to Ibn al-Baytar, then Ottoman pharmacy: the attar shops, the rise of the modern eczahane, and the examination, licensing and schooling of pharmacists."
  es: "La entrada de Turhan Baytop en la TDV İslâm Ansiklopedisi sobre farmacia: la separación de la farmacia de la medicina en la era abasí, la primera farmacia en Bagdad, la literatura farmacológica desde al-Biruni hasta Ibn al-Baytar, y luego la farmacia otomana: las tiendas de attar, el auge del eczahane moderno y el examen, la concesión de licencias y la formación de farmacéuticos."
  fr: "L'article de Turhan Baytop sur la pharmacie dans la TDV İslâm Ansiklopedisi: la séparation de la pharmacie et de la médecine à l'époque abbasside, la première pharmacie à Bagdad, la littérature pharmacologique d'al-Biruni à Ibn al-Baytar, puis la pharmacie ottomane: les boutiques d'attar, l'essor de l'eczahane moderne, et l'examen, l'agrément et la formation des pharmaciens."
  ur: "فارمیسی پر TDV İslâm Ansiklopedisi entry by Turhan Baytop: دواخانہ کی عباسی دور میں دوا سے علیحدگی، بغداد کی پہلی دواخانہ، البیرونی سے ابن البیطار تک فارماسولوجیکل لٹریچر، پھر عثمانی دواخانہ، جدید ترین امتحانات، اتھارزا، جدید دور کی دواخانہ فارماسسٹ کی لائسنسنگ اور اسکولنگ۔"
