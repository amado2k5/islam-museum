summary:
  ar: "مقالة ويكيبيديا الأردية عن معين علي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 18 يونيو 1987 ودوره نائب قائد لإنجلترا في الكريكت المحدود وفوزه بكأسَي العالم 2019 و2022 واعتزاله الاختباري بعد أشيز 2023."
  en: "Urdu Wikipedia article on Moeen Ali; used for entity facts only. It records his birth on 18 June 1987, his role as England's limited-overs vice-captain, his 2019 and 2022 World Cup wins and his Test retirement after the 2023 Ashes."
  es: "Artículo de Wikipedia en urdu sobre Moeen Ali; se utiliza únicamente para datos sobre la persona. En él se registra su nacimiento el 18 de junio de 1987, su papel como vicecapitán de Inglaterra en partidos de formato limitado, sus victorias en las Copas del Mundo de 2019 y 2022, y su retirada del críquet de prueba tras las Ashes de 2023."
  fr: "Article Wikipédia en ourdou sur Moeen Ali; utilisé uniquement à des fins d'information sur l'entité. Il mentionne sa naissance le 18 juin 1987, son rôle de vice-capitaine de l'équipe d'Angleterre de cricket en format limité, ses victoires aux Coupes du monde de 2019 et 2022 et sa retraite du cricket test après les Ashes de 2023."
  ur: "معین علی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 18 جون 1987 کو ان کی پیدائش، انگلینڈ کے محدود اوورز کے نائب کپتان کے طور پر ان کا کردار، 2019 اور 2022 ورلڈ کپ جیتنے اور 2023 کی ایشز کے بعد ان کی ٹیسٹ ریٹائرمنٹ کو ریکارڈ کیا گیا ہے۔"
  tr: "Muin Ali hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 18 Haziran 1987'de doğdu ve sınırlı takımlı krikette İngiltere'nin kaptan yardımcısı olarak görevi, 2019 ve 2022 Dünya Kupası'nı kazanması ve 2023 Ashes sonrası Test maçlarından emekli olması nedeniyle gerçekleşti."
  id: "Artikel Wikipedia Urdu tentang Muin Ali; digunakan hanya untuk fakta entitas. Ia lahir pada 18 Juni 1987, dan perannya sebagai wakil kapten Inggris dalam kriket tim terbatas, memenangkan Piala Dunia 2019 dan 2022, serta pensiun dari Test setelah Ashes 2023."
