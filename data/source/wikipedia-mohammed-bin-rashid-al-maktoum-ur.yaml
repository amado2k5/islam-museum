summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد بن راشد آل مكتوم؛ مختصر يُستخدم لوقائع الكيان فقط. ويصل معامل الدين في صندوق معلوماته إلى مقالة «أهل سنت» ⁦(أهل السنة)⁩ وإن عرض كلمة «الإسلام»، فهو قيمة بنيوية واحدة في مقالة واحدة. ولا يسمي متنه مدرسة له."
  en: "Urdu Wikipedia stub on Mohammed bin Rashid Al Maktoum; used for entity facts only. Its infobox religion parameter links to the article 'Ahl-e-Sunnat' (Ahl al-Sunna) while displaying the word 'Islam' — a single structured value in a single article. No text in it names a school for him."
  es: "Fragmento de la Wikipedia en urdu sobre Mohammed bin Rashid Al Maktoum; se utiliza únicamente para datos sobre la entidad. Su parámetro de religión en el cuadro de información enlaza con el artículo «Ahl-e-Sunnat» (Ahl al-Sunna) y muestra la palabra «Islam» —un único valor estructurado en un solo artículo—. No contiene ningún texto que mencione una escuela religiosa en su honor."
  fr: "Ébauche de la page Wikipédia en ourdou consacrée à Mohammed bin Rashid Al Maktoum; utilisée uniquement pour les informations factuelles. Son infobox « religion » renvoie à l’article « Ahl-e-Sunnat » (Ahl al-Sunna) et affiche le mot « Islam » — une seule valeur structurée dans un seul article. Aucun texte ne mentionne d’école liée à lui."
  ur: "محمد بن راشد المکتوم پر اردو ویکیپیڈیا سٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا انفو باکس مذہب پیرامیٹر مضمون 'اہل سنت' ⁦(اہل السنۃ)⁩ سے لنک کرتا ہے جبکہ لفظ 'اسلام' کو ظاہر کرتا ہے - ایک مضمون میں واحد ساختی قدر۔ اس میں کوئی متن اس کے لیے کسی اسکول کا نام نہیں ہے۔"
