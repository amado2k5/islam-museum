  ar: "صفحة وردت في ملخص بحثي قُدِّم إلى المتحف واعتمده المؤسس في 21 نوفمبر 2026؛ لم تُفتح الصفحة، وأرقام الصفحات المذكورة هي ما في الملخص ولم يُتحقق منها. ناشرها: Dar al-Ifta al-Misriyya. يُستند إليها في: هل الترجمة قرآن، وحكم مسّها."
  en: "A page listed in a research summary supplied to the museum and approved by the founder on 21 November 2026; the page was not opened, and any page numbers are the summary's and unchecked. Publisher: Dar al-Ifta al-Misriyya. Used for: whether a translation counts as the Qur'an and the rule on touching it."
  ur: "ایک صفحہ جو عجائب گھر کو دیے گئے تحقیقی خلاصے میں مذکور ہے اور جسے بانی نے 21 نومبر 2026 کو منظور کیا؛ صفحہ کھولا نہیں گیا، اور صفحات کے نمبر خلاصے کے ہیں اور جانچے نہیں گئے۔ ناشر: Dar al-Ifta al-Misriyya۔ اس سے استناد ان امور کے لیے ہے: کیا ترجمہ قرآن شمار ہوتا ہے اور اسے چھونے کا حکم۔"
  fr: "Page citée dans un résumé de recherche remis au musée et approuvé par le fondateur le 21 novembre 2026 ; la page n'a pas été ouverte, et les numéros de page sont ceux du résumé, non vérifiés. Éditeur : Dar al-Ifta al-Misriyya. Utilisée pour : la question de savoir si une traduction est le Coran et la règle sur son toucher."
  es: "Página citada en un resumen de investigación entregado al museo y aprobado por el fundador el 21 de noviembre de 2026; la página no se abrió, y los números de página son los del resumen, sin comprobar. Editor: Dar al-Ifta al-Misriyya. Usada para: si una traducción cuenta como el Corán y la regla sobre tocarla."
