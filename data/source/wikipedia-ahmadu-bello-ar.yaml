  ar: "مقالة ويكيبيديا العربية عن أحمدو بلو؛ تُستخدم لوقائع الكيان فقط. تروي نشأته وتعليمه القرآني وتربيته في زوايا مشايخ القادرية، ومناصبه السياسية، وتأسيسه جامعة أهل الشمال المسلمين، وإسهامه في تأسيس رابطة العالم الإسلامي، ودوره في الدعوة في نيجيريا وغرب أفريقيا."
  en: "Arabic Wikipedia article on Ahmadu Bello; used for entity facts only. It recounts his upbringing and Qur'anic schooling and his being raised in the zawiyas of Qadiriyya shaykhs, his political offices, his founding of the Jama'atu Nasril Islam, his part in founding the Muslim World League, and his preaching work in Nigeria and West Africa."
