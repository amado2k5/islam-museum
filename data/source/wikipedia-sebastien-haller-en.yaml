  ar: "مقالة ويكيبيديا الإنجليزية عن سيباستيان هالير؛ تُستخدم لوقائع الكيان فقط. تروي مسيرة المهاجم المولود في 22 يونيو 1994 بري أورانجي: أوتريخت وفرانكفورت ووست هام وأياكس ودورتموند، وإصابته بورم في الخصية سنة 2022 وعودته، وهدفه الفائز في نهائي أمم أفريقيا 2023 مع ساحل العاج. لا تذكر ديانته في أي موضع."
  en: "English Wikipedia article on Sébastien Haller; used for entity facts only. It records the striker born 22 June 1994 at Ris-Orangis: Utrecht, Eintracht Frankfurt, West Ham, Ajax and Borussia Dortmund, his 2022 testicular tumour diagnosis and return, and his winning goal in the 2023 Africa Cup of Nations final for Ivory Coast. It makes no statement of his religion anywhere."
