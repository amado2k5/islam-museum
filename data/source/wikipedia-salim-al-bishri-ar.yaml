summary:
  ar: "مقالة ويكيبيديا العربية عن سليم البشري؛ تُستخدم لوقائع الكيان فقط. تعطي نسبه الكامل وتسميه في صدرها «من فقهاء المالكية»، وتذكر مولده سنة 1248هـ في محلة بشر بالبحيرة، وولايته الثانية لمشيخة الأزهر من 1909 «حتى سنة وفاته 1917»، ووفاته في ذي الحجة 1335هـ في القاهرة ودفنه في مدفن السادة المالكية بقرافة السيدة نفيسة، وتسمي ابنه عبد العزيز وحفيده طارق في ذريته، وتذكر إدخاله نظام امتحان الراغبين في التدريس بالأزهر."
  en: "Arabic Wikipedia article on Salim al-Bishri; used for entity facts only. Its lead gives his full nasab and calls him 'one of the Maliki jurists'; it gives his birth in 1248 AH at Mahallat Bishr in Beheira, his second term as Shaykh al-Azhar running from 1909 'to the year of his death, 1917', his death in Dhu al-Hijja 1335 AH in Cairo and his burial in the Maliki cemetery in the Qarafa of Sayyida Nafisa; it names his son Abd al-Aziz and his grandson Tariq among his descendants, and credits his tenure with the examination system for would-be Azhar teachers."
