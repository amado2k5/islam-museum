summary:
  ar: "مدخل سيد نواب علي تشودري في بنغلابيديا، الموسوعة الوطنية لبنغلاديش، بقلم محمد عبد السلام؛ تُستخدم لوقائع الكيان فقط. يفصّل عضوياته في المجالس التشريعية من 1906 إلى 1929 ومناصبه الوزارية والتنفيذية، ودوره في وفد سيملا 1906 وتأسيس رابطة مسلمي عموم الهند، وقيادته مشروع قانون جامعة دكا، وألقابه ووفاته في 17 أبريل 1929."
  en: "Entry 'Chowdhury, Nawab Ali' in Banglapedia, the national encyclopedia of Bangladesh, by Muhammad Abdus Salam; used for entity facts only. It details his legislative-council memberships from 1906 to 1929 and his ministerial and executive-council offices, his part in the 1906 Simla Deputation and the founding of the All-India Muslim League, his piloting of the Dhaka University Bill, his titles, and his death on 17 April 1929."
