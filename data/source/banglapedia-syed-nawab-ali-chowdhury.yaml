reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia. Read in full on 25 October 2026. It styles him zamindar, social worker and politician. Against the English article it places his birth in 1863 at the house of his maternal grandfather, Khan Bahadur Muhammad Ali Khan Chowdhury, a zamindar of Natore — his father Janab Ali Chowdhury being the Dhanbari zamindar — and both birthplaces are recorded in the person record. It adds detail the English article lacks: his start as an honorary magistrate of Mymensingh, then municipal commissioner and district-board member there; the Eastern Bengal and Assam Legislative Council 1906–1911, the Bengal Legislative Council 1912–1916, the Imperial Legislative Council 1916–1920, the reformed Bengal council from 1921, a ministry in 1921–1923, appointment as minister in March 1925 for a short period, then membership of the Governor's Executive Council 1925–1929 with the departments of immigration, delimitation, Hajj administration, forestry, agriculture, industry, excise and registration, and the vice-presidency of the Bengal Legislative Council; his offices in the Muslim League and the Central National Muhammadan Association, his trusteeship of the Aligarh MAO College and membership of the Calcutta University Senate and the Dhaka University Committee; his piloting of the Dhaka University Bill in the Imperial Legislative Assembly; his 1906 donation of 35,000 taka for a Muhammadan Hall for Dhaka College students and the hostels he established at Dhaka, Calcutta and Mymensingh, and his 1922 fund of 16,000 taka for Dhaka University scholarships; his part in the 1906 Simla Deputation; his resignation of the Bengal Presidency Muslim League presidency in 1917 in protest at the Lucknow Pact; his editorship and proprietorship of the weekly Mihir-o-Sudhakar (1895) and financial help to the Islam Pracharak (1891) and the Pracharak (1899) and to poor writers; his titles Khan Bahadur (1906), Nawab (1911), CIE (1918) and Nawab Bahadur (1924); his waqfnama registered on 8 April 1929, nine days before his death at Eden Castle, Darjeeling, on Wednesday 17 April 1929 at the age of sixty-six, after which his body was taken to Dhanbari and buried there. It names no school for him."
