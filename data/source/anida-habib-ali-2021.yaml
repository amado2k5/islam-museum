reliability_note: "A peer-reviewed Indonesian journal article, used for entity facts: Habib Ali Zaenal Abidin Al-Hamid comes from Bondowoso, East Java, Indonesia; he travelled to Hadhramaut, Yemen, to study usuluddin, sharia and tasawwuf; he is a freelance preacher well known in Malaysia; the habib group around him has been active in dakwah since about 2012; he runs a weekly programme at Masjid Mu'az bin Jabal, and the Malam Cinta Rasul programme under Majlis Ta'lim Darul Murtadza in Tawau, Sabah drew some 4,000 participants. The study describes his Darul Murtadza and Ba'Alawi majlis milieu; a milieu description is not an attestation of a school, and this record does not treat it as one. Read via search extract on 15 November 2026."
