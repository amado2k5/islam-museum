reliability_note: "Read on 27 October 2026 at the recorded revision. The article splits internally on her birthplace: its lead text states she was born on 14 August 1947 at Bantva and moved with her parents to Karachi after Partition — agreeing with the English and Arabic articles — while its infobox gives the birthplace as Karachi, the value Wikidata also carries. The date itself (14 August 1947) and her death (15 April 2022) are unanimous. It gives her four children (two sons, two daughters), her heading of the Bilquis Edhi Foundation, and the 1986 Ramon Magsaysay Award shared with her husband. It names no school or affiliation for her."
