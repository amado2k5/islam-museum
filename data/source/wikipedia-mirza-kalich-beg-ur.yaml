reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth on 4 October 1853 at Tando Thoro, Hyderabad, Sindh, his father's enslavement and sale to Mirza Khusro Beg and later freedom and marriage, his schooling at the maktab and Government High School Hyderabad and Elphinstone College Bombay, his judicial examination and posting as mukhtarkar at Shikarpur, his retirement in 1910 as a deputy collector after thirty years of British service, his 457 books in eight languages (Arabic, Balochi, English, Persian, Sindhi, Saraiki, Turkish, Urdu), Zeenat as the first Sindhi novel, his foundational work on Shah Abdul Latif Bhittai, his translation of the Chach Nama from Persian into English, his Sindhi versions of Shakespeare, the title Shams-ul-Ulama from the British government of India, and his death on 3 July 1929 at Tando Thoro. It names no school for him. Read in full on 24 October 2026."
