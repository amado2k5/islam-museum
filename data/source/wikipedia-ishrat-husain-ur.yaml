summary:
  ar: "مقالة ويكيبيديا الأردية عن عشرت حسین؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تصفه بأنه مصرفي وخبير اقتصادي باكستاني كان محافظًا لبنك الدولة الباكستاني في 1999–2006 ويعمل مستشارًا لرئيس الوزراء للإصلاحات المؤسسية وكفاية الإنفاق."
  en: "Urdu Wikipedia article on Ishrat Husain; used for entity facts only. A short article describing him as a Pakistani banker and economist who was governor of the State Bank of Pakistan 1999–2006 and serves as advisor to the Prime Minister on institutional reforms and austerity."
  es: "Artículo de Wikipedia en urdu sobre Ishrat Husain; utilizado únicamente para datos sobre la persona. Un breve artículo que lo describe como un banquero y economista pakistaní que fue gobernador del Banco Estatal de Pakistán entre 1999 y 2006 y que se desempeña como asesor del Primer Ministro en materia de reformas institucionales y austeridad."
  fr: "Article de Wikipédia en ourdou sur Ishrat Husain; utilisé uniquement à des fins d’information sur l’entité. Ce court article le décrit comme un banquier et économiste pakistanais qui a été gouverneur de la Banque d’État du Pakistan de 1999 à 2006 et qui est conseiller du Premier ministre sur les réformes institutionnelles et l’austérité."
  ur: "عشرت حسین پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون جس میں انہیں ایک پاکستانی بینکر اور ماہر معاشیات کے طور پر بیان کیا گیا ہے جو کہ اسٹیٹ بینک آف پاکستان کے 1999-2006 کے گورنر تھے اور ادارہ جاتی اصلاحات اور کفایت شعاری پر وزیر اعظم کے مشیر کے طور پر کام کرتے ہیں۔"
  tr: "Ishrat Hussain hakkında Urduca Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. Kısa bir makale, onu 1999-2006 yılları arasında Pakistan Devlet Bankası başkanı olarak görev yapmış ve Başbakan'a kurumsal reformlar ve harcama yeterliliği konusunda danışmanlık yapan Pakistanlı bir bankacı ve ekonomi uzmanı olarak tanımlar."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Ishrat Hussain; digunakan hanya untuk fakta entitas. Sebuah artikel singkat menggambarkannya sebagai bankir dan ahli ekonomi Pakistan yang pernah menjabat sebagai gubernur Bank Negara Pakistan dari 1999 hingga 2006 serta menjadi penasihat Perdana Menteri dalam reformasi kelembagaan dan kecukupan pengeluaran."
