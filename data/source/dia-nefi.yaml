reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The standard scholarly encyclopaedia entry (vol. 32, pp. 523–525), resting on Âlî's Mecmau'l-bahreyn, Kâtib Çelebi's Fezleke and Naîmâ's history. It estimates his birth around 980/1572 from the notes in his own qasida, gives his posts, dismissals and Edirne exile, and holds that the chronogram verses confirm Sha'ban 1044 / January 1635 for the execution against other dates in the sources. It confirms that his exchanges with Tâhir Efendi and Şeyhülislâm Yahyâ stand in the Sihâm-ı Kazâ, and it notes signs of Mevlevi sympathy in him, which fall short of attested order membership and are not relied on for faith. Read in-session 1 November 2026."
