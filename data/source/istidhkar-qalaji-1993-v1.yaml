summary:
  ar: "المجلد الأول من «الاستذكار الجامع لمذاهب فقهاء الأمصار وعلماء الأقطار فيما تضمنه الموطأ من معاني الرأي والآثار» لابن عبد البر ⁦(368–463هـ)⁩، بتحقيق الدكتور عبد المعطي أمين قلعجي، عن خمس نسخ خطية، في ثلاثين مجلداً، دار قتيبة ⁦(دمشق–بيروت)⁩ ودار الوعي ⁦(حلب–القاهرة)⁩، الطبعة الأولى، القاهرة جمادى الآخرة 1414هـ / تشرين الثاني 1993م. فيه دراسة المحقق عن حياة ابن عبد البر ومنهج الكتاب ونسخه ⁦(ص 11–162)⁩، ثم تقدمة المصنف وكتاب وقوت الصلاة ⁦(أحاديث الموطأ 1–34، الفقرات 1–1121)⁩."
  en: "Volume 1 of al-Istidhkar al-Jami' li-Madhahib Fuqaha' al-Amsar wa-Ulama' al-Aqtar fima Tadammanahu al-Muwatta' min Ma'ani al-Ra'y wa-l-Athar by Ibn Abd al-Barr (368–463 AH), edited by Dr Abd al-Mu'ti Amin Qal'aji from five manuscripts, in thirty volumes, Dar Qutayba (Damascus–Beirut) and Dar al-Wa'y (Aleppo–Cairo), 1st ed., Cairo, Jumada II 1414 / November 1993. It contains the editor's study of Ibn Abd al-Barr's life, the book's method and its manuscripts (pp. 11–162), then the author's preface and the Book of Prayer Times (Muwatta' hadiths 1–34, paragraphs 1–1121)."
