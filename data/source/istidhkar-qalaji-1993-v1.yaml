  en: "Ibn Abd al-Barr, al-Istidhkar, ed. Abd al-Mu'ti Amin Qal'aji, vol. 1 (Dar Qutayba and Dar al-Wa'y, 1st ed., 1414/1993)"
  ur: "ابن عبد البر، الاستذکار، تحقیق عبد المعطی امین قلعجی، جلد اول ⁦(دار قتیبہ و دار الوعی، طبع اول، 1414ھ/1993ء)⁩"
summary:
  ar: "المجلد الأول من «الاستذكار الجامع لمذاهب فقهاء الأمصار وعلماء الأقطار فيما تضمنه الموطأ من معاني الرأي والآثار» لابن عبد البر ⁦(368–463هـ)⁩، بتحقيق الدكتور عبد المعطي أمين قلعجي، عن خمس نسخ خطية، في ثلاثين مجلداً، دار قتيبة ⁦(دمشق–بيروت)⁩ ودار الوعي ⁦(حلب–القاهرة)⁩، الطبعة الأولى، القاهرة جمادى الآخرة 1414هـ / تشرين الثاني 1993م. فيه دراسة المحقق عن حياة ابن عبد البر ومنهج الكتاب ونسخه ⁦(ص 11–162)⁩، ثم تقدمة المصنف وكتاب وقوت الصلاة ⁦(أحاديث الموطأ 1–34، الفقرات 1–1121)⁩."
  en: "Volume 1 of al-Istidhkar al-Jami' li-Madhahib Fuqaha' al-Amsar wa-Ulama' al-Aqtar fima Tadammanahu al-Muwatta' min Ma'ani al-Ra'y wa-l-Athar by Ibn Abd al-Barr (368–463 AH), edited by Dr Abd al-Mu'ti Amin Qal'aji from five manuscripts, in thirty volumes, Dar Qutayba (Damascus–Beirut) and Dar al-Wa'y (Aleppo–Cairo), 1st ed., Cairo, Jumada II 1414 / November 1993. It contains the editor's study of Ibn Abd al-Barr's life, the book's method and its manuscripts (pp. 11–162), then the author's preface and the Book of Prayer Times (Muwatta' hadiths 1–34, paragraphs 1–1121)."
  es: "Volumen 1 de al-Istidhkar al-Jami' li-Madhahib Fuqaha' al-Amsar wa-Ulama' al-Aqtar fima Tadammanahu al-Muwatta' min Ma'ani al-Ra'y wa-l-Athar por Ibn Abd al-Barr (368–463 AH), editado por el Dr. Abd al-Mu'ti Amin Qal'aji a partir de cinco manuscritos, en treinta volúmenes, Dar Qutayba (Damasco-Beirut) y Dar al-Wa'y (Alepo-El Cairo), 1.ª ed., El Cairo, Jumada II 1414 / noviembre de 1993. Contiene el estudio del editor sobre la vida de Ibn Abd al-Barr, la metodología del libro y sus manuscritos (págs. 11-162), luego el prefacio del autor y el Libro de los tiempos de oración (Muwatta' hadices 1 a 34, párrafos 1–1121)."
  fr: "Volume 1 d'al-Istidhkar al-Jami' li-Madhahib Fuqaha' al-Amsar wa-Ulama' al-Aqtar fima Tadammanahu al-Muwatta' min Ma'ani al-Ra'y wa-l-Athar par Ibn Abd al-Barr (368-463 AH), édité par le Dr Abd al-Mu'ti Amin Qal'aji à partir de cinq manuscrits, en trente volumes, Dar Qutayba (Damas-Beyrouth) et Dar al-Wa'y (Alep-Caire), 1ère éd., Le Caire, Joumada II 1414 / novembre 1993. Il contient l'étude de l'éditeur sur la vie d'Ibn Abd al-Barr, la méthodologie du livre et ses manuscrits (pp. 11-162), puis la préface de l'auteur et le Livre des heures de prière. (Hadiths de Muwatta 1 à 34, paragraphes 1–1121)."
