summary:
  ar: "مدخل «تذهيب» في موسوعة TDV الإسلامية في ثلاثة فصول: فن التذهيب في الكتب المخطوطة الإسلامية، عناصر الزخرفة وأنواع التصميم، مواضع التذهيب في الكتاب، وأساليبه التاريخية من الأويغور إلى العثمانيين وأسماء مذهّبيه."
  en: "The TDV İslâm Ansiklopedisi entry on tezhip in three sections: the gilding of Islamic manuscripts, its motifs and design types, the places it appears in the book, and its historical styles and named müzehhibs from the Uyghurs to the Ottomans."
  es: "La entrada sobre tezhip en la TDV İslâm Ansiklopedisi se divide en tres secciones: el dorado de los manuscritos islámicos, sus motivos y tipos de diseño, los lugares donde aparece en el libro y sus estilos históricos y los müzehhibs (magnates) con nombre propio, desde los uigures hasta los otomanos."
  fr: "L'entrée de TDV İslâm Ansiklopedisi sur le tezhip en trois sections: la dorure des manuscrits islamiques, ses motifs et types de conception, les endroits où elle apparaît dans le livre, et ses styles historiques et les müzehhibs nommés des Ouïghours aux Ottomans."
  ur: "TDV İslâm Ansiklopedisi کا اندراج tezhip پر تین حصوں میں: اسلامی مخطوطات کی خوبصورتی، اس کی شکلیں اور ڈیزائن کی قسمیں، وہ جگہیں جو یہ کتاب میں دکھائی دیتی ہیں، اور اس کے تاریخی اسلوب اور اویغوروں سے لے کر عثمانیوں تک کے نام۔"
