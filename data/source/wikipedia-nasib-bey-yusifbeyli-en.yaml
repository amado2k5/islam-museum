summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نصيب بك يوسف بكلي؛ تُستخدم لوقائع الكيان فقط. تروي مولده في غنجه في 5 يوليو 1881، ودراسته في أوديسا، وعمله في «ترجمان» في القرم، وتأسيسه حزب الفيدراليين الأتراك واندماجه في مساوات، ووزارته ثم رئاسته لمجلس الوزراء (14 أبريل 1919 – 1 أبريل 1920)، ومقتله في 31 مايو 1920 بعد فراره من باكو."
  en: "English Wikipedia article on Nasib bey Yusifbeyli; used for entity facts only. It recounts his birth at Ganja on 5 July 1881, his Odessa studies, his Terciman work in Crimea, the Turkic Federalist party and its merger into Musavat, his ministries and his premiership (14 April 1919 – 1 April 1920), and his murder on 31 May 1920 after fleeing Baku."
