summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نصيب بك يوسف بكلي؛ تُستخدم لوقائع الكيان فقط. تروي مولده في غنجه في 5 يوليو 1881، ودراسته في أوديسا، وعمله في «ترجمان» في القرم، وتأسيسه حزب الفيدراليين الأتراك واندماجه في مساوات، ووزارته ثم رئاسته لمجلس الوزراء ⁦(14 أبريل 1919 – 1 أبريل 1920)⁩، ومقتله في 31 مايو 1920 بعد فراره من باكو."
  en: "English Wikipedia article on Nasib bey Yusifbeyli; used for entity facts only. It recounts his birth at Ganja on 5 July 1881, his Odessa studies, his Terciman work in Crimea, the Turkic Federalist party and its merger into Musavat, his ministries and his premiership (14 April 1919 – 1 April 1920), and his murder on 31 May 1920 after fleeing Baku."
  es: "Artículo de la Wikipedia en inglés sobre Nasib bey Yusifbeyli; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Ganja el 5 de julio de 1881, sus estudios en Odessa, su labor en Terciman en Crimea, el partido federalista turco y su fusión con Musavat, sus ministerios y su mandato como primer ministro (del 14 de abril de 1919 al 1 de abril de 1920), y su asesinato el 31 de mayo de 1920 tras huir de Bakú."
  fr: "Article de Wikipédia en anglais sur Nasib bey Yusifbeyli; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance à Ganja le 5 juillet 1881, ses études à Odessa, son travail de Terciman en Crimée, le parti fédéraliste turc et sa fusion avec Musavat, ses ministères et son mandat de Premier ministre (14 avril 1919 – 1er avril 1920), et son assassinat le 31 mai 1920 après sa fuite de Bakou."
  ur: "Nasib bey Yusifbeyli پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 5 جولائی 1881 کو گنجا میں اس کی پیدائش، اس کی اوڈیسا کی تعلیم، کریمیا میں اس کے ٹرسیمین کام، ترک وفاقی پارٹی اور اس کا مساوات میں انضمام، اس کی وزارتیں اور اس کی وزارت عظمیٰ ⁦(14 اپریل 1919 - 1 اپریل 1920)⁩ اور 31 مئی 1920 کو بائع کے بعد اس کے قتل کا ذکر ہے۔"
