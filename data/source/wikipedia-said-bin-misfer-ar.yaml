reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule). The article gives his full name (Said bin Misfer bin Mufrih al-Qahtani), his birth in Abha in 1364 AH / 1944, his schooling in Abha, his bachelor's in sharia from Imam Muhammad ibn Saud Islamic University (1401 AH), his master's and doctorate in aqida from Umm al-Qura University (1415 and 1418 AH), his cassette library of more than 500 tapes (among them Ashrat al-Sa'a and 'Indama Yantahir al-'Afaf), more than seven books beginning with Salat al-Jama'a and about forty pamphlets, his lecture tours, and his reported arrest on 1 November 2018 and reported release two months later, citing IslamWay, a Sayd al-Fawa'id interview and press reports for those facts. Its infobox gives his religion as Islam only and names no school. No English Wikipedia article and no Wikidata item for him were found. Checked 25 October 2026."
