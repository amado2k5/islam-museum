summary:
  ar: "مقالة ويكيبيديا الأردية عن تركي بن سعيد البوسعيدي ⁦(1832 – 4 يونيو 1888)⁩، سلطان مسقط وعمان من 30 يناير 1871، وخامس أبناء سعيد بن سلطان؛ تختصر نشأته ورحلته من الهند وفترة علاجه وإدارته، وتنسخ في قسم نشأتها فقرة المقالة العربية الخاطئة ⁦(ولادة 1837 وتولي الحكم 1863)⁩."
  en: "Urdu Wikipedia article on Turki bin Said Al Busaidi (1832 – 4 June 1888), Sultan of Muscat and Oman from 30 January 1871 and fifth son of Said bin Sultan; it summarises his early life, his journey from India, his convalescence and his administration, while its early-life section copies the Arabic article's erroneous paragraph (born 1837, took power in 1863)."
  es: "Artículo de Wikipedia en urdu sobre Turki bin Said Al Busaidi (1832 – 4 de junio de 1888), sultán de Mascate y Omán desde el 30 de enero de 1871 y quinto hijo de Said bin Sultan; resume su juventud, su viaje desde la India, su convalecencia y su administración, mientras que su sección sobre su juventud copia el párrafo erróneo del artículo en árabe (nacido en 1837, tomó el poder en 1863)."
  fr: "L'article de Wikipédia en ourdou sur Turki bin Said Al Busaidi (1832 – 4 juin 1888), sultan de Mascate et d'Oman à partir du 30 janvier 1871 et cinquième fils de Said bin Sultan; il résume sa jeunesse, son voyage depuis l'Inde, sa convalescence et son administration, tandis que sa section sur sa jeunesse copie le paragraphe erroné de l'article arabe (né en 1837, a pris le pouvoir en 1863)."
  ur: "ترکی بن سعید البوسیدی ⁦(1832 - 4 جون 1888)⁩، مسقط اور عمان کے سلطان 30 جنوری 1871 سے اور سعید بن سلطان کے پانچویں بیٹے پر اردو ویکیپیڈیا کا مضمون؛ اس میں ان کی ابتدائی زندگی، ہندوستان سے اس کا سفر، اس کی صحت یابی اور اس کی انتظامیہ کا خلاصہ ہے، جبکہ اس کا ابتدائی زندگی کا حصہ عربی مضمون کے غلط پیراگراف ⁦(پیدائش 1837، 1863 میں اقتدار سنبھالا)⁩ کو نقل کرتا ہے۔"
