  ar: "مقالة ويكيبيديا الأردية عن تركي بن سعيد البوسعيدي (1832 – 4 يونيو 1888)، سلطان مسقط وعمان من 30 يناير 1871، وخامس أبناء سعيد بن سلطان؛ تختصر نشأته ورحلته من الهند وفترة علاجه وإدارته، وتنسخ في قسم نشأتها فقرة المقالة العربية الخاطئة (ولادة 1837 وتولي الحكم 1863)."
  en: "Urdu Wikipedia article on Turki bin Said Al Busaidi (1832 – 4 June 1888), Sultan of Muscat and Oman from 30 January 1871 and fifth son of Said bin Sultan; it summarises his early life, his journey from India, his convalescence and his administration, while its early-life section copies the Arabic article's erroneous paragraph (born 1837, took power in 1863)."
