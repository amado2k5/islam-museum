summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أيوب خان أُميّة ⁦(1930–2008)⁩؛ لوقائع الكيان فقط: جراح أعصاب باكستاني-أمريكي، نال الطب من كلية الملك إدوارد الطبية 1953 وأتم دراسات عليا في أكسفورد ⁦(بيليول)⁩ بمنحة رودس 1956، تدرّب في جراحة الأعصاب تحت جوزف بني باكر ثم هاجر إلى الولايات المتحدة 1961 وتجنّس 1967، ترأس جراحة الأعصاب في المعاهد الوطنية للصحة حتى 1980 وعمل مستشاراً طبياً رئيساً لإدارة النقل 1980–1985 وأستاذاً إكلينيكياً في جامعة جورج واشنطن؛ اخترع خزانه عام 1963 — أول منفذ طبي من السيليكون الخامل ذاتي الإحكام يتيح حقناً داخل القراب متكررة بلا بزلات قطنية متتالية، وأسس نظريته المركزية لإصابات الدماغ الرضية وأول مقياس غيبوبة، وأشرف مع هاونسفيلد على دقة الماسح CT، ودفع إلى إنشاء مركز CDC الوطني للوقاية من الإصابات عبر تقرير «الإصابة في أمريكا»، ونال ستارۀ امتياز 1982، وذكرته مجلة ذا إيكونوميست/«المسلمون الذين صنعوا أمريكا» بين المسلمين المؤثرين."
  en: "English Wikipedia article on Ayub Khan Ommaya ⁦(1930–2008)⁩; entity facts only: Pakistani-American neurosurgeon, medical degree from King Edward Medical College in 1953 and graduate work at Oxford ⁦(Balliol)⁩ as a 1956 Rhodes Scholar, neurosurgical training under Joseph Pennybacker, emigrated to the United States in 1961 and naturalised 1967, Chief of Neurosurgery at the National Institutes of Health to 1980, Chief Medical Advisor to the Department of Transportation 1980–1985, clinical professor at George Washington University; invented the Ommaya reservoir in 1963 — the first subcutaneous port allowing repeated intrathecal injections, the first medical port to use self-sealing inert silicone — founded the centripetal theory of traumatic brain injury and the first coma score, worked with Hounsfield on CT-scanner spatial resolution, drove the creation of the CDC National Center for Injury Prevention and Control through the Injury in America report, received the Sitara-i-Imtiaz in 1982, and was featured in 'The Muslims who shaped America'."
  es: "Artículo de la Wikipedia en inglés sobre Ayub Khan Ommaya (1930–2008); solo datos de la entidad: neurocirujano pakistaní-estadounidense, título de médico del King Edward Medical College en 1953 y estudios de posgrado en Oxford (Balliol) como becario Rhodes en 1956, formación en neurocirugía con Joseph Pennybacker, emigró a los Estados Unidos en 1961 y se naturalizó en 1967, jefe de neurocirugía en los Institutos Nacionales de Salud hasta 1980, asesor médico principal del Departamento de Transporte de 1980 a 1985, profesor clínico en la Universidad George Washington; Inventó el reservorio Ommaya en 1963, el primer puerto subcutáneo que permitía inyecciones intratecales repetidas y el primer puerto médico que utilizaba silicona inerte autosellante. Fundó la teoría centrípeta de la lesión cerebral traumática y la primera escala de coma. Trabajó con Hounsfield en la resolución espacial de los escáneres de tomografía computarizada. Impulsó la creación del Centro Nacional para la Prevención y el Control de Lesiones de los CDC a través del informe \"Lesiones en Estados Unidos\". Recibió la condecoración Sitara-i-Imtiaz en 1982 y apareció en \"Los musulmanes que dieron forma a Estados Unidos\"."
  fr: "Article de Wikipédia en anglais sur Ayub Khan Ommaya (1930–2008); faits sur l'entité uniquement: neurochirurgien pakistano-américain, diplômé du King Edward Medical College en 1953 et études supérieures à Oxford (Balliol) en tant que boursier Rhodes en 1956, formation en neurochirurgie sous Joseph Pennybacker, a émigré aux États-Unis en 1961 et a été naturalisé en 1967, chef du service de neurochirurgie des National Institutes of Health jusqu'en 1980, conseiller médical en chef du ministère des Transports de 1980 à 1985, professeur clinicien à l'université George Washington; Il a inventé le réservoir Ommaya en 1963 — le premier port sous-cutané permettant des injections intrathécales répétées, le premier port médical à utiliser du silicone inerte auto-obturant —, fondé la théorie centripète des lésions cérébrales traumatiques et le premier score de coma, travaillé avec Hounsfield sur la résolution spatiale du scanner CT, impulsé la création du Centre national de prévention et de contrôle des blessures des CDC par le biais du rapport « Injury in America », reçu la Sitara-i-Imtiaz en 1982 et a été présenté dans « Les musulmans qui ont façonné l'Amérique »."
