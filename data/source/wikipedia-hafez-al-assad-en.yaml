summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حافظ الأسد؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 6 أكتوبر 1930 في القرداحة لعائلة فلاحية علوية من قبيلة الكلبية، وصعوده عبر سلاح الجو وحزب البعث، و«الحركة التصحيحية» في نوفمبر 1970 التي أزاحت نور الدين الأتاسي، ورئاسته من مارس 1971 حتى وفاته بأزمة قلبية في دمشق في 10 يونيو 2000، ودفنه في ضريح العائلة بالقرداحة (أُحرق في ديسمبر 2024 ونُبشت رفاته سنة 2025). وتعامله الدراسات المستشهد بها في متنها بوصفه حاكمًا علويًا شخصيًا."
  en: "English Wikipedia article on Hafez al-Assad; used for entity facts only. It gives his birth on 6 October 1930 at Qardaha into an Alawite peasant family of the Kalbiyya tribe, his rise through the air force and the Ba'ath Party, the November 1970 'Corrective Movement' that displaced Nureddin al-Atassi, his presidency from March 1971 until his death from a heart attack at Damascus on 10 June 2000, and his burial in the family mausoleum at Qardaha (burned in December 2024; his remains were exhumed in 2025). Throughout, its cited scholarship treats him personally as an Alawite ruler."
