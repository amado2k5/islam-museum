summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حافظ الأسد؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 6 أكتوبر 1930 في القرداحة لعائلة فلاحية علوية من قبيلة الكلبية، وصعوده عبر سلاح الجو وحزب البعث، و«الحركة التصحيحية» في نوفمبر 1970 التي أزاحت نور الدين الأتاسي، ورئاسته من مارس 1971 حتى وفاته بأزمة قلبية في دمشق في 10 يونيو 2000، ودفنه في ضريح العائلة بالقرداحة ⁦(أُحرق في ديسمبر 2024 ونُبشت رفاته سنة 2025)⁩. وتعامله الدراسات المستشهد بها في متنها بوصفه حاكمًا علويًا شخصيًا."
  en: "English Wikipedia article on Hafez al-Assad; used for entity facts only. It gives his birth on 6 October 1930 at Qardaha into an Alawite peasant family of the Kalbiyya tribe, his rise through the air force and the Ba'ath Party, the November 1970 'Corrective Movement' that displaced Nureddin al-Atassi, his presidency from March 1971 until his death from a heart attack at Damascus on 10 June 2000, and his burial in the family mausoleum at Qardaha (burned in December 2024; his remains were exhumed in 2025). Throughout, its cited scholarship treats him personally as an Alawite ruler."
  es: "Artículo de la Wikipedia en inglés sobre Hafez al-Assad; utilizado únicamente para datos sobre la persona. Describe su nacimiento el 6 de octubre de 1930 en Qardaha en el seno de una familia campesina alauita de la tribu Kalbiyya, su ascenso en la fuerza aérea y el Partido Baaz, el «Movimiento Correctivo» de noviembre de 1970 que derrocó a Nureddin al-Atassi, su presidencia desde marzo de 1971 hasta su muerte por un infarto en Damasco el 10 de junio de 2000, y su entierro en el mausoleo familiar de Qardaha (quemado en diciembre de 2024; sus restos fueron exhumados en 2025). A lo largo del texto, la erudición citada lo presenta personalmente como un gobernante alauita."
  fr: "L'article de Wikipédia en anglais consacré à Hafez al-Assad, utilisé uniquement pour les informations le concernant, relate sa naissance le 6 octobre 1930 à Qardaha, au sein d'une famille paysanne alaouite de la tribu Kalbiyya. Il relate également son ascension au sein de l'armée de l'air et du parti Baas, le « Mouvement correctif » de novembre 1970 qui a renversé Nureddin al-Atassi, sa présidence de mars 1971 jusqu'à sa mort d'une crise cardiaque à Damas le 10 juin 2000, et son inhumation dans le mausolée familial de Qardaha (incinéré en décembre 2024; sa dépouille a été exhumée en 2025). L'ensemble des sources citées le présentent comme un dirigeant alaouite."
  ur: "حافظ الاسد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 6 اکتوبر 1930 کو قردہہ میں کلبیہ قبیلے کے ایک علوی کسان خاندان میں پیدا ہوا، فضائیہ اور بعث پارٹی کے ذریعے اس کا عروج، نومبر 1970 کی 'اصلاحی تحریک' جس نے نورالدین العطاسی کو بے گھر کر دیا، مارچ 1971 سے اس کی صدارت، جون 1971 سے دمشق میں دل کا دورہ پڑنے اور 2001 میں اس کی موت تک۔ قردہ میں خاندانی مقبرہ میں تدفین ⁦(دسمبر 2024 میں جلایا گیا؛ اس کی باقیات کو 2025 میں نکالا گیا)⁩۔ اس کا حوالہ دیا گیا اسکالرشپ اس کے ساتھ ذاتی طور پر ایک علوی حکمران کے طور پر پیش آتا ہے۔"
