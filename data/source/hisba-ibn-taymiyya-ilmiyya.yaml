summary:
  ar: "طبعة دار الكتب العلمية ببيروت لرسالة شيخ الإسلام أحمد بن عبد الحليم بن تيمية ⁦(661-728هـ)⁩ في الحسبة، بعنوان «الحسبة في الإسلام أو وظيفة الحكومة الإسلامية»، في 64 صفحة، مع عناوين فرعية بين معقوفين وحواشٍ في تخريج الأحاديث والتعريف بالأعلام وفهرس للمواضيع؛ لا يذكر اسم المعلق ولا سنة الطبع في الصفحات المقروءة."
  en: "The Dar al-Kutub al-Ilmiyya (Beirut) printing of the treatise on hisba by Shaykh al-Islam Ahmad ibn Abd al-Halim ibn Taymiyya (661-728 AH), titled al-Hisba fi al-Islam aw Wazifat al-Hukuma al-Islamiyya, 64 pages, with sub-headings in square brackets, notes referencing the hadith and identifying persons, and a subject index; the annotator and year are not named in the pages read."
  ur: "شیخ الاسلام احمد بن عبد الحلیم ابن تیمیہ (661-728ھ) کے حسبہ پر رسالے کا دار الکتب العلمیہ (بیروت) ایڈیشن، بعنوان «الحسبۃ فی الاسلام او وظیفۃ الحکومۃ الاسلامیہ»، 64 صفحات، قوسین میں ذیلی عنوانات، احادیث کی تخریج اور اعلام کے تعارف پر حواشی اور فہرستِ مضامین کے ساتھ؛ پڑھے گئے صفحات میں معلق کا نام اور سنِ طباعت درج نہیں۔"
