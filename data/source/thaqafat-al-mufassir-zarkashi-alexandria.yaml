  ar: "ثقافة المفسر عند الزركشي من خلال كتابه البرهان في علوم القرآن — ليلى محمد مسعود عبد المنعم ⁦(رسالة ماجستير، جامعة الإسكندرية)⁩"
  en: "Thaqafat al-Mufassir 'inda al-Zarkashi: the exegete's learning in al-Zarkashi's al-Burhan — Layla Muhammad Mas'ud Abd al-Mun'im (MA thesis, Alexandria University)"
  ur: "ثقافۃ المفسر عند الزرکشی، البرہان فی علوم القرآن کی روشنی میں — لیلیٰ محمد مسعود عبد المنعم ⁦(ایم اے مقالہ، جامعہ اسکندریہ)⁩"
summary:
  ar: "رسالة ماجستير في الآداب قدمتها ليلى محمد مسعود عبد المنعم إلى شعبة الدراسات الإسلامية بقسم اللغة العربية وآدابها واللغات الشرقية بكلية الآداب، جامعة الإسكندرية، بإشراف الدكتور محمد بدري عبد الجليل؛ تدرس ثقافة المفسر قبل الزركشي، ثم عنده في البرهان، ثم أثره في السيوطي ومن بعده."
  en: "An MA thesis in arts by Layla Muhammad Mas'ud Abd al-Mun'im for the Islamic Studies section of the Department of Arabic Language and Literature and Oriental Languages, Faculty of Arts, Alexandria University, supervised by Dr Muhammad Badri Abd al-Jalil; it studies the exegete's learning before al-Zarkashi, in his al-Burhan, and his influence on al-Suyuti and later writers."
  ur: "لیلیٰ محمد مسعود عبد المنعم کا ایم اے ⁦(آداب)⁩ کا مقالہ، کلیۃ الآداب، جامعہ اسکندریہ کے شعبۂ عربی زبان و ادب اور مشرقی زبانوں کی اسلامی علوم کی شاخ کے لیے، ڈاکٹر محمد بدری عبد الجلیل کی نگرانی میں؛ اس میں زرکشی سے پہلے مفسر کی علمی تیاری، البرہان میں زرکشی کے ہاں، اور سیوطی اور بعد والوں پر ان کے اثر کا مطالعہ ہے۔"
