label:
  ar: "ثقافة المفسر عند الزركشي من خلال كتابه البرهان في علوم القرآن — ليلى محمد مسعود عبد المنعم ⁦(رسالة ماجستير، جامعة الإسكندرية)⁩"
  en: "Thaqafat al-Mufassir 'inda al-Zarkashi: the exegete's learning in al-Zarkashi's al-Burhan — Layla Muhammad Mas'ud Abd al-Mun'im (MA thesis, Alexandria University)"
  ur: "ثقافۃ المفسر عند الزرکشی، البرہان فی علوم القرآن کی روشنی میں — لیلیٰ محمد مسعود عبد المنعم ⁦(ایم اے مقالہ، جامعہ اسکندریہ)⁩"
summary:
  ar: "رسالة ماجستير في الآداب قدمتها ليلى محمد مسعود عبد المنعم إلى شعبة الدراسات الإسلامية بقسم اللغة العربية وآدابها واللغات الشرقية بكلية الآداب، جامعة الإسكندرية، بإشراف الدكتور محمد بدري عبد الجليل؛ تدرس ثقافة المفسر قبل الزركشي، ثم عنده في البرهان، ثم أثره في السيوطي ومن بعده."
  en: "An MA thesis in arts by Layla Muhammad Mas'ud Abd al-Mun'im for the Islamic Studies section of the Department of Arabic Language and Literature and Oriental Languages, Faculty of Arts, Alexandria University, supervised by Dr Muhammad Badri Abd al-Jalil; it studies the exegete's learning before al-Zarkashi, in his al-Burhan, and his influence on al-Suyuti and later writers."
  ur: "لیلیٰ محمد مسعود عبد المنعم کا ایم اے ⁦(آداب)⁩ کا مقالہ، کلیۃ الآداب، جامعہ اسکندریہ کے شعبۂ عربی زبان و ادب اور مشرقی زبانوں کی اسلامی علوم کی شاخ کے لیے، ڈاکٹر محمد بدری عبد الجلیل کی نگرانی میں؛ اس میں زرکشی سے پہلے مفسر کی علمی تیاری، البرہان میں زرکشی کے ہاں، اور سیوطی اور بعد والوں پر ان کے اثر کا مطالعہ ہے۔"
  es: "Tesis de maestría en artes de Layla Muhammad Mas'ud Abd al-Mun'im para la sección de Estudios Islámicos del Departamento de Lengua y Literatura Árabe y Lenguas Orientales de la Facultad de Artes de la Universidad de Alejandría, bajo la supervisión del Dr. Muhammad Badri Abd al-Jalil; estudia el aprendizaje del exegeta antes de al-Zarkashi, en su obra al-Burhan, y su influencia en al-Suyuti y escritores posteriores."
  fr: "Mémoire de maîtrise en arts de Layla Muhammad Mas'ud Abd al-Mun'im pour la section d'études islamiques du département de langue et littérature arabes et de langues orientales, faculté des arts, université d'Alexandrie, sous la direction du Dr Muhammad Badri Abd al-Jalil; il étudie l'érudition de l'exégète avant al-Zarkashi, dans son al-Burhan, et son influence sur al-Suyuti et les écrivains ultérieurs."
  tr: "Alexandria Üniversitesi Sanat Fakültesi Arap Dili ve Edebiyatı ile Doğu Dilleri Bölümü, İskela Mohamed Masoud Abdel Moneim tarafından sunulan Sanat Yüksek Lisans tezi, Dr. Mohamed Badri Abdel Jalil danışmanlığında; Al-Zarkashi'den önce, ardından Al-Burhan'da onunla birlikte olan tefsircinin kültürünü, ardından Al-Suyuti ve sonrasında üzerindeki etkisini incelemektedir."
  id: "Tesis magister Seni yang diajukan oleh Laila Mohamed Masoud Abdel Moneim ke Departemen Studi Islam, Departemen Bahasa dan Sastra Arab serta Bahasa Timur di Fakultas Seni, Universitas Alexandria, dibimbing oleh Dr. Mohamed Badri Abdel Jalil; tesis ini mempelajari budaya penafsir sebelum Al-Zarkashi, kemudian bersamanya di Al-Burhan, kemudian pengaruhnya pada Al-Suyuti dan setelahnya."
