summary:
  ar: "مدخل «قبودان باشا» في موسوعة TDV الإسلامية: منصب أمير البحر العثماني من قبوطان بيه گليبولو إلى بربروس باشا فقبودان دريا، مهامه ومرتبه وموارده وعلاقته بالترسانة، وإلغاء اللقب مع تأسيس نظارة البحرية سنة 1867."
  en: "The TDV İslâm Ansiklopedisi entry on the kapudan pasha: the Ottoman fleet commander's office from the Gelibolu sancak beyi kapudans to Barbarossa's beylerbeyilik and the kapudân-ı deryâ title, his duties, rank, revenues and dockyard seat, and the title's abolition when the Bahriye Nezâreti was founded in 1867."
  ur: "TDV اسلامی انسائیکلوپیڈیا کا مادہ «قپودان پاشا»: عثمانی امیر البحر کا منصب گلیبولو کے صنجق بیگی قپودانوں سے بربروس کے بیلربیگی اور قپودان دریا لقب تک، فرائض، رتبہ، آمدنی اور ترسانہ نشست، اور 1867 میں بحریہ نظارت کے قیام پر لقب کا خاتمہ۔"
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el kapudan pasha: el cargo de comandante de la flota otomana desde los kapudans del sancak beyi de Gelibolu hasta el beylerbeyilik de Barbarroja y el título de kapudân-ı deryâ, sus deberes, rango, ingresos y sede del astillero, y la abolición del título cuando se fundó el Bahriye Nezâreti en 1867."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur le kapudan pasha: le bureau du commandant de la flotte ottomane depuis les Gelibolu sancak beyi kapudans jusqu'au beylerbeyilik de Barbarossa et au titre de kapudân-ı deryâ, ses fonctions, son rang, ses revenus et son siège dans les chantiers navals, et l'abolition du titre lors de la fondation de la Bahriye Nezâreti en 1867."
  tr: "TDV İslami Ansiklopedisi'nde 'Kubudan Paşa' maddesi: Coptan Bey Glipulu'dan Barbarossa Paşa Fuqbudan Darya'ya kadar Osmanlı Amiralinin pozisyonu, görevleri, rütbesi, kaynakları ve cephanelikle ilişkisi ile 1867'de Donanma Müdürlüğü'nün kurulmasıyla unvanın kaldırılması."
  id: "Entri tentang 'Qubudan Pasha' dalam Ensiklopedia Islam TDV: Posisi Laksamana Ottoman dari Coptan Bey Glipulu hingga Barbarossa Pasha Fuqbudan Darya, tugas, pangkat, sumber daya, dan hubungannya dengan arsenal, serta penghapusan gelar tersebut dengan berdirinya Direktorat Angkatan Laut pada tahun 1867."
