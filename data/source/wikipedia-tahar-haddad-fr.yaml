summary:
  ar: "مقالة ويكيبيديا الفرنسية عن الطاهر الحداد؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بتونس في 4 ديسمبر 1899 ووفاته في 7 ديسمبر 1935، وتفصّل كتابه «امرأتنا في الشريعة والمجتمع» (1930) بوصفه قراءة تحديثية للقرآن ودعوة إلى الاجتهاد تستند إلى ما يوافق الشريعة، وتذكر تصنيفاتها دفنه بمقبرة الجلاز بتونس وأن مكان وفاته غير معروف."
  en: "French Wikipedia article on Tahar Haddad; used for entity facts only. It gives his birth in Tunis on 4 December 1899 and death on 7 December 1935, and details his 1930 book as a modernist reading of the Qur'an and a call to ijtihad drawing on what accords with the shari'a; its categories place his burial at the Djellaz cemetery in Tunis and mark his place of death unknown."
