summary:
  ar: "مقالة ويكيبيديا الفرنسية عن الطاهر الحداد؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بتونس في 4 ديسمبر 1899 ووفاته في 7 ديسمبر 1935، وتفصّل كتابه «امرأتنا في الشريعة والمجتمع» (1930) بوصفه قراءة تحديثية للقرآن ودعوة إلى الاجتهاد تستند إلى ما يوافق الشريعة، وتذكر تصنيفاتها دفنه بمقبرة الجلاز بتونس وأن مكان وفاته غير معروف."
  en: "French Wikipedia article on Tahar Haddad; used for entity facts only. It gives his birth in Tunis on 4 December 1899 and death on 7 December 1935, and details his 1930 book as a modernist reading of the Qur'an and a call to ijtihad drawing on what accords with the shari'a; its categories place his burial at the Djellaz cemetery in Tunis and mark his place of death unknown."
  es: "Artículo de la Wikipedia en francés sobre Tahar Haddad; utilizado únicamente para datos sobre la persona. Indica que nació en Túnez el 4 de diciembre de 1899 y falleció el 7 de diciembre de 1935, y detalla su libro de 1930 como una interpretación modernista del Corán y un llamado al ijtihad basado en lo que concuerda con la sharia; sus categorías sitúan su entierro en el cementerio de Djellaz en Túnez y señalan que se desconoce el lugar de su fallecimiento."
  fr: "L'article de Wikipédia en français sur Tahar Haddad, utilisé uniquement pour les informations le concernant, indique sa naissance à Tunis le 4 décembre 1899 et sa mort le 7 décembre 1935. Il décrit son ouvrage de 1930 comme une lecture moderniste du Coran et un appel à l'ijtihad (effort d'interprétation) fondé sur la charia. Ses catégories situent son inhumation au cimetière de Djellaz à Tunis, mais indiquent que son lieu de décès est inconnu."
  ur: "تہار حداد پر فرانسیسی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 4 دسمبر 1899 کو تیونس میں ان کی پیدائش اور 7 دسمبر 1935 کو موت واقع ہوئی ہے، اور اس کی 1930 کی کتاب میں قرآن کی جدیدیت کے مطالعہ اور شریعت کے مطابق اجتہاد کی دعوت کے طور پر تفصیل دی گئی ہے۔ اس کے زمرے اس کی تدفین تیونس کے جیلاز قبرستان میں کرتے ہیں اور اس کی موت کی جگہ نامعلوم بتاتے ہیں۔"
  tr: "Tahar Haddad hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 4 Aralık 1899'da Tunus'ta doğdu ve 7 Aralık 1935'te vefat etti; \"Şeriat ve Toplumda Kadınımız\" (1930) adlı kitabını Kur'an'ın modernleştirici bir yorumu ve Şeriat'a uygun olan bir ictihad çağrısı olarak detaylandırıyor. Kitaptaki sınıflandırmalar, Tunus'taki Jelaz Mezarlığı'na defnedilmesini ve ölüm yerinin bilinmediğini belirtiyor."
  id: "Artikel Wikipedia Prancis tentang Tahar Haddad; hanya digunakan untuk fakta entitas tersebut. Ia lahir di Tunis pada 4 Desember 1899, dan meninggal pada 7 Desember 1935, serta merinci bukunya \"Wanita Kami dalam Syariah dan Masyarakat\" (1930) sebagai pembacaan Al-Qur'an yang modernisasi dan seruan untuk ijtihad berdasarkan apa yang sesuai dengan Syariah. Klasifikasinya menyebutkan pemakamannya di Pemakaman Jelaz di Tunisia dan bahwa tempat kematiannya tidak diketahui."
