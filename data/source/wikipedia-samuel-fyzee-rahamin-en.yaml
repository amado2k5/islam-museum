reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026; the article was fetched by its recorded revision id through the MediaWiki API and the returned id asserted equal before use. It gives his birth on 19 December 1880 at Poona under the birth name S. Rahamin Samuel Talkar, in a Bene Israel Jewish family, and his death on 1 January 1964 at Karachi; its conversion account (1912, on his marriage to Atiya Begum) cites a 2014 Business Standard book review and a 2014 Frontline article, and it quotes an Art UK account calling him 'the first Muslim artist in the Tate collection'. It names no Islamic school for him."
