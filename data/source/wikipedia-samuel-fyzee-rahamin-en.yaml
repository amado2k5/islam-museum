  ar: "مقالة ويكيبيديا الإنجليزية عن صموئيل فيضي رحيمين؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 19 كانون الأول 1880 في بونا باسم س. رحيمين صموئيل تلكر في أسرة يهودية من بني إسرائيل، واعتناقه الإسلام سنة 1912 ليتزوج عطية فيضي واتخاذه اسم فيضي رحيمين، ومسيرته رساماً، وهجرته إلى كراتشي سنة 1948 ووفاته فيها فقيراً سنة 1964."
  en: "English Wikipedia article on Samuel Fyzee-Rahamin; used for entity facts only. It recounts his birth on 19 December 1880 in Poona as S. Rahamin Samuel Talkar into a Bene Israel Jewish family, his conversion to Islam in 1912 to marry Atiya Fyzee and his taking of the name Fyzee-Rahamin, his career as a painter, his emigration to Karachi in 1948 and his death there in poverty in 1964."
