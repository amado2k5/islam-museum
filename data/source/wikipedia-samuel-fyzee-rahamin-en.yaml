summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صموئيل فيضي رحيمين؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 19 كانون الأول 1880 في بونا باسم س. رحيمين صموئيل تلكر في أسرة يهودية من بني إسرائيل، واعتناقه الإسلام سنة 1912 ليتزوج عطية فيضي واتخاذه اسم فيضي رحيمين، ومسيرته رساماً، وهجرته إلى كراتشي سنة 1948 ووفاته فيها فقيراً سنة 1964."
  en: "English Wikipedia article on Samuel Fyzee-Rahamin; used for entity facts only. It recounts his birth on 19 December 1880 in Poona as S. Rahamin Samuel Talkar into a Bene Israel Jewish family, his conversion to Islam in 1912 to marry Atiya Fyzee and his taking of the name Fyzee-Rahamin, his career as a painter, his emigration to Karachi in 1948 and his death there in poverty in 1964."
  es: "Artículo de la Wikipedia en inglés sobre Samuel Fyzee-Rahamin; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 19 de diciembre de 1880 en Poona como S. Rahamin Samuel Talkar en el seno de una familia judía Bene Israel, su conversión al Islam en 1912 para casarse con Atiya Fyzee y adoptar el nombre de Fyzee-Rahamin, su carrera como pintor, su emigración a Karachi en 1948 y su muerte allí en la pobreza en 1964."
  fr: "Article de Wikipédia en anglais sur Samuel Fyzee-Rahamin; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance le 19 décembre 1880 à Pune sous le nom de S. Rahamin Samuel Talkar, au sein d’une famille juive Bene Israel, sa conversion à l’islam en 1912 pour épouser Atiya Fyzee et l’adoption du nom de Fyzee-Rahamin, sa carrière de peintre, son émigration à Karachi en 1948 et sa mort dans la pauvreté dans cette même ville en 1964."
  ur: "انگریزی ویکیپیڈیا مضمون سیموئیل فائزی-رحمن پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 19 دسمبر 1880 کو پونا میں ایک بنی اسرائیل یہودی خاندان میں ایس رامین سیموئیل ٹاکر کے طور پر، 1912 میں عطیہ فیزی سے شادی کرنے کے لیے اسلام قبول کرنے اور فیزی-رحمن نام رکھنے، بطور مصور کے کیریئر، 1948 میں کراچی ہجرت اور 1948 میں ان کی موت کے بارے میں بتایا گیا ہے۔"
