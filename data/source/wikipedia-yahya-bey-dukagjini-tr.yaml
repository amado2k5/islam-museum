  ar: "مقالة ويكيبيديا التركية عن طاشليجه لي يحيى بك؛ تعطي ولادته 1488/89 ووفاته 1582 في لوزنيتشه، ودروسه على كمال باشازاده وقدري أفندي وفناري زاده محيي الدين جلبي، ونفيه إلى زفورنيك أو تيمشوار، ودفنه في زفورنيك أو إسطنبول على الخلاف."
  en: "Turkish Wikipedia article on Taşlıcalı Yahya Bey; it gives his birth in 1488/89 and death in 1582 at Loznica, his lessons from Kemal Paşazade, Kadri Efendi and Fenarizade Muhyiddin Çelebi, his exile to Zvornik or Temeşvar, and his disputed burial at Zvornik or Istanbul."
