summary:
  ar: "رسالة الباحث عبد الرحمن محمد صالح، قُدمت للأزهر الشريف سنة 1356هـ (1937م) ضمن امتحان طلبة التخصص للتدريس، ونشرها مجمع البحوث الإسلامية في سلسلته العلمية (الكتاب السادس من السنة السادسة) سنة 1446هـ (2025م)، في 148 صفحة. تبحث في المتون العلمية من جهة أثرها في التربية، وتنتهي إلى أنها صالحة للدراسة إذا وُضعت لمن تُدرَّس له، ومع ذلك تُناقش ابن خلدون والحجوي في نقدهما للمختصرات."
  en: "A thesis by Abd al-Rahman Muhammad Salih, submitted to al-Azhar in 1356 AH (1937 CE) for teacher-training candidates, published by the Islamic Research Academy in its Scientific Series in 1446 AH (2025 CE), 148 pages. It studies the scientific matns (condensed school texts) as tools of education and concludes that they suit the learners they are written for, while discussing the objections of Ibn Khaldun and al-Hajwi."
