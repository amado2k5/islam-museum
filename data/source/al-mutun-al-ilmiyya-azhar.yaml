label:
  ar: المتون العلمية وأثرها في التربية — عبد الرحمن محمد صالح
  en: Scientific Matns and their Effect on Education — Abd al-Rahman Muhammad Salih
summary:
  ar: "رسالة الباحث عبد الرحمن محمد صالح، قُدمت للأزهر الشريف سنة 1356هـ ⁦(1937م)⁩ ضمن امتحان طلبة التخصص للتدريس، ونشرها مجمع البحوث الإسلامية في سلسلته العلمية ⁦(الكتاب السادس من السنة السادسة)⁩ سنة 1446هـ ⁦(2025م)⁩، في 148 صفحة. تبحث في المتون العلمية من جهة أثرها في التربية، وتنتهي إلى أنها صالحة للدراسة إذا وُضعت لمن تُدرَّس له، ومع ذلك تُناقش ابن خلدون والحجوي في نقدهما للمختصرات."
  en: "A thesis by Abd al-Rahman Muhammad Salih, submitted to al-Azhar in 1356 AH (1937 CE) for teacher-training candidates, published by the Islamic Research Academy in its Scientific Series in 1446 AH (2025 CE), 148 pages. It studies the scientific matns (condensed school texts) as tools of education and concludes that they suit the learners they are written for, while discussing the objections of Ibn Khaldun and al-Hajwi."
  es: "Tesis de Abd al-Rahman Muhammad Salih, presentada a al-Azhar en 1356 AH (1937 d. C.) para la formación de docentes, publicada por la Academia de Investigación Islámica en su Serie Científica en 1446 AH (2025 d. C.), de 148 páginas. En ella se estudian los matns científicos (textos escolares condensados) como herramientas educativas y se concluye que son adecuados para los alumnos a quienes van dirigidos, al tiempo que se analizan las objeciones de Ibn Khaldun y al-Hajwi."
  fr: "Thèse d'Abd al-Rahman Muhammad Salih, soumise à al-Azhar en 1356 AH (1937 ap. J.-C.) pour les candidats à la formation d'enseignants, publiée par l'Académie de recherche islamique dans sa série scientifique en 1446 AH (2025 ap. J.-C.), 148 pages. Elle étudie les matns scientifiques (textes scolaires condensés) comme outils d'éducation et conclut qu'ils conviennent aux apprenants auxquels ils sont destinés, tout en discutant des objections d'Ibn Khaldun et d'al-Hajwi."
