summary:
  ar: "مقالة ويكيبيديا الأردية عن ملک کافور؛ تذكر صراحة أنه كان غلامًا قبل الإسلام فأسلم، وحملاته حتى گولكنڈا؛ تُستخدم لوقائع الكيان فقط ولشهادة الإسلام الثانية تحديدًا."
  en: "Urdu Wikipedia article on Malik Kafur; it states plainly that the slave Kafur accepted Islam, and outlines his campaigns as far as Golconda; used for entity facts only, and in particular as the second text attesting his conversion."
  es: "Artículo de Wikipedia en urdu sobre Malik Kafur; afirma claramente que el esclavo Kafur aceptó el Islam y describe sus campañas hasta Golconda; se utiliza únicamente para datos objetivos y, en particular, como segundo texto que atestigua su conversión."
  fr: "Article de Wikipédia en ourdou sur Malik Kafur; il indique clairement que l'esclave Kafur s'est converti à l'islam et décrit ses campagnes jusqu'à Golconde; utilisé uniquement pour des faits concernant l'entité, et en particulier comme deuxième texte attestant sa conversion."
  ur: "ملک کافور پر اردو ویکیپیڈیا مضمون؛ یہ واضح طور پر بیان کرتا ہے کہ غلام کافور نے اسلام قبول کیا، اور گولکنڈہ تک اپنی مہمات کا خاکہ پیش کیا۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، اور خاص طور پر دوسرے متن کے طور پر جو اس کی تبدیلی کی تصدیق کرتا ہے۔"
  tr: "Malik Kafur hakkında Urduca Wikipedia makalesi, onun İslam'dan önce köle olduğunu ve İslam'a geçtiğini açıkça belirtir ve Golconda'ya kadar olan seferleri sadece varlığın gerçekleri ve özellikle İslam'ın ikinci tanıklığı için kullanılır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Malik Kafur secara eksplisit menyebutkan bahwa dia adalah budak sebelum Islam dan memeluk Islam, dan kampanyenya hingga Golconda hanya digunakan untuk fakta entitas tersebut dan khususnya untuk kesaksian kedua Islam."
