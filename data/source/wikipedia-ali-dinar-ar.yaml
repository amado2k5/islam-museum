reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 1856 at the village of al-Shawaya west of Nyala, son of the sultan Zakariya ibn Muhammad Fadl, whose father supported his uncle the sultan Abu al-Khayrat in the Abu Jummayza revolt; he was proclaimed sultan after Abu al-Khayrat's death, joined the Mahdist revolution and came to al-Fashir in 1891, visited Omdurman in 1892 and gave allegiance to the Khalifa Abdallahi, served in the Mahdist forces under Ibrahim al-Khalil against the Ali Jili movement, returned to al-Fashir in September 1898 and restored his ancestors' throne, and was killed defending the country's independence at the battle of al-Baranjiyya on 6 November 1916 — dated in the lead '11 Muharram 1335 AH / 6 November 1916', a pairing the tabular conversion confirms exactly, so the record's Hijri year is the article's own, not a derivation. The article presents his Mahdism warmly — he 'spread the Mahdist call in the Khalifa's era' and sent the Mahmal yearly — where the English article presents a subordinated and eventually anti-Mahdist sultan; the record carries both framings attributed, as the prose does. It also records his works of piety as Darfur tradition holds them: a factory at al-Fashir making the Kiswa of the Kaaba, which he sent to Mecca for some twenty years; the digging of the Abyar Ali wells at the miqat of Dhu al-Hulayfa and the renovation of its mosque; and his palace at al-Fashir, built 1871–1912 under the Baghdadi Hajj Abd al-Razzaq 'Basha Buk', which became Sudan's second museum. The article names no school of law or theology for him."
