summary:
  ar: "مقالة ويكيبيديا العربية عن السلطان علي دينار (1856-1916)؛ تُستخدم لوقائع الكيان فقط. تؤرخ وفاته بـ11 محرم 1335 هـ / 6 نوفمبر 1916، وتذكر إرساله كسوة الكعبة نحو عشرين عاما وحفره أبيار علي بذي الحليفة وقصرَه المتحفَ بالفاشر."
  en: "Arabic Wikipedia article on Sultan Ali Dinar (1856–1916); used for entity facts only. It dates his death to 11 Muharram 1335 AH / 6 November 1916, and records his sending of the Kaaba's Kiswa for some twenty years, his digging of the Abyar Ali wells at Dhu al-Hulayfa, and his palace-museum at al-Fashir."
  es: "Artículo en árabe de la Wikipedia sobre el sultán Ali Dinar (1856-1916); utilizado únicamente para datos sobre la persona. Fecha su muerte el 11 de Muharram de 1335 AH / 6 de noviembre de 1916, y registra su labor de enviar la Kiswa de la Kaaba durante unos veinte años, la excavación de los pozos de Abyar Ali en Dhu al-Hulayfa y su palacio-museo en al-Fashir."
  fr: "Article de Wikipédia en arabe sur le sultan Ali Dinar (1856-1916); utilisé uniquement à des fins d'information sur l'entité. Il date sa mort du 11 Muharram 1335 AH / 6 novembre 1916 et mentionne l'envoi de la Kiswa de la Kaaba pendant une vingtaine d'années, le creusement des puits d'Abyar Ali à Dhu al-Hulayfa et son palais-musée à al-Fashir."
  ur: "سلطان علی دینار (1856-1916) پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی وفات کی تاریخ 11 محرم 1335 ہجری / 6 نومبر 1916 ہے، اور اس کے بیس سال تک کعبہ کا کسوہ بھیجنے، ذی الحلیفہ میں ابیار علی کے کنویں کی کھدائی، اور الفشیر میں اس کے محل میوزیم کو ریکارڈ کیا گیا ہے۔"
