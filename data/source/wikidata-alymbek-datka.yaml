  tr: "Wikidata öğesi Alembek Datka için Q20604212; yalnızca tanımlayıcılar ve organize bilgiler için kullanılır. 1799'daki doğumu ve 24 Şubat 1862'deki ölümü bugün tam olarak kaydedilmiştir ve dini bir değer taşımamaktadır (P140)."
  id: "Elemen Wikidata Q20604212 untuk Alembek Datka; hanya digunakan untuk pengenal dan fakta terorganisir. Kelahirannya pada tahun 1799 dan kematiannya pada 24 Februari 1862, tercatat tepat hari ini, dan tidak memiliki nilai religius (Hlm. 140)."
