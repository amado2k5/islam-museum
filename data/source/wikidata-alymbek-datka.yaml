  fr: "L'élément Wikidata Q20604212 concerne Alymbek Datka; il sert uniquement aux identifiants et aux informations structurées. Il indique sa naissance en 1799 et sa mort le 24 février 1862 (avec une précision au jour près), ainsi que l'année 1862 (avec une précision au jour près). Aucune information relative à la religion (P140) n'est fournie."
