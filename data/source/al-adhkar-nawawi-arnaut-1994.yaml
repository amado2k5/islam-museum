summary:
  ar: "كتاب «الأذكار» للنووي بتحقيق عبد القادر الأرنؤوط، مقروءا على المكتبة الشاملة: مقدمة، ثم أبواب أذكار اليوم من الاستيقاظ إلى النوم، ثم عشرون كتابا وقسما من تلاوة القرآن إلى الاستغفار."
  en: "Al-Nawawi's al-Adhkar in Abd al-Qadir al-Arna'ut's edition, read on al-Maktaba al-Shamila: an introduction, the chapters of the day's remembrances from waking to sleep, then twenty further books and divisions, from the recitation of the Qur'an to the seeking of forgiveness."
  ur: "نووی کی «الاذکار»، عبد القادر الارناؤوط کی تحقیق، المکتبۃ الشاملہ پر پڑھی گئی: مقدمہ، پھر بیداری سے نیند تک دن کے اذکار کے ابواب، پھر تلاوتِ قرآن سے استغفار تک بیس مزید کتابیں اور اقسام۔"
  es: "El al-Adhkar de Al-Nawawi en la edición de Abd al-Qadir al-Arna'ut, leído en al-Maktaba al-Shamila: una introducción, los capítulos de las reflexiones diarias desde que se despierta hasta que se duerme, luego veinte libros y divisiones más, desde la recitación del Corán hasta la búsqueda del perdón."
  fr: "L'édition al-Adhkar d'Al-Nawawi dans Abd al-Qadir al-Arna'ut, lue sur al-Maktaba al-Shamila: une introduction, les chapitres des souvenirs de la journée, du réveil au coucher, puis vingt autres livres et divisions, de la récitation du Coran à la recherche du pardon."
  tr: "Al-Nawawi'nin Abdul Kadir Al-Arna'ut tarafından derlenen \"Al-Adhkar\" adlı kitabı, Al-Maktaba Al-Shamela: Giriş, ardından uyanıştan uykuya kadar bugünün anılarına dair bölümler, ardından yirmi kitap ve Kur'an okumasından af arayışına kadar bölümler okudu."
  id: "Buku \"Al-Adhkar\" karya Al-Nawawi, yang diedit oleh Abdul Qadir Al-Arna'ut, dibacakan tentang Al-Maktaba Al-Shamela: Pendahuluan, kemudian bab-bab tentang kenangan hari ini dari bangun tidur, kemudian dua puluh buku dan bagian dari pembacaan Al-Qur'an hingga permohonan pengampunan."
reliability_note: "Read on al-Maktaba al-Shamila (book 1956), which states that its numbering follows the printed edition; the printed page is the one shown in each page's header, two higher than the number in the page's address. The editor's footnotes and the remarks of later scholars printed with them are not al-Nawawi's and are not attributed to him. No printed copy was opened. Read on 13 and 14 November 2026."
