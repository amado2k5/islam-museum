  ar: "كتاب «الأذكار» للنووي بتحقيق عبد القادر الأرنؤوط، مقروءا على المكتبة الشاملة: مقدمة، ثم أبواب أذكار اليوم من الاستيقاظ إلى النوم، ثم عشرون كتابا وقسما من تلاوة القرآن إلى الاستغفار."
  en: "Al-Nawawi's al-Adhkar in Abd al-Qadir al-Arna'ut's edition, read on al-Maktaba al-Shamila: an introduction, the chapters of the day's remembrances from waking to sleep, then twenty further books and divisions, from the recitation of the Qur'an to the seeking of forgiveness."
  ur: "نووی کی «الاذکار»، عبد القادر الارناؤوط کی تحقیق، المکتبۃ الشاملہ پر پڑھی گئی: مقدمہ، پھر بیداری سے نیند تک دن کے اذکار کے ابواب، پھر تلاوتِ قرآن سے استغفار تک بیس مزید کتابیں اور اقسام۔"
reliability_note: "Read on al-Maktaba al-Shamila (book 1956), which states that its numbering follows the printed edition; the printed page is the one shown in each page's header, two higher than the number in the page's address. The editor's footnotes and the remarks of later scholars printed with them are not al-Nawawi's and are not attributed to him. No printed copy was opened. Read on 13 and 14 November 2026."
