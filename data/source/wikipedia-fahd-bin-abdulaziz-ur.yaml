summary:
  ar: "مختصر ويكيبيديا الأردية عن فهد بن عبد العزيز آل سعود؛ يُستخدم لوقائع الكيان فقط. يذكر أنه كان وزيرًا للتعليم قبل أن يصير وليًا للعهد سنة 1975، وملكًا سنة 1982 بعد وفاة الملك خالد، وحليفًا للولايات المتحدة في حرب الخليج سمح بقواعد أمريكية، وأنه اعتزل شؤون الحكم اليومية بعد مرضه تاركًا السلطة لولي العهد عبد الله، قبل وفاته سنة 2005. وتصنيفاته تدرجه في مواليد 1920 و1921 معًا وفي «سعودی سنی مسلم»."
  en: "Urdu Wikipedia stub on Fahd bin Abdulaziz Al Saud; used for entity facts only. It records him as Minister of Education before becoming Crown Prince in 1975, king in 1982 after King Khalid's death, an ally of the United States in the Gulf War who permitted American bases, and as having withdrawn from daily government after illness, leaving authority with Crown Prince Abdullah, before his death in 2005. Its categories file him under both 1920 and 1921 births and under 'Saudi Sunni Muslims'."
  es: "Fragmento de la Wikipedia en urdu sobre Fahd bin Abdulaziz Al Saud; se utiliza únicamente para datos sobre la persona. Lo registra como Ministro de Educación antes de convertirse en Príncipe Heredero en 1975, rey en 1982 tras la muerte del Rey Khalid, aliado de Estados Unidos en la Guerra del Golfo que permitió bases estadounidenses, y como alguien que se retiró del gobierno diario tras una enfermedad, dejando la autoridad al Príncipe Heredero Abdullah, antes de su muerte en 2005. Sus categorías lo clasifican tanto en nacimientos de 1920 como de 1921 y bajo la categoría de \"musulmanes sunitas saudíes\"."
  fr: "Ébauche de l'article Wikipédia en ourdou sur Fahd ben Abdelaziz Al Saoud; utilisé uniquement pour les informations factuelles. Il est mentionné comme ministre de l'Éducation avant de devenir prince héritier en 1975, puis roi en 1982 après la mort du roi Khalid. Allié des États-Unis pendant la guerre du Golfe, il autorisa l'implantation de bases américaines. Il est également indiqué qu'il s'est retiré du gouvernement quotidien pour raisons de santé, laissant le pouvoir au prince héritier Abdallah, avant le décès de ce dernier en 2005. Ses catégories le classent parmi les personnes nées en 1920 et 1921, ainsi que dans la catégorie « Musulmans sunnites saoudiens »."
  ur: "فہد بن عبدالعزیز آل سعود پر اردو ویکیپیڈیا اسٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں انہیں 1975 میں ولی عہد بننے سے پہلے وزیر تعلیم کے طور پر، 1982 میں شاہ خالد کی موت کے بعد بادشاہ، خلیجی جنگ میں ریاستہائے متحدہ کے اتحادی، جس نے امریکی اڈوں کی اجازت دی، اور بیماری کے بعد روزانہ کی حکومت سے دستبردار ہونے کے طور پر، 2005 میں اپنی موت سے قبل ولی عہد عبداللہ کے ساتھ اختیار چھوڑنے کے طور پر ریکارڈ کیا ہے۔ مسلمانوں'۔"
  tr: "Fahd bin Abdulaziz Al Saud hakkında Urduca Vikipedi özeti; yalnızca varlığın gerçekleri için kullanılmıştır. 1975'te Veliaht Prens olmadan önce Eğitim Bakanıydı, 1982'de Kral Halid'in ölümünden sonra Kral oldu ve Körfez Savaşı'nda Amerika Birleşik Devletleri'nin müttefiki olarak Amerikan üslerine izin verdi. Hastalık sonrası günlük yönetim işlerinden emekli oldu ve 2005'teki ölümünden önce Veliaht Prens Abdullah'a devretti. Sınıflandırmaları 1920 ve 1921 doğumlu olarak birlikte ve 'Suudi Sünni Müslüman' olarak listelenmiştir."
  id: "Ringkasan Wikipedia Urdu tentang Fahd bin Abdulaziz Al Saud; digunakan hanya untuk fakta entitas. Perlu disebutkan bahwa ia pernah menjadi Menteri Pendidikan sebelum menjadi Putra Mahkota pada tahun 1975, Raja pada tahun 1982 setelah kematian Raja Khalid, dan sekutu Amerika Serikat dalam Perang Teluk yang mengizinkan pangkalan Amerika. Ia pensiun dari urusan pemerintahan sehari-hari setelah sakit, meninggalkan kekuasaan kepada Putra Mahkota Abdullah sebelum wafat pada tahun 2005. Klasifikasinya tercatat lahir bersama pada tahun 1920 dan 1921, serta dalam 'Muslim Sunni Saudi.'"
