summary:
  ar: "مختصر ويكيبيديا الأردية عن فهد بن عبد العزيز آل سعود؛ يُستخدم لوقائع الكيان فقط. يذكر أنه كان وزيرًا للتعليم قبل أن يصير وليًا للعهد سنة 1975، وملكًا سنة 1982 بعد وفاة الملك خالد، وحليفًا للولايات المتحدة في حرب الخليج سمح بقواعد أمريكية، وأنه اعتزل شؤون الحكم اليومية بعد مرضه تاركًا السلطة لولي العهد عبد الله، قبل وفاته سنة 2005. وتصنيفاته تدرجه في مواليد 1920 و1921 معًا وفي «سعودی سنی مسلم»."
  en: "Urdu Wikipedia stub on Fahd bin Abdulaziz Al Saud; used for entity facts only. It records him as Minister of Education before becoming Crown Prince in 1975, king in 1982 after King Khalid's death, an ally of the United States in the Gulf War who permitted American bases, and as having withdrawn from daily government after illness, leaving authority with Crown Prince Abdullah, before his death in 2005. Its categories file him under both 1920 and 1921 births and under 'Saudi Sunni Muslims'."
