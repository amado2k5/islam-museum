summary:
  ar: "مدخل «أوق» ⁦(السهم)⁩ في موسوعة TDV الإسلامية: السهم والقوس عبر الحضارات، حثّ النبي على الرمي وتعليقه على سعد بن أبي وقاص، صناعة القوس المركب والسهم عند العرب والترك والعثمانيين، ونظام الكمانكش العثماني: الإجازة ⁦(أخذ قبضة)⁩ وأرقام المنزل وأعمدة أوق ميداني والكوسنامه."
  en: "The TDV İslâm Ansiklopedisi entry on the arrow (ok): bow and arrow across civilisations, the Prophet's praise of shooting and Sa'd ibn Abi Waqqas, Arab and Turkish bow and arrow making, and the Ottoman kemankeş discipline — the ahz-ı kabza licence, the 900-gez menzil standard, the record pillars of the Okmeydanı, the archer esnaf of Istanbul and the kavsnâme literature."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre la flecha (ok): el arco y la flecha a través de las civilizaciones, el elogio del Profeta al tiro y Sa'd ibn Abi Waqqas, la fabricación de arcos y flechas árabes y turcos, y la disciplina otomana kemankeş: la licencia ahz-ı kabza, el estándar menzil de 900 gez, los pilares del récord del Okmeydanı, el esnaf del arquero de Estambul y la literatura kavsnâme."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur la flèche (ok): l'arc et la flèche à travers les civilisations, l'éloge du tir par le Prophète et Sa'd ibn Abi Waqqas, la fabrication arabe et turque d'arcs et de flèches, et la discipline ottomane du kemankeş — la licence ahz-ı kabza, la norme du menzil de 900 gez, les piliers de l'Okmeydanı, l'esnaf de l'archer d'Istanbul et la littérature du kavsnâme."
