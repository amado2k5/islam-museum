summary:
  ar: "مقالة ويكيبيديا الأردية عن المختار ولد داداه؛ بذرة قصيرة تُستخدم لوقائع الكيان فقط. تذكر أنه أول رئيس لموريتانيا من استقلالها عن فرنسا سنة 1960 حتى الانقلاب العسكري سنة 1978، وتصنّفه في «الاشتراكيين الإسلاميين». لا تذكر دينه أو مذهبه."
  en: "Urdu Wikipedia article on Moktar Ould Daddah; a short stub used for entity facts only. It states that he was Mauritania's first president, from independence from France in 1960 until the military coup of 1978, and files him under Islamic socialists. It says nothing about his religion or school."
  es: "Artículo de Wikipedia en urdu sobre Moktar Ould Daddah; un breve esbozo que solo incluye información sobre la persona. Indica que fue el primer presidente de Mauritania, desde la independencia de Francia en 1960 hasta el golpe militar de 1978, y lo clasifica dentro del socialismo islámico. No menciona su religión ni su escuela política."
  fr: "Article Wikipédia en ourdou sur Moktar Ould Daddah; une brève ébauche servant uniquement à fournir des informations factuelles. Il est indiqué qu'il fut le premier président de la Mauritanie, de l'indépendance de la France en 1960 jusqu'au coup d'État militaire de 1978, et le classe parmi les socialistes islamistes. L'article ne mentionne ni sa religion ni son école."
  ur: "مختار اولددادہ پر اردو ویکیپیڈیا مضمون؛ ایک مختصر سٹب صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ اس میں کہا گیا ہے کہ وہ موریطانیہ کے پہلے صدر تھے، 1960 میں فرانس سے آزادی سے لے کر 1978 کی فوجی بغاوت تک، اور انہیں اسلامی سوشلسٹوں کے تحت فائل کیا۔ یہ اس کے مذہب یا اسکول کے بارے میں کچھ نہیں کہتا۔"
  tr: "Mukhtar Ould Dada hakkında Urduca Wikipedia makalesi; sadece varlığın gerçekleri için kullanılan kısa bir taslak. 1960'ta Fransa'dan bağımsızlığından 1978'deki askeri darbeye kadar Moritanya'nın ilk cumhurbaşkanı olduğunu belirtirseniz, onu 'İslami Sosyalistler' arasında sınıflandırırsınız. Dini veya mezhebinden bahsetmeyin."
  id: "Artikel Wikipedia Urdu tentang Mukhtar Ould Dada; sebuah stub singkat yang hanya digunakan untuk fakta entitas. Sebutkan bahwa dia adalah presiden pertama Mauritania dari kemerdekaannya dari Prancis pada 1960 hingga kudeta militer pada 1978, dan Anda mengklasifikasikannya di antara 'Sosialis Islam.' Jangan sebutkan agama atau sektenya."
