reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026, and its content checked against the recorded revision. It agrees with the English article on his birth at Bamako on 10 August 1965 and his death in the same city on 19 July 2024 after a short illness, and adds: the family tradition in which he is the seventy-first generation of griots, and the ancestor Djelimakan Diabaté, djéli of a general of Soundiata Keita, said in the tradition to have received the original kora; his father Sidiki Diabaté (1922–1996), nicknamed 'king of the kora'; his start on the kora at the age of five; the Biennale du Mali at 13 with the Ensemble de Koulikoro, which won the prize for best traditional orchestra, and his joining the Ensemble instrumental national du Mali; and in its distinctions list the Grammy of 13 February 2011 for Ali and Toumani. Its discography dates Kaira to 1987, against both articles' text, which places the album in 1988; the record follows the text and notes the split. On the 'Tapha Niang' affair it says two verses of the Qur'an in the song's lyrics began a controversy and that Sony chose to use an instrumental version in the final game. The article states no religion for him."
