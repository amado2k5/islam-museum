summary:
  ar: "مدخل موسوعة بريتانيكا عن فيروز؛ يؤرخ ميلادها 20 نوفمبر 1934 مع ملاحظة باحث، ويصفها بأنها وُلدت لأبوين عربيين مسيحيين وأنها «مسيحية ⁦(أرثوذكسية يونانية)⁩»، وهو أحد مصدرين مستقلين يثبتان مسيحيتها في سجلّها."
  en: "Encyclopaedia Britannica entry on Fairuz; it dates her birth to 20 November 1934 with a researcher's note, and describes her as born of Arab Christian parents and 'Christian (Greek Orthodox)' — one of the two independent attestations of her Christianity in her record."
  es: "Entrada de la Enciclopedia Británica sobre Fairuz; fecha su nacimiento el 20 de noviembre de 1934 con una nota del investigador y la describe como nacida de padres cristianos árabes y \"cristiana (ortodoxa griega)\", una de las dos constancias independientes de su cristianismo en su expediente."
  fr: "L'article de l'Encyclopædia Britannica sur Fairuz date sa naissance du 20 novembre 1934 avec une note de chercheur et la décrit comme née de parents chrétiens arabes et « chrétienne (orthodoxe grecque) » — l'une des deux attestations indépendantes de son christianisme dans son dossier."
  ur: "فیروز پر انسائیکلوپیڈیا برٹانیکا کا اندراج؛ یہ ایک محقق کے نوٹ کے ساتھ اس کی پیدائش کی تاریخ 20 نومبر 1934 ہے، اور اسے عرب عیسائی والدین اور 'عیسائی ⁦(یونانی آرتھوڈوکس)⁩ کے طور پر پیدا ہوا ہے - اس کے ریکارڈ میں اس کی عیسائیت کی دو آزاد تصدیقوں میں سے ایک ہے۔"
  tr: "Encyclopaedia Britannica'daki Fayrouz hakkındaki kayd, doğumunu 20 Kasım 1934 olarak tarihlendirir ve bir araştırmacı notunda Arap Hristiyan ebeveynlerden doğduğu ve \"Hristiyan (Yunan Ortodoksluğu)\" olarak tanımlandığı belirtilir; bu, Hristiyanlığını doğrulayan iki bağımsız kaynaktan biridir."
  id: "Entri dalam Encyclopaedia Britannica tentang Fayrouz mencatat tanggal kelahirannya pada 20 November 1934, dengan catatan peneliti, yang menggambarkannya lahir dari orang tua Kristen Arab dan sebagai \"Kristen (Ortodoksi Yunani),\" yang merupakan salah satu dari dua sumber independen yang mengonfirmasi kekristenannya dalam catatannya."
