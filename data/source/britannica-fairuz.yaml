reliability_note: "Reference entry read in full on 25 October 2026. It gives her birth as 'November 20, 1934?' with a researcher's note on the uncertainty of the date, her birth in Beirut to Arab Christian parents, and her marriage to Assi Rahbani in 1954 (the English Wikipedia article and Wikidata give 1955; the variant is recorded in the prose). It states: 'Although Christian (Greek Orthodox) and Lebanese, her songs were adopted by all sides in the Civil War' — an independent attestation of her religion that, with the English Wikipedia article, grounds the documented christian segment in the person record."
