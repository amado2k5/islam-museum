summary:
  ar: "مدخل موسوعة بريتانيكا عن فيروز؛ يؤرخ ميلادها 20 نوفمبر 1934 مع ملاحظة باحث، ويصفها بأنها وُلدت لأبوين عربيين مسيحيين وأنها «مسيحية (أرثوذكسية يونانية)»، وهو أحد مصدرين مستقلين يثبتان مسيحيتها في سجلّها."
  en: "Encyclopaedia Britannica entry on Fairuz; it dates her birth to 20 November 1934 with a researcher's note, and describes her as born of Arab Christian parents and 'Christian (Greek Orthodox)' — one of the two independent attestations of her Christianity in her record."
