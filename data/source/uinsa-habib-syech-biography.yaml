  ar: "فصل سيرة في رسالة جامعية إندونيسية ⁦(جامعة سونان أمبيل الإسلامية الحكومية، سورابايا)⁩ يصرّح بأن الحبيب شيخ شافعي المذهب أشعري العقيدة متّبع لطريقة الإمام الغزالي الصوفية."
  en: "Biography chapter of an Indonesian university thesis (UIN Sunan Ampel, Surabaya) which states that Habib Syech is Shafi'i in school, Ash'ari in creed and a follower of Imam al-Ghazali's Sufi way."
  es: "Habib Syech es shafi'í en su formación académica, ash'ari en su credo y seguidor del camino sufí del Imam al-Ghazali."
  fr: "Habib Syech est un Shafi'i de formation scolaire, un Ash'arite de croyance et un adepte de la voie soufie de l'imam al-Ghazali."
  ur: "حبیب سیچ مکتب میں شافعی، مسلک میں اشعری اور امام غزالی کے صوفی طریقے کے پیروکار ہیں۔"
  tr: "Endonezya üniversite tezindeki biyografi bölümünde (Sunan Ampil Devlet İslam Üniversitesi, Surabaya) Şafii Aş'ari mezhebi olan Habib Şeyh'in İmam El-Gazali'nin Sufi yolunu takip ettiği belirtilmektedir."
  id: "Sebuah bab biografi dalam tesis universitas Indonesia (Universitas Islam Negeri Sunan Ampil, Surabaya) menyatakan bahwa Habib Sheikh, seorang ajaran Ash'ari Shafi'i, mengikuti jalan Sufi Imam Al-Ghazali."
