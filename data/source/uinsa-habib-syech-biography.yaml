reliability_note: "A single Indonesian undergraduate thesis chapter, read in this session. It records his birth at Solo on 20 September 1961, his father's imamate of the Assegaf mosque at Pasar Kliwon, his teachers (his father, his uncle Habib Ahmad bin Abdurrahman Assegaf and Habib Anis bin Alwi al-Habsyi), and states in terms: 'Habib Syekh bermadzhabkan Syafi'i, beraqidahkan Asy'ari, dan mengikuti sufi dari Al Imam Ghazali' — he is Shafi'i in school, Ash'ari in creed, and follows the Sufi way of Imam al-Ghazali. It is the only prose text found in this build that names a school and creed for him; one source cannot settle faith under this lane's two-source rule, so the statement is preserved in his record's faith note and not adopted."
