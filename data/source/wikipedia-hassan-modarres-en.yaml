summary:
  ar: "سيرة حسن مدرس (1870–1937) الذي يصفه مطلع المقال بأنه «رجل دين شيعي اثنا عشري إيراني»، ودراسته في أصفهان والنجف ومعارضته البرلمانية لرضا شاه وقتله في كاشمر."
  en: "Biography of Hassan Modarres (1870-1937), whose lead calls him 'an Iranian Twelver Shi'a cleric': his formation at Isfahan and Najaf, his Majlis opposition to Reza Shah and the 1919 agreement, and his killing at Kashmar."
  es: "Biografía de Hassan Modarres (1870-1937), a quien se describe en la introducción como \"un clérigo chiíta duodecimano iraní\": su formación en Isfahán y Nayaf, su oposición en el Majlis a Reza Shah y al acuerdo de 1919, y su asesinato en Cachemira."
  fr: "Biographie de Hassan Modarres (1870-1937), dont l'introduction le qualifie de « religieux chiite duodécimain iranien »: sa formation à Ispahan et Najaf, son opposition au Majlis contre Reza Shah et l'accord de 1919, et son assassinat à Kashmar."
