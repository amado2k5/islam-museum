summary:
  ar: "مقابلة هايب باي مع شهد بطل ضمن سلسلة «جميلات بالأحذية الرياضية»؛ تقدّمها يوتيوبر أمريكية من أصل سوداني مقيمة في لوس أنجلوس تمزج الأزياء المحتشمة بحب الأحذية الرياضية، وتقول إنها بدأت جمع الأحذية في سنتها الأخيرة من الثانوية سنة 2014، وتركت دروس الشعر لصالح الحجاب قبل نحو أربع سنوات من المقابلة."
  en: "Hypebae's 'Baes With Kicks' interview with Shahd Batal. It presents her as a Sudanese-American YouTuber and Los Angeles-based content creator who fuses modest fashion with a love of sneakers; she says she got into sneakers in her senior year of high school in 2014, and that she used to make hair tutorial videos but started wearing hijab about four years before the interview."
