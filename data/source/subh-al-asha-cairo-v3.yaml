summary:
  ar: "الجزء الثالث من «صبح الأعشى» لأبي العباس أحمد القلقشندي، طبع بالمطبعة الأميرية بالقاهرة سنة 1331هـ لدار الكتب الخديوية؛ فيه المقالة الأولى في ما يحتاج إليه الكاتب، ومنها الكلام على أصل الخط العربي وأقلامه وبيان الأقلام المستعملة في ديوان الإنشاء، وعلى النقط والشكل وعلى الهجاء ورسم المصحف."
  en: "Vol. 3 of Abu al-Abbas Ahmad al-Qalqashandi's Subh al-a'sha, printed at the Amiriyya press, Cairo, in 1331 AH for the Khedivial Dar al-Kutub; it carries the first maqala on what the secretary must know, including the origin of Arabic writing and its pens, the pens used in the chancery, the dotting and vowelling of letters, and spelling with the mushaf's orthography."
  ur: "ابو العباس احمد قلقشندی کی «صبح الاعشیٰ» کی تیسری جلد، المطبعۃ الامیریہ قاہرہ، 1331ھ، دار الکتب الخدیویہ کے لیے؛ اس میں پہلا مقالہ ہے جس میں عربی خط کی اصل اور اس کے اقلام، دیوانِ انشاء کے مستعمل اقلام، نقطے اور شکل اور مصحف کے رسم کے مطابق ہجاء کا بیان ہے۔"
