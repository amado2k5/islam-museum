  ar: "مقالة ويكيبيديا الإنجليزية عن طه حسين؛ تُستخدم لوقائع الكيان فقط. توثّق نشأته في المنيا وفقدانه البصر، ودراسته في الأزهر والجامعة المصرية وفرنسا، وكتاب «في الشعر الجاهلي» وما أثاره، ووزارته للمعارف سنة 1950، ووفاته سنة 1973."
