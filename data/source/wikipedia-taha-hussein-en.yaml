reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth at Izbet el Kilo in the Minya Governorate — the article's lead dates it 15 November 1889 while its infobox, citing a source, gives 14 November 1889 at Maghagha; the person record follows 14 November (with Britannica) and records the variant. Also covers his blindness at two from ophthalmia and an unskilled practitioner's malpractice, the kuttab and al-Azhar, the 1914 Cairo doctorate on Abu al-Ala' al-Ma'arri, the Montpellier and Sorbonne years and his second doctorate (1917) on Ibn Khaldun, his professorships and the founding rectorship of Alexandria University, On Pre-Islamic Poetry (1926), the accusations of insulting Islam and the prosecutor's decision that no legal action lay, the loss of his university post in 1931, The Future of Culture in Egypt (1938 in the works list), his ministry of education from 1950 with free education and the conversion of Qur'anic schools into primary schools, his more than sixty books and 1,300 articles, his twenty-one Nobel Prize nominations, and his death on 28 October 1973. Read in full on 24 October 2026."
