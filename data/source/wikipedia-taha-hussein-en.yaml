summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن طه حسين؛ تُستخدم لوقائع الكيان فقط. توثّق نشأته في المنيا وفقدانه البصر، ودراسته في الأزهر والجامعة المصرية وفرنسا، وكتاب «في الشعر الجاهلي» وما أثاره، ووزارته للمعارف سنة 1950، ووفاته سنة 1973."
  en: "English Wikipedia article on Taha Hussein; used for entity facts only. It records his Minya childhood and blindness, his studies at al-Azhar, Cairo University and in France, the On Pre-Islamic Poetry controversy, his 1950 appointment as Minister of Education, and his death in 1973."
  es: "Artículo de la Wikipedia en inglés sobre Taha Hussein; se utiliza únicamente para obtener información sobre su persona. En él se narra su infancia en Minya y su ceguera, sus estudios en Al-Azhar, la Universidad de El Cairo y en Francia, la controversia en torno a su obra Sobre la poesía preislámica, su nombramiento como Ministro de Educación en 1950 y su fallecimiento en 1973."
  fr: "Article de Wikipédia en anglais sur Taha Hussein; utilisé uniquement pour les informations sur l’entité. Il relate son enfance à Minya et sa cécité, ses études à al-Azhar, à l’université du Caire et en France, la controverse sur la poésie préislamique, sa nomination en 1950 comme ministre de l’Éducation et sa mort en 1973."
  ur: "طحہ حسین پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں منیا کا بچپن اور نابینا پن، الازہر، قاہرہ یونیورسٹی اور فرانس میں ان کی تعلیم، قبل از اسلام شاعری کا تنازعہ، 1950 میں وزیر تعلیم کے طور پر ان کی تقرری اور 1973 میں ان کی موت کو ریکارڈ کیا گیا ہے۔"
