  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرحمن اليوسفي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 8 مارس 1924 في طنجة ووفاته في 29 مايو 2020 في الدار البيضاء، ورئاسته لحكومة المغرب من 4 فبراير 1998 إلى 9 أكتوبر 2002 في عهدي الحسن الثاني ومحمد السادس، وقيادته للاتحاد الاشتراكي للقوات الشعبية."
  en: "English Wikipedia article on Abderrahmane Youssoufi; used for entity facts only. It gives his birth on 8 March 1924 at Tangier and his death on 29 May 2020 at Casablanca, his premiership of Morocco from 4 February 1998 to 9 October 2002 under Hassan II and Mohammed VI, and his leadership of the Socialist Union of Popular Forces."
