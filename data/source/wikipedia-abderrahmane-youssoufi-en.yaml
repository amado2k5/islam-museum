summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرحمن اليوسفي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 8 مارس 1924 في طنجة ووفاته في 29 مايو 2020 في الدار البيضاء، ورئاسته لحكومة المغرب من 4 فبراير 1998 إلى 9 أكتوبر 2002 في عهدي الحسن الثاني ومحمد السادس، وقيادته للاتحاد الاشتراكي للقوات الشعبية."
  en: "English Wikipedia article on Abderrahmane Youssoufi; used for entity facts only. It gives his birth on 8 March 1924 at Tangier and his death on 29 May 2020 at Casablanca, his premiership of Morocco from 4 February 1998 to 9 October 2002 under Hassan II and Mohammed VI, and his leadership of the Socialist Union of Popular Forces."
  es: "Artículo de la Wikipedia en inglés sobre Abderrahmane Youssoufi; utilizado únicamente para datos biográficos. Indica su nacimiento el 8 de marzo de 1924 en Tánger y su fallecimiento el 29 de mayo de 2020 en Casablanca, su mandato como primer ministro de Marruecos desde el 4 de febrero de 1998 hasta el 9 de octubre de 2002 bajo los gobiernos de Hassan II y Mohammed VI, y su liderazgo de la Unión Socialista de Fuerzas Populares."
  fr: "Article de Wikipédia en anglais sur Abderrahmane Youssoufi; utilisé uniquement pour les informations biographiques. Il indique sa naissance le 8 mars 1924 à Tanger et son décès le 29 mai 2020 à Casablanca, son mandat de Premier ministre du Maroc du 4 février 1998 au 9 octobre 2002 sous Hassan II et Mohammed VI, ainsi que sa direction de l’Union socialiste des forces populaires."
  ur: "عبدالرحمن یوسفی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 8 مارچ 1924 کو تانگیر میں ان کی پیدائش اور 29 مئی 2020 کو کاسابلانکا میں ان کی موت، حسن II اور محمد VI کے تحت 4 فروری 1998 سے 9 اکتوبر 2002 تک مراکش کی پریمیئر شپ، اور ان کی سوشلسٹ یونین آف پاپولر فورسز کی قیادت۔"
  tr: "Abderrahman Al-Yousfi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 8 Mart 1924'te Tanca'da doğdu ve 29 Mayıs 2020'de Kazablanka'da vefat etti; 4 Şubat 1998'den 9 Ekim 2002'ye kadar Hasan II ve Muhammed VI dönemlerinde Fas Başbakanı olarak görev yaptı ve Sosyalist Halk Güçleri Birliği'ne liderlik etti."
  id: "Artikel Wikipedia bahasa Inggris tentang Abderrahman Al-Yousfi; digunakan hanya untuk fakta entitas. Ia lahir pada 8 Maret 1924 di Tangier dan meninggal pada 29 Mei 2020 di Casablanca, serta menjabat sebagai Perdana Menteri Maroko dari 4 Februari 1998 hingga 9 Oktober 2002, selama masa pemerintahan Hassan II dan Mohammed VI, serta memimpin Persatuan Sosialis Kekuatan Populer."
