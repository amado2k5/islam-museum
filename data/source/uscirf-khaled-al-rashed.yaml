summary:
  ar: "قيد خالد الراشد في قاعدة بيانات ضحايا حرية الدين أو المعتقد لدى اللجنة الأمريكية للحرية الدينية الدولية؛ يذكر اسمه الكامل ودينه «مسلم – سنّي» وحاله «غير مُفرج عنه» وتدرّج حكمه من خمس سنوات إلى أربعين سنة."
  en: "The USCIRF Freedom of Religion or Belief Victims List entry for Khaled Al-Rashed, giving his full name, his religion or belief as 'Muslim – Sunni', his status as not released, and his sentence's escalation from five years to forty years."
  es: "La entrada correspondiente a Khaled Al-Rashed en la Lista de Víctimas de Violencia contra la Libertad de Religión o Creencia de la USCIRF (Comisión de Libertad de la India Internacional para la Investigación de la Corrupción) indica su nombre completo, su religión o creencia como \"musulmán sunita\", su condición de no haber sido puesto en libertad y el aumento de su condena de cinco a cuarenta años."
  fr: "L'entrée de Khaled Al-Rashed sur la liste des victimes de la liberté de religion ou de conviction de l'USCIRF indique son nom complet, sa religion ou conviction comme « musulman – sunnite », son statut de non libéré et l'aggravation de sa peine de cinq ans à quarante ans."
  ur: "یو ایس سی آئی آر ایف فریڈم آف ریلیجن یا بیلیف وکٹمز لسٹ میں خالد الرشید کے لیے اندراج، اس کا پورا نام، اس کا مذہب یا عقیدہ بطور 'مسلم-سنی'، اس کی حیثیت کو جاری نہیں کیا گیا، اور اس کی سزا کو پانچ سال سے بڑھا کر چالیس سال کر دیا گیا ہے۔"
  tr: "Halid El-Raşid, Amerikan Uluslararası Dini Özgürlük Komisyonu tarafından din veya inanç özgürlüğü mağdurları veri tabanında kayıtlıdır; tam adı, dini 'Müslüman – Sünni' ve durumu 'serbest bırakılmamıştır' olarak belirlenmiş olup, cezası beş yıldan kırk yıla kadar değişmektedir."
  id: "Khaled Al-Rashed terdaftar dalam basis data korban kebebasan beragama atau iman oleh Komisi Amerika untuk Kebebasan Beragama Internasional; nama lengkapnya, agama sebagai 'Muslim – Sunni,' dan kondisinya sebagai 'tidak dibebaskan,' dengan hukuman berkisar antara lima tahun hingga empat puluh tahun."
