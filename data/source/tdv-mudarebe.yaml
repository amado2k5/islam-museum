reliability_note: "Read on 1 November 2026 in the web edition, from the opening through the section on the formation of the contract (icap and kabul) and its validity conditions. Facts taken: the definition and the two names (mudaraba in Iraq, qiraz in the Hijaz), the terms for the parties, the grounds of validity, its use in Jahili and Islamic-era caravan and sea trade, the Geniza documents and the European commenda, and the rule that the capital owner bears the loss unless the worker is at fault. Not read: the later sections on the contract's rules, its termination and the modern finance sections, which are not used in this record. The printed range pp. 358–362 is the one the page prints."
