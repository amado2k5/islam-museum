label: { ar: "المضاربة — موسوعة TDV الإسلامية ⁦(جنكيز كالّك)⁩", en: "MUDÂREBE (profit-sharing partnership) — TDV İslâm Ansiklopedisi (Cengiz Kallek)" }
summary:
  ar: "مدخل «مضاربة» في موسوعة TDV الإسلامية التركية بقلم جنكيز كالّك ⁦(المجلد 30، أنقرة 2020، ص 358–362)⁩، ويشرح معنى المضاربة وتسمياتها في المذاهب، وأدلة مشروعيتها، وتاريخها في التجارة البرية والبحرية، ومنها أركان العقد وشروط صحته."
  en: "The TDV İslâm Ansiklopedisi entry 'Mudârebe' by Cengiz Kallek (vol. 30, Ankara 2020, pp. 358–362). It explains the contract's meaning and its names in the legal schools, the grounds for its validity, its use in caravan and sea trade, and its formation and conditions."
  es: "La entrada «Mudârebe» de Cengiz Kallek en la TDV İslâm Ansiklopedisi (vol. 30, Ankara 2020, pp. 358–362) explica el significado del contrato y sus nombres en las escuelas jurídicas, los fundamentos de su validez, su uso en el comercio de caravanas y marítimo, así como su formación y condiciones."
  fr: "L’article « Mudârebe » de Cengiz Kallek (vol. 30, Ankara 2020, p. 358-362) paru dans la TDV İslâm Ansiklopedisi explique la signification et les appellations de ce contrat dans les écoles juridiques, les conditions de sa validité, son utilisation dans le commerce caravanier et maritime, ainsi que sa formation et ses modalités."
  ur: "TDV İslâm Ansiklopedisi اندراج 'Mudârebe' از چنگیز کالیک ⁦(جلد 30، انقرہ 2020، صفحہ 358–362)⁩۔ یہ قانونی اسکولوں میں معاہدے کے معنی اور اس کے ناموں، اس کے جواز کی بنیاد، کارواں اور سمندری تجارت میں اس کے استعمال، اور اس کی تشکیل اور شرائط کی وضاحت کرتا ہے۔"
  tr: "Türk İslami TDV Ansiklopedisi'nde Cengiz Kalk'ın \"Spekülasyon\" başlıklı bir girişi (Cilt 30, Ankara 2020, ss. 358–362); spekülasyonun anlamını, okullardaki isimlerini, meşruiyetine dair kanıtları, kara ve deniz ticaretindeki tarihini, sözleşmenin temel taşlarını ve geçerlilik koşullarını açıklamaktadır."
  id: "Sebuah entri tentang \"Spekulasi\" dalam Ensiklopedia TDV Islam Turki oleh Cengiz Kalk (Vol. 30, Ankara 2020, hlm. 358–362), yang menjelaskan makna spekulasi, nama-namanya di sekolah-sekolah, bukti legitimasinya, sejarahnya dalam perdagangan darat dan maritim, termasuk pilar kontrak dan ketentuan keabsahannya."
