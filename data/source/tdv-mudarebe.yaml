summary:
  ar: "مدخل «مضاربة» في موسوعة TDV الإسلامية التركية بقلم جنكيز كالّك (المجلد 30، أنقرة 2020، ص 358–362)، ويشرح معنى المضاربة وتسمياتها في المذاهب، وأدلة مشروعيتها، وتاريخها في التجارة البرية والبحرية، ومنها أركان العقد وشروط صحته."
  en: "The TDV İslâm Ansiklopedisi entry 'Mudârebe' by Cengiz Kallek (vol. 30, Ankara 2020, pp. 358–362). It explains the contract's meaning and its names in the legal schools, the grounds for its validity, its use in caravan and sea trade, and its formation and conditions."
