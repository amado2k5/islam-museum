reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. Its lead and infobox give birth in 1883 at al-Shaykh Badr and death on 13 April 1950 at Tartus; its death-age template computes from 1884 and its categories file him under '1884 births' and 'Syrian Alawites' — the year conflict is disclosed in his record. On affiliation, its text gives community and background: 'a Syrian Alawite military commander', 'born in 1883 to a family of Alawite notables'; it nowhere calls him Shia, and its bibliography's inclusion of Moosa's Extremist Shiites: The Ghulat Sects is a work about the sects, not a statement of his own affiliation."
