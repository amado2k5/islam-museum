summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صالح العلي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه قائد عسكري سوري علوي، ولد لأعيان علويين في الشيخ بدر، وقاد ثورة الساحل 1919–1921 ضد الانتداب الفرنسي، ثم اعتزل حتى وفاته في طرطوس سنة 1950."
  en: "English Wikipedia article on Salih al-Ali; used for entity facts only. It describes him as a Syrian Alawite military commander, born to Alawite notables at al-Shaykh Badr, who led the revolt of 1919–1921 against the French Mandate and then abstained from politics until his death at Tartus in 1950."
  es: "Artículo de la Wikipedia en inglés sobre Salih al-Ali; utilizado únicamente para datos sobre la persona. Lo describe como un comandante militar alauita sirio, nacido en el seno de una familia alauita destacada en al-Shaykh Badr, que lideró la revuelta de 1919-1921 contra el Mandato francés y posteriormente se abstuvo de participar en política hasta su muerte en Tartus en 1950."
  fr: "Article de Wikipédia en anglais sur Salih al-Ali; utilisé uniquement pour les informations sur l’entité. Il le décrit comme un commandant militaire alaouite syrien, né de parents alaouites à al-Shaykh Badr, qui mena la révolte de 1919-1921 contre le mandat français, puis se retira de la vie politique jusqu’à sa mort à Tartous en 1950."
  ur: "صالح العلی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے ایک شامی علوی فوجی کمانڈر کے طور پر بیان کیا گیا ہے، جو الشیخ بدر میں علوی نامور لوگوں میں پیدا ہوا تھا، جس نے فرانسیسی مینڈیٹ کے خلاف 1919-1921 کی بغاوت کی قیادت کی اور پھر 1950 میں طرطوس میں اپنی موت تک سیاست سے کنارہ کشی اختیار کی۔"
  tr: "Salih el-Ali hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılır. Onu, Şeyh Badr'da Alevi seçkinlerin çocuğu olarak doğmuş, 1919–1921 yılları arasında Fransız Mandası'na karşı Sahel Devrimi'ni yöneten ve 1950'de Tartus'ta ölene kadar emekli olan bir Alevi Suriye askeri komutanı olarak tanımlar."
  id: "Artikel Wikipedia bahasa Inggris tentang Saleh al-Ali; hanya digunakan untuk fakta entitas. Ia menggambarkannya sebagai komandan militer Alawite Suriah, lahir dari tokoh-tokoh Alawite di Sheikh Badr, memimpin Revolusi Sahel 1919–1921 melawan Mandat Prancis, lalu pensiun hingga wafat di Tartus pada tahun 1950."
