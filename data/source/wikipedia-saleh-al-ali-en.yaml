  ar: "مقالة ويكيبيديا الإنجليزية عن صالح العلي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه قائد عسكري سوري علوي، ولد لأعيان علويين في الشيخ بدر، وقاد ثورة الساحل 1919–1921 ضد الانتداب الفرنسي، ثم اعتزل حتى وفاته في طرطوس سنة 1950."
  en: "English Wikipedia article on Salih al-Ali; used for entity facts only. It describes him as a Syrian Alawite military commander, born to Alawite notables at al-Shaykh Badr, who led the revolt of 1919–1921 against the French Mandate and then abstained from politics until his death at Tartus in 1950."
