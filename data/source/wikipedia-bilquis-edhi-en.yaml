reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives her full name as Bilquis Bano Edhi, born 14 August 1947 at Bantva, British India (infobox and biography agree), and died 15 April 2022 at the Aga Khan Hospital, Karachi, of congestive heart failure; her funeral prayers were offered at New Memon Masjid and she was buried at Mewa Shah Graveyard, Karachi, on 16 April 2022; she married Abdul Sattar Edhi in 1965, joined his Mithadar dispensary as a nurse that year, led its nursing department and the jhoola baby-cradle project (over 300 cradles), and co-chaired the Edhi Foundation; Ramon Magsaysay Award 1986 and Hilal-i-Imtiaz. On religion it states only that she was born 'to Muslims' in Bantva and was 'unusually, from a Muslim background' among the dispensary's nurses — family background — and that she was named in The Muslim 500 for 2022, a listing. No school is named anywhere."
