summary:
  ar: "خبر موقع القاهرة 24 عن إحالة النائب العام بلاغا ضد مصطفى العدوي إلى نيابة أمن الدولة العليا في يونيو 2025، على خلفية مقطع مصور وجّه فيه كلاما إلى الرئيس الأمريكي."
  en: "Cairo 24's report that in June 2025 the Attorney General referred a complaint against Mostafa al-Adawi to the Supreme State Security Prosecution, over a video addressing the US president."
  es: "Según informa Cairo 24, en junio de 2025 el Fiscal General remitió una denuncia contra Mostafa al-Adawi a la Fiscalía Suprema de Seguridad del Estado, por un vídeo en el que se dirigía al presidente de Estados Unidos."
  fr: "Selon un article de Cairo 24 paru en juin 2025, le procureur général a transmis une plainte contre Mostafa al-Adawi au parquet suprême de la sûreté de l'État, concernant une vidéo adressée au président américain."
  ur: "قاہرہ 24 کی رپورٹ کے مطابق جون 2025 میں اٹارنی جنرل نے مصطفیٰ العدوی کے خلاف امریکی صدر سے خطاب کرنے والی ایک ویڈیو پر سپریم اسٹیٹ سیکیورٹی پراسیکیوشن کو شکایت بھیجی۔"
  tr: "Cairo 24 web sitesi, Başsavcı'nın Mustafa Al-Adawi'ye karşı Haziran 2025'te bir şikayeti Yüksek Devlet Güvenliği Savcılığı'na sevk ettiğini, bunun ardından Amerikan başkanına hitap ettiği bir video klibin ardından bildirdiğini bildirdi."
  id: "Situs web Cairo 24 melaporkan bahwa Jaksa Agung merujuk pengaduan terhadap Mostafa Al-Adawi ke Jaksa Keamanan Negara Tertinggi pada Juni 2025, setelah klip video di mana ia berbicara kepada presiden Amerika."
