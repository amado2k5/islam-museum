summary:
  ar: "مقالة ويكيبيديا العربية عن مختار أحمد الأنصاري؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في 25 كانون الأول 1880 في محمد آباد ووفاته بنوبة قلبية في دلهي في 10 أيار 1936 ودفنه في الجامعة الملية الإسلامية، ورئاسته المؤتمر الوطني الهندي والرابطة الإسلامية، وأصول أسرته الراجعة إلى الصوفي الهراتي عبد الله الأنصاري."
  en: "Arabic Wikipedia article on Mukhtar Ahmed Ansari; used for entity facts only. It gives his birth on 25 December 1880 at Mohammadabad and his death by heart attack at Delhi on 10 May 1936 and burial at Jamia Millia Islamia, recounts his Congress and Muslim League presidencies, and traces his family to the Herat Sufi Abdullah Ansari."
  es: "Artículo en árabe de la Wikipedia sobre Mukhtar Ahmed Ansari; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 25 de diciembre de 1880 en Mohammadabad y su fallecimiento por infarto en Delhi el 10 de mayo de 1936, siendo enterrado en Jamia Millia Islamia. Relata sus presidencias del Congreso y la Liga Musulmana, y remonta su linaje al sufí Abdullah Ansari de Herat."
  fr: "Article de Wikipédia en arabe sur Mukhtar Ahmed Ansari; utilisé uniquement à des fins d’information sur l’entité. Il indique sa naissance le 25 décembre 1880 à Mohammadabad et sa mort par crise cardiaque à Delhi le 10 mai 1936, ainsi que son inhumation à Jamia Millia Islamia. Il relate ses présidences du Congrès et de la Ligue musulmane et retrace ses origines familiales jusqu’au soufi d’Hérat, Abdullah Ansari."
  ur: "مختار احمد انصاری پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 25 دسمبر 1880 کو محمد آباد میں ان کی پیدائش اور 10 مئی 1936 کو دہلی میں دل کا دورہ پڑنے سے ان کی موت اور جامعہ ملیہ اسلامیہ میں ان کی تدفین، ان کی کانگریس اور مسلم لیگ کی صدارتوں کا ذکر کرتا ہے، اور ہرات کے صوفی عبداللہ انصاری سے ان کے خاندان کا پتہ لگاتا ہے۔"
  tr: "Mukhtar Ahmad Al-Ansari hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 25 Aralık 1880'de Muhammadabad'da doğmasını, 10 Mayıs 1936'da Delhi'de kalp krizi sonucu hayatını kaybetmesini, Millia İslam Üniversitesi'ne defnedilmesini, Hindistan Ulusal Kongresi ve Müslüman Birliği başkanlığını ve ailesinin kökenlerini Herati Sufi Abdullah Al-Ansari'ye kadar uzanmasını anlatır."
  id: "Artikel Wikipedia berbahasa Arab tentang Mukhtar Ahmad Al-Ansari; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 25 Desember 1880 di Muhammadabad, kematiannya akibat serangan jantung di Delhi pada 10 Mei 1936, pemakamannya di Millia Islamic University, masa jabatannya sebagai presiden Indian National Congress dan Muslim League, serta asal-usul keluarganya yang ditelusuri kembali ke Herati Sufi Abdullah Al-Ansari."
