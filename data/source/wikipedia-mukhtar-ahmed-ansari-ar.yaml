  ar: "مقالة ويكيبيديا العربية عن مختار أحمد الأنصاري؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في 25 كانون الأول 1880 في محمد آباد ووفاته بنوبة قلبية في دلهي في 10 أيار 1936 ودفنه في الجامعة الملية الإسلامية، ورئاسته المؤتمر الوطني الهندي والرابطة الإسلامية، وأصول أسرته الراجعة إلى الصوفي الهراتي عبد الله الأنصاري."
  en: "Arabic Wikipedia article on Mukhtar Ahmed Ansari; used for entity facts only. It gives his birth on 25 December 1880 at Mohammadabad and his death by heart attack at Delhi on 10 May 1936 and burial at Jamia Millia Islamia, recounts his Congress and Muslim League presidencies, and traces his family to the Herat Sufi Abdullah Ansari."
