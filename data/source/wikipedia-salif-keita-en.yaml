reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives his birth on 25 August 1949 at Djoliba, to the Keita royal family tracing descent from Sundiata Keita; his casting-out over his albinism, a sign of bad luck in Mandinka culture; the sentence 'Raised in a Muslim family, he went to an Islamic school where he was influenced by his Qur'an teacher's singing' — family background and schooling, expressly NOT used as an attestation of a personal school; his move to Bamako in 1967 and the Super Rail Band; Les Ambassadeurs (1973) and the flight to Abidjan in the mid-1970s; Mandjou (1978) and the 1976 award of Officer of Guinea's National Order of Merit by Sékou Touré; the move to Paris in 1984; Soro (1987) as the international breakthrough; the Nelson Mandela 70th Birthday Tribute concert (1988); the return to Bamako and studio; Moffou (2002); M'Bemba (2005); La Différence (2009), dedicated to the albino community, and its Best World Music award at the 2010 Victoires de la Musique; and his daughter, the paralympian Nantenin Keita. It also notes the criticism of some of his work for glossy production. No school is named for Keita himself."
