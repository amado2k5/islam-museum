summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بكير جوبان زاده؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 27 مايو 1893 في قره صوبازار بالقرم (محولا من 15 مايو بالتقويم اليولياني) ووفاته في 13 أكتوبر 1937 في باكو، وتعليمه في القرم وإسطنبول وبودابست حيث نال الدكتوراه سنة 1919، وكرسييه في سيمفيروبول وباكو ونحو 150 عملا علميا؛ ولا يرد فيها أي محتوى ديني سوى تصنيف «مسلمون من الإمبراطورية الروسية»."
  en: "English Wikipedia article on Bekir Çoban-zade (at the title 'Bekir Choban-zade'); used for entity facts only. It gives his birth on 27 May 1893 at Qarasuvbazar, Crimea (converted from 15 May, Julian), and his death on 13 October 1937 at Baku, his education in Crimea, Istanbul and Budapest (PhD 1919), his chairs at Simferopol and Baku and some 150 scholarly works; it carries no religion content beyond the category 'Muslims from the Russian Empire'."
