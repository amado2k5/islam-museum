summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بكير جوبان زاده؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 27 مايو 1893 في قره صوبازار بالقرم ⁦(محولا من 15 مايو بالتقويم اليولياني)⁩ ووفاته في 13 أكتوبر 1937 في باكو، وتعليمه في القرم وإسطنبول وبودابست حيث نال الدكتوراه سنة 1919، وكرسييه في سيمفيروبول وباكو ونحو 150 عملا علميا؛ ولا يرد فيها أي محتوى ديني سوى تصنيف «مسلمون من الإمبراطورية الروسية»."
  en: "English Wikipedia article on Bekir Çoban-zade (at the title 'Bekir Choban-zade'); used for entity facts only. It gives his birth on 27 May 1893 at Qarasuvbazar, Crimea (converted from 15 May, Julian), and his death on 13 October 1937 at Baku, his education in Crimea, Istanbul and Budapest (PhD 1919), his chairs at Simferopol and Baku and some 150 scholarly works; it carries no religion content beyond the category 'Muslims from the Russian Empire'."
  es: "Artículo de la Wikipedia en inglés sobre Bekir Çoban-zade (con el título 'Bekir Choban-zade'); utilizado únicamente para datos sobre la persona. Indica su nacimiento el 27 de mayo de 1893 en Qarasuvbazar, Crimea (convertido del 15 de mayo, juliano), y su muerte el 13 de octubre de 1937 en Bakú, su formación académica en Crimea, Estambul y Budapest (doctorado en 1919), sus cátedras en Simferopol y Bakú y unas 150 obras académicas; no contiene información religiosa más allá de la categoría 'Musulmanes del Imperio ruso'."
  fr: "L'article de Wikipédia en anglais consacré à Bekir Çoban-zade (intitulé « Bekir Choban-zade ») est utilisé uniquement à des fins d'information biographique. Il indique sa naissance le 27 mai 1893 à Qarasuvbazar, en Crimée (date convertie du 15 mai, selon le calendrier julien), et son décès le 13 octobre 1937 à Bakou. On y trouve également des informations sur ses études en Crimée, à Istanbul et à Budapest (doctorat obtenu en 1919), ses postes de professeur à Simferopol et à Bakou, ainsi que quelque 150 publications scientifiques. L'article ne contient aucune information religieuse, hormis la catégorie « Musulmans de l'Empire russe »."
  ur: "Bekir Çoban-zade پر انگریزی ویکیپیڈیا مضمون ⁦(عنوان 'Bekir Choban-zade')⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 27 مئی 1893 کو قراسو بازار، کریمیا ⁦(15 مئی، جولین سے تبدیل ہوا)⁩ میں ان کی پیدائش اور 13 اکتوبر 1937 کو باکو میں ان کی موت، کریمیا، استنبول اور بوڈاپیسٹ میں اس کی تعلیم ⁦(پی ایچ ڈی 1919)⁩، سمفروپول اور باکو میں اس کی کرسیاں اور کچھ علمی کام؛ اس میں 'روسی سلطنت کے مسلمان' کے زمرے سے باہر کوئی مذہب مواد نہیں ہے۔"
  tr: "Bakir Joban Zadeh hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 27 Mayıs 1893'te Kırım'daki Kara Subazar'da (Jülyen takviminden 15 Mayıs'tan değiştirildi) ve 13 Ekim 1937'de Bakü'de vefatını, Kırım, İstanbul ve Budapeşte'de doktorasını aldığı 1919'da aldığı eğitimini, Simferopol ve Bakü'deki kürsülerini ve yaklaşık 150 bilimsel eserini listeler; \"Rus İmparatorluğu'ndan Müslümanlar\" sınıflandırması dışında dini içerik içermez."
  id: "Artikel Wikipedia bahasa Inggris tentang Bakir Joban Zadeh; digunakan hanya untuk fakta entitas tersebut. Artikel ini mencantumkan kelahirannya pada 27 Mei 1893 di Kara Subazar di Krimea (diubah dari 15 Mei dalam kalender Julian) dan kematiannya pada 13 Oktober 1937 di Baku, pendidikannya di Krimea, Istanbul, dan Budapest di mana ia meraih gelar doktor pada tahun 1919, kursinya di Simferopol dan Baku, serta sekitar 150 karya ilmiah; tidak memuat konten keagamaan kecuali klasifikasi \"Muslim dari Kekaisaran Rusia.\""
