summary:
  ar: "مقالة ويكيبيديا الإنجليزية «باقر خان»؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في تبريز نحو 1870 ابنًا لحاج رضا البنّاء، وبنّاءً صار زعيم لوطيي الطرف الشرقي من المدينة، ودوره في الثورة الدستورية، ونفيه الفعلي إلى طهران سنة 1910، وانضمامه إلى لجنة الدفاع الوطني سنة 1915، وقتله في نوفمبر 1916 قرب قصر شيرين بيد محمد أمين الطالباني."
  en: "English Wikipedia article 'Baqir Khan'; used for entity facts only. It gives his birth at Tabriz about 1870, son of Haj Reza Bana, a bricklayer who became the luti leader of the city's east end, his role in the Constitutional Revolution, his effective exile to Tehran in 1910, his joining the Committee for National Defence in 1915, and his murder in November 1916 near Qasr-e Shirin by Mohammad Amin Talebani."
