summary:
  ar: "مدخل «شاه» بلقب الحاكم في موسوعة TDV الإسلامية: أصل اللفظ الفارسي، الشاهنشاه في الأخمينيين والساسانيين، دخوله الإسلام عبر البويهيين والسلاجقة، ثم الصفويين والقاجاريين واستعماله في التركية والهند."
  en: "The TDV İslâm Ansiklopedisi entry ŞAH as a ruler's title: the Persian word's history, the shahanshah of the Achaemenids and Sasanians, the title's entry into Islam through the Buyids and Seljuks, then the Safavids and Qajars, and its use in Turkish and Indian names."
  ur: "TDV اسلامی انسائیکلوپیڈیا کی مادہ «شاہ» بطور حکمرانی لقب: فارسی لفظ کی تاریخ، ہخامنشی و ساسانی شہنشاہ، بوئی اور سلجوقی دور میں اسلامی دنیا میں داخلہ، پھر صفوی و قاجار دور، اور ترک و ہندوستانی ناموں میں استعمال۔"
  es: "La entrada ŞAH como título de gobernante en el TDV İslâm Ansiklopedisi: la historia de la palabra persa, el shahanshah de los aqueménidas y sasánidas, la entrada del título en el Islam a través de los buyíes y selyúcidas, luego los safávidas y qajar, y su uso en nombres turcos e indios."
  fr: "L'entrée ŞAH de l'encyclopédie TDV İslâm Ansiklopedisi en tant que titre de souverain: l'histoire du mot persan, le shahanshah des Achéménides et des Sassanides, l'entrée du titre dans l'Islam à travers les Bouyides et les Seldjoukides, puis les Safavides et les Qajars, et son utilisation dans les noms turcs et indiens."
  tr: "İslami TDV Ansiklopedisi'nde 'Şah' sözünün 'El-Hakim' başlığıyla kaydı: Farsça Şahanşah teriminin Ahamenişler ve Sasanilerdeki kökeni, Büyküler ve Selçuklular aracılığıyla İslam'a girişi, ardından Safeviler ve Kacarlar aracılığıyla ve Türkiye ile Hindistan'da kullanımı."
  id: "Entri 'Shah' dengan judul 'Al-Hakim' dalam Ensiklopedia Islam TDV: Asal-usul istilah Persia, Shahanshah dalam Achaemenid dan Sasanian, pengenalan ke Islam melalui Buyid dan Seljuk, kemudian Safavid dan Qajar, serta penggunaannya di Turki dan India."
