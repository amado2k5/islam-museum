summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مبارك الصباح «الكبير» الملقب بأسد الجزيرة ⁦(نحو 1837 – 28 نوفمبر 1915)⁩، حاكم الكويت السابع من 1896 إلى وفاته؛ تروي خدمته العسكرية في حملات عثمانية وقتله أخويه غير الشقيقين محمد وجراح سنة 1896 وكفاحه لنيل الاعتراف العثماني واتفاقه مع بريطانيا سنة 1899 وهزيمته في الصريف سنة 1901 واتفاق الوضع الراهن والحرب العالمية الأولى ووفاته بالملاريا مضاعفة بضعف القلب، وتنقل خلاف الباحثين حول الاغتيال نفسه."
  en: "English Wikipedia article on Mubarak Al-Sabah 'the Great', nicknamed the Lion of the Peninsula (c. 1837 – 28 November 1915), seventh ruler of Kuwait from 1896 until his death; it recounts his military service in Ottoman campaigns, his killing of his half-brothers Muhammad and Jarrah in 1896, his struggle for Ottoman recognition, the 1899 agreement with Britain, his defeat at Sarif in 1901, the Status Quo Agreement, the First World War, and his death of malaria aggravated by a bad heart, and it reports scholarly disagreement (Slot) over the assassination itself."
  es: "Artículo de la Wikipedia en inglés sobre Mubarak Al-Sabah 'el Grande', apodado el León de la Península (c. 1837 – 28 de noviembre de 1915), séptimo gobernante de Kuwait desde 1896 hasta su muerte; relata su servicio militar en las campañas otomanas, el asesinato de sus hermanastros Muhammad y Jarrah en 1896, su lucha por el reconocimiento otomano, el acuerdo de 1899 con Gran Bretaña, su derrota en Sarif en 1901, el Acuerdo del Status Quo, la Primera Guerra Mundial y su muerte por malaria agravada por una mala condición cardíaca, e informa sobre el desacuerdo académico (Slot) acerca del asesinato en sí."
  fr: "L'article de Wikipédia en anglais sur Moubarak Al-Sabah « le Grand », surnommé le Lion de la Péninsule (vers 1837 – 28 novembre 1915), septième souverain du Koweït de 1896 jusqu'à sa mort, relate son service militaire dans les campagnes ottomanes, l'assassinat de ses demi-frères Muhammad et Jarrah en 1896, sa lutte pour la reconnaissance ottomane, l'accord de 1899 avec la Grande-Bretagne, sa défaite à Sarif en 1901, l'accord du statu quo, la Première Guerre mondiale et sa mort des suites du paludisme aggravé par une maladie cardiaque. Il fait également état de désaccords entre les spécialistes (Slot) concernant l'assassinat lui-même."
  ur: "مبارک الصباح 'عظیم' پر انگریزی ویکیپیڈیا کا مضمون، جسے جزیرہ نما شیر کا عرفی نام دیا گیا ⁦(c. 1837 - 28 نومبر 1915)⁩، 1896 سے اپنی موت تک کویت کے ساتویں حکمران؛ اس میں عثمانی مہمات میں ان کی فوجی خدمات، 1896 میں اپنے سوتیلے بھائیوں محمد اور جراح کے قتل، عثمانی تسلیم کے لیے ان کی جدوجہد، برطانیہ کے ساتھ 1899 کا معاہدہ، 1901 میں صراف میں اس کی شکست، اسٹیٹس کو کا معاہدہ، پہلی جنگ عظیم، اور ملیریا کی وجہ سے اس کی موت کا ذکر کیا گیا ہے ⁦(اس پر اسکالر کی طرف سے بری طرح سے اختلاف کیا گیا)⁩ قتل خود."
