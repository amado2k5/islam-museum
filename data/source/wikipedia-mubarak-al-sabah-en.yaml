reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full at revision 1379135338 on 25 October 2026. The article is internally inconsistent: its lead dates the reign 'from 18 May 1896 until his death on 18 November 1915', while its own lead parenthesis, its death section and the Arabic article give the death on 28 November 1915 and its body dates the killing of his half-brothers to 8 May 1896; the record follows 28 November 1915 and states the lead's readings. Its birth year, 'c. 1837', conflicts with the Arabic article's 1844 and with Wikidata's two values (1838 and 1844) — stated in the record, not merged. It states no religion for him."
