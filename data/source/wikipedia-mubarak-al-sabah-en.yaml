summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مبارك الصباح «الكبير» الملقب بأسد الجزيرة (نحو 1837 – 28 نوفمبر 1915)، حاكم الكويت السابع من 1896 إلى وفاته؛ تروي خدمته العسكرية في حملات عثمانية وقتله أخويه غير الشقيقين محمد وجراح سنة 1896 وكفاحه لنيل الاعتراف العثماني واتفاقه مع بريطانيا سنة 1899 وهزيمته في الصريف سنة 1901 واتفاق الوضع الراهن والحرب العالمية الأولى ووفاته بالملاريا مضاعفة بضعف القلب، وتنقل خلاف الباحثين حول الاغتيال نفسه."
  en: "English Wikipedia article on Mubarak Al-Sabah 'the Great', nicknamed the Lion of the Peninsula (c. 1837 – 28 November 1915), seventh ruler of Kuwait from 1896 until his death; it recounts his military service in Ottoman campaigns, his killing of his half-brothers Muhammad and Jarrah in 1896, his struggle for Ottoman recognition, the 1899 agreement with Britain, his defeat at Sarif in 1901, the Status Quo Agreement, the First World War, and his death of malaria aggravated by a bad heart, and it reports scholarly disagreement (Slot) over the assassination itself."
