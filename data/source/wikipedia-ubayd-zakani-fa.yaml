reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision, resting on Hamdallah Mustawfi, Dawlatshah Samarqandi and Abbas Iqbal's introduction to the Kolliyat. It gives his birth in Qazvin county in the late 7th or early 8th century AH (no year), reports the tazkira writers placing his death between 768 and 772 AH (Taqi Kashi: 772; Sadiq Isfahani: 771), and states that he died in Isfahan or Baghdad with his burial place unknown — a place account that conflicts with the English biography's and Wikidata's Shiraz, and is preserved as a conflict in the record."
