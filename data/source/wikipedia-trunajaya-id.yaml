reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It spells him Trunajaya (also Trunojoyo), gives his birth as about 1649, calls his uncle the Sampang prince Cakraningrat II, records that his father was killed on Amangkurat I's orders in 1656, that he left Plered for Kajoran and married Panembahan Rama's eldest daughter, that Rama introduced him to the crown prince in 1670, and that Amangkurat II stabbed him with a keris at Payak on 2 January 1680. It says he proclaimed himself Panembahan Maduretna Panatagama. It names no school or order for the man himself. Checked 1 November 2026."
