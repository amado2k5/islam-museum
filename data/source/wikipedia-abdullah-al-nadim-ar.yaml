summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الله النديم؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل ونسبه وتقرن حياته بعامي 1261-1314 هـ، وتذكر تأسيسه الجمعية الخيرية الإسلامية وصحفه ونفيه ووفاته بالآستانة سنة 1896."
  en: "Arabic Wikipedia article on Abdullah al-Nadim; used for entity facts only. It gives his full name and lineage, pairs his life with 1261-1314 AH, and records his founding of the Islamic Charitable Society, his newspapers, his exiles and his death at Istanbul in 1896."
  es: "Artículo en árabe de la Wikipedia sobre Abdullah al-Nadim; se utiliza únicamente para obtener información sobre su persona. Proporciona su nombre completo y linaje, sitúa su vida entre 1261 y 1314 AH, y registra la fundación de la Sociedad Benéfica Islámica, sus periódicos, sus exilios y su muerte en Estambul en 1896."
  fr: "Article de Wikipédia en arabe sur Abdullah al-Nadim; utilisé uniquement à des fins d’information sur l’entité. Il donne son nom complet et sa lignée, situe sa vie entre 1261 et 1314 de l’Hégire, et relate la fondation de la Société islamique de bienfaisance, ses journaux, ses exils et sa mort à Istanbul en 1896."
  ur: "عبداللہ النادیم پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کا پورا نام اور نسب بتاتا ہے، اس کی زندگی کو 1261-1314 ہجری کے ساتھ جوڑتا ہے، اور اس کی اسلامک چیریٹیبل سوسائٹی کی بنیاد، اس کے اخبارات، اس کی جلاوطنی اور 1896 میں استنبول میں اس کی موت کو ریکارڈ کرتا ہے۔"
