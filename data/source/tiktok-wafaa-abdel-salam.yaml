summary:
  ar: "حساب الدكتورة وفاء عبد السلام على تيك توك (@drwafaaofficial) باسم «drwafaaabdelsalam»، تنشر فيه مقاطع دعوية قصيرة؛ ومن مقاطعها مقطع بعنوان «ليه ربنا بيرزق ناس بتعصيه؟ مع إننا بنكون ملتزمين...!!» بلغت إعجاباته نحو 27.9 ألف عند قراءة بياناته في مايو 2026."
  en: "Dr Wafaa Abdel Salam's TikTok account (@drwafaaofficial), under the name 'drwafaaabdelsalam', on which she publishes short dawah clips; among them a clip titled 'Why does God provide for people who disobey Him, while we are observant...?!' whose likes stood at about 27.9 thousand when its metadata was read in May 2026."
  es: "La cuenta de TikTok de la Dra. Wafaa Abdel Salam (@drwafaaofficial), bajo el nombre 'drwafaaabdelsalam', en la que publica breves vídeos de dawah; entre ellos un vídeo titulado '¿Por qué Dios provee para las personas que le desobedecen, mientras que nosotros somos observantes...?!', cuyos me gusta rondaban los 27.900 cuando se leyeron sus metadatos en mayo de 2026."
  fr: "Le compte TikTok de Dr Wafaa Abdel Salam (@drwafaaofficial), sous le nom 'drwafaaabdelsalam', sur lequel elle publie de courts clips de dawah; parmi eux un clip intitulé 'Pourquoi Dieu pourvoit-il aux besoins des gens qui lui désobéissent, alors que nous sommes observants...?!' dont les likes s'élevaient à environ 27,9 mille lorsque ses métadonnées ont été lues en mai 2026."
