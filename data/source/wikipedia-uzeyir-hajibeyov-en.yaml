summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عزير حاجبايوف؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في أغجابدي قرب شوشة، وعمل والده سكرتيرًا عند الشاعرة خورشيد بانو ناتافان، وأوبراه «ليلى ومجنون» (1908) أول أوبرا في العالم الإسلامي، ونشيد أذربيجان الوطني، وتأسيسه معهد باكو للموسيقى، ووفاته في باكو سنة 1948. تعطي ميلاده في 18 سبتمبر 1885."
  en: "English Wikipedia article on Uzeyir Hajibeyov; used for entity facts only. It recounts his birth at Aghjabadi near Shusha, his father's service as secretary to the poet Khurshidbanu Natavan, his Leyli and Majnun (1908) as the first opera in the Islamic world, his music for Azerbaijan's national anthem, his founding of the Baku conservatoire, and his death at Baku in 1948. It gives his birth as 18 September 1885."
