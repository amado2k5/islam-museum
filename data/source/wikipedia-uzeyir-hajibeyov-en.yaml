summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عزير حاجبايوف؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في أغجابدي قرب شوشة، وعمل والده سكرتيرًا عند الشاعرة خورشيد بانو ناتافان، وأوبراه «ليلى ومجنون» (1908) أول أوبرا في العالم الإسلامي، ونشيد أذربيجان الوطني، وتأسيسه معهد باكو للموسيقى، ووفاته في باكو سنة 1948. تعطي ميلاده في 18 سبتمبر 1885."
  en: "English Wikipedia article on Uzeyir Hajibeyov; used for entity facts only. It recounts his birth at Aghjabadi near Shusha, his father's service as secretary to the poet Khurshidbanu Natavan, his Leyli and Majnun (1908) as the first opera in the Islamic world, his music for Azerbaijan's national anthem, his founding of the Baku conservatoire, and his death at Baku in 1948. It gives his birth as 18 September 1885."
  es: "Artículo de la Wikipedia en inglés sobre Uzeyir Hajibeyov; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Aghjabadi, cerca de Shusha, el servicio de su padre como secretario del poeta Khurshidbanu Natavan, su ópera Leyli y Majnun (1908), la primera ópera del mundo islámico, su música para el himno nacional de Azerbaiyán, la fundación del conservatorio de Bakú y su muerte en Bakú en 1948. Indica que nació el 18 de septiembre de 1885."
  fr: "Article de Wikipédia en anglais sur Uzeyir Hajibeyov; utilisé uniquement pour les informations le concernant. Il relate sa naissance à Aghjabadi, près de Choucha, le travail de son père comme secrétaire de la poétesse Khurshidbanu Natavan, son opéra Leyli et Majnun (1908), considéré comme le premier opéra du monde islamique, sa musique pour l'hymne national de l'Azerbaïdjan, la fondation du conservatoire de Bakou et sa mort à Bakou en 1948. Sa date de naissance est indiquée comme étant le 18 septembre 1885."
  ur: "عزیر حاجی بیوف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں شوشا کے قریب آغاآبادی میں ان کی پیدائش، شاعر خورشید بانو نتاوان کے سیکرٹری کے طور پر ان کے والد کی خدمات، اسلامی دنیا کے پہلے اوپیرا کے طور پر ان کی لیلی اور مجنون (1908)، آذربائیجان کے قومی ترانے کے لیے ان کی موسیقی، باکو کنزرویٹوائر کی بانی، اور باکو میں ان کی وفات 1818 418 میں ان کی پیدائش کا ذکر ہے۔"
  tr: "Azir Hacbayev hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Şuşa yakınlarındaki Agjabdi'de yetiştirilme dönemini, babasının şair Hurşid Bano Natavan'ın sekreterliğini, 1908'de yazdığı \"Leyla ve Mejnun\" operasını, İslam dünyasının ilk operasını, Azerbaycan'ın milli marşını, Bakü Müzik Enstitüsü'nün kuruluşunu ve 1948'de Bakü'de vefatını anlatır. 18 Eylül 1885'te doğdu."
  id: "Artikel Wikipedia bahasa Inggris tentang Azir Hajbayev; hanya digunakan untuk fakta-fakta entitas. Artikel ini menceritakan masa kecilnya di Agjabdi dekat Shusha, pekerjaan ayahnya sebagai sekretaris penyair Khurshid Bano Natavan, opera \"Layla and Majnun\" (1908), opera pertama di dunia Islam, lagu kebangsaan Azerbaijan, pendirian Institut Musik Baku, dan kematiannya di Baku pada tahun 1948. Ia lahir pada 18 September 1885."
