reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his birth at Aghjabadi near Shusha on 18 September 1885, his teaching years and move to Baku, Leyli and Majnun (1908), Arshin Mal Alan (1913), Koroghlu (1937), the national anthem's music, the conservatoire he founded in 1920, People's Artist of the USSR (1938), Stalin Prizes (1941, 1946), Principles of Azerbaijani Folk Music (1945), and death at Baku on 23 November 1948 of diabetes, buried in the Alley of Honour. It names no school or religion for him personally."
