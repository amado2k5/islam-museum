  en: "English Wikipedia article on Omar ibn Said; used for entity facts only. It recounts his birth about 1770 in Futa Toro, his twenty-five years of Islamic study, his capture in 1807, his life enslaved in North Carolina, his 1831 autobiography, and his death in 1864."
