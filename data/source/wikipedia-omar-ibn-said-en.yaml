reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. The article gives his birth about 1770 in Futa Toro, his capture in 1807, his sale to James Owen in North Carolina, his fourteen Arabic manuscripts including the 1831 autobiography (now at the Library of Congress), and his death in 1864 in Bladen County. On religion it presents him as a Muslim scholar, reports the claim that he converted to Christianity in 1820 and states that the conversion is disputed, reading his autobiography as showing steadfast adherence to Islam; it names no madhhab or order for him, and its infobox carries no religion field."
