summary:
  ar: "مقالة ويكيبيديا الأردية عن شوكت علي (1873–1938)؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في رامبور في 10 مارس 1873 وتعليمه في عليكرة، واستقالته من الخدمة الحكومية سنة 1913 وتأسيسه أنجمن خدام کعبہ، ونشاطه في حركة الخلافة والمؤتمر، وسجنه 1921–1923، ودعمه قائد أعظم والرابطة الإسلامية، ووفاته في دلهي في 26 نوفمبر 1938 وتدفينه قرب جامع مسجد في 28 نوفمبر."
  en: "Urdu Wikipedia article on Shaukat Ali (1873–1938); used for entity facts only. It gives his birth at Rampur on 10 March 1873 and his education at Aligarh, his resignation from government service in 1913 and founding of the Anjuman Khuddam-i-Kaaba, his Khilafat and Congress activity, his imprisonment of 1921–1923, his later support of Jinnah and the Muslim League, and his death at Delhi on 26 November 1938 with burial near the Jama Masjid on 28 November."
  es: "Artículo de Wikipedia en urdu sobre Shaukat Ali (1873-1938); utilizado únicamente para datos sobre la persona. Describe su nacimiento en Rampur el 10 de marzo de 1873 y su educación en Aligarh, su renuncia al servicio gubernamental en 1913 y la fundación de la Anjuman Khuddam-i-Kaaba, su actividad en el movimiento Khilafat y el Congreso, su encarcelamiento entre 1921 y 1923, su posterior apoyo a Jinnah y la Liga Musulmana, y su muerte en Delhi el 26 de noviembre de 1938, con entierro cerca de la Jama Masjid el 28 de noviembre."
  fr: "Article de Wikipédia en ourdou sur Shaukat Ali (1873-1938); utilisé uniquement pour les informations biographiques. Il indique sa naissance à Rampur le 10 mars 1873 et ses études à Aligarh, sa démission de la fonction publique en 1913 et la fondation de l’Anjuman Khuddam-i-Kaaba, son engagement au sein du Khilafat et du Congrès, son emprisonnement de 1921 à 1923, son soutien ultérieur à Jinnah et à la Ligue musulmane, et sa mort à Delhi le 26 novembre 1938, avec son inhumation près de la Jama Masjid le 28 novembre."
  ur: "شوکت علی (1873-1938) پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 10 مارچ 1873 کو رام پور میں ان کی پیدائش اور علی گڑھ میں ان کی تعلیم، 1913 میں سرکاری ملازمت سے استعفیٰ دینے اور انجمن خدام کعبہ کی بنیاد، ان کی خلافت اور کانگریس کی سرگرمی، 1921-1923 کی ان کی قید، بعد میں جناح اور مسلم لیگ کی حمایت، اور 28 نومبر کو دہلی کے قریب ان کی وفات کے بعد 1913 میں ان کی وفات کا ذکر ہے۔ 28 نومبر کو مسجد۔"
  tr: "Shaukat Ali (1873–1938) hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 10 Mart 1873'te Rampur'da doğmuş, Alikra'da eğitim görmüş, 1913'te devlet hizmetinden istifa etmiş, Anjuman Khuddam Kabe'yi kurmuş, Hilafe Hareketi ve Konferans'ta aktifti, 1921–1923 yıllarında hapsedildi, Büyük Lider ve Müslüman Birliği tarafından desteklendi, 26 Kasım 1938'de Delhi'de öldü ve 28 Kasım'da bir caminin yakınında defnedildi."
  id: "Artikel Wikipedia Urdu tentang Shaukat Ali (1873–1938); digunakan hanya untuk fakta entitas. Ia disebutkan lahir di Rampur pada 10 Maret 1873, dididik di Alikra, mengundurkan diri dari dinas pemerintahan pada tahun 1913, mendirikan Anjuman Khuddam Kaaba, aktif dalam Gerakan Khilafa dan Konferensi, dipenjara pada tahun 1921–1923, didukung oleh Grand Leader dan Liga Muslim, meninggal di Delhi pada 26 November 1938, dan dimakamkan di dekat masjid pada 28 November."
