summary:
  ar: "مقالة ويكيبيديا الأردية عن شوكت علي (1873–1938)؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في رامبور في 10 مارس 1873 وتعليمه في عليكرة، واستقالته من الخدمة الحكومية سنة 1913 وتأسيسه أنجمن خدام کعبہ، ونشاطه في حركة الخلافة والمؤتمر، وسجنه 1921–1923، ودعمه قائد أعظم والرابطة الإسلامية، ووفاته في دلهي في 26 نوفمبر 1938 وتدفينه قرب جامع مسجد في 28 نوفمبر."
  en: "Urdu Wikipedia article on Shaukat Ali (1873–1938); used for entity facts only. It gives his birth at Rampur on 10 March 1873 and his education at Aligarh, his resignation from government service in 1913 and founding of the Anjuman Khuddam-i-Kaaba, his Khilafat and Congress activity, his imprisonment of 1921–1923, his later support of Jinnah and the Muslim League, and his death at Delhi on 26 November 1938 with burial near the Jama Masjid on 28 November."
