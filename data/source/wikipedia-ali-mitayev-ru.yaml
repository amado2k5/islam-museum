summary:
  ar: "مقالة ويكيبيديا الروسية عن علي ميتاييف؛ تُستخدم لوقائع الكيان فقط. يسجل متنها إعلانه شيخًا وخليفة لوالده سنة 1914 وقيادته آلاف المريدين، وإعدامه في سبتمبر 1925 في روستوف على الدون؛ ولا يحمل صندوق معلوماتها قيمة للدين."
  en: "Russian Wikipedia article on Ali Mitayev; used for entity facts only. Its text records his proclamation as sheikh and continuer of his father's cause in 1914, his leadership of thousands of murids, and his execution in September 1925 at Rostov-on-Don; its religious-figure infobox carries no religion value."
  es: "Artículo de la Wikipedia rusa sobre Ali Mitayev; se utiliza únicamente para obtener información sobre la persona. Su texto registra su proclamación como jeque y continuador de la causa de su padre en 1914, su liderazgo de miles de murids y su ejecución en septiembre de 1925 en Rostov del Don; su ficha informativa sobre la figura religiosa no tiene ninguna relevancia religiosa."
  fr: "Article de Wikipédia en russe sur Ali Mitayev; utilisé uniquement pour les informations sur l'entité. Son texte relate sa proclamation comme cheikh et continuateur de la cause de son père en 1914, son commandement de milliers de murides et son exécution en septembre 1925 à Rostov-sur-le-Don; son infobox sur la figure religieuse ne contient aucune information sur la religion."
  ur: "علی مطائف پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے متن میں 1914 میں شیخ اور اپنے والد کے کاز کو جاری رکھنے والے کے طور پر اس کا اعلان، ہزاروں مریدوں کی اس کی قیادت، اور ستمبر 1925 میں روسٹو-آن-ڈان میں اس کی پھانسی؛ اس کے مذہبی اعداد و شمار کے انفو باکس میں مذہب کی کوئی اہمیت نہیں ہے۔"
  tr: "Ali Mitayev hakkında Rusça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1914'te babasının şeyhi ve halefi olarak ilan edilmesini, binlerce takipçiye liderlik ettiğini ve Eylül 1925'te Rostov-na-Donu'da idam edilmesini kaydeder; bilgi kutusunun dini bir değeri yoktur."
  id: "Artikel Wikipedia Rusia tentang Ali Mitayev; digunakan hanya untuk fakta entitas. Artikel tersebut mencatat deklarasinya sebagai sheikh dan penerus ayahnya pada tahun 1914, yang membawa ribuan pengikut, dan eksekusinya pada September 1925 di Rostov-on-Don; infobox tersebut tidak memiliki nilai religius."
