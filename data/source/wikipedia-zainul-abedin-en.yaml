summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زين العابدين؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 29 ديسمبر 1914 ووفاته في 28 مايو 1976 في دكا، ولوحات المجاعة سنة 1943، وتأسيسه معهد الفنون والحرف في دكا سنة 1948، ولقبه «شيلباتشاريا»، وأنه كان أول طالب مسلم ينال الدرجة الأولى بامتياز في مدرسة الفنون الحكومية — دون أن تسمّي له مذهبًا."
  en: "English Wikipedia article on Zainul Abedin; used for entity facts only. It gives his birth on 29 December 1914 and his death on 28 May 1976 in Dhaka, the 1943 famine paintings, his founding of the Institute of Arts and Crafts in Dhaka in 1948, his title Shilpacharya, and that he was the first Muslim student to take a first-class distinction at the Government School of Art — it names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Zainul Abedin; utilizado únicamente para datos biográficos. Indica su nacimiento el 29 de diciembre de 1914 y su fallecimiento el 28 de mayo de 1976 en Dhaka, sus pinturas sobre la hambruna de 1943, la fundación del Instituto de Artes y Oficios de Dhaka en 1948, su título de Shilpacharya y que fue el primer estudiante musulmán en obtener una mención honorífica en la Escuela de Arte del Gobierno; no menciona ninguna escuela en particular."
  fr: "L'article de Wikipédia en anglais sur Zainul Abedin, utilisé uniquement pour les informations le concernant, indique sa naissance le 29 décembre 1914 et sa mort le 28 mai 1976 à Dacca, ses peintures sur la famine de 1943, la fondation de l'Institut des arts et métiers de Dacca en 1948, son titre de Shilpacharya, et qu'il fut le premier étudiant musulman à obtenir une mention très bien à l'École gouvernementale des beaux-arts (l'établissement n'est pas précisé)."
  ur: "زین العابدین پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 29 دسمبر 1914 کو ان کی پیدائش اور 28 مئی 1976 کو ڈھاکہ میں ان کی موت، 1943 کے قحط کی پینٹنگز، 1948 میں ڈھاکہ میں انسٹی ٹیوٹ آف آرٹس اینڈ کرافٹس کی بنیاد، ان کا لقب شلپاچاریہ، اور یہ کہ وہ پہلا مسلمان طالب علم تھا جس نے گورنمنٹ اسکول آف آرٹس میں فرسٹ کلاس کا امتیاز حاصل کیا۔"
  tr: "Zain al-Abidin hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 29 Aralık 1914'te doğduğu, 28 Mayıs 1976'da Dakka'da öldüğü, 1943'te kıtlık üzerine resimler yaptığı, 1948'de Dakka'da 'Shilpacharya' lakabıyla Sanat ve Zanaat Enstitüsü'nü kurduğu ve Devlet Sanat Okulu'nda birinci sınıf üstün başarı alan ilk Müslüman öğrenci olduğu belirtilmektedir—adına hiçbir mezhep adı verilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Zain al-Abidin hanya digunakan untuk fakta entitas tersebut. Ia disebutkan lahir pada 29 Desember 1914, meninggal pada 28 Mei 1976 di Dhaka, melukis tentang kelaparan pada tahun 1943, mendirikan Institut Seni dan Kerajinan di Dhaka pada tahun 1948, yang dijuluki 'Shilpacharya,' dan bahwa ia adalah siswa Muslim pertama yang meraih predikat kelas satu di Sekolah Seni Pemerintah—tanpa ada sekte yang dinamai menurut namanya."
