summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زين العابدين؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 29 ديسمبر 1914 ووفاته في 28 مايو 1976 في دكا، ولوحات المجاعة سنة 1943، وتأسيسه معهد الفنون والحرف في دكا سنة 1948، ولقبه «شيلباتشاريا»، وأنه كان أول طالب مسلم ينال الدرجة الأولى بامتياز في مدرسة الفنون الحكومية — دون أن تسمّي له مذهبًا."
  en: "English Wikipedia article on Zainul Abedin; used for entity facts only. It gives his birth on 29 December 1914 and his death on 28 May 1976 in Dhaka, the 1943 famine paintings, his founding of the Institute of Arts and Crafts in Dhaka in 1948, his title Shilpacharya, and that he was the first Muslim student to take a first-class distinction at the Government School of Art — it names no school for him."
