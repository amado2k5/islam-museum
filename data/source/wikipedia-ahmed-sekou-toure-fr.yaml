summary:
  ar: "مقالة ويكيبيديا الفرنسية عن أحمد سيكو توري؛ تُستخدم لوقائع الكيان فقط. تقول نصا في نشأته إنه «مسلم الديانة» وإنه درس أولا في المدرسة القرآنية قبل المدرسة الفرنسية؛ وهي بهذا نص ثانٍ مستقل يشهد بإسلامه الشخصي، ولا تسمّي له مذهبا."
  en: "French Wikipedia article on Ahmed Sékou Touré; used for entity facts only. Its early-life text states 'De confession musulmane' — of the Muslim confession — and that he first attended the Qur'anic school before the French school; it is thus a second independent text attesting his personal Muslim identity, and it names no school for him."
  es: "Artículo de la Wikipedia en francés sobre Ahmed Sékou Touré; utilizado únicamente para datos sobre la persona. Su texto de juventud afirma «De confession musulmane» —de la confesión musulmana— y que asistió primero a la escuela coránica antes que a la francesa; por lo tanto, es un segundo texto independiente que atestigua su identidad musulmana personal, y no menciona ninguna escuela en particular."
  fr: "L'article de Wikipédia en français sur Ahmed Sékou Touré; utilisé uniquement pour les informations relatives à l'individu. Le texte concernant sa jeunesse mentionne « De confession musulmane » — de confession musulmane — et indique qu'il a d'abord fréquenté l'école coranique avant l'école française; il s'agit donc d'un second texte indépendant attestant de son identité musulmane personnelle, et il ne mentionne aucune école en particulier."
  ur: "احمد سیکو ٹوری پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے ابتدائی زندگی کے متن میں کہا گیا ہے کہ 'De confession musulmane' — مسلم اقرار کا — اور یہ کہ اس نے فرانسیسی اسکول سے پہلے قرآنی اسکول میں تعلیم حاصل کی تھی۔ اس طرح یہ ان کی ذاتی مسلم شناخت کی تصدیق کرنے والا دوسرا آزاد متن ہے، اور اس میں ان کے لیے کسی اسکول کا نام نہیں ہے۔"
