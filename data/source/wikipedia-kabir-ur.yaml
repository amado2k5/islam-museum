summary:
  ar: "مقالة ويكيبيديا الأردية عن كبير ⁦(كبير داس)⁩؛ تصفه بأنه شاعر صوفي وسنت من القرن الخامس عشر، وتروي رواية ولادته لأرملة برهمنية وتربيته عند نسّاج مسلم، ثم تلمذته على رامانندا، ونقده للفرقة الدينية ورباطات الطوائف."
  en: "Urdu Wikipedia article on Kabir (Kabir Das); it describes him as a 15th-century Sufi poet and sant, tells the tradition of his birth to a Brahmin widow and upbringing by a Muslim weaver, then his discipleship under Ramananda, and his criticism of religious division and caste bonds."
  es: "Artículo de Wikipedia en urdu sobre Kabir (Kabir Das); lo describe como un poeta sufí y santo del siglo XV, narra la tradición de su nacimiento en el seno de una viuda brahmán y su crianza por un tejedor musulmán, su discipulado con Ramananda y su crítica a la división religiosa y los lazos de casta."
  fr: "Article de Wikipédia en ourdou sur Kabir (Kabir Das); il le décrit comme un poète et saint soufi du XVe siècle, raconte la tradition de sa naissance dans une veuve brahmane et de son éducation par un tisserand musulman, puis son apprentissage auprès de Ramananda, et sa critique de la division religieuse et des liens de caste."
  ur: "کبیر ⁦(کبیر داس)⁩ پر اردو ویکیپیڈیا مضمون؛ اس میں اسے 15 ویں صدی کے صوفی شاعر اور سنت کے طور پر بیان کیا گیا ہے، اس کی پیدائش کی روایت ایک برہمن بیوہ سے اور ایک مسلمان بُنکر کی پرورش، پھر رامانند کے ماتحت اس کی شاگردی، اور مذہبی تقسیم اور ذات پات کے بندھنوں پر تنقید کی گئی ہے۔"
