reliability_note: "Read on 1 November 2026. A short Urdu article that carries the same contested configuration as the English edition from the other side: it calls him a Sufi poet and sant, presents the Brahmin-birth and Muslim-upbringing traditions together, and presents his teaching as monotheist and anti-idolatry. Registered as a corroborating witness to the multiplicity of the traditions claiming him, not as a settlement of any of them."
