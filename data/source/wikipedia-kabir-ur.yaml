  ar: "مقالة ويكيبيديا الأردية عن كبير (كبير داس)؛ تصفه بأنه شاعر صوفي وسنت من القرن الخامس عشر، وتروي رواية ولادته لأرملة برهمنية وتربيته عند نسّاج مسلم، ثم تلمذته على رامانندا، ونقده للفرقة الدينية ورباطات الطوائف."
  en: "Urdu Wikipedia article on Kabir (Kabir Das); it describes him as a 15th-century Sufi poet and sant, tells the tradition of his birth to a Brahmin widow and upbringing by a Muslim weaver, then his discipleship under Ramananda, and his criticism of religious division and caste bonds."
