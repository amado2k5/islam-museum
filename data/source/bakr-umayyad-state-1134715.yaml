  en: "The Umayyad State — Bakr Muhammad Ibrahim Bakr (1st ed., Markaz al-Raya lil-Nashr wal-I'lam, Cairo 2002)"
summary:
  ar: "كتاب في تاريخ الدولة الأموية بعد الخلفاء الراشدين، يبدأ بإيجاز لخلافة الخلفاء الراشدين ثم يسرد سير ملوك بني أمية من معاوية بن أبي سفيان إلى مروان بن محمد، على طريقة الحوليات مع تراجم للأعلام ووقائع السنين."
  en: "A book on the history of the Umayyad state after the Rightly Guided Caliphs. It opens with a brief account of the Rightly Guided Caliphs, then narrates the lives of the Umayyad rulers from Mu'awiya ibn Abi Sufyan to Marwan ibn Muhammad, in the annalistic manner, with biographies of notable figures and the events of each year."
