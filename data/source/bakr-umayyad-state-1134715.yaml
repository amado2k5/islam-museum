label:
  ar: "الدولة الأموية — بكر محمد إبراهيم بكر ⁦(الطبعة الأولى، مركز الراية للنشر والإعلام، القاهرة 2002)⁩"
  en: "The Umayyad State — Bakr Muhammad Ibrahim Bakr (1st ed., Markaz al-Raya lil-Nashr wal-I'lam, Cairo 2002)"
summary:
  ar: "كتاب في تاريخ الدولة الأموية بعد الخلفاء الراشدين، يبدأ بإيجاز لخلافة الخلفاء الراشدين ثم يسرد سير ملوك بني أمية من معاوية بن أبي سفيان إلى مروان بن محمد، على طريقة الحوليات مع تراجم للأعلام ووقائع السنين."
  en: "A book on the history of the Umayyad state after the Rightly Guided Caliphs. It opens with a brief account of the Rightly Guided Caliphs, then narrates the lives of the Umayyad rulers from Mu'awiya ibn Abi Sufyan to Marwan ibn Muhammad, in the annalistic manner, with biographies of notable figures and the events of each year."
  es: "Un libro sobre la historia del estado omeya después de los califas bien guiados. Comienza con un breve relato de los califas bien guiados y luego narra las vidas de los gobernantes omeyas desde Mu'awiya ibn Abi Sufyan hasta Marwan ibn Muhammad, a modo de crónica, con biografías de figuras destacadas y los acontecimientos de cada año."
  fr: "Cet ouvrage retrace l'histoire de l'État omeyyade après les califes bien-guidés. Il s'ouvre sur un bref exposé des califes bien-guidés, puis relate la vie des souverains omeyyades, de Mu'awiya ibn Abi Sufyan à Marwan ibn Muhammad, sous forme d'annales, avec les biographies des personnages marquants et le récit des événements de chaque année."
  ur: "ہدایت یافتہ خلفاء کے بعد اموی ریاست کی تاریخ پر ایک کتاب۔ اس کا آغاز خلفائے راشدین کے مختصر احوال سے ہوتا ہے، پھر معاویہ ابن ابی سفیان سے لے کر مروان ابن محمد تک اموی حکمرانوں کی زندگیوں کو تجزیاتی انداز میں، قابل ذکر شخصیات کی سوانح حیات اور ہر سال کے واقعات کے ساتھ بیان کیا گیا ہے۔"
  tr: "Doğru Rehberli Halifelerden sonra Emevi devletinin tarihini anlatan bir kitap; Doğru Rehberli Halifelerin halifeliğinin kısa bir anlatımıyla başlar, ardından Muaviye ibn Abi Sufyan'dan Mervan ibn Muhammed'e kadar Emevi krallarının biyografilerini, önemli şahsiyetlerin biyografileri ve yılların olaylarıyla birlikte yıllık tarzında anlatır."
  id: "Sebuah buku tentang sejarah negara Umayyah setelah Khalifah yang Dibimbing dengan Benar, dimulai dengan catatan singkat tentang kekhalifahan Khalifah yang Dibimbing dengan Benar, kemudian menceritakan biografi raja-raja Umayyah dari Muawiya ibn Abi Sufyan hingga Marwan ibn Muhammad, dalam gaya annal dengan biografi tokoh-tokoh terkenal dan peristiwa tahun-tahun tersebut."
