reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives him as born in Hunan province in 1864 and died 1938, Minister of Education of Gansu from 1912, founder of the Association for the Promoting of Islamic Teaching in 1918, and states that he and General Ma Fuxiang sponsored Imam Wang Jingzhai's hajj in 1921 — a claim contradicted in detail by Wang Jingzhai's own Chinese article (journey 1922–1923, four other sponsors, hajj in autumn 1923), so it is not used for any relation. It names no school, order or movement for him, calling him only a Chinese Muslim."
