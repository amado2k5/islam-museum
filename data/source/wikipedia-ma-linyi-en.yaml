  ar: "مقالة ويكيبيديا الإنجليزية عن ما ليني؛ تُستخدم لوقائع الكيان فقط. تروي السياسي المسلم الصيني المولود في خونان سنة 1864 والمتوفى سنة 1938، الذي تولّى تعليم قانسو سنة 1912 وأسّس جمعية تعزيز التعليم الإسلامي سنة 1918، ورعى مع ما فوشيانغ حجّ وانغ جينغزهاي."
  en: "English Wikipedia article on Ma Linyi; used for entity facts only. It recounts the Chinese Muslim politician born in Hunan in 1864 who died in 1938, took charge of education in Gansu in 1912, founded the Association for the Promoting of Islamic Teaching in 1918, and with Ma Fuxiang sponsored Wang Jingzhai's hajj."
