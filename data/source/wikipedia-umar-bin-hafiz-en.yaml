summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمر بن حفيظ ⁦(ولد 27 مايو 1963)⁩، معلم تريم ومؤسس دار المصطفى؛ صندوق معلوماتها الديني وفقرة آرائه الدينية، وكلاهما مستند إلى قائمة الخمسمئة مسلم، يعطيان الإسلام السني والمذهب الشافعي والعقيدة الأشعرية وطريقة آل باعلوي."
  en: "The English Wikipedia article on Umar bin Hafiz (born 27 May 1963), the Tarim teacher and founder of Dar al-Mustafa; its religious infobox and its 'religious views' passage, both resting on The Muslim 500, give Sunni Islam, the Shafi'i school, the Ash'ari creed and the Ba 'Alawiyya tariqa."
  es: "El artículo de la Wikipedia en inglés sobre Umar bin Hafiz (nacido el 27 de mayo de 1963), el maestro de Tarim y fundador de Dar al-Mustafa; su ficha informativa religiosa y su pasaje sobre \"opiniones religiosas\", ambos basados en The Muslim 500, presentan el Islam sunita, la escuela Shafi'i, el credo Ash'ari y la tariqa Ba 'Alawiyya."
  fr: "L'article de Wikipédia en anglais sur Umar bin Hafiz (né le 27 mai 1963), l'enseignant de Tarim et fondateur de Dar al-Mustafa; son encadré religieux et son passage sur les « opinions religieuses », tous deux basés sur The Muslim 500, mentionnent l'islam sunnite, l'école shafi'ite, la doctrine ash'arite et la confrérie Ba 'Alawiyya."
  ur: "عمر بن حفیظ ⁦(پیدائش 27 مئی 1963)⁩ پر انگریزی ویکیپیڈیا کا مضمون، دار المصطفیٰ کے استاد اور بانی؛ اس کا مذہبی معلومات خانہ اور اس کے 'مذہبی نظریات' کا حوالہ، دونوں مسلم 500 پر محیط ہیں، سنی اسلام، شافعی مکتب، اشعری عقیدہ اور باعلویہ طریقہ دیتے ہیں۔"
  tr: "Tarim öğretmeni ve Dar Al-Mustafa'nın kurucusu Omar bin Hafiz (d. 27 Mayıs 1963) hakkında İngilizce Wikipedia makalesi; dini bilgi kutusu ve dini görüşleri bölümü, her ikisi de beş yüz Müslümanın listesine dayanıyor ve Sünni İslam, Şafii mezhebi, Aş'ari mezhebi ve Ba'alawi tarikatını sunuyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Omar bin Hafiz (lahir 27 Mei 1963), seorang guru Tarim dan pendiri Dar Al-Mustafa; kotak informasi agama dan bagian opini agamanya, keduanya berdasarkan daftar lima ratus Muslim, yang menampilkan Islam Sunni, mazhab Shafi'i, ajaran Ash'ari, dan tarekat Ba'alawi."
