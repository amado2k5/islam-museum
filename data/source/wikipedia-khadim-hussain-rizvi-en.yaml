reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. Read in full on 5 November 2026 (page copy crawled 6 October 2026). The lead and infobox give his birth on 22 May 1966 in Pindigheb, citing The Express Tribune of 19 November 2020 for the day, and his death on 19 November 2020 in Lahore, citing SAMAA TV; the body, citing Dawn's profile of 3 December 2017, gives his Jamia Nizamia Rizvia education, his Friday sermons at Lahore's Pir Makki Masjid in the Punjab Auqaf department, his wheelchair use after a 2007 accident, his removal from public service over his defence of the blasphemy laws and of Mumtaz Qadri, the 6 November 2017 Faizabad march and sit-in, the October–November 2018 Asia Bibi protests and his arrest on 23 November 2018 and bail in May 2019, the 2020 Zindagi Tamasha protests, and his funeral at Minar-e-Pakistan, burial at Madrassah Abuzar Ghaffari and his son Saad's appointment as ameer on 21 November 2020. The infobox's religion, denomination, jurisprudence, creed and movement entries (Sunni / Hanafi / Maturidi / Barelvi) are structured data and were not used to settle faith. No revision id was exposed by the fetched copy, so no revision id is recorded; the access date stands in its place, on the consultation-date precedent of recent records. No Wikidata QID could be verified from the pages read, so none is recorded."
