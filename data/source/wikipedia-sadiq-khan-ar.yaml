summary:
  ar: "مقالة ويكيبيديا العربية عن صادق خان، مراجعة 9 يونيو 2026؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها ديانته «الإسلام» دون مدرسة، وتسجل حصوله على لقب فارس سنة 2025 وإدراجه في قائمة تايم 100 لسنة 2018."
  en: "Arabic Wikipedia article on Sadiq Khan, revision of 9 June 2026; used for entity facts only. Its infobox gives his religion as Islam without a school; it records his 2025 knighthood and his place in the TIME 100 of 2018."
  es: "Artículo de Wikipedia en árabe sobre Sadiq Khan, revisado el 9 de junio de 2026; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que su religión es el islam sin escuela; registra su nombramiento como caballero en 2025 y su inclusión en la lista TIME 100 de 2018."
  fr: "Article de Wikipédia en arabe sur Sadiq Khan, mis à jour le 9 juin 2026; utilisé uniquement pour les informations sur l’entité. Son infobox indique qu’il est musulman, sans mention d’école religieuse; elle mentionne son anoblissement en 2025 et sa présence dans le classement TIME 100 de 2018."
  ur: "صادق خان پر عربی ویکیپیڈیا کا مضمون، 9 جون 2026 کی نظر ثانی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا انفو باکس بغیر سکول کے اپنا مذہب اسلام دیتا ہے۔ یہ اس کی 2025 نائٹ ہڈ اور 2018 کے TIME 100 میں اس کی جگہ کو ریکارڈ کرتا ہے۔"
  tr: "Sadiq Khan hakkında Arapça Vikipedi makalesi, revizyon 9 Haziran 2026; sadece varlık bilgileri için kullanılmıştır. Bilgi kutusunda dinini okulsuz \"İslam\" olarak belirtmekte ve 2025'te Şövalye unvanını almasını ve 2018 Time 100 listesine dahil edilmesini kaydetmektedir."
  id: "Artikel Wikipedia Arab tentang Sadiq Khan, revisi 9 Juni 2026; hanya digunakan untuk fakta entitas. Infobox menyebutkan agamanya sebagai \"Islam\" tanpa sekolah, dan mencatat penerimaannya gelar Ksatria pada 2025 dan dimasukkan dalam daftar Time 100 untuk 2018."
