  ar: "مقالة ويكيبيديا الإنجليزية عن محمد بخاري؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته العسكرية وحكمه العسكري (1983–1985) واعتقاله بعد الإطاحة به، وترشحاته الخاسرة ثم فوزه بانتخابات 2015 و2019 ورئاسته حتى 2023، وتصريحه سنة 2001 بالتزامه الكامل بحركة الشريعة، ووفاته في عيادة بلندن في 13 يوليو 2025 ودفنه في بيته بدورا."
  en: "English Wikipedia article on Muhammadu Buhari; used for entity facts only. It recounts his military career and military rule (1983–1985), his detention after his overthrow, his losing candidacies and his election victories of 2015 and 2019 and presidency to 2023, his 2001 statement of 'total commitment to the Sharia movement', and his death in a London clinic on 13 July 2025 and burial at his home in Daura."
