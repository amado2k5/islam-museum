summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بابا فريد ⁦(فريد الدين مسعود گنج شكر)⁩؛ تعطي مولده نحو 4 أبريل 1188 ووفاته نحو 7 مايو 1266، وتذكر في متنها مولدين آخرين 1179 و1173؛ تُستخدم لوقائع الكيان فقط."
  en: "English Wikipedia article on Baba Farid (Fariduddin Masud Ganjshakar); it gives his birth as c. 4 April 1188 and his death as c. 7 May 1266, while its own text also carries the birth years 1179 and 1173; used for entity facts only."
  es: "Artículo de la Wikipedia en inglés sobre Baba Farid (Fariduddin Masud Ganjshakar); indica que nació alrededor del 4 de abril de 1188 y murió alrededor del 7 de mayo de 1266, mientras que su propio texto también incluye los años de nacimiento 1179 y 1173; utilizado únicamente para datos sobre la entidad."
  fr: "L'article de Wikipédia en anglais sur Baba Farid (Fariduddin Masud Ganjshakar) indique sa naissance vers le 4 avril 1188 et sa mort vers le 7 mai 1266, tandis que son propre texte mentionne également les années de naissance 1179 et 1173; utilisé uniquement pour les informations sur l'entité."
  ur: "بابا فرید ⁦(فرید الدین مسعود گنج شکر)⁩ پر انگریزی ویکیپیڈیا مضمون؛ یہ اس کی پیدائش c کے طور پر کرتا ہے۔ 4 اپریل 1188 اور اس کی موت بطور سی۔ 7 مئی 1266، جبکہ اس کے اپنے متن میں پیدائش کے سال 1179 اور 1173 بھی درج ہیں۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔"
  tr: "Baba Farid hakkında İngilizce Vikipedi makalesi (Farid al-Din Masoud Ganj Shukr); doğumunu yaklaşık 4 Nisan 1188'de ve ölümünü 7 Mayıs 1266 civarında belirtir; 1179 ve 1173 tarihli iki başka doğumdan bahseder; sadece varlığın kayıtları için kullanılır."
  id: "Artikel Wikipedia bahasa Inggris tentang Baba Farid (Farid al-Din Masoud Ganj Shukr); menyebutkan kelahirannya sekitar 4 April 1188, dan kematiannya sekitar 7 Mei 1266, menyebutkan dua kelahiran lain pada tahun 1179 dan 1173; hanya digunakan untuk catatan entitas tersebut."
