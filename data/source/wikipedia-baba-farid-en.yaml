reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). Its lead gives c. 4 April 1188 (Kothewal, near Multan) to c. 7 May 1266 (Pakpattan); the same article quotes a 2023 Springer chapter giving his years as 1179-1266 and notes another source claims he was born in 1173, so the birth year is built as debated with all three readings preserved. Its prose calls him one of the founding fathers of the Chishti Sufi order, says he became head of the Chishti order, and names his teacher Qutbuddin Bakhtiar Kaki. Checked 2 November 2026."
