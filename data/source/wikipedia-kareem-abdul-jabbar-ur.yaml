summary:
  ar: "مقالة ويكيبيديا الأردية عن كريم عبد الجبار؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة: يذكر صندوق معلوماتها مولده في 16 أبريل 1947 في مدينة نيويورك وديانته «الإسلام»، وتذكر مقدمتها أنه جاء من المسيحية إلى «أمة الإسلام» أولاً ثم دخل الإسلام السنّي."
  en: "Urdu Wikipedia article on Kareem Abdul-Jabbar; used for entity facts only. A short article: its infobox gives his birth on 16 April 1947 in New York City and his religion as Islam, and its lead states that he came from Christianity first into the Nation of Islam and then entered Sunni Islam."
  es: "Artículo de Wikipedia en urdu sobre Kareem Abdul-Jabbar; utilizado únicamente para datos sobre la persona. Un artículo breve: su ficha informativa indica que nació el 16 de abril de 1947 en la ciudad de Nueva York y que su religión era el islam, y su introducción afirma que pasó del cristianismo a la Nación del Islam y posteriormente al islam sunita."
  fr: "Article de Wikipédia en ourdou sur Kareem Abdul-Jabbar; utilisé uniquement pour les informations sur l'entité. Cet article est court: son infobox indique sa naissance le 16 avril 1947 à New York et sa religion, l'islam; son introduction précise qu'il est passé du christianisme à la Nation of Islam avant de se convertir à l'islam sunnite."
  ur: "کریم عبدالجبار پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون: اس کا معلوماتی باکس نیویارک شہر میں 16 اپریل 1947 کو اس کی پیدائش اور اس کا مذہب اسلام بتاتا ہے، اور اس کی قیادت بتاتی ہے کہ وہ عیسائیت سے پہلے نیشن آف اسلام میں آیا اور پھر سنی اسلام میں داخل ہوا۔"
