reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026. Its lead sentence names Sunni Islam for Abdul-Jabbar himself, saying in Urdu that he entered real Sunni Islam after the Nation of Islam; its infobox religion value is Islam generically, cited to a CBS News picture gallery. Its path through the Nation of Islam differs from the English article's account, under which he declined to join the Nation; the two editions agree that he ended in Sunni Islam. Revision identifiers could not be recorded in this run; the article was consulted directly on the date given."
