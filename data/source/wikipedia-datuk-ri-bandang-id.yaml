reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his real name as Abdul Makmur with the title Khatib Tunggal, his origin at Koto Tangah in Minangkabau, his work alongside his fellow scholars Datuk Patimang and Datuk Ri Tiro from the end of the 16th century, his specialism in fiqh and his preaching in Gowa and Tallo, the conversion of the king of Luwu on 4-5 February 1605, the later conversion of the kings of Gowa and Tallo, and his death and burial at Tallo. It gives no birth or death year for him. Checked 1 November 2026."
