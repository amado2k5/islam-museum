summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن داتوق ري باندانغ ⁦(عبد المعمور)⁩، العالم المينانغكابوي الذي نشر الإسلام في ممالك شرق الأرخبيل؛ تُستخدم لوقائع الكيان فقط."
  en: "Indonesian Wikipedia article on Datuk ri Bandang (Abdul Makmur), the Minangkabau scholar who preached Islam in the kingdoms of the eastern archipelago; used for entity facts only, each cited where the article gives its own source."
  es: "Artículo de la Wikipedia en indonesio sobre Datuk ri Bandang (Abdul Makmur), el erudito minangkabau que predicó el Islam en los reinos del archipiélago oriental; se utiliza únicamente para datos sobre la entidad, citados donde el artículo proporciona su propia fuente."
  fr: "Article de Wikipédia indonésien sur Datuk ri Bandang (Abdul Makmur), le savant Minangkabau qui a prêché l'islam dans les royaumes de l'archipel oriental; utilisé uniquement pour les faits concernant l'entité, chacun étant cité là où l'article donne sa propre source."
  ur: "داتوک ری بندانگ ⁦(عبدالمکمور)⁩ پر انڈونیشیائی ویکیپیڈیا مضمون، منانگکاباؤ کے اسکالر جس نے مشرقی جزیرہ نما کی ریاستوں میں اسلام کی تبلیغ کی۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک کا حوالہ دیا جاتا ہے جہاں مضمون اپنا ماخذ دیتا ہے۔"
  tr: "Takımadaların doğusundaki krallıklarda İslam'ı yayan Minangkapui bilgini Datuk Ri Bandang (Abdul Maamour) hakkında Endonezya Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılır."
  id: "Artikel Wikipedia bahasa Indonesia tentang Datuk Ri Bandang (Abdul Maamour), ulama Minangkapui yang menyebarkan Islam di kerajaan-kerajaan timur kepulauan; hanya digunakan untuk fakta entitas tersebut."
