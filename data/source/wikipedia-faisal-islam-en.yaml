reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Used for his upbringing in Didsbury and Longsight to Bengali parents from West Bengal, his education at Manchester Grammar School, Trinity College, Cambridge and City University, and his posts at The Observer, Channel 4 News, Sky News and BBC News, with his journalism awards. The article gives his birth as 29 May 1977 in Manchester but flags the date as needing a citation, and the Arabic article gives the year as 1978, so only the year 1977 is built and the block is marked debated. The article records his 2015 nomination for a British Muslim Awards media award, a community listing that is not evidence of a personal profession of faith; it names no religion for him."
