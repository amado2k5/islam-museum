  ur: "سکاٹش سیاست دان حمزہ یوسف پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک نے مضمون کے ذریعہ کا حوالہ دیا ہے۔ یہ 7 اپریل 1985 کو ان کی گلاسگو میں پیدائش، ان کی یونیورسٹی آف گلاسگو کی تعلیم اور ان کے وزارتی کیریئر کے انگریزی مضمون سے متفق ہے۔"
