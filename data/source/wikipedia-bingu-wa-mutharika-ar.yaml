summary:
  ar: "مقالة ويكيبيديا العربية عن بينغو وا موثاريكا؛ تُستخدم لوقائع الكيان فقط. وهي بذرة: تذكر رئاسته ⁦(24 مايو 2004 إلى 5 أبريل 2012)⁩ وولادته في 24 فبراير 1934 في ثيولو ووفاته في 5 أبريل 2012 في ليلونغوي وحزبه وزوجاته، ويقرأ حقل الدين في صندوق معلوماتها «كاثوليكي»؛ ولا يناقش متنها الدين."
  en: "Arabic Wikipedia article on Bingu wa Mutharika; used for entity facts only. A stub: it gives his presidency (24 May 2004 to 5 April 2012), his birth on 24 February 1934 at Thyolo and his death on 5 April 2012 at Lilongwe, his party and spouses, and its infobox religion field reads Catholic; its text discusses no religion."
  es: "Artículo en árabe de la Wikipedia sobre Bingu wa Mutharika; utilizado únicamente para datos sobre la persona. Un esbozo: indica su presidencia (del 24 de mayo de 2004 al 5 de abril de 2012), su nacimiento el 24 de febrero de 1934 en Thyolo y su fallecimiento el 5 de abril de 2012 en Lilongwe, su partido y cónyuges, y el campo de religión de su ficha informativa indica \"católico\"; el texto no menciona ninguna religión."
  fr: "Article Wikipédia en arabe sur Bingu wa Mutharika; utilisé uniquement pour les informations le concernant. Ébauche: elle mentionne sa présidence (du 24 mai 2004 au 5 avril 2012), sa naissance le 24 février 1934 à Thyolo et son décès le 5 avril 2012 à Lilongwe, son parti et ses conjoints. Le champ « religion » de l’infobox indique « catholique », mais le texte ne traite pas de religion."
