summary:
  ar: "عنصر ويكيداتا Q367319: رحالة وجغرافي أندلسي ولد في بلنسية سنة 1145 وتوفي بالإسكندرية سنة 1217، وهما يوافقان البطاقة؛ وفيه تاريخان للوفاة في 1217 ويبقى تاريخ البطاقة المصدَّر كما هو."
  en: "Wikidata item Q367319 for Ibn Jubayr: Andalusian traveller and geographer born in Valencia (Q8818) in 1145, died in Alexandria (Q87) in 1217; the card's born year 1145 and Alexandria burial agree; two death claims exist (1 January and 29 November 1217), the card's 5 November 1217 stays as sourced."
  es: "Elemento de Wikidata Q367319 para Ibn Jubayr: viajero y geógrafo andalusí nacido en Valencia (Q8818) en 1145, muerto en Alejandría (Q87) en 1217; el año de nacimiento de la tarjeta, 1145, y el entierro en Alejandría coinciden; existen dos afirmaciones de muerte (1 de enero y 29 de noviembre de 1217), la fecha del 5 de noviembre de 1217 de la tarjeta se mantiene como fuente."
  fr: "L'élément Wikidata Q367319 pour Ibn Jubayr: voyageur et géographe andalou né à Valence (Q8818) en 1145, mort à Alexandrie (Q87) en 1217; l'année de naissance de la carte 1145 et l'inhumation à Alexandrie concordent; deux dates de décès existent (1er janvier et 29 novembre 1217), la date du 5 novembre 1217 de la carte reste telle qu'indiquée."
  ur: "ابن جبیر کے لیے ویکی ڈیٹا آئٹم Q367319: اندلس کے سیاح اور جغرافیہ دان ویلنسیا (Q8818) میں 1145 میں پیدا ہوئے، 1217 میں اسکندریہ (Q87) میں فوت ہوئے۔ کارڈ کی پیدائش کا سال 1145 اور اسکندریہ کی تدفین پر اتفاق ہے۔ موت کے دو دعوے موجود ہیں ⁦(1 جنوری اور 29 نومبر 1217)⁩، کارڈ کا 5 نومبر 1217 اسی طرح رہتا ہے۔"
  tr: "Wikidata Element Q367319: 1145'te Valencia'da doğmuş ve 1217'de İskenderiye'de ölmüş Endülüslü gezgin ve coğrafyacıdır. Her ikisi de karta karşılık gelir; 1217'de iki ölüm tarihi vardır ve kartın kaynak tarihi aynı kalır."
  id: "Elemen Wikidata Q367319: Pelancong dan ahli geografi Andalusia yang lahir di Valencia pada tahun 1145 dan meninggal di Alexandria pada tahun 1217. Keduanya sesuai dengan kartu tersebut; kartu tersebut memuat dua tanggal kematian pada tahun 1217, dan tanggal sumber kartu tetap sama."
