reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The stub's lead gives his birth on 5 August 1954 in Philadelphia and his death there on 25 May 2014, and its statistics section, citing BoxRec, gives 68 bouts with 49 wins, 35 by knockout, 16 losses and 3 draws. Both its birth date (5 August against 16 June) and its win total (49 against 39) conflict with the English article and Wikidata; the record follows the English article and Wikidata and discloses the conflict here and in the person record. Its text names no religion for him; its categories file him among converts to Islam and African-American Muslims — filings, not attestation. Its categories give his birth year in Hijri as 1373 and his death year as 1435."
