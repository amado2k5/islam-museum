  ar: "مقالة ويكيبيديا العربية عن ماثيو سعد محمد؛ بذرة قصيرة تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 5 أغسطس 1954 في فيلادلفيا ووفاته في 25 مايو 2014 فيها، وسجلاً من 68 نزالاً فاز في 49 منها — وكلا الرقمين يختلف عن المقالة الإنجليزية وويكيداتا."
  en: "Arabic Wikipedia article on Matthew Saad Muhammad; a short stub, used for entity facts only. It gives his birth on 5 August 1954 in Philadelphia and his death there on 25 May 2014, and a record of 68 bouts with 49 wins — both figures differing from the English article and Wikidata."
  es: "Artículo en árabe de la Wikipedia sobre Matthew Saad Muhammad; un breve esbozo que solo incluye datos sobre la persona. Indica que nació el 5 de agosto de 1954 en Filadelfia y falleció allí el 25 de mayo de 2014, y que disputó 68 combates con 49 victorias; ambas cifras difieren del artículo en inglés y de Wikidata."
  fr: "Article Wikipédia en arabe sur Matthew Saad Muhammad; une ébauche succincte, servant uniquement à fournir des informations factuelles. On y trouve sa naissance le 5 août 1954 à Philadelphie et son décès dans cette même ville le 25 mai 2014, ainsi qu’un palmarès de 68 combats, dont 49 victoires — des chiffres différents de ceux de l’article en anglais et de Wikidata."
