  ar: "مقالة ويكيبيديا الإنجليزية عن مولاي الحسن، ولي عهد المغرب ⁦(وُلد في ٨ أيار ٢٠٠٣ في الرباط)⁩، الابن الأكبر للملك محمد السادس؛ تذكر دراسته في المدرسة المولوية وجامعة محمد السادس متعددة التخصصات ورتبه العسكرية ومهامه الرسمية منذ ٢٠١٣ وأوسمته، ولا تسمي له دينًا خارج سياقه الملكي."
  en: "English Wikipedia article on Moulay Hassan, Crown Prince of Morocco (born 8 May 2003 in Rabat), elder son of King Mohammed VI; it records his education at the Royal College and Mohammed VI Polytechnic University, his military ranks, his official engagements since 2013 and his honours, and names no faith for him beyond his royal context."
