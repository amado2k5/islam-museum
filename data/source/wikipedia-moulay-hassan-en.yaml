summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مولاي الحسن، ولي عهد المغرب ⁦(وُلد في ٨ أيار ٢٠٠٣ في الرباط)⁩، الابن الأكبر للملك محمد السادس؛ تذكر دراسته في المدرسة المولوية وجامعة محمد السادس متعددة التخصصات ورتبه العسكرية ومهامه الرسمية منذ ٢٠١٣ وأوسمته، ولا تسمي له دينًا خارج سياقه الملكي."
  en: "English Wikipedia article on Moulay Hassan, Crown Prince of Morocco (born 8 May 2003 in Rabat), elder son of King Mohammed VI; it records his education at the Royal College and Mohammed VI Polytechnic University, his military ranks, his official engagements since 2013 and his honours, and names no faith for him beyond his royal context."
  es: "Artículo de la Wikipedia en inglés sobre Moulay Hassan, príncipe heredero de Marruecos (nacido el 8 de mayo de 2003 en Rabat), hijo mayor del rey Mohammed VI; en él se recogen sus estudios en el Real Colegio y la Universidad Politécnica Mohammed VI, sus rangos militares, sus compromisos oficiales desde 2013 y sus honores, y no se menciona ninguna religión más allá de su contexto real."
  fr: "L'article de Wikipédia en anglais sur Moulay Hassan, prince héritier du Maroc (né le 8 mai 2003 à Rabat), fils aîné du roi Mohammed VI, retrace son parcours scolaire au Collège royal et à l'Université polytechnique Mohammed VI, ses grades militaires, ses engagements officiels depuis 2013 et ses distinctions, sans mentionner sa religion en dehors de son contexte royal."
  ur: "مراکش کے ولی عہد شہزادہ مولائے حسن پر انگریزی ویکیپیڈیا کا مضمون ⁦(پیدائش 8 مئی 2003 رباط میں)⁩، شاہ محمد ششم کے بڑے بیٹے؛ اس میں رائل کالج اور محمد VI پولی ٹیکنک یونیورسٹی میں ان کی تعلیم، اس کے فوجی عہدے، 2013 سے اس کی سرکاری مصروفیات اور اس کے اعزازات کو ریکارڈ کیا گیا ہے، اور اس کے شاہی سیاق و سباق سے ہٹ کر اس کے لیے کوئی عقیدہ نہیں ہے۔"
