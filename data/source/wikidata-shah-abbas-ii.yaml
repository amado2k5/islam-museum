reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth on 20 December 1633 — a rival to the articles' 30 August 1632, preserved in the person record — his birthplace as Qazvin and his place of death as Damghan, and his death under two statements, 26 October 1666 and 5 October 1666, the second preserved in the person record. Its religion statement files Shia Islam; structured data settles nothing, and the person record's faith rests on the prose texts instead, which conflict and are recorded as a flagged unknown. The QID was grounded from the English article's own page property, the Arabic, Urdu and Persian articles agreeing. Item revision fetched live and re-asserted identical on a second query, 1 November 2026."
