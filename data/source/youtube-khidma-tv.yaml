summary:
  ar: "قناة خدمة تي في على يوتيوب (@khidmaonlinetv350)؛ أوصاف مقاطعها المقروءة في 8 نوفمبر 2026 تنشر خطب جمعة ومحاضرات لشيوخ شتى، وتسرد حسابات المنفذ على الشبكات الاجتماعية: فيسبوك /mzeewakhidma وإنستغرام /khidma_tv وتيك توك /khidmatv1."
  en: "Khidma TV's own YouTube channel (@khidmaonlinetv350); its video descriptions, read on 8 November 2026, publish Friday khutbahs and lectures by various sheikhs and list the outlet's social accounts: Facebook /mzeewakhidma, Instagram /khidma_tv and TikTok /khidmatv1."
  es: "El canal de YouTube de Khidma TV (@khidmaonlinetv350); sus descripciones de video, leídas el 8 de noviembre de 2026, publican sermones y conferencias de los viernes a cargo de varios jeques y enumeran las cuentas de redes sociales del medio: Facebook /mzeewakhidma, Instagram /khidma_tv y TikTok /khidmatv1."
  fr: "La chaîne YouTube de Khidma TV (@khidmaonlinetv350); ses descriptions vidéo, lues le 8 novembre 2026, publient les khutbahs du vendredi et les conférences de divers cheikhs et listent les comptes sociaux de la chaîne: Facebook /mzeewakhidma, Instagram /khidma_tv et TikTok /khidmatv1."
  ur: "خدمت ٹی وی کا اپنا یوٹیوب چینل (@khidmaonlinetv350)؛ اس کی ویڈیو کی تفصیل، 8 نومبر 2026 کو پڑھی گئی، مختلف شیخوں کے خطبہ جمعہ اور لیکچرز شائع کریں اور آؤٹ لیٹ کے سوشل اکاؤنٹس کی فہرست بنائیں: Facebook /mzeewakhidma، Instagram /khidma_tv اور TikTok /khidmatv1۔"
  tr: "YouTube kanalında Service TV kanalı (@khidmaonlinetv350); 8 Kasım 2026'da okunan kliplerinin açıklamaları, çeşitli şeyhlerin Cuma vaazları ve konferanslarını yayınlar; failin sosyal medya hesapları listelenmiştir: Facebook /mzeewakhidma, Instagram /khidma_tv ve TikTok /khidmatv1."
  id: "Saluran TV layanan di YouTube (@khidmaonlinetv350); deskripsi klip-klipnya yang dibacakan pada 8 November 2026, menerbitkan khotbah dan ceramah Jumat dari berbagai sheikh, mencantumkan akun media sosial pelaku: Facebook /mzeewakhidma, Instagram /khidma_tv, dan TikTok /khidmatv1."
