reliability_note: "The outlet's own channel: a primary source for its identity, its cross-platform self-presentation and its output, not independent corroboration. Read on 8 November 2026, its video descriptions carry a standing block in Swahili ('Tufuatilie mitaondao ya kijamii' — follow us on social media) listing Facebook /mzeewakhidma, Instagram /khidma_tv, TikTok /khidmatv1 and YouTube /@khidmaonlinetv350 as the outlet's own accounts; the videos read include a Friday khutbah at Masjid Idirssa, Kariakoo, by Sheikh Abdulrahman Kizundu and a live muhadhara at Masjid Songea, Ilala, by Sheikh Abdulrahman, with keyword tags naming Tanzania, Kenya, Uganda, Rwanda, Burundi and Congo. No subscriber count for this channel was read in this run, and no count is taken from this source. The channel text read names no owner, manager or parent organisation and gives no founding date. Read on 8 November 2026."
