  ar: "صفحة «عن الموقع» في Sunnah.com كما قُرئت في 6 نوفمبر 2026: مصدر النص العربي، وتعدد المترجمين، واختلاف الترقيم بين العربية والإنجليزية والتوجه إلى ترقيم موحد، وعرض أحكام الألباني ودار السلام على أحاديث غير الصحيحين."
