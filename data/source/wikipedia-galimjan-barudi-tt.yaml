  ar: "مقالة ويكيبيديا التترية عن غليمجان بارودي؛ تعطي اسمه الكامل غليمجان محمد جان أولو غالييف، وميلاده في 17 فبراير 1857 في كچه قوال ووفاته في موسكو في 6 ديسمبر 1921، وتفصّل مدرسته «محمدية» ونشاطه ومفتيته."
