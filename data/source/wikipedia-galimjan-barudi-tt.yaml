summary:
  ar: "مقالة ويكيبيديا التترية عن غليمجان بارودي؛ تعطي اسمه الكامل غليمجان محمد جان أولو غالييف، وميلاده في 17 فبراير 1857 في كچه قوال ووفاته في موسكو في 6 ديسمبر 1921، وتفصّل مدرسته «محمدية» ونشاطه ومفتيته."
  en: "Tatar Wikipedia article on Galimjan Barudi; it gives his full name Galimjan Muhammadjan uly Galiyev, his birth on 17 February 1857 at Keche Kaval and his death at Moscow on 6 December 1921, and details his Muhammadiya madrasa, his publishing and his muftiate."
  es: "Artículo de Wikipedia en tártaro sobre Galimjan Barudi; en él se indica su nombre completo, Galimjan Muhammadjan uly Galiyev, su nacimiento el 17 de febrero de 1857 en Keche Kaval y su muerte en Moscú el 6 de diciembre de 1921, y se detallan su madrasa Muhammadiya, sus publicaciones y su muftiato."
  fr: "Article de Wikipédia en tatar sur Galimjan Barudi; il donne son nom complet Galimjan Muhammadjan uly Galiyev, sa naissance le 17 février 1857 à Keche Kaval et sa mort à Moscou le 6 décembre 1921, et détaille sa madrasa Muhammadiya, ses publications et son muftiat."
  ur: "گالمجان بارودی پر تاتار ویکیپیڈیا مضمون؛ اس میں ان کا پورا نام گالمجان محمدجان اولی گلییف بتایا گیا ہے، ان کی پیدائش 17 فروری 1857 کو کیچے کاول میں اور ان کی وفات 6 دسمبر 1921 کو ماسکو میں ہوئی ہے، اور ان کے محمدیہ مدرسہ، اس کی اشاعت اور اس کے مفتی کی تفصیلات بتائی گئی ہیں۔"
  tr: "Tatar Wikipedia'daki Ghelimjan Baroudi hakkındaki makalede tam adı Ghilimjan Muhammad Jan Ulu Galiev olarak verilmiştir; 17 Şubat 1857'de Kakh Qawwal'da doğmuş ve 6 Aralık 1921'de Moskova'da vefat etmiştir. Düşünce okulu 'Muhammadiyah'dır ve faaliyetlerini ve müftüsünü detaylandırır."
  id: "Artikel Wikipedia Tatar tentang Ghelimjan Baroudi memberikan nama lengkapnya Ghilimjan Muhammad Jan Ulu Galiev, lahir pada 17 Februari 1857 di Kakh Qawwal, dan meninggal di Moskow pada 6 Desember 1921. Aliran pemikirannya adalah 'Muhammadiyah,' dan merinci aktivitas serta muftinya."
