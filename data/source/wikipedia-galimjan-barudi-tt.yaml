reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It agrees with the Russian article on the day dates and adds that he finished the Mir-i Arab madrasa at Bukhara, that his exile was for two years, and that he died in Moscow on his way to a sitting of the famine-relief committee. Its village name (Keche Kaval) is the Tatar form of the place Wikidata labels Keche Qawal and the Russian article Malye Kovali. It names no school for him."
