summary:
  ar: "مقالة ويكيبيديا الأردية عن سلطان شاه جهان بيكم، بيغوم بوبال؛ تُستخدم لوقائع الكيان فقط. سيرة مفصلة تستند إلى «بيغمات بھوپال» لمحمد أمين مارہروي، تروي تربيتها وإصلاحاتها وخدماتها الدينية كبناء المساجد وطباعة الكتب، وكتبها «تہذيب النسوان» و«خزينۃ اللغات»."
  en: "Urdu Wikipedia article on Sultan Shah Jahan Begum, Begum of Bhopal; used for entity facts only. A detailed biography drawing on Muhammad Amin Marahravi’s Begumat-i Bhopal, recounting her upbringing, her reforms, her religious patronage such as mosque building and book printing, and her books Tahdhib al-Niswan and Khazinat al-Lughat."
  es: "Artículo de Wikipedia en urdu sobre Sultan Shah Jahan Begum, Begum de Bhopal; utilizado únicamente para datos sobre la persona. Una biografía detallada basada en Begumat-i Bhopal de Muhammad Amin Marahravi, que relata su infancia, sus reformas, su mecenazgo religioso, como la construcción de mezquitas y la impresión de libros, y sus obras Tahdhib al-Niswan y Khazinat al-Lughat."
  fr: "Article de Wikipédia en ourdou sur la sultane Shah Jahan Begum, Bégum de Bhopal; utilisé uniquement à des fins d'information. Biographie détaillée s'appuyant sur l'ouvrage de Muhammad Amin Marahravi, Begumat-i Bhopal, relatant son éducation, ses réformes, son mécénat religieux (construction de mosquées, imprimerie de livres, etc.) et ses ouvrages Tahdhib al-Niswan et Khazinat al-Lughat."
  ur: "سلطان شاہ جہاں بیگم، بیگم آف بھوپال پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ محمد امین مرہروی کی بیگمات بھوپال پر ایک تفصیلی سوانح عمری، ان کی پرورش، ان کی اصلاحات، ان کی مذہبی سرپرستی جیسے کہ مسجد کی تعمیر اور کتابوں کی طباعت، اور ان کی کتب تہذیب النسوان اور خزینت اللوغات کا تذکرہ۔"
