label: { ar: "محاضرات تاريخ الأمم الإسلامية: الدولة الأموية — الخضري", en: "Lectures on the History of the Islamic Peoples: The Umayyad State — al-Khudari" }
summary:
  ar: "محاضرات ألقاها محمد بك الخضري على طلاب الجامعة المصرية في تاريخ الأمم الإسلامية، جُمعت في كتاب واحد، وحققها الشيخ محمد العثماني. يغطي الجزء الخاص بالدولة الأموية من معاوية بن أبي سفيان إلى مروان بن محمد."
  en: "Lectures that Muhammad Bey al-Khudari delivered to students of the Egyptian University on the history of the Islamic peoples, gathered into a single volume and edited by Shaykh Muhammad al-Uthmani. It covers the part on the Umayyad state, from Mu'awiya ibn Abi Sufyan to Marwan ibn Muhammad."
  es: "Las conferencias que Muhammad Bey al-Khudari impartió a estudiantes de la Universidad Egipcia sobre la historia de los pueblos islámicos, recopiladas en un solo volumen y editadas por el jeque Muhammad al-Uthmani, abarcan el período del Estado Omeya, desde Mu'awiya ibn Abi Sufyan hasta Marwan ibn Muhammad."
  fr: "Ce recueil rassemble en un seul volume les cours dispensés par Muhammad Bey al-Khudari aux étudiants de l'Université égyptienne sur l'histoire des peuples islamiques, édités par le cheikh Muhammad al-Uthmani. Il traite de la période omeyyade, de Mu'awiya ibn Abi Sufyan à Marwan ibn Muhammad."
  ur: "وہ لیکچر جو محمد بے الخدری نے مصری یونیورسٹی کے طلباء کو اسلامی لوگوں کی تاریخ پر دیے، ایک جلد میں جمع کیے گئے اور شیخ محمد العثمانی نے اس کی تدوین کی۔ اس میں معاویہ بن ابی سفیان سے لے کر مروان بن محمد تک اموی ریاست کے حصے کا احاطہ کیا گیا ہے۔"
  tr: "Muhammed Bey El-Hoderi'nin Mısır Üniversitesi öğrencilerine İslam uluslarının tarihi üzerine verdiği dersler, Şeyh Muhammed El-Osmani tarafından derlenen tek bir kitapta toplanmıştır. Muaviye bin Ebi Sufyan'dan Mervan ibn Muhammed'e kadar Emevi devleti bölümü kapsar."
  id: "Kuliah yang disampaikan oleh Muhammad Bey Al-Khodari kepada mahasiswa Universitas Mesir tentang sejarah bangsa-bangsa Islam, dikumpulkan dalam satu buku, disunting oleh Sheikh Muhammad Al-Uthmani. Mencakup bagian tentang negara Umayyah dari Muawiya ibn Abi Sufyan hingga Marwan ibn Muhammad."
title: "محاضرات في تاريخ الأمم الإسلامية ⁦(الدولة الأموية)⁩"
