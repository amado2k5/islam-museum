summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسن منهاج؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في ديفيس بكاليفورنيا سنة 1985 لأبوين مسلمين هنديين من عليكرة، وعمله في «ذا ديلي شو» و«باتريوت آكت»، وتصفه بأنه مسلم ذو قناعات إسلامية ليبرالية يعدّ نفسه «غير ملتزم مذهبيًا»."
  en: "English Wikipedia article on Hasan Minhaj; used for entity facts only. It records his birth in Davis, California, in 1985 to Indian Muslim parents from Aligarh, his work on The Daily Show and Patriot Act, and describes him as a Muslim with liberal Islamic beliefs who considers himself 'non-dogmatic'."
  es: "Artículo de la Wikipedia en inglés sobre Hasan Minhaj; utilizado únicamente para obtener información sobre la persona. En él se registra su nacimiento en Davis, California, en 1985, de padres musulmanes indios originarios de Aligarh, su trabajo en The Daily Show y Patriot Act, y se le describe como un musulmán con creencias islámicas liberales que se considera a sí mismo \"no dogmático\"."
  fr: "Article Wikipédia en anglais sur Hasan Minhaj; utilisé uniquement pour les informations le concernant. Il relate sa naissance à Davis, en Californie, en 1985, de parents musulmans indiens originaires d’Aligarh, son travail au Daily Show et dans le film Patriot Act, et le décrit comme un musulman aux convictions islamiques libérales qui se considère comme « non dogmatique »."
  ur: "حسن منہاج پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ڈیوس، کیلیفورنیا میں 1985 میں علی گڑھ کے ہندوستانی مسلمان والدین کے ہاں اس کی پیدائش، دی ڈیلی شو اور پیٹریاٹ ایکٹ پر ان کے کام کو ریکارڈ کیا گیا ہے، اور اسے لبرل اسلامی عقائد کے حامل مسلمان کے طور پر بیان کیا گیا ہے جو خود کو 'غیر کٹر' تصور کرتا ہے۔"
  tr: "Hassan Minhaj hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 1985 yılında California, Davis'te Alikra'dan Hintli Müslüman ebeveynlerin çocuğu olarak doğduğu belgelenmiştir ve \"The Daily Show\" ile \"Patriot Act\" programlarındaki çalışmalarında kendisini \"dini inancı olmayan\" olarak tanımlayan liberal İslami inançlara sahip bir Müslüman olarak tanımlanmıştır."
  id: "Artikel Wikipedia bahasa Inggris tentang Hassan Minhaj hanya digunakan untuk fakta entitas tersebut. Ia tercatat lahir di Davis, California pada tahun 1985 dari orang tua Muslim India dari Alikra, dan karyanya di \"The Daily Show\" dan \"Patriot Act,\" menggambarkannya sebagai Muslim dengan keyakinan Islam liberal yang menganggap dirinya \"tidak taat beragama.\""
