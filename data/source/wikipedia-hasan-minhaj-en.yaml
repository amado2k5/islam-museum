reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives his birth on 23 September 1985 in Davis, California, to Indian Muslim parents from Aligarh, Uttar Pradesh — Najme Minhaj, an organic chemist, and Seema Minhaj (née Usmani) — his schooling in Davis and his 2007 political-science degree from UC Davis. Career coverage includes The Daily Show (senior correspondent 2014–2018, the last correspondent hired by Jon Stewart), his featured speech at the 2017 White House Correspondents' Dinner, the special Homecoming King (Netflix 2017, Peabody Award), Patriot Act (2018–2020; Emmy, Peabody and two Webby Awards), his 2019 House testimony on student-loan debt, The King's Jester (2022) and Off With His Head (2024), and his YouTube talk show Hasan Minhaj Doesn't Know (2024). Two sections matter for this record's restraint: the personal-life section states 'Minhaj is a Muslim with liberal Islamic beliefs and considers himself \"non-dogmatic\"' — a self-described stance, naming no school — and the 2023 New Yorker section records, attributed, that he acknowledged many anecdotes in his specials were embellished, his 'emotional truth' defence, and his video response. It records his 2015 marriage to Beena Patel, a Hindu of Gujarati descent, and their two children."
