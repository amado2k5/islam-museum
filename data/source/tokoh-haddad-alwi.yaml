reliability_note: "An Indonesian biographical directory, used for entity facts: Haddad Alwi Assegaf, born in Jakarta on 13 March 1966; began in 1997 as a religious singer with two sholawat albums, Nur Muhammad and Ziarah Rasul; rose to fame in 1999 in collaboration with the child singer Sulis, and between 1999 and 2004 the pair released six sholawat and nasyid albums titled Cinta Rasul under Sholla Studio. The Jakarta birthplace agrees with the English Wikipedia's text against the Indonesian article's infobox (Banjarnegara); the conflict is recorded on the museum record. Read via search extract on 15 November 2026."
