  ar: "أنساب الأشراف لأحمد بن يحيى بن جابر البلاذري (ت 279هـ)، موسوعة النسب والأخبار في قريش والقبائل العربية، نسخ رقمية ممسوحة في مكتبة الحصاد المحلية أُجريت عليها قراءة آلية بآبل فيجن. وذكر فيه من جدات النبي الفواطم والعواتك: فاطمة بنت عمرو المخزومية أم عبد الله وفاطمة بنت سعد الأزدية أم قصي وعاتكة بنت مرة السلمية أم هاشم {cite:ansab-al-ashraf p. 533-534}"
  en: "Al-Baladhuri's Ansab al-Ashraf — the great genealogical-akhbari compendium of Quraysh and the Arab tribes, scanned and Apple-Vision OCR'd in the local harvest library."
