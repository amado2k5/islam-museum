summary:
  ar: "مقالة ويكيبيديا العربية عن سيد سليمان الندوي (1302–1373هـ)؛ مكتوبة استقلالًا من الأدبيات الأردية (تذكرة سليمان ومجلة الوعي الإسلامي)، يصفه مطلعها بأنه «الحنفي النقشبندي المجددي» ويعده من أبرز تلامذة أشرف علي التهانوي وخلفائه، ويعطي مولده في 23 صفر 1302هـ (22 تشرين الثاني 1884) في ديسنه؛ ويقرن متنها وفاته في كراتشي بغرة ربيع الآخر 1373هـ لكنه يطبع التاريخ الميلادي 2 تشرين الثاني 1953 خلافًا لصندوقها الذي يعطي 22 تشرين الثاني."
  en: "The Arabic Wikipedia article on Syed Sulaiman Nadvi (1302–1373 AH); independently written from Urdu biographical literature (Tazkirat Sulaiman and the journal al-Wa'i al-Islami), its lead styles him 'al-Hanafi al-Naqshbandi al-Mujaddidi' and names him among the foremost students and khulafa of Ashraf Ali Thanwi, and it gives his birth on 23 Safar 1302 AH (22 November 1884) at Desna; its body pairs his death at Karachi with 1 Rabi' al-akhir 1373 AH but prints the Gregorian date as 2 November 1953 against its own infobox's 22 November."
