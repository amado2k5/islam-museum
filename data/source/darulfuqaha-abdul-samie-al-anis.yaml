  ar: "صفحة عبد السميع الأنيس ضمن «أساتذة دار الفقهاء»؛ تصفه بأنه من علماء بلاد الشام، مولود سنة 1963، حاصل على الدكتوراه في الحديث النبوي وعلومه من بغداد، وتذكر شيخيه عبد الكريم المدرس وعبد الكريم الدبان وكتابيه «الفصل للوصل» و«المنهج العلمي لدراسة العلوم الشرعية واللغوية والعقلية»."
  en: "Abdul Samie Al-Anis's entry on the Dar al-Fuqaha teachers page; it describes him as a scholar of the Levant, born in 1963, holding a Baghdad doctorate in the Prophetic Hadith and its sciences, and names his teachers Abd al-Karim al-Mudarris and Abd al-Karim al-Dabban and his books al-Fasl lil-Wasl and al-Manhaj al-Ilmi."
