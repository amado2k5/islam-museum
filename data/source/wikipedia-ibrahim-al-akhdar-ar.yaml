summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0639\u0646 \u0627\u0644\u0642\u0627\u0631\u0626 \u0625\u0628\u0631\u0627\u0647\u064a\u0645 \u0628\u0646 \u0627\u0644\u0623\u062e\u0636\u0631 \u0627\u0644\u0642\u064a\u0645\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0628\u0627\u0644\u0645\u062f\u064a\u0646\u0629 \u0627\u0644\u0645\u0646\u0648\u0631\u0629 \u0641\u064a 1364\u0647\u0640\u060c \u0648\u062f\u0631\u0627\u0633\u062a\u0647 \u0641\u064a \u062f\u0627\u0631 \u0627\u0644\u062d\u062f\u064a\u062b \u0648\u0627\u0644\u0645\u0639\u0647\u062f \u0627\u0644\u0639\u0644\u0645\u064a\u060c \u0648\u0642\u0631\u0627\u0621\u062a\u0647 \u0639\u0644\u0649 \u062d\u0633\u0646 \u0628\u0646 \u0625\u0628\u0631\u0627\u0647\u064a\u0645 \u0627\u0644\u0634\u0627\u0639\u0631 \u0648\u0639\u0627\u0645\u0631 \u0627\u0644\u0633\u064a\u062f \u0639\u062b\u0645\u0627\u0646 \u0648\u0623\u062d\u0645\u062f \u0627\u0644\u0632\u064a\u0627\u062a \u0648\u0639\u0628\u062f \u0627\u0644\u0641\u062a\u0627\u062d \u0627\u0644\u0642\u0627\u0636\u064a\u060c \u0648\u0625\u0645\u0627\u0645\u062a\u0647 \u0641\u064a \u0627\u0644\u0645\u0633\u062c\u062f \u0627\u0644\u062d\u0631\u0627\u0645 \u062b\u0645 \u0641\u064a \u0627\u0644\u0645\u0633\u062c\u062f \u0627\u0644\u0646\u0628\u0648\u064a \u0645\u0646 1406\u0647\u0640 \u062a\u0633\u0639 \u0633\u0646\u064a\u0646\u060c \u0648\u062a\u062f\u0631\u064a\u0633\u0647 \u0641\u064a \u0627\u0644\u062c\u0627\u0645\u0639\u0629 \u0627\u0644\u0625\u0633\u0644\u0627\u0645\u064a\u0629\u060c \u0648\u0627\u0642\u062a\u0631\u0627\u062d\u0647 \u0625\u0646\u0634\u0627\u0621 \u0643\u0644\u064a\u0629 \u0627\u0644\u0642\u0631\u0622\u0646\u061b \u0648\u0645\u0631\u062c\u0639\u0647\u0627 \u0633\u064a\u0631\u062a\u0647 \u0627\u0644\u0645\u0646\u0634\u0648\u0631\u0629 \u0639\u0644\u0649 \u0645\u0648\u0642\u0639 \u0644\u0644\u0642\u0631\u0622\u0646 \u2066(\u0645\u0624\u0631\u0634\u0641\u0629 2013)\u2069."
  en: "Arabic Wikipedia article on the reciter Ibrahim ibn al-Akhdar al-Qayyim; entity facts only: birth in Medina in 1364 AH, schooling at Dar al-Hadith and the Scientific Institute, his reading with Hasan ibn Ibrahim al-Sha'ir, Amir al-Sayyid Uthman, Ahmad al-Zayyat and Abd al-Fattah al-Qadi, his imamate at the Masjid al-Haram and then at the Prophet's Mosque from 1406 AH for nine years, his teaching at the Islamic University, and his proposal of the Faculty of the Qur'an; its reference is his biography on a Qur'an website (archived 2013)."
