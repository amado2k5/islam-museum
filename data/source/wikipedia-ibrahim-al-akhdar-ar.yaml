summary:
  ar: "مقالة ويكيبيديا العربية عن القارئ إبراهيم بن الأخضر القيم؛ لوقائع الكيان فقط: مولده بالمدينة المنورة في 1364هـ، ودراسته في دار الحديث والمعهد العلمي، وقراءته على حسن بن إبراهيم الشاعر وعامر السيد عثمان وأحمد الزيات وعبد الفتاح القاضي، وإمامته في المسجد الحرام ثم في المسجد النبوي من 1406هـ تسع سنين، وتدريسه في الجامعة الإسلامية، واقتراحه إنشاء كلية القرآن؛ ومرجعها سيرته المنشورة على موقع للقرآن ⁦(مؤرشفة 2013)⁩."
  en: "Arabic Wikipedia article on the reciter Ibrahim ibn al-Akhdar al-Qayyim; entity facts only: birth in Medina in 1364 AH, schooling at Dar al-Hadith and the Scientific Institute, his reading with Hasan ibn Ibrahim al-Sha'ir, Amir al-Sayyid Uthman, Ahmad al-Zayyat and Abd al-Fattah al-Qadi, his imamate at the Masjid al-Haram and then at the Prophet's Mosque from 1406 AH for nine years, his teaching at the Islamic University, and his proposal of the Faculty of the Qur'an; its reference is his biography on a Qur'an website (archived 2013)."
