summary:
  ar: "مقالة ويكيبيديا العربية عن القارئ إبراهيم بن الأخضر القيم؛ لوقائع الكيان فقط: مولده بالمدينة المنورة في 1364هـ، ودراسته في دار الحديث والمعهد العلمي، وقراءته على حسن بن إبراهيم الشاعر وعامر السيد عثمان وأحمد الزيات وعبد الفتاح القاضي، وإمامته في المسجد الحرام ثم في المسجد النبوي من 1406هـ تسع سنين، وتدريسه في الجامعة الإسلامية، واقتراحه إنشاء كلية القرآن؛ ومرجعها سيرته المنشورة على موقع للقرآن ⁦(مؤرشفة 2013)⁩."
  en: "Arabic Wikipedia article on the reciter Ibrahim ibn al-Akhdar al-Qayyim; entity facts only: birth in Medina in 1364 AH, schooling at Dar al-Hadith and the Scientific Institute, his reading with Hasan ibn Ibrahim al-Sha'ir, Amir al-Sayyid Uthman, Ahmad al-Zayyat and Abd al-Fattah al-Qadi, his imamate at the Masjid al-Haram and then at the Prophet's Mosque from 1406 AH for nine years, his teaching at the Islamic University, and his proposal of the Faculty of the Qur'an; its reference is his biography on a Qur'an website (archived 2013)."
  es: "Artículo en la Wikipedia en árabe sobre el recitador Ibrahim ibn al-Akhdar al-Qayyim; solo datos sobre la persona: nacimiento en Medina en 1364 AH, estudios en Dar al-Hadith y el Instituto Científico, lectura con Hasan ibn Ibrahim al-Sha'ir, Amir al-Sayyid Uthman, Ahmad al-Zayyat y Abd al-Fattah al-Qadi, su imamato en la Masjid al-Haram y luego en la Mezquita del Profeta desde 1406 AH durante nueve años, su enseñanza en la Universidad Islámica y su propuesta de la Facultad del Corán; su referencia es su biografía en un sitio web del Corán (archivado en 2013)."
  fr: "Article de Wikipédia en arabe sur le récitateur Ibrahim ibn al-Akhdar al-Qayyim; faits concernant uniquement l’entité: naissance à Médine en 1364 AH, études à Dar al-Hadith et à l’Institut scientifique, ses lectures avec Hasan ibn Ibrahim al-Sha’ir, Amir al-Sayyid Uthman, Ahmad al-Zayyat et Abd al-Fattah al-Qadi, son imamat à la Masjid al-Haram puis à la Mosquée du Prophète à partir de 1406 AH pendant neuf ans, son enseignement à l’Université islamique et sa proposition de la Faculté du Coran; sa référence est sa biographie sur un site web consacré au Coran (archivée en 2013)."
  ur: "عربی ویکیپیڈیا کا مضمون قاری ابراہیم بن الاخدر القائم پر؛ ہستی کے حقائق صرف: مدینہ میں 1364 ہجری میں پیدائش، دارالحدیث اور سائنسی ادارے میں تعلیم، حسن بن ابراہیم الشعر، امیر السید عثمان، احمد الزیات اور عبد الفتاح القادی کے ساتھ ان کی پڑھائی، اس کے بعد مسجد الحرام میں ان کی امامت اور پھر مسجد الحرام میں 4۔ نو سال، اسلامی یونیورسٹی میں ان کی تدریس، اور قرآن کی فیکلٹی کی تجویز؛ اس کا حوالہ قرآن کی ویب سائٹ پر ان کی سوانح عمری ہے ⁦(آرکائیو شدہ 2013)⁩۔"
