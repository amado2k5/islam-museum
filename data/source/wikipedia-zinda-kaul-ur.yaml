  ur: "زندہ کول (1884–1965): اس کا حباکدل ایک پنڈت خاندان میں پیدا ہوا، ماسٹر جی کا نام، اس کا بھکتی سے متاثر انداز، اس کے پرمانند تراجم، اور ساہتیہ اکادمی ایوارڈ۔"
  tr: "Urduca olarak Zenda Kaul (1884–1965) hakkında ansiklopedik bir makale: Hepakadal'da Pandit ailesine doğumu, 'Masterji' unvanı, Bhakti geleneğinden etkilenen şiirleri, Bermanand çevirileri ve Sahitya Ödülü."
  id: "Sebuah artikel ensiklopedis dalam bahasa Urdu tentang Zenda Kaul (1884–1965): kelahirannya di Hepakadal dari keluarga Pandit, gelarnya 'Masterji', puisinya yang dipengaruhi oleh tradisi Bhakti, terjemahan Bermanand-nya, dan Penghargaan Sahitya."
