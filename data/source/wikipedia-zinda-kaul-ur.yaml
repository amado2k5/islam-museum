  ar: "مقال موسوعي بالأردية عن زندا كاول (1884–1965): ميلاده في هباكادال لأسرة بانديت، ولقبه «ماسترجي»، وشعره المتأثر بتقليد البهكتي، وترجماته لبرمانند، وجائزة ساهتيا."
  en: "Urdu encyclopedia article on Zinda Kaul (1884–1965): his Habbakadal birth into a Pandit family, the Masterji name, his bhakti-influenced style, his Parmanand translations, and the Sahitya Akademi Award."
  es: "Zinda Kaul (1884–1965): Su nacimiento en Habbakadal en el seno de una familia Pandit, el nombre de Masterji, su estilo influenciado por el bhakti, sus traducciones del Parmanand y el Premio Sahitya Akademi."
