  ar: "مقالة ويكيبيديا الكازاخية عن ميرجاقيب دولاتولي (25 نوفمبر 1885 – 5 أكتوبر 1935)؛ تُستخدم لوقائع الكيان فقط. يؤرّخ صندوق معلوماتها مولده بـ25 نوفمبر 1885 ووفاته بـ5 أكتوبر 1935 ويضع وفاته في معسكر سولوفكي ويذكر دينه بأنه الإسلام السنّي."
