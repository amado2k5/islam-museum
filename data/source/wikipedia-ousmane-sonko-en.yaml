  ar: "مقالة ويكيبيديا الإنجليزية عن عثمان سونكو؛ تُستخدم لوقائع الكيان فقط. تروي عمله مفتشا للضرائب وكشفه الفساد، وتأسيسه حزب باستيف (2014)، واعتقاله ومحاكمته (2021–2023)، ورئاسته بلدية زيغينشور، ثم رئاسته الوزراء (2024–2026) وإقالته ورئاسته الجمعية الوطنية منذ مايو 2026؛ وتودعه في تصنيف «مسلمي السنغال» دون أي نص عن دينه."
  en: "English Wikipedia article on Ousmane Sonko; used for entity facts only. It recounts his work as a tax inspector and whistleblower, his founding of PASTEF (2014), his arrest and trials (2021–2023), his mayoralty of Ziguinchor, his premiership (2024–2026), his dismissal and his presidency of the National Assembly from May 2026. It files him under Senegalese Muslims; its text says nothing about his religion."
