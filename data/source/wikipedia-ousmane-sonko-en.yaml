summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عثمان سونكو؛ تُستخدم لوقائع الكيان فقط. تروي عمله مفتشا للضرائب وكشفه الفساد، وتأسيسه حزب باستيف (2014)، واعتقاله ومحاكمته (2021–2023)، ورئاسته بلدية زيغينشور، ثم رئاسته الوزراء (2024–2026) وإقالته ورئاسته الجمعية الوطنية منذ مايو 2026؛ وتودعه في تصنيف «مسلمي السنغال» دون أي نص عن دينه."
  en: "English Wikipedia article on Ousmane Sonko; used for entity facts only. It recounts his work as a tax inspector and whistleblower, his founding of PASTEF (2014), his arrest and trials (2021–2023), his mayoralty of Ziguinchor, his premiership (2024–2026), his dismissal and his presidency of the National Assembly from May 2026. It files him under Senegalese Muslims; its text says nothing about his religion."
  es: "Artículo de la Wikipedia en inglés sobre Ousmane Sonko; utilizado únicamente para datos sobre la persona. Relata su labor como inspector fiscal y denunciante, la fundación de PASTEF (2014), su arresto y juicios (2021-2023), su alcaldía de Ziguinchor, su mandato como primer ministro (2024-2026), su destitución y su presidencia de la Asamblea Nacional desde mayo de 2026. Lo clasifica dentro de la categoría de musulmanes senegaleses; el texto no menciona su religión."
  fr: "Article de Wikipédia en anglais sur Ousmane Sonko; utilisé uniquement à des fins d’information sur l’entité. Il relate son parcours en tant qu’inspecteur des impôts et lanceur d’alerte, la création de PASTEF (2014), son arrestation et ses procès (2021-2023), son mandat de maire de Ziguinchor, son mandat de Premier ministre (2024-2026), sa destitution et sa présidence de l’Assemblée nationale à partir de mai 2026. Il est classé parmi les musulmans sénégalais; le texte ne mentionne pas sa religion."
