summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن وهبي خزري؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من باستيا إلى بوردو وسندرلاند وسانت إتيان ومونبلييه، وقميصه التونسي في 74 مباراة دولية وكأسَي العالم 2018 و2022، دون أي ذكر لديانته."
  en: "English Wikipedia article on Wahbi Khazri; used for entity facts only. It recounts his career from Bastia to Bordeaux, Sunderland, Saint-Étienne and Montpellier, and his 74 Tunisia caps including the 2018 and 2022 World Cups, with no mention of his religion."
  es: "Artículo de la Wikipedia en inglés sobre Wahbi Khazri; utilizado únicamente para obtener información sobre la persona. Narra su trayectoria desde Bastia hasta Burdeos, Sunderland, Saint-Étienne y Montpellier, y sus 74 partidos con la selección de Túnez, incluyendo los Mundiales de 2018 y 2022, sin mencionar su religión."
  fr: "Article de Wikipédia en anglais sur Wahbi Khazri; utilisé uniquement à des fins d’information sur l’entité. Il retrace sa carrière, de Bastia à Bordeaux, en passant par Sunderland, Saint-Étienne et Montpellier, ainsi que ses 74 sélections en équipe nationale tunisienne, dont les Coupes du monde 2018 et 2022, sans aucune mention de sa religion."
  ur: "وہبی خزری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں باسٹیا سے لے کر بورڈو، سنڈرلینڈ، سینٹ-ایٹین اور مونٹ پیلیئر تک ان کے کیریئر کا ذکر کیا گیا ہے، اور اس کے 74 تیونس کیپس بشمول 2018 اور 2022 ورلڈ کپ، ان کے مذہب کا کوئی ذکر نہیں ہے۔"
  tr: "Wahbi Khazri hakkında İngilizce Wikipedia makalesi; sadece varlığın gerçekleri için kullanılmıştır. Bastia'dan Bordeaux, Sunderland, Saint-Étienne, Montpellier'e ve Tunus formasına olan yolculuğunu, 74 uluslararası maçta ve 2018 ile 2022 Dünya Kupaları'nda anlatır, dini hakkında hiçbir bilgi verilmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Wahbi Khazri; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan perjalanannya dari Bastia ke Bordeaux, Sunderland, Saint-Étienne, Montpellier, dan jersey Tunisia dalam 74 pertandingan internasional serta Piala Dunia 2018 dan 2022, tanpa menyebutkan agamanya."
