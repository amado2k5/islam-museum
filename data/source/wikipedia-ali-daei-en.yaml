summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي دائي؛ تُستخدم لوقائع الكيان فقط. تروي أهدافه الدولية الـ108 القياسية مع إيران، ومسيرته مع برسيبوليس وبايرن ميونخ وهيرتا برلين حيث صار أول آسيوي يلعب ويسجل في دوري أبطال أوروبا، ومسيرته التدريبية، وقسمًا عن ديانته يصفه بأنه من أتباع الإسلام الشيعي مستندًا إلى صحيفة آيرش تايمز."
  en: "English Wikipedia article on Ali Daei; used for entity facts only. It recounts his record 108 international goals for Iran, his career with Persepolis, Bayern Munich and Hertha Berlin — where he became the first Asian to play and score in the UEFA Champions League — his management career, and a Religion section describing him as a follower of Shia Islam, citing The Irish Times."
  es: "Artículo de la Wikipedia en inglés sobre Ali Daei; utilizado únicamente para datos sobre la persona. Relata su récord de 108 goles internacionales con Irán, su trayectoria en el Persepolis, el Bayern de Múnich y el Hertha de Berlín —donde se convirtió en el primer asiático en jugar y marcar en la Liga de Campeones de la UEFA—, su carrera como entrenador y una sección sobre religión que lo describe como seguidor del islam chiíta, citando a The Irish Times."
  fr: "Article Wikipédia en anglais consacré à Ali Daei; utilisé uniquement à des fins d’information sur l’entité. Il relate son record de 108 buts en sélection iranienne, sa carrière au Persepolis, au Bayern Munich et au Hertha Berlin – où il est devenu le premier Asiatique à jouer et à marquer en Ligue des champions de l’UEFA –, sa carrière d’entraîneur, et une section sur la religion le décrivant comme un adepte de l’islam chiite, d’après le Irish Times."
  ur: "علی داعی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ایران کے لیے ان کے ریکارڈ 108 بین الاقوامی گولز، پرسیپولیس، بائرن میونخ اور ہیرتھا برلن کے ساتھ ان کے کیریئر کا ذکر کیا گیا ہے - جہاں وہ UEFA چیمپئنز لیگ میں کھیلنے اور اسکور کرنے والے پہلے ایشیائی بن گئے - ان کا انتظامی کیریئر، اور ایک مذہبی سیکشن جس میں اسے شیعہ اسلام کے پیروکار کے طور پر بیان کیا گیا، آئرش ٹائمز کا حوالہ دیتے ہوئے۔"
