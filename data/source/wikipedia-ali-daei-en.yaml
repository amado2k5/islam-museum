  ar: "مقالة ويكيبيديا الإنجليزية عن علي دائي؛ تُستخدم لوقائع الكيان فقط. تروي أهدافه الدولية الـ108 القياسية مع إيران، ومسيرته مع برسيبوليس وبايرن ميونخ وهيرتا برلين حيث صار أول آسيوي يلعب ويسجل في دوري أبطال أوروبا، ومسيرته التدريبية، وقسمًا عن ديانته يصفه بأنه من أتباع الإسلام الشيعي مستندًا إلى صحيفة آيرش تايمز."
  en: "English Wikipedia article on Ali Daei; used for entity facts only. It recounts his record 108 international goals for Iran, his career with Persepolis, Bayern Munich and Hertha Berlin — where he became the first Asian to play and score in the UEFA Champions League — his management career, and a Religion section describing him as a follower of Shia Islam, citing The Irish Times."
