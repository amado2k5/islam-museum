reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Daei as born on 21 March 1969 in Ardabil to an Iranian Azerbaijani family, a Sharif University metallurgy graduate; a striker for Persepolis, Al Sadd, Arminia Bielefeld, Bayern Munich and Hertha Berlin, Iran's captain from 2000 to 2006 with 148 caps and 108 goals — the world record until Cristiano Ronaldo passed it in 2021 — then a long management career including the Iran national team in 2008-09. Its Religion section states in the article's own voice: 'Daei is a follower of Shia Islam', citing The Irish Times of 7 November 2001 for the account of his refusing to hold a beer glass in a Bayern Munich advertisement. The Arabic article gives 149 caps and 109 goals; the English article's corrected figures are followed."
