summary:
  ar: "مقالة ويكيبيديا الفرنسية عن طارق ذياب؛ تُستخدم لوقائع الكيان فقط. استُشيرت لحسم خلاف تاريخ الميلاد: فهي تعطي 15 يوليو 1954 خلافًا للمقالتين الإنجليزية والعربية."
  en: "French Wikipedia article on Tarak Dhiab; used for entity facts only. It was consulted for the birth-date conflict: it gives 15 July 1954, against the English and Arabic articles' 15 January 1954."
  es: "Artículo de la Wikipedia en francés sobre Tarak Dhiab; se utilizó únicamente para obtener información sobre la persona. Se consultó para dilucidar la discrepancia en la fecha de nacimiento: indica el 15 de julio de 1954, frente al 15 de enero de 1954 que figura en los artículos en inglés y árabe."
  fr: "Article Wikipédia français sur Tarak Dhiab; utilisé uniquement pour les informations relatives à l'entité. Il a été consulté en raison de la divergence concernant la date de naissance: il indique le 15 juillet 1954, contrairement aux articles en anglais et en arabe qui mentionnent le 15 janvier 1954."
  ur: "تراک ذیاب پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ تاریخ پیدائش کے تنازعہ کے لیے اس سے مشورہ کیا گیا: یہ انگریزی اور عربی مضامین کے مقابلے میں 15 جولائی 1954 بتاتا ہے۔"
  tr: "Tarek Diab hakkında Fransızca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğum tarihi kararlaştırılması için istişare yapılmıştır: İngilizce ve Arapça makalelerin aksine, 15 Temmuz 1954 olarak belirtilmiştir."
  id: "Artikel Wikipedia Prancis tentang Tarek Diab; hanya digunakan untuk fakta entitas. Konsultasi dilakukan untuk menentukan tanggal lahir: tercantum 15 Juli 1954, berbeda dengan artikel dalam bahasa Inggris dan Arab."
