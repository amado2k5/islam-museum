reliability_note: "Reference entry read on 25 October 2026. It gives his birth on 22 June 1940 in Tehran, his early work directing advertisements and illustrating children's books, his establishment of the film division at the Institute for the Intellectual Development of Children and Young Adults, his directorial debut Bread and Alley (1970), his international recognition for the Koker trilogy (Where Is the Friend's Home?, And Life Goes On... and Through the Olive Trees), Taste of Cherry (1997) sharing the Palme d'Or at Cannes, and his death on 4 July 2016 in Paris. It names no religion or school for Kiarostami himself."
