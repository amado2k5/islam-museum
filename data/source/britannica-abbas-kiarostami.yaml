summary:
  ar: "مدخل موسوعة بريتانيكا عن عباس كيارستمي؛ يؤكد ميلاده في طهران في 22 يونيو 1940 ووفاته في باريس في 4 يوليو 2016، وتأسيسه قسم السينما في معهد تنمية الأطفال والشباب فكريًا، و«خبز وزقاق» (1970) وثلاثية كوكر والسعفة الذهبية عن «طعم الكرز» (1997). لا يسمّي المدخل أي دين له."
  en: "Encyclopaedia Britannica entry on Abbas Kiarostami; it confirms his birth in Tehran on 22 June 1940 and his death in Paris on 4 July 2016, his establishment of the film division at the Institute for the Intellectual Development of Children and Young Adults, Bread and Alley (1970), the Koker trilogy and Taste of Cherry (1997), which shared the Palme d'Or at Cannes. The entry names no religion for him."
