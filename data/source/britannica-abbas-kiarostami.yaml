summary:
  ar: "مدخل موسوعة بريتانيكا عن عباس كيارستمي؛ يؤكد ميلاده في طهران في 22 يونيو 1940 ووفاته في باريس في 4 يوليو 2016، وتأسيسه قسم السينما في معهد تنمية الأطفال والشباب فكريًا، و«خبز وزقاق» (1970) وثلاثية كوكر والسعفة الذهبية عن «طعم الكرز» (1997). لا يسمّي المدخل أي دين له."
  en: "Encyclopaedia Britannica entry on Abbas Kiarostami; it confirms his birth in Tehran on 22 June 1940 and his death in Paris on 4 July 2016, his establishment of the film division at the Institute for the Intellectual Development of Children and Young Adults, Bread and Alley (1970), the Koker trilogy and Taste of Cherry (1997), which shared the Palme d'Or at Cannes. The entry names no religion for him."
  es: "Entrada de la Enciclopedia Británica sobre Abbas Kiarostami; confirma su nacimiento en Teherán el 22 de junio de 1940 y su muerte en París el 4 de julio de 2016, la creación de la división de cine en el Instituto para el Desarrollo Intelectual de Niños y Jóvenes, Pan y callejón (1970), la trilogía de Koker y El sabor de la cereza (1997), que compartió la Palma de Oro en Cannes. La entrada no menciona ninguna religión para él."
  fr: "L'article de l'Encyclopædia Britannica consacré à Abbas Kiarostami confirme sa naissance à Téhéran le 22 juin 1940 et son décès à Paris le 4 juillet 2016, la création du département cinéma de l'Institut pour le développement intellectuel des enfants et des jeunes adultes, ainsi que ses films *Pain et ruelle* (1970), la trilogie de Koker et *Le Goût de la cerise* (1997), qui a remporté la Palme d'or à Cannes. L'article ne mentionne pas sa religion."
  ur: "عباس کیاروستامی پر انسائیکلوپیڈیا برٹانیکا کا اندراج؛ یہ 22 جون 1940 کو تہران میں ان کی پیدائش اور 4 جولائی 2016 کو پیرس میں ان کی موت کی تصدیق کرتا ہے، انسٹی ٹیوٹ فار دی انٹلیکچوئل ڈویلپمنٹ آف چلڈرن اینڈ ینگ ایڈلٹس، بریڈ اینڈ ایلی (1970) میں ان کے فلم ڈویژن کا قیام، کوکر ٹرائیلوجی اینڈ ٹسٹ آف چیری (1997)، جس نے کین او پالمے میں اشتراک کیا۔ اندراج میں اس کے لیے کسی مذہب کا نام نہیں ہے۔"
