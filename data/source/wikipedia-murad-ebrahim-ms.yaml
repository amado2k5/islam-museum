summary:
  ar: "مقالة ويكيبيديا الملايوية عن مراد إبراهيم؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 15 مايو 1948 — وهي قراءة السنة المختلفة المحفوظة في ملحوظة الولادة."
  en: "Malay Wikipedia article on Murad Ebrahim; used for entity facts only. Its lead gives his birth as 15 May 1948 — the variant year reading preserved in the birth note of the person record."
  es: "Artículo de Wikipedia en malayo sobre Murad Ebrahim; utilizado únicamente para datos sobre la persona. Su introducción indica que nació el 15 de mayo de 1948, fecha que coincide con la que figura en el acta de nacimiento del registro de la persona."
  fr: "Article Wikipédia en malais sur Murad Ebrahim; utilisé uniquement pour les informations relatives à l’entité. Son introduction indique sa date de naissance: le 15 mai 1948 — une variante figurant dans la note de naissance de sa fiche de personne."
  ur: "مراد ابراہیم پر مالائی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا سیسہ اس کی پیدائش 15 مئی 1948 کے طور پر کرتا ہے - اس شخص کے ریکارڈ کے پیدائشی نوٹ میں مختلف سال پڑھنے کو محفوظ کیا گیا ہے۔"
  tr: "Murad İbrahim hakkında Malayca Vikipedi makalesi; sadece varlık bilgileri için kullanılmıştır. 15 Mayıs 1948 doğumlu olarak belirtilmiştir — bu, doğum notunda korunan farklı yılın okumasıdır."
  id: "Artikel Wikipedia Bahasa Melayu tentang Murad Ibrahim; digunakan hanya untuk fakta entitas. Ia disebutkan lahir pada 15 Mei 1948 — yang merupakan bacaan tahun berbeda yang tersimpan dalam catatan kelahiran."
