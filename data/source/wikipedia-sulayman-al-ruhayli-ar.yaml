summary:
  ar: "مقالة ويكيبيديا العربية عن سليمان بن سليم الله الرحيلي، كما قُرئت في 25 أكتوبر 2026؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها طائفته «أهل السنة والجماعة» ومذهبه الفقهي «حنبلي» وعقيدته «أثرية» وميلاده في رجب 1386هـ بالمدينة المنورة."
  en: "Arabic Wikipedia article on Sulayman bin Salimullah al-Ruhayli, read on 25 October 2026; used for entity facts only. Its infobox gives his denomination as Ahl al-Sunna wa'l-Jama'a (Sunni), his jurisprudence as Hanbali, his creed as Athari, and his birth as Rajab 1386 AH in Madinah."
  es: "Artículo de Wikipedia en árabe sobre Sulaiman bin Salimullah al-Ruhayli, consultado el 25 de octubre de 2026; utilizado únicamente para obtener información sobre la persona. Su ficha informativa indica que pertenecía a la corriente Ahl al-Sunna wa'l-Jama'a (Suní), su jurisprudencia era Hanbali, su credo era Athari y nació en Rajab de 1386 AH en Medina."
  fr: "Article de Wikipédia en arabe sur Sulaiman bin Salimullah al-Ruhayli, consulté le 25 octobre 2026; utilisé uniquement pour les informations sur l'entité. Son infobox indique qu'il appartenait à l'Ahl al-Sunna wa'l-Jama'a (sunnite), qu'il était de l'école hanbalite, de la religion athari et qu'il était né en Rajab 1386 AH à Médine."
  ur: "سلیمان بن سلیم اللہ الروحیلی پر عربی ویکیپیڈیا کا مضمون، 25 اکتوبر 2026 کو پڑھا گیا؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی خانہ ان کا فرقہ اہل السنۃ والجماعۃ ⁦(سنی)⁩، ان کا فقہ حنبلی، عقیدہ اطہری، اور مدینہ منورہ میں رجب 1386 ہجری کو ان کی پیدائش دیتا ہے۔"
