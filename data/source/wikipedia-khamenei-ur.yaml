summary:
  ar: "مقالة ويكيبيديا الأردية عن علي خامنئي؛ تُستخدم لوقائع الكيان فقط. تقدّمه في مطلعها بصيغة الماضي عالمَ دين شيعيًا وسياسيًا إيرانيًا كان مرشد إيران الأعلى من 1989 إلى 2026، وتذكر أنه كان يُعدّ من أبرز مراجع الشيعة في العالم، وتروي دراسته في مشهد وقم ونشاطه ضد نظام بهلوي."
  en: "Urdu Wikipedia article on Ali Khamenei; used for entity facts only. Its lead, in the past tense, presents him as an Iranian Shia cleric and politician who was Iran's supreme leader from 1989 to 2026 and was counted among the world's prominent Shia marja's; it recounts his studies at Mashhad and Qom and his activism against the Pahlavi regime."
  es: "Artículo de Wikipedia en urdu sobre Ali Khamenei; utilizado únicamente para datos sobre la persona. Su introducción, en tiempo pasado, lo presenta como un clérigo y político chiíta iraní que fue líder supremo de Irán desde 1989 hasta 2026 y fue considerado uno de los marjas chiítas más prominentes del mundo; relata sus estudios en Mashhad y Qom y su activismo contra el régimen Pahlavi."
  fr: "Article de Wikipédia en ourdou sur Ali Khamenei; utilisé uniquement à des fins d'information sur l'entité. Son introduction, au passé, le présente comme un religieux et homme politique chiite iranien qui fut le guide suprême de l'Iran de 1989 à 2026 et considéré comme l'un des plus éminents marjas chiites au monde; elle relate ses études à Mashhad et Qom ainsi que son activisme contre le régime Pahlavi."
  ur: "علی خامنہ ای پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ماضی کے دور میں اس کی قیادت اسے ایک ایرانی شیعہ عالم اور سیاست دان کے طور پر پیش کرتی ہے جو 1989 سے 2026 تک ایران کے سپریم لیڈر تھے اور ان کا شمار دنیا کے ممتاز شیعہ مرجع میں ہوتا تھا۔ اس میں مشہد اور قم میں ان کی تعلیم اور پہلوی حکومت کے خلاف ان کی سرگرمی کا ذکر ہے۔"
  tr: "Ali Hamaney hakkında Urduca Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Makale, geçmiş zaman biçimiyle başlar: 1989'dan 2026'ya kadar İran'ın Yüksek Lideri olan İranlı Şii din adamı ve politikacı. Makalede, dünyanın en önde gelen Şii otoritelerinden biri olarak kabul edildiği belirtilir ve Meşhed ile Kum'daki çalışmaları ile Pehlevi rejimine karşı faaliyetlerini anlatır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Ali Khamenei hanya digunakan untuk fakta entitas tersebut. Artikel ini dimulai dengan bentuk waktu lampau: seorang ulama dan politisi Syiah Iran yang menjabat sebagai Pemimpin Tertinggi Iran dari tahun 1989 hingga 2026. Artikel tersebut menyebutkan bahwa ia dianggap sebagai salah satu otoritas Syiah paling terkemuka di dunia, dan menceritakan studinya di Mashhad dan Qom serta aktivitasnya melawan rezim Pahlavi."
