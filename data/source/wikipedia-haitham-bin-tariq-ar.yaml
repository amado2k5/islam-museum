summary:
  ar: "مقالة ويكيبيديا العربية عن هيثم بن طارق؛ تُستخدم لوقائع الكيان فقط. تتناول نشأته في مسقط ودراسته في بريطانيا ومناصبه في الخارجية والتراث والثقافة وجلوسه على عرش عُمان في يناير 2020 خلفًا لابن عمه قابوس بن سعيد وأبرز قرارات عهده الأولى."
  en: "Arabic Wikipedia article on Haitham bin Tariq; used for entity facts only. It covers his upbringing in Muscat, his studies in Britain, his Foreign Ministry and heritage-and-culture posts, his accession to the throne of Oman in January 2020 in succession to his cousin Qaboos bin Said, and the main decisions of his first years. It makes no statement of his religion anywhere — no infobox field and no text names a school for him."
  es: "Artículo de Wikipedia en árabe sobre Haitham bin Tariq; se utiliza únicamente para datos biográficos. Abarca su infancia en Mascate, sus estudios en Gran Bretaña, sus cargos en el Ministerio de Asuntos Exteriores y en el ámbito del patrimonio y la cultura, su ascenso al trono de Omán en enero de 2020 en sucesión de su primo Qaboos bin Said, y las principales decisiones de sus primeros años. No menciona su religión en ningún momento: ni en el recuadro informativo ni en el texto se indica a qué escuela asistió."
  fr: "Article Wikipédia en arabe sur Haitham bin Tariq; utilisé uniquement à titre informatif. Il relate son enfance à Mascate, ses études en Grande-Bretagne, ses fonctions au ministère des Affaires étrangères et au ministère du Patrimoine et de la Culture, son accession au trône d’Oman en janvier 2020, succédant à son cousin Qabous bin Saïd, et les principales décisions prises durant ses premières années. Aucune mention de sa religion n’y est faite: ni infobox, ni mention d’un établissement scolaire à son nom."
  ur: "ہیثم بن طارق پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں مسقط میں اس کی پرورش، برطانیہ میں اس کی تعلیم، اس کی وزارت خارجہ اور ثقافتی ورثہ کے عہدوں، جنوری 2020 میں اس کے کزن قابوس بن سعید کے بعد عمان کے تخت پر ان کا الحاق، اور اس کے پہلے سالوں کے اہم فیصلوں کا احاطہ کیا گیا ہے۔ اس میں کہیں بھی اس کے مذہب کا کوئی بیان نہیں ہے - کوئی انفو باکس فیلڈ اور کوئی متن اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Haitham bin Tariq hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Makale, Muskat'taki yetiştirilme tarzını, Britanya'daki eğitimlerini, dış ilişkiler, miras, kültür alanındaki pozisyonlarını ve Ocak 2020'de kuzeni Kabus bin Said'in yerine Umman tahtına çıkışını ve erken saltanatının en önemli kararlarını kapsar."
  id: "Artikel Wikipedia Arab tentang Haitham bin Tariq; hanya digunakan untuk fakta entitas. Artikel ini mencakup masa kecilnya di Muscat, studinya di Inggris, posisinya dalam urusan luar negeri, warisan, budaya, dan naiknya ke tahta Oman pada Januari 2020, menggantikan sepupunya Qaboos bin Said, serta keputusan paling menonjol pada masa awal pemerintahannya."
