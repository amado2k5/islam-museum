  ar: "مقالة ويكيبيديا العربية عن هيثم بن طارق؛ تُستخدم لوقائع الكيان فقط. تتناول نشأته في مسقط ودراسته في بريطانيا ومناصبه في الخارجية والتراث والثقافة وجلوسه على عرش عُمان في يناير 2020 خلفًا لابن عمه قابوس بن سعيد وأبرز قرارات عهده الأولى."
  en: "Arabic Wikipedia article on Haitham bin Tariq; used for entity facts only. It covers his upbringing in Muscat, his studies in Britain, his Foreign Ministry and heritage-and-culture posts, his accession to the throne of Oman in January 2020 in succession to his cousin Qaboos bin Said, and the main decisions of his first years. It makes no statement of his religion anywhere — no infobox field and no text names a school for him."
