summary:
  ar: "مقالة ويكيبيديا الإندونيسية المفصلة عن سري مولياني إندراواتي، المولودة في تانجونغ كارانغ في 26 آب 1962، الابنة السابعة للأستاذ الجامعي ساتموكو؛ تذكر مسيرتها الأكاديمية ووزاراتها المتكررة للمالية وإصلاحاتها الضريبية وبرنامج العفو الضريبي وجوائزها الدولية."
  en: "Detailed Indonesian Wikipedia article on Sri Mulyani Indrawati, born in Tanjung Karang on 26 August 1962, seventh child of the lecturer Professor Satmoko; it records her academic career, her repeated finance ministries, her tax reforms and amnesty programme, and her international awards."
  es: "Artículo detallado de la Wikipedia en indonesio sobre Sri Mulyani Indrawati, nacida en Tanjung Karang el 26 de agosto de 1962, séptima hija del profesor Satmoko; en él se recoge su trayectoria académica, sus repetidos cargos como ministra de finanzas, sus reformas fiscales y su programa de amnistía, así como sus premios internacionales."
  fr: "Article détaillé de Wikipédia indonésien sur Sri Mulyani Indrawati, née à Tanjung Karang le 26 août 1962, septième enfant du professeur Satmoko; il retrace sa carrière universitaire, ses multiples mandats au ministère des Finances, ses réformes fiscales et son programme d'amnistie, ainsi que ses récompenses internationales."
  ur: "سری مولانی اندراوتی پر تفصیلی انڈونیشین ویکیپیڈیا مضمون، 26 اگست 1962 کو تنجنگ کارنگ میں پیدا ہوئی، لیکچرر پروفیسر ستموکو کی ساتویں اولاد؛ اس میں اس کے تعلیمی کیریئر، اس کی بار بار مالیاتی وزارتیں، اس کی ٹیکس اصلاحات اور ایمنسٹی پروگرام، اور اس کے بین الاقوامی ایوارڈز کو ریکارڈ کیا گیا ہے۔"
  tr: "26 Ağustos 1962'de Tanjung Karang'da doğan ve üniversite profesörü Satmoku'nun yedinci kızı olan Sri Mulyani Indrawati hakkında ayrıntılı Endonezya Vikipedi makalesi, akademik kariyeri, sık sık yaptığı maliye bakanlıkları, vergi reformları, vergi af programı ve uluslararası ödüllerinden bahsetmektedir."
  id: "Artikel rinci di Wikipedia Indonesia tentang Sri Mulyani Indrawati, lahir di Tanjung Karang pada 26 Agustus 1962, putri ketujuh profesor universitas Satmoku, menyebutkan karier akademisnya, sering bekerja di kementerian keuangan, reformasi pajak, program amnesti pajak, dan penghargaan internasionalnya."
