summary:
  ar: "الموقع الرسمي للداعية؛ تذكر سيرته فيه أنه خريج الجامعة الإسلامية بالمدينة المنورة، متخصص في القراءات، ويدرّس التفسير حاليا في الكلية الإسلامية في أستراليا."
  en: "The preacher's official website; its biography states that he is a graduate of the Islamic University of Madinah, specialises in Qur'aat (Qur'anic recitation modes) and currently teaches tafsir at the Islamic College of Australia."
  es: "En la página web oficial del predicador, su biografía indica que es graduado de la Universidad Islámica de Medina, se especializa en Qur'aat (modos de recitación coránica) y actualmente enseña tafsir en el Colegio Islámico de Australia."
  fr: "Le site web officiel du prédicateur; sa biographie indique qu'il est diplômé de l'Université islamique de Médine, spécialisé dans le Qur'aat (modes de récitation coranique) et qu'il enseigne actuellement le tafsir au Collège islamique d'Australie."
  ur: "مبلغ کی سرکاری ویب سائٹ؛ اس کی سوانح عمری میں بتایا گیا ہے کہ وہ مدینہ کی اسلامی یونیورسٹی سے فارغ التحصیل ہیں، قرات میں مہارت رکھتے ہیں اور اس وقت آسٹریلیا کے اسلامک کالج میں تفسیر پڑھاتے ہیں۔"
  tr: "Vaizin resmi web sitesinde; Medine'deki İslam Üniversitesi mezunu olduğu, Kur'an okumalarında uzmanlaştığı ve şu anda Avustralya'daki İslami Koleji'nde Tafsir öğrettiği belirtilmektedir."
  id: "Situs resmi pengkhotbah; disebutkan bahwa ia adalah lulusan Universitas Islam di Madinah, mengkhususkan diri dalam pembacaan Al-Qur'an, dan saat ini mengajar Tafsir di Islamic College di Australia."
