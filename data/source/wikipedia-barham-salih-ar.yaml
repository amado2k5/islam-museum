summary:
  ar: "مقالة ويكيبيديا العربية عن برهم صالح؛ تُستخدم لوقائع الكيان فقط. يعطي متنها ولادته في 8 أيلول 1960 بينما يعطي صندوق معلوماتها 12 أيلول 1960، وتسمّي سلفه فؤاد معصوم وخلفه عبد اللطيف رشيد، وتصنّفه ضمن «مسلمون أكراد» و«مسلمون سنة عراقيون» وهما تصنيفا ملفات لا شهادتان نصيتان."
  en: "Arabic Wikipedia article on Barham Salih; used for entity facts only. Its lead gives his birth on 8 September 1960 while its infobox gives 12 September 1960; it names Fuad Masum as his predecessor and Abdul Latif Rashid as his successor. It files him under 'Kurdish Muslims' and 'Iraqi Sunni Muslims', category filings, not textual attestations, and names no school in its text."
  es: "Artículo de Wikipedia en árabe sobre Barham Salih; utilizado únicamente para datos sobre la persona. Su introducción indica que nació el 8 de septiembre de 1960, mientras que su ficha informativa indica el 12 de septiembre de 1960; menciona a Fuad Masum como su predecesor y a Abdul Latif Rashid como su sucesor. Lo clasifica dentro de las categorías de «musulmanes kurdos» y «musulmanes sunitas iraquíes», no mediante referencias textuales, y no menciona ninguna escuela en su texto."
  fr: "Article Wikipédia en arabe sur Barham Salih; utilisé uniquement pour les informations sur l'entité. Son introduction indique sa naissance le 8 septembre 1960, tandis que son infobox mentionne le 12 septembre 1960; il cite Fuad Masum comme son prédécesseur et Abdul Latif Rashid comme son successeur. Il le classe dans les catégories « Musulmans kurdes » et « Musulmans sunnites irakiens », des classifications basées sur des informations textuelles et non sur des attestations textuelles, et ne mentionne aucune école dans son texte."
  ur: "برہم صالح پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ اس کی پیدائش 8 ستمبر 1960 کو کرتا ہے جبکہ اس کا انفو باکس 12 ستمبر 1960 کو دیتا ہے۔ اس میں فواد معصوم کو اپنے پیشرو اور عبداللطیف راشد کو ان کا جانشین نامزد کیا گیا ہے۔ یہ اسے 'کرد مسلمان' اور 'عراقی سنی مسلمان' کے تحت فائل کرتا ہے، زمرہ بندی، متنی تصدیقات نہیں، اور اس کے متن میں کسی اسکول کا نام نہیں ہے۔"
  tr: "Barham Salih hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Metinde doğum tarihi 8 Eylül 1960 olarak verilirken, bilgi kutusu 12 Eylül 1960 olarak belirtilmiştir. Selefi Fouad Masum ve halefi Abdul Latif Rashid'in adını vermiş ve onu \"Kürt Müslümanları\" ve \"Iraklı Sünni Müslümanlar\" olarak sınıflandırmaktadır; bunlar dosya sınıflandırmasıdır, metinsel tanıklık değildir."
  id: "Artikel Wikipedia berbahasa Arab tentang Barham Salih hanya digunakan untuk fakta entitas tersebut. Teksnya mencantumkan tanggal lahirnya sebagai 8 September 1960, sementara infobox mencantumkan 12 September 1960. Artikel tersebut menamai pendahulunya Fouad Masum dan penerusnya Abdul Latif Rashid, serta mengklasifikasikannya sebagai \"Muslim Kurdi\" dan \"Muslim Sunni Irak,\" yang merupakan klasifikasi file, bukan kesaksian teks."
