  ar: "مقالة ويكيبيديا العربية عن برهم صالح؛ تُستخدم لوقائع الكيان فقط. يعطي متنها ولادته في 8 أيلول 1960 بينما يعطي صندوق معلوماتها 12 أيلول 1960، وتسمّي سلفه فؤاد معصوم وخلفه عبد اللطيف رشيد، وتصنّفه ضمن «مسلمون أكراد» و«مسلمون سنة عراقيون» وهما تصنيفا ملفات لا شهادتان نصيتان."
  en: "Arabic Wikipedia article on Barham Salih; used for entity facts only. Its lead gives his birth on 8 September 1960 while its infobox gives 12 September 1960; it names Fuad Masum as his predecessor and Abdul Latif Rashid as his successor. It files him under 'Kurdish Muslims' and 'Iraqi Sunni Muslims', category filings, not textual attestations, and names no school in its text."
