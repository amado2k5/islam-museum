  en: "Urdu Wikipedia biographical article on Muhammad Ilyas Ghumman, read on 5 November 2026. Its opening prose describes him as a Deobandi Hanafi scholar, debater, preacher and Shaykh al-Hadith; it gives his birth as 12 April 1969 at Chak 87 Janubi, Sargodha district, and lists his posts: Shaykh al-Hadith and administrator of Markaz Ahle Sunnat wal Jamaat Sargodha, amir of Aalmi Ittihad Ahle Sunnat wal Jamaat, and chief executive of Ahnaf Media Services."
