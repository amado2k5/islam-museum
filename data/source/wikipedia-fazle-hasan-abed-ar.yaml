summary:
  ar: "مقالة ويكيبيديا العربية عن فضل حسن عابد؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 27 أبريل 1936 وتأسيسه منظمة براك سنة 1972 وجائزة وايز للتعليم سنة 2011، ولا يرد في نصها أي محتوى عن دينه؛ أما نسبة «مسلمون بنغاليون» فتصنيف ملفي فقط."
  en: "Arabic Wikipedia article on Fazle Hasan Abed; used for entity facts only. It gives his birth as 27 April 1936 and covers his founding of BRAC in 1972 and the 2011 WISE Prize for Education; its text contains no religion content, and the 'Bengali Muslims' attribution appears only as a category filing."
  es: "Artículo en árabe de la Wikipedia sobre Fazle Hasan Abed; se utiliza únicamente para obtener información sobre la persona. Indica que nació el 27 de abril de 1936 y abarca la fundación de BRAC en 1972 y el Premio WISE de Educación de 2011; su texto no contiene contenido religioso, y la atribución a los «musulmanes bengalíes» aparece solo como una categoría."
  fr: "Article Wikipédia en arabe sur Fazle Hasan Abed; utilisé uniquement à des fins d’information sur l’entité. Il indique sa date de naissance: le 27 avril 1936. Il mentionne la fondation de BRAC en 1972 et l’obtention du prix WISE pour l’éducation en 2011. Son texte ne contient aucun élément religieux, et la mention « Musulmans bengalis » n’apparaît que dans le cadre d’un classement par catégorie."
  ur: "فضل حسن عابد پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 27 اپریل 1936 ہے اور 1972 میں ان کی BRAC کی بنیاد اور 2011 WISE پرائز برائے تعلیم کا احاطہ کرتا ہے۔ اس کے متن میں کوئی مذہب کا مواد نہیں ہے، اور 'بنگالی مسلمان' انتساب صرف زمرہ بندی کے طور پر ظاہر ہوتا ہے۔"
  tr: "Fadl Hassan Abed hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Makalede 27 Nisan 1936'da doğum, 1972'de Brac örgütünün kuruluşu ve 2011'de WISE Eğitim Ödülü yer alır ve dini hakkında herhangi bir içerik içermez; \"Bengal Müslümanları\" kategorisi ise sadece bir dosya sınıflandırmasıdır."
  id: "Artikel Wikipedia berbahasa Arab tentang Fadl Hassan Abed; digunakan hanya untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya pada 27 April 1936, pendirian organisasi Brac pada tahun 1972, dan Penghargaan WISE untuk Pendidikan pada tahun 2011, dan tidak memuat konten tentang agamanya; sedangkan untuk kategori \"Muslim Bengali,\" hanya merupakan klasifikasi file."
