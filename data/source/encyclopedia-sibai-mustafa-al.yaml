  ar: "مدخل «السباعي، مصطفى» في موسوعة أكسفورد للعالم الإسلامي ⁦(مُعاد نشره على Encyclopedia.com)⁩: مؤسس جمعية الإخوان المسلمين في سوريا، وُلد في حمص سنة 1915، ودرس في الأزهر من 1933، ونال الدكتوراه سنة 1949 بأطروحة «مكانة السنة في التشريع»، وحرّر مجلات المنار والمسلمين وحضارة الإسلام، وكان عالمًا معروفًا في الفقه والسنة."
  en: "Entry 'Siba'i, Mustafa al- (1915–1964)' in the Oxford Encyclopedia of the Islamic World, republished at Encyclopedia.com: the founder of the Society of the Muslim Brothers of Syria; born in Homs in 1915; studied at al-Azhar from 1933; doctorate in 1949 with the dissertation 'The Position of Sunna in Legislation'; charged with subversion by the British in 1934 and 1940 and deported to Palestine; editor of al-Manar, al-Muslimin and Hadarat al-Islam; 'a noted author and scholar of fiqh and sunna'."
