summary:
  ar: "مدخل «السباعي، مصطفى» في موسوعة أكسفورد للعالم الإسلامي ⁦(مُعاد نشره على Encyclopedia.com)⁩: مؤسس جمعية الإخوان المسلمين في سوريا، وُلد في حمص سنة 1915، ودرس في الأزهر من 1933، ونال الدكتوراه سنة 1949 بأطروحة «مكانة السنة في التشريع»، وحرّر مجلات المنار والمسلمين وحضارة الإسلام، وكان عالمًا معروفًا في الفقه والسنة."
  en: "Entry 'Siba'i, Mustafa al- (1915–1964)' in the Oxford Encyclopedia of the Islamic World, republished at Encyclopedia.com: the founder of the Society of the Muslim Brothers of Syria; born in Homs in 1915; studied at al-Azhar from 1933; doctorate in 1949 with the dissertation 'The Position of Sunna in Legislation'; charged with subversion by the British in 1934 and 1940 and deported to Palestine; editor of al-Manar, al-Muslimin and Hadarat al-Islam; 'a noted author and scholar of fiqh and sunna'."
  es: "Entrada 'Siba'i, Mustafa al- (1915–1964)' en la Oxford Encyclopedia of the Islamic World, republicada en Encyclopedia.com: fundador de la Sociedad de los Hermanos Musulmanes de Siria; nacido en Homs en 1915; estudió en al-Azhar desde 1933; doctorado en 1949 con la disertación 'La posición de la Sunna en la legislación'; acusado de subversión por los británicos en 1934 y 1940 y deportado a Palestina; editor de al-Manar, al-Muslimin y Hadarat al-Islam; 'un autor y erudito destacado en fiqh y sunna'."
  fr: "Article « Siba'i, Mustafa al- (1915–1964) » dans l'Oxford Encyclopedia of the Islamic World, republié sur Encyclopedia.com: fondateur de la Société des Frères musulmans de Syrie; né à Homs en 1915; études à al-Azhar à partir de 1933; doctorat en 1949 avec une thèse intitulée « La place de la Sunna dans la législation »; accusé de subversion par les Britanniques en 1934 et 1940 et déporté en Palestine; rédacteur en chef d'al-Manar, d'al-Muslimin et d'Hadarat al-Islam; « auteur et érudit renommé en matière de fiqh et de sunna »."
  ur: "اسلامی دنیا کے آکسفورڈ انسائیکلو پیڈیا میں 'سبائی، مصطفیٰ ال- (1915-1964)' کا اندراج، Encyclopedia.com پر دوبارہ شائع ہوا: سوسائٹی آف مسلم برادرز آف شام کے بانی؛ 1915 میں حمص میں پیدا ہوئے۔ 1933 سے الازہر میں تعلیم حاصل کی۔ 1949 میں مقالہ 'قانون سازی میں سنت کی پوزیشن' کے ساتھ ڈاکٹریٹ؛ 1934 اور 1940 میں انگریزوں کی طرف سے بغاوت کا الزام لگایا گیا اور فلسطین جلاوطن کر دیا گیا۔ المنار، المسلمین اور حدارۃ الاسلام کے مدیر؛ 'ایک مشہور مصنف اور فقہ و سنت کے عالم'۔"
