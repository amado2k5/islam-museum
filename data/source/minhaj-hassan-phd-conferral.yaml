summary:
  ar: "تقرير منهاج القرآن عن منح جامعة الدول العربية درجة الدكتوراه بامتياز لحسن محي الدين قادري، الابن الأكبر لمحمد طاهر القادري، عن أطروحته في دستور المدينة."
  en: "Minhaj-ul-Quran's report that Arab League University awarded Hassan Mohi-ud-Din Qadri, elder son of Shaykh-ul-Islam Dr Muhammad Tahir-ul-Qadri, a PhD with distinction for his thesis on the Constitution of Madina."
  es: "Informe de Minhaj-ul-Quran de que la Universidad de la Liga Árabe otorgó a Hassan Mohi-ud-Din Qadri, hijo mayor del Shaykh-ul-Islam Dr. Muhammad Tahir-ul-Qadri, un doctorado con distinción por su tesis sobre la Constitución de Medina."
  fr: "Le rapport du Minhaj-ul-Quran selon lequel l'Université de la Ligue arabe a décerné à Hassan Mohi-ud-Din Qadri, fils aîné du Dr Muhammad Tahir-ul-Qadri, un doctorat avec distinction pour sa thèse sur la Constitution de Médine."
  ur: "منہاج القرآن کی رپورٹ کے مطابق عرب لیگ یونیورسٹی نے شیخ الاسلام ڈاکٹر محمد طاہرالقادری کے بڑے صاحبزادے حسن محی الدین قادری کو آئین مدینہ پر ان کے مقالے کے لیے امتیازی پی ایچ ڈی سے نوازا ہے۔"
