reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). Read in full on 4 November 2026. It is a short article, little revised in recent years, and is used for the facts it states plainly: birth on 12 June 1976 in Mitrovica, the Alauddin madrassa in Pristina, Arabic study in Amman (where it says he met Muhammad Nasiruddin al-Albani), hadith studies at the Islamic University of Medina, postgraduate studies in usul al-din at the American Open University in Cairo completed in 2006, former service in the Kosovo Liberation Army, the imamate of the Isa Beg Mosque in Mitrovica, the chief editorship of Peace TV Shqip, his books ('Ta njohim Allahun', 3 vols.; 'Harta e Kthimit tek Allahu'; 'Ndikimi i Kuranit'; 'Myzhde Agu') and his lecture series. No statement of a school for the man himself appears in it; the subjects of his lecture series are teaching topics, not attestations. The revision-id endpoint was not read in this session, so no revision id is recorded; the access date stands in its place."
