  ar: "مقالة ويكيبيديا العربية عن أبي يعقوب يوسف الناصر؛ تُستخدم لوقائع الكيان فقط. توثّق أنه ابن السلطان أبي يوسف يعقوب بن عبد الحق الملقب بالمنصور وخليفته، وغزواته في الأندلس، ومقتله في ذي القعدة سنة 706هـ بمؤامرة من الخصيان."
  en: "Arabic Wikipedia article on Abu Yaqub Yusuf an-Nasr; used for entity facts only. It documents that he was the son and successor of Sultan Abu Yusuf Yaqub ibn Abd al-Haqq, called al-Mansur, his campaigns in al-Andalus, and his killing in Dhu al-Qa'da 706 AH in a eunuchs' conspiracy."
