summary:
  ar: "مقالة ويكيبيديا الأردية عن حيدر العبادي؛ تُستخدم لوقائع الكيان فقط. تعطي سنة ولادته 1952 فقط استنادًا إلى ملف في الغارديان، ويعطي صندوقها حقل دين هو «شیعہ اسلام»، وهو حقل صندوق واحد من الأسرة نفسها."
  en: "Urdu Wikipedia article on Haider al-Abadi; used for entity facts only. It gives only his birth year 1952, citing a Guardian profile; its infobox religion field reads 'Shia Islam' — one infobox field of the same family as the Arabic one — and it files him under 'Iraqi Shia'."
  es: "Artículo de Wikipedia en urdu sobre Haider al-Abadi; utilizado únicamente para datos sobre la persona. Solo indica su año de nacimiento, 1952, citando un perfil de The Guardian; el campo de religión de su ficha informativa dice \"Islam chiíta\" —un campo de la misma familia que el árabe— y lo clasifica como \"chiíta iraquí\"."
  fr: "L'article de Wikipédia en ourdou sur Haider al-Abadi, utilisé uniquement pour les informations le concernant, mentionne seulement son année de naissance (1952), d'après un profil du Guardian. Son infobox « Religion » indique « Islam chiite » (une infobox de la même famille que celle en arabe) et le classe dans la catégorie « Chiite irakien »."
