summary:
  ar: "صفحة معهد المغرب عن مدرّسه عبد الناصر جانغدا: حفظه القرآن في أقل من سنة بدءاً من العاشرة، وتخرّجه في برنامج جامعة بنورية ذي السنوات السبع سنة 2002، وتدريسه العربية في جامعة تكساس في أرلينغتون 2005-2007، وإمامته في مسجد كوليفيل، وتأسيسه معهد قلم الشرعي."
  en: "AlMaghrib Institute's instructor biography of Abdul Nasir Jangda: memorised the Qur'an in under a year from the age of ten, graduated Jamia Binoria's seven-year programme in 2002, taught Arabic at the University of Texas at Arlington 2005-2007, served as imam at Colleyville Masjid, and founded Qalam Seminary."
  es: "Biografía del instructor Abdul Nasir Jangda del Instituto AlMaghrib: memorizó el Corán en menos de un año desde los diez años, se graduó del programa de siete años de Jamia Binoria en 2002, enseñó árabe en la Universidad de Texas en Arlington de 2005 a 2007, fue imán en la mezquita de Colleyville y fundó el Seminario Qalam."
  fr: "Biographie d'Abdul Nasir Jangda, instructeur à l'Institut AlMaghrib: a mémorisé le Coran en moins d'un an à partir de l'âge de dix ans, a obtenu son diplôme du programme de sept ans de Jamia Binoria en 2002, a enseigné l'arabe à l'Université du Texas à Arlington de 2005 à 2007, a été imam à la mosquée de Colleyville et a fondé le séminaire Qalam."
  ur: "المغرب انسٹی ٹیوٹ کے انسٹرکٹر کی سوانح عمری عبدالناصر جنگدہ: دس سال سے کم عمر میں قرآن حفظ کیا، 2002 میں جامعہ بنوریہ کے سات سالہ پروگرام سے فارغ التحصیل ہوئے، 2005-2007 میں آرلنگٹن یونیورسٹی آف ٹیکساس میں عربی پڑھائی، کلیم میں امام کے طور پر خدمات انجام دیں۔"
