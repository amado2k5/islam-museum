  ar: "صفحة معهد المغرب عن مدرّسه عبد الناصر جانغدا: حفظه القرآن في أقل من سنة بدءاً من العاشرة، وتخرّجه في برنامج جامعة بنورية ذي السنوات السبع سنة 2002، وتدريسه العربية في جامعة تكساس في أرلينغتون 2005-2007، وإمامته في مسجد كوليفيل، وتأسيسه معهد قلم الشرعي."
  en: "AlMaghrib Institute's instructor biography of Abdul Nasir Jangda: memorised the Qur'an in under a year from the age of ten, graduated Jamia Binoria's seven-year programme in 2002, taught Arabic at the University of Texas at Arlington 2005-2007, served as imam at Colleyville Masjid, and founded Qalam Seminary."
