reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Makhachev as born on 27 October 1991 in Makhachkala, an ethnic Lak who grew up in the village of Burshi, trained under Abdulmanap Nurmagomedov; gold at the 2016 FIAS World Combat Sambo Championship; UFC lightweight champion from 22 October 2022 (Charles Oliveira) with a division-record four successful defences; UFC welterweight champion from 15 November 2025 (Jack Della Maddalena at UFC 322), with a first defence against Ian Machado Garry on 15 August 2026 that extended his winning streak to a UFC-record 17; and ranked first in the UFC pound-for-pound list. It makes no statement of his religion anywhere in its text; the only religion-adjacent remark is that he once withdrew from an early bout citing 'a religious reason'."
