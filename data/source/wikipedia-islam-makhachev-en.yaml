summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إسلام ماخاشيف؛ تُستخدم لوقائع الكيان فقط. تروي بطولته العالمية في سامبو القتال سنة 2016، وبطولة يو إف سي للوزن الخفيف من 2022 بأربع دفاعات، وبطولة الوزن الوسط في نوفمبر 2025، وسلسلة انتصاراته القياسية (17)."
  en: "English Wikipedia article on Islam Makhachev; used for entity facts only. It recounts his 2016 world combat sambo title, his UFC lightweight championship from 2022 with four defences, his UFC welterweight championship of November 2025, and his record 17-fight winning streak."
  es: "Artículo de la Wikipedia en inglés sobre Islam Makhachev; utilizado únicamente para datos sobre la persona. Relata su título mundial de sambo de combate de 2016, su campeonato de peso ligero de la UFC de 2022 con cuatro defensas, su campeonato de peso wélter de la UFC de noviembre de 2025 y su récord de 17 victorias consecutivas."
  fr: "Article Wikipédia en anglais sur Islam Makhachev; utilisé uniquement à des fins d'information sur l'entité. Il relate son titre de champion du monde de sambo de combat en 2016, son titre de champion UFC des poids légers en 2022 (défendu quatre fois), son titre de champion UFC des poids welters en novembre 2025 et sa série record de 17 victoires consécutives."
  ur: "اسلام مخاچیف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کا 2016 کا عالمی جنگی سامبو ٹائٹل، 2022 سے اس کی UFC لائٹ ویٹ چیمپیئن شپ چار دفاعوں کے ساتھ، نومبر 2025 کی اس کی UFC ویلٹر ویٹ چیمپئن شپ، اور اس کی 17 فائٹ جیتنے کا ریکارڈ ہے۔"
  tr: "İslam Makhachev hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için kullanılmıştır. 2016'da Sambo Dövüş'te dünya şampiyonluğunu, 2022'de dört maçla UFC hafif siklet şampiyonluğunu, Kasım 2025'teki orta sıklet şampiyonluğunu ve rekor galibiyet serisini (17) anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Islam Makhachev; digunakan hanya untuk fakta entitas. Artikel ini menceritakan tentang gelar dunianya di Sambo Fighting pada 2016, gelar juara ringan UFC dari 2022 dengan empat pertarungan, gelar kelas menengah pada November 2025, dan rekor kemenangan beruntunnya (17)."
