reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. It records his birth at Bindwal near Azamgarh into a Muslim Rajput family, his naming after the Sufi Abu Bakr al-Shibli, his teacher Muhammad Farooq Chirayakoti, his sixteen years teaching Persian and Arabic at Aligarh (professor 1882–1898 per its infobox), his 1892 journey with Thomas Arnold to Syria, Turkey and Egypt, the Ottoman medal from Sultan Abdul Hamid II, his meeting with Muhammad Abduh at Cairo, his Hyderabad education advisership and the adoption of Urdu as Osmania University's medium, his Nadwa leadership (Secretary of Education 1905–1913 per its infobox) and departure in 1913 under orthodox hostility, the founding of the Shibli National College (1883) and of Darul Musannefin (first formal meeting 21 November 1914, three days after his death), his death on 18 November 1914, his family, and his works, with the completion of Sirat-un-Nabi by Sulaiman Nadvi. On affiliation its infobox gives denomination 'Sunni' and movements Aligarh and Nadwa, and its text, citing Bhardwaj's History of Modern India, calls him a supporter of the Deobandi school; no madhhab is named. Its 4 June birth date conflicts with Wikidata's and the Urdu infobox's 3 June; the conflict is recorded in the person record. Read in full on 24 October 2026."
