  ar: "مقالة ويكيبيديا الإنجليزية عن شبلي النعماني؛ تُستخدم لوقائع الكيان فقط حيث تستشهد المقالة بمصدر. تؤرخ ميلاده في 4 يونيو 1857 بأعظم كره ووفاته في 18 نوفمبر 1914، وتفصّل أستاذيته بعليكره ورحلته سنة 1892 وعمله بحيدر آباد وندوة العلماء وتأسيسه دار المصنفين وقائمة مؤلفاته."
  en: "English Wikipedia article on Shibli Nomani; used for entity facts only where the article cites a source. It dates his birth to 4 June 1857 at Azamgarh and his death to 18 November 1914, and details his Aligarh professorship, his 1892 journey, his Hyderabad and Nadwa work, his founding of Darul Musannefin, and his works."
