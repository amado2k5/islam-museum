summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شبلي النعماني؛ تُستخدم لوقائع الكيان فقط حيث تستشهد المقالة بمصدر. تؤرخ ميلاده في 4 يونيو 1857 بأعظم كره ووفاته في 18 نوفمبر 1914، وتفصّل أستاذيته بعليكره ورحلته سنة 1892 وعمله بحيدر آباد وندوة العلماء وتأسيسه دار المصنفين وقائمة مؤلفاته."
  en: "English Wikipedia article on Shibli Nomani; used for entity facts only where the article cites a source. It dates his birth to 4 June 1857 at Azamgarh and his death to 18 November 1914, and details his Aligarh professorship, his 1892 journey, his Hyderabad and Nadwa work, his founding of Darul Musannefin, and his works."
  es: "Artículo de la Wikipedia en inglés sobre Shibli Nomani; se utiliza únicamente para datos sobre la persona, donde el artículo cita una fuente. Fecha su nacimiento el 4 de junio de 1857 en Azamgarh y su muerte el 18 de noviembre de 1914, y detalla su cátedra en Aligarh, su viaje de 1892, su trabajo en Hyderabad y Nadwa, la fundación de Darul Musannefin y sus obras."
  fr: "Article de Wikipédia en anglais sur Shibli Nomani; utilisé uniquement pour les informations factuelles relatives à l’entité, lorsque l’article cite une source. Il situe sa naissance le 4 juin 1857 à Azamgarh et sa mort le 18 novembre 1914, et détaille son poste de professeur à Aligarh, son voyage de 1892, son travail à Hyderabad et Nadwa, la fondation de Darul Musannefin et ses œuvres."
  ur: "شبلی نعمانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے جہاں مضمون کسی ماخذ کا حوالہ دیتا ہے۔ اس میں اعظم گڑھ میں ان کی پیدائش 4 جون 1857 اور ان کی وفات 18 نومبر 1914 ہے، اور ان کی علی گڑھ کی پروفیسری، ان کے 1892 کے سفر، ان کے حیدرآباد اور ندوہ کے کام، دارالمصنفین کے قیام اور ان کے کاموں کی تفصیلات درج ہیں۔"
  tr: "Shibli Al-Numani hakkında İngilizce Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır, çünkü makalede bir kaynak gösterilmiştir. Doğum tarihi 4 Haziran 1857 tarihli ve büyük bir nefretle tarihlenmiş, ölümü ise 18 Kasım 1914'tür. Alikra'daki profesörlüğü, 1892'deki yolculuğu, Haydarabad'daki çalışmaları, Bilginler Konferansı, Dar Al-Musannifin'in kuruluşu ve eserleri ayrıntılı olarak yer almaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Shibli Al-Numani hanya digunakan untuk fakta entitas, karena artikel tersebut mengutip sumbernya. Tanggal lahirnya bertanggal 4 Juni 1857, dengan sangat dibenci, dan kematiannya pada 18 November 1914. Jabatan profesornya di Alikra, perjalanannya pada tahun 1892, karyanya di Hyderabad, Konferensi Sarjana, pendirian Dar Al-Musannifin, dan daftar karyanya dijelaskan secara rinci."
