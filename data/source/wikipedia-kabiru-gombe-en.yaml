reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id through the MediaWiki API with the returned id asserted equal. It gives his birth name as Muhammad Kabir Haruna, his birthplace as Yamaltu/Deba in Gombe State, and a birth date of 1 June 1969 through the infobox date template — yet the article is also filed under 'Year of birth missing (living people)', so the date rests on that infobox alone and on Wikidata. The text calls the Izala Society 'the largest Salafiyyah movement in Nigeria' and names his influences as Malik ibn Anas and Abubakar Gumi; the infobox's Sunni denomination and Maliki jurisprudence are uncited, a single structured family."
