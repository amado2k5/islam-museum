summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كبيرو غومبي ⁦(محمد كبير هارونا)⁩؛ تُستخدم لوقائع الكيان فقط. تروي صعوده من مجموعة الإسعافات الشبابية في جماعة إزالة البدعة وإقامة السنة ⁦(إزالا)⁩ إلى أمينها العام الوطني منذ ديسمبر 2011، وتفسيره الرمضاني ودعوته في نيجيريا وخارجها، وموقفه النقدي من الصوفية والتشيع. صندوق معلوماتها يعطي انتماءه «سني» ومذهبه «مالكي»."
  en: "English Wikipedia article on Kabiru Gombe (Muhammad Kabir Haruna); used for entity facts only. It recounts his rise from the Izala Society's youth first-aid group to its National Secretary General from December 2011, his Ramadan tafsir and preaching across Nigeria and abroad, and his criticism of Sufism and Shi'ism. Its infobox gives his denomination as Sunni and his jurisprudence as Maliki."
  es: "Artículo de la Wikipedia en inglés sobre Kabiru Gombe (Muhammad Kabir Haruna); utilizado únicamente para datos sobre la persona. Relata su ascenso desde el grupo juvenil de primeros auxilios de la Sociedad Izala hasta su Secretario General Nacional desde diciembre de 2011, su tafsir (exégesis coránica) durante el Ramadán y sus prédicas en Nigeria y en el extranjero, así como sus críticas al sufismo y al chiismo. Su ficha informativa indica que pertenece al sunismo y que su escuela jurídica es malikí."
  fr: "L'article de Wikipédia en anglais consacré à Kabiru Gombe (Muhammad Kabir Haruna) est utilisé uniquement à des fins d'information sur l'entité. Il retrace son parcours, de son implication dans le groupe de secourisme jeunesse de la Société Izala à son poste de secrétaire général national à partir de décembre 2011, ses commentaires (tafsir) sur le Ramadan et ses prédications au Nigeria et à l'étranger, ainsi que ses critiques du soufisme et du chiisme. Son infobox indique qu'il est sunnite et de confession malikite."
  ur: "کبیرو گومبے ⁦(محمد کبیر ہارونہ)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ایزالا سوسائٹی کے نوجوان فرسٹ ایڈ گروپ سے دسمبر 2011 سے اس کے نیشنل سیکرٹری جنرل تک ان کے عروج، نائیجیریا اور بیرون ملک ان کی رمضان تفسیر اور تبلیغ، اور تصوف اور شیعہ ازم پر ان کی تنقید کا ذکر ہے۔ اس کا معلوماتی خانہ اس کا فرقہ سنی اور اس کی فقہ کو مالکی دیتا ہے۔"
