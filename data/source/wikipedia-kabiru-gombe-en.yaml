summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كبيرو غومبي (محمد كبير هارونا)؛ تُستخدم لوقائع الكيان فقط. تروي صعوده من مجموعة الإسعافات الشبابية في جماعة إزالة البدعة وإقامة السنة (إزالا) إلى أمينها العام الوطني منذ ديسمبر 2011، وتفسيره الرمضاني ودعوته في نيجيريا وخارجها، وموقفه النقدي من الصوفية والتشيع. صندوق معلوماتها يعطي انتماءه «سني» ومذهبه «مالكي»."
  en: "English Wikipedia article on Kabiru Gombe (Muhammad Kabir Haruna); used for entity facts only. It recounts his rise from the Izala Society's youth first-aid group to its National Secretary General from December 2011, his Ramadan tafsir and preaching across Nigeria and abroad, and his criticism of Sufism and Shi'ism. Its infobox gives his denomination as Sunni and his jurisprudence as Maliki."
