summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رستم بيك بايندر، الأمير الآق قوينلوي الذي حكم سلطانًا من 1492 إلى 1497؛ ابن مقصود وحفيد أوزون حسن، نُصّب في تبريز أواخر مايو 1492 بدعم خاله أيبه سلطان، وخلعه ابن عمه أحمد بيك سنة 1497 وأعدمه بعد أشهر إثر محاولته استعادة العرش."
  en: "English Wikipedia article on Rustam Beg Bayandur, the Aq Qoyunlu prince who ruled as sultan from 1492 to 1497; son of Maqsud and grandson of Uzun Hasan, he was enthroned at Tabriz at the end of May 1492 with the support of his maternal uncle Ayba-Sultan, deposed by his cousin Ahmad Beg in 1497 and executed several months later after a failed attempt to recover the throne."
  es: "Artículo de la Wikipedia en inglés sobre Rustam Beg Bayandur, el príncipe Aq Qoyunlu que gobernó como sultán desde 1492 hasta 1497; hijo de Maqsud y nieto de Uzun Hasan, fue entronizado en Tabriz a finales de mayo de 1492 con el apoyo de su tío materno Ayba-Sultan, depuesto por su primo Ahmad Beg en 1497 y ejecutado varios meses después tras un intento fallido de recuperar el trono."
  fr: "Article de Wikipédia en anglais sur Rustam Beg Bayandur, prince Aq Qoyunlu qui régna comme sultan de 1492 à 1497; fils de Maqsud et petit-fils d'Uzun Hasan, il fut intronisé à Tabriz à la fin du mois de mai 1492 avec le soutien de son oncle maternel Ayba-Sultan, déposé par son cousin Ahmad Beg en 1497 et exécuté quelques mois plus tard après une tentative infructueuse de récupérer le trône."
  ur: "رستم بیگ بیاندور پر انگریزی ویکیپیڈیا کا مضمون، آق قیوونلو شہزادہ جس نے 1492 سے 1497 تک سلطان کی حیثیت سے حکومت کی۔ مقصود کا بیٹا اور ازون حسن کا پوتا، وہ مئی 1492 کے آخر میں اپنے ماموں ایبہ سلطان کی حمایت سے تبریز پر تخت نشین ہوا، جسے اس کے کزن احمد بیگ نے 1497 میں معزول کر دیا اور کئی ماہ بعد تخت کی بازیابی کی ناکام کوشش کے بعد اسے پھانسی دے دی گئی۔"
  tr: "1492-1497 yılları arasında sultan olarak hüküm süren Ak Qoyinlui prensi Rustam Bey Bayindar hakkında İngilizce Vikipedi makalesi; Maqsud'un oğlu ve Uzun Hasan'ın torunu, 1492 Mayıs sonlarında amcası Aype Sultan'ın desteğiyle Tebriz'e tahta çıktı; 1497'de kuzeni Ahmed Bey tarafından tahttan indirildi ve tahtı geri almaya çalıştıktan sonra aylar sonra idam edildi."
  id: "Artikel Wikipedia bahasa Inggris tentang Rustam Bey Bayindar, pangeran Aq Qoyinlui yang memerintah sebagai sultan dari tahun 1492 hingga 1497; putra Maqsud dan cucu Uzun Hasan, dilantik di Tabriz pada akhir Mei 1492 dengan dukungan pamannya Aype Sultan, yang digulingkan oleh sepupunya Ahmed Bey pada tahun 1497, dan dieksekusi beberapa bulan kemudian setelah mencoba merebut kembali takhta."
