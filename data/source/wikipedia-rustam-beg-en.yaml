  ar: "مقالة ويكيبيديا الإنجليزية عن رستم بيك بايندر، الأمير الآق قوينلوي الذي حكم سلطانًا من 1492 إلى 1497؛ ابن مقصود وحفيد أوزون حسن، نُصّب في تبريز أواخر مايو 1492 بدعم خاله أيبه سلطان، وخلعه ابن عمه أحمد بيك سنة 1497 وأعدمه بعد أشهر إثر محاولته استعادة العرش."
  en: "English Wikipedia article on Rustam Beg Bayandur, the Aq Qoyunlu prince who ruled as sultan from 1492 to 1497; son of Maqsud and grandson of Uzun Hasan, he was enthroned at Tabriz at the end of May 1492 with the support of his maternal uncle Ayba-Sultan, deposed by his cousin Ahmad Beg in 1497 and executed several months later after a failed attempt to recover the throne."
