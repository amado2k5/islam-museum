reliability_note: "Read in full (text and wikitext) on 1 November 2026. A short article resting on the standard scholarship it cites — Woods, The Aqquyunlu (1999), Bosworth, The New Islamic Dynasties (1996), the Encyclopaedia Iranica and Encyclopaedia Islamica entries on the Aq Qoyunlu, and Mitchell (2009). It gives no birth date at all (the article files him only under '15th-century births'), so it attests neither the queue's 1465 nor any other birth year. Its infobox carries 'Sunni Islam' as his religion, an editor's summary value that no narrative sentence in the article supports; it is preserved in the record's faith note as an attestation, not adopted as a settlement. Its account of his death (execution after a failed recovery attempt) conflicts with the Persian edition (killed at Tabriz in battle) and the Russian edition (died in exile in Georgia); the year 1497 is common to all."
