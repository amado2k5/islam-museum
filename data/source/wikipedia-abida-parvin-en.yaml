summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن المغنية الصوفية عابدة پروين؛ لوقائع الكيان فقط: مولدها في لاڑکانہ في 20 فبراير 1954، وتعلّمها على أبيها الأستاذ غلام حيدر، وانطلاقتها في إذاعة باكستان في 1973، وجولاتها منذ 1993، وكوك ستوديو، وأوسمتها ⁦(حسن الأداء 1984، ستارة امتياز 2005، هلال امتياز 2012، نشان امتياز 2021)⁩، ورفضها الغناء للسينما «بسبب إيمانها الصوفي»؛ وتستند إلى ذا غارديان ولوس أنجلوس تايمز وداون وإكسبرس تريبيون وديكان هيرالد."
  en: "English Wikipedia article on the Sufi singer Abida Parveen; entity facts only: birth at Larkana on 20 February 1954, training with her father Ustad Ghulam Haider, her breakthrough on Radio Pakistan in 1973, her tours from 1993, Coke Studio, her orders (Pride of Performance 1984, Sitara-e-Imtiaz 2005, Hilal-e-Imtiaz 2012, Nishan-e-Imtiaz 2021) and her refusal of film work 'on account of her Sufi faith'; it cites The Guardian, the Los Angeles Times, Dawn, The Express Tribune and the Deccan Herald."
  es: "Artículo de la Wikipedia en inglés sobre la cantante sufí Abida Parveen; solo datos sobre la persona: nacimiento en Larkana el 20 de febrero de 1954, formación con su padre Ustad Ghulam Haider, su salto a la fama en Radio Pakistán en 1973, sus giras desde 1993, Coke Studio, sus condecoraciones (Pride of Performance 1984, Sitara-e-Imtiaz 2005, Hilal-e-Imtiaz 2012, Nishan-e-Imtiaz 2021) y su negativa a trabajar en películas \"debido a su fe sufí\"; cita a The Guardian, Los Angeles Times, Dawn, The Express Tribune y Deccan Herald."
  fr: "Article de Wikipédia en anglais sur la chanteuse soufie Abida Parveen; informations uniquement sur l’artiste: naissance à Larkana le 20 février 1954, formation auprès de son père Ustad Ghulam Haider, son succès à Radio Pakistan en 1973, ses tournées à partir de 1993, Coke Studio, ses distinctions (Pride of Performance 1984, Sitara-e-Imtiaz 2005, Hilal-e-Imtiaz 2012, Nishan-e-Imtiaz 2021) et son refus de travailler dans le cinéma « en raison de sa foi soufie »; l’article cite The Guardian, le Los Angeles Times, Dawn, The Express Tribune et le Deccan Herald."
