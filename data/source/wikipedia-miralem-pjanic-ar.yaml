summary:
  ar: "مقالة ويكيبيديا العربية عن ميراليم بيانيتش؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه الكامل ميراليم فخر الدين بيانيتش ومولده سنة 1990، وقصة اختياره تمثيل البوسنة بعد منتخبات لوكسمبورغ للناشئين، ومسيرته مع الأندية، ولا تذكر دينه في متنها."
  en: "Arabic Wikipedia article on Miralem Pjanić; used for entity facts only. It gives his full name as Miralem Fakhruddin Pjanić, born in 1990, the story of his choosing Bosnia and Herzegovina after Luxembourg youth football, and his club career; it makes no statement of his religion in its text."
  es: "Artículo de Wikipedia en árabe sobre Miralem Pjanić; se utiliza únicamente para obtener información sobre la persona. Indica su nombre completo como Miralem Fakhruddin Pjanić, nacido en 1990, la historia de su decisión de elegir Bosnia y Herzegovina tras su paso por las categorías inferiores del fútbol luxemburgués y su trayectoria en clubes; no menciona su religión en el texto."
  fr: "L'article de Wikipédia en arabe consacré à Miralem Pjanić, utilisé uniquement à des fins d'information sur l'entité, indique son nom complet: Miralem Fakhruddin Pjanić, né en 1990. Il retrace son parcours, de son choix de la Bosnie-Herzégovine après avoir évolué dans les équipes de jeunes du Luxembourg, à sa carrière en club. Sa religion n'est pas mentionnée dans le texte."
  ur: "Miralem Pjanić پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا پورا نام میرالم فخرالدین پجانیچ کے طور پر دیا گیا ہے، جو 1990 میں پیدا ہوئے، لکسمبرگ کے نوجوان فٹ بال کے بعد بوسنیا اور ہرزیگووینا کو منتخب کرنے کی کہانی، اور اس کے کلب کیریئر؛ اس کے متن میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Miralem Pjanić hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Metinde tam adı Miralem Fahrettin Bjanić ve 1990'daki doğumu, Lüksemburg genç milli takımlarından sonra Bosna'yı temsil etme seçimi, kulüp kariyeri ve dini metinde yer almıyor."
  id: "Artikel Wikipedia bahasa Arab tentang Miralem Pjanić; digunakan hanya untuk fakta entitas. Artikel tersebut menyebutkan nama lengkapnya Miralem Fahrettin Bjanić dan kelahirannya pada tahun 1990, kisah pilihannya untuk mewakili Bosnia setelah tim nasional muda Luksemburg, karier klubnya, dan agamanya tidak disebutkan dalam teks."
