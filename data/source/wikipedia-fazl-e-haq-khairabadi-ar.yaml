summary:
  ar: "مقالة ويكيبيديا العربية «فضل حق خير آبادي»؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته سنة 1797 ووفاته في 20 أغسطس 1861 في المنفى بجزر أندمان، وفتواه بوجوب الجهاد ضد الاحتلال البريطاني، واعتقاله في 30 يناير 1859 ومحاكمته ودفاعه عن نفسه، والحكم عليه بالسجن المؤبد ومصادرة أملاكه، وتكرارها عن أنيل سيهغال (2001) أنه كُرّم بوصفه صوفيًا عظيمًا."
  en: "Arabic Wikipedia article 'Fazl-e-Haq Khairabadi'; used for entity facts only. It gives his birth in 1797 and his death on 20 August 1861 in exile in the Andaman Islands, his fatwa making jihad against the British occupation obligatory, his arrest on 30 January 1859, his trial and self-defence, his life sentence and the confiscation of his property, and repeats from Anil Sehgal (2001) that he was venerated as a great Sufi."
  es: "Artículo de Wikipedia en árabe titulado \"Fazl-e-Haq Khairabadi\"; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1797 y su muerte el 20 de agosto de 1861 en el exilio en las Islas Andamán, su fatwa que hacía obligatoria la yihad contra la ocupación británica, su arresto el 30 de enero de 1859, su juicio y legítima defensa, su condena a cadena perpetua y la confiscación de sus bienes, y reitera, según Anil Sehgal (2001), que era venerado como un gran sufí."
  fr: "L'article de Wikipédia en arabe intitulé « Fazl-e-Haq Khairabadi » (utilisé uniquement pour les informations biographiques) indique sa naissance en 1797 et sa mort le 20 août 1861 en exil aux îles Andaman, sa fatwa rendant obligatoire le jihad contre l'occupation britannique, son arrestation le 30 janvier 1859, son procès et sa légitime défense, sa condamnation à perpétuité et la confiscation de ses biens, et reprend les propos d'Anil Sehgal (2001) selon lesquels il était vénéré comme un grand soufi."
  ur: "عربی ویکیپیڈیا مضمون 'فضل حق خیرآبادی'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1797 میں ان کی پیدائش اور 20 اگست 1861 کو جزائر انڈمان میں جلاوطنی میں ان کی موت، برطانوی قبضے کے خلاف جہاد کو فرض قرار دینے کا فتویٰ، 30 جنوری 1859 کو ان کی گرفتاری، ان کا مقدمہ اور خود دفاع، ان کی عمر قید اور ان کی جائیداد کی ضبطی، اور انیل سیہ (Suvener) سے دہرایا جاتا ہے جسے وہ ایک عظیم سووین (Suvener) قرار دیتے ہیں۔"
  tr: "Arapça Vikipedi makalesi \"Fadl Haq Khairabadi\" yalnızca varlığın gerçekleri için kullanılır. 1797'de doğduğu ve 20 Ağustos 1861'de Andaman Adaları'nda sürgünde öldüğü gibi, İngiliz işgaline karşı cihat yapma zorunluluğuna dair fetvası, 30 Ocak 1859'da tutuklanması, yargılanması ve meşru müdafaasi, ömür boyu hapis cezası, mülklerinin müsaderesi ve Anil Sehgal (2001) adlı eserinin büyük bir Sufi olarak onurlandırıldığı tekrarı bahsedilmektedir."
  id: "Artikel Wikipedia berbahasa Arab \"Fadl Haq Khairabadi\" hanya digunakan untuk fakta-fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada tahun 1797 dan kematiannya pada 20 Agustus 1861, dalam pengasingan di Kepulauan Andaman, fatwanya tentang kewajiban melakukan jihad melawan pendudukan Inggris, penangkapannya pada 30 Januari 1859, persidangan dan pembelaan diri, penjara seumur hidupnya, penyitaan hartanya, serta pengulangan Anil Sehgal (2001) bahwa ia dihormati sebagai seorang Sufi besar."
