summary:
  ar: "مقالة ويكيبيديا العربية «فضل حق خير آبادي»؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته سنة 1797 ووفاته في 20 أغسطس 1861 في المنفى بجزر أندمان، وفتواه بوجوب الجهاد ضد الاحتلال البريطاني، واعتقاله في 30 يناير 1859 ومحاكمته ودفاعه عن نفسه، والحكم عليه بالسجن المؤبد ومصادرة أملاكه، وتكرارها عن أنيل سيهغال (2001) أنه كُرّم بوصفه صوفيًا عظيمًا."
  en: "Arabic Wikipedia article 'Fazl-e-Haq Khairabadi'; used for entity facts only. It gives his birth in 1797 and his death on 20 August 1861 in exile in the Andaman Islands, his fatwa making jihad against the British occupation obligatory, his arrest on 30 January 1859, his trial and self-defence, his life sentence and the confiscation of his property, and repeats from Anil Sehgal (2001) that he was venerated as a great Sufi."
