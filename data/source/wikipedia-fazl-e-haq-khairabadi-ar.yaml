reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. It gives his birth in 1797 and his death on 20 August 1861 — one day later than the English article's 19 August, which rests on Asir Adrawi; Wikidata agrees with 20 August. It names no legal school or creed for him in its text; its category filings under 'Hanafis' and 'Maturidis' are filings, not attestations, and are not counted. Its statement that he was venerated as a great Sufi repeats Anil Sehgal (2001), the same source the English article cites for the same point, so the two articles are one family on that claim."
