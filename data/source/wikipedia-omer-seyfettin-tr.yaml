summary:
  ar: "مقالة ويكيبيديا التركية عن عمر سيف الدين: تفصّل مرضه ووفاته في 6 مارس 1920 ونقل رفاته إلى مقبرة زنجيرلي قويو سنة 1939، وتؤكد مولده في غونن سنة 1884."
  en: "Turkish Wikipedia article on Ömer Seyfettin: details his illness and death on 6 March 1920 and the 1939 transfer of his remains to Zincirlikuyu Cemetery, and confirms his birth at Gönen in 1884."
  es: "El artículo de la Wikipedia turca sobre Ömer Seyfettin detalla su enfermedad y muerte el 6 de marzo de 1920, así como el traslado de sus restos al cementerio de Zincirlikuyu en 1939, y confirma su nacimiento en Gönen en 1884."
  fr: "L'article de Wikipédia turc sur Ömer Seyfettin détaille sa maladie et sa mort le 6 mars 1920, ainsi que le transfert de sa dépouille au cimetière de Zincirlikuyu en 1939, et confirme sa naissance à Gönen en 1884."
  ur: "Ömer Seyfettin پر ترک ویکیپیڈیا کا مضمون: 6 مارچ 1920 کو اس کی بیماری اور موت اور 1939 میں اس کی باقیات کو زنسرلیکیو قبرستان میں منتقل کرنے کی تفصیلات، اور 1884 میں گونن میں اس کی پیدائش کی تصدیق کرتا ہے۔"
  tr: "Ömer Seyfuddin hakkında Türkçe Vikipedi makalesi: 6 Mart 1920'deki hastalığı ve ölümünü detaylandırır; naaşı 1939'da Zincirli Koyu mezarlığına nakledilir ve 1884'te Günen'de doğduğu doğrulanır."
  id: "Artikel Wikipedia Turki tentang Omar Saifuddin: Artikel ini merinci penyakit dan kematiannya pada 6 Maret 1920, dan jenazahnya dipindahkan ke pemakaman Zincirli Koyu pada tahun 1939, mengonfirmasi kelahirannya di Gunen pada tahun 1884."
