summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى سليمان ⁦(وُلد أغسطس 1984 في لندن)⁩، الشريك المؤسس لديب مايند وإنفليكشن إيه آي والرئيس التنفيذي لقطاع الذكاء الاصطناعي في مايكروسوفت. تصفه المقالة بأنه كان في مراهقته «ملحدًا قويًا» حين ساعد في تأسيس خط مساعدة الشباب المسلم سنة 2001."
  en: "The English Wikipedia article on Mustafa Suleyman (born August 1984 in London), co-founder of DeepMind and Inflection AI and CEO of Microsoft AI. The article states that as a teenager and a 'strong atheist' he helped establish the Muslim Youth Helpline in 2001."
  es: "El artículo de Wikipedia en inglés sobre Mustafa Suleyman (nacido en agosto de 1984 en Londres), cofundador de DeepMind e Inflection AI y director ejecutivo de Microsoft AI, afirma que, siendo adolescente y un ateo convencido, ayudó a fundar la Línea de Ayuda para Jóvenes Musulmanes en 2001."
  fr: "L'article de Wikipédia en anglais sur Mustafa Suleyman (né en août 1984 à Londres), cofondateur de DeepMind et d'Inflection AI et PDG de Microsoft AI, indique qu'adolescent et « athée convaincu », il a contribué à la création de la Muslim Youth Helpline en 2001."
  ur: "انگریزی ویکیپیڈیا مضمون مصطفیٰ سلیمان ⁦(پیدائش اگست 1984 لندن میں)⁩، DeepMind اور Inflection AI کے شریک بانی اور Microsoft AI کے CEO۔ مضمون میں کہا گیا ہے کہ ایک نوجوان اور 'مضبوط ملحد' کے طور پر اس نے 2001 میں مسلم یوتھ ہیلپ لائن قائم کرنے میں مدد کی۔"
  tr: "Mustafa Suleiman (Ağustos 1984, Londra doğumlu), DeepMind ve Inflection AI'nin kurucu ortağı ve Microsoft'un AI bölümünün CEO'su hakkında İngilizce Wikipedia makalesi. Makale, 2001'de Müslüman Gençlik Yardım Hattı'nın kurulmasına yardım ettiği ergenlik yıllarında \"güçlü bir ateist\" olarak tanımlanıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Mustafa Suleiman (lahir Agustus 1984 di London), salah satu pendiri DeepMind dan Inflection AI serta CEO divisi AI di Microsoft. Artikel tersebut menggambarkannya sebagai \"ateis kuat\" saat remaja ketika ia membantu mendirikan Muslim Youth Helpline pada tahun 2001."
