summary:
  ar: "مقالة ويكيبيديا العربية عن ضياء عنايت خان ⁦(مواليد 1971)⁩، تصفه في صدرها بأنه عالم ومعلّم في التصوف في سلالة جدّه، ورئيس الطريقة العنايتية ومؤسس أكاديمية سلوك، وتسرد تأكيده خليفةً روحيًا لوالده سنة 2001 وأعماله المنشورة."
  en: "The Arabic Wikipedia article on Zia Inayat Khan (born 1971), whose lead describes him as a scholar and teacher of Sufism in his grandfather’s lineage, president of the Inayati order and founder of Suluk Academy, and records his confirmation as his father’s spiritual successor in 2001 and his published works."
  es: "El artículo de la Wikipedia en árabe sobre Zia Inayat Khan (nacido en 1971), cuyo titular lo describe como un erudito y maestro de sufismo por tradición familiar, presidente de la orden Inayati y fundador de la Academia Suluk, recoge su confirmación como sucesor espiritual de su padre en 2001 y sus obras publicadas."
  fr: "L'article de Wikipédia en arabe sur Zia Inayat Khan (né en 1971), dont l'introduction le décrit comme un érudit et un enseignant du soufisme dans la lignée de son grand-père, président de l'ordre Inayati et fondateur de l'Académie Suluk, et relate sa confirmation comme successeur spirituel de son père en 2001 et ses œuvres publiées."
  ur: "ضیا عنایت خان ⁦(پیدائش 1971)⁩ پر عربی ویکیپیڈیا کا مضمون، جس کی قیادت انہیں اپنے دادا کے سلسلہ میں ایک عالم اور تصوف کے استاد، عنایتی آرڈر کے صدر اور سلوک اکیڈمی کے بانی کے طور پر بیان کرتی ہے، اور 2001 میں اپنے والد کے روحانی جانشین کے طور پر ان کی تصدیق اور ان کے شائع شدہ کاموں کو ریکارڈ کرتا ہے۔"
  tr: "Zia Inayat Khan (d. 1971) hakkında Arapça Wikipedia makalesi, onu ön planda büyükbabasının soyundan bir tasavvuf bilgini ve öğretmeni, Inayati tarikatının başı ve Süluk Akademisi'nin kurucusu olarak tanımlar. 2001'de babasının manevi halefi olarak onaylanması ve yayımlanmış eserleri listelenmektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang Zia Inayat Khan (lahir 1971) menggambarkannya di latar depan sebagai seorang cendekiawan dan guru Sufisme dalam garis keturunan kakeknya, kepala ordo Inayati, dan pendiri Akademi Suluk. Artikel tersebut mencantumkan konfirmasinya sebagai penerus spiritual ayahnya pada tahun 2001 dan karya-karya yang telah diterbitkan."
