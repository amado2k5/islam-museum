summary:
  ar: "مدخل «مدّاح» في موسوعة TDV الإسلامية لأوظديمير نوتكو: من المادّح القائم بالمديح إلى راوي القصص الشعبي العثماني، وأصول الحكاية عند الأتراك ⁦(باقصي وأوزان)⁩، وأداء المدّاح وفنّه وأماكن اشتغاله."
  en: "The TDV İslâm Ansiklopedisi entry on meddah by Özdemir Nutku: from the madih-panegyrist to the Ottoman popular storyteller, the Turkish storytelling antecedents (baksı, ozan), and the meddah's performance art, repertory and places of work."
  es: "La entrada de Özdemir Nutku en la TDV İslâm Ansiklopedisi sobre la meddah: desde el madih-panegírico hasta el narrador popular otomano, los antecedentes de la narración turca (baksı, ozan) y el arte escénico, el repertorio y los lugares de trabajo de la meddah."
  fr: "L'article de TDV İslâm Ansiklopedisi sur la meddah par Özdemir Nutku: du madih-panégyriste au conteur populaire ottoman, les antécédents de la narration turque (baksı, ozan), et l'art de la performance, le répertoire et les lieux de travail de la meddah."
  ur: "TDV اسلامک انسائیکلو پیڈیا میں ozdemir Nutku کی طرف سے میڈہ پر اندراج: مدیح-پنیگرسٹ سے لے کر عثمانی مشہور کہانی کار تک، ترکی کی کہانی سنانے کے سابقہ واقعات ⁦(baksı، ozan)⁩، اور میڈہ کی کارکردگی کا فن، ریپرٹری اور کام کے مقامات۔"
