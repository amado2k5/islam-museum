summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ليندا صرصور؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها سنة 1980 في بروكلين، وقيادتها للجمعية العربية الأمريكية في نيويورك، وقيادتها المشتركة لمسيرة النساء 2017، ومواقفها والجدل حولها، ولا تسمّي لها مذهبًا."
  en: "English Wikipedia article on Linda Sarsour; used for entity facts only. It records her birth in 1980 in Brooklyn, her leadership of the Arab American Association of New York, her co-chairing of the 2017 Women's March, her positions and the controversies around them, and names no school for her."
  es: "Artículo de la Wikipedia en inglés sobre Linda Sarsour; utilizado únicamente para obtener información sobre la persona. En él se registra su nacimiento en 1980 en Brooklyn, su liderazgo en la Asociación Árabe Americana de Nueva York, su copresidencia de la Marcha de las Mujeres de 2017, sus posturas y las controversias que las rodean, pero no menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en anglais sur Linda Sarsour; utilisé uniquement à des fins d'information sur la personne. Il mentionne sa naissance en 1980 à Brooklyn, son rôle à la tête de l'Association arabo-américaine de New York, sa coprésidence de la Marche des femmes de 2017, ses prises de position et les controverses qu'elles ont suscitées, mais ne cite aucun établissement scolaire à son nom."
  ur: "لنڈا سارسور پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1980 میں بروکلین میں اس کی پیدائش، نیویارک کی عرب امریکن ایسوسی ایشن کی اس کی قیادت، 2017 کے خواتین کے مارچ کی اس کی شریک چیئرنگ، اس کے عہدوں اور ان کے ارد گرد کے تنازعات، اور اس کے لیے کسی اسکول کا نام درج نہیں ہے۔"
  tr: "Linda Sarsour hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1980'de Brooklyn'de doğumunu, New York'taki Arap Amerikan Derneği'nin liderliğini, 2017 Kadınlar Yürüyüşü'ndeki ortak liderliğini, tutumlarını ve etrafındaki tartışmaları belgelemektedir, ancak onu bir tarikat olarak adlandırmaz."
  id: "Artikel Wikipedia bahasa Inggris tentang Linda Sarsour; digunakan hanya untuk fakta entitas. Artikel ini mendokumentasikan kelahirannya pada tahun 1980 di Brooklyn, kepemimpinannya di Arab American Association di New York, kepemimpinan bersama dalam Women's March 2017, sikapnya, dan kontroversi yang mengelilinginya, tanpa menyebut sekte."
