summary:
  ar: "مقالة ويكيبيديا الأردية عن قاري وحيد ظفر قاسمي؛ تُستخدم لوقائع الكيان فقط. تروي أسرته القرائية وفوزه بمسابقات ماليزيا 1969 وليبيا 1979 والسعودية 1980 وسوريا 1981 وعمله بإذاعة باكستان وتلفزيونها ووسام فخر الأداء سنة 1984 وإقامته بكراتشي، ولا تذكر سنة ميلاده في متنها."
  en: "Urdu Wikipedia article on Qari Waheed Zafar Qasmi; used for entity facts only. It recounts his reciting family, his competition wins in Malaysia (1969), Libya (1979), Saudi Arabia (1980) and Syria (1981), his Radio Pakistan and PTV work, the Pride of Performance of 1984 and his residence in Karachi; its text gives no birth year."
  es: "Artículo de Wikipedia en urdu sobre Qari Waheed Zafar Qasmi; se utiliza únicamente para datos sobre la persona. Relata su familia de recitadores, sus victorias en concursos en Malasia (1969), Libia (1979), Arabia Saudita (1980) y Siria (1981), su trabajo en Radio Pakistán y PTV, el premio Pride of Performance de 1984 y su residencia en Karachi; el texto no indica su año de nacimiento."
  fr: "Article de Wikipédia en ourdou sur Qari Waheed Zafar Qasmi; utilisé uniquement à titre informatif. Il relate sa famille de récitants, ses victoires aux concours en Malaisie (1969), en Libye (1979), en Arabie saoudite (1980) et en Syrie (1981), son travail à Radio Pakistan et à PTV, le prix Pride of Performance de 1984 et sa résidence à Karachi; son année de naissance n'est pas mentionnée."
  ur: "قاری وحید ظفر قاسمی پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے تلاوت کرنے والے خاندان کا ذکر ہے، ان کا مقابلہ ملائیشیا (1969)، لیبیا (1979)، سعودی عرب (1980) اور شام (1981)، ان کا ریڈیو پاکستان اور پی ٹی وی کا کام، 1984 کا پرائیڈ آف پرفارمنس اور کراچی میں ان کی رہائش کا ذکر ہے۔ اس کا متن کوئی سال پیدائش نہیں دیتا۔"
