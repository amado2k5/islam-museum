  ar: "مقالة ويكيبيديا الأردية عن قاري وحيد ظفر قاسمي؛ تُستخدم لوقائع الكيان فقط. تروي أسرته القرائية وفوزه بمسابقات ماليزيا 1969 وليبيا 1979 والسعودية 1980 وسوريا 1981 وعمله بإذاعة باكستان وتلفزيونها ووسام فخر الأداء سنة 1984 وإقامته بكراتشي، ولا تذكر سنة ميلاده في متنها."
