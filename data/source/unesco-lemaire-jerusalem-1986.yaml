summary:
  ar: "تقرير المقرر الشخصي للمدير العام لليونسكو ريمون لومير عن بعثته إلى القدس في يوليو ١٩٨٦، يصف النفق المحفور أسفل المدرسة التنكزية وغرب الحرم."
  en: "Report by Raymond Lemaire, personal representative of the UNESCO Director-General, on his July 1986 mission to Jerusalem; it describes the tunnel dug beneath the Tankiziyya madrasa and along the western Haram wall."
  ur: "یونیسکو کے نمائندہ ریمون لومیر کی جولائی 1986 بیت المقدس مشن رپورٹ؛ تنکزیہ مدرسہ کے نیچے کھدی گئی سرنگ کا بیان۔"
  fr: "Rapport de Raymond Lemaire sur sa mission à Jérusalem en juillet 1986 ; il décrit le tunnel creusé sous la madrasa Tankiziyya le long du mur occidental du Haram."
  es: "Informe de Raymond Lemaire sobre su misión a Jerusalén en julio de 1986 ; describe el túnel excavado bajo la madraza Tankiziyya junto al muro occidental del Haram."
  tr: "UNESCO temsilcisi Raymond Lemaire'in Temmuz 1986 Kudüs misyonu raporu; Tenkiziyye Medresesi'nin altında ve Haram'ın batı duvarı boyunca kazılan tüneli anlatır."
  id: "Laporan Raymond Lemaire tentang misinya ke Yerusalem Juli 1986; menggambarkan terowongan di bawah madrasah Tankiziyya di sepanjang tembok barat Haram."
