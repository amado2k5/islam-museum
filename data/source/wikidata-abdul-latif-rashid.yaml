summary:
  ar: "عنصر ويكي بيانات Q6496078 لعبد اللطيف رشيد، ثُبّت عبر خصائص صفحات المقالات؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته 10 آب 1944 بالسليمانية وقيمة دين وحيدة هي الإسلام السني، وهي الصدى البنيوي لقراءة صندوق المعلومات."
  en: "Wikidata item Q6496078 for Abdul Latif Rashid, grounded through the articles' pageprops; used for entity facts only. It gives his birth as 10 August 1944 at Sulaymaniyah and a single religion value, Sunni Islam — the structured echo of the Arabic article's infobox field, one source family with it."
  es: "El elemento de Wikidata Q6496078 para Abdul Latif Rashid, basado en los pageprops de los artículos, se utiliza únicamente para datos de la entidad. Indica que nació el 10 de agosto de 1944 en Sulaymaniyah y que profesa el islam sunita, lo que coincide con el campo infobox del artículo en árabe, perteneciente a una misma familia de fuentes."
  fr: "L'élément Wikidata Q6496078 concernant Abdul Latif Rashid, basé sur les propriétés de page des articles, est utilisé uniquement pour les informations relatives à l'entité. Il indique sa date de naissance, le 10 août 1944, à Souleimaniye, et mentionne l'islam sunnite – reprenant ainsi les informations de l'infobox de l'article en arabe, qui appartient à la même famille de sources."
  ur: "وکی ڈیٹا آئٹم Q6496078 عبداللطیف راشد کے لیے، مضامین کے صفحہ کے پراپس کے ذریعے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 10 اگست 1944 کو سلیمانیہ میں ہوئی اور ایک واحد مذہب کی قدر، سنی اسلام - عربی مضمون کے انفو باکس فیلڈ کی تشکیل شدہ بازگشت، اس کے ساتھ ایک ذریعہ خاندان۔"
  tr: "Abdul Latif Rashid tarafından makale sayfalarının özellikleri aracılığıyla kurulan bir Wikidata öğesi Q6496078; yalnızca varlığın gerçekleri için kullanılır. 10 Ağustos 1944'te Süleymaniye'de doğdu ve tek bir dini değeri vardır: Sünni İslam, bilgi kutusunu okumanın yapısal yankısıdır."
  id: "Elemen Wikidata Q6496078 oleh Abdul Latif Rashid, ditetapkan melalui properti halaman artikel; digunakan hanya untuk fakta entitas. Ia lahir pada 10 Agustus 1944 di Sulaymaniyah, dan memiliki satu nilai keagamaan, yaitu Islam Sunni, yang merupakan gema struktural dari membaca infobox."
