summary:
  ar: "ورقة بحثية معمارية توثّق حصن خضرفور (حاجي گنج) على نهر شيتالاكشيا بنارايانغانج، وتعرض تاريخه ومخططه وعناصره المعمارية وأضراره ومقترحات صيانته؛ مؤلفوها ثلاثة معماريين وطالب عمارة من دكا."
  en: "An architectural documentation paper on the Khizirpur (Hajiganj) water fort near Narayanganj, covering its history, plan, architectural elements, damage and conservation proposals, by three authors from Dhaka. Reliability: Peer-review status not stated in the paper. Written by practising architects and a student, with drone, aerial-map and CS-map material, and it quotes Baharistan-i-Ghaybi and Akbarnama. Its dating of the fort is contested by its own text (it attributes the fort to Mir Jumla, 1591-1663, but also dates it to the sixteenth century). Use for description and documentation; treat its construction attribution as one claim among several, and take the period-dating claims to the primary chronicles before relying on them."
title: "Inquiry and Documentation of the “Ancient Khizirpur Fort” and Deciding about its Upbringing and Conservation for the Next Genesis"
