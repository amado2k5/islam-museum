label: { ar: "توثيق حصن خضرفور القديم وصيانته — مجلة IJRIAS 2023", en: "Inquiry and Documentation of the Ancient Khizirpur Fort (IJRIAS, 2023)" }
summary:
  ar: "ورقة بحثية معمارية توثّق حصن خضرفور ⁦(حاجي گنج)⁩ على نهر شيتالاكشيا بنارايانغانج، وتعرض تاريخه ومخططه وعناصره المعمارية وأضراره ومقترحات صيانته؛ مؤلفوها ثلاثة معماريين وطالب عمارة من دكا."
  en: "An architectural documentation paper on the Khizirpur (Hajiganj) water fort near Narayanganj, covering its history, plan, architectural elements, damage and conservation proposals, by three authors from Dhaka. Reliability: Peer-review status not stated in the paper. Written by practising architects and a student, with drone, aerial-map and CS-map material, and it quotes Baharistan-i-Ghaybi and Akbarnama. Its dating of the fort is contested by its own text (it attributes the fort to Mir Jumla, 1591-1663, but also dates it to the sixteenth century). Use for description and documentation; treat its construction attribution as one claim among several, and take the period-dating claims to the primary chronicles before relying on them."
  es: "Documento arquitectónico sobre el fuerte acuático de Khizirpur (Hajiganj), cerca de Narayanganj, que abarca su historia, plano, elementos arquitectónicos, daños y propuestas de conservación, escrito por tres autores de Dhaka. Fiabilidad: No se indica si ha sido sometido a revisión por pares. Escrito por arquitectos en ejercicio y un estudiante, con material de dron, mapas aéreos y mapas digitales, cita el Baharistan-i-Ghaybi y el Akbarnama. La datación del fuerte es cuestionada por el propio texto (se atribuye a Mir Jumla, 1591-1663, pero también se fecha en el siglo XVI). Útil para descripción y documentación; tratar la atribución de su construcción como una afirmación más entre varias, y consultar las crónicas primarias antes de basarse en ellas para la datación."
  fr: "Ce document de documentation architecturale sur le fort d'eau de Khizirpur (Hajiganj), près de Narayanganj, aborde son histoire, son plan, ses éléments architecturaux, les dommages subis et les propositions de conservation. Rédigé par trois auteurs de Dhaka, il n'a pas fait l'objet d'une évaluation par les pairs, bien que son statut ne soit pas mentionné. Écrit par des architectes en exercice et un étudiant, il s'appuie sur des images de drone, des cartes aériennes et des images de synthèse, et cite le Baharistan-i-Ghaybi et l'Akbarnama. La datation du fort proposée est contestée par le texte lui-même (il l'attribue à Mir Jumla, 1591-1663, mais le date également du XVIe siècle). Ce document est à utiliser à des fins descriptives et documentaires; l'attribution de sa construction n'est qu'une hypothèse parmi d'autres, et les datations doivent être vérifiées auprès des sources primaires avant d'être considérées comme fiables."
  ur: "نارائن گنج کے قریب خضر پور ⁦(حاجی گنج)⁩ آبی قلعے پر تعمیراتی دستاویزی کاغذ، جس میں ڈھاکہ کے تین مصنفین کی طرف سے اس کی تاریخ، منصوبہ، تعمیراتی عناصر، نقصان اور تحفظ کی تجاویز کا احاطہ کیا گیا ہے۔ وشوسنییتا: ہم مرتبہ جائزہ کی حیثیت کاغذ میں بیان نہیں کی گئی ہے۔ پریکٹس کرنے والے ماہر تعمیرات اور ایک طالب علم کی طرف سے لکھا گیا، ڈرون، فضائی نقشہ اور CS-نقشہ کے مواد کے ساتھ، اور اس میں بہارستان-غیبی اور اکبرنامہ کا حوالہ دیا گیا ہے۔ قلعہ کی تاریخ کا اس کے اپنے متن سے مقابلہ کیا گیا ہے ⁦(یہ قلعہ کو میر جملا، 1591-1663 سے منسوب کرتا ہے، لیکن یہ سولہویں صدی کا بھی ہے)⁩۔ تفصیل اور دستاویزات کے لیے استعمال کریں؛ اس کی تعمیراتی انتساب کو متعدد میں سے ایک دعوی کے طور پر سمجھیں، اور پیریڈ ڈیٹنگ کے دعووں کو ان پر انحصار کرنے سے پہلے بنیادی تاریخوں تک لے جائیں۔"
title: "Inquiry and Documentation of the “Ancient Khizirpur Fort” and Deciding about its Upbringing and Conservation for the Next Genesis"
