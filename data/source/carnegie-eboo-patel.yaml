summary:
  ar: "ملف مؤسسة كارنيغي عن إيبو باتل ضمن «مهاجرون عظماء»؛ يقول إنه وُلد في مومباي بالهند وإنه «مسلم إسماعيلي من أصل غوجاراتي هندي» ومؤسس «إنترفيث أمريكا» ورئيسها — مصدر مستقل ثانٍ يثبت إسماعيليته."
  en: "Carnegie Corporation profile of Eboo Patel in its Great Immigrants series; it says he was born in Mumbai, India, and is 'an Ismaili Muslim of Gujarati Indian heritage' and founder and president of Interfaith America — a second independent attestation of his Ismaili affiliation."
  es: "Perfil de Eboo Patel publicado por la Carnegie Corporation en su serie Grandes Inmigrantes; en él se afirma que nació en Bombay, India, y que es \"un musulmán ismaelita de ascendencia india gujarati\", además de fundador y presidente de Interfaith America, lo que constituye una segunda certificación independiente de su afiliación ismaelita."
  fr: "Le profil d'Eboo Patel par la Carnegie Corporation dans sa série « Grands Immigrants » indique qu'il est né à Mumbai, en Inde, qu'il est « un musulman ismaélien d'origine indienne gujarati » et fondateur et président d'Interfaith America — une deuxième attestation indépendante de son appartenance à l'islam."
  ur: "کارنیگی کارپوریشن کی اپنی عظیم تارکین وطن سیریز میں ایبو پٹیل کی پروفائل؛ اس میں کہا گیا ہے کہ وہ ممبئی، ہندوستان میں پیدا ہوا تھا، اور 'گجراتی ہندوستانی ورثے کا ایک اسماعیلی مسلمان' ہے اور بین المذاہب امریکہ کے بانی اور صدر ہیں - ان کی اسماعیلی وابستگی کی دوسری آزاد تصدیق۔"
  tr: "Carnegie Enstitüsü'nün Ibbo Patel dosyasında \"Büyük Göçmenler\" arasında yer alıyor; Mumbai, Hindistan'da doğduğunu, \"Gujarati kökenli İsmaili Müslüman\" olduğunu ve İsmaili kökenini kanıtlayan ikinci bağımsız kaynak olan \"Interfaith America\"nın kurucusu ve başkanı olduğunu söylüyor."
  id: "Berkas Carnegie Institution tentang Ibbo Patel di antara \"Imigran Besar\"; ia mengatakan bahwa ia lahir di Mumbai, India, adalah \"Muslim Ismaili asal India Gujarati,\" dan pendiri serta presiden \"Interfaith America\" — sumber independen kedua yang membuktikan asal-usul Ismailinya."
