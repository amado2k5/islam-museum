summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمر موسى يارادوا؛ تُستخدم لوقائع الكيان فقط. تروي دراسته الكيمياء في جامعة أحمدو بيلو، وعمله معلّما ومحاضرا ثم في الشركات، وحكومته ولاية كاتسينا (1999–2007) واعتماد الولاية الشريعة في أغسطس 2000، ورئاسته نيجيريا من 29 مايو 2007 حتى وفاته في أبوفيلا بأبوجا في 5 مايو 2010، ودفنه الإسلامي في كاتسينا في 6 مايو."
  en: "English Wikipedia article on Umaru Musa Yar'Adua; used for entity facts only. It recounts his chemistry studies at Ahmadu Bello University, his work as a teacher and lecturer and then in business, his governorship of Katsina State (1999–2007) and the state's adoption of sharia in August 2000, his presidency of Nigeria from 29 May 2007 until his death at Aso Villa, Abuja, on 5 May 2010, and his Islamic burial in Katsina on 6 May."
  es: "Artículo de la Wikipedia en inglés sobre Umaru Musa Yar'Adua; utilizado únicamente para datos sobre la persona. Relata sus estudios de química en la Universidad Ahmadu Bello, su trabajo como profesor y conferenciante, y posteriormente en el mundo empresarial, su mandato como gobernador del estado de Katsina (1999-2007) y la adopción de la sharia por parte del estado en agosto de 2000, su presidencia de Nigeria desde el 29 de mayo de 2007 hasta su fallecimiento en Aso Villa, Abuja, el 5 de mayo de 2010, y su entierro islámico en Katsina el 6 de mayo."
  fr: "Article de Wikipédia en anglais sur Umaru Musa Yar'Adua; utilisé uniquement pour les informations sur l'entité. Il relate ses études de chimie à l'université Ahmadu Bello, son travail d'enseignant et de conférencier puis dans les affaires, son mandat de gouverneur de l'État de Katsina (1999-2007) et l'adoption de la charia par cet État en août 2000, sa présidence du Nigeria du 29 mai 2007 jusqu'à sa mort à Aso Villa, Abuja, le 5 mai 2010, et ses funérailles islamiques à Katsina le 6 mai."
  ur: "عمرو موسیٰ یار عدوا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں احمدو بیلو یونیورسٹی میں ان کی کیمسٹری کی تعلیم، بطور استاد اور لیکچرر اور پھر کاروبار میں ان کے کام، کاٹسینا اسٹیٹ کی ان کی گورنری (1999–2007) اور اگست 2000 میں ریاست کی طرف سے شریعت کو اپنانے، 29 مئی 2007 سے نائجیریا کی صدارت، ابوجا، 2007 میں ان کی وفات تک، اس کی اسلامی تعلیمات کا ذکر ہے۔ 6 مئی کو کٹسینا میں تدفین۔"
