  ar: "مقالة ويكيبيديا الإنجليزية عن عمر موسى يارادوا؛ تُستخدم لوقائع الكيان فقط. تروي دراسته الكيمياء في جامعة أحمدو بيلو، وعمله معلّما ومحاضرا ثم في الشركات، وحكومته ولاية كاتسينا (1999–2007) واعتماد الولاية الشريعة في أغسطس 2000، ورئاسته نيجيريا من 29 مايو 2007 حتى وفاته في أبوفيلا بأبوجا في 5 مايو 2010، ودفنه الإسلامي في كاتسينا في 6 مايو."
  en: "English Wikipedia article on Umaru Musa Yar'Adua; used for entity facts only. It recounts his chemistry studies at Ahmadu Bello University, his work as a teacher and lecturer and then in business, his governorship of Katsina State (1999–2007) and the state's adoption of sharia in August 2000, his presidency of Nigeria from 29 May 2007 until his death at Aso Villa, Abuja, on 5 May 2010, and his Islamic burial in Katsina on 6 May."
