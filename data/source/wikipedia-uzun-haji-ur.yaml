summary:
  ar: "مقالة ويكيبيديا الأردية عن حاجی ازون خیر ⁦(أوزون حاجي)⁩؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه كان شيخ طريقة صوفية نقشبندية، وهي في ذلك مترجمة عن المقالة الإنجليزية."
  en: "Urdu Wikipedia article on Uzun-Haji (Hajji Uzun Khayr); used for entity facts only. It describes him as sheikh of a Naqshbandi Sufi tariqa, following the English article, of which it is a translation."
  es: "Artículo de Wikipedia en urdu sobre Uzun-Haji (Hajji Uzun Khayr); Se utiliza únicamente para hechos de entidades. Lo describe como jeque de una tariqa sufí Naqshbandi, siguiendo el artículo en inglés, del cual es una traducción."
  fr: "Article Wikipédia en ourdou sur Uzun-Haji (Hajji Uzun Khayr); utilisé uniquement pour les faits d’entité. Il le décrit comme cheikh d'une tariqa soufie Naqshbandi, à la suite de l'article anglais dont il est une traduction."
  ur: "اردو ویکیپیڈیا مضمون ازون-حاجی ⁦(حاجی ازون خیر)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ انگریزی مضمون کے بعد، جس کا یہ ترجمہ ہے۔"
  tr: "Hacı Uzun Khair (Uzun Haci) hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Onu Nakşibendi Sufi tarikatının şeyhi olarak tanımlar, bu İngilizce makaleden çevrilmiştir."
  id: "Artikel Wikipedia Urdu tentang Haji Uzun Khair (Uzun Haji); digunakan hanya untuk fakta entitas tersebut. Artikel ini menggambarkannya sebagai sheikh dari tarekat Sufi Naqshbandi, yang diterjemahkan dari artikel bahasa Inggris."
