  en: "Encyclopedia article on Haxhi Zeka (1832–1902), the Albanian national leader from Peja: his part in organizing the League of Prizren, his military command at Gjakova and in the defence of Plav and Gusinje, his chairmanship of the League of Peja in 1899, and his assassination in 1902."
