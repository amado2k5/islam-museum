reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full at the recorded revision on 26 October 2026; the article cites Youm7 (2020, 2022) and the Aqidati newspaper (2024) for the biography and the anthem. It gives him as born in Cairo in 1921, a lyric poet nicknamed 'Poet of Tawhid', author of the 1956 anthem that later became Libya's national anthem, holder of the Order of the Republic (first class), and as having died at dawn on 13 March 1977 after returning from a youth conference in Libya. It makes no statement of a school of law or creed for him in its text; its categories file him among Egyptian poets and writers from Cairo."
