summary:
  ar: "مقالة ويكيبيديا العربية عن الشاعر الغنائي المصري عبد الله شمس الدين (1921–1977)؛ تُستخدم لوقائع الكيان فقط. تروي مولده بالقاهرة ودراسته في الأزهر وعمله مستشارا ثقافيا بالمجلس الأعلى للشبان المسلمين، وتأليفه نشيد «الله أكبر فوق كيد المعتدي» سنة 1956، ودواوينه، ووسام الجمهورية الذي ناله، ووفاته في 13 مارس 1977."
  en: "Arabic Wikipedia article on the Egyptian lyric poet Abdullah Shams El-Din (1921–1977); used for entity facts only. It recounts his birth in Cairo, his studies at al-Azhar, his post as cultural adviser to the Supreme Council for Muslim Youth, his writing of the anthem 'Allah Akbar fawqa kayd al-mu'tadi' in 1956, his poetry collections, the Order of the Republic he received, and his death on 13 March 1977."
  es: "Artículo en árabe de la Wikipedia sobre el poeta lírico egipcio Abdullah Shams El-Din (1921-1977); utilizado únicamente para datos biográficos. Relata su nacimiento en El Cairo, sus estudios en Al-Azhar, su cargo como asesor cultural del Consejo Supremo para la Juventud Musulmana, la composición del himno «Allah Akbar fawqa kayd al-mu'tadi» en 1956, sus colecciones de poesía, la Orden de la República que recibió y su fallecimiento el 13 de marzo de 1977."
  fr: "Article de Wikipédia en arabe sur le poète lyrique égyptien Abdullah Shams El-Din (1921-1977); utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance au Caire, ses études à al-Azhar, son poste de conseiller culturel auprès du Conseil suprême de la jeunesse musulmane, la composition de l'hymne « Allah Akbar fawqa kayd al-mu'tadi » en 1956, ses recueils de poésie, l'Ordre de la République qu'il a reçu et sa mort le 13 mars 1977."
  ur: "مصری گیت شاعر عبداللہ شمس الدین (1921–1977) پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں قاہرہ میں ان کی پیدائش، الازہر میں ان کی تعلیم، مسلم نوجوانوں کی سپریم کونسل کے ثقافتی مشیر کے طور پر ان کا عہدہ، 1956 میں ان کا ترانہ 'اللہ اکبر فقہا کید المعتدی' کی تحریر، ان کے شعری مجموعے، آرڈر آف دی ریپبلک انہیں موصول ہوا اور 13 مارچ 1977 کو ان کی وفات کا ذکر ہے۔"
  tr: "Mısırlı lirik şair Abdullah Şems El-Din (1921–1977) hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kahire'deki doğumunu, El-Ezher'deki eğitimini, Müslüman Gençlik Yüksek Konseyi'nde kültürel danışmanlık çalışmalarını, 1956'da 'Allahu Ekber Saldırganın Planları Üzerine' marşını bestelemesini, şiir koleksiyonlarını, aldığı Cumhuriyet Nişanını ve 13 Mart 1977'deki ölümünü anlatır."
  id: "Artikel Wikipedia Arab tentang penyair lirik Mesir Abdullah Shams El-Din (1921–1977); hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Kairo, studinya di Al-Azhar, pekerjaannya sebagai penasihat budaya di Dewan Tertinggi Pemuda Muslim, komposisinya atas lagu kebangsaan 'Allahu Akbar atas Skema Sang Agresor' pada tahun 1956, kumpulan puisinya, Ordo Republik yang diterimanya, dan kematiannya pada 13 Maret 1977."
