summary:
  ar: "مقالة ويكيبيديا العربية عن الشاعر الغنائي المصري عبد الله شمس الدين (1921–1977)؛ تُستخدم لوقائع الكيان فقط. تروي مولده بالقاهرة ودراسته في الأزهر وعمله مستشارا ثقافيا بالمجلس الأعلى للشبان المسلمين، وتأليفه نشيد «الله أكبر فوق كيد المعتدي» سنة 1956، ودواوينه، ووسام الجمهورية الذي ناله، ووفاته في 13 مارس 1977."
  en: "Arabic Wikipedia article on the Egyptian lyric poet Abdullah Shams El-Din (1921–1977); used for entity facts only. It recounts his birth in Cairo, his studies at al-Azhar, his post as cultural adviser to the Supreme Council for Muslim Youth, his writing of the anthem 'Allah Akbar fawqa kayd al-mu'tadi' in 1956, his poetry collections, the Order of the Republic he received, and his death on 13 March 1977."
