summary:
  ar: "حساب الأستاذة رشيدة لميني الرسمي على تيك توك (@rachidalammini)؛ تصف نبذته الحساب بأنه «القناة الرسمية للأستاذة رشيدة لميني» وتربط قناتها على يوتيوب وحسابها على إنستغرام، وتنشر مقاطع دروسها في تدبر القرآن وموضوعات السكينة والأسرة."
  en: "Ustadha Rachida Lammini's official TikTok account (@rachidalammini); its bio calls it 'the official channel of Ustadha Rachida Lammini' and links her YouTube channel and Instagram account, and it publishes clips of her lessons on Qur'an reflection, inner peace and family themes."
  es: "La cuenta oficial de TikTok de Ustadha Rachida Lammini (@rachidalammini); su biografía la describe como \"el canal oficial de Ustadha Rachida Lammini\" y enlaza con su canal de YouTube y su cuenta de Instagram, y publica fragmentos de sus lecciones sobre la reflexión del Corán, la paz interior y temas familiares."
  fr: "Le compte TikTok officiel d'Ustadha Rachida Lammini (@rachidalammini); sa bio le décrit comme « la chaîne officielle d'Ustadha Rachida Lammini » et renvoie vers sa chaîne YouTube et son compte Instagram; il publie des extraits de ses leçons sur la réflexion coranique, la paix intérieure et les thèmes familiaux."
  ur: "استاد راچیدا لمینی کا آفیشل ٹِک ٹِک اکاؤنٹ (@rachidalammini)؛ اس کا بائیو اسے 'استادا رچیدہ لمینی کا آفیشل چینل' کہتا ہے اور اس کے یوٹیوب چینل اور انسٹاگرام اکاؤنٹ کو لنک کرتا ہے، اور یہ قرآن کی عکاسی، اندرونی امن اور خاندانی موضوعات پر اس کے اسباق کے کلپس شائع کرتا ہے۔"
  tr: "Profesör Rachida Lamini'nin resmi TikTok hesabı (@rachidalammini); profilinde hesabı \"Profesör Rachida Lamini'nin resmi kanalı\" olarak tanımlıyor, YouTube kanalı ve Instagram hesabını bağlıyor ve Kur'an tefekkürü ile huzur ve aile konularındaki derslerinden klipler paylaşıyor."
  id: "Akun TikTok resmi Profesor Rachida Lamini (@rachidalammini); profilnya menggambarkan akun tersebut sebagai \"saluran resmi Profesor Rachida Lamini,\" yang menghubungkan saluran YouTube dan akun Instagram-nya, serta membagikan cuplikan pelajaran tentang kontemplasi Al-Qur'an dan topik ketenangan serta keluarga."
