label: { en: "B. G. Martin, 'Muslim Politics and Resistance to Colonial Rule: Shaykh Uways b. Muhammad al-Barawi and the Qadiriya Brotherhood in East Africa' (Journal of African History, 1969)" }
summary:
  ar: "دراسة ب. ج. مارتن في مجلة التاريخ الأفريقي ⁦(مطبعة جامعة كامبريدج، 1969، المجلد 10، العدد 3، ص 471-486)⁩ عن الشيخ أويس بن محمد البراوي (1847-1909) بوصفه قائدا مهما للطريقة القادرية في جنوب الصومال وزنجبار وساحل شرق أفريقيا من كينيا إلى موزمبيق ومؤسس فرعها الأويسية، وعن نشاطه الدعوي الواسع واغتياله سنة 1909 على أيدي أتباع الطريقة الصالحية المنافسة."
  en: "B. G. Martin's study in the Journal of African History (Cambridge University Press, 1969, vol. 10, no. 3, pp. 471–486) of Shaykh Uways b. Muhammad al-Barawi (1847–1909) as an important leader of the Qadiriyya brotherhood in southern Somalia, on Zanzibar and along the East African coast from Kenya to Mozambique and founder of its Uwaysiyya branch, his considerable missionary activity, and his assassination in 1909 by representatives of the rival Salihiyya brotherhood."
  es: "El estudio de BG Martin en el Journal of African History (Cambridge University Press, 1969, vol. 10, n.º 3, págs. 471-486) sobre Shaykh Uways b. Muhammad al-Barawi (1847-1909) como un importante líder de la hermandad Qadiriyya en el sur de Somalia, en Zanzíbar y a lo largo de la costa de África Oriental desde Kenia hasta Mozambique y fundador de su rama Uwaysiyya, su considerable actividad misionera y su asesinato en 1909 por representantes de la hermandad rival Salihiyya."
  fr: "L'étude de BG Martin dans le Journal of African History (Cambridge University Press, 1969, vol. 10, no. 3, pp. 471–486) sur le cheikh Uways b. Muhammad al-Barawi (1847–1909) en tant que chef important de la confrérie Qadiriyya dans le sud de la Somalie, à Zanzibar et le long de la côte est-africaine du Kenya au Mozambique et fondateur de sa branche Uwaysiyya, son importante activité missionnaire et son assassinat en 1909 par des représentants de la confrérie rivale Salihiyya."
  ur: "بی جی مارٹن کا مطالعہ جرنل آف افریقن ہسٹری ⁦(کیمبرج یونیورسٹی پریس، 1969، والیم 10، نمبر 3، صفحہ 471–486)⁩ شیخ اویس ب۔ محمد البراوی (1847–1909) جنوبی صومالیہ میں، زنجبار پر اور مشرقی افریقی ساحل کے ساتھ ساتھ کینیا سے موزمبیق تک قادریہ بھائی چارے کے ایک اہم رہنما کے طور پر اور اس کی اویسیہ شاخ کے بانی، ان کی قابل ذکر تبلیغی سرگرمی، اور 1909 میں صالحی برادران کے نمائندوں کے ہاتھوں ان کا قتل۔"
  tr: "B. J. Martin'in Journal of African History (Cambridge University Press, 1969, Cilt 10, Sayı 3, ss. 471-486) dergisindeki çalışması, Şeyh Uwais bin Muhammed Al-Barawi (1847-1909) hakkında, güney Somali, Zanzibar ve Kenya'dan Mozambik'e kadar Doğu Afrika kıyısında Kadiriyya tarikatının önemli bir lideri ve Owaisi kolunun kurucusu olarak konu alır; ayrıca geniş dini faaliyetleri ve 1909'da rakip Salihi tarikatının takipçileri tarafından suikasta uğraması konusudur."
  id: "Studi B. J. Martin dalam Journal of African History (Cambridge University Press, 1969, Vol. 10, No. 3, hlm. 471-486) tentang Sheikh Uwais bin Muhammad Al-Barawi (1847-1909) sebagai pemimpin penting ordo Qadiriyya di Somalia selatan, Zanzibar, dan pesisir Afrika Timur dari Kenya hingga Mozambik serta pendiri cabang Owaisi, serta aktivitas keagamaannya yang luas dan pembunuhannya pada tahun 1909 oleh pengikut ordo Salihi saingan."
title: "Muslim Politics and Resistance to Colonial Rule: Shaykh Uways b. Muhammad Al-Barawi and the Qadiriya Brotherhood in East Africa"
