  ar: "دراسة ب. ج. مارتن في مجلة التاريخ الأفريقي (مطبعة جامعة كامبريدج، 1969، المجلد 10، العدد 3، ص 471-486) عن الشيخ أويس بن محمد البراوي (1847-1909) بوصفه قائدا مهما للطريقة القادرية في جنوب الصومال وزنجبار وساحل شرق أفريقيا من كينيا إلى موزمبيق ومؤسس فرعها الأويسية، وعن نشاطه الدعوي الواسع واغتياله سنة 1909 على أيدي أتباع الطريقة الصالحية المنافسة."
  en: "B. G. Martin's study in the Journal of African History (Cambridge University Press, 1969, vol. 10, no. 3, pp. 471–486) of Shaykh Uways b. Muhammad al-Barawi (1847–1909) as an important leader of the Qadiriyya brotherhood in southern Somalia, on Zanzibar and along the East African coast from Kenya to Mozambique and founder of its Uwaysiyya branch, his considerable missionary activity, and his assassination in 1909 by representatives of the rival Salihiyya brotherhood."
