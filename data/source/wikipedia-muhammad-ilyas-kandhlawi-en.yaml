  ar: "مقالة ويكيبيديا الإنجليزية عن محمد إلياس الكاندهلوي (1885 – 13 تموز 1944)، عالم الحركة الديوبندية ومؤسس جماعة التبليغ سنة 1925 في ميوات؛ تعطي مولده في متنها بسنة 1303هـ (1885/1886) في كاندهلة وفي صندوقها بسنة 1302هـ، وتذكر أنه عاش ودرس عند رشيد أحمد الكنكوهي ودرس عند محمود حسن الديوبندي في ديوبند، ويحمل صندوقها حقول السنة والحنفية وقائمة شيوخ التلمذة."
  en: "The English Wikipedia article on Muhammad Ilyas Kandhlawi (1885 – 13 July 1944), the scholar of the Deobandi movement who founded the Tablighi Jamaat in 1925 in Mewat; its body gives his birth in 1303 AH (1885/1886) at Kandhla while its infobox gives 1302 AH, it states that he lived with and studied under Rashid Ahmad Gangohi and studied under Mahmud Hasan Deobandi at Deoband, and its infobox carries Sunni and Hanafi fields and a disciple-of list."
