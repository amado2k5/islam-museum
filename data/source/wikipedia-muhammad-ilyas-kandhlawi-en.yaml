summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد إلياس الكاندهلوي ⁦(1885 – 13 تموز 1944)⁩، عالم الحركة الديوبندية ومؤسس جماعة التبليغ سنة 1925 في ميوات؛ تعطي مولده في متنها بسنة 1303هـ (1885/1886) في كاندهلة وفي صندوقها بسنة 1302هـ، وتذكر أنه عاش ودرس عند رشيد أحمد الكنكوهي ودرس عند محمود حسن الديوبندي في ديوبند، ويحمل صندوقها حقول السنة والحنفية وقائمة شيوخ التلمذة."
  en: "The English Wikipedia article on Muhammad Ilyas Kandhlawi (1885 – 13 July 1944), the scholar of the Deobandi movement who founded the Tablighi Jamaat in 1925 in Mewat; its body gives his birth in 1303 AH (1885/1886) at Kandhla while its infobox gives 1302 AH, it states that he lived with and studied under Rashid Ahmad Gangohi and studied under Mahmud Hasan Deobandi at Deoband, and its infobox carries Sunni and Hanafi fields and a disciple-of list."
  es: "El artículo de la Wikipedia en inglés sobre Muhammad Ilyas Kandhlawi (1885 – 13 de julio de 1944), el erudito del movimiento Deobandi que fundó el Tablighi Jamaat en 1925 en Mewat; su cuerpo indica que nació en 1303 AH (1885/1886) en Kandhla, mientras que su ficha informativa indica 1302 AH, afirma que vivió con y estudió con Rashid Ahmad Gangohi y estudió con Mahmud Hasan Deobandi en Deoband, y su ficha informativa contiene campos sunitas y hanafi y una lista de discípulos."
  fr: "L'article de Wikipédia en anglais sur Muhammad Ilyas Kandhlawi (1885 – 13 juillet 1944), l'érudit du mouvement Deobandi qui a fondé la Tablighi Jamaat en 1925 à Mewat; son corps indique sa naissance en 1303 AH (1885/1886) à Kandhla tandis que son infobox indique 1302 AH, il précise qu'il a vécu avec et étudié sous la direction de Rashid Ahmad Gangohi et a étudié sous la direction de Mahmud Hasan Deobandi à Deoband, et son infobox comporte des champs sunnite et hanafite et une liste de disciples."
  ur: "دیوبندی تحریک کے اسکالر محمد الیاس کاندھلوی ⁦(1885 - 13 جولائی 1944)⁩ پر انگریزی ویکیپیڈیا کا مضمون، جس نے 1925 میں میوات میں تبلیغی جماعت کی بنیاد رکھی۔ اس کا جسم 1303 ہجری (1885/1886) میں کاندھلہ میں پیدا ہوا ہے جبکہ اس کا معلومات خانہ 1302 ہجری بتاتا ہے، اس میں بتایا گیا ہے کہ اس نے رشید احمد گنگوہی کے ساتھ رہ کر تعلیم حاصل کی اور دیوبند میں محمود حسن دیوبندی سے تعلیم حاصل کی، اور اس کے معلوماتی خانے میں سنی اور حنفی شعبوں کی فہرست موجود ہے۔"
