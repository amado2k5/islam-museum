reliability_note: "Distinct from source/tafsir-ibn-kathir (Dar al-Andalus), which records a different edition. This record covers the harvest item tafsir/tafsir-ibn-kathir/AAlexandrina-024188 (608 scanned pages, OCR). Cite as printed page numbers, e.g. p. 119 for the commentary on 2:81. The title page names the work, the author (d. 774 AH), the collation against manuscripts at Dar al-Kutub al-Misriyya and the correcting scholars; it does not state the volume number, editor, city or year in the OCR, and the offset between scan pages and printed pages is not established. The OCR of the opening pages is poor and the library stamp reads 1998 (a gift to the library). Citations from this copy are paraphrased in the museum's own words."
