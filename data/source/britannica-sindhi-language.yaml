summary:
  ar: "الصفحة «Sindhi language» في Encyclopaedia Britannica؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: اللغات المكتوبة بالحرف العربي وحروفها المضافة."
  en: "The page \"Sindhi language\" (Encyclopaedia Britannica), named in a research file supplied to the museum on 21 November 2026; the museum did not open the page, and the founder approved using the file without re-verification. Used for: the languages written in the Arabic script and their added letters."
  ur: "صفحہ «Sindhi language» (Encyclopaedia Britannica)؛ یہ عجائب گھر کو 21 نومبر 2026ء کو دی گئی تحقیقی فائل میں مذکور ہے، عجائب گھر نے صفحہ نہیں کھولا اور بانی نے دوبارہ تصدیق کے بغیر فائل کے استعمال کی منظوری دی۔ استعمال: عربی رسم الخط میں لکھی جانے والی زبانیں اور ان کے اضافی حروف۔"
  fr: "La page « Sindhi language » (Encyclopaedia Britannica), citée dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisée pour : les langues écrites en alphabet arabe et leurs lettres ajoutées."
  es: "La página «Sindhi language» (Encyclopaedia Britannica), citada en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el archivo sin volver a verificar. Usada para: las lenguas escritas en escritura árabe y sus letras añadidas."
  tr: "Encyclopaedia Britannica'daki \"Sindhi dili\" sayfası; 21 Kasım 2026'da müzeye sunulan bir araştırma dosyasında bahsedilmiştir, ancak müze sayfayı açmamış ve kurucu dosyanın kullanımını yeniden doğrulamadan onaylamıştır. Kullanım: Arap alfabesiyle yazılmış diller ve eklenmiş harfler."
  id: "Halaman \"Bahasa Sindhi\" di Encyclopaedia Britannica; disebutkan dalam berkas penelitian yang dikirim ke museum pada 21 November 2026, tetapi museum tidak membuka halaman tersebut, dan pendiri menyetujui penggunaan berkas tersebut tanpa verifikasi ulang. Digunakan dalam: bahasa yang ditulis dalam aksara Arab dan huruf-huruf tambahannya."
