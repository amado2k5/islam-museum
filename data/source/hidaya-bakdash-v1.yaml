summary:
  ar: "المجلد الأول من الهداية شرح بداية المبتدي للإمام علي بن أبي بكر المرغيناني ⁦(511-593هـ)⁩، محقق على أكثر من عشرين نسخة خطية، بتحقيق أ.د. سائد بكداش، دار السراج، المدينة المنورة، الطبعة الأولى 1440هـ/2019م. يتقدمه مقدمة المحقق ودراسة عن المؤلف وكتابه: ترجمته وشيوخه وتلاميذه ومصنفاته، وثناء العلماء على الهداية، ومنهج المرغيناني في بداية المبتدي والهداية واصطلاحاته، ومصادره، وشروح الهداية."
  en: "Volume 1 of al-Hidaya Sharh Bidayat al-Mubtadi by Imam Ali ibn Abi Bakr al-Marghinani (511-593 AH), edited from more than twenty manuscripts by Prof. Sa'id Bakdash, Dar al-Siraj, Medina, first edition 1440 AH / 2019. It opens with the editor's introduction and a study of the author and the book: his life, teachers, students and works, scholars' praise of al-Hidaya, al-Marghinani's method and terms in Bidayat al-Mubtadi and al-Hidaya, his sources, and the commentaries on al-Hidaya."
