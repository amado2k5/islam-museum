summary:
  ar: "مقالة ويكيبيديا الأردية عن حميدة جوانشير؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تعطي تاريخيها 19 يناير 1873 و6 فبراير 1955 وتصفها بأنها محسنة وناشطة في حقوق المرأة، وتروي نشأتها في كهريزلي وزواجها الأول من إبراهيم داوتداروف. لا تذكر شيئًا عن مذهبها."
  en: "Urdu Wikipedia article on Hamida Javanshir; used for entity facts only. A short article giving her dates as 19 January 1873 – 6 February 1955, describing her as a philanthropist and women's-rights activist, and recounting her Kahrizli upbringing and first marriage to Ibrahim Davatdarov. It makes no statement about her school of religion."
  es: "Artículo de Wikipedia en urdu sobre Hamida Javanshir; utilizado únicamente para obtener información sobre la persona. Un breve artículo que indica sus fechas de nacimiento y fallecimiento: 19 de enero de 1873 - 6 de febrero de 1955, la describe como filántropa y activista por los derechos de la mujer, y relata su infancia en Kahrizli y su primer matrimonio con Ibrahim Davatdarov. No menciona su escuela religiosa."
  fr: "Article de Wikipédia en ourdou sur Hamida Javanshir; utilisé uniquement à titre informatif. Ce court article indique ses dates de naissance (19 janvier 1873 – 6 février 1955), la décrit comme une philanthrope et une militante des droits des femmes, et relate son enfance à Kahrizli et son premier mariage avec Ibrahim Davatdarov. Il ne mentionne pas son appartenance religieuse."
  ur: "حمیدہ جوانشیر پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون جس میں اس کی تاریخیں 19 جنوری 1873 - 6 فروری 1955 ہے، جس میں اسے ایک انسان دوست اور خواتین کے حقوق کی کارکن کے طور پر بیان کیا گیا ہے، اور اس کی کہریزلی پرورش اور ابراہیم داوت داروف سے پہلی شادی کا ذکر کیا گیا ہے۔ یہ اس کے مکتبہ فکر کے بارے میں کوئی بیان نہیں دیتا۔"
  tr: "Hamida Jawanshir hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kısa bir makale, tarihlerini 19 Ocak 1873 ve 6 Şubat 1955 olarak belirtir, onu hayırsever ve kadın hakları aktivisti olarak tanımlar, Kahrizli'deki yetiştirilme tarzı ve ilk evliliği İbrahim Dautdarov ile anlatılır. Mezhebi hakkında hiçbir şey belirtilmemektedir."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Hamida Jawanshir; digunakan hanya untuk fakta entitas. Artikel singkat yang mencantumkan tanggalnya sebagai 19 Januari 1873 dan 6 Februari 1955, menggambarkannya sebagai dermawan dan aktivis hak-hak perempuan, serta menceritakan masa kecilnya di Kahrizli dan pernikahan pertamanya dengan Ibrahim Dautdarov. Artikel tersebut tidak menyebutkan apa pun tentang sektenya."
