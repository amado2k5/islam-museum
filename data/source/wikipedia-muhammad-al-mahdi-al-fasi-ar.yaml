summary:
  ar: "مقالة ويكيبيديا العربية عن محمد المهدي الفاسي؛ تُستخدم لوقائع الكيان فقط. تصفه في صدرها بأنه «صوفي معروف وكاتب سيرة ومؤرخ من فاس»، وتذكر ميلاده بالقصر الكبير في 17 أيار 1624 ووفاته في 20 شباط 1698 ودفنه في ضريح جده أبي المحاسن يوسف الفاسي ومؤلفاته في التصوف والسير."
  en: "Arabic Wikipedia article on Muhammad al-Mahdi al-Fasi; used for entity facts only. Its lead calls him a well-known Sufi (ṣūfī maʿrūf), biographer and historian from Fes; it gives his birth at Ksar al-Kebir on 17 May 1624, his death on 20 February 1698, his burial in the mausoleum of his great-grandfather Abu al-Mahasin Yusuf al-Fasi, and his works. It is one of the two independent texts behind the person record's sufi/documented settlement."
