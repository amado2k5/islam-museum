summary:
  ar: "مقالة ويكيبيديا العربية عن محمد المهدي الفاسي؛ تُستخدم لوقائع الكيان فقط. تصفه في صدرها بأنه «صوفي معروف وكاتب سيرة ومؤرخ من فاس»، وتذكر ميلاده بالقصر الكبير في 17 أيار 1624 ووفاته في 20 شباط 1698 ودفنه في ضريح جده أبي المحاسن يوسف الفاسي ومؤلفاته في التصوف والسير."
  en: "Arabic Wikipedia article on Muhammad al-Mahdi al-Fasi; used for entity facts only. Its lead calls him a well-known Sufi (ṣūfī maʿrūf), biographer and historian from Fes; it gives his birth at Ksar al-Kebir on 17 May 1624, his death on 20 February 1698, his burial in the mausoleum of his great-grandfather Abu al-Mahasin Yusuf al-Fasi, and his works. It is one of the two independent texts behind the person record's sufi/documented settlement."
  es: "Artículo de Wikipedia en árabe sobre Muhammad al-Mahdi al-Fasi; utilizado únicamente para datos sobre la persona. Su introducción lo describe como un conocido sufí (ṣūfī maʿrūf), biógrafo e historiador de Fez; indica su nacimiento en Ksar al-Kebir el 17 de mayo de 1624, su muerte el 20 de febrero de 1698, su entierro en el mausoleo de su bisabuelo Abu al-Mahasin Yusuf al-Fasi y sus obras. Es uno de los dos textos independientes que respaldan la información sobre su sufismo y su asentamiento documentado."
  fr: "Article de Wikipédia en arabe sur Muhammad al-Mahdi al-Fasi; utilisé uniquement pour les informations factuelles. Son introduction le présente comme un soufi (ṣūfī maʿrūf) renommé, biographe et historien originaire de Fès; elle indique sa naissance à Ksar al-Kebir le 17 mai 1624, sa mort le 20 février 1698, son inhumation dans le mausolée de son arrière-grand-père Abu al-Mahasin Yusuf al-Fasi, ainsi que ses œuvres. Il s'agit de l'un des deux textes indépendants à l'origine de la documentation soufie relative à cette personne."
