  id: "The Normative Study (Princeton, 1970) tentang Kontrak Qarad dan Mudarabah dalam Yurisprudensi dan Praktik; ditulis oleh penulis materi KIRAD dalam Ensiklopedia Islam kedua yang dibaca untuk catatan ini (Volume Lima, hlm. 129-131)."
