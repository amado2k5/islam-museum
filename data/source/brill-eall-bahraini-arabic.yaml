summary:
  ar: "صفحة «Bahraini Arabic» لدى Brill (EALL Online)، EALL Online, first online 30 May 2011, updated 1 Apr 2018. لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملف بحث قدمه المؤسس إلى المتحف ووافق على استعماله في 21 نوفمبر 2026. يُستشهد بها في: التصنيف والتجميع، الأصوات، الصرف، النحو، المفردات."
  en: "The page \"Bahraini Arabic\" (Brill (EALL Online); EALL Online, first online 30 May 2011, updated 1 Apr 2018). The museum did not open it itself: its content is known from a research file supplied to the museum by the founder, who approved its use on 21 November 2026. Cited for: classification and grouping, phonology, morphology, syntax, lexicon."
  ur: "صفحہ «Bahraini Arabic»، Brill (EALL Online)، EALL Online, first online 30 May 2011, updated 1 Apr 2018۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کا مواد بانی کی فراہم کردہ تحقیقی فائل سے معلوم ہوا، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ ان کے لیے دیا گیا: درجہ بندی اور گروہ بندی، صوتیات، صرف، نحو، ذخیرہ الفاظ۔"
  fr: "La page « Bahraini Arabic » (Brill (EALL Online) ; EALL Online, first online 30 May 2011, updated 1 Apr 2018). Le musée ne l'a pas ouverte lui-même : son contenu est connu par un dossier de recherche fourni au musée par le fondateur, qui en a approuvé l'usage le 21 novembre 2026. Citée pour : la classification et le regroupement, la phonologie, la morphologie, la syntaxe, le lexique."
  es: "La página «Bahraini Arabic» (Brill (EALL Online); EALL Online, first online 30 May 2011, updated 1 Apr 2018). El museo no la abrió por sí mismo: su contenido se conoce por un archivo de investigación entregado al museo por el fundador, que aprobó su uso el 21 de noviembre de 2026. Citada para: la clasificación y la agrupación, la fonología, la morfología, la sintaxis, el léxico."
  tr: "Brill'deki \"Bahreyn Arapçası\" sayfası (EALL Online), EALL Online, ilk olarak 30 Mayıs 2011'de çevrimiçi, 1 Nisan 2018'de güncellendi. Müze bunu kendisi açmadı; içeriği, kurucusunun müzeye gönderdiği ve 21 Kasım 2026'da kullanmayı kabul eden bir araştırma dosyasından biliniyordu. Sınıflandırma ve gruplama, fonetik, morfoloji, dilbilgisi, kelime dağarcığı gibi alanlarda atıfta bulunulmuştur."
  id: "Halaman \"Bahraini Arabic\" di Brill (EALL Online), EALL Online, pertama kali online 30 Mei 2011, diperbarui 1 Apr 2018. Museum tidak membukanya sendiri; isinya diketahui dari berkas penelitian yang diserahkan oleh pendiri museum, yang setuju menggunakannya pada 21 November 2026. Situs ini dikutip dalam: klasifikasi dan pengelompokan, fonetik, morfologi, tata bahasa, kosakata."
