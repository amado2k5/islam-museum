summary:
  ar: "مقالة ويكيبيديا العربية عن أرونا آصف علي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها في كالكا في 16 تموز 1909 باسم أرونا غانغولي ووفاتها في نيودلهي في 29 تموز 1996، وزواجها من آصف علي سنة 1928، ورفعها العلم سنة 1942 وعموديتها لدلهي وجوائزها."
  en: "Arabic Wikipedia article on Aruna Asaf Ali; used for entity facts only. It gives her birth at Kalka on 16 July 1909, with the birth name Aruna Ganguly, and her death at New Delhi on 29 July 1996, her 1928 marriage to Asaf Ali, her 1942 flag-hoisting, her Delhi mayorship and her awards."
  es: "Artículo de Wikipedia en árabe sobre Aruna Asaf Ali; utilizado únicamente para datos biográficos. Indica su nacimiento en Kalka el 16 de julio de 1909, con el nombre de Aruna Ganguly, su fallecimiento en Nueva Delhi el 29 de julio de 1996, su matrimonio con Asaf Ali en 1928, el izamiento de la bandera en 1942, su mandato como alcaldesa de Delhi y sus premios."
  fr: "Article de Wikipédia en arabe sur Aruna Asaf Ali; utilisé uniquement à titre informatif. Il indique sa naissance à Kalka le 16 juillet 1909 sous le nom d’Aruna Ganguly, son décès à New Delhi le 29 juillet 1996, son mariage avec Asaf Ali en 1928, la levée du drapeau en 1942, son mandat de maire de Delhi et les distinctions qu’elle a reçues."
  ur: "ارونا آصف علی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش 16 جولائی 1909 کو کالکا میں ہوئی، پیدائشی نام ارونا گنگولی کے ساتھ، اور اس کی موت 29 جولائی 1996 کو نئی دہلی میں، اس کی 1928 میں آصف علی سے شادی، اس کی 1942 میں پرچم کشائی، اس کی دہلی کی میئر شپ اور اس کے ایوارڈز۔"
  tr: "Aruna Asif Ali hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 16 Temmuz 1909'da Kalka'da doğduğu ve 29 Temmuz 1996'da Yeni Delhi'de öldüğü, 1928'de Asif Ali ile evlendiği, 1942'de bayrağı kaldırdığı ve Delhi ile ödüllerinin başkanı olarak atandığı belirtilmektedir."
  id: "Artikel Wikipedia Arab tentang Aruna Asif Ali; digunakan hanya untuk fakta entitas. Ia disebutkan lahir di Kalka pada 16 Juli 1909, sebagai Aruna Ganguly, meninggal di New Delhi pada 29 Juli 1996, menikah dengan Asif Ali pada tahun 1928, mengibarkan bendera pada tahun 1942, dan diangkat sebagai kepala Delhi beserta penghargaannya."
