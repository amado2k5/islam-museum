  ar: "مقالة ويكيبيديا الإنجليزية عن الطاهر الحداد؛ تُستخدم لوقائع الكيان فقط. تصفه بمؤلف ونقابي وباحث ومصلح تونسي (1899–1935)، درس الشريعة بالزيتونة وتخرج 1920، وصار من قادة الحركة النقابية، وألّف «امرأتنا في الشريعة والمجتمع» (1930)؛ وتسجل أن فتاوى من مؤسسة الزيتونة كفّرته وعدّته مرتدًا، وأنه مات في 7 ديسمبر 1935."
  en: "English Wikipedia article on Tahar Haddad; used for entity facts only. It describes a Tunisian author, trade unionist, scholar and reformer (1899–1935) who studied Islamic law at the Zitouna, graduated in 1920, became a leading labour spokesman and wrote Our Women in Shari'a and Society (1930); it records that fatwas from the Zitouna establishment declared him a heretic and apostate, and that he died on 7 December 1935."
