summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الطاهر الحداد؛ تُستخدم لوقائع الكيان فقط. تصفه بمؤلف ونقابي وباحث ومصلح تونسي (1899–1935)، درس الشريعة بالزيتونة وتخرج 1920، وصار من قادة الحركة النقابية، وألّف «امرأتنا في الشريعة والمجتمع» (1930)؛ وتسجل أن فتاوى من مؤسسة الزيتونة كفّرته وعدّته مرتدًا، وأنه مات في 7 ديسمبر 1935."
  en: "English Wikipedia article on Tahar Haddad; used for entity facts only. It describes a Tunisian author, trade unionist, scholar and reformer (1899–1935) who studied Islamic law at the Zitouna, graduated in 1920, became a leading labour spokesman and wrote Our Women in Shari'a and Society (1930); it records that fatwas from the Zitouna establishment declared him a heretic and apostate, and that he died on 7 December 1935."
  es: "Artículo de la Wikipedia en inglés sobre Tahar Haddad; utilizado únicamente para obtener información sobre la persona. Describe a un autor, sindicalista, erudito y reformador tunecino (1899-1935) que estudió derecho islámico en la Zitouna, se graduó en 1920, se convirtió en un destacado portavoz sindical y escribió Nuestras mujeres en la Sharia y la sociedad (1930). El artículo recoge que las fatuas de la institución de la Zitouna lo declararon hereje y apóstata, y que falleció el 7 de diciembre de 1935."
  fr: "Article de Wikipédia en anglais sur Tahar Haddad; utilisé uniquement à des fins d'information sur l'entité. Il décrit un auteur, syndicaliste, érudit et réformateur tunisien (1899-1935) qui étudia le droit islamique à la Zitouna, obtint son diplôme en 1920, devint un porte-parole syndical de premier plan et écrivit Nos femmes dans la charia et la société (1930); il indique que des fatwas de l'establishment de la Zitouna le déclaraient hérétique et apostat, et qu'il mourut le 7 décembre 1935."
  ur: "Tahar Haddad پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں تیونس کے ایک مصنف، ٹریڈ یونینسٹ، اسکالر اور مصلح (1899-1935) کی وضاحت کی گئی ہے جس نے زیتونہ میں اسلامی قانون کا مطالعہ کیا، 1920 میں گریجویشن کیا، لیبر کی ایک سرکردہ ترجمان بنی اور ہماری خواتین ان شریعت اینڈ سوسائٹی (1930) لکھی۔ اس میں درج ہے کہ زیتونہ کے اسٹیبلشمنٹ کے فتووں نے اسے بدعتی اور مرتد قرار دیا تھا، اور یہ کہ اس کا انتقال 7 دسمبر 1935 کو ہوا۔"
