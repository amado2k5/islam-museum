summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تقي الدين النبهاني؛ تُستخدم لوقائع الكيان فقط. يذكر صدرها وفاته في 11 ديسمبر 1977 ومتنها ولادته سنة 1909 في إجزم قرب حيفا ووفاته في 20 ديسمبر 1977، ودراسته الشريعة في الأزهر ودار العلوم وتخرّجه سنة 1931، وعمله مدرّسًا ثم قاضيًا شرعيًا حتى محكمة الاستئناف، وتأسيسه حزب التحرير سنة 1953، وإقامته في بيروت بعد منعه من العودة إلى الأردن، ونسبه الكامل، وأن جدّه هو العالم الفلسطيني يوسف النبهاني."
  en: "English Wikipedia article on Taqi al-Din al-Nabhani; used for entity facts only. Its lead dates him 1914 – 11 December 1977 while its biography text gives his birth in 1909 at Ijzim near Haifa and his death on 20 December 1977; it records his Sharia studies at al-Azhar and Dar al-Ulum, his graduation in 1931, his work as teacher and then Sharia judge up to the court of appeal, his founding of Hizb ut-Tahrir in 1953, his settling in Beirut after being barred from Jordan, his full nasab, and that his grandfather was the Palestinian scholar Yusuf al-Nabhani."
