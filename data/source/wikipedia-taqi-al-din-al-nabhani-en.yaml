summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تقي الدين النبهاني؛ تُستخدم لوقائع الكيان فقط. يذكر صدرها وفاته في 11 ديسمبر 1977 ومتنها ولادته سنة 1909 في إجزم قرب حيفا ووفاته في 20 ديسمبر 1977، ودراسته الشريعة في الأزهر ودار العلوم وتخرّجه سنة 1931، وعمله مدرّسًا ثم قاضيًا شرعيًا حتى محكمة الاستئناف، وتأسيسه حزب التحرير سنة 1953، وإقامته في بيروت بعد منعه من العودة إلى الأردن، ونسبه الكامل، وأن جدّه هو العالم الفلسطيني يوسف النبهاني."
  en: "English Wikipedia article on Taqi al-Din al-Nabhani; used for entity facts only. Its lead dates him 1914 – 11 December 1977 while its biography text gives his birth in 1909 at Ijzim near Haifa and his death on 20 December 1977; it records his Sharia studies at al-Azhar and Dar al-Ulum, his graduation in 1931, his work as teacher and then Sharia judge up to the court of appeal, his founding of Hizb ut-Tahrir in 1953, his settling in Beirut after being barred from Jordan, his full nasab, and that his grandfather was the Palestinian scholar Yusuf al-Nabhani."
  es: "Artículo de la Wikipedia en inglés sobre Taqi al-Din al-Nabhani; utilizado únicamente para datos sobre la persona. Su introducción lo fecha entre 1914 y el 11 de diciembre de 1977, mientras que su biografía indica que nació en 1909 en Ijzim, cerca de Haifa, y falleció el 20 de diciembre de 1977. En ella se recogen sus estudios de la Sharia en al-Azhar y Dar al-Ulum, su graduación en 1931, su labor como profesor y posteriormente juez de la Sharia hasta el tribunal de apelación, la fundación de Hizb ut-Tahrir en 1953, su establecimiento en Beirut tras ser expulsado por Jordania, su nasab completo y que su abuelo fue el erudito palestino Yusuf al-Nabhani."
  fr: "L'article de Wikipédia en anglais sur Taqi al-Din al-Nabhani, utilisé uniquement pour les informations le concernant, indique sa date de naissance (1914-11 décembre 1977), tandis que sa biographie mentionne sa naissance en 1909 à Ijzim, près de Haïfa, et son décès le 20 décembre 1977. Elle relate ses études de charia à al-Azhar et Dar al-Ulum, l'obtention de son diplôme en 1931, son travail d'enseignant puis de juge de la charia jusqu'à la cour d'appel, la fondation du Hizb ut-Tahrir en 1953, son installation à Beyrouth après avoir été interdit de séjour par la Jordanie, son nom complet (nasab) et précise que son grand-père était le savant palestinien Yusuf al-Nabhani."
  ur: "تقی الدین النبھانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ ان کی تاریخیں 1914 - 11 دسمبر 1977 ہے جبکہ ان کی سوانح عمری کے متن میں ان کی پیدائش 1909 میں حیفہ کے قریب اجزم میں اور ان کی موت 20 دسمبر 1977 کو بتائی گئی ہے۔ اس میں الازہر اور دارالعلوم میں ان کی شرعی تعلیم، 1931 میں ان کی گریجویشن، استاد کے طور پر کام اور پھر اپیل کورٹ تک شرعی جج، 1953 میں حزب التحریر کی ان کی بنیاد، اردن کی طرف سے منع کیے جانے کے بعد بیروت میں ان کا سکونت، ان کا مکمل ناصب، اور یہ کہ ان کے دادا یوف النبی تھے۔"
