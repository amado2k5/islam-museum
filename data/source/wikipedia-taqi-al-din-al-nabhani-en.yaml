reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md), read in full on 1 November 2026 at the recorded revision, fetched via the MediaWiki API. The article is internally inconsistent on dates and is used with its variants preserved: the lead prints (1914 – December 11, 1977) while the biography opens 'Al-Nabhani was born in 1909 in a village by the name of Ijzim near Haifa' and closes 'He died on December 20, 1977'. Points drawn from it: the full name Muhammad Taqi al-Din bin Ibrahim bin Mustafa bin Isma'il bin Yusuf al-Nabhani; the Bani Nabhan tribe; his father a Sharia lecturer, his mother an Islamic scholar, and 'his grandfather was the famous Palestinian scholar Yusuf al-Nabhani'; Sharia at al-Azhar and the Dar-ul-Ulum college of Cairo, graduated 1931; teacher, then jurist rising to Sharia judge in the court of appeal; founding of Hizb ut-Tahrir in 1953 and its immediate ban in Jordan; barred from returning to Jordan, he settled in Beirut, where the biography's death sentence places his last years; his political philosophy and his best-known works (Nidham al-Islam, The Economic System of Islam). The article names no legal school for the man himself."
