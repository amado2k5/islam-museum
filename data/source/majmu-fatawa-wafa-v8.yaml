summary:
  ar: "المجلد الثامن من طبعة دار الوفاء لمجموعة فتاوى ابن تيمية بعناية عامر الجزار وأنور الباز، الطبعة الأولى 1418هـ/1997م، وعنوانه «كتاب القدر»: قدرة الرب، والرضا بالقضاء، والاحتجاج بالقدر، ومحاجة آدم وموسى، واستطاعة العبد، وتعليل أفعال الله، والتحسين والتقبيح."
  en: "Volume 8 of the Dar al-Wafa' printing of Ibn Taymiyya's collected fatwas, ed. Amir al-Jazzar and Anwar al-Baz, first edition 1418 AH / 1997, titled 'Kitab al-Qadar': God's power, contentment with the decree, arguing from destiny, the debate of Adam and Moses, human capacity, the wisdom behind God's acts, and moral good and evil."
