label: { ar: "مجموعة الفتاوى لابن تيمية، اعتنى بها عامر الجزار وأنور الباز، المجلد الثامن ⁦(القدر)⁩، دار الوفاء، الطبعة الأولى 1418هـ/1997م", en: "Majmu'at al-Fatawa of Ibn Taymiyya, ed. Amir al-Jazzar and Anwar al-Baz, vol. 8 (al-Qadar), Dar al-Wafa', 1st ed., 1418 AH / 1997" }
summary:
  ar: "المجلد الثامن من طبعة دار الوفاء لمجموعة فتاوى ابن تيمية بعناية عامر الجزار وأنور الباز، الطبعة الأولى 1418هـ/1997م، وعنوانه «كتاب القدر»: قدرة الرب، والرضا بالقضاء، والاحتجاج بالقدر، ومحاجة آدم وموسى، واستطاعة العبد، وتعليل أفعال الله، والتحسين والتقبيح."
  en: "Volume 8 of the Dar al-Wafa' printing of Ibn Taymiyya's collected fatwas, ed. Amir al-Jazzar and Anwar al-Baz, first edition 1418 AH / 1997, titled 'Kitab al-Qadar': God's power, contentment with the decree, arguing from destiny, the debate of Adam and Moses, human capacity, the wisdom behind God's acts, and moral good and evil."
  es: "Volumen 8 de la edición Dar al-Wafa' de las fatuas recopiladas de Ibn Taymiyya, editado por Amir al-Jazzar y Anwar al-Baz, primera edición 1418 AH / 1997, titulado 'Kitab al-Qadar': El poder de Dios, la conformidad con el decreto, la argumentación desde el destino, el debate de Adán y Moisés, la capacidad humana, la sabiduría detrás de los actos de Dios y el bien y el mal moral."
  fr: "Volume 8 de l'édition Dar al-Wafa' des fatwas d'Ibn Taymiyya, éditée par Amir al-Jazzar et Anwar al-Baz, première édition 1418 AH / 1997, intitulé « Kitab al-Qadar »: La puissance de Dieu, le contentement du décret, l'argumentation à partir du destin, le débat d'Adam et Moïse, la capacité humaine, la sagesse derrière les actes de Dieu, et le bien et le mal moraux."
  ur: "ابن تیمیہ کے جمع شدہ فتاویٰ کی طباعت دار الوفاء کی جلد 8، ایڈیشن۔ امیر الجزائر اور انورالباز، پہلا ایڈیشن 1418ھ / 1997، کتاب القدر کے عنوان سے: خدا کی قدرت، فرمان پر قناعت، تقدیر سے بحث، آدم اور موسیٰ کی بحث، انسانی صلاحیت، خدا کے اعمال کے پیچھے حکمت، اور اخلاقی نیکی اور بدی۔"
  tr: "İbn Teymiyye'nin fetvaları derlemesinin Dar al-Wafa baskısının sekizinci cildi, Amer Al-Jazzar ve Anwar Al-Baz tarafından düzenlenmiş, ilk baskı 1418 Hicri / 1997 M.S. başlığıyla, \"Kader Kitabı\": Rabbin Gücü, Fermanın Kabulü, Kabulü, Kabulü, Kaderle Argüman, Adem ve Musa'nın Tartışması, Hizmetkârın Yeteneği, Tanrı'nın Eylemleri İçin Akıl Yürütme ve İyilik ve Kötülük başlıklıdır."
  id: "Jilid Delapan edisi Dar Al-Wafa dari kumpulan Fatwa Ibn Taymiyyah, disunting oleh Amer Al-Jazzar dan Anwar Al-Baz, edisi pertama 1418 AH / 1997 M, berjudul \"Kitab Predestinasi\": Kekuatan Tuhan, Penerimaan Dekrit, Argumentasi melalui Takdir, Perdebatan Adam dan Musa, Kemampuan Hamba, Penalaran atas Tindakan Tuhan, dan Kebaikan dan Kejahatan."
