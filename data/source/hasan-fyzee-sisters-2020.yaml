reliability_note: "Read in full on 1 November 2026. The author holds a Portsmouth PhD in English literature and teaches at the International Islamic University Malaysia. For Zehra (dated by him 1866-1940) the article states that Atiya's London diary entries of 1906-07 were sent to her sisters Zehra and Nazli, that 'the elder sister Zehra did the initial screening and editing' before Muhammadi Begum printed them in Tahzib un-Niswan, that the 1921 book Zamana-i-Tahsil appeared 'in addition to two titles by Zehra', that all three sisters 'were involved in establishing Anjumani-Khawatin-i-Islam (Islamic sisters' association) in Aligarh in 1914', and that Zehra edited Nazli's Sair-i-Yurop and arranged the publication of their mother Amirunnisa Fyzee's poetry books Yadgari-Amira and Amin. It names no religion or branch for Zehra herself."
