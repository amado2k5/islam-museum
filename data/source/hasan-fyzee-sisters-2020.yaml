summary:
  ar: "مقالة علمية لمحمد محمود الحسن عن الأخوات فيضي (2020)؛ توثّق دور زهرة فيضي التحريري: تنقيحها مذكرات أختها عطية قبل نشرها في «تهذيب نسوان»، وتحريرها رحلة أختها نازلي «سير يوروب» وكتب شعر والدتهن، واشتراك الأخوات الثلاث في تأسيس «أنجمن خواتين إسلام» في عليكرة سنة 1914."
  en: "Scholarly article by Md. Mahmudul Hasan on the Fyzee sisters (2020); it documents Zehra Fyzee's editorial role: her screening and editing of her sister Atiya's diary entries before their publication in Tahzib un-Niswan, her editing of her sister Nazli's travelogue Sair-i-Yurop and of their mother's poetry books, and the three sisters' part in establishing the Anjuman-i-Khawatin-i-Islam at Aligarh in 1914."
title: "Atiya: The most iconoclastic of the Fyzee sisters"
