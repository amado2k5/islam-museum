label: { en: "Hasan, 'Atiya: The most iconoclastic of the Fyzee sisters' (2020)" }
summary:
  ar: "مقالة علمية لمحمد محمود الحسن عن الأخوات فيضي (2020)؛ توثّق دور زهرة فيضي التحريري: تنقيحها مذكرات أختها عطية قبل نشرها في «تهذيب نسوان»، وتحريرها رحلة أختها نازلي «سير يوروب» وكتب شعر والدتهن، واشتراك الأخوات الثلاث في تأسيس «أنجمن خواتين إسلام» في عليكرة سنة 1914."
  en: "Scholarly article by Md. Mahmudul Hasan on the Fyzee sisters (2020); it documents Zehra Fyzee's editorial role: her screening and editing of her sister Atiya's diary entries before their publication in Tahzib un-Niswan, her editing of her sister Nazli's travelogue Sair-i-Yurop and of their mother's poetry books, and the three sisters' part in establishing the Anjuman-i-Khawatin-i-Islam at Aligarh in 1914."
  es: "Artículo académico de Md. Mahmudul Hasan sobre las hermanas Fyzee (2020); documenta el papel editorial de Zehra Fyzee: su revisión y edición de las entradas del diario de su hermana Atiya antes de su publicación en Tahzib un-Niswan, su edición del libro de viajes de su hermana Nazli, Sair-i-Yurop, y de los libros de poesía de su madre, y la participación de las tres hermanas en la creación de la Anjuman-i-Khawatin-i-Islam en Aligarh en 1914."
  fr: "Article scientifique de Md. Mahmudul Hasan sur les sœurs Fyzee (2020); il documente le rôle éditorial de Zehra Fyzee: sa sélection et son édition des entrées du journal de sa sœur Atiya avant leur publication dans Tahzib un-Niswan, son édition du récit de voyage de sa sœur Nazli Sair-i-Yurop et des recueils de poésie de leur mère, et le rôle des trois sœurs dans la création de l'Anjuman-i-Khawatin-i-Islam à Aligarh en 1914."
  ur: "فیزی بہنوں پر محمد محمود الحسن کا علمی مضمون (2020)؛ اس میں زہرہ فیضی کے ادارتی کردار کو دستاویز کیا گیا ہے: تہذیب النسوان میں ان کی اشاعت سے قبل اس کی بہن عطیہ کی ڈائری کے اندراجات کی اسکریننگ اور ایڈیٹنگ، اس کی بہن نازلی کے سفرنامے سیرِ یوروپ اور ان کی والدہ کی شاعری کی کتابوں کی تدوین، اور انجمنِ فکر 14 کے قیام میں تین بہنوں کا حصہ۔"
  tr: "Mohamed Mahmoud Al-Hassan'ın Faydi kardeşler hakkında akademik bir makalesi (2020); Zahra Faydi'nin editörlük rolünü belgeliyor: kız kardeşi Atiya'nın anılarını 'Tahdhib Niswan'da yayımlamadan önce düzenlemesi, kız kardeşi Nazli'nin yolculuğu 'Sir Europ'u, annelerinin şiir kitaplarını düzenlemesi ve üç kız kardeşin 1914'te Alikra'da 'Anjuman Khawateen Islam'ın kuruluşundaki katılımı."
  id: "Sebuah artikel ilmiah oleh Mohamed Mahmoud Al-Hassan tentang saudari Faydi (2020); mendokumentasikan peran editorial Zahra Faydi: penyuntingannya atas memoar saudara perempuannya Atiya sebelum menerbitkannya di 'Tahdhib Niswan', penyuntingan perjalanan saudara perempuannya Nazli 'Sir Europ', buku puisi ibu mereka, dan partisipasi ketiga saudari dalam mendirikan 'Anjuman Khawateen Islam' di Alikra pada tahun 1914."
