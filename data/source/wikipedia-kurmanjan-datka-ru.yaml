summary:
  ar: "مقالة ويكيبيديا الروسية عن قرمانجان داتقا؛ تُستخدم لوقائع الكيان فقط. صندوق معلوماتها هو الموضع الوحيد في أي طبعة مقروءة الذي يسمّي مذهبًا لها ⁦(إسلام سني المذهب)⁩، ونصها يصفها بأنها مسلمة عمومًا."
  en: "Russian Wikipedia article on Kurmanjan Datka; used for entity facts only. Its infobox is the only place in any edition read that names a school for her (Sunni Islam), while its text describes her only generically as a Muslim woman."
  es: "Artículo de la Wikipedia rusa sobre Kurmanjan Datka; se utiliza únicamente para obtener información sobre la persona. Su ficha informativa es el único lugar en todas las ediciones consultadas que menciona una escuela en su honor (islam sunita), mientras que el texto la describe solo de forma genérica como una mujer musulmana."
  fr: "Article de Wikipédia en russe sur Kurmanjan Datka; utilisé uniquement pour les informations sur l'entité. Son infobox est le seul endroit, dans toutes les éditions consultées, qui mentionne une école en son honneur (islam sunnite), tandis que son texte la décrit de manière générique comme une femme musulmane."
  ur: "کرمنجن داتکا پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ کسی بھی ایڈیشن میں اس کا معلوماتی باکس واحد جگہ ہے جس میں اس کے لیے ایک اسکول کا نام دیا گیا ہے ⁦(سنی اسلام)⁩، جب کہ اس کا متن اسے صرف عام طور پر ایک مسلمان خاتون کے طور پر بیان کرتا ہے۔"
  tr: "Karamangan Datka hakkında Rusça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bilgi kutusu, herhangi bir okunabilir baskıda mezhebinin (Sünni İslam) adını veren tek yerdir ve metni onu genel olarak Müslüman olarak tanımlar."
  id: "Artikel Wikipedia Rusia tentang Karamangan Datka; digunakan hanya untuk fakta entitas tersebut. Infobox-nya adalah satu-satunya tempat dalam edisi yang dapat dibaca yang menyebutkan sektenya (Islam Sunni), dan teksnya menggambarkannya sebagai umumnya Muslim."
