  ar: "مقالة ويكيبيديا العربية عن جابر الأحمد الصباح؛ تُستخدم لوقائع الكيان فقط. تتناول نشأته ومناصبه قبل الإمارة وحكمه الطويل للكويت وسنوات الغزو والتحرير ووفاته. ولا تسمي المقالة له دينًا ولا مدرسة في متنها ولا في صندوق معلوماتها."
  en: "Arabic Wikipedia article on Jaber Al-Ahmad Al-Sabah; used for entity facts only. It covers his upbringing, his offices before the emirate, his long rule of Kuwait, the occupation and liberation years, and his death. The article names no religion or school for him, in its text or in its infobox."
