label:
  ar: "سنن أبي داود ومعه معالم السنن للخطابي — إعداد وتعليق عزت عبيد الدعاس وعادل السيد، دار ابن حزم، الجزء الأول"
  en: "Sunan Abi Dawud with al-Khattabi's Ma'alim al-Sunan — prepared and annotated by 'Izzat 'Ubayd al-Da''as and 'Adil al-Sayyid, Dar Ibn Hazm, vol. 1"
summary:
  ar: "الجزء الأول من نشرة دار ابن حزم (بيروت، الطبعة الأولى 1418هـ/1997م) لسنن أبي داود، وفيها في الحاشية شرح الخطابي «معالم السنن» مع تخريج الأحاديث وترقيمها وفهرس عام؛ بنيت على طبعة عزت عبيد الدعاس وعادل السيد، وفيها مقدمة الناشر ومقدمة المعدّين وترجمة أبي داود وترجمة الخطابي، ثم كتاب الطهارة (الأحاديث 1–390) وكتاب الصلاة إلى أبواب صلاة الكسوف."
  en: "Volume 1 of the Dar Ibn Hazm edition (Beirut, first edition 1418 AH/1997 CE) of the Sunan of Abu Dawud, carrying al-Khattabi's commentary Ma'alim al-Sunan in the footnotes, with takhrij and numbering of the reports and a general index; it is based on the edition of 'Izzat 'Ubayd al-Da''as and 'Adil al-Sayyid, and holds the publisher's preface, the editors' introduction, notices of Abu Dawud and of al-Khattabi, then the Book of Purification (reports 1–390) and the Book of Prayer up to the chapters on the eclipse prayer."
title: "سنن أبي داود، ومعه كتاب معالم السنن للخطابي — الجزء الأول"
