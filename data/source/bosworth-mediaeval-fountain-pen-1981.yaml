summary:
  ar: "مقالة كليفورد إدموند بوسورث الشهيرة التي تنشر وتناقش رواية القلقشندي عن القلم ذي الخزان المصنوع للخليفة الفاطمي المعز لدين الله — أقدم وصف معروف لقلم حبر في المصادر."
  en: "Clifford Edmund Bosworth's well-known article publishing and discussing al-Qalqashandi's report of the reservoir pen made for the Fatimid caliph al-Mu'izz — the earliest known description of a fountain pen in the sources."
  ur: "کلفورڈ ایڈمنڈ بوسورتھ کا معروف مضمون جس میں قلقشندی کی وہ روایت شائع اور زیرِ بحث ہے جو فاطمی خلیفہ معز لدین اللہ کے لیے بنائے خزان دار قلم کی ہے — مآخذ میں فاؤنٹین پن کی قدیم ترین تفصیل۔"
  es: "El conocido artículo de Clifford Edmund Bosworth publica y analiza el informe de al-Qalqashandi sobre la pluma estilográfica fabricada para el califa fatimí al-Mu'izz, la descripción más antigua conocida de una pluma estilográfica en las fuentes."
  fr: "L'article bien connu de Clifford Edmund Bosworth publiant et analysant le rapport d'al-Qalqashandi sur le stylo à réservoir fabriqué pour le calife fatimide al-Mu'izz — la plus ancienne description connue d'un stylo-plume dans les sources."
  tr: "Clifford Edmund Bosworth'un, Al-Qalqashandi'nin kalemi Fatımi Halifesi Al-Mu'izz li-Din Allah için yapılmış bir tankla anlatmasını yayımlayan ve tartışan ünlü makalesi — kaynaklarda bilinen en eski mürekkep kalemi tanımıdır."
  id: "Artikel terkenal Clifford Edmund Bosworth yang menerbitkan dan membahas kisah Al-Qalqashandi tentang pena dengan tangki yang dibuat untuk Khalifah Fatimiyah Al-Mu'izz li-Din Allah — deskripsi tinta tertua yang diketahui dalam sumber-sumbernya."
