reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth name Raden Mas Rahmat, his father Amangkurat I and mother Ratu Kulon, his nickname Sunan Amral, and no year of birth (its category is Year of birth missing). It records his conflicts with his father, the Trunajaya alliance and rebellion, his accession in 1677, his plan to make the hajj pilgrimage instead of fighting and its abandonment, the Jepara treaty of September 1677, his killing of Trunajaya on 2 January 1680, the founding of Kartasura, and his death on 3 November 1703 at Kartasura. It names no school or order for the man himself. Checked 1 November 2026."
