summary:
  ar: "سيرة موسوعية لأبي عبيد البكري تذكر مولده في شلتيش غرب إشبيلية ونشأته في قرطبة وإجازاته الفقهية والحديثية، ومصنفاته منها «معجم ما استعجم» و«المسالك والممالك»."
  en: "An encyclopaedic biography of Abu Ubayd al-Bekri recording his birth at Shaltish west of Seville, his Cordoban upbringing and fiqh/hadith ijazas, and his works including Mu'jam ma Ista'jam and al-Masalik wa-l-Mamalik."
  ur: "ابو عبید البکری کی دائرۃ المعارف کی سوانح جس میں اس کی پیدائش اشبیلیہ کے مغرب میں شلتيش میں، قرطبہ میں پرورش، فقہی و حدیثی اجازات اور «معجم ما استعجم» و «المسالك والممالك» جیسے تصانیف درج ہیں۔"
  es: "Una biografía enciclopédica de Abu Ubayd al-Bekri que recoge su nacimiento en Shaltish, al oeste de Sevilla, su educación cordobesa y sus ijazas de fiqh/hadith, así como sus obras, entre las que se incluyen Mu'jam ma Ista'jam y al-Masalik wa-l-Mamalik."
  fr: "Une biographie encyclopédique d'Abu Ubayd al-Bekri relatant sa naissance à Shaltish à l'ouest de Séville, son éducation à Cordoue et ses ijazas de fiqh/hadith, ainsi que ses œuvres, notamment Mu'jam ma Ista'jam et al-Masalik wa-l-Mamalik."
reliability_note: "TDV Islam Ansiklopedisi article read in full on 15 November 2026. Used for: birth place Shaltish west of Seville with exact date unrecorded and Gayangos's 432/1040 rejected as implausible; Cordoban study and ijaza from the Maliki scholar Ibn Abd al-Barr; works list including Mu'jam ma Ista'jam and Masalik wa-l-Mamalik; the claim that al-Bekri first applied an alphabetical ordering to a geographical book as far as known. Modern scholarly synthesis; individual dates follow the article's own caution."
