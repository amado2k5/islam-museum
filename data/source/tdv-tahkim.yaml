summary:
  ar: "مدخل «تحكيم» الفقهي في موسوعة TDV الإسلامية: عقد التحكيم وأطرافه، ما يجوز تحكيمه وما لا يجوز، إجراءاته وشروطه، وانعقاده وانتهاؤه عند المذاهب."
  en: "The fiqh section of the TDV İslâm Ansiklopedisi entry TAHKÎM: the arbitration contract and its parties, what may and may not be submitted to arbitration, its procedure and conditions, and how it begins and ends in the legal schools."
  es: "La sección de fiqh de la entrada TAHKÎM del TDV İslâm Ansiklopedisi trata sobre el contrato de arbitraje y sus partes, qué puede y qué no puede someterse a arbitraje, su procedimiento y condiciones, y cómo comienza y termina en las escuelas jurídicas."
  fr: "La section fiqh de l'entrée TAHKÎM de la TDV İslâm Ansiklopedisi: le contrat d'arbitrage et ses parties, ce qui peut et ne peut pas être soumis à l'arbitrage, sa procédure et ses conditions, et comment il commence et se termine dans les écoles juridiques."
  ur: "TDV İslâm Ansiklopedisi entry TAHKIM کا فقہ سیکشن: ثالثی کا معاہدہ اور اس کے فریق، ثالثی میں کیا پیش کیا جا سکتا ہے اور کیا نہیں، اس کے طریقہ کار اور شرائط، اور یہ قانونی اسکولوں میں کیسے شروع اور ختم ہوتا ہے۔"
  tr: "TDV İslami Ansiklopedisi'nde fıkıhsal \"tahkim\"e giriş: tahkim sözleşmesi ve tarafları, neyin tahkim edilip edilemeyeceği, prosedürleri ve koşulları ile düşünce okullarına göre sonuçlanması ve sona erdirilmesi."
  id: "Pengantar \"arbitrase\" yurisprudensi dalam Ensiklopedia Islam TDV: kontrak arbitrase dan para pihaknya, apa yang boleh dan tidak boleh di-arbitrase, prosedur dan ketentuannya, serta kesimpulan dan pengakhirannya menurut aliran pemikiran."
