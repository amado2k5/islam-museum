summary:
  ar: "مدخل موسوعة بريتانيكا عن عثمان سيمبين: كاتب ومخرج سنغالي عُرف بموضوعاته التاريخية والسياسية؛ يوثّق دراسته السينما في موسكو وقراره التصوير بالولوفية ومنع «سيدو» في السنغال."
  en: "Encyclopaedia Britannica entry on Ousmane Sembène: Senegalese writer and film director known for historical and political themes; it records his Moscow film study, his decision to film in Wolof, and the banning of Ceddo in Senegal."
  es: "Entrada de la Enciclopedia Británica sobre Ousmane Sembène: escritor y director de cine senegalés conocido por sus temas históricos y políticos; recoge sus estudios cinematográficos en Moscú, su decisión de filmar en wólof y la prohibición del ceddo en Senegal."
  fr: "Article de l'Encyclopædia Britannica sur Ousmane Sembène: écrivain et réalisateur sénégalais connu pour ses thèmes historiques et politiques; il relate ses études de cinéma à Moscou, sa décision de filmer en wolof et l'interdiction de Ceddo au Sénégal."
  ur: "Ousmane Sembène پر انسائیکلوپیڈیا برٹانیکا کا اندراج: تاریخی اور سیاسی موضوعات کے لیے مشہور سینیگالی مصنف اور فلم ڈائریکٹر؛ اس میں اس کا ماسکو فلمی مطالعہ، وولوف میں فلم کرنے کے اس کے فیصلے، اور سینیگال میں سیڈو پر پابندی کو ریکارڈ کیا گیا ہے۔"
  tr: "Ousmane Simbin hakkında Encyclopaedia Britannica maddesi: Tarihsel ve politik konularıyla tanınan Senegalli bir yazar ve yönetmen; Moskova'daki sinema çalışmalarını, Wolofia'da film yapma kararını ve Senegal'deki \"Seidu\" yasağını belgeliyor."
  id: "Entri Encyclopaedia Britannica tentang Ousmane Simbin: Seorang penulis dan sutradara Senegal yang dikenal dengan subjek sejarah dan politiknya; ia mendokumentasikan studi sinemanya di Moskow, keputusannya untuk syuting di Wolofia, dan larangan \"Seidu\" di Senegal."
