reliability_note: "Independent encyclopedia account, first published 20 July 1998 and updated since; read in full on 24 October 2026. It gives his birth on 1 January 1923 at Ziguinchor-Casamance and his death at Dakar on 'June 9/10, 2007' — the day variant against the English article's and Wikidata's 9 June is recorded in the person record. It differs from the English article on smaller points (conscription in 1939 against the article's 1944; the Xala film dated 1974 against 1975; Camp de Thiaroye dated 1987 against 1988; Guelwaar dated 1993 against 1992), and it describes Guelwaar as a commentary on Senegal's religious life built on the switched bodies of a Muslim and a Catholic. It states no religion for Sembène himself."
