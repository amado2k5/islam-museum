label:
  ar: "«النظام الأساسي لدولة عُمان، المرسوم السلطاني 6/2021»، وزارة العدل والشؤون القانونية في عُمان"
  en: "Basic Statute of the State of Oman, Royal Decree 6/2021 (Ministry of Justice and Legal Affairs of Oman)"
summary:
  ar: "«النظام الأساسي لدولة عُمان، المرسوم السلطاني 6/2021»، كما يُنشر عند: وزارة العدل والشؤون القانونية في عُمان. العنوان ونص المادة 3 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Basic Statute of the State of Oman, Royal Decree 6/2021, as published at: Ministry of Justice and Legal Affairs of Oman. The address and the wording of Article 3 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Basic Statute of the State of Oman, Royal Decree 6/2021، جیسا کہ Ministry of Justice and Legal Affairs of Oman پر شائع ہے۔ پتہ اور دفعہ 3 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Basic Statute of the State of Oman, Royal Decree 6/2021, tel que publié à : Ministry of Justice and Legal Affairs of Oman. L'adresse et le texte (article 3) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Basic Statute of the State of Oman, Royal Decree 6/2021, tal como se publica en: Ministry of Justice and Legal Affairs of Oman. La dirección y el texto (artículo 3) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Umman Devleti Temel Statüsü, Kraliyet Kararnamesi 6/2021,\" yayımlandığı şekliyle: Umman Adalet ve Hukuk İşleri Bakanlığı. Madde 3'ün başlığı ve metni, müze tarafından sağlanan bir araştırma özetinden alınmıştır ve müze sayfayı açmamıştır; kurucu, metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Statuta Dasar Negara Oman, Keputusan Kerajaan 6/2021,\" sebagaimana diterbitkan di: Kementerian Kehakiman dan Urusan Hukum di Oman. Judul dan teks Pasal 3 diambil dari ringkasan penelitian yang disediakan oleh museum, dan museum tidak membuka halaman tersebut; pendiri mengizinkan penggunaan teks tersebut seperti yang dinyatakan pada 21 November 2026."
