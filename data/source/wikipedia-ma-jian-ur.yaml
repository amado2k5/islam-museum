summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد ماكين الصيني ⁦(ما جيان)⁩؛ تُستخدم لوقائع الكيان فقط. وهي نبذة قصيرة: عالم مسلم صيني ترجم القرآن و«تاريخ العرب» إلى الصينية وسعى إلى التوفيق بين الإسلام والماركسية."
  en: "Urdu Wikipedia article on Muhammad Ma Jian; used for entity facts only. It is a short stub: a Chinese Muslim scholar who translated the Qur'an and the History of the Arabs into Chinese and sought compatibility between Islam and Marxism."
  es: "Artículo de Wikipedia en urdu sobre Muhammad Ma Jian; se utiliza únicamente para datos sobre la persona. Es un breve esbozo: un erudito musulmán chino que tradujo el Corán y la Historia de los Árabes al chino y buscó la compatibilidad entre el islam y el marxismo."
  fr: "Article de Wikipédia en ourdou sur Muhammad Ma Jian; utilisé uniquement à titre informatif. Il s'agit d'une brève description: un érudit musulman chinois qui a traduit le Coran et l'Histoire des Arabes en chinois et a cherché à concilier l'islam et le marxisme."
  ur: "محمد ما جیان پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ایک مختصر سٹب ہے: ایک چینی مسلمان اسکالر جس نے قرآن اور عربوں کی تاریخ کا چینی زبان میں ترجمہ کیا اور اسلام اور مارکسزم کے درمیان مطابقت کی کوشش کی۔"
  tr: "Çinli Muhammed Makin (Ma Jian) hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kısa bir özet: Çinli bir Müslüman alim Kur'an ve \"Arapların Tarihi\"ni Çince'ye çevirmiş ve İslam ile Marksizmi uzlaştırmaya çalışmıştır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Muhammad Makin (Ma Jian) dari Tiongkok; digunakan hanya untuk fakta entitas tersebut. Ini adalah ringkasan singkat: seorang ulama Muslim Tiongkok menerjemahkan Al-Qur'an dan \"Sejarah Orang Arab\" ke dalam bahasa Mandarin dan berusaha mendamaikan Islam dan Marxisme."
