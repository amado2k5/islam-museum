summary:
  en: "The Muslim 500 profile of Khurram Parvez: Khurram Parvez is an internationally recognised Kashmiri human rights defender based in Srinagar, imprisoned since November 2021 under anti-terrorism legislation and awarded the 2023 Martin Ennals Award for Human Rights Defenders."
  es: "Perfil de Khurram Parvez en Muslim 500: Khurram Parvez es un defensor de los derechos humanos cachemir reconocido internacionalmente, residente en Srinagar, encarcelado desde noviembre de 2021 en virtud de la legislación antiterrorista y galardonado con el Premio Martin Ennals 2023 para Defensores de los Derechos Humanos."
  fr: "Profil de Khurram Parvez sur Muslim 500: Khurram Parvez est un défenseur des droits de l’homme cachemiri internationalement reconnu, basé à Srinagar, emprisonné depuis novembre 2021 en vertu de la législation antiterroriste et lauréat du prix Martin Ennals 2023 pour les défenseurs des droits de l’homme."
  ur: "خرم پرویز کی مسلم 500 پروفائل: خرم پرویز سری نگر میں مقیم ایک بین الاقوامی سطح پر تسلیم شدہ کشمیری انسانی حقوق کے محافظ ہیں، جو نومبر 2021 سے انسداد دہشت گردی کے قانون کے تحت قید ہیں اور انہیں انسانی حقوق کے محافظوں کے لیے 2023 کے مارٹن اینالز ایوارڈ سے نوازا گیا ہے۔"
