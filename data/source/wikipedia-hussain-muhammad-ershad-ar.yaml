summary:
  ar: "مقالة ويكيبيديا العربية عن حسين محمد إرشاد؛ تُستخدم لوقائع الكيان فقط. تتفق مع المقالة الإنجليزية في مولده في دينهاتة في 1 فبراير 1930 ووفاته في دكا في 14 يوليو 2019 ⁦(وتسمي سبب الوفاة متلازمة خلل التنسج النخاعي)⁩، ويعطي صندوق معلوماتها ديانتَه «الإسلام» بصورة عامة دون مذهب."
  en: "Arabic Wikipedia article on Hussain Muhammad Ershad; used for entity facts only. It agrees with the English article on his birth at Dinhata on 1 February 1930 and his death at Dhaka on 14 July 2019 (naming myelodysplastic syndrome as the cause), and its infobox gives his religion as Islam, generically, naming no school."
  es: "Artículo de Wikipedia en árabe sobre Hussain Muhammad Ershad; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento en Dinhata el 1 de febrero de 1930 y su fallecimiento en Dhaka el 14 de julio de 2019 (indicando el síndrome mielodisplásico como causa), y su ficha informativa señala que su religión era el islam, de forma genérica, sin mencionar ninguna escuela."
  fr: "Article de Wikipédia en arabe sur Hussain Muhammad Ershad; utilisé uniquement pour les informations le concernant. Il concorde avec l’article en anglais concernant sa naissance à Dinhata le 1er février 1930 et son décès à Dhaka le 14 juillet 2019 (la cause mentionnée étant un syndrome myélodysplasique), et son infobox indique sa religion comme étant l’islam, de manière générique, sans préciser d’école."
