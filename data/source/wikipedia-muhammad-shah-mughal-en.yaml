reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A long article on the thirteenth Mughal emperor (r. 1719–1748). It gives his birth name Roshan Akhtar, his birth on 7 August 1702 — against 17 August in the Arabic and Urdu articles and in one of Wikidata's two statements, a rivalry preserved in the person record — his father as Khujista Akhtar (Jahan Shah), fourth son of Bahadur Shah I, his removal of the Sayyid Brothers, Nader Shah's invasion and the sack of Delhi in 1739, his patronage of the arts and of religious institutions, and his death of grief on 26 April 1748 in Delhi, his tomb in the Nizamuddin Dargah complex. It names no legal school for the man himself. Checked 1 November 2026."
