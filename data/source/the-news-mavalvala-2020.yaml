summary:
  ar: "مقال في صحيفة «ذا نيوز» الباكستانية ⁦(أغسطس 2020)⁩ بمناسبة تعيين نيرجيس مافالفالا عميدة في معهد ماساتشوستس للتكنولوجيا، يسميها في مطلعه شخصيا: «زرادشتية وُلدت في لاهور» — تسمية شخصية مستقلة عن أسرة مصادر ويكيبيديا، وهي التسمية الشخصية المستقلة الوحيدة التي وُجدت لها."
  en: "Article in the Pakistani newspaper The News (August 2020) on Nergis Mavalvala's appointment as a dean at MIT, which names her personally in its opening line: 'Nergis Mavalvala, a Zoroastrian born in Lahore, convent educated' — a personal naming independent of the Wikipedia source family, and the only independent personal naming found for her."
  es: "Artículo del periódico pakistaní The News (agosto de 2020) sobre el nombramiento de Nergis Mavalvala como decana del MIT, que la menciona personalmente en su primera línea: \"Nergis Mavalvala, zoroastriana nacida en Lahore, educada en un convento\", una mención personal independiente de la fuente de Wikipedia y la única mención personal independiente encontrada para ella."
  fr: "Article du journal pakistanais The News (août 2020) sur la nomination de Nergis Mavalvala comme doyenne du MIT, qui la nomme personnellement dans sa première ligne: « Nergis Mavalvala, une zoroastrienne née à Lahore, éduquée dans un couvent » — une nomination personnelle indépendante de la famille de sources Wikipédia, et la seule nomination personnelle indépendante trouvée pour elle."
  ur: "پاکستانی اخبار دی نیوز ⁦(اگست 2020)⁩ میں ایم آئی ٹی میں ڈین کے طور پر نرگس ماول والا کی تقرری پر مضمون، جس نے اپنی ابتدائی سطر میں ان کا نام ذاتی طور پر لکھا ہے: 'نرگس ماولوالا، لاہور میں پیدا ہونے والی ایک زرتشتی، کانونٹ تعلیم یافتہ' - ایک ذاتی نام وکی پیڈیا سے آزاد اور اس کے خاندان کا واحد ذریعہ ہے۔"
  tr: "Pakistan gazetesi 'The News'ta (Ağustos 2020) Nirgis Mavavala'nın Massachusetts Teknoloji Enstitüsü'nde dekanlığa atanması vesilesiyle yayımlanan bir makalede, girişinde şahsen 'Lahor'da doğmuş Zerdüşt doğumlu' adı verildi — bu isim, Wikipedia kaynak ailesinden bağımsız ve kendisi için oluşturulan tek bağımsız kişisel unvan."
  id: "Sebuah artikel di surat kabar Pakistan 'The News' (Agustus 2020) pada kesempatan pengangkatan Nirgis Mavavala sebagai dekan di Massachusetts Institute of Technology, secara pribadi menyebutnya dalam pengantar: 'Zoroasterian-born in Lahore' — nama yang independen dari keluarga sumber Wikipedia, satu-satunya gelar pribadi independen yang dibuat untuknya."
title: "Nergis Mavalvala: inspiration for all Pakistanis"
