summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مير سعيد سلطان غالييف؛ تعطي ميلاده في 13 يوليو 1892 في إليمبيتيفو ووفاته إعدامًا في موسكو في 28 يناير 1940، وتفصّل تعليمه في مكتب أبيه ونظريته في «الشيوعية القومية المسلمة» واعتقالاته."
  en: "English Wikipedia article on Mirsaid Sultan-Galiev; used for entity facts only. It gives his birth on 13 July 1892 at Elembet'evo and his execution at Moscow on 28 January 1940, and details his education at his father's maktab, his theory of Muslim national communism, and his arrests."
  es: "Artículo de la Wikipedia en inglés sobre Mirsaid Sultan-Galiev; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 13 de julio de 1892 en Elembet'evo y su ejecución en Moscú el 28 de enero de 1940, y detalla su educación en el maktab de su padre, su teoría del comunismo nacional musulmán y sus arrestos."
  fr: "Article de Wikipédia en anglais sur Mirsaïd Sultan-Galiev; utilisé uniquement pour les informations biographiques. Il indique sa naissance le 13 juillet 1892 à Elembet'evo et son exécution à Moscou le 28 janvier 1940, et détaille son éducation au maktab de son père, sa théorie du communisme national musulman et ses arrestations."
  ur: "میرسید سلطان گیلیف پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 13 جولائی 1892 کو ایلمبیٹ ایوو میں ان کی پیدائش اور 28 جنوری 1940 کو ماسکو میں ان کی پھانسی، اور ان کے والد کے مکتب میں ان کی تعلیم، مسلم قومی کمیونزم کے نظریہ اور ان کی گرفتاریوں کی تفصیلات بیان کی گئی ہیں۔"
