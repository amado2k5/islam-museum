summary:
  ar: "دراسة مقارنة لإسبانيا الإسلامية والمسيحية من الفتح إلى نحو 1250م، تتتبع انفصال الأقاليم السياسية والاجتماعية والثقافية وانتقال العلوم والتقنية، وتتضمن قائمة مراجع في الصفحات 301–316."
  en: "A comparative study of Islamic and Christian Spain from the conquest to about 1250, tracing the divergence of its political, social and cultural regions and the transmission of learning and technology. It includes a list of references on pages 301–316."
  es: "Un estudio comparativo de la España islámica y cristiana desde la conquista hasta aproximadamente 1250, que analiza la divergencia de sus regiones políticas, sociales y culturales, así como la transmisión del conocimiento y la tecnología. Incluye una lista de referencias en las páginas 301-316."
  fr: "Cette étude comparative de l'Espagne islamique et chrétienne, de la conquête à environ 1250, retrace la divergence de ses régions politiques, sociales et culturelles ainsi que la transmission des savoirs et des techniques. Elle comprend une bibliographie (pages 301 à 316)."
  ur: "فتح سے لے کر تقریباً 1250 تک اسلامی اور عیسائی اسپین کا تقابلی مطالعہ، اس کے سیاسی، سماجی اور ثقافتی خطوں کے فرق اور سیکھنے اور ٹیکنالوجی کی ترسیل کا پتہ لگاتا ہے۔ اس میں صفحات 301–316 پر حوالہ جات کی فہرست شامل ہے۔"
  tr: "İslami ve Hristiyan İspanya'nın Fetih'ten yaklaşık 1250 yılına kadar karşılaştırmalı bir çalışması; siyasi, sosyal ve kültürel bölgelerin ayrımını ve bilimler ile teknolojinin transferini izler; 301–316. sayfalarda bir referans listesi yer alır."
  id: "Studi komparatif Spanyol Islam dan Kristen dari Penaklukan hingga sekitar tahun 1250 M, menelusuri pemisahan wilayah politik, sosial, dan budaya serta transfer ilmu pengetahuan dan teknologi, termasuk daftar referensi pada halaman 301–316."
