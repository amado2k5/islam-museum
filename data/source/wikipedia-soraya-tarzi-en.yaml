summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ثريا طرزي؛ تُستخدم لوقائع الكيان فقط. يعطي متنها مولدها في دمشق في 24 نوفمبر 1899 (بينما يعطي صندوق معلوماتها والمقدمة 1897)، وزواجها من أمان الله خان سنة 1913، ودورها في إصلاحات تحرير المرأة وتأسيسها أول مجلة نسائية وأول مدرسة للبنات في كابل، ووفاتها في روما في 20 أبريل 1968 ودفنها في جلال أباد. صندوق معلوماتها يذكر دينها «الإسلام» بصورة عامة."
  en: "English Wikipedia article on Soraya Tarzi; used for entity facts only. Its body text gives her birth at Damascus on 24 November 1899 (its infobox and lead give 1897), her marriage to Amanullah Khan in 1913, her part in the women's-emancipation reforms, her founding of the first women's magazine and the first girls' school in Kabul, and her death at Rome on 20 April 1968 with burial at Jalalabad. Its infobox gives her religion as Islam, generically."
