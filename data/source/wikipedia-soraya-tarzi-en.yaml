summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ثريا طرزي؛ تُستخدم لوقائع الكيان فقط. يعطي متنها مولدها في دمشق في 24 نوفمبر 1899 ⁦(بينما يعطي صندوق معلوماتها والمقدمة 1897)⁩، وزواجها من أمان الله خان سنة 1913، ودورها في إصلاحات تحرير المرأة وتأسيسها أول مجلة نسائية وأول مدرسة للبنات في كابل، ووفاتها في روما في 20 أبريل 1968 ودفنها في جلال أباد. صندوق معلوماتها يذكر دينها «الإسلام» بصورة عامة."
  en: "English Wikipedia article on Soraya Tarzi; used for entity facts only. Its body text gives her birth at Damascus on 24 November 1899 (its infobox and lead give 1897), her marriage to Amanullah Khan in 1913, her part in the women's-emancipation reforms, her founding of the first women's magazine and the first girls' school in Kabul, and her death at Rome on 20 April 1968 with burial at Jalalabad. Its infobox gives her religion as Islam, generically."
  es: "Artículo de la Wikipedia en inglés sobre Soraya Tarzi; utilizado únicamente para datos sobre la persona. Su texto principal indica que nació en Damasco el 24 de noviembre de 1899 (su ficha informativa y el título indican 1897), se casó con Amanullah Khan en 1913, participó en las reformas de emancipación femenina, fundó la primera revista femenina y la primera escuela para niñas en Kabul, y falleció en Roma el 20 de abril de 1968, siendo enterrada en Jalalabad. Su ficha informativa indica que profesaba el islam, de forma genérica."
  fr: "Article de Wikipédia en anglais sur Soraya Tarzi; utilisé uniquement pour les informations la concernant. Le texte indique sa naissance à Damas le 24 novembre 1899 (l’infobox et le chapitre principal mentionnent 1897), son mariage avec Amanullah Khan en 1913, son rôle dans les réformes d’émancipation des femmes, la fondation du premier magazine féminin et de la première école de filles à Kaboul, et son décès à Rome le 20 avril 1968, avec inhumation à Jalalabad. L’infobox précise qu’elle était de confession musulmane."
