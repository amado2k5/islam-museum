reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision; the revision id was re-asserted against the article in a second query with the same result. The article is internally split on her birth year: lead and infobox read 1897, the body text reads 1899 with a citation; the Arabic article and Wikidata give 1899, which is followed in the person record with the split disclosed and the date marked debated. The article also records a New York Times report that she and the King had converted to Catholicism, and records that the report was later found to be false; it is not an attestation and is noted as refuted in the person record's faith note."
