reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision. It gives his reign as 16 November 1397 to 22 September 1422, names him a son of Daud Shah and brother of Ahmad, tells of his upbringing by Muhammad Shah II, his wars with Vijayanagara, the building of Firozabad, his final two years in asceticism and piety, his abdication, and his death on 1 October 1422 at Gulbarga with burial in the Haft Gumbaz. It gives no birth year, and its remark that he 'took philosophical leanings in Sufism' is phrased as a leaning, not an affiliation."
