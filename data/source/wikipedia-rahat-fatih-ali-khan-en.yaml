summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0625\u0646\u062c\u0644\u064a\u0632\u064a\u0629 \u0639\u0646 \u0631\u0627\u062d\u062a \u0641\u062a\u062d \u0639\u0644\u064a \u062e\u0627\u0646\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u0644\u0627\u0626\u0644\u067e\u0648\u0631 \u0641\u064a 9 \u062f\u064a\u0633\u0645\u0628\u0631 1974\u060c \u0648\u062a\u062f\u0631\u064a\u0628\u0647 \u0639\u0644\u0649 \u0639\u0645\u0647 \u0646\u0635\u0631\u062a \u0645\u0646\u0630 \u0627\u0644\u0633\u0627\u0628\u0639\u0629\u060c \u0648\u0623\u0648\u0644 \u063a\u0646\u0627\u0626\u0647 \u0639\u0644\u0646\u064b\u0627 \u0641\u064a 1979\u060c \u0648\u063a\u0646\u0627\u0624\u0647 \u0641\u064a \u0627\u0644\u0633\u064a\u0646\u0645\u0627 \u0627\u0644\u0647\u0646\u062f\u064a\u0629 \u0645\u0646\u0630 2003\u060c \u0648\u062d\u0641\u0644 \u0646\u0648\u0628\u0644 \u0644\u0644\u0633\u0644\u0627\u0645 2014\u060c \u0648\u0623\u0639\u0645\u0627\u0644\u0647 \u0641\u064a \u0643\u0648\u0643 \u0633\u062a\u0648\u062f\u064a\u0648\u060c \u0648\u0645\u0634\u0627\u0647\u062f\u0627\u062a \u00ab\u0636\u0631\u0648\u0631\u064a \u062a\u06be\u0627\u00bb\u060c \u0648\u0642\u0636\u064a\u0629 \u0627\u0644\u062c\u0645\u0627\u0631\u0643 \u0627\u0644\u0647\u0646\u062f\u064a\u0629 \u0641\u064a 2011\u060c \u0648\u0627\u0639\u062a\u0630\u0627\u0631\u0647 \u0627\u0644\u0639\u0644\u0646\u064a \u0641\u064a 2024\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0630\u0627 \u063a\u0627\u0631\u062f\u064a\u0627\u0646 \u0648\u062a\u0627\u064a\u0645\u0632 \u0623\u0648\u0641 \u0625\u0646\u062f\u064a\u0627 \u0648\u0630\u0627 \u0646\u064a\u0648\u0632 \u0648\u0625\u0643\u0633\u0628\u0631\u0633 \u062a\u0631\u064a\u0628\u064a\u0648\u0646."
  en: "English Wikipedia article on Rahat Fateh Ali Khan; entity facts only: birth at Lyallpur on 9 December 1974, training under his uncle Nusrat from seven, first public performance in 1979, Indian playback singing from 2003, the 2014 Nobel Peace Prize concert, his Coke Studio work, the views of 'Zaroori Tha', the 2011 Indian customs case and his public apology of 2024; it cites The Guardian, The Times of India, The News and The Express Tribune."
