summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن راحت فتح علي خان؛ لوقائع الكيان فقط: مولده في لائلپور في 9 ديسمبر 1974، وتدريبه على عمه نصرت منذ السابعة، وأول غنائه علنًا في 1979، وغناؤه في السينما الهندية منذ 2003، وحفل نوبل للسلام 2014، وأعماله في كوك ستوديو، ومشاهدات «ضروري تھا»، وقضية الجمارك الهندية في 2011، واعتذاره العلني في 2024؛ وتستند إلى ذا غارديان وتايمز أوف إنديا وذا نيوز وإكسبرس تريبيون."
  en: "English Wikipedia article on Rahat Fateh Ali Khan; entity facts only: birth at Lyallpur on 9 December 1974, training under his uncle Nusrat from seven, first public performance in 1979, Indian playback singing from 2003, the 2014 Nobel Peace Prize concert, his Coke Studio work, the views of 'Zaroori Tha', the 2011 Indian customs case and his public apology of 2024; it cites The Guardian, The Times of India, The News and The Express Tribune."
  es: "Artículo de la Wikipedia en inglés sobre Rahat Fateh Ali Khan; solo datos sobre la persona: nacimiento en Lyallpur el 9 de diciembre de 1974, formación con su tío Nusrat desde los siete años, primera actuación pública en 1979, canto de playback indio desde 2003, el concierto del Premio Nobel de la Paz de 2014, su trabajo en Coke Studio, las opiniones sobre 'Zaroori Tha', el caso de aduanas indias de 2011 y su disculpa pública de 2024; cita a The Guardian, The Times of India, The News y The Express Tribune."
  fr: "Article Wikipédia en anglais sur Rahat Fateh Ali Khan; faits concernant l’individu: naissance à Lyallpur le 9 décembre 1974, formation auprès de son oncle Nusrat dès l’âge de sept ans, première apparition publique en 1979, chant en playback indien à partir de 2003, concert du prix Nobel de la paix de 2014, son travail au Coke Studio, les opinions exprimées dans « Zaroori Tha », l’affaire des douanes indiennes de 2011 et ses excuses publiques de 2024; l’article cite The Guardian, The Times of India, The News et The Express Tribune."
  ur: "راحت فتح علی خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: 9 دسمبر 1974 کو لائل پور میں پیدائش، سات سال سے اپنے چچا نصرت کی تربیت، 1979 میں پہلی عوامی پرفارمنس، 2003 سے ہندوستانی پلے بیک سنگنگ، 2014 کا نوبل پیس پرائز کنسرٹ، اس کا کوک اسٹوڈیو کام، 'ضروری تھا' کے خیالات، 2011 کے انڈین پبلک کیس اور 2011 کا انڈین پبلک کیس۔ اس نے دی گارڈین، دی ٹائمز آف انڈیا، دی نیوز اور دی ایکسپریس ٹریبیون کا حوالہ دیا ہے۔"
  tr: "Rahat Fateh Ali Khan hakkında İngilizce Wikipedia makalesi; sadece gerçekler için: 9 Aralık 1974'te Lyallpur'da doğması, yedi yaşından itibaren amcası Nusrat ile aldığı eğitim, 1979'da ilk halka açık şarkı söylemesi, 2003'ten beri Hint sinemasında şarkı söylemesi, 2014 Nobel Barış Ödülü, Coke Studio'daki çalışmaları, 'Zaur Tha' sahneleri, 2011'deki Hint gümrük davası ve 2024'teki kamuya açık özrü; The Guardian, Times of India, The News ve Express Tribune'a dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Rahat Fateh Ali Khan; hanya untuk fakta entitas: kelahirannya di Lyallpur pada 9 Desember 1974, pelatihannya dengan pamannya Nusrat sejak ia berusia tujuh tahun, nyanyian publik pertamanya pada tahun 1979, nyanyiannya di sinema India sejak 2003, Hadiah Nobel Perdamaian 2014, karyanya di Coke Studio, adegan 'Zaur Tha', kasus bea cukai India pada 2011, dan permintaan maaf publiknya pada 2024; didasarkan pada The Guardian, Times of India, The News, dan Express Tribune."
