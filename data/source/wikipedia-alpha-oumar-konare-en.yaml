summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألفا عمر كوناري؛ تُستخدم لوقائع الكيان فقط. تروي مولده في كايس في 2 فبراير 1946 ومسيرته مؤرخا وعالم آثار ورئاسته المجلس الدولي للمتاحف، ورئاسته مالي لولايتين (1992–2002) ثم رئاسته مفوضية الاتحاد الإفريقي (2003–2008). لا تذكر دينه في أي نص."
  en: "English Wikipedia article on Alpha Oumar Konaré; used for entity facts only. It recounts his birth at Kayes on 2 February 1946, his career as a historian and archaeologist and his presidency of ICOM, his two terms as President of Mali (1992–2002) and his chairmanship of the African Union Commission (2003–2008). Its text says nothing about his religion."
  es: "Artículo de la Wikipedia en inglés sobre Alpha Oumar Konaré; utilizado únicamente para obtener información sobre la persona. Relata su nacimiento en Kayes el 2 de febrero de 1946, su trayectoria como historiador y arqueólogo, su presidencia del ICOM, sus dos mandatos como presidente de Malí (1992-2002) y su presidencia de la Comisión de la Unión Africana (2003-2008). El texto no menciona su religión."
  fr: "Article de Wikipédia en anglais sur Alpha Oumar Konaré; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Kayes le 2 février 1946, sa carrière d’historien et d’archéologue, sa présidence de l’ICOM, ses deux mandats de président du Mali (1992-2002) et sa présidence de la Commission de l’Union africaine (2003-2008). Le texte ne mentionne rien de sa religion."
  ur: "الفا عمر کوناری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 2 فروری 1946 کو کیز میں ان کی پیدائش، ایک مورخ اور ماہر آثار قدیمہ کے طور پر ان کا کیریئر اور ICOM کی صدارت، مالی کے صدر کے طور پر ان کی دو میعادوں (1992–2002) اور افریقی یونین کمیشن (2003–2008) کی ان کی سربراہی کا ذکر ہے۔ اس کا متن اس کے مذہب کے بارے میں کچھ نہیں کہتا۔"
