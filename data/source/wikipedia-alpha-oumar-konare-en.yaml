  ar: "مقالة ويكيبيديا الإنجليزية عن ألفا عمر كوناري؛ تُستخدم لوقائع الكيان فقط. تروي مولده في كايس في 2 فبراير 1946 ومسيرته مؤرخا وعالم آثار ورئاسته المجلس الدولي للمتاحف، ورئاسته مالي لولايتين (1992–2002) ثم رئاسته مفوضية الاتحاد الإفريقي (2003–2008). لا تذكر دينه في أي نص."
  en: "English Wikipedia article on Alpha Oumar Konaré; used for entity facts only. It recounts his birth at Kayes on 2 February 1946, his career as a historian and archaeologist and his presidency of ICOM, his two terms as President of Mali (1992–2002) and his chairmanship of the African Union Commission (2003–2008). Its text says nothing about his religion."
