reliability_note: "Read in the museum's session on 20 November 2026. It describes al-Fa'iq as a dictionary of difficult or ambiguous words in some hadith, alphabetical by the first two letters of the words, in which all the rare words of a hadith are explained where the first of them occurs and are not listed again in their own alphabetical place, which makes it harder to use; and says Ahmad ibn Muhammad al-Harawi (d. 401/1011), in his al-Gharibayn fi l-Qur'an wa-l-hadith, gave each word its own alphabetical place, a better system. Used for entity facts only."
