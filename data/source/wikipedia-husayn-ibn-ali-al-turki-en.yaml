summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الحسين بن علي التركي؛ تُستخدم لوقائع الكيان فقط. تعطي 1675–13 أيلول 1740 وتجعله مؤسس العرش الحسيني، وصندوقها يسمي سلفه إبراهيم الشريف وخلفه علي الأول ووالديه علي تركي وحفصية الشرنية ومولده بالكاف ووفاته بالقيروان."
  en: "English Wikipedia article on Al-Husayn I ibn Ali; used for entity facts only. It gives 1675 – 13 September 1740 and makes him founder of the Husainid dynasty; its infobox names his predecessor Ibrahim Sharif, his successor Ali I, his parents Ali Turki and Hafsia Charnia, his birth at Le Kef and his death at Kairouan, with a generic religion field of Islam. Its 13 September death day conflicts with the French, Italian and Spanish articles' 13 May, preserved in the person record's debated died block."
  es: "Artículo de la Wikipedia en inglés sobre Al-Husayn I ibn Ali; utilizado únicamente para datos sobre la persona. Indica que nació entre 1675 y el 13 de septiembre de 1740 y lo presenta como fundador de la dinastía Husainí. Su ficha informativa menciona a su predecesor, Ibrahim Sharif, a su sucesor, Ali I, a sus padres, Ali Turki y Hafsia Charnia, su lugar de nacimiento en Le Kef y su fallecimiento en Kairouan, con la religión genérica Islam. La fecha de su muerte, el 13 de septiembre, entra en conflicto con el 13 de mayo que aparece en los artículos en francés, italiano y español, fecha que se conserva en el bloque de fallecimientos del registro de la persona, objeto de debate."
  fr: "L'article de Wikipédia en anglais sur Al-Husayn Ier ibn Ali, utilisé uniquement pour les informations sur l'entité, indique 1675 – 13 septembre 1740 et le présente comme le fondateur de la dynastie hussaïde. Son infobox mentionne son prédécesseur Ibrahim Sharif, son successeur Ali Ier, ses parents Ali Turki et Hafsia Charnia, sa naissance à Le Kef et sa mort à Kairouan, avec la mention « Islam » dans le champ générique « Religion ». La date du 13 septembre mentionnée diffère de celle du 13 mai indiquée dans les articles français, italien et espagnol, conservée dans la section « Décédé » de sa fiche."
