  ar: "مقالة ويكيبيديا الإنجليزية عن الحسين بن علي التركي؛ تُستخدم لوقائع الكيان فقط. تعطي 1675–13 أيلول 1740 وتجعله مؤسس العرش الحسيني، وصندوقها يسمي سلفه إبراهيم الشريف وخلفه علي الأول ووالديه علي تركي وحفصية الشرنية ومولده بالكاف ووفاته بالقيروان."
  en: "English Wikipedia article on Al-Husayn I ibn Ali; used for entity facts only. It gives 1675 – 13 September 1740 and makes him founder of the Husainid dynasty; its infobox names his predecessor Ibrahim Sharif, his successor Ali I, his parents Ali Turki and Hafsia Charnia, his birth at Le Kef and his death at Kairouan, with a generic religion field of Islam. Its 13 September death day conflicts with the French, Italian and Spanish articles' 13 May, preserved in the person record's debated died block."
