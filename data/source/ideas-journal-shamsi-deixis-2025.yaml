summary:
  ar: "دراسة أكاديمية محكّمة (روبيندا وفيتري رحماواتي، مجلة IDEAS، المجلد 13، العدد 2، ديسمبر 2025) حلّلت أسلوب الداعية الشمسي اللغوي في مناظرة مع ملحد في ركن المتحدثين بهايد بارك في لندن، وبياناتها مأخوذة من قناة «دي يو إس دعوة» التي تصفها الدراسة بأنها قناته على يوتيوب."
  en: "A peer-reviewed study (Robinda & Fitri Rakhmawati, IDEAS journal, vol. 13 no. 2, December 2025) analysing the preacher Shamsi's use of person and social deixis in a debate with an atheist at Speakers' Corner in Hyde Park, London; its data is taken from the DUS Dawah channel, which the study describes as his YouTube channel."
title: "Person and Social Deixis in Shamsi's Islamic Preaching to an Atheist"
author: [{ family: "Robinda", given: "" }, { family: "Rakhmawati", given: "Fitri" }]
