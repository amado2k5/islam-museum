language: en
reliability_note: "A peer-reviewed linguistics article (DOI 10.24256/ideas.v13i2.7588, pp. 4118–4145), independent of the channel and the masjid. It calls Shamsi 'a well-known figure at Speakers' Corner in Hyde Park, London, recognized for his role in Islamic da'wah', and says he 'usually uploads his videos through social media such as his YouTube channel DUS Dawah with hundreds of thousands of subscribers'. It calls him a Muslim preacher and names no school or madhhab for him. Checked 24 October 2026."
