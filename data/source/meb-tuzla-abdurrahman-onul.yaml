summary:
  ar: "صفحة مركز التعليم الشعبي في طوزلة التابع لوزارة التربية التركية تحمل رسالة وسيرة عبد الرحمن أونول؛ تقول إنه وُلد في 1 ديسمبر 1973 في بايبورت، وتخرّج في ثانوية الإمام الخطيب بحي الفاتح، وتصفه بأنه فنان إلٰهي وكاتب وملحّن تركي."
  en: "Page of the Tuzla Public Education Centre of the Turkish Ministry of National Education carrying a message and biography of Abdurrahman Önül; it states that he was born on 1 December 1973 in Bayburt, graduated from the Fatih Imam Hatip High School, and describes him as a Turkish ilahi artist, writer and composer."
  es: "Página del Centro de Educación Pública de Tuzla del Ministerio de Educación Nacional de Turquía que contiene un mensaje y una biografía de Abdurrahman Önül; en ella se indica que nació el 1 de diciembre de 1973 en Bayburt, se graduó en la escuela secundaria Fatih Imam Hatip y se le describe como un artista, escritor y compositor turco de música ilahi."
  fr: "Page du Centre d'éducation publique de Tuzla du ministère turc de l'Éducation nationale contenant un message et une biographie d'Abdurrahman Önül; il y est indiqué qu'il est né le 1er décembre 1973 à Bayburt, qu'il a obtenu son diplôme du lycée Fatih Imam Hatip, et il est décrit comme un artiste, écrivain et compositeur turc ilahi."
