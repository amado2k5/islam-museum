reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives his birth on 10 July 1929 in the village of Toshka, Aswan governorate; his engineering training and railway work in Cairo; music studies in Cairo and at the Accademia Nazionale di Santa Cecilia in Rome; his collecting of Nubian folk songs on a government grant; the Newport Folk Festival appearance of 1964; the Vanguard albums Music of Nubia (1964) and Al Oud (1965); Escalay: The Water Wheel (1971, Nonesuch, produced by Mickey Hart); performances with the Grateful Dead including their Egypt concerts of 1978; the Kronos Quartet's Pieces of Africa (1992); ethnomusicology teaching at Ohio University, the University of Washington and the University of Texas at Austin; study of the biwa in Japan in the 1980s; settlement in Oakland, California; his last album A Wish (1999); and his death on 22 May 2006 in Berkeley after gallbladder surgery. The article states no religion for him, and none is recorded in the person record."
