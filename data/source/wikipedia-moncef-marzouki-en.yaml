summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن المنصف المرزوقي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في قرمبالية سنة 1945 ودراسته للطب في ستراسبورغ ونشاطه الحقوقي، وانتخابه رئيسا مؤقتا لتونس سنة 2011 حتى نهاية 2014."
  en: "English Wikipedia article on Moncef Marzouki; used for entity facts only. It recounts his birth at Grombalia in 1945, his medical studies at Strasbourg and his human-rights work, and his election as interim president of Tunisia in 2011, serving until the end of 2014."
  es: "Artículo de la Wikipedia en inglés sobre Moncef Marzouki; utilizado únicamente para obtener información sobre la persona. Relata su nacimiento en Grombalia en 1945, sus estudios de medicina en Estrasburgo, su labor en defensa de los derechos humanos y su elección como presidente interino de Túnez en 2011, cargo que ocupó hasta finales de 2014."
  fr: "Article de Wikipédia en anglais sur Moncef Marzouki; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance à Grombalia en 1945, ses études de médecine à Strasbourg et son travail en faveur des droits de l’homme, ainsi que son élection comme président intérimaire de la Tunisie en 2011, fonction qu’il a occupée jusqu’à la fin de 2014."
  ur: "Moncef Marzouki پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1945 میں گرومبالیا میں ان کی پیدائش، اسٹراسبرگ میں ان کی طبی تعلیم اور انسانی حقوق کے کام، اور 2011 میں تیونس کے عبوری صدر کے طور پر انتخاب، 2014 کے آخر تک خدمات انجام دینے کا ذکر ہے۔"
  tr: "Moncef Marzouki hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1945'te Grombalia'daki doğumunu, Strasbourg'daki tıp eğitimini, insan hakları aktivizmini ve 2011'den 2014 sonuna kadar Tunus'un geçici cumhurbaşkanı seçilmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Moncef Marzouki; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Grombalia pada tahun 1945, studi kedokterannya di Strasbourg, aktivisme hak asasi manusianya, dan pemilihannya sebagai presiden sementara Tunisia dari tahun 2011 hingga akhir 2014."
