summary:
  ar: "مقالة ويكيبيديا العربية عن جردان شكيري؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته مع بازل وبايرن ميونيخ وإنتر ميلان وستوك سيتي وليفربول ومنتخب سويسرا، وتذكر بجملة واحدة أنه مسلم دون تسمية أي مذهب."
  en: "Arabic Wikipedia article on Xherdan Shaqiri; used for entity facts only. It recounts his career at Basel, Bayern Munich, Inter Milan, Stoke City and Liverpool and with the Switzerland national team, and states in one sentence that he is a Muslim, without naming any school."
  es: "Artículo de Wikipedia en árabe sobre Xherdan Shaqiri; utilizado únicamente para obtener información sobre él. Narra su trayectoria en el Basilea, el Bayern de Múnich, el Inter de Milán, el Stoke City y el Liverpool, así como con la selección suiza, y afirma en una sola frase que es musulmán, sin mencionar ninguna escuela."
  fr: "Article Wikipédia en arabe sur Xherdan Shaqiri; utilisé uniquement à titre informatif. Il retrace sa carrière à Bâle, au Bayern Munich, à l’Inter Milan, à Stoke City et à Liverpool, ainsi qu’avec l’équipe nationale suisse, et indique en une phrase qu’il est musulman, sans mentionner d’établissement scolaire."
  ur: "Xherdan Shaqiri پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں باسل، بائرن میونخ، انٹر میلان، اسٹوک سٹی اور لیورپول اور سوئٹزرلینڈ کی قومی ٹیم کے ساتھ ان کے کیریئر کا ذکر کیا گیا ہے، اور کسی بھی اسکول کا نام لیے بغیر، ایک جملے میں کہا گیا ہے کہ وہ ایک مسلمان ہے۔"
