summary:
  ar: "مقالة ويكيبيديا العربية عن السلطانة رضية بنت إلتتمش (1205–1240)؛ تؤكد أبوّتها وولاية عهدها وحكمها، وتؤرخ وفاة أبيها في 30 أبريل 1236، وإن أخطأت في سنة مقتلها؛ تُستخدم لوقائع الكيان فقط مع هذا التنبيه."
  en: "Arabic Wikipedia article on Sultana Razia, daughter of Iltutmish (1205-1240); it confirms her parentage, her designation as heir and her reign, and dates her father's death to 30 April 1236, though it errs on the year of her own killing; used for entity facts only, with that caution."
  es: "Artículo de la Wikipedia en árabe sobre la sultana Razia, hija de Iltutmish (1205-1240); confirma su filiación, su designación como heredera y su reinado, y fecha la muerte de su padre el 30 de abril de 1236, aunque se equivoca en el año de su propia muerte; se utiliza únicamente para datos sobre la entidad, con esa precaución."
  fr: "Article de Wikipédia en arabe sur la sultane Razia, fille d'Iltutmish (1205-1240); il confirme sa filiation, sa désignation comme héritière et son règne, et date la mort de son père au 30 avril 1236, bien qu'il se trompe sur l'année de son propre meurtre; utilisé uniquement pour les faits concernant l'entité, avec cette mise en garde."
  ur: "التمش کی بیٹی سلطانہ رضیہ پر عربی ویکیپیڈیا کا مضمون (1205-1240)؛ یہ اس کے ولدیت، وارث کے طور پر اس کے عہدہ اور اس کے دور کی تصدیق کرتا ہے، اور اس کے والد کی موت کی تاریخ 30 اپریل 1236 ہے، حالانکہ یہ اس کے اپنے قتل کے سال کی غلطی ہے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، اس احتیاط کے ساتھ۔"
