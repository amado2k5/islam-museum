reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives her years as 1205-1240, states plainly that she was the daughter of Sultan Shams al-Din Iltutmish and that he appointed her his heir after the 1231 Gwalior campaign, gives her reign as 634-637 AH (1236-1240), and dates her father's death to Wednesday 30 April 1236 — a second text, with the English Iltutmish article, for that day. Caution: the same article dates her own killing to 25 Rabi I 637 AH (October 1239), a year before the English article's October 1240; its death year for her is not used. It names no school or order for her. Checked 1 November 2026."
