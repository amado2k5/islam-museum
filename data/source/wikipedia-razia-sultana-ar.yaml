  ar: "مقالة ويكيبيديا العربية عن السلطانة رضية بنت إلتتمش (1205–1240)؛ تؤكد أبوّتها وولاية عهدها وحكمها، وتؤرخ وفاة أبيها في 30 أبريل 1236، وإن أخطأت في سنة مقتلها؛ تُستخدم لوقائع الكيان فقط مع هذا التنبيه."
  en: "Arabic Wikipedia article on Sultana Razia, daughter of Iltutmish (1205-1240); it confirms her parentage, her designation as heir and her reign, and dates her father's death to 30 April 1236, though it errs on the year of her own killing; used for entity facts only, with that caution."
