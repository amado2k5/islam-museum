summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ملتقط الريح؛ لوقائع الكيان فقط: تقابل ملقف/بادگير ⁦(ملقف قصير عريض ثنائي الاتجاه مقابل بادگير عال متعدد الجهات إلى 34 متراً)⁩، تأثير المدخنة والتبريد التبخيري الهابط الساكن ⁦(PDEC)⁩، الاقتران بالسلسبيل والشخشيخة والتختبوش، استعمال أخميني، منغ السند، نماذج بيوت مصر الفرعونية، وانحساره منتصف القرن العشرين وعودته في التصميم منخفض الطاقة مع 60% من ذروة الطلب الكهربائي المصري للتكييف."
  en: "English Wikipedia article on the windcatcher; entity facts only: the malqaf/badgir typology (short wide bidirectional malqafs versus tall multisided badgirs up to 34 metres), stack effect and passive downdraught evaporative cooling, pairings with the salsabil, shuksheika and takhtabush, Achaemenid use, the Sind mungh, ancient Egyptian house models, its mid-twentieth-century decline and low-energy revival, with air conditioning at 60% of Egypt's peak electrical demand."
  es: "Artículo de la Wikipedia en inglés sobre el captador de viento; solo datos sobre la entidad: la tipología malqaf/badgir (malqafs cortos, anchos y bidireccionales frente a badgirs altos y multifacéticos de hasta 34 metros), efecto chimenea y refrigeración evaporativa pasiva de tiro descendente, combinaciones con el salsabil, el shuksheika y el takhtabush, uso aqueménida, el Sind mungh, modelos de casas del antiguo Egipto, su declive a mediados del siglo XX y su resurgimiento de bajo consumo energético, con aire acondicionado al 60% de la demanda máxima de electricidad de Egipto."
  fr: "Article de Wikipédia en anglais sur le capteur de vent; informations techniques uniquement: la typologie malqaf/badgir (malqafs courts et larges bidirectionnels contre badgirs hauts et multifacettes pouvant atteindre 34 mètres), l’effet de cheminée et le refroidissement évaporatif passif par tirage descendant, les associations avec le salsabil, le shuksheika et le takhtabush, l’utilisation achéménide, le mungh du Sind, les modèles de maisons de l’Égypte antique, son déclin au milieu du XXe siècle et sa renaissance à faible consommation d’énergie, la climatisation représentant 60 % de la demande électrique de pointe de l’Égypte."
  ur: "ونڈ کیچر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: ملاقف/بڈگیر ٹائپولوجی ⁦(مختصر چوڑی دو طرفہ ملقف بمقابلہ 34 میٹر تک لمبے کثیر رخی بادگیر)⁩، اسٹیک اثر اور غیر فعال ڈاون ڈرافٹ بخارات کی ٹھنڈک، سلسبیل کے ساتھ جوڑیاں، شکشیکا اور تختبش، اچیمینڈ ہاؤس، اس کا ایک ماڈل، مصری استعمال بیسویں صدی کے وسط میں زوال اور کم توانائی کا احیاء، مصر کی بجلی کی سب سے زیادہ طلب کے 60 فیصد پر ایئر کنڈیشنگ کے ساتھ۔"
