summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ملتقط الريح؛ لوقائع الكيان فقط: تقابل ملقف/بادگير ⁦(ملقف قصير عريض ثنائي الاتجاه مقابل بادگير عال متعدد الجهات إلى 34 متراً)⁩، تأثير المدخنة والتبريد التبخيري الهابط الساكن ⁦(PDEC)⁩، الاقتران بالسلسبيل والشخشيخة والتختبوش، استعمال أخميني، منغ السند، نماذج بيوت مصر الفرعونية، وانحساره منتصف القرن العشرين وعودته في التصميم منخفض الطاقة مع 60% من ذروة الطلب الكهربائي المصري للتكييف."
  en: "English Wikipedia article on the windcatcher; entity facts only: the malqaf/badgir typology (short wide bidirectional malqafs versus tall multisided badgirs up to 34 metres), stack effect and passive downdraught evaporative cooling, pairings with the salsabil, shuksheika and takhtabush, Achaemenid use, the Sind mungh, ancient Egyptian house models, its mid-twentieth-century decline and low-energy revival, with air conditioning at 60% of Egypt's peak electrical demand."
