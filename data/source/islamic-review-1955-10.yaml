summary:
  ar: "عدد أكتوبر 1955 من مجلة «ذا إسلاميك ريفيو» الصادرة عن مسجد ووكينغ: يعرض صفحة المساهمين البروفيسور محمود بريلوي بأنه مؤلف باكستاني معروف له عدة كتب عن مسلمي اليوم، وأنه رئيس قسم المنشورات في المؤتمر الإسلامي بالقاهرة، ويحمل العدد مقالين له: «ابن كثير عن حسين بن منصور الحلاج» و«المؤتمر الإسلامي، القاهرة: عرض موجز لعمله»."
  en: "The October 1955 issue of The Islamic Review, the Woking Muslim Mission's journal: its contributors page presents Professor Mahmud Brelvi as a Pakistani Muslim, a well-known author of several books on Muslims of today, at present Head of the Department of Publications of the Islamic Congress, Cairo; the issue carries two pieces by him, 'Ibn Kathir on Husain Ibn Mansur al-Hallaj' and 'The Islamic Congress (Al-Mo'tamar al-Islami), Cairo: A Brief Survey of Its Work'."
