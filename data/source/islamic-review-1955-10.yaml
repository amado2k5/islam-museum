summary:
  ar: "عدد أكتوبر 1955 من مجلة «ذا إسلاميك ريفيو» الصادرة عن مسجد ووكينغ: يعرض صفحة المساهمين البروفيسور محمود بريلوي بأنه مؤلف باكستاني معروف له عدة كتب عن مسلمي اليوم، وأنه رئيس قسم المنشورات في المؤتمر الإسلامي بالقاهرة، ويحمل العدد مقالين له: «ابن كثير عن حسين بن منصور الحلاج» و«المؤتمر الإسلامي، القاهرة: عرض موجز لعمله»."
  en: "The October 1955 issue of The Islamic Review, the Woking Muslim Mission's journal: its contributors page presents Professor Mahmud Brelvi as a Pakistani Muslim, a well-known author of several books on Muslims of today, at present Head of the Department of Publications of the Islamic Congress, Cairo; the issue carries two pieces by him, 'Ibn Kathir on Husain Ibn Mansur al-Hallaj' and 'The Islamic Congress (Al-Mo'tamar al-Islami), Cairo: A Brief Survey of Its Work'."
  es: "El número de octubre de 1955 de The Islamic Review, la revista de la Misión Musulmana de Woking, presenta en su página de colaboradores al profesor Mahmud Brelvi como un musulmán pakistaní, conocido autor de varios libros sobre los musulmanes de hoy, actualmente jefe del Departamento de Publicaciones del Congreso Islámico de El Cairo; el número incluye dos artículos suyos: «Ibn Kathir sobre Husain Ibn Mansur al-Hallaj» y «El Congreso Islámico (Al-Mo'tamar al-Islami), El Cairo: un breve panorama de su labor»."
  fr: "Le numéro d'octobre 1955 de The Islamic Review, la revue de la Mission musulmane de Woking: sa page des contributeurs présente le professeur Mahmud Brelvi comme un musulman pakistanais, un auteur bien connu de plusieurs livres sur les musulmans d'aujourd'hui, actuellement chef du département des publications du Congrès islamique du Caire; le numéro contient deux articles de lui, « Ibn Kathir sur Husain Ibn Mansur al-Hallaj » et « Le Congrès islamique (Al-Mo'tamar al-Islami), Le Caire: un bref aperçu de son travail »."
