summary:
  ar: مقالة ويكيبيديا الفارسية عن أحمد كاثرادا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 21 أغسطس 1929 لأبوين مهاجرين هنديين، و26 سنة قضاها في السجن ⁦(18 منها في جزيرة روبن)⁩، وخدمته البرلمانية 1994–1999، ووفاته في 28 مارس 2017 في مستشفى بجوهانسبرغ. ويعطي صندوق معلوماتها ديانته «مسلم سني».
  en: Persian Wikipedia article on Ahmed Kathrada; used for entity facts only. It gives his birth on 21 August 1929 to Indian immigrant parents, his 26 years in prison (18 of them on Robben Island), his parliamentary service 1994–1999, and his death on 28 March 2017 in a Johannesburg hospital. Its infobox gives his religion as 'Sunni Muslim' ⁦(مسلمان سنی)⁩.
  es: "Artículo de Wikipedia en persa sobre Ahmed Kathrada; utilizado únicamente para datos sobre la persona. Indica que nació el 21 de agosto de 1929 de padres inmigrantes indios, pasó 26 años en prisión (18 de ellos en Robben Island), fue parlamentario entre 1994 y 1999, y falleció el 28 de marzo de 2017 en un hospital de Johannesburgo. Su ficha informativa indica que su religión era «musulmán sunita» ⁦(مسلمان سنی)⁩."
  fr: "Article Wikipédia en persan sur Ahmed Kathrada; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 21 août 1929 de parents immigrés indiens, ses 26 années d'emprisonnement (dont 18 à Robben Island), son mandat parlementaire de 1994 à 1999 et son décès le 28 mars 2017 dans un hôpital de Johannesburg. Son infobox précise qu'il était musulman sunnite."
  ur: "احمد کترادہ پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 21 اگست 1929 کو ہندوستانی تارکین وطن والدین کے ہاں اس کی پیدائش، اس کے 26 سال جیل میں ⁦(ان میں سے 18 روبن جزیرے پر)⁩، اس کی پارلیمانی سروس 1994-1999، اور جوہانسبرگ کے ایک اسپتال میں اس کی موت 28 مارچ 2017 کو ہوئی۔ اس کا معلوماتی باکس اس کا مذہب بطور 'سنی مسلم' ⁦(مسلمان سنی)⁩ دیتا ہے۔"
  tr: "Ahmad Kathrada hakkında Farsça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 21 Ağustos 1929'da Hintli göçmen ebeveynlerden doğması, 26 yıl hapiste (18'i Robben Adası'nda), 1994-1999 yılları arasında parlamento hizmetini ve 28 Mart 2017'de Johannesburg'daki bir hastanede vefatını anlatır. Bilgi kutusunda dininin \"Sünni Müslüman\" olduğu belirtilmektedir."
  id: "Artikel Wikipedia Persia tentang Ahmad Kathrada; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 21 Agustus 1929 dari orang tua imigran India, 26 tahun dipenjara (18 di antaranya di Pulau Robben), masa jabatannya di parlemen dari 1994 hingga 1999, dan kematiannya pada 28 Maret 2017 di sebuah rumah sakit di Johannesburg. Infobox tersebut mencantumkan agamanya sebagai \"Muslim Sunni.\""
