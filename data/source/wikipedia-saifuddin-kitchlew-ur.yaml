summary:
  ar: "مقالة ويكيبيديا الأردية عن سيف الدين كتشلو؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 15 كانون الثاني 1888 ووفاته في 9 تشرين الأول 1963، وتصفه بزعيم القومية المسلمة في جنوب آسيا، وتروي نضاله ضد قانون رولات واعتقاله في دهرامسالا قبل مذبحة جليانوالا باغ وجائزة لينين للسلام 1952."
  en: "Urdu Wikipedia article on Saifuddin Kitchlew; used for entity facts only. It gives his birth on 15 January 1888 and his death on 9 October 1963, describes him as a leader of Muslim nationalism in South Asia, and recounts his Rowlatt Act struggle, his secret detention at Dharamsala before the Jallianwala Bagh massacre and the 1952 Lenin Peace Prize."
  es: "Artículo de Wikipedia en urdu sobre Saifuddin Kitchlew; utilizado únicamente para datos sobre la persona. Indica su fecha de nacimiento, el 15 de enero de 1888, y su fallecimiento, el 9 de octubre de 1963. Lo describe como un líder del nacionalismo musulmán en el sur de Asia y relata su lucha en virtud de la Ley Rowlatt, su detención secreta en Dharamsala antes de la masacre de Jallianwala Bagh y el Premio Lenin de la Paz de 1952."
  fr: "Article de Wikipédia en ourdou sur Saifuddin Kitchlew; utilisé uniquement à titre informatif. Il indique sa naissance le 15 janvier 1888 et sa mort le 9 octobre 1963, le décrit comme un chef du nationalisme musulman en Asie du Sud et relate sa lutte contre la loi Rowlatt, sa détention secrète à Dharamsala avant le massacre de Jallianwala Bagh et l’obtention du prix Lénine pour la paix en 1952."
  ur: "سیف الدین کچلو پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 15 جنوری 1888 کو ان کی پیدائش اور 9 اکتوبر 1963 کو ان کی موت، انہیں جنوبی ایشیا میں مسلم قوم پرستی کے رہنما کے طور پر بیان کرتا ہے، اور ان کی رولٹ ایکٹ کی جدوجہد، جلیانوالہ باغ کے قتل عام اور 1952 کے لینن امن انعام سے قبل دھرم شالہ میں ان کی خفیہ حراست کا ذکر کرتا ہے۔"
