  en: "English Wikipedia article on Mohammad Javad Zarif; used for entity facts only. It recounts his diplomatic career: ambassador to the United Nations 2002–2007, foreign minister 2013–2021 under Hassan Rouhani, when he led the nuclear negotiations that produced the 2015 agreement, then vice president for strategic affairs 2024–2025."
