summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد جواد ظريف؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته دبلوماسيًا: سفير إيران لدى الأمم المتحدة 2002–2007، ووزير خارجيتها 2013–2021 في حكومة حسن روحاني حيث قاد مفاوضات الاتفاق النووي، ثم نائب الرئيس للشؤون الاستراتيجية 2024–2025."
  en: "English Wikipedia article on Mohammad Javad Zarif; used for entity facts only. It recounts his diplomatic career: ambassador to the United Nations 2002–2007, foreign minister 2013–2021 under Hassan Rouhani, when he led the nuclear negotiations that produced the 2015 agreement, then vice president for strategic affairs 2024–2025."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Javad Zarif; utilizado únicamente para obtener información sobre la persona. En él se relata su trayectoria diplomática: embajador ante las Naciones Unidas entre 2002 y 2007, ministro de Asuntos Exteriores entre 2013 y 2021 bajo el mandato de Hassan Rouhani, periodo en el que lideró las negociaciones nucleares que culminaron en el acuerdo de 2015, y posteriormente vicepresidente de Asuntos Estratégicos entre 2024 y 2025."
  fr: "Article de Wikipédia en anglais sur Mohammad Javad Zarif; utilisé uniquement à des fins d’information sur l’entité. Il retrace sa carrière diplomatique: ambassadeur auprès des Nations Unies de 2002 à 2007, ministre des Affaires étrangères de 2013 à 2021 sous Hassan Rouhani, période durant laquelle il a dirigé les négociations nucléaires qui ont abouti à l’accord de 2015, puis vice-président aux affaires stratégiques de 2024 à 2025."
  ur: "محمد جواد ظریف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کے سفارتی کیریئر کا ذکر کرتا ہے: اقوام متحدہ میں سفیر 2002-2007، حسن روحانی کے تحت وزیر خارجہ 2013-2021، جب انہوں نے جوہری مذاکرات کی قیادت کی جس نے 2015 کے معاہدے کو تیار کیا، اس کے بعد نائب صدر برائے سٹریٹجک امور 2024-2025۔"
  tr: "Muhammed Cevad Zarif hakkında İngilizce Vikipedi makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. Diplomatik kariyerini anlatır: 2002–2007 yılları arasında İran'ın Birleşmiş Milletler büyükelçisi ve 2013-2021 yılları arasında Hasan Ruhani'nin hükümetinde dışişleri bakanı olarak görev yapmış, nükleer anlaşma müzakerelerine liderlik etmiş, ardından 2024–2025 stratejik işlerden sorumlu başkan yardımcısı olmuştur."
  id: "Artikel Wikipedia bahasa Inggris tentang Mohammad Javad Zarif; digunakan hanya untuk fakta entitas. Artikel ini menceritakan karier diplomatiknya: duta besar Iran untuk Perserikatan Bangsa-Bangsa 2002–2007, dan menteri luar negerinya dari 2013 hingga 2021 dalam pemerintahan Hassan Rouhani, di mana ia memimpin negosiasi perjanjian nuklir, kemudian wakil presiden urusan strategis 2024–2025."
