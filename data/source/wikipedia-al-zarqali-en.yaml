summary:
  ar: "سيرة الزرقالي الطليطلي (1029–1100) في ويكيبيديا الإنجليزية: عمله عند صاعد الأندلسي، وابتكاره الصفيحة الزرقالية الجامعة، ومساهمته في أزياج طليطلة وأزياج الخوارزمي، وملاحظته حركة أوج الشمس."
  en: "English Wikipedia biography of the Toledan astronomer al-Zarqali (1029-1100): his work under Sa'id al-Andalusi for the rulers of Toledo and Seville, the perfected universal astrolabe plate (the safiha), his part in the Toledan Tables, his almanac, and his demonstration of the motion of the solar apogee; it gives his death as 1100 at Cordoba, following the Biographical Encyclopedia of Astronomers."
  ur: "طلیطلہ کے ماہر فلکیات الزرقالی (1029ء–1100ء) کی انگریزی ویکیپیڈیا سوانح: صاعد الاندلسی کے ماتحت کام، جامع اسطرلاب کی تختی (صفیحہ) کی ایجاد، ازیاجِ طلیطلہ میں شرکت، تقویم اور اوجِ شمس کی حرکت کا اثبات۔"
