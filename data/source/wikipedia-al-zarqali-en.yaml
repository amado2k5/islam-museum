summary:
  ar: "سيرة الزرقالي الطليطلي (1029–1100) في ويكيبيديا الإنجليزية: عمله عند صاعد الأندلسي، وابتكاره الصفيحة الزرقالية الجامعة، ومساهمته في أزياج طليطلة وأزياج الخوارزمي، وملاحظته حركة أوج الشمس."
  en: "English Wikipedia biography of the Toledan astronomer al-Zarqali (1029-1100): his work under Sa'id al-Andalusi for the rulers of Toledo and Seville, the perfected universal astrolabe plate (the safiha), his part in the Toledan Tables, his almanac, and his demonstration of the motion of the solar apogee; it gives his death as 1100 at Cordoba, following the Biographical Encyclopedia of Astronomers."
  ur: "طلیطلہ کے ماہر فلکیات الزرقالی ⁦(1029ء–1100ء)⁩ کی انگریزی ویکیپیڈیا سوانح: صاعد الاندلسی کے ماتحت کام، جامع اسطرلاب کی تختی ⁦(صفیحہ)⁩ کی ایجاد، ازیاجِ طلیطلہ میں شرکت، تقویم اور اوجِ شمس کی حرکت کا اثبات۔"
  es: "Biografía en inglés de Wikipedia del astrónomo toledano al-Zarqali (1029-1100): su trabajo bajo Sa'id al-Andalusi para los gobernantes de Toledo y Sevilla, la placa del astrolabio universal perfeccionada (la safiha), su participación en las Tablas Toledanas, su almanaque y su demostración del movimiento del apogeo solar; indica que murió en 1100 en Córdoba, según la Enciclopedia Biográfica de Astrónomos."
  fr: "Biographie de l'astronome tolédan al-Zarqali (1029-1100) sur Wikipédia en anglais: son travail sous Sa'id al-Andalusi pour les souverains de Tolède et de Séville, la plaque astrolabe universelle perfectionnée (la safiha), sa contribution aux Tables de Tolède, son almanach et sa démonstration du mouvement de l'apogée solaire; elle indique sa mort en 1100 à Cordoue, suivant l'Encyclopédie biographique des astronomes."
