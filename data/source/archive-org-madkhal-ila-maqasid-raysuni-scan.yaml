reliability_note: "User-uploaded scan of a new Dar al-Kalima (al-Mansoura) edition in the series of the author's complete works. Read: the catalogue card, the publisher's foreword by Muhammad Abu Ajur, which says the first edition was printed in 2010 and that the book was written to explain the aims of the sharia simply, including the five necessities, for jurists, preachers and ordinary believers, and the opening of the introduction (on the term maqasid al-sharia and the need for it). Read on 24 November 2026."
