reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his birth at Tiflis (lead 4 May 1862; the biography section reports archival data concluding 4 May 1863, and notes 1859 and 1865 are also claimed), graduation in law from St Petersburg University in 1888, his marriage to Pari Malikova, daughter of Hasan bey Zardabi, the editorship of Kaspi from 1897, membership of the Baku City Duma (1902–1905), the 1905 All-Russian Muslim congresses and Ittifaq al-Muslimin, leadership of the Muslim faction in the First State Duma (1906), arrest after the Vyborg Manifesto, chairmanship of the 1917 Caucasus Muslims Congress, foreign minister and then speaker of the ADR parliament (elected in absentia, 7 December 1918), de facto recognition of the ADR at Paris in January 1920, and death in Paris on 8 November 1934 with burial at Saint-Cloud. It names no school or religion for him personally."
