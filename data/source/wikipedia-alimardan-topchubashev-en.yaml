summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عليمردان بك توبتشوباشوف؛ تُستخدم لوقائع الكيان فقط. تروي دراسته الحقوق في بطرسبورغ، ورفضه منصبًا جامعيًا مشروطًا باعتناق المسيحية، وتحريره صحيفة «كاسبي»، وقيادته كتلة المسلمين في دوما الدولة الأولى، ووزارته للخارجية ورئاسته برلمان جمهورية أذربيجان الديمقراطية، ووفاته في باريس. ويلاحظ أن صدر المقالة يعطي ميلاده سنة 1862 بينما يذكر متنها أن بيانات الأرشيف تعطي 1863."
  en: "English Wikipedia article on Alimardan bey Topchubashov; used for entity facts only. It recounts his law studies at St Petersburg, his refusal of a university post conditional on converting to Christianity, his editorship of the Kaspi newspaper, his leadership of the Muslim faction in the First State Duma, his foreign ministry and speakership of the Azerbaijan Democratic Republic's parliament, and his death in Paris. Its lead gives his birth as 1862 while its biography section reports archival data giving 1863."
