summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عليمردان بك توبتشوباشوف؛ تُستخدم لوقائع الكيان فقط. تروي دراسته الحقوق في بطرسبورغ، ورفضه منصبًا جامعيًا مشروطًا باعتناق المسيحية، وتحريره صحيفة «كاسبي»، وقيادته كتلة المسلمين في دوما الدولة الأولى، ووزارته للخارجية ورئاسته برلمان جمهورية أذربيجان الديمقراطية، ووفاته في باريس. ويلاحظ أن صدر المقالة يعطي ميلاده سنة 1862 بينما يذكر متنها أن بيانات الأرشيف تعطي 1863."
  en: "English Wikipedia article on Alimardan bey Topchubashov; used for entity facts only. It recounts his law studies at St Petersburg, his refusal of a university post conditional on converting to Christianity, his editorship of the Kaspi newspaper, his leadership of the Muslim faction in the First State Duma, his foreign ministry and speakership of the Azerbaijan Democratic Republic's parliament, and his death in Paris. Its lead gives his birth as 1862 while its biography section reports archival data giving 1863."
  es: "Artículo de la Wikipedia en inglés sobre Alimardan bey Topchubashov; utilizado únicamente para datos sobre la persona. Relata sus estudios de derecho en San Petersburgo, su negativa a aceptar un puesto universitario a cambio de convertirse al cristianismo, su labor como editor del periódico Kaspi, su liderazgo de la facción musulmana en la Primera Duma Estatal, su ministerio de Asuntos Exteriores y su presidencia del parlamento de la República Democrática de Azerbaiyán, y su fallecimiento en París. El texto principal indica que nació en 1862, mientras que la sección biográfica cita datos de archivo que sitúan su nacimiento en 1863."
  fr: "L'article de Wikipédia en anglais consacré à Alimardan bey Topchubashov, utilisé uniquement pour les informations relatives à l'entité, relate ses études de droit à Saint-Pétersbourg, son refus d'un poste universitaire conditionné à sa conversion au christianisme, sa direction du journal Kaspi, son rôle de chef du groupe musulman à la Première Douma d'État, son ministère des Affaires étrangères et sa présidence du Parlement de la République démocratique d'Azerbaïdjan, ainsi que sa mort à Paris. L'introduction indique 1862 comme année de naissance, tandis que la biographie, basée sur des documents d'archives, mentionne 1863."
  ur: "علیمردان پر انگریزی ویکیپیڈیا مضمون ٹوپچوباشوف سے؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں سینٹ پیٹرزبرگ میں ان کی قانون کی تعلیم، عیسائیت قبول کرنے سے مشروط یونیورسٹی کے عہدے سے انکار، کسپی اخبار کی ایڈیٹر شپ، فرسٹ اسٹیٹ ڈوما میں ان کی مسلم دھڑے کی قیادت، ان کی وزارت خارجہ اور آذربائیجان ڈیموکریٹک ریپبلک کی پارلیمنٹ کی اسپیکر شپ، اور پیرس میں ان کی موت کا ذکر ہے۔ اس کا لیڈ اس کی پیدائش 1862 کے طور پر کرتا ہے جبکہ اس کی سوانح عمری کے حصے میں 1863 کے آرکائیول ڈیٹا کی اطلاع دی گئی ہے۔"
  tr: "Alimardan Bek Topchubashov hakkında İngilizce Wikipedia makalesi yalnızca kurumun gerçekleri için kullanılmıştır. Makale, Petersburg'da hukuk eğitimini, Hristiyanlığa geçme şartıyla üniversite pozisyonunu kabul etmeyi reddetmesini, 'Caspe' gazetesini düzenlemesini, Birinci Devlet Duması'ndaki Müslüman bloğunun liderliğini, dışişleri bakanlığını, Azerbaycan Demokratik Cumhuriyeti parlamentosunun başkanlığını ve Paris'teki ölümünü anlatır. Makalenin başlığında doğumunun 1862 olduğu belirtilirken, arşiv verilerinde 1863 olduğu belirtilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Alimardan Bek Topchubashov hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menceritakan studi hukumnya di Petersburg, penolakannya menerima posisi universitas yang bergantung pada konversi ke Kristen, penyuntingannya atas surat kabar 'Caspe', kepemimpinannya atas blok Muslim di Duma Negara Pertama, kementerian luar negerinya, kepresidenannya di parlemen Republik Demokratik Azerbaijan, dan kematiannya di Paris. Perlu dicatat bahwa judul artikel tersebut menyebutkan kelahirannya pada tahun 1862, sementara teksnya menyatakan bahwa data arsip menunjukkan tahun 1863."
