summary:
  ar: "مقالة ويكيبيديا الأردية عن فيصل بن عبد العزيز آل سعود؛ تُستخدم لوقائع الكيان فقط. وهي سيرة سردية: تذكر ولادته في أبريل 1905 ⁦(وهي رواية مغايرة لتاريخ 1906 الذي تذكره المقالتان الأخريان وويكيداتا)⁩، وسنوات ولايته للعهد وحكمه من 1964 إلى 1975، وتصنّفه ضمن «سعودي سني مسلم»؛ ولا يذكر متنها له مدرسة."
  en: "Urdu Wikipedia article on Faisal bin Abdulaziz Al Saud; used for entity facts only. A narrative biography: it gives his birth in April 1905 (a variant of the 1906 date the other articles and Wikidata give), his crown-prince years and reign from 1964 to 1975, and files him under 'Saudi Sunni Muslims'; its text names no school for him."
  es: "Artículo de Wikipedia en urdu sobre Faisal bin Abdulaziz Al Saud; utilizado únicamente para datos sobre la persona. Una biografía narrativa: indica su nacimiento en abril de 1905 (una variante de la fecha de 1906 que dan otros artículos y Wikidata), sus años como príncipe heredero y su reinado de 1964 a 1975, y lo clasifica dentro de la rama de los musulmanes sunitas saudíes; el texto no menciona ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en ourdou sur Faisal bin Abdulaziz Al Saud; utilisé uniquement pour les informations factuelles. Biographie narrative: l’article indique sa naissance en avril 1905 (une variante de la date de 1906 mentionnée dans d’autres articles et sur Wikidata), ses années de prince héritier et son règne de 1964 à 1975, et le classe dans la catégorie « Musulmans sunnites saoudiens »; le texte ne mentionne aucune école religieuse à son sujet."
  ur: "فیصل بن عبدالعزیز آل سعود پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک داستانی سوانح عمری: یہ اپریل 1905 میں ان کی پیدائش ⁦(دیگر مضامین اور وکی ڈیٹا کی 1906 کی تاریخ کی ایک قسم)⁩، اس کے ولی عہد کے سال اور 1964 سے 1975 تک حکومت کرتی ہے، اور اسے 'سعودی سنی مسلمان' کے تحت فائل کرتی ہے۔ اس کا متن اس کے لیے کسی اسکول کا نام نہیں رکھتا۔"
