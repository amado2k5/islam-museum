reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Chimaev as born on 1 May 1994 in Gvardeyskoye, Chechnya, a three-time Swedish freestyle national champion (2016, 2017, 2018); UFC middleweight champion from 16 August 2025 (Dricus du Plessis, UFC 319), losing the title to Sean Strickland in his first defence on 9 May 2026; the first Chechen-born UFC champion and, after taking UAE citizenship in January 2025, the first athlete representing the Emirates to win a UFC title. Its only religion statement describes the family he was born into as 'a poor and conservative Muslim Chechen family'; it makes no statement of his own affiliation or school."
