summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حمزة شيماييف؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في الشيشان وهجرته إلى السويد، وبطولاته السويدية في المصارعة الحرة، وفوزه ببطولة يو إف سي للوزن المتوسط سنة 2025 وخسارته اللقب في دفاعه الأول سنة 2026، وقربه من رمضان قديروف."
  en: "English Wikipedia article on Khamzat Chimaev; used for entity facts only. It recounts his Chechen childhood and emigration to Sweden, his Swedish freestyle wrestling titles, his 2025 UFC middleweight championship win and his loss of the title in his first defence in 2026, and his closeness to Ramzan Kadyrov."
  es: "Artículo de la Wikipedia en inglés sobre Khamzat Chimaev; utilizado únicamente para obtener información sobre la persona. Narra su infancia en Chechenia y su emigración a Suecia, sus títulos suecos de lucha libre, su victoria en el campeonato de peso medio de la UFC en 2025 y la pérdida del título en su primera defensa en 2026, así como su estrecha relación con Ramzan Kadyrov."
  fr: "Article de Wikipédia en anglais sur Khamzat Chimaev; utilisé uniquement pour les informations sur l'entité. Il relate son enfance tchétchène et son émigration en Suède, ses titres de lutte libre suédoise, sa victoire au championnat UFC des poids moyens en 2025 et sa perte du titre lors de sa première défense en 2026, ainsi que sa proximité avec Ramzan Kadyrov."
  ur: "خمزت چیمائیف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کے چیچن بچپن اور سویڈن میں ہجرت، اس کے سویڈش فری اسٹائل ریسلنگ ٹائٹلز، اس کی 2025 UFC مڈل ویٹ چیمپئن شپ جیتنے اور 2026 میں اپنے پہلے دفاع میں ٹائٹل سے محرومی، اور رمضان قادروف سے اس کی قربت کا ذکر ہے۔"
  tr: "Hamza Shimayev hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Çeçenya'daki yetiştirilme tarzını, İsveç'e göçünü, İsveç serbest güreş şampiyonluklarını, 2025'te UFC orta sıklet şampiyonluğunu kazanmasını, 2026'daki ilk savunmasında unvanı kaybetmesini ve Ramazan Kadyrov ile yakınlığını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Hamza Shimayev; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan masa kecilnya di Chechnya, migrasinya ke Swedia, kejuaraan gulat gaya bebas Swedia, memenangkan gelar kelas menengah UFC pada 2025, kehilangan gelar dalam pertahanan pertamanya pada 2026, dan kedekatannya dengan Ramadan Kadyrov."
