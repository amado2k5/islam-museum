summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميرزا ملكم خان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده 1834 في جلفا الجديدة لأسرة أرمنية مسيحية وتلقيبه «أول مسيحي اتخذ لقب ميرزا»، وتعليمه في باريس، وتدريسه في دار الفنون، ومجتمعاته الشبيهة بالماسونية من سنة 1859 ونفيه، وزواجه في كنيسة أرمنية بقسطنطينية، وسفارته في لندن وإيطاليا، وصحيفته «قانون»، ووفاته في روما سنة 1908."
  en: "English Wikipedia article on Mirza Malkam Khan; used for entity facts only. It gives his birth in 1834 at New Julfa to an Armenian Christian family, calls him 'the first Christian to adopt the title of Mirza in Persian', and recounts his Paris education, his teaching at the Dar ul-Funun, his Freemason-like societies from 1859 and exile, his marriage in an Armenian church at Constantinople, his London and Italy embassies, his newspaper Qanun, and his death at Rome in 1908."
