reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. Its birth year 1834 conflicts with the Persian article and Wikidata, which give 1833 (the Persian article pairing it with 1248 AH); the record follows 1833 and discloses 1834. Its religion statements attach Christianity to him personally ('born to an Armenian Christian family'; 'the first Christian to adopt the title of Mirza'), but the standard scholarly monograph (Hamid Algar, Mirza Malkum Khan, 1973) documents both his formal profession of Islam and the evidence against its sincerity, so the question is contested and the record reads unknown."
