summary:
  ar: "مقالة ويكيبيديا العربية عن محمد سعيد رمضان البوطي؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته سنة 1347هـ/1929م في قرية جليكا بجزيرة بوطان ووفاته اغتيالًا في جامع الإيمان بدمشق في 9 جمادى الأولى 1434هـ الموافق 21 مارس 2013م ودفنه بجوار ضريح صلاح الدين، وهجرته مع أبيه ملا رمضان إلى دمشق سنة 1933، وتعليمه عند حسن حبنكة والأزهر، ومناصبه في كلية الشريعة بجامعة دمشق حتى عمادتها 1977، وإمامته الجامع الأموي، وتصفه في متنها بأنه «شافعي المذهب، وعلى عقيدة أهل السنَّة وفق منهج الأشاعرة»."
  en: "Arabic Wikipedia article on Muhammad Said Ramadan al-Bouti; used for entity facts only. It records his birth in 1347 AH / 1929 CE in the village of Jilka in the Botan (Cizre) district and his assassination at the al-Iman Mosque in Damascus on 9 Jumada al-awwal 1434 AH, 21 March 2013, with burial beside Saladin's shrine, his migration with his father Mulla Ramadan to Damascus in 1933, his education under Hasan Habannaka and at al-Azhar, his posts at the Damascus Faculty of Sharia up to the deanship in 1977, his imamate of the Umayyad Mosque, and states in its own text that he was Shafi'i in madhhab and on the Sunni creed according to the Ash'ari method."
  es: "Artículo de Wikipedia en árabe sobre Muhammad Said Ramadan al-Bouti; utilizado únicamente para datos sobre la persona. Registra su nacimiento en 1347 AH / 1929 CE en la aldea de Jilka en el distrito de Botan (Cizre) y su asesinato en la Mezquita al-Iman en Damasco el 9 de Jumada al-awwal de 1434 AH, 21 de marzo de 2013, con entierro junto al santuario de Saladino, su migración con su padre Mulla Ramadan a Damasco en 1933, su educación con Hasan Habannaka y en al-Azhar, sus cargos en la Facultad de Sharia de Damasco hasta el decanato en 1977, su imamato de la Mezquita Omeya, y afirma en su propio texto que era shafi'i en madhhab y en el credo sunita según el método ash'ari."
  fr: "L'article de Wikipédia en arabe consacré à Muhammad Said Ramadan al-Bouti, utilisé uniquement à des fins d'information sur l'entité, relate sa naissance en 1347 AH / 1929 CE dans le village de Jilka, district de Botan (Cizre), son assassinat à la mosquée al-Iman de Damas le 9 Jumada al-awwal 1434 AH (21 mars 2013), son inhumation près du mausolée de Saladin, son émigration à Damas avec son père, Mulla Ramadan, en 1933, ses études auprès de Hasan Habannaka et à al-Azhar, ses fonctions à la faculté de charia de Damas jusqu'à sa nomination comme doyen en 1977, son imamat de la mosquée des Omeyyades, et précise qu'il était de l'école chaféite et de confession sunnite selon le rite ash'arite."
  ur: "محمد سعید رمضان البوطی پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی ولادت 1347ھ / 1929 عیسوی میں بوتان ⁦(سیزر)⁩ ضلع کے گاؤں جلکا میں اور 9 جمادی الاول 1434 ہجری 21 مارچ 2013 کو دمشق کی مسجد الایمان میں ان کا قتل درج کیا گیا ہے، ان کے والد صلاح الدین مشکۃ المصاص کے ساتھ ان کی تدفین کے ساتھ۔ 1933، حسن حبانناکہ اور الازہر میں ان کی تعلیم، دمشق فیکلٹی آف شریعہ میں 1977 میں ڈین شپ تک ان کے عہدے، اموی مسجد کے ان کے امام، اور اپنے متن میں بیان کرتے ہیں کہ وہ اشعری کے طریقے کے مطابق مذہب اور سنی مسلک پر شافعی تھے۔"
  tr: "Muhammed Said Ramazan El-Bouti hakkında Arapça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmaktadır. Doğumu 1347 Hicri / 1929 yılında Butan Adası'ndaki Jalika köyünde, 9 Cumada'l-Avvel 1434 Hicri'de Şam'daki El-İman Camii'nde suikastla öldüğü ve 21 Mart 2013 M.S. tarihine denk gelen türbesinin yanına defnedilmesi belgelenmiştir. 1933'te babası Mulla Ramazan ile birlikte Şam'a göç etti, Hasan Habanka ve El-Ezher'in yanında eğitim aldı, Şam Üniversitesi Şeriat Fakültesi'nde 1977'de dekanlığa kadar görev yaptı ve Emevi Camii'nin başında bulundu. Metinde onu, 'Eşeri metodolojisine göre Ehl-sünnet mezhebini takip eden düşünce okulunun Şafii'si' olarak tanımlar."
  id: "Artikel Wikipedia bahasa Arab tentang Muhammad Saeed Ramadan Al-Bouti hanya digunakan untuk fakta-fakta entitas tersebut. Kelahirannya tercatat pada tahun 1347 H / 1929 M di desa Jalika di Pulau Butan, kematiannya akibat pembunuhan di Masjid Al-Iman di Damaskus pada 9 Jumada al-Awwal 1434 H, yang bertepatan dengan 21 Maret 2013 M, dan pemakamannya di sebelah makam Salah al-Din. Ia bermigrasi bersama ayahnya Mulla Ramadan ke Damaskus pada tahun 1933, belajar di bawah bimbingan Hassan Habanka dan Al-Azhar, memegang jabatan di Fakultas Syariah di Universitas Damaskus hingga diangkat sebagai dekan pada tahun 1977, dan memimpin Masjid Umayyah. Teks tersebut menggambarkannya sebagai 'Syafi'i dari aliran pemikiran, mengikuti ajaran Ahl al-Sunnah menurut metodologi Ash'ari.'"
