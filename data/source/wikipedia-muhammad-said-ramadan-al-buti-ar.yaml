reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md), read in full on 1 November 2026 at the recorded revision (the revision id was fetched via the MediaWiki API; the text was read on the rendered page). It is a long independent Arabic biography, not a translation of the English article. Points drawn from it: the heading dates (1347–1434 AH / 1929–2013 CE); the lead's faith attestation in text, 'he represents the conservative trend, Shafi'i in madhhab, and on the creed of Ahl al-Sunna according to the Ash'ari method', with the infobox giving the school as Shafi'i and the creed as Ash'ariyya (structured values, corroborating only); birth in the village of Jilka, Jazirat ibn Umar (Botan), on the Tigris at the meeting of the Syrian, Iraqi and Turkish borders, to a Kurdish tribal family; the 1933 migration to Damascus with his father Mulla Ramadan; his father's teaching, the Manjak Mosque and Hasan Habannaka, the Institute of Islamic Orientation completed 1953, al-Azhar (Sharia ijaza 1955, education diploma 1956 — the English article dates the Azhar period slightly differently and the record follows the Arabic on his schooling); the Damascus posts (instructor 1960, doctorate in usul al-sharia 1965, vice-dean 1975, dean 1977, head of the creeds and religions department), the Umayyad Mosque imamate and the Union of Levant Scholars presidency; his more than sixty books; his stance in the 2011–2013 crisis; and his killing on Thursday 9 Jumada al-awwal 1434, 21 March 2013, while giving a tafsir lesson at the al-Iman Mosque in the Mazraa district (the official account of a suicide bombing, 42 others killed including his grandson, 84 wounded; the rival accounts and attributions are carried in the prose), with burial beside the shrine of Saladin next to the Umayyad Mosque on 23 March 2013."
