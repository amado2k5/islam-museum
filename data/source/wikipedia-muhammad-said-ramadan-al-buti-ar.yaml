summary:
  ar: "مقالة ويكيبيديا العربية عن محمد سعيد رمضان البوطي؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته سنة 1347هـ/1929م في قرية جليكا بجزيرة بوطان ووفاته اغتيالًا في جامع الإيمان بدمشق في 9 جمادى الأولى 1434هـ الموافق 21 مارس 2013م ودفنه بجوار ضريح صلاح الدين، وهجرته مع أبيه ملا رمضان إلى دمشق سنة 1933، وتعليمه عند حسن حبنكة والأزهر، ومناصبه في كلية الشريعة بجامعة دمشق حتى عمادتها 1977، وإمامته الجامع الأموي، وتصفه في متنها بأنه «شافعي المذهب، وعلى عقيدة أهل السنَّة وفق منهج الأشاعرة»."
  en: "Arabic Wikipedia article on Muhammad Said Ramadan al-Bouti; used for entity facts only. It records his birth in 1347 AH / 1929 CE in the village of Jilka in the Botan (Cizre) district and his assassination at the al-Iman Mosque in Damascus on 9 Jumada al-awwal 1434 AH, 21 March 2013, with burial beside Saladin's shrine, his migration with his father Mulla Ramadan to Damascus in 1933, his education under Hasan Habannaka and at al-Azhar, his posts at the Damascus Faculty of Sharia up to the deanship in 1977, his imamate of the Umayyad Mosque, and states in its own text that he was Shafi'i in madhhab and on the Sunni creed according to the Ash'ari method."
