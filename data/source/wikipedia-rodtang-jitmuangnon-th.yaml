summary:
  ar: "مقالة ويكيبيديا التايلاندية عن رودتانغ جيتموانغنون؛ تُستخدم لوقائع الكيان فقط. توثّق مسيرته وألقابه، وتذكر في حياته الشخصية زواجه من أيدا لوكسايكونغدين في 14 فبراير 2023 دون أن تتحدث عن اعتناقه الإسلام، وتصنّفه في فئتي المتحولين من البوذية إلى الإسلام والمسلمين التايلانديين."
  en: "Thai Wikipedia article on Rodtang Jitmuangnon; used for entity facts only. It documents his career and titles, and records in his personal life his marriage to Aida Looksaikongdin on 14 February 2023 without discussing his conversion, while filing him in the categories Converts to Islam from Buddhism and Thai Muslims."
  es: "Artículo de la Wikipedia en tailandés sobre Rodtang Jitmuangnon; utilizado únicamente para obtener información sobre la persona. Documenta su trayectoria profesional y títulos, y registra en su vida personal su matrimonio con Aida Looksaikongdin el 14 de febrero de 2023, sin mencionar su conversión, mientras lo clasifica en las categorías de Conversos al Islam desde el budismo y Musulmanes tailandeses."
  fr: "Article de Wikipédia thaïlandais sur Rodtang Jitmuangnon; utilisé uniquement à titre informatif. Il documente sa carrière et ses titres, et mentionne son mariage avec Aida Looksaikongdin le 14 février 2023, sans aborder sa conversion, tout en le classant dans les catégories « Convertis du bouddhisme à l’islam » et « Musulmans thaïlandais »."
  ur: "Rodtang Jitmuangnon پر تھائی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کے کیریئر اور عنوانات کو دستاویز کرتا ہے، اور اس کی ذاتی زندگی میں 14 فروری 2023 کو ایڈا لکسائیکونگڈن کے ساتھ اس کی شادی کو اس کی تبدیلی پر بحث کیے بغیر ریکارڈ کرتا ہے، جبکہ اسے بدھ مت اور تھائی مسلمانوں سے اسلام قبول کرنے والے زمروں میں درج کرتا ہے۔"
