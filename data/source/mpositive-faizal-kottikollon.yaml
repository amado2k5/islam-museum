summary:
  ar: "أرشيف تغطية موقع إمبوزيتيف لفايزال كوتيكولون وعائلته: الموقع سجلٌّ لإنجازات مسلمي الهند، وتغطيته — ومنها إدراج زوجته شبّانة بين نساء كيرالا المسلمات الملهمات — تأطير مجتمعي يُستشهد به في سجل الشخص كقرينة محيط فقط لا كإثبات دين."
  en: "Mpositive's tag archive of its coverage of Faizal Kottikollon and his family; Mpositive is a chronicle of Indian Muslim achievers, and its coverage — including its listing of his wife Shabana among inspiring Muslim women of Kerala — is community framing, cited in the person record as milieu evidence only, not as attestation of faith."
  es: "El archivo de etiquetas de Mpositive sobre su cobertura de Faizal Kottikollon y su familia; Mpositive es una crónica de los musulmanes indios que han alcanzado el éxito, y su cobertura, incluida la inclusión de su esposa Shabana entre las mujeres musulmanas inspiradoras de Kerala, es un marco comunitario, citado en el registro de la persona solo como evidencia del entorno, no como una prueba de fe."
  fr: "Les archives de Mpositive concernant sa couverture de Faizal Kottikollon et de sa famille; Mpositive est une chronique des réussites des musulmans indiens, et sa couverture — y compris son classement de sa femme Shabana parmi les femmes musulmanes inspirantes du Kerala — est un cadrage communautaire, cité dans la fiche de la personne comme preuve du milieu seulement, et non comme attestation de foi."
  ur: "Mpositive کا فیضل کوٹیکولن اور اس کے خاندان کی کوریج کا ٹیگ آرکائیو؛ Mpositive ہندوستانی مسلم کامیابیاں حاصل کرنے والوں کی ایک تاریخ ہے، اور اس کی کوریج - بشمول اس کی بیوی شبانہ کی کیرالہ کی متاثر کن مسلم خواتین میں فہرست - کمیونٹی کی تشکیل ہے، جس کا حوالہ ذاتی ریکارڈ میں صرف ایک ثبوت کے طور پر دیا گیا ہے، نہ کہ ایمان کی تصدیق کے طور پر۔"
