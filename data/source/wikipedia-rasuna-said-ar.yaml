  ar: "مقالة ويكيبيديا العربية عن راسونا سعيد؛ تُستخدم لوقائع الكيان فقط. تختصر سيرة الإنجليزية: ميلادها في مانينجاو سنة 1910 وعائلتها المسلمة المتدينة، وعملها مدرّسة مساعدة في دينية بوتري، ونشاطها السياسي حتى وفاتها سنة 1965."
  en: "Arabic Wikipedia article on Rasuna Said; used for entity facts only. It abridges the English article's account: her birth at Maninjau in 1910 to a devout Muslim family, her work as an assistant teacher at Diniyah Putri, and her political activity until her death in 1965."
  es: "Artículo en árabe de la Wikipedia sobre Rasuna Said; se utiliza únicamente para obtener información sobre la persona. Este resumen describe su nacimiento en Maninjau en 1910 en el seno de una familia musulmana devota, su trabajo como profesora auxiliar en Diniyah Putri y su actividad política hasta su fallecimiento en 1965."
  fr: "Article de Wikipédia en arabe sur Rasuna Said; utilisé uniquement pour les informations la concernant. Il résume l’article en anglais: sa naissance à Maninjau en 1910 dans une famille musulmane pratiquante, son travail d’assistante enseignante à Diniyah Putri et son engagement politique jusqu’à sa mort en 1965."
