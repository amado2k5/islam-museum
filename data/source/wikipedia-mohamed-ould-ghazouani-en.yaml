summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد ولد الغزواني؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته قائدا عاما للجيوش ووزير دفاع ثم رئيسا لموريتانيا منذ 2019، وتذكر أنه من أسرة صوفية بربرية معروفة وأنه ابن زعيم روحي لقبيلة إديبوسات المرابطية وأنه حفظ القرآن؛ ولا تنسب إليه في متنها انتماء شخصيا أو مذهبا."
  en: "English Wikipedia article on Mohamed Ould Ghazouani; used for entity facts only. It recounts his decade as chief of staff of the armed forces, his defence ministry, his 2019 election and presidency, and his 2024 re-election. On background it says he belongs to a well-known Berber-Sufi family, is the son of a spiritual leader of the maraboutic Ideiboussat tribe, and has memorised the Quran; its own text names no personal affiliation or school for him, and it files him under Mauritanian Sufis."
  es: "Artículo de la Wikipedia en inglés sobre Mohamed Ould Ghazouani; utilizado únicamente para datos sobre la persona. Relata su década como jefe del Estado Mayor de las Fuerzas Armadas, su ministerio de Defensa, su elección y presidencia en 2019, y su reelección en 2024. En sus antecedentes, indica que pertenece a una conocida familia bereber-sufí, es hijo de un líder espiritual de la tribu marabática Ideiboussat y ha memorizado el Corán; el texto no menciona ninguna afiliación personal ni escuela a la que pertenezca, y lo clasifica dentro de los sufíes mauritanos."
  fr: "Article de Wikipédia en anglais sur Mohamed Ould Ghazouani; utilisé uniquement pour les informations sur l’entité. Il relate sa décennie à la tête des forces armées, son ministère de la Défense, son élection et sa présidence en 2019, ainsi que sa réélection en 2024. Concernant ses origines, l’article indique qu’il appartient à une famille berbère soufie renommée, qu’il est le fils d’un chef spirituel de la tribu maraboutique des Ideiboussat et qu’il a mémorisé le Coran; le texte lui-même ne mentionne aucune affiliation personnelle ni école, et le classe parmi les soufis mauritaniens."
