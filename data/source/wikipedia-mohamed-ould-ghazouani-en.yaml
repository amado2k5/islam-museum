  ar: "مقالة ويكيبيديا الإنجليزية عن محمد ولد الغزواني؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته قائدا عاما للجيوش ووزير دفاع ثم رئيسا لموريتانيا منذ 2019، وتذكر أنه من أسرة صوفية بربرية معروفة وأنه ابن زعيم روحي لقبيلة إديبوسات المرابطية وأنه حفظ القرآن؛ ولا تنسب إليه في متنها انتماء شخصيا أو مذهبا."
  en: "English Wikipedia article on Mohamed Ould Ghazouani; used for entity facts only. It recounts his decade as chief of staff of the armed forces, his defence ministry, his 2019 election and presidency, and his 2024 re-election. On background it says he belongs to a well-known Berber-Sufi family, is the son of a spiritual leader of the maraboutic Ideiboussat tribe, and has memorised the Quran; its own text names no personal affiliation or school for him, and it files him under Mauritanian Sufis."
