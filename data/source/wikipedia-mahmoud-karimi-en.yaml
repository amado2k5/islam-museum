  en: "The English Wikipedia article on the Iranian maddah Mahmoud Karimi: born in 1968 in the Nezamabad area of Tehran, one of Iran's best-known eulogists, writing much of his own verse, performing at Muharram and Fatimiyya ceremonies, and leading the Rayat al-Abbas hey'at at Chizar in northern Tehran."
