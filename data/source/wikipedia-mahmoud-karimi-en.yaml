reliability_note: "Read in full on 7 November 2026; the reading tools available in this run did not expose a revision id, so none is recorded. Used for: his birth in 1968 in Nezamabad, Tehran (cited there to Asr-e Iran); his father missing in action in 1982 and a brother killed in 1986; his first recitation at seven at a mosque in Shahin Shahr; his unfinished industrial-management studies at Allameh Tabataba'i University; his leadership of the Rayat al-Abbas hey'at (formerly Hey'at-e Razmandegan-e Eslam) at the Imamzadeh Ali Akbar shrine in Chizar; his sanj and dammam style; his regular performances at the Imam Khomeini Hussainiya in ceremonies attended by Ali Khamenei, including the summer 2025 rendition of 'Ey Iran'; his statement that his income comes from a brick factory he co-owns near Buin Zahra; and the attributed accounts of the 2013 highway shooting and the 2020 televised recitation controversies. Its lead calls him 'a reciter of Shia religious elegies' and its infobox gives his occupation as 'Maddah (Shia eulogist)' — a description of his profession and repertoire, preserved in the person record's faith note. This Mahmoud Karimi is the maddah, not Mahmoud Karimi Sibaki the footballer (born 1978) and not the traditional singer Mahmoud Karimi (1927–1984)."
