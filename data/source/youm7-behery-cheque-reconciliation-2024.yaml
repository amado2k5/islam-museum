summary:
  ar: "تقرير اليوم السابع عن حكم محكمة جنح مدينة نصر بانقضاء دعوى شيكات بالتصالح."
  en: "Youm7's report that the Nasr City misdemeanour court ruled a cheque case extinguished by reconciliation."
  es: "Según informa Youm7, el tribunal de delitos menores de Nasr City dictaminó que un caso relacionado con un cheque se había extinguido mediante conciliación."
  fr: "Selon le rapport de Youm7, le tribunal correctionnel de Nasr City a statué qu'une affaire de chèque était close par conciliation."
  ur: "Youm7 کی رپورٹ میں بتایا گیا ہے کہ نصر سٹی بدعنوانی کی عدالت نے ایک چیک کیس کا فیصلہ صلح سے ختم کر دیا۔"
  tr: "Youm7, Nasr City Hafif Suç Mahkemesi'nin çek davasını uzlaştırma yoluyla reddetme kararı hakkında rapor."
  id: "Youm7 melaporkan putusan Pengadilan Pelanggaran Ringan Kota Nasr untuk membatalkan gugatan cek dengan rekonsiliasi."
