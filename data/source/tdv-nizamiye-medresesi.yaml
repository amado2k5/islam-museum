reliability_note: "Read the introduction, Baghdad section and sections on Nishapur, Isfahan, Balkh, Mosul, Basra, Herat, Merv and Amul. The Baghdad opening is dated 10 Dhu al-Qada 459 / 22 September 1067, distinct from construction in 457/1065 and from the earlier Nishapur foundation. Institutional details are attributed to this survey, not represented as independently checked medieval citations. The four-year course, age threshold and book total are the survey's reports, not a modern university equivalence. Dates of closure and the fate in 1258 remain uncertain."
