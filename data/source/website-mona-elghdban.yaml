reliability_note: "Her own website — a primary source for her name, her field and her own presentation of her work, not independent corroboration. Its topic index lists her subjects in her own terms: self-development (her largest category, over 130 posts), the law of attraction, chakras, numerology, Transurfing and a category on reincarnation (tanasukh al-arwah); the site publishes the contents of her book 'Asrar al-Wa'y' and links out to her YouTube lectures. It gives no birth date and names no school of law for her. Checked 26 October 2026."
