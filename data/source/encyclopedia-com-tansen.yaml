reliability_note: "Reference entry headed 'TANSEN (1506–1589), Indian musician', read through its indexed text on 7 November 2026 (the page itself could not be fetched in this run, so no claim rests on anything beyond the indexed text). It names his father Markand Pandey, a poet of a village near Gwalior; his being sent to Vrindavan to study under the musician saint Swami Haridas; his appointment as court musician at Gwalior and then at Rewa; Akbar's invitation and the Navaratna honour; Abul Fazl's praise of him as chronicler of the reign; his gaurhar bani dhrupad style, reshaped with Persian nuances such as meend and gamaka; his codification of about four hundred ragas, with Sangita Sara and Ragamala as important documents; his wife Hussaini and their children; and his death at the age of eighty-three, around 1589, buried at Gwalior next to the tomb of Mohammad Ghaus. Its bibliography cites the Ain-i-Akbari in Blochmann's translation. Its 1506 birth year is one of the competing datings preserved in the person's born note."
