summary:
  ar: "مدخل Encyclopedia.com عن تانسين، معنون بسنوات (1506–1589)؛ يختصر نشأته وتتلمذه على سوامي هاريداس وبلاطي غواليور وريوا ودعوة أكبر له ووفاته نحو 1589 ودفنه في غواليور بجوار قبر محمد غوث."
  en: "Encyclopedia.com entry on Tansen, headed with the years 1506–1589; it summarises his upbringing, his study under Swami Haridas, the Gwalior and Rewa courts, Akbar's invitation, his death around 1589 and his burial at Gwalior next to the tomb of Mohammad Ghaus."
  es: "Entrada de Encyclopedia.com sobre Tansen, encabezada con los años 1506-1589; resume su infancia, sus estudios con Swami Haridas, las cortes de Gwalior y Rewa, la invitación de Akbar, su muerte alrededor de 1589 y su entierro en Gwalior junto a la tumba de Mohammad Ghaus."
  fr: "L'article d'Encyclopedia.com sur Tansen, commençant par les années 1506-1589, résume son éducation, ses études auprès de Swami Haridas, les cours de Gwalior et de Rewa, l'invitation d'Akbar, sa mort vers 1589 et son enterrement à Gwalior à côté du tombeau de Mohammad Ghaus."
  ur: "تانسین پر Encyclopedia.com کا اندراج، سال 1506-1589 کے ساتھ؛ اس میں ان کی پرورش، سوامی ہری داس کے زیر مطالعہ، گوالیار اور ریوا کی عدالتوں، اکبر کی دعوت، 1589 کے آس پاس ان کی موت اور محمد غوث کے مقبرے کے ساتھ گوالیار میں ان کی تدفین کا خلاصہ ہے۔"
