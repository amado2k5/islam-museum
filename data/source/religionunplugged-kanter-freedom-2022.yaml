summary:
  ar: "ملف «ريليجن أنبلغد» ⁦(7 فبراير 2022)⁩: يصف كانتر فريدوم بأنه مسلم ممارس، ويذكر تجنّسه وتغيير اسمه سنة 2021 ونشأته في حركة غولن، دون أن يسمي مذهباً فقهياً."
  en: "Religion Unplugged profile of 7 February 2022: it describes Freedom as a practising Muslim and a Muslim American, records his November 2021 citizenship and legal name change, and reports that he was raised in the Gülen (Hizmet) movement and attended its schools in Turkey. It names no school of Islamic law or theology."
  es: "Perfil de Religion Unplugged del 7 de febrero de 2022: describe a Freedom como musulmán practicante y estadounidense musulmán, registra su cambio de ciudadanía y nombre legal en noviembre de 2021 e informa que se crió en el movimiento Gülen (Hizmet) y asistió a sus escuelas en Turquía. No menciona ninguna escuela de derecho o teología islámica."
  fr: "Profil de Freedom sur Religion Unplugged du 7 février 2022: il est décrit comme un musulman pratiquant et un Américain musulman, mentionne son acquisition de la citoyenneté et son changement de nom légal en novembre 2021, et indique qu’il a été élevé au sein du mouvement Gülen (Hizmet) et a fréquenté ses écoles en Turquie. Aucune école de droit islamique ou de théologie n’est citée."
  ur: "7 فروری 2022 کا مذہب ان پلگ شدہ پروفائل: یہ آزادی کو ایک عملی مسلمان اور ایک مسلمان امریکی کے طور پر بیان کرتا ہے، اس کی نومبر 2021 کی شہریت اور قانونی نام کی تبدیلی کو ریکارڈ کرتا ہے، اور رپورٹ کرتا ہے کہ اس کی پرورش Gülen (Hizmet) تحریک میں ہوئی تھی اور اس نے ترکی میں اس کے اسکولوں میں تعلیم حاصل کی تھی۔ اس میں اسلامی قانون یا الہیات کے کسی مکتب کا نام نہیں ہے۔"
  tr: "\"Religion Unbelievable\" dosyası (7 Şubat 2022): Kanter, Freedom'u uygulayan bir Müslüman olarak tanımlar, vatandaşlık alanından, 2021'deki isim değişikliğinden ve Gülen hareketindeki yetiştirilmesinden bahseder, ancak herhangi bir fıkıh okulunu belirtmez."
  id: "Berkas \"Religion Unbelievable\" (7 Februari 2022): Kanter menggambarkan Freedom sebagai Muslim yang taat, menyebutkan naturalisasinya, perubahan nama pada 2021, dan masa kecilnya dalam gerakan Gülen, tanpa menyebutkan sekolah hukum manapun."
