summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد سعيد رمضان البوطي؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته سنة 1929 في قرية جيلكا قرب جزيرة ابن عمر بتركيا ووفاته اغتيالًا في جامع الإيمان بدمشق في 21 مارس 2013، وهجرة أسرته إلى دمشق وله أربع سنوات، ودراسته في الأزهر ودكتوراه الشريعة 1965، وعمادته كلية الشريعة بجامعة دمشق، وإمامته الجامع الأموي، وأكثر من ستين كتابًا، وتصفه بأنه عالم سني وأنه تخصّص في الفقه وأصوله على المذهب الشافعي ضمن العقيدة الأشعرية الأرثوذكسية."
  en: "English Wikipedia article on Muhammad Said Ramadan al-Bouti; used for entity facts only. It records his birth in 1929 in the village of Jeilka near Cizre, Turkey, and his assassination at the al-Iman Mosque in Damascus on 21 March 2013, his family's migration to Damascus when he was four, his al-Azhar studies and 1965 doctorate, his deanship of the Damascus Faculty of Sharia and imamate of the Umayyad Mosque, his more than sixty books, and describes him as a Sunni scholar who specialized in fiqh and usul al-fiqh according to the Shafi'i school within the orthodox Ash'ari creed."
