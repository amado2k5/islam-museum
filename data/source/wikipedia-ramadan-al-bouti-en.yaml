reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md), read in full on 1 November 2026 at the recorded revision, fetched via the MediaWiki API. The title 'Muhammad Said Ramadan al-Bouti' is a redirect to this article. Points drawn from it: the lead dates (1929 – 21 March 2013) and 'renowned Syrian Sunni Muslim scholar'; birth in the village of Jeilka near Cizre, Turkey, to a Hadhabani Kurdish family, and the migration to Damascus at age four; tutoring by his father Mulla Ramadan; studies under Hasan Habannakah; al-Azhar Faculty of Sharia degree and education diploma; teaching at Homs 1958–1961, Damascus lecturer from 1960, doctorate 1965, dean of the Faculty of Sharia 1977–1983, professor of comparative law and lecturer on creed and sira; preacher of the Umayyad Mosque from 2008; more than sixty books. On faith, the article's own text attests the man himself: he was 'a leading figure of Islamic neo-traditionalism which adhered to the four schools of thought in Sunni Islam and the orthodox Ash'arite creed', and 'Al-Bouti specialized in fiqh (Islamic jurisprudence) and usul al-fiqh (principles of jurisprudence) according to the Shafi'i school of law'. The death section records the bombing at al-Iman Mosque in the Mazraa district during his lesson (at least 42 killed), the disputed circumstances and the December 2013 televised confessions attributed to Jabhat al-Nusra members."
