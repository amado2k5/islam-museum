summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد شاه قاجار؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في تبريز في 21 يناير 1898، وجلوسه على العرش طفلًا سنة 1909 بعد خلع أبيه محمد علي شاه، وعهده حتى إطاحة الأسرة القاجارية في 31 أكتوبر 1925، ووفاته في نويي بفرنسا في 21 فبراير 1930 ودفنه في كربلاء."
  en: "English Wikipedia article on Ahmad Shah Qajar; used for entity facts only. It gives his birth at Tabriz on 21 January 1898, his accession as a child in 1909 after his father Mohammad Ali Shah's deposition, his reign until the Qajar dynasty was deposed on 31 October 1925, and his death at Neuilly-sur-Seine in France on 21 February 1930 and burial at Karbala."
  es: "Artículo de la Wikipedia en inglés sobre Ahmad Shah Qajar; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Tabriz el 21 de enero de 1898, su ascenso al trono siendo niño en 1909 tras la deposición de su padre, Mohammad Ali Shah, su reinado hasta la deposición de la dinastía Qajar el 31 de octubre de 1925, y su muerte en Neuilly-sur-Seine, Francia, el 21 de febrero de 1930, y su entierro en Karbala."
  fr: "Article de Wikipédia en anglais sur Ahmad Shah Qajar; utilisé uniquement pour les informations factuelles. Il indique sa naissance à Tabriz le 21 janvier 1898, son accession au trône en tant qu'enfant en 1909 après la destitution de son père Mohammad Ali Shah, son règne jusqu'à la chute de la dynastie Qajar le 31 octobre 1925, et sa mort à Neuilly-sur-Seine en France le 21 février 1930 et son inhumation à Karbala."
  ur: "احمد شاہ قاجار پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 21 جنوری 1898 کو تبریز میں ہوئی، 1909 میں اپنے والد محمد علی شاہ کی معزولی کے بعد بچپن میں ان کا الحاق، 31 اکتوبر 1925 کو قاجار خاندان کے معزول ہونے تک ان کا دور حکومت، اور فرانس کے نیولی سور سین میں 21 فروری 1930 کو کربلا اور کربلا میں ان کی موت ہوئی۔"
