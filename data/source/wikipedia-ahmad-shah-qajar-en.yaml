  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد شاه قاجار؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في تبريز في 21 يناير 1898، وجلوسه على العرش طفلًا سنة 1909 بعد خلع أبيه محمد علي شاه، وعهده حتى إطاحة الأسرة القاجارية في 31 أكتوبر 1925، ووفاته في نويي بفرنسا في 21 فبراير 1930 ودفنه في كربلاء."
  en: "English Wikipedia article on Ahmad Shah Qajar; used for entity facts only. It gives his birth at Tabriz on 21 January 1898, his accession as a child in 1909 after his father Mohammad Ali Shah's deposition, his reign until the Qajar dynasty was deposed on 31 October 1925, and his death at Neuilly-sur-Seine in France on 21 February 1930 and burial at Karbala."
