  ar: "مقالة ويكيبيديا الفرنسية عن إبراهيم إنياس؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه أستاذ صوفي مشهور وقائد روحي داخل الجماعة التيجانية، وتروي إعلانه نفسه وريثًا روحيًا لأحمد التيجاني وتلقينه المريدين التربية (التربية الروحية)."
  en: "French Wikipedia article on Ibrahim Niass; used for entity facts only. It calls him a renowned Sufi master and a spiritual leader within the Tijani brotherhood, and recounts his declaring himself the spiritual heir of Ahmad Tijani and his initiating disciples into the Tarbiyya, the mystic initiation."
