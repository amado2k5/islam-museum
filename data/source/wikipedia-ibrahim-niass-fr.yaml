reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 at the recorded revision, fetched by revision id via the MediaWiki API and the returned id asserted equal. An original French article, independent of the English one: its lead is a personal attestation of his own affiliation ('un maître soufi renommé, ainsi qu'un chef spirituel au sein de la confrérie Tijaniyya'), and its biography describes his own initiatory practice. It gives his birth on 8 November 1900 at Taïba Niassène and his death on 26 July 1975 in London, agreeing with the English article and Wikidata. It names no madhhab for him. The page carries an on-page notice that its sources need linking, so its facts are used only where they agree with the other editions."
