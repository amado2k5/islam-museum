summary:
  ar: "مقالة ويكيبيديا الفرنسية عن إبراهيم إنياس؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه أستاذ صوفي مشهور وقائد روحي داخل الجماعة التيجانية، وتروي إعلانه نفسه وريثًا روحيًا لأحمد التيجاني وتلقينه المريدين التربية ⁦(التربية الروحية)⁩."
  en: "French Wikipedia article on Ibrahim Niass; used for entity facts only. It calls him a renowned Sufi master and a spiritual leader within the Tijani brotherhood, and recounts his declaring himself the spiritual heir of Ahmad Tijani and his initiating disciples into the Tarbiyya, the mystic initiation."
  es: "Artículo de la Wikipedia en francés sobre Ibrahim Niass; utilizado únicamente para obtener información sobre la persona. Lo describe como un renombrado maestro sufí y líder espiritual dentro de la hermandad Tijani, y relata cómo se declaró heredero espiritual de Ahmad Tijani e inició a sus discípulos en la Tarbiyya, la iniciación mística."
  fr: "Article de Wikipédia en français sur Ibrahim Niass; utilisé uniquement à des fins d’information sur l’entité. Il le décrit comme un maître soufi renommé et un chef spirituel au sein de la confrérie Tijani, et relate comment il s’est proclamé héritier spirituel d’Ahmad Tijani et a initié ses disciples à la Tarbiyya, l’initiation mystique."
  ur: "ابراہیم نیاس پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انہیں ایک مشہور صوفی استاد اور تیجانی بھائی چارے کے اندر ایک روحانی پیشوا کہتا ہے، اور اپنے آپ کو احمد تیجانی کا روحانی وارث اور تربیہ، جو کہ صوفیانہ آغاز کرنے والے شاگردوں کا آغاز کرتا ہے، کا اعلان کرتا ہے۔"
  tr: "İbrahim İnias hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Tijaniyya topluluğu içinde ünlü bir Sufi öğretmeni ve manevi lider olarak tanımlanır ve Ahmad Tijani ile öğrencilerinin manevi eğitim verdiği ilanını anlatır."
  id: "Artikel Wikipedia Prancis tentang Ibrahim Inias; digunakan hanya untuk fakta entitas tersebut. Ia digambarkan sebagai guru Sufi terkenal dan pemimpin spiritual dalam komunitas Tijaniyya, dan menceritakan deklarasinya sebagai pewaris spiritual Ahmad Tijani dan murid-muridnya yang mengajarinya pendidikan spiritual."
