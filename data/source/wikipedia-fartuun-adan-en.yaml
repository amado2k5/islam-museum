reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Its infobox gives 'Fartuun Abdisalaan Adan', born 2 February 1969 in Somalia, executive director of the Elman Peace and Human Rights Centre, spouse Elman Ali Ahmed, children including Ilwad. Its text records the 1996 assassination, the move to Ottawa in 1999, the 2007 return, Sister Somalia as the country's first rape crisis programme, and the International Women of Courage Award (2013), Gleitsman Award (2015), Aurora Prize (2020) and Right Livelihood Award (2022). It names no religion or school for her, which is why her person record's faith segment is unknown."
