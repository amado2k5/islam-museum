  ar: "مقالة ويكيبيديا الإنجليزية عن فرتون آدن؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في 2 فبراير 1969، وزواجها من علمان علي أحمد واغتياله سنة 1996، وهجرتها إلى كندا سنة 1999 وعودتها سنة 2007، وإدارتها مركز علمان و«الأخت الصومال»، وجوائزها، ولا تسمّي لها دينًا أو مذهبًا."
  en: "English Wikipedia article on Fartuun Adan; used for entity facts only. It records her birth on 2 February 1969, her marriage to Elman Ali Ahmed and his assassination in 1996, her emigration to Canada in 1999 and return in 2007, her direction of Elman Peace and Sister Somalia, and her awards, and names no religion or school for her."
