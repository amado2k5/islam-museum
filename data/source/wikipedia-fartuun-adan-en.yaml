summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فرتون آدن؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في 2 فبراير 1969، وزواجها من علمان علي أحمد واغتياله سنة 1996، وهجرتها إلى كندا سنة 1999 وعودتها سنة 2007، وإدارتها مركز علمان و«الأخت الصومال»، وجوائزها، ولا تسمّي لها دينًا أو مذهبًا."
  en: "English Wikipedia article on Fartuun Adan; used for entity facts only. It records her birth on 2 February 1969, her marriage to Elman Ali Ahmed and his assassination in 1996, her emigration to Canada in 1999 and return in 2007, her direction of Elman Peace and Sister Somalia, and her awards, and names no religion or school for her."
  es: "Artículo de la Wikipedia en inglés sobre Fartuun Adan; utilizado únicamente para obtener información sobre la persona. En él se registra su nacimiento el 2 de febrero de 1969, su matrimonio con Elman Ali Ahmed y su asesinato en 1996, su emigración a Canadá en 1999 y su regreso en 2007, su labor como directora de Elman Peace y Sister Somalia, y sus premios; no se menciona ninguna religión ni escuela a la que haya asistido."
  fr: "L'article de Wikipédia en anglais consacré à Fartuun Adan est utilisé uniquement à des fins d'information sur la personne. Il mentionne sa naissance le 2 février 1969, son mariage avec Elman Ali Ahmed et l'assassinat de ce dernier en 1996, son émigration au Canada en 1999 et son retour en 2007, sa direction d'Elman Peace et de Sister Somalia, ainsi que les distinctions qu'elle a reçues. Aucune mention n'est faite de sa religion ou de son appartenance scolaire."
  ur: "فرطون عدن پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 2 فروری 1969 کو اس کی پیدائش، ایلمان علی احمد سے اس کی شادی اور 1996 میں اس کا قتل، 1999 میں اس کی کینیڈا ہجرت اور 2007 میں واپسی، ایلمن پیس اور سسٹر صومالیہ کی اس کی ہدایت کاری، اور اس کے ایوارڈز، اور اس کے لیے کسی مذہب یا اسکول کا نام درج نہیں ہے۔"
  tr: "Verton Aden hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 2 Şubat 1969'da, Ilman Ali Ahmed ile evliliğini ve 1996'daki suikastını, 1999'da Kanada'ya göçünü ve 2007'de dönüşünü, Ilman Center ve 'Sister Somalia' tarafından yönetildiğini, ödüllerini belgelemiş ve dini ya da mezhebi belirtilmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Verton Aden; digunakan hanya untuk fakta entitas. Artikel ini mendokumentasikan kelahirannya pada 2 Februari 1969, pernikahannya dengan Ilman Ali Ahmed dan pembunuhannya pada tahun 1996, imigrasinya ke Kanada pada tahun 1999 dan kepulangannya pada tahun 2007, pengelolaan oleh Ilman Center dan 'Sister Somalia,' penghargaan yang diberikan, dan tidak menyebutkan agama atau sektenya."
