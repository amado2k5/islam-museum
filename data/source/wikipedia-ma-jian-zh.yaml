  ar: "مقالة ويكيبيديا الصينية عن ما جيان؛ تُستخدم لوقائع الكيان فقط. وهي أوسع سيرة له: عالم شاديان (6 يونيو 1906 – 16 أغسطس 1978) الذي درس الفارسية عند هو سونغشان ثلاث سنين، ودخل المدرسة الإسلامية النظامية في شنغهاي التي أسّسها ها ده تشنغ، ودرس في الأزهر ثماني سنين، وأسّس تخصص العربية في جامعة بكين، وترجم القرآن و«تاريخ العرب» لهتّي."
  en: "Chinese Wikipedia article on Ma Jian; used for entity facts only. The fullest biography of him: the Shadian scholar (6 June 1906 – 16 August 1978) who studied Persian under Hu Songshan for three years, entered the Shanghai Islamic Normal School founded by Ha Decheng, studied eight years at al-Azhar, founded the Arabic programme at Peking University, and translated the Qur'an and Hitti's History of the Arabs."
