reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives his birth on 6 June 1906 at Shadian in Gejiu, Yunnan, and his death on 16 August 1978 at Beijing; his original names Ma Yushu and Ma Wanqing, courtesy name Zishi, and religious name Muhammad Makin; his childhood Qur'an study under the ahongs Ma Mingfu and Wang Fuyun; three years under Hu Songshan at Guyuan studying Persian and translating the Wiqaya and the Gulistan; entry into the Shanghai Islamic Normal School founded by the ahong Ha Decheng; eight years at al-Azhar and the Dar al-Ulum Arabic college; the 1939 hajj mission; his Qur'an translation work with Ha Decheng's encouragement; the Peking University professorship from 1946 and the founding of its Arabic programme; and his posthumous complete Qur'an translation of 1981. It names no school, order or movement for him."
