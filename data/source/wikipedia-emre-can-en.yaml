reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 — the career and personal life in full; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Can as born on 12 January 1994 in Frankfurt, Germany; a defensive midfielder for Bayern Munich, Bayer Leverkusen, Liverpool, Juventus and Borussia Dortmund from 2020, whose captain he became in 2023; a Germany international with 48 caps who won the 2017 FIFA Confederations Cup. Its Personal life section states in the article's own voice 'Can is a practising Muslim', citing BBC Three's piece 'How hard is it to be a Muslim footballer during Ramadan?' of 10 June 2016 — a statement of practice and of generic Islam; no school is named anywhere in the article. The same section records that in January 2023 he disclosed a thyroid cancer diagnosed in 2018 and treated by surgery."
