reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id. It gives his full name as Zidane Aamar Iqbal, born 27 April 2003 in Manchester to a Pakistani father from Sahiwal and an Iraqi mother from Samawah; Manchester United’s academy from the age of nine; a first-team debut on 8 December 2021 against Young Boys, making him the first British South Asian to play for the club and in the Champions League; a move to Utrecht in 2023 and then to Dundee United; an Iraq senior international. Its personal-life section states, citing a Manchester United interview and the Manchester Evening News, that “Iqbal is Muslim”, naming Islam generically and no school, and records that he cites Mesut Özil as an inspiration. Its categories file him under “Iraqi Muslims” and “English Muslims”, which are filings, not attestations."
