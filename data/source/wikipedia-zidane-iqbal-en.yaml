  fr: "Article de Wikipédia en anglais sur Zidane Iqbal; utilisé uniquement pour les informations le concernant. Il retrace ses débuts à Manchester United, ses transferts à Utrecht et Dundee United, ainsi que sa carrière en Irak, et le présente comme musulman sans mentionner d'école."
