summary:
  ar: "نشرة المفوضية المصرية للحقوق والحريات لحرية المعتقد والمواطنة عن شهر أبريل 2025 ⁦(نُشرت 6 مايو 2025)⁩؛ توثق كلام سعد الدين الهلالي عن الميراث في برنامج «سؤال مباشر» على العربية في 19 أبريل 2025 وردود الأزهر عليه."
  en: "The Egyptian Commission for Rights and Freedoms' freedom-of-belief and citizenship newsletter for April 2025 (published 6 May 2025); it documents Saad El-Din El-Hilali's inheritance remarks on Al Arabiya's Direct Question on 19 April 2025 and Al-Azhar's reactions."
  es: "Boletín informativo sobre libertad de creencias y ciudadanía de la Comisión Egipcia para los Derechos y las Libertades correspondiente a abril de 2025 (publicado el 6 de mayo de 2025); en él se documentan las declaraciones de Saad El-Din El-Hilali sobre la herencia en respuesta a la Pregunta Directa de Al Arabiya el 19 de abril de 2025 y las reacciones de Al-Azhar."
  fr: "Le bulletin d'information de la Commission égyptienne pour les droits et les libertés sur la liberté de croyance et la citoyenneté pour avril 2025 (publié le 6 mai 2025); il documente les remarques de Saad El-Din El-Hilali sur l'héritage lors de la question directe d'Al Arabiya le 19 avril 2025 et les réactions d'Al-Azhar."
  ur: "مصری کمیشن برائے حقوق و آزادی کا عقیدہ کی آزادی اور شہریت کا نیوز لیٹر اپریل 2025 ⁦(شائع شدہ 6 مئی 2025)⁩؛ یہ 19 اپریل 2025 کو العربیہ کے براہ راست سوال پر سعدالدین ہلالی کے وراثتی ریمارکس اور الازہر کے رد عمل کو دستاویز کرتا ہے۔"
  tr: "Mısır Haklar ve Özgürlükler Komisyonu'nun Nisan 2025 için inanç ve vatandaşlık özgürlüğü bülteni (6 Mayıs 2025'te yayımlandı); 19 Nisan 2025'te El Arabiya hakkında \"Doğrudan Soru\" programında Saad El-Din El-Hilali'nin miras hakkındaki açıklamalarını ve El-Ezher'in bu konudaki yanıtlarını belgelemektedir."
  id: "Buletin Komisi Hak dan Kebebasan Mesir tentang kebebasan beragama dan kewarganegaraan untuk April 2025 (diterbitkan 6 Mei 2025); mendokumentasikan pernyataan Saad El-Din Al-Hilali tentang warisan dalam program \"Direct Question\" di Al Arabiya pada 19 April 2025, beserta tanggapan Al-Azhar terhadapnya."
