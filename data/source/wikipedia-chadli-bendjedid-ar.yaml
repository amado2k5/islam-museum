  ar: "مقالة ويكيبيديا العربية عن الشاذلي بن جديد؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 14 أبريل 1929 في ولاية الطارف، وتذكر في صندوق معلوماتها أن سلفه رابح بيطاط (مؤقت) بعد هواري بومدين، ووفاته في مستشفى عين النعجة العسكري في 6 أكتوبر 2012."
  en: "Arabic Wikipedia article on Chadli Bendjedid; used for entity facts only. It gives his birth on 14 April 1929 in El Tarf province, names Rabah Bitat (interim) after Houari Boumédiène as his predecessor in its infobox, and his death at the Aïn Naâdja military hospital on 6 October 2012."
