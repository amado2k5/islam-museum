summary:
  ar: "مقالة ويكيبيديا العربية عن الشاذلي بن جديد؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 14 أبريل 1929 في ولاية الطارف، وتذكر في صندوق معلوماتها أن سلفه رابح بيطاط ⁦(مؤقت)⁩ بعد هواري بومدين، ووفاته في مستشفى عين النعجة العسكري في 6 أكتوبر 2012."
  en: "Arabic Wikipedia article on Chadli Bendjedid; used for entity facts only. It gives his birth on 14 April 1929 in El Tarf province, names Rabah Bitat (interim) after Houari Boumédiène as his predecessor in its infobox, and his death at the Aïn Naâdja military hospital on 6 October 2012."
  es: "Artículo de Wikipedia en árabe sobre Chadli Bendjedid; utilizado únicamente para datos sobre la persona. Indica que nació el 14 de abril de 1929 en la provincia de El Tarf, nombra a Rabah Bitat (interino) en honor a Houari Boumédiène como su predecesor en su ficha informativa, y que falleció en el hospital militar de Aïn Naâdja el 6 de octubre de 2012."
  fr: "Article Wikipédia en arabe sur Chadli Bendjedid; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 14 avril 1929 dans la province d’El Tarf, mentionne Rabah Bitat (intérim) comme son prédécesseur après Houari Boumédiène dans son infobox, et son décès à l’hôpital militaire d’Aïn Naâdja le 6 octobre 2012."
  ur: "عربی ویکیپیڈیا مضمون چدلی بینجدید پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے 14 اپریل 1929 کو صوبہ ال ترف میں اس کی پیدائش کی، رباح بیتات ⁦(عبوری)⁩ کا نام اپنے انفو باکس میں اپنے پیشرو کے طور پر Houari Boumédiène کے نام پر رکھا، اور 6 اکتوبر 2012 کو عین نادجا ملٹری ہسپتال میں اس کی موت ہوئی۔"
