summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أيان حرسي علي؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في مقديشو في 13 نوفمبر 1969، ولجوءها إلى هولندا سنة 1992، وبرلمانها (2003–2006)، وفيلم «الخضوع» واغتيال فان غوخ، وتركها الإسلام وإلحادها من سنة 2002، واعتناقها المسيحية في نوفمبر 2023، واتهامات منتقديها لها."
  en: "English Wikipedia article on Ayaan Hirsi Ali; used for entity facts only. It records her birth in Mogadishu on 13 November 1969, her 1992 asylum in the Netherlands, her parliament years (2003-2006), the film Submission and Van Gogh's murder, her renunciation of Islam and atheism from 2002, her conversion to Christianity in November 2023, and her critics' accusations against her."
  es: "Artículo de la Wikipedia en inglés sobre Ayaan Hirsi Ali; utilizado únicamente para datos sobre la persona. En él se recogen su nacimiento en Mogadiscio el 13 de noviembre de 1969, su asilo en los Países Bajos en 1992, sus años en el parlamento (2003-2006), la película \"Submission\" y el asesinato de Van Gogh, su renuncia al islam y al ateísmo a partir de 2002, su conversión al cristianismo en noviembre de 2023 y las acusaciones de sus críticos en su contra."
  fr: "Article de Wikipédia en anglais sur Ayaan Hirsi Ali; utilisé uniquement pour les informations relatives à l’entité. Il relate sa naissance à Mogadiscio le 13 novembre 1969, son asile aux Pays-Bas en 1992, ses années au Parlement (2003-2006), le film Submission et l’assassinat de Van Gogh, son renoncement à l’islam et à l’athéisme à partir de 2002, sa conversion au christianisme en novembre 2023 et les accusations portées contre elle par ses détracteurs."
  ur: "آیان ہرسی علی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پیدائش 13 نومبر 1969 کو موغادیشو میں، اس کی 1992 میں نیدرلینڈز میں پناہ، اس کے پارلیمنٹ کے سال (2003-2006)، فلم سبمیشن اور وان گوگ کا قتل، اس کا 2002 سے اسلام اور الحاد کا ترک، اس کی عیسائیت میں تبدیلی، نومبر 2023 میں اس کے ناقدین کے خلاف الزامات درج ہیں۔"
