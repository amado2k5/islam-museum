  ar: "مقالة ويكيبيديا الإنجليزية عن أيان حرسي علي؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في مقديشو في 13 نوفمبر 1969، ولجوءها إلى هولندا سنة 1992، وبرلمانها (2003–2006)، وفيلم «الخضوع» واغتيال فان غوخ، وتركها الإسلام وإلحادها من سنة 2002، واعتناقها المسيحية في نوفمبر 2023، واتهامات منتقديها لها."
  en: "English Wikipedia article on Ayaan Hirsi Ali; used for entity facts only. It records her birth in Mogadishu on 13 November 1969, her 1992 asylum in the Netherlands, her parliament years (2003-2006), the film Submission and Van Gogh's murder, her renunciation of Islam and atheism from 2002, her conversion to Christianity in November 2023, and her critics' accusations against her."
