reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A long article, read in full on 25 October 2026. Its lead gives her born Ayaan Hirsi Magan on 13 November 1969 in Mogadishu, a central figure in New Atheism who announced her conversion to Christianity in 2023, and records that non-Western critics have accused her of Islamophobia or neo-orientalism and questioned her credentials to speak authoritatively about Islam. Its dedicated section 'Atheism and conversion to Christianity' records that after formally renouncing Islam she identified as an atheist, and that in November 2023 she converted to Christianity, stating that 'atheism can't equip us for civilisational war', with criticism of the conversion from both Christians and atheists noted. It also covers the 2006 Zembla controversy over statements in her asylum account, which led to her resignation from parliament."
