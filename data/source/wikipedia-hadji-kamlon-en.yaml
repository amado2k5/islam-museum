reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 1 November 2026. The article identifies him as a Tausūg who fought in the Second World War and afterwards staged his own uprising against the Philippine government under Presidents Quirino and Magsaysay, asserting the sovereignty of the Sultanate of Sulu and North Borneo; it records his surrender in 1947, the launch of the rebellion in 1948 with 25 men, the July 1952 offensive of more than 5,000 troops, his surrenders of 1952 and 1955, his conviction and life sentence, the parole and land grant on Tawi-Tawi, and his final pardon by President Ferdinand Marcos. It gives NO birth or death date anywhere, and names no school or branch for him; it names his father Hadji Angsa and his wife Adjuria, neither of whom has a record here."
