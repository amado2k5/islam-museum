  fr: "Fourni par le fondateur, autorisé le 31 octobre 2026 (docs/delegation/founder-provided-books.md). Volume huit de l'imprimerie Dar al-Fayha (Damas, 1re édition), couvrant les hadiths 2810 à 3202: les livres sur le sacrifice, l'abattage, la chasse, les legs, l'héritage, l'impôt foncier et la gouvernance, et les funérailles."
