  en: "Provided by the founder, authorized 31 Oct 2026 (docs/delegation/founder-provided-books.md). Volume eight of the Dar al-Fayha printing (Damascus, 1st ed.), covering hadiths 2810 to 3202: the books of sacrifice, slaughter, hunting, bequests, inheritance, land tax and governance, and funerals."
