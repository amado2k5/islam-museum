reliability_note: "A family, not a work: each defunct site is judged on the eight criteria of docs/agents/source-families.md before use, and gets its own note. Rules: cite the original site as the work and give the capture URL with its 14-digit timestamp; confirm the capture holds the content and not a login, paywall or error page; facts only in the museum's own words, never store captured pages, OCR or images in git; the capture is not a licence. Etiquette: generic user agent, a pause of at least two seconds between requests, enumerate with the CDX API (web.archive.org/cdx/search/cdx?url=<site>/*&filter=statuscode:200&collapse=urlkey&fl=timestamp,original), back off on 429 or 503 and retry later. Registered at the founder's instruction of 16 November 2026."
