  en: "Zad al-Masir fi Ilm al-Tafsir — Ibn al-Jawzi, ed. Abd al-Razzaq al-Mahdi, vol. 1 (Dar al-Kitab al-Arabi, Beirut, 1st ed., 2001)"
  ur: "زاد المسیر فی علم التفسیر — ابن الجوزی، تحقیق عبد الرزاق المہدی، جلد اول ⁦(دار الکتاب العربی، بیروت، پہلا ایڈیشن، 2001ء)⁩"
summary:
  ar: "المجلد الأول ⁦(من الفاتحة إلى المائدة)⁩ من طبعة دار الكتاب العربي ببيروت لزاد المسير بتحقيق عبد الرزاق المهدي، الطبعة الأولى 1422هـ/2001م؛ وفي أوله مقدمة تحقيق فيها ترجمة ابن الجوزي، والتعريف بالكتاب، ومنهج التحقيق في تخريج الأحاديث والحكم عليها."
  en: "Volume 1 (al-Fatiha to al-Ma'ida) of Dar al-Kitab al-Arabi's Beirut printing of Zad al-Masir, edited by Abd al-Razzaq al-Mahdi, 1st edition 1422 AH / 2001; it opens with an editor's introduction giving a biography of Ibn al-Jawzi, an account of the book and the editorial method of referencing and grading the hadith."
  ur: "دار الکتاب العربی بیروت کی زاد المسیر کی طباعت کی پہلی جلد ⁦(سورۂ فاتحہ سے مائدہ تک)⁩، تحقیق عبد الرزاق المہدی، پہلا ایڈیشن 1422ھ / 2001ء؛ اس کے آغاز میں محقق کا مقدمہ ہے جس میں ابن الجوزی کے سوانح، کتاب کا تعارف، اور احادیث کی تخریج اور ان پر حکم کے منہجِ تحقیق کا بیان ہے۔"
  es: "Volumen 1 (al-Fatiha a al-Ma'ida) de la edición de Beirut de Zad al-Masir de Dar al-Kitab al-Arabi, editada por Abd al-Razzaq al-Mahdi, 1.ª edición 1422 AH / 2001; comienza con una introducción del editor que ofrece una biografía de Ibn al-Jawzi, una descripción del libro y el método editorial de referenciación y clasificación de los hadices."
  fr: "Volume 1 (al-Fatiha à al-Ma'ida) de l'édition beyrouthine de Dar al-Kitab al-Arabi de Zad al-Masir, édité par Abd al-Razzaq al-Mahdi, 1ère édition 1422 AH / 2001; il s'ouvre sur une introduction de l'éditeur donnant une biographie d'Ibn al-Jawzi, un compte rendu du livre et la méthode éditoriale de référencement et de classement des hadiths."
  tr: "Birinci cilt (El-Fatiha'dan El-Meyde'ye) Beyrut'taki Dar Al-Kitab Al-Arabi'den, Zad Al-Masir tarafından edisyon edilen ve Abdul Razzaq Al-Mahdi tarafından düzenlenen, ilk baskı 1422 Hicri / 2001 M.S; başlangıcında İbn Al-Jawzi'nin biyografisi, kitaba giriş ve hadislerin doğrulanması ve karar verme yöntemi yer alır."
  id: "Volume Satu (Dari Al-Fatiha ke Al-Ma'idah) dari edisi Dar Al-Kitab Al-Arabi di Beirut oleh Zad Al-Masir yang diedit oleh Abdul Razzaq Al-Mahdi, edisi pertama 1422 H / 2001 M; di awal terdapat pengantar yang mencakup biografi Ibn Al-Jawzi, pengantar buku, dan metodologi verifikasi dalam mengautentikasi dan memutuskan hadits."
