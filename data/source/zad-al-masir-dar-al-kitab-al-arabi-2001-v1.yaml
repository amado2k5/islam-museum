  en: "Zad al-Masir fi Ilm al-Tafsir — Ibn al-Jawzi, ed. Abd al-Razzaq al-Mahdi, vol. 1 (Dar al-Kitab al-Arabi, Beirut, 1st ed., 2001)"
  ur: "زاد المسیر فی علم التفسیر — ابن الجوزی، تحقیق عبد الرزاق المہدی، جلد اول (دار الکتاب العربی، بیروت، پہلا ایڈیشن، 2001ء)"
summary:
  ar: "المجلد الأول ⁦(من الفاتحة إلى المائدة)⁩ من طبعة دار الكتاب العربي ببيروت لزاد المسير بتحقيق عبد الرزاق المهدي، الطبعة الأولى 1422هـ/2001م؛ وفي أوله مقدمة تحقيق فيها ترجمة ابن الجوزي، والتعريف بالكتاب، ومنهج التحقيق في تخريج الأحاديث والحكم عليها."
  en: "Volume 1 (al-Fatiha to al-Ma'ida) of Dar al-Kitab al-Arabi's Beirut printing of Zad al-Masir, edited by Abd al-Razzaq al-Mahdi, 1st edition 1422 AH / 2001; it opens with an editor's introduction giving a biography of Ibn al-Jawzi, an account of the book and the editorial method of referencing and grading the hadith."
  ur: "دار الکتاب العربی بیروت کی زاد المسیر کی طباعت کی پہلی جلد (سورۂ فاتحہ سے مائدہ تک)، تحقیق عبد الرزاق المہدی، پہلا ایڈیشن 1422ھ / 2001ء؛ اس کے آغاز میں محقق کا مقدمہ ہے جس میں ابن الجوزی کے سوانح، کتاب کا تعارف، اور احادیث کی تخریج اور ان پر حکم کے منہجِ تحقیق کا بیان ہے۔"
