reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The article gives his full name Ricardo Verhoeven, his birth on 10 April 1989, his Glory heavyweight championship and title defences, and a full fight record. It reports at length the projected WBC heavyweight title fight with Oleksandr Usyk at Giza on 23 May 2026, citing FIGHTMAG and BBC Sport, and records that Verhoeven lost by technical knockout in the eleventh round. Neither its text nor its categories makes any statement of his religion."
