summary:
  ar: "مقالة ويكيبيديا العربية عن ريكو فيرهوفن؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل وميلاده في 10 أبريل 1989 وبطولته الطويلة في غلوري، وتفصّل خسارته أمام أوسيك بالضربة الفنية القاضية في الجيزة في مايو 2026. ولا تذكر ديانته."
  en: "Arabic Wikipedia article on Rico Verhoeven; used for entity facts only. It gives his full name, his birth on 10 April 1989 and his long Glory championship, and details his loss to Usyk by technical knockout at Giza in May 2026. It makes no statement of his religion."
  es: "Artículo de Wikipedia en árabe sobre Rico Verhoeven; se utiliza únicamente para obtener información sobre él. Menciona su nombre completo, su fecha de nacimiento (10 de abril de 1989) y su extenso campeonato Glory, y detalla su derrota ante Usyk por nocaut técnico en Giza en mayo de 2026. No se menciona su religión."
  fr: "Article Wikipédia en arabe sur Rico Verhoeven; utilisé uniquement pour les informations le concernant. Il mentionne son nom complet, sa date de naissance (10 avril 1989) et son long règne au Glory, et détaille sa défaite par KO technique face à Usyk à Gizeh en mai 2026. Il ne fait aucune mention de sa religion."
  ur: "Rico Verhoeven پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کا پورا نام، اس کی پیدائش 10 اپریل 1989 اور اس کی طویل گلوری چیمپیئن شپ، اور مئی 2026 میں گیزا میں تکنیکی ناک آؤٹ کے ذریعے Usyk سے اس کی ہار کی تفصیلات بتائی گئی ہیں۔ اس میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Rico Verhoeven hakkında Arapça Wikipedia makalesi; sadece varlığın gerçekleri için kullanılmıştır. Tam adını, 10 Nisan 1989 doğumunu, Glory'deki uzun şampiyonluğunu ve Mayıs 2026'da Giza'da teknik nakavt maçında Usyk'e kaybetmesini detaylandırmaktadır. Ve dini hakkında hiç bahsedilmiyor."
  id: "Artikel Wikipedia Arab tentang Rico Verhoeven; digunakan hanya untuk fakta entitas. Artikel tersebut mencantumkan nama lengkapnya, kelahiran 10 April 1989, gelar juara panjangnya di Glory, dan merinci kekalahannya dari Usyk di technical knockout di Giza pada Mei 2026. Dan tidak menyebutkan agamanya."
