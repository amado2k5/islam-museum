summary:
  ar: "مقالة ويكيبيديا الإنجليزية «نوعي أفندي»، مراجعة 4 نوفمبر 2025، وهي المقالة الوحيدة عنه في أي لغة؛ تصفه في متنها بأنه فقيه ومتكلم وشاعر سني حنفي ماتريدي، مستندة إلى حداد (2021) ومدخل موسوعة الإسلام التركية وأطروحة جامعية تركية."
  en: "English Wikipedia article 'Naw'i Efendi', revision of 4 November 2025 — the only Wikipedia article on him in any language. Its lead describes him as a Sunni Hanafi-Maturidi jurist, theologian and poet, citing Haddad (2021), the TDV İslâm Ansiklopedisi entry and a Turkish university thesis."
  es: "Artículo de Wikipedia en inglés «Naw'i Efendi», revisión del 4 de noviembre de 2025: el único artículo de Wikipedia sobre él en cualquier idioma. Su introducción lo describe como un jurista, teólogo y poeta suní hanafi-maturidi, citando a Haddad (2021), la entrada de TDV İslâm Ansiklopedisi y una tesis universitaria turca."
  fr: "L'article Wikipédia en anglais intitulé « Naw'i Efendi », mis à jour le 4 novembre 2025, est le seul article Wikipédia qui lui est consacré, toutes langues confondues. Son introduction le décrit comme un juriste, théologien et poète sunnite hanafite-maturidien, citant Haddad (2021), l'article de la TDV İslâm Ansiklopedisi et une thèse universitaire turque."
