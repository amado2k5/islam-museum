  ar: "منشورات فبراير 2024 في الموقع الرسمي لمؤسسة خدمة القرآن الإسلامية؛ تروي المؤسسة فيها أنها أسست مسابقة القرآن سنة 2004 في مسجد إدريسا، وأن الفائزين الأوائل في مسابقاتها يمتدون من 2004 إلى 2022، وتصف نفسها بأنها المنظم الوحيد لمسابقات التجويد الدولية في تنزانيا."
  en: "February 2024 posts on the Khidmatulquran Islamic Foundation's official website; in them the foundation recounts that it established the Quran Competition in 2004 at Masjid Idrisa, that its competitions' first winners span 2004–2022, and describes itself as the sole organiser of the International Quran Tajweed Competitions in Tanzania."
