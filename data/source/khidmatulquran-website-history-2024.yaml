summary:
  ar: "منشورات فبراير 2024 في الموقع الرسمي لمؤسسة خدمة القرآن الإسلامية؛ تروي المؤسسة فيها أنها أسست مسابقة القرآن سنة 2004 في مسجد إدريسا، وأن الفائزين الأوائل في مسابقاتها يمتدون من 2004 إلى 2022، وتصف نفسها بأنها المنظم الوحيد لمسابقات التجويد الدولية في تنزانيا."
  en: "February 2024 posts on the Khidmatulquran Islamic Foundation's official website; in them the foundation recounts that it established the Quran Competition in 2004 at Masjid Idrisa, that its competitions' first winners span 2004–2022, and describes itself as the sole organiser of the International Quran Tajweed Competitions in Tanzania."
  es: "En febrero de 2024, la Fundación Islámica Khidmatulquran publicó en su sitio web oficial que estableció el Concurso del Corán en 2004 en la Mezquita Idrisa, que los primeros ganadores de sus concursos abarcan el período 2004-2022 y se describe a sí misma como la única organizadora de los Concursos Internacionales de Tajweed del Corán en Tanzania."
  fr: "Publications de février 2024 sur le site officiel de la Fondation islamique Khidmatulquran; dans celles-ci, la fondation raconte qu'elle a créé le concours de Coran en 2004 à la mosquée Idrisa, que les premiers lauréats de ses concours s'échelonnent de 2004 à 2022, et se décrit comme le seul organisateur des concours internationaux de Tajweed du Coran en Tanzanie."
  ur: "خدمت القرآن اسلامک فاؤنڈیشن کی آفیشل ویب سائٹ پر فروری 2024 کی پوسٹس؛ ان میں فاؤنڈیشن بتاتی ہے کہ اس نے 2004 میں مسجد ادریسہ میں قرآنی مقابلہ قائم کیا تھا، کہ اس کے مقابلوں کے پہلے فاتحین 2004-2022 تک پھیلے ہوئے ہیں، اور تنزانیہ میں بین الاقوامی قرآن تجوید مقابلوں کے واحد منتظم کے طور پر خود کو بیان کرتے ہیں۔"
  tr: "Şubat 2024'te İslami Kur'an Hizmeti Vakfı'nın resmi web sitesinde yayımlandı; vakıf, Kur'an yarışmasını 2004 yılında İdrissa Camii'nde başlattığını ve yarışmalarındaki en iyi kazananların 2004-2022 yılları arasında yer aldığını belirtmekte ve kendisini Tanzanya'daki uluslararası Tacviit yarışmalarının tek organizatörü olarak tanımlamaktadır."
  id: "Februari 2024 publikasi di situs resmi Islamic Quran Service Foundation; yayasan menyatakan bahwa mereka mendirikan kompetisi Al-Quran pada tahun 2004 di Masjid Idrissa, dan pemenang teratas dalam kompetisinya berlangsung dari tahun 2004 hingga 2022, serta menggambarkan dirinya sebagai satu-satunya penyelenggara kompetisi internasional Tajweed di Tanzania."
title: "February 2024 – KHIDMATULQURAN ISLAMIC FOUNDATION"
