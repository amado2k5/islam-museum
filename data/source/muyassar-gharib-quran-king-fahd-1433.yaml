summary:
  ar: "«الميسر في غريب القرآن الكريم»، إعداد مركز الدراسات القرآنية بمجمع الملك فهد لطباعة المصحف الشريف، المدينة المنورة، 1433هـ، 632 صفحة، مع كلمة المشرف العام على المجمع وكلمة الأمين العام وتمهيد في معنى الغريب وتاريخ التأليف فيه ومناهجه."
  en: "al-Muyassar fi gharib al-Qur'an al-karim, prepared by the Centre for Qur'anic Studies of the King Fahd Complex for the Printing of the Holy Qur'an, Medina, 1433 AH, 632 pages, with forewords by the Complex's general supervisor and secretary-general and an introduction on the meaning of gharib, the history of writing on it and its methods."
  es: "al-Muyassar fi gharib al-Qur'an al-karim, preparado por el Centro de Estudios Coránicos del Complejo Rey Fahd para la Impresión del Sagrado Corán, Medina, 1433 AH, 632 páginas, con prólogos del supervisor general y el secretario general del Complejo y una introducción sobre el significado de gharib, la historia de la escritura en él y sus métodos."
  fr: "al-Muyassar fi gharib al-Qur'an al-karim, préparé par le Centre d'études coraniques du Complexe du roi Fahd pour l'impression du Saint Coran, Médine, 1433 AH, 632 pages, avec des préfaces du superviseur général et du secrétaire général du Complexe et une introduction sur la signification de gharib, l'histoire de l'écriture sur ce sujet et ses méthodes."
  ur: "المیاسر فی غریب القرآن الکریم، کنگ فہد کمپلیکس کے مرکز برائے قرآنی مطالعات برائے طباعت قرآن، مدینہ، 1433 ہجری، 632 صفحات پر مشتمل، کمپلیکس کے جنرل سپروائزر اور سکریٹری جنرل کے پیش لفظوں کے ساتھ، اس پر تاریخ اور اس کے مفہوم کے بارے میں تحریر ہے۔ طریقے"
