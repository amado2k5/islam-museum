  id: "Artikel Wikipedia dalam bahasa Urdu tentang Banu Musa; terjemahan dekat dari artikel bahasa Inggris, menandai Muhammad (sebelum 803 – Februari 873) dan Ahmad serta al-Hasan hanya pada abad kesembilan."
