  ar: "مقالة ويكيبيديا الأردية عن بني موسى؛ ترجمة قريبة للمقالة الإنجليزية، تؤرخ لمحمد «قبل 803 – شباط 873» ولأحمد والحسن بالقرن التاسع فقط."
