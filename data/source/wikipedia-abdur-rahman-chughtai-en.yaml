summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرحمن تشغتاي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في لاهور في أسرة فنية بنجابية مسلمة، وتعليمه في مدرسة مايو للفنون، وأسلوبه المميز في الرسم وأعماله وجوائزه، ووفاته في لاهور في 17 كانون الثاني 1975؛ وتختلف داخلياً في سنة مولده بين 1894 و1897."
  en: "English Wikipedia article on Abdur Rahman Chughtai; used for entity facts only. It recounts his upbringing in Lahore in a Punjabi Muslim family of artists, his education at the Mayo School of Arts, his distinctive painting style, works and awards, and his death in Lahore on 17 January 1975; it is internally inconsistent on his birth year, giving both 1894 and 1897."
  es: "Artículo de la Wikipedia en inglés sobre Abdur Rahman Chughtai; utilizado únicamente para obtener información sobre la persona. Relata su infancia en Lahore en el seno de una familia musulmana punjabí de artistas, su formación en la Escuela de Artes Mayo, su estilo pictórico distintivo, sus obras y premios, y su fallecimiento en Lahore el 17 de enero de 1975; presenta inconsistencias internas respecto a su año de nacimiento, indicando tanto 1894 como 1897."
  fr: "Article de Wikipédia en anglais sur Abdur Rahman Chughtai; utilisé uniquement pour les informations le concernant. Il relate son enfance à Lahore au sein d'une famille d'artistes musulmans punjabi, ses études à la Mayo School of Arts, son style pictural distinctif, ses œuvres et récompenses, ainsi que sa mort à Lahore le 17 janvier 1975; l'article présente une incohérence concernant son année de naissance, mentionnant tantôt 1894, tantôt 1897."
  ur: "عبدالرحمن چغتائی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں لاہور میں ایک پنجابی مسلم فنکاروں کے خاندان میں ان کی پرورش، میو اسکول آف آرٹس میں ان کی تعلیم، ان کے مخصوص مصوری کا انداز، کام اور ایوارڈز، اور 17 جنوری 1975 کو لاہور میں ان کی موت کا ذکر ہے۔ یہ داخلی طور پر اس کے سال پیدائش سے مطابقت نہیں رکھتا، 1894 اور 1897 دونوں دیتا ہے۔"
  tr: "Abdur Rahman Chagtai hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Lahor'da Pencaplı Müslüman bir sanat ailesinde büyümesini, Mayo Sanat Okulu'ndaki eğitimini, kendine özgü resim tarzı, eserlerini ve ödüllerini ve 17 Ocak 1975'te Lahor'da vefatını anlatır; doğum yılı 1894 ile 1897 arasında değişir."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdur Rahman Chagtai; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan masa kecilnya di Lahore dalam keluarga seni Muslim Punjabi, pendidikannya di Mayo School of Art, gaya melukis khasnya, karya dan penghargaannya, serta kematiannya di Lahore pada 17 Januari 1975; perbedaan internal dalam tahun kelahirannya antara 1894 dan 1897."
