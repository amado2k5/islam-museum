  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرحمن تشغتاي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في لاهور في أسرة فنية بنجابية مسلمة، وتعليمه في مدرسة مايو للفنون، وأسلوبه المميز في الرسم وأعماله وجوائزه، ووفاته في لاهور في 17 كانون الثاني 1975؛ وتختلف داخلياً في سنة مولده بين 1894 و1897."
  en: "English Wikipedia article on Abdur Rahman Chughtai; used for entity facts only. It recounts his upbringing in Lahore in a Punjabi Muslim family of artists, his education at the Mayo School of Arts, his distinctive painting style, works and awards, and his death in Lahore on 17 January 1975; it is internally inconsistent on his birth year, giving both 1894 and 1897."
