reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026; the article was fetched by its recorded revision id through the MediaWiki API and the returned id asserted equal before use. Its birth year is unsettled inside the article itself: the lead, the short description and the birth category give 21 September 1894, while the infobox birth field and the early-life section give 21 September 1897, both citing the Encyclopaedia Britannica profile; the death date, 17 January 1975 at Lahore, is consistent throughout. On religion it calls him 'the first significant modern Muslim artist from Pakistan', quoting Iftikhar Dadi's 2010 book, and describes his father's family as a prominent Punjabi Muslim family of artists; it names no school."
