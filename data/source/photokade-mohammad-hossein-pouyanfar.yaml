summary:
  ar: "سيرة محمد حسين بويانفر على موقع فوتوكاده: وُلد في 24 أرديبهشت 1363 في شميرانات بطهران، وهو مدّاح ومقدّم برامج، خريج ليسانس علم نفس، ومؤسس هيئة ريحانة النبي سنة 1380 ودار «همدردي» الخيرية سنة 1398، وصاحب القطعة الشهيرة «من إيرانم وتو عراقي»."
  en: "Photokade's biography of Mohammad Hossein Pouyanfar: born on 24 Ordibehesht 1363 in Shemiranat, Tehran, a maddah and presenter with a bachelor's in psychology, founder of the Reyhanat al-Nabi hey'at in 1380 (2001) and of the Hamdardi charity in 1398 (2019), known for the piece 'Man Iranam o to Araghi'."
