summary:
  ar: "سيرة محمد حسين بويانفر على موقع فوتوكاده: وُلد في 24 أرديبهشت 1363 في شميرانات بطهران، وهو مدّاح ومقدّم برامج، خريج ليسانس علم نفس، ومؤسس هيئة ريحانة النبي سنة 1380 ودار «همدردي» الخيرية سنة 1398، وصاحب القطعة الشهيرة «من إيرانم وتو عراقي»."
  en: "Photokade's biography of Mohammad Hossein Pouyanfar: born on 24 Ordibehesht 1363 in Shemiranat, Tehran, a maddah and presenter with a bachelor's in psychology, founder of the Reyhanat al-Nabi hey'at in 1380 (2001) and of the Hamdardi charity in 1398 (2019), known for the piece 'Man Iranam o to Araghi'."
  es: "Biografía de Photokade sobre Mohammad Hossein Pouyanfar: nacido el 24 de Ordibehesht de 1363 en Shemiranat, Teherán, profesor y presentador con licenciatura en psicología, fundador de la Reyhanat al-Nabi hey'at en 1380 (2001) y de la organización benéfica Hamdardi en 1398 (2019), conocido por la obra 'Man Iranam o to Araghi'."
  fr: "Biographie de Mohammad Hossein Pouyanfar par Photokade: né le 24 Ordibehesht 1363 à Shemiranat, Téhéran, maddah et présentateur titulaire d'une licence en psychologie, fondateur de la Reyhanat al-Nabi hey'at en 1380 (2001) et de l'association caritative Hamdardi en 1398 (2019), connu pour l'œuvre « Man Iranam o to Araghi »."
  ur: "محمد حسین پویانفر کی فوٹوکاڈ کی سوانح عمری: 24 اردبیہشت 1363 کو شمیرانات، تہران میں پیدا ہوئے، ایک مدح اور نفسیات میں بیچلر کے ساتھ پیش کنندہ، 1380 (2001) میں ریحانات النبی ہیئت کے بانی، 1380 (2001) اور 391 میں (38) کے لئے مشہور ٹکڑا 'من ایرانم اے ٹو اراضی'۔"
  tr: "Fotokadeh web sitesindeki Mohammad Hossein Bouyanfar'ın biyografisi: 14 Mayıs 1984'te Tahran'ın Shemiranat kentinde doğdu. Bir övgü yazarı ve program sunucusudur, psikoloji alanında lisans derecesine sahiptir, 1380'de Reyhaneh Al-Nabi Vakfı'nın ve 1398 Hicri'nde 'Hamdardi' hayır kurumunun kurucusudur ve ünlü 'İran ve Tu Iraqi'den adlı eserin yazarıdır."
  id: "Biografi Mohammad Hossein Bouyanfar di situs web Fotokadeh: Lahir pada 14 Mei 1984, di Shemiranat, Teheran. Ia adalah seorang ahli euologi dan presenter program, memiliki gelar sarjana psikologi, dan merupakan pendiri Yayasan Reyhaneh Al-Nabi pada tahun 1380 serta rumah amal 'Hamdardi' pada tahun 1398 H, serta penulis karya terkenal 'From Iran and Tu Iraqi.'"
