reliability_note: "Read in full on 7 November 2026. A Persian celebrity-biography site that assembles its text largely from his published interviews; used for the exact birth date (24 Ordibehesht 1363 in Shemiranat, Tehran — the day and month rest on this source alone and are flagged as such in the person record; his own interview confirms only the year 1363), for the founding of the Reyhanat al-Nabi hey'at in 1380, for the Hamdardi charity founded in 1398, for his best-known piece 'Man Iranam o to Araghi' ('I am Iran and you are Iraq'), and for his work as presenter of the online programme Mahla from Mordad 1400 (2021). It calls him only a 'maddah of the Ahl al-Bayt' and attests no school for him."
