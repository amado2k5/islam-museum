reliability_note: "Platform statistics aggregator, not a museum-verified fact: the figure of 192,000 subscribers (20,630,000 total views, 909 videos) was read from vidIQ at its 6 November 2026 update and is used only as a dated audience figure; the same update recorded about 84,800 views in the preceding 28 days, which is audience activity, not upload activity. The page also records that the channel was created on 26 April 2021 and that its channel country is set to Pakistan. vidIQ's estimated earnings are modelled and are not used. A fresh re-read of this page was attempted on 7 November 2026 for the wave-194 build but the fetch timed out, so the dated 6 November 2026 figure is the one carried in the record. The most recent upload verified for this build — the channel's live stream of the central Eid Milad un Nabi rally in Lahore, streamed in September 2025 — was verified on the channel's own YouTube page, read on 7 November 2026, not on this vidIQ page."
