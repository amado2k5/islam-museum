summary: { ar: "الطبعة الحديثة من مروج الذهب للمسعودي بتحقيق كمال حسن مرعي، في أربعة أجزاء؛ تُحال إليها الصفحات بحسب ترقيم الجزء.", en: "The 2005 edition of al-Mas'udi's Muruj al-dhahab, edited by Kamal Hasan Mar'i in four parts; page references follow its pagination within each part.", es: "La edición de 2005 del Muruj al-dhahab de al-Mas'udi, editada por Kamal Hasan Mar'i en cuatro partes; las referencias a las páginas siguen la paginación dentro de cada parte.", fr: "L'édition de 2005 du Muruj al-dhahab d'al-Mas'udi, éditée par Kamal Hasan Mar'i en quatre parties; les références de pages suivent sa pagination à l'intérieur de chaque partie.", ur: "المسعودی کے مروج الذہب کا 2005 ایڈیشن، کمال حسن مری نے چار حصوں میں ترمیم کیا؛ صفحہ کے حوالہ جات ہر حصے میں صفحہ بندی کی پیروی کرتے ہیں۔", tr: "Kamal Hassan Mar'i tarafından düzenlenen Al-Mas'udi tarafından yayımlanan modern Muruj al-Dhahab baskısı, dört cilt halinde; sayfalar bölümün numaralandırmasına göre referans verilmiştir.", id: "Edisi modern Muruj al-Dhahab oleh Al-Mas'udi yang disunting oleh Kamal Hassan Mar'i, dalam empat volume; halaman-halamannya dirujuk sesuai dengan penomoran bagian." }
