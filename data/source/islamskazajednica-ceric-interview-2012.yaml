reliability_note: "Interview with Cerić (interviewers Abdallah Ahmed al Rubaiey and Ahmed Mohiuddin Siddiqui), read in full in this session on the Islamic Community's official English site. Asked 'What schools of Fiqh are followed in Bosnia?', he answers: 'We are all aware of the Maturudi School of Theology and of the Hanafi School of Fiqh', and, asked further, 'Basically we have only Hanafi madhhab in Bosnia... Hanafi is the official madhhab. This is the madhhab in prayers and in our fatwas' — his own words for the school of the Islam he himself practised and led, quoted within the 40-word limit. His Grand Mufti office is not itself used as evidence; the attestation is his own published statement together with the structured Sunni values."
