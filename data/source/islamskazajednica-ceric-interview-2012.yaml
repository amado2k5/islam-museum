  en: "Interview with Dr Mustafa Cerić, Islamic Community in Bosnia and Herzegovina (English site), c. 2012 — on the schools of Bosnian Islam"
summary:
  ar: "مقابلة منشورة مع مصطفى سيريتش في الموقع الإنجليزي للمشيخة الإسلامية في البوسنة والهرسك، يصرّح فيها بأن مذهب البوسنة في الفقه هو الحنفي وفي العقيدة الماتريدي، وأنه «المذهب في الصلاة وفي فتاوانا»."
  en: "Published interview with Mustafa Cerić on the English site of the Islamic Community in Bosnia and Herzegovina, in which he states that Bosnia's school is Hanafi in jurisprudence and Maturidi in theology — 'the madhhab in prayers and in our fatwas'."
  es: "Entrevista publicada con Mustafa Cerić en el sitio web en inglés de la Comunidad Islámica de Bosnia y Herzegovina, en la que afirma que la escuela de Bosnia es Hanafi en jurisprudencia y Maturidi en teología: \"la madhhab en las oraciones y en nuestras fatuas\"."
  fr: "Interview publiée avec Mustafa Cerić sur le site anglais de la Communauté islamique de Bosnie-Herzégovine, dans laquelle il déclare que l'école de Bosnie est hanafite en matière de jurisprudence et maturidite en matière de théologie — « le madhhab dans les prières et dans nos fatwas »."
  ur: "بوسنیا اور ہرزیگووینا میں اسلامی کمیونٹی کی انگریزی سائٹ پر مصطفیٰ سیریچ کا انٹرویو شائع ہوا، جس میں وہ بتاتے ہیں کہ بوسنیا کا مکتب فقہ میں حنفی اور الہیات میں ماتوریدی ہے - 'نماز میں اور ہمارے فتووں میں مذہب'۔"
  tr: "Mustafa Siric ile Bosna-Hersek İslami Şeyhidi'nin İngilizce web sitesinde yayımlanan bir röportajda, Bosna'nın hukuk okulunun Hanefi ve Maturidi mezhebi olduğunu, bunun \"namaz ve fetvalarımızdaki okul\" olduğunu belirtiyor."
  id: "Sebuah wawancara yang diterbitkan dengan Mustafa Siric di situs web bahasa Inggris Sheikhdom Islam di Bosnia dan Herzegovina, di mana ia menyatakan bahwa aliran hukum Bosnia adalah ajaran Hanafi dan Maturidi, dan bahwa itu adalah \"sekolah dalam doa dan fatwa kita.\""
