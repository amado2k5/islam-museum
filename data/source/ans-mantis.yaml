  ar: "قاعدة بيانات مجموعات الجمعية الأمريكية لعلم النقود — كتالوج لنحو ٩٨ ألف قطعة نقدية، نحو ٦٠٬٦٧٢ منها في القسم الإسلامي وحده، بمعرّفات وصول ثابتة وسجلّات ببروتوكول NUDS/RDF/JSON-LD، وبياناتها مرخّصة برخصة Open Database License والصور بلا حقوق نشر."
  en: "The American Numismatic Society's collection database — a catalogue of roughly 98,000 coin objects, about 60,672 in the Islamic department alone, with stable accession ids and NUDS/RDF/JSON-LD record serializations; data licensed ODbL, images Public Domain Mark / No Copyright-US."
