reliability_note: "The object-level counterpart of Nomisma.org: where Nomisma carries the numismatic vocabulary, MANTIS carries the physical coins — accession id, denomination, mint, issuing authority (Wikidata- and Nomisma-linked), Hijri and Gregorian dates, weight and fabric — the primary evidence class for the museum's two kind:coin objects and the coin backlog behind them. Licence: data ODbL, images Public Domain Mark / No Copyright-US (verified per-record 9 Nov 2026); {cite:ans-mantis <accession-id>} is the attribution. Caveat: ODbL share-alike attaches to derivative databases — cite facts with attribution, and bulk structured ingestion needs its own licence review before it runs. Catalogue prose, legend text and images are never republished. Harvest channel: documented REST APIs (getNuds, getRDF), Atom/RSS feeds, per-record .xml/.rdf/.ttl/.jsonld/.kml/.geojson serializations, Solr/Lucene queries; ~60,672 Islamic-department records. Verified live 9 November 2026; decision dec-20261109-226 (supersedes engine false-positive dec-20261109-225)."
