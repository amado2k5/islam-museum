summary:
  ar: "مقالة ويكيبيديا الأردية عن خواجة حسن النظامي، وهي نص مستقل عن الإنجليزية: تنص على أنه صوفي من السلسلة الجشتية أقام حلقة البيعة والإرشاد ودخل في مريدينه خلق لا يُحصى، وأنه وُلد عند ضريح نظام الدين أولياء في دلهي وتوفي فيها في 31 تموز 1955 ودُفن في حرم الضريح."
  en: "The Urdu Wikipedia article on Khwaja Hasan Nizami, a text independent of the English article: it states that he was a Sufi of the Chishti silsila who maintained a circle of initiation and discipleship into which countless people entered, that he was born at Nizamuddin Auliya's shrine in Delhi, and that he died there on 31 July 1955 and was buried within the shrine enclosure."
