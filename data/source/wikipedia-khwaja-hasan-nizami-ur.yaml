summary:
  ar: "مقالة ويكيبيديا الأردية عن خواجة حسن النظامي، وهي نص مستقل عن الإنجليزية: تنص على أنه صوفي من السلسلة الجشتية أقام حلقة البيعة والإرشاد ودخل في مريدينه خلق لا يُحصى، وأنه وُلد عند ضريح نظام الدين أولياء في دلهي وتوفي فيها في 31 تموز 1955 ودُفن في حرم الضريح."
  en: "The Urdu Wikipedia article on Khwaja Hasan Nizami, a text independent of the English article: it states that he was a Sufi of the Chishti silsila who maintained a circle of initiation and discipleship into which countless people entered, that he was born at Nizamuddin Auliya's shrine in Delhi, and that he died there on 31 July 1955 and was buried within the shrine enclosure."
  es: "El artículo de Wikipedia en urdu sobre Khwaja Hasan Nizami, un texto independiente del artículo en inglés, afirma que fue un sufí de la silsila Chishti que mantuvo un círculo de iniciación y discipulado al que entraron innumerables personas, que nació en el santuario de Nizamuddin Auliya en Delhi y que murió allí el 31 de julio de 1955 y fue enterrado dentro del recinto del santuario."
  fr: "L'article de Wikipédia en ourdou sur Khwaja Hasan Nizami, un texte indépendant de l'article en anglais: il indique qu'il était un soufi de la silsila Chishti qui entretenait un cercle d'initiation et de disciple dans lequel d'innombrables personnes entraient, qu'il est né au sanctuaire de Nizamuddin Auliya à Delhi, et qu'il y est mort le 31 juillet 1955 et a été enterré dans l'enceinte du sanctuaire."
  ur: "خواجہ حسن نظامی پر اردو ویکیپیڈیا کا مضمون، انگریزی مضمون سے آزاد ایک متن: اس میں کہا گیا ہے کہ وہ چشتی سلسلۂ کے صوفی تھے جنہوں نے ابتداء اور شاگردی کا ایک حلقہ قائم رکھا جس میں لاتعداد لوگ داخل ہوئے، کہ وہ دہلی میں نظام الدین اولیاء کے مزار پر پیدا ہوئے، اور یہ کہ وہیں 31 جولائی کو وفات پاگئے۔"
  tr: "Khwaja Hasan al-Nizami hakkında İngilizceden bağımsız bir metin olan Urduca Wikipedia makalesi, onun Jashti tarikatından bir Sufi olduğunu, Bağlılık ve Rehberlik çemberini kurduğunu ve takipçileri arasında sayısız kişinin katıldığını belirtir. Delhi'deki Nizamuddin Awliya türbesinde doğdu, 31 Temmuz 1955'te orada öldü ve türbedeki türbede defnedildi."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Khwaja Hasan al-Nizami, sebuah teks independen dari bahasa Inggris, menyatakan bahwa ia adalah seorang Sufi dari tarekat Jashti, mendirikan lingkaran Kesetiaan dan Bimbingan, dan di antara para pengikutnya banyak orang yang masuk. Ia lahir di makam Nizamuddin Awliya di Delhi, meninggal di sana pada 31 Juli 1955, dan dimakamkan di makam makam tersebut."
