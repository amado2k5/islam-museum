summary:
  ar: "مقالة ويكيبيديا الأردية عن هامينغكوبوونو التاسع ⁦(1912ء–1988ء)⁩؛ تُستخدم لوقائع الكيان فقط. موجز يذكر مولده في 12 اپریل 1912ء ووفاته في 2 اکتوبر 1988ء وسلطنته على يوغياكارتا ونيابته لرئاسة إندونيسيا."
  en: "Urdu Wikipedia article on Hamengkubuwono IX (1912–1988); used for entity facts only. A short article giving his birth on 12 April 1912, his death on 2 October 1988, his sultanate of Yogyakarta and his vice presidency of Indonesia."
  es: "Artículo de Wikipedia en urdu sobre Hamengkubuwono IX (1912-1988); utilizado únicamente para datos sobre la persona. Un breve artículo que menciona su nacimiento el 12 de abril de 1912, su fallecimiento el 2 de octubre de 1988, su sultanato de Yogyakarta y su vicepresidencia de Indonesia."
  fr: "Article de Wikipédia en ourdou sur Hamengkubuwono IX (1912-1988); utilisé uniquement à des fins d'information sur l'entité. Ce court article indique sa naissance le 12 avril 1912, sa mort le 2 octobre 1988, son sultanat de Yogyakarta et sa vice-présidence de l'Indonésie."
  ur: "Hamengkubuwono IX (1912–1988) پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 12 اپریل 1912 کو ان کی پیدائش، 2 اکتوبر 1988 کو ان کی موت، یوگیکارتا کے ان کے سلطان اور انڈونیشیا کے نائب صدر کے بارے میں ایک مختصر مضمون۔"
  tr: "Hamingkubuno IX (1912–1988) hakkında Urduca Wikipedia makalesi; yalnızca kurumun kayıtları için kullanılmıştır. Kısa bir bahsde doğumu 12 Nisan 1912, ölümü 2 Ekim 1988, Yogyakarta üzerindeki hükümdarlığı ve Endonezya Başkan Yardımcısı olarak atanması belirtilmektedir."
  id: "Artikel Wikipedia Urdu tentang Hamingkubuno IX (1912–1988); hanya digunakan untuk catatan entitas. Sebutan singkat menyebutkan kelahirannya pada 12 April 1912, kematiannya pada 2 Oktober 1988, masa pemerintahannya atas Yogyakarta, dan pengangkatannya sebagai Wakil Presiden Indonesia."
