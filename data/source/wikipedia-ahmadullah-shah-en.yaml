summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد الله شاه؛ تُستخدم لوقائع الكيان فقط. تروي قيادته لثورة 1857 في أوده، وتنقّله بين المدن قبلها، ومقتله عند شاه جهان بور في 5 يونيو 1858، وتصفه في متنها بأنه مسلم سني."
  en: "English Wikipedia article on Ahmadullah Shah; used for entity facts only. It recounts his leadership of the 1857 rebellion in Awadh, his travels between Indian cities before it, and his killing at Shahjahanpur on 5 June 1858, and states in its text that he was a Sunni Muslim."
  es: "Artículo de la Wikipedia en inglés sobre Ahmadullah Shah; utilizado únicamente para obtener información sobre la persona. Relata su liderazgo en la rebelión de 1857 en Awadh, sus viajes entre ciudades indias antes de la misma y su asesinato en Shahjahanpur el 5 de junio de 1858, y afirma en su texto que era musulmán sunita."
  fr: "Article de Wikipédia en anglais sur Ahmadullah Shah; utilisé uniquement pour les informations factuelles. Il relate son rôle à la tête de la rébellion de 1857 à Awadh, ses déplacements entre les villes indiennes avant celle-ci et sa mort à Shahjahanpur le 5 juin 1858. Il précise qu'il était musulman sunnite."
  ur: "احمد اللہ شاہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اودھ میں 1857 کی بغاوت کی اس کی قیادت، اس سے پہلے ہندوستانی شہروں کے درمیان اس کے سفر اور 5 جون 1858 کو شاہجہاں پور میں اس کے قتل کا ذکر ہے، اور اس کے متن میں کہا گیا ہے کہ وہ سنی مسلمان تھے۔"
  tr: "Ahmadullah Shah hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1857 Odha Devrimi'ndeki liderliğini, önceki şehirler arası hareketini ve 5 Haziran 1858'de Shah Jahanpur'da öldürülmesini anlatır; onu Sünni Müslüman olarak tanımlar."
  id: "Artikel Wikipedia bahasa Inggris tentang Ahmadullah Shah; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kepemimpinannya dalam Revolusi Odha 1857, perpindahannya antar kota sebelumnya, dan pembunuhannya di Shah Jahanpur pada 5 Juni 1858, menggambarkannya sebagai Muslim Sunni."
