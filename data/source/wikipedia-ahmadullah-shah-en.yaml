reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. It gives his birth in 1787 at Faizabad (birth name Sikandar Shah; also called Danka Shah and Nakkar Shah), his traditional Islamic education and travels including Hajj, his pamphlet Fateh Islam, his role in the rebellion of 1857 alongside Fazl-e-Haq Khairabadi and Khan Bahadur Khan, and his death on 5 June 1858. Its text states 'The Maulvi was a Sunni Muslim' and that he was a practising Muslim; it names no legal school. Its categories file him under 'Sunni Sufis' and 'Indian Sufi religious leaders'."
