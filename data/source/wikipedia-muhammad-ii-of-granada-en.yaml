summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد الثاني صاحب غرناطة ⁦(نحو 1235 – 8 أبريل 1302)⁩، ثاني أمراء بني نصر؛ تؤرخ ولادته بسنة 633 هـ ⁦(1235 أو 1236)⁩ ووفاته في 8 أبريل 1302 الموافق 8 شعبان 701 هـ، وتعلل لقبه «الفقيه» بشهرته عالمًا بالقانون الشرعي وبتعليمه؛ تُستخدم لوقائع الكيان فقط."
  en: "English Wikipedia article on Muhammad II of Granada (c. 1235 - 8 April 1302), second Nasrid emir; it dates his birth to 633 AH (1235 or 1236) and his death to 8 April 1302 (8 Shaban 701 AH), and explains his epithet al-Faqih by his reputation as a canon lawyer and by his education; used for entity facts only."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad II de Granada (c. 1235 - 8 de abril de 1302), segundo emir nazarí; fecha su nacimiento en 633 AH (1235 o 1236) y su muerte el 8 de abril de 1302 (8 de Shaban de 701 AH), y explica su epíteto al-Faqih por su reputación como abogado canónico y por su educación; se utiliza solo para datos sobre la entidad."
  fr: "Article de Wikipédia en anglais sur Muhammad II de Grenade (vers 1235 - 8 avril 1302), deuxième émir nasride; il date sa naissance de 633 AH (1235 ou 1236) et sa mort du 8 avril 1302 (8 Shaban 701 AH), et explique son épithète al-Faqih par sa réputation de canoniste et par son éducation; utilisé uniquement pour les faits concernant l'entité."
  ur: "انگریزی ویکیپیڈیا کا مضمون محمد دوم آف گریناڈا ⁦(c. 1235 - 8 اپریل 1302)⁩، دوسرا نصری امیر؛ اس میں ان کی پیدائش 633 ہجری ⁦(1235 یا 1236)⁩ اور ان کی وفات 8 اپریل 1302 ⁦(8 شعبان 701 ہجری)⁩ بتائی گئی ہے، اور ان کی تخصیص الفقیہ کی وضاحت ایک ماہر قانون کے طور پر ان کی شہرت اور ان کی تعلیم سے ہوتی ہے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔"
  tr: "Nasrid hanedanının ikinci prensi olan Granada hükümdarı Muhammed II'nin (yaklaşık 1235 – 8 Nisan 1302) İngilizce Vikipedi makalesi, doğumunu 633 Hicri (1235 veya 1236) ve 8 Nisan 1302'ye tarihlendirir; bu da 8 Şaban 701 Hicri'ye karşılık gelir. 'El-Fekih' unvanı, Şeriat hukuku ve öğretisi konusunda alimi olarak ününe dayanır; yalnızca varlığın gerçekleri için kullanılır."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad II, penguasa Granada (sekitar 1235 – 8 April 1302), pangeran kedua dinasti Nasrid, mencatat kelahirannya pada tahun 633 H (1235 atau 1236) dan kematiannya pada 8 April 1302, yang sesuai dengan 8 Sha'ban 701 H. Gelarnya 'Al-Faqih' dibenarkan oleh ketenarannya sebagai sarjana hukum dan ajaran Syariah; gelar ini hanya digunakan untuk fakta-fakta entitas tersebut."
