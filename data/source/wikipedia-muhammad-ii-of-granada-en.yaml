reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth as 633 AH, which fell in 1235-1236, and his death on 8 April 1302, which it equates with 8 Shaban 701 AH. It names no legal school for the emir himself: its explanations of the al-Faqih epithet — canon lawyer, his education, his association with religious faith, justice and legal norms — are reputation and context, not a school attested for the man. The report that his son Muhammad III poisoned him is recorded as an unconfirmed allegation. Checked 2 November 2026."
