  ar: "مقالة ويكيبيديا الإنجليزية عن محمد الثاني صاحب غرناطة ⁦(نحو 1235 – 8 أبريل 1302)⁩، ثاني أمراء بني نصر؛ تؤرخ ولادته بسنة 633 هـ ⁦(1235 أو 1236)⁩ ووفاته في 8 أبريل 1302 الموافق 8 شعبان 701 هـ، وتعلل لقبه «الفقيه» بشهرته عالمًا بالقانون الشرعي وبتعليمه؛ تُستخدم لوقائع الكيان فقط."
  en: "English Wikipedia article on Muhammad II of Granada (c. 1235 - 8 April 1302), second Nasrid emir; it dates his birth to 633 AH (1235 or 1236) and his death to 8 April 1302 (8 Shaban 701 AH), and explains his epithet al-Faqih by his reputation as a canon lawyer and by his education; used for entity facts only."
