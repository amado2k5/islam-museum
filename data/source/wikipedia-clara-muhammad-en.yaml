summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كلارا محمد: مولدها في ميسون بجورجيا سنة 1899 باسم كلارا إيفانز، وزواجها من إلايجا محمد سنة 1917، وتعريفها زوجها بتعاليم فارد، وقيادتها المنظمة أثناء غيابه، ودورها في مدارس «جامعة الإسلام»، ووفاتها سنة 1972."
  en: "The English Wikipedia article on Clara Muhammad: her birth in Macon, Georgia in 1899 as Clara Evans, her marriage to Elijah Muhammad in 1917, her introduction of her husband to Fard's teachings, her guidance of the organisation during his absence, her role in the University of Islam schools, and her death in 1972."
  es: "El artículo de la Wikipedia en inglés sobre Clara Muhammad: su nacimiento en Macon, Georgia, en 1899 como Clara Evans, su matrimonio con Elijah Muhammad en 1917, su introducción a las enseñanzas de Fard por parte de su esposo, su guía de la organización durante su ausencia, su papel en las escuelas de la Universidad del Islam y su muerte en 1972."
  fr: "L'article de Wikipédia en anglais sur Clara Muhammad: sa naissance à Macon, en Géorgie, en 1899 sous le nom de Clara Evans, son mariage avec Elijah Muhammad en 1917, son initiation de son mari aux enseignements de Fard, son rôle à la tête de l'organisation pendant son absence, son rôle dans les écoles de l'Université de l'Islam et sa mort en 1972."
  ur: "کلارا محمد پر انگریزی ویکیپیڈیا کا مضمون: اس کی پیدائش میکون، جارجیا میں 1899 میں کلارا ایونز کے طور پر، 1917 میں اس کی ایلیا محمد سے شادی، فرد کی تعلیمات سے اس کے شوہر کا تعارف، اس کی غیر موجودگی کے دوران تنظیم کی رہنمائی، یونیورسٹی آف اسلام کے اسکولوں میں اس کا کردار، اور 1972 میں اس کی موت۔"
  tr: "Clara Muhammad hakkında İngilizce Wikipedia makalesi: 1899'da Georgia, Mason'da Clara Evans olarak doğdu, 1917'de Elijah Muhammad ile evlendi, kocasına Fard'ın öğretilerini tanıttı, onun yokluğunda liderliği organize etti ve 'Jamaat al-Islam' okullarındaki rolünü anlattı ve 1972'de vefat etti."
  id: "Artikel Wikipedia bahasa Inggris tentang Clara Muhammad: Dia lahir di Mason, Georgia pada tahun 1899 dengan nama Clara Evans, menikah dengan Elijah Muhammad pada tahun 1917, memperkenalkan suaminya pada ajaran Fard, mengorganisir kepemimpinan selama ketidakhadirannya, dan perannya di sekolah-sekolah 'Jamaat al-Islam', dan meninggal pada tahun 1972."
