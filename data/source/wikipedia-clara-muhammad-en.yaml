  ar: "مقالة ويكيبيديا الإنجليزية عن كلارا محمد: مولدها في ميسون بجورجيا سنة 1899 باسم كلارا إيفانز، وزواجها من إلايجا محمد سنة 1917، وتعريفها زوجها بتعاليم فارد، وقيادتها المنظمة أثناء غيابه، ودورها في مدارس «جامعة الإسلام»، ووفاتها سنة 1972."
  en: "The English Wikipedia article on Clara Muhammad: her birth in Macon, Georgia in 1899 as Clara Evans, her marriage to Elijah Muhammad in 1917, her introduction of her husband to Fard's teachings, her guidance of the organisation during his absence, her role in the University of Islam schools, and her death in 1972."
