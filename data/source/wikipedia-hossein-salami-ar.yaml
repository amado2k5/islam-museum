summary:
  ar: "مقالة ويكيبيديا العربية عن حسين سلامي، القائد العام للحرس الثوري الإيراني من ٢٠١٩ إلى ٢٠٢٥؛ توافق المقالة الإنجليزية على مولده في غلبايغان سنة ١٩٦٠ ووفاته في طهران في ١٣ حزيران ٢٠٢٥، ولا تسمي دينًا للرجل نفسه في مقدمتها."
  en: "Arabic Wikipedia article on Hossein Salami, commander-in-chief of Iran's Revolutionary Guard Corps from 2019 to 2025; it agrees with the English article on his birth in Golpayegan in 1960 and his death in Tehran on 13 June 2025, and names no faith for the man himself in its lead."
  es: "Artículo en árabe de la Wikipedia sobre Hossein Salami, comandante en jefe del Cuerpo de la Guardia Revolucionaria de Irán entre 2019 y 2025; coincide con el artículo en inglés sobre su nacimiento en Golpayegan en 1960 y su muerte en Teherán el 13 de junio de 2025, y no menciona ninguna religión del propio Salami en su introducción."
  fr: "L'article de Wikipédia en arabe sur Hossein Salami, commandant en chef du Corps des gardiens de la révolution iranienne de 2019 à 2025, concorde avec l'article en anglais concernant sa naissance à Golpayegan en 1960 et sa mort à Téhéran le 13 juin 2025, et ne mentionne aucune religion pour l'homme lui-même dans son introduction."
  ur: "2019 سے 2025 تک ایران کے پاسداران انقلاب کے کمانڈر انچیف حسین سلامی پر عربی ویکیپیڈیا کا مضمون؛ یہ 1960 میں گولپائیگن میں اس کی پیدائش اور 13 جون 2025 کو تہران میں اس کی موت کے بارے میں انگریزی مضمون سے اتفاق کرتا ہے، اور اس کی قیادت میں خود اس شخص کے لیے کوئی یقین نہیں رکھتا۔"
  tr: "2019-2025 yılları arasında İran Devrim Muhafızları'nın Başkomutanı olan Hüseyin Salami hakkında Arapça Wikipedia makalesi; İngilizce makale ise onun 1960'ta Golbaighan'da doğduğunu ve 13 Haziran 2025'te Tahran'da öldüğünü kabul ediyor ve girişinde adamın kendisini din olarak adlandırmıyor."
  id: "Artikel Wikipedia berbahasa Arab tentang Hossein Salami, Panglima Tertinggi Garda Revolusi Iran dari 2019 hingga 2025; artikel berbahasa Inggris setuju bahwa ia lahir di Golbaighan pada tahun 1960 dan meninggal di Teheran pada 13 Juni 2025, dan tidak menyebutkan nama pribadi pria itu sebagai agama dalam pendahuluannya."
