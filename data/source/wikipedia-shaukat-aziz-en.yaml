summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شوكت عزيز؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 6 مارس 1949 في كراتشي، ودراسته في معهد إدارة الأعمال، ومسيرته الطويلة في سيتي بنك حتى رئاسة «سيتي برايفت بنك»، ووزارته للمالية (1999–2007)، ونجاته من محاولة اغتيال في يوليو 2004، ورئاسته الوزراء (2004–2007) وبرنامج الخصخصة والتحرير الاقتصادي في عهده، وإقامته في لندن بعد ترك المنصب، وما يتصل باسمه في تسريبات «أوراق الجنة» ورده عليها كما تذكرها المقالة. وليس فيها محتوى ديني يسمّي انتماءه."
  en: "English Wikipedia article on Shaukat Aziz; used for entity facts only. It recounts his birth on 6 March 1949 at Karachi, his studies at the Institute of Business Administration, his long Citibank career up to the presidency of Citi Private Bank, his finance ministry (1999–2007), his survival of an assassination attempt in July 2004, his premiership (2004–2007) and the privatisation and liberalisation programme of his tenure, his residence in London after leaving office, and the Paradise Papers reports concerning a trust he set up and his response as the article states them. It contains no religion content naming his affiliation."
