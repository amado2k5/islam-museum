summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شوكت عزيز؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 6 مارس 1949 في كراتشي، ودراسته في معهد إدارة الأعمال، ومسيرته الطويلة في سيتي بنك حتى رئاسة «سيتي برايفت بنك»، ووزارته للمالية (1999–2007)، ونجاته من محاولة اغتيال في يوليو 2004، ورئاسته الوزراء (2004–2007) وبرنامج الخصخصة والتحرير الاقتصادي في عهده، وإقامته في لندن بعد ترك المنصب، وما يتصل باسمه في تسريبات «أوراق الجنة» ورده عليها كما تذكرها المقالة. وليس فيها محتوى ديني يسمّي انتماءه."
  en: "English Wikipedia article on Shaukat Aziz; used for entity facts only. It recounts his birth on 6 March 1949 at Karachi, his studies at the Institute of Business Administration, his long Citibank career up to the presidency of Citi Private Bank, his finance ministry (1999–2007), his survival of an assassination attempt in July 2004, his premiership (2004–2007) and the privatisation and liberalisation programme of his tenure, his residence in London after leaving office, and the Paradise Papers reports concerning a trust he set up and his response as the article states them. It contains no religion content naming his affiliation."
  es: "Artículo de la Wikipedia en inglés sobre Shaukat Aziz; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 6 de marzo de 1949 en Karachi, sus estudios en el Instituto de Administración de Empresas, su larga trayectoria en Citibank hasta la presidencia de Citi Private Bank, su ministerio de finanzas (1999-2007), su supervivencia a un intento de asesinato en julio de 2004, su mandato como primer ministro (2004-2007) y el programa de privatización y liberalización de su gobierno, su residencia en Londres tras dejar el cargo, y los informes de los Paradise Papers sobre un fideicomiso que creó y su respuesta, tal como se describe en el artículo. No contiene información sobre su afiliación religiosa."
  fr: "Article de Wikipédia en anglais sur Shaukat Aziz; utilisé uniquement pour des informations factuelles. Il relate sa naissance le 6 mars 1949 à Karachi, ses études à l’Institut d’administration des affaires, sa longue carrière chez Citibank jusqu’à la présidence de Citi Private Bank, son ministère des Finances (1999-2007), sa survie à une tentative d’assassinat en juillet 2004, son mandat de Premier ministre (2004-2007) et le programme de privatisation et de libéralisation mis en œuvre durant cette période, sa résidence à Londres après avoir quitté ses fonctions, ainsi que les révélations des Paradise Papers concernant un fonds fiduciaire qu’il avait créé et sa réaction, telles que décrites dans l’article. Il ne contient aucune mention de sa religion ni de son appartenance religieuse."
  ur: "شوکت عزیز پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 6 مارچ 1949 کو کراچی میں ان کی پیدائش، انسٹی ٹیوٹ آف بزنس ایڈمنسٹریشن میں ان کی تعلیم، سٹی پرائیویٹ بینک کی صدارت تک ان کا طویل سٹی بینک کیریئر، ان کی وزارت خزانہ (1999–2007)، جولائی 2004 میں قاتلانہ حملے میں ان کا زندہ بچ جانا، اور اس کی 2004-2004 پرائیویٹائزیشن کا ذکر ہے۔ ان کے دور کا لبرلائزیشن پروگرام، عہدہ چھوڑنے کے بعد لندن میں ان کی رہائش، اور پیراڈائز پیپرز کی رپورٹس اس ٹرسٹ کے بارے میں جو انہوں نے قائم کیں اور ان کا ردعمل جیسا کہ مضمون میں بتایا گیا ہے۔ اس میں اس کی وابستگی کا نام دینے والا کوئی مذہب مواد نہیں ہے۔"
