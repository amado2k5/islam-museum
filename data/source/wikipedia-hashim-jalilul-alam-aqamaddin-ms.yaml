summary:
  ar: "مقالة ويكيبيديا الملايوية عن السلطان هاشم جليل العالم أقام الدين؛ تُستخدم لوقائع الكيان فقط. تؤرّخ حكمه من 30 أيار 1885 إلى 10 أيار 1906 وميلاده سنة 1825 في قصر كامبونغ آير ووالده عمر علي سيف الدين الثاني ودينه الإسلام إجمالًا، وتذكر طلبه سنة 1887 مقيمًا بريطانيًا في ليمبانغ واتفاقية الحماية 1888 ورسالته المعترضة سنة 1903 إلى السلطان العثماني وتقرير ماك آرثر 1904 والاتفاقية التكميلية في 3 كانون الأول 1905 ووفاته ودفنه في الضريح الملكي وخلافة ابنه له."
  en: "Malay Wikipedia article on Sultan Hashim Jalilul Alam Aqamaddin; used for entity facts only. It dates his reign 30 May 1885 – 10 May 1906, gives his birth in 1825 at the Istana Kampong Ayer, his father Omar Ali Saifuddin II and his religion as Islam in general, and records his 1887 request for a British resident in Limbang, the 1888 Protectorate Agreement, his intercepted 1903 letter to the Ottoman sultan, the 1904 McArthur report, the supplementary agreement of 3 December 1905, and his death and burial at the Royal Mausoleum, succeeded by his son."
