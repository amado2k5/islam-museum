reliability_note: "Edition not verified against an earlier print. Date read from the printed imprint on scan p.4 (the OCR shows 1994 / 1414 AH). Page citations use the scan page markers of the OCR file (PDF pages), not the printed folios. The introduction is by the editor, so statements about Abduh's dates and aims are the editor's account and need a second source before use. The copyright status of this edition is not known; this record cites the text in the museum's own words only."
