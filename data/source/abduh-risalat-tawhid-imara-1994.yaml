label: { en: "Abduh, Risalat al-Tawhid, ed. Muhammad Imara (Dar al-Shuruq)", ar: "رسالة التوحيد — محمد عبده، تقديم وتحقيق محمد عمارة" }
summary:
  en: "The Dar al-Shuruq printed edition of Muhammad Abduh's Risalat al-Tawhid, with an introduction by the editor Muhammad Imara. So far the introduction and the body sections at scan pages 63 to 70 and 82 to 84 have been read; the rest of the book has not yet been read."
  ar: "طبعة دار الشروق من رسالة التوحيد لمحمد عبده، مع دراسة تقديمية لمحمد عمارة. قُرئت المقدمة وأقسام المتن في صفحات المسح 63 إلى 70 و82 إلى 84 حتى الآن، ولم يُقرأ بقية الكتاب بعد."
  es: "Edición impresa de Dar al-Shuruq de Risalat al-Tawhid de Muhammad Abduh, con introducción del editor Muhammad Imara. Hasta el momento se han leído la introducción y las secciones del cuerpo del texto en las páginas escaneadas 63 a 70 y 82 a 84; el resto del libro aún no se ha leído."
  fr: "L'édition imprimée de Dar al-Shuruq de la Risalat al-Tawhid de Muhammad Abduh, avec une introduction de l'éditeur Muhammad Imara. L'introduction et les sections du corps du texte aux pages numérisées 63 à 70 et 82 à 84 ont été lues jusqu'à présent ; le reste du livre n'a pas encore été lu."
  ur: "دار الشروق نے محمد عبدہ کی رسالت التوحید کا مطبوعہ ایڈیشن، ایڈیٹر محمد امارہ کے تعارف کے ساتھ۔ اب تک تعارف اور متن کے اسکین صفحات 63 تا 70 اور 82 تا 84 پڑھے گئے ہیں؛ کتاب کا باقی حصہ ابھی نہیں پڑھا گیا۔"
  tr: "Muhammad Abduh'un Tektanrıcılık üzerine Risalesi'nin Dar Al-Shoruuk baskısı, Muhammed Amara'nın giriş çalışmasıyla birlikte. Metnin giriş ve bölümleri şimdiye kadar 63-70 ve 82-84. sayfalarda okunmuş, kitabın geri kalanı ise henüz okunmamıştır."
  id: "Edisi Dar Al-Shorouk dari Risalah Monoteisme Muhammad Abduh, dengan studi pengantar oleh Muhammad Amara. Pendahuluan dan bagian-bagian teks telah dibaca pada halaman 63 hingga 70 dan 82 hingga 84 sejauh ini, dan sisa buku tersebut belum dibaca."
