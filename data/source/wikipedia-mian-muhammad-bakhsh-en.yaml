  ar: "مقالة ويكيبيديا الإنجليزية عن ميان محمد بخش (حوالي 1830 – 22 كانون الثاني 1907)؛ تسميه شاعراً صوفياً بنجابياً من خاري شريف، وتروي توليته خلافة أبيه ثم بيعته الرسمية لغلام محمد خليفة بابا بدوه شاه أبدال في سلسلة دمريان والي سركار، ووفاته في 7 ذي الحجة 1324هـ."
  en: "The English Wikipedia article on Mian Muhammad Bakhsh (c. 1830 – 22 January 1907); it calls him a Punjabi Sufi poet from Khari Sharif, recounts his investiture as his father's khalifa and his later formal bay'ah to Ghulam Muhammad, khalifa of Baba Baduh Shah Abdal, in the line of Damriyan Wali Sarkar, and dates his death to 7 Dhu al-Hijjah 1324 AH."
