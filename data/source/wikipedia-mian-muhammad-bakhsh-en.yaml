summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميان محمد بخش ⁦(حوالي 1830 – 22 كانون الثاني 1907)⁩؛ تسميه شاعراً صوفياً بنجابياً من خاري شريف، وتروي توليته خلافة أبيه ثم بيعته الرسمية لغلام محمد خليفة بابا بدوه شاه أبدال في سلسلة دمريان والي سركار، ووفاته في 7 ذي الحجة 1324هـ."
  en: "The English Wikipedia article on Mian Muhammad Bakhsh (c. 1830 – 22 January 1907); it calls him a Punjabi Sufi poet from Khari Sharif, recounts his investiture as his father's khalifa and his later formal bay'ah to Ghulam Muhammad, khalifa of Baba Baduh Shah Abdal, in the line of Damriyan Wali Sarkar, and dates his death to 7 Dhu al-Hijjah 1324 AH."
  es: "Mian Muhammad Bakhsh (c. 1830 – 22 de enero de 1907); lo describe como un poeta sufí punjabí de Khari Sharif, relata su investidura como califa de su padre y su posterior bay'ah formal a Ghulam Muhammad, el califa de Baba Baduh Shah Abdal, en la línea de Damriyan Wali Sarkar, y fecha su muerte el 7 de Dhu al-Hijjah de 1324 AH."
  fr: "Mian Muhammad Bakhsh (vers 1830 – 22 janvier 1907); il est décrit comme un poète soufi punjabi de Khari Sharif, relate son investiture comme khalifa de son père et sa bay'ah formelle ultérieure à Ghulam Muhammad, le khalifa de Baba Baduh Shah Abdal, dans la lignée de Damriyan Wali Sarkar, et date sa mort du 7 Dhu al-Hijjah 1324 AH."
  ur: "میاں محمد بخش ⁦(c. 1830 - 22 جنوری 1907)⁩؛ اس میں اسے کھڑی شریف کا ایک پنجابی صوفی شاعر کہا جاتا ہے، اس کے والد کے خلیفہ کے طور پر ان کی سرمایہ کاری اور بعد میں بابا بدو شاہ ابدال کے خلیفہ، غلام محمد سے دمریاں والی سرکار کی رسمی بیعت کا ذکر کرتا ہے، اور ان کی وفات کی تاریخ 7 ذی الحجہ 1324 ہجری ہے۔"
