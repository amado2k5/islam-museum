reliability_note: "TDV İslâm Ansiklopedisi entry (Sadeettin Okten, vol. 21, 2000, pp. 123-124) fetched and read in full 2026-11-15 after the earlier URL proved to be a search page. Standard Turkish academic encyclopaedia article: born Cairo 767 AH/1365 CE, Turkish origin via grandfather Taybugha, Shafi'i fiqh under Salih b. Umar al-Bulqini and Ibn al-Mulaqqin, arithmetic leading him to geometry, astronomy and miqat, taught al-Mawardi's al-Hawi, member of the Egyptian-astronomers chain from Ibn al-Shatir through al-Mardini, more than thirty astronomical works, and work no. 4 el-Menhelu'l-adhbu'z-zulal fi taqwimi'l-kawakib ve ru'yeti'l-hilal 'on the science of miqat and determining the time the new crescent will be seen'; his zijes were widely used in Egypt into the nineteenth century and later astronomers added supplements. Bibliography cites King and Kennedy on his tables."
