summary:
  ar: "مدخل «ابن المجدي» في دائرة المعارف التركية (TDV İslâm Ansiklopedisi) للسيد شهاب الدين أحمد بن رجب بن طيبغا المجدي القرضي الشافعي، من تأليف سادت الدين أؤكتن؛ يذكر مولده سنة ٧٦٧هـ/١٣٦٥م في القاهرة وأصله التركي عبر جده، وتعليمه الفقهي الشافعي، ومشايخه، وأكثر من ثلاثين مصنفاً فلكياً منها «المنهل العذب الزلال في تقويم الكواكب ورؤية الهلال»، وانتشار زیجاته في مصر حتى القرن التاسع عشر مع إضافات لاحقة."
  en: "The 'Ibn al-Majdi' entry in the Turkish Encyclopaedia of Islam (TDV İslâm Ansiklopedisi) by Sadeettin Okten for Shihab al-Din Ahmad ibn Rajab ibn Taybugha al-Majdi al-Qurazi al-Shafi'i; gives his birth in Cairo in 767 AH/1365 CE and Turkish origin through his grandfather, his Shafi'i legal training and teachers, more than thirty astronomical works including 'al-Manhal al-adhb al-zulal fi taqwimi'l-kawakib wa-ru'yat al-hilal', and the spread of his zijes in Egypt into the nineteenth century with later supplements."
  ur: "ترک دائرۃ المعارف اسلام (TDV İslâm Ansiklopedisi) میں سادت الدین اوکتن کا «ابن المجدی» کا اندراج، شہاب الدین احمد بن رجب بن طیبغا المجدی القرضی الشافعی کے لیے؛ 767ھ/1365ء میں قاہرہ میں پیدائش اور دادا کے ذریعے ترک نَسل، شافعی فقہ کی تعلیم اور اساتذہ، تیس سے زائد فلکیاتی تصانیف جن میں «المنہل العذب الزلال فی تقویم الکواکب و رؤیت الہلال»، اور انیسویں صدی تک مصر میں اس کی زیجوں کا پھیلاؤ بعد کی اضافوں سمیت۔"
  es: "La entrada 'Ibn al-Majdi' en la Enciclopedia Turca del Islam (TDV İslâm Ansiklopedisi) de Sadeettin Okten para Shihab al-Din Ahmad ibn Rajab ibn Taybugha al-Majdi al-Qurazi al-Shafi'i; da su nacimiento en El Cairo en 767 AH/1365 CE y origen turco a través de su abuelo, su formación jurídica shafi'í y sus maestros, más de treinta obras astronómicas, incluyendo 'al-Manhal al-adhb al-zulal fi taqwimi'l-kawakib wa-ru'yat al-hilal', y la difusión de sus zijes en Egipto hasta el siglo XIX con suplementos posteriores."
