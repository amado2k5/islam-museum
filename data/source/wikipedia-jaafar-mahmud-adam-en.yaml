reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id through the MediaWiki API with the returned id asserted equal. It gives his birth on 12 February 1960 at Daura, Katsina State, his studies at the Islamic University of Madinah under Ahmad Bamba, his influences (Ibn Taymiyyah, Muhammad ibn Abd al-Wahhab, Abubakar Gumi), his Ramadan tafsir in Maiduguri, and his assassination during the dawn prayer in Kano on 13 April 2007. The lead calls him 'a Nigerian Salafi Islamic scholar and a member of the Izala Society', citing Chouin's Nigeria Watch study; the infobox's 'Salafi, and Sunni' denomination carries the same single citation and its 'Maliki' jurisprudence is uncited, so both are one structured family. The Brigaglia article the text cites dates him 'ca. 1961/1962', against the article's own 1960 date."
