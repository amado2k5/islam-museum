summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جعفر محمود آدم؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه عالم نيجيري سلفي وعضو في جماعة إزالة البدعة وإقامة السنة، درس في الجامعة الإسلامية بالمدينة، وقُتل اغتيالا في مسجده بكانو في 13 أبريل 2007. يذكر صندوق معلوماتها انتماءه السلفي والسني ومذهبه المالكي، والسلفية حركة لا مذهب مسمّى في متن مستقل."
  en: "English Wikipedia article on Ja'afar Mahmud Adam; used for entity facts only. Its text calls him a Nigerian Salafi Islamic scholar and a member of the Izala Society, educated at the Islamic University of Madinah, and records his assassination in his Kano mosque on 13 April 2007. Its infobox gives his denomination as Salafi and Sunni and his jurisprudence as Maliki; in the article's text Salafism is presented as his movement, with no independent text naming a madhhab for him."
