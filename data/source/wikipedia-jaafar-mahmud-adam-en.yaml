summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جعفر محمود آدم؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه عالم نيجيري سلفي وعضو في جماعة إزالة البدعة وإقامة السنة، درس في الجامعة الإسلامية بالمدينة، وقُتل اغتيالا في مسجده بكانو في 13 أبريل 2007. يذكر صندوق معلوماتها انتماءه السلفي والسني ومذهبه المالكي، والسلفية حركة لا مذهب مسمّى في متن مستقل."
  en: "English Wikipedia article on Ja'afar Mahmud Adam; used for entity facts only. Its text calls him a Nigerian Salafi Islamic scholar and a member of the Izala Society, educated at the Islamic University of Madinah, and records his assassination in his Kano mosque on 13 April 2007. Its infobox gives his denomination as Salafi and Sunni and his jurisprudence as Maliki; in the article's text Salafism is presented as his movement, with no independent text naming a madhhab for him."
  es: "Artículo de la Wikipedia en inglés sobre Ja'afar Mahmud Adam; utilizado únicamente para datos sobre la persona. Su texto lo describe como un erudito islámico salafista nigeriano y miembro de la Sociedad Izala, educado en la Universidad Islámica de Medina, y registra su asesinato en su mezquita de Kano el 13 de abril de 2007. Su ficha informativa indica que era salafista y sunita, y que su jurisprudencia era malikí; en el texto del artículo, el salafismo se presenta como su movimiento, sin que ningún texto independiente mencione una escuela jurídica a la que pertenezca."
  fr: "L'article de Wikipédia en anglais consacré à Ja'afar Mahmud Adam est utilisé uniquement à des fins d'information. Il le décrit comme un érudit islamique salafiste nigérian, membre de la Société Izala, formé à l'Université islamique de Médine, et relate son assassinat dans sa mosquée de Kano le 13 avril 2007. Son infobox indique qu'il était salafiste et sunnite, et que son école juridique était malikite. Dans le texte, le salafisme est présenté comme son mouvement, sans qu'aucun texte indépendant ne mentionne d'école de pensée (madhhab) à laquelle il appartenait."
  ur: "جعفر محمود آدم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے متن میں اسے نائجیرین سلفی اسلامی اسکالر اور ازالہ سوسائٹی کا رکن کہا گیا ہے، جو مدینہ کی اسلامی یونیورسٹی میں تعلیم یافتہ ہے، اور 13 اپریل 2007 کو اس کی کانو مسجد میں اس کے قتل کو ریکارڈ کرتا ہے۔ مضمون کے متن میں سلفیت کو ان کی تحریک کے طور پر پیش کیا گیا ہے، اس کے لیے کوئی آزاد متن اس کے لیے مذہب کا نام نہیں دیتا۔"
