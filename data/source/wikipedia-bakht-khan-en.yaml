reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. It gives his birth in 1797 in Bijnor district and his death in 1859 in the Terai, citing the Express Tribune (2011) and Rudrangshu Mukherjee's Awadh in Revolt (2002). On his origins it reports, citing Iqbal Husain's paper in the Proceedings of the Indian History Congress (1985), that Urdu writers describe him as of Rohilla heritage without a clear family background, that a British officer stated him to be from a Hindu family which later converted to Islam, and that Khwaja Hasan Nizami claimed — without authority — maternal descent from the Nawabs of Oudh and paternal descent from Ghulam Qadir Rohilla. It names no legal school or order for him."
