summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بخت خان؛ تُستخدم لوقائع الكيان فقط. تروي خدمته صوبدارًا في جيش شركة الهند الشرقية وأربعين سنة في مدفعية الخيالة البنغالية، ومسيره بلواء بريلي إلى دلهي سنة 1857 وتوليه القيادة الفعلية لقوات الثورة فيها، وخروجه منها بعد سقوطها ووفاته جريحًا في سهول التراي بنيبال سنة 1859، وتسجّل ما قيل في أصول أسرته."
  en: "English Wikipedia article on Bakht Khan; used for entity facts only. It recounts his service as a subedar in the East India Company's army and forty years in the Bengal Horse Artillery, his march with the Bareilly brigade to Delhi in 1857 and his effective command of the rebel forces there, his departure after the city's fall, and his death from wounds in the Terai plains of Nepal in 1859, and records the conflicting accounts of his family origins."
  es: "Artículo de la Wikipedia en inglés sobre Bakht Khan; utilizado únicamente para datos sobre la persona. Relata su servicio como subedar en el ejército de la Compañía Británica de las Indias Orientales y sus cuarenta años en la Artillería Montada de Bengala, su marcha con la brigada de Bareilly a Delhi en 1857 y su efectivo mando de las fuerzas rebeldes allí, su partida tras la caída de la ciudad y su muerte por heridas en las llanuras de Terai, en Nepal, en 1859, y recoge las versiones contradictorias sobre sus orígenes familiares."
  fr: "Article de Wikipédia en anglais sur Bakht Khan; utilisé uniquement pour les informations factuelles. Il relate son service comme subedar dans l'armée de la Compagnie des Indes orientales et ses quarante années dans l'artillerie à cheval du Bengale, sa marche avec la brigade de Bareilly jusqu'à Delhi en 1857 et son commandement efficace des forces rebelles sur place, son départ après la chute de la ville et sa mort des suites de ses blessures dans les plaines du Teraï au Népal en 1859, et relate les récits contradictoires concernant ses origines familiales."
