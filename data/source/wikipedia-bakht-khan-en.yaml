summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بخت خان؛ تُستخدم لوقائع الكيان فقط. تروي خدمته صوبدارًا في جيش شركة الهند الشرقية وأربعين سنة في مدفعية الخيالة البنغالية، ومسيره بلواء بريلي إلى دلهي سنة 1857 وتوليه القيادة الفعلية لقوات الثورة فيها، وخروجه منها بعد سقوطها ووفاته جريحًا في سهول التراي بنيبال سنة 1859، وتسجّل ما قيل في أصول أسرته."
  en: "English Wikipedia article on Bakht Khan; used for entity facts only. It recounts his service as a subedar in the East India Company's army and forty years in the Bengal Horse Artillery, his march with the Bareilly brigade to Delhi in 1857 and his effective command of the rebel forces there, his departure after the city's fall, and his death from wounds in the Terai plains of Nepal in 1859, and records the conflicting accounts of his family origins."
