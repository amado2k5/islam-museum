summary:
  ar: "قسم الفتاوى في موقع إسلام ويب التابع لوزارة الأوقاف والشؤون الإسلامية بقطر، ينشر فتاوى مرقّمة ومؤرّخة بالهجري والميلادي، مصنّفة في عرض موضوعي."
  en: "The fatwa section of IslamWeb, the site of Qatar's Ministry of Awqaf and Islamic Affairs, publishing fatwas numbered and dated in Hijri and Gregorian, arranged in a topical index."
  ur: "اسلام ویب کا فتویٰ سیکشن، جو قطر کی وزارتِ اوقاف و اسلامی امور کی ویب سائٹ ہے، اور ہجری و عیسوی تاریخ کے ساتھ نمبر وار فتاویٰ موضوعاتی فہرست میں شائع کرتی ہے۔"
  es: "La sección de fatuas de IslamWeb, el sitio web del Ministerio de Asuntos Islámicos y Awqaf de Qatar, publica fatuas numeradas y fechadas en los calendarios islámico y gregoriano, organizadas en un índice temático."
  fr: "La section fatwa d'IslamWeb, le site du ministère qatari des Awqaf et des Affaires islamiques, publie des fatwas numérotées et datées selon le calendrier hégirien et grégorien, classées par thème."
  tr: "İslam Web sitesindeki Fetva Dairesi, Katar Awkaf ve İslami İşler Bakanlığı'na bağlı olarak, fetvaları Hicri ve Gregoryen takvimleriyle numaralandırılmış ve tarihlendirilmiş, objektif bir sunumda yayımlamaktadır."
  id: "Departemen Fatwa di situs web Islam, yang berafiliasi dengan Kementerian Awqaf dan Urusan Islam di Qatar, menerbitkan fatwa yang diberi nomor dan tanggal dalam kalender Hijriyah dan Gregorian, yang dikategorikan dalam presentasi objektif."
