summary:
  ar: "مقالة ويكيبيديا العربية عن يعقوب آرتين؛ تُستخدم لوقائع الكيان فقط. تروي منشأه من الجالية الأرمنية في مصر وعمله وكيلًا لنظارة المعارف من 1884 إلى 1906 ودوره في تأسيس الجامعة المصرية وكتابته للحكايات الشعبية المصرية."
  en: "Arabic Wikipedia article on Yacoub Artin; used for entity facts only. It recounts his origin in Egypt's Armenian community, his tenure as undersecretary of the Ministry of Public Instruction from 1884 to 1906, his role in founding the Egyptian university and his recording of Egyptian folk tales."
  es: "Artículo en árabe de la Wikipedia sobre Yacoub Artin; se utiliza únicamente para obtener información sobre la persona. Relata sus orígenes en la comunidad armenia de Egipto, su mandato como subsecretario del Ministerio de Instrucción Pública entre 1884 y 1906, su papel en la fundación de la universidad egipcia y su recopilación de cuentos populares egipcios."
  fr: "Article de Wikipédia en arabe sur Yacoub Artin; utilisé uniquement à des fins d'information sur l'entité. Il relate ses origines au sein de la communauté arménienne d'Égypte, son mandat de sous-secrétaire au ministère de l'Instruction publique de 1884 à 1906, son rôle dans la fondation de l'université égyptienne et son recueil de contes populaires égyptiens."
  ur: "یعقوب آرٹین پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں مصر کی آرمینیائی کمیونٹی میں ان کی اصلیت، 1884 سے 1906 تک وزارت پبلک انسٹرکشن کے انڈر سیکرٹری کے طور پر ان کا دور، مصری یونیورسٹی کے قیام میں ان کے کردار اور مصری لوک کہانیوں کی ریکارڈنگ کے بارے میں بتایا گیا ہے۔"
