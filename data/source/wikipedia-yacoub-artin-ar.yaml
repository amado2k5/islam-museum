reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him as an Egyptian teacher, researcher and writer of Armenian origin, 15 April 1842 – 21 January 1919, whose father Artin Bey Tcherakian had been foreign minister under Muhammad Ali; he returned to Egypt in 1870, became the Khedive Ismail's European secretary, was undersecretary of the Ministry of Public Instruction from 1884 to 1906, pressed for foreign-language teaching and quality over quantity in curricula, was among the first advocates of an Egyptian university, and was the first to write down and record Egyptian folk tales. Its writer infobox carries no religion field and its text makes no statement of his religion."
