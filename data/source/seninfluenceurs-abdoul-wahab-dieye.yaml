  ur: "سینیگالی اثر انگیز ڈائرکٹری Seninfluenceurs پر عبدالوہاب دیے کی تخلیق کار پروفائل؛ اس میں اسے ایک نوجوان سینیگالی مبلغ کے طور پر بیان کیا گیا ہے جو روزانہ مذہبی تعلیمات شائع کرتا ہے جس کا مقصد خاص طور پر نوجوانوں کو ہوتا ہے، اور اس کی حج کی کارکردگی کو ریکارڈ کرتا ہے۔"
