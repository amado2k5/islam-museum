reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives the same dates as the English article (born 12 January 1876, died 10 April 1950, both at Istanbul) but names Anadolu Kavağı as his birthplace in its lead, against the English article's Cihangir. Its infobox gives his religion (dini) as Islam, generically; its text names no school and no Sufi order for him. For the crowds at his funeral prayer it cites a 2001 Hürriyet column titled 'Fevzi Çakmak Nakşibendi miydi?' ('Was Fevzi Çakmak a Naqshbandi?') — a question posed in a newspaper column, used by the article only as a source for the funeral attendance. It also recounts the 1950 'Radyoevi incident', when crowds protested that state radio continued music broadcasts after his death."
