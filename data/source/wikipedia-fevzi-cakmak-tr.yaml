summary:
  ar: "مقالة ويكيبيديا التركية عن فوزي جاكماق؛ تُستخدم لوقائع الكيان فقط. تعطي صندوق معلوماتها دينه «الإسلام» بصيغة عامة، وتروي مسيرته العسكرية والسياسية وجنازته الحاشدة من جامع بايزيد سنة 1950."
  en: "Turkish Wikipedia article on Fevzi Çakmak; used for entity facts only. Its infobox gives his religion as Islam generically, and it recounts his military and political career and his crowded 1950 funeral from the Beyazıt Mosque."
  es: "Artículo de la Wikipedia en turco sobre Fevzi Çakmak; utilizado únicamente para obtener información sobre la persona. Su ficha informativa indica que su religión era el islam de forma genérica y relata su carrera militar y política, así como su multitudinario funeral en la mezquita de Beyazıt en 1950."
  fr: "Article de Wikipédia en turc sur Fevzi Çakmak; utilisé uniquement pour les informations sur l'entité. Son infobox indique qu'il était musulman et relate sa carrière militaire et politique ainsi que ses funérailles, en 1950, qui ont rassemblé une foule nombreuse à la mosquée Beyazıt."
  ur: "Fevzi Çakmak پر ترک ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی باکس عام طور پر اس کے مذہب کو اسلام کے طور پر دیتا ہے، اور اس میں اس کے فوجی اور سیاسی کیریئر اور 1950 میں بیازیت مسجد سے اس کے ہجوم کے جنازے کا ذکر ہے۔"
  tr: "Favzi Çakmak hakkında Türkçe Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. Bilgi kutusu, onun dini \"İslam\"ı genel bir biçimde verir; askeri ve siyasi kariyerini ve 1950'de Bayezid Camii'ndeki büyük cenazesini anlatır."
  id: "Artikel Wikipedia Turki tentang Favzi Çakmak; hanya digunakan untuk fakta entitas. Kotak infonya mencantumkan agamanya \"Islam\" dalam bentuk umum, menceritakan karier militer dan politiknya serta pemakamannya yang besar dari Masjid Bayezid pada tahun 1950."
