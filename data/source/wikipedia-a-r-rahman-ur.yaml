reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It tells the family's turn to Islam in its own terms — the boy Dileep Kumar's recurring illness, his mother's vow at a pir's shrine and his recovery, after which the whole household entered Islam and he was named Allah Rakha Rahman — a telling that differs from the English article's (the sister's illness and the Qadiri tariqa) and is therefore an independent witness, not a translation of it. Its section headed «صوفی ازم» (Sufism) states: Rahman believes in Sufism and for that reason does not fail to visit the shrines of pirs and saints; he once acknowledged that the spirituality in his music is a gift of the saints; and he is a murid of the Pakistani composer and qawwal Nusrat Fateh Ali Khan. The article also covers his father's death when he was nine, his keyboard work, the Trinity College scholarship, Roja and the National Award, and the 2009 Academy Award for Slumdog Millionaire; its award counts differ from the English article's and are not used."
