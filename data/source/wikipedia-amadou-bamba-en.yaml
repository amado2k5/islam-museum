reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 'on the outskirts of 1270 A.H. (around 1853 A.D.)' at Mbacké in Baol, second son of Maam Mor Anta Saly Mbacke, 'a Marabout from the Qadiriyya', and Maam Diaara Bousso; known as Khadim al-Rasul ('Servant of the Messenger') and Serigne Touba; founded the Mouride brotherhood in 1883 and the city of Touba in 1887 (the French article gives 1888 for Touba — the conflict is recorded in the record); taught jihad al-nafs and the 'greater struggle' (jihad al-akbar) through learning rather than weapons, and salvation through submission to God and hard work; tried by the Privy Council at Saint-Louis on 5 September 1895 and exiled to Gabon for seven years and nine months, then to Mauritania (1903–1907), then fifteen years of house arrest at Diourbel; the disciples' testimony of his two rak'as prayed in the Governor's office is carried by the article as testimony, not archival proof; the French awarded him the Legion of Honor in 1918 for enlisting followers in the First World War and he refused it (the French article says he accepted the diploma but refused to wear the cross — recorded in the record); in 1926 he began work on the Great Mosque of Touba; he died in 1927 and was buried at Touba at a site he had chosen; his followers are estimated at more than three million, and the annual Magal pilgrimage draws millions to Touba. The lead's naming of him as 'a Sufi saint and founder of the Mouride Brotherhood' is one of the independent attestations on which the record's sufi segment rests. The article does not name a school of law or theology for him."
