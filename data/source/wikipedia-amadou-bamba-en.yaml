  en: "English Wikipedia article on Shaykh Amadou Bamba (1853–1927); used for entity facts only. It names him a Sufi saint and founder of the Mouride Brotherhood (the Muridiyya), and covers his exiles to Gabon (1895–1902) and Mauritania (1903–1907), his teaching of work and the 'greater jihad', his death in 1927 and burial at Touba."
