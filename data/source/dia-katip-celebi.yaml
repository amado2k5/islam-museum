reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The standard scholarly encyclopaedia entry, by the editor of Kâtip Çelebi's own works, resting on his autobiographies (Sullam al-Wusul, f. 271a ff.; Mizan al-Haqq, p. 129 ff.). It gives his birth in Dhu'l-Qa'da 1017 / February 1609 at Istanbul and dates his death to 1067 AH / 1657. It is one of the two texts behind the person record's faith settlement: describing the author, it states that he says he is of the Hanafi madhhab and the Ishraqi disposition, citing the Sullam al-Wusul passage directly — an attestation independent of the Arabic Wikipedia, which quotes the same self-description. Read in-session 1 November 2026."
