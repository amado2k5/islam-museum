summary:
  ar: "إعلان المركز الملكي للدراسات الإستراتيجية الإسلامية ⁦(RISSC)⁩ اختيار فاطمة زهرا شيخ آبادي امرأةَ العام في طبعة 2027 من كتاب المسلمون الخمسمئة الأكثر تأثيرًا، مرجع لبيانات سجل person/fatemeh-zahra-sheikhabadi."
  en: "The Royal Islamic Strategic Studies Centre announcement, carried by IQNA and other outlets, naming Fatemeh Zahra Sheikhabadi Woman of the Year in the 2027 edition of The Muslim 500; reference for the record person/fatemeh-zahra-sheikhabadi."
  es: "El anuncio del Centro Real de Estudios Estratégicos Islámicos, difundido por IQNA y otros medios, nombra a Fatemeh Zahra Sheikhabadi Mujer del Año en la edición de 2027 de The Muslim 500; referencia para el registro person/fatemeh-zahra-sheikhabadi."
  fr: "Annonce du Centre royal d'études stratégiques islamiques, relayée par IQNA et d'autres médias, désignant Fatemeh Zahra Sheikhabadi comme Femme de l'année dans l'édition 2027 de The Muslim 500; référence pour la personne/fatemeh-zahra-sheikhabadi."
  ur: "رائل اسلامک اسٹریٹجک اسٹڈیز سینٹر کا اعلان، IQNA اور دیگر آؤٹ لیٹس کے ذریعے کیا گیا، جس میں فاطمہ زہرا شیخ آبادی کو دی مسلم 500 کے 2027 ایڈیشن میں سال کی بہترین خاتون قرار دیا گیا۔ ریکارڈ پرسن/فاطمہ زہرا شیخ آبادی کے لیے حوالہ۔"
  tr: "Kraliyet İslami Stratejik Araştırmalar Merkezi (RISSC) tarafından 2027 En Etkili 500 Müslüman Kitabı sayısında Fatima Zahra Sheikhabadi'nin Yılın Kadını seçildiğini duyuruyor; bu veriler kişi/fatemeh-zahra-sheikhabadi kaydından alınmıştır."
  id: "Pengumuman oleh Royal Center for Islamic Strategic Studies (RISSC) yang memilih Fatima Zahra Sheikhabadi sebagai Wanita Terbaik Tahun Ini dalam edisi 2027 dari 500 Buku Muslim Paling Berpengaruh, data referensi dari catatan orang/fatemeh-zahra-sheikhabadi."
