  ar: "مقالة ويكيبيديا الإنجليزية عن بيير أميديار؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في باريس سنة 1967 باسم برويز مراد أميديار، وتأسيسه إيباي سنة 1995 ورئاسته لها، وشبكة أميديار وفيرست لوك ميديا وعطائه الخيري، وتصفه في حياته الشخصية بأنه من أتباع الدالاي لاما."
  en: "English Wikipedia article on Pierre Omidyar; used for entity facts only. It recounts his 1967 Paris birth as Parviz Morad Omidyar, his founding of eBay in 1995 and chairmanship, Omidyar Network, First Look Media and his philanthropy, and describes him in his personal life as a follower of the Dalai Lama."
