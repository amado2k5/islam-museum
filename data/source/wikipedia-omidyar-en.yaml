  ar: "مقالة ويكيبيديا الإنجليزية عن بيير أميديار؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في باريس سنة 1967 باسم برويز مراد أميديار، وتأسيسه إيباي سنة 1995 ورئاسته لها، وشبكة أميديار وفيرست لوك ميديا وعطائه الخيري، وتصفه في حياته الشخصية بأنه من أتباع الدالاي لاما."
  en: "English Wikipedia article on Pierre Omidyar; used for entity facts only. It recounts his 1967 Paris birth as Parviz Morad Omidyar, his founding of eBay in 1995 and chairmanship, Omidyar Network, First Look Media and his philanthropy, and describes him in his personal life as a follower of the Dalai Lama."
  es: "Artículo de la Wikipedia en inglés sobre Pierre Omidyar; utilizado únicamente para datos sobre la persona. Relata su nacimiento en París en 1967 como Parviz Morad Omidyar, la fundación de eBay en 1995 y su presidencia, Omidyar Network, First Look Media y su filantropía, y lo describe en su vida personal como seguidor del Dalai Lama."
  fr: "Article de Wikipédia en anglais sur Pierre Omidyar; utilisé uniquement pour les informations relatives à l’entité. Il relate sa naissance à Paris en 1967 sous le nom de Parviz Morad Omidyar, la fondation d’eBay en 1995 et sa présidence, Omidyar Network, First Look Media et ses activités philanthropiques, et le décrit dans sa vie personnelle comme un disciple du dalaï-lama."
