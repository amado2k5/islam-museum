summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إينياكي وليمز؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته الكاملة مع أثلتيك بلباو وتحوله الدولي من إسبانيا إلى غانا، ولا تذكر ديانته؛ وإشارتها الوحيدة إلى الكاثوليكية تخص جمعية كاريتاس التي سُمّي باسم أحد متطوعيها."
  en: "English Wikipedia article on Iñaki Williams; used for entity facts only. It recounts his whole career at Athletic Bilbao and his international switch from Spain to Ghana, and makes no statement of his religion; its only Catholic reference is to Caritas, the charity whose volunteer he was named after."
  es: "Artículo de la Wikipedia en inglés sobre Iñaki Williams; se utiliza únicamente para obtener información sobre la persona. Narra toda su trayectoria en el Athletic de Bilbao y su paso por la selección nacional, pasando de España a Ghana, y no menciona su religión; su única referencia católica es a Cáritas, la organización benéfica cuyo voluntario recibió su nombre."
  fr: "Article Wikipédia en anglais sur Iñaki Williams; utilisé uniquement pour les informations le concernant. Il retrace son parcours à l’Athletic Bilbao et son passage de l’Espagne au Ghana en sélection nationale, sans mentionner sa religion; la seule référence catholique concerne Caritas, l’association caritative dont il porte le nom."
  ur: "Iñaki Williams پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اتھلیٹک بلباؤ میں اس کے پورے کیریئر اور اسپین سے گھانا میں اس کے بین الاقوامی سوئچ کا ذکر کرتا ہے، اور اپنے مذہب کا کوئی بیان نہیں دیتا ہے۔ اس کا واحد کیتھولک حوالہ Caritas کا ہے، وہ خیراتی ادارہ جس کے رضاکار کے نام پر اس کا نام رکھا گیا تھا۔"
  tr: "Iñaki Williams hakkında İngilizce Wikipedia makalesi yalnızca varlık bilgileri için kullanılır. Athletic Bilbao'daki tüm kariyerini ve İspanya'dan Gana'ya uluslararası geçişini anlatır, dininden bahsetmez; Katolikliğe dair tek referansı gönüllülülerden birinin adını taşıyan Caritas Derneği'ne aittir."
  id: "Artikel Wikipedia bahasa Inggris tentang Iñaki Williams hanya digunakan untuk fakta entitas. Artikel ini menceritakan seluruh kariernya bersama Athletic Bilbao dan transisi internasionalnya dari Spanyol ke Ghana, tanpa menyebutkan agamanya; satu-satunya referensi tentang Katolik adalah Caritas Association, yang dinamai sesuai salah satu relawannya."
