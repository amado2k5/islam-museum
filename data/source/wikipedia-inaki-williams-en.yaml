  ar: "مقالة ويكيبيديا الإنجليزية عن إينياكي وليمز؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته الكاملة مع أثلتيك بلباو وتحوله الدولي من إسبانيا إلى غانا، ولا تذكر ديانته؛ وإشارتها الوحيدة إلى الكاثوليكية تخص جمعية كاريتاس التي سُمّي باسم أحد متطوعيها."
