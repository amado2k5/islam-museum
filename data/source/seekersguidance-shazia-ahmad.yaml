summary:
  ar: "الترجمة التعريفية التي ينشرها موقع سيكرز غايدنس للأستاذة شازية أحمد مع إجاباتها: دراستها في دمشق ⁦(العقيدة والفقه والتجويد والتفسير والعربية)⁩، وماجستير العربية من جامعة تكساس في أوستن، ودراستها في عمّان، وإقامتها في ميسيساغا بكندا."
  en: "The scholar biography SeekersGuidance publishes with Ustadha Shazia Ahmad's answers: her two years of study in Damascus (aqidah, fiqh, tajweed, tafsir and Arabic), her Master's in Arabic at the University of Texas at Austin, her further study in Amman, and her residence in Mississauga, Canada."
  es: "La biografía académica que publica SeekersGuidance recoge las respuestas de la Ustadha Shazia Ahmad: sus dos años de estudio en Damasco (aqidah, fiqh, tajweed, tafsir y árabe), su máster en árabe en la Universidad de Texas en Austin, sus estudios posteriores en Amán y su residencia en Mississauga, Canadá."
  fr: "La biographie de l'érudite publiée par SeekersGuidance avec les réponses d'Ustadha Shazia Ahmad: ses deux années d'études à Damas (aqidah, fiqh, tajweed, tafsir et arabe), sa maîtrise en arabe à l'Université du Texas à Austin, ses études complémentaires à Amman et sa résidence à Mississauga, au Canada."
