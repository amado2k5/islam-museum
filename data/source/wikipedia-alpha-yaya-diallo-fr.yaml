summary:
  ar: "مقالة ويكيبيديا الفرنسية القصيرة عن ألفا يايا ديالو ⁦(1830 – 10 أكتوبر 1912)⁩، المحارب الفولاني المعروف بـ«ملك» لابي، إحدى مقاطعات فوتا جالون؛ تروي توسيعه سلطته باتفاقه مع الفرنسيين، ونفيه إلى داهومي (1905–1910) ثم اعتقاله وترحيله النهائي إلى بورت إتيان حيث توفي سنة 1912، وتخليد غينيا له: نشيدها الوطني مقتبس من أغنية نُظمت في مدحه نحو 1903، وأكبر معسكراتها يحمل اسمه، وصورته أسيرًا ظهرت على أوراق الخمسين فرنكًا عند إنشاء العملة الغينية سنة 1960."
  en: "Short French Wikipedia article on Alpha Yaya Diallo (1830 – 10 October 1912), the Fula warrior known as the 'king' of Labé, one of the provinces of Futa Jallon; it recounts how he extended his power by coming to terms with the French, his exile to Dahomey (1905–1910), his later arrest and final deportation to Port-Étienne, where he died in 1912, and his commemoration in Guinea: the national anthem adapts a song composed in his honour around 1903, the country's main military camp bears his name, and his portrait as a prisoner appeared on the fifty-franc notes at the creation of the Guinean currency in 1960."
  es: "Breve artículo de la Wikipedia en francés sobre Alpha Yaya Diallo (1830-10 de octubre de 1912), el guerrero fula conocido como el \"rey\" de Labé, una de las provincias de Futa Jallon; relata cómo extendió su poder al llegar a un acuerdo con los franceses, su exilio a Dahomey (1905-1910), su posterior arresto y deportación final a Port-Étienne, donde murió en 1912, y su conmemoración en Guinea: el himno nacional adapta una canción compuesta en su honor alrededor de 1903, el principal campamento militar del país lleva su nombre y su retrato como prisionero apareció en los billetes de cincuenta francos en la creación de la moneda guineana en 1960."
  fr: "Court article de Wikipédia en français sur Alpha Yaya Diallo (1830 – 10 octobre 1912), le guerrier peul connu comme le « roi » du Labé, une des provinces du Fouta-Djalon; il raconte comment il a étendu son pouvoir en s'alliant aux Français, son exil au Dahomey (1905-1910), son arrestation ultérieure et sa déportation finale à Port-Étienne, où il est mort en 1912, et sa commémoration en Guinée: l'hymne national adapte une chanson composée en son honneur vers 1903, le principal camp militaire du pays porte son nom, et son portrait en prisonnier est apparu sur les billets de cinquante francs lors de la création de la monnaie guinéenne en 1960."
  ur: "الفا یایا ڈیالو ⁦(1830 - 10 اکتوبر 1912)⁩ پر مختصر فرانسیسی ویکیپیڈیا مضمون، فولا جنگجو جسے لابی کے 'بادشاہ' کے نام سے جانا جاتا ہے، فوٹا جالون کے صوبے میں سے ایک؛ اس میں بتایا گیا ہے کہ کس طرح اس نے فرانسیسیوں کے ساتھ معاہدہ کرکے اپنی طاقت کو بڑھایا، ڈاہومی (1905-1910) میں جلاوطنی، اس کی بعد میں گرفتاری اور آخری جلاوطنی پورٹ-اٹین، جہاں اس کی موت 1912 میں ہوئی، اور گنی میں اس کی یادگار: قومی ترانہ اس کے اعزاز میں بنائے گئے ایک گیت کو ڈھالتا ہے، جو اس کے فوجی کیمپ اور 1903 کے آس پاس اس کے ملک کے نام سے مشہور ہے۔ 1960 میں گنی کرنسی کی تخلیق کے وقت پچاس فرانک کے نوٹوں پر ایک قیدی کی تصویر نمودار ہوئی۔"
