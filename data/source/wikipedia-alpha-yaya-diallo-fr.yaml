summary:
  ar: "مقالة ويكيبيديا الفرنسية القصيرة عن ألفا يايا ديالو (1830 – 10 أكتوبر 1912)، المحارب الفولاني المعروف بـ«ملك» لابي، إحدى مقاطعات فوتا جالون؛ تروي توسيعه سلطته باتفاقه مع الفرنسيين، ونفيه إلى داهومي (1905–1910) ثم اعتقاله وترحيله النهائي إلى بورت إتيان حيث توفي سنة 1912، وتخليد غينيا له: نشيدها الوطني مقتبس من أغنية نُظمت في مدحه نحو 1903، وأكبر معسكراتها يحمل اسمه، وصورته أسيرًا ظهرت على أوراق الخمسين فرنكًا عند إنشاء العملة الغينية سنة 1960."
  en: "Short French Wikipedia article on Alpha Yaya Diallo (1830 – 10 October 1912), the Fula warrior known as the 'king' of Labé, one of the provinces of Futa Jallon; it recounts how he extended his power by coming to terms with the French, his exile to Dahomey (1905–1910), his later arrest and final deportation to Port-Étienne, where he died in 1912, and his commemoration in Guinea: the national anthem adapts a song composed in his honour around 1903, the country's main military camp bears his name, and his portrait as a prisoner appeared on the fifty-franc notes at the creation of the Guinean currency in 1960."
