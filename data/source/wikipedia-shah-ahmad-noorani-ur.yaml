summary:
  ar: "مقالة ويكيبيديا الأردية عن شاه أحمد نوراني (1926–2003)؛ تعطي مولده بـ1 نيسان 1926 في ميروت ووفاته في 11 كانون الأول 2003 في إسلام آباد ودفنه عند ضريح عبد الله شاه غازي في كراتشي، وتذكر أن شجرة طريقته تتصل بأحمد رضا خان القادري، وقيادته لجمعية علماء باكستان ولمجلس العمل الموحد، دون أن تسمي في متنها مذهباً له."
  en: "The Urdu Wikipedia article on Shah Ahmad Noorani (1926–2003); it gives his birth as 1 April 1926 at Meerut, his death on 11 December 2003 at Islamabad and his burial at the Abdullah Shah Ghazi mausoleum in Karachi, states that his spiritual lineage (shajara-e-tariqat) runs to Ahmed Raza Khan Qadri, and records his leadership of Jamiat Ulema-e-Pakistan and the Muttahida Majlis-e-Amal, while naming no school for him in its prose."
