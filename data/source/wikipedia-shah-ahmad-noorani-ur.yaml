summary:
  ar: "مقالة ويكيبيديا الأردية عن شاه أحمد نوراني (1926–2003)؛ تعطي مولده بـ1 نيسان 1926 في ميروت ووفاته في 11 كانون الأول 2003 في إسلام آباد ودفنه عند ضريح عبد الله شاه غازي في كراتشي، وتذكر أن شجرة طريقته تتصل بأحمد رضا خان القادري، وقيادته لجمعية علماء باكستان ولمجلس العمل الموحد، دون أن تسمي في متنها مذهباً له."
  en: "The Urdu Wikipedia article on Shah Ahmad Noorani (1926–2003); it gives his birth as 1 April 1926 at Meerut, his death on 11 December 2003 at Islamabad and his burial at the Abdullah Shah Ghazi mausoleum in Karachi, states that his spiritual lineage (shajara-e-tariqat) runs to Ahmed Raza Khan Qadri, and records his leadership of Jamiat Ulema-e-Pakistan and the Muttahida Majlis-e-Amal, while naming no school for him in its prose."
  es: "El artículo de Wikipedia en urdu sobre Shah Ahmad Noorani (1926-2003), que indica su nacimiento el 1 de abril de 1926 en Meerut, su muerte el 11 de diciembre de 2003 en Islamabad y su entierro en el mausoleo de Abdullah Shah Ghazi en Karachi, afirma que su linaje espiritual (shajara-e-tariqat) se remonta a Ahmed Raza Khan Qadri y registra su liderazgo de Jamiat Ulema-e-Pakistan y Muttahida Majlis-e-Amal, aunque no menciona ninguna escuela en su texto."
  fr: "L'article de Wikipédia en ourdou sur Shah Ahmad Noorani (1926-2003) indique sa naissance le 1er avril 1926 à Meerut, sa mort le 11 décembre 2003 à Islamabad et son inhumation au mausolée d'Abdullah Shah Ghazi à Karachi, précise que sa lignée spirituelle (shajara-e-tariqat) remonte à Ahmed Raza Khan Qadri et relate son rôle de dirigeant de Jamiat Ulema-e-Pakistan et de Muttahida Majlis-e-Amal, sans toutefois mentionner d'école à laquelle il aurait appartenu."
  ur: "شاہ احمد نورانی (1926-2003) پر اردو ویکیپیڈیا مضمون؛ اس میں ان کی پیدائش 1 اپریل 1926 کو میرٹھ میں ہوئی، ان کی وفات 11 دسمبر 2003 کو اسلام آباد میں ہوئی اور ان کی تدفین کراچی میں عبداللہ شاہ غازی کے مزار میں ہوئی، بیان کیا گیا ہے کہ ان کا روحانی سلسلہ ⁦(شجرہ طریقت)⁩ احمد رضا خان قادری تک جاتا ہے، اور جمعیت علمائے پاکستان، مجلس وحدت مسلمین اور جماعت اسلامی کے لیے ان کی قیادت کا ریکارڈ درج کرتا ہے۔ اس کے نثر میں."
  tr: "Shah Ahmad Noorani (1926–2003) hakkında Urduca Wikipedia makalesi; 1 Nisan 1926'da Meerut'ta doğduğunu, 11 Aralık 2003'te İslamabad'da öldüğünü ve Karaçi'deki Abdullah Şah Ghazi'nin türbesinde defnedilmesini anlatır. Tarikatının ağacının Ahmad Raza Khan Qadri ile Pakistan Ulema Derneği ve Birleşik Çalışma Konseyi liderliğiyle bağlantılı olduğunu belirtir, ancak herhangi bir mezhebin adı verilmez."
  id: "Artikel Wikipedia Urdu tentang Shah Ahmad Noorani (1926–2003); menyebutkan kelahirannya pada 1 April 1926 di Meerut, kematiannya pada 11 Desember 2003 di Islamabad, dan pemakamannya di makam Abdullah Shah Ghazi di Karachi. Artikel tersebut menyebutkan bahwa pohon ordonya terkait dengan Ahmad Raza Khan Qadri dan kepemimpinannya di Pakistan Ulema Association serta United Working Council, tanpa menyebutkan sekte mana pun darinya."
