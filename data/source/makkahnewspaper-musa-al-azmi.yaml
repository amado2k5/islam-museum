label: { en: "Musa al-Azmi — Makkah Newspaper article quoting Al-Lu'lu' al-Maknun" }
summary:
  ar: "مقال في صحيفة مكة ينقل عن كتاب موسى بن راشد العازمي «اللؤلؤ المكنون في سيرة النبي المأمون» ويصفه بأنه «الباحث الكويتي» الذي أمضى سنوات في تأليف سفره عن السيرة النبوية، الصادر عن دار الصميعي في الرياض ⁦(الطبعة الأولى 2013م)⁩."
  en: "A Makkah Newspaper article quoting Musa ibn Rashid al-Azmi's book 'Al-Lu'lu' al-Maknun fi Sirat al-Nabi al-Ma'mun', describing him as 'the Kuwaiti researcher' who spent years composing his volume on the Prophetic biography, published by Dar al-Sumay'i in Riyadh (first edition, 2013)."
  es: "Un artículo del periódico Makkah que cita el libro de Musa ibn Rashid al-Azmi 'Al-Lu'lu' al-Maknun fi Sirat al-Nabi al-Ma'mun', describiéndolo como 'el investigador kuwaití' que pasó años componiendo su volumen sobre la biografía profética."
  fr: "Un article du journal de La Mecque citant le livre de Musa ibn Rashid al-Azmi « Al-Lu'lu » al-Maknun fi Sirat al-Nabi al-Ma'mun », le décrivant comme « le chercheur koweïtien » qui a passé des années à composer son volume sur la biographie prophétique."
  ur: "مکہ کے اخبار کا ایک مضمون موسیٰ بن راشد العجمی کی کتاب 'اللولو' المکنون فی سیرت النبی المامون' کا حوالہ دیتے ہوئے، انہیں 'کویتی محقق' کے طور پر بیان کرتا ہے جس نے سیرت نبوی پر اپنی جلد کی تصنیف کرنے میں برسوں گزارے، جسے دار السمیع 1، 3 میں شائع کیا گیا ہے۔"
  tr: "Mekke gazetesinde yayımlanan bir makalede, Musa bin Raşid El-Azmi'nin \"Peygamber El-Me'mun'un Biyografisindeki Gizli İnci\" adlı kitabından alıntı yapıldığı ve onu Peygamber'in biyografisi üzerine yıllarca yazan \"Kuveytli araştırmacı\" olarak tanımlayan bir makale, Riyad'da Dar Al-Sumai'i tarafından yayımlandı (ilk baskı 2013)."
  id: "Sebuah artikel di surat kabar Makkah mengutip buku Musa bin Rashid Al-Azmi \"Mutiara Tersembunyi dalam Biografi Nabi Al-Ma'mun,\" menggambarkannya sebagai \"peneliti Kuwait\" yang menghabiskan bertahun-tahun menulis bukunya tentang biografi Nabi, yang diterbitkan oleh Dar Al-Sumai'i di Riyadh (edisi pertama 2013)."
