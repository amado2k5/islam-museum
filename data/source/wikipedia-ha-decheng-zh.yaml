reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives him as born in 1888 at Nanzheng in Shaanxi and died on 25 October 1943 at Shadian in Yunnan, a Hui ahong and educator in Qur'anic studies, one of the four great ahongs of modern China with Wang Jingzhai, Ma Songting and Da Pusheng; it attests his hajj of 1913, his founding work for the Chinese Hui Teaching Society and the Shanghai Islamic Normal School in 1928 with Da Pusheng and others, his published translation of the Qur'an's first three volumes, and his last years at Shadian helping 'his student Ma Jian' with the full translation — the attestation behind the student_of edge in Ma Jian's record. It names no school, order or movement for him."
