summary:
  ar: "مقالة ويكيبيديا الصينية عن ها ده تشنغ؛ تُستخدم لوقائع الكيان فقط، وهي مقالته الوحيدة في أي لغة. تروي الأهونغ من شنشي (1888–1943) الملقّب هلال الدين، الذي حجّ سنة 1913، وشارك في تأسيس المدرسة الإسلامية النظامية في شنغهاي سنة 1928، ومات في شاديان وهو يعين تلميذه ما جيان على ترجمة القرآن."
  en: "Chinese Wikipedia article on Ha Decheng; used for entity facts only, and his only article in any language. It recounts the Shaanxi ahong (1888 – 25 October 1943), religious name Hilal al-Din, who performed the hajj in 1913, co-founded the Shanghai Islamic Normal School in 1928, and died at Shadian helping his student Ma Jian translate the Qur'an."
  es: "Artículo de la Wikipedia en chino sobre Ha Decheng; se utiliza únicamente para obtener información sobre la persona y es su único artículo en cualquier idioma. Narra la vida del ahong de Shaanxi (1888-25 de octubre de 1943), cuyo nombre religioso era Hilal al-Din, quien realizó la peregrinación a La Meca en 1913, cofundó la Escuela Normal Islámica de Shanghái en 1928 y falleció en Shadian mientras ayudaba a su alumno Ma Jian a traducir el Corán."
  fr: "Article de Wikipédia en chinois sur Ha Decheng; utilisé uniquement pour les informations le concernant, et c’est le seul article qui lui est consacré, toutes langues confondues. Il relate l’histoire de cet ahong du Shaanxi (1888 – 25 octobre 1943), de nom religieux Hilal al-Din, qui accomplit le hajj en 1913, co-fonde l’École normale islamique de Shanghai en 1928 et meurt à Shadian en aidant son élève Ma Jian à traduire le Coran."
  ur: "Ha Decheng پر چینی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، اور کسی بھی زبان میں اس کا واحد مضمون۔ اس میں شانسی آہونگ ⁦(1888 - 25 اکتوبر 1943)⁩ کا ذکر ہے، مذہبی نام ہلال الدین، جس نے 1913 میں حج کیا، 1928 میں شنگھائی اسلامک نارمل اسکول کی مشترکہ بنیاد رکھی، اور اپنے طالب علم ما جیان کو قرآن کا ترجمہ کرنے میں مدد کرتے ہوئے شادیان میں انتقال کر گئے۔"
