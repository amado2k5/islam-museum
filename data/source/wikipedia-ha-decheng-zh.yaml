  ar: "مقالة ويكيبيديا الصينية عن ها ده تشنغ؛ تُستخدم لوقائع الكيان فقط، وهي مقالته الوحيدة في أي لغة. تروي الأهونغ من شنشي (1888–1943) الملقّب هلال الدين، الذي حجّ سنة 1913، وشارك في تأسيس المدرسة الإسلامية النظامية في شنغهاي سنة 1928، ومات في شاديان وهو يعين تلميذه ما جيان على ترجمة القرآن."
  en: "Chinese Wikipedia article on Ha Decheng; used for entity facts only, and his only article in any language. It recounts the Shaanxi ahong (1888 – 25 October 1943), religious name Hilal al-Din, who performed the hajj in 1913, co-founded the Shanghai Islamic Normal School in 1928, and died at Shadian helping his student Ma Jian translate the Qur'an."
