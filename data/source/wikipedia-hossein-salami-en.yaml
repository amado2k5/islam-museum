  ar: "مقالة ويكيبيديا الإنجليزية عن حسين سلامي ⁦(١٩٦٠ – ١٣ حزيران ٢٠٢٥)⁩، اللواء الإيراني الذي قاد الحرس الثوري من ٢٠١٩ حتى مقتله في غارة إسرائيلية؛ تذكر خدمته في حرب العراق وقياداته الصاروخية والجوية وخطبه والعقوبات عليه ووفاته، ولا يسمي نثرها دينًا للرجل نفسه."
  en: "English Wikipedia article on Hossein Salami (1960 - 13 June 2025), Iranian major general who commanded the Islamic Revolutionary Guard Corps from 2019 until he was killed in an Israeli airstrike; it records his Iran-Iraq War service, his missile and aerospace commands, his speeches, the sanctions on him and his death, and its prose names no faith for the man himself."
