summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسين سلامي ⁦(١٩٦٠ – ١٣ حزيران ٢٠٢٥)⁩، اللواء الإيراني الذي قاد الحرس الثوري من ٢٠١٩ حتى مقتله في غارة إسرائيلية؛ تذكر خدمته في حرب العراق وقياداته الصاروخية والجوية وخطبه والعقوبات عليه ووفاته، ولا يسمي نثرها دينًا للرجل نفسه."
  en: "English Wikipedia article on Hossein Salami (1960 - 13 June 2025), Iranian major general who commanded the Islamic Revolutionary Guard Corps from 2019 until he was killed in an Israeli airstrike; it records his Iran-Iraq War service, his missile and aerospace commands, his speeches, the sanctions on him and his death, and its prose names no faith for the man himself."
  es: "Artículo de la Wikipedia en inglés sobre Hossein Salami (1960 - 13 de junio de 2025), mayor general iraní que comandó el Cuerpo de la Guardia Revolucionaria Islámica desde 2019 hasta que murió en un ataque aéreo israelí; registra su servicio en la guerra Irán-Irak, sus mandos de misiles y aeroespaciales, sus discursos, las sanciones impuestas en su contra y su muerte, y su prosa no menciona ninguna fe para el hombre en sí."
  fr: "L'article de Wikipédia en anglais sur Hossein Salami (1960 - 13 juin 2025), major-général iranien qui a commandé le Corps des gardiens de la révolution islamique de 2019 jusqu'à sa mort lors d'une frappe aérienne israélienne; il relate son service pendant la guerre Iran-Irak, ses commandements de missiles et d'aérospatiale, ses discours, les sanctions qui lui ont été imposées et sa mort, et sa prose ne mentionne aucune religion pour l'homme lui-même."
  ur: "حسین سلامی ⁦(1960 - 13 جون 2025)⁩ پر انگریزی ویکیپیڈیا کا مضمون، ایرانی میجر جنرل جنہوں نے 2019 سے لے کر اسرائیلی فضائی حملے میں مارے جانے تک اسلامی انقلابی گارڈ کور کی کمانڈ کی۔ اس میں اس کی ایران-عراق جنگ کی خدمات، اس کے میزائل اور ایرو اسپیس کمانڈز، اس کی تقاریر، اس پر پابندیاں اور اس کی موت، اور اس کے نثر میں خود اس شخص کے لیے کوئی یقین نہیں ہے۔"
