summary:
  ar: "مقالة ويكيبيديا العربية عن القارئ محمود الشحات أنور؛ لوقائع الكيان فقط: مولده في 10 سبتمبر 1984 بقرية كفر الوزير في ميت غمر، وحفظه القرآن على أبيه الشحات أنور، وقراءته في إذاعة القرآن في لندن؛ تحمل المقالة وسم «ملحوظية ضعيفة» منذ مارس 2026، وتستند إلى صدى البلد والوطن والبوابة نيوز وصوت الأمة."
  en: "Arabic Wikipedia article on the reciter Mahmoud al-Shahat Anwar; entity facts only: birth on 10 September 1984 at Kafr al-Wazir, Mit Ghamr, memorisation under his father al-Shahat Anwar, and recitation on a Qur'an radio in London; the article has carried a weak-notability tag since March 2026 and cites Sada El Balad, El Watan, Al-Bawaba News and Sawt al-Umma."
  es: "Artículo en la Wikipedia en árabe sobre el recitador Mahmoud al-Shahat Anwar; solo datos sobre la persona: nacimiento el 10 de septiembre de 1984 en Kafr al-Wazir, Mit Ghamr, memorización bajo la tutela de su padre al-Shahat Anwar y recitación en una emisora de radio coránica en Londres; el artículo ha tenido una etiqueta de poca relevancia desde marzo de 2026 y cita a Sada El Balad, El Watan, Al-Bawaba News y Sawt al-Umma."
  fr: "Article de Wikipédia en arabe sur le récitant Mahmoud al-Shahat Anwar; informations uniquement sur l’entité: naissance le 10 septembre 1984 à Kafr al-Wazir, Mit Ghamr, mémorisation sous la direction de son père al-Shahat Anwar et récitation sur une radio coranique à Londres; l’article porte une étiquette de notoriété faible depuis mars 2026 et cite Sada El Balad, El Watan, Al-Bawaba News et Sawt al-Umma."
  ur: "قاری محمود الشاہت انور پر عربی ویکیپیڈیا کا مضمون؛ ہستی کے حقائق صرف: 10 ستمبر 1984 کو کفر الوزیر میں پیدائش، میت غمر، اپنے والد الشہد انور کے تحت حفظ، اور لندن میں ایک قرآن ریڈیو پر تلاوت؛ مضمون میں مارچ 2026 سے ایک کمزور قابل ذکر ٹیگ لگا ہوا ہے اور اس میں صدا البلاد، الوطن، البوبہ نیوز اور صوت الامہ کا حوالہ دیا گیا ہے۔"
