summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0639\u0646 \u0627\u0644\u0642\u0627\u0631\u0626 \u0645\u062d\u0645\u0648\u062f \u0627\u0644\u0634\u062d\u0627\u062a \u0623\u0646\u0648\u0631\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a 10 \u0633\u0628\u062a\u0645\u0628\u0631 1984 \u0628\u0642\u0631\u064a\u0629 \u0643\u0641\u0631 \u0627\u0644\u0648\u0632\u064a\u0631 \u0641\u064a \u0645\u064a\u062a \u063a\u0645\u0631\u060c \u0648\u062d\u0641\u0638\u0647 \u0627\u0644\u0642\u0631\u0622\u0646 \u0639\u0644\u0649 \u0623\u0628\u064a\u0647 \u0627\u0644\u0634\u062d\u0627\u062a \u0623\u0646\u0648\u0631\u060c \u0648\u0642\u0631\u0627\u0621\u062a\u0647 \u0641\u064a \u0625\u0630\u0627\u0639\u0629 \u0627\u0644\u0642\u0631\u0622\u0646 \u0641\u064a \u0644\u0646\u062f\u0646\u061b \u062a\u062d\u0645\u0644 \u0627\u0644\u0645\u0642\u0627\u0644\u0629 \u0648\u0633\u0645 \u00ab\u0645\u0644\u062d\u0648\u0638\u064a\u0629 \u0636\u0639\u064a\u0641\u0629\u00bb \u0645\u0646\u0630 \u0645\u0627\u0631\u0633 2026\u060c \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0635\u062f\u0649 \u0627\u0644\u0628\u0644\u062f \u0648\u0627\u0644\u0648\u0637\u0646 \u0648\u0627\u0644\u0628\u0648\u0627\u0628\u0629 \u0646\u064a\u0648\u0632 \u0648\u0635\u0648\u062a \u0627\u0644\u0623\u0645\u0629."
