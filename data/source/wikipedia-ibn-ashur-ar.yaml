summary:
  ar: 'مقالة ويكيبيديا العربية عن محمد الطاهر بن عاشور؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس سنة 1296هـ / 1879 ووفاته في 13 رجب 1393هـ / 12 أغسطس 1973، وتعليمه في الزيتونة وتدريسه فيها، ومناصبه: حاكم بالمجلس المختلط 1909، فقاضٍ مالكي 1911، فشيخ الإسلام المالكي 1932، وأول شيخ لجامعة الزيتونة. المناصب المالكية أوصاف لوظائف خاصة بالمذهب المالكي، لا تسمية لمذهبه الشخصي في متن المقالة.'
  en: 'Arabic Wikipedia article on Muhammad al-Tahir ibn Ashur; used for entity facts only. It gives his birth in Tunis in 1296 AH / 1879 and his death on 13 Rajab 1393 AH / 12 August 1973, his Zaytuna education and teaching, and his offices: judge on the mixed council in 1909, then Maliki qadi in 1911, Maliki Shaykh al-Islam in 1932, and first Shaykh of Zaytuna University. The Maliki offices are rite-specific posts; the article''s text does not name his personal school.'
