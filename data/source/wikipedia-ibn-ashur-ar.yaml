summary:
  ar: 'مقالة ويكيبيديا العربية عن محمد الطاهر بن عاشور؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس سنة 1296هـ / 1879 ووفاته في 13 رجب 1393هـ / 12 أغسطس 1973، وتعليمه في الزيتونة وتدريسه فيها، ومناصبه: حاكم بالمجلس المختلط 1909، فقاضٍ مالكي 1911، فشيخ الإسلام المالكي 1932، وأول شيخ لجامعة الزيتونة. المناصب المالكية أوصاف لوظائف خاصة بالمذهب المالكي، لا تسمية لمذهبه الشخصي في متن المقالة.'
  en: 'Arabic Wikipedia article on Muhammad al-Tahir ibn Ashur; used for entity facts only. It gives his birth in Tunis in 1296 AH / 1879 and his death on 13 Rajab 1393 AH / 12 August 1973, his Zaytuna education and teaching, and his offices: judge on the mixed council in 1909, then Maliki qadi in 1911, Maliki Shaykh al-Islam in 1932, and first Shaykh of Zaytuna University. The Maliki offices are rite-specific posts; the article''s text does not name his personal school.'
  es: "Artículo de Wikipedia en árabe sobre Muhammad al-Tahir ibn Ashur; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Túnez en 1296 AH / 1879 y su fallecimiento el 13 de Rajab de 1393 AH / 12 de agosto de 1973, su educación y enseñanza en Zaytuna, y sus cargos: juez del consejo mixto en 1909, luego cadí malikí en 1911, jeque malikí de al-Islam en 1932 y primer jeque de la Universidad de Zaytuna. Los cargos malikíes son puestos específicos del rito; el texto del artículo no menciona su escuela personal."
  fr: "Article de Wikipédia en arabe sur Muhammad al-Tahir ibn Ashur; utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance à Tunis en 1296 AH / 1879 et sa mort le 13 Rajab 1393 AH / 12 août 1973, sa formation et son enseignement à Zaytuna, ainsi que ses fonctions: juge au conseil mixte en 1909, puis cadi malikite en 1911, cheikh al-Islam malikite en 1932 et premier cheikh de l'université de Zaytuna. Les fonctions malikites sont des postes spécifiques à un rite; le texte de l'article ne mentionne pas son école personnelle."
  ur: "عربی ویکیپیڈیا مضمون محمد الطاہر ابن عاشور پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1296ھ / 1879 میں تیونس میں ان کی پیدائش اور 13 رجب 1393 ہجری / 12 اگست 1973 کو ان کی وفات، ان کی زیتونہ کی تعلیم و تدریس، اور ان کے دفاتر: 1909 میں مخلوط کونسل میں جج، پھر 1911 میں مالکی قاضی، مالکی شیخ الانبیاء 1393، اور شیخ الاسلام جامعہ اول۔ مالکی کے دفاتر رسم و رواج کے لیے مخصوص عہدے ہیں۔ مضمون کے متن میں اس کے ذاتی اسکول کا نام نہیں ہے۔"
