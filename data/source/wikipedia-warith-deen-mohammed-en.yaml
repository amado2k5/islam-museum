  ar: "مقالة ويكيبيديا الإنجليزية عن وارث الدين محمد: خلافته لوالده إلايجا محمد سنة 1975، وتحويله «أمة الإسلام» نحو الإسلام السائد بهدف مواءمة المسلمين الأمريكيين مع الإسلام السني، ورفضه تأليه فارد، وتقديمه أركان الإسلام الخمسة، ووفاته في شيكاغو سنة 2008."
  en: "The English Wikipedia article on Warith Deen Mohammed: his succession to his father Elijah Muhammad in 1975, his transformation of the Nation of Islam toward mainstream Islam with the stated goal of aligning American Muslims with Sunni Islam, his rejection of Fard's deification, his introduction of the Five Pillars, and his death in Chicago in 2008."
