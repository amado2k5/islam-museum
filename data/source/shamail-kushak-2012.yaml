  ar: "الشمائل المحمدية للترمذي ⁦(209–279هـ)⁩، حقق نصوصه وخرج أحاديثه وعلق عليه عبده علي كوشك على أربع نسخ خطية، وقدم له الشيخ عبد القادر الأرناؤوط، الطبعة الخامسة 1433هـ/2012م؛ وفي مقدمته ثبت باثنين وسبعين شرحاً للكتاب وبمختصراته وترجماته."
  en: "Al-Tirmidhi's (209–279 AH) al-Shama'il al-Muhammadiyya, text edited, hadiths traced and annotated by Abduh Ali Kushak on four manuscripts, with a foreword by Shaykh Abd al-Qadir al-Arna'ut, 5th edition 1433/2012; its introduction lists seventy-two commentaries on the book and its abridgements and translations."
