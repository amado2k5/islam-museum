label:
  ar: "الشمائل المحمدية — الترمذي، تحقيق عبده علي كوشك، تقديم عبد القادر الأرناؤوط ⁦(ط5 1433هـ/2012م)⁩"
  en: "al-Shama'il al-Muhammadiyya — al-Tirmidhi, ed. Abduh Ali Kushak, foreword by Abd al-Qadir al-Arna'ut (5th ed. 1433/2012)"
summary:
  ar: "الشمائل المحمدية للترمذي ⁦(209–279هـ)⁩، حقق نصوصه وخرج أحاديثه وعلق عليه عبده علي كوشك على أربع نسخ خطية، وقدم له الشيخ عبد القادر الأرناؤوط، الطبعة الخامسة 1433هـ/2012م؛ وفي مقدمته ثبت باثنين وسبعين شرحاً للكتاب وبمختصراته وترجماته."
  en: "Al-Tirmidhi's (209–279 AH) al-Shama'il al-Muhammadiyya, text edited, hadiths traced and annotated by Abduh Ali Kushak on four manuscripts, with a foreword by Shaykh Abd al-Qadir al-Arna'ut, 5th edition 1433/2012; its introduction lists seventy-two commentaries on the book and its abridgements and translations."
  es: "Al-Shama'il al-Muhammadiyya de Al-Tirmidhi (209–279 AH), texto editado, hadices recopilados y anotados por Abduh Ali Kushak en cuatro manuscritos, con un prólogo del Shaykh Abd al-Qadir al-Arna'ut, 5.ª edición 1433/2012; su introducción enumera setenta y dos comentarios sobre el libro, sus resúmenes y traducciones."
  fr: "Al-Shama'il al-Muhammadiyya d'Al-Tirmidhi (209-279 AH), texte édité, hadiths retracés et annotés par Abduh Ali Kushak sur quatre manuscrits, avec une préface de Shaykh Abd al-Qadir al-Arna'ut, 5e édition 1433/2012; son introduction répertorie soixante-douze commentaires sur le livre et ses abrégés et traductions."
