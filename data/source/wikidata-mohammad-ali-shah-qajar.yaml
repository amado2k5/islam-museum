summary:
  ar: "عنصر ويكيبيانات Q355603 لمحمد علي شاه قاجار: ميلاده 21 يونيو 1872 ووفاته 5 أبريل 1925 ⁦(كلاهما مستورد من ويكيبيديا الإنجليزية)⁩، وأبوه مظفر الدين شاه، ودفنه في مرقد الإمام الحسين، وقيمتان للديانة بلا مرجع: «الإسلام» (Q432) و«التشيع الاثنا عشري» (Q269785)."
  en: "Wikidata item Q355603 for Mohammad Ali Shah Qajar: birth 21 June 1872 and death 5 April 1925 (both imported from the English Wikipedia), father Mozaffar ad-Din Shah, burial at the Imam Husayn Mausoleum, and two unreferenced religion values, Islam (Q432) and Twelver Shiism (Q269785)."
  es: "Elemento de Wikidata Q355603 para Mohammad Ali Shah Qajar: nacimiento el 21 de junio de 1872 y muerte el 5 de abril de 1925 (ambos importados de la Wikipedia en inglés), padre Mozaffar ad-Din Shah, entierro en el Mausoleo del Imam Husayn y dos valores religiosos sin referencia, Islam (Q432) y Chiismo duodecimano (Q269785)."
  fr: "L'élément Wikidata Q355603 pour Mohammad Ali Shah Qajar: naissance le 21 juin 1872 et décès le 5 avril 1925 (tous deux importés de Wikipédia en anglais), père Mozaffar ad-Din Shah, inhumation au mausolée de l'Imam Husayn, et deux valeurs religieuses non référencées, l'islam (Q432) et le chiisme duodécimain (Q269785)."
  ur: "وکی ڈیٹا آئٹم Q355603 برائے محمد علی شاہ قاجار: پیدائش 21 جون 1872 اور وفات 5 اپریل 1925 ⁦(دونوں انگریزی ویکیپیڈیا سے درآمد شدہ)⁩، والد مظفر الدین شاہ، امام حسین کے مزار پر تدفین، اور دو غیر حوالہ شدہ مذہب اقدار، اسلام اور (Q46978)۔"
  tr: "Wikidata öğesi Q355603 Muhammed Ali Şah Kacar: 21 Haziran 1872 doğumlu ve 5 Nisan 1925'te ölmüş (her ikisi de İngilizce Vikipedi'den ithal edilmiştir), babası Muzaffer al-Din Şah, İmam Hüseyin'in türbesinde gömülü ve iki referans verilmeyen dini değer: 'İslam' (Q432) ve 'On İki Dönem Şiiliği' (Q269785)."
  id: "Elemen Wikidata Q355603 Mohammad Ali Shah Qajar: lahir 21 Juni 1872, dan meninggal 5 April 1925 (keduanya diimpor dari Wikipedia bahasa Inggris), ayahnya Muzaffar al-Din Shah, dimakamkan di makam Imam Hussein, dan dua nilai agama yang tidak disebutkan: 'Islam' (Q432) dan 'Syiah Dua Belas' (Q269785)."
