summary:
  ar: "طبعة الفهرست لابن النديم بالمطبعة الرحمانية بمصر لصاحب المكتبة التجارية الكبرى مصطفى محمد، وقد أُضيفت إليها تكملة من المكتبة التيمورية ومقدمة لأحد أساتذة الجامعة المصرية؛ منها المقالة الأولى في أقلام الأمم وخطوطها، والكتب المؤلفة في القراءات واختلاف المصاحف والنقط والشكل."
  en: "The Cairo printing of Ibn al-Nadim's Fihrist from al-Matba'a al-Rahmaniyya for al-Maktaba al-Tijariyya al-Kubra (Mustafa Muhammad), with a supplement from the Taymuriyya library and an introduction by a professor of the Egyptian University; it includes the first discourse on the scripts of the nations, and the lists of books on the readings, on the differences of the mushafs, and on dotting and vowelling."
  ur: "ابن الندیم کی الفہرست کی قاہرہ کی طباعت، المطبعۃ الرحمانیہ، المکتبۃ التجاریۃ الکبریٰ ⁦(مصطفیٰ محمد)⁩ کے لیے؛ ساتھ مکتبہ تیموریہ کا تکملہ اور مصری جامعہ کے ایک استاد کا مقدمہ؛ اس میں اقوام کے خطوط پر پہلا مقالہ اور قراءات، اختلافِ مصاحف اور نقط و شکل پر کتابوں کی فہرستیں ہیں۔"
  es: "Edición cairota del Fihrist de Ibn al-Nadim, procedente de al-Matba'a al-Rahmaniyya para al-Maktaba al-Tijariyya al-Kubra (Mustafa Muhammad), con un suplemento de la biblioteca Taymuriyya y una introducción de un profesor de la Universidad Egipcia; incluye el primer discurso sobre las escrituras de las naciones y las listas de libros sobre las lecturas, sobre las diferencias de los mushafs y sobre la puntuación y la vocalización."
  fr: "L'édition du Caire du Fihrist d'Ibn al-Nadim tiré d'al-Matba'a al-Rahmaniyya pour al-Maktaba al-Tijariyya al-Kubra (Mustafa Muhammad), avec un supplément de la bibliothèque Taymuriyya et une introduction d'un professeur de l'Université égyptienne; elle comprend le premier discours sur les écritures des nations, et les listes de livres sur les lectures, sur les différences des mushafs, et sur la ponctuation et la vocalisation."
  tr: "Mısır'daki Rahmaniyya Matbaası'nda Büyük Ticaret Kütüphanesi'nin sahibi Mustafa Muhammed tarafından İbn al-Nadim'in Al-Fihrist baskısı, Timuri kütüphanesinden ek olarak ve Mısır üniversitesinden bir profesör tarafından bir giriş olarak eklendi; ulusların kalemleri ve yazıları üzerine ilk makale ile Kur'an okumaları, Kur'anların farkları, noktalar ve biçim üzerine kitaplar da dahil."
  id: "Edisi Al-Fihrist oleh Ibn al-Nadim di Rahmaniyya Press di Mesir oleh pemilik Perpustakaan Komersial Besar, Mustafa Muhammad, ditambahkan sebagai suplemen dari perpustakaan Timurid dan pengantar oleh seorang profesor di universitas Mesir; termasuk artikel pertama tentang pena dan aksara bangsa-bangsa, serta buku tentang pembacaan Al-Qur'an, perbedaan Al-Qur'an, titik-titik, dan bentuknya."
title: "الفهرست"
