summary:
  ar: "طبعة الفهرست لابن النديم بالمطبعة الرحمانية بمصر لصاحب المكتبة التجارية الكبرى مصطفى محمد، وقد أُضيفت إليها تكملة من المكتبة التيمورية ومقدمة لأحد أساتذة الجامعة المصرية؛ منها المقالة الأولى في أقلام الأمم وخطوطها، والكتب المؤلفة في القراءات واختلاف المصاحف والنقط والشكل."
  en: "The Cairo printing of Ibn al-Nadim's Fihrist from al-Matba'a al-Rahmaniyya for al-Maktaba al-Tijariyya al-Kubra (Mustafa Muhammad), with a supplement from the Taymuriyya library and an introduction by a professor of the Egyptian University; it includes the first discourse on the scripts of the nations, and the lists of books on the readings, on the differences of the mushafs, and on dotting and vowelling."
  ur: "ابن الندیم کی الفہرست کی قاہرہ کی طباعت، المطبعۃ الرحمانیہ، المکتبۃ التجاریۃ الکبریٰ ⁦(مصطفیٰ محمد)⁩ کے لیے؛ ساتھ مکتبہ تیموریہ کا تکملہ اور مصری جامعہ کے ایک استاد کا مقدمہ؛ اس میں اقوام کے خطوط پر پہلا مقالہ اور قراءات، اختلافِ مصاحف اور نقط و شکل پر کتابوں کی فہرستیں ہیں۔"
title: "الفهرست"
