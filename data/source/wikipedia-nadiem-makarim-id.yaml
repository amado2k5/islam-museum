summary:
  ar: "مقالة ويكيبيديا الإندونيسية المفصلة عن نديم أنور مكارم، المولود في 4 تموز 1984، مؤسس غوجيك؛ تذكر تعليمه المتنقل بين جاكرتا وسنغافورة ودراسته في جامعة براون وهارفارد للأعمال وجوائزه واستجواباته شاهدًا ومتهمًا في قضية أجهزة كروم بوك سنة 2025."
  en: "Detailed Indonesian Wikipedia article on Nadiem Anwar Makarim, born 4 July 1984, founder of Gojek; it records his schooling between Jakarta and Singapore, his studies at Brown and Harvard Business School, his awards, and his 2025 questioning as witness and then suspect in the Chromebook procurement case."
  es: "Artículo detallado de la Wikipedia en indonesio sobre Nadiem Anwar Makarim, nacido el 4 de julio de 1984, fundador de Gojek; en él se recoge su formación académica entre Yakarta y Singapur, sus estudios en Brown y en la Escuela de Negocios de Harvard, sus premios y su interrogatorio en 2025 como testigo y posteriormente como sospechoso en el caso de la adquisición de Chromebooks."
  fr: "Article détaillé de Wikipédia indonésien sur Nadiem Anwar Makarim, né le 4 juillet 1984, fondateur de Gojek; il relate sa scolarité entre Jakarta et Singapour, ses études à Brown et à la Harvard Business School, ses récompenses et son interrogatoire en 2025 en tant que témoin puis suspect dans l'affaire d'acquisition de Chromebooks."
  ur: "ندیم انور مکارم پر تفصیلی انڈونیشی ویکیپیڈیا مضمون، 4 جولائی 1984 کو پیدا ہوئے، گوجیک کے بانی؛ اس میں جکارتہ اور سنگاپور کے درمیان اس کی اسکولنگ، براؤن اور ہارورڈ بزنس اسکول میں اس کی تعلیم، اس کے ایوارڈز، اور اس کی 2025 کی پوچھ گچھ بطور گواہ اور پھر کروم بک پروکیورمنٹ کیس میں مشتبہ ہے۔"
