summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شبانة محمود ⁦(مواليد 1980)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في برمنغهام في 17 سبتمبر 1980، وطفولتها في الطائف (1981-1986)، ودراستها للقانون في كلية لينكولن بأوكسفورد، وعملها محامية، وانتخابها نائبة عن برمنغهام ليديوود سنة 2010 ضمن أوائل النائبات المسلمات، ومنصبَيها وزيرة للعدل والسيد المستشار (2024-2025) ثم وزيرة للداخلية منذ 2025."
  en: "English Wikipedia article on Shabana Mahmood (born 1980); used for entity facts only. It records her birth in Birmingham on 17 September 1980, her childhood in Taif (1981–1986), her law degree at Lincoln College, Oxford, her work as a barrister, her election as MP for Birmingham Ladywood in 2010 as one of the first female Muslim MPs, and her offices as Secretary of State for Justice and Lord Chancellor (2024–2025) and Home Secretary from 2025."
  es: "Artículo de la Wikipedia en inglés sobre Shabana Mahmood (nacida en 1980); utilizado únicamente para datos personales. En él se recoge su nacimiento en Birmingham el 17 de septiembre de 1980, su infancia en Taif (1981-1986), su licenciatura en Derecho en el Lincoln College de Oxford, su trabajo como abogada, su elección como diputada por Birmingham Ladywood en 2010 como una de las primeras mujeres musulmanas en ocupar un cargo parlamentario, y sus cargos como Secretaria de Estado de Justicia y Lord Canciller (2024-2025) y Ministra del Interior desde 2025."
  fr: "Article de Wikipédia en anglais sur Shabana Mahmood (née en 1980); utilisé uniquement pour les informations relatives à l’entité. Il relate sa naissance à Birmingham le 17 septembre 1980, son enfance à Taïf (1981-1986), ses études de droit au Lincoln College d’Oxford, son travail d’avocate, son élection comme députée de Birmingham Ladywood en 2010, faisant d’elle l’une des premières femmes musulmanes à siéger au Parlement, et ses fonctions de secrétaire d’État à la Justice et de lord chancelier (2024-2025) et de ministre de l’Intérieur à partir de 2025."
  ur: "شبانہ محمود پر انگریزی ویکیپیڈیا مضمون ⁦(پیدائش 1980)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 17 ستمبر 1980 کو برمنگھم میں اس کی پیدائش، طائف میں اس کا بچپن (1981–1986)، لنکن کالج، آکسفورڈ میں اس کی قانون کی ڈگری، بیرسٹر کے طور پر اس کا کام، 2010 میں برمنگھم لیڈی ووڈ کے لیے پہلی خاتون مسلم ایم پی کے طور پر اس کا انتخاب، اور اس کے دفاتر بطور سیکریٹری آف اسٹیٹ اور جسٹس 2020-2020 سے ریکارڈ کیے گئے ہیں۔ 2025۔"
