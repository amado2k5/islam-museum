  ar: "مقالة ويكيبيديا الإنجليزية عن شبانة محمود (مواليد 1980)؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في برمنغهام في 17 سبتمبر 1980، وطفولتها في الطائف (1981-1986)، ودراستها للقانون في كلية لينكولن بأوكسفورد، وعملها محامية، وانتخابها نائبة عن برمنغهام ليديوود سنة 2010 ضمن أوائل النائبات المسلمات، ومنصبَيها وزيرة للعدل والسيد المستشار (2024-2025) ثم وزيرة للداخلية منذ 2025."
  en: "English Wikipedia article on Shabana Mahmood (born 1980); used for entity facts only. It records her birth in Birmingham on 17 September 1980, her childhood in Taif (1981–1986), her law degree at Lincoln College, Oxford, her work as a barrister, her election as MP for Birmingham Ladywood in 2010 as one of the first female Muslim MPs, and her offices as Secretary of State for Justice and Lord Chancellor (2024–2025) and Home Secretary from 2025."
