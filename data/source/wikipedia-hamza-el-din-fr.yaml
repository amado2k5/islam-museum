reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A shorter article. It confirms his birth on 10 July 1929 at Toshka near Wadi Halfa and his death at Berkeley on 22 May 2006; electrical engineering at Cairo University; his collecting of Nubian oral heritage before the Aswan High Dam dispersals; Escalay: The Water Wheel — dated here to a 1968 recording, where the English article dates its Nonesuch release to 1971; teaching posts near San Francisco in the 1980s and 1990s; and his contribution, with the Kronos Quartet, of 'The Visitors' to the Babel (2006) soundtrack. The article states no religion for him."
