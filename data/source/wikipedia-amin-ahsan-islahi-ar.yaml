summary:
  ar: "مقالة ويكيبيديا العربية عن أمين أحسن الإصلاحي ⁦(1904–1997م)⁩؛ تذكر أنه التحق بمدرسة الإصلاح سنة 1914 وتخرج فيها سنة 1922 ولزم شيخه عبد الحميد الفراهي واستمر في تلقي التفسير عنه حتى وفاة الفراهي سنة 1930 ثم قرأ الحديث على عبد الرحمن المباركفوري، وعُدّ من مؤسسي الجماعة الإسلامية، وتوفي في لاهور صباح الاثنين 15 شعبان 1418هـ الموافق 15 كانون الأول 1997م؛ ولا تسمّي مذهبًا."
  en: "The Arabic Wikipedia article on Amin Ahsan Islahi (1904–1997); it states that he joined Madrasatul Islah in 1914 and graduated in 1922, kept to his teacher Abd al-Hamid al-Farahi and continued studying tafsir with him until Farahi's death in 1930, then read hadith under Abd al-Rahman al-Mubarakpuri, was named among Jamaat-e-Islami's founders, and died at Lahore on Monday 15 Sha'ban 1418 AH (15 December 1997); it names no school."
  es: "El artículo de Wikipedia en árabe sobre Amin Ahsan Islahi (1904–1997) afirma que ingresó en Madrasatul Islah en 1914 y se graduó en 1922, permaneció con su maestro Abd al-Hamid al-Farahi y continuó estudiando tafsir con él hasta la muerte de Farahi en 1930, luego leyó hadices con Abd al-Rahman al-Mubarakpuri, fue nombrado entre los fundadores de Jamaat-e-Islami y murió en Lahore el lunes 15 de Sha'ban de 1418 AH (15 de diciembre de 1997); no menciona ninguna escuela."
  fr: "L'article de Wikipédia en arabe sur Amin Ahsan Islahi (1904-1997) indique qu'il a rejoint Madrasatul Islah en 1914 et a obtenu son diplôme en 1922, qu'il est resté auprès de son professeur Abd al-Hamid al-Farahi et a continué à étudier le tafsir avec lui jusqu'à la mort de Farahi en 1930, puis a étudié le hadith sous la direction d'Abd al-Rahman al-Mubarakpuri, qu'il a été cité parmi les fondateurs de Jamaat-e-Islami et qu'il est décédé à Lahore le lundi 15 Sha'ban 1418 AH (15 décembre 1997); il ne mentionne aucune école."
  ur: "امین احسن اصلاحی (1904-1997) پر عربی ویکیپیڈیا مضمون؛ اس میں لکھا ہے کہ انہوں نے 1914 میں مدرسۃ الاصلاح میں داخلہ لیا اور 1922 میں فارغ التحصیل ہوئے، اپنے استاد عبد الحامد الفراہی کے پاس رہے اور 1930 میں فراہی کی وفات تک ان کے پاس تفسیر پڑھتے رہے، پھر عبد الرحمن المبارکپوری کے زیر سایہ حدیث پڑھی، پیر کو جماعت اسلامی لاہور میں وفات پائی۔ شعبان 1418ھ ⁦(15 دسمبر 1997)⁩؛ اس میں کسی اسکول کا نام نہیں ہے۔"
