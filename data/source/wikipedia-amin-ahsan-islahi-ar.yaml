summary:
  ar: "مقالة ويكيبيديا العربية عن أمين أحسن الإصلاحي (1904–1997م)؛ تذكر أنه التحق بمدرسة الإصلاح سنة 1914 وتخرج فيها سنة 1922 ولزم شيخه عبد الحميد الفراهي واستمر في تلقي التفسير عنه حتى وفاة الفراهي سنة 1930 ثم قرأ الحديث على عبد الرحمن المباركفوري، وعُدّ من مؤسسي الجماعة الإسلامية، وتوفي في لاهور صباح الاثنين 15 شعبان 1418هـ الموافق 15 كانون الأول 1997م؛ ولا تسمّي مذهبًا."
  en: "The Arabic Wikipedia article on Amin Ahsan Islahi (1904–1997); it states that he joined Madrasatul Islah in 1914 and graduated in 1922, kept to his teacher Abd al-Hamid al-Farahi and continued studying tafsir with him until Farahi's death in 1930, then read hadith under Abd al-Rahman al-Mubarakpuri, was named among Jamaat-e-Islami's founders, and died at Lahore on Monday 15 Sha'ban 1418 AH (15 December 1997); it names no school."
