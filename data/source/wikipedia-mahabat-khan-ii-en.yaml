reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A medium article resting on M. Athar Ali's Encyclopaedia of Islam entry 'Mahabat Khan', Catherine Glynn's Artibus Asiae study and Farah Abidin's Suba of Kabul Under the Mughals. It opens with the disambiguation 'For the subject's father, see Mahabat Khan', gives the son's birth name Mirza Luhrasp and no birth date, his career from Daulatabad in 1633 through the mir bakhshi appointment of February 1651, his inheritance of his father's title in 1652, his Kabul and Gujarat governorships, his criticism of the clergy's political power under Aurangzeb, the scholarly attribution of Peshawar's Mahabat Khan Mosque to him, and his death on 2 January 1675 in the Punjab. It names no faith for him. Checked 1 November 2026."
