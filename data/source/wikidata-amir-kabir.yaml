summary:
  ar: "عنصر ويكيبيانات Q472054 لأمير كبير: قيمتان لميلاده ⁦(سنة 1807 فقط بمراجع استنادية منها بريتانيكا، و9 يناير 1807 مستوردًا من ويكيبيديا الإنجليزية)⁩، وقيمتان لوفاته ⁦(9 يناير 1852 بمرجع بريتانيكا، و10 يناير 1852 مستوردًا من ويكيبيديا الإنجليزية)⁩، وقيمتان للديانة بلا مرجع: «الإسلام» (Q432) و«التشيع الاثنا عشري» (Q269785)."
  en: "Wikidata item Q472054 for Amir Kabir: two birth values (the year 1807 only, with authority references including Britannica, and 9 January 1807, imported from the English Wikipedia), two death values (9 January 1852, referenced to Britannica, and 10 January 1852, imported from the English Wikipedia), and two unreferenced religion values, Islam (Q432) and Twelver Shiism (Q269785)."
  es: "Elemento de Wikidata Q472054 para Amir Kabir: dos valores de nacimiento (solo el año 1807, con referencias de autoridad que incluyen Britannica, y 9 de enero de 1807, importado de la Wikipedia en inglés), dos valores de muerte (9 de enero de 1852, referenciado a Britannica, y 10 de enero de 1852, importado de la Wikipedia en inglés), y dos valores de religión sin referencia, Islam (Q432) y Chiismo duodecimano (Q269785)."
  fr: "L'élément Wikidata Q472054 pour Amir Kabir: deux valeurs de naissance (l'année 1807 seulement, avec des références d'autorité incluant Britannica, et le 9 janvier 1807, importé de Wikipédia en anglais), deux valeurs de décès (le 9 janvier 1852, référencé à Britannica, et le 10 janvier 1852, importé de Wikipédia en anglais), et deux valeurs de religion non référencées, l'islam (Q432) et le chiisme duodécimain (Q269785)."
  ur: "وکی ڈیٹا آئٹم Q472054 امیر کبیر کے لیے: دو پیدائشی اقدار ⁦(صرف سال 1807، اتھارٹی حوالہ جات کے ساتھ، بشمول برٹانیکا، اور 9 جنوری 1807، انگریزی ویکیپیڈیا سے درآمد کیا گیا)⁩، دو موت کی قدریں ⁦(9 جنوری 1852، برٹانیکا کا حوالہ، اور 10 جنوری 1852، مذہب سے دو غیر پورٹ، اور انگریزی ویکیپیڈیا)⁩ اقدار، اسلام (Q432) اور Twelver Shiism (Q269785)۔"
  tr: "Wikidata unsuru büyük bir prens için Q472054: doğumu için iki değer (sadece 1807'de Britannica dahil referanslar içeriyor ve 9 Ocak 1807 tarihinde İngilizce Vikipedi'den ithal edilmiştir), ölümü için iki değer (Britannica'ya göre 9 Ocak 1852 ve İngilizce Vikipedi'den 10 Ocak 1852) ve referanssız din için iki değer: \"İslam\" (Q432) ve \"On İki Yıl Şiiliği\" (Q269785)."
  id: "Elemen Wikidata Q472054 untuk seorang pangeran besar: dua nilai untuk kelahirannya (hanya 1807 dengan referensi termasuk Britannica, dan 9 Januari 1807 diimpor dari Wikipedia bahasa Inggris), dua nilai untuk kematiannya (9 Januari 1852 menurut Britannica, dan 10 Januari 1852 diimpor dari Wikipedia bahasa Inggris), serta dua nilai untuk agama tanpa referensi: \"Islam\" (Q432) dan \"Syiah Dua Belas\" (Q269785)."
