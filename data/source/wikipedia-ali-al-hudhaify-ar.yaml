summary:
  ar: "مقالة ويكيبيديا العربية عن علي الحذيفي؛ تُستخدم لوقائع الكيان فقط. وهي الأوفى: مولده في 1 رجب 1366هـ الموافق 22 مايو 1947 بقرية القرن المستقيم بالعرضة الشمالية، ودراسته وإجازاته، ومناصبه بالجامعة الإسلامية بالمدينة، ومسيرته بالمسجد النبوي ومنها انقطاعا 2017 و2024؛ وصندوقها يعطي عقيدته أهل السنة والجماعة ويترك خانة الفقه فارغة."
  en: "Arabic Wikipedia article on Ali al-Hudhaify; used for entity facts only. The fullest account: birth on 1 Rajab 1366 AH = 22 May 1947 at the village of Al-Qarn Al-Mustaqim in Al-Arda Al-Shamaliya, his studies and ijazat, his university posts at the Islamic University of Madinah, and his career at the Prophet's Mosque including the interruptions of 2017 and 2024; its infobox gives his creed as Ahl al-Sunna wa-l-Jama'a and leaves the fiqh field empty."
