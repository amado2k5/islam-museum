reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The article rests chiefly on Sheikh Abdul Qadir's Famous Urdu Poets and Writers (1947) and The New School of Urdu Literature (1898), on Frances Pritchett's afterword to Mirat-ul-Uroos, and on a 2017 journal biography. CAUTION — birth year: the lead and infobox give 6 December 1833, the body text says he was born in 1831, and the category apparatus files him under 1836 births; the TDV İslâm Ansiklopedisi entry adjudicates for 6 December 1830 and states expressly that the 1833 date is wrong, and the person record follows TDV with the conflict recorded. The article covers his Rehar birth, his Delhi College studies (1846–1853) under Mamluk Ali Nanautawi, his posts as teacher at Kunjah, deputy inspector of schools and (1863) deputy collector, his translations of the Income Tax Act and the Indian Penal Code, the writing and 1869 publication of Mirat-ul-Uroos and its Rs 1,000 prize from Sir William Muir, his Urdu Qur'an translation, his oratory at the Muhammadan Educational Conference, and his works list (Binat-un-Nash; Toba tun Nasoh; Fasana-e-Mubtala 1885; Ibn-ul-Waqt 1888; Ayama 1891; Roya-e-Sadiqa). It names no school for him."
