  ar: "مقالة ويكيبيديا الإنجليزية عن نذير أحمد الدهلوي (ديبتي نذير أحمد)؛ تُستخدم لوقائع الكيان فقط. تذكر وفاته في دلهي في 3 مايو 1912 ومسيرته في التعليم والإدارة ورواياته وترجمته للقرآن إلى الأردية؛ أما سنة مولده فمتنازع عليها داخل المقالة نفسها."
  en: "English Wikipedia article on Nazir Ahmad Dehlvi (Deputy Nazir Ahmad); used for entity facts only. It records his death at Delhi on 3 May 1912, his career in education and the revenue administration, his novels and his Urdu translation of the Qur'an; his birth year is internally inconsistent (lead and infobox 6 December 1833; text 1831; categories 1836)."
