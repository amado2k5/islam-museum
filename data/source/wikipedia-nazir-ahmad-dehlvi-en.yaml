summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نذير أحمد الدهلوي ⁦(ديبتي نذير أحمد)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر وفاته في دلهي في 3 مايو 1912 ومسيرته في التعليم والإدارة ورواياته وترجمته للقرآن إلى الأردية؛ أما سنة مولده فمتنازع عليها داخل المقالة نفسها."
  en: "English Wikipedia article on Nazir Ahmad Dehlvi (Deputy Nazir Ahmad); used for entity facts only. It records his death at Delhi on 3 May 1912, his career in education and the revenue administration, his novels and his Urdu translation of the Qur'an; his birth year is internally inconsistent (lead and infobox 6 December 1833; text 1831; categories 1836)."
  es: "Artículo de la Wikipedia en inglés sobre Nazir Ahmad Dehlvi (Diputado Nazir Ahmad); utilizado únicamente para datos sobre la persona. Registra su fallecimiento en Delhi el 3 de mayo de 1912, su trayectoria en la educación y la administración tributaria, sus novelas y su traducción al urdu del Corán; su año de nacimiento es internamente inconsistente (introducción y ficha informativa: 6 de diciembre de 1833; texto: 1831; categorías: 1836)."
  fr: "Article de Wikipédia en anglais sur Nazir Ahmad Dehlvi (adjoint de Nazir Ahmad); utilisé uniquement pour les informations sur l'entité. Il relate son décès à Delhi le 3 mai 1912, sa carrière dans l'éducation et l'administration fiscale, ses romans et sa traduction du Coran en ourdou; son année de naissance est incohérente (introduction et infobox: 6 décembre 1833; texte: 1831; catégories: 1836)."
  ur: "نذیر احمد دہلوی ⁦(ڈپٹی نذیر احمد)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 3 مئی 1912 کو دہلی میں ان کی موت، تعلیم اور ریونیو ایڈمنسٹریشن میں ان کا کیریئر، ان کے ناول اور قرآن کا اردو ترجمہ درج ہے۔ اس کا سال پیدائش اندرونی طور پر متضاد ہے ⁦(لیڈ اور انفو باکس 6 دسمبر 1833؛ متن 1831؛ زمرہ جات 1836)⁩۔"
  tr: "Nadhir Ahmad Dehlawi (Deepti Nadhir Ahmed) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 3 Mayıs 1912'de Delhi'de ölümü, eğitim, yönetim, roman kariyeri ve Kur'an'ı Urduca'ya çevirmesi bahsedilmektedir; doğum yılı aynı maddede tartışmalıdır."
  id: "Artikel Wikipedia bahasa Inggris tentang Nadhir Ahmad Dehlawi (Deepti Nadhir Ahmed); digunakan hanya untuk fakta entitas tersebut. Kematiannya di Delhi pada 3 Mei 1912, kariernya di bidang pendidikan, administrasi, novel, dan terjemahan Al-Quran ke dalam bahasa Urdu disebutkan; tahun kelahirannya diperdebatkan dalam artikel yang sama."
