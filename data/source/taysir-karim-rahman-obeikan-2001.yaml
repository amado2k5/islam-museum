  en: "Taysir al-Karim al-Rahman fi Tafsir Kalam al-Mannan — Abd al-Rahman ibn Nasir al-Sa'di, ed. Abd al-Rahman ibn Mu'alla al-Luwayhiq (Obeikan, Riyadh, 2001)"
  ur: "تیسیر الکریم الرحمن فی تفسیر کلام المنان — عبد الرحمن بن ناصر السعدی، تحقیق عبد الرحمن بن معلا اللویحق ⁦(مکتبہ العبیکان، ریاض، 2001ء)⁩"
summary:
  ar: "طبعة مكتبة العبيكان بالرياض، الطبعة الأولى 1422هـ/2001م، من تفسير السعدي في مجلد واحد، اعتنى بها تحقيقًا ومقابلة عبد الرحمن بن معلا اللويحق على النسختين الخطيتين، وقدّم لها الشيخان عبد الله بن عبد العزيز بن عقيل ومحمد بن صالح العثيمين، مع كلمة من أبناء المؤلف تعتمد هذه الطبعة."
  en: "The Obeikan (Riyadh) printing, 1st edition 1422 AH / 2001, of al-Sa'di's commentary in one volume, edited and collated against the two manuscripts by Abd al-Rahman ibn Mu'alla al-Luwayhiq, with prefaces by Abd Allah ibn Abd al-Aziz ibn Aqil and Muhammad ibn Salih al-Uthaymin and a note from the author's sons endorsing this edition."
  ur: "مکتبہ العبیکان ریاض کا پہلا ایڈیشن 1422ھ / 2001ء، سعدی کی تفسیر ایک جلد میں، جس کی تحقیق اور دونوں مخطوطات سے مقابلہ عبد الرحمن بن معلا اللویحق نے کیا، اور جس پر عبد اللہ بن عبد العزیز بن عقیل اور محمد بن صالح العثیمین کے مقدمے اور مصنف کے بیٹوں کی طرف سے اس ایڈیشن کی توثیق ہے۔"
