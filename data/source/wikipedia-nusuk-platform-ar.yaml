summary:
  ar: "مقالة ويكيبيديا العربية «منصة نسك»، المراجعة 74490193 ⁦(3 مايو 2026)⁩؛ لوقائع الكيان فقط: إطلاق وزارة الحج والعمرة المنصة في 26 سبتمبر 2022 خلفًا لتطبيق اعتمرنا ضمن برنامج خدمة ضيوف الرحمن، والشراكة مع الهيئة السعودية للسياحة، ومنصة «نسك مسار» في موسم حج 1447هـ."
  en: "Arabic Wikipedia article 'Nusuk platform', revision 74490193 (3 May 2026); entity facts only: the Ministry of Hajj and Umrah's launch of the platform on 26 September 2022 as the successor of the Eatmarna app within the Pilgrim Experience Program, the partnership with the Saudi Tourism Authority, and 'Nusuk Masar' in the Hajj season of 1447 AH."
  ur: "عربی ویکیپیڈیا کا مضمون «منصة نسك»، نظرِ ثانی 74490193 ⁦(3 مئی 2026)⁩؛ صرف ادارے کے حقائق: وزارتِ حج و عمرہ کا 26 ستمبر 2022 کو اعتمرنا ایپ کی جگہ پلیٹ فارم کا آغاز، سعودی ٹورازم اتھارٹی سے شراکت، اور 1447ھ کے حج میں «نسک مسار»۔"
  es: "Artículo de Wikipedia en árabe «Plataforma Nusuk», revisión 74490193 (3 de mayo de 2026); solo datos de la entidad: el lanzamiento de la plataforma por parte del Ministerio de Hajj y Umrah el 26 de septiembre de 2022 como sucesora de la aplicación Eatmarna dentro del Programa de Experiencia del Peregrino, la asociación con la Autoridad de Turismo Saudí y «Nusuk Masar» en la temporada del Hajj de 1447 AH."
  fr: "Article Wikipédia arabe « Plateforme Nusuk », révision 74490193 (3 mai 2026); faits concernant l'entité uniquement: lancement de la plateforme par le ministère du Hajj et de la Omra le 26 septembre 2022 en tant que successeur de l'application Eatmarna dans le cadre du programme Expérience du pèlerin, le partenariat avec l'Autorité saoudienne du tourisme et « Nusuk Masar » pendant la saison du Hajj de 1447 AH."
  tr: "Arapça Vikipedi makalesi \"Nusuk Platformu,\" 74490193 (3 Mayıs 2026) tarihinde incelendi; sadece kuruluş etkinlikleri için: Hac ve Umre Bakanlığı, platformu 26 Eylül 2022'de başlattı; Eatmarna uygulamasının yerine Merhametli Hizmet Misafirleri Programı içinde, Suudi Turizm Otoritesi ile iş birliği içinde ve Hac sezonu 1447H sırasında \"Nusk Masar\" platformunu devraldı."
  id: "Artikel Wikipedia bahasa Arab \"Platform Nusuk,\" ditinjau 74490193 (3 Mei 2026); hanya untuk acara entitas: Kementerian Haji dan Umrah meluncurkan platform ini pada 26 September 2022, menggantikan aplikasi Eatmarna dalam Program Tamu Layanan Penuh Rahmat, bekerja sama dengan Otoritas Pariwisata Saudi, dan platform \"Nusk Masar\" selama musim Haji 1447H."
