summary:
  ar: "مقالة ويكيبيديا العربية «منصة نسك»، المراجعة 74490193 ⁦(3 مايو 2026)⁩؛ لوقائع الكيان فقط: إطلاق وزارة الحج والعمرة المنصة في 26 سبتمبر 2022 خلفًا لتطبيق اعتمرنا ضمن برنامج خدمة ضيوف الرحمن، والشراكة مع الهيئة السعودية للسياحة، ومنصة «نسك مسار» في موسم حج 1447هـ."
  en: "Arabic Wikipedia article 'Nusuk platform', revision 74490193 (3 May 2026); entity facts only: the Ministry of Hajj and Umrah's launch of the platform on 26 September 2022 as the successor of the Eatmarna app within the Pilgrim Experience Program, the partnership with the Saudi Tourism Authority, and 'Nusuk Masar' in the Hajj season of 1447 AH."
  ur: "عربی ویکیپیڈیا کا مضمون «منصة نسك»، نظرِ ثانی 74490193 ⁦(3 مئی 2026)⁩؛ صرف ادارے کے حقائق: وزارتِ حج و عمرہ کا 26 ستمبر 2022 کو اعتمرنا ایپ کی جگہ پلیٹ فارم کا آغاز، سعودی ٹورازم اتھارٹی سے شراکت، اور 1447ھ کے حج میں «نسک مسار»۔"
