reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). Its summary line dates his death about 1784, but its own narrative states that the military faction stayed in control until Sori's death in 1791-1792 and that his son Sa'id then held office until 1797-1798; the conflict is inside the article itself and is stated openly in the museum's record, which builds the date-line year. It gives no birth year at all. It records his cousinship to Karamokho Alfa, his formal succession in 1751, the almami title after the 1776 victory over the Solima, the nine-province organisation, the Fugumba council purge, and — in its own see-also — that Abdul Rahman Ibrahima Sori was one of his sons. It names no legal school or Sufi order for Sori himself. Checked 1 November 2026."
