summary:
  ar: "رابط «الصحاح ⁦(تاج اللغة وصحاح العربية)⁩» في المكتبة الشاملة كما ورد في ملخص بحثي قُدّم إلى المتحف؛ لم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص دون إعادة تحقق في 21 نوفمبر 2026، في موضوع: وجود الكتاب في المكتبة الشاملة."
  en: "The link for al-Sihah (Taj al-Lugha wa Sihah al-Arabiyya) in the Shamela library, as listed in a research summary supplied to the museum; the museum did not open the page, and the founder approved using the summary without re-verification on 21 November 2026, for the work's presence in the Shamela library."
  ur: "«الصحاح ⁦(تاج اللغۃ و صحاح العربیہ)⁩» کا المکتبۃ الشاملہ میں لنک، جیسا عجائب گھر کو دیے گئے ایک تحقیقی خلاصے میں مذکور ہے؛ عجائب گھر نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصے کے استعمال کی منظوری دی، موضوع: کتاب کی الشاملہ میں موجودگی۔"
  fr: "Le lien de al-Sihah (Taj al-Lugha wa Sihah al-Arabiyya) dans la bibliothèque Shamela, tel que le liste un résumé de recherche remis au musée ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé sans nouvelle vérification le 21 novembre 2026, pour la présence de l'ouvrage dans la bibliothèque Shamela."
  es: "El enlace de al-Sihah (Taj al-Lugha wa Sihah al-Arabiyya) en la biblioteca Shamela, tal como lo lista un resumen de investigación entregado al museo; el museo no abrió la página, y el fundador aprobó usar el resumen sin nueva verificación el 21 de noviembre de 2026, para la presencia de la obra en la biblioteca Shamela."
