summary:
  ar: "دراسة أكاديمية إندونيسية (2025) تصف يوفيد بأنها منصة إعلامية تابعة للتيار السلفي في إندونيسيا تأسست سنة 2009، وتدير قنوات يوفيد تي في ويوفيد إيدو ويوفيد كيدز ويتجاوز مجموع متابعيها 6.7 ملايين مشترك."
  en: "An Indonesian academic study (2025) describing Yufid as an online media platform affiliated with the Salafi movement in Indonesia, founded in 2009, running the Yufid.TV, Yufid EDU and Yufid Kids channels with more than 6.7 million subscribers in total."
  es: "Un estudio académico indonesio (2025) describe a Yufid como una plataforma de medios en línea afiliada al movimiento salafista en Indonesia, fundada en 2009, que gestiona los canales Yufid.TV, Yufid EDU y Yufid Kids con más de 6,7 millones de suscriptores en total."
  fr: "Une étude universitaire indonésienne (2025) décrit Yufid comme une plateforme médiatique en ligne affiliée au mouvement salafiste en Indonésie, fondée en 2009, exploitant les chaînes Yufid.TV, Yufid EDU et Yufid Kids avec plus de 6,7 millions d'abonnés au total."
