summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عيسى نجاتي ⁦(ت. 1509)⁩، أول شاعر غنائي عظيم في الأدب التركي العثماني؛ تقول إنه وُلد عبدًا في أدرنة واشترى حريته، وخدم كاتبًا في ديوان محمد الثاني ثم للأميرين عبد الله ومحمود، ومات في القسطنطينية في 17 آذار 1509؛ ولا تذكر تاريخ ميلاده."
  en: "English Wikipedia article on İsa Necati (d. 1509), the first great lyric poet of Ottoman Turkish literature; it says he was born a slave at Edirne and bought his freedom, served as a divan secretary under Mehmed II and then Princes Abdullah and Mahmud, and died at Constantinople on 17 March 1509; it gives no birth date."
  es: "Artículo de la Wikipedia en inglés sobre İsa Necati (fallecido en 1509), el primer gran poeta lírico de la literatura turca otomana; dice que nació esclavo en Edirne y compró su libertad, sirvió como secretario del diván bajo Mehmed II y luego bajo los príncipes Abdullah y Mahmud, y murió en Constantinopla el 17 de marzo de 1509; no proporciona fecha de nacimiento."
  fr: "L'article de Wikipédia en anglais sur İsa Necati (mort en 1509), le premier grand poète lyrique de la littérature turque ottomane, indique qu'il est né esclave à Edirne, a racheté sa liberté, a servi comme secrétaire du divan sous Mehmed II puis sous les princes Abdullah et Mahmud, et est mort à Constantinople le 17 mars 1509; il ne donne aucune date de naissance."
  ur: "عثمانی ترک ادب کے پہلے عظیم شاعر عیسیٰ نیکاتی ⁦(متوفی 1509)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ اس کا کہنا ہے کہ وہ ایڈرن میں ایک غلام پیدا ہوا تھا اور اس نے اپنی آزادی خریدی تھی، محمد دوم اور پھر شہزادوں عبداللہ اور محمود کے تحت دیوان سیکرٹری کے طور پر خدمات انجام دیں، اور 17 مارچ 1509 کو قسطنطنیہ میں انتقال کر گئے؛ یہ کوئی تاریخ پیدائش نہیں دیتا."
