reliability_note: "Article read in full on 1 November 2026 at the recorded revision (fetched live from the MediaWiki API). It is a translation-line descendant of the older Encyclopaedia Britannica/Gibb tradition on Necati. Used for entity facts only: the Edirne birth, the career as divan katib, the refusal of office after Prince Mahmud's death, and the death date of 17 March 1509. It notes that his names İsa and Necati suggest a non-Muslim, non-Turkish ancestry which the contemporary tezkire writers do not mention; it names no religion or school for him."
