  ar: "مقالة ويكيبيديا الإنجليزية عن عيسى نجاتي (ت. 1509)، أول شاعر غنائي عظيم في الأدب التركي العثماني؛ تقول إنه وُلد عبدًا في أدرنة واشترى حريته، وخدم كاتبًا في ديوان محمد الثاني ثم للأميرين عبد الله ومحمود، ومات في القسطنطينية في 17 آذار 1509؛ ولا تذكر تاريخ ميلاده."
  en: "English Wikipedia article on İsa Necati (d. 1509), the first great lyric poet of Ottoman Turkish literature; it says he was born a slave at Edirne and bought his freedom, served as a divan secretary under Mehmed II and then Princes Abdullah and Mahmud, and died at Constantinople on 17 March 1509; it gives no birth date."
