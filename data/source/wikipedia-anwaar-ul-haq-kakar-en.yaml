summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أنوار الحق كاكر؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 15 مايو 1971 في مسلم باغ ببلوشستان، وتعليمه، وعمله متحدثاً باسم حكومة بلوشستان، وتأسيسه حزب عوامي بلوشستان، وعضويته في مجلس الشيوخ، ورئاسته المؤقتة للوزراء من 14 أغسطس 2023 إلى 4 مارس 2024، والجدل حول حكومته المؤقتة. لا تذكر المقالة أي دين له في النص أو في صندوق المعلومات."
  en: "English Wikipedia article on Anwaar-ul-Haq Kakar; used for entity facts only. It recounts his birth on 15 May 1971 at Muslim Bagh, Balochistan, his education, his service as spokesperson of the Balochistan government, his co-founding of the Balochistan Awami Party, his Senate terms, his caretaker premiership from 14 August 2023 to 4 March 2024, and the controversies of his caretaker government. The article names no religion for him, in text or infobox."
  ur: "انوار الحق کاکڑ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 15 مئی 1971ء کو مسلم باغ، بلوچستان میں ان کی پیدائش، ان کی تعلیم، حکومت بلوچستان کے ترجمان کی حیثیت سے خدمات، بلوچستان عوامی پارٹی کی تاسیس میں ان کا حصہ، ان کی سینیٹ رکنیت، 14 اگست 2023ء سے 4 مارچ 2024ء تک ان کی نگران وزارت عظمیٰ اور ان کی نگران حکومت کے تنازعات بیان ہوئے ہیں۔ مضمون میں متن یا معلوماتی خانے میں ان کا کوئی مذہب درج نہیں۔"
