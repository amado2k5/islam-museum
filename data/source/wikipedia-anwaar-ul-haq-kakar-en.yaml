summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أنوار الحق كاكر؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 15 مايو 1971 في مسلم باغ ببلوشستان، وتعليمه، وعمله متحدثاً باسم حكومة بلوشستان، وتأسيسه حزب عوامي بلوشستان، وعضويته في مجلس الشيوخ، ورئاسته المؤقتة للوزراء من 14 أغسطس 2023 إلى 4 مارس 2024، والجدل حول حكومته المؤقتة. لا تذكر المقالة أي دين له في النص أو في صندوق المعلومات."
  en: "English Wikipedia article on Anwaar-ul-Haq Kakar; used for entity facts only. It recounts his birth on 15 May 1971 at Muslim Bagh, Balochistan, his education, his service as spokesperson of the Balochistan government, his co-founding of the Balochistan Awami Party, his Senate terms, his caretaker premiership from 14 August 2023 to 4 March 2024, and the controversies of his caretaker government. The article names no religion for him, in text or infobox."
  ur: "انوار الحق کاکڑ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 15 مئی 1971ء کو مسلم باغ، بلوچستان میں ان کی پیدائش، ان کی تعلیم، حکومت بلوچستان کے ترجمان کی حیثیت سے خدمات، بلوچستان عوامی پارٹی کی تاسیس میں ان کا حصہ، ان کی سینیٹ رکنیت، 14 اگست 2023ء سے 4 مارچ 2024ء تک ان کی نگران وزارت عظمیٰ اور ان کی نگران حکومت کے تنازعات بیان ہوئے ہیں۔ مضمون میں متن یا معلوماتی خانے میں ان کا کوئی مذہب درج نہیں۔"
  es: "Artículo de la Wikipedia en inglés sobre Anwaar-ul-Haq Kakar; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 15 de mayo de 1971 en Muslim Bagh, Baluchistán, su educación, su servicio como portavoz del gobierno de Baluchistán, su cofundación del Partido Awami de Baluchistán, sus mandatos en el Senado, su gobierno interino desde el 14 de agosto de 2023 hasta el 4 de marzo de 2024, y las controversias de su gobierno interino. El artículo no menciona su religión, ni en el texto ni en el recuadro informativo."
  fr: "Article de Wikipédia en anglais sur Anwaar-ul-Haq Kakar; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance le 15 mai 1971 à Muslim Bagh, au Baloutchistan, ses études, son mandat de porte-parole du gouvernement du Baloutchistan, sa cofondation du Parti Awami du Baloutchistan, ses mandats au Sénat, son intérim à la tête du gouvernement du 14 août 2023 au 4 mars 2024, ainsi que les controverses liées à ce gouvernement. L'article ne mentionne pas sa religion, ni dans le texte ni dans l'encadré."
  tr: "Anwar-ul-Haq Kakir hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 15 Mayıs 1971'de Muslimbagh, Belucistan'da doğduğunu, eğitimini, Belucistan hükümetinin sözcüsü olarak çalışmalarını, Belucistan Awami Partisi'ni kurmasını, Senato üyeliğini, 14 Ağustos 2023'ten 4 Mart 2024'e kadar geçici bakanlar başkanlığını ve geçici hükümetiyle ilgili tartışmaları anlatmaktadır. Makalede ne de bilgi kutusunda dininden herhangi bir bahsedilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Anwar-ul-Haq Kakir; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 15 Mei 1971 di Muslimbagh, Balochistan, pendidikannya, pekerjaannya sebagai juru bicara pemerintah Balochistan, pendirian Partai Awami Balochistan, keanggotaannya di Senat, masa jabatan menteri sementara dari 14 Agustus 2023 hingga 4 Maret 2024, dan kontroversi seputar pemerintahan sementaranya. Artikel tersebut tidak menyebutkan agamanya dalam teks maupun dalam kotak info."
