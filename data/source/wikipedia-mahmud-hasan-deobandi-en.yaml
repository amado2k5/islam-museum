summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمود حسن الديوبندي (شيخ الهند)؛ تُستخدم لوقائع الكيان فقط. توثّق أنه أول طالب في دار العلوم ديوبند، وصدر المدرّسين فيها (1890-1915)، وصاحب حركة الرسائل الحريرية وسجين مالطة، ومن مؤسسي الجامعة الملية الإسلامية، وأن وفاته كانت في دلهي في 30 نوفمبر 1920."
  en: "English Wikipedia article on Mahmud Hasan Deobandi (Shaykh al-Hind); used for entity facts only. It records that he was the first student of Darul Uloom Deoband, its principal (1890–1915), leader of the Silk Letter Movement and a Malta prisoner, a co-founder of Jamia Millia Islamia, and that he died at Delhi on 30 November 1920."
