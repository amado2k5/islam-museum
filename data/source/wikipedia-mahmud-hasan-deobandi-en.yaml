reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 24 October 2026. The article is rated a Good Article and rests on the scholarly biographies (Adrawi 2012; Rizwi, History of the Dar al-Ulum Deoband, 1980–81; Tayyab, Aligarh Muslim University thesis, 1990; Deobandi 2013; Metcalf 2009). It covers his birth at Bareilly in 1851 into the Usmani family of Deoband, his teachers (Mahtab Ali, Mahmud Deobandi, Muhammad Qasim Nanawtawi), his graduation in 1872 and turban of honour in 1873, his teaching post and principalship at Darul Uloom Deoband, the organisations he founded (Thamratut-Tarbiyat 1878, Jamiatul Ansar 1909, Nizaratul Maarif 1913), the Silk Letter Movement, his 1915 journey to the Hejaz, his arrest by Sharif Husayn in December 1916 and imprisonment in Fort Verdala, Malta, his release in May 1920, the title Shaykh al-Hind, his fatwa supporting the Non-cooperation movement, the founding of Jamia Millia Islamia (29 October 1920), his presidency of the Jamiat Ulema-e-Hind in November 1920, his death at Delhi on 30 November 1920 and burial in the Qasmi cemetery at Deoband, and his works (the Urdu translation of the Qur'an completed by Shabbir Ahmad Usmani as Tafsir-e-Usmani; Adilla-e-Kamilah; Izah al-Adillah; Ahsan al-Qira; Juhd al-Muqill; his copyediting of Sunan Abu Dawud). Its religious-biography infobox records him as: denomination Sunni, jurisprudence Hanafi, movement Deobandi, tariqa Chishtiyya–Sabiriyya–Imdadiyya, authorised in Sufism by Imdadullah Muhajir Makki and Rashid Ahmad Gangohi — one of the three language editions whose infoboxes name the Sunni school and the Hanafi madhhab for him; the article's own apparatus (Hanafi and Maturidi navboxes and categories) also files him among Maturidis."
