reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth at Gelgel, Bali in 1660, his enslavement at seven, imprisonment at twenty over Suzanne, his VOC lieutenant service in 1683, the defeat of Kuffeler at the Cikalong river on 28 January 1684, the killing of Captain Tack at Kartasura in February 1686, his self-elevation as bupati of Pasuruan with the title Tumenggung Wiranegara, and his death at the Bangil fort on 17 October 1706 — a day reading that differs from the English and Arabic articles — adding that his death was concealed on his own instruction and his grave later found, exhumed and burned in 1707. It names no religion, school or order for the man himself. Checked 1 November 2026."
