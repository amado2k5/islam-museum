label:
  ar: "سير أعلام النبلاء — الذهبي ⁦(طبعة الرسالة)⁩"
  en: "Siyar A'lam al-Nubala' — al-Dhahabi (Dar al-Risala al-Alamiyya edition)"
summary:
  ar: "سير أعلام النبلاء لشمس الدين الذهبي ⁦(ت 748هـ)⁩ في تحقيق شعيب الأرنؤوط وإخوته، طبعة الرسالة؛ تُشير الإحالات إلى رقم الجزء ثم الصفحة المطبوعة ⁦(مثل 17/97)⁩."
  en: "Al-Dhahabi's (d. 748 AH) biographical dictionary in the Shu'ayb al-Arna'ut edition (Dar al-Risala al-'Alamiyya); citations give volume then printed page (e.g. 17/97). Read through Apple Vision OCR of a local scan."
  es: "Diccionario biográfico de Al-Dhahabi (fallecido en 748 AH) en la edición Shu'ayb al-Arna'ut (Dar al-Risala al-'Alamiyya); las citas indican el volumen y luego la página impresa (por ejemplo, 17/97). Leído mediante OCR de Apple Vision a partir de un escaneo local."
  fr: "Dictionnaire biographique d'Al-Dhahabi (mort en 748 AH) dans l'édition Shu'ayb al-Arna'ut (Dar al-Risala al-'Alamiyya); les références indiquent le volume puis la page imprimée (ex.: 17/97). Lecture effectuée par reconnaissance optique de caractères (OCR) Apple Vision à partir d'une numérisation locale."
  ur: "الذہبی کی ⁦(متوفی 748ھ)⁩ سوانحی لغت شعیب الارناوت ایڈیشن میں ⁦(دار الرسالہ العالمیہ)⁩؛ حوالہ جات حجم پھر پرنٹ شدہ صفحہ دیتے ہیں ⁦(مثلاً 17/97)⁩۔ مقامی اسکین کے Apple Vision OCR کے ذریعے پڑھیں۔"
  tr: "Shams al-Din al-Dhahabi (ö. 748 Hicri) tarafından Shu'ayb al-Arna'ut wa his brothers baskısının doğrulanmasında Siyar A'lam al-Nubala' adlı eser, kaynak cilt numarasını ve ardından basılı sayfayı (örneğin 17/97) belirtir."
  id: "Siyar A'lam al-Nubala' oleh Shams al-Din al-Dhahabi (wafat 748 H) dalam verifikasi Shu'ayb al-Arna'ut wa saudara-saudaranya, edisi Al-Ritosa; referensi menunjukkan nomor volume dan kemudian halaman cetak (seperti 17/97)."
title: "سير أعلام النبلاء"
