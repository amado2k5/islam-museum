reliability_note: "Classical Sunni biographical dictionary. Page and volume numbers are the printed ones visible in the OCR footer ⁦(e.g. 'سير أعلام النبلاء ج ١٧')⁩; names and diacritics were read through OCR and need checking against the page image in doubtful cases."
