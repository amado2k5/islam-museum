summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن عبد الكريم أمر الله؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في الميلاد والوفاة ودراسته على أحمد الخطيب المنكباوي، وتفصّل مدارس طوالب التي أسسها ونفيه إلى سوكابومي وسيانجور، وتجعل دينه في صندوقها «الإسلام» مع حقل مذهب فارغ."
  en: "Indonesian Wikipedia article on Abdul Karim Amrullah; used for entity facts only. It agrees with the English article on his birth, death and his study under Ahmad Khatib al-Minangkabawi, details the Thawalib schools he founded and his exile to Sukabumi and Cianjur, and gives his religion in its infobox as Islam with the school field left empty."
  es: "Artículo de la Wikipedia en indonesio sobre Abdul Karim Amrullah; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento, muerte y estudios con Ahmad Khatib al-Minangkabawi, detalla las escuelas Thawalib que fundó y su exilio a Sukabumi y Cianjur, e indica en su ficha informativa que su religión es el islam, dejando el campo de la escuela en blanco."
  fr: "Article de Wikipédia indonésien sur Abdul Karim Amrullah; utilisé uniquement pour les informations relatives à l'entité. Il concorde avec l'article anglais concernant sa naissance, sa mort et ses études auprès d'Ahmad Khatib al-Minangkabawi, détaille les écoles Thawalib qu'il a fondées et son exil à Sukabumi et Cianjur, et indique sa religion comme étant l'islam dans son infobox, le champ relatif aux écoles restant vide."
  ur: "عبدالکریم امر اللہ پر انڈونیشیائی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش، موت اور احمد خطیب المننگکابوی کے زیر مطالعہ ان کے مطالعہ کے انگریزی مضمون سے متفق ہے، اس کے قائم کردہ ثوالیب اسکولوں اور سوکابومی اور سیانجور میں اس کی جلاوطنی کی تفصیلات بیان کرتا ہے، اور اپنے معلوماتی خانے میں اپنے مذہب کو اسلام کے طور پر دیتا ہے جس میں اسکول کا میدان خالی رہ گیا ہے۔"
