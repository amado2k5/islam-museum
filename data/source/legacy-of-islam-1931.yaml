reliability_note: "Downloaded as the Internet Archive scan (full OCR text layer; Digital Library of India copy) to sources/jobs-p2-harvest-5/2015.462838.The-Legacy_djvu.txt on 16 Nov 2026. Read: Kramers, Geography and Commerce pp. 84-93 (al-Khwarizmi's adaptation of Ptolemy and al-Ma'mun's 'image of the earth'; the Books of Roads and Kingdoms; the Balkhi school maps; al-Idrisi's seventy maps for Roger II; Sanuto's borrowed world-map); Christie, Islamic Minor Arts pp. 114-115 (the astrolabe's passage to Europe, prayer-time and qibla use, the dated astrolabes of Isfahan 984, Toledo 1066-7 and Persia 1715); Carra de Vaux, Astronomy and Mathematics pp. 380-381 (al-Fazari the first Muslim astrolabe-maker, Masha'allah, the Sinjar meridian measurement) and pp. 394-396 (al-Zarqali the instrument-maker and his safiha; the Maragha instruments). Facts are rewritten in the museum's own words; the passages read anchor the citations by printed page. Further read on 16 Nov 2026 for jobs-p2-scholar-2: Guillaume, Philosophy and Theology pp. 239-245 (the 'Arabian philosophy' debate; al-Jahiz on the Greek debt; philosophy called 'wisdom mixed with unbelief'; the thousand-mile student journeys; the Nizamiyya of Baghdad founded by Nizam al-Mulk in 457 AH; the Mustansiriyya of 1234 with four law-schools, a salaried professor over seventy-five students each, a dinar a month per student, library, kitchen, bath and hospital; the ijaza likened to the licentia docendi; al-Azhar's communal quarters and pious benefactions) and pp. 251-257 (al-Kindi 'the first and last philosopher the Arabs produced', born about 850 at Kufa, educated at Basra and Baghdad; the Theology of Aristotle corrected by al-Kindi for Ahmad ibn al-Mu'tasim; al-Shahrastani's list of the falasifa from al-Kindi and Hunayn to Avicenna; al-Farabi the prolific commentator; the philosophers' standing vis-a-vis the theologians). Guillaume's judgements are cited as his, not adopted."
