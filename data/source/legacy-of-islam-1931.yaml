summary:
  ar: "«تراث الإسلام» مجموعة أبحاث حرّرها السير توماس أرنولد وألفرد غيوم ونشرتها مطبعة جامعة أكسفورد عام 1931، يكتب فيها باحثون مختصون عن إسهام الحضارة الإسلامية في أوروبا: الجغرافيا والتجارة عند جي إتش كريمرز، والفنون الصغرى عند إيه إتش كريستي، والفلك والرياضيات عند البارون كارا دو فو — وفيها تاريخ علم الخرائط من خرائط الخوارزمي والبلخي إلى الإدريسي، وصناعة الأسطرلاب من الفزاري وإبراهيم الإصفهاني إلى الزرقالي والصفائح."
  en: "The Legacy of Islam, edited by Sir Thomas Arnold and Alfred Guillaume and published by Oxford University Press in 1931, a collection of essays by specialists on the Islamic contribution to Europe: J. H. Kramers on geography and commerce, A. H. Christie on the minor arts, and Baron Carra de Vaux on astronomy and mathematics — including the history of Islamic map-making from al-Khwarizmi and the Balkhi school to al-Idrisi, and the astrolabe craft from al-Fazari and the Ibrahim family of Isfahan to al-Zarqali's safiha."
  ur: "«میراث اسلام» سر تھامس آرنلڈ اور ایلفریڈ گیوم کی مدیرت میں آکسفورڈ یونیورسٹی پریس سے ۱۹۳۱ء میں شائع شدہ مضامین کا مجموعہ ہے: جے ایچ کریمرز کی جغرافیہ و تجارت، اے ایچ کرسٹی کے فنونِ لطیفہ، اور بیرون کارا دو وو کی فلکیات و ریاضی — جس میں اسلامی نقشہ سازی کی تاریخ خوارزمی اور بلخی مکتب سے الادریسی تک، اور اسطرلاب سازی فزاری اور اصفہان کے ابراہیم خاندان سے زرقالی کی صفیحہ تک بیان ہوئی ہے۔"
