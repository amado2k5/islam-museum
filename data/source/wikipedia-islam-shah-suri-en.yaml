summary:
  ar: "سيرة إسلام شاه سوري (جلال خان)، ثاني سلاطين الأسرة السورية في دلهي، في ويكيبيديا الإنجليزية: اختياره خليفة لأبيه شير شاه سنة 1545 رغم كونه الابن الثاني، وهزيمته أخاه عادل خان، وإحكامه قبضته على النبلاء ومواصلته إصلاحات أبيه الإدارية، ووفاته في 22 تشرين الثاني 1554؛ تعطي المقالة مولده سنة 1507 في دلهي ودينه «الإسلام السني» في صندوق المعلومات."
  en: "English Wikipedia biography of Islam Shah Suri (born Jalal Khan), second Suri sultan of Delhi: chosen over his elder brother Adil Khan on Sher Shah's death in 1545 and crowned on 26 May 1545, his defeat of Adil Khan, his subordination of the nobility and continuation of his father's administrative centralisation, and his death on 22 November 1554. The article gives his birth as 1507 at Delhi; its infobox names his religion as Sunni Islam."
  ur: "اسلام شاہ سوری (جلال خان) کی انگریزی ویکیپیڈیا سوانح: شیر شاہ کے دوسرے صاحبزادے ہونے کے باوجود 1545ء میں جانشین منتخب، عادل خان پر فتح، امراء پر گرفت اور والد کے انتظامی نظام کی توسیع، وفات 22 نومبر 1554ء؛ پیدائش 1507ء دہلی درج ہے۔"
