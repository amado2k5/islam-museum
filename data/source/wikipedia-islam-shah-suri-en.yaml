summary:
  ar: "سيرة إسلام شاه سوري ⁦(جلال خان)⁩، ثاني سلاطين الأسرة السورية في دلهي، في ويكيبيديا الإنجليزية: اختياره خليفة لأبيه شير شاه سنة 1545 رغم كونه الابن الثاني، وهزيمته أخاه عادل خان، وإحكامه قبضته على النبلاء ومواصلته إصلاحات أبيه الإدارية، ووفاته في 22 تشرين الثاني 1554؛ تعطي المقالة مولده سنة 1507 في دلهي ودينه «الإسلام السني» في صندوق المعلومات."
  en: "English Wikipedia biography of Islam Shah Suri (born Jalal Khan), second Suri sultan of Delhi: chosen over his elder brother Adil Khan on Sher Shah's death in 1545 and crowned on 26 May 1545, his defeat of Adil Khan, his subordination of the nobility and continuation of his father's administrative centralisation, and his death on 22 November 1554. The article gives his birth as 1507 at Delhi; its infobox names his religion as Sunni Islam."
  ur: "اسلام شاہ سوری ⁦(جلال خان)⁩ کی انگریزی ویکیپیڈیا سوانح: شیر شاہ کے دوسرے صاحبزادے ہونے کے باوجود 1545ء میں جانشین منتخب، عادل خان پر فتح، امراء پر گرفت اور والد کے انتظامی نظام کی توسیع، وفات 22 نومبر 1554ء؛ پیدائش 1507ء دہلی درج ہے۔"
  es: "Biografía en inglés de Islam Shah Suri (nacido Jalal Khan), segundo sultán Suri de Delhi: elegido en lugar de su hermano mayor Adil Khan tras la muerte de Sher Shah en 1545 y coronado el 26 de mayo de 1545, su victoria sobre Adil Khan, su subordinación de la nobleza y la continuación de la centralización administrativa de su padre, y su muerte el 22 de noviembre de 1554. El artículo indica que nació en 1507 en Delhi; su ficha informativa menciona que profesaba el islam sunita."
  fr: "Biographie d'Islam Shah Suri (né Jalal Khan), deuxième sultan Suri de Delhi, sur Wikipédia en anglais: choisi de préférence à son frère aîné Adil Khan à la mort de Sher Shah en 1545 et couronné le 26 mai 1545, sa victoire sur Adil Khan, la subordination de la noblesse et la poursuite de la centralisation administrative de son père, et sa mort le 22 novembre 1554. L'article indique sa naissance en 1507 à Delhi; son infobox précise qu'il était de religion sunnite."
  tr: "Delhi'deki Suriye hanedanının ikinci sultanı İslam Şah Suri'nin (Celal Han) biyografisi, İngilizce Vikipedi'de: 1545'te babası Şer Şah'ın ikinci oğlu olmasına rağmen halef olarak seçilmesi, kardeşi Adil Han'ı yenmesi, soylular üzerindeki sıkı kontrolü, babasının idari reformlarını sürdürmesi ve 22 Kasım 1554'teki ölümü; makalede 1507'de Delhi'de doğduğu ve bilgi kutusunda dini 'Sünni İslam' olarak verildiği belirtilmektedir."
  id: "Biografi Islam Shah Suri (Jalal Khan), sultan kedua dinasti Suriah di Delhi, di Wikipedia bahasa Inggris: pemilihannya sebagai penerus ayahnya Sher Shah pada tahun 1545 meskipun ia adalah putra kedua, kekalahannya atas saudaranya Adil Khan, cengkeramannya yang semakin erat atas bangsawan, melanjutkan reformasi administrasi ayahnya, dan kematiannya pada 22 November 1554; artikel tersebut menyebutkan kelahirannya pada tahun 1507 di Delhi dan agamanya sebagai 'Islam Sunni' dalam kotak info."
