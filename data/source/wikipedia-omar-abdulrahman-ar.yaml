summary:
  ar: "مقالة ويكيبيديا العربية عن عمر عبد الرحمن؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل وميلاده في 20 سبتمبر 1991 في الرياض ومسيرته مع العين وناديي أخويه، وتقرن سنة ميلاده بسنة 1412 هـ في تصنيفاتها. ولا تذكر ديانته."
  en: "Arabic Wikipedia article on Omar Abdulrahman; used for entity facts only. It gives his full name, his birth on 20 September 1991 in Riyadh and his Al Ain career, and pairs his birth year with 1412 AH in its categories. It makes no statement about his religion."
  es: "Artículo de Wikipedia en árabe sobre Omar Abdulrahman; se utiliza únicamente para obtener información sobre la persona. Menciona su nombre completo, su fecha de nacimiento (20 de septiembre de 1991) en Riad y su trayectoria profesional en Al Ain, y relaciona su año de nacimiento con el año 1412 de la Hégira en sus categorías. No hace ninguna mención a su religión."
  fr: "Article Wikipédia en arabe consacré à Omar Abdulrahman; utilisé uniquement pour les informations relatives à l’entité. Il mentionne son nom complet, sa date de naissance (20 septembre 1991) à Riyad et sa carrière à Al Ain, et associe son année de naissance à 1412 AH dans ses catégories. Il ne fait aucune mention de sa religion."
  ur: "عمر عبدالرحمن پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا پورا نام، ریاض میں ان کی پیدائش 20 ستمبر 1991 اور العین کیرئیر بتایا گیا ہے، اور اس کے زمرے میں اس کے سال پیدائش کو 1412 ہجری کے ساتھ جوڑا گیا ہے۔ اس کے مذہب کے بارے میں کوئی بیان نہیں ہے۔"
