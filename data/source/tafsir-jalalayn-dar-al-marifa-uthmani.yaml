label:
  ar: "تفسير الجلالين بهامش المصحف الشريف بالرسم العثماني، ومعه لباب النقول في أسباب النزول للسيوطي ⁦(دار المعرفة، بيروت)⁩"
  en: "Tafsir al-Jalalayn in the margin of the Mushaf in the Uthmani script, with al-Suyuti's Lubab al-Nuqul fi Asbab al-Nuzul (Dar al-Ma'rifa, Beirut)"
  ur: "رسمِ عثمانی کے مصحف کے حاشیے پر تفسیر الجلالین، ساتھ سیوطی کی لباب النقول فی اسباب النزول (دار المعرفہ، بیروت)"
summary:
  ar: "طبعة دار المعرفة ببيروت من تفسير الجلالين بهامش المصحف بالرسم العثماني، وفي ذيل صفحاتها كتاب «لباب النقول في أسباب النزول» للسيوطي موزعًا على الآيات. لا تحمل الصفحات المقروءة تاريخًا."
  en: "Dar al-Ma'rifa's (Beirut) printing of Tafsir al-Jalalayn in the margin of the Mushaf in the Uthmani script, with al-Suyuti's Lubab al-Nuqul fi Asbab al-Nuzul set at the foot of the pages verse by verse. The pages read carry no date."
  ur: "دار المعرفہ بیروت کا رسمِ عثمانی کے مصحف کے حاشیے پر تفسیر الجلالین کا ایڈیشن، جس کے صفحات کے نیچے سیوطی کی «لباب النقول فی اسباب النزول» آیات کے ساتھ تقسیم ہے۔ پڑھے گئے صفحات پر تاریخ درج نہیں۔"
