summary:
  ar: "عنصر ويكي البيانات Q297065 لأولجايتو: التواريخ والمعرفات والروابط العائلية. يعطي مولده في 24 مارس 1280 ووفاته في 16 ديسمبر 1316 بسلطانية، وأباه أرغون وابنه أبا سعيد وأخاه غازان."
  en: "Wikidata item Q297065 for Öljaitü: dates, identifiers and family links. It gives his birth as 24 March 1280 and his death as 16 December 1316 at Soltaniyeh, his father Arghun, his son Abu Sa'id and his brother Ghazan."
  es: "Wikidata, elemento Q297065, sobre Öljaitü: fechas, identificadores y vínculos familiares. Indica que nació el 24 de marzo de 1280 y falleció el 16 de diciembre de 1316 en Soltaniyeh. Menciona a su padre, Arghun, a su hijo, Abu Sa'id, y a su hermano, Ghazan."
  fr: "L'article Q297065 de Wikidata concernant Öljaitü (dates, identifiants et liens familiaux) indique sa naissance le 24 mars 1280 et son décès le 16 décembre 1316 à Soltaniyeh, ainsi que son père Arghun, son fils Abu Sa'id et son frère Ghazan."
  ur: "وکی ڈیٹا آئٹم Q297065 برائے Öljaitü: تاریخیں، شناخت کنندگان اور خاندانی روابط۔ اس میں ان کی پیدائش 24 مارچ 1280 ہے اور اس کی موت 16 دسمبر 1316 کو سلطانیہ، اس کے والد ارغون، اس کے بیٹے ابو سعید اور اس کے بھائی غزن کی ہے۔"
  tr: "Oljeitu için Wikidata maddesi Q297065: tarihler, tanımlayıcılar ve aile bağları. 24 Mart 1280'de doğdu ve 16 Aralık 1316'da babası Argun, oğlu Abu Saeed ve kardeşi Ghazan ile birlikte Sultania'da öldü."
  id: "Item Wikidata Q297065 untuk Oljeitu: tanggal, pengidentifikasi, dan ikatan keluarga. Ia lahir pada 24 Maret 1280, dan meninggal pada 16 Desember 1316 di Sultania, bersama ayahnya Argun, putranya Abu Saeed, dan saudaranya Ghazan."
