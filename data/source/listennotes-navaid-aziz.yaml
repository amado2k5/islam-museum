reliability_note: "The page of his own lecture podcast on Muslim Central, the platform that carries his channel's audio; consulted 26 October 2026. Its biography — one copied text family that also appears on podcast directories and event pages — states that he was raised in Montreal, where he took a diplome d'etudes collegiales in social sciences at Champlain College; that at the Islamic University of Madinah he completed an associate degree in Arabic and a bachelor's in Islamic Law; that on returning to Canada he taught for AlMaghrib Institute and became its Director of Public Relations, volunteered as Islamic editor of Little Explorers Magazine and worked as a family and youth counsellor; that in 2012 he moved to Calgary to become Director of Religious and Social Services for the Islamic Information Society of Calgary; that in 2015 he became the first Muslim chaplain with the Calgary Police Service and consulted on its ReDirect programme; and that in 2018 he joined the Organization for the Prevention of Violence in Alberta. It gives no birth date and names no legal school for him."
