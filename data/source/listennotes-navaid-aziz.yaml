  ar: "صفحة بودكاست نويد عزيز على منصة مسلم سنترال: نشأ في مونتريال، ودرس في الجامعة الإسلامية بالمدينة المنورة حتى بكالوريوس الشريعة، ودرّس في معهد المغرب، وانتقل سنة 2012 إلى كالغاري مديرًا للخدمات الدينية والاجتماعية، وأصبح سنة 2015 أول قسيس مسلم لدى شرطة كالغاري، وحاضر في أكثر من عشرين بلدًا."
  en: "Podcast page for Navaid Aziz on Muslim Central: raised in Montreal, he studied at the Islamic University of Madinah through a bachelor's in Islamic Law, taught at AlMaghrib Institute, moved to Calgary in 2012 as Director of Religious and Social Services, became the Calgary Police Service's first Muslim chaplain in 2015, and has lectured in over twenty countries."
