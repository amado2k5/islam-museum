summary:
  ar: "البيان الصحفي الرسمي لجائزة نوبل في الكيمياء 1999 إلى أحمد زويل «لإظهاره أنه يمكن بالتقنية الليزرية السريعة رؤية كيفية حركة ذرات الجزيء أثناء التفاعل الكيميائي»، ويشرح طريقة النبض المضخة والكاشفة وأمثلة ICN وNaI والحالات الانتقالية."
  en: "The official press release of the 1999 Nobel Prize in Chemistry to Ahmed Zewail 'for showing that it is possible with rapid laser technique to see how atoms in a molecule move during a chemical reaction'; it explains the pump-probe method and the ICN, NaI and transition-state examples."
  ur: "1999 نوبل کیمسٹری کا سرکاری پریس ریلیز احمد زویل کے لیے «دکھانے پر کہ تیز لیزر تکنیک سے کیمیائی تعامل کے دوران سالمے کے ایٹموں کی حرکت دیکھی جا سکتی ہے»؛ اس میں پمپ-پروب طریقہ اور ICN، NaI اور منتقلی حالت کی مثالیں ہیں۔"
  es: "El comunicado de prensa oficial del Premio Nobel de Química de 1999 otorgado a Ahmed Zewail \"por demostrar que es posible, mediante una técnica láser rápida, observar cómo se mueven los átomos de una molécula durante una reacción química\" explica el método de bombeo-sonda y los ejemplos de ICN, NaI y estado de transición."
  fr: "Le communiqué de presse officiel du prix Nobel de chimie 1999 décerné à Ahmed Zewail « pour avoir démontré qu'il est possible, grâce à une technique laser rapide, d'observer le mouvement des atomes dans une molécule au cours d'une réaction chimique »; il explique la méthode pompe-sonde et donne les exemples de l'ICN, du NaI et de l'état de transition."
  tr: "1999 Nobel Kimya Ödülü'nün resmi basın açıklaması, Ahmed Zewail'e \"hızlı lazer teknolojisiyle molekül atomlarının kimyasal reaksiyonlar sırasında nasıl hareket ettiğini gösterdiği için,\" pompa ve reaktif darbe yöntemini, ICN, NaI ve geçiş durumlarını açıkladı."
  id: "Siaran pers resmi Hadiah Nobel Kimia 1999 kepada Ahmed Zewail, \"atas bukti bahwa dengan teknologi laser cepat memungkinkan untuk melihat bagaimana atom molekul bergerak selama reaksi kimia,\" menjelaskan metode pompa dan pulsa reagen, contoh ICN, NaI, dan keadaan transisi."
