reliability_note: "The awarding body's own release dated 12 October 1999, read in full on 15 November 2026. Gives the prize motivation, the femtosecond definition (10^-15 s), the pump-probe arrangement (strong pump pulse exciting the molecule, weaker probe pulse at a chosen wavelength, variable delay via mirrors, 0.03 mm = 100 fs), the first ICN and NaI experiments, H+CO2 HOCO 1000 fs, C2I2F4 sequential bond breaking, benzene+I2 750 fs, cyclobutane 700 fs intermediate, stilbene cis-trans photoisomerisation, retinal 200 fs and chlorophyll examples, the Arrhenius/van't Hoff/Eyring-Polanyi background, and the biography line (born 1946 Egypt, Alexandria, Pennsylvania PhD 1974, two years Berkeley, Caltech since 1976, Linus Pauling Chair since 1990, Egyptian and American citizen)."
