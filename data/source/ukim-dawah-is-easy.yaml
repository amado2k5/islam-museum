summary:
  ar: "إعلانات مكتب الدعوة والتواصل في البعثة الإسلامية في المملكة المتحدة (UKIM) عن فعاليات تدريب «الدعوة سهلة» في لندن وغلاسكو ومانشستر وبرمنغهام سنة 2025، تقدّم الدكتور فضل الرحمن بأنه صاحب أكثر من 150 ألف مشترك على قناته في يوتيوب ومقدّم هذا التدريب التفاعلي الفريد."
  en: "Announcements by the Dawah & Outreach Office of the UK Islamic Mission (UKIM) for 'Dawah is Easy' training events in London, Glasgow, Manchester and Birmingham in 2025, presenting Dr Fazal Rahman — 'who has over 150,000 subscribers on his YouTube channel' — as the presenter of the interactive training."
  es: "Anuncios de la Oficina de Dawah y Difusión de la Misión Islámica del Reino Unido (UKIM) sobre los eventos de capacitación \"Dawah is Easy\" que se llevarán a cabo en Londres, Glasgow, Manchester y Birmingham en 2025, presentando al Dr. Fazal Rahman, \"quien tiene más de 150.000 suscriptores en su canal de YouTube\", como presentador de la capacitación interactiva."
  fr: "Annonces du Bureau Dawah & Outreach de la Mission islamique du Royaume-Uni (UKIM) concernant les événements de formation « La Dawah est facile » à Londres, Glasgow, Manchester et Birmingham en 2025, présentant le Dr Fazal Rahman — « qui compte plus de 150 000 abonnés sur sa chaîne YouTube » — comme présentateur de la formation interactive."
