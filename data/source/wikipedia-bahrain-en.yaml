summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن البحرين، كما وردت في ملخص بحثي زُوّد به المتحف ولم يفتح المتحف الصفحة: الاسم الرسمي مملكة البحرين، والإحداثيات 26.217 شمالاً و50.583 شرقاً للمنامة، ودولة جزرية ملكية دستورية مستقلة في 14 أغسطس 1971 ومملكة منذ 14 فبراير 2002، وعضويتها في الأمم المتحدة وجامعة الدول العربية ومجلس التعاون الخليجي، واللغة الرسمية العربية."
  en: "English Wikipedia article on Bahrain, as given in a research summary supplied to the museum; the museum did not open the page: the official name Kingdom of Bahrain, the coordinates 26.217 N 50.583 E for Manama, an island country and constitutional monarchy independent on 14 August 1971 and a kingdom since 14 February 2002, its membership of the United Nations, the Arab League and the Gulf Cooperation Council, and Arabic as the official language."
  ur: "بحرین پر انگریزی ویکیپیڈیا کا مضمون، جیسا ایک تحقیقی خلاصے میں ملا جو متحف کو دیا گیا؛ متحف نے صفحہ نہیں کھولا: سرکاری نام مملکت بحرین، منامہ کے نقاط 26.217 شمال اور 50.583 مشرق، 14 اگست 1971 کو آزاد جزیرہ ملک اور آئینی بادشاہت، 14 فروری 2002 سے مملکت، اقوام متحدہ، عرب لیگ اور خلیج تعاون کونسل کی رکنیت، اور سرکاری زبان عربی۔"
  fr: "Article de Wikipédia en anglais sur Bahreïn, tel que donné dans un résumé de recherche fourni au musée ; le musée n'a pas ouvert la page : le nom officiel Royaume de Bahreïn, les coordonnées 26,217 N 50,583 E pour Manama, un pays insulaire et une monarchie constitutionnelle indépendant le 14 août 1971 et royaume depuis le 14 février 2002, son appartenance à l'ONU, à la Ligue arabe et au Conseil de coopération du Golfe, et l'arabe comme langue officielle."
  es: "Artículo de la Wikipedia en inglés sobre Baréin, tal como figura en un resumen de investigación entregado al museo; el museo no abrió la página: el nombre oficial Reino de Baréin, las coordenadas 26,217 N 50,583 E para Manama, un país insular y monarquía constitucional independiente el 14 de agosto de 1971 y reino desde el 14 de febrero de 2002, su pertenencia a la ONU, la Liga Árabe y el Consejo de Cooperación del Golfo, y el árabe como lengua oficial."
