summary:
  ar: "الجزء الأول من «مدارج السالكين بين منازل إياك نعبد وإياك نستعين» لابن قيم الجوزية، ضبط وتحقيق رضوان جامع رضوان، مؤسسة المختار للنشر والتوزيع بالقاهرة، الطبعة الأولى 1422هـ/2001م؛ يبدأ بمقدمة المحقق ثم مقدمة المؤلف وتفسير الفاتحة، ويشرح المنازل من اليقظة إلى الرضا (المنزلة الرابعة والثلاثين)، وفي آخره فهرس الموضوعات."
  en: "Volume 1 of Madarij al-Salikin bayna Manazil Iyyaka Na'budu wa-Iyyaka Nasta'in by Ibn Qayyim al-Jawziyya, edited by Ridwan Jami' Ridwan, Mu'assasat al-Mukhtar, Cairo, 1st ed. 1422 AH / 2001; it opens with the editor's introduction, then the author's introduction and the commentary on al-Fatiha, and explains the stations from awakening to contentment (the thirty-fourth), with a table of contents at the end."
