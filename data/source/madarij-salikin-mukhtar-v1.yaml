label: { ar: "مدارج السالكين لابن قيم الجوزية، الجزء الأول، ضبط وتحقيق رضوان جامع رضوان ⁦(مؤسسة المختار، القاهرة 1422هـ)⁩", en: "Ibn Qayyim al-Jawziyya, Madarij al-Salikin, vol. 1, ed. Ridwan Jami' Ridwan (Mu'assasat al-Mukhtar, Cairo, 1422 AH)" }
summary:
  ar: "الجزء الأول من «مدارج السالكين بين منازل إياك نعبد وإياك نستعين» لابن قيم الجوزية، ضبط وتحقيق رضوان جامع رضوان، مؤسسة المختار للنشر والتوزيع بالقاهرة، الطبعة الأولى 1422هـ/2001م؛ يبدأ بمقدمة المحقق ثم مقدمة المؤلف وتفسير الفاتحة، ويشرح المنازل من اليقظة إلى الرضا ⁦(المنزلة الرابعة والثلاثين)⁩، وفي آخره فهرس الموضوعات."
  en: "Volume 1 of Madarij al-Salikin bayna Manazil Iyyaka Na'budu wa-Iyyaka Nasta'in by Ibn Qayyim al-Jawziyya, edited by Ridwan Jami' Ridwan, Mu'assasat al-Mukhtar, Cairo, 1st ed. 1422 AH / 2001; it opens with the editor's introduction, then the author's introduction and the commentary on al-Fatiha, and explains the stations from awakening to contentment (the thirty-fourth), with a table of contents at the end."
  es: "Volumen 1 de Madarij al-Salikin Bayna Manazil Iyyaka Na'budu wa-Iyyaka Nasta'in de Ibn Qayyim al-Jawziyya, editado por Ridwan Jami' Ridwan, Mu'assasat al-Mukhtar, El Cairo, 1ª ed. 1422AH/2001; Comienza con la introducción del editor, luego la introducción del autor y el comentario sobre al-Fatiha, y explica las estaciones desde el despertar hasta la satisfacción (el trigésimo cuarto), con un índice al final."
  fr: "Volume 1 de Madarij al-Salikin Bayna Manazil Iyyaka Na'budu wa-Iyyaka Nasta'in par Ibn Qayyim al-Jawziyya, édité par Ridwan Jami' Ridwan, Mu'assasat al-Mukhtar, Le Caire, 1ère éd. 1422 AH/2001; Il s'ouvre sur l'introduction de l'éditeur, puis sur l'introduction de l'auteur et le commentaire d'al-Fatiha, et explique les stations de l'éveil au contentement (la trente-quatrième), avec une table des matières à la fin."
  ur: "مدارج السالکین باینا منازل ایاکا نعبدو و ایاکا نستعین کی جلد 1 از ابن قیم الجوزیہ، تدوین رضوان جامع رضوان، معاصص المختار، قاہرہ، پہلا ایڈیشن۔ 1422ھ / 2001; یہ ایڈیٹر کے تعارف کے ساتھ شروع ہوتا ہے، پھر مصنف کا تعارف اور الفاتحہ کی تفسیر، اور بیداری سے لے کر قناعت تک کے اسٹیشنوں کی وضاحت کرتا ہے ⁦(چوتیسواں)⁩، آخر میں مندرجات کی میز کے ساتھ۔"
  tr: "İbn Qayyim al-Jawziyya tarafından yazılmış 'Madarij al-Salikin bayn Manazil Iyyaka Na'bud wa Iyyaka Nasta'in' adlı eserin ilk bölümü, Kahire'deki Al-Mukhtar Yayın ve Dağıtım Vakfı tarafından düzenlenen ve düzenlenen Ridwan Jami' Ridwan tarafından hazırlanmıştır, ilk baskı 1422 Hicri / 2001 M.S.; editörün girişiyle başlar, ardından yazarın girişi ve Al-Fatiha'nın yorumu, uyanıştan tatmine kadar olan aşamaları (otuz dördüncü bölüm) açıklar ve konu diziniyle sona erer."
  id: "Bagian pertama dari 'Madarij al-Salikin bayn Manazil Iyyaka Na'bud wa Iyyaka Nasta'in' oleh Ibn Qayyim al-Jawziyya, disunting dan diedit oleh Ridwan Jami' Ridwan, Yayasan Penerbitan dan Distribusi Al-Mukhtar di Kairo, edisi pertama 1422 H / 2001 M; dimulai dengan pengantar editor, kemudian pengantar penulis dan interpretasi Al-Fatiha, menjelaskan tahapan dari kebangkitan hingga kepuasan (bagian ketiga puluh empat), dan diakhiri dengan indeks topik."
