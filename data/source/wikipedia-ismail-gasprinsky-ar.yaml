summary:
  ar: "بذرة ويكيبيديا العربية عن إسماعيل غسبرينسكي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه مفكر ومعلم وناشر وسياسي قرمي، من أوائل المثقفين المسلمين في الإمبراطورية الروسية الداعين إلى التعليم والإصلاح الثقافي، وتؤرخ له من 20 مارس 1851 إلى 11 سبتمبر 1914 ⁦(وتاريخ الوفاة هذا هو بالتاريخ القديم، مطبوع دون تنبيه)⁩، وتنسب اسمه إلى بلدة غاسبرا في القرم. ولا تسمي مدرسة له."
  en: "Arabic Wikipedia stub on Ismail Gasprinsky; used for entity facts only. It calls him a Crimean thinker, educator, publisher and politician, one of the first Muslim intellectuals of the Russian Empire to call for education and cultural reform, dates him 20 March 1851 – 11 September 1914 (the death date is the Old Style date, printed without being flagged as such), and derives his name from the town of Gaspra in Crimea. It names no school for him."
  es: "Breve entrada en árabe de la Wikipedia sobre Ismail Gasprinsky; se utiliza únicamente para datos biográficos. Lo describe como un pensador, educador, editor y político crimeo, uno de los primeros intelectuales musulmanes del Imperio ruso en abogar por la educación y la reforma cultural. Fecha su fallecimiento entre el 20 de marzo de 1851 y el 11 de septiembre de 1914 (la fecha de defunción corresponde al calendario gregoriano, impreso sin ninguna indicación al respecto) y deriva su nombre de la ciudad de Gaspra, en Crimea. No menciona ninguna escuela en su honor."
  fr: "Ébauche de l'article Wikipédia en arabe sur Ismail Gasprinsky; utilisé uniquement à des fins d'information. Il est présenté comme un penseur, éducateur, éditeur et homme politique de Crimée, l'un des premiers intellectuels musulmans de l'Empire russe à plaider pour une réforme de l'éducation et de la culture. La date de sa naissance est le 20 mars 1851 et sa mort le 11 septembre 1914 (la date de décès est au format ancien, sans indication particulière). Son nom est tiré de la ville de Gaspra, en Crimée. Aucune école ne porte son nom."
  ur: "اسماعیل گیسپرنسکی پر عربی ویکیپیڈیا اسٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے کریمیائی مفکر، معلم، پبلشر اور سیاست دان کہا جاتا ہے، روسی سلطنت کے پہلے مسلمان دانشوروں میں سے ایک جنہوں نے تعلیم اور ثقافتی اصلاحات کا مطالبہ کیا، اس کی تاریخ 20 مارچ 1851 - 11 ستمبر 1914 ہے ⁦(تاریخ موت پرانی طرز کی تاریخ ہے، بغیر جھنڈے کے چھپی ہوئی)⁩، اور گاری ٹاؤن میں اس کے نام سے ماخوذ ہے۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
