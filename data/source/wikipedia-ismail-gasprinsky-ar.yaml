summary:
  ar: "بذرة ويكيبيديا العربية عن إسماعيل غسبرينسكي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه مفكر ومعلم وناشر وسياسي قرمي، من أوائل المثقفين المسلمين في الإمبراطورية الروسية الداعين إلى التعليم والإصلاح الثقافي، وتؤرخ له من 20 مارس 1851 إلى 11 سبتمبر 1914 (وتاريخ الوفاة هذا هو بالتاريخ القديم، مطبوع دون تنبيه)، وتنسب اسمه إلى بلدة غاسبرا في القرم. ولا تسمي مدرسة له."
  en: "Arabic Wikipedia stub on Ismail Gasprinsky; used for entity facts only. It calls him a Crimean thinker, educator, publisher and politician, one of the first Muslim intellectuals of the Russian Empire to call for education and cultural reform, dates him 20 March 1851 – 11 September 1914 (the death date is the Old Style date, printed without being flagged as such), and derives his name from the town of Gaspra in Crimea. It names no school for him."
