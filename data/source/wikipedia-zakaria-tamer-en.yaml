summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زكريا تامر؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 2 يناير 1931 في حي الباشا بدمشق، وبدايته حدّادًا ثم كاتب قصة ومحرّرًا، ودوره في اتحاد الكتاب السوريين وفصله سنة 1980 وانتقاله إلى لندن وجوائزه، وتصنّفه تصنيفاتها في المسلمين السوريين دون أن يسمّي نصّها دينًا أو مذهبًا له."
  en: "English Wikipedia article on Zakaria Tamer; used for entity facts only. It gives his birth on 2 January 1931 in the al-Basha district of Damascus, his start as a blacksmith, his career as a short-story writer and editor, his role in the Syrian Writers Union, his 1980 dismissal and move to London, and his awards. Its categories file him under Syrian Muslims, but its text names no religion or school for him."
  es: "Artículo de la Wikipedia en inglés sobre Zakaria Tamer; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 2 de enero de 1931 en el distrito de al-Basha, en Damasco; sus inicios como herrero; su carrera como escritor y editor de relatos; su papel en la Unión de Escritores Sirios; su despido en 1980 y su traslado a Londres; y sus premios. Si bien lo clasifica dentro de la categoría de musulmanes sirios, el texto no menciona su religión ni su escuela."
  fr: "L'article de Wikipédia en anglais consacré à Zakaria Tamer, utilisé uniquement pour les informations le concernant, mentionne sa naissance le 2 janvier 1931 dans le quartier d'al-Basha à Damas, ses débuts comme forgeron, sa carrière d'écrivain et d'éditeur de nouvelles, son rôle au sein de l'Union des écrivains syriens, son licenciement en 1980 et son installation à Londres, ainsi que les prix qu'il a reçus. Bien que classé parmi les musulmans syriens, le texte ne précise ni sa religion ni son appartenance à une école religieuse."
  ur: "زکریا ٹیمر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 2 جنوری 1931 کو دمشق کے الباشا ضلع میں ان کی پیدائش، ایک لوہار کے طور پر اس کا آغاز، مختصر کہانی کے مصنف اور ایڈیٹر کے طور پر اس کا کیریئر، شامی مصنفین یونین میں اس کا کردار، اس کی 1980 میں برطرفی اور لندن منتقلی، اور اس کے ایوارڈز شامل ہیں۔ اس کے زمرے اسے شامی مسلمانوں کے تحت درج کرتے ہیں، لیکن اس کے متن میں اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
