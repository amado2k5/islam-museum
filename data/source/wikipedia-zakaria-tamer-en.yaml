summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زكريا تامر؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 2 يناير 1931 في حي الباشا بدمشق، وبدايته حدّادًا ثم كاتب قصة ومحرّرًا، ودوره في اتحاد الكتاب السوريين وفصله سنة 1980 وانتقاله إلى لندن وجوائزه، وتصنّفه تصنيفاتها في المسلمين السوريين دون أن يسمّي نصّها دينًا أو مذهبًا له."
  en: "English Wikipedia article on Zakaria Tamer; used for entity facts only. It gives his birth on 2 January 1931 in the al-Basha district of Damascus, his start as a blacksmith, his career as a short-story writer and editor, his role in the Syrian Writers Union, his 1980 dismissal and move to London, and his awards. Its categories file him under Syrian Muslims, but its text names no religion or school for him."
