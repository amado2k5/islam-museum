summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد علي محمد خان، راجا محمود آباد (4 حزيران 1878 – 23 آذار 1931)؛ تُستخدم لوقائع الكيان فقط. هي ترجمة للمقالة الإنجليزية، وتذكر مولده في قرية أمروٹا بضلع سيتابور، وتسمّي المدرسة التي أسسها مدرسةً على النظرية الأهل تشيّع، وتصنّفه في زمرتها ضمن الشخصيات الشيعية الهندية — تصنيف لا شهادة."
  en: "Urdu Wikipedia article on Mohammad Ali Mohammad Khan, Raja of Mahmudabad (4 June 1878 – 23 March 1931); used for entity facts only. It is a translation of the English article — one source family with it — placing his birth at Amrota village in Sitapur district, calling the school he founded a madrasa of the Ahl-e-Tashayyu doctrine, and filing him under Indian Shia personalities — a filing, not an attestation."
