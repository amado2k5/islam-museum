  ar: "مقالة ويكيبيديا العربية عن ميجاواتي سوكارنوبوتري؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط، تؤكد ميلادها في يوغياكارتا ورئاستها 2001–2004 وزيجاتها، وتضيف ما تنقله عن حديثها في حملتها الانتخابية عن مشاورة روح أبيها في منامها."
  en: "Arabic Wikipedia article on Megawati Sukarnoputri; a short article used for entity facts only, confirming her Yogyakarta birth, her 2001–2004 presidency and her marriages, and adding what it reports of her campaign statements about consulting her father's spirit in dreams."
  es: "Artículo en árabe de la Wikipedia sobre Megawati Sukarnoputri; un breve artículo utilizado únicamente para datos sobre la persona, que confirma su nacimiento en Yogyakarta, su presidencia entre 2001 y 2004 y sus matrimonios, y que añade lo que informa sobre sus declaraciones de campaña acerca de consultar el espíritu de su padre en sueños."
  fr: "Article de Wikipédia en arabe sur Megawati Sukarnoputri; un court article servant uniquement à fournir des informations sur l’entité, confirmant sa naissance à Yogyakarta, sa présidence de 2001 à 2004 et ses mariages, et ajoutant ce qui est rapporté de ses déclarations de campagne concernant la consultation de l’esprit de son père en rêve."
  ur: "عربی ویکیپیڈیا مضمون میگاوتی سوکرنپوتری پر؛ ایک مختصر مضمون جو صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، اس کی یوگیکارتا کی پیدائش، اس کی 2001-2004 کی صدارت اور اس کی شادیوں کی تصدیق کرتا ہے، اور اس میں اس کے والد کی روح سے خوابوں میں مشورہ کرنے کے بارے میں اس کے مہم کے بیانات کی رپورٹوں کو شامل کرتا ہے۔"
