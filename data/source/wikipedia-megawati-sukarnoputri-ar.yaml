reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A short article, read in full on 25 October 2026. It confirms her birth at Yogyakarta on 23 January 1947 as Sukarno's second child and first daughter, her presidency from 23 July 2001 to 20 October 2004, her first husband's death in a 1970 plane crash in Irian Jaya, her 1972 marriage to the Egyptian diplomat Hassan Gamal Ahmad Hassan and their separation the same year, and her 1973 marriage to Taufiq Kiemas, with three children. Its one distinctive passage reports that she speaks of consulting her father's spirit in sleep when facing hard decisions, in keeping with Javanese tradition — carried in the person record as this article's report of a personal practice, not as an attestation of any school. The article names no religion or school for her."
