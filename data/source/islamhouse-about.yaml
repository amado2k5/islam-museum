summary:
  ar: "صفحة «مرجعية مجانية للتعريف بالإسلام بلغات العالم» في موقع دار الإسلام كما قُرئت في 7 نوفمبر 2026: موقع دعوي خيري تابع لجمعية الدعوة وتوعية الجاليات بالربوة، وأهدافه، ولغاته، وموسوعاته الثلاث، وجوائزه كما يذكرها."
  en: "IslamHouse's page 'A free reference for introducing Islam in the world's languages' as read on 7 November 2026: a charitable da'wa site of the Da'wa and Community Awareness Society in al-Rabwah, its aims, its languages, its three encyclopedias, and the awards it reports."
