summary:
  ar: "صفحة «مرجعية مجانية للتعريف بالإسلام بلغات العالم» في موقع دار الإسلام كما قُرئت في 7 نوفمبر 2026: موقع دعوي خيري تابع لجمعية الدعوة وتوعية الجاليات بالربوة، وأهدافه، ولغاته، وموسوعاته الثلاث، وجوائزه كما يذكرها."
  en: "IslamHouse's page 'A free reference for introducing Islam in the world's languages' as read on 7 November 2026: a charitable da'wa site of the Da'wa and Community Awareness Society in al-Rabwah, its aims, its languages, its three encyclopedias, and the awards it reports."
  ur: "دار الاسلام کا صفحہ «دنیا کی زبانوں میں اسلام کے تعارف کا مفت مرجع»، 7 نومبر 2026 کو پڑھا گیا: الربوہ کی جمعیۃ الدعوۃ و توعیۃ الجالیات کی خیراتی دعوتی سائٹ، اس کے مقاصد، زبانیں، تین موسوعات اور اس کے بیان کردہ اعزازات۔"
  es: "La página de IslamHouse titulada \"Una referencia gratuita para presentar el Islam en los idiomas del mundo\", leída el 7 de noviembre de 2026, describe un sitio web benéfico de da'wa de la Sociedad de Da'wa y Concienciación Comunitaria en al-Rabwah, sus objetivos, sus idiomas, sus tres enciclopedias y los premios que anuncia."
  fr: "La page d'IslamHouse « Une référence gratuite pour introduire l'islam dans les langues du monde », telle que consultée le 7 novembre 2026: un site de da'wa caritatif de la Da'wa and Community Awareness Society à al-Rabwah, ses objectifs, ses langues, ses trois encyclopédies et les prix qu'il mentionne."
  tr: "Dar Al-Islam web sitesinde 7 Kasım 2026 tarihinde okunduğu şekliyle \"Dünya Dillerinde İslam'ı Tanıtmak İçin Ücretsiz Kaynak\" sayfası: Al-Rabwa'da Da'wah ve Toplum Bilincini Derneği'ne bağlı hayırsever bir Da'wah web sitesi, amaçları, dilleri, üç ansiklopedi ve ödülleri belirtilmiştir."
  id: "Halaman \"Referensi Bebas untuk Memperkenalkan Islam dalam Bahasa-bahasa Dunia\" di situs web Dar Al-Islam seperti yang dibaca pada 7 November 2026: Situs web Da'wah amal yang berafiliasi dengan Asosiasi Da'wah dan Kesadaran Komunitas di Al-Rabwa, tujuan, bahasa, tiga ensiklopedia, dan penghargaan yang disebutkan."
