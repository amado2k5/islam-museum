  ar: "مقالة ويكيبيديا العربية عن فايز السراج؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 20 فبراير 1960 بطرابلس، وبكالوريوسه في العمارة والتخطيط العمراني من جامعة الفاتح (1982) وماجستيره في إدارة الأعمال (1999)، ورئاسته للمجلس الرئاسي وحكومة الوفاق الوطني. لا تذكر المقالة دينه."
  en: "Arabic Wikipedia article on Fayez al-Sarraj; used for entity facts only. It gives his birth on 20 February 1960 at Tripoli, his bachelor's in architecture and urban planning from Al Fateh University (1982) and his MBA (1999), and his chairmanship of the Presidential Council and the Government of National Accord. The article states no religion for him."
