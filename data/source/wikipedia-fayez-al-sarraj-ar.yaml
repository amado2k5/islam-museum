summary:
  ar: "مقالة ويكيبيديا العربية عن فايز السراج؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 20 فبراير 1960 بطرابلس، وبكالوريوسه في العمارة والتخطيط العمراني من جامعة الفاتح (1982) وماجستيره في إدارة الأعمال (1999)، ورئاسته للمجلس الرئاسي وحكومة الوفاق الوطني. لا تذكر المقالة دينه."
  en: "Arabic Wikipedia article on Fayez al-Sarraj; used for entity facts only. It gives his birth on 20 February 1960 at Tripoli, his bachelor's in architecture and urban planning from Al Fateh University (1982) and his MBA (1999), and his chairmanship of the Presidential Council and the Government of National Accord. The article states no religion for him."
  es: "Artículo de Wikipedia en árabe sobre Fayez al-Sarraj; utilizado únicamente para datos biográficos. Indica que nació el 20 de febrero de 1960 en Trípoli, que se licenció en arquitectura y urbanismo por la Universidad Al Fateh (1982) y obtuvo su MBA (1999), y que presidió el Consejo Presidencial y el Gobierno de Acuerdo Nacional. El artículo no menciona ninguna religión para él."
  fr: "Article de Wikipédia en arabe consacré à Fayez al-Sarraj; utilisé uniquement à des fins d'information sur l'entité. Il indique sa naissance le 20 février 1960 à Tripoli, son diplôme de licence en architecture et urbanisme de l'université Al Fateh (1982), son MBA (1999), ainsi que sa présidence du Conseil présidentiel et du Gouvernement d'union nationale. L'article ne mentionne pas sa religion."
  ur: "فیاض السراج پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 20 فروری 1960 کو طرابلس میں ہوئی، اس نے الفتح یونیورسٹی (1982) سے فن تعمیر اور شہری منصوبہ بندی میں بیچلر اور ایم بی اے (1999)، اور صدارتی کونسل اور گورنمنٹ آف نیشنل ایکارڈ کی صدارت کی۔ آرٹیکل اس کے لیے کوئی مذہب نہیں بتاتا۔"
