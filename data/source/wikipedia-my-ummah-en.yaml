summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألبوم «أمتي» لسامي يوسف؛ لوقائع الكيان فقط: تاريخ الإصدار 6 يوليو 2005، والنسختان الموسيقية والإيقاعية، والمدة وقائمة الأغاني، والمبيعات المنسوبة إلى مصادرها، وقراءة كريستيان بوند في مجلة الإعلام العربي والمجتمع."
  en: "English Wikipedia article on Sami Yusuf's album My Ummah; entity facts only: release on 6 July 2005, the music and percussion versions, the length and track list, the sales figures attributed to their sources, and Christian Pond's reading in Arab Media and Society."
  es: "Artículo de la Wikipedia en inglés sobre el álbum My Ummah de Sami Yusuf; solo datos sobre la entidad: lanzamiento el 6 de julio de 2005, las versiones de música y percusión, la duración y la lista de canciones, las cifras de ventas atribuidas a sus fuentes y la lectura de Christian Pond en Arab Media and Society."
  fr: "Article de Wikipédia en anglais sur l'album My Ummah de Sami Yusuf; informations sur l'entité uniquement: sortie le 6 juillet 2005, les versions musicales et percussives, la durée et la liste des titres, les chiffres de vente attribués à leurs sources et la lecture de Christian Pond dans Arab Media and Society."
  ur: "سمیع یوسف کے البم My Ummah پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: 6 جولائی 2005 کو ریلیز، موسیقی اور ٹککر کے ورژن، لمبائی اور ٹریک کی فہرست، ان کے ذرائع سے منسوب فروخت کے اعداد و شمار، اور عرب میڈیا اور سوسائٹی میں کرسچن پونڈ کی پڑھائی۔"
  tr: "Sami Youssef'in \"Ami\" albümü hakkında İngilizce Wikipedia makalesi; sadece varlık için bilgiler: yayın tarihi 6 Temmuz 2005, hem müzikal hem ritmik versiyonlar, süre ve parça listesi, kaynaklarına atfedilen satışlar ve Arab Media and Society dergisinde Christian Bond'un okunması."
  id: "Artikel Wikipedia bahasa Inggris tentang album Sami Youssef \"Ami\"; hanya untuk fakta entitas: tanggal terbit 6 Juli 2005, baik versi musik maupun ritmis, durasi dan daftar lagu, penjualan yang dikaitkan dengan sumbernya, serta membaca Christian Bond di majalah Arab Media and Society."
