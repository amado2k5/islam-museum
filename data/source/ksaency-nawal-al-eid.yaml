summary:
  ar: "مدخل الموسوعة السعودية (ksaency.com) عن نوال العيد؛ يعطي اسمها الكامل نوال عبدالعزيز عبدالله العيد، وولادتها سنة 1397 هـ في شقراء، وتعليمها ومناصبها الجامعية والإدارية وعضوياتها وقائمة مؤلفاتها ومشاركاتها في المؤتمرات."
  en: "Saudi Encyclopedia (ksaency.com) entry on Nawal Al-Eid; it gives her full name, Nawal Abdulaziz Abdullah Al-Eid, her birth in 1397 AH in Shaqra, her education, her university and administrative posts, her memberships, a list of her books and her conference participation."
  es: "Entrada de la Enciclopedia Saudí (ksaency.com) sobre Nawal Al-Eid; proporciona su nombre completo, Nawal Abdulaziz Abdullah Al-Eid, su nacimiento en 1397 AH en Shaqra, su educación, sus cargos universitarios y administrativos, sus membresías, una lista de sus libros y su participación en conferencias."
  fr: "L'article de l'Encyclopédie saoudienne (ksaency.com) sur Nawal Al-Eid; il donne son nom complet, Nawal Abdulaziz Abdullah Al-Eid, sa naissance en 1397 AH à Shaqra, son éducation, ses postes universitaires et administratifs, ses adhésions, une liste de ses livres et sa participation à des conférences."
  ur: "سعودی انسائیکلو پیڈیا (ksaency.com) نوالعید پر داخلہ؛ اس میں ان کا پورا نام، نوال عبدالعزیز عبداللہ العید، ان کی پیدائش 1397 ہجری میں شقرہ، اس کی تعلیم، اس کی یونیورسٹی اور انتظامی عہدے، اس کی رکنیت، اس کی کتابوں کی فہرست اور اس کی کانفرنس میں شرکت بتائی گئی ہے۔"
  tr: "Suudi Ansiklopedisi'ne (ksaency.com) Nawal Al-Eid hakkında giriş; tam adı Nawal Abdulaziz Abdullah Al-Eid, 1397 Hicri yılında Shaqra'da doğmuş, eğitim, üniversite ve idari görevleri, üyelikleri, yayın listesi ve konferanslara katılımı."
  id: "Entri ke Ensiklopedia Saudi (ksaency.com) tentang Nawal Al-Eid; nama lengkapnya Nawal Abdulaziz Abdullah Al-Eid, kelahirannya pada tahun 1397 AH di Shaqra, pendidikan, posisi universitas dan administrasi, keanggotaan, daftar publikasi, dan partisipasi dalam konferensi."
