reliability_note: "Read in full on 26 October 2026. It gives her full name as Nawal Abdulaziz Abdullah Al-Eid, born in 1397 AH in Shaqra, her schooling and degrees (doctorate in 1424 AH, a study and edition of Ibn Kathir's al-Ahkam al-Kubra), her progression to associate professor in 1432 AH, her work as a certified family-dialogue consultant at the King Abdulaziz Center for National Dialogue in 2009 and as a certified trainer in 2010, her teaching also at King Saud University, Prince Sultan University and Al Yamamah College, her supervision of the Ithra' al-Ma'rifa centre for educational consultancy, and her books. Its snapshot of her rank (associate professor) predates the full professorship her own website records from 1435 AH. It names no legal school or theological affiliation for her."
