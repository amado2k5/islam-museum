  ar: "مدخل الموسوعة السعودية (ksaency.com) عن نوال العيد؛ يعطي اسمها الكامل نوال عبدالعزيز عبدالله العيد، وولادتها سنة 1397 هـ في شقراء، وتعليمها ومناصبها الجامعية والإدارية وعضوياتها وقائمة مؤلفاتها ومشاركاتها في المؤتمرات."
