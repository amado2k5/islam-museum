summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسين مويني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أونغوجا سنة 1966 وعمله طبيبا ومسيرته وزيرا تنزانيا ⁦(الخدمة الوطنية والدفاع 2014–2020)⁩ وفوزه بانتخابات زنجبار سنة 2020 بنسبة 76.27 في المئة، وسياساته في مكافحة الفساد والاقتصاد الأزرق. لا يسمي متنها دينا ولا مدرسة له."
  en: "English Wikipedia article on Hussein Mwinyi; used for entity facts only. It recounts his birth on Unguja in 1966, his work as a physician, his Tanzanian ministerial career (defence and national service 2014–2020), his victory in the 2020 Zanzibar election with 76.27 percent of the vote, and his anti-corruption and blue-economy policies. Its text names no religion or school for him."
  es: "Artículo de la Wikipedia en inglés sobre Hussein Mwinyi; utilizado únicamente para datos biográficos. Relata su nacimiento en Unguja en 1966, su trayectoria como médico, su carrera ministerial en Tanzania (Defensa y Servicio Nacional, 2014-2020), su victoria en las elecciones de Zanzíbar de 2020 con el 76,27 % de los votos y sus políticas anticorrupción y de economía azul. El texto no menciona su religión ni su escuela."
  fr: "Article de Wikipédia en anglais sur Hussein Mwinyi; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Unguja en 1966, son travail de médecin, sa carrière ministérielle en Tanzanie (Défense et Service national, 2014-2020), sa victoire aux élections de Zanzibar en 2020 avec 76,27 % des voix, ainsi que ses politiques de lutte contre la corruption et de développement de l'économie bleue. Le texte ne mentionne ni sa religion ni son appartenance scolaire."
  ur: "حسین میونی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1966 میں انگوجا میں ان کی پیدائش، بطور معالج ان کے کام، ان کا تنزانیہ کا وزارتی کیریئر ⁦(دفاع اور قومی خدمت 2014-2020)⁩، 2020 کے زنجبار کے انتخابات میں 76.27 فیصد ووٹوں کے ساتھ ان کی فتح، اور ان کی انسداد بدعنوانی اور نیلی معیشت کی پالیسیوں کا ذکر ہے۔ اس کے متن میں اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
  tr: "Hussein Mwinyi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1966'da Onguja'da doğmasını, doktorluk çalışmalarını, Tanzanya bakanlığı kariyerini (Ulusal Hizmet ve Savunma 2014–2020), 2020 Zanzibar seçimlerinde yüzde 76,27 oyla kazanmasını ve yolsuzluk ile mavi ekonomiyle mücadele politikalarını anlatır. Dini veya okulunun adını belirtmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Hussein Mwinyi; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Onguja pada tahun 1966, pekerjaannya sebagai dokter, kariernya sebagai menteri Tanzania (Dinas Nasional dan Pertahanan 2014–2020), kemenangannya dalam pemilihan Zanzibar 2020 dengan 76,27 persen, dan kebijakannya dalam memerangi korupsi dan ekonomi biru. Artikel ini tidak menyebutkan agama atau sekolahnya."
