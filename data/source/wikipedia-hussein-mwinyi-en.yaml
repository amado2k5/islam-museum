  ar: "مقالة ويكيبيديا الإنجليزية عن حسين مويني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أونغوجا سنة 1966 وعمله طبيبا ومسيرته وزيرا تنزانيا (الخدمة الوطنية والدفاع 2014–2020) وفوزه بانتخابات زنجبار سنة 2020 بنسبة 76.27 في المئة، وسياساته في مكافحة الفساد والاقتصاد الأزرق. لا يسمي متنها دينا ولا مدرسة له."
