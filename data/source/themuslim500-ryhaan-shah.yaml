summary:
  en: "The Muslim 500 profile of Ryhaan Shah: Ryhaan Shah is considered among the best contemporary writers in Guyana and the Caribbean, best known for her 2005 novel A Silent Life; she is President of the Guyanese Indian Heritage Association and drew criticism for race baiting in Guyana's 2015 election."
  es: "Perfil de Ryhaan Shah en Muslim 500: Ryhaan Shah es considerada una de las mejores escritoras contemporáneas de Guyana y el Caribe, conocida principalmente por su novela de 2005, A Silent Life; es presidenta de la Asociación de la Herencia India de Guyana y fue criticada por incitar al odio racial en las elecciones de Guyana de 2015."
  fr: "Profil de Ryhaan Shah sur Muslim 500: Ryhaan Shah est considérée comme l’une des meilleures écrivaines contemporaines du Guyana et des Caraïbes, surtout connue pour son roman de 2005, Une vie silencieuse; elle est présidente de l’Association du patrimoine indien guyanais et a été critiquée pour avoir attisé les tensions raciales lors des élections guyanaises de 2015."
  ur: "ریحان شاہ کی مسلم 500 پروفائل: ریحان شاہ کو گیانا اور کیریبین کے بہترین ہم عصر مصنفین میں شمار کیا جاتا ہے، جو اپنے 2005 کے ناول A Silent Life کے لیے مشہور ہیں۔ وہ گیانا انڈین ہیریٹیج ایسوسی ایشن کی صدر ہیں اور گیانا کے 2015 کے انتخابات میں نسل کشی کے لیے تنقید کا نشانہ بنیں۔"
