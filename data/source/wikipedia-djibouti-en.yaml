summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جيبوتي، كما وردت في ملخص بحثي زُوّد به المتحف ولم يفتح المتحف الصفحة: الاسم الرسمي جمهورية جيبوتي، والإحداثيات 11.600 شمالاً و43.167 شرقاً لمدينة جيبوتي، وجمهورية رئاسية موحدة استقلت عن فرنسا في 27 يونيو 1977 ودستورها في 4 سبتمبر 1992، وعضو في الأمم المتحدة، واللغتان الرسميتان العربية والفرنسية واللغتان الوطنيتان الصومالية والعفرية."
  en: "English Wikipedia article on Djibouti, as given in a research summary supplied to the museum; the museum did not open the page: the official name Republic of Djibouti, the coordinates 11.600 N 43.167 E for Djibouti City, a unitary presidential republic independent from France on 27 June 1977 with a constitution of 4 September 1992, a United Nations member, with Arabic and French as official languages and Somali and Afar as national languages."
  ur: "جبوتی پر انگریزی ویکیپیڈیا کا مضمون، جیسا ایک تحقیقی خلاصے میں ملا جو متحف کو دیا گیا؛ متحف نے صفحہ نہیں کھولا: سرکاری نام جمہوریہ جبوتی، جبوتی شہر کے نقاط 11.600 شمال اور 43.167 مشرق، 27 جون 1977 کو فرانس سے آزاد وحدانی صدارتی جمہوریہ، دستور 4 ستمبر 1992 کا، اقوام متحدہ کی رکن، سرکاری زبانیں عربی اور فرانسیسی، قومی زبانیں صومالی اور عفر۔"
  fr: "Article de Wikipédia en anglais sur Djibouti, tel que donné dans un résumé de recherche fourni au musée ; le musée n'a pas ouvert la page : le nom officiel République de Djibouti, les coordonnées 11,600 N 43,167 E pour la ville de Djibouti, une république présidentielle unitaire indépendante de la France le 27 juin 1977 avec une constitution du 4 septembre 1992, membre de l'ONU, avec l'arabe et le français comme langues officielles et le somali et l'afar comme langues nationales."
  es: "Artículo de la Wikipedia en inglés sobre Yibuti, tal como figura en un resumen de investigación entregado al museo; el museo no abrió la página: el nombre oficial República de Yibuti, las coordenadas 11,600 N 43,167 E para la ciudad de Yibuti, una república presidencial unitaria independiente de Francia el 27 de junio de 1977 con una constitución del 4 de septiembre de 1992, miembro de la ONU, con el árabe y el francés como lenguas oficiales y el somalí y el afar como lenguas nacionales."
  tr: "Müzenin sağladığı ve sayfayı açmayan bir araştırma özetinde belirtildiği üzere İngilizce Wikipedia makalesi Cibuti Cumhuriyeti'dir, 11.600 kuzeyde ve 43.167 doğuda koordinatlar yapmaktadır. Cibuti şehri, 27 Haziran 1977'de Fransa'dan bağımsızlığını kazanmış, 4 Eylül 1992'de anayasası çıkmış, Birleşmiş Milletler üyesi olan birleşik cumhurbaşkanlığı cumhuriyetidir ve resmi diller Arapça ve Fransızca, ayrıca Somali ve Afar ulusal dilleridir."
  id: "Artikel Wikipedia bahasa Inggris tentang Djibouti, sebagaimana dinyatakan dalam ringkasan penelitian yang disediakan oleh museum, tidak membuka halaman tersebut: nama resmi adalah Republik Djibouti, koordinat 11.600 utara dan 43.167 timur kota Djibouti, sebuah republik presiden bersatu yang meraih kemerdekaan dari Prancis pada 27 Juni 1977, konstitusinya pada 4 September 1992, menjadi anggota Perserikatan Bangsa-Bangsa, dan bahasa resminya adalah Arab dan Prancis, serta bahasa nasional Somalia dan Afar."
