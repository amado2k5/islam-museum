  en: "Research summary: the Qur'an's Arabic in the classical tafsir tradition"
summary:
  ar: "ملخص بحثي قُدِّم إلى المتحف في 21 نوفمبر 2026 ولصقه المؤسس ولم تُرفق به روابط؛ موضوعه: الآيات التي تصف لسان القرآن بالعربي المبين وفهم المفسرين لكلمة مبين، والخلاف في الألفاظ غير العربية في القرآن، والخلاف بين الإعجاز بالنص والإعجاز بالصرفة. اعتمد المؤسس استعماله دون إعادة تحقق، ويذكر الملخص أن أرقام الصفحات تختلف باختلاف الطبعة، ولم تُفتح الكتب المذكورة فيه."
  en: "A research summary supplied to the museum on 21 November 2026 and pasted by the founder, with no URLs; its subject: the verses that call the Qur'an's tongue clear Arabic and the commentators' understanding of mubin, the dispute over non-Arabic words in the Qur'an, and the dispute between inimitability in the text itself and by sarfa. The founder approved using it without re-verification; the summary itself notes that page numbers vary by edition, and the books it names were not opened."
  ur: "عجائب گھر کو 21 نومبر 2026 کو دیا گیا ایک تحقیقی خلاصہ جو بانی نے چسپاں کیا اور جس کے ساتھ کوئی روابط نہیں تھے؛ موضوع: وہ آیات جو قرآن کی زبان کو عربی مبین کہتی ہیں اور مفسرین کا مبین کا فہم، قرآن میں غیر عربی الفاظ پر اختلاف، اور متن کے اعجاز اور صرفہ کے اعجاز میں اختلاف۔ بانی نے اسے بغیر دوبارہ تصدیق کے استعمال کرنے کی منظوری دی، خلاصہ خود بتاتا ہے کہ صفحات کے نمبر طبعات کے لحاظ سے مختلف ہیں، اور اس میں مذکور کتابیں کھولی نہیں گئیں۔"
  fr: "Résumé de recherche remis au musée le 21 novembre 2026 et collé par le fondateur, sans URL ; son sujet : les versets qui disent la langue du Coran arabe clair et la compréhension de mubin par les commentateurs, la dispute sur les mots non arabes du Coran, et celle entre l'inimitabilité du texte même et par sarfa. Le fondateur a approuvé son usage sans nouvelle vérification ; le résumé note lui-même que les numéros de page varient selon l'édition, et les livres qu'il nomme n'ont pas été ouverts."
  es: "Resumen de investigación entregado al museo el 21 de noviembre de 2026 y pegado por el fundador, sin URL; su tema: los versículos que llaman árabe claro a la lengua del Corán y la comprensión de mubin por los comentaristas, la disputa sobre palabras no árabes en el Corán, y la disputa entre la inimitabilidad del texto mismo y por sarfa. El fundador aprobó su uso sin nueva verificación; el propio resumen señala que los números de página varían según la edición, y los libros que nombra no se abrieron."
