summary:
  ar: "مقالة ويكيبيديا الصينية ⁦(هوانغ يي تسونغ)⁩ عن إيكا تجيبتا ويدجاجا، المولود في 27 شباط 1921 في تشيوانتشو والمتوفى في 26 كانون الثاني 2019 عن 97 عامًا، رجل الأعمال الإندونيسي من أصل صيني ومؤسس مجموعة سينار ماس؛ تذكر هجرته إلى ماكاسار في التاسعة ومسيرته التجارية والمصرفية."
  en: "Chinese Wikipedia article (Huang Yicong) on Eka Tjipta Widjaja, born 27 February 1921 in Quanzhou and died 26 January 2019 aged 97, the Chinese Indonesian businessman who founded the Sinar Mas Group; it records his migration to Makassar at nine and his trading and banking career."
  es: "Artículo de la Wikipedia en chino (Huang Yicong) sobre Eka Tjipta Widjaja, nacido el 27 de febrero de 1921 en Quanzhou y fallecido el 26 de enero de 2019 a los 97 años, el empresario chino-indonesio que fundó el Grupo Sinar Mas; en él se relata su migración a Makassar a los nueve años y su trayectoria profesional en el comercio y la banca."
  fr: "Article de Wikipédia chinois (Huang Yicong) sur Eka Tjipta Widjaja, né le 27 février 1921 à Quanzhou et décédé le 26 janvier 2019 à l'âge de 97 ans, l'homme d'affaires sino-indonésien qui a fondé le groupe Sinar Mas; il relate sa migration à Makassar à l'âge de neuf ans et sa carrière dans le commerce et la banque."
  ur: "چینی ویکیپیڈیا مضمون ⁦(ہوانگ یکونگ)⁩ ایکا تجپتا وِدجاجا پر، 27 فروری 1921 کوانزو میں پیدا ہوئے اور 26 جنوری 2019 کو 97 سال کی عمر میں انتقال کر گئے، چینی انڈونیشی تاجر جس نے سینار ماس گروپ کی بنیاد رکھی۔ اس میں نو بجے مکاسر کی طرف ہجرت اور اس کے تجارتی اور بینکنگ کیریئر کو ریکارڈ کیا گیا ہے۔"
