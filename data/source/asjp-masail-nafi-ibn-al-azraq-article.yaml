  ar: "صفحة «Article on the Masaʼil of Nāfiʿ ibn al-Azraq (ASJP, Algerian Scientific Journal Platform)» لدى ASJP (Algerian Scientific Journal Platform). لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملخص بحثي قُدّم إلى المتحف ووافق المؤسس على استعماله في 21 نوفمبر 2026. يُستشهد بها في: مسائل نافع بن الأزرق والاستشهاد بالشعر الجاهلي على غريب القرآن."
  en: "The page \"Article on the Masaʼil of Nāfiʿ ibn al-Azraq (ASJP, Algerian Scientific Journal Platform)\" (ASJP (Algerian Scientific Journal Platform)). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum and approved for use by the founder on 21 November 2026. Cited for: the Masa'il of Nafi ibn al-Azraq and the citing of pre-Islamic verse for rare Qur'anic words."
  ur: "صفحہ «Article on the Masaʼil of Nāfiʿ ibn al-Azraq (ASJP, Algerian Scientific Journal Platform)»، ASJP (Algerian Scientific Journal Platform)۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ عجائب گھر کو دیے گئے ایک تحقیقی خلاصے سے ہے جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ اس کے لیے دیا گیا: نافع بن الازرق کے مسائل اور قرآن کے غریب الفاظ پر جاہلی شعر سے استشہاد۔"
  fr: "La page « Article on the Masaʼil of Nāfiʿ ibn al-Azraq (ASJP, Algerian Scientific Journal Platform) » (ASJP (Algerian Scientific Journal Platform)). Le musée ne l'a pas ouverte lui-même : ce qu'on en sait vient d'une synthèse de recherche remise au musée et approuvée pour usage par le fondateur le 21 novembre 2026. Citée pour : les Masa'il de Nafi ibn al-Azraq et la citation de vers préislamiques pour les mots rares du Coran."
  es: "La página «Article on the Masaʼil of Nāfiʿ ibn al-Azraq (ASJP, Algerian Scientific Journal Platform)» (ASJP (Algerian Scientific Journal Platform)). El museo no la abrió por sí mismo: lo que se sabe de ella procede de un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026. Citada para: las Masa'il de Nafi ibn al-Azraq y la cita de versos preislámicos para palabras raras del Corán."
  tr: "ASJP'de (Cezayir Bilimsel Dergi Platformu) \"Nāfiʿ ibn al-Azraq'ın Meseili Üzerine Makale\" sayfası (ASJP). Müze kendisi tarafından açılmadı; içeriği, müzeye sunulan ve kurucu tarafından 21 Kasım 2026'da onaylanan bir araştırma özetinden biliniyordu. Atıf için: Nafi' ibn al-Azraq'ın Sayıları ve Nadir Kur'an'da İslam öncesi şiirlere atıfta bulunmak."
  id: "Halaman \"Artikel tentang Masaʼil Nāfiʿ ibn al-Azraq (ASJP, Platform Jurnal Ilmiah Aljazair)\" di ASJP (Platform Jurnal Ilmiah Aljazair). Museum itu sendiri tidak membukanya; isinya diketahui dari ringkasan penelitian yang diserahkan ke museum dan disetujui oleh pendiri pada 21 November 2026. Dikutip dalam: Edisi Nafi' ibn al-Azraq dan Mengutip Puisi Pra-Islam tentang Al-Qur'an Langka."
