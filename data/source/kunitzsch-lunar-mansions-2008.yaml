  en: "Paul Kunitzsch, 'Lunar Mansions in Islam'"
  ur: "پاول کونیتزش، «اسلام میں قمری منازل»"
summary:
  ar: "مقال معجمي لبول كلونتش في «موسوعة تاريخ العلوم والتقنية والطب في الثقافات غير الغربية» ⁦(سبرينغر، دوردخت 2008، ص 1242–1243)⁩ يشرح أن العرب قبل معرفتهم بالفلك اليوناني كانت لديهم معرفة شعبية بالأنواء، وأنهم تلقوا نظام المنازل القمرية الثمانية والعشرين من الهند في زمن مجهول وبطرق مجهولة، فطابقوا كل منزل مع أحد أنجمائهم."
  en: "An encyclopaedia entry by Paul Kunitzsch in the Encyclopaedia of the History of Science, Technology, and Medicine in Non-Western Cultures (Springer, Dordrecht 2008, pp. 1242–1243) explaining that the pre-Greek Arabs had folk astronomy of the anwā', and that they received the 28 lunar-mansion system from India at an unknown time through unknown channels, matching each mansion to one of their asterisms."
  ur: "پاول کونیتزش کا مضمون «غیر مغربی ثقافتوں میں علوم، ٹیکنالوجی اور طب کی تاریخ کی انسائیکلوپیڈیا» ⁦(اسپرنگر، ڈورڈریچٹ 2008، ص 1242–1243)⁩ میں، جو بتاتا ہے کہ یونانی فلکیات سے پہلے عربوں کے پاس انواء کی لوک فلکیات تھی اور انہوں نے 28 منازلِ قمر کا نظام ایک نامعلوم وقت میں نامعلوم ذرائع سے ہند سے پایا، ہر منزل کو اپنے ایک مجمع النجم سے ملایا۔"
  es: "Una entrada de enciclopedia de Paul Kunitzsch en la Enciclopedia de la Historia de la Ciencia, la Tecnología y la Medicina en las Culturas No Occidentales (Springer, Dordrecht 2008, págs. 1242-1243) explica que los árabes pregriegos tenían una astronomía popular del anwā', y que recibieron el sistema de 28 mansiones lunares de la India en un momento desconocido a través de canales desconocidos, haciendo coincidir cada mansión con uno de sus asterismos."
  fr: "Un article encyclopédique de Paul Kunitzsch dans l'Encyclopédie de l'histoire des sciences, des technologies et de la médecine dans les cultures non occidentales (Springer, Dordrecht 2008, pp. 1242–1243) explique que les Arabes pré-grecs avaient une astronomie populaire de l'anwā' et qu'ils ont reçu le système des 28 demeures lunaires de l'Inde à une époque inconnue par des canaux inconnus, faisant correspondre chaque demeure à l'un de leurs astérismes."
  tr: "Paul Clontsch'in \"Batı Dışı Kültürlerde Bilim, Teknoloji ve Tıp Tarihi Ansiklopedisi\"nde (Springer, Dordokht 2008, s. 1242–1243) yayımlanan bir sözcük makalesi, Arapların Yunan astronomisini bilmeden önce uydular hakkında halk bilgisine sahip olduklarını ve Hindistan'dan bilinmeyen zamanlarda ve bilinmeyen şekillerde yirmi sekiz ay evi sistemini alıp her evi kendi yıldızlarından biriyle eşleştirdiklerini açıklar."
  id: "Sebuah artikel leksikal oleh Paul Clontsch dalam \"Encyclopedia of the History of Science, Technology, and Medicine in Non-Western Cultures\" (Springer, Dordokht 2008, hlm. 1242–1243) menjelaskan bahwa sebelum orang Arab mengetahui astronomi Yunani, mereka sudah memiliki pengetahuan luas tentang bulan-bulan, dan mereka menerima sistem dua puluh delapan rumah bulan dari India dalam waktu dan cara yang tidak diketahui, mencocokkan setiap rumah dengan salah satu bintang mereka."
