  id: "Kajian Jamil Hamdawi tentang pemikiran maqasid Ahmad al-Raisuni, Kitab al-Islah nomor 28, September 2020; catatan kakinya memuat data edisi pertama al-Fikr al-Maqasidi: Qawa'iduh wa-Fawa'iduh."
