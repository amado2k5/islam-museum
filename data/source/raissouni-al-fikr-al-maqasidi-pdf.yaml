reliability_note: "PDF on raissouni.com (82 pages). Corrected on 24 November 2026: it is not al-Raysuni's own book but a study of him by Jamil Hamdawi, al-Fikr al-Maqasidi: Mafhumuh wa-Khasa'isuh (Ahmad al-Raysuni Anmudhajan), Kitab al-Islah no. 28, September 2020, ISBN 978-9938-59-365-5. Its notes and bibliography cite al-Raysuni's al-Fikr al-Maqasidi: Qawa'iduh wa-Fawa'iduh as Manshurat al-Zaman, Rabat, Kitab al-Jayb no. 9, first edition, December 1999, and quote from it. The earlier note (Kitab al-Islah no. 3, June 2015) was wrong. Read on 18 and 24 November 2026."
