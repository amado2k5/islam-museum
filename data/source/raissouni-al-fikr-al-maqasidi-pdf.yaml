summary:
  ar: "دراسة لجميل حمداوي عن فكر أحمد الريسوني المقاصدي، العدد 28 من سلسلة «كتاب الإصلاح»، سبتمبر 2020، وتذكر حواشيها بيانات الطبعة الأولى من «الفكر المقاصدي: قواعده وفوائده»."
  en: "A study by Jamil Hamdawi of Ahmed al-Raysuni's maqasid thought, Kitab al-Islah no. 28, September 2020; its notes give the first-edition details of al-Fikr al-Maqasidi: Qawa'iduh wa-Fawa'iduh."
