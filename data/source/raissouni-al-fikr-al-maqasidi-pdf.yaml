  ur: "جمیل حمداوی کا احمد ریسونی کی مقاصدی فکر پر مطالعہ، «کتاب الاصلاح» شمارہ 28، ستمبر 2020؛ اس کے حواشی «الفکر المقاصدی: قواعدہ وفوائدہ» کے پہلے ایڈیشن کی تفصیل دیتے ہیں۔"
