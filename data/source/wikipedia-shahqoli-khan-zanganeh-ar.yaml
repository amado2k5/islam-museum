  ar: "مقالة ويكيبيديا العربية الموجزة عن شاه قلي خان زنكنه؛ تعطي صدره الأعظم من 1707 إلى 1716 ووفاته سنة 1716 وخلافة صهره فتح علي خان الداغستاني له؛ تُستخدم لوقائع الكيان فقط."
  en: "Arabic Wikipedia stub on Shah Quli Khan Zangana; it gives his grand vizierate from 1707 to 1716, his death in 1716, and his succession by his son-in-law Fath-Ali Khan Daghestani; used for entity facts only, each cited where the article gives its own source."
  es: "Fragmento de la Wikipedia en árabe sobre Shah Quli Khan Zangana; describe su gran visirismo desde 1707 hasta 1716, su muerte en 1716 y su sucesión por su yerno Fath-Ali Khan Daghestani; se utiliza únicamente para datos sobre entidades, citados donde el artículo proporciona su propia fuente."
  fr: "Ébauche de l'article Wikipédia en arabe sur Shah Quli Khan Zangana; elle indique son grand vizirat de 1707 à 1716, sa mort en 1716 et sa succession par son gendre Fath-Ali Khan Daghestani; utilisée uniquement pour les faits concernant l'entité, chaque information étant citée lorsque l'article donne sa propre source."
  ur: "شاہ قلی خان زنگانہ پر عربی ویکیپیڈیا سٹب؛ یہ 1707 سے 1716 تک اس کی عظیم الشان وزیریٹی، 1716 میں اس کی موت، اور اس کے داماد فتح علی خان داغستانی کی جانشینی دیتا ہے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک کا حوالہ دیا جاتا ہے جہاں مضمون اپنا ماخذ دیتا ہے۔"
  tr: "Şah Kuli Han Zanganeh hakkındaki Arapça Vikipedi makalesi, 1707'den 1716'ya kadar en büyük himayesine sahip olması, 1716'daki ölümü ve kayınbiraderi Dağıstanlı Fath Ali Khan'a geçmesi arasında yer almaktadır; bu makale yalnızca varlığın gerçekleri için kullanılır."
  id: "Artikel Wikipedia berbahasa Arab tentang Shah Quli Khan Zanganeh memberikan patronase terbesarnya dari tahun 1707 hingga 1716, kematiannya pada tahun 1716, dan penerusannya kepada saudara iparnya Fath Ali Khan dari Dagestani; artikel ini hanya digunakan untuk fakta-fakta entitas tersebut."
