reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. Its lead and biography (citing Klimeš 2015, p. 121, and Brophy 2016, p. 240) give his birth in 1887 at Turpan, and its death passage (citing Tuncer 2019, p. 130) gives his death at Japanese-occupied Beijing in 1944 from a brain hemorrhage, buried in a Muslim cemetery there. It describes him as a long-time Jadidist (citing Brophy) and quotes a British consul calling him 'a zealous Mohammedan'; no text in it names a legal school or Sufi order for him."
