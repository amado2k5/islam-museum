  en: "English Wikipedia article on Mahmut Muhiti; used for entity facts only. It recounts the Uyghur military leader from Turpan who commanded Khoja Niyaz's forces, held the Kashgar military region (1934–1937), led the Islamic rebellion of 1937 and died at Beijing, and it dates him 1887–1944."
