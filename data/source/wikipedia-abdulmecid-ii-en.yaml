reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by revision id with content verified identical. Its infobox carries a religion field reading 'Sunni Islam', with no citation attached; its text names no school for him personally — it describes his caliphate office, his statement that the abolition of the caliphate was contrary to Sharia, and his Friday prayers at the Grand Mosque of Paris in exile, which are office, position and practice, not an attestation of a school. The birth day is split inside the article: the infobox gives '29/30 May 1868', the lead 29 May, the early-life text 30 May 1868 at Dolmabahçe Palace, both citing the Encyclopaedia Britannica; the death, 23 August 1944 at Paris of a heart attack, and the burial at Jannat al-Baqi in Medina after the body lay ten years at the Paris mosque, are consistent."
