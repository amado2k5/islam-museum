summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد المجيد الثاني؛ تُستخدم لوقائع الكيان فقط. تعطيه آخر خليفة عثماني (1922–1924) ووليًّا للعهد من 1918، ابنًا للسلطان عبد العزيز، ورسامًا بارزًا من رسامي أواخر العهد العثماني، مات في باريس سنة 1944 ودُفن في المدينة."
  en: "English Wikipedia article on Abdülmecid II; used for entity facts only. It gives him as the last Ottoman caliph (1922–1924), crown prince from 1918, a son of Sultan Abdulaziz, and a leading painter of the late Ottoman period, who died in Paris in 1944 and was buried in Medina."
  es: "Artículo de la Wikipedia en inglés sobre Abdülmecid II; utilizado únicamente para datos sobre la persona. Lo describe como el último califa otomano (1922-1924), príncipe heredero desde 1918, hijo del sultán Abdulaziz y destacado pintor del final del período otomano, quien falleció en París en 1944 y fue enterrado en Medina."
  fr: "Article de Wikipédia en anglais sur Abdülmecid II; utilisé uniquement pour les informations sur l’entité. Il le présente comme le dernier calife ottoman (1922-1924), prince héritier à partir de 1918, fils du sultan Abdulaziz et peintre majeur de la fin de la période ottomane, décédé à Paris en 1944 et inhumé à Médine."
  ur: "عبد المسید II پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انہیں آخری عثمانی خلیفہ (1922–1924)، 1918 سے ولی عہد، سلطان عبدالعزیز کے بیٹے، اور عثمانی دور کے آخری دور کے ایک معروف مصور کے طور پر دیتا ہے، جو 1944 میں پیرس میں انتقال کر گئے اور مدینہ میں دفن ہوئے۔"
