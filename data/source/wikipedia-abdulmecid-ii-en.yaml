  en: "English Wikipedia article on Abdülmecid II; used for entity facts only. It gives him as the last Ottoman caliph (1922–1924), crown prince from 1918, a son of Sultan Abdulaziz, and a leading painter of the late Ottoman period, who died in Paris in 1944 and was buried in Medina."
