reliability_note: "Tracker page for the Safiirka Islaamka channel (299,000 subscribers, 34,962,490 total views and 1,683 videos as of 4 November 2026; channel created 4 December 2018; country Kenya). Its listed top videos are Somali-language talks and lectures by various speakers — among them a talk on the death of Imam Muhammad Swalihu of Jamia Mosque, Nairobi (October 2022), and a question-and-answer session by Sheikh Yusuf Xogweyn — and no individual author or owner is named for the channel. Subscriber and view counts are dated platform measurements, not museum facts; earnings figures are vidIQ estimates and are not used."
