reliability_note: "Human-rights organisation profile read on 25 October 2026. It corroborates her Brooklyn birth in 1980, her arranged marriage at 17 and three children by her mid-20s, her post-9/11 civil-rights work for American Muslims, her nearly 16 years as executive director of the Arab American Association of New York, the 2015 March2Justice, and the 2017 Women's March. It names no school for her."
