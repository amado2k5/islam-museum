summary:
  ar: "صفحة مركز روبرت وإثيل كينيدي لحقوق الإنسان عن ليندا صرصور؛ تذكر ولادتها سنة 1980 في بروكلين أكبرَ أبناء مهاجرين فلسطينيين، وعملها في الجمعية العربية الأمريكية، وتأسيسها المشترك لمنصة إم باور تشينج ومسيرة النساء."
  en: "Robert & Ethel Kennedy Human Rights Center page on Linda Sarsour; it gives her birth in 1980 in Brooklyn as the eldest of seven children of Palestinian immigrants, her work at the Arab American Association of New York, her co-founding of MPOWER Change and her co-chairing of the Women's March."
  es: "Página del Centro de Derechos Humanos Robert & Ethel Kennedy sobre Linda Sarsour; en ella se indica que nació en 1980 en Brooklyn como la mayor de siete hijos de inmigrantes palestinos, su trabajo en la Asociación Árabe Americana de Nueva York, su cofundación de MPOWER Change y su copresidencia de la Marcha de las Mujeres."
  fr: "La page du Robert & Ethel Kennedy Human Rights Center consacrée à Linda Sarsour mentionne sa naissance en 1980 à Brooklyn, où elle est l'aînée d'une famille de sept enfants d'immigrants palestiniens, son travail au sein de l'Arab American Association of New York, sa cofondation de MPOWER Change et sa coprésidence de la Marche des femmes."
  ur: "لنڈا سارسور پر رابرٹ اور ایتھل کینیڈی ہیومن رائٹس سینٹر کا صفحہ؛ اس نے اسے 1980 میں بروکلین میں فلسطینی تارکین وطن کے سات بچوں میں سب سے بڑے کے طور پر جنم دیا، نیویارک کی عرب امریکن ایسوسی ایشن میں اس کا کام، MPOWER چینج کی اس کی شریک بانی اور خواتین کے مارچ کی اس کی شریک صدارت۔"
  tr: "Robert ve Ethel Kennedy İnsan Hakları Merkezi sayfası Linda Sarsour hakkında; 1980'de Brooklyn'de doğmasından, Filistinli göçmenlerin en büyük çocuğu olarak, Arap Amerikan Derneği'ndeki çalışmalarından ve M-Power Change platformu ile Kadınlar Yürüyüşü'nün kurucu ortaklarından bahsediliyor."
  id: "Halaman Robert and Ethel Kennedy Center for Human Rights tentang Linda Sarsour; halaman tersebut menyebutkan kelahirannya pada tahun 1980 di Brooklyn, anak sulung imigran Palestina, karyanya di Arab American Association, dan pendirian bersama platform M-Power Change dan Women's March."
