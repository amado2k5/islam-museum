summary:
  ar: "مدخل «ملك» في موسوعة TDV الإسلامية: جذر الكلمة وحضورها في النقائش قبل الإسلام، وإحجام المسلمين الأوائل عن اللقب، ثم عودته مع السامانيين والبويهيين وانتشاره في السلاجقة والأيوبيين والمماليك، وملوك الأقاليم وتضخم الألقاب، وإحياء اللقب في ممالك القرن العشرين."
  en: "The TDV İslâm Ansiklopedisi entry on melik (king): the word's Semitic root and pre-Islamic epigraphy, the early Muslims' refusal of the title, its return with the Samanids and Buyids, its spread under the Seljuks, Ayyubids and Mamluks, provincial maliks and title inflation, and the twentieth-century revival of kingship."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre melik (rey): la raíz semítica de la palabra y la epigrafía preislámica, el rechazo del título por parte de los primeros musulmanes, su regreso con los samaníes y los buyíes, su difusión bajo los selyúcidas, ayubíes y mamelucos, los maliks provinciales y la inflación de títulos, y el resurgimiento de la monarquía en el siglo XX."
