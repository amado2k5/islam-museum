  ar: "مقالة ويكيبيديا الإنجليزية عن أنيسة مكسن؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في نانسي في 29 أبريل 1988 وتصفها بأنها فرنسية جزائرية، وتعدّد ألقابها العالمية في غلوري وبطولات المواي تاي والسافات ولقب فرنسا في الملاكمة، وسجلها 104 انتصارات. ولا تذكر أي ديانة لها."
