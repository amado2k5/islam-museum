reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The infobox gives her birth on 29 April 1988 in Nancy, France, her record of 104 kickboxing wins (33 by knockout) against 7 losses and a 2–0 boxing record, and her team, Team OGB, under the trainer Benoit Zede. The text records her Glory Women's Super Bantamweight Championship (won 2017, held twice), her ISKA and AFSO world titles of 2017, her WAKO PRO flyweight world title of 2016, her WBC world Muay Thai title of 2016 and WPMF world title of 2014, her S1 world title of 2013, her French super-bantamweight boxing title of 2017, her unsuccessful ONE interim atomweight (2023) and strawweight (2024) title challenges, and the 2014 and 2017 Fighter of the Year awards. The article makes no statement of her religion; its short description calls her French-Algerian, which is national origin, not affiliation."
