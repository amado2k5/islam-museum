summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أبي شعيب الدكالي (1878–1937)، العالم المغربي ووزير العدل وأحد رواد السلفية في المغرب الملقب بشيخ الإسلام؛ تذكر انتماء أسرته إلى الطريقة الدرقاوية، ولا تسمي له مذهبًا فقهيًا."
  en: "The English Wikipedia article on Abu Shu'ayb ad-Dukkali (1878–1937), the Moroccan scholar, minister of justice and pioneer of Salafism in Morocco titled Shaykh al-Islam; it records his family's affiliation with the Darqawiyya Sufi order and names no madhhab for him."
  es: "El artículo de Wikipedia en inglés sobre Abu Shu'ayb ad-Dukkali (1878-1937), erudito marroquí, ministro de justicia y pionero del salafismo en Marruecos, titulado Shaykh al-Islam; registra la afiliación de su familia con la orden sufí Darqawiyya y no le nombra ningún madhab."
  fr: "L'article de Wikipédia en anglais sur Abu Shu'ayb ad-Dukkali (1878-1937), l'érudit marocain, ministre de la Justice et pionnier du salafisme au Maroc, intitulé Shaykh al-Islam; il enregistre l'affiliation de sa famille à l'ordre soufi Darqawiyya et ne nomme aucun madhhab pour lui."
  ur: "مراکش کے عالم، وزیر انصاف اور مراکش میں سلفیت کے علمبردار، ابو شعیب اڈ-دکلی (1878–1937) پر انگریزی ویکیپیڈیا کا مضمون شیخ الاسلام کے عنوان سے؛ اس میں دارقاویہ صوفی حکم سے ان کے خاندان کی وابستگی درج ہے اور اس کے لیے کسی مذہب کا نام نہیں لیا گیا ہے۔"
  tr: "Faslı alim, Adalet Bakanı ve Fas'ta Selefiliğin öncülerinden biri olan Şeyh al-İslam olarak bilinen Ebu Şuayb el-Dukkali (1878–1937) hakkında İngilizce Wikipedia makalesi; ailesinin Darqaviye tarikatıyla bağlantısından bahsedilir, ancak onun adına bir fıkıh okulu adı verilmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Abu Shuayb al-Dukkali (1878–1937), seorang cendekiawan Maroko, Menteri Kehakiman, dan salah satu pelopor Salafisme di Maroko, yang dikenal sebagai Sheikh al-Islam; artikel tersebut menyebutkan afiliasi keluarganya dengan tarekat Darqawiya, tetapi tidak menyebutkan sekolah hukum untuknya."
