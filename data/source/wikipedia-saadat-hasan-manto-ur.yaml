summary:
  ar: "مقالة ويكيبيديا الأردية عن سعادت حسن منتو؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في سامرالا بقضاء لدهيانه في 11 أيار 1912 ووفاته في 18 كانون الثاني 1955 من كثرة شرب الخمر، وأسرته الكشميرية وتعليمه المتعثر وأشهر قصصه ومنها «توبه تيك سينغ» و«كول دو» و«تهندا غوشت»."
  en: "Urdu Wikipedia article on Saadat Hasan Manto; used for entity facts only. It gives his birth at Samrala in Ludhiana district on 11 May 1912 and his death on 18 January 1955 from excessive drinking, his Kashmiri family, his faltering education and his best-known stories including 'Toba Tek Singh', 'Khol Do' and 'Thanda Gosht'."
  es: "Artículo de Wikipedia en urdu sobre Saadat Hasan Manto; utilizado únicamente para datos biográficos. Indica su nacimiento en Samrala, distrito de Ludhiana, el 11 de mayo de 1912 y su fallecimiento el 18 de enero de 1955 a causa del alcoholismo, su familia cachemir, sus deficiencias educativas y sus relatos más conocidos, entre los que destacan «Toba Tek Singh», «Khol Do» y «Thanda Gosht»."
  fr: "Article de Wikipédia en ourdou sur Saadat Hasan Manto; utilisé uniquement pour des informations factuelles. Il indique sa naissance à Samrala, dans le district de Ludhiana, le 11 mai 1912 et sa mort le 18 janvier 1955 des suites d’une consommation excessive d’alcool, sa famille cachemirienne, ses études difficiles et ses contes les plus connus, notamment « Toba Tek Singh », « Khol Do » et « Thanda Gosht »."
