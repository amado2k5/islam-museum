  ar: "مقالة ويكيبيديا الأردية عن سعادت حسن منتو؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في سامرالا بقضاء لدهيانه في 11 أيار 1912 ووفاته في 18 كانون الثاني 1955 من كثرة شرب الخمر، وأسرته الكشميرية وتعليمه المتعثر وأشهر قصصه ومنها «توبه تيك سينغ» و«كول دو» و«تهندا غوشت»."
  en: "Urdu Wikipedia article on Saadat Hasan Manto; used for entity facts only. It gives his birth at Samrala in Ludhiana district on 11 May 1912 and his death on 18 January 1955 from excessive drinking, his Kashmiri family, his faltering education and his best-known stories including 'Toba Tek Singh', 'Khol Do' and 'Thanda Gosht'."
