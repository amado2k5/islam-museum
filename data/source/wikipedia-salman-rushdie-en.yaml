  ar: "مقالة ويكيبيديا الإنجليزية عن سلمان رشدي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في بومباي سنة 1947، وروايته «أطفال منتصف الليل» وفوزها بالبوكر، ورواية «الآيات الشيطانية» والفتوى الصادرة بحقه سنة 1989، ومواقفه الدينية المعلنة بنفسه عبر عقود، ومحاولة اغتياله سنة 2022 التي فقد فيها إحدى عينيه."
  en: "English Wikipedia article on Salman Rushdie; used for entity facts only. It covers his 1947 birth in Bombay, Midnight's Children and its Booker win, The Satanic Verses and the 1989 fatwa, his self-declared religious views across decades, and the 2022 attempt on his life that cost him an eye."
