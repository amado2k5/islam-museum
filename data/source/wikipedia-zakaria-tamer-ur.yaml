summary:
  ar: "مقالة ويكيبيديا الأردية المختصرة عن زكريا تامر؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه أبرز كتّاب القصة القصيرة وكتب الأطفال في سورية الحديثة، وتصنّفه تصنيفاتها في الشخصيات المسلمة السورية وهو تصنيف ملفّ لا نصّ."
  en: "Urdu Wikipedia stub on Zakaria Tamer; used for entity facts only. It describes him as one of the most widely read short-story and children's writers of modern Syria. Its categories file him under Syrian Muslim personalities — a category filing, not a text attestation."
  es: "Breve entrada en urdu de la Wikipedia sobre Zakaria Tamer; se utiliza únicamente para datos sobre la persona. Lo describe como uno de los escritores de cuentos y literatura infantil más leídos de la Siria moderna. Sus categorías lo clasifican dentro de las personalidades musulmanas sirias; se trata de una clasificación, no de una declaración textual."
  fr: "Ébauche de l'article Wikipédia en ourdou sur Zakaria Tamer; utilisé uniquement à des fins d'information. Il est décrit comme l'un des auteurs de nouvelles et de livres pour enfants les plus lus de la Syrie moderne. Ses catégories le classent dans la catégorie « Personnalités musulmanes syriennes » – un classement par catégorie, et non une attestation textuelle."
  ur: "زکریا ٹیمر پر اردو ویکیپیڈیا اسٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے جدید شام کے سب سے زیادہ پڑھے جانے والے مختصر کہانی اور بچوں کے مصنفین میں سے ایک کے طور پر بیان کرتا ہے۔ اس کے زمرے اسے شامی مسلم شخصیات کے تحت فائل کرتے ہیں - ایک زمرہ فائلنگ، ٹیکسٹ اٹیسٹیشن نہیں۔"
  tr: "Zakaria Tamer hakkında kısa Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Onu modern Suriye'nin en önde gelen kısa öykü yazarı ve çocuk kitapları olarak tanımlar ve Suriyeli Müslüman figürlerin sınıflandırması onu metin değil bir dosya olarak sınıflandırır."
  id: "Artikel singkat Wikipedia dalam bahasa Urdu tentang Zakaria Tamer; hanya digunakan untuk fakta entitas. Artikel ini menggambarkannya sebagai penulis cerita pendek dan buku anak-anak paling menonjol di Suriah modern, dan klasifikasi tokoh Muslim Suriah mengklasifikasikannya sebagai file, bukan teks."
