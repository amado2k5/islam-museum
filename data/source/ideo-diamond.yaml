summary:
  ar: "فهرس مرجعي بمعيار IFLA-LRM/RDA يضم أكثر من ٢٣٠٬٠٠٠ عمل و١١٦٬٠٠٠ اسم، تشترك فيه إحدى عشرة مكتبة ⁦(معهد الدراسات الشرقية للدومنيكان بالقاهرة، والمكتبة الرسولية الفاتيكانية، ومعهد المخطوطات العربية التابع لجامعة الدول العربية وغيرها)⁩، ويديره منذ ٢٠٢١ مركز LRM-CS في باريس. يسجّل المصنّفات وطبعاتها وترجماتها والعلاقات المصرّح بها بين الأعمال: الشروح والردود والاختصارات والتتمات."
  en: "An IFLA-LRM/RDA authority catalogue of more than 230,000 works and 116,000 agents, shared by eleven libraries (IDEO in Cairo, the Vatican Apostolic Library, the Arab League's Institute of Arabic Manuscripts and others) and stewarded since 2021 by LRM-CS in Paris. It records works, their editions and translations, and typed relations between works: commentaries, refutations, abridgements and sequels."
  ur: "An IFLA-LRM/RDA authority catalogue of more than 230,000 works and 116,000 agents, shared by eleven libraries (IDEO in Cairo, the Vatican Apostolic Library, the Arab League's Institute of Arabic Manuscripts and others) and stewarded since 2021 by LRM-CS in Paris. It records works, their editions and translations, and typed relations between works: commentaries, refutations, abridgements and sequels."
