summary:
  ar: "فهرس مرجعي بمعيار IFLA-LRM/RDA يضم أكثر من ٢٣٠٬٠٠٠ عمل و١١٦٬٠٠٠ اسم، تشترك فيه إحدى عشرة مكتبة ⁦(معهد الدراسات الشرقية للدومنيكان بالقاهرة، والمكتبة الرسولية الفاتيكانية، ومعهد المخطوطات العربية التابع لجامعة الدول العربية وغيرها)⁩، ويديره منذ ٢٠٢١ مركز LRM-CS في باريس. يسجّل المصنّفات وطبعاتها وترجماتها والعلاقات المصرّح بها بين الأعمال: الشروح والردود والاختصارات والتتمات."
  en: "An IFLA-LRM/RDA authority catalogue of more than 230,000 works and 116,000 agents, shared by eleven libraries (IDEO in Cairo, the Vatican Apostolic Library, the Arab League's Institute of Arabic Manuscripts and others) and stewarded since 2021 by LRM-CS in Paris. It records works, their editions and translations, and typed relations between works: commentaries, refutations, abridgements and sequels."
  ur: "An IFLA-LRM/RDA authority catalogue of more than 230,000 works and 116,000 agents, shared by eleven libraries (IDEO in Cairo, the Vatican Apostolic Library, the Arab League's Institute of Arabic Manuscripts and others) and stewarded since 2021 by LRM-CS in Paris. It records works, their editions and translations, and typed relations between works: commentaries, refutations, abridgements and sequels."
  es: "Un catálogo de autoridades de IFLA-LRM/RDA con más de 230 000 obras y 116 000 agentes, compartido por once bibliotecas (IDEO en El Cairo, la Biblioteca Apostólica Vaticana, el Instituto de Manuscritos Árabes de la Liga Árabe y otras) y gestionado desde 2021 por LRM-CS en París. Registra las obras, sus ediciones y traducciones, así como las relaciones mecanografiadas entre ellas: comentarios, refutaciones, resúmenes y continuaciones."
  fr: "Un catalogue d'autorité IFLA-LRM/RDA de plus de 230 000 ouvrages et 116 000 agents, partagé par onze bibliothèques (dont l'IDEO au Caire, la Bibliothèque apostolique vaticane, l'Institut des manuscrits arabes de la Ligue arabe et d'autres) et géré depuis 2021 par le LRM-CS à Paris. Il recense les œuvres, leurs éditions et traductions, ainsi que les relations dactylographiées entre les œuvres: commentaires, réfutations, abrégés et suites."
  tr: "2021'den beri Paris'teki LRM-CS Merkezi tarafından yönetilen ve IFLA-LRM/RDA standardına sahip bir referans dizini, 230.000'den fazla eser ve 116.000 ismi içeren ve on bir kütüphane tarafından paylaşılan (Kahire'deki Dominik Doğu Araştırmaları Enstitüsü, Vatikan Apostolik Kütüphanesi, Arap Birliği'ne bağlı Arap El Yazmaları Enstitüsü ve diğerleri) tarafından paylaşılmaktadır. Eserleri, baskılarını, çevirilerini ve eserler arasındaki yetkili ilişkileri kaydeder: yorumlar, yanıtlar, kısaltmalar ve devam eserleri."
  id: "Indeks referensi dengan standar IFLA-LRM/RDA yang mencakup lebih dari 230.000 karya dan 116.000 nama, dibagikan oleh sebelas perpustakaan (Institut Dominikan Studi Oriental di Kairo, Perpustakaan Apostolik Vatikan, Institut Manuskrip Arab yang berafiliasi dengan Liga Negara-negara Arab, dan lainnya), dikelola sejak 2021 oleh LRM-CS Center di Paris. Indeks ini mencatat karya, edisi, terjemahan, dan hubungan resmi antar karya: komentar, tanggapan, singkatan, dan sekuel."
title: "IDEO Diamond / AlKindi — General Diamond Catalog"
