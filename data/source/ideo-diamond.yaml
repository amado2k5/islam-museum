reliability_note: "An institutional authority catalogue built natively on IFLA-LRM/RDA by professional cataloguers, with records designed to be precise and sourced; strong for bibliographic facts — authorship and attribution, work identity across editions and translations, edition history, and typed work-to-work relations (commentary on, refutation of, abridgement of, sequel to) — and for author dates and teacher/disciple relations as corroboration. Cite as {cite:ideo-diamond work/1781} for a work or {cite:ideo-diamond agent/<id>} for a person or organisation; the record resolves by appending the anchor to https://ideo.diamondrda.org/ (for example work 1781 is al-Jahiz's al-Bukhala'). Never a source for the contents of a work: the museum mines the book itself for that. Licensing: no licence for the catalogue data is published anywhere (verified 8 November 2026); LRM-CS states an open-data ethos, which is not a licence, so the museum's posture is facts-only with attribution until terms are confirmed in writing — record text is never republished and no bulk harvest is run (no public API or dump exists; the machine channel today is the Wikidata crosswalk, properties P8795 for agents and P11979 for works). Not any other 'Diamond' database: this is the IDEO/LRM-CS catalogue, originally named AlKindi. Assessment: ~/workspace research of 8 November 2026 (IDEO and LRM-CS documentation, Wikidata property records); the live OPAC returned 403 to the research fetcher, so record pages themselves were corroborated through Wikidata formatter URLs and AlFehrest's outbound links rather than opened directly."
