summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي بن الحسين الهاشمي ⁦(1879 – 13 فبراير 1935)⁩، أكبر أبناء الشريف حسين بن علي، ملك الحجاز وشريف مكة من أكتوبر 1924 حتى خلعه ابن سعود في ديسمبر 1925؛ تروي تعليمه في إسطنبول وقيادته في الثورة العربية وتوليه الملك بعد تنازل أبيه ولجوءه إلى العراق ووفاته في بغداد وأولاده ومنهم الوصي عبد الإله."
  en: "English Wikipedia article on Ali bin Hussein al-Hashimi (1879 – 13 February 1935), eldest son of Sharif Hussein bin Ali, King of Hejaz and Grand Sharif of Mecca from October 1924 until deposed by Ibn Saud in December 1925; it recounts his education at Istanbul, his part in the Arab Revolt, his accession on his father's abdication, his flight to Iraq, his death at Baghdad, and his children including the regent Abd al-Ilah."
  es: "Artículo de la Wikipedia en inglés sobre Ali bin Hussein al-Hashimi (1879 – 13 de febrero de 1935), hijo mayor del jerife Hussein bin Ali, rey del Hiyaz y gran jerife de La Meca desde octubre de 1924 hasta su deposición por Ibn Saud en diciembre de 1925; relata su educación en Estambul, su participación en la Revuelta Árabe, su ascenso al trono tras la abdicación de su padre, su huida a Irak, su muerte en Bagdad y sus hijos, incluido el regente Abd al-Ilah."
  fr: "Article de Wikipédia en anglais sur Ali bin Hussein al-Hashimi (1879 – 13 février 1935), fils aîné du chérif Hussein bin Ali, roi du Hedjaz et grand chérif de La Mecque d'octobre 1924 jusqu'à sa destitution par Ibn Saud en décembre 1925; il relate son éducation à Istanbul, son rôle dans la révolte arabe, son accession au trône après l'abdication de son père, sa fuite en Irak, sa mort à Bagdad et ses enfants, dont le régent Abd al-Ilah."
  ur: "علی بن حسین الہاشمی ⁦(1879 - 13 فروری 1935)⁩ پر انگریزی ویکیپیڈیا کا مضمون، شریف حسین بن علی کے بڑے بیٹے، حجاز کے بادشاہ اور مکہ کے عظیم الشان شریف اکتوبر 1924 سے دسمبر 1925 میں ابن سعود کے ہاتھوں معزول ہونے تک؛ اس میں استنبول میں اس کی تعلیم، عرب بغاوت میں اس کا حصہ، اپنے والد کے دستبردار ہونے پر اس کا الحاق، عراق کے لیے اس کی پرواز، بغداد میں اس کی موت، اور اس کے بچوں بشمول ریجنٹ عبد الالہ کا ذکر ہے۔"
  tr: "İngilizce Wikipedia'daki makale, Hicaz Kralı ve Aralık 1925'ten Aralık 1925'te İbn Suud tarafından tahttan indirilmesine kadar Hicaz Kralı ve Mekke Şerifi Şerif Hüseyin bin Ali'nin en büyük oğlu Ali bin Hüseyin El-Haşimi (1879 – 13 Şubat 1935) hakkında; İstanbul'daki eğitimini, Arap İsyanı'ndaki liderliğini, babasının tahttan çekilmesinden sonra tahta çıkışını, Irak'taki sığınmasını, Bağdat'taki ölümünü ve naip Abdul İlah dahil oğullarını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ali bin Al-Hussein Al-Hashimi (1879 – 13 Februari 1935), putra sulung Sharif Hussein bin Ali, Raja Hejaz dan Sharif Mekah dari Oktober 1924 hingga digulingkannya oleh Ibn Saud pada Desember 1925; artikel ini menceritakan pendidikannya di Istanbul, kepemimpinannya dalam Pemberontakan Arab, naiknya ke tahta setelah ayahnya turun tahta, perlindungannya di Irak, kematiannya di Baghdad, dan putra-putranya, termasuk wali Abdul Ilah."
