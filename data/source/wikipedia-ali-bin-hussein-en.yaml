  ar: "مقالة ويكيبيديا الإنجليزية عن علي بن الحسين الهاشمي (1879 – 13 فبراير 1935)، أكبر أبناء الشريف حسين بن علي، ملك الحجاز وشريف مكة من أكتوبر 1924 حتى خلعه ابن سعود في ديسمبر 1925؛ تروي تعليمه في إسطنبول وقيادته في الثورة العربية وتوليه الملك بعد تنازل أبيه ولجوءه إلى العراق ووفاته في بغداد وأولاده ومنهم الوصي عبد الإله."
  en: "English Wikipedia article on Ali bin Hussein al-Hashimi (1879 – 13 February 1935), eldest son of Sharif Hussein bin Ali, King of Hejaz and Grand Sharif of Mecca from October 1924 until deposed by Ibn Saud in December 1925; it recounts his education at Istanbul, his part in the Arab Revolt, his accession on his father's abdication, his flight to Iraq, his death at Baghdad, and his children including the regent Abd al-Ilah."
