summary:
  ar: "مقالة ويكيبيديا التركية عن عبد الله جودت؛ تُستخدم لوقائع الكيان فقط. تعطي الميلاد والوفاة نفسَيهما الواردَين في المقالة الإنجليزية، وتصف نشاطه في «إجتهاد» ومحاكماته، وتذكر أنه وُصف بأنه متّهم بترك الدين عند جنازته."
  en: "Turkish Wikipedia article on Abdullah Cevdet; used for entity facts only. It gives the same birth and death as the English article, describes his İctihad publishing and his prosecutions, and records that at his funeral he was described as accused of irreligion."
  es: "Artículo de la Wikipedia en turco sobre Abdullah Cevdet; utilizado únicamente para datos sobre la persona. Indica la misma fecha de nacimiento y muerte que el artículo en inglés, describe su publicación en el İctihad y sus procesamientos, y registra que en su funeral se le acusó de irreligión."
  fr: "Article de Wikipédia en turc sur Abdullah Cevdet; utilisé uniquement pour les informations relatives à l’entité. Il indique les mêmes dates de naissance et de décès que l’article en anglais, décrit ses publications d’İctihad et les poursuites judiciaires dont il a fait l’objet, et rapporte qu’à ses funérailles, il fut accusé d’irréligion."
  ur: "عبداللہ Cevdet پر ترکی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ وہی پیدائش اور موت دیتا ہے جیسا کہ انگریزی مضمون، اس کی اقتداء کی اشاعت اور اس کے استغاثہ کو بیان کرتا ہے، اور یہ ریکارڈ کرتا ہے کہ اس کے جنازے کے موقع پر اسے غیر مذہب کا ملزم قرار دیا گیا تھا۔"
