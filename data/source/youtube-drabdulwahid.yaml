summary:
  ar: "القناة الرسمية للدكتور عبدالواحد محمد صالح على يوتيوب؛ بدأت في 5 نوفمبر 2015 وتنشر محاضراته، ووصفها يربط صفحته على فيسبوك وحساباته على إنستغرام."
  en: "The official YouTube channel of Dr Abdulwahid Muhammed Salih (@drabdulwahid), started on 5 November 2015, carrying his lectures; its description links his Facebook page and his Instagram accounts."
  es: "El canal oficial de YouTube del Dr. Abdulwahid Muhammed Salih (@drabdulwahid), que comenzó el 5 de noviembre de 2015, publica sus conferencias; en su descripción se incluyen enlaces a su página de Facebook y a sus cuentas de Instagram."
  fr: "La chaîne YouTube officielle du Dr Abdulwahid Muhammed Salih (@drabdulwahid), lancée le 5 novembre 2015, diffuse ses conférences; sa description renvoie à sa page Facebook et à ses comptes Instagram."
  ur: "ڈاکٹر عبدالواحد محمد صالح (@drabdulwahid) کا آفیشل یوٹیوب چینل 5 نومبر 2015 کو شروع ہوا، جس میں ان کے لیکچرز تھے۔ اس کی تفصیل اس کے فیس بک پیج اور انسٹاگرام اکاؤنٹس کو لنک کرتی ہے۔"
  tr: "Dr. Abdulwahid Mohammed Saleh'in resmi YouTube kanalı 5 Kasım 2015'te başladı ve Facebook sayfası ile Instagram hesaplarını bağlantılı açıklamalarıyla birlikte konferanslarını yayınlıyor."
  id: "Saluran YouTube resmi Dr. Abdulwahid Mohammed Saleh dimulai pada 5 November 2015, dan menerbitkan kuliahnya, dengan deskripsinya yang menautkan halaman Facebook dan akun Instagram-nya."
