summary:
  ar: "مقالة ويكيبيديا العربية عن العلّامة والمحقق محمود محمد شاكر ⁦(أبي فهر)⁩؛ لوقائع الكيان فقط: مولده بالإسكندرية في 10 المحرم 1327هـ / 1 فبراير 1909، ودراسته وتركه الجامعة في 1928، وكتابه «المتنبي» (1936)، وتحقيقاته ⁦(تفسير الطبري، طبقات فحول الشعراء، دلائل الإعجاز)⁩، ومعركتيه مع طه حسين ولويس عوض، وعضويته في مجمعي القاهرة ودمشق، وجائزة الملك فيصل، ووفاته بالقاهرة في 3 ربيع الآخر 1418هـ / 7 أغسطس 1997؛ وتستند إلى موسوعة الديانة التركية (TDV) ومعجم الجبوري."
  en: "Arabic Wikipedia article on the scholar and editor Mahmud Muhammad Shakir (Abu Fihr); entity facts only: birth in Alexandria on 10 Muharram 1327 / 1 February 1909, his studies and leaving the university in 1928, his 'al-Mutanabbi' (1936), his editions (al-Tabari's Tafsir, Tabaqat Fuhul al-Shu'ara, Dala'il al-I'jaz), his two controversies with Taha Husayn and Louis Awad, his membership of the Cairo and Damascus academies, the King Faisal Prize, and death in Cairo on 3 Rabi' II 1418 / 7 August 1997; it cites the TDV İslâm Ansiklopedisi and al-Juburi's dictionary."
