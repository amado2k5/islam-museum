summary:
  ar: "مقالة ويكيبيديا العربية عن العلّامة والمحقق محمود محمد شاكر ⁦(أبي فهر)⁩؛ لوقائع الكيان فقط: مولده بالإسكندرية في 10 المحرم 1327هـ / 1 فبراير 1909، ودراسته وتركه الجامعة في 1928، وكتابه «المتنبي» (1936)، وتحقيقاته ⁦(تفسير الطبري، طبقات فحول الشعراء، دلائل الإعجاز)⁩، ومعركتيه مع طه حسين ولويس عوض، وعضويته في مجمعي القاهرة ودمشق، وجائزة الملك فيصل، ووفاته بالقاهرة في 3 ربيع الآخر 1418هـ / 7 أغسطس 1997؛ وتستند إلى موسوعة الديانة التركية (TDV) ومعجم الجبوري."
  en: "Arabic Wikipedia article on the scholar and editor Mahmud Muhammad Shakir (Abu Fihr); entity facts only: birth in Alexandria on 10 Muharram 1327 / 1 February 1909, his studies and leaving the university in 1928, his 'al-Mutanabbi' (1936), his editions (al-Tabari's Tafsir, Tabaqat Fuhul al-Shu'ara, Dala'il al-I'jaz), his two controversies with Taha Husayn and Louis Awad, his membership of the Cairo and Damascus academies, the King Faisal Prize, and death in Cairo on 3 Rabi' II 1418 / 7 August 1997; it cites the TDV İslâm Ansiklopedisi and al-Juburi's dictionary."
  es: "Artículo en la Wikipedia en árabe sobre el erudito y editor Mahmud Muhammad Shakir (Abu Fihr); solo datos sobre la entidad: nacimiento en Alejandría el 10 de Muharram de 1327 / 1 de febrero de 1909, sus estudios y abandono de la universidad en 1928, su 'al-Mutanabbi' (1936), sus ediciones (el Tafsir de al-Tabari, Tabaqat Fuhul al-Shu'ara, Dala'il al-I'jaz), sus dos controversias con Taha Husayn y Louis Awad, su pertenencia a las academias de El Cairo y Damasco, el Premio Rey Faisal y su muerte en El Cairo el 3 de Rabi' II de 1418 / 7 de agosto de 1997; cita el TDV İslâm Ansiklopedisi y el diccionario de al-Juburi."
  fr: "Article de Wikipédia en arabe sur l'érudit et éditeur Mahmud Muhammad Shakir (Abu Fihr); informations biographiques uniquement: naissance à Alexandrie le 10 Muharram 1327 / 1er février 1909, ses études et son départ de l'université en 1928, son ouvrage « al-Mutanabbi » (1936), ses éditions (le Tafsir d'al-Tabari, Tabaqat Fuhul al-Shu'ara, Dala'il al-I'jaz), ses deux controverses avec Taha Husayn et Louis Awad, son appartenance aux académies du Caire et de Damas, le prix du roi Faisal et sa mort au Caire le 3 Rabi' II 1418 / 7 août 1997; il cite l'ouvrage TDV İslâm Ansiklopedisi et le dictionnaire d'al-Juburi."
  ur: "عالم اور ایڈیٹر محمود محمد شاکر ⁦(ابو فہر)⁩ پر عربی ویکیپیڈیا کا مضمون؛ ہستی کے حقائق صرف: اسکندریہ میں 10 محرم 1327/1 فروری 1909 کو پیدائش، ان کی تعلیم اور 1928 میں یونیورسٹی سے نکلنا، اس کا 'المتنبی' (1936)، اس کے ایڈیشن ⁦(الطبری کی تفسیر، طبقات فضیلۃ الشعراء، دلائل الزائل اور ان کے دو نسخے)⁩۔ لوئس عواد، ان کی قاہرہ اور دمشق اکیڈمیوں کی رکنیت، شاہ فیصل انعام، اور وفات 3 ربیع الثانی 1418/7 اگست 1997 کو قاہرہ میں۔ اس میں TDV İslâm Ansiklopedisi اور الجبوری کی لغت کا حوالہ دیا گیا ہے۔"
  tr: "Bilgin ve araştırmacı Mahmud Muhammed Şakir (Ebu Fihr) hakkında Arapça Vikipedi makalesi; varlığın olayları için: 10 Muharrem 1327 Hicri / 1 Şubat 1909'da İskenderiye'de doğumu, 1928'de üniversiteden ayrılması ve eğitimi, 'Al-Mutanabbi' (1936) kitabı, araştırmaları (Tafsir al-Tabari, Tabaqat Fuhl al-Shu'ara, Dalail al-I'jaz), Taha Hüseyin ve Louis Awad ile mücadeleleri, Kahire ve Şam Kolejlerine üyeliği, Kral Faysal Ödülü ve 3 Rabi'al-Thani 1418 Hicri / 7 Ağustos 1997'de Kahire'de ölümü; Türk Din Ansiklopedisi (TDV) ve Al-Jubouri'nin Sözlüğü'ne dayanmaktadır."
  id: "Artikel Wikipedia bahasa Arab tentang cendekiawan dan peneliti Mahmoud Muhammad Shakir (Abu Fihr); hanya untuk peristiwa entitas tersebut: kelahirannya di Alexandria pada 10 Muharram 1327 H / 1 Februari 1909, studinya dan lulus dari universitas pada 1928, bukunya 'Al-Mutanabbi' (1936), penyelidikannya (Tafsir al-Tabari, Tabaqat Fuhl al-Shu'ara, Dalail al-I'jaz), pertarungannya dengan Taha Hussein dan Louis Awad, keanggotaannya di Perguruan Tinggi Kairo dan Damaskus, Penghargaan Raja Faisal, dan kematiannya di Kairo pada 3 Rabi al-Thani 1418 AH / 7 Agustus 1997; berdasarkan Ensiklopedia Agama Turki (TDV) dan Kamus Al-Jubouri."
