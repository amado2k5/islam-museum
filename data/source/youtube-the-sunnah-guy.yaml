label: { ar: "فتى السنة — قناة يوتيوب", en: "The Sunnah Guy — YouTube channel" }
summary:
  ar: "قناة شعيب حسين على يوتيوب باسم شخصيته «فتى السنة»، تضم مقاطعه القصيرة في التذكير والدعوة؛ ويظهر معرفه @thesunnahguy في وصف مقطع «نحو الأبدية» الذي يسمّيه باسمه."
  en: "Shoaib Hussain's YouTube channel under his persona The Sunnah Guy, carrying his short dawah reminder videos; the handle @thesunnahguy is printed in the Towards Eternity video description that names him."
  es: "El canal de YouTube de Shoaib Hussain, bajo su seudónimo The Sunnah Guy, presenta sus videos cortos de recordatorio de dawah; el nombre de usuario @thesunnahguy está impreso en la descripción del video Towards Eternity que lo menciona."
  fr: "La chaîne YouTube de Shoaib Hussain, sous son pseudonyme The Sunnah Guy, diffuse ses courtes vidéos de rappel de la dawah; le nom d'utilisateur @thesunnahguy est imprimé dans la description de la vidéo Towards Eternity qui le mentionne."
  ur: "شعیب حسین کا یوٹیوب چینل ان کی شخصیت The Sunnah Guy کے تحت، ان کی مختصر دعوتی یاددہانی ویڈیوز لے کر؛ @thesunnahguy ہینڈل Towards Eternity ویڈیو کی تفصیل میں پرنٹ کیا گیا ہے جس میں اس کا نام ہے۔"
  tr: "Shuaib Hussein'in YouTube kanalı, kısa kliplerini hatırlatma ve davetlerde \"Yılın Çocuğu\" kişiliğinden esinlenerek adlandırılmıştır; @thesunnahguy bilgisi, adını verdiği \"Sonsuzluğa Doğru\" klibinin açıklamasında yer alır."
  id: "Channel YouTube Shuaib Hussein dinamai sesuai kepribadiannya \"Anak Laki-laki Tahun Ini,\" menampilkan klip pendeknya sebagai pengingat dan undangan; pengetahuan @thesunnahguy-nya muncul dalam deskripsi klip \"Menuju Keabadian,\" yang ia namai sesuai namanya."
