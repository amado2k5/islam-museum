  ar: "مقالة ويكيبيديا الأذربيجانية عن خورشيدبانو ناتوان؛ تُستخدم لوقائع الكيان فقط. سيرة وافية: ميلادها في شوشا في 6 أغسطس 1832 ووفاتها فيها في 2 أكتوبر 1897، وطفولتها التي حفظت فيها آيات القرآن والأحكام الدينية إلى جانب العلوم الدنيوية، واتخاذها لقب «ناتوان» من سنة 1870، ومجلسها الأدبي وخيريتها. لا تسمي مذهبًا لها."
  en: "Azerbaijani Wikipedia article on Khurshidbanu Natavan; used for entity facts only. A full biography: her birth at Shusha on 6 August 1832 and death there on 2 October 1897, a childhood in which she memorised Qur'an verses and religious rulings alongside secular subjects, her adoption of the pen name Natavan from 1870, her literary majlis and her philanthropy. It names no school for her."
