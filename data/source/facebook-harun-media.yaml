summary:
  ar: "صفحة هارون ميديا على فيسبوك (facebook.com/haruntube)؛ 570,000 متابع بحسب بيانات وصفية لمنشور على فيسبوك مؤرخ في 1 مارس 2026 قرأها حصاد الموجة 195 في 7 نوفمبر 2026 — جلب صفحات فيسبوك محظور في هذه البيئة، فهذا الرقم ليس قراءة مباشرة في هذه الجولة."
  en: "Harun Media's Facebook page (facebook.com/haruntube): 570,000 followers by Facebook post metadata on a post dated 1 March 2026, read by the wave-195 harvest on 7 November 2026 — Facebook page fetch is blocked in this environment, so this figure is not a direct read in this run."
  es: "Página de Facebook de Harun Media (facebook.com/haruntube): 570.000 seguidores según los metadatos de una publicación de Facebook del 1 de marzo de 2026, leída por la cosecha wave-195 el 7 de noviembre de 2026. La obtención de páginas de Facebook está bloqueada en este entorno, por lo que esta cifra no es una lectura directa en esta ejecución."
  fr: "La page Facebook de Harun Media (facebook.com/haruntube): 570 000 abonnés selon les métadonnées d'une publication Facebook datée du 1er mars 2026, lues par la récolte de la vague 195 le 7 novembre 2026 — La récupération de la page Facebook est bloquée dans cet environnement, ce chiffre ne correspond donc pas à une lecture directe dans cette exécution."
  ur: "ہارون میڈیا کا فیس بک پیج (facebook.com/haruntube): 570,000 فالوورز فیس بک پوسٹ میٹا ڈیٹا کے ذریعے 1 مارچ 2026 کی پوسٹ پر، 7 نومبر 2026 کو ویو-195 ہارویسٹ کے ذریعے پڑھا گیا — فیس بک پیج فیچ اس ماحول میں بلاک ہے، اس لیے یہ اعداد و شمار اس رن میں براہ راست نہیں پڑھے گئے ہیں۔"
  tr: "Harun Media Facebook sayfası (facebook.com/haruntube); 570.000 takipçi 1 Mart 2026 tarihli ve 7 Kasım 2026'da Wave Harvest 195 tarafından okunan bir Facebook gönderisinin meta verilerine göre — Facebook sayfalarının açılması bu ortamda yasaktır, çünkü bu sayı bu turda doğrudan bir okuma değildir."
  id: "Halaman Facebook Harun Media (facebook.com/haruntube); 570.000 pengikut Menurut metadata untuk postingan Facebook tertanggal 1 Maret 2026, dibacakan oleh Wave Harvest 195 pada 7 November 2026 — Membawa halaman Facebook dilarang dalam lingkungan ini, karena angka ini bukan pembacaan langsung dalam putaran ini."
