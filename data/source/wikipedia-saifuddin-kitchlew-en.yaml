summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيف الدين كتشلو؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أمريتسار سنة 1888 في أسرة كشميرية بنديتية اعتنقت الإسلام، ودراسته في كامبريدج وألمانيا وممارسته المحاماة، وقيادته احتجاجات رولات واعتقاله قبل مذبحة جليانوالا باغ، وسنوات سجنه، ومعارضته التقسيم، وجائزة ستالين للسلام، ووفاته في دلهي سنة 1963."
  en: "English Wikipedia article on Saifuddin Kitchlew; used for entity facts only. It recounts his 1888 birth at Amritsar into a Kashmiri Pandit family that had converted to Islam, his studies at Cambridge and in Germany and his legal practice, his leadership of the Rowlatt protests and the arrest that preceded the Jallianwala Bagh massacre, his years in prison, his opposition to Partition, the Stalin Peace Prize, and his death at Delhi in 1963."
