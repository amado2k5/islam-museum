summary:
  ar: "الملف التعريفي لعمر هشام العربي في بودكاست «مسلم سنترال»؛ يصفه بأنه مقرئ مصري يقرأ برواية حفص عن عاصم وله تسجيل كامل للقرآن، وأن البودكاست يعمل منذ 8 يوليو 2019."
  en: "Muslim Central's podcast profile of Omar Hisham Al Arabi; it describes him as an Egyptian Qur'an reciter who recites in the Hafs 'an Asim narration with a full recorded recitation of the Qur'an, and dates the podcast from 8 July 2019."
  es: "Perfil de Omar Hisham Al Arabi en el podcast de Muslim Central; lo describe como un recitador egipcio del Corán que recita en la narración Hafs 'an Asim con una recitación completa grabada del Corán, y fecha el podcast el 8 de julio de 2019."
  fr: "Le podcast de Muslim Central présente Omar Hisham Al Arabi; il le décrit comme un récitateur égyptien du Coran qui récite selon la narration de Hafs 'an Asim avec une récitation complète enregistrée du Coran, et date le podcast du 8 juillet 2019."
  ur: "مسلم سنٹرل کا عمر ہشام العربی کا پوڈ کاسٹ پروفائل؛ اس میں اسے ایک مصری قرآن قاری کے طور پر بیان کیا گیا ہے جو حفص کی عاصم روایت میں قرآن کی مکمل ریکارڈ شدہ تلاوت کے ساتھ تلاوت کرتا ہے، اور پوڈ کاسٹ کی تاریخ 8 جولائی 2019 سے ہے۔"
