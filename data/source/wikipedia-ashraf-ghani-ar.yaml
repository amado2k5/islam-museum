summary:
  ar: "مقالة ويكيبيديا العربية عن أشرف غني؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 19 مايو 1949 في ولاية لوكر، ورئاسته لأفغانستان من سبتمبر 2014 حتى مغادرته في 15 أغسطس 2021، ووزارته للمالية ورئاسته لجامعة كابل وعمله في البنك الدولي. يعطي صندوق معلوماتها دينه «الإسلام» عموماً دون مذهب."
  en: "Arabic Wikipedia article on Ashraf Ghani; used for entity facts only. It recounts his birth on 19 May 1949 in Logar Province, his presidency of Afghanistan from September 2014 until his departure on 15 August 2021, his finance ministry, his chancellorship of Kabul University and his World Bank work. Its infobox gives his religion generically as Islam, with no school."
  ur: "اشرف غنی پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 19 مئی 1949ء کو صوبہ لوگر میں ان کی پیدائش، ستمبر 2014ء سے 15 اگست 2021ء کو روانگی تک افغانستان کی صدارت، وزارت خزانہ، جامعہ کابل کی چانسلری اور عالمی بنک کا کام بیان ہوا ہے۔ اس کے معلوماتی خانے میں ان کا مذہب عمومی طور پر اسلام درج ہے، کوئی مسلک نہیں۔"
