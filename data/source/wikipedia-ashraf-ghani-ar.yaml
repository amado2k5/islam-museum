summary:
  ar: "مقالة ويكيبيديا العربية عن أشرف غني؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 19 مايو 1949 في ولاية لوكر، ورئاسته لأفغانستان من سبتمبر 2014 حتى مغادرته في 15 أغسطس 2021، ووزارته للمالية ورئاسته لجامعة كابل وعمله في البنك الدولي. يعطي صندوق معلوماتها دينه «الإسلام» عموماً دون مذهب."
  en: "Arabic Wikipedia article on Ashraf Ghani; used for entity facts only. It recounts his birth on 19 May 1949 in Logar Province, his presidency of Afghanistan from September 2014 until his departure on 15 August 2021, his finance ministry, his chancellorship of Kabul University and his World Bank work. Its infobox gives his religion generically as Islam, with no school."
  ur: "اشرف غنی پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 19 مئی 1949ء کو صوبہ لوگر میں ان کی پیدائش، ستمبر 2014ء سے 15 اگست 2021ء کو روانگی تک افغانستان کی صدارت، وزارت خزانہ، جامعہ کابل کی چانسلری اور عالمی بنک کا کام بیان ہوا ہے۔ اس کے معلوماتی خانے میں ان کا مذہب عمومی طور پر اسلام درج ہے، کوئی مسلک نہیں۔"
  es: "Artículo de Wikipedia en árabe sobre Ashraf Ghani; utilizado únicamente para datos biográficos. Relata su nacimiento el 19 de mayo de 1949 en la provincia de Logar, su presidencia de Afganistán desde septiembre de 2014 hasta su dimisión el 15 de agosto de 2021, su ministerio de finanzas, su rectorado de la Universidad de Kabul y su trabajo en el Banco Mundial. Su ficha informativa indica que su religión es el islam, sin mencionar ninguna escuela a la que pertenezca."
  fr: "Article Wikipédia en arabe consacré à Ashraf Ghani; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance le 19 mai 1949 dans la province de Logar, sa présidence de l'Afghanistan de septembre 2014 à son départ le 15 août 2021, son ministère des Finances, son poste de chancelier de l'université de Kaboul et son travail à la Banque mondiale. Son infobox indique sa religion comme étant l'islam, sans mention d'école religieuse."
  tr: "Ashraf Ghani hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 19 Mayıs 1949'da Lokar eyaletinde doğduğunu, Eylül 2014'ten 15 Ağustos 2021'de ayrılışına kadar Afganistan cumhurbaşkanlığını, Maliye Bakanlığını, Kabil Üniversitesi başkanlığını ve Dünya Bankası'ndaki çalışmalarını anlatır. Bilgi kutusu genellikle dini olarak herhangi bir mezhep olmadan \"İslam\" olarak verilir."
  id: "Artikel Wikipedia berbahasa Arab tentang Ashraf Ghani; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 19 Mei 1949 di provinsi Lokar, masa kepresidenannya di Afghanistan dari September 2014 hingga kepergiannya pada 15 Agustus 2021, Kementerian Keuangan, kepresidenannya di Universitas Kabul, dan pekerjaannya di Bank Dunia. Infobox umumnya mencantumkan agamanya sebagai \"Islam\" tanpa sekte apapun."
