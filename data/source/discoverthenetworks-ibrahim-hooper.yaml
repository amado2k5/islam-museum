summary:
  ar: "ملف «اكتشف الشبكات» عن إبراهيم هوبر، وهو ملف ناقد معادٍ لكير؛ يسمّيه دوغ هوبر سابقًا ومعتنقًا أبيض للإسلام وأحد مؤسسي كير ومتحدثه، وينقل تصريحه سنة 1993 عن رغبته في أن تصبح حكومة أمريكا إسلامية مستقبلًا بالتعليم لا بالعنف، وتصريحه سنة 2003 عن استبدال الدستور بالشريعة عند أغلبية مسلمة."
  en: "Discover the Networks profile of Ibrahim Hooper, a critical profile hostile to CAIR; it calls him formerly Doug Hooper, a white American convert to Islam and a CAIR founder and spokesman, and quotes his 1993 statement about wanting a future Islamic U.S. government through education, not violence, and his 2003 statement about a Muslim majority replacing the Constitution with Islamic law."
  es: "Descubra el perfil de Ibrahim Hooper en Networks, un perfil crítico y hostil a CAIR; en él se le identifica como Doug Hooper, un estadounidense blanco convertido al Islam y fundador y portavoz de CAIR, y se citan su declaración de 1993 sobre su deseo de un futuro gobierno islámico en Estados Unidos a través de la educación, no de la violencia, y su declaración de 2003 sobre una mayoría musulmana que reemplazaría la Constitución con la ley islámica."
  fr: "Découvrez le profil d'Ibrahim Hooper sur Networks, un profil critique hostile au CAIR; il le décrit comme anciennement Doug Hooper, un Américain blanc converti à l'islam, fondateur et porte-parole du CAIR, et cite sa déclaration de 1993 sur son souhait d'un futur gouvernement islamique américain par l'éducation et non par la violence, ainsi que sa déclaration de 2003 sur une majorité musulmane remplaçant la Constitution par la loi islamique."
