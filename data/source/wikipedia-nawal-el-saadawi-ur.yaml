reliability_note: "WARNING — partial reliability. The article's biographical frame (birth at Kafr Tahla on 27 October 1931, medical graduation in 1955, posts held, the Arab Women's Solidarity Association, the 1981 imprisonment, death at Cairo on 21 March 2021) agrees with the English and Arabic articles and is usable under the Wikipedia broad rule. Its 'beliefs' (عقائد) section, however, is an unsourced polemical attack: it attributes extreme statements to her without citations, claims unnamed scholars issued rulings of unbelief against her, and gives her age at death as 90 where she was 89. Nothing from that section is used anywhere in her record. Read in full on 24 October 2026."
