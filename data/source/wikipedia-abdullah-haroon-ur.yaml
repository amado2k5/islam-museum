  ar: "مقالة ويكيبيديا الأردية «عبد الله هارون»؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1872 في كراتشي في أسرة فقيرة من برادري الكتشي ميمون، ونجاحه في التجارة، وعمله في تحريك باكستان إلى جانب محمد علي جناح، وبناءه مدارس ومساجد وملاجئ أيتام، ووفاته في أبريل 1942 ودفنه في كراتشي."
  en: "Urdu Wikipedia article 'Abdullah Haroon'; used for entity facts only. It gives his birth in 1872 at Karachi into a poor family of the Kachhi Memon community, his success in trade, his Pakistan Movement work alongside Muhammad Ali Jinnah, his building of schools, mosques and orphanages, and his death in April 1942 and burial at Karachi."
