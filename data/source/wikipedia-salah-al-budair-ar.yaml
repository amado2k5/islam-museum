  ar: "مقالة ويكيبيديا العربية عن صلاح البدير؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بالهفوف في الأحساء مقترناً بيناير سنة 1390هـ إلى جانب 1970، ونسبه إلى بني تميم، وإماماته بالدمام والرياض والمسجد النبوي، وقضاءه، ودكتوراه سنة 2023؛ وصندوقها يعطي ديانته مسلم فقط."
  en: "Arabic Wikipedia article on Salah Al-Budair; used for entity facts only. It gives his birth at Hofuf in Al-Ahsa, pairing January with 1390 AH alongside 1970, his Banu Tamim descent, his imamates at Dammam, Riyadh and the Prophet's Mosque, his judgeship, and his 2023 doctorate; its infobox gives his religion as Muslim only."
