summary:
  ar: "مقالة ويكيبيديا العربية عن صلاح البدير؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بالهفوف في الأحساء مقترناً بيناير سنة 1390هـ إلى جانب 1970، ونسبه إلى بني تميم، وإماماته بالدمام والرياض والمسجد النبوي، وقضاءه، ودكتوراه سنة 2023؛ وصندوقها يعطي ديانته مسلم فقط."
  en: "Arabic Wikipedia article on Salah Al-Budair; used for entity facts only. It gives his birth at Hofuf in Al-Ahsa, pairing January with 1390 AH alongside 1970, his Banu Tamim descent, his imamates at Dammam, Riyadh and the Prophet's Mosque, his judgeship, and his 2023 doctorate; its infobox gives his religion as Muslim only."
  es: "Artículo de Wikipedia en árabe sobre Salah Al-Budair; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Hofuf, en Al-Ahsa, relacionando enero de 1390 AH con 1970, su ascendencia Banu Tamim, sus imamatos en Dammam, Riad y la Mezquita del Profeta, su nombramiento como juez y su doctorado en 2023; su ficha informativa solo indica que era musulmán."
  fr: "Article Wikipédia en arabe sur Salah Al-Budair; utilisé uniquement pour les informations le concernant. Il indique sa naissance à Hofuf, dans la région d'Al-Ahsa, en janvier 1390 AH (en référence à 1970), son appartenance à la tribu des Banu Tamim, ses imamats à Dammam, Riyad et à la Mosquée du Prophète, sa fonction de juge et son doctorat obtenu en 2023; son infobox précise qu'il était musulman."
  ur: "صلاح البدیر پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ الاحساء میں ہفوف میں ان کی ولادت، جنوری 1390 ہجری کے ساتھ 1970 کے ساتھ جوڑتا ہے، اس کی نسل بنو تمیم، دمام، ریاض اور مسجد نبوی میں اس کے ائمہ، اس کی جج شپ، اور اس کی 2023 میں ڈاکٹریٹ؛ اس کا انفو باکس اس کا مذہب صرف مسلمان کے طور پر دیتا ہے۔"
  tr: "Salah Al-Budair hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunun Al-Ahsa'daki Al-Hofuf'ta olduğunu, 1970 Ocak ayına denk geldiğini ve ayrıca 1390 Hicri'ye denk geldiğini, Bani Tamim'e olan soyunu, Riyad'daki Dammam ve Peygamber Camii imamlarını, yargısını ve 2023'te doktorasını belirtir; ve fonu sadece dinini Müslüman olarak gösterir."
  id: "Artikel Wikipedia Arab tentang Salah Al-Budair; digunakan hanya untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya di Al-Hofuf di Al-Ahsa, bertepatan dengan Januari 1390 HH, selain 1970, garis keturunannya dengan Bani Tamim, imam-imamnya di Dammam, Riyadh, dan Masjid Nabi, peradilannya, serta gelar doktornya pada 2023; dan dana tersebut hanya menyebutkan agamanya sebagai Muslim."
