summary:
  ar: "مقالة ويكيبيديا العربية عن تقي الدين النبهاني؛ تُستخدم لوقائع الكيان فقط. تذكر أنه من مواليد 1914 في إجزم بفلسطين «في الراجح من الأقوال» (1332هـ)، ونال الشهادة العالمية في الشريعة من الأزهر عام 1932، وعمل قاضيًا في محكمة الاستئناف في القدس، وأسّس حزب التحرير مطلع 1953، وتوفي سنة 1977 في غرة محرم 1398هـ، وتنقل نسبه الكامل إلى قبيلة بني نبهان، وأن أمه أخذت علمها عن والدها الشيخ يوسف النبهاني."
  en: "Arabic Wikipedia article on Taqi al-Din al-Nabhani; used for entity facts only. It gives his birth at Ijzim in Palestine in 1914 (1332 AH) 'on the preponderant view', his al-Azhar degree in Sharia in 1932, his judgeship at Jerusalem's court of appeal, his founding of Hizb ut-Tahrir at the start of 1953, and his death in 1977 on 1 Muharram 1398 AH; it carries his full nasab to the Bani Nabhan tribe and records that his mother took her learning from her father, Shaykh Yusuf al-Nabhani."
