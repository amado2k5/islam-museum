reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md), read in full on 1 November 2026 at the recorded revision, fetched via the MediaWiki API. It is an independent Arabic biography, not a translation of the English article. Points drawn from it: the lead (born 1914 at Ijzim; founded Hizb ut-Tahrir at the start of 1953; the world-degree in Sharia from al-Azhar in 1932; Sharia appeal judge in Jerusalem; died 1977 on 1 Muharram 1398); the nasab section, which runs his lineage through Yusuf ibn Isma'il ibn Yusuf ibn Isma'il ibn Muhammad Nasir al-Din al-Nabhani of the Bani Nabhan Tayyi' bedouin settled at Ijzim; the parents section, giving the preponderant birth year as 1332 AH / 1914 and recording that his mother gained her Sharia knowledge from her father Shaykh Yusuf (al-Nabhani), 'a Sufi poet and prominent judge' — the maternal-grandfather relation used in the record; his 1928 entry to the Azhar secondary school, the ghuraba' certificate, Dar al-Ulum, the judiciary ijaza and the 1932 world-degree; his posts (Haifa central court clerk, assistant judge, Ramla judge to 1948, Jerusalem Sharia judge, appeal judge until his 1950 resignation), lecturing in Amman to 1952, then full-time party work from 1953. The article names no legal school for the man himself."
