summary:
  ar: "مقالة ويكيبيديا العربية عن تقي الدين النبهاني؛ تُستخدم لوقائع الكيان فقط. تذكر أنه من مواليد 1914 في إجزم بفلسطين «في الراجح من الأقوال» ⁦(1332هـ)⁩، ونال الشهادة العالمية في الشريعة من الأزهر عام 1932، وعمل قاضيًا في محكمة الاستئناف في القدس، وأسّس حزب التحرير مطلع 1953، وتوفي سنة 1977 في غرة محرم 1398هـ، وتنقل نسبه الكامل إلى قبيلة بني نبهان، وأن أمه أخذت علمها عن والدها الشيخ يوسف النبهاني."
  en: "Arabic Wikipedia article on Taqi al-Din al-Nabhani; used for entity facts only. It gives his birth at Ijzim in Palestine in 1914 (1332 AH) 'on the preponderant view', his al-Azhar degree in Sharia in 1932, his judgeship at Jerusalem's court of appeal, his founding of Hizb ut-Tahrir at the start of 1953, and his death in 1977 on 1 Muharram 1398 AH; it carries his full nasab to the Bani Nabhan tribe and records that his mother took her learning from her father, Shaykh Yusuf al-Nabhani."
  es: "Artículo de Wikipedia en árabe sobre Taqi al-Din al-Nabhani; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Ijzim, Palestina, en 1914 (1332 AH), según la opinión predominante; su título de Sharia en Al-Azhar en 1932; su nombramiento como juez en el tribunal de apelaciones de Jerusalén; la fundación de Hizb ut-Tahrir a principios de 1953; y su fallecimiento en 1977, el 1 de Muharram de 1398 AH. También menciona su linaje completo en la tribu Bani Nabhan y registra que su madre recibió su enseñanza de su padre, el jeque Yusuf al-Nabhani."
  fr: "L'article de Wikipédia en arabe consacré à Taqi al-Din al-Nabhani, utilisé uniquement pour les informations le concernant, indique sa naissance à Ijzim en Palestine en 1914 (1332 AH) selon l'avis prépondérant, son diplôme d'al-Azhar en charia en 1932, sa fonction de juge à la cour d'appel de Jérusalem, la fondation du Hizb ut-Tahrir au début de 1953 et son décès le 1er Muharram 1398 AH en 1977. Il mentionne son appartenance à la tribu des Bani Nabhan et précise que sa mère a reçu son enseignement de son père, le cheikh Yusuf al-Nabhani."
  ur: "تقی الدین النبھانی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1914 ⁦(1332 ہجری)⁩ میں فلسطین میں ان کی ولادت ' پیش نظری کے لحاظ سے '، شریعت میں ان کی الازہر کی ڈگری 1932 میں، یروشلم کی اپیل کورٹ میں ان کی جج شپ، 1953 کے آغاز میں حزب التحریر کی بنیاد، اور 19 19 ہجری کو ان کی وفات؛ اس میں اس کا پورا نصاب بنی نبھان قبیلہ تک پہنچایا گیا ہے اور یہ ریکارڈ ہے کہ اس کی والدہ نے اسے اپنے والد شیخ یوسف النبھانی سے سیکھا تھا۔"
  tr: "Taqi al-Din al-Nabhani hakkında Arapça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 1914 yılında Filistin'in İczim kentinde \"en doğru görüşle\" (1332 Hicri) doğduğu, 1932'de El-Ezher'den uluslararası Şeriat sertifikası aldığı, Kudüs'teki Temyiz Mahkemesi'nde yargıç olarak çalıştığı, 1953 başında Hizb ut-Tahrir'i kurduğu, 1977'de 1398 Hicri Muharrem'de öldüğü ve tüm soyunun Bani Nabhan kabilesine dayandığı, annesinin ise bunu babası Şeyh Yusuf el-Nabhani'den öğrendiği belirtilmektedir."
  id: "Artikel Wikipedia bahasa Arab tentang Taqi al-Din al-Nabhani hanya digunakan untuk fakta-fakta entitas tersebut. Dicatat bahwa ia lahir pada tahun 1914 di Ijzim, Palestina, \"dengan pendapat yang paling benar\" (1332 H), memperoleh sertifikat internasional dalam Syariah dari Al-Azhar pada tahun 1932, bekerja sebagai hakim di Pengadilan Banding di Yerusalem, mendirikan Hizb ut-Tahrir pada awal tahun 1953, meninggal pada tahun 1977 pada tanggal 1 Muharram 1398 H, dan garis keturunannya penuh berasal dari suku Bani Nabhan, serta ibunya mempelajarinya dari ayahnya, Sheikh Yusuf al-Nabhani."
