  ur: "عائشہ حجانہ کے انسٹاگرام اکاؤنٹ کا سوشل وینس کا اسنیپ شاٹ: اس کے میٹرکس، جو 15 اپریل 2026 کو ریکارڈ کیے گئے، 1,350,000 فالوورز دیتے ہیں، اسے HIJANAH کی بانی اور ڈائریکٹر کے طور پر بیان کرتے ہیں، اور اس کے مقام کو جوہر بہرو کے طور پر محفوظ کرتے ہیں۔"
  tr: "Aisha Hayjana'nın Instagram hesabının Socialveins anlık görüntüsü; 15 Nisan 2026'da toplam 1.350.000 takipçi kaydetti ve onu Johor Bahru merkezli Hayjana'nın kurucusu ve direktörü olarak tanımladı."
  id: "Cuplikan akun Instagram Aisha Hayjana di Socialveins; metriknya mencatat total 1.350.000 pengikut pada 15 April 2026, yang menggambarkannya sebagai pendiri dan direktur Hayjana, yang berbasis di Johor Bahru."
