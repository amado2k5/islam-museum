summary:
  ar: "صفحة «أستُرونومي» في موسوعة TDV الإسلامية، وهي إحالة إلى مدخل «علم الفلك» (İLM-i FELEK) مع تعريف مختصر بأنه المصطلح المستعمل في تاريخ العلوم الإسلامية مقابل الفلك."
  en: "The TDV İslâm Ansiklopedisi page 'ASTRONOMİ', a cross-reference to the entry 'İLM-i FELEK', with a one-line definition of the term as used for astronomy in the history of Islamic science."
  es: "La página 'ASTRONOMİ' de TDV İslâm Ansiklopedisi, una referencia cruzada a la entrada 'İLM-i FELEK', con una definición de una sola línea del término tal como se usa para la astronomía en la historia de la ciencia islámica."
  fr: "La page « ASTRONOMİ » de l'encyclopédie islamique TDV İslâm Ansiklopedisi renvoie à l'entrée « İLM-i FELEK », avec une définition d'une ligne du terme tel qu'il est utilisé pour l'astronomie dans l'histoire des sciences islamiques."
  ur: "TDV İslâm Ansiklopedisi صفحہ 'ASTRONOMİ'، اندراج 'İLM-i FELEK' کا ایک کراس حوالہ، اسلامی سائنس کی تاریخ میں فلکیات کے لیے استعمال ہونے والی اصطلاح کی ایک سطری تعریف کے ساتھ۔"
  tr: "İslami TDV ansiklopedisindeki \"Astronomi\" sayfası, İslam bilimleri ile astronomi arasındaki tarihte kullanılan terim olarak kısa bir tanımla \"Astronomi\" (İLM-i FELEK) girişine bir göndermedir."
  id: "Halaman \"Astronomi\" dalam ensiklopedia Islam TDV merujuk pada entri \"Astronomi\" (İLM-i FELEK) dengan definisi singkat sebagai istilah yang digunakan dalam sejarah ilmu Islam versus astronomi."
