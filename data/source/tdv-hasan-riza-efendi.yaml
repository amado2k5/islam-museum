label: { en: "Hasan Rıza Efendi — TDV İslâm Ansiklopedisi" }
summary:
  ar: "مدخل موسوعة الإسلام التابعة لوقف الديانة التركي (TDV) عن حسن رضا أفندي بقلم م. أوغور درمان؛ تُستخدم لوقائع الكيان. يعطي ميلاده في أسكدار (1849–1920)، وتعلّمه عند يحيى حلمي ومحمد شفيق بك وأخذه التعليق عن سامي أفندي، وإمامته فرقة الموسيقى الهمايونية سنة 1871 وحجه سنة 1876 وخلافته شفيق بك في تعليم الخط سنة 1879، وتدريسه في مدرسة الخطاطين من 1914، ومصاحفه التسعة عشر وصحيح البخاري في ثمانية مجلدات للسلطان رشاد، ووفاته في 10 جمادى الآخرة 1338 ويحوّلها إلى 1 مارس 1920 ودفنه بجوار حصن روملي."
  en: "TDV İslâm Ansiklopedisi entry on Hasan Rıza Efendi by M. Uğur Derman; used for entity facts. It gives his birth at Üsküdar (1849–1920), his studies under Yahya Hilmi and Mehmed Şefik Bey and his ta'liq under Sami Efendi, his imamate of the imperial band in 1871, his hajj in 1876, his succession of Şefik Bey as calligraphy teacher in 1879, his teaching at the School of Calligraphers from 1914, his nineteen mushafs and the eight-volume Sahih al-Bukhari for Sultan Reşad, and his death on 10 Cemâziyelâhir 1338, which it converts to 1 March 1920, with burial beside Rumeli Hisarı fortress."
  es: "Entrada de TDV İslâm Ansiklopedisi sobre Hasan Rıza Efendi por M. Uğur Derman; utilizada para datos sobre la entidad. Indica su nacimiento en Üsküdar (1849–1920), sus estudios con Yahya Hilmi y Mehmed Şefik Bey y su ta'liq con Sami Efendi, su imamato de la banda imperial en 1871, su hajj en 1876, su sucesión de Şefik Bey como profesor de caligrafía en 1879, su enseñanza en la Escuela de Calígrafos desde 1914, sus diecinueve mushafs y el Sahih al-Bukhari de ocho volúmenes para el sultán Reşad, y su muerte el 10 de Cemâziyelâhir de 1338, que se convierte al 1 de marzo de 1920, con entierro junto a la fortaleza de Rumeli Hisarı."
  fr: "L'article de M. Uğur Derman sur Hasan Rıza Efendi dans l'ouvrage TDV İslâm Ansiklopedisi, utilisé pour les informations biographiques, mentionne sa naissance à Üsküdar (1849-1920), ses études auprès de Yahya Hilmi et Mehmed Şefik Bey, son apprentissage de la calligraphie auprès de Sami Efendi, son imamat de la cour impériale en 1871, son pèlerinage à La Mecque en 1876, sa succession de Şefik Bey comme professeur de calligraphie en 1879, son enseignement à l'École des calligraphes à partir de 1914, ses dix-neuf mushafs et le Sahih al-Bukhari en huit volumes pour le sultan Reşad, ainsi que sa mort le 10 Cemâziyelâhir 1338 (date convertie ici au 1er mars 1920) et son inhumation près de la forteresse de Rumeli Hisarı."
  ur: "حسن رضا ایفندی پر TDV İslâm Ansiklopedisi entry by M. Uğur Derman; ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش Üsküdar (1849–1920)، یحییٰ حلمی اور محمد Şefik Bey کے تحت ان کی تعلیم اور سمیع آفندی کے تحت ان کی تقلید، 1871 میں ان کی امپیریل بینڈ کی امامت، 1876 میں اس کا حج، ان کی جانشینی Şefik Bey کی بطور خطاطی کے استاد، اسکول میں خطاطی کے استاد کے طور پر۔ 1914، سلطان رضا کے لیے ان کے انیس مصحف اور آٹھ جلدوں پر مشتمل صحیح البخاری، اور ان کی وفات 10 Cemâziyelahir 1338 کو، جسے یہ یکم مارچ 1920 میں تبدیل کر کے رومیلی حصاری قلعہ کے ساتھ دفن کیا گیا۔"
  tr: "Türk Dini Vakfı'na (TDV) bağlı İslam Ansiklopedisi'ne M. Uğur Derman tarafından Hasan Rıza Efendi hakkında yapılan giriş; varlığın olayları için kullanılmıştır. Üsküdar'da doğdu (1849–1920), Yahya Helmi ve Muhammed Şafik Bey'den eğitim aldı, Sami Efendi'den yorum aldı, 1871'de Humayun müzik topluluğuna liderlik etti, 1876'da Hac yaptı, 1879'da Şafik Bey'in yerine hat öğretti, 1914'ten itibaren Hattatlar Okulu'nda ders verdi ve Sultan Rashad için on dokuz Kur'an ve Sahih al-Buhari'yi sekiz cilt halinde yazdı. 10 Cumada'l-Akhirah 1338 H.'de vefat etti, bu tarih 1 Mart 1920 tarihlidir ve Rumeli kalesinin yanına defnedildi."
  id: "Entri ke Ensiklopedia Islam yang berafiliasi dengan Turkish Religious Endowment (TDV) tentang Hasan Reza Efendi oleh M. Ugur Derman; digunakan untuk peristiwa entitas tersebut. Ia lahir di Üsküdar (1849–1920), belajar di bawah bimbingan Yahya Helmi dan Muhammad Shafik Bey, menerima komentar dari Sami Efendi, memimpin ansembel musik Humayun pada tahun 1871, melaksanakan Haji pada tahun 1876, menggantikan Shafik Bey dalam mengajar kaligrafi pada tahun 1879, mengajar di Sekolah Kaligrafer sejak 1914, dan menulis sembilan belas Al-Qur'an serta Sahih al-Bukhari dalam delapan jilid untuk Sultan Rashad. Ia meninggal pada 10 Jumada al-Akhirah 1338 H, yang diperkirakan tanggal 1 Maret 1920, dan dimakamkan di sebelah benteng Rumeli."
