summary:
  ar: "مدخل موسوعة الإسلام التابعة لوقف الديانة التركي (TDV) عن حسن رضا أفندي بقلم م. أوغور درمان؛ تُستخدم لوقائع الكيان. يعطي ميلاده في أسكدار (1849–1920)، وتعلّمه عند يحيى حلمي ومحمد شفيق بك وأخذه التعليق عن سامي أفندي، وإمامته فرقة الموسيقى الهمايونية سنة 1871 وحجه سنة 1876 وخلافته شفيق بك في تعليم الخط سنة 1879، وتدريسه في مدرسة الخطاطين من 1914، ومصاحفه التسعة عشر وصحيح البخاري في ثمانية مجلدات للسلطان رشاد، ووفاته في 10 جمادى الآخرة 1338 ويحوّلها إلى 1 مارس 1920 ودفنه بجوار حصن روملي."
  en: "TDV İslâm Ansiklopedisi entry on Hasan Rıza Efendi by M. Uğur Derman; used for entity facts. It gives his birth at Üsküdar (1849–1920), his studies under Yahya Hilmi and Mehmed Şefik Bey and his ta'liq under Sami Efendi, his imamate of the imperial band in 1871, his hajj in 1876, his succession of Şefik Bey as calligraphy teacher in 1879, his teaching at the School of Calligraphers from 1914, his nineteen mushafs and the eight-volume Sahih al-Bukhari for Sultan Reşad, and his death on 10 Cemâziyelâhir 1338, which it converts to 1 March 1920, with burial beside Rumeli Hisarı fortress."
title: "Hasan Rızâ Efendi, Hacı"
