reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article: an Ottoman author of Albanian descent, philosopher, playwright and a leading figure of the Albanian renaissance; he supported Turkish nationalism against its Ottoman counterpart and a non-religious system against religious government (agreeing with the English article's secularism note); its dated works list gives the novel (1873), the plays Besa (1874), Seydi Yahya (1875) and Gave (1876), the French dictionaries (1882–1905, 1885, 1886), Qamus al-A'lam in six volumes (1889–1898), the unfinished Arabic dictionary (1898) and Qamus Turki in two volumes (1899–1900). It carries no statement about his personal religion."
