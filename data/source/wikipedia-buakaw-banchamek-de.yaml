reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The article records his March 2012 departure from the Por. Pramuk Gym, the opening of his own Banchamek Gym in his home village in Samrong Thap district, Surin, his ordination as a Buddhist monk on 6 May 2012 (citing Matichon Online of 10 May 2012), his announced retirement on 31 May 2012 and his later return under his own camp. The ordination is reported as an act; the article does not state a religious affiliation for him in so many words."
