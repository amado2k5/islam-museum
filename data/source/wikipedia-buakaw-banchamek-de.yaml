summary:
  ar: "مقالة ويكيبيديا الألمانية عن بواكاو بانشاميك؛ تُستخدم لوقائع الكيان فقط. تختصر مسيرته وألقابه، وتذكر أنه رُسّم راهباً بوذياً في 6 مايو 2012 أثناء نزاعه التعاقدي مع معسكر بور براموك، مستندة إلى صحيفة ماتيشون التايلاندية."
  en: "German Wikipedia article on Buakaw Banchamek; used for entity facts only. It summarises his career and titles, and records that he was ordained as a Buddhist monk on 6 May 2012 during his contract dispute with the Por. Pramuk camp, citing the Thai newspaper Matichon."
  es: "Artículo de la Wikipedia en alemán sobre Buakaw Banchamek; utilizado únicamente para obtener información sobre la persona. Resume su trayectoria y títulos, y registra que fue ordenado monje budista el 6 de mayo de 2012 durante su disputa contractual con el grupo Por. Pramuk, citando al periódico tailandés Matichon."
  fr: "Article de Wikipédia en allemand sur Buakaw Banchamek; utilisé uniquement pour les informations sur l’entité. Il résume sa carrière et ses titres, et indique qu’il a été ordonné moine bouddhiste le 6 mai 2012, en pleine crise contractuelle avec le camp de Por. Pramuk, citant le journal thaïlandais Matichon."
  ur: "بوکاو بنچامیک پر جرمن ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کے کیریئر اور عنوانات کا خلاصہ کرتا ہے، اور ریکارڈ کرتا ہے کہ اسے پور کے ساتھ معاہدے کے تنازعہ کے دوران 6 مئی 2012 کو بدھ راہب کے طور پر مقرر کیا گیا تھا۔ تھائی اخبار میٹیچون کا حوالہ دیتے ہوئے پراموک کیمپ۔"
  tr: "Puakau Panchamik hakkında Almanca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kariyerini ve unvanlarını özetlerek, 6 Mayıs 2012'de Bur Baramok kampıyla yaşadığı sözleşme anlaşmazlığı sırasında Tayland'ın Maeshun'a dayanan Budist keşiş olarak atandığını belirtmektedir."
  id: "Artikel Wikipedia Jerman tentang Puakau Panchamik; digunakan hanya untuk fakta entitas. Artikel ini merangkum karier dan gelarnya, menyebutkan bahwa ia ditahbiskan sebagai biksu Buddha pada 6 Mei 2012, selama perselisihan kontraktualnya dengan kamp Bur Baramok, berdasarkan surat kabar Thailand Maeshun."
