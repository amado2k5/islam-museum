summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أنس جابر ⁦(مواليد 1994)⁩، لاعبة التنس التونسية؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في قصر هلال في 28 أغسطس 1994، وبلوغها التصنيف الثاني عالميا في يونيو 2022 وهو الأعلى لأي لاعب أفريقي أو عربي، ونهائياتها الثلاث في البطولات الكبرى ⁦(ويمبلدون 2022 و2023 وأمريكا المفتوحة 2022)⁩، وألقابها الخمسة في الفردي ومنها مدريد 2022، وينص قسم حياتها الشخصية على أنها مسلمة، وإعلانها التوقف عن التنس في يوليو 2025 ثم حملها في نوفمبر 2025."
  en: "English Wikipedia article on Ons Jabeur (born 1994), the Tunisian tennis player; used for entity facts only. It records her birth in Ksar Hellal on 28 August 1994, her career-high ranking of world No. 2 in June 2022 — the highest for any African or Arab player — her three major singles finals (Wimbledon 2022 and 2023, the US Open 2022), her five singles titles including the 2022 Madrid Open, that her Personal life section states she is a Muslim, her indefinite break from tennis announced in July 2025, and her pregnancy announced in November 2025."
  es: "Artículo de la Wikipedia en inglés sobre Ons Jabeur (nacida en 1994), la tenista tunecina; utilizado únicamente para datos sobre la persona. Registra su nacimiento en Ksar Hellal el 28 de agosto de 1994, su mejor clasificación mundial de 2.º puesto en junio de 2022 (la más alta para cualquier jugador africano o árabe), sus tres finales de Grand Slam individuales (Wimbledon 2022 y 2023, el US Open 2022), sus cinco títulos individuales, incluido el Madrid Open 2022, que en su sección de Vida personal se indica que es musulmana, su retiro indefinido del tenis anunciado en julio de 2025 y su embarazo anunciado en noviembre de 2025."
  fr: "Article de Wikipédia en anglais sur Ons Jabeur (née en 1994), la joueuse de tennis tunisienne; utilisé uniquement à des fins d’information sur l’entité. Il mentionne sa naissance à Ksar Hellal le 28 août 1994, son meilleur classement mondial (n° 2) en juin 2022 – le meilleur pour une joueuse africaine ou arabe –, ses trois finales de tournois du Grand Chelem en simple (Wimbledon 2022 et 2023, l’US Open 2022), ses cinq titres en simple, dont le Masters de Madrid 2022, sa religion musulmane (mentionnée dans sa rubrique « Vie privée »), sa pause indéfinie annoncée en juillet 2025 et sa grossesse annoncée en novembre 2025."
  ur: "تیونس کے ٹینس کھلاڑی Ons Jabeur ⁦(پیدائش 1994)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پیدائش 28 اگست 1994 کو کسار ہیلال میں ریکارڈ کی گئی، جون 2022 میں اس کے کیریئر کی دنیا کے نمبر 2 کی اعلیٰ درجہ بندی - کسی بھی افریقی یا عرب کھلاڑی کے لیے سب سے زیادہ؛ اس کے تین بڑے سنگلز فائنلز ⁦( ومبلڈن 2022 اور 2023، یو ایس اوپن 2022)⁩، اس کے پانچ سنگلز سیکشنز بشمول اس کے میڈری 2 اوپن اسٹیٹس 2020 ٹائٹلز۔ وہ ایک مسلمان ہے، ٹینس سے اس کے غیر معینہ وقفے کا اعلان جولائی 2025 میں ہوا، اور اس کے حمل کا اعلان نومبر 2025 میں ہوا۔"
  tr: "Tunuslu tenisçi Ons Jabeur (d. 1994) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 28 Ağustos 1994'te Ksar Hilal'da doğduğunu, Haziran 2022'de dünya ikincisine ulaştığını ve bu oranın Afrikalı veya Arap oyuncular arasında en yüksek olduğunu belirtiyor, üç Grand Slam finalini (Wimbledon 2022, 2023 ve 2022 ABD Açık), Madrid 2022 dahil beş tekler şampiyonluğunu, kişisel yaşam bölümünde Müslüman olduğunu belirtiyor ve Temmuz 2025'te tenisten emekli olduğunu açıkladı, ardından Kasım 2025'te hamile kaldığını belirtiyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Ons Jabeur (lahir 1994), pemain tenis Tunisia; hanya digunakan untuk fakta entitas. Dia menyebutkan kelahirannya di Ksar Hilal pada 28 Agustus 1994, mencapai peringkat dua dunia pada Juni 2022, tertinggi bagi pemain Afrika atau Arab, tiga final Grand Slam-nya (Wimbledon 2022, 2023, dan US Open 2022), lima gelar tunggalnya termasuk Madrid 2022, bagian kehidupan pribadinya menyatakan dia Muslim, dan mengumumkan pensiun dari tenis pada Juli 2025, kemudian hamil pada November 2025."
