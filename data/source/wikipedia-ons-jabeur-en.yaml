summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أنس جابر (مواليد 1994)، لاعبة التنس التونسية؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في قصر هلال في 28 أغسطس 1994، وبلوغها التصنيف الثاني عالميا في يونيو 2022 وهو الأعلى لأي لاعب أفريقي أو عربي، ونهائياتها الثلاث في البطولات الكبرى (ويمبلدون 2022 و2023 وأمريكا المفتوحة 2022)، وألقابها الخمسة في الفردي ومنها مدريد 2022، وينص قسم حياتها الشخصية على أنها مسلمة، وإعلانها التوقف عن التنس في يوليو 2025 ثم حملها في نوفمبر 2025."
  en: "English Wikipedia article on Ons Jabeur (born 1994), the Tunisian tennis player; used for entity facts only. It records her birth in Ksar Hellal on 28 August 1994, her career-high ranking of world No. 2 in June 2022 — the highest for any African or Arab player — her three major singles finals (Wimbledon 2022 and 2023, the US Open 2022), her five singles titles including the 2022 Madrid Open, that her Personal life section states she is a Muslim, her indefinite break from tennis announced in July 2025, and her pregnancy announced in November 2025."
