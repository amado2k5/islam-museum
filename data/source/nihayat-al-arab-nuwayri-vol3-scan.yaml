summary:
  en: "Volume 3 of al-Nuwayri's encyclopaedia of adab, as a scan on archive.org (item nefa03). Its second art on the proverbs opens with the Prophet's sayings and the proverbs of the Companions. Read so far: the chapter's opening, the definition of the proverb and the Prophet's sayings (scan pp. 1-5)."
  ar: "الجزء الثالث من موسوعة النويري في الأدب، نسخة ممسوحة على الأرشيف ⁦(المعرّف nefa03)⁩. يبدأ قسم الأمثال من فنه الثاني بأقوال النبي وأمثال الصحابة. قُرئ حتى الآن مدخل الباب وتعريف المثل وأقوال النبي ⁦(الصفحات 1-5 من المسح)⁩."
  es: "Volumen 3 de la enciclopedia de adab de al-Nuwayri, escaneado en archive.org (elemento nefa03). Su segunda parte, dedicada a los proverbios, comienza con dichos del Profeta y de los Compañeros. Hasta el momento: introducción del capítulo, definición del proverbio y dichos del Profeta (escaneo págs. 1-5)."
  fr: "Le volume 3 de l'encyclopédie d'adab d'al-Nuwayri, disponible en version numérisée sur archive.org (référence nefa03), présente un deuxième chapitre consacré aux proverbes. Ce chapitre s'ouvre sur les hadiths du Prophète et les proverbes des Compagnons. Lectures: introduction du chapitre, définition du proverbe et hadiths du Prophète (numérisation pp. 1-5)."
  ur: "النوائری کے انسائیکلوپیڈیا آف ادب کا جلد 3، بطور اسکین آرکائیو ڈاٹ آر جی ⁦(آئٹم nefa03)⁩۔ محاوروں پر اس کا دوسرا فن نبی کے اقوال اور صحابہ کرام کے اقوال سے کھلتا ہے۔ اب تک پڑھیں: باب کا آغاز، محاورے کی تعریف اور نبی کے اقوال ⁦(اسکین پی پی 1-5)⁩۔"
  tr: "Al-Nuwayri'nin edebiyat ansiklopedisinin üçüncü bölümü, arşivde taranmış bir kopyadır (tanımlayıcı nefa03). İkinci eserinin atasözleri bölümü, Peygamber'in sözleri ve sahabelerin sözleriyle başlar. Şimdiye kadar, bölüm maddesi, atasözü tanımı ve Peygamber'in sözleri okunmuştur (incelemenin sayfa 1-5)."
  id: "Bagian ketiga dari ensiklopedia sastra Al-Nuwayri, adalah salinan hasil scan di arsip (identifier nefa03). Bagian peribahasaan pada seni keduanya dimulai dengan ucapan Nabi dan kata-kata para sahabat. Sejauh ini, entri bab, definisi peribahasaan, dan ucapan Nabi telah dibaca (halaman 1-5 survei)."
