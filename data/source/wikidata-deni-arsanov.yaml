summary:
  ar: "عنصر ويكيداتا Q4069909 لديني أرسانوف؛ يُستخدم للمعرّفات والوقائع المنظّمة فقط. يذكر مولده سنة 1851 ووفاته في 27 ديسمبر 1917، ولا يحمل أي قيمة للدين، ورابطه الوحيد للمقالات هو الروسية."
  en: "Wikidata item Q4069909 for Deni Arsanov; used for identifiers and structured facts only. It gives his birth in 1851 and his death on 27 December 1917, carries no religion value, and its only article sitelink is the Russian one."
  es: "Entrada de Wikidata Q4069909 para Deni Arsanov; se utiliza únicamente para identificadores y datos estructurados. Indica su fecha de nacimiento en 1851 y su fallecimiento el 27 de diciembre de 1917, no tiene valor religioso y su único enlace a un artículo es el ruso."
  fr: "L'élément Wikidata Q4069909 concerne Deni Arsanov; il sert uniquement d'identifiant et de données structurées. Il indique sa naissance en 1851 et son décès le 27 décembre 1917, ne mentionne aucune religion et son seul lien vers l'article est l'article russe."
  ur: "ویکی ڈیٹا آئٹم Q4069909 برائے Deni Arsanov؛ صرف شناخت کنندگان اور ساختی حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1851 میں اس کی پیدائش اور 27 دسمبر 1917 کو اس کی موت ہے، اس میں مذہب کی کوئی اہمیت نہیں ہے، اور اس کا واحد مضمون سائٹ لنک روسی ہے۔"
  tr: "Deni Arsanov tarafından Q4069909 bir Wikidata öğesi; yalnızca organize tanımlayıcılar ve gerçekler için kullanılır. 1851 doğumlu ve 27 Aralık 1917'de öldüğü belirtilir, dini bir değeri yoktur, sadece Rusça makalelere bağlantılar içerir."
  id: "Elemen Wikidata Q4069909 oleh Deni Arsanov; hanya digunakan untuk pengenal dan fakta yang terorganisir. Ia disebutkan lahir pada tahun 1851 dan meninggal pada 27 Desember 1917, dan tidak memiliki nilai keagamaan, hanya memiliki tautan ke artikel dalam bahasa Rusia."
