  en: "The Better India profile of Yusuf Hamied and his father Khwaja Abdul Hamied (20 April 2021); its 'Secular Upbringing' section records that Yusuf grew up in a deeply secular household, and it traces his start at Cipla and the affordable AIDS-drugs campaign."
  es: "El perfil de Yusuf Hamied y su padre Khwaja Abdul Hamied publicado en Better India el 20 de abril de 2021, en su sección \"Educación laica\", recoge que Yusuf creció en un hogar profundamente laico y narra sus inicios en Cipla y la campaña para conseguir medicamentos asequibles contra el SIDA."
  fr: "Le profil de Yusuf Hamied et de son père Khwaja Abdul Hamied par Better India (20 avril 2021); sa section « Éducation laïque » indique que Yusuf a grandi dans un foyer profondément laïque et retrace ses débuts chez Cipla et la campagne pour des médicaments abordables contre le sida."
  ur: "یوسف حمید اور ان کے والد خواجہ عبدالحمید کا بیٹر انڈیا پروفائل ⁦(20 اپریل 2021)⁩؛ اس کا 'سیکولر پرورش' سیکشن ریکارڈ کرتا ہے کہ یوسف ایک گہرے سیکولر گھرانے میں پلا بڑھا، اور یہ سیپلا سے اس کی شروعات اور ایڈز سے متعلق ادویات کی سستی مہم کا پتہ لگاتا ہے۔"
  tr: "Youssef Hamid ve babası Khawaja Abdul Hamid hakkında The Better India dosyası (20 Nisan 2021): \"Seküler Yetiştirilme\" bölümünde, Youssef'in kökenlerini Sibla'da ve AIDS ilaç kampanyasında izlediği belirtiliyor."
  id: "Berkas The Better India (20 April 2021) tentang Youssef Hamid dan ayahnya Khawaja Abdul Hamid: Disebutkan dalam bagian \"Pendidikan Sekuler\" bahwa Youssef tumbuh di keluarga yang sangat sekuler, menelusuri asal-usulnya di Sibla dan kampanye narkoba AIDS-nya."
