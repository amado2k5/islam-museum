label:
  ar: "إحياء علوم الدين للغزالي، الأجزاء 13–16 (سلسلة كتاب الشعب، القاهرة)"
  en: "al-Ghazali, Ihya' 'Ulum al-Din, parts 13-16 (Kitab al-Sha'b series, Cairo)"
  ur: "غزالی، احیاء علوم الدین، اجزا 13 تا 16 (سلسلہ کتاب الشعب، قاہرہ)"
summary:
  ar: "الأجزاء من الثالث عشر إلى السادس عشر من طبعة «كتاب الشعب» للإحياء مجلدةً معاً بترقيم متصل (ص 2331 فما بعدها): الشطر الثاني من كتاب الخوف إلى آخر كتاب ذكر الموت، ثم خاتمة العراقي، ثم «الإملاء في إشكالات الإحياء» للغزالي، ثم «تعريف الأحياء بفضائل الإحياء» للعيدروس؛ إهداء أحمد حمدي محمود إلى مكتبة الإسكندرية 2005."
  en: "Parts 13 to 16 of the Kitab al-Sha'b edition of the Ihya', bound together with continuous pagination (printed pp. 2331 onward): the second half of the Book of Fear to the end of the Book of the Remembrance of Death, then al-Iraqi's closing note, al-Ghazali's al-Imla' fi Ishkalat al-Ihya', and al-Aydarus's Ta'rif al-Ahya' bi-Fada'il al-Ihya'. Donated by Ahmad Hamdi Mahmud to the Bibliotheca Alexandrina, 2005."
  ur: "احیاء کے «کتاب الشعب» ایڈیشن کے تیرھویں سے سولھویں اجزا، مسلسل صفحہ بندی کے ساتھ ایک جلد میں (مطبوعہ ص 2331 سے): کتاب الخوف کے دوسرے حصے سے کتاب ذکر الموت کے آخر تک، پھر عراقی کا اختتامیہ، غزالی کی «الاملاء فی اشکالات الاحیاء» اور عیدروس کی «تعریف الاحیاء بفضائل الاحیاء»۔"
