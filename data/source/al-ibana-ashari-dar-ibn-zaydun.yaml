reliability_note: "Classical Sunni creed text (author d. 324 AH by the usual date; the title page says 'some twenty-odd and three hundred'), public domain; the edition adds only variant-reading footnotes. Copy used: harvest item aqeedah/al-ibana-ashari/ebaaa (76 PDF pages, OCR text). Title page PDF p. 1, imprint p. 3, author's address pp. 4–7, text pp. 7–74, contents pp. 75–76. PRINTED PAGE = PDF PAGE (checked on pp. 8, 33, 73, 74 against the contents). The attribution and the place of al-Ibana in al-Ash'ari's thought are discussed by later scholars; this edition gives no study, so that discussion is not taken from it."
