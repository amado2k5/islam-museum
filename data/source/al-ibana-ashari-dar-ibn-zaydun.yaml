label:
  ar: "الإبانة عن أصول الديانة لأبي الحسن علي بن إسماعيل الأشعري — دار ابن زيدون، بيروت، الطبعة الأولى"
  en: "Abu al-Hasan 'Ali ibn Isma'il al-Ash'ari, al-Ibana 'an Usul al-Diyana — Dar Ibn Zaydun, Beirut, 1st edition"
summary:
  ar: "نشرة دار ابن زيدون ببيروت للإبانة، بلا محقق مسمّى ولا تاريخ في المسح، فيها خطبة المؤلف ثم أبواب الكتاب، مع حواش تذكر فروق النسخ بقولها «وفي نسخة»، وخاتمة تذكر أن الكتاب طُبع بعد معارضته على أصوله المصححة، وفهرس."
  en: "Dar Ibn Zaydun's Beirut edition of al-Ibana, with no named editor and no date in the scan; it holds the author's opening address and the chapters of the book, footnotes giving variant readings ('in one copy'), a closing note that the book was printed after being collated with corrected originals, and a table of contents."
  es: "Edición de Beirut de al-Ibana de Dar Ibn Zaydun, sin editor nombrado ni fecha en el escaneo; contiene el discurso de apertura del autor y los capítulos del libro, notas a pie de página que ofrecen variantes textuales ('en un solo ejemplar'), una nota final que indica que el libro se imprimió después de ser cotejado con originales corregidos y un índice."
  fr: "L'édition beyrouthine d'al-Ibana de Dar Ibn Zaydun, sans éditeur nommé ni date dans le scan; elle contient l'adresse d'ouverture de l'auteur et les chapitres du livre, des notes de bas de page donnant des variantes de lecture (« dans un exemplaire »), une note finale indiquant que le livre a été imprimé après avoir été collationné avec des originaux corrigés, et une table des matières."
  ur: "دار ابن زیدون کا البانہ کا بیروت ایڈیشن، جس میں کوئی نامی ایڈیٹر نہیں ہے اور اسکین میں کوئی تاریخ نہیں ہے۔ اس میں مصنف کا ابتدائی پتہ اور کتاب کے ابواب ہیں، فوٹ نوٹ جو مختلف ریڈنگز دیتے ہیں ⁦('ایک کاپی میں')⁩، ایک اختتامی نوٹ کہ کتاب کو درست اصل کے ساتھ جمع کرنے کے بعد پرنٹ کیا گیا تھا، اور مندرجات کا ایک جدول۔"
  tr: "İbn Zeydun'un El-İbanah için yayımladığı Beyrut yayını, isimli bir editör veya tarih olmadan, yazarın vaazını, ardından kitabın bölümlerini, \"ve bir kopyada\" diyerek kopyalama farklılıklarını belirten dipnotlarla ve kitabın düzeltilmiş orijinallerine karşı çıktıktan sonra basıldığını belirten bir sonuç ve bir dizin içeriyordu."
  id: "Publikasi Ibn Zaydun di Beirut untuk Al-Ibanah, tanpa editor atau tanggal yang disebutkan pada survei, berisi khotbah penulis, lalu bab-bab buku, dengan catatan kaki yang menyebutkan perbedaan penyalinan dengan mengatakan \"dan dalam salinan,\" serta kesimpulan yang menyatakan bahwa buku tersebut dicetak setelah ditentang dengan versi aslinya yang telah diperbaiki, beserta indeks."
title: "الإبانة عن أصول الديانة — أبو الحسن علي بن إسماعيل بن عبد الله بن أبي موسى الأشعري"
