reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026. The article carries a standing 'no citations' banner (since October 2024), so its narrative is used for the career outline and its dates are followed where they are also the lead/infobox values, with Wikidata's competing values recorded as variants in his record. It gives his dates as 1487–1539 (lead and infobox), his father as Mahmud, his uncle as Muhammad Shaybani, his receipt of Bukhara after 1510 and the defence of it at Ghajdivan in 1512, his formal reign as khan in 1534–1539, the building of the Kalan Mosque (1514) and the Mir-i-Arab Madrasa (1535–36), his Khwarazm campaign of 1538, and his burial in the Mir-i-Arab Madrasa. It names no religion or school for him."
