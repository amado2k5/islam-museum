summary:
  ar: "مقالة ويكيبيديا العربية عن ميان محمد بخش؛ تنص في صدرها على أنه شاعر ومتصوف بنجابي ينتمي إلى الطريقة القادرية الصوفية، وتسرد نسبه الروحي إلى دمريان والي سركار وخلاف حول سنة مولده ⁦(1246هـ/1830م أو 1843)⁩."
  en: "The Arabic Wikipedia article on Mian Muhammad Bakhsh; its lead states that he was a Punjabi poet and Sufi belonging to the Qadiri Sufi order, and it sets out his spiritual descent from Damriyan Wali Sarkar and the disagreement over his birth year (1246 AH/1830 or 1843)."
  es: "El artículo de Wikipedia en árabe sobre Mian Muhammad Bakhsh, en su introducción, afirma que fue un poeta punjabí y sufí perteneciente a la orden sufí Qadiri, y expone su descendencia espiritual de Damriyan Wali Sarkar y el desacuerdo sobre su año de nacimiento (1246 AH/1830 o 1843)."
  fr: "L'article de Wikipédia en arabe sur Mian Muhammad Bakhsh; son introduction indique qu'il était un poète et soufi punjabi appartenant à l'ordre soufi Qadiri, et elle expose sa descendance spirituelle de Damriyan Wali Sarkar et le désaccord sur son année de naissance (1246 AH/1830 ou 1843)."
  ur: "میاں محمد بخش پر عربی ویکیپیڈیا کا مضمون؛ اس کے لیڈ میں کہا گیا ہے کہ وہ پنجابی شاعر اور صوفی تھے جن کا تعلق قادری صوفی سلسلہ سے تھا، اور اس سے ان کا روحانی نزول دمریان والی سرکار سے ہوتا ہے اور ان کے سال پیدائش ⁦(1246ھ/1830 یا 1843)⁩ پر اختلاف ہے۔"
  tr: "Mian Muhammad Bakhsh hakkında Arapça Wikipedia makalesi başta onun Kadiri-Sufi tarikatına mensup bir Pencaplı şair ve mistik olduğunu belirtir ve manevi soyunu Sarkar valisi Damrian'a kadar listeler; doğum yılı (1246 Hicri / 1830 M.S. veya 1843) üzerine anlaşmazlıklar yaşanır."
  id: "Artikel Wikipedia berbahasa Arab tentang Mian Muhammad Bakhsh menyatakan di awal bahwa ia adalah penyair dan mistikus Punjabi yang tergabung dalam tarekat Qadiri-Sufi, dan mencantumkan garis keturunan spiritualnya kepada Damrian, gubernur Sarkar, serta perselisihan mengenai tahun kelahirannya (1246 H / 1830 M atau 1843)."
