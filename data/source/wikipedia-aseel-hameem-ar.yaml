summary:
  ar: "مقالة ويكيبيديا العربية عن أصيل هميم؛ تُستخدم لوقائع الكيان فقط. تذكر اسم ولادتها أصيل كريم هميم ومولدها في بغداد في 6 أكتوبر 1984 وأنها ابنة الموسيقار كريم هميم، واحترافها الغناء في الثانية والعشرين، وزواجها من رجل الأعمال بكر الشهابي في أربيل في 12 ديسمبر 2024، وقوائم أغانيها وشارات المسلسلات."
  en: "Arabic Wikipedia article on Aseel Hameem; used for entity facts only. It gives her birth name as Aseel Karim Hameem, her birth in Baghdad on 6 October 1984, her father the musician Karim Hameem, her professional start at the age of twenty-two, her marriage to the businessman Bakr al-Shahabi in Erbil on 12 December 2024, and lists of her songs and television theme songs."
  es: "Artículo de Wikipedia en árabe sobre Aseel Hameem; utilizado únicamente para datos biográficos. Indica que su nombre de nacimiento es Aseel Karim Hameem, que nació en Bagdad el 6 de octubre de 1984, que su padre es el músico Karim Hameem, que comenzó su carrera profesional a los veintidós años, que se casó con el empresario Bakr al-Shahabi en Erbil el 12 de diciembre de 2024 y que incluye listas de sus canciones y temas musicales para televisión."
  fr: "Article de Wikipédia en arabe sur Aseel Hameem; utilisé uniquement pour des informations sur l’entité. On y trouve son nom de naissance, Aseel Karim Hameem, sa date de naissance à Bagdad le 6 octobre 1984, le nom de son père, le musicien Karim Hameem, ses débuts professionnels à l’âge de vingt-deux ans, son mariage avec l’homme d’affaires Bakr al-Shahabi à Erbil le 12 décembre 2024, ainsi que des listes de ses chansons et génériques télévisés."
  ur: "عصیل حمیم پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کا پیدائشی نام عصیل کریم حمیم، اس کی پیدائش 6 اکتوبر 1984 کو بغداد میں ہوئی، اس کے والد موسیقار کریم حمیم، 22 سال کی عمر میں اس کا پیشہ ورانہ آغاز، 12 دسمبر 2024 کو اربیل میں تاجر بکر الشہبی سے اس کی شادی، اور اس کے گانوں اور ٹیلی ویژن پر گانے کی فہرستیں شامل ہیں۔"
  tr: "Aseel Hamim hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğum adını Aseel Karim Hamim olarak belirtir, 6 Ekim 1984'te Bağdat'ta doğduğunu ve müzisyen Karim Hamim'in kızı olduğunu, yirmi iki yaşındaki profesyonel şarkıcılık kariyerini, 12 Aralık 2024'te Erbil'de iş insanı Bakr Al-Shihabi ile evlenmesini, şarkı listelerini ve dizi yazarlığını belirtir."
  id: "Artikel Wikipedia berbahasa Arab tentang Aseel Hamim; hanya digunakan untuk fakta entitas. Dia menyebutkan nama lahirnya sebagai Aseel Karim Hamim, kelahirannya di Baghdad pada 6 Oktober 1984, dan bahwa dia adalah putri musisi Karim Hamim, karier menyanyi profesionalnya pada usia dua puluh dua tahun, pernikahannya dengan pengusaha Bakr Al-Shihabi di Erbil pada 12 Desember 2024, daftar lagunya, dan kredit serial."
