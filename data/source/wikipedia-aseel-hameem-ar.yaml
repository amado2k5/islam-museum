reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026. This writer's text-fetch route does not expose revision ids, so — on the consultation-date pattern used for Salah Bukhatir (Batch 67) and Hasim Rahman — no revision id is recorded and none has been invented. The article states that she was born in Baghdad on 6 October 1984, is the daughter of the musician Karim Hameem, who taught and guided her, that her aunt is the broadcaster Suhair al-Qaisi, that she took part in the Arab Stars programme on MBC 1 with the Arab Mashreq team and released the solo song «بلاني زماني», that she sang a song of her own in the album 'Rashed and His Loved Ones', and that she married the businessman Bakr al-Shahabi at a ceremony in Erbil on 12 December 2024. Its infobox gives her citizenship as Iraq and her occupation as singer and actress, and names no religion for her."
