  ar: "مقالة ويكيبيديا العربية عن أصيل هميم؛ تُستخدم لوقائع الكيان فقط. تذكر اسم ولادتها أصيل كريم هميم ومولدها في بغداد في 6 أكتوبر 1984 وأنها ابنة الموسيقار كريم هميم، واحترافها الغناء في الثانية والعشرين، وزواجها من رجل الأعمال بكر الشهابي في أربيل في 12 ديسمبر 2024، وقوائم أغانيها وشارات المسلسلات."
  en: "Arabic Wikipedia article on Aseel Hameem; used for entity facts only. It gives her birth name as Aseel Karim Hameem, her birth in Baghdad on 6 October 1984, her father the musician Karim Hameem, her professional start at the age of twenty-two, her marriage to the businessman Bakr al-Shahabi in Erbil on 12 December 2024, and lists of her songs and television theme songs."
