reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A two-paragraph stub whose only citation is Walter G. Andrews on Nabi's lyrics. It gives his years as 1642 – 10 April 1712 and the outline Urfa–Istanbul–Aleppo–Istanbul; its death day, 10 April, is one of the rival readings preserved in the person record (the Turkish article gives 13 April). Its closing claim that he died of wounds from a wild honey badger attack is unattributed and absent from the Turkish article and the TEİS entry behind it; it is preserved in the person record's died note without endorsement. Checked 1 November 2026."
