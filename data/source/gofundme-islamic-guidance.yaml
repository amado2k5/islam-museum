summary:
  ar: "صفحة جمع التبرعات لقناة الإرشاد الإسلامي على GoFundMe، نظّمها شيك شميم أحمد بلسان صانع القناة: يذكر أنه بدأ قناة اليوتيوب في 23 يونيو 2008، وأن عمل القناة — رغم صيغة الجمع — «عمل رجل واحد» في الحقيقة، ويسرد سلاسل القناة ومشتركيها البالغين 1.4 مليون."
  en: "The GoFundMe fundraiser for the Islamic Guidance channel, organised by Shek Shamim Ahmed and written in the channel creator's first person: it states that the YouTube channel was started on 23 June 2008, that despite the plural phrasing the work 'has actually been a one man job', and lists the channel's series and its 1.4 million subscribers."
  es: "La campaña de recaudación de fondos en GoFundMe para el canal Islamic Guidance, organizada por Shek Shamim Ahmed y escrita en primera persona por el creador del canal, indica que el canal de YouTube se inició el 23 de junio de 2008, que a pesar del uso del plural, el trabajo \"en realidad ha sido un trabajo de una sola persona\", y enumera las series del canal y sus 1,4 millones de suscriptores."
  fr: "La campagne de financement participatif GoFundMe pour la chaîne Islamic Guidance, organisée par Shek Shamim Ahmed et rédigée à la première personne du créateur de la chaîne: elle indique que la chaîne YouTube a été lancée le 23 juin 2008, que malgré la formulation au pluriel, le travail « a en réalité été réalisé par une seule personne », et énumère les séries de la chaîne et ses 1,4 million d’abonnés."
  ur: "اسلامی گائیڈنس چینل کے لیے GoFundMe فنڈ جمع کرنے والا، جس کا اہتمام شیخ شمیم احمد نے کیا اور چینل کے تخلیق کار کے پہلے شخص میں لکھا: اس میں کہا گیا ہے کہ یوٹیوب چینل 23 جون 2008 کو شروع کیا گیا تھا، کہ کام کے متعدد جملے کے باوجود 'حقیقت میں ایک آدمی کا کام رہا ہے'، اور چینل کی سیریز اور اس کے 1.4 ملین سبسکرائبرز کی فہرست دیتا ہے۔"
