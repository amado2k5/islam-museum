  ar: "صفحة جمع التبرعات لقناة الإرشاد الإسلامي على GoFundMe، نظّمها شيك شميم أحمد بلسان صانع القناة: يذكر أنه بدأ قناة اليوتيوب في 23 يونيو 2008، وأن عمل القناة — رغم صيغة الجمع — «عمل رجل واحد» في الحقيقة، ويسرد سلاسل القناة ومشتركيها البالغين 1.4 مليون."
