  ar: "مقالة ويكيبيديا الإنجليزية عن مسعود أوزيل؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في غيلزنكيرشن في 15 أكتوبر 1988، ومسيرته في شالكه وفيردر بريمن وريال مدريد وأرسنال وفنربخشة وإسطنبول باشاكشهير، وفوزه بكأس العالم 2014 مع ألمانيا، واعتزاله الدولي سنة 2018 بدعوى التمييز وعدم الاحترام، وتعليقاته سنة 2019 على الأويغور وبيان أرسنال النائي بنفسه، وتصفه بأنه مسلم ممارس دون تسمية أي مذهب له."
  en: "English Wikipedia article on Mesut Özil; used for entity facts only. It records his birth in Gelsenkirchen on 15 October 1988, his career at Schalke 04, Werder Bremen, Real Madrid, Arsenal, Fenerbahçe and İstanbul Başakşehir, the 2014 World Cup win with Germany, his 2018 retirement from international football alleging discrimination and disrespect, his 2019 comments on the Uyghurs and Arsenal's distancing statement, and describes him as a practising Muslim, naming no school for him."
