summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مسعود أوزيل؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في غيلزنكيرشن في 15 أكتوبر 1988، ومسيرته في شالكه وفيردر بريمن وريال مدريد وأرسنال وفنربخشة وإسطنبول باشاكشهير، وفوزه بكأس العالم 2014 مع ألمانيا، واعتزاله الدولي سنة 2018 بدعوى التمييز وعدم الاحترام، وتعليقاته سنة 2019 على الأويغور وبيان أرسنال النائي بنفسه، وتصفه بأنه مسلم ممارس دون تسمية أي مذهب له."
  en: "English Wikipedia article on Mesut Özil; used for entity facts only. It records his birth in Gelsenkirchen on 15 October 1988, his career at Schalke 04, Werder Bremen, Real Madrid, Arsenal, Fenerbahçe and İstanbul Başakşehir, the 2014 World Cup win with Germany, his 2018 retirement from international football alleging discrimination and disrespect, his 2019 comments on the Uyghurs and Arsenal's distancing statement, and describes him as a practising Muslim, naming no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Mesut Özil; utilizado únicamente para datos sobre la persona. Registra su nacimiento en Gelsenkirchen el 15 de octubre de 1988, su carrera en el Schalke 04, Werder Bremen, Real Madrid, Arsenal, Fenerbahçe e İstanbul Başakşehir, la victoria en la Copa Mundial de 2014 con Alemania, su retiro del fútbol internacional en 2018 alegando discriminación y falta de respeto, sus comentarios de 2019 sobre los uigures y la declaración de distanciamiento del Arsenal, y lo describe como un musulmán practicante, sin mencionar ninguna escuela para él."
  fr: "Article de Wikipédia en anglais sur Mesut Özil; utilisé uniquement pour les informations le concernant. Il relate sa naissance à Gelsenkirchen le 15 octobre 1988, sa carrière à Schalke 04, au Werder Brême, au Real Madrid, à Arsenal, à Fenerbahçe et à l’İstanbul Başakşehir, la victoire de l’Allemagne à la Coupe du monde 2014, sa retraite internationale en 2018 suite à des allégations de discrimination et de manque de respect, ses commentaires de 2019 sur les Ouïghours et la prise de distance d’Arsenal, et le décrit comme un musulman pratiquant, sans mentionner son école religieuse."
  ur: "Mesut Özil پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 15 اکتوبر 1988 کو گیلسن کرچن میں ان کی پیدائش، شالکے 04، ورڈر بریمن، ریئل میڈرڈ، آرسنل، فینرباہ اور استنبول باشیہر میں ان کا کیریئر، جرمنی کے ساتھ 2014 ورلڈ کپ جیتنے، 2018 میں بین الاقوامی فٹبال سے ان کی ریٹائرمنٹ، بین الاقوامی فٹ بال کے خلاف تبصرے اور ان کی بے عزتی کے الزامات کو ریکارڈ کیا گیا ہے۔ اویغوروں اور ہتھیاروں کا دوری کا بیان، اور اسے ایک مشق کرنے والے مسلمان کے طور پر بیان کرتا ہے، اس کے لیے کسی اسکول کا نام نہیں دیتا۔"
  tr: "Mesut Özil hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Bu makale, 15 Ekim 1988'de Gelsenkirchen'deki doğumunu, Schalke, Werder Bremen, Real Madrid, Arsenal, Fenerbahçe ve İstanbul Başakşehir'deki kariyerini, Almanya ile 2014 Dünya Kupası zaferini, 2018'de ayrımcılık ve saygısızlık nedeniyle uluslararası emekliliğini, 2019'da Uygur topluluğuna yönelik yorumlarını ve Arsenal'in kendi hoşnutsuzluğuna dair açıklamasını, kendisini herhangi bir mezhep isimlendirmeden uygulayan bir Müslüman olarak tanımlamasını belgelemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Mesut Özil hanya digunakan untuk fakta entitas tersebut. Artikel ini mendokumentasikan kelahirannya di Gelsenkirchen pada 15 Oktober 1988, kariernya di Schalke, Werder Bremen, Real Madrid, Arsenal, Fenerbahçe, dan Istanbul Başakşehir, kemenangan Piala Dunia 2014 bersama Jerman, pensiun internasionalnya pada 2018 karena diskriminasi dan ketidakhormatan, komentarnya pada 2019 tentang komunitas Uyghur, dan pernyataan Arsenal tentang penolakannya sendiri, yang menggambarkannya sebagai Muslim yang taat tanpa menyebutkan sekte manapun."
