summary:
  ar: "صفحة السيرة في الموقع الرسمي لسيرة سيد بابر علي الذاتية «التعلم من الآخرين» (Learning From Others)؛ تعطي سنوات والده سيد مراتب علي (1882–1961) وتصف عمله في متجر مؤن عائلي كان يمد أفواج الجيش البريطاني، وتذكر أن أبناءه عشرة."
  en: "Biography page of the official website of Syed Babar Ali's autobiography Learning From Others; it gives his father Syed Maratib Ali's years as 1882–1961, describes him operating a family-owned provisions store supplying regiments of the British Army, and gives Babar Ali ten siblings in all (four sons and six daughters of Maratib Ali)."
  es: "Página biográfica del sitio web oficial de la autobiografía de Syed Babar Ali, titulada Learning From Others; en ella se indica que su padre, Syed Maratib Ali, vivió entre 1882 y 1961, se describe cómo dirigía una tienda de provisiones familiar que abastecía a regimientos del ejército británico, y se menciona que Babar Ali tenía diez hermanos en total (cuatro hijos y seis hijas de Maratib Ali)."
  fr: "Page biographique du site officiel de l'autobiographie de Syed Babar Ali, Learning From Others; elle indique les années de son père, Syed Maratib Ali, de 1882 à 1961, décrit comment il exploitait un magasin d'approvisionnement familial fournissant des régiments de l'armée britannique et mentionne que Babar Ali avait dix frères et sœurs au total (quatre fils et six filles de Maratib Ali)."
  ur: "سید بابر علی کی سوانح عمری Learning From Others کی آفیشل ویب سائٹ کا سوانح عمری کا صفحہ؛ اس میں ان کے والد سید مراتیب علی کے سال 1882-1961 بتائے گئے ہیں، وہ بیان کرتے ہیں کہ وہ برطانوی فوج کی رجمنٹس سپلائی کرنے والے خاندانی ملکیتی سامان کی دکان چلا رہے تھے، اور بابر علی کو تمام میں دس بہن بھائی ⁦(مراتب علی کے چار بیٹے اور چھ بیٹیاں)⁩ دیتے ہیں۔"
  tr: "Syed Babur Ali'nin otobiyografisi \"Başkalarından Öğrenmek\"in resmi web sitesindeki biyografi sayfası, babası Syed Ali'nin (1882–1961) yıllarını anlatır ve İngiliz ordu alaylarına tedarik sağlayan bir aile marketindeki çalışmalarını anlatır; çocuklarının on yaşında olduğunu belirtir."
  id: "Halaman biografi di situs resmi otobiografi Syed Babur Ali \"Learning From Others\" menceritakan tahun-tahun ayahnya, Syed Ali (1882–1961), dan menggambarkan pekerjaannya di toko kelontong keluarga yang memasok resimen tentara Inggris, menyebutkan bahwa anak-anaknya berusia sepuluh tahun."
