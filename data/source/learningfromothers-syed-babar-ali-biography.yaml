  ar: "صفحة السيرة في الموقع الرسمي لسيرة سيد بابر علي الذاتية «التعلم من الآخرين» (Learning From Others)؛ تعطي سنوات والده سيد مراتب علي (1882–1961) وتصف عمله في متجر مؤن عائلي كان يمد أفواج الجيش البريطاني، وتذكر أن أبناءه عشرة."
  en: "Biography page of the official website of Syed Babar Ali's autobiography Learning From Others; it gives his father Syed Maratib Ali's years as 1882–1961, describes him operating a family-owned provisions store supplying regiments of the British Army, and gives Babar Ali ten siblings in all (four sons and six daughters of Maratib Ali)."
