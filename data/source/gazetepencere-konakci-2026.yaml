reliability_note: "News report read in full on 4 November 2026; the title above is descriptive, the report being cited for its stated facts: Konakcı is a Diyanet vaiz (preacher); the Presidency of Religious Affairs opened an administrative investigation into him in February 2025 over public statements (his remarks on Hatay after the 6 February earthquakes and on secularism, Atatürk and women); a Diyanet deputy head said in July 2026 that it was still continuing; and the Söke District Muftiate nevertheless invited him to speak on 3 October 2026 at a conference titled 'Dinin Rehberleri İnsanlığın Umududur'. The investigation is recorded as a reported administrative process, not as a finding against him. The report quotes a sermon passage in which he invokes the 'ehli sünnet' (Ahl al-Sunnah) creed; a single quoted sermon line naming the broad Sunni tradition is not two independent attestations of a school and was not used to settle faith."
