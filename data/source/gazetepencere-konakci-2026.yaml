  ar: "خبر من صحيفة «غازيته بنجره» التركية (2 أكتوبر 2026) عن استمرار التحقيق الإداري الذي فتحته رئاسة الشؤون الدينية (ديانت) بحق الواعظ خليل كوناكجي بسبب تصريحاته العلنية، بينما دعته مفتية قضاء سوكه لإلقاء كلمة في مؤتمر في 3 أكتوبر 2026."
  en: "Gazete Pencere news report (2 October 2026) on the Diyanet's continuing administrative investigation into the preacher (vaiz) Halil Konakcı over his public statements, while the Söke District Muftiate invited him to address a conference on 3 October 2026."
