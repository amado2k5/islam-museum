summary:
  ar: "مقالة ويكيبيديا العربية عن سردار آزمون؛ تُستخدم لوقائع الكيان فقط. تثبت ميلاده في كنبد كاووس في 1 يناير 1995 ومسيرته مع روبين قازان وروستوف وزينيت وليفركوزن وروما وشباب الأهلي، وتصفه في متنها بأنه لاعب إيراني من التركمن وأهل السنة، ويعطي صندوق معلوماتها ديانته «مسلم سني»."
  en: "Arabic Wikipedia article on Sardar Azmoun; used for entity facts only. It gives his birth in Gonbad-e Kavus on 1 January 1995 and his career with Rubin Kazan, Rostov, Zenit, Leverkusen, Roma and Shabab Al Ahli; its lead describes him in the article's own voice as an Iranian footballer of the Turkmen and of Ahl al-Sunna, and its infobox gives his religion as 'Sunni Muslim' ⁦(مسلم سني)⁩."
  es: "Artículo de Wikipedia en árabe sobre Sardar Azmoun; Se utiliza únicamente para hechos de entidades. Da su nacimiento en Gonbad-e Kavus el 1 de enero de 1995 y su carrera en el Rubin Kazan, Rostov, Zenit, Leverkusen, Roma y Shabab Al Ahli; su encabezado lo describe con la propia voz del artículo como un futbolista iraní de los turcomanos y de Ahl al-Sunna, y su cuadro de información indica su religión como \"musulmán sunita\" ⁦(مسلم سني)⁩."
  fr: "Article Wikipédia en arabe sur Sardar Azmoun; utilisé uniquement pour les faits d’entité. Il donne sa naissance à Gonbad-e Kavus le 1er janvier 1995 et sa carrière avec Rubin Kazan, Rostov, Zenit, Leverkusen, Roma et Shabab Al Ahli; son auteur le décrit dans sa propre voix comme un footballeur iranien des Turkmènes et d'Ahl al-Sunna, et son infobox donne sa religion comme « musulman sunnite » ⁦(مسلم سني)⁩."
  ur: "سردار ازمون پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1 جنوری 1995 کو گونباد کاووس میں اس کی پیدائش اور روبن کازان، روستوف، زینیت، لیورکوسن، روما اور شباب الاحلی کے ساتھ اس کا کیریئر؛ اس کا لیڈ آرٹیکل کی اپنی آواز میں اسے ترکمان اور اہل السنہ کے ایک ایرانی فٹبالر کے طور پر بیان کرتا ہے، اور اس کا معلوماتی باکس اس کا مذہب بطور 'سنی مسلم' ⁦(مسلم سني)⁩ دیتا ہے۔"
  tr: "Sardar Azmoun hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1 Ocak 1995'te Kanbad Kavus'ta doğduğunu ve Rubin Kazan, Rostov, Zenit, Leverkusen, Roma ve Shabab Al Ahli ile kariyerini doğrular, metinde onu Türkmen ve Sünni topluluklarından İranlı bir oyuncu olarak tanımlar ve bilgi kutusunda dinini \"Sünni Müslüman\" olarak belirtir."
  id: "Artikel Wikipedia berbahasa Arab tentang Sardar Azmoun; hanya digunakan untuk fakta entitas. Artikel ini mengonfirmasi kelahirannya di Kanbad Kavus pada 1 Januari 1995, dan kariernya bersama Rubin Kazan, Rostov, Zenit, Leverkusen, Roma, dan Shabab Al Ahli, menggambarkannya dalam teks sebagai pemain Iran dari komunitas Turkmen dan Sunni, serta mencantumkan agamanya di infobox sebagai \"Muslim Sunni.\""
