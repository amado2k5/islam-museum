reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Azmoun as born on 1 January 1995 in Gonbad-e Kavus, Golestan province. Its lead sentence describes him in the article's own voice as 'an Iranian footballer of the Turkmen and Ahl al-Sunna' (من ترکمن و اهل سنت), and its infobox gives his religion as 'Sunni Muslim' (مسلم سني) — the lead and the infobox of one article are one source family, not two independent attestations. Its career statistics are stale, updated only to May–June 2022 (Leverkusen shown with 9 appearances), so career facts are taken from the English article."
