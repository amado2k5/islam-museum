summary:
  ar: "مقالة ويكيبيديا العربية عن سردار آزمون؛ تُستخدم لوقائع الكيان فقط. تثبت ميلاده في كنبد كاووس في 1 يناير 1995 ومسيرته مع روبين قازان وروستوف وزينيت وليفركوزن وروما وشباب الأهلي، وتصفه في متنها بأنه لاعب إيراني من التركمن وأهل السنة، ويعطي صندوق معلوماتها ديانته «مسلم سني»."
  en: "Arabic Wikipedia article on Sardar Azmoun; used for entity facts only. It gives his birth in Gonbad-e Kavus on 1 January 1995 and his career with Rubin Kazan, Rostov, Zenit, Leverkusen, Roma and Shabab Al Ahli; its lead describes him in the article's own voice as an Iranian footballer of the Turkmen and of Ahl al-Sunna, and its infobox gives his religion as 'Sunni Muslim' (مسلم سني)."
