reliability_note: "Structured data (CC0), grounded by biography (Timbo-born scholar enslaved to Sapelo Island, died 1857) before use. The item is sparse: it gives a birth year of 1770 and carries a single sitelink, to the Indonesian article; it has no death date, no description and no religion value at all, so it attests nothing about his school. The 1770 birth year agrees with the Arabic and Indonesian articles against the English article's 1760–1779 range, and the divergence is recorded in the person record."
