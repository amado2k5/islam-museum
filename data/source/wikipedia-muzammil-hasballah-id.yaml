summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن مزمل حسب الله؛ تُستخدم لوقائع الكيان فقط. تفصّل ولادته في سيغلي بآتشيه سنة 1993، ودراسته للهندسة المعمارية في معهد باندونغ للتكنولوجيا وتخرّجه سنة 2015، وإمامته في مسجد سلمان بالمعهد أثناء دراسته، وتأسيسه منصة نجايلاه ومشروع ملة تور."
  en: "Indonesian Wikipedia article on Muzammil Hasballah; used for entity facts only. It details his birth in Sigli, Aceh, in 1993, his architecture studies at the Bandung Institute of Technology (ITB), graduating in 2015, his imamate at the institute's Salman Mosque while a student, and his founding of the Ngajilah.id platform and the Millahtour.id travel venture."
  es: "Artículo de la Wikipedia en indonesio sobre Muzammil Hasballah; utilizado únicamente para datos sobre la persona. Detalla su nacimiento en Sigli, Aceh, en 1993, sus estudios de arquitectura en el Instituto Tecnológico de Bandung (ITB), donde se graduó en 2015, su cargo como imamato en la Mezquita Salman del instituto mientras era estudiante, y la fundación de la plataforma Ngajilah.id y la empresa de viajes Millahtour.id."
