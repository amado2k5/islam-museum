summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زهرة فيضي؛ تُستخدم لوقائع الكيان فقط. توثّق أنها كبرى بنات حسن علي فيض حيدر وأمير النساء، وأنها كاتبة ومحررة في مجلات النساء الأردية، وأن كتابها «مضامين» ومسرحيتها صدرا سنة 1921 وكتابها في صحة النساء سنة 1934، وأنها توفيت في 23 ديسمبر 1940."
  en: "English Wikipedia article on Zehra Fyzee; used for entity facts only. It records her as the eldest daughter of Hasanally Feyzhyder and Amirunnisa Fyzee, a writer and editor in the Urdu women's journals, her collected articles Mazamin and her play in 1921, her book on women's health in 1934, and her death on 23 December 1940."
  es: "Artículo de la Wikipedia en inglés sobre Zehra Fyzee; utilizado únicamente para datos biográficos. En él se la menciona como la hija mayor de Hasanally Feyzhyder y Amirunnisa Fyzee, escritora y editora de revistas femeninas en urdu, sus artículos recopilados Mazamin y su obra de teatro de 1921, su libro sobre la salud de la mujer de 1934 y su fallecimiento el 23 de diciembre de 1940."
  fr: "Article de Wikipédia en anglais sur Zehra Fyzee; utilisé uniquement pour les informations biographiques. Il la présente comme la fille aînée de Hasanally Feyzhyder et Amirunnisa Fyzee, écrivaine et éditrice dans des revues féminines ourdoues, son recueil d'articles Mazamin et sa pièce de théâtre de 1921, son livre sur la santé des femmes en 1934, et son décès le 23 décembre 1940."
  ur: "زہرہ فائزی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے حسن علی فیذیڈر اور امیر النساء فیضی کی سب سے بڑی بیٹی کے طور پر درج کیا گیا ہے، اردو خواتین کے جرائد میں مصنفہ اور ایڈیٹر، 1921 میں اس کے جمع کیے گئے مضامین مزامن اور اس کا ڈرامہ، 1934 میں خواتین کی صحت پر اس کی کتاب، اور 23 دسمبر 1940 کو ان کی موت۔"
  tr: "Zahra Faydi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Belgelenmiş olarak Hassan Ali Faiz Haidar ve Amir al-Nisa'nın en büyük kızı olduğu, Urduca kadın dergilerinde yazar ve editör olduğu, 'İçindekiler' adlı kitabı ve oyununun 1921'de, kadın sağlığı üzerine kitabının ise 1934'te yayımlandığı ve 23 Aralık 1940'ta vefat ettiği belgelenmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Zahra Faydi; digunakan hanya untuk fakta entitas tersebut. Didokumentasikan bahwa dia adalah putri sulung Hassan Ali Faiz Haidar dan Amir al-Nisa, bahwa dia adalah penulis dan editor untuk majalah wanita Urdu, bahwa bukunya 'Contents' dan dramanya diterbitkan pada tahun 1921, dan bukunya tentang kesehatan wanita pada tahun 1934, dan bahwa dia meninggal pada 23 Desember 1940."
