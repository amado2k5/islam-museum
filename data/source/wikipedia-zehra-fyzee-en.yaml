reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md), read in full on 1 November 2026 at the recorded revision, fetched via the MediaWiki API and re-asserted on a second live query. It gives her dates as 1866 to 23 December 1940; makes her the eldest of three sisters (Atiya, 1877-1967; Nazli Begum, 1874-1968), daughters of Hasanally Feyzhyder and Amirunnisa Fyzee, raised at Mazagaon, Mumbai under the influence of their great-uncle Badruddin Tyabji; records that in 1905 she presided over a women's gathering connected to the Muhammadan Educational Conference and in 1914 was elected to the working committee of the All India Muslim Ladies Conference; lists her journals (Tehzeeb-e-Niswan, Khaton, Ismat), Mazamin (1921), the play Mal-i-khatun (1921) and Tandarusti Hazar Naimat (1934); and records her editing of Atiya's letters and diaries, of Nazli's travelogue Sair-i-Yurop, and of her mother's poetry books Yadgari-Amira and Amin. The article names no religion for Zehra herself; her place of birth and place of death are not stated."
