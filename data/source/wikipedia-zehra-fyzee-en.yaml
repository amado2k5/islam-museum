summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زهرة فيضي؛ تُستخدم لوقائع الكيان فقط. توثّق أنها كبرى بنات حسن علي فيض حيدر وأمير النساء، وأنها كاتبة ومحررة في مجلات النساء الأردية، وأن كتابها «مضامين» ومسرحيتها صدرا سنة 1921 وكتابها في صحة النساء سنة 1934، وأنها توفيت في 23 ديسمبر 1940."
  en: "English Wikipedia article on Zehra Fyzee; used for entity facts only. It records her as the eldest daughter of Hasanally Feyzhyder and Amirunnisa Fyzee, a writer and editor in the Urdu women's journals, her collected articles Mazamin and her play in 1921, her book on women's health in 1934, and her death on 23 December 1940."
