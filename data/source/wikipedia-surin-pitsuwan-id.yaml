summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن سورين بيتسوان (1949–2017)؛ تُستخدم لوقائع الكيان فقط. يصنّف صندوق معلوماتها دينه «إسلام سني» — تصنيف صندوق وحيد محفوظ في ملحوظة الإيمان بسجل الشخص — ويصفه متنها بأنه مسلم من أصل ملايوي باتاني."
  en: "Indonesian Wikipedia article on Surin Pitsuwan (1949–2017); used for entity facts only. Its infobox files his religion as 'Sunni Islam' — a single infobox filing, preserved as a reading in the person record's faith note — and its text describes him as a Muslim of Pattani Malay descent."
  es: "Artículo de la Wikipedia en indonesio sobre Surin Pitsuwan (1949-2017); utilizado únicamente para datos sobre la persona. Su ficha informativa indica que su religión es \"islam sunita\" —una única entrada en la ficha informativa, conservada como lectura en la nota sobre la fe del registro de la persona— y su texto lo describe como musulmán de ascendencia malaya de Pattani."
  fr: "Article de Wikipédia indonésien sur Surin Pitsuwan (1949-2017); utilisé uniquement pour les informations sur l'entité. Son infobox indique sa religion comme étant l'« islam sunnite » — une seule information, conservée dans la note sur la religion de la fiche de personne — et son texte le décrit comme un musulman d'origine malaise de Pattani."
  ur: "سورن پٹسووان (1949–2017) پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا انفو باکس اس کے مذہب کو 'سنی اسلام' کے طور پر فائل کرتا ہے - ایک انفو باکس فائلنگ، جو شخص کے ریکارڈ کے عقیدے کے نوٹ میں پڑھنے کے طور پر محفوظ ہے - اور اس کا متن اسے پٹانی مالائی نسل کے مسلمان کے طور پر بیان کرتا ہے۔"
  tr: "Suren Pitswan hakkında Endonezya Vikipedi makalesi (1949–2017); yalnızca varlık gerçekleri için kullanılmıştır. Bilgi kutusu, dinini \"Sünni İslam\" olarak sınıflandırır — Kişinin İnanç Kaydı notunda korunan tek kutu sınıflandırması — ve onu Malawi-Pattani kökenli bir Müslüman olarak tanımlar."
  id: "Artikel Wikipedia Indonesia tentang Suren Pitswan (1949–2017); digunakan hanya untuk fakta entitas. Infobox-nya mengklasifikasikan agamanya sebagai \"Islam Sunni\" — klasifikasi satu kotak yang tersimpan dalam catatan Person's Record of Faith — dan menggambarkannya sebagai Muslim asal Malawi-Pattani."
