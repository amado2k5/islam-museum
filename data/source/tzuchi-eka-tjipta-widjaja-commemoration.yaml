reliability_note: "Commemorative article read in full on 1 November 2026 at the foundation's own site. It reports Widjaja's own words at the 19 March 2002 Malam Cinta Kasih gathering — 'he also told them that he is a Christian' — a self-identification reported in a text, and it is one of the two independent texts the person record's faith rests on (Master Cheng Yen's 2017 lecture, published separately by the same foundation, is the other). His support for a Buddhist charity is philanthropy and is not itself the attestation."
