label: { en: "In Commemoration: Eka Tjipta Widjaja Figure — Tzu Chi Indonesia" }
summary:
  ar: "مقالة مؤسسة تزوتشي إندونيسيا التذكارية عن إيكا تجيبتا ويدجاجا بعد وفاته سنة 2019؛ تروي دعمه الطويل لأعمال المؤسسة الإنسانية، وتذكر أنه قال للجمهور في فعالية «مالام تشينتا كاسيه» سنة 2002 إنه مسيحي، مع تعاطفه مع أنشطة تزوتشي الإنسانية."
  en: "Tzu Chi Indonesia's commemorative article on Eka Tjipta Widjaja, published after his death in 2019; it recounts his long support for the foundation's humanitarian work and records that at the 2002 Malam Cinta Kasih event he told the audience that he is a Christian, while sympathising with Tzu Chi's humanitarian activities."
  es: "El artículo conmemorativo de Tzu Chi Indonesia sobre Eka Tjipta Widjaja, publicado tras su fallecimiento en 2019, relata su prolongado apoyo a la labor humanitaria de la fundación y recoge que, en el evento Malam Cinta Kasih de 2002, declaró ante el público que era cristiano, al tiempo que simpatizaba con las actividades humanitarias de Tzu Chi."
  fr: "L'article commémoratif de Tzu Chi Indonesia sur Eka Tjipta Widjaja, publié après sa mort en 2019, relate son long soutien au travail humanitaire de la fondation et indique qu'à l'événement Malam Cinta Kasih de 2002, il a déclaré au public qu'il était chrétien, tout en sympathisant avec les activités humanitaires de Tzu Chi."
  ur: "زو چی انڈونیشیا کا یادگاری مضمون Eka Tjipta Widjaja پر، جو 2019 میں ان کی موت کے بعد شائع ہوا؛ یہ فاؤنڈیشن کے انسانی ہمدردی کے کاموں کے لیے ان کی طویل حمایت کا تذکرہ کرتا ہے اور ریکارڈ کرتا ہے کہ 2002 کے مالم سنٹا کاشیح تقریب میں اس نے زو چی کی انسانی سرگرمیوں سے ہمدردی ظاہر کرتے ہوئے سامعین کو بتایا کہ وہ ایک عیسائی ہیں۔"
  tr: "Tzochi Indonesia Memorial Foundation'ın 2019'daki ölümünden sonra Eika Jipta Widjaja hakkında yazdığı makale, vakfın insani çalışmalarına uzun süredir verdiği desteği anlatıyor ve 2002'deki \"Malam Chinta Kasie\" etkinliğinde dinleyicilere Hristiyan olduğunu söylediğini ve Zuchi'nin insani faaliyetlerine sempati duyduğunu hatırlatıyor."
  id: "Artikel Tzochi Indonesia Memorial Foundation tentang Eika Jipta Widjaja setelah kematiannya pada 2019 menceritakan dukungannya yang telah lama terhadap pekerjaan kemanusiaan yayasan tersebut, dan mengenang bahwa ia mengatakan kepada hadirin pada acara \"Malam Chinta Kasie\" tahun 2002 bahwa ia adalah seorang Kristen, bersimpati dengan aktivitas kemanusiaan Zuchi."
