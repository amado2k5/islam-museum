summary:
  ar: "مقالة مؤسسة تزوتشي إندونيسيا التذكارية عن إيكا تجيبتا ويدجاجا بعد وفاته سنة 2019؛ تروي دعمه الطويل لأعمال المؤسسة الإنسانية، وتذكر أنه قال للجمهور في فعالية «مالام تشينتا كاسيه» سنة 2002 إنه مسيحي، مع تعاطفه مع أنشطة تزوتشي الإنسانية."
  en: "Tzu Chi Indonesia's commemorative article on Eka Tjipta Widjaja, published after his death in 2019; it recounts his long support for the foundation's humanitarian work and records that at the 2002 Malam Cinta Kasih event he told the audience that he is a Christian, while sympathising with Tzu Chi's humanitarian activities."
