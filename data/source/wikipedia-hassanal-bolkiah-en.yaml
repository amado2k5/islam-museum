summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسن البلقية (وُلد 1946)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في مدينة بروناي أكبر أبناء عمر علي سيف الدين الثالث، وتعليمه في مؤسسة فيكتوريا بكوالالمبور وفي ساندهيرست، وتنصيبه سلطانا تاسعا وعشرين في 5 أكتوبر 1967 وتتويجه في 1 أغسطس 1968، واستقلال بروناي في 1 يناير 1984 وهو رئيس وزرائها تحت فلسفة «الملايو والإسلام والملكية»، وجدل قانون العقوبات الشرعي 2014–2019، ويوبيله الذهبي سنة 2017."
  en: "English Wikipedia article on Hassanal Bolkiah (born 1946); used for entity facts only. It recounts his Brunei Town birth as the eldest son of Omar Ali Saifuddien III, his schooling at the Victoria Institution in Kuala Lumpur and at Sandhurst, his proclamation as the 29th Sultan on 5 October 1967 and his coronation on 1 August 1968, Brunei's independence on 1 January 1984 with himself as prime minister under the Melayu Islam Beraja philosophy, the Syariah Penal Code controversy of 2014–2019, and his Golden Jubilee in 2017."
