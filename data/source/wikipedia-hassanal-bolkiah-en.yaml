summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسن البلقية ⁦(وُلد 1946)⁩؛ تُستخدم لوقائع الكيان فقط. تروي مولده في مدينة بروناي أكبر أبناء عمر علي سيف الدين الثالث، وتعليمه في مؤسسة فيكتوريا بكوالالمبور وفي ساندهيرست، وتنصيبه سلطانا تاسعا وعشرين في 5 أكتوبر 1967 وتتويجه في 1 أغسطس 1968، واستقلال بروناي في 1 يناير 1984 وهو رئيس وزرائها تحت فلسفة «الملايو والإسلام والملكية»، وجدل قانون العقوبات الشرعي 2014–2019، ويوبيله الذهبي سنة 2017."
  en: "English Wikipedia article on Hassanal Bolkiah (born 1946); used for entity facts only. It recounts his Brunei Town birth as the eldest son of Omar Ali Saifuddien III, his schooling at the Victoria Institution in Kuala Lumpur and at Sandhurst, his proclamation as the 29th Sultan on 5 October 1967 and his coronation on 1 August 1968, Brunei's independence on 1 January 1984 with himself as prime minister under the Melayu Islam Beraja philosophy, the Syariah Penal Code controversy of 2014–2019, and his Golden Jubilee in 2017."
  es: "Artículo de la Wikipedia en inglés sobre Hassanal Bolkiah (nacido en 1946); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Brunei Town como hijo mayor de Omar Ali Saifuddien III, su educación en la Victoria Institution de Kuala Lumpur y en Sandhurst, su proclamación como el 29.º sultán el 5 de octubre de 1967 y su coronación el 1 de agosto de 1968, la independencia de Brunei el 1 de enero de 1984, con él mismo como primer ministro bajo la filosofía Melayu Islam Beraja, la controversia del Código Penal de la Sharia de 2014-2019 y su Jubileo de Oro en 2017."
  fr: "Article de Wikipédia en anglais sur Hassanal Bolkiah (né en 1946); utilisé uniquement pour les informations le concernant. Il relate sa naissance à Brunei Town, fils aîné d’Omar Ali Saifuddien III, ses études à la Victoria Institution de Kuala Lumpur et à Sandhurst, sa proclamation comme 29e sultan le 5 octobre 1967 et son couronnement le 1er août 1968, l’indépendance du Brunei le 1er janvier 1984, durant laquelle il devint Premier ministre sous l’égide de la philosophie Melayu Islam Beraja, la controverse relative au Code pénal de la charia de 2014 à 2019 et son jubilé d’or en 2017."
