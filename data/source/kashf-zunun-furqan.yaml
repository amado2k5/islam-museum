summary:
  ar: "كشف الظنون عن أسامي الكتب والفنون لحاجي خليفة مصطفى بن عبد الله المعروف بكاتب جلبي ⁦(ت 1067هـ)⁩، تحقيق إكمل الدين إحسان أوغلي وبشار عواد معروف ⁦(مؤسسة الفرقان للتراث الإسلامي 2004)⁩؛ المجلد الأول ممسوح في مكتبة الحصاد المحلية أجريت عليه قراءة آلية بآبل فيجن — يضم مقدمة المؤلف المشهورة وباب الألف وحرفي التاء والثاء ⁦(نحو ألفي مدخل)⁩."
  en: "Hajji Khalifa's Kashf al-Zunun (d. 1067 AH), the great Ottoman bibliography, Furqan Foundation critical edition (2004); volume 1 OCR'd with Apple Vision — the celebrated authorial preface plus letters alif, ta' and tha' (about two thousand entries)."
  es: "Kashf al-Zunun (m. 1067 d. H.), de Hajji Khalifa, la gran bibliografía otomana, edición crítica de la Fundación Furqan (2004); Volumen 1 OCR con Apple Vision: el célebre prefacio del autor más las letras alif, ta' y tha' (alrededor de dos mil entradas)."
  fr: "Kashf al-Zunun de Hajji Khalifa (mort en 1067 AH), la grande bibliographie ottomane, édition critique de la Fondation Furqan (2004); volume 1 OCR avec Apple Vision - la célèbre préface de l'auteur ainsi que les lettres alif, ta' et tha' (environ deux mille entrées)."
  ur: "حاجی خلیفہ کا کشف الزنون ⁦(متوفی 1067ھ)⁩، عظیم عثمانی کتابیات، فرقان فاؤنڈیشن تنقیدی ایڈیشن (2004)؛ جلد 1 OCR'd Apple Vision کے ساتھ — مشہور تصنیف دیباچہ کے علاوہ حروف الف، تا' اور تھا' ⁦(تقریباً دو ہزار اندراجات)⁩۔"
