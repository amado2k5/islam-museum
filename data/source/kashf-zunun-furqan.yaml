  ar: "كشف الظنون عن أسامي الكتب والفنون لحاجي خليفة مصطفى بن عبد الله المعروف بكاتب جلبي (ت 1067هـ)، تحقيق إكمل الدين إحسان أوغلي وبشار عواد معروف (مؤسسة الفرقان للتراث الإسلامي 2004)؛ المجلد الأول ممسوح في مكتبة الحصاد المحلية أجريت عليه قراءة آلية بآبل فيجن — يضم مقدمة المؤلف المشهورة وباب الألف وحرفي التاء والثاء (نحو ألفي مدخل)."
