  ar: "مقالة ويكيبيديا الأردية عن ڈیوائٹ محمد قوی؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده باسم دوايت براكستون في 5 يناير 1953 في بالتيمور ووفاته في 25 يوليو 2025، وتذكر في متنها أنه اعتنق الإسلام في أوائل الثمانينيات وغيّر اسمه، إلا أن صندوق معلوماتها يعطي مكان وفاته كامدن بخلاف المقالة الإنجليزية."
  en: "Urdu Wikipedia article on Dwight Muhammad Qawi; used for entity facts only. It gives his birth as Dwight Braxton on 5 January 1953 in Baltimore and his death on 25 July 2025, and states in its text that he accepted Islam in the early 1980s and changed his name, though its infobox gives Camden as his place of death, against the English article's Baltimore."
