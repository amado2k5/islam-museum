summary:
  ar: "مقالة ويكيبيديا الأردية عن ڈیوائٹ محمد قوی؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده باسم دوايت براكستون في 5 يناير 1953 في بالتيمور ووفاته في 25 يوليو 2025، وتذكر في متنها أنه اعتنق الإسلام في أوائل الثمانينيات وغيّر اسمه، إلا أن صندوق معلوماتها يعطي مكان وفاته كامدن بخلاف المقالة الإنجليزية."
  en: "Urdu Wikipedia article on Dwight Muhammad Qawi; used for entity facts only. It gives his birth as Dwight Braxton on 5 January 1953 in Baltimore and his death on 25 July 2025, and states in its text that he accepted Islam in the early 1980s and changed his name, though its infobox gives Camden as his place of death, against the English article's Baltimore."
  es: "Artículo de Wikipedia en urdu sobre Dwight Muhammad Qawi; utilizado únicamente para datos sobre la persona. Indica que nació como Dwight Braxton el 5 de enero de 1953 en Baltimore y que falleció el 25 de julio de 2025, y afirma en su texto que se convirtió al islam a principios de la década de 1980 y cambió su nombre, aunque su ficha informativa indica Camden como su lugar de fallecimiento, en contraposición a Baltimore, según el artículo en inglés."
  fr: "Article de Wikipédia en ourdou sur Dwight Muhammad Qawi; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance sous le nom de Dwight Braxton le 5 janvier 1953 à Baltimore et son décès le 25 juillet 2025. Le texte précise qu'il s'est converti à l'islam au début des années 1980 et a changé de nom, bien que l'infobox mentionne Camden comme lieu de décès, contrairement à l'article en anglais qui indique Baltimore."
