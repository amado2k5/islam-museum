reliability_note: "Read in the museum's session on 20 November 2026. It says his date of birth is not known exactly but that a verse of his suggests the early 4th/10th century; that he was born and lived at Askar Mukram in Khuzistan and studied at Isfahan, Baghdad and Basra; and describes al-Furuq al-lughawiyya as examining the differences of meaning between synonyms, edited from four manuscripts by Husam al-Din al-Qudsi (Beirut, n.d.) and abridged by an unknown author in a Mukhtasar printed at Bulaq (1323) and Cairo (1926). Used for entity facts only."
