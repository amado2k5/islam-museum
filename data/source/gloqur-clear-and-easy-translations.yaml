summary:
  ar: "تدوينة لجوانا بينك في مشروع «القرآن العالمي»، 1 نوفمبر 2024، تقارن ثلاث ترجمات إنجليزية حديثة تصف نفسها بالوضوح والسهولة، منها «القرآن الواضح» لمصطفى خطاب: ناشرها الأول مؤسسة «بوك أوف ساينز» في لومبارد بإلينوي سنة 2016، وتوزيع دار السلام، ولغتها الإنجليزية الكندية، وعناوينها الموضوعية ومقدمات سورها."
  en: "A post by Johanna Pink for the Global Qur'an project, 1 November 2024, comparing three recent English translations that describe themselves as clear or easy, among them Mustafa Khattab's The Clear Qur'an: first published by the Book of Signs Foundation in Lombard, Illinois, in 2016, distributed by Darussalam, written in Canadian English, with thematic headers and sura introductions."
  ur: "«گلوبل قرآن» منصوبے میں یوہانا پنک کی تحریر، 1 نومبر 2024، تین جدید انگریزی تراجم کا موازنہ جو خود کو واضح یا آسان کہتے ہیں، ان میں مصطفیٰ خطاب کا «دی کلیئر قرآن»: پہلی اشاعت بک آف سائنز فاؤنڈیشن، لومبارڈ، الینوائے، 2016، تقسیم دار السلام، کینیڈین انگریزی، موضوعاتی عنوانات اور سورتوں کے تعارف۔"
  es: "Un artículo de Johanna Pink para el proyecto Global Qur'an, del 1 de noviembre de 2024, que compara tres traducciones recientes al inglés que se describen a sí mismas como claras o fáciles, entre ellas The Clear Qur'an de Mustafa Khattab: publicado por primera vez por la Fundación Book of Signs en Lombard, Illinois, en 2016, distribuido por Darussalam, escrito en inglés canadiense, con encabezados temáticos e introducciones a las suras."
  fr: "Un article de Johanna Pink pour le projet Global Qur'an, 1er novembre 2024, comparant trois traductions anglaises récentes qui se décrivent comme claires ou faciles, parmi lesquelles The Clear Qur'an de Mustafa Khattab: publié pour la première fois par la Book of Signs Foundation à Lombard, Illinois, en 2016, distribué par Darussalam, écrit en anglais canadien, avec des titres thématiques et des introductions aux sourates."
title: "Qur'an translation of the week #204: The Qur'an, clear and easy: Three recent English translations"
