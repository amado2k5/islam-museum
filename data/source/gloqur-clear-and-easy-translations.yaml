summary:
  ar: "تدوينة لجوانا بينك في مشروع «القرآن العالمي»، 1 نوفمبر 2024، تقارن ثلاث ترجمات إنجليزية حديثة تصف نفسها بالوضوح والسهولة، منها «القرآن الواضح» لمصطفى خطاب: ناشرها الأول مؤسسة «بوك أوف ساينز» في لومبارد بإلينوي سنة 2016، وتوزيع دار السلام، ولغتها الإنجليزية الكندية، وعناوينها الموضوعية ومقدمات سورها."
  en: "A post by Johanna Pink for the Global Qur'an project, 1 November 2024, comparing three recent English translations that describe themselves as clear or easy, among them Mustafa Khattab's The Clear Qur'an: first published by the Book of Signs Foundation in Lombard, Illinois, in 2016, distributed by Darussalam, written in Canadian English, with thematic headers and sura introductions."
  ur: "«گلوبل قرآن» منصوبے میں یوہانا پنک کی تحریر، 1 نومبر 2024، تین جدید انگریزی تراجم کا موازنہ جو خود کو واضح یا آسان کہتے ہیں، ان میں مصطفیٰ خطاب کا «دی کلیئر قرآن»: پہلی اشاعت بک آف سائنز فاؤنڈیشن، لومبارڈ، الینوائے، 2016، تقسیم دار السلام، کینیڈین انگریزی، موضوعاتی عنوانات اور سورتوں کے تعارف۔"
