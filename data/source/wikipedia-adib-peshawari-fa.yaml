  ar: "مقالة ويكيبيديا الفارسية عن الأديب البيشاوري؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته سنة 1260 هـ في بيشاور ووفاته في 3 صفر 1349 هـ في طهران، وتصفه بأنه من أتباع الطريقة الصوفية السهروردية، وتروي تعليمه في كابل وغزني وهرات ومشهد وسبزوار وقصيدته «قيصرنامه»."
  en: "Persian Wikipedia article on Adib Pishavari; used for entity facts only. It gives his birth in 1260 AH at Peshawar and his death on 3 Safar 1349 AH at Tehran, describes him as a follower of the Suhrawardi Sufi order, and recounts his education at Kabul, Ghazni, Herat, Mashhad and Sabzevar and his Qaysarnama poem."
