summary:
  ar: "مقالة ويكيبيديا العربية عن ملالي مايواند؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تعطي مولدها سنة 1861 في كيغ بولاية قندهار ووفاتها في يوليو 1880 في مايواند، وتروي قصتها بنت الراعي التي رفعت حجابها الأبيض راية حين سقط حامل الراية، وتعطي دينها في صندوق المعلومات «أهل السنة والجماعة». لا تناقش المقالة مسألة وجودها التاريخي."
  en: "Arabic Wikipedia article on Malalai of Maiwand; a short article used for entity facts only. It gives her birth in 1861 at Khig in Kandahar province and her death in July 1880 at Maiwand, recounts her story as the shepherd's daughter who raised her white veil as a standard when the standard-bearer fell, and gives her religion in the infobox as Ahl al-Sunna wa'l-Jama'a. The article does not discuss the question of her historicity."
  es: "Artículo en árabe de la Wikipedia sobre Malalai de Maiwand; un breve artículo que solo incluye datos sobre la persona. Indica su nacimiento en 1861 en Khig, provincia de Kandahar, y su fallecimiento en julio de 1880 en Maiwand. Narra su historia como la hija del pastor que alzó su velo blanco como estandarte cuando cayó el portaestandarte, y señala su religión en el recuadro informativo como Ahl al-Sunna wa'l-Jama'a. El artículo no aborda la cuestión de su historicidad."
  fr: "Article de Wikipédia en arabe sur Malalai de Maiwand; un court article fournissant uniquement des informations factuelles. Il indique sa naissance en 1861 à Khig, dans la province de Kandahar, et sa mort en juillet 1880 à Maiwand. L’article relate son histoire: celle d’une fille de berger qui, à la chute du porte-étendard, leva son voile blanc en signe de ralliement. L’encadré précise également son appartenance religieuse: Ahl al-Sunna wa’l-Jama’a. L’article n’aborde pas la question de son historicité."
  ur: "میوند کی ملائی پر عربی ویکیپیڈیا مضمون؛ ایک مختصر مضمون جو صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ یہ 1861 میں صوبہ قندھار کے کھگ میں اس کی پیدائش اور جولائی 1880 میں میوند میں اس کی موت ہوئی، اس کی کہانی چرواہے کی بیٹی کے طور پر بیان کرتی ہے جس نے معیار کے گرنے پر اپنا سفید پردہ ایک معیار کے طور پر اٹھایا، اور معلومات کے خانے میں اپنا مذہب اہل السنۃ والجماعۃ کے طور پر پیش کیا۔ مضمون میں اس کی تاریخی حیثیت کے سوال پر بحث نہیں کی گئی ہے۔"
  tr: "Malalai Maywand hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılan kısa bir makale. 1861'de Kandahar eyaletinin Kig kentinde doğdu ve Temmuz 1880'de Maywand'da vefat etti; çobanın kızının, sancaktar düştüğünde beyaz peçesini bir bayrak olarak kaldırmasının hikayesini anlatıyor ve 'Ahl al-Sunnah wal-Jama'ah' bilgi kutusunda dinini veriyor. Makale, onun tarihsel varoluşu konusunu ele almamaktadır."
  id: "Artikel Wikipedia Arab tentang Malalai Maywand; artikel singkat yang hanya digunakan untuk fakta entitas tersebut. Ia melahirkan pada tahun 1861 di Kig, provinsi Kandahar, dan meninggal pada Juli 1880 di Maywand, serta menceritakan kisah putri gembala yang mengangkat kerudung putihnya sebagai panji ketika pembawa panji jatuh, dan memberikan agamanya di kotak info 'Ahl al-Sunnah wal-Jama'ah.' Artikel tersebut tidak membahas isu keberadaan historisnya."
