  ar: "مقالة ويكيبيديا العربية عن ملالي مايواند؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تعطي مولدها سنة 1861 في كيغ بولاية قندهار ووفاتها في يوليو 1880 في مايواند، وتروي قصتها بنت الراعي التي رفعت حجابها الأبيض راية حين سقط حامل الراية، وتعطي دينها في صندوق المعلومات «أهل السنة والجماعة». لا تناقش المقالة مسألة وجودها التاريخي."
  en: "Arabic Wikipedia article on Malalai of Maiwand; a short article used for entity facts only. It gives her birth in 1861 at Khig in Kandahar province and her death in July 1880 at Maiwand, recounts her story as the shepherd's daughter who raised her white veil as a standard when the standard-bearer fell, and gives her religion in the infobox as Ahl al-Sunna wa'l-Jama'a. The article does not discuss the question of her historicity."
