summary:
  ar: "مقالة ويكيبيديا العربية عن الشيخ سالم المبارك الصباح (1864 – 23 فبراير 1921)، حاكم الكويت التاسع، والابن الثاني لمبارك الصباح من شيخة دعيج الصباح؛ تذكر توليه الحكم في 5 فبراير 1917 بعد أخيه جابر، وأحداث عهده: بناء سور الكويت الثالث ومعركتي حمض والجهراء، وتعدد أسرته ومنهم الأميرون اللاحقون عبد الله السالم وصباح السالم."
  en: "Arabic Wikipedia article on Sheikh Salim Al-Mubarak Al-Sabah (1864 – 23 February 1921), ninth ruler of Kuwait and second son of Mubarak Al-Sabah by Sheikha Duaij Al-Sabah; it dates his accession to 5 February 1917 after his brother Jaber, lists the events of his reign — the building of Kuwait's third wall and the battles of Hamdh and Jahra — and gives his large family, including the later emirs Abdullah Al-Salim and Sabah Al-Salim."
