summary:
  ar: "مقالة ويكيبيديا العربية عن الشيخ سالم المبارك الصباح ⁦(1864 – 23 فبراير 1921)⁩، حاكم الكويت التاسع، والابن الثاني لمبارك الصباح من شيخة دعيج الصباح؛ تذكر توليه الحكم في 5 فبراير 1917 بعد أخيه جابر، وأحداث عهده: بناء سور الكويت الثالث ومعركتي حمض والجهراء، وتعدد أسرته ومنهم الأميرون اللاحقون عبد الله السالم وصباح السالم."
  en: "Arabic Wikipedia article on Sheikh Salim Al-Mubarak Al-Sabah (1864 – 23 February 1921), ninth ruler of Kuwait and second son of Mubarak Al-Sabah by Sheikha Duaij Al-Sabah; it dates his accession to 5 February 1917 after his brother Jaber, lists the events of his reign — the building of Kuwait's third wall and the battles of Hamdh and Jahra — and gives his large family, including the later emirs Abdullah Al-Salim and Sabah Al-Salim."
  es: "Artículo en árabe de la Wikipedia sobre el jeque Salim Al-Mubarak Al-Sabah (1864 – 23 de febrero de 1921), noveno gobernante de Kuwait y segundo hijo de Mubarak Al-Sabah y la jequesa Duaij Al-Sabah; fecha su ascenso al trono el 5 de febrero de 1917, después de su hermano Jaber, enumera los acontecimientos de su reinado —la construcción de la tercera muralla de Kuwait y las batallas de Hamdh y Jahra— y menciona a su numerosa familia, incluidos los posteriores emires Abdullah Al-Salim y Sabah Al-Salim."
  fr: "Article de Wikipédia en arabe sur Cheikh Salim Al-Mubarak Al-Sabah (1864 – 23 février 1921), neuvième souverain du Koweït et deuxième fils de Mubarak Al-Sabah et de Cheikha Duaij Al-Sabah; il date son accession au trône du 5 février 1917 après son frère Jaber, énumère les événements de son règne — la construction du troisième mur du Koweït et les batailles de Hamdh et Jahra — et donne sa nombreuse famille, y compris les émirs ultérieurs Abdullah Al-Salim et Sabah Al-Salim."
