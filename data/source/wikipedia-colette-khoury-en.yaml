summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كوليت الخوري؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها سنة 1931 في باب توما بدمشق ووفاتها في 10 أبريل 2026 عن عمر 95، وأنها حفيدة فارس الخوري، وروايتها «أيام معه» (1961)، وعضويتها في مجلس الشعب 1990–1995 وتعيينها مستشارة أدبية للرئيس سنة 2008، وتصنّفها تصنيفاتها في المسيحيين السوريين دون أن تسمّي نصوصها ديانة شخصية لها."
  en: "English Wikipedia article on Colette Khoury; used for entity facts only. It gives her birth in 1931 at Bab Tuma, Damascus, and her death on 10 April 2026 aged 95; her grandfather Fares al-Khoury; her novel Days With Him (1961); her parliament membership 1990–1995 and her 2008 appointment as literary adviser to the president. Its categories file her under Syrian Christians, but its text names no personal religion for her."
  es: "Artículo de la Wikipedia en inglés sobre Colette Khoury; utilizado únicamente para datos biográficos. Indica que nació en 1931 en Bab Tuma, Damasco, y falleció el 10 de abril de 2026 a los 95 años; su abuelo, Fares al-Khoury; su novela Días con él (1961); su escaño en el parlamento entre 1990 y 1995 y su nombramiento en 2008 como asesora literaria del presidente. La clasifica dentro de la comunidad cristiana siria, pero el texto no menciona su religión personal."
  fr: "L'article de Wikipédia en anglais consacré à Colette Khoury, utilisé uniquement pour les informations la concernant, indique sa naissance en 1931 à Bab Tuma (Damas) et son décès le 10 avril 2026 à l'âge de 95 ans; son grand-père, Fares al-Khoury; son roman « Des jours avec lui » (1961); son mandat de députée de 1990 à 1995 et sa nomination en 2008 comme conseillère littéraire auprès du président. Elle est classée parmi les chrétiennes syriennes, mais le texte ne mentionne aucune religion personnelle."
  ur: "Colette Khoury پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 1931 میں باب تما، دمشق میں ہوئی اور اس کی موت 10 اپریل 2026 کو 95 سال کی عمر میں ہوئی۔ اس کے دادا فریس الخوری؛ اس کا ناول Days With Him (1961)؛ ان کی پارلیمنٹ کی رکنیت 1990-1995 اور 2008 میں صدر کے ادبی مشیر کے طور پر ان کی تقرری۔ اس کے زمرے اسے شامی عیسائیوں کے تحت درج کرتے ہیں، لیکن اس کے متن میں اس کا کوئی ذاتی مذہب نہیں ہے۔"
