  ar: "مقالة ويكيبيديا الإنجليزية عن كوليت الخوري؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها سنة 1931 في باب توما بدمشق ووفاتها في 10 أبريل 2026 عن عمر 95، وأنها حفيدة فارس الخوري، وروايتها «أيام معه» (1961)، وعضويتها في مجلس الشعب 1990–1995 وتعيينها مستشارة أدبية للرئيس سنة 2008، وتصنّفها تصنيفاتها في المسيحيين السوريين دون أن تسمّي نصوصها ديانة شخصية لها."
  en: "English Wikipedia article on Colette Khoury; used for entity facts only. It gives her birth in 1931 at Bab Tuma, Damascus, and her death on 10 April 2026 aged 95; her grandfather Fares al-Khoury; her novel Days With Him (1961); her parliament membership 1990–1995 and her 2008 appointment as literary adviser to the president. Its categories file her under Syrian Christians, but its text names no personal religion for her."
