summary:
  ar: "مقالة ويكيبيديا الفرنسية عن حسين بن علي الهاشمي ⁦(وُلد نحو 1853 في القسطنطينية – توفي 4 يونيو 1931 في عمان)⁩، شريف مكة حتى 1924 وملك الحجاز 1916–1924 وخليفة من 1924؛ تروي ثورته على الدولة العثمانية، ورفضه معاهدة فرساي، وهزيمته أمام ابن سعود ومنفاه في قبرص ووفاته في عمان ودفنه في المدرسة الأرغونية داخل الحرم الشريف، وموقفه الحامي للأرمن."
  en: "French Wikipedia article on Hussein bin Ali al-Hashimi (born about 1853 at Constantinople – died 4 June 1931 at Amman), Sharif of Mecca until 1924, King of the Hejaz 1916–1924 and Caliph from 1924; it recounts his revolt against the Ottoman Empire, his refusal of the Treaty of Versailles, his defeat by Ibn Saud, exile to Cyprus, death at Amman, burial in the Arghuniyya madrasa inside the Haram al-Sharif, and his protection of the Armenians."
  es: "Artículo de la Wikipedia en francés sobre Hussein bin Ali al-Hashimi (nacido alrededor de 1853 en Constantinopla y fallecido el 4 de junio de 1931 en Amán), jerife de La Meca hasta 1924, rey del Hiyaz entre 1916 y 1924 y califa desde 1924; relata su revuelta contra el Imperio Otomano, su rechazo al Tratado de Versalles, su derrota ante Ibn Saud, su exilio a Chipre, su muerte en Amán, su entierro en la madrasa Arghuniyya dentro del Haram al-Sharif y su protección de los armenios."
  fr: "L'article de Wikipédia en français sur Hussein bin Ali al-Hashimi (né vers 1853 à Constantinople – mort le 4 juin 1931 à Amman), chérif de La Mecque jusqu'en 1924, roi du Hedjaz de 1916 à 1924 et calife à partir de 1924; il relate sa révolte contre l'Empire ottoman, son refus du traité de Versailles, sa défaite face à Ibn Saoud, son exil à Chypre, sa mort à Amman, son inhumation dans la madrasa Arghuniyya à l'intérieur du Haram al-Sharif et sa protection des Arméniens."
  ur: "حسین بن علی الہاشمی ⁦(تقریباً 1853 میں قسطنطنیہ میں پیدا ہوا - وفات 4 جون 1931 عمان میں)⁩، مکہ شریف 1924 تک، حجاز کے بادشاہ 1916-1924 اور 1924 سے خلیفہ پر فرانسیسی ویکیپیڈیا کا مضمون۔ اس میں سلطنت عثمانیہ کے خلاف اس کی بغاوت، معاہدہ ورسائی سے انکار، ابن سعود کے ہاتھوں اس کی شکست، قبرص میں جلاوطنی، عمان میں موت، حرم الشریف کے اندر ارغونیہ مدرسہ میں تدفین، اور آرمینیائیوں کے تحفظ کا ذکر ہے۔"
  tr: "Fransızca Vikipedi makalesi, Hüseyin bin Ali el-Haşimi (yaklaşık 1853 yılında İstanbul'da doğdu – 4 Haziran 1931'de Amman'da öldü), 1924'e kadar Mekke Şerifi, 1916–1924 yılları arasında Hicaz Kralı ve 1924'ten itibaren Halife hakkında; Osmanlı İmparatorluğu'na karşı devrimini, Versay Antlaşması'nı reddetmesini, İbn Suud'a yenilmesini, Kıbrıs'a sürgününü, Amman'da ölümünü, Haram el-Şerif içindeki Aragon okuluna gömülmesini ve Ermenilere karşı destekleyici tutumunu anlatır."
  id: "Artikel Wikipedia Prancis tentang Hussein bin Ali al-Hashimi (lahir sekitar tahun 1853 di Konstantinopel – meninggal 4 Juni 1931 di Amman), Sharif Mekah hingga 1924, Raja Hejaz dari 1916–1924, dan Khalifah dari 1924; menceritakan revolusinya melawan Kekaisaran Ottoman, penolakannya terhadap Perjanjian Versailles, kekalahannya oleh Ibn Saud, pengasingannya di Siprus, kematiannya di Amman, pemakamannya di sekolah Aragon dalam Haram al-Sharif, dan sikap dukungannya terhadap orang Armenia."
