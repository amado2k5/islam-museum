reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full at revision 240673237 on 25 October 2026. The article gives his birth as 'vers 1853' at Constantinople and his death as 4 June 1931 at Amman, and repeats the English article's account of a Shafi'i and Hanafi education ('une éducation chaféite et hanafite'), allying with the Malikis and opposing Hanbalis and Wahhabis — the two articles are one content family on this point, and an education is in any case not an attestation of a personal school. Its lead calls him caliph 'pour les sunnites' (for the Sunnis), a description of his caliphate's constituency, not a naming of his madhhab."
