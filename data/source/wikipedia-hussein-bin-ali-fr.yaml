  ar: "مقالة ويكيبيديا الفرنسية عن حسين بن علي الهاشمي (وُلد نحو 1853 في القسطنطينية – توفي 4 يونيو 1931 في عمان)، شريف مكة حتى 1924 وملك الحجاز 1916–1924 وخليفة من 1924؛ تروي ثورته على الدولة العثمانية، ورفضه معاهدة فرساي، وهزيمته أمام ابن سعود ومنفاه في قبرص ووفاته في عمان ودفنه في المدرسة الأرغونية داخل الحرم الشريف، وموقفه الحامي للأرمن."
  en: "French Wikipedia article on Hussein bin Ali al-Hashimi (born about 1853 at Constantinople – died 4 June 1931 at Amman), Sharif of Mecca until 1924, King of the Hejaz 1916–1924 and Caliph from 1924; it recounts his revolt against the Ottoman Empire, his refusal of the Treaty of Versailles, his defeat by Ibn Saud, exile to Cyprus, death at Amman, burial in the Arghuniyya madrasa inside the Haram al-Sharif, and his protection of the Armenians."
