summary:
  ar: "مقال موسوعي عن حسين عبدالله ⁦(مواليد 1985)⁩، لاعب السلامة في دوري NFL الذي صام رمضان أثناء الموسم وتخلّف عن موسم 2012 لأداء الحج مع أخيه حمزة."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth on 27 July 1985, his Vikings and Chiefs career, his retirement in 2016 after five concussions, and a personal-life section recording that as a practising Muslim he fasted Ramadan in season, sat out 2012 to perform the Hajj with his brother Hamza, and was penalised in 2014 for a touchdown prostration the NFL admitted was wrongly flagged."
  es: "Artículo de enciclopedia editado por la comunidad, recuperado en su totalidad en la revisión indicada; en él se menciona su nacimiento el 27 de julio de 1985, su carrera con los Vikings y los Chiefs, su retiro en 2016 después de cinco conmociones cerebrales, y una sección sobre su vida personal que registra que, como musulmán practicante, ayunó durante el Ramadán en temporada, no jugó en 2012 para realizar el Hajj con su hermano Hamza, y fue penalizado en 2014 por una postración tras un touchdown que la NFL admitió que fue marcada erróneamente."
  fr: "Article encyclopédique édité par la communauté, récupéré intégralement à la version indiquée; il donne sa naissance le 27 juillet 1985, sa carrière chez les Vikings et les Chiefs, sa retraite en 2016 après cinq commotions cérébrales, et une section sur sa vie personnelle indiquant qu’en tant que musulman pratiquant, il a jeûné pendant le Ramadan, a manqué la saison 2012 pour effectuer le Hajj avec son frère Hamza, et a été pénalisé en 2014 pour une prosternation après un touchdown que la NFL a reconnu avoir été signalée à tort."
