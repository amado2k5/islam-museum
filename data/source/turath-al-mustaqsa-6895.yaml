summary:
  ar: "صفحة «al-Mustaqṣā fī amthāl al-ʿarab (book 6895)» لدى Turath. لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملخص بحثي قُدّم إلى المتحف ووافق المؤسس على استعماله في 21 نوفمبر 2026. يُستشهد بها في: كتب الأمثال العربية الكبرى ومؤلفوها وتواريخها وأعداد أمثالها."
  en: "The page \"al-Mustaqṣā fī amthāl al-ʿarab (book 6895)\" (Turath). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum and approved for use by the founder on 21 November 2026. Cited for: the major collections of Arabic proverbs, their authors, dates and counts."
  ur: "صفحہ «al-Mustaqṣā fī amthāl al-ʿarab (book 6895)»، Turath۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ عجائب گھر کو دیے گئے ایک تحقیقی خلاصے سے ہے جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ اس کے لیے دیا گیا: عربی ضرب الامثال کے بڑے مجموعے، ان کے مصنفین، تاریخیں اور تعداد۔"
  fr: "La page « al-Mustaqṣā fī amthāl al-ʿarab (book 6895) » (Turath). Le musée ne l'a pas ouverte lui-même : ce qu'on en sait vient d'une synthèse de recherche remise au musée et approuvée pour usage par le fondateur le 21 novembre 2026. Citée pour : les grands recueils de proverbes arabes, leurs auteurs, leurs dates et leurs effectifs."
  es: "La página «al-Mustaqṣā fī amthāl al-ʿarab (book 6895)» (Turath). El museo no la abrió por sí mismo: lo que se sabe de ella procede de un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026. Citada para: las grandes colecciones de proverbios árabes, sus autores, fechas y cantidades."
  tr: "Turath üzerine \"al-Mustaqṣā fī amthāl al-ʿArab (kitap 6895)\" sayfası. Müze kendisi açmadı; içeriği, müzeye sunulan ve kurucu tarafından 21 Kasım 2026'da onaylanan bir araştırma özetinden biliniyordu. Atıflar için: Büyük Arap Atadeyişleri Kitapları, Yazarları, Tarihleri ve Karşılıklarının Numaraları."
  id: "Halaman \"al-Mustaqṣā fī amthāl al-ʿArab (buku 6895)\" tentang Turath. Museum tidak membukanya sendiri; isinya diketahui dari ringkasan penelitian yang dikirim ke museum dan disetujui oleh pendiri pada 21 November 2026. Dikutip dalam: Buku Peribahasa Arab Besar, Penulisnya, Tanggal, dan Jumlah Karyanya."
