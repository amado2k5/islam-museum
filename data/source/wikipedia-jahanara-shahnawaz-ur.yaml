summary:
  ar: "مقالة ويكيبيديا الأردية القصيرة عن جهان آرا شاه نواز؛ تعطي مولدها في باغبان بورا بلاهور في 7 نيسان 1897 ووفاتها في لاهور في 27 تشرين الثاني 1979 ودفنها في مقبرة أسرتها، وتذكر أنها من مؤسسي جمعية المرأة الباكستانية ⁦(اپوا)⁩ ونائبة رئيسها، ولا تسمي لها مذهباً."
  en: "The short Urdu Wikipedia article on Jahanara Shahnawaz; it gives her birth at Baghbanpura, Lahore on 7 April 1897 and her death at Lahore on 27 November 1979 and burial in her family graveyard, records that she was a founding member and vice-president of APWA, and names no school for her."
  es: "El breve artículo de Wikipedia en urdu sobre Jahanara Shahnawaz indica que nació en Baghbanpura, Lahore, el 7 de abril de 1897 y falleció en Lahore el 27 de noviembre de 1979, siendo enterrada en el cementerio familiar. También menciona que fue miembro fundadora y vicepresidenta de la APWA, y no indica el nombre de ninguna escuela a la que pertenezca."
  fr: "Le court article de Wikipédia en ourdou sur Jahanara Shahnawaz indique sa naissance à Baghbanpura, Lahore, le 7 avril 1897, sa mort à Lahore le 27 novembre 1979 et son inhumation dans le cimetière familial. Il mentionne également qu'elle était membre fondatrice et vice-présidente de l'APWA, mais ne cite aucune école à son nom."
  ur: "جہاں آرا شاہنواز پر مختصر اردو ویکیپیڈیا مضمون؛ یہ 7 اپریل 1897 کو باغبانپورہ، لاہور میں اس کی پیدائش اور 27 نومبر 1979 کو لاہور میں اس کی موت اور اس کے خاندانی قبرستان میں تدفین، ریکارڈ ہے کہ وہ اپوا کی بانی رکن اور نائب صدر تھیں، اور اس کے لیے کسی اسکول کا نام نہیں رکھا۔"
