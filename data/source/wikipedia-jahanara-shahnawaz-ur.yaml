  ar: "مقالة ويكيبيديا الأردية القصيرة عن جهان آرا شاه نواز؛ تعطي مولدها في باغبان بورا بلاهور في 7 نيسان 1897 ووفاتها في لاهور في 27 تشرين الثاني 1979 ودفنها في مقبرة أسرتها، وتذكر أنها من مؤسسي جمعية المرأة الباكستانية (اپوا) ونائبة رئيسها، ولا تسمي لها مذهباً."
  en: "The short Urdu Wikipedia article on Jahanara Shahnawaz; it gives her birth at Baghbanpura, Lahore on 7 April 1897 and her death at Lahore on 27 November 1979 and burial in her family graveyard, records that she was a founding member and vice-president of APWA, and names no school for her."
