reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. The title 'Khan Bahadur Khan Rohilla' redirects to this article. It is a short article: its lead sentence on his forming a government in Bareilly carries a 'citation needed' tag (July 2025), while his capture, trial and hanging on 24 February 1860 are referenced to The News International (2016) and a Google Books result. Its short description wrongly calls him 'Regent of the Kingdom of Rohilkhand from 1749 to 1774' — that regency was his grandfather Hafiz Rahmat Khan's, as the article's own text makes clear. It names no religion or school for him."
