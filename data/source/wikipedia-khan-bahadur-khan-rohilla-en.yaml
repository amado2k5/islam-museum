  ar: "مقالة ويكيبيديا الإنجليزية تحت عنوان «Bahadur Khan Rohilla» عن خان بهادر خان روهيلا (1823–1860)؛ تُستخدم لوقائع الكيان فقط. تذكر أنه حفيد حافظ رحمة خان، وأنه شكّل حكومة في بريلي أثناء ثورة 1857، وفراره إلى نيبال وتسليمه للبريطانيين، ومحاكمته وشنقه في كوتوالي بريلي في 24 فبراير 1860."
  en: "English Wikipedia article, titled 'Bahadur Khan Rohilla', on Khan Bahadur Khan Rohilla (1823–1860); used for entity facts only. It states that he was a grandson of Hafiz Rahmat Khan, that he formed a government in Bareilly during the Indian Rebellion of 1857, that he escaped to Nepal and was handed over to the British, and that he was tried, sentenced to death and hanged at the Kotwali police station on 24 February 1860."
