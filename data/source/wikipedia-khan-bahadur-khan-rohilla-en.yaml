summary:
  ar: "مقالة ويكيبيديا الإنجليزية تحت عنوان «Bahadur Khan Rohilla» عن خان بهادر خان روهيلا (1823–1860)؛ تُستخدم لوقائع الكيان فقط. تذكر أنه حفيد حافظ رحمة خان، وأنه شكّل حكومة في بريلي أثناء ثورة 1857، وفراره إلى نيبال وتسليمه للبريطانيين، ومحاكمته وشنقه في كوتوالي بريلي في 24 فبراير 1860."
  en: "English Wikipedia article, titled 'Bahadur Khan Rohilla', on Khan Bahadur Khan Rohilla (1823–1860); used for entity facts only. It states that he was a grandson of Hafiz Rahmat Khan, that he formed a government in Bareilly during the Indian Rebellion of 1857, that he escaped to Nepal and was handed over to the British, and that he was tried, sentenced to death and hanged at the Kotwali police station on 24 February 1860."
  es: "Artículo de la Wikipedia en inglés, titulado 'Bahadur Khan Rohilla', sobre Khan Bahadur Khan Rohilla (1823-1860); utilizado únicamente para datos sobre la persona. Indica que era nieto de Hafiz Rahmat Khan, que formó un gobierno en Bareilly durante la Rebelión India de 1857, que escapó a Nepal y fue entregado a los británicos, y que fue juzgado, condenado a muerte y ahorcado en la comisaría de policía de Kotwali el 24 de febrero de 1860."
  fr: "L'article de Wikipédia en anglais, intitulé « Bahadur Khan Rohilla », consacré à Khan Bahadur Khan Rohilla (1823-1860), est utilisé uniquement à titre informatif. Il indique qu'il était le petit-fils d'Hafiz Rahmat Khan, qu'il forma un gouvernement à Bareilly pendant la révolte des Cipayes de 1857, qu'il s'enfuit au Népal où il fut livré aux Britanniques, et qu'il fut jugé, condamné à mort et pendu au poste de police de Kotwali le 24 février 1860."
  ur: "انگریزی ویکیپیڈیا مضمون، جس کا عنوان 'بہادر خان روہیلا'، خان بہادر خان روہیلا (1823-1860) پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں لکھا ہے کہ وہ حافظ رحمت خان کا پوتا تھا، کہ اس نے 1857 کی ہندوستانی بغاوت کے دوران بریلی میں حکومت بنائی، وہ نیپال فرار ہو کر انگریزوں کے حوالے کر دیا گیا، اور اس پر مقدمہ چلایا گیا، موت کی سزا سنائی گئی اور 24 فروری 1860 کو کوتوالی پولیس اسٹیشن میں پھانسی دے دی گئی۔"
