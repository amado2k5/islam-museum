summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فخر الدين باشا بعنوان «فخري باشا»؛ تُستخدم لوقائع الكيان فقط. تروي دفاعه عن المدينة المنورة 1916–1919، وسفارته في كابول، ووفاته سنة 1948 ودفنه في مقبرة أشيان بإسطنبول."
  en: "English Wikipedia article on Fahreddin Pasha, titled 'Fakhri Pasha'; used for entity facts only. It recounts his defence of Medina from 1916 to 1919, his embassy to Kabul, and his death in 1948 and burial at Aşiyan Cemetery, Istanbul."
  es: "Artículo de la Wikipedia en inglés sobre Fahreddin Pasha, titulado «Fakhri Pasha»; utilizado únicamente para datos sobre la persona. Relata su defensa de Medina entre 1916 y 1919, su embajada a Kabul y su muerte en 1948, siendo enterrado en el cementerio de Aşiyan, Estambul."
  fr: "L'article de Wikipédia en anglais sur Fahreddin Pasha, intitulé « Fakhri Pasha », est utilisé uniquement à des fins d'information sur l'entité. Il relate sa défense de Médine de 1916 à 1919, son ambassade à Kaboul, ainsi que sa mort en 1948 et son inhumation au cimetière d'Aşiyan à Istanbul."
  ur: "فخر الدین پاشا پر انگریزی ویکیپیڈیا کا مضمون، جس کا عنوان 'فخری پاشا' ہے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1916 سے 1919 تک مدینہ کے دفاع، کابل میں ان کے سفارت خانے اور 1948 میں ان کی موت اور آشیان قبرستان، استنبول میں تدفین کا ذکر ہے۔"
