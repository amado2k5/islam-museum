reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him as Ömer Fahrettin Türkkan (the Turkish article spells Fahreddin), born in 1868 at Rusçuk (Ruse) — its infobox says November or December — commander and governor of Medina from 10 June 1916 to 10 January 1919, nicknamed by his British opponents 'the Lion of the Desert' and 'the Tiger of the Desert', ambassador to Kabul from 1922 to 1926, dead on 22 November 1948 of a heart attack on a train near Eskişehir, and buried at Aşiyan Cemetery, Istanbul. Quoting Peters (1994), it preserves his words to his officers: 'I am a Muhammadan. I am an Ottoman. I am the son of Bayer Bay. I am a soldier.' — a general self-identification in an address, naming no school. It has no religion field and no other statement of his religion."
