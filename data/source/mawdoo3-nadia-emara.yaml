summary:
  ar: "سيرة منشورة لنادية عمارة في موقع موضوع؛ تعطي تخرجها في جامعة الإسكندرية سنة 1998 ودرجاتها في الدراسات الإسلامية والتفسير وتدريسها في الجامعة وشيوخها، ولا تنشر تاريخ ميلاد ولا تسمي مذهبا."
  en: "A published biography of Nadia Emara on the Mawdoo3 site; it gives her 1998 Alexandria University graduation, her degrees in Islamic studies and exegesis, her university teaching and her teachers, and publishes no birth date and names no school."
  es: "En el sitio web Mawdoo3 se publicó una biografía de Nadia Emara; en ella se indica que se graduó en la Universidad de Alejandría en 1998, que obtuvo sus títulos en estudios islámicos y exégesis, que impartió clases en la universidad y que contó con sus profesores, pero no se menciona su fecha de nacimiento ni la escuela a la que asistió."
  fr: "Une biographie de Nadia Emara a été publiée sur le site Mawdoo3; elle mentionne son diplôme de l'Université d'Alexandrie en 1998, ses diplômes en études islamiques et en exégèse, son enseignement universitaire et ses professeurs, mais ne mentionne ni sa date de naissance ni son école."
  ur: "Mawdoo3 سائٹ پر نادیہ عمارہ کی شائع شدہ سوانح عمری؛ یہ اسے 1998 کی اسکندریہ یونیورسٹی سے گریجویشن، اسلامی علوم اور تفسیر میں اس کی ڈگریاں، اس کی یونیورسٹی کی تدریس اور اس کے اساتذہ دیتا ہے، اور اس کی تاریخ پیدائش اور کسی اسکول کا نام نہیں شائع کرتی ہے۔"
  tr: "Nadia Amara'nın Mawda' web sitesinde yayımlanan biyografisi; 1998'de İskenderiye Üniversitesi'nden mezun olduğunu, İslami Bilimler ve Tafsir alanlarındaki diplomalarını, üniversite ve şeyhlerinde öğretim verdiğini ve doğum tarihini veya bir mezhep adını vermediğini belirtir."
  id: "Biografi Nadia Amara diterbitkan di situs web Mawda'; biografi ini mencantumkan kelulusannya dari Universitas Alexandria pada tahun 1998, gelar Studi Islam dan Tafsir, serta pengajarannya di universitas dan para sheikh-sheikhnya, tanpa menyebutkan tanggal lahirnya atau menyebutkan sekte."
title: "الدكتورة نادية عمارة داعية إسلامية مصرية"
