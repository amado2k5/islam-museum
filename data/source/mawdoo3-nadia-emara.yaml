reliability_note: "A published question-and-answer biography on the Mawdoo3 reference site; its text is repeated verbatim by menaviral.com — one source family. It gives her bachelor's in Arabic and Islamic studies, her master's and doctorate in Qur'anic exegesis, her graduation from Alexandria University in 1998, her teaching there of Arabic and of tafsir and tajwid to non-native speakers, and her teachers — al-Sha'rawi, whose weekly Alexandria sessions she attended briefly in her third university year, and Yasin Rushdi at the Al-Muwasat mosque. It publishes no birth date and names no school for her. Its family details are not used, per museum practice. Checked 26 October 2026."
