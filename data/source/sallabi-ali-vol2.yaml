summary:
  ar: "الجزء الثاني من سيرة علي بن أبي طالب للدكتور علي محمد الصلابي (مكتبة الإيمان، المنصورة)، ويتناول الفتنة بعد مقتل عثمان، ومعركتي الجمل وصفين وقضية التحكيم، والخوارج والنهروان، والأيام الأخيرة ومقتل علي. يكتب المؤلف من منظور أهل السنة، ويعتمد الطبري وابن كثير والذهبي مرجعاً أولاً، ويرد على ما يراه تحاملاً في روايات الشيعة والمستشرقين، ويحكم على الأسانيد بالضعف أو الصحة في كل موضع."
  en: "Volume 2 of Ali Muhammad al-Sallabi's biography of Ali ibn Abi Talib, covering the aftermath of Uthman's killing, the Camel, Siffin, the arbitration, the Kharijites at Nahrawan and Ali's death. Written from a Sunni standpoint; it grades chains of narration and rebuts what the author sees as Shi'i and orientalist distortion."
