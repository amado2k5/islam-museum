label: { ar: "أسمى المطالب في سيرة أمير المؤمنين علي بن أبي طالب، الجزء الثاني", en: "Asma al-Matalib fi Sirat Amir al-Mu'minin Ali ibn Abi Talib, vol. 2" }
summary:
  ar: "الجزء الثاني من سيرة علي بن أبي طالب للدكتور علي محمد الصلابي ⁦(مكتبة الإيمان، المنصورة)⁩، ويتناول الفتنة بعد مقتل عثمان، ومعركتي الجمل وصفين وقضية التحكيم، والخوارج والنهروان، والأيام الأخيرة ومقتل علي. يكتب المؤلف من منظور أهل السنة، ويعتمد الطبري وابن كثير والذهبي مرجعاً أولاً، ويرد على ما يراه تحاملاً في روايات الشيعة والمستشرقين، ويحكم على الأسانيد بالضعف أو الصحة في كل موضع."
  en: "Volume 2 of Ali Muhammad al-Sallabi's biography of Ali ibn Abi Talib, covering the aftermath of Uthman's killing, the Camel, Siffin, the arbitration, the Kharijites at Nahrawan and Ali's death. Written from a Sunni standpoint; it grades chains of narration and rebuts what the author sees as Shi'i and orientalist distortion."
  es: "El volumen 2 de la biografía de Ali ibn Abi Talib escrita por Ali Muhammad al-Sallabi abarca las consecuencias del asesinato de Uthman, el Camello, Siffin, el arbitraje, los jariyíes en Nahrawan y la muerte de Ali. Escrito desde una perspectiva suní, clasifica las cadenas de transmisión y refuta lo que el autor considera distorsiones chiíes y orientalistas."
  fr: "Le deuxième volume de la biographie d'Ali ibn Abi Talib par Ali Muhammad al-Sallabi relate les événements qui ont suivi l'assassinat d'Uthman, l'épisode du Chameau, de Siffin, l'arbitrage, la présence des Kharijites à Nahrawan et la mort d'Ali. Écrit dans une perspective sunnite, il analyse la chaîne de transmission des faits et réfute ce que l'auteur considère comme des distorsions chiites et orientalistes."
  ur: "علی محمد السلبی کی علی ابن ابی طالب کی سوانح حیات کی جلد 2، جس میں عثمان کے قتل کے بعد، اونٹ، صفین، ثالثی، نہروان میں خوارج اور علی کی موت کا احاطہ کیا گیا ہے۔ سنی نقطہ نظر سے لکھا گیا؛ یہ روایت کی زنجیروں کو درجہ بندی کرتا ہے اور مصنف کے نزدیک شیعہ اور مستشرقین کی تحریف کی تردید کرتا ہے۔"
