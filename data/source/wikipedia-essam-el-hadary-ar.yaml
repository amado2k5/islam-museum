  ar: "مقالة ويكيبيديا العربية عن عصام الحضري؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته حارسًا لمرمى الأهلي ومنتخب مصر، وألقابه الثمانية والثلاثين، وكونه أكثر حراس مصر مشاركة دوليًا برصيد 159 مباراة، وأكبر لاعب شارك في كأس الأمم الأفريقية، وعمله مدربًا لحراس مرمى منتخب سوريا منذ 2023. لا تذكر المقالة دينه في أي موضع."
  en: "Arabic Wikipedia article on Essam El Hadary; used for entity facts only. It recounts his career as goalkeeper for Al Ahly and the Egypt national team, his 38 titles, his record 159 caps as Egypt's most-capped goalkeeper, his status as the oldest player to appear at the Africa Cup of Nations, and his work as the Syrian national team's goalkeeping coach from 2023. It makes no mention of his religion anywhere."
