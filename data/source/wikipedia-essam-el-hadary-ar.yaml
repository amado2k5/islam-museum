summary:
  ar: "مقالة ويكيبيديا العربية عن عصام الحضري؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته حارسًا لمرمى الأهلي ومنتخب مصر، وألقابه الثمانية والثلاثين، وكونه أكثر حراس مصر مشاركة دوليًا برصيد 159 مباراة، وأكبر لاعب شارك في كأس الأمم الأفريقية، وعمله مدربًا لحراس مرمى منتخب سوريا منذ 2023. لا تذكر المقالة دينه في أي موضع."
  en: "Arabic Wikipedia article on Essam El Hadary; used for entity facts only. It recounts his career as goalkeeper for Al Ahly and the Egypt national team, his 38 titles, his record 159 caps as Egypt's most-capped goalkeeper, his status as the oldest player to appear at the Africa Cup of Nations, and his work as the Syrian national team's goalkeeping coach from 2023. It makes no mention of his religion anywhere."
  es: "Artículo en árabe de la Wikipedia sobre Essam El Hadary; utilizado únicamente para datos sobre la persona. Narra su trayectoria como portero del Al Ahly y de la selección egipcia, sus 38 títulos, su récord de 159 partidos internacionales como el portero con más internacionalidades de Egipto, su condición de jugador de mayor edad en participar en la Copa Africana de Naciones y su labor como entrenador de porteros de la selección siria desde 2023. No menciona su religión en ningún momento."
  fr: "Article Wikipédia en arabe consacré à Essam El Hadary; utilisé uniquement à des fins d'information sur l'entité. Il retrace sa carrière de gardien de but à Al Ahly et en équipe nationale d'Égypte, ses 38 titres, son record de 159 sélections (le gardien de but le plus capé d'Égypte), son statut de joueur le plus âgé à avoir participé à la Coupe d'Afrique des Nations, et son poste d'entraîneur des gardiens de but de l'équipe nationale syrienne depuis 2023. Sa religion n'est mentionnée nulle part."
  ur: "عصام الہدری پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں الاہلی اور مصر کی قومی ٹیم کے گول کیپر کے طور پر ان کے کیریئر، ان کے 38 ٹائٹلز، مصر کے سب سے زیادہ کیپ والے گول کیپر کے طور پر ان کا ریکارڈ 159 کیپس، افریقہ کپ آف نیشنز میں سب سے زیادہ عمر کے کھلاڑی کے طور پر ان کی حیثیت، اور 2023 سے شام کی قومی ٹیم کے گول کیپنگ کوچ کے طور پر ان کے کام کا ذکر ہے۔ اس میں ان کے مذہب کا کہیں ذکر نہیں ہے۔"
