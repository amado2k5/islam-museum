summary:
  ar: "قائمة ويكيبيديا العربية بمؤذني المسجد الحرام والمسجد النبوي الحاليين والسابقين، مع سنة التعيين لبعضهم، يعيّنهم رسميًا الهيئة العامة للعناية بشؤون المسجد الحرام والمسجد النبوي؛ تستند إلى عرب نيوز (2003) والرياض (2013) والمدينة (2015) وأخبار مكة (2017)."
  en: "Arabic Wikipedia list of the current and former muezzins of the Masjid al-Haram and the Prophet's Mosque, with appointment years for some; they are appointed by the General Authority for the Affairs of the Two Holy Mosques. It cites Arab News (2003), al-Riyadh (2013), al-Madina (2015) and Makkah News (2017)."
  es: "Lista en árabe de Wikipedia de los muecines actuales y anteriores de la Mezquita Sagrada (Masjid al-Haram) y la Mezquita del Profeta, con los años de nombramiento de algunos; son nombrados por la Autoridad General para los Asuntos de las Dos Mezquitas Sagradas. Cita a Arab News (2003), al-Riyadh (2013), al-Madina (2015) y Makkah News (2017)."
  fr: "Liste, disponible sur Wikipédia en arabe, des muezzins actuels et anciens de la Masjid al-Haram et de la Mosquée du Prophète, avec l'année de nomination de certains; ils sont nommés par l'Autorité générale pour les affaires des deux saintes mosquées. Cette liste cite Arab News (2003), al-Riyadh (2013), al-Madina (2015) et Makkah News (2017)."
  ur: "عربی ویکیپیڈیا میں مسجد الحرام اور مسجد نبوی کے موجودہ اور سابق مؤذن کی فہرست، کچھ کے لیے تقرری کے سال کے ساتھ؛ ان کا تقرر دو مقدس مساجد کے امور کے لیے جنرل اتھارٹی کرتا ہے۔ اس میں عرب نیوز (2003)، الریاض (2013)، المدینہ (2015) اور مکہ نیوز (2017) کا حوالہ دیا گیا ہے۔"
