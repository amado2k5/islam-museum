  en: "Ibn Rushd al-Hafid, Bidayat al-Mujtahid wa-Nihayat al-Muqtasid, vol. 1 (annotated and edited by Muhammad Subhi Hasan Hallaq)"
  ur: "ابن رشد الحفید، بدایۃ المجتہد و نہایۃ المقتصد، جلد اول (تعلیق و تحقیق و تخریج محمد صبحی حسن حلاق)"
summary:
  ar: "الجزء الأول من «بداية المجتهد ونهاية المقتصد» للقاضي أبي الوليد محمد بن أحمد بن محمد بن رشد الحفيد (520-595هـ)، بتعليق وتحقيق وتخريج محمد صبحي حسن حلاق، نشر مكتبة ابن تيمية بالقاهرة ومكتبة العلم بجدة، الطبعة الأولى 1415هـ؛ فيه مقدمة المحقق وترجمة المؤلف ومنهج التحقيق، ثم مقدمة ابن رشد وكتاب الطهارة وما بعده."
  en: "Volume 1 of Bidayat al-Mujtahid wa-Nihayat al-Muqtasid by the judge Abu al-Walid Muhammad ibn Ahmad ibn Muhammad ibn Rushd al-Hafid (520-595 AH), annotated, edited and with hadith references by Muhammad Subhi Hasan Hallaq, published by Maktabat Ibn Taymiyya (Cairo) and Maktabat al-Ilm (Jeddah), first edition 1415 AH; it contains the editor's introduction, a life of the author and the editor's method, then Ibn Rushd's own introduction and the Book of Purity onwards."
  ur: "قاضی ابو الولید محمد بن احمد بن محمد بن رشد الحفید (520-595ھ) کی «بدایۃ المجتہد و نہایۃ المقتصد» کی جلد اول، تعلیق و تحقیق و تخریج محمد صبحی حسن حلاق، ناشر مکتبہ ابن تیمیہ (قاہرہ) و مکتبۃ العلم (جدہ)، طبع اول 1415ھ؛ اس میں محقق کا مقدمہ، مصنف کا ترجمہ اور منہجِ تحقیق، پھر ابن رشد کا اپنا مقدمہ اور کتاب الطہارۃ وغیرہ ہیں۔"
title: "بداية المجتهد ونهاية المقتصد"
