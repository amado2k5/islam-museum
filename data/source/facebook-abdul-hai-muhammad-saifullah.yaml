reliability_note: "His own verified Facebook page, linked from his publisher author bios (see source/publisher-bio-saifullah). Post metadata on his October 2026 posts showed a verified page at 3.3 million followers, as read in the wave-197 coordinator checks on 8 November 2026; the follower figure is a dated platform count, not a museum-verified fact, and no more precise figure was obtainable. On Friday 23 October 2026 he published on this page the statement on madrasa child safety that Bengali press reported the next day (see source/press-saifullah-madrasa-statement-2026): that discipline, affection and care toward students have a fixed limit, that the moral standard for religious teachers must be stricter still, that covering up wrongdoing inside religious institutions while protesting others' wrongdoing is a grave moral failing, and that there can be no compromise over the safety of one's own children. The page is a primary source for his statements and self-presentation, not independent corroboration of biography, and it names no school of law or order for him."
