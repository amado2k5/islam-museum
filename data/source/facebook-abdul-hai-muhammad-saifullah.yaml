  ar: "صفحة عبد الحي محمد سيف الله الموثّقة على فيسبوك (fb.com/abdulhimd.saifullah)؛ أظهرت بيانات منشوراته في أكتوبر 2026 عدد متابعين قدره 3.3 مليون، وعليها نشر بيانه في 23 أكتوبر 2026 عن سلامة الأطفال في المدارس الدينية."
