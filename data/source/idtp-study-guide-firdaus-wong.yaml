reliability_note: "The subject's own programme biography: Firdaus Wong finished in the top three of the 2016 IDTP in Mumbai, and the guide prints his biography as an instructor profile (birth into a Buddhist family under the name Wong Wai Hung, the freethinker period, embracing Islam in 2005 at 22, full-time dawah from 2013 after meeting Sheikh Hussain Yee, training with IPSI Penang, founding and presiding over MRM in Kuala Lumpur). Self-presented biographical data is used for the man's own account of his life and is corroborated where possible: the MRM founding and its 2010 street-dawah work match Malay Mail's reporting of 24 January 2015 (read in a press archive), and the conversion date of 10 August 2005 and his Jinjang origin match Focus Malaysia reporting quoted in Malaysian forums. Read on 4 November 2026."
