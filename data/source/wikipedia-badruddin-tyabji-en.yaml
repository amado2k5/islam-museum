summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بدر الدين طيبجي؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في بومباي في 10 أكتوبر 1844 ووفاته في لندن سنة 1906، وكونه أول محامٍ هندي أمام محكمة بومباي العليا، ورئاسته الثالثة للمؤتمر الوطني الهندي (1887-1888) وأول رئيس مسلم له، وتأسيسه أنجمن إسلام سنة 1874، وقضاءه في محكمة بومباي العليا من 1895. ينتمي والده إلى جماعة السليماني بوهرة، وهي خلفية أسرية لا تُعدّ مذهبا له."
  en: "English Wikipedia article on Badruddin Tyabji; used for entity facts only. It records his birth in Bombay on 10 October 1844 and his death in London in 1906, his standing as the first Indian barrister of the Bombay High Court, his third presidency of the Indian National Congress (1887–1888) as its first Muslim president, his founding of the Anjuman-i-Islam in 1874, and his judgeship of the Bombay High Court from 1895. His father belonged to the Sulaimani Bohra community — family background, not Tyabji's own attested school."
