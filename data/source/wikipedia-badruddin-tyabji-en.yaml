summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بدر الدين طيبجي؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في بومباي في 10 أكتوبر 1844 ووفاته في لندن سنة 1906، وكونه أول محامٍ هندي أمام محكمة بومباي العليا، ورئاسته الثالثة للمؤتمر الوطني الهندي (1887-1888) وأول رئيس مسلم له، وتأسيسه أنجمن إسلام سنة 1874، وقضاءه في محكمة بومباي العليا من 1895. ينتمي والده إلى جماعة السليماني بوهرة، وهي خلفية أسرية لا تُعدّ مذهبا له."
  en: "English Wikipedia article on Badruddin Tyabji; used for entity facts only. It records his birth in Bombay on 10 October 1844 and his death in London in 1906, his standing as the first Indian barrister of the Bombay High Court, his third presidency of the Indian National Congress (1887–1888) as its first Muslim president, his founding of the Anjuman-i-Islam in 1874, and his judgeship of the Bombay High Court from 1895. His father belonged to the Sulaimani Bohra community — family background, not Tyabji's own attested school."
  es: "Artículo de la Wikipedia en inglés sobre Badruddin Tyabji; utilizado únicamente para datos sobre la persona. En él se registra su nacimiento en Bombay el 10 de octubre de 1844 y su fallecimiento en Londres en 1906, su condición de primer abogado indio del Tribunal Superior de Bombay, su tercera presidencia del Congreso Nacional Indio (1887-1888) como su primer presidente musulmán, la fundación de la Anjuman-i-Islam en 1874 y su cargo como juez del Tribunal Superior de Bombay desde 1895. Su padre pertenecía a la comunidad Sulaimani Bohra; antecedentes familiares, no la escuela a la que asistió Tyabji."
  fr: "Article de Wikipédia en anglais sur Badruddin Tyabji; utilisé uniquement pour les informations relatives à l'entité. Il relate sa naissance à Bombay le 10 octobre 1844 et sa mort à Londres en 1906, son statut de premier avocat indien auprès de la Haute Cour de Bombay, sa troisième présidence du Congrès national indien (1887-1888) en tant que premier président musulman, la fondation de l'Anjuman-i-Islam en 1874 et sa fonction de juge à la Haute Cour de Bombay à partir de 1895. Son père appartenait à la communauté Sulaimani Bohra; il s'agit d'une information concernant son origine familiale, et non de l'école fréquentée par Tyabji."
  ur: "بدرالدین طیب جی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 10 اکتوبر 1844 کو بمبئی میں ان کی پیدائش اور 1906 میں لندن میں ان کی موت، بمبئی ہائی کورٹ کے پہلے ہندوستانی بیرسٹر کے طور پر ان کا قیام، انڈین نیشنل کانگریس کی تیسری صدارت (1887-1888) اس کے پہلے مسلم صدر کے طور پر، ان کی انجمن اسلام کی بنیاد 1874 میں ان کی ہائی کورٹ، اور ان کے والد 1874 کے جج بنے۔ سلیمانی بوہرہ برادری سے تعلق رکھتے تھے - خاندانی پس منظر، نہ کہ طیب جی کا اپنا تصدیق شدہ اسکول۔"
