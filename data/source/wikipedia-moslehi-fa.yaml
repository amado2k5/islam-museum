summary:
  ar: "مقالة ويكيبيديا الفارسية عن روكسانا مصيلحي؛ تُستخدم لوقائع الكيان فقط. تقول إنها وُلدت في إيران ونشأت في كندا، وتفصّل تعليمها وأبحاثها في السرطان، ومنها دراسة نساء يهوديات مصابات بسرطان المبيض ضمن مجتمعات بحثها."
  en: "Persian Wikipedia article on Roxana Moslehi; used for entity facts only. It says she was born in Iran and raised in Canada, and details her education and cancer research, including a study of Jewish women with ovarian cancer among her research populations."
  es: "Artículo de Wikipedia en persa sobre Roxana Moslehi; utilizado únicamente para obtener información sobre la persona. Indica que nació en Irán y se crió en Canadá, y detalla su formación académica e investigación sobre el cáncer, incluyendo un estudio sobre mujeres judías con cáncer de ovario entre sus participantes."
  fr: "Article Wikipédia en persan sur Roxana Moslehi; utilisé uniquement à titre informatif. Il indique qu’elle est née en Iran et a grandi au Canada, et détaille ses études et ses recherches sur le cancer, notamment une étude menée auprès de femmes juives atteintes d’un cancer de l’ovaire parmi ses populations de recherche."
  ur: "روکسانہ مصلیحی پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں کہا گیا ہے کہ وہ ایران میں پیدا ہوئی اور اس کی پرورش کینیڈا میں ہوئی، اور اس کی تعلیم اور کینسر کی تحقیق کی تفصیلات بتاتی ہیں، جس میں ان کی تحقیقی آبادیوں میں رحم کے کینسر میں مبتلا یہودی خواتین کا مطالعہ بھی شامل ہے۔"
  tr: "Roxana Moselhi hakkında Farsça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılıyor. İran'da doğduğunu ve Kanada'da büyüdüğünü söylüyor; kanser üzerine eğitim ve araştırmalarını, araştırma topluluklarında yumurtalık kanseri olan Yahudi kadınları incelemeyi de detaylandırıyor."
  id: "Artikel Wikipedia Persia tentang Roxana Moselhi hanya digunakan untuk fakta-fakta entitas tersebut. Dia mengatakan bahwa dia lahir di Iran dan dibesarkan di Kanada, merinci pendidikan dan penelitiannya tentang kanker, termasuk mempelajari wanita Yahudi dengan kanker ovarium dalam komunitas penelitiannya."
