summary:
  ar: "مقالة ويكيبيديا العربية عن في-في لي؛ تُستخدم لوقائع الكيان فقط. تروي ولادتها في الصين سنة 1976 ونشأتها في تشنغدو وهجرتها مع والدتها إلى نيوجيرسي، ومسيرتها في ستانفورد وعملها على إيماج نت. لا تذكر المقالة أي دين لها."
  en: "Arabic Wikipedia article on Fei-Fei Li; used for entity facts only. It covers her 1976 birth in China, her upbringing in Chengdu, her emigration with her mother to New Jersey, her Stanford career and her ImageNet work. The article states no religion for her."
  es: "Artículo de Wikipedia en árabe sobre Fei-Fei Li; se utiliza únicamente para obtener información sobre la persona. Abarca su nacimiento en China en 1976, su infancia en Chengdu, su emigración con su madre a Nueva Jersey, su trayectoria en Stanford y su trabajo en ImageNet. El artículo no menciona ninguna religión para ella."
  fr: "Article Wikipédia en arabe sur Fei-Fei Li; utilisé uniquement à titre informatif. Il relate sa naissance en 1976 en Chine, son enfance à Chengdu, son émigration avec sa mère dans le New Jersey, ses études à Stanford et sa contribution à ImageNet. L’article ne mentionne aucune religion à son sujet."
  ur: "Fei-Fei Li پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں چین میں اس کی 1976 کی پیدائش، چینگدو میں اس کی پرورش، اس کی اپنی والدہ کے ساتھ نیو جرسی کی طرف ہجرت، اس کے اسٹینفورڈ کیرئیر اور امیج نیٹ کے کام کا احاطہ کیا گیا ہے۔ آرٹیکل اس کے لیے کوئی مذہب نہیں بتاتا۔"
  tr: "Vi-Vi Li hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1976'da Çin'de doğmasını, Chengdu'daki yetiştirilme tarzını, annesiyle birlikte New Jersey'ye göçünü, Stanford'daki kariyerini ve Image Net'teki çalışmalarını anlatır. Makalede onun herhangi bir dininden bahsedilmemektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang Vi-Vi Li; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Tiongkok pada tahun 1976, masa kecilnya di Chengdu, migrasinya bersama ibunya ke New Jersey, kariernya di Stanford, dan pekerjaannya di Image Net. Artikel tersebut tidak menyebutkan agama apa pun miliknya."
