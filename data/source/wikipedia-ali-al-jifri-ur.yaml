summary:
  ar: "مقالة ويكيبيديا الأردية عن حبیب علی الجفری ⁦(ولد 16 أبريل 1971)⁩؛ يصفه متنها بأنه عالم يمني سني وصوفي، ويعطي صندوق معلوماتها المذهب الشافعي وعضويته في دار المصطفى."
  en: "The Urdu Wikipedia article on Habib Ali al-Jifri (born 16 April 1971); its text calls him a Yemeni Sunni and Sufi scholar, and its infobox gives the Shafi'i madhhab and his membership of Dar al-Mustafa."
  es: "El artículo de Wikipedia en urdu sobre Habib Ali al-Jifri (nacido el 16 de abril de 1971); su texto lo describe como un erudito sunita y sufí yemení, y su ficha informativa indica la escuela de pensamiento shafi'í y su pertenencia a Dar al-Mustafa."
  fr: "L'article de Wikipédia en ourdou sur Habib Ali al-Jifri (né le 16 avril 1971); son texte le décrit comme un érudit yéménite sunnite et soufi, et son infobox indique le madhhab shafi'i et son appartenance à Dar al-Mustafa."
  ur: "حبیب علی الجفری ⁦(پیدائش 16 اپریل 1971)⁩ پر اردو ویکیپیڈیا کا مضمون؛ اس کا متن اسے یمنی سنی اور صوفی عالم کہتا ہے، اور اس کا معلومات خانہ شافعی مذہب اور دار المصطفیٰ کی رکنیت دیتا ہے۔"
  tr: "Habib Ali Al-Jafri (d. 16 Nisan 1971) hakkında Urduca Wikipedia makalesi; metni onu Yemenli bir Sünni âlim ve Sufi olarak tanımlar ve bilgi kutusu Şafii düşünce okulunu ve Dar Al-Mustafa üyeliğini sağlar."
  id: "Artikel Wikipedia Urdu tentang Habib Ali Al-Jafri (lahir 16 April 1971); teksnya menggambarkan dia sebagai ulama Sunni Yaman dan Sufi, serta infobox yang menyediakan aliran pemikiran Shafi'i dan keanggotaan dalam Dar Al-Mustafa."
