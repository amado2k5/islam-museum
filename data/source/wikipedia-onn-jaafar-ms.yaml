  ar: "مقالة ويكيبيديا الملايوية عن عون جعفر؛ تُستخدم لوقائع الكيان فقط. تؤيد مولده في 12 شباط 1895 ووفاته في 19 كانون الثاني 1962 في جوهر بهرو ودفنه في الضريح الملكي في بوكيت محمودية، وتروي عمله الصحفي ونفيه إلى سنغافورة (1927–1936) ورئاسته وزراء جوهر؛ ولا ترد فيها أي إشارة إلى دينه أو مذهبه."
  en: "Malay Wikipedia article on Onn Jaafar; used for entity facts only. It corroborates his birth on 12 February 1895 and his death on 19 January 1962 at Johor Bahru, with burial at the Mahmoodiah royal mausoleum, and recounts his journalism, his exile to Singapore (1927–1936) and his term as Menteri Besar of Johor. It makes no statement of his religion or school."
