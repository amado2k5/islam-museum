summary:
  ar: "مقالة ويكيبيديا الملايوية عن عون جعفر؛ تُستخدم لوقائع الكيان فقط. تؤيد مولده في 12 شباط 1895 ووفاته في 19 كانون الثاني 1962 في جوهر بهرو ودفنه في الضريح الملكي في بوكيت محمودية، وتروي عمله الصحفي ونفيه إلى سنغافورة (1927–1936) ورئاسته وزراء جوهر؛ ولا ترد فيها أي إشارة إلى دينه أو مذهبه."
  en: "Malay Wikipedia article on Onn Jaafar; used for entity facts only. It corroborates his birth on 12 February 1895 and his death on 19 January 1962 at Johor Bahru, with burial at the Mahmoodiah royal mausoleum, and recounts his journalism, his exile to Singapore (1927–1936) and his term as Menteri Besar of Johor. It makes no statement of his religion or school."
  es: "Artículo de Wikipedia en malayo sobre Onn Jaafar; utilizado únicamente para datos biográficos. Corrobora su nacimiento el 12 de febrero de 1895 y su fallecimiento el 19 de enero de 1962 en Johor Bahru, con sepultura en el mausoleo real de Mahmoodiah, y relata su labor periodística, su exilio a Singapur (1927-1936) y su mandato como Ministro Principal de Johor. No menciona su religión ni su escuela."
  fr: "Article Wikipédia en malais sur Onn Jaafar; utilisé uniquement pour des informations factuelles. Il confirme sa naissance le 12 février 1895 et son décès le 19 janvier 1962 à Johor Bahru, avec inhumation au mausolée royal de Mahmoodiah, et relate sa carrière de journaliste, son exil à Singapour (1927-1936) et son mandat de Menteri Besar de Johor. Il ne mentionne ni sa religion ni son école."
  ur: "عون جعفر پر مالائی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 12 فروری 1895 کو ان کی پیدائش اور 19 جنوری 1962 کو جوہر بہرو میں ان کی موت کی تصدیق کرتا ہے، محمودیہ شاہی مقبرہ میں تدفین کے ساتھ، اور ان کی صحافت، سنگاپور میں ان کی جلاوطنی (1927-1936) اور جوہر کے مینٹیری بیسار کے طور پر ان کی مدت کا ذکر کرتا ہے۔ اس میں اس کے مذہب یا مکتب کا کوئی بیان نہیں ہے۔"
  tr: "Awn Jaafar hakkında Malayca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 12 Şubat 1895'te doğumunu, 19 Ocak 1962'de Johar Bahra'da vefat ettiğini ve Phuket Mahmudiya'daki kraliyet mozolesine defnedilmesini destekler; gazetecilik çalışmalarını ve Singapur'a sürgününü (1927–1936) ve Johor bakanlığı başkanlığını anlatır; dini veya mezhebine hiç değinmez."
  id: "Artikel Wikipedia Melayu tentang Awn Jaafar; digunakan hanya untuk fakta entitas. Artikel ini mendukung kelahirannya pada 12 Februari 1895, kematiannya pada 19 Januari 1962 di Johar Bahra, dan pemakamannya di mausoleum kerajaan di Phuket Mahmudiya, menceritakan karya jurnalistiknya dan pengasingannya ke Singapura (1927–1936) serta masa kepresidenannya sebagai menteri Johor; tidak menyebutkan agama atau sektenya."
