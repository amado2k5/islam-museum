summary:
  ar: "عنصر ويكيداتا Q22304984: صحابي، وأبوه سهيل بن عمرو (Q1440361)، ومولده في مكة؛ يذكر العنصر وفاته سنة 639 بخلاف البطاقة ⁦(633 حسب الإصابة)⁩، فلم يُعتمد تاريخه."
  en: "Wikidata item Q22304984 for Abu Jandal ibn Suhayl: a companion of Muhammad, son of Suhayl ibn Amr (Q1440361), born at Mecca; the item's death year 639 differs from the card's 633 (al-Isaba) and is not used."
  es: "Elemento de Wikidata Q22304984 para Abu Jandal ibn Suhayl: un compañero de Mahoma, hijo de Suhayl ibn Amr (Q1440361), nacido en La Meca; el año de muerte del elemento 639 difiere del 633 de la tarjeta (al-Isaba) y no se utiliza."
  fr: "L'élément Wikidata Q22304984 pour Abu Jandal ibn Suhayl: un compagnon de Muhammad, fils de Suhayl ibn Amr (Q1440361), né à La Mecque; l'année de décès de l'élément 639 diffère de celle de la carte 633 (al-Isaba) et n'est pas utilisée."
  ur: "وکی ڈیٹا آئٹم Q22304984 ابو جندل ابن سہیل کے لیے: محمد کے ایک ساتھی، سہیل ابن عمرو کے بیٹے (Q1440361)، مکہ میں پیدا ہوئے۔ آئٹم کا سال وفات 639 کارڈ کے 633 ⁦(الاصابہ)⁩ سے مختلف ہے اور استعمال نہیں کیا جاتا ہے۔"
  tr: "Anser Wikidata Q22304984: Peygamber'in bir sahabi, babası Suhail bin Amr (Q1440361) idi ve Mekke'de doğmuştur; El-Ansur, onun 639 Hicri yılında öldüğünü belirtir, kayıtlara göre 633 yılına kıyasla ancak tarihi doğrulanmamıştır."
  id: "Anser Wikidata Q22304984: Seorang sahabat Nabi, ayahnya adalah Suhail ibn Amr (Q1440361), dan ia lahir di Mekah; Al-Ansur menyebutkan kematiannya pada tahun 639 H, berbeda dengan catatan (633 menurut catatan), tetapi tanggalnya belum dikonfirmasi."
