summary:
  ar: "صفحة «Arab Academy of Damascus» في Encyclopedia.com؛ لم يفتحها المتحف، وهي ملخّصة في ملف بحث قُدّم إليه بإذن المؤسس في 21 نوفمبر 2026، ويُستند إليها لوقائع المؤسسة فقط."
  en: "The page \"Arab Academy of Damascus\" (Encyclopedia.com), summarised in a research file supplied to the museum and not opened by it, with the founder's approval of 21 November 2026; used for: the Academy's model in the Académie française, its Arabisation work after Ottoman rule, its journal from 1921, its critical editions and its commissioning of dictionaries such as Ahmad Rida's Matn al-Lugha."
  ur: "صفحہ «Arab Academy of Damascus» (Encyclopedia.com)؛ عجائب گھر نے اسے نہیں کھولا، یہ اس کو فراہم کردہ تحقیقی فائل میں بانی کی 21 نومبر 2026ء کی منظوری سے خلاصہ شدہ ہے، اور صرف ادارے کے حقائق کے لیے استعمال ہوتا ہے۔"
  fr: "La page « Arab Academy of Damascus » (Encyclopedia.com), résumée dans un fichier de recherche fourni au musée et non ouverte par lui, avec l'accord du fondateur du 21 novembre 2026 ; utilisée pour les faits sur l'institution seulement."
  es: "La página «Arab Academy of Damascus» (Encyclopedia.com), resumida en un archivo de investigación entregado al museo y no abierta por él, con la aprobación del fundador del 21 de noviembre de 2026; se usa solo para datos sobre la institución."
  tr: "Encyclopedia.com'de 'Şam Arap Akademisi' sayfası müze tarafından açılmadı ve 21 Kasım 2026'da kurucunun izniyle sunulan bir araştırma dosyasında özetlenmiş, yalnızca kurumun kayıtlarına dayanmaktadır."
  id: "Halaman 'Akademi Arab Damaskus' di tahun Encyclopedia.com tidak dibuka oleh museum, dan dirangkum dalam berkas penelitian yang diserahkan dengan izin pendiri pada 21 November 2026, dan sepenuhnya mengandalkan catatan institusi."
