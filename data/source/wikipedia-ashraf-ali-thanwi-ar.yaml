reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short, separately edited article. Its lead sentence is one of the independent attestations for the faith segment: it calls him in terms a Deobandi scholar and a Hanafi jurist of India. Its category apparatus files him among Hanafis, Chishtis, Maturidis, Sunni Sufis and students of Mahmud Hasan Deobandi. Its infobox gives birth 19 August 1863 (agreeing with the English article and Wikidata) but prints the death as 4 July 1943, an error within the article: its own lead gives 1362 AH / 1943 without a day, and the English and Urdu articles and Wikidata give 20 July 1943, which the record follows. It dates his Deoband graduation to 1299 AH / 1882 (the English article gives 1883; the Urdu, five years ending 1301 AH). It puts his works at about 800, some twelve of them in Arabic."
