  ar: "مقالة ويكيبيديا الإنجليزية عن سلمان بن حمد آل خليفة (1894–1961)؛ تُستخدم لوقائع الكيان فقط. مطلعها يعطي مولده في 10 أكتوبر 1894 ووفاته في 2 نوفمبر 1961 وحكمه للبحرين خلفا لأبيه حمد بن عيسى من 1942 حتى وفاته، أما متن سيرته فيقول إنه وُلد سنة 1895. تروي إصلاحاته الصحية والتعليمية وجمعه التبرعات للاجئي فلسطين سنة 1948. لا حقل دين فيها."
  en: "English Wikipedia article on Salman bin Hamad Al Khalifa (1894–1961); used for entity facts only. Its lead gives his birth on 10 October 1894, his death on 2 November 1961 and his rule of Bahrain in succession to his father Hamad bin Isa from 1942 until his death, while its biography prose says he was born in 1895. It recounts his health and education reforms and his 1948 fundraising for Palestinian refugees. It has no religion field."
