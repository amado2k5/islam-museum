summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سلمان بن حمد آل خليفة (1894–1961)؛ تُستخدم لوقائع الكيان فقط. مطلعها يعطي مولده في 10 أكتوبر 1894 ووفاته في 2 نوفمبر 1961 وحكمه للبحرين خلفا لأبيه حمد بن عيسى من 1942 حتى وفاته، أما متن سيرته فيقول إنه وُلد سنة 1895. تروي إصلاحاته الصحية والتعليمية وجمعه التبرعات للاجئي فلسطين سنة 1948. لا حقل دين فيها."
  en: "English Wikipedia article on Salman bin Hamad Al Khalifa (1894–1961); used for entity facts only. Its lead gives his birth on 10 October 1894, his death on 2 November 1961 and his rule of Bahrain in succession to his father Hamad bin Isa from 1942 until his death, while its biography prose says he was born in 1895. It recounts his health and education reforms and his 1948 fundraising for Palestinian refugees. It has no religion field."
  es: "Artículo de la Wikipedia en inglés sobre Salman bin Hamad Al Khalifa (1894-1961); utilizado únicamente para datos sobre la persona. Su introducción indica que nació el 10 de octubre de 1894, falleció el 2 de noviembre de 1961 y gobernó Bahréin en sucesión de su padre, Hamad bin Isa, desde 1942 hasta su muerte. La biografía en prosa afirma que nació en 1895. Relata sus reformas en materia de salud y educación, así como su campaña de recaudación de fondos para refugiados palestinos en 1948. No incluye información sobre religión."
  fr: "Article de Wikipédia en anglais sur Salman bin Hamad Al Khalifa (1894-1961); utilisé uniquement pour les informations factuelles. Son introduction indique sa naissance le 10 octobre 1894, son décès le 2 novembre 1961 et son règne sur Bahreïn, succédant à son père Hamad bin Isa, de 1942 jusqu'à sa mort. La biographie, quant à elle, mentionne sa naissance en 1895. Elle relate ses réformes de la santé et de l'éducation ainsi que sa campagne de levée de fonds de 1948 pour les réfugiés palestiniens. Aucun champ relatif à la religion n'est présent."
