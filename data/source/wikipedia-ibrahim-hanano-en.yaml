  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم هنانو؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في كفر تخاريم وحلب ودراسته الحقوق في إسطنبول، وثورته على الانتداب الفرنسي في الشمال، ومحاكمته سنة 1922، ودوره في الكتلة الوطنية والجمعية التأسيسية، ووفاته في حلب سنة 1935."
  en: "English Wikipedia article on Ibrahim Hananu; used for entity facts only. It recounts his upbringing at Kafr Takharim and Aleppo, his law studies in Istanbul, his revolt against the French Mandate in the north, his 1922 trial, his role in the National Bloc and the constituent assembly, and his death at Aleppo in 1935."
