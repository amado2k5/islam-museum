summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم هنانو؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في كفر تخاريم وحلب ودراسته الحقوق في إسطنبول، وثورته على الانتداب الفرنسي في الشمال، ومحاكمته سنة 1922، ودوره في الكتلة الوطنية والجمعية التأسيسية، ووفاته في حلب سنة 1935."
  en: "English Wikipedia article on Ibrahim Hananu; used for entity facts only. It recounts his upbringing at Kafr Takharim and Aleppo, his law studies in Istanbul, his revolt against the French Mandate in the north, his 1922 trial, his role in the National Bloc and the constituent assembly, and his death at Aleppo in 1935."
  es: "Artículo de la Wikipedia en inglés sobre Ibrahim Hananu; utilizado únicamente para obtener información sobre la persona. Relata su infancia en Kafr Takharim y Alepo, sus estudios de derecho en Estambul, su revuelta contra el Mandato francés en el norte, su juicio en 1922, su papel en el Bloque Nacional y la asamblea constituyente, y su muerte en Alepo en 1935."
  fr: "Article de Wikipédia en anglais sur Ibrahim Hananu; utilisé uniquement à des fins d’information sur l’entité. Il relate son enfance à Kafr Takharim et à Alep, ses études de droit à Istanbul, sa révolte contre le mandat français dans le nord, son procès de 1922, son rôle au sein du Bloc national et de l’assemblée constituante, et sa mort à Alep en 1935."
  ur: "ابراہیم حنانو پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں کفر تکریم اور حلب میں ان کی پرورش، استنبول میں قانون کی تعلیم، شمال میں فرانسیسی مینڈیٹ کے خلاف ان کی بغاوت، 1922 کے مقدمے کی سماعت، قومی بلاک اور دستور ساز اسمبلی میں ان کے کردار اور 1935 میں حلب میں ان کی موت کا ذکر ہے۔"
  tr: "İbrahim Hananu hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kitap, Kafr Tehharim ve Halep'teki yetiştirilme tarzını, İstanbul'daki hukuk eğitimini, kuzeyde Fransız mandasına karşı devrimini, 1922'deki yargılanışını, Ulusal Blok ve Kurucu Meclis'teki rolünü ve 1935'te Halep'teki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ibrahim Hananu; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Kafr Takharim dan Aleppo, studi hukumnya di Istanbul, revolusinya melawan mandat Prancis di utara, persidangannya pada tahun 1922, perannya di Blok Nasional dan Majelis Konstituante, serta kematiannya di Aleppo pada tahun 1935."
