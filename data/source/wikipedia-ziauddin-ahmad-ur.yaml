summary:
  ar: "مقالة ويكيبيديا الأردية عن ضياء الدين أحمد؛ تُستخدم لوقائع الكيان فقط. تسرد أعماله في الهندسة التفاضلية والإسقاطية والتحليلية ودوره المركزي في حركة عليكرة وحركة باكستان، وصندوقها التعاقبي يجعل نواب محمد إسماعيل خان سلفه في نيابة رئاسة الجامعة وزاهد حسين خلفه."
  en: "Urdu Wikipedia article on Ziauddin Ahmad; used for entity facts only. It covers his work in differential, projective and analytic geometry and his central role in the Aligarh and Pakistan movements; its succession box gives Nawab Mohammad Ismail Khan before him and Zahid Hussain after him in the university vice-chancellorship."
  es: "Artículo de Wikipedia en urdu sobre Ziauddin Ahmad; se utiliza únicamente para datos sobre la entidad. Abarca su trabajo en geometría diferencial, proyectiva y analítica, así como su papel fundamental en los movimientos de Aligarh y Pakistán. En su recuadro de sucesión, Nawab Mohammad Ismail Khan le precedió y Zahid Hussain le sucedió en el cargo de vicerrector de la universidad."
  fr: "Article de Wikipédia en ourdou sur Ziauddin Ahmad; utilisé uniquement pour les informations factuelles. Il traite de ses travaux en géométrie différentielle, projective et analytique, ainsi que de son rôle central dans les mouvements d'Aligarh et du Pakistan; l'encadré relatif à sa succession indique que Nawab Mohammad Ismail Khan lui a succédé et que Zahid Hussain lui a succédé au poste de vice-chancelier de l'université."
