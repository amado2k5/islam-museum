  fr: "L'élément Wikidata Q4814466 concernant Roxana Moslehi, extrait des propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Il indique sa nationalité (Iran et Canada), son niveau d'études et ses employeurs, mais ne contient aucune information sur sa date de naissance ni sur sa religion."
  ur: "ویکی ڈیٹا آئٹم Q4814466 روکسانا موسیلی کے لیے، انگریزی مضمون کے صفحہ کے پراپس پر مبنی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے شہریت ⁦(ایران اور کینیڈا)⁩، تعلیم اور آجر دیتا ہے، اور اس میں تاریخ پیدائش اور مذہب کی کوئی قدر نہیں ہوتی۔"
