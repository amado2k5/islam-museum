  ar: "عنصر ويكي بيانات Q4814466 لروكسانا مصيلحي، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي جنسيتها ⁦(إيران وكندا)⁩ وتعليمها وعملها، ولا يحمل أي قيمة لتاريخ الولادة ولا للدين."
