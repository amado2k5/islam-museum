summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فؤاد معصوم، رئيس العراق 2014–2018؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 1 يوليو 1938 في كويه وخلافته لجلال طالباني في الرئاسة، ويحمل صندوق معلوماتها حقل دين يسمّي الإسلام السني، وتذكر دراسته الدينية وشهادة الدكتوراه في الفلسفة الإسلامية من الأزهر، وهو تكوين لا شهادة مذهب."
  en: "English Wikipedia article on Fuad Masum, president of Iraq 2014–2018; used for entity facts only. It gives his birth on 1 July 1938 at Koya and his succession of Jalal Talabani as president. Its infobox carries a religion field naming Sunni Islam, and its text records his religious schooling and his Al-Azhar doctorate in Islamic philosophy — formation, not an attestation of a school."
  es: "Artículo de la Wikipedia en inglés sobre Fuad Masum, presidente de Irak entre 2014 y 2018; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 1 de julio de 1938 en Koya y su sucesión de Jalal Talabani en la presidencia. Su ficha informativa incluye un campo sobre religión que menciona el islam sunita, y su texto registra su formación religiosa y su doctorado en filosofía islámica por la Universidad de Al-Azhar (formación académica, no certificación de una escuela)."
  fr: "Article de Wikipédia en anglais sur Fouad Masoum, président de l'Irak de 2014 à 2018; utilisé uniquement à titre informatif. Il indique sa naissance le 1er juillet 1938 à Koya et sa succession de Jalal Talabani à la présidence. Son infobox mentionne l'islam sunnite et son texte fait état de sa formation religieuse et de son doctorat en philosophie islamique obtenu à Al-Azhar – il s'agit d'une formation, et non d'une attestation d'appartenance à une école."
  ur: "عراق کے صدر فواد معصوم پر انگریزی ویکیپیڈیا کا مضمون 2014-2018؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1 جولائی 1938 کو کویا میں ان کی پیدائش اور صدر کے طور پر جلال طالبانی کی جانشینی ہے۔ اس کے معلوماتی خانے میں سنی اسلام کے نام سے ایک مذہب کا شعبہ ہے، اور اس کے متن میں اس کی مذہبی تعلیم اور اسلامی فلسفہ میں اس کی الازہر کی ڈاکٹریٹ کا ریکارڈ ہے — تشکیل، کسی اسکول کی تصدیق نہیں۔"
