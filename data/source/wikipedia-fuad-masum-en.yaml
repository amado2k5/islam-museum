  ar: "مقالة ويكيبيديا الإنجليزية عن فؤاد معصوم، رئيس العراق 2014–2018؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 1 يوليو 1938 في كويه وخلافته لجلال طالباني في الرئاسة، ويحمل صندوق معلوماتها حقل دين يسمّي الإسلام السني، وتذكر دراسته الدينية وشهادة الدكتوراه في الفلسفة الإسلامية من الأزهر، وهو تكوين لا شهادة مذهب."
  en: "English Wikipedia article on Fuad Masum, president of Iraq 2014–2018; used for entity facts only. It gives his birth on 1 July 1938 at Koya and his succession of Jalal Talabani as president. Its infobox carries a religion field naming Sunni Islam, and its text records his religious schooling and his Al-Azhar doctorate in Islamic philosophy — formation, not an attestation of a school."
