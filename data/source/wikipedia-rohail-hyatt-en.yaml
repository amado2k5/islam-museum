summary:
  ar: "مقال موسوعي عن روحيل حياة، منتج التسجيلات والملحن الباكستاني؛ يذكر صندوقه ولادته في راولبندي سنة 1964، وهي قراءة السنة المنافسة."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; its infobox gives his birth at Rawalpindi on 4 December 1964 — the rival year reading, uncited in an article carrying a sources banner — and the article documents his founding of Vital Signs, his production companies, the Khuda Kay Liye soundtrack and Coke Studio."
  es: "Artículo de enciclopedia editado por la comunidad, recuperado íntegramente en la revisión indicada; su ficha informativa indica que nació en Rawalpindi el 4 de diciembre de 1964 —el año que aparece en la versión rival, sin citar en un artículo que incluye una sección de fuentes— y el artículo documenta la fundación de Vital Signs, sus compañías productoras, la banda sonora de Khuda Kay Liye y Coke Studio."
  fr: "Article encyclopédique édité par la communauté, récupéré intégralement à la version indiquée; son infobox indique sa naissance à Rawalpindi le 4 décembre 1964 — l’année concurrente, non citée dans un article portant une bannière de sources — et l’article documente la fondation de Vital Signs, ses sociétés de production, la bande originale de Khuda Kay Liye et Coke Studio."
  ur: "کمیونٹی میں ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظرثانی پر مکمل طور پر بازیافت کیا گیا؛ اس کے انفو باکس نے راولپنڈی میں 4 دسمبر 1964 کو ان کی پیدائش کی - حریف سال پڑھنا، ایک مضمون میں جس کا ایک سورس بینر ہے اس کا حوالہ نہیں دیا گیا - اور یہ مضمون اس کی وائٹل سائنز، ان کی پروڈکشن کمپنیوں، خدا کے لیے ساؤنڈ ٹریک اور کوک اسٹوڈیو کے قیام کی دستاویز کرتا ہے۔"
