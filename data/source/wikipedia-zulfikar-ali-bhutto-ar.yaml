summary:
  ar: "مقالة ويكيبيديا العربية عن ذو الفقار علي بوتو؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 5 يناير 1928 في لاركانا وإعدامه في 4 أبريل 1979 في راولبندي ودفنه في ضريح عائلة بوتو، وتعليمه، وتأسيسه حزب الشعب سنة 1967، ورئاسته ورئاسته للوزراء، ومذهبه في الاشتراكية الإسلامية. ويعطي صندوق معلوماتها الديانة «الإسلام، والشيعة»."
  en: "Arabic Wikipedia article on Zulfikar Ali Bhutto; used for entity facts only. It gives his birth on 5 January 1928 at Larkana and his execution on 4 April 1979 at Rawalpindi with burial in the Bhutto family mausoleum, his education, his founding of the PPP in 1967, his presidency and premiership, and his doctrine of Islamic socialism. Its infobox religion field gives 'Islam, and Shia'."
  es: "Artículo de Wikipedia en árabe sobre Zulfikar Ali Bhutto; utilizado únicamente para datos biográficos. Menciona su nacimiento el 5 de enero de 1928 en Larkana y su ejecución el 4 de abril de 1979 en Rawalpindi, con sepultura en el mausoleo de la familia Bhutto, su educación, la fundación del PPP en 1967, su presidencia y mandato como primer ministro, y su doctrina del socialismo islámico. El campo de religión en su ficha informativa indica «Islam y chiíta»."
  fr: "Article Wikipédia en arabe sur Zulfikar Ali Bhutto; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 5 janvier 1928 à Larkana et son exécution le 4 avril 1979 à Rawalpindi, avec inhumation dans le mausolée familial des Bhutto, son parcours scolaire, la fondation du Parti du peuple pakistanais (PPP) en 1967, sa présidence et son poste de Premier ministre, ainsi que sa doctrine du socialisme islamique. L’infobox « Religion » mentionne « Islam et chiisme »."
  ur: "ذوالفقار علی بھٹو پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 5 جنوری 1928 کو لاڑکانہ میں ان کی پیدائش اور 4 اپریل 1979 کو راولپنڈی میں بھٹو خاندان کے مزار میں تدفین کے ساتھ ان کی پھانسی، ان کی تعلیم، 1967 میں پی پی پی کی ان کی بنیاد، ان کی صدارت اور وزارت عظمیٰ، اور اسلامی سوشلزم کے ان کے نظریے کو بیان کرتی ہے۔ اس کا infobox مذہب کا میدان 'اسلام اور شیعہ' دیتا ہے۔"
