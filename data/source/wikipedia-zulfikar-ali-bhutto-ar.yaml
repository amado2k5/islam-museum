  ar: "مقالة ويكيبيديا العربية عن ذو الفقار علي بوتو؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 5 يناير 1928 في لاركانا وإعدامه في 4 أبريل 1979 في راولبندي ودفنه في ضريح عائلة بوتو، وتعليمه، وتأسيسه حزب الشعب سنة 1967، ورئاسته ورئاسته للوزراء، ومذهبه في الاشتراكية الإسلامية. ويعطي صندوق معلوماتها الديانة «الإسلام، والشيعة»."
  en: "Arabic Wikipedia article on Zulfikar Ali Bhutto; used for entity facts only. It gives his birth on 5 January 1928 at Larkana and his execution on 4 April 1979 at Rawalpindi with burial in the Bhutto family mausoleum, his education, his founding of the PPP in 1967, his presidency and premiership, and his doctrine of Islamic socialism. Its infobox religion field gives 'Islam, and Shia'."
