summary:
  en: "Britannica biography of al-Khwārizmī; it gives his birth about 780 and death about 850, his work at the Dār al-Ḥikma under al-Maʾmūn, the Algebra (Kitāb al-jabr waʾl-muqābala), the Hindu-numerals treatise preserved as Algoritmi de numero Indorum, the Ṣūrat al-arḍ geography with the world map and the Sinjār meridian measurement, and the Zīj tables."
  es: "La biografía de al-Khwārizmī en la Enciclopedia Británica indica su nacimiento alrededor del año 780 y su muerte alrededor del 850, su trabajo en el Dār al-Ḥikma bajo la tutela de al-Maʾmūn, el Álgebra (Kitāb al-jabr waʾl-muqābala), el tratado sobre numerales hindúes conservado como Algoritmi de numero Indorum, la geografía Ṣūrat al-arḍ con el mapa del mundo y la medición del meridiano Sinjār, y las tablas Zīj."
  fr: "La biographie d'al-Khwārizmī dans Britannica indique sa naissance vers 780 et sa mort vers 850, son travail au Dār al-Ḥikma sous al-Maʾmūn, l'Algèbre (Kitāb al-jabr waʾl-muqābala), le traité sur les chiffres hindous conservé sous le nom d'Algoritmi de numero Indorum, la géographie Ṣūrat al-arḍ avec la carte du monde et la mesure du méridien Sinjār, et les tables Zīj."
