summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خواجة غلام فريد (ت. 1901)؛ تنص في صدرها على أنه شاعر صوفي من بهاولپور ينتمي إلى الطريقة الجشتية، وتسرد حياته نقلاً عن مدخل كريستوفر شاكل في الموسوعة الإسلامية (EI3) وغيره، وتعطي مولده حوالي 1841/1845 ووفاته في 24 تموز 1901 في تشاتشران ودفنه في ميثانكوت."
  en: "The English Wikipedia article on Khwaja Ghulam Farid (d. 1901); its lead states that he was a Sufi poet and mystic from Bahawalpur belonging to the Chishti Order, its life section rests on Christopher Shackle's Encyclopaedia of Islam (EI3) entry and other scholarly works, and it gives his birth as circa 1841/1845 and his death at Chachran on 24 July 1901, with burial at Mithankot."
