summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خواجة غلام فريد ⁦(ت. 1901)⁩؛ تنص في صدرها على أنه شاعر صوفي من بهاولپور ينتمي إلى الطريقة الجشتية، وتسرد حياته نقلاً عن مدخل كريستوفر شاكل في الموسوعة الإسلامية (EI3) وغيره، وتعطي مولده حوالي 1841/1845 ووفاته في 24 تموز 1901 في تشاتشران ودفنه في ميثانكوت."
  en: "The English Wikipedia article on Khwaja Ghulam Farid (d. 1901); its lead states that he was a Sufi poet and mystic from Bahawalpur belonging to the Chishti Order, its life section rests on Christopher Shackle's Encyclopaedia of Islam (EI3) entry and other scholarly works, and it gives his birth as circa 1841/1845 and his death at Chachran on 24 July 1901, with burial at Mithankot."
  es: "El artículo de la Wikipedia en inglés sobre Khwaja Ghulam Farid (fallecido en 1901); su introducción afirma que fue un poeta y místico sufí de Bahawalpur perteneciente a la Orden Chishti, su sección biográfica se basa en la entrada de Christopher Shackle en la Enciclopedia del Islam (EI3) y otras obras académicas, y da su nacimiento alrededor de 1841/1845 y su muerte en Chachran el 24 de julio de 1901, con entierro en Mithankot."
  fr: "L'article de Wikipédia en anglais sur Khwaja Ghulam Farid (décédé en 1901); son introduction indique qu'il était un poète et mystique soufi de Bahawalpur appartenant à l'ordre Chishti, sa section sur sa vie repose sur l'entrée de l'Encyclopédie de l'Islam de Christopher Shackle (EI3) et d'autres travaux savants, et il donne sa naissance vers 1841/1845 et sa mort à Chachran le 24 juillet 1901, avec inhumation à Mithankot."
  ur: "خواجہ غلام فرید ⁦(متوفی 1901)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ اس کے لیڈ میں کہا گیا ہے کہ وہ چشتی آرڈر سے تعلق رکھنے والے بہاولپور سے تعلق رکھنے والے صوفی شاعر اور صوفی تھے، اس کی زندگی کا حصہ کرسٹوفر شیکل کے انسائیکلوپیڈیا آف اسلام (EI3) کے اندراج اور دیگر علمی کاموں پر منحصر ہے، اور اس میں ان کی پیدائش تقریباً 1841/1845 اور ان کی وفات 24 جولائی 0919 کو چچڑاں میں ہوئی۔"
  tr: "Khwaja Ghulam Farid (ö. 1901) hakkında İngilizce Wikipedia makalesi; başta onun Bahawalpur'dan Jashti tarikatına mensup bir Sufi şair olduğunu belirtir, hayatını Christopher Shackell'in İslam Ansiklopedisi'ndeki (EI3) ve diğerlerindeki maddelerinden alıntılayarak anlatır; yaklaşık 1841/1845'te doğmuş, 24 Temmuz 1901'de Chachran'da ölmüş ve Mithankot'ta defnedilmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Khwaja Ghulam Farid (wafat 1901); di awal disebutkan bahwa ia adalah penyair Sufi dari Bahawalpur yang termasuk dalam tarekat Jashti, menceritakan kehidupannya dengan mengutip entri Christopher Chakell dalam Ensiklopedia Islam (EI3) dan lainnya, menceritakan kelahirannya sekitar tahun 1841/1845, wafat pada 24 Juli 1901 di Chachran, dan pemakamannya di Mithankot."
