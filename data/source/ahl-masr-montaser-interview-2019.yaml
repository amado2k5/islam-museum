summary:
  ar: "حوار خالد منتصر في جريدة أهل مصر بتاريخ 9 أكتوبر 2019، معاد نشره في مصرّس؛ يصف فيه هجومه على المشايخ بأنه دفاع عن الإسلام، وواجب كل مسلم."
  en: "Khaled Montaser's interview in Ahl Masr, 9 October 2019, republished by Masress; he frames his criticism of clerics as a defence of Islam and the duty of every Muslim."
  es: "Entrevista a Khaled Montaser en Ahl Masr, del 9 de octubre de 2019, republicada por Masress; en ella, Montaser presenta sus críticas a los clérigos como una defensa del Islam y del deber de todo musulmán."
  fr: "Interview de Khaled Montaser dans Ahl Masr, le 9 octobre 2019, republiée par Masress; il présente sa critique des religieux comme une défense de l'islam et du devoir de chaque musulman."
  ur: "خالد منتظر کا اہل مسر میں انٹرویو، 9 اکتوبر 2019، مسریس نے دوبارہ شائع کیا؛ وہ علما پر اپنی تنقید کو اسلام کے دفاع اور ہر مسلمان کا فرض قرار دیتے ہیں۔"
  tr: "Khaled Montaser'in 9 Ekim 2019 tarihli Ahl Masr gazetesinde Mısır'da yeniden yayımlanan bir röportajı; burada şeyhlere yönelik saldırısını İslam'ın savunması ve her Müslümanın görevi olarak tanımlıyor."
  id: "Wawancara oleh Khaled Montaser di surat kabar Ahl Masr tertanggal 9 Oktober 2019, diterbitkan ulang di Mesir; di mana ia menggambarkan serangannya terhadap para sheikh sebagai pembelaan Islam dan kewajiban bagi setiap Muslim."
