summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إسلام سليماني؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من شباب بلوزداد إلى سبورتينغ لشبونة وليستر سيتي وأندية أوروبية أخرى ثم عودته إلى الجزائر، وسجله التاريخي مع المنتخب الجزائري، دون أي ذكر لديانته."
  en: "English Wikipedia article on Islam Slimani; used for entity facts only. It recounts his career from CR Belouizdad to Sporting CP, Leicester City and other European clubs and back to Algeria, and his record scoring for the Algeria national team, with no mention of his religion."
  es: "Artículo de la Wikipedia en inglés sobre Islam Slimani; utilizado únicamente para obtener información sobre su persona. Narra su trayectoria desde el CR Belouizdad hasta el Sporting CP, el Leicester City y otros clubes europeos, y su regreso a Argelia, así como su récord goleador con la selección nacional argelina, sin mencionar su religión."
  fr: "Article Wikipédia en anglais sur Islam Slimani; utilisé uniquement à des fins d'information sur l'entité. Il retrace sa carrière, du CR Belouizdad au Sporting CP, en passant par Leicester City et d'autres clubs européens, avant son retour en Algérie, et évoque son record de buts en équipe nationale algérienne, sans aucune mention de sa religion."
  ur: "اسلام سلیمانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں CR Belouizdad سے Sporting CP، Leicester City اور دیگر یورپی کلبوں اور الجزائر واپس جانے تک، اور الجزائر کی قومی ٹیم کے لیے ان کا ریکارڈ اسکورنگ، جس میں اس کے مذہب کا کوئی تذکرہ نہیں کیا گیا، ان کے کیریئر کا ذکر ہے۔"
