reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Slimani as born on 18 June 1988 in Algiers, a striker who joined Sporting CP in 2013, won the Taça de Portugal in 2015, moved to Leicester City in 2016 for a club-record £28 million, and after loans and later clubs (Lyon, Brest, Anderlecht, Coritiba, Mechelen) returned to CR Belouizdad in 2024; for Algeria he debuted in 2012, passed a hundred caps, scored 46 goals (the national record) and won the 2019 Africa Cup of Nations. It makes no statement of his religion anywhere: no religion field, no statement in text, no religious category."
