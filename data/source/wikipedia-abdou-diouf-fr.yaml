summary:
  ar: "مقالة ويكيبيديا الفرنسية عن عبدو ضيوف؛ سيرة طويلة تُستخدم لوقائع الكيان فقط. صندوقها يذكر الإسلام دينا، ومتنها يذكر أن أطروحته سنة 1960 كان عنوانها «الإسلام والمجتمع الولفي»، وهو موضوع أكاديمي لا شهادة انتماء."
  en: "French Wikipedia article on Abdou Diouf; a long biography used for entity facts only. Its infobox gives his religion as Islam. Its text notes that his 1960 ENFOM dissertation was titled 'L'islam et la société wolof' — an academic subject, not an affiliation attestation."
  es: "Artículo de la Wikipedia en francés sobre Abdou Diouf; una biografía extensa que se utiliza únicamente para datos sobre la persona. Su ficha informativa indica que profesa el islam. El texto señala que su tesis doctoral de 1960, presentada en la ENFOM, se titulaba «L'islam et la société wolof» (El islam y la sociedad wolof), un tema académico, no una declaración de afiliación."
  fr: "L'article Wikipédia français sur Abdou Diouf contient une longue biographie, uniquement à titre informatif. Son infobox indique qu'il est musulman. Le texte précise que sa thèse de doctorat (ENFOM) de 1960 s'intitulait « L'islam et la société wolof » — un sujet d'étude, et non une attestation d'appartenance religieuse."
  ur: "عبدو دیوف پر فرانسیسی ویکیپیڈیا مضمون؛ ایک طویل سوانح عمری صرف ہستی کے حقائق کے لیے استعمال ہوتی ہے۔ اس کا انفو باکس اس کا مذہب اسلام دیتا ہے۔ اس کا متن نوٹ کرتا ہے کہ اس کے 1960 کے ENFOM مقالے کا عنوان 'L'islam et la société wolof' تھا - ایک تعلیمی مضمون، نہ کہ وابستگی کی تصدیق۔"
  tr: "Abdo Diouf hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılan uzun bir biyografi. Kutusunda İslam bir din olarak geçer ve metinde 1960 tarihli tezinin \"İslam ve Wolfi Cemiyeti\" başlıklı olduğu belirtilir; bu konu bir aidiyet sertifikası değil, akademik bir konudur."
  id: "Artikel Wikipedia Prancis tentang Abdo Diouf; biografi panjang yang hanya digunakan untuk fakta entitas. Kotaknya menyebutkan Islam sebagai agama, dan teksnya menyebutkan bahwa tesisnya tahun 1960 berjudul \"Islam and the Wolfi Society,\" yang merupakan topik akademis, bukan sertifikat afiliasi."
