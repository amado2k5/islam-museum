summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبدالواحد محمد صالح: أكاديمي وباحث ومؤلف وخطيب إسلامي وجرّاح عام كردي، وُلد في 1 يوليو 1973 في السليمانية، وهو مؤسس «سمارت هيلث تاور» وأستاذ في كلية الطب بجامعة السليمانية، وداعية منذ 1992."
  en: "English Wikipedia article on Abdulwahid Muhammed Salih: a Kurdish academic, researcher, author, Islamic speaker and general surgeon, born 1 July 1973 in Sulaymaniyah, founder of Smart Health Tower and professor at the College of Medicine, University of Sulaymaniyah, a preacher of Islam since 1992."
  es: "Artículo de la Wikipedia en inglés sobre Abdulwahid Muhammed Salih: académico, investigador, autor, orador islámico y cirujano general kurdo, nacido el 1 de julio de 1973 en Sulaymaniyah, fundador de Smart Health Tower y profesor en la Facultad de Medicina de la Universidad de Sulaymaniyah, predicador del Islam desde 1992."
  fr: "Article de Wikipédia en anglais sur Abdulwahid Muhammed Salih: universitaire, chercheur, auteur, conférencier islamique et chirurgien général kurde, né le 1er juillet 1973 à Sulaymaniyah, fondateur de Smart Health Tower et professeur au Collège de médecine de l’Université de Sulaymaniyah, prédicateur de l’islam depuis 1992."
  ur: "عبدالواحد محمد صالح پر انگریزی ویکیپیڈیا کا مضمون: ایک کرد ماہر تعلیم، محقق، مصنف، اسلامی مقرر اور جنرل سرجن، سلیمانیہ میں یکم جولائی 1973 کو پیدا ہوئے، اسمارٹ ہیلتھ ٹاور کے بانی اور کالج آف میڈیسن، سلیمانیہ یونیورسٹی میں پروفیسر، 1992 سے اسلام کے مبلغ ہیں۔"
  tr: "Abdulwahid Muhammad Saleh hakkında İngilizce Wikipedia makalesi: Kürt akademisyen, araştırmacı, yazar, İslami vaiz ve genel cerrah, 1 Temmuz 1973'te Süleymaniye'de doğdu. Smart Health Tower'ın kurucusudur, Süleymaniye Üniversitesi Tıp Fakültesi'nde profesör ve 1992'den beri vaizdir."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdulwahid Muhammad Saleh: Akademisi, peneliti, penulis, pengkhotbah Islam, dan ahli bedah umum Kurdi, lahir pada 1 Juli 1973 di Sulaymaniyah. Ia adalah pendiri Smart Health Tower, profesor di Fakultas Kedokteran Universitas Sulaymaniyah, dan seorang pengkhotbah sejak 1992."
