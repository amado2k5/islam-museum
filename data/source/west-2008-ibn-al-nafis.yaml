  ur: "جان بی ویسٹ، «ابن النفیس، پھیپھڑوں کی دورانِ خون اور اسلامی سنہری دور» (2008)"
summary:
  ar: "مقالة تاريخية محكّمة في مجلة الفيزيولوجيا التطبيقية، كتبها عالم الفيزيولوجيا التنفسية جون ب. وست. تعرض حياة ابن النفيس، ونقده لمسامّ الحاجز التي قال بها جالينوس، ووصفه لمرور الدم كله عبر الرئة، وتنبؤه بالمنافذ بين الشريان الرئوي والوريد الرئوي، وإعادة اكتشاف المخطوط في برلين سنة 1924، ومسألة وصول عمله إلى أوروبا."
  en: "A peer-reviewed historical article in the Journal of Applied Physiology by the respiratory physiologist John B. West. It covers Ibn al-Nafis's life, his rejection of Galen's septal pores, his account of all the blood passing through the lungs, his prediction of passages between the pulmonary artery and vein, the rediscovery of the manuscript in Berlin in 1924, and the question of whether his work reached Europe."
  ur: "جرنل آف اپلائیڈ فزیالوجی میں نظامِ تنفس کے ماہرِ فعلیات جان بی ویسٹ کا ایک جانچا ہوا تاریخی مقالہ۔ اس میں ابن النفیس کی زندگی، جالینوس کے پردے کے مساموں کی تردید، تمام خون کے پھیپھڑوں سے گزرنے کا بیان، پھیپھڑوی شریان اور ورید کے درمیان راستوں کی پیش گوئی، 1924 میں برلن میں مخطوطے کی دوبارہ دریافت، اور یورپ تک اس کے کام کے پہنچنے کا سوال شامل ہے۔"
