reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him as İsmâil Enver, born at Constantinople on 23 November 1881 in its lead and infobox — though the birth year embedded in its own death-date template is computed from 22 November — a hero of the 1908 revolution, Minister of War and de facto commander-in-chief from 1914 to 1918, and with Talaat and Djemal one of the Three Pashas; it calls him a convicted war criminal and one of the principal perpetrators of the Armenian, Greek and Assyrian genocides, recounts his blame of Armenians for the Sarikamish disaster and his initiation of the deportations that culminated in the Armenian genocide, and his death sentence in absentia. After exile he led the Basmachi against the Bolsheviks and was killed on 4 August 1922 near Ab-i-Derya in the Bukharan People's Soviet Republic; his remains were brought to Turkey and reburied at the Monument of Liberty cemetery, Istanbul, in 1996. It has no religion field and its text makes no statement of his religion or school."
