  ar: "مقالة ويكيبيديا الإنجليزية عن أنور باشا؛ تُستخدم لوقائع الكيان فقط. تروي نظارته للحربية 1914–1918، وكارثة صاريقاميش، وفراره ومحاكمته غيابيًا، وقيادته البسمجيين في بخارى ومقتله سنة 1922 وإعادة دفنه في إسطنبول سنة 1996."
  en: "English Wikipedia article on Enver Pasha; used for entity facts only. It recounts his war ministry of 1914–1918, the Sarikamish disaster, his flight and trial in absentia, his leadership of the Basmachi in Bukhara, his death in 1922, and his reburial at Istanbul in 1996."
