reliability_note: "An independent Turkish news site's investigative report, read on 26 October 2026. Only its leadership attribution is used here: it states that the young people raised at Nur Mektebi formed new structures from 2011, among them Sözler Köşkü and Hayalhanem, and that 'Sözler Köşkü grew under the leadership (öncülüğünde) of Fatih Yağcı', after which Mehmet Yıldız left to found Hayalhanem. The report's wider questions about the organisations' financing are allegations under investigation, are not facts used in this record, and are not repeated in the museum's prose. The report makes no statement naming a legal school for Yağcı personally."
