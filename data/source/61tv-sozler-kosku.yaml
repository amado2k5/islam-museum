  en: "A Turkish news report by 61TV tracing the line of youth organisations that emerged from the Nur Mektebi milieu into Sözler Köşkü and Hayalhanem, stating that Sözler Köşkü grew under the leadership of Fatih Yağcı."
title: "Bir Gözaltı, Bir Dernek, Milyonlarca Takipçi: Nur Mektebi'nden Hayalhanem'e Uzanan Hat Mercek Altında"
