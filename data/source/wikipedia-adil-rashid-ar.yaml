summary:
  ar: "مقالة ويكيبيديا العربية عن عادل رشيد؛ بذرة قصيرة تُستخدم لوقائع الكيان الأساسية فقط. تذكر مولده في 17 فبراير 1988 في المملكة المتحدة ولعبه لمنتخب إنجلترا ويوركشاير، وتخطئ في وصف جنسيته، فلا يُعتمد عليها إلا في الاسم والتاريخ."
  en: "Arabic Wikipedia article on Adil Rashid; a short stub used for basic entity facts only. It gives his birth on 17 February 1988 in the United Kingdom and his play for England and Yorkshire, and misdescribes his nationality, so it is relied on only for the name and date."
  es: "Artículo de Wikipedia en árabe sobre Adil Rashid; un breve esbozo que solo contiene información básica. Indica que nació el 17 de febrero de 1988 en el Reino Unido y que jugó para Inglaterra y Yorkshire, pero describe erróneamente su nacionalidad, por lo que solo se utiliza para el nombre y la fecha."
  fr: "L'article Wikipédia en arabe sur Adil Rashid est une ébauche succincte ne fournissant que des informations de base. Il indique sa naissance le 17 février 1988 au Royaume-Uni, son passage dans les sélections anglaise et du Yorkshire, et sa nationalité est erronée; il ne doit donc être utilisé que pour le nom et la date."
  ur: "عادل رشید پر عربی ویکیپیڈیا مضمون؛ ایک مختصر سٹب جو صرف بنیادی ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ یہ 17 فروری 1988 کو برطانیہ میں اس کی پیدائش اور انگلینڈ اور یارکشائر کے لیے اس کا کھیل ہے، اور اس کی قومیت کو غلط بیان کرتا ہے، اس لیے اس پر صرف نام اور تاریخ پر انحصار کیا جاتا ہے۔"
  tr: "Adel Rashid hakkında Arapça Vikipedi makalesi; sadece varlığın temel bilgileri için kullanılan kısa bir taslak. Makalede, 17 Şubat 1988'de Birleşik Krallık'ta doğduğu ve İngiltere ile Yorkshire milli takımlarında oynadığı yer yer alır ve sadece adı ve tarihinde geçer gibi olduğu için milliyeti yanlışlıkla tanımlanır."
  id: "Artikel Wikipedia berbahasa Arab tentang Adel Rashid; sebuah artikel singkat yang hanya digunakan untuk fakta dasar entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada 17 Februari 1988 di Inggris dan permainannya untuk tim nasional Inggris dan Yorkshire, serta secara keliru menggambarkan kebangsaannya, karena hanya disebutkan dalam nama dan tanggalnya."
