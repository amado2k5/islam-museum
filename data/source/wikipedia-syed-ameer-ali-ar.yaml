reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives his dates in both eras: born 6 April 1849 (1265 AH) and died 3 August 1928 (1347 AH) — the record's Hijri years for him are the article's own, not derivations; an Indian judge, political thinker and Islamist writer, listed among the founders of the All-India Muslim League; a member of the Judicial Committee of the Privy Council; The Spirit of Islam described as defending Islam against Western, especially missionary, attacks and refuting the Orientalist theses on Islam's relation to violence and on slavery, defending women's rights and arguing Islam's suitability for every age; that after the First World War he wrote objecting to the partition of the Ottoman Empire's Arab lands and defended the Ottomans, holding that they had never harmed the Arabs; and that he held several senior administrative and judicial posts. The article names no sect or school for him."
