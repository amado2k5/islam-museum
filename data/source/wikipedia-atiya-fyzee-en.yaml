  ar: "مقالة ويكيبيديا الإنجليزية عن عطية فيضي (1877–1967)؛ تُستخدم لوقائع الكيان فقط. تروي مولدها في القسطنطينية ودراستها في كامبريدج، ويومياتها «زمانه تحصيل» وكتبها في الموسيقى الهندية، وزواجها من صموئيل فيضي رحيمين سنة 1912، وانتقالها إلى كراتشي سنة 1948 ووفاتها فيها سنة 1967."
  en: "English Wikipedia article on Atiya Fyzee (1877–1967); used for entity facts only. It recounts her birth in Constantinople, her studies at Cambridge, her diary Zamana-i-Tahsil and her books on Indian music, her marriage to Samuel Fyzee-Rahamin in 1912, her move to Karachi in 1948 and her death there in 1967."
