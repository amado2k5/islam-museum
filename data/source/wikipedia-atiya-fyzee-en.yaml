summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عطية فيضي (1877–1967)؛ تُستخدم لوقائع الكيان فقط. تروي مولدها في القسطنطينية ودراستها في كامبريدج، ويومياتها «زمانه تحصيل» وكتبها في الموسيقى الهندية، وزواجها من صموئيل فيضي رحيمين سنة 1912، وانتقالها إلى كراتشي سنة 1948 ووفاتها فيها سنة 1967."
  en: "English Wikipedia article on Atiya Fyzee (1877–1967); used for entity facts only. It recounts her birth in Constantinople, her studies at Cambridge, her diary Zamana-i-Tahsil and her books on Indian music, her marriage to Samuel Fyzee-Rahamin in 1912, her move to Karachi in 1948 and her death there in 1967."
  es: "Artículo de la Wikipedia en inglés sobre Atiya Fyzee (1877-1967); utilizado únicamente para datos biográficos. Relata su nacimiento en Constantinopla, sus estudios en Cambridge, su diario Zamana-i-Tahsil y sus libros sobre música india, su matrimonio con Samuel Fyzee-Rahamin en 1912, su traslado a Karachi en 1948 y su fallecimiento allí en 1967."
  fr: "Article de Wikipédia en anglais sur Atiya Fyzee (1877-1967); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Constantinople, ses études à Cambridge, son journal Zamana-i-Tahsil et ses ouvrages sur la musique indienne, son mariage avec Samuel Fyzee-Rahamin en 1912, son installation à Karachi en 1948 et son décès dans cette même ville en 1967."
