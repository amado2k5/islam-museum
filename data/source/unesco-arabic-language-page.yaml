summary:
  ar: "الصفحة «Arabic language (unesco.org/en/arabic-language)» في UNESCO؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: قوانين حماية اللغة العربية وسياساتها."
  en: "The page \"Arabic language (unesco.org/en/arabic-language)\" (UNESCO), named in a research file supplied to the museum on 21 November 2026; the museum did not open the page, and the founder approved using the file without re-verification. Used for: the laws and policies protecting Arabic."
  ur: "صفحہ «Arabic language (unesco.org/en/arabic-language)» (UNESCO)؛ یہ عجائب گھر کو 21 نومبر 2026ء کو دی گئی تحقیقی فائل میں مذکور ہے، عجائب گھر نے صفحہ نہیں کھولا اور بانی نے دوبارہ تصدیق کے بغیر فائل کے استعمال کی منظوری دی۔ استعمال: عربی کے تحفظ کے قوانین اور پالیسیاں۔"
  fr: "La page « Arabic language (unesco.org/en/arabic-language) » (UNESCO), citée dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisée pour : les lois et politiques de protection de l'arabe."
  es: "La página «Arabic language (unesco.org/en/arabic-language)» (UNESCO), citada en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el archivo sin volver a verificar. Usada para: las leyes y políticas de protección del árabe."
  tr: "UNESCO'da \"Arapça dili (unesco.org/en/arabic-language)\" sayfası; 21 Kasım 2026'da müzeye sunulan bir araştırma dosyasında bahsedilmiştir, ancak müze sayfayı açmamış ve kurucu dosyayı yeniden doğrulama gerektirmeden kullanmayı kabul etmiştir. Kullanıldığı alan: Arapça dilinin korunmasına ilişkin yasalar ve politikalar."
  id: "Halaman \"Bahasa Arab (unesco.org/en/arabic-language)\" di UNESCO; disebutkan dalam berkas penelitian yang diserahkan ke museum pada 21 November 2026, namun museum tidak membuka halaman tersebut, dan pendiri setuju untuk menggunakan berkas tersebut tanpa verifikasi ulang. Digunakan dalam: Undang-undang dan kebijakan perlindungan bahasa Arab."
