summary:
  ar: "سيرة معهد قلم لمؤسسه ورئيسه عبد الناصر جانغدا: نشأته في دالاس، وحفظه القرآن في كراتشي، وتخرّجه في برنامج العالم بجامعة بنورية سنة 2001 أولاً على دفعته، ودرجتاه من جامعتي كراتشي والسند، وبودكاستا السيرة والتفسير."
  en: "The Qalam Institute's biography of its founder and president, Abdul Nasir Jangda: born and raised in Dallas, memorised the Qur'an in Karachi, graduated Jamia Binoria's alim programme in 2001 at the top of his class, degrees from Karachi University and the University of Sindh, and author of the Seerah and Tafsir podcasts."
  es: "La biografía del fundador y presidente del Instituto Qalam, Abdul Nasir Jangda: nacido y criado en Dallas, memorizó el Corán en Karachi, se graduó del programa de estudios islámicos de Jamia Binoria en 2001 como el mejor de su clase, tiene títulos de la Universidad de Karachi y la Universidad de Sindh, y es autor de los podcasts Seerah y Tafsir."
  fr: "Biographie du fondateur et président de l'Institut Qalam, Abdul Nasir Jangda: né et élevé à Dallas, a mémorisé le Coran à Karachi, a obtenu son diplôme du programme alim de Jamia Binoria en 2001 en tant que major de sa promotion, des diplômes de l'Université de Karachi et de l'Université du Sindh, et est l'auteur des podcasts Seerah et Tafsir."
