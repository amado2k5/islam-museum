summary:
  ar: "سيرة معهد قلم لمؤسسه ورئيسه عبد الناصر جانغدا: نشأته في دالاس، وحفظه القرآن في كراتشي، وتخرّجه في برنامج العالم بجامعة بنورية سنة 2001 أولاً على دفعته، ودرجتاه من جامعتي كراتشي والسند، وبودكاستا السيرة والتفسير."
  en: "The Qalam Institute's biography of its founder and president, Abdul Nasir Jangda: born and raised in Dallas, memorised the Qur'an in Karachi, graduated Jamia Binoria's alim programme in 2001 at the top of his class, degrees from Karachi University and the University of Sindh, and author of the Seerah and Tafsir podcasts."
