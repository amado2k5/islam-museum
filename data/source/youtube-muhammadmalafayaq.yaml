  ar: "القناة الرسمية للواعظ محمد ملا فائق شارەزووری على يوتيوب؛ بدأت في 18 أكتوبر 2013 وتنشر خطبه ودروسه بالكردية السورانية، وتصف أوصاف مقاطعها فيديواته بأنها لا تخص إلا قناته وصفحته."
