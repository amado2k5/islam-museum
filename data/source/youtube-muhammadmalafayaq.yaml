  ur: "مبلغ محمد مالا فائق شرازوری (@muhammadmalafayaq) کا آفیشل یوٹیوب چینل 18 اکتوبر 2013 کو شروع ہوا، جو سورانی کرد میں ان کے خطبات اور اسباق لے کر؛ اس کی ویڈیو کی تفصیل بتاتی ہے کہ اس کی ویڈیوز صرف اس کے اپنے چینل اور پیج پر ہیں۔"
