summary:
  ar: "مدخل «هايرِدّين، المعمار» (جسر موستار) في موسوعة TDV الإسلامية التركية بقلم سماوي أيجه (المجلد 17، إسطنبول 1998، ص 56–57)، ويتناول بناء جسر موستار، وأمر سنة 975هـ (1568) بإرسال المعمار هايرِدّين لبناء قلعة على ساحل الأدرياتيك، ومسألة تطابق من حملوا الاسم ذاته في الوثائق."
  en: "The TDV İslâm Ansiklopedisi entry 'HAYREDDİN, Mimar' (the Mostar Bridge) by Semavi Eyice (vol. 17, Istanbul 1998, pp. 56–57). It covers the building of the Mostar Bridge, an imperial order of 975 AH (1568) for an architect to build a fortress on the Adriatic coast, and the question of whether several documents name the same man."
title: "HAYREDDİN, Mimar (Mostar Köprüsü)"
author: [{ family: "Eyice", given: "Semavi" }]
