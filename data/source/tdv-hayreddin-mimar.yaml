label: { ar: "هايرِدّين المعمار ⁦(جسر موستار)⁩ — موسوعة TDV الإسلامية ⁦(سماوي أيجه)⁩", en: "HAYREDDİN, Mimar (Mostar Bridge) — TDV İslâm Ansiklopedisi (Semavi Eyice)" }
summary:
  ar: "مدخل «هايرِدّين، المعمار» ⁦(جسر موستار)⁩ في موسوعة TDV الإسلامية التركية بقلم سماوي أيجه ⁦(المجلد 17، إسطنبول 1998، ص 56–57)⁩، ويتناول بناء جسر موستار، وأمر سنة 975هـ (1568) بإرسال المعمار هايرِدّين لبناء قلعة على ساحل الأدرياتيك، ومسألة تطابق من حملوا الاسم ذاته في الوثائق."
  en: "The TDV İslâm Ansiklopedisi entry 'HAYREDDİN, Mimar' (the Mostar Bridge) by Semavi Eyice (vol. 17, Istanbul 1998, pp. 56–57). It covers the building of the Mostar Bridge, an imperial order of 975 AH (1568) for an architect to build a fortress on the Adriatic coast, and the question of whether several documents name the same man."
  es: "La entrada «HAYREDDİN, Mimar» (el puente de Mostar) de la TDV İslâm Ansiklopedisi, de Semavi Eyice (vol. 17, Estambul, 1998, págs. 56-57), trata sobre la construcción del puente de Mostar, una orden imperial del año 975 de la Hégira (1568) para que un arquitecto construyera una fortaleza en la costa adriática, y la cuestión de si varios documentos mencionan al mismo hombre."
  fr: "L'article « HAYREDDİN, Mimar » (le pont de Mostar) de Semavi Eyice (vol. 17, Istanbul, 1998, p. 56-57) de la TDV İslâm Ansiklopedisi traite de la construction du pont de Mostar, d'un ordre impérial de 975 AH (1568) chargeant un architecte de construire une forteresse sur la côte adriatique, et de la question de savoir si plusieurs documents désignent la même personne."
title: "HAYREDDİN, Mimar (Mostar Köprüsü)"
