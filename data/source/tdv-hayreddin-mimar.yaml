publisher: "TDV İslâm Araştırmaları Merkezi, TDV İslâm Ansiklopedisi, vol. 17 (Istanbul, 1998), pp. 56–57; web edition"
URL: "https://islamansiklopedisi.org.tr/hayreddin-mimar--mostar-koprusu"
language: tr
reliability_note: "Read in full on 1 November 2026 in the web edition at islamansiklopedisi.org.tr/hayreddin-mimar--mostar-koprusu. The order of 9 Şevval 975 (7 April 1568) is quoted in the entry from Ahmed Refik Altınay's edition, and the other documents are cited from Orgun, Anhegger and the Topkapı archive guide; none of those was opened. A second TDV entry under the same heading, on the Mimar Hayreddin of the Beyazid mosque, was not read and is not used here: this entry does not settle whether the men are the same."
