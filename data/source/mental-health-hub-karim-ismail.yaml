reliability_note: "His own platform: a primary source for his identity, roles and credentials — not independent corroboration. Read in full on 26 October 2026, on the consultation-date pattern (no revision id exists to cite). The page's «تعرف على كريم إسماعيل» section describes him as a trainer and lecturer in mental health and awareness-building whose style joins psychological science, practical experience and an understanding of people's daily reality; it lists his professional accreditations (Associated Certified Coach and Certified Life, Relationship, Parenting, Business and Career Coach — ICF; Certified CliftonStrengths Coach — Gallup; Positive Discipline Educator — PDA), states that he founded the Mental Health Hub platform for building psychological awareness, that his lectures and workshops average over 100 thousand attendees, that he has cooperated with universities and institutions on training programmes, that his educational content has passed 70 million interactions and his digital community six million followers, and that he is the author of the book «استراحة نفسية», described as one of the most prominent Arabic books in its field. It gives no birth date, no birthplace and names no school, madhhab or creed for him."
