summary:
  ar: "صفحة دورة «لتطمئن نفسي» على منصة كريم إسماعيل الرسمية (Mental Health MENA / Mental Health Hub) وفيها تعريف به بقلم المنصة: مدرّب ومحاضر في الصحة النفسية وبناء الوعي، بخبرة تتجاوز عشر سنوات في الخطابة والتدريب والكوتشينج، معتمد من الاتحاد الدولي للكوتشينج (ACC) وغيره، مؤسس منصة Mental Health Hub، ومؤلف كتاب «استراحة نفسية»، وتذكر المنصة أن مشتركي دوراته تجاوزوا أربعين ألفًا منذ 2018 وأن مجتمعه الرقمي يزيد عن ستة ملايين متابع."
  en: "The 'Litama'in Nafsi' course page on Karim Ismail's own platform (Mental Health MENA / Mental Health Hub), carrying the platform's own 'About Karim Ismail' biography: a trainer and lecturer in mental health and awareness-building with more than ten years in public speaking, training and coaching, certified by the International Coaching Federation (ACC) and others, founder of the Mental Health Hub platform, and author of the book 'Istiraha Nafsiyya' (A Psychological Break); the platform states that his online courses have had more than forty thousand subscribers since 2018 and that his digital community exceeds six million followers."
