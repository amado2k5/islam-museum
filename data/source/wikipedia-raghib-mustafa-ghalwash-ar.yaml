summary:
  ar: "مقالة ويكيبيديا العربية عن القارئ راغب مصطفى غلوش؛ لوقائع الكيان فقط: مولده في برما بالغربية في 5 يوليو 1938، وحفظه القرآن قبل العاشرة، وقراءته ورشًا على إبراهيم الطبليهي بالمعهد الأحمدي، وأذانه وقراءته في مسجد الحسين أثناء تجنيده، واعتماده قارئًا بالإذاعة في 1962، وأسفاره، ووفاته في 4 فبراير 2016؛ وتنقل روايته عن نفسه من المصري اليوم (2023) وتستند إلى اليوم السابع ومصراوي والبوابة نيوز."
  en: "Arabic Wikipedia article on the reciter Raghib Mustafa Ghalwash; entity facts only: birth at Birma, Gharbia, on 5 July 1938, memorisation before ten, the Warsh reading with Ibrahim al-Tablihi at the Ahmadi institute, his adhan and recitation at al-Hussein Mosque while a conscript, admission as a radio reciter in 1962, his travels, and death on 4 February 2016; it quotes his own account from al-Masry al-Youm (2023) and cites Youm7, Masrawy and Al-Bawaba News."
