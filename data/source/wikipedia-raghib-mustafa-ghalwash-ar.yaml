summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0639\u0646 \u0627\u0644\u0642\u0627\u0631\u0626 \u0631\u0627\u063a\u0628 \u0645\u0635\u0637\u0641\u0649 \u063a\u0644\u0648\u0634\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u0628\u0631\u0645\u0627 \u0628\u0627\u0644\u063a\u0631\u0628\u064a\u0629 \u0641\u064a 5 \u064a\u0648\u0644\u064a\u0648 1938\u060c \u0648\u062d\u0641\u0638\u0647 \u0627\u0644\u0642\u0631\u0622\u0646 \u0642\u0628\u0644 \u0627\u0644\u0639\u0627\u0634\u0631\u0629\u060c \u0648\u0642\u0631\u0627\u0621\u062a\u0647 \u0648\u0631\u0634\u064b\u0627 \u0639\u0644\u0649 \u0625\u0628\u0631\u0627\u0647\u064a\u0645 \u0627\u0644\u0637\u0628\u0644\u064a\u0647\u064a \u0628\u0627\u0644\u0645\u0639\u0647\u062f \u0627\u0644\u0623\u062d\u0645\u062f\u064a\u060c \u0648\u0623\u0630\u0627\u0646\u0647 \u0648\u0642\u0631\u0627\u0621\u062a\u0647 \u0641\u064a \u0645\u0633\u062c\u062f \u0627\u0644\u062d\u0633\u064a\u0646 \u0623\u062b\u0646\u0627\u0621 \u062a\u062c\u0646\u064a\u062f\u0647\u060c \u0648\u0627\u0639\u062a\u0645\u0627\u062f\u0647 \u0642\u0627\u0631\u0626\u064b\u0627 \u0628\u0627\u0644\u0625\u0630\u0627\u0639\u0629 \u0641\u064a 1962\u060c \u0648\u0623\u0633\u0641\u0627\u0631\u0647\u060c \u0648\u0648\u0641\u0627\u062a\u0647 \u0641\u064a 4 \u0641\u0628\u0631\u0627\u064a\u0631 2016\u061b \u0648\u062a\u0646\u0642\u0644 \u0631\u0648\u0627\u064a\u062a\u0647 \u0639\u0646 \u0646\u0641\u0633\u0647 \u0645\u0646 \u0627\u0644\u0645\u0635\u0631\u064a \u0627\u0644\u064a\u0648\u0645 (2023) \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0627\u0644\u064a\u0648\u0645 \u0627\u0644\u0633\u0627\u0628\u0639 \u0648\u0645\u0635\u0631\u0627\u0648\u064a \u0648\u0627\u0644\u0628\u0648\u0627\u0628\u0629 \u0646\u064a\u0648\u0632."
  en: "Arabic Wikipedia article on the reciter Raghib Mustafa Ghalwash; entity facts only: birth at Birma, Gharbia, on 5 July 1938, memorisation before ten, the Warsh reading with Ibrahim al-Tablihi at the Ahmadi institute, his adhan and recitation at al-Hussein Mosque while a conscript, admission as a radio reciter in 1962, his travels, and death on 4 February 2016; it quotes his own account from al-Masry al-Youm (2023) and cites Youm7, Masrawy and Al-Bawaba News."
