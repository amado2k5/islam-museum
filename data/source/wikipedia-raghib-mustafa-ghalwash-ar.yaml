summary:
  ar: "مقالة ويكيبيديا العربية عن القارئ راغب مصطفى غلوش؛ لوقائع الكيان فقط: مولده في برما بالغربية في 5 يوليو 1938، وحفظه القرآن قبل العاشرة، وقراءته ورشًا على إبراهيم الطبليهي بالمعهد الأحمدي، وأذانه وقراءته في مسجد الحسين أثناء تجنيده، واعتماده قارئًا بالإذاعة في 1962، وأسفاره، ووفاته في 4 فبراير 2016؛ وتنقل روايته عن نفسه من المصري اليوم (2023) وتستند إلى اليوم السابع ومصراوي والبوابة نيوز."
  en: "Arabic Wikipedia article on the reciter Raghib Mustafa Ghalwash; entity facts only: birth at Birma, Gharbia, on 5 July 1938, memorisation before ten, the Warsh reading with Ibrahim al-Tablihi at the Ahmadi institute, his adhan and recitation at al-Hussein Mosque while a conscript, admission as a radio reciter in 1962, his travels, and death on 4 February 2016; it quotes his own account from al-Masry al-Youm (2023) and cites Youm7, Masrawy and Al-Bawaba News."
  es: "Artículo de Wikipedia en árabe sobre el recitador Raghib Mustafa Ghalwash; solo datos sobre la persona: nacimiento en Birma, Gharbia, el 5 de julio de 1938, memorización antes de los diez años, lectura del Warsh con Ibrahim al-Tablihi en el instituto Ahmadi, su adhan y recitación en la mezquita al-Hussein mientras era recluta, admisión como recitador de radio en 1962, sus viajes y muerte el 4 de febrero de 2016; cita su propio relato de al-Masry al-Youm (2023) y cita a Youm7, Masrawy y Al-Bawaba News."
  fr: "Article de Wikipédia en arabe sur le récitant Raghib Mustafa Ghalwash; faits concernant uniquement l’entité: naissance à Birma, Gharbia, le 5 juillet 1938, mémorisation avant dix ans, lecture de Warsh avec Ibrahim al-Tablihi à l’institut Ahmadi, son adhan et sa récitation à la mosquée al-Hussein pendant son service militaire, admission comme récitant à la radio en 1962, ses voyages et sa mort le 4 février 2016; il cite son propre récit tiré d’al-Masry al-Youm (2023) et cite Youm7, Masrawy et Al-Bawaba News."
  ur: "قاری راغب مصطفیٰ غلواش پر عربی ویکیپیڈیا کا مضمون؛ ہستی کے حقائق صرف: برما، غربیہ میں 5 جولائی 1938 کو پیدائش، دس سے پہلے حفظ، احمدی انسٹی ٹیوٹ میں ابراہیم التبلیحی کے ساتھ وارش پڑھنا، الحسینی مسجد میں ان کی اذان اور تلاوت، جب کہ بھرتی، 1962 میں ریڈیو کے قاری کے طور پر داخلہ، 1962 میں ان کی وفات اور 46 فروری کو سفر؛ اس نے المصری الیووم (2023) سے اس کے اپنے اکاؤنٹ کا حوالہ دیا ہے اور یوم 7، مسروی اور البوبہ نیوز کا حوالہ دیا ہے۔"
  tr: "Ragheb Mustafa Glouş hakkında Arapça Vikipedi makalesi; sadece varlık olayları için: 5 Temmuz 1938'de Burma, Garbia'da doğumu, on yaşından önce Kur'an'ı ezberlemesi, Ahmadi Enstitüsü'nde İbrahim El-Tablihi'ye yaptığı okuma ve dersi, askeri hizmeti sırasında El-Hüseyin Camii'nde ezan ve ezabet, 1962'de radyo okuyucusu olarak akredite edilmesi, seyahatleri ve 4 Şubat 2016'daki ölümü; kendi anlatımı Al-Masry Al-Youm (2023) tarafından aktarılmış olup Youm7, Masrawy ve Al-Bawaba Haberleri'ne dayanmaktadır."
  id: "Artikel Wikipedia Arab tentang pembaca Ragheb Mustafa Gloush; hanya untuk acara entitas: kelahirannya di Burma, Gharbia pada 5 Juli 1938, hafalan Al-Qur'an sebelum usia sepuluh tahun, pembacaan dan pengajarannya kepada Ibrahim Al-Tablihi di Institut Ahmadi, panggilan salat dan bacaan di Masjid Al-Hussein selama dinas militernya, akreditasi sebagai pembaca radio pada 1962, perjalanannya, dan kematiannya pada 4 Februari 2016; kisahnya sendiri disiarkan dari Al-Masry Al-Youm (2023) dan didasarkan pada Youm7, Masrawy, dan Al-Bawaba News."
