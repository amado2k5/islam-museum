label:
  ar: "سنن الدارقطني وبذيله التعليق المغني على الدارقطني لشمس الحق العظيم آبادي — دار ابن حزم، الطبعة الأولى 1432هـ/2011م"
  en: "Sunan al-Daraqutni, with al-Ta'liq al-Mughni 'ala al-Daraqutni by Shams al-Haqq al-'Azimabadi — Dar Ibn Hazm, 1st ed. 1432 AH/2011 CE"
summary:
  ar: "طبعة دار ابن حزم ببيروت لسنن الدارقطني ⁦(306–385هـ)⁩ في مجلد واحد، وبذيلها «التعليق المغني على الدارقطني» لأبي الطيب محمد شمس الحق العظيم آبادي، الطبعة الأولى 1432هـ/2011م؛ وفي أولها مقدمة العظيم آبادي في ترجمة الدارقطني ورواة السنن عنه وأسانيده إليه."
  en: "The Dar Ibn Hazm (Beirut) one-volume edition of the Sunan of al-Daraqutni (306–385 AH), with Abu al-Tayyib Muhammad Shams al-Haqq al-'Azimabadi's al-Ta'liq al-Mughni 'ala al-Daraqutni beneath it, 1st ed. 1432 AH/2011 CE; it opens with al-'Azimabadi's introduction on al-Daraqutni's life, the transmitters of the Sunan and his chains to it."
  es: "La edición en un solo volumen de Dar Ibn Hazm (Beirut) del Sunan de al-Daraqutni (306–385 AH), con al-Ta'liq al-Mughni 'ala al-Daraqutni de Abu al-Tayyib Muhammad Shams al-Haqq al-'Azimabadi debajo, 1.ª ed. 1432 AH/2011 CE; comienza con la introducción de al-'Azimabadi sobre la vida de al-Daraqutni, los transmisores del Sunan y sus cadenas de transmisión."
  fr: "L'édition en un volume de Dar Ibn Hazm (Beyrouth) du Sunan d'al-Daraqutni (306-385 AH), avec en dessous al-Ta'liq al-Mughni 'ala al-Daraqutni d'Abu al-Tayyib Muhammad Shams al-Haqq al-'Azimabadi, 1ère édition 1432 AH/2011 CE; elle s'ouvre sur l'introduction d'al-'Azimabadi sur la vie d'al-Daraqutni, les transmetteurs du Sunan et ses chaînes de transmission."
  ur: "دار ابن حزم ⁦(بیروت)⁩ سنن الدارقطنی ⁦(306-385ھ)⁩ کا ایک جلد ایڈیشن، جس کے نیچے ابو الطیب محمد شمس الحق العظیم آبادی کا التعلیق المغنی عالی دارقطنی ہے۔ 1432ھ/2011 عیسوی؛ اس کا آغاز العظیم آبادی کے الدارقطنی کی زندگی، سنن کے ٹرانسمیٹر اور اس کی زنجیروں سے متعلق تعارف سے ہوتا ہے۔"
  tr: "Dar İbn Hazm, Beyrut baskısında Sunan al-Daraqutni (306–385 H) tek ciltte yer alır, ek olarak 'Al-Ta'liq al-Mughni 'ala al-Daraqutni' (Abu al-Tayyib Mughni ala al-Daraqutni' (Abu al-Tayyib Muhams al-Haqq al-Azimabadi) tarafından yazılmış, ilk baskı 1432 H/2011 M.; başlangıçta el-Azimabadi'nin el-Daraqutni'nin biyografisi, ondan Sünen anlatıcıları ve ona aktarma zincirleri üzerine bir girişi yer alır."
  id: "Dar Ibn Hazm dalam edisi Beirut Sunan al-Daraqutni (306–385 H) dalam satu jilid, dengan lampiran 'Al-Ta'liq al-Mughni 'ala al-Daraqutni' oleh Abu al-Tayyib Muhammad Shams al-Haqq al-Azimabadi, edisi pertama 1432 H/2011 M; di awal terdapat pengantar al-Azimabadi tentang biografi al-Daraqutni, para narator Sunan darinya, dan rantai transmisinya kepadanya."
