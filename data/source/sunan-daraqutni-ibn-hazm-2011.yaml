summary:
  ar: "طبعة دار ابن حزم ببيروت لسنن الدارقطني ⁦(306–385هـ)⁩ في مجلد واحد، وبذيلها «التعليق المغني على الدارقطني» لأبي الطيب محمد شمس الحق العظيم آبادي، الطبعة الأولى 1432هـ/2011م؛ وفي أولها مقدمة العظيم آبادي في ترجمة الدارقطني ورواة السنن عنه وأسانيده إليه."
  en: "The Dar Ibn Hazm (Beirut) one-volume edition of the Sunan of al-Daraqutni (306–385 AH), with Abu al-Tayyib Muhammad Shams al-Haqq al-'Azimabadi's al-Ta'liq al-Mughni 'ala al-Daraqutni beneath it, 1st ed. 1432 AH/2011 CE; it opens with al-'Azimabadi's introduction on al-Daraqutni's life, the transmitters of the Sunan and his chains to it."
