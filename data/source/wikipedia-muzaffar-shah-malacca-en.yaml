summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سلطان مظفر شاه ⁦(ت. 1459)⁩، خامس سلاطين ملقا؛ وُلد راجا قاسم ابنًا لسلطان محمد شاه، ونُصّب بعد وفاة أخيه غير الشقيق أبي شهيد شاه، وحكم من 1446 إلى 1459، وصدّ هجوم سيام البحري سنة 1456 بقيادة تون بيراك، وحسم النزاع بين تون علي وتون بيراك بتطليق زوجته تون كودو ليتزوجها تون علي."
  en: "English Wikipedia article on Sultan Muzaffar Shah (d. 1459), fifth sultan of Malacca; born Raja Kassim, a son of Sultan Muhammad Shah, he was installed after the death of his half-brother Abu Syahid Shah, ruled from 1446 to 1459, repelled the Siamese sea attack of 1456 under Tun Perak, and settled the Tun Ali–Tun Perak feud by divorcing his wife Tun Kudu so that Tun Ali could marry her."
  es: "Artículo de la Wikipedia en inglés sobre el sultán Muzaffar Shah (fallecido en 1459), quinto sultán de Malaca; nacido como Raja Kassim, hijo del sultán Muhammad Shah, fue entronizado tras la muerte de su hermanastro Abu Syahid Shah, gobernó desde 1446 hasta 1459, repelió el ataque marítimo siamés de 1456 bajo el mando de Tun Perak y resolvió la disputa entre Tun Ali y Tun Perak divorciándose de su esposa Tun Kudu para que Tun Ali pudiera casarse con ella."
  fr: "Article de Wikipédia en anglais sur le sultan Muzaffar Shah (mort en 1459), cinquième sultan de Malacca; né Raja Kassim, fils du sultan Muhammad Shah, il fut installé après la mort de son demi-frère Abu Syahid Shah, régna de 1446 à 1459, repoussa l'attaque maritime siamoise de 1456 sous Tun Perak et régla la querelle entre Tun Ali et Tun Perak en divorçant de sa femme Tun Kudu afin que Tun Ali puisse l'épouser."
  ur: "ملاکا کے پانچویں سلطان سلطان مظفر شاہ ⁦(متوفی 1459)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ راجہ قاسم، سلطان محمد شاہ کا بیٹا پیدا ہوا، وہ اپنے سوتیلے بھائی ابو سعید شاہ کی موت کے بعد نصب کیا گیا، جس نے 1446 سے 1459 تک حکومت کی، 1456 کے سیام کے سمندری حملے کو تون پراک کے تحت پسپا کیا، اور اپنی بیوی کو طلاق دے کر تون علی – تون پراک کے تنازعے کو حل کیا تاکہ اس کی بیوی تون علی سے شادی کر سکے۔"
