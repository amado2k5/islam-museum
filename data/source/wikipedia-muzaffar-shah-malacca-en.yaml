  ar: "مقالة ويكيبيديا الإنجليزية عن سلطان مظفر شاه (ت. 1459)، خامس سلاطين ملقا؛ وُلد راجا قاسم ابنًا لسلطان محمد شاه، ونُصّب بعد وفاة أخيه غير الشقيق أبي شهيد شاه، وحكم من 1446 إلى 1459، وصدّ هجوم سيام البحري سنة 1456 بقيادة تون بيراك، وحسم النزاع بين تون علي وتون بيراك بتطليق زوجته تون كودو ليتزوجها تون علي."
  en: "English Wikipedia article on Sultan Muzaffar Shah (d. 1459), fifth sultan of Malacca; born Raja Kassim, a son of Sultan Muhammad Shah, he was installed after the death of his half-brother Abu Syahid Shah, ruled from 1446 to 1459, repelled the Siamese sea attack of 1456 under Tun Perak, and settled the Tun Ali–Tun Perak feud by divorcing his wife Tun Kudu so that Tun Ali could marry her."
