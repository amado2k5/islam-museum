reliability_note: "Read in full (text and wikitext) on 1 November 2026. The article's narrative rests on Cœdès, The Indianized States of Southeast Asia (1968), and the Malay Annals tradition behind it; its body text contains a slip (it once says he was installed after his father's death, where its own infobox and the succession boxes give his half-brother Abu Syahid Shah as predecessor), and the frame used here follows the infobox and the Malay edition on that point. No birth date is given anywhere in it. Its infobox carries 'Sunni Islam' as his religion, an editor's summary value that no sentence in the article supports; the Malay edition's infobox carries the same value over substantially the same tradition, so the two are one attestation family, preserved in the record's faith note rather than adopted. The accession year is 1446 here against the Malay edition's 1445, and the variant is preserved."
