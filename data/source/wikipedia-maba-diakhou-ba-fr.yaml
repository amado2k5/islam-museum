reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. Its lead calls him 'marabout du Rip et membre de la confrérie Tijaniyya' (a marabout of the Rip and member of the Tijani brotherhood) and its infobox gives his religion as Islam; it gives his birth in 1809 (its infobox names Tavacaltou as the birthplace), his Quranic formation in Cayor and Jolof, his 1846 meeting with Umar Tall at Kabakoto, his proclamation as Almamy of the Rip in 1861, his renaming of Paos-Dimar as Nioro du Rip in honour of Umar Tall, his alliance with Lat Dior and Alboury Ndiaye, and his death at the battle of Fandane-Thiouthioune (Somb) on 18 July 1867, buried near Fandène, his mausoleum a listed historic monument. It names no madhhab for him."
