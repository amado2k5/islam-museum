summary:
  ar: "مقالة ويكيبيديا الفرنسية عن مابا دياخو با؛ تُستخدم لوقائع الكيان فقط. تصفه في مطلعها بأنه عضو في الطريقة التيجانية، وتروي تكوينه القرآني ولقاءه بعمر تال سنة 1846 وحكمه للريب ووفاته في 18 يوليو 1867 في سومب."
  en: "French Wikipedia article on Maba Diakhou Bâ; used for entity facts only. Its lead calls him a member of the Tijani brotherhood; it recounts his Quranic formation, his 1846 meeting with Umar Tall, his rule of the Rip, and his death on 18 July 1867 at Somb."
  es: "Artículo de la Wikipedia en francés sobre Maba Diakhou Bâ; utilizado únicamente para datos sobre la persona. En su introducción se le describe como miembro de la hermandad Tijani; relata su formación coránica, su encuentro con Umar Tall en 1846, su gobierno del Rip y su muerte el 18 de julio de 1867 en Somb."
  fr: "Article de Wikipédia en français sur Maba Diakhou Bâ; utilisé uniquement pour les informations sur l’entité. Son introduction le présente comme membre de la confrérie Tijani; elle relate sa formation coranique, sa rencontre avec Umar Tall en 1846, son règne sur le Rip et sa mort le 18 juillet 1867 à Somb."
  ur: "Maba Diakhou Bâ پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی قیادت اسے تیجانی بھائی چارے کا رکن کہتی ہے۔ اس میں اس کی قرآنی تشکیل، عمر ٹل کے ساتھ اس کی 1846 کی ملاقات، اس کی رپ کی حکمرانی، اور 18 جولائی 1867 کو سومب میں اس کی موت کا ذکر ہے۔"
  tr: "Maba Diajo Ba hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. Başta onu Tijaniyya tarikatının bir üyesi olarak tanımlar ve Kur'an yazısını, 1846'da Umar Tal ile tanışmasını, Aryeb üzerindeki yönetimini ve 18 Temmuz 1867'de Sombe'de ölümünü anlatır."
  id: "Artikel Wikipedia Prancis tentang Maba Diajo Ba; digunakan hanya untuk fakta entitas. Artikel ini menggambarkannya pada awal sebagai anggota ordo Tijaniyya, dan menceritakan komposisi Al-Qur'an, bertemu Umar Tal pada tahun 1846, pemerintahannya atas Aryeb, dan kematiannya pada 18 Juli 1867 di Sombe."
