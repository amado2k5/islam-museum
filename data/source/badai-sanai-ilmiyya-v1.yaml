label:
  ar: "الكاساني، بدائع الصنائع في ترتيب الشرائع، الجزء الأول ⁦(تحقيق علي محمد معوض وعادل أحمد عبد الموجود، دار الكتب العلمية 1424هـ/2003م)⁩"
  en: "al-Kasani, Bada'i' al-Sana'i' fi Tartib al-Shara'i', vol. 1 (ed. Ali Muhammad Mu'awwad and Adil Ahmad Abd al-Mawjud, Dar al-Kutub al-Ilmiyya, 2003)"
  ur: "کاسانی، بدائع الصنائع فی ترتیب الشرائع، جلد اول ⁦(تحقیق علی محمد معوض و عادل احمد عبد الموجود، دار الکتب العلمیہ 2003ء)⁩"
summary:
  ar: "الجزء الأول من بدائع الصنائع للإمام علاء الدين أبي بكر بن مسعود الكاساني الحنفي ⁦(ت 587هـ)⁩، بتحقيق وتعليق الشيخ علي محمد معوض والشيخ عادل أحمد عبد الموجود، منشورات محمد علي بيضون، دار الكتب العلمية، بيروت، الطبعة الثانية 1424هـ/2003م. في أوله مقدمة للمحققين في الشريعة والفقه، وترجمة لأبي حنيفة، وترجمة صاحب البدائع وزوجته فاطمة، وصلة التحفة بالبدائع، ووصف النسخ الخطية؛ ثم مقدمة المؤلف وكتاب الطهارة وما يليه."
  en: "Volume 1 of Bada'i' al-Sana'i' by Imam Ala' al-Din Abu Bakr ibn Mas'ud al-Kasani al-Hanafi (d. 587 AH), edited with notes by Shaykh Ali Muhammad Mu'awwad and Shaykh Adil Ahmad Abd al-Mawjud, Muhammad Ali Baydun publications, Dar al-Kutub al-Ilmiyya, Beirut, second edition 1424 AH / 2003. It opens with the editors' introduction on law and fiqh, a life of Abu Hanifa, a life of the author and of his wife Fatima, the relation of al-Tuhfa to al-Bada'i' and a description of the manuscripts; then the author's preface and the Book of Purity onwards."
  es: "Volumen 1 de Bada'i' al-Sana'i' del Imam Ala' al-Din Abu Bakr ibn Mas'ud al-Kasani al-Hanafi (fallecido en 587 AH), editado con notas por Shaykh Ali Muhammad Mu'awwad y Shaykh Adil Ahmad Abd al-Mawjud, publicaciones Muhammad Ali Baydun, Dar al-Kutub al-Ilmiyya, Beirut, segunda edición 1424 AH / 2003. Comienza con la introducción de los editores sobre derecho y fiqh, una biografía de Abu Hanifa, una biografía del autor y de su esposa Fátima, la relación de al-Tuhfa con al-Bada'i' y una descripción de los manuscritos; luego el prefacio del autor y el Libro de la Pureza en adelante."
  fr: "Volume 1 de Bada'i' al-Sana'i' par l'Imam Ala' al-Din Abu Bakr ibn Mas'ud al-Kasani al-Hanafi (d. 587 AH), édité et annoté par Shaykh Ali Muhammad Mu'awwad et Shaykh Adil Ahmad Abd al-Mawjud, Éditions Muhammad Ali Baydun, Dar al-Kutub al-Ilmiyya, Beyrouth, deuxième édition 1424 AH / 2003. Il s'ouvre sur l'introduction des éditeurs sur le droit et le fiqh, une biographie d'Abu Hanifa, une biographie de l'auteur et de son épouse Fatima, le lien entre al-Tuhfa et al-Bada'i' et une description des manuscrits; puis la préface de l'auteur et le Livre de la Pureté."
  ur: "بدائع الصنائع کی جلد 1 از امام علاء الدین ابو بکر بن مسعود الکاسانی الحنفی ⁦(متوفی 587ھ)⁩، شیخ علی محمد معاواد اور شیخ عادل احمد عبد الموجود، محمد علی بیدون الطبیعۃ الطبیۃ الطبیعۃ الثانیۃ الدعوۃ الدعوۃ الدعوۃ الصنائع۔ 1424 ہجری / 2003۔ اس کا آغاز قانون اور فقہ پر مدیران کے تعارف، ابو حنیفہ کی زندگی، مصنف اور ان کی اہلیہ فاطمہ کی زندگی، الطحفہ کا البداعی سے تعلق اور مخطوطات کی تفصیل سے ہوتا ہے۔ پھر مصنف کا دیباچہ اور پاکیزگی کی کتاب۔"
  tr: "İmam Ala'ddin Ebu Bekir bin Mesud el-Kasani el-Hanefi (ö. 587 Hicri) tarafından yazılmış Bada'i'al-Sana'i'nin ilk bölümü, Şeyh Ali Muhammed Muavwad ve Şeyh Adel Ahmed Abd el-Mevcud tarafından düzenlenip notlandırılmıştır, Muhammed Ali Baydoun tarafından yayımlanmıştır, Dar al-Kutub el-İlmiyya, Beyrut, ikinci baskı 1424 Hicri / 2003 M.S. Başlangıçta, editörlerin Şeriat ve fıkıh üzerine bir girişi, Ebu Hanifa'nın biyografisi, el-Bada'i'nin yazarı ve eşi Fatima'nın biyografisi, el-Tuhfa'nın el-Bada'i ile bağlantısı ve el yazmalarının açıklaması; ardından yazarın girişi, arınma kitabı ve sonraki bölümler yer alır."
  id: "Bagian pertama Bada'i' al-Sana'i' oleh Imam Ala' al-Din Abu Bakr ibn Mas'ud al-Kasani al-Hanafi (wafat 587 H), disunting dan diberi anotasi oleh Sheikh Ali Muhammad Mu'awwad dan Sheikh Adel Ahmad Abd al-Mawjud, diterbitkan oleh Muhammad Ali Baydoun, Dar al-Kutub al-Ilmiyya, Beirut, edisi kedua 1424 H / 2003 M. Di awal, terdapat pengantar oleh para editor dalam Syariah dan Hukum, biografi Abu Hanifa, biografi penulis al-Bada'i' dan istrinya Fatima, hubungan al-Tuhfa dengan al-Bada'i'i', serta deskripsi manuskrip; kemudian pengantar penulis, kitab penyucian, dan lainnya."
