  en: "al-Kasani, Bada'i' al-Sana'i' fi Tartib al-Shara'i', vol. 1 (ed. Ali Muhammad Mu'awwad and Adil Ahmad Abd al-Mawjud, Dar al-Kutub al-Ilmiyya, 2003)"
  ur: "کاسانی، بدائع الصنائع فی ترتیب الشرائع، جلد اول (تحقیق علی محمد معوض و عادل احمد عبد الموجود، دار الکتب العلمیہ 2003ء)"
summary:
  ar: "الجزء الأول من بدائع الصنائع للإمام علاء الدين أبي بكر بن مسعود الكاساني الحنفي ⁦(ت 587هـ)⁩، بتحقيق وتعليق الشيخ علي محمد معوض والشيخ عادل أحمد عبد الموجود، منشورات محمد علي بيضون، دار الكتب العلمية، بيروت، الطبعة الثانية 1424هـ/2003م. في أوله مقدمة للمحققين في الشريعة والفقه، وترجمة لأبي حنيفة، وترجمة صاحب البدائع وزوجته فاطمة، وصلة التحفة بالبدائع، ووصف النسخ الخطية؛ ثم مقدمة المؤلف وكتاب الطهارة وما يليه."
  en: "Volume 1 of Bada'i' al-Sana'i' by Imam Ala' al-Din Abu Bakr ibn Mas'ud al-Kasani al-Hanafi (d. 587 AH), edited with notes by Shaykh Ali Muhammad Mu'awwad and Shaykh Adil Ahmad Abd al-Mawjud, Muhammad Ali Baydun publications, Dar al-Kutub al-Ilmiyya, Beirut, second edition 1424 AH / 2003. It opens with the editors' introduction on law and fiqh, a life of Abu Hanifa, a life of the author and of his wife Fatima, the relation of al-Tuhfa to al-Bada'i' and a description of the manuscripts; then the author's preface and the Book of Purity onwards."
