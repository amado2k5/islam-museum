summary:
  ar: "ترجمة الكندي وسياقه العباسي؛ يرفض كايا الجزم بأنه معتزلي ويعرض نسبته إلى الاعتزال عند فالزر ودي بور، مع بيان دفاعه عن الإسلام."
  en: "Biography and Abbasid context; Kaya rejects confidently classifying him as Mu'tazili while reporting Walzer's and de Boer's classifications and discussing his defence of Islam."
  ur: "عباسی سیاق کی سوانح؛ کایا والزر اور ڈی بور کی معتزلی نسبت نقل کرتے مگر قطعی درجہ بندی رد کرتے ہیں، اور اسلام کے دفاع کا ذکر کرتے ہیں۔"
  es: "Biografía y contexto abasí; Kaya rechaza clasificarlo con seguridad como mutazilí, al tiempo que informa sobre las clasificaciones de Walzer y de Boer y analiza su defensa del Islam."
  fr: "Biographie et contexte abbasside; Kaya refuse de le classer avec assurance comme Mu'tazili tout en rapportant les classifications de Walzer et de Boer et en discutant de sa défense de l'islam."
  tr: "Al-Kindi'nin çevirisi ve Abbasi bağlamı; Kaya, Mu'tazilite olduğu iddiasını reddeder ve Mu'tazilite atfını Walzer ve de Boer'e göre sunar, İslam'ı savunurken bunu belirtir."
  id: "terjemahan Al-Kindi dan konteks Abbasiyah; Kaya menolak klaim bahwa ia adalah Mu'tazilite dan menyajikan atribusinya kepada Mu'tazilite menurut Walzer dan de Boer, sambil menyatakan pembelaannya terhadap Islam."
