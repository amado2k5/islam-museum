label: { ar: "ابن قتيبة، عيون الأخبار، دار الكتب والوثائق القومية، القاهرة، الطبعة الثانية 1996 ⁦(نسخة ممسوحة)⁩", en: "Ibn Qutayba, 'Uyun al-Akhbar, Dar al-Kutub wa-l-Watha'iq al-Qawmiyya, Cairo, 2nd printing 1996 (scan)", ur: "ابن قتیبہ، عیون الاخبار، دار الکتب والوثائق القومیہ، قاہرہ، دوسری طباعت 1996 ⁦(اسکین)⁩", fr: "Ibn Qutayba, 'Uyun al-Akhbar, Dar al-Kutub wa-l-Watha'iq al-Qawmiyya, Le Caire, 2e tirage 1996 (numérisation)", es: "Ibn Qutayba, 'Uyun al-Akhbar, Dar al-Kutub wa-l-Watha'iq al-Qawmiyya, El Cairo, 2.ª impresión 1996 (escaneo)" }
summary:
  ar: "نسخة ممسوحة من عيون الأخبار لابن قتيبة الدينوري في أربعة مجلدات، وبطاقة الفهرسة في أولها تذكر الطبعة الثانية بدار الكتب والوثائق القومية بالقاهرة سنة 1996. قُرئت آليا في 1836 صفحة مصورة، ومنها تؤخذ مقاطع المزاح والنوادر لمتصفح جحا والفلكلور الإسلامي."
  en: "A scan of Ibn Qutayba al-Dinawari's 'Uyun al-Akhbar in four volumes; the cataloguing card at its front names the second printing by Dar al-Kutub wa-l-Watha'iq al-Qawmiyya, Cairo, 1996. It was machine-read over 1,836 scan pages, and the jest and anecdote excerpts of the Juha and Islamic Folklore Browser are taken from it."
  ur: "ابن قتیبہ دینوری کی عیون الاخبار کا چار جلدوں کا اسکین؛ ابتدا میں فہرست کارڈ دار الکتب والوثائق القومیہ، قاہرہ کی دوسری طباعت 1996 بتاتا ہے۔ اسے 1836 اسکین صفحات میں مشینی طور پر پڑھا گیا، اور جحا اور اسلامی لوک ادب کے براؤزر کے مزاح اور نوادر کے اقتباسات اسی سے لیے گئے ہیں۔"
  fr: "Une numérisation des 'Uyun al-Akhbar d'Ibn Qutayba al-Dinawari en quatre volumes ; la fiche de catalogage en tête nomme le deuxième tirage de Dar al-Kutub wa-l-Watha'iq al-Qawmiyya, Le Caire, 1996. Elle a été lue par machine sur 1 836 pages, et les extraits de plaisanterie et d'anecdotes du Navigateur de Juha et du folklore islamique en sont tirés."
  es: "Un escaneo de 'Uyun al-Akhbar de Ibn Qutayba al-Dinawari en cuatro volúmenes; la ficha de catalogación al inicio nombra la segunda impresión de Dar al-Kutub wa-l-Watha'iq al-Qawmiyya, El Cairo, 1996. Se leyó por máquina en 1.836 páginas escaneadas, y de él se toman los extractos de bromas y anécdotas del Navegador de Juha y del folclore islámico."
