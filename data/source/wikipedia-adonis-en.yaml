summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشاعر السوري أدونيس (علي أحمد سعيد إسبر)؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 1 يناير 1930 في قرية القصابين لأسرة فلاحية علوية، وتعليمه وسجنه لعضويته في الحزب السوري القومي الاجتماعي، ومجلتي «شعر» و«مواقف»، ووصفه نفسه بأنه «صوفي وثني» في كتابه «هوية غير مكتملة» ومعارضته للدين كمؤسسة مفروضة على المجتمع."
  en: "English Wikipedia article on the Syrian poet Adonis (Ali Ahmad Said Esber); used for entity facts only. It gives his birth on 1 January 1930 at the village of al-Qassabin to an Alawite farming family, his education, his imprisonment for membership in the Syrian Social Nationalist Party, the magazines Shi'r and Mawaqif, and his self-description as a 'pagan mystic' in his Identité inachevée together with his opposition to religion as an institution imposed on society."
