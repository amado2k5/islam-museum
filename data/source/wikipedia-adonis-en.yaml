summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشاعر السوري أدونيس ⁦(علي أحمد سعيد إسبر)⁩؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 1 يناير 1930 في قرية القصابين لأسرة فلاحية علوية، وتعليمه وسجنه لعضويته في الحزب السوري القومي الاجتماعي، ومجلتي «شعر» و«مواقف»، ووصفه نفسه بأنه «صوفي وثني» في كتابه «هوية غير مكتملة» ومعارضته للدين كمؤسسة مفروضة على المجتمع."
  en: "English Wikipedia article on the Syrian poet Adonis (Ali Ahmad Said Esber); used for entity facts only. It gives his birth on 1 January 1930 at the village of al-Qassabin to an Alawite farming family, his education, his imprisonment for membership in the Syrian Social Nationalist Party, the magazines Shi'r and Mawaqif, and his self-description as a 'pagan mystic' in his Identité inachevée together with his opposition to religion as an institution imposed on society."
  es: "Artículo de la Wikipedia en inglés sobre el poeta sirio Adonis (Ali Ahmad Said Esber); utilizado únicamente para datos biográficos. Describe su nacimiento el 1 de enero de 1930 en la aldea de al-Qassabin, en el seno de una familia campesina alauita, su educación, su encarcelamiento por pertenecer al Partido Social Nacionalista Sirio, las revistas Shi'r y Mawaqif, y su autodescripción como un \"místico pagano\" en su obra Identité inachevée, junto con su oposición a la religión como institución impuesta a la sociedad."
  fr: "Article de Wikipédia en anglais sur le poète syrien Adonis (Ali Ahmad Said Esber); utilisé uniquement pour les informations biographiques. Il retrace sa naissance le 1er janvier 1930 au village d'al-Qassabin, au sein d'une famille de paysans alaouites, son parcours scolaire, son emprisonnement pour appartenance au Parti nationaliste social syrien, ses publications dans les revues Shi'r et Mawaqif, et sa définition de « mystique païen » dans son ouvrage Identité inachevée, ainsi que son opposition à la religion en tant qu'institution imposée à la société."
