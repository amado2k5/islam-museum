summary:
  ar: مقالة ويكيبيديا العربية عن حسنين محمد مخلوف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في باب الفتوح بالقاهرة في 16 رمضان 1307هـ / 6 مايو 1890 ووفاته في 19 رمضان 1410هـ / 15 أبريل 1990، وأسرته من بني عدي بصعيد مصر، وتعليمه في الأزهر ومدرسة القضاء الشرعي، وقضاءه الشرعي، وولايتيه مفتيًا للديار المصرية (1946–1950 و1952–1954)، ومؤلفاته ومنها «كلمات القرآن تفسير وبيان» و«صفوة البيان لمعاني القرآن». لا تسمّي المقالة مذهبًا فقهيًا له شخصيًا.
  en: Arabic Wikipedia article on Hassanein Muhammad Makhlouf; used for entity facts only. It gives his birth at Bab al-Futuh, Cairo, on 16 Ramadan 1307 AH / 6 May 1890 and his death on 19 Ramadan 1410 AH / 15 April 1990, his family's origin at Bani Adi in Upper Egypt, his education at al-Azhar and the School of Sharia Judiciary, his sharia judgeship, his two terms as Grand Mufti of Egypt (1946–1950 and 1952–1954), and his works including Kalimat al-Qur'an and Safwat al-Bayan. The article names no legal school for him personally.
