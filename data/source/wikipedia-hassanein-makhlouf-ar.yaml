summary:
  ar: مقالة ويكيبيديا العربية عن حسنين محمد مخلوف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في باب الفتوح بالقاهرة في 16 رمضان 1307هـ / 6 مايو 1890 ووفاته في 19 رمضان 1410هـ / 15 أبريل 1990، وأسرته من بني عدي بصعيد مصر، وتعليمه في الأزهر ومدرسة القضاء الشرعي، وقضاءه الشرعي، وولايتيه مفتيًا للديار المصرية ⁦(1946–1950 و1952–1954)⁩، ومؤلفاته ومنها «كلمات القرآن تفسير وبيان» و«صفوة البيان لمعاني القرآن». لا تسمّي المقالة مذهبًا فقهيًا له شخصيًا.
  en: Arabic Wikipedia article on Hassanein Muhammad Makhlouf; used for entity facts only. It gives his birth at Bab al-Futuh, Cairo, on 16 Ramadan 1307 AH / 6 May 1890 and his death on 19 Ramadan 1410 AH / 15 April 1990, his family's origin at Bani Adi in Upper Egypt, his education at al-Azhar and the School of Sharia Judiciary, his sharia judgeship, his two terms as Grand Mufti of Egypt (1946–1950 and 1952–1954), and his works including Kalimat al-Qur'an and Safwat al-Bayan. The article names no legal school for him personally.
  es: "Artículo de Wikipedia en árabe sobre Hassanein Muhammad Makhlouf; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Bab al-Futuh, El Cairo, el 16 de Ramadán de 1307 AH / 6 de mayo de 1890 y su fallecimiento el 19 de Ramadán de 1410 AH / 15 de abril de 1990, el origen de su familia en Bani Adi, en el Alto Egipto, su formación en al-Azhar y la Escuela de Jurisprudencia Islámica, su cargo como juez de la sharia, sus dos mandatos como Gran Muftí de Egipto (1946-1950 y 1952-1954) y sus obras, entre las que destacan Kalimat al-Qur'an y Safwat al-Bayan. El artículo no menciona ninguna escuela jurídica a la que pertenezca personalmente."
  fr: "Article de Wikipédia en arabe consacré à Hassanein Muhammad Makhlouf; utilisé uniquement pour des informations sur l'entité. Il indique sa naissance à Bab al-Futuh, au Caire, le 16 Ramadan 1307 AH / 6 mai 1890 et son décès le 19 Ramadan 1410 AH / 15 avril 1990, l'origine de sa famille à Bani Adi en Haute-Égypte, ses études à Al-Azhar et à l'École de jurisprudence islamique, sa fonction de juge de la charia, ses deux mandats de Grand Mufti d'Égypte (1946-1950 et 1952-1954), ainsi que ses œuvres, notamment Kalimat al-Qur'an et Safwat al-Bayan. L'article ne mentionne aucune école juridique à laquelle il aurait appartenu personnellement."
  ur: "حسنین محمد مخلوف پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 16 رمضان 1307 ہجری / 6 مئی 1890 کو باب الفتوح، قاہرہ میں ان کی پیدائش اور ان کی وفات 19 رمضان 1410 ہجری / 15 اپریل 1990 کو ہوئی، ان کے خاندان کی ابتداء بالائی مصر کے علاقے بنی عدی میں ہوئی، ان کی تعلیم الازہر میں ہوئی، ان کی جامعہ شرعیہ اور جامعہ اسلامیہ کے جج کے طور پر ان کی دو مدت ملازمت مصر کے مفتی ⁦(1946–1950 اور 1952–1954)⁩، اور ان کی تخلیقات بشمول کلمات القرآن اور صفوت البیان۔ مضمون میں ذاتی طور پر اس کے لیے کسی قانونی اسکول کا نام نہیں لیا گیا ہے۔"
  tr: "Hassanein Muhammad Makhlouf hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 16 Ramazan 1307 Hicri / 6 Mayıs 1890'da Kahire'deki Bab al-Futuh'ta ve 19 Ramazan 1410 Hicri / 15 Nisan 1990'da vefat ettiğini, ailesinin Yukarı Mısır'daki Banu Adi'den, eğitimini El-Ezher ve Şeriat Yargı Okulu'nda, Şeriat yargısını, Mısır Müftüsü olarak atanmasını (1946–1950 ve 1952–1954) ve 'Kur'an'ın Sözleri: Tafsir ve Bayan' ile 'Safvat'al-Bayan li Ma'ani al-Qur'an' gibi eserlerini anlatır. Makalede onun kişisel fıkıh okulu adı verilmemektedir."
  id: "Artikel Wikipedia bahasa Arab tentang Hassanein Muhammad Makhlouf; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Bab al-Futuh di Kairo pada 16 Ramadan 1307 H / 6 Mei 1890 dan kematiannya pada 19 Ramadan 1410 H / 15 April 1990, keluarganya dari Banu Adi di Mesir Hulu, pendidikannya di Al-Azhar dan Sekolah Kehakiman Syariah, peradilan Syariahnya, pengangkatannya sebagai Mufti Mesir (1946–1950 dan 1952–1954), serta karya-karyanya termasuk 'Kata-kata Al-Quran: Tafsir dan Bayan' serta 'Safwat al-Bayan li Ma'ani al-Qur'an'. Artikel tersebut tidak menyebutkan sekolah yurisprudensi pribadinya."
