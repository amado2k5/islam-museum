summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم رئيسي؛ تُستخدم لوقائع الكيان فقط. تعطي رئاسته من 2021 حتى وفاته في تحطم مروحية 19 أيار 2024 خلفًا لروحاني، وولادته 14 كانون الأول 1960 في مشهد ودفنه في مرقد الإمام الرضا بها."
  en: "English Wikipedia article on Ebrahim Raisi; used for entity facts only. It gives his presidency from 2021 until his death in a helicopter crash on 19 May 2024, succeeding Hassan Rouhani, his birth on 14 December 1960 in Mashhad, and his burial at the Imam Reza shrine in Mashhad."
  es: "Artículo de la Wikipedia en inglés sobre Ebrahim Raisi; utilizado únicamente para datos sobre la persona. Describe su presidencia desde 2021 hasta su fallecimiento en un accidente de helicóptero el 19 de mayo de 2024, sucediendo a Hassan Rouhani; su fecha de nacimiento, el 14 de diciembre de 1960 en Mashhad; y su entierro en el santuario del Imam Reza en Mashhad."
  fr: "Article de Wikipédia en anglais sur Ebrahim Raisi; utilisé uniquement pour les informations sur l’entité. Il indique sa présidence de 2021 jusqu’à sa mort dans un accident d’hélicoptère le 19 mai 2024, succédant à Hassan Rouhani, sa naissance le 14 décembre 1960 à Mashhad et son inhumation au sanctuaire de l’imam Reza à Mashhad."
  ur: "ابراہیم رئیسی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 2021 سے لے کر 19 مئی 2024 کو ایک ہیلی کاپٹر حادثے میں ان کی موت تک، حسن روحانی کے بعد، مشہد میں 14 دسمبر 1960 کو ان کی پیدائش، اور مشہد میں امام رضا کے مزار پر ان کی تدفین تک ان کی صدارت دیتا ہے۔"
  tr: "İbrahim Reisi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 2021'den 19 Mayıs 2024'teki helikopter kazasında ölümüne kadar başkanlığı, Ruhani'nin yerine geçmesi, 14 Aralık 1960'ta Meşhed'de doğması ve İmam türbesine defnedilmesi Reza Baha olarak kabul edilir."
  id: "Artikel Wikipedia bahasa Inggris tentang Ebrahim Raisi; digunakan hanya untuk fakta entitas. Masa kepresidenannya dari 2021 hingga kematiannya dalam kecelakaan helikopter 19 Mei 2024, menggantikan Rouhani, dan kelahirannya pada 14 Desember 1960 di Mashhad dan dimakamkan di makam Imam, dianggap sebagai Reza Baha."
