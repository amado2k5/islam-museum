summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سليم البشري؛ تُستخدم لوقائع الكيان فقط. تسميه شخصيًا «عالمًا دينيًا سنيًا مصريًا» و«عالمًا مالكيًا بارزًا» كان رئيس علماء المالكية في الأزهر، وتذكر نسبته «المالكي»، وأستاذه إبراهيم البيجوري، وولايتيه في مشيخة الأزهر ⁦(1899–1903 و1909 حتى وفاته)⁩، وتؤرخ وفاته سنة 1916 خلافًا للمقالة العربية التي تعطي ذا الحجة 1335هـ ⁦(أيلول–تشرين الأول 1917)⁩."
  en: "English Wikipedia article on Salim al-Bishri; used for entity facts only. It calls him personally an 'Egyptian Sunni religious scholar' and 'a significant Maliki scholar' who headed the Maliki scholars at al-Azhar, gives his nisba as al-Maliki, names Ibrahim al-Bajuri among his teachers, gives his two terms as Grand Imam of al-Azhar (1899–1903 and 1909 until his death), and dates his death to 1916 — against the Arabic article's Dhu al-Hijja 1335 AH, which falls in September–October 1917."
  es: "Artículo de la Wikipedia en inglés sobre Salim al-Bishri; utilizado únicamente para datos sobre la persona. Lo describe personalmente como un \"erudito religioso sunita egipcio\" y \"un importante erudito malikí\" que dirigió a los eruditos malikíes en al-Azhar, indica que su nisba era al-malikí, menciona a Ibrahim al-Bajuri entre sus maestros, indica sus dos mandatos como Gran Imán de al-Azhar (1899-1903 y 1909 hasta su muerte) y fecha su fallecimiento en 1916, en contraposición a la fecha de Dhu al-Hijja 1335 AH que aparece en el artículo en árabe, que corresponde a septiembre-octubre de 1917."
  fr: "L'article de Wikipédia en anglais sur Salim al-Bishri, utilisé uniquement pour les informations le concernant, le décrit comme un « érudit religieux sunnite égyptien » et un « éminent érudit malikite » ayant dirigé les érudits malikites d'al-Azhar. Il indique son nom de famille (nisba) comme al-Maliki, cite Ibrahim al-Bajuri parmi ses maîtres, mentionne ses deux mandats de grand imam d'al-Azhar (1899-1903 et 1909 jusqu'à sa mort) et date son décès de 1916, contrairement à l'article en arabe qui mentionne Dhu al-Hijja 1335 AH, soit septembre-octobre 1917."
  ur: "سلیم البشری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے ذاتی طور پر ایک 'مصری سنی مذہبی اسکالر' اور 'ایک اہم مالکی عالم' کہتا ہے جس نے الازہر میں مالکی علماء کی سربراہی کی، اپنا نصاب المالکی کے طور پر دیتا ہے، اپنے اساتذہ میں ابراہیم البجوری کا نام لیتا ہے، الازہر کے گرینڈ امام کے طور پر اپنی دو شرائط دیتا ہے ⁦(1899-1903 اور 1909-1903)⁩، عربی تاریخ سے ان کی وفات تک۔ مضمون کی ذی الحجہ 1335 ہجری، جو ستمبر اکتوبر 1917 میں آتی ہے۔"
