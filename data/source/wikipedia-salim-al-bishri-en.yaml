summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سليم البشري؛ تُستخدم لوقائع الكيان فقط. تسميه شخصيًا «عالمًا دينيًا سنيًا مصريًا» و«عالمًا مالكيًا بارزًا» كان رئيس علماء المالكية في الأزهر، وتذكر نسبته «المالكي»، وأستاذه إبراهيم البيجوري، وولايتيه في مشيخة الأزهر (1899–1903 و1909 حتى وفاته)، وتؤرخ وفاته سنة 1916 خلافًا للمقالة العربية التي تعطي ذا الحجة 1335هـ (أيلول–تشرين الأول 1917)."
  en: "English Wikipedia article on Salim al-Bishri; used for entity facts only. It calls him personally an 'Egyptian Sunni religious scholar' and 'a significant Maliki scholar' who headed the Maliki scholars at al-Azhar, gives his nisba as al-Maliki, names Ibrahim al-Bajuri among his teachers, gives his two terms as Grand Imam of al-Azhar (1899–1903 and 1909 until his death), and dates his death to 1916 — against the Arabic article's Dhu al-Hijja 1335 AH, which falls in September–October 1917."
