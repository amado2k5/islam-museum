label: { en: "Gus Iqdam's Dakwah Bil Hikmah through the Sabilu Taubah Assembly — Jurnal Al-Hikmah (2024)" }
summary:
  ar: "مقالة محكّمة في مجلة الحكمة عن دعوة غوس إقدام عبر مجلس سبيل التوبة؛ تصفه بأنه داعية شاب وقائد في مجتمع نهضة العلماء، وتذكر ولادته في 27 سبتمبر 1994 وتأسيسه المجلس سنة 2018."
  en: "Peer-reviewed journal article in Jurnal Al-Hikmah on Gus Iqdam's preaching through the Sabilu Taubah assembly; it describes him as a young preacher and a leader within the Nahdlatul Ulama community, and gives his birth on 27 September 1994 and his founding of the assembly in 2018."
  es: "Artículo revisado por pares en la revista Jurnal Al-Hikmah sobre la predicación de Gus Iqdam a través de la asamblea Sabilu Taubah; lo describe como un joven predicador y líder dentro de la comunidad Nahdlatul Ulama, e indica que nació el 27 de septiembre de 1994 y fundó la asamblea en 2018."
  fr: "Article de revue à comité de lecture dans Jurnal Al-Hikmah sur la prédication de Gus Iqdam à travers l'assemblée Sabilu Taubah; il le décrit comme un jeune prédicateur et un leader au sein de la communauté Nahdlatul Ulama, et indique sa naissance le 27 septembre 1994 et la fondation de son assemblée en 2018."
  ur: "سبیلو توبہ اسمبلی کے ذریعے گس اقدام کی تبلیغ پر جرنل الحکمہ میں ہم مرتبہ نظرثانی شدہ جریدے کا مضمون؛ اس میں اسے ایک نوجوان مبلغ اور نہدل العلماء برادری کے رہنما کے طور پر بیان کیا گیا ہے، اور اس کی پیدائش 27 ستمبر 1994 کو ہوئی اور 2018 میں اس کی اسمبلی کی بنیاد رکھی گئی۔"
  tr: "Al-Hikma dergisinde Gus Iqdam'ın Sabil Al-Tawba Konseyi aracılığıyla yaptığı çağrıyı anlatan hakemli bir makale; onu genç bir vaiz ve Nahdlat Al-Ulama topluluğunda lider olarak tanımlayan, 27 Eylül 1994'teki doğumundan ve 2018'de kurulan konseyden bahsedilen."
  id: "Sebuah artikel yang telah ditinjau sejawat di majalah Al-Hikma tentang panggilan Gus Iqdam melalui Dewan Sabil Al-Tawba; menggambarkannya sebagai pengkhotbah muda dan pemimpin komunitas Nahdlat Al-Ulama, menyebutkan kelahirannya pada 27 September 1994, dan pendirian dewan pada tahun 2018."
