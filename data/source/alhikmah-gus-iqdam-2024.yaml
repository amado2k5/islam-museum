reliability_note: "Peer-reviewed journal article, read on 15 November 2026. It places his assembly in Karanggayam village, Srengat district, Blitar regency, and describes the assembly's openness to marginalised groups — street children, gang members and youth involved in crime. Its description of him as a young preacher and leader within the Nahdlatul Ulama community, and of the assembly as popular among Nahdliyin communities, is a community and milieu description; it does not name a school of law or theology for him, and under this lane's rules a milieu is not an attestation."
