summary:
  ar: "مقالة محكّمة في مجلة الحكمة عن دعوة غوس إقدام عبر مجلس سبيل التوبة؛ تصفه بأنه داعية شاب وقائد في مجتمع نهضة العلماء، وتذكر ولادته في 27 سبتمبر 1994 وتأسيسه المجلس سنة 2018."
  en: "Peer-reviewed journal article in Jurnal Al-Hikmah on Gus Iqdam's preaching through the Sabilu Taubah assembly; it describes him as a young preacher and a leader within the Nahdlatul Ulama community, and gives his birth on 27 September 1994 and his founding of the assembly in 2018."
  es: "Artículo revisado por pares en la revista Jurnal Al-Hikmah sobre la predicación de Gus Iqdam a través de la asamblea Sabilu Taubah; lo describe como un joven predicador y líder dentro de la comunidad Nahdlatul Ulama, e indica que nació el 27 de septiembre de 1994 y fundó la asamblea en 2018."
