summary:
  ar: "مقالة ويكيبيديا الروسية عن فيض الله خوجاييف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 1 يونيو 1896 في بخارى ووفاته رميا بالرصاص في كوموناركا في 15 مارس 1938 بعد الحكم عليه في 13 مارس، ونشأته في أسرة تاجر أوزبكي توفي أبوه سنة 1912 في طريق مكة، ونشاطه الجديدي، ورئاسته لحكومتي بخارى الشعبية وأوزبكستان السوفييتية، وردّ اعتباره سنة 1965. لا يحمل صندوق معلوماتها حقلا للديانة ولا يسمي متنها مذهبا له."
  en: "Russian Wikipedia article on Fayzulla Khodzhayev; used for entity facts only. It gives his birth on 1 June 1896 in Bukhara and his execution by shooting at Kommunarka on 15 March 1938 after sentencing on 13 March, his upbringing in the family of an Uzbek merchant whose father died in 1912 on the way to Mecca, his Jadid activity, his headship of the Bukharan People's and Uzbek Soviet governments, and his rehabilitation in 1965. Its infobox carries no religion field and its text names no school for him."
  es: "Artículo de la Wikipedia rusa sobre Fayzulla Khodzhayev; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 1 de junio de 1896 en Bujará y su ejecución por fusilamiento en Kommunarka el 15 de marzo de 1938 tras ser condenado el 13 de marzo, su crianza en la familia de un comerciante uzbeko cuyo padre falleció en 1912 de camino a La Meca, su actividad en el movimiento Jadid, su liderazgo de los gobiernos del Pueblo de Bujará y del Sóviet uzbeko, y su rehabilitación en 1965. Su ficha informativa no incluye información sobre religión y su texto no menciona ninguna escuela a la que haya asistido."
  fr: "Article Wikipédia russe sur Fayzulla Khodzhayev; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 1er juin 1896 à Boukhara et son exécution par fusillade à Kommunarka le 15 mars 1938 après avoir été condamné le 13 mars, son enfance dans une famille de marchand ouzbek dont le père est décédé en 1912 sur le chemin de La Mecque, son activité au sein du mouvement Jadid, sa direction des gouvernements populaire de Boukhara et soviétique d'Ouzbékistan, et sa réhabilitation en 1965. Son infobox ne comporte pas de champ sur la religion et son texte ne mentionne aucun établissement scolaire."
