summary:
  ar: "مقالة ويكيبيديا الروسية عن فيض الله خوجاييف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 1 يونيو 1896 في بخارى ووفاته رميا بالرصاص في كوموناركا في 15 مارس 1938 بعد الحكم عليه في 13 مارس، ونشأته في أسرة تاجر أوزبكي توفي أبوه سنة 1912 في طريق مكة، ونشاطه الجديدي، ورئاسته لحكومتي بخارى الشعبية وأوزبكستان السوفييتية، وردّ اعتباره سنة 1965. لا يحمل صندوق معلوماتها حقلا للديانة ولا يسمي متنها مذهبا له."
  en: "Russian Wikipedia article on Fayzulla Khodzhayev; used for entity facts only. It gives his birth on 1 June 1896 in Bukhara and his execution by shooting at Kommunarka on 15 March 1938 after sentencing on 13 March, his upbringing in the family of an Uzbek merchant whose father died in 1912 on the way to Mecca, his Jadid activity, his headship of the Bukharan People's and Uzbek Soviet governments, and his rehabilitation in 1965. Its infobox carries no religion field and its text names no school for him."
