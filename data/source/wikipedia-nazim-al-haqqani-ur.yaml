summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد ناظم حقاني ⁦(1922 – 7 مايو 2014)⁩، تصفه بأنه مرجع معروف للسلسلة النقشبندية الصوفية تلقّى القادرية من والده والمولوية من جدّه لأمه، وتؤرخ ميلاده بـ23 أبريل 1922."
  en: "The Urdu Wikipedia article on Muhammad Nazim Haqqani (1922 – 7 May 2014), describing him as a well-known authority of the Naqshbandi Sufi order who received the Qadiri order from his father and the Mawlawi from his maternal grandfather; it dates his birth to 23 April 1922."
  es: "El artículo de Wikipedia en urdu sobre Muhammad Nazim Haqqani (1922 – 7 de mayo de 2014) lo describe como una autoridad reconocida de la orden sufí Naqshbandi, quien recibió la orden Qadiri de su padre y la Mawlawi de su abuelo materno; fecha su nacimiento el 23 de abril de 1922."
  fr: "L'article de Wikipédia en ourdou sur Muhammad Nazim Haqqani (1922 – 7 mai 2014) le décrit comme une autorité bien connue de l'ordre soufi Naqshbandi qui a reçu l'ordre Qadiri de son père et le Mawlawi de son grand-père maternel; il date sa naissance du 23 avril 1922."
  ur: "محمد ناظم حقانی ⁦(1922 - 7 مئی 2014)⁩ پر اردو ویکیپیڈیا کا مضمون، جس میں انہیں نقشبندی صوفی حکم کے ایک معروف اتھارٹی کے طور پر بیان کیا گیا ہے جنہوں نے قادری حکم اپنے والد سے اور مولوی اپنے نانا سے حاصل کیا تھا۔ اس کی تاریخ پیدائش 23 اپریل 1922 ہے۔"
