summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سامي أفندي؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في إسطنبول في 13 مارس 1838، وتعليمه الخط عند أساتذة عصره، وتدريسه في قصر طوب قابي سنوات طويلة، وإعطاءه الطغراء صورتها النهائية، ووفاته في 1 يوليو 1912. صدرها يطبع سنواته خطأً (1858–1912)."
  en: "English Wikipedia article on Sami Efendi; used for entity facts only. It recounts his birth at Istanbul on 13 March 1838, his calligraphy training under the masters of his day, his long teaching at the Topkapi Palace, his giving the tughra its definitive form, and his death on 1 July 1912. Its lead line misprints his years as 1858–1912."
  es: "Artículo de la Wikipedia en inglés sobre Sami Efendi; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Estambul el 13 de marzo de 1838, su formación caligráfica con los maestros de su época, su larga trayectoria docente en el Palacio Topkapi, el hecho de que le diera a la tughra su forma definitiva y su muerte el 1 de julio de 1912. En la introducción se indica erróneamente que sus años fueron 1858-1912."
  fr: "L'article de Wikipédia en anglais consacré à Sami Efendi, utilisé uniquement pour les informations le concernant, relate sa naissance à Istanbul le 13 mars 1838, sa formation en calligraphie auprès des maîtres de son époque, son long enseignement au palais de Topkapi, la mise au point de la forme définitive du tughra et sa mort le 1er juillet 1912. Une erreur s'est glissée dans la première ligne: ses années sont indiquées comme étant 1858-1912."
