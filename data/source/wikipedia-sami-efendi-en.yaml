  ar: "مقالة ويكيبيديا الإنجليزية عن سامي أفندي؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في إسطنبول في 13 مارس 1838، وتعليمه الخط عند أساتذة عصره، وتدريسه في قصر طوب قابي سنوات طويلة، وإعطاءه الطغراء صورتها النهائية، ووفاته في 1 يوليو 1912. صدرها يطبع سنواته خطأً (1858–1912)."
  en: "English Wikipedia article on Sami Efendi; used for entity facts only. It recounts his birth at Istanbul on 13 March 1838, his calligraphy training under the masters of his day, his long teaching at the Topkapi Palace, his giving the tughra its definitive form, and his death on 1 July 1912. Its lead line misprints his years as 1858–1912."
