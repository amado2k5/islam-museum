reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. Short article: its text gives his birth at Istanbul on 13 March 1838 and his death on 1 July 1912, while its lead line carries the misprint (1858–1912), which is not followed. Its teacher list differs in detail from the TDV İslâm Ansiklopedisi entry, which the record treats as the scholarly anchor. It names no school, legal tradition or Sufi order for him."
