summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بختيار ناصر؛ تُستخدم لوقائع الكيان فقط. تفصّل ميلاده في جاكرتا سنة 1967 ودراسته في غونتور والمدينة المنورة وقيادته مركز AQL ودوره في احتجاجات 2016–2017 وما أوردته عن قضية 2019."
  en: "English Wikipedia article on Bachtiar Nasir; used for entity facts only. It details his 1967 Jakarta birth, his schooling at Gontor and in Medina, his leadership of the AQL Islamic Center, his role in the 2016-17 protests, and its report of the 2019 case."
  es: "Artículo de la Wikipedia en inglés sobre Bachtiar Nasir; utilizado únicamente para obtener información sobre la persona. Detalla su nacimiento en Yakarta en 1967, su educación en Gontor y Medina, su liderazgo en el Centro Islámico AQL, su papel en las protestas de 2016-17 y el informe del caso de 2019."
  fr: "Article de Wikipédia en anglais sur Bachtiar Nasir; utilisé uniquement pour les informations relatives à l’entité. Il détaille sa naissance à Jakarta en 1967, sa scolarité à Gontor et à Médine, son rôle à la tête du Centre islamique AQL, son implication dans les manifestations de 2016-2017 et son compte rendu de l’affaire de 2019."
  ur: "بچیار ناصر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی 1967 کی جکارتہ پیدائش، گونٹور اور مدینہ میں اس کی تعلیم، AQL اسلامک سینٹر کی قیادت، 2016-17 کے احتجاج میں ان کے کردار، اور 2019 کے کیس کی اس کی رپورٹ کی تفصیلات ہیں۔"
  tr: "Bakhtiar Nasser hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanıldı. 1967'de Jakarta'da doğdu, Guntur ve Medine'de eğitim aldı, AQL merkezini yönetti ve 2016–2017 protestolarında ve 2019 davasıyla ilgili haberlerde rol aldı."
  id: "Artikel Wikipedia bahasa Inggris tentang Bakhtiar Nasser; digunakan hanya untuk fakta entitas. Ia lahir di Jakarta pada tahun 1967, belajar di Guntur dan Madinah, memimpin pusat AQL, dan berperan dalam protes 2016–2017, serta apa yang dilaporkan tentang kasus 2019."
