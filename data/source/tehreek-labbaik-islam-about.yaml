  en: "Official About page of Tehreek Labbaik Islam, read in full on 5 November 2026. It states that Dr Muhammad Ashraf Asif Jalali is the founder of Tehreek-e-Sirat-e-Mustaqeem (TSM) and chairman of Tehreek-e-Labbaik Ya Rasool Allah (TLY); that he was born on 12 April 1968 in Bhikhi, Mandi Bahauddin; that he is 'affiliated with the Ahle Sunnat Wa Jamaat Barelvi movement'; and that Tehreek Labbaik Islam (TLI) is the political wing of TLY, registered with the Election Commission of Pakistan in 2018, with Jalali as its chairman."
