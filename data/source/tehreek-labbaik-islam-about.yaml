  en: "Tehreek Labbaik Islam official About page"
summary:
  ar: "صفحة التعريف الرسمية بحزب تحريك لبيك إسلام، كما قُرئت في 5 نوفمبر 2026."
  en: "Official About page of Tehreek Labbaik Islam, read in full on 5 November 2026. It states that Dr Muhammad Ashraf Asif Jalali is the founder of Tehreek-e-Sirat-e-Mustaqeem (TSM) and chairman of Tehreek-e-Labbaik Ya Rasool Allah (TLY); that he was born on 12 April 1968 in Bhikhi, Mandi Bahauddin; that he is 'affiliated with the Ahle Sunnat Wa Jamaat Barelvi movement'; and that Tehreek Labbaik Islam (TLI) is the political wing of TLY, registered with the Election Commission of Pakistan in 2018, with Jalali as its chairman."
  es: "Página oficial \"Acerca de\" de Tehreek Labbaik Islam, leída en su totalidad el 5 de noviembre de 2026. En ella se afirma que el Dr. Muhammad Ashraf Asif Jalali es el fundador de Tehreek-e-Sirat-e-Mustaqeem (TSM) y presidente de Tehreek-e-Labbaik Ya Rasool Allah (TLY); que nació el 12 de abril de 1968 en Bhikhi, Mandi Bahauddin; que está \"afiliado al movimiento Ahle Sunnat Wa Jamaat Barelvi\"; y que Tehreek Labbaik Islam (TLI) es el ala política de TLY, registrada ante la Comisión Electoral de Pakistán en 2018, con Jalali como su presidente."
  fr: "Page officielle « À propos » du Tehreek Labbaik Islam, consultée intégralement le 5 novembre 2026. Elle indique que le Dr Muhammad Ashraf Asif Jalali est le fondateur du Tehreek-e-Sirat-e-Mustaqeem (TSM) et le président du Tehreek-e-Labbaik Ya Rasool Allah (TLY); qu’il est né le 12 avril 1968 à Bhikhi, Mandi Bahauddin; qu’il est « affilié au mouvement Ahle Sunnat Wa Jamaat Barelvi »; et que le Tehreek Labbaik Islam (TLI) est la branche politique du TLY, enregistrée auprès de la Commission électorale du Pakistan en 2018, avec Jalali à sa tête."
  ur: "تحریک لبیک اسلام کے بارے میں آفیشل صفحہ، 5 نومبر 2026 کو مکمل پڑھیں۔ اس میں کہا گیا ہے کہ ڈاکٹر محمد اشرف آصف جلالی تحریک سیرت مصطفی (TSM) کے بانی اور تحریک لبیک یا رسول اللہ (TLY) کے چیئرمین ہیں؛ کہ وہ 12 اپریل 1968 کو بھکھی، منڈی بہاؤالدین میں پیدا ہوئے۔ کہ وہ 'اہل سنت و جماعت بریلوی تحریک سے وابستہ ہے'؛ اور یہ کہ تحریک لبیک اسلام (TLI) TLY کا سیاسی ونگ ہے، جو 2018 میں الیکشن کمیشن آف پاکستان میں رجسٹرڈ ہوا، جس کے چیئرمین جلالی تھے۔"
