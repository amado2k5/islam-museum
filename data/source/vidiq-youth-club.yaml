  ar: "صفحة إحصاءات vidIQ لقناة يوث كلوب على يوتيوب (@youthclubpk)؛ 1.71 مليون مشترك عند تحديثها في 5 نوفمبر 2026، وأعلى مقاطعها مشاهدة حلقات سلسلة «دل كي باتين» وفيلم قصير للمنظمة."
  en: "vidIQ statistics page for the Youth Club YouTube channel (@youthclubpk): 1,710,000 subscribers at its 5 November 2026 update; its most-viewed videos are episodes of the Dil Ki Batein series and an organisation short film."
