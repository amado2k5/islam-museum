summary:
  ar: "موسوعة مصطلحات دواوين الدولة والعلوم ألفها كاتب نيسابوري في أواخر القرن الرابع الهجري؛ باب الديوان يصف الصك وكيفية جمعه لأسماء المستحقين وأرزاقهم وتوقيع السلطان بإجازتها."
  en: "A Nishapuri secretary's late-tenth-century encyclopedia of chancery and scholarly terms; its chapter on the diwan describes the sakk gathering the names and stipends of those entitled, with the ruler's signature authorising payment."
  ur: "نیشاپور کے کاتب کی دسویں صدی کی دفتری اور علمی اصطلاحات کی دائرۃ المعارف؛ دیوان کے باب میں صک کی وضاحت: مستحقین کے نام اور وظیفے جمع کر کے حکمران کے دستخط سے اجازت۔"
  es: "Enciclopedia de términos cancilleros y académicos de finales del siglo X, escrita por un secretario de Nishapur; su capítulo sobre el diwan describe cómo el sakk recopilaba los nombres y estipendios de los beneficiarios, y cómo la firma del gobernante autorizaba el pago."
