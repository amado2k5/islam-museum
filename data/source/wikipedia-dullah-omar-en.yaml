summary:
  ar: مقالة ويكيبيديا الإنجليزية عن دولا عمر؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل عبد الله محمد عمر، وميلاده في 26 مايو 1934 في أوبزرفاتوري بكيب تاون لأبوين مهاجرين من غوجرات، ودرجة الحقوق من جامعة كيب تاون سنة 1957، ودفاعه عن أعضاء مؤتمر عموم أفريقيا والمؤتمر الوطني الأفريقي، ووزارته للعدل منذ 1994 ولجنة الحقيقة والمصالحة، ووزارته للنقل منذ 1999، ودفنه وفق الشعائر الإسلامية يوم وفاته، 13 مارس 2004.
  en: English Wikipedia article on Dullah Omar; used for entity facts only. It gives his full name, Abdullah Mohamed Omar, his birth on 26 May 1934 in Observatory, Cape Town, to immigrant parents from Gujarat, his University of Cape Town law degree of 1957, his defence of PAC and ANC members, his justice ministry from 1994 and the Truth and Reconciliation Commission, his transport ministry from 1999, and his burial in accordance with Muslim rites on the day of his death, 13 March 2004.
