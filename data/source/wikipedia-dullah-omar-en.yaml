summary:
  ar: مقالة ويكيبيديا الإنجليزية عن دولا عمر؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل عبد الله محمد عمر، وميلاده في 26 مايو 1934 في أوبزرفاتوري بكيب تاون لأبوين مهاجرين من غوجرات، ودرجة الحقوق من جامعة كيب تاون سنة 1957، ودفاعه عن أعضاء مؤتمر عموم أفريقيا والمؤتمر الوطني الأفريقي، ووزارته للعدل منذ 1994 ولجنة الحقيقة والمصالحة، ووزارته للنقل منذ 1999، ودفنه وفق الشعائر الإسلامية يوم وفاته، 13 مارس 2004.
  en: English Wikipedia article on Dullah Omar; used for entity facts only. It gives his full name, Abdullah Mohamed Omar, his birth on 26 May 1934 in Observatory, Cape Town, to immigrant parents from Gujarat, his University of Cape Town law degree of 1957, his defence of PAC and ANC members, his justice ministry from 1994 and the Truth and Reconciliation Commission, his transport ministry from 1999, and his burial in accordance with Muslim rites on the day of his death, 13 March 2004.
  es: "Artículo de la Wikipedia en inglés sobre Dullah Omar; utilizado únicamente para datos sobre la persona. En él se indica su nombre completo, Abdullah Mohamed Omar, su nacimiento el 26 de mayo de 1934 en Observatory, Ciudad del Cabo, de padres inmigrantes de Gujarat, su título de abogado por la Universidad de Ciudad del Cabo en 1957, su defensa de miembros del PAC y del ANC, su ministerio de justicia desde 1994 y la Comisión de la Verdad y la Reconciliación, su ministerio de transporte desde 1999 y su entierro según los ritos musulmanes el día de su muerte, el 13 de marzo de 2004."
  fr: "Article de Wikipédia en anglais sur Dullah Omar; utilisé uniquement à des fins d’information sur l’entité. Il indique son nom complet, Abdullah Mohamed Omar, sa naissance le 26 mai 1934 à Observatory, au Cap, de parents immigrés du Gujarat, son diplôme de droit de l’Université du Cap en 1957, sa défense de membres du PAC et de l’ANC, son ministère de la Justice à partir de 1994 et sa participation à la Commission Vérité et Réconciliation, son ministère des Transports à partir de 1999, et ses funérailles selon le rite musulman le jour de son décès, le 13 mars 2004."
