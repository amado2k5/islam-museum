  ar: "الجزء الأول من طبعة بولاق ١٢٨٢هـ/١٨٦٥م لكتاب «تاج اللغة وصحاح العربية» للجوهري، نسخة مصوّرة على أرشيف الإنترنت، مصدر النص المقروء في تجربة المعاجم."
  en: "Volume 1 of the 1282 AH / 1865 Bulaq printing of al-Jawhari's Taj al-lugha wa-sihah al-arabiyya, a scan held by the Internet Archive; the source of the text in the Dictionaries Browser pilot."
