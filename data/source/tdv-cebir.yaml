summary:
  ar: "مدخل «الجبر» في موسوعة TDV الإسلامية التركية: معنى الجبر والمقابلة والرد والإكمال، والمعرفة الجبرية عند المصريين والبابليين والهنود واليونان، وكتاب الخوارزمي والجدل في أوليته، ثم ابن ترك وأبو كامل والكرجي والسموأل وعمر الخيام وشرف الدين الطوسي والكاشي."
  en: "The TDV İslâm Ansiklopedisi entry 'Cebir': the meaning of al-jabr, al-muqabala, radd and ikmal; algebraic knowledge in Egypt, Babylon, India and Greece; al-Khwarizmi's book and the debate over its priority; then Ibn Turk, Abu Kamil, al-Karaji, al-Samaw'al, Umar al-Khayyam, Sharaf al-Din al-Tusi and al-Kashi."
  ur: "ٹی ڈی وی اسلامی انسائیکلوپیڈیا کا مدخل «جبر»: الجبر، المقابلہ، رد اور اکمال کا مطلب؛ مصر، بابل، ہند اور یونان میں جبری علم؛ خوارزمی کی کتاب اور اس کی اولیت پر بحث؛ پھر ابن ترک، ابو کامل، کرجی، سموأل، عمر خیام، شرف الدین طوسی اور کاشی۔"
