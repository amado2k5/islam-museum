summary:
  ar: "مقالة ويكيبيديا الفارسية عن برديس ثابتي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادتها في 4 دي 1354، وتفصّل مسيرتها في هارفارد وجوائزها وفرقتها الموسيقية، وتكرر أن والدها كان من عائلة بهائية دون أن ينضم رسميًا."
  en: "Persian Wikipedia article on Pardis Sabeti; used for entity facts only. It gives her birth as 4 Dey 1354, details her Harvard career, awards and rock band, and repeats that her father was from a Baháʼí family without ever officially joining."
  es: "Artículo de Wikipedia en persa sobre Pardis Sabeti; utilizado únicamente para datos sobre la persona. Indica que nació el 4 de diciembre de 1354, detalla su trayectoria en Harvard, sus premios y su banda de rock, y reitera que su padre provenía de una familia baháʼí sin haberse unido oficialmente a ella."
  fr: "Article Wikipédia en persan sur Pardis Sabeti; utilisé uniquement pour les informations sur l’entité. Il indique sa date de naissance: le 4 décembre 1354, détaille ses études à Harvard, ses récompenses et son groupe de rock, et précise que son père était issu d’une famille bahá’íe sans jamais y avoir adhéré officiellement."
  ur: "پردیس سبتی پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش 4 Dey 1354 کے طور پر ہوئی، اس کے ہارورڈ کیریئر، ایوارڈز اور راک بینڈ کی تفصیلات بیان کی گئی ہیں، اور اس بات کو دہرایا گیا ہے کہ اس کے والد باہائی خاندان سے تعلق رکھتے تھے اور کبھی بھی سرکاری طور پر شامل نہیں ہوئے۔"
  tr: "Pardis Thabeti hakkında Farsça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 4 Dey 1354'te doğum yapar, Harvard'daki kariyerini, ödüllerini ve müzik grubunu detaylandırır ve babasının resmi olarak katılmadan Bahâî bir aileden geldiğini yinelemektedir."
  id: "Artikel Wikipedia Persia tentang Pardis Thabeti hanya digunakan untuk fakta entitas tersebut. Ia melahirkan pada 4 Desember 1354, merinci kariernya di Harvard, penghargaan, dan band musiknya, serta menegaskan bahwa ayahnya berasal dari keluarga Bahá'í tanpa resmi bergabung."
