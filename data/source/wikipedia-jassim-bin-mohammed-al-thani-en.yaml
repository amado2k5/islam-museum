reliability_note: "English Wikipedia, revision 1377748056 (wikitext consulted in full). It gives the birth as circa 1825 in both text and infobox, with Fuwayrit as birthplace in the infobox and upbringing there in the text — against the Urdu infobox's and Wikidata's Doha — and a death on 17 July 1913 at Lusail with burial in Lusail Cemetery, against the Arabic infobox's Doha death place. Its infobox succession note has his brother Ahmed running the country 1898–1905 after Jassim's withdrawal, where the Urdu infobox names a son, Muhammad bin Jassim, as successor. Its infobox religion field reads the generic 'Islam'. The children section is flagged unreferenced in this revision; the count of nineteen sons is taken as the articles' common statement. Consulted on 26 October 2026."
