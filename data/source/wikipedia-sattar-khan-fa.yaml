summary:
  ar: "مقالة ويكيبيديا الفارسية عن ستارخان؛ تُستخدم لوقائع الكيان فقط. تذكر في متنها أنه كان في زمرة لوطيي تبريز الشيخية، وأن لوطيي المدينة كانوا على مذهبين: الشيخية والشرعية، وتصف اعتقاداته الدينية ووطنيته ضمن ما جعله سردارًا وطنيًا، وتروي سيرته من البزازة واللصوصية المبكرة إلى قيادة مجاهدي تبريز."
  en: "Persian Wikipedia article on Sattar Khan; used for entity facts only. Its text places him among the Sheikhi lutis of Tabriz, noting that the city's lutis followed two currents, the Sheikhiyya and the Shar'iyya, describes his religious convictions among the qualities that made him the national commander, and recounts his life from cloth-selling and early brigandage to command of the Tabriz mojahedin."
  es: "Artículo de Wikipedia en persa sobre Sattar Khan; utilizado únicamente para datos sobre la figura. Su texto lo sitúa entre los lutis jeques de Tabriz, señalando que los lutis de la ciudad seguían dos corrientes, la jequesa y la shar'iyya, describe sus convicciones religiosas entre las cualidades que lo convirtieron en comandante nacional y relata su vida desde la venta de telas y el bandidaje inicial hasta el mando de los muyahidines de Tabriz."
  fr: "Article Wikipédia en persan sur Sattar Khan; utilisé uniquement pour des informations factuelles. Son texte le situe parmi les lutis cheikhi de Tabriz, précisant que les lutis de la ville suivaient deux courants, le cheikhiyya et le shariyya, décrit ses convictions religieuses parmi les qualités qui ont fait de lui le commandant national, et retrace sa vie, de vendeur de tissus et de brigandage à ses débuts jusqu'au commandement des moudjahidines de Tabriz."
  ur: "ستار خان پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے متن میں اسے تبریز کے شیخی لوطیوں میں شامل کیا گیا ہے، اس بات کا ذکر کرتے ہوئے کہ شہر کے لوٹیوں نے دو دھاروں، شیخیہ اور شریعت کی پیروی کی، ان کے مذہبی عقائد کو ان خصوصیات میں سے بیان کرتا ہے جنہوں نے اسے قومی کمانڈر بنا دیا، اور اس کی زندگی کپڑا بیچنے اور ابتدائی بریگینڈیج سے لے کر تبریز کے مجاہدین کی کمان تک بیان کرتا ہے۔"
