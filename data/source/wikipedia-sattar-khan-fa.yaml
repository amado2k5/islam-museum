  ar: "مقالة ويكيبيديا الفارسية عن ستارخان؛ تُستخدم لوقائع الكيان فقط. تذكر في متنها أنه كان في زمرة لوطيي تبريز الشيخية، وأن لوطيي المدينة كانوا على مذهبين: الشيخية والشرعية، وتصف اعتقاداته الدينية ووطنيته ضمن ما جعله سردارًا وطنيًا، وتروي سيرته من البزازة واللصوصية المبكرة إلى قيادة مجاهدي تبريز."
  en: "Persian Wikipedia article on Sattar Khan; used for entity facts only. Its text places him among the Sheikhi lutis of Tabriz, noting that the city's lutis followed two currents, the Sheikhiyya and the Shar'iyya, describes his religious convictions among the qualities that made him the national commander, and recounts his life from cloth-selling and early brigandage to command of the Tabriz mojahedin."
