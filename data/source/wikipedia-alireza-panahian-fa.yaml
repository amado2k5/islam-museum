reliability_note: "Read in full on 7 November 2026; the reading tools available in this run did not expose a revision id, so none is recorded. Used for the opening's independently authored prose attestation — «روحانی شیعه و سخنران مذهبی ایرانی است» ('he is an Iranian Shia cleric and religious speaker') — for the exact birth date and place (28 Farvardin 1344 in Tehran, i.e. 17 April 1965, stated in the infobox and repeated in the Life section), for his seminary education at Qom to the kharij level and his university degree in psychology, for his teachers (Ali Khamenei, Hossein Wahid Khorasani and Javadi Amoli), for his cultural offices (board of trustees of the University of Arts; head of the Supreme Leader's think tank for universities), for his founding of the Dar al-Hikmah seminary in Tehran in 1392 SH (2013) and for the list of his books. The article also carries a sourced section on the 2020 reporting about his property, which this record notes only as press controversy."
