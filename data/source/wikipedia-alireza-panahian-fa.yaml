summary:
  ar: "مقالة ويكيبيديا الفارسية عن علي رضا بناهيان: تصفه في مطلعها بأنه «روحاني شيعه وسخنران مذهبي إيراني»، وتذكر مولده في طهران في 28 فروردين 1344، ودراسته في حوزة قم حتى درس الخارج وشهادته الجامعية في علم النفس، وتأسيسه مدرسة دار الحكمة العلمية في طهران سنة 1392."
  en: "The Persian Wikipedia article on Alireza Panahian: its opening describes him as an Iranian Shia cleric and religious speaker, gives his birth in Tehran on 28 Farvardin 1344, his Qom seminary studies to the kharij level and his university studies in psychology, and his founding of the Dar al-Hikmah seminary in Tehran in 1392 SH."
