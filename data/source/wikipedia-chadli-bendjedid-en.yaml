reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by its revision id with the returned id asserted equal. Its infobox names his predecessor as president as Rabah Bitat, expressly marked (Interim), before his term of 9 February 1979 to 11 January 1992 — so no direct succession from Boumédiène is attested. Its text states that he died of cancer at a military hospital in Algiers on 6 October 2012 and was buried at El Alia Cemetery. It carries no religion field and names no school for him. No Urdu Wikipedia article on him exists (searched under several spellings on 27 October 2026)."
