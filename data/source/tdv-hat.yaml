summary:
  ar: "مدخل «HAT» ⁦(الخط)⁩ في موسوعة TDV الإسلامية التركية بقلم م. أوغور درمان ⁦(المجلد 16، إسطنبول 1997، ص 427–437)⁩. يتناول تاريخ الخط العربي وأنواعه الستة الكبرى وتطور أساليبه، وأسماء الخطاطين في كل عصر، وقواعد القلم والمداد والنقطة، وأنواع الآثار المكتوبة من المصاحف والقطع والمرقّعات إلى الكتابات المعمارية والوثائق الرسمية."
  en: "The TDV İslâm Ansiklopedisi entry 'HAT' (calligraphy) by M. Uğur Derman (vol. 16, Istanbul 1997, pp. 427–437). It covers the history of the Arabic script and its six principal styles, the calligraphers of each period, the rules of pen, ink and the dot unit, and the kinds of written work from manuscripts and albums to architectural inscriptions and official documents."
  es: "La entrada «HAT» (caligrafía) de M. Uğur Derman en la enciclopedia TDV İslâm Ansiklopedisi (vol. 16, Estambul, 1997, págs. 427-437) abarca la historia de la escritura árabe y sus seis estilos principales, los calígrafos de cada época, las reglas de la pluma, la tinta y la unidad de puntos, y los tipos de trabajos escritos, desde manuscritos y álbumes hasta inscripciones arquitectónicas y documentos oficiales."
  fr: "L’article « HAT » (calligraphie) de M. Uğur Derman dans la TDV İslâm Ansiklopedisi (vol. 16, Istanbul, 1997, p. 427-437) traite de l’histoire de l’écriture arabe et de ses six principaux styles, des calligraphes de chaque période, des règles relatives à la plume, à l’encre et à l’unité de point, ainsi que des différents types d’écrits, des manuscrits et albums aux inscriptions architecturales et documents officiels."
  ur: "TDV İslâm Ansiklopedisi اندراج 'HAT' ⁦(خطاطی)⁩ از M. Uğur Derman ⁦(جلد 16، استنبول 1997، صفحہ 427–437)⁩۔ اس میں عربی رسم الخط کی تاریخ اور اس کے چھ بنیادی اسلوب، ہر دور کے خطاط، قلم، سیاہی اور ڈاٹ یونٹ کے قواعد، اور مخطوطات اور البمز سے لے کر تعمیراتی نوشتہ جات اور سرکاری دستاویزات تک تحریری کام کی اقسام کا احاطہ کیا گیا ہے۔"
  tr: "M. Uğur Derman tarafından yazılan Türk İslami TDV Ansiklopedisi'nde \"HAT\" (hat sanatı) maddesi (Cilt 16, İstanbul 1997, ss. 427–437). Arap hat sanatının tarihi ve altı ana türü, stillerinin gelişimi, her dönemdeki hattatların isimleri, kalem, mürekkep ve nokta kuralları ile Kur'an, kvat, yamalı bohça ile mimari yazılar ve resmi belgeler gibi yazılı eserlerin türlerini kapsar."
  id: "Entri tentang \"HAT\" (kaligrafi) dalam Ensiklopedia TDV Islam Turki oleh M. Ugur Derman (Vol. 16, Istanbul 1997, hlm. 427–437). Buku ini membahas sejarah kaligrafi Arab dan enam jenis utamanya, perkembangan gaya-gayanya, nama-nama kaligrafer di setiap era, aturan pena, tinta, dan titik, serta jenis karya tertulis mulai dari Al-Qur'an, quat, dan patchwork hingga tulisan arsitektur dan dokumen resmi."
