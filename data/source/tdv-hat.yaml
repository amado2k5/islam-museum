reliability_note: "Read in full on 1 November 2026 in the web edition (the article text; the bibliography at its end names works this record did not read). Facts are rewritten in the museum's own words. The web edition gives the printed range of the whole entry (427–437) and no finer page anchor, so citations use that range. Its Persian and Maghribi material is brief and is cited as the entry gives it."
