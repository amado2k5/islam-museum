summary:
  ar: "مدخل «HAT» (الخط) في موسوعة TDV الإسلامية التركية بقلم م. أوغور درمان (المجلد 16، إسطنبول 1997، ص 427–437). يتناول تاريخ الخط العربي وأنواعه الستة الكبرى وتطور أساليبه، وأسماء الخطاطين في كل عصر، وقواعد القلم والمداد والنقطة، وأنواع الآثار المكتوبة من المصاحف والقطع والمرقّعات إلى الكتابات المعمارية والوثائق الرسمية."
  en: "The TDV İslâm Ansiklopedisi entry 'HAT' (calligraphy) by M. Uğur Derman (vol. 16, Istanbul 1997, pp. 427–437). It covers the history of the Arabic script and its six principal styles, the calligraphers of each period, the rules of pen, ink and the dot unit, and the kinds of written work from manuscripts and albums to architectural inscriptions and official documents."
