  ar: "مقالة ويكيبيديا العربية عن عثمان سونكو؛ تُستخدم لوقائع الكيان فقط. تروي رئاسته الوزراء السادسة عشرة للسنغال (2024–2026) ورئاسته الحالية للبرلمان وقيادته حزب باستيف، وتودعه في تصنيف «مسلمون سنغاليون» دون نص عن دينه."
  en: "Arabic Wikipedia article on Ousmane Sonko; used for entity facts only. It recounts his sixteenth premiership of Senegal (2024–2026), his current presidency of the National Assembly and his leadership of PASTEF, and files him under Senegalese Muslims, with no text on his religion."
  es: "Artículo en árabe de la Wikipedia sobre Ousmane Sonko; utilizado únicamente para obtener información sobre la persona. Relata su decimosexto mandato como primer ministro de Senegal (2024-2026), su actual presidencia de la Asamblea Nacional y su liderazgo de PASTEF, y lo clasifica dentro de la categoría de musulmanes senegaleses, sin mencionar su religión."
  fr: "Article de Wikipédia en arabe sur Ousmane Sonko; utilisé uniquement à des fins d’information sur l’entité. Il relate son seizième mandat de Premier ministre du Sénégal (2024-2026), sa présidence actuelle de l’Assemblée nationale et sa direction du PASTEF, et le classe parmi les musulmans sénégalais, sans aucune mention de sa religion."
