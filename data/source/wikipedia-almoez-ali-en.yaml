reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id with the returned revision asserted equal. It gives his full name as Almoez Ali Zainalabedeen Mohamed Abdulla, born 19 August 1996 in Sudan, moved to Qatar as a child; LASK (2015), Cultural Leonesa (2016, the first Qatari to score in a Spanish league), Lekhwiya (2016), renamed Al-Duhail, which he now captains; nine goals at the 2019 Asian Cup, a single-edition record, and the tournament's best player; the only player to have scored at the Asian Cup, the Copa América and the CONCACAF Gold Cup; and Qatar's all-time scoring record, taken from Mansour Muftah on 16 November 2023. It also records that the AFC dismissed the UAE's 2019 eligibility protest against him and that the Court of Arbitration for Sport settled the case in Qatar's favour in August 2020. It makes no statement of his religion in its text, and none of its categories is a religion category."
