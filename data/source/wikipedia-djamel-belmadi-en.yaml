summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جمال بلماضي؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته لاعب وسط مع باريس سان جيرمان ومرسيليا ومانشستر سيتي وعشرين مباراة دولية مع الجزائر، ثم مدربًا للخويا وقطر والجزائر — بطل كأس أمم أفريقيا 2019 — وعودته إلى الدحيل سنة 2025."
  en: "English Wikipedia article on Djamel Belmadi; used for entity facts only. It recounts his career as a midfielder with Paris Saint-Germain, Marseille and Manchester City and twenty Algeria caps, then as manager of Lekhwiya, Qatar and Algeria — winner of the 2019 Africa Cup of Nations — and his return to Al-Duhail in 2025."
  es: "Artículo de la Wikipedia en inglés sobre Djamel Belmadi; utilizado únicamente para obtener información sobre la persona. Narra su trayectoria como centrocampista en el Paris Saint-Germain, el Marsella y el Manchester City, con veinte partidos internacionales con Argelia, y posteriormente como entrenador del Lekhwiya, Qatar y Argelia —ganador de la Copa Africana de Naciones 2019— y su regreso al Al-Duhail en 2025."
  fr: "Article de Wikipédia en anglais sur Djamel Belmadi; utilisé uniquement à des fins d’information sur l’entité. Il retrace sa carrière de milieu de terrain au Paris Saint-Germain, à Marseille et à Manchester City, ses vingt sélections en équipe nationale algérienne, puis son passage comme entraîneur de Lekhwiya, du Qatar et de l’Algérie — vainqueur de la Coupe d’Afrique des Nations 2019 — et son retour à Al-Duhail en 2025."
  ur: "دجامل بیلمادی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں پیرس سینٹ جرمین، مارسیلی اور مانچسٹر سٹی اور بیس الجیریا کیپس کے ساتھ ایک مڈفیلڈر کے طور پر، پھر لیکھویہ، قطر اور الجزائر کے مینیجر کے طور پر - 2019 کے افریقہ کپ آف نیشنز کے فاتح - اور 2025 میں الدوہیل میں ان کی واپسی کا ذکر ہے۔"
  tr: "Djamel Bellmadi hakkında İngilizce Wikipedia makalesi; sadece varlığın gerçekleri için kullanılmıştır. Kariyeri, Paris Saint-Germain, Marsilya ve Manchester City takımlarında orta saha oyunculuğu, Cezayir ile yirmi uluslararası maç, ardından 2019 Afrika Uluslar Kupası şampiyonu Al-Lekhwiya, Katar ve Cezayir'de antrenörlük yaptığı ve 2025'te Al-Duhail'e dönüşünü anlatıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Djamel Belmadi; digunakan hanya untuk fakta entitas. Kariernya menceritakan kariernya sebagai gelandang dengan Paris Saint-Germain, Marseille, dan Manchester City, dua puluh pertandingan internasional melawan Aljazair, kemudian sebagai pelatih Al-Lekhwiya, Qatar, dan Aljazair — juara Piala Afrika 2019 — serta kembalinya ke Al-Duhail pada 2025."
