reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 26 October 2026, with the full text searched for any religion statement; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. The article text gives Belmadi as born on 25 March 1976 in Champigny-sur-Marne, France; infoboxes in some editions, drawn from Wikidata, give 27 March 1976 instead — the article-text date is the one recorded, and the variant is disclosed in the person record. It recounts his playing career (Paris Saint-Germain, Marseille, a loan at Manchester City, clubs in Qatar, Southampton, Valenciennes; 20 Algeria caps) and his management (Lekhwiya, Qatar B and Qatar, Al-Duhail, Algeria from August 2018 to January 2024 with the 2019 Africa Cup of Nations title, and a return to Al-Duhail in June 2025). The word Muslim does not occur in the article and it makes no statement of his religion."
