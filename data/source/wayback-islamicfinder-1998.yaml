reliability_note: "Archived copies of the site's own pages, read in Chrome on 6 November 2026 (the capture index through the CDX endpoint, then the pages). The earliest capture is cited as 'earliest archived capture', not as a launch date. The 1999 home page offers searches for Islamic centres and mosques by US zip code and state with local prayer times; the 2001 About page names Wasat.com Inc. and says the site then covered the US and Canada."
