summary:
  ar: "لقطات أرشيف الإنترنت لموقع islamicfinder.org: أقدم لقطة في 3 ديسمبر 1998، ولقطة أكتوبر 1999 للصفحة الرئيسة («Islamic.Finder: Finding Islamic Places and Prayer times»)، وصفحة «من نحن» في لقطة 12 مايو 2001 التي تذكر أن الموقع تديره مؤسسة Wasat.com غير الربحية."
  en: "Internet Archive captures of islamicfinder.org: the earliest capture of 3 December 1998, the home page of October 1999 ('Islamic.Finder: Finding Islamic Places and Prayer times'), and the 'About Us' page captured on 12 May 2001, which says the site is maintained by the non-profit Wasat.com."
  ur: "islamicfinder.org کی انٹرنیٹ آرکائیو تصاویر: سب سے پرانی 3 دسمبر 1998 کی، اکتوبر 1999 کا مرکزی صفحہ، اور 12 مئی 2001 کا «ہمارے بارے میں» صفحہ جس کے مطابق سائٹ غیر منافع بخش ادارہ Wasat.com چلاتا ہے۔"
  es: "Capturas de Internet Archive de islamicfinder.org: la captura más antigua del 3 de diciembre de 1998, la página de inicio de octubre de 1999 ('Islamic.Finder: Encontrar lugares islámicos y horarios de oración'), y la página 'Acerca de nosotros' capturada el 12 de mayo de 2001, que dice que el sitio es mantenido por la organización sin fines de lucro Wasat.com."
  fr: "Captures d'Internet Archive du site islamicfinder.org: la plus ancienne capture date du 3 décembre 1998, la page d'accueil d'octobre 1999 (« Islamic.Finder: Trouver des lieux islamiques et les heures de prière »), et la page « À propos de nous » capturée le 12 mai 2001, qui indique que le site est géré par l'association à but non lucratif Wasat.com."
  tr: "İnternet arşiv islamicfinder.org anlık görüntüleri: 3 Aralık 1998'deki en eski fotoğraf, ana sayfanın Ekim 1999 tarihli anlık görüntüsü («Islamic.Finder: İslami Yerlerin ve Namaz Zamanlarının Bulunması») ve sitenin kar amacı gütmeyen Wasat.com Foundation tarafından işletildiğini belirten 12 Mayıs 2001 tarihli \"Biz Kimiz\" sayfası."
  id: "Snapshot arsip internet islamicfinder.org: snapshot tertua pada 3 Desember 1998, snapshot Oktober 1999 dari halaman utama («Islamic.Finder: Finding Islamic Places and Prayer times»), dan halaman \"Who Are We\" pada snapshot 12 Mei 2001 yang menyebutkan situs ini dijalankan oleh organisasi nirlaba Wasat.com Foundation."
