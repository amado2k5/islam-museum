summary:
  ar: "تقرير هير نيوز بتاريخ 4 أغسطس 2024: القبض على إسلام بحيري فجرا لتنفيذ ستة أحكام غيابية في قضايا شيكات من دون رصيد، ثم تقديمه معارضات وإخلاء سبيله، وإقامته في فيلا بكمبوند بيفرلي هيلز وفي شقة بالتجمع الخامس."
  en: "A her-news report of 4 August 2024: Behery was arrested at dawn to execute six in-absentia judgments in bounced-cheque cases, then filed oppositions and was released; the reporting places him at a villa in the Beverly Hills compound and a flat in the Fifth Settlement, New Cairo."
  es: "Según un reportaje de Her-News del 4 de agosto de 2024: Behery fue arrestado al amanecer para ejecutar seis sentencias en ausencia en casos de cheques sin fondos, luego presentó objeciones y fue puesto en libertad; el reportaje lo sitúa en una villa en el complejo de Beverly Hills y en un apartamento en el Quinto Asentamiento, en Nuevo Cairo."
  fr: "Un article de her-news du 4 août 2024: Behery a été arrêté à l’aube pour exécuter six jugements par contumace dans des affaires de chèques sans provision, puis a déposé des oppositions et a été libéré; l’article le situe dans une villa du complexe de Beverly Hills et un appartement du Cinquième Règlement, au Nouveau Caire."
  ur: "4 اگست 2024 کی ایک خبر کی رپورٹ: بیہری کو باؤنسڈ چیک کیسز میں چھ غیر حاضری کے فیصلوں پر عملدرآمد کرنے کے لیے صبح کے وقت گرفتار کیا گیا، پھر مخالفت کی گئی اور اسے رہا کر دیا گیا۔ رپورٹنگ اسے بیورلی ہلز کے کمپاؤنڈ کے ایک ولا میں اور پانچویں سیٹلمنٹ، نیو قاہرہ میں ایک فلیٹ میں رکھتی ہے۔"
  tr: "Herr News 4 Ağustos 2024 tarihli rapor: Islam Behiri, geri çevrilmiş çeklerle ilgili davalarda altı temerrüt kararı yerine getirmek, ardından itirazlar sunup serbest bırakılması ve Beverly Hills yerleşkesindeki bir villada ve Beşinci Yerleşim'deki bir dairede kaldığı için şafakta tutuklandı."
  id: "Laporan Herr News tertanggal 4 Agustus 2024: Islam Behiri ditangkap saat fajar karena melaksanakan enam putusan gagal bayar dalam kasus yang melibatkan cek yang dibatalkan, kemudian mengajukan keberatan dan dibebaskan, serta tinggal di sebuah vila di kompleks Beverly Hills dan di sebuah apartemen di Penyelesaian Kelima."
