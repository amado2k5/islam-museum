summary:
  ar: "مقالة ويكيبيديا العربية عن حسن البلقية؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 15 يوليو 1946 وحكمه سلطانا لبروناي منذ سنة 1967 ورئاسته للوزراء منذ الاستقلال سنة 1984، وأنه أكبر أبناء عمر علي سيف الدين الثالث والسلطان التاسع والعشرون."
  en: "Arabic Wikipedia article on Hassanal Bolkiah; used for entity facts only. It confirms his birth on 15 July 1946, his reign as Sultan of Brunei since 1967 and his premiership since independence in 1984, and identifies him as the eldest son of Omar Ali Saifuddien III and the twenty-ninth sultan."
  es: "Artículo de Wikipedia en árabe sobre Hassanal Bolkiah; utilizado únicamente para datos sobre la persona. Confirma su nacimiento el 15 de julio de 1946, su reinado como sultán de Brunéi desde 1967 y su cargo de primer ministro desde la independencia en 1984, y lo identifica como el hijo mayor de Omar Ali Saifuddien III y el vigésimo noveno sultán."
  fr: "Article de Wikipédia en arabe sur Hassanal Bolkiah; utilisé uniquement pour les informations sur l’entité. Il confirme sa naissance le 15 juillet 1946, son règne en tant que sultan de Brunei depuis 1967 et son poste de Premier ministre depuis l’indépendance en 1984, et l’identifie comme le fils aîné d’Omar Ali Saifuddien III et le vingt-neuvième sultan."
  ur: "حسنال بلکیہ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 15 جولائی 1946 کو ان کی پیدائش، 1967 سے برونائی کے سلطان کے طور پر ان کے دور حکومت اور 1984 میں آزادی کے بعد سے ان کے وزیر اعظم ہونے کی تصدیق کرتا ہے، اور اس کی شناخت عمر علی سیف الدین III کے بڑے بیٹے اور انتیسویں سلطان کے طور پر کرتی ہے۔"
  tr: "Hasan el-Balqiya hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Bu makale, 15 Temmuz 1946'daki doğumunu, 1967'den beri Brunei Sultanı olarak iktidarını, 1984'teki bağımsızlıktan sonraki başbakanlığını ve Umar Ali Saif al-Din III'ün en büyük oğlu ve yirmi dokuzuncu Sultan'ın en büyük oğlu olduğunu doğrular."
  id: "Artikel Wikipedia berbahasa Arab tentang Hassan al-Balqiya hanya digunakan untuk fakta entitas tersebut. Artikel ini mengonfirmasi kelahirannya pada 15 Juli 1946, pemerintahannya sebagai Sultan Brunei sejak 1967, dan masa jabatannya sebagai perdana menteri sejak kemerdekaan pada 1984, serta bahwa dia adalah putra sulung Umar Ali Saif al-Din III dan Sultan kedua puluh sembilan."
