label: { en: "Egypt State Information Service — US Embassy highlights Farouk El-Baz" }
summary:
  ar: "خبر الهيئة العامة للاستعلامات عن إبراز سفارة الولايات المتحدة في القاهرة لإنجازات فاروق الباز في أسبوع دبلوماسية الفضاء: يؤكد ميلاده في 2 يناير 1938 بالزقازيق ودوره في برنامج أبولو وعضويته في الأكاديمية الوطنية للهندسة سنة 2002."
  en: "State Information Service report of the US Embassy in Cairo highlighting Farouk El-Baz's achievements for Space Diplomacy Week: it confirms his birth on 2 January 1938 in Zagazig, his Apollo role, and his 2002 election to the National Academy of Engineering."
  es: "Informe del Servicio Estatal de Información de la Embajada de Estados Unidos en El Cairo que destaca los logros de Farouk El-Baz para la Semana de la Diplomacia Espacial: confirma su nacimiento el 2 de enero de 1938 en Zagazig, su papel en el programa Apolo y su elección en 2002 a la Academia Nacional de Ingeniería."
  fr: "Rapport du Service d'information de l'ambassade des États-Unis au Caire mettant en lumière les réalisations de Farouk El-Baz à l'occasion de la Semaine de la diplomatie spatiale: il confirme sa naissance le 2 janvier 1938 à Zagazig, son rôle dans le programme Apollo et son élection en 2002 à l'Académie nationale d'ingénierie."
  ur: "قاہرہ میں امریکی سفارت خانے کی اسٹیٹ انفارمیشن سروس کی رپورٹ خلائی ڈپلومیسی ہفتہ کے لیے فاروق الباز کی کامیابیوں کو اجاگر کرتی ہے: یہ 2 جنوری 1938 کو زگازگ میں ان کی پیدائش، ان کے اپولو کردار، اور نیشنل اکیڈمی آف انجینئرنگ کے لیے ان کے 2002 کے انتخاب کی تصدیق کرتی ہے۔"
  tr: "Genel Bilgi Otoritesi'nden Kahire'deki Amerika Birleşik Devletleri Büyükelçiliği haberleri, Farouk El-Baz'ın Uzay Diplomasisi Haftası'ndaki başarılarını vurgular: 2 Ocak 1938'de Zagazig'de doğduğunu, Apollo programındaki rolünü ve 2002'de Ulusal Mühendislik Akademisi üyeliğini doğrular."
  id: "Berita dari Otoritas Informasi Umum tentang Kedutaan Besar Amerika Serikat di Kairo menyoroti pencapaian Farouk El-Baz selama Pekan Diplomasi Antariksa: mengonfirmasi kelahirannya pada 2 Januari 1938 di Zagazig, perannya dalam program Apollo, dan keanggotaannya di Akademi Teknik Nasional pada tahun 2002."
title: "US embassy in Cairo highlights Farouk El-Baz's achievements on Space Diplomacy Week"
