  ar: "مقالة ويكيبيديا الإنجليزية عن ماري إلكا بانغيستو، المولودة في 23 تشرين الأول 1956 في جاكرتا، وزيرة التجارة الإندونيسية (2004–2011) ثم وزيرة السياحة والاقتصاد الإبداعي؛ تذكر دراستها في الجامعة الوطنية الأسترالية وجامعة كاليفورنيا ديفيس وإدارتها في البنك الدولي ومستشاريتها الخاصة للرئيس سنة 2024."
  en: "English Wikipedia article on Mari Elka Pangestu, born 23 October 1956 in Jakarta, Indonesia's minister of trade (2004-2011) and then minister of tourism and creative economy; it records her studies at the Australian National University and UC Davis, her World Bank managing directorship, and her 2024 appointment as a presidential special advisor."
