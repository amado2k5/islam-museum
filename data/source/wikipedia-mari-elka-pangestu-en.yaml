summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ماري إلكا بانغيستو، المولودة في 23 تشرين الأول 1956 في جاكرتا، وزيرة التجارة الإندونيسية (2004–2011) ثم وزيرة السياحة والاقتصاد الإبداعي؛ تذكر دراستها في الجامعة الوطنية الأسترالية وجامعة كاليفورنيا ديفيس وإدارتها في البنك الدولي ومستشاريتها الخاصة للرئيس سنة 2024."
  en: "English Wikipedia article on Mari Elka Pangestu, born 23 October 1956 in Jakarta, Indonesia's minister of trade (2004-2011) and then minister of tourism and creative economy; it records her studies at the Australian National University and UC Davis, her World Bank managing directorship, and her 2024 appointment as a presidential special advisor."
  es: "Artículo de la Wikipedia en inglés sobre Mari Elka Pangestu, nacida el 23 de octubre de 1956 en Yakarta, ministra de comercio de Indonesia (2004-2011) y posteriormente ministra de turismo y economía creativa; en él se recogen sus estudios en la Universidad Nacional de Australia y en la UC Davis, su cargo como directora gerente del Banco Mundial y su nombramiento en 2024 como asesora especial presidencial."
  fr: "L'article de Wikipédia en anglais sur Mari Elka Pangestu, née le 23 octobre 1956 à Jakarta, ministre du Commerce (2004-2011) puis ministre du Tourisme et de l'Économie créative d'Indonésie; il relate ses études à l'Université nationale australienne et à l'UC Davis, son poste de directrice générale à la Banque mondiale et sa nomination en 2024 comme conseillère spéciale du président."
  ur: "ماری ایلکا پانگسٹو پر انگریزی ویکیپیڈیا کا مضمون، 23 اکتوبر 1956 کو جکارتہ میں پیدا ہوا، انڈونیشیا کے وزیر تجارت (2004-2011) اور پھر وزیر سیاحت اور تخلیقی معیشت؛ یہ آسٹریلین نیشنل یونیورسٹی اور یو سی ڈیوس میں ان کی پڑھائی کو ریکارڈ کرتا ہے، اس کی ورلڈ بینک کی منیجنگ ڈائریکٹر شپ، اور صدارتی خصوصی مشیر کے طور پر ان کی 2024 کی تقرری۔"
