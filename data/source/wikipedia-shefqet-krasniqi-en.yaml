reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. Read in full on 4 November 2026. It gives the birth date and place (20 June 1966, Sibofc, Obiliq), the Alauddin madrassa in Pristina, the Medina degrees (Arabic language and literature; master's in Sharia 1996; doctorate in Islamic jurisprudence 2001), KLA service in 1999 cited to his biography, five years teaching at the Faculty of Islamic Studies in Pristina, and the imamate of the Imperial (Great) Mosque in Pristina until his 2015 dismissal. The controversy material is attributed in the article to the US State Department's International Religious Freedom Report 2013, and the legal history is stated with dates: questioned in September 2014, indicted on 27 February 2017 (incitement to terrorism, intolerance, tax evasion), acquitted on all charges on 23 March 2018, upheld on appeal on 1 October 2018. The infobox's religion and jurisprudence entries are structured data, not text attestations, and were not used to settle faith. The revision-id endpoint was not read in this session, so no revision id is recorded; the access date stands in its place."
