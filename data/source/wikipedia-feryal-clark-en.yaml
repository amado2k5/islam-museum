summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيريال كلارك (مواليد 1979)؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في ملاطية بتركيا في 6 يناير 1979 لوالدين كرديين علويين، وانتقالها إلى لندن في الثامنة، ودراستها في جامعة إكستر وعملها في هيئة الصحة الوطنية، وعضويتها في مجلس هاكني، وانتخابها نائبة عن إنفيلد الشمالية سنة 2019 بوصفها أول نائبة كردية لحزب العمال، ومنصبها وكيلة وزارة لشؤون الذكاء الاصطناعي والحكومة الرقمية (2024-2025)."
  en: "English Wikipedia article on Feryal Clark (born 1979); used for entity facts only. It records her birth at Malatya, Turkey, on 6 January 1979 to Kurdish Alevi parents, her move to London at eight, her studies at the University of Exeter and NHS pathology work, her Hackney council service, her election as MP for Enfield North in 2019 as Labour's first Kurdish MP, and her office as Parliamentary Under-Secretary of State for AI and Digital Government (2024–2025)."
