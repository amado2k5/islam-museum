summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيريال كلارك ⁦(مواليد 1979)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في ملاطية بتركيا في 6 يناير 1979 لوالدين كرديين علويين، وانتقالها إلى لندن في الثامنة، ودراستها في جامعة إكستر وعملها في هيئة الصحة الوطنية، وعضويتها في مجلس هاكني، وانتخابها نائبة عن إنفيلد الشمالية سنة 2019 بوصفها أول نائبة كردية لحزب العمال، ومنصبها وكيلة وزارة لشؤون الذكاء الاصطناعي والحكومة الرقمية (2024-2025)."
  en: "English Wikipedia article on Feryal Clark (born 1979); used for entity facts only. It records her birth at Malatya, Turkey, on 6 January 1979 to Kurdish Alevi parents, her move to London at eight, her studies at the University of Exeter and NHS pathology work, her Hackney council service, her election as MP for Enfield North in 2019 as Labour's first Kurdish MP, and her office as Parliamentary Under-Secretary of State for AI and Digital Government (2024–2025)."
  es: "Artículo de la Wikipedia en inglés sobre Feryal Clark (nacida en 1979); utilizado únicamente para datos sobre la persona. En él se registra su nacimiento en Malatya, Turquía, el 6 de enero de 1979, de padres kurdos alevíes; su traslado a Londres a los ocho años; sus estudios en la Universidad de Exeter y su trabajo en patología del NHS (Servicio Nacional de Salud del Reino Unido); su servicio en el ayuntamiento de Hackney; su elección como diputada por Enfield North en 2019 como la primera diputada kurda del Partido Laborista; y su cargo como Subsecretaria Parlamentaria de Estado para la IA y el Gobierno Digital (2024-2025)."
  fr: "Article de Wikipédia en anglais sur Feryal Clark (née en 1979); utilisé uniquement pour les informations sur l’entité. Il relate sa naissance à Malatya, en Turquie, le 6 janvier 1979, de parents kurdes alévis, son déménagement à Londres à l’âge de huit ans, ses études à l’université d’Exeter et son travail en pathologie au NHS, son service au conseil municipal de Hackney, son élection comme députée d’Enfield North en 2019 en tant que première députée kurde du Parti travailliste, et son poste de sous-secrétaire d’État parlementaire à l’IA et au gouvernement numérique (2024-2025)."
