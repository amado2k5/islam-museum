summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيما سمر؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في 3 فبراير 1957 في جاغوري، وشهادتها الطبية سنة 1982، وفرارها إلى باكستان سنة 1984، وتأسيسها منظمة الشهداء سنة 1989، ووزارتها ورئاستها للجنة حقوق الإنسان وجوائزها، وتذكر انتماءها العرقي الهزاري دون أن تسمّي لها مذهبًا."
  en: "English Wikipedia article on Sima Samar; used for entity facts only. It records her birth on 3 February 1957 in Jaghori, her 1982 medical degree, her 1984 flight to Pakistan, her founding of the Shuhada Organization in 1989, her ministry, her human rights commission chairmanship and her awards, and gives her Hazara ethnicity without naming a school for her."
  es: "Artículo de la Wikipedia en inglés sobre Sima Samar; utilizado únicamente para datos sobre la persona. Registra su nacimiento el 3 de febrero de 1957 en Jaghori, su título de médico en 1982, su huida a Pakistán en 1984, la fundación de la Organización Shuhada en 1989, su ministerio, su presidencia de la comisión de derechos humanos y sus premios, y la identifica como hazara sin mencionar ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en anglais sur Sima Samar; utilisé uniquement pour les informations la concernant. Il mentionne sa naissance le 3 février 1957 à Jaghori, son diplôme de médecine obtenu en 1982, sa fuite vers le Pakistan en 1984, la fondation de l’Organisation des martyrs en 1989, son ministère, sa présidence de la commission des droits de l’homme et les distinctions qu’elle a reçues. Il précise son appartenance ethnique hazara, sans toutefois mentionner d’établissement scolaire portant son nom."
  ur: "سیما ثمر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 3 فروری 1957 کو جاغوری میں اس کی پیدائش، اس کی 1982 کی میڈیکل ڈگری، اس کی 1984 کی پاکستان کی پرواز، 1989 میں اس کی شہدا آرگنائزیشن کی بنیاد، اس کی وزارت، اس کے انسانی حقوق کمیشن کی سربراہی اور اس کے ایوارڈز کو ریکارڈ کیا گیا ہے، اور اس کے لیے کسی اسکول کا نام لیے بغیر اس کی ہزارہ نسل کا ذکر کیا گیا ہے۔"
