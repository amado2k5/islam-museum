  ar: "مقالة ويكيبيديا الإنجليزية عن سيما سمر؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في 3 فبراير 1957 في جاغوري، وشهادتها الطبية سنة 1982، وفرارها إلى باكستان سنة 1984، وتأسيسها منظمة الشهداء سنة 1989، ووزارتها ورئاستها للجنة حقوق الإنسان وجوائزها، وتذكر انتماءها العرقي الهزاري دون أن تسمّي لها مذهبًا."
  en: "English Wikipedia article on Sima Samar; used for entity facts only. It records her birth on 3 February 1957 in Jaghori, her 1982 medical degree, her 1984 flight to Pakistan, her founding of the Shuhada Organization in 1989, her ministry, her human rights commission chairmanship and her awards, and gives her Hazara ethnicity without naming a school for her."
