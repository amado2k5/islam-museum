reliability_note: "Pointer for entity facts only (Wikipedia broad rule): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It records that she was forced to resign as Minister of Women's Affairs after death threats and harassment over an interview in Canada in which she was reported to question conservative Islamic laws, and that religious conservatives at the 2003 Loya Jirga advertised calling her the Salman Rushdie of Afghanistan — both carried in her prose as attributed reports, with her denial noted from the secondary literature."
