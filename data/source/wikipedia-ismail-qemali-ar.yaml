reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 16 January 1844 at Vlorë to an Albanian noble family; mastery of Ottoman Turkish, Greek, Italian and French at Ioannina, then law at Istanbul; marriage to Kleoniki Sourmeli; Ottoman civil service at high levels in Europe and Asia; adherence to Midhat Pasha's reform wing; governorships in the Balkans; travel in Belgium, France, England and Italy; the Congress of Ottoman Opposition and a leading role in the 1912 revolt; principal authorship of the Declaration of Independence and election as head of the Provisional Government in November 1912, first prime minister and foreign minister until his resignation in January 1914; the laqab Babai Kombit, 'Father of the Nation'; death on 26 January 1919 — agreeing with the English and Albanian articles against Wikidata's 24 January. It states nothing about his school; the family's nobility and Muslim milieu are background, not attestation."
