summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ذو الفقار علي بوتو؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 5 يناير 1928 في راتوديرو قرب لاركانا، وتعليمه في جامعات جنوب كاليفورنيا وبيركلي وأكسفورد وقبوله محاميا في لينكولنز إن، ووزاراته في عهد أيوب خان، وتأسيسه حزب الشعب الباكستاني سنة 1967، ورئاسته (1971–1973) ورئاسته للوزراء (1973–1977)، ودستور 1973 والبرنامج النووي، والإطاحة به سنة 1977 ومحاكمته وإعدامه في 4 أبريل 1979 في راولبندي، وقرار المحكمة العليا لاحقا أن المحاكمة لم تكن عادلة."
  en: "English Wikipedia article on Zulfikar Ali Bhutto; used for entity facts only. It recounts his birth on 5 January 1928 at Ratodero near Larkana, his education at USC, Berkeley and Oxford and call to the bar at Lincoln's Inn, his ministries under Ayub Khan, his founding of the Pakistan People's Party in 1967, his presidency (1971–1973) and premiership (1973–1977), the 1973 constitution and nuclear programme, his overthrow in 1977, trial and execution on 4 April 1979 at Rawalpindi, and the Supreme Court's later finding that the trial was unfair."
