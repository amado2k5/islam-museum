summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ذو الفقار علي بوتو؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 5 يناير 1928 في راتوديرو قرب لاركانا، وتعليمه في جامعات جنوب كاليفورنيا وبيركلي وأكسفورد وقبوله محاميا في لينكولنز إن، ووزاراته في عهد أيوب خان، وتأسيسه حزب الشعب الباكستاني سنة 1967، ورئاسته (1971–1973) ورئاسته للوزراء (1973–1977)، ودستور 1973 والبرنامج النووي، والإطاحة به سنة 1977 ومحاكمته وإعدامه في 4 أبريل 1979 في راولبندي، وقرار المحكمة العليا لاحقا أن المحاكمة لم تكن عادلة."
  en: "English Wikipedia article on Zulfikar Ali Bhutto; used for entity facts only. It recounts his birth on 5 January 1928 at Ratodero near Larkana, his education at USC, Berkeley and Oxford and call to the bar at Lincoln's Inn, his ministries under Ayub Khan, his founding of the Pakistan People's Party in 1967, his presidency (1971–1973) and premiership (1973–1977), the 1973 constitution and nuclear programme, his overthrow in 1977, trial and execution on 4 April 1979 at Rawalpindi, and the Supreme Court's later finding that the trial was unfair."
  es: "Artículo de la Wikipedia en inglés sobre Zulfikar Ali Bhutto; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 5 de enero de 1928 en Ratodero, cerca de Larkana, su educación en la USC, Berkeley y Oxford y su admisión al colegio de abogados de Lincoln's Inn, sus ministerios bajo el mandato de Ayub Khan, la fundación del Partido Popular de Pakistán en 1967, su presidencia (1971-1973) y su mandato como primer ministro (1973-1977), la constitución de 1973 y el programa nuclear, su derrocamiento en 1977, su juicio y ejecución el 4 de abril de 1979 en Rawalpindi, y la posterior conclusión del Tribunal Supremo de que el juicio fue injusto."
  fr: "Article de Wikipédia en anglais sur Zulfikar Ali Bhutto; utilisé uniquement pour les informations sur l'entité. Il relate sa naissance le 5 janvier 1928 à Ratodero, près de Larkana, ses études à l'USC, à Berkeley et à Oxford, son admission au barreau de Lincoln's Inn, ses ministères sous Ayub Khan, la fondation du Parti du peuple pakistanais en 1967, sa présidence (1971-1973) et son poste de Premier ministre (1973-1977), la constitution de 1973 et le programme nucléaire, son renversement en 1977, son procès et son exécution le 4 avril 1979 à Rawalpindi, ainsi que la décision ultérieure de la Cour suprême déclarant le procès inéquitable."
  ur: "ذوالفقار علی بھٹو پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 5 جنوری 1928 کو لاڑکانہ کے قریب رتوڈیرو میں ان کی پیدائش، یو ایس سی، برکلے اور آکسفورڈ میں ان کی تعلیم اور لنکنز ان کے بار میں کال، ایوب خان کے ماتحت ان کی وزارتوں، 1967 میں پاکستان پیپلز پارٹی کی بنیاد، ان کی صدارت (1971–1973)، ان کی صدارت (1971–1973)، اور سابقہ دور (1973–1973) کا ذکر ہے۔ آئین اور جوہری پروگرام، 1977 میں ان کا تختہ الٹنا، 4 اپریل 1979 کو راولپنڈی میں مقدمہ چلا اور اس پر عمل درآمد، اور بعد میں سپریم کورٹ کا یہ پتہ چلا کہ مقدمہ غیر منصفانہ تھا۔"
  tr: "Zulfikar Ali Bhutto hakkında İngilizce Wikipedia makalesi; yalnızca varlık gerçekleri için kullanılmıştır. 5 Ocak 1928'de Larkana yakınlarındaki Ratodero'da doğumunu, Güney Kaliforniya, Berkeley ve Oxford üniversitelerindeki eğitimini, Lincoln's Inn'de avukat olarak kabul edilmesini, Ayub Khan dönemindeki bakanlıklarını, 1967'de Pakistan Halk Partisi'nin kuruluşunu, başkanlığını (1971–1973), başbakanlığını (1973–1977), 1973 anayasasını ve nükleer programını, 1977'de devrilmesini, 4 Nisan 1979'da Rawalpindi'de yargılanmasını ve idamını ve daha sonra Yüksek Mahkeme'nin davanın adaletsiz olduğuna karar vermesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Zulfikar Ali Bhutto; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 5 Januari 1928 di Ratodero dekat Larkana, pendidikannya di universitas California Selatan, Berkeley, dan Oxford, penerimaannya sebagai pengacara di Lincoln's Inn, pelayanannya selama era Ayub Khan, pendirian Partai Rakyat Pakistan pada tahun 1967, masa jabatannya (1971–1973), masa jabatannya sebagai perdana menteri (1973–1977), konstitusi dan program nuklir tahun 1973, penggulingannya pada tahun 1977, persidangannya, dan eksekusinya pada 4 April 1979 di Rawalpindi, serta putusan Mahkamah Agung yang kemudian menyatakan persidangan tersebut tidak adil."
