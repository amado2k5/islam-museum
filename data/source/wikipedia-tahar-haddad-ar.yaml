summary:
  ar: "مقالة ويكيبيديا العربية عن طاهر بن علي بن بلقاسم الحداد؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بتونس العاصمة في 4 ديسمبر 1899 ووفاته في 7 ديسمبر 1935، وتعليمه بالكتّاب ثم جامع الزيتونة، ودوره مع محمد علي الحامي في تأسيس جامعة عموم العملة التونسية (1924) وكتابه «العمال التونسيون» (1927). صندوق معلوماتها يترك خانتي الديانة والمذهب فارغتين."
  en: "Arabic Wikipedia article on Tahar ibn Ali ibn Belqacem al-Haddad; used for entity facts only. It gives his birth in Tunis on 4 December 1899 and death on 7 December 1935, his education at a kuttab and then the Zitouna, his role with Mohamed Ali El Hammi in founding the CGTT labour federation (1924) and his 1927 book Tunisian Workers. Its infobox leaves the religion and school fields empty."
  es: "Artículo en árabe de la Wikipedia sobre Tahar ibn Ali ibn Belqacem al-Haddad; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Túnez el 4 de diciembre de 1899 y su fallecimiento el 7 de diciembre de 1935, su educación en un kuttab y posteriormente en la Zitouna, su participación junto con Mohamed Ali El Hammi en la fundación de la federación laboral CGTT (1924) y su libro de 1927, *Los trabajadores tunecinos*. El recuadro informativo deja en blanco los campos de religión y escuela."
  fr: "Article de Wikipédia en arabe sur Tahar ibn Ali ibn Belqacem al-Haddad; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance à Tunis le 4 décembre 1899 et sa mort le 7 décembre 1935, sa scolarité dans un kuttab puis à la Zitouna, son rôle avec Mohamed Ali El Hammi dans la fondation de la fédération syndicale CGTT (1924) et son ouvrage de 1927, « Les Travailleurs tunisiens ». Son infobox ne renseigne pas les champs « Religion » et « Scolarité »."
  ur: "طہار ابن علی ابن بلقاسم الحداد پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 4 دسمبر 1899 کو تیونس میں ان کی پیدائش اور 7 دسمبر 1935 کو موت، ایک کتب اور پھر زیتونہ میں ان کی تعلیم، سی جی ٹی ٹی لیبر فیڈریشن (1924) کے قیام میں محمد علی الحمی کے ساتھ ان کا کردار اور ان کی 1927 کی کتاب تیونس ورکرز۔ اس کا انفو باکس مذہب اور اسکول کے میدانوں کو خالی چھوڑ دیتا ہے۔"
  tr: "Taher bin Ali bin Belkacem Al-Haddad hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bu makalede 4 Aralık 1899'da Tunus'ta doğmuş, 7 Aralık 1935'te Tunus'ta ölmüş, kuttab'da ve ardından Zitouna Üniversitesi'nde eğitimi, Muhammed Ali Al-Hami ile Tunus Para Üniversitesi'nin kuruluşunda (1924) rol aldığı ve \"Tunisian Workers\" (1927) adlı kitabı yer almaktadır. Bilgi kutusu din ve doktrin alanlarını boş bırakır."
  id: "Artikel Wikipedia Arab tentang Taher bin Ali bin Belkacem Al-Haddad; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya di Tunis pada 4 Desember 1899, dan kematiannya pada 7 Desember 1935, pendidikannya di kuttab dan kemudian Universitas Zitouna, perannya bersama Muhammad Ali Al-Hami dalam mendirikan Universitas Mata Uang Tunisia (1924) dan bukunya \"Tunisian Workers\" (1927). Kotak info-nya meninggalkan bidang agama dan doktrin kosong."
