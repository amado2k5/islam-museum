summary:
  ar: "مقالة ويكيبيديا العربية عن طاهر بن علي بن بلقاسم الحداد؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بتونس العاصمة في 4 ديسمبر 1899 ووفاته في 7 ديسمبر 1935، وتعليمه بالكتّاب ثم جامع الزيتونة، ودوره مع محمد علي الحامي في تأسيس جامعة عموم العملة التونسية (1924) وكتابه «العمال التونسيون» (1927). صندوق معلوماتها يترك خانتي الديانة والمذهب فارغتين."
  en: "Arabic Wikipedia article on Tahar ibn Ali ibn Belqacem al-Haddad; used for entity facts only. It gives his birth in Tunis on 4 December 1899 and death on 7 December 1935, his education at a kuttab and then the Zitouna, his role with Mohamed Ali El Hammi in founding the CGTT labour federation (1924) and his 1927 book Tunisian Workers. Its infobox leaves the religion and school fields empty."
