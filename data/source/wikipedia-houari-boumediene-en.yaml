reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by its revision id with the returned id asserted equal. Its infobox names Ahmed Ben Bella as his predecessor (as President) for the chairmanship of the Revolutionary Council from 19 June 1965, and himself as president from 10 December 1976 until his death on 27 December 1978. Its text warns that his birthplace appears variously as Guelma, the nearby village of Clauzel, or Héliopolis, and his birth date as 16 August 1925, 23 August 1927, or, in most sources, 1932, with his father confirming 23 August 1932 in a 1965 interview. It names no school for him: his studies at the Islamic Institute in Constantine are formation, his father's strict Islam is family background, and his making Islam the state religion is state policy."
