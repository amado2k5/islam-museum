reliability_note: "A national-encyclopedia entry independent of the Wikipedia family. It covers his installation on 20 October 1760, the move of the capital from Murshidabad to Monghyr, his revenue and army reforms, the rupture with the East India Company, the Buxar campaign of 1764, and his death 'in obscurity near Delhi in 1777'. It gives no birth date and makes no statement about his religion or school, a silence the museum's record notes when weighing the single structured Shia attestation elsewhere. Read 1 November 2026."
