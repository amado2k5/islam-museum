summary:
  ar: "دراسة لسيد محمود الحسن، أصلها أطروحة في جامعة لندن، في أصول عمارة المسجد وتطورها، ثم في مساجد بنغال قبل المغول مقسومة إلى أربعة أنماط: ذو القبو والقباب، والمربع ذو القبة، والمستطيل المتعدد القباب، وذو السقف المنحني على هيئة الكوخ."
  en: "A study by Syed Mahmudul Hasan, from a University of London thesis, of the origin and evolution of mosque architecture and of the mosques of pre-Mughal Bengal in four types: vault-and-domed, square domed, oblong multi-domed, and hut-shaped (curvilinear)."
