reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision. It records that he memorised the whole Qur'an at a young age and holds a professional ijazah in the Hafs recitation; his PhD, MA and BA in Islamic Studies in English from Al-Azhar University's Faculty of Languages & Translation; lecturing at Al-Azhar from 2003 and on Islam at Clemson University (2009–2010); the Muslim chaplaincy at Brock University (2014–2016); imam service in the US and Canada since 2007; membership of the Canadian Council of Imams; and The Clear Quran series (2015), which became the default translation on quran.com in 2020 and is approved by Al-Azhar. The article gives no birth date or birthplace (it files him under 'Year of birth missing'), and its infobox's 'Sunni Islam' religion field is a single structured attestation, uncorroborated for a school in the article's text."
