reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Al-Jaber as born 11 December 1972 in Riyadh; Al-Hilal 1989–2007 (270 league appearances, 101 goals) with a four-appearance loan at Wolverhampton Wanderers in 2000; 156 caps and 46 goals for Saudi Arabia, with World Cup tournaments from 1994 to 2006, scoring in three of them, and his 100th cap on 27 May 1998 making him then the youngest male footballer to reach 100 caps; manager of Al-Hilal in 2013–2014 and later of Al-Shabab. Its personal-life section speaks only of his advocacy of football reform. It makes no statement of his religion anywhere in its text."
