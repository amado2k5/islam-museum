summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سامي الجابر؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 11 ديسمبر 1972 في الرياض، ومسيرته مع الهلال وإعارته إلى وولفرهامبتون سنة 2000، و156 مباراة دولية و46 هدفًا، وأربع كؤوس عالم، ومسيرته التدريبية بعد الاعتزال."
  en: "English Wikipedia article on Sami Al-Jaber; used for entity facts only. It gives his birth on 11 December 1972 in Riyadh, his Al-Hilal career with a 2000 loan at Wolverhampton Wanderers, 156 caps and 46 goals for Saudi Arabia, four World Cup tournaments, and his post-retirement managerial career."
  es: "Artículo de la Wikipedia en inglés sobre Sami Al-Jaber; utilizado únicamente para datos sobre la persona. En él se indica su fecha de nacimiento, el 11 de diciembre de 1972 en Riad, su trayectoria en el Al-Hilal con una cesión al Wolverhampton Wanderers en el año 2000, 156 partidos internacionales y 46 goles con la selección de Arabia Saudí, cuatro Copas del Mundo y su carrera como entrenador tras su retirada."
  fr: "Article Wikipédia en anglais sur Sami Al-Jaber; utilisé uniquement pour les informations relatives à l'entité. Il mentionne sa naissance le 11 décembre 1972 à Riyad, sa carrière à Al-Hilal avec un prêt à Wolverhampton Wanderers en 2000, ses 156 sélections et 46 buts pour l'Arabie saoudite, quatre Coupes du monde, et sa carrière d'entraîneur après sa retraite de joueur."
  ur: "سمیع الجابر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے ریاض میں 11 دسمبر 1972 کو جنم لیا، اس کا الہلال کیریئر 2000 میں وولور ہیمپٹن وانڈررز میں قرض کے ساتھ، سعودی عرب کے لیے 156 کیپس اور 46 گول، چار ورلڈ کپ ٹورنامنٹس، اور ریٹائرمنٹ کے بعد کا انتظامی کیریئر۔"
