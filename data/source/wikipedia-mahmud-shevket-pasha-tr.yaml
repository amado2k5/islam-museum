summary:
  ar: "مقالة ويكيبيديا التركية عن محمود شوكت باشا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في بغداد سنة 1856 ابنًا لكتحذاده سليمان فائق بك، وصدارته من 23 يناير إلى 11 يونيو 1913، واغتياله في ميدان بايزيد ودفنه عند نصب الحرية."
  en: "Turkish Wikipedia article on Mahmud Şevket Paşa; used for entity facts only. It gives his birth in Baghdad in 1856, a son of Kethüdazade Süleyman Faik Bey, his grand vizierate from 23 January to 11 June 1913, and his assassination at Beyazıt Square and burial at the Monument of Liberty."
  es: "Artículo de la Wikipedia en turco sobre Mahmud Şevket Paşa; utilizado únicamente para datos sobre la persona. Indica que nació en Bagdad en 1856, era hijo de Kethüdazade Süleyman Faik Bey, fue gran visir desde el 23 de enero hasta el 11 de junio de 1913, fue asesinado en la plaza Beyazıt y fue enterrado en el Monumento a la Libertad."
  fr: "Article de Wikipédia en turc sur Mahmud Şevket Paşa; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance à Bagdad en 1856, fils de Kethüdazade Süleyman Faik Bey, son mandat de grand vizirat du 23 janvier au 11 juin 1913, son assassinat place Beyazıt et son inhumation au Monument de la Liberté."
