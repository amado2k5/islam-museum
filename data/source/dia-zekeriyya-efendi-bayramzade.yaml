reliability_note: "The standard scholarly encyclopaedia entry (TDV İslâm Ansiklopedisi, vol. 44, Istanbul, 2013, pp. 211–212), read in full. It gives his birth at Ankara in 920/1514, son of Bayram Efendi; his teachers Arapzade Abdülbaki Efendi and Malul Emir Efendi; his stay in Cairo in 950/1543; his medrese posts at Bursa, the Atik Ali Paşa medrese won by examination in 973/1565 and the Sahn-ı Seman in 977/1570; his kadiships of Aleppo (981/1573), Bursa (985/1577) and Istanbul (988/1581); the kazaskerlik of Anatolia (989/1582), his retirement (991/1583) and hajj (994/1586), and the kazaskerlik of Rumelia (997/1589, dismissed 998/1590, reappointed 999/1591); his appointment as Shaykh al-Islam on 27–28 Rajab 1000 / 9–10 May 1592, aged seventy-eight, in succession to Bostanzade Mehmed Efendi; and his sudden death at the palace on 11 Shawwal 1001 / 11 July 1593 after recounting a dream of the Prophet, his funeral at Fatih Mosque and his burial beside the medrese, dar al-hadith and dar al-qurra he built near the Sultan Selim Mosque (completed Muharram 1001 / October 1592), his son Yahya arranging the endowment deed in 1594. His works: Ḥāshiya ʿalā Ṣadr al-sharīʿa, Ḥāshiya ʿalā Sharḥ al-Miftāḥ and a Divan. The entry names no madhhab for the man himself, and none is recorded."
