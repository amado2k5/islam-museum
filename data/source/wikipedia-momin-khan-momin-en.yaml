reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. It gives his birth in 1800 at Delhi into a Muslim family of Kashmiri origin, his training as a hakim under his father Ghulam Nabi Khan, his two marriages (the second to a relative of the Sufi poet Khwaja Mir Dard), his diwan and six masnavis, and his death after a fall from his roof on 24 Rajab 1268 AH / 14 May 1852, citing the Sahitya Akademi monograph and Ali Jawad Zaidi's history of Urdu literature. Its categories file him under 'Indian Sufi saints'; no sentence in its text describes a personal Sufi affiliation."
