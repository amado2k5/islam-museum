  ar: "مقالة ويكيبيديا الإنجليزية عن مؤمن خان مؤمن؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في دلهي سنة 1800 لأسرة كشميرية احترفت الطب اليوناني، ووفاته في 14 مايو 1852 الموافق 24 رجب 1268هـ، وتصنيفاتها تضعه في «القديسين الصوفيين الهنود» دون نص."
  en: "English Wikipedia article on Momin Khan Momin; used for entity facts only. It recounts his birth in Delhi in 1800 into a Kashmiri family of Unani physicians, and his death on 14 May 1852, paired in the text with 24 Rajab 1268 AH; its categories file him under Indian Sufi saints without any supporting text."
  es: "Artículo de la Wikipedia en inglés sobre Momin Khan Momin; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Delhi en 1800 en el seno de una familia cachemir de médicos unani, y su muerte el 14 de mayo de 1852, fecha que en el texto se relaciona con el 24 de Rajab de 1268 AH; sus categorías lo clasifican como santo sufí indio sin ningún texto que lo respalde."
  fr: "Article Wikipédia en anglais sur Momin Khan Momin; utilisé uniquement pour les informations biographiques. Il relate sa naissance à Delhi en 1800 au sein d'une famille cachemirienne de médecins unani, et sa mort le 14 mai 1852, date associée dans le texte au 24 Rajab 1268 AH; ses catégories le classent parmi les saints soufis indiens sans autre précision."
  ur: "مومن خان مومن پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 1800 میں دہلی میں یونیانی طبیبوں کے ایک کشمیری خاندان میں ہوئی اور ان کی وفات 14 مئی 1852 کو 24 رجب 1268 ہجری کو متن میں بیان کی گئی ہے۔ اس کے زمرے اسے ہندوستانی صوفی سنتوں کے تحت بغیر کسی معاون متن کے درج کرتے ہیں۔"
