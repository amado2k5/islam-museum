summary:
  ar: "مقالة ويكيبيديا العربية عن اللواء عباس كامل، مستشار رئيس الجمهورية المصرية منسقًا عامًا للأجهزة الأمنية ومبعوثًا خاصًا، ورئيس المخابرات العامة السابق ⁦(كلّف بتسيير أعمالها في كانون الثاني 2018 وأدى اليمين رئيسًا لها في 28 حزيران 2018)⁩؛ تذكر تأهيله العسكري ومناصبه في المخابرات الحربية."
  en: "Arabic Wikipedia article on Major General Abbas Kamel, adviser to the Egyptian president as general coordinator of the security apparatuses and special envoy, and former head of General Intelligence (charged with its acting headship in January 2018, sworn in as its head on 28 June 2018); it records his military qualifications and his posts in military intelligence."
  es: "Artículo en la Wikipedia en árabe sobre el general de división Abbas Kamel, asesor del presidente egipcio como coordinador general de los aparatos de seguridad y enviado especial, y antiguo jefe de la Inteligencia General (asumió la dirección interina en enero de 2018 y juró el cargo el 28 de junio de 2018); en él se recogen sus cualificaciones militares y sus puestos en la inteligencia militar."
  fr: "L'article de Wikipédia en arabe sur le major-général Abbas Kamel, conseiller du président égyptien en tant que coordinateur général des appareils de sécurité et envoyé spécial, et ancien chef du renseignement général (chargé de sa direction par intérim en janvier 2018, assermenté comme chef le 28 juin 2018); il répertorie ses qualifications militaires et ses postes dans le renseignement militaire."
  ur: "میجر جنرل عباس کامل پر عربی ویکیپیڈیا کا مضمون، مصری صدر کے مشیر برائے سیکورٹی آلات اور خصوصی ایلچی، اور جنرل انٹیلی جنس کے سابق سربراہ ⁦(جنوری 2018 میں اس کی قائم مقام سربراہی کا الزام، 28 جون 2018 کو اس کے سربراہ کے طور پر حلف اٹھایا)⁩؛ یہ اس کی فوجی قابلیت اور ملٹری انٹیلی جنس میں اس کی پوسٹوں کو ریکارڈ کرتا ہے۔"
  tr: "Mısır Cumhuriyeti Cumhurbaşkanı'na danışman, Güvenlik Ajansları Genel Koordinatörü, Özel Elçi ve eski Genel İstihbarat Direktörü (Ocak 2018'de işleri yönetmekle görevlendirilmiş ve 28 Haziran 2018'de başkan olarak yemin eden) Tümgeneral Abbas Kamel hakkında Arapça Wikipedia makalesi; askeri yeterliliği ve askeri istihbarattaki pozisyonlarından bahsetmektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang Mayor Jenderal Abbas Kamel, Penasihat Presiden Republik Mesir, Koordinator Jenderal Badan Keamanan, Utusan Khusus, dan mantan Direktur Intelijen Jenderal (ditugaskan mengelola urusannya pada Januari 2018 dan dilantik sebagai kepala pada 28 Juni 2018); menyebutkan kualifikasi militer dan posisinya di intelijen militer."
