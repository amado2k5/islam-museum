  ar: "مقالة ويكيبيديا العربية عن عمر الشريف ⁦(10 نيسان 1932 – 10 تموز 2015)⁩؛ تذكر تحوّله إلى الإسلام من أجل الزواج من فاتن حمامة وإنجابهما ولدًا وحيدًا، وتقارن مولده بـ4 ذي الحجة 1350 ووفاته بـ23 رمضان 1436، وتفصّل وفاته في مستشفى بهمان بحلوان."
  en: "Arabic Wikipedia article on Omar Sharif (10 April 1932 – 10 July 2015); it records his conversion to Islam in order to marry Faten Hamama and their only son, pairs his birth with 4 Dhu al-Hijja 1350 and his death with 23 Ramadan 1436, and details his death at Bahman Hospital in Helwan."
