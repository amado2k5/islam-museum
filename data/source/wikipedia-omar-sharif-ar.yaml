summary:
  ar: "مقالة ويكيبيديا العربية عن عمر الشريف ⁦(10 نيسان 1932 – 10 تموز 2015)⁩؛ تذكر تحوّله إلى الإسلام من أجل الزواج من فاتن حمامة وإنجابهما ولدًا وحيدًا، وتقارن مولده بـ4 ذي الحجة 1350 ووفاته بـ23 رمضان 1436، وتفصّل وفاته في مستشفى بهمان بحلوان."
  en: "Arabic Wikipedia article on Omar Sharif (10 April 1932 – 10 July 2015); it records his conversion to Islam in order to marry Faten Hamama and their only son, pairs his birth with 4 Dhu al-Hijja 1350 and his death with 23 Ramadan 1436, and details his death at Bahman Hospital in Helwan."
  es: "Artículo en árabe de la Wikipedia sobre Omar Sharif (10 de abril de 1932 - 10 de julio de 2015); en él se registra su conversión al Islam para casarse con Faten Hamama y su único hijo, se sitúa su nacimiento el 4 de Dhu al-Hijja de 1350 y su muerte el 23 de Ramadán de 1436, y se detalla su fallecimiento en el Hospital Bahman de Helwan."
  fr: "Article de Wikipédia en arabe sur Omar Sharif (10 avril 1932 – 10 juillet 2015); il relate sa conversion à l'islam afin d'épouser Faten Hamama et leur fils unique, associe sa naissance au 4 Dhu al-Hijja 1350 et sa mort au 23 Ramadan 1436, et détaille sa mort à l'hôpital Bahman de Helwan."
  ur: "عمر شریف پر عربی ویکیپیڈیا مضمون ⁦(10 اپریل 1932 - 10 جولائی 2015)⁩؛ اس میں فتن حمامہ اور ان کے اکلوتے بیٹے سے شادی کرنے کے لیے اس کے اسلام قبول کرنے کا ریکارڈ ہے، اس کی پیدائش 4 ذی الحجہ 1350 اور اس کی وفات 23 رمضان 1436 کو ہے، اور ہیلوان کے بہمن ہسپتال میں اس کی موت کی تفصیلات درج ہیں۔"
  tr: "Arapça Vikipedi makalesi, Omar Şerif (10 Nisan 1932 – 10 Temmuz 2015) hakkında, Faten Hamama ve tek çocuklarıyla evlenmek için İslam'a geçişinden bahseder; doğumunu 4 Hicce 1350'ye ve ölümünü 23 Ramazan 1436'ya ve ölümünün Helwan'daki Bahman Hastanesi'nden ayrı olarak yaşamasına benzetir."
  id: "Artikel Wikipedia bahasa Arab tentang Omar Sharif (10 April 1932 – 10 Juli 2015) menyebutkan konversinya ke Islam untuk menikahi Faten Hamama dan anak tunggal mereka, membandingkan kelahirannya pada 4 Dhu al-Hijjah 1350 dan kematiannya pada 23 Ramadan 1436, dengan kematiannya dipisahkan dari Rumah Sakit Bahman di Helwan."
