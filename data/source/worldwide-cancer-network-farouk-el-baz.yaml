summary:
  ar: "سيرة فاروق الباز على موقع شبكة السرطان العالمية: تذكر ميلاده في 1 يناير 1938 بالزقازيق — وهي قراءة تخالف 2 يناير الواردة في ويكيبيديا الإنجليزية وجامعة عين شمس — وتفصّل مسيرته في أبولو والتدريس."
  en: "Worldwide Cancer Network biography of Farouk El-Baz: it gives his birth as 1 January 1938 in Zagazig — a reading that differs from the 2 January given by English Wikipedia and Ain Shams University — and details his Apollo and teaching career."
  es: "La biografía de Farouk El-Baz publicada por la Worldwide Cancer Network indica que nació el 1 de enero de 1938 en Zagazig —una fecha que difiere del 2 de enero que aparece en la Wikipedia en inglés y en la Universidad Ain Shams— y detalla su trayectoria en el programa Apolo y su carrera docente."
  fr: "Biographie de Farouk El-Baz sur le site du Worldwide Cancer Network: elle indique sa naissance le 1er janvier 1938 à Zagazig — une date qui diffère du 2 janvier mentionné par Wikipédia en anglais et l’université Ain Shams — et détaille sa carrière chez Apollo et dans l’enseignement."
  ur: "فاروق الباز کی ورلڈ وائیڈ کینسر نیٹ ورک کی سوانح عمری: یہ زگازگ میں 1 جنوری 1938 کو جنم دیتی ہے - ایک پڑھنا جو انگلش ویکیپیڈیا اور عین شمس یونیورسٹی کی طرف سے دی گئی 2 جنوری سے مختلف ہے - اور اس کے اپولو اور تدریسی کیریئر کی تفصیلات بتاتی ہیں۔"
  tr: "Farouk El-Baz'ın Dünya Kanser Ağı web sitesindeki biyografisi: 1 Ocak 1938'de Zagazig'de doğdu—İngilizce Wikipedia ve Ain Shams Üniversitesi'nde bulunan 2 Ocak'tan farklı bir okuma—Apollo'daki kariyerini ve öğretmenliğini detaylandırıyor."
  id: "Biografi Farouk El-Baz di situs web World Cancer Network: Ia lahir pada 1 Januari 1938 di Zagazig—bacaan yang berbeda dari 2 Januari yang ditemukan di Wikipedia bahasa Inggris dan Universitas Ain Shams—yang merinci kariernya di Apollo dan mengajarnya."
