summary:
  ar: "مقالة ويكيبيديا العربية عن محمود عباس؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه الكامل محمود رضا شحادة عباس وولادته في 15 نوفمبر 1935، وتصفه بأنه الرئيس الثاني للسلطة الوطنية الفلسطينية منذ 15 يناير 2005 ورئيس منظمة التحرير، ولا تسمّي له مذهبًا."
  en: "Arabic Wikipedia article on Mahmoud Abbas; used for entity facts only. It gives his full name as Mahmoud Rida Shahada Abbas and his birth on 15 November 1935, and describes him as the second President of the Palestinian National Authority since 15 January 2005 and chairman of the PLO; it names no school for him."
  es: "Artículo de Wikipedia en árabe sobre Mahmoud Abbas; utilizado únicamente para obtener información sobre la persona. Indica que su nombre completo es Mahmoud Rida Shahada Abbas y que nació el 15 de noviembre de 1935. Lo describe como el segundo presidente de la Autoridad Nacional Palestina desde el 15 de enero de 2005 y presidente de la OLP; no menciona ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en arabe sur Mahmoud Abbas; utilisé uniquement pour les informations sur l’entité. Il indique son nom complet: Mahmoud Rida Shahada Abbas, sa date de naissance: 15 novembre 1935, et le décrit comme le deuxième président de l’Autorité palestinienne depuis le 15 janvier 2005 et président de l’OLP; aucune école n’est mentionnée."
  ur: "محمود عباس پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا پورا نام محمود ردا شاہد عباس بتایا گیا ہے اور ان کی پیدائش 15 نومبر 1935 کو ہوئی ہے، اور انہیں 15 جنوری 2005 سے فلسطینی نیشنل اتھارٹی کے دوسرے صدر اور PLO کے چیئرمین کے طور پر بیان کیا گیا ہے۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Mahmud Abbas hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Tam adı Mahmud Reda Shahada Abbas ve 15 Kasım 1935'teki doğumunu belirtir, 15 Ocak 2005'ten bu yana Filistin Ulusal Otoritesi'nin ikinci başkanı ve FKÖ'nün başkanı olarak tanımlanır, ancak bir tarikat olarak belirtilmez."
  id: "Artikel Wikipedia berbahasa Arab tentang Mahmoud Abbas; hanya digunakan untuk fakta entitas. Artikel tersebut menyebutkan nama lengkapnya Mahmoud Reda Shahada Abbas dan kelahirannya pada 15 November 1935, serta menggambarkannya sebagai presiden kedua Otoritas Nasional Palestina sejak 15 Januari 2005, dan kepala PLO, tanpa menyebut sekte."
