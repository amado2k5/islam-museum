  ar: "مقالة ويكيبيديا العربية عن محمود عباس؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه الكامل محمود رضا شحادة عباس وولادته في 15 نوفمبر 1935، وتصفه بأنه الرئيس الثاني للسلطة الوطنية الفلسطينية منذ 15 يناير 2005 ورئيس منظمة التحرير، ولا تسمّي له مذهبًا."
