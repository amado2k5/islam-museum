reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Fetched by its recorded revision (revid 74208251) via the MediaWiki API, the returned revid asserted equal, and read in full on 26 October 2026. The article gives his full name as Said bin Muhammad al-Kamali, born at Rabat on 8 Rabi' al-Akhir 1392 AH (21 May 1972), his doctorate on contemporary ijtihad supervised in committee by Farouk Hamada, his teachers and ijazas (among them Muhammad al-Hasan al-Dedew's ijaza in the Muwatta), his teaching at Mohammed V University, and his weekly Muwatta lesson at the Imam Malik chair of the al-Sunna Mosque in Rabat. Its unreferenced infobox gives his religion as Islam, his affiliation as Ahl al-Sunna wa-l-Jama'a and his school as Maliki; the article's text names no school for him personally beyond his teaching of Maliki texts. Its categories file him under Malikis and Moroccan Sunni scholars, which are category filings, not attestations."
