  ar: "مقالة ويكيبيديا العربية عن الفقيه المغربي سعيد بن محمد الكملي؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في الرباط سنة 1972، ومؤهلاته العلمية حتى الدكتوراه، وشيوخه وإجازاته، وتدريسه بجامعة محمد الخامس وإشرافه على كرسي الإمام مالك بمسجد السنة بالرباط، ومؤلفاته."
  en: "Arabic Wikipedia article on the Moroccan jurist Said bin Muhammad al-Kamali; used for entity facts only. It gives his birth in Rabat in 1972, his qualifications up to the doctorate, his teachers and ijazas, his teaching at Mohammed V University and his supervision of the Imam Malik chair at the al-Sunna Mosque in Rabat, and his books."
