  ar: "مقالة ويكيبيديا العربية عن ميرزا سلطان غالييف؛ تصفه بأنه قائد بلشفي من التتار المسلمين، وتعطي ميلاده سنة 1892 في إليمبيتيفو، وتروي نشاطه البلشفي وفكرته في التوفيق بين الماركسية والإسلام ومقاله سنة 1921 في أساليب الدعاية المضادة للدين بين المسلمين."
  en: "Arabic Wikipedia article on Mirsaid Sultan-Galiev; it describes him as a Bolshevik leader of the Muslim Tatars, gives his birth in 1892 at Elembet'evo, and recounts his Bolshevik activity, his attempt to reconcile Marxism and Islam, and his 1921 article on methods of anti-religious propaganda among Muslims."
