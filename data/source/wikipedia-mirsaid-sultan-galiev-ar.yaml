reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. Its lead dates his execution to 28 June 1940, which conflicts with the English and Russian articles and Wikidata (28 January 1940) and is an error in this article, recorded as such in his data record. Its description of him as a leader 'of the Muslim Tatars' is a communal description, not a school attestation, and its note that he wrote on anti-religious propaganda methods in 1921, on commission, is a party assignment, not a self-declaration; the article names no school for him."
