summary:
  ar: "مقالة ويكيبيديا الأردية المختصرة نسبيًا عن صدام حسين؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل صدام حسين عبد المجيد التكريتي وميلاده في 28 أبريل 1937 ووفاته في 30 ديسمبر 2006 ورئاسته للعراق، ولا تسمّي دينًا أو مذهبًا شخصيًا له."
  en: "Urdu Wikipedia article on Saddam Hussein; used for entity facts only. It gives his full name as Saddam Hussein Abd al-Majid al-Tikriti, his birth on 28 April 1937, his death on 30 December 2006 and his presidency of Iraq. It names no personal religion or school for him."
  es: "Artículo de Wikipedia en urdu sobre Saddam Hussein; se utiliza únicamente para obtener información sobre su persona. Indica su nombre completo como Saddam Hussein Abd al-Majid al-Tikriti, su fecha de nacimiento el 28 de abril de 1937, su fallecimiento el 30 de diciembre de 2006 y su presidencia de Irak. No menciona su religión ni su escuela religiosa."
  fr: "Article de Wikipédia en ourdou sur Saddam Hussein; utilisé uniquement pour des informations factuelles. Il indique son nom complet: Saddam Hussein Abd al-Majid al-Tikriti, sa date de naissance: 28 avril 1937, sa date de décès: 30 décembre 2006 et sa présidence de l’Irak. Aucune mention n’est faite de sa religion ou de son appartenance à une école religieuse."
  ur: "صدام حسین پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا پورا نام صدام حسین عبد الماجد التکریتی ہے، ان کی پیدائش 28 اپریل 1937 کو، ان کی وفات 30 دسمبر 2006 کو اور عراق کی صدارت۔ یہ اس کے لیے کسی ذاتی مذہب یا اسکول کا نام نہیں لیتا۔"
  tr: "Saddam Hüseyin hakkında nispeten kısa Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Tam adı Saddam Hüseyin Abdul Majid al-Tikriti, 28 Nisan 1937 doğum, 30 Aralık 2006'daki ölümü ve Irak başkanlığı verilmiştir ve dini ya da kişisel mezhebi belirtilmez."
  id: "Artikel Wikipedia Urdu yang relatif ringkas tentang Saddam Hussein; digunakan hanya untuk fakta entitas tersebut. Artikel ini mencantumkan nama lengkapnya Saddam Hussein Abdul Majid al-Tikriti, kelahirannya pada 28 April 1937, kematiannya pada 30 Desember 2006, dan masa kepresidenannya di Irak, serta tidak menyebutkan agama atau sekte pribadinya."
