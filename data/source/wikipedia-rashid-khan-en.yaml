summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن راشد خان ⁦(مواليد 1998)⁩، لاعب الكريكت الأفغاني؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 20 سبتمبر 1998 في ننكرهار، وقيادته أفغانستان في العشرينيات، وأرقامه القياسية أصغر قائد دولي وأسرع رامٍ إلى 100 ويكيت في مباريات اليوم الواحد والعشرينيات، وجائزة لاعب العقد في العشرينيات سنة 2020، ومسيرته في الدوريات العالمية."
  en: "English Wikipedia article on Rashid Khan (born 1998), the Afghan cricketer; used for entity facts only. It records his birth on 20 September 1998 in Nangarhar, his captaincy of Afghanistan in T20Is, his records as the youngest international captain and the fastest bowler to 100 ODI and 100 T20I wickets, his ICC Men's T20I Cricketer of the Decade award in 2020, and his franchise career worldwide."
  es: "Artículo de la Wikipedia en inglés sobre Rashid Khan (nacido en 1998), el jugador de críquet afgano; utilizado únicamente para datos de la entidad. Registra su nacimiento el 20 de septiembre de 1998 en Nangarhar, su capitanía de Afganistán en T20I, sus récords como el capitán internacional más joven y el lanzador más rápido en alcanzar los 100 wickets en ODI y T20I, su premio al Jugador de Críquet T20I Masculino de la Década de la ICC en 2020 y su carrera en franquicias a nivel mundial."
  fr: "Article de Wikipédia en anglais sur Rashid Khan (né en 1998), le joueur de cricket afghan; utilisé uniquement à des fins d'information. Il relate sa naissance le 20 septembre 1998 à Nangarhar, son capitanat de l'Afghanistan en T20I, ses records en tant que plus jeune capitaine international et lanceur le plus rapide à atteindre 100 guichets en ODI et 100 guichets en T20I, son prix ICC du joueur de cricket T20I masculin de la décennie en 2020, et sa carrière en franchise à travers le monde."
  ur: "افغان کرکٹر راشد خان ⁦(پیدائش 1998)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 20 ستمبر 1998 کو ننگرہار میں ان کی پیدائش، T20Is میں افغانستان کی کپتانی، سب سے کم عمر بین الاقوامی کپتان اور 100 ODI اور 100 T20I وکٹیں حاصل کرنے والے تیز ترین باؤلر، 2020 میں اس کا ICC Men's T20I کرکٹر آف دی ڈیکیڈ ایوارڈ، اور اس کے عالمی سطح پر کیئر فرینچائز کا اعزاز درج ہے۔"
  tr: "Rashid Khan (d. 1998), Afgan kriketçisi hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için kullanılmıştır. 20 Eylül 1998'de Nangarhar'da doğdu, 1920'lerde Afganistan'ı yönetti, 1920'lerde en genç uluslararası kaptan ve tek günlük maçlarda en hızlı 100 kaleye ulaşan oyuncu olarak rekorlar kırdı, 2020'lerde On Yılın Oyuncusu ödülünü kazandı ve uluslararası liglerdeki kariyerini sürdürdü."
  id: "Artikel Wikipedia bahasa Inggris tentang Rashid Khan (lahir 1998), pemain kriket Afghanistan; digunakan hanya untuk fakta entitas. Ia lahir pada 20 September 1998 di Nangarhar, memimpin Afghanistan pada tahun 1920-an, mencatat rekor sebagai kapten internasional termuda dan tercepat mencapai 100 wicket dalam pertandingan satu hari pada tahun 1920-an, memenangkan penghargaan Pemain Dekade pada tahun 2020-an, dan kariernya di liga internasional."
