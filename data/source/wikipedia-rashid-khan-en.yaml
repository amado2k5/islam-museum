summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن راشد خان (مواليد 1998)، لاعب الكريكت الأفغاني؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 20 سبتمبر 1998 في ننكرهار، وقيادته أفغانستان في العشرينيات، وأرقامه القياسية أصغر قائد دولي وأسرع رامٍ إلى 100 ويكيت في مباريات اليوم الواحد والعشرينيات، وجائزة لاعب العقد في العشرينيات سنة 2020، ومسيرته في الدوريات العالمية."
  en: "English Wikipedia article on Rashid Khan (born 1998), the Afghan cricketer; used for entity facts only. It records his birth on 20 September 1998 in Nangarhar, his captaincy of Afghanistan in T20Is, his records as the youngest international captain and the fastest bowler to 100 ODI and 100 T20I wickets, his ICC Men's T20I Cricketer of the Decade award in 2020, and his franchise career worldwide."
