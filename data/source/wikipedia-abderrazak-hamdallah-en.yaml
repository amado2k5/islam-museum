  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرزاق حمد الله؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من آسفي إلى السعودية وألقابه التهديفية القياسية، وتصفه في قسم حياته الشخصية بأنه مسلم ممارس للشعائر شوهد مرارًا وهو يؤدي العمرة، دون أن تسمي أي مذهب."
  en: "English Wikipedia article on Abderrazak Hamdallah; used for entity facts only. It recounts his path from Safi to Saudi Arabia and his record scoring titles; its personal-life section calls him a practicing Muslim who has often been seen performing Umrah, without naming any school."
