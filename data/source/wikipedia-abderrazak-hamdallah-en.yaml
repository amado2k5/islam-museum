  fr: "Article Wikipédia en anglais sur Abderrazak Hamdallah; utilisé uniquement pour les informations le concernant. Il retrace son parcours de Safi à l’Arabie saoudite et son palmarès de buteurs; la section consacrée à sa vie personnelle le décrit comme un musulman pratiquant ayant souvent accompli la Omra, sans toutefois mentionner d’école religieuse."
  ur: "عبدالرزاق حمداللہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں صافی سے سعودی عرب تک کے اس کے راستے اور اس کے ریکارڈ سکورنگ ٹائٹلز کا ذکر ہے۔ اس کا ذاتی زندگی کا حصہ اسے ایک باعمل مسلمان کہتا ہے جسے اکثر عمرہ کرتے دیکھا گیا ہے، بغیر کسی اسکول کا نام لیے۔"
