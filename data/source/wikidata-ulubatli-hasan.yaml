summary:
  ar: "عنصر ويكيداتا لأولوباطلي حسن (Q3622985)؛ يعطي ولادته سنة 1428 ووفاته في 29 مايو 1453 وأولوباط مكانًا للولادة وإسطنبول مكانًا للوفاة، ودينه الإسلام وحده دون أي فرع أو مذهب."
  en: "Wikidata item for Ulubatli Hasan (Q3622985); it gives his birth in 1428, his death on 29 May 1453, Ulubat as birthplace and Istanbul as place of death, and his religion as Islam alone, with no branch or school."
  es: "Entrada de Wikidata para Ulubatli Hasan (Q3622985); indica que nació en 1428, murió el 29 de mayo de 1453, Ulubat como lugar de nacimiento e Estambul como lugar de muerte, y su religión era el Islam únicamente, sin ninguna rama o escuela."
  fr: "L'élément Wikidata pour Ulubatli Hasan (Q3622985); il indique sa naissance en 1428, sa mort le 29 mai 1453, Ulubat comme lieu de naissance et Istanbul comme lieu de décès, et sa religion comme l'islam seul, sans branche ni école."
  ur: "وکی ڈیٹا آئٹم برائے اولوبتلی حسن (Q3622985)؛ یہ ان کی پیدائش 1428 میں، اس کی موت 29 مئی 1453 کو، الوبات کو جائے پیدائش اور استنبول کو موت کی جگہ، اور اس کا مذہب صرف اسلام ہے، جس کی کوئی شاخ یا اسکول نہیں ہے۔"
  tr: "Ulubatli Hasan'ın (Q3622985) Wikidata öğesi; 1428'de doğduğunu ve 29 Mayıs 1453'te öldüğünü belirtir; doğum yeri Ulubat, ölüm yeri İstanbul ise İslam olarak hiçbir dalı veya mezhep olmadan tek dini olarak kabul edilir."
  id: "Elemen Wikidata oleh Ulubatli Hasan (Q3622985); menceritakan kelahirannya pada tahun 1428 dan kematiannya pada 29 Mei 1453, dengan Ulubat sebagai tempat kelahirannya dan Istanbul sebagai tempat kematiannya, dengan Islam sebagai satu-satunya agama tanpa cabang atau sekte apa pun."
