  ar: "مقالة ويكيبيديا الإنجليزية عن نوال المتوكل ⁦(ولدت 15 نيسان 1962 في الدار البيضاء)⁩، العدّاءة المغربية التي فازت بذهبية 400 متر حواجز في أولمبياد لوس أنجلوس 1984؛ تصفها بأنها أول امرأة مغربية وعربية وأفريقية ومسلمة تفوز بذهب أولمبي، وتذكر توليها وزارة الشباب والرياضة المغربية سنة 2007 ونائب رئاسة اللجنة الأولمبية الدولية."
  en: "English Wikipedia article on Nawal El Moutawakel (born 15 April 1962 in Casablanca), the Moroccan hurdler who won the women's 400 metres hurdles at the 1984 Los Angeles Olympics; it describes her as the first Moroccan, Arab, African, and Muslim woman to win an Olympic gold medal, and records her appointment as Morocco's Minister of Youth and Sports in 2007 and her vice-presidency of the International Olympic Committee."
