  ar: "مقالة ويكيبيديا الإنجليزية عن وليد الركراكي؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته ظهيرًا أيمن مع تولوز وأجاكسيو والمنتخب المغربي، ثم مدربًا للفتح والوداد — بطل دوري أبطال أفريقيا 2022 — وللمنتخب المغربي الذي قاده إلى نصف نهائي مونديال 2022 ولقب كأس أمم أفريقيا 2025 قبل استقالته في مارس 2026."
  en: "English Wikipedia article on Walid Regragui; used for entity facts only. It recounts his career as a right-back with Toulouse, Ajaccio and Morocco, then as coach of FUS Rabat and Wydad AC — 2022 CAF Champions League winner — and of the Morocco national team, which he led to the 2022 World Cup semi-finals and the 2025 Africa Cup of Nations title before resigning in March 2026."
