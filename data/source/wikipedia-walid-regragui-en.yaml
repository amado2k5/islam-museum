reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Regragui's full name as Hoalid Regragui, born on 23 September 1975 in Corbeil-Essonnes, France; a right-back for Toulouse, Ajaccio, Racing Santander, Grenoble and Moghreb Tétouan with 44 Morocco caps; then Morocco assistant coach, FUS Rabat (Throne Cup 2014, Botola 2015-16), Al-Duhail (Qatar Stars League 2019-20) and Wydad AC (Botola and CAF Champions League 2021-22) before taking charge of Morocco on 31 August 2022 — the 2022 World Cup semi-final, first for an African and Arab team, qualification for the 2026 World Cup, the 2025 Africa Cup of Nations title on home soil, and his resignation on 5 March 2026. The article has no personal-life section and makes no statement of his religion anywhere."
