summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن وليد الركراكي؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته ظهيرًا أيمن مع تولوز وأجاكسيو والمنتخب المغربي، ثم مدربًا للفتح والوداد — بطل دوري أبطال أفريقيا 2022 — وللمنتخب المغربي الذي قاده إلى نصف نهائي مونديال 2022 ولقب كأس أمم أفريقيا 2025 قبل استقالته في مارس 2026."
  en: "English Wikipedia article on Walid Regragui; used for entity facts only. It recounts his career as a right-back with Toulouse, Ajaccio and Morocco, then as coach of FUS Rabat and Wydad AC — 2022 CAF Champions League winner — and of the Morocco national team, which he led to the 2022 World Cup semi-finals and the 2025 Africa Cup of Nations title before resigning in March 2026."
  es: "Artículo de la Wikipedia en inglés sobre Walid Regragui; utilizado únicamente para datos sobre la persona. Relata su trayectoria como lateral derecho en el Toulouse, el Ajaccio y la selección de Marruecos, y posteriormente como entrenador del FUS Rabat y del Wydad AC —ganador de la Liga de Campeones de la CAF en 2022— y de la selección nacional de Marruecos, a la que dirigió hasta las semifinales del Mundial de 2022 y la Copa Africana de Naciones de 2025, antes de dimitir en marzo de 2026."
  fr: "Article de Wikipédia en anglais sur Walid Regragui; utilisé uniquement pour les informations relatives à l’entité. Il retrace sa carrière d’arrière droit à Toulouse, Ajaccio et au Maroc, puis son rôle d’entraîneur du FUS Rabat et du Wydad AC (vainqueur de la Ligue des champions de la CAF 2022) et de l’équipe nationale du Maroc, qu’il a menée en demi-finales de la Coupe du monde 2022 et à la victoire lors de la Coupe d’Afrique des Nations 2025 avant de démissionner en mars 2026."
  ur: "ولید ریگرگوئی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ٹولوز، ایجاکیو اور مراکش کے ساتھ رائٹ بیک کے طور پر، پھر FUS رباط اور وائیڈاد AC — 2022 CAF چیمپئنز لیگ کے فاتح — اور مراکش کی قومی ٹیم کے کوچ کے طور پر اپنے کیریئر کا ذکر کیا گیا ہے، جس کی وجہ سے وہ 2022 ورلڈ کپ سیمی فائنل اور 2025 کے افریقہ کپ سے قبل N26 کے مارچ میں ہونے والے ٹائٹل سے مستعفی ہوئے۔"
  tr: "Walid Regragui hakkında İngilizce Wikipedia makalesi; sadece kuruluşun gerçekleri için kullanılmıştır. Kariyeri, Toulouse, Ajaccio ve Fas milli takımında sağ bek olarak oynadı, ardından 2022 CAF Şampiyonlar Ligi şampiyonu Fath ve Wydad'ın antrenörü olarak ve Fas milli takımında 2022 Dünya Kupası yarı finallerine ve 2025 Afrika Uluslar Kupası şampiyonluğuna taşıdı ve Mart 2026'da istifa etti."
  id: "Artikel Wikipedia bahasa Inggris tentang Walid Regragui; digunakan hanya untuk fakta entitas. Kariernya mengisahkan sebagai bek kanan bersama Toulouse, Ajaccio, dan tim nasional Maroko, kemudian sebagai pelatih Fath dan Wydad — juara Liga Champions CAF 2022 — dan tim nasional Maroko yang ia bawa ke semifinal Piala Dunia 2022 dan gelar Piala Afrika 2025 sebelum mengundurkan diri pada Maret 2026."
