summary:
  ar: "كتاب الشيخ محمد علي السايس (ت ١٣٩٦هـ / ١٩٧٦م)، عميد كلية الشريعة (الأسبق)، ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف؛ يتتبع الاجتهاد الفقهي من عصر النبوة إلى عصر الخلفاء والأمويين والعباسيين، ثم يعرض أصول المذاهب الأربعة وعمل العلماء بعد عصر الاجتهاد؛ 116 صفحة، إشراف الأمين العام لمجمع البحوث."
  en: "Muhammad Ali al-Sayis's book in the Scientific Series of the Islamic Research Academy of al-Azhar. It traces ijtihad from the Prophet's age through the Rashidun, Umayyad and Abbasid periods, then sets out the principles of the four Sunni schools and the post-ijtihad period; 116 pages, supervised by the Academy's Secretary-General."
