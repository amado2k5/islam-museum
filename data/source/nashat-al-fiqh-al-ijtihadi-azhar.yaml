label:
  ar: "نشأة الفقه الاجتهادي وأطواره — محمد علي السايس"
  en: "The Emergence of Ijtihad-based Jurisprudence and Its Stages — Muhammad Ali al-Sayis"
summary:
  ar: "كتاب الشيخ محمد علي السايس ⁦(ت ١٣٩٦هـ / ١٩٧٦م)⁩، عميد كلية الشريعة ⁦(الأسبق)⁩، ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف؛ يتتبع الاجتهاد الفقهي من عصر النبوة إلى عصر الخلفاء والأمويين والعباسيين، ثم يعرض أصول المذاهب الأربعة وعمل العلماء بعد عصر الاجتهاد؛ 116 صفحة، إشراف الأمين العام لمجمع البحوث."
  en: "Muhammad Ali al-Sayis's book in the Scientific Series of the Islamic Research Academy of al-Azhar. It traces ijtihad from the Prophet's age through the Rashidun, Umayyad and Abbasid periods, then sets out the principles of the four Sunni schools and the post-ijtihad period; 116 pages, supervised by the Academy's Secretary-General."
  es: "El libro de Muhammad Ali al-Sayis forma parte de la Serie Científica de la Academia de Investigación Islámica de Al-Azhar. Traza la historia del ijtihad desde la época del Profeta, pasando por los períodos Rashidun, Omeya y Abasí, para luego exponer los principios de las cuatro escuelas sunitas y el período posterior al ijtihad. Consta de 116 páginas y fue supervisado por el Secretario General de la Academia."
  fr: "L'ouvrage de Muhammad Ali al-Sayis, publié dans la collection scientifique de l'Académie de recherche islamique d'al-Azhar, retrace l'ijtihad depuis l'époque du Prophète jusqu'aux périodes rashidun, omeyyade et abbasside, puis expose les principes des quatre écoles sunnites et la période post-ijtihad; 116 pages, sous la supervision du secrétaire général de l'Académie."
  ur: "اسلامک ریسرچ اکیڈمی آف الازہر کی سائنسی سیریز میں محمد علی السیس کی کتاب۔ یہ عہد نبوی سے راشدین، اموی اور عباسی ادوار میں اجتہاد کا سراغ لگاتا ہے، پھر چار سنی مکاتب اور بعد از اجتہاد کے اصولوں کا تعین کرتا ہے۔ اکیڈمی کے سیکرٹری جنرل کی زیر نگرانی 116 صفحات۔"
