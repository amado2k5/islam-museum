label:
  ar: "تجريد أسماء الصحابة للذهبي، وعليه حاشية برهان الدين سبط ابن العجمي وحواش أخرى — سلسلة جمعية دار البر للرسائل العلمية (13)، دبي، المجلد الأول (آبي اللحم – عيينة)"
  en: "Tajrid Asma' al-Sahaba of al-Dhahabi, with the gloss of Burhan al-Din Sibt Ibn al-'Ajami and other glosses — Dar al-Birr Society series of academic theses (13), Dubai, vol. 1 (Abi al-Lahm – 'Uyayna)"
summary:
  ar: "طبعة محققة صادرة عن جمعية دار البر بدبي، اعتمد محققها ست نسخ من أربع عشرة وقف عليها، وجعل نسخة مراد ملا (رقم 748) بخط ابن الشحنة سنة 836هـ أصلاً، وفيها حواشي سبط ابن العجمي المنقولة عن نسخته؛ وفيها مقدمة التحقيق في منهج الذهبي ورموزه ووصف النسخ (ص 7-56)، ثم مقدمة الذهبي (ص 64-68 مطبوعة)، ثم التراجم مرقمة من «آبي اللحم الغفاري»."
  en: "A critical edition published by the Dar al-Birr Society, Dubai; the editor used six of the fourteen manuscripts he located, taking as base the Murad Molla copy (no. 748) in the hand of Ibn al-Shihna, dated 836 AH, which carries Sibt Ibn al-'Ajami's glosses copied from his own manuscript; it has the editor's introduction on al-Dhahabi's method and sigla and a description of the manuscripts (pp. 7-56), al-Dhahabi's preface (printed pp. 64-68), then the numbered entries beginning with Abi al-Lahm al-Ghifari."
