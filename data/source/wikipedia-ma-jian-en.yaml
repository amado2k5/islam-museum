  en: "English Wikipedia article on Muhammad Ma Jian; used for entity facts only. It recounts the Hui scholar and translator from Shadian (1906–1978) who studied under Hu Songshan and at Shanghai, was sent to al-Azhar in 1931, taught at Peking University, and translated the whole Qur'an into Chinese."
