reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives him as born in 1906 at Shadian village in Gejiu, Yunnan, and died in 1978; it attests his schooling at Kunming, his two years teaching at Shadian, his study under Hu Songshan at Guyuan, his two years at the Shanghai Islamic Normal School from 1929, his dispatch to al-Azhar in 1931 in the first government-sponsored group, his Arabic book on the history of Islam in China and his Arabic Analects, his 1939 hajj delegation to Mecca, his return that year, his Peking University professorship from 1946, his Qur'an translation (first eight volumes 1945–1949, complete edition posthumously 1981, adopted by the King Fahd Press in 1987) and his stress on the compatibility of Marxism and Islam. It names no school, order or movement for him. The English title 'Ma Jian' is a disambiguation page and is not this article."
