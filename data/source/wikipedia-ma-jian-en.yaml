summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد ماكين الصيني ⁦(ما جيان)⁩؛ تُستخدم لوقائع الكيان فقط. تروي العالم والمترجم الهوي من شاديان (1906–1978) الذي درس عند هو سونغشان وفي شنغهاي، وأُوفد إلى الأزهر سنة 1931، ودرّس في جامعة بكين، وترجم القرآن كاملًا إلى الصينية."
  en: "English Wikipedia article on Muhammad Ma Jian; used for entity facts only. It recounts the Hui scholar and translator from Shadian (1906–1978) who studied under Hu Songshan and at Shanghai, was sent to al-Azhar in 1931, taught at Peking University, and translated the whole Qur'an into Chinese."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad Ma Jian; utilizado únicamente para obtener información sobre la persona. Narra la vida del erudito y traductor hui de Shadian (1906-1978) que estudió con Hu Songshan y en Shanghái, fue enviado a Al-Azhar en 1931, enseñó en la Universidad de Pekín y tradujo el Corán completo al chino."
  fr: "Article de Wikipédia en anglais sur Muhammad Ma Jian; utilisé uniquement à des fins d'information sur l'entité. Il relate l'histoire de ce savant et traducteur Hui originaire de Shadian (1906-1978), qui étudia auprès de Hu Songshan et à Shanghai, fut envoyé à al-Azhar en 1931, enseigna à l'université de Pékin et traduisit l'intégralité du Coran en chinois."
  ur: "محمد ما جیان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں شادیان (1906-1978) سے تعلق رکھنے والے ہوئی اسکالر اور مترجم کا ذکر ہے جس نے ہو سونگشان کے تحت اور شنگھائی میں تعلیم حاصل کی، اسے 1931 میں الازہر بھیجا گیا، پیکنگ یونیورسٹی میں پڑھایا گیا، اور پورے قرآن کا چینی زبان میں ترجمہ کیا۔"
  tr: "Çinli Muhammed Makin (Ma Jian) hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kitap, Hu Songshan ile ve Şanghay'da eğitim görmüş ve 1931'de El-Ezher'e gönderilen, Pekin Üniversitesi'nde eğitim gören ve Kur'an'ın tamamını Çince'ye çeviren bilgin ve çevirmen Hui Shadian'ı (1906–1978) anlatmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad Makin (Ma Jian) dari Tiongkok; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan seorang cendekiawan dan penerjemah Hui Shadian (1906–1978), yang belajar dengan Hu Songshan dan di Shanghai, dikirim ke Al-Azhar pada tahun 1931, belajar di Universitas Peking, dan menerjemahkan seluruh Al-Qur'an ke dalam bahasa Tionghoa."
