  en: "al-Shatibi, al-Muwafaqat, vol. 1 (text established and annotated by Abu Ubayda Mashhur ibn Hasan Al Salman, foreword by Bakr Abu Zayd, Dar Ibn Affan)"
  ur: "شاطبی، الموافقات، جلد اول (ضبطِ متن و تعلیق ابو عبیدہ مشہور بن حسن آل سلمان، تقدیم بکر ابو زید، دار ابن عفان)"
summary:
  ar: "المجلد الأول من طبعة دار ابن عفان لـ«الموافقات» للعلامة أبي إسحاق إبراهيم بن موسى بن محمد اللخمي الشاطبي (ت 790هـ)، بتقديم الشيخ بكر بن عبد الله أبو زيد، ضبط نصه وقدم له وعلق عليه وخرّج أحاديثه أبو عبيدة مشهور بن حسن آل سلمان؛ تجمع الحواشي تعليقات دراز (د) والخضر حسين (خ) وماء العينين (ماء)؛ يبدأ بخطبة المؤلف ثم المقدمات."
  en: "Volume 1 of the Dar Ibn Affan edition of al-Muwafaqat by Abu Ishaq Ibrahim ibn Musa ibn Muhammad al-Lakhmi al-Shatibi (d. 790 AH), with a foreword by Shaykh Bakr ibn Abd Allah Abu Zayd, text established, introduced, annotated and with hadith references by Abu Ubayda Mashhur ibn Hasan Al Salman; the notes gather the annotations of Draz (D), al-Khidr Husayn (Kh) and Ma' al-Aynayn (Ma'); it opens with the author's preface and then the introductions."
  ur: "دار ابن عفان کے «الموافقات» ایڈیشن کی جلد اول، از علامہ ابو اسحاق ابراہیم بن موسیٰ بن محمد لخمی شاطبی (م 790ھ)، تقدیم شیخ بکر بن عبد اللہ ابو زید، ضبطِ متن، مقدمہ، تعلیق اور تخریجِ احادیث ابو عبیدہ مشہور بن حسن آل سلمان؛ حواشی میں دراز (د)، الخضر حسین (خ) اور ماء العینین (ماء) کی تعلیقات جمع ہیں؛ یہ مصنف کے خطبے اور پھر مقدمات سے شروع ہوتی ہے۔"
