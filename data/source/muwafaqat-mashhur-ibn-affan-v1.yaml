label:
  ar: "الشاطبي، الموافقات، المجلد الأول ⁦(ضبط نصه وعلق عليه أبو عبيدة مشهور بن حسن آل سلمان، تقديم بكر أبو زيد، دار ابن عفان)⁩"
  en: "al-Shatibi, al-Muwafaqat, vol. 1 (text established and annotated by Abu Ubayda Mashhur ibn Hasan Al Salman, foreword by Bakr Abu Zayd, Dar Ibn Affan)"
  ur: "شاطبی، الموافقات، جلد اول ⁦(ضبطِ متن و تعلیق ابو عبیدہ مشہور بن حسن آل سلمان، تقدیم بکر ابو زید، دار ابن عفان)⁩"
summary:
  ar: "المجلد الأول من طبعة دار ابن عفان لـ«الموافقات» للعلامة أبي إسحاق إبراهيم بن موسى بن محمد اللخمي الشاطبي ⁦(ت 790هـ)⁩، بتقديم الشيخ بكر بن عبد الله أبو زيد، ضبط نصه وقدم له وعلق عليه وخرّج أحاديثه أبو عبيدة مشهور بن حسن آل سلمان؛ تجمع الحواشي تعليقات دراز ⁦(د)⁩ والخضر حسين ⁦(خ)⁩ وماء العينين ⁦(ماء)⁩؛ يبدأ بخطبة المؤلف ثم المقدمات."
  en: "Volume 1 of the Dar Ibn Affan edition of al-Muwafaqat by Abu Ishaq Ibrahim ibn Musa ibn Muhammad al-Lakhmi al-Shatibi (d. 790 AH), with a foreword by Shaykh Bakr ibn Abd Allah Abu Zayd, text established, introduced, annotated and with hadith references by Abu Ubayda Mashhur ibn Hasan Al Salman; the notes gather the annotations of Draz (D), al-Khidr Husayn (Kh) and Ma' al-Aynayn (Ma'); it opens with the author's preface and then the introductions."
  ur: "دار ابن عفان کے «الموافقات» ایڈیشن کی جلد اول، از علامہ ابو اسحاق ابراہیم بن موسیٰ بن محمد لخمی شاطبی ⁦(م 790ھ)⁩، تقدیم شیخ بکر بن عبد اللہ ابو زید، ضبطِ متن، مقدمہ، تعلیق اور تخریجِ احادیث ابو عبیدہ مشہور بن حسن آل سلمان؛ حواشی میں دراز ⁦(د)⁩، الخضر حسین ⁦(خ)⁩ اور ماء العینین ⁦(ماء)⁩ کی تعلیقات جمع ہیں؛ یہ مصنف کے خطبے اور پھر مقدمات سے شروع ہوتی ہے۔"
  es: "Volumen 1 de la edición Dar Ibn Affan de al-Muwafaqat de Abu Ishaq Ibrahim ibn Musa ibn Muhammad al-Lakhmi al-Shatibi (m. 790 AH), con un prólogo de Shaykh Bakr ibn Abd Allah Abu Zayd, texto establecido, introducido, anotado y con referencias de hadices por Abu Ubayda Mashhur ibn Hasan Al Salman; las notas reúnen las anotaciones de Draz (D), al-Khidr Husayn (Kh) y Ma' al-Aynayn (Ma'); comienza con el prefacio del autor y luego las introducciones."
  fr: "Volume 1 de l'édition Dar Ibn Affan d'al-Muwafaqat par Abu Ishaq Ibrahim ibn Musa ibn Muhammad al-Lakhmi al-Shatibi (d. 790 AH), avec une préface de Shaykh Bakr ibn Abd Allah Abu Zayd, texte établi, introduit, annoté et avec des références aux hadiths par Abu Ubayda Mashhur ibn Hasan Al Salman; les notes rassemblent les annotations de Draz (D), al-Khidr Husayn (Kh) et Ma' al-Aynayn (Ma'); il s'ouvre sur la préface de l'auteur puis les introductions."
  tr: "Dar İbn Affan baskısının ilk cildi, âlim Ebu İshaq İbrahim ibn Musa ibn Muhammed el-Lakhmi el-Şatibi (ö. 790 H.) tarafından Şeyh Bekir bin Abdullah Ebu Zeyd tarafından tanıtılmıştır. Metni düzenlenmiş, tanıtılmış, açıklamalar yapılmış ve hadisleri Ebu Ubeyde Maşhur ibn Hasan Al Salman tarafından çıkarılmıştır; dipnotlar Daraz (d), el-Hidr Hüseyin (el yazması) ve Ma' al-''Aynayn (su) tarafından toplanmıştır; yazarın vaazıyla başlar ve ardından girişler gelir."
  id: "Jilid pertama edisi Dar Ibn Affan dari 'Al-Muwafaqat' oleh ulama Abu Ishaq Ibrahim ibn Musa ibn Muhammad al-Lakhmi al-Shatibi (wafat 790 H), diperkenalkan oleh Sheikh Bakr ibn Abdullah Abu Zayd. Teksnya diedit, diperkenalkan, diberi anotasi, dan hadits-haditnya diambil oleh Abu Ubaidah Mashhoor ibn Hasan Al Salman; catatan kaki dikumpulkan oleh Daraz (d), al-Khidr Husayn (manuskrip), dan Ma' al-'aynayn (air); dimulai dengan khotbah penulis diikuti dengan pengantar."
