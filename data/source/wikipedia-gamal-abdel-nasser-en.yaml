summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جمال عبد الناصر؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في الإسكندرية سنة 1918، وقيادته ثورة 1952 وتنظيم الضباط الأحرار، ورئاسته لمصر، وتأميم قناة السويس وأزمة 1956، والوحدة مع سوريا، وحرب 1967 واستقالته وعودته، ووفاته بنوبة قلبية سنة 1970 وجنازته التي حضرها ملايين المشيعين ودفنه في مسجده بالقاهرة."
  en: "English Wikipedia article on Gamal Abdel Nasser; used for entity facts only. It recounts his birth in Alexandria in 1918, his leadership of the Free Officers and the 1952 revolution, his presidency of Egypt, the Suez nationalization and the 1956 crisis, the union with Syria, the 1967 war, his resignation and return, his death from a heart attack in 1970, the funeral attended by millions, and his burial at his mosque in Cairo."
  es: "Artículo de la Wikipedia en inglés sobre Gamal Abdel Nasser; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Alejandría en 1918, su liderazgo de los Oficiales Libres y la revolución de 1952, su presidencia de Egipto, la nacionalización del Canal de Suez y la crisis de 1956, la unión con Siria, la guerra de 1967, su dimisión y regreso, su muerte por un ataque al corazón en 1970, el funeral al que asistieron millones de personas y su entierro en su mezquita de El Cairo."
  fr: "Article de Wikipédia en anglais sur Gamal Abdel Nasser; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Alexandrie en 1918, son rôle à la tête des Officiers libres et la révolution de 1952, sa présidence de l’Égypte, la nationalisation du canal de Suez et la crise de 1956, l’union avec la Syrie, la guerre de 1967, sa démission et son retour, sa mort d’une crise cardiaque en 1970, ses funérailles qui ont rassemblé des millions de personnes et son inhumation dans sa mosquée du Caire."
  ur: "جمال عبدالناصر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1918 میں اسکندریہ میں ان کی پیدائش، فری آفیسرز کی ان کی قیادت اور 1952 کے انقلاب، مصر کی صدارت، سویز کی قومیت اور 1956 کا بحران، شام کے ساتھ اتحاد، 1967 کی جنگ، ان کا استعفیٰ اور واپسی، 1970 میں دل کا دورہ پڑنے سے ان کی موت، جنازہ اور مسجد میں لاکھوں افراد نے شرکت کی۔"
