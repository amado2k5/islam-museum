reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 27 October 2026 and checked against the recorded revision. It gives Nasser as born in Alexandria on 15 January 1918, leader of the Free Officers, head of the Revolutionary Command Council after the 1952 revolution, prime minister from 1954 and formally elected president in June 1956; the Suez nationalization and the 1956 war; the United Arab Republic (1958–61); the socialist measures of 1961–62; the North Yemen war; the June 1967 defeat, his resignation and popular reinstatement; the War of Attrition; and his death from a heart attack on 28 September 1970 at the close of the Arab League summit, a funeral in Cairo that drew five to six million mourners, and burial at the Nasr (Abdel Nasser) Mosque in Cairo. Its infobox carries no religion field and its text names no school for him; its discussions of al-Azhar and Sunni Islam concern his state policy, not his own affiliation."
