  ar: "مقالة ويكيبيديا الإنجليزية عن جمال عبد الناصر؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في الإسكندرية سنة 1918، وقيادته ثورة 1952 وتنظيم الضباط الأحرار، ورئاسته لمصر، وتأميم قناة السويس وأزمة 1956، والوحدة مع سوريا، وحرب 1967 واستقالته وعودته، ووفاته بنوبة قلبية سنة 1970 وجنازته التي حضرها ملايين المشيعين ودفنه في مسجده بالقاهرة."
  en: "English Wikipedia article on Gamal Abdel Nasser; used for entity facts only. It recounts his birth in Alexandria in 1918, his leadership of the Free Officers and the 1952 revolution, his presidency of Egypt, the Suez nationalization and the 1956 crisis, the union with Syria, the 1967 war, his resignation and return, his death from a heart attack in 1970, the funeral attended by millions, and his burial at his mosque in Cairo."
