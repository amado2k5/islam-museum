reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id. It gives him as Moubarak (Mbark) Boussoufa, born 15 August 1984 in Amsterdam, an attacking midfielder or winger who came through Ajax and Chelsea, then played for Gent, Anderlecht (Belgian Footballer of the Year in 2006, 2009 and 2010), Anzhi Makhachkala, Lokomotiv Moscow (scoring in the 2015 Russian Cup final), Al Jazira (UAE league title 2016-17), Al-Shabab and Al-Sailiya; 70 caps and 8 goals for Morocco, a starter in all three of their 2018 World Cup matches, retiring from internationals in July 2019. A March 2011 move to Terek Grozny fell through before he joined Anzhi. It makes no statement of his religion in its text or infobox."
