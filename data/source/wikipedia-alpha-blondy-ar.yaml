summary:
  ar: "مقالة ويكيبيديا العربية «ألفا بلوندي»؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد لأب مسلم وأم مسيحية وأن جدته علّمته احترام جميع الأديان — أي خلفية أسرية لا انتماء شخصيًا."
  en: "Arabic Wikipedia article «ألفا بلوندي» on Alpha Blondy; used for entity facts only. It says he was born to a Muslim father and a Christian mother and that his grandmother taught him to respect all religions — family background, not a personal affiliation."
  es: "Artículo de Wikipedia en árabe «ألفا بلوندي» sobre Alpha Blondy; se utiliza únicamente para obtener información sobre la persona. Indica que nació de padre musulmán y madre cristiana, y que su abuela le enseñó a respetar todas las religiones (antecedentes familiares, no afiliación personal)."
  fr: "L'article Wikipédia en arabe « ألفا بلوندي » sur Alpha Blondy; utilisé uniquement à titre informatif. Il indique qu'il est né d'un père musulman et d'une mère chrétienne et que sa grand-mère lui a inculqué le respect de toutes les religions — il s'agit d'un contexte familial, et non d'une appartenance personnelle."
  ur: "الفا بلونڈی پر عربی ویکیپیڈیا مضمون «ألفا بلوندي»؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا کہنا ہے کہ وہ ایک مسلمان باپ اور ایک عیسائی ماں کے ہاں پیدا ہوا تھا اور اس کی دادی نے اسے تمام مذاہب کا احترام کرنا سکھایا تھا - خاندانی پس منظر، ذاتی وابستگی نہیں۔"
  tr: "Arapça Vikipedi makalesi \"Alfa Sarışın\"; sadece varlık gerçekleri için kullanılmıştır. Unutmayın ki Müslüman bir baba ve Hristiyan bir anneden doğmuştu ve büyükannesi ona tüm dinlere saygı öğretti — yani kişisel bağlılık değil, aile geçmişi."
  id: "Artikel Wikipedia Arab \"Alpha Blondie\"; hanya digunakan untuk fakta entitas. Ingat bahwa dia lahir dari ayah Muslim dan ibu Kristen, dan neneknya mengajarinya menghormati semua agama — yaitu latar belakang keluarga, bukan afiliasi pribadi."
