reliability_note: "Platform statistics aggregator, not a museum-verified fact: the figure of 526,000 subscribers (43,091,333 total views, 3,504 videos) was read from vidIQ on 5 November 2026 and is used only as a dated audience figure. The page also records that the channel was created on 11 June 2009 and that its channel country is set to the United Arab Emirates; its most-viewed videos are Ethiopian Amharic dawah programmes (Ustaz Nuru Turki, Ustaz Bedru Hussein), one of them branded Bilal TV. vidIQ's estimated earnings are modelled and are not used. Note the channel's handle is @nejashitva, as given in the channel's own video descriptions; vidIQ has no page for the handle @NejashiTv."
