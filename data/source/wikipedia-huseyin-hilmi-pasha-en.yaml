reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by revision id with content verified identical. The article names no religion or school for him personally: it records his madrasa studies on Lesbos, that an ancestor had converted to Islam — family background, cited to the 1920 Peace Handbooks — and his joining a Freemasonry lodge, an affiliation, none of which attests a school of his own. The article is internally split: the lead gives '1 April 1855 – 1922' while the body, citing Aksun (2010) and Uzunçarşılı (1932), gives the birth as September 1855 at Sarlıca on Lesbos, and two books quoted in the lead itself give his years as 1855–1923 against the body's death in Vienna in 1922 and burial at Beşiktaş, Istanbul."
