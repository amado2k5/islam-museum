summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إميلي رويته، المولودة سلمة بنت سعيد سلطان ⁦(30 أغسطس 1844 في زنجبار – 29 فبراير 1924 في يينا)⁩، أميرة زنجبار وعُمان وأصغر أبناء سعيد بن سلطان الستة والثلاثين ومؤلفة «مذكرات أميرة عربية» (1886)؛ يذكر صندوق معلوماتها أن دينها كان الإسلام الإباضي ثم الكاثوليكية الرومانية، وأنها تعمّدت في عدن قبل زواجها في 30 مايو 1867."
  en: "English Wikipedia article on Emily Ruete, born Salme bint Said Sultan (30 August 1844 at Zanzibar – 29 February 1924 at Jena), Princess of Zanzibar and Oman, youngest of Said bin Sultan's 36 children and author of Memoirs of an Arabian Princess (1886); its infobox gives her religion as Ibadi Islam, later Roman Catholicism, and its text records her baptism at Aden before her marriage on 30 May 1867."
  es: "Artículo de la Wikipedia en inglés sobre Emily Ruete, nacida Salme bint Said Sultan (30 de agosto de 1844 en Zanzíbar – 29 de febrero de 1924 en Jena), princesa de Zanzíbar y Omán, la menor de los 36 hijos de Said bin Sultan y autora de Memorias de una princesa árabe (1886); su ficha informativa indica que su religión era el islam ibadí, más tarde el catolicismo romano, y su texto registra su bautismo en Adén antes de su matrimonio el 30 de mayo de 1867."
  fr: "L'article de Wikipédia en anglais sur Emily Ruete, née Salme bint Said Sultan (30 août 1844 à Zanzibar – 29 février 1924 à Jena), princesse de Zanzibar et d'Oman, la plus jeune des 36 enfants de Said bin Sultan et auteure de Mémoires d'une princesse arabe (1886); son infobox indique que sa religion était l'islam ibadite, puis le catholicisme romain, et son texte relate son baptême à Aden avant son mariage le 30 mai 1867."
