summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إميلي رويته، المولودة سلمة بنت سعيد سلطان (30 أغسطس 1844 في زنجبار – 29 فبراير 1924 في يينا)، أميرة زنجبار وعُمان وأصغر أبناء سعيد بن سلطان الستة والثلاثين ومؤلفة «مذكرات أميرة عربية» (1886)؛ يذكر صندوق معلوماتها أن دينها كان الإسلام الإباضي ثم الكاثوليكية الرومانية، وأنها تعمّدت في عدن قبل زواجها في 30 مايو 1867."
  en: "English Wikipedia article on Emily Ruete, born Salme bint Said Sultan (30 August 1844 at Zanzibar – 29 February 1924 at Jena), Princess of Zanzibar and Oman, youngest of Said bin Sultan's 36 children and author of Memoirs of an Arabian Princess (1886); its infobox gives her religion as Ibadi Islam, later Roman Catholicism, and its text records her baptism at Aden before her marriage on 30 May 1867."
