  ar: "مقالة ويكيبيديا الإنجليزية عن علي مهدي محمد؛ تُستخدم لوقائع الكيان فقط. تروي ولادته سنة 1939 في جوهر، وعمله التجاري، ورئاسته للصومال (1991–2000) خلفا لمحمد سياد بري بعد إسقاطه، ومنافسته محمد فرح عيديد، ووفاته في نيروبي في 10 مارس 2021 بكوفيد-19. لا يذكر النص دينه شخصيا ولا مدرسته."
  en: "English Wikipedia article on Ali Mahdi Muhammad; used for entity facts only. It recounts his birth in 1939 at Jowhar, his business career, his presidency of Somalia (1991–2000) succeeding the deposed Mohamed Siad Barre, his rivalry with Mohamed Farrah Aidid, and his death in Nairobi on 10 March 2021 after contracting COVID-19. The text does not discuss his own religion or school."
