summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي مهدي محمد؛ تُستخدم لوقائع الكيان فقط. تروي ولادته سنة 1939 في جوهر، وعمله التجاري، ورئاسته للصومال (1991–2000) خلفا لمحمد سياد بري بعد إسقاطه، ومنافسته محمد فرح عيديد، ووفاته في نيروبي في 10 مارس 2021 بكوفيد-19. لا يذكر النص دينه شخصيا ولا مدرسته."
  en: "English Wikipedia article on Ali Mahdi Muhammad; used for entity facts only. It recounts his birth in 1939 at Jowhar, his business career, his presidency of Somalia (1991–2000) succeeding the deposed Mohamed Siad Barre, his rivalry with Mohamed Farrah Aidid, and his death in Nairobi on 10 March 2021 after contracting COVID-19. The text does not discuss his own religion or school."
  es: "Artículo de la Wikipedia en inglés sobre Ali Mahdi Muhammad; utilizado únicamente para datos biográficos. Relata su nacimiento en 1939 en Jowhar, su trayectoria empresarial, su presidencia de Somalia (1991-2000) tras suceder al depuesto Mohamed Siad Barre, su rivalidad con Mohamed Farrah Aidid y su fallecimiento en Nairobi el 10 de marzo de 2021 a causa de la COVID-19. El texto no menciona su religión ni su escuela."
  fr: "Article de Wikipédia en anglais consacré à Ali Mahdi Muhammad; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance en 1939 à Jowhar, sa carrière dans les affaires, sa présidence de la Somalie (1991-2000) succédant à Mohamed Siad Barre, sa rivalité avec Mohamed Farrah Aidid et son décès à Nairobi le 10 mars 2021 des suites de la COVID-19. Le texte n’aborde ni sa religion ni son école."
  ur: "علی مہدی محمد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1939 میں جوہر میں ان کی پیدائش، ان کے کاروباری کیریئر، معزول محمد سیاد بارے کے بعد صومالیہ کی صدارت (1991–2000)، محمد فرح عید کے ساتھ ان کی دشمنی، اور 10 مارچ 2021 کو نیروبی میں COVID-19 کا معاہدہ کرنے کے بعد ان کی موت کا ذکر ہے۔ متن میں اس کے اپنے مذہب یا مکتب پر بحث نہیں کی گئی ہے۔"
