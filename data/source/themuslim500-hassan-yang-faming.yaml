  fr: "Profil de Hassan Yang Faming dans Muslim 500: Hassan Yang Faming est président de l’Association islamique de Chine, un organisme lié au gouvernement qui assure la liaison avec la population musulmane de Chine, estimée de façon prudente à environ 30 millions de personnes issues de divers horizons ethniques."
  ur: "حسن یانگ فیمنگ کا مسلم 500 پروفائل: حسن یانگ فیمنگ چائنا اسلامک ایسوسی ایشن کے صدر ہیں، جو حکومت سے منسلک ایک ادارہ ہے جو چین کی مسلم آبادی سے تعلق رکھتا ہے، جس کا اندازہ قدامت پسندانہ طور پر مختلف نسلی پس منظر سے تعلق رکھنے والے تقریباً 30 ملین ہے۔"
