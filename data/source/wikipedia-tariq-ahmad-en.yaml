summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن طارق محمود أحمد، البارون أحمد أوف ويمبلدون: رجل أعمال وسياسي محافظ بريطاني وُلد في لامبث بلندن سنة 1968. تذكر المقالة صراحة أنه «جزء من الجماعة الإسلامية الأحمدية» وأنه شغل منصب نائب رئيس منظمة خدام الأحمدية، منظمة الشباب الأحمدية البريطانية."
  en: "English Wikipedia article on Tariq Mahmood Ahmad, Baron Ahmad of Wimbledon, the British Conservative businessman and politician born in Lambeth, London in 1968. The article states in its own text that he 'is a part of the Ahmadiyya Muslim Community' and served as a vice-president of Khuddam-ul Ahmadiyya, the British Ahmadi Muslim youth organisation."
  es: "Artículo de la Wikipedia en inglés sobre Tariq Mahmood Ahmad, barón Ahmad de Wimbledon, empresario y político conservador británico nacido en Lambeth, Londres, en 1968. El artículo afirma en su texto que «forma parte de la comunidad musulmana Ahmadiyya» y que fue vicepresidente de Khuddam-ul Ahmadiyya, la organización juvenil musulmana Ahmadi británica."
  fr: "Article de Wikipédia en anglais sur Tariq Mahmood Ahmad, baron Ahmad de Wimbledon, homme d'affaires et homme politique conservateur britannique né à Lambeth, Londres, en 1968. L'article indique dans son propre texte qu'il « fait partie de la communauté musulmane ahmadie » et a été vice-président de Khuddam-ul Ahmadiyya, l'organisation de jeunesse musulmane ahmadie britannique."
  ur: "برطانوی کنزرویٹو تاجر اور سیاست دان طارق محمود احمد، ومبلڈن کے بیرن احمد پر انگریزی ویکیپیڈیا کا مضمون 1968 میں لندن میں پیدا ہوئے۔ مضمون اپنے متن میں کہتا ہے کہ وہ 'احمدیہ مسلم کمیونٹی کا حصہ ہیں' اور خدام الاحمدیہ یا برطانوی نوجوان کے نائب صدر کے طور پر خدمات انجام دیں۔"
  tr: "Tariq Mahmoud Ahmed hakkında İngilizce Wikipedia makalesi, Wimbledon Baronu Ahmed: 1968'de Lambeth, Londra'da doğmuş İngiliz iş insanı ve Muhafazakar politikacı. Makalede açıkça belirtilir ki, kendisi \"Ahmadiyya İslam Topluluğu'nun bir parçası\" ve Ahmadiyya Hizmetkarlar Organizasyonu'nun (İngiliz Ahmadiyya Gençlik Örgütü) başkan yardımcısı olarak görev yapmıştır."
  id: "Artikel Wikipedia bahasa Inggris tentang Tariq Mahmoud Ahmed, Baron Ahmed dari Wimbledon: Pengusaha Inggris dan politisi Konservatif yang lahir di Lambeth, London pada tahun 1968. Artikel tersebut secara eksplisit menyatakan bahwa ia adalah \"bagian dari Komunitas Islam Ahmadiyya\" dan pernah menjabat sebagai Wakil Presiden Organisasi Pelayan Ahmadiyya, Organisasi Pemuda Ahmadiyya Inggris."
