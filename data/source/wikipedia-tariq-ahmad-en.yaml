reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Used for his birth name Tariq Mahmood Ahmad, his birth on 3 April 1968 in Lambeth, London, his Punjabi-speaking Pakistani immigrant parents, his banking and finance career, his council and parliamentary career, and his ministerial posts to 2024. For faith, the article states in its own text that he is part of the Ahmadiyya Muslim Community and was a national vice-president of its youth organisation from 2003, and that from 1999 to 2008 he served as vice-president of AMYA (Khuddam-ul Ahmadiyya), cited to his own official website's community page - an attestation of community membership for the man himself, independent of the Evangelical Alliance text also registered for this record."
