summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد بن عبد الرحمن بن جاسم آل ثاني ⁦(وُلد في 1 تشرين الثاني 1980 في الدوحة)⁩، رئيس وزراء قطر منذ 2023 ووزير خارجيتها منذ 2016؛ تذكر دراسته في جامعة قطر ومسيرته في المجلس الأعلى لشؤون الأسرة ووزارة التجارة ورئاسته جهاز قطر للاستثمار (2018–2023)."
  en: "English Wikipedia article on Mohammed bin Abdulrahman bin Jassim Al Thani (born 1 November 1980 in Doha), Prime Minister of Qatar since 2023 and its foreign minister since 2016; it records his Qatar University degree, his career at the Supreme Council for Family Affairs and the trade ministry, and his chairmanship of the Qatar Investment Authority (2018-2023)."
  es: "Artículo en inglés de la Wikipedia sobre Mohammed bin Abdulrahman bin Jassim Al Thani (nacido el 1 de noviembre de 1980 en Doha), Primer Ministro de Qatar desde 2023 y ministro de Asuntos Exteriores desde 2016; en él se recoge su título de la Universidad de Qatar, su trayectoria profesional en el Consejo Supremo de Asuntos Familiares y el Ministerio de Comercio, y su presidencia de la Autoridad de Inversiones de Qatar (2018-2023)."
  fr: "Article de Wikipédia en anglais sur Mohammed bin Abdulrahman bin Jassim Al Thani (né le 1er novembre 1980 à Doha), Premier ministre du Qatar depuis 2023 et ministre des Affaires étrangères depuis 2016; il relate son diplôme de l'Université du Qatar, sa carrière au Conseil suprême des affaires familiales et au ministère du Commerce, ainsi que sa présidence de l'Autorité d'investissement du Qatar (2018-2023)."
  ur: "محمد بن عبدالرحمن بن جاسم الثانی ⁦(پیدائش 1 نومبر 1980 دوحہ میں)⁩، 2023 سے قطر کے وزیر اعظم اور 2016 سے اس کے وزیر خارجہ پر انگریزی ویکیپیڈیا کا مضمون؛ اس میں ان کی قطر یونیورسٹی کی ڈگری، سپریم کونسل برائے خاندانی امور اور وزارت تجارت میں ان کے کیریئر اور قطر انویسٹمنٹ اتھارٹی (2018-2023) کی ان کی چیئرمین شپ کو ریکارڈ کیا گیا ہے۔"
  tr: "2023'ten beri Katar Başbakanı ve 2016'dan beri Dışişleri Bakanı olan Mohammed bin Abdulrahman bin Jassim Al Thani (1 Kasım 1980, Doha doğumlu) hakkında İngilizce Wikipedia makalesi; Katar Üniversitesi'ndeki eğitimi, Aile İşleri Yüksek Konseyi, Ticaret Bakanlığı'ndaki kariyeri ve Katar Yatırım Otoritesi başkanlığı (2018–2023) döneminden bahsedilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Mohammed bin Abdulrahman bin Jassim Al Thani (lahir 1 November 1980 di Doha), Perdana Menteri Qatar sejak 2023 dan Menteri Luar Negeri sejak 2016; artikel ini menyebutkan studinya di Universitas Qatar, kariernya di Dewan Tertinggi untuk Urusan Keluarga, Kementerian Perdagangan, dan kepemimpinannya di Otoritas Investasi Qatar (2018–2023)."
