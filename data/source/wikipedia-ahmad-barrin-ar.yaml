summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0639\u0646 \u0627\u0644\u0645\u0646\u0634\u062f \u0627\u0644\u0635\u0639\u064a\u062f\u064a \u0623\u062d\u0645\u062f \u0628\u0631\u064a\u0646\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u0633\u0644\u0648\u0627 \u0628\u062d\u0631\u064a \u0628\u0623\u0633\u0648\u0627\u0646 \u0641\u064a 1939 \u0643\u0641\u064a\u0641\u064b\u0627\u060c \u0648\u0644\u064a\u0633\u0627\u0646\u0633 \u0623\u0635\u0648\u0644 \u0627\u0644\u062f\u064a\u0646 \u0645\u0646 \u0627\u0644\u0623\u0632\u0647\u0631\u060c \u0648\u0627\u0633\u062a\u0642\u0631\u0627\u0631\u0647 \u0641\u064a \u0627\u0644\u062f\u064a\u0631 \u0628\u0625\u0633\u0646\u0627\u060c \u0648\u0623\u0633\u0644\u0648\u0628\u0647 \u0641\u064a \u0627\u0644\u0645\u0648\u0627\u0644 \u0648\u0627\u0644\u0645\u062f\u064a\u062d \u0648\u0631\u0648\u0627\u064a\u0629 \u0627\u0644\u0633\u064a\u0631\u060c \u0648\u0625\u062d\u064a\u0627\u0624\u0647 \u0627\u0644\u0644\u064a\u0627\u0644\u064a \u0627\u0644\u0642\u0628\u0637\u064a\u0629\u060c \u0648\u062a\u0639\u0627\u0648\u0646\u0647 \u0645\u0639 \u0627\u0628\u0646 \u0623\u062e\u062a\u0647 \u0645\u062d\u0645\u062f \u0627\u0644\u0639\u062c\u0648\u0632\u060c \u0648\u0648\u0641\u0627\u062a\u0647 \u0641\u064a 1 \u064a\u0648\u0644\u064a\u0648 2015\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0627\u0644\u0623\u0647\u0631\u0627\u0645 \u0648\u0627\u0644\u0634\u0631\u0648\u0642 \u0648\u0627\u0644\u064a\u0648\u0645 \u0627\u0644\u0633\u0627\u0628\u0639 \u0648\u0627\u0644\u0648\u0637\u0646 \u0648\u0631\u0635\u064a\u064122."
  en: "Arabic Wikipedia article on the Upper Egyptian munshid Ahmad Barrin; entity facts only: born blind at Salwa Bahari, Aswan, in 1939, a licence in theology from al-Azhar, his settling at al-Dayr near Esna, his mawwal, praise songs and folk epics, his singing at Coptic nights, his partnership with his nephew Muhammad al-Agouz, and his death on 1 July 2015; it cites al-Ahram, al-Shorouk, Youm7, El Watan and Raseef22."
