summary:
  ar: "مقالة ويكيبيديا العربية عن المنشد الصعيدي أحمد برين؛ لوقائع الكيان فقط: مولده في سلوا بحري بأسوان في 1939 كفيفًا، وليسانس أصول الدين من الأزهر، واستقراره في الدير بإسنا، وأسلوبه في الموال والمديح ورواية السير، وإحياؤه الليالي القبطية، وتعاونه مع ابن أخته محمد العجوز، ووفاته في 1 يوليو 2015؛ وتستند إلى الأهرام والشروق واليوم السابع والوطن ورصيف22."
  en: "Arabic Wikipedia article on the Upper Egyptian munshid Ahmad Barrin; entity facts only: born blind at Salwa Bahari, Aswan, in 1939, a licence in theology from al-Azhar, his settling at al-Dayr near Esna, his mawwal, praise songs and folk epics, his singing at Coptic nights, his partnership with his nephew Muhammad al-Agouz, and his death on 1 July 2015; it cites al-Ahram, al-Shorouk, Youm7, El Watan and Raseef22."
  es: "Artículo de Wikipedia en árabe sobre el munshid del Alto Egipto Ahmad Barrin; solo datos sobre la persona: nació ciego en Salwa Bahari, Asuán, en 1939, obtuvo una licenciatura en teología de al-Azhar, se estableció en al-Dayr cerca de Esna, su mawwal, canciones de alabanza y epopeyas populares, cantó en las noches coptas, se asoció con su sobrino Muhammad al-Agouz y falleció el 1 de julio de 2015; cita a al-Ahram, al-Shorouk, Youm7, El Watan y Raseef22."
  fr: "Article de Wikipédia en arabe sur le munshid de Haute-Égypte Ahmad Barrin; faits concernant l'entité uniquement: né aveugle à Salwa Bahari, Assouan, en 1939, licence en théologie d'al-Azhar, son installation à al-Dayr près d'Esna, son mawwal, ses chants de louange et ses épopées populaires, ses chants lors des nuits coptes, son partenariat avec son neveu Muhammad al-Agouz et sa mort le 1er juillet 2015; il cite al-Ahram, al-Shorouk, Youm7, El Watan et Raseef22."
  ur: "عربی ویکیپیڈیا مضمون بالائی مصری منشد احمد بارین پر؛ صرف ہستی کے حقائق: 1939 میں سلوا بہاری، اسوان میں نابینا پیدا ہوئے، الازہر سے علم الٰہیات کا لائسنس، اسنا کے قریب الدیر میں اس کا قیام، اس کے موال، حمد کے گیت اور لوک مہاکاوی، قبطی راتوں میں اس کا گانا، اپنے بھتیجے محمد الغوز کے ساتھ اس کی شراکت؛ 15 جولائی کو اس کی موت اور 15 جولائی کو اس میں الاحرام، الشروق، یوم7، الوطن اور رسیف22 کا حوالہ دیا گیا ہے۔"
