summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جودت يلماز ⁦(وُلد في 1 نيسان 1967 في شبانكوي ببينكل لأسرة زازية)⁩، نائب رئيس تركيا منذ 2023؛ تذكر دراسته في جامعة الشرق الأوسط التقنية ودنفر وبيلكنت وعمله في هيئة تخطيط الدولة ووزارة التنمية."
  en: "English Wikipedia article on Cevdet Yılmaz (born 1 April 1967 in Şabanköy, Bingöl, to a Zaza family), Vice President of Turkey since 2023; it records his studies at Middle East Technical University, Denver and Bilkent, his State Planning Organization career and his development ministry."
  es: "Artículo en inglés de la Wikipedia sobre Cevdet Yılmaz (nacido el 1 de abril de 1967 en Şabanköy, Bingöl, en el seno de una familia Zaza), vicepresidente de Turquía desde 2023; en él se recogen sus estudios en la Universidad Técnica de Oriente Medio, Denver y Bilkent, su trayectoria profesional en la Organización Estatal de Planificación y su ministerio de desarrollo."
  fr: "Article de Wikipédia en anglais sur Cevdet Yılmaz (né le 1er avril 1967 à Şabanköy, Bingöl, dans une famille Zaza), vice-président de la Turquie depuis 2023; il relate ses études à l'Université technique du Moyen-Orient, à Denver et à Bilkent, sa carrière à l'Organisation nationale de planification et son ministère du Développement."
  ur: "Cevdet Yılmaz پر انگریزی ویکیپیڈیا کا مضمون ⁦(1 اپریل 1967 کو Şabanköy، Bingöl میں ایک ززا خاندان میں پیدا ہوا)⁩، 2023 سے ترکی کے نائب صدر؛ اس میں مڈل ایسٹ ٹیکنیکل یونیورسٹی، ڈینور اور بلکینٹ میں ان کی تعلیم، ان کے اسٹیٹ پلاننگ آرگنائزیشن کیرئیر اور ان کی وزارت ترقی کو ریکارڈ کیا گیا ہے۔"
