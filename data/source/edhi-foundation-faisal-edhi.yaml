  ar: "صفحة مؤسسة إيدهي الرسمية عن فيصل إيدهي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه ابن فاعل الخير الأسطوري عبد الستار إيدهي ويقود المؤسسة من مكتبه في كراتشي بالتزام لا يلين، محافظًا على إرث أبيه وفلسفته في خدمة الإنسانية دون مساعدة حكومية، من المهد إلى اللحد."
  en: "The Edhi Foundation's official page about Faisal Edhi; used for entity facts only. It describes him as the son of the legendary humanitarian Abdul Sattar Edhi, leading the foundation from his Karachi office with unwavering commitment, upholding his father's legacy and his cradle-to-grave philosophy of serving humanity without government aid."
