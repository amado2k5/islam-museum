summary:
  ar: "صفحة مؤسسة إيدهي الرسمية عن فيصل إيدهي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه ابن فاعل الخير الأسطوري عبد الستار إيدهي ويقود المؤسسة من مكتبه في كراتشي بالتزام لا يلين، محافظًا على إرث أبيه وفلسفته في خدمة الإنسانية دون مساعدة حكومية، من المهد إلى اللحد."
  en: "The Edhi Foundation's official page about Faisal Edhi; used for entity facts only. It describes him as the son of the legendary humanitarian Abdul Sattar Edhi, leading the foundation from his Karachi office with unwavering commitment, upholding his father's legacy and his cradle-to-grave philosophy of serving humanity without government aid."
  es: "Página oficial de la Fundación Edhi sobre Faisal Edhi; utilizada únicamente para información sobre la entidad. Lo describe como hijo del legendario humanitario Abdul Sattar Edhi, quien dirige la fundación desde su oficina en Karachi con un compromiso inquebrantable, manteniendo vivo el legado de su padre y su filosofía de servicio a la humanidad desde la cuna hasta la tumba, sin ayuda gubernamental."
  fr: "Page officielle de la Fondation Edhi consacrée à Faisal Edhi; utilisée à des fins d'information uniquement. Elle le décrit comme le fils du légendaire humanitaire Abdul Sattar Edhi, dirigeant la fondation depuis son bureau de Karachi avec un engagement sans faille, perpétuant l'héritage de son père et sa philosophie de service à l'humanité sans aide gouvernementale."
  ur: "فیصل ایدھی کے بارے میں ایدھی فاؤنڈیشن کا آفیشل پیج؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں انہیں لیجنڈری انسان دوست عبدالستار ایدھی کے بیٹے کے طور پر بیان کیا گیا ہے، جنہوں نے اپنے کراچی کے دفتر سے غیرمتزلزل عزم کے ساتھ فاؤنڈیشن کی قیادت کی، اپنے والد کی میراث اور حکومتی امداد کے بغیر انسانیت کی خدمت کے اس کے گہوارہ سے قبر تک کے فلسفے کو برقرار رکھا۔"
  tr: "Edhi Vakfı'nın Faisal Edhi hakkında resmi sayfası yalnızca varlığın gerçekleri için kullanılıyor. Efsanevi hayırsever Abdul Sattar Edhi'nin oğlu olarak tanımlanıyor; Edhi, vakfı Karaçi'deki ofisinden sarsılmaz bir bağlılıkla yönetiyor, babasının mirasını ve devlet yardımı olmadan insanlığa hizmet etme felsefesini beşikten mezara kadar koruyor."
  id: "Halaman resmi Yayasan Edhi tentang Faisal Edhi hanya digunakan untuk fakta entitas tersebut. Ia digambarkan sebagai putra dermawan legendaris Abdul Sattar Edhi, yang memimpin yayasan dari kantornya di Karachi dengan komitmen yang tak tergoyahkan, menjaga warisan dan filosofi ayahnya untuk melayani umat manusia tanpa bantuan pemerintah, dari lahir hingga mati."
