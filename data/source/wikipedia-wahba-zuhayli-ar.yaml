  ar: "مقالة ويكيبيديا العربية عن وهبة الزحيلي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في دير عطية سنة 1932، ووفاته في دمشق يوم السبت 23 شوال 1436هـ الموافق 8 أغسطس 2015، وشيوخه في دمشق ومصر، ومناصبه ومؤلفاته؛ وصندوق معلوماتها يعطي مذهبه شافعيا وطائفته أهل السنة والجماعة."
  en: "Arabic Wikipedia article on Wahbah al-Zuhayli; used for entity facts only. It gives his birth at Deir Atiyah in 1932, his death at Damascus on Saturday 23 Shawwal 1436 AH (8 August 2015), his teachers in Damascus and Egypt, his posts, his awards and his works; its infobox gives his madhhab as Shafi'i and his sect as Ahl al-Sunna wa-l-Jama'a."
