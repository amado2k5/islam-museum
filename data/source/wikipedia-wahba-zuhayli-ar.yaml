summary:
  ar: "مقالة ويكيبيديا العربية عن وهبة الزحيلي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في دير عطية سنة 1932، ووفاته في دمشق يوم السبت 23 شوال 1436هـ الموافق 8 أغسطس 2015، وشيوخه في دمشق ومصر، ومناصبه ومؤلفاته؛ وصندوق معلوماتها يعطي مذهبه شافعيا وطائفته أهل السنة والجماعة."
  en: "Arabic Wikipedia article on Wahbah al-Zuhayli; used for entity facts only. It gives his birth at Deir Atiyah in 1932, his death at Damascus on Saturday 23 Shawwal 1436 AH (8 August 2015), his teachers in Damascus and Egypt, his posts, his awards and his works; its infobox gives his madhhab as Shafi'i and his sect as Ahl al-Sunna wa-l-Jama'a."
  es: "Artículo en árabe de la Wikipedia sobre Wahbah al-Zuhayli; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Deir Atiyah en 1932, su fallecimiento en Damasco el sábado 23 de Shawwal de 1436 AH (8 de agosto de 2015), sus maestros en Damasco y Egipto, sus cargos, sus premios y sus obras; su ficha informativa indica que su escuela jurídica era Shafi'i y su secta Ahl al-Sunna wa-l-Jama'a."
  fr: "Article de Wikipédia en arabe sur Wahbah al-Zuhayli; utilisé uniquement pour les informations le concernant. Il indique sa naissance à Deir Atiyah en 1932, son décès à Damas le samedi 23 Shawwal 1436 AH (8 août 2015), ses maîtres à Damas et en Égypte, ses postes, ses distinctions et ses œuvres; son infobox précise qu’il appartenait à l’école shafi’ite et à la secte Ahl al-Sunna wa-l-Jama’a."
  ur: "وہبہ الزحیلی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1932 میں دیر عطیہ میں ان کی ولادت، ہفتہ 23 شوال 1436 ہجری ⁦(8 اگست 2015)⁩ کو دمشق میں ان کی وفات، دمشق اور مصر میں ان کے اساتذہ، ان کے عہدے، ان کے ایوارڈز اور ان کے کام؛ اس کا معلوماتی خانہ اس کا مذہب شافعی اور اس کا فرقہ اہل السنۃ والجماعۃ دیتا ہے۔"
