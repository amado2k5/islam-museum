  ar: "مقالة ويكيبيديا الإنجليزية عن سكندر بيكم، بيغوم بوبال (1817–1868)؛ تُستخدم لوقائع الكيان فقط. تروي مولدها في قصر غوهر محل، ووصايتها على ابنتها شاه جهان بيكم من 1844 ثم اعتمادها نوابًا سنة 1860، وموقفها الموالي للبريطانيين سنة 1857، وحجها سنة 1863 ومذكراته، وإصلاحاتها ووفاتها سنة 1868."
  en: "English Wikipedia article on Sikandar Begum, Begum of Bhopal (1817–1868); used for entity facts only. It recounts her birth at Gauhar Mahal, her regency for her daughter Shah Jahan Begum from 1844 and recognition as nawab in 1860, her pro-British stance in 1857, her Hajj of 1863 and its memoir, her reforms and her death in 1868."
