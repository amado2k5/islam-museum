summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سكندر بيكم، بيغوم بوبال (1817–1868)؛ تُستخدم لوقائع الكيان فقط. تروي مولدها في قصر غوهر محل، ووصايتها على ابنتها شاه جهان بيكم من 1844 ثم اعتمادها نوابًا سنة 1860، وموقفها الموالي للبريطانيين سنة 1857، وحجها سنة 1863 ومذكراته، وإصلاحاتها ووفاتها سنة 1868."
  en: "English Wikipedia article on Sikandar Begum, Begum of Bhopal (1817–1868); used for entity facts only. It recounts her birth at Gauhar Mahal, her regency for her daughter Shah Jahan Begum from 1844 and recognition as nawab in 1860, her pro-British stance in 1857, her Hajj of 1863 and its memoir, her reforms and her death in 1868."
  es: "Artículo de la Wikipedia en inglés sobre Sikandar Begum, Begum de Bhopal (1817-1868); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Gauhar Mahal, su regencia para su hija Shah Jahan Begum desde 1844 y su reconocimiento como nawab en 1860, su postura pro-británica en 1857, su peregrinación a La Meca (Hajj) de 1863 y sus memorias, sus reformas y su muerte en 1868."
  fr: "Article de Wikipédia en anglais sur Sikandar Begum, Begum de Bhopal (1817-1868); utilisé uniquement pour les informations sur l'entité. Il relate sa naissance à Gauhar Mahal, sa régence pour sa fille Shah Jahan Begum à partir de 1844 et sa reconnaissance comme nawab en 1860, sa position pro-britannique en 1857, son pèlerinage à La Mecque en 1863 et son récit, ses réformes et sa mort en 1868."
  ur: "سکندر بیگم، بیگم آف بھوپال (1817-1868) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں گوہر محل میں اس کی پیدائش، 1844 سے اس کی بیٹی شاہ جہاں بیگم کے لیے اس کی راجگی اور 1860 میں نواب کے طور پر پہچان، 1857 میں اس کا برطانوی حامی موقف، اس کا 1863 کا حج اور اس کی یادداشت، اس کی اصلاحات اور 1868 میں اس کی موت کا ذکر ہے۔"
