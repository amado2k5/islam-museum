  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله واد؛ تُستخدم لوقائع الكيان فقط. متنها يقول: «واد، مسلم تقي، عضو في الطريقة الصوفية المريدية» مستشهدة بمجلة جون أفريك، وتصنّفه في فئة مسلمي السنغال السنة؛ وتذكر ولادته في 29 مايو 1926 في كيبيمير مع التنبيه أن بعضهم يزعم أنه وُلد قبل ذلك بسنوات."
  en: "English Wikipedia article on Abdoulaye Wade; used for entity facts only. Its personal-life text states: 'Wade, a pious Muslim, is a member of the Sufi Mouride brotherhood', citing Jeune Afrique; it files him under Senegalese Sunni Muslims. It gives his birth on 29 May 1926 at Kébémer, noting the official date is recorded although some claim he was born several years earlier, and it lists him among living people in this revision."
