summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله واد؛ تُستخدم لوقائع الكيان فقط. متنها يقول: «واد، مسلم تقي، عضو في الطريقة الصوفية المريدية» مستشهدة بمجلة جون أفريك، وتصنّفه في فئة مسلمي السنغال السنة؛ وتذكر ولادته في 29 مايو 1926 في كيبيمير مع التنبيه أن بعضهم يزعم أنه وُلد قبل ذلك بسنوات."
  en: "English Wikipedia article on Abdoulaye Wade; used for entity facts only. Its personal-life text states: 'Wade, a pious Muslim, is a member of the Sufi Mouride brotherhood', citing Jeune Afrique; it files him under Senegalese Sunni Muslims. It gives his birth on 29 May 1926 at Kébémer, noting the official date is recorded although some claim he was born several years earlier, and it lists him among living people in this revision."
  es: "Artículo de la Wikipedia en inglés sobre Abdoulaye Wade; utilizado únicamente para datos sobre la persona. Su texto sobre su vida personal afirma: «Wade, un musulmán devoto, es miembro de la hermandad sufí Mouride», citando a Jeune Afrique; lo clasifica entre los musulmanes sunitas senegaleses. Indica que nació el 29 de mayo de 1926 en Kébémer, señalando que la fecha oficial está registrada, aunque algunos afirman que nació varios años antes, y lo incluye entre las personas vivas en esta revisión."
  fr: "L'article de Wikipédia en anglais consacré à Abdoulaye Wade est utilisé uniquement à des fins d'information sur l'entité. Sa biographie indique: « Wade, musulman pieux, est membre de la confrérie soufie mouride », citant Jeune Afrique; il est classé parmi les musulmans sunnites sénégalais. Sa date de naissance est le 29 mai 1926 à Kébémer, bien que cette date officielle soit enregistrée, même si certains affirment qu'il serait né plusieurs années plus tôt. Il figure parmi les personnes vivantes dans cette version."
  ur: "عبدولائی ویڈ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی ذاتی زندگی کے متن میں کہا گیا ہے: 'ویڈ، ایک متقی مسلمان، صوفی موریدی بھائی چارے کا رکن ہے'، جیون افریک کا حوالہ دیتے ہوئے؛ یہ اسے سینیگال کے سنی مسلمانوں کے تحت فائل کرتا ہے۔ اس کی پیدائش 29 مئی 1926 کو Kébémer میں ہوئی، سرکاری تاریخ کو نوٹ کرتے ہوئے درج کیا گیا ہے حالانکہ کچھ کا دعویٰ ہے کہ وہ کئی سال پہلے پیدا ہوا تھا، اور اس نظرثانی میں اسے زندہ لوگوں میں درج کرتا ہے۔"
