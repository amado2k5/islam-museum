summary:
  ar: "تدوينة لجوانا بينك، أستاذة الدراسات الإسلامية بجامعة فرايبورغ ومديرة مشروع «القرآن العالمي»، 26 يناير 2024، عن ترجمة محمد تقي العثماني الإنجليزية «معاني القرآن الكريم مع حواشٍ توضيحية»: نشأتها من ترجمة «معارف القرآن» لأبيه، وطبعتها الأولى 2007 في كراتشي، وطبعة تراث في لندن 2020، ومنهجها وحواشيها."
  en: "A post by Johanna Pink, professor of Islamic studies at the University of Freiburg and head of the Global Qur'an project, 26 January 2024, on Muhammad Taqi Usmani's English The Meanings of the Noble Qur'an with Explanatory Notes: its origin in the English translation of his father's Ma'ariful Qur'an, the first edition of 2007 in Karachi, Turath's London edition of 2020, its method and notes."
  ur: "جامعہ فرائیبرگ میں اسلامیات کی پروفیسر اور «گلوبل قرآن» منصوبے کی سربراہ یوہانا پنک کی تحریر، 26 جنوری 2024، مفتی محمد تقی عثمانی کے انگریزی ترجمے پر: والد کی «معارف القرآن» کے انگریزی ترجمے سے آغاز، کراچی میں 2007 کی پہلی اشاعت، لندن میں تراث کی 2020 کی اشاعت، طریقہ اور حواشی۔"
