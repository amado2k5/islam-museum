reliability_note: "Signed research post by the project's principal investigator, read in full in Chrome on 6 November 2026. Used for the first edition (2007, Maktaba Ma'ariful Quran, Karachi), the Turath edition (London, 2020) titled The Noble Qur'an: Meaning with Explanatory Notes, the origin in the Ma'ariful Qur'an committee completed in 2004, the paratexts, the method (modern English close to Arabic syntax, bracketed additions, notes drawn mainly from Deobandi scholarship) and the reception, as the author states them. The post says both that the work was first published in 2007 and, later, that the first Deobandi English translation 'only occurred in 2005'; the record follows 2007 and keeps the discrepancy in a note."
