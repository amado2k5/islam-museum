label: { en: "GloQur, Qur'an translation of the week #184: Taqi Usmani's The Meanings of the Noble Qur'an with Explanatory Notes (Johanna Pink, 2024)" }
summary:
  ar: "تدوينة لجوانا بينك، أستاذة الدراسات الإسلامية بجامعة فرايبورغ ومديرة مشروع «القرآن العالمي»، 26 يناير 2024، عن ترجمة محمد تقي العثماني الإنجليزية «معاني القرآن الكريم مع حواشٍ توضيحية»: نشأتها من ترجمة «معارف القرآن» لأبيه، وطبعتها الأولى 2007 في كراتشي، وطبعة تراث في لندن 2020، ومنهجها وحواشيها."
  en: "A post by Johanna Pink, professor of Islamic studies at the University of Freiburg and head of the Global Qur'an project, 26 January 2024, on Muhammad Taqi Usmani's English The Meanings of the Noble Qur'an with Explanatory Notes: its origin in the English translation of his father's Ma'ariful Qur'an, the first edition of 2007 in Karachi, Turath's London edition of 2020, its method and notes."
  ur: "جامعہ فرائیبرگ میں اسلامیات کی پروفیسر اور «گلوبل قرآن» منصوبے کی سربراہ یوہانا پنک کی تحریر، 26 جنوری 2024، مفتی محمد تقی عثمانی کے انگریزی ترجمے پر: والد کی «معارف القرآن» کے انگریزی ترجمے سے آغاز، کراچی میں 2007 کی پہلی اشاعت، لندن میں تراث کی 2020 کی اشاعت، طریقہ اور حواشی۔"
  es: "Un artículo de Johanna Pink, profesora de estudios islámicos en la Universidad de Friburgo y directora del proyecto Global Qur'an, del 26 de enero de 2024, sobre la obra en inglés de Muhammad Taqi Usmani, The Meanings of the Noble Qur'an with Explanatory Notes: su origen en la traducción al inglés del Ma'ariful Qur'an de su padre, la primera edición de 2007 en Karachi, la edición londinense de Turath de 2020, su método y notas."
  fr: "Article de Johanna Pink, professeure d'études islamiques à l'Université de Fribourg et responsable du projet Global Qur'an, 26 janvier 2024, sur l'ouvrage de Muhammad Taqi Usmani intitulé « The Meanings of the Noble Qur'an with Explanatory Notes »: son origine dans la traduction anglaise du « Ma'ariful Qur'an » de son père, la première édition de 2007 à Karachi, l'édition londonienne de Turath de 2020, sa méthode et ses notes."
  tr: "Freiburg Üniversitesi İslami Araştırmalar Profesörü ve 'Dünya Kur'an' projesinin direktörü Joanna Pink'in 26 Ocak 2024 tarihli yazısı, Muhammad Taqi Al-Othmani'nin 'Kur'an'ın Anlamları ve Açıklayıcı Notlar' adlı eserinin İngilizce çevirisi hakkında: Babasının 'Ma'arif al-Qur'an' çevirisinden kökeni, 2007'de Karaçi'de ilk baskısı ve 2020'de Londra'daki 'Turath' baskısı, metodolojisi ve kenar notlarıyla birlikte."
  id: "Sebuah tulisan oleh Joanna Pink, Profesor Studi Islam di Universitas Freiburg dan Direktur proyek 'World Quran', 26 Januari 2024, tentang terjemahan bahasa Inggris Muhammad Taqi Al-Othmani dari 'The Meanings of the Holy Quran with Explanatory Notes': Asal-usulnya dari terjemahan ayahnya atas 'Ma'arif al-Qur'an,' edisi pertamanya pada tahun 2007 di Karachi, dan edisi 'Turath' tahun 2020 di London, beserta metodologi dan catatan pinggirnya."
title: "Qur'an translation of the week #184: Mufti Muhammad Taqi Usmani's The Meanings of the Noble Qur'an with Explanatory Notes"
