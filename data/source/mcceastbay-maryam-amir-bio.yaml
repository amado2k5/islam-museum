reliability_note: "A community institution's speaker biography; the same text family is repeated by Muslim Central's podcast page and podcast bios (one family). It gives her master's in Education from UCLA with research on mentorship, a bachelor's in Child and Adolescent Development from San Jose State University (per the fuller archived version of the bio), fifteen years researching Quranic exegesis, jurisprudence, Prophetic narrations and women's rights in Islamic law, lectures in Jerusalem, Mecca, Medina, Stockholm, London and Toronto, and a second-degree black belt in Tae Kwon Do. It uses only the short form of her name, Maryam Amir, and names no madhhab or sect affiliation for her. Checked 26 October 2026."
