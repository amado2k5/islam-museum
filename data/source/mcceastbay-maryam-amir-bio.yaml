summary:
  ar: "ملف مريم أمير في المركز المجتمعي الإسلامي في إيست باي بكاليفورنيا؛ يذكر ماجستيرها في التربية من جامعة كاليفورنيا في لوس أنجلوس وبكالوريوسها الثاني في الدراسات الإسلامية من جامعة الأزهر وحفظها القرآن ودراستها في مصر، وتقديمها سلسلة «أبطال القرآن»، وإنشاءها تطبيق «قارئة»، ومقابلات بي بي سي والإذاعة الوطنية العامة وسي بي إس معها."
  en: "The Muslim Community Center – East Bay's speaker profile of Maryam Amir: her master's in Education from UCLA, her second bachelor's in Islamic Studies from Al-Azhar University, her memorisation of the Quran and study in Egypt, her hosting of the Quran Champions series, her creation of the Qariah app, and her interviews with the BBC, NPR and CBS."
  es: "Perfil de Maryam Amir, ponente del Centro Comunitario Musulmán de East Bay: su máster en Educación por la UCLA, su segunda licenciatura en Estudios Islámicos por la Universidad de Al-Azhar, su memorización del Corán y sus estudios en Egipto, su participación como presentadora de la serie Quran Champions, la creación de la aplicación Qariah y sus entrevistas con la BBC, NPR y CBS."
  fr: "Le Muslim Community Center – East Bay présente le profil de Maryam Amir, intervenante de son équipe: sa maîtrise en éducation de l’UCLA, sa deuxième licence en études islamiques de l’université Al-Azhar, sa mémorisation du Coran et ses études en Égypte, son animation de la série Quran Champions, la création de l’application Qariah et ses interviews avec la BBC, NPR et CBS."
