summary:
  ar: "ملف مريم أمير في المركز المجتمعي الإسلامي في إيست باي بكاليفورنيا؛ يذكر ماجستيرها في التربية من جامعة كاليفورنيا في لوس أنجلوس وبكالوريوسها الثاني في الدراسات الإسلامية من جامعة الأزهر وحفظها القرآن ودراستها في مصر، وتقديمها سلسلة «أبطال القرآن»، وإنشاءها تطبيق «قارئة»، ومقابلات بي بي سي والإذاعة الوطنية العامة وسي بي إس معها."
  en: "The Muslim Community Center – East Bay's speaker profile of Maryam Amir: her master's in Education from UCLA, her second bachelor's in Islamic Studies from Al-Azhar University, her memorisation of the Quran and study in Egypt, her hosting of the Quran Champions series, her creation of the Qariah app, and her interviews with the BBC, NPR and CBS."
