reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. Read in full on 5 November 2026. The article states that Kalarab maintains its own record label and production company, Holy Tune; that the label was established in 2016 and has been under contract with Kalarab since its inception, so that all Kalarab songs are exclusively produced and distributed by Holy Tune (cited to the channel's own About page); that Holy Tune is owned by singer Muhammad Badruzzaman; that its YouTube channel is HolyTunebdofficial; and that the channel has received YouTube's Silver, Gold and Diamond Play Buttons, with a 2022 special honour from the Bangladesh Deeni Seba Foundation for promoting Islamic music (cited to Bangladesh Pratidin)."
