summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيتي والدة، المشهورة بنياي أحمد دحلان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها سنة 1872 في كاومان بيوجياكارتا ووفاتها في 31 أيار 1946، وتأسيسها مجموعة صوبو تريسنو سنة 1914 ثم العائشية في 22 نيسان 1917 على رأسها، وقيادتها لها حتى 1934، وترؤسها مؤتمر المحمدية الخامس عشر سنة 1926، وإعلانها بطلة قومية سنة 1971."
  en: "English Wikipedia article on Siti Walidah, better known as Nyai Ahmad Dahlan; used for entity facts only. It gives her birth in 1872 at Kauman, Yogyakarta, and her death on 31 May 1946, her founding of the Sopo Tresno prayer group in 1914 and of Aisyiyah on 22 April 1917 with herself as its head, her leadership of Aisyiyah until 1934, her chairing of the fifteenth Muhammadiyah Congress in 1926, and her declaration as a National Hero of Indonesia in 1971."
