summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيتي والدة، المشهورة بنياي أحمد دحلان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها سنة 1872 في كاومان بيوجياكارتا ووفاتها في 31 أيار 1946، وتأسيسها مجموعة صوبو تريسنو سنة 1914 ثم العائشية في 22 نيسان 1917 على رأسها، وقيادتها لها حتى 1934، وترؤسها مؤتمر المحمدية الخامس عشر سنة 1926، وإعلانها بطلة قومية سنة 1971."
  en: "English Wikipedia article on Siti Walidah, better known as Nyai Ahmad Dahlan; used for entity facts only. It gives her birth in 1872 at Kauman, Yogyakarta, and her death on 31 May 1946, her founding of the Sopo Tresno prayer group in 1914 and of Aisyiyah on 22 April 1917 with herself as its head, her leadership of Aisyiyah until 1934, her chairing of the fifteenth Muhammadiyah Congress in 1926, and her declaration as a National Hero of Indonesia in 1971."
  es: "Artículo de la Wikipedia en inglés sobre Siti Walidah, más conocida como Nyai Ahmad Dahlan; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1872 en Kauman, Yogyakarta, y su fallecimiento el 31 de mayo de 1946, la fundación del grupo de oración Sopo Tresno en 1914 y de Aisyiyah el 22 de abril de 1917, con ella misma como líder, su liderazgo de Aisyiyah hasta 1934, su presidencia del decimoquinto Congreso de Muhammadiyah en 1926 y su declaración como Heroína Nacional de Indonesia en 1971."
  fr: "Article de Wikipédia en anglais sur Siti Walidah, plus connue sous le nom de Nyai Ahmad Dahlan; utilisé uniquement pour les informations biographiques. On y apprend sa naissance en 1872 à Kauman, Yogyakarta, son décès le 31 mai 1946, la fondation du groupe de prière Sopo Tresno en 1914 et d’Aisyiyah le 22 avril 1917, dont elle prit la tête, son rôle à la tête d’Aisyiyah jusqu’en 1934, sa présidence du quinzième congrès de Muhammadiyah en 1926 et sa déclaration comme Héroïne nationale d’Indonésie en 1971."
  ur: "سیتی ولیدہ پر انگریزی ویکیپیڈیا مضمون، جو نیا احمد دحلان کے نام سے مشہور ہے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1872 میں کومان، یوگیاکارتا میں اس کی پیدائش ہوئی، اور اس کی موت 31 مئی 1946 کو ہوئی، اس نے 1914 میں سوپو ٹریسنو نمازی گروپ کی بنیاد رکھی اور 22 اپریل 1917 کو خود اس کے سربراہ کے طور پر آسیہ کی، 1934 تک عائشہ کی قیادت، اس کی پانچویں کانگریس میں، اور اس کی پانچویں صدارت میں محمد 1971 میں انڈونیشیا کے قومی ہیرو کے طور پر اعلان۔"
  tr: "Siti Walda hakkındaki İngilizce Wikipedia makalesi, Banay Ahmed Dahlan olarak bilinir; yalnızca varlığın gerçekleri için kullanılır. 1872'de Buicakarta'nın Kauman kentinde doğdu ve 31 Mayıs 1946'da vefat etti, 1914'te Sobo Trisno grubunu, ardından 22 Nisan 1917'de Al-Aishiya'yı kurdu, 1934'e kadar liderlik etti, 1926'da 15. Mohammedia Kongresi'ne başkanlık etti ve 1971'de ulusal kahraman ilan edildi."
  id: "Artikel Wikipedia bahasa Inggris tentang Siti Walda, yang dikenal sebagai Banay Ahmed Dahlan; digunakan hanya untuk fakta entitas. Ia lahir pada tahun 1872 di Kauman, Buicakarta dan meninggal pada 31 Mei 1946, mendirikan kelompok Sobo Trisno pada tahun 1914, kemudian Al-Aishiya pada 22 April 1917, memimpin hingga 1934, memimpin Kongres Mohammedia ke-15 pada tahun 1926, dan dinyatakan sebagai pahlawan nasional pada tahun 1971."
