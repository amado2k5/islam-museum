summary:
  ar: "مقالة ويكيبيديا الأردية عن سكندر حياة خان؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة بصندوق معلومات يؤكد مولده في 5 حزيران 1892 في ملتان ووفاته في 26 كانون الأول 1942 في لاهور ورئاسته لحكومة البنجاب (1937–1942)، ولا تذكر دينا ولا مذهبا."
  en: "Urdu Wikipedia article on Sikandar Hayat Khan; used for entity facts only. A short article whose infobox confirms his birth on 5 June 1892 at Multan, his death on 26 December 1942 at Lahore and his premiership of the Punjab (1937–1942); it names no religion or school."
  es: "Artículo de Wikipedia en urdu sobre Sikandar Hayat Khan; utilizado únicamente para datos sobre la persona. Un breve artículo cuya ficha informativa confirma su nacimiento el 5 de junio de 1892 en Multan, su fallecimiento el 26 de diciembre de 1942 en Lahore y su mandato como primer ministro del Punjab (1937-1942); no menciona ninguna religión ni escuela."
  fr: "Article de Wikipédia en ourdou sur Sikandar Hayat Khan; utilisé uniquement à des fins d'information sur l'entité. Cet article concis confirme sa naissance le 5 juin 1892 à Multan, son décès le 26 décembre 1942 à Lahore et son mandat de Premier ministre du Pendjab (1937-1942); il ne mentionne ni sa religion ni son école."
  ur: "سکندر حیات خان پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون جس کا معلوماتی خانہ 5 جون 1892 کو ملتان میں ان کی پیدائش، 26 دسمبر 1942 کو لاہور میں ان کی وفات اور پنجاب کی وزارت عظمیٰ (1937-1942) کی تصدیق کرتا ہے۔ اس میں کسی مذہب یا اسکول کا نام نہیں ہے۔"
  tr: "Sikandar Hayat Khan hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 5 Haziran 1892'de Multan'da doğduğunu, 26 Aralık 1942'de Lahor'da öldüğünü ve Pencap hükümetini (1937–1942) yönettiğini doğrulayan kısa bir bilgi kutusu makalesi ve din veya mezhepten bahsetmemektedir."
  id: "Artikel Wikipedia Urdu tentang Sikandar Hayat Khan; hanya digunakan untuk fakta entitas. Sebuah artikel singkat dalam infobox yang mengonfirmasi kelahirannya pada 5 Juni 1892 di Multan, kematiannya pada 26 Desember 1942 di Lahore, dan kepemimpinannya di pemerintahan Punjab (1937–1942), dan tidak menyebutkan agama atau sekte."
