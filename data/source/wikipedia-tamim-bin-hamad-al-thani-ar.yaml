summary:
  ar: "مقالة ويكيبيديا العربية عن تميم بن حمد آل ثاني؛ تُستخدم لوقائع الكيان فقط. توافق الإنجليزية في الولادة ⁦(3 يونيو 1980 في الدوحة)⁩ وولاية العهد (2003) وتولّي الإمارة في 25 يونيو 2013 خلفًا لوالده مباشرة، وتصفه بأنه ثامن أمراء قطر وأصغر حكام دول مجلس التعاون. لا يرد في صندوق معلوماتها ولا في نصها أي ذكر لدينه أو مذهبه."
  en: "Arabic Wikipedia article on Tamim bin Hamad Al Thani; used for entity facts only. It agrees with the English article on his birth (3 June 1980 in Doha), the heir apparency (2003) and the accession of 25 June 2013 directly succeeding his father, and calls him the eighth Emir of Qatar and the youngest ruler in the Gulf Cooperation Council. Neither its infobox nor its text makes any statement of his religion or school."
  es: "Artículo de Wikipedia en árabe sobre Tamim bin Hamad Al Thani; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento (3 de junio de 1980 en Doha), su aparición como heredero (2003) y su ascenso al trono el 25 de junio de 2013, sucediendo directamente a su padre, y lo denomina el octavo emir de Qatar y el gobernante más joven del Consejo de Cooperación del Golfo. Ni su ficha informativa ni su texto mencionan su religión o escuela."
  fr: "Article de Wikipédia en arabe sur Tamim bin Hamad Al Thani; utilisé uniquement pour les informations relatives à l’entité. Il concorde avec l’article en anglais concernant sa naissance (3 juin 1980 à Doha), la désignation de l’héritier (2003) et son accession au trône le 25 juin 2013, succédant directement à son père. Il le présente comme le huitième émir du Qatar et le plus jeune souverain du Conseil de coopération du Golfe. Ni son infobox ni son texte ne font mention de sa religion ou de son école."
  ur: "تمیم بن حمد الثانی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش ⁦(3 جون 1980 دوحہ میں)⁩، وارث ظاہری (2003) اور براہ راست اپنے والد کے بعد 25 جون 2013 کے الحاق سے متعلق انگریزی مضمون سے متفق ہے، اور انہیں قطر کا آٹھواں امیر اور خلیج تعاون کونسل میں سب سے کم عمر حکمران کہتا ہے۔ نہ اس کا انفو باکس اور نہ ہی اس کا متن اس کے مذہب یا مکتب کا کوئی بیان دیتا ہے۔"
