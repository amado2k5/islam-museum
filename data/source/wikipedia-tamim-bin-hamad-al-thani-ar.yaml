  ar: "مقالة ويكيبيديا العربية عن تميم بن حمد آل ثاني؛ تُستخدم لوقائع الكيان فقط. توافق الإنجليزية في الولادة (3 يونيو 1980 في الدوحة) وولاية العهد (2003) وتولّي الإمارة في 25 يونيو 2013 خلفًا لوالده مباشرة، وتصفه بأنه ثامن أمراء قطر وأصغر حكام دول مجلس التعاون. لا يرد في صندوق معلوماتها ولا في نصها أي ذكر لدينه أو مذهبه."
  en: "Arabic Wikipedia article on Tamim bin Hamad Al Thani; used for entity facts only. It agrees with the English article on his birth (3 June 1980 in Doha), the heir apparency (2003) and the accession of 25 June 2013 directly succeeding his father, and calls him the eighth Emir of Qatar and the youngest ruler in the Gulf Cooperation Council. Neither its infobox nor its text makes any statement of his religion or school."
