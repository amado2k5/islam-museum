reliability_note: "Pointer for entity facts only: the article rests on Beth Baron's scholarship on interwar Egypt. Read at the recorded revision and checked against it on 26 October 2026. Gives Labiba Ahmad born in Cairo in the 1870s, daughter of the physician Ahmad Abd al-Nabi Bey, died 1951; she marched in the 1919 Ladies' Demonstrations, founded the Society of Egyptian Ladies' Awakening and its monthly al-Nahda al-Nisa'iyya to promote Islamic nationalism and frame women's rights in Islamic terms. It names no school of Islam for her."
