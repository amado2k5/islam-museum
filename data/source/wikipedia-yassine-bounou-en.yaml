reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Bounou (also known mononymously as Bono) as born on 5 April 1991 in Montreal, Canada, to Moroccan parents; his father, from the village of Bouana in Taounate Province, is an engineer and a former professor at the Hassania School of Public Works. The article is internally inconsistent on the family's return to Morocco: its lead says he was two, its early-life section says three; the museum's prose therefore says only 'in early childhood'. Career: Wydad from the age of eight, senior debut in the 2011 CAF Champions League final; Atlético Madrid from June 2012 (B team and loans, notably Zaragoza); Girona from July 2016; Sevilla on loan from September 2019, permanently from September 2020 (Europa League 2019-20 and 2022-23, player of the match in the 2023 final; Zamora Trophy 2021-22, the first in Sevilla's history); Al Hilal from August 2023. For Morocco: debut on 15 August 2013; World Cups 2018 (reserve), 2022 (two shootout saves against Spain in the round of 16; the tournament's most clean sheets) and 2026; best goalkeeper of the 2025 Africa Cup of Nations. Its personal-life section states simply 'Bounou is a Muslim', citing a 2022 profile; it names no school. It also records that he donated blood after the 2023 Marrakesh-Safi earthquake."
