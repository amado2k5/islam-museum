summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ياسين بونو؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في مونتريال ونشأته في الدار البيضاء، وبدايته مع الوداد، ومسيرته الإسبانية مع أتلتيكو وجيرونا وإشبيلية، وانتقاله إلى الهلال، ودوره مع المغرب في كأس العالم 2022 وكأس أمم أفريقيا 2025."
  en: "English Wikipedia article on Yassine Bounou; used for entity facts only. It recounts his birth in Montreal and upbringing in Casablanca, his start at Wydad, his Spanish career with Atlético Madrid, Girona and Sevilla, his move to Al Hilal, and his role for Morocco at the 2022 World Cup and the 2025 Africa Cup of Nations."
  es: "Artículo de la Wikipedia en inglés sobre Yassine Bounou; utilizado únicamente para obtener información sobre la persona. Relata su nacimiento en Montreal y su infancia en Casablanca, sus inicios en el Wydad, su carrera en la selección española con el Atlético de Madrid, el Girona y el Sevilla, su fichaje por el Al Hilal y su papel con Marruecos en el Mundial de 2022 y la Copa Africana de Naciones de 2025."
  fr: "Article Wikipédia en anglais sur Yassine Bounou; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Montréal et son enfance à Casablanca, ses débuts au Wydad, sa carrière espagnole à l’Atlético Madrid, à Gérone et à Séville, son transfert à Al Hilal, et son rôle au sein de l’équipe nationale du Maroc lors de la Coupe du monde 2022 et de la Coupe d’Afrique des Nations 2025."
  ur: "یاسین بونو پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں مونٹریال میں اس کی پیدائش اور کاسا بلانکا میں پرورش، وائداد میں اس کا آغاز، اٹلیٹکو میڈرڈ، گیرونا اور سیویلا کے ساتھ اس کا ہسپانوی کیریئر، الہلال میں اس کا منتقلی، اور 2022 کے ورلڈ کپ اور 2025 کے افریقہ کپ آف نیشنز میں مراکش کے لیے اس کے کردار کا ذکر ہے۔"
  tr: "Yassine Bounou hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Montreal'deki doğumunu, Casablanca'daki yetiştirilme tarzını, Wydad ile başlangıcını, İspanya'daki Atlético, Girona ve Sevilla'daki kariyerini, Al Hilal'e geçişini ve 2022 Dünya Kupası ile 2025 Afrika Uluslar Kupası'ndaki Fas takımındaki rolünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Yassine Bounou; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Montreal, masa kecilnya di Casablanca, awal karirnya di Wydad, karier Spanyolnya bersama Atlético, Girona, dan Sevilla, kepindahannya ke Al Hilal, serta perannya bersama Maroko di Piala Dunia 2022 dan Piala Afrika 2025."
