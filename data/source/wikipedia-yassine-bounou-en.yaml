  ar: "مقالة ويكيبيديا الإنجليزية عن ياسين بونو؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في مونتريال ونشأته في الدار البيضاء، وبدايته مع الوداد، ومسيرته الإسبانية مع أتلتيكو وجيرونا وإشبيلية، وانتقاله إلى الهلال، ودوره مع المغرب في كأس العالم 2022 وكأس أمم أفريقيا 2025."
  en: "English Wikipedia article on Yassine Bounou; used for entity facts only. It recounts his birth in Montreal and upbringing in Casablanca, his start at Wydad, his Spanish career with Atlético Madrid, Girona and Sevilla, his move to Al Hilal, and his role for Morocco at the 2022 World Cup and the 2025 Africa Cup of Nations."
