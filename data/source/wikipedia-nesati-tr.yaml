reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It states in prose that he became a dervish of Ağazâde Mehmed Efendi at the Gelibolu Mevlevihane, spent time in Konya after his shaykh's death, and in 1670 was appointed to the Edirne Mevlevihane shaykhdom vacated by Osman Dede, holding it about four years until his death in 1674, when he was buried in the Mevlevihane's courtyard — the second of the three independent texts behind the person record's sufi settlement. It lists his works, the Şerh-i Müşkilât-ı Urfî among them, and names his real name as Süleyman or Ahmed, as it is thought. Checked 1 November 2026."
