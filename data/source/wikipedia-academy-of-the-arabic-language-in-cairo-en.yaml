  fr: "La page « Academy of the Arabic Language in Cairo » (Wikipedia (English)), résumée dans un fichier de recherche fourni au musée et non ouverte par lui, avec l'accord du fondateur du 21 novembre 2026 ; utilisée pour les faits sur l'institution seulement."
  es: "La página «Academy of the Arabic Language in Cairo» (Wikipedia (English)), resumida en un archivo de investigación entregado al museo y no abierta por él, con la aprobación del fundador del 21 de noviembre de 2026; se usa solo para datos sobre la institución."
  tr: "Wikipedia'daki \"Kahire'de Arap Dili Akademisi\" sayfası (İngilizce); müze tarafından açılmamıştır ve 21 Kasım 2026 tarihinde kurucunun izniyle sunulan bir araştırma dosyasında özetlenmiştir; bu dosya yalnızca vakfın kayıtlarına dayanmaktadır."
