  ar: "صفحة «Academy of the Arabic Language in Cairo» في Wikipedia (English)؛ لم يفتحها المتحف، وهي ملخّصة في ملف بحث قُدّم إليه بإذن المؤسس في 21 نوفمبر 2026، ويُستند إليها لوقائع المؤسسة فقط."
  en: "The page \"Academy of the Arabic Language in Cairo\" (Wikipedia (English)), summarised in a research file supplied to the museum and not opened by it, with the founder's approval of 21 November 2026; used for: the royal decree of 31 December 1932, the inauguration of 30 January 1934, the founders named, the Academy's terminology work, the early script-reform debate on the letters p and v and the lexicons al-Mu'jam al-Kabir and al-Mu'jam al-Wasit."
