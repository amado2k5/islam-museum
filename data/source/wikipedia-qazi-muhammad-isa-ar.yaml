summary:
  ar: "المقال العربي بعنوان «قاضي محمد عيسى»: ينص على أنه «من قبيلة الهزارة السنّية» معوّلا على موقع قصة باكستان، ويذكر أباه قاضي جلال الدين قاضي قندهار ومدارسه في كويته."
  en: "The Arabic article 'Qazi Muhammad Isa': states in prose that he was of 'the Sunni Hazara tribe', resting on the Story of Pakistan profile, and names his father Qazi Jalaluddin, qadi of Kandahar, and his Quetta schooling."
  es: "El artículo en árabe titulado \"Qazi Muhammad Isa\" afirma en prosa que pertenecía a la tribu suní hazara, basándose en el perfil de \"Historia de Pakistán\", y menciona a su padre, Qazi Jalaluddin, cadí de Kandahar, y su educación en Quetta."
  fr: "L'article arabe « Qazi Muhammad Isa » indique en prose qu'il appartenait à « la tribu sunnite Hazara », se basant sur le profil de Story of Pakistan, et mentionne son père Qazi Jalaluddin, cadi de Kandahar, et sa scolarité à Quetta."
  ur: "عربی مضمون 'قاضی محمد عیسیٰ': نثر میں بیان کرتا ہے کہ وہ 'سنی ہزارہ قبیلے' سے تھا، جو کہ پاکستان کی کہانی پر محیط تھا، اور اس نے اپنے والد کا نام قاضی جلال الدین، قندھار کے قاضی، اور اس کی کوئٹہ میں تعلیم حاصل کی۔"
  tr: "\"Qazi Muhammad Isa\" başlıklı Arapça makalede, Pakistan Story web sitesine dayanarak, babası Qazi Celaluddin, Kandahar Kazi'si ve Kuveyt'teki okullarından bahsediliyor."
  id: "Artikel berbahasa Arab berjudul \"Qazi Muhammad Isa\" menyatakan bahwa ia berasal dari \"suku Hazara Sunni,\" berdasarkan situs web Pakistan Story, menyebutkan ayahnya, Qazi Jalaluddin, Qazi dari Kandahar, dan sekolah-sekolahnya di Kuwait."
