reliability_note: "Actual file page read on 2026-11-15: caption reads 'Quadrants. Damascus, Syria, 734AH (AD1333-34). 1888,1201.276. 1997,0210.1. Astrolabe. Spain, 1200-1400. OA+.371. Qibla indicator. Iran, 1600-1800. 1890,0315.4'; author Photograph by Mike Peel (www.mikepeel.net), own work, shot 18 April 2026 at the British Museum; licence CC BY-SA 4.0. Full original image visually inspected: a glass display of several brass astronomical instruments. The Damascus quadrant's 734 AH date falls inside al-Mizzi's floruit (690-750 AH per the museum record), which is why the photograph is used as contextual evidence of the Damascus quadrant tradition — it is not identified as his signed piece and no maker attribution is made from the image."
