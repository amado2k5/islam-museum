  ar: "مقالة ويكيبيديا الفارسية عن مير عماد الحسني؛ تعطي حياته 961–1024هـ/1554–1615م ونسبه إلى سادات سيفي حسني، وفيها قسم خاص بمذهبه يقول إن أكثر كتّاب التذاكر والمؤرخين على أنه سنّي وإن ذلك عُدّ من أسباب قتله، ثم ينبّه إلى أنه لا يوجد أي دليل أو سند مستقل على ذلك."
  en: "Persian Wikipedia article on Mir Emad Hassani; it gives his life as 961-1024 AH/1554-1615 CE and his descent from the Sayfi Hasani sayyeds, and its dedicated religion section states that most tazkira-writers and historians hold his madhhab to have been Sunni and count it among the reasons for his murder, then cautions that no independent document or evidence for it exists."
