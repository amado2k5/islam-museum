  ar: "مقالة ويكيبيديا العربية عن نصيب بك يوسف بكلي؛ تُستخدم لوقائع الكيان فقط. سيرة مختصرة: مولده في غنجه سنة 1881، ودراسته في أوديسا، وعمله في «ترجمان»، وتأسيسه الجمعية التركية في إسطنبول سنة 1908، وحزبه واندماجه في مساوات، ووزاراته ورئاسته للحكومة، ومقتله في 31 مايو 1920 في قرية قارخون بقضاء كوردمير."
  en: "Arabic Wikipedia article on Nasib bey Yusifbeyli; used for entity facts only. A short biography: his 1881 Ganja birth, Odessa studies, Terciman work, the Turkic Society he founded in Istanbul in 1908, his party and the Musavat merger, his ministries and premiership, and his killing on 31 May 1920 at Qarkhun village in Kurdamir district."
