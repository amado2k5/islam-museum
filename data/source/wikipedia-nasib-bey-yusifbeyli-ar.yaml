summary:
  ar: "مقالة ويكيبيديا العربية عن نصيب بك يوسف بكلي؛ تُستخدم لوقائع الكيان فقط. سيرة مختصرة: مولده في غنجه سنة 1881، ودراسته في أوديسا، وعمله في «ترجمان»، وتأسيسه الجمعية التركية في إسطنبول سنة 1908، وحزبه واندماجه في مساوات، ووزاراته ورئاسته للحكومة، ومقتله في 31 مايو 1920 في قرية قارخون بقضاء كوردمير."
  en: "Arabic Wikipedia article on Nasib bey Yusifbeyli; used for entity facts only. A short biography: his 1881 Ganja birth, Odessa studies, Terciman work, the Turkic Society he founded in Istanbul in 1908, his party and the Musavat merger, his ministries and premiership, and his killing on 31 May 1920 at Qarkhun village in Kurdamir district."
  es: "Artículo en árabe de la Wikipedia sobre Nasib bey Yusifbeyli; utilizado únicamente para datos sobre la persona. Breve biografía: su nacimiento en Ganja en 1881, sus estudios en Odessa, su trabajo en Terciman, la Sociedad Turca que fundó en Estambul en 1908, su partido y la fusión con Musavat, sus ministerios y su mandato como primer ministro, y su asesinato el 31 de mayo de 1920 en la aldea de Qarkhun, en el distrito de Kurdamir."
  fr: "Article de Wikipédia en arabe sur Nasib bey Yusifbeyli; utilisé uniquement à des fins d’information sur l’entité. Brève biographie: sa naissance à Gandja en 1881, ses études à Odessa, son travail au Terciman, la Société turque qu’il fonde à Istanbul en 1908, son parti et la fusion avec le Musavat, ses ministères et son poste de Premier ministre, et son assassinat le 31 mai 1920 au village de Qarkhun, dans le district de Kurdamir."
