reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The article carries a 'BLP sources' banner. Its infobox and lead give his birth name as Edward Dean Gregory, citing The Boxing Register (Roberts and Skutt, 2006, p. 616) — BoxRec gives the middle name as Lee, and the conflict is recorded in the person record. The text records his two New York Golden Gloves titles of 1971 and 1972 under the name Eddie Gregory, his 1977 loss to Víctor Galíndez, his WBA light heavyweight title win over Marvin Johnson in March 1980 and the loss of the title to Michael Spinks in 1981, the aborted 1983 Spinks rematch after he failed to make weight, his 1985 IBF title loss to Slobodan Kačar, his retirement, his film roles, and his training career. Its text never mentions Islam; the categories Converts to Islam, African-American Muslims and Muslims from New York (state) are filings, not attestation."
