  ar: "مقالة ويكيبيديا الإنجليزية عن إدي مصطفى محمد؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده باسم إدوارد دين غريغوري في 30 أبريل 1952 في بروكلين، ولقبه «اللهب»، وبطولته العالمية لرابطة الملاكمة العالمية سنة 1980، ومسيرته مدرباً بعد الاعتزال. ولا تذكر ديانته ولا اعتناقه في متنها، بل تصنّفه فقط في فئات المتحولين إلى الإسلام والمسلمين الأمريكيين الأفارقة."
  en: "English Wikipedia article on Eddie Mustafa Muhammad; used for entity facts only. It gives his birth as Edward Dean Gregory on 30 April 1952 in Brooklyn, his nickname Flame, his 1980 WBA world title, and his later career as a trainer. Its text makes no statement of his religion or conversion; it files him only in the categories Converts to Islam and African-American Muslims."
