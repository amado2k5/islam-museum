summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إدي مصطفى محمد؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده باسم إدوارد دين غريغوري في 30 أبريل 1952 في بروكلين، ولقبه «اللهب»، وبطولته العالمية لرابطة الملاكمة العالمية سنة 1980، ومسيرته مدرباً بعد الاعتزال. ولا تذكر ديانته ولا اعتناقه في متنها، بل تصنّفه فقط في فئات المتحولين إلى الإسلام والمسلمين الأمريكيين الأفارقة."
  en: "English Wikipedia article on Eddie Mustafa Muhammad; used for entity facts only. It gives his birth as Edward Dean Gregory on 30 April 1952 in Brooklyn, his nickname Flame, his 1980 WBA world title, and his later career as a trainer. Its text makes no statement of his religion or conversion; it files him only in the categories Converts to Islam and African-American Muslims."
  es: "Artículo de Wikipedia en inglés sobre Eddie Mustafa Muhammad; utilizado únicamente para datos sobre la persona. Indica que nació como Edward Dean Gregory el 30 de abril de 1952 en Brooklyn, su apodo Flame, su título mundial de la AMB de 1980 y su posterior carrera como entrenador. El texto no menciona su religión ni su conversión; solo lo clasifica en las categorías de Conversos al Islam y Musulmanes Afroamericanos."
  fr: "Article Wikipédia en anglais sur Eddie Mustafa Muhammad; utilisé uniquement pour les informations le concernant. Il mentionne sa naissance sous le nom d'Edward Dean Gregory le 30 avril 1952 à Brooklyn, son surnom Flame, son titre de champion du monde WBA en 1980 et sa carrière ultérieure d'entraîneur. Le texte ne fait aucune mention de sa religion ni de sa conversion; il est uniquement classé dans les catégories « Convertis à l'islam » et « Musulmans afro-américains »."
  ur: "ایڈی مصطفی محمد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے ایڈورڈ ڈین گریگوری کے طور پر 30 اپریل 1952 کو بروکلین میں جنم لیا، اس کا عرفی نام فلیم، اس کا 1980 کا ڈبلیو بی اے ورلڈ ٹائٹل، اور بعد میں بطور ٹرینر اس کا کیریئر۔ اس کے متن میں اس کے مذہب یا تبدیلی کا کوئی بیان نہیں ہے۔ یہ اسے صرف اسلام قبول کرنے اور افریقی نژاد امریکی مسلمانوں کے زمرے میں فائل کرتا ہے۔"
