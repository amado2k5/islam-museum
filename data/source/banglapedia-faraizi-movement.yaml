summary:
  ar: "مدخل الحركة الفرائضية في بنغلابيديا، الموسوعة الوطنية لبنغلاديش، بقلم معين الدين أحمد خان؛ تُستخدم لوقائع الكيان فقط. ينص على أن الفرائضيين تمسكوا بالمذهب الحنفي، وأن حاجي شريعة الله درس على الشيخ طاهر سومبل، المرجع في المذهب الحنفي، وأنه بحكم القانون الحنفي رأى تعطيل صلاتي الجمعة والعيدين في البنغال."
  en: "Entry 'Faraizi Movement' in Banglapedia, the national encyclopedia of Bangladesh, by Muin-ud-Din Ahmed Khan; used for entity facts only. It states that the Faraizis adhered to the Hanafi school, that Haji Shariatullah studied under Shaikh Tahir Sombal, an authority of the Hanafi school, and that in pursuance of the Hanafi law he held the Friday and Eid congregations not obligatory in Bengal."
