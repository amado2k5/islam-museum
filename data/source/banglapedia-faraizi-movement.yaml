reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia. Read in full on 1 November 2026. Its Doctrines section states in text that the Faraizis adhered to the Hanafi school with certain peculiarities, and its narrative states that Shariatullah studied religious doctrines under Tahir Sombal, an authority of the Hanafi school, and himself ruled in pursuance of the Hanafi law — textual attestations weighed in the museum's faith note together with the English article. It also records the movement's headquarters at Bahadurpur and his death in 1840, after which his son Dudu Miyan was acclaimed head of the movement."
