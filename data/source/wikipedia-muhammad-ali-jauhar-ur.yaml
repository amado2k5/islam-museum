summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد علي جوهر (1878–1931)؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه ناشط في تحریک الاستقلال وصحفي وشاعر، وتروي تعليمه في رامبور وبريلي وعليكرة وأكسفورد، وإصداره «كامريڈ» و«ہمدرد»، وسنوات سجنه، ووفاته في لندن في يناير 1931 ونقل جثمانه إلى بيت المقدس، وتنقل نماذج من شعره."
  en: "Urdu Wikipedia article on Muhammad Ali Jauhar (1878–1931); used for entity facts only. It presents him as an independence-movement activist, journalist and poet, and recounts his education at Rampur, Bareilly, Aligarh and Oxford, his launching of Comrade and Hamdard, his imprisonments, his death in London in January 1931 and the transfer of his body to Jerusalem, quoting samples of his verse."
  es: "Artículo de Wikipedia en urdu sobre Muhammad Ali Jauhar (1878-1931); utilizado únicamente para datos sobre la persona. Lo presenta como activista del movimiento independentista, periodista y poeta, y relata su educación en Rampur, Bareilly, Aligarh y Oxford, el lanzamiento de Comrade y Hamdard, sus encarcelamientos, su muerte en Londres en enero de 1931 y el traslado de su cuerpo a Jerusalén, citando ejemplos de su poesía."
  fr: "Article de Wikipédia en ourdou sur Muhammad Ali Jauhar (1878-1931); utilisé uniquement à des fins d’information. Il le présente comme un militant du mouvement d’indépendance, journaliste et poète, et relate ses études à Rampur, Bareilly, Aligarh et Oxford, le lancement de ses journaux Comrade et Hamdard, ses emprisonnements, sa mort à Londres en janvier 1931 et le transfert de sa dépouille à Jérusalem, en citant des extraits de ses poèmes."
  ur: "محمد علی جوہر (1878-1931) پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں انہیں تحریک آزادی کے کارکن، صحافی اور شاعر کے طور پر پیش کیا گیا ہے، اور ان کی رام پور، بریلی، علی گڑھ اور آکسفورڈ میں تعلیم، کامریڈ اور ہمدرد کی شروعات، ان کی قید، جنوری 1931 میں لندن میں ان کی موت اور یروشلم میں ان کی لاش کی منتقلی کا ذکر کیا گیا ہے۔"
