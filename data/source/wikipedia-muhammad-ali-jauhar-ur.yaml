  ar: "مقالة ويكيبيديا الأردية عن محمد علي جوهر (1878–1931)؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه ناشط في تحریک الاستقلال وصحفي وشاعر، وتروي تعليمه في رامبور وبريلي وعليكرة وأكسفورد، وإصداره «كامريڈ» و«ہمدرد»، وسنوات سجنه، ووفاته في لندن في يناير 1931 ونقل جثمانه إلى بيت المقدس، وتنقل نماذج من شعره."
  en: "Urdu Wikipedia article on Muhammad Ali Jauhar (1878–1931); used for entity facts only. It presents him as an independence-movement activist, journalist and poet, and recounts his education at Rampur, Bareilly, Aligarh and Oxford, his launching of Comrade and Hamdard, his imprisonments, his death in London in January 1931 and the transfer of his body to Jerusalem, quoting samples of his verse."
