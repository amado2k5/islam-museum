reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia. Read in full on 1 November 2026. It gives his Bengal tenure as 1664–1688 with a break of a little over a year in 1678–79, his Iranian origin as son of Asaf Khan and grandson of Mirza Ghias Beg Itimaduddaula, his original name Mirza Abu Talib and the title Amir-ul-Umara, his administrative reforms, the conquest of Chittagong on 26 January 1666, his trade discipline and his Dhaka buildings — Chhota Katra, the Lalbagh additions and the tomb of Bibi Pari, the Satgumbad and Chawk Bazar mosques. It names no faith for him; the naming of Shia for the man himself is in the same author's survey entry 'Islam, Bengal', a separate source record, and one naming is one source under the founder rulings."
