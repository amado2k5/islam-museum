summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد ظاهر شاه؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 15 أكتوبر 1914 بكابل ⁦(عن بريتانيكا)⁩، وملكه لأفغانستان من 8 نوفمبر 1933 حتى خلعه في 17 يوليو 1973، ومنفاه في إيطاليا وعودته سنة 2002 ولقب أب الأمة، ووفاته بكابل في 23 يوليو 2007 ودفنه على تل مرنجان. يحمل صندوق معلوماتها قيمة ديانة منظمة هي الإسلام السني."
  en: "English Wikipedia article on Mohammad Zahir Shah; used for entity facts only. It recounts his birth on 15 October 1914 at Kabul (citing Britannica), his reign as king of Afghanistan from 8 November 1933 until his deposition on 17 July 1973, his exile in Italy, his return in 2002 and the title Father of the Nation, and his death at Kabul on 23 July 2007 with burial on Maranjan Hill. Its infobox carries the structured religion value Sunni Islam."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Zahir Shah; utilizado únicamente para datos sobre la entidad. Relata su nacimiento el 15 de octubre de 1914 en Kabul (citando a la Enciclopedia Británica), su reinado como rey de Afganistán desde el 8 de noviembre de 1933 hasta su deposición el 17 de julio de 1973, su exilio en Italia, su regreso en 2002 y el título de Padre de la Nación, y su muerte en Kabul el 23 de julio de 2007, con sepultura en la colina de Maranjan. Su ficha informativa contiene el valor estructurado de religión Islam sunita."
  fr: "Article de Wikipédia en anglais sur Mohammad Zahir Shah; utilisé uniquement pour les informations biographiques. Il relate sa naissance le 15 octobre 1914 à Kaboul (d'après Britannica), son règne en tant que roi d'Afghanistan du 8 novembre 1933 à sa destitution le 17 juillet 1973, son exil en Italie, son retour en 2002 et son titre de Père de la Nation, ainsi que sa mort à Kaboul le 23 juillet 2007 et son inhumation sur la colline de Maranjan. Son infobox indique qu'il appartenait à l'islam sunnite."
  ur: "محمد ظاہر شاہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 15 اکتوبر 1914 کو کابل ⁦(برٹانیکا کا حوالہ دیتے ہوئے)⁩، 8 نومبر 1933 سے افغانستان کے بادشاہ کے طور پر 17 جولائی 1973 کو معزول ہونے تک، اٹلی میں ان کی جلاوطنی، 2002 میں ان کی واپسی اور قوم کے باپ کا خطاب، اور 23 جولائی کو ہلبران کے ساتھ کابل میں ان کی موت کا ذکر ہے۔ اس کے معلوماتی خانے میں سنّی اسلام کی تشکیل شدہ مذہبی قدر ہے۔"
