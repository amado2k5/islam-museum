  ar: "مقالة ويكيبيديا الإنجليزية عن محمد ظاهر شاه؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 15 أكتوبر 1914 بكابل (عن بريتانيكا)، وملكه لأفغانستان من 8 نوفمبر 1933 حتى خلعه في 17 يوليو 1973، ومنفاه في إيطاليا وعودته سنة 2002 ولقب أب الأمة، ووفاته بكابل في 23 يوليو 2007 ودفنه على تل مرنجان. يحمل صندوق معلوماتها قيمة ديانة منظمة هي الإسلام السني."
  en: "English Wikipedia article on Mohammad Zahir Shah; used for entity facts only. It recounts his birth on 15 October 1914 at Kabul (citing Britannica), his reign as king of Afghanistan from 8 November 1933 until his deposition on 17 July 1973, his exile in Italy, his return in 2002 and the title Father of the Nation, and his death at Kabul on 23 July 2007 with burial on Maranjan Hill. Its infobox carries the structured religion value Sunni Islam."
