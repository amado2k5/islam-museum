summary:
  ar: "مدخل موسوعي عن سيما سمر؛ يؤرخ ميلادها 4 فبراير 1957 (خلافًا لليوم المعتمد)، ويقول إن «أسرتها من أقلية الهزارة المسلمة الشيعية» — نسبة إلى الأسرة لا شهادة على مذهبها الشخصي — ويذكر استقالتها سنة 2002 بعد اتهامها بالتشكيك في الشريعة وبراءتها منه."
  en: "Encyclopedia.com entry on Sima Samar; it dates her birth to 4 February 1957 (a one-day variant on the followed date) and states 'Her family is from the Shi'ite Muslim Hazara minority' — a family attribution, not an attestation of her personal school — and records her 2002 resignation after a blasphemy accusation of which it says she was acquitted."
