summary:
  ar: "مدخل موسوعي عن سيما سمر؛ يؤرخ ميلادها 4 فبراير 1957 ⁦(خلافًا لليوم المعتمد)⁩، ويقول إن «أسرتها من أقلية الهزارة المسلمة الشيعية» — نسبة إلى الأسرة لا شهادة على مذهبها الشخصي — ويذكر استقالتها سنة 2002 بعد اتهامها بالتشكيك في الشريعة وبراءتها منه."
  en: "Encyclopedia.com entry on Sima Samar; it dates her birth to 4 February 1957 (a one-day variant on the followed date) and states 'Her family is from the Shi'ite Muslim Hazara minority' — a family attribution, not an attestation of her personal school — and records her 2002 resignation after a blasphemy accusation of which it says she was acquitted."
  es: "Entrada de Encyclopedia.com sobre Sima Samar; fecha su nacimiento el 4 de febrero de 1957 (una variación de un día respecto a la fecha seguida) y afirma que \"su familia pertenece a la minoría musulmana chiíta hazara\" —una atribución familiar, no una certificación de su escuela personal— y registra su dimisión en 2002 tras una acusación de blasfemia de la que, según se indica, fue absuelta."
  fr: "L'article d'Encyclopedia.com sur Sima Samar date sa naissance du 4 février 1957 (une variante d'un jour par rapport à la date suivante) et indique que « sa famille appartient à la minorité musulmane chiite hazara » — une attribution familiale, et non une attestation de son école personnelle — et mentionne sa démission en 2002 suite à une accusation de blasphème dont elle aurait été acquittée."
