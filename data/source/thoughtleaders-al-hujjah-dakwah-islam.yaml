reliability_note: "A third-party sponsorship platform's profile, independent of the creator: it describes AL-HUJJAH Dakwah Islam as an Indonesian-language YouTube channel from Indonesia dedicated to Islamic teachings and education, dates its first upload to 12 January 2013, and records 714K subscribers and 92M total views — agreeing closely with youtubers.me's independent count (713,000 subscribers, 91,018,934 views, 7,102 videos). Its upload-cadence figures are internally inconsistent (its text says about six videos a week, its header two a week) and are not used beyond a sustained cadence. No vidIQ page for this channel could be pinned, so both of this record's trackers are secondary and the figures are graded accordingly. The profile names no operator for the channel. Read on 15 November 2026."
