summary:
  ar: "مدخل بترا شميدل عن العرضي في The Biographical Encyclopedia of Astronomers ⁦(Springer 2007، ص 1161–1162)⁩ بنسختها المفتوحة على موقع McGill: ولادته نحو 1200 في عرض بين تدمر والرصافة، انتقاله إلى دمشق قبل 1239 مهندساً ومعلم هندسة، آلته «الكاملة» للملك المنصور بحمص 1252/1253، استدعاء الطوسي له إلى مراغة ومشاركته في بناء المرصد ⁦(تأسس 1259)⁩ وفي أرصاد الزيج الإيلخاني، ومصنفاه رسالة الرصد وكتاب الهيئة."
  en: "Petra G. Schmidl's Urdi entry in The Biographical Encyclopedia of Astronomers (Springer 2007, pp. 1161-1162), open copy on the McGill site: born c. 1200 at Urd between Palmyra and Rusafa, moved to Damascus before 1239 as engineer and geometry teacher, the so-called perfect instrument for al-Malik al-Mansur of Hims in 1252/1253, al-Tusi's call to Maragha and his part in building the observatory (founded 1259) and in the Ilkhani Zij observations, and his works Risalat al-Rasd and Kitab al-Haya."
  es: "Entrada de Petra G. Schmidl sobre Urdi en The Biographical Encyclopedia of Astronomers (Springer 2007, pp. 1161-1162), copia abierta en el sitio de McGill: nació c. 1200 en Urd entre Palmira y Rusafa, se mudó a Damasco antes de 1239 como ingeniero y profesor de geometría, el llamado instrumento perfecto para al-Malik al-Mansur de Hims en 1252/1253, la llamada de al-Tusi a Maragha y su participación en la construcción del observatorio (fundado en 1259) y en las observaciones de Ilkhani Zij, y sus obras Risalat al-Rasd y Kitab al-Haya."
  fr: "L'article de Petra G. Schmidl sur Urdi dans The Biographical Encyclopedia of Astronomers (Springer 2007, pp. 1161-1162), disponible en ligne sur le site de McGill: né vers 1200 à Urd entre Palmyre et Rusafa, s'installe à Damas avant 1239 comme ingénieur et professeur de géométrie, l'instrument dit parfait pour al-Malik al-Mansur de Hims en 1252/1253, l'appel d'al-Tusi à Maragha et son rôle dans la construction de l'observatoire (fondé en 1259) et dans les observations du Zij ilkhanide, et ses œuvres Risalat al-Rasd et Kitab al-Haya."
  ur: "دی بائیوگرافیکل انسائیکلوپیڈیا آف ایسٹرانومرز میں پیٹرا جی شمڈل کی اردو اندراج ⁦(اسپرنگر 2007، صفحہ 1161-1162)⁩، میک گل سائٹ پر کھلی کاپی: born c. پالمیرا اور روسفہ کے درمیان اردو میں 1200، انجینئر اور جیومیٹری کے استاد کے طور پر 1239 سے پہلے دمشق چلے گئے، 1252/1253 میں المالک المنصور کے حمص کے لیے نام نہاد کامل آلہ، الطوسی کا مراثہ کو بلایا گیا اور رصد گاہوں کی تعمیر میں اس کا حصہ، 1253 میں ایک انجینر اور جیومیٹری کے استاد کے طور پر۔ اور ان کی تصانیف رسالت الراسد اور کتاب الحیا۔"
title: "Urdi: Mu'ayyad (al-Milla wa-) al-Din (Mu'ayyad ibn Barik [Burayk]) al-Urdi (al-Amiri al-Dimashqi)"
