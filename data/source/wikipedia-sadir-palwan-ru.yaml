reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by its revision id with the returned id asserted equal. The article is an unreferenced stub: it gives his birth name as Sadir Khoshakhmat, his father Khoshakhmat as a migrant from Khotan (1766), the byname Palwan ('champion') for his size, strength and feats, his part in storming the Qing fortresses of Bayandai and Chilpanza, and his poetry. It names no religion for him; it records only his burial in a Muslim cemetery."
