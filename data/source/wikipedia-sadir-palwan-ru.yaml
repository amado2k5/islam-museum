summary:
  ar: "مقالة ويكيبيديا الروسية عن سادير بالوان؛ تُستخدم لوقائع الكيان فقط. تجعله بطلًا شعبيًا أويغوريًا وأحد قادة انتفاضة الأويغور سنة 1864 في إقليم إيلي، مولودًا سنة 1798 في قرية ملا توختي يوزي قرب غولجا ومتوفى فيها سنة 1871 ومدفونًا في مقبرتها المسلمة."
  en: "Russian Wikipedia stub article on Sadir Palwan; used for entity facts only. It presents him as a Uyghur folk hero and one of the leaders of the 1864 Uyghur uprising in the Ili region, born in 1798 at the village of Mollatokhtiyuzi near Ghulja (Qulja), died there in 1871 and buried in its Muslim cemetery."
  es: "Artículo incompleto de la Wikipedia rusa sobre Sadir Palwan; se utiliza únicamente para datos sobre la persona. Lo presenta como un héroe popular uigur y uno de los líderes del levantamiento uigur de 1864 en la región de Ili, nacido en 1798 en la aldea de Mollatokhtiyuzi, cerca de Ghulja (Qulja), donde falleció en 1871 y fue enterrado en su cementerio musulmán."
  fr: "Ébauche d'article de Wikipédia russe sur Sadir Palwan; utilisé uniquement à des fins d'information sur l'entité. Il le présente comme un héros populaire ouïghour et l'un des chefs du soulèvement ouïghour de 1864 dans la région d'Ili, né en 1798 au village de Mollatokhtiyuzi près de Ghulja (Qulja), mort au même endroit en 1871 et enterré dans son cimetière musulman."
  ur: "سدیر پالوان پر روسی ویکیپیڈیا کا نامکمل مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے ایک ایغور لوک ہیرو اور الی کے علاقے میں 1864 کی اویغور بغاوت کے رہنماؤں میں سے ایک کے طور پر پیش کیا گیا ہے، جو 1798 میں غلجا ⁦(قلجہ)⁩ کے قریب مولاٹوختیوزی گاؤں میں پیدا ہوا، 1871 میں وہیں انتقال کر گیا اور اس کے مسلم قبرستان میں دفن ہوا۔"
  tr: "Sadir Balwan hakkında Rusça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Uygur halk kahramanı ve 1864'te Ili bölgesinde gerçekleşen Uygur ayaklanmasının liderlerinden biri olarak kabul edilir; 1798'de Golja yakınlarındaki Mela Tokhti Yuzi köyünde doğmuş, 1871'de orada ölmüş ve Müslüman mezarlığına defnedilmiştir."
  id: "Artikel Wikipedia Rusia tentang Sadir Balwan; digunakan hanya untuk fakta entitas. Ia dianggap sebagai pahlawan populer Uyghur dan salah satu pemimpin pemberontakan Uyghur pada tahun 1864 di wilayah Ili, lahir pada tahun 1798 di desa Mela Tokhti Yuzi dekat Golja, meninggal di sana pada tahun 1871, dan dimakamkan di pemakaman Muslim di sana pada tahun 1871."
