summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد حسين آزاد؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في دلهي في 5 مايو 1830 ووفاته في لاهور في 22 يناير 1910، ودراسته في كلية دلهي، وانتقاله إلى لاهور سنة 1861، وتدريسه وأمانته لأنجمن بنجاب، ومؤلفاته وعلى رأسها «آب حيات» (1880)."
  en: "English Wikipedia article on Muhammad Husain Azad; used for entity facts only. It records his birth in Delhi on 5 May 1830 and death in Lahore on 22 January 1910, his studies at Delhi College, his migration to Lahore in 1861, his teaching and his secretaryship of the Anjuman-e-Punjab, and his works, above all Aab-e-Hayat (1880)."
