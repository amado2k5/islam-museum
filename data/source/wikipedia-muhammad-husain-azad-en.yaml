summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد حسين آزاد؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في دلهي في 5 مايو 1830 ووفاته في لاهور في 22 يناير 1910، ودراسته في كلية دلهي، وانتقاله إلى لاهور سنة 1861، وتدريسه وأمانته لأنجمن بنجاب، ومؤلفاته وعلى رأسها «آب حيات» (1880)."
  en: "English Wikipedia article on Muhammad Husain Azad; used for entity facts only. It records his birth in Delhi on 5 May 1830 and death in Lahore on 22 January 1910, his studies at Delhi College, his migration to Lahore in 1861, his teaching and his secretaryship of the Anjuman-e-Punjab, and his works, above all Aab-e-Hayat (1880)."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad Husain Azad; utilizado únicamente para datos biográficos. En él se recogen su nacimiento en Delhi el 5 de mayo de 1830 y su fallecimiento en Lahore el 22 de enero de 1910, sus estudios en el Delhi College, su migración a Lahore en 1861, su labor docente y su cargo como secretario de la Anjuman-e-Punjab, y sus obras, sobre todo Aab-e-Hayat (1880)."
  fr: "Article de Wikipédia en anglais sur Muhammad Husain Azad; utilisé uniquement pour les informations biographiques. Il relate sa naissance à Delhi le 5 mai 1830 et sa mort à Lahore le 22 janvier 1910, ses études au Delhi College, son installation à Lahore en 1861, son enseignement et son poste de secrétaire de l’Anjuman-e-Punjab, ainsi que ses œuvres, notamment Aab-e-Hayat (1880)."
  ur: "محمد حسین آزاد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 5 مئی 1830 کو دہلی میں ان کی پیدائش اور 22 جنوری 1910 کو لاہور میں وفات، دہلی کالج میں ان کی تعلیم، 1861 میں لاہور ہجرت، ان کی تدریس اور انجمن پنجاب کی سیکرٹری شپ اور ان کے کام، سب سے بڑھ کر آب حیات (1880) کو درج کیا گیا ہے۔"
  tr: "Muhammed Hüseyin Azad hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. 5 Mayıs 1830'da Delhi'de doğması, 22 Ocak 1910'da Lahor'da ölümü, Delhi Koleji'ndeki eğitimi, 1861'de Lahor'a taşınması, Anjuman Pencap'ta öğretimi ve öğretimi ile yazıları, bunların başında 'Ab Hayat' (1880) bulunmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad Hussain Azad; hanya digunakan untuk fakta entitas. Kelahirannya di Delhi pada 5 Mei 1830, kematiannya di Lahore pada 22 Januari 1910, studinya di Delhi College, kepindahannya ke Lahore pada tahun 1861, pengajarannya dan pengajarannya tentang Anjuman Punjab, serta tulisan-tulisannya, terutama 'Ab Hayat' (1880)."
