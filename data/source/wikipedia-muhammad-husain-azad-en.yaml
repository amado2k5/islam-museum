reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The article rests chiefly on Frances W. Pritchett's Columbia University profile of Azad and on the Urdu Adab profile. It gives his birth as 5 May 1830; the Urdu article and Wikidata give 10 June 1830 and Rekhta gives 5 September 1830 — the variants are recorded in the person record and the English article's date is followed."
