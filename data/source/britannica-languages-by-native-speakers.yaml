summary:
  ar: "صفحة «Languages by number of native speakers | List, Top, & Most Spoken | Britannica» لدى Encyclopaedia Britannica، 4 Aug 2023. لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملف بحث قدمه المؤسس إلى المتحف ووافق على استعماله في 21 نوفمبر 2026. يُستشهد بها في: أعداد المتكلمين أو غيابها."
  en: "The page \"Languages by number of native speakers | List, Top, & Most Spoken | Britannica\" (Encyclopaedia Britannica; 4 Aug 2023). The museum did not open it itself: its content is known from a research file supplied to the museum by the founder, who approved its use on 21 November 2026. Cited for: speaker numbers or the lack of them."
  ur: "صفحہ «Languages by number of native speakers | List, Top, & Most Spoken | Britannica»، Encyclopaedia Britannica، 4 Aug 2023۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کا مواد بانی کی فراہم کردہ تحقیقی فائل سے معلوم ہوا، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ ان کے لیے دیا گیا: بولنے والوں کی تعداد یا اس کی عدم دستیابی۔"
  fr: "La page « Languages by number of native speakers | List, Top, & Most Spoken | Britannica » (Encyclopaedia Britannica ; 4 Aug 2023). Le musée ne l'a pas ouverte lui-même : son contenu est connu par un dossier de recherche fourni au musée par le fondateur, qui en a approuvé l'usage le 21 novembre 2026. Citée pour : le nombre de locuteurs ou son absence."
  es: "La página «Languages by number of native speakers | List, Top, & Most Spoken | Britannica» (Encyclopaedia Britannica; 4 Aug 2023). El museo no la abrió por sí mismo: su contenido se conoce por un archivo de investigación entregado al museo por el fundador, que aprobó su uso el 21 de noviembre de 2026. Citada para: el número de hablantes o su ausencia."
  tr: "«Ana dili konuşanların sayısına göre diller | Liste, En Çok Konuşulan | Britannica» sayfası, Encyclopaedia Britannica'da, 4 Ağustos 2023. Müze kendisi açmadı; içeriği, kurucu tarafından müzeye sunulan bir araştırma dosyasından biliniyordu ve 21 Kasım 2026'da kullanmayı kabul etti. Atıf alanı: Konuşmacı sayısı veya devamsızlık."
  id: "Halaman «Bahasa berdasarkan jumlah penutur asli | Daftar, Atas, & Paling Banyak Digunakan | Britannica» di Encyclopaedia Britannica, 4 Agustus 2023. Museum tidak membukanya sendiri; isinya diketahui dari berkas penelitian yang diserahkan oleh pendiri kepada museum dan ia setuju menggunakannya pada 21 November 2026. Dikutip dalam: Jumlah penutur atau ketidakhadiran."
