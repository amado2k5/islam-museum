  ar: "مقالة ويكيبيديا الإنجليزية عن صادقي بك أفشار؛ تعطي ولادته نحو 1533 في تبريز (940هـ) ووفاته 1610 في أصفهان، وسنواته درويشًا متجولًا ثم رسامًا في البلاط الصفوي وأمينًا للمكتبة الملكية حتى إقالته 1596، وكتابيه «مجمع الخواص» و«قانون الصور»."
  en: "English Wikipedia article on Sadiqi Beg Afshar; it gives his birth about 1533 in Tabriz (940 AH) and death in 1610 in Isfahan, his years as a wandering dervish, his service as a Safavid court painter and head of the royal library until his dismissal in 1596, and his works Majma' al-khavass and Qanun as-Suwar."
