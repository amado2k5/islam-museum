summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صادقي بك أفشار؛ تعطي ولادته نحو 1533 في تبريز ⁦(940هـ)⁩ ووفاته 1610 في أصفهان، وسنواته درويشًا متجولًا ثم رسامًا في البلاط الصفوي وأمينًا للمكتبة الملكية حتى إقالته 1596، وكتابيه «مجمع الخواص» و«قانون الصور»."
  en: "English Wikipedia article on Sadiqi Beg Afshar; it gives his birth about 1533 in Tabriz (940 AH) and death in 1610 in Isfahan, his years as a wandering dervish, his service as a Safavid court painter and head of the royal library until his dismissal in 1596, and his works Majma' al-khavass and Qanun as-Suwar."
  es: "Artículo de la Wikipedia en inglés sobre Sadiqi Beg Afshar; en él se indica su nacimiento alrededor de 1533 en Tabriz (940 AH) y su muerte en 1610 en Isfahán, sus años como derviche errante, su servicio como pintor de la corte safávida y director de la biblioteca real hasta su destitución en 1596, y sus obras Majma' al-khavass y Qanun as-Suwar."
  fr: "L'article de Wikipédia en anglais sur Sadiqi Beg Afshar; il indique sa naissance vers 1533 à Tabriz (940 AH) et sa mort en 1610 à Ispahan, ses années comme derviche errant, son service comme peintre de la cour safavide et chef de la bibliothèque royale jusqu'à son renvoi en 1596, et ses œuvres Majma' al-khavass et Qanun as-Suwar."
  ur: "صادقی بیگ افشار پر انگریزی ویکیپیڈیا مضمون؛ اس میں ان کی پیدائش 1533 کے بارے میں تبریز ⁦(940 ہجری)⁩ اور وفات 1610 میں اصفہان میں، ایک آوارہ درویش کے طور پر اس کے سال، صفوی دربار کے مصور اور شاہی کتب خانے کے سربراہ کے طور پر ان کی خدمات 1596 میں اس کی برطرفی تک، اور ان کی تصانیف مجمع الخواص اور قنون الصوار شامل ہیں۔"
  tr: "Sadeghi Bey Afshar hakkında İngilizce Wikipedia makalesi, onun yaklaşık 1533 yılında Tebriz'de (940 Hicri) doğduğunu ve 1610'da İsfahan'da öldüğünü anlatır. Yıllarını gezgin bir derviş olarak geçirdi, ardından Safevi sarayında ressam ve kraliyet kütüphanesinin küratörü olarak görev yaptı; 1596'da görevden alınana kadar ve iki kitabı 'Majma' al-Khawas' ile 'Sur Kanonu' da vardı."
  id: "Artikel Wikipedia bahasa Inggris tentang Sadeghi Bey Afshar menceritakan kelahirannya sekitar tahun 1533 di Tabriz (940 H) dan kematiannya pada tahun 1610 di Isfahan. Ia menghabiskan tahun-tahunnya sebagai dervish pengembara, kemudian sebagai pelukis di istana Safavid dan sebagai kurator perpustakaan kerajaan hingga dipecat pada tahun 1596, serta dua bukunya 'Majma' al-Khawas dan 'The Canon of Tyres.'"
