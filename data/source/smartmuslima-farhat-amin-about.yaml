summary:
  ar: "الصفحة التعريفية في موقع «سمارت مسلمة»، موقع فرحات أمين وبودكاستها؛ تعرّف بها مؤلفة ومتحدثة تشارك نصائح الحياة للنساء المسلمات عبر موقعها وكتبها ودوراتها في الزواج وفهم النسوية، وتورد كتبها: «فتاة، هدفك الجنة» و«مسلمة عزباء ذكية» و«أسئلة لخطيب محتمل» و«نصائح زواج للمسلمات العازبات» و«ارفعوا أيديكم عن حجابنا»."
  en: "The about page of Smart Muslima, Farhat Amin's website and podcast platform. It presents her as an author and public speaker sharing life advice for Muslim women through her site, her books — Girl, Your Goal Is Jannah; Smart Single Muslimah; Questions to Ask a Potential Spouse; Marriage Advice for Single Muslim Women; Hands Off Our Hijab — and her courses on marriage and on Islam and feminism."
