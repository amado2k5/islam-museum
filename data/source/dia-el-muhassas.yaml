reliability_note: "Read in the museum's session on 20 November 2026. It describes al-Mukhassas as a large encyclopaedic dictionary arranged like Abu Ubayd al-Qasim ibn Sallam's al-Gharib al-musannaf, bringing together the contents of earlier specialist treatises; says Ibn Sida wrote it, like al-Muhkam, at the request of Mujahid al-Amiri of Denia, to gather synonyms and their shades of meaning for writers; that its long preface treats the origin of language; and that it has seventeen books (the Book of Man, of Women, of Horses and others) divided into chapters. Used for entity facts only."
