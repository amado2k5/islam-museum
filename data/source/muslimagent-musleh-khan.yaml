summary:
  ar: "ملف مصلح خان في دليل «مسلم إيجنت»: وُلد في المدينة المنورة ونشأ في تورنتو، حيث يعمل عالمًا مقيمًا في المعهد الإسلامي في تورنتو، واختير سنة 2016 ليكون المرسّخ المسلم الوحيد لدى شرطة تورنتو، ويقيم في ميبل بأونتاريو."
  en: "Muslim Agent's directory profile of Musleh Khan: born in Madinah, Saudi Arabia and raised in Toronto, where he is Resident Scholar at the Islamic Institute of Toronto; selected in 2016 as the only Muslim chaplain with the Toronto Police Service; resident in Maple, Ontario."
  es: "Perfil de Musleh Khan en el directorio de Muslim Agent: nació en Medina, Arabia Saudita, y se crió en Toronto, donde es investigador residente en el Instituto Islámico de Toronto; fue seleccionado en 2016 como el único capellán musulmán del Servicio de Policía de Toronto; reside en Maple, Ontario."
  fr: "Profil de Musleh Khan dans l'annuaire Muslim Agent: né à Médine, en Arabie saoudite, et élevé à Toronto, où il est chercheur résident à l'Institut islamique de Toronto; sélectionné en 2016 comme seul aumônier musulman auprès du service de police de Toronto; résidant à Maple, en Ontario."
  ur: "مسلم ایجنٹ کی مصلح خان کی ڈائرکٹری پروفائل: مدینہ، سعودی عرب میں پیدا ہوئے اور ٹورنٹو میں پرورش پائی، جہاں وہ اسلامک انسٹی ٹیوٹ آف ٹورنٹو میں ریذیڈنٹ اسکالر ہے۔ ٹورنٹو پولیس سروس کے ساتھ 2016 میں واحد مسلمان پادری کے طور پر منتخب کیا گیا۔ میپل، اونٹاریو میں رہائشی۔"
  tr: "Musleh Khan'ın 'Müslüman Ajan' dizinindeki dosyası: Medine'de doğup Toronto'da büyüyen Khan, Toronto'daki İslam Enstitüsü'nde yerleşik akademisyen olarak çalışıyor, 2016 yılında Toronto Polisi'nde tek Müslüman katip olarak seçildi ve Maple, Ontario'da ikamet ediyor."
  id: "Berkas Musleh Khan dalam direktori 'Muslim Agent': Lahir di Madinah dan dibesarkan di Toronto, di mana ia bekerja sebagai ulama tetap di Islamic Institute di Toronto, ia terpilih pada tahun 2016 sebagai satu-satunya pegawai Muslim di Kepolisian Toronto dan tinggal di Maple, Ontario."
