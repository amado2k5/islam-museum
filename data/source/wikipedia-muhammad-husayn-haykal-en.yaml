reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A short article. It records his birth at Kafr Ghannam, Mansoura, his law degree of 1909 and Sorbonne PhD of 1912, the composition of Zaynab in Paris and its standing in the debate over the first modern Egyptian novel (with Elliott Colla's caveat), his co-founding and editorship of Al Siyasa, his appointment as minister of state in 1937 and minister of education in November 1940 with his decentralising reforms, his formation under Muhammad Abduh, Ahmad Lutfi el-Sayed and Qasim Amin, his seven children including the Egyptologist Fayza Haikal, and his works with dates — several of which differ from the Arabic article's (The Life of Muhammad 1933 against 1935; In the House of Revelation 1939 against 1937; Uthman Ibn Affan 1968 against 1964); the variants are recorded in the prose. Its lead calls him the first Egyptian, Arab, Middle Easterner and African to earn a habilitation from the Sorbonne — an article claim, presented as such. It names no religion or school for him. Read in full on 24 October 2026."
