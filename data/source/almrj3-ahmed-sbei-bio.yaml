summary:
  ar: "سيرة منشورة عن أحمد سبيع في موقع المرجع؛ تصفه بأنه باحث ومحاضر وكاتب في مقارنة الأديان يجيد العبرية وعضو مؤسس بمدونة النقد النصي للعهد القديم ومؤسس قناة البينة، وتذكر اعتقاله سنة 2020 ثم الإفراج عنه."
  en: "A published biography of Ahmed Sbei on the Al-Mrj3 site, describing him as a researcher, lecturer and writer in comparative religion who knows Hebrew, a founding member of the Old Testament textual-criticism blog and founder of the Al-Bayyinah channel, and recording his arrest in 2020 and later release."
  es: "En el sitio web Al-Mrj3 se publicó una biografía de Ahmed Sbei que lo describe como investigador, profesor y escritor de religión comparada, conocedor del hebreo, miembro fundador del blog de crítica textual del Antiguo Testamento y fundador del canal Al-Bayyinah, y que recoge su detención en 2020 y su posterior liberación."
  fr: "Une biographie d'Ahmed Sbei publiée sur le site Al-Mrj3 le décrit comme chercheur, conférencier et écrivain en religion comparée qui connaît l'hébreu, membre fondateur du blog de critique textuelle de l'Ancien Testament et fondateur de la chaîne Al-Bayyinah, et relate son arrestation en 2020 et sa libération ultérieure."
  ur: "المرج 3 سائٹ پر احمد صبی کی ایک شائع شدہ سوانح عمری، جس میں انھیں تقابلی مذہب کے ایک محقق، لیکچرر اور مصنف کے طور پر بیان کیا گیا ہے جو کہ عبرانی زبان جانتے ہیں، عہد نامہ قدیم کے متنی تنقیدی بلاگ کے بانی رکن اور البیینہ چینل کے بانی، اور 2020 میں ان کی گرفتاری اور بعد ازاں رہائی کی ریکارڈنگ۔"
title: "من هو أحمد سبيع ويكيبيديا"
