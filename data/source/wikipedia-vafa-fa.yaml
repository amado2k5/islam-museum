  ar: "مقالة ويكيبيديا الفارسية عن کامران وفا؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته سنة 1960 في طهران ⁦(السنة فقط)⁩، ومسيرته في هارفارد بعد دكتوراه برينستون، وقائمة جوائزه وفيها جائزة مصطفى 2021."
  en: "Persian Wikipedia article on Cumrun Vafa; used for entity facts only. It gives his birth in 1960 at Tehran (year only), his Harvard career after the Princeton doctorate, and his awards list including the 2021 Mustafa Prize."
  es: "Artículo de la Wikipedia en persa sobre Cumrun Vafa; se utiliza únicamente para obtener información sobre la persona. Menciona su nacimiento en 1960 en Teherán (solo el año), su trayectoria en Harvard tras obtener el doctorado en Princeton y su lista de premios, incluido el Premio Mustafa de 2021."
  fr: "Article Wikipédia en persan sur Cumrun Vafa; utilisé uniquement pour les informations le concernant. Il mentionne sa naissance en 1960 à Téhéran (année seulement), ses études à Harvard après son doctorat à Princeton, et la liste de ses distinctions, dont le prix Mustafa 2021."
  ur: "کمرون وفا پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1960 میں تہران میں ان کی پیدائش ⁦(صرف سال)⁩، پرنسٹن ڈاکٹریٹ کے بعد ان کا ہارورڈ کیریئر، اور 2021 مصطفی انعام سمیت ان کے ایوارڈز کی فہرست دیتا ہے۔"
