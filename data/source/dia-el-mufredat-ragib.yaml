summary:
  ar: "مدخل «موسوعة الإسلام» لمؤسسة الشؤون الدينية التركية TDV عن المفردات في غريب القرآن، اطُّلع عليه في ٢٠ نوفمبر ٢٠٢٦؛ يُستخدم لوقائع الكيان: تاريخه ومقدمته وترتيبه ومكانه في تراث غريب القرآن."
  en: "The TDV İslâm Ansiklopedisi entry on al-Mufradat fi Gharib al-Qur'an (online edition), read on 20 November 2026; used for entity facts: its date, preface, arrangement and place in the tradition."
  es: "Entrada de la TDV İslâm Ansiklopedisi sobre al-Mufradat fi Gharib al-Qur'an (edición en línea), consultada el 20 de noviembre de 2026; utilizada para datos de la entidad: su fecha, prólogo, ordenación y lugar en la tradición."
  fr: "Article de la TDV İslâm Ansiklopedisi sur al-Mufradat fi Gharib al-Qur'an (édition en ligne), consulté le 20 novembre 2026 ; utilisé pour les données de l'entité : sa date, sa préface, son classement et sa place dans la tradition."
  ur: "TDV İslâm Ansiklopedisi ⁦(آن لائن ایڈیشن)⁩ میں al-Mufradat fi Gharib al-Qur'an پر اندراج، 20 نومبر 2026 کو پڑھا؛ ہستی کے حقائق کے لیے استعمال: تاریخ، مقدمہ، ترتیب اور روایت میں مقام."
  tr: "Türk Dini İşler Vakfı (TDV) tarafından Garip Kur'an'da Kelime Dağarcığı üzerine \"İslam Ansiklopedisi\"ne 20 Kasım 2026 tarihinde erişilmiştir; varlığın gerçekleri: tarihi, girişi, düzenlenişi ve garip Kur'an'ın mirasındaki yeri için kullanılmıştır."
  id: "Entri ke \"Ensiklopedia Islam\" oleh Turkish Religious Affairs Foundation (TDV) tentang Kosakata dalam Al-Qur'an Aneh, diakses pada 20 November 2026; digunakan untuk fakta-fakta entitas: sejarahnya, pengenalan, pengaturan, dan posisinya dalam warisan Al-Qur'an yang aneh."
