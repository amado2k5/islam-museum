reliability_note: "Read in the museum's session on 20 November 2026. It gives the full title al-Mufradat fi gharib al-Qur'an; says a note on a manuscript in Damascus, thought to be in the author's hand, shows it was written by 409 (1018); that the preface treats the linguistic character of the Qur'an and what the book is for; and that it marks a turning point in the gharib al-Qur'an tradition: earlier works followed the order of the suras, while al-Mufradat is alphabetical, covers almost all Qur'anic words and gives all the derivatives that occur in the Qur'an. Used for entity facts only; its entry on the author's death date is not used (see source/dia-ragib)."
