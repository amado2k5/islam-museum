summary:
  ar: "نعي موقع فيريتاس إندونيسيا الإخباري لمايكل بامبانغ هارتونو في 20 آذار 2026: يذكر وفاته في سنغافورة في 19 آذار عن 86 عامًا، ومولده في كودوس في 2 تشرين الأول 1939، وبناءه مع أخيه الأصغر روبرت بودي مجموعة جاروم وبنك سنترال آسيا، ويصفه بأنه كاثوليكي لم يكن يتباهى بهويته الكاثوليكية، ويذكر ميداليته البرونزية في البريدج في ألعاب آسيا 2018."
  en: "Veritas Indonesia news obituary of Michael Bambang Hartono, published 20 March 2026; it records his death in Singapore on 19 March aged 86, his birth in Kudus on 2 October 1939, his building of the Djarum Group and Bank Central Asia with his younger brother Robert Budi, describes him as a Catholic who hardly flaunted his Catholic identity, and notes his bridge bronze medal at the 2018 Asian Games."
