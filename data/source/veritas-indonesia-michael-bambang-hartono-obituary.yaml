summary:
  ar: "نعي موقع فيريتاس إندونيسيا الإخباري لمايكل بامبانغ هارتونو في 20 آذار 2026: يذكر وفاته في سنغافورة في 19 آذار عن 86 عامًا، ومولده في كودوس في 2 تشرين الأول 1939، وبناءه مع أخيه الأصغر روبرت بودي مجموعة جاروم وبنك سنترال آسيا، ويصفه بأنه كاثوليكي لم يكن يتباهى بهويته الكاثوليكية، ويذكر ميداليته البرونزية في البريدج في ألعاب آسيا 2018."
  en: "Veritas Indonesia news obituary of Michael Bambang Hartono, published 20 March 2026; it records his death in Singapore on 19 March aged 86, his birth in Kudus on 2 October 1939, his building of the Djarum Group and Bank Central Asia with his younger brother Robert Budi, describes him as a Catholic who hardly flaunted his Catholic identity, and notes his bridge bronze medal at the 2018 Asian Games."
  es: "El obituario de Michael Bambang Hartono, publicado por Veritas Indonesia el 20 de marzo de 2026, recoge su fallecimiento en Singapur el 19 de marzo a los 86 años, su nacimiento en Kudus el 2 de octubre de 1939, la creación del Grupo Djarum y del Banco Central Asia junto a su hermano menor, Robert Budi. Lo describe como un católico que apenas hacía alarde de su identidad católica y destaca su medalla de bronce en bridge en los Juegos Asiáticos de 2018."
  fr: "L'article nécrologique de Michael Bambang Hartono paru dans Veritas Indonesia le 20 mars 2026 relate son décès à Singapour le 19 mars à l'âge de 86 ans, sa naissance à Kudus le 2 octobre 1939, la création du groupe Djarum et de la Bank Central Asia avec son jeune frère Robert Budi, le décrit comme un catholique discret et mentionne sa médaille de bronze en bridge aux Jeux asiatiques de 2018."
  ur: "20 مارچ 2026 کو شائع ہونے والی مائیکل بامبنگ ہارٹونو کی ویریٹاس انڈونیشیا کی خبروں کا بیان؛ اس میں 19 مارچ کو 86 سال کی عمر میں سنگاپور میں ان کی موت، 2 اکتوبر 1939 کو قدوس میں ان کی پیدائش، دجارم گروپ اور بینک سینٹرل ایشیا کی ان کے چھوٹے بھائی رابرٹ بوڈی کے ساتھ ان کی عمارت، اسے ایک کیتھولک کے طور پر بیان کرتی ہے جس نے اپنی کیتھولک شناخت کو مشکل سے ظاہر کیا، اور As208 کے گیمز میں اس کا پل کانسی کا تمغہ نوٹ کیا۔"
  tr: "Veritas Indonesia haber sitesi Michael Bambang Hartono için 20 Mart 2026'da ölüm ilanları: 19 Mart'ta Singapur'da 86 yaşında vefatını, 2 Ekim 1939'da Kudos'ta doğmasını ve küçük kardeşi Robert Bodie ile birlikte Garum Group ve Central Asia Bank'tan inşaatını anmaktadır. Kitap, onu Katolik kimliğiyle övünmeyen bir Katolik olarak tanımlar ve 2018 Asya Oyunları'nda briçte bronz madalyasını anmaktadır."
  id: "Obituari situs berita Veritas Indonesia untuk Michael Bambang Hartono pada 20 Maret 2026: Ia memperingati kematiannya di Singapura pada 19 Maret pada usia 86 tahun, kelahirannya di Kudos pada 2 Oktober 1939, dan pembangunan bersama adik laki-lakinya Robert Bodie dari Garum Group dan Central Asia Bank. Artikel tersebut menggambarkannya sebagai seorang Katolik yang tidak membanggakan identitas Katoliknya, dan menyebutkan medali perunggunya di bridge pada Asian Games 2018."
