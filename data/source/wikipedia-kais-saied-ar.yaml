summary:
  ar: "مقالة ويكيبيديا العربية عن قيس سعيد؛ تُستخدم لوقائع الكيان فقط. تؤكد ولادته في تونس في 22 فبراير 1958 وتخصصه في القانون الدستوري ورئاسته لتونس منذ أكتوبر 2019، ويذكر صندوق معلوماتها دينه «الإسلام» بصورة عامة."
  en: "Arabic Wikipedia article on Kais Saied; used for entity facts only. It confirms his birth at Tunis on 22 February 1958, his specialism in constitutional law and his presidency of Tunisia since October 2019; its infobox gives his religion as Islam in general."
  es: "Artículo de Wikipedia en árabe sobre Kais Saied; utilizado únicamente para datos sobre la persona. Confirma su nacimiento en Túnez el 22 de febrero de 1958, su especialización en derecho constitucional y su presidencia de Túnez desde octubre de 2019; su ficha informativa indica que profesa el islam en general."
  fr: "Article Wikipédia en arabe sur Kais Saied; utilisé uniquement pour les informations relatives à l’entité. Il confirme sa naissance à Tunis le 22 février 1958, sa spécialisation en droit constitutionnel et sa présidence de la Tunisie depuis octobre 2019; son infobox indique qu’il est de confession musulmane."
  ur: "قیس سعید پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 22 فروری 1958 کو تیونس میں ان کی پیدائش، آئینی قانون میں ان کی مہارت اور اکتوبر 2019 سے تیونس کی صدارت کی تصدیق کرتا ہے۔ اس کا انفو باکس اس کا مذہب عام طور پر اسلام کے طور پر دیتا ہے۔"
