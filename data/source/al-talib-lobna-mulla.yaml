  ar: "تقرير مجلة «الطالب»، مجلة الطلاب المسلمين في جامعة كاليفورنيا بلوس أنجلوس، عن ندوة «العلاقات بين الجنسين والزواج» التي قادتها لبنى ملا لجمعية الطلاب المسلمين بالجامعة؛ يصفها بأنها قائدة شبابية بارزة في جنوب كاليفورنيا ومقدِّمة قناة «دبل شوت موكا» على يوتيوب، وينقل إجاباتها عن آداب الزواج الإسلامي."
