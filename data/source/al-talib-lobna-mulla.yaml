summary:
  ar: "تقرير مجلة «الطالب»، مجلة الطلاب المسلمين في جامعة كاليفورنيا بلوس أنجلوس، عن ندوة «العلاقات بين الجنسين والزواج» التي قادتها لبنى ملا لجمعية الطلاب المسلمين بالجامعة؛ يصفها بأنها قائدة شبابية بارزة في جنوب كاليفورنيا ومقدِّمة قناة «دبل شوت موكا» على يوتيوب، وينقل إجاباتها عن آداب الزواج الإسلامي."
  en: "Al-Talib, the UCLA Muslim student magazine, reporting on the UCLA Muslim Student Association's 'Gender Relations & Marriage' event led by Lobna Mulla; it describes her as a prominent youth leader within Southern California and the host of the YouTube channel Double Shot Mocha, and records her answers on Islamic marriage etiquette."
  es: "La revista estudiantil musulmana de la UCLA, Al-Talib, informa sobre el evento \"Relaciones de género y matrimonio\" de la Asociación de Estudiantes Musulmanes de la UCLA, dirigido por Lobna Mulla; la describe como una destacada líder juvenil del sur de California y presentadora del canal de YouTube Double Shot Mocha, y recoge sus respuestas sobre la etiqueta matrimonial islámica."
  fr: "Al-Talib, le magazine étudiant musulman de l'UCLA, rend compte de l'événement « Relations entre les sexes et mariage » organisé par l'Association des étudiants musulmans de l'UCLA et dirigé par Lobna Mulla; il la décrit comme une figure importante de la jeunesse en Californie du Sud et l'animatrice de la chaîne YouTube Double Shot Mocha, et enregistre ses réponses sur l'étiquette du mariage islamique."
  ur: "الطالب، یو سی ایل اے مسلم اسٹوڈنٹ میگزین، یو سی ایل اے مسلم اسٹوڈنٹ ایسوسی ایشن کے 'جینڈر ریلیشنز اینڈ میرج' ایونٹ کی رپورٹنگ کر رہا ہے جس کی قیادت لوبنا ملا ہے؛ اس میں اسے جنوبی کیلیفورنیا میں ایک ممتاز نوجوان رہنما اور یوٹیوب چینل ڈبل شاٹ موچا کی میزبان کے طور پر بیان کیا گیا ہے، اور اسلامی شادی کے آداب پر اس کے جوابات درج کیے گئے ہیں۔"
