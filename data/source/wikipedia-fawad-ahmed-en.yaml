summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فواد أحمد، لاعب الكريكت الأسترالي السابق المولود في باكستان؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في صوابي بإقليم خيبر بختونخوا في 10 مارس 1979 ⁦(انظر تعارض التاريخ في سجل الشخص)⁩، ومغادرته باكستان سنة 2010 وطلب اللجوء في أستراليا ومنحه الإقامة الدائمة في نوفمبر 2012 والجنسية الأسترالية في يوليو 2013، ومبارياته الدولية لأستراليا في 2013، وتصفه بأنه مسلم متدين أُزيل شعار شركة جعة عن قميصه سنة 2013."
  en: "English Wikipedia article on Fawad Ahmed, the Pakistan-born former Australian cricketer; used for entity facts only. It records his birth in Swabi, Khyber Pakhtunkhwa, on 10 March 1979 (see the date conflict noted in the person record), his departure from Pakistan in 2010, his asylum claim in Australia, permanent residency in November 2012 and Australian citizenship in July 2013, his international matches for Australia in 2013, and describes him as a devout Muslim whose shirt had a beer sponsor's logo removed in 2013."
  es: "Artículo de la Wikipedia en inglés sobre Fawad Ahmed, el exjugador de críquet australiano nacido en Pakistán; utilizado únicamente para datos sobre la persona. Registra su nacimiento en Swabi, Khyber Pakhtunkhwa, el 10 de marzo de 1979 (véase la discrepancia de fechas en el registro de la persona), su salida de Pakistán en 2010, su solicitud de asilo en Australia, la residencia permanente en noviembre de 2012 y la ciudadanía australiana en julio de 2013, sus partidos internacionales con Australia en 2013, y lo describe como un musulmán devoto al que le quitaron el logotipo de un patrocinador de cerveza de su camiseta en 2013."
  fr: "Article de Wikipédia en anglais sur Fawad Ahmed, ancien joueur de cricket australien né au Pakistan; utilisé uniquement pour les informations relatives à l'entité. Il relate sa naissance à Swabi, dans la province de Khyber Pakhtunkhwa, le 10 mars 1979 (voir la divergence de dates mentionnée dans la fiche de la personne), son départ du Pakistan en 2010, sa demande d'asile en Australie, l'obtention de son statut de résident permanent en novembre 2012 et de la nationalité australienne en juillet 2013, ses matchs internationaux pour l'Australie en 2013, et le décrit comme un musulman pratiquant dont le maillot comportait le logo d'un sponsor de bière retiré en 2013."
