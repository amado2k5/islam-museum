summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فواد أحمد، لاعب الكريكت الأسترالي السابق المولود في باكستان؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في صوابي بإقليم خيبر بختونخوا في 10 مارس 1979 (انظر تعارض التاريخ في سجل الشخص)، ومغادرته باكستان سنة 2010 وطلب اللجوء في أستراليا ومنحه الإقامة الدائمة في نوفمبر 2012 والجنسية الأسترالية في يوليو 2013، ومبارياته الدولية لأستراليا في 2013، وتصفه بأنه مسلم متدين أُزيل شعار شركة جعة عن قميصه سنة 2013."
  en: "English Wikipedia article on Fawad Ahmed, the Pakistan-born former Australian cricketer; used for entity facts only. It records his birth in Swabi, Khyber Pakhtunkhwa, on 10 March 1979 (see the date conflict noted in the person record), his departure from Pakistan in 2010, his asylum claim in Australia, permanent residency in November 2012 and Australian citizenship in July 2013, his international matches for Australia in 2013, and describes him as a devout Muslim whose shirt had a beer sponsor's logo removed in 2013."
