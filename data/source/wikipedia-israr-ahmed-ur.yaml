summary:
  ar: مقالة ويكيبيديا الأردية عن إسرار أحمد؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في حصار في 26 أبريل 1932 ووفاته في لاهور في 14 أبريل 2010، وتعليمه الطبي والجامعي، وسنواته في الجماعة الإسلامية، وتأسيسه أنجمن خدام القرآن (1972) وتنظيم إسلامي (1975).
  en: Urdu Wikipedia article on Israr Ahmed; used for entity facts only. It gives his birth in Hisar on 26 April 1932 and his death in Lahore on 14 April 2010, his medical and university education, his years in Jamaat-e-Islami, and his founding of Anjuman Khuddam-ul-Quran (1972) and Tanzeem-e-Islami (1975).
  es: "Artículo de Wikipedia en urdu sobre Israr Ahmed; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Hisar el 26 de abril de 1932 y su fallecimiento en Lahore el 14 de abril de 2010, su formación médica y universitaria, sus años en Jamaat-e-Islami y la fundación de Anjuman Khuddam-ul-Quran (1972) y Tanzeem-e-Islami (1975)."
  fr: "Article de Wikipédia en ourdou sur Israr Ahmed; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance à Hisar le 26 avril 1932 et sa mort à Lahore le 14 avril 2010, ses études de médecine et universitaires, ses années au sein de Jamaat-e-Islami, et la fondation d’Anjuman Khuddam-ul-Quran (1972) et de Tanzeem-e-Islami (1975)."
  ur: "اسرار احمد پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 26 اپریل 1932 کو حصار میں ان کی پیدائش اور 14 اپریل 2010 کو لاہور میں ان کی وفات، ان کی میڈیکل اور یونیورسٹی کی تعلیم، جماعت اسلامی میں ان کے برسوں، اور انجمن خدام القرآن (1972) اور تنظیم اسلامی (1975) کی بنیاد رکھی گئی ہے۔"
  tr: "İsrar Ahmed hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 26 Nisan 1932'de Hisar'da doğduğunu, 14 Nisan 2010'da Lahor'da vefatını, tıp ve üniversite eğitimini, İslami Grup'taki yıllarını, Anjuman Khuddam-ul-Quran'ı kurmasını (1972) ve İslami Örgütü'nü (1975) anlatmaktadır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Israr Ahmad; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Hisar pada 26 April 1932, kematiannya di Lahore pada 14 April 2010, pendidikan kedokteran dan universitasnya, tahun-tahunnya di Kelompok Islam, pendirian Anjuman Khuddam-ul-Quran (1972), dan Organisasi Islam (1975)."
