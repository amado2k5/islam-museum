label:
  ar: "سنن أبي داود ومعه معالم السنن للخطابي — إعداد وتعليق عزت عبيد الدعاس وعادل السيد، دار ابن حزم، الجزء الرابع"
  en: "Sunan Abi Dawud with al-Khattabi's Ma'alim al-Sunan — prepared and annotated by 'Izzat 'Ubayd al-Da''as and 'Adil al-Sayyid, Dar Ibn Hazm, vol. 4"
summary:
  ar: "الجزء الرابع من نشرة دار ابن حزم ⁦(بيروت، الطبعة الأولى 1418هـ/1997م)⁩ لسنن أبي داود مع شرح الخطابي «معالم السنن» في الحاشية، وفيه كتب: الأقضية، والعلم، والأشربة، والأطعمة، والطب، والعتق، والحروف والقراءات، والحمام، واللباس، والترجل، والخاتم، والفتن والملاحم، والمهدي، والملاحم، والحدود، والديات."
  en: "Volume 4 of the Dar Ibn Hazm edition (Beirut, first edition 1418 AH/1997 CE) of the Sunan of Abu Dawud with al-Khattabi's Ma'alim al-Sunan in the footnotes, holding the books of Judgements, Knowledge, Drinks, Foods, Medicine, Manumission, Readings, the Bathhouse, Dress, Grooming, Rings, Trials and Great Battles, the Mahdi, the Great Battles, Hudud penalties and Blood-money."
  es: "Volumen 4 de la edición Dar Ibn Hazm (Beirut, primera edición 1418 AH/1997 CE) del Sunan de Abu Dawud con Ma'alim al-Sunan de al-Khattabi en las notas al pie, que contiene los libros de Juicios, Conocimiento, Bebidas, Alimentos, Medicina, Manumisión, Lecturas, el Baño, Vestimenta, Aseo, Anillos, Pruebas y Grandes Batallas, el Mahdi, las Grandes Batallas, las penas Hudud y el Dinero de Sangre."
  fr: "Volume 4 de l'édition Dar Ibn Hazm (Beyrouth, première édition 1418 AH/1997 CE) du Sunan d'Abu Dawud avec les Ma'alim al-Sunan d'al-Khattabi en notes de bas de page, contenant les livres des Jugements, de la Connaissance, des Boissons, des Aliments, de la Médecine, de l'Affranchissement, des Lectures, du Bain, des Vêtements, des Soins personnels, des Bagues, des Épreuves et des Grandes Batailles, du Mahdi, des Grandes Batailles, des peines Hudud et du Prix du Sang."
  ur: "دار ابن حزم ایڈیشن کی جلد 4 ⁦(بیروت، پہلا ایڈیشن 1418 ہجری / 1997 عیسوی)⁩ سنن ابوداؤد کے ساتھ الخطابی کے معالیم السنان کے حاشیہ میں کتابیں، علم، مشروبات، کھانے کی اشیاء، دوائیوں، دوائیوں کی کتابیں رکھی ہوئی ہیں۔ گرومنگ، انگوٹھیاں، آزمائشیں اور عظیم جنگیں، مہدی، عظیم لڑائیاں، حدود کی سزائیں اور خونریزی۔"
