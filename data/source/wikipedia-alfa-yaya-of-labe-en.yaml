reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it, chiefly Lobban and Mendy, Historical Dictionary of the Republic of Guinea-Bissau (1997), p. 72, Thierno Diallo, Alfa Yaya, roi du Labe (1984), and Barry, Le Futa-Jaloo face à la colonisation (1997). Read in full at revision 1307048640 on 25 October 2026. The article gives his birth only as 'mid-19th century' at the village of Fulamori and his death precisely as 10 August 1912 at Port Etienne — the death day and month conflict with the French article and Wikidata, which give 10 October 1912, and the record states the disagreement rather than merging it."
