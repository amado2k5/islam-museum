summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألفا يايا ديالو ماودو، حاكم لابي في القرن التاسع عشر، إحدى مقاطعات إمامة فوتا جالون التسع في غينيا الحالية؛ تروي صعوده ابنًا لألفا إبراهيما ديالو حاكم لابي، وتقاربه مع الفرنسيين، واتفاق 10 فبراير 1897 الذي جعل أراضيه مستقلة فعليًا عن الإمامة، ونفيه إلى داهومي سنة 1905 ثم إطلاقه سنة 1910 واعتقاله ثانية سنة 1911 ووفاته في بورت إتيان سنة 1912، وعودة رفاته إلى غينيا سنة 1968."
  en: "English Wikipedia article on Alfa Yaya Diallo Maudo, the 19th-century ruler of Labé, one of the nine provinces of the Imamate of Futa Jallon in present-day Guinea; it recounts his rise as son of Alfa Ibrahima Diallo, ruler of Labé, his rapprochement with the French, the accord of 10 February 1897 that made his domains effectively independent of the imamate, his deportation to Dahomey in 1905, release in 1910, second arrest in 1911 and death at Port Etienne in 1912, and the return of his remains to Guinea in 1968."
  es: "Artículo de la Wikipedia en inglés sobre Alfa Yaya Diallo Maudo, gobernante del siglo XIX de Labé, una de las nueve provincias del Imamato de Futa Jallon en la actual Guinea; relata su ascenso como hijo de Alfa Ibrahima Diallo, gobernante de Labé, su acercamiento a los franceses, el acuerdo del 10 de febrero de 1897 que hizo que sus dominios fueran efectivamente independientes del imamato, su deportación a Dahomey en 1905, su liberación en 1910, su segundo arresto en 1911 y su muerte en Port Etienne en 1912, y el regreso de sus restos a Guinea en 1968."
  fr: "L'article de Wikipédia en anglais sur Alfa Yaya Diallo Maudo, souverain du XIXe siècle du Labé, l'une des neuf provinces de l'imamat du Fouta-Djalon dans l'actuelle Guinée, relate son ascension en tant que fils d'Alfa Ibrahima Diallo, souverain du Labé, son rapprochement avec les Français, l'accord du 10 février 1897 qui rendit ses domaines effectivement indépendants de l'imamat, sa déportation au Dahomey en 1905, sa libération en 1910, sa seconde arrestation en 1911 et sa mort à Port-Étienne en 1912, ainsi que le retour de sa dépouille en Guinée en 1968."
  ur: "انگریزی ویکیپیڈیا مضمون الفا یایا ڈیالو موڈو پر، 19 ویں صدی کے لیبی کے حکمران، موجودہ گنی میں فوٹا جالون کی امامت کے نو صوبوں میں سے ایک؛ اس میں لابی کے حکمران الفا ابراہیم ڈیالو کے بیٹے کے طور پر اس کا عروج، فرانسیسیوں کے ساتھ اس کا میل جول، 10 فروری 1897 کا معاہدہ جس نے اس کے ڈومینز کو امامت سے مؤثر طریقے سے آزاد کر دیا، 1905 میں اسے دہومی میں جلاوطن کیا، 1910 میں رہائی، 1910 میں دوسری گرفتاری اور 1919 میں پورٹن کی واپسی اور 1997 میں موت کا ذکر کیا گیا۔ 1968 میں گنی میں ان کی باقیات۔"
  tr: "Alpha Yaya Diallo Maudou hakkında, 19. yüzyılda Labé hükümdarı olan ve günümüz Gine'deki Fouta Galon İmamatlığı'nın bir eyaletinden biri olan Alpha Yaya Diallo Maudou hakkındaki İngilizce Wikipedia makalesi; Alpha Ibahima'nın oğlu olarak yükselişini, Fransızlarla yakınlaşmasını, 10 Şubat 1897'de topraklarını imamatlıktan fiilen bağımsız kılan anlaşmayı, 1905'te Dahomey'e sürgünü, 1910'da serbest bırakılmasını, 1911'de ikinci kez tutuklanışını, 1912'de Port Étienne'de ölümünü ve 1968'de naaşının Gine'ye iadesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Alpha Yaya Diallo Maudou, penguasa Labé pada abad kesembilan belas, salah satu provinsi Fouta Galon Imamate di Guinea saat ini; artikel ini menceritakan kebangkitannya sebagai putra Alpha Ibrahima Diallo, penguasa Labé, rekonsiliasinya dengan Prancis, perjanjian 10 Februari 1897 yang secara efektif membuat wilayahnya merdeka dari imamat, pengasingannya ke Dahomey pada tahun 1905, pembebasannya pada tahun 1910, penangkapan keduanya pada tahun 1911, kematiannya di Port Étienne pada tahun 1912, dan pengembalian jenazahnya ke Guinea pada tahun 1968."
