summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألفا يايا ديالو ماودو، حاكم لابي في القرن التاسع عشر، إحدى مقاطعات إمامة فوتا جالون التسع في غينيا الحالية؛ تروي صعوده ابنًا لألفا إبراهيما ديالو حاكم لابي، وتقاربه مع الفرنسيين، واتفاق 10 فبراير 1897 الذي جعل أراضيه مستقلة فعليًا عن الإمامة، ونفيه إلى داهومي سنة 1905 ثم إطلاقه سنة 1910 واعتقاله ثانية سنة 1911 ووفاته في بورت إتيان سنة 1912، وعودة رفاته إلى غينيا سنة 1968."
  en: "English Wikipedia article on Alfa Yaya Diallo Maudo, the 19th-century ruler of Labé, one of the nine provinces of the Imamate of Futa Jallon in present-day Guinea; it recounts his rise as son of Alfa Ibrahima Diallo, ruler of Labé, his rapprochement with the French, the accord of 10 February 1897 that made his domains effectively independent of the imamate, his deportation to Dahomey in 1905, release in 1910, second arrest in 1911 and death at Port Etienne in 1912, and the return of his remains to Guinea in 1968."
