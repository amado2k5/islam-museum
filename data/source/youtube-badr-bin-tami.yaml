  ar: "قناته الشخصية على يوتيوب باسم «بدر بن علي بن طامي العتيبي»، يصفها بأنها حساب شخصي فيه جملة من دروسه ومحاضراته وخواطره وأشعاره."
  en: "His personal YouTube channel, named 'Badr ibn Ali ibn Tami al-Utaybi'; its description calls it a personal account carrying a selection of his lessons, lectures, reflections and poems."
  es: "Su canal personal de YouTube, llamado 'Badr ibn Ali ibn Tami al-Utaybi', se describe como una cuenta personal que contiene una selección de sus lecciones, conferencias, reflexiones y poemas."
  fr: "Sa chaîne YouTube personnelle, nommée « Badr ibn Ali ibn Tami al-Utaybi », est décrite comme un compte personnel proposant une sélection de ses leçons, conférences, réflexions et poèmes."
  ur: "ان کا ذاتی یوٹیوب چینل، جس کا نام 'بدر بن علی ابن تمی العتیبی' ہے۔ اس کی تفصیل اسے ایک ذاتی اکاؤنٹ کہتی ہے جس میں اس کے اسباق، لیکچرز، عکاسی اور نظموں کا انتخاب ہوتا ہے۔"
  tr: "Kişisel YouTube kanalı 'Badr bin Ali bin Tami Al-Otaibi' adını taşıyor ve bunu dersleri, dersleri, düşünceleri ve şiirlerinden oluşan kişisel bir anlatım olarak tanımlıyor."
  id: "Saluran YouTube pribadinya bernama 'Badr bin Ali bin Tami Al-Otaibi,' yang ia gambarkan sebagai kisah pribadi yang berisi kumpulan pelajaran, kuliah, refleksi, dan puisinya."
