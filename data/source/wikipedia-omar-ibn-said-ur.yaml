reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. The Urdu text calls him a Muslim scholar and jurist, gives his birth in 1770 in Futa Toro, his twenty-five years of study, his capture in 1807, his escape and recapture at Fayetteville, his purchase by James Owen, and his death in 1864; on religion its text says he was pressed to accept Christianity but kept Islam in his heart and maintained his prayers and fasts. Its categories nevertheless file him among converts from Islam to Christianity and among American Christians — category filings, which never count as attestation and which its own text contradicts; both facts are recorded in the person record. It names no madhhab or order for him."
