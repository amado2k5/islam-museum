summary:
  ar: "تدوينة فريق ترتيل في 9 يناير 2020: إطلاق تطبيق ترتيل على iOS وأندرويد بعد عام من إطلاق المشروع، وجمع أكثر من 80 ألف تسجيل تلاوة، والاستحواذ على تطبيق «اقرأ» وبناء البحث الصوتي بالآيات عليه، وتحويل مستخدمي «اقرأ» إلى ترتيل."
  en: "The Tarteel team's post of 9 January 2020: the launch of the Tarteel app on iOS and Android a year after the project began, the 80,000+ recitation recordings collected, the acquisition of the Iqra app and the ayah voice search built on it, and the move of Iqra's users to Tarteel."
  ur: "ترتیل ٹیم کی 9 جنوری 2020 کی تحریر: منصوبے کے ایک سال بعد iOS اور اینڈرائیڈ پر ایپ کا اجرا، 80 ہزار سے زیادہ تلاوت کی ریکارڈنگز، «اقرأ» ایپ کا حصول اور اس پر آیات کی صوتی تلاش۔"
  es: "Publicación del equipo de Tarteel del 9 de enero de 2020: el lanzamiento de la aplicación Tarteel para iOS y Android un año después del inicio del proyecto, las más de 80.000 grabaciones de recitación recopiladas, la adquisición de la aplicación Iqra y la búsqueda de versículos por voz integrada en ella, y el traslado de los usuarios de Iqra a Tarteel."
  fr: "Publication de l'équipe Tarteel du 9 janvier 2020: le lancement de l'application Tarteel sur iOS et Android un an après le début du projet, la collecte de plus de 80 000 enregistrements de récitations, l'acquisition de l'application Iqra et de la recherche vocale d'ayahs qui y est intégrée, et le transfert des utilisateurs d'Iqra vers Tarteel."
