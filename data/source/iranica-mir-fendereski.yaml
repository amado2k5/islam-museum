reliability_note: "Peer-reviewed scholarly entry, read in full. Gives b. 970/1562-63 — arguing, against the Findirisk tradition, for a birth in the east of Persia, possibly Mashad — and d. 1050/1640 at Isfahan with burial in Takht-e Fulad; students Khwansari, Rafi'a Na'ini, Rajab Ali Tabrizi and Sabzavari; notes that nothing certain is known of his own teachers. For the faith value: it describes his treatise on badāʾ, a distinctively Imami doctrine, as arguing from narrations of the Imams against Ṭusi's rejection of it, and cites his inclusion in Aʿyān al-shiʿa."
