reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by its revision id via the MediaWiki API and asserted equal to it. Its text gives his birth as Cairo, 'on 4 or 24 August 1929', and notes the birthplace itself is disputed in the literature (a reference note lists Cairo per several biographers, with Jerusalem and Gaza also claimed); his death at 03:30 UTC on 11 November 2004 of a hemorrhagic stroke; and his temporary burial in the Mukataa in Ramallah. It records that he fought alongside the Muslim Brotherhood in 1948 while expressly not joining it — a movement association, not an affiliation."
