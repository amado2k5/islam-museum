summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ياسر عرفات؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في القاهرة في أغسطس 1929 ⁦(4 أو 24 أغسطس)⁩، ودراسته الهندسة، وتأسيسه حركة فتح، ورئاسته منظمة التحرير من 1969، واتفاقات أوسلو وجائزة نوبل للسلام 1994، وحصاره في رام الله ووفاته في مستشفى بيرسي العسكري بفرنسا في 11 نوفمبر 2004 ودفنه في المقاطعة. لا يسمّي نصها ولا صندوق معلوماتها مذهبًا له."
  en: "English Wikipedia article on Yasser Arafat; used for entity facts only. It recounts his birth in Cairo in August 1929 (4 or 24 August), his engineering studies, his founding of Fatah, his chairmanship of the PLO from 1969, the Oslo Accords and the 1994 Nobel Peace Prize, his confinement in Ramallah, his death at the Percy military hospital in France on 11 November 2004, and his burial at the Mukataa. Neither its text nor its infobox names a school for him."
  es: "Artículo de la Wikipedia en inglés sobre Yasser Arafat; utilizado únicamente para datos sobre la persona. Relata su nacimiento en El Cairo en agosto de 1929 (4 o 24 de agosto), sus estudios de ingeniería, la fundación de Fatah, su presidencia de la OLP desde 1969, los Acuerdos de Oslo y el Premio Nobel de la Paz de 1994, su confinamiento en Ramala, su muerte en el hospital militar Percy en Francia el 11 de noviembre de 2004 y su entierro en Mukataa. Ni el texto ni el recuadro informativo mencionan ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en anglais sur Yasser Arafat; utilisé uniquement pour les informations le concernant. Il relate sa naissance au Caire en août 1929 (le 4 ou le 24 août), ses études d'ingénieur, la fondation du Fatah, sa présidence de l'OLP à partir de 1969, les accords d'Oslo et le prix Nobel de la paix de 1994, son internement à Ramallah, sa mort à l'hôpital militaire Percy en France le 11 novembre 2004 et son inhumation au cimetière de Moukataa. Ni le texte ni l'infobox ne mentionnent d'établissement scolaire en son honneur."
