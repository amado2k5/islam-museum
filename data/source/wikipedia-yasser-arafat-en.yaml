summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ياسر عرفات؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في القاهرة في أغسطس 1929 (4 أو 24 أغسطس)، ودراسته الهندسة، وتأسيسه حركة فتح، ورئاسته منظمة التحرير من 1969، واتفاقات أوسلو وجائزة نوبل للسلام 1994، وحصاره في رام الله ووفاته في مستشفى بيرسي العسكري بفرنسا في 11 نوفمبر 2004 ودفنه في المقاطعة. لا يسمّي نصها ولا صندوق معلوماتها مذهبًا له."
  en: "English Wikipedia article on Yasser Arafat; used for entity facts only. It recounts his birth in Cairo in August 1929 (4 or 24 August), his engineering studies, his founding of Fatah, his chairmanship of the PLO from 1969, the Oslo Accords and the 1994 Nobel Peace Prize, his confinement in Ramallah, his death at the Percy military hospital in France on 11 November 2004, and his burial at the Mukataa. Neither its text nor its infobox names a school for him."
