  ar: "مقالة ويكيبيديا العربية عن أبي العباس أحمد بن خالد الناصري السلاوي (1835–1897)، مؤرخ المغرب صاحب «الاستقصا»؛ تنص على انتسابه في شبابه إلى الزاوية الناصرية بتامكروت ثم انقلابه على الصوفية وتأليفه «تعظيم المنة بنصرة السنة» ضد البدع، ولا تسمي له مذهبًا فقهيًا."
  en: "The Arabic Wikipedia article on Abu al-Abbas Ahmad ibn Khalid al-Nasiri al-Salawi (1835–1897), the Moroccan historian of al-Istiqsa; its text records his youthful attachment to the Nasiriyya zawiya at Tamkrout, then his turn against Sufism and his book Ta'zim al-minna bi-nusrat al-sunna against innovations, and names no madhhab for him."
