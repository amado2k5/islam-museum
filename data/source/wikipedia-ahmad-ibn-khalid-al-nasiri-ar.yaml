summary:
  ar: "مقالة ويكيبيديا العربية عن أبي العباس أحمد بن خالد الناصري السلاوي (1835–1897)، مؤرخ المغرب صاحب «الاستقصا»؛ تنص على انتسابه في شبابه إلى الزاوية الناصرية بتامكروت ثم انقلابه على الصوفية وتأليفه «تعظيم المنة بنصرة السنة» ضد البدع، ولا تسمي له مذهبًا فقهيًا."
  en: "The Arabic Wikipedia article on Abu al-Abbas Ahmad ibn Khalid al-Nasiri al-Salawi (1835–1897), the Moroccan historian of al-Istiqsa; its text records his youthful attachment to the Nasiriyya zawiya at Tamkrout, then his turn against Sufism and his book Ta'zim al-minna bi-nusrat al-sunna against innovations, and names no madhhab for him."
  es: "El artículo árabe de Wikipedia sobre Abu al-Abbas Ahmad ibn Khalid al-Nasiri al-Salawi (1835–1897), el historiador marroquí de al-Istiqsa; su texto registra su apego juvenil a la Nasiriyya zawiya en Tamkrout, luego su giro contra el sufismo y su libro Ta'zim al-minna bin-nusrat al-sunna contra las innovaciones, y no nombra ninguna madhab para él."
  fr: "L'article arabe de Wikipédia sur Abu al-Abbas Ahmad ibn Khalid al-Nasiri al-Salawi (1835-1897), l'historien marocain d'al-Istiqsa; son texte relate son attachement de jeunesse à la zawiya Nasiriyya à Tamkrout, puis son tour contre le soufisme et son livre Ta'zim al-minna bi-nusrat al-sunna contre les innovations, et ne nomme aucun madhhab pour lui."
  ur: "ابو العباس احمد بن خالد النصیری الصلوی (1835-1897) پر عربی ویکیپیڈیا مضمون، الاستقسا کے مراکشی مورخ؛ اس کے متن میں تمکروت میں ناصریہ زاویہ کے ساتھ اس کی جوانی کی وابستگی، پھر تصوف کے خلاف اس کی باری اور بدعات کے خلاف اس کی کتاب تعظیم المنا بِنصرۃ السنۃ، اور اس کے لیے کوئی مذہب نہیں ہے۔"
