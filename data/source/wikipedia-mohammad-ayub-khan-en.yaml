summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد أيوب خان الأفغاني؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في كابل سنة 1857 لأبيه شير علي خان، وإمارته الوجيزة لأفغانستان (1879-1880)، وانتصاره في معركة مايواند في 27 يوليو 1880 وهزيمته عند قندهار، وحياته متقاعدا بريطانيا في لاهور ووفاته فيها في 7 أبريل 1914 ودفنه في بيشاور. لا تحمل المقالة أي حقل للديانة ولا يسمي متنها مذهبا."
  en: "English Wikipedia article on Mohammad Ayub Khan of Afghanistan; used for entity facts only. It gives his birth at Kabul in 1857 to his father Sher Ali Khan, his brief emirate of Afghanistan (1879–1880), his victory at the Battle of Maiwand on 27 July 1880 and defeat at Kandahar, his life as a British pensioner at Lahore, his death there on 7 April 1914 and his burial at Peshawar. The article carries no religion field and its text names no school."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Ayub Khan de Afganistán; se utiliza únicamente para datos sobre la persona. Describe su nacimiento en Kabul en 1857, hijo de Sher Ali Khan; su breve emirato de Afganistán (1879-1880); su victoria en la batalla de Maiwand el 27 de julio de 1880 y su derrota en Kandahar; su vida como pensionista británico en Lahore; su muerte allí el 7 de abril de 1914; y su entierro en Peshawar. El artículo no incluye información sobre religión ni menciona ninguna escuela."
  fr: "Article de Wikipédia en anglais sur Mohammad Ayub Khan d'Afghanistan; utilisé uniquement pour les informations biographiques. Il relate sa naissance à Kaboul en 1857, fils de Sher Ali Khan, son bref règne sur l'Afghanistan (1879-1880), sa victoire à la bataille de Maiwand le 27 juillet 1880 et sa défaite à Kandahar, sa vie de pensionné britannique à Lahore, sa mort dans cette même ville le 7 avril 1914 et son inhumation à Peshawar. L'article ne comporte pas de champ « religion » et ne mentionne aucune école."
  ur: "افغانستان کے محمد ایوب خان پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1857 میں کابل میں ان کے والد شیر علی خان کی پیدائش، افغانستان کی ان کی مختصر امارت (1879-1880)، 27 جولائی 1880 کو میوند کی جنگ میں ان کی فتح اور قندھار میں شکست، لاہور میں برطانوی پنشنر کے طور پر ان کی زندگی، 7 اپریل 1914 کو پشاور میں ان کی موت اور ان کی تدفین۔ مضمون میں کوئی مذہب نہیں ہے اور اس کے متن کا کوئی اسکول نہیں ہے۔"
  tr: "Muhammed Ayub Han el-Afgani hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Bu makale, 1857'de babası Şer Ali Han'ın Kabil'de doğduğunu, kısa süreli Afganistan emirliğini (1879-1880), 27 Temmuz 1880'de Mayand Muharebesi'ndeki zaferini, Kandahar'daki yenilgisini, Lahor'da İngiliz emekli olarak hayatını, 7 Nisan 1914'te orada ölmesini ve Peşaver'de defnedilmesini anlatır. Makalede herhangi bir dini alan yer almamakta ve mezhep olarak adlandırılmamaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad Ayub Khan al-Afghani hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Kabul pada tahun 1857 dari ayahnya Sher Ali Khan, emirat singkatnya di Afghanistan (1879-1880), kemenangannya di Pertempuran Mayand pada 27 Juli 1880, kekalahannya di Kandahar, kehidupannya sebagai pensiunan Inggris di Lahore, kematiannya di sana pada 7 April 1914, dan pemakamannya di Peshawar. Artikel tersebut tidak memuat bidang keagamaan apapun dan tidak menyebutnya sebagai sekte."
