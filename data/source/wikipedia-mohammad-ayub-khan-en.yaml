summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد أيوب خان الأفغاني؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في كابل سنة 1857 لأبيه شير علي خان، وإمارته الوجيزة لأفغانستان (1879-1880)، وانتصاره في معركة مايواند في 27 يوليو 1880 وهزيمته عند قندهار، وحياته متقاعدا بريطانيا في لاهور ووفاته فيها في 7 أبريل 1914 ودفنه في بيشاور. لا تحمل المقالة أي حقل للديانة ولا يسمي متنها مذهبا."
  en: "English Wikipedia article on Mohammad Ayub Khan of Afghanistan; used for entity facts only. It gives his birth at Kabul in 1857 to his father Sher Ali Khan, his brief emirate of Afghanistan (1879–1880), his victory at the Battle of Maiwand on 27 July 1880 and defeat at Kandahar, his life as a British pensioner at Lahore, his death there on 7 April 1914 and his burial at Peshawar. The article carries no religion field and its text names no school."
