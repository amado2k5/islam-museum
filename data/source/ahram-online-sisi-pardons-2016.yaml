summary:
  ar: "خبر أهرام أونلاين عن القرار الجمهوري رقم 515 لسنة 2016 بالعفو عن 82 سجيناً بينهم إسلام البحيري، المذيع السابق والباحث في الدراسات الإسلامية، المحكوم عليه في ديسمبر 2015 بالسجن سنة في تهمة ازدراء الأديان بسبب برنامجه الموقوف."
  en: "Ahram Online's report on presidential decree 515 of 2016 pardoning 82 prisoners including former TV host and Islamic studies researcher Islam El-Behery, sentenced in December 2015 to one year for 'contempt of religion' over his suspended programme."
  es: "Informe de Ahram Online sobre el decreto presidencial 515 de 2016 que indultó a 82 presos, entre ellos el ex presentador de televisión e investigador de estudios islámicos Islam El-Behery, condenado en diciembre de 2015 a un año de prisión por \"desacato a la religión\" debido a la suspensión de su programa."
  fr: "Le rapport d'Ahram Online sur le décret présidentiel 515 de 2016 graciant 82 prisonniers, dont l'ancien animateur de télévision et chercheur en études islamiques Islam El-Behery, condamné en décembre 2015 à un an pour « outrage à la religion » en raison de son programme suspendu."
  ur: "2016 کے صدارتی حکم نامے 515 پر احرام آن لائن کی رپورٹ میں سابق ٹی وی میزبان اور اسلامی مطالعات کے محقق اسلام البیری سمیت 82 قیدیوں کو معاف کیا گیا تھا، جنہیں دسمبر 2015 میں اپنے معطل پروگرام پر 'توہین مذہب' کے جرم میں ایک سال کی سزا سنائی گئی تھی۔"
title: "Egyptian President Sisi pardons 82 prisoners, mostly university students"
