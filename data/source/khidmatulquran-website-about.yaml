summary:
  ar: "صفحة «من نحن» في الموقع الرسمي لمؤسسة خدمة القرآن الإسلامية (khidmatulquran.or.tz)؛ تصف المؤسسة بأنها منظمة غير ربحية تنظم مسابقات تجويد القرآن في تنزانيا منذ 2004، وتسمي رئيسها الشيخ علي محمد صالح ومنظميها وراعيها ورسالتها."
  en: "The About Us page of the Khidmatulquran Islamic Foundation's official website (khidmatulquran.or.tz); it describes the foundation as a non-profit organising Quran tajweed competitions in Tanzania since 2004, and names its chairman Sheikh Ally Mohammed Saleh, its organisers, its patron and its mission."
  es: "La página \"Sobre nosotros\" del sitio web oficial de la Fundación Islámica Khidmatulquran (khidmatulquran.or.tz) describe a la fundación como una organización sin fines de lucro que organiza concursos de tajweed del Corán en Tanzania desde 2004, y menciona a su presidente, el jeque Ally Mohammed Saleh, a sus organizadores, a su patrocinador y su misión."
  fr: "La page « À propos de nous » du site officiel de la Fondation islamique Khidmatulquran (khidmatulquran.or.tz) décrit la fondation comme une organisation à but non lucratif organisant des concours de tajwid du Coran en Tanzanie depuis 2004, et mentionne son président, le cheikh Ally Mohammed Saleh, ses organisateurs, son mécène et sa mission."
  ur: "خدمت القرآن اسلامک فاؤنڈیشن کی آفیشل ویب سائٹ (khidmatulquran.or.tz) کا ہمارے بارے میں صفحہ؛ یہ فاؤنڈیشن کو 2004 سے تنزانیہ میں قرآن تجوید مقابلوں کا ایک غیر منافع بخش انعقاد قرار دیتا ہے، اور اس کے چیئرمین شیخ علی محمد صالح، اس کے منتظمین، اس کے سرپرست اور اس کے مشن کا نام دیتا ہے۔"
