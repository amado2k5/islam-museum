  ar: "صفحة «من نحن» في الموقع الرسمي لمؤسسة خدمة القرآن الإسلامية (khidmatulquran.or.tz)؛ تصف المؤسسة بأنها منظمة غير ربحية تنظم مسابقات تجويد القرآن في تنزانيا منذ 2004، وتسمي رئيسها الشيخ علي محمد صالح ومنظميها وراعيها ورسالتها."
  en: "The About Us page of the Khidmatulquran Islamic Foundation's official website (khidmatulquran.or.tz); it describes the foundation as a non-profit organising Quran tajweed competitions in Tanzania since 2004, and names its chairman Sheikh Ally Mohammed Saleh, its organisers, its patron and its mission."
