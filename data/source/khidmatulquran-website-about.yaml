reliability_note: "The foundation's own website — a primary source for its identity, leadership and stated mission, not independent corroboration. It records that the teachers Sheikh Ally Mohammed Saleh (named on the page as the foundation's chairman) and Sheikh Iddy Abdallah and other fellows have organised the Holy Quran Tajweed competition in Tanzania since 2004; that its mission is to organise Quran competitions nationally and internationally (recitation, Hifz, tajweed, Qiraat), to establish religious libraries and learning centres, and to publish and distribute Quranic and Islamic media; and that its patron is Mussa Azzan Zungu, Deputy Speaker and Member of Parliament of Tanzania. Read on 5 November 2026."
