summary:
  ar: "صفحة «مجمع اللغة العربية الأردني» في Wikipedia (Arabic)؛ لم يفتحها المتحف، وهي ملخّصة في ملف بحث قُدّم إليه بإذن المؤسس في 21 نوفمبر 2026، ويُستند إليها لوقائع المؤسسة فقط."
  en: "The page \"مجمع اللغة العربية الأردني\" (Wikipedia (Arabic)), summarised in a research file supplied to the museum and not opened by it, with the founder's approval of 21 November 2026; used for: the re-establishment in 1976 on the initiative of the Arabisation, Translation and Publication Committee of 1961 and the five founding active members, including Abdulkareem Khalefah as president 1976-2015."
  ur: "صفحہ «مجمع اللغة العربية الأردني» (Wikipedia (Arabic))؛ عجائب گھر نے اسے نہیں کھولا، یہ اس کو فراہم کردہ تحقیقی فائل میں بانی کی 21 نومبر 2026ء کی منظوری سے خلاصہ شدہ ہے، اور صرف ادارے کے حقائق کے لیے استعمال ہوتا ہے۔"
  fr: "La page « مجمع اللغة العربية الأردني » (Wikipedia (Arabic)), résumée dans un fichier de recherche fourni au musée et non ouverte par lui, avec l'accord du fondateur du 21 novembre 2026 ; utilisée pour les faits sur l'institution seulement."
  es: "La página «مجمع اللغة العربية الأردني» (Wikipedia (Arabic)), resumida en un archivo de investigación entregado al museo y no abierta por él, con la aprobación del fundador del 21 de noviembre de 2026; se usa solo para datos sobre la institución."
  tr: "Wikipedia'daki \"Ürdün Arapça Dil Akademisi\" sayfası (Arapça); müze tarafından açılmamıştır ve 21 Kasım 2026'da kurucunun izniyle sunulan bir araştırma dosyasında özetlenmiştir; bu dosya tamamen vakfın kayıtlarına dayanmaktadır."
  id: "Halaman \"Akademi Bahasa Arab Yordania\" di Wikipedia (Arab); halaman ini tidak dibuka oleh museum, dan dirangkum dalam berkas penelitian yang diserahkan dengan izin pendiri pada 21 November 2026, dan sepenuhnya mengandalkan catatan yayasan."
