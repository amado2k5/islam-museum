summary:
  ar: "صفحة «من نحن» لموقع «فت مسلمة» (Fit Muslimah) الذي تملكه وتديره مباركة إبراهيم؛ تصفها بأنها مؤسِّسة حركة «فت مسلمة» الصحية، والرئيسة والمديرة التنفيذية لشركة «بالانس فتنس» في نيو هيفن بولاية كونيتيكت، والمديرة التنفيذية لمنظمة «فت هيفن» غير الربحية، ومؤسِّسة قمة «فت مسلمة» الدولية، وأنها ظهرت في برنامج أوبرا وينفري ودُعيت ضيفة خاصة إلى إفطار البيت الأبيض سنة 2012 و2013."
  en: "The About Us page of the Fit Muslimah site, owned and moderated by Mubarakah Ibrahim; it describes her as the founder of the Fit Muslimah health and fitness movement, President and CEO of BALANCE fitness llc in New Haven, Connecticut, Executive Director of the Fit Haven non-profit, and founder of the international Fit Muslimah Summit, and records her appearance on The Oprah Winfrey Show and her invitations as a special guest to the White House Iftar Dinner in 2012 and 2013."
