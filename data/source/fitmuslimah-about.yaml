summary:
  ar: "صفحة «من نحن» لموقع «فت مسلمة» (Fit Muslimah) الذي تملكه وتديره مباركة إبراهيم؛ تصفها بأنها مؤسِّسة حركة «فت مسلمة» الصحية، والرئيسة والمديرة التنفيذية لشركة «بالانس فتنس» في نيو هيفن بولاية كونيتيكت، والمديرة التنفيذية لمنظمة «فت هيفن» غير الربحية، ومؤسِّسة قمة «فت مسلمة» الدولية، وأنها ظهرت في برنامج أوبرا وينفري ودُعيت ضيفة خاصة إلى إفطار البيت الأبيض سنة 2012 و2013."
  en: "The About Us page of the Fit Muslimah site, owned and moderated by Mubarakah Ibrahim; it describes her as the founder of the Fit Muslimah health and fitness movement, President and CEO of BALANCE fitness llc in New Haven, Connecticut, Executive Director of the Fit Haven non-profit, and founder of the international Fit Muslimah Summit, and records her appearance on The Oprah Winfrey Show and her invitations as a special guest to the White House Iftar Dinner in 2012 and 2013."
  es: "La página \"Sobre nosotros\" del sitio web Fit Muslimah, propiedad de Mubarakah Ibrahim y moderado por ella misma, la describe como la fundadora del movimiento de salud y bienestar Fit Muslimah, presidenta y directora ejecutiva de BALANCE fitness llc en New Haven, Connecticut, directora ejecutiva de la organización sin fines de lucro Fit Haven y fundadora de la Cumbre Internacional Fit Muslimah. También recoge su aparición en el programa de Oprah Winfrey y sus invitaciones como invitada especial a la cena Iftar de la Casa Blanca en 2012 y 2013."
  fr: "La page « À propos » du site Fit Muslimah, propriété de Mubarakah Ibrahim et qu'elle modère, la décrit comme la fondatrice du mouvement de santé et de remise en forme Fit Muslimah, présidente et directrice générale de BALANCE fitness llc à New Haven, dans le Connecticut, directrice générale de l'association à but non lucratif Fit Haven et fondatrice du sommet international Fit Muslimah. Elle relate également son passage dans l'émission The Oprah Winfrey Show et ses invitations en tant qu'invitée spéciale au dîner Iftar de la Maison Blanche en 2012 et 2013."
  ur: "فٹ مسلمہ سائٹ کا ہمارے بارے میں صفحہ، مبارکہ ابراہیم کی ملکیت اور معتدل؛ یہ انہیں فٹ مسلمہ ہیلتھ اینڈ فٹنس موومنٹ کی بانی، نیو ہیون، کنیکٹیکٹ میں بیلنس فٹنس ایل ایل سی کی صدر اور سی ای او، فٹ ہیون نان پرافٹ کی ایگزیکٹو ڈائریکٹر، اور بین الاقوامی فٹ مسلمہ سمٹ کی بانی کے طور پر بیان کرتا ہے، اور اوپرا ونفری شو میں اس کی موجودگی کو ریکارڈ کرتا ہے اور وہائٹ ہاؤس 202 میں بطور مہمان خصوصی شرکت کرتا ہے۔ 2013."
  tr: "Mubarakah Ibrahim'in sahibi olduğu ve yönettiği \"Fit Muslimah\" web sitesindeki \"Biz Kimiz\" sayfası, onu \"Fit Muslimah\" sağlık hareketinin kurucusu, New Haven, Connecticut'taki Balance Fitness'ın başkanı ve CEO'su, kar amacı gütmeyen \"Fit Muslimah\" organizasyonunun icra direktörü ve uluslararası \"Fit Muslimah\" zirvesinin kurucusu olarak tanımlıyor. Oprah Winfrey programına katıldı ve 2012 ile 2013 yıllarında Beyaz Saray iftarına özel konuk olarak davet edildi."
  id: "Halaman \"Who We Are\" di situs \"Fit Muslimah,\" yang dimiliki dan dikelola oleh Mubarakah Ibrahim, menggambarkannya sebagai pendiri gerakan kesehatan \"Fit Muslimah\", presiden dan CEO Balance Fitness di New Haven, Connecticut, direktur eksekutif organisasi nirlaba \"Fit Muslimah,\" dan pendiri KTT internasional \"Fit Muslimah\". Dia tampil di acara Oprah Winfrey dan diundang sebagai tamu spesial di Iftar Gedung Putih pada 2012 dan 2013."
