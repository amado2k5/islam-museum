summary:
  ar: "مدخل «شيخ الإسلام» في موسوعة TDV الإسلامية التركية بقلم محمد إپشيرلي ⁦(المجلد 39، إسطنبول 2010، ص 91–96)⁩، ويتناول أصل اللقب، ونشأة منصب مفتي إسطنبول وتطوره، وتعيين شيخ الإسلام وعزله، وصلاحياته في الفتوى والتعيين والمشورة، ودوره في الأحداث السياسية، وإلغاء المنصب سنة 1924."
  en: "The TDV İslâm Ansiklopedisi entry 'Şeyhülislâm' by Mehmet İpşirli (vol. 39, Istanbul 2010, pp. 91–96). It covers the origin of the title, the rise of the Istanbul muftiship into the office, appointment and dismissal, the holders' duties in fatwa, appointment, consultation and politics, their pay and protocol, and the end of the office in 1924."
