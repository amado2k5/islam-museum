summary:
  ar: "مدخل «شيخ الإسلام» في موسوعة TDV الإسلامية التركية بقلم محمد إپشيرلي ⁦(المجلد 39، إسطنبول 2010، ص 91–96)⁩، ويتناول أصل اللقب، ونشأة منصب مفتي إسطنبول وتطوره، وتعيين شيخ الإسلام وعزله، وصلاحياته في الفتوى والتعيين والمشورة، ودوره في الأحداث السياسية، وإلغاء المنصب سنة 1924."
  en: "The TDV İslâm Ansiklopedisi entry 'Şeyhülislâm' by Mehmet İpşirli (vol. 39, Istanbul 2010, pp. 91–96). It covers the origin of the title, the rise of the Istanbul muftiship into the office, appointment and dismissal, the holders' duties in fatwa, appointment, consultation and politics, their pay and protocol, and the end of the office in 1924."
  es: "La entrada «Şeyhülislâm» de la TDV İslâm Ansiklopedisi, de Mehmet İpşirli (vol. 39, Estambul, 2010, págs. 91-96), abarca el origen del título, el ascenso del muftí de Estambul al cargo, su nombramiento y destitución, las funciones de los titulares en materia de fatwas, nombramientos, consultas y política, su remuneración y protocolo, y el fin del cargo en 1924."
  fr: "L'article « Şeyhülislâm » de Mehmet İpşirli dans la TDV İslâm Ansiklopedisi (vol. 39, Istanbul 2010, pp. 91–96) traite de l'origine du titre, de l'ascension du mufti d'Istanbul au sein de cette fonction, de la nomination et de la révocation des titulaires, de leurs devoirs en matière de fatwa, de nomination, de consultation et de politique, de leur rémunération et du protocole, ainsi que de la fin de cette fonction en 1924."
  ur: "TDV İslâm Ansiklopedisi اندراج 'Şeyhülislam' by Mehmet İpşirli ⁦(جلد 39، استنبول 2010، صفحہ 91-96)⁩۔ اس میں عنوان کی ابتدا، دفتر میں استنبول مفتی شپ کا عروج، تقرری اور برطرفی، فتویٰ، تقرری، مشاورت اور سیاست میں حاملین کے فرائض، ان کی تنخواہ اور پروٹوکول، اور 1924 میں دفتر کا خاتمہ شامل ہے۔"
  tr: "Mehmet İpsirli'nin Türk İslam TDV Ansiklopedisi'ndeki \"Şeyh al-İslam\" maddesi (Cilt 39, İstanbul 2010, ss. 91–96), unvanın kökenini, İstanbul Müftüsü pozisyonunun ortaya çıkışı ve gelişimini, Şeyh al-Islam'ın atanması ve görevden alınmasını, fetva, atama ve tavsiye verme yetkilerini, siyasi olaylardaki rolünü ve 1924'te bu görevin kaldırılmasını ele alır."
  id: "Entri \"Sheikh al-Islam\" dalam Ensiklopedia TDV Islam Turki oleh Mehmet Ipsirli (Vol. 39, Istanbul 2010, hlm. 91–96), membahas asal-usul gelar tersebut, kemunculan dan perkembangan posisi Mufti Istanbul, pengangkatan dan pemecatan Sheikh al-Islam, kekuasaannya dalam mengeluarkan fatwa, pengangkatan, dan nasihat, perannya dalam peristiwa politik, serta penghapusan jabatan tersebut pada tahun 1924."
