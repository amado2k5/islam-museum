label:
  ar: الصفدي، الوافي بالوفيات ⁦(تحقيق أحمد الأرناؤوط وتركي مصطفى، دار إحياء التراث، 2000)⁩
  en: al-Safadi, al-Wafi bi-l-Wafayat (ed. Ahmad al-Arna'ut and Turki Mustafa, Dar Ihya al-Turath, 2000)
summary:
  ar: الوافي بالوفيات لصلاح الدين خليل بن أيبك الصفدي ⁦(ت 764 هـ)⁩، معجم كبير في تراجم الأعيان من الصدر الأول إلى عصر المؤلف، في تسعة وعشرين مجلداً، في نص الشاملة ⁦(الكتاب رقم 6677)⁩ المحفوظ محلياً بصيغة OpenITI.
  en: al-Safadi's al-Wafi bi-l-Wafayat (al-Safadi d. 764 AH), a large biographical dictionary of notable people from the first generations to the author's time, in 29 volumes, in the Shamela text (book 6677) held locally in OpenITI form.
  es: "La obra de al-Safadi, al-Wafi bi-l-Wafayat (al-Safadi falleció en el año 764 de la Hégira), un extenso diccionario biográfico de personajes notables desde las primeras generaciones hasta la época del autor, consta de 29 volúmenes, en el texto de Shamela (libro 6677), disponible localmente en formato OpenITI."
  fr: "al-Wafi bi-l-Wafayat d'al-Safadi (al-Safadi d. 764 AH), un grand dictionnaire biographique de personnes notables des premières générations à l'époque de l'auteur, en 29 volumes, dans le texte Shamela (livre 6677) conservé localement sous forme OpenITI."
  ur: "الصفادی کی الوفی بائل وفیات ⁦(الصفدی وفات 764ھ)⁩، پہلی نسلوں سے مصنف کے زمانے تک کے قابل ذکر لوگوں کی ایک بڑی سوانحی لغت، 29 جلدوں میں، شاملہ متن ⁦(کتاب 6677)⁩ میں مقامی طور پر اوپن آئی ٹی آئی کی شکل میں رکھی گئی ہے۔"
  tr: "Salah al-Din Halil ibn Aybak al-Safadi (ö. 764 Hicri) tarafından yazılmış Al-Wafi bil-Wafayat, erken dönemden yazarın dönemine kadar önemli şahsiyetlerin biyografilerini içeren yirmi dokuz ciltlik geniş bir sözlük, Al-Shamela metninde (Kitap No. 6677) ve yerel olarak OpenITI formatında korunmaktadır."
  id: "Al-Wafi bil-Wafayat oleh Salah al-Din Khalil ibn Aybak al-Safadi (wafat 764 H), sebuah kamus besar berisi biografi tokoh-tokoh penting dari periode awal hingga era penulis, dalam dua puluh sembilan jilid, dalam teks Al-Shamela (Buku No. 6677), yang disimpan secara lokal dalam format OpenITI."
