summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد يوسف الكاندهلوي؛ أوسع مقالاته الثلاث، تعطي مولده في كاندهلة في 25 جمادى الأولى 1335هـ ⁦(20 آذار 1917)⁩ وشيوخه في مظاهر علوم سهارنبور وزواجه من كبرى بنات محمد زكريا الكاندهلوي وتنظيمه نظام جماعة التبليغ أميرًا ثانيًا لها ووفاته في 29 ذي القعدة 1384هـ ⁦(2 نيسان 1965)⁩؛ ويحمل صندوقها حقلي السنة والحنفية، ومتنها لا يسمّي مذهبًا."
  en: "The Urdu Wikipedia article on Muhammad Yusuf Kandhlawi; the fullest biography of the three, giving his birth at Kandhla on 25 Jumada al-awwal 1335 AH (20 March 1917), his teachers at Mazahir Uloom Saharanpur, his marriage to Muhammad Zakariya Kandhlawi's eldest daughter, his organisation of the Tablighi Jamaat's system as its second amir, and his death on 29 Dhu al-Qa'da 1384 AH (2 April 1965); its infobox carries Sunni and Hanafi fields, which are not text attestations, and its prose names no school."
  es: "El artículo de Wikipedia en urdu sobre Muhammad Yusuf Kandhlawi; la biografía más completa de los tres, dando su nacimiento en Kandhla el 25 de Jumada al-awwal de 1335 AH (20 de marzo de 1917), sus maestros en Mazahir Uloom Saharanpur, su matrimonio con la hija mayor de Muhammad Zakariya Kandhlawi, su organización del sistema Tablighi Jamaat como su segundo emir y su muerte el 29 de Dhu al-Qa'da de 1384 AH. (2 de abril de 1965); su cuadro de información contiene campos suníes y hanafíes, que no son certificaciones de texto, y su prosa no menciona ninguna escuela."
  fr: "L'article Wikipédia en ourdou sur Muhammad Yusuf Kandhlawi; la biographie la plus complète des trois, donnant sa naissance à Kandhla le 25 Jumada al-awwal 1335 AH (20 mars 1917), ses professeurs à Mazahir Uloom Saharapur, son mariage avec la fille aînée de Muhammad Zakariya Kandhlawi, son organisation du système du Tablighi Jamaat en tant que deuxième émir et sa mort le 29 Dhu al-Qa'da 1384 AH (2 avril 1965); sa boîte d'informations contient des champs sunnites et hanafites, qui ne sont pas des attestations textuelles, et sa prose ne nomme aucune école."
  ur: "محمد یوسف کاندھلوی پر اردو ویکیپیڈیا کا مضمون؛ تینوں کی مکمل سوانح عمری، 25 جمادی الاول 1335 ہجری ⁦(20 مارچ 1917)⁩ کو کاندھلہ میں ان کی ولادت، مظاہر العلوم سہارنپور میں ان کے اساتذہ، محمد زکریا کاندھلوی کی سب سے بڑی بیٹی سے ان کی شادی، تبلیغی جماعت کے نظام کی ان کی تنظیم ان کی وفات سنہ 1335ھ بمطابق دوسری ذوالحجہ 1335ھ کو ہوئی۔ ھ ⁦(2 اپریل 1965)⁩؛ اس کے معلوماتی خانے میں سنی اور حنفی فیلڈز ہیں، جو کہ متن کی تصدیق نہیں ہیں، اور اس کے نثر کا کوئی اسکول نہیں ہے۔"
