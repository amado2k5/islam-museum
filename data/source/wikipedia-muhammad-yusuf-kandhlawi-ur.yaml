  ar: "مقالة ويكيبيديا الأردية عن محمد يوسف الكاندهلوي؛ أوسع مقالاته الثلاث، تعطي مولده في كاندهلة في 25 جمادى الأولى 1335هـ (20 آذار 1917) وشيوخه في مظاهر علوم سهارنبور وزواجه من كبرى بنات محمد زكريا الكاندهلوي وتنظيمه نظام جماعة التبليغ أميرًا ثانيًا لها ووفاته في 29 ذي القعدة 1384هـ (2 نيسان 1965)؛ ويحمل صندوقها حقلي السنة والحنفية، ومتنها لا يسمّي مذهبًا."
  en: "The Urdu Wikipedia article on Muhammad Yusuf Kandhlawi; the fullest biography of the three, giving his birth at Kandhla on 25 Jumada al-awwal 1335 AH (20 March 1917), his teachers at Mazahir Uloom Saharanpur, his marriage to Muhammad Zakariya Kandhlawi's eldest daughter, his organisation of the Tablighi Jamaat's system as its second amir, and his death on 29 Dhu al-Qa'da 1384 AH (2 April 1965); its infobox carries Sunni and Hanafi fields, which are not text attestations, and its prose names no school."
