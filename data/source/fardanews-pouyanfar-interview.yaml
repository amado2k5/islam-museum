reliability_note: "Read in full on 7 November 2026. His own words in interview: a primary source for his formation — born in 1363 (he gives no day or month), a bachelor's in psychology, both grandfathers hey'at-keepers and his maternal grandfather Haj Mirza Hasan Asgarian a maddah, his father's death in 1372 when he turned to Qur'an recitation, his meeting with the eulogist Hojjat Kasri in 1377 and training under him, and the founding of the Reyhanat al-Nabi hey'at in 1380 with weekly sessions from 1384. It attests no school or order for him; his self-description throughout is as a maddah of the Ahl al-Bayt, which is his profession."
