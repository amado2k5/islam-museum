summary:
  ar: "مقابلة مطوّلة مع محمد حسين بويانفر نشرتها عقيق وأعادت فردا نيوز نشرها: يقول فيها إنه وُلد سنة 1363 ويحمل ليسانس علم نفس، وفقد والده سنة 1372، وتتلمذ على حجت كسري منذ 1377، وأسّس هيئة ريحانة النبي في شميران سنة 1380."
  en: "A long interview with Mohammad Hossein Pouyanfar, published by Aghigh and republished by Farda News: he says he was born in 1363 and holds a bachelor's in psychology, lost his father in 1372, studied under Hojjat Kasri from 1377, and founded the Reyhanat al-Nabi hey'at in Shemiran in 1380 (2001)."
  es: "Una larga entrevista con Mohammad Hossein Pouyanfar, publicada por Aghigh y republicada por Farda News: dice que nació en 1363 y tiene una licenciatura en psicología, perdió a su padre en 1372, estudió con Hojjat Kasri desde 1377 y fundó el Reyhanat al-Nabi hey'at en Shemiran en 1380 (2001)."
  fr: "Un long entretien avec Mohammad Hossein Pouyanfar, publié par Aghigh et republié par Farda News: il dit être né en 1363 et titulaire d’une licence en psychologie, avoir perdu son père en 1372, avoir étudié sous la direction de Hojjat Kasri à partir de 1377 et avoir fondé le Reyhanat al-Nabi hey’at à Shemiran en 1380 (2001)."
  ur: "محمد حسین پویانفر کے ساتھ ایک طویل انٹرویو، جسے آغا کے ذریعہ شائع کیا گیا اور فردا نیوز نے دوبارہ شائع کیا: وہ کہتے ہیں کہ وہ 1363 میں پیدا ہوئے اور انہوں نے نفسیات میں بیچلر کی ڈگری حاصل کی، 1372 میں اپنے والد سے محروم ہو گئے، 1377 سے حجت کسریٰ کے تحت تعلیم حاصل کی، اور 1308ء میں ریحانات النبی کی بنیاد رکھی۔"
