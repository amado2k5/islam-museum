summary:
  ar: "مقابلة مطوّلة مع محمد حسين بويانفر نشرتها عقيق وأعادت فردا نيوز نشرها: يقول فيها إنه وُلد سنة 1363 ويحمل ليسانس علم نفس، وفقد والده سنة 1372، وتتلمذ على حجت كسري منذ 1377، وأسّس هيئة ريحانة النبي في شميران سنة 1380."
  en: "A long interview with Mohammad Hossein Pouyanfar, published by Aghigh and republished by Farda News: he says he was born in 1363 and holds a bachelor's in psychology, lost his father in 1372, studied under Hojjat Kasri from 1377, and founded the Reyhanat al-Nabi hey'at in Shemiran in 1380 (2001)."
