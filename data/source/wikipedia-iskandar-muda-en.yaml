reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 31 October 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). It gives his reign as 4 April 1607 – 27 December 1636, his birth as about 1583 (from his being 32 Muslim years old in 1613, after Lombard), his parentage in both dynastic lines, and his religion in the infobox as Sunni; the body documents Aceh as a centre of Islamic learning whose courts applied Islamic jurisprudence. Caution: the birth-year reasoning rests partly on older web sources with dead links, and the Indonesian article shows the year is genuinely unsettled, so it is recorded as debated."
