  id: "Artikel Wikipedia bahasa Inggris tentang album Junaid Jamshid 'Dil Ki Baat'; untuk entitas saja: ini adalah album pop terakhirnya sebelum meninggalkan seni ini karena alasan agama, tahun rilisnya, dan daftar lagu; album ini didasarkan pada Wee News dan The News."
