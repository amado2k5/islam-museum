reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives his birth at El Adwah on 8 August 1951 and his death at Tora Prison, Cairo, on 17 June 2019, with burial at Nasr City. Its infobox lists Hosni Mubarak as predecessor with Mohamed Hussein Tantawi marked interim, and Adly Mansour as interim successor. It carries no religion field; its text attests his Muslim Brotherhood affiliation and his leadership of the Brotherhood's Freedom and Justice Party, and names no school."
