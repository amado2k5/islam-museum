summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد مرسي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في العدوان بالشرقية، ودراسته للهندسة في القاهرة وجنوب كاليفورنيا، وعضويته في مجلس الشعب، وقيادته لحزب الحرية والعدالة، ورئاسته لمصر من يونيو 2012 حتى عزله في يوليو 2013، ومحاكماته ووفاته أثناء جلسة محاكمة في 17 يونيو 2019."
  en: "English Wikipedia article on Mohamed Morsi; used for entity facts only. It recounts his upbringing at El Adwah in Sharqia, his engineering studies in Cairo and at the University of Southern California, his seat in the People's Assembly, his chairmanship of the Freedom and Justice Party, his presidency of Egypt from June 2012 until his removal in July 2013, his trials, and his death during a court session on 17 June 2019."
  es: "Artículo de la Wikipedia en inglés sobre Mohamed Morsi; utilizado únicamente para datos sobre la persona. Relata su infancia en El Adwah, en Sharqia, sus estudios de ingeniería en El Cairo y en la Universidad del Sur de California, su escaño en la Asamblea Popular, su presidencia del Partido Libertad y Justicia, su presidencia de Egipto desde junio de 2012 hasta su destitución en julio de 2013, sus juicios y su muerte durante una sesión judicial el 17 de junio de 2019."
  fr: "Article de Wikipédia en anglais sur Mohamed Morsi; utilisé uniquement pour des informations factuelles sur l’entité. Il relate son enfance à El Adwah, dans la province de Sharqia, ses études d’ingénieur au Caire et à l’Université de Californie du Sud, son siège à l’Assemblée du peuple, sa présidence du Parti Liberté et Justice, sa présidence de l’Égypte de juin 2012 à sa destitution en juillet 2013, ses procès et sa mort lors d’une audience le 17 juin 2019."
  ur: "محمد مرسی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں شرقیہ میں ال عدوہ میں ان کی پرورش، قاہرہ اور یونیورسٹی آف سدرن کیلیفورنیا میں ان کی انجینئرنگ کی تعلیم، پیپلز اسمبلی میں ان کی نشست، فریڈم اینڈ جسٹس پارٹی کی ان کی سربراہی، جون 2012 سے جولائی 2013 میں ان کی برطرفی تک مصر کی صدارت، ان کے مقدمات کی سماعت، اور جون 2019 کو عدالتی سیشن کے دوران ان کی موت کا ذکر ہے۔"
  tr: "Muhammed Mursi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Şarkia'daki saldırı sırasında yetiştirilme tarzını, Kahire ve Güney Kaliforniya'daki mühendislik çalışmalarını, Halk Meclisi üyeliğini, Özgürlük ve Adalet Partisi liderliğini, Haziran 2012'den Temmuz 2013'te görevden alınmasına kadar Mısır başkanlığını, yargılamalarını ve 17 Haziran 2019'daki bir duruşmada vefatını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Mohamed Morsi; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya selama agresi di Sharqia, studinya tentang teknik di Kairo dan California Selatan, keanggotaannya di Majelis Rakyat, kepemimpinannya di Partai Kebebasan dan Keadilan, masa kepresidenannya di Mesir dari Juni 2012 hingga diberhentikannya pada Juli 2013, persidangannya, dan kematiannya selama sesi persidangan pada 17 Juni 2019."
