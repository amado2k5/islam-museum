summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد مرسي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في العدوان بالشرقية، ودراسته للهندسة في القاهرة وجنوب كاليفورنيا، وعضويته في مجلس الشعب، وقيادته لحزب الحرية والعدالة، ورئاسته لمصر من يونيو 2012 حتى عزله في يوليو 2013، ومحاكماته ووفاته أثناء جلسة محاكمة في 17 يونيو 2019."
  en: "English Wikipedia article on Mohamed Morsi; used for entity facts only. It recounts his upbringing at El Adwah in Sharqia, his engineering studies in Cairo and at the University of Southern California, his seat in the People's Assembly, his chairmanship of the Freedom and Justice Party, his presidency of Egypt from June 2012 until his removal in July 2013, his trials, and his death during a court session on 17 June 2019."
