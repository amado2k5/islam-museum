  ar: "مقالة ويكيبيديا الإنجليزية عن ضياء الدين سردار؛ تُستخدم لوقائع الكيان فقط، وتؤكد ولادته في 31 أكتوبر 1951 في ديپالپور بالبنجاب وتعليمه في جامعة سيتي بلندن وكتبه التي تجاوزت الستين، ولا تسمّي له مذهبًا."
  en: "English Wikipedia article on Ziauddin Sardar; used for entity facts only. It confirms his birth on 31 October 1951 in Dipalpur, Punjab, Pakistan, his education at City University, London, and his more than sixty books, and names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Ziauddin Sardar; utilizado únicamente para datos sobre la persona. Confirma su nacimiento el 31 de octubre de 1951 en Dipalpur, Punjab, Pakistán, su educación en la City University de Londres y sus más de sesenta libros, pero no menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en anglais sur Ziauddin Sardar; utilisé uniquement pour des informations factuelles. Il confirme sa naissance le 31 octobre 1951 à Dipalpur, au Pendjab (Pakistan), ses études à la City University de Londres et ses plus de soixante ouvrages, sans mentionner d'établissement scolaire."
  ur: "ضیاء الدین سردار پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ تصدیق کرتا ہے کہ 31 اکتوبر 1951 کو دیپالپور، پنجاب، پاکستان میں ان کی پیدائش، سٹی یونیورسٹی، لندن میں ان کی تعلیم، اور ان کی ساٹھ سے زیادہ کتابیں، اور ان کے لیے کسی اسکول کا نام نہیں ہے۔"
