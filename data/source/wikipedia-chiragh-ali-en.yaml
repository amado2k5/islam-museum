reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. The article rests on Hardy (1972), Haq (1979), Campo's Encyclopedia of Islam (2009), Kurzman's Modernist Islam sourcebook (2002) and Hashmi (2012). It records his birth at Meerut into a family originally from Kashmir, his father Muhammad Bakhsh's early death, his exclusively home education and his Persian, Arabic, English, French, Hebrew, Aramaic, Latin and Greek, his clerkship at Gorakhpur and collectorship at Lucknow, Sir Sayyid Ahmad Khan's recommendation of him to Hyderabad and his invitation as translator by Salar Jang I, their meeting in 1874 and his lifelong association with Sir Sayyid and the Aligarh movement, the honorary title Azam Yar Jung of 1888, his death at 51 during treatment and burial at Bombay, his argument that the Prophet's wars were strictly defensive and local, his criticism of the jurists' handling of hadith, and his works with print dates (1883–1886, and the posthumous Urdu A'zam-ul-Kalam of 1910). It names no madhhab for him. Read in full on 24 October 2026."
