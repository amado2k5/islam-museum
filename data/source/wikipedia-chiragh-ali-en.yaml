summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شيراغ علي؛ تُستخدم لوقائع الكيان فقط حيث تستشهد المقالة بمصدر. تؤرخ حياته بسنة 1844–1895، وتفصّل مولده بميروت وتعليمه المنزلي ولغاته الثماني وعمله في حكومة نظام حيدر آباد ولقبه «أعظم يار جنگ» سنة 1888 وفكره في الجهاد والحديث ومؤلفاته."
  en: "English Wikipedia article on Chiragh Ali; used for entity facts only where the article cites a source. It dates his life 1844–1895 and details his Meerut birth, his home education and eight languages, his service in the Nizam of Hyderabad's government, his Azam Yar Jung title of 1888, his thought on jihad and hadith, and his works."
  es: "Artículo de la Wikipedia en inglés sobre Chiragh Ali; se utiliza únicamente para datos sobre la persona, donde el artículo cita una fuente. El artículo sitúa su vida entre 1844 y 1895 y detalla su nacimiento en Meerut, su educación en casa y sus ocho idiomas, su servicio en el gobierno del Nizam de Hyderabad, su título de Azam Yar Jung en 1888, su pensamiento sobre la yihad y los hadices, y sus obras."
  fr: "Article de Wikipédia en anglais sur Chiragh Ali; utilisé uniquement pour les informations factuelles relatives à l'entité, lorsque l'article cite une source. Il date sa vie de 1844 à 1895 et détaille sa naissance à Meerut, son éducation à domicile et sa maîtrise de huit langues, son service au sein du gouvernement du Nizam d'Hyderabad, son titre d'Azam Yar Jung en 1888, sa pensée sur le jihad et le hadith, ainsi que ses œuvres."
  ur: "چراغ علی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے جہاں مضمون کسی ماخذ کا حوالہ دیتا ہے۔ اس میں ان کی زندگی کی تاریخیں 1844-1895 ہیں اور ان کی میرٹھ پیدائش، ان کی گھریلو تعلیم اور آٹھ زبانیں، حیدرآباد کی حکومت کے نظام میں ان کی خدمات، 1888 میں ان کا اعظم یار جنگ کا خطاب، جہاد اور حدیث کے بارے میں ان کی فکر اور ان کے کاموں کی تفصیلات ہیں۔"
