  ar: "مقالة ويكيبيديا الإنجليزية عن شيراغ علي؛ تُستخدم لوقائع الكيان فقط حيث تستشهد المقالة بمصدر. تؤرخ حياته بسنة 1844–1895، وتفصّل مولده بميروت وتعليمه المنزلي ولغاته الثماني وعمله في حكومة نظام حيدر آباد ولقبه «أعظم يار جنگ» سنة 1888 وفكره في الجهاد والحديث ومؤلفاته."
  en: "English Wikipedia article on Chiragh Ali; used for entity facts only where the article cites a source. It dates his life 1844–1895 and details his Meerut birth, his home education and eight languages, his service in the Nizam of Hyderabad's government, his Azam Yar Jung title of 1888, his thought on jihad and hadith, and his works."
