summary:
  ar: "مقابلة مدونة عائشة بنت محمود مع سمر أسامواه، مقدمة بودكاست «يوميات المنتقبة»، نُشرت في 24 يناير 2021؛ تقول فيها سمر إنها مسلمة مرتدة من أصل أفريقي كاريبي — أبوها غاني وأمها من باربادوس — وُلدت ونشأت في لندن وأسلمت في التاسعة عشرة، وأم عزباء لطفلين وفنانة ومعالجة بالحجامة، بدأت لبس النقاب سنة 2009، وأطلقت المشروع من برنامج إذاعي رمضاني سنة 2019 في مركزها الإسلامي المحلي كانت حلقتها الأولى فيه مقابلة مع نعيمة بنت روبرت."
  en: "Aysha Bint Mahmud's interview with Samar Asamoah, host of The Niqabi Diaries podcast, published 24 January 2021. In it Samar says she is a revert Muslim of African Caribbean heritage — her father Ghanaian, her mother from Barbados — born and raised in London, who became Muslim at 19; a single mother of two; an artist and a hijama therapist; that she began wearing the niqab in 2009; and that the project grew out of a Ramadan 2019 radio show at her local Islamic centre, its first episode an interview with Na'ima Bint Robert."
