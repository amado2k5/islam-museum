summary:
  ar: "مقالة ويكيبيديا العربية عن نبيل العربي؛ تُستخدم لوقائع الكيان فقط. تعطي سني حياته بالهجري ⁦(1353–1446 هـ)⁩ وتروي مسيرته الدبلوماسية والقضائية وأمانته العامة لجامعة الدول العربية ووفاته يوم الاثنين 22 صفر 1446 هـ الموافق 26 أغسطس 2024 عن عمر ناهز التاسعة والثمانين."
  en: "Arabic Wikipedia article on Nabil Elaraby; used for entity facts only. It gives his life years in Hijri (1353–1446 AH), recounts his diplomatic and judicial career and his tenure as Secretary-General of the Arab League, and dates his death to Monday 22 Safar 1446 AH, corresponding to 26 August 2024, aged 89."
  es: "Artículo de Wikipedia en árabe sobre Nabil Elaraby; utilizado únicamente para datos sobre la persona. Indica sus años de vida en el calendario islámico (1353-1446 AH), relata su trayectoria diplomática y judicial y su mandato como Secretario General de la Liga Árabe, y fecha su fallecimiento el lunes 22 de Safar de 1446 AH, correspondiente al 26 de agosto de 2024, a la edad de 89 años."
  fr: "Article de Wikipédia en arabe sur Nabil Elaraby; utilisé uniquement à des fins d’information sur l’entité. Il indique ses années de vie selon le calendrier hégirien (1353-1446 AH), retrace sa carrière diplomatique et judiciaire ainsi que son mandat de secrétaire général de la Ligue arabe, et date son décès du lundi 22 Safar 1446 AH, correspondant au 26 août 2024, à l’âge de 89 ans."
  ur: "نبیل الارابی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ہجری ⁦(1353-1446 ہجری)⁩ میں ان کی زندگی کے سال بتاتا ہے، ان کے سفارتی اور عدالتی کیریئر اور عرب لیگ کے سیکرٹری جنرل کے طور پر ان کے دور کا ذکر کرتا ہے، اور ان کی وفات پیر 22 صفر 1446 ہجری کو بتائی گئی ہے، جو 26 اگست 2024 کو 89 سال کی عمر میں ہوئی۔"
