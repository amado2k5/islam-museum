  ar: "مقالة ويكيبيديا العربية عن عمران خان؛ تُستخدم لوقائع الكيان الأساسية فقط. تذكر مولده في 5 أكتوبر 1952 في لاهور ورئاسته وزراء باكستان (2018-2022) وزعامته حركة الإنصاف، وتذكر في صندوق معلوماتها ديانته بلفظ الإسلام فقط."
  en: "Arabic Wikipedia article on Imran Khan; used for basic entity facts only. It gives his birth on 5 October 1952 in Lahore, his premiership of Pakistan (2018–2022) and his leadership of Pakistan Tehreek-e-Insaf. Its infobox gives his religion simply as Islam, naming no school."
  es: "Artículo de Wikipedia en árabe sobre Imran Khan; se utiliza únicamente para obtener información básica sobre la persona. Indica su fecha de nacimiento, el 5 de octubre de 1952 en Lahore, su mandato como primer ministro de Pakistán (2018-2022) y su liderazgo del partido Pakistan Tehreek-e-Insaf. Su ficha informativa simplemente indica que su religión es el islam, sin mencionar ninguna escuela."
  fr: "Article Wikipédia en arabe sur Imran Khan; utilisé uniquement pour les informations de base sur l’individu. Il indique sa date de naissance, le 5 octobre 1952 à Lahore, son mandat de Premier ministre du Pakistan (2018-2022) et son rôle à la tête du Pakistan Tehreek-e-Insaf. Son infobox mentionne simplement l’islam comme religion, sans préciser d’école religieuse."
