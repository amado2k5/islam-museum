summary:
  ar: "صفحة عائشة هارون في ويكي تيوبيا (موسوعة معجبي يوتيوب)؛ تذكر أنها وُلدت في 2 يونيو 1995 في تورونتو لأبوين إثيوبيين، وكانت تُعرف سابقًا بعائشة عبدول، وتخرجت في مايو 2017 في إدارة الأعمال والتسويق، وبدأت الحجاب في الثانية عشرة تقريبًا، ورفعت أول فيديو في 5 يوليو 2011، وانتقلت إلى لوس أنجلوس سنة 2019، ودعمها صندوق «أصوات السود» من يوتيوب سنة 2021."
  en: "The Wikitubia (YouTube fan wiki) page for Aysha Harun. It gives her as born on 2 June 1995 in Toronto to Ethiopian parents, formerly known as Aysha Abdul; graduated in May 2017 with a degree in Business Administration and Marketing; began wearing hijab at about twelve; uploaded her first video on 5 July 2011; moved to Los Angeles in 2019; and received support from the YouTube Black Voices fund in 2021."
