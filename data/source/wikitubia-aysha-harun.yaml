summary:
  ar: "صفحة عائشة هارون في ويكي تيوبيا ⁦(موسوعة معجبي يوتيوب)⁩؛ تذكر أنها وُلدت في 2 يونيو 1995 في تورونتو لأبوين إثيوبيين، وكانت تُعرف سابقًا بعائشة عبدول، وتخرجت في مايو 2017 في إدارة الأعمال والتسويق، وبدأت الحجاب في الثانية عشرة تقريبًا، ورفعت أول فيديو في 5 يوليو 2011، وانتقلت إلى لوس أنجلوس سنة 2019، ودعمها صندوق «أصوات السود» من يوتيوب سنة 2021."
  en: "The Wikitubia (YouTube fan wiki) page for Aysha Harun. It gives her as born on 2 June 1995 in Toronto to Ethiopian parents, formerly known as Aysha Abdul; graduated in May 2017 with a degree in Business Administration and Marketing; began wearing hijab at about twelve; uploaded her first video on 5 July 2011; moved to Los Angeles in 2019; and received support from the YouTube Black Voices fund in 2021."
  es: "La página de Wikitubia (wiki de fans de YouTube) sobre Aysha Harun. Indica que nació el 2 de junio de 1995 en Toronto, de padres etíopes, anteriormente conocida como Aysha Abdul; se graduó en mayo de 2017 con una licenciatura en Administración de Empresas y Marketing; comenzó a usar hiyab alrededor de los doce años; subió su primer video el 5 de julio de 2011; se mudó a Los Ángeles en 2019; y recibió apoyo del fondo YouTube Black Voices en 2021."
  fr: "La page Wikitubia (wiki des fans de YouTube) consacrée à Aysha Harun indique qu'elle est née le 2 juin 1995 à Toronto de parents éthiopiens, anciennement connue sous le nom d'Aysha Abdul; diplômée en administration des affaires et marketing en mai 2017; a commencé à porter le hijab vers l'âge de douze ans; a mis en ligne sa première vidéo le 5 juillet 2011; a déménagé à Los Angeles en 2019; et a reçu le soutien du fonds YouTube Black Voices en 2021."
