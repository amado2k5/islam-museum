summary:
  ar: "مقالة ويكيبيديا الفرنسية عن إمبراطورية ماسينا (الدينا)؛ تذكر أن مؤسسها سيكو أحمدو كان عضوا في الطريقة الصوفية القادرية، وأن الإمبراطورية حُكمت بتطبيق صارم للشريعة المالكية، وتروي تأسيسها في معركة نوكوما سنة 1818 وتأسيس حمد الله واتساعها من تمبكتو إلى موبتي."
  en: "French Wikipedia article on the Empire of Macina (the Diina); it states that its founder Sékou Amadou was a member of the Qadiriyya Sufi confraternity, that the empire was governed by a rigorous application of Maliki Sharia, and narrates its founding at the battle of Noukouma in 1818, the founding of Hamdallaye and its extent from Timbuktu to Mopti."
