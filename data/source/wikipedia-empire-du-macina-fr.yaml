summary:
  ar: "مقالة ويكيبيديا الفرنسية عن إمبراطورية ماسينا ⁦(الدينا)⁩؛ تذكر أن مؤسسها سيكو أحمدو كان عضوا في الطريقة الصوفية القادرية، وأن الإمبراطورية حُكمت بتطبيق صارم للشريعة المالكية، وتروي تأسيسها في معركة نوكوما سنة 1818 وتأسيس حمد الله واتساعها من تمبكتو إلى موبتي."
  en: "French Wikipedia article on the Empire of Macina (the Diina); it states that its founder Sékou Amadou was a member of the Qadiriyya Sufi confraternity, that the empire was governed by a rigorous application of Maliki Sharia, and narrates its founding at the battle of Noukouma in 1818, the founding of Hamdallaye and its extent from Timbuktu to Mopti."
  es: "Artículo de Wikipedia en francés sobre el Imperio de Macina (el enemigo); afirma que su fundador, Sekou Amadou, era miembro de la cofradía sufí Qadiriyya, que el imperio estaba gobernado por una aplicación rigurosa de Maliki Sharia, y narra su fundación en la batalla de Noukouma en 1818, la fundación de Hamdallaye y su extensión desde Tombuctú hasta Mopti."
  fr: "Article Wikipédia en français sur l'Empire du Macina (l'Ennemi); il affirme que son fondateur Sékou Amadou était membre de la confrérie soufie Qadiriyya, que l'empire était gouverné par une application rigoureuse de la charia Maliki, et raconte sa fondation à la bataille de Noukouma en 1818, la fondation de Hamdallaye et son étendue de Tombouctou à Mopti."
  ur: "میکینا کی سلطنت ⁦(دشمن)⁩ پر فرانسیسی ویکیپیڈیا مضمون؛ اس میں کہا گیا ہے کہ اس کے بانی سیکو عمادو قادریہ صوفی برادری کے رکن تھے، کہ سلطنت پر مالکی شریعت کے سخت اطلاق کے ذریعے حکومت کی جاتی تھی، اور اس کی بنیاد 1818 میں نوکوما کی جنگ، حمدللے کی بنیاد اور ٹمبکٹو سے موپتی تک اس کی بنیاد کو بیان کرتی ہے۔"
  tr: "Masina İmparatorluğu (Aldina) hakkında Fransızca Wikipedia makalesi, kurucusu Seko Ahmedu'nun Kadiri Sufi tarikatının bir üyesi olduğunu ve imparatorluğun kesinlikle Maliki yasalarına göre yönetildiğini belirtir. 1818'deki Nokoma Savaşı'nda kuruluşunu ve Hamdallah'ın kuruluşunu ve Timbuktu'dan Mopti'ye genişlemesini anlatır."
  id: "Artikel Wikipedia Prancis tentang Kekaisaran Masina (Aldina) menyebutkan bahwa pendirinya, Seko Ahmedu, adalah anggota tarekat Sufi Qadiri, dan bahwa kekaisaran tersebut memerintah secara ketat sesuai hukum Maliki. Artikel ini menceritakan pendiriannya pada Pertempuran Nokoma tahun 1818 dan pendirian Hamdallah serta ekspansinya dari Timbuktu ke Mopti."
