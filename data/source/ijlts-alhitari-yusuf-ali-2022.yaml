reliability_note: "Peer-reviewed journal article, read in full. It is the scholarly counterweight in the contested question of Yusuf Ali's school: where the biographical tradition following Sherif (1994) records a conversion to Sunni Hanafi Islam, Al-Hitari reads the commentary itself as Ismaili in inspiration and doubts that he left his ancestral doctrine. Cited so that both readings stand in the person record; it settles nothing on its own."
