summary:
  ar: "مقالة ويكيبيديا التركية عن أبو بكر سيفيل؛ تُستخدم لوقائع الكيان فقط. تفصّل ميلاده في 25 ديسمبر 1960 في صاري قامش بولاية قارص، ودراساته العليا في الحديث بجامعة سلجوق ⁦(ماجستير 1996 ودكتوراه 2006)⁩، وعمله في كلية الإلهيات بجامعة يالوفا، وكتبه وعموده الصحفي."
  en: "Turkish Wikipedia article on Ebubekir Sifil; used for entity facts only. It details his birth on 25 December 1960 in Sarıkamış, Kars, his graduate studies in hadith at Selçuk University (master's 1996, doctorate 2006), his post at Yalova University's theology faculty, his books and his newspaper column."
  es: "Artículo de la Wikipedia en turco sobre Ebubekir Sifil; utilizado únicamente para obtener información sobre la persona. Detalla su nacimiento el 25 de diciembre de 1960 en Sarıkamış, Kars, sus estudios de posgrado en hadiz en la Universidad Selçuk (maestría en 1996, doctorado en 2006), su puesto en la facultad de teología de la Universidad de Yalova, sus libros y su columna periodística."
  fr: "Article de Wikipédia en turc sur Ebubekir Sifil; utilisé uniquement pour des informations sur l'entité. Il détaille sa naissance le 25 décembre 1960 à Sarıkamış, Kars, ses études supérieures en hadith à l'université Selçuk (maîtrise en 1996, doctorat en 2006), son poste à la faculté de théologie de l'université de Yalova, ses livres et sa chronique dans un journal."
  ur: "ایبوبکر سیفل پر ترکی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 25 دسمبر 1960 کو Sarıkamış، Kars میں ان کی پیدائش، سیلوک یونیورسٹی میں حدیث میں ان کی گریجویٹ تعلیم ⁦(ماسٹرز 1996، ڈاکٹریٹ 2006)⁩، یالووا یونیورسٹی کی تھیالوجی فیکلٹی میں ان کی پوسٹ، ان کی کتابیں اور ان کے اخباری کالم کی تفصیلات ہیں۔"
