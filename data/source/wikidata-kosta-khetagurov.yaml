summary:
  ar: "عنصر ويكيداتا Q368956 لكوستا خيتاغوروف؛ يُستخدم للمعرّفات والوقائع المنظّمة فقط. يحمل مولده ووفاته بصيغتين يوليانية وغريغورية متطابقتين في اليوم، ولا يحمل أي قيمة للدين (P140)."
  en: "Wikidata item Q368956 for Kosta Khetagurov; used for identifiers and structured facts only. It carries his birth and death in paired Julian and Gregorian values that are the same days, and carries no religion (P140) value at all."
  es: "Elemento de Wikidata Q368956 para Kosta Khetagurov; se utiliza únicamente para identificadores y datos estructurados. Contiene su fecha de nacimiento y muerte en fechas julianas y gregorianas coincidentes, y no incluye información sobre religión (P140)."
  fr: "L'élément Wikidata Q368956 pour Kosta Khetagurov; il sert uniquement d'identifiant et de données structurées. Il contient ses dates de naissance et de décès (dates julien et grégorien identiques) et aucune information sur sa religion (P140)."
  ur: "ویکی ڈیٹا آئٹم Q368956 برائے کوسٹا کھتاگورو؛ صرف شناخت کنندگان اور ساختی حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پیدائش اور موت کو جولین اور گریگورین اقدار کے ساتھ جوڑا گیا ہے جو ایک ہی دن ہیں، اور اس میں کوئی مذہب (P140) قدر نہیں ہے۔"
  tr: "Wikidata öğesi Kosta Khitagorov tarafından Q368956; yalnızca düzenli tanımlayıcılar ve gerçekler için kullanılır. Doğum ve ölümünü aynı Jülyen ve Gregoryen formlarında taşımaktadır ve dini bir değer taşımamaktadır (S140)."
  id: "Elemen Wikidata Q368956 oleh Kosta Khitagorov; digunakan hanya untuk pengenal terorganisir dan fakta. Ia membawa kelahiran dan kematiannya dalam bentuk Julian dan Gregorian yang identik pada hari tersebut dan tidak membawa nilai religius (Hlm. 140)."
