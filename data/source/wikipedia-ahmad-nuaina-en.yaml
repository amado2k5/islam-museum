summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن القارئ الطبيب أحمد أحمد نعينع؛ لوقائع الكيان فقط: مولده في مطوبس في 15 مارس 1954، ودراسته الطب بجامعة الإسكندرية، وقراءته العشر على محمد فريد النعماني، واعتماده قارئًا في الإذاعة والتلفزيون في 1979، وتعيينه شيخًا لعموم المقارئ المصرية في أكتوبر 2025، وأسفاره؛ وتستند إلى وزارة الأوقاف واليوم السابع والأهرام والعربية وإكنا."
  en: "English Wikipedia article on the physician-reciter Ahmad Ahmad Nuaina; entity facts only: birth at Metoubes on 15 March 1954, medicine at Alexandria University, the ten readings under Muhammad Farid al-Nu'mani, appointment as an official reciter of Egyptian Radio and Television in 1979, appointment as Chief of Egyptian Quran Recitations in October 2025, and his travels; it cites the Ministry of Awqaf, Youm7, al-Ahram, Al Arabiya and IQNA."
  es: "Artículo de la Wikipedia en inglés sobre el médico y recitador Ahmad Ahmad Nuaina; solo datos sobre la persona: nacimiento en Metoubes el 15 de marzo de 1954, medicina en la Universidad de Alejandría, las diez lecturas bajo la dirección de Muhammad Farid al-Nu'mani, nombramiento como recitador oficial de la Radio y Televisión Egipcias en 1979, nombramiento como Jefe de Recitaciones del Corán Egipcio en octubre de 2025 y sus viajes; cita al Ministerio de Awqaf, Youm7, al-Ahram, Al Arabiya e IQNA."
  fr: "Article de Wikipédia en anglais sur le médecin et récitant Ahmad Ahmad Nuaina; informations uniquement sur l’entité: naissance à Metoubes le 15 mars 1954, études de médecine à l’université d’Alexandrie, les dix lectures sous la direction de Muhammad Farid al-Nu’mani, nomination comme récitant officiel de la radio et de la télévision égyptiennes en 1979, nomination comme chef des récitations du Coran égyptiennes en octobre 2025 et ses voyages; il cite le ministère des Awqaf, Youm7, al-Ahram, Al Arabiya et IQNA."
