summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0625\u0646\u062c\u0644\u064a\u0632\u064a\u0629 \u0639\u0646 \u0627\u0644\u0642\u0627\u0631\u0626 \u0627\u0644\u0637\u0628\u064a\u0628 \u0623\u062d\u0645\u062f \u0623\u062d\u0645\u062f \u0646\u0639\u064a\u0646\u0639\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u0645\u0637\u0648\u0628\u0633 \u0641\u064a 15 \u0645\u0627\u0631\u0633 1954\u060c \u0648\u062f\u0631\u0627\u0633\u062a\u0647 \u0627\u0644\u0637\u0628 \u0628\u062c\u0627\u0645\u0639\u0629 \u0627\u0644\u0625\u0633\u0643\u0646\u062f\u0631\u064a\u0629\u060c \u0648\u0642\u0631\u0627\u0621\u062a\u0647 \u0627\u0644\u0639\u0634\u0631 \u0639\u0644\u0649 \u0645\u062d\u0645\u062f \u0641\u0631\u064a\u062f \u0627\u0644\u0646\u0639\u0645\u0627\u0646\u064a\u060c \u0648\u0627\u0639\u062a\u0645\u0627\u062f\u0647 \u0642\u0627\u0631\u0626\u064b\u0627 \u0641\u064a \u0627\u0644\u0625\u0630\u0627\u0639\u0629 \u0648\u0627\u0644\u062a\u0644\u0641\u0632\u064a\u0648\u0646 \u0641\u064a 1979\u060c \u0648\u062a\u0639\u064a\u064a\u0646\u0647 \u0634\u064a\u062e\u064b\u0627 \u0644\u0639\u0645\u0648\u0645 \u0627\u0644\u0645\u0642\u0627\u0631\u0626 \u0627\u0644\u0645\u0635\u0631\u064a\u0629 \u0641\u064a \u0623\u0643\u062a\u0648\u0628\u0631 2025\u060c \u0648\u0623\u0633\u0641\u0627\u0631\u0647\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0648\u0632\u0627\u0631\u0629 \u0627\u0644\u0623\u0648\u0642\u0627\u0641 \u0648\u0627\u0644\u064a\u0648\u0645 \u0627\u0644\u0633\u0627\u0628\u0639 \u0648\u0627\u0644\u0623\u0647\u0631\u0627\u0645 \u0648\u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0648\u0625\u0643\u0646\u0627."
  en: "English Wikipedia article on the physician-reciter Ahmad Ahmad Nuaina; entity facts only: birth at Metoubes on 15 March 1954, medicine at Alexandria University, the ten readings under Muhammad Farid al-Nu'mani, appointment as an official reciter of Egyptian Radio and Television in 1979, appointment as Chief of Egyptian Quran Recitations in October 2025, and his travels; it cites the Ministry of Awqaf, Youm7, al-Ahram, Al Arabiya and IQNA."
