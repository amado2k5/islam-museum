summary:
  ar: "مقالة ويكيبيديا الملايوية عن السلطان عمر علي سيف الدين الثاني؛ تُستخدم لوقائع الكيان فقط. وهي مقالة قصيرة: يؤرّخ صندوقها اعتلاءه العرش في 18 كانون الأول 1826 وميلاده سنة 1804 في بندر بروناي ودينه الإسلام إجمالًا ووفاته في 18 تشرين الثاني 1852 بسرطان الفم ودفنه في الضريح الملكي وخلافة عبد المؤمن له؛ وتذكر قدوم جيمس بروك والتنازل عن لابوان سنة 1846 ومعاهدة 1847 مع بريطانيا."
  en: "Malay Wikipedia article on Sultan Omar Ali Saifuddin II; used for entity facts only. A short article: its infobox dates his accession to 18 December 1826, gives his birth in 1804 at Bandar Brunei, his religion as Islam in general, and his death on 18 November 1852 of mouth cancer, with burial at the Royal Mausoleum and succession by Abdul Momin; it records James Brooke’s coming, the cession of Labuan in 1846 and the 1847 treaty with Britain."
