summary:
  ar: "مقالة ويكيبيديا الملايوية عن السلطان عمر علي سيف الدين الثاني؛ تُستخدم لوقائع الكيان فقط. وهي مقالة قصيرة: يؤرّخ صندوقها اعتلاءه العرش في 18 كانون الأول 1826 وميلاده سنة 1804 في بندر بروناي ودينه الإسلام إجمالًا ووفاته في 18 تشرين الثاني 1852 بسرطان الفم ودفنه في الضريح الملكي وخلافة عبد المؤمن له؛ وتذكر قدوم جيمس بروك والتنازل عن لابوان سنة 1846 ومعاهدة 1847 مع بريطانيا."
  en: "Malay Wikipedia article on Sultan Omar Ali Saifuddin II; used for entity facts only. A short article: its infobox dates his accession to 18 December 1826, gives his birth in 1804 at Bandar Brunei, his religion as Islam in general, and his death on 18 November 1852 of mouth cancer, with burial at the Royal Mausoleum and succession by Abdul Momin; it records James Brooke’s coming, the cession of Labuan in 1846 and the 1847 treaty with Britain."
  es: "Artículo de Wikipedia en malayo sobre el sultán Omar Ali Saifuddin II; utilizado únicamente para datos sobre la entidad. Un artículo breve: su ficha informativa fecha su ascenso al trono el 18 de diciembre de 1826, indica su nacimiento en 1804 en Bandar Brunei, su religión como el Islam en general, y su muerte el 18 de noviembre de 1852 a causa de un cáncer de boca, con entierro en el Mausoleo Real y sucesión por Abdul Momin; también registra la llegada de James Brooke, la cesión de Labuan en 1846 y el tratado de 1847 con Gran Bretaña."
  fr: "Article de Wikipédia en malais sur le sultan Omar Ali Saifuddin II; utilisé uniquement pour les informations sur l'entité. Cet article concis indique que son accession au trône se fait le 18 décembre 1826, qu'il est né en 1804 à Bandar Brunei, qu'il était de confession musulmane et qu'il est décédé le 18 novembre 1852 d'un cancer de la bouche. Il est inhumé au mausolée royal et Abdul Momin lui succède. L'article relate également l'arrivée de James Brooke, la cession de Labuan en 1846 et le traité de 1847 avec la Grande-Bretagne."
  ur: "سلطان عمر علی سیف الدین ثانی پر مالائی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون: اس کا معلوماتی خانہ اس کے الحاق کی تاریخ 18 دسمبر 1826 ہے، اس کی پیدائش 1804 میں بندر برونائی میں ہوئی، اس کا مذہب عام طور پر اسلام ہے، اور 18 نومبر 1852 کو منہ کے کینسر سے اس کی موت، شاہی مقبرے میں تدفین اور عبدالمومن کی جانشینی کے ساتھ؛ اس میں جیمز بروک کی آمد، 1846 میں لابوان کے خاتمے اور برطانیہ کے ساتھ 1847 کے معاہدے کو ریکارڈ کیا گیا ہے۔"
  tr: "Sultan Ömer Ali Saif al-Din II hakkındaki Malay Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Kısa bir makaledir: kutusunda tahta çıkışı 18 Aralık 1826, 1804'te Bandar Brunei'de doğduğu, genel dini İslam, 18 Kasım 1852'de ağız kanserinden ölümü, kraliyet türbesine defnedilmesi ve Abdul Mu'min'e geçişi tarihlenmektedir; James Brooke'un gelişi, 1846'da Labuan'ın devri ve 1847 Britanya ile yapılan antlaşma gibi konuları içerir."
  id: "Artikel Wikipedia Melayu tentang Sultan Omar Ali Saif al-Din II hanya digunakan untuk fakta entitas tersebut. Artikel ini singkat: kotaknya mencatat tanggal ia naik takhta pada 18 Desember 1826, kelahirannya pada tahun 1804 di Bandar Brunei, agama umumnya adalah Islam, kematiannya pada 18 November 1852 karena kanker mulut, pemakamannya di mausoleum kerajaan, dan suksesinya atas Abdul Mu'min; artikel ini menyebutkan kedatangan James Brooke, penyerahan Labuan pada tahun 1846, dan perjanjian tahun 1847 dengan Britania."
