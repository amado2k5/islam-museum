  ar: "مقالة ويكيبيديا الإنجليزية عن ناصر الدين محمود شاه الشرقي (1429–1457)، رابع سلاطين جونبور؛ خلف أباه إبراهيم شاه سنة 1440 وحكم حتى 1457، وحمل على البنغال ومالوة ودلهي، ومات أثناء حملة شمس آباد وخلفه ابنه محمد شاه؛ وتذكر المقالة تشييده المساجد وترميمه جامع أتالا في جونبور."
  en: "English Wikipedia article on Nasir-ud-Din Mahmud Shah Sharqi (1429–1457), fourth sultan of Jaunpur; he succeeded his father Ibrahim Shah in 1440, reigned until 1457, campaigned against Bengal, Malwa and Delhi, died during the Shamsabad campaign and was succeeded by his son Muhammad Shah; the article also records his mosque commissions and his restoration of the Atala Mosque at Jaunpur."
