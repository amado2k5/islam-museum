summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ناصر الدين محمود شاه الشرقي (1429–1457)، رابع سلاطين جونبور؛ خلف أباه إبراهيم شاه سنة 1440 وحكم حتى 1457، وحمل على البنغال ومالوة ودلهي، ومات أثناء حملة شمس آباد وخلفه ابنه محمد شاه؛ وتذكر المقالة تشييده المساجد وترميمه جامع أتالا في جونبور."
  en: "English Wikipedia article on Nasir-ud-Din Mahmud Shah Sharqi (1429–1457), fourth sultan of Jaunpur; he succeeded his father Ibrahim Shah in 1440, reigned until 1457, campaigned against Bengal, Malwa and Delhi, died during the Shamsabad campaign and was succeeded by his son Muhammad Shah; the article also records his mosque commissions and his restoration of the Atala Mosque at Jaunpur."
  es: "Artículo de la Wikipedia en inglés sobre Nasir-ud-Din Mahmud Shah Sharqi (1429-1457), cuarto sultán de Jaunpur; sucedió a su padre Ibrahim Shah en 1440, reinó hasta 1457, hizo campaña contra Bengala, Malwa y Delhi, murió durante la campaña de Shamsabad y fue sucedido por su hijo Muhammad Shah; el artículo también registra sus encargos de mezquitas y la restauración de la Mezquita Atala en Jaunpur."
  fr: "Article de Wikipédia en anglais sur Nasir-ud-Din Mahmud Shah Sharqi (1429-1457), quatrième sultan de Jaunpur; il succède à son père Ibrahim Shah en 1440, règne jusqu'en 1457, mène campagne contre le Bengale, le Malwa et Delhi, meurt pendant la campagne de Shamsabad et est remplacé par son fils Muhammad Shah; l'article relate également ses commandes de mosquées et sa restauration de la mosquée Atala à Jaunpur."
  ur: "جونپور کے چوتھے سلطان ناصر الدین محمود شاہ شرقی (1429–1457) پر انگریزی ویکیپیڈیا کا مضمون؛ اس نے 1440 میں اپنے والد ابراہیم شاہ کا جانشین بنایا، 1457 تک حکومت کی، بنگال، مالوا اور دہلی کے خلاف مہم چلائی، شمس آباد مہم کے دوران اس کی موت ہو گئی اور اس کا بیٹا محمد شاہ جانشین بنا۔ مضمون میں ان کی مسجد کمیشن اور جونپور میں اٹالہ مسجد کی بحالی کا بھی ریکارڈ ہے۔"
  tr: "Junpur'un dördüncü Sultanı Nasiruddin Mahmud Şah el-Şerqi (1429–1457) hakkında İngilizce Vikipedi makalesi; 1440'ta babası İbrahim Şah'ın yerine geçti ve 1457'ye kadar hüküm sürdü, Bengal, Malwa ve Delhi'yi yönetti, Şemsabad seferinde öldü ve yerine oğlu Muhammed Şah geçti; makalede camiler inşa etmesi ve Gunpur'daki Atala Camii'nin restorasyonundan bahsediliyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Nasiruddin Mahmud Shah al-Sharqi (1429–1457), Sultan keempat Junpur; menggantikan ayahnya Ibrahim Shah pada tahun 1440 dan memerintah hingga 1457, memerintah Bengal, Malwa, dan Delhi, meninggal selama kampanye Shamsabad, dan digantikan oleh putranya Muhammad Shah; artikel tersebut menyebutkan pembangunan masjid dan restorasi Masjid Atala di Gunpur."
