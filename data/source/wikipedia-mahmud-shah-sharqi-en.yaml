reliability_note: "The only encyclopedia article on this sultan, read in full (text and wikitext) on 1 November 2026. It carries the template flag 'AI-generated' dated August 2025, so it is used with explicit caution: the reign frame (accession 1440, death 1457, succession by Muhammad Shah) agrees with the scholarly works it cites — Habib & Nizami's Comprehensive History of India (1970), Haig's Cambridge History of India vol. III, Saeed's The Sharqi of Jaunpur (1972) and Führer (1889) — and with Wikidata's death year, while the day-level dates in its infobox (born 16 April 1429, died 12 September 1457) are corroborated nowhere else read and are preserved in the record's notes, not asserted. It names no religion or school for him."
