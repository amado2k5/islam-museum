summary:
  ar: مقالة ويكيبيديا الإنجليزية عن أحمد كاثرادا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 21 أغسطس 1929 في شفايتزر-رينيكه «لأسرة بوهرا غوجراتية»، ونشاطه منذ سن الثانية عشرة، ومحاكمة ريفونيا وحكم السجن المؤبد، وثمانية عشر عامًا في جزيرة روبن، وإطلاق سراحه سنة 1989، وحجه سنة 1992، وخدمته البرلمانية ومنصبه مستشارًا للرئيس مانديلا، ووفاته في جوهانسبرغ في 28 مارس 2017 ودفنه في اليوم التالي وفق الشعائر الإسلامية.
  en: English Wikipedia article on Ahmed Kathrada; used for entity facts only. It gives his birth on 21 August 1929 in Schweizer-Reneke in 'a Gujarati Bohra family', his activism from the age of 12, the Rivonia Trial and life sentence, 18 years on Robben Island, his release in 1989, his 1992 Hajj pilgrimage, his parliamentary service and advisory post to President Mandela, and his death in Johannesburg on 28 March 2017, buried the next day in accordance with Islamic rites.
