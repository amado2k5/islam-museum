summary:
  ar: مقالة ويكيبيديا الإنجليزية عن أحمد كاثرادا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 21 أغسطس 1929 في شفايتزر-رينيكه «لأسرة بوهرا غوجراتية»، ونشاطه منذ سن الثانية عشرة، ومحاكمة ريفونيا وحكم السجن المؤبد، وثمانية عشر عامًا في جزيرة روبن، وإطلاق سراحه سنة 1989، وحجه سنة 1992، وخدمته البرلمانية ومنصبه مستشارًا للرئيس مانديلا، ووفاته في جوهانسبرغ في 28 مارس 2017 ودفنه في اليوم التالي وفق الشعائر الإسلامية.
  en: English Wikipedia article on Ahmed Kathrada; used for entity facts only. It gives his birth on 21 August 1929 in Schweizer-Reneke in 'a Gujarati Bohra family', his activism from the age of 12, the Rivonia Trial and life sentence, 18 years on Robben Island, his release in 1989, his 1992 Hajj pilgrimage, his parliamentary service and advisory post to President Mandela, and his death in Johannesburg on 28 March 2017, buried the next day in accordance with Islamic rites.
  es: "Artículo de la Wikipedia en inglés sobre Ahmed Kathrada; utilizado únicamente para datos sobre la persona. En él se menciona su nacimiento el 21 de agosto de 1929 en Schweizer-Reneke en el seno de una familia Bohra gujarati, su activismo desde los 12 años, el juicio de Rivonia y su condena a cadena perpetua, sus 18 años en la isla Robben, su liberación en 1989, su peregrinación a La Meca en 1992, su servicio parlamentario y su cargo de asesor del presidente Mandela, y su fallecimiento en Johannesburgo el 28 de marzo de 2017, donde fue enterrado al día siguiente según los ritos islámicos."
  fr: "Article de Wikipédia en anglais sur Ahmed Kathrada; utilisé uniquement pour les informations biographiques. Il retrace sa naissance le 21 août 1929 à Schweizer-Reneke, au sein d'une famille gujarati Bohra, son militantisme dès l'âge de 12 ans, le procès de Rivonia et sa condamnation à la prison à vie, ses 18 années de détention à Robben Island, sa libération en 1989, son pèlerinage à La Mecque en 1992, son mandat parlementaire et son poste de conseiller auprès du président Mandela, ainsi que son décès à Johannesburg le 28 mars 2017, avec inhumation le lendemain selon le rite islamique."
  ur: "احمد کتراڈا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 21 اگست 1929 کو شوائزر-رینیک میں 'ایک گجراتی بوہرا خاندان' میں ان کی پیدائش، 12 سال کی عمر سے ان کی سرگرمی، ریوونیا ٹرائل اور عمر قید، 18 سال روبن جزیرے پر، 1989 میں ان کی رہائی، 1992 میں ان کی حج کی ادائیگی، ان کی پارلیمانی خدمات اور جوڈیلاہن برگ میں صدر کے عہدے کے لیے مشاورتی خدمات، مارچ 2018 میں ان کی وفات کے بعد۔ 2017، اگلے دن اسلامی رسومات کے مطابق دفنایا گیا۔"
