summary:
  ar: "مقالة ويكيبيديا العربية عن شوقان ولي خانوف؛ تُستخدم لوقائع الكيان فقط. بذرة مترجمة عن الإنجليزية توافقها في مولده ⁦(نوفمبر 1835)⁩ ووفاته ⁦(10 أبريل 1865)⁩ وفي شهرته أبًا للتاريخ والإثنوغرافيا الكازاخيين الحديثين."
  en: "Arabic Wikipedia article on Shoqan Walikhanov; used for entity facts only. A stub translated from the English article, agreeing with it on his birth (November 1835), his death (10 April 1865) and his standing as father of modern Kazakh history and ethnography."
  es: "Artículo en árabe de la Wikipedia sobre Shoqan Walikhanov; utilizado únicamente para datos sobre la persona. Un fragmento traducido del artículo en inglés, que coincide con él en cuanto a su fecha de nacimiento (noviembre de 1835), su muerte (10 de abril de 1865) y su posición como padre de la historia y la etnografía kazajas modernas."
  fr: "Article de Wikipédia en arabe sur Shoqan Walikhanov; utilisé uniquement pour les informations factuelles. Ébauche traduite de l’article anglais, reprenant les informations concernant sa naissance (novembre 1835), sa mort (10 avril 1865) et son rôle de père de l’histoire et de l’ethnographie kazakhes modernes."
  ur: "شوقان ولیخانوف پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ انگریزی مضمون سے ترجمہ کیا گیا ایک اسٹب، جو اس کی پیدائش ⁦(نومبر 1835)⁩، اس کی موت ⁦(10 اپریل 1865)⁩ اور جدید قازق تاریخ اور نسلیات کے باپ کے طور پر اس کے موقف سے متفق ہے۔"
  tr: "Shokan ve Wali Hanov hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumuna (Kasım 1835) ve ölümüne (10 Nisan 1865) karşılık gelen İngilizceden çevrilmiş bir taslak ve modern Kazak tarihi ile etnografyasının babası olarak ününe karşılık gelir."
  id: "Artikel Wikipedia bahasa Arab tentang Shokan dan Wali Khanov; hanya digunakan untuk fakta entitas. Sebuah stub yang diterjemahkan dari bahasa Inggris yang sesuai dengan kelahirannya (November 1835) dan kematiannya (10 April 1865), serta reputasinya sebagai bapak sejarah dan etnografi Kazakh modern."
