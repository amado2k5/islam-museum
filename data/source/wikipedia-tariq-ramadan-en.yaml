reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth in Geneva on 26 August 1962 to Said Ramadan and Wafa al-Banna, eldest daughter of Hassan al-Banna; his Geneva MA in French literature and PhD in Arabic and Islamic studies, and his dissertation on Nietzsche; the Notre Dame appointment and the 2004 visa revocation under the Patriot Act's ideological-exclusion provision, the ACLU litigation, the 2009 appeals-court reversal and his 2010 return to speak at Cooper Union; the Rotterdam dismissal over his Press TV programme and the 2012 court ruling that the university had acted carelessly; the Oxford chair in Contemporary Islamic Studies from September 2009 and his direction of CILE in Doha; his self-description at times as a 'Salafi reformist' and his positions (rejection of the dar al-Islam/dar al-harb binary, the hudud moratorium call in the 2003 Sarkozy debate, opposition to capital punishment and to suicide bombing); the praise and the criticism, including Caroline Fourest's Frère Tariq and his denial of double discourse; and the legal history — the complaints filed from October 2017, his detention in France from 31 January 2018 and release, his admissions of consensual extramarital affairs and the June 2018 clearing of the third accusation, his 2019 Dreyfus comparison, the further charges of February 2020, his acquittal at first instance in Geneva in May 2023, his conviction by the Swiss appeals court in September 2024 (rape and sexual coercion, three years with two suspended) made final when the Federal Supreme Court rejected his appeal in August 2025, and the Paris criminal court's conviction of March 2026 (rape and rape of a vulnerable person, offences of 2009–2016, eighteen years, tried in absentia, arrest warrant issued, judgment subject to appeal). Legal facts are carried in the person record exactly in this attributed, dated form; allegations are never stated as facts. Read in full on 24 October 2026."
