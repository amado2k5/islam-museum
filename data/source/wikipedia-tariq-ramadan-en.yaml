summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن طارق رمضان؛ تُستخدم لوقائع الكيان فقط. توثّق ميلاده في جنيف سنة 1962 حفيدًا لحسن البنا، ومسيرته الأكاديمية حتى كرسي أكسفورد، وقضية تأشيرته الأمريكية، وآراءه وانتقاداته، واتهامات الاعتداء الجنسي منذ 2017 وإدانته في سويسرا ⁦(نهائية 2025)⁩ وفرنسا ⁦(مارس 2026، قابلة للاستئناف)⁩."
  en: "English Wikipedia article on Tariq Ramadan; used for entity facts only. It records his birth in Geneva in 1962 as Hassan al-Banna's grandson, his academic career to the Oxford chair, the US visa case, his views and critics, and the sexual-assault allegations from 2017 with his convictions in Switzerland (final 2025) and France (March 2026, subject to appeal)."
  es: "Artículo de la Wikipedia en inglés sobre Tariq Ramadan; utilizado únicamente para datos sobre la persona. En él se recoge su nacimiento en Ginebra en 1962 como nieto de Hassan al-Banna, su trayectoria académica hasta la cátedra de Oxford, el caso de su visado estadounidense, sus opiniones y las críticas que recibió, y las acusaciones de agresión sexual de 2017, con sus condenas en Suiza (sentencia definitiva en 2025) y Francia (marzo de 2026, sujeta a apelación)."
  fr: "Article de Wikipédia en anglais sur Tariq Ramadan; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance à Genève en 1962, petit-fils de Hassan al-Banna, sa carrière universitaire jusqu’à la chaire d’Oxford, l’affaire du visa américain, ses opinions et ses détracteurs, ainsi que les accusations d’agression sexuelle de 2017 et ses condamnations en Suisse (décision définitive en 2025) et en France (mars 2026, sous réserve d’appel)."
  ur: "طارق رمضان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں حسن البنا کے پوتے کے طور پر 1962 میں جنیوا میں ان کی پیدائش، آکسفورڈ چیئر پر ان کا تعلیمی کیریئر، امریکی ویزا کیس، ان کے خیالات اور ناقدین، اور 2017 سے جنسی زیادتی کے الزامات کو سوئٹزرلینڈ ⁦(حتمی 2025)⁩ اور فرانس ⁦(اپیل، مارچ 62 سے موضوع)⁩ کے ساتھ درج کیا گیا ہے۔"
  tr: "Tariq Ramazan hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılmıştır. 1962'de Cenevre'de Hassan al-Banna'nın torunu olarak doğduğu makale, akademik kariyeri Oxford kürsüsüne kadar olan dönemi, Amerikan vizesi meselesi, görüşleri ve eleştirileri, 2017'den beri cinsel saldırı iddiaları ve İsviçre'deki mahkumiyetini (nihai 2025) ve Fransa'daki mahkumiyetini (Mart 2026, temyiz edilebilir) belgelemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Tariq Ramadan; digunakan hanya untuk fakta entitas. Artikel ini mendokumentasikan kelahirannya di Jenewa pada tahun 1962 sebagai cucu Hassan al-Banna, karier akademisnya hingga kursi Oxford, masalah visa Amerika, pendapat dan kritiknya, tuduhan pelecehan seksual sejak 2017, serta vonisnya di Swiss (final 2025) dan Prancis (Maret 2026, dapat diajukan banding)."
