  ar: "مقالة ويكيبيديا الإنجليزية عن طارق رمضان؛ تُستخدم لوقائع الكيان فقط. توثّق ميلاده في جنيف سنة 1962 حفيدًا لحسن البنا، ومسيرته الأكاديمية حتى كرسي أكسفورد، وقضية تأشيرته الأمريكية، وآراءه وانتقاداته، واتهامات الاعتداء الجنسي منذ 2017 وإدانته في سويسرا (نهائية 2025) وفرنسا (مارس 2026، قابلة للاستئناف)."
  en: "English Wikipedia article on Tariq Ramadan; used for entity facts only. It records his birth in Geneva in 1962 as Hassan al-Banna's grandson, his academic career to the Oxford chair, the US visa case, his views and critics, and the sexual-assault allegations from 2017 with his convictions in Switzerland (final 2025) and France (March 2026, subject to appeal)."
