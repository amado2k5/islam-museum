summary:
  ar: "ملف تعريفي في موقع eCentral الماليزي بالداعية أوني محمد، نُشر في 27 مايو 2024؛ يذكر اسمه الكامل أوني بن محمد وميلاده في 29 ديسمبر 1976 في باسير ماس بكلنتن، وعمله مدرّسًا في بينانغ ودراسته في الأزهر ومحاضراته منذ 2004."
  en: "eCentral (Malaysia) biodata profile of Auni Mohamed, published 27 May 2024: it gives his full name Au'ni bin Mohamed, his birth on 29 December 1976 in Pasir Mas, Kelantan, his teaching post in Penang, his Al-Azhar study and his lecturing since 2004."
  es: "Perfil biográfico de Auni Mohamed en eCentral (Malasia), publicado el 27 de mayo de 2024: en él se indica su nombre completo, Au'ni bin Mohamed, su fecha de nacimiento el 29 de diciembre de 1976 en Pasir Mas, Kelantan, su puesto docente en Penang, sus estudios en Al-Azhar y su labor como profesor desde 2004."
  fr: "Profil biographique d'Auni Mohamed sur eCentral (Malaisie), publié le 27 mai 2024: il indique son nom complet Au'ni bin Mohamed, sa naissance le 29 décembre 1976 à Pasir Mas, Kelantan, son poste d'enseignant à Penang, ses études à Al-Azhar et ses conférences depuis 2004."
  ur: "ای سینٹرل ⁦(ملائیشیا)⁩ عونی محمد کا بائیو ڈیٹا پروفائل، جو 27 مئی 2024 کو شائع ہوا: اس میں اس کا پورا نام عونی بن محمد بتایا گیا ہے، اس کی پیدائش 29 دسمبر 1976 کو پسیر ماس، کیلنتان میں، ان کی پینانگ میں تدریسی پوسٹ، اس کا الازہر کا مطالعہ اور 2004 سے اس کا لیکچر دیا گیا ہے۔"
  tr: "Malezya eCentral web sitesinde vaiz Oni Mohammed'in profili, 27 Mayıs 2024'te yayımlandı; tam adı Oni bin Mohammed, 29 Aralık 1976'da Clinton, Basir Mas'ta doğdu ve Penang'da öğretmenlik çalışmaları, Al-Azhar'daki çalışmaları ve 2004'ten beri verdiği dersler."
  id: "Profil di situs web eCentral Malaysia tentang penceramah Oni Mohammed, diterbitkan pada 27 Mei 2024; nama lengkapnya Oni bin Mohammed, kelahirannya pada 29 Desember 1976 di Basir Mas, Clinton, dan pekerjaannya sebagai guru di Penang, studinya di Al-Azhar, serta kuliahnya sejak 2004."
