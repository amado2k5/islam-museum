summary:
  ar: "مقالة ويكيبيديا العربية عن القارئ والمنشد نصر الدين طوبار؛ لوقائع الكيان فقط: مولده بالمنزلة في 7 يونيو 1920، ونجاحه في اختبار الإذاعة في المرة السابعة، ونحو مئتي ابتهال، وتسجيله المصحف المجود للإذاعة والتلفزيون السعوديين في 1978، وقيادته فرقة الإنشاد الديني بأكاديمية الفنون من 1980، ووفاته في 16 نوفمبر 1986؛ وتستند إلى الأهرام والمصري اليوم."
  en: "Arabic Wikipedia article on the reciter and munshid Nasr al-Din Tubar; entity facts only: birth at al-Manzala on 7 June 1920, passing the radio test at the seventh attempt, some two hundred ibtihalat, the mujawwad Qur'an recorded for Saudi radio and television in 1978, leading the religious-song ensemble of the Academy of Arts from 1980, and death on 16 November 1986; it cites al-Ahram and al-Masry al-Youm."
  es: "Artículo de Wikipedia en árabe sobre el recitador y munshid Nasr al-Din Tubar; solo datos sobre la persona: nacimiento en al-Manzala el 7 de junio de 1920, superación de la prueba de radio al séptimo intento, unos doscientos ibtihalat, grabación del Corán mujawwad para la radio y la televisión saudíes en 1978, dirección del conjunto de canciones religiosas de la Academia de Artes desde 1980 y fallecimiento el 16 de noviembre de 1986; cita a al-Ahram y al-Masry al-Youm."
  fr: "Article de Wikipédia en arabe sur le récitant et munshid Nasr al-Din Tubar; faits concernant uniquement l'entité: naissance à al-Manzala le 7 juin 1920, réussite au test de radio à la septième tentative, quelque deux cents ibtihalat, le mujawwad Qur'an enregistré pour la radio et la télévision saoudiennes en 1978, direction de l'ensemble de chants religieux de l'Académie des arts à partir de 1980, et décès le 16 novembre 1986; il cite al-Ahram et al-Masry al-Youm."
  ur: "عربی ویکیپیڈیا کا مضمون قاری اور منشد نصر الدین تبار پر؛ صرف ہستی کے حقائق: 7 جون 1920 کو المنزلہ میں پیدائش، ساتویں کوشش میں ریڈیو کا امتحان پاس کرنا، تقریباً دو سو ابتہلات، 1978 میں سعودی ریڈیو اور ٹیلی ویژن کے لیے مجوّاد قرآن ریکارڈ کیا گیا، 1980 سے اکیڈمی آف آرٹس کے مذہبی گیتوں کے اجتماع کی قیادت کرتے ہوئے؛ اور 19 نومبر 1966 کو وفات پائی۔ اس میں الاحرام اور المصری یوم کا حوالہ دیا گیا ہے۔"
