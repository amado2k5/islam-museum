summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0639\u0646 \u0627\u0644\u0642\u0627\u0631\u0626 \u0648\u0627\u0644\u0645\u0646\u0634\u062f \u0646\u0635\u0631 \u0627\u0644\u062f\u064a\u0646 \u0637\u0648\u0628\u0627\u0631\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0628\u0627\u0644\u0645\u0646\u0632\u0644\u0629 \u0641\u064a 7 \u064a\u0648\u0646\u064a\u0648 1920\u060c \u0648\u0646\u062c\u0627\u062d\u0647 \u0641\u064a \u0627\u062e\u062a\u0628\u0627\u0631 \u0627\u0644\u0625\u0630\u0627\u0639\u0629 \u0641\u064a \u0627\u0644\u0645\u0631\u0629 \u0627\u0644\u0633\u0627\u0628\u0639\u0629\u060c \u0648\u0646\u062d\u0648 \u0645\u0626\u062a\u064a \u0627\u0628\u062a\u0647\u0627\u0644\u060c \u0648\u062a\u0633\u062c\u064a\u0644\u0647 \u0627\u0644\u0645\u0635\u062d\u0641 \u0627\u0644\u0645\u062c\u0648\u062f \u0644\u0644\u0625\u0630\u0627\u0639\u0629 \u0648\u0627\u0644\u062a\u0644\u0641\u0632\u064a\u0648\u0646 \u0627\u0644\u0633\u0639\u0648\u062f\u064a\u064a\u0646 \u0641\u064a 1978\u060c \u0648\u0642\u064a\u0627\u062f\u062a\u0647 \u0641\u0631\u0642\u0629 \u0627\u0644\u0625\u0646\u0634\u0627\u062f \u0627\u0644\u062f\u064a\u0646\u064a \u0628\u0623\u0643\u0627\u062f\u064a\u0645\u064a\u0629 \u0627\u0644\u0641\u0646\u0648\u0646 \u0645\u0646 1980\u060c \u0648\u0648\u0641\u0627\u062a\u0647 \u0641\u064a 16 \u0646\u0648\u0641\u0645\u0628\u0631 1986\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0627\u0644\u0623\u0647\u0631\u0627\u0645 \u0648\u0627\u0644\u0645\u0635\u0631\u064a \u0627\u0644\u064a\u0648\u0645."
  en: "Arabic Wikipedia article on the reciter and munshid Nasr al-Din Tubar; entity facts only: birth at al-Manzala on 7 June 1920, passing the radio test at the seventh attempt, some two hundred ibtihalat, the mujawwad Qur'an recorded for Saudi radio and television in 1978, leading the religious-song ensemble of the Academy of Arts from 1980, and death on 16 November 1986; it cites al-Ahram and al-Masry al-Youm."
