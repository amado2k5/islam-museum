summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألفا كوندي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في بوكي سنة 1938 ونشاطه الطلابي في فرنسا وعقوده في المعارضة ضد نظام كونتي وسجنه ومحاكمته، وانتخابه رئيسا لغينيا سنة 2010 بوصفه أول رئيس منتخب بحرية في تاريخ البلاد، وإعادة انتخابه 2015 و2020، والإطاحة به في انقلاب 5 سبتمبر 2021. لا تذكر دينه في أي نص؛ وتصنّفه ضمن مسلمي غينيا والاشتراكيين المسلمين تصنيفا لا نصا."
  en: "English Wikipedia article on Alpha Condé; used for entity facts only. It recounts his birth in Boké in 1938, his student activism in France, his decades in opposition to the Conté regime, his imprisonment and trial, his election as president of Guinea in 2010 as the first freely elected president in the country's history, his re-elections in 2015 and 2020, and his overthrow in the coup of 5 September 2021. Its text says nothing about his religion; it files him under Guinean Muslims and Muslim socialists, category filings rather than text statements."
