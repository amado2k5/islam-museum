  ar: "مقالة ويكيبيديا الأردية عن فاطمة جناح؛ تعطي مولدها في 31 تموز 1893 ووفاتها في كراتشي في 9 تموز 1967، وتنقل شهادة مفادها أنها قالت في حملتها الانتخابية إنها هي نفسها شيعية، وتذكر أن آخر رسومها أُدّيت وفق الطقوس الشيعية."
  en: "The Urdu Wikipedia article on Fatima Jinnah; it gives her birth on 31 July 1893 and her death at Karachi on 9 July 1967, reports testimony that during her presidential campaign she said she was herself Shia, and states that her last rites were performed according to the Shia rite while the state funeral was Sunni."
