summary:
  ar: "مقالة ويكيبيديا العربية عن سامي أفندي؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 16 ذي الحجة 1253هـ وتفسّره بسنة 1837م، ووفاته سنة 1330هـ ⁦(1912م)⁩ ودفنه في حظيرة جامع الفاتح، وتذكر أساتذته في الخط — ومنهم إسماعيل حقي زاده القبرصي في التعليق — وتلاميذه، ومنهم حسن رضا أفندي."
  en: "Arabic Wikipedia article on Sami Efendi; used for entity facts only. It gives his birth as 16 Dhu al-Hijja 1253 AH, glossed as 1837 CE, his death in 1330 AH (1912 CE) with burial in the hazire of the Fatih Mosque, his calligraphy teachers — among them İsmail Hakkı-zade of Cyprus for ta'liq — and his students, among them Hasan Rıza Efendi."
  es: "Artículo de Wikipedia en árabe sobre Sami Efendi; utilizado únicamente para datos sobre la persona. Indica que nació el 16 de Dhu al-Hijjah de 1253 AH, traducido como 1837 d. C., falleció en 1330 AH (1912 d. C.) y fue enterrado en el cementerio de la Mezquita Fatih. Menciona a sus maestros de caligrafía, entre ellos İsmail Hakkı-zade de Chipre para ta'liq, y a sus alumnos, entre ellos Hasan Rıza Efendi."
  fr: "Article de Wikipédia en arabe sur Sami Efendi; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 16 Dhu al-Hijja 1253 AH, transcrite en 1837 CE, sa mort en 1330 AH (1912 CE) avec inhumation dans le hazire de la mosquée Fatih, ses professeurs de calligraphie — parmi lesquels İsmail Hakkı-zade de Chypre pour le ta'liq — et ses élèves, parmi lesquels Hasan Rıza Efendi."
  ur: "سمیع آفندی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی ولادت 16 ذی الحجہ 1253 ہجری ہے، جو 1837 عیسوی کے طور پر چمکی، ان کی وفات 1330 ہجری ⁦(1912 عیسوی)⁩ میں فاتح مسجد کے حجرے میں تدفین کے ساتھ ہوئی، اس کے خطاطی کے اساتذہ - ان میں اسماعیل حقی زادے - قبرص کے اسمٰعیل حقی زادے، ان کے طالب علموں کے لیے تاسفین اور تاسان۔"
  tr: "Sami Efendi hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 16 Zulhice 1253 Hicce doğumlu ve 1837 olarak yorumlanmış, 1330 Hicc (1912 M) yılında ölmüş ve El-Fatih Camii'nin çevresine defnedilmiştir. Hat öğretmenleri — yorumda İsmail Haqqizadeh el-Kıbrıs dahil — ve öğrencileri, aralarında Hasan Reda Efendi de dahil olmak üzere, anılır."
  id: "Artikel Wikipedia bahasa Arab tentang Sami Effendi; digunakan hanya untuk fakta entitas. Ia lahir pada 16 Dhu al-Hijjah 1253 H dan diinterpretasikan sebagai 1837 M, meninggal pada 1330 H (1912 M), dan dimakamkan di pagar Masjid Al-Fatih. Guru kaligrafinya — termasuk Ismail Haqqizadeh al-Siprus dalam komentar — dan murid-muridnya, termasuk Hassan Reda Effendi, disebutkan."
