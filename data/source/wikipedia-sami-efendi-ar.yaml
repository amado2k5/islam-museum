  ar: "مقالة ويكيبيديا العربية عن سامي أفندي؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 16 ذي الحجة 1253هـ وتفسّره بسنة 1837م، ووفاته سنة 1330هـ (1912م) ودفنه في حظيرة جامع الفاتح، وتذكر أساتذته في الخط — ومنهم إسماعيل حقي زاده القبرصي في التعليق — وتلاميذه، ومنهم حسن رضا أفندي."
