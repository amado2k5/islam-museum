summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ناريمان ناريمانوف؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في تفليس في 14 أبريل [2 أبريل باليولياني] 1870 ووفاته بنوبة قلبية في موسكو في 19 مارس 1925 ودفنه في مقبرة جدار الكرملين، ومسيرته أديبًا وطبيبًا ورئيس حكومة أذربيجان السوفيتية، وتقول إن رواياته المبكرة دعت إلى ترك «العادات البالية والخرافات الدينية» — موقف أدبي منسوب لا شهادة بمذهب."
  en: "English Wikipedia article on Nariman Narimanov; used for entity facts only. It recounts his birth at Tiflis on 14 April [O.S. 2 April] 1870, his death of a heart attack at Moscow on 19 March 1925 and burial in the Kremlin Wall Necropolis, and his career as writer, physician and head of the Azerbaijan Soviet government; it says his early novels advocated the abandonment of 'tired customs and religious superstitions' — an attributed literary position, not a school attestation."
  es: "Artículo de la Wikipedia en inglés sobre Nariman Narimanov; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Tiflis el 14 de abril [2 de abril según el calendario antiguo] de 1870, su muerte por un ataque al corazón en Moscú el 19 de marzo de 1925 y su entierro en la Necrópolis de la Muralla del Kremlin, así como su trayectoria como escritor, médico y jefe del gobierno soviético de Azerbaiyán. Afirma que sus primeras novelas abogaban por el abandono de las \"costumbres obsoletas y las supersticiones religiosas\", una postura literaria que se le atribuye, no una certificación académica."
  fr: "Article de Wikipédia en anglais sur Nariman Narimanov; utilisé uniquement pour les informations factuelles. Il relate sa naissance à Tiflis le 14 avril [2 avril du calendrier julien] 1870, sa mort d'une crise cardiaque à Moscou le 19 mars 1925 et son inhumation dans la nécropole du mur du Kremlin, ainsi que sa carrière d'écrivain, de médecin et de chef du gouvernement soviétique d'Azerbaïdjan; il indique que ses premiers romans prônaient l'abandon des « coutumes dépassées et des superstitions religieuses » — une position littéraire attribuée, et non une attestation académique."
  ur: "Nariman Narimanov پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 14 اپریل [OS 2 اپریل] 1870 کو ٹفلس میں ان کی پیدائش، 19 مارچ 1925 کو ماسکو میں دل کا دورہ پڑنے سے ان کی موت اور کریملن وال نیکروپولیس میں تدفین، اور مصنف، طبیب اور آذربائیجان سوویت حکومت کے سربراہ کے طور پر ان کے کیریئر کا ذکر ہے۔ اس کا کہنا ہے کہ اس کے ابتدائی ناولوں نے 'تھکے ہوئے رسوم و رواج اور مذہبی توہمات' کو ترک کرنے کی وکالت کی تھی - ایک منسوب ادبی حیثیت، اسکول کی تصدیق نہیں۔"
