summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ناريمان ناريمانوف؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في تفليس في 14 أبريل [2 أبريل باليولياني] 1870 ووفاته بنوبة قلبية في موسكو في 19 مارس 1925 ودفنه في مقبرة جدار الكرملين، ومسيرته أديبًا وطبيبًا ورئيس حكومة أذربيجان السوفيتية، وتقول إن رواياته المبكرة دعت إلى ترك «العادات البالية والخرافات الدينية» — موقف أدبي منسوب لا شهادة بمذهب."
  en: "English Wikipedia article on Nariman Narimanov; used for entity facts only. It recounts his birth at Tiflis on 14 April [O.S. 2 April] 1870, his death of a heart attack at Moscow on 19 March 1925 and burial in the Kremlin Wall Necropolis, and his career as writer, physician and head of the Azerbaijan Soviet government; it says his early novels advocated the abandonment of 'tired customs and religious superstitions' — an attributed literary position, not a school attestation."
