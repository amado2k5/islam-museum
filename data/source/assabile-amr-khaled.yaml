summary:
  ar: "أرشيف الدروس المسجّلة لـعمرو خالد على موقع Assabile، ويضم 16 سلسلة تضم نحو 559 درسا بحسب صفحة الموقع. مصدر أولي لما يقوله المتحدث في تلك التسجيلات، لا مصدر مستقل على الوقائع التاريخية."
  en: "The archive of Amr Khaled's recorded lessons on the Assabile website: 16 series, about 559 lessons by the site's own count. A primary source for what the speaker says in those recordings, not independent corroboration of historical events."
  ur: "Assabile ویب سائٹ پر عمرو خالد کے ریکارڈ شدہ دروس کا آرکائیو: سائٹ کے اپنے شمار کے مطابق 16 سلسلے، تقریباً 559 اسباق۔ یہ ماخذ اس بات کا اولین ثبوت ہے کہ مقرر ان ریکارڈنگز میں کیا کہتا ہے، تاریخی واقعات کی آزاد تصدیق نہیں۔"
  es: "El archivo de las lecciones grabadas de Amr Khaled en el sitio web de Assabile contiene 16 series y aproximadamente 559 lecciones, según el propio sitio. Se trata de una fuente primaria de lo que dice el orador en esas grabaciones, pero no una corroboración independiente de los hechos históricos."
  fr: "Les archives des leçons enregistrées d'Amr Khaled sur le site web Assabile: 16 séries, soit environ 559 leçons selon le décompte du site. Il s'agit d'une source primaire relatant les propos de l'orateur dans ces enregistrements, et non d'une corroboration indépendante des événements historiques."
  tr: "Asabile web sitesindeki Amr Khaled'in kaydedilmiş derslerinin arşivi, sitenin sayfasına göre yaklaşık 559 dersten oluşan 16 seriyi içermektedir. Bu kayıtlarda konuşmacının söylediklerine dair birincil kaynak, tarihsel gerçekler hakkında bağımsız bir kaynak değil."
  id: "Arsip pelajaran Amr Khaled yang direkam di situs web Asabile, yang mencakup 16 seri yang mencakup sekitar 559 pelajaran menurut halaman situs. Sumber utama untuk apa yang dikatakan pembicara dalam rekaman tersebut, bukan sumber independen tentang fakta sejarah."
