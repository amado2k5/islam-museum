summary:
  ar: "مقالة ويكيبيديا الأردية عن حكيم غلام نبي؛ تُستخدم لوقائع الكيان فقط. مقالة كاملة النسب تعطي وفاته في لاهور في 2 آب 1916، ومولده في قرية آوان قرب أجناله في مقاطعة أمريتسار، وتعليمه وعيادته في لاهور ومجملته الطبية ونحو أربعين كتابا له، وصداقته بمحمد إقبال، وتستشهد بمصادر مطبوعة منها كتاب غيان تشاند جين عن إقبال ومسح مجلة نقوش للأطباء (1962)."
  en: "Urdu Wikipedia article on Hakim Ghulam Nabi; used for entity facts only. A fully referenced article giving his death at Lahore on 2 August 1916, his birth in the village of Awan near Ajnala in Amritsar district, his education, his Lahore clinic and medical journal, his roughly forty books, and his friendship with Muhammad Iqbal, citing printed sources including Gyan Chand Jain's work on Iqbal and a 1962 Nuqoosh magazine survey of physicians."
  es: "Artículo de Wikipedia en urdu sobre Hakim Ghulam Nabi; utilizado únicamente para datos sobre la persona. Un artículo con referencias completas que detalla su fallecimiento en Lahore el 2 de agosto de 1916, su nacimiento en la aldea de Awan, cerca de Ajnala, en el distrito de Amritsar, su educación, su clínica y revista médica en Lahore, sus aproximadamente cuarenta libros y su amistad con Muhammad Iqbal, citando fuentes impresas, incluyendo la obra de Gyan Chand Jain sobre Iqbal y una encuesta de médicos realizada en 1962 por la revista Nuqoosh."
  fr: "Article de Wikipédia en ourdou sur Hakim Ghulam Nabi; utilisé uniquement pour les informations factuelles. Cet article, dûment référencé, relate son décès à Lahore le 2 août 1916, sa naissance dans le village d'Awan près d'Ajnala, dans le district d'Amritsar, ses études, sa clinique et sa revue médicale à Lahore, la quarantaine d'ouvrages qu'il a publiés, ainsi que son amitié avec Muhammad Iqbal. Il cite des sources imprimées, notamment l'ouvrage de Gyan Chand Jain sur Iqbal et une enquête menée auprès de médecins par le magazine Nuqoosh en 1962."
