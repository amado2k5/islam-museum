summary:
  ar: "مقالة ويكيبيديا الأردية عن حكيم غلام نبي؛ تُستخدم لوقائع الكيان فقط. مقالة كاملة النسب تعطي وفاته في لاهور في 2 آب 1916، ومولده في قرية آوان قرب أجناله في مقاطعة أمريتسار، وتعليمه وعيادته في لاهور ومجملته الطبية ونحو أربعين كتابا له، وصداقته بمحمد إقبال، وتستشهد بمصادر مطبوعة منها كتاب غيان تشاند جين عن إقبال ومسح مجلة نقوش للأطباء (1962)."
  en: "Urdu Wikipedia article on Hakim Ghulam Nabi; used for entity facts only. A fully referenced article giving his death at Lahore on 2 August 1916, his birth in the village of Awan near Ajnala in Amritsar district, his education, his Lahore clinic and medical journal, his roughly forty books, and his friendship with Muhammad Iqbal, citing printed sources including Gyan Chand Jain's work on Iqbal and a 1962 Nuqoosh magazine survey of physicians."
