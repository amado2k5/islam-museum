summary:
  ar: "مقالة ويكيبيديا العربية عن آدم مالك (1917–1984)؛ تُستخدم لوقائع الكيان فقط. موجز يذكر مولده في سومطرة وعمله بالصحافة وتأسيسه وكالة الأنباء الإندونيسية ومناصبه السياسية والدبلوماسية."
  en: "Arabic Wikipedia article on Adam Malik (1917–1984); used for entity facts only. A short article giving his birth in Sumatra, his journalism, his founding of the Indonesian news agency and his political and diplomatic offices."
  es: "Artículo en árabe de la Wikipedia sobre Adam Malik (1917-1984); utilizado únicamente para datos biográficos. Un breve artículo que describe su nacimiento en Sumatra, su trayectoria periodística, la fundación de la agencia de noticias indonesia y sus cargos políticos y diplomáticos."
  fr: "Article de Wikipédia en arabe sur Adam Malik (1917-1984); utilisé uniquement à des fins d’information sur l’entité. Ce court article retrace sa naissance à Sumatra, sa carrière de journaliste, la fondation de l’agence de presse indonésienne et ses fonctions politiques et diplomatiques."
  ur: "آدم ملک پر عربی ویکیپیڈیا مضمون (1917–1984)؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ سماٹرا میں اس کی پیدائش، اس کی صحافت، انڈونیشیائی نیوز ایجنسی کی اس کی بنیاد اور اس کے سیاسی اور سفارتی دفاتر کا ایک مختصر مضمون۔"
  tr: "Adam Malik (1917–1984) hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Sumatra'daki doğumu, gazetecilik çalışmaları, Endonezya Haber Ajansı'nı kurması ve siyasi ile diplomatik pozisyonları hakkında kısa bir bilgi vardır."
  id: "Artikel Wikipedia Arab tentang Adam Malik (1917–1984); hanya digunakan untuk fakta entitas. Sebuah ringkasan yang menyebutkan kelahirannya di Sumatra, pekerjaannya di bidang jurnalisme, pendirian Badan Berita Indonesia, serta posisi politik dan diplomatiknya."
