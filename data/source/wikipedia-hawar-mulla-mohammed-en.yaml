summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هوار ملا محمد؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل وميلاده في 1 يونيو 1981 في الموصل، ومسيرته جناحاً مع أندية في العراق ولبنان وقبرص والإمارات وقطر وإيران، ومبارياته الـ113 وأهدافه الـ20 مع العراق، واعتزاله في 11 يونيو 2015. ولا تذكر ديانته."
  en: "English Wikipedia article on Hawar Mulla Mohammed; used for entity facts only. It gives his full name, his birth on 1 June 1981 in Mosul, his career as a winger for clubs in Iraq, Lebanon, Cyprus, the Emirates, Qatar and Iran, his 113 Iraq caps and 20 goals, and his retirement on 11 June 2015. It makes no statement about his religion."
  es: "Artículo de la Wikipedia en inglés sobre Hawar Mulla Mohammed; utilizado únicamente para obtener información sobre la persona. En él se indica su nombre completo, su fecha de nacimiento (1 de junio de 1981) en Mosul, su trayectoria como extremo en clubes de Irak, Líbano, Chipre, Emiratos Árabes Unidos, Catar e Irán, sus 113 partidos con la selección de Irak y 20 goles, y su retirada el 11 de junio de 2015. No se menciona su religión."
  fr: "Article Wikipédia en anglais sur Hawar Mulla Mohammed; utilisé uniquement à des fins d'information sur l'entité. Il mentionne son nom complet, sa date de naissance (1er juin 1981) à Mossoul, sa carrière d'ailier dans des clubs d'Irak, du Liban, de Chypre, des Émirats arabes unis, du Qatar et d'Iran, ses 113 sélections en équipe nationale d'Irak et ses 20 buts, ainsi que sa retraite le 11 juin 2015. Aucune information n'est fournie concernant sa religion."
  ur: "حوار ملا محمد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کا پورا نام، ان کی پیدائش 1 جون 1981 کو موصل میں، عراق، لبنان، قبرص، امارات، قطر اور ایران کے کلبوں کے لیے بطور ونگر کیریئر، اس کے 113 عراق کیپس اور 20 گول، اور 11 جون 2015 کو اس کی ریٹائرمنٹ بتائی گئی ہے۔ اس میں اس کے مذہب کے بارے میں کوئی بیان نہیں دیا گیا ہے۔"
