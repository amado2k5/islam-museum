  ar: "مقالة ويكيبيديا الإنجليزية عن هوار ملا محمد؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل وميلاده في 1 يونيو 1981 في الموصل، ومسيرته جناحاً مع أندية في العراق ولبنان وقبرص والإمارات وقطر وإيران، ومبارياته الـ113 وأهدافه الـ20 مع العراق، واعتزاله في 11 يونيو 2015. ولا تذكر ديانته."
  en: "English Wikipedia article on Hawar Mulla Mohammed; used for entity facts only. It gives his full name, his birth on 1 June 1981 in Mosul, his career as a winger for clubs in Iraq, Lebanon, Cyprus, the Emirates, Qatar and Iran, his 113 Iraq caps and 20 goals, and his retirement on 11 June 2015. It makes no statement about his religion."
