summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بير مهر علي شاه (1859–1937)، وتنص في متنها على أنه عالم صوفي بنجابي من الطريقة الجشتية عُرف بكونه عالمًا حنفيًا، وأنه كان تلميذ خواجة شمس الدين السيالوي وخليفته في السلسلة الجشتية النظامية، وأنه قاد الحركة المناهضة للأحمدية وألّف «سيف جشتيائي»، وتوفي في 11 أيار 1937."
  en: "The English Wikipedia article on Pir Meher Ali Shah (1859–1937), which states in its text that he was a Punjabi Sufi scholar of the Chishti order known as a Hanafi scholar, that he was a disciple and khalifa of Khawaja Shams-ud-din Sialvi in the Silsila-e-Chishtia Nizamiyah, that he led the anti-Ahmadiyya movement and wrote Saif-e-Chishtiyai, and that he died on 11 May 1937."
  es: "El artículo de la Wikipedia en inglés sobre Pir Meher Ali Shah (1859-1937), que afirma en su texto que fue un erudito sufí punjabí de la orden Chishti conocido como erudito hanafi, que fue discípulo y califa de Khawaja Shams-ud-din Sialvi en la Silsila-e-Chishtia Nizamiyah, que lideró el movimiento anti-Ahmadiyya y escribió Saif-e-Chishtiyai, y que murió el 11 de mayo de 1937."
  fr: "L'article de Wikipédia en anglais sur Pir Meher Ali Shah (1859-1937) indique dans son texte qu'il était un érudit soufi punjabi de l'ordre Chishti connu comme un érudit hanafite, qu'il était un disciple et un khalifa de Khawaja Shams-ud-din Sialvi dans la Silsila-e-Chishtia Nizamiyah, qu'il a dirigé le mouvement anti-Ahmadiyya et a écrit Saif-e-Chishtiyai, et qu'il est mort le 11 mai 1937."
  ur: "پیر مہر علی شاہ (1859–1937) پر انگریزی ویکیپیڈیا کا مضمون، جس کے متن میں کہا گیا ہے کہ وہ چشتی حکم کے ایک پنجابی صوفی عالم تھے جنہیں حنفی عالم کہا جاتا ہے، کہ وہ سلسلۂ چشتیہ نظامیہ میں خواجہ شمس الدین سیالوی کے شاگرد اور خلیفہ تھے، انہوں نے تحریک چشتیہ میں تحریک مخالف تحریک لکھی۔ سیف چشتی اور ان کا انتقال 11 مئی 1937 کو ہوا۔"
