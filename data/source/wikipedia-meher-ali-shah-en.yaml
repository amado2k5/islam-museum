summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بير مهر علي شاه (1859–1937)، وتنص في متنها على أنه عالم صوفي بنجابي من الطريقة الجشتية عُرف بكونه عالمًا حنفيًا، وأنه كان تلميذ خواجة شمس الدين السيالوي وخليفته في السلسلة الجشتية النظامية، وأنه قاد الحركة المناهضة للأحمدية وألّف «سيف جشتيائي»، وتوفي في 11 أيار 1937."
  en: "The English Wikipedia article on Pir Meher Ali Shah (1859–1937), which states in its text that he was a Punjabi Sufi scholar of the Chishti order known as a Hanafi scholar, that he was a disciple and khalifa of Khawaja Shams-ud-din Sialvi in the Silsila-e-Chishtia Nizamiyah, that he led the anti-Ahmadiyya movement and wrote Saif-e-Chishtiyai, and that he died on 11 May 1937."
