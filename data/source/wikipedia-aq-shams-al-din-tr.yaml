summary:
  ar: "مقالة ويكيبيديا التركية عن آق شمس الدين، مراجعة 5 تشرين الأول 2026؛ أغنى مقالات الويكيبيديا عنه: نشأته وتعليمه في أماسيا وعثمانجق، وبحثه عن مرشد وانتسابه إلى حاجي بيرام ولي وأخذه الإجازة وتاج الخلافة منه، واستقراره في بيبازاري وإسقليب وغوينوك، ودوره في فتح القسطنطينية ووفاته فيها."
  en: "Turkish Wikipedia article on Akşemseddin, revision of 5 October 2026; the fullest of the Wikipedia articles — his upbringing and education at Amasya and Osmancik, his search for a master, his discipleship under Haci Bayram Veli from whom he received the icazet and the crown of khilafa, his settlements at Beypazari, Iskilip and Goynuk, his part in the conquest of Constantinople and his death at Goynuk."
  es: "Artículo de la Wikipedia en turco sobre Akşemseddin, revisión del 5 de octubre de 2026; el más completo de los artículos de Wikipedia: su crianza y educación en Amasya y Osmancik, su búsqueda de un maestro, su discipulado con Haci Bayram Veli, de quien recibió el icazet y la corona del califato, sus asentamientos en Beypazari, Iskilip y Goynuk, su participación en la conquista de Constantinopla y su muerte en Goynuk."
  fr: "Article de Wikipédia en turc sur Akşemseddin, révision du 5 octobre 2026; l'article le plus complet de Wikipédia — son éducation à Amasya et Osmancik, sa recherche d'un maître, son enseignement auprès de Haci Bayram Veli dont il reçut l'icazet et la couronne de khilafa, ses établissements à Beypazari, Iskilip et Goynuk, son rôle dans la conquête de Constantinople et sa mort à Goynuk."
  ur: "Akşemseddin پر ترکی ویکیپیڈیا مضمون، 5 اکتوبر 2026 کی نظرثانی؛ ویکیپیڈیا کے مضامین کا مکمل حصہ - اماسیا اور عثمانک میں اس کی پرورش اور تعلیم، اس کی ایک استاد کی تلاش، ہاکی بیرام ویلی کے تحت اس کی شاگردی جس سے اس نے تخت اور خلافت کا تاج حاصل کیا، بیپزاری میں اس کی بستیاں، اسکیلیپ اور گوینک، اس کی فتح اور موت کے وقت گوینک کی فتح میں اس کا حصہ۔"
  tr: "Aq Şemseddin hakkında Türkçe Vikipedi makalesi, revizyon 5 Ekim 2026; hakkında en zengin Vikipedi makaleleri şunlardır: Amasya ve Osmanc'ta yetiştirilmesi ve eğitimi, rehber arayışı, Hacı Bayram Wali ile ilişkisi, ondan icaze ve halifelik tacını alması, Bepazarı, Eskleb ve Güünük'te yerleşimi, Konstantinopolis'in fethindeki rolü ve orada ölümü."
  id: "Artikel Wikipedia Turki tentang Aq Shams al-Din, revisi 5 Oktober 2026; artikel Wikipedia terkaya tentang dirinya adalah: masa kecil dan pendidikannya di Amasya dan Osmanc, pencariannya akan pemandu, afiliasinya dengan Hacı Bayram Wali, perolehan ijazah dan mahkota kekhalifahan darinya, pemukimannya di Bepazarı, Eskleb, dan Güünük, perannya dalam penaklukan Konstantinopel, dan kematiannya di sana."
