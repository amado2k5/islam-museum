reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The article rests on Taskopruluzade's Shaqaiq al-Numaniyya, Enisi's Menakib-i Aksemseddin and Semseddin Sami's Kamus al-Alam; its narrative of the discipleship — the strict training under Haci Bayram, the icazet and the conferral of the khilafa crown — corroborates the TDV encyclopedia within the same Turkish tradition. Hagiographic reports it carries (such as the dream of the chain) are presented in the museum's prose as reports, not facts. Its infobox religion field is blank. Read live on 1 November 2026; the article's own page property grounds Wikidata item Q353068."
