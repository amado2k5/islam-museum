summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد رفعت؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بالقاهرة في 9 مايو 1882 ووفاته بها في 9 مايو 1950، وافتتاحه بث الإذاعة المصرية سنة 1934، وقراءته بمسجد فاضل باشا من 1918، وتوقف صوته لمرض الحنجرة سنة 1943، ودفنه بجوار مسجد السيدة نفيسة؛ وصندوقها يعطي الدين الإسلام والمذهب سني، ويصف نصها في قسم حياته الشخصية بأنه من أتباع الطريقة النقشبندية الصوفية."
  en: "English Wikipedia article on Muhammad Rifat; used for entity facts only. It gives his birth at Cairo on 9 May 1882 and death there on 9 May 1950, his opening of Egyptian Radio's broadcasts in 1934, his recitation at Fadil Pasha Mosque from 1918, the throat illness that stopped his public recitation in 1943, and his burial near the Sayyida Nafisa Mosque; its infobox gives religion Islam and denomination Sunni, and its Personal life text describes him as a follower of the Naqshbandi Sufi tradition, citing Ahram Online."
