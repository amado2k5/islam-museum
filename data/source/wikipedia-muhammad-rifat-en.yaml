summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد رفعت؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بالقاهرة في 9 مايو 1882 ووفاته بها في 9 مايو 1950، وافتتاحه بث الإذاعة المصرية سنة 1934، وقراءته بمسجد فاضل باشا من 1918، وتوقف صوته لمرض الحنجرة سنة 1943، ودفنه بجوار مسجد السيدة نفيسة؛ وصندوقها يعطي الدين الإسلام والمذهب سني، ويصف نصها في قسم حياته الشخصية بأنه من أتباع الطريقة النقشبندية الصوفية."
  en: "English Wikipedia article on Muhammad Rifat; used for entity facts only. It gives his birth at Cairo on 9 May 1882 and death there on 9 May 1950, his opening of Egyptian Radio's broadcasts in 1934, his recitation at Fadil Pasha Mosque from 1918, the throat illness that stopped his public recitation in 1943, and his burial near the Sayyida Nafisa Mosque; its infobox gives religion Islam and denomination Sunni, and its Personal life text describes him as a follower of the Naqshbandi Sufi tradition, citing Ahram Online."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad Rifat; utilizado únicamente para datos sobre la persona. Indica su nacimiento en El Cairo el 9 de mayo de 1882 y su fallecimiento allí el 9 de mayo de 1950, la inauguración de las emisiones de la Radio Egipcia en 1934, sus recitaciones en la Mezquita Fadil Pasha desde 1918, la enfermedad de garganta que le impidió recitar en público en 1943 y su entierro cerca de la Mezquita Sayyida Nafisa; su ficha informativa indica que su religión era el Islam y su denominación Suní, y su texto sobre su vida personal lo describe como seguidor de la tradición sufí Naqshbandi, citando a Ahram Online."
  fr: "Article de Wikipédia en anglais sur Muhammad Rifat; utilisé uniquement pour les informations biographiques. Il indique sa naissance au Caire le 9 mai 1882 et son décès dans la même ville le 9 mai 1950, l’inauguration des émissions de la radio égyptienne en 1934, ses récitations à la mosquée Fadil Pacha à partir de 1918, la maladie de la gorge qui interrompit ses récitations publiques en 1943, et son inhumation près de la mosquée Sayyida Nafisa; son infobox précise qu’il est musulman et sunnite, et la section « Vie personnelle » le décrit comme un adepte de la tradition soufie Naqshbandi, d’après Ahram Online."
  ur: "محمد رفعت پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 9 مئی 1882 کو قاہرہ میں ان کی پیدائش اور 9 مئی 1950 کو وہیں موت، 1934 میں مصری ریڈیو کی نشریات کا آغاز، 1918 سے فضیل پاشا مسجد میں ان کی تلاوت، گلے کی بیماری جس نے 1943 میں ان کی عوامی تلاوت بند کر دی، اور سیدہ نفیسہ کے قریب ان کی تدفین۔ اس کا انفو باکس مذہب اسلام اور فرقہ سنی دیتا ہے، اور اس کی ذاتی زندگی کا متن احرام آن لائن کا حوالہ دیتے ہوئے اسے نقشبندی صوفی روایت کے پیروکار کے طور پر بیان کرتا ہے۔"
