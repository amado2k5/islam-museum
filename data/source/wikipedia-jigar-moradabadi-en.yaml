  fr: "Article de Wikipédia en anglais sur Jigar Moradabadi; utilisé uniquement pour les informations le concernant. Il mentionne sa naissance à Moradabad sous le nom d’Ali Sikandar, son décès à Gonda en 1960 et le prix Sahitya Akademi pour Atish-e-Gul, sans faire mention de sa religion."
  ur: "جگر مرادآبادی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں مراد آباد میں علی سکندر کے طور پر ان کی پیدائش، 1960 میں گونڈا میں ان کی موت اور آتش گل کے لیے ساہتیہ اکادمی ایوارڈ درج ہے، اور اس کے متن میں ان کے مذہب کا کوئی بیان نہیں ہے۔"
