reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id with the returned id asserted equal. It gives him born 6 April 1890 at Moradabad and died 9 September 1960 at Gonda, citing Amaresh Datta's Encyclopaedia of Indian Literature (Sahitya Akademi, 1988) and Rekhta; it notes his friendship with Asghar Gondvi at Gonda and his mentorship of Majrooh Sultanpuri. Its lead gives his name as Ali Sikandar while its infobox birth name reverses it as 'Sikander Ali'; the record follows the lead. No religion is stated."
