  ar: "مقالة ويكيبيديا الإنجليزية عن جگر مراد آبادي؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في مراد آباد باسم علي سكندر ووفاته في گوندا سنة 1960 وجائزة ساهيتيا أكادمي عن «آتش گل»، دون أي ذكر لدينه في متنها."
  en: "English Wikipedia article on Jigar Moradabadi; used for entity facts only. It records his birth at Moradabad as Ali Sikandar, his death at Gonda in 1960 and the Sahitya Akademi Award for Atish-e-Gul, and makes no statement of his religion in its text."
