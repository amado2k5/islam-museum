summary:
  ar: "خبر من موقع Srpske.rs ⁦(14 أغسطس 2026)⁩ عن احتجاز شرطة كوسوفو للداعية إلفدين بيزيتش في فيتوميريتسا قبل محاضرة مقررة له؛ يذكر الخبر أن صفحته الرسمية على فيسبوك يتابعها أكثر من 372 ألف شخص ويصفه بأنه من أشهر الدعاة السلفيين في المنطقة."
  en: "Srpske.rs news report (14 August 2026) on Kosovo Police detaining the preacher Elvedin Pezić in Vitomirica ahead of a scheduled lecture; the report gives his official Facebook page at over 372,000 followers and describes him as one of the best-known Salafist preachers in the region."
  es: "Según un reportaje del portal Srpske.rs (14 de agosto de 2026), la policía de Kosovo detuvo al predicador Elvedin Pezić en Vitomirica antes de una conferencia programada; el reportaje indica que su página oficial de Facebook tiene más de 372.000 seguidores y lo describe como uno de los predicadores salafistas más conocidos de la región."
  fr: "Article de Srpske.rs (14 août 2026) sur l'arrestation par la police du Kosovo du prédicateur Elvedin Pezić à Vitomirica avant une conférence prévue; l'article indique que sa page Facebook officielle compte plus de 372 000 abonnés et le décrit comme l'un des prédicateurs salafistes les plus connus de la région."
  ur: "Srpske.rs کی نیوز رپورٹ ⁦(14 اگست 2026)⁩ کوسوو پولیس نے ایک مقررہ لیکچر سے قبل وٹومیریکا میں مبلغ ایلویڈن پیزیک کو حراست میں لے لیا؛ رپورٹ میں اس کا آفیشل فیس بک پیج 372,000 سے زیادہ فالوورز پر مشتمل ہے اور اسے خطے کے مشہور سلفی مبلغین میں سے ایک کے طور پر بیان کیا گیا ہے۔"
  tr: "Srpske.rs web sitesinden (14 Ağustos 2026) Kosova polisinin vaiz Elvedin Bizić'i planlanan bir konferans öncesinde Vitomirica'da gözaltına aldığına dair haberler; rapor, resmi Facebook sayfasının 372.000'den fazla kişinin takip ettiğini ve onu bölgedeki en ünlü Selefi vaizlerden biri olarak tanımladığını belirtiyor."
  id: "Berita dari situs web Srpske.rs (14 Agustus 2026) tentang polisi Kosovo yang menahan pengkhotbah Elvedin Bizić di Vitomirica sebelum kuliah yang dijadwalkan; laporan tersebut menyebutkan bahwa halaman Facebook resminya diikuti oleh lebih dari 372.000 orang dan menggambarkannya sebagai salah satu pengkhotbah Salafi paling terkenal di wilayah tersebut."
