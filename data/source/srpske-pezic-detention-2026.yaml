reliability_note: "News report read in full on 4 November 2026. It states that Kosovo Police detained Pezić on 13 August 2026 in Vitomirica near Peć, hours before a lecture and book promotion in Dobruša (Istok municipality) where he was to appear with Mithad Çeman; that the stated reason was an allegation of spreading Wahhabi ideology; and that no official statement or known outcome existed as of publication. The detention is therefore recorded as a reported allegation, not as a finding. The report's description of him as a 'Salafist preacher' is a movement descriptor in news prose, not a self-attestation of a school, and was not used to settle faith; its Facebook figure (over 372,000 followers) is the report's own dated figure."
