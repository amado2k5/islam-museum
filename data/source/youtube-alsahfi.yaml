summary:
  ar: "قناة الداعية السعودي نايف الصحفي على يوتيوب؛ تحمل سلسلاته ومقاطعه الدعوية القصيرة الموجهة إلى الشباب، ومنها «قصة آية» وتمثيليات «فوانيس»، وتربط حساباته على إنستغرام وتويتر وفيسبوك."
  en: "The Saudi preacher Nayef Al-Sahfi's YouTube channel; it carries his series and short dawah clips aimed at young people, among them 'Qissat Aya' (Story of a Verse) and the 'Fawanis' sketches, and links his Instagram, Twitter and Facebook accounts."
  es: "El canal de YouTube del predicador saudí Nayef Al-Sahfi contiene su serie y breves vídeos de prédica dirigidos a los jóvenes, entre ellos 'Qissat Aya' (Historia de un versículo) y los sketches 'Fawanis', y enlaza con sus cuentas de Instagram, Twitter y Facebook."
  fr: "La chaîne YouTube du prédicateur saoudien Nayef Al-Sahfi diffuse ses séries et ses courts clips de da'wa destinés aux jeunes, parmi lesquels « Qissat Aya » (Histoire d'un verset) et les sketches « Fawanis », et renvoie vers ses comptes Instagram, Twitter et Facebook."
  ur: "سعودی مبلغ نائف الصحفی کا یوٹیوب چینل؛ اس میں اس کی سیریز اور چھوٹے دعوے کے کلپس ہیں جن کا مقصد نوجوانوں کو ہے، ان میں 'قصت آیا' ⁦(ایک آیت کی کہانی)⁩ اور 'فوانی' خاکے، اور اس کے انسٹاگرام، ٹویٹر اور فیس بک اکاؤنٹس کو لنک کرتے ہیں۔"
