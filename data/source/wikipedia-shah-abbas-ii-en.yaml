reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A long article resting chiefly on Rudi Matthee's scholarship and on the Abbas-nama of Mohammad Taher Vahid Qazvini. It gives his birth at Qazvin on 30 August 1632, on a Dutch East India Company report, and his death on 26 October 1666 in its lead and death section — though its reign narrative once gives 25 September 1666 instead, and its death section places the death at Behshahr against the Damghan reading of the Arabic and Persian articles and of Wikidata; both rival readings are preserved in the person record. Its Religion section attests his Shi'ia practice in detail — the commissioned Persian translations of Shi'ia jurisprudence, his consultation of the ulama, his friendly relations with Fayz Kashani, Sabzevari and Mohammad Taqi Majlesi, his respect for the Safaviyya order and his temporary abstinence from wine under a Shi'ia scholar's persuasion — with the caveat that he was not a zealous Shiite; it is one of the two characterisations preserved in the person record's flagged unknown. Checked 1 November 2026."
