reliability_note: "Read in the museum's session on 20 November 2026. It says the author states that the book was compiled from the main works written before his time to ease the way for students, and is arranged alphabetically; that it holds the main terms of tafsir, hadith, fiqh, kalam, Sufism, Arabic language and literature, philosophy, logic, mathematics, astronomy and medicine, giving the dictionary meaning and then the definitions in different sciences; that the definitions are terse, with some in Sufism and philosophy left obscure; and names among the authorities Sibawayh, al-Kisa'i, al-Farra', Abu Hanifa, Abu Yusuf, al-Shafi'i, Ibn al-Arabi, Abu Talib al-Makki and al-Qushayri. Used for entity facts only."
