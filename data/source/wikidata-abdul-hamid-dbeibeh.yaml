summary:
  ar: "عنصر ويكي بيانات Q105319569 لعبد الحميد الدبيبة؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته في 13 فبراير 1959 في مصراتة ودينه الإسلام عمومًا دون مذهب. وثُبّت العنصر عبر خصائص صفحتَي المقالتين العربية والأردية وروابطه اللغوية؛ فالمقالة الإنجليزية بالاسم نفسه غير مربوطة به ورابطه الإنجليزي هو مقالة «Abdul Hamid AL Dabiba»."
  en: "Wikidata item Q105319569 for Abdul Hamid Dbeibeh; used for entity facts only. It gives his birth as 13 February 1959 at Misrata and his religion as Islam (generic), with no school value. The item is grounded through the Arabic and Urdu articles' pageprops and its own sitelinks; the English article of the same name is not sitelinked to it (its English sitelink is the article 'Abdul Hamid AL Dabiba')."
  es: "Elemento de Wikidata Q105319569 para Abdul Hamid Dbeibeh; se utiliza únicamente para datos de la entidad. Indica que nació el 13 de febrero de 1959 en Misrata y que su religión es el Islam (genérico), sin información sobre su escuela. El elemento se basa en las propiedades de página de los artículos en árabe y urdu y en sus propios enlaces de sitio; el artículo en inglés del mismo nombre no está enlazado a este (su enlace de sitio en inglés es el artículo 'Abdul Hamid AL Dabiba')."
  fr: "L'élément Wikidata Q105319569 concerne Abdul Hamid Dbeibeh; il est utilisé uniquement pour les informations sur l'entité. Il indique sa date de naissance, le 13 février 1959, à Misrata, et sa religion comme étant l'islam (générique), sans mention d'établissement scolaire. Cet élément est ancré dans les articles arabe et ourdou via leurs propriétés de page et ses propres liens hypertextes; l'article anglais du même nom n'y est pas lié (son lien hypertexte anglais renvoie à l'article « Abdul Hamid AL Dabiba »)."
  ur: "ویکی ڈیٹا آئٹم Q105319569 برائے عبدالحمید دبیبہ؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش 13 فروری 1959 کو مصراتہ میں اور اس کا مذہب اسلام ⁦(عام)⁩ کے طور پر دیتا ہے، جس کی کوئی اسکولی قیمت نہیں ہے۔ اس آئٹم کو عربی اور اردو مضامین کے پیج پروپس اور اس کے اپنے سائٹ لنکس کے ذریعے بنیاد بنایا گیا ہے۔ اسی نام کا انگریزی مضمون اس سے سائٹ لنک نہیں ہے ⁦(اس کا انگریزی سائٹ لنک مضمون 'عبدالحمید الدبیبہ' ہے)⁩۔"
  tr: "Wikiveri öğesi Q105319569 Abdul Hamid Dbeibeh tarafından; yalnızca varlığın gerçekleri için kullanılmıştır. 13 Şubat 1959'da Misrata'da doğdu ve dini genellikle mezhepsiz İslam'dır. Öğe, Arapça ve Urduca makale sayfalarının özellikleri ve dilsel bağlantıları sayesinde kurulmuştur; aynı adlı İngilizce makale ona bağlı değildir ve İngilizce bağlantısı \"Abdul Hamid AL Dabiba\" makalesidir."
  id: "Elemen Wikidata Q105319569 oleh Abdul Hamid Dbeibeh; digunakan hanya untuk fakta entitas. Ia lahir pada 13 Februari 1959 di Misrata, dan agamanya umumnya adalah Islam tanpa sekte. Elemen ini ditetapkan melalui properti halaman artikel Arab dan Urdu serta tautan linguistiknya; artikel berbahasa Inggris dengan nama yang sama tidak terhubung dengannya, dan tautan bahasa Inggrisnya adalah artikel \"Abdul Hamid AL Dabiba.\""
