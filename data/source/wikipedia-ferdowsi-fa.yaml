summary:
  ar: "مقالة ويكيبيديا الفارسية عن أراش فردوسي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 7 أكتوبر 1985 في أوفرلاند بارك بولاية كانساس، وأصل عائلته من قرية باويل في أذربيجان الشرقية، وشراكته في تأسيس دروبوكس وإدارته التقنية حتى 2016. لا تذكر دينه."
  en: "Persian Wikipedia article on Arash Ferdowsi; used for entity facts only. It gives his birth as 7 October 1985 at Overland Park, Kansas, his family's origin in the village of Bavil in East Azerbaijan, and his Dropbox co-founding and CTO tenure until 2016. It makes no statement of his religion."
  es: "Artículo de Wikipedia en persa sobre Arash Ferdowsi; utilizado únicamente para datos biográficos. Indica que nació el 7 de octubre de 1985 en Overland Park, Kansas, que su familia es originaria del pueblo de Bavil, en Azerbaiyán Oriental, y que fue cofundador de Dropbox y director de tecnología hasta 2016. No menciona su religión."
  fr: "Article Wikipédia en persan sur Arash Ferdowsi; utilisé uniquement pour les informations relatives à l'entité. Il indique sa date de naissance, le 7 octobre 1985, à Overland Park, au Kansas, l'origine de sa famille dans le village de Bavil, en Azerbaïdjan oriental, et son rôle de cofondateur et de directeur technique de Dropbox jusqu'en 2016. Aucune mention n'est faite de sa religion."
  ur: "آرش فردوسی پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 7 اکتوبر 1985 کو اوورلینڈ پارک، کنساس میں اس کی پیدائش ہے، اس کے خاندان کی اصل مشرقی آذربائیجان کے گاؤں باول میں ہے، اور اس کے ڈراپ باکس کے شریک بانی اور CTO کی مدت 2016 تک ہے۔ اس میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Arash Ferdowsi hakkında Farsça Vikipedi makalesi; yalnızca varlık bilgileri için kullanılır. 7 Ekim 1985'te Kansas, Overland Park'ta doğdu, ailesi Doğu Azerbaycan'daki Pawell köyünden geliyor ve 2016'ya kadar Dropbox'un kuruculuğu ve yönetiminde ortaklık kurdu. Dini belirtilmemiştir."
  id: "Artikel Wikipedia Persia tentang Arash Ferdowsi; hanya digunakan untuk fakta entitas. Ia lahir pada 7 Oktober 1985 di Overland Park, Kansas, dengan asal keluarga dari desa Pawell di Azerbaijan Timur, dan kemitraannya dalam mendirikan serta mengelola Dropbox hingga tahun 2016. Agamanya tidak disebutkan."
