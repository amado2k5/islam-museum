summary:
  ar: "الصفحة «عبد الرحمن حبنكة الميداني» — Wikipedia (Arabic)؛ لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: كتاب «al-Balagha al-Arabiyya: Ususuha wa-Ulumuha wa-Fununuha» ومؤلفه وتاريخه."
  en: "The page «عبد الرحمن حبنكة الميداني» — Wikipedia (Arabic); summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the book «al-Balagha al-Arabiyya: Ususuha wa-Ulumuha wa-Fununuha»: its author and date."
  ur: "صفحہ «عبد الرحمن حبنكة الميداني» — Wikipedia (Arabic)؛ اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: کتاب «al-Balagha al-Arabiyya: Ususuha wa-Ulumuha wa-Fununuha»، اس کے مصنف اور تاریخ کا بیان۔"
  fr: "La page «عبد الرحمن حبنكة الميداني» — Wikipedia (Arabic) ; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : le livre « al-Balagha al-Arabiyya: Ususuha wa-Ulumuha wa-Fununuha » : son auteur et sa date."
  es: "La página «عبد الرحمن حبنكة الميداني» — Wikipedia (Arabic); resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: el libro «al-Balagha al-Arabiyya: Ususuha wa-Ulumuha wa-Fununuha»: su autor y su fecha."
  tr: "\"Abdulrahman Habanka Al-Midani\" sayfası — Wikipedia (Arapça); kurucusunun 21 Kasım 2026'da müzeye sunduğu bir araştırma özetiyle özetlenmiştir; müze sayfayı açmamış ve kurucu özeti yeniden doğrulama yapmadan kullanmayı kabul etmiştir. Kullanıldığı bölümler: \"al-Balagha al-Arabiyya: Ususuha wa-Ulumuha wa-Fununuha\" adlı kitap, yazarı ve tarihçesi."
  id: "Halaman \"Abdulrahman Habanka Al-Midani\" — Wikipedia (Arab); dirangkum oleh ringkasan penelitian yang diajukan oleh pendiri ke museum pada 21 November 2026; museum tidak membuka halaman tersebut, dan pendiri setuju menggunakan ringkasan tanpa verifikasi ulang. Digunakan dalam: buku \"al-Balagha al-Arabiyya: Ususuha wa-Ulumuha wa-Fununuha,\" penulisnya, dan sejarahnya."
