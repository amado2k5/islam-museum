summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن منظمة «يوث كلوب باكستان» الشبابية غير الربحية: تأسست سنة 2011 ومقرها إسلام آباد، وتنظم فعاليات ومؤتمرات دينية وتعليمية وبرامج شبابية، وتسجّل راجا ضياء الحق شخصيتها القيادية ورئيسها التنفيذي."
  en: "The English Wikipedia article on Youth Club Pakistan, a non-profit youth organisation founded in 2011 and headquartered in Islamabad, Pakistan, which organises community events, religious and educational conferences and youth engagement programmes; its infobox names Raja Zia ul Haq as key person and chief executive officer."
  es: "El artículo de la Wikipedia en inglés sobre Youth Club Pakistan, una organización juvenil sin ánimo de lucro fundada en 2011 y con sede en Islamabad, Pakistán, que organiza eventos comunitarios, conferencias religiosas y educativas y programas de participación juvenil, menciona en su ficha informativa a Raja Zia ul Haq como persona clave y director ejecutivo."
  fr: "L'article de Wikipédia en anglais sur Youth Club Pakistan, une organisation de jeunesse à but non lucratif fondée en 2011 et basée à Islamabad, au Pakistan, qui organise des événements communautaires, des conférences religieuses et éducatives et des programmes d'engagement des jeunes; son infobox désigne Raja Zia ul Haq comme personne clé et directeur général."
  ur: "یوتھ کلب پاکستان پر انگریزی ویکیپیڈیا کا مضمون، جو کہ 2011 میں قائم کی گئی اور اس کا صدر دفتر اسلام آباد، پاکستان میں ہے، جو کہ کمیونٹی تقریبات، مذہبی اور تعلیمی کانفرنسوں اور نوجوانوں کی شمولیت کے پروگراموں کا اہتمام کرتا ہے۔ اس کے انفو باکس میں راجہ ضیاء الحق کو کلیدی شخص اور چیف ایگزیکٹو آفیسر کے طور پر نامزد کیا گیا ہے۔"
  tr: "Gençlik kar amacı gütmeyen kuruluş 'Youth Club Pakistan' hakkında İngilizce Wikipedia makalesi: 2011 yılında kurulan ve merkezi İslamabad'da bulunan bu kuruluş, dini ve eğitim etkinlikleri, konferansları ve gençlik programları düzenlemektedir; lider figürü ve CEO'su Raja Zia-ul-Haq'tır."
  id: "Artikel Wikipedia bahasa Inggris tentang organisasi nirlaba pemuda 'Youth Club Pakistan': Didirikan pada tahun 2011 dan berkantor pusat di Islamabad, organisasi ini menyelenggarakan acara dan konferensi keagamaan serta pendidikan serta program pemuda, dengan Raja Zia-ul-Haq sebagai tokoh utama dan CEO."
