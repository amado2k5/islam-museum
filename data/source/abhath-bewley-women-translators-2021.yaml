reliability_note: "Scholarly journal article, read in full in this session. Its section on Aisha Bewley states that she converted to Islam with her husband, Shaykh Abdalhaqq Bewley, in 1968, and continues: 'They belonged to the Maliki School of jurisprudence. They are Sufis. In Sufi tariqah, they follow the Habibiyya branch of the Shadhili Darqawi Tariqah' (its notes 32–34). This is the only source reached that names a legal school or a Sufi order for either Bewley, and it speaks of the couple jointly; it is therefore one scholarly family for both elements, preserved in their records' faith notes but not adopted on its own."
