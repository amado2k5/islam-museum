  ar: الحرية في الإسلام — محمد الخضر حسين
  en: Freedom in Islam — Muhammad al-Khidr Husayn
summary:
  ar: "كتاب الشيخ محمد الخضر حسين ⁦(شيخ الأزهر الأسبق)⁩، ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، يعالج الحرية في الإسلام: معناها اللغوي والاصطلاحي، وقاعدتا المشورة والمساواة، ثم الحرية في الأموال والأعراض والدماء والدين وأثرها في اللغة والأدب؛ 108 صفحة، إشراف أ.د. محيي الدين عفيفي أحمد الأمين العام للمجمع."
  en: "Muhammad al-Khidr Husayn's book (former Shaykh of al-Azhar), in the Scientific Series of the Islamic Research Academy of al-Azhar: the meaning of freedom in Islam, its two foundations of consultation and equality, and then freedom of property, honour, life and religion and its effect on language and literature; 108 pages, supervised by the Academy's Secretary-General."
  es: "El libro de Muhammad al-Khidr Husayn (antiguo jeque de al-Azhar), perteneciente a la Serie Científica de la Academia de Investigación Islámica de al-Azhar, trata sobre el significado de la libertad en el Islam, sus dos fundamentos de consulta e igualdad, y la libertad de propiedad, honor, vida y religión, así como su efecto en la lengua y la literatura. Tiene 108 páginas y fue supervisado por el Secretario General de la Academia."
  fr: "Le livre de Muhammad al-Khidr Husayn (ancien cheikh d'al-Azhar), dans la série scientifique de l'Académie de recherche islamique d'al-Azhar: la signification de la liberté en islam, ses deux fondements de consultation et d'égalité, puis la liberté de propriété, d'honneur, de vie et de religion et son effet sur la langue et la littérature; 108 pages, supervisé par le secrétaire général de l'Académie."
  ur: "محمد الخضر حسین کی کتاب ⁦(سابق شیخ الازہر)⁩، الازہر کی اسلامک ریسرچ اکیڈمی کی سائنسی سیریز میں: اسلام میں آزادی کا مفہوم، اس کی مشاورت اور مساوات کی دو بنیادیں، اور پھر جائیداد، عزت، زندگی اور مذہب کی آزادی اور زبان و ادب پر اس کا اثر؛ اکیڈمی کے سیکرٹری جنرل کی زیر نگرانی 108 صفحات۔"
