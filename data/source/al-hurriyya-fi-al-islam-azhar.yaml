summary:
  ar: "كتاب الشيخ محمد الخضر حسين (شيخ الأزهر الأسبق)، ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، يعالج الحرية في الإسلام: معناها اللغوي والاصطلاحي، وقاعدتا المشورة والمساواة، ثم الحرية في الأموال والأعراض والدماء والدين وأثرها في اللغة والأدب؛ 108 صفحة، إشراف أ.د. محيي الدين عفيفي أحمد الأمين العام للمجمع."
  en: "Muhammad al-Khidr Husayn's book (former Shaykh of al-Azhar), in the Scientific Series of the Islamic Research Academy of al-Azhar: the meaning of freedom in Islam, its two foundations of consultation and equality, and then freedom of property, honour, life and religion and its effect on language and literature; 108 pages, supervised by the Academy's Secretary-General."
