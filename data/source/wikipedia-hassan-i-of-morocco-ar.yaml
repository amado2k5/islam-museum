summary:
  ar: "مقالة ويكيبيديا العربية عن الحسن الأول بن محمد ⁦(ولد بفاس سنة 1836 – توفي ليلة 3 ذي الحجة 1311هـ الموافق 6 يونيو 1894 قرب وادي العبيد بتادلة، نقلاً عن «الاستقصا» للناصري)⁩؛ تسرد نسبه العلوي وجهوده في المركزة وتحديث الجيش وصد الأطماع الأوروبية."
  en: "The Arabic Wikipedia article on Hassan I of Morocco (born at Fez in 1836; died on the night of 3 Dhu al-Hijja 1311 AH, equated to 6 June 1894, near Wadi al-Ubayd in Tadla, citing al-Nasiri's al-Istiqsa), covering his Alawi descent, centralisation, army modernisation and resistance to European encroachment."
  es: "El artículo de la Wikipedia en árabe sobre Hassan I de Marruecos (nacido en Fez en 1836; murió la noche del 3 de Dhu al-Hijja de 1311 AH, equivalente al 6 de junio de 1894, cerca de Wadi al-Ubayd en Tadla, citando al-Istiqsa de al-Nasiri), que abarca su ascendencia alauita, la centralización, la modernización del ejército y la resistencia a la invasión europea."
  fr: "L'article de Wikipédia en arabe sur Hassan Ier du Maroc (né à Fès en 1836; mort dans la nuit du 3 Dhu al-Hijja 1311 AH, soit le 6 juin 1894, près de Wadi al-Ubayd à Tadla, citant al-Istiqsa d'al-Nasiri), aborde ses origines alaouites, la centralisation du pouvoir, la modernisation de l'armée et sa résistance à l'empiètement européen."
  ur: "مراکش کے حسن اول پر عربی ویکیپیڈیا کا مضمون ⁦(فیض میں 1836 میں پیدا ہوا؛ 3 ذی الحجہ 1311 ہجری کی رات فوت ہوا، 6 جون 1894 کو تاڈلہ میں وادی العبید کے قریب، النصیری کے الاستقاضہ کا حوالہ دیتے ہوئے)⁩، اس کی مرکزی فوج کو جدیدیت، جدیدیت کے ساتھ ڈھکنے والے یورپی تجاوزات۔"
  tr: "Hasan I ibn Muhammed hakkında Arapça Wikipedia makalesi (1836'da Fes'te doğdu – 3 Zulhicce 1311 Hicce gecesi, 6 Haziran 1894'te Tadla'da Wadi al-Obaid yakınlarında öldü, Al-Nasiri'nin \"Al-İstika\"sından alıntılanmıştır); Alevi soyunu ve merkezileşme, orduyu modernleştirme ve Avrupa emellerini püskürtme çabalarını listeler."
  id: "Artikel Wikipedia bahasa Arab tentang Hassan I ibn Muhammad (lahir di Fez tahun 1836 – meninggal pada malam 3 Dhu al-Hijjah 1311 H, yang bertepatan dengan 6 Juni 1894, dekat Wadi al-Obaid di Tadla, dikutip dari \"Al-Istiqsa\" karya Al-Nasiri); artikel ini mencantumkan garis keturunan Alawite dan upayanya dalam sentralisasi, modernisasi tentara, dan menangkis ambisi Eropa."
