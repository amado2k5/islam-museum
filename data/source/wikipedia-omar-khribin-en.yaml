  ar: "مقالة ويكيبيديا الإنجليزية عن عمر خربين؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 15 يناير 1994 في دمشق، وجائزته لاعب العام في آسيا سنة 2017 — أول سوري ينالها — ولقبه في دوري أبطال آسيا 2019 مع الهلال، ورصيده مع سوريا 70 مباراة و31 هدفاً. ولا تذكر ديانته."
  en: "English Wikipedia article on Omar Khribin; used for entity facts only. It gives his birth on 15 January 1994 in Damascus, his 2017 Asian Footballer of the Year award — the first won by a Syrian — his 2019 AFC Champions League title with Al-Hilal, and his Syria record of 70 caps and 31 goals. It makes no statement about his religion."
