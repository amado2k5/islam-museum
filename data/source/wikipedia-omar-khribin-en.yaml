summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمر خربين؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 15 يناير 1994 في دمشق، وجائزته لاعب العام في آسيا سنة 2017 — أول سوري ينالها — ولقبه في دوري أبطال آسيا 2019 مع الهلال، ورصيده مع سوريا 70 مباراة و31 هدفاً. ولا تذكر ديانته."
  en: "English Wikipedia article on Omar Khribin; used for entity facts only. It gives his birth on 15 January 1994 in Damascus, his 2017 Asian Footballer of the Year award — the first won by a Syrian — his 2019 AFC Champions League title with Al-Hilal, and his Syria record of 70 caps and 31 goals. It makes no statement about his religion."
  es: "Artículo de la Wikipedia en inglés sobre Omar Khribin; utilizado únicamente para datos sobre la persona. Indica que nació el 15 de enero de 1994 en Damasco, que recibió el premio al Futbolista Asiático del Año en 2017 —el primero otorgado a un sirio—, que ganó la Liga de Campeones de la AFC en 2019 con el Al-Hilal y que su récord con la selección de Siria es de 70 partidos internacionales y 31 goles. No menciona su religión."
  fr: "L'article Wikipédia en anglais consacré à Omar Khribin, utilisé uniquement pour les informations le concernant, mentionne sa naissance le 15 janvier 1994 à Damas, son titre de meilleur joueur asiatique de l'année 2017 (une première pour un Syrien), sa victoire en Ligue des champions de l'AFC en 2019 avec Al-Hilal, ainsi que ses 70 sélections et 31 buts en équipe nationale syrienne. Aucune mention n'est faite de sa religion."
  ur: "عمر خربین پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 15 جنوری 1994 کو دمشق میں ہوئی، اس کا 2017 کے ایشین فٹ بالر آف دی ایئر کا ایوارڈ — جو پہلا شامی نے جیتا — الہلال کے ساتھ اس کا 2019 کا AFC چیمپئنز لیگ ٹائٹل، اور اس کا شامی ریکارڈ 70 کیپس اور 31 گولز کا ہے۔ اس کے مذہب کے بارے میں کوئی بیان نہیں ہے۔"
  tr: "Omar Khribin hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 15 Ocak 1994'te Şam'da, 2017 Asya Yılın Oyuncusu ödülünü — bu ödülü kazanan ilk Suriyeli olarak — ve 2019 AFC Şampiyonlar Ligi'nde Al Hilal ile şampiyonluğunu listeliyor; Suriye ile 70 maç ve 31 gol attı. Dini belirtilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Omar Khribin; hanya digunakan untuk fakta entitas tersebut. Artikel tersebut mencantumkan kelahirannya pada 15 Januari 1994 di Damaskus, penghargaan Asian Player of the Year 2017 — orang Suriah pertama yang memenangkannya — dan gelarnya di AFC Champions League 2019 bersama Al Hilal, dengan 70 pertandingan dan 31 gol yang dicetak bersama Suriah. Agamanya tidak disebutkan."
