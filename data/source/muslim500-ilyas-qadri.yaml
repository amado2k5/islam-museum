reliability_note: "Read in full (the Pakistan 'Scholarly' page of the 2010 edition) on 5 November 2026 in its Yumpu reproduction. The entry's exact prose is: 'Sheikh Muhammad Ilyas Attar Qadiri is a leader of the Qadiriyyah, Radaviyyah, Attariya branch of the Qadri Sufi order. He is also the founder of Dawat-e-Islami, a Sunni Barelwi revivalist movement centering on the propagation of Islamic knowledge.' It is an independent research centre's published text attesting a specific Sufi order for the man himself; it is one of the two independent texts on which the record's sufi segment rests. The same publication's later editions continue to list him (the 2026 edition lists him as founder of Dawat-e-Islami), but the order attestation quoted here is the 2010 text actually read."
