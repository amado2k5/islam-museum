  ar: "المقال الإنجليزي «أحمد القلاتي» عن مير أحمد يار خان أحمدزئي (1902–1979)، آخر خانات قلات: ولايته من 1933 إلى 1955، وانضمام قلات إلى باكستان في 27 مارس 1948، واتحاد ولايات بلوشستان، واعتقاله سنة 1958، ومنصبه حاكما لبلوشستان 1974–1977، وسيرته الذاتية «داخل بلوشستان» (1975)."
  en: "English Wikipedia article 'Ahmad of Kalat' on Mir Ahmad Yar Khan Ahmedzai (1902–1979), the last Khan of Kalat: his rule from 1933 to 1955, Kalat's accession to Pakistan on 27 March 1948, the Baluchistan States Union, his 1958 arrest, his governorship of Balochistan (1974–1977) and his autobiography Inside Baluchistan (1975)."
