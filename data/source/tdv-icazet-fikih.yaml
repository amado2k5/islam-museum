reliability_note: "Read on 1 November 2026 in the web edition, printed pages 401–403. Read in its first half (the legal theory of ijaza in contract, the Hanafi stages of validity). Read only to separate the legal sense of ijaza from the teaching sense; no fact about the scholar's ijaza is taken from it."
