summary:
  ar: "مدخل «إجازة» ⁦(القسم الفقهي)⁩ في موسوعة TDV الإسلامية ⁦(المجلد 21، إسطنبول 2000، ص 401–403)⁩: الإجازة بمعنى إقرار التصرف وإمضائه في نظرية العقد، وهو معنى مختلف عن إجازة العلم."
  en: "The fiqh section of the TDV İslâm Ansiklopedisi entry 'İCÂZET' (vol. 21, Istanbul 2000, pp. 401–403): ijaza in the legal sense of ratifying a transaction in contract theory. It is a different sense from the scholar's ijaza."
  es: "La sección de fiqh de la entrada 'İCÂZET' de la TDV İslâm Ansiklopedisi (vol. 21, Estambul 2000, págs. 401-403) define la ijaza en el sentido jurídico de ratificar una transacción en la teoría contractual. Este sentido difiere del de la ijaza académica."
  fr: "La section de jurisprudence islamique (fiqh) de l'article « İCÂZET » de l'ouvrage TDV İslâm Ansiklopedisi (vol. 21, Istanbul, 2000, p. 401-403) définit l'ijaza au sens juridique de ratification d'une transaction en droit des contrats. Ce sens diffère de celui qu'en donne le savant."
  ur: "TDV İslâm Ansiklopedisi entry 'ICÂZET' کا فقہ سیکشن ⁦(جلد 21، استنبول 2000، صفحہ 401–403)⁩: معاہدہ نظریہ میں لین دین کی توثیق کے قانونی معنی میں اعجاز۔ یہ عالم کے اعجاز سے الگ معنی ہے۔"
title: "İCÂZET (fıkıh)"
