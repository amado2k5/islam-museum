  ar: "مقالة «أفغانستان» في الموسوعة الدولية للحرب العالمية الأولى. تذكر نجم الدين آخوندزاده، المعروف بملا هده (ت 1902)، ضمن أبرز ملالي قبائل الحدود الذين حرّضوا على مقاومة البريطانيين قبل الحرب، وتصفه بأنه «الملا الشهير المناهض للبريطانيين» الذي ورث عنه آخرون عباءته."
  en: "The 'Afghanistan' article of 1914-1918-online, the International Encyclopedia of the First World War. It names 'Najmuddin al-Din, known as the Hadda Mullah (?-1902)' among the most prominent frontier mullahs who encouraged resistance to the British before the First World War, and calls him 'the famous anti-British Mullah' whose mantle others inherited."
