summary:
  ar: "مقالة «أفغانستان» في الموسوعة الدولية للحرب العالمية الأولى. تذكر نجم الدين آخوندزاده، المعروف بملا هده ⁦(ت 1902)⁩، ضمن أبرز ملالي قبائل الحدود الذين حرّضوا على مقاومة البريطانيين قبل الحرب، وتصفه بأنه «الملا الشهير المناهض للبريطانيين» الذي ورث عنه آخرون عباءته."
  en: "The 'Afghanistan' article of 1914-1918-online, the International Encyclopedia of the First World War. It names 'Najmuddin al-Din, known as the Hadda Mullah (?-1902)' among the most prominent frontier mullahs who encouraged resistance to the British before the First World War, and calls him 'the famous anti-British Mullah' whose mantle others inherited."
  es: "El artículo sobre Afganistán de la Enciclopedia Internacional de la Primera Guerra Mundial (1914-1918-online) menciona a Najmuddin al-Din, conocido como el Mulá de Hadda (¿?-1902), entre los mulás fronterizos más destacados que alentaron la resistencia a los británicos antes de la Primera Guerra Mundial, y lo denomina \"el famoso mulá antibritánico\" cuyo legado fue heredado por otros."
  fr: "L'article « Afghanistan » de l'Encyclopédie internationale en ligne de la Première Guerre mondiale (1914-1918) mentionne Najmuddin al-Din, connu sous le nom de mollah Hadda (?-1902), parmi les mollahs frontaliers les plus influents ayant encouragé la résistance aux Britanniques avant la Première Guerre mondiale, et le qualifie de « célèbre mollah anti-britannique » dont l'héritage a été repris par d'autres."
  ur: "1914-1918-آن لائن کا 'افغانستان' مضمون، پہلی جنگ عظیم کا بین الاقوامی انسائیکلوپیڈیا۔ اس میں 'نجم الدین الدین، جسے حدی ملا (-1902) کے نام سے جانا جاتا ہے' کا نام سب سے نمایاں فرنٹیئر ملاؤں میں شامل ہے جنہوں نے پہلی جنگ عظیم سے پہلے انگریزوں کے خلاف مزاحمت کی حوصلہ افزائی کی تھی، اور انہیں 'مشہور انگریز مخالف ملا' کہا جاتا ہے جس کی چادر دوسروں کو وراثت میں ملی تھی۔"
