reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision (revid asserted equal before use). It gives his birth in Medina on Tuesday 11 Muharram 1396 AH, corresponding to 13 January 1976; memorisation of the Qur'an as a child at the Ashraf mosque in al-Harrah al-Gharbiyah, Medina, and a tied first place in the international Qur'an competition in Mecca at sixteen; a bachelor's degree from the faculty of Qur'an at the Islamic University of Madinah, then a master's and a doctorate in tafsir and Qur'anic sciences at Umm al-Qura University. Its infobox leaves both the jurisprudence and the creed fields empty."
