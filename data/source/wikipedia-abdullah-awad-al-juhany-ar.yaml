summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الله الجهني؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه الكامل عبد الله بن عواد بن فهد الذبياني الجهني، وميلاده بالمدينة المنورة يوم الثلاثاء 11 محرم 1396هـ الموافق 13 يناير 1976، وحفظه القرآن صغيرًا وفوزه بمسابقة دولية، ودراسته الجامعية والتكليف بإمامة التراويح بالحرم عامي 1426 و1427هـ."
  en: "Arabic Wikipedia article on Abdullah Al-Juhany; used for entity facts only. It gives his full name as Abdullah ibn Awad ibn Fahd al-Dhubyani al-Juhany, his birth in Medina on Tuesday 11 Muharram 1396 AH, corresponding to 13 January 1976, his childhood memorisation of the Qur'an and first place in an international competition, his university studies, and his assignment to lead the Tarawih prayers at the Haram in 1426 and 1427 AH."
  es: "Artículo de Wikipedia en árabe sobre Abdullah Al-Juhany; utilizado únicamente para datos sobre la persona. Indica su nombre completo como Abdullah ibn Awad ibn Fahd al-Dhubyani al-Juhany, su nacimiento en Medina el martes 11 de Muharram de 1396 AH, correspondiente al 13 de enero de 1976, su memorización del Corán en la infancia y el primer puesto en una competición internacional, sus estudios universitarios y su asignación para dirigir las oraciones de Tarawih en el Haram en 1426 y 1427 AH."
  fr: "Article de Wikipédia en arabe sur Abdullah Al-Juhany; utilisé uniquement pour les informations relatives à l’entité. Il indique son nom complet: Abdullah ibn Awad ibn Fahd al-Dhubyani al-Juhany, sa naissance à Médine le mardi 11 Muharram 1396 AH (correspondant au 13 janvier 1976), sa mémorisation du Coran dès son enfance et sa première place à un concours international, ses études universitaires et sa nomination à la tête des prières de Tarawih au Haram en 1426 et 1427 AH."
  ur: "عبداللہ الجہنی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا پورا نام عبداللہ بن عواد بن فہد الذھبیانی الجہنی بتایا گیا ہے، ان کی پیدائش مدینہ منورہ میں منگل 11 محرم 1396 ہجری، 13 جنوری 1976 کی مناسبت سے ہوئی، ان کا بچپن میں حفظ قرآن اور ایک بین الاقوامی مقابلے میں پہلی پوزیشن، یونیورسٹی کی پڑھائی، اور نماز تراویح میں امامت کی ذمہ داری۔ اور 1427ھ۔"
