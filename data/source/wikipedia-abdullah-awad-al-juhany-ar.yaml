  ar: "مقالة ويكيبيديا العربية عن عبد الله الجهني؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه الكامل عبد الله بن عواد بن فهد الذبياني الجهني، وميلاده بالمدينة المنورة يوم الثلاثاء 11 محرم 1396هـ الموافق 13 يناير 1976، وحفظه القرآن صغيرًا وفوزه بمسابقة دولية، ودراسته الجامعية والتكليف بإمامة التراويح بالحرم عامي 1426 و1427هـ."
  en: "Arabic Wikipedia article on Abdullah Al-Juhany; used for entity facts only. It gives his full name as Abdullah ibn Awad ibn Fahd al-Dhubyani al-Juhany, his birth in Medina on Tuesday 11 Muharram 1396 AH, corresponding to 13 January 1976, his childhood memorisation of the Qur'an and first place in an international competition, his university studies, and his assignment to lead the Tarawih prayers at the Haram in 1426 and 1427 AH."
