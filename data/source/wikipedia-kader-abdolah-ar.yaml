reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). It gives his birth as 12 December 1954 in Arak — the month conflicts with the English and Dutch articles' 12 November and is preserved as a variant in the person record. It records his physics degree at the University of Tehran (1977), his clandestine 1980 story collections, the origin of his pen name in two executed friends, his flight from Iran in 1985 and arrival at the Apeldoorn asylum centre in 1988, and his Volkskrant column. It names no religion for him."
