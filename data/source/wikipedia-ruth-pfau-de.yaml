summary:
  ar: "مقالة ويكيبيديا الألمانية عن روث بفاو؛ تُستخدم لوقائع الكيان فقط. نص مستقل يصفها منذ سطره الأول بأنها راهبة كاثوليكية رومانية في جمعية بنات قلب مريم وطبيبة نسائية، ويروي دراستها الطب في ماينز وماربورغ، ومعموديتها سنة 1951 وتحولها إلى الكنيسة الكاثوليكية الرومانية سنة 1953، ودخولها الجمعية في باريس سنة 1957، وإدارتها مركز ماري أدلايد للجذام حتى سنة 2013."
  en: "German Wikipedia article on Ruth Pfau; used for entity facts only. An independent text that opens by calling her a Roman Catholic religious sister of the Society of the Daughters of the Heart of Mary and a gynaecologist, and recounts her medical studies at Mainz and Marburg, her baptism in 1951 and conversion to the Roman Catholic Church in 1953, her entry into the society at Paris in 1957, and her direction of the Marie Adelaide Leprosy Centre until 2013."
  es: "Artículo de la Wikipedia en alemán sobre Ruth Pfau; utilizado únicamente para datos sobre la persona. Un texto independiente que comienza describiéndola como religiosa católica de la Sociedad de las Hijas del Corazón de María y ginecóloga, y relata sus estudios de medicina en Maguncia y Marburgo, su bautismo en 1951 y su conversión a la Iglesia Católica en 1953, su ingreso en la sociedad en París en 1957 y su dirección del Centro de Lepra Marie Adelaide hasta 2013."
  fr: "Article de Wikipédia en allemand sur Ruth Pfau; utilisé uniquement pour les informations sur l’entité. Un texte indépendant la présente comme une religieuse catholique romaine de la Société des Filles du Cœur de Marie et gynécologue, et relate ses études de médecine à Mayence et Marbourg, son baptême en 1951 et sa conversion à l’Église catholique romaine en 1953, son entrée dans la société à Paris en 1957 et sa direction du Centre de lèpre Marie Adélaïde jusqu’en 2013."
  ur: "روتھ فاؤ پر جرمن ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک آزاد متن جو اسے سوسائٹی آف دی ڈوٹرز آف دی ہارٹ آف مریم کی رومن کیتھولک مذہبی بہن اور ماہر امراض نسواں کہہ کر کھلتا ہے، اور مینز اور ماربرگ میں اس کی طبی تعلیم، 1951 میں اس کا بپتسمہ اور 1953 میں رومن کیتھولک چرچ میں تبدیلی، اس کی سوسائٹی میں داخلے کے بارے میں بتاتا ہے، اس کے پیرس میں سینٹرل ایڈریس اور ایڈرو 59 تک۔ 2013."
