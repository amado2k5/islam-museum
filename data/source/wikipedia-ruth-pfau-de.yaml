summary:
  ar: "مقالة ويكيبيديا الألمانية عن روث بفاو؛ تُستخدم لوقائع الكيان فقط. نص مستقل يصفها منذ سطره الأول بأنها راهبة كاثوليكية رومانية في جمعية بنات قلب مريم وطبيبة نسائية، ويروي دراستها الطب في ماينز وماربورغ، ومعموديتها سنة 1951 وتحولها إلى الكنيسة الكاثوليكية الرومانية سنة 1953، ودخولها الجمعية في باريس سنة 1957، وإدارتها مركز ماري أدلايد للجذام حتى سنة 2013."
  en: "German Wikipedia article on Ruth Pfau; used for entity facts only. An independent text that opens by calling her a Roman Catholic religious sister of the Society of the Daughters of the Heart of Mary and a gynaecologist, and recounts her medical studies at Mainz and Marburg, her baptism in 1951 and conversion to the Roman Catholic Church in 1953, her entry into the society at Paris in 1957, and her direction of the Marie Adelaide Leprosy Centre until 2013."
