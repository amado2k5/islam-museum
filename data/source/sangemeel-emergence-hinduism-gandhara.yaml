reliability_note: "The book's own author biography as reproduced on the publisher's sales page, read in full on 31 October 2026. It is the only source found that states a birth year for him (1981); the same biography calls him Pakistan's youngest archaeology PhD at 28, which against a 2011 doctorate would imply 1982–83, so the year is recorded as debated. It names no faith for him; his book's subject — the emergence of Hinduism in ancient Gandhara — is his scholarly field, never his faith."
