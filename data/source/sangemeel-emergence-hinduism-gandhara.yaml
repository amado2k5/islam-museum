  ar: "صفحة الناشر (سنغميل) لكتاب عبد الصمد «نشأة الهندوسية في غاندهارا: تحليلات للثقافة المادية» (2020)، وفيها سيرة المؤلف التي تذكر أنه وُلد سنة 1981، ونال الدكتوراه من ألمانيا بامتياز، وأكمل زمالة فولبرايت لما بعد الدكتوراه في جامعة ويسكونسن بالولايات المتحدة، ثم عُيّن مديرا للآثار والمتاحف في خيبر بختونخوا، وحاز وسام فخر الأداء سنة 2018."
  en: "Publisher's (Sangemeel) page for Abdul Samad's book Emergence of Hinduism in Gandhara: Analyses of Material Culture (2020), carrying the book's 'About the Author' biography: born in 1981; PhD with distinction from Germany; Fulbright postdoctoral fellowship at the University of Wisconsin, USA; appointed provincial director of archaeology and museums in Khyber Pakhtunkhwa; awarded the President's Pride of Performance in 2018."
