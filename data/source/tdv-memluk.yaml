summary:
  ar: "مدخل «مملوك» في موسوعة TDV الإسلامية: أصل الكلمة، نشأة نظام العسكريين المماليك من العباسيين إلى المماليك، التجنيد والتدريب في طبقات قلعة القاهرة، الأعتاق والولاء والخُشداشية، والمكانة الأرستقراطية للمماليك."
  en: "The TDV İslâm Ansiklopedisi entry on the memlük: the word and its cognates (gulâm, abîd, sakâlibe), the rise of the military-slave system from the Umayyads to al-Mu'tasim's Turks at Samarra, recruitment through the slave markets, training in the Cairo Citadel barracks, manumission, the mu'tik-huşdaşiye bonds, and the one-generation aristocracy of the Mamluks."
  ur: "TDV اسلامی انسائیکلوپیڈیا کا مادہ «مملوک»: لفظ و ہم معنی نام ⁦(غلام، عبید، صقالبہ)⁩، غلام سپاہی نظام کا ظہور امویوں سے معتصم کے ترک سپاہیوں اور سامرا تک، غلام بازاروں سے بھرتی، قلعہ قاہرہ کے طبقہ میں تربیت، آزادی، معتق و خشداشیہ کے روابط، اور ممالیک کی ایک نسل کی اشرافیہ۔"
