summary:
  ar: "بطاقة ويكي بيانات لشير علي خان؛ معرّفات منظمة وتواريخ فقط. تحمل مولده سنة 1825 وقيمة شاردة ثانية سنة 1823، ووفاته في 21 فبراير 1879 مع كابل مكانا للوفاة خلافا لمتن المقالة الذي يعطي مزار شريف، ولا تحمل أي قيمة للديانة."
  en: "Wikidata item for Sher Ali Khan; structured identifiers and dates only. It carries his birth in the year 1825 with a second, stray value of 1823, his death on 21 February 1879 with Kabul as place of death against the article text's Mazar-e Sharif, and no religion value at all."
  es: "Entrada de Wikidata para Sher Ali Khan; solo identificadores estructurados y fechas. Indica su nacimiento en el año 1825 con un segundo valor erróneo de 1823, su muerte el 21 de febrero de 1879 con Kabul como lugar de fallecimiento en contraposición a Mazar-e Sharif en el texto del artículo, y no tiene ningún valor religioso."
  fr: "L'article Wikidata concernant Sher Ali Khan ne contient que des identifiants structurés et des dates. Il indique sa naissance en 1825, ainsi qu'une seconde valeur isolée mentionnant 1823, son décès le 21 février 1879 à Kaboul (contrairement au Mazar-e Sharif mentionné dans le texte de l'article), et aucune information sur sa religion."
  ur: "شیر علی خان کے لیے وکی ڈیٹا آئٹم؛ صرف ساختی شناخت کنندگان اور تاریخیں۔ اس میں ان کی پیدائش 1825 میں دوسری، 1823 کی آوارہ قیمت کے ساتھ ہے، اس کی موت 21 فروری 1879 کو کابل کے ساتھ مقالے کے متن کے مزار شریف کے خلاف موت کی جگہ ہے، اور مذہب کی کوئی قدر نہیں۔"
  tr: "Sher Ali Khan için Wikidata kartı; sadece düzenlenmiş tanımlayıcılar ve tarihler. 1825 doğumlu olup 1823'te ikincil bir değere sahiptir ve 21 Şubat 1879'da ölmüştür; ölüm yeri olarak Kabil'dir. Makalenin ana metnindeki soylu bir türbe yerinin aksine, dini bir değeri yoktur."
  id: "Kartu Wikidata untuk Sher Ali Khan; hanya pengenal dan tanggal yang terorganisir. Ia lahir pada tahun 1825 dan memiliki nilai sekunder pada tahun 1823, dan meninggal pada 21 Februari 1879, dengan Kabul sebagai tempat kematian. Berbeda dengan isi utama artikel yang menyebutkan tempat suci bangsawan, artikel ini tidak memiliki nilai religius."
