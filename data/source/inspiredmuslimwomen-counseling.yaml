summary:
  ar: "صفحة الإرشاد في موقع «النساء المسلمات الملهمات»؛ تقول إن «مسلمة كوتشينغ» خدمة إرشاد مهنية أسستها الأستاذة نائلة أكبارالي سنة 2015، وأصبحت سنة 2022 قسمًا من شركة «النساء المسلمات الملهمات» المحدودة، وتصف إرشادها الزوجي للنساء والأزواج."
  en: "The counselling page of Inspired Muslim Women. It states that Muslima Coaching is a professional coaching service founded by Ustadha Naielah Ackbarali in 2015, that in 2022 it became a division of Inspired Muslim Women Ltd, and describes her marriage coaching for women and couples."
  es: "La página de asesoramiento de Inspired Muslim Women. En ella se indica que Muslima Coaching es un servicio de asesoramiento profesional fundado por Ustadha Naielah Ackbarali en 2015, que en 2022 se convirtió en una división de Inspired Muslim Women Ltd, y se describe su asesoramiento matrimonial para mujeres y parejas."
  fr: "La page de conseil d'Inspired Muslim Women indique que Muslima Coaching est un service de coaching professionnel fondé par Ustadha Naielah Ackbarali en 2015, qu'en 2022 il est devenu une division d'Inspired Muslim Women Ltd, et décrit son coaching conjugal pour les femmes et les couples."
  ur: "متاثر مسلم خواتین کا مشاورتی صفحہ۔ اس میں کہا گیا ہے کہ مسلمہ کوچنگ ایک پیشہ ور کوچنگ سروس ہے جس کی بنیاد استاد نائلہ اکبرالی نے 2015 میں رکھی تھی، جو 2022 میں انسپائرڈ مسلم ویمن لمیٹڈ کا ایک ڈویژن بن گئی، اور خواتین اور جوڑوں کے لیے اپنی شادی کی کوچنگ کی وضاحت کرتی ہے۔"
