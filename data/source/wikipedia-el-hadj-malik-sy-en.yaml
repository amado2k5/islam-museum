reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: the lead dates him 1853–1922 — the birth year conflicts with the French article and Wikidata (1855), and the record follows 1855 and records this variant; born at Gaya in northern Senegal to a Fulani family; studied in Mauritania and at Saint-Louis (1884), taught at Louga and Pire Goureye, then established a zawiya at Tivaouane and settled there permanently in 1902 (the article's sentence garbles the year once as 1898 — the French article and the sense give 1902, followed in the record); 'In Senegal's Wolof country... the Tijānī Order was spread primarily by El-Hajj Malick Sy'; the lead names him 'a Senegalese religious leader and teacher in the Tijaniyya Sufi Malikite and Ash'arite brotherhood' — but the article's own bibliography states that it derives in part from a translation of the French Wikipedia article, so for the Maliki/Ash'ari school the English and French articles are counted as ONE source family, as the record's faith note states; after his death on 27 June 1922 his son Seydi Ababacar Sy succeeded him as 'khalife général des Tidjanes' until 1957 — the succession attests the father's own tenure of the Sy Tijaniyya caliphate, and with the French article's independent account of his Tijaniyya leadership it carries the record's sufi segment; the Gàmmu (Mawlid) of Tivaouane gathers many followers each year; his works include Ifham al-Munkir, 'a defense of the Tijaniyya', Faakihatul Tullab, 'A Primer on the Tijaniyya', Kifayat ar-Raghibin and the Khilasu ez-Zahab biography of the Prophet."
