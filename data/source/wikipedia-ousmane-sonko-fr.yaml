summary:
  ar: "مقالة ويكيبيديا الفرنسية عن عثمان سونكو؛ تُستخدم لوقائع الكيان فقط. أطول المقالات: تروي نشاطه الشبابي في جمعية التلاميذ والطلبة المسلمين في السنغال (AEEMS)، ووساطة الخليفة العام للمريدية التي أنهت إضرابه عن الطعام في 2023 بناء على طلبه، ويذكر صندوقها أن دينه «الإسلام — السنة»؛ ولا يسمي متنها مذهبا له."
  en: "French Wikipedia article on Ousmane Sonko; used for entity facts only. The longest of the articles: it records his youth activism in the Association of Muslim Pupils and Students of Senegal (AEEMS) and the Mouride khalifa-general's mediation, at Sonko's request, that ended his 2023 hunger strike. Its infobox gives his religion as Islam (Sunni); its text names no school for him."
  es: "Artículo de la Wikipedia en francés sobre Ousmane Sonko; utilizado únicamente para datos sobre la persona. Es el más extenso: documenta su activismo juvenil en la Asociación de Alumnos y Estudiantes Musulmanes de Senegal (AEEMS) y la mediación del califa general Mouride, a petición de Sonko, que puso fin a su huelga de hambre de 2023. Su ficha informativa indica que su religión es el islam (suní); el texto no menciona ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en français sur Ousmane Sonko; utilisé uniquement pour les informations le concernant. C'est l'article le plus long: il relate son engagement dans l'Association des élèves et étudiants musulmans du Sénégal (AEEMS) durant sa jeunesse, ainsi que la médiation du calife mouride, à sa demande, qui mit fin à sa grève de la faim de 2023. Son infobox indique qu'il est musulman (sunnite); le texte ne mentionne aucun établissement scolaire."
  ur: "Ousmane Sonko پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ مضامین میں سے سب سے طویل: یہ ایسوسی ایشن آف مسلم پپلز اینڈ اسٹوڈنٹس آف سینیگال ⁦(اے ای ای ایم ایس)⁩ میں اس کی نوجوانوں کی سرگرمی کو ریکارڈ کرتا ہے اور سونکو کی درخواست پر مورائڈ خلیفہ جنرل کی ثالثی سے، جس نے اس کی 2023 کی بھوک ہڑتال ختم کردی۔ اس کا انفو باکس اپنا مذہب اسلام ⁦(سنی)⁩ دیتا ہے۔ اس کا متن اس کے لیے کسی اسکول کا نام نہیں رکھتا۔"
