  ar: "مقالة ويكيبيديا الفرنسية عن عثمان سونكو؛ تُستخدم لوقائع الكيان فقط. أطول المقالات: تروي نشاطه الشبابي في جمعية التلاميذ والطلبة المسلمين في السنغال (AEEMS)، ووساطة الخليفة العام للمريدية التي أنهت إضرابه عن الطعام في 2023 بناء على طلبه، ويذكر صندوقها أن دينه «الإسلام — السنة»؛ ولا يسمي متنها مذهبا له."
  en: "French Wikipedia article on Ousmane Sonko; used for entity facts only. The longest of the articles: it records his youth activism in the Association of Muslim Pupils and Students of Senegal (AEEMS) and the Mouride khalifa-general's mediation, at Sonko's request, that ended his 2023 hunger strike. Its infobox gives his religion as Islam (Sunni); its text names no school for him."
