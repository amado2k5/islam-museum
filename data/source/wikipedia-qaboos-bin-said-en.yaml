summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن قابوس بن سعيد؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في صلالة في 18 نوفمبر 1940، وأطاح بوالده في 23 يوليو 1970 فصار سلطان عُمان حتى وفاته في سيب في 10 يناير 2020 ودُفن في 11 يناير في المقبرة الملكية بمسقط، وقاد نهضة عُمان الحديثة. ويقرأ حقل الدين في صندوق معلوماتها «الإسلام الإباضي»، ويصرّح متنها في قسم حياته الخاصة: «كان قابوس مسلمًا على المذهب الإباضي»، وهو النص الوحيد بين مصادره الذي يسمي انتماءه بنفسه."
  en: "English Wikipedia article on Qaboos bin Said; used for entity facts only. It gives him as born at Salalah on 18 November 1940, Sultan of Oman from his coup against his father on 23 July 1970 until his death at Seeb on 10 January 2020, buried on 11 January at the Royal Cemetery in Muscat, and as the architect of Oman's modern renaissance. Its infobox religion field reads 'Ibadi Islam', and its Personal life text states: 'Qaboos was a Muslim of the Ibadi denomination, which has traditionally ruled Oman' — the one text among his sources that names his own affiliation."
  es: "Artículo de la Wikipedia en inglés sobre Qaboos bin Said; utilizado únicamente para datos sobre la persona. Lo describe como nacido en Salalah el 18 de noviembre de 1940, sultán de Omán desde su golpe de Estado contra su padre el 23 de julio de 1970 hasta su muerte en Seeb el 10 de enero de 2020, enterrado el 11 de enero en el Cementerio Real de Mascate, y como el artífice del renacimiento moderno de Omán. Su campo de religión en la ficha informativa dice «Islam ibadí», y su texto de vida personal afirma: «Qaboos era musulmán de la denominación ibadí, que tradicionalmente ha gobernado Omán» —el único texto entre sus fuentes que menciona su propia afiliación religiosa—."
  fr: "L'article de Wikipédia en anglais consacré à Qabous ben Saïd, utilisé uniquement pour les informations le concernant, indique qu'il est né à Salalah le 18 novembre 1940, qu'il fut sultan d'Oman depuis son coup d'État contre son père le 23 juillet 1970 jusqu'à sa mort à Seeb le 10 janvier 2020, inhumé le 11 janvier au cimetière royal de Mascate, et qu'il est considéré comme l'architecte de la renaissance moderne d'Oman. L'infobox « Religion » mentionne « Islam ibadite », et la section « Vie personnelle » précise: « Qabous était un musulman ibadite, courant qui a traditionnellement gouverné Oman » – le seul texte parmi ses sources mentionnant son appartenance religieuse."
  ur: "قابوس بن سعید پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے 18 نومبر 1940 کو سلالہ میں پیدا ہوا، عمان کا سلطان 23 جولائی 1970 کو اپنے والد کے خلاف بغاوت سے لے کر 10 جنوری 2020 کو سیب میں اس کی موت تک، 11 جنوری کو مسقط کے شاہی قبرستان میں دفن ہوا، اور عمان کے جدید نشاۃ ثانیہ کے معمار کے طور پر۔ اس کے انفو باکس کے مذہب کے شعبے میں 'عبادی اسلام' پڑھا گیا ہے، اور اس کی ذاتی زندگی کا متن کہتا ہے: 'قابوس عبادی فرقے کا مسلمان تھا، جس نے روایتی طور پر عمان پر حکومت کی ہے' - اس کے ذرائع میں سے ایک متن جو اس کی اپنی وابستگی کا نام دیتا ہے۔"
  tr: "Qaboos bin Said hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 18 Kasım 1940'ta Salalah'ta doğduğu ve 23 Temmuz 1970'te babasını tahttan indirerek 10 Ocak 2020'de Seeb'de ölene kadar Umman Sultanı olduğu belirtilmektedir; ayrıca 11 Ocak'ta Muskat'taki Kraliyet Mezarlığı'na defnedildi ve bu, Umman'ın modern rönesansına öncülük etti. Haql-al-Din, bilgi kutusunda 'İbadi İslam' ifadesini okur ve kişisel hayat bölümünde 'Kabus, İbadi okulundan bir Müslümandı' der; bu, kaynakları arasında kendi aidiyetini belirten tek metindir."
  id: "Artikel Wikipedia bahasa Inggris tentang Qaboos bin Said; digunakan hanya untuk fakta entitas. Dicatat bahwa ia lahir di Salalah pada 18 November 1940, dan menggulingkan ayahnya pada 23 Juli 1970, menjadikannya Sultan Oman hingga wafat di Seeb pada 10 Januari 2020, dan ia dimakamkan pada 11 Januari di Pemakaman Kerajaan Muscat, memimpin kebangkitan modern Oman. Haql al-Din membaca 'Islam Ibadi' di kotak informasinya, dan di bagian kehidupan pribadinya, ia menyatakan: 'Qaboos adalah Muslim dari aliran Ibadi,' yang merupakan satu-satunya teks di antara sumbernya yang menyebutkan afiliasinya sendiri."
