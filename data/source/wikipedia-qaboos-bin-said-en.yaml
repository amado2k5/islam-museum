summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن قابوس بن سعيد؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في صلالة في 18 نوفمبر 1940، وأطاح بوالده في 23 يوليو 1970 فصار سلطان عُمان حتى وفاته في سيب في 10 يناير 2020 ودُفن في 11 يناير في المقبرة الملكية بمسقط، وقاد نهضة عُمان الحديثة. ويقرأ حقل الدين في صندوق معلوماتها «الإسلام الإباضي»، ويصرّح متنها في قسم حياته الخاصة: «كان قابوس مسلمًا على المذهب الإباضي»، وهو النص الوحيد بين مصادره الذي يسمي انتماءه بنفسه."
  en: "English Wikipedia article on Qaboos bin Said; used for entity facts only. It gives him as born at Salalah on 18 November 1940, Sultan of Oman from his coup against his father on 23 July 1970 until his death at Seeb on 10 January 2020, buried on 11 January at the Royal Cemetery in Muscat, and as the architect of Oman's modern renaissance. Its infobox religion field reads 'Ibadi Islam', and its Personal life text states: 'Qaboos was a Muslim of the Ibadi denomination, which has traditionally ruled Oman' — the one text among his sources that names his own affiliation."
