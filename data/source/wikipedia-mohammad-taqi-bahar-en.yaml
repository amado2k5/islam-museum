  ar: "مقالة ويكيبيديا الإنجليزية عن محمدتقي بهار؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 10 ديسمبر 1886 في مشهد ووفاته في طهران سنة 1951، ولقبه ملك الشعراء الذي ناله سنة 1903 خلفًا لأبيه، وصحفه الدستورية ونيابته في المجلس وأستاذيته في جامعة طهران ومؤلفاته وعلى رأسها «سبك‌شناسی»."
  en: "English Wikipedia article on Mohammad-Taqi Bahar; used for entity facts only. It gives his birth on 10 December 1886 in Mashhad and his death in Tehran in 1951, the Malek osh-Sho'ara title he received in 1903 after his father, his constitutionalist newspapers, his Majlis deputyships, his Tehran University professorship, and his works headed by Sabk-shenasi."
