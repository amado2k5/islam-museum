summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمدتقي بهار؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 10 ديسمبر 1886 في مشهد ووفاته في طهران سنة 1951، ولقبه ملك الشعراء الذي ناله سنة 1903 خلفًا لأبيه، وصحفه الدستورية ونيابته في المجلس وأستاذيته في جامعة طهران ومؤلفاته وعلى رأسها «سبك‌شناسی»."
  en: "English Wikipedia article on Mohammad-Taqi Bahar; used for entity facts only. It gives his birth on 10 December 1886 in Mashhad and his death in Tehran in 1951, the Malek osh-Sho'ara title he received in 1903 after his father, his constitutionalist newspapers, his Majlis deputyships, his Tehran University professorship, and his works headed by Sabk-shenasi."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad-Taqi Bahar; utilizado únicamente para datos sobre la persona. Menciona su nacimiento el 10 de diciembre de 1886 en Mashhad y su fallecimiento en Teherán en 1951, el título de Malek osh-Sho'ara que recibió en 1903 en honor a su padre, sus periódicos constitucionalistas, sus cargos como diputado del Majlis, su cátedra en la Universidad de Teherán y sus obras encabezadas por Sabk-shenasi."
  fr: "Article de Wikipédia en anglais sur Mohammad-Taqi Bahar; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 10 décembre 1886 à Mashhad et sa mort à Téhéran en 1951, le titre de Malek osh-Sho'ara qu'il a reçu en 1903 après son père, ses journaux constitutionnalistes, ses mandats de député au Majlis, sa chaire à l'Université de Téhéran et ses œuvres dirigées par Sabk-shenasi."
  ur: "محمد تقی بہار پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 10 دسمبر 1886 کو مشہد میں ان کی پیدائش اور 1951 میں تہران میں ان کی موت، ملک اوششعرہ کا لقب اسے 1903 میں اپنے والد، اس کے آئین ساز اخبارات، اس کی مجلس کے نائب، اس کی تہران یونیورسٹی کی پروفیسر شپ، اور سبک شناسی کی سربراہی میں ان کے کاموں کے بعد ملا۔"
