  ar: "مقالة ويكيبيديا العربية عن عشرت حسين؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه مصرفي وخبير اقتصادي باكستاني تولى محافظة بنك الدولة في 1999–2006 وعمادة معهد إدارة الأعمال في 2008–2016، وتذكر مولده في الله آباد — خلافًا للإنجليزية وويكيبيانات اللتين تعطيان أغرا — وانتقاله إلى كراتشي سنة 1947 ودراساته في ويليامز وبوسطن وعمله في البنك الدولي."
  en: "Arabic Wikipedia article on Ishrat Husain; used for entity facts only. It describes him as a Pakistani banker and economist, governor of the State Bank 1999–2006 and dean of IBA 2008–2016, gives his birthplace as Allahabad — against the English article and Wikidata, which give Agra — and recounts his move to Karachi in 1947, his Williams and Boston studies and his World Bank career."
