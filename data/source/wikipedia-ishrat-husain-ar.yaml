summary:
  ar: "مقالة ويكيبيديا العربية عن عشرت حسين؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه مصرفي وخبير اقتصادي باكستاني تولى محافظة بنك الدولة في 1999–2006 وعمادة معهد إدارة الأعمال في 2008–2016، وتذكر مولده في الله آباد — خلافًا للإنجليزية وويكيبيانات اللتين تعطيان أغرا — وانتقاله إلى كراتشي سنة 1947 ودراساته في ويليامز وبوسطن وعمله في البنك الدولي."
  en: "Arabic Wikipedia article on Ishrat Husain; used for entity facts only. It describes him as a Pakistani banker and economist, governor of the State Bank 1999–2006 and dean of IBA 2008–2016, gives his birthplace as Allahabad — against the English article and Wikidata, which give Agra — and recounts his move to Karachi in 1947, his Williams and Boston studies and his World Bank career."
  es: "Artículo en árabe de la Wikipedia sobre Ishrat Husain; utilizado únicamente para obtener información sobre la persona. Lo describe como un banquero y economista pakistaní, gobernador del Banco Estatal entre 1999 y 2006 y decano de la IBA entre 2008 y 2016, indica que su lugar de nacimiento fue Allahabad —en contradicción con el artículo en inglés y Wikidata, que indican Agra— y relata su traslado a Karachi en 1947, sus estudios en Williams y Boston y su trayectoria profesional en el Banco Mundial."
  fr: "Article de Wikipédia en arabe sur Ishrat Husain; utilisé uniquement pour les informations sur l’entité. Il le décrit comme un banquier et économiste pakistanais, gouverneur de la Banque d’État de 1999 à 2006 et doyen de l’IBA de 2008 à 2016, indique Allahabad comme son lieu de naissance — contrairement à l’article en anglais et à Wikidata, qui mentionnent Agra — et relate son installation à Karachi en 1947, ses études à Williams et à Boston, ainsi que sa carrière à la Banque mondiale."
  ur: "عشرت حسین پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے ایک پاکستانی بینکر اور ماہر اقتصادیات، اسٹیٹ بینک 1999-2006 کے گورنر اور IBA 2008-2016 کے ڈین کے طور پر بیان کیا گیا ہے، انگریزی مضمون اور Wikidata کے خلاف، جو آگرہ دیتا ہے، اس کی جائے پیدائش الہ آباد بتاتا ہے اور 1947 میں کراچی منتقل ہونے کے بارے میں بتاتا ہے، اس کے ولیمز اور بوسٹن کی دیکھ بھال کے لیے ان کے ورلڈ بینک کی تعلیم۔"
  tr: "Ishrat Hussain hakkında Arapça Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. 1999–2006 yılları arasında Devlet Bankası başkanı ve 2008-2016 yılları arasında İşletme Enstitüsü dekanı olarak görev yapmış Pakistanlı bir bankacı ve ekonomi uzmanı olarak tanımlanır. Makalede, Allahabad'daki doğumundan bahsedilmektedir—İngilizce ve Wikipedia'nın aksine, ki onlar bir gragra sunar—ve 1947'de Karaçi'ye taşınmasından, Williams ve Boston'daki eğitimlerinden ve Dünya Bankası'ndaki çalışmalarından bahsedilmektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang Ishrat Hussain; digunakan hanya untuk fakta entitas. Ia digambarkan sebagai bankir dan ahli ekonomi Pakistan yang menjabat sebagai gubernur Bank Negara dari 1999–2006 dan dekan Institute of Business Administration dari 2008 hingga 2016. Artikel tersebut menyebutkan kelahirannya di Allahabad—berbeda dengan bahasa Inggris dan Wikipedia yang memberikan gragra—dan kepindahannya ke Karachi pada tahun 1947, studinya di Williams dan Boston, serta pekerjaannya di Bank Dunia."
