  fr: "Article Wikipédia en arabe sur Khalfan Ibrahim; utilisé uniquement à titre informatif. Il indique son nom complet: Khalfan Ibrahim Khalfan Al Khalfan, sa date de naissance: 18 février 1988, et son titre de Joueur asiatique de l’année 2006. Aucune mention n’est faite de sa religion."
  ur: "خلفان ابراہیم پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا پورا نام خلفان ابراہیم خلفان الخلفان بتایا گیا ہے، ان کی پیدائش 18 فروری 1988 کو ہوئی تھی اور 2006 کا ایشین پلیئر آف دی ایئر کا ایوارڈ ہے۔ اس کے مذہب کے بارے میں کوئی بیان نہیں ہے۔"
