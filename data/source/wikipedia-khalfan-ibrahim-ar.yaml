  ar: "مقالة ويكيبيديا العربية عن خلفان إبراهيم؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل خلفان إبراهيم خلفان آل خلفان وميلاده في 18 فبراير 1988 وفوزه بجائزة أفضل لاعب في آسيا سنة 2006. ولا تذكر ديانته."
  en: "Arabic Wikipedia article on Khalfan Ibrahim; used for entity facts only. It gives his full name as Khalfan Ibrahim Khalfan Al Khalfan, his birth on 18 February 1988 and his 2006 Asian Player of the Year award. It makes no statement about his religion."
