summary:
  ar: "الموقع الرسمي لمشروع «حلال بيتس» (halalbeats.com) الذي تربطه قناته على يوتيوب؛ يعرض أحدث إصداراته ومتجره وأرقام انتشاره المعلنة، ويحيل بيع المقاطع إلى موقع «حلال ساوندتراكس»."
  en: "The official website of the Halal Beats project (halalbeats.com), linked from his YouTube channel; it presents his latest releases and merchandise, publishes the project's reach figures, and routes beat sales to the Halal Soundtracks site."
  es: "El sitio web oficial del proyecto Halal Beats (halalbeats.com), con enlace desde su canal de YouTube, presenta sus últimos lanzamientos y productos, publica las cifras de alcance del proyecto y redirige las ventas de ritmos al sitio web de Halal Soundtracks."
  fr: "Le site officiel du projet Halal Beats (halalbeats.com), accessible depuis sa chaîne YouTube, présente ses dernières sorties et produits dérivés, publie les chiffres de portée du projet et redirige les ventes de beats vers le site Halal Soundtracks."
  ur: "حلال بیٹس پروجیکٹ کی آفیشل ویب سائٹ (halalbeats.com)، جو اس کے یوٹیوب چینل سے منسلک ہے۔ یہ اپنی تازہ ترین ریلیز اور تجارتی سامان پیش کرتا ہے، پراجیکٹ کی رسائی کے اعداد و شمار شائع کرتا ہے، اور راستے حلال ساؤنڈ ٹریکس سائٹ پر فروخت کو مات دیتا ہے۔"
