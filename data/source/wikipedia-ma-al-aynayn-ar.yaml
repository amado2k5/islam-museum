reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: his name is Sidi al-Mustafa, given by his father after the father's own shaykh Sidi al-Mustafa ibn Uthman, and 'calling him Muhammad al-Mustafa, as is common, is an error' — the correction the record adopts, keeping the common form as a variant; born Tuesday 27 Sha'ban 1246 AH, which converts exactly to 10 February 1831 (the year the French article gives as 'about 1831' and Wikidata's day-precision claim as 1831-02-10; the English and Spanish articles give 1830 — recorded as a conflict, the record following 1831); died 17 Shawwal 1328 AH, which the article pairs with 25 October 1910 although the Hijri date converts to about 21–22 October — the English and French articles and Wikidata give 23 October 1910, which the record follows, recording the Arabic article's pairing as a conflict; he memorised the Qur'an and took his sciences from his father 'and was influenced by him in the aspect of tasawwuf'; he taught without ceasing, his murids exceeding ten thousand, and taught his murids the tariqas of al-Qadiriyya and al-Tijaniyya among others 'as they chose' — his own path being the Fadili line from his father; his sons inherited 'his jihadist and Sufi call'; he founded the city of Smara in 1316 AH/1898 under Sultan Abd al-Aziz; on the Hijra to Tiznit in 1908 he was followed by some five thousand people; his writings listed include Dallil al-rifaq, Fatiq al-ratq and Adab al-murid, and the article notes that many of his books were burned in the Franco-Spanish attack on Smara. The article's long nasab genealogy is not reproduced, and no honorific appearing within it is typed in the museum record."
