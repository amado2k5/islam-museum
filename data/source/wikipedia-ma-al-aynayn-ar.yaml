summary:
  ar: "مقالة ويكيبيديا العربية عن ماء العينين القلقمي؛ تُستخدم لوقائع الكيان فقط. تصحّح اسمه إلى «سيدي المصطفى» لا محمد المصطفى، وتعطي ميلاده بتاريخ هجري دقيق (الثلاثاء 27 شعبان 1246 هـ) ووفاته في 17 شوال 1328 هـ، وتذكر تربيته الصوفية على يد أبيه ومريديه الذين تجاوزوا عشرة آلاف."
  en: "Arabic Wikipedia article on Ma al-'Aynayn al-Qalqami; used for entity facts only. It corrects his name to Sidi al-Mustafa, not Muhammad al-Mustafa, gives his birth by an exact Hijri date (Tuesday 27 Sha'ban 1246 AH) and his death on 17 Shawwal 1328 AH, and records his Sufi formation under his father and his more than ten thousand murids."
