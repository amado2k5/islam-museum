  ar: "تقرير عن حكم محكمة جنح مصر القديمة بانقضاء دعوى شيك ضده بعد التصالح."
  en: "Report that the Misr El-Qadima misdemeanour court ruled a cheque case against him extinguished after reconciliation."
  es: "Según se informa, el tribunal de delitos menores de Misr El-Qadima dictaminó que la causa por el cheque en su contra había sido extinguida tras la reconciliación."
