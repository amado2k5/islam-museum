reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision, resting on Paul Marty, Études sur l'Islam maure (1916), Rahal Boubrik, Saints et sociétés en Islam: la confrérie ouest-saharienne Fâdiliyya (1999), Guy Thilmans, and the census of his works by Abdel Wedoud Ould Cheikh. It gives his birth in 1848 in the Hodh and his death on 12 July 1917 — 'the 22nd day of Ramadan' — at Nimjat in the Trarza; makes him the thirty-first son of Muhammad Fadil, founder of the Fadiliyya, and the brother of Ma al-'Aynayn; records his consecration of sheikhs across West Africa (664 in Talibouya Niang's count), his recognition by 1888 as the Fadiliyya's sole representative in Senegal, the Maliki curriculum of his Nimjat centre, and his Nasiha of 1906 to his brother against the jihad."
