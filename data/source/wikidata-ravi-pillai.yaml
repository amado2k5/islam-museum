summary:
  ar: "عنصر ويكي بيانات Q4834180 عن رافي بيلاي: يذكر ميلاده في 2 أيلول 1953 في تشافارا، ويحمل أيضاً بيان ميلاد منافساً بتاريخ 25 أيار 1950، وبيان دين ⁦(الهندوسية)⁩ من البيانات المنظمة."
  en: "Wikidata item Q4834180 for Ravi Pillai; it gives his birth as 2 September 1953 at Chavara, carries a rival birth statement of 25 May 1950, and carries a Hinduism religion statement as structured data."
  es: "El elemento de Wikidata Q4834180 para Ravi Pillai; indica que nació el 2 de septiembre de 1953 en Chavara, contiene una declaración de nacimiento rival del 25 de mayo de 1950 y contiene una declaración de religión hindú como datos estructurados."
  fr: "L'élément Wikidata Q4834180 pour Ravi Pillai; il indique sa naissance le 2 septembre 1953 à Chavara, comporte une déclaration de naissance concurrente du 25 mai 1950 et comporte une déclaration de religion hindoue en tant que données structurées."
  ur: "روی پلئی کے لیے ویکی ڈیٹا آئٹم Q4834180؛ اس کی پیدائش 2 ستمبر 1953 کو چاوارہ میں ہوئی ہے، اس میں 25 مئی 1950 کا ایک حریف پیدائش کا بیان ہے، اور ساختی اعداد و شمار کے طور پر ہندو مذہب کا بیان ہے۔"
  tr: "Ravi Pillai hakkında Wikidata maddesi Q4834180: 2 Eylül 1953'te Chavara'da doğduğu listelenmiş, ayrıca 25 Mayıs 1950 tarihli rakip bir doğum beyanı ve organize verilerden bir din (Hinduizm) beyanı taşımaktadır."
  id: "Item Wikidata Q4834180 tentang Ravi Pillai: Ia tercatat lahir pada 2 September 1953 di Chavara, dan juga membawa pernyataan kelahiran bersaing bertanggal 25 Mei 1950, serta pernyataan agama (Hindu) dari data terorganisir."
