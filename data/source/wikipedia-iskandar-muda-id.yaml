summary:
  ar: "مقالة ويكيبيديا الإندونيسية المطوّلة عن إسكندر مودا؛ تستعرض خلاف المؤرخين حول سنة ولادته (1583–1593) وتجعل دينه «الإسلام السني» وتؤرخ وفاته بـ29 رجب 1046هـ."
  en: "Long Indonesian Wikipedia article on Iskandar Muda; it surveys the scholarly disagreement over his birth year (1583–1593), gives his religion as Sunni Islam, and pairs his death with 29 Rajab 1046 AH."
  es: "Artículo extenso de la Wikipedia en indonesio sobre Iskandar Muda; examina el desacuerdo académico sobre su año de nacimiento (1583-1593), indica que su religión era el islam sunita y sitúa su muerte el 29 de Rajab de 1046 AH."
  fr: "Long article de Wikipédia indonésien sur Iskandar Muda; il passe en revue le désaccord des érudits sur son année de naissance (1583-1593), indique sa religion comme étant l'islam sunnite et associe sa mort au 29 Rajab 1046 AH."
  ur: "اسکندر مودا پر طویل انڈونیشین ویکیپیڈیا مضمون؛ اس میں ان کے سال پیدائش (1583-1593) کے بارے میں علمی اختلاف کا جائزہ لیا گیا ہے، اس کے مذہب کو سنی اسلام قرار دیا گیا ہے، اور ان کی وفات کو 29 رجب 1046 ہجری کے ساتھ جوڑا گیا ہے۔"
  tr: "İskandar Muda hakkında kapsamlı Endonezya Vikipedi makalesi, farklı tarihçileri doğum yılı (1583–1593) ile ilgili olarak inceler, dinini 'Sünni İslam' olarak kabul eder ve ölümünü 29 Recep 1046 Hicri tarihine tarihler."
  id: "Artikel Wikipedia Indonesia yang luas tentang Iskandar Muda mengulas berbagai sejarawan mengenai tahun kelahirannya (1583–1593), menganggap agamanya sebagai 'Islam Sunni,' dan mencatat kematiannya pada 29 Rajab 1046 H."
