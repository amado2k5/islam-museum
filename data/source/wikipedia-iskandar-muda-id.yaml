reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 31 October 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). An extensive modern treatment (Lombard, Teuku Iskandar, Hadi, Reid). Its birth-year section lists 1583, 1588, 1590, 1591 and 1593 in modern works and a court document's 12 Rabi' al-awwal 999 AH whose conversion is chronologically problematic; its infobox religion field reads 'Islam Sunni' (Sunni Islam), naming the branch but no legal school; it dates his death to 27 December 1636, paired in the royal chronology with 29 Rajab 1046 AH."
