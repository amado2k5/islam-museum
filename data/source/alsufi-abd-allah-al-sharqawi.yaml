summary:
  ar: "ترجمة عبد الله الشرقاوي في موقع الصوفية (alsufi.net) ضمن أعلام الصوفية في القرن الثالث عشر الهجري؛ تنصّ على أنه «نبغ في الفقه الشافعي واللغة والمنطق» وأنه «كان شيخاً للطريقة الخلوتية» وتذكر حاشيته على تحرير تنقيح اللباب في الفقه الشافعي، وتوليه مشيخة الأزهر سنة 1208 هـ ووفاته بالقاهرة سنة 1227 هـ."
  en: "Biography of Abd Allah al-Sharqawi on the alsufi.net Sufi site, among its 'notables of Sufism in the thirteenth Hijri century'; it states that 'he excelled in Shafi'i fiqh, language and logic' and that 'al-Sharqawi was a shaykh of the Khalwati order', lists his hashiya on Tahrir Tanqih al-Lubab (in Shafi'i fiqh), his rectorship of al-Azhar from 1208 AH and his death in Cairo in 1227 AH."
