reliability_note: "Devotional Sufi biography site, read in full on 3 November 2026; its honorific page title is a URL string, not museum text. Independent of the Wikipedia articles, it is the second text attesting the Shafi'i school for the man himself, in its own words: «نبغ في الفقه الشافعي واللغة والمنطق» and his «حاشية على تحرير تنقيح اللباب (في الفقه الشافعي)». The classical biographical dictionary Hilyat al-Bashar corroborates with the nisba «عبد الله بن حجازي بن إبراهيم الشافعي الأزهري الشهير بالشرقاوي». Used for the school attestation and the Khalwati affiliation, with devotional colouring discounted."
