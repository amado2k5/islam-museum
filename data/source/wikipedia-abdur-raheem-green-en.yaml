  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرحيم غرين؛ تُستخدم لوقائع الكيان فقط. تروي مولده في دار السلام سنة 1964 باسم أنتوني واتسواف غافن غرين، ونشأته الكاثوليكية، واعتناقه الإسلام سنة 1988، ودعوته في ركن الخطباء، ورئاسته منظمة آيَرا التي أسسها."
  en: "English Wikipedia article on Abdur Raheem Green; used for entity facts only. It recounts his birth in Dar es Salaam in 1964 as Anthony Waclaw Gavin Green, his Roman Catholic upbringing, his embrace of Islam in 1988, his Speakers' Corner dawah, and his chairmanship of the iERA he founded."
