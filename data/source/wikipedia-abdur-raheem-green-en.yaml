reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026, fetched by its recorded revision id and the returned revision asserted equal before any claim was drawn. The article gives his birth name as Anthony Waclaw Gavin Green and his birth as September 1964 in Dar es Salaam, citing Companies House; his father a colonial administrator, his mother Polish; raised Roman Catholic and educated at Ampleforth College; he embraced Islam in 1988; he is chairman of iERA. For faith: the infobox gives his denomination as 'Sunni' without a cited source in the text, and the article's categories file him under 'British Sunni Muslims' and 'Converts to Sunni Islam from Catholicism' — one article's filings, not independent attestation. The article's text quotes the academic Innes Bowen (Medina in Birmingham, Najaf in Brent): 'He remained a Salafi but became a popular speaker at events organised by a wide range of Islamic organizations' — a scholarly movement description naming no legal school; it also cites Sadek Hamid's Sufis, Salafis and Islamists for him."
