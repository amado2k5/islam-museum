summary:
  ar: "صفحة «Al-Qāmūs al-Muḥīṭ» في ويكيبيديا الإنجليزية، وهي الصفحة الموثِّقة التي سماها ملخص بحثي قُدّم إلى المتحف للكتاب «القاموس المحيط»؛ لم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص دون إعادة تحقق في 21 نوفمبر 2026، في موضوع: نسبة الكتاب إلى مؤلفه وتاريخه."
  en: "The page \"Al-Qāmūs al-Muḥīṭ\" on the English Wikipedia, named by a research summary supplied to the museum as the documenting page for al-Qamus al-Muhit; the museum did not open the page, and the founder approved using the summary without re-verification on 21 November 2026, for the ascription of the work to its author and its date."
  ur: "انگریزی ویکیپیڈیا پر صفحہ «Al-Qāmūs al-Muḥīṭ»، جسے عجائب گھر کو دیے گئے ایک تحقیقی خلاصے نے «القاموس المحیط» کا مستند صفحہ بتایا؛ عجائب گھر نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصے کے استعمال کی منظوری دی، موضوع: کتاب کی مصنف سے نسبت اور اس کی تاریخ۔"
  fr: "La page « Al-Qāmūs al-Muḥīṭ » de Wikipédia (anglaise), nommée par un résumé de recherche remis au musée comme page documentaire de al-Qamus al-Muhit ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé sans nouvelle vérification le 21 novembre 2026, pour l'attribution de l'ouvrage à son auteur et sa date."
  es: "La página «Al-Qāmūs al-Muḥīṭ» de Wikipedia (en inglés), nombrada por un resumen de investigación entregado al museo como página documental de al-Qamus al-Muhit; el museo no abrió la página, y el fundador aprobó usar el resumen sin nueva verificación el 21 de noviembre de 2026, para la atribución de la obra a su autor y su fecha."
  tr: "İngilizce Vikipedi'deki \"Al-Qāmūs al-Muḥīṭ\" sayfası, \"Al-Qamus Al-Muheet\" kitabı için müzeye sunulan araştırma özeti olarak belgelenmiş bir sayfadır; müze sayfayı açmamış ve kurucu, 21 Kasım 2026'da özetin yeniden doğrulama olmaksızın kullanımına izin vermiştir: kitabın yazarına ve tarihine atfedilmesi."
  id: "Halaman \"Al-Qāmūs al-Muḥīṭ\" di Wikipedia bahasa Inggris, yang merupakan halaman terdokumentasi yang disebut ringkasan penelitian yang dikirim ke museum untuk buku \"Al-Qamus Al-Muheet\"; museum tidak membuka halaman tersebut, dan pendiri mengizinkan penggunaan ringkasan tanpa verifikasi ulang pada 21 November 2026, dengan topik: atribusi buku kepada penulisnya dan sejarahnya."
