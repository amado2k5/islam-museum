summary:
  ar: "عنصر ويكيداتا Q17057111 لابن الإمام شامل؛ يُستخدم للمعرّفات والوقائع المنظّمة فقط. يذكر مولده سنة 1833 ووفاته سنة 1902 في المدينة وقيمة والده Q244742 ⁦(الإمام شامل)⁩، ولا يحمل أي قيمة للدين؛ واسمه الإنجليزي «غازي محمد» ملتبس بعنصر الإمام الأول."
  en: "Wikidata item Q17057111 for Imam Shamil's son; used for identifiers and structured facts only. It gives his birth in 1833, his death in 1902 at Medina and his father as Q244742 (Imam Shamil), and carries no religion value; its English label 'Gazi Muhammad' is ambiguous with the first imam's item, so grounding was done from the article's page properties."
  es: "El elemento de Wikidata Q17057111 corresponde al hijo del Imam Shamil; se utiliza únicamente para identificadores y datos estructurados. Indica su nacimiento en 1833, su fallecimiento en 1902 en Medina y a su padre como Q244742 (Imam Shamil), y carece de valor religioso. Su etiqueta en inglés, «Gazi Muhammad», resulta ambigua en comparación con el elemento del primer imán, por lo que la información se obtuvo de las propiedades de la página del artículo."
  fr: "L'élément Wikidata Q17057111 concerne le fils de l'imam Chamil; il sert uniquement d'identifiant et de données structurées. Il indique sa naissance en 1833, son décès en 1902 à Médine et mentionne son père comme étant l'imam Chamil (Q244742). Il ne comporte aucune information religieuse. Son libellé anglais « Gazi Muhammad » est ambigu avec l'élément concernant le premier imam; le référencement a donc été effectué à partir des propriétés de la page de l'article."
  ur: "وکی ڈیٹا آئٹم Q17057111 امام شامل کے بیٹے کے لیے؛ صرف شناخت کنندگان اور ساختی حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1833 میں ان کی پیدائش، 1902 میں مدینہ میں ان کی موت اور ان کے والد Q244742 ⁦(امام شمل)⁩ کے طور پر پیش کرتا ہے، اور مذہب کی کوئی اہمیت نہیں رکھتا۔ اس کا انگریزی لیبل 'غازی محمد' پہلے امام کے آئٹم کے ساتھ مبہم ہے، اس لیے مضمون کے صفحہ کی خصوصیات سے گراؤنڈ کیا گیا۔"
