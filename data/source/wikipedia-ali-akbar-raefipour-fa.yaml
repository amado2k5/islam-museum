reliability_note: "Read in full on 7 November 2026; the reading tools available in this run did not expose a revision id, so none is recorded. Used for the exact birth date and place (8 Ordibehesht 1363 in Tehran, i.e. 28 April 1984, stated in the infobox and the Personal life section), for his bachelor's degree in accounting from Payame Noor University, for the statement that he has no seminary education and that his interest in religious questions traces to his two grandfathers, who were mosque prayer leaders (family background, recorded as biography only, never as faith evidence), for the founding of the Masaf Iranians Institute in Bahman 1389 SH (January–February 2011 — the English article gives June 2011, so the record says only 'in 2011'), for the institute's name as an acronym of 'Combating Zionism, Humanism and Freemasonry', for its Mahdism unit among its units, and for his secretary-generalship of the Sobh-e Iran (Morning of Iran) Front. The article's prose nowhere attests a school or order for the man himself; his lecture topics are milieu, not attestation."
