summary:
  ar: "مقالة ويكيبيديا العربية عن سامي خضيرة؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في شتوتغارت سنة 1987 من أب تونسي وأم ألمانية، ومسيرته مع شتوتغارت وريال مدريد ويوفنتوس وهرتا برلين ومنتخب ألمانيا، ولا تذكر دينه في أي موضع."
  en: "Arabic Wikipedia article on Sami Khedira; used for entity facts only. It gives his birth in Stuttgart in 1987 to a Tunisian father and a German mother, and his career at Stuttgart, Real Madrid, Juventus, Hertha BSC and the Germany national team; it makes no statement of his religion anywhere."
  es: "Artículo de Wikipedia en árabe sobre Sami Khedira; utilizado únicamente para obtener información sobre la persona. Indica que nació en Stuttgart en 1987, hijo de padre tunecino y madre alemana, y que desarrolló su carrera en el Stuttgart, el Real Madrid, la Juventus, el Hertha BSC y la selección alemana; no menciona su religión en ningún momento."
  fr: "L'article de Wikipédia en arabe consacré à Sami Khedira, utilisé uniquement pour des informations factuelles, indique sa naissance à Stuttgart en 1987 d'un père tunisien et d'une mère allemande, ainsi que sa carrière à Stuttgart, au Real Madrid, à la Juventus, au Hertha Berlin et en équipe nationale d'Allemagne. Sa religion n'est mentionnée nulle part."
  ur: "عربی ویکیپیڈیا مضمون سامی کھدیرا پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے اس کی پیدائش 1987 میں سٹٹ گارٹ میں ایک تیونس کے والد اور ایک جرمن ماں کے ہاں ہوئی، اور اس کا کیریئر سٹٹ گارٹ، ریئل میڈرڈ، یووینٹس، ہیرتھا بی ایس سی اور جرمنی کی قومی ٹیم میں؛ یہ کہیں بھی اپنے مذہب کا بیان نہیں کرتا۔"
