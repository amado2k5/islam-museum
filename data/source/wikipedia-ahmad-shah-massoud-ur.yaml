summary:
  ar: "مقالة ويكيبيديا الأردية عن أحمد شاه مسعود؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 2 سبتمبر 1953 في بازارك ببنجشير ووفاته في 9 سبتمبر 2001، ومقاومته للسوفيت ووزارته للدفاع وقيادته لتحالف الشمال ولقبه بعد وفاته بطلاً وطنياً. يقول متنها إنه كان طاجيكي النسل سني المسلك، بينما يعطي صندوق معلوماتها دينه «الإسلام» عموماً."
  en: "Urdu Wikipedia article on Ahmad Shah Massoud; used for entity facts only. It gives his birth on 2 September 1953 at Bazarak, Panjshir, and his death on 9 September 2001, his resistance to the Soviets, his defence ministry, his leadership of the Northern Alliance and his posthumous national-hero title. Its text states that he was Tajik by descent and Sunni by maslak (school); its infobox gives his religion generically as Islam."
  ur: "احمد شاہ مسعود پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 2 ستمبر 1953ء کو بازارک، پنجشیر میں ان کی پیدائش اور 9 ستمبر 2001ء کو ان کی وفات، سوویتوں کے خلاف ان کی مزاحمت، ان کی وزارت دفاع، شمالی اتحاد کی قیادت اور وفات کے بعد قومی ہیرو کا خطاب بیان ہوا ہے۔ اس کے متن کے مطابق وہ نسلاً تاجک اور مسلکاً سنی تھے؛ اس کے معلوماتی خانے میں ان کا مذہب عمومی طور پر اسلام درج ہے۔"
  es: "Artículo de Wikipedia en urdu sobre Ahmad Shah Massoud; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 2 de septiembre de 1953 en Bazarak, Panjshir, y su fallecimiento el 9 de septiembre de 2001, su resistencia a los soviéticos, su ministerio de defensa, su liderazgo de la Alianza del Norte y su título póstumo de héroe nacional. El texto afirma que era tayiko de ascendencia y sunita según la escuela (maslak); el recuadro informativo indica que su religión era genéricamente el islam."
  fr: "Article de Wikipédia en ourdou sur Ahmad Shah Massoud; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 2 septembre 1953 à Bazarak, dans le Panjshir, et sa mort le 9 septembre 2001, sa résistance aux Soviétiques, son ministère de la Défense, son rôle à la tête de l’Alliance du Nord et son titre posthume de héros national. Le texte précise qu’il était d’origine tadjike et sunnite; l’infobox indique que sa religion était l’islam."
  tr: "Ahmed Şah Mesud hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 2 Eylül 1953'te Bazarek, Panjshir'de doğumunu ve 9 Eylül 2001'deki ölümünü anlatır; Sovyetlere direnişini, Savunma Bakanlığı'nı, Kuzey İttifakı'nın liderliğini ve ölümünden sonra ulusal kahraman unvanını alır. Metinde Sünni Tacik kökenli olduğu belirtilirken, bilgi kutusu genel olarak dinini \"İslam\" olarak belirtir."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Ahmad Shah Massoud; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 2 September 1953 di Bazarek, Panjshir, dan kematiannya pada 9 September 2001, perlawanannya terhadap Soviet, Kementerian Pertahanannya, kepemimpinannya di Aliansi Utara, dan gelar anumerta sebagai pahlawan nasional. Teks tersebut menyatakan bahwa ia berasal dari Sunni Tajik, sementara kotak infonya mencantumkan agamanya sebagai \"Islam\" secara umum."
