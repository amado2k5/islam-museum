summary:
  ar: "مقالة ويكيبيديا الأردية عن أحمد شاه مسعود؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 2 سبتمبر 1953 في بازارك ببنجشير ووفاته في 9 سبتمبر 2001، ومقاومته للسوفيت ووزارته للدفاع وقيادته لتحالف الشمال ولقبه بعد وفاته بطلاً وطنياً. يقول متنها إنه كان طاجيكي النسل سني المسلك، بينما يعطي صندوق معلوماتها دينه «الإسلام» عموماً."
  en: "Urdu Wikipedia article on Ahmad Shah Massoud; used for entity facts only. It gives his birth on 2 September 1953 at Bazarak, Panjshir, and his death on 9 September 2001, his resistance to the Soviets, his defence ministry, his leadership of the Northern Alliance and his posthumous national-hero title. Its text states that he was Tajik by descent and Sunni by maslak (school); its infobox gives his religion generically as Islam."
  ur: "احمد شاہ مسعود پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 2 ستمبر 1953ء کو بازارک، پنجشیر میں ان کی پیدائش اور 9 ستمبر 2001ء کو ان کی وفات، سوویتوں کے خلاف ان کی مزاحمت، ان کی وزارت دفاع، شمالی اتحاد کی قیادت اور وفات کے بعد قومی ہیرو کا خطاب بیان ہوا ہے۔ اس کے متن کے مطابق وہ نسلاً تاجک اور مسلکاً سنی تھے؛ اس کے معلوماتی خانے میں ان کا مذہب عمومی طور پر اسلام درج ہے۔"
