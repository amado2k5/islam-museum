  en: "English Wikipedia article on Salama Moussa; used for entity facts only. It recounts his birth in 1887 into a Coptic family near Zagazig, his avowed secularism, his introduction of Darwin, Nietzsche and Freud to Egyptian readers, his magazines and books, and his death at Cairo in 1958."
