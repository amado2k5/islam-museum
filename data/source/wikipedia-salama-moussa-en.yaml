reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): the biographical statements rest chiefly on Goldschmidt's Biographical Dictionary of Modern Egypt (p. 139) and the Encyclopedia of Arabic Literature. Fetched by recorded revision 1371555779 and the returned revision asserted equal before any claim was drawn. The text says he was born into a Coptic family — a statement about his family — and describes him personally as an avowed secularist who campaigned against traditional religions. Its infobox gives his birthplace as Cairo against its own text, which names a village near Zagazig. Its categories file him under 'Egyptian Copts' and 'Egyptian critics of religions', filings, not attestations."
