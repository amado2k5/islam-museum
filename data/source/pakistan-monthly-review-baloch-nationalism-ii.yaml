  ar: "مقال مير محمد علي تالپور «نشأة القومية والمقاومة البلوشية – 2» في «باكستان منثلي ريفيو»: مقال يوسف عزيز مگسي «فرياد بلوشستان» سنة 1929 في صحيفة «مساواة» وغرامته وسجنه سنة، وإعلان أنجمن اتحاد بلوشستان أثناء سجنه، ومهمته إلى بريطانيا، ووفاته في زلزال كويته في 31 مايو 1935."
  en: "Mir Mohammad Ali Talpur's 'The Rise of Baloch Nationalism and Resistance – II' in Pakistan Monthly Review: Yusuf Aziz Magsi's 1929 article 'Faryaad-e-Balochistan' in the Lahore newspaper Musawat, his fine and year's imprisonment, the announcement of the Anjuman-e-Itehad-e-Balochistan while he was in Quetta jail, his sovereignty mission to Britain, and his death in the Quetta earthquake of 31 May 1935."
