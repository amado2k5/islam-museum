reliability_note: >-
  A partisan nationalist history essay, read in full on 31 October
  2026; its standpoint is declared and its loaded characterisations
  are not used. It is used only for factual details it states
  plainly and that fit the rest of the batch's evidence: Magsi's
  1929 article, fine and year's imprisonment (another retelling
  gives a different fine, so no amount is carried into the record),
  the Anjuman's announcement during his imprisonment, his mission
  to Britain, and his death in the Quetta earthquake of 31 May
  1935. It also independently fits the Kalat succession (Azam Jan
  Khan in December 1931; Ahmad Yar Khan succeeding on 10 September
  1933).
