summary:
  ar: "مقال مير محمد علي تالپور «نشأة القومية والمقاومة البلوشية – 2» في «باكستان منثلي ريفيو»: مقال يوسف عزيز مگسي «فرياد بلوشستان» سنة 1929 في صحيفة «مساواة» وغرامته وسجنه سنة، وإعلان أنجمن اتحاد بلوشستان أثناء سجنه، ومهمته إلى بريطانيا، ووفاته في زلزال كويته في 31 مايو 1935."
  en: "Mir Mohammad Ali Talpur's 'The Rise of Baloch Nationalism and Resistance – II' in Pakistan Monthly Review: Yusuf Aziz Magsi's 1929 article 'Faryaad-e-Balochistan' in the Lahore newspaper Musawat, his fine and year's imprisonment, the announcement of the Anjuman-e-Itehad-e-Balochistan while he was in Quetta jail, his sovereignty mission to Britain, and his death in the Quetta earthquake of 31 May 1935."
  es: "El artículo de Mir Mohammad Ali Talpur, 'El auge del nacionalismo y la resistencia baluchi – II', en Pakistan Monthly Review: el artículo de Yusuf Aziz Magsi de 1929, 'Faryaad-e-Balochistan', en el periódico Musawat de Lahore, su multa y un año de prisión, el anuncio de la Anjuman-e-Itehad-e-Balochistan mientras estaba en la cárcel de Quetta, su misión de soberanía a Gran Bretaña y su muerte en el terremoto de Quetta del 31 de mayo de 1935."
  fr: "L'article de Mir Mohammad Ali Talpur intitulé « La montée du nationalisme et de la résistance baloutches – II » dans Pakistan Monthly Review: l'article de Yusuf Aziz Magsi de 1929 intitulé « Faryaad-e-Balochistan » dans le journal Musawat de Lahore, son amende et son année d'emprisonnement, l'annonce de l'Anjuman-e-Itehad-e-Balochistan alors qu'il était en prison à Quetta, sa mission de souveraineté en Grande-Bretagne et sa mort lors du tremblement de terre de Quetta le 31 mai 1935."
  ur: "میر محمد علی تالپور کا 'بلوچ قوم پرستی اور مزاحمت کا عروج - II' پاکستان میں ماہنامہ جائزہ: یوسف عزیز مگسی کا 1929 کا مضمون 'فریاد بلوچستان' لاہور کے اخبار مصطفے میں، ان کا جرمانہ اور سال قید، انجمن اتحاد بلوچستان کا اعلان جب کہ وہ قائد حزب اختلاف میں تھے۔ برطانیہ میں خودمختاری کا مشن، اور 31 مئی 1935 کو کوئٹہ کے زلزلے میں ان کی موت۔"
