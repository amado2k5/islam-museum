reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision, resting on John E. Woods, The Timurid Dynasty: A Handbook, vol. I: Timur and His Family (Brill, 2026) and on H. R. Roemer, 'The Successors of Timur', in The Cambridge History of Iran, vol. 6 (1986). It dates his birth at Herat to 24 Jumada II 786 AH (13 August 1384), names his parents Miran Shah and Sevin Beg Khanzada, narrates his seizure of Samarkand in 1405, his displacement by Shah Rukh on 13 May 1409 and his governorship of Rayy, and dates his death there to 3 November 1411 — reporting illness in Hafiz-i Abru and the Nusakh-i jahan-ara, Woods's verdict of natural causes, and Ibn Arabshah's poisoning claim, which Woods discounts. It also documents the hostile narrative tradition around his wife Shad Malik Agha and preserves it as such."
