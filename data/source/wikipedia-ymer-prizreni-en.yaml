  ar: "مقال موسوعي عن يمر بريزريني ⁦(نحو 1820–1887)⁩، العالم والخوجة من زغاتار الذي ترأس عصبة بريزرن منذ 1879 وقاد حكومتها المؤقتة ذاتية الحكم سنة 1881، ومات في أولتسيني."
  en: "Encyclopedia article on Ymer Prizreni (c. 1820–1887), the 'alim and hoxha from Zgatar who chaired the League of Prizren from 1879 and headed its Autonomous Provisional Government in 1881, and died at Ulcinj."
  es: "Artículo de enciclopedia sobre Ymer Prizreni (c. 1820–1887), el 'alim y hoxha de Zgatar que presidió la Liga de Prizren desde 1879 y encabezó su Gobierno Provisional Autónomo en 1881, y que murió en Ulcinj."
  fr: "Article d'encyclopédie sur Ymer Prizreni (vers 1820-1887), l''alim et hoxha de Zgatar qui a présidé la Ligue de Prizren à partir de 1879 et dirigé son gouvernement provisoire autonome en 1881, et est décédé à Ulcinj."
  ur: "Ymer Prizreni (c. 1820-1887) پر انسائیکلوپیڈیا کا مضمون، Zgatar کے 'alim and hoxha' جنہوں نے 1879 سے لیگ آف پریزرین کی سربراہی کی اور 1881 میں اس کی خود مختار عارضی حکومت کی سربراہی کی، اور Ulcinj میں انتقال کر گئے۔"
  tr: "1879'dan itibaren Prizren Birliği'ne başkanlık eden, 1881'de geçici özerk hükümetini yöneten ve Ultsini'de ölen Zghatarlı bilgin ve hoca Yemir Prizreny (yaklaşık 1820–1887) hakkında ansiklopedik bir makale."
  id: "Sebuah artikel ensiklopedis tentang Yemir Prizreny (sekitar 1820–1887), seorang cendekiawan dan khoja dari Zghatar yang memimpin Liga Prizren sejak 1879 dan memimpin pemerintahan otonom sementara pada tahun 1881, dan meninggal di Ultsini."
