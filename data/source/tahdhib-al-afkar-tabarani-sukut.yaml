label:
  ar: "فضل الرحمن وعبد الحميد خروب، «منهج الطبراني في السكوت عن الأحاديث المعلولة خلال كتابه المعجم الأوسط»، مجلة تهذيب الأفكار، المجلد 5، العدد 2"
  en: "Fazl al-Rahman and Abd al-Hamid Kharrub, 'The Methodology of Imam al-Tabarani in his Silence on Defective Hadiths in al-Mu'jam al-Awsat', Tahdhib al-Afkar 5:2"
  ur: "فضل الرحمن و عبد الحمید خروب، «منہج الطبرانی فی السکوت عن الاحادیث المعلولۃ خلال کتابہ المعجم الاوسط»، مجلہ تہذیب الافکار، جلد 5، شمارہ 2"
summary:
  ar: "بحث محكّم بالعربية في مجلة «تهذيب الأفكار» ⁦(المجلد 5، العدد 2، يوليو–ديسمبر، ص 207–217)⁩ لفضل الرحمن، الباحث بمرحلة الدكتوراه بقسم الحديث في الجامعة الإسلامية العالمية بإسلام آباد، والدكتور عبد الحميد خروب الأستاذ المشارك بها، يدرس أحاديث سكت عنها الطبراني في «المعجم الأوسط» وينتهي إلى نتائج في منهجه."
  en: "A peer-reviewed Arabic article in Tahdhib al-Afkar (vol. 5, no. 2, July–December, pp. 207–217) by Fazl al-Rahman, doctoral researcher in the Department of Hadith at the International Islamic University, Islamabad, and Dr Abd al-Hamid Kharrub, associate professor there, studying hadiths on which al-Tabarani is silent in al-Mu'jam al-Awsat and drawing conclusions about his method."
