  ar: "مقالة ويكيبيديا العربية عن فياض بن حامد بن رقاد العليمي المرعضي الرويلي ⁦(وُلد في 27 نيسان 1958 في محافظة طريف)⁩، رئيس هيئة الأركان العامة السعودية؛ تذكر نشأته في طريف ودراسته في كلية الملك فيصل الجوية وتدريبه في الولايات المتحدة ومناصبه حتى قيادة القوات الجوية ونائبية رئيس الأركان."
  en: "Arabic Wikipedia article on Fayyadh bin Hamed bin Raqed Al Ruwaili (born 27 April 1958 in Turaif governorate), chairman of the Saudi General Staff; it records his upbringing in Turaif, his studies at King Faisal Air College, his flight training in the United States and his posts up to command of the air force and the deputy chairmanship of the General Staff."
