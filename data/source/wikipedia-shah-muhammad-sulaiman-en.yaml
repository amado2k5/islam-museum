summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شاه محمد سليمان (1886–1941)؛ تُستخدم لوقائع الكيان فقط. قاضٍ وفيزيائي درس في كامبريدج ودبلن، أول هندي يرأس محكمة الله آباد العليا (1932–1937)، ثم قاضٍ في المحكمة الاتحادية، ونائب رئيس جامعة عليكرة الإسلامية (1938–1941)، ودُفن عند ضريح نظام الدين في دلهي."
  en: "English Wikipedia article on Shah Muhammad Sulaiman (1886–1941); used for entity facts only. A Cambridge- and Dublin-educated judge and physicist, the first Indian Chief Justice of the Allahabad High Court (1932–1937), then a Federal Court judge and Vice-Chancellor of Aligarh Muslim University (1938–1941), buried beside the Nizamuddin Dargah in Delhi."
  es: "Artículo de la Wikipedia en inglés sobre Shah Muhammad Sulaiman (1886-1941); utilizado únicamente para datos sobre la persona. Juez y físico formado en Cambridge y Dublín, primer presidente del Tribunal Superior de Allahabad de la India (1932-1937), posteriormente juez del Tribunal Federal y vicerrector de la Universidad Musulmana de Aligarh (1938-1941), enterrado junto al santuario de Nizamuddin en Delhi."
  fr: "Article de Wikipédia en anglais sur Shah Muhammad Sulaiman (1886-1941); utilisé uniquement pour les informations sur l'entité. Juge et physicien formé à Cambridge et à Dublin, premier président indien de la Haute Cour d'Allahabad (1932-1937), puis juge à la Cour fédérale et vice-chancelier de l'Université musulmane d'Aligarh (1938-1941), enterré près du Dargah de Nizamuddin à Delhi."
  ur: "شاہ محمد سلیمان (1886-1941) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک کیمبرج- اور ڈبلن کے تعلیم یافتہ جج اور ماہر طبیعیات، الہ آباد ہائی کورٹ کے پہلے ہندوستانی چیف جسٹس (1932-1937)، پھر وفاقی عدالت کے جج اور علی گڑھ مسلم یونیورسٹی (1938-1941) کے وائس چانسلر، دہلی میں نظام الدین درگاہ کے پاس دفن ہوئے۔"
  tr: "Şah Muhammed Süleyman (1886–1941) hakkında İngilizce Vikipedi makalesi; yalnızca varlığın olguları için kullanılmıştır. Cambridge ve Dublin'de eğitim görmüş bir yargıç ve fizikçi, Allahabad Yüksek Mahkemesi'ne başkanlık eden ilk Hintli (1932–1937), ardından Federal Mahkeme'de yargıç ve Aligarh İslam Üniversitesi başkan yardımcısı (1938–1941) olan Delhi'deki Nizamuddin türbesine defnedilmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Shah Muhammad Suleiman (1886–1941); digunakan hanya untuk fakta entitas. Seorang hakim dan fisikawan yang belajar di Cambridge dan Dublin, orang India pertama yang memimpin Pengadilan Tinggi Allahabad (1932–1937), kemudian hakim di Pengadilan Federal, dan wakil presiden Universitas Islam Aligarh (1938–1941), dan dimakamkan di makam Nizamuddin di Delhi."
