reliability_note: "Community-edited encyclopedia article (short), retrieved in full at the stated revision. It makes her a sultana of Khwarazm from the Qangli tribe and mother of Muhammad II; it records her flight from Gurganj with the royal treasures before the city's fall, her refuge in a fortress in Larijan, its siege at the start of 617 AH and surrender for lack of water, her dispatch to Genghis Khan at Talqan, her exile to the Qara Qorum desert, and her death in captivity in 630 AH — the Hijri year the record pairs with the 1233 CE of the English article and Wikidata."
