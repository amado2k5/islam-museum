summary:
  ar: "تقرير في موقع نيوز روم عن دورة تدريبية عقدتها مديرية أوقاف بني سويف للواعظات حول قضية الغارمين والغارمات في أغسطس 2025، تحدثت فيها الدكتورة وفاء عبد السلام — ووصفها التقرير بأنها «الواعظة الأولى بوزارة الأوقاف» — فاعتبرت قضية الغارمين معاناة إنسانية واجتماعية لا مجرد ديون، وأبرزت دور الواعظات في توعية النساء والفتيات بأضرار الديون غير الضرورية وتنمية ثقافة القناعة والتخطيط الأسري."
  en: "A report on the Newsroom site of a training course held by the Beni Suef Awqaf directorate for female preachers on the issue of indebted men and women (al-gharimin) in August 2025, at which Dr Wafaa Abdel Salam — described by the report as 'the first female preacher at the Ministry of Awqaf' — treated indebtedness as human and social suffering rather than mere debt, and stressed the female preachers' role in warning women and girls against unnecessary borrowing and in fostering contentment and sound family planning."
  es: "Un informe publicado en el sitio web de Newsroom relata un curso de capacitación impartido por la Dirección de Awqaf de Beni Suef para predicadoras sobre el tema de los hombres y mujeres endeudados (al-gharimin) en agosto de 2025. En dicho curso, la Dra. Wafaa Abdel Salam, descrita en el informe como \"la primera predicadora del Ministerio de Awqaf\", trató el endeudamiento como un sufrimiento humano y social, más que como una simple deuda, y destacó el papel de las predicadoras a la hora de advertir a las mujeres y niñas sobre los peligros de los préstamos innecesarios y de fomentar la satisfacción y una buena planificación familiar."
  fr: "Un article publié sur le site Newsroom relate une formation organisée en août 2025 par la direction des Awqaf de Beni Suef à l'intention des prédicatrices sur la question des hommes et des femmes endettés (al-gharimin). Lors de cette formation, le Dr Wafaa Abdel Salam – décrite dans l'article comme « la première femme prédicatrice au ministère des Awqaf » – a abordé l'endettement comme une souffrance humaine et sociale plutôt que comme une simple dette, et a souligné le rôle des prédicatrices pour mettre en garde les femmes et les filles contre les emprunts inutiles et pour promouvoir le contentement et une planification familiale saine."
