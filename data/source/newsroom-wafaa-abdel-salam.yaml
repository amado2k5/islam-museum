summary:
  ar: "تقرير في موقع نيوز روم عن دورة تدريبية عقدتها مديرية أوقاف بني سويف للواعظات حول قضية الغارمين والغارمات في أغسطس 2025، تحدثت فيها الدكتورة وفاء عبد السلام — ووصفها التقرير بأنها «الواعظة الأولى بوزارة الأوقاف» — فاعتبرت قضية الغارمين معاناة إنسانية واجتماعية لا مجرد ديون، وأبرزت دور الواعظات في توعية النساء والفتيات بأضرار الديون غير الضرورية وتنمية ثقافة القناعة والتخطيط الأسري."
  en: "A report on the Newsroom site of a training course held by the Beni Suef Awqaf directorate for female preachers on the issue of indebted men and women (al-gharimin) in August 2025, at which Dr Wafaa Abdel Salam — described by the report as 'the first female preacher at the Ministry of Awqaf' — treated indebtedness as human and social suffering rather than mere debt, and stressed the female preachers' role in warning women and girls against unnecessary borrowing and in fostering contentment and sound family planning."
