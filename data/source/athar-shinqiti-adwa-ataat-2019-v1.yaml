label:
  ar: "أضواء البيان في إيضاح القرآن بالقرآن — محمد الأمين الشنقيطي، المجلد الأول، ضمن «آثار الشيخ العلامة محمد الأمين الشنقيطي» بإشراف بكر بن عبد الله أبو زيد (دار عطاءات العلم ودار ابن حزم، ط5، 1441هـ/2019م)"
  en: "Adwa' al-Bayan fi Idah al-Qur'an bi'l-Qur'an — Muhammad al-Amin al-Shinqiti, vol. 1, in the series 'Athar al-Shaykh Muhammad al-Amin al-Shinqiti' supervised by Bakr ibn Abd Allah Abu Zayd (Dar Ata'at al-Ilm and Dar Ibn Hazm, 5th ed., 2019)"
  ur: "اضواء البیان فی ایضاح القرآن بالقرآن — محمد الامین الشنقیطی، جلد اول، سلسلہ «آثار الشیخ العلامہ محمد الامین الشنقیطی» زیرِ نگرانی بکر بن عبد اللہ ابو زید (دار عطاءات العلم اور دار ابن حزم، پانچواں ایڈیشن، 2019ء)"
summary:
  ar: "المجلد الأول (الفاتحة – النساء) من طبعة «آثار الشيخ العلامة محمد الأمين الشنقيطي» في تسعة عشر مجلدًا، من مطبوعات مجمع الفقه الإسلامي بجدة، بإشراف بكر بن عبد الله أبو زيد وتمويل مؤسسة سليمان بن عبد العزيز الراجحي الخيرية؛ الطبعة الخامسة 1441هـ/2019م. وفي أوله مقدمة المشرف، وخطة العمل لعلي بن محمد العمران، وترجمة الشيخ لخالد بن عثمان السبت."
  en: "Volume 1 (al-Fatiha to al-Nisa') of the nineteen-volume 'Athar al-Shaykh Muhammad al-Amin al-Shinqiti', published under the Islamic Fiqh Academy in Jeddah, supervised by Bakr ibn Abd Allah Abu Zayd and funded by the Sulayman ibn Abd al-Aziz al-Rajhi Charitable Foundation; 5th edition 1441 AH / 2019. It opens with the supervisor's introduction, the work plan by Ali ibn Muhammad al-Imran and a biography of the shaykh by Khalid ibn Uthman al-Sabt."
  ur: "«آثار الشیخ العلامہ محمد الامین الشنقیطی» کی انیس جلدوں میں سے پہلی جلد (سورۂ فاتحہ تا نساء)، مجمع الفقہ الاسلامی جدہ کی مطبوعات میں، بکر بن عبد اللہ ابو زید کی نگرانی اور سلیمان بن عبد العزیز الراجحی خیراتی فاؤنڈیشن کی مالی معاونت سے؛ پانچواں ایڈیشن 1441ھ / 2019ء۔ اس کے آغاز میں نگران کا مقدمہ، علی بن محمد العمران کا خاکۂ کار، اور خالد بن عثمان السبت کے لکھے ہوئے شیخ کے سوانح ہیں۔"
