  en: "Mostafa Mahmoud, Anashid al-Ithm wa-l-Bara'a, 2nd ed. (Dar al-Ma'arif, Cairo, c. 1984)"
  ur: "مصطفیٰ محمود، اناشید الاثم والبراءۃ، طبع دوم (دار المعارف، قاہرہ، تقریباً 1984)"
summary:
  ar: "الطبعة الثانية من كتاب مصطفى محمود «أناشيد الإثم والبراءة» عن دار المعارف، نصوص نثرية في الحب والخيانة والعذاب والانتحار والمرأة والحرية، تختم بدعاء طويل بعنوان «دعاء العبد الخطاء»."
  en: "The second edition of Mostafa Mahmoud's Anashid al-Ithm wa-l-Bara'a from Dar al-Ma'arif: prose pieces on love, betrayal, suffering, suicide, women and freedom, closing with a long prayer titled 'Prayer of the erring servant'."
  ur: "مصطفیٰ محمود کی «اناشید الاثم والبراءۃ» کا دار المعارف سے دوسرا ایڈیشن: محبت، بے وفائی، عذاب، خودکشی، عورت اور آزادی پر نثری تحریریں، جو «خطاکار بندے کی دعا» کے عنوان سے ایک طویل دعا پر ختم ہوتی ہیں۔"
