  ar: "مقالة ويكيبيديا الإنجليزية عن المدّاح الإيراني مهدي رسولي: وُلد سنة 1988 في زنجان، ويرأس هيئة ثار الله في زنجان، ويقرأ بالفارسية والعربية والأذرية، ووصفه موقع «ميدل إيست آي» بأنه من أبرز المنشدين الدينيين في إيران."
  en: "The English Wikipedia article on the Iranian maddah Mahdi Rasouli: born in 1988 in Zanjan, he leads the Tharallah hey'at of Zanjan, recites in Persian, Arabic and Azerbaijani, and is described by Middle East Eye as among the most prominent religious singers in Iran."
  es: "El artículo de la Wikipedia en inglés sobre el maddah iraní Mahdi Rasouli dice: nacido en 1988 en Zanjan, dirige el Tharallah hey'at de Zanjan, recita en persa, árabe y azerbaiyano, y Middle East Eye lo describe como uno de los cantantes religiosos más destacados de Irán."
  fr: "L'article de Wikipédia en anglais sur le maddah iranien Mahdi Rasouli: né en 1988 à Zanjan, il dirige le Tharallah hey'at de Zanjan, récite en persan, en arabe et en azerbaïdjanais, et est décrit par Middle East Eye comme l'un des chanteurs religieux les plus importants d'Iran."
