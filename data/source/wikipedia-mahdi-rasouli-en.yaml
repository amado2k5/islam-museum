reliability_note: "Read in full on 7 November 2026; the reading tools available in this run did not expose a revision id, so none is recorded. Used for his birth in 1988 in Zanjan (the article cites Defa Press for the early-life section), for his father Javad Rasouli, a wartime eulogist killed in November 1990, for his leadership of the Tharallah hey'at of Zanjan, for his recitation in Persian, Arabic and Azerbaijani Turkish including Muharram ceremonies in Iran, Iraq and Turkey, for his recitations at the Imam Khomeini Hussainiyah in Tehran, and for the Middle East Eye description. Its lead calls him 'an Iranian maddah (Shia religious eulogist)' — a profession descriptor preserved in the person record's faith note; the article gives no fuller attestation of his own school."
