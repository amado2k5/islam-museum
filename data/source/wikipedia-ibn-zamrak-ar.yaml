reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision, resting on al-Zirikli's al-A'lam. It gives his birth in the Rawd al-Bayyazin quarter of Granada, his teachers (the qadi Abu al-Qasim al-Sharif al-Gharnati and Ibn al-Khatib), his rise to secretary and then to the sultan's confidence in 773 AH, his disgrace and restoration, his incitement against his teacher Ibn al-Khatib, and his killing at home with his servants and sons. Its dating is internally inconsistent: it pairs 733–793 AH with 1333–1392 CE, although 793 AH fell in 1390–91; the record preserves the pairing and does not follow either of its years for the death."
