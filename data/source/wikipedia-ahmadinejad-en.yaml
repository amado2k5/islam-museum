reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives his birth as 28 October 1956 at Aradan, his birth name as Mahmoud Sabbaghian, and his father Ahmad as 'a religious Shia Muslim' who taught the Quran — a statement about his father, not about Ahmadinejad himself. Its text names no affiliation for Ahmadinejad personally. On his survival of the 28 February 2026 strike it cites The National (28 February 2026) for the attack and Der Spiegel (1 March 2026) among the reports that he still lives; he is treated as living on the person record."
