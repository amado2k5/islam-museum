  ar: "مقالة ويكيبيديا الإنجليزية عن محمود أحمدي نجاد؛ تُستخدم لوقائع الكيان فقط. تعطي رئاسته من 3 آب 2005 إلى 3 آب 2013 وسلفه خاتمي وخلفه روحاني، وتروي أن بيته في طهران ضُرب في أول أيام حرب إيران 2026 وأنه أُشيع قتله ثم تناقضت التقارير اللاحقة."
  en: "English Wikipedia article on Mahmoud Ahmadinejad; used for entity facts only. It gives his presidency as 3 August 2005 to 3 August 2013, his predecessor as Mohammad Khatami and his successor as Hassan Rouhani, and recounts that his Tehran house was struck on the first day of the 2026 Iran war, that he was originally reported killed, and that later reports contradicted this."
