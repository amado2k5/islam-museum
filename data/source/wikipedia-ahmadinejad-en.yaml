summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمود أحمدي نجاد؛ تُستخدم لوقائع الكيان فقط. تعطي رئاسته من 3 آب 2005 إلى 3 آب 2013 وسلفه خاتمي وخلفه روحاني، وتروي أن بيته في طهران ضُرب في أول أيام حرب إيران 2026 وأنه أُشيع قتله ثم تناقضت التقارير اللاحقة."
  en: "English Wikipedia article on Mahmoud Ahmadinejad; used for entity facts only. It gives his presidency as 3 August 2005 to 3 August 2013, his predecessor as Mohammad Khatami and his successor as Hassan Rouhani, and recounts that his Tehran house was struck on the first day of the 2026 Iran war, that he was originally reported killed, and that later reports contradicted this."
  es: "Artículo de la Wikipedia en inglés sobre Mahmoud Ahmadinejad; utilizado únicamente para datos sobre la persona. Indica que su presidencia fue del 3 de agosto de 2005 al 3 de agosto de 2013, que su predecesor fue Mohammad Khatami y su sucesor Hassan Rouhani, y relata que su casa en Teherán fue bombardeada el primer día de la guerra de Irán de 2026, que inicialmente se informó de su muerte y que informes posteriores desmintieron esta información."
  fr: "Article de Wikipédia en anglais sur Mahmoud Ahmadinejad; utilisé uniquement pour les informations factuelles. Il indique que sa présidence s’est déroulée du 3 août 2005 au 3 août 2013, que son prédécesseur était Mohammad Khatami et son successeur Hassan Rouhani, et relate que sa maison à Téhéran a été touchée le premier jour de la guerre Iran-Iran de 2026, qu’il a d’abord été annoncé comme mort, et que des informations ultérieures ont contredit cette version."
  ur: "محمود احمدی نژاد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی صدارت 3 اگست 2005 سے 3 اگست 2013 تک، محمد خاتمی کے طور پر ان کے پیشرو اور حسن روحانی کے طور پر ان کے جانشین کے طور پر بتائی گئی ہے، اور بتایا گیا ہے کہ 2026 کی ایران جنگ کے پہلے دن ان کے تہران کے گھر پر حملہ ہوا تھا، کہ اصل میں ان کی ہلاکت کی اطلاع دی گئی تھی، اور بعد میں آنے والی خبروں نے اس کی تردید کی۔"
