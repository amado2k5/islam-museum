reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A long article, read in full on 25 October 2026. Its lead gives his birth as 6 January 1967 in Madras. Its conversion section — headed 'Conversion to Islam and name change' — records that he was introduced to the Qadiri tariqa when his younger sister was seriously ill in 1984, that his mother was a practising Hindu, that Sufism influenced his mother and eventually his family, and that at the age of 23 he converted to Islam with his family in 1989, taking a name suggested through a Hindu astrologer ('Abdul Rahman' / 'Abdul Rahim'), to which his mother added 'Allah Rakha' after a dream; this section is one of the two independent attestations of his Sufi path used in the person record. Covers further: his birth as A. S. Dileep Kumar to the Malayalam film composer R. K. Shekhar (who died when Rahman was nine) and Kareema, born Kashturi; piano from the age of four; work as keyboardist and arranger for Ilaiyaraaja and others, training under Master Dhanraj and a diploma in Western classical music from Trinity College of Music; advertising jingles and the Panchathan Record Inn studio (1992); Roja (1992) and its National Film Award; Bombay, Rangeela, Dil Se.. (whose 'Chaiyya Chaiyya' the article links to Sufi mysticism), Taal and Lagaan; Bombay Dreams (2002) for Andrew Lloyd Webber; Slumdog Millionaire (2008) and its two Academy Awards — best score, and best song for 'Jai Ho', shared with Gulzar — with the Golden Globe, BAFTA and two 2010 Grammy Awards; Couples Retreat (2009), his first Hollywood film, and 127 Hours (2010); the Padma Shri (2000) and Padma Bhushan (2010); seven National Film Awards by the article's count; the KM Music Conservatory (2008) and the Sunshine Orchestra (2009); the Stop TB Partnership ambassadorship (2004); honorary doctorates including Berklee (2014) and Aligarh Muslim University; the street named for him in Markham, Ontario (2013); the directorial debut Le Musk (2017); estimated sales of some 150 million records (the article's estimate, attributed as such); his 1995 marriage to Saira Banu, their three children, and the separation announced in November 2024."
