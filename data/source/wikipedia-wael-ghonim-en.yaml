  ar: "مقالة ويكيبيديا الإنجليزية عن وائل غنيم؛ تُستخدم لوقائع الكيان فقط. توثّق ميلاده في القاهرة في 23 ديسمبر 1980، ونشأته في أبها، ودراسته، وعمله في غوغل، ودوره في صفحة «كلنا خالد سعيد» وثورة 2011، واعتقاله 11 يومًا، وتأسيسه أكاديمية التحرير وبارليو."
  en: "English Wikipedia article on Wael Ghonim; used for entity facts only. It records his birth in Cairo on 23 December 1980, his upbringing in Abha, his education, his work at Google, his role in the 'We are all Khaled Said' page and the 2011 revolution, his 11-day detention, and his founding of Tahrir Academy and co-founding of Parlio."
