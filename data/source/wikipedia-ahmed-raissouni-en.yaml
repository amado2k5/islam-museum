reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the article was fetched by revision id through the MediaWiki API and the returned revid asserted equal to 1378656100 before any claim was drawn. It gives his birth year as 1953, his birth name as Ahmed ben Abdelsalam ben Mohamed Raissouni, the infobox birthplace as Ksar el-Kebir and the text's birthplace as the village of Ouled Soltane near Ksar el-Kebir; his bachelor's in Sharia from the University of al-Qarawiyyin (1978) and his master's (1989) and doctorate (1992) from Mohammed V University; the founding of the Islamic Future Association (1994), its merger into the Movement of Unity and Reform (1996), which he headed until 2003; his editorship of Attajdid (2000–2004); his presidency of the International Union of Muslim Scholars from 2018 until his resignation on 28 August 2022 after he called Mauritania's existence 'a mistake'; and a list of his books on maqasid. It makes no statement of his madhhab or creed in its text; its categories file him under 'Moroccan Sunni Muslim scholars of Islam', a category filing, not a text attestation."
