  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد الريسوني؛ تُستخدم لوقائع الكيان فقط. تروي نشأته قرب القصر الكبير ودراسته بالقرويين وجامعة محمد الخامس، ورئاسته لحركة التوحيد والإصلاح ثم للاتحاد العالمي لعلماء المسلمين (2018–2022) واستقالته إثر تصريحاته عن موريتانيا، وتسرد كتبه في مقاصد الشريعة."
  en: "English Wikipedia article on Ahmed Raissouni; used for entity facts only. It recounts his upbringing near Ksar el-Kebir, his studies at al-Qarawiyyin and Mohammed V University, his leadership of the Movement of Unity and Reform and then of the International Union of Muslim Scholars (2018–2022) and his resignation after his Mauritania remarks, and lists his books on the higher objectives of Islamic law."
