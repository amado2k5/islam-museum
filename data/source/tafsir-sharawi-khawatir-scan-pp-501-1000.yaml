summary:
  ar: "تفسير القرآن الكريم للشيخ محمد متولي الشعراوي، من خواطره المتلفزة والمكتوبة، في نسخة ممسوحة ضوئياً ⁦(عنوان الملف «تفسير الشعراوي»)⁩. تُستعمل هذه الدفعة صفحات الفصل الثاني من السورة ⁦(الآيات حول البقرة 104 وما بعدها)⁩ ومعها الصفحات 501 إلى 1000 من الملف. طبعة الماسح غير موثقة بعد، والتواريخ والناشر ينتظران التحقق من النسخة الورقية."
  en: "Commentary on the Qur'an by Muhammad Mutawalli al-Sha'rawi, drawn from his Khawatir (televised and written reflections), in a scanned copy whose file is titled 'Tafsir al-Sha'rawi'. The block of pages 501 to 1000 draws on the commentary on Surat al-Baqara from about verse 104. The edition is not yet identified; its publisher and date await a check against a physical copy."
  es: "Comentario del Corán de Muhammad Mutawalli al-Sha'rawi, basado en sus Khawatir (reflexiones televisadas y escritas), en una copia escaneada cuyo archivo se titula «Tafsir al-Sha'rawi». El bloque de páginas 501 a 1000 se basa en el comentario de la Sura al-Baqara, aproximadamente a partir del versículo 104. Aún no se ha identificado la edición; su editor y fecha están pendientes de verificación con una copia física."
  fr: "Commentaire du Coran par Muhammad Mutawalli al-Sha'rawi, tiré de ses Khawatir (réflexions télévisées et écrites), dans une copie numérisée dont le fichier est intitulé « Tafsir al-Sha'rawi ». Le bloc de pages 501 à 1000 s'appuie sur le commentaire de la sourate al-Baqara à partir du verset 104 environ. L'édition n'est pas encore identifiée; son éditeur et sa date restent à vérifier sur un exemplaire physique."
  ur: "قرآن کی تفسیر محمد متولی الشعراوی کی طرف سے، ان کے خواطر ⁦(ٹیلی ویژن اور تحریری مظاہر)⁩ سے لی گئی، اسکین شدہ کاپی میں جس کی فائل کا عنوان 'تفسیر الشعراوی' ہے۔ صفحہ 501 سے 1000 تک کا بلاک سورۃ البقرہ کی تقریباً آیت 104 کی تفسیر پر مبنی ہے۔ ایڈیشن کی ابھی شناخت نہیں ہوئی ہے۔ اس کا پبلشر اور تاریخ فزیکل کاپی کے خلاف جانچ کے منتظر ہیں۔"
