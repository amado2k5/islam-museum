summary:
  ar: الأعلام للزركلي، قاموس تراجم لأشهر الرجال والنساء من العرب والمستعربين والمستشرقين، في نص الشاملة ⁦(الكتاب رقم 12286)⁩ بترقيم موافق للمطبوع، وفي نسخة OpenITI المحفوظة محلياً.
  en: al-Zirikli's al-A'lam, a dictionary of the best-known men and women among the Arabs, the Arabised and the Orientalists, in the Shamela text (book 12286) with page numbering that follows the printed edition, held locally as the OpenITI version.
  es: "Al-A'lam de al-Zirikli, un diccionario de los hombres y mujeres más conocidos entre los árabes, los arabizados y los orientalistas, en el texto de Shamela (libro 12286) con numeración de páginas que sigue la edición impresa, conservada localmente como la versión OpenITI."
  fr: "al-A'lam d'al-Zirikli, un dictionnaire des hommes et femmes les plus connus parmi les Arabes, les arabisés et les orientalistes, dans le texte Shamela (livre 12286) avec une numérotation des pages qui suit l'édition imprimée, détenue localement sous la version OpenITI."
  ur: "الزریکلی کا العلم، عربوں، عربوں اور مستشرقین میں سب سے مشہور مردوں اور عورتوں کی ایک لغت، شمیلا متن ⁦(کتاب 12286)⁩ میں صفحہ نمبر کے ساتھ جو مطبوعہ ایڈیشن کے بعد ہے، مقامی طور پر اوپن آئی ٹی آئی ورژن کے طور پر رکھا گیا ہے۔"
  tr: "Al-Zarkali'nin Al-A'lam adlı eseri, Araplar, Arapçılar ve Oryantalistler arasında en ünlü erkek ve kadınların biyografilerinden oluşan bir sözlük, Al-Shamela metninde (Kitap No. 12286) basılı baskıyla eşleşen numaralandırmayla ve yerel olarak korunan OpenITI versiyonunda yer almaktadır."
  id: "Al-A'lam oleh Al-Zarkali, kamus biografi pria dan wanita paling terkenal di antara Arab, Arabis, dan Orientalis, dalam teks Al-Shamela (Buku No. 12286) dengan penomoran yang sesuai dengan edisi cetak, dan dalam versi OpenITI yang dilestarikan secara lokal."
