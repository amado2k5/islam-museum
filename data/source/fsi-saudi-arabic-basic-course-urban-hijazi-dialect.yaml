summary:
  ar: "كتاب «Saudi Arabic Basic Course: Urban Hijazi Dialect»، Foreign Service Institute (FSI). لم يفتح المتحف هذا المرجع بنفسه؛ عُرف ما قيل عنه من ملخص بحثي قدّمه المؤسس إلى المتحف ووافق على استعماله في 21 نوفمبر 2026. يُستشهد به في: عبارات شائعة في العامية الحجازية، المراجع المتخصصة في اللهجات."
  en: "The book \"Saudi Arabic Basic Course: Urban Hijazi Dialect\" (Foreign Service Institute (FSI)). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum by the founder, who approved its use on 21 November 2026. Cited for: common phrases in Hijazi Arabic, specialist reference works on the dialects."
  ur: "کتاب «Saudi Arabic Basic Course: Urban Hijazi Dialect»، Foreign Service Institute (FSI)۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ بانی کے فراہم کردہ تحقیقی خلاصے سے ہے، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ ان کے لیے دیا گیا: حجازی عربی کے عام جملے، بولیوں پر ماہرانہ مراجع۔"
  fr: "L'ouvrage « Saudi Arabic Basic Course: Urban Hijazi Dialect » (Foreign Service Institute (FSI)). Le musée ne l'a pas ouvert lui-même : ce qu'on en sait vient d'un résumé de recherche fourni au musée par le fondateur, qui en a approuvé l'usage le 21 novembre 2026. Cité pour : les expressions courantes de l'arabe hijazi, les ouvrages de référence spécialisés sur les dialectes."
  es: "La obra «Saudi Arabic Basic Course: Urban Hijazi Dialect» (Foreign Service Institute (FSI)). El museo no lo abrió por sí mismo: lo que se sabe de él procede de un resumen de investigación entregado al museo por el fundador, que aprobó su uso el 21 de noviembre de 2026. Citado para: las expresiones comunes del árabe hiyazí, las obras de referencia especializadas sobre los dialectos."
  tr: "\"Suudi Arapça Temel Kursu: Kentsel Hicazi Lehçesi\" adlı kitap, Dış Hizmet Enstitüsü (FSI). Müze bu referansı bizzat açmadı; kurucusunun müzeye sunduğu bir araştırma özetinden öğrendi ve 21 Kasım 2026'da kullanımını onayladı. Kaynak: Hijazi Günlük Dilinde Yaygın İfadeler, özel lehçe referansları bölümünde yer almaktadır."
  id: "Buku \"Kursus Dasar Arab Saudi: Dialek Hijazi Perkotaan,\" Institut Layanan Luar Negeri (FSI). Museum tidak membuka referensi ini sendiri; museum mengetahui apa yang dikatakan tentangnya dari ringkasan penelitian yang diajukan oleh pendiri museum dan menyetujui penggunaannya pada 21 November 2026. Referensi ini dikutip dalam: Common Phrases in Hijazi Colloquial, referensi dialek khusus."
