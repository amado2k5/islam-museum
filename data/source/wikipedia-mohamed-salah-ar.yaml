summary:
  ar: "مقالة ويكيبيديا العربية عن محمد صلاح، بالمراجعة المستشارة في 24 أكتوبر 2026؛ محدثة بانتقاله إلى طرابزون سبور، وصندوقها المعلوماتي يذكر ديانته «مسلم» دون مذهب، وتذكر صفقة ليفربول بمبلغ 42 مليون يورو إضافة إلى 8 ملايين حوافز."
  en: "Arabic Wikipedia article on Mohamed Salah, revision consulted 24 October 2026; updated for his move to Trabzonspor, its infobox gives his religion as Muslim with no school, and it reports the Liverpool fee as 42 million euros plus 8 million in add-ons."
  es: "Artículo de Wikipedia en árabe sobre Mohamed Salah, revisión consultada el 24 de octubre de 2026; actualizado con motivo de su fichaje por el Trabzonspor, su ficha informativa indica que su religión es musulmana y que no asiste a ninguna escuela, e informa que el precio de su traspaso al Liverpool fue de 42 millones de euros más 8 millones en variables."
  fr: "Article de Wikipédia en arabe sur Mohamed Salah, révision consultée le 24 octobre 2026; mis à jour pour son transfert à Trabzonspor, son infobox indique sa religion comme musulmane sans école, et elle rapporte que les frais de Liverpool s'élevaient à 42 millions d'euros plus 8 millions de bonus."
  ur: "محمد صلاح پر عربی ویکیپیڈیا کا مضمون، 24 اکتوبر 2026 کو نظر ثانی کی گئی؛ Trabzonspor میں اس کے منتقل ہونے کے لیے اپ ڈیٹ کیا گیا، اس کا معلوماتی باکس اس کا مذہب بطور مسلمان بتاتا ہے جس میں کوئی اسکول نہیں ہے، اور اس نے Liverpool کی فیس 42 ملین یورو کے علاوہ 8 ملین ایڈ آنز کے طور پر بتائی ہے۔"
