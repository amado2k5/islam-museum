  ar: "مقالة ويكيبيديا الإنجليزية عن فاطمة جناح (1893–1967)، أخت محمد علي جناح الصغرى وطبيبة الأسنان والسياسية الباكستانية؛ تعطي مولدها في 31 تموز 1893 في كاثياوار ووفاتها في كراتشي في 9 تموز 1967، وتذكر نقلاً عن سيرة بيربھائي أن شعائر جنازتها الخاصة أُقيمت على الطريقة الشيعية الاثني عشرية."
  en: "The English Wikipedia article on Fatima Jinnah (1893–1967), Muhammad Ali Jinnah's younger sister, the dental surgeon and Pakistani politician; it gives her birth on 31 July 1893 in Kathiawar and her death at Karachi on 9 July 1967, and records, citing Pirbhai's biography, that Ithna Ashari (Twelver) Shia rites were performed privately at her home after her death."
