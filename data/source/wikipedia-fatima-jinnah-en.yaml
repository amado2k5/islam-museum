summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فاطمة جناح (1893–1967)، أخت محمد علي جناح الصغرى وطبيبة الأسنان والسياسية الباكستانية؛ تعطي مولدها في 31 تموز 1893 في كاثياوار ووفاتها في كراتشي في 9 تموز 1967، وتذكر نقلاً عن سيرة بيربھائي أن شعائر جنازتها الخاصة أُقيمت على الطريقة الشيعية الاثني عشرية."
  en: "The English Wikipedia article on Fatima Jinnah (1893–1967), Muhammad Ali Jinnah's younger sister, the dental surgeon and Pakistani politician; it gives her birth on 31 July 1893 in Kathiawar and her death at Karachi on 9 July 1967, and records, citing Pirbhai's biography, that Ithna Ashari (Twelver) Shia rites were performed privately at her home after her death."
  es: "El artículo de la Wikipedia en inglés sobre Fatima Jinnah (1893-1967), hermana menor de Muhammad Ali Jinnah, cirujana dental y política pakistaní, indica que nació el 31 de julio de 1893 en Kathiawar y falleció en Karachi el 9 de julio de 1967, y recoge, citando la biografía de Pirbhai, que tras su muerte se celebraron en privado en su casa ritos chiítas Ithna Ashari (duodecimanos)."
  fr: "L'article de Wikipédia en anglais sur Fatima Jinnah (1893-1967), la sœur cadette de Muhammad Ali Jinnah, chirurgienne-dentiste et femme politique pakistanaise; il indique sa naissance le 31 juillet 1893 à Kathiawar et sa mort à Karachi le 9 juillet 1967, et rapporte, citant la biographie de Pirbhai, que des rites chiites Ithna Ashari (duodécimains) ont été accomplis en privé à son domicile après sa mort."
  ur: "فاطمہ جناح (1893–1967) پر انگریزی ویکیپیڈیا کا مضمون، محمد علی جناح کی چھوٹی بہن، ڈینٹل سرجن اور پاکستانی سیاست دان؛ اس کی پیدائش 31 جولائی 1893 کو کاٹھیاواڑ میں ہوئی اور اس کی موت 9 جولائی 1967 کو کراچی میں ہوئی، اور پیر بھائی کی سوانح عمری کا حوالہ دیتے ہوئے یہ ریکارڈ کیا گیا ہے کہ اس کی موت کے بعد اس کے گھر پر اتنہ اشعری ⁦(بارہ)⁩ شیعہ رسومات ادا کی گئیں۔"
