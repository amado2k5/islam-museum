summary:
  ar: "صفحة وقائع جائزة نوبل عن أورخان باموق: وُلد في إسطنبول سنة 1952، ونال جائزة نوبل في الأدب سنة 2006 لأنه اكتشف في بحثه عن الروح الكئيبة لمدينته رموزا جديدة لتصادم الثقافات وتشابكها."
  en: "Nobel Prize facts page for Orhan Pamuk: born in Istanbul in 1952; Nobel Prize in Literature 2006 for discovering new symbols for the clash and interlacing of cultures in the quest for the melancholic soul of his native city."
  es: "Página de datos sobre el Premio Nobel de Orhan Pamuk: nació en Estambul en 1952; Premio Nobel de Literatura 2006 por descubrir nuevos símbolos para el choque y la interconexión de culturas en la búsqueda del alma melancólica de su ciudad natal."
  fr: "Page d'informations sur le prix Nobel d'Orhan Pamuk: né à Istanbul en 1952; prix Nobel de littérature 2006 pour la découverte de nouveaux symboles du choc et de l'entrelacement des cultures dans la quête de l'âme mélancolique de sa ville natale."
  ur: "اورہان پاموک کے لیے نوبل انعام کے حقائق کا صفحہ: 1952 میں استنبول میں پیدا ہوئے۔ نوبل انعام برائے ادب 2006 اپنے آبائی شہر کی اداس روح کی تلاش میں ثقافتوں کے تصادم اور آپس میں جڑنے کے لیے نئی علامتیں دریافت کرنے پر۔"
  tr: "Orhan Pamuk hakkında Nobel Ödülü bilgi sayfası: 1952'de İstanbul'da doğdu ve şehrinin kasvetli ruhunu ararken kültürlerin çatışması ve iç içe geçmesinin yeni sembollerini keşfettiği için 2006'da Nobel Edebiyat Ödülü'nü kazandı."
  id: "Halaman fakta Nobel tentang Orhan Pamuk: Ia lahir di Istanbul pada tahun 1952, dan memenangkan Hadiah Nobel Sastra pada tahun 2006 karena ia menemukan simbol baru dari benturan dan keterkaitan budaya dalam pencariannya akan semangat suram di kotanya."
