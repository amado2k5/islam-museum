summary:
  ar: "مقالة ويكيبيديا العربية عن شجاع شاه الدراني؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تعطي مولده سنة 1785 ووفاته في كابل سنة 1842 وحكميه ⁦(1803-1809 ثم 1839-1842)⁩ وأباه تيمور شاه الدراني، وتذكر في صندوق معلوماتها دينه: الإسلام، دون تسمية مذهب."
  en: "Arabic Wikipedia article on Shuja Shah Durrani; used for entity facts only. A short article giving his birth in 1785, his death at Kabul in 1842, his two reigns (1803–1809 and 1839–1842) and his father Timur Shah Durrani; its infobox gives his religion as Islam, naming no school."
  es: "Artículo en árabe de la Wikipedia sobre Shuja Shah Durrani; se utiliza únicamente para obtener información sobre la persona. Un breve artículo que menciona su nacimiento en 1785, su muerte en Kabul en 1842, sus dos reinados (1803-1809 y 1839-1842) y a su padre, Timur Shah Durrani; su ficha informativa indica que su religión era el islam, sin mencionar ninguna escuela."
  fr: "Article Wikipédia en arabe sur Shuja Shah Durrani; utilisé uniquement pour les informations sur l’entité. Cet article concis mentionne sa naissance en 1785, sa mort à Kaboul en 1842, ses deux règnes (1803-1809 et 1839-1842) et son père, Timur Shah Durrani; son infobox indique qu’il était musulman, sans préciser d’école."
  ur: "شجاع شاہ درانی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 1785 میں ان کی پیدائش، 1842 میں کابل میں ان کی موت، ان کے دو دور حکومت ⁦(1803-1809 اور 1839-1842)⁩ اور ان کے والد تیمور شاہ درانی کے بارے میں ایک مختصر مضمون؛ اس کا انفو باکس اس کا مذہب اسلام دیتا ہے، کسی اسکول کا نام نہیں دیتا۔"
  tr: "Şuca Şah el-Durrani hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1785'te doğumunu, 1842'de Kabil'de ölümünü, yöneticilerini (1803-1809, sonra 1839-1842) ve babası Timur Şah el-Durrani'yi anlatan kısa bir makale, bilgi kutusunda dinini İslam olarak anar, ancak bir mezhep belirtmez."
  id: "Artikel Wikipedia Arab tentang Shuja Shah al-Durrani; digunakan hanya untuk fakta entitas. Sebuah artikel singkat yang menyebutkan kelahirannya pada tahun 1785, kematiannya di Kabul pada tahun 1842, para penguasanya (1803-1809, lalu 1839-1842), dan ayahnya Timur Shah al-Durrani, serta menyebutkan agamanya di infobox: Islam, tanpa menyebutkan sekte."
