  fr: "La page « Medici Oriental Press » (Wikipedia (English)), citée dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisée pour : l'histoire de l'imprimerie arabe."
  es: "La página «Medici Oriental Press» (Wikipedia (English)), citada en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el archivo sin volver a verificar. Usada para: la historia de la imprenta árabe."
