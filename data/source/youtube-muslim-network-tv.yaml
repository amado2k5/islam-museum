summary:
  ar: "قناة «مسلم نتورك تي في» على يوتيوب (@MuslimNetworkTV)، وهي مشروع مؤسسة ساوند فيجن في شيكاغو؛ تنشر أخبارًا وبرامج عن مسلمي أمريكا، ومن محتواها برنامج «أحاديث مجاهد» لرئيس المؤسسة عبد الملك مجاهد، وهي مصدر أولي لهوية الشبكة وعملها وانتشارها، لا مصدر مستقل مؤيد."
  en: "The Muslim Network TV YouTube channel (@MuslimNetworkTV), a project of Chicago's Sound Vision Foundation; it publishes news and programmes about American Muslims, including 'Mujahid Talks' by the foundation's president Abdul Malik Mujahid. A primary source for the network's identity, work and reach, not independent corroboration."
  es: "El canal de YouTube Muslim Network TV (@MuslimNetworkTV), un proyecto de la Fundación Sound Vision de Chicago, publica noticias y programas sobre los musulmanes estadounidenses, incluyendo «Mujahid Talks», presentado por el presidente de la fundación, Abdul Malik Mujahid. Esta información es una fuente primaria sobre la identidad, el trabajo y el alcance de la red, pero no constituye una corroboración independiente."
  fr: "La chaîne YouTube Muslim Network TV (@MuslimNetworkTV), un projet de la Sound Vision Foundation de Chicago, diffuse des actualités et des programmes sur les musulmans américains, notamment « Mujahid Talks », animé par le président de la fondation, Abdul Malik Mujahid. Cette information constitue une source primaire concernant l'identité, les activités et la portée du réseau, mais ne fait l'objet d'aucune vérification indépendante."
  ur: "مسلم نیٹ ورک ٹی وی یوٹیوب چینل (@MuslimNetworkTV)، شکاگو کی ساؤنڈ ویژن فاؤنڈیشن کا ایک پروجیکٹ؛ یہ امریکی مسلمانوں کے بارے میں خبریں اور پروگرام شائع کرتا ہے، جس میں فاؤنڈیشن کے صدر عبدالمالک مجاہد کا 'مجاہد ٹاکس' بھی شامل ہے۔ نیٹ ورک کی شناخت، کام اور رسائی کے لیے ایک بنیادی ذریعہ، نہ کہ آزاد تصدیق۔"
  tr: "YouTube'daki 'Muslim Network TV' kanalı (@MuslimNetworkTV), Chicago'daki SoundVision Vakfı'nın bir projesi olup, Amerikan Müslümanları hakkında haberler ve programlar yayınlamaktadır. İçeriği arasında, vakfın başkanı Abdul Malik Mujahid'in 'Mujahid Talks' adlı programı da vardır; bu program, ağın kimliği, işleyişi ve yayılımı için birincil kaynaktır, bağımsız bir destekleyici kaynak değildir."
  id: "Saluran 'Muslim Network TV' di YouTube (@MuslimNetworkTV), sebuah proyek dari SoundVision Foundation di Chicago, menerbitkan berita dan program tentang Muslim Amerika. Di antara kontennya adalah program 'Mujahid Talks' oleh presiden yayasan, Abdul Malik Mujahid, yang merupakan sumber utama identitas, operasional, dan penyebaran jaringan, bukan sumber pendukung independen."
