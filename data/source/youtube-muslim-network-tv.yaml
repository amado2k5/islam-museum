  ar: "قناة «مسلم نتورك تي في» على يوتيوب (@MuslimNetworkTV)، وهي مشروع مؤسسة ساوند فيجن في شيكاغو؛ تنشر أخبارًا وبرامج عن مسلمي أمريكا، ومن محتواها برنامج «أحاديث مجاهد» لرئيس المؤسسة عبد الملك مجاهد، وهي مصدر أولي لهوية الشبكة وعملها وانتشارها، لا مصدر مستقل مؤيد."
  en: "The Muslim Network TV YouTube channel (@MuslimNetworkTV), a project of Chicago's Sound Vision Foundation; it publishes news and programmes about American Muslims, including 'Mujahid Talks' by the foundation's president Abdul Malik Mujahid. A primary source for the network's identity, work and reach, not independent corroboration."
