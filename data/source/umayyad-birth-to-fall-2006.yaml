reliability_note: "الغلاف (ص1): «صفحات من التاريخ الإسلامي - تاريخ ورجال - للناشئة»، و«جمع وإعداد محمد قباني». صفحة البيانات (ص4): الطبعة الأولى 1427هـ/2006م، دار وحي القلم، دمشق، 192 صفحة. التعارض الدقيق: في البيانات الوصفية للأرشيف (manifest.jsonl، حقل item_title) يرد اسم المؤلف «محمد قبان- ي» وهو الاسم نفسه مقطوعاً بعلامة وصل، وحقل creator يحمل «سرمد حاتم شكر» وهو حقل منشئ الملف في الأرشيف لا اسم مؤلف الكتاب ولا يظهر على الغلاف أو في صفحات البيانات. اسم سرمد يظهر فقط علامةً مائية على الصفحات 2–3، ويرجح أنها للناشر الرقمي، ولم يتحقق ذلك من مصدر آخر. صفحة 10 تحوي توقيع نهاية المقدمة، ويقرؤه OCR «محمد محمد رسمي قباني»، ولم يُتحقق منه بصرياً في هذه القراءة. الكتاب تلخيص عام لا يورد هوامش تفصيلية لمعظم الأخبار، ويعرض الخلفاء بروح مؤيدة في التقديم والمقدمة (الصفحات 5–10 تدافع عن فكرة أن الإسلام لم ينتشر بالسيف)، فيُستعمل في الوقائع المتفق عليها ويُقابل بالمصادر الأولية في المسائل الخلافية."
