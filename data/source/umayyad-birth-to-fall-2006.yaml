reliability_note: "الغلاف: جمع وإعداد محمد قباني، الطبعة الأولى 1427هـ/2006م، دمشق، دار وحي القلم؛ وفي بيانات الأرشيف الوصفية ذُكر اسم المؤلف «محمد قبان» والمنشئ «سرمد حاتم شكر»، ولم تُعتمد البيانات الوصفية؛ ويظهر اسم سرمد في علامة مائية على الصفحات 2–3 يرجح أنها للناشر الرقمي لا للمؤلف. الكتاب تلخيص عام لا يورد هوامش تفصيلية لمعظم الأخبار، ويعرض الخلفاء بروح مؤيدة في التقديم والمقدمة (الصفحات 5–10 تدافع عن فكرة أن الإسلام لم ينتشر بالسيف)، فيُستعمل في الوقائع المتفق عليها ويُقابل بالمصادر الأولية في المسائل الخلافية."
