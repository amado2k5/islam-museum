reliability_note: "Opinion essay by Kashmiri researcher Rao Farman Ali in the Kashmir Times (online), published 14 March 2026 and read in full on the paper's site. Its counter-reading in its own words: 'Calling Azad an atheist, as some orthodox clerics did, mistakes the nature of his spiritual crisis. His quarrel was never with God — it was with God's gatekeepers.' It also prints Azad's reply to the orthodox ('you have your own Deen and I have mine... My beloved feels delighted in unity, affection and sympathy') and records that the orthodox nearly issued a fatwa declaring him an apostate. An opinion piece, not scholarship; used only for the counter-reading it articulates, which the lane preserves unclassified."
