summary:
  ar: "مقالة ويكيبيديا الأردية القصيرة عن السلطان غياث الدين تغلق شاه؛ تُستخدم لوقائع الكيان فقط. تؤكد أنه مؤسس الأسرة التغلقية وأول حكامها، وأن حكمه امتد من 8 سبتمبر 1320 إلى فبراير 1325، وأنه بنى تغلق آباد في دلهي."
  en: "Short Urdu Wikipedia article on Sultan Ghiyath al-Din Tughluq Shah; used for entity facts only. It confirms him as founder and first ruler of the Tughluq dynasty, his reign from 8 September 1320 to February 1325, and his building of Tughluqabad at Delhi."
  es: "Breve artículo en urdu de Wikipedia sobre el sultán Ghiyath al-Din Tughluq Shah; se utiliza únicamente para datos sobre la persona. Confirma que fue el fundador y primer gobernante de la dinastía Tughluq, que su reinado abarcó desde el 8 de septiembre de 1320 hasta febrero de 1325, y que construyó Tughluqabad en Delhi."
  fr: "Court article de Wikipédia en ourdou sur le sultan Ghiyath al-Din Tughluq Shah; utilisé uniquement à des fins d'information sur l'entité. Il confirme qu'il est le fondateur et le premier souverain de la dynastie Tughluq, son règne s'est déroulé du 8 septembre 1320 à février 1325, et il a fait construire Tughluqabad à Delhi."
  ur: "سلطان غیاث الدین تغلق شاہ پر مختصر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے تغلق خاندان کے بانی اور پہلے حکمران، 8 ستمبر 1320 سے فروری 1325 تک اس کے دور حکومت اور دہلی میں تغلق آباد کی عمارت کی تصدیق کرتا ہے۔"
  tr: "Sultan Ghiyasuddin Taghlaq Şah hakkında kısa Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bu makale, onun Taghlaqa hanedanının kurucusu ve ilk hükümdarı olduğunu, yönetiminin 8 Eylül 1320'den Şubat 1325'e kadar sürdüğünü ve Delhi'de Taghlaqabad'ı inşa ettiğini doğrular."
  id: "Artikel singkat Wikipedia dalam bahasa Urdu tentang Sultan Ghiyasuddin Taghlaq Shah; digunakan hanya untuk fakta entitas tersebut. Artikel ini mengonfirmasi bahwa ia adalah pendiri dan penguasa pertama dinasti Taghlaqa, bahwa pemerintahannya berlangsung dari 8 September 1320 hingga Februari 1325, dan bahwa ia membangun Taghlaqabad di Delhi."
