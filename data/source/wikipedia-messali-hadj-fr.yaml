summary:
  ar: "مقالة ويكيبيديا الفرنسية عن مصالي الحاج؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بتلمسان في 16 مايو 1898 ووفاته بغوفيو (الواز) في 3 يونيو 1974، وتذكر أنه تلميذ بمدرسة الزاوية الدرقاوية عند الشيخ بن يلس في صباه وأنه ظل يتردد على الزاوية شابًا، وأن جده لأمه كان قاضيًا وعضوًا في الطريقة الدرقاوية. صندوق معلوماتها يعطي دينه «الإسلام»."
  en: "French Wikipedia article on Messali Hadj; used for entity facts only. It gives his birth at Tlemcen on 16 May 1898 and death at Gouvieux (Oise) on 3 June 1974, records that as a boy he was a pupil at the madrasa of the Derkaoua zaouïa of Cheikh Benyelles and kept frequenting the zaouïa as a young man, and that his maternal grandfather was a qadi and member of the Derkaoua confrérie. Its infobox gives his religion as 'Islam'."
