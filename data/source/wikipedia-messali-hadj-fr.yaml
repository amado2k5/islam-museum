summary:
  ar: "مقالة ويكيبيديا الفرنسية عن مصالي الحاج؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بتلمسان في 16 مايو 1898 ووفاته بغوفيو ⁦(الواز)⁩ في 3 يونيو 1974، وتذكر أنه تلميذ بمدرسة الزاوية الدرقاوية عند الشيخ بن يلس في صباه وأنه ظل يتردد على الزاوية شابًا، وأن جده لأمه كان قاضيًا وعضوًا في الطريقة الدرقاوية. صندوق معلوماتها يعطي دينه «الإسلام»."
  en: "French Wikipedia article on Messali Hadj; used for entity facts only. It gives his birth at Tlemcen on 16 May 1898 and death at Gouvieux (Oise) on 3 June 1974, records that as a boy he was a pupil at the madrasa of the Derkaoua zaouïa of Cheikh Benyelles and kept frequenting the zaouïa as a young man, and that his maternal grandfather was a qadi and member of the Derkaoua confrérie. Its infobox gives his religion as 'Islam'."
  es: "Artículo de la Wikipedia en francés sobre Messali Hadj; utilizado únicamente para datos biográficos. Indica que nació en Tlemcen el 16 de mayo de 1898 y falleció en Gouvieux (Oise) el 3 de junio de 1974. Menciona que, de niño, fue alumno de la madrasa de la zaouïa Derkaoua de Cheikh Benyelles y que siguió frecuentando la zaouïa en su juventud. Su abuelo materno fue cadí y miembro de la cofradía Derkaoua. Su ficha informativa indica que profesaba el islam."
  fr: "Article de Wikipédia en français sur Messali Hadj; utilisé uniquement pour les informations le concernant. Il indique sa naissance à Tlemcen le 16 mai 1898 et son décès à Gouvieux (Oise) le 3 juin 1974, mentionne qu'enfant, il fut élève à la madrasa de la zaouïa Derkaoua de Cheikh Benyelles et qu'il continua de fréquenter cette zaouïa durant sa jeunesse, et que son grand-père maternel était cadi et membre de la confrérie Derkaoua. Son infobox précise qu'il était de confession musulmane."
  ur: "میسلی حج پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 16 مئی 1898 کو Tlemcen میں ہوئی اور 3 جون 1974 کو Gouvieux (Oise) میں موت ہوئی، یہ ریکارڈ ہے کہ وہ لڑکپن میں شیخ بینیئلس کے درکاو زاویہ کے مدرسے کا شاگرد تھا اور ایک نوجوان کی حیثیت سے زاویہ کو کثرت سے آتا رہتا تھا، اور یہ کہ اس کا دادا قائد اعظم تھا۔ confrérie اس کا انفو باکس اس کا مذہب 'اسلام' دیتا ہے۔"
