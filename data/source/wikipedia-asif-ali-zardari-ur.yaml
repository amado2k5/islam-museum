  ar: "مقالة ويكيبيديا الأردية عن آصف علي زرداري؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 26 يوليو 1955، ووالده حكيم علي زرداري، وزواجه من بينظير بوتو سنة 1987، ووزاراته، واعتقاله بعد إقالة حكومتها سنة 1996، ورئاستيه (2008–2013 ومنذ 2024). وتضعه في تصنيفي «شيعة باكستانيون» و«سياسيون شيعة»."
  en: "Urdu Wikipedia article on Asif Ali Zardari; used for entity facts only. It gives his birth on 26 July 1955, his father Hakim Ali Zardari, his 1987 marriage to Benazir Bhutto, his ministries, his arrest after her government's dismissal in 1996, and his presidencies (2008–2013 and since 2024). It files him in 'Pakistani Shia' and 'Shia politicians' categories."
