summary:
  ar: "مقالة ويكيبيديا الأردية عن آصف علي زرداري؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 26 يوليو 1955، ووالده حكيم علي زرداري، وزواجه من بينظير بوتو سنة 1987، ووزاراته، واعتقاله بعد إقالة حكومتها سنة 1996، ورئاستيه ⁦(2008–2013 ومنذ 2024)⁩. وتضعه في تصنيفي «شيعة باكستانيون» و«سياسيون شيعة»."
  en: "Urdu Wikipedia article on Asif Ali Zardari; used for entity facts only. It gives his birth on 26 July 1955, his father Hakim Ali Zardari, his 1987 marriage to Benazir Bhutto, his ministries, his arrest after her government's dismissal in 1996, and his presidencies (2008–2013 and since 2024). It files him in 'Pakistani Shia' and 'Shia politicians' categories."
  es: "Artículo de Wikipedia en urdu sobre Asif Ali Zardari; utilizado únicamente para datos biográficos. Menciona su fecha de nacimiento (26 de julio de 1955), su padre, Hakim Ali Zardari, su matrimonio con Benazir Bhutto en 1987, sus ministerios, su arresto tras la destitución de su gobierno en 1996 y sus presidencias (2008-2013 y desde 2024). Lo clasifica en las categorías de «chií pakistaní» y «político chií»."
  fr: "Article de Wikipédia en ourdou sur Asif Ali Zardari; utilisé uniquement à des fins d'information sur l'entité. Il mentionne sa date de naissance, le 26 juillet 1955, son père, Hakim Ali Zardari, son mariage avec Benazir Bhutto en 1987, ses ministères, son arrestation après la destitution du gouvernement de Bhutto en 1996, et ses présidences (2008-2013 et depuis 2024). Il est classé dans les catégories « Chiites pakistanais » et « Personnalités politiques chiites »."
  ur: "آصف علی زرداری پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 26 جولائی 1955 کو ان کی پیدائش، ان کے والد حاکم علی زرداری، 1987 میں بے نظیر بھٹو سے ان کی شادی، ان کی وزارتیں، 1996 میں ان کی حکومت کی برطرفی کے بعد ان کی گرفتاری، اور ان کی صدارتیں ⁦(2008-2013 اور 2024 سے)⁩۔ یہ اسے 'پاکستانی شیعہ' اور 'شیعہ سیاستدانوں' کے زمرے میں درج کرتا ہے۔"
  tr: "Asif Ali Zardari hakkında Urduca Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Makalede 26 Temmuz 1955'teki doğumu, babası Hakim Ali Zardari, 1987'de Benazir Bhutto ile evliliği, bakanlıkları, 1996'da hükümetinin görevden alınmasından sonra tutuklanması ve başkanlıkları (2008–2013 ve 2024'ten itibaren) bahsedilmektedir. Onu \"Pakistanlı Şii\" ve \"Şii politikacılar\" olarak sınıflandırmaktadır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Asif Ali Zardari hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada 26 Juli 1955, ayahnya Hakim Ali Zardari, pernikahannya dengan Benazir Bhutto pada tahun 1987, kementerian-kementeriannya, penangkapannya setelah pemecatan pemerintahannya pada tahun 1996, dan masa kepresidenannya (2008–2013 dan sejak 2024). Artikel ini mengkategorikannya sebagai \"politikus Syiah Pakistan\" dan \"Politisi Syiah.\""
