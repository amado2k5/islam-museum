reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. It gives his birth in 1796 or 1797 at Khairabad (1796 per the Indian History Congress, 1797 per Asir Adrawi and other sources, as its own note states) and his death on 19 August 1861 in the Andaman Islands, citing Asir Adrawi's Tazkirah Mashaikh-e-Hind; the Arabic article and Wikidata give 20 August 1861. Its lead calls him a Hanafi mufti and Maturidi theologian, and its text states that he followed the Hanafi school and was a theologian of the Maturidi school, citing his own al-Rawdh al-Mucawwad and Siddiq Hasan Khan's Abjad al-Ulum; its infobox gives denomination Sunni, jurisprudence Hanafi and creed Maturidi. Its account of his Sufism rests on a single institute website for his discipleship under Hafiz Muhammad Ali Khairabadi and on Anil Sehgal (2001) for the statement that he was venerated as a great Sufi."
