summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فضل الحق خير آبادي؛ تُستخدم لوقائع الكيان فقط. تقدّمه مفتيًا حنفيًا ومتكلمًا ماتريديًا وشاعرًا، وتروي دراسته الحديث على الشاه عبد القادر والشاه عبد العزيز الدهلويين ودراسته التصوف على حافظ محمد علي خير آبادي، وفتواه بالجهاد سنة 1857، ومحاكمته ونفيه إلى جزر أندمان حيث توفي سنة 1861."
  en: "English Wikipedia article on Fazl-e-Haq Khairabadi; used for entity facts only. It presents him as a Hanafi mufti, Maturidi theologian and poet, and recounts his study of hadith under Shah Abd al-Qadir and Shah Abd al-Aziz Dehlvi and of Sufism under Hafiz Muhammad Ali Khairabadi, his 1857 fatwa in favour of jihad against British rule, his trial, and his exile to the Andaman Islands, where he died in 1861."
