summary:
  ar: "قناة أمية زين على يوتيوب (@omayazein)؛ مصدر أولي لدروسها في الحجاب والعمائم — ومنها دروس بالإسبانية بلغ أحدها ملايين المشاهدات — ومدوناتها الأسرية مع زوجها، وسلسلة رحلة علاج العقم وصولًا إلى ابنها آدم، ومدونات رمضان."
  en: "Omaya Zein's YouTube channel (@omayazein); a primary source for her hijab and turban tutorials — including tutorials in Spanish, one of them viewed millions of times — her family vlogs with her husband, her fertility-journey series through to her son Adam, and her Ramadan vlogs."
  es: "El canal de YouTube de Omaya Zein (@omayazein); una fuente principal para sus tutoriales sobre hijabs y turbantes —incluidos tutoriales en español, uno de ellos visto millones de veces—, sus vlogs familiares con su esposo, su serie sobre su experiencia con la fertilidad hasta el nacimiento de su hijo Adam, y sus vlogs de Ramadán."
  fr: "La chaîne YouTube d'Omaya Zein (@omayazein); une source principale pour ses tutoriels sur le hijab et le turban — y compris des tutoriels en espagnol, dont l'un a été visionné des millions de fois — ses vlogs familiaux avec son mari, sa série sur son parcours de fertilité jusqu'à la naissance de son fils Adam, et ses vlogs du Ramadan."
  ur: "اومایا زین کا یوٹیوب چینل (@omayazein)؛ اس کے حجاب اور پگڑی کے سبق کے لیے ایک بنیادی ذریعہ — بشمول ہسپانوی میں ٹیوٹوریلز، جن میں سے ایک نے لاکھوں بار دیکھا — اس کے شوہر کے ساتھ اس کے خاندانی بلاگز، اس کے بیٹے آدم تک اس کی زرخیزی کے سفر کی سیریز، اور اس کے رمضان کے بلاگ۔"
  tr: "Umayya Zain'in YouTube kanalı (@omayazein); başörtüsü ve sarıkla ilgili derslerinin birincil kaynağı — İspanyolca dersleri de dahil, bunlardan biri milyonlarca görüntülenme aldı — ailesi eşiyle birlikte blog yazıyor, kısırlık tedavisinden oğlu Adam'a kadar olan yolculuğu anlatıyor ve Ramazan blogları yazıyor."
  id: "Saluran YouTube Umayya Zain (@omayazein); sumber utama untuk pelajarannya tentang hijab dan sorban — termasuk pelajaran bahasa Spanyol, salah satunya telah ditonton jutaan kali — blog keluarganya bersama suaminya, seri tentang perjalanan pengobatan infertilitas hingga putranya Adam, dan blog Ramadan."
