summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن دوست محمد خان؛ تُستخدم لوقائع الكيان فقط. تروي مولده في قندهار في 23 ديسمبر 1792 وتأسيسه السلالة الباركزائية وإمارته لكابل ثم لأفغانستان، والحرب الإنجليزية الأفغانية الأولى ونفيه إلى الهند وعودته سنة 1843 وتوحيده قندهار وهراة، ووفاته في هراة في 9 يونيو 1863 ودفنه في ضريح خواجة عبد الله. يعطي صندوق معلوماتها دينه «الإسلام السني»."
  en: "English Wikipedia article on Dost Mohammad Khan; used for entity facts only. It recounts his birth at Kandahar on 23 December 1792, his founding of the Barakzai dynasty and his emirates of Kabul and then of Afghanistan, the First Anglo-Afghan War, his exile in India and return in 1843, his reunification of Kandahar and Herat, and his death at Herat on 9 June 1863 and burial at the Shrine of Khwaja Abd Allah. Its infobox gives his religion as Sunni Islam."
  es: "Artículo de la Wikipedia en inglés sobre Dost Mohammad Khan; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Kandahar el 23 de diciembre de 1792, la fundación de la dinastía Barakzai y sus emiratos de Kabul y posteriormente de Afganistán, la Primera Guerra Anglo-Afgana, su exilio en la India y su regreso en 1843, la reunificación de Kandahar y Herat, y su muerte en Herat el 9 de junio de 1863 y su sepultura en el Santuario de Khwaja Abd Allah. Su ficha informativa indica que profesaba el islam sunita."
  fr: "Article de Wikipédia en anglais sur Dost Mohammad Khan; utilisé uniquement pour les informations le concernant. Il relate sa naissance à Kandahar le 23 décembre 1792, la fondation de la dynastie Barakzai et de ses émirats de Kaboul puis d’Afghanistan, la première guerre anglo-afghane, son exil en Inde et son retour en 1843, la réunification de Kandahar et d’Hérat, et sa mort à Hérat le 9 juin 1863 et son inhumation au mausolée de Khwaja Abd Allah. Son infobox indique qu’il était de confession sunnite."
  ur: "دوست محمد خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 23 دسمبر 1792 کو قندھار میں ان کی پیدائش، بارکزئی خاندان اور کابل اور پھر افغانستان کی اس کی امارات کی بنیاد، پہلی اینگلو-افغان جنگ، ہندوستان میں اس کی جلاوطنی اور 1843 میں واپسی، قندھار اور ہرات کا دوبارہ اتحاد، اور ہرات میں اس کی موت 9 جون 6 اور 18 جون کو عبد اللہ 18 جون 3 کو عبد اللہ خان میں ہے۔ اس کا انفو باکس اس کا مذہب بطور سنی اسلام دیتا ہے۔"
