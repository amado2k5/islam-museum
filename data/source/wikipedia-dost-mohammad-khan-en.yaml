summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن دوست محمد خان؛ تُستخدم لوقائع الكيان فقط. تروي مولده في قندهار في 23 ديسمبر 1792 وتأسيسه السلالة الباركزائية وإمارته لكابل ثم لأفغانستان، والحرب الإنجليزية الأفغانية الأولى ونفيه إلى الهند وعودته سنة 1843 وتوحيده قندهار وهراة، ووفاته في هراة في 9 يونيو 1863 ودفنه في ضريح خواجة عبد الله. يعطي صندوق معلوماتها دينه «الإسلام السني»."
  en: "English Wikipedia article on Dost Mohammad Khan; used for entity facts only. It recounts his birth at Kandahar on 23 December 1792, his founding of the Barakzai dynasty and his emirates of Kabul and then of Afghanistan, the First Anglo-Afghan War, his exile in India and return in 1843, his reunification of Kandahar and Herat, and his death at Herat on 9 June 1863 and burial at the Shrine of Khwaja Abd Allah. Its infobox gives his religion as Sunni Islam."
