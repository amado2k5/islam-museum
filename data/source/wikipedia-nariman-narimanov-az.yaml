summary:
  ar: "مقالة ويكيبيديا الأذربيجانية عن ناريمان ناريمانوف؛ تُستخدم لوقائع الكيان فقط. سيرة مطوّلة: تاريخاه 14 أبريل 1870 – 19 مارس 1925، وتذكر أن حكومته احترمت أعياد الشعب الدينية والتقليدية فجعلتها أيام عطلة رسمية، وأنه كتب وهو طالب طب رسالة «الطب والإسلام»، وتصف وفاته بأنها غامضة. لا تسمي مذهبًا له."
  en: "Azerbaijani Wikipedia article on Nariman Narimanov; used for entity facts only. A very long biography: his dates 14 April 1870 – 19 March 1925; it records that his government respected the people's religious and traditional holidays, making them official non-working days, that as a medical student he wrote a treatise 'Medicine and Islam', and it describes his death as mysterious. It names no school for him."
  es: "Artículo de la Wikipedia en azerbaiyano sobre Nariman Narimanov; utilizado únicamente para datos sobre la persona. Una biografía muy extensa: sus fechas de nacimiento y fallecimiento fueron del 14 de abril de 1870 al 19 de marzo de 1925; en ella se menciona que su gobierno respetaba las festividades religiosas y tradicionales del pueblo, declarándolas días festivos oficiales; que, siendo estudiante de medicina, escribió el tratado «Medicina e Islam»; y se describe su muerte como misteriosa. No se menciona ninguna escuela a la que pertenezca."
  fr: "Article Wikipédia azerbaïdjanais sur Nariman Narimanov; utilisé uniquement à des fins d'information. Biographie très longue: du 14 avril 1870 au 19 mars 1925; l'article indique que son gouvernement respectait les fêtes religieuses et traditionnelles du peuple en les déclarant jours fériés, qu'il a écrit, durant ses études de médecine, un traité intitulé « Médecine et Islam », et décrit sa mort comme mystérieuse. Aucune école n'est mentionnée."
  ur: "نریمان نریمانوف پر آذربائیجانی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک بہت طویل سوانح عمری: ان کی تاریخیں 14 اپریل 1870 - 19 مارچ 1925؛ اس میں درج ہے کہ اس کی حکومت لوگوں کی مذہبی اور روایتی تعطیلات کا احترام کرتی تھی، انہیں سرکاری غیر کام کے دن بناتی تھی، کہ بطور میڈیکل کے طالب علم اس نے ایک مقالہ 'طب اور اسلام' لکھا تھا، اور اس میں ان کی موت کو پراسرار قرار دیا گیا ہے۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
