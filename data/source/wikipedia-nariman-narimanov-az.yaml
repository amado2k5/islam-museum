  ar: "مقالة ويكيبيديا الأذربيجانية عن ناريمان ناريمانوف؛ تُستخدم لوقائع الكيان فقط. سيرة مطوّلة: تاريخاه 14 أبريل 1870 – 19 مارس 1925، وتذكر أن حكومته احترمت أعياد الشعب الدينية والتقليدية فجعلتها أيام عطلة رسمية، وأنه كتب وهو طالب طب رسالة «الطب والإسلام»، وتصف وفاته بأنها غامضة. لا تسمي مذهبًا له."
  en: "Azerbaijani Wikipedia article on Nariman Narimanov; used for entity facts only. A very long biography: his dates 14 April 1870 – 19 March 1925; it records that his government respected the people's religious and traditional holidays, making them official non-working days, that as a medical student he wrote a treatise 'Medicine and Islam', and it describes his death as mysterious. It names no school for him."
