  ar: "كتاب «Arabic Nomenclature: A Summary Guide for Beginners» (أكسفورد، 1971)؛ ذُكر في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الكتاب، ووافق المؤسس على استعمال الملف دون إعادة تحقق. يُستعمل في: بنية الاسم العربي الكلاسيكي والنسب."
  en: "The book \"Arabic Nomenclature: A Summary Guide for Beginners\" (Oxford, 1971), named in a research file supplied to the museum on 21 November 2026; the museum did not open the book, and the founder approved using the file without re-verification. Used for: the structure of the classical Arabic name and the nasab."
  ur: "کتاب «Arabic Nomenclature: A Summary Guide for Beginners» (آکسفرڈ، 1971ء)؛ یہ عجائب گھر کو 21 نومبر 2026ء کو دی گئی تحقیقی فائل میں مذکور ہے، عجائب گھر نے کتاب نہیں کھولی اور بانی نے دوبارہ تصدیق کے بغیر فائل کے استعمال کی منظوری دی۔ استعمال: کلاسیکی عربی نام کی ساخت اور نسب۔"
  fr: "Le livre « Arabic Nomenclature: A Summary Guide for Beginners » (Oxford, 1971), cité dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert le livre, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisé pour : la structure du nom arabe classique et le nasab."
  es: "El libro «Arabic Nomenclature: A Summary Guide for Beginners» (Oxford, 1971), citado en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió el libro, y el fundador aprobó usar el archivo sin volver a verificar. Usado para: la estructura del nombre árabe clásico y el nasab."
