reliability_note: "News report read in full on 25 October 2026. It reports that Hirsi Ali, a longtime critic of Islam and for years an outspoken atheist who in 2002 renounced her Muslim faith and declared herself an atheist, said in an UnHerd essay published that week that although she had identified as an atheist for over two decades she now considers herself a member of the Christian religion, quoting her: she turned to Christianity in part 'because I ultimately found life without any spiritual solace unendurable', and 'Atheism failed to answer a simple question: What is the meaning and purpose of life?' It is used as an attestation independent of the English Wikipedia article for the christian segment in her person record."
