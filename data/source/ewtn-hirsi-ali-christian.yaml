  ar: "تقرير وكالة الأنباء الكاثوليكية (13 نوفمبر 2023) عن إعلان أيان حرسي علي اعتناقها المسيحية في مقالها «لماذا أنا الآن مسيحية»؛ يوثّق تركها الإسلام وإعلانها الإلحاد سنة 2002 ووصفها نفسها الآن بأنها من أتباع الدين المسيحي، وهو أحد مصدرين مستقلين يثبتان مسيحيتها الحالية في سجلّها."
  en: "Catholic News Agency report (13 November 2023) on Ayaan Hirsi Ali's announcement of her conversion to Christianity in her essay 'Why I am now a Christian'; it records her 2002 renunciation of Islam and declaration of atheism and her present self-description as a member of the Christian religion — one of the two independent attestations of her current Christianity in her record."
