summary:
  ar: "عنصر ويكي بيانات Q128245 لمحمد رضا بهلوي، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته 26 تشرين الأول 1919 ووفاته 27 تموز 1980، وقيمة دين وحيدة هي التشيع الاثنا عشري (Q269785)."
  en: "Wikidata item Q128245 for Mohammad Reza Pahlavi, grounded through the English article's pageprops; used for entity facts only. It gives his birth as 26 October 1919 and his death as 27 July 1980, and a single religion value, Twelver Shi'ism (Q269785)."
  es: "El elemento de Wikidata Q128245 para Mohammad Reza Pahlavi, basado en los pageprops del artículo en inglés, se utiliza únicamente para obtener información sobre la entidad. Indica que nació el 26 de octubre de 1919 y falleció el 27 de julio de 1980, y que profesaba una única religión: el chiismo duodecimano (Q269785)."
  fr: "L'élément Wikidata Q128245 concernant Mohammad Reza Pahlavi, basé sur les propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations sur l'entité. Il indique sa date de naissance: le 26 octobre 1919; sa date de décès: le 27 juillet 1980; et une seule religion est mentionnée: le chiisme duodécimain (Q269785)."
  ur: "محمد رضا پہلوی کے لیے ویکی ڈیٹا آئٹم Q128245، انگریزی آرٹیکل کے پیج پروپس کے ذریعے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 26 اکتوبر 1919 اور اس کی موت 27 جولائی 1980 بتاتی ہے، اور ایک ہی مذہب کی قدر، بارہویں شیعہ ازم (Q269785)۔"
  tr: "Mohammad Reza Pahlavi tarafından İngilizce makale sayfasının özellikleri aracılığıyla kurulan bir Wikidata öğesi Q128245; yalnızca varlığın gerçekleri için kullanılmıştır. 26 Ekim 1919'da doğdu ve 27 Temmuz 1980'de vefat etti; dinin tek değeri On İki İmam Şiiliği (Q269785)."
  id: "Item Wikidata Q128245 oleh Mohammad Reza Pahlavi, didirikan melalui properti halaman artikel bahasa Inggris; digunakan hanya untuk fakta entitas. Ia lahir pada 26 Oktober 1919, dan meninggal pada 27 Juli 1980, dengan satu-satunya nilai agama adalah Syiah Dua Belas (Q269785)."
