  ar: "مقالة ويكيبيديا الإنجليزية عن فضل حسن عابد؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها مولده في 27 أبريل 1936 ببانياشونغ ووفاته في 20 ديسمبر 2019 بدكا، ويروي نصها أنه «انتمى إلى أسرة زميندار بنغالية مسلمة»، وتأسيسه براك سنة 1972، وصلاة الجنازة عليه قبل دفنه في دكا. لا يسمّي المقال دينا ولا مذهبا له شخصيا."
  en: "English Wikipedia article on Fazle Hasan Abed; used for entity facts only. Its infobox gives his birth as 27 April 1936 at Baniachong and his death as 20 December 2019 at Dhaka; its text states that he 'belonged to a Bengali Muslim family of zamindars', covers his founding of BRAC in 1972, and records a namaz-e-janaza (funeral prayer) before his burial in Dhaka. The article names no religion or school for him personally."
