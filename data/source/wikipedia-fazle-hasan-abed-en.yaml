summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فضل حسن عابد؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها مولده في 27 أبريل 1936 ببانياشونغ ووفاته في 20 ديسمبر 2019 بدكا، ويروي نصها أنه «انتمى إلى أسرة زميندار بنغالية مسلمة»، وتأسيسه براك سنة 1972، وصلاة الجنازة عليه قبل دفنه في دكا. لا يسمّي المقال دينا ولا مذهبا له شخصيا."
  en: "English Wikipedia article on Fazle Hasan Abed; used for entity facts only. Its infobox gives his birth as 27 April 1936 at Baniachong and his death as 20 December 2019 at Dhaka; its text states that he 'belonged to a Bengali Muslim family of zamindars', covers his founding of BRAC in 1972, and records a namaz-e-janaza (funeral prayer) before his burial in Dhaka. The article names no religion or school for him personally."
  es: "Artículo de la Wikipedia en inglés sobre Fazle Hasan Abed; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació el 27 de abril de 1936 en Baniachong y falleció el 20 de diciembre de 2019 en Dhaka. El texto afirma que pertenecía a una familia bengalí musulmana de zamindares, menciona la fundación de BRAC en 1972 y registra una oración fúnebre (namaz-e-janaza) antes de su entierro en Dhaka. El artículo no menciona ninguna religión ni escuela a la que pertenezca."
  fr: "L'article de Wikipédia en anglais consacré à Fazle Hasan Abed est utilisé uniquement à titre informatif. Son infobox indique sa naissance le 27 avril 1936 à Baniachong et son décès le 20 décembre 2019 à Dhaka. Le texte précise qu'il appartenait à une famille de zamindars musulmans bengalis, évoque la fondation de BRAC en 1972 et relate une prière funéraire (namaz-e-janaza) avant son inhumation à Dhaka. L'article ne mentionne ni sa religion ni son école."
  ur: "فضل حسن عابد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی باکس ان کی پیدائش 27 اپریل 1936 کو بنیاچونگ میں اور موت 20 دسمبر 2019 کو ڈھاکہ میں بتائی گئی ہے۔ اس کے متن میں کہا گیا ہے کہ وہ 'زمینداروں کے ایک بنگالی مسلم خاندان سے تعلق رکھتے تھے'، 1972 میں ان کی BRAC کی بنیاد کا احاطہ کرتا ہے، اور ڈھاکہ میں ان کی تدفین سے قبل ایک نماز جنازہ ⁦(نماز جنازہ)⁩ ریکارڈ کرتا ہے۔ مضمون میں ذاتی طور پر اس کے لیے کسی مذہب یا اسکول کا نام نہیں لیا گیا ہے۔"
