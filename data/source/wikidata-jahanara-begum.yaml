reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives her birth on 2 April 1614 — the day agreeing with the Arabic and Urdu articles against the English article's 23 March — and a birth place of Agra in structured data only; no article text read names her birthplace, so no born place or born_in edge is built from it. It gives her death on 16 September 1681 at Delhi, her father as Shah Jahan (Q83672, the QID of person/shah-jahan-mughal on main) and her mother as Mumtaz Mahal. It files her religion both as Islam generically and as Sufism; structured statements never settle faith, and the person record's sufi settlement rests on the English and Urdu article texts, not on this filing. The QID was grounded from the English article's own page property, the Arabic and Urdu articles agreeing. Item revision fetched live and re-asserted identical on a second query, 1 November 2026."
