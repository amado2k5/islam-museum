summary:
  ar: "مقالة ويكيبيديا الأردية عن عبد المجيد تبون؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 17 نوفمبر 1945 وخدمته رئيسا للجزائر ووزيرا للدفاع منذ ديسمبر 2019، وأنه تولى الرئاسة بعد القائم بأعمال رئيس الدولة عبد القادر بن صالح."
  en: "Urdu Wikipedia article on Abdelmadjid Tebboune; used for entity facts only. It gives his birth on 17 November 1945, his service as president of Algeria and minister of defence since December 2019, and that he took office after the acting head of state Abdelkader Bensalah."
  es: "Artículo de Wikipedia en urdu sobre Abdelmadjid Tebboune; utilizado únicamente para datos sobre la persona. Indica que nació el 17 de noviembre de 1945, que fue presidente de Argelia y ministro de Defensa desde diciembre de 2019, y que asumió el cargo tras la salida del jefe de Estado interino Abdelkader Bensalah."
  fr: "Article de Wikipédia en ourdou sur Abdelmadjid Tebboune; utilisé uniquement à des fins d’information sur l’entité. Il indique sa date de naissance, le 17 novembre 1945, son mandat de président de l’Algérie et de ministre de la Défense depuis décembre 2019, et précise qu’il a succédé au chef d’État par intérim Abdelkader Bensalah."
  ur: "عبدالمجید ٹیبوون پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 17 نومبر 1945 کو ان کی پیدائش ہے، الجزائر کے صدر اور دسمبر 2019 سے وزیر دفاع کے طور پر ان کی خدمات، اور یہ کہ انہوں نے ریاست کے قائم مقام سربراہ عبدالقادر بن صلاح کے بعد عہدہ سنبھالا۔"
