summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سانيا نشتر ⁦(وُلدت في 16 فبراير 1963)⁩؛ تُستخدم لوقائع الكيان فقط. تروي مولدها في بيشاور وتخرجها في كلية خيبر للطب ودراستها للدكتوراه في كلية كينغز لندن، وعملها طبيبة قلب وتأسيسها منظمة هارتفايل، ووزارتها الانتقالية سنة 2013، وقيادتها برنامج إحساس مساعدة خاصة لرئيس الوزراء، وانتخابها لمجلس الشيوخ سنة 2021، وتعيينها رئيسة تنفيذية لتحالف غافي سنة 2024."
  en: "English Wikipedia article on Sania Nishtar (born 16 February 1963); used for entity facts only. It recounts her Peshawar birth, her Khyber Medical College graduation, her King's College London PhD, her cardiology career and founding of Heartfile, her 2013 caretaker ministership, her leadership of the Ehsaas programme as special assistant to the prime minister, her 2021 election to the Senate, and her 2024 appointment as CEO of Gavi, the Vaccine Alliance."
  es: "Artículo de la Wikipedia en inglés sobre Sania Nishtar (nacida el 16 de febrero de 1963); utilizado únicamente para datos biográficos. Relata su nacimiento en Peshawar, su graduación en el Khyber Medical College, su doctorado en el King's College de Londres, su trayectoria profesional en cardiología y la fundación de Heartfile, su cargo como ministra interina en 2013, su liderazgo del programa Ehsaas como asistente especial del primer ministro, su elección al Senado en 2021 y su nombramiento en 2024 como directora ejecutiva de Gavi, la Alianza para las Vacunas."
  fr: "Article de Wikipédia en anglais sur Sania Nishtar (née le 16 février 1963); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Peshawar, l’obtention de son diplôme du Khyber Medical College, son doctorat du King’s College de Londres, sa carrière en cardiologie et la fondation de Heartfile, son poste de ministre par intérim en 2013, sa direction du programme Ehsaas en tant qu’assistante spéciale du Premier ministre, son élection au Sénat en 2021 et sa nomination en 2024 à la tête de Gavi, l’Alliance du Vaccin."
  ur: "ثانیہ نشتر پر انگریزی ویکیپیڈیا مضمون ⁦(پیدائش 16 فروری 1963)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پشاور پیدائش، اس کی خیبر میڈیکل کالج سے گریجویشن، اس کی کنگز کالج لندن پی ایچ ڈی، اس کا کارڈیالوجی کیریئر اور ہارٹ فائل کی بانی، اس کی 2013 کی نگران وزارت، اس کی وزیراعظم کے معاون خصوصی کے طور پر احساس پروگرام کی قیادت، سینیٹ کے لیے اس کے 2021 کے انتخابات، اور اس کے 2024 کے تمام وی اے پی سی ای او پوائنٹس کے بارے میں بتایا گیا ہے۔"
  tr: "Sania Nashtar (d. 16 Şubat 1963) hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılmıştır. Peşaver'deki doğumunu, Hayber Tıp Fakültesi'nden mezuniyetini, King's College London'daki doktorasını anlatıyor, kardiyolog olarak çalışmaları ve Hartwell Vakfı'nı kurmasını, 2013'teki geçiş dönem hizmetini, Başbakan'a özel asistan olarak Ehsas programını yönetmesini, 2021'de Senato'ya seçilmesini ve 2024'te Gavi Alliance CEO'luğuna atanmasını anlatıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Sania Nashtar (lahir 16 Februari 1963); hanya digunakan untuk fakta entitas. Ia menceritakan kelahirannya di Peshawar, kelulusannya dari Khyber Medical College, gelar doktor di King's College London, pekerjaannya sebagai ahli jantung dan pendirian Hartwell Foundation, pelayanan transisinya pada tahun 2013, kepemimpinannya dalam program Ehsas sebagai asisten khusus Perdana Menteri, terpilihnya ke Senat pada tahun 2021, dan pengangkatannya sebagai CEO Gavi Alliance pada tahun 2024."
