summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سانيا نشتر (وُلدت في 16 فبراير 1963)؛ تُستخدم لوقائع الكيان فقط. تروي مولدها في بيشاور وتخرجها في كلية خيبر للطب ودراستها للدكتوراه في كلية كينغز لندن، وعملها طبيبة قلب وتأسيسها منظمة هارتفايل، ووزارتها الانتقالية سنة 2013، وقيادتها برنامج إحساس مساعدة خاصة لرئيس الوزراء، وانتخابها لمجلس الشيوخ سنة 2021، وتعيينها رئيسة تنفيذية لتحالف غافي سنة 2024."
  en: "English Wikipedia article on Sania Nishtar (born 16 February 1963); used for entity facts only. It recounts her Peshawar birth, her Khyber Medical College graduation, her King's College London PhD, her cardiology career and founding of Heartfile, her 2013 caretaker ministership, her leadership of the Ehsaas programme as special assistant to the prime minister, her 2021 election to the Senate, and her 2024 appointment as CEO of Gavi, the Vaccine Alliance."
