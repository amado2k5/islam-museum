summary:
  ar: "صفحة وقائع جائزة نوبل عن محمد يونس: وُلد في شيتاجونج سنة 1940، ونال جائزة نوبل للسلام سنة 2006 مناصفة مع بنك غرامين لجهودهما في خلق التنمية الاقتصادية والاجتماعية من القاعدة."
  en: "Nobel Prize facts page for Muhammad Yunus: born in Chittagong in 1940; Nobel Peace Prize 2006, shared with Grameen Bank, 'for their efforts to create economic and social development from below'."
  es: "Página de datos sobre el Premio Nobel de Muhammad Yunus: nació en Chittagong en 1940; Premio Nobel de la Paz 2006, compartido con el Grameen Bank, \"por sus esfuerzos para crear desarrollo económico y social desde abajo\"."
  fr: "Page d'informations sur le prix Nobel de Muhammad Yunus: né à Chittagong en 1940; prix Nobel de la paix 2006, partagé avec la Grameen Bank, « pour leurs efforts visant à créer un développement économique et social à partir de la base »."
  ur: "محمد یونس کے لیے نوبل انعام کے حقائق کا صفحہ: 1940 میں چٹاگانگ میں پیدا ہوئے۔ نوبل امن انعام 2006، 'نیچے سے معاشی اور سماجی ترقی کی کوششوں کے لیے' گرامین بینک کے ساتھ اشتراک کیا گیا۔"
  tr: "Muhammed Yunus hakkında Nobel Ödülü bilgi sayfası: 1940 yılında Çittagong'da doğdu ve 2006'da Grameen Bank ile birlikte ekonomik ve sosyal kalkınmayı tabandan yaratma çabaları nedeniyle Nobel Barış Ödülü'ne layık görüldü."
  id: "Halaman fakta Nobel tentang Muhammad Yunus: Ia lahir di Chittagong pada tahun 1940, dan dianugerahi bersama Hadiah Nobel Perdamaian pada tahun 2006 dengan Grameen Bank atas upaya mereka menciptakan pembangunan ekonomi dan sosial dari akar rumput."
