summary:
  ar: "سيرة منشورة عن محمد الغليظ في موقع تدوينات؛ تذكر أنه درس الصيدلة ولم يدرس العلوم الشرعية دراسة نظامية، وأنه يدرّس دبلومات في العلوم الشرعية والسيرة، وأن متابعيه على يوتيوب بلغوا نحو 1.1 مليون مشترك وقت كتابتها."
  en: "A published biography of Mohamed Elghaleez on the Tdwyinat site, recording that he studied pharmacy rather than formal religious sciences, that he teaches diploma courses in the religious sciences and the sira, and that his YouTube subscribers stood at about 1.1 million when it was written."
