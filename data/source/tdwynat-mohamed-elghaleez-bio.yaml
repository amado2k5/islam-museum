reliability_note: "An unofficial biography page, published 24 December 2023. Used, with attribution, for his pharmacy studies, his teaching of diploma courses, and his channel's reach at that date. It states that his birth date is not known and describes him as in his mid-thirties, which conflicts with the 1982 birth year given elsewhere, so no birth date is recorded. Its remark that he was given a Salafi nickname is a nickname report, not an attestation of a school. Checked 25 October 2026."
