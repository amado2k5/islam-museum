summary:
  ar: "سيرة منشورة عن محمد الغليظ في موقع تدوينات؛ تذكر أنه درس الصيدلة ولم يدرس العلوم الشرعية دراسة نظامية، وأنه يدرّس دبلومات في العلوم الشرعية والسيرة، وأن متابعيه على يوتيوب بلغوا نحو 1.1 مليون مشترك وقت كتابتها."
  en: "A published biography of Mohamed Elghaleez on the Tdwyinat site, recording that he studied pharmacy rather than formal religious sciences, that he teaches diploma courses in the religious sciences and the sira, and that his YouTube subscribers stood at about 1.1 million when it was written."
  es: "En el sitio web Tdwyinat se publicó una biografía de Mohamed Elghaleez en la que se indica que estudió farmacia en lugar de ciencias religiosas formales, que imparte cursos de diplomatura en ciencias religiosas y la sira, y que sus suscriptores de YouTube rondaban los 1,1 millones cuando se escribió."
  fr: "Une biographie de Mohamed Elghaleez publiée sur le site Tdwyinat indique qu'il a étudié la pharmacie plutôt que les sciences religieuses formelles, qu'il enseigne des cours de diplôme en sciences religieuses et en sira, et que son nombre d'abonnés sur YouTube s'élevait à environ 1,1 million au moment de sa rédaction."
  ur: "Tdwyinat سائٹ پر محمد الغالیز کی ایک شائع شدہ سوانح عمری، جس میں یہ ریکارڈ کیا گیا ہے کہ اس نے رسمی مذہبی علوم کے بجائے فارمیسی کی تعلیم حاصل کی، کہ وہ مذہبی علوم اور سیرت میں ڈپلومہ کورسز پڑھاتا ہے، اور یہ کہ جب یہ لکھا گیا تو اس کے YouTube سبسکرائبرز کی تعداد تقریباً 1.1 ملین تھی۔"
