  ar: "مقالة ويكيبيديا الأردية عن سيد أمير الدين قدوائي؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده سنة 1901 في بارابانكي ووفاته في 21 آب 1973 في لاهور، ونشاطه في تحريك الخلافة وحركة باكستان، وتصميمه علم باكستان، وتدريسه في كلية الحقوق بجامعة البنجاب."
  en: "Urdu Wikipedia article on Syed Amir-uddin Kedwaii; used for entity facts only. It confirms his birth in 1901 at Barabanki and his death on 21 August 1973 at Lahore, his activism in the Khilafat movement and the Pakistan Movement, his designing of the flag of Pakistan, and his teaching at the University of the Punjab's law college."
