  ar: "مقالة ويكيبيديا الأذربيجانية عن سعيد قابييف؛ تُستخدم لوقائع الكيان فقط. هي صياغة موازية للمقالة الروسية وتُحسب معها عائلة مصدر واحدة في أغلب وقائعها؛ تعطي مولده في 28 مايو 1882 في أوبوتشكا ووفاته في 18 فبراير 1963 في تبليسي ومناصبه في حكومة داغستان السوفيتية، ولا يرد فيها أي ذكر لدينه الشخصي."
  en: "Azerbaijani Wikipedia article on Said Gabiev; used for entity facts only. It is a parallel rendering of the Russian article and counts with it as one source family for most facts; it gives his birth on 28 May 1882 at Opochka and his death on 18 February 1963 at Tbilisi and his posts in the Soviet Dagestan government, and contains no statement of his personal religion."
