summary:
  ar: "مقالة ويكيبيديا الأذربيجانية عن سعيد قابييف؛ تُستخدم لوقائع الكيان فقط. هي صياغة موازية للمقالة الروسية وتُحسب معها عائلة مصدر واحدة في أغلب وقائعها؛ تعطي مولده في 28 مايو 1882 في أوبوتشكا ووفاته في 18 فبراير 1963 في تبليسي ومناصبه في حكومة داغستان السوفيتية، ولا يرد فيها أي ذكر لدينه الشخصي."
  en: "Azerbaijani Wikipedia article on Said Gabiev; used for entity facts only. It is a parallel rendering of the Russian article and counts with it as one source family for most facts; it gives his birth on 28 May 1882 at Opochka and his death on 18 February 1963 at Tbilisi and his posts in the Soviet Dagestan government, and contains no statement of his personal religion."
  es: "Artículo de la Wikipedia en azerbaiyano sobre Said Gabiev; utilizado únicamente para datos sobre la persona. Es una traducción paralela del artículo ruso y se considera, junto con él, una fuente común para la mayoría de los datos; indica su nacimiento el 28 de mayo de 1882 en Opochka y su fallecimiento el 18 de febrero de 1963 en Tiflis, así como sus cargos en el gobierno soviético de Daguestán, y no contiene ninguna mención a su religión personal."
  fr: "Article Wikipédia azerbaïdjanais sur Said Gabiev; utilisé uniquement pour les informations sur l’entité. Il s’agit d’une traduction parallèle de l’article russe, avec lequel il partage la plupart des informations; on y trouve sa date de naissance, le 28 mai 1882 à Opochka, et sa date de décès, le 18 février 1963 à Tbilissi, ainsi que ses fonctions au sein du gouvernement soviétique du Daghestan. L’article ne mentionne pas sa religion."
  ur: "آذربائیجانی ویکیپیڈیا مضمون سید گابیف پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ روسی مضمون کی متوازی رینڈرنگ ہے اور اس کے ساتھ زیادہ تر حقائق کے لیے ایک ماخذ خاندان کے طور پر شمار ہوتا ہے۔ یہ 28 مئی 1882 کو اوپوچکا میں ان کی پیدائش اور 18 فروری 1963 کو تبلیسی میں ان کی موت اور سوویت داغستان حکومت میں ان کے عہدوں پر مشتمل ہے، اور اس میں ان کے ذاتی مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Said Kabayev hakkında Azerbayca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Rusça makaleye paralel bir ifadedir ve olaylarının çoğunda aynı kaynak aile olarak kabul edilir; 28 Mayıs 1882'de Obochka'da doğduğunu, 18 Şubat 1963'te Tiflis'te vefat ettiğini ve Sovyet Dağıstan hükümetindeki görevlerini anlatır; kişisel dini hakkında hiçbir bilgi yoktur."
  id: "Artikel Wikipedia Azerbaijan tentang Said Kabayev; hanya digunakan untuk fakta entitas. Ini adalah redaksi paralel dengan artikel Rusia dan dianggap sebagai keluarga sumber yang sama dalam sebagian besar peristiwanya; menceritakan kelahirannya pada 28 Mei 1882 di Obochka, dan kematiannya pada 18 Februari 1963 di Tbilisi, serta posisinya dalam pemerintahan Soviet Dagestan, dan tidak ada penyebutan agama pribadinya."
