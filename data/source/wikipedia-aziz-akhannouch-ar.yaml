summary:
  ar: "مقالة ويكيبيديا العربية عن عزيز أخنوش؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 16 أغسطس 1961 بتافراوت ونشأته بالدار البيضاء، ودراسته بجامعة شيربروك (1986)، ورئاسته لحكومة المغرب منذ سبتمبر 2021. لا تذكر المقالة دينه؛ ولا يحمل صندوق معلوماتها حقلًا للدين وتاريخ ميلادها فارغ فيه."
  en: "Arabic Wikipedia article on Aziz Akhannouch; used for entity facts only. It gives his birth on 16 August 1961 at Tafraout and his upbringing in Casablanca, his degree from the University of Sherbrooke (1986), and his premiership of Morocco from September 2021. The article states no religion for him; its infobox has no religion field and its birth-date field is empty."
  es: "Artículo en árabe de la Wikipedia sobre Aziz Akhannouch; se utiliza únicamente para obtener información sobre la persona. Indica que nació el 16 de agosto de 1961 en Tafraout, que creció en Casablanca, que se graduó en la Universidad de Sherbrooke (1986) y que asumió el cargo de primer ministro de Marruecos en septiembre de 2021. El artículo no menciona ninguna religión; su ficha informativa no incluye el campo de religión y el campo de fecha de nacimiento está vacío."
  fr: "Article Wikipédia en arabe sur Aziz Akhannouch; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 16 août 1961 à Tafraout, son enfance à Casablanca, son diplôme de l’Université de Sherbrooke (1986) et sa nomination comme Premier ministre du Maroc en septembre 2021. L’article ne mentionne pas sa religion; son infobox ne comporte pas de champ « religion » et le champ « date de naissance » est vide."
  ur: "عزیز اخانوچ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 16 اگست 1961 کو ٹفراؤٹ میں ان کی پیدائش اور کاسا بلانکا میں ان کی پرورش، یونیورسٹی آف شیربروک (1986) سے اس کی ڈگری اور ستمبر 2021 سے مراکش کی ان کی پریمیئر شپ ہے۔ مضمون میں اس کے لیے کوئی مذہب نہیں بتایا گیا ہے۔ اس کے انفو باکس میں مذہب کا کوئی فیلڈ نہیں ہے اور اس کی تاریخ پیدائش کی فیلڈ خالی ہے۔"
  tr: "Aziz Akhannouch hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Makalede 16 Ağustos 1961'de Tafraout'ta doğduğu, Kazablanka'daki yetiştirilmesi, Sherbrooke Üniversitesi'ndeki eğitimi (1986) ve Eylül 2021'den beri Fas hükümetinin başkanlığı olduğu belirtilmektedir. Makalede dininden bahsedilmemektedir; bilgi kutusunda din için bir alan yoktur ve doğum tarihi boştur."
  id: "Artikel Wikipedia berbahasa Arab tentang Aziz Akhannouch; hanya digunakan untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya pada 16 Agustus 1961 di Tafraout, masa kecilnya di Casablanca, studinya di Universitas Sherbrooke (1986), dan masa kepresidenannya di pemerintahan Maroko sejak September 2021. Artikel tersebut tidak menyebutkan agamanya; kotak infonya tidak menyertakan kolom untuk agama, dan tanggal lahirnya kosong."
