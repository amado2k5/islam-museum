  ar: "مقالة ويكيبيديا العربية عن عزيز أخنوش؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 16 أغسطس 1961 بتافراوت ونشأته بالدار البيضاء، ودراسته بجامعة شيربروك (1986)، ورئاسته لحكومة المغرب منذ سبتمبر 2021. لا تذكر المقالة دينه؛ ولا يحمل صندوق معلوماتها حقلًا للدين وتاريخ ميلادها فارغ فيه."
  en: "Arabic Wikipedia article on Aziz Akhannouch; used for entity facts only. It gives his birth on 16 August 1961 at Tafraout and his upbringing in Casablanca, his degree from the University of Sherbrooke (1986), and his premiership of Morocco from September 2021. The article states no religion for him; its infobox has no religion field and its birth-date field is empty."
