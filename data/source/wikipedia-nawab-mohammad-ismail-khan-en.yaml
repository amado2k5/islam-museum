summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نواب محمد إسماعيل خان (آب 1884 – 28 حزيران 1958)؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في ميروت وتعليمه في تونبريدج وكامبريدج، وقيادته في رابطة مسلمي عموم الهند وحركة الخلافة، ونيابته رئاسة جامعة عليكرة الإسلامية مرتين، ودوره في قرار باكستان، ووفاته في ميروت ودفنه في مقبرة الأسرة عند ضريح نظام الدين في دلهي."
  en: "English Wikipedia article on Nawab Mohammad Ismail Khan (August 1884 – 28 June 1958); used for entity facts only. It recounts his Meerut birth and Tonbridge and Cambridge education, his Muslim League and Khilafat leadership, his two terms as vice-chancellor of Aligarh Muslim University, his part in the Pakistan Resolution, his death at Meerut and his burial in the family graveyard at the Nizamuddin shrine in Delhi. Its succession box gives Ross Masood as his predecessor in the Aligarh vice-chancellorship."
