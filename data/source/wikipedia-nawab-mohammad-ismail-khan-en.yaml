summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نواب محمد إسماعيل خان ⁦(آب 1884 – 28 حزيران 1958)⁩؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في ميروت وتعليمه في تونبريدج وكامبريدج، وقيادته في رابطة مسلمي عموم الهند وحركة الخلافة، ونيابته رئاسة جامعة عليكرة الإسلامية مرتين، ودوره في قرار باكستان، ووفاته في ميروت ودفنه في مقبرة الأسرة عند ضريح نظام الدين في دلهي."
  en: "English Wikipedia article on Nawab Mohammad Ismail Khan (August 1884 – 28 June 1958); used for entity facts only. It recounts his Meerut birth and Tonbridge and Cambridge education, his Muslim League and Khilafat leadership, his two terms as vice-chancellor of Aligarh Muslim University, his part in the Pakistan Resolution, his death at Meerut and his burial in the family graveyard at the Nizamuddin shrine in Delhi. Its succession box gives Ross Masood as his predecessor in the Aligarh vice-chancellorship."
  es: "Artículo de la Wikipedia en inglés sobre Nawab Mohammad Ismail Khan (agosto de 1884 - 28 de junio de 1958); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Meerut y su educación en Tonbridge y Cambridge, su liderazgo en la Liga Musulmana y el Movimiento Khilafat, sus dos mandatos como vicerrector de la Universidad Musulmana de Aligarh, su participación en la Resolución de Pakistán, su muerte en Meerut y su entierro en el cementerio familiar del santuario de Nizamuddin en Delhi. En el recuadro de sucesión se menciona a Ross Masood como su predecesor en el cargo de vicerrector de Aligarh."
  fr: "L'article de Wikipédia en anglais consacré à Nawab Mohammad Ismail Khan (août 1884 – 28 juin 1958) est utilisé uniquement à des fins d'information. Il relate sa naissance à Meerut, ses études à Tonbridge et Cambridge, son engagement au sein de la Ligue musulmane et du mouvement Khilafat, ses deux mandats de vice-chancelier de l'Université musulmane d'Aligarh, son rôle dans la résolution sur le Pakistan, son décès à Meerut et son inhumation dans le cimetière familial du sanctuaire de Nizamuddin à Delhi. L'encadré relatif à sa succession indique que Ross Masood lui a succédé au poste de vice-chancelier d'Aligarh."
  ur: "نواب محمد اسماعیل خان پر انگریزی ویکیپیڈیا کا مضمون ⁦(اگست 1884 - 28 جون 1958)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی میرٹھ پیدائش اور ٹنبرج اور کیمبرج کی تعلیم، ان کی مسلم لیگ اور خلافت کی قیادت، علی گڑھ مسلم یونیورسٹی کے وائس چانسلر کے طور پر ان کی دو مدتوں، قرارداد پاکستان میں ان کا حصہ، میرٹھ میں ان کی وفات اور دہلی کے نظام الدین مزار پر خاندانی قبرستان میں ان کی تدفین کا ذکر ہے۔ اس کا جانشینی خانہ راس مسعود کو علی گڑھ کی وائس چانسلر شپ میں اپنے پیشرو کے طور پر دیتا ہے۔"
