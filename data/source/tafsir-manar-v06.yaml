reliability_note: "Edition not verified. The local copy is an OCR text of a modern printing (408 PDF pages). Its title page names Rida as author, the volume as 'al-juz' al-sadis', the publisher Muhammad Ali Bayḍun with Dar al-Kutub al-Ilmiyya, Beirut; the editor's name and the year of this printing are read with OCR errors and are not recorded here. Page numbers cited in the museum are the page markers of the local OCR copy; on the pages where a printed number is visible (pp. 3, 13, 14, 96, 98) they agree with it. The Arabic in the OCR contains reading errors; no quotation is made from it. Every page number must be checked against the printed copy before publication."
