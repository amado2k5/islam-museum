summary:
  ar: "المجلد السادس من تفسير المنار لمحمد رشيد رضا، من الكلام على آية النساء 148 إلى مطلع سورة المائدة. يتناول صفحات منه الجهر بالسوء والمظلوم، والتفريق بين الله ورسله، ومطالبة أهل الكتاب بكتاب ينزل عليهم من السماء، والميثاق مع بني إسرائيل وأحوالهم في السبت، ثم مناسبة سورة المائدة للنساء وافتتاحها بالوفاء بالعقود."
  en: "Volume 6 of Rashid Rida's Tafsir al-Manar, from the commentary on Q. 4:148 to the opening of al-Ma'ida: the People of the Book, the covenant with the Children of Israel, and the opening verses of al-Ma'ida. Read here from the local OCR only; the edition is not verified."
