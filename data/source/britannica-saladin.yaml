summary:
  en: "Britannica biography of Saladin by Paul E. Walker and the Britannica editors; it gives his birth at Tikrit in 1137/38, his vizierate in Egypt in 1169, the end of the Fatimid caliphate in 1171, the unification of Syria, Mesopotamia, Palestine and Egypt from 1174 to 1186, the recovery of Jerusalem on 2 October 1187, and his death at Damascus on 4 March 1193."
  es: "La biografía de Saladino publicada por la Enciclopedia Británica, escrita por Paul E. Walker y los editores de la misma, relata su nacimiento en Tikrit en 1137/38, su visirismo en Egipto en 1169, el fin del califato fatimí en 1171, la unificación de Siria, Mesopotamia, Palestina y Egipto entre 1174 y 1186, la recuperación de Jerusalén el 2 de octubre de 1187 y su muerte en Damasco el 4 de marzo de 1193."
