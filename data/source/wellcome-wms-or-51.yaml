summary:
  ar: "سجل الفهرس الرقمي لمكتبة ولكم في لندن لمخطوط عربي من شرح ابن النفيس على قانون ابن سينا، ووصف الفهرس له بأنه يحمل أول وصف للدورة الدموية الرئوية، مع صورة رقمية مرخّصة بالترخيص CC BY 4.0."
  en: "The Wellcome Collection (London) online catalogue record of an Arabic manuscript of Ibn al-Nafis's commentary on Ibn Sina's Canon, which the catalogue describes as containing the first description of the pulmonary circulation, with a digitised image under CC BY 4.0."
  ur: "لندن کی ویلکم کلیکشن کے آن لائن کیٹلاگ میں ابن سینا کی قانون پر ابن النفیس کی شرح کے ایک عربی مخطوطے کا اندراج، جسے کیٹلاگ پھیپھڑوں کی دورانِ خون کا پہلا بیان کہتا ہے، اور اس کی CC BY 4.0 کے تحت ڈیجیٹل تصویر۔"
  es: "El catálogo en línea de la Wellcome Collection (Londres) incluye un registro de un manuscrito árabe del comentario de Ibn al-Nafis sobre el Canon de Ibn Sina, que el catálogo describe como la primera descripción de la circulación pulmonar, con una imagen digitalizada bajo licencia CC BY 4.0."
  fr: "La notice en ligne du catalogue de la Wellcome Collection (Londres) d'un manuscrit arabe du commentaire d'Ibn al-Nafis sur le Canon d'Ibn Sina, que le catalogue décrit comme contenant la première description de la circulation pulmonaire, avec une image numérisée sous CC BY 4.0."
