summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد القدير خان؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 1 أبريل 1936 ببهوبال ووفاته في 10 أكتوبر 2021 بإسلام آباد، وتأسيسه مختبرات خان البحثية وبرنامج تخصيب اليورانيوم، واعترافه سنة 2004 بانتشار نووي وعفو مشرف عنه، وجنازته الرسمية في مسجد فيصل. نصها يذكر «توجها دينيا قويا» لديه ووالدة «ذات عقلية متدينة جدا» — ممارسة وخلفية، لا مذهبا مسمى."
  en: "English Wikipedia article on Abdul Qadeer Khan; used for entity facts only. It gives his birth as 1 April 1936 at Bhopal and his death as 10 October 2021 at Islamabad, his founding of Khan Research Laboratories and the uranium enrichment programme, his 2004 debriefing over nuclear proliferation and pardon, and his state funeral at Faisal Mosque. Its text gives him a 'strong religious outlook' and a mother of 'a very religious mindset' — practice and background, no named school."
