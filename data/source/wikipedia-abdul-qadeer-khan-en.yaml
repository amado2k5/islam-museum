summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد القدير خان؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 1 أبريل 1936 ببهوبال ووفاته في 10 أكتوبر 2021 بإسلام آباد، وتأسيسه مختبرات خان البحثية وبرنامج تخصيب اليورانيوم، واعترافه سنة 2004 بانتشار نووي وعفو مشرف عنه، وجنازته الرسمية في مسجد فيصل. نصها يذكر «توجها دينيا قويا» لديه ووالدة «ذات عقلية متدينة جدا» — ممارسة وخلفية، لا مذهبا مسمى."
  en: "English Wikipedia article on Abdul Qadeer Khan; used for entity facts only. It gives his birth as 1 April 1936 at Bhopal and his death as 10 October 2021 at Islamabad, his founding of Khan Research Laboratories and the uranium enrichment programme, his 2004 debriefing over nuclear proliferation and pardon, and his state funeral at Faisal Mosque. Its text gives him a 'strong religious outlook' and a mother of 'a very religious mindset' — practice and background, no named school."
  es: "Artículo de la Wikipedia en inglés sobre Abdul Qadeer Khan; utilizado únicamente para datos sobre la persona. Indica que nació el 1 de abril de 1936 en Bhopal y falleció el 10 de octubre de 2021 en Islamabad, fundó los Laboratorios de Investigación Khan y el programa de enriquecimiento de uranio, fue interrogado en 2004 sobre la proliferación nuclear y recibió un indulto, y su funeral de Estado tuvo lugar en la Mezquita Faisal. El texto lo describe como una persona de profundas convicciones religiosas y con una madre de profundas convicciones religiosas; no menciona ninguna escuela a la que perteneciera."
  fr: "L'article de Wikipédia en anglais consacré à Abdul Qadeer Khan, utilisé uniquement pour les informations le concernant, indique sa naissance le 1er avril 1936 à Bhopal et son décès le 10 octobre 2021 à Islamabad. Il mentionne également la fondation des Laboratoires de recherche Khan et du programme d'enrichissement d'uranium, son audition en 2004 concernant la prolifération nucléaire et sa grâce, ainsi que ses funérailles nationales à la mosquée Faisal. Le texte le décrit comme ayant une « forte conviction religieuse » et une mère « très pieuse » – sans préciser son appartenance religieuse ni son école de religion."
  ur: "عبدالقدیر خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1 اپریل 1936 کو بھوپال میں ان کی پیدائش اور 10 اکتوبر 2021 کو اسلام آباد میں ان کی موت، خان ریسرچ لیبارٹریز اور یورینیم افزودگی کے پروگرام کی بنیاد، 2004 میں جوہری پھیلاؤ اور معافی کے بارے میں ان کی ڈیبریفنگ، اور فیصل مسجد میں ان کی سرکاری تدفین۔ اس کا متن اسے 'مضبوط مذہبی نقطہ نظر' اور 'انتہائی مذہبی ذہنیت' کی ماں دیتا ہے — مشق اور پس منظر، کوئی نامی اسکول نہیں۔"
