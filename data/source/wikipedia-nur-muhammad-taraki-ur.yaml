  ar: "مقالة ويكيبيديا الأردية عن نور محمد ترہ کئی؛ تُستخدم لوقائع الكيان فقط. تروي تأسيسه حزب الشعب الديمقراطي وقيادته بعد انقلاب ثور حتى وفاته. تمهيدها يعطي وفاته في 8 أكتوبر 1979 وسنة مولد مطبوعة 1971 وهي خطأ مطبعي ظاهر عن 1917."
