summary:
  ar: "مقالة ويكيبيديا الأردية عن ياسر عرفات؛ تُستخدم لوقائع الكيان فقط. توافق على الولادة في القاهرة لأبوين فلسطينيين ودراسته في جامعة الملك فؤاد الأول وقتاله إلى جانب الإخوان المسلمين في حرب 1948 دون أن ينضم إليهم، ولا تسمّي له مذهبًا."
  en: "Urdu Wikipedia article on Yasser Arafat; used for entity facts only. It agrees on his Cairo birth to Palestinian parents, his studies at King Fuad I University, and his fighting alongside the Muslim Brotherhood in the 1948 war without joining it; it names no school for him."
  es: "Artículo de Wikipedia en urdu sobre Yasser Arafat; se utiliza únicamente para datos sobre la persona. Coincide en que nació en El Cairo de padres palestinos, estudió en la Universidad Rey Fuad I y luchó junto a los Hermanos Musulmanes en la guerra de 1948 sin unirse a ellos; no menciona ninguna escuela a la que haya asistido."
  fr: "L'article de Wikipédia en ourdou consacré à Yasser Arafat, utilisé uniquement pour les informations factuelles le concernant, confirme sa naissance au Caire de parents palestiniens, ses études à l'université du roi Fouad Ier et son engagement aux côtés des Frères musulmans pendant la guerre de 1948, sans toutefois qu'il y ait adhéré. Il ne mentionne cependant aucune école où il aurait pu se rendre."
  ur: "یاسر عرفات پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ فلسطینی والدین کے ہاں اس کی قاہرہ کی پیدائش، کنگ فواد اول یونیورسٹی میں اس کی تعلیم، اور 1948 کی جنگ میں اخوان المسلمون کے ساتھ اس میں شامل ہوئے بغیر لڑنے پر متفق ہے۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
