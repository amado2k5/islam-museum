summary:
  ar: "مقالة ويكيبيديا العربية عن القارئ السوداني الزين محمد أحمد الزين؛ لوقائع الكيان فقط: مولده في شمال كردفان في 1982، وحفظه في خلوة خرسي ببارا، وروايتاه الدوري وحفص، وإجازته من الأزهر على أحمد عيسى المعصراوي في 2008، وإمامته لمسجد السيدة سنهوري منذ 2001، ومراتبه في المسابقات؛ وتستند إلى النيلين واليوم التالي وطريق الإسلام."
  en: "Arabic Wikipedia article on the Sudanese reciter al-Zain Muhammad Ahmad al-Zain; entity facts only: birth in North Kordofan in 1982, memorisation at the Khursi khalwa in Bara, the Duri and Hafs transmissions, his al-Azhar ijaza from Ahmad Isa al-Ma'sarawi in 2008, his imamate of the Sayyida Sanhouri Mosque since 2001, and his competition places; it cites al-Nilin, al-Youm al-Tali and IslamWay."
  es: "Artículo de Wikipedia en árabe sobre el recitador sudanés al-Zain Muhammad Ahmad al-Zain; datos de entidad únicamente: nacimiento en Kordofán del Norte en 1982, memorización en el Khursi khalwa en Bara, las transmisiones de Duri y Hafs, su al-Azhar ijaza de Ahmad Isa al-Ma'sarawi en 2008; cita a al-Nilin, al-Youm al-Tali e IslamWay."
  fr: "Article Wikipédia en arabe sur le récitant soudanais al-Zain Muhammad Ahmad al-Zain; faits d'entité uniquement: naissance au Kordofan du Nord en 1982, mémorisation au Khursi khalwa à Bara, les transmissions Duri et Hafs, son ijaza al-Azhar d'Ahmad Isa al-Ma'sarawi en 2008; il cite al-Nilin, al-Youm al-Tali et IslamWay."
  ur: "سوڈانی قاری الزین محمد احمد الزین پر عربی ویکیپیڈیا مضمون؛ ہستی کے حقائق صرف: 1982 میں شمالی کوردوفان میں پیدائش، باڑہ میں خرسی خلوہ میں حفظ، دوری اور حفص کی نشریات، 2008 میں احمد عیسیٰ المصراوی سے ان کا الازہر اعجاز؛ اس میں النلین، ال یوم الطالی اور اسلام وے کا حوالہ دیا گیا ہے۔"
  tr: "Sudanlı okuyan Al-Zain Muhammad Ahmed Al-Zain hakkında Arapça Wikipedia makalesi; sadece varlığın olayları için: 1982'de Kuzey Kordofan'da doğumu, Bara'daki Harsi inzivasında ezberlemesi, anlatımları Al-Douri ve Hafs, 2008'de Ahmed Issa Al-Ma'sarawi döneminde El-Ezher'den aldığı yetki, 2001'den beri Sayyida Sanhouri Camii imamı, yarışmalardaki sıralamaları ve bu Nil, Ertesi Gün ve İslam Yolu'na dayanmaktadır."
  id: "Artikel Wikipedia berbahasa Arab tentang pembaca bahasa Sudan Al-Zain Muhammad Ahmed Al-Zain; hanya untuk acara entitas tersebut: kelahirannya di Kordofan Utara pada tahun 1982, hafalan di retret Kharsi di Bara, narasinya Al-Douri dan Hafs, otorisasinya dari Al-Azhar di bawah Ahmed Issa Al-Ma'sarawi pada tahun 2008, imam Masjid Sayyida Sanhouri sejak 2001, peringkatnya dalam kompetisi, dan didasarkan pada Sungai Nil, Hari Selepasnya, dan Jalan Islam."
