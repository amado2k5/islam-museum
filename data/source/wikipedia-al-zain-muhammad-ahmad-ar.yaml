summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0639\u0646 \u0627\u0644\u0642\u0627\u0631\u0626 \u0627\u0644\u0633\u0648\u062f\u0627\u0646\u064a \u0627\u0644\u0632\u064a\u0646 \u0645\u062d\u0645\u062f \u0623\u062d\u0645\u062f \u0627\u0644\u0632\u064a\u0646\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u0634\u0645\u0627\u0644 \u0643\u0631\u062f\u0641\u0627\u0646 \u0641\u064a 1982\u060c \u0648\u062d\u0641\u0638\u0647 \u0641\u064a \u062e\u0644\u0648\u0629 \u062e\u0631\u0633\u064a \u0628\u0628\u0627\u0631\u0627\u060c \u0648\u0631\u0648\u0627\u064a\u062a\u0627\u0647 \u0627\u0644\u062f\u0648\u0631\u064a \u0648\u062d\u0641\u0635\u060c \u0648\u0625\u062c\u0627\u0632\u062a\u0647 \u0645\u0646 \u0627\u0644\u0623\u0632\u0647\u0631 \u0639\u0644\u0649 \u0623\u062d\u0645\u062f \u0639\u064a\u0633\u0649 \u0627\u0644\u0645\u0639\u0635\u0631\u0627\u0648\u064a \u0641\u064a 2008\u060c \u0648\u0625\u0645\u0627\u0645\u062a\u0647 \u0644\u0645\u0633\u062c\u062f \u0627\u0644\u0633\u064a\u062f\u0629 \u0633\u0646\u0647\u0648\u0631\u064a \u0645\u0646\u0630 2001\u060c \u0648\u0645\u0631\u0627\u062a\u0628\u0647 \u0641\u064a \u0627\u0644\u0645\u0633\u0627\u0628\u0642\u0627\u062a\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0627\u0644\u0646\u064a\u0644\u064a\u0646 \u0648\u0627\u0644\u064a\u0648\u0645 \u0627\u0644\u062a\u0627\u0644\u064a \u0648\u0637\u0631\u064a\u0642 \u0627\u0644\u0625\u0633\u0644\u0627\u0645."
