  ar: "مقالة ويكيبيديا العربية عن القارئ السوداني الزين محمد أحمد الزين؛ لوقائع الكيان فقط: مولده في شمال كردفان في 1982، وحفظه في خلوة خرسي ببارا، وروايتاه الدوري وحفص، وإجازته من الأزهر على أحمد عيسى المعصراوي في 2008، وإمامته لمسجد السيدة سنهوري منذ 2001، ومراتبه في المسابقات؛ وتستند إلى النيلين واليوم التالي وطريق الإسلام."
  en: "Arabic Wikipedia article on the Sudanese reciter al-Zain Muhammad Ahmad al-Zain; entity facts only: birth in North Kordofan in 1982, memorisation at the Khursi khalwa in Bara, the Duri and Hafs transmissions, his al-Azhar ijaza from Ahmad Isa al-Ma'sarawi in 2008, his imamate of the Sayyida Sanhouri Mosque since 2001, and his competition places; it cites al-Nilin, al-Youm al-Tali and IslamWay."
