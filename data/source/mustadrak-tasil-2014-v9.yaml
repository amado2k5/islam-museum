  en: "al-Mustadrak 'ala al-Sahihayn of al-Hakim — ed. and study by the Centre for Research and Information Technology, Dar al-Ta'sil, 1st ed. 1435 AH/2014 CE, vol. 9 (indexes)"
summary:
  ar: "طبعة دار التأصيل (القاهرة–بيروت)، الطبعة الأولى 1435هـ/2014م، يصفها غلافها بأنها «لأول مرة مضبوطاً ومحققاً على أقدم الأصول الخطية، ومطبوعاً بترتيبه الصحيح، ومشفوعاً بدراسة استقرائية لتعقب أحكام الإمام الحاكم على أحاديثه، مع تعيين كافة رواة أسانيد الكتاب»؛ المجلد التاسع فهارس: فهرس أطراف الأحاديث والآثار مرتباً على حروف المعجم (من ص 6)، ثم فهرس الرواة (من ص 262)."
  en: "The Dar al-Ta'sil edition (Cairo–Beirut), 1st ed. 1435 AH/2014 CE, which its title page describes as 'for the first time vocalised and edited on the oldest manuscripts, printed in its correct order, and accompanied by an inductive study tracing al-Hakim's verdicts on his hadiths, with identification of every narrator in the book's chains'; vol. 9 is an index volume: the index of hadith and report incipits in alphabetical order (from p. 6) and then the index of narrators (from p. 262)."
