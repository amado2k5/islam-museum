label:
  ar: "المستدرك على الصحيحين للحاكم — تحقيق ودراسة مركز البحوث وتقنية المعلومات، دار التأصيل، الطبعة الأولى 1435هـ/2014م، المجلد التاسع ⁦(الفهارس)⁩"
  en: "al-Mustadrak 'ala al-Sahihayn of al-Hakim — ed. and study by the Centre for Research and Information Technology, Dar al-Ta'sil, 1st ed. 1435 AH/2014 CE, vol. 9 (indexes)"
summary:
  ar: "طبعة دار التأصيل ⁦(القاهرة–بيروت)⁩، الطبعة الأولى 1435هـ/2014م، يصفها غلافها بأنها «لأول مرة مضبوطاً ومحققاً على أقدم الأصول الخطية، ومطبوعاً بترتيبه الصحيح، ومشفوعاً بدراسة استقرائية لتعقب أحكام الإمام الحاكم على أحاديثه، مع تعيين كافة رواة أسانيد الكتاب»؛ المجلد التاسع فهارس: فهرس أطراف الأحاديث والآثار مرتباً على حروف المعجم ⁦(من ص 6)⁩، ثم فهرس الرواة ⁦(من ص 262)⁩."
  en: "The Dar al-Ta'sil edition (Cairo–Beirut), 1st ed. 1435 AH/2014 CE, which its title page describes as 'for the first time vocalised and edited on the oldest manuscripts, printed in its correct order, and accompanied by an inductive study tracing al-Hakim's verdicts on his hadiths, with identification of every narrator in the book's chains'; vol. 9 is an index volume: the index of hadith and report incipits in alphabetical order (from p. 6) and then the index of narrators (from p. 262)."
  es: "La edición Dar al-Ta'sil (El Cairo-Beirut), 1.ª ed. 1435 AH/2014 CE, que en su portada se describe como «por primera vez transcrita y editada a partir de los manuscritos más antiguos, impresa en su orden correcto y acompañada de un estudio inductivo que rastrea los veredictos de al-Hakim sobre sus hadices, con la identificación de cada narrador en las cadenas del libro»; el volumen 9 es un volumen de índice: el índice de hadices e incipits de informes en orden alfabético (desde la pág. 6) y luego el índice de narradores (desde la pág. 262)."
  fr: "L'édition Dar al-Ta'sil (Le Caire-Beyrouth), 1re éd. 1435 AH/2014 CE, dont la page de titre décrit qu'elle est « vocalisée et éditée pour la première fois sur les manuscrits les plus anciens, imprimée dans son ordre correct et accompagnée d'une étude inductive retraçant les verdicts d'al-Hakim sur ses hadiths, avec l'identification de chaque narrateur dans les chaînes du livre »; le vol. 9 est un volume d'index: l'index des incipit des hadiths et des rapports par ordre alphabétique (à partir de la p. 6) puis l'index des narrateurs (à partir de la p. 262)."
  ur: "دار الطصل ایڈیشن ⁦(قاہرہ-بیروت)⁩، پہلا ایڈیشن۔ 1435ھ/2014 عیسوی، جسے اس کا ٹائٹل صفحہ بیان کرتا ہے کہ 'پہلی بار قدیم ترین مخطوطات پر آواز اور تدوین کی گئی، جو اس کے صحیح ترتیب میں چھپی، اور اس کے ساتھ ان کی احادیث پر الحاکم کے فیصلوں کا سراغ لگانے والے ایک دلکش مطالعہ کے ساتھ، کتاب میں ہر راوی کی شناخت کے ساتھ'؛ والیوم 9 ایک اشاریہ کا حجم ہے: حروف تہجی کے لحاظ سے حدیث اور رپورٹ کے انڈیکس ⁦(ص 6 سے)⁩ اور پھر راویوں کا اشاریہ ⁦(ص 262 سے)⁩۔"
  tr: "Dar al-Ta'sil Baskısı (Kahire–Beyrut), ilk baskı 1435 Hicri / 2014 M.S. kapağında \"ilk kez en eski el yazması ilkelerine göre doğrulanmış ve doğrulanmış, doğru sırayla basılmış, İmam el-Hakim'in hadisleri üzerindeki hükümlerini izlemeye yönelik tümevarımlı bir çalışma eşliğinde kitap zincirlerinin tüm rivayetçilerinin tanımlanması\" olarak tanımlanmıştır; Cilt Dokuzuncu İndeksler: Sözlükte alfabetik olarak düzenlenmiş Hadisler ve Geleneklerin Bölümleri Dizini (s. 6'dan), ardından Rivayetçiler Dizini (s. 262'den)."
  id: "Edisi Dar Al-Ta'sil (Kairo–Beirut), edisi pertama 1435 H / 2014 M, sampulnya menggambarkannya sebagai \"untuk pertama kalinya diverifikasi dan diverifikasi menurut prinsip manuskrip tertua, dicetak dalam urutan yang benar, disertai studi induktif untuk menelusuri putusan Imam al-Hakim atas haditsnya, dengan identifikasi semua narator rantai kitab tersebut\"; Indeks Jilid Sembilan: Indeks Bagian Hadis dan Tradisi yang diatur secara alfabetis dalam kamus (mulai hlm. 6), kemudian Indeks Narator (mulai hlm. 262)."
