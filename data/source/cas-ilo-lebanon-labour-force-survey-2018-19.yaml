  ar: "«إدارة الإحصاء المركزي ومنظمة العمل الدولية، مسح القوى العاملة والأحوال المعيشية للأسر، التقرير الكامل 2018-2019»، إدارة الإحصاء المركزي في لبنان، 2019. ورد في ملخص بحثي زُوّد به المتحف مع إدخال نسب اللغات في لبنان؛ ولم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص كما ورد في 21 نوفمبر 2026."
  en: "CAS and ILO, Labour Force and Household Living Conditions Survey, full report 2018-2019; CAS Lebanon, 2019. Named in a research summary supplied to the museum with the language-share entry for Lebanon; the museum did not open the page, and the founder approved using the summary as supplied on 21 November 2026."
  ur: "CAS and ILO, Labour Force and Household Living Conditions Survey, full report 2018-2019؛ CAS Lebanon, 2019۔ متحف کو فراہم کردہ تحقیقی خلاصے میں لبنان کے زبانوں کے تناسب کے اندراج کے ساتھ مذکور؛ متحف نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو خلاصے کو جیسا ملا اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "CAS and ILO, Labour Force and Household Living Conditions Survey, full report 2018-2019 ; CAS Lebanon, 2019. Nommé dans un résumé de recherche remis au musée avec l'entrée des parts de langues pour le Liban ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026."
  es: "CAS and ILO, Labour Force and Household Living Conditions Survey, full report 2018-2019; CAS Lebanon, 2019. Nombrado en un resumen de investigación entregado al museo con la entrada de proporciones de lenguas de Líbano; el museo no abrió la página, y el fundador aprobó usar el resumen tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Merkezi İstatistik Departmanı ve Uluslararası Çalışma Örgütü, İşgücü ve Hanehalkı Yaşam Koşulları Anketi, Tam Rapor 2018-2019,\" Lübnan Merkez İstatistik İdaresi, 2019. Müze tarafından sağlanan bir araştırma özetinde Lübnan'daki dil yüzdeleri de dahil edilmiştir; müze sayfayı açmamış ve kurucu 21 Kasım 2026'da belirtildiği gibi özetin kullanımına izin vermiştir."
  id: "\"Departemen Statistik Pusat dan Survei Kondisi Hidup Angkatan Kerja dan Rumah Tangga Organisasi Perburuhan Internasional, Laporan Lengkap 2018-2019,\" Administrasi Statistik Pusat Lebanon, 2019. Laporan ini disebutkan dalam ringkasan penelitian yang disediakan oleh museum termasuk persentase bahasa di Lebanon; museum tidak membuka halaman tersebut, dan pendiri mengizinkan penggunaan ringkasan tersebut seperti yang dinyatakan pada 21 November 2026."
