summary:
  ar: "مقالة ويكيبيديا الأردية عن عبد الكريم خان؛ تُستخدم لوقائع الكيان فقط. صندوقها يجعل ولادته في 11 تشرين الثاني 1872 في كيرانا ووفاته في 27 تشرين الأول 1937، وتصف غناءه بأنه جمع بين الروحانية الإسلامية والهندوسية — وصف لفنّه، لا تسمية لمذهب. متنها يذكر سنة ولادته 1882 سهوا خلافا لصندوقها وللمقالة الإنجليزية."
  en: "Urdu Wikipedia article on Abdul Karim Khan; used for entity facts only. Its infobox gives him born 11 November 1872 at Kairana and died 27 October 1937; its text describes his singing as fusing Islamic and Hindu spirituality — a description of his art, naming no school. Its lead gives his birth year as 1882, a slip against its own infobox and the English article."
  es: "Artículo de Wikipedia en urdu sobre Abdul Karim Khan; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació el 11 de noviembre de 1872 en Kairana y falleció el 27 de octubre de 1937; su texto describe su canto como una fusión de la espiritualidad islámica e hindú, una descripción de su arte que no menciona ninguna escuela. El titular indica que nació en 1882, un error que contradice su propia ficha informativa y el artículo en inglés."
  fr: "Article Wikipédia en ourdou sur Abdul Karim Khan; utilisé uniquement pour les informations sur l'entité. Son infobox indique qu'il est né le 11 novembre 1872 à Kairana et décédé le 27 octobre 1937; son texte décrit son chant comme une fusion des spiritualités islamique et hindoue — une description de son art, sans mentionner d'école. Son introduction indique son année de naissance comme étant 1882, une erreur par rapport à son infobox et à l'article en anglais."
  ur: "عبدالکریم خان پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا انفو باکس بتاتا ہے کہ وہ 11 نومبر 1872 کو کیرانہ میں پیدا ہوئے اور 27 اکتوبر 1937 کو انتقال کر گئے۔ اس کے متن میں اس کی گائیکی کو اسلامی اور ہندو روحانیت کے امتزاج کے طور پر بیان کیا گیا ہے - اس کے فن کی وضاحت، کسی اسکول کا نام نہیں لیا۔ اس کا لیڈ اس کا سال پیدائش 1882 بتاتا ہے، جو اس کے اپنے انفو باکس اور انگریزی مضمون کے خلاف ایک پرچی ہے۔"
