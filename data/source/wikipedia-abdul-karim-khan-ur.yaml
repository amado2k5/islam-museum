  ar: "مقالة ويكيبيديا الأردية عن عبد الكريم خان؛ تُستخدم لوقائع الكيان فقط. صندوقها يجعل ولادته في 11 تشرين الثاني 1872 في كيرانا ووفاته في 27 تشرين الأول 1937، وتصف غناءه بأنه جمع بين الروحانية الإسلامية والهندوسية — وصف لفنّه، لا تسمية لمذهب. متنها يذكر سنة ولادته 1882 سهوا خلافا لصندوقها وللمقالة الإنجليزية."
  en: "Urdu Wikipedia article on Abdul Karim Khan; used for entity facts only. Its infobox gives him born 11 November 1872 at Kairana and died 27 October 1937; its text describes his singing as fusing Islamic and Hindu spirituality — a description of his art, naming no school. Its lead gives his birth year as 1882, a slip against its own infobox and the English article."
