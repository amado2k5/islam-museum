summary:
  ar: "مدخل «خواننده» في موسوعة TDV الإسلامية: مصطلح الموسيقى التركية للمغنّين والمغنّيات في الأداء المنفرد والجماعي، ومقابلاته العربية مغنّي ومغنّية والفارسية گوينده وقوّال، وتقسيم قانتمير أوغلو للفصل إلى فصل الخوانده وفصل السازنده والفصل المشترك، ومهام الصرهانده في قيادة الفصل، وأسماء أشهر الخوانده في القرنين التاسع عشر والعشرين."
  en: "The TDV İslâm Ansiklopedisi entry on the hânende: the Turkish-music term for the male and female vocal artists of solo and ensemble performance, its Arabic equivalents mugannî and muganniye and Persian gûyende and kavvâl, Cantemir's threefold division of the fasıl into hânende, sâzende and mixed fasıls, the serhânende's direction of the ensemble with the def, and the noted hânendes of the nineteenth and twentieth centuries."
  ur: "TDV اسلام انسائیکلوپیڈیا کا «خوانندہ» مدخل: ترک موسیقی میں انفرادی اور جماعتی ادائیگی کے مرد و زنانہ آواز کے فنکاروں کی اصطلاح؛ عربی متبادل مغنی و مغنیہ اور فارسی گویندہ و قوّال، قانتمیر اوغلو کی فصل کی سہ گنا تقسیم، سرخوانندہ کا دف سے فصل کی قیادت، اور انیسویں و بیسویں صدی کے مشہور خوانندے۔"
