summary:
  ar: "مدخل «خواننده» في موسوعة TDV الإسلامية: مصطلح الموسيقى التركية للمغنّين والمغنّيات في الأداء المنفرد والجماعي، ومقابلاته العربية مغنّي ومغنّية والفارسية گوينده وقوّال، وتقسيم قانتمير أوغلو للفصل إلى فصل الخوانده وفصل السازنده والفصل المشترك، ومهام الصرهانده في قيادة الفصل، وأسماء أشهر الخوانده في القرنين التاسع عشر والعشرين."
  en: "The TDV İslâm Ansiklopedisi entry on the hânende: the Turkish-music term for the male and female vocal artists of solo and ensemble performance, its Arabic equivalents mugannî and muganniye and Persian gûyende and kavvâl, Cantemir's threefold division of the fasıl into hânende, sâzende and mixed fasıls, the serhânende's direction of the ensemble with the def, and the noted hânendes of the nineteenth and twentieth centuries."
  ur: "TDV اسلام انسائیکلوپیڈیا کا «خوانندہ» مدخل: ترک موسیقی میں انفرادی اور جماعتی ادائیگی کے مرد و زنانہ آواز کے فنکاروں کی اصطلاح؛ عربی متبادل مغنی و مغنیہ اور فارسی گویندہ و قوّال، قانتمیر اوغلو کی فصل کی سہ گنا تقسیم، سرخوانندہ کا دف سے فصل کی قیادت، اور انیسویں و بیسویں صدی کے مشہور خوانندے۔"
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el hânende: el término de la música turca para los artistas vocales masculinos y femeninos de interpretación solista y en conjunto, sus equivalentes árabes mugannî y muganniye y persas gûyende y kavvâl, la triple división del fasıl de Cantemir en hânende, sâzende y fasıls mixtos, la dirección del conjunto por parte del serhânende con el def, y los hânendes destacados de los siglos XIX y XX."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur le hânende: le terme de musique turque pour les artistes vocaux masculins et féminins de performance solo et d'ensemble, ses équivalents arabes mugannî et muganniye et persans gûyende et kavvâl, la division tripartite du fasıl par Cantemir en hânende, sâzende et fasıls mixtes, la direction de l'ensemble par le serhânende avec le def, et les hânendes célèbres des XIXe et XXe siècles."
  tr: "TDV İslami Ansiklopedisi'nde 'Khwanandeh' Girişi: Türk müziği için erkek ve kadın şarkıcıların solo ve grup performanslarında kullandığı terim, Arapça'daki karşılıkları 'Singer and Singer' ile Farsça 'Güynde' ve 'Qawal'dır; Qantamiroglu'nun bölümü 'Khwandeh' bölümü, 'Constructor' bölümü ve ortak şube, sarhandeh'in sınıfı yönetme görevleri ve 19. ve 20. yüzyılların en ünlü 'Khwanandeh' isimleri."
  id: "Pengantar 'Khwanandeh' dalam Ensiklopedia Islam TDV: Istilah untuk musik Turki bagi penyanyi pria dan wanita dalam penampilan solo dan kelompok, padanan Arabnya adalah 'Penyanyi dan Penyanyi' serta dalam bahasa Persia 'Güynde' dan 'Qawal', pembagian bagian oleh Qantamiroglu menjadi bagian 'Khwandeh', bab 'Konstruktor', dan bab gabungan, tugas sarhandeh dalam memimpin kelas, serta nama-nama 'Khwanandeh' paling terkenal pada abad ke-19 dan ke-20."
