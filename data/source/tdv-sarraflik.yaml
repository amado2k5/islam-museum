summary:
  ar: "مدخل «صرّافة» في موسوعة TDV الإسلامية بقسمين: مهنة الصرّاف في العالم الإسلامي وأحكامها وشروبها، ثم الصرّافون في الدولة العثمانية ودورهم في المالية والالتزام حتى إلغاء المهنة سنة 1916."
  en: "The TDV İslâm Ansiklopedisi entry on money-changing in two sections: the money-changer's trade in the Islamic world, its rules and frauds, then the Ottoman sarrafs and their role in state finance and tax-farming until the trade was abolished in 1916."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre el cambio de divisas se divide en dos secciones: el oficio del cambista en el mundo islámico, sus normas y fraudes, y luego los sarrafs otomanos y su papel en las finanzas estatales y la recaudación de impuestos hasta que el oficio fue abolido en 1916."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le change d'argent est divisé en deux sections: le commerce du changeur d'argent dans le monde islamique, ses règles et ses fraudes, puis les sarrafs ottomans et leur rôle dans les finances de l'État et la perception des impôts jusqu'à l'abolition de ce commerce en 1916."
  ur: "TDV İslâm Ansiklopedisi کا اندراج رقم کی تبدیلی پر دو حصوں میں: اسلامی دنیا میں منی چینجر کی تجارت، اس کے قوانین اور فراڈ، پھر عثمانی صراف اور ریاستی مالیات اور ٹیکس فارمنگ میں ان کا کردار جب تک کہ 1916 میں تجارت کو ختم نہیں کر دیا گیا۔"
  tr: "TDV İslami Ansiklopedisi'ndeki \"Para Değişimi\" maddesi iki bölüme ayrılmıştır: İslam dünyasında para değiştiriciler mesleği, hükümleri ve içkileri, ardından Osmanlı devletindeki para değiştiriciler ve bunların 1916'da meslek kaldırılana kadar finans ve bağlılıktaki rolleri."
  id: "Entri \"Money Exchange\" dalam Ensiklopedia Islam TDV dibagi menjadi dua bagian: profesi penukar uang di dunia Islam, keputusannya, dan minumannya, lalu penukar uang di negara Ottoman dan peran mereka dalam keuangan dan komitmen hingga profesi tersebut dihapuskan pada tahun 1916."
