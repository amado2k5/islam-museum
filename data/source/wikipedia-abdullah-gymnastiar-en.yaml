  id: "Artikel Wikipedia bahasa Inggris tentang Abdullah Gimnastyar \"A Gheim\" (lahir 1962), seorang pendeta Indonesia dan pendiri Yayasan Dar Al-Tawheed di Bandung; artikel ini hanya digunakan untuk fakta entitas, dengan mengutip setiap insiden dengan sumbernya seperti yang disebutkan dalam artikel."
