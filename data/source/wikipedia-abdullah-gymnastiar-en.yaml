  fr: "Article de Wikipédia en anglais sur Abdullah Gymnastiar (« Aa Gym », né en 1962), le prédicateur indonésien qui a fondé la fondation Daarut Tauhiid à Bandung; utilisé uniquement pour les faits concernant l'entité, chaque citation étant indiquée dans l'article qui donne sa propre source."
  ur: "عبداللہ جمناسٹیار ⁦('آ جم'، پیدائش 1962)⁩ پر انگریزی ویکیپیڈیا کا مضمون، انڈونیشیائی مبلغ جس نے بنڈونگ میں Daarut Tauhiid فاؤنڈیشن کی بنیاد رکھی۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک کا حوالہ دیا جاتا ہے جہاں مضمون اپنا ماخذ دیتا ہے۔"
