summary:
  ar: "تقرير أفريكا برس عن الإفطار الجماعي السادس على مستوى إثيوبيا في أديس أبابا؛ ينصّ على أن الأستاذ حيدر كدير هو رئيس مجلس شباب مسلمي إثيوبيا، وينقل تصريحاته عن إقامة البرنامج في أنحاء البلاد في وقت واحد."
  en: "Africa Press report on the sixth annual nationwide Grand Street Iftar in Addis Ababa; it states that Ustaz Hayder Kedir is President of the Ethiopian Muslim Youth Council and quotes his remarks on the programme being held simultaneously across the country."
  es: "Africa Press informa sobre el sexto Iftar anual de Grand Street en Addis Abeba; en él se afirma que Ustaz Hayder Kedir es el presidente del Consejo de la Juventud Musulmana Etíope y se citan sus declaraciones sobre el programa que se celebra simultáneamente en todo el país."
  fr: "Africa Press rend compte du sixième Iftar annuel national de Grand Street à Addis-Abeba; l'article indique qu'Ustaz Hayder Kedir est président du Conseil de la jeunesse musulmane éthiopienne et cite ses remarques sur le programme organisé simultanément dans tout le pays."
  ur: "عدیس ابابا میں چھٹی سالانہ ملک گیر گرینڈ سٹریٹ افطار پر افریقہ پریس کی رپورٹ؛ اس میں کہا گیا ہے کہ استاد حیدر کیدیر ایتھوپیا کی مسلم یوتھ کونسل کے صدر ہیں اور ملک بھر میں بیک وقت منعقد ہونے والے پروگرام پر اپنے تاثرات کا حوالہ دیتے ہیں۔"
  tr: "Africa Press'in Addis Ababa'daki Etiyopya'daki altıncı toplu iftar raporu, Bay Haidar Kadir'in Etiyopya Müslüman Gençlik Konseyi'nin başkanı olduğunu belirtiyor ve programın ülke genelinde eşzamanlı olarak düzenlenmesine dair açıklamalarını aktarıyor."
  id: "Laporan Africa Press tentang Iftar kolektif keenam di Ethiopia di Addis Ababa menyatakan bahwa Bapak Haidar Kadir adalah kepala Dewan Pemuda Muslim Ethiopia, dan menyampaikan pernyataannya tentang penyelenggaraan program tersebut secara bersamaan di seluruh negeri."
