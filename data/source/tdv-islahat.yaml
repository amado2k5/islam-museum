label:
  ar: "الإصلاحات — موسوعة TDV الإسلامية ⁦(محمد إبشيرلي وكمال بيدلي)⁩"
  en: "İSLAHAT (reforms) — TDV İslâm Ansiklopedisi (Mehmet İpşirli, Kemal Beydilli)"
summary:
  ar: "مدخل «إصلاحات» في موسوعة TDV الإسلامية بقسميه: الإصلاح في اللغة والفقه وتاريخ الدعوة والتجديد، ثم الإصلاحات العثمانية في الدولة من الأوامر والفرمانات إلى التنظيمات."
  en: "The TDV İslâm Ansiklopedisi entry on islahat, in its two sections: reform in language, fiqh and the history of renewal, then the Ottoman reforms of state from the early orders and fermans to the Tanzimat."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre islahat, en sus dos secciones: reforma en el idioma, fiqh y la historia de la renovación, luego las reformas estatales otomanas desde las primeras órdenes y fermans hasta el Tanzimat."
  fr: "L'entrée de TDV İslâm Ansiklopedisi sur l'islahat, dans ses deux sections: la réforme de la langue, du fiqh et de l'histoire du renouveau, puis les réformes ottomanes de l'État depuis les premiers ordres et fermans jusqu'aux Tanzimat."
  ur: "اصلاح پر TDV İslâm Ansiklopedisi اندراج، اس کے دو حصوں میں: زبان میں اصلاحات، فقہ اور تجدید کی تاریخ، پھر ابتدائی احکامات اور فرمان سے لے کر تنزیمت تک ریاست کی عثمانی اصلاحات۔"
  tr: "TDV İslami Ansiklopedisi'nde \"İslahat\" maddesi iki bölümde yer alır: dil ve fıkıh reformu, Da'wa ve Yenilenme tarihi, ardından Osmanlı reformları devlet reformlarından tarikatlardan örgütlere kadar."
  id: "Entri \"Islahat\" dalam Ensiklopedia Islam TDV dalam dua bagian: reformasi bahasa dan yurisprudensi, serta sejarah Da'wah dan Pembaruan, kemudian reformasi Ottoman di negara dari perintah dan firman menjadi organisasi."
