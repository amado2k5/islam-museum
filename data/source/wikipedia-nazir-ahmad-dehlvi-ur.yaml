  ar: "مقالة ويكيبيديا الأردية عن ديبتي نذير أحمد؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بصيغة «1836 أو 6 ديسمبر 1831» ووفاته في دلهي في 3 مايو 1912، وخدمته في حيدر آباد، وألقابه ودرجاته الفخرية، وقائمة مؤلفاته وترجماته."
  en: "Urdu Wikipedia article on Deputy Nazir Ahmad; used for entity facts only. It gives his birth as '1836 or 6 December 1831', his death at Delhi on 3 May 1912, his Hyderabad service, his title and honorary degrees, and fuller lists of his works and translations."
