reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A separately edited article. Its lead prints the birth as '1836 or 6 December 1831' — the day-and-month pairing with 1831 rather than the English article's 1833 — and its categories file him under 1836 births; the death (3 May 1912, Delhi; buried in the Shah Baqi Billah cemetery by New Delhi railway station) agrees with every other source. It adds facts absent from the English article: his Hyderabad service as a settlement officer at Rs 800 a month, the Hyderabad title 'Ghayur Jung' which he declined, the Shamsul Ulema title dated 1897, the honorary LLD of Edinburgh University (1902) and the DOL of Punjab University (1910), and works such as al-Huquq wa'l-Fara'iz and Muntakhab al-Hikayat. It names no school for him."
