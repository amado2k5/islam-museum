  fr: "Article de Wikipédia en ourdou sur le député Nazir Ahmad; utilisé uniquement à titre informatif. Il indique sa date de naissance: « 1836 ou le 6 décembre 1831 », son décès à Delhi le 3 mai 1912, son service à Hyderabad, son titre et ses diplômes honorifiques, ainsi qu’une liste plus complète de ses œuvres et traductions."
