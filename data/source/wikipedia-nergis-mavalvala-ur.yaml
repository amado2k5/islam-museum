summary:
  ar: "مقالة ويكيبيديا الأردية عن نرگس ماولوالا؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها سنة 1968 في لاهور ونشأتها في كراتشي، وتصف أسرتها بأنها «أسرة فارسية ⁦(من أتباع الزرادشتية)⁩» — صياغة أسرية، ولا تنسب إليها دينا في نصها."
  en: "Urdu Wikipedia article on Nergis Mavalvala; used for entity facts only. It gives her birth in 1968 at Lahore and her upbringing in Karachi, and describes her family as 'a Parsi family (followers of Zoroastrianism)' — a family framing; its text names no religion for her personally."
  es: "Artículo de Wikipedia en urdu sobre Nergis Mavalvala; se utiliza únicamente para datos biográficos. Indica que nació en 1968 en Lahore y que se crió en Karachi, y describe a su familia como «una familia parsi (seguidores del zoroastrismo)»; el texto no menciona ninguna religión en particular para ella."
  fr: "L'article de Wikipédia en ourdou sur Nergis Mavalvala, utilisé uniquement à des fins d'information sur l'entité, indique sa naissance en 1968 à Lahore et son enfance à Karachi. Il décrit sa famille comme « une famille parsie (adeptes du zoroastrisme) » – un contexte familial; le texte ne mentionne aucune religion pour elle personnellement."
  ur: "نرگس ماول والا پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1968 میں اس کی پیدائش لاہور میں ہوئی اور اس کی پرورش کراچی میں ہوئی، اور اس کے خاندان کو 'پارسی خاندان ⁦(زروتشت کے پیروکار)⁩' کے طور پر بیان کیا گیا ہے۔ اس کا متن اس کے ذاتی طور پر کسی مذہب کا نام نہیں رکھتا۔"
  tr: "Nargis Maulwala hakkında Urduca Vikipedi makalesi; sadece varlık gerçekleri için kullanılmıştır. 1968'de Lahor'da doğduğunu ve Karaçi'de yetiştirildiğini belirterek, ailesini \"Pers ailesi (Zerdüştlük takipçileri)\" olarak tanımlar — bu aile ifadesi ve metinde ona hiçbir din atfedilmemiştir."
  id: "Artikel Wikipedia Urdu tentang Nargis Maulwala; digunakan hanya untuk fakta entitas. Ia menyebutkan kelahirannya pada tahun 1968 di Lahore dan masa kecilnya di Karachi, menggambarkan keluarganya sebagai \"keluarga Persia (pengikut Zoroastrianisme)\" — sebuah frasa keluarga, dan tidak ada agama yang dikaitkan dengannya dalam teksnya."
