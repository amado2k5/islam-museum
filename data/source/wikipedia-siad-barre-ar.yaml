summary:
  ar: "مقالة ويكيبيديا العربية عن محمد سياد بري؛ تُستخدم لوقائع الكيان فقط. تروي صعوده بانقلاب 1969 ورئاسته الصومال حتى 1991 وأيديولوجية نظامه الاشتراكية–الإسلامية وسقوطه ووفاته، ولا تسمي مذهبا له."
  en: "Arabic Wikipedia article on Siad Barre; used for entity facts only. It recounts his rise in the 1969 coup, his presidency of Somalia until 1991, his regime's socialist-Islamic ideology, his fall and his death. It names no school for him."
  es: "Artículo en árabe de la Wikipedia sobre Siad Barre; se utiliza únicamente para obtener información sobre la persona. Narra su ascenso al poder en el golpe de Estado de 1969, su presidencia de Somalia hasta 1991, la ideología socialista-islámica de su régimen, su caída y su muerte. No menciona ninguna escuela en su honor."
  fr: "Article de Wikipédia en arabe sur Siad Barre; utilisé uniquement à des fins d'information sur l'entité. Il relate son ascension suite au coup d'État de 1969, sa présidence de la Somalie jusqu'en 1991, l'idéologie socialiste-islamique de son régime, sa chute et sa mort. Aucune école n'est mentionnée à son nom."
  ur: "عربی ویکیپیڈیا مضمون سیاد بیرے پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1969 کی بغاوت میں ان کے عروج، 1991 تک صومالیہ کی ان کی صدارت، اس کی حکومت کے سوشلسٹ-اسلامی نظریہ، اس کے زوال اور اس کی موت کا ذکر ہے۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Mohamed Siad Barre hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1969 darbesiyle yükselişini, 1991'e kadar Somali başkanlığını, sosyalist-İslami rejiminin ideolojisini, çöküşünü ve ölümünü anlatır ve mezhebi isimlendirilmez."
  id: "Artikel Wikipedia berbahasa Arab tentang Mohamed Siad Barre; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kebangkitannya dengan kudeta 1969, masa kepresidenannya di Somalia hingga 1991, ideologi rezim sosialis-Islamnya, kejatuhannya, dan kematiannya, serta tidak menyebutkan sektenya."
