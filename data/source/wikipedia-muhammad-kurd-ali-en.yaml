reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision; the article itself carries 'confusing' and 'more citations needed' banners. It gives his birth at Damascus in 1876, his death at Damascus on Thursday 2 April 1953 and his burial beside the tomb of Muawiya ibn Abi Sufyan, and names Tahir al-Jazairi among the Damascus scholars whose company he kept and from whose knowledge he drew. On religion it states only, citing Rainer Brünner's Islamic Ecumenism in the 20th Century (2004), that he was noted for anti-Shia polemics — a stance toward another community, not a naming of his own school — and its categories file him under 'Critics of Shia Islam'; no affiliation is named for him personally."
