summary:
  ar: "الصفحة الرئيسة لموقع تطبيق «القرآن المجيد» كما قُرئت في 7 نوفمبر 2026: خصائص التطبيق، وأكثر من 30 قارئًا، وترجمات وتفاسير بأكثر من 50 لغة، ومنصاته، وأرقامه المعلنة، وعبارة «منذ 2010»."
  en: "The home page of the Quran Majeed app's site as read on 7 November 2026: its features, 30+ reciters, translations and tafsir in more than 50 languages, its platforms, its stated figures, and the line 'since 2010'."
  ur: "«قرآن مجید» ایپ کی ویب سائٹ کا مرکزی صفحہ، 7 نومبر 2026 کو پڑھا گیا: خصوصیات، 30 سے زیادہ قراء، 50 سے زیادہ زبانوں میں تراجم و تفاسیر، پلیٹ فارم، بیان کردہ اعداد، اور «2010 سے»۔"
  es: "La página principal del sitio web de la aplicación Quran Majeed, tal como se leía el 7 de noviembre de 2026: sus características, más de 30 recitadores, traducciones y tafsir en más de 50 idiomas, sus plataformas, sus cifras declaradas y la frase \"desde 2010\"."
  fr: "La page d'accueil du site de l'application Quran Majeed telle que consultée le 7 novembre 2026: ses fonctionnalités, plus de 30 récitants, traductions et tafsir dans plus de 50 langues, ses plateformes, ses chiffres annoncés et la mention « depuis 2010 »."
  tr: "'El-Kuran El-Majid' uygulamasının ana sayfası 7 Kasım 2026 tarihinde okunuyordu: uygulama özellikleri, 30'dan fazla okuyucu, 50'den fazla dilde çeviri ve yorumlar, platformları, duyurulan rakamlar ve '2010'dan beri' ifadesi."
  id: "Beranda aplikasi 'Al-Quran Al-Majid' seperti yang dibaca pada 7 November 2026: fitur aplikasi, lebih dari 30 pembaca, terjemahan dan interpretasi dalam lebih dari 50 bahasa, platformnya, angka pengumuman, dan frasa 'sejak 2010'."
