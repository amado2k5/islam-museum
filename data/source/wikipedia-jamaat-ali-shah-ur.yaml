summary:
  ar: "مقالة ويكيبيديا الأردية عن سيد جماعة علي شاه، وهي نص مستقل عن الإنجليزية: تنص على مولده سنة 1834 في علي بور سيدان بضلع سيالكوت، وعلى أن انتماءه كان إلى مسلك أهل السنة والجماعة، وعلى دخوله السلسلة النقشبندية على يد فقير محمد جوراهي ومنحه خرقة الخلافة، وتؤرخ وفاته بـ 26 ذي القعدة 1370 هـ ⁦(30 آب 1951)⁩."
  en: "The Urdu Wikipedia article on Syed Jamaat Ali Shah, a text independent of the English article: it states his birth in 1834 at Alipur Sayyidan in Sialkot district, that his affiliation was with the maslak of Ahl-e-Sunnat wa Jama'at, that he entered the Naqshbandi silsila at the hand of Faqir Muhammad Churahi and was granted the khirqa of khilafa, and it dates his death to 26 Dhu al-Qa'da 1370 AH (30 August 1951)."
  es: "El artículo de Wikipedia en urdu sobre Syed Jamaat Ali Shah, un texto independiente del artículo en inglés: afirma que nació en 1834 en Alipur Sayyidan en el distrito de Sialkot, que entró en la silsila Naqshbandi de la mano de Faqir Muhammad Churahi y se le concedió la khirqa de Khilafah, y fecha su muerte en el 26 de Dhu al-Qa'da de 1370 AH (30 de agosto). 1951)."
  fr: "L'article de Wikipédia en ourdou sur Syed Jamaat Ali Shah, un texte indépendant de l'article anglais: il indique qu'il est né en 1834 à Alipur Sayyidan dans le district de Sialkot, qu'il est entré dans la silsila de Naqshbandi aux mains de Faqir Muhammad Churahi et a obtenu la khirqa du Khilafah, et il date sa mort du 26 Dhu al-Qa'da 1370 AH (30 août). 1951)."
