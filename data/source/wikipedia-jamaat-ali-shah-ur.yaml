summary:
  ar: "مقالة ويكيبيديا الأردية عن سيد جماعة علي شاه، وهي نص مستقل عن الإنجليزية: تنص على مولده سنة 1834 في علي بور سيدان بضلع سيالكوت، وعلى أن انتماءه كان إلى مسلك أهل السنة والجماعة، وعلى دخوله السلسلة النقشبندية على يد فقير محمد جوراهي ومنحه خرقة الخلافة، وتؤرخ وفاته بـ 26 ذي القعدة 1370 هـ (30 آب 1951)."
  en: "The Urdu Wikipedia article on Syed Jamaat Ali Shah, a text independent of the English article: it states his birth in 1834 at Alipur Sayyidan in Sialkot district, that his affiliation was with the maslak of Ahl-e-Sunnat wa Jama'at, that he entered the Naqshbandi silsila at the hand of Faqir Muhammad Churahi and was granted the khirqa of khilafa, and it dates his death to 26 Dhu al-Qa'da 1370 AH (30 August 1951)."
