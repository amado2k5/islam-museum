summary:
  ar: "عنصر ويكي بيانات Q118725 لحافظ الأسد، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته في 6 أكتوبر 1930 في القرداحة ووفاته في 10 يونيو 2000 في دمشق ودفنه في ضريح الأسد، وقيمة دين هي عنصر العلويين نفسه."
  en: "Wikidata item Q118725 for Hafez al-Assad, grounded through the English article's pageprops; used for entity facts only. It gives his birth on 6 October 1930 at Qardaha, his death on 10 June 2000 at Damascus, burial at the Assad Mausoleum, and a religion value that is the Alawites item itself."
  es: "El elemento de Wikidata Q118725 sobre Hafez al-Assad, basado en los atributos de la página del artículo en inglés, se utiliza únicamente para obtener información sobre la entidad. Indica su nacimiento el 6 de octubre de 1930 en Qardaha, su fallecimiento el 10 de junio de 2000 en Damasco, su entierro en el Mausoleo de Assad y un valor religioso que corresponde al propio elemento sobre los alauitas."
  fr: "L'élément Q118725 de Wikidata concernant Hafez al-Assad, basé sur les propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance le 6 octobre 1930 à Qardaha, son décès le 10 juin 2000 à Damas, son inhumation au mausolée Assad, et son appartenance religieuse (Alaouites)."
  ur: "حفیظ الاسد کے لیے ویکی ڈیٹا آئٹم Q118725، انگریزی مضمون کے صفحہ پروپس پر مبنی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 6 اکتوبر 1930 کو قردہہ میں ان کی پیدائش، 10 جون 2000 کو دمشق میں ان کی موت، اسد کے مقبرے میں تدفین، اور ایک مذہبی قدر ہے جو خود علوی شے ہے۔"
