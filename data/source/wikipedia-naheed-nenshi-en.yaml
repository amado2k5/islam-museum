summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ناهيد نينشي؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في تورنتو في 2 فبراير 1972، ودوراته الثلاث عمدةً لكالغاري (2010–2021)، وقيادته الحزب الديمقراطي الجديد في ألبرتا منذ 2024، وتذكر في نصّها أنه شيعي إسماعيلي مستشهدة بموقع «الإسماعيلي»."
  en: "English Wikipedia article on Naheed Nenshi; used for entity facts only. It gives his birth in Toronto on 2 February 1972, his three terms as mayor of Calgary (2010–2021) and his leadership of the Alberta NDP from 2024, and states in its text, citing The Ismaili, that he is a Shia Ismaili."
  es: "Artículo de la Wikipedia en inglés sobre Naheed Nenshi; utilizado únicamente para datos sobre la persona. Indica que nació en Toronto el 2 de febrero de 1972, que fue alcalde de Calgary durante tres mandatos (2010-2021) y que liderará el NDP de Alberta a partir de 2024. En su texto, citando a The Ismaili, afirma que es un ismaelita chiíta."
  fr: "L'article de Wikipédia en anglais sur Naheed Nenshi, utilisé uniquement pour les informations sur l'entité, indique sa naissance à Toronto le 2 février 1972, ses trois mandats de maire de Calgary (2010-2021) et sa direction du NPD de l'Alberta à partir de 2024. Il précise également, en citant The Ismaili, qu'il est un ismaélien chiite."
  ur: "ناہید نینشی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 2 فروری 1972 کو ٹورنٹو میں ان کی پیدائش، کیلگری کے میئر کے طور پر ان کی تین میعادیں (2010–2021) اور 2024 سے البرٹا NDP کی قیادت، اور اس کے متن میں اسماعیلی کا حوالہ دیتے ہوئے کہتا ہے کہ وہ شیعہ اسماعیلی ہیں۔"
