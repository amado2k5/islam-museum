summary:
  ar: "الجزء الأول «المقدمات المنطقية - الأحكام» من المستصفى للإمام أبي حامد محمد بن محمد الغزالي ⁦(450-505هـ)⁩، دراسة وتحقيق الدكتور حمزة بن زهير حافظ، أستاذ أصول الفقه المساعد بكلية الشريعة في الجامعة الإسلامية بالمدينة المنورة، مع فروق النسخ في الحواشي."
  en: "Volume 1 (the logical introduction and the first pole, on rulings) of al-Mustasfa by Imam Abu Hamid Muhammad ibn Muhammad al-Ghazali (450-505 AH), studied and edited by Dr Hamza ibn Zuhayr Hafiz, assistant professor of legal theory at the Faculty of Shari'a, Islamic University of Medina, with manuscript variants in the notes."
  ur: "امام ابو حامد محمد بن محمد غزالی ⁦(450-505ھ)⁩ کی المستصفیٰ کی جلد اول ⁦(منطقی مقدمات اور احکام)⁩، تحقیق ڈاکٹر حمزہ بن زہیر حافظ، اسسٹنٹ پروفیسر اصولِ فقہ، کلیۃ الشریعہ، جامعہ اسلامیہ مدینہ منورہ، حواشی میں نسخوں کے فروق کے ساتھ۔"
