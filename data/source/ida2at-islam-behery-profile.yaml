label: { en: "Ida2at: Islam Behery — enlightenment thought as the state wants it", ar: "إضاءات: إسلام بحيري — الفكر التنويري كما تريده الدولة" }
summary:
  ar: "تاريخ مهني لإسلام بحيري في موقع إضاءات: دراسته الحقوق وعمله باحثا في وزارة الأوقاف الكويتية، وعمله في اليوم السابع ورئاسته مركز الدراسات الإسلامية بها، ومناظراته التلفزيونية سنة 2013 ومناظرتا أبريل 2015، وينقل من مقابلته مع مجلة صباح الخير قوله إنه بدأ الكتابة سنة 2003 دفاعا عن الدين من شوائب كتب التراث."
  en: "A career history of Islam Behery on the Ida2at site: his law studies and his post as a researcher at the Kuwaiti Ministry of Awqaf, his Youm7 years and his heading of its Islamic Studies Centre, his 2013 televised debates and the April 2015 debates; it quotes his Sabah Al-Kheir interview, in which he said he began publishing in 2003 in defence of the religion against the impurities of the heritage books."
  es: "En el sitio web Ida2at se puede consultar la trayectoria profesional de Islam Behery: sus estudios de derecho y su puesto como investigador en el Ministerio de Asuntos Religiosos de Kuwait, sus años en Youm7 y su dirección del Centro de Estudios Islámicos, sus debates televisados de 2013 y los de abril de 2015; también se cita su entrevista con Sabah Al-Kheir, en la que afirmó haber comenzado a publicar en 2003 en defensa de la religión contra las impurezas de los libros tradicionales."
  fr: "Le site Ida2at retrace la carrière d'Islam Behery: ses études de droit et son poste de chercheur au ministère koweïtien des Awqaf, ses années chez Youm7 et sa direction de son Centre d'études islamiques, ses débats télévisés de 2013 et ceux d'avril 2015; on y cite son interview à Sabah Al-Kheir, dans laquelle il explique avoir commencé à publier en 2003 pour défendre la religion contre les impuretés des livres du patrimoine."
  ur: "Ida2at سائٹ پر اسلام بیہری کی کیریئر کی تاریخ: اس کا قانون کا مطالعہ اور کویتی وزارت اوقاف میں ایک محقق کی حیثیت سے ان کا عہدہ، اس کے یوم 7 سال اور اس کے اسلامک اسٹڈیز سینٹر کی سربراہی، اس کے 2013 کے ٹیلی ویژن مباحثے اور اپریل 2015 کے مباحث؛ اس میں ان کے صباح الخیر انٹرویو کا حوالہ دیا گیا ہے، جس میں انہوں نے کہا تھا کہ انہوں نے 2003 میں وراثتی کتابوں کی نجاستوں کے خلاف مذہب کے دفاع میں اشاعت شروع کی تھی۔"
  tr: "İddaat web sitesinde İslam Behiri'nin profesyonel tarihi: hukuk çalışmaları ve Kuveyt Awqaf Bakanlığı'nda araştırmacı olarak çalışmaları, Youm7'deki çalışmaları ve oradaki İslam Araştırmaları Merkezi başkanlığı, 2013'teki televizyon tartışmaları ve Nisan 2015'teki iki tartışması. Sabah Al-Khair dergisiyle verdiği röportajdan, 2003 yılında dini miras kitaplarının kirliliklerinden korumak için yazmaya başladığını alıntılıyor."
  id: "Sejarah profesional Islam Behiri di situs web Iddaat: studinya di bidang hukum dan pekerjaannya sebagai peneliti di Kementerian Awqaf Kuwait, karyanya di Youm7 dan kepresidenannya di Pusat Studi Islam di sana, debat televisinya pada 2013 dan dua debat pada April 2015. Ia mengutip dari wawancaranya dengan majalah Sabah Al-Khair yang mulai ia tulis pada 2003 membela agama dari kotoran buku warisan."
