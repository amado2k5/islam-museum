summary:
  ar: "مقالة ويكيبيديا العربية عن نصير مزراوي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في هولندا لأبوين مغربيين من تطوان ومسيرته مع أياكس وبايرن ميونخ ومانشستر يونايتد والمنتخب المغربي، ويعطي صندوق معلوماتها ديانته بأنها الإسلام بصيغة عامة."
  en: "Arabic Wikipedia article on Noussair Mazraoui; used for entity facts only. It records his birth in the Netherlands to Moroccan parents from Tétouan and his career with Ajax, Bayern Munich, Manchester United and Morocco; its infobox gives his religion as Islam in generic terms."
  es: "Artículo de Wikipedia en árabe sobre Noussair Mazraoui; se utiliza únicamente para obtener información sobre la persona. Registra su nacimiento en los Países Bajos, de padres marroquíes originarios de Tetuán, y su trayectoria profesional en el Ajax, el Bayern de Múnich, el Manchester United y la selección de Marruecos. Su ficha informativa indica que su religión es el islam en términos genéricos."
  fr: "Article Wikipédia en arabe sur Noussair Mazraoui; utilisé uniquement pour les informations le concernant. Il relate sa naissance aux Pays-Bas de parents marocains originaires de Tétouan et sa carrière à l’Ajax Amsterdam, au Bayern Munich, à Manchester United et en équipe nationale du Maroc; son infobox indique sa religion comme étant l’islam de manière générale."
  ur: "عربی ویکیپیڈیا مضمون نوسیر مزراوی پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں نیدرلینڈز میں اس کی پیدائش ٹیٹوآن سے مراکشی والدین کے ہاں اور ایجیکس، بایرن میونخ، مانچسٹر یونائیٹڈ اور مراکش کے ساتھ اس کے کیریئر کو ریکارڈ کیا گیا ہے۔ اس کا انفو باکس عام اصطلاحات میں اس کے مذہب کو اسلام دیتا ہے۔"
