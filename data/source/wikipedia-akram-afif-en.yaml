summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أكرم عفيف؛ تُستخدم لوقائع الكيان فقط. تروي فوزه بجائزة أفضل لاعب في آسيا مرتين ⁦(2019 و2023)⁩ ودوره في فوز قطر بكأسي آسيا 2019 و2023، ومسيرته بين أويبن وفياريال والسد. ولا تذكر ديانته."
  en: "English Wikipedia article on Akram Afif; used for entity facts only. It recounts his two Asian Footballer of the Year awards (2019 and 2023), his role in Qatar's 2019 and 2023 AFC Asian Cup titles, and his career path through Eupen, Villarreal and Al Sadd. It makes no statement about his religion."
  es: "Artículo de la Wikipedia en inglés sobre Akram Afif; utilizado únicamente para obtener información sobre la persona. Relata sus dos premios al Futbolista Asiático del Año (2019 y 2023), su papel en los títulos de la Copa Asiática de la AFC de Qatar en 2019 y 2023, y su trayectoria profesional en el Eupen, el Villarreal y el Al Sadd. No menciona su religión."
  fr: "Article Wikipédia en anglais sur Akram Afif; utilisé uniquement à des fins d'information sur l'entité. Il relate ses deux titres de meilleur joueur asiatique de l'année (2019 et 2023), son rôle dans les victoires du Qatar à la Coupe d'Asie des nations de l'AFC en 2019 et 2023, ainsi que son parcours professionnel à Eupen, Villarreal et Al Sadd. Il ne mentionne pas sa religion."
  ur: "اکرم عفیف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے دو ایشین فٹ بالر آف دی ایئر ایوارڈز ⁦(2019 اور 2023)⁩، قطر کے 2019 اور 2023 کے AFC ایشین کپ ٹائٹلز میں ان کے کردار، اور یوپین، ولاریال اور السد کے ذریعے ان کے کیریئر کے راستے کا ذکر ہے۔ اس کے مذہب کے بارے میں کوئی بیان نہیں ہے۔"
  tr: "Akram Afif hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Makale, iki kez Asya'nın En İyi Oyuncusu ödülünü kazanmasını (2019 ve 2023), Katar'ın 2019 ve 2023 Asya Kupası zaferlerindeki rolünü ve Oypen, Villarreal ile Al Sadd'daki kariyerini anlatır. Dini hakkında bilgi verilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Akram Afif; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kemenangan Akram Pemain Asia Terbaik dua kali (2019 dan 2023), perannya dalam kemenangan Piala Asia Qatar 2019 dan 2023, serta kariernya di antara Oypen, Villarreal, dan Al Sadd. Agamanya tidak disebutkan."
