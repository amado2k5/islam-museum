reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id with the returned revision asserted equal. It gives his full name as Akram Hassan Afif Yahya Afif, born 18 November 1996; his personal-life section states he was born in Doha, of Yemeni descent, son of the former footballer Hassan Afif and brother of the footballer Ali Afif; his club path (Eupen 2015, Villarreal 2016 — the first Qatari-born signing in La Liga history — Sporting de Gijón and Eupen loans, Al Sadd from 2018, permanent in 2020); a tournament-record 10 assists at the 2019 Asian Cup; and 8 goals, top scorer, at the 2023 Asian Cup including a hat-trick of penalties in the final. It makes no statement of his religion in its text, and none of its categories is a religion category."
