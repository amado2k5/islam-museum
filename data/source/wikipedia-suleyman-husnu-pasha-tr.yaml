summary:
  ar: "مقالة ويكيبيديا التركية عن سليمان حسني باشا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده سنة 1838 في حي ملا كوراني بإسطنبول، ووفاته في 8 أغسطس 1892 ببغداد ودفنه في باحة جامع الإمام أبي يوسف، وتعدّد مؤلفاته ومنها «تاريخ عالم» و«إلمحال كبير»."
  en: "Turkish Wikipedia article on Süleyman Hüsnü Paşa; used for entity facts only. It gives his birth in 1838 in the Molla Gürani quarter of Istanbul, his death on 8 August 1892 at Baghdad and burial in the garden of the Imam Abu Yusuf Mosque, and lists his works, among them Tarih-i Âlem and İlmihal-i Kebir."
  es: "Artículo de la Wikipedia en turco sobre Süleyman Hüsnü Paşa; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1838 en el barrio de Molla Gürani de Estambul, su fallecimiento el 8 de agosto de 1892 en Bagdad y su entierro en el jardín de la mezquita Imam Abu Yusuf, y enumera sus obras, entre ellas Tarih-i Âlem e İlmihal-i Kebir."
  fr: "Article de Wikipédia en turc sur Süleyman Hüsnü Paşa; utilisé uniquement pour les informations biographiques. Il indique sa naissance en 1838 dans le quartier Molla Gürani d’Istanbul, sa mort le 8 août 1892 à Bagdad et son inhumation dans le jardin de la mosquée Imam Abu Yusuf, et énumère ses œuvres, parmi lesquelles Tarih-i Âlem et İlmihal-i Kebir."
  ur: "ترکی ویکیپیڈیا مضمون سلیمان حسن پاشا پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 1838 میں استنبول کے مولا گورانی کوارٹر میں ہوئی، ان کی وفات 8 اگست 1892 کو بغداد میں ہوئی اور امام ابو یوسف مسجد کے باغ میں دفن کیا گیا، اور ان کے کاموں کی فہرست دی گئی ہے، ان میں تاریخ الیوم اور علم الکبیر شامل ہیں۔"
  tr: "Süleyman Hüsnü Paşa hakkında Türkçe Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1838 yılında İstanbul'un Mele Kurani ilçesinde doğmuş, 8 Ağustos 1892'de Bağdat'ta ölmüş ve İmam Ebu Yusuf Camii'nin avlusuna defnedilmiştir. 'Tarih Alam' ve 'Ilmahal Kabir' gibi birçok eseri vardır."
  id: "Artikel Wikipedia Turki tentang Suleiman Hosni Pasha; digunakan hanya untuk fakta entitas. Ia lahir pada tahun 1838 di distrik Mulla Kurani, Istanbul, meninggal pada 8 Agustus 1892 di Baghdad, dan dimakamkan di halaman Masjid Imam Abu Yusuf. Ia memiliki banyak karya termasuk 'Tarikh Alam' dan 'Ilmahal Kabir'."
