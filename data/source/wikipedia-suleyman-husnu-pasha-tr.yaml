  ar: "مقالة ويكيبيديا التركية عن سليمان حسني باشا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده سنة 1838 في حي ملا كوراني بإسطنبول، ووفاته في 8 أغسطس 1892 ببغداد ودفنه في باحة جامع الإمام أبي يوسف، وتعدّد مؤلفاته ومنها «تاريخ عالم» و«إلمحال كبير»."
  en: "Turkish Wikipedia article on Süleyman Hüsnü Paşa; used for entity facts only. It gives his birth in 1838 in the Molla Gürani quarter of Istanbul, his death on 8 August 1892 at Baghdad and burial in the garden of the Imam Abu Yusuf Mosque, and lists his works, among them Tarih-i Âlem and İlmihal-i Kebir."
