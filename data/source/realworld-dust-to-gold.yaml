  ar: "صفحة شركة ريل وورلد ريكوردز عن ألبوم نصرت فتح علي خان «Dust to Gold»: تاريخ الإصدار 17 يونيو 2000، وترجمة عناوين القصائد الأربع، وملاحظات الألبوم: معنى العنوان، وأن التسجيلات اكتُشفت في أرشيف بلاهور مدينة نصرت، وأنها جلسة قوالي تقليدية بالفرقة كاملة، وموضوع كل قصيدة."
  en: "Real World Records' page for Nusrat Fateh Ali Khan's Dust to Gold: the release date of 17 June 2000, translated titles of its four qawwalis, and the liner notes: the meaning of the title, the recordings' discovery in archives in Nusrat's hometown of Lahore, their being a traditional qawwali session with the full party, and the subject of each qawwali."
