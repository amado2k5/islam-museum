summary:
  ar: "صفحة شركة ريل وورلد ريكوردز عن ألبوم نصرت فتح علي خان «Dust to Gold»: تاريخ الإصدار 17 يونيو 2000، وترجمة عناوين القصائد الأربع، وملاحظات الألبوم: معنى العنوان، وأن التسجيلات اكتُشفت في أرشيف بلاهور مدينة نصرت، وأنها جلسة قوالي تقليدية بالفرقة كاملة، وموضوع كل قصيدة."
  en: "Real World Records' page for Nusrat Fateh Ali Khan's Dust to Gold: the release date of 17 June 2000, translated titles of its four qawwalis, and the liner notes: the meaning of the title, the recordings' discovery in archives in Nusrat's hometown of Lahore, their being a traditional qawwali session with the full party, and the subject of each qawwali."
  es: "La página de Real World Records sobre Dust to Gold de Nusrat Fateh Ali Khan incluye: la fecha de lanzamiento del 17 de junio de 2000, los títulos traducidos de sus cuatro qawwalis y las notas del disco: el significado del título, el descubrimiento de las grabaciones en archivos de Lahore, la ciudad natal de Nusrat, el hecho de que se tratara de una sesión tradicional de qawwali con todos los músicos y el tema de cada qawwali."
  fr: "La page de Real World Records consacrée à l'album Dust to Gold de Nusrat Fateh Ali Khan: la date de sortie du 17 juin 2000, les titres traduits de ses quatre qawwalis et les notes de pochette: la signification du titre, la découverte des enregistrements dans les archives de Lahore, ville natale de Nusrat, le fait qu'il s'agisse d'une session traditionnelle de qawwali avec l'ensemble du groupe et le sujet de chaque qawwali."
  ur: "نصرت فتح علی خان کے ڈسٹ ٹو گولڈ کے لیے حقیقی ورلڈ ریکارڈز کا صفحہ: 17 جون 2000 کی ریلیز کی تاریخ، اس کی چار قوالیوں کے ترجمہ شدہ عنوانات، اور لائنر نوٹ: عنوان کے معنی، نصرت کے آبائی شہر لاہور میں آرکائیوز میں ریکارڈنگ کی دریافت، ان کا روایتی قوالی ہونا، ہر پارٹی کے مکمل موضوع کے ساتھ قوالی اور سیشن۔"
