reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision ('Ibn Mada' redirects to it). It records his birth year as disputed between 1116 and 1119; his studies at Seville and with Qadi Ayyad at Ceuta; his judgeships at Fes and Béjaïa and appointment as chief judge of the Almohad caliphate under Abu Yaqub Yusuf and al-Mansur; his part in the Almohad suppression and burning of non-Zahiri religious books; and his death at Seville in Jumada al-awwal 592 AH (1196). It attests his adherence to Zahirism repeatedly, citing Kees Versteegh's description of it as fanatical, and presents his abolition of grammatical governance as the linguistic carry-over of the Zahiri denial of legal causality. It nowhere frames him within Ahl al-Sunna in terms, which is why the record's faith segment stays unclassified and flagged."
