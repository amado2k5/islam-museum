summary:
  ar: "مقالة ويكيبيديا الفارسية عن علي خامنئي؛ تُستخدم لوقائع الكيان فقط. تروي قيادته لإيران من 1989 وتنتهي ولايته في صندوقها في 9 اسفند 1404 الموافق 28 شباط 2026 ويخلفه فيها مجتبى خامنئي، وتذكر أن تاريخ ميلاده في شهادة الميلاد 24 تير 1318 الموافق 16 تموز 1939 بينما يرى هو أن الصحيح 29 فروردين من السنة نفسها، وتروي دروسه الدينية في مشهد وقم."
  en: "Persian Wikipedia article on Ali Khamenei; used for entity facts only. Its infobox ends his supreme leadership on 9 Esfand 1404, corresponding to 28 February 2026, with Mojtaba Khamenei as his successor, and it records that his birth certificate gives 24 Tir 1318, corresponding to 16 July 1939, while he himself held the correct date to be 29 Farvardin of the same year; it recounts his religious studies at Mashhad and Qom."
  es: "Artículo de Wikipedia en persa sobre Ali Khamenei; utilizado únicamente para datos sobre la entidad. Su ficha informativa finaliza su liderazgo supremo el 9 de Esfand de 1404, que corresponde al 28 de febrero de 2026, con Mojtaba Khamenei como su sucesor, y registra que su certificado de nacimiento indica el 24 de Tir de 1318, que corresponde al 16 de julio de 1939, mientras que él mismo sostenía que la fecha correcta era el 29 de Farvardin del mismo año; relata sus estudios religiosos en Mashhad y Qom."
  fr: "L'article Wikipédia persan consacré à Ali Khamenei est utilisé uniquement pour des informations sur l'entité. Son infobox indique que son leadership suprême prend fin le 9 Esfand 1404 (correspondant au 28 février 2026) et que Mojtaba Khamenei lui succède. L'article mentionne également que son acte de naissance mentionne le 24 Tir 1318 (correspondant au 16 juillet 1939), alors qu'il considérait lui-même que la date correcte était le 29 Farvardin de la même année. Enfin, l'article relate ses études religieuses à Mashhad et Qom."
  ur: "علی خامنہ ای پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی خانہ 9 اسفند 1404 کو ان کی اعلیٰ قیادت کا خاتمہ کرتا ہے، جو کہ 28 فروری 2026 کو مجتبیٰ خامنہ ای کے جانشین کے طور پر ہوتا ہے، اور اس میں درج ہے کہ ان کی پیدائش کا سرٹیفکیٹ 24 طیر 1318 دیتا ہے، جو کہ 16 جولائی 1939 کے مطابق ہے، جبکہ وہ خود بھی اسی سال فروردین کی صحیح تاریخ پر فائز تھے۔ اس میں مشہد اور قم میں ان کی دینی تعلیم کا ذکر ہے۔"
  tr: "Ali Hamaney hakkında Farsça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılır. 1989'dan itibaren İran'daki liderliğini anlatır; görev süresi 9 İsfand 1404 Hicri sandığında sona erer, yani 28 Şubat 2026'ya denk gelir ve yerine Mojtaba Hamaney'in geçeceği belirtilir. Doğum tarihinin 24 Tir 1318 olduğunu, yani 16 Temmuz 1939'a karşılık geldiğini belirtirken, doğru tarihin aynı yılın 18 Nisan'ı olduğuna inanıyor ve Meşhed ile Kum'daki dini derslerini anlatıyor."
  id: "Artikel Wikipedia Persia tentang Ali Khamenei hanya digunakan untuk fakta-fakta entitas tersebut. Artikel tersebut menceritakan kepemimpinannya di Iran sejak 1989, dengan masa jabatannya berakhir di kotak suara pada 9 Esfand 1404 H, yang bertepatan dengan 28 Februari 2026, dan ia akan digantikan oleh Mojtaba Khamenei. Artikel tersebut menyatakan bahwa tanggal lahirnya adalah 24 Tir 1318, sesuai dengan 16 Juli 1939, sementara ia percaya tanggal yang benar adalah 18 April tahun yang sama, dan menceritakan pelajaran agamanya di Mashhad dan Qom."
