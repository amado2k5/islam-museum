summary:
  ar: "مقالة ويكيبيديا الفارسية عن علي خامنئي؛ تُستخدم لوقائع الكيان فقط. تروي قيادته لإيران من 1989 وتنتهي ولايته في صندوقها في 9 اسفند 1404 الموافق 28 شباط 2026 ويخلفه فيها مجتبى خامنئي، وتذكر أن تاريخ ميلاده في شهادة الميلاد 24 تير 1318 الموافق 16 تموز 1939 بينما يرى هو أن الصحيح 29 فروردين من السنة نفسها، وتروي دروسه الدينية في مشهد وقم."
  en: "Persian Wikipedia article on Ali Khamenei; used for entity facts only. Its infobox ends his supreme leadership on 9 Esfand 1404, corresponding to 28 February 2026, with Mojtaba Khamenei as his successor, and it records that his birth certificate gives 24 Tir 1318, corresponding to 16 July 1939, while he himself held the correct date to be 29 Farvardin of the same year; it recounts his religious studies at Mashhad and Qom."
