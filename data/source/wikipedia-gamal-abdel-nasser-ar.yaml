summary:
  ar: "مقالة ويكيبيديا العربية عن جمال عبد الناصر حسين؛ تُستخدم لوقائع الكيان فقط. تؤكد ولادته في 15 يناير 1918 ووفاته في 28 سبتمبر 1970، وقيادته للضباط الأحرار ورئاسته لمصر؛ وصندوق معلوماتها يذكر دينه «مسلم سني» دون أي مصدر ثانٍ."
  en: "Arabic Wikipedia article on Gamal Abdel Nasser Hussein; used for entity facts only. It confirms his birth on 15 January 1918 and death on 28 September 1970 and his leadership of the Free Officers and presidency of Egypt; its infobox gives his religion as Sunni Muslim, a value no second source corroborates."
  es: "Artículo en árabe de la Wikipedia sobre Gamal Abdel Nasser Hussein; utilizado únicamente para datos sobre la persona. Confirma su nacimiento el 15 de enero de 1918 y su fallecimiento el 28 de septiembre de 1970, así como su liderazgo de los Oficiales Libres y su presidencia de Egipto. Su ficha informativa indica que su religión era musulmana sunita, dato que ninguna otra fuente corrobora."
  fr: "Article de Wikipédia en arabe sur Gamal Abdel Nasser Hussein; utilisé uniquement pour les informations le concernant. Il confirme sa naissance le 15 janvier 1918 et son décès le 28 septembre 1970, ainsi que son rôle à la tête des Officiers libres et sa présidence de l’Égypte; son infobox indique qu’il était musulman sunnite, une information qu’aucune autre source ne corrobore."
  ur: "جمال عبدالناصر حسین پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 15 جنوری 1918 کو اس کی پیدائش اور 28 ستمبر 1970 کو موت کی تصدیق کرتا ہے اور اس کی آزاد افسروں کی قیادت اور مصر کی صدارت؛ اس کا انفو باکس اس کا مذہب بطور سنی مسلمان دیتا ہے، جس کی کوئی دوسرا ذریعہ تصدیق نہیں کرتا۔"
