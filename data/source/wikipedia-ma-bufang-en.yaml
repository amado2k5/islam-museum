reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives him as born in 1903 at Monigou in Linxia County, Gansu, son of Ma Qi, and as dying on 31 July 1975 at Jeddah. It records that he received an education in Islam and that his father first had him study to become an imam — an education, not a school affiliation — and that he supported the Yihewani imam Hu Songshan, a patronage it does not present as membership; it names no school and no Sufi order for him, and its categories (Chinese Muslims, Qing dynasty Muslims) are filings. One passage quoting Sven Hedin's The Silk Road (1938) calls him an adopted son of Ma Fuxiang; that is contradicted by the article's own account of his father Ma Qi and is not used."
