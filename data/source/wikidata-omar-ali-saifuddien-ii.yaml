  id: "Entri Wikidata Q40107 oleh Omar Ali Saif al-Din II; lahir pada 3 Februari 1799 menurut referensi, dan meninggal pada 20 November 1852. Ayahnya adalah Muhammad Jamal Alam I, dan agamanya adalah Islam (Q432) secara umum, tanpa sekte apapun."
