summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن السير عبد الرحيم القاضي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 7 سبتمبر 1867 ووفاته في 19 أكتوبر 1952، وقضاءه في محكمة مدراس العليا ورئاستها، وعضويته في الرابطة الإسلامية ورئاسته جلستها سنة 1925، ورئاسته الجمعية التشريعية المركزية 1935–1945، وكتابه «مبادئ الفقه المحمدي»."
  en: "English Wikipedia article on Sir Abdur Rahim the judge; used for entity facts only. It gives his birth on 7 September 1867 and death on 19 October 1952, his judgeship and chief justiceship of the Madras High Court, his leading place in the Muslim League including the 1925 Aligarh presidential address, his presidency of the Central Legislative Assembly 1935–1945, and his book The Principles of Muhammadan Jurisprudence."
  es: "Artículo de la Wikipedia en inglés sobre Sir Abdur Rahim, el juez; utilizado únicamente para datos sobre la persona. Menciona su nacimiento el 7 de septiembre de 1867 y su fallecimiento el 19 de octubre de 1952, su cargo como juez y presidente del Tribunal Superior de Madrás, su posición destacada en la Liga Musulmana, incluyendo el discurso presidencial de Aligarh de 1925, su presidencia de la Asamblea Legislativa Central entre 1935 y 1945, y su libro Los principios de la jurisprudencia musulmana."
  fr: "Article de Wikipédia en anglais consacré à Sir Abdur Rahim, le juge; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 7 septembre 1867 et son décès le 19 octobre 1952, sa fonction de juge et de président de la Haute Cour de Madras, son rôle prépondérant au sein de la Ligue musulmane, notamment son discours présidentiel à Aligarh en 1925, sa présidence de l’Assemblée législative centrale de 1935 à 1945, et son ouvrage intitulé « Les Principes de la jurisprudence musulmane »."
  ur: "سر عبدالرحیم جج پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 7 ستمبر 1867 کو ان کی پیدائش اور 19 اکتوبر 1952 کو موت، مدراس ہائی کورٹ کی جج شپ اور چیف جسٹس شپ، 1925 کے علی گڑھ صدارتی خطاب سمیت مسلم لیگ میں ان کا اہم مقام، سنٹرل لیجسلیٹو اسمبلی 1935-1945 کی صدارت، اور ان کی کتاب The Principles of Muhammadan Judul"
  tr: "Sir Abdul Rahim Al-Qadi hakkında İngilizce Vikipedi makalesi; yalnızca kurumun olguları için kullanılmıştır. 7 Eylül 1867'de doğdu, 19 Ekim 1952'de vefat etti, Madras Yüksek Mahkemesi'nde yargıç ve başkan olarak görev yaptı, İslam Birliği üyesiydi ve 1925'te oturumuna başkanlık etti, 1935-1945 yılları arasında Merkez Yasama Meclisi'ne başkanlık etti ve 'Müslüman Fıkıhı İlkeleri'ni yazdı."
  id: "Artikel Wikipedia bahasa Inggris tentang Sir Abdul Rahim Al-Qadi; digunakan hanya untuk fakta entitas. Ia lahir pada 7 September 1867, meninggal pada 19 Oktober 1952, menjabat sebagai hakim dan hakim ketua Pengadilan Tinggi Madras, anggota Liga Islam dan memimpin sidangnya pada tahun 1925, memimpin Majelis Legislatif Pusat dari 1935 hingga 1945, dan menulis 'Prinsip-prinsip Yurisprudensi Muhammadan.'"
