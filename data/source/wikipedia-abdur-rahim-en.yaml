summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن السير عبد الرحيم القاضي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 7 سبتمبر 1867 ووفاته في 19 أكتوبر 1952، وقضاءه في محكمة مدراس العليا ورئاستها، وعضويته في الرابطة الإسلامية ورئاسته جلستها سنة 1925، ورئاسته الجمعية التشريعية المركزية 1935–1945، وكتابه «مبادئ الفقه المحمدي»."
  en: "English Wikipedia article on Sir Abdur Rahim the judge; used for entity facts only. It gives his birth on 7 September 1867 and death on 19 October 1952, his judgeship and chief justiceship of the Madras High Court, his leading place in the Muslim League including the 1925 Aligarh presidential address, his presidency of the Central Legislative Assembly 1935–1945, and his book The Principles of Muhammadan Jurisprudence."
