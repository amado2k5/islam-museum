reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 through the browser search/open route, which exposes no revision id; this file therefore records the consultation date in place of a revision, and no revision id was invented. On faith: the infobox has no religion field. The text gives his family background ('a Bengali Muslim family of Nashya Shaikh origin') and, in a one-sentence 'Religious views' section citing Sufia M. Uddin's 2006 scholarly study (pp. 138–139), that he was a devotee of the Sufi Pir Atroshi who spent considerable time with him during his presidency — a single text attestation of personal Sufi devotion. The 1988 constitutional amendment making Islam the state religion is his state policy as head of government, not personal attestation."
