summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسين محمد إرشاد؛ تُستخدم لوقائع الكيان فقط. تروي مولده في دينهاتة في 1 فبراير 1930 في أسرة بنغالية مسلمة، ومسيرته العسكرية حتى رئاسة أركان الجيش، وانقلاب 1982 ورئاسته (1983–1990) وتعديل 1988 الذي جعل الإسلام دين الدولة، وسقوطه في انتفاضة 1990، ورئاسته حزب جاتيا وعضويته في البرلمان عن رانجبور-3، ووفاته في دكا في 14 يوليو 2019. لا يحمل صندوق معلوماتها حقلًا للديانة، ويذكر متنها في قسم «الآراء الدينية» أنه كان مريدًا للبير الصوفي أتروشي."
  en: "English Wikipedia article on Hussain Muhammad Ershad; used for entity facts only. It recounts his birth at Dinhata on 1 February 1930 into a Bengali Muslim family, his army career to chief of army staff, the 1982 coup and his presidency (1983–1990), the 1988 amendment making Islam the state religion, his fall in the 1990 uprising, his Jatiya Party chairmanship and his Rangpur-3 parliamentary seat, and his death at Dhaka on 14 July 2019. Its infobox carries no religion field; its 'Religious views' section states that he was a devotee of the Sufi Pir Atroshi, citing a scholarly study of religion in Bangladesh."
