summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسين محمد إرشاد؛ تُستخدم لوقائع الكيان فقط. تروي مولده في دينهاتة في 1 فبراير 1930 في أسرة بنغالية مسلمة، ومسيرته العسكرية حتى رئاسة أركان الجيش، وانقلاب 1982 ورئاسته (1983–1990) وتعديل 1988 الذي جعل الإسلام دين الدولة، وسقوطه في انتفاضة 1990، ورئاسته حزب جاتيا وعضويته في البرلمان عن رانجبور-3، ووفاته في دكا في 14 يوليو 2019. لا يحمل صندوق معلوماتها حقلًا للديانة، ويذكر متنها في قسم «الآراء الدينية» أنه كان مريدًا للبير الصوفي أتروشي."
  en: "English Wikipedia article on Hussain Muhammad Ershad; used for entity facts only. It recounts his birth at Dinhata on 1 February 1930 into a Bengali Muslim family, his army career to chief of army staff, the 1982 coup and his presidency (1983–1990), the 1988 amendment making Islam the state religion, his fall in the 1990 uprising, his Jatiya Party chairmanship and his Rangpur-3 parliamentary seat, and his death at Dhaka on 14 July 2019. Its infobox carries no religion field; its 'Religious views' section states that he was a devotee of the Sufi Pir Atroshi, citing a scholarly study of religion in Bangladesh."
  es: "Artículo de la Wikipedia en inglés sobre Hussain Muhammad Ershad; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Dinhata el 1 de febrero de 1930 en el seno de una familia musulmana bengalí, su carrera militar hasta convertirse en jefe del Estado Mayor, el golpe de Estado de 1982 y su presidencia (1983-1990), la enmienda de 1988 que convirtió al islam en la religión oficial del Estado, su caída en el levantamiento de 1990, su presidencia del Partido Jatiya y su escaño parlamentario por Rangpur-3, y su fallecimiento en Dhaka el 14 de julio de 2019. Su ficha informativa no incluye información sobre religión; su sección «Opiniones religiosas» indica que era devoto del sufí Pir Atroshi, citando un estudio académico sobre la religión en Bangladesh."
  fr: "L'article de Wikipédia en anglais consacré à Hussain Muhammad Ershad, utilisé uniquement pour les informations le concernant, relate sa naissance à Dinhata le 1er février 1930 au sein d'une famille musulmane bengalie, sa carrière militaire jusqu'au poste de chef d'état-major, le coup d'État de 1982 et sa présidence (1983-1990), l'amendement de 1988 faisant de l'islam la religion d'État, sa chute lors du soulèvement de 1990, sa présidence du Jatiya Party et son mandat de député de la circonscription de Rangpur-3, ainsi que son décès à Dacca le 14 juillet 2019. L'infobox ne comporte pas de champ « religion »; la section « Convictions religieuses » indique qu'il était un disciple du soufi Pir Atroshi, citant une étude universitaire sur la religion au Bangladesh."
