reliability_note: "English Wikipedia, revision 1367331179 (wikitext consulted in full). It gives the birth year 1886 only, with Muscat as birthplace in its infobox, and a death on 28 January 1965 at Bombay in both infobox and text; the Arabic infobox names Mumbai as the death place but its own death-date template computes 1 January 1965, a minority reading the record states. Its reign dates (5 October 1913 – 10 February 1932) conflict with the Arabic lead's accession date of 15 October 1913, also stated in the record. It attributes the abdication to financial pressures where the Arabic article gives health reasons. Its infobox religion field reads 'Ibadi Islam' uncited, and its section headed 'Ibadism' treats the interior imamate's role in his era, not Taimur's personal religion. Consulted on 26 October 2026."
