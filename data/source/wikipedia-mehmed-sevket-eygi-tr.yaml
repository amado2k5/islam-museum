summary:
  ar: "مقالة ويكيبيديا التركية «محمد شوكت أيغي»: وُلد في إرغلي بولاية زونغولداق في 7 فبراير 1933، وتخرج في ثانوية غلطة سراي وكلية العلوم السياسية بجامعة أنقرة، وعمل مترجمًا في رئاسة الشؤون الدينية وسكرتيرًا خاصًا لعمر نصوحي بيلمن، وأصدر مجلة «إسلام» (1957) وصحيفة «بوغون» (1966)، وعاش ست سنوات خارج تركيا، وكتب في «مللي غازته» من 1991 حتى وفاته في إسطنبول في 12 يوليو 2019؛ لم يتزوج قط."
  en: "Turkish Wikipedia article 'Mehmet Şevket Eygi': born in Ereğli, Zonguldak on 7 February 1933; Galatasaray High School and Ankara University's Faculty of Political Science; translator at the Directorate of Religious Affairs and private secretary to Ömer Nasuhi Bilmen; founded the İslam magazine (1957) and the Bugün daily (1966); six years abroad; Millî Gazete columnist from 1991 until his death in Istanbul on 12 July 2019; never married."
  es: "Artículo de la Wikipedia en turco 'Mehmet Şevket Eygi': nació en Ereğli, Zonguldak, el 7 de febrero de 1933; estudió en el Liceo Galatasaray y en la Facultad de Ciencias Políticas de la Universidad de Ankara; fue traductor en la Dirección de Asuntos Religiosos y secretario privado de Ömer Nasuhi Bilmen; fundó la revista İslam (1957) y el diario Bugün (1966); pasó seis años en el extranjero; fue columnista de Millî Gazete desde 1991 hasta su muerte en Estambul el 12 de julio de 2019; nunca se casó."
  fr: "Article de Wikipédia turc « Mehmet Şevket Eygi »: né à Ereğli, Zonguldak, le 7 février 1933; lycée Galatasaray et faculté de sciences politiques de l'université d'Ankara; traducteur à la Direction des affaires religieuses et secrétaire particulier d'Ömer Nasuhi Bilmen; fondateur du magazine İslam (1957) et du quotidien Bugün (1966); six ans à l'étranger; chroniqueur pour Millî Gazete de 1991 jusqu'à sa mort à Istanbul le 12 juillet 2019; jamais marié."
  ur: "ترک ویکیپیڈیا مضمون 'Mehmet Şevket Eygi': Ereğli، Zonguldak میں 7 فروری 1933 کو پیدا ہوا؛ Galatasaray ہائی اسکول اور انقرہ یونیورسٹی کی سیاسیات کی فیکلٹی؛ ڈائریکٹوریٹ آف مذہبی امور میں مترجم اور عمر ناسوہی بلمین کے پرائیویٹ سیکرٹری؛ اسلام میگزین (1957) اور روزنامہ بگون (1966) کی بنیاد رکھی؛ چھ سال بیرون ملک؛ ملی گزٹ کے کالم نگار 1991 سے 12 جولائی 2019 کو استنبول میں اپنی موت تک؛ کبھی شادی نہیں کی"
  tr: "Türk Vikipedi makalesi \"Mehmet Şüket Ayğı\": 7 Şubat 1933'te Zonguldak ili Erğli'de doğdu, Ankara Üniversitesi Galatasaray Lisesi ve Siyaset Bilimi Fakültesi'nden mezun oldu. Din İşleri Müdürlüğü'nde tercüman ve Ömer Nusuhi Belmen'in özel sekreterliğini yaptı. \"İslam\" dergisini (1957) ve \"Bogun\" gazetesini (1966) yayımladı. Türkiye dışında altı yıl yaşadı, 1991'den 12 Temmuz 2019'da İstanbul'da vefat edene kadar \"Melli Gazetesi\" için yazdı; hiç evlenmedi."
  id: "Artikel Wikipedia Turki \"Mehmet Şüket Ayğı\": Lahir di Erğli, provinsi Zonguldak, pada 7 Februari 1933, lulus dari Sekolah Menengah Galatasaray dan Fakultas Ilmu Politik Universitas Ankara. Ia bekerja sebagai penerjemah di Direktorat Urusan Agama dan sebagai sekretaris pribadi Ömer Nusuhi Belmen. Ia menerbitkan majalah \"Islam\" (1957) dan surat kabar \"Bogun\" (1966). Ia tinggal di luar Turki selama enam tahun, menulis untuk \"Melli Gazette\" dari 1991 hingga wafat di Istanbul pada 12 Juli 2019; ia tidak pernah menikah."
