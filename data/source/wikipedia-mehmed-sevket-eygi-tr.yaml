summary:
  ar: "مقالة ويكيبيديا التركية «محمد شوكت أيغي»: وُلد في إرغلي بولاية زونغولداق في 7 فبراير 1933، وتخرج في ثانوية غلطة سراي وكلية العلوم السياسية بجامعة أنقرة، وعمل مترجمًا في رئاسة الشؤون الدينية وسكرتيرًا خاصًا لعمر نصوحي بيلمن، وأصدر مجلة «إسلام» (1957) وصحيفة «بوغون» (1966)، وعاش ست سنوات خارج تركيا، وكتب في «مللي غازته» من 1991 حتى وفاته في إسطنبول في 12 يوليو 2019؛ لم يتزوج قط."
  en: "Turkish Wikipedia article 'Mehmet Şevket Eygi': born in Ereğli, Zonguldak on 7 February 1933; Galatasaray High School and Ankara University's Faculty of Political Science; translator at the Directorate of Religious Affairs and private secretary to Ömer Nasuhi Bilmen; founded the İslam magazine (1957) and the Bugün daily (1966); six years abroad; Millî Gazete columnist from 1991 until his death in Istanbul on 12 July 2019; never married."
