reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives him as sultan of Tafilalt (1635–1664), the eldest son of al-Sharif ibn Ali, and describes him in its lead as a Sufi (mutasawwif) — the only text read that characterises his personal religion, and no second independent text attests it, so it does not settle his faith under the founder’s two-text rule. It gives his bay’a in 1050 AH during his father’s lifetime, his wars with Abu Hasun al-Simlali and the Dila zawiya, and his killing in a battle near Oujda against his brother al-Rashid, who succeeded him. It gives no birth year. Checked 1 November 2026."
