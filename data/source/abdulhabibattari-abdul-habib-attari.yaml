reliability_note: "His own official website: a primary source for his self-presented biography and offices, not independent corroboration. Read in full on 5 November 2026. It states he was born on 14 October 1974 (27 Ramadan 1394) in Karachi, Pakistan; that he graduated (Dars-e-Nizami) from Jamia Amjadiya, Karachi; that the company and spiritual upbringing of Muhammad Ilyas Attar Qadri is the most important factor of his life; that he is a member of the Central Executive Committee of Dawat-e-Islami, head of Madani Channel and of Jamia-tul-Madinah, and in charge of its Human Resources, Foreign Affairs and Business Communities departments; that his Madani Channel programme 'Zehni Azmaish' has worldwide viewership; and that he recorded the Urdu translation of the Qur'an (Kanzul Iman). Its statement that he delivers speeches 'propagating the sayings of great Sufi Sheikh of Qadria Silsila, Abdul Qadir Jilani' describes the content he teaches, not an attested order membership of his own, and is not used as faith attestation."
