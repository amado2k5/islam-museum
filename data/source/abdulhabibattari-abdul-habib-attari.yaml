  ar: "صفحة التعريف في الموقع الرسمي لعبد الحبيب عطاري؛ تعطي ميلاده في كراتشي في 14 أكتوبر 1974 ⁦(27 رمضان 1394)⁩، وتخرجه في درس نظامي من الجامعة الأمجدية، وعضويته في المجلس التنفيذي المركزي لدعوة إسلامي ورئاسته قناة مدني وجامعة المدينة."
  en: "The introduction page of Abdul Habib Attari's official website: it gives his birth in Karachi on 14 October 1974 (27 Ramadan 1394), his Dars-e-Nizami graduation from Jamia Amjadiya, his membership of Dawat-e-Islami's Central Executive Committee and his headship of Madani Channel and Jamia-tul-Madinah."
