summary:
  ar: "مقالة ويكيبيديا العربية عن الحسين بن عبد الله الثاني؛ تُستخدم لوقائع الكيان فقط. توافق الإنجليزية في الولادة في عمّان في 28 يونيو 1994 وتقترنها بالتاريخ الهجري 19 محرم 1415 هـ، وتروي ولاية العهد منذ 2 يوليو 2009 وتعليمه ومهامّه وزواجه. لا تسمّي نصوصها ولا صندوق معلوماتها مذهبًا له."
  en: "Arabic Wikipedia article on Hussein bin Abdullah; used for entity facts only. It agrees with the English article on his birth in Amman on 28 June 1994, pairing the date with 19 Muharram 1415 AH, and recounts the crown-prince designation of 2 July 2009, his education, duties and marriage. Neither its text nor its infobox names a school for him."
  es: "Artículo de Wikipedia en árabe sobre Hussein bin Abdullah; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento en Amán el 28 de junio de 1994, fecha que coincide con el 19 de Muharram de 1415 AH, y relata su designación como príncipe heredero el 2 de julio de 2009, su educación, sus funciones y su matrimonio. Ni el texto ni el recuadro informativo mencionan ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en arabe sur Hussein bin Abdullah; utilisé uniquement pour les informations le concernant. Il confirme la date de naissance à Amman, le 28 juin 1994, en la faisant correspondre au 19 Muharram 1415 AH, et relate sa nomination comme prince héritier le 2 juillet 2009, ses études, ses fonctions et son mariage. Ni le texte ni l’infobox ne mentionnent d’établissement scolaire."
  ur: "حسین بن عبداللہ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 28 جون 1994 کو عمان میں ان کی پیدائش سے متعلق انگریزی مضمون سے اتفاق کرتا ہے، اس تاریخ کو 19 محرم 1415 ہجری سے جوڑتا ہے، اور 2 جولائی 2009 کے ولی عہد کے عہدہ، اس کی تعلیم، فرائض اور شادی کا ذکر کرتا ہے۔ نہ اس کا متن اور نہ ہی اس کے معلوماتی خانے میں اس کے لیے کسی اسکول کا نام ہے۔"
  tr: "Hüseyin bin Abdullah II hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 28 Haziran 1994'te Umman'da doğduğu İngilizce yazışma, Hicri tarihi 19 Muharrem 1415 Hicri ile bağlantılıdır ve 2 Temmuz 2009'dan itibaren Veliaht Prens'in eğitimini, görevlerini ve evliliğini anlatır. Metinlerini veya bilgi kutusunu doktrini olarak adlandırmaz."
  id: "Artikel Wikipedia berbahasa Arab tentang Hussein bin Abdullah II; digunakan hanya untuk fakta entitas. Korespondensi bahasa Inggris saat lahir di Oman pada 28 Juni 1994, dan terkait dengan tanggal Hijriyah 19 Muharram 1415 H, serta menceritakan Putra Mahkota sejak 2 Juli 2009, pendidikan, tugas, dan pernikahannya. Artikel tersebut tidak menyebut teks maupun kotak infonya sebagai doktrin Putra Mahkota."
