summary:
  ar: "مقالة ويكيبيديا العربية عن زايد بن خليفة بن شخبوط آل نهيان (1837–1909)، المعروف بزايد الأول أو زايد الكبير، حاكم إمارة أبوظبي السابع من 1855 حتى وفاته؛ تختصر سيرته: دحر عودة سعيد بن طحنون، والصراع مع القواسم ومقتل خالد بن سلطان سنة 1868، وإخراج السعوديين من البريمي سنة 1870، وحرب قطر سنة 1880، وتعدد زوجاته وأبنائه الذين تنقل الحكم بينهم بعد وفاته."
  en: "Arabic Wikipedia article on Zayed bin Khalifa bin Shakhbut Al Nahyan (1837–1909), known as Zayed I or Zayed the Great, seventh ruler of Abu Dhabi from 1855 until his death; it summarises his defeat of Saeed bin Tahnun's return, the conflict with the Qawasim and the killing of Khalid bin Sultan in 1868, the expulsion of the Saudis from Buraimi in 1870, the Qatar war of 1880, and lists his wives and the sons among whom the rule passed after his death."
