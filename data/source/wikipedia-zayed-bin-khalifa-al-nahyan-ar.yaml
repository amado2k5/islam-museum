summary:
  ar: "مقالة ويكيبيديا العربية عن زايد بن خليفة بن شخبوط آل نهيان (1837–1909)، المعروف بزايد الأول أو زايد الكبير، حاكم إمارة أبوظبي السابع من 1855 حتى وفاته؛ تختصر سيرته: دحر عودة سعيد بن طحنون، والصراع مع القواسم ومقتل خالد بن سلطان سنة 1868، وإخراج السعوديين من البريمي سنة 1870، وحرب قطر سنة 1880، وتعدد زوجاته وأبنائه الذين تنقل الحكم بينهم بعد وفاته."
  en: "Arabic Wikipedia article on Zayed bin Khalifa bin Shakhbut Al Nahyan (1837–1909), known as Zayed I or Zayed the Great, seventh ruler of Abu Dhabi from 1855 until his death; it summarises his defeat of Saeed bin Tahnun's return, the conflict with the Qawasim and the killing of Khalid bin Sultan in 1868, the expulsion of the Saudis from Buraimi in 1870, the Qatar war of 1880, and lists his wives and the sons among whom the rule passed after his death."
  es: "Artículo en árabe de la Wikipedia sobre Zayed bin Khalifa bin Shakhbut Al Nahyan (1837-1909), conocido como Zayed I o Zayed el Grande, séptimo gobernante de Abu Dhabi desde 1855 hasta su muerte; resume su derrota del regreso de Saeed bin Tahnun, el conflicto con los Qawasim y el asesinato de Khalid bin Sultan en 1868, la expulsión de los saudíes de Buraimi en 1870, la guerra de Qatar de 1880, y enumera a sus esposas y a los hijos entre quienes pasó el poder tras su muerte."
  fr: "L'article de Wikipédia en arabe sur Zayed bin Khalifa bin Shakhbut Al Nahyan (1837-1909), connu sous le nom de Zayed Ier ou Zayed le Grand, septième souverain d'Abu Dhabi de 1855 jusqu'à sa mort, résume sa défaite face au retour de Saeed bin Tahnun, le conflit avec les Qawasim et l'assassinat de Khalid bin Sultan en 1868, l'expulsion des Saoudiens de Buraimi en 1870, la guerre du Qatar de 1880, et énumère ses épouses et les fils parmi lesquels le pouvoir a été transmis après sa mort."
  ur: "زید بن خلیفہ بن شخبوت النہیان (1837–1909) پر عربی ویکیپیڈیا مضمون، جسے زید اول یا زید عظیم کے نام سے جانا جاتا ہے، ابوظہبی کے ساتویں حکمران 1855 سے اپنی موت تک؛ اس میں سعید بن تہنون کی واپسی، قواسم کے ساتھ تنازعہ اور 1868 میں خالد بن سلطان کے قتل، 1870 میں بریمی سے سعودیوں کی بے دخلی، 1880 کی قطر کی جنگ، اور ان کی بیویوں اور بیٹوں کی فہرست دی گئی ہے جن کے درمیان ان کی موت کے بعد حکمرانی گزری۔"
