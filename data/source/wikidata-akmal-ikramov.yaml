  ur: "اکمل اکراموف کے لیے وکی ڈیٹا آئٹم؛ صرف ساختی شناخت کنندگان اور تاریخیں۔ اس میں ان کی پیدائش 1898، ان کی وفات 13 مارچ 1938، تاشقند کو جائے پیدائش اور کومونارکا کو تدفین کی جگہ کے طور پر درج کیا گیا ہے، اور مذہب کی کوئی قدر نہیں۔"
  tr: "Akmal İkramov için Wikidata kartı; sadece düzenlenmiş tanımlayıcılar ve tarihler. 1898'de doğduğu ve 13 Mart 1938'deki ölümünü taşıyan bu kart, doğum yeri olarak Taşkent, defin yeri olarak Komonarka ve dini bir değeri yoktur."
  id: "Kartu Wikidata untuk Akmal Ikramov; hanya pengenal terorganisir dan tanggal. Lahir pada tahun 1898 dan wafat pada 13 Maret 1938, Tashkent sebagai tempat kelahiran dan Komonarka sebagai tempat pemakaman, dan tidak memiliki nilai keagamaan."
