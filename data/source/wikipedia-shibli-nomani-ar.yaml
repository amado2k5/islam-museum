reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A short article. Its infobox is the one source in this record's set that assigns a school outright — fiqh Hanafi, affiliation Ahl al-Sunna wa-l-Jama'a, creed Maturidi — but it stands alone: the English article's infobox gives only 'Sunni', Wikidata gives Islam generically, and the TDV encyclopedia entry names no school, so under the lane's two-source rule and doubt rule the faith stays unclassified and the infobox's assignment is recorded in the faith note rather than adopted. The article also records his birth at Bindul village in Azamgarh district, his command of Arabic, Persian, Urdu, Turkish and Hindi, his work at Aligarh University, his part in founding Nadwatul Ulama at Lucknow, his teacher Ahmad Ali Saharanpuri, his cousinship to the exegete Hamiduddin Farahi, a lineage claim tracing his descent to Abu Hanifa (cited to al-Alusi's history of Baghdad's mosques — an attributed claim, not used as fact), a short works list, and his death on 29 Dhu al-Hijja 1332 AH, which it pairs with 17 November 1914 although the tabular conversion of that Hijri date is 18 November, the date the other sources give. Its Hijri birth year 1275 also conflicts with the conversion of June 1857 (1273). Read in full on 24 October 2026."
