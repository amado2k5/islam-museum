label:
  ar: "Great Women of Islam ⁦(نساء عظيمات في الإسلام)⁩ — محمود أحمد غضنفر، ترجمة جميلة محمد قوي ⁦(دار السلام، الرياض)⁩"
  en: "Great Women of Islam, Who Were Given the Good News of Paradise — Mahmood Ahmad Ghadanfar, tr. Jamila Muhammad Qawi (Darussalam, Riyadh)"
summary:
  ar: "الترجمة الإنجليزية لكتاب محمود أحمد غضنفر في الصحابيات المبشرات بالجنة، ترجمة جميلة محمد قوي، ومراجعة الشيخ صفي الرحمن المباركفوري، وتحرير محمد أيوب صابرا ومحمد فاروق، دار السلام للنشر والتوزيع بالرياض؛ لم يظهر تاريخ الطبع في النسخة."
  en: "The English translation of Mahmood Ahmad Ghadanfar's book on the women Companions given the good news of Paradise, translated by Jamila Muhammad Qawi, revised by Sheikh Safiur-Rahman al-Mubarakpuri and edited by Muhammad Ayub Sapra and Muhammad Farooq, Darussalam Publishers & Distributors, Riyadh; no printing date appears in the copy."
  es: "Traducción al inglés del libro de Mahmood Ahmad Ghadanfar sobre las mujeres Compañeras que recibieron la buena noticia del Paraíso, traducido por Jamila Muhammad Qawi, revisado por Sheikh Safiur-Rahman al-Mubarakpuri y editado por Muhammad Ayub Sapra y Muhammad Farooq, Darussalam Publishers & Distributors, Riad; no aparece fecha de impresión en el ejemplar."
  fr: "Traduction anglaise du livre de Mahmood Ahmad Ghadanfar sur les femmes Compagnes ayant reçu la bonne nouvelle du Paradis, traduit par Jamila Muhammad Qawi, révisé par Sheikh Safiur-Rahman al-Mubarakpuri et édité par Muhammad Ayub Sapra et Muhammad Farooq, Darussalam Publishers & Distributors, Riyad; aucune date d'impression n'apparaît dans l'exemplaire."
