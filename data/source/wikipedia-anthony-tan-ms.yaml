summary:
  ar: "مقالة ويكيبيديا الملايوية عن أنتوني تان، رجل الأعمال الماليزي المولد الذي شارك في تأسيس غراب ورئيسها التنفيذي؛ تذكر أن أباه تان هينغ تشيو رئيس تان تشونغ موتور، وأن أمه خور سوي واه استثمرت ملايين في الشركة الناشئة التي صارت غراب، ودراسته في جامعة شيكاغو وكلية هارفارد للأعمال، وإدراج فوربس له سنة 2021 بين أغنى سنغافورة بثروة مقدرة بـ790 مليون دولار."
  en: "Malay Wikipedia article on Anthony Tan, the Malaysian-born businessman who co-founded Grab and is its chief executive; it records his father Tan Heng Chew as president of Tan Chong Motor, his mother Khor Swee Wah's investment of millions in the startup that became Grab, his studies at the University of Chicago and Harvard Business School, and Forbes's 2021 listing of him among Singapore's richest with an estimated $790 million."
