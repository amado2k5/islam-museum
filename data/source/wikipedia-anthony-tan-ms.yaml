summary:
  ar: "مقالة ويكيبيديا الملايوية عن أنتوني تان، رجل الأعمال الماليزي المولد الذي شارك في تأسيس غراب ورئيسها التنفيذي؛ تذكر أن أباه تان هينغ تشيو رئيس تان تشونغ موتور، وأن أمه خور سوي واه استثمرت ملايين في الشركة الناشئة التي صارت غراب، ودراسته في جامعة شيكاغو وكلية هارفارد للأعمال، وإدراج فوربس له سنة 2021 بين أغنى سنغافورة بثروة مقدرة بـ790 مليون دولار."
  en: "Malay Wikipedia article on Anthony Tan, the Malaysian-born businessman who co-founded Grab and is its chief executive; it records his father Tan Heng Chew as president of Tan Chong Motor, his mother Khor Swee Wah's investment of millions in the startup that became Grab, his studies at the University of Chicago and Harvard Business School, and Forbes's 2021 listing of him among Singapore's richest with an estimated $790 million."
  es: "Artículo de Wikipedia en malayo sobre Anthony Tan, el empresario nacido en Malasia que cofundó Grab y es su director ejecutivo; en él se menciona a su padre, Tan Heng Chew, como presidente de Tan Chong Motor, la inversión de millones de su madre, Khor Swee Wah, en la empresa emergente que se convirtió en Grab, sus estudios en la Universidad de Chicago y en la Escuela de Negocios de Harvard, y la inclusión en la lista de Forbes de 2021 de los más ricos de Singapur con una fortuna estimada de 790 millones de dólares."
  fr: "L'article de Wikipédia en malais sur Anthony Tan, l'homme d'affaires d'origine malaisienne qui a cofondé Grab et en est le directeur général; il mentionne son père, Tan Heng Chew, comme président de Tan Chong Motor, l'investissement de plusieurs millions de dollars de sa mère, Khor Swee Wah, dans la start-up devenue Grab, ses études à l'Université de Chicago et à la Harvard Business School, et son classement par Forbes en 2021 parmi les personnes les plus riches de Singapour avec une fortune estimée à 790 millions de dollars."
  ur: "ملائیشیا میں پیدا ہونے والے تاجر، انتھونی ٹین پر ملائی ویکیپیڈیا کا مضمون جس نے گریب کی مشترکہ بنیاد رکھی اور اس کے چیف ایگزیکٹو ہیں۔ اس میں ان کے والد ٹین ہینگ چیو کو ٹین چونگ موٹر کے صدر کے طور پر، ان کی والدہ کھور سوی واہ کی سٹارٹ اپ میں لاکھوں کی سرمایہ کاری جو گراب بن گیا، یونیورسٹی آف شکاگو اور ہارورڈ بزنس اسکول میں ان کی تعلیم، اور فوربز کی 2021 کی فہرست میں ان کو سنگاپور کے امیر ترین افراد میں شامل کیا گیا ہے جس کا تخمینہ $790 ملین ہے۔"
  tr: "Malezya doğumlu iş insanı Anthony Tan hakkında Malay Wikipedia makalesi; babası Tan Heng Chiu'nun Tan Chung Motor'un başkanı olduğu ve annesi Khor Sui Wah'ın Ghrub olan girişime milyonlarca yatırım yaptığı, Chicago Üniversitesi ve Harvard İşletme Okulu'ndaki eğitimi ve 2021 Forbes'u onu tahmini 790 milyon dolarlık servetle Singapur'un en zengin insanları arasında sıraladığı belirtilmelidir."
  id: "Artikel Wikipedia Bahasa Melayu tentang Anthony Tan, pengusaha kelahiran Malaysia yang membantu mendirikan dan menjadi CEO Grip; perlu disebutkan bahwa ayahnya, Tan Heng Chiu, adalah ketua Tan Chung Motor, dan ibunya, Khor Sui Wah, menginvestasikan jutaan dolar dalam startup yang kemudian menjadi Ghrub, serta studinya di University of Chicago dan Harvard Business School, serta Forbes 2021 yang menempatkannya di antara orang terkaya di Singapura dengan perkiraan kekayaan $790 juta."
