summary:
  ar: "الموقع الرسمي لمعهد القلوب المهداة (Guided Hearts Institute) الذي أسسته الأستاذة دنيا شعيب وتديره تنفيذيًا؛ يقدّم المعهد تعليمًا نفسيًا-روحيًا متكاملًا إسلاميًا في الصحة النفسية والعلاقات، عبر برامج ودورات وورش داخل الولايات المتحدة وخارجها."
  en: "The official website of the Guided Hearts Institute, which states that the institute was founded by Ustadha Dunia Shuaib and calls her its founder and executive director; the institute offers Islamically integrated psycho-spiritual education in mental health and relationships through programmes, courses and workshops in the United States and abroad."
  es: "El sitio web oficial del Instituto Corazones Guiados, que afirma que el instituto fue fundado por Ustadha Dunia Shuaib y la nombra su fundadora y directora ejecutiva, ofrece educación psicoespiritual integrada con el Islam en salud mental y relaciones a través de programas, cursos y talleres en los Estados Unidos y en el extranjero."
  fr: "Le site officiel du Guided Hearts Institute indique que l'institut a été fondé par Ustadha Dunia Shuaib, qu'elle qualifie de fondatrice et directrice exécutive; l'institut propose une éducation psycho-spirituelle intégrée à l'islam dans le domaine de la santé mentale et des relations, à travers des programmes, des cours et des ateliers aux États-Unis et à l'étranger."
  ur: "گائیڈڈ ہارٹس انسٹی ٹیوٹ کی آفیشل ویب سائٹ، جس میں کہا گیا ہے کہ انسٹی ٹیوٹ کو استاد دنیا شعیب نے قائم کیا تھا اور وہ اسے اس کے بانی اور ایگزیکٹو ڈائریکٹر کہتے ہیں۔ انسٹی ٹیوٹ امریکہ اور بیرون ملک پروگراموں، کورسز اور ورکشاپس کے ذریعے ذہنی صحت اور تعلقات میں اسلامی طور پر مربوط نفسیاتی روحانی تعلیم فراہم کرتا ہے۔"
  tr: "Profesör Donia Shuaib tarafından kurulan ve yönetilen Guided Hearts Institute'un resmi web sitesi, Amerika Birleşik Devletleri içinde ve dışında programlar, kurslar ve atölyeler aracılığıyla kapsamlı İslami psiko-ruhani eğitim sunmaktadır."
  id: "Situs resmi Guided Hearts Institute, yang didirikan dan dikelola secara eksekutif oleh Profesor Donia Shuaib, menawarkan pendidikan psiko-spiritual Islam yang komprehensif dalam kesehatan mental dan hubungan melalui program, kursus, dan lokakarya di dalam dan luar Amerika Serikat."
