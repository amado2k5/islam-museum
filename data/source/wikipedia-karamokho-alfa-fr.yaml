reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A short article: it gives his birth as about 1700 at Diari in the Labé region — the only article to date his birth at all — his Qur'an study with his uncle at Sombily and further Islamic studies in Mali from the age of twelve, his founding of Labé as his province's capital with its mosque, and his death in 1751 and burial behind the great mosque of Labé, where a mausoleum houses him and some descendants. It names no legal school or Sufi order for Alfa himself. Checked 1 November 2026."
