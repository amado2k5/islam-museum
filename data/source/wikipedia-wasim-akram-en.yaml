  ar: "مقالة ويكيبيديا الإنجليزية عن وسيم أكرم (مواليد 1966)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في لاهور في 3 يونيو 1966، ومسيرته مع باكستان (414 ويكيت اختبار و502 ويكيت ليوم واحد)، وفوزه بكأس العالم 1992 وجائزة لاعب مباراة النهائي، ولعبه للانكشير، ودخوله قاعة المشاهير سنة 2009 ووسام هلال الامتياز سنة 2019 وتشخيصه بالسكري."
  en: "English Wikipedia article on Wasim Akram (born 1966); used for entity facts only. It records his birth in Lahore on 3 June 1966, his Pakistan career (414 Test wickets, 502 ODI wickets), his 1992 World Cup win and Player of the Match award in the final, his Lancashire career, his 2009 Hall of Fame induction, his 2019 Hilal-e-Imtiaz and his diabetes diagnosis."
