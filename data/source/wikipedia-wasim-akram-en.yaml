summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن وسيم أكرم ⁦(مواليد 1966)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في لاهور في 3 يونيو 1966، ومسيرته مع باكستان ⁦(414 ويكيت اختبار و502 ويكيت ليوم واحد)⁩، وفوزه بكأس العالم 1992 وجائزة لاعب مباراة النهائي، ولعبه للانكشير، ودخوله قاعة المشاهير سنة 2009 ووسام هلال الامتياز سنة 2019 وتشخيصه بالسكري."
  en: "English Wikipedia article on Wasim Akram (born 1966); used for entity facts only. It records his birth in Lahore on 3 June 1966, his Pakistan career (414 Test wickets, 502 ODI wickets), his 1992 World Cup win and Player of the Match award in the final, his Lancashire career, his 2009 Hall of Fame induction, his 2019 Hilal-e-Imtiaz and his diabetes diagnosis."
  es: "Artículo de la Wikipedia en inglés sobre Wasim Akram (nacido en 1966); utilizado únicamente para datos biográficos. En él se registra su nacimiento en Lahore el 3 de junio de 1966, su trayectoria con la selección de Pakistán (414 wickets en partidos de prueba, 502 wickets en partidos de un día), su victoria en la Copa del Mundo de 1992 y su premio al Jugador del Partido en la final, su trayectoria con Lancashire, su ingreso al Salón de la Fama en 2009, su condecoración Hilal-e-Imtiaz en 2019 y su diagnóstico de diabetes."
  fr: "Article de Wikipédia en anglais sur Wasim Akram (né en 1966); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Lahore le 3 juin 1966, sa carrière au Pakistan (414 guichets en Test, 502 guichets en ODI), sa victoire à la Coupe du monde de 1992 et son titre de joueur du match en finale, sa carrière au Lancashire, son intronisation au Temple de la renommée en 2009, sa distinction Hilal-e-Imtiaz en 2019 et son diagnostic de diabète."
  ur: "وسیم اکرم ⁦(پیدائش 1966)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 3 جون 1966 کو لاہور میں ان کی پیدائش، ان کا پاکستانی کیریئر ⁦(414 ٹیسٹ وکٹیں، 502 ون ڈے وکٹیں)⁩، ان کا 1992 کا ورلڈ کپ جیتنا اور فائنل میں پلیئر آف دی میچ کا ایوارڈ، ان کا لنکاشائر کیریئر، ان کا 2009 کا ہال آف فیم شامل ہونا، ان کا 2019 کا ہلال امتیاز اور ان کا 2019 کا ہلال امتیاز شامل ہے۔"
  tr: "Wasim Akram (d. 1966) hakkında İngilizce Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. 3 Haziran 1966'da Lahor'da doğdu ve Pakistan'daki kariyerinde (414 Test wicket ve 502 tek günlük wicket), 1992 Dünya Kupası'nı kazandı ve Maçın Son Oyuncusu ödülünü kazandı, Ankshire için oynadı, 2009'da Onur Listesi'ne alındı, 2019'da Hilal Mükemmellik Madalyası'nı aldı ve diyabet teşhisi kondu."
  id: "Artikel Wikipedia bahasa Inggris tentang Wasim Akram (lahir 1966); digunakan hanya untuk fakta entitas. Ia lahir di Lahore pada 3 Juni 1966, dan kariernya bersama Pakistan (414 wicket Test dan 502 wicket satu hari), memenangkan Piala Dunia 1992 dan penghargaan Pemain Terbaik Final, bermain untuk Ankshir, dilantik ke Hall of Fame pada 2009, menerima Medali Keunggulan Hilal pada 2019, dan didiagnosis menderita diabetes."
