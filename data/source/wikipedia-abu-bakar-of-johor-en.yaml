summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أبي بكر سلطان جوهر؛ تُستخدم لوقائع الكيان فقط. مقالة مفصلة تعطي ميلاده في 3 شباط 1833 في تلوك بلانغا بسنغافورة، وخلافته أباه تمنغكونغ سنة 1862، ولقبَي مهراجا (1868) وسلطان (1886)، وتحديثه جوهر وبقاءها دون مقيم بريطاني، وصداقته للملكة فيكتوريا، ووفاته بالتهاب الرئة في فندق بيليز بلندن في 4 حزيران 1895 ودفنه في المقبرة الملكية المحمودية بجوهور بهرو. يعطي صندوق معلوماتها ديانته «الإسلام السنّي» ولا يسمّي متنها مذهبًا."
  en: "English Wikipedia article on Abu Bakar of Johor; used for entity facts only. A detailed good-article account: his birth on 3 February 1833 at Teluk Belanga, Singapore, his succession to his father as Temenggong in 1862, the Maharaja title (1868) and the Sultan title (1886), his modernisation of Johor and its freedom from a British Resident, his friendship with Queen Victoria, his death of pneumonia at Bailey's Hotel, London, on 4 June 1895 and his burial at the Mahmoodiah Royal Mausoleum, Johor Bahru. Its infobox gives his religion as Sunni Islam; its text names no school."
