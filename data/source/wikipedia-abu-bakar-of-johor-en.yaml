summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أبي بكر سلطان جوهر؛ تُستخدم لوقائع الكيان فقط. مقالة مفصلة تعطي ميلاده في 3 شباط 1833 في تلوك بلانغا بسنغافورة، وخلافته أباه تمنغكونغ سنة 1862، ولقبَي مهراجا (1868) وسلطان (1886)، وتحديثه جوهر وبقاءها دون مقيم بريطاني، وصداقته للملكة فيكتوريا، ووفاته بالتهاب الرئة في فندق بيليز بلندن في 4 حزيران 1895 ودفنه في المقبرة الملكية المحمودية بجوهور بهرو. يعطي صندوق معلوماتها ديانته «الإسلام السنّي» ولا يسمّي متنها مذهبًا."
  en: "English Wikipedia article on Abu Bakar of Johor; used for entity facts only. A detailed good-article account: his birth on 3 February 1833 at Teluk Belanga, Singapore, his succession to his father as Temenggong in 1862, the Maharaja title (1868) and the Sultan title (1886), his modernisation of Johor and its freedom from a British Resident, his friendship with Queen Victoria, his death of pneumonia at Bailey's Hotel, London, on 4 June 1895 and his burial at the Mahmoodiah Royal Mausoleum, Johor Bahru. Its infobox gives his religion as Sunni Islam; its text names no school."
  es: "Artículo de la Wikipedia en inglés sobre Abu Bakar de Johor; utilizado únicamente para datos sobre la entidad. Un relato detallado: su nacimiento el 3 de febrero de 1833 en Teluk Belanga, Singapur, su sucesión de su padre como Temenggong en 1862, el título de Maharaja (1868) y el título de Sultán (1886), su modernización de Johor y su independencia de un residente británico, su amistad con la reina Victoria, su muerte por neumonía en el Hotel Bailey's de Londres el 4 de junio de 1895 y su entierro en el Mausoleo Real Mahmoodiah, Johor Bahru. Su ficha informativa indica que su religión era el islam sunita; su texto no menciona ninguna escuela."
  fr: "Article de Wikipédia en anglais sur Abu Bakar de Johor; utilisé uniquement pour les informations factuelles. Cet article détaillé retrace sa naissance le 3 février 1833 à Teluk Belanga (Singapour), son accession au trône en tant que Temenggong en 1862, son accession au titre de Maharaja (1868) puis de Sultan (1886), la modernisation de Johor et l'indépendance de l'État vis-à-vis du résident britannique, son amitié avec la reine Victoria, son décès des suites d'une pneumonie à l'hôtel Bailey's de Londres le 4 juin 1895 et son inhumation au mausolée royal Mahmoodiah de Johor Bahru. L'infobox indique qu'il était de confession sunnite; le texte ne mentionne aucune école de religion."
  ur: "جوہر کے ابوبکر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک تفصیلی گڈ آرٹیکل اکاؤنٹ: ان کی پیدائش 3 فروری 1833 کو تیلوک بیلنگا، سنگاپور میں، 1862 میں ان کے والد کی جانشینی ٹیمنگ گونگ، مہاراجہ کا خطاب (1868) اور سلطان کا خطاب (1886)، جوہر کی جدیدیت اور برطانوی باشندے سے آزادی، اس کی دوستی، ملکہ بانی کے ہوٹل میں اس کی دوستی، ملکہ بای کی موت۔ لندن، 4 جون 1895 کو اور ان کی تدفین محمودیہ شاہی مزار، جوہر بہرو میں ہوئی۔ اس کا انفو باکس اس کا مذہب بطور سنی اسلام دیتا ہے۔ اس کے متن کا کوئی اسکول نہیں ہے۔"
  tr: "Ebu Bekir Sultan Johar hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Detaylı bir makale, 3 Şubat 1833'te Singapur'un Talok Banga'da doğduğunu, 1862'de baba Temengkong olarak tahta geçişini, Maharaja (1868) ve Sultan (1886) unvanlarını, Johar'ın modernleşmesini ve onun Britanya ikamet eden olarak devam eden yokluğunu, Kraliçe Victoria ile dostluğunu, 4 Haziran 1895'te Londra'daki Belize Oteli'nde zatürreden ölmesini ve Behru, Johor'daki Mahmudiya Kraliyet Mezarlığı'na defnedilmesini belirtmektedir. Bilgi kutusunda dini 'Sünni İslam' olarak belirtilmiştir ve bir mezhep olarak adlandırılmaz."
  id: "Artikel Wikipedia bahasa Inggris tentang Abu Bakr Sultan Johar; digunakan hanya untuk fakta entitas. Sebuah artikel rinci menceritakan kelahirannya pada 3 Februari 1833 di Talok Banga, Singapura, suksesinya sebagai ayah Temengkong pada tahun 1862, gelarnya sebagai Maharaja (1868) dan Sultan (1886), modernisasi Johar dan ketidakhadirannya sebagai penduduk Inggris, persahabatannya dengan Ratu Victoria, kematiannya akibat pneumonia di Belize Hotel di London pada 4 Juni 1895, dan pemakamannya di Pemakaman Kerajaan Mahmudiya di Johor, Behru. Kotak infonya mencantumkan agamanya sebagai 'Islam Sunni' dan tidak menyebutkan sebagai sekte."
