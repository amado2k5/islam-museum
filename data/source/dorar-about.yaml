summary:
  ar: "صفحة «التعريف بمؤسسة وموقع الدرر السنية» كما قُرئت في 7 نوفمبر 2026: مؤسسة علمية وقفية، وغايتها ورسالتها ورؤيتها وهدفها كما تعلنها، وسطر الحقوق 1421–1448هـ، وقائمة موسوعات الموقع."
  en: "The page 'About the Dorar al-Saniyya Foundation and site' as read on 7 November 2026: a scholarly waqf foundation, its stated aim, mission, vision and goal, the copyright line 1421–1448 AH, and the menu of the site's encyclopedias."
  ur: "«الدرر السنیہ کے ادارے اور سائٹ کا تعارف» صفحہ، 7 نومبر 2026 کو پڑھا گیا: علمی وقفی ادارہ، اس کا بیان کردہ مقصد، پیغام، وژن اور ہدف، حقوق کی سطر 1421–1448ھ، اور موسوعات کی فہرست۔"
  es: "La página 'Acerca de la Fundación y el sitio web Dorar al-Saniyya', tal como se leyó el 7 de noviembre de 2026: una fundación waqf académica, su objetivo declarado, misión, visión y meta, la línea de derechos de autor 1421–1448 AH y el menú de las enciclopedias del sitio."
  fr: "La page « À propos de la Fondation Dorar al-Saniyya et du site » telle que consultée le 7 novembre 2026: une fondation waqf à vocation académique, son but, sa mission, sa vision et son objectif déclarés, la période de copyright 1421-1448 AH et le menu des encyclopédies du site."
  tr: "7 Kasım 2026'da okunan \"Al-Durar Al-Sunniyah Vakfı ve Web Sitesine Giriş\" sayfası: Bilimsel bir vakıf kurumu, amacı, misyonu, vizyonu ve amacı ilan ettiği şekliyle, haklar belgesi 1421–1448 AH ve site ansiklopedileri listesi."
  id: "Halaman \"Pengantar Yayasan dan Situs Web Al-Durar Al-Sunniyah\" seperti yang dibaca pada 7 November 2026: Sebuah lembaga abadi ilmiah, tujuan, misi, visi, dan sasaran yang dinyatakan, dokumen hak 1421–1448 AH, serta daftar ensiklopedia situs."
