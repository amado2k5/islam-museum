summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن الحاج مصباح؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده سنة 1876 في كاومان بسوراكارتا ووفاته في مانوكواري في 24 أيار 1926 ودفنه في مقبرة فانيندي، وتفصّل نشاطه التبليغي واعتقالاته المتكررة وانضمامه إلى الحزب الشيوعي وكتابته «إسلامية وشيوعية» في منفاه، وتنقل عن شيرايشي وصفه بأنه مسلم أرثوذكسي صالح. لا تسمي له مذهبًا."
  en: "Indonesian Wikipedia article on Haji Misbach; used for entity facts only. It gives his birth in 1876 at Kauman, Surakarta, his death at Manokwari on 24 May 1926 and his burial at Fanindi cemetery, and details his preaching, his repeated arrests, his move to the Communist Party and his 'Islamism and Communism' written in exile, quoting Shiraishi's description of him as a pious orthodox Muslim. It names no school for him."
