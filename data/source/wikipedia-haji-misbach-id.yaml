summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن الحاج مصباح؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده سنة 1876 في كاومان بسوراكارتا ووفاته في مانوكواري في 24 أيار 1926 ودفنه في مقبرة فانيندي، وتفصّل نشاطه التبليغي واعتقالاته المتكررة وانضمامه إلى الحزب الشيوعي وكتابته «إسلامية وشيوعية» في منفاه، وتنقل عن شيرايشي وصفه بأنه مسلم أرثوذكسي صالح. لا تسمي له مذهبًا."
  en: "Indonesian Wikipedia article on Haji Misbach; used for entity facts only. It gives his birth in 1876 at Kauman, Surakarta, his death at Manokwari on 24 May 1926 and his burial at Fanindi cemetery, and details his preaching, his repeated arrests, his move to the Communist Party and his 'Islamism and Communism' written in exile, quoting Shiraishi's description of him as a pious orthodox Muslim. It names no school for him."
  es: "Artículo de la Wikipedia en indonesio sobre Haji Misbach; utilizado únicamente para datos biográficos. Indica su nacimiento en 1876 en Kauman, Surakarta, su fallecimiento en Manokwari el 24 de mayo de 1926 y su entierro en el cementerio de Fanindi. Detalla su labor de predicación, sus repetidos arrestos, su ingreso al Partido Comunista y su obra «Islamismo y comunismo», escrita en el exilio, citando la descripción que Shiraishi hace de él como un musulmán ortodoxo y devoto. No menciona ninguna escuela a la que perteneciera."
  fr: "Article de Wikipédia indonésien sur Haji Misbach; utilisé uniquement pour des informations factuelles. Il indique sa naissance en 1876 à Kauman, Surakarta, sa mort à Manokwari le 24 mai 1926 et son inhumation au cimetière de Fanindi. Il détaille également ses prédications, ses arrestations répétées, son adhésion au Parti communiste et son ouvrage « Islamisme et communisme », écrit en exil, citant la description qu'en fait Shiraishi: un musulman orthodoxe pieux. Aucune école n'est mentionnée."
  ur: "حاجی مِسباچ پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1876 میں کومان، سوراکارتا میں ان کی پیدائش، 24 مئی 1926 کو مانوکواری میں ان کی موت اور فنندی قبرستان میں ان کی تدفین، اور ان کی تبلیغ، ان کی بار بار گرفتاریوں، کمیونسٹ پارٹی میں اس کی منتقلی اور جلاوطنی میں لکھے گئے اس کی 'اسلامیت اور کمیونزم' کی تفصیلات بیان کی گئی ہیں، جس میں شیراشی یا مسلم کی تشریع کا حوالہ دیا گیا ہے۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Hacı Misbah hakkında Endonezya Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 1876'da Surakarta, Kauman'da doğduğunu, 24 Mayıs 1926'da Manukwari'de öldüğünü ve Fanindi Mezarlığı'na defnedilmesini anlatır. Misyonerlik faaliyetlerini, tekrar eden tutuklamalarını, Komünist Parti'ye katılmasını ve sürgünde \"İslami ve Komünist\" yazısını detaylandırır. Shirayshi'yi dindar bir Ortodoks Müslüman olarak alıntılar. Onu bir tarikat olarak adlandırmaz."
  id: "Artikel Wikipedia Indonesia tentang Haji Misbah hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada tahun 1876 di Kauman, Surakarta, kematiannya di Manukwari pada 24 Mei 1926, dan pemakamannya di Pemakaman Fanampi. Artikel ini merinci aktivitas misionarisnya, penangkapan berulang, bergabung dengan Partai Komunis, dan menulis \"Islam dan Komunis\" dalam pengasingan. Artikel tersebut mengutip Shirayshi sebagai Muslim Ortodoks yang taat. Tidak menyebutkan dia sebagai sekte."
