summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شمسول يوسف؛ تُستخدم لوقائع الكيان فقط. تفصّل ميلاده في كوالالمبور سنة 1984 ودراسته للإعلام وفيلميه «منافق» ⁦(2016)⁩ و«منافق 2» ⁦(2018)⁩ وجوائزه لأفضل مخرج."
  en: "English Wikipedia article on Syamsul Yusof; used for entity facts only. It details his 1984 Kuala Lumpur birth, his media studies, his films Munafik (2016) and Munafik 2 (2018), and his best-director awards."
  es: "Artículo de la Wikipedia en inglés sobre Syamsul Yusuf; utilizado únicamente para datos sobre la persona. Detalla su nacimiento en Kuala Lumpur en 1984, sus estudios de comunicación, sus películas Munafik (2016) y Munafik 2 (2018), y sus premios al mejor director."
  fr: "Article Wikipédia en anglais sur Syamsul Yusuf; utilisé uniquement à des fins d’information sur l’entité. Il détaille sa naissance à Kuala Lumpur en 1984, ses études de médias, ses films Munafik (2016) et Munafik 2 (2018), ainsi que ses prix de meilleur réalisateur."
  ur: "سیام یوسف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی 1984 میں کوالالمپور کی پیدائش، ان کی میڈیا اسٹڈیز، ان کی فلموں منافک (2016) اور Munafik 2 (2018)، اور ان کے بہترین ہدایت کار کے ایوارڈز کی تفصیلات ہیں۔"
  tr: "Shamsol Yusuf hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1984 yılında Kuala Lumpur'da doğdu, medya ve \"Hypocrite\" (2016) ile \"Hypocrite 2\" (2018) filmlerini ve En İyi Yönetmen ödüllerini aldı."
  id: "Artikel Wikipedia bahasa Inggris tentang Shamsol Yusuf; digunakan hanya untuk fakta entitas. Ia lahir di Kuala Lumpur pada tahun 1984, mempelajari media, serta film-filmnya \"Hypocrite\" (2016) dan \"Hypocrite 2\" (2018), serta penghargaan untuk Sutradara Terbaik."
