reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. The article gives his full name Mohd Syamsul bin Mohd Yusof, his birth in Kuala Lumpur on 21 May 1984, his diploma studies in film, TV broadcasting and journalism at the Malaysia Institute of Integrative Media (Academy TV3), his record as the youngest winner of the Malaysian Film Festival's Best Director award at 25, his Best Director award at the 57th Asia Pacific Film Festival for the horror/religious film Munafik, and Munafik 2's record as the highest-grossing Malaysian film in 2018 until surpassed by his own Mat Kilau (2022). It names no school for him. Read in full on 15 November 2026."
