summary:
  ar: "عنصر ويكي بيانات Q1316 لصدام حسين، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته في 28 أبريل 1937 ووفاته في 30 ديسمبر 2006 وقيمة دين هي الإسلام عمومًا فحسب؛ ويعطي مكان ولادته تكريت وهو تبسيط خاص به لا تتبعه المقالات التي تعطي العوجة، ومكان وفاته معسكر العدالة ومكان دفنه ضريحه في العوجة."
  en: "Wikidata item Q1316 for Saddam Hussein, grounded through the English article's pageprops; used for entity facts only. It gives his birth on 28 April 1937, his death on 30 December 2006, and a religion value of Islam in general only. Its birth-place value is Tikrit — its own simplification, not followed here, since the articles give al-Awja — and it gives Camp Justice as his place of death and his al-Awja mausoleum as his place of burial."
