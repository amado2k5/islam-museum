summary:
  ar: "عنصر ويكي بيانات Q1316 لصدام حسين، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته في 28 أبريل 1937 ووفاته في 30 ديسمبر 2006 وقيمة دين هي الإسلام عمومًا فحسب؛ ويعطي مكان ولادته تكريت وهو تبسيط خاص به لا تتبعه المقالات التي تعطي العوجة، ومكان وفاته معسكر العدالة ومكان دفنه ضريحه في العوجة."
  en: "Wikidata item Q1316 for Saddam Hussein, grounded through the English article's pageprops; used for entity facts only. It gives his birth on 28 April 1937, his death on 30 December 2006, and a religion value of Islam in general only. Its birth-place value is Tikrit — its own simplification, not followed here, since the articles give al-Awja — and it gives Camp Justice as his place of death and his al-Awja mausoleum as his place of burial."
  es: "El elemento Q1316 de Wikidata sobre Saddam Hussein, basado en los atributos de página del artículo en inglés, se utiliza únicamente para datos sobre la entidad. Indica que nació el 28 de abril de 1937, falleció el 30 de diciembre de 2006 y profesaba el islam en general. Su lugar de nacimiento es Tikrit (una simplificación propia que no se sigue aquí, ya que los artículos mencionan al-Awja), y señala el Campo de Justicia como su lugar de fallecimiento y su mausoleo en al-Awja como su lugar de sepultura."
  fr: "L'élément Wikidata Q1316 concernant Saddam Hussein, extrait des propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 28 avril 1937, son décès le 30 décembre 2006 et sa religion comme étant l'islam en général. Son lieu de naissance est Tikrit (une simplification propre à Wikidata, non retenue ici, car les articles mentionnent al-Awja), et son lieu de décès est le camp de Justice, son mausolée d'al-Awja étant son lieu d'inhumation."
