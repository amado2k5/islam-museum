  ar: "مقالة ويكيبيديا الإنجليزية عن محمد أبو تريكة؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته مع الترسانة والأهلي وبني ياس، ومئة مباراة دولية مع مصر ولقبي كأس الأمم الأفريقية 2006 و2008، ودراسته للفلسفة في جامعة القاهرة وأعماله الإنسانية، وملف تجميد أمواله ووضعه على قائمة الإرهاب الذي نفى علاقته بالإخوان بشأنه. لا تذكر المقالة دينه في نصها وتدرجه في تصنيف «مسلمون مصريون» دون تسمية أي مذهب."
  en: "English Wikipedia article on Mohamed Aboutrika; used for entity facts only. It recounts his career at Tersana, Al Ahly and Baniyas, his 100 caps for Egypt and the 2006 and 2008 Africa Cup of Nations titles, his Cairo University philosophy degree and humanitarian work, and the asset freeze and terrorism-list episode over alleged Muslim Brotherhood ties, which he denied. It makes no statement of his religion in its text; its categories file him under 'Egyptian Muslims', naming no school."
