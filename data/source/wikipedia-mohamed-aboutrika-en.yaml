reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id. It gives his full name as Mohamed Mohamed Mohamed Aboutrika, born 7 November 1978 in Nahia, Giza; Tersana 1997–2003, Al Ahly 2004–2013 and a 2013 Baniyas loan; 100 Egypt caps and 38 goals; the winning goal in the 2008 Africa Cup of Nations final; a Cairo University BA in philosophy; his marriage and five children; and the 2015 asset freeze and 17 January 2017 terrorism-list decision, with his denial of any Muslim Brotherhood involvement. It makes no statement of his religion in its text."
