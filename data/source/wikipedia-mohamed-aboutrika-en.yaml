summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد أبو تريكة؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته مع الترسانة والأهلي وبني ياس، ومئة مباراة دولية مع مصر ولقبي كأس الأمم الأفريقية 2006 و2008، ودراسته للفلسفة في جامعة القاهرة وأعماله الإنسانية، وملف تجميد أمواله ووضعه على قائمة الإرهاب الذي نفى علاقته بالإخوان بشأنه. لا تذكر المقالة دينه في نصها وتدرجه في تصنيف «مسلمون مصريون» دون تسمية أي مذهب."
  en: "English Wikipedia article on Mohamed Aboutrika; used for entity facts only. It recounts his career at Tersana, Al Ahly and Baniyas, his 100 caps for Egypt and the 2006 and 2008 Africa Cup of Nations titles, his Cairo University philosophy degree and humanitarian work, and the asset freeze and terrorism-list episode over alleged Muslim Brotherhood ties, which he denied. It makes no statement of his religion in its text; its categories file him under 'Egyptian Muslims', naming no school."
  es: "Artículo de la Wikipedia en inglés sobre Mohamed Aboutrika; utilizado únicamente para datos sobre la persona. Relata su trayectoria en Tersana, Al Ahly y Baniyas, sus 100 partidos con la selección egipcia y los títulos de la Copa Africana de Naciones de 2006 y 2008, su licenciatura en filosofía por la Universidad de El Cairo y su labor humanitaria, así como el episodio de congelación de activos y su inclusión en la lista de terroristas por supuestos vínculos con los Hermanos Musulmanes, que él negó. El artículo no menciona su religión; lo clasifica como «musulmán egipcio», sin especificar ninguna escuela."
  fr: "Article Wikipédia en anglais sur Mohamed Aboutrika; utilisé uniquement à des fins d'information sur l'entité. Il retrace sa carrière à Tersana, Al Ahly et Baniyas, ses 100 sélections en équipe nationale d'Égypte et ses titres de champion d'Afrique des Nations en 2006 et 2008, son diplôme de philosophie de l'Université du Caire et son engagement humanitaire, ainsi que le gel de ses avoirs et son inscription sur la liste des personnes soupçonnées de terrorisme suite à des liens présumés avec les Frères musulmans, qu'il a niés. L'article ne mentionne pas sa religion; ses catégories le classent dans la catégorie « Musulmans égyptiens », sans préciser d'établissement scolaire."
  ur: "محمد ابوتریکا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ترسانہ، الاحلی اور بنیاس میں ان کے کیریئر، مصر کے لیے ان کے 100 کیپس اور 2006 اور 2008 کے افریقہ کپ آف نیشنز ٹائٹلز، ان کی قاہرہ یونیورسٹی کے فلسفے کی ڈگری اور انسانی ہمدردی کے کام، اور اخوان المسلمین کے مبینہ تعلقات پر اثاثے منجمد اور دہشت گردی کی فہرست کا واقعہ، جس کی اس نے تردید کی۔ اس کے متن میں اس کے مذہب کا کوئی بیان نہیں ہے۔ اس کے زمرے اسے 'مصری مسلمان' کے تحت درج کرتے ہیں، کسی اسکول کا نام نہیں دیتے۔"
  tr: "Mohamed Aboutrika hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Al-Tersanah, Al-Ahli ve Bani Yas ile kariyerini, Mısır ile yüz uluslararası maçını, 2006 ve 2008 Afrika Uluslar Kupası şampiyonluklarını, Kahire Üniversitesi'nde felsefe çalışmalarını, insani yardım çalışmalarını, fonlarının dondurulmasını ve terör listesine alınmasını anlatır; ancak bu listede Müslüman Kardeşler ile herhangi bir bağlantısı olmadığını reddetmiştir. Makalede metinde dini belirtilmez ve herhangi bir mezhep belirtilmeden \"Mısırlı Müslümanlar\" kategorisine dahil edilmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Mohamed Aboutrika; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kariernya bersama Al-Tersanah, Al-Ahli, dan Bani Yas, seratus pertandingan internasional melawan Mesir, gelar Piala Afrika 2006 dan 2008, studi filsafatnya di Universitas Kairo, pekerjaan kemanusiaannya, pembekuan dananya, dan penempatannya dalam daftar terorisme, yang dia bantah memiliki hubungan dengan Ikhwanul Muslimin terkait hal itu. Artikel tersebut tidak menyebutkan agamanya dalam teksnya dan memasukkannya dalam kategori \"Muslim Mesir\" tanpa menyebutkan sekte manapun."
