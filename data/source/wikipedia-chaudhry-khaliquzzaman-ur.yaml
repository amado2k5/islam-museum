summary:
  ar: "مقالہ ویکیپیڈیا اردو مضمون چودھری خلیق الزماں ⁦(1889ء–1973ء)⁩ کے بارے میں؛ انگریزی مضمون کا ترجمہ ہے، اسی مآخذ کے ساتھ؛ پیدائش 25 دسمبر 1889ء چنار اور وفات 18 مئی 1973ء دیتا ہے۔ اس کے متن میں کوئی مسلک نہیں ملتا؛ زمروں میں انھیں پاکستانی سنیوں میں شمار کیا گیا ہے۔"
  en: "The Urdu Wikipedia article on Chaudhry Khaliquzzaman (1889–1973); it is a translation of the English article with the same citations, giving his birth on 25 December 1889 at Chunar and his death on 18 May 1973. Its text names no school for him; its categories file him among Pakistani Sunnis."
  es: "El artículo de Wikipedia en urdu sobre Chaudhry Khaliquzzaman (1889-1973) es una traducción del artículo en inglés con las mismas citas, que indica que nació el 25 de diciembre de 1889 en Chunar y falleció el 18 de mayo de 1973. El texto no menciona ninguna escuela a la que pertenezca; sus categorías lo clasifican entre los sunitas pakistaníes."
  fr: "L'article de Wikipédia en ourdou sur Chaudhry Khaliquzzaman (1889-1973); il s'agit d'une traduction de l'article anglais avec les mêmes citations, indiquant sa naissance le 25 décembre 1889 à Chunar et sa mort le 18 mai 1973. Son texte ne mentionne aucune école pour lui; ses catégories le classent parmi les sunnites pakistanais."
  ur: "چوہدری خلیق الزمان (1889-1973) پر اردو ویکیپیڈیا مضمون؛ یہ انہی حوالوں کے ساتھ انگریزی مضمون کا ترجمہ ہے، جس میں ان کی پیدائش 25 دسمبر 1889 کو چنڑ میں ہوئی اور ان کی وفات 18 مئی 1973 کو ہوئی۔ اس کے متن میں ان کے لیے کوئی اسکول نہیں ہے۔ اس کے زمرے اسے پاکستانی سنیوں میں درج کرتے ہیں۔"
  tr: "Wikipedia Urduca makalesi Chaudhry Khaliq uz Zaman (1889–1973) hakkındadır; aynı kaynaktan alınan İngilizce makalenin çevirisidir; 25 Aralık 1889'da Chinar'da doğmuş ve 18 Mayıs 1973'te vefat etmiştir. Metinde bir mezhep bulunmamaktadır; kategorilerde Pakistanlı Sünniler arasında sayılırlar."
  id: "Artikel Urdu Wikipedia membahas tentang Chaudhry Khaliq uz Zaman (1889–1973); ini adalah terjemahan dari artikel bahasa Inggris, dengan sumber yang sama; ia lahir pada 25 Desember 1889 di Chinar, dan meninggal pada 18 Mei 1973. Tidak ada sekte yang ditemukan dalam teksnya; dalam kategori-kategori, mereka termasuk dalam kalangan Sunni Pakistan."
