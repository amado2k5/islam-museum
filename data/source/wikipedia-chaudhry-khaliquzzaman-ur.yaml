  ar: "مقالہ ویکیپیڈیا اردو مضمون چودھری خلیق الزماں (1889ء–1973ء) کے بارے میں؛ انگریزی مضمون کا ترجمہ ہے، اسی مآخذ کے ساتھ؛ پیدائش 25 دسمبر 1889ء چنار اور وفات 18 مئی 1973ء دیتا ہے۔ اس کے متن میں کوئی مسلک نہیں ملتا؛ زمروں میں انھیں پاکستانی سنیوں میں شمار کیا گیا ہے۔"
  en: "The Urdu Wikipedia article on Chaudhry Khaliquzzaman (1889–1973); it is a translation of the English article with the same citations, giving his birth on 25 December 1889 at Chunar and his death on 18 May 1973. Its text names no school for him; its categories file him among Pakistani Sunnis."
