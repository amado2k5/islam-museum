summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن غادة السمان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في دمشق سنة 1942 لأسرة دمشقية مرموقة محافظة، ودراستها ومسيرتها صحفية وروائية بين دمشق وبيروت وباريس وأعمالها من «عيناك قدري» (1962) إلى «بيروت 75» و«كوابيس بيروت»، وهي مترجمة عن مقالة ويكيبيديا العربية، وتصنّفها تصنيفاتها في المسلمين السوريين دون أن يسمّي نصّها دينًا أو مذهبًا لها."
  en: "English Wikipedia article on Ghada al-Samman; used for entity facts only. It gives her birth in Damascus in 1942 to a prominent, conservative Damascene family, her studies and her career as a journalist and novelist between Damascus, Beirut and Paris, and her works from Your Eyes Are My Destiny (1962) to Beirut 75 and Beirut Nightmares. The article is a translation of the Arabic Wikipedia article (one family), and its categories file her under Syrian Muslims while its text names no religion or school for her."
