summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن غادة السمان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في دمشق سنة 1942 لأسرة دمشقية مرموقة محافظة، ودراستها ومسيرتها صحفية وروائية بين دمشق وبيروت وباريس وأعمالها من «عيناك قدري» (1962) إلى «بيروت 75» و«كوابيس بيروت»، وهي مترجمة عن مقالة ويكيبيديا العربية، وتصنّفها تصنيفاتها في المسلمين السوريين دون أن يسمّي نصّها دينًا أو مذهبًا لها."
  en: "English Wikipedia article on Ghada al-Samman; used for entity facts only. It gives her birth in Damascus in 1942 to a prominent, conservative Damascene family, her studies and her career as a journalist and novelist between Damascus, Beirut and Paris, and her works from Your Eyes Are My Destiny (1962) to Beirut 75 and Beirut Nightmares. The article is a translation of the Arabic Wikipedia article (one family), and its categories file her under Syrian Muslims while its text names no religion or school for her."
  es: "Artículo de la Wikipedia en inglés sobre Ghada al-Samman; utilizado únicamente para datos sobre la persona. Describe su nacimiento en Damasco en 1942 en el seno de una familia damascena prominente y conservadora, sus estudios y su carrera como periodista y novelista entre Damasco, Beirut y París, así como sus obras, desde «Tus ojos son mi destino» (1962) hasta «Beirut 75» y «Pesadillas de Beirut». El artículo es una traducción del artículo de la Wikipedia en árabe (una familia), y sus categorías la clasifican dentro de la categoría de «musulmanes sirios», aunque el texto no menciona ninguna religión ni escuela a la que pertenezca."
  fr: "L'article de Wikipédia en anglais consacré à Ghada al-Samman, utilisé uniquement à des fins d'information sur l'auteure, retrace sa naissance à Damas en 1942 au sein d'une famille damascène conservatrice et influente. Il évoque également ses études et sa carrière de journaliste et de romancière entre Damas, Beyrouth et Paris, ainsi que ses œuvres, de « Tes yeux sont mon destin » (1962) à « Beyrouth 75 » et « Cauchemars de Beyrouth ». Cet article est une traduction de l'article de Wikipédia en arabe (qui mentionne une seule famille) et la classe dans la catégorie « Musulmanes syriennes », sans toutefois préciser sa religion ni son école."
