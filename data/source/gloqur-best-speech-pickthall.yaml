  ar: "تدوينة لجوانا بينك، 2 يونيو 2023، عن طبعة منقّحة من ترجمة بكثال الإنجليزية للقرآن أصدرتها جمعية حسن القول في القاهرة، وجدتها الكاتبة في مايو 2023 على رف الكتب المجانية في جامع ابن طولون."
