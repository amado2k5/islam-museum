summary:
  ar: "تدوينة لجوانا بينك، 2 يونيو 2023، عن طبعة منقّحة من ترجمة بكثال الإنجليزية للقرآن أصدرتها جمعية حسن القول في القاهرة، وجدتها الكاتبة في مايو 2023 على رف الكتب المجانية في جامع ابن طولون."
  en: "A post by Johanna Pink, 2 June 2023, on a revised edition of Pickthall's English Qur'an translation issued by the Best Speech Society (Jam'iyyat Husn al-Qawl) of Cairo, which the author found on the free-book shelf of the Mosque of Ibn Tulun in May 2023."
  ur: "یوہانا پنک کی تحریر، 2 جون 2023، پکتھال کے انگریزی ترجمۂ قرآن کی نظرِ ثانی شدہ اشاعت پر جو قاہرہ کی جمعیت حسن القول نے جاری کی، اور جو مصنفہ کو مئی 2023 میں جامع ابن طولون میں مفت کتابوں کے شیلف پر ملی۔"
  es: "Publicación de Johanna Pink, del 2 de junio de 2023, sobre una edición revisada de la traducción al inglés del Corán de Pickthall, publicada por la Best Speech Society (Jam'iyyat Husn al-Qawl) de El Cairo, que la autora encontró en la sección de libros gratuitos de la Mezquita de Ibn Tulun en mayo de 2023."
  fr: "Article de Johanna Pink, 2 juin 2023, sur une édition révisée de la traduction anglaise du Coran par Pickthall, publiée par la Best Speech Society (Jam'iyyat Husn al-Qawl) du Caire, que l'auteure a trouvée sur l'étagère des livres gratuits de la mosquée d'Ibn Tulun en mai 2023."
  tr: "Joanna Pink'in 2 Haziran 2023 tarihli bir yazısı; yazarın Mayıs 2023'te İbn Tulun Camii'ndeki ücretsiz kitaplıklarda bulduğu Kahire'deki Hassan Al-Qawl Derneği tarafından yayımlanan Kur'an'ın İngilizce Bechthal çevirisinin gözden geçirilmiş baskısı hakkında."
  id: "Sebuah tulisan oleh Joanna Pink, 2 Juni 2023, tentang edisi revisi terjemahan bahasa Inggris Bechthal dari Al-Quran yang diterbitkan oleh Asosiasi Hassan Al-Qawl di Kairo, yang ditemukan penulis pada Mei 2023 di rak buku gratis di Masjid Ibn Tusun."
