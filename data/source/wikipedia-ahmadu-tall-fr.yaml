reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 21 June 1836 (the article names Sokoto as birthplace with a citation-needed flag, where the English article says he was born during his father's stay in the Sokoto Caliphate — the record follows the English framing and records the flag), son of El Hadj Omar Tall; ruled the Toucouleur Empire 1864–1890 (the English article's titles run to 1893 — recorded as a framing difference); Dinguiraye as his father's capital; his appointment as ruler of Ségou after its conquest; the unratified Treaty of Nango; Koundian (February 1889); Ségou's fall (6 April 1890 in this article); Nioro (1 January 1891), then Bandiagara (April 1893, where his brother Mounirou was killed); his son Aguibou installed over Massina; his flight east past Say, his ally Alboury Ndiaye of Jolof killed fighting for him, his settlement at Maykouki near Sokoto and his death there on 15 December 1897. The article narrates no religious affiliation of his own; his father's is his father's."
