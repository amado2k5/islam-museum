  ar: "مقالة ويكيبيديا العربية عن نوال المتوكل ⁦(مواليد 15 نيسان 1962)⁩، العدّاءة المغربية التي أحرزت ذهبية 400 متر حواجز في أولمبياد لوس أنجلوس 1984 لتصبح أول امرأة أفريقية وعربية تنال ميدالية ذهبية؛ تعرض مسيرتها في اللجنة الأولمبية الدولية ووزارة الشباب والرياضة، وتصفها في مواضع بأنها أول امرأة عربية ومسلمة وأفريقية تحقق إنجازها."
  en: "Arabic Wikipedia article on Nawal El Moutawakel (born 15 April 1962), the Moroccan runner whose 400 metres hurdles gold at the 1984 Los Angeles Olympics made her the first African and Arab woman to win an Olympic gold medal; it covers her career in the International Olympic Committee and the Ministry of Youth and Sports, and describes her in places as the first Arab, Muslim and African woman to achieve her feat."
