summary:
  ar: "مقالة ويكيبيديا العربية عن نوال المتوكل ⁦(مواليد 15 نيسان 1962)⁩، العدّاءة المغربية التي أحرزت ذهبية 400 متر حواجز في أولمبياد لوس أنجلوس 1984 لتصبح أول امرأة أفريقية وعربية تنال ميدالية ذهبية؛ تعرض مسيرتها في اللجنة الأولمبية الدولية ووزارة الشباب والرياضة، وتصفها في مواضع بأنها أول امرأة عربية ومسلمة وأفريقية تحقق إنجازها."
  en: "Arabic Wikipedia article on Nawal El Moutawakel (born 15 April 1962), the Moroccan runner whose 400 metres hurdles gold at the 1984 Los Angeles Olympics made her the first African and Arab woman to win an Olympic gold medal; it covers her career in the International Olympic Committee and the Ministry of Youth and Sports, and describes her in places as the first Arab, Muslim and African woman to achieve her feat."
  es: "Artículo en árabe de la Wikipedia sobre Nawal El Moutawakel (nacida el 15 de abril de 1962), la corredora marroquí cuyo oro en los 400 metros vallas en los Juegos Olímpicos de Los Ángeles de 1984 la convirtió en la primera mujer africana y árabe en ganar una medalla de oro olímpica; abarca su carrera en el Comité Olímpico Internacional y el Ministerio de Juventud y Deportes, y la describe en algunos pasajes como la primera mujer árabe, musulmana y africana en lograr tal hazaña."
  fr: "Article de Wikipédia en arabe sur Nawal El Moutawakel (née le 15 avril 1962), la coureuse marocaine dont la médaille d'or du 400 mètres haies aux Jeux olympiques de Los Angeles de 1984 a fait d'elle la première femme africaine et arabe à remporter une médaille d'or olympique; il couvre sa carrière au sein du Comité international olympique et du ministère de la Jeunesse et des Sports, et la décrit par endroits comme la première femme arabe, musulmane et africaine à réaliser cet exploit."
  ur: "Nawal El Moutawakel ⁦(پیدائش 15 اپریل 1962)⁩ پر عربی ویکیپیڈیا کا مضمون، مراکشی رنر جس نے 1984 کے لاس اینجلس اولمپکس میں 400 میٹر رکاوٹوں کے دوڑ میں سونے کا تمغہ جیتا، اسے اولمپک گولڈ میڈل جیتنے والی پہلی افریقی اور عرب خاتون بنا۔ یہ بین الاقوامی اولمپک کمیٹی اور نوجوانوں اور کھیلوں کی وزارت میں اس کے کیریئر کا احاطہ کرتا ہے، اور اسے جگہوں پر اس کا کارنامہ انجام دینے والی پہلی عرب، مسلم اور افریقی خاتون کے طور پر بیان کرتا ہے۔"
  tr: "1984 Los Angeles Olimpiyatları'nda 400 metre engellide altın madalya kazanan ve altın madalya kazanan ilk Afrikalı ve Arap kadın olan Faslı koşucu Nawal El Mutawakkil (d. 15 Nisan 1962) hakkında Arapça Wikipedia makalesi; kariyeri Uluslararası Olimpiyat Komitesi ve Gençlik ve Spor Bakanlığı tarafından sergilenmekte ve bazı yerlerde bu başarıya ulaşan ilk Arap, Müslüman ve Afrikalı kadın olarak tanımlanmaktadır."
  id: "Artikel Wikipedia bahasa Arab tentang Nawal El Mutawakkil (lahir 15 April 1962), pelari Maroko yang memenangkan emas di nomor 400 meter gawang pada Olimpiade Los Angeles 1984, menjadi wanita Afrika dan Arab pertama yang memenangkan medali emas; kariernya ditampilkan oleh Komite Olimpiade Internasional dan Kementerian Pemuda dan Olahraga, dan digambarkan di beberapa tempat sebagai wanita Arab, Muslim, dan Afrika pertama yang mencapai pencapaiannya."
