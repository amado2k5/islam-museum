summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن إيكا تجيبتا ويدجاجا، المولود في 27 شباط 1921 في تشيوانتشو بفوجيان والمتوفى في 26 كانون الثاني 2019 في منزله بمنتنغ في جاكرتا عن 97 عامًا، مؤسس مجموعة سينار ماس؛ تذكر طفولته بائعًا متجولًا في ماكاسار، ومسيرته في الزيوت والورق والبنوك، ومؤسسته الخيرية للمنح الدراسية."
  en: "Indonesian Wikipedia article on Eka Tjipta Widjaja, born 27 February 1921 in Quanzhou, Fujian, and died 26 January 2019 at his home in Menteng, Jakarta, aged 97, founder of the Sinar Mas Group; it records his childhood as a hawker in Makassar, his oils, paper and banking career, and his scholarship foundation."
  es: "Artículo de la Wikipedia en indonesio sobre Eka Tjipta Widjaja, nacido el 27 de febrero de 1921 en Quanzhou, Fujian, y fallecido el 26 de enero de 2019 en su casa de Menteng, Yakarta, a los 97 años, fundador del Grupo Sinar Mas; en él se relata su infancia como vendedor ambulante en Makassar, su trayectoria profesional en la industria petrolera, papelera y bancaria, y su fundación de becas."
  fr: "L'article de Wikipédia indonésien sur Eka Tjipta Widjaja, né le 27 février 1921 à Quanzhou, Fujian, et décédé le 26 janvier 2019 à son domicile de Menteng, Jakarta, à l'âge de 97 ans, fondateur du groupe Sinar Mas, relate son enfance de vendeur ambulant à Makassar, sa carrière dans les secteurs des huiles, du papier et de la banque, ainsi que sa fondation de bourses d'études."
  ur: "Eka Tjipta Widjaja پر انڈونیشیائی وکی پیڈیا کا مضمون، 27 فروری 1921 کو کوانژو، Fujian میں پیدا ہوا، اور 26 جنوری 2019 کو Menteng، Jakarta میں اپنے گھر پر انتقال کر گیا، عمر 97 سال، سنار ماس گروپ کے بانی؛ اس میں مکاسر میں ایک ہاکر کے طور پر اس کے بچپن، اس کے تیل، کاغذ اور بینکنگ کیریئر، اور اس کی اسکالرشپ فاؤنڈیشن کو ریکارڈ کیا گیا ہے۔"
