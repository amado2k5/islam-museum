  ar: "مقالة ويكيبيديا الإندونيسية عن إيكا تجيبتا ويدجاجا، المولود في 27 شباط 1921 في تشيوانتشو بفوجيان والمتوفى في 26 كانون الثاني 2019 في منزله بمنتنغ في جاكرتا عن 97 عامًا، مؤسس مجموعة سينار ماس؛ تذكر طفولته بائعًا متجولًا في ماكاسار، ومسيرته في الزيوت والورق والبنوك، ومؤسسته الخيرية للمنح الدراسية."
  en: "Indonesian Wikipedia article on Eka Tjipta Widjaja, born 27 February 1921 in Quanzhou, Fujian, and died 26 January 2019 at his home in Menteng, Jakarta, aged 97, founder of the Sinar Mas Group; it records his childhood as a hawker in Makassar, his oils, paper and banking career, and his scholarship foundation."
