  ar: "مقالة ويكيبيديا التركية عن أحمد جمال باشا؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها دينه «الإسلام»، وتروي ولايته على بغداد ونظارته للبحرية وقيادته في سوريا واغتياله في تفليس سنة 1922."
  en: "Turkish Wikipedia article on Ahmed Cemal Pasha; used for entity facts only. Its infobox gives his religion as Islam, and it recounts his governorship of Baghdad, his naval ministry, his command in Syria, and his assassination at Tiflis in 1922."
  es: "Artículo de la Wikipedia en turco sobre Ahmed Cemal Pasha; utilizado únicamente para obtener información sobre la persona. Su ficha informativa indica que su religión era el islam y relata su mandato como gobernador de Bagdad, su ministerio naval, su mando en Siria y su asesinato en Tiflis en 1922."
