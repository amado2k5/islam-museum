reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It agrees with the English article on his birth on 6 May 1872 at Midilli (Mytilene), his governorship of Baghdad from August 1911 to July 1912, his naval ministry from March 1914 to October 1918, his command of the Fourth Army in Syria and Palestine, his death sentence in absentia, his assassination at Tiflis on 21 July 1922, and his burial at the Karskapı Martyrs' Cemetery, Erzurum, his body brought there by Kâzım Karabekir. It names his Syrian bynames — Kasap Cemâl, El Cezzar and Seffah Cemâl — and calls him one of the architects of the Tehcir (deportation) law that moved the Armenians mostly to Syria. Its infobox gives his religion (dini) as Islam, generically; its text names no school and no order for him."
