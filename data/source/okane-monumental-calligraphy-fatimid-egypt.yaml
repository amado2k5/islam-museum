  fr: "Un chapitre sur le développement des inscriptions coufiques sur les monuments fatimides en Égypte et les questions qu'elles soulèvent: la nouveauté des inscriptions de façade, le but de la floraison et la signification du maintien du coufique."
  ur: "مصر میں فاطمی یادگاروں پر کوفک نوشتہ جات کی نشوونما اور ان کے اٹھائے جانے والے سوالات کا ایک باب: اگواڑے کے نوشتہ جات کی جدیدیت، فلوریشن کا مقصد، اور کوفک کو برقرار رکھنے کا مطلب۔"
  tr: "Mısır'daki Fatımi binaları üzerine Kufi yazıtlarının gelişimi ve ortaya çıkardığı sorular üzerine bir bölüm: cephelerde yazının kökeni, yazıtın amacı ve Kufiç'e bağlılığın önemi."
  id: "Sebuah bab tentang perkembangan prasasti Kufik pada bangunan Fatimiyah di Mesir dan pertanyaan-pertanyaan yang ditimbulkannya: asal-usul tulisan pada fasad, tujuan inskripsi, dan makna kepatuhan pada Kufik."
