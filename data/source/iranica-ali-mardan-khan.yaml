reliability_note: "A scholarly encyclopedia life, independent of Wikipedia. Read in full on 1 November 2026. It heads the life '(d. Lahore, 1657)', calls his early years obscure, details the 1638 surrender out of his own chronicle citations (Lahori, Kanbu and 'Enayat Khan — the last two being this wave's own subjects), dates his fatal illness to the summer of 1657, and records that his son Ibrahim brought his body to Lahore for burial in his mother's tomb. It names no confession for him, and is used here for the death-date and death-place rivalries preserved in the person record."
