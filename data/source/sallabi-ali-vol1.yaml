summary:
  ar: "الجزء الأول من دراسة للصلابي في سيرة علي بن أبي طالب من الميلاد إلى الاستشهاد، يتناول نسبه وأسرته وإسلامه وأعماله في مكة والمدينة وعهد الخلافة الراشدة الأولى. مؤلفه من علماء أهل السنة والجماعة، ويكتب من منهجهم ويعلن ذلك في مقدمته، ويتضمن ردوداً على الروايات التي يراها الكتاب ضعيفة أو موضوعة، ويخصّص فصلاً لنقد ما يعدّه انحرافاً شيعياً رافضياً. تُستشهد به في المتحف بصيغة {cite:sallabi-ali-vol1 p.N} حيث N رقم صفحة PDF للنسخة الممسوحة."
  en: "Volume one of Ali Muhammad al-Sallabi's study of the life of Ali ibn Abi Talib from birth to martyrdom: his lineage, family, Islam, deeds in Mecca and Medina, and the early Rashidun period. The author writes from the Sunni tradition, declares that method in his introduction, rejects narrations he judges weak or fabricated, and gives a long section to what he calls Rafidi (Shi'i) deviation. Cited as {cite:sallabi-ali-vol1 p.N}, N being the PDF page of the scanned copy."
title: "أسمى المطالب في سيرة علي بن أبي طالب: شخصيته وعصره (الجزء الأول)"
