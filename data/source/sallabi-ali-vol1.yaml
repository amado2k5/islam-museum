label: { ar: "أسمى المطالب في سيرة علي بن أبي طالب: شخصيته وعصره — الجزء الأول", en: "Asma al-Matalib fi Sirat Ali ibn Abi Talib, vol. 1 — Ali Muhammad al-Sallabi" }
summary:
  ar: "الجزء الأول من دراسة للصلابي في سيرة علي بن أبي طالب من الميلاد إلى الاستشهاد، يتناول نسبه وأسرته وإسلامه وأعماله في مكة والمدينة وعهد الخلافة الراشدة الأولى. مؤلفه من علماء أهل السنة والجماعة، ويكتب من منهجهم ويعلن ذلك في مقدمته، ويتضمن ردوداً على الروايات التي يراها الكتاب ضعيفة أو موضوعة، ويخصّص فصلاً لنقد ما يعدّه انحرافاً شيعياً رافضياً. تُستشهد به في المتحف بصيغة {cite:sallabi-ali-vol1 p.N} حيث N رقم صفحة PDF للنسخة الممسوحة."
  en: "Volume one of Ali Muhammad al-Sallabi's study of the life of Ali ibn Abi Talib from birth to martyrdom: his lineage, family, Islam, deeds in Mecca and Medina, and the early Rashidun period. The author writes from the Sunni tradition, declares that method in his introduction, rejects narrations he judges weak or fabricated, and gives a long section to what he calls Rafidi (Shi'i) deviation. Cited as {cite:sallabi-ali-vol1 p.N}, N being the PDF page of the scanned copy."
  es: "Volumen uno del estudio de Ali Muhammad al-Sallabi sobre la vida de Ali ibn Abi Talib desde su nacimiento hasta su martirio: su linaje, familia, el islam, sus hazañas en La Meca y Medina, y el período inicial de los Rashidun. El autor escribe desde la tradición suní, declara este método en su introducción, rechaza las narraciones que considera débiles o inventadas, y dedica una extensa sección a lo que denomina desviación rafidí (chií). Citado como {cite:sallabi-ali-vol1 pN}, donde N es la página del PDF de la copia escaneada."
  fr: "Le premier volume de l'étude d'Ali Muhammad al-Sallabi sur la vie d'Ali ibn Abi Talib, de sa naissance à son martyre, aborde sa lignée, sa famille, sa conversion à l'islam, ses actions à La Mecque et à Médine, ainsi que ses débuts parmi les Rashidun. L'auteur s'appuie sur la tradition sunnite, qu'il expose dans son introduction. Il rejette les récits qu'il juge faibles ou apocryphes et consacre une longue section à ce qu'il nomme la déviation rafidite (chiite). Référence: {cite:sallabi-ali-vol1 pN}, N correspondant à la page du PDF numérisé."
  ur: "علی محمد السلبی کا علی ابن ابی طالب کی پیدائش سے شہادت تک کی زندگی کا مطالعہ: ان کا سلسلہ نسب، خاندان، اسلام، مکہ اور مدینہ میں اعمال، اور ابتدائی دور راشدین۔ مصنف سنی روایت سے لکھتے ہیں، اپنے تعارف میں اس طریقہ کا اعلان کرتے ہیں، جن روایات کو ضعیف یا من گھڑت قرار دیتے ہیں، ان کو رد کرتے ہیں، اور رافضی ⁦(شیعی)⁩ انحراف کا ایک طویل حصہ بیان کرتے ہیں۔ اسکین شدہ کاپی کا پی ڈی ایف صفحہ ہونے کے ناطے N کو {cite:sallabi-ali-vol1 pN} کے طور پر حوالہ دیا گیا ہے۔"
  tr: "El-Sallabi'nin Ali bin Ebi Talib'in doğumdan şehitliğe kadar olan biyografisi üzerine yaptığı çalışmanın ilk bölümü; soyunu, ailesi, İslam ve Mekke, Medine ile Birinci Doğru Rehberli Halifelik dönemindeki eylemlerini kapsar. Yazarı, Ehl-el-Sünnet ve el-Cema'ah alimidir; metodolojilerinden yararlanarak önsözünde bunu açıklar; kitabın zayıf veya uydurma bulduğu rivayetlere yanıtlar da dahil eder ve bir bölüm ayırarak Şii sapması ve Rafidhi olarak gördüğü şeyleri eleştirir. Müzede {cite:sallabi-ali-cilt 1 s.N} formatında atıfta bulunur; burada N, taranmış kopyanın PDF sayfa numarasıdır."
  id: "Bagian pertama studi Al-Sallabi tentang biografi Ali ibn Abi Talib dari lahir hingga syahid, mencakup garis keturunannya, keluarga, Islam, dan perbuatannya di Mekah, Madinah, serta era Khalifah Pertama yang Benar-benar Dipandu. Penulisnya adalah seorang ulama Ahl al-Sunnah wa al-Jama'ah, menulis berdasarkan metodologi mereka dan mengumumkannya dalam pengantarnya, termasuk tanggapan terhadap narasi yang dianggap lemah atau dibuat-buat oleh buku ini, serta mendedikasikan satu bab untuk mengkritik apa yang dianggapnya sebagai penyimpangan Syiah dan Rafidhi. Mencantumkannya di museum dalam format {cite:sallabi-ali-vol1 p.N}, di mana N adalah nomor halaman PDF dari salinan hasil scan."
