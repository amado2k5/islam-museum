summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد أيوب؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في أكتوبر 1952 ⁦(1372هـ)⁩ بمكة ووفاته في 16 أبريل 2016 بالمدينة، وإمامته للمسجد النبوي بين 1990 و1997 وفي رمضان 2015، ومنصبه في التفسير بالجامعة الإسلامية بالمدينة؛ ويذكر نصها في جملة واحدة أنه اتبع المذهب الحنفي مستشهدة بمقالة واحدة من آسيا تايمز سنة 2004، ويكرر صندوقها الحنفي بالاستشهاد نفسه."
  en: "English Wikipedia article on Muhammad Ayyub; used for entity facts only. It gives his birth in October 1952 (1372 AH) at Mecca and death on 16 April 2016 at Medina, his imamate of the Prophet's Mosque from 1990 to 1997 and again for Ramadan 2015, and his tafsir post at the Islamic University of Madinah; its text states in one sentence that he followed the Hanafi school, citing a single 2004 Asia Times article, and its infobox repeats Hanafi on that citation."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad Ayyub; utilizado únicamente para datos sobre la persona. Indica su nacimiento en octubre de 1952 (1372 AH) en La Meca y su fallecimiento el 16 de abril de 2016 en Medina, su imanato de la Mezquita del Profeta de 1990 a 1997 y nuevamente durante el Ramadán de 2015, y su puesto de tafsir en la Universidad Islámica de Medina; su texto afirma en una sola frase que siguió la escuela Hanafi, citando un único artículo del Asia Times de 2004, y su recuadro informativo repite \"Hanafi\" en esa cita."
  fr: "Article de Wikipédia en anglais sur Muhammad Ayyub; utilisé uniquement pour les informations le concernant. Il indique sa naissance en octobre 1952 (1372 AH) à La Mecque et son décès le 16 avril 2016 à Médine, son imamat de la Mosquée du Prophète de 1990 à 1997 et de nouveau pendant le Ramadan 2015, ainsi que son poste de tafsir à l’Université islamique de Médine; son texte affirme en une phrase qu’il suivait l’école hanafite, citant un article de l’Asia Times de 2004, et son infobox reprend la mention « hanafite » dans cette citation."
  ur: "محمد ایوب پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش اکتوبر 1952 ⁦(1372ھ)⁩ میں مکہ میں ہوئی اور وفات 16 اپریل 2016 کو مدینہ میں، 1990 سے 1997 تک مسجد نبوی کی امامت اور پھر رمضان 2015 تک، اور مدینہ کی اسلامی یونیورسٹی میں ان کی تفسیر کا عہدہ؛ اس کا متن ایک جملے میں کہتا ہے کہ اس نے 2004 کے ایشیا ٹائمز کے ایک مضمون کا حوالہ دیتے ہوئے حنفی مکتب کی پیروی کی، اور اس کا انفو باکس اس حوالہ پر حنفی کو دہراتا ہے۔"
