summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد أيوب؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في أكتوبر 1952 (1372هـ) بمكة ووفاته في 16 أبريل 2016 بالمدينة، وإمامته للمسجد النبوي بين 1990 و1997 وفي رمضان 2015، ومنصبه في التفسير بالجامعة الإسلامية بالمدينة؛ ويذكر نصها في جملة واحدة أنه اتبع المذهب الحنفي مستشهدة بمقالة واحدة من آسيا تايمز سنة 2004، ويكرر صندوقها الحنفي بالاستشهاد نفسه."
  en: "English Wikipedia article on Muhammad Ayyub; used for entity facts only. It gives his birth in October 1952 (1372 AH) at Mecca and death on 16 April 2016 at Medina, his imamate of the Prophet's Mosque from 1990 to 1997 and again for Ramadan 2015, and his tafsir post at the Islamic University of Madinah; its text states in one sentence that he followed the Hanafi school, citing a single 2004 Asia Times article, and its infobox repeats Hanafi on that citation."
