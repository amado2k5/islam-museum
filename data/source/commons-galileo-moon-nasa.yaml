  ur: "کامنز کی فائل پیج برائے «Full moon.png»: 7 دسمبر 1992 کو مشتری کے سفر میں گیلیلیو خلائی جہاز کی لی گئی مکمل چاند کی تصویر، NASA نے اسے پبلک ڈومین میں جاری کیا؛ «ضوء القمر» میں ابن الہیثم کے زیر بحث چاند کی سطح کے بصری سیاق کے طور پر دکھائی گئی۔"
  es: "Página de archivo de Wikimedia Commons para 'Full moon.png': una imagen de la luna llena tomada por la nave espacial Galileo el 7 de diciembre de 1992 en ruta a Júpiter, publicada por la NASA en el dominio público; se muestra como contexto visual para la superficie lunar que Ibn al-Haytham analizó en 'A la luz de la luna'."
  fr: "Page Commons du fichier « Full moon.png »: une image de la pleine lune prise par le vaisseau spatial Galileo le 7 décembre 1992 en route vers Jupiter, publiée par la NASA dans le domaine public; présentée comme contexte visuel de la surface lunaire dont Ibn al-Haytham parle dans « Sur la lumière de la lune »."
