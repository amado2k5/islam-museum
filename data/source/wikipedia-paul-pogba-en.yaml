  ar: "مقالة ويكيبيديا الإنجليزية عن بول بوغبا؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في لانيي سور مارن في 15 مارس 1993، ومسيرته في مانشستر يونايتد ويوفنتوس ثم مانشستر يونايتد من جديد وموناكو، وانتقاله القياسي عالميًا سنة 2016، وفوزه بكأس العالم 2018، وإيقافه بسبب المنشطات (أربع سنوات في فبراير 2024 خُفّضت إلى 18 شهرًا عند الاستئناف وانتهت في مارس 2025) وفسخ يوفنتوس عقده سنة 2024، وتصفه بأنه مسلم ممارس دون تسمية أي مذهب له."
  en: "English Wikipedia article on Paul Pogba; used for entity facts only. It records his birth in Lagny-sur-Marne on 15 March 1993, his career at Manchester United, Juventus, Manchester United again and Monaco, the then world-record 2016 transfer, the 2018 World Cup win, his doping ban (four years in February 2024, reduced to 18 months on appeal, lifted in March 2025) and Juventus's release of him in 2024, and describes him as a practising Muslim, naming no school for him."
