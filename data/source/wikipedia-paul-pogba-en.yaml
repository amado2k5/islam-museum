summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بول بوغبا؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في لانيي سور مارن في 15 مارس 1993، ومسيرته في مانشستر يونايتد ويوفنتوس ثم مانشستر يونايتد من جديد وموناكو، وانتقاله القياسي عالميًا سنة 2016، وفوزه بكأس العالم 2018، وإيقافه بسبب المنشطات ⁦(أربع سنوات في فبراير 2024 خُفّضت إلى 18 شهرًا عند الاستئناف وانتهت في مارس 2025)⁩ وفسخ يوفنتوس عقده سنة 2024، وتصفه بأنه مسلم ممارس دون تسمية أي مذهب له."
  en: "English Wikipedia article on Paul Pogba; used for entity facts only. It records his birth in Lagny-sur-Marne on 15 March 1993, his career at Manchester United, Juventus, Manchester United again and Monaco, the then world-record 2016 transfer, the 2018 World Cup win, his doping ban (four years in February 2024, reduced to 18 months on appeal, lifted in March 2025) and Juventus's release of him in 2024, and describes him as a practising Muslim, naming no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Paul Pogba; utilizado únicamente para datos sobre la persona. Registra su nacimiento en Lagny-sur-Marne el 15 de marzo de 1993, su carrera en el Manchester United, la Juventus, nuevamente en el Manchester United y el Mónaco, el traspaso récord mundial de 2016, la victoria en la Copa Mundial de 2018, su sanción por dopaje (cuatro años en febrero de 2024, reducida a 18 meses en apelación, levantada en marzo de 2025) y su liberación por parte de la Juventus en 2024, y lo describe como musulmán practicante, sin mencionar ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en anglais sur Paul Pogba; utilisé uniquement pour les informations factuelles. Il relate sa naissance à Lagny-sur-Marne le 15 mars 1993, sa carrière à Manchester United, à la Juventus, de nouveau à Manchester United et à Monaco, le transfert record de 2016, la victoire à la Coupe du monde 2018, sa suspension pour dopage (quatre ans en février 2024, réduite à 18 mois en appel, levée en mars 2025) et son départ de la Juventus en 2024. Il est décrit comme un musulman pratiquant, sans mentionner d'école."
  ur: "پال پوگبا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 15 مارچ 1993 کو لگنی-سر-مارنے میں اس کی پیدائش، مانچسٹر یونائیٹڈ، جووینٹس، مانچسٹر یونائیٹڈ دوبارہ اور موناکو میں اس کا کیریئر، اس وقت کا عالمی ریکارڈ 2016 کی منتقلی، 2018 کا ورلڈ کپ جیت، اس کی ڈوپنگ پابندی ⁦(فروری 2024 میں چار سال، اپیل کو کم کرکے 20 مارچ کو 18 ماہ میں ہٹا دیا گیا)⁩ 2024 میں، اور اسے ایک عملی مسلمان کے طور پر بیان کیا، اس کے لیے کسی اسکول کا نام نہیں لیا۔"
