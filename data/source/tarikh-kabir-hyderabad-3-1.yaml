label:
  ar: "التاريخ الكبير — البخاري، طبعة دائرة المعارف العثمانية بحيدر آباد، القسم الأول من الجزء الثالث (1377هـ/1958م)"
  en: "al-Tarikh al-Kabir — al-Bukhari, Da'irat al-Ma'arif al-Uthmaniyya ed., Hyderabad, vol. 3 part 1 (1958)"
  ur: "التاریخ الکبیر — امام بخاری، دائرۃ المعارف العثمانیہ حیدرآباد، جلد 3 حصہ اول (1958ء)"
summary:
  ar: "القسم الأول من الجزء الثالث من «التاريخ الكبير» لأبي عبد الله محمد بن إسماعيل البخاري (ت 256هـ)، من «عبد الله» إلى «عبيد بن علي»، مصحّحاً عن النسخة القديمة الوحيدة المحفوظة في مكتبة أحمد الثالث بطوبقابي سراي في إستانبول (رقم 2969)، الطبعة الأولى، دائرة المعارف العثمانية بحيدر آباد الدكن، السلسلة الجديدة 1/13، بإعانة وزارة المعارف للحكومة الهندية، 1377هـ/1958م، مع حواشي المصحّحين التي تقابل النص بالجرح والتعديل لابن أبي حاتم وكتب الرجال."
  en: "Volume 3 part 1 of al-Tarikh al-Kabir by Abu Abd Allah Muhammad ibn Isma'il al-Bukhari (d. 256 AH), from 'Abd Allah' to 'Ubayd ibn Ali', edited by the Bureau from the unique old manuscript in the Ahmed III library, Topkapi Palace, Istanbul (no. 2969); first edition, Da'irat al-Ma'arif al-Uthmaniyya, Hyderabad (Deccan), new series 1/13, under the auspices of the Ministry of Education of the Government of India, 1377 AH / 1958, with the editors' footnotes comparing the text with Ibn Abi Hatim's al-Jarh wa-l-Ta'dil and other rijal books."
  ur: "امام ابو عبد اللہ محمد بن اسماعیل بخاری (م 256ھ) کی «التاریخ الکبیر» کی تیسری جلد کا پہلا حصہ، «عبد اللہ» سے «عبید بن علی» تک، استنبول کے توپ قاپی سرای میں احمد ثالث کتب خانے کے واحد قدیم نسخے (نمبر 2969) سے تصحیح شدہ؛ پہلا ایڈیشن، دائرۃ المعارف العثمانیہ حیدرآباد دکن، نیا سلسلہ 1/13، حکومتِ ہند کی وزارتِ تعلیم کے تعاون سے، 1377ھ/1958ء، مصححین کے حواشی کے ساتھ جو متن کا ابن ابی حاتم کی الجرح والتعدیل اور دیگر کتبِ رجال سے مقابلہ کرتے ہیں۔"
