summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي‌أكبر دهخدا؛ تُستخدم لوقائع الكيان فقط. تعطي سنواته 1879–9 مارس 1956، ونشره «صور اسرافیل» مع ميرزا جهانگیر خان وعموده الساخر «چرند و پرند»، ونيابته في المجلس، و«لغت‌نامه» أكبر معاجم الفارسية و«امثال و حکم»."
  en: "English Wikipedia article on Ali-Akbar Dehkhoda; used for entity facts only. It gives his years as 1879 to 9 March 1956, his Sur-e Esrafil newspaper with Mirza Jahangir Khan and its Charand-o-Parand satirical column, his Majlis seats, and the Loghat-nameh, the largest Persian dictionary, and Amsal o Hekam."
  es: "Artículo de la Wikipedia en inglés sobre Ali-Akbar Dehkhoda; utilizado únicamente para datos sobre la persona. Indica que vivió desde 1879 hasta el 9 de marzo de 1956, su periódico Sur-e Esrafil con Mirza Jahangir Khan y su columna satírica Charand-o-Parand, sus escaños en el Majlis, el Loghat-nameh, el diccionario persa más extenso, y el Amsal o Hekam."
  fr: "Article de Wikipédia en anglais sur Ali-Akbar Dehkhoda; utilisé uniquement pour les informations relatives à l'entité. Il indique ses années de règne (1879 – 9 mars 1956), son journal Sur-e Esrafil avec Mirza Jahangir Khan et sa rubrique satirique Charand-o-Parand, ses sièges au Majlis, le Loghat-nameh, le plus grand dictionnaire persan, et l'Amsal o Hekam."
