  ar: "مقالة ويكيبيديا الإنجليزية عن علي‌أكبر دهخدا؛ تُستخدم لوقائع الكيان فقط. تعطي سنواته 1879–9 مارس 1956، ونشره «صور اسرافیل» مع ميرزا جهانگیر خان وعموده الساخر «چرند و پرند»، ونيابته في المجلس، و«لغت‌نامه» أكبر معاجم الفارسية و«امثال و حکم»."
  en: "English Wikipedia article on Ali-Akbar Dehkhoda; used for entity facts only. It gives his years as 1879 to 9 March 1956, his Sur-e Esrafil newspaper with Mirza Jahangir Khan and its Charand-o-Parand satirical column, his Majlis seats, and the Loghat-nameh, the largest Persian dictionary, and Amsal o Hekam."
