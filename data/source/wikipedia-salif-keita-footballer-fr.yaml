summary:
  ar: "مقالة ويكيبيديا الفرنسية عن ساليف كيتا لاعب كرة القدم (1946–2023)؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في 6 ديسمبر 1946 بباماكو ووفاته فيها في 2 سبتمبر 2023، ومسيرته مع سانت إتيان بطلًا لفرنسا ثلاث مرات، وأول كرة ذهبية أفريقية سنة 1970. لا تذكر ديانته في أي موضع."
  en: "French Wikipedia article on Salif Keïta the footballer (1946–2023); used for entity facts only. It records his birth on 6 December 1946 at Bamako and his death there on 2 September 2023, his Saint-Étienne career with three French titles, and the first African Ballon d'Or in 1970. It makes no statement of his religion anywhere."
  es: "Artículo de la Wikipedia en francés sobre el futbolista Salif Keïta (1946-2023); utilizado únicamente para datos sobre la persona. Registra su nacimiento el 6 de diciembre de 1946 en Bamako y su fallecimiento allí el 2 de septiembre de 2023, su trayectoria en el Saint-Étienne con tres títulos de liga francesa y el primer Balón de Oro africano en 1970. No menciona su religión en ningún momento."
  fr: "Article de Wikipédia en français sur Salif Keïta, le footballeur (1946-2023); utilisé uniquement pour les informations le concernant. Il mentionne sa naissance le 6 décembre 1946 à Bamako et son décès dans cette même ville le 2 septembre 2023, sa carrière à Saint-Étienne, couronnée par trois titres de champion de France, et le premier Ballon d’Or africain en 1970. Aucune mention n’est faite de sa religion."
  ur: "فرانسیسی ویکیپیڈیا کا مضمون سلیف کیٹا فٹبالر پر (1946–2023)؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 6 دسمبر 1946 کو باماکو میں اس کی پیدائش اور 2 ستمبر 2023 کو اس کی موت، تین فرانسیسی ٹائٹلز کے ساتھ اس کا سینٹ-ایٹین کیریئر، اور 1970 میں پہلا افریقی بیلن ڈی آر درج ہے۔ اس میں کہیں بھی اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Salif Keita, futbolcu (1946–2023) hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 6 Aralık 1946'da Bamako'da doğmasını ve 2 Eylül 2023'te orada vefatını, Saint-Étienne ile üç kez Fransa şampiyonu olarak kariyerini ve 1970'te ilk Afrika Ballon d'Or'unu anlatır. Dini hiçbir yerde bahsedilmemektedir."
  id: "Artikel Wikipedia Prancis tentang Salif Keita, pesepakbola (1946–2023); digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 6 Desember 1946 di Bamako dan kematiannya di sana pada 2 September 2023, kariernya bersama Saint-Étienne sebagai juara Prancis tiga kali, dan Ballon d'Or Afrika pertama pada tahun 1970. Agamanya tidak disebutkan di mana pun."
