  ar: "مقالة ويكيبيديا الفرنسية عن ساليف كيتا لاعب كرة القدم (1946–2023)؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في 6 ديسمبر 1946 بباماكو ووفاته فيها في 2 سبتمبر 2023، ومسيرته مع سانت إتيان بطلًا لفرنسا ثلاث مرات، وأول كرة ذهبية أفريقية سنة 1970. لا تذكر ديانته في أي موضع."
