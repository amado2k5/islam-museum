summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الحميد الدبيبة؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في مصراتة نحو سنة 1959، وقيادته شركة ليبيا للاستثمار والتنمية في عهد القذافي، وتأسيسه حراك ليبيا المستقبل سنة 2020، واختياره من ملتقى الحوار السياسي الليبي في فبراير 2021 وتولّيه رئاسة حكومة الوحدة الوطنية في 15 مارس 2021 خلفًا لفايز السراج، والطعن في شرعيته منذ 2022، وادّعاءه ماجستير من جامعة تورونتو نفتْه الجامعة. لا يذكر متنها دينه؛ ويعطي وصفها المختصر وفئتها سنة 1958 خلافًا لمتنها."
  en: "English Wikipedia article on Abdul Hamid Dbeibeh (filed under the title 'Abdul Hamid AL Dabiba'); used for entity facts only. It gives his birth at Misrata 'around 1959', his leadership of the Libyan Investment and Development Company under Gaddafi, his founding of the Libya Future movement in 2020, his selection by the Libyan Political Dialogue Forum in February 2021 and his assumption of the premiership of the Government of National Unity on 15 March 2021, succeeding Fayez al-Sarraj, the challenges to his legitimacy from 2022, and his claimed University of Toronto master's degree, which the university has denied. It makes no statement of his religion in its text; its short description and birth category file 1958 against the body's 1959."
  es: "Artículo de la Wikipedia en inglés sobre Abdul Hamid Dbeibeh (archivado bajo el título 'Abdul Hamid AL Dabiba'); utilizado únicamente para datos sobre la entidad. Indica que nació en Misrata 'alrededor de 1959', su liderazgo de la Compañía Libia de Inversión y Desarrollo bajo Gaddafi, la fundación del movimiento Futuro de Libia en 2020, su selección por el Foro de Diálogo Político Libio en febrero de 2021 y su asunción del cargo de primer ministro del Gobierno de Unidad Nacional el 15 de marzo de 2021, sucediendo a Fayez al-Sarraj, los desafíos a su legitimidad desde 2022 y su supuesta maestría de la Universidad de Toronto, que la universidad ha negado. No menciona su religión en el texto; su breve descripción y la categoría de nacimiento del archivo indican 1958 frente a 1959 en el organismo."
  fr: "L'article de Wikipédia en anglais consacré à Abdul Hamid Dbeibeh (intitulé « Abdul Hamid AL Dabiba ») est utilisé uniquement à des fins d'information sur l'entité. Il mentionne sa naissance à Misrata « vers 1959 », son rôle à la tête de la Libyan Investment and Development Company sous Kadhafi, la fondation du mouvement Libya Future en 2020, sa sélection par le Forum de dialogue politique libyen en février 2021 et sa prise de fonction comme Premier ministre du Gouvernement d'union nationale le 15 mars 2021, succédant à Fayez al-Sarraj. L'article évoque également les contestations de sa légitimité à partir de 2022 et son prétendu master de l'Université de Toronto, que cette dernière a démenti. Il ne fait aucune mention de sa religion; sa brève description et sa date de naissance indiquent 1958, alors que l'organisme mentionne 1959."
  ur: "عبدالحمید دبیبہ پر انگریزی ویکیپیڈیا کا مضمون ⁦('عبدالحمید ال دبیبہ' کے عنوان سے دائر کیا گیا)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1959 کے آس پاس مصراتہ میں ان کی پیدائش، قذافی کی قیادت میں لیبیا انویسٹمنٹ اینڈ ڈویلپمنٹ کمپنی کی قیادت، 2020 میں لیبیا فیوچر موومنٹ کی بنیاد، فروری 2021 میں لیبیا پولیٹیکل ڈائیلاگ فورم کے ذریعے ان کا انتخاب اور 15 مارچ کو قومی اتحاد کی حکومت کی صدارت کا عہدہ سنبھالا۔ السراج، 2022 سے اس کی قانونی حیثیت کو درپیش چیلنجز، اور اس نے یونیورسٹی آف ٹورنٹو کی ماسٹر ڈگری کا دعویٰ کیا، جس کی یونیورسٹی نے تردید کی ہے۔ اس کے متن میں اس کے مذہب کا کوئی بیان نہیں ہے۔ اس کی مختصر تفصیل اور پیدائش کے زمرے کی فائل 1958 جسم کے 1959 کے خلاف۔"
