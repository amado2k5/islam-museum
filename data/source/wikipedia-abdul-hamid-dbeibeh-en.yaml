summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الحميد الدبيبة؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في مصراتة نحو سنة 1959، وقيادته شركة ليبيا للاستثمار والتنمية في عهد القذافي، وتأسيسه حراك ليبيا المستقبل سنة 2020، واختياره من ملتقى الحوار السياسي الليبي في فبراير 2021 وتولّيه رئاسة حكومة الوحدة الوطنية في 15 مارس 2021 خلفًا لفايز السراج، والطعن في شرعيته منذ 2022، وادّعاءه ماجستير من جامعة تورونتو نفتْه الجامعة. لا يذكر متنها دينه؛ ويعطي وصفها المختصر وفئتها سنة 1958 خلافًا لمتنها."
  en: "English Wikipedia article on Abdul Hamid Dbeibeh (filed under the title 'Abdul Hamid AL Dabiba'); used for entity facts only. It gives his birth at Misrata 'around 1959', his leadership of the Libyan Investment and Development Company under Gaddafi, his founding of the Libya Future movement in 2020, his selection by the Libyan Political Dialogue Forum in February 2021 and his assumption of the premiership of the Government of National Unity on 15 March 2021, succeeding Fayez al-Sarraj, the challenges to his legitimacy from 2022, and his claimed University of Toronto master's degree, which the university has denied. It makes no statement of his religion in its text; its short description and birth category file 1958 against the body's 1959."
