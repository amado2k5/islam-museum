reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth in 1643 and his death in 1709, his upbringing at the Moscow court as Tsarevich Nicholas Davidovich, the shah's 1674 demand that he apostatize to Islam as the price of confirmation — which it says he first refused, citing Alexander II of Kakheti's oath to Feodor I of Russia — and his later conversion to Islam under the name Nazar Ali Khan (a conversion the same narrative dates to 1676) before his installation as king of Kartli in 1688; it records his removal to Kakheti in 1703 and his death at the Persian capital in 1709. It names no branch or school of Islam for the king himself. Checked 1 November 2026."
