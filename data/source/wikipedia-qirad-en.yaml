summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن القراض؛ لوقائع الكيان فقط: عقد يعهد فيه مستثمرون برأس مال لوكيل يتاجر به ويعيد الأصل وحصة متفقاً من الربح، لا مسؤولية للعامل عن الخسارة، اسم مقارضة عند الحنفية والحنابلة، عدم وروده في القرآن مع أحاديث تنسبه للنبي والصحابة عند أودوفيتش ⁦(ص170)⁩، تفاصيل المطوع والمجلة، شبهه التام بالكومندا مع عدم إمكان الجزم بالتحول، وشبه الأورطوق المغولي."
  en: "English Wikipedia article on the qirad; entity facts only: the contract in which investors entrust capital to an agent who trades and returns principal plus an agreed profit share, the agent's non-liability for loss, the Hanafi-Hanbali name muqarada, its absence from the Qur'an alongside traditions attributing it to the Prophet and companions (Udovitch p. 170), Muwatta and Majalla technicalities, its near-identity to the commenda with transformation unprovable, and the resembling Mongol ortoq."
