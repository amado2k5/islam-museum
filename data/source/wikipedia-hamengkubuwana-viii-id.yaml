summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن هامينغكوبوانا الثامن؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في الميلاد والوفاة وفترة الحكم، وتضيف رواية بديلة لمكان وفاته (في القطار عند واتس أو في مستشفى بمدينة يوجياكارتا بعد وعكة في القطار)، وتصف دعمه لأحمد دحلان بأنه صورة من ولائه للإسلام، وتسرد زوجاته وأبناءه الأربعة والعشرين."
  en: "Indonesian Wikipedia article on Hamengkubuwana VIII; used for entity facts only. It agrees with the English article on his birth, death and reign, adds a variant account of the place of his death (in the train near Wates, or in hospital at Yogyakarta after falling ill on the train), describes his support for Ahmad Dahlan as a form of his loyalty to Islam, and lists his wives and twenty-four sons."
