reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by revision id through the MediaWiki API with the returned id asserted equal. Its infobox religion field is deliberately left blank (an editorial comment states the religion/ethnicity fields are disabled), and its text names no school of Islam for him; the one religious statement is that his support for Ahmad Dahlan's Muhammadiyah was 'a form of his loyalty to Islam', which names no school. Its account of the death place differs in detail from the English article, and both versions are recorded."
