summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن هامينغكوبوانا الثامن؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في الميلاد والوفاة وفترة الحكم، وتضيف رواية بديلة لمكان وفاته ⁦(في القطار عند واتس أو في مستشفى بمدينة يوجياكارتا بعد وعكة في القطار)⁩، وتصف دعمه لأحمد دحلان بأنه صورة من ولائه للإسلام، وتسرد زوجاته وأبناءه الأربعة والعشرين."
  en: "Indonesian Wikipedia article on Hamengkubuwana VIII; used for entity facts only. It agrees with the English article on his birth, death and reign, adds a variant account of the place of his death (in the train near Wates, or in hospital at Yogyakarta after falling ill on the train), describes his support for Ahmad Dahlan as a form of his loyalty to Islam, and lists his wives and twenty-four sons."
  es: "Artículo de la Wikipedia en indonesio sobre Hamengkubuwana VIII; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento, muerte y reinado, añade una versión alternativa del lugar de su muerte (en el tren cerca de Wates o en un hospital de Yogyakarta tras enfermar en el tren), describe su apoyo a Ahmad Dahlan como una muestra de su lealtad al Islam y enumera a sus esposas y veinticuatro hijos."
  fr: "Article de Wikipédia indonésien sur Hamengkubuwana VIII; utilisé uniquement pour les informations factuelles. Il concorde avec l’article anglais concernant sa naissance, sa mort et son règne, ajoute une variante quant au lieu de son décès (dans le train près de Wates ou à l’hôpital de Yogyakarta après un malaise survenu dans le train), décrit son soutien à Ahmad Dahlan comme une preuve de sa loyauté envers l’islam et énumère ses épouses et ses vingt-quatre fils."
  ur: "ہمنگکوبوانا VIII پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش، موت اور دور حکومت پر انگریزی مضمون سے متفق ہے، اس کی موت کی جگہ کا ایک متغیر اکاؤنٹ شامل کرتا ہے ⁦(وٹس کے قریب ٹرین میں، یا ٹرین میں بیمار پڑنے کے بعد یوگیکارتا کے اسپتال میں)⁩، احمد دحلان کے لیے اس کی حمایت کو اس کی اسلام سے وفاداری کی ایک شکل کے طور پر بیان کرتا ہے، اور اس کی بیویوں اور چوبیس بیٹوں کی فہرست دیتا ہے۔"
  tr: "Hamingkubuana VIII üzerine Endonezya Vikipedi makalesi; yalnızca varlık gerçekleri için kullanılmıştır. Doğum, ölüm ve yönetim dönemi konularında İngilizce ile örtüşür, ölüm yerinin alternatif bir anlatımını ekler (Watts'taki trende veya tren aksi sonrası Yogyakarta'daki bir hastanede), Ahmed Dahlan'a verdiği desteği İslam'a bağlılığının bir yansıması olarak tanımlar ve yirmi dört eşi ile çocuğunu listeler."
  id: "Artikel Wikipedia Indonesia tentang Hamingkubuana VIII; digunakan hanya untuk fakta entitas. Artikel ini sejalan dengan bahasa Inggris tentang kelahiran, kematian, dan masa pemerintahan, serta menambahkan catatan alternatif tentang tempat kematiannya (di kereta di Watts atau di rumah sakit di Yogyakarta setelah kecelakaan kereta), menggambarkan dukungannya kepada Ahmed Dahlan sebagai cerminan kesetiaannya kepada Islam, dan mencantumkan dua puluh empat istri serta anak-anaknya."
