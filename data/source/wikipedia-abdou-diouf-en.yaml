summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبدو ضيوف؛ تُستخدم لوقائع الكيان فقط. تروي رئاسته للحكومة (1970–1981) ورئاسته للسنغال (1981–2000) وأمانته العامة للمنظمة الدولية للفرنكوفونية، وتصنّفه في فئتي مسلمي السنغال ومسلمي السنغال السنة، ولا يناقش متنها دينه شخصيا."
  en: "English Wikipedia article on Abdou Diouf; used for entity facts only. It recounts his premiership (1970–1981), his presidency of Senegal (1981–2000) and his secretary-generalship of the Francophonie. It files him under Senegalese Muslims and Senegalese Sunni Muslims; its text does not discuss his own religion."
  es: "Artículo de la Wikipedia en inglés sobre Abdou Diouf; utilizado únicamente para obtener información sobre la persona. Relata su mandato como primer ministro (1970-1981), su presidencia de Senegal (1981-2000) y su cargo como secretario general de la Francofonía. Lo clasifica dentro de los musulmanes senegaleses y los musulmanes sunitas senegaleses; el texto no aborda su religión."
  fr: "Article de Wikipédia en anglais sur Abdou Diouf; utilisé uniquement à des fins d’information sur la personne. Il relate son mandat de Premier ministre (1970-1981), sa présidence du Sénégal (1981-2000) et son poste de secrétaire général de la Francophonie. Il est classé parmi les musulmans sénégalais et les musulmans sunnites sénégalais; le texte n’aborde pas sa religion."
  ur: "عبدو دیوف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پریمیئر شپ (1970–1981)، سینیگال کی ان کی صدارت (1981–2000) اور ان کی فرانکوفونی کے سیکرٹری جنرل کا ذکر ہے۔ یہ اسے سینیگالی مسلمانوں اور سینیگالی سنی مسلمانوں کے تحت فائل کرتا ہے۔ اس کا متن اس کے اپنے مذہب پر بحث نہیں کرتا۔"
  tr: "Abdo Diouf hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Hükümet liderliğini (1970–1981), Senegal liderliğini (1981–2000) ve Uluslararası Frankofoni Örgütü Genel Sekreterliğini anlatır. Onu Senegalli Müslümanlar ve Senegal'in Sünni Müslümanları olarak sınıflandırır ve dini hakkında kişisel olarak tartışmaz."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdo Diouf hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kepemimpinannya di pemerintahan (1970–1981), kepemimpinannya di Senegal (1981–2000), dan Sekretaris Jenderal Organisasi Internasional La Francophonie. Artikel tersebut mengklasifikasikannya sebagai Muslim Senegal dan Muslim Sunni Senegal, dan tidak membahas agamanya secara pribadi."
