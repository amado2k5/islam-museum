  ar: "مقالة ويكيبيديا الإنجليزية عن عبدو ضيوف؛ تُستخدم لوقائع الكيان فقط. تروي رئاسته للحكومة (1970–1981) ورئاسته للسنغال (1981–2000) وأمانته العامة للمنظمة الدولية للفرنكوفونية، وتصنّفه في فئتي مسلمي السنغال ومسلمي السنغال السنة، ولا يناقش متنها دينه شخصيا."
  en: "English Wikipedia article on Abdou Diouf; used for entity facts only. It recounts his premiership (1970–1981), his presidency of Senegal (1981–2000) and his secretary-generalship of the Francophonie. It files him under Senegalese Muslims and Senegalese Sunni Muslims; its text does not discuss his own religion."
  es: "Artículo de la Wikipedia en inglés sobre Abdou Diouf; utilizado únicamente para obtener información sobre la persona. Relata su mandato como primer ministro (1970-1981), su presidencia de Senegal (1981-2000) y su cargo como secretario general de la Francofonía. Lo clasifica dentro de los musulmanes senegaleses y los musulmanes sunitas senegaleses; el texto no aborda su religión."
