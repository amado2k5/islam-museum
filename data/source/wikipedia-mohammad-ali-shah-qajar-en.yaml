  ar: "مقالة ويكيبيديا الإنجليزية عن محمد علي شاه قاجار؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في تبريز في 21 يونيو 1872 ووفاته في المنفى بسان ريمو في 5 أبريل 1925 ودفنه في مرقد الإمام الحسين بكربلاء، وعهده القصير (1907-1909) وحلّه المجلس وقصفه، وخلعه سنة 1909 ثم محاولته الفاشلة للعودة سنة 1911."
  en: "English Wikipedia article on Mohammad Ali Shah Qajar; used for entity facts only. It gives his birth at Tabriz on 21 June 1872, his death in exile at San Remo on 5 April 1925 and burial in the Imam Hussein Shrine at Karbala, his short reign (1907-1909), his dissolution and bombardment of the Majles, his deposition in 1909 and his failed attempt to return in 1911."
