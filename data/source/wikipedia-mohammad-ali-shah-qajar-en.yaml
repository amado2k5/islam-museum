summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد علي شاه قاجار؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في تبريز في 21 يونيو 1872 ووفاته في المنفى بسان ريمو في 5 أبريل 1925 ودفنه في مرقد الإمام الحسين بكربلاء، وعهده القصير (1907-1909) وحلّه المجلس وقصفه، وخلعه سنة 1909 ثم محاولته الفاشلة للعودة سنة 1911."
  en: "English Wikipedia article on Mohammad Ali Shah Qajar; used for entity facts only. It gives his birth at Tabriz on 21 June 1872, his death in exile at San Remo on 5 April 1925 and burial in the Imam Hussein Shrine at Karbala, his short reign (1907-1909), his dissolution and bombardment of the Majles, his deposition in 1909 and his failed attempt to return in 1911."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Ali Shah Qajar; utilizado únicamente para datos sobre la persona. Describe su nacimiento en Tabriz el 21 de junio de 1872, su muerte en el exilio en San Remo el 5 de abril de 1925 y su entierro en el santuario del Imam Hussein en Karbala, su breve reinado (1907-1909), la disolución y el bombardeo del Majlis, su deposición en 1909 y su fallido intento de regresar en 1911."
  fr: "Article de Wikipédia en anglais sur Mohammad Ali Shah Qajar; utilisé uniquement pour les informations factuelles. Il indique sa naissance à Tabriz le 21 juin 1872, sa mort en exil à San Remo le 5 avril 1925 et son inhumation au sanctuaire de l’Imam Hussein à Karbala, son court règne (1907-1909), la dissolution et le bombardement du Majlis, sa destitution en 1909 et sa tentative infructueuse de retour en 1911."
