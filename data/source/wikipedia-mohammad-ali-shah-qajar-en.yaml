reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives him as the sixth Qajar shah, son of Mozaffar ad-Din Shah and of Taj ol-Molouk (Umm al-Khakan), through whom he was a grandson of Amir Kabir; crown prince and governor of Azerbaijan before his accession on 3 January 1907; his abolition of the constitution as contrary to Islamic law, the June 1908 bombardment of the Majles, his deposition on 16 July 1909 and his son Ahmad's accession, his exile in Russia, Constantinople and San Remo, and his failed landing of 1911. Its infobox carries a religion field reading 'Shia Islam'; its text makes no statement of his personal religion — the Islamic-law ground he gave for abolishing the constitution is a stated ground of policy, not an attestation of a school."
