summary:
  ar: "مقالة ويكيبيديا العربية عن المهندس والباحث السوري عبد الدائم الكحيل؛ تُستخدم لوقائع الكيان فقط. تروي مولده بحمص، ودراسته الهندسة الميكانيكية بجامعة دمشق، وعمله باحثا في الإعجاز العلمي في القرآن والسنة، وعضويته في الهيئة العالمية للإعجاز العلمي، وكتبه التي تجاوزت الأربعين، وموقعه «موسوعة الكحيل للإعجاز العلمي»."
  en: "Arabic Wikipedia article on the Syrian engineer and researcher Abdel Daim Kaheel; used for entity facts only. It recounts his birth in Homs, his mechanical engineering studies at Damascus University, his work as a researcher in the scientific miracles (i'jaz) of the Qur'an and Sunnah, his membership of the World Commission on Scientific Miracles, his more than forty books, and his website, the Kaheel Encyclopedia of Scientific Miracles."
  es: "Artículo en árabe de la Wikipedia sobre el ingeniero e investigador sirio Abdel Daim Kaheel; se utiliza únicamente para datos sobre la persona. Relata su nacimiento en Homs, sus estudios de ingeniería mecánica en la Universidad de Damasco, su trabajo como investigador de los milagros científicos (i'jaz) del Corán y la Sunnah, su pertenencia a la Comisión Mundial de Milagros Científicos, sus más de cuarenta libros y su sitio web, la Enciclopedia Kaheel de Milagros Científicos."
  fr: "Article de Wikipédia en arabe consacré à l'ingénieur et chercheur syrien Abdel Daim Kaheel; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Homs, ses études d'ingénierie mécanique à l'université de Damas, ses travaux de recherche sur les miracles scientifiques (i'jaz) du Coran et de la Sunna, son appartenance à la Commission mondiale sur les miracles scientifiques, ses plus de quarante ouvrages et son site web, l'Encyclopédie Kaheel des miracles scientifiques."
  ur: "عربی ویکیپیڈیا مضمون شامی انجینئر اور محقق عبدل دائم کاہیل پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں حمص میں ان کی پیدائش، دمشق یونیورسٹی میں مکینیکل انجینئرنگ کی تعلیم، قرآن و سنت کے سائنسی معجزات ⁦(اعجاز)⁩ کے محقق کے طور پر ان کے کام، سائنسی معجزات کے عالمی کمیشن کی رکنیت، ان کی چالیس سے زائد کتابیں، اور ان کی ویب سائٹ، سائنسی معجزات کا کیہیل انسائیکلوپیڈیا کا ذکر ہے۔"
