reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full at the recorded revision on 26 October 2026. The article gives his full name as Abdel Daim Saleh Kaheel, born in Homs; its lead gives his birth as 10 May 1968 while its infobox flags the birthplace with the year 1966 and its categories file him under births of 1966 and of 1385 AH — the year is therefore treated as contested (see the record's born note). It gives a mechanical engineering degree and postgraduate diplomas from Damascus University, membership of the World Commission on Scientific Miracles in the Qur'an and Sunnah, research activity from 2005, and more than forty published books. Its infobox gives his religion as Islam and its school field as 'Ahl al-Sunna wa'l-Jama'a' — a single infobox value, not a second attestation. His official website is given as kaheel7.net."
