summary:
  ar: "مقالة ويكيبيديا العربية عن المهندس والباحث السوري عبد الدائم الكحيل؛ تُستخدم لوقائع الكيان فقط. تروي مولده بحمص، ودراسته الهندسة الميكانيكية بجامعة دمشق، وعمله باحثا في الإعجاز العلمي في القرآن والسنة، وعضويته في الهيئة العالمية للإعجاز العلمي، وكتبه التي تجاوزت الأربعين، وموقعه «موسوعة الكحيل للإعجاز العلمي»."
  en: "Arabic Wikipedia article on the Syrian engineer and researcher Abdel Daim Kaheel; used for entity facts only. It recounts his birth in Homs, his mechanical engineering studies at Damascus University, his work as a researcher in the scientific miracles (i'jaz) of the Qur'an and Sunnah, his membership of the World Commission on Scientific Miracles, his more than forty books, and his website, the Kaheel Encyclopedia of Scientific Miracles."
