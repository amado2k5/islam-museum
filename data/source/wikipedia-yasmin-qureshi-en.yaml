summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ياسمين قريشي (مواليد 1963)؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في غوجرات بالبنجاب في 5 يوليو 1963 وانتقالها إلى بريطانيا في التاسعة، ودراستها للقانون في جامعة لندن ساوث بانك وكلية لندن الجامعية، وعملها محامية للادعاء ثم رئيسة للقسم القانوني الجنائي في بعثة الأمم المتحدة في كوسوفو ومديرة لإدارة القضاء فيها، وانتخابها نائبة عن بولتون الجنوبية الشرقية سنة 2010 ضمن أوائل النائبات المسلمات وأول امرأة تنتخب عن تلك الدائرة، وحملتها الطويلة في قضية بريمودوس."
  en: "English Wikipedia article on Yasmin Qureshi (born 1963); used for entity facts only. It records her birth at Gujrat, Punjab, on 5 July 1963 and her move to Britain at nine, her law studies at London South Bank University and University College London, her work as a Crown Prosecution Service barrister and then head of the criminal legal section of the UN Mission in Kosovo and Director of its Department of Judicial Administration, her 2010 election for Bolton South East as one of Britain's first female Muslim MPs and the first woman elected for that seat, and her long Primodos campaign."
