summary:
  ar: "مقالة ويكيبيديا العربية عن إبراهيم رئيسي؛ تُستخدم لوقائع الكيان فقط. يذكر مطلعها رئاسته من 3 آب 2021 خلفًا لحسن روحاني حتى وفاته، ويعطي صندوقها ديانته «مسلم شيعي»."
  en: "Arabic Wikipedia article on Ebrahim Raisi; used for entity facts only. Its lead gives his presidency from 3 August 2021, succeeding Hassan Rouhani, until his death, and its infobox gives his religion as 'Shia Muslim' (Muslim Shi'i)."
  es: "Artículo de Wikipedia en árabe sobre Ebrahim Raisi; utilizado únicamente para datos sobre la persona. En su introducción se indica que fue presidente desde el 3 de agosto de 2021, sucediendo a Hassan Rouhani, hasta su fallecimiento, y en su ficha informativa se menciona su religión como «musulmán chiíta»."
  fr: "Article Wikipédia en arabe sur Ebrahim Raisi; utilisé uniquement pour les informations sur l'entité. Son introduction indique qu'il a été président du 3 août 2021, succédant à Hassan Rouhani, jusqu'à sa mort, et son infobox précise qu'il était musulman chiite."
  ur: "ابراہیم رئیسی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی قیادت 3 اگست 2021 سے حسن روحانی کے بعد ان کی موت تک اس کی صدارت دیتی ہے، اور اس کا معلوماتی باکس اس کا مذہب 'شیعہ مسلم' ⁦(مسلم شیعہ)⁩ کے طور پر دیتا ہے۔"
  tr: "Arapça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılıyor. Açılışında, 3 Ağustos 2021'den itibaren Hasan Ruhani'nin ölümüne kadar başkanlığı olduğu belirtiliyor ve kutusuna dini olarak \"Şii Müslüman\" olarak giriyor."
  id: "Artikel Wikipedia berbahasa Arab tentang Ebrahim Raisi hanya digunakan untuk fakta entitas tersebut. Pembukaannya mencatat kepresidenannya sejak 3 Agustus 2021, menggantikan Hassan Rouhani hingga kematiannya, dan memberikan kotaknya agama sebagai \"Muslim Syiah.\""
