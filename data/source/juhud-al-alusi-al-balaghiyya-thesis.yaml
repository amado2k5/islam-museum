  en: "Juhud al-Alusi al-Balaghiyya: al-Alusi's work in rhetoric through Ruh al-Ma'ani — doctoral thesis in rhetoric and criticism (supervisor Dr Muhammad al-Hasan Ali al-Amin, 2008–2009)"
  ur: "جہود الآلوسی البلاغیہ، روح المعانی کی روشنی میں — بلاغت و نقد میں پی ایچ ڈی مقالہ ⁦(نگران ڈاکٹر محمد الحسن علی الامین، 2008–2009ء)⁩"
summary:
  ar: "رسالة مقدمة لنيل درجة الدكتوراه في البلاغة والنقد، بإشراف الدكتور محمد الحسن علي الأمين، للعام 2008–2009؛ في فصلها الأول ترجمة مفصلة لأبي الثناء الألوسي ⁦(نسبه ومولده ونشأته وشيوخه وتلاميذه وآثاره ومكانته وعصره وعقيدته ومذهبه ووفاته)⁩ معتمدة على «غرائب الاغتراب» و«أعلام العراق» و«المسك الأذفر» وغيرها."
  en: "A doctoral thesis in rhetoric and criticism, supervised by Dr Muhammad al-Hasan Ali al-Amin, academic year 2008–2009; its first chapter gives a detailed biography of Abu al-Thana' al-Alusi — lineage, birth, upbringing, teachers, students, works, standing, age, creed, legal school and death — drawing on Ghara'ib al-Ightirab, A'lam al-Iraq, al-Misk al-Adhfar and other sources."
  ur: "بلاغت و نقد میں پی ایچ ڈی کا مقالہ، ڈاکٹر محمد الحسن علی الامین کی نگرانی میں، تعلیمی سال 2008–2009؛ اس کے پہلے باب میں ابو الثناء آلوسی کے مفصل سوانح ہیں — نسب، ولادت، نشوونما، اساتذہ، شاگرد، تصانیف، مقام، عصر، عقیدہ، مسلک اور وفات — جو «غرائب الاغتراب»، «اعلام العراق»، «المسک الاذفر» وغیرہ پر مبنی ہیں۔"
