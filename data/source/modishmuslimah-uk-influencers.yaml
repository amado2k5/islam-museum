summary:
  ar: "قائمة مدونة «موديش مسلمة» لأبرز خمس مؤثرات في الموضة المحتشمة بالمملكة المتحدة؛ تذكر حبيبة دا سيلفا مقيمةً في برمنغهام وتملك علامة حجاب، ومنال تشينوتاي مؤثرةً لندنية في الموضة المحتشمة والجمال وأسلوب الحياة تنشر مذكرات سفر ودروس حجاب وحيل تجميل."
  en: "Modish Muslimah's list of the top five UK-based modest fashion influencers; it places Habiba Da Silva in Birmingham and notes that she owns a hijab brand, and names Manal Chinutay as a London-based modest fashion, beauty and lifestyle influencer posting travel diaries, hijab tutorials and beauty hacks."
  es: "La lista de Modish Muslimah de las cinco principales influencers de moda modesta con sede en el Reino Unido sitúa a Habiba Da Silva en Birmingham y señala que es propietaria de una marca de hijabs, y nombra a Manal Chinutay como una influencer de moda modesta, belleza y estilo de vida con sede en Londres que publica diarios de viaje, tutoriales sobre hijabs y trucos de belleza."
  fr: "La liste des cinq influenceuses de mode pudique les plus importantes basées au Royaume-Uni établie par Modish Muslimah place Habiba Da Silva à Birmingham et note qu'elle possède une marque de hijabs, et cite Manal Chinutay comme une influenceuse de mode, beauté et style de vie pudique basée à Londres, publiant des carnets de voyage, des tutoriels sur le hijab et des astuces beauté."
  ur: "موڈیش مسلمہ کی برطانیہ میں مقیم سب سے اوپر پانچ معمولی فیشن پر اثر انداز ہونے والوں کی فہرست؛ اس نے حبیبہ دا سلوا کو برمنگھم میں رکھا اور نوٹ کیا کہ وہ ایک حجاب برانڈ کی مالک ہیں، اور منال چنوتے کا نام لندن میں مقیم ایک معمولی فیشن، خوبصورتی اور طرز زندگی پر اثر انداز کرنے والی ٹریول ڈائری، حجاب ٹیوٹوریلز اور بیوٹی ہیکس پوسٹ کرنے والی ہے۔"
  tr: "'Modish Muslima' blogu, Birleşik Krallık'taki mütevazı modada en çok beş influencer'ı listeliyor; Birmingham'da yaşayan ve başörtüsü markasına sahip Habiba da Silva ile mütevazı moda, güzellik ve yaşam tarzı alanında Londra fenomeni Manal Chinutai, seyahat günlükleri, başörtüsü dersleri ve güzellik teknikleri yayımlıyor."
  id: "Blog 'Modish Muslima' mencantumkan lima influencer teratas dalam mode modest di Inggris; Habiba da Silva, penduduk Birmingham yang memiliki merek hijab, dan Manal Chinutai, influencer London dalam fashion modest, kecantikan, dan gaya hidup, menerbitkan buku harian perjalanan, pelajaran hijab, dan teknik kecantikan."
