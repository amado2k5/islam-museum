reliability_note: "Her own teaching site: a primary source for identity, work and reach, not independent corroboration (founder's sourcing ladder, 24 Oct 2026). It presents her by her kunya only, and records her study of traditional texts (mutun) across fiqh, aqeedah, Quran sciences, hadith and usul al-fiqh with named scholars including Sa'd al-Khathlan, Khalid al-Muslih and Abdullah as-Silmi, her memorisation of the Quran, and her term-based online classes following the New South Wales school terms from Sydney. It names no madhhab or sect affiliation for her. Checked 26 October 2026."
