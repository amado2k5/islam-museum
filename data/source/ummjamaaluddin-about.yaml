summary:
  ar: "صفحة التعريف في موقع الشيخة أم جمال الدين التعليمي؛ تروي أكثر من خمسة وعشرين عاما في طلب العلم، ومؤهلاتها: ماجستير في الفقه وبكالوريوس في الفقه وأصوله وبكالوريوس آداب في اللغات بتخصص العربية وإجازة في التجويد برواية حفص وإجازة في الحديث، وعضويتها في المجلس الوطني للأئمة في أستراليا، ودروسها الشرعية عبر الإنترنت منذ سنة 2020."
  en: "The About page of Shaykha Umm Jamaal ud-Din's teaching website: more than twenty-five years seeking knowledge; her qualifications — a Master's in Fiqh, a Bachelor in Fiqh and Usul al-Fiqh, a BA in Languages majoring in Arabic, an ijazah in Tajweed (Hafs) and an ijazah in Hadith; her membership of the Australian National Imams Council; and her online Shariah classes running since 2020."
  es: "La página \"Acerca de\" del sitio web de enseñanza de Shaykha Umm Jamaal ud-Din: más de veinticinco años en la búsqueda del conocimiento; sus cualificaciones: una maestría en Fiqh, una licenciatura en Fiqh y Usul al-Fiqh, una licenciatura en lenguas con especialización en árabe, una ijazah en Tajweed (Hafs) y una ijazah en Hadith; su pertenencia al Consejo Nacional de Imanes de Australia; y sus clases de Shariah en línea que se imparten desde 2020."
  fr: "La page « À propos » du site web d’enseignement de Shaykha Umm Jamaal ud-Din: plus de vingt-cinq ans de recherche du savoir; ses qualifications — une maîtrise en Fiqh, une licence en Fiqh et Usul al-Fiqh, une licence en langues avec spécialisation en arabe, une ijazah en Tajweed (Hafs) et une ijazah en Hadith; son appartenance au Conseil national australien des imams; et ses cours de charia en ligne dispensés depuis 2020."
  ur: "شیخہ ام جمال الدین کی تدریسی ویب سائٹ کے بارے میں صفحہ: علم کی تلاش میں پچیس سال سے زیادہ؛ اس کی اہلیتیں - فقہ میں ماسٹرز، فقہ اور اصول الفقہ میں بیچلر، عربی میں بڑی زبانوں میں بی اے، تجوید ⁦(حفص)⁩ میں اعجاز اور حدیث میں اعجاز؛ آسٹریلوی قومی امام کونسل کی اس کی رکنیت؛ اور اس کی آن لائن شرعی کلاسز 2020 سے چل رہی ہیں۔"
  tr: "Şeyha um Cemal-Din eğitim web sitesindeki giriş sayfası, yirmi beş yılı aşkın bilgi arayışını anlatmaktadır. Nitelikleri arasında Fıkıh Yüksek Lisansı, Fıkıh ve İlkeleri alanında lisans derecesi, Arapça uzmanlaşmış Dil Lisansı, Hafs Rivayeti Tacvidi Lisansı, Hadis Lisansı, Avustralya Ulusal İmamlar Konseyi üyeliği ve 2020'den beri çevrimiçi Şeriat dersleri bulunmaktadır."
  id: "Halaman pengantar di situs pendidikan Sheikha um Jamal Al-Din menceritakan lebih dari dua puluh lima tahun pencarian pengetahuan. Kualifikasinya meliputi: gelar Magister dalam bidang Hukum, gelar Sarjana dalam bidang Hukum dan Prinsip-prinsipnya, Sarjana Seni dalam Bahasa yang mengkhususkan diri dalam bahasa Arab, Lisensi dalam Tajweed dalam Narasi Hafs, Lisensi dalam Hadis, keanggotaan di Dewan Nasional Imam di Australia, dan pelajaran Syariahnya secara daring sejak 2020."
