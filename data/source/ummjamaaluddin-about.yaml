summary:
  ar: "صفحة التعريف في موقع الشيخة أم جمال الدين التعليمي؛ تروي أكثر من خمسة وعشرين عاما في طلب العلم، ومؤهلاتها: ماجستير في الفقه وبكالوريوس في الفقه وأصوله وبكالوريوس آداب في اللغات بتخصص العربية وإجازة في التجويد برواية حفص وإجازة في الحديث، وعضويتها في المجلس الوطني للأئمة في أستراليا، ودروسها الشرعية عبر الإنترنت منذ سنة 2020."
  en: "The About page of Shaykha Umm Jamaal ud-Din's teaching website: more than twenty-five years seeking knowledge; her qualifications — a Master's in Fiqh, a Bachelor in Fiqh and Usul al-Fiqh, a BA in Languages majoring in Arabic, an ijazah in Tajweed (Hafs) and an ijazah in Hadith; her membership of the Australian National Imams Council; and her online Shariah classes running since 2020."
