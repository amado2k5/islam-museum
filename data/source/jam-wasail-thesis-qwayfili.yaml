summary:
  ar: "رسالة علمية بعنوان «جمع الوسائل في شرح الشمائل لملا علي القاري: دراسة وتحقيقاً»، من إعداد لؤلؤة بنت عبدالكريم بن إبراهيم القويفلي، تتضمن دراسة عن عصر المؤلف وحياته وتعريفاً بالمخطوط ونسخه، ثم النص المحقق من باب خضاب رسول الله إلى باب اتكائه. النسخة المحفوظة في المسح من الملف 1_20200719_2031."
  en: "An academic thesis, «Jam' al-Wasa'il fi Sharh al-Shama'il by Mulla Ali al-Qari: study and edition», by Lu'lu'a bint Abd al-Karim ibn Ibrahim al-Qwayfili. It has a study of the author's age and life, a description of the manuscript and its copies, and the edited text from the chapter on the dyeing of the Prophet's hair to the chapter on his reclining."
  es: "Tesis académica titulada «Jam' al-Wasa'il fi Sharh al-Shama'il de Mulla Ali al-Qari: estudio y edición», de Lu'lu'a bint Abd al-Karim ibn Ibrahim al-Qwayfili. Incluye un estudio sobre la edad y la vida de la autora, una descripción del manuscrito y sus copias, y el texto editado desde el capítulo sobre el teñido del cabello del Profeta hasta el capítulo sobre su reclinación."
  fr: "Thèse universitaire intitulée « Jam' al-Wasa'il fi Sharh al-Shama'il by Mulla Ali al-Qari: étude et édition », par Lu'lu'a bint Abd al-Karim ibn Ibrahim al-Qwayfili. Elle comprend une étude de l'âge et de la vie de l'auteure, une description du manuscrit et de ses copies, ainsi que le texte édité du chapitre relatif à la teinture des cheveux du Prophète jusqu'au chapitre concernant sa position couchée."
  ur: "ایک علمی مقالہ، «جام الوسائل فی شرح الشمائل از ملا علی القاری: مطالعہ اور ایڈیشن»، لولوعہ بنت عبد الکریم ابن ابراہیم القویفیلی کا۔ اس میں مصنف کی عمر اور زندگی کا مطالعہ، مخطوطہ اور اس کے نسخوں کی تفصیل اور رسول اللہ کے بالوں کو رنگنے کے باب سے لے کر ان کے تکیہ لگانے کے باب تک ترمیم شدہ متن شامل ہے۔"
  tr: "Lulu'a bint Abdulkerim bin İbrahim el-Qwaifli tarafından hazırlanan \"Jam' al-Wasa'il fi Sharh al-Shama'il\" adlı akademik tez, yazarın dönemi ve yaşamı üzerine bir çalışma, el yazması ve kopyalarına giriş, ardından Allah'ın Resulef'inin boyanması bölümünden doğrulanmış metni ve buna dayandığı bölüm dahil edilmiştir. Arşivlenmiş kopya, 1_20200719_2031 dosyasından taranmış durumdadır."
  id: "Sebuah tesis ilmiah berjudul \"Jam' al-Wasa'il fi Sharh al-Shama'il oleh Mulla Ali al-Qari: Studi dan Verifikasi,\" yang disiapkan oleh Lulu'a bint Abdulkarim bin Ibrahim al-Qwaifli, yang mencakup studi tentang era dan kehidupan penulis, pengantar naskah dan salinannya, kemudian teks yang diverifikasi dari bagian pewarnaan Rasulullah hingga bab kepercayaannya. Salinan arsip tersebut sedang dipindai dari file 1_20200719_2031."
