summary:
  ar: "رسالة علمية بعنوان «جمع الوسائل في شرح الشمائل لملا علي القاري: دراسة وتحقيقاً»، من إعداد لؤلؤة بنت عبدالكريم بن إبراهيم القويفلي، تتضمن دراسة عن عصر المؤلف وحياته وتعريفاً بالمخطوط ونسخه، ثم النص المحقق من باب خضاب رسول الله إلى باب اتكائه. النسخة المحفوظة في المسح من الملف 1_20200719_2031."
  en: "An academic thesis, «Jam' al-Wasa'il fi Sharh al-Shama'il by Mulla Ali al-Qari: study and edition», by Lu'lu'a bint Abd al-Karim ibn Ibrahim al-Qwayfili. It has a study of the author's age and life, a description of the manuscript and its copies, and the edited text from the chapter on the dyeing of the Prophet's hair to the chapter on his reclining."
