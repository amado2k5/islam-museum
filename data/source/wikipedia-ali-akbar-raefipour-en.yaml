  ar: "مقالة ويكيبيديا الإنجليزية عن علي أكبر رائفي بور: معلّق وشخصية إعلام اجتماعي إيراني مولود سنة 1984، مؤسس معهد مصاف ورئيسه منذ 2011، يصفه باحثون منقولون فيها بأنه منظّر مؤامرة، وهو من دعاة المهدوية، وقد علّق تويتر حساباته في 2020 و2022، واحتُجز في السعودية في يوليو 2023 قبل إطلاقه."
  en: "The English Wikipedia article on Ali-Akbar Raefipour: an Iranian commentator and social media personality born in 1984, founder and head of the Masaf Institute since 2011, described by researchers quoted in the article as a conspiracy theorist, an advocate of Mahdism, with Twitter accounts suspended in 2020 and 2022, and detained in Saudi Arabia in July 2023 before his release."
