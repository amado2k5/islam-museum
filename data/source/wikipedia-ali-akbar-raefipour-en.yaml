reliability_note: "Read in full on 7 November 2026; the reading tools available in this run did not expose a revision id, so none is recorded. Used for his birth year (born 1984, lead and infobox), for his founding and headship of the Masaf Institute (launched June 2011 in this article), for his self-description as a university lecturer and researcher in apocalyptic topics and cults, for the attributed descriptions of him as a conspiracy theorist (Stanford Internet Observatory researchers and others, cited in the article), for the account suspensions of May 2020 and 2022, for his forming of the Morning of Iran organisation in the 2024 legislative election, and for the July 2023 Saudi Arabia detention episode. On faith, the article's prose describes his generation of speakers as mixing 'conspiracy theories with Shi'ite theological assertions' and calls him 'an advocate of Mahdism' — statements about his discourse and advocacy, not an attestation of a school for the man himself; the article nowhere calls him a Shia in its own prose."
