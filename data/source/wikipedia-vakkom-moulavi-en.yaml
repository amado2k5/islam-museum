summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فاكوم مولوي ⁦(محمد عبد القادر مولوي)⁩؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في فاكوم في 28 ديسمبر 1873 ووفاته في 31 أكتوبر 1932، وتأسيسه صحيفة «سواديشابهیماني» سنة 1905 ومصادرتها سنة 1910، ومجلاته «مسلم» (1906) و«الإسلام» (1918) و«ديبيكا» (1931)، ودعوته الإصلاحية القائمة على القرآن والحديث، ووصف محمد رشيد رضا له في «المنار» بأنه سلفي على مذهب أهل السنة والجماعة."
  en: "English Wikipedia article on Vakkom Moulavi (Vakkom Mohammed Abdul Khader Moulavi); used for entity facts only. It records his birth at Vakkom on 28 December 1873 and death on 31 October 1932, his founding of the Swadeshabhimani newspaper in 1905 and its confiscation in 1910, his journals Muslim (1906), Al-Islam (1918) and Deepika (1931), his Qur'an-and-Hadith reform programme, and Muhammad Rashid Rida's eulogy in Al-Manar describing him as a Salafi on the madhhab of Ahlus-Sunnah wal-Jama'ah."
  es: "Artículo de Wikipedia en inglés sobre Mohammed Abdul Khader Moulavi; Se utiliza únicamente para hechos de entidades. Registra su nacimiento en Vakkom el 28 de diciembre de 1873 y su muerte el 31 de octubre de 1932, su fundación del periódico Swadeshabhimani en 1905 y su confiscación en 1910, sus revistas Muslim (1906), Al-Islam (1918) y Deepika (1931), su programa de reforma del Corán y los hadices y el panegírico de Muhammad Rashid Rida en Al-Manar lo describe como un salafista en el madhab de Ahlus-Sunnah wal-Jama'ah."
  fr: "Article Wikipédia en anglais sur Mohammed Abdul Khader Moulavi; utilisé uniquement pour les faits d’entité. Il enregistre sa naissance à Vakkom le 28 décembre 1873 et son décès le 31 octobre 1932, sa fondation du journal Swadeshabhimani en 1905 et sa confiscation en 1910, ses journaux Muslim (1906), Al-Islam (1918) et Deepika (1931), son programme de réforme du Coran et des Hadiths et l'éloge funèbre de Muhammad Rashid Rida dans Al-Manar. le décrivant comme un salafiste du madhhab d'Ahlus-Sunnah wal-Jama'ah."
  ur: "محمد عبدالخادر مولوی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 28 دسمبر 1873 کو واکوم میں ان کی پیدائش اور 31 اکتوبر 1932 کو موت، 1905 میں سودیش بھیمانی اخبار کی بنیاد اور 1910 میں اس کی ضبطی، اس کے جریدے مسلم (1906)، الاسلام (1918) اور دیپیکا (1931)، محمدی اور قرآن مجید، ان کے روزنامے، 1931 میں درج ہیں۔ ردا کی تعریف المنار میں اسے اہل سنت والجماعت کے ایک سلفی کے طور پر بیان کرتی ہے۔"
  tr: "Fakum Mawlawi (Muhammad Abdul Qadir Mawlawi) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 28 Aralık 1873'te Fakum'da doğduğu ve 31 Ekim 1932'deki ölümü, 1905'te 'Swadeshabhimani' gazetesinin kuruluşu ve 1910'da el konulan 'Swadeshabhimani' gazetesi, 'Muslim' (1906), 'Islam' (1918) ve 'Deepika' (1931) dergileri ile Kuran ve Hadislere dayalı reformist çağrısı belgelenmiştir. Muhammad Rashid Reda, 'Al-Manar'da onu Sünni ve Cemaah okulunu takip eden bir Selefi olarak tanımlamıştır."
  id: "Artikel Wikipedia bahasa Inggris tentang Fakum Mawlawi (Muhammad Abdul Qadir Mawlawi); hanya digunakan untuk fakta entitas. Kelahirannya di Fakum pada 28 Desember 1873, dan kematiannya pada 31 Oktober 1932, didokumentasikan, serta pendirian surat kabar 'Swadeshabhimani' pada tahun 1905 dan disita pada tahun 1910, serta majalahnya 'Muslim' (1906), 'Islam' (1918), dan 'Deepika' (1931), serta seruan reformisnya yang didasarkan pada Al-Quran dan Hadis. Muhammad Rashid Reda menggambarkannya dalam 'Al-Manar' sebagai seorang Salafi yang mengikuti mazhab Sunni dan Jama'ah."
