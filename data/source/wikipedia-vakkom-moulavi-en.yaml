summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فاكوم مولوي (محمد عبد القادر مولوي)؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في فاكوم في 28 ديسمبر 1873 ووفاته في 31 أكتوبر 1932، وتأسيسه صحيفة «سواديشابهیماني» سنة 1905 ومصادرتها سنة 1910، ومجلاته «مسلم» (1906) و«الإسلام» (1918) و«ديبيكا» (1931)، ودعوته الإصلاحية القائمة على القرآن والحديث، ووصف محمد رشيد رضا له في «المنار» بأنه سلفي على مذهب أهل السنة والجماعة."
  en: "English Wikipedia article on Vakkom Moulavi (Vakkom Mohammed Abdul Khader Moulavi); used for entity facts only. It records his birth at Vakkom on 28 December 1873 and death on 31 October 1932, his founding of the Swadeshabhimani newspaper in 1905 and its confiscation in 1910, his journals Muslim (1906), Al-Islam (1918) and Deepika (1931), his Qur'an-and-Hadith reform programme, and Muhammad Rashid Rida's eulogy in Al-Manar describing him as a Salafi on the madhhab of Ahlus-Sunnah wal-Jama'ah."
