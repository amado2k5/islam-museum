  ar: "أطروحة فضل عمر (جامعة كوهات للعلوم والتقنية) عن قوانين الأسرة المسلمة في باكستان وماليزيا؛ تنقل عن تقرير لجنة قوانين الزواج والأسرة (الجريدة الرسمية الباكستانية، 20 يونيو 1956، ص 1563) أن خليفة شجاع الدين ترأس أول اجتماع للجنة في 5 أكتوبر 1955 وتوفي في اليوم التالي، فخلفه عبد الرشيد."
  en: "Fazle Omer's thesis (Kohat University of Science and Technology) on the Muslim family laws of Pakistan and Malaysia; quoting the Report of the Commission on Marriage and Family Laws (Gazette of Pakistan, 20 June 1956, p. 1563), it records that Khalifa Shuja ud Din chaired the commission's first meeting on 5 October 1955 and died the next day, and was succeeded by Abdul Rashid."
