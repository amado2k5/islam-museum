label:
  en: "Muslim family laws of Pakistan and Malaysia — Fazle Omer thesis"
summary:
  ar: "أطروحة فضل عمر ⁦(جامعة كوهات للعلوم والتقنية)⁩ عن قوانين الأسرة المسلمة في باكستان وماليزيا؛ تنقل عن تقرير لجنة قوانين الزواج والأسرة ⁦(الجريدة الرسمية الباكستانية، 20 يونيو 1956، ص 1563)⁩ أن خليفة شجاع الدين ترأس أول اجتماع للجنة في 5 أكتوبر 1955 وتوفي في اليوم التالي، فخلفه عبد الرشيد."
  en: "Fazle Omer's thesis (Kohat University of Science and Technology) on the Muslim family laws of Pakistan and Malaysia; quoting the Report of the Commission on Marriage and Family Laws (Gazette of Pakistan, 20 June 1956, p. 1563), it records that Khalifa Shuja ud Din chaired the commission's first meeting on 5 October 1955 and died the next day, and was succeeded by Abdul Rashid."
  es: "La tesis de Fazle Omer (Universidad de Ciencia y Tecnología de Kohat) sobre las leyes familiares musulmanas de Pakistán y Malasia, citando el Informe de la Comisión sobre Matrimonio y Leyes Familiares (Gaceta de Pakistán, 20 de junio de 1956, pág. 1563), registra que Khalifa Shuja ud Din presidió la primera reunión de la comisión el 5 de octubre de 1955 y murió al día siguiente, siendo sucedido por Abdul Rashid."
  fr: "La thèse de Fazle Omer (Université des sciences et technologies de Kohat) sur les lois familiales musulmanes du Pakistan et de la Malaisie; citant le rapport de la Commission sur le mariage et les lois familiales (Gazette du Pakistan, 20 juin 1956, p. 1563), elle indique que Khalifa Shuja ud Din a présidé la première réunion de la commission le 5 octobre 1955 et est décédé le lendemain, et a été remplacé par Abdul Rashid."
  ur: "پاکستان اور ملائیشیا کے مسلم عائلی قوانین پر فضل عمر کا مقالہ ⁦(کوہاٹ یونیورسٹی آف سائنس اینڈ ٹیکنالوجی)⁩؛ شادی اور عائلی قوانین پر کمیشن کی رپورٹ ⁦(گزٹ آف پاکستان، 20 جون 1956، صفحہ 1563)⁩ کا حوالہ دیتے ہوئے، اس میں درج ہے کہ خلیفہ شجاع الدین نے 5 اکتوبر 1955 کو کمیشن کے پہلے اجلاس کی صدارت کی اور اگلے ہی دن انتقال کر گئے، اور عبدالرشید اس کی جگہ لے گئے۔"
title: "Comparative Study of Muslim Family Laws of Pakistan and Malaysia: A Shariah Perspective"
