summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيض الله خوجاييف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في بخارى سنة 1896 ⁦(وصندوق معلوماتها يوم 1 يونيو)⁩، ونشاطه الجديدي والمخبري الشاب، ورئاسته لحكومة جمهورية بخارى الشعبية ثم لمجلس مفوضي الشعب الأوزبكي حتى 1937، ومحاكمته في محاكمة الواحد والعشرين وإعدامه سنة 1938 ودفنه في كوموناركا. متنها يجعل إعدامه في 13 مارس بينما يعطي صندوق معلوماتها 15 مارس. تصنيفها «الاشتراكيون المسلمون» إيداع تصنيفي، وتذكر نقلا عن فوربس أن من التهم الموجهة إليه أنه دفن أخاه المتوفى وفق الشعائر الإسلامية."
  en: "English Wikipedia article on Fayzulla Khodzhayev; used for entity facts only. It gives his birth in Bukhara in 1896 (its infobox gives 1 June), his Jadid and Young Bukharan activity, his headship of the government of the Bukharan People's Soviet Republic and then of the Council of People's Commissars of the Uzbek SSR until 1937, his trial at the Trial of the Twenty-One, his execution in 1938 and his burial at Kommunarka. Its text dates the execution to 13 March while its infobox gives 15 March. Its category 'Muslim socialists' is a category filing, and it records, citing Forbes, that among the accusations against him was that he had buried his dead brother according to Islamic rites."
  es: "Artículo de la Wikipedia en inglés sobre Fayzulla Khodzhayev; utilizado únicamente para datos sobre la entidad. Indica su nacimiento en Bujará en 1896 (su ficha informativa indica el 1 de junio), su actividad en el Jadid y la Juventud Bujariana, su dirección del gobierno de la República Soviética Popular de Bujará y posteriormente del Consejo de Comisarios del Pueblo de la RSS de Uzbekistán hasta 1937, su juicio en el Juicio de los Veintiuno, su ejecución en 1938 y su entierro en Kommunarka. El texto fecha la ejecución el 13 de marzo, mientras que la ficha informativa indica el 15 de marzo. La categoría «Socialistas musulmanes» es una categoría de archivo y registra, citando a Forbes, que entre las acusaciones en su contra figuraba la de haber enterrado a su hermano fallecido según los ritos islámicos."
  fr: "L'article de Wikipédia en anglais consacré à Fayzulla Khodzhayev, utilisé uniquement pour les informations sur l'entité, mentionne sa naissance à Boukhara en 1896 (l'infobox indique le 1er juin), son engagement au sein des Jadid et des Jeunes Boukhariens, sa direction du gouvernement de la République soviétique populaire de Boukhara puis du Conseil des commissaires du peuple de la RSS d'Ouzbékistan jusqu'en 1937, son procès lors du Procès des Vingt-et-Un, son exécution en 1938 et son inhumation à Kommunarka. Le texte date l'exécution du 13 mars, tandis que l'infobox indique le 15 mars. La catégorie « Socialistes musulmans » est un classement par catégorie, et l'article rapporte, citant Forbes, que parmi les accusations portées contre lui figurait celle d'avoir enterré son frère selon le rite islamique."
  ur: "انگریزی ویکیپیڈیا مضمون فیض اللہ خودزائیف پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش بخارا میں 1896 میں ہوئی ⁦(اس کا معلوماتی خانہ 1 جون کو بتاتا ہے)⁩، اس کی جدید اور نوجوان بخاران کی سرگرمی، بخاران کی عوامی سوویت جمہوریہ کی حکومت کی سربراہی اور پھر 1937 تک ازبک ایس ایس آر کی پیپلز کمیشنرز کی کونسل کی سربراہی، اس کے مقدمے کی سماعت 1937 میں، 1938 میں اس کی عدالت میں ہوئی۔ کومونارکا۔ اس کے متن میں پھانسی کی تاریخ 13 مارچ ہے جبکہ اس کے انفو باکس میں 15 مارچ ہے۔ اس کی کیٹیگری 'مسلم سوشلسٹ' ایک کیٹیگری فائلنگ ہے، اور اس میں فوربس کا حوالہ دیتے ہوئے ریکارڈ کیا گیا ہے کہ اس کے خلاف الزامات میں سے یہ بھی تھا کہ اس نے اپنے مردہ بھائی کو اسلامی رسومات کے مطابق دفنایا تھا۔"
