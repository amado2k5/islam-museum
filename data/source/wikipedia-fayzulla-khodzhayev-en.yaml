summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيض الله خوجاييف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في بخارى سنة 1896 (وصندوق معلوماتها يوم 1 يونيو)، ونشاطه الجديدي والمخبري الشاب، ورئاسته لحكومة جمهورية بخارى الشعبية ثم لمجلس مفوضي الشعب الأوزبكي حتى 1937، ومحاكمته في محاكمة الواحد والعشرين وإعدامه سنة 1938 ودفنه في كوموناركا. متنها يجعل إعدامه في 13 مارس بينما يعطي صندوق معلوماتها 15 مارس. تصنيفها «الاشتراكيون المسلمون» إيداع تصنيفي، وتذكر نقلا عن فوربس أن من التهم الموجهة إليه أنه دفن أخاه المتوفى وفق الشعائر الإسلامية."
  en: "English Wikipedia article on Fayzulla Khodzhayev; used for entity facts only. It gives his birth in Bukhara in 1896 (its infobox gives 1 June), his Jadid and Young Bukharan activity, his headship of the government of the Bukharan People's Soviet Republic and then of the Council of People's Commissars of the Uzbek SSR until 1937, his trial at the Trial of the Twenty-One, his execution in 1938 and his burial at Kommunarka. Its text dates the execution to 13 March while its infobox gives 15 March. Its category 'Muslim socialists' is a category filing, and it records, citing Forbes, that among the accusations against him was that he had buried his dead brother according to Islamic rites."
