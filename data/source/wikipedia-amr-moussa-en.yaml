summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمرو موسى؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في القاهرة في 3 أكتوبر 1936، ووزارته للخارجية (1991–2001) خلفًا لأحمد عصمت عبد المجيد، وأمانته العامة لجامعة الدول العربية (2001–2011)، وترشحه للرئاسة سنة 2012 ورئاسته للجنة الخمسين لتعديل الدستور سنة 2013."
  en: "English Wikipedia article on Amr Moussa; used for entity facts only. It recounts his birth in Cairo on 3 October 1936, his foreign ministership (1991–2001) succeeding Ahmed Asmat Abdel-Meguid, his tenure as Secretary-General of the Arab League (2001–2011), his candidacy in the 2012 presidential election and his chairmanship of the Committee of Fifty that amended the constitution in 2013."
  es: "Artículo de la Wikipedia en inglés sobre Amr Moussa; utilizado únicamente para datos sobre la persona. Relata su nacimiento en El Cairo el 3 de octubre de 1936, su mandato como ministro de Asuntos Exteriores (1991-2001) sucediendo a Ahmed Asmat Abdel-Meguid, su período como secretario general de la Liga Árabe (2001-2011), su candidatura en las elecciones presidenciales de 2012 y su presidencia del Comité de los Cincuenta que enmendó la constitución en 2013."
  fr: "Article de Wikipédia en anglais sur Amr Moussa; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance au Caire le 3 octobre 1936, son poste de ministre des Affaires étrangères (1991-2001) succédant à Ahmed Asmat Abdel-Meguid, son mandat de secrétaire général de la Ligue arabe (2001-2011), sa candidature à l’élection présidentielle de 2012 et sa présidence du Comité des Cinquante qui a amendé la constitution en 2013."
  ur: "امر موسی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 3 اکتوبر 1936 کو قاہرہ میں ان کی پیدائش، احمد عصمت عبدالمجید کے بعد ان کی وزارت خارجہ (1991-2001)، عرب لیگ کے سیکرٹری جنرل کے طور پر ان کا دور (2001-2011)، 2012 کے صدارتی انتخابات میں ان کی امیدواری اور 2012 کے آخر میں F2012 میں تشکیل پانے والی کمیٹی کی سربراہی کے بارے میں بتایا گیا ہے۔"
  tr: "Amr Moussa hakkında İngilizce Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. 3 Ekim 1936'da Kahire'de doğduğunu, Ahmed Ismat Abdel Meguid'in yerine Dışişleri Bakanlığı'nı (1991–2001), Arap Ligi Genel Sekreterliğini (2001–2011) devraldığını, 2012'de cumhurbaşkanlığı adaylığını ve 2013'te anayasa değişikliği için Elli Komitesi başkanlığını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Amr Moussa; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Kairo pada 3 Oktober 1936, masa kepemimpinannya di Kementerian Luar Negeri (1991–2001) menggantikan Ahmed Ismat Abdel Meguid, Sekretaris Jenderal Liga Arab (2001–2011), pencalonannya sebagai presiden pada 2012, dan kepemimpinannya di Komite Lima Puluh untuk mengubah konstitusi pada 2013."
