  ar: "مقالة ويكيبيديا الإنجليزية عن عمرو موسى؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في القاهرة في 3 أكتوبر 1936، ووزارته للخارجية (1991–2001) خلفًا لأحمد عصمت عبد المجيد، وأمانته العامة لجامعة الدول العربية (2001–2011)، وترشحه للرئاسة سنة 2012 ورئاسته للجنة الخمسين لتعديل الدستور سنة 2013."
  en: "English Wikipedia article on Amr Moussa; used for entity facts only. It recounts his birth in Cairo on 3 October 1936, his foreign ministership (1991–2001) succeeding Ahmed Asmat Abdel-Meguid, his tenure as Secretary-General of the Arab League (2001–2011), his candidacy in the 2012 presidential election and his chairmanship of the Committee of Fifty that amended the constitution in 2013."
