  ar: "«دستور مملكة البحرين»، هيئة التشريع والرأي القانوني في البحرين"
  en: "Constitution of the Kingdom of Bahrain (Legislation and Legal Opinion Commission of Bahrain)"
summary:
  ar: "«دستور مملكة البحرين»، كما يُنشر عند: هيئة التشريع والرأي القانوني في البحرين. العنوان ونص المادة 2 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Constitution of the Kingdom of Bahrain, as published at: Legislation and Legal Opinion Commission of Bahrain. The address and the wording of Article 2 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Constitution of the Kingdom of Bahrain، جیسا کہ Legislation and Legal Opinion Commission of Bahrain پر شائع ہے۔ پتہ اور دفعہ 2 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Constitution of the Kingdom of Bahrain, tel que publié à : Legislation and Legal Opinion Commission of Bahrain. L'adresse et le texte (article 2) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Constitution of the Kingdom of Bahrain, tal como se publica en: Legislation and Legal Opinion Commission of Bahrain. La dirección y el texto (artículo 2) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Bahreyn Krallığı Anayasası\", şu adreste yayımlanmıştır: Bahreyn Mevzuat ve Hukuki Görüş Otoritesi. Madde 2'nin başlığı ve metni, müze tarafından sağlanan bir araştırma özetinden alınmıştır ve müze sayfayı açmamıştır; kurucu metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Konstitusi Kerajaan Bahrain,\" sebagaimana diterbitkan di: Otoritas Legislasi dan Opini Hukum di Bahrain. Judul dan teks Pasal 2 diambil dari ringkasan penelitian yang disediakan oleh museum, dan museum tidak membuka halaman tersebut; pendiri mengizinkan penggunaan teks tersebut sebagaimana dinyatakan pada 21 November 2026."
