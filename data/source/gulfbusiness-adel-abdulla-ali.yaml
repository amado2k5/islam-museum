summary:
  ar: "ملف غلف بزنس عن عادل عبد الله علي في قائمة أقوى 100 عربي لسنة 2025: بحريني الأصل يقيم في الإمارات، الرئيس التنفيذي لمجموعة العربية للطيران، أسسها في تشرين الأول 2003، وحققت في عهده ربحًا صافيًا قياسيًا قبل الضريبة قدره 1.6 مليار درهم سنة 2024."
  en: "Gulf Business profile of Adel Abdulla Ali in its 100 Most Powerful Arabs 2025 list: Bahraini by origin and resident in the UAE, Group CEO of Air Arabia, which he established in October 2003 and which under him reported a record net profit before tax of Dhs1.6 billion in 2024."
  es: "Perfil de Adel Abdulla Ali en la lista de Gulf Business de los 100 árabes más poderosos de 2025: de origen bahreiní y residente en los Emiratos Árabes Unidos, director ejecutivo del Grupo Air Arabia, que fundó en octubre de 2003 y que bajo su dirección registró un beneficio neto récord antes de impuestos de 1.600 millones de dirhams en 2024."
  fr: "Profil d'Adel Abdulla Ali dans la liste des 100 Arabes les plus puissants de Gulf Business en 2025: Bahreïni d'origine et résidant aux Émirats arabes unis, PDG du groupe Air Arabia, qu'il a fondé en octobre 2003 et qui, sous sa direction, a enregistré un bénéfice net record avant impôts de 1,6 milliard de dirhams en 2024."
  ur: "عدیل عبداللہ علی کی 100 طاقتور ترین عربوں کی 2025 کی فہرست میں خلیجی کاروباری پروفائل: بحرینی اصل میں اور متحدہ عرب امارات میں مقیم، ایئر عربیہ کے گروپ سی ای او، جسے انہوں نے اکتوبر 2003 میں قائم کیا اور جس کے تحت 2024 میں ڈی ایچ ایس 1.6 بلین کے ٹیکس سے پہلے ریکارڈ خالص منافع ہوا۔"
