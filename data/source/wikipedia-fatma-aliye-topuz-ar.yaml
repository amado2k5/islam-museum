reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Agrees with the English article on the outline — her secret reading in the first ten years of marriage, the Meram translation and the pen names, Hayal ve Hakikat (dated 1891 in its narrative, 1892 in its works list), Muhazarat (1892), Udi (1899), her women's-rights columns, the 1897 aid association, her membership of the Ottoman Red Crescent as its first woman member, the 1914 book on her father and its exclusion from the literary canon, her daughter's conversion in 1926, the Topuz surname after the 1934 Surname Law, death at Istanbul on 13 July 1936 and burial at Feriköy. It dates Nisvan-ı İslam to 1892 in one passage and lists it under 1896 works in another; the person record follows 1896 (English article) with the variant noted — the Turkish article gives 1892. Read in full on 24 October 2026."
