summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن برابوو سوبيانتو ⁦(وُلد 1951)⁩؛ تُستخدم لوقائع الكيان فقط. تروي مولده في جاكرتا في 17 أكتوبر 1951، ومسيرته العسكرية وتسريحه سنة 1998، وتأسيسه حزب غيريندرا، ووزارة دفاعه (2019–2024)، ورئاسته منذ 2024."
  en: "English Wikipedia article on Prabowo Subianto (born 1951); used for entity facts only. It recounts his birth at Jakarta on 17 October 1951, his military career and 1998 discharge, the founding of Gerindra, his defence ministry (2019–2024) and his presidency from 2024."
  es: "Artículo de la Wikipedia en inglés sobre Prabowo Subianto (nacido en 1951); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Yakarta el 17 de octubre de 1951, su carrera militar y su baja en 1998, la fundación de Gerindra, su ministerio de defensa (2019-2024) y su presidencia desde 2024."
  fr: "Article de Wikipédia en anglais sur Prabowo Subianto (né en 1951); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Jakarta le 17 octobre 1951, sa carrière militaire et sa démobilisation en 1998, la fondation de Gerindra, son ministère de la Défense (2019-2024) et sa présidence à partir de 2024."
  ur: "انگریزی ویکیپیڈیا مضمون پرابوو سوبیانتو ⁦(پیدائش 1951)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 17 اکتوبر 1951 کو جکارتہ میں ان کی پیدائش، ان کے فوجی کیریئر اور 1998 کی چھٹی، گیریندرا کی بنیاد، ان کی وزارت دفاع (2019–2024) اور 2024 سے ان کی صدارت کا ذکر ہے۔"
  tr: "Prabowo Subianto hakkında İngilizce Wikipedia makalesi (1951 doğumlu); yalnızca varlık gerçekleri için kullanılmıştır. 17 Ekim 1951'de Jakarta'daki doğumunu, askeri kariyerini ve 1998'deki terhini, Gurindra Partisi'nin kuruluşunu, Savunma Bakanlığını (2019–2024) ve 2024'ten beri başkanlığını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Prabowo Subianto (lahir 1951); hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya di Jakarta pada 17 Oktober 1951, karier militernya dan pelepasannya pada tahun 1998, pendirian Partai Gurindra, Kementerian Pertahanan (2019–2024), dan masa jabatannya sejak 2024."
