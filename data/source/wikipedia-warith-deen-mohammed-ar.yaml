summary:
  ar: "مقالة ويكيبيديا العربية عن وارث الدين محمد: تصفه بأنه استبدل بتعاليم «أمة الإسلام» أفكارًا قريبة من الإسلام السني الشائع في المشرق، وتصنّفه ضمن «مسلمون سنة أمريكيون»؛ وتحمل المقالة أيضًا حكمًا تحريريًا مذهبيًا على تحوّله لم يُنقل إلى سجلّ المتحف."
  en: "The Arabic Wikipedia article on Warith Deen Mohammed: it states that he replaced the Nation of Islam's teachings with ideas close to the Sunni Islam widespread in the East, and files him under 'American Sunni Muslims'; the article also carries a sectarian editorial verdict on his transformation, which the museum record does not reproduce."
  es: "El artículo de Wikipedia en árabe sobre Warith Deen Mohammed afirma que sustituyó las enseñanzas de la Nación del Islam por ideas cercanas al Islam suní extendido en Oriente, y lo clasifica dentro de la categoría de \"musulmanes suníes estadounidenses\". El artículo también incluye un veredicto editorial sectario sobre su transformación, que el registro del museo no reproduce."
  fr: "L'article de Wikipédia en arabe sur Warith Deen Mohammed: il indique qu'il a remplacé les enseignements de la Nation of Islam par des idées proches de l'islam sunnite répandu en Orient, et le classe dans la catégorie « musulmans sunnites américains »; l'article comporte également un jugement éditorial sectaire sur sa transformation, que la fiche du musée ne reproduit pas."
  ur: "وارث دین محمد پر عربی ویکیپیڈیا کا مضمون: اس میں کہا گیا ہے کہ اس نے نیشن آف اسلام کی تعلیمات کو مشرق میں پھیلے ہوئے سنی اسلام کے قریب نظریات سے بدل دیا، اور اسے 'امریکی سنی مسلمان' کے تحت فائل کیا۔ مضمون میں اس کی تبدیلی پر ایک فرقہ وارانہ ادارتی فیصلہ بھی ہے، جسے میوزیم کا ریکارڈ دوبارہ پیش نہیں کرتا ہے۔"
  tr: "Dinin varisi Muhammed hakkında Arapça Wikipedia makalesi: \"İslam Milleti\" öğretilerini Doğu'da yaygın olan Sünni İslam'a yakın fikirlerle değiştirdiği ve \"Amerikan Sünni Müslümanları\" arasında sınıflandırıldığı belirtiliyor; makalede ayrıca dönüşümüne dair mezhepçi bir editoryal karar da yer alıyor ve bu karar müze kayıtlarına aktarılmadı."
  id: "Artikel Wikipedia berbahasa Arab tentang pewaris agama Muhammad: menggambarkannya sebagai pengganti ajaran \"Bangsa Islam\" dengan ide-ide yang mirip dengan Islam Sunni yang umum di Timur, mengklasifikasikannya di antara \"Muslim Sunni Amerika\"; artikel tersebut juga memuat putusan editorial sektarian tentang transformasinya yang tidak dipindahkan ke arsip museum."
