  ar: "مقالة ويكيبيديا العربية عن وارث الدين محمد: تصفه بأنه استبدل بتعاليم «أمة الإسلام» أفكارًا قريبة من الإسلام السني الشائع في المشرق، وتصنّفه ضمن «مسلمون سنة أمريكيون»؛ وتحمل المقالة أيضًا حكمًا تحريريًا مذهبيًا على تحوّله لم يُنقل إلى سجلّ المتحف."
  en: "The Arabic Wikipedia article on Warith Deen Mohammed: it states that he replaced the Nation of Islam's teachings with ideas close to the Sunni Islam widespread in the East, and files him under 'American Sunni Muslims'; the article also carries a sectarian editorial verdict on his transformation, which the museum record does not reproduce."
