  ar: "مقالة ويكيبيديا العربية عن جمال بلماضي؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في شامبيني سور مارن بفرنسا سنة 1976، وتسرد مسيرته لاعبًا مع أندية فرنسية وإنجليزية وقطرية ودوليًا مع الجزائر، ومدربًا للخويا والجزائر التي فاز معها بكأس أمم أفريقيا 2019."
  en: "Arabic Wikipedia article on Djamel Belmadi; used for entity facts only. It confirms his birth in Champigny-sur-Marne, France, in 1976, and lists his playing career with French, English and Qatari clubs and with Algeria, and his management of Lekhwiya and of the Algeria team that won the 2019 Africa Cup of Nations."
