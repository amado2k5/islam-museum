  ar: مقالة ويكيبيديا الإنجليزية عن إسرار أحمد؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في حصار في 26 أبريل 1932 ووفاته في لاهور في 14 أبريل 2010، وبكالوريوس الطب (1954) والماجستير في الدراسات الإسلامية (1965)، وانفصاله عن الجماعة الإسلامية، وتأسيسه تنظيم إسلامي، ووسام ستارة امتياز (1981).
  en: English Wikipedia article on Israr Ahmed; used for entity facts only. It gives his birth in Hisar on 26 April 1932 and his death in Lahore on 14 April 2010, his MBBS (1954) and master's in Islamic studies (1965), his break with Jamaat-e-Islami, his founding of Tanzeem-e-Islami, and his Sitara-i-Imtiaz (1981).
