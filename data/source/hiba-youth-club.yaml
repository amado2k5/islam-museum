summary:
  ar: "مقابلة مجلة «هبة» مع راجا ضياء، أمير «يوث كلوب»، يروي فيها أن النادي كان فكرة مجموعة من الأخوات المتفانيات، وأنه صار منظمة غير ربحية مقرها إسلام آباد ولاهور تنظم الدعوة في الشوارع وورش العمل والحلقات الأسبوعية ومحاضرات الجامعات ومؤتمرا سنويا."
  en: "Hiba Magazine's interview with Raja Zia, ameer of Youth Club, in which he says the club was the brainchild of a group of very dedicated sisters and grew into a non-profit organisation based in Islamabad and Lahore running street dawah, workshops, weekly halaqahs, university lectures and an annual conference."
