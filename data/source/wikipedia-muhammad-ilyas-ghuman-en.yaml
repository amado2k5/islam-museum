summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد إلياس غمن، كما قُرئت في 5 نوفمبر 2026."
  en: "English Wikipedia biographical article on Muhammad Ilyas Ghumman, read on 5 November 2026. Its prose describes him as 'a leading Hanafi Maturidi theologian', gives his birth as 12 April 1969 in Sargodha, his study at Jamia Binoria Karachi, his discipleship under Azizur Rahman Hazarvi, his headship of Markaz Ahle Sunnat wal Jamaat in Sargodha and his role as Director & CEO of Ahnaf Media Services, and records his arrests in 2005, 2006 and 2013 citing Pakistani press reports."
  es: "Artículo biográfico de la Wikipedia en inglés sobre Muhammad Ilyas Ghumman, leído el 5 de noviembre de 2026. Su prosa lo describe como \"un destacado teólogo Hanafi Maturidi\", indica su nacimiento el 12 de abril de 1969 en Sargodha y su papel como Director y CEO de Ahnaf Media Services, y registra sus arrestos en 2005, 2006 y 2013 citando informes de la prensa pakistaní."
  fr: "Article biographique de Wikipédia en anglais sur Muhammad Ilyas Ghumman, consulté le 5 novembre 2026. Son texte le décrit comme « un théologien hanafite maturidi de premier plan », indique sa naissance le 12 avril 1969 à Sargodha, son rôle de directeur général d'Ahnaf Media Services et relate ses arrestations en 2005, 2006 et 2013, citant des articles de presse pakistanais."
  ur: "محمد الیاس گھمن پر انگریزی ویکیپیڈیا کا سوانحی مضمون، جو 5 نومبر 2026 کو پڑھا گیا تھا۔ اس کی نثر میں انہیں 'ایک معروف حنفی ماتریدی ماہر الہیات' کے طور پر بیان کیا گیا ہے، ان کی پیدائش 12 اپریل 1969 کو سرگودھا میں ہوئی تھی اور احناف میڈیا سروسز کے ڈائریکٹر اور سی ای او کے طور پر ان کا کردار، اور 2020 میں ان کی گرفتاری اور 2020 گرفتاریاں ریکارڈ کی گئی ہیں۔ پاکستانی اخباری رپورٹس کا حوالہ دیتے ہوئے"
