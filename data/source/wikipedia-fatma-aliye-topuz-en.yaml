reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers her birth at Istanbul on 9 October 1862 to Ahmed Cevdet Pasha and Adviye Rabia Hanım, her home education in Arabic and French, her marriage at seventeen to Mehmet Faik Bey and her four daughters, her debut translation Meram (1889/1890) under the pen name 'Bir Hanım', the co-authored Hayal ve Hakikat (dated 1894 here, 1891 in the Turkish and Arabic articles), Muhazarat (1892), Udi (1899), her thirteen years of columns in Hanımlara Mahsus Gazete (1895–1908), Nisvan-ı İslam (dated 1896 here, 1892 in the Turkish article), her charity of 1897 and the Order of Charity (1899), her book on her father (1914), her daughter Zübeyde İsmet's conversion, her adoption of the surname Topuz after 1934, her death at Istanbul on 13 July 1936 and burial at Feriköy Cemetery, and the 2009 banknote controversy. It names no madhhab for her. Read in full on 24 October 2026."
