  ar: 'حيثيات جامعة نيلسون مانديلا لمنح امتياز سليمان الدكتوراه الفخرية سنة 2016: وُلد سنة 1962 في بوتشيفستروم، ودرس فيها وفي كلية ساستري بدربن، وتأهل طبيبًا في كلية طب جامعة ناتال سنة 1984، وهو مؤسس ومدير «غيفت أوف ذا غيفرز» (تأسست 1992)، وحاصل على وسام الباوباب الفضي (2010) ووسام نجمة جنوب أفريقيا.'
  en: 'Nelson Mandela University''s citation for Imtiaz Sooliman''s 2016 honorary doctorate: born in 1962 in Potchefstroom, schooled there and at Sastri College in Durban, qualified as a medical doctor at the University of Natal Medical School in 1984, founder and director of Gift of the Givers (founded 1992), holder of the Order of the Baobab in Silver (2010) and the Order of the Star of South Africa.'
