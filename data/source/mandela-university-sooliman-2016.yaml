  en: Imtiaz Sooliman 2016 — Nelson Mandela University honorary doctorate citation
summary:
  ar: 'حيثيات جامعة نيلسون مانديلا لمنح امتياز سليمان الدكتوراه الفخرية سنة 2016: وُلد سنة 1962 في بوتشيفستروم، ودرس فيها وفي كلية ساستري بدربن، وتأهل طبيبًا في كلية طب جامعة ناتال سنة 1984، وهو مؤسس ومدير «غيفت أوف ذا غيفرز» ⁦(تأسست 1992)⁩، وحاصل على وسام الباوباب الفضي (2010) ووسام نجمة جنوب أفريقيا.'
  en: 'Nelson Mandela University''s citation for Imtiaz Sooliman''s 2016 honorary doctorate: born in 1962 in Potchefstroom, schooled there and at Sastri College in Durban, qualified as a medical doctor at the University of Natal Medical School in 1984, founder and director of Gift of the Givers (founded 1992), holder of the Order of the Baobab in Silver (2010) and the Order of the Star of South Africa.'
  es: "Mención de la Universidad Nelson Mandela para el doctorado honoris causa de Imtiaz Sooliman en 2016: nació en 1962 en Potchefstroom, estudió allí y en el Sastri College de Durban, se graduó como médico en la Facultad de Medicina de la Universidad de Natal en 1984, es fundador y director de Gift of the Givers (fundada en 1992), y posee la Orden del Baobab en Plata (2010) y la Orden de la Estrella de Sudáfrica."
  fr: "Citation de l'Université Nelson Mandela pour le doctorat honorifique d'Imtiaz Sooliman en 2016: né en 1962 à Potchefstroom, scolarisé dans cette ville et au Sastri College de Durban, diplômé médecin de l'Université du Natal en 1984, fondateur et directeur de Gift of the Givers (fondé en 1992), titulaire de l'Ordre du Baobab en argent (2010) et de l'Ordre de l'Étoile d'Afrique du Sud."
  ur: "امتیاز سلیمان کی 2016 کی اعزازی ڈاکٹریٹ کے لیے نیلسن منڈیلا یونیورسٹی کا حوالہ: 1962 میں پوٹچفسٹروم میں پیدا ہوئے، وہیں اور ڈربن کے ساستری کالج میں تعلیم حاصل کی، 1984 میں یونیورسٹی آف نیٹل میڈیکل اسکول میں میڈیکل ڈاکٹر کے طور پر کوالیفائی کیا، گفٹ آف دی گیورز کے بانی اور ڈائریکٹر ⁦(1999 میں بانی)⁩۔ (2010) اور آرڈر آف دی اسٹار آف ساؤتھ افریقہ۔"
  tr: "Nelson Mandela Üniversitesi'nin 2016'da Suleiman Fahri Doktora unvanını verme gerekçesi: 1962'de Potchefstroom'da doğdu, orada ve Durban'daki Sastry College'da eğitim gördü, 1984'te Natal Üniversitesi Tıp Fakültesi'nde doktorluk diploması aldı, Gift of the Givers'ın (1992'de kuruldu) kurucusu ve direktörü olup, Gümüş Baobab Madalyası (2010) ve Güney Afrika Yıldızı'nın sahibidir."
  id: "Alasan Universitas Nelson Mandela memberikan Gelar Doktor Kehormatan Suleiman pada tahun 2016: Lahir pada tahun 1962 di Potchefstroom, belajar di sana dan di Sastry College di Durban, meraih kualifikasi sebagai doktor di Fakultas Kedokteran Universitas Natal pada tahun 1984, adalah pendiri dan direktur Gift of the Givers (didirikan tahun 1992), serta penerima Medali Baobab Perak (2010) dan Bintang Afrika Selatan."
