  ar: "مقالة ويكيبيديا الإنجليزية عن ميدو (أحمد حسام)؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته المتنقلة بين الزمالك وغينت وأياكس ومرسيليا وروما وتوتنهام وميدلزبره وغيرها، و51 مباراة دولية مع مصر، ومسيرته التدريبية بعد الاعتزال، وتروي تعرضه لعبارات معادية للإسلام في نيوكاسل سنة 2007 وتدرجه في تصنيف «مسلمون مصريون» دون أن تذكر دينه في نصها أو تسمّي له مذهبًا."
  en: "English Wikipedia article on Mido (Ahmed Hossam); used for entity facts only. It recounts his much-travelled career through Zamalek, Gent, Ajax, Marseille, Roma, Tottenham and Middlesbrough among others, his 51 Egypt caps, and his post-retirement coaching career; it reports the Islamophobic abuse aimed at him at Newcastle in 2007 and files him under 'Egyptian Muslims', without stating his religion in its text or naming any school."
