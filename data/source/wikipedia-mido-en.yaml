reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id. It gives his full name as Ahmed Hossam Hussein Abdel Hamid Wasfi, born 23 February 1983 in Cairo; his club career from Zamalek through Gent, Ajax, Celta Vigo (loan), Marseille, Roma, Tottenham, Middlesbrough, Wigan (loan), Zamalek (loan), West Ham (loan), Ajax and Zamalek again to Barnsley; 51 Egypt caps and 19 goals; and his managerial career from 2014. Its personal-life section covers his father Hossam Wasfi, his marriage and his weight loss; the only religion-adjacent passage reports Islamophobic abuse from Newcastle supporters in 2007. No school is named."
