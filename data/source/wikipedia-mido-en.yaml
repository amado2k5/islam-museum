summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميدو ⁦(أحمد حسام)⁩؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته المتنقلة بين الزمالك وغينت وأياكس ومرسيليا وروما وتوتنهام وميدلزبره وغيرها، و51 مباراة دولية مع مصر، ومسيرته التدريبية بعد الاعتزال، وتروي تعرضه لعبارات معادية للإسلام في نيوكاسل سنة 2007 وتدرجه في تصنيف «مسلمون مصريون» دون أن تذكر دينه في نصها أو تسمّي له مذهبًا."
  en: "English Wikipedia article on Mido (Ahmed Hossam); used for entity facts only. It recounts his much-travelled career through Zamalek, Gent, Ajax, Marseille, Roma, Tottenham and Middlesbrough among others, his 51 Egypt caps, and his post-retirement coaching career; it reports the Islamophobic abuse aimed at him at Newcastle in 2007 and files him under 'Egyptian Muslims', without stating his religion in its text or naming any school."
  es: "Artículo de la Wikipedia en inglés sobre Mido (Ahmed Hossam); utilizado únicamente para datos sobre la persona. Relata su dilatada trayectoria profesional, que lo llevó a jugar en equipos como Zamalek, Gent, Ajax, Marsella, Roma, Tottenham y Middlesbrough, entre otros, sus 51 partidos con la selección egipcia y su carrera como entrenador tras su retirada. Informa sobre los insultos islamófobos que sufrió en Newcastle en 2007 y lo clasifica como \"musulmán egipcio\", sin mencionar su religión ni nombrar ninguna escuela."
  fr: "Article Wikipédia en anglais sur Mido (Ahmed Hossam); utilisé uniquement à titre informatif. Il retrace sa carrière internationale, marquée par de nombreux transferts à Zamalek, La Gantoise, l’Ajax, Marseille, la Roma, Tottenham et Middlesbrough, entre autres, ses 51 sélections en équipe nationale d’Égypte et sa reconversion comme entraîneur. Il mentionne les actes d’islamophobie dont il a été victime à Newcastle en 2007 et le classe dans la catégorie « Musulmans égyptiens », sans préciser sa religion ni citer d’établissement scolaire."
  ur: "Mido ⁦(احمد حسام)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں زمالیک، جینٹ، ایجیکس، مارسیل، روما، ٹوٹنہم اور مڈلزبرو کے ذریعے ان کے بہت زیادہ سفر کیے گئے کیریئر کا ذکر ہے، ان کے 51 مصری کیپس، اور ان کے ریٹائرمنٹ کے بعد کے کوچنگ کیریئر؛ یہ 2007 میں نیو کیسل میں اس کے ساتھ ہونے والے اسلامو فوبک بدسلوکی کی رپورٹ کرتا ہے اور اسے 'مصری مسلمان' کے تحت فائل کرتا ہے، اس کے متن میں اس کا مذہب بتائے بغیر یا کسی اسکول کا نام لیے بغیر۔"
