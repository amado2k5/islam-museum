  ar: "رابط «جامع الدروس العربية» في المكتبة الشاملة كما ورد في ملخص بحثي قُدّم إلى المتحف؛ لم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص دون إعادة تحقق في 21 نوفمبر 2026، في موضوع: وجود الكتاب في المكتبة الشاملة."
