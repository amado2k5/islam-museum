  ar: "مقالة ويكيبيديا الإنجليزية عن عاصم إعجاز خواجة؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في لندن لأبوين طبيبين من أصل كشميري ونشأته في نيجيريا وباكستان وتعليمه ومنصبه في هارفارد واستقالته سنة 2018 من المجلس الاستشاري الاقتصادي احتجاجا على إقالة عاطف ميان، ولا تذكر أي تاريخ ميلاد ولا أي انتماء ديني."
  en: "English Wikipedia article on Asim Ijaz Khwaja; used for entity facts only. It records his London birth to physician parents of Kashmiri descent, his upbringing in Nigeria and Pakistan, his MIT and Harvard education, his Harvard professorship and his 2018 resignation from Pakistan's Economic Advisory Council in protest at Atif Mian's removal. It gives no birth date — the article files him under 'Year of birth missing (living people)' — and no religion content."
