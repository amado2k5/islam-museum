  ar: "مقالة ويكيبيديا الإنجليزية عن شعيب أختر (مواليد 1975)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في راولبندي في 13 أغسطس 1975، ومسيرته مع باكستان (178 ويكيت اختبار و247 ويكيت ليوم واحد بين 1997 و2011)، وأسرع كرة مسجلة في تاريخ الكريكت (161.3 كم/ساعة في كأس العالم 2003)، والجدل الذي رافق مسيرته واعتزاله بعد كأس العالم 2011 وعمله معلقا وصاحب قناة يوتيوب."
  en: "English Wikipedia article on Shoaib Akhtar (born 1975); used for entity facts only. It records his birth in Rawalpindi on 13 August 1975, his Pakistan career (178 Test wickets and 247 ODI wickets, 1997–2011), the fastest recorded delivery in cricket history (161.3 km/h at the 2003 World Cup), the controversies of his career, his retirement after the 2011 World Cup and his later work as a commentator and YouTube presenter. The article names no religion or school for him; it describes his father as very religious, which is family background."
