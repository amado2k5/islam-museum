summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شعيب أختر ⁦(مواليد 1975)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في راولبندي في 13 أغسطس 1975، ومسيرته مع باكستان ⁦(178 ويكيت اختبار و247 ويكيت ليوم واحد بين 1997 و2011)⁩، وأسرع كرة مسجلة في تاريخ الكريكت ⁦(161.3 كم/ساعة في كأس العالم 2003)⁩، والجدل الذي رافق مسيرته واعتزاله بعد كأس العالم 2011 وعمله معلقا وصاحب قناة يوتيوب."
  en: "English Wikipedia article on Shoaib Akhtar (born 1975); used for entity facts only. It records his birth in Rawalpindi on 13 August 1975, his Pakistan career (178 Test wickets and 247 ODI wickets, 1997–2011), the fastest recorded delivery in cricket history (161.3 km/h at the 2003 World Cup), the controversies of his career, his retirement after the 2011 World Cup and his later work as a commentator and YouTube presenter. The article names no religion or school for him; it describes his father as very religious, which is family background."
  es: "Artículo de la Wikipedia en inglés sobre Shoaib Akhtar (nacido en 1975); utilizado únicamente para datos sobre la persona. Registra su nacimiento en Rawalpindi el 13 de agosto de 1975, su carrera con Pakistán (178 wickets en Test y 247 en ODI, 1997-2011), el lanzamiento más rápido registrado en la historia del críquet (161,3 km/h en la Copa del Mundo de 2003), las controversias de su carrera, su retiro tras la Copa del Mundo de 2011 y su trabajo posterior como comentarista y presentador de YouTube. El artículo no menciona su religión ni la escuela a la que asistió; describe a su padre como muy religioso, lo cual forma parte de su entorno familiar."
  fr: "Article de Wikipédia en anglais sur Shoaib Akhtar (né en 1975); utilisé uniquement à des fins d'information. Il relate sa naissance à Rawalpindi le 13 août 1975, sa carrière internationale avec le Pakistan (178 guichets en Test et 247 en ODI, 1997-2011), le lancer le plus rapide de l'histoire du cricket (161,3 km/h lors de la Coupe du monde 2003), les controverses qui ont jalonné sa carrière, sa retraite après la Coupe du monde 2011 et son travail ultérieur de commentateur et de présentateur sur YouTube. L'article ne mentionne ni sa religion ni son école; il décrit son père comme très religieux, ce qui constitue son contexte familial."
  ur: "شعیب اختر ⁦(پیدائش 1975)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 13 اگست 1975 کو راولپنڈی میں ان کی پیدائش، ان کا پاکستانی کیریئر ⁦(178 ٹیسٹ وکٹیں اور 247 ون ڈے وکٹیں، 1997-2011)⁩، کرکٹ کی تاریخ میں سب سے تیز رفتار ڈیلیوری ⁦(2003 ورلڈ کپ میں 161.3 کلومیٹر فی گھنٹہ)⁩، ان کے کیریئر کے تنازعات اور یوٹیوب کے عالمی کپ کے بعد ان کی ریٹائرمنٹ اور ورلڈ کپ 1 سے ریٹائر ہونے کے بعد ان کے کام کے تنازعات درج ہیں۔ پیش کنندہ مضمون میں اس کے لیے کسی مذہب یا مکتب کا نام نہیں ہے۔ یہ اس کے والد کو بہت مذہبی طور پر بیان کرتا ہے، جو خاندانی پس منظر ہے۔"
  tr: "Shoaib Akhtar (d. 1975) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 13 Ağustos 1975'te Rawalpindi'de doğdu ve Pakistan'daki kariyeri (1997-2011 arasında 178 Test wicket ve 247 tek günlük wicket), kriket tarihindeki en hızlı top (2003 Dünya Kupası'nda 161,3 km/s), kariyerine eşlik eden tartışmalar ve 2011 Dünya Kupası sonrası emekliliği, ayrıca yorumcu ve YouTube kanalı sahibi olarak çalışmaları üzerine çıktı."
  id: "Artikel Wikipedia bahasa Inggris tentang Shoaib Akhtar (lahir 1975); digunakan hanya untuk fakta entitas. Ia lahir di Rawalpindi pada 13 Agustus 1975, dan kariernya bersama Pakistan (178 wicket Test dan 247 wicket satu hari antara 1997 dan 2011), bola tercepat yang pernah tercatat dalam sejarah kriket (161,3 km/jam di Piala Dunia 2003), kontroversi yang menyertai kariernya dan pensiun setelah Piala Dunia 2011, serta pekerjaannya sebagai komentator dan pemilik saluran YouTube."
