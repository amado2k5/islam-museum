summary:
  ar: "مقالة ويكيبيديا الإنجليزية المطولة عن الشيخ زايد بن خليفة آل نهيان «زايد الكبير» (نحو 1835 أو 1840 – 19 مايو 1909)، حاكم أبوظبي من 1855 إلى وفاته؛ تروي إفشاله عودة سعيد بن طحنون سنة 1856، وحملة 1867 على الدوحة والوكرة، ومقتله خالد بن سلطان القاسمي في نزال فردي سنة 1868، وطرد السعوديين من البريمي سنة 1870، وحرب قطر في الثمانينيات ومعركة خنور 1889، واتفاق 1892 مع بريطانيا، واجتماعات شيوخ الساحل المتصالح 1905–1906."
  en: "Long English Wikipedia article on Sheikh Zayed bin Khalifa Al Nahyan, 'Zayed the Great' (c. 1835 or 1840 – 19 May 1909), ruler of Abu Dhabi from 1855 until his death; it recounts his defeat of Saeed bin Tahnun's attempted return in 1856, the 1867 expedition against Doha and Wakrah, his killing of Sharjah's ruler Khalid bin Sultan in single combat in 1868, the expulsion of the Saudis from Buraimi in 1870, the Qatar war of the 1880s and the Battle of Khannour in 1889, the 1892 agreement with Britain, and the Trucial sheikhs' meetings of 1905–1906."
