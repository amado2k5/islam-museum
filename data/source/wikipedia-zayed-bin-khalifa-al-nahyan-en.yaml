summary:
  ar: "مقالة ويكيبيديا الإنجليزية المطولة عن الشيخ زايد بن خليفة آل نهيان «زايد الكبير» ⁦(نحو 1835 أو 1840 – 19 مايو 1909)⁩، حاكم أبوظبي من 1855 إلى وفاته؛ تروي إفشاله عودة سعيد بن طحنون سنة 1856، وحملة 1867 على الدوحة والوكرة، ومقتله خالد بن سلطان القاسمي في نزال فردي سنة 1868، وطرد السعوديين من البريمي سنة 1870، وحرب قطر في الثمانينيات ومعركة خنور 1889، واتفاق 1892 مع بريطانيا، واجتماعات شيوخ الساحل المتصالح 1905–1906."
  en: "Long English Wikipedia article on Sheikh Zayed bin Khalifa Al Nahyan, 'Zayed the Great' (c. 1835 or 1840 – 19 May 1909), ruler of Abu Dhabi from 1855 until his death; it recounts his defeat of Saeed bin Tahnun's attempted return in 1856, the 1867 expedition against Doha and Wakrah, his killing of Sharjah's ruler Khalid bin Sultan in single combat in 1868, the expulsion of the Saudis from Buraimi in 1870, the Qatar war of the 1880s and the Battle of Khannour in 1889, the 1892 agreement with Britain, and the Trucial sheikhs' meetings of 1905–1906."
  es: "Artículo extenso en la Wikipedia en inglés sobre el jeque Zayed bin Khalifa Al Nahyan, 'Zayed el Grande' (c. 1835 o 1840 – 19 de mayo de 1909), gobernante de Abu Dhabi desde 1855 hasta su muerte; relata su derrota del intento de regreso de Saeed bin Tahnun en 1856, la expedición de 1867 contra Doha y Wakrah, su asesinato del gobernante de Sharjah, Khalid bin Sultan, en combate singular en 1868, la expulsión de los saudíes de Buraimi en 1870, la guerra de Qatar de la década de 1880 y la batalla de Khannour en 1889, el acuerdo de 1892 con Gran Bretaña y las reuniones de los jeques de la Tregua de 1905-1906."
  fr: "Long article de Wikipédia en anglais sur le cheikh Zayed bin Khalifa Al Nahyan, dit « Zayed le Grand » (vers 1835 ou 1840 – 19 mai 1909), souverain d'Abu Dhabi de 1855 jusqu'à sa mort; il relate sa défaite face à la tentative de retour de Saeed bin Tahnun en 1856, l'expédition de 1867 contre Doha et Wakrah, son assassinat du souverain de Sharjah, Khalid bin Sultan, en combat singulier en 1868, l'expulsion des Saoudiens de Buraimi en 1870, la guerre du Qatar des années 1880 et la bataille de Khannour en 1889, l'accord de 1892 avec la Grande-Bretagne et les réunions des cheikhs de la Trêve de 1905-1906."
  ur: "شیخ زاید بن خلیفہ النہیان پر طویل انگریزی ویکیپیڈیا مضمون، 'زاید عظیم' ⁦(c. 1835 یا 1840 - 19 مئی 1909)⁩، ابوظہبی کے حکمران 1855 سے اپنی موت تک؛ اس میں سعید بن تہنون کی 1856 میں واپسی کی کوشش، دوحہ اور وقارہ کے خلاف 1867 کی مہم، 1868 میں شارجہ کے حکمران خالد بن سلطان کو ایک ہی لڑائی میں قتل کرنے، 1870 میں بریمی سے سعودیوں کی بے دخلی، 1870 میں قطر کی جنگ اور 1800 میں قطر کی جنگ میں شکست کا ذکر ہے۔ 1889، برطانیہ کے ساتھ 1892 کا معاہدہ، اور 1905-1906 کے شیخوں کی ملاقاتیں۔"
  tr: "1855'ten ölümüne kadar Abu Dabi hükümdarı olan Şeyh Zayed bin Halife Al Nahyan \"Büyük Zayed\" (yaklaşık 1835 veya 1840 – 19 Mayıs 1909) hakkında kapsamlı İngilizce Wikipedia makalesi; 1856'da Said bin Tahnoun'un dönüşündeki başarısızlığını, 1867'de Doha ve Al Wakhrah seferini, 1868'de Khalid bin Sultan Al Qasimi'nin solo maçta öldürülmesini, 1870'te Suudilerin Al Buraimi'den sürülmesini, 1880'lerde Katar Savaşı'nı, 1889'daki Khanoor Muharebesi'ni, 1892'de Britanya ile yapılan anlaşmayı ve Trucial Kıyısı Trucial Şeyhlerinin 1905–1906 toplantılarını anlatır."
  id: "Artikel Wikipedia bahasa Inggris yang luas tentang Sheikh Zayed bin Khalifa Al Nahyan \"Zayed yang Agung\" (sekitar 1835 atau 1840 – 19 Mei 1909), penguasa Abu Dhabi dari tahun 1855 hingga kematiannya; menceritakan kegagalannya dalam pengembalian Said bin Tahnoun pada tahun 1856, kampanye tahun 1867 di Doha dan Al Wakrah, pembunuhan Khalid bin Sultan Al Qasimi dalam pertandingan solo pada tahun 1868, pengusiran pasukan Saudi dari Al Buraimi pada tahun 1870, Perang Qatar pada tahun 1880-an, Pertempuran Khanoor pada tahun 1889, perjanjian tahun 1892 dengan Inggris, dan pertemuan para Sheikh Trucial dari Pantai Trucial tahun 1905–1906."
