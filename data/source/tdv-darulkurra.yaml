label:
  ar: "دار القرّاء — موسوعة TDV الإسلامية ⁦(بوزكورت، تانمان)⁩"
  en: "DÂRÜLKURRÂ (house of the reciters) — TDV İslâm Ansiklopedisi (Nebi Bozkurt, M. Baha Tanman)"
summary:
  ar: "مدخل «دار القرّاء» في موسوعة TDV الإسلامية: مدارس تحفيظ القرآن وتعليم القراءات من بيت محرمة بن نوفل في المدينة ودروس الجامع الأموي إلى مشيخة القراءة ومشيخة الجند ودور القرّاء المستقلة في دمشق ثم نظام الدار في العمارة العثمانية."
  en: "The TDV İslâm Ansiklopedisi entry on the dar al-qurra: the schools where the Qur'an was memorised and the readings taught, from Mahrama ibn Nawfal's house in Medina and the Umayyad Mosque study circles to the mashikhat al-qiraa and mashikhat al-jund, the independent dar al-qurra institutions of Damascus, and the Ottoman darülkurra."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el dar al-qurra: las escuelas donde se memorizaba el Corán y se enseñaban las lecturas, desde la casa de Mahrama ibn Nawfal en Medina y los círculos de estudio de la Mezquita Omeya hasta el mashikhat al-qiraa y el mashikhat al-jund, las instituciones independientes dar al-qurra de Damasco y el darülkurra otomano."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur le dar al-qurra: les écoles où le Coran était mémorisé et les lectures enseignées, depuis la maison de Mahrama ibn Nawfal à Médine et les cercles d'étude de la mosquée des Omeyyades jusqu'aux mashikhat al-qiraa et mashikhat al-jund, les institutions indépendantes dar al-qurra de Damas, et le darülkurra ottoman."
  ur: "دارالقرہ پر TDV İslâm Ansiklopedisi کا اندراج: وہ اسکول جہاں قرآن حفظ کیا جاتا تھا اور پڑھایا جاتا تھا، مدینہ میں محرمہ بن نوفل کے گھر اور اموی مسجد کے مطالعاتی حلقوں سے لے کر مشیخت القراء اور مشیخۃ القراء، دارالعوام، دارالعوام، دارالخلافہ کے مشائخ۔ عثمانی دارالقرہ۔"
  tr: "TDV İslami Ansiklopedisi'nde 'Dar al-Kurra'ya giriş: Medine'deki Muharrem ibn Nevfal'in Evinden Kur'an Ezberleme ve Öğretim Kreat Okulları, Emevi Camii'nin Okuma Şeyhliği, Askerler Şeyhliği ve Şam'daki bağımsız şiir evleri, ardından Osmanlı mimarisindeki Dar sistemi."
  id: "Pengantar 'Dar al-Qurra' dalam Ensiklopedia Islam TDV: Sekolah untuk Menghafal dan Mengajarkan Qira'at Al-Qur'an dari Rumah Muharramah ibn Nawfal di Madinah, serta pelajaran Masjid Umayyah untuk Sheikhdom Reading, Sheikhdom para Prajurit, dan rumah pembaca independen di Damaskus, kemudian sistem Dar dalam arsitektur Ottoman."
