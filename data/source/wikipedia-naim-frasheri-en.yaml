reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 25 May 1846 at Frashër into a wealthy Albanian family 'of religious belief affiliated with the Bektashi tariqa of Islam', one of eight children of Halid Frashëri (1797–1859) and Emine (1814–1861); educated at the Frashër tekke and, after the family moved to Ioannina in 1865, at the Zosimaia school, finishing in 1870; clerk at Berat and Saranda (1872–1877), leaving for treatment at Baden in 1876; co-founder in 1879 of the Society for the Publication of Albanian Writings in Istanbul; behind-the-scenes editor of the magazine Drita (1884); textbooks written with Sami for the Albanian school at Korçë; died at Istanbul in 1900, his remains later sent to Albania — the article dates the Turkish permission only to 'the 1950s', against the Albanian article's dated account of a transfer on 2 June 1937, and the conflict is recorded in the record. On faith it is one of three independent attestations of his own affiliation: 'Himself a Bektashi, he desired purity of the Albanian language and had attempted in his lifetime to Albanianise hierarchical terms of the order in his work Fletore e Bektashinjët', and his Fletore 'contains an introductory profession of his faith and ten spiritual poems'; he is 'the most representative writer of Sufi poetry in Albanian'. The works list dates Fletore e bektashinjët to 1895 (Elsie's biography gives 1896) and Qerbelaja to 1898 (the Arabic article's list gives 1894); both variants are recorded."
