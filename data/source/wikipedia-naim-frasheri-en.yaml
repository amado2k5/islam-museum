summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نعيم فراشري (1846-1900)؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في فراشر في 25 مايو 1846 ووفاته في إسطنبول في 20 أكتوبر 1900، وتصفه هو نفسه بأنه بكتاشي، وتعدّد أعماله الاثنين والعشرين في أربع لغات."
  en: "English Wikipedia article on Naim Frashëri (1846–1900); used for entity facts only. It gives his birth at Frashër on 25 May 1846 and death at Istanbul on 20 October 1900, calls him himself a Bektashi, and lists his twenty-two works in four languages."
  es: "Artículo de la Wikipedia en inglés sobre Naim Frashëri (1846-1900); utilizado únicamente para datos sobre la persona. Indica que nació en Frashër el 25 de mayo de 1846 y falleció en Estambul el 20 de octubre de 1900, se identifica como bektashi y enumera sus veintidós obras en cuatro idiomas."
  fr: "L'article de Wikipédia en anglais sur Naim Frashëri (1846-1900) est utilisé uniquement pour les informations le concernant. Il indique sa naissance à Frashër le 25 mai 1846 et sa mort à Istanbul le 20 octobre 1900, le qualifie de Bektashi et recense ses vingt-deux œuvres en quatre langues."
  ur: "نعیم فریشری (1846-1900) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 25 مئی 1846 کو فریشر میں اس کی پیدائش اور 20 اکتوبر 1900 کو استنبول میں وفات پاتا ہے، اسے اپنے آپ کو بیکتاشی کہتا ہے، اور چار زبانوں میں ان کے بائیس کاموں کی فہرست دیتا ہے۔"
  tr: "Naeem Frashri (1846-1900) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın kayıtları için kullanılmıştır. 25 Mayıs 1846'da Fraser'da doğduğu ve 20 Ekim 1900'de İstanbul'da öldüğü belirtilir; kendisi de onu Bektaşi olarak tanımlar; dört dilde yirmi iki eseriyle birlikte."
  id: "Artikel Wikipedia bahasa Inggris tentang Naeem Frashri (1846-1900); hanya digunakan untuk catatan entitas. Ia disebutkan lahir di Fraser pada 25 Mei 1846, dan meninggal di Istanbul pada 20 Oktober 1900, dan ia sendiri menggambarkannya sebagai Bektashi, dengan dua puluh dua karyanya dalam empat bahasa."
