summary:
  ar: "مقالة ويكيبيديا العربية عن خليفة بن زايد آل نهيان؛ تُستخدم لوقائع الكيان فقط. سيرة مفصلة: ولادته بقلعة المويجعي في العين في 7 سبتمبر 1948، ومناصبه من ممثل الحاكم في المنطقة الشرقية وولي عهد أبوظبي إلى نائب رئيس الوزراء ونائب القائد الأعلى، ثم توليه حكم أبوظبي ورئاسة الدولة في نوفمبر 2004 حتى وفاته في 13 مايو 2022. ولا يحمل صندوق معلوماتها ⁦(قالب صاحب منصب)⁩ حقلًا للدين، ولا يذكر متنها مدرسة له."
  en: "Arabic Wikipedia article on Khalifa bin Zayed Al Nahyan; used for entity facts only. A detailed biography: born at Al Muwaiji fort in Al Ain on 7 September 1948; his offices from ruler's representative in the Eastern Region and crown prince of Abu Dhabi to deputy prime minister and deputy supreme commander; then ruler of Abu Dhabi and president from November 2004 until his death on 13 May 2022. Its officeholder infobox carries no religion field and no text in it names a school for him."
  es: "Artículo de Wikipedia en árabe sobre Khalifa bin Zayed Al Nahyan; utilizado únicamente para datos sobre la persona. Biografía detallada: nació en el fuerte Al Muwaiji en Al Ain el 7 de septiembre de 1948; ocupó cargos desde representante del gobernante en la Región Oriental y príncipe heredero de Abu Dabi hasta viceprimer ministro y subcomandante supremo; luego fue gobernante de Abu Dabi y presidente desde noviembre de 2004 hasta su muerte el 13 de mayo de 2022. Su ficha informativa no incluye información sobre su religión ni menciona ninguna escuela a la que pertenezca."
  fr: "Article Wikipédia en arabe sur Khalifa bin Zayed Al Nahyan; utilisé uniquement pour les informations relatives à l'entité. Biographie détaillée: né au fort Al Muwaiji à Al Ain le 7 septembre 1948; ses fonctions, de représentant du souverain dans la région orientale et prince héritier d'Abou Dhabi à vice-Premier ministre et commandant suprême adjoint; puis souverain d'Abou Dhabi et président de novembre 2004 jusqu'à sa mort le 13 mai 2022. Son infobox ne mentionne ni religion ni établissement scolaire."
  ur: "خلیفہ بن زید النہیان پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ تفصیلی سوانح عمری: 7 ستمبر 1948 کو العین کے المویجی قلعے میں پیدا ہوئے۔ مشرقی علاقے میں حکمران کے نمائندے اور ابوظہبی کے ولی عہد سے لے کر نائب وزیراعظم اور ڈپٹی سپریم کمانڈر تک ان کے دفاتر؛ پھر ابوظہبی کے حکمران اور نومبر 2004 سے لے کر 13 مئی 2022 کو اپنی موت تک صدر رہے۔ اس کے آفس ہولڈر انفو باکس میں کوئی مذہب نہیں ہے اور نہ ہی اس میں کوئی متن اس کے لیے اسکول کا نام ہے۔"
  tr: "Halife bin Zayed Al Nahyan hakkında Arapça Wikipedia makalesi; yalnızca varlık bilgileri için kullanılmıştır. Detaylı biyografi: 7 Eylül 1948'de Al Ain'deki Al Muwaiji Kalesi'nde doğdu ve Doğu Eyaleti hükümdarının temsilcisi ve Abu Dabi Veliaht Prensi olarak Başbakan Yardımcısı ve Yüksek Komutan Yardımcısı pozisyonlarında bulundu, ardından Kasım 2004'te Abu Dabi'nin yönetimini ve devlet başkanını devraldı ve 13 Mayıs 2022'deki ölümüne kadar devam etti. Bilgi kutusunda (görevli şablonu) bir din alanı yer almamakta ve kökeninden bir okuldan bahsedilmemektedir."
  id: "Artikel Wikipedia bahasa Arab tentang Khalifa bin Zayed Al Nahyan; digunakan hanya untuk fakta entitas. Biografi rinci: Lahir di Benteng Al Muwaiji di Al Ain pada 7 September 1948, dan memegang posisi dari perwakilan penguasa di Provinsi Timur dan Putra Mahkota Abu Dhabi hingga Wakil Perdana Menteri dan Wakil Panglima Tertinggi, kemudian mengambil alih pemerintahan Abu Dhabi dan kepala negara pada November 2004 hingga wafat pada 13 Mei 2022. Infobox (template pemegang jabatan) tidak memuat bidang agama, juga tidak menyebutkan aliran asalnya."
