summary:
  ar: "مقالة ويكيبيديا العربية عن خليفة بن زايد آل نهيان؛ تُستخدم لوقائع الكيان فقط. سيرة مفصلة: ولادته بقلعة المويجعي في العين في 7 سبتمبر 1948، ومناصبه من ممثل الحاكم في المنطقة الشرقية وولي عهد أبوظبي إلى نائب رئيس الوزراء ونائب القائد الأعلى، ثم توليه حكم أبوظبي ورئاسة الدولة في نوفمبر 2004 حتى وفاته في 13 مايو 2022. ولا يحمل صندوق معلوماتها (قالب صاحب منصب) حقلًا للدين، ولا يذكر متنها مدرسة له."
  en: "Arabic Wikipedia article on Khalifa bin Zayed Al Nahyan; used for entity facts only. A detailed biography: born at Al Muwaiji fort in Al Ain on 7 September 1948; his offices from ruler's representative in the Eastern Region and crown prince of Abu Dhabi to deputy prime minister and deputy supreme commander; then ruler of Abu Dhabi and president from November 2004 until his death on 13 May 2022. Its officeholder infobox carries no religion field and no text in it names a school for him."
