summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رافائيل أغاييف؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 4 مارس 1985 في سومقاييت، وخمسة ألقاب عالمية وأحد عشر لقباً أوروبياً في الكوميتيه وزن 75 كغ، وفضية أولمبياد طوكيو 2020، ولقب كاراتيه كومبات للوزن الوسط."
  en: "English Wikipedia article on Rafael Aghayev; used for entity facts only. It gives his birth on 4 March 1985 in Sumgait, his five world titles and eleven European titles in kumite at 75 kg, his silver medal at the Tokyo 2020 Olympics, and his Karate Combat welterweight title."
  es: "Artículo de la Wikipedia en inglés sobre Rafael Aghayev; utilizado únicamente para datos sobre la persona. Indica que nació el 4 de marzo de 1985 en Sumgait, que obtuvo cinco títulos mundiales y once títulos europeos en kumite en la categoría de 75 kg, su medalla de plata en los Juegos Olímpicos de Tokio 2020 y su título de peso wélter en Karate Combat."
  fr: "Article de Wikipédia en anglais sur Rafael Aghayev; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 4 mars 1985 à Sumgait, ses cinq titres mondiaux et onze titres européens en kumite dans la catégorie des 75 kg, sa médaille d’argent aux Jeux olympiques de Tokyo 2020 et son titre de champion de karaté de combat dans la catégorie des poids welters."
  ur: "رافیل آغائیف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 4 مارچ 1985 کو سمگائٹ میں اس کی پیدائش، 75 کلوگرام میں کمائٹ میں اس کے پانچ عالمی ٹائٹلز اور گیارہ یورپی ٹائٹلز، ٹوکیو 2020 اولمپکس میں اس کا چاندی کا تمغہ، اور اس کا کراٹے کمبیٹ ویلٹر ویٹ ٹائٹل۔"
  tr: "Rafael Agaev hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için kullanılmıştır. 4 Mart 1985'te Sumgayit'te doğdu ve 75 kg sıklet kategorisinde kumite dalında beş dünya ve on bir Avrupa şampiyonluğu, Tokyo 2020 Olimpiyatları'nda gümüş madalya ve orta sıklet kategorisinde karate dövüş unvanı kazandı."
  id: "Artikel Wikipedia bahasa Inggris tentang Rafael Agaev; hanya digunakan untuk fakta entitas. Ia lahir pada 4 Maret 1985 di Sumgayit, dan memenangkan lima gelar dunia serta sebelas gelar Eropa dalam kumite di kategori berat 75 kg, medali perak di Olimpiade Tokyo 2020, dan gelar karate combat di kategori kelas menengah."
