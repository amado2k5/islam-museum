summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن منوّر قاري (1878 – 1931)، المربّي الجديدي الأوزبكي في طشقند؛ تُستخدم لوقائع الكيان فقط. تتناول أسرته من علماء الإسلام وتعليمه في مدارس طشقند وبخارى وتأسيسه أول مدرسة بالطريقة الجديدة في طشقند سنة 1901 وكتبه الدراسية وصحفه ونفيه سنة 1925 وإعدامه سنة 1931."
  en: "English Wikipedia article on Munawwar Qari (1878 – 1931), the Uzbek Jadid educator of Tashkent; used for entity facts only. It covers his family of Islamic scholars, his madrasa education in Tashkent and Bukhara, his founding of Tashkent's first new-method school in 1901, his textbooks and newspapers, his deportation in 1925 and his execution in 1931."
  es: "Artículo de la Wikipedia en inglés sobre Munawwar Qari (1878-1931), el educador uzbeko Jadid de Tashkent; utilizado únicamente para datos sobre la persona. Abarca su familia de eruditos islámicos, su educación en madrasas de Tashkent y Bujará, la fundación de la primera escuela de nuevo método en Tashkent en 1901, sus libros de texto y periódicos, su deportación en 1925 y su ejecución en 1931."
  fr: "Article de Wikipédia en anglais sur Munawwar Qari (1878-1931), éducateur jadid ouzbek de Tachkent; utilisé uniquement à des fins d'information sur l'entité. Il aborde sa famille de savants islamiques, sa formation dans les madrasas de Tachkent et de Boukhara, la fondation par ce dernier de la première école de la nouvelle méthode à Tachkent en 1901, ses manuels et journaux, sa déportation en 1925 et son exécution en 1931."
  ur: "منور قاری (1878 - 1931) پر انگریزی ویکیپیڈیا مضمون، تاشقند کے ازبک جدید معلم؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے اسلامی اسکالرز کے خاندان، تاشقند اور بخارا میں ان کی مدرسہ تعلیم، 1901 میں تاشقند کے پہلے نئے طریقہ کار کے اسکول کی بنیاد، ان کی نصابی کتابیں اور اخبارات، 1925 میں ان کی جلاوطنی اور 1931 میں ان کی پھانسی شامل ہیں۔"
  tr: "Taşkent'teki yeni Özbek eğitimci Manwar Qari (1878–1931) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. İslam alimlerinden oluşan ailesi, Taşkent ve Buhara'daki okullardaki eğitimini, 1901'de Taşkent'teki ilk yeni okulu kurmasını, ders kitaplarını ve gazetelerini, 1925'teki sürgününü ve 1931'deki idamı kapsar."
  id: "Artikel Wikipedia bahasa Inggris tentang Manwar Qari (1878–1931), pendidik baru Uzbekistan di Tashkent; digunakan hanya untuk fakta entitas. Keluarga ulama Islamnya membahas pendidikannya di sekolah-sekolah Tashkent dan Bukhara, pendirian sekolah baru pertama di Tashkent pada tahun 1901, buku pelajaran dan surat kabarnya, pengasingannya pada tahun 1925, dan eksekusinya pada tahun 1931."
