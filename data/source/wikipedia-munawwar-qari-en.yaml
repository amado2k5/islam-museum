  ar: "مقالة ويكيبيديا الإنجليزية عن منوّر قاري (1878 – 1931)، المربّي الجديدي الأوزبكي في طشقند؛ تُستخدم لوقائع الكيان فقط. تتناول أسرته من علماء الإسلام وتعليمه في مدارس طشقند وبخارى وتأسيسه أول مدرسة بالطريقة الجديدة في طشقند سنة 1901 وكتبه الدراسية وصحفه ونفيه سنة 1925 وإعدامه سنة 1931."
  en: "English Wikipedia article on Munawwar Qari (1878 – 1931), the Uzbek Jadid educator of Tashkent; used for entity facts only. It covers his family of Islamic scholars, his madrasa education in Tashkent and Bukhara, his founding of Tashkent's first new-method school in 1901, his textbooks and newspapers, his deportation in 1925 and his execution in 1931."
