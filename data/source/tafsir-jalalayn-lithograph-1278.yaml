  en: "Tafsir al-Jalalayn — lithographed copy completed in mid-Sha'ban 1278 AH / 1862 (University of Toronto Library copy)"
  ur: "تفسیر الجلالین — پتھر کی طباعت کا نسخہ، وسطِ شعبان 1278ھ / 1862ء میں مکمل (یونیورسٹی آف ٹورنٹو لائبریری کا نسخہ)"
summary:
  ar: "نسخة حجرية من تفسير الجلالين بخط كاتب يسمي نفسه في الخاتمة محبوب بن حسن، ذكر أنها تمت في أواسط شعبان سنة 1278هـ، مصححة بمعرفة ملتزمها رضوان بن حسن بن علي الحفناوي من مديرية الجيزة. ترتيبها: تكملة السيوطي من أول البقرة إلى آخر الإسراء، ثم قسم المحلي من الكهف إلى الناس، ثم الفاتحة في آخر الكتاب."
  en: "A lithographed Tafsir al-Jalalayn written by a scribe who names himself in the colophon as Mahbub ibn Hasan, who says it was completed in mid-Sha'ban 1278 AH, corrected under the supervision of its sponsor Ridwan ibn Hasan ibn Ali al-Hifnawi of the Giza province. Its order is al-Suyuti's completion from the start of al-Baqara to the end of al-Isra', then al-Mahalli's part from al-Kahf to al-Nas, then al-Fatiha at the end of the book."
  ur: "تفسیر الجلالین کا ایک پتھر پر چھپا نسخہ، جس کے خاتمے میں کاتب اپنا نام محبوب بن حسن بتاتا ہے اور کہتا ہے کہ یہ وسطِ شعبان 1278ھ میں مکمل ہوا، اور اس کی تصحیح اس کے ملتزم رضوان بن حسن بن علی الحفناوی، مدیریۂ جیزہ، کی نگرانی میں ہوئی۔ ترتیب: سورۂ بقرہ کے آغاز سے سورۂ اسرا کے آخر تک سیوطی کا تکملہ، پھر سورۂ کہف سے سورۂ ناس تک محلی کا حصہ، پھر کتاب کے آخر میں سورۂ فاتحہ۔"
