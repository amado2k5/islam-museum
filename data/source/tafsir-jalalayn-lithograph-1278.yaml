label:
  ar: "تفسير الجلالين — نسخة مطبوعة على الحجر، فُرغ منها في أواسط شعبان 1278هـ ⁦(نسخة مكتبة جامعة تورنتو)⁩"
  en: "Tafsir al-Jalalayn — lithographed copy completed in mid-Sha'ban 1278 AH / 1862 (University of Toronto Library copy)"
  ur: "تفسیر الجلالین — پتھر کی طباعت کا نسخہ، وسطِ شعبان 1278ھ / 1862ء میں مکمل ⁦(یونیورسٹی آف ٹورنٹو لائبریری کا نسخہ)⁩"
summary:
  ar: "نسخة حجرية من تفسير الجلالين بخط كاتب يسمي نفسه في الخاتمة محبوب بن حسن، ذكر أنها تمت في أواسط شعبان سنة 1278هـ، مصححة بمعرفة ملتزمها رضوان بن حسن بن علي الحفناوي من مديرية الجيزة. ترتيبها: تكملة السيوطي من أول البقرة إلى آخر الإسراء، ثم قسم المحلي من الكهف إلى الناس، ثم الفاتحة في آخر الكتاب."
  en: "A lithographed Tafsir al-Jalalayn written by a scribe who names himself in the colophon as Mahbub ibn Hasan, who says it was completed in mid-Sha'ban 1278 AH, corrected under the supervision of its sponsor Ridwan ibn Hasan ibn Ali al-Hifnawi of the Giza province. Its order is al-Suyuti's completion from the start of al-Baqara to the end of al-Isra', then al-Mahalli's part from al-Kahf to al-Nas, then al-Fatiha at the end of the book."
  ur: "تفسیر الجلالین کا ایک پتھر پر چھپا نسخہ، جس کے خاتمے میں کاتب اپنا نام محبوب بن حسن بتاتا ہے اور کہتا ہے کہ یہ وسطِ شعبان 1278ھ میں مکمل ہوا، اور اس کی تصحیح اس کے ملتزم رضوان بن حسن بن علی الحفناوی، مدیریۂ جیزہ، کی نگرانی میں ہوئی۔ ترتیب: سورۂ بقرہ کے آغاز سے سورۂ اسرا کے آخر تک سیوطی کا تکملہ، پھر سورۂ کہف سے سورۂ ناس تک محلی کا حصہ، پھر کتاب کے آخر میں سورۂ فاتحہ۔"
  es: "Un Tafsir al-Jalalayn litografiado, escrito por un escriba que se identifica en el colofón como Mahbub ibn Hasan, quien afirma que fue completado a mediados de Sha'ban de 1278 AH, y corregido bajo la supervisión de su patrocinador, Ridwan ibn Hasan ibn Ali al-Hifnawi de la provincia de Giza. Su orden es el siguiente: la conclusión de al-Suyuti desde el inicio de al-Baqara hasta el final de al-Isra', luego la parte de al-Mahalli desde al-Kahf hasta al-Nas, y finalmente al-Fatiha al final del libro."
  fr: "Un Tafsir al-Jalalayn lithographié, attribué à un scribe se nommant Mahbub ibn Hasan dans le colophon, qui précise l'avoir achevé au milieu du mois de Sha'ban 1278 AH et corrigé sous la supervision de son commanditaire, Ridwan ibn Hasan ibn Ali al-Hifnawi, de la province de Gizeh. L'ouvrage présente l'ordre suivant: la partie complétée par al-Suyuti, du début d'al-Baqara à la fin d'al-Isra', suivie de la partie d'al-Mahalli, d'al-Kahf à al-Nas, puis al-Fatiha à la fin."
  tr: "Tefsir-el-Celaleyn'in bir yazısı, sonuçta kendisini Mahbub ibn Hasan olarak adlandıran bir kâtipin el yazısıyla yazılmış ve 1278 Hicri Yılının ortalarında tamamlandığı belirtilmiş, Giza Müdürlüğü'nden Ridwan ibn Hasan ibn Ali al-Hafnawi tarafından düzeltilmiştir. Düzeni: El-Süyüti'nin tamamlanması, El-Bekarah'ın başından El-İsra'nın sonuna kadar, ardından El-Mahali'nin El-Kahf'tan El-Nas'a, ardından kitabın sonunda El-Fatiha'nın bölünmesi."
  id: "Salinan litografi Tafsir al-Jalalayn dengan tulisan tangan seorang juru tulis yang menyebut dirinya Mahbub ibn Hasan dalam penutup, disebutkan telah menyelesaikannya pada pertengahan Sha'ban 1278 H, dikoreksi oleh penulis setia Ridwan ibn Hasan ibn Ali al-Hafnawi dari Direktorat Giza. Susunannya: penyelesaian Al-Suuti dari awal Al-Baqarah hingga akhir Al-Isra, kemudian pembagian Al-Mahali dari Al-Kahf ke Al-Nas, kemudian Al-Fatiha di akhir buku."
