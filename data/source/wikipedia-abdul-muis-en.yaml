summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد المعز (عبد المؤيس)؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في سونغاي بوار في 3 تموز ووفاته في باندونغ سنة 1959، وتروي دراسته الطبية المتعثرة، وصحافته، ونشاطه في شريكة الإسلام والمجلس الشعبي، ورواياته وأشهرها «صلاح أسوهان» (1928)، وتسميته أول بطل قومي لإندونيسيا. صندوقها يقول 1886 بينما المصدر الرسمي الذي تستشهد به (هيئة اللغة) يعنونه (1883–1959)."
  en: "English Wikipedia article on Abdul Muis; used for entity facts only. It gives his birth at Sungai Puar on 3 July and his death at Bandung in 1959, and recounts his abandoned medical studies, his journalism, his Sarekat Islam and Volksraad activity, his novels — above all Salah Asuhan (1928) — and his naming as the first National Hero of Indonesia. Its infobox gives 1886, while the official language-agency biography it cites is titled 'Abdul Muis (1883–1959)'."
