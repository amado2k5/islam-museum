summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد المعز ⁦(عبد المؤيس)⁩؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في سونغاي بوار في 3 تموز ووفاته في باندونغ سنة 1959، وتروي دراسته الطبية المتعثرة، وصحافته، ونشاطه في شريكة الإسلام والمجلس الشعبي، ورواياته وأشهرها «صلاح أسوهان» (1928)، وتسميته أول بطل قومي لإندونيسيا. صندوقها يقول 1886 بينما المصدر الرسمي الذي تستشهد به ⁦(هيئة اللغة)⁩ يعنونه (1883–1959)."
  en: "English Wikipedia article on Abdul Muis; used for entity facts only. It gives his birth at Sungai Puar on 3 July and his death at Bandung in 1959, and recounts his abandoned medical studies, his journalism, his Sarekat Islam and Volksraad activity, his novels — above all Salah Asuhan (1928) — and his naming as the first National Hero of Indonesia. Its infobox gives 1886, while the official language-agency biography it cites is titled 'Abdul Muis (1883–1959)'."
  es: "Artículo de la Wikipedia en inglés sobre Abdul Muis; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Sungai Puar el 3 de julio y su fallecimiento en Bandung en 1959, y relata sus estudios de medicina abandonados, su actividad periodística, su participación en Sarekat Islam y Volksraad, sus novelas —sobre todo Salah Asuhan (1928)— y su nombramiento como primer Héroe Nacional de Indonesia. Su ficha informativa indica 1886, mientras que la biografía oficial de la agencia lingüística que cita se titula «Abdul Muis (1883–1959)»."
  fr: "L'article de Wikipédia en anglais consacré à Abdul Muis, utilisé uniquement pour les informations le concernant, indique sa naissance à Sungai Puar le 3 juillet et son décès à Bandung en 1959. Il relate également ses études de médecine abandonnées, son expérience de journaliste, son engagement au sein de Sarekat Islam et du Volksraad, ses romans – notamment Salah Asuhan (1928) – et sa nomination comme premier Héros national d'Indonésie. Son infobox mentionne l'année 1886, tandis que la biographie officielle de l'agence de la langue indonésienne citée s'intitule « Abdul Muis (1883–1959) »."
  ur: "عبدالموس پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ سنگائی پور میں 3 جولائی کو ان کی پیدائش اور 1959 میں بانڈونگ میں ان کی موت کا ذکر کرتا ہے، اور اس کی ترک شدہ طبی تعلیم، اس کی صحافت، اس کی سراکت اسلام اور ووکسراڈ سرگرمی، اس کے ناولوں - سب سے بڑھ کر صلاح آسوہان (1928) - اور انڈونیشیا کے پہلے قومی ہیرو کے طور پر اس کا نام دیا گیا ہے۔ اس کا معلوماتی خانہ 1886 دیتا ہے، جب کہ سرکاری زبان کی ایجنسی کی سوانح عمری کا حوالہ 'عبدالموس (1883-1959)' ہے۔"
  tr: "Abdul Muizz (Abdul Moayes) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 3 Temmuz'da Songhai Buar'da ve 1959'da Bandung'da ölümünü anlatır, sorunlu tıp eğitimi, gazetecilik, İslam Ortağı ve Halk Meclisi'ndeki faaliyetleri, en ünlüsü 'Salah Asouhan' (1928) ve Endonezya'nın ilk ulusal kahramanını adlandırması gibi romanlarını anlatır. Kutusunda 1886 yazılırken, (Dil Otoritesi) tarafından alıntılanan resmi kaynak (1883–1959) olarak adlandırılmıştır."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdul Muizz (Abdul Moayes); hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Songhai Buar pada 3 Juli dan kematiannya di Bandung pada tahun 1959, menceritakan studi kedokteran yang bermasalah, jurnalistik, aktivitas di Partner of Islam dan Majelis Rakyat, novel-novelnya, yang paling terkenal adalah 'Salah Asouhan' (1928), dan penamaannya sebagai pahlawan nasional pertama Indonesia. Kotaknya tertulis tahun 1886, sedangkan sumber resmi yang dikutip oleh (Otoritas Bahasa) berjudul (1883–1959)."
