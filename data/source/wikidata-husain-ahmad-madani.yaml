summary:
  ar: "عنصر ويكيداتا Q4846312 لحسين أحمد المدني: يذكر ولادته في 6 أكتوبر 1879، وقيمة دينه «الإسلام» فقط دون مذهب، ويحمل لوفاته قيمة شاذة ⁦(5 أكتوبر 1957)⁩ لا تؤيدها أي مقالة."
  en: "Wikidata item Q4846312 for Husain Ahmad Madani: it gives his birth on 6 October 1879 and a religion value of Islam only, with no school; for his death it carries the year 1957 and a stray day-precision value of 5 October 1957 that no article supports."
  es: "El elemento de Wikidata Q4846312 para Husain Ahmad Madani indica que nació el 6 de octubre de 1879 y profesaba únicamente el Islam, sin mencionar ninguna escuela; para su muerte, menciona el año 1957 y una fecha aproximada del 5 de octubre de 1957 que ningún artículo respalda."
  fr: "L'élément Wikidata Q4846312 pour Husain Ahmad Madani: il indique sa naissance le 6 octobre 1879 et une valeur religieuse de l'Islam seulement, sans école; pour sa mort, il porte l'année 1957 et une valeur de précision du jour isolée du 5 octobre 1957 qui n'est étayée par aucun article."
  ur: "حسین احمد مدنی کے لیے ویکی ڈیٹا آئٹم Q4846312: یہ 6 اکتوبر 1879 کو ان کی پیدائش اور صرف اسلام کی ایک مذہبی قدر ہے، جس میں کوئی اسکول نہیں ہے۔ اس کی موت کے لئے اس میں سال 1957 اور 5 اکتوبر 1957 کی ایک آوارہ دن کی درستگی کی قیمت ہے جس کی کوئی مضمون تائید نہیں کرتا ہے۔"
  tr: "Wikidata öğesi Q4846312 Hussein Ahmed Al-Madani tarafından yazılmış: 6 Ekim 1879'da doğduğundan ve dini sadece 'İslam'dan oluştuğunda, herhangi bir mezhep olmadan ve ölümünde (5 Ekim 1957) hiçbir makalenin desteklemediği bir anomali değeri taşımaktadır."
  id: "Elemen Wikidata Q4846312 oleh Hussein Ahmed Al-Madani: menyebutkan kelahirannya pada 6 Oktober 1879, dan agamanya hanya 'Islam' tanpa sekte, serta membawa nilai anomali untuk kematiannya (5 Oktober 1957) yang tidak didukung oleh artikel mana pun."
