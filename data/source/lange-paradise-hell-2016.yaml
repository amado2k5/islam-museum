summary:
  ar: "دراسة أكاديمية شاملة لمفهومي الجنة والنار في التراث الإسلامي عبر القرآن والحديث والتصوف والفلسفة؛ أكثر المراجع الأكاديمية استشهادًا في مقالة الجنة على ويكيبيديا الإنجليزية."
  en: "The standard academic monograph on paradise and hell in Islamic tradition across Qur'an, hadith, Sufism and philosophy; the most-cited scholarly work on the English Wikipedia article for Jannah."
  es: "La monografía académica de referencia sobre el paraíso y el infierno en la tradición islámica a través del Corán, los hadices, el sufismo y la filosofía; la obra académica más citada en el artículo de Wikipedia en inglés sobre Jannah."
  fr: "La monographie universitaire de référence sur le paradis et l'enfer dans la tradition islamique à travers le Coran, les hadiths, le soufisme et la philosophie; l'ouvrage savant le plus cité dans l'article Wikipédia en anglais consacré au paradis."
  ur: "قرآن، حدیث، تصوف اور فلسفہ میں اسلامی روایت میں جنت اور جہنم پر معیاری اکیڈمک مونوگراف؛ انگریزی ویکیپیڈیا مضمون برائے جنت پر سب سے زیادہ حوالہ دیا جانے والا علمی کام۔"
  tr: "İslami mirasta gök ve cehennem kavramlarının Kur'an, Hadis, Sufizm ve felsefe aracılığıyla kapsamlı akademik çalışması; İngilizce Vikipedi'deki Paradise makalesinde en çok atıf yapılan akademik kaynaklardır."
  id: "Studi akademis komprehensif tentang konsep surga dan neraka dalam warisan Islam melalui Al-Qur'an, Hadis, Sufisme, dan filsafat; referensi akademik yang paling banyak dikutip dalam artikel Paradise di Wikipedia bahasa Inggris."
title: "Paradise and Hell in Islamic Traditions"
