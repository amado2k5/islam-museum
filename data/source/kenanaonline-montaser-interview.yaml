  ur: "خالد منتظر کے ساتھ انٹرویو کی ایک پریس رپورٹ، 2011 کے بارے میں، صحافی راشا محمود کی، کینا آن لائن پر دوبارہ شائع ہوئی؛ وہ اس میں خود کو 'مصری مسلم لبرل' کے طور پر بیان کرتا ہے۔"
  tr: "Gazeteci Rasha Mahmoud tarafından 2011 civarında Khaled Montasser ile yapılan bir röportaj hakkında, Kenana Online'da yeniden yayımlanan bir gazetecilik raporu; burada kendisini \"liberal bir Mısırlı Müslüman\" olarak tanımlıyor."
