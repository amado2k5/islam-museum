reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Covers: birth as Youssef Gabriel Chahine on 25 January 1926 in Alexandria to a Melkite Greek Catholic family, his father an attorney from Zahle and a Wafd supporter, his mother Claire Bastorous of Greek descent; the passage stating he was raised Catholic but 'was not a believer in organized religion' and would state 'Egyptian' if asked his religion; schooling at Collège Saint Marc and Victoria College, and study at the Pasadena Playhouse; his first feature Baba Amin (1950), Son of the Nile (1951), The Blazing Sun (1954) introducing Omar Sharif, Cairo Station (1958), Saladin (1963), The Land, The Sparrow, the Alexandria autobiographical quartet (1978-2004), The Emigrant (1994) and its controversy, the Cannes 50th Anniversary lifetime achievement award in 1997, and his death in Cairo on 27 July 2008."
