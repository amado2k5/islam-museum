summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن يوسف شاهين؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في الإسكندرية سنة 1926 لأسرة كاثوليكية ملكية ونشأته الكاثوليكية مع قوله إنه لم يكن مؤمنًا بالدين المنظّم وكان يجيب «مصري»، ومسيرته حتى وفاته في القاهرة سنة 2008."
  en: "English Wikipedia article on Youssef Chahine; used for entity facts only. It records his birth in Alexandria in 1926 to a Melkite Greek Catholic family and his Catholic raising alongside his statement that he was not a believer in organized religion and would answer 'Egyptian', and his career to his death in Cairo in 2008."
  es: "Artículo de la Wikipedia en inglés sobre Youssef Chahine; utilizado únicamente para obtener información sobre la persona. En él se registra su nacimiento en Alejandría en 1926 en el seno de una familia greco-católica melquita y su educación católica, junto con su declaración de que no creía en ninguna religión organizada y que respondería \"egipcio\", y su trayectoria profesional hasta su fallecimiento en El Cairo en 2008."
  fr: "Article de Wikipédia en anglais sur Youssef Chahine; utilisé uniquement pour des informations sur l’entité. Il relate sa naissance à Alexandrie en 1926 dans une famille melkite grecque catholique et son éducation catholique, ainsi que sa déclaration selon laquelle il ne croyait pas aux religions organisées et se définissait comme « Égyptien », et sa carrière jusqu’à sa mort au Caire en 2008."
  ur: "Youssef Chahine پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پیدائش 1926 میں اسکندریہ میں ایک میلکائٹ یونانی کیتھولک خاندان میں درج ہے اور اس کے کیتھولک نے اس بیان کے ساتھ ساتھ اس کی پرورش کی کہ وہ منظم مذہب میں یقین نہیں رکھتے تھے اور 'مصری' کا جواب دیں گے، اور اس کا کیریئر 2008 میں قاہرہ میں اس کی موت تک ہے۔"
  tr: "Youssef Chahine hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1926'da İskenderiye'de kraliyet Katolik bir ailede doğduğu ve Katolik yetiştirilme tarzı belgelenmiştir; organize dine inanmadığını ve \"Mısırlı\" diye yanıt verdiğini belirtmesi ile 2008'de Kahire'de ölümüne kadar olan yolculuğu belgelenmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Youssef Chahine; hanya digunakan untuk fakta entitas. Kelahirannya di Alexandria pada tahun 1926 dari keluarga Katolik kerajaan dan didikan Katoliknya terdokumentasi, dengan pernyataannya bahwa ia tidak percaya pada agama terorganisir dan menjawab \"Mesir,\" serta perjalanannya hingga wafat di Kairo pada tahun 2008."
