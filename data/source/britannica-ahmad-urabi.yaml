reliability_note: "National-encyclopedia entry, read in full at Britannica's own site on 24 October 2026. It gives: Aḥmad ʿUrābī Pasha, born 1839 (the entry's dating; the English and Arabic Wikipedia articles and Wikidata's precise claim give 31 March 1841, which the record follows and notes), died 21 September 1911 in Cairo; Egyptian nationalist and officer of fellah origin; educated at al-Azhar; leader of the movement against Turco-Circassian privilege and Anglo-French financial control; Minister of War from February 1882 in the nationalist ministry; the revolt demanded a constitution and parliamentary rights over the budget; after the Alexandria riots and the British bombardment he organised resistance and the Khedive was proclaimed a traitor; defeated at Tell el-Kebir (13 September 1882); exiled to Ceylon; pardoned and returned in 1901; died an unpopular figure in relative obscurity, his image revitalised in the 1950s by Gamal Abdel Nasser. It names no religion or school for him — a silence the record's faith note relies on."
