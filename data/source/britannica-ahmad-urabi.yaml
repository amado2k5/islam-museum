summary:
  ar: "مدخل موسوعة بريتانيكا عن عرابي باشا؛ يُستخدم لوقائع الكيان فقط. يؤرخ ميلاده بسنة 1839 (خلافا لتوافق المصادر الأخرى على 31 مارس 1841)، ويصفه بأنه وزير حربية مصر وقائد ثورتها التي أعلنت الخديوي خائنا، ويذكر وفاته «شخصا غير محبوب في غموض نسبي» وأن صورته أُحييت في الخمسينيات مع ناصر."
  en: "Encyclopaedia Britannica entry on ʿUrābī Pasha; used for entity facts only. It dates his birth to 1839 (against the other sources' agreed 31 March 1841), describes him as Egypt's minister of war and the leader of a revolt that proclaimed the Khedive a traitor, and records that he died 'an unpopular figure in relative obscurity', his image revitalised in the 1950s under Nasser."
