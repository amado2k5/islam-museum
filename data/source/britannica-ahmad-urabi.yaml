summary:
  ar: "مدخل موسوعة بريتانيكا عن عرابي باشا؛ يُستخدم لوقائع الكيان فقط. يؤرخ ميلاده بسنة 1839 ⁦(خلافا لتوافق المصادر الأخرى على 31 مارس 1841)⁩، ويصفه بأنه وزير حربية مصر وقائد ثورتها التي أعلنت الخديوي خائنا، ويذكر وفاته «شخصا غير محبوب في غموض نسبي» وأن صورته أُحييت في الخمسينيات مع ناصر."
  en: "Encyclopaedia Britannica entry on ʿUrābī Pasha; used for entity facts only. It dates his birth to 1839 (against the other sources' agreed 31 March 1841), describes him as Egypt's minister of war and the leader of a revolt that proclaimed the Khedive a traitor, and records that he died 'an unpopular figure in relative obscurity', his image revitalised in the 1950s under Nasser."
  es: "Entrada de la Enciclopedia Británica sobre ʿUrābī Pasha; utilizada únicamente para datos sobre la persona. Fecha su nacimiento en 1839 (en contra del 31 de marzo de 1841, fecha concordante con otras fuentes), lo describe como ministro de guerra de Egipto y líder de una revuelta que proclamó al jedive traidor, y registra que murió \"como una figura impopular en relativo anonimato\", y que su imagen fue revitalizada en la década de 1950 bajo el mandato de Nasser."
  fr: "Article de l'Encyclopædia Britannica sur ʿUrābī Pacha; utilisé uniquement pour les informations relatives à l'entité. Il date sa naissance de 1839 (contrairement au 31 mars 1841, date généralement admise par d'autres sources), le décrit comme ministre de la Guerre d'Égypte et chef d'une révolte qui proclama le Khédive traître, et indique qu'il mourut « figure impopulaire et relativement obscure », son image étant remise en valeur dans les années 1950 sous Nasser."
  ur: "عربی پاشا پر انسائیکلوپیڈیا برٹانیکا کا اندراج؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی تاریخ پیدائش 1839 ہے ⁦(دوسرے ذرائع کے خلاف متفقہ 31 مارچ 1841)⁩، اسے مصر کے وزیر جنگ اور ایک بغاوت کے رہنما کے طور پر بیان کرتا ہے جس نے کھیڈیو کو غدار قرار دیا تھا، اور ریکارڈ کیا ہے کہ وہ 'متعلقہ غیر واضح شخصیت میں ایک غیر مقبول شخصیت' مر گیا، اس کی شبیہ 19 کے تحت 199 میں زندہ ہوئی۔"
