summary:
  ar: "مدخل «نائب» في موسوعة TDV الإسلامية بقسميه: الأول للتاريخ العام للنيابة في المناصب من عهد النبي إلى الغزنويين والسلاجقة والإيلخانيين والأيوبيين والمماليك، والثاني للنيابة العثمانية في القضاء ونظام نوّاب القضاة ومدرسة معلمخانه نوّاب."
  en: "The TDV İslâm Ansiklopedisi entry on the nāib (deputy) in two sections: the general history of deputyship in office from the Prophet's time through the Ghaznavids, Seljuks, Ilkhanids, Ayyubids and Mamluks, and the Ottoman institution — the kadı's deputy-judges, their appointment, pay and abuses, and the Nüvvâb schools."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre el nāib (diputado) se divide en dos secciones: la historia general del cargo de diputado desde la época del Profeta, pasando por los gaznávidas, selyúcidas, iljánidas, ayubíes y mamelucos, hasta la institución otomana: los jueces adjuntos del cadí, su nombramiento, remuneración y abusos, y las escuelas Nüvvâb."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur le nāib (député) en deux sections: l'histoire générale de la fonction de député depuis l'époque du Prophète jusqu'aux Ghaznévides, Seldjoukides, Ilkhanides, Ayyoubides et Mamelouks, et l'institution ottomane — les juges adjoints du cadi, leur nomination, leur rémunération et les abus, et les écoles Nüvvâb."
  ur: "نائب ⁦(نائب)⁩ کے بارے میں TDV İslâm Ansiklopedisi کا اندراج دو حصوں میں: غزنویوں، سلجوقیوں، الخانیدوں، ایوبیوں اور مملوکوں کے ذریعے عہدہ نبوی کے عہدہ پر نائب ہونے کی عمومی تاریخ، اور عثمانی ادارہ - قادیان کے نائب، عہدہ دار، نائب اور تنخواہ۔ نئے اسکول۔"
