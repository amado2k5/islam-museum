summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فارس الخوري؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 20 نوفمبر 1877 في كفير بقضاء حاصبيا لعائلة مسيحية أرثوذكسية يونانية اعتنقت البروتستانتية لاحقًا، ووزارته للمالية في الحكومات السورية الأولى، ورئاساته الأربع لمجلس النواب، ورئاستيه للوزراء (1944–1945 و1954–1955)، ودوره أول مندوب دائم لسوريا لدى الأمم المتحدة، ووفاته في دمشق في 2 يناير 1962. وتصف مقدمتها رئاسته للوزراء بأنها أعلى منصب سياسي بلغه مسيحي سوري."
  en: "English Wikipedia article on Fares al-Khoury; used for entity facts only. It gives his birth on 20 November 1877 at Kfeir in the Hasbaya district to a Greek Orthodox Christian family that later converted to Presbyterianism, his finance ministry under the first Syrian governments, his four presidencies of the Chamber of Deputies, his two premierships (1944–1945 and 1954–1955), his role as Syria's first permanent representative to the United Nations, and his death at Damascus on 2 January 1962. Its lead calls his premiership the highest political office a Syrian Christian has ever reached."
