  ar: "مقالة ويكيبيديا العربية عن سانيا نشتر (وُلدت في 16 فبراير 1963)؛ تُستخدم لوقائع الكيان فقط. تروي مولدها في بيشاور ودراستها الطب وتخصصها في أمراض القلب، وتأسيسها هارتفايل، ووزارتها الانتقالية سنة 2013، وقيادتها برنامج إحساس، وترشحها لمنصب المدير العام لمنظمة الصحة العالمية سنة 2017."
  en: "Arabic Wikipedia article on Sania Nishtar (born 16 February 1963); used for entity facts only. It recounts her Peshawar birth, medical training and cardiology career, her founding of Heartfile, her 2013 caretaker ministership, her leadership of Ehsaas, and her 2017 candidacy for WHO director-general. Closely follows the English article, so it is not a fully independent family from it."
