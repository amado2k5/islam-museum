label:
  ar: "جلاء الأفهام في فضل الصلاة والسلام على محمد خير الأنام — ابن قيم الجوزية، تحقيق زائد بن أحمد النشيري ⁦(آثار الإمام ابن قيم الجوزية 3، دار عطاءات العلم ودار ابن حزم)⁩"
  en: "Jala' al-Afham fi Fadl al-Salat wa-l-Salam ala Muhammad Khayr al-Anam — Ibn Qayyim al-Jawziyya, ed. Za'id ibn Ahmad al-Nushayri (Works of Ibn Qayyim al-Jawziyya 3, Dar Ata'at al-Ilm and Dar Ibn Hazm)"
summary:
  ar: "طبعة محققة من جلاء الأفهام لابن قيم الجوزية ⁦(691–751هـ)⁩ بتحقيق زائد بن أحمد النشيري، المجلد الثالث من سلسلة «آثار الإمام ابن قيم الجوزية وما لحقها من أعمال»، مع فهارس لفظية وعلمية مفصلة."
  en: "A critical edition of Ibn Qayyim al-Jawziyya's (691–751 AH) Jala' al-Afham by Za'id ibn Ahmad al-Nushayri, volume three of the series Works of Imam Ibn Qayyim al-Jawziyya and related writings, with detailed verbal and subject indexes."
  es: "Una edición crítica de Jala' al-Afham de Ibn Qayyim al-Jawziyya (691–751 AH) por Za'id ibn Ahmad al-Nushayri, volumen tres de la serie Obras del Imam Ibn Qayyim al-Jawziyya y escritos relacionados, con índices verbales y temáticos detallados."
  fr: "Une édition critique de Jala' al-Afham d'Ibn Qayyim al-Jawziyya (691-751 AH) par Za'id ibn Ahmad al-Nushayri, volume trois de la série Œuvres de l'Imam Ibn Qayyim al-Jawziyya et écrits connexes, avec des index verbaux et thématiques détaillés."
  ur: "ابن قیم الجوزیہ ⁦(691-751 ہجری)⁩ کا ایک تنقیدی ایڈیشن از زید بن احمد النشایری کی تصنیف جلال الافہم، امام ابن قیم الجوزیہ کی تصانیف اور متعلقہ تحریروں کی جلد تین، تفصیلی زبانی اور مضامین کے اشاریہ کے ساتھ۔"
  tr: "İbn Kayyim al-Jawziyyah (691–751 H) tarafından hazırlanan Jala'al-Afham'dan doğrulanmış bir baskı, Zayed ibn Ahmad al-Nashiri tarafından düzenlenmiştir, 'İmam İbn Kayyim al-Jawziyyah'ın Eserleri ve İbn Qayyim al-Jawziyyah'ın Eserleri' serisinin üçüncü cildi, ayrıntılı sözel ve bilimsel indekslerle birlikte."
  id: "Edisi terverifikasi dari Jala' al-Afham oleh Ibn Qayyim al-Jawziyyah (691–751 H), disunting oleh Zayed ibn Ahmad al-Nashiri, jilid ketiga dari seri 'Karya Imam Ibn Qayyim al-Jawziyyah dan Karya Ibn Qayyim al-Jawziyyah,' dengan indeks verbal dan ilmiah yang rinci."
title: "جلاء الأفهام في فضل الصلاة والسلام على محمد خير الأنام"
