summary:
  ar: "طبعة محققة من جلاء الأفهام لابن قيم الجوزية (691–751هـ) بتحقيق زائد بن أحمد النشيري، المجلد الثالث من سلسلة «آثار الإمام ابن قيم الجوزية وما لحقها من أعمال»، مع فهارس لفظية وعلمية مفصلة."
  en: "A critical edition of Ibn Qayyim al-Jawziyya's (691–751 AH) Jala' al-Afham by Za'id ibn Ahmad al-Nushayri, volume three of the series Works of Imam Ibn Qayyim al-Jawziyya and related writings, with detailed verbal and subject indexes."
