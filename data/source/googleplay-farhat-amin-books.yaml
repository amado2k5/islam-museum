summary:
  ar: "صفحة المؤلفة فرحات أمين في كتب غوغل بلاي؛ تورد سيرتها: مقدمة بودكاست «سمارت مسلمة»، تشارك خبرتها مع النساء المسلمات منذ أكثر من عشرين سنة، كانت معلمة لغة إنجليزية في مدرسة ثانوية، تخرجت في معهد التعليم بجامعة لندن سنة 2009 وتركت التعليم الدوامي سنة 2015 للعمل من المنزل تعليمًا عبر الإنترنت وبودكاست، وتسكن في المملكة المتحدة؛ وتسرد كتبها ومنها «فقدان طفل» و«التربية الجنسية لأطفال المسلمين» و«دفتر الزواج المسلم»."
  en: "The Google Play Books author page for Farhat Amin. Its biography says she hosted the Smart Muslima podcast and had shared her know-how with Muslim women for over twenty years; that she was formerly a high-school English teacher who graduated from the UCL Institute of Education in 2009 and left full-time teaching in 2015 to teach online and podcast from home; and that she lived in the UK. It lists her books, among them Child Loss, Bereavement and Hope, Sex Education for Muslim Kids and The Muslim Marriage Journal."
  es: "Página de autora de Farhat Amin en Google Play Libros. Su biografía indica que presentó el podcast Smart Muslima y compartió sus conocimientos con mujeres musulmanas durante más de veinte años; que anteriormente fue profesora de inglés en una escuela secundaria, graduada del Instituto de Educación de la UCL en 2009, y que dejó la docencia a tiempo completo en 2015 para impartir clases en línea y grabar podcasts desde casa; y que residía en el Reino Unido. En la página se enumeran sus libros, entre ellos Child Loss, Bereavement and Hope, Sex Education for Muslim Kids y The Muslim Marriage Journal."
  fr: "La page auteur de Farhat Amin sur Google Play Livres. Sa biographie indique qu'elle a animé le podcast Smart Muslima et partagé son expertise avec des femmes musulmanes pendant plus de vingt ans; qu'elle était auparavant professeure d'anglais au lycée, diplômée de l'Institut d'éducation de l'UCL en 2009, et qu'elle a quitté l'enseignement à temps plein en 2015 pour donner des cours en ligne et réaliser des podcasts depuis son domicile; et qu'elle vivait au Royaume-Uni. On y trouve également la liste de ses ouvrages, parmi lesquels Child Loss, Bereavement and Hope, Sex Education for Muslim Kids et The Muslim Marriage Journal."
  ur: "فرحت امین کے لیے Google Play Books کا مصنف صفحہ۔ اس کی سوانح عمری کہتی ہے کہ اس نے اسمارٹ مسلمہ پوڈ کاسٹ کی میزبانی کی اور بیس سال سے زیادہ عرصے سے مسلم خواتین کے ساتھ اپنی جانکاری شیئر کی ہے۔ کہ وہ پہلے ایک ہائی اسکول انگلش ٹیچر تھیں جنہوں نے 2009 میں یو سی ایل انسٹی ٹیوٹ آف ایجوکیشن سے گریجویشن کیا اور 2015 میں گھر سے آن لائن اور پوڈ کاسٹ پڑھانے کے لیے کل وقتی تدریس چھوڑ دی۔ اور یہ کہ وہ برطانیہ میں رہتی تھی۔ اس میں ان کی کتابوں کی فہرست دی گئی ہے، جن میں چائلڈ لاسز، بیریومنٹ اینڈ ہوپ، سیکس ایجوکیشن فار مسلم کڈز اور دی مسلم میرج جرنل شامل ہیں۔"
  tr: "Yazar Farhat Amin'in Google Play'deki sayfası; biyografisinde şunlar yer alıyor: \"Smart Muslim\" podcast'inin sunucusu, yirmi yılı aşkın süredir Müslüman kadınlarla deneyimlerini paylaşıyor. Bir lisede İngilizce öğretmeniydi, 2009'da Londra Üniversitesi Eğitim Enstitüsü'nden mezun oldu ve 2015'te tam zamanlı eğitimi bırakarak çevrimiçi eğitim ve podcastler aracılığıyla evden çalışmaya başladı. Birleşik Krallık'ta yaşıyor; \"Lost a Child,\" \"Sex Education for Muslim Children\" ve \"The Muslim Marriage Notebook\" gibi kitaplarını listeliyor."
  id: "Halaman penulis Farhat Amin di Google Play; biografinya meliputi: Pembawa podcast \"Smart Muslim,\" membagikan pengalamannya dengan perempuan Muslim selama lebih dari dua puluh tahun. Ia pernah menjadi guru bahasa Inggris di sekolah menengah, lulus dari Institute of Education di University of London pada tahun 2009, dan meninggalkan pendidikan penuh waktu pada tahun 2015 untuk bekerja dari rumah melalui pendidikan daring dan podcast. Ia tinggal di Inggris; ia mencantumkan buku-bukunya, termasuk \"Lost a Child,\" \"Sex Education for Muslim Children,\" dan \"The Muslim Marriage Notebook.\""
