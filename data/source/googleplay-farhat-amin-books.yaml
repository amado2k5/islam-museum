summary:
  ar: "صفحة المؤلفة فرحات أمين في كتب غوغل بلاي؛ تورد سيرتها: مقدمة بودكاست «سمارت مسلمة»، تشارك خبرتها مع النساء المسلمات منذ أكثر من عشرين سنة، كانت معلمة لغة إنجليزية في مدرسة ثانوية، تخرجت في معهد التعليم بجامعة لندن سنة 2009 وتركت التعليم الدوامي سنة 2015 للعمل من المنزل تعليمًا عبر الإنترنت وبودكاست، وتسكن في المملكة المتحدة؛ وتسرد كتبها ومنها «فقدان طفل» و«التربية الجنسية لأطفال المسلمين» و«دفتر الزواج المسلم»."
  en: "The Google Play Books author page for Farhat Amin. Its biography says she hosted the Smart Muslima podcast and had shared her know-how with Muslim women for over twenty years; that she was formerly a high-school English teacher who graduated from the UCL Institute of Education in 2009 and left full-time teaching in 2015 to teach online and podcast from home; and that she lived in the UK. It lists her books, among them Child Loss, Bereavement and Hope, Sex Education for Muslim Kids and The Muslim Marriage Journal."
