summary:
  ar: "طبعة دار الحديث بالقاهرة للصحاح في مجلد واحد من 1800 صفحة، «مرتب ترتيبًا ألفبائيًا وفق أوائل الحروف»، راجعه واعتنى به الدكتور محمد محمد تامر مع أنس محمد الشامي وزكريا جابر أحمد، سنة 1430هـ/2009م؛ ويذكر غلافها أن الجوهري توفي سنة 398هـ."
  en: "Dar al-Hadith's (Cairo) one-volume, 1,800-page printing of al-Sihah 'arranged alphabetically by the first letters', revised by Dr Muhammad Muhammad Tamir with Anas Muhammad al-Shami and Zakariyya Jabir Ahmad, 1430 AH / 2009; its title page gives al-Jawhari's death as 398 AH."
  ur: "دار الحدیث قاہرہ کا صحاح کا ایک جلد اور 1800 صفحات والا ایڈیشن، «پہلے حروف کے مطابق الفبائی ترتیب میں»، نظرِ ثانی ڈاکٹر محمد محمد تامر، انس محمد الشامی اور زکریا جابر احمد کے ساتھ، 1430ھ / 2009ء؛ اس کے سرورق پر جوہری کی وفات 398ھ درج ہے۔"
