summary:
  ar: "مقالة ويكيبيديا الأردية عن نظام الدین اولیاء؛ تذكر مولده سنة 1238 ووفاته في 3 أبريل 1325 وبيعته وخلافته عن بابا فريد في أجودهن، مع اضطراب داخلي في بعض تحويلاتها؛ تُستخدم لوقائع الكيان فقط مع هذا التنبيه."
  en: "Urdu Wikipedia article on Nizamuddin Awliya; it gives his birth in 1238 and death on 3 April 1325 and his discipleship and succession under Baba Farid at Ajodhan, though some of its internal date conversions are inconsistent; used for entity facts only, with that caution."
  es: "Artículo de Wikipedia en urdu sobre Nizamuddin Awliya; indica su nacimiento en 1238 y su muerte el 3 de abril de 1325, así como su discipulado y sucesión bajo Baba Farid en Ajodhan, aunque algunas de sus conversiones internas de fechas son inconsistentes; úselo solo para datos sobre la entidad, con esa precaución."
  fr: "Article de Wikipédia en ourdou sur Nizamuddin Awliya; il indique sa naissance en 1238 et sa mort le 3 avril 1325, ainsi que son apprentissage et sa succession sous la tutelle de Baba Farid à Ajodhan, bien que certaines de ses conversions de dates internes soient incohérentes; à utiliser uniquement pour des informations sur l’entité, avec cette mise en garde."
  ur: "نظام الدین اولیاء پر اردو ویکیپیڈیا مضمون؛ اس کی پیدائش 1238 میں ہوئی اور وفات 3 اپریل 1325 کو ہوئی اور اجودھن میں بابا فرید کے ماتحت ان کی شاگردی اور جانشینی ہوئی، حالانکہ اس کی کچھ اندرونی تاریخیں متضاد ہیں۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، اس احتیاط کے ساتھ۔"
  tr: "Nizam al-Din Awliya hakkında Urduca Wikipedia makalesi; 1238'deki doğumunu ve 3 Nisan 1325'teki ölümünü, Ajwudhan'da Baba Farid'e bağlılığını ve tahtını devre dışı bırakmasını ve bazı dönüşümlerinde iç karışıklıklarla birlikte belirtir; bu uyarı yalnızca varlığın gerçekleri için kullanılır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Nizam al-Din Awliya menyebutkan kelahirannya pada tahun 1238 dan kematiannya pada 3 April 1325, kesetiaan dan suksesinya dari Baba Farid di Ajwudhan, dengan gangguan internal dalam beberapa konversinya; artikel ini hanya digunakan untuk fakta entitas dengan catatan ini."
