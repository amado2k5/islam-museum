summary:
  ar: "مدخل موسوعة بريتانيكا عن وائل غنيم؛ يؤرخ ميلاده في القاهرة في 23 ديسمبر 1980، ويصفه بأنه ناشط ديمقراطي ومهندس حاسوب نظّم حملة التواصل الاجتماعي التي أشعلت مظاهرات 2011 وأطاحت بحسني مبارك، واعتُقل سرًا 11 يومًا."
  en: "Encyclopaedia Britannica entry on Wael Ghonim; it dates his birth to 23 December 1980 in Cairo and describes him as a democracy activist and computer engineer who organised the social-media campaign that helped spur the 2011 demonstrations that forced Hosni Mubarak from power, and who was held in secret detention for 11 days."
