summary:
  ar: "مدخل موسوعة بريتانيكا عن وائل غنيم؛ يؤرخ ميلاده في القاهرة في 23 ديسمبر 1980، ويصفه بأنه ناشط ديمقراطي ومهندس حاسوب نظّم حملة التواصل الاجتماعي التي أشعلت مظاهرات 2011 وأطاحت بحسني مبارك، واعتُقل سرًا 11 يومًا."
  en: "Encyclopaedia Britannica entry on Wael Ghonim; it dates his birth to 23 December 1980 in Cairo and describes him as a democracy activist and computer engineer who organised the social-media campaign that helped spur the 2011 demonstrations that forced Hosni Mubarak from power, and who was held in secret detention for 11 days."
  es: "Entrada de la Enciclopedia Británica sobre Wael Ghonim; en ella se fecha su nacimiento el 23 de diciembre de 1980 en El Cairo y se le describe como un activista por la democracia e ingeniero informático que organizó la campaña en redes sociales que ayudó a impulsar las manifestaciones de 2011 que obligaron a Hosni Mubarak a abandonar el poder, y que estuvo detenido en secreto durante 11 días."
  fr: "L'article de l'Encyclopædia Britannica sur Wael Ghonim situe sa naissance au 23 décembre 1980 au Caire et le décrit comme un militant démocrate et ingénieur informatique qui a organisé la campagne sur les réseaux sociaux ayant contribué à déclencher les manifestations de 2011 qui ont forcé Hosni Moubarak à quitter le pouvoir, et qui a été détenu au secret pendant 11 jours."
  ur: "Wael Ghonim پر انسائیکلوپیڈیا برٹانیکا کا اندراج؛ اس میں اس کی پیدائش 23 دسمبر 1980 کو قاہرہ میں ہے اور اسے جمہوریت کے کارکن اور کمپیوٹر انجینئر کے طور پر بیان کیا گیا ہے جس نے سوشل میڈیا مہم کا اہتمام کیا جس نے 2011 کے مظاہروں کو فروغ دینے میں مدد کی جس نے حسنی مبارک کو اقتدار سے ہٹا دیا، اور جنہیں 11 دن تک خفیہ حراست میں رکھا گیا۔"
  tr: "Encyclopaedia Britannica'da Wael Ghoneim hakkında yazdığı kayıt, 23 Aralık 1980'de Kahire'de doğduğunu ve onu 2011 protestolarını başlatan ve Hüsnü Mübarek'i deviren sosyal medya kampanyasını organize eden demokratik bir aktivist ve bilgisayar mühendisi olarak tanımlıyor; Ghoneim ise 11 gün boyunca gizlice gözaltında tutuldu."
  id: "Entri untuk Encyclopaedia Britannica tentang Wael Ghoneim mencatat kelahirannya di Kairo pada 23 Desember 1980, menggambarkannya sebagai aktivis demokratis dan insinyur komputer yang mengorganisir kampanye media sosial yang memicu protes 2011 dan menggulingkan Hosni Mubarak, dan ia diam-diam ditahan selama 11 hari."
