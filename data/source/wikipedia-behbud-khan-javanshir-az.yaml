summary:
  ar: "مقالة ويكيبيديا الأذربيجانية عن بهبود خان جوانشير؛ تُستخدم لوقائع الكيان فقط. أوفى سيرة له: تاريخاه 12 (24) يوليو 1878 – 18 يوليو 1921، ورواية مطوّلة لأحداث مارس 1918 ومحاكمة قاتله، وأن جنازته في تكية يحيى أفندي في بشيكتاش في 20 يوليو 1921 تحوّلت إلى مظاهرة جماهيرية. لا تسمي مذهبًا له."
  en: "Azerbaijani Wikipedia article on Behbud Khan Javanshir; used for entity facts only. The fullest biography: his dates 12 (24) July 1878 – 18 July 1921, a long account of the March 1918 events and of his assassin's trial, and his funeral at the Yahya Efendi lodge in Beşiktaş on 20 July 1921 turning into a mass demonstration. It names no school for him."
  es: "Artículo de la Wikipedia en azerbaiyano sobre Behbud Khan Javanshir; utilizado únicamente para datos sobre la persona. La biografía más completa: sus fechas 12 (24) de julio de 1878 – 18 de julio de 1921, un extenso relato de los sucesos de marzo de 1918 y del juicio de su asesino, y su funeral en la logia Yahya Efendi en Beşiktaş el 20 de julio de 1921, que se convirtió en una manifestación multitudinaria. No menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en azerbaïdjanais sur Behbud Khan Javanshir; utilisé uniquement à des fins d'information sur l'entité. Biographie complète: dates de naissance et de décès: 12 (24) juillet 1878 – 18 juillet 1921; récit détaillé des événements de mars 1918 et du procès de son assassin; et funérailles au pavillon Yahya Efendi à Beşiktaş le 20 juillet 1921, qui dégénérèrent en manifestation de masse. Aucune école n'est mentionnée."
