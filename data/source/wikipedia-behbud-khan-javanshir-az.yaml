  ar: "مقالة ويكيبيديا الأذربيجانية عن بهبود خان جوانشير؛ تُستخدم لوقائع الكيان فقط. أوفى سيرة له: تاريخاه 12 (24) يوليو 1878 – 18 يوليو 1921، ورواية مطوّلة لأحداث مارس 1918 ومحاكمة قاتله، وأن جنازته في تكية يحيى أفندي في بشيكتاش في 20 يوليو 1921 تحوّلت إلى مظاهرة جماهيرية. لا تسمي مذهبًا له."
  en: "Azerbaijani Wikipedia article on Behbud Khan Javanshir; used for entity facts only. The fullest biography: his dates 12 (24) July 1878 – 18 July 1921, a long account of the March 1918 events and of his assassin's trial, and his funeral at the Yahya Efendi lodge in Beşiktaş on 20 July 1921 turning into a mass demonstration. It names no school for him."
