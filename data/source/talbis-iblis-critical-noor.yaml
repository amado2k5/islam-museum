  en: "Ibn al-Jawzi, Talbis Iblis, a critical edition collated on manuscripts (scan without title page)"
  ur: "ابن الجوزی، تلبیس ابلیس، قلمی نسخوں پر مقابلہ شدہ محقق ایڈیشن ⁦(سرورق کے بغیر اسکین)⁩"
summary:
  ar: "نشرة محققة من «تلبيس إبليس» في 1571 صفحة متصلة الترقيم، يقابل محققها الأصل بنسختين يرمز لهما «أ» و«ت»، ويخرّج الأحاديث ويشرح الغريب، ويختم بفهارس للأعلام والأماكن والفرق والقبائل والغريب والمصطلحات والكتب والأبيات والمصادر والموضوعات؛ وصفحات العنوان والمقدمة غير موجودة في المسح، فلم يُعرف المحقق ولا الناشر."
  en: "A critical edition of Talbis Iblis in 1,571 continuously numbered pages; its editor collates the base copy with two manuscripts marked «أ» and «ت», documents the hadith and explains rare words, and closes with indexes of persons, places, sects, tribes, rare words, terms, books, verses, sources and topics. The title and introduction pages are missing from the scan, so the editor and publisher are not identified."
  ur: "«تلبیس ابلیس» کا ایک محقق ایڈیشن، 1571 مسلسل صفحات میں؛ محقق اصل نسخے کا «أ» اور «ت» نامی دو قلمی نسخوں سے مقابلہ کرتے، احادیث کی تخریج کرتے اور غریب الفاظ کی شرح کرتے ہیں، اور آخر میں اعلام، اماکن، فرق، قبائل، غریب، اصطلاحات، کتب، اشعار، مصادر اور موضوعات کی فہارس ہیں۔ سرورق اور مقدمے کے صفحات اسکین میں نہیں، اس لیے محقق اور ناشر معلوم نہیں ہو سکے۔"
