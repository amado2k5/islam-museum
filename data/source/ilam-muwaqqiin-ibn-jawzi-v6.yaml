label: { ar: "إعلام الموقعين عن رب العالمين لابن قيم الجوزية، المجلد السادس ⁦(دار ابن الجوزي 1423هـ)⁩", en: "Ibn Qayyim al-Jawziyya, I'lam al-Muwaqqi'in 'an Rabb al-'Alamin, vol. 6 (Dar Ibn al-Jawzi, 1423 AH)" }
summary:
  ar: "المجلد السادس والأخير من «إعلام الموقعين عن رب العالمين» لأبي عبد الله محمد بن أبي بكر بن أيوب ابن قيم الجوزية ⁦(ت 751هـ)⁩، في سلسلة مكتبة ابن القيم، دار ابن الجوزي، الطبعة الأولى رجب 1423هـ، مع تعليق وتخريج للأحاديث والآثار؛ يضم تمام الكلام في الاقتداء بالصحابة، ثم «فوائد تتعلق بالفتوى»، ثم فتاوى النبي في أبواب العقيدة والعبادات والمعاملات، وفهرس الموضوعات."
  en: "The sixth and last volume of I'lam al-Muwaqqi'in 'an Rabb al-'Alamin by Abu Abd Allah Muhammad ibn Abi Bakr ibn Ayyub Ibn Qayyim al-Jawziyya (d. 751 AH), in the Ibn al-Qayyim Library series, Dar Ibn al-Jawzi, 1st ed. Rajab 1423 AH, annotated with references for its hadiths and reports; it contains the end of the discussion of following the Companions, then the 'Benefits concerning the fatwa', then the Prophet's own fatwas on creed, worship and transactions, and a subject index."
  es: "El sexto y último volumen de I'lam al-Muwaqqi'in 'an Rabb al-'Alamin de Abu Abd Allah Muhammad ibn Abi Bakr ibn Ayyub Ibn Qayyim al-Jawziyya (m. 751 AH), en la serie Biblioteca Ibn al-Qayyim, Dar Ibn al-Jawzi, 1.ª ed. Rajab 1423 AH, anotado con referencias para sus hadices e informes; contiene el final de la discusión sobre seguir a los Compañeros, luego los 'Beneficios con respecto a la fatwa', luego las propias fatwas del Profeta sobre credo, adoración y transacciones, y un índice temático."
  fr: "Le sixième et dernier volume de I'lam al-Muwaqqi'in 'an Rabb al-'Alamin d'Abu Abd Allah Muhammad ibn Abi Bakr ibn Ayyub Ibn Qayyim al-Jawziyya (mort en 751 AH), dans la série Bibliothèque Ibn al-Qayyim, Dar Ibn al-Jawzi, 1re édition Rajab 1423 AH, annoté avec des références pour ses hadiths et ses récits; il contient la fin de la discussion sur le fait de suivre les Compagnons, puis les « Bienfaits concernant la fatwa », puis les fatwas du Prophète lui-même sur la croyance, le culte et les transactions, et un index des sujets."
  ur: "الام الموقعین عن رب العالمین کی چھٹی اور آخری جلد از ابو عبد اللہ محمد بن ابی بکر ابن ایوب ابن قیم الجوزیہ ⁦(متوفی 751ھ)⁩، ابن القیم لائبریری سیریز، دار ابن الجوزی، میں۔ رجب 1423ھ، اس کی احادیث اور رپورٹوں کے حوالے کے ساتھ تشریح؛ اس میں صحابہ کی پیروی کی بحث کا اختتام، پھر 'فتاویٰ سے متعلق فوائد'، پھر عقیدہ، عبادات اور لین دین کے بارے میں نبی کے اپنے فتوے، اور ایک مضمون کا اشاریہ شامل ہے۔"
