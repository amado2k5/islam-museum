summary:
  ar: "المجلد السادس والأخير من «إعلام الموقعين عن رب العالمين» لأبي عبد الله محمد بن أبي بكر بن أيوب ابن قيم الجوزية ⁦(ت 751هـ)⁩، في سلسلة مكتبة ابن القيم، دار ابن الجوزي، الطبعة الأولى رجب 1423هـ، مع تعليق وتخريج للأحاديث والآثار؛ يضم تمام الكلام في الاقتداء بالصحابة، ثم «فوائد تتعلق بالفتوى»، ثم فتاوى النبي في أبواب العقيدة والعبادات والمعاملات، وفهرس الموضوعات."
  en: "The sixth and last volume of I'lam al-Muwaqqi'in 'an Rabb al-'Alamin by Abu Abd Allah Muhammad ibn Abi Bakr ibn Ayyub Ibn Qayyim al-Jawziyya (d. 751 AH), in the Ibn al-Qayyim Library series, Dar Ibn al-Jawzi, 1st ed. Rajab 1423 AH, annotated with references for its hadiths and reports; it contains the end of the discussion of following the Companions, then the 'Benefits concerning the fatwa', then the Prophet's own fatwas on creed, worship and transactions, and a subject index."
