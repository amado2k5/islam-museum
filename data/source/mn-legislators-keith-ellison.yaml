  ar: "سجلّ كيث إليسون في قاعدة «مشرّعو منيسوتا في الماضي والحاضر» التابعة لمكتبة منيسوتا المرجعية التشريعية؛ يذكر ميلاده في 4 أغسطس 1963 في ديترويت، ودينه «مسلم» بصورة عامة، وتعليمه وخدمته التشريعية."
  en: "Minnesota Legislative Reference Library 'Minnesota Legislators Past & Present' record for Keith Ellison; it gives his birth on 4 August 1963 in Detroit, his religion as 'Muslim' generically, his education and his legislative service."
  es: "La Biblioteca de Referencia Legislativa de Minnesota, en su sección \"Legisladores de Minnesota: Pasados y Presentes\", contiene el registro de Keith Ellison; en él se indica que nació el 4 de agosto de 1963 en Detroit, que su religión es \"musulmana\" en general, su formación académica y su servicio legislativo."
  fr: "La notice de Keith Ellison dans la bibliothèque de référence législative du Minnesota, intitulée « Législateurs du Minnesota d'hier et d'aujourd'hui », indique sa naissance le 4 août 1963 à Détroit, sa religion (musulmane en général), son éducation et son service législatif."
  ur: "مینیسوٹا قانون ساز ریفرنس لائبریری 'مینیسوٹا قانون ساز ماضی اور حال' ریکارڈ برائے کیتھ ایلیسن؛ اس نے ڈیٹرائٹ میں 4 اگست 1963 کو ان کی پیدائش کی، اس کا مذہب بطور 'مسلمان' عام طور پر، اس کی تعلیم اور اس کی قانون سازی کی خدمات۔"
