summary:
  ar: "الجزء الثامن من «المجموع شرح المهذب للشيرازي» للإمام أبي زكريا محيي الدين بن شرف النووي، في «الطبعة الوحيدة الكاملة» التي صححها وعلّق عليها وأكملها محمد نجيب المطيعي، الأستاذ بجامعة أم درمان الإسلامية، الناشر مكتبة الإرشاد بجدة. يضم بقية كتاب الحج من باب صفة الحج والعمرة، ثم الأضحية والعقيقة والنذر وما يليها."
  en: "Volume 8 of al-Majmu' Sharh al-Muhadhdhab li-l-Shirazi by Imam Abu Zakariyya Muhyi al-Din ibn Sharaf al-Nawawi, in the 'only complete edition' corrected, annotated and completed by Muhammad Najib al-Muti'i of Omdurman Islamic University, published by Maktabat al-Irshad, Jeddah. It contains the rest of the Book of Pilgrimage from the chapter on the manner of hajj and umra, then sacrifice, the birth sacrifice, vows and what follows."
  es: "Volumen 8 de al-Majmu' Sharh al-Muhadhdhab li-l-Shirazi del Imam Abu Zakariyya Muhyi al-Din ibn Sharaf al-Nawawi, en la única edición completa corregida, anotada y completada por Muhammad Najib al-Muti'i de la Universidad Islámica de Omdurman, publicada por Maktabat al-Irshad, Jeddah. Contiene el resto del Libro de la Peregrinación desde el capítulo sobre la forma de realizar el Hajj y la Umrah, luego el sacrificio, el sacrificio del nacimiento, los votos y lo que sigue."
  fr: "Le volume 8 d'al-Majmu' Sharh al-Muhadhdhab li-l-Shirazi, de l'imam Abu Zakariyya Muhyi al-Din ibn Sharaf al-Nawawi, dans la seule édition complète corrigée, annotée et complétée par Muhammad Najib al-Muti'i de l'Université islamique d'Omdurman, publiée par Maktabat al-Irshad à Djeddah, contient la suite du Livre du Pèlerinage, depuis le chapitre sur les modalités du hajj et de la umra, puis le sacrifice, le sacrifice de naissance, les vœux et les suites de celui-ci."
