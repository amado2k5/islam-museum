summary:
  ar: "الجزء الثامن من «المجموع شرح المهذب للشيرازي» للإمام أبي زكريا محيي الدين بن شرف النووي، في «الطبعة الوحيدة الكاملة» التي صححها وعلّق عليها وأكملها محمد نجيب المطيعي، الأستاذ بجامعة أم درمان الإسلامية، الناشر مكتبة الإرشاد بجدة. يضم بقية كتاب الحج من باب صفة الحج والعمرة، ثم الأضحية والعقيقة والنذر وما يليها."
  en: "Volume 8 of al-Majmu' Sharh al-Muhadhdhab li-l-Shirazi by Imam Abu Zakariyya Muhyi al-Din ibn Sharaf al-Nawawi, in the 'only complete edition' corrected, annotated and completed by Muhammad Najib al-Muti'i of Omdurman Islamic University, published by Maktabat al-Irshad, Jeddah. It contains the rest of the Book of Pilgrimage from the chapter on the manner of hajj and umra, then sacrifice, the birth sacrifice, vows and what follows."
