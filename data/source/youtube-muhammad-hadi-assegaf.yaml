summary:
  ar: "قناة محمد هادي عسقاف على يوتيوب؛ تصدر أغانيه عبر شركة RPM ⁦(رويال بريما موسيكيندو)⁩، وتصفه أوصاف فيديوهاته الرسمية بأنه طفل إندونيسي موهوب معروف بـ«حبيب عسقاف»."
  en: "Muhammad Hadi Assegaf's YouTube channel; his recordings are released by the RPM label (PT Royal Prima Musikindo), and his official video descriptions call him a talented Indonesian kid known as 'Habib Assegaf'."
  es: "El canal de YouTube de Muhammad Hadi Assegaf; sus grabaciones son lanzadas por el sello RPM (PT Royal Prima Musikindo), y las descripciones oficiales de sus videos lo describen como un talentoso niño indonesio conocido como 'Habib Assegaf'."
  fr: "La chaîne YouTube de Muhammad Hadi Assegaf; ses enregistrements sont publiés par le label RPM (PT Royal Prima Musikindo), et les descriptions officielles de ses vidéos le présentent comme un jeune Indonésien talentueux connu sous le nom de « Habib Assegaf »."
  ur: "محمد ہادی آصف کا یوٹیوب چینل؛ اس کی ریکارڈنگز کو RPM لیبل (PT Royal Prima Musikindo) کے ذریعے جاری کیا جاتا ہے، اور اس کی سرکاری ویڈیو کی تفصیل اسے ایک باصلاحیت انڈونیشیائی بچہ کہتے ہیں جسے 'حبیب اسیگف' کے نام سے جانا جاتا ہے۔"
  tr: "Mohamed Hadi Askaqaf'ın YouTube kanalı şarkılarını RPM (Royal Prima Musikindo) aracılığıyla yayınlıyor ve resmi video açıklamalarında onu \"Habib Askaq\" olarak bilinen yetenekli bir Endonezyalı çocuk olarak tanımlıyor."
  id: "Channel YouTube Mohamed Hadi Askaqaf merilis lagu-lagunya melalui RPM (Royal Prima Musikindo), dan deskripsi video resminya menggambarkan dia sebagai anak Indonesia berbakat yang dikenal sebagai \"Habib Askaq.\""
