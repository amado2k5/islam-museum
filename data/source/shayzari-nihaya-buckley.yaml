summary:
  ar: "ترجمة ر. پ. باكلي الإنجليزية لكتاب «نهاية الرتبة في طلب الحسبة» لعبد الرحمن بن نصر الشيزري، وهو دليل حسبة من القرن السادس الهجري يسرد قواعد ضبط السوق حرفةً حرفة: الخبّازين وأصحاب الأفران والنسّاجين والخيّاطين والحدّادين والحمّامات وأصحابها والسقّائين وغيرهم."
  en: "R. P. Buckley's English translation of al-Shayzari's Nihayat al-Rutba fi Talab al-Hisba, a twelfth-century hisba manual that lays out market-inspection rules trade by trade: bakers and oven keepers, weavers, tailors, coppersmiths and blacksmiths, baths and their attendants, water-carriers and more, with an introduction on the muhtasib's office."
  es: "Traducción al inglés de RP Buckley del Nihayat al-Rutba fi Talab al-Hisba de al-Shayzari, un manual de hisba del siglo XII que establece las normas de inspección del mercado para cada oficio: panaderos y encargados de hornos, tejedores, sastres, caldereros y herreros, baños y sus asistentes, aguadores y más, con una introducción sobre la oficina del muhtasib."
  fr: "La traduction anglaise par RP Buckley du Nihayat al-Rutba fi Talab al-Hisba d'al-Shayzari, un manuel hisba du XIIe siècle qui expose les règles d'inspection du marché métier par métier: boulangers et fourneaux, tisserands, tailleurs, chaudronniers et forgerons, bains et leurs employés, porteurs d'eau et plus encore, avec une introduction sur le bureau du muhtasib."
title: "The Book of the Islamic Market Inspector: Nihayat al-Rutba fi Talab al-Hisba (the Utmost Authority in the Pursuit of Hisba) by 'Abd al-Rahman b. Nasr al-Shayzari"
