summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد زكي ⁦(وُلد في 24 آب 1986)⁩، رائد أعمال إنترنت ومستثمر إندونيسي، شارك في تأسيس شركة التجارة الإلكترونية بوكالاباك وتولى إدارتها التنفيذية حتى كانون الثاني 2020، ثم أسس صندوق الاستثمار الجريء إنيت6؛ تذكر دراسته لهندسة المعلوماتية في معهد باندونغ للتكنولوجيا ووسام ساتيالانكانا ويرا كاريا سنة 2016 وزواجه من مؤسسة هيجوب دياجنغ ليستاري."
  en: "English Wikipedia article on Achmad Zaky (born 24 August 1986), Indonesian internet entrepreneur and investor, co-founder and former chief executive of the e-commerce company Bukalapak, who resigned in January 2020 and founded the venture fund Init6; it records his informatics engineering studies at the Bandung Institute of Technology, his 2016 Satyalancana Wira Karya award, and his marriage to HijUp founder Diajeng Lestari."
  es: "Artículo de la Wikipedia en inglés sobre Achmad Zaky (nacido el 24 de agosto de 1986), empresario e inversor indonesio de internet, cofundador y ex director ejecutivo de la empresa de comercio electrónico Bukalapak, que renunció en enero de 2020 y fundó el fondo de capital riesgo Init6; en él se recogen sus estudios de ingeniería informática en el Instituto Tecnológico de Bandung, su premio Satyalancana Wira Karya de 2016 y su matrimonio con la fundadora de HijUp, Diajeng Lestari."
  fr: "L'article de Wikipédia en anglais sur Achmad Zaky (né le 24 août 1986), entrepreneur et investisseur indonésien du secteur internet, cofondateur et ancien directeur général de la société de commerce électronique Bukalapak, qui a démissionné en janvier 2020 et fondé le fonds de capital-risque Init6; il relate ses études d'ingénierie informatique à l'Institut de technologie de Bandung, son prix Satyalancana Wira Karya 2016 et son mariage avec Diajeng Lestari, fondatrice de HijUp."
  ur: "احمد زکی ⁦(پیدائش 24 اگست 1986)⁩ پر انگریزی ویکیپیڈیا کا مضمون، انڈونیشیا کے انٹرنیٹ کاروباری اور سرمایہ کار، ای کامرس کمپنی بوکالاپک کے شریک بانی اور سابق چیف ایگزیکٹو، جنہوں نے جنوری 2020 میں استعفیٰ دے دیا اور وینچر فنڈ Init6 کی بنیاد رکھی؛ اس میں بینڈونگ انسٹی ٹیوٹ آف ٹیکنالوجی میں ان کی انفارمیٹکس انجینئرنگ کی تعلیم، ان کا 2016 کا ستیلانکانا ویرا کریا ایوارڈ، اور HijUp کے بانی Diajeng Lestari سے ان کی شادی کو ریکارڈ کیا گیا ہے۔"
