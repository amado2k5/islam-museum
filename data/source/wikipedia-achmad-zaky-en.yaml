summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد زكي (وُلد في 24 آب 1986)، رائد أعمال إنترنت ومستثمر إندونيسي، شارك في تأسيس شركة التجارة الإلكترونية بوكالاباك وتولى إدارتها التنفيذية حتى كانون الثاني 2020، ثم أسس صندوق الاستثمار الجريء إنيت6؛ تذكر دراسته لهندسة المعلوماتية في معهد باندونغ للتكنولوجيا ووسام ساتيالانكانا ويرا كاريا سنة 2016 وزواجه من مؤسسة هيجوب دياجنغ ليستاري."
  en: "English Wikipedia article on Achmad Zaky (born 24 August 1986), Indonesian internet entrepreneur and investor, co-founder and former chief executive of the e-commerce company Bukalapak, who resigned in January 2020 and founded the venture fund Init6; it records his informatics engineering studies at the Bandung Institute of Technology, his 2016 Satyalancana Wira Karya award, and his marriage to HijUp founder Diajeng Lestari."
