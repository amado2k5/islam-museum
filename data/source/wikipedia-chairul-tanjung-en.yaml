summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خيرول تانجونغ، المولود في 18 حزيران 1962 في جاكرتا، مؤسس مجموعة سي تي كورب ووزير تنسيق الشؤون الاقتصادية الإندونيسي سنة 2014؛ تذكر نشأته ودراسته طب الأسنان وبناءه بنك ميغا وقنوات ترانس التلفزيونية."
  en: "English Wikipedia article on Chairul Tanjung, born 18 June 1962 in Jakarta, founder of CT Corp and Indonesia's Coordinating Minister for Economic Affairs in 2014; it records his upbringing, his dentistry studies, and his building of Bank Mega and the Trans television channels."
  es: "Artículo de la Wikipedia en inglés sobre Chairul Tanjung, nacido el 18 de junio de 1962 en Yakarta, fundador de CT Corp y Ministro Coordinador de Asuntos Económicos de Indonesia en 2014; en él se narra su infancia, sus estudios de odontología y la creación de Bank Mega y los canales de televisión Trans."
  fr: "Article de Wikipédia en anglais sur Chairul Tanjung, né le 18 juin 1962 à Jakarta, fondateur de CT Corp et ministre coordinateur des affaires économiques de l'Indonésie en 2014; il relate son enfance, ses études de dentisterie et la création de la Bank Mega et des chaînes de télévision Trans."
  ur: "چیرال تنجنگ پر انگریزی ویکیپیڈیا کا مضمون، 18 جون 1962 کو جکارتہ میں پیدا ہوا، سی ٹی کارپوریشن کے بانی اور 2014 میں انڈونیشیا کے کوآرڈینیٹنگ وزیر برائے اقتصادی امور؛ اس میں اس کی پرورش، اس کی دندان سازی کی تعلیم، اور بینک میگا اور ٹرانس ٹیلی ویژن چینلز کی اس کی عمارت کو ریکارڈ کیا گیا ہے۔"
  tr: "18 Haziran 1962'de Jakarta'da doğan, CT Corp Group'un kurucusu ve 2014 yılında Endonezya Ekonomik Koordinasyon Bakanı olan Khairol Tanjung hakkında İngilizce Wikipedia makalesi; başlangıcı, diş hekimliği eğitimi ve Mega Bank ile Trans TV kanallarının inşasından bahsediyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Khairol Tanjung, lahir pada 18 Juni 1962 di Jakarta, pendiri CT Corp Group dan Menteri Koordinasi Ekonomi Indonesia pada tahun 2014; artikel tersebut menyebutkan awal kariernya, studi kedokteran gigi, dan pembangunan saluran Mega Bank serta Trans TV."
