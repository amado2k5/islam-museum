summary:
  ar: "صفحة «Palestinian Arabic» لدى Brill (EALL Online)، EALL Online, first online 30 May 2011, updated 25 Mar 2019. لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملف بحث قدمه المؤسس إلى المتحف ووافق على استعماله في 21 نوفمبر 2026. يُستشهد بها في: التصنيف والتجميع، الأصوات، الصرف، النحو، المفردات، أعداد المتكلمين أو غيابها."
  en: "The page \"Palestinian Arabic\" (Brill (EALL Online); EALL Online, first online 30 May 2011, updated 25 Mar 2019). The museum did not open it itself: its content is known from a research file supplied to the museum by the founder, who approved its use on 21 November 2026. Cited for: classification and grouping, phonology, morphology, syntax, lexicon, speaker numbers or the lack of them."
  ur: "صفحہ «Palestinian Arabic»، Brill (EALL Online)، EALL Online, first online 30 May 2011, updated 25 Mar 2019۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کا مواد بانی کی فراہم کردہ تحقیقی فائل سے معلوم ہوا، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ ان کے لیے دیا گیا: درجہ بندی اور گروہ بندی، صوتیات، صرف، نحو، ذخیرہ الفاظ، بولنے والوں کی تعداد یا اس کی عدم دستیابی۔"
  fr: "La page « Palestinian Arabic » (Brill (EALL Online) ; EALL Online, first online 30 May 2011, updated 25 Mar 2019). Le musée ne l'a pas ouverte lui-même : son contenu est connu par un dossier de recherche fourni au musée par le fondateur, qui en a approuvé l'usage le 21 novembre 2026. Citée pour : la classification et le regroupement, la phonologie, la morphologie, la syntaxe, le lexique, le nombre de locuteurs ou son absence."
  es: "La página «Palestinian Arabic» (Brill (EALL Online); EALL Online, first online 30 May 2011, updated 25 Mar 2019). El museo no la abrió por sí mismo: su contenido se conoce por un archivo de investigación entregado al museo por el fundador, que aprobó su uso el 21 de noviembre de 2026. Citada para: la clasificación y la agrupación, la fonología, la morfología, la sintaxis, el léxico, el número de hablantes o su ausencia."
  tr: "Brill'deki \"Filistin Arapçası\" sayfası (EALL Online), EALL Online, ilk çevrimiçi 30 Mayıs 2011, 25 Mart 2019'da güncellendi. Müze bunu kendisi açmadı; içeriği, kurucu tarafından müzeye sunulan bir araştırma dosyasından biliniyordu ve 21 Kasım 2026'da kullanmayı kabul etti. Sınıflandırma ve gruplandırma, fonetik, morfoloji, dilbilgisi, kelime dağarcığı, konuşmacı sayısı veya yokluğu gibi alanlarda atıf yapılıyor."
  id: "Halaman \"Arab Palestina\" di Brill (EALL Online), EALL Online, pertama kali online 30 Mei 2011, diperbarui 25 Mar 2019. Museum tidak membukanya sendiri; isinya diketahui dari berkas penelitian yang diserahkan oleh pendiri museum dan ia setuju menggunakannya pada 21 November 2026. Halaman ini dikutip dalam: klasifikasi dan pengelompokan, fonetik, morfologi, tata bahasa, kosakata, jumlah penutur, atau ketidakhadirannya."
