summary:
  ar: "مقالة ويكيبيديا الأردية الموجزة عن التتمش؛ تعطي وفاته في 28 أبريل 1236 وخلعه آرام شاه سنة 1211 وإتمامه قطب منار ومسجد قوة الإسلام؛ تُستخدم لوقائع الكيان فقط."
  en: "Urdu Wikipedia stub on Iltutmish; it gives his death on 28 April 1236, his dethroning of Aram Shah in 1211, and his completion of the Qutb Minar and the Quwwat-ul-Islam mosque; used for entity facts only, each cited where the article gives its own source."
  es: "Fragmento de la Wikipedia en urdu sobre Iltutmish; indica su muerte el 28 de abril de 1236, su derrocamiento de Aram Shah en 1211 y la finalización del Qutb Minar y la mezquita Quwwat-ul-Islam; se utiliza únicamente para datos sobre las entidades, citados donde el artículo proporciona su propia fuente."
  fr: "Ébauche de l'article Wikipédia en ourdou sur Iltutmish; elle indique sa mort le 28 avril 1236, sa destitution d'Aram Shah en 1211 et l'achèvement du Qutb Minar et de la mosquée Quwwat-ul-Islam; utilisée uniquement pour les informations sur l'entité, chaque élément étant cité lorsque l'article donne sa propre source."
  ur: "التمش پر اردو ویکیپیڈیا اسٹب؛ یہ 28 اپریل 1236 کو ان کی موت، 1211 میں ارم شاہ کا تختہ الٹنے، اور قطب مینار اور قوۃ الاسلام مسجد کی تکمیل کو بتاتا ہے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک کا حوالہ دیا جاتا ہے جہاں مضمون اپنا ماخذ دیتا ہے۔"
  tr: "El-Tatmash hakkında kısa Urduca Vikipedi makalesi; 28 Nisan 1236'daki ölümü, 1211'de Aram Şah tarafından tahttan indirilişi ve Qutb Minar ile Qutb al-Islam Camii'nin tamamlanması gibi bilgiler verilmektedir; sadece varlığın gerçekleri için kullanılır."
  id: "Artikel singkat Wikipedia dalam bahasa Urdu tentang al-Tatmash; menceritakan kematiannya pada 28 April 1236, pendepotannya oleh Aram Shah pada tahun 1211, serta penyelesaian Qutb Minar dan Masjid Qutb al-Islam; hanya digunakan untuk fakta entitas."
