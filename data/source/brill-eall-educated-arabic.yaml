  ar: "مدخل «Educated Arabic»، Brill, Encyclopedia of Arabic Language and Linguistics (EALL). لم يفتح المتحف هذا المرجع بنفسه؛ عُرف ما قيل عنه من ملخص بحثي قدّمه المؤسس إلى المتحف ووافق على استعماله في 21 نوفمبر 2026. يُستشهد به في: العربية المحكية المثقفة، سلّم المستويات بين الفصحى والعاميات."
  en: "The entry \"Educated Arabic\" (Brill, Encyclopedia of Arabic Language and Linguistics (EALL)). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum by the founder, who approved its use on 21 November 2026. Cited for: Educated Spoken Arabic, the continuum between standard Arabic and the dialects."
  ur: "اندراج «Educated Arabic»، Brill, Encyclopedia of Arabic Language and Linguistics (EALL)۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ بانی کے فراہم کردہ تحقیقی خلاصے سے ہے، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ ان کے لیے دیا گیا: تعلیم یافتہ طبقے کی بول چال کی عربی، فصیح اور بولیوں کے درمیان درجوں کا سلسلہ۔"
  fr: "L'entrée « Educated Arabic » (Brill, Encyclopedia of Arabic Language and Linguistics (EALL)). Le musée ne l'a pas ouvert lui-même : ce qu'on en sait vient d'un résumé de recherche fourni au musée par le fondateur, qui en a approuvé l'usage le 21 novembre 2026. Cité pour : l'arabe parlé éduqué, le continuum entre l'arabe standard et les dialectes."
  es: "La entrada «Educated Arabic» (Brill, Encyclopedia of Arabic Language and Linguistics (EALL)). El museo no lo abrió por sí mismo: lo que se sabe de él procede de un resumen de investigación entregado al museo por el fundador, que aprobó su uso el 21 de noviembre de 2026. Citado para: el árabe hablado educado, el continuo entre el árabe estándar y los dialectos."
  tr: "\"Eğitimli Arapça\" için giriş, Brill, Arap Dili ve Dilbilim Ansiklopedisi (EALL). Müze bu referansı bizzat açmadı; kurucusunun müzeye sunduğu bir araştırma özetinden söylenenleri öğrendi ve 21 Kasım 2026'da kullanımını onayladı. Atıf Alanı: Kültürlü Konuşulan Arapça, Standart Arapça ve Günlük Diller Arasında Derecelendirilmiş."
  id: "Entri untuk \"Arab Terdidik,\" Brill, Ensiklopedia Bahasa dan Linguistik Arab (EALL). Museum tidak membuka referensi ini sendiri; museum mengetahui apa yang dikatakan tentangnya dari ringkasan penelitian yang diajukan oleh pendiri kepada museum dan menyetujui penggunaannya pada 21 November 2026. Dikutip dalam: Bahasa Arab Lisan Berbudaya, Dinilai antara Bahasa Arab Standar dan Bahasa Sehari-hari."
