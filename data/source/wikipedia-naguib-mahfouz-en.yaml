reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth in Cairo on 11 December 1911 and his naming after the obstetrician Naguib Pasha Mahfouz, the family's move from Gamaleya to Abbaseya in 1924, his philosophy degree from Cairo University (1934), his civil-service career to 1971, the Cairo Trilogy, Children of Gebelawi (1959) and its ban across the Arab world except Lebanon until its first Egyptian publication in 2006, the 1988 Nobel Prize in Literature, his defence of Salman Rushdie against the 1989 death fatwa while calling The Satanic Verses insulting to Islam, the 14 October 1994 stabbing and its aftermath, his marriage in 1954 and two daughters, and his death on 30 August 2006. The article's lead counts 35 novels while its writing-career section counts 34; both figures are recorded in the prose. Its lead currently says the Academy credited him with forming an 'Egyptian narrative art', where the Nobel Prize's own record (and the Academy letter the article itself quotes) says 'Arabian narrative art'; the Nobel wording is used. Read in full on 24 October 2026."
