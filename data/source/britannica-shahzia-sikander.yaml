summary:
  ar: "مدخل موسوعة بريتانيكا عن شهزية سكندر؛ يؤرخ ميلادها في لاهور في 6 مارس 1969، ويصف إحياءها فنّ المنمنمات الهندية، وعملها «المخطوطة» (1990)، وانتقالها إلى أمريكا، ومنحوتتي «الآن» و«الشاهدة» وجوائزها ومنها زمالة ماك آرثر سنة 2006."
  en: "Encyclopaedia Britannica entry on Shahzia Sikander; it dates her birth to 6 March 1969 in Lahore and describes her revival of Indian miniature painting, The Scroll (1990), her move to the United States, the NOW and Witness sculptures, and her awards including the 2006 MacArthur Fellowship."
  es: "Entrada de la Enciclopedia Británica sobre Shahzia Sikander; en ella se fecha su nacimiento el 6 de marzo de 1969 en Lahore y se describe su resurgimiento de la pintura en miniatura india, The Scroll (1990), su traslado a los Estados Unidos, las esculturas NOW y Witness, y sus premios, incluida la beca MacArthur de 2006."
  fr: "L'article de l'Encyclopædia Britannica sur Shahzia Sikander date sa naissance du 6 mars 1969 à Lahore et décrit sa renaissance de la peinture miniature indienne, The Scroll (1990), son déménagement aux États-Unis, les sculptures NOW et Witness, et ses récompenses, dont la bourse MacArthur de 2006."
  ur: "شاہزیہ سکندر پر انسائیکلوپیڈیا برٹانیکا کا اندراج؛ اس میں اس کی پیدائش 6 مارچ 1969 کو لاہور میں ہے اور اس میں ان کی ہندوستانی چھوٹی پینٹنگ، دی اسکرول (1990) کے احیاء، اس کے امریکہ منتقل ہونے، NOW اور Witness کے مجسمے، اور 2006 کے میک آرتھر فیلوشپ سمیت اس کے ایوارڈز کو بیان کیا گیا ہے۔"
  tr: "Encyclopaedia Britannica'daki Shahzia Sikandar hakkındaki madde, 6 Mart 1969'da Lahor'da doğduğunu ve Hint minyatür sanatının yeniden canlanışını, \"The Manuscript\" (1990) eserini, Amerika'ya taşınmasını, \"Now\" ve \"The Witness\" heykellerini ve 2006'daki MacArthur Bursu dahil ödüllerini anlatıyor."
  id: "Entri dalam Encyclopaedia Britannica tentang Shahzia Sikandar mencatat kelahirannya di Lahore pada 6 Maret 1969, menggambarkan kebangkitan seni miniatur India, karyanya \"The Manuscript\" (1990), perpindahannya ke Amerika, patung \"Now\" dan \"The Witness,\" serta penghargaan yang diterimanya, termasuk MacArthur Fellowship pada tahun 2006."
