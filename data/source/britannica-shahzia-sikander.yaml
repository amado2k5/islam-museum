  ar: "مدخل موسوعة بريتانيكا عن شهزية سكندر؛ يؤرخ ميلادها في لاهور في 6 مارس 1969، ويصف إحياءها فنّ المنمنمات الهندية، وعملها «المخطوطة» (1990)، وانتقالها إلى أمريكا، ومنحوتتي «الآن» و«الشاهدة» وجوائزها ومنها زمالة ماك آرثر سنة 2006."
  en: "Encyclopaedia Britannica entry on Shahzia Sikander; it dates her birth to 6 March 1969 in Lahore and describes her revival of Indian miniature painting, The Scroll (1990), her move to the United States, the NOW and Witness sculptures, and her awards including the 2006 MacArthur Fellowship."
