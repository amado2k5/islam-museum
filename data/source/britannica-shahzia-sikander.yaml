reliability_note: "Reference entry read in full on 25 October 2026. It gives the full birth date and place that the English Wikipedia article gives only as a year. It records her study with the miniaturist Bashir Ahmad, The Scroll, her 1993 move to the United States and 1995 MFA, her work in animation and sculpture, and the protests against Witness at the University of Houston and her decision not to repair the beheaded sculpture. In describing her move it speaks of 'the challenges of being an immigrant and a Muslim woman' — a description of her identity, naming no school or path for her."
