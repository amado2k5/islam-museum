  en: "Tahdhib Tafsir al-Baghawi (Ma'alim al-Tanzil), ed. Sulayman Muslim al-Harsh, Uthman Jum'a Dumayriyya and Muhammad Abd Allah al-Nimr (Dar Tayba, Riyadh, 1st ed., 2009)"
  ur: "تہذیب تفسیر البغوی (معالم التنزیل) — تحقیق سلیمان مسلم الحرش، عثمان جمعہ ضمیریہ، محمد عبد اللہ النمر (دار طیبہ، ریاض، پہلا ایڈیشن، 2009ء)"
summary:
  ar: "مختصر لتفسير البغوي «معالم التنزيل» في مجلد واحد (1343 صفحة) أعده محققو طبعة دار طيبة الكاملة، مع المحافظة على عبارة المصنف، وحذف الأسانيد والإسرائيليات وكثير من الآراء الفقهية والقراءات؛ وفي أوله مقدمة وترجمة للبغوي."
  en: "A one-volume abridgement (1,343 pages) of al-Baghawi's Ma'alim al-Tanzil prepared by the editors of Dar Tayba's full edition, keeping the author's wording while dropping the chains of transmission, the Isra'iliyyat and much of the legal discussion and variant readings; it opens with an introduction and a biography of al-Baghawi."
  ur: "البغوی کی تفسیر «معالم التنزیل» کا ایک جلد (1343 صفحات) کا اختصار، جسے دار طیبہ کے مکمل ایڈیشن کے محققین نے تیار کیا، مصنف کی عبارت برقرار رکھتے ہوئے اسانید، اسرائیلیات اور بہت سی فقہی آرا اور قراءتیں حذف کر کے؛ اس کے آغاز میں مقدمہ اور البغوی کے سوانح ہیں۔"
