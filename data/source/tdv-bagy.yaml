label:
  ar: "البغي — موسوعة TDV الإسلامية ⁦(علي شفق)⁩"
  en: "BAĞY (armed rebellion) — TDV İslâm Ansiklopedisi (Ali Şafak)"
summary:
  ar: "مدخل «بغي» في موسوعة TDV الإسلامية: المصطلح الفقهي للخروج المسلح على الإمام العادل، شروطه الثلاثة عند المذاهب — أن يكون على إمام عدل، بالقوة، بقصد العزل وعلى تأويل — وأحكام أهل البغي في الحرب وبعدها، وأساسه الآية ٩ من سورة الحجرات وسيرة علي في الجمل ونهروان."
  en: "The TDV İslâm Ansiklopedisi entry on baghy: the juristic term for armed rising against a legitimate ruler, its three conditions in the schools — a just imam, the use of force, and intent to depose on a ta'wil — the rules on rebels in war and after, grounded in al-Hujurat 49:9 and Ali's conduct at the Camel and Nahrawan."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre baghy: el término jurídico para el levantamiento armado contra un gobernante legítimo, sus tres condiciones en las escuelas: un imán justo, el uso de la fuerza y la intención de deponer en un ta'wil; las reglas sobre los rebeldes en la guerra y después, basadas en al-Hujurat 49:9 y la conducta de Ali en Camel y Nahrawan."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur le baghy: le terme juridique pour le soulèvement armé contre un dirigeant légitime, ses trois conditions dans les écoles — un imam juste, l'usage de la force et l'intention de déposer sur un ta'wil — les règles sur les rebelles en temps de guerre et après, fondées sur al-Hujurat 49:9 et la conduite d'Ali au Chameau et à Nahrawan."
  ur: "باغی پر TDV İslâm Ansiklopedisi entry: ایک جائز حکمران کے خلاف مسلح اٹھنے کی فقہی اصطلاح، مکاتب میں اس کی تین شرائط — ایک عادل امام، طاقت کا استعمال، اور تعویذ پر معزول کرنے کا ارادہ — جنگ اور اس کے بعد باغیوں سے متعلق قوانین، الحجرات اور عالیہ نعوذ باللہ 49 میں موجود ہیں۔"
