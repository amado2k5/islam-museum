  ar: مقالة ويكيبيديا الإنجليزية عن جليل ممدقولوزاده؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في نخجوان في 22 فبراير 1869 ووفاته في باكو في 4 يناير 1932، وتعليمه في معهد غوري وتدريسه القروي وتأسيسه «ملا نصر الدين» سنة 1906 وفترتها التبريزية وقصصه ومسرحياته، وفيها قسم «آراؤه الدينية» يصف آراءه بأنها متنازع عليها.
  en: English Wikipedia article on Jalil Mammadguluzadeh; used for entity facts only. It gives his birth at Nakhchivan on 22 February 1869 and death at Baku on 4 January 1932, his Gori seminary education and village teaching, the founding of Molla Nasreddin in 1906 and its Tabriz period, his stories and plays, and a 'Religious views' section calling those views disputed.
