summary:
  ar: مقالة ويكيبيديا الإنجليزية عن جليل ممدقولوزاده؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في نخجوان في 22 فبراير 1869 ووفاته في باكو في 4 يناير 1932، وتعليمه في معهد غوري وتدريسه القروي وتأسيسه «ملا نصر الدين» سنة 1906 وفترتها التبريزية وقصصه ومسرحياته، وفيها قسم «آراؤه الدينية» يصف آراءه بأنها متنازع عليها.
  en: English Wikipedia article on Jalil Mammadguluzadeh; used for entity facts only. It gives his birth at Nakhchivan on 22 February 1869 and death at Baku on 4 January 1932, his Gori seminary education and village teaching, the founding of Molla Nasreddin in 1906 and its Tabriz period, his stories and plays, and a 'Religious views' section calling those views disputed.
  es: "Artículo de la Wikipedia en inglés sobre Jalil Mammadguluzadeh; utilizado únicamente para datos sobre la persona. Menciona su nacimiento en Najicheván el 22 de febrero de 1869 y su muerte en Bakú el 4 de enero de 1932, su educación en el seminario de Gori y su enseñanza en el pueblo, la fundación de Molla Nasreddin en 1906 y su período en Tabriz, sus cuentos y obras de teatro, y una sección de \"Opiniones religiosas\" que califica dichas opiniones como controvertidas."
  fr: "Article de Wikipédia en anglais sur Jalil Mammadguluzadeh; utilisé uniquement pour les informations le concernant. Il indique sa naissance à Nakhitchevan le 22 février 1869 et sa mort à Bakou le 4 janvier 1932, sa formation au séminaire de Gori et son enseignement dans les villages, la fondation de Molla Nasreddin en 1906 et sa période à Tabriz, ses contes et pièces de théâtre, ainsi qu'une section intitulée « Conceptions religieuses » qualifiant ces opinions de controversées."
  ur: "جلیل ممد گلزادہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 22 فروری 1869 کو نخچیوان میں ان کی پیدائش اور 4 جنوری 1932 کو باکو میں موت، اس کی گوری مدرسہ کی تعلیم اور گاؤں کی تدریس، 1906 میں ملا نصرالدین کی تاسیس اور اس کا تبریز کا دور، اس کی کہانیاں اور ڈرامے، اور ایک 'مذہبی نظریات' سیکشن جو کہ ان خیالات کو متنازعہ قرار دیتا ہے۔"
  tr: "Celil Mamdqolozadeh hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 22 Şubat 1869'da Nahçıvan'da doğduğunu, 4 Ocak 1932'de Bakü'de öldüğünü, Gori Enstitüsü'ndeki eğitimini, kırsal öğretimini ve 1906'da 'Mela Nasr al-Din'i kurmasını, Tebriz dönemini, hikayelerini ve oyunlarını anlatır. Burada 'Dini Görüşleri' başlıklı bir bölüm bulunur ve görüşleri tartışmalı olarak tanımlanır."
  id: "Artikel Wikipedia bahasa Inggris tentang Jalil Mamdqolozadeh; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya di Nakhchivan pada 22 Februari 1869, kematiannya di Baku pada 4 Januari 1932, pendidikannya di Institut Gori, pengajarannya di pedesaan, dan pendirian 'Mulla Nasr al-Din' pada tahun 1906, periode Tabriz, cerita-ceritanya, dan drama-dramanya. Artikel ini memuat bagian tentang 'Pandangan Religiusnya' yang menggambarkan pandangannya sebagai sesuatu yang diperdebatkan."
