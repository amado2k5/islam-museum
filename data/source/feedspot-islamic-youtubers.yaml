summary:
  ar: "قائمة دليل فيدسبوت لقنوات اليوتيوب الإسلامية؛ يرد فيها محمد علي ⁦(يوث كلوب)⁩ بوصفه معلّمًا ومدرّبًا وخطيبًا تحفيزيًا، مع رقم مشتركين يقارب 1.1 مليون ومتابعين على إنستغرام يقارب 930 ألفًا، لكن نص القائمة يذكر مؤهله «دبلوم دراسات عليا في علم النفس التطبيقي» بدل «ماجستير» الوارد في سيرته بقناته."
  en: "Feedspot's directory of Islamic YouTube channels; its entry for Muhammad Ali (Youth Club) gives about 1.1 million subscribers and about 930,000 Instagram followers, and describes him as a teacher, trainer and motivational speaker — but its text gives his qualification as a 'Post Graduate Diploma in Applied Psychology' where his own channel biography says a Masters."
  es: "El directorio de canales islámicos de YouTube de Feedspot, en su entrada para Muhammad Ali (Youth Club), indica que tiene alrededor de 1,1 millones de suscriptores y unos 930.000 seguidores en Instagram, y lo describe como profesor, formador y orador motivacional; sin embargo, el texto menciona que su titulación es un \"Diploma de Posgrado en Psicología Aplicada\", mientras que la biografía de su propio canal afirma que tiene un Máster."
  fr: "Le répertoire Feedspot des chaînes YouTube islamiques; sa fiche pour Muhammad Ali (Youth Club) indique environ 1,1 million d'abonnés et environ 930 000 abonnés sur Instagram, et le décrit comme enseignant, formateur et conférencier motivateur — mais son texte mentionne un « diplôme d'études supérieures en psychologie appliquée » alors que la biographie de sa propre chaîne parle d'une maîtrise."
  ur: "فیڈ اسپاٹ کی اسلامی یوٹیوب چینلز کی ڈائرکٹری؛ محمد علی ⁦(یوتھ کلب)⁩ کے لیے اس کا داخلہ تقریباً 1.1 ملین سبسکرائبرز اور تقریباً 930,000 انسٹاگرام فالوورز دیتا ہے، اور اسے ایک استاد، ٹرینر اور موٹیویشنل سپیکر کے طور پر بیان کرتا ہے - لیکن اس کا متن اس کی اہلیت کو 'پوسٹ گریجویٹ ڈپلومہ ان اپلائیڈ سائیکالوجی' کے طور پر بتاتا ہے جہاں اس کے اپنے چینل کی سوانح عمری میں کہا گیا ہے کہ ماسٹرز۔"
