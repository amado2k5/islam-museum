summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد ضياء الحق (بعنوان «ضياء الحق»)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 12 أغسطس 1924 في جالندر، وخدمته في الحرب العالمية الثانية، ودوره في أيلول الأسود في الأردن، وتعيينه قائدا للجيش سنة 1976، وانقلاب 5 يوليو 1977 وإعدام بوتو، ورئاسته (1978–1988)، وبرنامجه للأسلمة، ودوره في الحرب السوفيتية الأفغانية، ووفاته في تحطم طائرة قرب بهاولبور في 17 أغسطس 1988 ودفنه في مسجد فيصل بإسلام آباد."
  en: "English Wikipedia article on Muhammad Zia-ul-Haq (under the title 'Zia-ul-Haq'); used for entity facts only. It recounts his birth on 12 August 1924 at Jalandhar, his Second World War service, his role in Black September in Jordan, his appointment as army chief in 1976, the coup of 5 July 1977 and Bhutto's execution, his presidency (1978–1988), his Islamisation programme, his role in the Soviet–Afghan War, and his death in a plane crash near Bahawalpur on 17 August 1988 with burial at the Faisal Mosque, Islamabad."
