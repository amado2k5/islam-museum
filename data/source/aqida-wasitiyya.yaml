summary:
  ar: "نص العقيدة الواسطية لتقي الدين ابن تيمية في طبعة المطبعة السلفية بالقاهرة، يسبقه تقديم للناشر ويليه محضر المناظرة التي جرت في دمشق سنة 705هـ."
  en: "The text of Ibn Taymiyya's al-Aqida al-Wasitiyya in the al-Matba'a al-Salafiyya edition (Cairo), preceded by a publisher's introduction and followed by the record of the debate held in Damascus in 705 AH."
  es: "El texto de al-Aqida al-Wasitiyya de Ibn Taymiyya en la edición de al-Matba'a al-Salafiyya (El Cairo), precedido por una introducción del editor y seguido por el registro del debate celebrado en Damasco en 705 AH."
  fr: "Le texte d'al-Aqida al-Wasitiyya d'Ibn Taymiyya dans l'édition al-Matba'a al-Salafiyya (Le Caire), précédé d'une introduction d'éditeur et suivi du compte rendu du débat tenu à Damas en 705 AH."
  ur: "المتبع السلفیہ ایڈیشن ⁦(قاہرہ)⁩ میں ابن تیمیہ کی العقیدہ الوصیتیہ کا متن، ایک ناشر کے تعارف سے پہلے اور اس کے بعد 705 ہجری میں دمشق میں ہونے والی بحث کا ریکارڈ ہے۔"
  tr: "Taqi al-Din İbn Teymiyye'nin El-Vasitiya İnancı'nın metni, Kahire'deki Selefiyya Yayınevi tarafından yayımlanır; ardından yayınevinin bir girişi ve ardından 705 Hicri yılında Şam'da yapılan tartışmanın tutanakları gelir."
  id: "Teks Kredo Al-Wasitiyyah oleh Taqi al-Din Ibn Taymiyyah diterbitkan oleh Salafiyya Press di Kairo, didahului oleh pengantar oleh penerbit, diikuti oleh risalah debat yang diadakan di Damaskus pada tahun 705 H."
