summary:
  ar: "مقالة ويكيبيديا العربية عن ناظم حارث ناظم الزهاوي، سياسي بريطاني من عائلة الزهاوي الكردية البغدادية المعروفة، وُلد في بغداد سنة 1967 وهاجرت أسرته إلى بريطانيا هربًا من نظام صدام حسين، وشغل منصب وزير المالية البريطاني لأشهر في 2022."
  en: "Arabic Wikipedia article on Nadhim Hareth Nadhim al-Zahawi, the British politician from the well-known Kurdish Baghdadi al-Zahawi family, born in Baghdad in 1967, whose family emigrated to Britain fleeing Saddam Hussein's regime, and who served as British Chancellor of the Exchequer for some months in 2022."
  es: "Artículo en árabe de la Wikipedia sobre Nadhim Hareth Nadhim al-Zahawi, el político británico perteneciente a la conocida familia kurda Baghdadi al-Zahawi, nacido en Bagdad en 1967, cuya familia emigró a Gran Bretaña huyendo del régimen de Saddam Hussein, y que se desempeñó como Ministro de Hacienda británico durante algunos meses en 2022."
  fr: "Article de Wikipédia en arabe sur Nadhim Hareth Nadhim al-Zahawi, homme politique britannique issu de la célèbre famille kurde Baghdadi al-Zahawi, né à Bagdad en 1967, dont la famille a émigré en Grande-Bretagne fuyant le régime de Saddam Hussein, et qui a occupé le poste de chancelier de l'Échiquier britannique pendant quelques mois en 2022."
  ur: "1967 میں بغداد میں پیدا ہونے والے معروف کرد بغدادی الزہاوی خاندان سے تعلق رکھنے والے برطانوی سیاست دان ندیم حریت ندیم الزہاوی پر عربی ویکیپیڈیا کا مضمون، جس کا خاندان صدام حسین کی حکومت سے فرار ہو کر برطانیہ ہجرت کر گیا، اور جنہوں نے 20202 میں سابق برطانوی چانسلر کے طور پر خدمات انجام دیں۔"
  tr: "Bağdatlı tanınmış Kürt el-Zahavi ailesinden İngiliz siyasetçi Nazem Harith Nazem el-Zahawi, 1967'de Bağdat'ta doğmuş Arapça Vikipedi makalesi. Ailesi, Saddam Hüseyin rejiminden kaçmak için Britanya'ya göç etti ve 2022'de birkaç ay boyunca İngiltere Maliye Bakanı olarak görev yaptı."
  id: "Artikel Wikipedia bahasa Arab tentang Nazem Harith Nazem al-Zahawi, seorang politikus Inggris dari keluarga Kurdi al-Zahawi yang terkenal dari Baghdad, lahir di Baghdad pada tahun 1967. Keluarganya bermigrasi ke Inggris untuk melarikan diri dari rezim Saddam Hussein, dan ia menjabat sebagai Kanselir Keuangan Inggris selama beberapa bulan pada tahun 2022."
