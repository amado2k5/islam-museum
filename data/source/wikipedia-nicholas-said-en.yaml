summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نيكولاس سعيد؛ تُستخدم لوقائع الكيان فقط. تروي ولادته باسم محمد علي بن سعيد في كوكاوا نحو سنة 1836، واستعباده وخدمته في روسيا، وتحوله من الإسلام إلى المسيحية في ريغا، وخدمته في جيش الاتحاد ووفاته سنة 1882."
  en: "English Wikipedia article on Nicholas Said; used for entity facts only. It recounts his birth as Mohammed Ali ben Said in Kukawa about 1836, his enslavement and service in Russia, his conversion from Islam to Christianity in Riga, his Union Army service and his death in 1882."
  es: "Artículo de la Wikipedia en inglés sobre Nicholas Said; utilizado únicamente para datos sobre la persona. Relata su nacimiento como Mohammed Ali ben Said en Kukawa alrededor de 1836, su esclavitud y servicio en Rusia, su conversión del islam al cristianismo en Riga, su servicio en el Ejército de la Unión y su muerte en 1882."
  fr: "Article de Wikipédia en anglais sur Nicolas Said; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance sous le nom de Mohammed Ali ben Said à Kukawa vers 1836, son esclavage et son service en Russie, sa conversion de l’islam au christianisme à Riga, son service dans l’armée de l’Union et sa mort en 1882."
  ur: "نکولس سیڈ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1836 کے قریب کوکاوا میں محمد علی بن سعید کے طور پر ان کی پیدائش، روس میں ان کی غلامی اور خدمات، ریگا میں ان کی اسلام سے عیسائیت میں تبدیلی، ان کی یونین آرمی سروس اور 1882 میں ان کی موت کا ذکر ہے۔"
  tr: "Nicholas Said hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Makale, yaklaşık 1836 yılında Kokawa'da Muhammed Ali bin Said olarak doğumunu, Rusya'da köleleştirilmesini ve hizmetini, Riga'da İslam'dan Hristiyanlığa geçişini, Birlik Ordusu'ndaki hizmetini ve 1882'deki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Nicholas Said hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya sebagai Muhammad Ali bin Said di Kokawa sekitar tahun 1836, perbudakan dan pengabdiannya di Rusia, konversinya dari Islam ke Kristen di Riga, pengabdiannya di Tentara Union, dan kematiannya pada tahun 1882."
