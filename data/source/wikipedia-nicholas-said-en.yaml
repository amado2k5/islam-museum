reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. The article gives Nicholas Said as born Mohammed Ali ben Sa'id about 1836 in Kukawa in the Bornu Empire, son of the general Barca Gana and a Mandara woman named Dalia; enslaved through the trans-Saharan trade, he learned Arabic, Turkish and Russian, served Prince Alexander Menshikov, travelled on five continents, performed a pilgrimage to Mecca in his Ottoman years, and emigrated voluntarily to the United States, serving as a sergeant in the 55th Massachusetts Infantry in 1863–1865. Drawing on his autobiography, the text states that in his memoirs he reflected on his conversion from Islam to Christianity in Riga. His later life is unclear in the article: an 1867 journalist's account has him married and settled at St. Stephens, Alabama, and one account has him dying in Brownsville, Tennessee, in 1882. The article has no religion infobox field; its categories are filings only."
