  en: "English Wikipedia article on Nicholas Said; used for entity facts only. It recounts his birth as Mohammed Ali ben Said in Kukawa about 1836, his enslavement and service in Russia, his conversion from Islam to Christianity in Riga, his Union Army service and his death in 1882."
