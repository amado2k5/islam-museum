summary:
  ar: "تدوينة لجوانا بينك، 14 أبريل 2023، عن ترجمات حسين ناهابو، طبيب الأسنان الموريشيوسي، لمعاني القرآن إلى الكريولية الموريشيوسية سنة 1983 والإنجليزية سنة 1987 والفرنسية."
  en: "A post by Johanna Pink, 14 April 2023, on the translations of the meanings of the Qur'an by the Mauritian dentist Houssein Nahaboo into Mauritian Creole (1983), English (1987) and French."
  ur: "یوہانا پنک کی تحریر، 14 اپریل 2023، ماریشس کے دندان ساز حسین ناہابو کے قرآن کے معانی کے تراجم پر: ماریشیائی کریول 1983، انگریزی 1987 اور فرانسیسی۔"
  es: "Publicación de Johanna Pink, 14 de abril de 2023, sobre las traducciones de los significados del Corán realizadas por el dentista mauriciano Houssein Nahaboo al criollo mauriciano (1983), al inglés (1987) y al francés."
  fr: "Un article de Johanna Pink, 14 avril 2023, sur les traductions des significations du Coran par le dentiste mauricien Houssein Nahaboo en créole mauricien (1983), en anglais (1987) et en français."
  tr: "Joanna Pink'in 14 Nisan 2023 tarihli yazısı, Mauritiuslu diş hekimi Hussein Nahabu'nun Kur'an anlamlarının 1983'te Mauritius Kreol'üne, 1987'de İngilizceye ve Fransızcaya çevirileriyle ilgili."
  id: "Sebuah tulisan oleh Joanna Pink, 14 April 2023, tentang terjemahan makna Al-Qur'an oleh Hussein Nahabu, dokter gigi Mauritius, ke dalam bahasa Kreol Mauritius tahun 1983, bahasa Inggris tahun 1987, dan Prancis."
