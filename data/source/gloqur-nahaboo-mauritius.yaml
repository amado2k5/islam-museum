reliability_note: "Signed research post by the project's principal investigator, read in full in Chrome on 7 November 2026. Used for Nahaboo (1920–2000; dentist of Curepipe; first Mauritian fellow in dentistry of the Royal College of Surgeons; a pious man engaged in da'wa, as the author describes him), his Arabic studies in Riyadh and his unpublished revision with Mahmud Baballi of a French translation for the Saudi Dar al-Ifta, the Creole translation (five years' work; published in instalments from 1983 by the Islamic Students Movement and the Islamic Women's Movement, Port Louis), the self-published English (1987) and French translations, their format, method and sources, and the author's argument on the 1989 King Fahd Complex edition of Hamidullah, kept as hers."
