summary:
  ar: "مقالة ويكيبيديا الفرنسية عن بابيس سيسيه؛ تُستخدم لوقائع الكيان فقط. تغطي ميلاده سنة 1985 ومسيرته مع فرايبورغ ونيوكاسل، وتذكر أنه أكد سنة 2012، بصفته مسلمًا، أنه لا يستطيع ارتداء قميص نيوكاسل الذي يحمل راعي القروض وونغا."
  en: "French Wikipedia article on Papiss Cissé; used for entity facts only. It covers his 1985 birth and his Freiburg and Newcastle career, and records that in 2012 he stated, as a Muslim, that he could not wear the Newcastle shirt carrying the Wonga loans sponsor."
  es: "Artículo de la Wikipedia en francés sobre Papiss Cissé; utilizado únicamente para obtener información sobre la persona. Abarca su nacimiento en 1985 y su trayectoria en el Friburgo y el Newcastle, y recoge que en 2012 declaró, por ser musulmán, que no podía llevar la camiseta del Newcastle con el patrocinador Wonga Loans."
  fr: "Article Wikipédia français sur Papiss Cissé; utilisé uniquement pour les informations le concernant. Il relate sa naissance en 1985 et sa carrière à Fribourg et Newcastle, et indique qu'en 2012, il a déclaré, en tant que musulman, qu'il ne pouvait pas porter le maillot de Newcastle floqué du sponsor Wonga Loans."
  ur: "Papiss Cissé پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی 1985 کی پیدائش اور اس کے فریبرگ اور نیو کیسل کیریئر کا احاطہ کیا گیا ہے، اور یہ ریکارڈ ہے کہ 2012 میں اس نے ایک مسلمان ہونے کے ناطے کہا تھا کہ وہ وونگا لون اسپانسر کی نیو کیسل شرٹ نہیں پہن سکتے۔"
  tr: "Papis Cissé hakkında Fransızca Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 1985 doğumunu ve Freiburg ile Newcastle kariyerini kapsar ve 2012'de Müslüman olarak, kiralık sponsoru Wonga'nın yer aldığı Newcastle formasını giyemeyeceğini doğruladığı belirtilir."
  id: "Artikel Wikipedia Prancis tentang Papis Cissé hanya digunakan untuk fakta entitas tersebut. Artikel tersebut mencakup kelahirannya pada tahun 1985 dan kariernya bersama Freiburg dan Newcastle, serta disebutkan bahwa pada tahun 2012, sebagai seorang Muslim, ia mengonfirmasi bahwa ia tidak bisa mengenakan jersey Newcastle yang menampilkan sponsor pinjaman Wonga."
