reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The article describes Syamsul Amri bin Ismail (born 3 August 1977 at Jempol, Negeri Sembilan), known as Syamsul Debat, as a Malaysian freelance preacher, host, motivational expert, politician and social-media personality, famous for religious television programmes mostly broadcast on TV AlHijrah; its infobox lists UMNO as his party. Its election table records the 2018 Sikamat state-seat result: Syamsul Debat (BN/UMNO) 6,419 votes, behind Aminuddin Harun (PH/PKR) 9,832. It further records that he announced the release of all his UMNO posts with immediate effect on 18 May 2018 while remaining a party member. The political material is carried on the museum record exactly as this attributed reporting: a past candidacy and past party posts, not a current office. Read via search extract on 15 November 2026."
