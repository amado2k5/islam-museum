summary:
  ar: "الجزء الثاني من طبعة دار الكتب العلمية ببيروت لشعب الإيمان للبيهقي، بتحقيق أبي هاجر محمد السعيد بن بسيوني زغلول، كما في صفحة العنوان المصورة؛ يبدأ بالشعبة الثانية عشرة من شعب الإيمان، باب في الرجاء من الله، ومنه الحديث رقم 1000 وما بعده. سنة الطبع غير مقروءة في المصورة."
  en: "Volume 2 of the Dar al-Kutub al-'Ilmiyya (Beirut) edition of al-Bayhaqi's Shu'ab al-Iman, edited by Abu Hajar Muhammad al-Sa'id ibn Basyuni Zaghlul, as read on the scanned title page; it opens with the twelfth branch of faith, the chapter on hope in God, from hadith no. 1000 onward. The year of printing is not legible on the scan."
  es: "Volumen 2 de la edición de Dar al-Kutub al-'Ilmiyya (Beirut) del Shu'ab al-Iman de al-Bayhaqi, editado por Abu Hajar Muhammad al-Sa'id ibn Basyuni Zaghlul, tal como se lee en la portada escaneada; comienza con la duodécima rama de la fe, el capítulo sobre la esperanza en Dios, desde el hadiz n.° 1000 en adelante. El año de impresión no es legible en el escaneo."
  fr: "Le volume 2 de l'édition Dar al-Kutub al-'Ilmiyya (Beyrouth) du Shu'ab al-Iman d'al-Bayhaqi, édité par Abu Hajar Muhammad al-Sa'id ibn Basyuni Zaghlul, tel qu'il apparaît sur la page de titre numérisée; il s'ouvre sur le douzième pilier de la foi, le chapitre sur l'espérance en Dieu, à partir du hadith n° 1000. L'année d'impression est illisible sur le scan."
  ur: "بیہقی کے شعب الایمان کے دار الکتب العلمیہ ⁦(بیروت)⁩ ایڈیشن کی جلد 2، ابو حجر محمد السعید ابن بسیونی زغلول کی تدوین، جیسا کہ اسکین شدہ ٹائٹل پیج پر پڑھا گیا ہے۔ اس کا آغاز ایمان کی بارہویں شاخ سے ہوتا ہے، خدا پر امید کا باب، حدیث نمبر۔ 1000 آگے۔ اسکین پر پرنٹنگ کا سال واضح نہیں ہے۔"
  tr: "Beyrut'ta Shu'ab al-İman için yazılmış Dar al-Kutub al-Ilmiyya'nın ikinci bölümü, Ebu Hajar Muhammed el-Seyid bin Beyyuni Zaghloul tarafından düzenlenmiştir, resimli başlık sayfasında gösterilmiştir; Şuab el-İman'ın on ikinci bölümüyle, Allah'tan umut üzerine bir bölümle başlar ve 1000 sayısı ve sonrasını içeren hadisler dahildir. Yayın yılı: resimli baskıda okunamaz."
  id: "Bagian kedua edisi Dar al-Kutub al-Ilmiyya di Beirut untuk Shu'ab al-Iman oleh al-Bayhaqi, disunting oleh Abu Hajar Muhammad al-Sa'id ibn Basyuni Zaghloul, seperti yang ditunjukkan pada halaman judul bergambar; dimulai dengan bagian kedua belas Shu'ab al-Iman, sebuah bab tentang harapan dari Allah, termasuk hadis nomor 1000 dan setelahnya. Tahun penerbitan: tidak dapat dibaca dalam edisi bergambar."
