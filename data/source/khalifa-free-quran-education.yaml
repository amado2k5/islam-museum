summary:
  ar: "مقالة محكّمة في مجلة «خليفة: مجلة التربية الإسلامية» (2019) تحلّل محتوى قناة «تعليم القرآن مجانًا» التعليمي المتحرك، وتذكر أن المشروع من إنتاج استوديو دار الأرقم الإندونيسي وبمبادرة من الشاب الباكستاني ماز أسلم والإندونيسي عرفيان أصافت."
  en: "A peer-reviewed article in Khalifa: Journal of Islamic Education (2019) analysing the animated content of the Free Quran Education channel; it records that the project is produced by Indonesia's Darul Arqam Studio and was initiated by the Pakistani youth Maaz Aslam and the Indonesian Erfian Asafat."
title: "Youtube Free Quran Education As a Source of Islamic Education Learning Materials and Media"
author: [{ family: "Ashidiqi", given: "Muna Nur Azizah" }, { family: "Rohmatiah", given: "Anis" }, { family: "Rahmah", given: "Febria Afia" }]
issued: { "date-parts": [[2019, 9]] }
publisher: "Khalifa: Journal of Islamic Education, 3(2), September 2019"
URL: "https://www.academia.edu/67154100/Youtube_Free_Quran_Education_As_a_Source_of_Islamic_Education_Learning_Materials_and_Media"
language: en
reliability_note: "Read in full on 26 October 2026 (Universitas Islam Negeri Syarif Hidayatullah, Jakarta; received 16 July 2019, approved 29 August 2019). It states: 'The YouTube Free Quran Education channel is an animated video project created by an animation studio from Indonesia named Darul Arqam Studio initiated by a Muslim youth named Maaz Aslam from Pakistan and Erfian Asafat from Indonesia', with more than 30 full-time illustrators plus volunteers, 1,681 videos and 48,404,475 views counted since 2014, translation volunteers from 12 countries, and funding about 99% by crowdfunding, all content free without advertisements. It is the only source found that names the channel's initiators; it gives no further biographical detail about either man and names no school for either."
