reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives her birth as 2 February 1968 at Bamako — against 25 February in the English and Arabic articles; Wikidata carries 12 and 25 February claims; the conflict is recorded in the person record, which follows 25 February. It confirms her Fulani origin; her mother the singer Aminata Diakité; her father's abandonment of the family; the age-five kindergarten final at the Omnisports stadium before 3,000 people; the Djoliba percussion tour at 16; Moussolou recorded in 1989 at 21, selling over 100,000 cassettes in Mali in a week (the English article gives more than 200,000 copies in all); the World Circuit signing through Ali Farka Touré; her songwriting as social criticism of women's status, and her stands against polygamy, excision and child marriage; her hotel (37 rooms here, 30 in the English article), agriculture and a taxi company; the UNESCO prize of 2001 and FAO ambassadorship of 2003; and 'Diaraby Nene' sampled by Beyoncé in 'Mood 4 Eva' (2019). The article states no religion for her."
