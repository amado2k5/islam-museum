summary:
  ar: "مقالة ويكيبيديا العربية عن محمد نجيب الله؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها مولده في 6 أغسطس 1947 في كابل ووفاته في 28 سبتمبر 1996 في كابل وخانة الدين فيه فارغة، ويذكر نصها أن قريته الأبوية بين سيد كرم وغرديز في بكتيا، وتصنّفه فئاتها في «اشتراكيون مسلمون»، وتقابل ميلاده بـ1366 هـ ووفاته بـ1417 هـ."
  en: "Arabic Wikipedia article on Mohammad Najibullah; used for entity facts only. Its infobox gives his birth on 6 August 1947 at Kabul and his death on 28 September 1996 at Kabul, with the religion field blank; its text places his family's ancestral village between Said Karam and Gardez in Paktia. Its categories file him under 'Muslim socialists' (a filing) and pair his birth with 1366 AH and his death with 1417 AH."
