summary:
  ar: "مقالة ويكيبيديا الأردية عن أكبر هاشمي رفسنجاني؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها مناصبه وسلفه في الرئاسة وفي رئاسة مجلس تشخيص مصلحة النظام علي خامنئي، وتروي بإيجاز مسيرته حتى وفاته سنة 2017. لا تنصّ على أي انتماء ديني شخصي له."
  en: "Urdu Wikipedia article on Akbar Hashemi Rafsanjani; used for entity facts only. Its officeholder infobox gives his posts and names Ali Khamenei as his predecessor both as president and as chairman of the Expediency Discernment Council; it briefly recounts his career until his death in 2017. It makes no statement of his personal religious affiliation."
  es: "Artículo de Wikipedia en urdu sobre Akbar Hashemi Rafsanjani; utilizado únicamente para obtener información sobre la entidad. Su ficha informativa sobre el cargo indica sus puestos y menciona a Ali Khamenei como su predecesor tanto en la presidencia como en la dirección del Consejo de Discernimiento de la Conveniencia; relata brevemente su trayectoria hasta su fallecimiento en 2017. No se menciona su afiliación religiosa personal."
  fr: "L'article de Wikipédia en ourdou consacré à Akbar Hashemi Rafsanjani ne fournit que des informations sur l'entité. Son infobox présente ses fonctions et mentionne Ali Khamenei comme son prédécesseur à la présidence et à la tête du Conseil de discernement de l'intérêt supérieur du régime. Il retrace brièvement sa carrière jusqu'à son décès en 2017. Aucune mention n'est faite de son appartenance religieuse."
  ur: "اکبر ہاشمی رفسنجانی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا آفس ہولڈر انفارمیشن باکس علی خامنہ ای کو بطور صدر اور ایکسپیڈینسی ڈسرنمنٹ کونسل کے چیئرمین کے طور پر اپنے عہدے اور نام دیتا ہے۔ یہ مختصر طور پر 2017 میں ان کی موت تک ان کے کیریئر کا ذکر کرتا ہے۔ اس میں ان کی ذاتی مذہبی وابستگی کا کوئی بیان نہیں دیا گیا ہے۔"
  tr: "Akbar Haşimi Rafsancani hakkında Urduca Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. Bilgi kutusu, Ali Hamaney'in Çıkar Ayırt Edici Konseyi başkanlığı ve başkanlığındaki pozisyonlarını ve selefi hakkında bilgi veriyor, 2017'deki ölümüne kadar olan kariyerini kısaca anlatıyor. Kişisel dini aidiyeti belirtilmemektedir."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Akbar Hashemi Rafsanjani; digunakan hanya untuk fakta entitas. Infobox tersebut mencantumkan posisi dan pendahulunya dalam kepresidenan serta dalam kepresidenan Dewan Discernment Expediency Ali Khamenei, secara singkat menceritakan kariernya hingga kematiannya pada 2017. Tidak disebutkan afiliasi agama pribadi apa pun darinya."
