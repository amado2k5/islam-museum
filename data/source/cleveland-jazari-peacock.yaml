summary:
  ar: "فهرسة ورقة سورية من نسخة 1315م لكتاب الجزري، وصورتا الوجه والظهر؛ يشرح سجل الظهر عوامة تخرج شخصيتين بالصابون والمنديل، مع تنبيه المتحف إلى عدم اليقين في بناء الآلة فعلاً."
  en: "Catalogue and recto/verso images of a Syrian leaf from a 1315 copy of al-Jazari's book. The verso entry explains a float releasing soap- and towel-bearing figures; the museum explicitly says actual construction is uncertain."
  ur: "جزری کی کتاب کی 1315ء کی شامی نقل کے ورق کی فہرست اور دونوں رخ؛ پشت کا اندراج صابن اور تولیہ لانے والی شکلوں کا تیراک بتاتا ہے، مگر مشین کی حقیقی تعمیر غیر یقینی ہے۔"
  es: "Catálogo e imágenes del anverso y reverso de una hoja siria de un ejemplar de 1315 del libro de al-Jazari. La entrada del reverso explica que una balsa libera figuras que portan jabón y toallas; el museo indica explícitamente que la construcción real es incierta."
  fr: "Catalogue et images recto/verso d'une feuille syrienne extraite d'un exemplaire de 1315 du livre d'al-Jazari. La notice au verso décrit un flotteur libérant des personnages portant du savon et une serviette; le musée précise que la construction exacte reste incertaine."
  tr: "Al-Jazari'nin kitabının 1315 AD baskısından bir Suriye folyosu ve yüz ile sırt görüntüleriyle birlikte kataloglamak; arka kayıtta iki figürü sabun ve mendil taşıyan bir geçit töreni aracı açıklanırken, müze aletin gerçek yapımıyla ilgili belirsizlik konusunda uyarılmaktadır."
  id: "Mengkatalogkan folio Suriah dari edisi 1315 M dari buku Al-Jazari, beserta gambar wajah dan punggung; catatan belakang menjelaskan sebuah kendaraan hias yang membawa dua figur dengan sabun dan sapu tangan, sementara museum diperingatkan tentang ketidakpastian tentang pembuatan alat musik tersebut."
