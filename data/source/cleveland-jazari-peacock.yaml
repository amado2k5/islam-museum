reliability_note: "Read combined, recto and verso catalogue pages and public API accession records on 2026-11-06. Recto describes the 1315 Syrian copy and says construction is not certain. Verso explains filling the peacock, water entering the lower vessel, float opening first soap door and then towel door, and draining dirty water by spigot. Inspected both sides in the combined print image and the separate recto. API gives CC0, J. H. Wade Fund credit, Naskh on verso and 31.3 × 21.5 cm paper dimensions. Its bibliography was read as leads, not independently read publications. Museum dates book to 1206; TDV gives 1205. No construction date or modern dispenser priority inferred."
