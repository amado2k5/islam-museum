summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خالد حسيني ⁦(وُلد في ٤ آذار ١٩٦٥ في كابل)⁩، الروائي الأفغاني الأمريكي والطبيب السابق، مؤلف «عداء الطائرة الورقية» و«ألف شمس مشرقة» و«ورددت الجبال الصدى»، ومبعوث المفوضية السامية للاجئين؛ تذكر طفولته في كابل ولجوء أسرته إلى الولايات المتحدة ومسيرته الطبية ووصفه نفسه بأنه مسلم علماني، دون أن تسمي له مذهبًا."
  en: "English Wikipedia article on Khaled Hosseini (born 4 March 1965 in Kabul), Afghan-American novelist and former physician, author of The Kite Runner, A Thousand Splendid Suns and And the Mountains Echoed, and a UNHCR goodwill envoy; it records his Kabul childhood, his family's asylum in the United States, his medical career and his own description of himself as a secular Muslim, without naming any school for him."
