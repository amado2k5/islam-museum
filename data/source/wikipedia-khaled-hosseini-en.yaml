summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خالد حسيني ⁦(وُلد في ٤ آذار ١٩٦٥ في كابل)⁩، الروائي الأفغاني الأمريكي والطبيب السابق، مؤلف «عداء الطائرة الورقية» و«ألف شمس مشرقة» و«ورددت الجبال الصدى»، ومبعوث المفوضية السامية للاجئين؛ تذكر طفولته في كابل ولجوء أسرته إلى الولايات المتحدة ومسيرته الطبية ووصفه نفسه بأنه مسلم علماني، دون أن تسمي له مذهبًا."
  en: "English Wikipedia article on Khaled Hosseini (born 4 March 1965 in Kabul), Afghan-American novelist and former physician, author of The Kite Runner, A Thousand Splendid Suns and And the Mountains Echoed, and a UNHCR goodwill envoy; it records his Kabul childhood, his family's asylum in the United States, his medical career and his own description of himself as a secular Muslim, without naming any school for him."
  es: "Artículo de la Wikipedia en inglés sobre Khaled Hosseini (nacido el 4 de marzo de 1965 en Kabul), novelista afgano-estadounidense y ex médico, autor de *Cometas en el cielo*, *Mil soles espléndidos* y *Y las montañas resonaron*, y enviado de buena voluntad del ACNUR; en él se narra su infancia en Kabul, el asilo de su familia en Estados Unidos, su carrera médica y su propia descripción de sí mismo como musulmán secular, sin mencionar ninguna escuela a la que pertenezca."
  fr: "L'article de Wikipédia en anglais sur Khaled Hosseini (né le 4 mars 1965 à Kaboul), romancier afghano-américain et ancien médecin, auteur de « Les Cerfs-volants de Kaboul », « Mille soleils splendides » et « Et les montagnes ont répondu », et envoyé de bonne volonté du HCR; il relate son enfance à Kaboul, l'asile de sa famille aux États-Unis, sa carrière médicale et sa propre description de lui-même comme musulman laïc, sans nommer d'école en son honneur."
  ur: "خالد حسینی ⁦(پیدائش 4 مارچ 1965 کابل میں)⁩ پر انگریزی ویکیپیڈیا کا مضمون، افغان نژاد امریکی ناول نگار اور سابق معالج، دی کائٹ رنر کے مصنف، ایک ہزار شاندار سنز اینڈ دی ماؤنٹینز ایکویڈ، اور یو این ایچ سی آر کے خیر سگالی ایلچی؛ اس میں اس کا کابل بچپن، اس کے خاندان کی ریاستہائے متحدہ میں پناہ، اس کا طبی کیریئر اور خود کو ایک سیکولر مسلمان کے طور پر بیان کیے بغیر، اس کے لیے کسی اسکول کا نام لیے بغیر ریکارڈ کیا گیا ہے۔"
  tr: "Afgan-Amerikalı romancı ve eski doktor, \"Uçurtma Kaçıcısı,\" \"Bin Parlayan Güneş\" ve \"Dağlar Yankılandı\" kitaplarının yazarı ve UNHCR elçisi Khalid Hosseini (4 Mart 1965, Kabil doğumlu) hakkında İngilizce Wikipedia makalesi; çocukluğunu, ailesinin Amerika Birleşik Devletleri'ndeki sığınağını, tıbbi kariyerini anımsatıyor ve kendisini laik bir Müslüman olarak tanımlıyor, ancak hiçbir mezhep adını vermemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Khalid Hosseini (lahir 4 Maret 1965, di Kabul), novelis dan mantan dokter Afghanistan-Amerika, penulis \"Kite Runner,\" \"A Thousand Shining Suns,\" dan \"The Mountains Echoed,\" serta utusan UNHCR; artikel ini mengenang masa kecilnya di Kabul, tempat perlindungan keluarganya di Amerika Serikat, karier medisnya, dan menggambarkan dirinya sebagai Muslim sekuler tanpa menyebut sekte apapun untuknya."
