summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد عالم خان، آخر أمراء بخارى؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 3 يناير 1880 ووفاته في 28 أبريل 1944، ولا تسمّي له مذهبًا."
  en: "Urdu Wikipedia article on Muhammad Alim Khan, last Emir of Bukhara; used for entity facts only. It gives his birth on 3 January 1880 and his death on 28 April 1944, and names no school for him."
  es: "Artículo de Wikipedia en urdu sobre Muhammad Alim Khan, último emir de Bujará; utilizado únicamente para datos sobre la persona. Indica que nació el 3 de enero de 1880 y falleció el 28 de abril de 1944, y no menciona ninguna escuela en su honor."
  fr: "Article de Wikipédia en ourdou sur Muhammad Alim Khan, dernier émir de Boukhara; utilisé uniquement à titre informatif. Il indique sa naissance le 3 janvier 1880 et sa mort le 28 avril 1944, et ne mentionne aucune école en son honneur."
  ur: "بخارا کے آخری امیر محمد علیم خان پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 3 جنوری 1880 کو اس کی پیدائش اور 28 اپریل 1944 کو اس کی موت کا اعلان کرتا ہے، اور اس کے لیے کسی اسکول کا نام نہیں رکھتا۔"
  tr: "Buhara'nın son prensi Muhammed Alam Han hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunun 3 Ocak 1880'den ve 28 Nisan 1944'teki ölümünden bahseder, mezhebi ise isimlendirilmez."
  id: "Artikel Wikipedia berbahasa Urdu tentang Muhammad Alam Khan, pangeran terakhir Bukhara; hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada 3 Januari 1880, dan kematiannya pada 28 April 1944, serta tidak menyebutkan sektenya."
