reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth at Bosanski Šamac on 8 August 1925, the move to Sarajevo in 1928, the Young Muslims organisation, his imprisonments of 1946 and 1983-1988, the Islamic Declaration of 1970 and the controversy over it (presented attributed, as the article does), the founding of the SDA in 1990, the presidency through the Bosnian War, the Washington and Dayton agreements, his resignation in 2000, his death at Sarajevo on 19 October 2003, and his writings. The article describes him as an Islamic philosopher and author but names no madhhab for him. His wartime record is contested in the article itself (including the ICTY investigation that ended with his death); only attributed statements are used. Read in full on 24 October 2026."
