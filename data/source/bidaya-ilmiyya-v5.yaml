summary:
  ar: "المجلد الخامس من «البداية والنهاية» لأبي الفداء ابن كثير الدمشقي ⁦(ت 774هـ)⁩ في طبعة دار الكتب العلمية ببيروت ⁦(منشورات محمد علي بيضون)⁩، وثّقه وقابل مخطوطاته الشيخ عادل أحمد عبد الموجود والشيخ علي محمد معوض، ووضع حواشيه فريق منهم الدكتور أحمد أبو ملحم والدكتور علي نجيب عطوي؛ ويضم الجزء التاسع ⁦(سنوات 74–125هـ)⁩ والجزء العاشر."
  en: "Vol. 5 of Abu al-Fida Ibn Kathir al-Dimashqi's (d. 774 AH) al-Bidaya wa-l-nihaya in the Dar al-Kutub al-Ilmiyya edition, Beirut (Muhammad Ali Baydun publications), checked against the manuscripts by Adil Ahmad Abd al-Mawjud and Ali Muhammad Mu'awwad, with notes by a team including Ahmad Abu Milhim and Ali Najib Atwi. It holds part 9 (the years 74–125 AH) and part 10."
