label:
  ar: "ابن كثير، البداية والنهاية — المجلد الخامس ⁦(الجزءان 9–10)⁩، دار الكتب العلمية، بيروت"
  en: "Ibn Kathir, al-Bidaya wa-l-nihaya — vol. 5 (parts 9–10), Dar al-Kutub al-Ilmiyya, Beirut"
summary:
  ar: "المجلد الخامس من «البداية والنهاية» لأبي الفداء ابن كثير الدمشقي ⁦(ت 774هـ)⁩ في طبعة دار الكتب العلمية ببيروت ⁦(منشورات محمد علي بيضون)⁩، وثّقه وقابل مخطوطاته الشيخ عادل أحمد عبد الموجود والشيخ علي محمد معوض، ووضع حواشيه فريق منهم الدكتور أحمد أبو ملحم والدكتور علي نجيب عطوي؛ ويضم الجزء التاسع ⁦(سنوات 74–125هـ)⁩ والجزء العاشر."
  en: "Vol. 5 of Abu al-Fida Ibn Kathir al-Dimashqi's (d. 774 AH) al-Bidaya wa-l-nihaya in the Dar al-Kutub al-Ilmiyya edition, Beirut (Muhammad Ali Baydun publications), checked against the manuscripts by Adil Ahmad Abd al-Mawjud and Ali Muhammad Mu'awwad, with notes by a team including Ahmad Abu Milhim and Ali Najib Atwi. It holds part 9 (the years 74–125 AH) and part 10."
  es: "vol. 5 de al-Bidaya wa-l-nihaya de Abu al-Fida Ibn Kathir al-Dimashqi (m. 774 AH) en la edición de Dar al-Kutub al-Ilmiyya, Beirut (publicaciones de Muhammad Ali Baydun), cotejado con los manuscritos de Adil Ahmad Abd al-Mawjud y Ali Muhammad Mu'awwad, con notas de un equipo que incluye a Ahmad Abu Milhim y Ali Najib Atwi. Contiene la parte 9 (los años 74-125 AH) y la parte 10."
  fr: "Vol. 5 de l'ouvrage d'Abu al-Fida Ibn Kathir al-Dimashqi (mort en 774 AH) al-Bidaya wa-l-nihaya dans l'édition Dar al-Kutub al-Ilmiyya, Beyrouth (publications de Muhammad Ali Baydun), vérifié par rapport aux manuscrits d'Adil Ahmad Abd al-Mawjud et Ali Muhammad Mu'awwad, avec des notes d'une équipe comprenant Ahmad Abu Milhim et Ali Najib Atwi. Il contient la partie 9 (les années 74-125 AH) et la partie 10."
  ur: "والیوم دار الکتب العلمیہ ایڈیشن، بیروت ⁦(محمد علی بیدون اشاعت)⁩ میں ابو الفدا ابن کثیر الدمشقی ⁦(متوفی 774ھ)⁩ کی البدایہ والنہایہ میں سے 5، عادل احمد کے مخطوطات کے خلاف جانچ پڑتال کی گئی، جس میں ابو محمد علی محمد معوذ کی ٹیم شامل نہیں تھی۔ ملہم اور علی نجیب عطوی اس کا حصہ 9 ⁦(سال 74-125 ہجری)⁩ اور حصہ 10 ہے۔"
  tr: "Abu al-Fida Ibn Kathir al-Dimashqi (ö. 774 Hicri yılı) tarafından yazılmış \"El-Bidaya ve el-Nihaya\"nın beşinci cildi, Beyrut'ta Dar al-Kutub el-İlmiyye tarafından (Muhammad Ali Baydoun tarafından yayımlanmıştır) yayımlanmıştır. Şeyh Adel Ahmed Abd Al-Mawjood ve Şeyh Ali Muhammed Muawwad tarafından doğrulanmış ve incelenmiştir. Açıklamaları Dr. Ahmed Abu Malhem ve Dr. Ali Najib Atwi'nin de dahil olduğu bir ekip tarafından düzenlenmiştir; dokuzuncu cilt (74–125 Hicri yılları) ve onuncu kısmı içerir."
  id: "Jilid kelima \"Al-Bidaya wa al-Nihaya\" oleh Abu al-Fida Ibn Kathir al-Dimashqi (wafat 774 H) diterbitkan oleh Dar al-Kutub al-Ilmiyya di Beirut (diterbitkan oleh Muhammad Ali Baydoun). Volume ini telah diautentikasi dan ditinjau oleh Sheikh Adel Ahmad Abd al-Mawjood dan Sheikh Ali Muhammad Muawwad. Anotasinya diedit oleh tim yang terdiri dari Dr. Ahmad Abu Malhem dan Dr. Ali Najib Atwi; memuat jilid kesembilan (tahun 74–125 H) dan bagian kesepuluh."
