summary:
  ar: "شرح علي القاري على مشكاة المصابيح؛ استند إليه المباركفوري في باب الكهانة. ويذكر ثبت المراجع نسخة ج2 باسم المباركفوري نفسه ⁦(لكنو 1378هـ)⁩."
  en: "al-Qari's commentary on Mishkat al-Masabih; cited by Raheeq on soothsaying. The printed bibliography lists a vol. 2 under al-Mubarakfuri's name (Lucknow 1378 AH)."
  es: "Comentario de al-Qari sobre Mishkat al-Masabih; citado por Raheeq en su obra sobre adivinación. La bibliografía impresa incluye un volumen 2 a nombre de al-Mubarakfuri (Lucknow, 1378 AH)."
  fr: "Commentaire d'al-Qari sur le Mishkat al-Masabih; cité par Raheeq à propos de la divination. La bibliographie imprimée mentionne un volume 2 sous le nom d'al-Mubarakfuri (Lucknow, 1378 AH)."
  ur: "القاری کی تفسیر مشکوٰۃ المصابیح؛ رحیق نے ستھ سینگ پر حوالہ دیا۔ مطبوعہ کتابیات میں ایک جلد کی فہرست ہے۔ 2 المبارکفوری کے نام سے ⁦(لکھنؤ 1378ھ)⁩۔"
  tr: "Ali el-Qari'nin Mişket el-Mesbih üzerine yaptığı tefsiri; el-Mübarekfuri ise fal bölümünde buna dayanmıştır. Kaynaklar, özgün kaynakların 2. kopyasında, el-Mübarekfuri'nin kendisinin adı altında geçer (Laknu, 1378 H) vardır."
  id: "Komentar Ali al-Qari atas Mishkat al-Masabih; al-Mubarakfuri mengandalkannya dalam bab ramalan. Sumber-sumber menyebutkan referensi otentik, salinan 2, dengan nama al-Mubarakfuri sendiri (Laknu, 1378 H)."
