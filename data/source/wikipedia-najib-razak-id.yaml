  ar: "مقالة ويكيبيديا الإندونيسية عن نجيب رزاق ⁦(وُلد 1953)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 23 يوليو 1953 ورئاسته لوزراء ماليزيا (2009–2018) وإدانته في قضيتي صندوق التنمية الماليزي (1MDB) وشركة SRC الدولية."
  en: "Indonesian Wikipedia article on Najib Razak (born 1953); used for entity facts only. It gives his birth on 23 July 1953, his Malaysian premiership (2009–2018), and his convictions in the 1MDB and SRC International cases."
  es: "Artículo de la Wikipedia en indonesio sobre Najib Razak (nacido en 1953); utilizado únicamente para datos sobre la entidad. Indica su fecha de nacimiento, el 23 de julio de 1953, su mandato como primer ministro de Malasia (2009-2018) y sus condenas en los casos de 1MDB y SRC International."
  fr: "Article de Wikipédia indonésien sur Najib Razak (né en 1953); utilisé uniquement à des fins d’information sur l’entité. Il indique sa date de naissance, le 23 juillet 1953, son mandat de Premier ministre de Malaisie (2009-2018) et ses condamnations dans les affaires 1MDB et SRC International."
  ur: "نجیب رزاق ⁦(پیدائش 1953)⁩ پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 23 جولائی 1953 کو ان کی پیدائش، ان کی ملائیشیا کی پریمیئر شپ (2009–2018)، اور 1MDB اور SRC انٹرنیشنل کیسز میں ان کی سزاؤں کو دیتا ہے۔"
  tr: "Najib Razak (d. 1953) hakkında Endonezya Vikipedi makalesi; yalnızca varlık gerçekleri için kullanılmıştır. 23 Temmuz 1953 döneminde, Malezya bakanlarının başkanlığı (2009–2018) ve Malezya Kalkınma Fonu (1MDB) ile SRC International davalarındaki mahkumiyetinde anılmaktadır."
  id: "Artikel Wikipedia Indonesia tentang Najib Razak (lahir 1953); hanya digunakan untuk fakta entitas. Ia disebutkan pada era 23 Juli 1953, masa kepresidenannya sebagai menteri Malaysia (2009–2018), dan vonisnya dalam kasus Dana Pembangunan Malaysia (1MDB) dan SRC International."
