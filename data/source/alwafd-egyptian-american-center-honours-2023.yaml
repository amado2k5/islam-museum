label: { en: "Al-Wafd — Egyptian-American Cultural Center in New York honours Nelly Karim, Hany Ramzy and others (17 August 2023)", ar: "بوابة الوفد — المركز الثقافي المصري الأمريكي بنيويورك يكرم نيللي كريم وهاني رمزي" }
summary:
  ar: "تقرير الوفد عن تكريم المركز نيللي كريم وهاني رمزي والكاتب خالد منتصر وإيناس عبد الدايم في حفل راعي مصر الخيري."
  en: "Al-Wafd's report that the centre honoured Nelly Karim, Hany Ramzy, the writer Khaled Montaser and Inas Abdel Dayem at the Raei Misr charity gala."
  es: "Según informa Al-Wafd, el centro homenajeó a Nelly Karim, Hany Ramzy, al escritor Khaled Montaser e Inas Abdel Dayem en la gala benéfica de Raei Misr."
  fr: "Selon le reportage d'Al-Wafd, le centre a honoré Nelly Karim, Hany Ramzy, l'écrivain Khaled Montaser et Inas Abdel Dayem lors du gala de charité Raei Misr."
  ur: "الوفد کی رپورٹ کے مطابق مرکز نے رائی مصر چیریٹی گالا میں نیلی کریم، ہانی رمزی، مصنف خالد مونتاسر اور انس عبدل دائم کو اعزاز سے نوازا۔"
  tr: "Merkezin onurlandırılması üzerine heyet raporu Nelly Karim, Hani Ramzy, yazar Khaled Montaser ve Inas Abdel Dayem Mısır Hayır Kurumu Sponsoru töreninde."
  id: "Delegasi melaporkan penghormatan kepada pusat ini Nelly Karim, Hani Ramzy, penulis Khaled Montaser, dan Inas Abdel Dayem pada upacara Sponsor Amal Mesir."
