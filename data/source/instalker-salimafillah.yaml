reliability_note: "A mirror crawl of his public X profile — a grade below a direct platform read, and recorded with that caveat wherever the figure is used. The wave-200 harvest read the Instalker mirror on 15 November 2026 and recorded 582,000 followers for @salimafillah, the mirror crawled about five days earlier (about 10 November 2026). A direct re-read in this build session was refused by the site (HTTP 403), so the harvest's dated mirror read stands as the observation of record. No YouTube figure is recorded for him anywhere in his record: his video dawah runs through Pro-U Media channels, not an own-name channel."
