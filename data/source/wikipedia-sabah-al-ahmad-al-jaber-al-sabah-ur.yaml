summary:
  ar: "مقالة ويكيبيديا الأردية عن صباح الأحمد الجابر الصباح، وهي مختصر قصير جدًا؛ تُستخدم لوقائع الكيان فقط. تذكر أنه كان أمير الكويت من 2006 إلى 2020، ولا تتضمن أي بيان عن دينه أو مدرسته."
  en: "Urdu Wikipedia article on Sabah Al-Ahmad Al-Jaber Al-Sabah, a very short stub; used for entity facts only. It records that he was Emir of Kuwait from 2006 to 2020 and contains no statement of his religion or school."
  es: "Artículo de Wikipedia en urdu sobre Sabah Al-Ahmad Al-Jaber Al-Sabah, muy breve; utilizado únicamente para datos sobre la persona. Indica que fue emir de Kuwait de 2006 a 2020 y no contiene ninguna mención a su religión o escuela."
  fr: "L'article de Wikipédia en ourdou sur Sabah Al-Ahmad Al-Jaber Al-Sabah est une ébauche très brève, servant uniquement à fournir des informations factuelles. Il indique qu'il a été émir du Koweït de 2006 à 2020, sans mentionner sa religion ni son école."
  ur: "صباح الاحمد الجابر الصباح پر اردو ویکیپیڈیا کا مضمون، ایک بہت ہی مختصر اسٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں درج ہے کہ وہ 2006 سے 2020 تک کویت کے امیر تھے اور اس میں ان کے مذہب یا مکتب کا کوئی بیان نہیں ہے۔"
  tr: "Sabah Al-Ahmad Al-Jaber Al-Sabah hakkında Urduca Wikipedia makalesi, çok kısa bir özet olup, yalnızca varlığın gerçekleri için kullanılmıştır. 2006'dan 2020'ye kadar Kuveyt Emiri olduğunu belirtmekte ve dini veya okulu hakkında herhangi bir açıklama içermemektedir."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Sabah Al-Ahmad Al-Jaber Al-Sabah, yang merupakan ringkasan singkat, hanya digunakan untuk fakta entitas tersebut. Disebutkan bahwa ia adalah Emir Kuwait dari tahun 2006 hingga 2020, dan tidak memuat pernyataan tentang agama atau sekolahnya."
