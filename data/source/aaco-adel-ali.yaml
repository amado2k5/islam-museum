  ar: "سيرة عادل العلي في موقع الاتحاد العربي للنقل الجوي: عضو مجلس الإدارة والرئيس التنفيذي لمجموعة العربية للطيران، أسس الشركة في تشرين الأول 2003 كأول شركة طيران منخفض التكلفة في الشرق الأوسط وشمال أفريقيا، بعد سنوات في الخليج للطيران والخطوط البريطانية، ونال جوائز الرئيس التنفيذي للعام مرات متتالية منذ 2007."
  en: "The Arab Air Carriers' Organization biography of Adel Al Ali: board member and Group Chief Executive Officer of Air Arabia, who set the airline up in October 2003 as the Middle East and North Africa's first low-cost carrier after years at Gulf Air and British Airways, and who has won Airline CEO of the Year awards repeatedly since 2007."
