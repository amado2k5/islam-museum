summary:
  ar: "سيرة عادل العلي في موقع الاتحاد العربي للنقل الجوي: عضو مجلس الإدارة والرئيس التنفيذي لمجموعة العربية للطيران، أسس الشركة في تشرين الأول 2003 كأول شركة طيران منخفض التكلفة في الشرق الأوسط وشمال أفريقيا، بعد سنوات في الخليج للطيران والخطوط البريطانية، ونال جوائز الرئيس التنفيذي للعام مرات متتالية منذ 2007."
  en: "The Arab Air Carriers' Organization biography of Adel Al Ali: board member and Group Chief Executive Officer of Air Arabia, who set the airline up in October 2003 as the Middle East and North Africa's first low-cost carrier after years at Gulf Air and British Airways, and who has won Airline CEO of the Year awards repeatedly since 2007."
  es: "Biografía de Adel Al Ali, publicada por la Organización de Transportistas Aéreos Árabes: miembro del consejo de administración y director ejecutivo del Grupo Air Arabia, quien fundó la aerolínea en octubre de 2003 como la primera compañía de bajo coste de Oriente Medio y el Norte de África tras años en Gulf Air y British Airways, y que ha ganado repetidamente el premio al Director Ejecutivo de Aerolínea del Año desde 2007."
  fr: "Biographie d'Adel Al Ali par l'Organisation des transporteurs aériens arabes: membre du conseil d'administration et directeur général du groupe Air Arabia, il a créé la compagnie aérienne en octobre 2003, première compagnie à bas prix du Moyen-Orient et d'Afrique du Nord, après des années passées chez Gulf Air et British Airways, et a remporté à plusieurs reprises le prix de PDG de compagnie aérienne de l'année depuis 2007."
  ur: "عرب ایئر کیریئرز آرگنائزیشن عادل العلی کی سوانح عمری: ایئر عربیہ کا بورڈ ممبر اور گروپ چیف ایگزیکٹو آفیسر، جس نے اکتوبر 2003 میں گلف ایئر اور برٹش ایئرویز میں سالوں کے بعد مشرق وسطیٰ اور شمالی افریقہ کے پہلے کم لاگت والے کیریئر کے طور پر ایئر لائن قائم کی، اور جس نے 2070 سے بار بار ایئر لائن کے سی ای او آف دی ایئر ایوارڈز جیتے ہیں۔"
  tr: "Adel Al Ali'nin Arap Hava Taşımacılığı Derneği web sitesindeki biyografisi: Air Arabia Group Yönetim Kurulu Üyesi ve CEO'su. Şirketi, Gulf Airways ve British Airways ile yıllarca çalıştıktan sonra Ekim 2003'te Orta Doğu ve Kuzey Afrika'nın ilk düşük maliyetli havayolu olarak kurdu ve 2007'den beri ardışık olarak Yılın CEO'su ödüllerini kazandı."
  id: "Biografi Adel Al Ali di situs web Arab Air Transport Association: Anggota Dewan dan CEO Air Arabia Group. Ia mendirikan perusahaan pada Oktober 2003 sebagai maskapai berbiaya rendah pertama di Timur Tengah dan Afrika Utara, setelah bertahun-tahun bersama Gulf Airways dan British Airways, serta telah memenangkan penghargaan CEO of the Year secara berturut-turut sejak 2007."
