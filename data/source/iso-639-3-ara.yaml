summary:
  ar: "صفحة «ISO 639-3: ara» لدى SIL Global. لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملف بحث قدمه المؤسس إلى المتحف ووافق على استعماله في 21 نوفمبر 2026. يُستشهد بها في: تصنيف العربية لغةً واحدة أو عدة لغات."
  en: "The page \"ISO 639-3: ara\" (SIL Global). The museum did not open it itself: its content is known from a research file supplied to the museum by the founder, who approved its use on 21 November 2026. Cited for: how Arabic is classified as one language or several."
  ur: "صفحہ «ISO 639-3: ara»، SIL Global۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کا مواد بانی کی فراہم کردہ تحقیقی فائل سے معلوم ہوا، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ اس کے لیے دیا گیا: عربی ایک زبان ہے یا کئی، اس کی درجہ بندی۔"
  fr: "La page « ISO 639-3: ara » (SIL Global). Le musée ne l'a pas ouverte lui-même : son contenu est connu par un dossier de recherche fourni au musée par le fondateur, qui en a approuvé l'usage le 21 novembre 2026. Citée pour : la façon dont l'arabe est classé comme une langue ou plusieurs."
  es: "La página «ISO 639-3: ara» (SIL Global). El museo no la abrió por sí mismo: su contenido se conoce por un archivo de investigación entregado al museo por el fundador, que aprobó su uso el 21 de noviembre de 2026. Citada para: cómo se clasifica el árabe como una lengua o varias."
  tr: "SIL Global'deki \"ISO 639-3: ara\" sayfası. Müze bunu kendisi açmadı; içeriği, kurucusu tarafından müzeye sunulan bir araştırma dosyasından keşfedildi ve 21 Kasım 2026'da kullanıma onaylandı. Atıfta bulunan: Arapça Sınıflandırma Bir veya Çoklu Dil olarak Sınıflandırma."
  id: "Halaman \"ISO 639-3: ara\" di SIL Global. Museum tidak membukanya sendiri; isinya ditemukan dari berkas penelitian yang diajukan oleh pendiri kepada museum dan disetujui untuk digunakan pada 21 November 2026. Dikutip dalam: Klasifikasi Arab sebagai Satu atau Beberapa Bahasa."
