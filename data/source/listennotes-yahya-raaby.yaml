reliability_note: "Episode page carrying an 'About Ustadh Yahya Raaby' biography, consulted 26 October 2026. It states that he is an instructor of Arabic and Islamic sciences at Badr Academy in the United Kingdom, a department manager and supervisor of student affairs there; that he completed memorising the Qur'an as a teenager at Badr Academy under qualified teachers who were graduates of the Islamic University of Madinah and of Imam Muhammad ibn Saud Islamic University in Riyadh; that he studied tafsir, hadith, usul al-fiqh, fiqh, grammar, seerah and history there; and that he teaches, lectures, delivers Friday sermons, leads prayers and counsels, and studies Islamic law. It gives no birth date and names no legal school for him personally."
