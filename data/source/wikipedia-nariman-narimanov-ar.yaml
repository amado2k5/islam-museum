summary:
  ar: "مقالة ويكيبيديا العربية عن ناريمان ناريمانوف؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة: ميلاده في تبليسي سنة 1870 وتخرجه طبيبًا في أوديسا سنة 1908 ومناصبه على رأس أذربيجان السوفيتية، وتعدّ من أعماله «الطب والإسلام» (1910)، وتصف وفاته سنة 1925 بأنها غامضة ودفنه قرب جدران الكرملين. لا تذكر شيئًا عن مذهبه."
  en: "Arabic Wikipedia article on Nariman Narimanov; used for entity facts only. A short article: his birth at Tbilisi in 1870, his medical graduation at Odessa in 1908, his posts at the head of Soviet Azerbaijan, his works including 'Medicine and Islam' (1910), and his death in 1925, which it calls mysterious, with burial near the Kremlin walls. It makes no statement about his school."
  es: "Artículo de Wikipedia en árabe sobre Nariman Narimanov; utilizado únicamente para datos biográficos. Breve artículo: su nacimiento en Tiflis en 1870, su graduación en medicina en Odesa en 1908, sus cargos al frente del Azerbaiyán soviético, sus obras, entre ellas «Medicina e Islam» (1910), y su muerte en 1925, que califica de misteriosa, con entierro cerca de las murallas del Kremlin. No menciona su escuela."
  fr: "Article de Wikipédia en arabe sur Nariman Narimanov; utilisé uniquement pour des informations biographiques. Cet article concis retrace sa naissance à Tbilissi en 1870, ses études de médecine à Odessa en 1908, ses fonctions à la tête de l’Azerbaïdjan soviétique, ses ouvrages, dont « Médecine et Islam » (1910), et sa mort en 1925, qualifiée de mystérieuse, avec une inhumation près des murs du Kremlin. Aucune mention n’est faite de son école."
  ur: "عربی ویکیپیڈیا مضمون ناریمان نریمانوف پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون: ان کی پیدائش 1870 میں تبلیسی میں، 1908 میں اوڈیسا میں ان کی میڈیکل گریجویشن، سوویت آذربائیجان کے سربراہ کے عہدے پر، ان کے کام بشمول 'طب اور اسلام' (1910)، اور 1925 میں ان کی موت، جسے یہ پراسرار قرار دیتا ہے، کریملن کی دیواروں کے قریب تدفین۔ یہ اس کے اسکول کے بارے میں کوئی بیان نہیں دیتا ہے۔"
  tr: "Nariman Narimanov hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kısa makale: 1870'te Tiflis'te doğması, 1908'de Odessa'da doktor olarak mezun olması ve Sovyet Azerbaycan'ın başkanlığı görevleri. Eserleri arasında \"Tıp ve İslam\" (1910) vardır; 1925'teki ölümü gizemli olarak tanımlanır ve Kremlin duvarları yakınında defnedilmesi yer alır. Mezhebi hakkında hiçbir şey belirtilmez."
  id: "Artikel Wikipedia Arab tentang Nariman Narimanov; hanya digunakan untuk fakta entitas. Artikel singkat: Kelahirannya di Tbilisi pada tahun 1870, kelulusannya sebagai dokter di Odessa pada tahun 1908, dan posisinya sebagai kepala Azerbaijan Soviet. Di antara karyanya adalah \"Medicine and Islam\" (1910), dan kematiannya pada tahun 1925 digambarkan sebagai misterius serta pemakamannya di dekat tembok Kremlin. Tidak disebutkan apa pun tentang sektenya."
