  ar: "مقالة ويكيبيديا العربية عن ناريمان ناريمانوف؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة: ميلاده في تبليسي سنة 1870 وتخرجه طبيبًا في أوديسا سنة 1908 ومناصبه على رأس أذربيجان السوفيتية، وتعدّ من أعماله «الطب والإسلام» (1910)، وتصف وفاته سنة 1925 بأنها غامضة ودفنه قرب جدران الكرملين. لا تذكر شيئًا عن مذهبه."
  en: "Arabic Wikipedia article on Nariman Narimanov; used for entity facts only. A short article: his birth at Tbilisi in 1870, his medical graduation at Odessa in 1908, his posts at the head of Soviet Azerbaijan, his works including 'Medicine and Islam' (1910), and his death in 1925, which it calls mysterious, with burial near the Kremlin walls. It makes no statement about his school."
