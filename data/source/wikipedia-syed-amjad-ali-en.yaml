  ar: "مقالة ويكيبيديا الإنجليزية عن سيد أمجد علي؛ تُستخدم لوقائع الكيان فقط. تروي أنه موظف مدني وسياسي باكستاني وُلد في لاهور في 5 تموز 1907 وتوفي فيها في 5 آذار 1997، وكان سفير باكستان لدى الولايات المتحدة (1953–1955) ووزير ماليتها الثالث (1956–1958) ومندوبها الدائم لدى الأمم المتحدة (1964–1967)."
  en: "English Wikipedia article on Syed Amjad Ali; used for entity facts only. It records a Pakistani civil servant and politician born at Lahore on 5 July 1907 and died there on 5 March 1997, who was Pakistan's ambassador to the United States (1953–1955), its third minister of finance (1956–1958) and its permanent representative to the United Nations (1964–1967)."
