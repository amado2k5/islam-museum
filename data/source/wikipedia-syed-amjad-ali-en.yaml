summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد أمجد علي؛ تُستخدم لوقائع الكيان فقط. تروي أنه موظف مدني وسياسي باكستاني وُلد في لاهور في 5 تموز 1907 وتوفي فيها في 5 آذار 1997، وكان سفير باكستان لدى الولايات المتحدة (1953–1955) ووزير ماليتها الثالث (1956–1958) ومندوبها الدائم لدى الأمم المتحدة (1964–1967)."
  en: "English Wikipedia article on Syed Amjad Ali; used for entity facts only. It records a Pakistani civil servant and politician born at Lahore on 5 July 1907 and died there on 5 March 1997, who was Pakistan's ambassador to the United States (1953–1955), its third minister of finance (1956–1958) and its permanent representative to the United Nations (1964–1967)."
  es: "Artículo de la Wikipedia en inglés sobre Syed Amjad Ali; utilizado únicamente para datos biográficos. En él se registra a un funcionario y político pakistaní nacido en Lahore el 5 de julio de 1907 y fallecido allí el 5 de marzo de 1997, que fue embajador de Pakistán en los Estados Unidos (1953-1955), su tercer ministro de finanzas (1956-1958) y su representante permanente ante las Naciones Unidas (1964-1967)."
  fr: "Article de Wikipédia en anglais sur Syed Amjad Ali; utilisé uniquement pour les informations sur l'entité. Il retrace la vie d'un fonctionnaire et homme politique pakistanais né à Lahore le 5 juillet 1907 et décédé dans cette même ville le 5 mars 1997. Il fut ambassadeur du Pakistan aux États-Unis (1953-1955), son troisième ministre des Finances (1956-1958) et son représentant permanent auprès des Nations Unies (1964-1967)."
  ur: "سید امجد علی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ایک پاکستانی سرکاری ملازم اور سیاستدان کا ریکارڈ ہے جو لاہور میں 5 جولائی 1907 کو پیدا ہوا اور 5 مارچ 1997 کو وہیں فوت ہوا، جو امریکہ میں پاکستان کے سفیر (1953–1955)، اس کے تیسرے وزیر خزانہ (1956–1958) اور اقوام متحدہ میں اس کے مستقل نمائندے (1964–1976) تھے۔"
