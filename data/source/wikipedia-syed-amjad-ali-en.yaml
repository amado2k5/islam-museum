reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives his birth at Lahore on 5 July 1907 and death there on 5 March 1997, resting chiefly on the New York Times obituary of 17 March 1997 and on a Harappa.com profile; an editorial comment inside the article notes the variant '7 May', as written 5.7.1907 on his travel document to Washington. It records his father Sir Syed Maratib Ali as a prominent Muslim businessman of the Punjab — family background — his schooling in Lucknow and at the Muslim High School and Government College in Lahore (education, not affiliation), his legal studies at the Middle Temple, his service as honorary secretary of the Muslim delegations at the first Round Table Conference (an office), his OBE (1936) and CIE (1944) from the London Gazette, his seats in the Punjab Legislative Assembly (1937–1945) and the Constituent Assembly of India (1946), and his post-independence offices. It names no school for him."
