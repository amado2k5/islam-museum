  ar: "قائمة Listen Notes لبودكاست مسلم سنترال الخاص بتيم همبل (نحو 342 حلقة منذ 2017)؛ تذكر سيرته أنه من نيوكاسل، واعتنق الإسلام في الرابعة عشرة، وتخرّج في كلية الحديث بالجامعة الإسلامية بالمدينة المنورة سنة 2011 حاملاً إجازة في الكتب الستة، وأنه ممارس للرقية الشرعية، ويعمل مع منظمة IDC North East الدعوية، ومؤسس مؤسسة همبل."
  en: "The Listen Notes listing of Muslim Central's Tim Humble podcast (some 342 episodes since 2017); its biography records that he is from Newcastle, accepted Islam at the age of fourteen, graduated from the Faculty of Hadith at the Islamic University of Madinah in 2011 with ijaza in the six canonical books of hadith, practises ruqyah, works with the dawah organisation IDC North East, and founded the Humble Foundation."
