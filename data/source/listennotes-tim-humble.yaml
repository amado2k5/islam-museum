summary:
  ar: "قائمة Listen Notes لبودكاست مسلم سنترال الخاص بتيم همبل ⁦(نحو 342 حلقة منذ 2017)⁩؛ تذكر سيرته أنه من نيوكاسل، واعتنق الإسلام في الرابعة عشرة، وتخرّج في كلية الحديث بالجامعة الإسلامية بالمدينة المنورة سنة 2011 حاملاً إجازة في الكتب الستة، وأنه ممارس للرقية الشرعية، ويعمل مع منظمة IDC North East الدعوية، ومؤسس مؤسسة همبل."
  en: "The Listen Notes listing of Muslim Central's Tim Humble podcast (some 342 episodes since 2017); its biography records that he is from Newcastle, accepted Islam at the age of fourteen, graduated from the Faculty of Hadith at the Islamic University of Madinah in 2011 with ijaza in the six canonical books of hadith, practises ruqyah, works with the dawah organisation IDC North East, and founded the Humble Foundation."
  es: "La lista de Listen Notes del podcast de Tim Humble de Muslim Central (unos 342 episodios desde 2017); su biografía indica que es de Newcastle, se convirtió al Islam a los catorce años, se graduó de la Facultad de Hadith de la Universidad Islámica de Medina en 2011 con ijaza en los seis libros canónicos de hadith, practica ruqyah, trabaja con la organización de dawah IDC North East y fundó la Fundación Humble."
  fr: "La liste Listen Notes du podcast Tim Humble de Muslim Central (quelque 342 épisodes depuis 2017); sa biographie indique qu'il est originaire de Newcastle, qu'il a accepté l'islam à l'âge de quatorze ans, qu'il a obtenu son diplôme de la Faculté de Hadith de l'Université islamique de Médine en 2011 avec une ijaza dans les six livres canoniques de hadith, qu'il pratique la ruqyah, qu'il travaille avec l'organisation de dawah IDC North East et qu'il a fondé la Humble Foundation."
