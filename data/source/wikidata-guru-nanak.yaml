reliability_note: "Structured-data item, retrieved via the MediaWiki API on 1 November 2026 and its revision re-asserted against a second live query (identical); the item was grounded from the English article's own page property. Registered for the identifier and as corroboration of the birth date and of the founder tradition's own dating of the death; its three competing death values are preserved in the record's death note, with 22 September 1539 — the value the Sikh records' internal chronology supports — the one built. Its religion value is structured data and is not what settles the faith segment, which rests on the English Wikipedia and Britannica attestations of the man as founder and first Guru of Sikhism."
