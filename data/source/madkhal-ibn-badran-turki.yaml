  id: "Buku Abdul Qadir ibn Badran al-Dimashqi (wafat 1346 H) tentang Tafsir al-Madhhab al-Hanbali, Prinsip, Ulama, dan Buku-bukunya, disunting oleh Abdullah ibn Abd al-Muhsin al-Turki; edisi kedua, Yayasan Al-Risalah, Beirut 1401 H / 1981 M."
