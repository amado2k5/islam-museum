summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مابا دياخو با؛ تُستخدم لوقائع الكيان فقط. تصفه في مطلعها بأنه تلميذ للطريقة التيجانية، وتروي لقاءه بالحاج عمر تال سنة 1846 وحكمه للريب وسالوم ووفاته في معركة فاندان-تيوتيون في 18 يوليو 1867."
  en: "English Wikipedia article on Maba Diakhou Bâ; used for entity facts only. Its lead calls him a disciple of the Tijaniyya Sufi brotherhood; it recounts his 1846 meeting with El Hadj Umar Tall, his rule of the Rip and Saloum, and his death at the battle of Fandane-Thiouthioune on 18 July 1867."
  es: "Artículo de la Wikipedia en inglés sobre Maba Diakhou Bâ; utilizado únicamente para obtener información sobre la persona. Su introducción lo describe como discípulo de la hermandad sufí Tijaniyya; relata su encuentro en 1846 con El Hadj Umar Tall, su gobierno de Rip y Saloum, y su muerte en la batalla de Fandane-Thiouthioune el 18 de julio de 1867."
  fr: "Article de Wikipédia en anglais sur Maba Diakhou Bâ; utilisé uniquement pour les informations sur l’entité. Son introduction le présente comme un disciple de la confrérie soufie Tijaniyya; elle relate sa rencontre en 1846 avec El Hadj Umar Tall, son règne sur le Rip et le Saloum, et sa mort à la bataille de Fandane-Thiouthioune le 18 juillet 1867."
  ur: "Maba Diakhou Bâ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈر اسے تیجانیہ صوفی بھائی چارے کا شاگرد کہتا ہے۔ اس میں الحاج عمر ٹل کے ساتھ ان کی 1846 کی ملاقات، اس کی رپ اور سالوم کی حکمرانی، اور 18 جولائی 1867 کو فنڈین تھیوتھیون کی لڑائی میں اس کی موت کا ذکر ہے۔"
  tr: "Maba Diajo Ba hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılır. Makale, onu başlangıçta Tijaniyya tarikatının bir öğrencisi olarak tanımlar; 1846'da Hac Omar Tal ile karşılaşmasını, Reb ve Salom üzerindeki yönetimini ve 18 Temmuz 1867'de Vandan-Teutéon Muharebesi'nde ölmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Maba Diajo Ba hanya digunakan untuk fakta entitas tersebut. Artikel ini menggambarkannya pada awalnya sebagai murid ordo Tijaniyya, menceritakan pertemuannya dengan Hajj Omar Tal pada tahun 1846, pemerintahannya atas Reb dan Salom, serta kematiannya dalam Pertempuran Vandan-Teutéon pada 18 Juli 1867."
