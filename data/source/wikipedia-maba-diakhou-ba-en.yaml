  ar: "مقالة ويكيبيديا الإنجليزية عن مابا دياخو با؛ تُستخدم لوقائع الكيان فقط. تصفه في مطلعها بأنه تلميذ للطريقة التيجانية، وتروي لقاءه بالحاج عمر تال سنة 1846 وحكمه للريب وسالوم ووفاته في معركة فاندان-تيوتيون في 18 يوليو 1867."
  en: "English Wikipedia article on Maba Diakhou Bâ; used for entity facts only. Its lead calls him a disciple of the Tijaniyya Sufi brotherhood; it recounts his 1846 meeting with El Hadj Umar Tall, his rule of the Rip and Saloum, and his death at the battle of Fandane-Thiouthioune on 18 July 1867."
