reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It names him in its lead 'Mamadu Diakhou Bâ', born 1809 in the region of Rip (Badibu), birth name Amath Ba, of Denianke descent, his family all teachers of the Quran; it calls him 'a disciple of the Tijaniyya Sufi brotherhood' and says that in 1846 he likely met El Hadj Umar Tall, 'who named him the Tijani leader for the region'; it gives his jihad from 1861, his founding of Nioro du Rip, his conversion of Lat Dior and Alboury Ndiaye, the victory at Pathé Badiane on 30 November 1865, and his death at the battle of Fandane-Thiouthioune on 18 July 1867, interred at Fandène (Mbel Fandane), his tomb a place of pilgrimage. It also records, citing Klein 1968, his slave trading and pillaging of non-Muslim states."
