summary:
  ar: "صفحة «اتحاد المجامع اللغوية العلمية العربية» في Wikipedia (Arabic)؛ لم يفتحها المتحف، وهي ملخّصة في ملف بحث قُدّم إليه بإذن المؤسس في 21 نوفمبر 2026، ويُستند إليها لوقائع المؤسسة فقط."
  en: "The page \"اتحاد المجامع اللغوية العلمية العربية\" (Wikipedia (Arabic)), summarised in a research file supplied to the museum and not opened by it, with the founder's approval of 21 November 2026; used for: the founding on 13 March 1971 after the 1956 Arab League conference recommendation, the founding academies of Cairo, Baghdad and Damascus, the first officers (Taha Hussein, Ibrahim Madkour, Ahmad Abd al-Sattar al-Jawari, Adnan al-Khatib), the seat in 6th of October City, the terminology symposia and the Historical Dictionary of the Arabic Language."
  ur: "صفحہ «اتحاد المجامع اللغوية العلمية العربية» (Wikipedia (Arabic))؛ عجائب گھر نے اسے نہیں کھولا، یہ اس کو فراہم کردہ تحقیقی فائل میں بانی کی 21 نومبر 2026ء کی منظوری سے خلاصہ شدہ ہے، اور صرف ادارے کے حقائق کے لیے استعمال ہوتا ہے۔"
  fr: "La page « اتحاد المجامع اللغوية العلمية العربية » (Wikipedia (Arabic)), résumée dans un fichier de recherche fourni au musée et non ouverte par lui, avec l'accord du fondateur du 21 novembre 2026 ; utilisée pour les faits sur l'institution seulement."
  es: "La página «اتحاد المجامع اللغوية العلمية العربية» (Wikipedia (Arabic)), resumida en un archivo de investigación entregado al museo y no abierta por él, con la aprobación del fundador del 21 de noviembre de 2026; se usa solo para datos sobre la institución."
