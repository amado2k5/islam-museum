reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A long article built on Fayz Muhammad Katib Hazara's Siraj al-tawarikh, Hari Ram Gupta's studies and Drahm's history of Afghanistan. It gives his birth in December 1746 at Mashhad, his viceroyalty of the Punjab, Kashmir and Sirhind in 1757–1758, his accession in November 1772, the suppression of Fayz Allah Khan Khalil's revolt at Peshawar and the transfer of the capital from Kandahar to Kabul, the recovery of Multan in 1780, the Kashmir rebellion of Azad Khan ending in 1786, the march against Shah Murad of Bukhara in 1788–1789, and his death after a return to Kabul in May 1793. It is internally inconsistent and the record preserves the tensions rather than hiding them — its lead gives his death as 20 May 1793 and his father-predecessor succession plainly, while its infobox, body and succession box give 18 May 1793, the infobox names Char Bagh as the death place against the body's Kabul return, and its succession box dates the reign from 4 June 1772 against the lead's November 1772. Its infobox files his religion as Sunni Islam, an infobox filing that names no legal school in any text. Checked 1 November 2026."
