summary:
  ar: "عنصر ويكيداتا Q1059948 لخليفة بن زايد آل نهيان: ولادته في 7 سبتمبر 1948 في العين ووفاته في 13 مايو 2022 في أبوظبي، ووالده زايد بن سلطان آل نهيان (Q167846) ووالدته حصة بنت محمد آل نهيان. وتحمل قيمة الدين (P140) قيمتين معًا: الإسلام (Q432) والإسلام السني (Q483654)، وكلتاهما على العنصر نفسه."
  en: "Wikidata item Q1059948 for Khalifa bin Zayed Al Nahyan: born 7 September 1948 at Al Ain, died 13 May 2022 at Abu Dhabi, father Zayed bin Sultan Al Nahyan (Q167846), mother Hassa bint Mohammed Al Nahyan. Its religion (P140) statement carries two values together, Islam (Q432) and Sunni Islam (Q483654), both on the one item."
  es: "Wikidata, elemento Q1059948, sobre Khalifa bin Zayed Al Nahyan: nacido el 7 de septiembre de 1948 en Al Ain, fallecido el 13 de mayo de 2022 en Abu Dabi. Su padre fue Zayed bin Sultan Al Nahyan (Q167846) y su madre Hassa bint Mohammed Al Nahyan. Su declaración sobre religión (P140) contiene dos valores: Islam (Q432) e Islam sunita (Q483654), ambos en el mismo elemento."
  fr: "L'élément Wikidata Q1059948 concerne Khalifa bin Zayed Al Nahyan: né le 7 septembre 1948 à Al Ain, décédé le 13 mai 2022 à Abu Dhabi, fils de Zayed bin Sultan Al Nahyan (Q167846) et de Hassa bint Mohammed Al Nahyan. La mention de religion (P140) regroupe deux valeurs: « Islam » (Q432) et « Islam sunnite » (Q483654)."
  ur: "وکی ڈیٹا آئٹم Q1059948 برائے خلیفہ بن زاید النہیان: 7 ستمبر 1948 کو العین میں پیدا ہوا، 13 مئی 2022 کو ابوظہبی میں انتقال ہوا، والد زید بن سلطان النہیان (Q167846)، والدہ حسا بنت محمد النہیان۔ اس کا مذہب (P140) بیان ایک ساتھ دو اقدار رکھتا ہے، اسلام (Q432) اور سنی اسلام (Q483654)، دونوں ایک چیز پر ہیں۔"
  tr: "Wikidata öğesi Q1059948 Khalifa bin Zayed Al Nahyan: 7 Eylül 1948'de Al Ain'de doğdu ve 13 Mayıs 2022'de Abu Dabi'de babası Zayed bin Sultan Al Nahyan (Q167846) ve annesi Hessa bint Mohammed Al Nahyan ile birlikte vefat etti. Dinin değeri (P140) iki değeri bir arada taşır: İslam (Q432) ve Sünni İslam (Q483654), her ikisi de aynı unsur üzerindedir."
  id: "Elemen Wikidata Q1059948 Khalifa bin Zayed Al Nahyan: lahir pada 7 September 1948 di Al Ain dan meninggal pada 13 Mei 2022 di Abu Dhabi, bersama ayahnya Zayed bin Sultan Al Nahyan (Q167846) dan ibunya Hessa bint Mohammed Al Nahyan. Nilai agama (HlmP140) menggabungkan dua nilai: Islam (Q432) dan Islam Sunni (Q483654), keduanya dalam elemen yang sama."
