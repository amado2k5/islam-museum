  ar: "مقالة ويكيبيديا الأردية عن بركت الله البهوبالي (1854–1927)؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه الكامل عبد الحافظ محمد بركت الله، وولادته في بوبال في 7 يوليو 1854، ونشاطه الثوري من الخارج، وتأسيسه حزب غدر، ورئاسته وزراء حكومة الهند المؤقتة في كابل، ووفاته في 20 سبتمبر 1927."
  en: "Urdu Wikipedia article on Barkatullah Bhopali (1854–1927); used for entity facts only. It gives his full name as Abdul Hafiz Muhammad Barkatullah, his birth at Bhopal on 7 July 1854, his revolutionary work from abroad, his founding part in the Ghadar Party, his premiership of the Provisional Government of India at Kabul, and his death on 20 September 1927."
