summary:
  ar: "مقالة ويكيبيديا الأردية عن بركت الله البهوبالي (1854–1927)؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه الكامل عبد الحافظ محمد بركت الله، وولادته في بوبال في 7 يوليو 1854، ونشاطه الثوري من الخارج، وتأسيسه حزب غدر، ورئاسته وزراء حكومة الهند المؤقتة في كابل، ووفاته في 20 سبتمبر 1927."
  en: "Urdu Wikipedia article on Barkatullah Bhopali (1854–1927); used for entity facts only. It gives his full name as Abdul Hafiz Muhammad Barkatullah, his birth at Bhopal on 7 July 1854, his revolutionary work from abroad, his founding part in the Ghadar Party, his premiership of the Provisional Government of India at Kabul, and his death on 20 September 1927."
  es: "Artículo de Wikipedia en urdu sobre Barkatullah Bhopali (1854-1927); utilizado únicamente para datos biográficos. Indica su nombre completo como Abdul Hafiz Muhammad Barkatullah, su nacimiento en Bhopal el 7 de julio de 1854, su labor revolucionaria en el extranjero, su participación en la fundación del Partido Ghadar, su mandato como primer ministro del Gobierno Provisional de la India en Kabul y su fallecimiento el 20 de septiembre de 1927."
  fr: "Article de Wikipédia en ourdou sur Barkatullah Bhopali (1854-1927); utilisé uniquement à titre informatif. Il indique son nom complet: Abdul Hafiz Muhammad Barkatullah; sa naissance à Bhopal le 7 juillet 1854; son action révolutionnaire depuis l’étranger; son rôle fondateur au sein du parti Ghadar; son poste de Premier ministre du gouvernement provisoire de l’Inde à Kaboul; et sa mort le 20 septembre 1927."
