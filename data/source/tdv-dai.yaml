summary:
  ar: "مدخل «داعي» في موسوعة TDV الإسلامية: معنى اللفظ، والدعوة الإسماعيلية ومراتب الدعاة من داعي الدعاة إلى الجناح، وتأهيل الداعي علمياً وأخلاقياً، ووظائفه التنظيمية والعسكرية، والدعاة عند النظاريين والطيبيين والدروز، والداعي في مصطلح الحديث."
  en: "The TDV İslâm Ansiklopedisi entry on the dāʿī (missionary): the word's sense, the Ismaili daʿwa and the ranks of the dais from dāʿī al-duʿāt down to the janāḥ, the dai's scholarly and moral formation, his organisational and military functions, the dai among the Nizaris, Tayyibis and Druzes, and the term in hadith criticism."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el dāʿī (misionero): el significado de la palabra, la daʿwa ismaelita y los rangos de los dais desde dāʿī al-duʿāt hasta el janāḥ, la formación académica y moral del dai, sus funciones organizativas y militares, el dai entre los nizaris, tayyibis y drusos, y el término en la crítica de hadices."
