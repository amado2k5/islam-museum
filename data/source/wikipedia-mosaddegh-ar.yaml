summary:
  ar: "مقالة ويكيبيديا العربية عن محمد مصدق؛ تُستخدم لوقائع الكيان فقط. تروي رئاسته للحكومة وتأميم النفط وانقلاب 1953 عليه وسنوات إقامته الجبرية حتى وفاته سنة 1967. لا تذكر أي انتماء ديني شخصي له؛ والشيعة يردون في نصّها رجالَ دين سحبوا دعمهم عنه خوفًا من الشيوعيين."
  en: "Arabic Wikipedia article on Mohammad Mosaddegh; used for entity facts only. It recounts his premiership, the oil nationalisation, the 1953 coup against him and his years under house arrest until his death in 1967. It makes no statement of his personal religious affiliation; the Shia mentioned in its text are clerics who withdrew support from him for fear of a communist takeover."
  es: "Artículo en árabe de la Wikipedia sobre Mohammad Mosaddegh; se utiliza únicamente para obtener información sobre su figura. Relata su mandato como primer ministro, la nacionalización del petróleo, el golpe de Estado de 1953 en su contra y sus años bajo arresto domiciliario hasta su muerte en 1967. No menciona su afiliación religiosa; los chiítas que aparecen en el texto son clérigos que le retiraron su apoyo por temor a una toma del poder por los comunistas."
  fr: "Article de Wikipédia en arabe sur Mohammad Mossadegh; utilisé uniquement à des fins d’information. Il relate son mandat de Premier ministre, la nationalisation du pétrole, le coup d’État de 1953 et ses années d’assignation à résidence jusqu’à sa mort en 1967. Il ne fait aucune mention de son appartenance religieuse personnelle; les chiites mentionnés dans le texte sont des religieux qui lui ont retiré leur soutien par crainte d’une prise de pouvoir communiste."
  ur: "محمد مصدق پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی وزارت عظمیٰ، تیل کی قومیت، ان کے خلاف 1953 کی بغاوت اور 1967 میں ان کی موت تک ان کے گھر میں نظربند رہنے کا ذکر ہے۔ اس میں ان کی ذاتی مذہبی وابستگی کا کوئی بیان نہیں ہے۔ اس کے متن میں جن شیعہ کا ذکر کیا گیا ہے وہ ایسے علماء ہیں جنہوں نے کمیونسٹ قبضے کے خوف سے اس سے حمایت واپس لے لی۔"
  tr: "Mohamed Mossadegh hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Hükümet başkanlığını, petrolün millileştirilmesini, 1953 darbesini ve 1967'deki ölümüne kadar ev hapsinde geçirdiği yılları anlatır. Kişisel dini aidiyetinden bahsetmez; Şiiler, metinde komünistlerden korktuğu için desteklerini çeken din adamlarından bahseder."
  id: "Artikel Wikipedia berbahasa Arab tentang Mohamed Mossadegh; digunakan hanya untuk fakta entitas. Artikel itu menceritakan masa kepresidenannya di pemerintahan, nasionalisasi minyak, kudeta tahun 1953 terhadapnya, dan tahun-tahun tahanan rumahnya hingga kematiannya pada 1967. Artikel itu tidak menyebutkan afiliasi agama pribadinya; Syiah dalam teksnya menyebutkan ulama yang menarik dukungan mereka kepadanya karena takut pada komunis."
