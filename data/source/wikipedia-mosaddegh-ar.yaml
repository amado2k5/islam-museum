  ar: "مقالة ويكيبيديا العربية عن محمد مصدق؛ تُستخدم لوقائع الكيان فقط. تروي رئاسته للحكومة وتأميم النفط وانقلاب 1953 عليه وسنوات إقامته الجبرية حتى وفاته سنة 1967. لا تذكر أي انتماء ديني شخصي له؛ والشيعة يردون في نصّها رجالَ دين سحبوا دعمهم عنه خوفًا من الشيوعيين."
  en: "Arabic Wikipedia article on Mohammad Mosaddegh; used for entity facts only. It recounts his premiership, the oil nationalisation, the 1953 coup against him and his years under house arrest until his death in 1967. It makes no statement of his personal religious affiliation; the Shia mentioned in its text are clerics who withdrew support from him for fear of a communist takeover."
