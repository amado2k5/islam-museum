  ar: "قناة عائشة هارون على يوتيوب (@ayshaharun)؛ مصدر أولي لمحتواها في الجمال والعناية بالبشرة ونمط الحياة وسلسلة «رمضان اليومي»، وتحتفظ كلمات القناة المفتاحية باسمها السابق «عائشة عبدول» وبوصفها إثيوبية، وتحمل مقاطع لها في هارار بإثيوبيا ومع أسرتها في تورونتو."
  en: "Aysha Harun's YouTube channel (@ayshaharun); a primary source for her beauty, skincare and lifestyle content and her Ramadan Daily series. The channel's own keywords preserve her earlier channel name, Aysha Abdul, and the descriptor 'ethiopian', and her videos include family trips to Harar, Ethiopia, and to Toronto."
  es: "El canal de YouTube de Aysha Harun (@ayshaharun) es la principal fuente de su contenido sobre belleza, cuidado de la piel y estilo de vida, así como de su serie \"Ramadán Diario\". Las palabras clave del canal conservan su nombre anterior, Aysha Abdul, y la descripción \"etíope\". Sus videos incluyen viajes familiares a Harar, Etiopía, y a Toronto."
