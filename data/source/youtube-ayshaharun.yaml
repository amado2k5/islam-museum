summary:
  ar: "قناة عائشة هارون على يوتيوب (@ayshaharun)؛ مصدر أولي لمحتواها في الجمال والعناية بالبشرة ونمط الحياة وسلسلة «رمضان اليومي»، وتحتفظ كلمات القناة المفتاحية باسمها السابق «عائشة عبدول» وبوصفها إثيوبية، وتحمل مقاطع لها في هارار بإثيوبيا ومع أسرتها في تورونتو."
  en: "Aysha Harun's YouTube channel (@ayshaharun); a primary source for her beauty, skincare and lifestyle content and her Ramadan Daily series. The channel's own keywords preserve her earlier channel name, Aysha Abdul, and the descriptor 'ethiopian', and her videos include family trips to Harar, Ethiopia, and to Toronto."
  es: "El canal de YouTube de Aysha Harun (@ayshaharun) es la principal fuente de su contenido sobre belleza, cuidado de la piel y estilo de vida, así como de su serie \"Ramadán Diario\". Las palabras clave del canal conservan su nombre anterior, Aysha Abdul, y la descripción \"etíope\". Sus videos incluyen viajes familiares a Harar, Etiopía, y a Toronto."
  fr: "La chaîne YouTube d'Aysha Harun (@ayshaharun) est sa principale source de contenu beauté, soins de la peau et lifestyle, ainsi que sa série quotidienne Ramadan. Les mots-clés de la chaîne conservent son ancien nom, Aysha Abdul, et le terme « éthiopienne ». Ses vidéos incluent des voyages en famille à Harar, en Éthiopie, et à Toronto."
  ur: "عائشہ ہارون کا یوٹیوب چینل (@ayshaharun)؛ اس کی خوبصورتی، جلد کی دیکھ بھال اور طرز زندگی کے مواد اور اس کی رمضان ڈیلی سیریز کا بنیادی ذریعہ۔ چینل کے اپنے کلیدی الفاظ اس کے پہلے والے چینل کے نام، عائشہ عبدل، اور وضاحت کنندہ 'ایتھوپیا' کو محفوظ رکھتے ہیں، اور اس کے ویڈیوز میں خاندان کے ہرار، ایتھوپیا اور ٹورنٹو کے دورے شامل ہیں۔"
  tr: "Aisha Haroun'un YouTube kanalı (@ayshaharun), güzellik, cilt bakımı, yaşam tarzı ve \"Daily Ramadan\" dizisi üzerine içeriklerinin birincil kaynağıdır. Kanalın anahtar kelimeleri, eski adı \"Aisha Abdul\" olarak Etiyopyalı olarak kullanılıyor ve ailesiyle birlikte Toronto'da Harare, Etiyopya'da kendisinin kliplerini yüklüyor."
  id: "Channel YouTube Aisha Haroun (@ayshaharun) adalah sumber utama untuk kontennya tentang kecantikan, perawatan kulit, gaya hidup, dan serial \"Daily Ramadan.\" Kata kunci channel tersebut tetap menggunakan nama lamanya \"Aisha Abdul\" sebagai orang Ethiopia, dan ia mengunggah cuplikan dirinya di Harare, Ethiopia, bersama keluarganya di Toronto."
