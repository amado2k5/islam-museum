label: { en: "Biographical chapter on Ustaz Abu Bassam Oemar Mita — UIN Antasari thesis (Chapter IV)" }
summary:
  ar: "فصل سيرة من رسالة جامعية في جامعة أنتساري الإسلامية الحكومية عن الأستاذ أبي بسام عمر ميتا؛ يؤكد ولادته في كودوس في 14 مايو 1979 ودراسته في دار الشهادة ثم كلية الشريعة في ليبيا، ويذكر كتابيه «الطرق الذهبية إلى الجنة» و«رسالة إلى الله»."
  en: "Biographical chapter of a UIN Antasari thesis on Ustaz Abu Bassam Oemar Mita; it confirms his birth in Kudus on 14 May 1979 and his studies at Darusy Syahadah and then LIPIA's Faculty of Sharia, and names his books Golden Ways to Jannah and A Letter to Allah."
  es: "La tesis de la UIN Antasari sobre el Ustaz Abu Bassam Oemar Mita confirma su nacimiento en Kudus el 14 de mayo de 1979 y sus estudios en Darusy Syahadah y posteriormente en la Facultad de Sharia de LIPIA, y nombra sus libros Caminos Dorados al Paraíso y Una Carta a Alá."
  fr: "Thèse d'Antasari de l'UIN sur Ustaz Abu Bassam Oemar Mita; elle confirme sa naissance à Kudus le 14 mai 1979 et ses études à Darusy Syahadah puis à la faculté de charia de LIPIA, et cite ses livres Golden Ways to Jannah et A Letter to Allah."
  ur: "استاد ابو بسام عمر میتا پر UIN انتصاری مقالہ؛ یہ 14 مئی 1979 کو قدوس میں اس کی پیدائش اور داروسی سہادہ اور پھر LIPIA کی فیکلٹی آف شریعہ میں اس کی تعلیم کی تصدیق کرتا ہے، اور اس کی کتابوں کا نام جنت کے گولڈن ویز اور اے لیٹر ٹو اللہ رکھا ہے۔"
  tr: "Entesari İslam Devleti Üniversitesi'nde Profesör Abu Bassam Omar Mitta hakkında bir üniversite tezinden biyografi bölümü; 14 Mayıs 1979'da Kudos'ta doğumunu ve ardından Libya'daki Dar Al-Shahada ile ardından Şeriat Koleji'ndeki eğitimlerini doğruluyor; iki kitabı \"Cennete Giden Altın Yollar\" ve \"Tanrı'ya Bir Mesaj\" olarak anılıyor."
  id: "Bab biografi dari tesis universitas di Universitas Negara Islam Entesari tentang Profesor Abu Bassam Omar Mitta; mengonfirmasi kelahirannya di Kudos pada 14 Mei 1979, dan studinya di Dar Al-Shahada dan kemudian di College of Sharia di Libya, menyebutkan dua bukunya: \"The Golden Paths to Paradise\" dan \"A Message to God.\""
title: "BAB IV — Hasil Penelitian dan Pembahasan: Gambaran Umum Ustadz Abu Bassam Oemar Mita"
