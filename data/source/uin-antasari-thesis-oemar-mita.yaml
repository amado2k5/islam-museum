reliability_note: "University thesis chapter, read on 15 November 2026; its biographical section cites Liputan 6 for the profile. It independently repeats the Prophetica article's core facts (born in Kudus, 14 May 1979; Darusy Syahadah, then LIPIA Faculty of Sharia) and adds two further book titles. It also records his Instagram account @oemar_mita at 1.1 million followers at its writing; that figure is undated within the chapter and is not used as a reach entry. It names no school or order for him."
