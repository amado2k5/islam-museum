summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن همايون أحمد؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 13 نوفمبر 1948 ووفاته في 19 يوليو 2012 في نيويورك، ورواياته التي تجاوزت مئتي كتاب وأفلامه الثمانية وجوائزه، وتذكر في حياته الشخصية أنه كان مسلمًا سنيًا — وهي شهادة وحيدة لا يعضدها مصدر مستقل ثانٍ."
  en: "English Wikipedia article on Humayun Ahmed; used for entity facts only. It gives his birth on 13 November 1948 and his death on 19 July 2012 in New York City, his more than 200 books, his eight films and his awards. Its personal-life section states that he was a Sunni Muslim — a single attestation that no second independent source corroborates."
  es: "Artículo de la Wikipedia en inglés sobre Humayun Ahmed; utilizado únicamente para datos biográficos. Indica su fecha de nacimiento (13 de noviembre de 1948) y su fallecimiento (19 de julio de 2012) en la ciudad de Nueva York, sus más de 200 libros, sus ocho películas y sus premios. En la sección sobre su vida personal se afirma que era musulmán sunita, una única constatación que ninguna otra fuente independiente corrobora."
  fr: "L'article de Wikipédia en anglais consacré à Humayun Ahmed, utilisé uniquement pour les informations le concernant, indique sa naissance le 13 novembre 1948 et son décès le 19 juillet 2012 à New York, ses plus de 200 livres, ses huit films et les prix qu'il a reçus. La section consacrée à sa vie personnelle précise qu'il était musulman sunnite – une information unique non corroborée par d'autres sources indépendantes."
