  ar: "مقالة ويكيبيديا الإنجليزية عن همايون أحمد؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 13 نوفمبر 1948 ووفاته في 19 يوليو 2012 في نيويورك، ورواياته التي تجاوزت مئتي كتاب وأفلامه الثمانية وجوائزه، وتذكر في حياته الشخصية أنه كان مسلمًا سنيًا — وهي شهادة وحيدة لا يعضدها مصدر مستقل ثانٍ."
  en: "English Wikipedia article on Humayun Ahmed; used for entity facts only. It gives his birth on 13 November 1948 and his death on 19 July 2012 in New York City, his more than 200 books, his eight films and his awards. Its personal-life section states that he was a Sunni Muslim — a single attestation that no second independent source corroborates."
