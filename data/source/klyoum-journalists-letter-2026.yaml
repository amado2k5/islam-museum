summary:
  ar: "تقرير موقع كل يوم والرئيس نيوز في 10 نوفمبر 2026 عن رسالة سعد الدين الهلالي المفتوحة إلى نقيب الصحفيين خالد البلشي بعد حلقة «الحكاية» التي تحدث فيها عن زواج الأطفال في الفقه القديم وإلغائه بالقانون."
  en: "klyoum and El-Raees News report of 10 November 2026 on Saad El-Din El-Hilali's open letter to Khaled El-Balshy, head of the Journalists' Syndicate, after the Al-Hekaya episode in which he discussed child marriage in classical fiqh and its abolition by statute."
  es: "Informe de klyoum y El-Raees News del 10 de noviembre de 2026 sobre la carta abierta de Saad El-Din El-Hilali a Khaled El-Balshy, jefe del Sindicato de Periodistas, tras el episodio de Al-Hekaya en el que habló sobre el matrimonio infantil en el fiqh clásico y su abolición por ley."
  fr: "Rapport de klyoum et El-Raees News du 10 novembre 2026 sur la lettre ouverte de Saad El-Din El-Hilali à Khaled El-Balshy, chef du Syndicat des journalistes, après l'épisode d'Al-Hekaya dans lequel il a discuté du mariage des enfants dans le fiqh classique et de son abolition par la loi."
  ur: "10 نومبر 2026 کی کلیوم اور الرئیس نیوز کی رپورٹ سعد الدین ہلالی کے صحافیوں کی سنڈیکیٹ کے سربراہ خالد البلشی کو لکھے گئے کھلے خط پر، الحاکیہ کے واقعہ کے بعد، جس میں انہوں نے کلاسیکی فقہ میں کم عمری کی شادی اور قانون کے ذریعے اس کے خاتمے پر گفتگو کی۔"
