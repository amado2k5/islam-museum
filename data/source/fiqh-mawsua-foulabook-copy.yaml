reliability_note: "Edition and date not verified. The copy is an automated Shamela file (download about Rabi' al-Awwal 1433 AH per its own header) and its title page names a Dorar.net compilation with three volumes, which does not match the Kuwaiti Ministry of Awqaf encyclopedia (which runs to many more volumes). Do not attribute this text to the Kuwaiti encyclopedia until the printed edition is identified. Page numbers are OCR scan markers (PDF pages), not printed folios. The copy's text includes honorific formulas that the museum does not reproduce."
