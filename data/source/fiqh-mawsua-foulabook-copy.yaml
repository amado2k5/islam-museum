label: { en: "al-Mawsu'a al-Fiqhiyya, digital copy (Shamela / Foulabook file)", ar: "الموسوعة الفقهية — نسخة رقمية ⁦(الشاملة)⁩" }
summary:
  en: "A digital text file of a fiqh encyclopedia, made by the Shamela library. Its title page credits a Dorar.net compilation supervised by Alawi al-Saqqaf in three volumes. Read here only for its introduction and first topic."
  ar: "ملف نصي رقمي لموسوعة فقهية أعدته المكتبة الشاملة. تنسبه صفحة العنوان إلى موقع الدرر السنية بإشراف علوي السقاف في ثلاثة أجزاء. قُرئت هنا المقدمة والموضوع الأول فقط."
  es: "Archivo digital de una enciclopedia de fiqh, elaborada por la biblioteca Shamela. En su portada se menciona una compilación de Dorar.net supervisada por Alawi al-Saqqaf en tres volúmenes. Aquí solo se incluye la introducción y el primer tema."
  fr: "Il s'agit d'un fichier texte numérique d'une encyclopédie de jurisprudence islamique (fiqh), réalisée par la bibliothèque Shamela. Sa page de titre mentionne une compilation de Dorar.net supervisée par Alawi al-Saqqaf en trois volumes. À lire uniquement pour l'introduction et le premier chapitre."
  ur: "شمیلہ لائبریری کے ذریعہ تیار کردہ فقہ انسائیکلوپیڈیا کی ڈیجیٹل ٹیکسٹ فائل۔ اس کا ٹائٹل پیج تین جلدوں میں علوی الثقاف کے زیر نگرانی Dorar.net کی تالیف کا سہرا دیتا ہے۔ یہاں صرف اس کے تعارف اور پہلے موضوع کے لیے پڑھیں۔"
  tr: "Kapsamlı Kütüphane tarafından hazırlanmış bir hukukçu ansiklopedinin dijital metin dosyası. Başlık sayfası, Alawi Al-Saqqaf tarafından denetlenen Al-Durar Al-Sunniyya web sitesine üç bölüm halinde atfediliyor. Burada sadece giriş ve ilk konu okunmuştur."
  id: "File teks digital ensiklopedia yurisprudensial yang disiapkan oleh Perpustakaan Komprehensif. Halaman judul mengatributkan situs web Al-Durar Al-Sunniyya yang diawasi oleh Alawi Al-Saqqaf dalam tiga bagian. Di sini, hanya pengantar dan topik pertama yang dibaca."
title: "الموسوعة الفقهية"
author: []
publisher: "موقع الدرر السنية على الإنترنت (dorar.net), per title page"
