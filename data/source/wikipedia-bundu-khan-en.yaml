summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بندو خان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه عازف سارنغي وُلد سنة 1880 في دلهي، خدم بلاط إندور 27 عاما، وهاجر بعد التقسيم إلى كراتشي حيث توفي في 13 يناير 1955، ونال وسام الأداء المتميز سنة 1985 بعد وفاته بحسب المقالة. لا تذكر المقالة شيئا عن دينه."
  en: "English Wikipedia article on Bundu Khan; used for entity facts only. It gives the sarangi player born in 1880 at Delhi, 27 years a court musician at Indore, migrated after Partition to Karachi, where he died on 13 January 1955, and — per the article — bestowed the Pride of Performance in 1985, posthumously. It makes no statement about his religion."
  es: "Artículo de la Wikipedia en inglés sobre Bundu Khan; utilizado únicamente para obtener información sobre la persona. En él se menciona que el intérprete de sarangi nació en 1880 en Delhi, fue músico de la corte en Indore durante 27 años, emigró a Karachi tras la Partición, donde falleció el 13 de enero de 1955 y, según el artículo, recibió el premio Pride of Performance a título póstumo en 1985. No se menciona su religión."
  fr: "L'article de Wikipédia en anglais consacré à Bundu Khan, utilisé uniquement pour les informations le concernant, indique que ce joueur de sarangi est né en 1880 à Delhi, a été musicien de cour à Indore pendant 27 ans, a émigré après la Partition à Karachi, où il est décédé le 13 janvier 1955, et – selon l'article – a reçu à titre posthume la Pride of Performance en 1985. L'article ne mentionne pas sa religion."
