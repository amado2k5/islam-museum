  ar: "مقالة ويكيبيديا الإنجليزية عن بندو خان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه عازف سارنغي وُلد سنة 1880 في دلهي، خدم بلاط إندور 27 عاما، وهاجر بعد التقسيم إلى كراتشي حيث توفي في 13 يناير 1955، ونال وسام الأداء المتميز سنة 1985 بعد وفاته بحسب المقالة. لا تذكر المقالة شيئا عن دينه."
  en: "English Wikipedia article on Bundu Khan; used for entity facts only. It gives the sarangi player born in 1880 at Delhi, 27 years a court musician at Indore, migrated after Partition to Karachi, where he died on 13 January 1955, and — per the article — bestowed the Pride of Performance in 1985, posthumously. It makes no statement about his religion."
