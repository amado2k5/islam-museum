summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيزا غورسي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 7 أبريل 1921 بإسطنبول ووفاته في 13 أبريل 1992 في نيو هيفن بكونيتيكت، وتعليمه في غلطة سراي وجامعة إسطنبول ودكتوراه إمبريال كوليدج 1950، ونموذجه الكيرالي وصيغة غورسي–راديكاتي، وأستاذيته في جامعة الشرق الأوسط التقنية ثم ييل، وجائزة أوبنهايمر 1977 وميدالية فيغنر 1986. لا يحتوي المقال أي محتوى ديني."
  en: "English Wikipedia article on Feza Gürsey; used for entity facts only. It gives his birth on 7 April 1921 at Istanbul and his death on 13 April 1992 at New Haven, Connecticut, his education at Galatasaray and Istanbul University and his 1950 Imperial College PhD, the chiral model and the Gürsey–Radicati formula, his professorships at METU and Yale, the 1977 Oppenheimer Prize and the 1986 Wigner Medal. The article contains no religion content."
  es: "Artículo de la Wikipedia en inglés sobre Feza Gürsey; se utiliza únicamente para datos biográficos. Menciona su nacimiento el 7 de abril de 1921 en Estambul y su fallecimiento el 13 de abril de 1992 en New Haven, Connecticut; su formación académica en el Galatasaray y la Universidad de Estambul; su doctorado en el Imperial College en 1950; el modelo quiral y la fórmula de Gürsey-Radicati; sus cátedras en la Universidad Técnica de Oriente Medio (METU) y Yale; el Premio Oppenheimer de 1977 y la Medalla Wigner de 1986. El artículo no contiene contenido religioso."
  fr: "Article de Wikipédia en anglais sur Feza Gürsey; utilisé uniquement pour des informations biographiques. Il mentionne sa naissance le 7 avril 1921 à Istanbul et son décès le 13 avril 1992 à New Haven, dans le Connecticut, ses études à Galatasaray et à l’Université d’Istanbul, son doctorat obtenu à l’Imperial College en 1950, le modèle chiral et la formule de Gürsey-Radicati, ses postes de professeur à l’Université technique du Moyen-Orient (METU) et à Yale, le prix Oppenheimer reçu en 1977 et la médaille Wigner en 1986. Cet article ne contient aucun élément religieux."
  ur: "Feza Gürsey پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 7 اپریل 1921 کو استنبول میں ان کی پیدائش اور 13 اپریل 1992 کو نیو ہیون، کنیکٹی کٹ میں ان کی موت، گالاتسرائے اور استنبول یونیورسٹی میں ان کی تعلیم اور 1950 کے امپیریل کالج میں پی ایچ ڈی، چیرل ماڈل اور Gürsey – Radicati فارمولہ، ان کی پروفیسر شپس، METU اور METU79 میں ان کی پروفیسر شپ۔ 1986 وگنر میڈل۔ مضمون میں کوئی مذہبی مواد نہیں ہے۔"
