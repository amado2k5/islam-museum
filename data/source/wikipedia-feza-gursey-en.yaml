summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيزا غورسي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 7 أبريل 1921 بإسطنبول ووفاته في 13 أبريل 1992 في نيو هيفن بكونيتيكت، وتعليمه في غلطة سراي وجامعة إسطنبول ودكتوراه إمبريال كوليدج 1950، ونموذجه الكيرالي وصيغة غورسي–راديكاتي، وأستاذيته في جامعة الشرق الأوسط التقنية ثم ييل، وجائزة أوبنهايمر 1977 وميدالية فيغنر 1986. لا يحتوي المقال أي محتوى ديني."
  en: "English Wikipedia article on Feza Gürsey; used for entity facts only. It gives his birth on 7 April 1921 at Istanbul and his death on 13 April 1992 at New Haven, Connecticut, his education at Galatasaray and Istanbul University and his 1950 Imperial College PhD, the chiral model and the Gürsey–Radicati formula, his professorships at METU and Yale, the 1977 Oppenheimer Prize and the 1986 Wigner Medal. The article contains no religion content."
