summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد عاصم مالك، مدير عام جهاز الاستخبارات الباكستاني منذ 30 أيلول 2024؛ تذكر مولده في شاهبور بمقاطعة سرغودها لأسرة أعوانية بنجابية ودراساته ودكتوراهه في العلاقات الأمريكية الباكستانية."
  en: "Urdu Wikipedia article on Muhammad Asim Malik, Director-General of the ISI since 30 September 2024; it records his birth in Shahpur, Sargodha District, to a Punjabi Awan family, his studies and his doctorate on US-Pakistan relations."
  es: "Artículo de Wikipedia en urdu sobre Muhammad Asim Malik, director general del ISI desde el 30 de septiembre de 2024; registra su nacimiento en Shahpur, distrito de Sargodha, en una familia punjabi Awan, sus estudios y su doctorado sobre las relaciones entre Estados Unidos y Pakistán."
  fr: "Article Wikipédia en ourdou sur Muhammad Asim Malik, directeur général de l'ISI depuis le 30 septembre 2024; il enregistre sa naissance à Shahpur, dans le district de Sargodha, dans une famille punjabi Awan, ses études et son doctorat sur les relations américano-pakistanaises."
  ur: "30 ستمبر 2024 سے آئی ایس آئی کے ڈائریکٹر جنرل محمد عاصم ملک پر اردو ویکیپیڈیا کا مضمون؛ اس میں ان کی پیدائش شاہ پور، ضلع سرگودھا میں، ایک پنجابی اعوان خاندان میں، ان کی تعلیم اور امریکہ پاکستان تعلقات پر ڈاکٹریٹ کی ریکارڈنگ ہے۔"
  tr: "30 Eylül 2024'ten beri Pakistan istihbarat teşkilatının Genel Müdürü olan Mohammad Asim Malik hakkında Urduca Wikipedia makalesi, Sargodha bölgesindeki Shahpur'da Pencaplı bir ajan ailesinde doğmasını, eğitimini ve ABD-Pakistan ilişkileri üzerine doktora derecesini hatırlatıyor."
  id: "Artikel Wikipedia Urdu tentang Mohammad Asim Malik, Direktur Jenderal badan intelijen Pakistan sejak 30 September 2024, mengenang kelahirannya di Shahpur, distrik Sargodha dari keluarga agen Punjabi, studinya, dan gelar doktor dalam hubungan AS-Pakistan."
