  ar: "مقالة ويكيبيديا الإنجليزية عن رياض الدين؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 10 نوفمبر 1930 بلوديانا ووفاته في 9 سبتمبر 2013 بإسلام آباد، وأنه تلميذ عبد السلام ومشرفه في الدكتوراه، وإدارته مجموعة الفيزياء النظرية في هيئة الطاقة الذرية (1974–1984)، وعلاقة كي إس آر إف. لا يرد في نصها أي محتوى عن دينه الشخصي."
  en: "English Wikipedia article on Riazuddin; used for entity facts only. It gives his birth as 10 November 1930 at Ludhiana and his death as 9 September 2013 at Islamabad, his doctorate under Abdus Salam as doctoral advisor, his directorship of the PAEC's Theoretical Physics Group (1974–1984), and the KSRF relation. Its text carries no content about his personal religion."
