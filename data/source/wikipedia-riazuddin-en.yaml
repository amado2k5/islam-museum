summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رياض الدين؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 10 نوفمبر 1930 بلوديانا ووفاته في 9 سبتمبر 2013 بإسلام آباد، وأنه تلميذ عبد السلام ومشرفه في الدكتوراه، وإدارته مجموعة الفيزياء النظرية في هيئة الطاقة الذرية (1974–1984)، وعلاقة كي إس آر إف. لا يرد في نصها أي محتوى عن دينه الشخصي."
  en: "English Wikipedia article on Riazuddin; used for entity facts only. It gives his birth as 10 November 1930 at Ludhiana and his death as 9 September 2013 at Islamabad, his doctorate under Abdus Salam as doctoral advisor, his directorship of the PAEC's Theoretical Physics Group (1974–1984), and the KSRF relation. Its text carries no content about his personal religion."
  es: "Artículo de la Wikipedia en inglés sobre Riazuddin; utilizado únicamente para datos biográficos. Indica que nació el 10 de noviembre de 1930 en Ludhiana y falleció el 9 de septiembre de 2013 en Islamabad, obtuvo su doctorado bajo la dirección de Abdus Salam, dirigió el Grupo de Física Teórica de la PAEC (1974-1984) y se relaciona con la KSRF. El texto no contiene información sobre su religión."
  fr: "Article Wikipédia en anglais sur Riazuddin; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 10 novembre 1930 à Ludhiana et son décès le 9 septembre 2013 à Islamabad, son doctorat sous la direction d’Abdus Salam, sa direction du groupe de physique théorique de la PAEC (1974-1984) et ses liens avec la KSRF. Le texte ne contient aucune information sur sa religion."
  ur: "ریاض الدین پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 10 نومبر 1930 کو لدھیانہ میں اور ان کی موت 9 ستمبر 2013 کو اسلام آباد میں ہوئی، عبدالسلام کے تحت ڈاکٹریٹ کے مشیر کے طور پر ان کی ڈاکٹریٹ، PAEC کے تھیوریٹیکل فزکس گروپ (1974–1984) کی ان کی ڈائریکٹر شپ، اور KSRF کے تعلق سے۔ اس کے متن میں اس کے ذاتی مذہب کے بارے میں کوئی مواد نہیں ہے۔"
