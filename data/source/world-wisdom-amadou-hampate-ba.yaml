reliability_note: "Publisher's author page of World Wisdom (a publishing house specialising in religious studies), read in full on 24 October 2026. It states: 'From the time of his youth, Mr. Bâ was a student and disciple of an extraordinary Malian Sufi master, Tierno Bokar', and that he first met 'his spiritual leader, Tierno Bokar' at the Qur'anic school Bokar ran. Used, independently of Wikipedia, as the second attestation of his Sufi discipleship; it also corroborates the IFAN appointment of 1942, the founding of the Institute of Human Sciences in 1960, the UNESCO Executive Board election of 1962 and the 1966 transcription work, and gives his dates as c. 1900-1991 with death in 1991 (the day, 15 May, comes from the English article and Wikidata). It names no legal school for him."
