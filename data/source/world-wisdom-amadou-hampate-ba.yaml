summary:
  ar: "صفحة دار «وورلد ويزدوم» عن مؤلفها أمادو هامباتي با، ناشرة الترجمة الإنجليزية لسيرته عن معلمه «روح التسامح»؛ توثّق أنه كان منذ صباه تلميذًا ومريدًا للشيخ الصوفي تيرنو بوكار."
  en: "World Wisdom's author page for Amadou Hampâté Bâ, publisher of A Spirit of Tolerance, the English translation of his biography of his teacher; it records that from his youth Bâ was a student and disciple of the Sufi master Tierno Bokar."
  es: "La página de World Wisdom dedicada a Amadou Hampâté Bâ, editor de A Spirit of Tolerance, la traducción al inglés de la biografía de su maestro, indica que desde su juventud Bâ fue alumno y discípulo del maestro sufí Tierno Bokar."
  fr: "La page auteur de World Wisdom pour Amadou Hampâté Bâ, éditeur de A Spirit of Tolerance, la traduction anglaise de sa biographie de son maître; il y est indiqué que dès sa jeunesse, Bâ fut un étudiant et un disciple du maître soufi Tierno Bokar."
  ur: "A Spirit of Tolerance کے پبلشر Amadou Hampâté Bâ کے لیے ورلڈ وائزڈم کا مصنف صفحہ، اپنے استاد کی سوانح کا انگریزی ترجمہ؛ اس میں درج ہے کہ اپنی جوانی سے Bâ صوفی استاد ٹیرنو بوکر کا طالب علم اور شاگرد تھا۔"
  tr: "Yazarı Amado Hampati Ba hakkında, öğretmeninin biyografisi 'Hoşgörü Ruhu'nun İngilizce çevirisinin yayıncısı olan World Wisdom sayfası; çocukluğundan beri Sufi Şeyh Tyrno Pocar'ın öğrencisi ve öğrencisi olduğunu belgelemektedir."
  id: "Halaman World Wisdom tentang penulisnya Amado Hampati Ba, penerbit terjemahan bahasa Inggris biografi gurunya 'The Spirit of Tolerance'; halaman ini mendokumentasikan bahwa sejak kecil ia adalah murid dan murid Sufi Sheikh Tyrno Pocar."
