reliability_note: "Consultation-date source: read in full on 27 October 2026 through the browser search/open route, which exposes no revision identifier for this article, so none is recorded (consultation-date precedent). Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. The article gives his birth as 23 December 1952 at Sylhet and names his elder brother Humayun Ahmed and younger brother Ahsan Habib. On religion it is silent about Iqbal himself: it reports his political stance against Jamaat-e-Islami, an attacker's claim that he was an 'enemy of Islam', and an Islamist leader's criticism of him — opponents' labels and politics, not attestations of his affiliation."
