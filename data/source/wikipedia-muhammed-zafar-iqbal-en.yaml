summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد ظفر إقبال؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 23 ديسمبر 1952 في سيلهيت، وتعليمه في جامعة دكا وجامعة واشنطن ⁦(دكتوراه 1982)⁩، وعمله في معهد كاليفورنيا للتكنولوجيا وبيلكور، وعودته إلى بنغلاديش أستاذًا في جامعة شاه جلال للعلوم والتكنولوجيا، وريادته للخيال العلمي بالبنغالية، ونجاته من محاولة اغتيال سنة 2018. لا تذكر المقالة أي دين له."
  en: "English Wikipedia article on Muhammed Zafar Iqbal; used for entity facts only. It gives his birth on 23 December 1952 at Sylhet, his education at the University of Dhaka and the University of Washington (PhD 1982), his work at Caltech and Bellcore, his return to Bangladesh as a professor at Shahjalal University of Science and Technology, his pioneering of Bengali science fiction, and his survival of a 2018 stabbing attack. The article names no religion for him."
  es: "Artículo de la Wikipedia en inglés sobre Muhammed Zafar Iqbal; utilizado únicamente para datos biográficos. Menciona su nacimiento el 23 de diciembre de 1952 en Sylhet, su formación académica en la Universidad de Dhaka y la Universidad de Washington (doctorado en 1982), su trabajo en Caltech y Bellcore, su regreso a Bangladesh como profesor en la Universidad de Ciencia y Tecnología de Shahjalal, su papel pionero en la ciencia ficción bengalí y su supervivencia a un apuñalamiento en 2018. El artículo no especifica su religión."
  fr: "Article de Wikipédia en anglais sur Muhammed Zafar Iqbal; utilisé uniquement à des fins documentaires. On y apprend sa naissance le 23 décembre 1952 à Sylhet, ses études à l’Université de Dhaka et à l’Université de Washington (doctorat en 1982), ses travaux au Caltech et chez Bellcore, son retour au Bangladesh en tant que professeur à l’Université des sciences et technologies Shahjalal, son rôle de pionnier dans la science-fiction bengalie et sa survie à une agression au couteau en 2018. L’article ne mentionne pas sa religion."
  ur: "محمد ظفر اقبال پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 23 دسمبر 1952 کو سلہٹ میں ان کی پیدائش، ڈھاکہ یونیورسٹی اور یونیورسٹی آف واشنگٹن میں ان کی تعلیم ⁦(پی ایچ ڈی 1982)⁩، کالٹیک اور بیل کور میں ان کا کام، شاہ جلال یونیورسٹی آف سائنس اینڈ ٹیکنالوجی میں بطور پروفیسر بنگلہ دیش واپسی، بنگالی سائنس فکشن کی ان کی پیش قدمی، اور 1200 کے حملے میں ان کا زندہ بچ جانا۔ مضمون میں اس کے لیے کسی مذہب کا نام نہیں ہے۔"
