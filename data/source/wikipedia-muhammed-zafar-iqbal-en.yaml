summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد ظفر إقبال؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 23 ديسمبر 1952 في سيلهيت، وتعليمه في جامعة دكا وجامعة واشنطن (دكتوراه 1982)، وعمله في معهد كاليفورنيا للتكنولوجيا وبيلكور، وعودته إلى بنغلاديش أستاذًا في جامعة شاه جلال للعلوم والتكنولوجيا، وريادته للخيال العلمي بالبنغالية، ونجاته من محاولة اغتيال سنة 2018. لا تذكر المقالة أي دين له."
  en: "English Wikipedia article on Muhammed Zafar Iqbal; used for entity facts only. It gives his birth on 23 December 1952 at Sylhet, his education at the University of Dhaka and the University of Washington (PhD 1982), his work at Caltech and Bellcore, his return to Bangladesh as a professor at Shahjalal University of Science and Technology, his pioneering of Bengali science fiction, and his survival of a 2018 stabbing attack. The article names no religion for him."
