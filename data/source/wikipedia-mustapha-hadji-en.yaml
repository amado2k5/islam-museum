  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى حجي؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في إفران الأطلس الصغير سنة 1971 وهجرته إلى فرنسا طفلاً، ومسيرته عبر نانسي وسبورتينغ وديبورتيفو وكوفنتري وأستون فيلا وغيرها، وجائزة أفضل لاعب أفريقي 1998، وعمله مساعداً لمدرب المغرب."
  en: "English Wikipedia article on Mustapha Hadji; used for entity facts only. It recounts his birth in Ifrane Atlas-Saghir in 1971 and childhood emigration to France, his career through Nancy, Sporting CP, Deportivo, Coventry City, Aston Villa and others, the 1998 African Footballer of the Year award, and his work as Morocco assistant coach."
