summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى حجي؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في إفران الأطلس الصغير سنة 1971 وهجرته إلى فرنسا طفلاً، ومسيرته عبر نانسي وسبورتينغ وديبورتيفو وكوفنتري وأستون فيلا وغيرها، وجائزة أفضل لاعب أفريقي 1998، وعمله مساعداً لمدرب المغرب."
  en: "English Wikipedia article on Mustapha Hadji; used for entity facts only. It recounts his birth in Ifrane Atlas-Saghir in 1971 and childhood emigration to France, his career through Nancy, Sporting CP, Deportivo, Coventry City, Aston Villa and others, the 1998 African Footballer of the Year award, and his work as Morocco assistant coach."
  es: "Artículo de la Wikipedia en inglés sobre Mustapha Hadji; utilizado únicamente para obtener información sobre la persona. Relata su nacimiento en Ifrane Atlas-Saghir en 1971 y su emigración a Francia durante su infancia, su trayectoria profesional en equipos como Nancy, Sporting CP, Deportivo, Coventry City, Aston Villa y otros, el premio al Futbolista Africano del Año en 1998 y su labor como segundo entrenador de Marruecos."
  fr: "Article Wikipédia en anglais sur Mustapha Hadji; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Ifrane Atlas-Saghir en 1971 et son émigration en France durant son enfance, sa carrière à Nancy, au Sporting CP, au Deportivo, à Coventry City, à Aston Villa et dans d'autres clubs, son titre de Joueur africain de l'année 1998 et son poste d'entraîneur adjoint du Maroc."
