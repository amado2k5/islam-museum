summary:
  ar: "سيرة القارئ أحمد النفيس في بودكاست قرآن سنترال؛ تصفه بقارئ كويتي وإمام المسجد الكبير بدولة الكويت، وتذكر تخرجه في أصول الفقه وإجازاته في روايتي حفص وشعبة عن عاصم وشيخيه."
  en: "The Quran Central podcast biography of the reciter Ahmad Alnufais, describing him as a Kuwaiti reciter and imam of the Grand Mosque of Kuwait, and recording his graduation in usul al-fiqh, his ijazas in the Hafs and Shu'ba 'an 'Asim narrations, and his teachers."
  es: "El podcast de Quran Central presenta la biografía del recitador Ahmad Alnufais, describiéndolo como un recitador kuwaití e imán de la Gran Mezquita de Kuwait, y registrando su graduación en usul al-fiqh, sus ijazas en las narraciones de Hafs y Shu'ba 'an 'Asim, y sus maestros."
  fr: "Le podcast Quran Central présente la biographie du récitant Ahmad Alnufais, le décrivant comme un récitant koweïtien et imam de la Grande Mosquée du Koweït, et relate sa remise de diplôme en usul al-fiqh, ses ijazas dans les narrations de Hafs et Shu'ba 'an 'Asim, ainsi que ses enseignants."
  ur: "قاری احمد النفیس کی قرآن سنٹرل پوڈ کاسٹ سوانح عمری، جس میں انہیں کویتی قاری اور کویت کی عظیم الشان مسجد کے امام کے طور پر بیان کیا گیا ہے، اور اصول الفقہ میں ان کی گریجویشن، حفص اور شعبع عن عاصم کی روایات میں ان کے اعجاز اور اس کے اساتذہ کو ریکارڈ کیا گیا ہے۔"
