  ar: "مقالة ويكيبيديا العربية عن آدم عبد الله عثمان؛ تُستخدم لوقائع الكيان فقط. تروي رئاسته الأولى للصومال ورئاسته الجمعية التشريعية، وتترك خانة الدين في صندوقها فارغة، وتخالف المقالات الأخرى في نهايته فترة رئاسته (10 يونيو 1967) وتاريخ وفاته (28 يونيو 2007)."
  en: "Arabic Wikipedia article on Aden Abdulle Osman; used for entity facts only. It recounts his first presidency of Somalia and his speakership of the Legislative Assembly; its infobox's religion field is empty. It differs from the other articles on his term's end (10 June 1967) and his death date (28 June 2007) — variants recorded in the record, not followed."
