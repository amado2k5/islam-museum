summary:
  ar: "مقالة ويكيبيديا العربية عن عمر يارادوا؛ تُستخدم لوقائع الكيان فقط. تروي عمله معلّما ومحاضرا في كليات كاتسينا وزاريا أواخر السبعينيات حتى 1983 ثم عمله في الشركات، وتصنّفه في مواليد 1370 هـ ووفيات 1431 هـ وضمن «مسلمون نيجيريون»."
  en: "Arabic Wikipedia article on Umaru Yar'Adua; used for entity facts only. It recounts his work as a teacher and lecturer in colleges in Katsina and Zaria in the late 1970s to 1983 and his move into business, and files him under births of 1370 AH, deaths of 1431 AH and 'Nigerian Muslims'."
  es: "Artículo de Wikipedia en árabe sobre Umaru Yar'Adua; utilizado únicamente para datos sobre la persona. Relata su labor como profesor y conferenciante en colegios de Katsina y Zaria desde finales de la década de 1970 hasta 1983, su incursión en el mundo empresarial y lo clasifica entre los nacidos en 1370 AH, fallecidos en 1431 AH y pertenecientes a la comunidad musulmana nigeriana."
  fr: "Article de Wikipédia en arabe sur Umaru Yar'Adua; utilisé uniquement à des fins d'information sur la personne. Il relate son parcours d'enseignant et de conférencier dans des établissements d'enseignement supérieur à Katsina et Zaria de la fin des années 1970 à 1983, ainsi que son entrée dans le monde des affaires. Il est répertorié dans les catégories « Naissances en 1370 AH », « Décès en 1431 AH » et « Musulmans nigérians »."
