summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن السياسي الفلبيني أحمد دوموكاو ألونتو (1914–2002): مولده في ديتسان-رامين، ودراسته في جامعة الفلبين، ونيابته (1953) وعضويته في مجلس الشيوخ (1955–1961)، وتأسيسه جامعة مينداناو الإسلامية (1954)، وقوانينه لإنشاء جامعة ولاية مينداناو ولجنة التكامل الوطني، ومشاركته في مؤتمر باندونغ، وتأسيسه أنصار الإسلام (1968)، ومشاركته في لجنة دستور 1986، وجائزة الملك فيصل (1988)، ووفاته في ماراوي في 11 ديسمبر 2002."
  en: "English Wikipedia article on the Filipino politician Ahmad Domocao Alonto (1914–2002): birth in Ditsaan-Ramain, study at the University of the Philippines, House (1953) and Senate (1955–1961) terms, founding of the Mindanao Islamic University (1954), the laws creating Mindanao State University and the Commission on National Integration, the Bandung Conference, founding of Ansar El Islam (1968), the 1986 Constitutional Commission, the King Faisal Prize (1988), and death in Marawi on 11 December 2002."
