  ar: "مقالة ويكيبيديا الإنجليزية عن أصغر غوندوي؛ تُستخدم لوقائع الكيان فقط. تذكر أنه شاعر أردي وُلد سنة 1884 في غوراخبور، وأنه حرّر مجلة «هندوستاني» سنوات، وأنه توفي بالشلل سنة 1936 في الله آباد. لا تسمّي مذهبا ولا طريقة."
  en: "English Wikipedia article on Asghar Gondvi; used for entity facts only. It gives him as an Urdu poet born in 1884 at Gorakhpur, editor of the magazine Hindustani for many years, who died of paralysis in 1936 at Allahabad. It names no school and no order."
