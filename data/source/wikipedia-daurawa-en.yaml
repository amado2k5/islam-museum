reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives him as born on 1 January 1969 at Mazugal, Dala, Kano State, birth name Muhammad Aminu Ibrahim, son of Sheikh Ibrahim Muhammad Mai Tafsiri, who is also named among his teachers; enrolled at Bayero University Kano in 2004 for mass communication without graduating, then at a Benin university's Kano branch, also unfinished; founder of the Hisbah Corps in Kano and its commander 2015–2019 (he resigned in May 2019) and again from 2023, appointed by Governor Abba Kabir Yusuf. Its text states personally that he 'is under the First Aid Group of Jama'atu Izalatil Bidi'a Wa'ikamatis Sunnah known as Izala' — a movement affiliation, not a school. Its unreferenced infobox adds denomination Sunni, jurisprudence Maliki and movement Izala: one infobox family for the Sunni and Maliki values."
