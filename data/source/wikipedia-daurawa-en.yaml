  ar: "مقالة ويكيبيديا الإنجليزية عن أمينو إبراهيم دوراوا؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في كانو في 1 يناير 1969، ودراسته غير المكتملة في جامعة بايرو، وتأسيسه هيئة الحسبة في كانو وقيادته لها 2015–2019 ثم من 2023، وانتماءه النصي إلى جماعة إزالة البدعة (إزالة)."
