summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أمينو إبراهيم دوراوا؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في كانو في 1 يناير 1969، ودراسته غير المكتملة في جامعة بايرو، وتأسيسه هيئة الحسبة في كانو وقيادته لها 2015–2019 ثم من 2023، وانتماءه النصي إلى جماعة إزالة البدعة ⁦(إزالة)⁩."
  en: "English Wikipedia article on Aminu Ibrahim Daurawa; used for entity facts only. It gives his birth at Kano on 1 January 1969, his unfinished studies at Bayero University, his founding of the Kano Hisbah Corps and his command of it in 2015–2019 and again from 2023, and his textual placing under the Izala movement."
  es: "Artículo de la Wikipedia en inglés sobre Aminu Ibrahim Daurawa; utilizado únicamente para datos sobre la persona. En él se indica su nacimiento en Kano el 1 de enero de 1969, sus estudios inconclusos en la Universidad Bayero, la fundación del Cuerpo Hisbah de Kano y su mando entre 2015 y 2019, y nuevamente a partir de 2023, así como su ubicación textual dentro del movimiento Izala."
  fr: "Article de Wikipédia en anglais sur Aminu Ibrahim Daurawa; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance à Kano le 1er janvier 1969, ses études inachevées à l’université Bayero, la fondation du corps Hisbah de Kano et son commandement de 2015 à 2019 puis à nouveau à partir de 2023, ainsi que son appartenance textuelle au mouvement Izala."
  ur: "امینو ابراہیم دوروا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1 جنوری 1969 کو کانو میں اس کی پیدائش، بایرو یونیورسٹی میں اس کی نامکمل تعلیم، اس کی کانو حسبہ کور کی بنیاد اور 2015-2019 میں اور پھر 2023 سے اس کی کمانڈ، اور ایزالا تحریک کے تحت اس کی متنی جگہ۔"
  tr: "Aminu Ibrahim Dorawa hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1 Ocak 1969'da Kano'da doğmuş, Bayero Üniversitesi'ndeki tamamlanmamış eğitimi, 2015-2019 ve 2023 yılları arasında Kano'da Hisbah Komisyonu'nu kurup yönettiği ve 'Izalah' (Yeniliğin Ortadan Kaldırılması) grubuyla metinsel bağlantısı olarak anılmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Aminu Ibrahim Dorawa; digunakan hanya untuk fakta entitas. Ia disebutkan lahir di Kano pada 1 Januari 1969, studi yang belum selesai di Universitas Bayero, pendirian dan kepemimpinan Komisi Hisbah di Kano dari 2015 hingga 2019, dan kemudian dari 2023, serta afiliasi tekstual dengan kelompok 'Izalah' (Penghapusan Inovasi)."
