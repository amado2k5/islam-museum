summary:
  ar: "سيرة ميرزا حسين خان سپهسالار (1828–1881): سفارته في إسطنبول وصدارته العظمى 1871–1873 وامتياز رويتر، وولادته في قزوين ووفاته في مشهد. لا يذكر المقال ولا صندوقه شيئًا عن دينه."
  en: "Biography of Mirza Hosein Khan Sepahsalar (1828-1881): ambassador to Istanbul, Grand Vizier 1871-1873, the Reuter concession, born at Qazvin and died at Mashhad. Neither the text nor the infobox makes any statement of his religion."
  es: "Biografía de Mirza Hosein Khan Sepahsalar (1828-1881): embajador en Estambul, Gran Visir de 1871 a 1873, concesionario de Reuter, nacido en Qazvin y fallecido en Mashhad. Ni el texto ni el recuadro informativo mencionan su religión."
  fr: "Biographie de Mirza Hosein Khan Sepahsalar (1828-1881): ambassadeur à Istanbul, grand vizir de 1871 à 1873, concessionnaire de Reuter, né à Qazvin et mort à Mashhad. Ni le texte ni l’encadré ne mentionnent sa religion."
  ur: "مرزا حسین خان سپاہ سالار کی سوانح عمری (1828-1881): استنبول میں سفیر، گرینڈ وزیر 1871-1873، رائٹر کنسیشن، قزوین میں پیدا ہوئے اور مشہد میں انتقال کر گئے۔ نہ متن اور نہ ہی انفو باکس اس کے مذہب کا کوئی بیان دیتا ہے۔"
  tr: "Mirza Hüseyin Han Sepahsalar'ın (1828–1881) biyografisi: İstanbul'daki büyükelçiliği, 1871–1873 yılları arasında Büyük Başrahipliği, Reuters Ayrıcalığı, Kazvin'deki doğumu ve Meşhed'deki ölümü. Ne makale ne de kutusunda diniyle ilgili hiçbir şey belirtilmemektedir."
  id: "Biografi Mirza Hossein Khan Sepahsalar (1828–1881): Kedutaannya di Istanbul, Grand Primeship 1871–1873, Reuters Privilege, kelahirannya di Qazvin, dan kematiannya di Mashhad. Baik artikel maupun kotaknya tidak menyebutkan apa pun tentang agamanya."
