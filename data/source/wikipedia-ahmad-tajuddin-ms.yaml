summary:
  ar: "مقالة ويكيبيديا الملايوية عن السلطان أحمد تاج الدين أكحاظ الخير والدين؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 22 آب 1913 في إستانا بيكان ببندر بروناي، ووفاته في 4 حزيران 1950 في مستشفى سنغافورة العام، ودفنه في القبة الملكية في 5 حزيران 1950؛ ومربع معلوماتها يعطي دينه الإسلام إجمالًا."
  en: "Malay Wikipedia article on Sultan Ahmad Tajuddin Akhazul Khairi Waddien; used for entity facts only. It gives his birth as 22 August 1913 at Istana Pekan, Bandar Brunei, his death as 4 June 1950 at the Singapore General Hospital, and his burial at the Royal Mausoleum on 5 June 1950; its infobox gives his religion as Islam in general."
  es: "Artículo de Wikipedia en malayo sobre el sultán Ahmad Tajuddin Akhazul Khairi Waddien; utilizado únicamente para datos sobre la persona. Indica que nació el 22 de agosto de 1913 en Istana Pekan, Bandar Brunei, falleció el 4 de junio de 1950 en el Hospital General de Singapur y fue enterrado en el Mausoleo Real el 5 de junio de 1950; su ficha informativa señala que profesaba el islam en general."
  fr: "Article de Wikipédia en malais sur le sultan Ahmad Tajuddin Akhazul Khairi Waddien; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 22 août 1913 à l’Istana Pekan, à Bandar Brunei, son décès le 4 juin 1950 à l’hôpital général de Singapour et son inhumation au mausolée royal le 5 juin 1950; son infobox précise qu’il était de confession musulmane."
  ur: "سلطان احمد تاج الدین اخز الخیری وادین پر مالے ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 22 اگست 1913 کو استانا پیکان، بندر برونائی میں ان کی پیدائش، 4 جون 1950 کو سنگاپور جنرل ہسپتال میں ان کی موت، اور 5 جون 1950 کو شاہی مقبرے میں ان کی تدفین؛ اس کا انفو باکس اس کا مذہب عام طور پر اسلام کے طور پر دیتا ہے۔"
  tr: "Sultan Ahmad Taceddin Akhaz al-Khair wal-Din hakkında Malay Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 22 Ağustos 1913'te Istana Bekan, Bandar Brunei'de doğduğunu, 4 Haziran 1950'de Singapur Genel Hastanesi'nde vefat ettiğini ve 5 Haziran 1950'de Kraliyet Kubbesi'ne defnedilmesini anlatır; bilgi kutusunda genel olarak İslam dinini verir."
  id: "Artikel Wikipedia Bahasa Melayu tentang Sultan Ahmad Taj al-Din Akhaz al-Khair wal-Din; digunakan hanya untuk fakta entitas. Artikel ini menyebutkan kelahirannya pada 22 Agustus 1913 di Istana Bekan, Bandar Brunei, kematiannya pada 4 Juni 1950 di Rumah Sakit Umum Singapura, dan pemakamannya di Kubah Kerajaan pada 5 Juni 1950; infobox tersebut mencantumkan agamanya tentang Islam secara umum."
