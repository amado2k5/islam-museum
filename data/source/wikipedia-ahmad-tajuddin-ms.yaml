  ar: "مقالة ويكيبيديا الملايوية عن السلطان أحمد تاج الدين أكحاظ الخير والدين؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 22 آب 1913 في إستانا بيكان ببندر بروناي، ووفاته في 4 حزيران 1950 في مستشفى سنغافورة العام، ودفنه في القبة الملكية في 5 حزيران 1950؛ ومربع معلوماتها يعطي دينه الإسلام إجمالًا."
  en: "Malay Wikipedia article on Sultan Ahmad Tajuddin Akhazul Khairi Waddien; used for entity facts only. It gives his birth as 22 August 1913 at Istana Pekan, Bandar Brunei, his death as 4 June 1950 at the Singapore General Hospital, and his burial at the Royal Mausoleum on 5 June 1950; its infobox gives his religion as Islam in general."
