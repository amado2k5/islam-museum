reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 27 October 2026 at the recorded revision, fetched by its revision id with the returned id asserted equal. It names his father Muhammad Jamalul Alam II as both predecessor and father, and his brother Omar Ali Saifuddien III as successor; it dates his accession to 11 September 1924, his installation to 19 September 1931 and his coronation to 17 March 1940, and records that under the Japanese occupation his authority was limited to Bruneian custom and Islamic affairs. Its infobox religion field gives Islam in general, with no school."
