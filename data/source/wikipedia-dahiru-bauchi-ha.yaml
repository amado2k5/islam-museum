summary:
  ar: "مقالة ويكيبيديا الهوسية عن الشيخ طاهر عثمان باوتشي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه متبع لطريقة التيجانية ومن قادة الحركة الصوفية في نيجيريا، وتذكر ولادته في 28 يونيو 1927 ووفاته في 26 نوفمبر 2025."
  en: "Hausa Wikipedia article on Sheikh Dahiru Usman Bauchi; used for entity facts only. It describes him as a follower of the Tijaniyya tariqa and one of the leaders of the Sufi movement in Nigeria, and gives his birth on 28 June 1927 and his death on 26 November 2025."
  es: "Artículo de Wikipedia en hausa sobre el jeque Dahiru Usman Bauchi; utilizado únicamente para obtener información sobre la persona. Lo describe como seguidor de la tariqa Tijaniyya y uno de los líderes del movimiento sufí en Nigeria, e indica que nació el 28 de junio de 1927 y falleció el 26 de noviembre de 2025."
  fr: "Article Wikipédia en langue haoussa sur le cheikh Dahiru Usman Bauchi; utilisé uniquement à des fins d’information sur l’entité. Il le décrit comme un adepte de la confrérie Tijaniyya et l’un des chefs du mouvement soufi au Nigeria, et indique sa date de naissance: le 28 juin 1927; sa date de décès: le 26 novembre 2025."
  ur: "شیخ داہیرو عثمان باؤچی پر ہاؤسا ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے تیجانیہ طریقہ کے پیروکار اور نائیجیریا میں صوفی تحریک کے رہنماؤں میں سے ایک کے طور پر بیان کیا گیا ہے، اور اس کی پیدائش 28 جون 1927 کو ہوئی اور اس کی موت 26 نومبر 2025 کو ہوئی۔"
  tr: "Hussain hakkında Şeyh Tahir Osman Bauçi hakkında Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Onu Tijaniyya tarikatının bir takipçisi ve Nijerya'daki Sufi hareketinin liderlerinden biri olarak tanımlar, doğumunun 28 Haziran 1927'de ve 26 Kasım 2025'teki ölümünden bahsedilir."
  id: "Artikel Wikipedia tentang Hussain tentang Sheikh Tahir Osman Bauchi; hanya digunakan untuk fakta entitas. Artikel tersebut menggambarkan dia sebagai pengikut tarekat Tijaniyya dan salah satu pemimpin gerakan Sufi di Nigeria, menyebutkan kelahirannya pada 28 Juni 1927 dan kematiannya pada 26 November 2025."
