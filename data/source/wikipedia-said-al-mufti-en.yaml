reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full at revision 1347337109 on 25 October 2026. The article is short: it gives his birth as 26 June 1898 and his death as 25 March 1989, his Circassian origin, his three terms as the ninth Prime Minister of Jordan (14 April 1950 to 1 July 1956), his interior and finance ministerships, his two presidencies of the Senate (December 1956 to July 1963 and November 1965 to November 1974), and his Jabal Amman house. It gives no religion for him. Its birth day (26 June) differs from Wikidata's day-precision statement (28 June); the discrepancy is recorded in the person's born note, not merged."
