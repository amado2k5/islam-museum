  ar: "مقالة ويكيبيديا الإنجليزية عن سعيد المفتي (26 يونيو 1898 – 25 مارس 1989)، السياسي والدبلوماسي الأردني من أصل شركسي الذي ترأس حكومة الأردن ثلاث مرات بين 1950 و1956، وتولى الداخلية والمالية، وترأس مجلس الأعيان فترتين، وسُمّي شارع في السويفية باسمه."
  en: "English Wikipedia article on Sa'id al-Mufti (26 June 1898 – 25 March 1989), the Jordanian politician and diplomat of Circassian origin who served three terms as Prime Minister of Jordan between 1950 and 1956, held the interior and finance portfolios, presided over the Senate in two periods, and has a street in Amman's Sweifieh district named after him."
