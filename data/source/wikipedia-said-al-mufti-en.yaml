summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سعيد المفتي ⁦(26 يونيو 1898 – 25 مارس 1989)⁩، السياسي والدبلوماسي الأردني من أصل شركسي الذي ترأس حكومة الأردن ثلاث مرات بين 1950 و1956، وتولى الداخلية والمالية، وترأس مجلس الأعيان فترتين، وسُمّي شارع في السويفية باسمه."
  en: "English Wikipedia article on Sa'id al-Mufti (26 June 1898 – 25 March 1989), the Jordanian politician and diplomat of Circassian origin who served three terms as Prime Minister of Jordan between 1950 and 1956, held the interior and finance portfolios, presided over the Senate in two periods, and has a street in Amman's Sweifieh district named after him."
  es: "Artículo de la Wikipedia en inglés sobre Sa'id al-Mufti (26 de junio de 1898 - 25 de marzo de 1989), el político y diplomático jordano de origen circasiano que ocupó el cargo de Primer Ministro de Jordania durante tres mandatos entre 1950 y 1956, fue ministro del Interior y de Finanzas, presidió el Senado en dos ocasiones y tiene una calle en el distrito de Sweifieh de Amán que lleva su nombre."
  fr: "Article de Wikipédia en anglais sur Sa'id al-Mufti (26 juin 1898 – 25 mars 1989), homme politique et diplomate jordanien d'origine circassienne qui a été Premier ministre de Jordanie à trois reprises entre 1950 et 1956, a occupé les portefeuilles de l'intérieur et des finances, a présidé le Sénat à deux reprises et a une rue du quartier de Sweifieh à Amman qui porte son nom."
  ur: "سعید المفتی پر انگریزی ویکیپیڈیا کا مضمون ⁦(26 جون 1898 - 25 مارچ 1989)⁩، اردنی سیاست دان اور سرکاسیائی نژاد سفارت کار جنہوں نے 1950 اور 1956 کے درمیان اردن کے وزیر اعظم کے طور پر تین بار خدمات انجام دیں، داخلہ اور مالیات کے قلمدانوں پر فائز رہے، ایک سینیٹ اور سائیڈ مین کے دو عہدوں پر فائز رہے۔ ان کے نام پر ضلع سویفیہ رکھا گیا۔"
