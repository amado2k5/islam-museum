reliability_note: "Pointer for entity facts only. Read at the recorded revision and checked against it on 26 October 2026. Born 1881 at Jerusalem, died in April 1951 at the Augusta Victoria Hospital in East Jerusalem. An Istanbul engineering graduate and Jerusalem district engineer, Ottoman assembly member 1914-1918, mayor 1920-1935 in rivalry with the Husayni family, a founder of the Arab Higher Committee and leader of the National Defence Party. The article makes no statement of his religion."
