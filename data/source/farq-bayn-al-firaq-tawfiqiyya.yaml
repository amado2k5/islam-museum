  en: "Abd al-Qahir al-Baghdadi, al-Farq bayn al-Firaq, ed. Magdi Fathi al-Sayyid (al-Maktaba al-Tawfiqiyya, Cairo)"
  ur: "عبد القاہر بغدادی، الفرق بین الفرق، تحقیق مجدی فتحی السید ⁦(المکتبۃ التوفیقیہ، قاہرہ)⁩"
summary:
  ar: "طبعة المكتبة التوفيقية بالقاهرة من «الفرق بين الفرق» لأبي منصور عبد القاهر بن طاهر البغدادي الإسفراييني التميمي ⁦(ت 429هـ)⁩، دراسة وتحقيق مجدي فتحي السيد، بإشراف توفيق شعلان؛ نسخة ممسوحة من مكتبة الإسكندرية."
  en: "The al-Maktaba al-Tawfiqiyya (Cairo) edition of al-Farq bayn al-Firaq by Abd al-Qahir ibn Tahir al-Baghdadi al-Isfara'ini al-Tamimi (d. 429 AH), studied and edited by Magdi Fathi al-Sayyid under the supervision of Tawfiq Sha'lan; a scan from the Bibliotheca Alexandrina."
  ur: "عبد القاہر بن طاہر بغدادی اسفرائینی تمیمی ⁦(م 429ھ)⁩ کی «الفرق بین الفرق» کا المکتبۃ التوفیقیہ ⁦(قاہرہ)⁩ کا ایڈیشن، دراسہ و تحقیق مجدی فتحی السید، زیرِ نگرانی توفیق شعلان؛ مکتبہ اسکندریہ کا اسکین۔"
  es: "La edición al-Maktaba al-Tawfiqiyya (El Cairo) de al-Farq bayn al-Firaq de Abd al-Qahir ibn Tahir al-Baghdadi al-Isfara'ini al-Tamimi (m. 429 d. H.), estudiada y editada por Magdi Fathi al-Sayyid bajo la supervisión de Tawfiq Sha'lan; un escaneo de la Biblioteca de Alejandría."
  fr: "L'édition al-Maktaba al-Tawfiqiyya (Le Caire) d'al-Farq bayn al-Firaq par Abd al-Qahir ibn Tahir al-Baghdadi al-Isfara'ini al-Tamimi (mort en 429 AH), étudiée et éditée par Magdi Fathi al-Sayyid sous la direction de Tawfiq Sha'lan; un scan de la Bibliothèque d'Alexandrie."
  tr: "Kahire'deki El-Tavfiqiyya Kütüphanesi'nin \"El-Farq bayn el-Firaq\" adlı eserinden Ebu Mansur Abd al-Qahir ibn Tahir el-Bağdadi el-İsfarayini el-Tamimi (ö. 429 Hicri), Majdi Fathi al-Sayyid tarafından incelenip düzenlenmiş, Tevfik Şa'lan'ın denetiminde olup, Taramış bir kopya."
  id: "Edisi Perpustakaan Al-Tawfiqiyya di Kairo dari \"Al-Farq bayn al-Firaq\" oleh Abu Mansur Abd al-Qahir ibn Tahir al-Baghdadi al-Isfarayini al-Tamimi (wafat 429 H), yang dipelajari dan diedit oleh Majdi Fathi al-Sayyid, diawasi oleh Tawfiq Sha'lan; salinan hasil scan dari Bibliotheca Alexandrina."
