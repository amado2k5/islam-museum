summary:
  ar: "طبعة المكتبة التوفيقية بالقاهرة من «الفرق بين الفرق» لأبي منصور عبد القاهر بن طاهر البغدادي الإسفراييني التميمي ⁦(ت 429هـ)⁩، دراسة وتحقيق مجدي فتحي السيد، بإشراف توفيق شعلان؛ نسخة ممسوحة من مكتبة الإسكندرية."
  en: "The al-Maktaba al-Tawfiqiyya (Cairo) edition of al-Farq bayn al-Firaq by Abd al-Qahir ibn Tahir al-Baghdadi al-Isfara'ini al-Tamimi (d. 429 AH), studied and edited by Magdi Fathi al-Sayyid under the supervision of Tawfiq Sha'lan; a scan from the Bibliotheca Alexandrina."
  ur: "عبد القاہر بن طاہر بغدادی اسفرائینی تمیمی (م 429ھ) کی «الفرق بین الفرق» کا المکتبۃ التوفیقیہ (قاہرہ) کا ایڈیشن، دراسہ و تحقیق مجدی فتحی السید، زیرِ نگرانی توفیق شعلان؛ مکتبہ اسکندریہ کا اسکین۔"
