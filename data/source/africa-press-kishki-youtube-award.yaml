reliability_note: "Africa Press's Tanzania service, republishing Tanzanian press reporting; read in full on 4 November 2026. The page carries no visible publication date; its internal evidence (his Islamic centre 'established in March last year'; subscribers risen from 100,000 to 120,000 at the award announcement; more than eight million viewers thanked) places the report in 2021, and the access date therefore stands in the issued field. It names him in full — 'Sheikh Nurdeen Muhammad Al-Ahdal, popularly known as Kishki' — styles him an 'International Preacher of Islamic Religion', reports that Kishki Online TV was the first Islamic channel of its kind in Tanzania to receive a YouTube cash prize and Silver Award, and quotes Sheikh Abdillahi Massawe that Kishki began preaching in 1995, in mosques and then on cassette, VHS, VCD and DVD before moving online."
