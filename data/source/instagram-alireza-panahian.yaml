reliability_note: "His own account: a primary source for his self-presentation and a dated platform figure, not independent corroboration of biography. The profile was read directly on Instagram on 7 November 2026 and showed 1,352,604 followers and 45 following. This fresh on-platform read replaces the wave-194 harvest's Tier-2 figure of 1.5 million followers, taken from on-platform post metadata of January 2025. The hafi.pro tracker read on the same day gives a closely agreeing August 2026 total audience of 1,353,304 (see source/hafi-panahian-ir). No YouTube count is cited for him: his English YouTube channel was removed by YouTube in November 2025, per the harvest."
