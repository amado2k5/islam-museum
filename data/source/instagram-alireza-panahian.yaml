  ar: "حساب علي رضا بناهيان الرسمي على إنستغرام (@panahian_ir)؛ أظهر ملفه عند قراءته في 7 نوفمبر 2026 عدد 1,352,604 متابعين و45 حسابًا يتابعها، وهو حساب أعمال باسمه."
