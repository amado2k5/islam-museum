  ar: "مقالة ويكيبيديا الإنجليزية عن تيبو تيب؛ تُستخدم لوقائع الكيان فقط حيث تستشهد المقالة بمصدر. تؤرخ ميلاده بنحو 1832، ووفاته بالملاريا في مدينة زنجبار، وتفصّل حملاته في وسط أفريقيا وولايته على مقاطعة شلالات ستانلي سنة 1887 ومقتَل ابنه سيفو سنة 1893 وسيرته الذاتية الأولى بالسواحلية."
  en: "English Wikipedia article on Tippu Tip; used for entity facts only where the article cites a source. It dates his birth to about 1832 and his death from malaria at Stone Town, and details his Central African expeditions, his governorship of the Stanley Falls District in 1887, the killing of his son Sefu in 1893, and his Swahili autobiography."
