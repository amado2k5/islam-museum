reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. The article carries a banner (Wikipedia AI noticeboard, October 2026) warning that it may incorporate machine-generated text with fictitious references, so its long uncited campaign narratives are not relied on; the facts used are those carrying citations — to Hinde (1897), Brode (1907), Farrant (1975), Sheriff (1987), Bennett (1986) and Reid (2025) — covering his full name, his mother Bint Habib bin Bushir of a Muscat family, the nickname's two explanations, his early expeditions, Abdul Sheriff's count of seven plantations and 10,000 slaves by 1895, his meetings with Livingstone and Stanley, his claim to the Eastern Congo for Sultan Barghash (1884–1887), his acceptance on 24 February 1887 of the governorship of the Stanley Falls District, his son Sefu's defeat and death on 20 October 1893 in the Congo Arab War, his retirement to Zanzibar in 1891, and his autobiography, the first in Swahili, transcribed and translated by Heinrich Brode (English edition 1907). Conflicts: the lead and infobox date his birth to about 1832 while Wikidata, the Arabic and Urdu articles and Britannica give 1837; the body, following Brode, dates his death to 13 June 1905 while the infobox gives 14 June. Both conflicts are recorded in the person record. It names no religion or school for him. Read in full on 24 October 2026."
