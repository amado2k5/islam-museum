summary:
  ar: "مقالة ويكيبيديا الأردية عن مولوي عبد الحق؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في سراوان قرب هابور سنة 1870 وتروي أن أسلافه كانوا من كائست هابور الهندوس الذين أسلموا في العهد المغولي — تاريخ أسرة، لا إثباتا لمذهب."
  en: "Urdu Wikipedia article on Maulvi Abdul Haq; used for entity facts only. It places his 1870 birth at Sarawan near Hapur and records that his ancestors were Hindu Kayasths of Hapur who converted to Islam in the Mughal era — family history, not a school attestation."
  es: "Artículo de Wikipedia en urdu sobre Maulvi Abdul Haq; se utiliza únicamente para obtener información sobre la persona. En él se indica que nació en 1870 en Sarawan, cerca de Hapur, y se menciona que sus antepasados eran hindúes Kayasth de Hapur que se convirtieron al islam durante la época mogol; se trata de historia familiar, no de una certificación escolar."
  fr: "Article de Wikipédia en ourdou sur Maulvi Abdul Haq; utilisé uniquement à titre informatif. Il situe sa naissance en 1870 à Sarawan, près d’Hapur, et indique que ses ancêtres étaient des Kayasths hindous d’Hapur convertis à l’islam à l’époque moghole – récit familial, et non une attestation scolaire."
  ur: "مولوی عبدالحق پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی 1870 کی پیدائش ہاپوڑ کے قریب سراوان میں ہوتی ہے اور یہ ریکارڈ کرتا ہے کہ ان کے آباؤ اجداد ہاپوڑ کے ہندو کیاستھ تھے جنہوں نے مغل دور میں اسلام قبول کیا - خاندانی تاریخ، اسکول کی تصدیق نہیں۔"
