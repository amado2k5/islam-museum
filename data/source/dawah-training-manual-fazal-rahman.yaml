summary:
  ar: "النص الكامل لدليل تدريب الدعوة للدكتور فضل الرحمن محفوظًا في أرشيف الإنترنت؛ دليل عملي في حوار غير المسلمين ومنهج الدعوة، وتختم صفحته الأخيرة بدعوة القارئ إلى زيارة موقع «دعوة سهلة» (DawahIsEasy.com) موقّعة باسم الدكتور فضل الرحمن مع بريده للمراسلة."
  en: "The full text of Dr Fazal Rahman's Dawah Training manual, preserved on the Internet Archive; a practical manual on dialogue with non-Muslims and dawah method. Its closing page directs the reader to the website DawahIsEasy.com and is signed 'Dr. Fazal Rahman', with his contact email."
  es: "El texto completo del manual de capacitación en Dawah del Dr. Fazal Rahman, conservado en Internet Archive, es un manual práctico sobre el diálogo con personas no musulmanas y el método Dawah. Su última página remite al lector al sitio web DawahIsEasy.com y está firmada por el Dr. Fazal Rahman, con su correo electrónico de contacto."
  fr: "Le texte intégral du manuel de formation à la da'wa du Dr Fazal Rahman, conservé sur Internet Archive, est disponible. Ce manuel pratique porte sur le dialogue avec les non-musulmans et la méthode de la da'wa. Sa dernière page renvoie le lecteur au site web DawahIsEasy.com et est signée « Dr Fazal Rahman », avec son adresse électronique."
  ur: "انٹرنیٹ آرکائیو میں محفوظ ڈاکٹر فضل الرحمان کے دعوۃ ٹریننگ مینوئل کا مکمل متن؛ غیر مسلموں کے ساتھ مکالمے اور دعوتی طریقہ سے متعلق ایک عملی کتابچہ۔ اس کا اختتامی صفحہ قارئین کو DawahIsEasy.com ویب سائٹ کی طرف لے جاتا ہے اور اس پر دستخط شدہ 'ڈاکٹر۔ فضل رحمان، اپنے رابطہ ای میل کے ساتھ۔"
