summary:
  ar: "صفحة من موقع إسلام كيو إيه (islamqa.org) تعيد نشر إجابة فقهية لنائلة أكبارالي جُمعت من موقع مسلمة كوتشينغ، وتذيّلها بسيرة تقول إن الموقع أسسته الأستاذة نائلة أكبارالي، وأنها درست الفقه الحنفي في سوريا نحو ست سنوات وفي الأردن مع فراز رباني، والعقيدة مع حمزة كرملي."
  en: "An IslamQA (islamqa.org) page republishing a fiqh answer by Naielah Ackbarali collected from Muslimacoaching.com, footed with a contributor biography stating that the site was founded by Ustadha Naielah Ackbarali, that she studied Hanafi fiqh in Syria for about six years and in Jordan with Faraz Rabbani, and aqida with Hamza Karamali."
  es: "Una página de IslamQA (islamqa.org) que republica una respuesta de fiqh de Naielah Ackbarali recopilada de Muslimacoaching.com, acompañada de una biografía de la colaboradora que indica que el sitio fue fundado por la Ustadha Naielah Ackbarali, que estudió fiqh hanafi en Siria durante unos seis años y en Jordania con Faraz Rabbani, y aqida con Hamza Karamali."
  fr: "Une page IslamQA (islamqa.org) republiant une réponse de fiqh de Naielah Ackbarali recueillie sur Muslimacoaching.com, accompagnée d'une biographie de l'auteur indiquant que le site a été fondé par Ustadha Naielah Ackbarali, qu'elle a étudié le fiqh hanafite en Syrie pendant environ six ans et en Jordanie avec Faraz Rabbani, et l'aqida avec Hamza Karamali."
  ur: "IslamQA (islamqa.org) صفحہ مسلماکوچنگ ڈاٹ کام سے جمع کردہ نائلہ اکبرالی کے فقہ کے جواب کو دوبارہ شائع کرتا ہے، جس میں ایک تعاون کنندہ کی سوانح عمری ہے جس میں کہا گیا ہے کہ اس سائٹ کی بنیاد استادہ نائلہ اکبرالی نے رکھی تھی کہ اس نے شام میں تقریباً چھ سال تک حنفی فقہ کا مطالعہ کیا اور اردن میں، اور حمزہ کے ساتھ۔"
  tr: "IslamQA (islamqa.org) sayfasında, Naila Akbarali'nin Muslim Coaching web sitesinden derlenen bir fıkıh cevabını yeniden yayımlamış ve buna biyografi ekleyerek sitenin yaklaşık altı yıl Suriye'de Hanefi fıkıhı okumuş olan Profesör Naela Akbarali tarafından, Ürdün'de Faraz Rabbani ile ve İnanç Felsefesi Hamza Karmali ile kurulduğunu belirtmektedir."
  id: "Sebuah halaman dari IslamQA (islamqa.org) menerbitkan kembali jawaban yurisprudensi oleh Naila Akbarali yang dikumpulkan dari situs Muslim Coaching, disertai dengan biografi yang menyatakan bahwa situs tersebut didirikan oleh Profesor Naela Akbarali, yang mempelajari hukum Hanafi di Suriah selama sekitar enam tahun, di Yordania bersama Faraz Rabbani, dan seiring dengan Hamza Karmali."
title: "Naielah Ackbarali — IslamQA (Muslima Coaching answers)"
