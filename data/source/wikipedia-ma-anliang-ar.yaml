summary:
  ar: "مقالة ويكيبيديا العربية عن ما انليانغ؛ تُستخدم لوقائع الكيان فقط. تروي سيرته العسكرية من انشقاقه مع والده سنة 1872 إلى وفاته سنة 1918، ويضع صندوق معلوماتها ديانته «مسلم صوفي»، وهي ترجمة للمقالة الإنجليزية فتُحسب معها أسرة مصدرية واحدة."
  en: "Arabic Wikipedia article on Ma Anliang; used for entity facts only. It recounts his military career from the 1872 defection with his father to his death in 1918, and its infobox gives his religion as 'Sufi Muslim'; it is a translation of the English article and so one source family with it."
  es: "Artículo de Wikipedia en árabe sobre Ma Anliang; se utiliza únicamente para obtener información sobre la persona. Narra su carrera militar desde su deserción con su padre en 1872 hasta su muerte en 1918, y su ficha informativa indica que su religión era \"musulmán sufí\". Se trata de una traducción del artículo en inglés, por lo que es una fuente común."
  fr: "Article de Wikipédia en arabe sur Ma Anliang; utilisé uniquement pour les informations sur l'entité. Il relate sa carrière militaire, de sa défection avec son père en 1872 à sa mort en 1918, et son infobox indique qu'il était musulman soufi; il s'agit d'une traduction de l'article anglais et il fait donc partie de la même famille de sources."
  ur: "عربی ویکیپیڈیا مضمون ما انلیانگ پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1872 میں اپنے والد کے ساتھ انحراف سے لے کر 1918 میں ان کی موت تک ان کے فوجی کیریئر کا ذکر کرتا ہے، اور اس کا معلوماتی باکس اس کا مذہب بطور 'صوفی مسلمان' دیتا ہے۔ یہ انگریزی مضمون کا ترجمہ ہے اور اس کے ساتھ ایک ذریعہ خاندان۔"
  tr: "Ma Enliang hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. 1872'de babasıyla ayrılmasından 1918'deki ölümüne kadar olan askeri biyografisini anlatır ve bilgi kutusunda dini \"Müslüman Sufi\" olarak listelenir; bu, İngilizce makalenin çevirisi olup, tek bir kaynak ailesi olarak sayılır."
  id: "Artikel Wikipedia berbahasa Arab tentang Ma Enliang; hanya digunakan untuk fakta entitas. Artikel ini menceritakan biografi militernya dari perpisahan dengan ayahnya pada tahun 1872 hingga kematiannya pada tahun 1918, dan kotak infonya mencantumkan agamanya sebagai \"Muslim Sufi,\" yang merupakan terjemahan dari artikel bahasa Inggris, sehingga menghitungnya sebagai satu keluarga sumber."
