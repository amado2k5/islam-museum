summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميان أحمد يار خان دولتانة؛ تُستخدم لوقائع الكيان فقط. تروي أنه رئيس قبيلة دولتانة في لُدّن وسياسي بنجابي، وُلد في 13 نيسان 1896، وانتُخب لعضوية المجالس التشريعية في البنجاب ⁦(1921 و1926 و1930 و1937)⁩، وكان أمين حزب الاتحاد وسكرتيرًا برلمانيًا رئيسًا لحكومة البنجاب، وتوفي سنة 1940."
  en: "English Wikipedia article on Ahmad Yar Khan Daultana; used for entity facts only. It records the chief of the Daultanas of Luddan and a Punjabi politician, born on 13 April 1896, elected to the Punjab legislatures in 1921, 1926, 1930 and 1937, secretary of the Unionist Party and Chief Parliamentary Secretary of the Punjab government, who died in 1940."
  es: "Artículo de la Wikipedia en inglés sobre Ahmad Yar Khan Daultana; utilizado únicamente para datos sobre la entidad. En él se menciona al jefe de los Daultana de Luddan y político punjabí, nacido el 13 de abril de 1896, elegido para las legislaturas del Punjab en 1921, 1926, 1930 y 1937, secretario del Partido Unionista y secretario parlamentario principal del gobierno del Punjab, quien falleció en 1940."
  fr: "Article de Wikipédia en anglais sur Ahmad Yar Khan Daultana; utilisé uniquement à des fins d'information sur l'entité. Il retrace la vie du chef des Daultanas de Luddan et homme politique punjabi, né le 13 avril 1896, élu aux assemblées législatives du Pendjab en 1921, 1926, 1930 et 1937, secrétaire du Parti unioniste et secrétaire parlementaire en chef du gouvernement du Pendjab, décédé en 1940."
  ur: "احمد یار خان دولتانہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں لڈن کے دولتانہ کے سربراہ اور ایک پنجابی سیاست دان کا ریکارڈ ہے، جو 13 اپریل 1896 کو پیدا ہوا، 1921، 1926، 1930 اور 1937 میں پنجاب اسمبلی کے لیے منتخب ہوا، یونینسٹ پارٹی کا سیکرٹری اور پنجاب حکومت کا چیف پارلیمانی سیکرٹری، جو 1940 میں انتقال کر گیا۔"
