  ar: "مقالة ويكيبيديا الإنجليزية عن ميان أحمد يار خان دولتانة؛ تُستخدم لوقائع الكيان فقط. تروي أنه رئيس قبيلة دولتانة في لُدّن وسياسي بنجابي، وُلد في 13 نيسان 1896، وانتُخب لعضوية المجالس التشريعية في البنجاب (1921 و1926 و1930 و1937)، وكان أمين حزب الاتحاد وسكرتيرًا برلمانيًا رئيسًا لحكومة البنجاب، وتوفي سنة 1940."
  en: "English Wikipedia article on Ahmad Yar Khan Daultana; used for entity facts only. It records the chief of the Daultanas of Luddan and a Punjabi politician, born on 13 April 1896, elected to the Punjab legislatures in 1921, 1926, 1930 and 1937, secretary of the Unionist Party and Chief Parliamentary Secretary of the Punjab government, who died in 1940."
