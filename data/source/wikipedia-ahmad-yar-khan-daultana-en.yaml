reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. Its biographical detail — birth at Luddan on 13 April 1896 to Mian Ghulam Kadir Khan, his father's death while performing Hajj, his wardship under the Court of Wards, his education and medals at Aitchison College and his year and nine months at Government College, Lahore, his elections of 1921 (unopposed, Western Multan Mohammadan constituency), 1926, 1930 (as a representative of the Punjab Mohammadan landholders) and 1937, his secretaryship of the Unionist Party and his office as Chief Parliamentary Secretary — rests on a 1937 Lahore biographical volume (His Imperial Majesty King George 5 and the Princes of India and the Indian Empire, Imperial Publishing Co., p. 372) and on Khosla's The States Estates and Who's Who in India and Burma (1942, p. 201). His death in 1940 is cited to Carter (2005) and Korson (1974); his appointment as CBE in the 1939 New Year Honours is cited to the London Gazette. The article names no religion or school for him: the word Mohammadan in his constituency names is a category of the colonial electoral rolls, and the Hajj mentioned is his father's."
