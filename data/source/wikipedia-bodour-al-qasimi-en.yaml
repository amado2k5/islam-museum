summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بدور بنت سلطان القاسمي، مؤسسة مجموعة كلمات ورئيسة الجامعة الأميركية في الشارقة؛ تذكر مولدها سنة 1978 في الشارقة من والدها حاكم الشارقة ووالدتها الشيخة جواهر بنت محمد القاسمي، وشهادتيها من كامبريدج وكلية لندن الجامعية، ورئاستها الاتحاد الدولي للناشرين في 2021–2022، وتعيينها سفيرة للنوايا الحسنة لدى اليونسكو سنة 2025."
  en: "English Wikipedia article on Bodour bint Sultan Al Qasimi, founder of Kalimat Group and president of the American University of Sharjah; it gives her birth in 1978 in Sharjah to the Ruler of Sharjah and Sheikha Jawaher bint Mohammed Al Qasimi, her Cambridge and UCL degrees, her presidency of the International Publishers Association in 2021–2022, and her 2025 appointment as a UNESCO Goodwill Ambassador."
  es: "Artículo de la Wikipedia en inglés sobre Bodour bint Sultan Al Qasimi, fundadora del Grupo Kalimat y presidenta de la Universidad Americana de Sharjah; en él se indica que nació en 1978 en Sharjah, hija del gobernante de Sharjah y la jequesa Jawaher bint Mohammed Al Qasimi, que obtuvo sus títulos en Cambridge y la UCL, que presidió la Asociación Internacional de Editores entre 2021 y 2022, y que fue nombrada Embajadora de Buena Voluntad de la UNESCO en 2025."
  fr: "L'article de Wikipédia en anglais sur Bodour bint Sultan Al Qasimi, fondatrice du groupe Kalimat et présidente de l'Université américaine de Sharjah, mentionne sa naissance en 1978 à Sharjah, fille du souverain de Sharjah et de la cheikha Jawaher bint Mohammed Al Qasimi, ses diplômes de Cambridge et de l'UCL, sa présidence de l'Association internationale des éditeurs en 2021-2022 et sa nomination en 2025 comme ambassadrice de bonne volonté de l'UNESCO."
  ur: "کلمت گروپ کے بانی اور امریکن یونیورسٹی آف شارجہ کے صدر بودور بنت سلطان القاسمی پر انگریزی ویکیپیڈیا کا مضمون؛ اس نے اسے 1978 میں شارجہ میں شارجہ کی حکمران اور شیخہ جواہر بنت محمد القاسمی کے ہاں جنم دیا، اس کی کیمبرج اور یو سی ایل کی ڈگریاں، 2021-2022 میں انٹرنیشنل پبلشرز ایسوسی ایشن کی اس کی صدارت اور 2025 میں یونیسکو کی خیر سگالی سفیر کے طور پر تقرری۔"
  tr: "Kalimat Grubu'nun kurucusu ve Amerikan Sharjah Üniversitesi Başkanı Badour bint Sultan Al Qasimi hakkında İngilizce Wikipedia makalesi; 1978'de Sharjah'da babası Sharjah Hükümdarı ve annesi Sheikha Jawaher bint Mohammed Al Qasimi'nin doğumundan, Cambridge ve University College London'dan diplomalarından, 2021–2022 yıllarında Uluslararası Yayıncılar Birliği başkanlığından ve 2025'te UNESCO'ya İyi Niyet Büyükelçisi olarak atanmasından bahsediliyor."
  id: "Artikel Wikipedia berbahasa Inggris tentang Badour bint Sultan Al Qasimi, pendiri Kalimat Group dan Presiden American University of Sharjah; artikel tersebut menyebutkan kelahirannya pada tahun 1978 di Sharjah dari ayahnya, Penguasa Sharjah, dan ibunya, Sheikha Jawaher bint Mohammed Al Qasimi, gelar dari Cambridge dan University College London, kepresidenan International Publishers Association pada 2021–2022, serta pengangkatannya sebagai Duta Besar Goodwill untuk UNESCO pada 2025."
