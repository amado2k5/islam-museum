summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بدور بنت سلطان القاسمي، مؤسسة مجموعة كلمات ورئيسة الجامعة الأميركية في الشارقة؛ تذكر مولدها سنة 1978 في الشارقة من والدها حاكم الشارقة ووالدتها الشيخة جواهر بنت محمد القاسمي، وشهادتيها من كامبريدج وكلية لندن الجامعية، ورئاستها الاتحاد الدولي للناشرين في 2021–2022، وتعيينها سفيرة للنوايا الحسنة لدى اليونسكو سنة 2025."
  en: "English Wikipedia article on Bodour bint Sultan Al Qasimi, founder of Kalimat Group and president of the American University of Sharjah; it gives her birth in 1978 in Sharjah to the Ruler of Sharjah and Sheikha Jawaher bint Mohammed Al Qasimi, her Cambridge and UCL degrees, her presidency of the International Publishers Association in 2021–2022, and her 2025 appointment as a UNESCO Goodwill Ambassador."
