label:
  ar: "النويري، نهاية الأرب في فنون الأدب، السفر السادس ⁦(سلسلة تراثنا، المؤسسة المصرية العامة للتأليف والترجمة والطباعة والنشر، القاهرة)⁩"
  en: "al-Nuwayri, Nihayat al-Arab fi Funun al-Adab, vol. 6 (Turathuna series, al-Mu'assasa al-Misriyya al-Amma li-l-Ta'lif wa-l-Tarjama wa-l-Tiba'a wa-l-Nashr, Cairo)"
  ur: "نویری، نہایۃ الارب فی فنون الادب، جلد ششم ⁦(سلسلہ تراثنا، المؤسسۃ المصریۃ العامۃ للتالیف والترجمۃ والطباعۃ والنشر، قاہرہ)⁩"
summary:
  ar: "الجزء السادس من «نهاية الأرب» للنويري في سلسلة «تراثنا» عن وزارة الثقافة والإرشاد القومي بمصر، وفيه أبواب الإمامة وصفات الملك والمشورة والوزارة وقادة الجيوش والقضاء والولايات، ينقل فيها النويري كثيراً عن الماوردي."
  en: "Volume 6 of al-Nuwayri's Nihayat al-Arab in the Turathuna series of Egypt's Ministry of Culture and National Guidance, with chapters on the imamate, the king's qualities, counsel, the vizierate, army commanders, judgeship and offices, in which al-Nuwayri quotes al-Mawardi at length."
  ur: "نویری کی «نہایۃ الارب» کی چھٹی جلد، مصر کی وزارتِ ثقافت و ارشادِ قومی کے سلسلے «تراثنا» میں، جس میں امامت، بادشاہ کی صفات، مشورہ، وزارت، سپہ سالاروں، قضا اور ولایتوں کے ابواب ہیں، اور نویری ان میں ماوردی سے بکثرت نقل کرتے ہیں۔"
  es: "Volumen 6 de Nihayat al-Arab de al-Nuwayri, perteneciente a la serie Turathuna del Ministerio de Cultura y Orientación Nacional de Egipto, con capítulos sobre el imamato, las cualidades del rey, el consejo, el visirato, los comandantes del ejército, el poder judicial y los cargos públicos, en los que al-Nuwayri cita extensamente a al-Mawardi."
  fr: "Volume 6 de Nihayat al-Arab d'al-Nuwayri dans la série Turathuna du ministère égyptien de la Culture et de l'Orientation nationale, avec des chapitres sur l'imamat, les qualités du roi, le conseil, le vizirat, les commandants de l'armée, la justice et les offices, dans lequel al-Nuwayri cite longuement al-Mawardi."
  tr: "Al-Nuwairi'nin \"Arapların Sonu\" adlı serisinin altıncı bölümü, Mısır'daki Kültür ve Ulusal Rehberlik Bakanlığı hakkında olan \"Bizim Mirasımız\" serisinde İmamatlık, krallığın nitelikleri, danışma, bakanlık, askeri liderler, yargı ve vilayetler üzerine bölümler içerir. Al-Nuwairi Al-Mawardi'den kapsamlı alıntılar yapar."
  id: "Bagian keenam dari \"Akhir Orang Arab\" oleh Al-Nuwairi dalam seri \"Warisan Kita\" tentang Kementerian Kebudayaan dan Bimbingan Nasional di Mesir, yang mencakup bab tentang Imamat, atribut kerajaan, konsultasi, kementerian, pemimpin militer, peradilan, dan provinsi. Al-Nuwairi mengutip secara luas dari Al-Mawardi."
title: "نهاية الأرب في فنون الأدب، السفر السادس"
