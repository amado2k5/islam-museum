label:
  ar: "النويري، نهاية الأرب في فنون الأدب، السفر السادس (سلسلة تراثنا، المؤسسة المصرية العامة للتأليف والترجمة والطباعة والنشر، القاهرة)"
  en: "al-Nuwayri, Nihayat al-Arab fi Funun al-Adab, vol. 6 (Turathuna series, al-Mu'assasa al-Misriyya al-Amma li-l-Ta'lif wa-l-Tarjama wa-l-Tiba'a wa-l-Nashr, Cairo)"
  ur: "نویری، نہایۃ الارب فی فنون الادب، جلد ششم (سلسلہ تراثنا، المؤسسۃ المصریۃ العامۃ للتالیف والترجمۃ والطباعۃ والنشر، قاہرہ)"
summary:
  ar: "الجزء السادس من «نهاية الأرب» للنويري في سلسلة «تراثنا» عن وزارة الثقافة والإرشاد القومي بمصر، وفيه أبواب الإمامة وصفات الملك والمشورة والوزارة وقادة الجيوش والقضاء والولايات، ينقل فيها النويري كثيراً عن الماوردي."
  en: "Volume 6 of al-Nuwayri's Nihayat al-Arab in the Turathuna series of Egypt's Ministry of Culture and National Guidance, with chapters on the imamate, the king's qualities, counsel, the vizierate, army commanders, judgeship and offices, in which al-Nuwayri quotes al-Mawardi at length."
  ur: "نویری کی «نہایۃ الارب» کی چھٹی جلد، مصر کی وزارتِ ثقافت و ارشادِ قومی کے سلسلے «تراثنا» میں، جس میں امامت، بادشاہ کی صفات، مشورہ، وزارت، سپہ سالاروں، قضا اور ولایتوں کے ابواب ہیں، اور نویری ان میں ماوردی سے بکثرت نقل کرتے ہیں۔"
title: "نهاية الأرب في فنون الأدب، السفر السادس"
