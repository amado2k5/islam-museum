  ar: "مقالة ويكيبيديا الإنجليزية عن توقتوغول ساتيلغانوف (1864–1933)، الأقين القرغيزي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في كوشتشوسو في 25 أكتوبر 1864 ووفاته في 17 فبراير 1933 مستندة إلى دليل برادت والموسوعة السوفيتية الكبرى."
  en: "English Wikipedia article on Toktogul Satylganov (1864–1933), the Kyrgyz akyn; used for entity facts only. It gives his birth at Kushchusu on 25 October 1864 and his death on 17 February 1933, citing the Bradt guide to Kyrgyzstan and the Great Soviet Encyclopedia."
  es: "Artículo de la Wikipedia en inglés sobre Toktogul Satylganov (1864-1933), el akyn kirguís; utilizado únicamente para datos sobre la persona. Indica que nació en Kushchusu el 25 de octubre de 1864 y falleció el 17 de febrero de 1933, citando la guía Bradt de Kirguistán y la Gran Enciclopedia Soviética."
  fr: "L'article de Wikipédia en anglais sur Toktogul Satylganov (1864-1933), l'akyn kirghize, est utilisé uniquement à des fins d'information sur l'entité. Il indique sa naissance à Kushchusu le 25 octobre 1864 et sa mort le 17 février 1933, d'après le guide Bradt sur le Kirghizistan et la Grande Encyclopédie soviétique."
