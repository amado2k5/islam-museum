  ar: "مدخل «موسوعة الإسلام» لمؤسسة الشؤون الدينية التركية TDV عن الثعالبي، اطُّلع عليه في ٢٠ نوفمبر ٢٠٢٦؛ يُستخدم لوقائع الكيان: حياته وتأليف فقه اللغة."
  en: "The TDV İslâm Ansiklopedisi entry on al-Tha'alibi (Seâlibî) (online edition), read on 20 November 2026; used for entity facts: his life and the making of Fiqh al-lugha."
  es: "Entrada de la TDV İslâm Ansiklopedisi sobre al-Tha'alibi (Seâlibî) (edición en línea), consultada el 20 de noviembre de 2026; utilizada para datos de la entidad: su vida y la composición del Fiqh al-lugha."
  fr: "Article de la TDV İslâm Ansiklopedisi sur al-Tha'alibi (Seâlibî) (édition en ligne), consulté le 20 novembre 2026 ; utilisé pour les données de l'entité : sa vie et la composition du Fiqh al-lugha."
  ur: "TDV İslâm Ansiklopedisi ⁦(آن لائن ایڈیشن)⁩ میں al-Tha'alibi (Seâlibî) پر اندراج، 20 نومبر 2026 کو پڑھا؛ ہستی کے حقائق کے لیے استعمال: حالاتِ زندگی اور فقہ اللغہ کی تالیف."
  tr: "Türk Dini İşleri Vakfı (TDV) tarafından Al-Thaalibi hakkında 20 Kasım 2026 tarihinde erişilen \"İslam Ansiklopedisi\" girişi; varlığın olayları için kullanılmıştır: hayatı ve dil filolojisinin yazarlığı."
  id: "Entri untuk \"Ensiklopedia Islam\" oleh Yayasan Urusan Agama Turki (TDV) tentang Al-Thaalibi, diakses pada 20 November 2026; digunakan untuk peristiwa entitas: kehidupannya dan kepenulisan filologi bahasa."
title: "SEÂLİBÎ, Ebû Mansûr"
publisher: "TDV İslâm Ansiklopedisi (online edition, islamansiklopedisi.org.tr)"
