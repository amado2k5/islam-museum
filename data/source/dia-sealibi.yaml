reliability_note: "Read in the museum's session on 20 November 2026. It gives his birth in 350 (961) at Nishapur and his patron al-Mikali, who encouraged the writing of Fiqh al-lugha; says the work was first called Shams al-adab and had two parts, the first on synonyms and the second on style and the usage of the Arabs, and that the second part was taken from Ibn Faris's al-Sahibi fi fiqh al-lugha, after which al-Tha'alibi made the first part an independent book under the title Fiqh al-lugha. Used for entity facts only."
