summary:
  ar: "مقالة ويكيبيديا العربية عن باسيرو ديوماي فاي ⁦(ترد فيها كنية «بشير جوماي فاي»)⁩؛ تُستخدم لوقائع الكيان فقط. تروي انتخابه رئيسا للسنغال في 2024 وتنصيبه في 2 أبريل 2024، وتودعه في تصنيفي «مسلمون سنغاليون» و«مسلمون سنة سنغاليون» دون نص عن دينه."
  en: "Arabic Wikipedia article on Bassirou Diomaye Faye ⁦(rendering his name «بشير جوماي فاي»)⁩; used for entity facts only. It recounts his election as president of Senegal in 2024 and his inauguration on 2 April 2024, and files him under Senegalese Muslims and Senegalese Sunni Muslims, with no text on his religion."
  es: "Artículo de Wikipedia en árabe sobre Bassirou Diomaye Faye ⁦(que transcribe su nombre como «بشير جوماي فاي»)⁩; utilizado únicamente para datos sobre la persona. Relata su elección como presidente de Senegal en 2024 y su investidura el 2 de abril de 2024, y lo clasifica dentro de los musulmanes senegaleses y los musulmanes sunitas senegaleses, sin mencionar su religión."
  fr: "Article Wikipédia en arabe sur Bassirou Diomaye Faye ⁦(son nom est transcrit « بشير جوماي فاي »)⁩; utilisé uniquement à des fins d’information sur l’entité. Il relate son élection à la présidence du Sénégal en 2024 et son investiture le 2 avril 2024, et le classe parmi les musulmans sénégalais et les musulmans sunnites sénégalais, sans mentionner sa religion."
  ur: "عربی ویکیپیڈیا مضمون بشیرو دیومائے فای ⁦(اس کا نام \"بشير جوماي فاي\" پیش کرتے ہوئے)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 2024 میں سینیگال کے صدر کے طور پر ان کے انتخاب اور 2 اپریل 2024 کو ان کے افتتاح کا ذکر کرتا ہے، اور اسے سینیگالی مسلمانوں اور سینیگالی سنی مسلمانوں کے تحت فائل کرتا ہے، اس کے مذہب پر کوئی متن نہیں ہے۔"
