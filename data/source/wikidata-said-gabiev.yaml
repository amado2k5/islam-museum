summary:
  ar: "عنصر ويكيداتا Q4130892 لسعيد غابييف؛ يُستخدم للمعرّفات والوقائع المنظّمة فقط. يذكر مولده في 28 مايو 1882 ووفاته في 18 فبراير 1963 ⁦(إلى جانب قيمتين بدقة السنة)⁩، وعضويته في الحزب الشيوعي للاتحاد السوفيتي، ولا يحمل أي قيمة للدين."
  en: "Wikidata item Q4130892 for Said Gabiev; used for identifiers and structured facts only. It gives his birth on 28 May 1882 and his death on 18 February 1963 (alongside year-precision duplicates), his membership of the Communist Party of the Soviet Union, and carries no religion value at all."
  es: "Entrada de Wikidata Q4130892 para Said Gabiev; se utiliza únicamente para identificadores y datos estructurados. Indica su fecha de nacimiento el 28 de mayo de 1882 y su fallecimiento el 18 de febrero de 1963 (junto con duplicados que coinciden con el año), su pertenencia al Partido Comunista de la Unión Soviética y no tiene ningún valor religioso."
  fr: "L'élément Wikidata Q4130892 concernant Said Gabiev est utilisé uniquement pour les identifiants et les informations structurées. Il indique sa date de naissance, le 28 mai 1882, et sa date de décès, le 18 février 1963 (avec des doublons précis à l'année près), son appartenance au Parti communiste de l'Union soviétique, et ne contient aucune information sur sa religion."
  ur: "Said Gabiev کے لیے Wikidata آئٹم Q4130892؛ صرف شناخت کنندگان اور ساختی حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 28 مئی 1882 کو ان کی پیدائش اور 18 فروری 1963 کو ان کی موت ⁦(سال کی درستی کے نقول کے ساتھ)⁩ سوویت یونین کی کمیونسٹ پارٹی کی اس کی رکنیت دیتا ہے، اور اس میں مذہب کی کوئی قدر نہیں ہے۔"
  tr: "Wikidata öğesi Said Gabyev tarafından Q4130892; sadece organize tanımlayıcılar ve gerçekler için kullanılır. 28 Mayıs 1882 doğumlu ve 18 Şubat 1963'te öldüğü (tam yıl numarası olan iki değerle birlikte), Sovyetler Birliği Komünist Partisi üyeliği ve dini bir değeri olmadığı belirtilmektedir."
  id: "Elemen Wikidata Q4130892 oleh Said Gabyev; digunakan hanya untuk pengenal terorganisir dan fakta. Ia disebutkan lahir pada 28 Mei 1882, dan meninggal pada 18 Februari 1963 (bersama dua nilai dengan nomor tahun yang tepat), keanggotaannya di Partai Komunis Uni Soviet, dan tidak memiliki nilai keagamaan."
