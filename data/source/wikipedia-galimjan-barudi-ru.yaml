  ar: "مقالة ويكيبيديا الروسية عن غليمجان بارودي (اسمه الحقيقي غالييف)؛ تعطي ميلاده في 17 فبراير 1857 في مالاي كوفالي بقازان ووفاته في 6 ديسمبر 1921، وتروي تأسيسه مدرسة «محمدية» ومجلته «الدين والأدب» ونفيه وانتخابه مفتيًا سنة 1917."
  en: "Russian Wikipedia article on Galimjan Barudi (real surname Galeyev); it gives his birth on 17 February 1857 at Malye Kovali, Kazan province, and his death on 6 December 1921, and recounts his founding of the Muhammadiya madrasa and the journal ad-Din wa-l-adab, his exile, and his election as mufti in 1917."
