reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his birth name as Galeyev, his studies in Kazan and (from 1875) Bukhara, his founding of the Muhammadiya madrasa in 1882, his journal of 1906, his exile to Vologda province in 1908 on pan-Islamism charges and return in 1913, his election as mufti by the All-Russian Muslim congress at Moscow on 1–2 May 1917, his death at Moscow in 1921 during famine-relief work, and his burial at the Novo-Tatar cemetery in Kazan. Among its external links is a 2011 magazine piece framing him 'through the prism of Sufism' — one article's framing, not an attestation of a school. It names no school for him."
