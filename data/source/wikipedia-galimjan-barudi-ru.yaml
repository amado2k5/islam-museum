summary:
  ar: "مقالة ويكيبيديا الروسية عن غليمجان بارودي ⁦(اسمه الحقيقي غالييف)⁩؛ تعطي ميلاده في 17 فبراير 1857 في مالاي كوفالي بقازان ووفاته في 6 ديسمبر 1921، وتروي تأسيسه مدرسة «محمدية» ومجلته «الدين والأدب» ونفيه وانتخابه مفتيًا سنة 1917."
  en: "Russian Wikipedia article on Galimjan Barudi (real surname Galeyev); it gives his birth on 17 February 1857 at Malye Kovali, Kazan province, and his death on 6 December 1921, and recounts his founding of the Muhammadiya madrasa and the journal ad-Din wa-l-adab, his exile, and his election as mufti in 1917."
  es: "Artículo de la Wikipedia rusa sobre Galimjan Barudi (cuyo apellido real era Galeyev); en él se indica que nació el 17 de febrero de 1857 en Malye Kovali, provincia de Kazán, y que falleció el 6 de diciembre de 1921, y se relata la fundación de la madrasa Muhammadiya y de la revista ad-Din wa-l-adab, su exilio y su elección como muftí en 1917."
  fr: "L'article de Wikipédia russe sur Galimjan Barudi (de son vrai nom Galeyev) indique sa naissance le 17 février 1857 à Malye Kovali, dans la province de Kazan, et sa mort le 6 décembre 1921, et relate la fondation de la madrasa Muhammadiya et du journal ad-Din wa-l-adab, son exil et son élection comme mufti en 1917."
  ur: "Galimjan Barudi ⁦(اصلی کنیت Galeyev)⁩ پر روسی ویکیپیڈیا مضمون؛ یہ 17 فروری 1857 کو مالیے کووالی، صوبہ قازان میں ان کی پیدائش اور 6 دسمبر 1921 کو ان کی موت، اور محمدیہ مدرسہ اور جریدے عاد الدین وال ادب کے قیام، ان کی جلاوطنی اور 1917 میں مفتی کے طور پر منتخب ہونے کا ذکر کرتا ہے۔"
  tr: "Glimgan Barudi (gerçek adı Galyev) hakkında Rusça Wikipedia makalesi; 17 Şubat 1857'de Malay Kovaly, Kazan'da doğduğunu ve 6 Aralık 1921'de ölümünü anlatır ve 'Muhammadiya' okulunun ve dergisi 'Din ve Edebiyat'ın kuruluşunu, sürgününü ve 1917'de müftü seçilmesini anlatır."
  id: "Artikel Wikipedia Rusia tentang Glimgan Barudi (nama aslinya Galyev); menceritakan kelahirannya pada 17 Februari 1857 di Kovaly, Kazan, dalam bahasa Melayu, dan kematiannya pada 6 Desember 1921, serta menceritakan pendirian sekolah 'Muhammadiya' dan majalahnya 'Religion and Literature,' pengasingannya, dan pemilihannya sebagai mufti pada tahun 1917."
