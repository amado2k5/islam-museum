summary:
  ar: "موقع دار الفتوى اللبنانية في المملكة المتحدة: يذكر أن الهيئة أسستها مجموعة من العلماء وطلاب العلم بقيادة الشيخ هيثم تميم، وهو رئيسها."
  en: "The website of the Lebanese Dar Al-Fatwa in the United Kingdom: it states the body was established by a group of scholars and students of knowledge led by Shaykh Haytham Tamim, who is its chairman."
  es: "La página web de la organización libanesa Dar Al-Fatwa en el Reino Unido afirma que este organismo fue fundado por un grupo de eruditos y estudiantes del conocimiento, liderados por el jeque Haytham Tamim, quien es su presidente."
  fr: "Le site web de la Dar Al-Fatwa libanaise au Royaume-Uni indique que cet organisme a été fondé par un groupe d'érudits et d'étudiants en sciences religieuses dirigé par le cheikh Haytham Tamim, qui en est le président."
  ur: "یونائیٹڈ کنگڈم میں لبنانی دار الفتاویٰ کی ویب سائٹ: اس میں کہا گیا ہے کہ اس باڈی کو شیخ ہیثم تمیم کی قیادت میں علماء اور طلباء کے ایک گروپ نے قائم کیا تھا، جو اس کے چیئرمین ہیں۔"
  tr: "Birleşik Krallık'taki Lübnan Dar Al-Fatwa web sitesi: Kuruluşun, başkanı Şeyh Haitham Tamim liderliğindeki bir grup bilgin ve öğrenci tarafından kurulduğunu belirtmek gerekir."
  id: "Situs web Lebanonese Dar Al-Fatwa di Inggris: Perlu disebutkan bahwa organisasi ini didirikan oleh sekelompok cendekiawan dan pelajar pengetahuan yang dipimpin oleh Sheikh Haitham Tamim, yang merupakan presidennya."
