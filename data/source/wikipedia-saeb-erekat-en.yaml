reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives Erekat as born in Abu Dis on 28 April 1955, educated at City College of San Francisco, San Francisco State University and the University of Bradford, chief Palestinian negotiator from 1995 (resigned 2003 and February 2011, reappointed), secretary general of the PLO Executive Committee from 5 July 2015, a lung-transplant recipient (2017) suffering pulmonary fibrosis, and dead of COVID-19 complications at Hadassah Ein Karem Hospital, Jerusalem, on 10 November 2020, interred in the cemetery in Jericho. Its infobox carries no religion field and its text makes no statement of his religion; its categories file him by offices and by place, not by faith."
