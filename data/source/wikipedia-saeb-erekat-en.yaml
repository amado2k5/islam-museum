  ar: "مقالة ويكيبيديا الإنجليزية عن صائب عريقات؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أبو ديس سنة 1955، ودراسته في سان فرانسيسكو وبرادفورد، وعمله كبيرا للمفاوضين الفلسطينيين منذ 1995، وأمانته سرَّ اللجنة التنفيذية لمنظمة التحرير من 2015، ووفاته بمرض كوفيد-19 في القدس سنة 2020 ودفنه في أريحا."
  en: "English Wikipedia article on Saeb Erekat; used for entity facts only. It recounts his birth in Abu Dis in 1955, his studies in San Francisco and Bradford, his work as the Palestinians' chief negotiator from 1995, his secretary-generalship of the PLO Executive Committee from 2015, his death from COVID-19 in Jerusalem in 2020 and his burial in Jericho."
