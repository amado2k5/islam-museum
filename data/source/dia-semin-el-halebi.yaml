  fr: "Article de la TDV İslâm Ansiklopedisi sur al-Samin al-Halabi (édition en ligne), consulté le 20 novembre 2026 ; utilisé pour les données de l'entité : sa vie et son dictionnaire des mots coraniques."
  ur: "TDV İslâm Ansiklopedisi ⁦(آن لائن ایڈیشن)⁩ میں al-Samin al-Halabi پر اندراج، 20 نومبر 2026 کو پڑھا؛ ہستی کے حقائق کے لیے استعمال: حالاتِ زندگی اور قرآنی الفاظ کی لغت."
