reliability_note: "Read in the museum's session on 20 November 2026. It says he was born in Aleppo and lived many years in Egypt; learned grammar from Abu Hayyan al-Andalusi and the readings from Taqi al-Din al-Sa'igh; taught at the mosques of Ibn Tulun and al-Shafi'i in Cairo, deputised as judge and administered endowments; and describes his Umdat al-huffaz fi tafsir ashraf al-alfaz as the widest work on gharib al-Qur'an, giving each word's root letters first and then its lexical and exegetical senses, with brief notes on variant readings (ed. Muhammad Altunji, 4 vols, Beirut 1414/1993). Used for entity facts only."
