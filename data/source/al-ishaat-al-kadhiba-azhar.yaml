label:
  ar: الإشاعات الكاذبة وكيف حاربها الإسلام — محمد سيد طنطاوي
  en: "False Rumours and How Islam Fought Them — Muhammad Sayyid Tantawi"
summary:
  ar: "كتاب الدكتور محمد سيد طنطاوي ⁦(شيخ الأزهر)⁩ عن الإشاعات الكاذبة في تاريخ الرسل والأمم وأثرها، وعن الوسائل التي اتبعها الإسلام لمحاربتها، وفي مقدمتها التثبت من الأخبار؛ طبعته دار الشروق بالقاهرة ⁦(1421هـ/2001م، كما هو مطبوع في صفحة النشر)⁩. الأرقام المذكورة في الاستشهادات هي أرقام صفحات ملف PDF، وهي أكبر بصفحتين من أرقام الصفحات المطبوعة."
  en: "Muhammad Sayyid Tantawi's book (Sheikh of al-Azhar) on false rumours across the history of the prophets and peoples, their effects, and the methods Islam used against them, chiefly verification of reports; published by Dar al-Shorouk, Cairo (1421 AH / 2001 CE as printed). Page numbers in citations are PDF page numbers, two more than the printed folios."
  es: "Libro de Muhammad Sayyid Tantawi (Sheikh de al-Azhar) sobre los falsos rumores a lo largo de la historia de los profetas y los pueblos, sus efectos y los métodos que el Islam empleó para combatirlos, principalmente la verificación de informes; publicado por Dar al-Shorouk, El Cairo (1421 AH / 2001 d. C., según la edición impresa). Los números de página en las citas corresponden a los números de página del PDF, dos más que los folios impresos."
  fr: "L'ouvrage de Muhammad Sayyid Tantawi (cheikh d'al-Azhar) traite des rumeurs mensongères qui ont marqué l'histoire des prophètes et des peuples, de leurs conséquences et des méthodes employées par l'islam pour les contrer, notamment la vérification des récits; publié par Dar al-Shorouk, au Caire (1421 AH / 2001 CE, édition imprimée). Les numéros de page indiqués dans les citations correspondent à ceux du PDF, soit deux de plus que dans l'édition imprimée."
  ur: "محمد سید طنطاوی کی کتاب ⁦(شیخ الازہر)⁩ انبیاء اور لوگوں کی تاریخ میں جھوٹی افواہوں، ان کے اثرات، اور اسلام نے ان کے خلاف استعمال کیے گئے طریقے، خاص طور پر رپورٹوں کی تصدیق؛ دار الشروق، قاہرہ ⁦(1421ھ / 2001 عیسوی بطور مطبوعہ)⁩ سے شائع ہوا۔ حوالہ جات میں صفحہ نمبر پی ڈی ایف صفحہ نمبر ہیں، پرنٹ شدہ فولیو سے دو زیادہ۔"
  tr: "Dr. Muhammed Seyyid Tantawi'nin (El-Ezher Şeyhi) peygamberler ve uluslar tarihindeki yanlış söylentiler ve bunların etkileri ile İslam'ın bunlarla mücadelede kullandığı yöntemler üzerine, özellikle raporları doğrulama üzerine yazan kitabı; Kahire'de Dar Al-Shoruk tarafından yayımlanmıştır (1421 Hicri / 2001 M.S., yayın sayfasında basıldığı şekliyle). Atıflarda belirtilen numaralar, basılı sayfa numaralarından iki sayfa büyük olan PDF dosyasının sayfa numaralarıdır."
  id: "Buku oleh Dr. Muhammad Sayyid Tantawi (Sheikh of Al-Azhar) tentang rumor palsu dalam sejarah nabi dan bangsa serta dampaknya, serta metode yang digunakan Islam untuk melawannya, terutama verifikasi laporan; diterbitkan oleh Dar Al-Shorouk di Kairo (1421 AH / 2001 M, seperti yang dicetak di halaman publikasi). Angka yang disebutkan dalam kutipan adalah nomor halaman file PDF, yang dua halaman lebih besar dari nomor halaman cetak."
