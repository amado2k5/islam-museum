  ar: "كتاب الدكتور محمد سيد طنطاوي (شيخ الأزهر) عن الإشاعات الكاذبة في تاريخ الرسل والأمم وأثرها، وعن الوسائل التي اتبعها الإسلام لمحاربتها، وفي مقدمتها التثبت من الأخبار؛ طبعته دار الشروق بالقاهرة (1421هـ/2001م، كما هو مطبوع في صفحة النشر). الأرقام المذكورة في الاستشهادات هي أرقام صفحات ملف PDF، وهي أكبر بصفحتين من أرقام الصفحات المطبوعة."
