reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives her born 27 January 1952 at Lahore and died 11 February 2018 at Lahore of a brain haemorrhage; her full name as Asma Jilani Jahangir; her father Malik Ghulam Jilani and mother Begum Sabiha Jilani; her sister Hina Jilani named in the infobox's relatives field; her co-founding of the Human Rights Commission of Pakistan (1987) and AGHS Legal Aid Cell (1986), her presidency of the Supreme Court Bar Association (2010–2011), and her UN rapporteurships on extrajudicial executions (1998–2004), freedom of religion or belief (2004–2010) and human rights in Iran (2016–2018). It makes no statement of her own religion anywhere in its text — the religion content is her professional work and the accusations of opponents — and its categories file her by profession and ethnicity (Muhajir, Pashtun), not by faith."
