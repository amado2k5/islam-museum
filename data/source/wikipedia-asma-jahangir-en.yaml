summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أسماء جهانجير؛ تُستخدم لوقائع الكيان فقط. تروي نشأتها في لاهور، وتأسيسها لجنة حقوق الإنسان في باكستان وخلية AGHS للمساعدة القانونية، ومناصبها مقررةً خاصة للأمم المتحدة، ووفاتها في لاهور سنة 2018."
  en: "English Wikipedia article on Asma Jahangir; used for entity facts only. It recounts her Lahore upbringing, her co-founding of the Human Rights Commission of Pakistan and the AGHS Legal Aid Cell, her United Nations special rapporteurships, and her death at Lahore in 2018."
  es: "Artículo de la Wikipedia en inglés sobre Asma Jahangir; utilizado únicamente para obtener información sobre la persona. Relata su infancia en Lahore, su participación como cofundadora de la Comisión de Derechos Humanos de Pakistán y la Célula de Asistencia Jurídica de AGHS, sus cargos como relatora especial de las Naciones Unidas y su fallecimiento en Lahore en 2018."
  fr: "Article de Wikipédia en anglais sur Asma Jahangir; utilisé uniquement à des fins d’information sur l’entité. Il relate son enfance à Lahore, sa cofondation de la Commission des droits de l’homme du Pakistan et de la cellule d’aide juridique de l’AGHS, ses fonctions de rapporteuse spéciale auprès des Nations Unies et son décès à Lahore en 2018."
  ur: "عاصمہ جہانگیر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی لاہور کی پرورش، انسانی حقوق کمیشن آف پاکستان اور AGHS لیگل ایڈ سیل کی اس کی شریک بانی، اقوام متحدہ کی اسپیشل رپورٹر شپ، اور 2018 میں لاہور میں اس کی موت کا ذکر ہے۔"
