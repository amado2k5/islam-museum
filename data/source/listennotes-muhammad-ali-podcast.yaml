summary:
  ar: "صفحة بودكاست الصوت «محمد علي» على Listen Notes، وهي نشرة «أمر بالمعروف» التابعة ليوث كلوب؛ تعرض الصفحة نص سيرته نفسه الوارد في قناته: معلّم ومدرّب وخطيب تحفيزي، بكالوريوس هندسة ميكانيكية من معهد GIK، وماجستير علم نفس تطبيقي، ويدرس ماجستير العلوم الإسلامية في الجامعة المفتوحة الدولية."
  en: "The Listen Notes page of the 'Muhammad Ali' audio podcast, carried on Youth Club's 'AmrBilMarof' feed; the page reproduces the same biography text as his channel: a teacher, trainer, educator and motivational speaker with a B.Sc in Mechanical Engineering from GIK Institute, a Masters in Applied Psychology, and a Masters in Islamic Sciences in progress at IOU."
  es: "La página de notas de escucha del podcast de audio \"Muhammad Ali\", que se emite en el canal \"AmrBilMarof\" del Club Juvenil, reproduce el mismo texto biográfico que su canal: profesor, formador, educador y orador motivacional con una licenciatura en Ingeniería Mecánica del Instituto GIK, una maestría en Psicología Aplicada y una maestría en Ciencias Islámicas en curso en la IOU."
  fr: "La page « Notes d'écoute » du podcast audio « Muhammad Ali », diffusé sur le flux « AmrBilMarof » de Youth Club; la page reproduit le même texte biographique que sa chaîne: enseignant, formateur, éducateur et conférencier motivateur, titulaire d'une licence en génie mécanique de l'Institut GIK, d'une maîtrise en psychologie appliquée et d'une maîtrise en sciences islamiques en cours à l'IOU."
  ur: "'محمد علی' آڈیو پوڈ کاسٹ کا سننے کے نوٹس کا صفحہ، جو یوتھ کلب کی 'امر بلمعروف' فیڈ پر لیا گیا ہے۔ صفحہ اسی سوانح حیات کے متن کو اس کے چینل کے طور پر دوبارہ پیش کرتا ہے: ایک استاد، ٹرینر، معلم اور GIK انسٹی ٹیوٹ سے B.Sc میکینیکل انجینئرنگ کے ساتھ، ایک اپلائیڈ سائیکالوجی میں ماسٹرز، اور IOU میں اسلامی سائنس میں ماسٹرز جاری ہے۔"
  tr: "Yuth Klopp ile bağlantılı \"Order of Good\" adlı bültende yayınlanan Listen Notes'taki \"Muhammad Ali\" ses programının podcast sayfasında, kanalında yer alan kendi biyografisi yer alıyor: öğretmen, eğitmen ve motivasyon konuşmacısı, GIK'ten makine mühendisliği lisans derecesine sahip, uygulamalı psikoloji alanında yüksek lisans derecesine sahip ve Uluslararası Açık Üniversite'de İslam bilimleri alanında yüksek lisans yapıyor."
  id: "Halaman podcast audio \"Muhammad Ali\" di Listen Notes, sebuah buletin bernama \"Order of Good\" yang berafiliasi dengan Yuth Klopp, menampilkan biografinya sendiri yang ditampilkan di salurannya: guru, pelatih, dan pembicara motivasi, meraih gelar sarjana teknik mesin dari GIK, gelar magister psikologi terapan, dan sedang menempuh gelar magister ilmu Islam di International Open University."
