label:
  ar: "كتاب التوحيد الذي هو حق الله على العبيد لمحمد بن عبد الوهاب — راجعه وقابله على أصوله مجموعة من الأساتذة، كلية الشريعة بالرياض، جامعة الإمام محمد بن سعود الإسلامية ⁦(سلسلة مؤلفات الشيخ)⁩"
  en: "Muhammad ibn 'Abd al-Wahhab, Kitab al-Tawhid alladhi huwa Haqq Allah 'ala al-'Abid — revised and collated with its originals by a group of professors, College of Shari'a, Riyadh, Imam Muhammad ibn Saud Islamic University (series of the Shaykh's works)"
summary:
  ar: "نشرة جامعة الإمام محمد بن سعود الإسلامية لكتاب التوحيد ضمن مؤلفات محمد بن عبد الوهاب، راجعتها لجنة من الأساتذة وقابلتها على النسخ الخطية والمطبوعة، وطُبعت على نفقة الأمير سلطان بن عبد العزيز بمناسبة مرور مائة عام على تأسيس المملكة العربية السعودية، وفيها تقديم مدير الجامعة عبد الله بن عبد المحسن التركي، ثم نص الكتاب في ستة وستين باباً، وفهرس الأبواب."
  en: "Imam Muhammad ibn Saud Islamic University's edition of Kitab al-Tawhid in its series of Muhammad ibn 'Abd al-Wahhab's works, revised by a committee of professors and collated with manuscript and printed copies, printed at the expense of Prince Sultan ibn 'Abd al-'Aziz on the occasion of the centenary of the founding of the Kingdom of Saudi Arabia; it holds a foreword by the university's director 'Abd Allah ibn 'Abd al-Muhsin al-Turki, the text in sixty-six chapters, and a table of chapters."
title: "كتاب التوحيد الذي هو حق الله على العبيد — محمد بن عبد الوهاب"
