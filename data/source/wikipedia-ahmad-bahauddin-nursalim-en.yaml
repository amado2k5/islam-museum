summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد بهاء الدين نور سالم ⁦(المولود 1970)⁩، المعروف بغوس باها، عالم القرآن الإندونيسي من ريمبانج ومدير معهد لتحفيظ القرآن وعضو المجلس الأعلى لنهضة العلماء؛ تُستخدم لوقائع الكيان فقط، وتُستشهد بكل واقعة بمصدرها كما ذكرته المقالة."
  en: "English Wikipedia article on Ahmad Bahauddin Nursalim (born 1970), known as Gus Baha, the Indonesian Qur'an scholar from Rembang who leads the LP3IA Tahfidzul Qur'an pesantren and sits on Nahdlatul Ulama's supreme council; used for entity facts only, each cited where the article gives its own source."
  es: "Artículo de la Wikipedia en inglés sobre Ahmad Bahauddin Nursalim (nacido en 1970), conocido como Gus Baha, el erudito indonesio del Corán de Rembang que dirige el pesantren LP3IA Tahfidzul Qur'an y forma parte del consejo supremo de Nahdlatul Ulama; se utiliza únicamente para datos sobre la entidad, citados donde el artículo proporciona su propia fuente."
  fr: "Article de Wikipédia en anglais sur Ahmad Bahauddin Nursalim (né en 1970), connu sous le nom de Gus Baha, l'érudit indonésien du Coran originaire de Rembang qui dirige le pesantren LP3IA Tahfidzul Qur'an et siège au conseil suprême de Nahdlatul Ulama; utilisé uniquement pour les faits concernant l'entité, chacun étant cité lorsque l'article donne sa propre source."
  ur: "احمد بہاؤالدین نورسلیم ⁦(پیدائش 1970)⁩ پر انگریزی ویکیپیڈیا کا مضمون، گس بہا کے نام سے جانا جاتا ہے، ریمبنگ سے تعلق رکھنے والے انڈونیشی قرآن کے اسکالر جو LP3IA تحفیظ القرآن کی قیادت کرتے ہیں اور نہدلۃ العلماء کی سپریم کونسل میں بیٹھے ہیں۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک کا حوالہ دیا جاتا ہے جہاں مضمون اپنا ماخذ دیتا ہے۔"
  tr: "Ahmed Bahaa al-Din Nur Salem (1970 doğumlu), Rembang'dan Endonezyalı Kur'an âlim, Kur'an ezberleme enstitüsü müdürü ve Nahdlatula Ulama Yüksek Konseyi üyesi olan Ahmed Bahaa al-Din Nur Salem (1970 doğumlu) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır ve her olay makalede belirtilen kaynağını gösterir."
  id: "Artikel Wikipedia bahasa Inggris tentang Ahmed Bahaa al-Din Nur Salem (lahir 1970), yang dikenal sebagai Gus Baha, seorang ulama Al-Qur'an Indonesia dari Rembang, direktur lembaga hafalan Al-Qur'an, dan anggota Dewan Tertinggi Nahdlatula Ulama; artikel ini hanya digunakan untuk fakta entitas, dan setiap insiden mengutip sumbernya sebagaimana dikutip dalam artikel."
