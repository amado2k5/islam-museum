summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن ويليام تانوجايا، المولود في بيماتانغسيانتار في 11 تشرين الثاني 1981 لأسرة متوسطة الدخل كان أبوه عاملًا عاديًا؛ تذكر سفره إلى جاكرتا للدراسة، وعمله حارسًا ليليًا في مقهى إنترنت اثنتي عشرة ساعة يوميًا أثناء دراسته في جامعة بينا نوسانتارا، وسلسلة وظائفه البرمجية، وتأسيسه توكوبيديا مع ليونتينوس ألفا إديسون بتمويل أولي من شركته السابقة سنة 2009، وقيادته الشركة حتى 2023 ثم مشاركته في رئاسة غوتو حتى منتصف 2024."
  en: "Indonesian Wikipedia article on William Tanuwijaya, born in Pematangsiantar on 11 November 1981 to a middle-income family whose father was an ordinary worker; it records his move to Jakarta for study, his twelve-hour night shifts as an internet-cafe operator while studying at BINUS University, his software jobs, his founding of Tokopedia with Leontinus Alpha Edison on seed funding from his former employer in 2009, his leadership of the company to 2023, and his co-chairmanship of GoTo to mid-2024."
  es: "Artículo de la Wikipedia en indonesio sobre William Tanuwijaya, nacido en Pematangsiantar el 11 de noviembre de 1981 en el seno de una familia de ingresos medios cuyo padre era un trabajador común; en él se narra su traslado a Yakarta para estudiar, sus turnos nocturnos de doce horas como operador de un cibercafé mientras estudiaba en la Universidad BINUS, sus trabajos en el sector del software, la fundación de Tokopedia con Leontinus Alpha Edison con financiación inicial de su antiguo empleador en 2009, su liderazgo de la empresa hasta 2023 y su copresidencia de GoTo hasta mediados de 2024."
  fr: "L'article de Wikipédia indonésien sur William Tanuwijaya, né à Pematangsiantar le 11 novembre 1981 dans une famille de la classe moyenne dont le père était un ouvrier ordinaire, relate son déménagement à Jakarta pour ses études, ses nuits de douze heures comme exploitant de cybercafé pendant ses études à l'université BINUS, ses emplois dans le secteur du logiciel, la fondation de Tokopedia avec Leontinus Alpha Edison grâce à un financement initial de son ancien employeur en 2009, sa direction de l'entreprise jusqu'en 2023 et sa coprésidence de GoTo jusqu'à mi-2024."
  ur: "انڈونیشیائی ویکیپیڈیا کا مضمون ولیم تنویجایا پر، جو 11 نومبر 1981 کو Pematangsiantar میں ایک متوسط آمدنی والے خاندان میں پیدا ہوا تھا جس کے والد ایک عام کارکن تھے۔ اس میں مطالعہ کے لیے ان کا جکارتہ جانا، BINUS یونیورسٹی میں تعلیم کے دوران انٹرنیٹ-کیفے آپریٹر کے طور پر اس کی بارہ گھنٹے کی رات کی شفٹیں، اس کی سافٹ ویئر کی ملازمتیں، 2009 میں اپنے سابق آجر سے بیج کی مالی اعانت پر لیونٹینس الفا ایڈیسن کے ساتھ ٹوکوپیڈیا کی بنیاد، 2023 تک کمپنی کی قیادت، اور 2023 تک اس کی Cochair20-2020 کے درمیانی شراکت داری کو ریکارڈ کرتا ہے۔"
  tr: "Endonezya Wikipedia'sındaki makale, 11 Kasım 1981'de Bimatangsyantar'da orta gelirli bir ailede doğan sıradan bir işçi olan William Tanujaya hakkında; eğitim için Jakarta'ya yaptığı seyahati, Pena Nusantara Üniversitesi'nde okurken günde on iki saat internet kafede gece bekçiliği yapmasını, programlama işleri serisini, 2009'da Leontinus Alpha Edison ile Tokopedia'yı kurmasını, önceki şirketinden ilk finansmanla 2009'da şirketi yönetmesini ve ardından 2024 ortalarına kadar Goto'nun başkanlığını sürdürmesini anlatıyor."
  id: "Artikel Wikipedia Indonesia tentang William Tanujaya, lahir di Bimatangsyantar pada 11 November 1981, dari keluarga berpenghasilan menengah, adalah pekerja biasa; artikel ini mengenang perjalanannya ke Jakarta untuk belajar, pekerjaannya sebagai penjaga malam di warnet selama dua belas jam sehari saat belajar di Universitas Pena Nusantara, serangkaian pekerjaan pemrogramannya, mendirikan Tokopedia bersama Leontinus Alpha Edison dengan pendanaan awal dari perusahaan sebelumnya pada 2009, memimpin perusahaan hingga 2023, dan kemudian berpartisipasi dalam kepresidenan Goto hingga pertengahan 2024."
