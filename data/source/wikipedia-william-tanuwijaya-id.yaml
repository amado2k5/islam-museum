summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن ويليام تانوجايا، المولود في بيماتانغسيانتار في 11 تشرين الثاني 1981 لأسرة متوسطة الدخل كان أبوه عاملًا عاديًا؛ تذكر سفره إلى جاكرتا للدراسة، وعمله حارسًا ليليًا في مقهى إنترنت اثنتي عشرة ساعة يوميًا أثناء دراسته في جامعة بينا نوسانتارا، وسلسلة وظائفه البرمجية، وتأسيسه توكوبيديا مع ليونتينوس ألفا إديسون بتمويل أولي من شركته السابقة سنة 2009، وقيادته الشركة حتى 2023 ثم مشاركته في رئاسة غوتو حتى منتصف 2024."
  en: "Indonesian Wikipedia article on William Tanuwijaya, born in Pematangsiantar on 11 November 1981 to a middle-income family whose father was an ordinary worker; it records his move to Jakarta for study, his twelve-hour night shifts as an internet-cafe operator while studying at BINUS University, his software jobs, his founding of Tokopedia with Leontinus Alpha Edison on seed funding from his former employer in 2009, his leadership of the company to 2023, and his co-chairmanship of GoTo to mid-2024."
