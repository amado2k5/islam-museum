summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0639\u0646 \u0627\u0644\u0645\u0646\u0634\u062f \u0648\u0627\u0644\u0645\u0628\u062a\u0647\u0644 \u0633\u064a\u062f \u0645\u062d\u0645\u062f \u0627\u0644\u0646\u0642\u0634\u0628\u0646\u062f\u064a\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0628\u062f\u0645\u064a\u0631\u0629 \u0641\u064a 7 \u064a\u0646\u0627\u064a\u0631 1920\u060c \u0648\u0646\u0634\u0623\u062a\u0647 \u0641\u064a \u0637\u0647\u0637\u0627\u060c \u0648\u0627\u0646\u062a\u0642\u0627\u0644\u0647 \u0625\u0644\u0649 \u0637\u0646\u0637\u0627 \u0641\u064a 1955\u060c \u0648\u062a\u0633\u062c\u064a\u0644\u0627\u062a\u0647 \u0644\u0644\u0625\u0630\u0627\u0639\u0629 \u0645\u0646\u0630 1966\u20131967\u060c \u0648\u062a\u0639\u0627\u0648\u0646\u0647 \u0645\u0639 \u0628\u0644\u064a\u063a \u062d\u0645\u062f\u064a\u060c \u0648\u0648\u0641\u0627\u062a\u0647 \u0641\u064a 14 \u0641\u0628\u0631\u0627\u064a\u0631 1976\u060c \u0648\u0648\u0633\u0627\u0645\u0627\u0647 \u0628\u0639\u062f \u0648\u0641\u0627\u062a\u0647 (1979 \u06481989)\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0625\u0630\u0627\u0639\u0629 \u0627\u0644\u0642\u0631\u0622\u0646 \u0627\u0644\u0643\u0631\u064a\u0645 \u0648\u0625\u0633\u0644\u0627\u0645 \u0623\u0648\u0646 \u0644\u0627\u064a\u0646 \u0648\u0645\u0635\u0631\u0627\u0648\u064a \u0648\u0635\u0648\u062a \u0627\u0644\u0623\u0645\u0629."
  en: "Arabic Wikipedia article on the munshid and supplicant Sayed Muhammad al-Naqshabandi; entity facts only: birth at Dumayra on 7 January 1920, upbringing in Tahta, move to Tanta in 1955, radio recordings from 1966\u20131967, his work with Baligh Hamdi, death on 14 February 1976 and his two posthumous orders (1979, 1989); it cites the Qur'an radio, IslamOnline, Masrawy and Sawt al-Umma."
