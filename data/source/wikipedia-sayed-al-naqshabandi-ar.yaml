summary:
  ar: "مقالة ويكيبيديا العربية عن المنشد والمبتهل سيد محمد النقشبندي؛ لوقائع الكيان فقط: مولده بدميرة في 7 يناير 1920، ونشأته في طهطا، وانتقاله إلى طنطا في 1955، وتسجيلاته للإذاعة منذ 1966–1967، وتعاونه مع بليغ حمدي، ووفاته في 14 فبراير 1976، ووساماه بعد وفاته ⁦(1979 و1989)⁩؛ وتستند إلى إذاعة القرآن الكريم وإسلام أون لاين ومصراوي وصوت الأمة."
  en: "Arabic Wikipedia article on the munshid and supplicant Sayed Muhammad al-Naqshabandi; entity facts only: birth at Dumayra on 7 January 1920, upbringing in Tahta, move to Tanta in 1955, radio recordings from 1966–1967, his work with Baligh Hamdi, death on 14 February 1976 and his two posthumous orders (1979, 1989); it cites the Qur'an radio, IslamOnline, Masrawy and Sawt al-Umma."
  es: "Sayed Muhammad al-Naqshabandi - El Munshid y Suplicante Sayed Muhammad al-Naqshabandi; solo datos de la entidad: nacimiento en Dumayra el 7 de enero de 1920, crianza en Tahta, traslado a Tanta en 1955, grabaciones de radio de 1966 a 1967, su trabajo con Baligh Hamdi, muerte el 14 de febrero de 1976 y sus dos órdenes póstumas (1979, 1989); cita la radio del Corán, IslamOnline, Masrawy y South al-Umma."
  fr: "Sayed Muhammad al-Naqshabandi - Le Munshid et le Suppliant Sayed Muhammad al-Naqshabandi; faits concernant l'entité uniquement: naissance à Dumayra le 7 janvier 1920, éducation à Tahta, déménagement à Tanta en 1955, enregistrements radiophoniques de 1966-1967, son travail avec Baligh Hamdi, décès le 14 février 1976 et ses deux décorations posthumes (1979, 1989); cet article cite la radio coranique, IslamOnline, Masrawy et South al-Umma."
  ur: "سید محمد النقشبندی - منشد اور داعی سید محمد النقشبندی؛ صرف ہستی کے حقائق: 7 جنوری 1920 کو دمیرا میں پیدائش، طہتہ میں پرورش، 1955 میں طنطہ منتقل، 1966-1967 تک ریڈیو ریکارڈنگ، بلیغ حمدی کے ساتھ ان کا کام، 14 فروری 1976 کو موت اور ان کے دو بعد از مرگ احکامات ⁦(1979، 1989)⁩؛ اس میں قرآن ریڈیو، اسلام آن لائن، مسروی اور جنوبی الامہ کا حوالہ دیا گیا ہے۔"
  tr: "Şarkıcı ve yalvaran Seyyid Muhammed El-Nakşibendi hakkında Arapça Vikipedi makalesi; sadece varlık olayları için: 7 Ocak 1920'de Demeira'da doğması, Tahta'da yetiştirilme biçimi, 1955'te Tanta'ya taşınması, 1966–1967 yılları arasındaki radyo kayıtları, Baligh Hamdi ile iş birliği, 14 Şubat 1976'daki ölümü ve ölümünden sonra verilen madalya (1979 ve 1989); Kuran Radyo, İslam Online, Masrawy ve Sawt Al-Ummah'a dayanmaktadır."
  id: "Artikel Wikipedia berbahasa Arab tentang penyanyi dan pemohon Sayyid Muhammad Al-Naqshbandi; hanya untuk acara entitas: kelahirannya di Demeira pada 7 Januari 1920, masa kecilnya di Tahta, kepindahannya ke Tanta pada tahun 1955, rekaman radionya dari 1966–1967, kerja sama dengan Baligh Hamdi, kematiannya pada 14 Februari 1976, dan penghargaan anumerta (1979 dan 1989); didasarkan pada Quran Radio, Islam Online, Masrawy, dan Sawt Al-Ummah."
