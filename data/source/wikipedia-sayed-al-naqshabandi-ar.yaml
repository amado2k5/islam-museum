summary:
  ar: "مقالة ويكيبيديا العربية عن المنشد والمبتهل سيد محمد النقشبندي؛ لوقائع الكيان فقط: مولده بدميرة في 7 يناير 1920، ونشأته في طهطا، وانتقاله إلى طنطا في 1955، وتسجيلاته للإذاعة منذ 1966–1967، وتعاونه مع بليغ حمدي، ووفاته في 14 فبراير 1976، ووساماه بعد وفاته ⁦(1979 و1989)⁩؛ وتستند إلى إذاعة القرآن الكريم وإسلام أون لاين ومصراوي وصوت الأمة."
  en: "Arabic Wikipedia article on the munshid and supplicant Sayed Muhammad al-Naqshabandi; entity facts only: birth at Dumayra on 7 January 1920, upbringing in Tahta, move to Tanta in 1955, radio recordings from 1966–1967, his work with Baligh Hamdi, death on 14 February 1976 and his two posthumous orders (1979, 1989); it cites the Qur'an radio, IslamOnline, Masrawy and Sawt al-Umma."
