summary:
  ar: "مقالة ويكيبيديا العربية عن أمير خان ⁦(الملاكم)⁩؛ تُستخدم لوقائع الكيان فقط. تروي ألقابه ومواقفه العلنية من التطرف، وتقدّم الإسلام بوصفه جزءا من هويته دون أن تسمي مذهبا أو طريقة له."
  en: "Arabic Wikipedia article on Amir Khan the boxer; used for entity facts only. It recounts his titles and his public statements against extremism, and presents Islam as part of his identity without naming a school or an order for him."
  es: "Artículo de Wikipedia en árabe sobre el boxeador Amir Khan; se utiliza únicamente para obtener información sobre él. Relata sus títulos y sus declaraciones públicas contra el extremismo, y presenta el islam como parte de su identidad sin mencionar ninguna escuela u orden religiosa."
  fr: "Article de Wikipédia en arabe sur le boxeur Amir Khan; utilisé uniquement à des fins d'information sur l'entité. Il relate ses titres et ses prises de position publiques contre l'extrémisme, et présente l'islam comme faisant partie intégrante de son identité sans mentionner d'école ou d'ordre auquel il aurait appartenu."
  ur: "عامر خان باکسر پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے عنوانات اور انتہا پسندی کے خلاف ان کے عوامی بیانات کا تذکرہ کیا گیا ہے، اور کسی اسکول یا اس کے لیے حکم نامے کے بغیر اسلام کو ان کی شناخت کے حصے کے طور پر پیش کیا گیا ہے۔"
  tr: "Amir Khan (boksör) hakkında Arapça Wikipedia makalesi; sadece varlığın gerçekleri için kullanılmıştır. Aşırıcılık konusundaki unvanlarını ve kamuya açık tutumlarını anlatır, İslam'ı kimliğinin bir parçası olarak sunar, ancak bir tarikat veya yöntem belirtmez."
  id: "Artikel Wikipedia Arab tentang Amir Khan (si petinju); digunakan hanya untuk fakta entitas. Artikel ini menceritakan judul dan sikap publiknya tentang ekstremisme, menampilkan Islam sebagai bagian dari identitasnya tanpa menyebutkan sekte atau metodenya."
