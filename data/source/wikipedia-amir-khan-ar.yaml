reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Khan as a British professional boxer of Pakistani origin born on 8 December 1986, a two-time world champion who took the WBA light-welterweight title from Andriy Kotelnyk in 2009 and Olympic silver at Athens 2004. Its religion material is a section on his rejection of extremism, quoting his Observer interview: he called on British Muslims to confront extremism, said Islam is part of his identity, recalled his Hajj, and said he abstains from alcohol and smoking in observance of his religion. It names no school and no Sufi order for him."
