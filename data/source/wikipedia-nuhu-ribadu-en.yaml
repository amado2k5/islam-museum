reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id through the MediaWiki API. It gives Ribadu as born on 21 November 1960 in Yola, a law graduate of Ahmadu Bello University called to the Bar in 1984, who joined the Nigeria Police Force, was appointed the first chairman of the EFCC in 2003 and reappointed in 2007, was dismissed from the police in 2008 and lived in exile until 2010, ran for president in 2011 on the Action Congress ticket, chaired the Petroleum Special Revenue Task Force (2012–2014), and was appointed National Security Adviser on 19 June 2023. It makes no statement of his religion anywhere in its text; its categories file him under 'Nigerian Muslims', and a category filing is not an attestation."
