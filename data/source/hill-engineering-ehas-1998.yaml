summary:
  ar: "فصل دونالد هيل عن الهندسة في المجلد الثاني من موسوعة روشدي راشد: يسرد آلات الجزري المائية، وينسب إليه أول استعمال معروف للذُقن في ساقية وأول تضمين لفكرة تقليل تقطع الجريان لرفع كفاءتها، ويقرر عمومية السواقي والنواعير الحيوانية والمائية في العالم الإسلامي الوسيط."
  en: "Donald R. Hill's engineering chapter in volume two of Roshdi Rashed's encyclopedia: surveys al-Jazari's water machines, credits him with the first known use of a crank in a saqiya and the first implied minimising of intermittence to maximise its efficiency, and records the everyday use of animal-powered saqiyas and water-powered norias across the medieval Islamic world."
  es: "El capítulo de ingeniería de Donald R. Hill en el segundo volumen de la enciclopedia de Roshdi Rashed examina las máquinas hidráulicas de al-Jazari, le atribuye el primer uso conocido de una manivela en una saqiya y la primera minimización implícita de la intermitencia para maximizar su eficiencia, y documenta el uso cotidiano de saqiyas impulsadas por animales y norias impulsadas por agua en todo el mundo islámico medieval."
  fr: "Le chapitre sur l'ingénierie de Donald R. Hill dans le deuxième volume de l'encyclopédie de Roshdi Rashed: passe en revue les machines à eau d'al-Jazari, lui attribue la première utilisation connue d'une manivelle dans une saqiya et la première minimisation implicite de l'intermittence pour maximiser son efficacité, et relate l'utilisation quotidienne des saqiyas à traction animale et des norias à traction hydraulique dans le monde islamique médiéval."
  ur: "رشدی رشید کے انسائیکلوپیڈیا کی جلد دوم میں ڈونلڈ آر ہل کا انجینئرنگ باب: الجزاری کی پانی کی مشینوں کا سروے کرتا ہے، اسے ساقیہ میں کرینک کے پہلے معروف استعمال کا سہرا دیتا ہے اور اس کی افادیت کو زیادہ سے زیادہ کرنے کے لیے وقفے کو کم سے کم کرنے کا سہرا دیتا ہے، اور ہر روز کے استعمال کو ریکارڈ کرتا ہے۔ دنیا"
