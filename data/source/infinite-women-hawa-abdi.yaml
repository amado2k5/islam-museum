summary:
  ar: "سيرة حواء عبدي لدى «نساء بلا حدود»؛ توثّق زواجها القسري في الثانية عشرة، ومنحتها السوفيتية للطب في كييف (تخرجت 1971) وشهادتها في القانون (1979)، وعيادتها سنة 1983 التي صارت مستشفى من 400 سرير، ومخيم مؤسستها الذي آوى 90 ألف شخص في جفاف 2011."
  en: "Infinite Women biography of Hawa Abdi; it records her forced marriage at twelve, her Soviet scholarship to study medicine in Kiev (graduated 1971) and her law degree (1979), her 1983 clinic that grew into a 400-bed hospital, and her foundation's camp housing 90,000 people in the 2011 drought."
