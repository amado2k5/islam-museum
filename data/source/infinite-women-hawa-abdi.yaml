summary:
  ar: "سيرة حواء عبدي لدى «نساء بلا حدود»؛ توثّق زواجها القسري في الثانية عشرة، ومنحتها السوفيتية للطب في كييف ⁦(تخرجت 1971)⁩ وشهادتها في القانون (1979)، وعيادتها سنة 1983 التي صارت مستشفى من 400 سرير، ومخيم مؤسستها الذي آوى 90 ألف شخص في جفاف 2011."
  en: "Infinite Women biography of Hawa Abdi; it records her forced marriage at twelve, her Soviet scholarship to study medicine in Kiev (graduated 1971) and her law degree (1979), her 1983 clinic that grew into a 400-bed hospital, and her foundation's camp housing 90,000 people in the 2011 drought."
  es: "La biografía \"Mujeres Infinitas\" de Hawa Abdi narra su matrimonio forzado a los doce años, su beca soviética para estudiar medicina en Kiev (se graduó en 1971) y su licenciatura en derecho (1979), su clínica de 1983 que se convirtió en un hospital de 400 camas, y el campamento de su fundación que albergó a 90.000 personas durante la sequía de 2011."
  fr: "Biographie de Hawa Abdi par Infinite Women; elle relate son mariage forcé à douze ans, sa bourse soviétique pour étudier la médecine à Kiev (diplômée en 1971) et son diplôme de droit (1979), sa clinique de 1983 devenue un hôpital de 400 lits, et le camp de sa fondation abritant 90 000 personnes lors de la sécheresse de 2011."
  ur: "حوا عبدی کی لامحدود خواتین کی سوانح عمری؛ اس میں بارہ سال کی عمر میں اس کی جبری شادی، کیف میں میڈیسن کی تعلیم حاصل کرنے کے لیے اس کی سوویت اسکالرشپ ⁦(گریجویشن 1971)⁩ اور اس کی قانون کی ڈگری (1979)، اس کا 1983 کا کلینک جو 400 بستروں پر مشتمل اسپتال میں تبدیل ہوا، اور اس کی فاؤنڈیشن کے کیمپ میں 2011 کی خشک سالی میں 90,000 افراد رہائش پذیر تھے۔"
