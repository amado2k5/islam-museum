summary:
  ar: "مقالة ويكيبيديا العربية عن حسين مويني؛ تُستخدم لوقائع الكيان فقط. مقالة موجزة تروي رئاسته زنجبار منذ سنة 2020 وعضويته في البرلمان عن دائرة كوهاني ووزارته الدفاع سابقا، وتذكر أنه نجل رئيس تنزانيا السابق علي حسن مويني. لا يسمي متنها دينا ولا مدرسة له."
  en: "Arabic Wikipedia article on Hussein Mwinyi; used for entity facts only. A short article recounting his presidency of Zanzibar since 2020, his parliamentary seat for Kwahani and his earlier defence ministry, and noting that he is the son of former Tanzanian president Ali Hassan Mwinyi. Its text names no religion or school for him."
  es: "Artículo de Wikipedia en árabe sobre Hussein Mwinyi; utilizado únicamente para datos sobre la persona. Un breve artículo que relata su presidencia de Zanzíbar desde 2020, su escaño parlamentario por Kwahani y su anterior cargo como ministro de Defensa, y que señala que es hijo del expresidente tanzano Ali Hassan Mwinyi. El texto no menciona su religión ni su escuela."
  fr: "Article Wikipédia en arabe consacré à Hussein Mwinyi; utilisé uniquement à des fins d’information sur l’entité. Ce court article retrace sa présidence de Zanzibar depuis 2020, son mandat de député de Kwahani et son ancien poste de ministre de la Défense, et précise qu’il est le fils de l’ancien président tanzanien Ali Hassan Mwinyi. Le texte ne mentionne ni sa religion ni son appartenance scolaire."
