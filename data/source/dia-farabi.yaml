summary:
  ar: "مدخل «موسوعة الإسلام» لمؤسسة الشؤون الدينية التركية TDV عن إسحاق بن إبراهيم الفارابي، اطُّلع عليه في ٢٠ نوفمبر ٢٠٢٦؛ يُستخدم لوقائع الكيان: صلته بالجوهري وتاريخ وفاته وديوان الأدب."
  en: "The TDV İslâm Ansiklopedisi entry on Ishaq ibn Ibrahim al-Farabi (online edition), read on 20 November 2026; used for entity facts: his relation to al-Jawhari, his death date and Diwan al-adab."
  es: "Entrada de la TDV İslâm Ansiklopedisi sobre Ishaq ibn Ibrahim al-Farabi (edición en línea), consultada el 20 de noviembre de 2026; utilizada para datos de la entidad: su relación con al-Jawhari, su fecha de muerte y el Diwan al-adab."
  fr: "Article de la TDV İslâm Ansiklopedisi sur Ishaq ibn Ibrahim al-Farabi (édition en ligne), consulté le 20 novembre 2026 ; utilisé pour les données de l'entité : son lien avec al-Jawhari, sa date de décès et le Diwan al-adab."
  ur: "TDV İslâm Ansiklopedisi ⁦(آن لائن ایڈیشن)⁩ میں Ishaq ibn Ibrahim al-Farabi پر اندراج، 20 نومبر 2026 کو پڑھا؛ ہستی کے حقائق کے لیے استعمال: جوہری سے تعلق، وفات کی تاریخ اور دیوان الادب."
  tr: "Türk Dini İşler Vakfı (TDV) tarafından hazırlanan \"İslam Ansiklopedisi\" için İshaq bin İbrahim El-Farabi hakkındaki madde, 20 Kasım 2026'da erişildi; kurumun olayları için kullanıldı: Al-Jawhari ile bağlantısı, ölüm tarihi ve edebi koleksiyon."
  id: "Entri untuk \"Ensiklopedia Islam\" oleh Yayasan Urusan Agama Turki (TDV) tentang Ishaq bin Ibrahim Al-Farabi, diakses pada 20 November 2026; digunakan untuk peristiwa entitas: kaitannya dengan Al-Jawhari, tanggal kematiannya, dan koleksi sastra."
