reliability_note: "Read in the museum's session on 20 November 2026. It says he was the uncle and teacher of the lexicographer al-Jawhari, is named after Farab in Turkestan, and was sometimes confused with the philosopher Abu Nasr al-Farabi; that the report that he went to Yemen and wrote Diwan al-adab there is not correct; that his date of death is not certain, al-Suyuti giving 350 (961); and describes Diwan al-adab as one of the most important Arabic dictionaries, arranged in the system of chapters (bab) and sections (fasl) by verb type and noun pattern. Used for entity facts only."
