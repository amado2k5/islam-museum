summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسين رشدي باشا (1863–1928)، رئيس وزراء مصر أربع مرات بين 1914 و1919؛ تُستخدم لوقائع الكيان فقط."
  en: "English Wikipedia article on Hussein Roshdy Pasha (1863–1928), prime minister of Egypt four times between 1914 and 1919; used for entity facts only. It gives his Turkish origin, his Kavala family descent from a janissary officer of Muhammad Ali, and his wartime council-of-ministers decision against the Central Powers."
  es: "Artículo de la Wikipedia en inglés sobre Hussein Roshdy Pasha (1863-1928), primer ministro de Egipto en cuatro ocasiones entre 1914 y 1919; se utiliza únicamente para datos biográficos. Menciona su origen turco, su ascendencia de la familia Kavala, descendiente de un oficial jenízaro de Muhammad Ali, y su decisión del consejo de ministros en tiempos de guerra contra las Potencias Centrales."
  fr: "L'article de Wikipédia en anglais consacré à Hussein Roshdy Pacha (1863-1928), Premier ministre d'Égypte à quatre reprises entre 1914 et 1919, est utilisé uniquement à titre informatif. Il mentionne ses origines turques, son appartenance à la famille Kavala, issue d'un janissaire de Muhammad Ali, et sa décision, prise en temps de guerre par le Conseil des ministres, de s'opposer aux Puissances centrales."
  ur: "حسین رشدی پاشا (1863–1928) پر انگریزی ویکیپیڈیا کا مضمون، 1914 اور 1919 کے درمیان چار مرتبہ مصر کے وزیر اعظم۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس سے ان کی ترک نژاد، محمد علی کے ایک جانیری افسر سے اس کے کاوالا خاندان کی نسل، اور مرکزی طاقتوں کے خلاف ان کی جنگ کے وقت کی کونسل آف منسٹرز کے فیصلے کا پتہ چلتا ہے۔"
  tr: "1914 ile 1919 yılları arasında Mısır Başbakanı Hüseyin Rüşdi Paşa (1863–1928) hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır."
  id: "Artikel Wikipedia bahasa Inggris tentang Hussein Rushdi Pasha (1863–1928), Perdana Menteri Mesir empat kali antara tahun 1914 dan 1919; hanya digunakan untuk fakta entitas."
