summary:
  ar: "سيرة غيث الغيث في موقع الاتحاد العربي للنقل الجوي: الرئيس التنفيذي لفلاي دبي، انضم إلى طيران الإمارات سنة 1986 وبلغ منصب نائب الرئيس التنفيذي للعمليات التجارية العالمية، وقاد فلاي دبي منذ بدء عملياتها إلى شبكة تتجاوز 95 وجهة في 50 بلدًا."
  en: "The Arab Air Carriers' Organization biography of Ghaith Al Ghaith: chief executive officer of flydubai, who joined Emirates Airlines in 1986, rose to Executive Vice President Commercial Operations Worldwide, and has led flydubai from the beginning of operations to a network of more than 95 destinations in 50 countries."
  es: "Biografía de Ghaith Al Ghaith, director ejecutivo de flydubai, quien se unió a Emirates Airlines en 1986, ascendió a vicepresidente ejecutivo de operaciones comerciales a nivel mundial y ha liderado flydubai desde el inicio de sus operaciones hasta una red de más de 95 destinos en 50 países."
  fr: "Biographie de Ghaith Al Ghaith par l'Organisation des transporteurs aériens arabes: directeur général de flydubai, il a rejoint Emirates Airlines en 1986, est devenu vice-président exécutif des opérations commerciales mondiales et a dirigé flydubai depuis ses débuts jusqu'à un réseau de plus de 95 destinations dans 50 pays."
  ur: "عرب ایئر کیریئرز آرگنائزیشن غیث الغیث کی سوانح عمری: فلائی دبئی کے چیف ایگزیکٹو آفیسر، جنہوں نے 1986 میں ایمریٹس ایئر لائنز میں شمولیت اختیار کی، وہ ایگزیکٹو نائب صدر کمرشل آپریشنز ورلڈ وائیڈ کے عہدے پر فائز ہوئے، اور فلائی دبئی کو آپریشنز کے آغاز سے لے کر 955 سے زیادہ ممالک کے نیٹ ورک تک لے گئے۔"
