summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد مصطفى المراغي؛ تُستخدم لوقائع الكيان فقط. تؤرخ ميلاده في 9 مارس 1881 ووفاته في 22 أغسطس 1945 وتصفه بأنه عالم دين أزهري مصري وشيخ الأزهر، وخانة الوفيات والدين في صندوقها فارغة المذهب."
  en: "Urdu Wikipedia article on Muhammad Mustafa al-Maraghi; used for entity facts only. It dates his birth to 9 March 1881 and his death to 22 August 1945, describes him as an Egyptian Azhari religious scholar and Sheikh al-Azhar, and its infobox likewise names no madhhab for him."
  es: "Artículo de Wikipedia en urdu sobre Muhammad Mustafa al-Maraghi; utilizado únicamente para datos sobre la persona. Fecha su nacimiento el 9 de marzo de 1881 y su muerte el 22 de agosto de 1945, lo describe como un erudito religioso egipcio de la escuela de Al-Azhar y Sheikh al-Azhar, y su ficha informativa tampoco menciona ninguna escuela jurídica (madhhab) para él."
  fr: "L'article de Wikipédia en ourdou consacré à Muhammad Mustafa al-Maraghi, utilisé uniquement à des fins d'information sur l'entité, indique sa date de naissance: le 9 mars 1881; sa date de décès: le 22 août 1945; il est décrit comme un érudit religieux égyptien de l'école azharienne et cheikh d'al-Azhar; son infobox ne mentionne aucune école de pensée (madhhab) à son sujet."
  ur: "محمد مصطفی المراثی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش کی تاریخ 9 مارچ 1881 ہے اور ان کی وفات 22 اگست 1945 ہے، اسے مصری ازہری عالم دین اور شیخ الازہر کے طور پر بیان کیا گیا ہے، اور اسی طرح اس کے معلوماتی خانے میں ان کے لیے کوئی مذہب نہیں ہے۔"
  tr: "Muhammed Mustafa Al-Maraghi hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 9 Mart 1881'de doğmuş ve 22 Ağustos 1945'te vefat etmiştir; kutunun içinde boş ölüm ilanları ve din bulunan Mısırlı Ezher dini alimi ve El-Ezher Şeyhi olarak tanımlanmıştır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Muhammad Mustafa Al-Maraghi; digunakan hanya untuk fakta entitas. Ia lahir pada 9 Maret 1881, dan meninggal pada 22 Agustus 1945, menggambarkannya sebagai seorang ulama agama Azhar Mesir dan Sheikh Al-Azhar, dengan obituari dan agama di dalam kotaknya kosong."
