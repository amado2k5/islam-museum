reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth on 23 December 1725, his reign as the fourteenth Mughal emperor from 29 April 1748 to 2 June 1754, his father Muhammad Shah and mother Qudsia Begum, his victory over Ahmad Shah Abdali at Manupur as a prince, his deposition and blinding by Imad-ul-Mulk, his imprisonment and his death on 1 January 1775. Its infobox gives his religion as Sunni Islam (Hanafi) — a structured attestation the article body does not corroborate; the museum's record preserves it in the faith note and does not settle a school on it. Checked 1 November 2026."
