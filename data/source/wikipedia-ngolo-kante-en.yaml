summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نغولو كانتي؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في باريس في 29 مارس 1991 لأبوين ماليَّين، ومسيرته من بولوني وكان إلى ليستر سيتي وتشيلسي والاتحاد، وألقابه ومنها كأس العالم 2018، وتصفه بأنه مسلم ممارس دون تسمية أي مذهب له."
  en: "English Wikipedia article on N'Golo Kanté; used for entity facts only. It records his birth in Paris on 29 March 1991 to Malian parents, his career from Boulogne and Caen to Leicester City, Chelsea and Al-Ittihad, his titles including the 2018 World Cup, and describes him as a practising Muslim, naming no school for him."
  es: "Artículo de la Wikipedia en inglés sobre N'Golo Kanté; utilizado únicamente para obtener información sobre la persona. En él se registra su nacimiento en París el 29 de marzo de 1991, de padres malienses, su trayectoria profesional desde Boulogne y Caen hasta Leicester City, Chelsea y Al-Ittihad, sus títulos, incluida la Copa Mundial de 2018, y se le describe como musulmán practicante, sin mencionar ninguna escuela a la que pertenezca."
  fr: "Article Wikipédia en anglais sur N'Golo Kanté; utilisé uniquement pour les informations le concernant. Il retrace sa naissance à Paris le 29 mars 1991 de parents maliens, sa carrière de Boulogne et Caen à Leicester City, Chelsea et Al-Ittihad, ses titres, dont la Coupe du monde 2018, et le décrit comme un musulman pratiquant, sans mentionner son établissement scolaire."
  ur: "N'Golo Kanté پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 29 مارچ 1991 کو پیرس میں اس کی پیدائش مالیان کے والدین کے ہاں ریکارڈ کی گئی ہے، اس کا کیریئر بولون اور کین سے لے کر لیسٹر سٹی، چیلسی اور الاتحاد، اس کے ٹائٹل بشمول 2018 ورلڈ کپ، اور اسے ایک باعمل مسلمان کے طور پر بیان کیا گیا ہے، اس کے لیے کسی اسکول کا نام نہیں رکھا گیا ہے۔"
  tr: "N'Golo Kanté hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 29 Mart 1991'de Paris'te Malili ebeveynlerin çocuğu olarak doğması belgelenmiştir ve Bologne'dan Leicester City, Chelsea ve Birleşik Federasyon'a yolculuğu, 2018 Dünya Kupası dahil unvanları dahil, kendi mezhebini isimlendirmeden uygulayan bir Müslüman olarak tanımlanır."
  id: "Artikel Wikipedia bahasa Inggris tentang N'Golo Kanté; digunakan hanya untuk fakta entitas. Kelahirannya di Paris pada 29 Maret 1991 dari orang tua Malian didokumentasikan, dan perjalanannya dari Bologne ke Leicester City, Chelsea, dan United Federation, termasuk gelar-gelar yang digelar di Piala Dunia 2018, menggambarkannya sebagai Muslim yang taat tanpa menyebut sekte mana pun miliknya."
