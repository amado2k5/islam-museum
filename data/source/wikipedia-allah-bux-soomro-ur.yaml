summary:
  ar: "مقالة ويكيبيديا الأردية «الله بخش سومرو»؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1900 في شكارپور، ورئاسته وزراء السند من 23 مارس 1938 إلى 18 أبريل 1940 ثم من 7 مارس 1941 إلى 14 أكتوبر 1942، ورئاسته مؤتمر الحرية في دلهي سنة 1940، وإعادته ألقابه البريطانية، واغتياله سنة 1943."
  en: "Urdu Wikipedia article 'Allah Bakhsh Soomro'; used for entity facts only. It gives his birth in 1900 at Shikarpur, his two premierships of Sindh (23 March 1938 – 18 April 1940, then 7 March 1941 – 14 October 1942), his presidency of the 1940 Delhi Azad Conference, his return of his British titles, and his assassination in 1943."
  es: "Artículo de Wikipedia en urdu titulado \"Allah Bakhsh Soomro\"; utilizado únicamente para datos biográficos. En él se menciona su nacimiento en 1900 en Shikarpur, sus dos mandatos como primer ministro de Sindh (del 23 de marzo de 1938 al 18 de abril de 1940 y del 7 de marzo de 1941 al 14 de octubre de 1942), su presidencia de la Conferencia Azad de Delhi de 1940, la devolución de sus títulos británicos y su asesinato en 1943."
  fr: "L'article de Wikipédia en ourdou intitulé « Allah Bakhsh Soomro » est utilisé uniquement pour les informations factuelles concernant l'entité. Il mentionne sa naissance en 1900 à Shikarpur, ses deux mandats de Premier ministre du Sindh (du 23 mars 1938 au 18 avril 1940, puis du 7 mars 1941 au 14 octobre 1942), sa présidence de la Conférence Azad de Delhi en 1940, la restitution de ses titres britanniques et son assassinat en 1943."
