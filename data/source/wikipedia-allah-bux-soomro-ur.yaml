  ar: "مقالة ويكيبيديا الأردية «الله بخش سومرو»؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1900 في شكارپور، ورئاسته وزراء السند من 23 مارس 1938 إلى 18 أبريل 1940 ثم من 7 مارس 1941 إلى 14 أكتوبر 1942، ورئاسته مؤتمر الحرية في دلهي سنة 1940، وإعادته ألقابه البريطانية، واغتياله سنة 1943."
  en: "Urdu Wikipedia article 'Allah Bakhsh Soomro'; used for entity facts only. It gives his birth in 1900 at Shikarpur, his two premierships of Sindh (23 March 1938 – 18 April 1940, then 7 March 1941 – 14 October 1942), his presidency of the 1940 Delhi Azad Conference, his return of his British titles, and his assassination in 1943."
