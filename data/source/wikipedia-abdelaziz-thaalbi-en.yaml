summary:
  ar: مقالة ويكيبيديا الإنجليزية عن عبد العزيز الثعالبي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس في 5 سبتمبر 1876 ووفاته فيها في 1 أكتوبر 1944، ودراسته في الزيتونة حيث «تعلّم السلفية»، ومجلته «سبيل الرشاد»، ومحاكمته سنة 1904، ودوره مؤسسًا للحزب الدستوري وكتابه «تونس الشهيدة» (1920). لا تسمّي المقالة مذهبًا فقهيًا له؛ وصفها «السلفية» اتجاه إصلاحي لا مذهب.
  en: English Wikipedia article on Abdelaziz Thâalbi; used for entity facts only. It gives his birth in Tunis on 5 September 1876 and his death there on 1 October 1944, his Zaytuna studies where he 'became learned in Salafiyyah', his journal Sabil al-Rashid, his 1904 trial, his founding role in the Destour party and his book La Tunisie martyre (1920). The article names no legal school for him; its 'Salafiyyah' describes a reformist orientation, not a madhhab.
  es: "Artículo de la Wikipedia en inglés sobre Abdelaziz Thâalbi; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Túnez el 5 de septiembre de 1876 y su fallecimiento allí el 1 de octubre de 1944, sus estudios en Zaytuna, donde «se formó en el salafismo», su revista Sabil al-Rashid, su juicio en 1904, su papel fundador en el partido Destour y su libro La Tunisie martyre (1920). El artículo no menciona ninguna escuela jurídica a la que pertenezca; su término «salafismo» describe una orientación reformista, no una escuela jurídica (madhhab)."
  fr: "L'article de Wikipédia en anglais consacré à Abdelaziz Thâalbi, utilisé uniquement pour les informations le concernant, mentionne sa naissance à Tunis le 5 septembre 1876 et sa mort dans la même ville le 1er octobre 1944, ses études à Zaytuna où il se serait initié au salafisme, sa revue Sabil al-Rashid, son procès de 1904, son rôle fondateur au sein du parti Destour et son ouvrage La Tunisie martyre (1920). L'article ne cite aucune école juridique à laquelle il aurait appartenu; le terme « salafisme » désigne une orientation réformiste, et non un madhhab."
  ur: "عبد العزیز ثعلبی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 5 ستمبر 1876 کو تیونس میں ان کی پیدائش اور 1 اکتوبر 1944 کو وہیں ان کی موت، اس کی زیتونا پڑھتی ہے جہاں وہ 'سلفیہ میں سیکھا'، اس کا جریدہ سبیل الرشید، اس کا 1904 کا مقدمہ، ڈیسٹور پارٹی میں اس کا بانی کردار اور اس کی کتاب لا تیونس شہید (1920)۔ مضمون میں اس کے لیے کسی قانونی اسکول کا نام نہیں ہے۔ اس کی 'سلفیہ' ایک اصلاحی رجحان کو بیان کرتی ہے، نہ کہ کسی مذہب کو۔"
