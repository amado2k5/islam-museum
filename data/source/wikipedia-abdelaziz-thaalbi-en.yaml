summary:
  ar: مقالة ويكيبيديا الإنجليزية عن عبد العزيز الثعالبي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس في 5 سبتمبر 1876 ووفاته فيها في 1 أكتوبر 1944، ودراسته في الزيتونة حيث «تعلّم السلفية»، ومجلته «سبيل الرشاد»، ومحاكمته سنة 1904، ودوره مؤسسًا للحزب الدستوري وكتابه «تونس الشهيدة» (1920). لا تسمّي المقالة مذهبًا فقهيًا له؛ وصفها «السلفية» اتجاه إصلاحي لا مذهب.
  en: English Wikipedia article on Abdelaziz Thâalbi; used for entity facts only. It gives his birth in Tunis on 5 September 1876 and his death there on 1 October 1944, his Zaytuna studies where he 'became learned in Salafiyyah', his journal Sabil al-Rashid, his 1904 trial, his founding role in the Destour party and his book La Tunisie martyre (1920). The article names no legal school for him; its 'Salafiyyah' describes a reformist orientation, not a madhhab.
