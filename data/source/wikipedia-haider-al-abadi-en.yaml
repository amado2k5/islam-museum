summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حيدر العبادي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 25 نيسان 1952 ببغداد مع وسم اليوم بأنه يحتاج مصدرًا منذ كانون الأول 2024، وتقول إنه وُلد لأبوين شيعيين وهي خلفية أسرية لا شهادة شخصية، وتعطي رئاسته للوزراء 2014–2018 وسلفه المالكي وخلفه عادل عبد المهدي."
  en: "English Wikipedia article on Haider al-Abadi; used for entity facts only. It gives his birth on 25 April 1952 at Baghdad, with the day flagged as needing a citation since December 2024, and says he was born to Shia parents — family background, not a personal attestation. It gives his premiership 2014–2018, his predecessor Nouri al-Maliki and his successor Adel Abdul Mahdi, and carries no personal religion field."
  es: "Artículo de Wikipedia en inglés sobre Haider al-Abadi; utilizado únicamente para datos sobre la persona. Indica que nació el 25 de abril de 1952 en Bagdad, fecha que requiere una citación desde diciembre de 2024, y afirma que nació de padres chiítas (antecedentes familiares, no una declaración personal). Menciona su mandato como primer ministro entre 2014 y 2018, a su predecesor Nouri al-Maliki y a su sucesor Adel Abdul Mahdi, y no incluye información sobre su religión."
  fr: "L'article Wikipédia en anglais consacré à Haider al-Abadi, utilisé uniquement pour les informations relatives à l'entité, indique sa naissance le 25 avril 1952 à Bagdad (cette date étant signalée comme nécessitant une vérification depuis décembre 2024) et précise qu'il est né de parents chiites (information familiale et non attestation personnelle). Il mentionne également son mandat de Premier ministre de 2014 à 2018, son prédécesseur Nouri al-Maliki et son successeur Adel Abdul Mahdi, mais ne comporte aucune information sur sa religion."
  ur: "حیدر العبادی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 25 اپریل 1952 کو بغداد میں ہوئی، اس دن کو دسمبر 2024 سے ایک حوالہ کی ضرورت کے طور پر نشان زد کیا گیا، اور کہا گیا ہے کہ وہ شیعہ والدین کے ہاں پیدا ہوا تھا - خاندانی پس منظر، ذاتی تصدیق نہیں۔ یہ ان کے پیشرو نوری المالکی اور ان کے جانشین عادل عبدالمہدی کو 2014-2018 کی وزارت عظمیٰ دیتا ہے، اور اس کا کوئی ذاتی مذہب نہیں ہے۔"
  tr: "Haider al-Abadi hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Makalede 25 Nisan 1952'de Bağdat'ta doğduğu belirtilmiş, Aralık 2024'ten itibaren bir kaynak gerektiren gün belirtilmiş ve Şii ebeveynlerden doğduğu, bunun kişisel bir belge değil, aile geçmişi olduğu belirtilmiştir. Başbakanlığı 2014–2018 yılları arasındaki bakanlara, selefi Maliki'ye ve halefi Adel Abdul Mehdi'ye verilmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Haider al-Abadi hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada 25 April 1952 di Baghdad, dan hari tersebut ditandai sebagai sumber yang diperlukan sejak Desember 2024, serta menyatakan bahwa ia lahir dari orang tua Syiah, yang merupakan latar belakang keluarga bukan sertifikat pribadi. Artikel tersebut memberikan jabatan perdana menteri kepada menteri dari 2014–2018, pendahulunya Maliki, dan penerusnya Adel Abdul Mahdi."
