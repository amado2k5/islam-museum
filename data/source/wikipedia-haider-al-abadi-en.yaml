  ar: "مقالة ويكيبيديا الإنجليزية عن حيدر العبادي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 25 نيسان 1952 ببغداد مع وسم اليوم بأنه يحتاج مصدرًا منذ كانون الأول 2024، وتقول إنه وُلد لأبوين شيعيين وهي خلفية أسرية لا شهادة شخصية، وتعطي رئاسته للوزراء 2014–2018 وسلفه المالكي وخلفه عادل عبد المهدي."
  en: "English Wikipedia article on Haider al-Abadi; used for entity facts only. It gives his birth on 25 April 1952 at Baghdad, with the day flagged as needing a citation since December 2024, and says he was born to Shia parents — family background, not a personal attestation. It gives his premiership 2014–2018, his predecessor Nouri al-Maliki and his successor Adel Abdul Mahdi, and carries no personal religion field."
