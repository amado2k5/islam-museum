  ar: "مقالة ويكيبيديا الإنجليزية عن يوسف العظمة؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في أسرة دمشقية من أصل تركماني، وخدمته ضابطا عثمانيا، وتوليه وزارة الحربية ورئاسة الأركان سنة 1920، وقيادته القوات السورية في معركة ميسلون ومقتله فيها."
  en: "English Wikipedia article on Yusuf al-Azma; used for entity facts only. It recounts his upbringing in a Damascene family of Turkmen descent, his service as an Ottoman officer, his appointment as minister of war and chief of general staff in 1920, and his command and death at the Battle of Maysalun."
