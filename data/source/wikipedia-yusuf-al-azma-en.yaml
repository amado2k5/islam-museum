summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن يوسف العظمة؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في أسرة دمشقية من أصل تركماني، وخدمته ضابطا عثمانيا، وتوليه وزارة الحربية ورئاسة الأركان سنة 1920، وقيادته القوات السورية في معركة ميسلون ومقتله فيها."
  en: "English Wikipedia article on Yusuf al-Azma; used for entity facts only. It recounts his upbringing in a Damascene family of Turkmen descent, his service as an Ottoman officer, his appointment as minister of war and chief of general staff in 1920, and his command and death at the Battle of Maysalun."
  es: "Artículo de la Wikipedia en inglés sobre Yusuf al-Azma; utilizado únicamente para datos biográficos. Relata su infancia en una familia damascena de ascendencia turcomana, su servicio como oficial otomano, su nombramiento como ministro de guerra y jefe del Estado Mayor en 1920, y su mando y muerte en la batalla de Maysalun."
  fr: "Article de Wikipédia en anglais sur Yusuf al-Azma; utilisé uniquement pour les informations sur l’entité. Il relate son enfance dans une famille damascène d’origine turkmène, son service comme officier ottoman, sa nomination comme ministre de la Guerre et chef d’état-major en 1920, ainsi que son commandement et sa mort lors de la bataille de Maysalun."
  ur: "یوسف الاعظم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ترکمن نسل کے ایک دمشقی خاندان میں اس کی پرورش، عثمانی افسر کے طور پر ان کی خدمات، 1920 میں وزیر جنگ اور چیف آف جنرل اسٹاف کے طور پر ان کی تقرری اور میسالون کی جنگ میں اس کی کمانڈ اور موت کا ذکر ہے۔"
