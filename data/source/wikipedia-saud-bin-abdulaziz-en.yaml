  ar: "مقالة ويكيبيديا الإنجليزية عن سعود بن عبد العزيز؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 15 يناير 1902 في مدينة الكويت، وسنوات ولايته للعهد من 1933، وحكمه من 9 نوفمبر 1953، وخلعه في 2 نوفمبر 1964، ووفاته في 23 فبراير 1969 في أثينا، ودفنه في مقبرة العود بالرياض؛ ولا يذكر متنها له دينًا ولا مدرسة."
