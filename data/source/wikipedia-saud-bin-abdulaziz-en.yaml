summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سعود بن عبد العزيز؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 15 يناير 1902 في مدينة الكويت، وسنوات ولايته للعهد من 1933، وحكمه من 9 نوفمبر 1953، وخلعه في 2 نوفمبر 1964، ووفاته في 23 فبراير 1969 في أثينا، ودفنه في مقبرة العود بالرياض؛ ولا يذكر متنها له دينًا ولا مدرسة."
  en: "English Wikipedia article on Saud of Saudi Arabia; used for entity facts only. It gives his birth on 15 January 1902 at Kuwait City, his crown-prince years from 1933, his reign from 9 November 1953, his deposition on 2 November 1964, and his death on 23 February 1969 at Athens, with burial at Al Oud cemetery in Riyadh; its text names no religion or school for him."
  es: "Artículo de la Wikipedia en inglés sobre Saud de Arabia Saudita; utilizado únicamente para datos sobre la persona. Indica que nació el 15 de enero de 1902 en la ciudad de Kuwait, que fue príncipe heredero desde 1933, que reinó desde el 9 de noviembre de 1953, que fue depuesto el 2 de noviembre de 1964 y que falleció el 23 de febrero de 1969 en Atenas, siendo enterrado en el cementerio de Al Oud en Riad; el texto no menciona ninguna religión ni escuela a la que perteneciera."
  fr: "Article de Wikipédia en anglais sur Saoud d'Arabie saoudite; utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance le 15 janvier 1902 à Koweït, son accession au titre de prince héritier à partir de 1933, son règne à partir du 9 novembre 1953, sa destitution le 2 novembre 1964 et son décès le 23 février 1969 à Athènes, avec inhumation au cimetière d'Al Oud à Riyad; le texte ne mentionne ni sa religion ni son école."
  ur: "سعودی عرب کے سعود پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 15 جنوری 1902 کو کویت سٹی میں ان کی پیدائش، 1933 سے اس کے ولی عہد سال، 9 نومبر 1953 سے اس کا دور حکومت، 2 نومبر 1964 کو ان کی معزولی، اور 23 فروری 1969 کو ایتھنز میں ان کی موت، ریاض کے العود قبرستان میں تدفین کے ساتھ؛ اس کے متن میں اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
  tr: "Suud bin Abdülaziz hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 15 Ocak 1902'de Kuveyt Şehri'nde doğduğu belirtilir; 1933'ten itibaren veliaht prens olarak görev yaptığı yıllar, 9 Kasım 1953'ten itibaren iktidarda bulunduğu dönem, 2 Kasım 1964'te tahttan indirilmesi, 23 Şubat 1969'da Atina'da vefat ettiği ve Riyad'daki Al-Oud Mezarlığı'na defnedilmesi belirtilir; panosunda herhangi bir dini veya okul belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Saud bin Abdulaziz; digunakan hanya untuk fakta entitas. Ia disebutkan lahir pada 15 Januari 1902 di Kota Kuwait, masa jabatannya sebagai Putra Mahkota sejak 1933, pemerintahannya sejak 9 November 1953, pencopotannya pada 2 November 1964, kematiannya pada 23 Februari 1969 di Athena, dan pemakamannya di Pemakaman Al-Oud di Riyadh; tidak ada keagamaan atau sekolah yang disebutkan dalam dewannya."
