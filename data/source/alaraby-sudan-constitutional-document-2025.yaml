  fr: "Transitional Constitutional Document of Sudan, as amended in 2025, tel que publié à : Al-Araby Al-Jadeed, document archive. L'adresse et le texte (article 6, lettre b) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Transitional Constitutional Document of Sudan, as amended in 2025, tal como se publica en: Al-Araby Al-Jadeed, document archive. La dirección y el texto (artículo 6, letra b) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
