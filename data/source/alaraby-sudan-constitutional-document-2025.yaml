  ar: "«الوثيقة الدستورية الانتقالية السودانية بعد تعديل 2025»، كما يُنشر عند: العربي الجديد، أرشيف الوثائق. العنوان ونص المادة 6 ب مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
