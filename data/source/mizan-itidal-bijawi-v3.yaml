summary:
  ar: "القسم الثالث من «ميزان الاعتدال في نقد الرجال» لأبي عبد الله محمد بن أحمد بن عثمان الذهبي (ت 748هـ)، بتحقيق علي محمد البجاوي، دار إحياء الكتب العربية (عيسى البابي الحلبي وشركاه). يبدأ من تتمة حرف العين (عبيد الله، الترجمة 5337) وينتهي في المحمدين (محمد بن غزوان، الترجمة 8044)، ويليه فهرس مجمل لهذا الجزء؛ وذكر المحقق أن الفهارس المفصلة تأتي في آخر الجزء الرابع الذي ينتهي به الكتاب."
  en: "Part 3 of Mizan al-I'tidal fi Naqd al-Rijal by Abu Abd Allah Muhammad ibn Ahmad ibn Uthman al-Dhahabi (d. 748 AH), edited by Ali Muhammad al-Bijawi, Dar Ihya' al-Kutub al-Arabiyya (Isa al-Babi al-Halabi and Partners). It runs from the continuation of the letter 'ayn (Ubayd Allah, entry 5337) to the Muhammads (Muhammad ibn Ghazwan, entry 8044), followed by a summary index of this part; the editor notes that the full indexes come at the end of part 4, which completes the book."
