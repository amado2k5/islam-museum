label:
  ar: "ميزان الاعتدال في نقد الرجال — الذهبي، تحقيق علي محمد البجاوي، القسم الثالث"
  en: "Mizan al-I'tidal fi Naqd al-Rijal — al-Dhahabi, ed. Ali Muhammad al-Bijawi, part 3"
summary:
  ar: "القسم الثالث من «ميزان الاعتدال في نقد الرجال» لأبي عبد الله محمد بن أحمد بن عثمان الذهبي ⁦(ت 748هـ)⁩، بتحقيق علي محمد البجاوي، دار إحياء الكتب العربية ⁦(عيسى البابي الحلبي وشركاه)⁩. يبدأ من تتمة حرف العين ⁦(عبيد الله، الترجمة 5337)⁩ وينتهي في المحمدين ⁦(محمد بن غزوان، الترجمة 8044)⁩، ويليه فهرس مجمل لهذا الجزء؛ وذكر المحقق أن الفهارس المفصلة تأتي في آخر الجزء الرابع الذي ينتهي به الكتاب."
  en: "Part 3 of Mizan al-I'tidal fi Naqd al-Rijal by Abu Abd Allah Muhammad ibn Ahmad ibn Uthman al-Dhahabi (d. 748 AH), edited by Ali Muhammad al-Bijawi, Dar Ihya' al-Kutub al-Arabiyya (Isa al-Babi al-Halabi and Partners). It runs from the continuation of the letter 'ayn (Ubayd Allah, entry 5337) to the Muhammads (Muhammad ibn Ghazwan, entry 8044), followed by a summary index of this part; the editor notes that the full indexes come at the end of part 4, which completes the book."
  es: "Tercera parte de Mizan al-I'tidal fi Naqd al-Rijal de Abu Abd Allah Muhammad ibn Ahmad ibn Uthman al-Dhahabi (fallecido en 748 AH), editada por Ali Muhammad al-Bijawi, Dar Ihya' al-Kutub al-Arabiyya (Isa al-Babi al-Halabi y colaboradores). Abarca desde la continuación de la carta 'ayn (Ubayd Allah, entrada 5337) hasta los Muhammads (Muhammad ibn Ghazwan, entrada 8044), seguida de un índice resumido de esta parte; el editor señala que los índices completos se encuentran al final de la cuarta parte, que completa el libro."
  fr: "Troisième partie du Mizan al-I'tidal fi Naqd al-Rijal d'Abu Abd Allah Muhammad ibn Ahmad ibn Uthman al-Dhahabi (mort en 748 AH), éditée par Ali Muhammad al-Bijawi, Dar Ihya' al-Kutub al-Arabiyya (Isa al-Babi al-Halabi et associés). Elle s'étend de la suite de la lettre 'ayn (Ubayd Allah, entrée 5337) jusqu'aux Muhammad (Muhammad ibn Ghazwan, entrée 8044), suivie d'un index sommaire. L'éditeur précise que les index complets se trouvent à la fin de la quatrième partie, qui conclut l'ouvrage."
  ur: "میزان الاعتدال فی نقد الرجال کا حصہ 3 از ابو عبد اللہ محمد بن احمد ابن عثمان الذہبی ⁦(متوفی 748ھ)⁩، جس کی تدوین علی محمد البیجاوی، دار احیاء الکتب العربیہ ⁦(عیسیٰ الببی الحلبی اور حصے)⁩۔ یہ خط عین ⁦(عبید اللہ، اندراج 5337)⁩ کے تسلسل سے محمد ⁦(محمد ابن غزوان، اندراج 8044)⁩ تک چلتا ہے، اس کے بعد اس حصے کا خلاصہ انڈیکس؛ ایڈیٹر نوٹ کرتا ہے کہ مکمل اشاریہ حصہ 4 کے آخر میں آتا ہے، جو کتاب کو مکمل کرتا ہے۔"
  tr: "Ebu Abdullah Muhammed bin Ahmed ibn Osman el-Dhahabi (ö. 748 H.) tarafından yazılan \"Mizan al-I'tidal fi Naqd al-Rijal\" adlı eserinin üçüncü bölümü, Ali Muhammed el-Bacawi, Dar İhya' el-Kutub el-Arabiya (İsa el-Babi el-Halabi ve Ortaklar) tarafından düzenlenmiştir. Epeydullah, 'Ayn' mektubunun devamıyla başlar (Ubeydullah, biyografi 5337) ve iki Muhammed (Muhammed ibn Gazvan, biyografi 8044) ile sona erer; ardından bu bölümün kapsamlı bir dizini takip eder; editör, ayrıntılı dizinlerin kitabın sona erdiği dördüncü cildin sonunda yer aldığını belirtmiştir."
  id: "Bagian ketiga dari \"Mizan al-I'tidal fi Naqd al-Rijal\" oleh Abu Abdullah Muhammad ibn Ahmad ibn Uthman al-Dhahabi (wafat 748 H), disunting oleh Ali Muhammad al-Bajawi, Dar Ihya' al-Kutub al-Arabiya (Isa al-Babi al-Halabi dan Para Rekan). Bagian ini dimulai dengan kelanjutan surat 'Ayn' (Ubaydullah, biografi 5337) dan diakhiri dengan dua Muhammad (Muhammad ibn Ghazwan, biografi 8044), diikuti dengan indeks komprehensif bagian ini; editor menyebutkan bahwa indeks rinci muncul di akhir jilid keempat yang akan menjadi penutup buku ini."
