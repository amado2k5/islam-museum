  ar: "مقالة ويكيبيديا القازاقية عن سلطان بيك خوجانوف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 10 سبتمبر 1894 في قرية أكسومبه بمنطقة سوزاق ووفاته في 10 فبراير 1938 في موسكو، وتعليمه في طشقند وموسكو، ونشاطه منذ 1915 ودعمه لحكم تركستان الذاتي وعمله ضد المجاعة ومنصبيه في تركستان. لا يرد فيها أي محتوى ديني."
  en: "Kazakh Wikipedia article on Sultanbek Khodzhanov; used for entity facts only. It gives his birth on 10 September 1894 in the village of Aksumbe in Suzak district and his death on 10 February 1938 in Moscow, his schooling in Tashkent and Moscow, his activity from 1915, his support for the Turkestan Autonomy, his famine-relief work and his Turkestan commissar posts. It contains no religion content."
