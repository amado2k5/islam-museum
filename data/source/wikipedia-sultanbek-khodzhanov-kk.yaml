summary:
  ar: "مقالة ويكيبيديا القازاقية عن سلطان بيك خوجانوف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 10 سبتمبر 1894 في قرية أكسومبه بمنطقة سوزاق ووفاته في 10 فبراير 1938 في موسكو، وتعليمه في طشقند وموسكو، ونشاطه منذ 1915 ودعمه لحكم تركستان الذاتي وعمله ضد المجاعة ومنصبيه في تركستان. لا يرد فيها أي محتوى ديني."
  en: "Kazakh Wikipedia article on Sultanbek Khodzhanov; used for entity facts only. It gives his birth on 10 September 1894 in the village of Aksumbe in Suzak district and his death on 10 February 1938 in Moscow, his schooling in Tashkent and Moscow, his activity from 1915, his support for the Turkestan Autonomy, his famine-relief work and his Turkestan commissar posts. It contains no religion content."
  es: "Artículo de Wikipedia en kazajo sobre Sultanbek Khodzhanov; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 10 de septiembre de 1894 en la aldea de Aksumbe, en el distrito de Suzak, y su fallecimiento el 10 de febrero de 1938 en Moscú, su educación en Tashkent y Moscú, su actividad desde 1915, su apoyo a la Autonomía de Turkestán, su labor de ayuda humanitaria durante la hambruna y sus cargos como comisario de Turkestán. No contiene contenido religioso."
  fr: "Article de Wikipédia en kazakh sur Sultanbek Khodzhanov; utilisé uniquement à des fins d'information sur l'entité. Il indique sa naissance le 10 septembre 1894 dans le village d'Aksumbe, district de Suzak, et son décès le 10 février 1938 à Moscou, sa scolarité à Tachkent et à Moscou, son activité à partir de 1915, son soutien à l'autonomie du Turkestan, son action humanitaire pendant la famine et ses fonctions de commissaire au Turkestan. Il ne contient aucun contenu religieux."
  ur: "سلطان بیک خودزانوف پر قازق ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 10 ستمبر 1894 کو سوزاک ضلع کے گاؤں اکسمبے میں اس کی پیدائش اور 10 فروری 1938 کو ماسکو میں اس کی موت، تاشقند اور ماسکو میں اس کی اسکولنگ، 1915 سے اس کی سرگرمی، ترکستان کی خودمختاری کے لیے اس کی حمایت، اس کے قحط سے متعلق کام اور اس کے ترکستان کمیشنر کے عہدوں پر مشتمل ہے۔ اس میں کوئی مذہب کا مواد نہیں ہے۔"
