summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد الخامس؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 10 أغسطس 1909 في فاس ووفاته في 26 فبراير 1961 في الرباط، وجلوسه على العرش سنة 1927، ونفيه 1953–1955، واستقلال المغرب سنة 1956، واتخاذه لقب الملك سنة 1957."
  en: "English Wikipedia article on Mohammed V of Morocco; used for entity facts only. It gives his birth on 10 August 1909 at Fes and his death on 26 February 1961 at Rabat, his enthronement in 1927, his exile of 1953–1955, Moroccan independence in 1956 and his assumption of the title of king in 1957."
  es: "Artículo de la Wikipedia en inglés sobre Mohammed V de Marruecos; utilizado únicamente para datos biográficos. Indica su nacimiento el 10 de agosto de 1909 en Fez y su fallecimiento el 26 de febrero de 1961 en Rabat, su entronización en 1927, su exilio entre 1953 y 1955, la independencia de Marruecos en 1956 y su asunción del título de rey en 1957."
  fr: "Article de Wikipédia en anglais sur Mohammed V du Maroc; utilisé uniquement pour les informations biographiques. Il indique sa naissance le 10 août 1909 à Fès et sa mort le 26 février 1961 à Rabat, son intronisation en 1927, son exil de 1953 à 1955, l’indépendance du Maroc en 1956 et son accession au trône en 1957."
  ur: "مراکش کے محمد پنجم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 10 اگست 1909 کو Fes میں ان کی پیدائش اور 26 فروری 1961 کو رباط میں ان کی موت، 1927 میں ان کی تخت نشینی، 1953–1955 کی جلاوطنی، 1956 میں مراکش کی آزادی اور 1957 میں بادشاہ کا عہدہ سنبھالنے کے بارے میں بتاتا ہے۔"
  tr: "Muhammed V hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 10 Ağustos 1909'da Fez'de doğdu ve 26 Şubat 1961'de Rabat'ta öldü, 1927'de tahta çıktı, 1953–1955 yılları arasında sürgündeydi, 1956'da Fas'ın bağımsızlığını kazandı ve 1957'de kral unvanını aldı."
  id: "Artikel Wikipedia bahasa Inggris tentang Mohammed V; digunakan hanya untuk fakta entitas. Ia lahir pada 10 Agustus 1909 di Fez dan meninggal pada 26 Februari 1961 di Rabat, naik takhta pada tahun 1927, mengasingkan diri dari tahun 1953–1955, meraih kemerdekaan Maroko pada tahun 1956, dan mengambil gelar raja pada tahun 1957."
