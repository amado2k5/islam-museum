summary:
  ar: "قاعدة بيانات البرديات العربية — جمع معهد جامعة لودفيغ ماكسيميليان بميونخ للطبعات والأبحاث عن الوثائق العربية القديمة على البردي والرقّ والورق، تضم ١٣٬٥٨٦ وثيقة ⁦(٤٬٤٧٦ بنص كامل)⁩ من القرن السابع إلى السادس عشر، وتعمل برعاية جمعية البرديات العربية كشريك لبرنامج تريسمغستوس."
  en: "The Arabic Papyrology Database — LMU Munich's compilation of editions and research on pre-modern Arabic documents on papyrus, parchment and paper, 13,586 documents (4,476 full texts) from the 7th to 16th centuries, run under ISAP patronage as a Trismegistos partner."
