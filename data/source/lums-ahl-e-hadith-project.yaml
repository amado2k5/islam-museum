summary:
  ar: "صفحة مشروع الأرشيف الرقمي لأهل الحديث في جامعة لاهور للعلوم الإدارية (LUMS) عن ثناء الله الأمرتسري؛ تصفه بأنه شخصية فكرية بارزة وتذكر انتماءه إلى مذهب أهل الحديث، وتلخص صحيفته الأسبوعية «أهل الحديث» (1903-1947) وهجرته ووفاته في سرغودها في 15 مارس 1948."
  en: "Page of the Lahore University of Management Sciences (LUMS) Ahl-e-Hadith digital archive project on Sanaullah Amritsari; it describes him as a prominent intellectual figure, states his affiliation with the Ahl-i-Hadis denomination, and summarises his weekly journal Ahl-i-Hadis (1903–1947), his migration and his death at Sargodha on 15 March 1948."
