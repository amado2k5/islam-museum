summary:
  ar: "صفحة مشروع الأرشيف الرقمي لأهل الحديث في جامعة لاهور للعلوم الإدارية (LUMS) عن ثناء الله الأمرتسري؛ تصفه بأنه شخصية فكرية بارزة وتذكر انتماءه إلى مذهب أهل الحديث، وتلخص صحيفته الأسبوعية «أهل الحديث» (1903-1947) وهجرته ووفاته في سرغودها في 15 مارس 1948."
  en: "Page of the Lahore University of Management Sciences (LUMS) Ahl-e-Hadith digital archive project on Sanaullah Amritsari; it describes him as a prominent intellectual figure, states his affiliation with the Ahl-i-Hadis denomination, and summarises his weekly journal Ahl-i-Hadis (1903–1947), his migration and his death at Sargodha on 15 March 1948."
  es: "Página del proyecto de archivo digital Ahl-e-Hadith de la Universidad de Ciencias de la Gestión de Lahore (LUMS) sobre Sanaullah Amritsari; lo describe como una figura intelectual destacada, indica su afiliación a la denominación Ahl-i-Hadis y resume su revista semanal Ahl-i-Hadis (1903-1947), su migración y su muerte en Sargodha el 15 de marzo de 1948."
  fr: "Page du projet d'archives numériques Ahl-e-Hadith de l'Université des sciences de gestion de Lahore (LUMS) sur Sanaullah Amritsari; elle le décrit comme une figure intellectuelle importante, indique son affiliation à la dénomination Ahl-i-Hadis et résume son journal hebdomadaire Ahl-i-Hadis (1903-1947), sa migration et sa mort à Sargodha le 15 mars 1948."
  ur: "لاہور یونیورسٹی آف مینجمنٹ سائنسز (LUMS) کے ثناء اللہ امرتسری پر اہل حدیث ڈیجیٹل آرکائیو پروجیکٹ کا صفحہ؛ اس میں انہیں ایک ممتاز دانشور شخصیت کے طور پر بیان کیا گیا ہے، اہلحدیث فرقے سے ان کی وابستگی بیان کی گئی ہے، اور اس کے ہفتہ وار جریدے اہلحدیث (1903-1947)، ان کی ہجرت اور 15 مارچ 1948 کو سرگودھا میں ان کی وفات کا خلاصہ کیا گیا ہے۔"
  tr: "Lahor İdari Bilimler Üniversitesi'nde (LUMS) Thanaullah Amritsari hakkında düzenlenen Ehlül-Hadisler için Dijital Arşiv Projesi'nin sayfası; onu önde gelen bir entelektüel figür olarak tanımlar ve Ehl-al-Hadis okuluyla olan bağlantısından bahseder. Haftalık gazetesi 'Ehlül-Hadis' (1903-1947), 15 Mart 1948'de Sargodha'daki göçü ve ölümünü özetler."
  id: "Halaman Proyek Arsip Digital untuk Ahl al-Hadith di Universitas Ilmu Administrasi Lahore (LUMS) tentang Thanaullah Amritsari; menggambarkannya sebagai tokoh intelektual terkemuka dan menyebutkan keterlibatannya dengan mazhab Ahl al-Hadith. Surat kabar mingguannya 'Ahl al-Hadith' (1903-1947) merangkum migrasi dan kematiannya di Sargodha pada 15 Maret 1948."
