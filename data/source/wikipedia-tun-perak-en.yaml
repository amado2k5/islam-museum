  ar: "مقالة ويكيبيديا الإنجليزية عن تون بيراك (ت. 1498)، خامس بنداهارا (رئيس وزراء) لسلطنة ملقا وأشهرهم؛ خدم أربعة سلاطين من 1456 إلى 1498، وردّ الهجومين السياميين على ملقا، وقاد توسعها في شبه جزيرة الملايو وأرخبيل رياو، ورفض الانتقام من السلطان محمود شاه لقتل ابنه."
  en: "English Wikipedia article on Tun Perak (d. 1498), fifth and most famous bendahara (chief minister) of the Malacca Sultanate; he served four sultans from 1456 to 1498, repelled the Siamese attacks on Malacca, led its expansion across the Malay Peninsula and the Riau archipelago, and refused revenge against Sultan Mahmud Shah for the killing of his son."
