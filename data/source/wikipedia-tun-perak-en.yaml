reliability_note: "Read in full on 1 November 2026. A short article resting on a Malaysian school history textbook (Ahmad Fauzi et al., DBP, 2004) and the archived Sejarah Malaysia portal, themselves reporting the Malay Annals tradition. It gives no birth year and no religion. It calls him the son of Malacca's first bendahara, Sri Wak Raja Tun Perpatih Besar, while the Malay edition names his father as Tun Perpatih Sedang, the Bendahara Seri Wak Raja — the two namings of the Seri Wak Raja line are both preserved in the record, and no genealogy source independent of the Annals tradition was read. His death year 1498 is shared with the Malay edition and Wikidata."
