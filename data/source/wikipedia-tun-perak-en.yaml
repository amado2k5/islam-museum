summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تون بيراك ⁦(ت. 1498)⁩، خامس بنداهارا ⁦(رئيس وزراء)⁩ لسلطنة ملقا وأشهرهم؛ خدم أربعة سلاطين من 1456 إلى 1498، وردّ الهجومين السياميين على ملقا، وقاد توسعها في شبه جزيرة الملايو وأرخبيل رياو، ورفض الانتقام من السلطان محمود شاه لقتل ابنه."
  en: "English Wikipedia article on Tun Perak (d. 1498), fifth and most famous bendahara (chief minister) of the Malacca Sultanate; he served four sultans from 1456 to 1498, repelled the Siamese attacks on Malacca, led its expansion across the Malay Peninsula and the Riau archipelago, and refused revenge against Sultan Mahmud Shah for the killing of his son."
  es: "Artículo de la Wikipedia en inglés sobre Tun Perak (fallecido en 1498), quinto y más famoso bendahara (primer ministro) del Sultanato de Malaca; sirvió a cuatro sultanes desde 1456 hasta 1498, repelió los ataques siameses contra Malaca, dirigió su expansión a través de la península malaya y el archipiélago de Riau, y se negó a vengarse del sultán Mahmud Shah por el asesinato de su hijo."
  fr: "Article de Wikipédia en anglais sur Tun Perak (décédé en 1498), cinquième et plus célèbre bendahara (premier ministre) du sultanat de Malacca; il a servi quatre sultans de 1456 à 1498, a repoussé les attaques siamoises contre Malacca, a mené son expansion à travers la péninsule malaise et l'archipel de Riau, et a refusé de se venger du sultan Mahmud Shah pour le meurtre de son fils."
  ur: "انگلش ویکیپیڈیا کا مضمون ٹون پراک ⁦(متوفی 1498)⁩، ملاکا سلطنت کا پانچواں اور سب سے مشہور بیندہارا ⁦(وزیر اعلیٰ)⁩؛ اس نے 1456 سے 1498 تک چار سلطانوں کی خدمت کی، ملاکا پر سیامی حملوں کو پسپا کیا، جزیرہ نما مالائی اور ریاؤ جزیرہ نما میں اس کی توسیع کی قیادت کی، اور سلطان محمود شاہ سے اپنے بیٹے کے قتل کا بدلہ لینے سے انکار کر دیا۔"
  tr: "Malakka Sultanlığı'nın beşinci ve en ünlü (Başbakanı) Tun Perak (ö. 1498) hakkında İngilizce Wikipedia makalesi; 1456'dan 1498'e kadar dört sultana hizmet etti, Malakka'ya yapılan iki Siam saldırısına yanıt verdi, Malay Yarımadası ve Riau Takımadaları'na yayılmasını yönetti ve oğlunu öldüren Sultan Mahmud Şah'ın intikamını almayı reddetti."
  id: "Artikel Wikipedia bahasa Inggris tentang Tun Perak (wafat 1498), Perdana Menteri kelima dan paling terkenal dari Kesultanan Malaka; ia melayani empat sultan dari tahun 1456 hingga 1498, menanggapi dua serangan Siam di Malaka, memimpin ekspansi sultan ke Semenanjung Melayu dan Kepulauan Riau, serta menolak membalas dendam atas kematian Sultan Mahmud Shah karena membunuh putranya."
