summary:
  ar: "صفحة ويكي حسين عن حسين أنصاريان: تصفه بأنه رجل دين شيعي إثنا عشري أصولي في إيران، مولود في 9 نوفمبر 1944 في خوانسار، أسّس مركز دار العرفان العلمي في قم سنة 1998، ودرّس تفسير القرآن ونهج البلاغة والفقه في حوزة قم."
  en: "The WikiHussain page on Hossein Ansarian: it describes him as a Usuli Twelver Shia cleric in Iran, born on 9 November 1944 in Khvansar, founder of the Dar al-Irfan Scientific Research Center in Qom in 1998, and a teacher of Qur'an interpretation, Nahj al-Balagha and fiqh at the Qom seminary."
  es: "La página de WikiHussain sobre Hossein Ansarian lo describe como un clérigo chiíta duodecimano usuli en Irán, nacido el 9 de noviembre de 1944 en Khvansar, fundador del Centro de Investigación Científica Dar al-Irfan en Qom en 1998 y profesor de interpretación del Corán, Nahj al-Balagha y fiqh en el seminario de Qom."
  fr: "La page WikiHussain sur Hossein Ansarian: il est décrit comme un religieux chiite duodécimain usuli en Iran, né le 9 novembre 1944 à Khvansar, fondateur du Centre de recherche scientifique Dar al-Irfan à Qom en 1998, et professeur d'interprétation du Coran, de Nahj al-Balagha et de fiqh au séminaire de Qom."
  ur: "حسین انصاری پر وکی حسین کا صفحہ: اس میں انہیں ایران میں ایک اُسولی بارہویں شیعہ عالم کے طور پر بیان کیا گیا ہے، جو 9 نومبر 1944 کو خوانسر میں پیدا ہوئے، 1998 میں قم میں دارالعرفان سائنسی تحقیقی مرکز کے بانی، اور نہج البلاغہ اور قم میں قرآن کی تفسیر کے استاد تھے۔"
