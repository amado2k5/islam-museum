summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بلال فيليبس: وُلد باسم دنيس برادلي فيليبس في كينغستون بجامايكا في 17 يوليو 1947، واعتنق الإسلام سنة 1972، ودرس في الجامعة الإسلامية بالمدينة المنورة وجامعة الملك سعود وجامعة ويلز، وأسس الجامعة الإسلامية المفتوحة عبر الإنترنت ويقيم في قطر؛ ويذكر صندوق معلوماتها مذهبه سنيا وحركته سلفية."
  en: "The English Wikipedia article on Bilal Philips: born Dennis Bradley Philips in Kingston, Jamaica, on 17 July 1947; converted to Islam in 1972; studied at the Islamic University of Madinah, King Saud University and the University of Wales; founder and chancellor of the International Open University, living in Qatar. Its infobox gives his denomination as Sunni and his movement as Salafi, and its lead describes him as a Salafi, citing Duderija and Rasool (2019)."
  es: "El artículo de Wikipedia en inglés sobre Bilal Philips: nacido Dennis Bradley Philips en Kingston, Jamaica, el 17 de julio de 1947; convertido al islam en 1972; estudió en la Universidad Islámica de Medina, la Universidad Rey Saud y la Universidad de Gales; fundador y rector de la Universidad Abierta Internacional, residente en Qatar. Su ficha informativa indica que es sunita y que pertenece al movimiento salafista, y su introducción lo describe como salafista, citando a Duderija y Rasool (2019)."
  fr: "L'article de Wikipédia en anglais consacré à Bilal Philips: né Dennis Bradley Philips à Kingston, en Jamaïque, le 17 juillet 1947; converti à l'islam en 1972; a étudié à l'Université islamique de Médine, à l'Université du Roi Saoud et à l'Université du Pays de Galles; fondateur et chancelier de l'Université internationale ouverte, il réside au Qatar. Son infobox indique qu'il est sunnite et que son mouvement est salafiste, et son introduction le décrit comme salafiste, citant Duderija et Rasool (2019)."
