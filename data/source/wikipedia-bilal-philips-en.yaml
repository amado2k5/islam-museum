summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بلال فيليبس: وُلد باسم دنيس برادلي فيليبس في كينغستون بجامايكا في 17 يوليو 1947، واعتنق الإسلام سنة 1972، ودرس في الجامعة الإسلامية بالمدينة المنورة وجامعة الملك سعود وجامعة ويلز، وأسس الجامعة الإسلامية المفتوحة عبر الإنترنت ويقيم في قطر؛ ويذكر صندوق معلوماتها مذهبه سنيا وحركته سلفية."
  en: "The English Wikipedia article on Bilal Philips: born Dennis Bradley Philips in Kingston, Jamaica, on 17 July 1947; converted to Islam in 1972; studied at the Islamic University of Madinah, King Saud University and the University of Wales; founder and chancellor of the International Open University, living in Qatar. Its infobox gives his denomination as Sunni and his movement as Salafi, and its lead describes him as a Salafi, citing Duderija and Rasool (2019)."
