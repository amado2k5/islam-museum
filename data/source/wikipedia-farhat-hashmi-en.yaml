  en: "English Wikipedia article on Farhat Hashmi; used for entity facts only. A Pakistani-Canadian Islamic scholar and preacher born in Sargodha in 1957, with a PhD from the University of Glasgow, who founded the Al-Huda International Welfare Foundation in 1994 to teach women the Qur'an and Hadith, and emigrated to Canada in 2005."
