reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision (oldid=1360933955; revision equality asserted). It gives her born in Sargodha, Punjab, on 22 December 1957; a master's in Arabic from the University of Punjab and a PhD in Islamic studies from the University of Glasgow; lecturer and assistant professor posts at the International Islamic University, Islamabad; the founding of Al-Huda International in 1994 and of its Mississauga institute in 2004; her emigration to Canada in 2005; and her television preaching on Geo TV. On affiliation it gives the infobox religion as Islam with the creed field blank; its categories file her under 'Canadian Salafis' and 'Pakistani Salafis'; it reports that liberal critics such as Raheel Raza have termed her a 'Wahhabi', and, citing Akbar Ahmed's Journey into Islam (2007), that Hashmi and Al-Huda state they do not follow any particular sect of contemporary Islam and refer to themselves simply as Muslims. Her father is described as a scholar and a local leader of Jamaat-e-Islami Pakistan — family background."
