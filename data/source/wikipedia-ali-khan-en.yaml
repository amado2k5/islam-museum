summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بير مرشد محمد علي خان (1881–1958)، وتنص في متنها على أنه قاد الحركة الصوفية العالمية من سنة 1948 حتى وفاته، وأنه كان موسيقيًا مدربًا في الموسيقى الهندية والأوروبية ظهر على مسرح لا سكالا، وأن أصدقاءه ومريديه تلقوا الشفاء بلمسته ونظرته ودعائه."
  en: "The English Wikipedia article on Pir-o-Murshid Muhammad Ali Khan (1881–1958), which states in its text that he led the International Sufi Movement from 1948 until his death, that he was a musician trained in Indian and European music who appeared on the stage of La Scala, and that friends and mureeds (disciples) received healing through his touch, glance and prayers."
  es: "El artículo de la Wikipedia en inglés sobre Pir-o-Murshid Muhammad Ali Khan (1881-1958), que afirma en su texto que dirigió el Movimiento Sufí Internacional desde 1948 hasta su muerte, que fue un músico formado en música india y europea que apareció en el escenario de La Scala, y que amigos y mureeds (discípulos) recibieron sanación a través de su toque, mirada y oraciones."
  fr: "L'article de Wikipédia en anglais sur Pir-o-Murshid Muhammad Ali Khan (1881-1958), qui indique dans son texte qu'il a dirigé le Mouvement soufi international de 1948 jusqu'à sa mort, qu'il était un musicien formé à la musique indienne et européenne qui s'est produit sur la scène de La Scala, et que ses amis et ses disciples ont reçu la guérison par son toucher, son regard et ses prières."
