summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بير مرشد محمد علي خان (1881–1958)، وتنص في متنها على أنه قاد الحركة الصوفية العالمية من سنة 1948 حتى وفاته، وأنه كان موسيقيًا مدربًا في الموسيقى الهندية والأوروبية ظهر على مسرح لا سكالا، وأن أصدقاءه ومريديه تلقوا الشفاء بلمسته ونظرته ودعائه."
  en: "The English Wikipedia article on Pir-o-Murshid Muhammad Ali Khan (1881–1958), which states in its text that he led the International Sufi Movement from 1948 until his death, that he was a musician trained in Indian and European music who appeared on the stage of La Scala, and that friends and mureeds (disciples) received healing through his touch, glance and prayers."
