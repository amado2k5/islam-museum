reliability_note: "Entity facts taken only where the article cites a source: founded 1986 by the Mecca-based Pakistani scholar Abdul Malik Mujahid (not the Chicago-based person of the same name in the museum), from a single retail outlet in Saudi Arabia to 35 countries and 32 stores (its UAE website); printing mainly in Sheikhupura; over 1,500 books by March 2017 (Saudi Gazette); more than 64 books on the Prophet's life and translations in 29 languages, and the six hadith collections in English in 38 volumes and 20,780 pages (islamic-sources.com); an 11-volume English sira encyclopedia in 2012 (Saudi Gazette); second-largest publisher of scripture translations after the King Fahd Complex after its Punjabi Qur'an, November 2020 (Daily Pakistan Global); a 2021 agreement with Dubai Media Incorporated (Trade Arabia). Its revenue estimate and promotional claims are not used. Wikidata Q17001975; articles in bn, en, ur. Read in Chrome on 6 November 2026."
