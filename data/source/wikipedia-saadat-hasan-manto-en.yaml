  ar: "مقالة ويكيبيديا الإنجليزية عن سعادت حسن منتو؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في بابروادي قرب سامرالا في 11 أيار 1912 في أسرة مسلمة بنجابية كشميرية الأصل، ووفاته في لاهور في 18 كانون الثاني 1955 ودفنه في مقبرة مياني صاحب، وأعماله القصصية ومحاكماته الست بتهمة الفحش وهجرته إلى باكستان سنة 1948."
  en: "English Wikipedia article on Saadat Hasan Manto; used for entity facts only. It gives his birth at Paprodi near Samrala on 11 May 1912 into a Punjabi Muslim family of Kashmiri ancestry, his death at Lahore on 18 January 1955 and burial in Miani Sahib graveyard, his short-story collections, his six obscenity trials and his 1948 migration to Pakistan."
