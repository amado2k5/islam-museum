summary:
  ar: "مقالة ويكيبيديا الفرنسية عن سرين بابكر سي (1885–1957)، أول خليفة عام للتيجانية في السنغال بعد والده الحاج مالك سي؛ تُستخدم لوقائع الكيان فقط. تروي خلافته لوالده سنة 1922 وتأسيسه الظواهر ⁦(الداهرات)⁩ ووفاته في تيفاوان."
  en: "French Wikipedia article on Serigne Babacar Sy (1885-1957), first khalifa-general of the Tijaniyya in Senegal after his father El Hadj Malick Sy; used for entity facts only. It recounts his succession to his father in 1922, his founding of the dahiras, and his death at Tivaouane."
  es: "Artículo de la Wikipedia en francés sobre Serigne Babacar Sy (1885-1957), primer califa general de la Tijaniyya en Senegal tras su padre, El Hadj Malick Sy; utilizado únicamente para datos sobre la entidad. Relata su sucesión al trono paterno en 1922, la fundación de las dahiras y su fallecimiento en Tivaouane."
  fr: "Article de Wikipédia en français sur Serigne Babacar Sy (1885-1957), premier calife général de la Tijaniyya au Sénégal après son père El Hadj Malick Sy; utilisé uniquement à des fins d’information sur l’entité. Il relate sa succession à son père en 1922, la fondation des dahiras et sa mort à Tivaouane."
  ur: "Serigne Babacar Sy (1885-1957) پر فرانسیسی ویکیپیڈیا کا مضمون، سینیگال میں تیجانیہ کا پہلا خلیفہ جنرل اپنے والد الحاج ملک سائی کے بعد؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1922 میں ان کے والد کے بعد ان کی جانشینی، ان کی داہروں کی بنیاد، اور Tivaouane میں ان کی موت کا ذکر ہے۔"
  tr: "Sirine Babiker Si (1885–1957) hakkında, babası Hac Malik Si'den sonra Senegal'de Tijaniyya'nın ilk genel halifesi olan Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. 1922'de babasına geçişini, Dahirat'ın kuruluşunu ve Tifaouane'deki ölümünü anlatır."
  id: "Artikel Wikipedia Prancis tentang Sirine Babiker Si (1885–1957), khalifah umum pertama Tijaniyya di Senegal setelah ayahnya Hajj Malik Si; hanya digunakan untuk fakta entitas. Artikel ini menceritakan suksesi ayahnya pada tahun 1922, pendirian Dahirat, dan kematiannya di Tifaouane."
