reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id via the MediaWiki API and the returned id asserted equal. This is the only Wikipedia article on him in any language. It gives his birth in 1885 at Saint-Louis and his death on 25 March 1957 at Tivaouane, and describes him throughout by office and descent — community head and Tidjane leader, his father's khalifa from 1922, founder of the dahira associations in 1932. No sentence in it states his own initiation or discipleship in the order, and it names no school for him; his works on Ahmad Tijani and on his father are authorship, not an attestation."
