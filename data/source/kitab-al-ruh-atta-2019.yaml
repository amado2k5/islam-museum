summary:
  ar: "كتاب الروح لابن قيم الجوزية ⁦(691–751هـ)⁩ بتحقيق محمد أجمل أيوب الإصلاحي وكمال بن محمد قالمي، الطبعة الثالثة لدار عطاءات العلم سنة 1440هـ ⁦(2019م)⁩، وهي تعيد نشر طبعة دار ابن حزم الأولى {cite:kitab-al-ruh-atta-2019 p. 1} {cite:kitab-al-ruh-atta-2019 p. 2}."
  en: "Ibn Qayyim al-Jawziyya's Kitab al-Ruh (691–751 AH), edited by Muhammad Ajmal Ayyub al-Islahi and Kamal ibn Muhammad Qalmi, third edition of Dar Atta'at al-Ilm, 1440 AH (2019 CE), which reissues the first edition of Dar Ibn Hazm {cite:kitab-al-ruh-atta-2019 p. 1} {cite:kitab-al-ruh-atta-2019 p. 2}."
  ur: "ابن قیم الجوزیہ کی کتاب الروح ⁦(691 تا 751ھ)⁩، محمد اجمل ایوب الاصلاحی اور کمال بن محمد قالمی کی تحقیق کے ساتھ، دار عطاءات العلم کا تیسرا ایڈیشن، 1440ھ ⁦(2019ء)⁩، جو دار ابن حزم کے پہلے ایڈیشن کی دوبارہ اشاعت ہے {cite:kitab-al-ruh-atta-2019 p. 1} {cite:kitab-al-ruh-atta-2019 p. 2}۔"
