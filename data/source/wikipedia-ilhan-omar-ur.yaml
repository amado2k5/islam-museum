summary:
  ar: "مقالة ويكيبيديا الأردية عن إلهان عمر، مراجعة 1 أكتوبر 2026؛ تُستخدم لوقائع الكيان فقط. تذكر ميلادها في مقديشو في 4 أكتوبر 1981، وهو ما يخالف الإنجليزية وويكيداتا (1982)، وتذكر أنها أول صومالية وأول مسلمة ترتدي الحجاب في الكونغرس."
  en: "Urdu Wikipedia article on Ilhan Omar, revision of 1 October 2026; used for entity facts only. It gives her birth in Mogadishu on 4 October 1981 — against the English article and Wikidata (1982) — and notes she was the first Somali and the first hijab-wearing Muslim in Congress."
  es: "Artículo de Wikipedia en urdu sobre Ilhan Omar, revisión del 1 de octubre de 2026; utilizado únicamente para datos sobre la persona. Indica que nació en Mogadiscio el 4 de octubre de 1981 —en contradicción con el artículo en inglés y Wikidata (1982)— y señala que fue la primera somalí y la primera musulmana en usar hiyab en el Congreso."
  fr: "Article de Wikipédia en ourdou sur Ilhan Omar, mis à jour le 1er octobre 2026; utilisé uniquement à titre informatif. Il indique sa naissance à Mogadiscio le 4 octobre 1981 — contrairement à l’article en anglais et à Wikidata (1982) — et précise qu’elle fut la première Somalienne et la première musulmane portant le hijab à siéger au Congrès."
  ur: "الہان عمر پر اردو ویکیپیڈیا کا مضمون، یکم اکتوبر 2026 کی نظر ثانی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش 4 اکتوبر 1981 کو موغادیشو میں ہوئی — انگریزی مضمون اور Wikidata (1982) کے خلاف — اور نوٹ کرتی ہے کہ وہ کانگریس میں پہلی صومالی اور پہلی حجاب پہننے والی مسلمان تھیں۔"
  tr: "Ilhan Omar hakkında Urduca Vikipedi makalesi, revizyon 1 Ekim 2026; sadece varlık bilgileri için kullanılmıştır. 4 Ekim 1981'de Mogadişu'da doğduğu anılmaktadır, bu İngilizce ve Wikidata (1982) ile çelişmektedir ve Kongre'de başörtüsü takan ilk Somalili ve ilk Müslüman kadın olarak anılır."
  id: "Artikel Wikipedia Urdu tentang Ilhan Omar, revisi 1 Oktober 2026; digunakan hanya untuk fakta entitas. Dia disebutkan lahir di Mogadishu pada 4 Oktober 1981, yang bertentangan dengan bahasa Inggris dan Wikidata (1982), dan dia disebut sebagai wanita Somalia pertama dan wanita Muslim pertama yang mengenakan hijab di Kongres."
