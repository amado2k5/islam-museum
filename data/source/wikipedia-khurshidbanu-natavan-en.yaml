  ar: "مقالة ويكيبيديا الإنجليزية عن خورشيدبانو ناتوان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في شوشا في 6 أغسطس 1832 في صدرها و5 أغسطس في متنها، ووفاتها في 2 أكتوبر 1897، وتأسيسها «مجلس الأنس» (1864)، وخط ماء شوشا (1872)، وخيول قره باغ، وقبرها المدمَّر في آقدام. لا تذكر شيئًا عن مذهبها الشخصي."
  en: "English Wikipedia article on Khurshidbanu Natavan; used for entity facts only. It gives her birth at Shusha as 6 August 1832 in its lead and 5 August 1832 in its Life section, her death on 2 October 1897, her founding of the Majlis-i Uns (1864), the Shusha water main (1872), her Karabakh horses, and the destruction of her Aghdam tomb. It makes no statement about her personal school of religion."
