summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خورشيدبانو ناتوان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في شوشا في 6 أغسطس 1832 في صدرها و5 أغسطس في متنها، ووفاتها في 2 أكتوبر 1897، وتأسيسها «مجلس الأنس» (1864)، وخط ماء شوشا (1872)، وخيول قره باغ، وقبرها المدمَّر في آقدام. لا تذكر شيئًا عن مذهبها الشخصي."
  en: "English Wikipedia article on Khurshidbanu Natavan; used for entity facts only. It gives her birth at Shusha as 6 August 1832 in its lead and 5 August 1832 in its Life section, her death on 2 October 1897, her founding of the Majlis-i Uns (1864), the Shusha water main (1872), her Karabakh horses, and the destruction of her Aghdam tomb. It makes no statement about her personal school of religion."
  es: "Artículo de la Wikipedia en inglés sobre Khurshidbanu Natavan; utilizado únicamente para datos sobre la persona. En su introducción, indica que nació en Shusha el 6 de agosto de 1832, y en su sección de Vida, el 5 de agosto de 1832; falleció el 2 de octubre de 1897; fundó el Majlis-i Uns (1864); construyó la tubería principal de agua de Shusha (1872); conservó sus caballos de Karabaj; y destruyó su tumba en Aghdam. No menciona su escuela religiosa personal."
  fr: "L'article de Wikipédia en anglais consacré à Khurshidbanu Natavan, utilisé uniquement pour les informations la concernant, indique sa naissance à Choucha le 6 août 1832 dans son introduction et le 5 août 1832 dans sa biographie, sa mort le 2 octobre 1897, la fondation du Majlis-i Uns (1864), la construction de la conduite d'eau principale de Choucha (1872), ses chevaux du Karabakh et la destruction de son tombeau d'Aghdam. Il ne mentionne pas son école religieuse personnelle."
