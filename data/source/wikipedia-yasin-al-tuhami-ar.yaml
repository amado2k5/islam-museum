summary:
  ar: "مقالة ويكيبيديا العربية ⁦(بذرة)⁩ عن المنشد ياسين التهامي؛ لوقائع الكيان فقط: مولده في الحواتكة بمنفلوط في أسيوط في 6 ديسمبر ⁦(1948 في المتن و1949 في الصندوق)⁩، ودراسته في المعاهد الأزهرية حتى الثانية الثانوية في 1970، وحفله في دار الأوبرا كامل العدد ⁦(اليوم السابع، مارس 2024)⁩."
  en: "Arabic Wikipedia stub on the munshid Yasin al-Tuhami; entity facts only: birth at al-Hawatka, Manfalut, Asyut on 6 December (1948 in the text, 1949 in the infobox), study at the Azhari institutes up to the second secondary year in 1970, and a sold-out concert at the Cairo Opera House (Youm7, March 2024)."
  es: "Breve entrada en la Wikipedia en árabe sobre el munshid Yasin al-Tuhami; solo datos sobre la persona: nacimiento en al-Hawatka, Manfalut, Asyut el 6 de diciembre (1948 en el texto, 1949 en el recuadro informativo), estudios en los institutos Azhari hasta el segundo año de secundaria en 1970 y un concierto con entradas agotadas en la Ópera de El Cairo (Youm7, marzo de 2024)."
  fr: "Ébauche de l'article Wikipédia arabe sur le munshid Yasin al-Tuhami; informations sur l'entité uniquement: naissance à al-Hawatka, Manfalut, Asyut le 6 décembre (1948 dans le texte, 1949 dans l'infobox), études dans les instituts Azhari jusqu'à la deuxième année du secondaire en 1970, et un concert à guichets fermés à l'Opéra du Caire (Youm7, mars 2024)."
