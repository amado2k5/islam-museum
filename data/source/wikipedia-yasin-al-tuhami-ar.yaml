summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u2066(\u0628\u0630\u0631\u0629)\u2069 \u0639\u0646 \u0627\u0644\u0645\u0646\u0634\u062f \u064a\u0627\u0633\u064a\u0646 \u0627\u0644\u062a\u0647\u0627\u0645\u064a\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u0627\u0644\u062d\u0648\u0627\u062a\u0643\u0629 \u0628\u0645\u0646\u0641\u0644\u0648\u0637 \u0641\u064a \u0623\u0633\u064a\u0648\u0637 \u0641\u064a 6 \u062f\u064a\u0633\u0645\u0628\u0631 \u2066(1948 \u0641\u064a \u0627\u0644\u0645\u062a\u0646 \u06481949 \u0641\u064a \u0627\u0644\u0635\u0646\u062f\u0648\u0642)\u2069\u060c \u0648\u062f\u0631\u0627\u0633\u062a\u0647 \u0641\u064a \u0627\u0644\u0645\u0639\u0627\u0647\u062f \u0627\u0644\u0623\u0632\u0647\u0631\u064a\u0629 \u062d\u062a\u0649 \u0627\u0644\u062b\u0627\u0646\u064a\u0629 \u0627\u0644\u062b\u0627\u0646\u0648\u064a\u0629 \u0641\u064a 1970\u060c \u0648\u062d\u0641\u0644\u0647 \u0641\u064a \u062f\u0627\u0631 \u0627\u0644\u0623\u0648\u0628\u0631\u0627 \u0643\u0627\u0645\u0644 \u0627\u0644\u0639\u062f\u062f \u2066(\u0627\u0644\u064a\u0648\u0645 \u0627\u0644\u0633\u0627\u0628\u0639\u060c \u0645\u0627\u0631\u0633 2024)\u2069."
  en: "Arabic Wikipedia stub on the munshid Yasin al-Tuhami; entity facts only: birth at al-Hawatka, Manfalut, Asyut on 6 December (1948 in the text, 1949 in the infobox), study at the Azhari institutes up to the second secondary year in 1970, and a sold-out concert at the Cairo Opera House (Youm7, March 2024)."
