summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن عبد المعز ⁦(بعنوان «Abdoel Moeis»)⁩؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في سونغاي بوار في 3 تموز ووفاته في باندونغ في 17 حزيران 1959 ودفنه في مقبرة تشيكورتا، وتروي مسيرته في شريكة الإسلام ونفيه إلى غاروت وكتابته «صلاح أسوهان» وحياته الأسرية. صندوقها متناقض داخليًا: الميلاد 1886 بينما قالب الوفاة يحسب العمر من 1883، وأول مرجع فيها كتاب موسوعي يعنونه (1883–1959)."
  en: "Indonesian Wikipedia article on Abdul Muis (titled 'Abdoel Moeis'); used for entity facts only. It gives his birth at Sungai Puar on 3 July, his death at Bandung on 17 June 1959 and his burial at Cikutra cemetery, and recounts his Sarekat Islam career, his Garut exile, the writing of Salah Asuhan, and his family life. Its infobox is internally inconsistent: the birth field gives 1886 while the death template computes his age from 1883, and its first citation is an encyclopedia volume titled 'Abdul Moeis (1883–1959)'."
  es: "Artículo de la Wikipedia en indonesio sobre Abdul Muis (titulado «Abdoel Moeis»); utilizado únicamente para datos de la entidad. Indica su nacimiento en Sungai Puar el 3 de julio, su fallecimiento en Bandung el 17 de junio de 1959 y su entierro en el cementerio de Cikutra, y relata su trayectoria en Sarekat Islam, su exilio en Garut, la obra de Salah Asuhan y su vida familiar. Su ficha informativa presenta inconsistencias internas: el campo de nacimiento indica 1886, mientras que la plantilla de defunción calcula su edad a partir de 1883, y su primera cita es un volumen de enciclopedia titulado «Abdul Moeis (1883–1959)»."
  fr: "L'article de Wikipédia indonésien consacré à Abdul Muis (intitulé « Abdoel Moeis ») est utilisé uniquement pour les informations le concernant. Il indique sa naissance à Sungai Puar le 3 juillet, son décès à Bandung le 17 juin 1959 et son inhumation au cimetière de Cikutra. L'article relate également son parcours au sein de Sarekat Islam, son exil à Garut, les écrits de Salah Asuhan et sa vie familiale. Son infobox présente des incohérences: le champ « naissance » indique 1886, tandis que le modèle de date de décès calcule son âge à partir de 1883. De plus, sa première citation est un volume d'encyclopédie intitulé « Abdul Moeis (1883–1959) »."
  ur: "انڈونیشیائی ویکیپیڈیا پر عبدالموسی کا مضمون ⁦(عنوان 'عبدول موئس')⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 3 جولائی کو سنگائی پور میں ان کی پیدائش، 17 جون 1959 کو بنڈونگ میں ان کی موت اور سکوترہ قبرستان میں ان کی تدفین، اور اس کے سراکت اسلام کیرئیر، اس کی گاروت جلاوطنی، صلاح اسوہان کی تحریر اور ان کی خاندانی زندگی کا ذکر کرتا ہے۔ اس کا معلومات خانہ اندرونی طور پر متضاد ہے: پیدائش کا میدان 1886 دیتا ہے جب کہ موت کا سانچہ اس کی عمر 1883 سے شمار کرتا ہے، اور اس کا پہلا حوالہ ایک انسائیکلوپیڈیا والیوم ہے جس کا عنوان 'عبدالموئیس (1883-1959)' ہے۔"
  tr: "Abdul Moiz hakkında Endonezya Vikipedi makalesi (\"Abdoel Moeis\" başlığıyla); yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 3 Temmuz'da Songhai Buar'da, 17 Haziran 1959'da Bandung'da ölümünü ve Chikurta mezarlığında defnedilmesini anlatır; Sharika Islam'daki yolculuğunu, Garut'a sürgününü, \"Salah Asuhan\" adlı yazısını ve aile hayatını anlatır. Kutu içsel olarak çelişkilidir: doğum 1886'dır, ölüm şablonu ise 1883'ten itibaren yaşı sayar ve ilk referansı (1883–1959) adlı ansiklopedik bir kitaptır."
  id: "Artikel Wikipedia Indonesia tentang Abdul Moiz (berjudul \"Abdoel Moeis\"); hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya di Songhai Buar pada 3 Juli, kematiannya di Bandung pada 17 Juni 1959, dan pemakamannya di pemakaman Chikurta, menceritakan perjalanannya dalam Islam Syariah, pengasingannya ke Garut, tulisannya \"Salah Asuhan,\" dan kehidupan keluarganya. Kotaknya secara internal bertentangan: kelahirannya tahun 1886, sementara pola kematian menghitung usia dari 1883, dan referensi pertamanya adalah sebuah buku ensiklopedis berjudul (1883–1959)."
