summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن عبد المعز (بعنوان «Abdoel Moeis»)؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في سونغاي بوار في 3 تموز ووفاته في باندونغ في 17 حزيران 1959 ودفنه في مقبرة تشيكورتا، وتروي مسيرته في شريكة الإسلام ونفيه إلى غاروت وكتابته «صلاح أسوهان» وحياته الأسرية. صندوقها متناقض داخليًا: الميلاد 1886 بينما قالب الوفاة يحسب العمر من 1883، وأول مرجع فيها كتاب موسوعي يعنونه (1883–1959)."
  en: "Indonesian Wikipedia article on Abdul Muis (titled 'Abdoel Moeis'); used for entity facts only. It gives his birth at Sungai Puar on 3 July, his death at Bandung on 17 June 1959 and his burial at Cikutra cemetery, and recounts his Sarekat Islam career, his Garut exile, the writing of Salah Asuhan, and his family life. Its infobox is internally inconsistent: the birth field gives 1886 while the death template computes his age from 1883, and its first citation is an encyclopedia volume titled 'Abdul Moeis (1883–1959)'."
