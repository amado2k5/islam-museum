summary:
  ar: "مدخل «الموسوعة الإسلامية» لوقف الديانة التركي (المجلد 5، 1992) عن محمد بن يوسف الحسني (1850–1935)، محدِّث دمشق الشهير؛ يُستخدم لوقائع الكيان فقط. وُلد في دمشق في أسرة مراكشية من ذرية الشيخ الجزولي، وكان أبوه يوسف من علماء الأزهر؛ تيتم في الثانية عشرة، وأتم دراسته في دار الحديث الأشرفية وحفظ الصحيحين، ودرّس دروسًا جمعة حاشدة في الجامع الأموي، ورفض قيادة ثورة على العثمانيين في الحرب العالمية الأولى ثم خطب مؤيدًا للمقاتلين ضد الفرنسيين، وتوفي في دمشق — ويؤرّخ المدخل وفاته في 13 أغسطس 1935 حيث يعطي التراث العربي 27 ربيع الأول 1354هـ (28 يونيو 1935). ولا يسمي المدخل مذهبه الفقهي."
  en: "Entry in the Turkish Diyanet Foundation's İslâm Ansiklopedisi (vol. 5, 1992) on Muhammad ibn Yusuf al-Hasani (1850–1935), the celebrated Damascus hadith scholar; used for entity facts only. Born at Damascus into a Marrakesh family descended from al-Jazuli; his father Yusuf was an al-Azhar scholar. Orphaned at twelve, he completed his studies at the Ashrafiyya Dar al-Hadith, memorised the two Sahihs, taught crowded Friday lessons at the Umayyad Mosque, declined to lead a revolt against the Ottomans during the First World War yet preached in support of the fighters against the French, and died at Damascus. The entry dates his death 13 August 1935, where the Arabic tradition gives 27 Rabi' al-Awwal 1354 AH (28 June 1935). It does not name his legal school."
