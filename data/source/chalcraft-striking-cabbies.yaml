summary:
  ar: "كتاب جون تشالكرافت عن الحرفيين والطوائف في مصر بين 1863 و1914، من طوائف العهد العثماني المتأخر ورسومها وشيوخاتها إلى إضرابات الحرفيين في عهد الاحتلال البريطاني: طوائف الحُصُريّة ⁦(صنّاع الحصر)⁩ والزيّاتين والبنّائين والنجّارين وسائقي الحناطير، مستنداً إلى محفوظات الضرائب والصحف المصرية."
  en: "John T. Chalcraft's study of crafts and guilds in Egypt between 1863 and 1914, from the late Ottoman guilds with their dues, sheykhs and admission ceremonies to the craftsmen's strikes under British rule: the mat-makers (ta'ifat al-husriyya), the oil-pressers and their tax complaints, the builders and carpenters and their wages, and the striking cabbies, drawing on tax records and the Egyptian press."
  ur: "جان ٹی چالکرافٹ کی کتاب جو 1863 تا 1914 میں مصر کی دستکاریاں اور انجمنیں بیان کرتی ہے: سلطنت عثمانیہ کے آخری زمانے کی انجمنوں کے محصول، شیخ اور داخلہ رسوم سے لے کر برطانوی دور میں دستکاروں کی ہڑتالوں تک — چٹائی سازوں ⁦(طائفۃ الحصریہ)⁩ کی ہڑتال، تیل کولھو والوں کی محصول شکایتیں، مستریوں اور بڑھئیوں کی اجرتیں، اور ہڑتالی گاڑی بان، محصول کے دفاتر اور مصری اخبارات سے۔"
  es: "El estudio de John T. Chalcraft sobre los oficios y gremios en Egipto entre 1863 y 1914, desde los gremios otomanos tardíos con sus cuotas, jeques y ceremonias de admisión hasta las huelgas de artesanos bajo el dominio británico: los fabricantes de esteras (ta'ifat al-husriyya), los prensadores de aceite y sus quejas fiscales, los constructores y carpinteros y sus salarios, y los taxistas en huelga, basándose en registros fiscales y la prensa egipcia."
