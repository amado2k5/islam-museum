summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد بن سعيد آل مكتوم، رئيس مجموعة الإمارات ورئيس هيئة دبي للطيران المدني؛ تذكر مولده في 1 ديسمبر 1958 في دبي، ووالده سعيد بن مكتوم آل مكتوم، وشهادته من جامعة دنفر، ومسيرته في الطيران منذ 1985، وقضية زواجه من نيفين الجمل كما عرضتها المحكمة في لندن."
  en: "English Wikipedia article on Ahmed bin Saeed Al Maktoum, chairman of the Emirates Group and president of Dubai's Civil Aviation Authority; it gives his birth on 1 December 1958 in Dubai, his father Saeed bin Maktoum Al Maktoum, his University of Denver degree, his aviation career from 1985, and the Nivin El-Gamal marriage case as a London court presented it."
  es: "Artículo de la Wikipedia en inglés sobre Ahmed bin Saeed Al Maktoum, presidente del Grupo Emirates y presidente de la Autoridad de Aviación Civil de Dubái; en él se menciona su nacimiento el 1 de diciembre de 1958 en Dubái, su padre Saeed bin Maktoum Al Maktoum, su título de la Universidad de Denver, su carrera en la aviación desde 1985 y el caso del matrimonio de Nivin El-Gamal tal como lo presentó un tribunal de Londres."
  fr: "Article de Wikipédia en anglais sur Ahmed bin Saeed Al Maktoum, président du groupe Emirates et de l'Autorité de l'aviation civile de Dubaï; il mentionne sa naissance le 1er décembre 1958 à Dubaï, son père Saeed bin Maktoum Al Maktoum, son diplôme de l'Université de Denver, sa carrière dans l'aviation à partir de 1985 et l'affaire du mariage Nivin El-Gamal telle qu'elle a été présentée par un tribunal londonien."
  ur: "ایمریٹس گروپ کے چیئرمین اور دبئی کی سول ایوی ایشن اتھارٹی کے صدر احمد بن سعید المکتوم پر انگریزی ویکیپیڈیا کا مضمون؛ اس کی پیدائش 1 دسمبر 1958 کو دبئی میں ہوئی، ان کے والد سعید بن مکتوم المکتوم، ان کی یونیورسٹی آف ڈینور کی ڈگری، 1985 سے ان کا ہوابازی کیریئر، اور نیوین ال-جمال کی شادی کا مقدمہ بطور لندن کی عدالت میں پیش کیا۔"
  tr: "Emirates Group Başkanı ve Dubai Sivil Havacılık Otoritesi Başkanı Ahmed bin Saeed Al Maktoum hakkında İngilizce Wikipedia makalesi, 1 Aralık 1958'de Dubai'de doğduğunu, babası Saeed bin Maktoum Al Maktoum'u, Denver Üniversitesi'nden aldığı diplomayı, 1985'ten beri havacılık kariyerini ve Londra'daki mahkeme tarafından sunulan Nevin Al-Jamal ile evlilik davasını anmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ahmed bin Saeed Al Maktoum, Ketua Emirates Group dan Ketua Dubai Civil Aviation Authority, menyebutkan kelahirannya pada 1 Desember 1958 di Dubai, ayahnya Saeed bin Maktoum Al Maktoum, gelar dari University of Denver, karier penerbangannya sejak 1985, dan kasus pernikahannya dengan Nevin Al-Jamal yang diajukan oleh pengadilan di London."
