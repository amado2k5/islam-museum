reliability_note: "Live article version retrieved in-session via the MediaWiki API on 1 November 2026; the publisher field carries the exact revision ID it was read at. It documents his birth date and place, his father and his half-brother Rashid bin Saeed Al Maktoum, his political science degree, his chairmanship of Emirates since the airline's 1985 launch, his many Dubai posts, and his marriages — presenting the disputed 2007 El-Gamal marriage as the sources present it: he denied it, and a London court accepted that an Islamic ceremony had taken place but that it was not a valid marriage under English law. It names no religion or school for him."
