  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد بن سعيد آل مكتوم، رئيس مجموعة الإمارات ورئيس هيئة دبي للطيران المدني؛ تذكر مولده في 1 ديسمبر 1958 في دبي، ووالده سعيد بن مكتوم آل مكتوم، وشهادته من جامعة دنفر، ومسيرته في الطيران منذ 1985، وقضية زواجه من نيفين الجمل كما عرضتها المحكمة في لندن."
  en: "English Wikipedia article on Ahmed bin Saeed Al Maktoum, chairman of the Emirates Group and president of Dubai's Civil Aviation Authority; it gives his birth on 1 December 1958 in Dubai, his father Saeed bin Maktoum Al Maktoum, his University of Denver degree, his aviation career from 1985, and the Nivin El-Gamal marriage case as a London court presented it."
