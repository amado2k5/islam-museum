summary:
  ar: "مقالة ويكيبيديا الأردية عن سيد راس مسعود؛ تُستخدم لوقائع الكيان فقط. تروي سيرته التعليمية ونيابته لرئاسة جامعة عليكرة الإسلامية من سنة 1929، وصداقته مع الروائي إ. م. فورستر الذي أهداه رواية «ممر إلى الهند»."
  en: "Urdu Wikipedia article on Syed Ross Masood; used for entity facts only. It recounts his education career and his vice-chancellorship of Aligarh Muslim University from 1929, and his friendship with the novelist E. M. Forster, who dedicated A Passage to India to him."
  es: "Artículo de Wikipedia en urdu sobre Syed Ross Masood; se utiliza únicamente para obtener información sobre la persona. Narra su trayectoria académica y su cargo como vicerrector de la Universidad Musulmana de Aligarh desde 1929, así como su amistad con el novelista E. M. Forster, quien le dedicó su novela Pasaje a la India."
  fr: "Article de Wikipédia en ourdou sur Syed Ross Masood; utilisé uniquement à des fins d’information. Il relate son parcours dans l’enseignement et son mandat de vice-chancelier de l’université musulmane d’Aligarh à partir de 1929, ainsi que son amitié avec le romancier E.M. Forster, qui lui a dédié son roman « La Route des Indes »."
  ur: "سید راس مسعود پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے تعلیمی کیریئر اور 1929 سے علی گڑھ مسلم یونیورسٹی کی ان کی وائس چانسلر شپ، اور ناول نگار ای ایم فورسٹر کے ساتھ ان کی دوستی کا ذکر ہے، جنہوں نے ہندوستان کے لیے ایک راستہ ان کے لیے وقف کیا تھا۔"
  tr: "Syed Ras Massoud hakkında Urduca Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılır. Makale, onun eğitim biyografisini, 1929'daki Aligarh İslam Üniversitesi başkan yardımcılığını ve ona 'Hindistan'a Geçiş' romanını hediye eden romancı E. M. Forster ile dostluğunu anlatır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Syed Ras Massoud hanya digunakan untuk fakta-fakta entitas tersebut. Artikel ini menceritakan biografi pendidikannya, masa jabatannya sebagai wakil presiden Universitas Islam Aligarh sejak tahun 1929, dan persahabatannya dengan novelis E. M. Forster, yang memberinya novel 'Passage to India.'"
