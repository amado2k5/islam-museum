summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عزة كرم ⁦(وُلدت 1968)⁩؛ تُستخدم لوقائع الكيان فقط. تروي نشأتها في مصر والهند، ودراستها في الجامعة الأمريكية بالقاهرة وجامعة أمستردام، وعملها مستشارة أولى في برنامج الأمم المتحدة الإنمائي وصندوق الأمم المتحدة للسكان، وتأسيسها فريق العمل المشترك بين الوكالات المعني بالدين والتنمية، وانتخابها أمينة عامة لمنظمة أديان من أجل السلام سنة 2019 واستقالتها في يوليو 2023، وأستاذيتها في جامعة فريي أمستردام ومعهد الأنصاري بجامعة نوتردام."
  en: "English Wikipedia article on Azza Karam (born 1968); used for entity facts only. It recounts her upbringing in Egypt and India, her degrees from the American University in Cairo and the University of Amsterdam, her senior advisor posts at UNDP and UNFPA, her founding of the UN Inter-Agency Task Force on Religion and Development, her 2019 election as secretary general of Religions for Peace and July 2023 resignation, and her professorships at the Vrije Universiteit Amsterdam and Notre Dame's Ansari Institute."
  es: "Artículo de la Wikipedia en inglés sobre Azza Karam (nacida en 1968); utilizado únicamente para datos biográficos. En él se narra su infancia en Egipto e India, sus títulos de la Universidad Americana de El Cairo y la Universidad de Ámsterdam, sus puestos como asesora principal en el PNUD y el UNFPA, la fundación del Grupo de Trabajo Interinstitucional de las Naciones Unidas sobre Religión y Desarrollo, su elección en 2019 como secretaria general de Religiones por la Paz y su dimisión en julio de 2023, y sus cátedras en la Universidad Libre de Ámsterdam y el Instituto Ansari de Notre Dame."
  fr: "Article de Wikipédia en anglais sur Azza Karam (née en 1968); utilisé uniquement à des fins d’information sur l’entité. Il relate son enfance en Égypte et en Inde, ses diplômes de l’Université américaine du Caire et de l’Université d’Amsterdam, ses postes de conseillère principale au PNUD et à l’UNFPA, la création du Groupe de travail interinstitutions des Nations Unies sur la religion et le développement, son élection en 2019 au poste de secrétaire générale de Religions pour la paix et sa démission en juillet 2023, ainsi que ses postes de professeure à la Vrije Universiteit Amsterdam et à l’Institut Ansari de l’Université de Notre-Dame."
  ur: "عزا کرم پر انگریزی ویکیپیڈیا مضمون ⁦(پیدائش 1968)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں مصر اور ہندوستان میں اس کی پرورش، قاہرہ کی امریکن یونیورسٹی اور ایمسٹرڈیم یونیورسٹی سے اس کی ڈگریاں، UNDP اور UNFPA میں اس کے سینئر مشیر کے عہدوں، مذہب اور ترقی پر اقوام متحدہ کی انٹر ایجنسی ٹاسک فورس کی اس کی بانی، 2019 میں ان کے سیکرٹری جنرل برائے مذہب برائے امن کے عہدے سے استعفیٰ، اور جولائی 2023 کو اس کا استعفیٰ دینے کا ذکر ہے۔ یونیورسٹی ایمسٹرڈیم اور نوٹری ڈیم انصاری انسٹی ٹیوٹ۔"
  tr: "Azza Karam hakkında İngilizce Wikipedia makalesi (d. 1968); yalnızca varlığın gerçekleri için kullanılmıştır. Mısır ve Hindistan'daki yetiştirilme yıllarını, Kahire Amerikan Üniversitesi ve Amsterdam Üniversitesi'ndeki eğitimlerini, Birleşmiş Milletler Kalkınma Programı ve Birleşmiş Milletler Nüfus Fonu'nda kıdemli danışman olarak çalışmalarını, Din ve Kalkınma Ajanslararası Çalışma Grubu'nu kurmasını, 2019'da Dinler için Barış Genel Sekreteri seçilmesini ve Temmuz 2023'te istifasını ve Amsterdam Özgür Üniversitesi ile Notre Dame Üniversitesi Ansari Enstitüsü'ndeki profesörlüğünü anlatıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Azza Karam (lahir 1968); digunakan hanya untuk fakta entitas tersebut. Ia menceritakan masa kecilnya di Mesir dan India, studinya di American University di Kairo dan University of Amsterdam, pekerjaannya sebagai penasihat senior di United Nations Development Programme dan United Nations Population Fund, pendirian Inter-Agency Working Group on Religion and Development, terpilihnya sebagai Sekretaris Jenderal Religions for Peace pada 2019 dan pengunduran dirinya pada Juli 2023, serta jabatan profesornya di Free University of Amsterdam dan Ansari Institute di University of Notre Dame."
