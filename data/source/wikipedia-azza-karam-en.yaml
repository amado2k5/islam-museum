summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عزة كرم (وُلدت 1968)؛ تُستخدم لوقائع الكيان فقط. تروي نشأتها في مصر والهند، ودراستها في الجامعة الأمريكية بالقاهرة وجامعة أمستردام، وعملها مستشارة أولى في برنامج الأمم المتحدة الإنمائي وصندوق الأمم المتحدة للسكان، وتأسيسها فريق العمل المشترك بين الوكالات المعني بالدين والتنمية، وانتخابها أمينة عامة لمنظمة أديان من أجل السلام سنة 2019 واستقالتها في يوليو 2023، وأستاذيتها في جامعة فريي أمستردام ومعهد الأنصاري بجامعة نوتردام."
  en: "English Wikipedia article on Azza Karam (born 1968); used for entity facts only. It recounts her upbringing in Egypt and India, her degrees from the American University in Cairo and the University of Amsterdam, her senior advisor posts at UNDP and UNFPA, her founding of the UN Inter-Agency Task Force on Religion and Development, her 2019 election as secretary general of Religions for Peace and July 2023 resignation, and her professorships at the Vrije Universiteit Amsterdam and Notre Dame's Ansari Institute."
