  tr: "Dar İbn Hazm bülteninin beşinci bölümü (Beyrut, ilk baskı 1418 Hicri / 1997 M.S.) ve kenar notunda El-Hattabi'nin \"Ma'alim al-Sunan\" tefsiri yer alır; bu bölümde sünnet kitapları (otuz iki bölüm) ve edebiyat yer alır, genel bir dizinle birlikte."
  id: "Bagian kelima buletin Dar Ibn Hazm (Beirut, edisi pertama 1418 H / 1997 M) tentang Sunan Abi Dawood dengan komentar Al-Khattabi \"Ma'alim al-Sunan\" di catatan pinggir, yang mencakup kitab-kitab Sunnah (tiga puluh dua bab) dan sastra, dengan indeks umum."
