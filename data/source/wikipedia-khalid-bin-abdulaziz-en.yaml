  ar: "مقالة ويكيبيديا الإنجليزية عن خالد بن عبد العزيز؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 13 فبراير 1913 في الرياض ووفاته في 13 يونيو 1982 في قصره الصيفي بالطائف، وتعيينه وليًا للعهد سنة 1965، واعتلاءه العرش في 25 مارس 1975 بعد اغتيال فيصل، وحادثة احتجاز الحرم سنة 1979 ودفنه في مقبرة العود بالرياض؛ ويصفه متنها بالتديّن ولا يذكر له مدرسة."
  en: "English Wikipedia article on Khalid of Saudi Arabia; used for entity facts only. It gives his birth on 13 February 1913 at Riyadh and his death on 13 June 1982 in his summer palace in Taif, his crown-prince appointment in 1965, his accession on 25 March 1975 after Faisal's assassination, the 1979 Grand Mosque seizure and his burial at Al Oud cemetery in Riyadh; its text describes him as devout and names no school for him."
