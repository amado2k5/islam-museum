summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خالد بن عبد العزيز؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 13 فبراير 1913 في الرياض ووفاته في 13 يونيو 1982 في قصره الصيفي بالطائف، وتعيينه وليًا للعهد سنة 1965، واعتلاءه العرش في 25 مارس 1975 بعد اغتيال فيصل، وحادثة احتجاز الحرم سنة 1979 ودفنه في مقبرة العود بالرياض؛ ويصفه متنها بالتديّن ولا يذكر له مدرسة."
  en: "English Wikipedia article on Khalid of Saudi Arabia; used for entity facts only. It gives his birth on 13 February 1913 at Riyadh and his death on 13 June 1982 in his summer palace in Taif, his crown-prince appointment in 1965, his accession on 25 March 1975 after Faisal's assassination, the 1979 Grand Mosque seizure and his burial at Al Oud cemetery in Riyadh; its text describes him as devout and names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Khalid de Arabia Saudita; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 13 de febrero de 1913 en Riad y su muerte el 13 de junio de 1982 en su palacio de verano en Taif, su nombramiento como príncipe heredero en 1965, su ascenso al trono el 25 de marzo de 1975 tras el asesinato de Faisal, la toma de la Gran Mezquita en 1979 y su entierro en el cementerio de Al Oud en Riad; el texto lo describe como devoto y no menciona ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en anglais sur Khalid d'Arabie saoudite; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 13 février 1913 à Riyad et sa mort le 13 juin 1982 dans son palais d'été à Taïf, sa nomination comme prince héritier en 1965, son accession au trône le 25 mars 1975 après l'assassinat de Fayçal, la prise de la Grande Mosquée en 1979 et son inhumation au cimetière d'Al Oud à Riyad; son texte le décrit comme pieux et ne mentionne aucune école à son sujet."
