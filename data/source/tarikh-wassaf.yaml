summary:
  ar: "تاريخ فارسي للإمبراطورية المغولية ألّفه عبد الله بن فضل الله، المعروف بوصاف، وقدّمه إلى غازان خان سنة 702 هـ؛ يذكره الخشاب في مقدمة ترجمة جامع التواريخ {cite:jami-al-tawarikh-khashshab-1960 p. 43}، ويذكر أنه أسلوبه متكلف {cite:jami-al-tawarikh-khashshab-1960 p. 43}. لم تُقرأ أي طبعة لهذا الكتاب في هذه الدفعة."
  en: "A Persian history of the Mongol empire by Abd Allah ibn Fadl Allah, known as Wassaf, presented to Ghazan Khan in 702 AH; named by Yahya al-Khashshab in his introduction to the translation of Jami' al-Tawarikh {cite:jami-al-tawarikh-khashshab-1960 p. 43}, who describes its ornate style {cite:jami-al-tawarikh-khashshab-1960 p. 43}. No edition of this work was read for this batch."
  es: "Una historia persa del imperio mongol escrita por Abd Allah ibn Fadl Allah, conocido como Wassaf, presentada a Ghazan Jan en 702 de la Hégira; la menciona Yahya al-Juashshab en la introducción a la traducción de Jami' al-Tawarikh {cite:jami-al-tawarikh-khashshab-1960 p. 43}, quien describe su estilo recargado {cite:jami-al-tawarikh-khashshab-1960 p. 43}. No se leyó ninguna edición de esta obra en este lote."
  fr: "Une histoire persane de l'empire mongol due à Abd Allah ibn Fadl Allah, dit Wassaf, présentée à Ghazan Khan en 702 de l'Hégire ; elle est mentionnée par Yahya al-Khashshab dans son introduction à la traduction du Jami' al-Tawarikh {cite:jami-al-tawarikh-khashshab-1960 p. 43}, qui en décrit le style chargé {cite:jami-al-tawarikh-khashshab-1960 p. 43}. Aucune édition de cet ouvrage n'a été lue pour ce lot."
  ur: "عبد اللہ بن فضل اللہ، جو وصاف کے نام سے مشہور ہیں، کی لکھی ہوئی منگول سلطنت کی فارسی تاریخ، جو 702ھ میں غازان خان کو پیش کی گئی؛ یحییٰ الخشاب نے جامع التواریخ کے ترجمے کے مقدمے میں اس کا ذکر کیا ہے {cite:jami-al-tawarikh-khashshab-1960 p. 43} اور اس کے مزین اسلوب کی طرف اشارہ کیا ہے {cite:jami-al-tawarikh-khashshab-1960 p. 43}۔ اس دفعہ کسی طبع شدہ نسخے کو نہیں پڑھا گیا۔"
  tr: "Moğol İmparatorluğu'nun Fars Tarihi, Abdullah ibn Fazlallah, Wasaf olarak bilinir ve 702 Hicri'de Gazan Han'a sunulmuştur; el-Khashab, Jami' al-Tawarikh-khashshab-1960 s. 43 eserinin çevirisinin girişinde bahseder ve üslubunun gösterişli olduğunu belirtir {cite:jami-al-tawarikh-khashshab-1960 s. 43}. Bu kitapta hiçbir baskı okunmamıştır."
  id: "Sejarah Persia Kekaisaran Mongol yang ditulis oleh Abdullah ibn Fazlallah, dikenal sebagai Wasaf, yang menyerahkannya kepada Ghazan Khan pada tahun 702 H; al-Khashab menyebutkannya dalam pengantar terjemahan Jami' al-Tawarikh-khashshab-1960 hlm. 43}, dan ia menyebutkan bahwa gayanya bersifat pretensius {cite:jami-al-tawarikh-khashshab-1960 hlm. 43}. Tidak ada edisi buku ini yang dibaca dalam kumpulan ini."
