  fr: "Article Wikipédia en ourdou sur Abdel Daim Kaheel; utilisé uniquement pour son nom en ourdou et pour les informations le concernant. Il s'agit d'une version traduite de l'article arabe: on y trouve son nom complet, les noms de ses parents, sa nationalité syrienne et son activité depuis 2005. Son infobox indique qu'il est musulman, sans mention d'école religieuse."
