  ar: "مقالة ويكيبيديا الأردية عن عبد الدائم الكحيل؛ تُستخدم لتسميته الأردية ولوقائع الكيان فقط. هي صورة من المقالة العربية: تعطي اسمه الكامل ووالديه وجنسيته السورية ونشاطه منذ 2005، ودينه في صندوق معلوماتها «الإسلام» دون مذهب."
  en: "Urdu Wikipedia article on Abdel Daim Kaheel; used for his Urdu name and for entity facts only. It is a translation-family version of the Arabic article: it gives his full name, his parents' names, his Syrian nationality and his activity from 2005, and its infobox gives his religion as Islam with no school."
