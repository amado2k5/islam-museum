summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أكمل إكراموف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1898 في طشقند، وسكرتاريته الأولى للجنة المركزية للحزب الشيوعي الأوزبكي 1929–1937، وقيادته للتجميع الزراعي وحملة القطن، وتصميمه لإجراءات مناهضة الإسلام في الخطة الخمسية الأولى وأوامره الشخصية أحيانا باعتقال رجال الدين نقلا عن دراسة شوشانا كيلر، ومحاكمته في محاكمة الواحد والعشرين وإعدامه في كوموناركا في 13 مارس 1938 ⁦(ومصادر أخرى تجعله 15 مارس)⁩، وردّ اعتباره سنة 1957. ما تذكره عن الدين نشاط دولة مناهض للدين، لا شهادة على انتمائه الشخصي."
  en: "English Wikipedia article on Akmal Ikramov; used for entity facts only. It gives his birth in 1898 in Tashkent, his first secretaryship of the Central Committee of the Communist Party of Uzbekistan 1929–1937, his leadership of collectivisation and the cotton campaign, his design of the anti-Islamic measures of the first five-year plan and his occasional personal orders to arrest clergymen, citing Shoshana Keller's study, his trial at the Trial of the Twenty-One, his execution at Kommunarka on 13 March 1938 (other sources give 15 March), and his rehabilitation in 1957. What it records about religion is anti-religious state activity, not an attestation of his personal affiliation."
  es: "Artículo de la Wikipedia en inglés sobre Akmal Ikramov; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1898 en Tashkent, su primer cargo como secretario del Comité Central del Partido Comunista de Uzbekistán entre 1929 y 1937, su liderazgo en la colectivización y la campaña del algodón, su diseño de las medidas antiislámicas del primer plan quinquenal y sus órdenes personales ocasionales de arrestar a clérigos, citando el estudio de Shoshana Keller, su juicio en el Juicio de los Veintiuno, su ejecución en Kommunarka el 13 de marzo de 1938 (otras fuentes indican el 15 de marzo) y su rehabilitación en 1957. Lo que registra sobre religión es la actividad estatal antirreligiosa, no una constatación de su afiliación personal."
  fr: "L'article de Wikipédia en anglais consacré à Akmal Ikramov, utilisé uniquement pour des informations factuelles, mentionne sa naissance en 1898 à Tachkent, son premier poste de secrétaire du Comité central du Parti communiste d'Ouzbékistan (1929-1937), son rôle dans la collectivisation et la campagne du coton, la conception des mesures anti-islamiques du premier plan quinquennal et ses ordres ponctuels d'arrestation de religieux (en s'appuyant sur l'étude de Shoshana Keller). Il relate également son procès lors du procès des Vingt-et-un, son exécution à Kommunarka le 13 mars 1938 (d'autres sources indiquent le 15 mars) et sa réhabilitation en 1957. Les informations relatives à la religion qu'il contient concernent l'action anti-religieuse de l'État et non une attestation de son appartenance religieuse."
  ur: "اکمل اکراموف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1898 میں تاشقند میں ان کی پیدائش، ازبکستان کی کمیونسٹ پارٹی کی مرکزی کمیٹی کی پہلی سیکرٹری شپ 1929-1937، اجتماعیت اور کپاس کی مہم کی اس کی قیادت، پہلے پانچ سالہ منصوبے کے اسلام مخالف اقدامات کے اس کے ڈیزائن اور پادریوں کو گرفتار کرنے کے اس کے کبھی کبھار ذاتی احکامات، کا حوالہ دیتے ہوئے، اس کے تینوں مطالعہ کا حوالہ دیتے ہوئے اکیس، 13 مارچ 1938 کو کومونارکا میں اس کی پھانسی ⁦(دیگر ذرائع 15 مارچ بتاتے ہیں)⁩ اور 1957 میں اس کی بحالی۔ مذہب کے بارے میں جو کچھ اس میں درج ہے وہ مذہب مخالف ریاستی سرگرمی ہے، اس کی ذاتی وابستگی کی تصدیق نہیں۔"
