summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أكمل إكراموف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1898 في طشقند، وسكرتاريته الأولى للجنة المركزية للحزب الشيوعي الأوزبكي 1929–1937، وقيادته للتجميع الزراعي وحملة القطن، وتصميمه لإجراءات مناهضة الإسلام في الخطة الخمسية الأولى وأوامره الشخصية أحيانا باعتقال رجال الدين نقلا عن دراسة شوشانا كيلر، ومحاكمته في محاكمة الواحد والعشرين وإعدامه في كوموناركا في 13 مارس 1938 (ومصادر أخرى تجعله 15 مارس)، وردّ اعتباره سنة 1957. ما تذكره عن الدين نشاط دولة مناهض للدين، لا شهادة على انتمائه الشخصي."
  en: "English Wikipedia article on Akmal Ikramov; used for entity facts only. It gives his birth in 1898 in Tashkent, his first secretaryship of the Central Committee of the Communist Party of Uzbekistan 1929–1937, his leadership of collectivisation and the cotton campaign, his design of the anti-Islamic measures of the first five-year plan and his occasional personal orders to arrest clergymen, citing Shoshana Keller's study, his trial at the Trial of the Twenty-One, his execution at Kommunarka on 13 March 1938 (other sources give 15 March), and his rehabilitation in 1957. What it records about religion is anti-religious state activity, not an attestation of his personal affiliation."
