reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. This is the only biographical article on Bilali Muhammad in any Wikipedia edition and the only one attached to his Wikidata item; it is an independent tradition beside the English article family. It gives his birth in 1770 in Timbo, Fouta Djallon, in present-day Guinea, his educated family and higher education, his capture as a teenager into the Atlantic slave trade, and his fluency in Fula and Arabic with knowledge of Islam, hadith, shari'ah and tafsir. It gives no death date and names no madhhab or order for him personally."
