summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن بلالي محمد؛ تُستخدم لوقائع الكيان فقط. سيرة موجزة مستقلة تذكر ولادته سنة 1770 في تيمبو بفوتا جالون لأسرة متعلمة، وإتقانه العربية والفقه والحديث والتفسير قبل أسره."
  en: "Indonesian Wikipedia article on Bilali Muhammad; used for entity facts only. A short independent biography giving his birth in 1770 in Timbo, Fouta Djallon, to an educated family, and his command of Arabic and of Islamic law, hadith and exegesis before his capture."
  es: "Artículo de la Wikipedia en indonesio sobre Bilali Muhammad; utilizado únicamente para datos sobre la persona. Una breve biografía independiente que indica su nacimiento en 1770 en Timbo, Fouta Djallon, en el seno de una familia culta, y su dominio del árabe y del derecho islámico, los hadices y la exégesis antes de su captura."
  fr: "Article de Wikipédia indonésien sur Bilali Muhammad; utilisé uniquement pour les informations factuelles. Une courte biographie indépendante indique sa naissance en 1770 à Timbo, Fouta Djallon, au sein d'une famille instruite, et sa maîtrise de l'arabe et du droit islamique, des hadiths et de l'exégèse avant sa capture."
  ur: "بلالی محمد پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر آزاد سوانح عمری جو کہ 1770 میں ٹمبو، فوٹا جالون میں ایک پڑھے لکھے گھرانے میں پیدا ہوئی، اور اس کی گرفتاری سے پہلے عربی اور اسلامی قانون، حدیث اور تفسیر کا حکم۔"
  tr: "Bilali Muhammad hakkında Endonezya Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kısa bağımsız bir biyografi, 1770'te Tympo, Phuta Jalon'da eğitimli bir ailede doğduğunu ve esaret öncesi Arapça, fıkıh, hadis ve tefsir konusundaki ustalığını belirtir."
  id: "Artikel Wikipedia Indonesia tentang Bilali Muhammad; digunakan hanya untuk fakta-fakta entitas tersebut. Biografi singkat independen menyebutkan kelahirannya pada tahun 1770 di Tympo, Phuta Jalon dari keluarga terdidik, serta penguasaannya dalam bahasa Arab, yurisprudensi, hadis, dan tafsiran sebelum ia ditawan."
