summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نصرت الله مخسوم؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 1 يوليو 1881 في تشاشما كوزي بمقاطعة غرم، ورئاسته حكومة جمهورية طاجيكستان الاشتراكية السوفيتية في 1925–1926، وعضويته في هيئة رئاسة اللجنة التنفيذية المركزية لعموم روسيا من 1926 إلى 1933، ووفاته في 1 نوفمبر 1937 رميًا بالرصاص في التطهير الكبير، ورسمه على ورقة المئتي صوموني الطاجيكية. ولا تذكر المقالة أي انتماء ديني له."
  en: "English Wikipedia article on Nusratullo Maksum; used for entity facts only. It gives his birth on 1 July 1881 at Chashma-kuzi in the Gharm District, his premiership of the Tajik SSR in 1925–1926, his membership of the Presidium of the All-Russian Central Executive Committee from 1926 to 1933, his death by firing squad on 1 November 1937 in the Great Purge, and his portrait on Tajikistan's 200-somoni banknote. The article records no religious affiliation for him."
  es: "Artículo de la Wikipedia en inglés sobre Nusratullo Maksum; utilizado únicamente para datos biográficos. Indica su nacimiento el 1 de julio de 1881 en Chashma-kuzi, en el distrito de Gharm; su mandato como primer ministro de la RSS de Tayikistán entre 1925 y 1926; su pertenencia al Presidium del Comité Ejecutivo Central Panruso desde 1926 hasta 1933; su muerte por fusilamiento el 1 de noviembre de 1937 durante la Gran Purga; y su retrato en el billete de 200 somoni de Tayikistán. El artículo no registra ninguna afiliación religiosa."
  fr: "L'article de Wikipédia en anglais consacré à Nusratullo Maksum, utilisé uniquement pour des informations biographiques, mentionne sa naissance le 1er juillet 1881 à Chashma-kuzi, dans le district de Gharm, son mandat de Premier ministre de la RSS du Tadjikistan de 1925 à 1926, son appartenance au Présidium du Comité exécutif central panrusse de 1926 à 1933, son exécution par un peloton d'exécution le 1er novembre 1937 lors des Grandes Purges, et la présence de son portrait sur le billet de 200 somonis du Tadjikistan. L'article ne fait mention d'aucune appartenance religieuse."
  ur: "نصرت اللہ مکسوم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ یکم جولائی 1881 کو ضلع گھڑ کے چشمہ کوزی میں پیدا ہوا، 1925-1926 میں تاجک ایس ایس آر کی پریمیئر شپ، 1926 سے 1933 تک آل رشین سنٹرل ایگزیکٹو کمیٹی کے پریزیڈیم کی ان کی رکنیت، ان کی موت گولی باری کے اسکواڈ سے ہوئی اور نومبر 1933 کو گریٹ پورٹ میں ان کی موت ہوئی۔ تاجکستان کے 200 سومونی نوٹ پر۔ مضمون میں اس کے لیے کوئی مذہبی وابستگی درج نہیں ہے۔"
