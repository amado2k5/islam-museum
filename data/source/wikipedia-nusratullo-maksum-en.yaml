summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نصرت الله مخسوم؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 1 يوليو 1881 في تشاشما كوزي بمقاطعة غرم، ورئاسته حكومة جمهورية طاجيكستان الاشتراكية السوفيتية في 1925–1926، وعضويته في هيئة رئاسة اللجنة التنفيذية المركزية لعموم روسيا من 1926 إلى 1933، ووفاته في 1 نوفمبر 1937 رميًا بالرصاص في التطهير الكبير، ورسمه على ورقة المئتي صوموني الطاجيكية. ولا تذكر المقالة أي انتماء ديني له."
  en: "English Wikipedia article on Nusratullo Maksum; used for entity facts only. It gives his birth on 1 July 1881 at Chashma-kuzi in the Gharm District, his premiership of the Tajik SSR in 1925–1926, his membership of the Presidium of the All-Russian Central Executive Committee from 1926 to 1933, his death by firing squad on 1 November 1937 in the Great Purge, and his portrait on Tajikistan's 200-somoni banknote. The article records no religious affiliation for him."
