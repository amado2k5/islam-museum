summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن لاسانا ديارا؛ تُستخدم لوقائع الكيان فقط. تروي سيرة لاعب الوسط المدافع الفرنسي المولود في 10 مارس 1985 بباريس لأبوين ماليين: لعب للوهافر وتشيلسي وأرسنال وبورتسموث وريال مدريد وأنجي ولوكوموتيف موسكو ومرسيليا وباريس سان جيرمان، وخاض 34 مباراة مع فرنسا، وتذكر في حياته الشخصية أنه مسلم ممارس."
  en: "English Wikipedia article on Lassana Diarra; used for entity facts only. It records the French defensive midfielder born 10 March 1985 in Paris to Malian parents: Le Havre, Chelsea, Arsenal, Portsmouth, Real Madrid, Anzhi, Lokomotiv Moscow, Marseille and Paris Saint-Germain, 34 France caps, and a personal-life note calling him a practising Muslim."
  es: "Artículo de la Wikipedia en inglés sobre Lassana Diarra; utilizado únicamente para datos sobre la persona. Describe al centrocampista defensivo francés nacido el 10 de marzo de 1985 en París, de padres malienses: Le Havre, Chelsea, Arsenal, Portsmouth, Real Madrid, Anzhi, Lokomotiv Moscú, Marsella y Paris Saint-Germain, 34 internacionalidades con Francia, y una nota sobre su vida personal que lo describe como musulmán practicante."
  fr: "Article Wikipédia en anglais sur Lassana Diarra; utilisé uniquement pour les informations relatives à l'entité. Il retrace le parcours du milieu défensif français, né le 10 mars 1985 à Paris de parents maliens: son passage au Havre, à Chelsea, à Arsenal, à Portsmouth, au Real Madrid, à Anzhi, au Lokomotiv Moscou, à Marseille et au Paris Saint-Germain, ses 34 sélections en équipe de France, ainsi qu'une note sur sa vie privée indiquant qu'il est un musulman pratiquant."
  ur: "Lassana Diarra پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں فرانسیسی دفاعی مڈفیلڈر کو ریکارڈ کیا گیا ہے جو 10 مارچ 1985 کو پیرس میں مالی کے والدین کے ہاں پیدا ہوئے: لی ہاورے، چیلسی، آرسنل، پورٹسماؤتھ، ریئل میڈرڈ، انزی، لوکوموٹیو ماسکو، مارسیل اور پیرس سینٹ جرمین، 34 فرانس کیپس، اور اسے ایک مسلمان شخصی زندگی کا نام دینے والا شخص ہے۔"
  tr: "Lassana Diarra hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 10 Mart 1985'te Paris'te doğan Fransız defans orta saha oyuncusunun biyografisi: Le Haver, Chelsea, Arsenal, Portsmouth, Real Madrid, Angers, Lokomotiv, Moskova, Marsilya ve Paris Saint-Germain takımlarında oynadı, Fransa ile 34 maçta oynadı ve kişisel hayatında Müslüman olarak anılmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Lassana Diarra; digunakan hanya untuk fakta entitas. Biografi bek gelandang Prancis yang lahir pada 10 Maret 1985 di Paris dari orang tua Mali: bermain untuk Le Haver, Chelsea, Arsenal, Portsmouth, Real Madrid, Angers, Lokomotiv, Moskow, Marseille, dan Paris Saint-Germain, bermain 34 pertandingan bersama Prancis, dan disebutkan dalam kehidupan pribadinya sebagai Muslim yang taat."
