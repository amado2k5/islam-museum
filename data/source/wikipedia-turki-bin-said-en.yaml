summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن السلطان تركي بن سعيد بن سلطان البوسعيدي (1832 – 4 يونيو 1888)، سلطان مسقط وعمان من 30 يناير 1871 إلى وفاته؛ تروي ولايته على صحار سنة 1854، وتمرده على أخيه ثويني وسجنيه وتدخل بريطانيا، ومنفاه في بومباي، وعودته وهزيمته الإمام عزان بن قيس في معركة ضنك، وتوليه الحكم، ووسام نجمة الهند سنة 1886."
  en: "English Wikipedia article on Sultan Turki bin Said bin Sultan Al Busaidi (1832 – 4 June 1888), Sultan of Muscat and Oman from 30 January 1871 until his death; it recounts his governorship of Sohar in 1854, his revolt against his brother Thuwaini, his two imprisonments and the British interventions, his exile in Bombay, his return and defeat of Imam Azzan bin Qais at the Battle of Dhank, his accession, and his Knight Grand Commandership of the Star of India in 1886."
