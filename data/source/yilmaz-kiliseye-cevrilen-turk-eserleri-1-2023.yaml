summary:
  ar: "المجلد 1 من فهرس ثنائي اللغة ⁦(تركي وإنجليزي)⁩ لمحمد أمين يلماز عن المساجد والتكايا والأضرحة العثمانية وغيرها التي حُوّلت إلى كنائس خارج تركيا وداخلها؛ يتناول هذا المجلد: Albania, Azerbaijan, Bosnia and Herzegovina, Bulgaria, Algeria, Armenia, Southern Cyprus, Georgia, Croatia, Montenegro, Kosovo and North Macedonia."
  en: "Volume 1 of Mehmet Emin Yılmaz's bilingual (Turkish and English) catalogue of Ottoman and other Muslim mosques, lodges, tombs and buildings converted into churches; this volume covers Albania, Azerbaijan, Bosnia and Herzegovina, Bulgaria, Algeria, Armenia, Southern Cyprus, Georgia, Croatia, Montenegro, Kosovo and North Macedonia."
  es: "Volumen 1 del catálogo bilingüe (turco e inglés) de Mehmet Emin Yılmaz sobre mezquitas, logias, tumbas y edificios otomanos y de otras culturas musulmanas convertidos en iglesias; este volumen abarca Albania, Azerbaiyán, Bosnia y Herzegovina, Bulgaria, Argelia, Armenia, Chipre del Sur, Georgia, Croacia, Montenegro, Kosovo y Macedonia del Norte."
  fr: "Volume 1 du catalogue bilingue (turc et anglais) de Mehmet Emin Yılmaz sur les mosquées, loges, tombeaux et bâtiments ottomans et autres musulmans convertis en églises; ce volume couvre l'Albanie, l'Azerbaïdjan, la Bosnie-Herzégovine, la Bulgarie, l'Algérie, l'Arménie, Chypre du Sud, la Géorgie, la Croatie, le Monténégro, le Kosovo et la Macédoine du Nord."
  ur: "مہمت ایمن یلماز کے دو لسانی ⁦(ترکی اور انگریزی)⁩ عثمانی اور دیگر مسلمانوں کی مساجد، قیام گاہوں، مقبروں اور گرجا گھروں میں تبدیل ہونے والی عمارتوں کی کیٹلاگ کی جلد 1؛ یہ حجم البانیہ، آذربائیجان، بوسنیا اور ہرزیگووینا، بلغاریہ، الجیریا، آرمینیا، جنوبی قبرص، جارجیا، کروشیا، مونٹی نیگرو، کوسوو اور شمالی مقدونیہ پر محیط ہے۔"
