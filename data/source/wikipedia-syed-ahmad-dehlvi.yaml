summary:
  ar: 'صفحة «Syed Ahmad Dehlvi» على Wikipedia (English)، ملخَّصة في ملف بحثي قُدّم إلى المتحف ولم يفتحها المتحف؛ تُستعمل لـنسبة الألفاظ الفارسية والعربية عبر الفارسية في الأردية: نحو 25 إلى 30%، نقلاً عن معجم Farhang-e-Asifiya. أجاز المؤسس استعمال الملخص في 21 نوفمبر 2026 دون إعادة تحقق.'
  en: 'The page "Syed Ahmad Dehlvi" on Wikipedia (English), summarised in a research file supplied to the museum and not opened by the museum; used for the Urdu share of Persian words and Arabic words through Persian: about 25 to 30%, citing the dictionary Farhang-e-Asifiya. The founder approved using the summary on 21 November 2026 without re-verification.'
  ur: 'Wikipedia (English) پر صفحہ «Syed Ahmad Dehlvi»، جو عجائب گھر کو فراہم کردہ تحقیقی فائل میں خلاصہ کیا گیا اور عجائب گھر نے نہیں کھولا؛ اس کے لیے استعمال ہوا: اردو میں فارسی الفاظ اور فارسی کے واسطے سے عربی الفاظ کا تناسب: تقریباً 25 سے 30 فیصد، لغت Farhang-e-Asifiya کے حوالے سے۔ بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔'
  fr: 'La page « Syed Ahmad Dehlvi » sur Wikipedia (English), résumée dans un fichier de recherche remis au musée et non ouverte par le musée ; utilisée pour la part des mots persans et des mots arabes par le persan en ourdou : environ 25 à 30 %, d''après le dictionnaire Farhang-e-Asifiya. Le fondateur a approuvé l''usage du résumé le 21 novembre 2026 sans nouvelle vérification.'
  es: 'La página «Syed Ahmad Dehlvi» en Wikipedia (English), resumida en un archivo de investigación entregado al museo y no abierta por el museo; usada para la parte de palabras persas y de palabras árabes a través del persa en urdu: entre el 25 % y el 30 %, según el diccionario Farhang-e-Asifiya. El fundador aprobó el uso del resumen el 21 de noviembre de 2026 sin nueva verificación.'
  tr: "Wikipedia'daki \"Syed Ahmad Dehlvi\" sayfası (İngilizce), müzeye sunulan ancak müze tarafından açılmayan bir araştırma dosyasında özetlenmiştir; Farsça ve Arapça kelimelerin Farsçaya göre Farsça yüzdesi olarak Farsça ve Arapça kelime oranı olarak Farsça ve Arapça kelime oranı olarak kullanılır: Farhang-e-Asifiya sözlüğüne göre yaklaşık %25 ila %30. Kurucu, özetin kullanımına 21 Kasım 2026'da geri alma olmaksızın izin vermiştir."
  id: "Halaman \"Syed Ahmad Dehlvi\" di Wikipedia (Inggris), dirangkum dalam berkas penelitian yang dikirim ke museum tetapi tidak dibuka oleh museum; digunakan untuk persentase kata Persia dan Arab dibandingkan Persia dalam bahasa Urdu: sekitar 25 hingga 30%, menurut kamus Farhang-e-Asifiya. Pendiri mengizinkan penggunaan ringkasan tersebut pada 21 November 2026, tanpa verifikasi ulang."
