  fr: "Les archives des conférences enregistrées de Mishari al-Kharraz sur le site web Assabile, dont la série « Comment savourer la prière ». Il s'agit d'une source primaire de ce que dit le conférencier dans ces enregistrements, et non d'une corroboration indépendante des événements historiques."
  es: "El archivo de las charlas grabadas de Mishari al-Kharraz en el sitio web de Assabile, que incluye la serie «Cómo disfrutar de la oración». Se trata de una fuente primaria de lo que dice el orador en esas grabaciones, pero no de una corroboración independiente de los hechos históricos."
