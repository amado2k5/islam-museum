  en: "Bitter Winter article of September 2024 reporting that on 9 September 2024 the District Court of The Hague sentenced Muhammad Ashraf Asif Jalali in absentia to fourteen years in prison for public appeals to kill Dutch politician Geert Wilders, his remarks construed as promoting terrorism (Saad Husain Rizvi received four years in the same ruling); the article identifies Jalali as chairman of Tehreek-e-Labbaik Ya Rasool Allah and notes there is no extradition treaty between Pakistan and the Netherlands."
