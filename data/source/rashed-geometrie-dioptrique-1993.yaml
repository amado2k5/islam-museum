summary:
  ar: "طبعة رشدي راشد الفرنسية لنصوص ابن سهل والقوحي وابن الهيثم في المرايا والعدسات المحرقة؛ تعيد بناء رسالة ابن سهل من مخطوطي دمشق الظاهرية 4871 وطهران الملي 867 وتنسب إليه اكتشاف قانون الانكسار."
  en: "Roshdi Rashed's French edition of the texts of Ibn Sahl, al-Quhi and Ibn al-Haytham on burning mirrors and lenses; it reconstructs Ibn Sahl's treatise from the Damascus al-Zahiriyya MS 4871 and Tehran Milli MS 867 and credits him with the discovery of the law of refraction."
  ur: "ابن سہل، القوحی اور ابن الہیثم کے جلانے والے آئینوں اور عدسوں کے متون کی رشدی راشد کی فرانسیسی اشاعت؛ دمشق ظاہریہ مخطوطہ 4871 اور تہران ملی مخطوطہ 867 سے ابن سہل کا رسالہ مرتب کرتی اور قانونِ انعطاف کی دریافت اس سے منسوب کرتی ہے۔"
  es: "Edición francesa de Roshdi Rashed de los textos de Ibn Sahl, al-Quhi e Ibn al-Haytham sobre espejos y lentes abrasivos; reconstruye el tratado de Ibn Sahl a partir del manuscrito al-Zahiriyya de Damasco 4871 y del manuscrito Milli de Teherán 867 y le atribuye el descubrimiento de la ley de refracción."
  fr: "L'édition française de Roshdi Rashed des textes d'Ibn Sahl, d'al-Quhi et d'Ibn al-Haytham sur les miroirs et les lentilles ardents; elle reconstitue le traité d'Ibn Sahl à partir du manuscrit Damascus al-Zahiriyya 4871 et du manuscrit Téhéran Milli 867 et lui attribue la découverte de la loi de la réfraction."
title: "Géométrie et dioptrique au Xe siècle: Ibn Sahl, al-Qūhī et Ibn al-Haytham"
