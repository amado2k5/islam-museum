  ar: "مقالة ويكيبيديا الإنجليزية عن سالم الدوسري؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 19 أغسطس 1991 في جدة، ومسيرته مع الهلال وإعارته إلى فياريال سنة 2018، وهدفه في الأرجنتين في كأس العالم 2022، وقيادته للنادي والمنتخب."
  en: "English Wikipedia article on Salem Al-Dawsari; used for entity facts only. It gives his birth on 19 August 1991 in Jeddah, his Al-Hilal career with a 2018 loan at Villarreal, his winning goal against Argentina at the 2022 World Cup, and his captaincy of club and country."
  es: "Artículo de la Wikipedia en inglés sobre Salem Al-Dawsari; utilizado únicamente para datos sobre la persona. En él se menciona su fecha de nacimiento, el 19 de agosto de 1991 en Yeda, su trayectoria en el Al-Hilal, su cesión al Villarreal en 2018, su gol de la victoria contra Argentina en el Mundial de 2022 y su capitanía tanto en su club como en la selección nacional."
  fr: "Article Wikipédia en anglais sur Salem Al-Dawsari; utilisé uniquement pour les informations le concernant. Il mentionne sa naissance le 19 août 1991 à Djeddah, son parcours à Al-Hilal avec un prêt à Villarreal en 2018, son but victorieux contre l'Argentine lors de la Coupe du monde 2022, et son capitanat en club et en sélection."
