summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الكريم أمر الله؛ تُستخدم لوقائع الكيان فقط. تروي دراسته بمكة على الشيخ أحمد الخطيب، وعودته إلى سوفاي باتانغ سنة 1901 ونشاطه الإصلاحي في حركة طوالب، ووفاته في جاكرتا سنة 1945."
  en: "English Wikipedia article on Abdul Karim Amrullah; used for entity facts only. It recounts his Mecca study under Sheikh Ahmad Khatib, his return to Sungai Batang in 1901 and his reform work in the Thawalib movement, and his death at Jakarta in 1945."
  es: "Artículo de la Wikipedia en inglés sobre Abdul Karim Amrullah; utilizado únicamente para obtener información sobre la persona. Relata sus estudios en La Meca con el jeque Ahmad Khatib, su regreso a Sungai Batang en 1901, su labor reformista en el movimiento Thawalib y su fallecimiento en Yakarta en 1945."
  fr: "Article de Wikipédia en anglais sur Abdul Karim Amrullah; utilisé uniquement pour les informations relatives à l’entité. Il relate ses études à La Mecque auprès du cheikh Ahmad Khatib, son retour à Sungai Batang en 1901 et son travail de réforme au sein du mouvement Thawalib, ainsi que sa mort à Jakarta en 1945."
  ur: "عبدالکریم امر اللہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں شیخ احمد خطیب کے تحت ان کے مکہ کے مطالعے، سن 1901 میں سنگائی باتنگ میں ان کی واپسی اور تحریک الثالب میں ان کے اصلاحی کام اور 1945 میں جکارتہ میں ان کی موت کا ذکر ہے۔"
