summary:
  ar: "كتاب مفتاح العلوم للسكاكي، بضبط نعيم زرزور، دار الكتب العلمية، بيروت، الطبعة الثانية؛ قُرئ في نسخة المكتبة الشاملة في 21 نوفمبر 2026، في موضوع: حدّ علمي المعاني والبيان عند السكاكي والتمهيد لعلم البيان وأمثلة التشبيه، ووجوه تحسين الكلام وأمثلتها ⁦(ص161-162 و322-329 و333-336 و423-430)⁩."
  en: "Miftah al-Ulum by al-Sakkaki, ed. Na'im Zarzur, Dar al-Kutub al-Ilmiyya, Beirut, 2nd ed., 1407 AH / 1987; read on 21 November 2026 in the Shamela library copy for al-Sakkaki's definition of ma'ani and bayan, the preface to bayan and its examples of simile, and the section on the ways of making speech beautiful with examples (pp.161-162, 322-329, 333-336, 423-430)."
  ur: "السکاکی کی مفتاح العلوم، بضبط نعیم زرزور، دار الکتب العلمیہ، بیروت؛ 21 نومبر 2026 کو المکتبۃ الشاملہ کے نسخے میں پڑھی گئی، معانی اور بیان کی تعریف، بیان کی تمہید اور تشبیہ کی مثالوں اور کلام کی تحسین کی صورتوں کے لیے ⁦(ص161-162، 322-329، 333-336، 423-430)⁩۔"
  fr: "Miftah al-Ulum d'al-Sakkaki, éd. Na'im Zarzur, Dar al-Kutub al-Ilmiyya, Beyrouth ; lu le 21 novembre 2026 dans la copie de la bibliothèque Shamela pour la définition des ma'ani et du bayan chez al-Sakkaki, l'introduction au bayan et ses exemples de comparaison, et la section sur les façons d'embellir le discours avec exemples (pp. 161-162, 322-329, 333-336, 423-430)."
  es: "Miftah al-Ulum de al-Sakkaki, ed. Na'im Zarzur, Dar al-Kutub al-Ilmiyya, Beirut; leído el 21 de noviembre de 2026 en la copia de la biblioteca Shamela para la definición de ma'ani y bayan en al-Sakkaki, la introducción al bayan y sus ejemplos de comparación, y la sección sobre las formas de embellecer el discurso con ejemplos (pp. 161-162, 322-329, 333-336, 423-430)."
  tr: "Al-Sakaki'nin 'Miftah al-Ulum' adlı kitabı, Naeem Zarzur tarafından editörlüğünü üstlendi, Dar al-Kutub al-Ilmiyya, Beyrut, ikinci baskı; 21 Kasım 2026'da Kapsamlı Kütüphane baskısında okundu; başlıkta şu konuda okundu: El-Sakaki'ye göre Anlamların ve Güzel Konuşmanın Bilimsel Sınırı, Konuşma Bilimine Giriş, Benzerlik Örnekleri ve Konuşmada İyileştirme Yönleri ve Örnekleri (s. 161-162, 322-329, 333-336 ve 423-430)."
  id: "Buku 'Miftah al-Ulum' oleh al-Sakaki, disunting oleh Naeem Zarzur, Dar al-Kutub al-Ilmiyya, Beirut, edisi kedua; dibaca dalam edisi Perpustakaan Komprehensif pada 21 November 2026, dengan topik: Batas Ilmiah Makna dan Kefasihan menurut al-Sakaki, Pengantar Ilmu Fasih, Contoh Simile, dan Aspek Peningkatan dalam Ucapan dan Contohnya (hlm. 161-162, 322-329, 333-336, dan 423-430)."
