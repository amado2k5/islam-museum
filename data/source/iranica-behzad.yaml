label:
  en: "Encyclopaedia Iranica — Behzād, Kamāl-al-Dīn"
summary:
  ar: "مدخل «بهزاد، كمال الدين» بقلم بريسيلا سوسيك في الموسوعة الإيرانية؛ لا يعطي أي مؤلف تاريخ ولادته، وينقل عن دوست محمد أنه مات في خدمة الشاه طهماسب ودُفن في تبريز بجانب الشيخ كمال خجندي، ويورد تاريخ وفاته بشعر التاريخ: 935هـ/1535-36م."
  en: "Priscilla Soucek's Encyclopaedia Iranica entry 'Behzad, Kamal-al-Din'; no author gives his birth date, and it reports from Dust Muhammad that he died in Shah Tahmasp's service and was buried at Tabriz beside Shaykh Kamal Khujandi, with a chronogram dating his death to 935/1535-36."
  es: "La entrada de Priscilla Soucek en la Encyclopaedia Iranica, titulada 'Behzad, Kamal-al-Din', no incluye la fecha de nacimiento que menciona el autor, y Dust Muhammad informa que murió al servicio del Shah Tahmasp y fue enterrado en Tabriz junto al Shaykh Kamal Khujandi, con un cronograma que fecha su muerte en 935/1535-36."
  fr: "L'article de Priscilla Soucek dans l'Encyclopaedia Iranica intitulé « Behzad, Kamal-al-Din »; aucun auteur ne donne sa date de naissance, et il est rapporté de Dust Muhammad qu'il est mort au service du Shah Tahmasp et a été enterré à Tabriz aux côtés du cheikh Kamal Khujandi, avec un chronogramme datant sa mort de 935/1535-36."
  ur: "پرسکیلا سوسک کی انسائیکلوپیڈیا ایرانیکا اندراج 'بہزاد، کمال الدین'؛ کسی مصنف نے ان کی تاریخ پیدائش نہیں بتائی، اور دھول محمد سے یہ اطلاع ملتی ہے کہ وہ شاہ طہماسپ کی خدمت میں فوت ہوئے اور تبریز میں شیخ کمال خجندی کے پاس دفن ہوئے، اس کی تاریخ وفات 935/1535-36 ہے۔"
  tr: "İran Ansiklopedisi'nde Priscilla Sosic'in \"Behzad, Kamal al-Din\" adlı maddesinde hiçbir yazarın doğum tarihi verilmemektedir. Doost Muhammed'den, Şah Tahmasp hizmetinde öldüğü ve Tebriz'de Şeyh Kamal Hucandi'nin yanına gömüldüğü bildirilmiştir; ölüm tarihi tarih ise tarihi 935 Hicri / 1535-36 M.S. olarak geçer."
  id: "Entri \"Behzad, Kamal al-Din\" oleh Priscilla Sosic dalam Ensiklopedia Iran tidak memberikan tanggal lahir penulis manapun. Dilaporkan dari Doost Muhammad bahwa ia meninggal dalam pelayanan Shah Tahmasp dan dimakamkan di Tabriz di sebelah Sheikh Kamal Khujandi, dan tanggal kematiannya disebutkan dalam puisi sejarah: 935 H / 1535-36 M."
