reliability_note: "Peer-reviewed scholarly encyclopedia entry (Encyclopaedia Iranica; byline and year as cited by the English Wikipedia article), read in full at the live URL on 1 November 2026. It weighs the Herat sources (Khvandamir, Babur, Mirza Haydar Dughlat) against the Safavid ones (Dust Muhammad, Qazi Ahmad, Eskandar Beg) and is the anchor for this record's caution: Behzad's birth date is unknown, the decree appointing him under Shah Ismail is of doubtful authenticity, and the Tabriz death and burial rest on Dust Muhammad. Its printed chronogram pairing '935/1535-36' is internally inconsistent (935 AH fell in 1528-29) and is not followed. It names no religion for him."
