summary:
  ar: "مدخل «بهزاد، كمال الدين» بقلم بريسيلا سوسيك في الموسوعة الإيرانية؛ لا يعطي أي مؤلف تاريخ ولادته، وينقل عن دوست محمد أنه مات في خدمة الشاه طهماسب ودُفن في تبريز بجانب الشيخ كمال خجندي، ويورد تاريخ وفاته بشعر التاريخ: 935هـ/1535-36م."
  en: "Priscilla Soucek's Encyclopaedia Iranica entry 'Behzad, Kamal-al-Din'; no author gives his birth date, and it reports from Dust Muhammad that he died in Shah Tahmasp's service and was buried at Tabriz beside Shaykh Kamal Khujandi, with a chronogram dating his death to 935/1535-36."
