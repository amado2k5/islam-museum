summary:
  ar: "موقع origins.faith، مكتبة أقامتها أسرة الدكتور حمدي عبد العال لحفظ كتبه الأربعة الصادرة عن دار القلم بالكويت بين 1984 و1989 وإتاحتها للقراءة والبحث؛ يعتمد على ما هو مطبوع في الكتب وعلى سجلات المكتبات وعلى معرفة الأسرة."
  en: "origins.faith, a small library run by Dr. Hamdy Abdel Aal's family preserving his four books published by Dar al-Qalam, Kuwait, between 1984 and 1989 and making them readable and searchable; it rests on the printed books, library records and the family's knowledge."
  es: "origins.faith, una pequeña biblioteca administrada por la familia del Dr. Hamdy Abdel Aal, conserva sus cuatro libros publicados por Dar al-Qalam, Kuwait, entre 1984 y 1989, y los hace legibles y consultables; se basa en los libros impresos, los registros de la biblioteca y el conocimiento de la familia."
  fr: "origins.faith, une petite bibliothèque gérée par la famille du Dr Hamdy Abdel Aal, préserve ses quatre livres publiés par Dar al-Qalam, au Koweït, entre 1984 et 1989, et les rend lisibles et consultables; elle repose sur les livres imprimés, les archives de la bibliothèque et les connaissances de la famille."
  ur: "origins.faith، ڈاکٹر حمدی عبد العل کے خاندان کی طرف سے چلائی جانے والی ایک چھوٹی لائبریری جو 1984 اور 1989 کے درمیان دارالقلم، کویت سے شائع ہونے والی ان کی چار کتابوں کو محفوظ کر رہی ہے اور انہیں پڑھنے اور تلاش کے قابل بنا رہی ہے۔ یہ چھپی ہوئی کتابوں، لائبریری کے ریکارڈ اور خاندان کے علم پر منحصر ہے۔"
