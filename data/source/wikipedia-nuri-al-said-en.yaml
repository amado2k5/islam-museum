summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نوري السعيد، رئيس وزراء العراق أربع عشرة مرة؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في ديسمبر 1888 في بغداد وقتله في 15 يوليو 1958 في بغداد غداة ثورة 14 يوليو، ولا تسمّي دينًا ولا مذهبًا له في نصّها ولا في صندوق معلوماتها."
  en: "English Wikipedia article on Nuri al-Said, fourteen times prime minister of Iraq; used for entity facts only. It gives his birth in December 1888 at Baghdad and his killing on 15 July 1958 at Baghdad, the day after the 14 July revolution. Neither its text nor its infobox names any religion or school for him."
  es: "Artículo de la Wikipedia en inglés sobre Nuri al-Said, catorce veces primer ministro de Irak; se utiliza únicamente para obtener información sobre la persona. Indica que nació en diciembre de 1888 en Bagdad y que fue asesinado el 15 de julio de 1958 en la misma ciudad, un día después de la revolución del 14 de julio. Ni el texto ni la ficha informativa mencionan su religión ni su escuela."
  fr: "Article de Wikipédia en anglais sur Nouri al-Saïd, quatorze fois Premier ministre d'Irak; utilisé uniquement à des fins d'information. Il indique sa naissance en décembre 1888 à Bagdad et son assassinat le 15 juillet 1958 à Bagdad, au lendemain de la révolution du 14 juillet. Ni le texte ni l'infobox ne mentionnent sa religion ou son appartenance à une école religieuse."
  ur: "عراق کے چودہ مرتبہ وزیر اعظم نوری السید پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش دسمبر 1888 میں بغداد میں ہوئی اور 15 جولائی 1958 کو بغداد میں اس کا قتل، 14 جولائی کے انقلاب کے اگلے دن۔ نہ اس کا متن اور نہ ہی اس کے معلوماتی خانے میں اس کے لیے کسی مذہب یا اسکول کا نام لیا گیا ہے۔"
  tr: "Irak Başbakanı Nuri el-Said hakkında İngilizce Wikipedia makalesi on dört kez kullanılmıştır; sadece varlığın gerçekleri için kullanılmıştır. Doğumunu Aralık 1888'de Bağdat'ta ve 15 Temmuz 1958'de, 14 Temmuz Devrimi'nden bir gün sonra Bağdat'ta suikast ettiğini anlatır ve metinde veya bilgi kutusunda hiçbir din veya mezhebinden bahsetmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Nuri al-Said, Perdana Menteri Irak, telah digunakan sebanyak empat belas kali; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya pada Desember 1888 di Baghdad dan pembunuhannya pada 15 Juli 1958 di Baghdad sehari setelah Revolusi 14 Juli, dan tidak menyebutkan agama atau sekte apapun dalam teks atau kotak infonya."
