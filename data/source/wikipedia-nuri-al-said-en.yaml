  ar: "مقالة ويكيبيديا الإنجليزية عن نوري السعيد، رئيس وزراء العراق أربع عشرة مرة؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في ديسمبر 1888 في بغداد وقتله في 15 يوليو 1958 في بغداد غداة ثورة 14 يوليو، ولا تسمّي دينًا ولا مذهبًا له في نصّها ولا في صندوق معلوماتها."
