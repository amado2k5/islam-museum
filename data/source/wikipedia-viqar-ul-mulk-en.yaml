  ar: "مقالة ويكيبيديا الإنجليزية «وقار الملك»؛ تُستخدم لوقائع الكيان فقط، وهي مصدره الوحيد إذ لا توجد له مقالة عربية أو أردية ولا عنصر ويكيداتا. تذكر مولده باسم مشتاق حسين في ميروت في 24 مارس 1841 ووفاته في 27 يناير 1917 ودوره مؤسسًا لرابطة مسلمي عموم الهند وأمينها العام الأول."
  en: "English Wikipedia article 'Waqar-ul-Mulk'; used for entity facts only, and his only source, as he has no Arabic or Urdu article and no Wikidata item. It records his birth as Mushtaq Hussain at Meerut on 24 March 1841, his death on 27 January 1917, and his role as a founder and first general secretary of the All India Muslim League."
