summary:
  ar: "مقالة ويكيبيديا الإنجليزية «وقار الملك»؛ تُستخدم لوقائع الكيان فقط، وهي مصدره الوحيد إذ لا توجد له مقالة عربية أو أردية ولا عنصر ويكيداتا. تذكر مولده باسم مشتاق حسين في ميروت في 24 مارس 1841 ووفاته في 27 يناير 1917 ودوره مؤسسًا لرابطة مسلمي عموم الهند وأمينها العام الأول."
  en: "English Wikipedia article 'Waqar-ul-Mulk'; used for entity facts only, and his only source, as he has no Arabic or Urdu article and no Wikidata item. It records his birth as Mushtaq Hussain at Meerut on 24 March 1841, his death on 27 January 1917, and his role as a founder and first general secretary of the All India Muslim League."
  es: "Artículo de la Wikipedia en inglés «Waqar-ul-Mulk»; utilizado únicamente para obtener información sobre la persona y su única fuente, ya que no tiene artículo en árabe ni en urdu, ni tampoco una entrada en Wikidata. En él se registra su nacimiento como Mushtaq Hussain en Meerut el 24 de marzo de 1841, su fallecimiento el 27 de enero de 1917 y su papel como fundador y primer secretario general de la Liga Musulmana de la India."
  fr: "L'article Wikipédia en anglais intitulé « Waqar-ul-Mulk » est la seule source d'information le concernant, car il n'existe aucun article en arabe ou en ourdou, ni aucune entrée sur Wikidata. Cet article mentionne sa naissance sous le nom de Mushtaq Hussain à Meerut le 24 mars 1841, son décès le 27 janvier 1917, ainsi que son rôle de fondateur et de premier secrétaire général de la Ligue musulmane panindienne."
  ur: "انگریزی ویکیپیڈیا مضمون 'وقار الملک'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، اور اس کا واحد ماخذ، کیونکہ اس کا کوئی عربی یا اردو مضمون نہیں ہے اور نہ ہی کوئی وکی ڈیٹا آئٹم ہے۔ اس میں 24 مارچ 1841 کو میرٹھ میں مشتاق حسین کے طور پر ان کی پیدائش، 27 جنوری 1917 کو ان کی موت، اور آل انڈیا مسلم لیگ کے بانی اور پہلے جنرل سیکرٹری کے طور پر ان کا کردار درج ہے۔"
  tr: "İngilizce Vikipedi makalesi \"Kralın Onuru\" yalnızca varlığın gerçekleri için kullanılır ve tek kaynağıdır; çünkü içinde Arapça veya Urduca makale veya Wikidata öğesi yoktur. Doğumu Meerut'ta 24 Mart 1841'de Mushtaq Hussain olarak, 27 Ocak 1917'deki ölümü ve Tüm Hindistan Müslüman Ligi'nin kurucusu ve ilk sekreteri olarak rolü olarak anılmaktadır."
  id: "Artikel Wikipedia berbahasa Inggris \"The Dignity of the King\" hanya digunakan untuk fakta entitas tersebut dan merupakan satu-satunya sumbernya, karena tidak memiliki artikel Arab atau Urdu maupun elemen Wikidata. Kelahirannya disebutkan sebagai Mushtaq Hussain di Meerut pada 24 Maret 1841, dan kematiannya pada 27 Januari 1917, serta perannya sebagai pendiri dan sekretaris pertama All India Muslim League."
