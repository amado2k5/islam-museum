summary:
  ar: "تدوينة لميخايلو ياكوبوفيتش، 17 مارس 2023، عن «القرآن» بالليتوانية للشاعر سيغيتاس غيدا، أول ترجمة كاملة إلى الليتوانية سنة 2008، والنقد الذي لقيته، وطبعتها المنقّحة سنة 2010 بإشراف مفتي ليتوانيا."
  en: "A post by Mykhaylo Yakubovych, 17 March 2023, on the poet Sigitas Geda's Lithuanian Koranas, the first complete Lithuanian translation (2008), the criticism it met, and its revised edition of 2010 under the mufti of Lithuania."
  ur: "میخائیلو یاکوبووچ کی تحریر، 17 مارچ 2023، شاعر سیگیتاس گیدا کے لتھوانیائی «کوراناس» پر، لتھوانیائی کا پہلا مکمل ترجمہ ، 2008،، اس پر تنقید، اور 2010 میں مفتیِ لتھوانیا کی نگرانی میں نظرِ ثانی شدہ اشاعت۔"
  es: "Artículo de Mykhaylo Yakubovych, del 17 de marzo de 2023, sobre las Koranas lituanas del poeta Sigitas Geda, la primera traducción completa al lituano (2008), las críticas que recibió y su edición revisada de 2010 bajo el mandato del muftí de Lituania."
  fr: "Article de Mykhaylo Yakubovych, 17 mars 2023, sur le Coranas lituanien du poète Sigitas Geda, la première traduction lituanienne complète (2008), les critiques qu'elle a reçues et son édition révisée de 2010 sous le mufti de Lituanie."
  tr: "Mikhailo Yakupović'in 17 Mart 2023 tarihli bir yazısı; şair Segitas Gedda'nın Litvanca \"Kur'an\" adlı eseri, 2008'de Litvancaya ilk tam çevirisi, aldığı eleştiriler ve 2010'da Litvanya Büyük Müftüsü'nün gözetiminde revize edilmiş baskısı."
  id: "Sebuah tulisan oleh Mikhailo Yakupović, 17 Maret 2023, tentang \"Al-Quran\" dalam bahasa Lithuania karya penyair Segitas Gedda, terjemahan lengkap pertama ke dalam bahasa Lithuania pada tahun 2008, kritik yang diterimanya, dan edisi revisinya pada tahun 2010 di bawah pengawasan Grand Mufti Lithuania."
