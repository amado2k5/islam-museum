reliability_note: "Signed research post, read in full in Chrome on 7 November 2026. Used for the context (Lithuanian Tatars mostly using Polish), the 2008 first edition (1,000 copies, sold quickly), Geda (1943–2008; poet, translator, politician; Vilnius University), its reliance on the Russian translations of Sablukov and Krachkovsky, the criticisms by Muslim activists and by Egdūnas Račius as reported, the revised edition of 2010 with the mufti Romas Jakubauskas as second translator and the Muftiate's approval, and an earlier partial Ahmadiyya translation (1989)."
