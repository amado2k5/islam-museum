summary:
  ar: "دراسة شون ماكغريل في تاريخ القوارب والملاحة في العالم التي تؤرخ الكمال بالملاحين العرب أواخر القرن التاسع واستعماله في المحيط الهندي من القرن العاشر ثم تبنّيه هندياً وصينياً."
  en: "Seán McGrail's survey of world boats and seafaring, dating the kamal to Arab navigators of the late ninth century, its Indian Ocean employment from the tenth, and its Indian and Chinese adoption."
  ur: "شان مک گریل کی عالمی کشتیوں و ملاحت کی تحقیق جس نے کمال کو نویں صدی کے آخر کے عرب ملاحوں میں مؤرخ کیا، دسویں صدی سے بحیرۂ ہند میں استعمال، پھر ہندوستانی و چینی تبنی۔"
  es: "El estudio de Seán McGrail sobre las embarcaciones y la navegación en el mundo, que data el kamal en los navegantes árabes de finales del siglo IX, su uso en el Océano Índico desde el siglo X y su adopción por parte de la India y China."
  fr: "L'étude de Seán McGrail sur les bateaux et la navigation dans le monde, faisant remonter le kamal aux navigateurs arabes de la fin du IXe siècle, son utilisation dans l'océan Indien à partir du Xe siècle, et son adoption par les Indiens et les Chinois."
  tr: "Sean McGrail'in dünya çapında tekneler ve seyir tarihi üzerine çalışması, dokuzuncu yüzyılın sonlarında Arap denizcilerin mükemmelliğini ve onuncu yüzyıldan itibaren Hint Okyanusu'nda kullanımlarını, ardından Hindistan ve Çin'de benimsenmesini kronikleştiriyor."
  id: "Studi Sean McGrail tentang sejarah kapal dan navigasi di seluruh dunia, yang mendokumentasikan kesempurnaan navigator Arab pada akhir abad kesembilan dan penggunaannya di Samudra Hindia sejak abad kesepuluh, kemudian diadopsinya di India dan Tiongkok."
