label: { en: "Ashraf Ali Thanwi — TDV İslâm Ansiklopedisi" }
summary:
  ar: "مدخل أشرف علي التهانوي في موسوعة الإسلام التركية (TDV)، بقلم أ. س. بزمي أنصاري؛ تُستخدم لوقائع الكيان فقط. يرد في نسبه العلوي لقب «الحنفي»، ويذكر دراسته على محمود حسن الديوبندي وانتسابه إلى شيخ جشتي هو إمداد الله التهانوي، ووفاته في 6 رجب 1362 هـ."
  en: "Entry 'EŞREF ALİ' in the TDV İslâm Ansiklopedisi, by A. S. Bazmee Ansari; used for entity facts only. Its headword styles him 'al-Hanafi', records his studies under Mahmud Hasan Deobandi and his discipleship to the Chishti shaykh Imdadullah, and dates his death to 6 Rajab 1362 AH."
  es: "Entrada 'EŞREF ALİ' en el TDV İslâm Ansiklopedisi, de AS Bazmee Ansari; utilizada únicamente para datos sobre la entidad. Su encabezado lo denomina 'al-Hanafi', registra sus estudios con Mahmud Hasan Deobandi y su discipulado con el shaykh Chishti Imdadullah, y fecha su muerte el 6 de Rajab de 1362 AH."
  fr: "L'entrée « EŞREF ALİ » dans le TDV İslâm Ansiklopedisi, par AS Bazmee Ansari, est utilisée uniquement pour les informations relatives à l'entité. Son titre le qualifie d'« al-Hanafi », mentionne ses études auprès de Mahmud Hasan Deobandi et son enseignement auprès du cheikh Chishti Imdadullah, et date sa mort du 6 Rajab 1362 AH."
  ur: "TDV İslâm Ansiklopedisi میں 'EŞREF ALİ' کا اندراج، بذریعہ اے ایس بزمی انصاری؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا عنوان اسے 'الحنفی' کہتا ہے، محمود حسن دیوبندی کے تحت ان کی تعلیم اور چشتی شیخ امداد اللہ کی شاگردی کو درج کرتا ہے، اور ان کی وفات 6 رجب 1362 ہجری ہے۔"
  tr: "Ashraf Ali Al-Tahanawi'nin Türk İslam Ansiklopedisi'nde (TDV) A. S. Bazmi Ansari tarafından yazılan maddesi; yalnızca varlığın gerçekleri için kullanılır. Alevi soyunda 'Hanefi' unvanı yer alır ve Mahmud Hasan Deobandi'nin yanında çalışmasını, Şeyh Caşti İmdadullah Al-Tahanavi ile ilişkisini ve 6 Rajab 1362 H.'de vefatını belirtir."
  id: "Entri Ashraf Ali Al-Tahanawi dalam Ensiklopedia Islam Turki (TDV), oleh A. S. Bazmi Ansari; digunakan hanya untuk fakta entitas. Garis keturunan Alawi miliknya mencakup gelar 'Hanafi,' dan ia menyebutkan studinya di bawah Mahmoud Hassan Deobandi serta keterlibatannya dengan Sheikh Jashti, Imdadullah Al-Tahanawi, dan kematiannya pada 6 Rajab 1362 H."
