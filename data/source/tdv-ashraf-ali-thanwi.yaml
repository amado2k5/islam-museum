summary:
  ar: "مدخل أشرف علي التهانوي في موسوعة الإسلام التركية (TDV)، بقلم أ. س. بزمي أنصاري؛ تُستخدم لوقائع الكيان فقط. يرد في نسبه العلوي لقب «الحنفي»، ويذكر دراسته على محمود حسن الديوبندي وانتسابه إلى شيخ جشتي هو إمداد الله التهانوي، ووفاته في 6 رجب 1362 هـ."
  en: "Entry 'EŞREF ALİ' in the TDV İslâm Ansiklopedisi, by A. S. Bazmee Ansari; used for entity facts only. Its headword styles him 'al-Hanafi', records his studies under Mahmud Hasan Deobandi and his discipleship to the Chishti shaykh Imdadullah, and dates his death to 6 Rajab 1362 AH."
