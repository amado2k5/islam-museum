reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia, resting on the early biographies (Aziz al-Hasan, Ashraf al-Sawanih, 1938–43; Abdul Bari Nadvi; Daryabadi, Hakim al-Umma, 1951) and Metcalf's study of Deoband. Read in full on 25 October 2026. Its headword gives his nasab as 'Ashraf Ali b. Abd al-Haq al-Thanawi al-Faruqi al-Hanafi (1863–1943), Indian scholar and Sufi' — a Hanafi attestation in an independent scholarly source. It records his studies at Deoband under Mahmud Hasan Deobandi (logic, philosophy, fiqh and usul al-fiqh), Sayyid Ahmad Dehlvi (mathematics and inheritance law) and Ya'qub b. Mamluk Ali [Nanautawi] (hadith and tafsir); his Hajj and discipleship (intisab) to Imdadullah of Thana Bhawan, 'among the shaykhs of the Chishtiyya order'; his teaching at the Jami' al-Ulum madrasa in Kanpur (the English and Urdu articles name the Kanpur school Faiz-e-Aam); his second Mecca stay and return in 1897 to settle at Thana Bhawan for life; works numbering about 800 with treatises, the Bayan al-Qur'an in twelve volumes and Behishti Zewar in ten. CAUTION — death date: TDV gives 6 Rajab 1362, which it converts to 9 July 1943, against the 20 July 1943 of the English and Urdu articles and Wikidata; the record follows the majority and records the variant."
