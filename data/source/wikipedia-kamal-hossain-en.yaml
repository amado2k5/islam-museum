summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كمال حسين؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 20 أبريل 1937 في كلكتا في أسرة تنتسب إلى علي، ووالده أحمد حسين من أوائل الأطباء المسلمين البنغال، وانتقال الأسرة إلى دكا سنة 1949، وتعليمه في أكسفورد، ووزارتيه للقانون (1972–1973) والخارجية (1973–1975)، وتأسيسه حزب غانو فورم، واعتزاله السياسة في أكتوبر 2023. لا يحمل صندوق معلوماتها أي قيمة للديانة."
  en: "English Wikipedia article on Kamal Hossain; used for entity facts only. It gives his birth on 20 April 1937 at Calcutta into a family claiming descent from Ali, his father Ahmed Hossain as an early Bengali Muslim physician, the family's move to Dhaka in 1949, his Oxford education, his law ministry (1972–1973) and foreign ministry (1973–1975), his founding of the Gano Forum, and his retirement from politics in October 2023. Its infobox carries no religion value."
