summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كمال حسين؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 20 أبريل 1937 في كلكتا في أسرة تنتسب إلى علي، ووالده أحمد حسين من أوائل الأطباء المسلمين البنغال، وانتقال الأسرة إلى دكا سنة 1949، وتعليمه في أكسفورد، ووزارتيه للقانون (1972–1973) والخارجية (1973–1975)، وتأسيسه حزب غانو فورم، واعتزاله السياسة في أكتوبر 2023. لا يحمل صندوق معلوماتها أي قيمة للديانة."
  en: "English Wikipedia article on Kamal Hossain; used for entity facts only. It gives his birth on 20 April 1937 at Calcutta into a family claiming descent from Ali, his father Ahmed Hossain as an early Bengali Muslim physician, the family's move to Dhaka in 1949, his Oxford education, his law ministry (1972–1973) and foreign ministry (1973–1975), his founding of the Gano Forum, and his retirement from politics in October 2023. Its infobox carries no religion value."
  es: "Artículo de la Wikipedia en inglés sobre Kamal Hossain; utilizado únicamente para datos sobre la persona. Describe su nacimiento el 20 de abril de 1937 en Calcuta en una familia que afirmaba descender de Ali, la figura de su padre, Ahmed Hossain, como uno de los primeros médicos musulmanes bengalíes, el traslado de la familia a Dhaka en 1949, su formación en Oxford, su ministerio de Justicia (1972-1973) y de Asuntos Exteriores (1973-1975), la fundación del Foro Gano y su retiro de la política en octubre de 2023. Su ficha informativa no tiene valor religioso."
  fr: "Article Wikipédia en anglais sur Kamal Hossain; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 20 avril 1937 à Calcutta, au sein d'une famille se réclamant de la lignée d'Ali; son père, Ahmed Hossain, était un médecin musulman bengali de la première heure; le déménagement de la famille à Dacca en 1949; ses études à Oxford; son ministère de la Justice (1972-1973) et des Affaires étrangères (1973-1975); la fondation du Forum Gano; et son retrait de la vie politique en octobre 2023. Son infobox ne mentionne pas la religion."
  ur: "کمال حسین پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے ان کی پیدائش 20 اپریل 1937 کو کلکتہ میں ایک ایسے خاندان میں ہوئی جس کا دعویٰ تھا کہ وہ علی سے تعلق رکھتے ہیں، اس کے والد احمد حسین ایک ابتدائی بنگالی مسلمان ڈاکٹر کے طور پر، خاندان کا 1949 میں ڈھاکہ منتقل ہونا، اس کی آکسفورڈ کی تعلیم، اس کی وزارت قانون (1972-1973) اور وزارت خارجہ (1973-1973)، ان کی ریٹائرمنٹ اور 1973-1973 میں ان کی خدمات حاصل کی گئیں۔ اکتوبر 2023 میں سیاست سے۔ اس کے انفو باکس میں مذہب کی کوئی اہمیت نہیں ہے۔"
