reliability_note: "A research-grade archaeological site register for the MENA region — site identity, period, condition and threat data — the strongest single corroboration source for building and place records after Archnet. Licence: eamena.org/open-access-policy states 'The EAMENA Database is licensed under a Creative Commons Attribution 4.0 International License' — open with attribution; the museum's {cite:eamena <heritage-place-id>} is the attribution. Access tiers recorded: Public Access withholds coordinates, map zoom and condition data; Research Access needs registration (not yet held — so no coordinate-dependent claims are sourced from the public tier); Contributor Access for edits. Harvest channel: ARCHES 7 search and GeoJSON export (database.eamena.org/api/search/export_results) plus the Zenodo EAMENA dataset community. Verified live 8 November 2026; decision dec-20261108-222 (supersedes engine false-positive dec-20261108-221)."
