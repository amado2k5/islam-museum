summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فرحان بهاردين (مواليد 1983)، لاعب الكريكت الجنوب أفريقي الدولي السابق؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في جوهانسبرغ في 9 أكتوبر 1983، ومسيرته الدولية في مباريات اليوم الواحد والعشرينيات لجنوب أفريقيا بين 2012 و2018، وتعيينه قائدا للعشرينيات في يناير 2017، وإحصاءاته (59 مباراة يوم واحد و38 عشرينية دولية)، واعتزاله الكريكت الدولية المعلن في ديسمبر 2022. لا تذكر المقالة دينا له."
  en: "English Wikipedia article on Farhaan Behardien (born 1983), the former South African international cricketer; used for entity facts only. It records his birth in Johannesburg on 9 October 1983, his ODI and T20I career for South Africa between 2012 and 2018, his appointment as T20I captain in January 2017, his career statistics (59 ODIs and 38 T20Is), and his retirement from international cricket announced in December 2022. The article states no religion for him."
