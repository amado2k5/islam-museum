label: { en: "Voice of America — 'Mali's Sufi Leaders Preach Against Radicalization' (May 2016)" }
summary:
  ar: "تقرير «صوت أمريكا» ⁦(25 مايو 2016)⁩ عن تكوين قادة الصوفية في مالي تجمّعًا لمواجهة الدعاة المتطرفين المموَّلين من الخارج؛ يذكر أن حيدرة يؤمّ الصلاة في المسجد الرئيسي بسيغو ويزور مسجدًا جديدًا في مدينة مختلفة كل يوم جمعة تقريبًا."
  en: "Voice of America report (25 May 2016) on Mali's Sufi leaders forming a collective to counter foreign-sponsored radical preachers; it notes that Haidara leads prayers at the main mosque in Ségou and was visiting a new mosque in a different city almost every Friday."
  es: "Un reportaje de Voice of America (25 de mayo de 2016) sobre la formación de un colectivo por parte de los líderes sufíes de Malí para contrarrestar a los predicadores radicales patrocinados por extranjeros; en él se señala que Haidara dirige las oraciones en la mezquita principal de Ségou y que visitaba una nueva mezquita en una ciudad diferente casi todos los viernes."
  fr: "Un reportage de Voice of America (25 mai 2016) sur les chefs soufis du Mali formant un collectif pour contrer les prédicateurs radicaux soutenus par l'étranger; il note que Haidara dirige les prières à la mosquée principale de Ségou et visitait une nouvelle mosquée dans une ville différente presque tous les vendredis."
  ur: "مالی کے صوفی رہنماؤں کے بارے میں وائس آف امریکہ کی رپورٹ ⁦(25 مئی 2016)⁩ غیر ملکی حمایت یافتہ بنیاد پرست مبلغین کا مقابلہ کرنے کے لیے ایک اجتماع کی تشکیل؛ اس میں بتایا گیا ہے کہ حیدرا سیگو کی مرکزی مسجد میں نماز کی امامت کرتی ہے اور تقریباً ہر جمعہ کو ایک مختلف شہر میں ایک نئی مسجد میں جاتی تھی۔"
