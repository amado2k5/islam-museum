reliability_note: "Read on 4 November 2026 in the Tolerance.ca republication; the original is on voanews.com. It reports that Mali's Sufi leaders formed the Collective of Muslim Spiritual Leaders of Mali (GLSM) to counter foreign-sponsored radical preaching, and that Haidara leads prayers at the main mosque in Ségou and was visiting a new mosque in a different city almost every Friday. It is the reportage the English Wikipedia article cites for calling him a Sufi."
