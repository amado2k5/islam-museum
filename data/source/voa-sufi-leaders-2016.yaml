summary:
  ar: "تقرير «صوت أمريكا» ⁦(25 مايو 2016)⁩ عن تكوين قادة الصوفية في مالي تجمّعًا لمواجهة الدعاة المتطرفين المموَّلين من الخارج؛ يذكر أن حيدرة يؤمّ الصلاة في المسجد الرئيسي بسيغو ويزور مسجدًا جديدًا في مدينة مختلفة كل يوم جمعة تقريبًا."
  en: "Voice of America report (25 May 2016) on Mali's Sufi leaders forming a collective to counter foreign-sponsored radical preachers; it notes that Haidara leads prayers at the main mosque in Ségou and was visiting a new mosque in a different city almost every Friday."
