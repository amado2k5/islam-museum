reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. This article is the second of the two attestations on which the person record's faith segment rests: it states in terms that he is Sunni in creed and Maliki in fiqh (وهو سني العقيدة وسطي النهج مالكي الفقه). It also covers his upbringing in a Greek Orthodox family in northern California, his conversion to Islam at eighteen in 1977 in Santa Barbara, his four years of fiqh study in the Emirates, his study of Arabic language and poetry in Morocco, Algeria and Mauritania, his Mauritanian teachers (the Shinqiti scholars, Shaykh Baya bin Salik, and above all Murabit al-Hajj) and his later companionship of Abdallah bin Bayyah, his return to the United States in 1996 and founding of Zaytuna, his ijazahs, his degrees in nursing and religious studies, his translations, his media presence (the MBC programme Riḥla and the idea of Yalla Shabab), and that he is married with five children. Its birth datum conflicts with the English article and Wikidata: it dates his birth 1 January 1960, where they give the year 1958; the person record follows 1958 and records the variant. Much of this article is thinly referenced, and it is used only where its statements are plain or corroborated. Read in full on 24 October 2026."
