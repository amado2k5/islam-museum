summary:
  ar: "مقالة ويكيبيديا العربية عن حمزة يوسف؛ تُستخدم لوقائع الكيان فقط. تصرّح بأنه «سني العقيدة وسطي النهج مالكي الفقه»، وتوثّق إسلامه سنة 1977، وسنواته في الإمارات والمغرب العربي وموريتانيا، وشيوخه ومنهم المرابط الحاج وعبد الله بن بيه، وتأسيسه زيتونة سنة 1996."
  en: "Arabic Wikipedia article on Hamza Yusuf; used for entity facts only. It states outright that he is 'Sunni in creed, moderate in approach, Maliki in jurisprudence', and records his conversion in 1977, his years in the Emirates, the Maghreb and Mauritania, his teachers including Murabit al-Hajj and Abdallah bin Bayyah, and his founding of Zaytuna in 1996."
