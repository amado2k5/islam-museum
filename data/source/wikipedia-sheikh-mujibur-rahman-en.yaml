summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشيخ مجيب الرحمن؛ تُستخدم لوقائع الكيان فقط. تروي مولده في تونجيبارا في 17 مارس 1920 في أسرة بنغالية مسلمة أرستقراطية، ونشاطه في رابطة المسلمين ثم رابطة عوامي، ونقاطه الست وانتخابات 1970 وخطاب 7 مارس 1971 وسجنه أثناء حرب التحرير، ورئاسته للوزراء (1972–1975) ثم رئاسته للجمهورية، ومجاعة 1974 وفترة باكسال أحادية الحزب، واغتياله في دكا في 15 أغسطس 1975. لا يحمل صندوق معلوماتها حقلًا للديانة ولا يذكر متنها انتماءً دينيًا شخصيًا له."
  en: "English Wikipedia article on Sheikh Mujibur Rahman; used for entity facts only. It recounts his birth at Tungipara on 17 March 1920 into an aristocratic Bengali Muslim family, his Muslim League and Awami League career, the Six Points, the 1970 election, the 7 March 1971 speech, his imprisonment during the Liberation War, his premiership (1972–1975) and presidency, the 1974 famine and the one-party BAKSAL period, and his assassination at Dhaka on 15 August 1975. Its infobox carries no religion field and its text states no personal religious affiliation for him."
