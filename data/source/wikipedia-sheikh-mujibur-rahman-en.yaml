summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشيخ مجيب الرحمن؛ تُستخدم لوقائع الكيان فقط. تروي مولده في تونجيبارا في 17 مارس 1920 في أسرة بنغالية مسلمة أرستقراطية، ونشاطه في رابطة المسلمين ثم رابطة عوامي، ونقاطه الست وانتخابات 1970 وخطاب 7 مارس 1971 وسجنه أثناء حرب التحرير، ورئاسته للوزراء (1972–1975) ثم رئاسته للجمهورية، ومجاعة 1974 وفترة باكسال أحادية الحزب، واغتياله في دكا في 15 أغسطس 1975. لا يحمل صندوق معلوماتها حقلًا للديانة ولا يذكر متنها انتماءً دينيًا شخصيًا له."
  en: "English Wikipedia article on Sheikh Mujibur Rahman; used for entity facts only. It recounts his birth at Tungipara on 17 March 1920 into an aristocratic Bengali Muslim family, his Muslim League and Awami League career, the Six Points, the 1970 election, the 7 March 1971 speech, his imprisonment during the Liberation War, his premiership (1972–1975) and presidency, the 1974 famine and the one-party BAKSAL period, and his assassination at Dhaka on 15 August 1975. Its infobox carries no religion field and its text states no personal religious affiliation for him."
  es: "Artículo de la Wikipedia en inglés sobre Sheikh Mujibur Rahman; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Tungipara el 17 de marzo de 1920 en el seno de una familia musulmana bengalí aristocrática, su trayectoria en la Liga Musulmana y la Liga Awami, los Seis Puntos, las elecciones de 1970, el discurso del 7 de marzo de 1971, su encarcelamiento durante la Guerra de Liberación, su mandato como primer ministro (1972-1975) y presidente, la hambruna de 1974 y el período del partido único BAKSAL, y su asesinato en Dhaka el 15 de agosto de 1975. Su ficha informativa no incluye ningún campo sobre religión y su texto no indica ninguna afiliación religiosa personal por su parte."
  fr: "Article de Wikipédia en anglais sur Sheikh Mujibur Rahman; utilisé uniquement pour les informations sur l'entité. Il relate sa naissance à Tungipara le 17 mars 1920 au sein d'une famille aristocratique musulmane bengalie, son parcours au sein de la Ligue musulmane et de la Ligue Awami, le programme des Six Points, les élections de 1970, le discours du 7 mars 1971, son emprisonnement pendant la guerre de libération, son mandat de Premier ministre (1972-1975) et de président, la famine de 1974 et la période du parti unique BAKSAL, ainsi que son assassinat à Dacca le 15 août 1975. Son infobox ne comporte pas de champ « religion » et son texte ne mentionne aucune appartenance religieuse personnelle."
