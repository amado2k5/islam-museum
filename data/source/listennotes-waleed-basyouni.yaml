summary:
  ar: "قائمة Listen Notes لبودكاست مسلم سنترال الخاص بوليد بسيوني؛ سيرتها المرفقة تذكر شهاداته في الدراسات الإسلامية مع التركيز على الفقه والعقيدة، وعضويته في اتحاد أئمة أمريكا الشمالية ولجنة الفتوى والبحوث في جمعية فقهاء أمريكا المسلمين، وإدارته مؤتمر تكساس للدعوة."
  en: "The Listen Notes listing of Muslim Central's Waleed Basyouni podcast; its attached biography records his degrees in Islamic studies focussed on jurisprudence and theology, his membership of the North American Imam Federation, his seat on the Assembly of Muslim Jurists of America's Fatwa and Research Committee, and his directorship of the Texas Dawah Convention."
  es: "La ficha de Listen Notes del podcast de Waleed Basyouni de Muslim Central, junto con su biografía adjunta, recoge sus títulos en estudios islámicos centrados en jurisprudencia y teología, su pertenencia a la Federación Norteamericana de Imanes, su puesto en el Comité de Fatwas e Investigación de la Asamblea de Juristas Musulmanes de América y su dirección de la Convención Dawah de Texas."
  fr: "La fiche Listen Notes du podcast Waleed Basyouni de Muslim Central; sa biographie jointe mentionne ses diplômes en études islamiques axés sur la jurisprudence et la théologie, son appartenance à la Fédération des imams d'Amérique du Nord, son siège au Comité des fatwas et de la recherche de l'Assemblée des juristes musulmans d'Amérique et sa direction de la Convention Dawah du Texas."
