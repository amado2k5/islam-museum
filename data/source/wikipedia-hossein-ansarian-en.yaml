summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسين أنصاريان: تصفه في متنها بأنه رجل دين شيعي إيراني، مولود في 9 نوفمبر 1944 في خوانسار بمحافظة إصفهان، درس في حوزتي قم وطهران، وترجم القرآن ونهج البلاغة والصحيفة السجادية ومفاتيح الجنان وشرح دعاء كميل وغيرها."
  en: "The English Wikipedia article on Hossein Ansarian: its prose describes him as an Iranian Shia cleric, born on 9 November 1944 in Khvansar, Isfahan province, educated at the Qom and Tehran seminaries, translator of the Qur'an, Nahj al-Balagha, the Sahifa al-Sajjadiyya and Mafatih al-Jinan, and commentator on the Kumayl supplication."
  es: "El artículo de Wikipedia en inglés sobre Hossein Ansarian: su prosa lo describe como un clérigo chiita iraní, nacido el 9 de noviembre de 1944 en Khvansar, provincia de Isfahán, educado en los seminarios de Qom y Teherán, traductor del Corán, Nahj al-Balagha, Sahifa al-Sajjadiyya y Mafatih al-Jinan, y comentarista de la súplica de Kumayl."
  fr: "L'article de Wikipédia en anglais sur Hossein Ansarian: son texte le décrit comme un religieux chiite iranien, né le 9 novembre 1944 à Khvansar, dans la province d'Ispahan, et ayant étudié dans les séminaires de Qom et de Téhéran."
  ur: "حسین انصاری پر انگریزی ویکیپیڈیا کا مضمون: اس کی نثر میں انہیں ایک ایرانی شیعہ عالم کے طور پر بیان کیا گیا ہے، جو 9 نومبر 1944 کو صوبہ اصفہان کے شہر خوانسر میں پیدا ہوئے، قم اور تہران کے مدرسوں میں تعلیم یافتہ، قرآن کے مترجم، نہج البلاغہ، صحیفہ المعروف السجعیان اور تفسیر المعانی کومیل کی دعا۔"
  tr: "Hüseyin Ensaryan hakkında İngilizce Vikipedi makalesi: Metinde onu 9 Kasım 1944'te İsfahan eyaletinin Hansar kentinde doğan İranlı bir Şii din adamı olarak tanımlar. Kum ve Tahran seminerlerinde eğitim aldı, Kur'an, Nahj al-Belage, Sahifa al-Sajcadiyya, Mafatih al-Jinan, Kamil'in duası üzerine yorumlar ve diğerlerini çevirdi."
  id: "Artikel Wikipedia bahasa Inggris tentang Hossein Ansarian: Dalam teks digambarkan sebagai ulama Syiah Iran, lahir pada 9 November 1944 di Khansar, provinsi Isfahan. Ia belajar di seminari Qom dan Teheran, serta menerjemahkan Al-Qur'an, Nahj al-Balagha, Sahifa al-Sajjadiyya, Mafatih al-Jinan, komentar atas permohonan Kamil, dan lainnya."
