  ar: "مقالة ويكيبيديا الإنجليزية عن حسين أنصاريان: تصفه في متنها بأنه رجل دين شيعي إيراني، مولود في 9 نوفمبر 1944 في خوانسار بمحافظة إصفهان، درس في حوزتي قم وطهران، وترجم القرآن ونهج البلاغة والصحيفة السجادية ومفاتيح الجنان وشرح دعاء كميل وغيرها."
