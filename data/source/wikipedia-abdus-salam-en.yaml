reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth in Jhang (29 January 1926) into a Punjabi family professing Ahmadiyya, his education in Lahore and Cambridge, the 1951 doctorate, the Imperial College years, his role as Pakistan's science adviser 1960–1974, founding director of SUPARCO (established 16 September 1961), founder of the ICTP in 1964, the 1979 Nobel Prize in Physics shared with Glashow and Weinberg, his 1974 departure from Pakistan in protest after parliament declared Ahmadiyya members non-Muslim, his death in Oxford on 21 November 1996, and his burial at Bahishti Maqbara, Rabwah, where the word 'Muslim' was later obscured on his tomb's epitaph by a local magistrate's order. Opened in Chrome on 26 Oct 2026."
