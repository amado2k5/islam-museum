  ar: "مقالة ويكيبيديا العربية عن نسيم شاه ⁦(ناز شاه)⁩: سياسية بريطانية في حزب العمال، وُلدت في 13 تشرين الثاني 1973، وانتُخبت عضوة في البرلمان عن برادفورد الغربية سنة 2015، وأُوقفت عن الحزب مؤقتًا سنة 2016."
  en: "Arabic Wikipedia article on Naseem Shah (Naz Shah), the British Labour politician born on 13 November 1973, elected MP for Bradford West in 2015 and briefly suspended from the party in 2016."
  es: "Artículo en árabe de la Wikipedia sobre Naseem Shah (Naz Shah), el político laborista británico nacido el 13 de noviembre de 1973, elegido diputado por Bradford West en 2015 y suspendido brevemente del partido en 2016."
  fr: "Article de Wikipédia en arabe sur Naseem Shah (Naz Shah), homme politique travailliste britannique né le 13 novembre 1973, élu député de Bradford West en 2015 et brièvement suspendu du parti en 2016."
  ur: "13 نومبر 1973 کو پیدا ہونے والے برطانوی لیبر سیاست دان نسیم شاہ ⁦(ناز شاہ)⁩ پر عربی ویکیپیڈیا کا مضمون، 2015 میں بریڈ فورڈ ویسٹ سے رکن پارلیمنٹ منتخب ہوئے اور 2016 میں پارٹی سے مختصر طور پر معطل کر دیے گئے۔"
  tr: "Naseem Shah (Naz Shah) hakkında Arapça Vikipedi makalesi: İşçi Partisi'nde İngiliz bir politikacı, 13 Kasım 1973 doğumlu, 2015'te West Bradford milletvekili seçildi ve 2016'da geçici olarak partiden uzaklaştırıldı."
  id: "Artikel Wikipedia bahasa Arab tentang Naseem Shah (Naz Shah): Seorang politisi Inggris di Partai Buruh, lahir pada 13 November 1973, terpilih sebagai Anggota Parlemen untuk West Bradford pada 2015, dan sementara diskors dari partai pada 2016."
