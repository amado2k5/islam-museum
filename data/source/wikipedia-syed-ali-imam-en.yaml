  ar: "مقالة ويكيبيديا الإنجليزية عن السير سيد علي إمام؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 11 فبراير 1869 ووفاته في 31 أكتوبر 1932 في رانشي، ودراسته القانون في لندن، وعضويته في حكومة الهند، وقضاءه في محكمة باتنا العليا، ورئاسته وزراء دولة حيدرآباد 1919–1922."
  en: "English Wikipedia article on Sir Syed Ali Imam; used for entity facts only. It gives his birth on 11 February 1869 and death on 31 October 1932 at Ranchi, his legal studies in London, his membership of the Government of India as law member, his judgeship of the Patna High Court, and his prime ministership of Hyderabad State 1919–1922."
