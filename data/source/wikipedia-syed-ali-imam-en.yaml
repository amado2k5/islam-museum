summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن السير سيد علي إمام؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 11 فبراير 1869 ووفاته في 31 أكتوبر 1932 في رانشي، ودراسته القانون في لندن، وعضويته في حكومة الهند، وقضاءه في محكمة باتنا العليا، ورئاسته وزراء دولة حيدرآباد 1919–1922."
  en: "English Wikipedia article on Sir Syed Ali Imam; used for entity facts only. It gives his birth on 11 February 1869 and death on 31 October 1932 at Ranchi, his legal studies in London, his membership of the Government of India as law member, his judgeship of the Patna High Court, and his prime ministership of Hyderabad State 1919–1922."
  es: "Artículo de la Wikipedia en inglés sobre Sir Syed Ali Imam; utilizado únicamente para obtener información sobre la persona. En él se indica que nació el 11 de febrero de 1869 y falleció el 31 de octubre de 1932 en Ranchi, sus estudios de derecho en Londres, su pertenencia al Gobierno de la India como miembro del consejo jurídico, su cargo como juez del Tribunal Superior de Patna y su mandato como primer ministro del estado de Hyderabad entre 1919 y 1922."
  fr: "Article de Wikipédia en anglais sur Sir Syed Ali Imam; utilisé uniquement pour les informations factuelles. Il indique sa naissance le 11 février 1869 et son décès le 31 octobre 1932 à Ranchi, ses études de droit à Londres, son poste de membre du gouvernement indien en tant que conseiller juridique, sa fonction de juge à la Haute Cour de Patna et son mandat de Premier ministre de l’État d’Hyderabad de 1919 à 1922."
  ur: "سر سید علی امام پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 11 فروری 1869 کو ان کی پیدائش اور 31 اکتوبر 1932 کو رانچی میں موت، لندن میں ان کی قانونی تعلیم، قانون کے رکن کے طور پر حکومت ہند کی رکنیت، پٹنہ ہائی کورٹ کی ان کی جج شپ، اور حیدرآباد ریاست 1919-1922 کی ان کی وزارت عظمیٰ شامل ہے۔"
  tr: "Sir Syed Ali İmam hakkında İngilizce Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. 11 Şubat 1869'da doğdu ve 31 Ekim 1932'de Ranchi'de vefat etti, Londra'da hukuk okudu, Hindistan Hükümeti üyesi olarak görev yaptı, Patna Yüksek Mahkemesi'nde yargıçlık yaptı ve 1919-1922 yılları arasında Haydarabad Eyaleti Bakanı olarak görev yaptı."
  id: "Artikel Wikipedia bahasa Inggris tentang Sir Syed Ali Imam; digunakan hanya untuk fakta entitas. Ia lahir pada 11 Februari 1869, dan meninggal pada 31 Oktober 1932 di Ranchi, belajar hukum di London, menjadi anggota Pemerintah India, menjabat sebagai hakim di Pengadilan Tinggi Patna, dan menjabat sebagai Menteri Negara Bagian Hyderabad dari tahun 1919 hingga 1922."
