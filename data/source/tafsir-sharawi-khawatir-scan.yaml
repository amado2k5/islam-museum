reliability_note: "Edition not verified. The local copy is a scan read through OCR, and several pages are noisy. The edition year, printing and printed page numbers are not recorded. Citations use the scan page index of the local copy (p.N), not a printed page number, and every page must be checked against a printed copy before publication. The author calls the work khawatir (passing thoughts), not a tafsir in the strict sense, in his own introduction (scan p.9). The same scan file carries the later volumes of the set on higher page numbers: scan pp. 2501-2522 (Surat al-Nisa, verses 86 to 88 and the discussion of decree) are cited from it by the 2501-3000 harvest. The label and summary above describe volume one only; the publisher and volume of the later pages are not yet checked."
