summary:
  ar: "المجلد الأول من خواطر محمد متولي الشعراوي حول القرآن الكريم، من أول الفاتحة إلى الآية 154 من البقرة، بنسخة ممسوحة مقروءة بالتعرف الضوئي على الحروف. يبدأ بمقدمة المؤلف وبمدخل عن الإعجاز والتنزيل ثم يتناول السور."
  en: "Volume one of Muhammad Mutawalli al-Sha'rawi's Khawatir around the Holy Quran, from al-Fatiha to Q. 2:154, read from a scanned copy through OCR. It opens with the author's preface and an introduction on inimitability and revelation, then takes the surahs in order."
