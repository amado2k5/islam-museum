reliability_note: "A devotional biography booklet circulating from the subject's own circle, read on 4 November 2026; used only for the education chronology (primary school in Lamongan; Pesantren Bungah, Gresik; Pondok Pesantren Bahrul Ulum, Jombang; IAIN Sunan Kalijaga's Islamic dawah programme from 1994; secretary-general of the Southeast Asian Muslim students' association) and for his 2019 book Islam Rahmatan lil-Alamin (MedPres), and each such fact is attributed to the booklet in the prose. Its admiring anecdotes (for example about the fall of the Wahid government in 2001) are not used. A sympathetic single source, not independent corroboration."
