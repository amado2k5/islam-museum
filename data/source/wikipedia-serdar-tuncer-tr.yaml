summary:
  ar: "مقالة ويكيبيديا التركية عن سردار تونجر؛ تُستخدم لوقائع الكيان فقط. تفصّل ميلاده في 16 أغسطس 1978 في ألتينداغ بأنقرة، ومهنته شاعرًا وكاتبًا ومقدمًا تلفزيونيًا، وبرامجه على القنوات التركية، وكتبه ودواوينه الشعرية."
  en: "Turkish Wikipedia article on Serdar Tuncer; used for entity facts only. It details his birth on 16 August 1978 in Altındağ, Ankara, his work as a poet, writer and television presenter, his programmes on Turkish channels, and his books and poetry albums."
  es: "Artículo de la Wikipedia en turco sobre Serdar Tuncer; utilizado únicamente para obtener información sobre la persona. Detalla su nacimiento el 16 de agosto de 1978 en Altındağ, Ankara, su trabajo como poeta, escritor y presentador de televisión, sus programas en canales turcos y sus libros y álbumes de poesía."
  fr: "Article de Wikipédia en turc sur Serdar Tuncer; utilisé uniquement à des fins d’information sur l’entité. Il détaille sa naissance le 16 août 1978 à Altındağ, Ankara, son travail de poète, d’écrivain et de présentateur de télévision, ses émissions sur les chaînes turques, ainsi que ses livres et recueils de poésie."
  ur: "Serdar Tuncer پر ترکی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 16 اگست 1978 کو Altındağ، انقرہ میں، بطور شاعر، مصنف اور ٹیلی ویژن پیش کرنے والے کے کام، ترکی کے چینلز پر ان کے پروگراموں، اور ان کی کتابوں اور شاعری کے البمز کی تفصیلات درج ہیں۔"
  tr: "Serdar Tüncer hakkında Türkçe Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 16 Ağustos 1978'de Ankara'nın Altındağ'da doğdu ve şair, yazar ve televizyon sunuculuğu mesleği, Türk kanallarındaki programları ile kitapları ve şiir koleksiyonlarıyla ilgilendi."
  id: "Artikel Wikipedia Turki tentang Serdar Tüncer; hanya digunakan untuk fakta entitas. Ia lahir pada 16 Agustus 1978 di Altındağ, Ankara, dan profesinya sebagai penyair, penulis, dan pembawa acara televisi, programnya di saluran Turki, serta buku dan kumpulan puisinya."
