summary:
  ar: "مقال تعريفي في موقع كابيتال مصر عن الداعية الإسلامية الدكتورة نيفين مختار، الواعظة بوزارة الأوقاف المصرية؛ يصف حضورها التلفزيوني وموضوعات خطابها الدعوي المتركزة على الأسرة والمرأة وتربية الأبناء والعلاقات الزوجية وأسئلة العبادات، وتميّزها في شرح مناسك الحج، وتحذيرها من التشهير والمحتوى المفبرك على مواقع التواصل."
  en: "A profile on the Capital Misr site of the Islamic preacher Dr Neveen Mokhtar, a female preacher (wa'iza) at Egypt's Ministry of Awqaf; it describes her television presence and the themes of her dawah discourse, centred on the family, women, child-rearing, marital relations and questions of worship, her noted ability to explain the Hajj rites accessibly, and her warnings against defamation and fabricated content on social media."
