summary:
  ar: "مقالة ويكيبيديا الأردية عن عبد العزيز بن عبد الرحمن آل سعود ⁦(15 يناير 1877 – 9 نوفمبر 1953)⁩، مؤسس المملكة العربية السعودية وأول ملوكها؛ تروي أسرته ونفيها إلى الكويت واسترداده الرياض سنة 1902 وقضاءه على إمارة آل رشيد سنة 1921 وإعلان المملكة في 23 سبتمبر 1932 ووفاته سنة 1953، وتحمل بطاقتها في حقل الدين «الإسلام السني»."
  en: "Urdu Wikipedia article on Abdulaziz bin Abdul Rahman Al Saud (15 January 1877 – 9 November 1953), founder and first King of Saudi Arabia; it recounts his family and its exile to Kuwait, his recapture of Riyadh in 1902, the end of the Rashidi emirate in 1921, the proclamation of the kingdom on 23 September 1932 and his death in 1953, and its infobox religion field reads 'Sunni Islam'."
  es: "Artículo en urdu de Wikipedia sobre Abdulaziz bin Abdul Rahman Al Saud (15 de enero de 1877 - 9 de noviembre de 1953), fundador y primer rey de Arabia Saudita; relata la historia de su familia y su exilio a Kuwait, la reconquista de Riad en 1902, el fin del emirato Rashidi en 1921, la proclamación del reino el 23 de septiembre de 1932 y su muerte en 1953, y el campo de religión de su ficha informativa dice \"Islam sunita\"."
  fr: "L'article de Wikipédia en ourdou sur Abdulaziz bin Abdul Rahman Al Saud (15 janvier 1877 – 9 novembre 1953), fondateur et premier roi d'Arabie saoudite; il relate l'histoire de sa famille et son exil au Koweït, sa reconquête de Riyad en 1902, la fin de l'émirat rashidi en 1921, la proclamation du royaume le 23 septembre 1932 et sa mort en 1953, et son champ religion dans l'infobox indique « Islam sunnite »."
  ur: "عبدالعزیز بن عبدالرحمن آل سعود ⁦(15 جنوری 1877 - 9 نومبر 1953)⁩، سعودی عرب کے بانی اور پہلے بادشاہ پر اردو ویکیپیڈیا کا مضمون؛ اس میں اس کے خاندان اور کویت میں جلاوطنی، 1902 میں ریاض پر اس کا دوبارہ قبضہ، 1921 میں راشدی امارت کا خاتمہ، 23 ستمبر 1932 کو بادشاہی کا اعلان اور 1953 میں ان کی موت کا ذکر کیا گیا ہے، اور اس کے انفو باکس مذہب کا میدان 'سنی اسلام' پڑھتا ہے۔"
  tr: "Suudi Arabistan Krallığı'nın kurucusu ve ilk kralı Abdulaziz bin Abdulrahman Al Saud (15 Ocak 1877 – 9 Kasım 1953) hakkında Urduca Wikipedia makalesi; ailesini, Kuveyt'e sürgünü, 1902'de Riyad'ı geri almasını, 1921'de Al Rashid Emirliği'ni ortadan kaldırmasını, 23 Eylül 1932'de krallığın ilanını ve 1953'teki ölümünü anlatır ve din alanında (Sünni İslam) iz bırakır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Abdulaziz bin Abdul Rahman Al Saud (15 Januari 1877 – 9 November 1953), pendiri Kerajaan Arab Saudi dan raja pertamanya; artikel ini menceritakan keluarganya, pengasingan ke Kuwait, pemulihan Riyadh pada tahun 1902, penghapusan Emirat Al Rashid pada tahun 1921, deklarasi kerajaan pada 23 September 1932, dan kematiannya pada tahun 1953, yang menunjukkan tandanya di bidang agama (Islam Sunni)."
