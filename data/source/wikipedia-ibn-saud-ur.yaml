  ar: "مقالة ويكيبيديا الأردية عن عبد العزيز بن عبد الرحمن آل سعود (15 يناير 1877 – 9 نوفمبر 1953)، مؤسس المملكة العربية السعودية وأول ملوكها؛ تروي أسرته ونفيها إلى الكويت واسترداده الرياض سنة 1902 وقضاءه على إمارة آل رشيد سنة 1921 وإعلان المملكة في 23 سبتمبر 1932 ووفاته سنة 1953، وتحمل بطاقتها في حقل الدين «الإسلام السني»."
  en: "Urdu Wikipedia article on Abdulaziz bin Abdul Rahman Al Saud (15 January 1877 – 9 November 1953), founder and first King of Saudi Arabia; it recounts his family and its exile to Kuwait, his recapture of Riyadh in 1902, the end of the Rashidi emirate in 1921, the proclamation of the kingdom on 23 September 1932 and his death in 1953, and its infobox religion field reads 'Sunni Islam'."
