summary:
  ar: "مقالة ويكيبيديا الإنجليزية المختصرة عن سالم المبارك الصباح ⁦(1864 – 23 فبراير 1921)⁩، حاكم الكويت التاسع من 5 فبراير 1917 إلى وفاته، والابن الثاني لمبارك الكبير ومؤسس فرع آل سالم؛ تذكر ولايته على مدينة الكويت 1915–1917 وقيادته في معركة الجهراء 1920."
  en: "Short English Wikipedia article on Salim Al-Mubarak Al-Sabah (1864 – 23 February 1921), ninth ruler of Kuwait from 5 February 1917 until his death, second son of Mubarak the Great and progenitor of the Al-Salim branch; it notes his governorship of Kuwait City in 1915–1917 and his command at the Battle of Jahra in 1920."
  es: "Breve artículo en inglés de la Wikipedia sobre Salim Al-Mubarak Al-Sabah (1864 – 23 de febrero de 1921), noveno gobernante de Kuwait desde el 5 de febrero de 1917 hasta su muerte, segundo hijo de Mubarak el Grande y progenitor de la rama Al-Salim; en él se menciona su mandato como gobernador de la ciudad de Kuwait entre 1915 y 1917 y su mando en la batalla de Jahra en 1920."
  fr: "Court article de Wikipédia en anglais sur Salim Al-Mubarak Al-Sabah (1864 – 23 février 1921), neuvième souverain du Koweït du 5 février 1917 jusqu'à sa mort, deuxième fils de Moubarak le Grand et ancêtre de la branche Al-Salim; il mentionne son poste de gouverneur de la ville de Koweït de 1915 à 1917 et son commandement lors de la bataille de Jahra en 1920."
