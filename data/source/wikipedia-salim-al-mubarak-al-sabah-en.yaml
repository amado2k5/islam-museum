  ar: "مقالة ويكيبيديا الإنجليزية المختصرة عن سالم المبارك الصباح (1864 – 23 فبراير 1921)، حاكم الكويت التاسع من 5 فبراير 1917 إلى وفاته، والابن الثاني لمبارك الكبير ومؤسس فرع آل سالم؛ تذكر ولايته على مدينة الكويت 1915–1917 وقيادته في معركة الجهراء 1920."
  en: "Short English Wikipedia article on Salim Al-Mubarak Al-Sabah (1864 – 23 February 1921), ninth ruler of Kuwait from 5 February 1917 until his death, second son of Mubarak the Great and progenitor of the Al-Salim branch; it notes his governorship of Kuwait City in 1915–1917 and his command at the Battle of Jahra in 1920."
