  ar: "مقالة ويكيبيديا الإنجليزية «پير بابا»: سيد علي الترمذي ⁦(نحو 908هـ/1502م – رجب 991هـ/1583م)⁩، وليّ صوفي حسيني النسب وُلد في فرغانة واستقر في بونير ⁦(خيبر بختونخوا اليوم)⁩ بين اليوسفزيين، وكان من أتباع الطرق الجشتية والكبروية والسهروردية والقادرية، وتلميذًا لسالار رومي، وخصمًا لپير روشن وحركته الروشنائية؛ مزاره في باچا كِلّي ببونير، وأغلقه طالبان مؤقتًا سنة 2009."
  en: "English Wikipedia article 'Pir Baba': Syed Ali Tirmizi (c. 908 AH/1502 CE – Rajab 991 AH/1583 CE), a Hussaini Sayyid Sufi pir born in Fergana who settled in Buner (present-day Khyber Pakhtunkhwa) among the Yusufzai Pashtuns; a stalwart of the Chishti, Kubrawi, Suhrawardi and Qadri orders, disciple of Salaar Roomi, and opponent of Pir Roshan and the Roshnai movement; his shrine at Pacha Killay, Buner, was temporarily closed by the Taliban in 2009."
