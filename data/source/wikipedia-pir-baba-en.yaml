summary:
  ar: "مقالة ويكيبيديا الإنجليزية «پير بابا»: سيد علي الترمذي ⁦(نحو 908هـ/1502م – رجب 991هـ/1583م)⁩، وليّ صوفي حسيني النسب وُلد في فرغانة واستقر في بونير ⁦(خيبر بختونخوا اليوم)⁩ بين اليوسفزيين، وكان من أتباع الطرق الجشتية والكبروية والسهروردية والقادرية، وتلميذًا لسالار رومي، وخصمًا لپير روشن وحركته الروشنائية؛ مزاره في باچا كِلّي ببونير، وأغلقه طالبان مؤقتًا سنة 2009."
  en: "English Wikipedia article 'Pir Baba': Syed Ali Tirmizi (c. 908 AH/1502 CE – Rajab 991 AH/1583 CE), a Hussaini Sayyid Sufi pir born in Fergana who settled in Buner (present-day Khyber Pakhtunkhwa) among the Yusufzai Pashtuns; a stalwart of the Chishti, Kubrawi, Suhrawardi and Qadri orders, disciple of Salaar Roomi, and opponent of Pir Roshan and the Roshnai movement; his shrine at Pacha Killay, Buner, was temporarily closed by the Taliban in 2009."
  es: "Artículo de Wikipedia en inglés 'Pir Baba': Syed Ali Tirmizi (c. 908 AH/1502 CE – Rajab 991 AH/1583 CE), un pir sufí Hussaini Sayyid nacido en Fergana que se estableció en Buner (actual Khyber Pakhtunkhwa) entre los pastunes Yusufzai; un incondicional de las órdenes Chishti, Kubrawi, Suhrawardi y Qadri, discípulo de Salaar Roomi y oponente de Pir Roshan y el movimiento Roshnai; Su santuario en Pacha Killay, Buner, fue cerrado temporalmente por los talibanes en 2009."
  fr: "Article de Wikipédia en anglais « Pir Baba »: Syed Ali Tirmizi (vers 908 AH/1502 CE – Rajab 991 AH/1583 CE), un pir soufi Hussaini Sayyid né à Fergana qui s'est installé à Buner (aujourd'hui Khyber Pakhtunkhwa) parmi les Pachtounes Yusufzai; un pilier des ordres Chishti, Kubrawi, Suhrawardi et Qadri, disciple de Salaar Roomi et adversaire de Pir Roshan et du mouvement Roshnai; son sanctuaire de Pacha Killay, Buner, a été temporairement fermé par les talibans en 2009."
  ur: "انگریزی ویکیپیڈیا مضمون 'پیر بابا': سید علی ترمذی ⁦(c. 908 AH/1502 CE - رجب 991 AH/1583 CE)⁩، ایک حسینی سید صوفی پیر جو فرغانہ میں پیدا ہوئے جو یوسف زئیوں کے درمیان بونیر ⁦(موجودہ خیبر پختونخواہ)⁩ میں آباد ہوئے؛ چشتی، کبروی، سہروردی اور قادری احکامات کے ایک باہمت، سالار رومی کے شاگرد، اور پیر روشن اور روشنائی تحریک کے مخالف؛ پچا کلے، بونیر میں واقع ان کے مزار کو طالبان نے 2009 میں عارضی طور پر بند کر دیا تھا۔"
