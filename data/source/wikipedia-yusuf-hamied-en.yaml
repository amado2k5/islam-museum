summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن يوسف حميد: وُلد في 25 تموز 1936 في فيلنيوس، رئيس سيبلا؛ تذكر أن والده مسلم هندي ووالدته يهودية ليتوانية، ودكتوراه الكيمياء من كامبريدج، وحملته لأدوية الإيدز الرخيصة."
  en: "English Wikipedia article on Yusuf Hamied, born 25 July 1936 in Vilnius, chairman of Cipla; it records his Indian Muslim father and Russophone Lithuanian Jewish mother, his Cambridge chemistry doctorate, and his campaign for affordable AIDS medicines."
  es: "Artículo de la Wikipedia en inglés sobre Yusuf Hamied, nacido el 25 de julio de 1936 en Vilna, presidente de Cipla; en él se menciona a su padre musulmán indio y a su madre judía lituana de habla rusa, su doctorado en química por la Universidad de Cambridge y su campaña a favor de medicamentos asequibles contra el SIDA."
  fr: "L'article de Wikipédia en anglais sur Yusuf Hamied, né le 25 juillet 1936 à Vilnius, président de Cipla; il relate son père musulman indien et sa mère juive lituanienne russophone, son doctorat en chimie de Cambridge et sa campagne pour des médicaments abordables contre le sida."
  ur: "یوسف حمید پر انگریزی ویکیپیڈیا کا مضمون، 25 جولائی 1936 کو ولنیئس میں پیدا ہوا، سیپلا کے چیئرمین؛ اس میں اس کے ہندوستانی مسلمان والد اور روسیفون لتھوانیائی یہودی ماں، اس کی کیمبرج کیمسٹری ڈاکٹریٹ، اور ایڈز کی سستی ادویات کے لیے اس کی مہم کو ریکارڈ کیا گیا ہے۔"
