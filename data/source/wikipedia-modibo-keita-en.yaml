summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن موديبو كيتا؛ تُستخدم لوقائع الكيان فقط. تروي مولده في باماكو سنة 1915 وعمله معلما، وتأسيسه الاتحاد السوداني، ورئاسته وزراء اتحاد مالي ثم رئاسته مالي المستقلة (1960–1968) واشتراكيته الإفريقية، وإطاحة موسى تراوري به سنة 1968 ووفاته سجينا في 16 مايو 1977، وتقول إن عائلته من مسلمي مالي المدّعين النسب إلى سلالة كيتا."
  en: "English Wikipedia article on Modibo Keïta; used for entity facts only. It recounts his birth in Bamako in 1915, his teaching career, his co-founding of the Sudanese Union, his premiership of the Mali Federation and presidency of independent Mali (1960–1968), his African socialism, his overthrow by Moussa Traoré in 1968 and his death in prison on 16 May 1977. On religion its text speaks only of his family: 'His family were Malian Muslims who claimed direct descent from the Keita dynasty.'"
