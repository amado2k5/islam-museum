summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن موديبو كيتا؛ تُستخدم لوقائع الكيان فقط. تروي مولده في باماكو سنة 1915 وعمله معلما، وتأسيسه الاتحاد السوداني، ورئاسته وزراء اتحاد مالي ثم رئاسته مالي المستقلة (1960–1968) واشتراكيته الإفريقية، وإطاحة موسى تراوري به سنة 1968 ووفاته سجينا في 16 مايو 1977، وتقول إن عائلته من مسلمي مالي المدّعين النسب إلى سلالة كيتا."
  en: "English Wikipedia article on Modibo Keïta; used for entity facts only. It recounts his birth in Bamako in 1915, his teaching career, his co-founding of the Sudanese Union, his premiership of the Mali Federation and presidency of independent Mali (1960–1968), his African socialism, his overthrow by Moussa Traoré in 1968 and his death in prison on 16 May 1977. On religion its text speaks only of his family: 'His family were Malian Muslims who claimed direct descent from the Keita dynasty.'"
  es: "Artículo de la Wikipedia en inglés sobre Modibo Keïta; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Bamako en 1915, su trayectoria docente, su participación como cofundador de la Unión Sudanesa, su mandato como primer ministro de la Federación de Malí y presidente del Malí independiente (1960-1968), su socialismo africano, su derrocamiento por Moussa Traoré en 1968 y su muerte en prisión el 16 de mayo de 1977. En cuanto a la religión, el texto solo menciona a su familia: «Su familia era de musulmanes malienses que afirmaban descender directamente de la dinastía Keïta»."
  fr: "Article de Wikipédia en anglais sur Modibo Keïta; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance à Bamako en 1915, sa carrière d’enseignant, sa cofondation de l’Union soudanaise, son poste de Premier ministre de la Fédération du Mali et de président du Mali indépendant (1960-1968), son socialisme africain, son renversement par Moussa Traoré en 1968 et sa mort en prison le 16 mai 1977. Concernant la religion, le texte mentionne uniquement sa famille: « Sa famille était composée de musulmans maliens qui se réclamaient de la dynastie Keïta. »"
  ur: "مودیبو کیٹا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1915 میں بماکو میں ان کی پیدائش، ان کے تدریسی کیریئر، سوڈانی یونین کی ان کی شریک بانی، مالی فیڈریشن کی ان کی وزارت عظمیٰ اور آزاد مالی کی صدارت (1960-1968)، اس کا افریقی سوشلزم، 1968 میں موسی ٹراورے کے ذریعے ان کا تختہ الٹنے اور 1968 میں اس کی موت کے بارے میں بیان کیا گیا ہے۔ ان کا خاندان: 'ان کا خاندان مالیائی مسلمان تھا جو کیتا خاندان سے براہ راست نسل کا دعویٰ کرتا تھا۔'"
