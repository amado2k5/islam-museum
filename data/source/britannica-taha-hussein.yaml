reliability_note: "Reference entry read in full on 24 October 2026. Used for entity facts: birth 14 November 1889 at Maghagha and death 28 October 1973 in Cairo; blindness at two; al-Azhar from 1902, described as the leading Sunni centre of higher Islamic education (a description of the institution, not of Hussein's own school); the first doctorate of the University of Cairo in 1914; further study at the Sorbonne; the storm over Fi al-shi'r al-jahili (1926), in which he argued much reputedly pre-Islamic poetry was forged later — 'for this he was tried for apostasy, but he was not convicted'; The Future of Culture in Egypt (1938) and its Mediterranean thesis; minister of education 1950–52 in the last Wafd government before the monarchy's overthrow, extending state education and abolishing school fees; Al-Ayyam in three volumes (1929–67)."
