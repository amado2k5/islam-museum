  ar: "مدخل موسوعة بريتانيكا عن طه حسين؛ يؤكد ميلاده في 14 نوفمبر 1889 بمغاغة ووفاته في 28 أكتوبر 1973 بالقاهرة، ومحاكمته بتهمة الردة دون إدانة، ووزارته للتعليم 1950–1952 وإلغاءه الرسوم المدرسية."
  en: "Encyclopaedia Britannica entry on Taha Hussein; it confirms his birth on 14 November 1889 at Maghagha and death on 28 October 1973 in Cairo, his trial for apostasy without conviction, and his 1950–52 ministry of education, in which he abolished school fees."
  es: "Entrada de la Enciclopedia Británica sobre Taha Hussein; confirma su nacimiento el 14 de noviembre de 1889 en Maghagha y su muerte el 28 de octubre de 1973 en El Cairo, su juicio por apostasía sin condena y su ministerio de educación entre 1950 y 1952, en el que abolió las tasas escolares."
  fr: "L'article de l'Encyclopædia Britannica sur Taha Hussein confirme sa naissance le 14 novembre 1889 à Maghagha et sa mort le 28 octobre 1973 au Caire, son procès pour apostasie sans condamnation, et son ministère de l'Éducation de 1950 à 1952, durant lequel il a aboli les frais de scolarité."
