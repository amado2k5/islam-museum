summary:
  ar: "ترجمة حساي مجدددي في صفحة فعالية بمركز MCC إيست باي ⁦(30 ديسمبر 2022)⁩: وُلدت في أفغانستان وانتقلت إلى الولايات المتحدة في الثانية من عمرها، وبدأت التعلم سنة 1996 في دروس هايورد عند أستاذها ومرشدها الشيخ حمزة يوسف، وأسست مع ابنة عمها الدكتورة نفيسة سكندري موقع «الصحة النفسية للمسلمين»."
  en: "MCC East Bay's event biography of Hosai Mojaddidi (30 December 2022): born in Afghanistan and moved to the United States at age two; her learning began in 1996 in the Hayward classes of her teacher and mentor Shaykh Hamza Yusuf; and she co-founded Mental Health 4 Muslims with her cousin Dr. Nafisa Sekandari."
  es: "Biografía del evento de MCC East Bay sobre Hosai Mojaddidi (30 de diciembre de 2022): nació en Afganistán y se mudó a los Estados Unidos a los dos años; su aprendizaje comenzó en 1996 en las clases de Hayward de su maestro y mentor Shaykh Hamza Yusuf; y cofundó Mental Health 4 Muslims con su prima, la Dra. Nafisa Sekandari."
  fr: "Biographie de Hosai Mojaddidi par MCC East Bay (30 décembre 2022): née en Afghanistan, elle a déménagé aux États-Unis à l’âge de deux ans; son apprentissage a commencé en 1996 dans les cours de son professeur et mentor, le cheikh Hamza Yusuf, à Hayward; et elle a cofondé Mental Health 4 Muslims avec sa cousine, le Dr Nafisa Sekandari."
  ur: "ہوسائی مجددی کی ایم سی سی ایسٹ بے کی ایونٹ سوانح عمری ⁦(30 دسمبر 2022)⁩: افغانستان میں پیدا ہوئے اور دو سال کی عمر میں امریکہ چلے گئے؛ اس کی تعلیم کا آغاز 1996 میں اپنے استاد اور سرپرست شیخ حمزہ یوسف کی ہیورڈ کلاسز میں ہوا۔ اور اس نے اپنی کزن ڈاکٹر نفیسہ سکندری کے ساتھ مل کر مینٹل ہیلتھ 4 مسلمانوں کی بنیاد رکھی۔"
  tr: "Hassai Mujaddidi tarafından MCC East Bay Center'daki bir etkinlik sayfasında çeviri (30 Aralık 2022): Afganistan'da doğup iki yaşında Amerika Birleşik Devletleri'ne taşındı, 1996'da öğretmeni ve akıl hocası Sheikh Hamza Youssef'in yanında Hayward derslerinde eğitim almaya başladı ve kuzeni Dr. Nafisa Skandri ile birlikte \"Müslümanlar için Ruh Sağlığı\" web sitesini kurdu."
  id: "Terjemahan oleh Hassai Mujaddidi di halaman acara di MCC East Bay Center (30 Desember 2022): Lahir di Afghanistan dan pindah ke Amerika Serikat pada usia dua tahun, ia mulai belajar pelajaran di Hayward pada tahun 1996 di bawah bimbingan guru dan mentornya, Sheikh Hamza Youssef, dan ikut mendirikan situs web \"Kesehatan Mental untuk Muslim\" bersama sepupunya Dr. Nafisa Skandri."
