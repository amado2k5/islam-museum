summary:
  ar: "ترجمة حساي مجدددي في صفحة فعالية بمركز MCC إيست باي (30 ديسمبر 2022): وُلدت في أفغانستان وانتقلت إلى الولايات المتحدة في الثانية من عمرها، وبدأت التعلم سنة 1996 في دروس هايورد عند أستاذها ومرشدها الشيخ حمزة يوسف، وأسست مع ابنة عمها الدكتورة نفيسة سكندري موقع «الصحة النفسية للمسلمين»."
  en: "MCC East Bay's event biography of Hosai Mojaddidi (30 December 2022): born in Afghanistan and moved to the United States at age two; her learning began in 1996 in the Hayward classes of her teacher and mentor Shaykh Hamza Yusuf; and she co-founded Mental Health 4 Muslims with her cousin Dr. Nafisa Sekandari."
