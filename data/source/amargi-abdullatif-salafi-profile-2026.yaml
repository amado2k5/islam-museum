summary:
  ar: "ملف مطوّل في مجلة «ذا أمارغي» عن عبداللطيف أحمد مصطفى الملقّب بعبداللطيف السلفي: نشأته ودراساته وحصوله على شهادتي دكتوراه في الشريعة ودراسته على مقبل الوادعي، وتأسيسه قناة ئامۆژگاری سنة 2013، ثم ادعاءات 2026 وفصله؛ وهو أحد النصين المستقلين اللذين يقوم عليهما تصنيف المتحف لانتمائه الديني."
  en: "The Amargi's long-form profile of Abdullatif Ahmad Mustafa, known as Abdullatif Salafi: his background and studies, his two PhDs in Islamic law and his study under Muqbil al-Wadi'i, his founding of Amozhgary TV in 2013, and the 2026 allegations and dismissal; it is one of the two independent prose texts on which the museum's faith settlement for him rests."
  ur: "عبداللطیف احمد مصطفیٰ، المعروف عبداللطیف سلفی، پر «دی امارگی» کا طویل پروفائل: ان کا پس منظر و تعلیم، اسلامی قانون میں دو ڈاکٹریٹ اور مقبل الوادعی سے ان کی تعلیم، 2013ء میں اموژگاری ٹی وی کا قیام، اور 2026ء کے الزامات اور برطرفی؛ یہ ان دو آزاد نصوص میں سے ایک ہے جن پر ان کے دینی انتماء کے بارے میں میوزیم کا فیصلہ قائم ہے۔"
  es: "El extenso perfil que Amargi publica sobre Abdullatif Ahmad Mustafa, conocido como Abdullatif Salafi: sus antecedentes y estudios, sus dos doctorados en derecho islámico y sus estudios con Muqbil al-Wadi'i, la fundación de Amozhgary TV en 2013 y las acusaciones y el despido de 2026; es uno de los dos textos en prosa independientes en los que se basa la declaración de fe del museo sobre él."
  fr: "Le long portrait d'Abdullatif Ahmad Mustafa, connu sous le nom d'Abdullatif Salafi, publié par l'Amargi: son parcours et ses études, ses deux doctorats en droit islamique et ses études auprès de Muqbil al-Wadi'i, la création d'Amozhgary TV en 2013, ainsi que les accusations et le licenciement de 2026; il s'agit de l'un des deux textes en prose indépendants sur lesquels repose la position du musée concernant sa foi."
  tr: "The Amarghi dergisinde Abdul Latif Ahmed Mustafa (lakaplı Abdul Latif Al-Selefi) hakkında kapsamlı bir dosya: yetiştirilme süreci, eğitimi, Şeriat alanında iki doktora derecesi alması, Muqbil Al-Wadi'i ile çalışması, 2013'te Mentoring Channel'ı kurması, ardından 2026 iddiaları ve reddi; müzenin dini aidiyeti nedeniyle sınıflandırıldığı iki bağımsız metinden biridir."
  id: "Berkas luas di majalah The Amarghi tentang Abdul Latif Ahmed Mustafa, yang dijuluki Abdul Latif Al-Salafi: masa kecilnya, studi, memperoleh dua gelar doktor dalam Syariah, belajar dengan Muqbil Al-Wadi'i, mendirikan Mentoring Channel pada 2013, kemudian klaim tahun 2026 dan penolakannya; ini adalah salah satu dari dua teks independen yang menempatkan museum ini karena afiliasi agamanya."
