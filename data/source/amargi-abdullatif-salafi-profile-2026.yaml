reliability_note: "A long-form reported profile (byline as credited on The Amargi's own Instagram carousel of 8 July 2026), independent of its subject. Biography taken from it: born 1969; two PhDs in Islamic law; 'he studied under the influential Yemeni scholar Muqbil al-Wadi'i'; 'In 2013, with the support of wealthy Gulf backers, he started Amozhgary TV'; his Walamakan/Wellamekan ('Answers') website 'has drawn over 27.5 million visitors'. Faith attestation quoted verbatim in the person record's faith note: 'Ahmed's version of Islam is Salafism, a puritanical reformist creed calling for a return to Islam as practiced by al-salaf al-ṣāliḥ (the pious predecessors, Arabic)' — one of the two independent prose texts for the settlement. Its statement that his Facebook and Instagram pages 'have half a million followers' does not say whether the figure is per-platform or combined and is not dated to a day, so it is NOT used as a reach figure anywhere. The 2016 episode appears only here (single source; The Amargi's news report adds only that 2016 recordings were made public) and is carried in the person record's provenance as this profile's report, not as established fact. The profile's generic sentence about Salafism as the doctrine of armed groups is deliberately NOT reproduced in any museum record: it is a statement about a broad religious current, not a finding of any link between this man and any organisation, and the same profile describes his own strand as quietist and opposed to armed rebellion. Read in full on 9 November 2026."
