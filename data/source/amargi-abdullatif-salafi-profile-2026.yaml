  ar: "ملف مطوّل في مجلة «ذا أمارغي» عن عبداللطيف أحمد مصطفى الملقّب بعبداللطيف السلفي: نشأته ودراساته وحصوله على شهادتي دكتوراه في الشريعة ودراسته على مقبل الوادعي، وتأسيسه قناة ئامۆژگاری سنة 2013، ثم ادعاءات 2026 وفصله؛ وهو أحد النصين المستقلين اللذين يقوم عليهما تصنيف المتحف لانتمائه الديني."
  en: "The Amargi's long-form profile of Abdullatif Ahmad Mustafa, known as Abdullatif Salafi: his background and studies, his two PhDs in Islamic law and his study under Muqbil al-Wadi'i, his founding of Amozhgary TV in 2013, and the 2026 allegations and dismissal; it is one of the two independent prose texts on which the museum's faith settlement for him rests."
  ur: "عبداللطیف احمد مصطفیٰ، المعروف عبداللطیف سلفی، پر «دی امارگی» کا طویل پروفائل: ان کا پس منظر و تعلیم، اسلامی قانون میں دو ڈاکٹریٹ اور مقبل الوادعی سے ان کی تعلیم، 2013ء میں اموژگاری ٹی وی کا قیام، اور 2026ء کے الزامات اور برطرفی؛ یہ ان دو آزاد نصوص میں سے ایک ہے جن پر ان کے دینی انتماء کے بارے میں میوزیم کا فیصلہ قائم ہے۔"
