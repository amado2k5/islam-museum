reliability_note: "Academic journal article, received 11 December 2024, accepted 17 March 2025, published online 30 March 2025. Read in full on 5 November 2026. Its Tuaha Ibn Jalil passage states: 'Ibn Jalil is an Islamic public speaker. He is an instructor and country head of Youth Club Pakistan. Youth Club (YC) is a non-profit Islamic organization that provides a platform for the training of youth according to Islamic values.' It discusses his 'Halal Girlfriend' podcast clip (more than 780k views in the study's sample) and his marriage-simplicity narrative, and observes that figures such as Tuaha Ibn Jalil resonate with urban Muslim youth. It attests no school or order for him, and none is taken from it."
