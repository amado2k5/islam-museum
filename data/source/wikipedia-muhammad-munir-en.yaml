  ar: "مقالة ويكيبيديا الإنجليزية عن محمد منير (1895–1979)، ثاني رؤساء قضاة باكستان (1954–1960)؛ تُستخدم لوقائع الكيان فقط. تسرد مسيرته من محاماة أمريتسار إلى رئاسة محكمة لاهور العليا ثم القضاء الأعلى، وحكمه في قضية تميز الدين ومبدأ الضرورة، وكتابه «من جناح إلى ضياء»."
  en: "English Wikipedia article on Muhammad Munir (1895–1979), second Chief Justice of Pakistan (1954–1960); used for entity facts only. It traces his career from the Amritsar bar to the chief justiceships of Lahore and Pakistan, his Tamizuddin Khan judgment and the doctrine of necessity, and his book From Jinnah to Zia."
