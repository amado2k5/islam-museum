summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد منير (1895–1979)، ثاني رؤساء قضاة باكستان (1954–1960)؛ تُستخدم لوقائع الكيان فقط. تسرد مسيرته من محاماة أمريتسار إلى رئاسة محكمة لاهور العليا ثم القضاء الأعلى، وحكمه في قضية تميز الدين ومبدأ الضرورة، وكتابه «من جناح إلى ضياء»."
  en: "English Wikipedia article on Muhammad Munir (1895–1979), second Chief Justice of Pakistan (1954–1960); used for entity facts only. It traces his career from the Amritsar bar to the chief justiceships of Lahore and Pakistan, his Tamizuddin Khan judgment and the doctrine of necessity, and his book From Jinnah to Zia."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad Munir (1895-1979), segundo presidente del Tribunal Supremo de Pakistán (1954-1960); utilizado únicamente para datos sobre la persona. Narra su trayectoria profesional desde el colegio de abogados de Amritsar hasta los cargos de presidente del Tribunal Supremo de Lahore y Pakistán, su sentencia sobre Tamizuddin Khan y la doctrina de la necesidad, así como su libro De Jinnah a Zia."
  fr: "Article de Wikipédia en anglais sur Muhammad Munir (1895-1979), deuxième juge en chef du Pakistan (1954-1960); utilisé uniquement à des fins d'information sur l'entité. Il retrace son parcours, de son entrée au barreau d'Amritsar à ses fonctions de juge en chef de Lahore et du Pakistan, son jugement dans l'affaire Tamizuddin Khan et la doctrine de la nécessité, ainsi que son ouvrage « From Jinnah to Zia »."
  ur: "محمد منیر (1895-1979)، پاکستان کے دوسرے چیف جسٹس (1954-1960) پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں امرتسر بار سے لاہور اور پاکستان کے چیف جسٹس شپ تک ان کے کیریئر کا پتہ چلتا ہے، تمیز الدین خان کا فیصلہ اور نظریہ ضرورت، اور ان کی کتاب فرام جناح تک۔"
  tr: "Pakistan'ın ikinci Baş Yargıcı (1954–1960) Muhammad Munir (1895–1979) hakkında İngilizce Wikipedia makalesi; yalnızca kurumun kayıtları için kullanılmıştır. Amritsar'da avukatlık yapmaktan Lahor Yüksek Mahkemesi başkanlığına ve ardından Yüksek Mahkeme'ye geçişi, din ayrımı ve zorunluluk ilkesi konusundaki kararını ve 'Cinnah'tan Zia'ya adlı kitabını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad Munir (1895–1979), Ketua Hakim Pakistan kedua (1954–1960); hanya digunakan untuk catatan entitas. Artikel ini menceritakan perjalanannya dari praktik hukum di Amritsar hingga memimpin Pengadilan Tinggi Lahore dan kemudian ke Mahkamah Agung, putusannya dalam kasus pembedaan agama dan prinsip kebutuhan, serta bukunya 'From Jinnah to Zia'."
