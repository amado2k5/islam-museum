summary:
  ar: "الصفحة «The Arabic Language Centre, official website» في The Arabic Language Centre, Dubai؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: مؤسسات اللغة العربية في الخليج والجزيرة العربية."
  en: "The page \"The Arabic Language Centre, official website\" (The Arabic Language Centre, Dubai), named in a research file supplied to the museum on 21 November 2026; the museum did not open the page, and the founder approved using the file without re-verification. Used for: the Arabic-language institutions of the Gulf and the Arabian Peninsula."
  ur: "صفحہ «The Arabic Language Centre, official website» (The Arabic Language Centre, Dubai)؛ یہ عجائب گھر کو 21 نومبر 2026ء کو دی گئی تحقیقی فائل میں مذکور ہے، عجائب گھر نے صفحہ نہیں کھولا اور بانی نے دوبارہ تصدیق کے بغیر فائل کے استعمال کی منظوری دی۔ استعمال: خلیج اور جزیرہ نما عرب میں عربی زبان کے ادارے۔"
  fr: "La page « The Arabic Language Centre, official website » (The Arabic Language Centre, Dubai), citée dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisée pour : les institutions de langue arabe du Golfe et de la péninsule Arabique."
  es: "La página «The Arabic Language Centre, official website» (The Arabic Language Centre, Dubai), citada en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el archivo sin volver a verificar. Usada para: las instituciones de la lengua árabe del Golfo y la península arábiga."
  tr: "Dubai'deki Arap Dil Merkezi'ndeki «Arap Dil Merkezi, resmi web sitesi» sayfası; 21 Kasım 2026'da müzeye sunulan bir araştırma dosyasında bahsedilmiştir, ancak müze sayfayı açmamış ve kurucu dosyayı yeniden doğrulama gerektirmeden kullanmayı kabul etmiştir. Kullanıldığı yer: Körfez ve Arap Yarımadası'ndaki Arapça dil kurumları."
  id: "Halaman «The Arabic Language Centre, situs resmi» di The Arabic Language Centre, Dubai; disebutkan dalam berkas penelitian yang diserahkan ke museum pada 21 November 2026, tetapi museum tidak membuka halaman tersebut, dan pendiri setuju menggunakan berkas tersebut tanpa verifikasi ulang. Digunakan dalam: institusi berbahasa Arab di Teluk dan Semenanjung Arab."
