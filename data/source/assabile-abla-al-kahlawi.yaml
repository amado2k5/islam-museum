summary:
  ar: "أرشيف الدروس المسجّلة لـعبلة الكحلاوي على موقع Assabile، ويضم 1 سلسلة تضم نحو 27 درسا بحسب صفحة الموقع. مصدر أولي لما يقوله المتحدث في تلك التسجيلات، لا مصدر مستقل على الوقائع التاريخية."
  en: "The archive of Abla Al-Kahlawi's recorded lessons on the Assabile website: 1 series, about 27 lessons by the site's own count. A primary source for what the speaker says in those recordings, not independent corroboration of historical events."
  ur: "Assabile ویب سائٹ پر عبلہ الکحلاوی کے ریکارڈ شدہ دروس کا آرکائیو: سائٹ کے اپنے شمار کے مطابق 1 سلسلے، تقریباً 27 اسباق۔ یہ ماخذ اس بات کا اولین ثبوت ہے کہ مقرر ان ریکارڈنگز میں کیا کہتا ہے، تاریخی واقعات کی آزاد تصدیق نہیں۔"
  es: "El archivo de las lecciones grabadas de Abla Al-Kahlawi en el sitio web de Assabile consta de una serie de aproximadamente 27 lecciones, según el propio sitio. Se trata de una fuente primaria de lo que dice la oradora en esas grabaciones, pero no una corroboración independiente de los hechos históricos."
  fr: "Les archives des leçons enregistrées d'Abla Al-Kahlawi sur le site web Assabile: une série d'environ 27 leçons selon le décompte du site. Il s'agit d'une source primaire relatant les propos de l'oratrice dans ces enregistrements, et non d'une corroboration indépendante des événements historiques."
  tr: "Assabile web sitesinde Abla Al-Kahlawi'nin kaydedilen derslerinin arşivi, sitenin sayfasına göre yaklaşık 27 ders içeren 1 seri içeriyor. Bu kayıtlarda konuşmacının söylediklerinin birincil kaynağı, bağımsız tarihsel gerçekler kaynağı değil."
  id: "Arsip pelajaran Abla Al-Kahlawi yang direkam di situs web Assabile, yang mencakup 1 seri berisi sekitar 27 pelajaran menurut halaman situs tersebut. Sumber utama untuk apa yang dikatakan pembicara dalam rekaman tersebut, bukan sumber independen tentang fakta sejarah."
