label: { en: "Hussain Randathani, 'Hadrami Sayyids against Colonialism: the Malabar Page'" }
summary:
  ar: "دراسة لحسين رانداثاني عن السادة الحضارم ومقاومة الاستعمار في مالابار؛ تذكر أن السيد فضل (1240/1824-1318/1901) خلف والده السيد علوي بعد وفاته في 29 يناير 1844، وكتب الكتب وأصدر الفتاوى ضد الحكم البريطاني، ومنها «القول المختار» و«سيف البتار» ضمن كتابه «عدة الأمراء والحكام» ⁦(مصر، 1856)⁩، وأن التقارير البريطانية حمّلته مسؤولية الاضطرابات."
  en: "Hussain Randathani's study of the Hadrami sayyids and anti-colonial resistance in Malabar; it states that Sayyid Fadl (1240/1824–1318/1901) succeeded his father Sayyid Alawi after the latter's death on 29 January 1844, wrote books and issued fatwas against British rule, among them al-Qawl al-Mukhtar and Saif al-Battar within his Uddat al-Umara wa-l-Hukkam (Egypt, 1856), and that British reports held him responsible for the disturbances."
  es: "El estudio de Hussain Randathani sobre los sayyids hadrami y la resistencia anticolonial en Malabar afirma que Sayyid Fadl (1240/1824–1318/1901) sucedió a su padre Sayyid Alawi tras la muerte de este último el 29 de enero de 1844, escribió libros y emitió fatuas contra el dominio británico, entre ellas al-Qawl al-Mukhtar y Saif al-Battar dentro de su Uddat al-Umara wa-l-Hukkam (Egipto, 1856), y que los informes británicos lo responsabilizaban de los disturbios."
  fr: "L'étude de Hussain Randathani sur les sayyids hadramites et la résistance anticoloniale au Malabar; elle indique que Sayyid Fadl (1240/1824–1318/1901) a succédé à son père Sayyid Alawi après la mort de ce dernier le 29 janvier 1844, a écrit des livres et émis des fatwas contre la domination britannique, parmi lesquelles al-Qawl al-Mukhtar et Saif al-Battar dans son Uddat al-Umara wa-l-Hukkam (Égypte, 1856), et que les rapports britanniques l'ont tenu pour responsable des troubles."
  ur: "حسین رنداتھانی کا ملابار میں حیدرامی سیدوں اور استعمار مخالف مزاحمت کا مطالعہ؛ اس میں کہا گیا ہے کہ سید فضل (1240/1824–1318/1901) نے 29 جنوری 1844 کو اپنے والد سید علوی کی وفات کے بعد ان کی جگہ لی، انہوں نے برطانوی حکومت کے خلاف کتابیں لکھیں اور فتوے جاری کیے، ان میں القول المختار اور سیف البطار ان کے اُدّتُکُمُ الْقَوْمِ الْحَقِّ میں شامل ہیں۔ 1856)، اور یہ کہ برطانوی رپورٹس نے اسے خلل کا ذمہ دار ٹھہرایا۔"
title: "Hadrami Sayyids against Colonialism: the Malabar Page"
