summary:
  ar: "دراسة لحسين رانداثاني عن السادة الحضارم ومقاومة الاستعمار في مالابار؛ تذكر أن السيد فضل (1240/1824-1318/1901) خلف والده السيد علوي بعد وفاته في 29 يناير 1844، وكتب الكتب وأصدر الفتاوى ضد الحكم البريطاني، ومنها «القول المختار» و«سيف البتار» ضمن كتابه «عدة الأمراء والحكام» (مصر، 1856)، وأن التقارير البريطانية حمّلته مسؤولية الاضطرابات."
  en: "Hussain Randathani's study of the Hadrami sayyids and anti-colonial resistance in Malabar; it states that Sayyid Fadl (1240/1824–1318/1901) succeeded his father Sayyid Alawi after the latter's death on 29 January 1844, wrote books and issued fatwas against British rule, among them al-Qawl al-Mukhtar and Saif al-Battar within his Uddat al-Umara wa-l-Hukkam (Egypt, 1856), and that British reports held him responsible for the disturbances."
title: "Hadrami Sayyids against Colonialism: the Malabar Page"
