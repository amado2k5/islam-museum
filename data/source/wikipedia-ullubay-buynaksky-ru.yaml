summary:
  ar: "مقالة ويكيبيديا الروسية عن أولوبي دانيالوفيتش بويناكسكي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 27 أغسطس ⁦(8 سبتمبر)⁩ 1890 في أولو بويناك، وفي مطلعها وفاته في 16 أغسطس 1919، بينما يروي متنها أن الحكم نُفّذ في 18 أغسطس 1919 عند محطة تميرغويه بعد محاكمة عسكرية شرعية في 10 (23) يوليو؛ ولا يرد في متنها أي ذكر لدينه الشخصي."
  en: "Russian Wikipedia article on Ullubiy Daniyalovich Buynaksky; used for entity facts only. It gives his birth dual-dated 27 August [8 September] 1890 at Ullu-Buynak, his death in its lead as 16 August 1919, while its text narrates that the sentence was carried out on 18 August 1919 near the Temirgoe station after a military sharia court on 10 (23) July; it contains no statement of his personal religion."
  es: "Artículo de la Wikipedia rusa sobre Ullubiy Daniyalovich Buynaksky; utilizado únicamente para datos sobre la persona. Indica que nació el 27 de agosto [8 de septiembre] de 1890 en Ullu-Buynak, y que su muerte ocurrió el 16 de agosto de 1919. El texto narra que la sentencia se ejecutó el 18 de agosto de 1919 cerca de la estación de Temirgoe tras un juicio militar de la sharia el 10 (23) de julio; no menciona su religión personal."
  fr: "L'article de Wikipédia en russe sur Ullubiy Daniyalovich Buynaksky, utilisé uniquement pour les informations relatives à l'entité, indique sa naissance le 27 août [8 septembre] 1890 à Ullu-Buynak et son décès le 16 août 1919. Le texte relate que la sentence a été exécutée le 18 août 1919 près de la gare de Temirgoe, après une audience devant un tribunal militaire de la charia le 10 (23) juillet. L'article ne mentionne pas sa religion."
  ur: "Ullubiy Daniyalovich Buynaksky پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی ولادت دوہری تاریخ 27 اگست [8 ستمبر] 1890 کو اللو بویناک میں دی گئی ہے، اس کی موت 16 اگست 1919 کے طور پر ہوئی ہے، جبکہ اس کا متن بیان کرتا ہے کہ سزا 18 اگست 1919 کو تیمرگو اسٹیشن کے قریب 10 (23) جولائی کو فوجی شرعی عدالت کے بعد سنائی گئی تھی۔ اس میں ان کے ذاتی مذہب کا کوئی بیان نہیں ہے۔"
