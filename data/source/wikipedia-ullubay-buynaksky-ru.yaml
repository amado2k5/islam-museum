  ar: "مقالة ويكيبيديا الروسية عن أولوبي دانيالوفيتش بويناكسكي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 27 أغسطس (8 سبتمبر) 1890 في أولو بويناك، وفي مطلعها وفاته في 16 أغسطس 1919، بينما يروي متنها أن الحكم نُفّذ في 18 أغسطس 1919 عند محطة تميرغويه بعد محاكمة عسكرية شرعية في 10 (23) يوليو؛ ولا يرد في متنها أي ذكر لدينه الشخصي."
  en: "Russian Wikipedia article on Ullubiy Daniyalovich Buynaksky; used for entity facts only. It gives his birth dual-dated 27 August [8 September] 1890 at Ullu-Buynak, his death in its lead as 16 August 1919, while its text narrates that the sentence was carried out on 18 August 1919 near the Temirgoe station after a military sharia court on 10 (23) July; it contains no statement of his personal religion."
