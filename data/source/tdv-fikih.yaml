reliability_note: "Read on 1 November 2026 in the web edition, three parts, printed pages from the entry's own 'numaralı sayfalarda' lines: Hayreddin Karaman pp. 1–14, Ahmet Özel pp. 14–22, Ali Bardakoğlu pp. 22–27. Read in full: the definitions, origins, periods, taqlid, the takhrij and tarjih works, and the Hanafi, Maliki, Shafi'i, Hanbali and Ja'fari literature (Özel's part). Read in part: the Zaydi, Ismaili and Zahiri paragraphs (pp. 14–22, the first sentences of each) and the modern section (its opening paragraphs, pp. 22–27). Not read: the Ibadi paragraph and the modern bibliography, which are cited for names only where the entry names them. Facts are rewritten in the museum's own words; no sentence is quoted."
