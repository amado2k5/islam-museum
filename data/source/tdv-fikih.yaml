summary:
  ar: "مدخل «فقه» في موسوعة TDV الإسلامية (المجلد 13، إسطنبول 1996، ص 1–27) في ثلاثة أجزاء: معنى الكلمة ومصادر الفقه وأدواره التاريخية وتقليد المذاهب وتخريج الفقهاء وترجيحهم، ثم أدب الفقه الكلاسيكي والمذهبي وفقه الإمامية والزيدية والإسماعيلية والظاهرية، ثم الفقه الحديث."
  en: "The TDV İslâm Ansiklopedisi entry 'FIKIH' (vol. 13, Istanbul 1996, pp. 1–27), in three parts: the meaning of the word, its sources and historical periods, taqlid, the work of takhrij and tarjih among the schools, the classical and school literature with the Ja'fari, Zaydi, Ismaili and Zahiri books, and the modern period."
