summary:
  ar: "مدخل «فقه» في موسوعة TDV الإسلامية ⁦(المجلد 13، إسطنبول 1996، ص 1–27)⁩ في ثلاثة أجزاء: معنى الكلمة ومصادر الفقه وأدواره التاريخية وتقليد المذاهب وتخريج الفقهاء وترجيحهم، ثم أدب الفقه الكلاسيكي والمذهبي وفقه الإمامية والزيدية والإسماعيلية والظاهرية، ثم الفقه الحديث."
  en: "The TDV İslâm Ansiklopedisi entry 'FIKIH' (vol. 13, Istanbul 1996, pp. 1–27), in three parts: the meaning of the word, its sources and historical periods, taqlid, the work of takhrij and tarjih among the schools, the classical and school literature with the Ja'fari, Zaydi, Ismaili and Zahiri books, and the modern period."
  es: "La entrada 'FIKIH' de la TDV İslâm Ansiklopedisi (vol. 13, Estambul 1996, pp. 1–27) se divide en tres partes: el significado de la palabra, sus fuentes y períodos históricos, el taqlid, la labor de takhrij y tarjih entre las escuelas, la literatura clásica y escolar con los libros Ja'fari, Zaydi, Ismaili y Zahiri, y el período moderno."
  fr: "L'entrée « FIKIH » de la TDV İslâm Ansiklopedisi (vol. 13, Istanbul 1996, pp. 1–27), en trois parties: la signification du mot, ses sources et ses périodes historiques, le taqlid, le travail du takhrij et du tarjih parmi les écoles, la littérature classique et scolaire avec les livres Ja'fari, Zaydi, Ismaili et Zahiri, et la période moderne."
