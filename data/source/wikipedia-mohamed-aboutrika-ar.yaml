  ar: "مقالة ويكيبيديا العربية عن محمد أبو تريكة؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته الكروية مع الترسانة والأهلي ومنتخب مصر وأسلوب لعبه الذي شُبِّه بزين الدين زيدان، وقرار التحفظ على أمواله سنة 2015، وتدرجه في تصنيف «مسلمون مصريون» وتنقل من أقواله عن الإسلام والزكاة دون أن تسمّي له مذهبًا."
  en: "Arabic Wikipedia article on Mohamed Aboutrika; used for entity facts only. It recounts his playing career at Tersana, Al Ahly and with the Egypt national team, his playmaking style compared to Zinedine Zidane's, and the 2015 decision freezing his assets; it files him under the category 'Egyptian Muslims' and quotes his own words on Islam and zakat, without naming any school for him."
