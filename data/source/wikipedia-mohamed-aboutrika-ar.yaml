summary:
  ar: "مقالة ويكيبيديا العربية عن محمد أبو تريكة؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته الكروية مع الترسانة والأهلي ومنتخب مصر وأسلوب لعبه الذي شُبِّه بزين الدين زيدان، وقرار التحفظ على أمواله سنة 2015، وتدرجه في تصنيف «مسلمون مصريون» وتنقل من أقواله عن الإسلام والزكاة دون أن تسمّي له مذهبًا."
  en: "Arabic Wikipedia article on Mohamed Aboutrika; used for entity facts only. It recounts his playing career at Tersana, Al Ahly and with the Egypt national team, his playmaking style compared to Zinedine Zidane's, and the 2015 decision freezing his assets; it files him under the category 'Egyptian Muslims' and quotes his own words on Islam and zakat, without naming any school for him."
  es: "Artículo de Wikipedia en árabe sobre Mohamed Aboutrika; utilizado únicamente para datos sobre la persona. Relata su trayectoria como jugador en Tersana, Al Ahly y con la selección egipcia, compara su estilo de juego con el de Zinedine Zidane y la decisión de congelar sus activos en 2015. Lo clasifica dentro de la categoría de \"musulmanes egipcios\" y cita sus propias palabras sobre el islam y el zakat, sin mencionar ninguna escuela religiosa."
  fr: "Article Wikipédia en arabe sur Mohamed Aboutrika; utilisé uniquement à des fins d'information sur l'entité. Il retrace sa carrière de joueur à Tersana, Al Ahly et au sein de l'équipe nationale égyptienne, compare son style de jeu à celui de Zinedine Zidane et évoque la décision de 2015 de geler ses avoirs; il est classé dans la catégorie « Musulmans égyptiens » et cite ses propres propos sur l'islam et la zakat, sans mentionner d'école particulière."
  ur: "عربی ویکیپیڈیا مضمون محمد ابوتریکہ پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ترسانہ، الاحلی اور مصر کی قومی ٹیم کے ساتھ ان کے کھیل کے کیریئر، زین الدین زیدان کے مقابلے میں ان کے پلے میکنگ کا انداز، اور 2015 میں ان کے اثاثے منجمد کرنے کے فیصلے کا ذکر ہے۔ یہ اسے 'مصری مسلمان' کے زمرے میں داخل کرتا ہے اور اس کے لیے کسی مکتب کا نام لیے بغیر، اسلام اور زکوٰۃ کے بارے میں ان کے اپنے الفاظ کا حوالہ دیتا ہے۔"
