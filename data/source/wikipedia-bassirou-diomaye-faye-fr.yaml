summary:
  ar: "مقالة ويكيبيديا الفرنسية عن باسيرو ديوماي فاي؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من مفتش ضرائب إلى رئيس السنغال (2024)، وحياته الخاصة بما فيها دينا زوجتيه ⁦(الأولى مسيحية والثانية مسلمة)⁩؛ ويذكر صندوقها أن دينه «الإسلام — السنة»، ولا يناقش متنها دينه شخصيا."
  en: "French Wikipedia article on Bassirou Diomaye Faye; used for entity facts only. It recounts his path from tax inspector to president of Senegal (2024) and his private life, including his two wives' religions (the first Christian, the second Muslim). Its infobox gives his religion as Islam (Sunni); its text does not discuss his own religion."
  es: "Artículo de la Wikipedia en francés sobre Bassirou Diomaye Faye; utilizado únicamente para datos sobre la persona. Narra su trayectoria desde inspector de hacienda hasta presidente de Senegal (2024) y su vida privada, incluyendo las religiones de sus dos esposas (la primera cristiana, la segunda musulmana). Su ficha informativa indica que su religión es el islam (suní); el texto no menciona su propia religión."
  fr: "Article Wikipédia français sur Bassirou Diomaye Faye; utilisé uniquement pour les informations sur l'entité. Il retrace son parcours, d'inspecteur des impôts à président du Sénégal (2024), ainsi que sa vie privée, notamment la religion de ses deux épouses (la première chrétienne, la seconde musulmane). Son infobox indique qu'il est musulman (sunnite); le texte n'aborde pas sa religion."
  ur: "Bassirou Diomaye Faye پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ٹیکس انسپکٹر سے لے کر سینیگال کے صدر (2024) تک کے اس کے راستے اور اس کی نجی زندگی کا ذکر کیا گیا ہے، بشمول اس کی دو بیویوں کے مذاہب ⁦(پہلی عیسائی، دوسری مسلمان)⁩۔ اس کا انفو باکس اپنا مذہب اسلام ⁦(سنی)⁩ دیتا ہے۔ اس کا متن اس کے اپنے مذہب پر بحث نہیں کرتا۔"
