summary:
  ar: "مدخل بنغلابيديا ⁦(الموسوعة الوطنية لبنغلاديش)⁩ عن تاج الدين أحمد، بقلم سجاهان مياه؛ تُستخدم لوقائع الكيان فقط. تؤيد تواريخه ومناصبه: ترؤسه الحكومة المؤقتة في مجيبنغر سنة 1971، ووزارة المالية ثم المالية والتخطيط حتى استقالته سنة 1974، وسجنه واغتياله داخل سجن دكا المركزي في 3 نوفمبر 1975، ولا يرد فيها أي ذكر لديانته."
  en: "Banglapedia (National Encyclopedia of Bangladesh) entry on Tajuddin Ahmad, by Sajahan Miah; used for entity facts only. It corroborates his dates and offices: his leadership of the Mujibnagar provisional government in 1971, the finance and then finance-and-planning ministries until his 1974 resignation, and his imprisonment and assassination inside Dhaka Central Jail on 3 November 1975. It contains no statement of his religion."
  es: "Entrada de Banglapedia (Enciclopedia Nacional de Bangladesh) sobre Tajuddin Ahmad, por Sajahan Miah; utilizada únicamente para datos sobre la persona. Corrobora sus fechas y cargos: su liderazgo del gobierno provisional de Mujibnagar en 1971, los ministerios de finanzas y luego de finanzas y planificación hasta su renuncia en 1974, y su encarcelamiento y asesinato en la Cárcel Central de Dhaka el 3 de noviembre de 1975. No contiene ninguna declaración sobre su religión."
  fr: "L'article de Banglapedia (Encyclopédie nationale du Bangladesh) consacré à Tajuddin Ahmad, rédigé par Sajahan Miah, est utilisé uniquement à titre informatif. Il confirme les dates et les fonctions qu'il a occupées: son poste à la tête du gouvernement provisoire de Mujibnagar en 1971, ses fonctions de ministre des Finances puis de ministre des Finances et de la Planification jusqu'à sa démission en 1974, ainsi que son emprisonnement et son assassinat à la prison centrale de Dhaka le 3 novembre 1975. Il ne mentionne pas sa religion."
  ur: "بنگلہ پیڈیا ⁦(بنگلہ دیش کا قومی انسائیکلو پیڈیا)⁩ تاج الدین احمد پر اندراج، از سجہن میہ؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی تاریخوں اور دفاتر کی تصدیق کرتا ہے: ان کی 1971 میں مجیب نگر کی عارضی حکومت کی قیادت، 1974 کے استعفیٰ تک خزانہ اور پھر مالیات اور منصوبہ بندی کی وزارتیں، اور 3 نومبر 1975 کو ڈھاکہ سینٹرل جیل کے اندر ان کی قید اور قتل۔ اس میں ان کے مذہب کا کوئی بیان نہیں ہے۔"
