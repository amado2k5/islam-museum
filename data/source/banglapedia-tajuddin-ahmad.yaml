summary:
  ar: "مدخل بنغلابيديا (الموسوعة الوطنية لبنغلاديش) عن تاج الدين أحمد، بقلم سجاهان مياه؛ تُستخدم لوقائع الكيان فقط. تؤيد تواريخه ومناصبه: ترؤسه الحكومة المؤقتة في مجيبنغر سنة 1971، ووزارة المالية ثم المالية والتخطيط حتى استقالته سنة 1974، وسجنه واغتياله داخل سجن دكا المركزي في 3 نوفمبر 1975، ولا يرد فيها أي ذكر لديانته."
  en: "Banglapedia (National Encyclopedia of Bangladesh) entry on Tajuddin Ahmad, by Sajahan Miah; used for entity facts only. It corroborates his dates and offices: his leadership of the Mujibnagar provisional government in 1971, the finance and then finance-and-planning ministries until his 1974 resignation, and his imprisonment and assassination inside Dhaka Central Jail on 3 November 1975. It contains no statement of his religion."
