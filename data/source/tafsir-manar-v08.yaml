  ar: "المجلد الثامن من تفسير المنار لمحمد رشيد رضا، من الكلام على آية الأنعام 111 إلى آخر سورة الأنعام، وفيه مطلع سورة الأعراف. يتناول شياطين الإنس والجن، والسنن في عداوة الأنبياء، والقرآن بوصفه الحكم والمعجزة، وتمام كلمة الله، وتحريف الكتب السابقة، ثم افتتاح سورة الأعراف والحروف في أوائل السور."
