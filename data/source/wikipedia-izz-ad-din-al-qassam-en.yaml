summary:
  ar: "عز الدين القسام (1882–1935) في ويكيبيديا الإنجليزية: داعية سوري درس في الأزهر وقاد المقاومة ضد الفرنسيين في سوريا وضد البريطانيين في فلسطين حتى مقتله عام 1935."
  en: "Izz ad-Din al-Qassam (1882–1935) in the English Wikipedia: a Syrian preacher who studied at al-Azhar, fought the French in Syria and organised armed resistance to British rule in Palestine until British forces killed him in 1935."
  es: "Izz ad-Din al-Qassam (1882–1935), según la Wikipedia en inglés: predicador sirio que estudió en al-Azhar, luchó contra los franceses en Siria y organizó la resistencia armada contra el dominio británico en Palestina hasta que las fuerzas británicas lo mataron en 1935."
  fr: "Izz ad-Din al-Qassam (1882–1935) dans la Wikipédia anglaise: un prédicateur syrien qui a étudié à al-Azhar, a combattu les Français en Syrie et a organisé la résistance armée au régime britannique en Palestine jusqu'à ce que les forces britanniques le tuent en 1935."
  ur: "عزالدین القسام (1882–1935) انگریزی ویکیپیڈیا میں: ایک شامی مبلغ جس نے الازہر میں تعلیم حاصل کی، شام میں فرانسیسیوں سے لڑا اور فلسطین میں برطانوی حکمرانی کے خلاف مسلح مزاحمت کی یہاں تک کہ برطانوی افواج نے اسے 1935 میں قتل کر دیا۔"
  tr: "İzzeddin el-Kassam (1882–1935) İngilizce Vikipedi'de: El-Ezher'de eğitim görmüş ve 1935'teki ölümüne kadar Suriye'de Fransızlara ve Filistin'de İngilizlere karşı direnişi yöneten bir Suriyeli vaiz."
  id: "Izz al-Din al-Qassam (1882–1935) di Wikipedia bahasa Inggris: seorang pengkhotbah Suriah yang belajar di Al-Azhar dan memimpin perlawanan melawan Prancis di Suriah dan Inggris di Palestina hingga kematiannya pada tahun 1935."
