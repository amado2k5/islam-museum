summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الكاتبة والأستاذة عائشة عبد الرحمن ⁦(بنت الشاطئ)⁩؛ لوقائع الكيان فقط: مولدها في دمياط في 18 نوفمبر 1913، وتعليمها، ودرجاتها من جامعة القاهرة ⁦(1939، 1941، والدكتوراه 1950)⁩، وأستاذيتها في عين شمس، وتفسيرها البياني (1966–1969)، وجائزة الدولة (1987)، وجائزة الملك فيصل للأدب العربي (1994)، ووفاتها في القاهرة في 1 ديسمبر 1998؛ وتستند إلى ذي إندبندنت ودليل الكاتبات العربيات (2008) وموسوعة الإسلام الثالثة."
  en: "English Wikipedia article on the writer and professor Aisha Abd al-Rahman (Bint al-Shati); entity facts only: birth at Damietta on 18 November 1913, her schooling, her Cairo University degrees (1939, 1941, PhD 1950), her chair at Ain Shams, her literary commentary on the Qur'an (1966–1969), the State Award (1987), the King Faisal Prize for Arabic Literature (1994) and death in Cairo on 1 December 1998; it cites The Independent, Arab Women Writers (2008) and the Encyclopaedia of Islam Three."
  es: "Artículo de la Wikipedia en inglés sobre la escritora y profesora Aisha Abd al-Rahman (Bint al-Shati); solo datos sobre la persona: nacimiento en Damietta el 18 de noviembre de 1913, su educación, sus títulos de la Universidad de El Cairo (1939, 1941, doctorado en 1950), su cátedra en Ain Shams, su comentario literario sobre el Corán (1966-1969), el Premio Estatal (1987), el Premio Rey Faisal de Literatura Árabe (1994) y su muerte en El Cairo el 1 de diciembre de 1998; cita a The Independent, Arab Women Writers (2008) y la Encyclopaedia of Islam Three."
  fr: "Article de Wikipédia en anglais sur l'écrivaine et professeure Aisha Abd al-Rahman (Bint al-Shati); faits concernant uniquement l'entité: naissance à Damiette le 18 novembre 1913, sa scolarité, ses diplômes de l'Université du Caire (1939, 1941, doctorat 1950), sa chaire à Ain Shams, son commentaire littéraire sur le Coran (1966-1969), le Prix d'État (1987), le Prix du roi Faisal pour la littérature arabe (1994) et sa mort au Caire le 1er décembre 1998; il cite The Independent, Arab Women Writers (2008) et l'Encyclopédie de l'Islam III."
