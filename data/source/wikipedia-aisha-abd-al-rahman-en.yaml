summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الكاتبة والأستاذة عائشة عبد الرحمن ⁦(بنت الشاطئ)⁩؛ لوقائع الكيان فقط: مولدها في دمياط في 18 نوفمبر 1913، وتعليمها، ودرجاتها من جامعة القاهرة ⁦(1939، 1941، والدكتوراه 1950)⁩، وأستاذيتها في عين شمس، وتفسيرها البياني (1966–1969)، وجائزة الدولة (1987)، وجائزة الملك فيصل للأدب العربي (1994)، ووفاتها في القاهرة في 1 ديسمبر 1998؛ وتستند إلى ذي إندبندنت ودليل الكاتبات العربيات (2008) وموسوعة الإسلام الثالثة."
  en: "English Wikipedia article on the writer and professor Aisha Abd al-Rahman (Bint al-Shati); entity facts only: birth at Damietta on 18 November 1913, her schooling, her Cairo University degrees (1939, 1941, PhD 1950), her chair at Ain Shams, her literary commentary on the Qur'an (1966–1969), the State Award (1987), the King Faisal Prize for Arabic Literature (1994) and death in Cairo on 1 December 1998; it cites The Independent, Arab Women Writers (2008) and the Encyclopaedia of Islam Three."
