reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. It gives her life at year precision (1840-1902), her Turco-Kurdish family and Circassian mother, her father's home education of her against her mother's wish to teach her embroidery, her marriage at fourteen and move to Istanbul, the deaths of her daughter Tawhida (1873), father (1882) and husband (1885), her return to Egypt, and her works (Hilyat al-tiraz 1884, Nata'ij al-ahwal 1887, Mir'at al-ta'ammul 1892). It names her husband Mahmud Bey al-Islambuli, where the Arabic article names Muhammad Bey Tawfiq al-Islambuli — the discrepancy is recorded in the person record. The article names no school of Islam for her. Read in full on 24 October 2026."
