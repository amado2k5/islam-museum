reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives the same dates as the English article (born 27 July 1881, died 16 July 1964, both at Istanbul), his London embassy as 23 March 1942 to 1 April 1944, and his resting place as the Sahrayıcedid Cemetery, Istanbul. Its infobox gives his religion (dini) as Islam, generically; its text makes no statement of his religion and names no school. The official Atatürk Encyclopedia entry it links prints his years in its title as 1880–1964, against the article's own 1881 birth date."
