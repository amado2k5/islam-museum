  ar: "مقالة ويكيبيديا الإنجليزية عن سراج وهاج؛ تُستخدم لوقائع الكيان فقط. تروي ولادته باسم جيفري كيرس في بروكلين سنة 1950، وانضمامه إلى أمة الإسلام سنة 1969، وصيرورته مسلما سنيا بعد سنة 1975، ودراسته في جامعة أم القرى سنة 1978، وتأسيسه مسجد التقوى سنة 1981، وصلاة الافتتاح التي ألقاها في مجلس النواب الأمريكي سنة 1991."
  en: "English Wikipedia article on Siraj Wahhaj; used for entity facts only. It recounts his birth as Jeffrey Kearse in Brooklyn in 1950, his joining the Nation of Islam in 1969, his becoming a Sunni Muslim after 1975, his study at Umm al-Qura University in 1978, his founding of Masjid At-Taqwa in 1981, and the opening prayer he delivered in the United States House of Representatives in 1991."
