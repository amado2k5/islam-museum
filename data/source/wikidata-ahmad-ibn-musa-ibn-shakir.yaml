reliability_note: "Structured-data item, retrieved via the MediaWiki API on 1 November 2026 and its revision re-asserted against a second live query (identical). The item was resolved through its English sitelink, the kunya-titled page 'Abu al-Qasim, Ahmad ibn Musa ibn Shakir', which is a redirect to the combined Banu Musa article. Registered for the identifier only: its birth (805) and death (873) values, both in the Julian calendar model, are unsourced structured claims of the same family as the Arabic article's printed years (803-873), and the English article's scholarly apparatus dates Ahmad only to the 9th century and states that of the three brothers only Muhammad's death year is known; the values are therefore not adopted, and no birth or death block is built for Ahmad. The item carries no religion value."
