  ar: "دراسة أكاديمية محكّمة في مجلة «كونتكست» ⁦(12:2، 2025)⁩ عن دور وسائل التواصل الاجتماعي والمنصات الرقمية في تشكيل الهوية الدينية لدى الشباب في ألبانيا؛ تتضمن جداول بعدد متابعي الأئمة والدعاة الألبان والكوسوفيين على المنصات، وتُستخدم هنا لأرقام الوصول المؤرخة فقط."
