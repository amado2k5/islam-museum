summary:
  ar: "دراسة أكاديمية محكّمة في مجلة «كونتكست» ⁦(12:2، 2025)⁩ عن دور وسائل التواصل الاجتماعي والمنصات الرقمية في تشكيل الهوية الدينية لدى الشباب في ألبانيا؛ تتضمن جداول بعدد متابعي الأئمة والدعاة الألبان والكوسوفيين على المنصات، وتُستخدم هنا لأرقام الوصول المؤرخة فقط."
  en: "Peer-reviewed study in Context 12:2 (2025) on the role of social media and digital platforms in forming religious identity among young people in Albania; its tables of Albanian and Kosovar imams' platform followings, accessed in October 2024, are used here for dated reach figures only."
  es: "Estudio revisado por pares en Context 12:2 (2025) sobre el papel de las redes sociales y las plataformas digitales en la formación de la identidad religiosa entre los jóvenes en Albania; sus tablas de seguidores en plataformas de imanes albaneses y kosovares, consultadas en octubre de 2024, se utilizan aquí solo para cifras de alcance fechadas."
  fr: "Étude évaluée par des pairs dans Context 12:2 (2025) sur le rôle des médias sociaux et des plateformes numériques dans la formation de l'identité religieuse chez les jeunes en Albanie; ses tableaux des abonnés des imams albanais et kosovars sur les plateformes, consultés en octobre 2024, ne sont utilisés ici que pour les chiffres de portée datés."
title: "The Role of Social Media and Digital Platforms in the Formation of Religious Identity Among Young People in Albania"
