reliability_note: "Peer-reviewed journal article (DOI 10.55425/23036966.2025.12.2.41), read in full as the publisher's PDF on 4 November 2026. Its follower tables rest on platform pages accessed in October 2024, so every figure taken from it is dated to that access in the records that cite it; the figures are the platforms' displayed counts as the study reports them, not museum measurements. The study discusses the preachers' public roles and charity work in prose but names no school of law or creed for any of them in its own voice, and it was not used to settle faith."
