  ar: "طبعة دار الأعلام بعمّان في مجلد واحد، صححها وخرّج أحاديثها عادل مرشد، مرقّمة التراجم ⁦(آخرها رقم 3590، أم الوليد الأنصارية، ص 968)⁩، مرتبة على حروف المعجم في الأسماء ثم كتاب الكنى ثم كتاب النساء وكناهن، بمقدمة للمحقق ثم مقدمة المصنف ⁦(ص 15-)⁩."
