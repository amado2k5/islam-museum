reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). Resting largely on the Encyclopaedia of Islam tradition, it gives his birth at Salonica in 1631 (per the Encyclopaedia Britannica), his fifteen years at the Kasımpaşa Mevlevi lodge under Sheikh Halil Dede, his chief-astrologer post from 1667/8, his exile to Egypt in 1687, his sheikhdom of the Mecca Mevlevi lodge, and his death on 27 February 1702 — one day earlier than the Turkish article and the Wikidata item give. It calls him a Sufi poet whose diwan treats mystical themes. Checked 1 November 2026."
