summary:
  ar: "مقالة ويكيبيديا العربية «عائشة ليمو»؛ ترجمة للمقالة الإنجليزية تحمل مراجعها نفسها. تثبت ميلادها في دورست سنة 1940 باسم بريدجيت عائشة هوني واعتناقها الإسلام سنة 1961 وزواجها من أحمد ليمو سنة 1968 ووفاتها في 5 يناير 2019."
  en: "Arabic Wikipedia article 'Aisha Lemu'; a translation of the English article carrying the same references. It gives her birth in Dorset in 1940 as Bridget Aisha Honey, her conversion to Islam in 1961, her marriage to Ahmed Lemu in 1968, and her death on 5 January 2019."
  es: "Artículo en árabe de la Wikipedia «Aisha Lemu»; traducción del artículo en inglés con las mismas referencias. Indica que nació en Dorset en 1940 con el nombre de Bridget Aisha Honey, su conversión al islam en 1961, su matrimonio con Ahmed Lemu en 1968 y su fallecimiento el 5 de enero de 2019."
  fr: "L'article « Aisha Lemu » de Wikipédia en arabe est une traduction de l'article anglais qui reprend les mêmes références. On y apprend sa naissance dans le Dorset en 1940 sous le nom de Bridget Aisha Honey, sa conversion à l'islam en 1961, son mariage avec Ahmed Lemu en 1968 et son décès le 5 janvier 2019."
  ur: "عربی ویکیپیڈیا مضمون 'عائشہ لیمو'؛ انگریزی مضمون کا ترجمہ جس میں وہی حوالہ جات موجود ہیں۔ اس نے ڈورسیٹ میں 1940 میں بریجٹ عائشہ ہنی کے طور پر جنم لیا، 1961 میں اسلام قبول کیا، 1968 میں احمد لیمو سے اس کی شادی، اور 5 جنوری 2019 کو اس کی موت ہوئی۔"
