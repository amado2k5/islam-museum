summary:
  ar: "«كتاب التيسير في القراءات السبع» للإمام أبي عمرو عثمان بن سعيد الداني، عني بتصحيحه أوتو برتزل، إستانبول، مطبعة الدولة، 1930، في سلسلة «النشريات الإسلامية» ⁦(الرقم 2)⁩ لجمعية المستشرقين الألمانية؛ فيه مقدمة للناشر وترجمة للداني من غاية النهاية لابن الجزري وتذكرة الحفاظ والصلة ومعجم الأدباء، وجدول للخطأ والصواب."
  en: "Kitab al-Taysir fi al-Qira'at al-Sab' by Imam Abu Amr Uthman ibn Sa'id al-Dani, edited by Otto Pretzl, Istanbul, State Press, 1930, in the series Bibliotheca Islamica (no. 2) of the German Oriental Society; with an editor's preface, a life of al-Dani drawn from Ibn al-Jazari's Ghayat al-Nihaya, al-Dhahabi's Tadhkirat al-Huffaz, Ibn Bashkuwal's al-Sila and Yaqut, and a table of corrections."
  ur: "امام ابو عمرو عثمان بن سعید دانی کی «کتاب التیسیر فی القراءات السبع»، تصحیح اوٹو پریتزل، استنبول، مطبعۃ الدولہ، 1930، جرمن مستشرقین کی انجمن کے سلسلہ «النشریات الاسلامیہ» ⁦(نمبر 2)⁩ میں؛ ناشر کے مقدمے، ابن الجزری کی غایۃ النہایہ، ذہبی کی تذکرۃ الحفاظ، ابن بشکوال کی الصلہ اور یاقوت سے ماخوذ دانی کے ترجمے، اور اغلاط نامے کے ساتھ۔"
