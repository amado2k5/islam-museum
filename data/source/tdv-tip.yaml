summary:
  ar: "القسم الأول من مدخل «التِّبّ» في موسوعة TDV الإسلامية، بقلم بيتر إ. بورمان ⁦(المجلد 41، إسطنبول 2012، ص 95–101)⁩. يتناول معنى الكلمة، والطب قبل الإسلام، والترجمة، ونظرية الأخلاط، والتشخيص والعلاج، وتكوين الأطباء، والحسبة، وطب النبي وطب الأطباء، ومصير الطب في الغرب اللاتيني."
  en: "The first part of the TDV İslâm Ansiklopedisi entry 'TIP' (medicine) by Peter E. Pormann (vol. 41, Istanbul 2012, pp. 95–101). It covers the meaning of the word, medicine before Islam, translation, humoral theory, diagnosis and treatment, the training of physicians, the examination of practitioners, the prophetic medicine literature and the transmission of Islamic medicine to Latin Europe."
  es: "La primera parte de la entrada «TIP» (medicina) de la TDV İslâm Ansiklopedisi, de Peter E. Pormann (vol. 41, Estambul, 2012, págs. 95-101), abarca el significado de la palabra, la medicina antes del Islam, la traducción, la teoría humoral, el diagnóstico y el tratamiento, la formación de los médicos, el examen de los profesionales, la literatura sobre medicina profética y la transmisión de la medicina islámica a la Europa latina."
  fr: "La première partie de l'article « TIP » (médecine) de l'encyclopédie TDV İslâm Ansiklopedisi, rédigé par Peter E. Pormann (vol. 41, Istanbul, 2012, p. 95-101), aborde la signification du mot, la médecine avant l'islam, sa traduction, la théorie des humeurs, le diagnostic et le traitement, la formation des médecins, l'examen des praticiens, la littérature médicale prophétique et la transmission de la médecine islamique en Europe latine."
  ur: "TDV İslâm Ansiklopedisi کے اندراج کا پہلا حصہ 'TIP' ⁦(طب)⁩ از پیٹر ای پورمن ⁦(جلد 41، استنبول 2012، صفحہ 95-101)⁩۔ اس میں لفظ کے معنی، اسلام سے پہلے کی دوا، ترجمہ، مزاحیہ نظریہ، تشخیص اور علاج، معالجین کی تربیت، پریکٹیشنرز کی جانچ، طب نبوی ادب اور لاطینی یورپ میں اسلامی ادویات کی منتقلی کا احاطہ کیا گیا ہے۔"
  tr: "\"Al-Tab\" maddesinin ilk bölümü, Peter E. Borman tarafından yazılan TDV İslami Ansiklopedisi'nde (Cilt 41, İstanbul 2012, ss. 95–101). Bu bölüm, İslam öncesi tıp, çeviri, mizah teorisi, tanı ve tedavi, hekimlerin yetiştirilmesi, hisbah, Peygamber ve hekimlerin tıbbı ile Latin Batı'da tıbbın akıbeti gibi konuları ele alır."
  id: "Bagian pertama dari entri \"Al-Tab\" dalam Ensiklopedia Islam TDV, oleh Peter E. Borman (Vol. 41, Istanbul 2012, hlm. 95–101). Bagian ini membahas makna kata 'medicine before Islam', terjemahan, teori humor, diagnosis dan pengobatan, pembentukan dokter, hisbah, pengobatan Nabi dan para dokter, serta nasib kedokteran di Barat Latin."
