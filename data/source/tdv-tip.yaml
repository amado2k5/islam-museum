summary:
  ar: "القسم الأول من مدخل «التِّبّ» في موسوعة TDV الإسلامية، بقلم بيتر إ. بورمان (المجلد 41، إسطنبول 2012، ص 95–101). يتناول معنى الكلمة، والطب قبل الإسلام، والترجمة، ونظرية الأخلاط، والتشخيص والعلاج، وتكوين الأطباء، والحسبة، وطب النبي وطب الأطباء، ومصير الطب في الغرب اللاتيني."
  en: "The first part of the TDV İslâm Ansiklopedisi entry 'TIP' (medicine) by Peter E. Pormann (vol. 41, Istanbul 2012, pp. 95–101). It covers the meaning of the word, medicine before Islam, translation, humoral theory, diagnosis and treatment, the training of physicians, the examination of practitioners, the prophetic medicine literature and the transmission of Islamic medicine to Latin Europe."
