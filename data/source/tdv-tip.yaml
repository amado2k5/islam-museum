reliability_note: "Read in full on 1 November 2026 in the web edition, first part of the entry (Pormann, printed pp. 95–101). The Ottoman part is the separate second part by Nil Sarı (tdv-tip-osmanli). The bibliography names many works (Galen, Râzî, Huneyn b. İshak, Ibn Sina, Ibn al-Nafis, Sulami, Zahabi, Savage-Smith, Pormann's monographs) that were not read for this record; those are not cited here except as the entry itself reports them, with the entry as source."
