label:
  ar: "تاريخ الإسلام ووفيات المشاهير والأعلام — الذهبي"
  en: "Tarikh al-Islam wa-Wafayat al-Mashahir wa-l-A'lam — al-Dhahabi"
summary:
  ar: "تاريخ الإسلام لشمس الدين الذهبي ⁦(ت 748هـ)⁩، يجمع أحداث السنين وتراجم الأعلام مرتبةً على الحِجج؛ تُشير الإحالات إلى سنة الحَجّة ثم الصفحة المطبوعة الظاهرة في مسح OCR."
  en: "Al-Dhahabi's (d. 748 AH) annalistic history with obituary notices arranged by year; citations give the year section then the printed page visible in the OCR scan."
  es: "Historia analística de Al-Dhahabi (fallecido en 748 AH) con avisos necrológicos ordenados por año; las citas indican la sección del año y luego la página impresa visible en el escaneo OCR."
  fr: "Histoire annalistique d'Al-Dhahabi (mort en 748 AH) avec notices nécrologiques classées par année; les citations donnent la section de l'année puis la page imprimée visible dans le scan OCR."
  ur: "الذہبی کی ⁦(متوفی 748ھ)⁩ تجزیاتی تاریخ جس میں سال کے لحاظ سے ترتیب دی گئی موت کے نوٹسز؛ حوالہ جات سال کا حصہ دیتے ہیں پھر OCR اسکین میں پرنٹ شدہ صفحہ نظر آتا ہے۔"
  tr: "Şemseddin el-Dahabi'nin (ö. 748 Hicri yılı) İslam Tarihi adlı eseri, yılların olaylarını ve önemli şahsiyetlerin biyografilerini kanıtlara göre derler; referanslar Belge yılına ve ardından OCR taramasında görünen basılı sayfaya atıfta bulunur."
  id: "The History of Islam oleh Shams al-Din al-Dhahabi (wafat 748 H) mengumpulkan peristiwa tahun-tahun dan biografi tokoh-tokoh penting yang disusun berdasarkan bukti; referensi merujuk pada tahun Bukti, kemudian pada halaman cetak yang muncul dalam pemindaian OCR."
title: "تاريخ الإسلام ووفيات المشاهير والأعلام"
author:
