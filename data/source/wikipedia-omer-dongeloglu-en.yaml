reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. The article cites the İhlas News Agency, Kanal 7 programme pages, his official website's biography and the Anadolu Agency obituary for its core facts. Its infobox gives his birth as 20 June 1968 — a day that conflicts with the 1 June 1968 given by the Turkish and Dutch articles, so this record gives the year 1968 only. Its infobox also lists denomination, jurisprudence and creed fields (Sunni, Hanafi, Maturidi): structured data, which never settles faith; the article's prose names no school for him. The text fetch exposed no separate revision timestamp, so no revision date is asserted beyond the read date; the page copy read was crawled on 30 August 2026. Read in full on 16 November 2026."
