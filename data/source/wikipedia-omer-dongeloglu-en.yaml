summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمر دونغل أوغلو؛ تُستخدم لوقائع الكيان فقط. تفصّل تعليمه في زيله وجامعة سقاريا، وعمله واعظًا في طوكات بين 1986 و1996، ووفاته بكوفيد-19 في 3 مايو 2020 في باشاك شهير بإسطنبول ودفنه في مقبرة شهداء أدرنة قابي، وقائمة مؤلفاته."
  en: "English Wikipedia article on Ömer Döngeloğlu; used for entity facts only. It details his schooling in Zile and at Sakarya University, his work as a preacher in Tokat between 1986 and 1996, his death from COVID-19 on 3 May 2020 in Başakşehir, Istanbul, and his burial at Edirnekapı Martyr's Cemetery, and his bibliography."
  es: "Artículo de la Wikipedia en inglés sobre Ömer Döngeloğlu; utilizado únicamente para datos biográficos. Detalla su formación académica en Zile y en la Universidad de Sakarya, su labor como predicador en Tokat entre 1986 y 1996, su fallecimiento por COVID-19 el 3 de mayo de 2020 en Başakşehir, Estambul, su entierro en el cementerio de los mártires de Edirnekapı y su bibliografía."
  fr: "Article de Wikipédia en anglais sur Ömer Döngeloğlu; utilisé uniquement à des fins d'information sur l'entité. Il détaille sa scolarité à Zile et à l'université de Sakarya, son travail de prédicateur à Tokat entre 1986 et 1996, son décès des suites de la COVID-19 le 3 mai 2020 à Başakşehir, Istanbul, son inhumation au cimetière des martyrs d'Edirnekapı, ainsi que sa bibliographie."
  ur: "Ömer Döngeloğlu پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں زیل اور ساکریہ یونیورسٹی میں ان کی تعلیم، 1986 اور 1996 کے درمیان ٹوکاٹ میں بطور مبلغ ان کے کام، باقشہیر، استنبول میں 3 مئی 2020 کو COVID-19 سے ان کی موت، اور ایڈرنیکاپی شہداء کے قبرستان میں ان کی تدفین، اور ان کی کتابیات کی تفصیل ہے۔"
