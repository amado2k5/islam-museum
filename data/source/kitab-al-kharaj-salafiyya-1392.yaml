label:
  ar: "أبو يوسف، كتاب الخراج ⁦(المطبعة السلفية، القاهرة، الطبعة الرابعة 1392هـ)⁩"
  en: "Abu Yusuf, Kitab al-Kharaj (al-Matba'a al-Salafiyya, Cairo, 4th ed., 1392 AH)"
  ur: "ابو یوسف، کتاب الخراج ⁦(المطبعۃ السلفیہ، قاہرہ، طبعِ چہارم 1392ھ)⁩"
summary:
  ar: "كتاب الخراج للقاضي أبي يوسف يعقوب بن إبراهيم ⁦(113-182هـ)⁩، صاحب الإمام أبي حنيفة، الذي اقترح عليه تصنيفه هارون الرشيد. اعتمد الناشر على نسخة مخطوطة في الخزانة التيمورية ⁦(رقم 674 فقه)⁩ مع معارضتها بطبعة بولاق سنة 1302هـ؛ عُنيت بنشره المطبعة السلفية ومكتبتها، 21 شارع الفتح بالروضة، القاهرة، الطبعة الرابعة 1392هـ."
  en: "Kitab al-Kharaj of the judge Abu Yusuf Ya'qub ibn Ibrahim (113-182 AH), companion of Imam Abu Hanifa, written at the suggestion of Harun al-Rashid. The publisher based it on a manuscript in the Taymuriyya library (no. 674 fiqh) collated with the Bulaq print of 1302 AH; published by al-Matba'a al-Salafiyya and its bookshop, 21 al-Fath Street, al-Rawda, Cairo, fourth edition 1392 AH."
  es: "Kitab al-Kharaj del juez Abu Yusuf Ya'qub ibn Ibrahim (113-182 AH), compañero del Imam Abu Hanifa, escrito por sugerencia de Harun al-Rashid. El editor lo basó en un manuscrito de la biblioteca Taymuriyya (núm. 674 fiqh) cotejado con la impresión de Bulaq de 1302 AH; publicado por al-Matba'a al-Salafiyya y su librería, 21 al-Fath Street, al-Rawda, El Cairo, cuarta edición 1392 AH."
  fr: "Kitab al-Kharaj du juge Abu Yusuf Ya'qub ibn Ibrahim (113-182 AH), compagnon de l'Imam Abu Hanifa, écrit sur suggestion de Harun al-Rashid. L'éditeur l'a basé sur un manuscrit de la bibliothèque Taymuriyya (n° 674 fiqh) rassemblé avec l'estampe Bulaq de 1302 AH; publié par al-Matba'a al-Salafiyya et sa librairie, 21 rue al-Fath, al-Rawda, Le Caire, quatrième édition 1392 AH."
  ur: "قاضی ابو یوسف یعقوب بن ابراہیم ⁦(113-182ھ)⁩ کی کتاب الخراج، امام ابو حنیفہ کے ساتھی، ہارون الرشید کی تجویز پر لکھی گئی۔ ناشر نے اسے تیموریہ لائبریری کے ایک مخطوطہ ⁦(نمبر 674 فقہ)⁩ کی بنیاد پر 1302 ہجری کے بلق طباعت سے ملایا۔ مطبع السلفیہ اور اس کی کتابوں کی دکان، 21 الفتح سٹریٹ، الروعدہ، قاہرہ، چوتھا ایڈیشن 1392 ہجری سے شائع ہوا۔"
  tr: "İmam Ebu Hanifa'nın yoldaşı Hakim Ebu Yusuf Ya'qub bin İbrahim'in (113-182 H) 'El-Kharaj' adlı kitabı, Harun el-Reşid'in derlemesini önerdiği Ebu Yusuf Ya'qub bin İbrahim'in (113-182 H) kitabını da eklemiştir. Yayınevi, 1302 Hicri Bulaq baskısında Timuri Kütüphanesi'ndeki el yazması bir kopyaya (No. 674 fıkıh) dayanırken, bu kopyaya karşı çıkmıştır; Selefi Matbaa ve Kütüphanesi ise eserin, Kahire'nin Al-Rawda kentinde 21 Al-Fath Caddesi'nde, dördüncü baskı 1392 Hicri'nde yayımlamıştır."
  id: "Buku 'Al-Kharaj' karya Hakim Abu Yusuf Ya'qub ibn Ibrahim (113-182 H), sahabat Imam Abu Hanifa, kepada siapa Harun al-Rashid mengusulkan penyusunannya. Penerbit mengandalkan naskah di Perpustakaan Timurid (No. 674 Fiqh) sementara menentangnya dalam edisi Bulaq tahun 1302 H; Salafi Press and Library berhati-hati menerbitkannya, 21 Al-Fath Street di Al-Rawda, Kairo, edisi keempat 1392 H."
