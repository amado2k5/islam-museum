summary:
  ar: "كتاب الخراج للقاضي أبي يوسف يعقوب بن إبراهيم (113-182هـ)، صاحب الإمام أبي حنيفة، الذي اقترح عليه تصنيفه هارون الرشيد. اعتمد الناشر على نسخة مخطوطة في الخزانة التيمورية (رقم 674 فقه) مع معارضتها بطبعة بولاق سنة 1302هـ؛ عُنيت بنشره المطبعة السلفية ومكتبتها، 21 شارع الفتح بالروضة، القاهرة، الطبعة الرابعة 1392هـ."
  en: "Kitab al-Kharaj of the judge Abu Yusuf Ya'qub ibn Ibrahim (113-182 AH), companion of Imam Abu Hanifa, written at the suggestion of Harun al-Rashid. The publisher based it on a manuscript in the Taymuriyya library (no. 674 fiqh) collated with the Bulaq print of 1302 AH; published by al-Matba'a al-Salafiyya and its bookshop, 21 al-Fath Street, al-Rawda, Cairo, fourth edition 1392 AH."
