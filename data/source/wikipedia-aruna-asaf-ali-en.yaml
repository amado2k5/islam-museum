  ar: "مقالة ويكيبيديا الإنجليزية عن أرونا آصف علي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها باسم أرونا غانغولي في كالكا في 16 تموز 1909 في أسرة بنغالية براهمية ووفاتها في نيودلهي في 29 تموز 1996، وزواجها من آصف علي سنة 1928، ورفعها علم المؤتمر في ميدان غواليا تانك سنة 1942، وعموديتها الأولى لدلهي، وجوائزها ومنها بهارات راتنا."
  en: "English Wikipedia article on Aruna Asaf Ali; used for entity facts only. It gives her birth, as Aruna Ganguly, at Kalka on 16 July 1909 into a Bengali Brahmin family and her death at New Delhi on 29 July 1996, her 1928 marriage to Asaf Ali, her hoisting of the Congress flag at Gowalia Tank Maidan in 1942, her term as Delhi's first mayor, and her awards including the Bharat Ratna."
