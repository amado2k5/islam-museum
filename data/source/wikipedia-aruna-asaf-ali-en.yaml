summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أرونا آصف علي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها باسم أرونا غانغولي في كالكا في 16 تموز 1909 في أسرة بنغالية براهمية ووفاتها في نيودلهي في 29 تموز 1996، وزواجها من آصف علي سنة 1928، ورفعها علم المؤتمر في ميدان غواليا تانك سنة 1942، وعموديتها الأولى لدلهي، وجوائزها ومنها بهارات راتنا."
  en: "English Wikipedia article on Aruna Asaf Ali; used for entity facts only. It gives her birth, as Aruna Ganguly, at Kalka on 16 July 1909 into a Bengali Brahmin family and her death at New Delhi on 29 July 1996, her 1928 marriage to Asaf Ali, her hoisting of the Congress flag at Gowalia Tank Maidan in 1942, her term as Delhi's first mayor, and her awards including the Bharat Ratna."
  es: "Artículo de la Wikipedia en inglés sobre Aruna Asaf Ali; utilizado únicamente para datos sobre la persona. En él se detalla su nacimiento, como Aruna Ganguly, en Kalka el 16 de julio de 1909 en el seno de una familia brahmán bengalí y su fallecimiento en Nueva Delhi el 29 de julio de 1996, su matrimonio con Asaf Ali en 1928, el izamiento de la bandera del Congreso en Gowalia Tank Maidan en 1942, su mandato como primera alcaldesa de Delhi y sus premios, incluido el Bharat Ratna."
  fr: "Article de Wikipédia en anglais sur Aruna Asaf Ali; utilisé uniquement pour les informations biographiques. Il indique sa naissance, sous le nom d'Aruna Ganguly, à Kalka le 16 juillet 1909 dans une famille de brahmanes bengalis, son décès à New Delhi le 29 juillet 1996, son mariage en 1928 avec Asaf Ali, la levée du drapeau du Congrès à Gowalia Tank Maidan en 1942, son mandat de première maire de Delhi et les distinctions qu'elle a reçues, dont le Bharat Ratna."
  ur: "ارونا آصف علی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ارونا گنگولی کی حیثیت سے 16 جولائی 1909 کو کالکا میں ایک بنگالی برہمن خاندان میں جنم لیتی ہے اور 29 جولائی 1996 کو نئی دہلی میں اس کی موت، 1928 میں آصف علی سے اس کی شادی، 1942 میں گووالیا ٹانک میدان میں کانگریس کا جھنڈا لہرانا، دہلی کے پہلے میئر کے طور پر ان کی مدت ملازمت، اور را کا ایوارڈ بھی شامل ہے۔"
  tr: "Aruna Asif Ali hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılır. 16 Temmuz 1909'da Kalka'da bir Bengal Brahmi ailesine ait Aruna Ganguly olarak anılır, 29 Temmuz 1996'da Yeni Delhi'de vefat eder, 1928'de Asif Ali ile evlenir, 1942'de Ghwalia Tank Meydanı'nda konferans bayrağını çeker, Delhi'deki ilk köşe yazısı ve Bharat Ratna dahil ödülleri vardır."
  id: "Artikel Wikipedia bahasa Inggris tentang Aruna Asif Ali; hanya digunakan sebagai fakta entitas. Ia disebut sebagai Aruna Ganguly di Kalka pada 16 Juli 1909, dalam keluarga Brahmi Bengali, kematiannya di New Delhi pada 29 Juli 1996, pernikahannya dengan Asif Ali pada tahun 1928, pengibaran bendera konferensi di Ghwalia Tank Square pada tahun 1942, kolom pertamanya di Delhi, dan penghargaan yang ia terima termasuk Bharat Ratna."
