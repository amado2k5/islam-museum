summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن كاسمان سينغوديميدجو؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في الميلاد والوفاة ومكان الدفن، وتفصّل نشاطه في المحمدية وتأسيسه حزب الإسلام الإندونيسي سنة 1938 ورئاسته الأولى لجامعة إندونيسيا الإسلامية."
  en: "Indonesian Wikipedia article on Kasman Singodimedjo; used for entity facts only. It agrees with the English article on his birth, death and burial place, and adds his Muhammadiyah activism, his part in founding the Indonesian Islamic Party in 1938, and his first rectorship of the Islamic University of Indonesia."
  es: "Artículo de la Wikipedia en indonesio sobre Kasman Singodimedjo; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento, muerte y lugar de sepultura, y añade su activismo en Muhammadiyah, su participación en la fundación del Partido Islámico Indonesio en 1938 y su primer mandato como rector de la Universidad Islámica de Indonesia."
  fr: "Article de Wikipédia indonésien sur Kasman Singodimedjo; utilisé uniquement pour les informations biographiques. Il concorde avec l’article anglais concernant sa naissance, son décès et son lieu de sépulture, et ajoute son activisme au sein de la Muhammadiyah, son rôle dans la fondation du Parti islamique indonésien en 1938 et son premier rectorat de l’Université islamique d’Indonésie."
  ur: "Kasman Singodimedjo پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش، وفات اور تدفین کی جگہ پر انگریزی مضمون سے اتفاق کرتا ہے، اور اس کی محمدیہ سرگرمی، 1938 میں انڈونیشین اسلامک پارٹی کی بنیاد رکھنے میں ان کا حصہ، اور انڈونیشیا کی اسلامی یونیورسٹی کی پہلی ریکٹر شپ کو شامل کرتا ہے۔"
  tr: "Kasman Sengudimidjo hakkında Endonezya Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğum, ölüm ve defin yeri konularında İngilizce ile uyumludur; Muhammediye'deki faaliyetlerini, 1938'de Endonezya İslam Partisi'ni kurmasını ve Endonezya İslam Üniversitesi'ndeki ilk başkanlığını detaylandırır."
  id: "Artikel Wikipedia Indonesia tentang Kasman Sengudimidjo; digunakan hanya untuk fakta entitas. Artikel ini sejalan dengan bahasa Inggris tentang kelahiran, kematian, dan tempat pemakaman, merinci aktivitasnya di Mohammadiyah, pendirian Partai Islam Indonesia pada tahun 1938, dan kepresidenan pertamanya di Universitas Islam Indonesia."
