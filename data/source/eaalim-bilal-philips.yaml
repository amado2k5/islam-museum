  ar: "ملف معهد «العليم» البريطاني التعليمي عن بلال فيليبس: يصفه بأنه عالم سني جامايكي-كندي مؤسس للجامعة الإسلامية المفتوحة عبر الإنترنت، ويذكر نصا أنه «يعمل ضمن التقليد السني ذي النزعة السلفية»، ويروي اعتناقه الإسلام سنة 1972 ودراسته في المدينة المنورة والرياض وجامعة ويلز."
  en: "The UK Eaalim Institute's profile of Bilal Philips: it calls him a Jamaican-Canadian Sunni scholar and founder of the Islamic Online University, states in terms that he 'works within the Salafi-leaning Sunni tradition', and narrates his embrace of Islam in 1972 and his studies at Madinah, Riyadh and the University of Wales."
