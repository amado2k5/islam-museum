summary:
  ar: "ملف معهد «العليم» البريطاني التعليمي عن بلال فيليبس: يصفه بأنه عالم سني جامايكي-كندي مؤسس للجامعة الإسلامية المفتوحة عبر الإنترنت، ويذكر نصا أنه «يعمل ضمن التقليد السني ذي النزعة السلفية»، ويروي اعتناقه الإسلام سنة 1972 ودراسته في المدينة المنورة والرياض وجامعة ويلز."
  en: "The UK Eaalim Institute's profile of Bilal Philips: it calls him a Jamaican-Canadian Sunni scholar and founder of the Islamic Online University, states in terms that he 'works within the Salafi-leaning Sunni tradition', and narrates his embrace of Islam in 1972 and his studies at Madinah, Riyadh and the University of Wales."
  es: "El perfil que el Instituto Eaalim del Reino Unido hace de Bilal Philips lo describe como un erudito sunita jamaicano-canadiense y fundador de la Universidad Islámica en Línea, afirma que \"trabaja dentro de la tradición sunita de tendencia salafista\" y narra su conversión al Islam en 1972 y sus estudios en Medina, Riad y la Universidad de Gales."
  fr: "Le profil de Bilal Philips établi par l'Institut Eaalim du Royaume-Uni le décrit comme un érudit sunnite jamaïco-canadien et fondateur de l'Université islamique en ligne, précise qu'il « travaille dans la tradition sunnite à tendance salafiste » et relate sa conversion à l'islam en 1972 ainsi que ses études à Médine, à Riyad et à l'Université du Pays de Galles."
  ur: "یو کے ایالم انسٹی ٹیوٹ کا بلال فلپس کا پروفائل: وہ اسے جمیکا-کینیڈین سنی اسکالر اور اسلامک آن لائن یونیورسٹی کا بانی کہتا ہے، اس لحاظ سے کہ وہ 'سلفی جھکاؤ رکھنے والی سنی روایت کے اندر کام کرتا ہے'، اور 1972 میں اپنے اسلام قبول کرنے اور مدینہ، ریاض اور یونیورسٹی میں اپنی تعلیم کو بیان کرتا ہے۔"
  tr: "Britanya 'Al-Aleem' Eğitim Enstitüsü'nün Bilal Phillips hakkındaki dosyası: Onu Jamaika-Kanadalı Sünni bir âlim ve İslami Açık Çevrimiçi Üniversitesi'nin kurucusu olarak tanımlar, bir metinde \"Sünni gelenek içinde Selefi eğilimle çalıştığını\" belirtir ve 1972'de İslam'a geçişini, Medine, Riyad ve Galler Üniversitesi'ndeki eğitimlerini anlatır."
  id: "Berkas Institut Pendidikan Inggris 'Al-Aleem' tentang Bilal Phillips: Ia menggambarkannya sebagai cendekiawan Sunni Jamaika-Kanada dan pendiri Islamic Open Online University, menyebutkan dalam sebuah teks bahwa ia \"bekerja dalam tradisi Sunni dengan kecenderungan Salafi,\" dan menceritakan konversinya ke Islam pada tahun 1972 serta studinya di Madinah, Riyadh, dan Universitas Wales."
