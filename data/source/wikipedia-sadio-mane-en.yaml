  ar: "مقالة ويكيبيديا الإنجليزية عن ساديو ماني؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في بامبالي في 10 أبريل 1992، ومسيرته من ميتز وسالزبورغ وساوثهامبتون إلى ليفربول وبايرن والنصر، وألقابه مع ليفربول والسنغال، وتصفه بأنه مسلم ممارس دون تسمية أي مذهب له."
  en: "English Wikipedia article on Sadio Mané; used for entity facts only. It records his birth in Bambali on 10 April 1992, his career from Metz, Salzburg and Southampton to Liverpool, Bayern Munich and Al-Nassr, his titles with Liverpool and Senegal, and describes him as a practising Muslim, naming no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Sadio Mané; utilizado únicamente para obtener información sobre la persona. En él se registra su nacimiento en Bambali el 10 de abril de 1992, su trayectoria profesional desde el Metz, Salzburgo y Southampton hasta el Liverpool, el Bayern de Múnich y el Al-Nassr, sus títulos con el Liverpool y la selección de Senegal, y se le describe como musulmán practicante, sin mencionar ninguna escuela a la que perteneciera."
  fr: "Article de Wikipédia en anglais sur Sadio Mané; utilisé uniquement pour les informations le concernant. Il relate sa naissance à Bambali le 10 avril 1992, son parcours de Metz, Salzbourg et Southampton à Liverpool, au Bayern Munich et à Al-Nassr, ses titres avec Liverpool et le Sénégal, et le décrit comme un musulman pratiquant, sans mentionner d'école religieuse."
