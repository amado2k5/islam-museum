  fr: "L'article de Wikipédia en ouzbek sur Hamza Hakimzade Niyazi (6 mars 1889 – 18 mars 1929), poète, compositeur et dramaturge ouzbek et premier dramaturge ouzbek; il mentionne son nom de plume Nihoniy et ses écoles Jadid et ne fait aucune attestation athée."
  ur: "حمزہ حکیم زادے نیازی ⁦(6 مارچ 1889 - 18 مارچ 1929)⁩ پر ازبک ویکیپیڈیا مضمون، ازبک شاعر، موسیقار اور ڈرامہ نگار اور پہلے ازبک ڈرامہ نگار؛ اس میں اس کا قلمی نام نیہونی اور اس کے جدید مکاتب کو ریکارڈ کیا گیا ہے اور اس میں کوئی ملحد کی تصدیق نہیں کی گئی ہے۔"
