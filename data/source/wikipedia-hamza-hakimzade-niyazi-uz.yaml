  ur: "حمزہ حکیم زادے نیازی ⁦(6 مارچ 1889 - 18 مارچ 1929)⁩ پر ازبک ویکیپیڈیا مضمون، ازبک شاعر، موسیقار اور ڈرامہ نگار اور پہلے ازبک ڈرامہ نگار؛ اس میں اس کا قلمی نام نیہونی اور اس کے جدید مکاتب کو ریکارڈ کیا گیا ہے اور اس میں کوئی ملحد کی تصدیق نہیں کی گئی ہے۔"
  tr: "Özbek Vikipedi makalesi, Özbek şair, besteci ve oyun yazarı Hamza Hakimzadeh Niazi (6 Mart 1889 – 18 Mart 1929) hakkında; onun 'Nihoni' takma adı ve yeni okullarından bahseder, ateist olarak tanımlanmaz."
  id: "Artikel Wikipedia Uzbek tentang Hamza Hakimzadeh Niazi (6 Maret 1889 – 18 Maret 1929), penyair, komposer, dan dramawan Uzbek, serta penulis drama Uzbekistan pertama; artikel ini menyebutkan nama samaran 'Nihoni' dan aliran barunya serta tidak menggambarkannya sebagai ateis."
