  en: "The Uzbek Wikipedia article on Hamza Hakimzade Niyazi (6 March 1889 – 18 March 1929), the Uzbek poet, composer and playwright and first Uzbek dramatist; it records his pen name Nihoniy and his Jadid schools and makes no atheist attestation."
