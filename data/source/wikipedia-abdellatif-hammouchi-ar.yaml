  ar: "مقالة ويكيبيديا العربية عن عبد اللطيف الحموشي، رئيس المديريتين العامتين للأمن الوطني ومراقبة التراب الوطني في المغرب؛ توافق المقالة الإنجليزية على إجازته في الحقوق من فاس ودخوله الأجهزة الأمنية سنة ١٩٩٣ ورئاسته لمديرية مراقبة التراب الوطني من ٢٠٠٥، ولا تعطي تاريخ مولد في مقدمتها."
  en: "Arabic Wikipedia article on Abdellatif Hammouchi, head of Morocco's national security and territorial surveillance directorates; it agrees with the English article on his Fez law degree, his 1993 entry into the security services and his headship of the DST from 2005, and gives no birth date in its lead."
