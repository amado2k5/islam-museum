summary:
  ar: "مقالة ويكيبيديا العربية عن عبد اللطيف الحموشي، رئيس المديريتين العامتين للأمن الوطني ومراقبة التراب الوطني في المغرب؛ توافق المقالة الإنجليزية على إجازته في الحقوق من فاس ودخوله الأجهزة الأمنية سنة ١٩٩٣ ورئاسته لمديرية مراقبة التراب الوطني من ٢٠٠٥، ولا تعطي تاريخ مولد في مقدمتها."
  en: "Arabic Wikipedia article on Abdellatif Hammouchi, head of Morocco's national security and territorial surveillance directorates; it agrees with the English article on his Fez law degree, his 1993 entry into the security services and his headship of the DST from 2005, and gives no birth date in its lead."
  es: "Artículo en árabe de la Wikipedia sobre Abdellatif Hammouchi, jefe de las direcciones de seguridad nacional y vigilancia territorial de Marruecos; coincide con el artículo en inglés sobre su licenciatura en derecho por la Universidad de Fez, su ingreso en los servicios de seguridad en 1993 y su dirección de la DST desde 2005, y no proporciona su fecha de nacimiento en la introducción."
  fr: "L'article de Wikipédia en arabe sur Abdellatif Hammouchi, chef des directions de la sécurité nationale et de la surveillance territoriale du Maroc, est en accord avec l'article en anglais concernant son diplôme de droit de Fès, son entrée dans les services de sécurité en 1993 et sa direction de la DST à partir de 2005, et ne mentionne aucune date de naissance dans son introduction."
  ur: "مراکش کی قومی سلامتی اور علاقائی نگرانی کے ڈائریکٹوریٹ کے سربراہ عبداللطیف حموچی پر عربی ویکیپیڈیا کا مضمون؛ یہ ان کی Fez لاء ڈگری پر انگریزی مضمون، سیکورٹی سروسز میں ان کے 1993 میں داخلہ اور 2005 سے DST کی سربراہی سے اتفاق کرتا ہے، اور اس کی قیادت میں کوئی تاریخ پیدائش نہیں بتاتی۔"
  tr: "Fas Ulusal Güvenlik ve Bölgesel Gözetim Genel Müdürlükleri başkanı Abdellatif Hammouchi hakkında Arapça Wikipedia makalesi; İngilizce makale, Fez'den hukuk diploması, 1993'te güvenlik servislerine katılımı ve 2005'ten beri Bölgesel Gözetim Müdürlüğü başkanlığı ile örtüşüyor, giriş kısmında doğum tarihi belirtilmemektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang Abdellatif Hammouchi, kepala Direktorat Jenderal Keamanan Nasional dan Pengawasan Wilayah di Maroko; artikel berbahasa Inggris ini sejalan dengan gelar hukumnya dari Fez, masuknya ke dinas keamanan pada tahun 1993, dan kepresidenannya di Direktorat Pengawasan Wilayah sejak 2005, tanpa mencantumkan tanggal lahir dalam pengantar."
