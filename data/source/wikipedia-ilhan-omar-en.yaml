summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إلهان عمر، مراجعة 24 أكتوبر 2026؛ تُستخدم لوقائع الكيان فقط، ويُستشهد بكل واقعة بمصدرها كما ذكرته المقالة. تصف والدها وجدها بأنهما كانا مسلمَين سنيَّين معتدلَين، وهي خلفية أسرية لا إثبات لمدرستها هي."
  en: "English Wikipedia article on Ilhan Omar, revision of 24 October 2026; used for entity facts only, each cited where the article gives its own source. It describes her father and grandfather as moderate Sunni Muslims — family background, not an attestation of her own school."
  es: "Artículo de la Wikipedia en inglés sobre Ilhan Omar, revisado el 24 de octubre de 2026; se utiliza únicamente para datos sobre la persona, citados donde el artículo proporciona su propia fuente. Describe a su padre y abuelo como musulmanes sunitas moderados; antecedentes familiares, no una certificación de su escuela religiosa."
  fr: "Article de Wikipédia en anglais sur Ilhan Omar, mis à jour le 24 octobre 2026; utilisé uniquement pour les informations la concernant, chaque élément étant cité à la source indiquée dans l’article. Il y est décrit son père et son grand-père comme des musulmans sunnites modérés – il s’agit d’un contexte familial, et non d’une attestation de son appartenance à une école de pensée."
  ur: "الہان عمر پر انگریزی ویکیپیڈیا مضمون، 24 اکتوبر 2026 کی نظرثانی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک کا حوالہ دیا جاتا ہے جہاں مضمون اپنا ماخذ دیتا ہے۔ اس میں اس کے والد اور دادا کو اعتدال پسند سنی مسلمانوں کے طور پر بیان کیا گیا ہے - خاندانی پس منظر، اس کے اپنے اسکول کی تصدیق نہیں۔"
  tr: "İlhan Omar hakkında İngilizce Vikipedi makalesi, revizyon 24 Ekim 2026; sadece varlık gerçekleri için kullanılmıştır ve her olay makalede belirtildiği gibi kaynağında belirtilmiştir. Babası ve büyükbabası, onları ılımlı Sünni Müslümanlar olarak tanımlar; bu aile geçmişi okulunu kanıtlamaz."
  id: "Artikel Wikipedia bahasa Inggris tentang Ilhan Omar, revisi 24 Oktober 2026; digunakan hanya untuk fakta entitas, dan setiap insiden dikutip di sumbernya seperti yang dikutip dalam artikel. Ayah dan kakeknya menggambarkan mereka sebagai Muslim Sunni moderat, latar belakang keluarga yang tidak membuktikan sekolahnya."
