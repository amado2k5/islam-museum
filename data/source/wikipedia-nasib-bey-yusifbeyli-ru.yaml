summary:
  ar: "مقالة ويكيبيديا الروسية عن نصيب بك يوسف بكلي تحت لقبه البديل أوسوبيكوف؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته ورئاسته للحكومة من أبريل 1919 إلى مارس 1920 ووفاته في 31 مايو 1920 في كوردمير، وتذكر أن حقيبته الوزارية الأولى شملت شؤون الأديان."
  en: "Russian Wikipedia article on Nasib bey Yusifbeyli under his alternate surname Usubbekov; used for entity facts only. It recounts his career, his premiership from April 1919 to March 1920, and his death on 31 May 1920 at Kurdamir, and notes that his first ministerial portfolio included religious affairs."
  es: "Artículo de la Wikipedia rusa sobre Nasib bey Yusifbeyli, bajo su apellido alternativo Usubbekov; utilizado únicamente para datos sobre la persona. Relata su trayectoria, su mandato como primer ministro desde abril de 1919 hasta marzo de 1920 y su fallecimiento el 31 de mayo de 1920 en Kurdamir, y señala que su primera cartera ministerial incluía asuntos religiosos."
  fr: "Article de Wikipédia en russe sur Nasib bey Yusifbeyli, également connu sous le nom d'Usubbekov; utilisé uniquement à des fins d'information sur l'entité. Il retrace sa carrière, son mandat de Premier ministre d'avril 1919 à mars 1920 et sa mort le 31 mai 1920 à Kurdamir, et précise que son premier portefeuille ministériel incluait les affaires religieuses."
  ur: "Nasib bey Yusifbeyli پر روسی ویکیپیڈیا کا مضمون اس کے متبادل کنیت Usubbekov کے تحت؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے کیریئر، اپریل 1919 سے مارچ 1920 تک ان کی وزارت عظمیٰ، اور 31 مئی 1920 کو کردامیر میں ان کی موت کا ذکر کیا گیا ہے، اور نوٹ کیا گیا ہے کہ ان کے پہلے وزارتی پورٹ فولیو میں مذہبی امور شامل تھے۔"
  tr: "Nasib Bey Yusuf Bakli hakkında alternatif başlığı Osobikov olan Rusça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılır. Nisan 1919'dan Mart 1920'ye kadar olan kariyerini ve hükümet liderliğini ve 31 Mayıs 1920'de Kurdmir'de ölümünü anlatır ve ilk bakanlık görevinin dini işleri de kapsadığını belirtir."
  id: "Artikel Wikipedia Rusia tentang Nasib Bey Yusuf Bakli dengan judul alternatifnya Osobikov hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan karier dan kepemimpinannya di pemerintahan dari April 1919 hingga Maret 1920 serta kematiannya pada 31 Mei 1920 di Kurdmir, dengan mencatat bahwa portofolio menteri pertamanya mencakup urusan keagamaan."
