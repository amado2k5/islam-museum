summary:
  ar: "تقرير عن عزم دار نيري بوتسا إصدار ترجمة إيطالية لـ«النبطي» وقرب صدور طبعتها المصرية السادسة."
  en: "Report that Neri Pozza would publish an Italian translation of «النبطي» and that its sixth Egyptian printing was imminent."
  es: "Se informó que Neri Pozza publicaría una traducción al italiano de «النبطي» y que su sexta edición egipcia era inminente."
  fr: "On rapporte que Neri Pozza allait publier une traduction italienne de «النبطي» et que sa sixième impression égyptienne était imminente."
  ur: "رپورٹ کریں کہ نیری پوزا «النبطي» کا اطالوی ترجمہ شائع کرے گا اور اس کی چھٹی مصری طباعت قریب ہے۔"
  tr: "Neri Butza'nın \"Nabateanlar\"ın İtalyanca çevirisini yayımlama niyeti ve altıncı Mısır baskısının yakında yayımlanacağı hakkında rapor."
  id: "Laporan tentang niat Neri Butza untuk menerbitkan terjemahan Italia dari \"The Nabateans\" dan rilis edisi Mesir keenam yang akan datang."
title: "الجزيرة — ترجمة إيطالية لرواية «النبطي» وطبعة جديدة من «عزازيل»"
