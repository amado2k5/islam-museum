summary:
  en: "The Muslim 500 profile of Imane Khelif: Imane Khelif is the first Algerian, Arab and African woman to win an Olympic gold medal in boxing at the 2024 Paris Olympics, becoming a national symbol of perseverance despite eligibility accusations and online harassment."
  es: "Perfil de Imane Khelif en Muslim 500: Imane Khelif es la primera mujer argelina, árabe y africana en ganar una medalla de oro olímpica en boxeo en los Juegos Olímpicos de París 2024, convirtiéndose en un símbolo nacional de perseverancia a pesar de las acusaciones de elegibilidad y el acoso en línea."
  fr: "Profil Muslim 500 d'Imane Khelif: Imane Khelif est la première Algérienne, Arabe et Africaine à remporter une médaille d'or olympique en boxe aux Jeux olympiques de Paris de 2024, devenant un symbole national de persévérance malgré les accusations de contestation de son éligibilité et le harcèlement en ligne."
  ur: "ایمانی خلیف کا مسلم 500 پروفائل: ایمانی خلیف 2024 کے پیرس اولمپکس میں باکسنگ میں اولمپک گولڈ میڈل جیتنے والی پہلی الجزائری، عرب اور افریقی خاتون ہیں، جو اہلیت کے الزامات اور آن لائن ہراساں کیے جانے کے باوجود ثابت قدمی کی قومی علامت بن گئی ہیں۔"
