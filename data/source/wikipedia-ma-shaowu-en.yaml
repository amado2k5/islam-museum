reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives him as born about 1874 in Yunnan and killed in 1937, Daotai of Kashgar 1924–1933 with Ma Fuxing as his predecessor in its infobox. Its family-history passage states that the Jahriyya Sufi leader Ma Yuanzhang was related to Ma Hualong, 'which made him related to Ma Shaowu, who was also related to Ma Hualong', and it prints in full the couplet Ma Yuanzhang wrote honouring Ma Shaowu's pilgrimage to the isolated tomb of the founding ancestor's family, calling him a true worthy descendant; its categories file him under 'Chinese Sufis' and 'Naqshbandi order', which are filings and are not counted as attestation."
