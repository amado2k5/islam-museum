  ar: "مقالة ويكيبيديا الإنجليزية عن ما شاوو؛ تُستخدم لوقائع الكيان فقط. تروي القائد الهوي الذي حكم كاشغر داوتايًا (1924–1933) بعد أن أطلق النار على ما فوشينغ بأمر يانغ زنغشين، ونجا من محاولة اغتيال سنة 1934، ثم قُتل في تطهير شنغ شيتساي سنة 1937."
  en: "English Wikipedia article on Ma Shaowu; used for entity facts only. It recounts the Hui commander who ruled Kashgar as Daotai (1924–1933) after shooting Ma Fuxing on Yang Zengxin's orders, survived the 1934 assassination attempt, and was killed in Sheng Shicai's purge of 1937."
