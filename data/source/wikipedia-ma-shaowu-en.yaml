summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ما شاوو؛ تُستخدم لوقائع الكيان فقط. تروي القائد الهوي الذي حكم كاشغر داوتايًا (1924–1933) بعد أن أطلق النار على ما فوشينغ بأمر يانغ زنغشين، ونجا من محاولة اغتيال سنة 1934، ثم قُتل في تطهير شنغ شيتساي سنة 1937."
  en: "English Wikipedia article on Ma Shaowu; used for entity facts only. It recounts the Hui commander who ruled Kashgar as Daotai (1924–1933) after shooting Ma Fuxing on Yang Zengxin's orders, survived the 1934 assassination attempt, and was killed in Sheng Shicai's purge of 1937."
  es: "Artículo de la Wikipedia en inglés sobre Ma Shaowu; utilizado únicamente para obtener información sobre la persona. Relata la historia del comandante Hui que gobernó Kashgar como Daotai (1924-1933) tras disparar a Ma Fuxing por orden de Yang Zengxin, sobrevivió al intento de asesinato de 1934 y murió en la purga de Sheng Shicai en 1937."
  fr: "Article de Wikipédia en anglais sur Ma Shaowu; utilisé uniquement pour les informations factuelles sur l'entité. Il relate l'histoire du commandant Hui qui a dirigé Kashgar sous le nom de Daotai (1924-1933) après avoir abattu Ma Fuxing sur ordre de Yang Zengxin, survécu à la tentative d'assassinat de 1934 et été tué lors de la purge de Sheng Shicai en 1937."
  ur: "Ma Shaowu پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ہُوئی کمانڈر کا ذکر ہے جس نے یانگ زینگسین کے حکم پر ما فوکسنگ کو گولی مارنے کے بعد کاشغر پر داؤتائی (1924–1933) کے طور پر حکمرانی کی، 1934 کے قاتلانہ حملے میں بچ گئے، اور 1937 کے شینگ شیکائی کی پاکیزگی میں مارے گئے۔"
  tr: "Ma Shaowu hakkında İngilizce Vikipedi makalesi; yalnızca varlık gerçekleri için kullanılmıştır. Yang Zengxin'in emriyle Ma Fuxing'i vurup Kashgar Daotaya'yı (1924–1933) yöneten Hui komutanının hikayesini anlatır; 1934'te bir suikast girişiminden sağ kurtulmuş ve 1937'de Sheng Shicai Temizliği sırasında öldürülmüştür."
  id: "Artikel Wikipedia bahasa Inggris tentang Ma Shaowu; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kisah komandan Hui yang memerintah Kashgar Daotaya (1924–1933) setelah menembak Ma Fuxing atas perintah Yang Zengxin, selamat dari upaya pembunuhan pada tahun 1934, dan tewas selama Pembersihan Sheng Shicai pada tahun 1937."
