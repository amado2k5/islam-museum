summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد بن زايد آل نهيان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في 11 مارس 1961، ثالث أبناء زايد بن سلطان، وتخرج في أكاديمية ساندهيرست سنة 1979، وصار ولي عهد أبوظبي سنة 2004 والقائد الفعلي للدولة من 2014، ثم حاكم أبوظبي ورئيس الإمارات من مايو 2022. ويقرأ حقل الدين في صندوق معلوماتها «الإسلام السني»؛ والعبارة الوحيدة عن دينه في متنها قوله المنقول عنه سنة 2007: «أنا عربي، أنا مسلم وأصلي»، وهي تثبت إسلامه ولا تسمي مدرسة."
  en: "English Wikipedia article on Mohamed bin Zayed Al Nahyan; used for entity facts only. It gives him as born on 11 March 1961, the third son of Zayed bin Sultan, a Sandhurst graduate of 1979, crown prince of Abu Dhabi from 2004, de facto leader of the UAE from 2014, and ruler of Abu Dhabi and president of the UAE from May 2022. Its infobox religion field reads 'Sunni Islam'; the only religion statement in its text is his own quoted remark of 2007, 'I am an Arab, I am a Muslim and I pray', which attests his Muslim identity and names no school."
  es: "Artículo de Wikipedia en inglés sobre Mohamed bin Zayed Al Nahyan; utilizado únicamente para datos sobre la entidad. Indica que nació el 11 de marzo de 1961, tercer hijo de Zayed bin Sultan, graduado de Sandhurst en 1979, príncipe heredero de Abu Dabi desde 2004, líder de facto de los EAU desde 2014 y gobernante de Abu Dabi y presidente de los EAU desde mayo de 2022. El campo de religión de su ficha informativa dice \"Islam sunita\"; la única declaración religiosa en su texto es su propia cita de 2007: \"Soy árabe, soy musulmán y rezo\", que atestigua su identidad musulmana y no menciona ninguna escuela."
  fr: "Article Wikipédia en anglais sur Mohamed ben Zayed Al Nahyan; utilisé uniquement pour les informations le concernant. Il indique qu'il est né le 11 mars 1961, troisième fils de Zayed ben Sultan, diplômé de Sandhurst en 1979, prince héritier d'Abou Dhabi depuis 2004, dirigeant de facto des Émirats arabes unis depuis 2014, et souverain d'Abou Dhabi et président des Émirats arabes unis depuis mai 2022. L'infobox « Religion » mentionne « Islam sunnite »; la seule déclaration religieuse figurant dans le texte est une citation de Mohamed ben Zayed datant de 2007: « Je suis arabe, je suis musulman et je prie », attestant ainsi son identité musulmane sans mentionner d'école religieuse."
