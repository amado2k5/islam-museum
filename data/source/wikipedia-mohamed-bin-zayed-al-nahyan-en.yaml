summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد بن زايد آل نهيان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في 11 مارس 1961، ثالث أبناء زايد بن سلطان، وتخرج في أكاديمية ساندهيرست سنة 1979، وصار ولي عهد أبوظبي سنة 2004 والقائد الفعلي للدولة من 2014، ثم حاكم أبوظبي ورئيس الإمارات من مايو 2022. ويقرأ حقل الدين في صندوق معلوماتها «الإسلام السني»؛ والعبارة الوحيدة عن دينه في متنها قوله المنقول عنه سنة 2007: «أنا عربي، أنا مسلم وأصلي»، وهي تثبت إسلامه ولا تسمي مدرسة."
  en: "English Wikipedia article on Mohamed bin Zayed Al Nahyan; used for entity facts only. It gives him as born on 11 March 1961, the third son of Zayed bin Sultan, a Sandhurst graduate of 1979, crown prince of Abu Dhabi from 2004, de facto leader of the UAE from 2014, and ruler of Abu Dhabi and president of the UAE from May 2022. Its infobox religion field reads 'Sunni Islam'; the only religion statement in its text is his own quoted remark of 2007, 'I am an Arab, I am a Muslim and I pray', which attests his Muslim identity and names no school."
