  ar: "مقالة ويكيبيديا الأردية عن تسنیم زہرا حسین؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها مولدها في «القرن العشرين» بلاهور دون تاريخ، ودراستها في جامعة ستوكهولم وإشراف أنصار فياض الدين على رسالتها، ومنصبها في جامعة لاهور للعلوم الإدارية، وروايتها الصادرة في نوفمبر 2014. لا يحتوي المقال أي محتوى ديني."
  en: "Urdu Wikipedia article on Tasneem Zehra Husain; used for entity facts only. Its infobox gives her birth as '20th century' at Lahore with no date, her Stockholm University education and doctoral supervision by Ansar Fayyazuddin, her LUMS post, and her novel of November 2014. The article contains no religion content."
