summary:
  ar: "مقالة ويكيبيديا الأردية عن تسنیم زہرا حسین؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها مولدها في «القرن العشرين» بلاهور دون تاريخ، ودراستها في جامعة ستوكهولم وإشراف أنصار فياض الدين على رسالتها، ومنصبها في جامعة لاهور للعلوم الإدارية، وروايتها الصادرة في نوفمبر 2014. لا يحتوي المقال أي محتوى ديني."
  en: "Urdu Wikipedia article on Tasneem Zehra Husain; used for entity facts only. Its infobox gives her birth as '20th century' at Lahore with no date, her Stockholm University education and doctoral supervision by Ansar Fayyazuddin, her LUMS post, and her novel of November 2014. The article contains no religion content."
  es: "Artículo de Wikipedia en urdu sobre Tasneem Zehra Husain; se utiliza únicamente para obtener información sobre la persona. Su ficha informativa indica que nació en Lahore en el siglo XX, sin especificar la fecha, su formación en la Universidad de Estocolmo y su tesis doctoral dirigida por Ansar Fayyazuddin, su puesto en LUMS y su novela de noviembre de 2014. El artículo no contiene contenido religioso."
  fr: "Article Wikipédia en ourdou sur Tasneem Zehra Husain; utilisé uniquement pour des informations sur l'entité. Son infobox indique sa naissance au XXe siècle à Lahore (sans date précise), ses études à l'Université de Stockholm (sous la direction d'Ansar Fayyazuddin pour sa thèse de doctorat), son poste à la LUMS et son roman de novembre 2014. L'article ne contient aucune information religieuse."
