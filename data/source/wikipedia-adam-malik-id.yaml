summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن آدم مالك (1917–1984)؛ تُستخدم لوقائع الكيان فقط. سيرة تذكر مولده في بيماتانغسيانتار في 22 يوليو 1917، وصحافته، ودبلوماسيته، ووزارته للخارجية ونيابته للرئاسة ووفاته في باندونغ."
  en: "Indonesian Wikipedia article on Adam Malik (1917–1984); used for entity facts only. A biography giving his birth at Pematangsiantar on 22 July 1917, his journalism, his diplomacy, his foreign ministry and vice presidency, and his death at Bandung."
  es: "Artículo de la Wikipedia en indonesio sobre Adam Malik (1917-1984); utilizado únicamente para datos sobre la persona. Una biografía que detalla su nacimiento en Pematangsiantar el 22 de julio de 1917, su trayectoria periodística, su diplomacia, su ministerio de Asuntos Exteriores y su vicepresidencia, y su fallecimiento en Bandung."
  fr: "Article de Wikipédia indonésien sur Adam Malik (1917-1984); utilisé uniquement à des fins d’information sur l’entité. Biographie retraçant sa naissance à Pematangsiantar le 22 juillet 1917, sa carrière de journaliste, sa diplomatie, son ministère des Affaires étrangères et sa vice-présidence, ainsi que sa mort à Bandung."
  ur: "آدم ملک (1917–1984) پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 22 جولائی 1917 کو Pematangsiantar میں ان کی پیدائش، اس کی صحافت، اس کی سفارت کاری، اس کی وزارت خارجہ اور نائب صدارت، اور بنڈونگ میں ان کی موت کی سوانح حیات۔"
  tr: "Adam Malik (1917–1984) hakkında Endonezya Vikipedi makalesi; yalnızca varlık bilgileri için kullanılmıştır. Biyografi, 22 Temmuz 1917'de Pimatangsyantar'daki doğumunu, gazeteciliğini, diplomasisini, Dışişleri Bakanlığını, başkan yardımcılığını ve Bandung'daki ölümünden bahseder."
  id: "Artikel Wikipedia Indonesia tentang Adam Malik (1917–1984); hanya digunakan untuk fakta entitas. Biografi menyebutkan kelahirannya di Pimatangsyantar pada 22 Juli 1917, jurnalisme, diplomasi, Kementerian Luar Negeri, wakil presidennya, dan kematiannya di Bandung."
