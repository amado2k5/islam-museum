summary:
  ar: "مقالة ويكيبيديا الأردية عن مولوي غلام رسول عالمبوري؛ تعطي مولده سنة 1849 في عالم بور ووفاته في 5 آذار 1892 فيها، وتذكر أنه صار تلميذاً لصاحب السجادة ⁦(گدی نشین)⁩ عند خواجة نظام الدين أولياء وحصل على تعليم عالٍ."
  en: "The Urdu Wikipedia article on Maulvi Ghulam Rasul Alampuri; it gives his birth in 1849 at Alampur and his death there on 5 March 1892, and states that he became a student of the gaddi nashin (custodian of the seat) of Khwaja Nizamuddin Auliya and received advanced education."
  es: "El artículo de Wikipedia en urdu sobre Maulvi Ghulam Rasul Alampuri; indica que nació en 1849 en Alampur y murió allí el 5 de marzo de 1892, y afirma que se convirtió en estudiante del gaddi nashin (custodio del asiento) de Khwaja Nizamuddin Auliya y recibió educación avanzada."
  fr: "L'article de Wikipédia en ourdou sur Maulvi Ghulam Rasul Alampuri; il indique sa naissance en 1849 à Alampur et sa mort au même endroit le 5 mars 1892, et précise qu'il devint l'élève du gaddi nashin (gardien du siège) de Khwaja Nizamuddin Auliya et reçut une éducation avancée."
