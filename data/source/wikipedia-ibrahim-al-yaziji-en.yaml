  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم اليازجي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في بيروت ابنًا لناصيف اليازجي، وعمله في الصحافة، وترجمته الكتاب المقدس إلى العربية بتكليف من اليسوعيين (1876–1880)، وتأسيسه مجلة «الضياء» في القاهرة، ودعوته إلى هوية عربية علمانية تجمعها اللغة."
  en: "English Wikipedia article on Ibrahim al-Yaziji; used for entity facts only. It recounts his Beirut upbringing as the son of Nasif al-Yaziji, his journalism, his Jesuit-commissioned translation of the Bible into Arabic (1876–1880), his founding of the magazine Ad-Diya in Cairo, and his championing of a secular Arab identity bound by language."
