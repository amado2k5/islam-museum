reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his birth on 2 March 1847 in Beirut (citing Jurji Zaydan) and his death in 1906 in Cairo (infobox; year only). On religion it names no affiliation for him personally: it says his father Nasif was born into a Melkite Catholic family from Homs — family framing — and that the Jesuits instructed him to translate the Bible into Arabic between 1876 and 1880 (a commission, and the passage carries a citation-needed tag), and it quotes Yasir Suleiman on his advocacy of a secular Arab identity 'over religion'. Its categories make no religion filing for him."
