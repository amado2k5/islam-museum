summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم اليازجي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في بيروت ابنًا لناصيف اليازجي، وعمله في الصحافة، وترجمته الكتاب المقدس إلى العربية بتكليف من اليسوعيين (1876–1880)، وتأسيسه مجلة «الضياء» في القاهرة، ودعوته إلى هوية عربية علمانية تجمعها اللغة."
  en: "English Wikipedia article on Ibrahim al-Yaziji; used for entity facts only. It recounts his Beirut upbringing as the son of Nasif al-Yaziji, his journalism, his Jesuit-commissioned translation of the Bible into Arabic (1876–1880), his founding of the magazine Ad-Diya in Cairo, and his championing of a secular Arab identity bound by language."
  es: "Artículo de la Wikipedia en inglés sobre Ibrahim al-Yaziji; utilizado únicamente para datos sobre la persona. Relata su infancia en Beirut como hijo de Nasif al-Yaziji, su trayectoria periodística, su traducción de la Biblia al árabe por encargo de los jesuitas (1876-1880), la fundación de la revista Ad-Diya en El Cairo y su defensa de una identidad árabe secular ligada al idioma."
  fr: "Article de Wikipédia en anglais sur Ibrahim al-Yaziji; utilisé uniquement à des fins d’information sur l’entité. Il relate son enfance à Beyrouth, fils de Nasif al-Yaziji, son travail de journaliste, sa traduction de la Bible en arabe commandée par les Jésuites (1876-1880), la fondation du magazine Ad-Diya au Caire et son engagement en faveur d’une identité arabe laïque fondée sur la langue."
  ur: "ابراہیم ال یازیجی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ناصف ال یازیجی کے بیٹے کے طور پر اس کی بیروت کی پرورش، اس کی صحافت، اس کی جیسوئٹ کی طرف سے بائبل کا عربی میں ترجمہ (1876-1880)، قاہرہ میں اس کے میگزین عاد-دیہ کی بنیاد، اور زبان سے پابند ایک سیکولر عرب شناخت کی اس کی چیمپیئننگ کا ذکر ہے۔"
  tr: "İbrahim el-Yazici hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Beyrut'ta Nasif al-Yaziji'nin oğlu olarak büyümesini, gazetecilik çalışmalarını, Cizvitler tarafından Arapçaya çevirisini (1876–1880), Kahire'de 'Al-Diya' dergisinin kuruluşunu ve dil ile birleşik laik bir Arap kimliği çağrısını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ibrahim al-Yaziji; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Beirut sebagai putra Nasif al-Yaziji, karyanya di bidang jurnalisme, terjemahan Alkitab ke dalam bahasa Arab yang dipesan oleh Jesuit (1876–1880), pendirian majalah 'Al-Diya' di Kairo, dan seruannya untuk identitas Arab sekuler yang bersatu oleh bahasa."
