label:
  ar: "«مساجد في الولايات المتحدة الأمريكية وكندا»، كتالوج معرض صور قدّم صوره عمر خالدي وديفيد دونيلون، والمقالة لعمر خالدي، سفارة الولايات المتحدة في ألمانيا (المعرض أول ما عُرض في فرانكفورت في أكتوبر 2006)"
  en: "Mosques in the United States of America and Canada, photo-exhibition catalogue, photographs provided by Omar Khalidi and David Donnellon, essay by Omar Khalidi, U.S. Embassy Germany (exhibition first shown in Frankfurt, October 2006)"
summary:
  ar: "كتالوج قصير لمعرض صور مساجد أمريكا الشمالية أعدته القنصلية الأمريكية في فرانكفورت، فيه مقالة لعمر خالدي مقتبسة من مقاله «تصميم المساجد في الولايات المتحدة» (Saudi Aramco World، نوفمبر/ديسمبر 2001) وتعليقات على صور نحو عشرين مسجدًا مصنفة في تصميم منقول ومكيّف ومبتكر."
  en: "A short catalogue of a photo exhibition of North American mosques put together by the U.S. Consulate General in Frankfurt, with an essay by Omar Khalidi adapted from his article 'Mosque Design in the United States' (Saudi Aramco World, November/December 2001) and captions to some twenty mosques grouped as imported, adapted and innovative designs."
