label:
  ar: "«مساجد في الولايات المتحدة الأمريكية وكندا»، كتالوج معرض صور قدّم صوره عمر خالدي وديفيد دونيلون، والمقالة لعمر خالدي، سفارة الولايات المتحدة في ألمانيا ⁦(المعرض أول ما عُرض في فرانكفورت في أكتوبر 2006)⁩"
  en: "Mosques in the United States of America and Canada, photo-exhibition catalogue, photographs provided by Omar Khalidi and David Donnellon, essay by Omar Khalidi, U.S. Embassy Germany (exhibition first shown in Frankfurt, October 2006)"
summary:
  ar: "كتالوج قصير لمعرض صور مساجد أمريكا الشمالية أعدته القنصلية الأمريكية في فرانكفورت، فيه مقالة لعمر خالدي مقتبسة من مقاله «تصميم المساجد في الولايات المتحدة» ⁦(Saudi Aramco World، نوفمبر/ديسمبر 2001)⁩ وتعليقات على صور نحو عشرين مسجدًا مصنفة في تصميم منقول ومكيّف ومبتكر."
  en: "A short catalogue of a photo exhibition of North American mosques put together by the U.S. Consulate General in Frankfurt, with an essay by Omar Khalidi adapted from his article 'Mosque Design in the United States' (Saudi Aramco World, November/December 2001) and captions to some twenty mosques grouped as imported, adapted and innovative designs."
  es: "Un breve catálogo de una exposición fotográfica sobre mezquitas norteamericanas, organizada por el Consulado General de Estados Unidos en Frankfurt, con un ensayo de Omar Khalidi adaptado de su artículo \"Diseño de mezquitas en Estados Unidos\" (Saudi Aramco World, noviembre/diciembre de 2001) y leyendas para una veintena de mezquitas agrupadas como diseños importados, adaptados e innovadores."
  fr: "Un court catalogue d'une exposition de photos de mosquées nord-américaines organisée par le consulat général des États-Unis à Francfort, avec un essai d'Omar Khalidi adapté de son article « Mosque Design in the United States » (Saudi Aramco World, novembre/décembre 2001) et des légendes pour une vingtaine de mosquées regroupées en modèles importés, adaptés et innovants."
  ur: "فرینکفرٹ میں امریکی قونصلیٹ جنرل کی طرف سے شمالی امریکہ کی مساجد کی تصویری نمائش کا ایک مختصر کیٹلاگ، عمر خالدی کے ایک مضمون کے ساتھ جو ان کے مضمون 'مساسک ڈیزائن ان دی ریاستہائے متحدہ' ⁦(سعودی آرامکو ورلڈ، نومبر/دسمبر 2001)⁩ سے اخذ کیا گیا ہے اور تقریباً بیس مساجد کے کیپشنز، جو کہ امپورٹڈ ڈیزائن کے طور پر گروپ کی گئی ہیں۔"
  tr: "Frankfurt'taki Amerikan Konsolosluğu tarafından hazırlanan Kuzey Amerika cami fotoğraf sergisinin kısa kataloğu; Omar Halidi'nin \"Cami Tasarımı Amerika Birleşik Devletleri'nde\" (Saudi Aramco World, Kasım/Aralık 2001) makalesinden alıntı yapan ve yaklaşık yirmi caminin aktarılmış, uyarlanmış ve yenilikçi tasarımlarla sınıflandırılmış fotoğraflarına dair yorumlar içermektedir."
  id: "Katalog singkat pameran foto masjid Amerika Utara yang disiapkan oleh Konsulat Amerika di Frankfurt, menampilkan artikel oleh Omar Khalidi yang dikutip dari artikelnya \"Mosque Design in the United States\" (Saudi Aramco World, November/Desember 2001) dan komentar pada foto sekitar dua puluh masjid yang diklasifikasikan dalam desain transfered, adapted, dan inovatif."
title: "Mosques in the United States of America and Canada"
