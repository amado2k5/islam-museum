summary:
  ar: "مقالة ويكيبيديا التركية عن إحسان شنوجاك؛ تُستخدم لوقائع الكيان فقط. تفصّل ميلاده في 5 يوليو 1974 في صامسون، ودراسته في ثانوية الإمام الخطيب بصامسون ثم في كلية الإلهيات بجامعة أوندوكوز مايس، وماجستيره ودكتوراهه في الفقه الإسلامي هناك، وعمله في رئاسة الشؤون الدينية، وتأسيسه مركز إفام للدراسات العلمية والفكرية وتدريسه فيه."
  en: "Turkish Wikipedia article on İhsan Şenocak; used for entity facts only. It details his birth on 5 July 1974 in Samsun, his education at Samsun Imam Hatip High School and then at Ondokuz Mayıs University's theology faculty, his master's and doctorate in Islamic law there, his service in the Presidency of Religious Affairs, and his founding of the İFAM research centre, where he teaches."
  es: "Artículo de la Wikipedia en turco sobre İhsan Şenocak; utilizado únicamente para datos sobre la persona. Detalla su nacimiento el 5 de julio de 1974 en Samsun, su educación en el instituto Samsun Imam Hatip y posteriormente en la facultad de teología de la Universidad Ondokuz Mayıs, donde obtuvo su máster y doctorado en derecho islámico, su servicio en la Presidencia de Asuntos Religiosos y la fundación del centro de investigación İFAM, donde imparte clases."
