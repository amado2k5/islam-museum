summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيصل بن عبد العزيز؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 14 أبريل 1906 في الرياض واغتياله في 25 مارس 1975 فيها، وسنواته نائبًا للملك في الحجاز ووزيرًا للخارجية، ووصايته واعتلاءه العرش في 2 نوفمبر 1964 بعد خلع سعود، وإلغاء الرق، وتأسيس رابطة العالم الإسلامي والجامعة الإسلامية بالمدينة، وحظر النفط سنة 1973 واغتياله على يد ابن أخيه. ويسميه متنها مسلمًا تقيًا ولا يذكر له مدرسة."
  en: "English Wikipedia article on Faisal of Saudi Arabia; used for entity facts only. It gives his birth on 14 April 1906 at Riyadh and his assassination on 25 March 1975 at Riyadh, his years as viceroy of Hejaz and foreign minister, his regency and accession on 2 November 1964 after Saud's deposition, the abolition of slavery, the founding of the Muslim World League and the Islamic University of Madinah, the 1973 oil embargo and his murder by his nephew. Its text calls him a pious Muslim and names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Faisal de Arabia Saudí; utilizado únicamente para datos sobre la persona. Menciona su nacimiento el 14 de abril de 1906 en Riad y su asesinato el 25 de marzo de 1975 en Riad, sus años como virrey del Hiyaz y ministro de Asuntos Exteriores, su regencia y ascenso al trono el 2 de noviembre de 1964 tras la deposición de Saud, la abolición de la esclavitud, la fundación de la Liga Mundial Musulmana y la Universidad Islámica de Medina, el embargo petrolero de 1973 y su asesinato a manos de su sobrino. El texto lo describe como un musulmán piadoso y no menciona ninguna escuela en su honor."
  fr: "L'article de Wikipédia en anglais consacré à Faisal d'Arabie saoudite, utilisé uniquement à des fins d'information, mentionne sa naissance le 14 avril 1906 à Riyad, son assassinat le 25 mars 1975 dans la même ville, ses années comme vice-roi du Hedjaz et ministre des Affaires étrangères, sa régence et son accession au trône le 2 novembre 1964 après la destitution de Saoud, l'abolition de l'esclavage, la fondation de la Ligue islamique mondiale et de l'Université islamique de Médine, l'embargo pétrolier de 1973 et son assassinat par son neveu. Le texte le décrit comme un musulman pieux et ne cite aucune école à son nom."
