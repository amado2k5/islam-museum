summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيصل بن عبد العزيز؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 14 أبريل 1906 في الرياض واغتياله في 25 مارس 1975 فيها، وسنواته نائبًا للملك في الحجاز ووزيرًا للخارجية، ووصايته واعتلاءه العرش في 2 نوفمبر 1964 بعد خلع سعود، وإلغاء الرق، وتأسيس رابطة العالم الإسلامي والجامعة الإسلامية بالمدينة، وحظر النفط سنة 1973 واغتياله على يد ابن أخيه. ويسميه متنها مسلمًا تقيًا ولا يذكر له مدرسة."
  en: "English Wikipedia article on Faisal of Saudi Arabia; used for entity facts only. It gives his birth on 14 April 1906 at Riyadh and his assassination on 25 March 1975 at Riyadh, his years as viceroy of Hejaz and foreign minister, his regency and accession on 2 November 1964 after Saud's deposition, the abolition of slavery, the founding of the Muslim World League and the Islamic University of Madinah, the 1973 oil embargo and his murder by his nephew. Its text calls him a pious Muslim and names no school for him."
