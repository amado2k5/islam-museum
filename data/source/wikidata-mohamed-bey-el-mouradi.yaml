summary:
  ar: "عنصر ويكي بيانات Q3318438 لمحمد باي المرادي؛ يُستخدم للمعرّف فقط. بيان ميلاده بدقة العقد فقط ⁦(خمسينيات القرن السابع عشر)⁩، وهو أصل رقم 1655 في صف الانتظار — تخمين نقطة وسطى لا يثبته أي نص، فلم يُبنَ سجل ميلاد."
  en: "Wikidata item Q3318438 for Mohamed Bey El Mouradi; used for the identifier only. Its birth statement is decade-precision only (the 1650s) — the origin of the queue row's 1655, a midpoint guess no text attests, so the person record builds no born block. Its death statement is day-precision, 14 October 1696, agreeing with the articles."
  es: "Elemento de Wikidata Q3318438 para Mohamed Bey El Mouradi; se usa solo para el identificador. Su declaración de nacimiento es solo de década (la década de 1650), origen de la fila de la cola de 1655, una estimación de punto medio que no está respaldada por ningún texto, por lo que el registro de la persona no crea un bloque de nacimiento. Su declaración de muerte es de día exacto, 14 de octubre de 1696, lo que coincide con los artículos."
  fr: "L'élément Wikidata Q3318438 concerne Mohamed Bey El Mouradi; il sert uniquement d'identifiant. Sa date de naissance est datée à la décennie près (années 1650) — à l'origine de la ligne de la file d'attente (1655), une estimation par rapport à la date moyenne non attestée par le texte, ce qui explique l'absence de bloc « naissance » dans la fiche. Sa date de décès est datée au jour près, le 14 octobre 1696, ce qui concorde avec les articles."
  ur: "ویکی ڈیٹا آئٹم Q3318438 محمد بے المورادی کے لیے؛ صرف شناخت کنندہ کے لیے استعمال کیا جاتا ہے۔ اس کا پیدائشی بیان صرف دہائی کی درستگی ہے ⁦(1650 کی دہائی)⁩ - قطار کی قطار کی اصل 1655، ایک وسط نقطہ کا اندازہ کسی متن کی تصدیق نہیں کرتا ہے، لہذا شخص کا ریکارڈ کوئی پیدائشی بلاک نہیں بناتا ہے۔ اس کی موت کا بیان دن کی درستگی، 14 اکتوبر 1696، مضامین سے متفق ہے۔"
  tr: "Wikidata öğesi Q3318438 Muhammad Bay Al-Muradi tarafından; sadece tanımlayıcı olarak kullanılmıştır. Doğum beyanı sadece on yıl doğruluğunda (1750'ler) olup, bekleme kuyruğundaki 1655 numarasıdır — doğum kaydı yapılmadığı için hiçbir metinle kanıtlanmayan bir orta tahmindir."
  id: "Item Wikidata Q3318438 oleh Muhammad Bay Al-Muradi; digunakan hanya untuk pengenal. Pernyataan kelahirannya hanya dengan akurasi dekade (1750-an), yaitu angka 1655 dalam antrean tunggu — tebakan titik tengah yang tidak dibuktikan oleh teks mana pun, karena tidak ada catatan kelahiran yang dibuat."
