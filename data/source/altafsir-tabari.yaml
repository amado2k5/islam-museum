summary:
  ar: "نص تفسير الطبري «جامع البيان» كما يعرضه موقع altafsir.com. قُرئ منه تفسير الآيات 14:28 إلى 114:6 ⁦(44 آية بلا تعليق مستقل في النص المحفوظ)⁩. هذه نسخة ويب من النص، وليست مسحا مصورا لصفحات مطبوعة مُتحقَّقا منها، ولذلك أرقام الصفحات اختيارية وغير مُثبتة."
  en: "The text of al-Tabari's Jami' al-Bayan as served by altafsir.com. The commentary for verses 14:28 to 114:6 was read from it (44 verses carry no separate comment in the saved text). It is a web copy, not a page-verified scan of a printed edition, so printed page numbers are optional and not established."
  ur: "altafsir.com پر پیش کیا گیا طبری کی «جامع البیان» کا متن۔ آیات 14:28 تا 114:6 کی تفسیر اس سے پڑھی گئی ⁦(44 آیات کے لیے محفوظ متن میں الگ تبصرہ نہیں)⁩۔ یہ ویب نسخہ ہے، کسی مطبوعہ نسخے کے صفحہ بہ صفحہ مصدقہ اسکین سے تصدیق شدہ نہیں، اس لیے صفحہ نمبر اختیاری ہیں اور متعین نہیں۔"
  es: "El texto del Jami' al-Bayan de al-Tabari tal como lo ofrece altafsir.com. Se leyó de él el comentario de los versículos 14:28 a 114:6 (44 versículos carecen de comentario propio en el texto guardado). Es una copia web, no un escaneo verificado página por página de una edición impresa; los números de página son opcionales y no están establecidos."
  fr: "Le texte du Jami' al-Bayan d'al-Tabari tel que proposé par altafsir.com. Le commentaire des versets 14:28 à 114:6 en a été lu (44 versets sont sans commentaire propre dans le texte sauvegardé). Il s'agit d'une copie web, non d'un scan vérifié page par page d'une édition imprimée ; les numéros de page sont facultatifs et non établis."
  tr: "altafsir.com'un sunduğu Taberi'nin Cami'u'l-Beyan metni. 14:28-114:6 ayetlerinin yorumu buradan okunmuştur (kayıtlı metinde 44 ayetin ayrı bir yorumu yoktur). Basılı bir baskının sayfa sayfa doğrulanmış taraması değil, web kopyasıdır; sayfa numaraları isteğe bağlıdır ve belirlenmemiştir."
  id: "Teks Jami' al-Bayan karya al-Tabari sebagaimana disajikan altafsir.com. Tafsir ayat 14:28 hingga 114:6 dibaca darinya (44 ayat tidak memiliki komentar tersendiri dalam teks tersimpan). Ini salinan web, bukan pemindaian tiap halaman dari edisi cetak yang telah diverifikasi; nomor halaman bersifat opsional dan belum ditetapkan."
