summary:
  ar: "نص تفسير الطبري «جامع البيان» كما يعرضه موقع altafsir.com. قُرئ منه في هذه الدفعة تفسير الآيات 14:28 إلى 14:52. هذه نسخة ويب من النص، وليست مسحا مصورا لصفحات مطبوعة مُتحقَّقا منها، ولذلك أرقام الصفحات اختيارية وغير مُثبتة."
  en: "The text of al-Tabari's Jami' al-Bayan as served by altafsir.com. This batch reads the commentary for verses 14:28 to 14:52. It is a web copy, not a page-verified scan of a printed edition, so printed page numbers are optional and not established."
  ur: "altafsir.com پر پیش کیا گیا طبری کی «جامع البیان» کا متن۔ اس دفعہ آیات 14:28 تا 14:52 کی تفسیر پڑھی گئی۔ یہ ویب نسخہ ہے، کسی مطبوعہ نسخے کے صفحہ بہ صفحہ مصدقہ اسکین سے تصدیق شدہ نہیں، اس لیے صفحہ نمبر اختیاری ہیں اور متعین نہیں۔"
  es: "El texto del Jami' al-Bayan de al-Tabari tal como lo ofrece altafsir.com. Este lote lee el comentario de los versículos 14:28 a 14:52. Es una copia web, no un escaneo verificado página por página de una edición impresa; los números de página son opcionales y no están establecidos."
  fr: "Le texte du Jami' al-Bayan d'al-Tabari tel que proposé par altafsir.com. Ce lot lit le commentaire des versets 14:28 à 14:52. Il s'agit d'une copie web, non d'un scan vérifié page par page d'une édition imprimée ; les numéros de page sont facultatifs et non établis."
  tr: "altafsir.com'un sunduğu Taberi'nin Cami'u'l-Beyan metni. Bu partide 14:28-14:52 ayetlerinin yorumu okunmuştur. Basılı bir baskının sayfa sayfa doğrulanmış taraması değil, web kopyasıdır; sayfa numaraları isteğe bağlıdır ve belirlenmemiştir."
  id: "Teks Jami' al-Bayan karya al-Tabari sebagaimana disajikan altafsir.com. Kelompok ini membaca tafsir ayat 14:28 sampai 14:52. Ini salinan web, bukan pemindaian tiap halaman dari edisi cetak yang telah diverifikasi; nomor halaman bersifat opsional dan belum ditetapkan."
