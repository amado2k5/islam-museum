summary:
  ar: "مقالة ويكيبيديا العربية عن الطيب بن محمد بن إبراهيم العقبي؛ تُستخدم لوقائع الكيان فقط. تنقل ترجمته الذاتية: مولده بسيدي عقبة ليلة النصف من شوال 1307هـ ⁦(نحو 1890)⁩ مع احتمال تأخره عامًا، وتعطي وفاته في 21 مايو 1961. صندوق معلوماتها يعطي مذهبه «مالكي» وعقيدته «أهل السنة والجماعة»."
  en: "Arabic Wikipedia article on Tayeb ibn Muhammad ibn Ibrahim el-Oqbi; used for entity facts only. It quotes his own autobiography: born at Sidi Okba on the night of mid-Shawwal 1307 AH (about 1890), possibly a year later, and gives his death as 21 May 1961. Its infobox gives his school as Maliki and his creed as Ahl al-Sunna wa-l-Jama'a."
  es: "Artículo de Wikipedia en árabe sobre Tayeb ibn Muhammad ibn Ibrahim el-Oqbi; utilizado únicamente para datos sobre la persona. Cita su propia autobiografía: nació en Sidi Okba la noche del mediodía de Shawwal de 1307 AH (alrededor de 1890), posiblemente un año después, y menciona su fallecimiento el 21 de mayo de 1961. Su ficha informativa indica que pertenecía a la escuela Maliki y a la religión Ahl al-Sunna wa-l-Jama'a."
  fr: "Article de Wikipédia en arabe sur Tayeb ibn Muhammad ibn Ibrahim el-Oqbi; utilisé uniquement pour les informations le concernant. Il cite son autobiographie: né à Sidi Okba dans la nuit du milieu du mois de Shawwal 1307 AH (environ 1890), peut-être un an plus tard, et date de son décès: 21 mai 1961. Son infobox indique qu’il appartenait à l’école malikite et à la religion sunnite (Ahl al-Sunna wa-l-Jama'a)."
  ur: "طیب بن محمد ابن ابراہیم العقبی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی اپنی سوانح عمری کا حوالہ دیا گیا ہے: نصف شوال 1307 ہجری ⁦(تقریباً 1890)⁩ کی رات سیدی اوکبہ میں پیدا ہوئے، ممکنہ طور پر ایک سال بعد، اور ان کی موت 21 مئی 1961 کو بتائی گئی۔ اس کے معلوماتی خانے میں ان کا مکتب مالکی اور اس کا عقیدہ اہل السنۃ والجماعۃ بتایا گیا ہے۔"
  tr: "Al-Tayyib bin Muhammed bin İbrahim El-Uqbi hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Otobiyografisinde şöyle denir: Sidi Uqba'da, 1307 Hicri Şavval ortası gecesi (yaklaşık 1890 H) doğmuştur, muhtemelen bir yıl gecikmeli olmuş ve ölümü 21 Mayıs 1961 olarak verilmiştir. Bilgi kutusunda düşünce okulu 'Maliki', inancı ise 'Ehl-el-Sünnet ve el-Cema'ah' olarak verilmiştir."
  id: "Artikel Wikipedia Arab tentang Al-Tayyib bin Muhammad bin Ibrahim Al-Uqbi; hanya digunakan untuk fakta entitas. Autobiografinya menyatakan: Ia lahir di Sidi Uqba pada malam pertengahan Shawwal 1307 H (sekitar 1890 H), kemungkinan terlambat setahun, dan kematiannya tercatat pada 21 Mei 1961. Infobox tersebut menyebutkan aliran pemikirannya sebagai 'Maliki' dan kepercayaannya sebagai 'Ahl al-Sunnah wa al-Jama'ah'."
