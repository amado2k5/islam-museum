  ar: "مقالة ويكيبيديا العربية عن الطيب بن محمد بن إبراهيم العقبي؛ تُستخدم لوقائع الكيان فقط. تنقل ترجمته الذاتية: مولده بسيدي عقبة ليلة النصف من شوال 1307هـ (نحو 1890) مع احتمال تأخره عامًا، وتعطي وفاته في 21 مايو 1961. صندوق معلوماتها يعطي مذهبه «مالكي» وعقيدته «أهل السنة والجماعة»."
  en: "Arabic Wikipedia article on Tayeb ibn Muhammad ibn Ibrahim el-Oqbi; used for entity facts only. It quotes his own autobiography: born at Sidi Okba on the night of mid-Shawwal 1307 AH (about 1890), possibly a year later, and gives his death as 21 May 1961. Its infobox gives his school as Maliki and his creed as Ahl al-Sunna wa-l-Jama'a."
