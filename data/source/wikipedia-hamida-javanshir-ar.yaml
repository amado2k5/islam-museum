summary:
  ar: "مقالة ويكيبيديا العربية عن حميدة جوانشير؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة: ميلادها في 19 يناير 1873 قرب آقجبدي ووفاتها في 6 فبراير 1955 في باكو، ونسبها إلى إبراهيم خليل خان، ونشاطها في حقوق المرأة، وزواجها الثاني من جليل محمد قلي زاده ومساعدتها له في «ملا نصر الدين»، وتأسيسها أول مدرسة في قريتها. لا تذكر شيئًا عن مذهبها."
  en: "Arabic Wikipedia article on Hamida Javanshir; used for entity facts only. A short article: her birth on 19 January 1873 near Aghjabadi and death on 6 February 1955 at Baku, her descent from Ibrahim Khalil Khan, her women's-rights activism, her second marriage to Jalil Mammadguluzadeh and her help with Molla Nasreddin, and her founding of the first school in her village. It makes no statement about her school of religion."
  es: "Artículo en árabe de la Wikipedia sobre Hamida Javanshir; utilizado únicamente para datos biográficos. Un breve artículo que describe su nacimiento el 19 de enero de 1873 cerca de Aghjabadi y su fallecimiento el 6 de febrero de 1955 en Bakú, su descendencia de Ibrahim Khalil Khan, su activismo en defensa de los derechos de la mujer, su segundo matrimonio con Jalil Mammadguluzadeh y su colaboración con Molla Nasreddin, así como la fundación de la primera escuela en su pueblo. No menciona su escuela religiosa."
  fr: "Article de Wikipédia en arabe sur Hamida Javanshir; utilisé uniquement pour des informations factuelles. Cet article concis relate sa naissance le 19 janvier 1873 près d’Aghjabadi et sa mort le 6 février 1955 à Bakou, sa descendance d’Ibrahim Khalil Khan, son engagement pour les droits des femmes, son second mariage avec Jalil Mammadguluzadeh et son soutien à Molla Nasreddin, ainsi que la fondation de la première école de son village. Il ne mentionne pas son école de religion."
  ur: "حمیدہ جوانشیر پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون: اس کی پیدائش 19 جنوری 1873 کو آغاآبادی کے قریب اور موت 6 فروری 1955 کو باکو میں، اس کی نسل ابراہیم خلیل خان سے، اس کی خواتین کے حقوق کی سرگرمی، جلیل ممد گلزادہ سے اس کی دوسری شادی اور مولا نصرالدین کے ساتھ اس کی مدد، اور اس کے گاؤں میں پہلے اسکول کی بنیاد۔ یہ اس کے مکتبہ فکر کے بارے میں کوئی بیان نہیں دیتا۔"
