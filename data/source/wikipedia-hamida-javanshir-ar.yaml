summary:
  ar: "مقالة ويكيبيديا العربية عن حميدة جوانشير؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة: ميلادها في 19 يناير 1873 قرب آقجبدي ووفاتها في 6 فبراير 1955 في باكو، ونسبها إلى إبراهيم خليل خان، ونشاطها في حقوق المرأة، وزواجها الثاني من جليل محمد قلي زاده ومساعدتها له في «ملا نصر الدين»، وتأسيسها أول مدرسة في قريتها. لا تذكر شيئًا عن مذهبها."
  en: "Arabic Wikipedia article on Hamida Javanshir; used for entity facts only. A short article: her birth on 19 January 1873 near Aghjabadi and death on 6 February 1955 at Baku, her descent from Ibrahim Khalil Khan, her women's-rights activism, her second marriage to Jalil Mammadguluzadeh and her help with Molla Nasreddin, and her founding of the first school in her village. It makes no statement about her school of religion."
