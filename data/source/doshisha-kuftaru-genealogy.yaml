summary:
  ar: "مقالة أكاديمية لكينيتشيرو تاكاو ⁦(كلية اللاهوت، جامعة دوشيشا)⁩ عن الأنساب الصوفية للشيخ أحمد كفتارو وشبكات النقشبندية في دمشق في القرنين التاسع عشر والعشرين؛ تُستخدم هنا لوقائع الكيان فقط. في عرضها لشيوخ أمين كفتارو الدمشقيين تصف بدر الدين الحسني ⁦(ت 1935/38)⁩ بأنه «عالم إسلامي من المدرسة المالكية وعضو في الطريقة القادرية الصوفية» — وهو وصف يخالف التراث العربي ⁦(شافعي شاذلي)⁩ في المذهب والطريقة معًا، لكنه يشهد مستقلًا بانتماء صوفي شخصي."
  en: "Academic article by Kenichiro Takao (Graduate School of Theology, Doshisha University) on the Sufi genealogy of Shaykh Ahmad Kuftaru and the Naqshbandi networks of nineteenth- and twentieth-century Damascus; used here for entity facts only. In its survey of Amin Kuftaru's Damascene teachers it describes Badr al-Din al-Hasani (d. 1935/38) as 'an Islamic scholar of the Maliki School and a member of the Qadiri Sufi order' — a description that conflicts with the Arabic biographical tradition (Shafi'i, Shadhili) on both the school and the order, while independently attesting a personal Sufi-order affiliation."
  es: "Artículo académico de Kenichiro Takao (Escuela de Graduados en Teología, Universidad de Doshisha) sobre la genealogía sufí de Shaykh Ahmad Kuftaru y las redes Naqshbandi de Damasco de los siglos XIX y XX; Se utiliza aquí únicamente para hechos de entidades. En su estudio sobre los maestros damascenos de Amin Kuftaru, describe a Badr al-Din al-Hasani (muerto en 1935/38) como \"un erudito islámico de la escuela Maliki y miembro de la orden sufí Qadiri\", una descripción que entra en conflicto con la tradición biográfica árabe (Shafi'i, Shadhili) tanto en la escuela como en la orden, aunque atestigua de forma independiente una afiliación personal a la orden sufí."
  fr: "Article académique de Kenichiro Takao (École supérieure de théologie, Université Doshisha) sur la généalogie soufie de Shaykh Ahmad Kuftaru et les réseaux Naqshbandi de Damas aux XIXe et XXe siècles; utilisé ici uniquement pour les faits d’entité. Dans son enquête sur les enseignants damascènes d'Amin Kuftaru, il décrit Badr al-Din al-Hasani (décédé en 1935/38) comme « un érudit islamique de l'école Maliki et membre de l'ordre soufi Qadiri » — une description qui entre en conflit avec la tradition biographique arabe (Shafi'i, Shadhili) sur l'école et l'ordre, tout en attestant de manière indépendante une affiliation personnelle à l'ordre soufi."
  ur: "شیخ احمد کفتارو کے صوفی نسب اور انیسویں اور بیسویں صدی کے دمشق کے نقشبندی نیٹ ورک پر کینیچیرو تاکاؤ ⁦(گریجویٹ سکول آف تھیولوجی، دوشیشا یونیورسٹی)⁩ کا تعلیمی مضمون؛ یہاں صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ امین کفتارو کے دمشقی اساتذہ کے بارے میں اپنے سروے میں اس نے بدر الدین الحسنی ⁦(متوفی 1935/38)⁩ کو 'مالکی مکتب کے ایک اسلامی اسکالر اور قادری صوفی حکم کے رکن' کے طور پر بیان کیا ہے - ایک ایسی وضاحت جو عربی سوانح حیات کی روایت ⁦(شافعی، شاذیلی)⁩ سے متصادم ہے، جب کہ اسکول میں ذاتی طور پر صوفی حکم پر منحصر ہے۔ وابستگی"
  tr: "Kenichiro Takao'nun (Dushisha Üniversitesi İlahiyat Fakültesi) tarafından yazılmış akademik makale, Şeyh Ahmed Kaftaro'nun Sufi soy kütükleri ve Şam'daki 19. ve 20. yüzyıllarda Şam'daki Nakşibendi ağları üzerine bir makale; burada yalnızca varlığın gerçekleri için kullanılmıştır. Amin Kaftaru'nun Şam şeyhlerini sunan Badr al-Din al-Hasani (ö. 1935/38) onu \"Maliki mezhebinden bir İslam âlimi ve Kadiriyye Sufi tarikatının bir üyesi\" olarak tanımlar — bu tanım, hem okul hem de tarikat içindeki Arap geleneğine (Şafii Şaxili) aykırı olmakla birlikte, bağımsız olarak kişisel bir Sufi aidiyetini doğrular."
  id: "Sebuah artikel akademik oleh Kenichiro Takao (Fakultas Teologi, Universitas Dushisha) tentang silsilah Sufi Sheikh Ahmad Kaftaro dan jaringan Naqshbandi di Damaskus pada abad kesembilan belas dan kedua puluh; digunakan di sini hanya untuk fakta entitas tersebut. Dalam presentasinya tentang para sheikh Damaskus Amin Kaftaru, Badr al-Din al-Hasani (wafat 1935/38) menggambarkannya sebagai \"seorang ulama Islam dari mazhab Maliki dan anggota tarekat Sufi Qadiriyya\" — sebuah deskripsi yang bertentangan dengan tradisi Arab (Shafi'i Shadhili) baik di sekolah maupun ordo, namun secara independen membuktikan afiliasi pribadi dengan Sufi."
title: "Sufi Genealogy of Shaykh Ahmad Kuftaru: Damascene Networking of Naqshbandi Sufi Order in 19–20th Centuries"
