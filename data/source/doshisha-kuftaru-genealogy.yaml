summary:
  ar: "مقالة أكاديمية لكينيتشيرو تاكاو (كلية اللاهوت، جامعة دوشيشا) عن الأنساب الصوفية للشيخ أحمد كفتارو وشبكات النقشبندية في دمشق في القرنين التاسع عشر والعشرين؛ تُستخدم هنا لوقائع الكيان فقط. في عرضها لشيوخ أمين كفتارو الدمشقيين تصف بدر الدين الحسني (ت 1935/38) بأنه «عالم إسلامي من المدرسة المالكية وعضو في الطريقة القادرية الصوفية» — وهو وصف يخالف التراث العربي (شافعي شاذلي) في المذهب والطريقة معًا، لكنه يشهد مستقلًا بانتماء صوفي شخصي."
  en: "Academic article by Kenichiro Takao (Graduate School of Theology, Doshisha University) on the Sufi genealogy of Shaykh Ahmad Kuftaru and the Naqshbandi networks of nineteenth- and twentieth-century Damascus; used here for entity facts only. In its survey of Amin Kuftaru's Damascene teachers it describes Badr al-Din al-Hasani (d. 1935/38) as 'an Islamic scholar of the Maliki School and a member of the Qadiri Sufi order' — a description that conflicts with the Arabic biographical tradition (Shafi'i, Shadhili) on both the school and the order, while independently attesting a personal Sufi-order affiliation."
title: "Sufi Genealogy of Shaykh Ahmad Kuftaru: Damascene Networking of Naqshbandi Sufi Order in 19–20th Centuries"
