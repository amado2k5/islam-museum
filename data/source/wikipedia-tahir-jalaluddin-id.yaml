summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن طاهر جلال الدين؛ تُستخدم لوقائع الكيان فقط. تربط ميلاده بـ4 رمضان 1286هـ ⁦(8 كانون الأول 1869)⁩ ووفاته في كوالا كانغسار بـ22 ربيع الأول 1376هـ ⁦(26 تشرين الأول 1956)⁩، وتسمّي شيوخه في مكة، وتذكر أنه بعد الأزهر عاد إلى مكة وساعد ابن عمّه أحمد الخطيب في التدريس ولا سيما في الفلك، وتعدد أعماله. تضعه تصنيفاتها في «مذهب شافعي» لكن متنها لا يسمّي له مذهبًا."
  en: "Indonesian Wikipedia article on Tahir Jalaluddin; used for entity facts only. It pairs his birth with 4 Ramadan 1286 AH (8 December 1869) and his death at Kuala Kangsar with 22 Rabi' al-awwal 1376 AH (26 October 1956), names his Meccan teachers, records that after al-Azhar he returned to Mecca and helped his cousin Ahmad Khatib teach, above all astronomy, and lists his works. Its category filings place him under the Shafi'i school; its text names no school for him."
  es: "Artículo de la Wikipedia en indonesio sobre Tahir Jalaluddin; utilizado únicamente para datos sobre la persona. Establece su nacimiento el 4 de Ramadán de 1286 AH (8 de diciembre de 1869) y su muerte en Kuala Kangsar el 22 de Rabi' al-awwal de 1376 AH (26 de octubre de 1956), menciona a sus maestros de La Meca, registra que después de Al-Azhar regresó a La Meca y ayudó a su primo Ahmad Khatib a enseñar, sobre todo astronomía, y enumera sus obras. Según su clasificación, pertenece a la escuela Shafi'i; sin embargo, el texto no menciona ninguna escuela específica para él."
  fr: "Article de Wikipédia indonésien sur Tahir Jalaluddin; utilisé uniquement pour les informations le concernant. Il situe sa naissance au 4 Ramadan 1286 AH (8 décembre 1869) et sa mort à Kuala Kangsar au 22 Rabi' al-awwal 1376 AH (26 octobre 1956), mentionne ses maîtres mecquois, indique qu'après ses études à Al-Azhar, il retourna à La Mecque et aida son cousin Ahmad Khatib à enseigner, notamment l'astronomie, et énumère ses œuvres. Ses catégories le classent dans l'école shafi'ite; le texte ne mentionne aucune école à laquelle il serait rattaché."
  ur: "طاہر جلال الدین پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 4 رمضان 1286 ہجری ⁦(8 دسمبر 1869)⁩ اور ان کی وفات کوال کانگسر میں 22 ربیع الاول 1376 ہجری ⁦(26 اکتوبر 1956)⁩ کے ساتھ جوڑ دی گئی ہے، اس کے مکی اساتذہ کے نام درج ہیں، یہ ریکارڈ ہے کہ الازہر کے بعد وہ مکہ واپس آئے اور اپنے کزن احمد خطیبوں کو پڑھانے میں مدد کی۔ اس کے زمرے کی فائلنگ اسے شافعی مکتب کے تحت رکھتی ہے۔ اس کا متن اس کے لیے کسی اسکول کا نام نہیں رکھتا۔"
  tr: "Endonezya Vikipedi'sinde Tahir Celaleddin hakkında makale; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 4 Ramazan 1286 Hile (8 Aralık 1869) ve 22 Rabi'al-Awwal 1376 Hile (26 Ekim 1956) tarihinde Kuala Kangsar'da ölümüne bağlar ve öğretmenlerinin Mekke'deki isimlerini belirtir. Ezher'den sonra Mekke'ye döndüğünü ve kuzeni Ahmed Al-Khatib'e özellikle astronomi ve çeşitli eserlerinde öğretimde yardımcı olduğunu belirtir. Sınıflandırmaları onu 'Şafii okuluna' yerleştirir, ancak metinde bir düşünce okulu olarak adlandırılmaz."
  id: "Artikel Wikipedia Indonesia tentang Tahir Jalal al-Din; hanya digunakan untuk fakta entitas. Artikel ini mengaitkan kelahirannya dengan 4 Ramadan 1286 H (8 Desember 1869) dan kematiannya di Kuala Kangsar pada 22 Rabi al-Awwal 1376 H (26 Oktober 1956), serta menyebutkan guru-gurunya di Mekah. Disebutkan bahwa setelah Al-Azhar, ia kembali ke Mekah dan membantu sepupunya Ahmed Al-Khatib dalam mengajar, terutama dalam astronomi, dan berbagai karyanya. Klasifikasinya menempatkannya dalam 'mazhab Shafi'i,' tetapi teksnya tidak menyebutnya sebagai aliran pemikiran."
