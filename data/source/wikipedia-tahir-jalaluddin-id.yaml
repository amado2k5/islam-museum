summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن طاهر جلال الدين؛ تُستخدم لوقائع الكيان فقط. تربط ميلاده بـ4 رمضان 1286هـ (8 كانون الأول 1869) ووفاته في كوالا كانغسار بـ22 ربيع الأول 1376هـ (26 تشرين الأول 1956)، وتسمّي شيوخه في مكة، وتذكر أنه بعد الأزهر عاد إلى مكة وساعد ابن عمّه أحمد الخطيب في التدريس ولا سيما في الفلك، وتعدد أعماله. تضعه تصنيفاتها في «مذهب شافعي» لكن متنها لا يسمّي له مذهبًا."
  en: "Indonesian Wikipedia article on Tahir Jalaluddin; used for entity facts only. It pairs his birth with 4 Ramadan 1286 AH (8 December 1869) and his death at Kuala Kangsar with 22 Rabi' al-awwal 1376 AH (26 October 1956), names his Meccan teachers, records that after al-Azhar he returned to Mecca and helped his cousin Ahmad Khatib teach, above all astronomy, and lists his works. Its category filings place him under the Shafi'i school; its text names no school for him."
