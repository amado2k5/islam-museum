  id: "Entri untuk Ensiklopedia Palestina tentang Mughnam Elias Mughnem menggambarkannya sebagai pengacara Kristen Palestina dan aktivis politik, salah satu pendiri dan pejabat Partai Pertahanan Nasional, yang meninggal pada tahun 1945."
