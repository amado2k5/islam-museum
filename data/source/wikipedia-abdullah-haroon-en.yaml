summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سير عبد الله هارون (1872–1942)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في كراتشي سنة 1872 في أسرة ميمونية سندية، وبدايته عاملا لتصليح الدراجات ثم تاجر سكر لُقّب «ملك السكر»، ومسيرته في بلدية كراتشي والجمعية التشريعية المركزية، ورئاسته لجنة الخلافة في السند والرابطة الإسلامية الإقليمية، وتنظيمه مؤتمر الرابطة الإسلامية الأول في السند سنة 1938 وتأييده قرار لاهور، ووفاته في كراتشي في 27 أبريل 1942."
  en: "English Wikipedia article on Sir Abdullah Haroon (1872–1942); used for entity facts only. It recounts his birth at Karachi in 1872 into a Sindhi Memon family, his start as a bicycle-repair assistant and rise as the 'Sugar King', his Karachi Municipality and Central Legislative Assembly career, his presidency of the Sindh Khilafat Committee and the provincial Muslim League, his organising of the 1938 Sind Provincial Muslim League Conference and endorsement of the Lahore Resolution, and his death at Karachi on 27 April 1942."
  es: "Artículo de la Wikipedia en inglés sobre Sir Abdullah Haroon (1872-1942); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Karachi en 1872 en el seno de una familia Sindhi Memon, sus inicios como ayudante en la reparación de bicicletas y su ascenso como el \"Rey del Azúcar\", su trayectoria en el municipio de Karachi y la Asamblea Legislativa Central, su presidencia del Comité del Califato de Sindh y de la Liga Musulmana provincial, la organización de la Conferencia de la Liga Musulmana Provincial de Sindh de 1938 y su respaldo a la Resolución de Lahore, y su fallecimiento en Karachi el 27 de abril de 1942."
  fr: "Article de Wikipédia en anglais sur Sir Abdullah Haroon (1872-1942); utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Karachi en 1872 au sein d'une famille sindhie Memon, ses débuts comme aide-réparateur de bicyclettes et son ascension au rang de « roi du sucre », sa carrière à la municipalité de Karachi et à l'Assemblée législative centrale, sa présidence du Comité du Califat du Sind et de la Ligue musulmane provinciale, son organisation de la Conférence provinciale de la Ligue musulmane du Sind de 1938 et son soutien à la résolution de Lahore, et sa mort à Karachi le 27 avril 1942."
  ur: "سر عبداللہ ہارون (1872–1942) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1872 میں کراچی میں ایک سندھی میمن خاندان میں ان کی پیدائش، سائیکل کی مرمت کے اسسٹنٹ کے طور پر ان کی شروعات اور 'شوگر کنگ' کے طور پر عروج، ان کا کراچی میونسپلٹی اور مرکزی قانون ساز اسمبلی کا کیریئر، سندھ خلافت کمیٹی اور صوبائی مسلم لیگ کی صدارت، 1938 میں اس کی تنظیم سازی اور سندھ صوبہ پنجاب کی مسلم لیگ کے اختتام پر ان کی وفات کا ذکر ہے۔ کراچی 27 اپریل 1942۔"
