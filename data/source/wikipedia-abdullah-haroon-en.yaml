summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سير عبد الله هارون (1872–1942)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في كراتشي سنة 1872 في أسرة ميمونية سندية، وبدايته عاملا لتصليح الدراجات ثم تاجر سكر لُقّب «ملك السكر»، ومسيرته في بلدية كراتشي والجمعية التشريعية المركزية، ورئاسته لجنة الخلافة في السند والرابطة الإسلامية الإقليمية، وتنظيمه مؤتمر الرابطة الإسلامية الأول في السند سنة 1938 وتأييده قرار لاهور، ووفاته في كراتشي في 27 أبريل 1942."
  en: "English Wikipedia article on Sir Abdullah Haroon (1872–1942); used for entity facts only. It recounts his birth at Karachi in 1872 into a Sindhi Memon family, his start as a bicycle-repair assistant and rise as the 'Sugar King', his Karachi Municipality and Central Legislative Assembly career, his presidency of the Sindh Khilafat Committee and the provincial Muslim League, his organising of the 1938 Sind Provincial Muslim League Conference and endorsement of the Lahore Resolution, and his death at Karachi on 27 April 1942."
