summary:
  ar: "مدخل «قره‌گوز» في موسوعة TDV الإسلامية: مسرح الظل التركي التقليدي، ونظريات نشأته، وشهادة ابن إياس على العرض المملوكي أمام ياووز سلطان سليم عام 1517 ومجيء نحو ستمائة فنان مصري إلى إستانبول، وتحويل الصور إلى جلد شفاف مفصّل في القرن السابع عشر، وبنية العرض من أربعة أقسام، وشخصيتا قره‌گوز وحاجواد، وعمل الكاراغوزجي وحده مؤدياً ومخرجاً ومصمماً وقاصّاً للصور."
  en: "The TDV İslâm Ansiklopedisi entry on Karagöz, the Turkish shadow play: rival accounts of its origins, Ibn Iyas's report of the Mamluk shadow-player's performance before Selim I in 1517 and the six hundred Egyptian artists brought to Istanbul, the seventeenth-century turn to translucent jointed leather figures, the play's four-part structure, the Karagöz–Hacivat pair, and the karagözcü as a one-man actor, director, choreographer and figure-maker."
  ur: "TDV اسلام انسائیکلوپیڈیا کا «قرہ‌گوز» مدخل: روایتی ترک سایہ بازی؛ آغاز کے مختلف نظریات، ابن ایاس کی ۱۵۱۷ء کی مملوک رپورٹ اور سلطان سلیم کے سامنے مملوک فنکار کی نمائش، چھ سو مصری فنکاروں کا استنبول آنا، سترہویں صدی میں شفاف جڑے ہوئے چمڑے کے پتلے، کھیل کے چار حصے، قرہ‌گوز–حاجواد جوڑی، اور قرہ‌گوزچی کا اکیلا اداکار، ڈائریکٹر، کوریوگرافر اور پتلا ساز ہونا۔"
