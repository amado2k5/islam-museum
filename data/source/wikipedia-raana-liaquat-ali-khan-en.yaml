summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رعنا لياقت علي خان (1905–1990)؛ تعطي مولدها باسم شيلا إيرين بانت في ألمورا في 13 شباط 1905 ووفاتها في كراتشي في 13 حزيران 1990، وتذكر أنها اعتنقت الإسلام عند زواجها سنة 1932، وتروي مسيرتها سفيرةً وحاكمةً للسند."
  en: "The English Wikipedia article on Ra'ana Liaquat Ali Khan (1905–1990); it gives her birth as Sheila Irene Pant at Almora on 13 February 1905 and her death at Karachi on 13 June 1990, states that she converted to Islam at her marriage in 1932, and recounts her career as ambassador and as governor of Sindh."
  es: "El artículo de la Wikipedia en inglés sobre Ra'ana Liaquat Ali Khan (1905-1990) indica que nació como Sheila Irene Pant en Almora el 13 de febrero de 1905 y falleció en Karachi el 13 de junio de 1990, afirma que se convirtió al Islam al casarse en 1932 y relata su trayectoria como embajadora y gobernadora de Sindh."
  fr: "L'article de Wikipédia en anglais sur Ra'ana Liaquat Ali Khan (1905-1990); il indique sa naissance sous le nom de Sheila Irene Pant à Almora le 13 février 1905 et sa mort à Karachi le 13 juin 1990, précise qu'elle s'est convertie à l'islam lors de son mariage en 1932 et relate sa carrière d'ambassadrice et de gouverneure du Sindh."
  ur: "رانا لیاقت علی خان (1905–1990) پر انگریزی ویکیپیڈیا کا مضمون؛ اس نے 13 فروری 1905 کو الموڑہ میں شیلا آئرین پنت کے طور پر جنم لیا اور 13 جون 1990 کو کراچی میں ان کی موت ہوئی، بیان میں کہا گیا ہے کہ اس نے 1932 میں اپنی شادی کے وقت اسلام قبول کیا، اور بطور سفیر اور گورنر سندھ کے اپنے کیریئر کا ذکر کرتا ہے۔"
  tr: "Rana Liaquat Ali Khan (1905–1990) hakkında İngilizce Wikipedia makalesi; doğum adını 13 Şubat 1905'te Almora'da Sheila Irene Pant olarak ve 13 Haziran 1990'da Karaçi'de vefat ettiğini belirtmektedir. 1932'de evlendikten sonra İslam'a geçtiği ve Sindh'in büyükelçisi ve valisi olarak kariyerini anlatmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Rana Liaquat Ali Khan (1905–1990); mencantumkan nama lahirnya sebagai Sheila Irene Pant di Almora pada 13 Februari 1905, dan kematiannya di Karachi pada 13 Juni 1990. Artikel tersebut menyebutkan bahwa ia memeluk Islam setelah menikah pada tahun 1932, dan menceritakan kariernya sebagai duta besar dan gubernur Sindh."
