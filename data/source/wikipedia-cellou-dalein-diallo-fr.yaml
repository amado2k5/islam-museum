  ar: "مقالة ويكيبيديا الفرنسية عن سيلو دالين ديالو؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته الاقتصادية والوزارية ورئاسته الوزراء وقيادته المعارضة بالتوازي مع المقالة الإنجليزية. لا يذكر نصّها دينه؛ وصندوق معلوماتها يسمّي الإسلام دينا له، وهو عين أسرة الصناديق في المقالة الإنجليزية."
