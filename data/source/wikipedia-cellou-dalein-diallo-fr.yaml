summary:
  ar: "مقالة ويكيبيديا الفرنسية عن سيلو دالين ديالو؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته الاقتصادية والوزارية ورئاسته الوزراء وقيادته المعارضة بالتوازي مع المقالة الإنجليزية. لا يذكر نصّها دينه؛ وصندوق معلوماتها يسمّي الإسلام دينا له، وهو عين أسرة الصناديق في المقالة الإنجليزية."
  en: "French Wikipedia article on Cellou Dalein Diallo; used for entity facts only. It recounts his economic and ministerial career, his premiership and his opposition leadership, in parallel with the English article. Its text says nothing about his religion; its infobox names Islam as his religion — the same infobox family as the English article's custom field."
  es: "Artículo de la Wikipedia en francés sobre Cellou Dalein Diallo; utilizado únicamente para datos sobre la persona. Relata su trayectoria económica y ministerial, su mandato como primer ministro y su liderazgo en la oposición, en paralelo con el artículo en inglés. Su texto no menciona su religión; su ficha informativa la identifica como islam, perteneciente a la misma familia de fichas informativas que el campo personalizado del artículo en inglés."
  fr: "Article Wikipédia en français sur Cellou Dalein Diallo; utilisé uniquement pour les informations sur l'entité. Il retrace sa carrière économique et ministérielle, son mandat de Premier ministre et son rôle de chef de l'opposition, en parallèle avec l'article en anglais. Son texte ne mentionne pas sa religion; son infobox indique que c'est l'islam – de la même famille que le champ personnalisé de l'article en anglais."
  ur: "Cellou Dalein Diallo پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انگریزی مضمون کے متوازی طور پر ان کے معاشی اور وزارتی کیریئر، ان کی وزارت عظمیٰ اور ان کی اپوزیشن قیادت کا ذکر کرتا ہے۔ اس کا متن اس کے مذہب کے بارے میں کچھ نہیں کہتا۔ اس کا انفو باکس اسلام کو اپنے مذہب کا نام دیتا ہے - وہی انفو باکس فیملی جو انگریزی آرٹیکل کے کسٹم فیلڈ کے طور پر ہے۔"
