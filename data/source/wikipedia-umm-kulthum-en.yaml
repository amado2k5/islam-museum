reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A long, heavily referenced article, read in full on 25 October 2026. Its lead gives her name as Fatima Ibrahim es-Sayyid el-Beltagi and her dates as 4 May 1904 – 3 February 1975, while the museum follows the 31 December 1898 date of the Arabic article and Wikidata's first claim — the conflict is recorded in the person record, not resolved. Covers: her birth at Tamay al-Zahayra in the Dakahlia Governorate to Ibrahim, a rural imam and muezzin, and Fatmah el-Maleegi; her memorisation of the Qur'an at the village kuttab and her childhood singing of religious hymns in boy's dress with her father's ensemble; the move to Cairo in 1923; Ahmed Rami's 137 songs for her and her composers al-Qasabgi, Zakaria Ahmed, Riad el-Sunbati, Mohamed Abdel Wahab (first collaboration 'Inta Omri', around 1965) and Baligh Hamdi; the first-Thursday monthly radio concerts from 1934 for some forty years; her six films (1936–1947); 'Wallahi Zaman Ya Silahi' as Egypt's national anthem 1960–1979; the post-1967 'Art for the War Effort' fundraising concerts; Graves' disease, her 1953 surgery in the United States and the trademark sunglasses; her 1954 marriage to her physician Dr Hasan al-Hifnawi; death in Cairo on 3 February 1975 of kidney failure, a funeral of some four million mourners, and burial in a mausoleum in the City of the Dead near the tomb of Imam al-Shafi'i; the Umm Kulthum Museum opened in 2001 at the Manesterly Palace, Cairo; and her standing, including Rolling Stone's 2023 ranking of her at 61 among the 200 greatest singers."
