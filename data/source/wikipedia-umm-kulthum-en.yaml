  ar: "مقالة ويكيبيديا الإنجليزية عن أم كلثوم؛ تُستخدم لوقائع الكيان فقط. توثّق نشأتها في طمي الزهايرة، وانتقالها إلى القاهرة سنة 1923، وحفلاتها الإذاعية الشهرية، وأفلامها الستة، ووفاتها في القاهرة سنة 1975."
  en: "English Wikipedia article on Umm Kulthum; used for entity facts only. It records her upbringing at Tamay al-Zahayra, her move to Cairo in 1923, her monthly radio concerts, her six films, and her death in Cairo in 1975."
  es: "Artículo de la Wikipedia en inglés sobre Umm Kulthum; se utiliza únicamente para obtener información sobre la persona. En él se narra su infancia en Tamay al-Zahayra, su traslado a El Cairo en 1923, sus conciertos mensuales por radio, sus seis películas y su fallecimiento en El Cairo en 1975."
  fr: "Article de Wikipédia en anglais sur Oum Kalthoum; utilisé uniquement pour des informations sur la personne. Il relate son enfance à Tamay al-Zahayra, son installation au Caire en 1923, ses concerts radiophoniques mensuels, ses six films et sa mort au Caire en 1975."
  ur: "ام کلثوم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں تما الزہائرہ میں اس کی پرورش، 1923 میں اس کا قاہرہ منتقل ہونا، اس کے ماہانہ ریڈیو کنسرٹس، اس کی چھ فلمیں، اور 1975 میں قاہرہ میں اس کی موت ریکارڈ کی گئی ہے۔"
