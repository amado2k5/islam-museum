  id: "Artikel Wikipedia bahasa Inggris tentang um Kulthum hanya digunakan untuk peristiwa entitas tersebut. Artikel ini mendokumentasikan masa kecilnya di lumpur Zahaira, kepindahannya ke Kairo pada tahun 1923, konser radio bulanannya, enam filmnya, dan kematiannya di Kairo pada tahun 1975."
