summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عناية الله خان المشرقي (1888–1963)؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في أمريتسار، ودراسته في كرايستس كوليدج بكمبريدج، وكتابه «تذكرة» وترشيحه لجائزة نوبل، وتأسيسه حركة الخاكسار سنة 1930، وسجنه المتكرر، ووفاته في لاهور في 27 أغسطس 1963."
  en: "English Wikipedia article on Inayatullah Khan Mashriqi (1888–1963); used for entity facts only. It recounts his Amritsar upbringing, his studies at Christ's College, Cambridge, his book Tazkirah and its Nobel Prize nomination, his founding of the Khaksar movement around 1930, his repeated imprisonments, and his death at Lahore on 27 August 1963."
  es: "Artículo de la Wikipedia en inglés sobre Inayatullah Khan Mashriqi (1888-1963); utilizado únicamente para datos sobre la persona. Relata su infancia en Amritsar, sus estudios en el Christ's College de Cambridge, su libro Tazkirah y su nominación al Premio Nobel, la fundación del movimiento Khaksar alrededor de 1930, sus repetidos encarcelamientos y su muerte en Lahore el 27 de agosto de 1963."
  fr: "Article de Wikipédia en anglais sur Inayatullah Khan Mashriqi (1888-1963); utilisé uniquement à des fins d'information sur l'entité. Il relate son enfance à Amritsar, ses études au Christ's College de Cambridge, son livre Tazkirah et sa nomination au prix Nobel, la fondation du mouvement Khaksar vers 1930, ses emprisonnements répétés et sa mort à Lahore le 27 août 1963."
  ur: "عنایت اللہ خان مشرقی (1888-1963) پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی امرتسر کی پرورش، کرائسٹ کالج، کیمبرج میں ان کی تعلیم، ان کی کتاب تذکرہ اور اس کے نوبل انعام کی نامزدگی، 1930 کے آس پاس خاکسار تحریک کی بنیاد، ان کی بار بار قید اور 27 اگست 1963 کو لاہور میں ان کی موت کا ذکر ہے۔"
  tr: "İnayatullah Han el-Meşriqi (1888–1963) hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kitap, Amritsar'daki yetiştirilme sürecini, Christ's College Cumbridge'deki eğitimini, \"Ticket\" adlı kitabını ve Nobel Ödülü'ne adaylığını, 1930'da Haksar hareketinin kuruluşunu, tekrar tekrar hapsedilmesini ve 27 Ağustos 1963'te Lahor'da ölmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Inayatullah Khan al-Mashriqi (1888–1963); digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Amritsar, studinya di Christ's College Cumbridge, bukunya \"Ticket\" dan nominasi Hadiah Nobelnya, pendirian gerakan Khaksar pada tahun 1930, penahanan berulang kalinya, dan kematiannya di Lahore pada 27 Agustus 1963."
