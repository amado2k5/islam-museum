  ar: "مقالة ويكيبيديا الإنجليزية عن عناية الله خان المشرقي (1888–1963)؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في أمريتسار، ودراسته في كرايستس كوليدج بكمبريدج، وكتابه «تذكرة» وترشيحه لجائزة نوبل، وتأسيسه حركة الخاكسار سنة 1930، وسجنه المتكرر، ووفاته في لاهور في 27 أغسطس 1963."
  en: "English Wikipedia article on Inayatullah Khan Mashriqi (1888–1963); used for entity facts only. It recounts his Amritsar upbringing, his studies at Christ's College, Cambridge, his book Tazkirah and its Nobel Prize nomination, his founding of the Khaksar movement around 1930, his repeated imprisonments, and his death at Lahore on 27 August 1963."
