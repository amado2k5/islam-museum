summary:
  ar: "نسخة مصورة من حاشية أبي الحسن السندي على «سنن النسائي»، في 148 صفحة مسحاً، وقد قرئ منها الغلاف الأول والمقدمة؛ والمسح ضعيف الجودة فلا تُقرأ منه إلا أجزاء يسيرة بيقين."
  en: "A photographed copy of Abu al-Hasan al-Sindi's gloss on the Sunan of al-Nasa'i, 148 scanned pages. Only the first cover and the introduction were read; the scan is of poor quality, so only short parts can be read with certainty."
