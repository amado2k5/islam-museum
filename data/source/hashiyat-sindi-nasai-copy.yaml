  fr: "Exemplaire photographié du commentaire d'Abu al-Hasan al-Sindi sur les Sunan d'al-Nasa'i, 148 pages numérisées. Seules la couverture et l'introduction ont été lues; la numérisation étant de mauvaise qualité, seules de courtes parties sont lisibles avec certitude."
