summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مراد باي الثالث؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده سنة 1680 واغتياله في 9 حزيران 1702 في صدرها، وإن جعل متنها ضربة إبراهيم الشريف له في 2 حزيران عند وادي الزرقة، وتذكر أنه ابن علي باي وتبنّي عمّيه محمد ورمضان له وانتخابه باياً في 16 آذار 1699."
  en: "English Wikipedia article on Murad III Bey; used for entity facts only. Its lead gives his birth in 1680 and assassination on 9 June 1702, but its narrative dates Ibrahim Sharif's shot at Wadi Zarka to 2 June 1702 — an internal split preserved in the person record's debated died block. It gives his father Ali Bey, his adoption by his uncles Muhammad and Ramadan Bey, his election as bey on 16 March 1699, his purges and the nickname Murad Bu Bala."
