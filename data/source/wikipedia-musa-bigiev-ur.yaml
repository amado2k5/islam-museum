summary:
  ar: "مقالة ويكيبيديا الأردية عن موسى بيغي (جار الله)؛ تُستخدم لوقائع الكيان فقط. يعطي صدرها مولده في 24 سبتمبر 1873، بينما يعطي قسم حياتها 24 سبتمبر 1874 في روستوف، وأبوه من قرية كيكينو في بينزا، وهما قراءتان أخريان في تاريخ مولده المتنازع عليه. وتصفه بأنه شيخ الإسلام في روسيا قبل ثورة أكتوبر، وتتناول تعليمه في قازان وبخارى وسمرقند ومكة والمدينة والقاهرة حيث درس على محمد بخيت المطيعي. ولا تسمي له مدرسة."
  en: "Urdu Wikipedia article on Musa Bigiev (Jarullah); used for entity facts only. Its lead gives his birth as 24 September 1873, while its Life section gives 24 September 1874 at Rostov, with his father from the village of Kikino in Penza — two further readings in the disputed birth date. It calls him Shaykh al-Islam of Russia before the October Revolution and covers his education in Kazan, Bukhara, Samarkand, Mecca, Medina and Cairo, where he studied under Muhammad Bakhit al-Muti'i. It names no school for him."
