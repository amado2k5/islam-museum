summary:
  ar: "مقالة ويكيبيديا الأردية عن موسى بيغي ⁦(جار الله)⁩؛ تُستخدم لوقائع الكيان فقط. يعطي صدرها مولده في 24 سبتمبر 1873، بينما يعطي قسم حياتها 24 سبتمبر 1874 في روستوف، وأبوه من قرية كيكينو في بينزا، وهما قراءتان أخريان في تاريخ مولده المتنازع عليه. وتصفه بأنه شيخ الإسلام في روسيا قبل ثورة أكتوبر، وتتناول تعليمه في قازان وبخارى وسمرقند ومكة والمدينة والقاهرة حيث درس على محمد بخيت المطيعي. ولا تسمي له مدرسة."
  en: "Urdu Wikipedia article on Musa Bigiev (Jarullah); used for entity facts only. Its lead gives his birth as 24 September 1873, while its Life section gives 24 September 1874 at Rostov, with his father from the village of Kikino in Penza — two further readings in the disputed birth date. It calls him Shaykh al-Islam of Russia before the October Revolution and covers his education in Kazan, Bukhara, Samarkand, Mecca, Medina and Cairo, where he studied under Muhammad Bakhit al-Muti'i. It names no school for him."
  es: "Artículo de Wikipedia en urdu sobre Musa Bigiev (Jarullah); utilizado únicamente para datos sobre la persona. Su introducción indica que nació el 24 de septiembre de 1873, mientras que su sección de Vida menciona el 24 de septiembre de 1874 en Rostov, con su padre originario del pueblo de Kikino en Penza; dos lecturas adicionales en la controvertida fecha de nacimiento. Lo denomina Shaykh al-Islam de Rusia antes de la Revolución de Octubre y abarca su educación en Kazán, Bujará, Samarcanda, La Meca, Medina y El Cairo, donde estudió con Muhammad Bakhit al-Muti'i. No menciona ninguna escuela a la que pertenezca."
  fr: "L'article de Wikipédia en ourdou sur Musa Bigiev (Jarullah) est utilisé uniquement pour les informations le concernant. Son introduction indique sa naissance le 24 septembre 1873, tandis que sa biographie mentionne le 24 septembre 1874 à Rostov, son père étant originaire du village de Kikino, dans la province de Penza – deux autres dates de naissance contestées. L'article le qualifie de Cheikh al-Islam de Russie avant la Révolution d'Octobre et relate ses études à Kazan, Boukhara, Samarcande, La Mecque, Médine et Le Caire, où il étudia auprès de Muhammad Bakhit al-Muti'i. Aucune école n'est mentionnée."
  ur: "اردو ویکیپیڈیا مضمون موسیٰ بگئیف ⁦(جار اللہ)⁩ پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ اس کی پیدائش 24 ستمبر 1873 کے طور پر کرتا ہے، جبکہ اس کا لائف سیکشن 24 ستمبر 1874 کو روسٹو میں، اس کے والد کے ساتھ Penza کے Kikino گاؤں سے دیتا ہے - متنازعہ تاریخ پیدائش میں دو مزید ریڈنگز۔ یہ اسے اکتوبر انقلاب سے پہلے روس کا شیخ الاسلام کہتا ہے اور اس کی تعلیم کازان، بخارا، سمرقند، مکہ، مدینہ اور قاہرہ میں شامل ہے، جہاں اس نے محمد بخیت المطیعی سے تعلیم حاصل کی۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
