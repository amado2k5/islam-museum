reliability_note: "Read in the museum's session on 20 November 2026. It says the author's own preface explains the title (the book holds more words, mujmal), that the date of composition, like that of the Maqayis, is not known with certainty; lists the early authorities the preface names (al-Khalil, al-Kisa'i, Abu Amr al-Shaybani, al-Farra', Abu Ubayda, al-Asma'i, Abu Zayd al-Ansari, Abu Ubayd, Ibn Durayd) without citing them in the entries; says Ibn Faris, like his contemporary al-Jawhari, kept only common sound words; and describes the arrangement: alphabetical by first radical and, for the first time in a dictionary, also by the second and third; 28 books by letter, each in three parts (biliteral, triliteral, longer); weak words given under both their roots and their changed forms. Used for entity facts only."
