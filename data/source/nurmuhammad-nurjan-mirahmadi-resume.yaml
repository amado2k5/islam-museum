summary:
  ar: "السيرة المهنية الرسمية للشيخ نورجان مير أحمدي على موقعه NurMuhammad.com: مرشد روحي للطريقة النقشبندية الصوفية منذ 1995، مؤسس جمعية مراكز التأمل الصوفي في فانكوفر (2007)، حاصل على إجازات مكتوبة من محمد ناظم الحقاني ومحمد هشام قباني ومحمد عادل الرباني، مؤسس جمعية فاطمة الزهراء الخيرية، ومقدّم برنامج Divine Love التلفزيوني، وله مؤلفات منشورة."
  en: "Shaykh Nurjan Mirahmadi's official resume on his website NurMuhammad.com: a spiritual guide of the Naqshbandi Sufi Order since 1995, founder of the Sufi Meditation Centers Society in Vancouver (2007), holder of written ijaza from Muhammad Nazim al-Haqqani, Muhammad Hisham Kabbani and Muhammad Adil ar-Rabbani, founder of the Fatima Zahra Helping Hand charity, host of the Divine Love television series, and author of published books."
