reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Richardson as born on 26 November 1965 in Philadelphia and died on 24 July 2020; raised in Philadelphia, jailed as a teenager, a head trainer at the Concrete Jungle gym who worked under Bouie Fisher; trainer of Bernard Hopkins, Shane Mosley, Steve Cunningham and Karl Dargan; the trainer who caught Antonio Margarito's plaster knuckle pads before the Mosley fight in January 2009, leading to Margarito's one-year suspension; and a stroke survivor (2007). Its only statement of his religion is in the career section: 'A devout Muslim, Richardson was often acknowledged as \"Brother\" Naazim.' It names no school or order for him."
