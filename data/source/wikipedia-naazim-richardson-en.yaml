  ar: "مقالة ويكيبيديا الإنجليزية عن ناظم ريتشاردسون؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته مدرّبا لبرنارد هوبكينز وشين موزلي، وكشفه لفائف يد أنطونيو مارغاريتو المحشوة بالجص سنة 2009، وتصفه بأنه مسلم متدين يُعرف بـ«الأخ ناظم»."
