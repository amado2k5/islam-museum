summary:
  ar: "مقالة ويكيبيديا العربية عن نيكولا أنيلكا؛ تُستخدم لوقائع الكيان فقط. مقالة أقصر تغطي ميلاده سنة 1979 في لي شيناي ومسيرته مع الأندية، وتروي اعتناقه الإسلام وانتقاله إلى فنربخشة حيث ازداد تعلقه بالإسلام."
  en: "Arabic Wikipedia article on Nicolas Anelka; used for entity facts only. A shorter article covering his 1979 Le Chesnay birth, his club career, and recounting his embrace of Islam and his move to Fenerbahçe, where his attachment to Islam deepened."
  es: "Artículo en árabe de la Wikipedia sobre Nicolas Anelka; utilizado únicamente para datos sobre la persona. Un artículo más breve que abarca su nacimiento en Le Chesnay en 1979, su trayectoria en clubes y su conversión al islam, así como su fichaje por el Fenerbahçe, donde su fe se consolidó."
  fr: "Article de Wikipédia en arabe sur Nicolas Anelka; utilisé uniquement pour les informations le concernant. Un article plus court relate sa naissance au Chesnay en 1979, sa carrière en club, sa conversion à l’islam et son arrivée à Fenerbahçe, où son attachement à cette religion s’est approfondi."
  ur: "نکولس انیلکا پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون جس میں ان کی 1979 کی لی چیسنے کی پیدائش، اس کے کلب کیرئیر، اور اس کے اسلام قبول کرنے اور فینرباہ کے جانے کے بارے میں بتایا گیا ہے، جہاں اسلام سے اس کا لگاؤ مزید گہرا ہوا ہے۔"
  tr: "Nikola Anelka hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1979'da Les Cheneys'te doğumunu ve kulüp kariyerini konu alan kısa bir makale, İslam'a geçişini ve İslam'a olan bağlılığının arttığı Fenerbahçe'ye taşınmasını anlatmaktadır."
  id: "Artikel Wikipedia bahasa Arab tentang Nikola Anelka; digunakan hanya untuk fakta entitas. Artikel yang lebih singkat membahas kelahirannya pada tahun 1979 di Les Cheneys dan karier klubnya, menceritakan konversinya ke Islam dan kepindahannya ke Fenerbahçe di mana keterikatannya pada Islam meningkat."
