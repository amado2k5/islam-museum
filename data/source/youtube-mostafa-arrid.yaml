reliability_note: "The author's own channel: a primary source for his identity, his self-description and his output, not independent corroboration of biography. The channel page and About description, read directly on 26 October 2026, name the channel 'Ishraqat Nafsiyya / D.Mostafa Arrid', describe it as 'the channel of purposeful psychological guidance' (qanat al-irshad al-nafsi al-hadif), and list among its keywords 'the objective school in social psychology'. Its videos are presented by Dr Mostafa Arrid, whom its own titles call 'the promising preacher' and 'the promising jurist'; the videos shown span about a decade, the most recent about two years before the check, and the most viewed, on the relation of istighfar (seeking forgiveness) to the human body, showed about 147,000 views. The subscriber count could not be read from the channel page at the check. It gives no birth date and names no school of law for him. Checked 26 October 2026."
