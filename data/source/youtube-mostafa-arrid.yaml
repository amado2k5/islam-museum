summary:
  ar: "قناة «إشراقات نفسية» على يوتيوب (@Dr.Arrid_Mostafa)، وهي قناة الدكتور مصطفى عريض، وتصف نفسها بأنها «قناة الإرشاد النفسي الهادف»، وتمزج في مقاطعها بين الإرشاد النفسي وموضوعات دينية، وتصفه عناوين مقاطعها بأنه داعية وفقيه."
  en: "The YouTube channel 'Ishraqat Nafsiyya' (Psychological Illuminations, @Dr.Arrid_Mostafa), run by Dr Mostafa Arrid, describing itself as 'the channel of purposeful psychological guidance'; its videos mix psychological counselling with religious subjects, and its own video titles describe him as a preacher and a jurist."
  es: "El canal de YouTube 'Ishraqat Nafsiyya' (Iluminaciones Psicológicas, @Dr.Arrid_Mostafa), dirigido por el Dr. Mostafa Arrid, se describe a sí mismo como 'el canal de orientación psicológica con propósito'; sus vídeos mezclan asesoramiento psicológico con temas religiosos, y los títulos de sus propios vídeos lo describen como predicador y jurista."
  fr: "La chaîne YouTube « Ishraqat Nafsiyya » (Illuminations psychologiques, @Dr.Arrid_Mostafa), gérée par le Dr Mostafa Arrid, se décrit comme « la chaîne de conseils psychologiques ciblés »; ses vidéos mêlent conseils psychologiques et sujets religieux, et ses propres titres le présentent comme un prédicateur et un juriste."
  ur: "یوٹیوب چینل 'اشراقات نفسیہ' ⁦(نفسیاتی روشنیاں، @Dr.Arrid_Mostafa)⁩، جسے ڈاکٹر مصطفیٰ اریڈ چلاتے ہیں، خود کو 'بامقصد نفسیاتی رہنمائی کا چینل' کے طور پر بیان کرتے ہوئے؛ اس کے ویڈیوز مذہبی مضامین کے ساتھ نفسیاتی مشاورت کو ملاتے ہیں، اور اس کے اپنے ویڈیو ٹائٹل اسے ایک مبلغ اور فقیہ کے طور پر بیان کرتے ہیں۔"
  tr: "YouTube'daki \"Psychological Radiance\" kanalı (@Dr.Arrid_Mostafa), Dr. Mostafa Arayed'in kanalı, kendisini \"amaçlı bir psikolojik danışmanlık kanalı\" olarak tanımlıyor; kliplerinde psikolojik danışmanlığı dini konularla harmanlıyor ve başlıklarında onu vaiz ve hukukçu olarak tanımlıyor."
  id: "Saluran \"Psychological Radiance\" di YouTube (@Dr.Arrid_Mostafa), yang merupakan saluran Dr. Mostafa Arayed, menggambarkan dirinya sebagai \"saluran konseling psikologis yang bertujuan,\" memadukan konseling psikologis dengan topik keagamaan dalam klipnya, menggambarkannya sebagai seorang pengkhotbah dan ahli hukum dalam judulnya."
