reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). Its birth values are three and conflicting — 20 August 1789, and the impossible years 1783 and 1782, against the English and Arabic articles' 26 August 1789 — and its death values carry 25 October 1833 first, agreeing with both articles, alongside stray values in December 1833, October 1833 and October 1834. Its birthplace is Amol, the district city, where the articles name the village of Nava; its death place is Mashhad. Its religion (P140) value is the single structured value 'Twelver Shiism'; structured data never settles faith, and it is not followed. The QID was grounded from the English article's own page property, the Arabic and Urdu articles agreeing. Item revision fetched live and re-asserted identical on a second query, 1 November 2026."
