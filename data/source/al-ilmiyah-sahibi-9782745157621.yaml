summary:
  ar: "صفحة الكتاب على موقع دار الكتب العلمية للطبعة نفسها، وهي بحسب الملخص البحثي تذكر محمد علي بيضون ناشراً. ذُكرت هذه الصفحة في ملخص بحثي قُدّم إلى المتحف وأجاز المؤسس استعماله في 21 نوفمبر 2026؛ ولم يفتح المتحف الصفحة نفسها."
  en: "The book page of Dar al-Kotob al-Ilmiyah for the same edition, which, according to the research summary, names Muhammad Ali Baydun as the publisher. The page was named in a research summary supplied to the museum and approved for use by the founder on 21 November 2026; the museum did not open it."
  ur: "اسی طبع کے لیے دار الکتب العلمیہ کا کتاب کا صفحہ، جو تحقیقی خلاصے کے مطابق محمد علی بیضون کو ناشر بتاتا ہے۔ اس صفحے کا ذکر عجائب گھر کو دیے گئے ایک تحقیقی خلاصے میں تھا جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی؛ عجائب گھر نے یہ صفحہ خود نہیں کھولا۔"
  fr: "La page du livre de Dar al-Kotob al-Ilmiyah pour la même édition, qui, selon le résumé de recherche, nomme Muhammad Ali Baydun comme éditeur commercial. La page est nommée dans un résumé de recherche remis au musée et approuvé pour usage par le fondateur le 21 novembre 2026 ; le musée ne l'a pas ouverte."
  es: "La página del libro de Dar al-Kotob al-Ilmiyah para la misma edición, que según el resumen de investigación nombra a Muhammad Ali Baydun como editor comercial. La página figura en un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026; el museo no la abrió."
