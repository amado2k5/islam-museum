summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نرجس محمدي ⁦(وُلدت في ٢١ نيسان ١٩٧٢ في زنجان)⁩، الناشطة الحقوقية الإيرانية وحائزة جائزة نوبل للسلام ٢٠٢٣؛ تذكر دراستها للفيزياء وبحث مجموعتها الطلابية في الشريعة الجديدة ودعوتها للديمقراطية العلمانية وصحافتها وعملها مع مركز شيرين عبادي واعتقالاتها المتكررة وحملتها ضد الحبس الانفرادي، دون أن تحسم انتماءً دينيًا لها."
  en: "English Wikipedia article on Narges Mohammadi (born 21 April 1972 in Zanjan), Iranian human-rights activist and 2023 Nobel Peace Prize laureate; it records her physics studies, her student group's exploration of neo-Shariatism and advocacy of secular democracy, her journalism, her work with Shirin Ebadi's Defenders of Human Rights Center, her repeated arrests and sentences and her campaign against solitary confinement, without settling a religious affiliation for her."
