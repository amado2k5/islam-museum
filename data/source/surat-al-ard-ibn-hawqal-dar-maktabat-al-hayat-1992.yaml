label:
  ar: "كتاب صورة الأرض لابن حوقل أبي القاسم النصيبي — منشورات دار مكتبة الحياة، بيروت، 1992م"
  en: "Ibn Hawqal (Abu al-Qasim al-Nasibi), Kitab Surat al-Ard — Dar Maktabat al-Hayat, Beirut, 1992"
summary:
  ar: "نشرة دار مكتبة الحياة ببيروت ⁦(1992م)⁩ لكتاب ابن حوقل في قسمين، تعيد نص طبعة ليدن، مع مقدمة الناشر، ثم مقدمة المؤلف، ثم «صورة الأرض» والأقاليم: ديار العرب، وبحر فارس، والمغرب، والأندلس، وصقلية، ومصر، والشام، وبحر الروم، والجزيرة، والعراق، وخوزستان، وفارس، وكرمان، والسند، وأرمينية وأذربيجان والران، والجبال، والديلم وطبرستان، وبحر الخزر، ومفازة خراسان وفارس، وسجستان، وخراسان، وما وراء النهر، وخاتمة الكتاب."
  en: "Dar Maktabat al-Hayat's Beirut edition (1992) of Ibn Hawqal's book in two parts, reproducing the Leiden text, with the publisher's preface, the author's introduction, then 'the image of the earth' and the regions: Arabia, the Persian Sea, the Maghrib, al-Andalus, Sicily, Egypt, Syria, the Mediterranean, the Jazira, Iraq, Khuzistan, Fars, Kirman, Sind, Armenia, Azerbaijan and Arran, the Jibal, Daylam and Tabaristan, the Caspian, the desert of Khurasan and Fars, Sijistan, Khurasan, Transoxiana, and the conclusion."
  es: "Edición de Beirut de Dar Maktabat al-Hayat (1992) del libro de Ibn Hawqal en dos partes, que reproduce el texto de Leiden, con el prefacio del editor, la introducción del autor, luego 'la imagen de la tierra' y las regiones: Arabia, el Mar Pérsico, el Magreb, al-Ándalus, Sicilia, Egipto, Siria, el Mediterráneo, el Jazira, Irak, Juzestán, Fars, Kirman, Sind, Armenia, Azerbaiyán y Arran, el Jibal, Daylam y Tabaristán, el Caspio, el desierto de Jorasán y Fars, Sijistán, Jorasán, Transoxiana y la conclusión."
  fr: "L'édition de Beyrouth (1992) de Dar Maktabat al-Hayat du livre d'Ibn Hawqal en deux parties, reproduisant le texte de Leiden, avec la préface de l'éditeur, l'introduction de l'auteur, puis « l'image de la terre » et les régions: l'Arabie, la mer Persique, le Maghreb, al-Andalus, la Sicile, l'Égypte, la Syrie, la Méditerranée, la Jazira, l'Irak, le Khuzistan, le Fars, le Kirman, le Sind, l'Arménie, l'Azerbaïdjan et Arran, le Jibal, le Daylam et le Tabaristan, la Caspienne, le désert du Khorasan et du Fars, le Sijistan, le Khorasan, la Transoxiane, et la conclusion."
  ur: "دار مکتبۃ الحیات کا بیروت ایڈیشن (1992) ابن حوقل کی کتاب کا دو حصوں میں، لیڈن متن کو دوبارہ پیش کرتے ہوئے، پبلشر کے دیباچے کے ساتھ، مصنف کا تعارف، پھر 'زمین کی تصویر' اور خطے: عرب، بحیرہ فارس، مغرب، مصر، الاندل، سیریا، سیریا، سیریا جزیرہ، عراق، خوزستان، فارس، کرمان، سندھ، آرمینیا، آذربائیجان اور آران، جبل، دیلام اور تبرستان، کیسپین، خراسان کا صحرا اور فارس، سجستان، خراسان، ٹرانسوکسیانا، اور اختتام۔"
  tr: "İbn Havkal'ın kitabının Beyrut'ta yayımlanan Dar Maktabat al-Hayat (1992) adlı eserinin iki bölüm halinde yayımlanması, Leiden baskısının metnini, yayınevinin girişini, ardından yazarın girişini, ardından \"Dünyanın Resmi\"ni ve bölgeleri yeniden üretmektedir: Arap toprakları, Basra Denizi, Magrip, Endülüs, Sicilya, Mısır, Şam, Roma Denizi, Cezire, Irak, Huzistan, Fars, Kirman, Sind, Ermenistan, Azerbaycan, Basra Körfezi, dağlar, Daylamlılar ve Tabaristan, Hazar Denizi, Horasan ve Fars dönemi, Sijistan, Horasan, Transoksiana ve kitabın sonu."
  id: "Penerbitan Dar Maktabat al-Hayat di Beirut (1992) dari buku Ibn Hawqal dalam dua bagian, mereproduksi teks edisi Leiden, dengan pengantar penerbit, kemudian pengantar penulis, kemudian \"Gambar Bumi,\" dan wilayah-wilayah: tanah Arab, Laut Persia, Maghreb, Andalusia, Sisilia, Mesir, Levant, Laut Romawi, Jazira, Irak, Khuzestan, Fars, Kerman, Sindh, Armenia, Azerbaijan, Teluk Persia, pegunungan, Daylamit dan Tabaristan, Laut Kaspia, fase Khorasan dan Persia, Sijistan, Khorasan, Transoxiana, dan penutup buku tersebut."
