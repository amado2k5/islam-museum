reliability_note: "Classical Arabic geography (author fl. 4th century AH), public domain; the publisher adds only a short preface. Copy used: harvest item geography/surat-ard-ibn-hawqal/surt-alardh (439 PDF pages, OCR text; a Bibliotheca Alexandrina copy holding both parts). Title pages PDF pp. 1–2, imprint p. 3 (1992), publisher's preface pp. 4–5, title with the alternative heading p. 6, author's introduction pp. 8–10, regions from p. 12 (Arabia p. 28, Persian Sea p. 51, Syria p. 158, Iraq p. 212, Khuzistan p. 229), contents pp. 437–438. The printed page numbers drift against the PDF because of unnumbered map plates (PDF 5 = printed 6, PDF 10 = printed 11, PDF 437 = printed 431), so ALL CITATIONS GIVE PDF PAGES. The publisher's statement that Ibn Hawqal took al-Istakhri's book and 'attributed it to himself' is the publisher's judgement, reported as such."
