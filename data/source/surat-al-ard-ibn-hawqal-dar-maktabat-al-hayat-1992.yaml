  en: "Ibn Hawqal (Abu al-Qasim al-Nasibi), Kitab Surat al-Ard — Dar Maktabat al-Hayat, Beirut, 1992"
summary:
  ar: "نشرة دار مكتبة الحياة ببيروت ⁦(1992م)⁩ لكتاب ابن حوقل في قسمين، تعيد نص طبعة ليدن، مع مقدمة الناشر، ثم مقدمة المؤلف، ثم «صورة الأرض» والأقاليم: ديار العرب، وبحر فارس، والمغرب، والأندلس، وصقلية، ومصر، والشام، وبحر الروم، والجزيرة، والعراق، وخوزستان، وفارس، وكرمان، والسند، وأرمينية وأذربيجان والران، والجبال، والديلم وطبرستان، وبحر الخزر، ومفازة خراسان وفارس، وسجستان، وخراسان، وما وراء النهر، وخاتمة الكتاب."
  en: "Dar Maktabat al-Hayat's Beirut edition (1992) of Ibn Hawqal's book in two parts, reproducing the Leiden text, with the publisher's preface, the author's introduction, then 'the image of the earth' and the regions: Arabia, the Persian Sea, the Maghrib, al-Andalus, Sicily, Egypt, Syria, the Mediterranean, the Jazira, Iraq, Khuzistan, Fars, Kirman, Sind, Armenia, Azerbaijan and Arran, the Jibal, Daylam and Tabaristan, the Caspian, the desert of Khurasan and Fars, Sijistan, Khurasan, Transoxiana, and the conclusion."
