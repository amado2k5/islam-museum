  ar: "مقالة ويكيبيديا الملايوية عن السلطان إدريس مرشد العزم شاه؛ تُستخدم لوقائع الكيان فقط. تقليد ملايوي أوسع يعطي ميلاده في قرية كوالا كيبوي بكمبار سنة 1849 وجلوسه في تموز 1887 بعد وفاة صهره سلطانًا ثامنًا وعشرين لفيرق، ومجلس الدربار الأول، ووفاته في 14 كانون الثاني 1916 ودفنه في المقبرة الملكية في بوكيت تشاندان بكوالا كانغسار. لا يحمل صندوق معلوماتها حقل ديانة."
  en: "Malay Wikipedia article on Sultan Idris Murshidul Azzam Shah; used for entity facts only. A fuller Malay tradition: it gives his birth at Kampung Kuala Keboi, Kampar, in 1849, his accession in July 1887 on the death of his father-in-law as the 28th Sultan of Perak, the first Durbar, and his death on 14 January 1916 and burial at the Bukit Chandan royal mausoleum, Kuala Kangsar. Its infobox carries no religion field."
