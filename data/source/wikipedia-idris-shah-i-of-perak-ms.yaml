summary:
  ar: "مقالة ويكيبيديا الملايوية عن السلطان إدريس مرشد العزم شاه؛ تُستخدم لوقائع الكيان فقط. تقليد ملايوي أوسع يعطي ميلاده في قرية كوالا كيبوي بكمبار سنة 1849 وجلوسه في تموز 1887 بعد وفاة صهره سلطانًا ثامنًا وعشرين لفيرق، ومجلس الدربار الأول، ووفاته في 14 كانون الثاني 1916 ودفنه في المقبرة الملكية في بوكيت تشاندان بكوالا كانغسار. لا يحمل صندوق معلوماتها حقل ديانة."
  en: "Malay Wikipedia article on Sultan Idris Murshidul Azzam Shah; used for entity facts only. A fuller Malay tradition: it gives his birth at Kampung Kuala Keboi, Kampar, in 1849, his accession in July 1887 on the death of his father-in-law as the 28th Sultan of Perak, the first Durbar, and his death on 14 January 1916 and burial at the Bukit Chandan royal mausoleum, Kuala Kangsar. Its infobox carries no religion field."
  es: "Artículo de Wikipedia en malayo sobre el sultán Idris Murshidul Azzam Shah; utilizado únicamente para datos sobre la entidad. Una tradición malaya más completa: indica su nacimiento en Kampung Kuala Keboi, Kampar, en 1849, su ascenso al trono en julio de 1887 tras la muerte de su suegro como el 28.º sultán de Perak, el primer Durbar, y su fallecimiento el 14 de enero de 1916 y su entierro en el mausoleo real de Bukit Chandan, Kuala Kangsar. Su ficha informativa no incluye información sobre religión."
  fr: "Article Wikipédia en malais sur le sultan Idris Murshidul Azzam Shah; utilisé uniquement pour les informations factuelles. Une tradition malaise plus complète indique sa naissance à Kampung Kuala Keboi, Kampar, en 1849, son accession au trône en juillet 1887 à la mort de son beau-père en tant que 28e sultan de Perak, premier Durbar, et sa mort le 14 janvier 1916 et son inhumation au mausolée royal de Bukit Chandan, à Kuala Kangsar. Son infobox ne comporte pas de champ « religion »."
  ur: "سلطان ادریس مرشد العزم شاہ پر مالے ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مکمل مالائی روایت: یہ 1849 میں کمپونگ کوالا کیبوئی، کمپار میں ان کی پیدائش، جولائی 1887 میں پیراک کے 28 ویں سلطان، پہلے دربار کے طور پر اپنے سسر کی موت پر، اور 14 جنوری 1916 کو ان کی موت اور بکیت چندن کے شاہی محل میں تدفین ہوئی۔ اس کے معلوماتی خانے میں کوئی مذہب نہیں ہے۔"
