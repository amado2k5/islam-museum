reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026, and its content checked against the recorded revision. It agrees with the English article on his birth at Dogondoutchi (Niger) on 30 August 1956, his Senegalese father posted there and his Nigerien mother, and the family's move to Rufisque, and adds: his childhood guitar-making with his cousins in a family where music was not recognised as a profession; after his father's death in 1970, two years at the Institut des arts de Dakar studying painting; his discovery on a television programme and rapid fame; Super Diamono and the 1984 split, with five albums to 1988, some of them with political texts; his film music and acting, including Camp de Thiaroye (1988, as the harmonica player, credited as Ismaila Lô) and Tableau ferraille (1996); the Barclay signing and the 1991 album Ismaël Lô with 'Tajabone'; Iso (1994) and the 'African Bob Dylan' nickname; Jammu Africa (1996), with the Kora Awards of 1996 for best male artist of Africa and best African video for the 'Jammu Africa' clip; the Legion of Honour in 2002; Sénégal (2006); and his performance at the Festival Gnaoua in Essaouira on 30 June 2017. The article states no religion for him."
