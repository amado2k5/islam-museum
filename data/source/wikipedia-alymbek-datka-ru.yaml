summary:
  ar: "مقالة ويكيبيديا الروسية عن أليمبك داتقا؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته حاكمًا لألاي ووزيرًا لخانية خوقند، وزواجه بقرمانجان سنة 1832، ومقتله في انقلاب قصر سنة 1862؛ وصندوق معلوماتها وحده يذكر دينه «إسلامًا سنيًا»."
  en: "Russian Wikipedia article on Alymbek Datka; used for entity facts only. It recounts his career as ruler of Alai and vizier of the Khanate of Kokand, his 1832 marriage to Kurmanjan, and his murder in a palace coup in 1862; its infobox alone gives his religion as Sunni Islam."
  es: "Artículo de la Wikipedia rusa sobre Alymbek Datka; utilizado únicamente para obtener información sobre la persona. Relata su trayectoria como gobernante de Alai y visir del Kanato de Kokand, su matrimonio con Kurmanjan en 1832 y su asesinato en un golpe de palacio en 1862; su ficha informativa indica que su religión era el islam sunita."
  fr: "Article de Wikipédia en russe sur Alymbek Datka; utilisé uniquement pour les informations sur l’entité. Il relate sa carrière de souverain d’Alai et de vizir du khanat de Kokand, son mariage avec Kurmanjan en 1832 et son assassinat lors d’un coup d’État en 1862; son infobox indique seulement qu’il était de confession sunnite."
  ur: "Alymbek Datka پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں الائی کے حکمران اور کوکند کے خانات کے وزیر کے طور پر اس کے کیریئر، کرمنجن سے اس کی 1832 کی شادی، اور 1862 میں محل کی بغاوت میں اس کے قتل کا ذکر ہے۔ اس کا انفو باکس صرف اس کا مذہب بطور سنی اسلام دیتا ہے۔"
