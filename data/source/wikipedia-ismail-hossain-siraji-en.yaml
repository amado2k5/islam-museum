reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The article rests chiefly on the Banglapedia entry by Rana Razzaq, cited for most of its claims, with the Khilafat and Partition material from further Banglapedia entries and the Balkan mission from the Journal of the Pakistan Historical Society (2003). Where the article adds exact dates — birth on 13 July 1880 at Banikunja, Diardhangara, Sirajganj, and death on 17 July 1931 — Banglapedia gives only the years 1880–1931, and the dates are recorded on the English article's authority with that stated. The article calls his father a police sub-inspector and Unani practitioner where Banglapedia says only that he practised Unani medicine; both are recorded. It also records his Syed ancestry from Shiraz, his mother Nur Jahan Khanom's Pashtun ancestry, his schooling at the Jnanadayini Minor English School and home study of Sanskrit, his reading of Shibli Nomani and Muhammad Iqbal, the two editions of Anal-Prabaha (1899 in the career text, 1900 in the works list — both recorded), his March 1910 imprisonment, his arrest in 1930 in the Civil Disobedience Movement, the Section 144 orders said to have been issued against him 82 times, his wife, five sons and two daughters, and Huseyn Shaheed Suhrawardy's 1948 tribute. It names no school for him, and its infobox records no religion."
