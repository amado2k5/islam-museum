summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد إسماعيل حسين سراجي (1880-1931)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في سراج غنج في 13 يوليو 1880 ووفاته في 17 يوليو 1931، وحظر كتابه الأول «أنال براباها» وسجنه سنة 1910، ورحلته الطبية إلى الدولة العثمانية في حروب البلقان 1912، وتأسيسه جمعية علماء البنغال ودوره في حركة الخلافة وتنظيم الفلاحين."
  en: "English Wikipedia article on Syed Ismail Hossain Siraji (1880–1931); used for entity facts only. It records his birth at Sirajganj on 13 July 1880 and his death on 17 July 1931, the banning of his first book Anal-Prabaha and his imprisonment in 1910, his 1912 medical mission to the Ottoman forces in the Balkan Wars, his founding of the Anjuman-i-Ulama-i-Bangala, his Khilafat work and his peasant mobilisation."
