summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد إسماعيل حسين سراجي (1880-1931)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في سراج غنج في 13 يوليو 1880 ووفاته في 17 يوليو 1931، وحظر كتابه الأول «أنال براباها» وسجنه سنة 1910، ورحلته الطبية إلى الدولة العثمانية في حروب البلقان 1912، وتأسيسه جمعية علماء البنغال ودوره في حركة الخلافة وتنظيم الفلاحين."
  en: "English Wikipedia article on Syed Ismail Hossain Siraji (1880–1931); used for entity facts only. It records his birth at Sirajganj on 13 July 1880 and his death on 17 July 1931, the banning of his first book Anal-Prabaha and his imprisonment in 1910, his 1912 medical mission to the Ottoman forces in the Balkan Wars, his founding of the Anjuman-i-Ulama-i-Bangala, his Khilafat work and his peasant mobilisation."
  es: "Artículo de la Wikipedia en inglés sobre Syed Ismail Hossain Siraji (1880-1931); utilizado únicamente para datos sobre la persona. En él se registra su nacimiento en Sirajganj el 13 de julio de 1880 y su muerte el 17 de julio de 1931, la prohibición de su primer libro, Anal-Prabaha, y su encarcelamiento en 1910, su misión médica a las fuerzas otomanas en las Guerras Balcánicas en 1912, la fundación de la Anjuman-i-Ulama-i-Bangala, su labor en el movimiento Khilafat y su movilización campesina."
  fr: "Article de Wikipédia en anglais sur Syed Ismail Hossain Siraji (1880-1931); utilisé uniquement pour les informations biographiques. Il relate sa naissance à Sirajganj le 13 juillet 1880 et sa mort le 17 juillet 1931, l’interdiction de son premier ouvrage, Anal-Prabaha, et son emprisonnement en 1910, sa mission médicale auprès des forces ottomanes pendant les guerres balkaniques en 1912, la fondation de l’Anjuman-i-Ulama-i-Bangala, son engagement pour le Califat et la mobilisation des paysans."
  ur: "سید اسماعیل حسین سراجی (1880-1931) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 13 جولائی 1880 کو سراج گنج میں ان کی پیدائش اور 17 جولائی 1931 کو ان کی وفات، ان کی پہلی کتاب انال پرابھا پر پابندی اور 1910 میں ان کی قید، 1912 میں بلقان کی جنگوں میں عثمانی افواج کے لیے ان کا طبی مشن، انجمن العلماء الاسلامیہ اور ان کے کام کی بنیاد رکھنے کا ذکر ہے۔ متحرک کرنا"
  tr: "Syed Ismail Hussain Saraji (1880-1931) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 13 Temmuz 1880'de Sirajganj'da doğdu, 17 Temmuz 1931'de vefat etti, ilk kitabı 'Anal Prabha' 1910'da yasaklandı ve hapsedildi, 1912 Balkan Savaşları sırasında Osmanlı İmparatorluğu'na tıbbi yolculuğu, Bengal Bilginler Derneği'ni kurması ve Hilafa Hareketi ile köylülerin örgütlenmesindeki rolü yer aldı."
  id: "Artikel Wikipedia bahasa Inggris tentang Syed Ismail Hussain Saraji (1880-1931); digunakan hanya untuk fakta entitas. Ia lahir di Sirajganj pada 13 Juli 1880, meninggal pada 17 Juli 1931, buku pertamanya 'Anal Prabha' dilarang dan dipenjara pada tahun 1910, perjalanan medisnya ke Kekaisaran Ottoman selama Perang Balkan tahun 1912, pendirian Asosiasi Cendekiawan Bengal, serta perannya dalam Gerakan Khilafa dan organisasi petani."
