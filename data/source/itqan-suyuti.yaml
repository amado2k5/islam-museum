summary:
  ar: "موسوعة السيوطي ⁦(ت 911هـ)⁩ في علوم القرآن، تعالج أنواعًا منها معنى القرآن والسورة والآية وترتيب النزول."
  en: "Al-Suyuti's (d. 911 AH) compendium of Qur'anic sciences, treating topics including the meaning of Qur'an, sura and aya, and the order of revelation."
  es: "Compendio de ciencias coránicas de Al-Suyuti (fallecido en el año 911 de la Hégira), que trata temas como el significado del Corán, las suras y los versículos, y el orden de la revelación."
  fr: "Le recueil des sciences coraniques d'Al-Suyuti (mort en 911 AH), traitant de sujets tels que la signification du Coran, des sourates et des versets, et l'ordre de la révélation."
  ur: "السیوطی ⁦(متوفی 911 ہجری)⁩ قرآنی علوم کا مجموعہ، قرآن کے معانی، سورہ اور آیات اور نزول کی ترتیب سمیت موضوعات کا علاج۔"
  tr: "El-Suyuti'nin Kur'an bilimleri üzerine yazdığı Ansiklopedi'de (ö. 911 H.) Kur'an'ın anlamı, sure, ayet ve vahiy sırası gibi türler ele alınır."
  id: "Ensiklopedia Al-Suuti (wafat 911 H) dalam ilmu Al-Qur'an membahas jenis-jenis termasuk makna Al-Qur'an, surah, ayat, dan urutan wahyu."
