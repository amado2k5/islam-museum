summary:
  ar: "مدخل «صدر أعظم» في موسوعة TDV الإسلامية التركية. يتتبع منصب نائب السلطان من استمرار وزارة السلاجقة إلى ختم أحمد توفيق باشا في 4 نوفمبر 1922: اللقب، وقانون محمد الفاتح، ومسيرة التعيين والختم الهمايوني، وصلاحية الوكيل المطلق، والدواوين، والدخل، وقيام مقام الصدارة."
  en: "The TDV İslâm Ansiklopedisi entry on the Ottoman grand vizier. It follows the sultan's deputy from the continuation of the Seljuk vizierate to the resignation of Ahmed Tevfik Pasha on 4 November 1922: the title, Mehmed II's law, appointment and the imperial seal, the powers of the absolute deputy, the councils, the income, and the deputy grand vizier."
