summary:
  ar: "مدخل «صدر أعظم» في موسوعة TDV الإسلامية التركية. يتتبع منصب نائب السلطان من استمرار وزارة السلاجقة إلى ختم أحمد توفيق باشا في 4 نوفمبر 1922: اللقب، وقانون محمد الفاتح، ومسيرة التعيين والختم الهمايوني، وصلاحية الوكيل المطلق، والدواوين، والدخل، وقيام مقام الصدارة."
  en: "The TDV İslâm Ansiklopedisi entry on the Ottoman grand vizier. It follows the sultan's deputy from the continuation of the Seljuk vizierate to the resignation of Ahmed Tevfik Pasha on 4 November 1922: the title, Mehmed II's law, appointment and the imperial seal, the powers of the absolute deputy, the councils, the income, and the deputy grand vizier."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre el gran visir otomano. Describe la figura del lugarteniente del sultán desde la continuación del visirismo selyúcida hasta la dimisión de Ahmed Tevfik Pasha el 4 de noviembre de 1922: el título, la ley de Mehmed II, el nombramiento y el sello imperial, los poderes del lugarteniente absoluto, los consejos, los ingresos y el cargo de gran visir adjunto."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le grand vizir ottoman. Il retrace l'histoire du représentant du sultan depuis la continuation du vizirat seldjoukide jusqu'à la démission d'Ahmed Tevfik Pacha le 4 novembre 1922: le titre, la loi de Mehmed II, la nomination et le sceau impérial, les pouvoirs du représentant absolu, les conseils, les revenus et le rôle du grand vizir adjoint."
