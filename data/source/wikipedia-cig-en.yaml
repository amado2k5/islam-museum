reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision. It gives her birth as Muazzez İlmiye İtil on 20 June 1914 at Bursa to Crimean Tatar parents, her Hittitology degree at Ankara University (1940) under Güterbock and Landsberger, her decades at Istanbul's Museum of the Ancient Orient cataloguing cuneiform tablets, her marriage to the Topkapı director M. Kemal Çığ, her advocacy of secularism and women's rights, her 2006 trial and acquittal over her book's claim about the headscarf's Sumerian origins — at which she declared 'I am a woman of science' — and her death on 17 November 2024 aged 110. It records her scholarly theses and advocacy, not a personal profession of belief or unbelief."
