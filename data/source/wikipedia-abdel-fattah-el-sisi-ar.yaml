summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الفتاح السيسي؛ تُستخدم لوقائع الكيان فقط. تؤكد ولادته في القاهرة سنة 1954 ومسيرته العسكرية ورئاسته لمصر منذ 2014؛ وصندوق معلوماتها يذكر دينه «الإسلام» عامة دون أي مدرسة."
  en: "Arabic Wikipedia article on Abdel Fattah el-Sisi; used for entity facts only. It confirms his birth in Cairo in 1954, his military career and his presidency of Egypt since 2014; its infobox gives his religion as Islam generally, naming no school."
  es: "Artículo de Wikipedia en árabe sobre Abdel Fattah el-Sisi; utilizado únicamente para datos sobre la persona. Confirma su nacimiento en El Cairo en 1954, su carrera militar y su presidencia de Egipto desde 2014; su ficha informativa indica que su religión es el islam en general, sin mencionar ninguna escuela."
  fr: "Article de Wikipédia en arabe sur Abdel Fattah al-Sissi; utilisé uniquement pour des informations sur l’entité. Il confirme sa naissance au Caire en 1954, sa carrière militaire et sa présidence de l’Égypte depuis 2014; son infobox indique qu’il est de confession musulmane, sans préciser d’école."
  ur: "عبدالفتاح السیسی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1954 میں قاہرہ میں ان کی پیدائش، ان کے فوجی کیریئر اور 2014 سے مصر کی صدارت کی تصدیق کرتا ہے۔ اس کا انفو باکس اس کا مذہب عام طور پر اسلام کے طور پر دیتا ہے، کسی اسکول کا نام نہیں دیتا۔"
  tr: "Abdel Fattah el-Sisi hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1954'te Kahire'de doğduğunu, askeri kariyerini ve 2014'ten beri Mısır başkanlığını doğrular; bilgi kutusunda ise okul olmadan genel olarak \"İslam\" olarak bahsedilmektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang Abdel Fattah el-Sisi; digunakan hanya untuk fakta entitas. Artikel ini mengonfirmasi kelahirannya di Kairo pada tahun 1954, karier militernya, dan masa kepresidenannya di Mesir sejak 2014; infobox tersebut menyebutkan agamanya sebagai \"Islam\" secara umum tanpa aliran apapun."
