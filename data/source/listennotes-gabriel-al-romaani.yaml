summary:
  ar: "قائمة Listen Notes لبودكاست مسلم سنترال الخاص بغابرييل الروماني ⁦(141 حلقة منذ 2015)⁩؛ تذكر سيرته أنه وُلد في رومانيا لأسرة مسيحية، وهاجر إلى كندا سنة 1998، واعتنق الإسلام سنة 2003 بعد سنوات من الدراسة، وشارك في تأسيس منظمة ICRAA الدعوية، ودرس في جامعة مشكاة، وألّف كتاب «يوميات مسلم جديد»."
  en: "The Listen Notes listing of Muslim Central's Gabriel Al Romaani podcast (141 episodes since 2015); its biography records that he was born in Romania to a Christian family, migrated to Canada in 1998, converted to Islam in 2003 after years of study, co-founded the ICRAA da'wah organisation, studied at Mishkah University, and authored Journal of a New Muslim."
  es: "La ficha de Listen Notes del podcast de Gabriel Al Romaani de Muslim Central (141 episodios desde 2015); su biografía indica que nació en Rumania en el seno de una familia cristiana, emigró a Canadá en 1998, se convirtió al Islam en 2003 tras años de estudio, cofundó la organización de da'wah ICRAA, estudió en la Universidad Mishkah y es autor de Journal of a New Muslim."
  fr: "La liste Listen Notes du podcast Gabriel Al Romaani de Muslim Central (141 épisodes depuis 2015); sa biographie indique qu'il est né en Roumanie dans une famille chrétienne, a immigré au Canada en 1998, s'est converti à l'islam en 2003 après des années d'études, a cofondé l'organisation de da'wah ICRAA, a étudié à l'université Mishkah et est l'auteur du Journal d'un nouveau musulman."
  ur: "مسلم سنٹرل کے جبریل الرمانی پوڈ کاسٹ کی لسٹنگ نوٹس ⁦(2015 سے 141 اقساط)⁩؛ اس کی سوانح عمری ریکارڈ کرتی ہے کہ وہ رومانیہ میں ایک عیسائی گھرانے میں پیدا ہوئے، 1998 میں کینیڈا ہجرت کر گئے، برسوں کے مطالعے کے بعد 2003 میں اسلام قبول کیا، آئی سی آر اے اے دعوہ تنظیم کی مشترکہ بنیاد رکھی، مشکا یونیورسٹی میں تعلیم حاصل کی، اور جرنل آف اے نیو مسلم لکھا۔"
  tr: "Gabriel the Romani hakkında Muslim Central podcast'i için dinle notlar listesi (2015'ten beri 141 bölüm); biyografisinde Romanya'da Hristiyan bir ailede doğduğu, 1998'de Kanada'ya göç ettiği, yıllarca süren çalışmanın ardından 2003'te İslam'a geçtiği, savunuculuk organizasyonu ICRAA'nın kuruluşuna katıldığı, Mishkat Üniversitesi'nde eğitim gördüğü ve \"Yeni Bir Müslümanın Günlüğü\" adlı kitabı yazdığı belirtiliyor."
  id: "Dengarkan daftar catatan untuk podcast Muslim Central tentang Gabriel si Romani (141 episode sejak 2015); biografinya menyebutkan bahwa ia lahir di Rumania dari keluarga Kristen, berimigrasi ke Kanada pada tahun 1998, memeluk Islam pada tahun 2003 setelah bertahun-tahun belajar, berpartisipasi dalam pendirian organisasi advokasi ICRAA, belajar di Universitas Mishkat, dan menulis buku \"Diary of a New Muslim.\""
