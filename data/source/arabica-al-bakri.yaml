reliability_note: "Read in the museum's session on 20 November 2026. It describes Mu'jam ma ista'jam as a dictionary of place names in the Arabian Peninsula (stations, abodes, villages, cities, mountains, ruins), with an introduction on the geography of these regions and the places of the tribes, relying on early linguists and geographers and on reports and poetry, mentioned in Simt al-La'ali and in the preface of Yaqut's Mu'jam al-Buldan; and says that the geographical dictionary method matured in Yaqut al-Hamawi. It dates the events in his al-Masalik wa-l-Mamalik no later than 460 (1068). Used for entity facts only."
