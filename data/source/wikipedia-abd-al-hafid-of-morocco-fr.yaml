  ar: "مقالة ويكيبيديا الفرنسية عن عبد الحفيظ بن الحسن ⁦(1876 بفاس – 4 أبريل 1937 بأنجيان لي بان)⁩؛ تنص في متنها على أنه صار أستاذًا ⁦(مقدَّمًا)⁩ في الطريقة التيجانية، ويعطي صندوقها دينه «إسلام سني»."
  en: "The French Wikipedia article on Abd al-Hafid of Morocco (1876 at Fez – 4 April 1937 at Enghien-les-Bains); its text states that he became a master of the Tariqa Tijaniyya, and its infobox gives his religion as Sunni Islam."
  es: "El artículo de la Wikipedia en francés sobre Abd al-Hafid de Marruecos (1876 en Fez – 4 de abril de 1937 en Enghien-les-Bains); su texto afirma que se convirtió en maestro de la Tariqa Tijaniyya, y su ficha informativa indica que su religión era el Islam sunita."
  fr: "L'article de Wikipédia en français sur Abd al-Hafid du Maroc (1876 à Fès – 4 avril 1937 à Enghien-les-Bains); son texte indique qu'il est devenu maître de la Tariqa Tijaniyya, et son infobox indique que sa religion est l'islam sunnite."
  ur: "مراکش کے عبد الحفید پر فرانسیسی ویکیپیڈیا کا مضمون ⁦(1876 فیز - 4 اپریل 1937 اینگین-لیس-بینس میں)⁩؛ اس کے متن میں کہا گیا ہے کہ وہ طارقہ تجنیہ کا ماسٹر بن گیا، اور اس کا معلوماتی خانہ اس کا مذہب سنی اسلام دیتا ہے۔"
  tr: "Abdelhafid bin Al-Hassan hakkında Fransızca Wikipedia makalesi (1876, Fez – 4 Nisan 1937, Angeans-les-Bains); onun Tijaniyya tarikatında öğretmen (Muqaddim) olduğunu ve bu tarikatın finansmanına \"Sünni İslam\" dinini verdiğini belirtir."
  id: "Artikel Wikipedia Prancis tentang Abdelhafid bin Al-Hassan (1876 di Fez – 4 April 1937 di Angeans-les-Bains); disebutkan bahwa ia menjadi guru (Muqaddim) dalam tarekat Tijaniyya dan memberikan dana agamanya \"Islam Sunni.\""
