summary:
  ar: "سيرة هيثم طلعت في موسوعة سير أعلام المعاصرين (alsiyars.com)؛ تعطي اسمه الكامل ومولده سنة 1981 بالمنيا ودراسته الطب وتخرجه سنة 2004 وقائمة مؤلفاته في نقد الإلحاد."
  en: "Biography of Haitham Talaat in the Alsiyars encyclopedia of contemporary figures (alsiyars.com); it gives his full name, his birth in 1981 in Minya, his medical studies and 2004 graduation, and a list of his books against atheism."
  es: "Biografía de Haitham Talaat en la enciclopedia Alsiyars de figuras contemporáneas (alsiyars.com); en ella se incluye su nombre completo, su nacimiento en 1981 en Minya, sus estudios de medicina y su graduación en 2004, así como una lista de sus libros contra el ateísmo."
  fr: "Biographie de Haitham Talaat dans l'encyclopédie Alsiyars des personnalités contemporaines (alsiyars.com); elle donne son nom complet, sa naissance en 1981 à Minya, ses études de médecine et son diplôme en 2004, ainsi qu'une liste de ses livres contre l'athéisme."
  ur: "ہم عصر شخصیات کے السیار انسائیکلوپیڈیا میں ہیثم طلعت کی سوانح عمری (alsiyars.com)؛ اس میں اس کا پورا نام، 1981 میں منیا میں اس کی پیدائش، اس کی طبی تعلیم اور 2004 کی گریجویشن، اور الحاد کے خلاف ان کی کتابوں کی فہرست دی گئی ہے۔"
  tr: "Haitham Talaat'ın biyografisi Çağdaş Figürler Ansiklopedisi'nde (alsiyars.com) yer almaktadır; tam adı, 1981'de Minya'da doğduğu, tıp eğitimi, 2004'teki mezuniyeti ve ateizm eleştirisindeki çalışmalarının listesini vermektedir."
  id: "Biografi Haitham Talaat dimasukkan dalam Ensiklopedia Tokoh Kontemporer (alsiyars.com); buku ini mencantumkan nama lengkapnya, kelahirannya pada tahun 1981 di Minya, studi kedokterannya, kelulusannya pada tahun 2004, dan daftar karya-karyanya dalam kritik ateisme."
