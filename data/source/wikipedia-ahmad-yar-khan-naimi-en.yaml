summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مفتی أحمد يار خان نعيمي؛ تصفه في صدرها بأنه عالم سني ومفسر وفقيه وصوفي، وتنص في قسم أثره على أنه كان تابعاً وخليفة لسيد نعيم الدين القادري المراد آبادي، ويعطي صندوق معلوماتها ميلاده 1 آذار 1894 ووفاته 24 تشرين الأول 1971 في كجرات، ويحمل الصندوق حقولاً للسنة والحنفية والماتريدية والبريلوية والقادرية."
  en: "The English Wikipedia article on Mufti Ahmad Yar Khan Naeemi; its lead calls him a Sunni Islamic scholar, commentator, jurist and Sufi, its legacy section states that he was the follower and caliph of Syed Naeem-ud-din Qadri Moradabadi, and its infobox gives his birth as 1 March 1894, his death on 24 October 1971 at Gujrat, and fields for Sunni denomination, Hanafi jurisprudence, Maturidi creed, Barelvi movement and Qadri tariqa."
  es: "El artículo de la Wikipedia en inglés sobre Mufti Ahmad Yar Khan Naeemi; su sección de legado afirma que fue seguidor y califa de Syed Naeem-ud-din Qadri Moradabadi, y su ficha informativa indica que nació el 1 de marzo de 1894, murió el 24 de octubre de 1971 en Gujrat, y campos para la denominación sunita, la jurisprudencia hanafi, el credo maturidi, el movimiento barelvi y la fundación Qadri."
  fr: "L'article de Wikipédia en anglais sur Mufti Ahmad Yar Khan Naeemi; sa section héritage indique qu'il était le disciple et le calife de Syed Naeem-ud-din Qadri Moradabadi, et son infobox donne sa date de naissance le 1er mars 1894, sa mort le 24 octobre 1971 à Gujrat, et des champs pour la dénomination sunnite, la jurisprudence hanafite, la croyance maturidite, le mouvement barelvi et la fondation qadri."
  ur: "مفتی احمد یار خان نعیمی پر انگریزی ویکیپیڈیا کا مضمون؛ اس کا لیڈ انہیں ایک سنی اسلامی اسکالر، مفسر، فقیہ اور صوفی کہتا ہے، اس کے وراثتی حصے میں کہا گیا ہے کہ وہ سید نعیم الدین قادری مرادآبادی کے پیروکار اور خلیفہ تھے، اور اس کے معلوماتی خانے میں ان کی پیدائش یکم مارچ 1894، ان کی وفات 24 اکتوبر 1971 کو گجرات میں ہوئی، اور سنّی دین، متواضع، متواضع، مطہرات کے لیے میدانِ عمل۔ بریلوی تحریک اور قادری طریقت۔"
  tr: "İngilizce Vikipedi makalesi, Müftü Ahmed Yar Khan Naemi hakkında; onu ön saflarda bir Sünni alim, tefsir, hukukçu ve Sufi olarak tanımlar. Bölümünde, Seyyid Naemuddin el-Qadiri el-Muradabadi'nin takipçisi ve halefi olduğu belirtilir. Bilgi kutusunda 1 Mart 1894'te doğum, 24 Ekim 1971'de Gujarat'ta vefat ettiği belirtilmektedir. Kutuda Sünniler, Hanefiler, Maturidiler, Barelviyyalar ve Kadiriler için tarlalar yer almaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Mufti Ahmad Yar Khan Naeemi; menggambarkan dia di garis depan sebagai ulama Sunni, tafsir, ahli hukum, dan Sufi. Dalam bagiannya, disebutkan bahwa dia adalah pengikut dan penerus Sayyid Naemuddin al-Qadiri al-Muradabadi. Kotak informasinya mencantumkan kelahirannya pada 1 Maret 1894, dan kematiannya pada 24 Oktober 1971 di Gujarat. Kotak tersebut berisi ladang untuk Sunni, Hanafi, Maturidi, Barelwiyya, dan Qadiri."
