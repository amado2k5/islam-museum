summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مفتی أحمد يار خان نعيمي؛ تصفه في صدرها بأنه عالم سني ومفسر وفقيه وصوفي، وتنص في قسم أثره على أنه كان تابعاً وخليفة لسيد نعيم الدين القادري المراد آبادي، ويعطي صندوق معلوماتها ميلاده 1 آذار 1894 ووفاته 24 تشرين الأول 1971 في كجرات، ويحمل الصندوق حقولاً للسنة والحنفية والماتريدية والبريلوية والقادرية."
  en: "The English Wikipedia article on Mufti Ahmad Yar Khan Naeemi; its lead calls him a Sunni Islamic scholar, commentator, jurist and Sufi, its legacy section states that he was the follower and caliph of Syed Naeem-ud-din Qadri Moradabadi, and its infobox gives his birth as 1 March 1894, his death on 24 October 1971 at Gujrat, and fields for Sunni denomination, Hanafi jurisprudence, Maturidi creed, Barelvi movement and Qadri tariqa."
