summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن راغورام راجان؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 3 فبراير 1963 ببوبال وتعليمه ومسيرته في شيكاغو وصندوق النقد الدولي وبنك الاحتياطي الهندي وكتبه، ولا تذكر له أي انتماء ديني؛ ولفظ «هندو» فيها لا يرد إلا في اسم صحيفة «ذا هندو»."
  en: "English Wikipedia article on Raghuram Rajan; used for entity facts only. It gives his birth as 3 February 1963 at Bhopal and covers his education and his Chicago, IMF and Reserve Bank of India career and books. It names no religion for him; its only 'Hindu' occurrences are the newspaper The Hindu."
  es: "Artículo de la Wikipedia en inglés sobre Raghuram Rajan; utilizado únicamente para obtener información sobre su persona. Indica que nació el 3 de febrero de 1963 en Bhopal y abarca su educación, su trayectoria profesional en Chicago, el FMI y el Banco de la Reserva de la India, así como sus publicaciones. No menciona su religión; la única referencia al hinduismo se encuentra en el periódico The Hindu."
  fr: "Article Wikipédia en anglais sur Raghuram Rajan; utilisé uniquement pour les informations le concernant. Il indique sa date de naissance, le 3 février 1963 à Bhopal, et aborde ses études, sa carrière à Chicago, au FMI et à la Banque de réserve de l'Inde, ainsi que ses publications. Aucune mention de sa religion n'est faite; la seule référence à l'hindouisme se limite au journal The Hindu."
  ur: "رگھورام راجن پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 3 فروری 1963 کو بھوپال میں ہوئی اور اس میں ان کی تعلیم اور شکاگو، آئی ایم ایف اور ریزرو بینک آف انڈیا کے کیریئر اور کتابوں کا احاطہ کیا گیا ہے۔ یہ اس کے لیے کسی مذہب کا نام نہیں رکھتا۔ اس کے صرف 'ہندو' واقعات اخبار دی ہندو ہیں۔"
  tr: "Raghuram Rajan hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 3 Şubat 1963'teki doğumu, Bhopal'dan, eğitiminden, Chicago'daki kariyerinden, Uluslararası Para Fonu'ndan, Hindistan Merkez Bankası'ndan ve kitaplarından bahseder, ancak herhangi bir dini aidiyetinden bahsetmez; \"Hindu\" kelimesi yalnızca \"The Hindu\" gazetesinin adında geçer."
  id: "Artikel Wikipedia bahasa Inggris tentang Raghuram Rajan; digunakan hanya untuk fakta entitas. Kelahirannya pada 3 Februari 1963 menyebutkan Bhopal, pendidikannya, kariernya di Chicago, Dana Moneter Internasional, Bank Cadangan India, dan bukunya, tetapi tidak menyebutkan afiliasi agama apa pun tentang dirinya; kata \"Hindu\" hanya muncul pada nama surat kabar \"The Hindu.\""
