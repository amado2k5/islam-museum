reliability_note: "The channel's own presence: a primary source for its identity, output and reach — not independent corroboration of biography. Verified as his own channel on 25 October 2026: YouTube's own search for «محمد الغليظ» returns this channel under his name with his signature line as its description (the same line the published biographies quote as his slogan), and its catalogue is his own preaching series, presented by him. vidIQ recorded 1,980,000 subscribers, 149,405,794 views and 3,927 videos for it on 23 October 2026, and dates its start to 18 November 2012; platform figures change constantly and are recorded only with their date. The harvest list's transliteration 'ElGhalid' is a misreading of الغليظ; the channel's own Latin spelling is Elghaleez."
