  ar: "مقالة ويكيبيديا الإنجليزية عن كونتا حاجي كيشييف؛ تُستخدم لوقائع الكيان فقط. تقول مقدمتها (نحو 1800–1867) إنه «من أتباع الطريقة الصوفية القادرية»، ويسجل متنها زيارته ضريح عبد القادر الجيلاني في بغداد وصيرورته تابعًا مخلصًا للقادرية؛ أما صندوق معلوماتها فمتناقض داخليًا ولم يُعتمد حيث تتكلم النصوص."
  en: "English Wikipedia article on Kunta-Haji Kishiev; used for entity facts only. Its lead (c. 1800–1867) calls him 'a follower of the Qadiriyya Sufi order', and its text records his visit to Abd al-Qadir al-Jilani's tomb in Baghdad and that he 'became a devoted follower of Qadiriyyah'; its infobox is internally inconsistent (birth year 1821, his father misnamed) and was not used where the texts speak."
