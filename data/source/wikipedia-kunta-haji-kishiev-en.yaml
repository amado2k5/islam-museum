summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كونتا حاجي كيشييف؛ تُستخدم لوقائع الكيان فقط. تقول مقدمتها ⁦(نحو 1800–1867)⁩ إنه «من أتباع الطريقة الصوفية القادرية»، ويسجل متنها زيارته ضريح عبد القادر الجيلاني في بغداد وصيرورته تابعًا مخلصًا للقادرية؛ أما صندوق معلوماتها فمتناقض داخليًا ولم يُعتمد حيث تتكلم النصوص."
  en: "English Wikipedia article on Kunta-Haji Kishiev; used for entity facts only. Its lead (c. 1800–1867) calls him 'a follower of the Qadiriyya Sufi order', and its text records his visit to Abd al-Qadir al-Jilani's tomb in Baghdad and that he 'became a devoted follower of Qadiriyyah'; its infobox is internally inconsistent (birth year 1821, his father misnamed) and was not used where the texts speak."
  es: "Artículo de la Wikipedia en inglés sobre Kunta-Haji Kishiev; utilizado únicamente para datos sobre la entidad. Su introducción (c. 1800–1867) lo describe como \"un seguidor de la orden sufí Qadiriyya\", y su texto registra su visita a la tumba de Abd al-Qadir al-Jilani en Bagdad y que \"se convirtió en un devoto seguidor de Qadiriyyah\"; su ficha informativa es internamente inconsistente (año de nacimiento 1821, nombre erróneo de su padre) y no se utilizó donde los textos lo indican."
  fr: "L'article de Wikipédia en anglais sur Kunta-Haji Kishiev est utilisé uniquement pour les informations le concernant. Son introduction (vers 1800-1867) le décrit comme un adepte de l'ordre soufi Qadiriyya, et son texte relate sa visite au tombeau d'Abd al-Qadir al-Jilani à Bagdad et son adhésion à la voie Qadiriyya. Cependant, son infobox présente des incohérences (année de naissance: 1821, nom du père erroné) et n'a pas été utilisée dans les passages où elle figure."
