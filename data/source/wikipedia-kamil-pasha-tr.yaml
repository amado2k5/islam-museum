summary:
  ar: "مقالة ويكيبيديا التركية عن قبرصلي محمد كامل باشا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده سنة 1833 في غازيلر قرب لفكوشا بقبرص، ووفاته في لفكوشا في 14 نوفمبر 1913، وصداراته الأربع ومددها."
  en: "Turkish Wikipedia article on Kıbrıslı Mehmed Kâmil Paşa; used for entity facts only. It gives his birth in 1833 at Gaziler near Nicosia in Cyprus, his death at Nicosia on 14 November 1913, and his four grand vizierates with their terms."
  es: "Artículo de la Wikipedia en turco sobre Kıbrıslı Mehmed Kâmil Paşa; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1833 en Gaziler, cerca de Nicosia, en Chipre, su fallecimiento en Nicosia el 14 de noviembre de 1913 y sus cuatro grandes visiratos con sus respectivos mandatos."
  fr: "Article de Wikipédia en turc sur Kıbrıslı Mehmed Kâmil Paşa; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance en 1833 à Gaziler, près de Nicosie à Chypre, sa mort à Nicosie le 14 novembre 1913, et ses quatre grands vizirats avec leurs durées."
  ur: "Kıbrıslı Mehmed Kamil Paşa پر ترک ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1833 میں قبرص میں نیکوسیا کے قریب گزیلر میں اس کی پیدائش، 14 نومبر 1913 کو نیکوسیا میں اس کی موت، اور اس کے چار عظیم وزیریٹس اپنی شرائط کے ساتھ۔"
  tr: "Kıbrıs Niması Muhammed Kamel Paşa hakkında Türkçe Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1833 yılında Kıbrıs'ın Lefkosha yakınlarındaki Gaziler'de doğduğu ve 14 Kasım 1913'te Lefkosha'da dört büyük unvanı ve uzantılarıyla birlikte öldüğü belirtilmiştir."
  id: "Artikel Wikipedia Turki tentang Siprus Pray Muhammad Kamel Pasha; digunakan hanya untuk fakta entitas. Ia dinyatakan lahir pada tahun 1833 di Gaziler dekat Lefkosha, Siprus, dan meninggal di Lefkosha pada 14 November 1913, bersama dengan empat gelar utama dan ekstensi yang dimilikinya."
