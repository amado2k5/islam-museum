  ar: "مقالة ويكيبيديا العربية «موقع ابن باز»، المراجعة 68580741 ⁦(15 نوفمبر 2024)⁩؛ لوقائع الكيان فقط: موقع يجمع تراث الشيخ ابن باز العلمي وفتاواه، وهو من مشاريع مجموعة زاد التي يملكها محمد صالح المنجد."
  en: "Arabic Wikipedia article 'Ibn Baz website', revision 68580741 (15 November 2024); entity facts only: a site gathering Shaykh Ibn Baz's scholarly legacy and fatwas, a project of the Zad Group owned by Muhammad Salih al-Munajjid."
  ur: "عربی ویکیپیڈیا کا مضمون «موقع ابن باز»، نظرِ ثانی 68580741 ⁦(15 نومبر 2024)⁩؛ صرف حقائق: شیخ ابن باز کے علمی ورثے اور فتاویٰ کی سائٹ، زاد گروپ کا منصوبہ جس کے مالک محمد صالح المنجد ہیں۔"
  es: "Artículo de Wikipedia en árabe «Sitio web de Ibn Baz», revisión 68580741 (15 de noviembre de 2024); información sobre la entidad: un sitio que recopila el legado académico y las fatuas del jeque Ibn Baz, un proyecto del Grupo Zad, propiedad de Muhammad Salih al-Munajjid."
  fr: "Article Wikipédia arabe « Site web d'Ibn Baz », révision 68580741 (15 novembre 2024); informations sur l'entité uniquement: un site rassemblant l'héritage savant et les fatwas du cheikh Ibn Baz, un projet du groupe Zad appartenant à Muhammad Salih al-Munajjid."
