  ar: "مقالة ويكيبيديا العربية عن معمر القذافي؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 7 يونيو 1942 بسرت ووفاته فيها في 20 أكتوبر 2011، وأنّه صعد إلى السلطة بانقلاب عسكري خلع الملك إدريس. صندوق معلوماتها يعطي دينه «مسلم سني»، وهو صندوق واحد لا نصّ."
