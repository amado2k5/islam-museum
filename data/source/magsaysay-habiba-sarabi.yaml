summary:
  ar: "ملف مؤسسة جائزة رامون ماغسايساي عن حبيبة سرابي، الحائزة على الجائزة سنة 2013؛ يوثّق دراستها في كابل وتخصصها في أمراض الدم في الهند، وفرارها إلى باكستان سنة 1996، ودروسها السرية لليقظة والقراءة، وحاكميتها لباميان. وصفتها إعلانات الجائزة بأنها «عضوة في أقلية عرقية ودينية» — وصف للجماعة لا شهادة على مذهبها."
  en: "Ramon Magsaysay Award Foundation profile of Habiba Sarabi, a 2013 awardee; it records her Kabul studies and hematology training in India, her 1996 flight to Pakistan, her underground literacy work, and her Bamyan governorship. Award announcements describe her as 'a member of an ethnic and religious minority' — a group description, not an attestation of her school."
  es: "Perfil de Habiba Sarabi, galardonada en 2013 por la Fundación del Premio Ramon Magsaysay; en él se recogen sus estudios en Kabul y su formación en hematología en la India, su huida a Pakistán en 1996, su labor clandestina de alfabetización y su mandato como gobernadora de Bamiyán. Los comunicados de los premios la describen como «miembro de una minoría étnica y religiosa», una descripción que se refiere al grupo, no a su escuela."
  fr: "Le profil de Habiba Sarabi, lauréate du prix Ramon Magsaysay en 2013, est disponible sur le site de la Fondation du prix Ramon Magsaysay. Il relate ses études à Kaboul et sa formation en hématologie en Inde, sa fuite vers le Pakistan en 1996, son travail clandestin d'alphabétisation et son mandat de gouverneure de Bamiyan. Les annonces de prix la décrivent comme « membre d'une minorité ethnique et religieuse », une appellation de groupe et non une attestation de son établissement scolaire."
