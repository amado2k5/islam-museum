summary:
  ar: "ملف مؤسسة جائزة رامون ماغسايساي عن حبيبة سرابي، الحائزة على الجائزة سنة 2013؛ يوثّق دراستها في كابل وتخصصها في أمراض الدم في الهند، وفرارها إلى باكستان سنة 1996، ودروسها السرية لليقظة والقراءة، وحاكميتها لباميان. وصفتها إعلانات الجائزة بأنها «عضوة في أقلية عرقية ودينية» — وصف للجماعة لا شهادة على مذهبها."
  en: "Ramon Magsaysay Award Foundation profile of Habiba Sarabi, a 2013 awardee; it records her Kabul studies and hematology training in India, her 1996 flight to Pakistan, her underground literacy work, and her Bamyan governorship. Award announcements describe her as 'a member of an ethnic and religious minority' — a group description, not an attestation of her school."
