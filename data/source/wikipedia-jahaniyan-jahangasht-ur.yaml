reliability_note: "Community-edited encyclopedia article in the hagiographic tradition, retrieved in full at the stated revision. It opens by calling him the most prominent personality of the Suhrawardi silsila; it gives his birth at Uch on 14 Sha'ban 707 AH (rendered 7 February 1308), his receipt of the khirqa of khilafa first from his father Ahmad Kabir and a second from Shaykh Ruknuddin (Shah Rukn-e-Alam), his appointment as Shaykh al-Islam under Muhammad ibn Tughluq with the forty khanqahs of Siwastan, and his death at Uch on 10 Dhu al-Hijja 785 AH (3 February 1384), where his tomb stands."
