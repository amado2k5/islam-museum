  ar: "مقالة ويكيبيديا الإنجليزية عن حفيظ الله أمين؛ تُستخدم لوقائع الكيان فقط (مقالة جيدة). تروي مولده في 1 أغسطس 1929 في بغمان، وتعليمه في كابل وكولومبيا، وصعوده في حزب الشعب الديمقراطي، وانقلابه على تركي في سبتمبر 1979، واغتياله في قصر تاج بيك بكابل في 27 ديسمبر 1979 أثناء الهجوم السوفيتي. لا تحمل خانة للديانة."
  en: "English Wikipedia article on Hafizullah Amin; used for entity facts only (a Good Article). It recounts his birth on 1 August 1929 at Paghman, his education at Kabul and Columbia, his rise in the PDPA, his overthrow of Taraki in September 1979, and his assassination at the Tajbeg Palace in Kabul on 27 December 1979 during the Soviet assault. It carries no religion field."
