summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حفيظ الله أمين؛ تُستخدم لوقائع الكيان فقط ⁦(مقالة جيدة)⁩. تروي مولده في 1 أغسطس 1929 في بغمان، وتعليمه في كابل وكولومبيا، وصعوده في حزب الشعب الديمقراطي، وانقلابه على تركي في سبتمبر 1979، واغتياله في قصر تاج بيك بكابل في 27 ديسمبر 1979 أثناء الهجوم السوفيتي. لا تحمل خانة للديانة."
  en: "English Wikipedia article on Hafizullah Amin; used for entity facts only (a Good Article). It recounts his birth on 1 August 1929 at Paghman, his education at Kabul and Columbia, his rise in the PDPA, his overthrow of Taraki in September 1979, and his assassination at the Tajbeg Palace in Kabul on 27 December 1979 during the Soviet assault. It carries no religion field."
  es: "Artículo de la Wikipedia en inglés sobre Hafizullah Amin; se utiliza únicamente para obtener información sobre la persona (un buen artículo). Relata su nacimiento el 1 de agosto de 1929 en Paghman, su educación en Kabul y Colombia, su ascenso en el PDPA, su derrocamiento de Taraki en septiembre de 1979 y su asesinato en el Palacio Tajbeg de Kabul el 27 de diciembre de 1979 durante el asalto soviético. No incluye información sobre religión."
  fr: "Article de Wikipédia en anglais sur Hafizullah Amin; utilisé uniquement pour les informations biographiques (article de qualité). Il relate sa naissance le 1er août 1929 à Paghman, ses études à Kaboul et à Columbia, son ascension au sein du PDPA, le renversement de Taraki en septembre 1979 et son assassinat au palais Tajbeg à Kaboul le 27 décembre 1979 lors de l'offensive soviétique. Il ne comporte pas de champ relatif à la religion."
  ur: "حفیظ اللہ امین پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے ⁦(ایک اچھا مضمون)⁩۔ اس میں یکم اگست 1929 کو پغمان میں ان کی پیدائش، کابل اور کولمبیا میں ان کی تعلیم، پی ڈی پی اے میں ان کا عروج، ستمبر 1979 میں تراکی کا تختہ الٹنے اور 27 دسمبر 1979 کو سوویت حملے کے دوران کابل کے تاجبیگ محل میں ان کے قتل کا ذکر ہے۔ اس کا کوئی مذہب نہیں ہے۔"
