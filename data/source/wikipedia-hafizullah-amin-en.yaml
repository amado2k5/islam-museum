reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026; the recorded revision was fetched by its revision id and a second query returned the same revision id. Its text records his government's campaign to present the regime as not anti-Islamic — mosque repairs, Quran copies for religious groups, references to Allah in his speeches, his claim that the Saur Revolution was 'totally based on the principles of Islam', and the official announcement, after the ulama council's endorsement, that Amin was a pious Muslim. That is regime positioning and state policy, and the counter-revolutionary propaganda calling the regime atheist is an accusation; neither is a personal attestation of a school, and no text names one."
