summary:
  ar: "مقالة ويكيبيديا الأوزبكية المفصلة عن قربانجان دادخواه؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في 22 مايو 1811 ووفاتها في 1 فبراير 1907، وصندوق معلوماتها يذكر دينها الإسلام عمومًا."
  en: "Detailed Uzbek Wikipedia article on Qurbonjon dodxoh (Kurmanjan Datka); used for entity facts only. It gives her birth on 22 May 1811 and her death on 1 February 1907, and its infobox gives her religion as Islam in general."
  es: "Artículo detallado de la Wikipedia en uzbeko sobre Qurbonjon dodxoh (Kurmanjan Datka); utilizado únicamente para datos sobre la persona. Indica que nació el 22 de mayo de 1811 y falleció el 1 de febrero de 1907, y su ficha informativa señala que profesaba el islam en general."
  fr: "Article détaillé de Wikipédia en ouzbek sur Qurbonjon dodxoh (Kurmanjan Datka); utilisé uniquement pour les informations la concernant. On y apprend qu'elle est née le 22 mai 1811 et décédée le 1er février 1907, et son infobox indique qu'elle était de confession musulmane."
  ur: "ازبک ویکیپیڈیا کا تفصیلی مضمون قربونجن دودکسوہ ⁦(کرمنجن ڈٹکا)⁩ پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 22 مئی 1811 کو اس کی پیدائش اور اس کی موت 1 فروری 1907 کو ہوئی ہے، اور اس کا معلوماتی باکس اس کا مذہب عام طور پر اسلام کے طور پر دیتا ہے۔"
  tr: "Qurbancan Dadkhwa hakkında ayrıntılı Özbek Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 22 Mayıs 1811'de doğduğundan, 1 Şubat 1907'de öldüğünden ve bilgi kutusunda genel olarak İslam'dan bahseder."
  id: "Artikel Wikipedia Uzbekistan yang rinci tentang Qurbanjan Dadkhwa; digunakan hanya untuk fakta entitas. Ia menyebutkan kelahirannya pada 22 Mei 1811, dan kematiannya pada 1 Februari 1907, dan infobox-nya menyebutkan agamanya secara umum, Islam."
