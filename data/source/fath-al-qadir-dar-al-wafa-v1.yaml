  en: "Fath al-Qadir — al-Shawkani, ed. Abd al-Rahman Umayra (Dar al-Wafa'), vol. 1 with the editor's introduction"
  ur: "فتح القدیر — شوکانی، تحقیق عبد الرحمن عمیرہ (دار الوفاء)، جلد اول مع مقدمۂ محقق"
summary:
  ar: "الجزء الأول من طبعة دار الوفاء لتفسير الشوكاني، حققه وخرّج أحاديثه الدكتور عبد الرحمن عميرة، وشارك في الفهارس والتخريج لجنة التحقيق والبحث العلمي بدار الوفاء؛ وفيه مقدمة طويلة للمحقق عن عصر الشوكاني وحياته وتوليه القضاء ومؤلفاته ومنهجه في التفسير، وعن عمل المحقق والنسخ الخطية."
  en: "Volume 1 of the Dar al-Wafa' edition of al-Shawkani's commentary, edited with hadith references by Dr Abd al-Rahman Umayra, with indexes and referencing shared by Dar al-Wafa''s research committee. It carries a long editor's introduction on al-Shawkani's age, life, judgeship, works and method in tafsir, and on the editor's work and the manuscripts."
  ur: "دار الوفاء کے ایڈیشن کی پہلی جلد، جس کی تحقیق اور احادیث کی تخریج ڈاکٹر عبد الرحمن عمیرہ نے کی اور فہارس و تخریج میں دار الوفاء کی تحقیقی کمیٹی شریک رہی؛ اس میں محقق کا طویل مقدمہ ہے جو شوکانی کے عصر، حیات، منصبِ قضا، تصانیف اور تفسیری منہج، نیز محقق کے کام اور مخطوطات کے بارے میں ہے۔"
title: "فتح القدير الجامع بين فني الرواية والدراية من علم التفسير، الجزء الأول"
