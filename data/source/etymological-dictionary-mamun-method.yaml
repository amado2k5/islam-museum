reliability_note: "Read 2026-11-15 via web search result excerpt and page listing. French-English-Persian reference dictionary entry; it describes the method (two teams from the Sinjar desert, north and south, noon-sun height change of one degree with declination correction, a second measurement, a result 'somewhat between 56 and 57 Arabic miles' citing Biruni's Tahdid, 360x for the circumference) and places the departure point nineteen farsangs from Mosul and forty-three from Samarra. Secondary reference summary; the underlying Arabic texts were not independently inspected. The dictionary's attribution to 'Biruni, Tahdid' differs from the MacTutor relay naming 'Coordinates of Cities' — both are al-Biruni geodetic works and the discrepancy is recorded, not resolved."
