reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The standard scholarly encyclopaedia entry (print edition 1998). It gives his birth in Dhu al-Hijja 1012 (May 1604) at Edirne, his father Habbazzâde Hasan Efendi, his succession of Edirne müderris posts ending at the Dârülhadis in 1658, his death the following year (1069/1659) on the tombstone evidence of Osman Nuri Peremeci against Şeyhî's confusion of his posts and dates with those of his brother Abdülkadir Efendi (d. 1087/1676), and the full list of his works headed by the Enîsü'l-müsâmirîn of 1046/1636. It names no school or order for the man himself. Read in-session 1 November 2026."
