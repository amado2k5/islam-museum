reliability_note: "Read in the museum's session on 20 November 2026. It gives the full title al-Muhkam wa-l-Muhit al-A'zam; says it was written at the request of Mujahid al-Amiri, emir of Denia; that it follows the articulation-point arrangement of al-Ayn, with the corrections made in al-Zubaydi's Mukhtasar al-Ayn, beginning with the throat letters and ending with the lip letters, and applies al-Khalil's permutation system; that it differs from al-Ayn and al-Azhari's Tahdhib by gathering scattered material, explaining words more carefully and correcting morphological and syntactic errors; and that Ibn Sida follows al-Azhari in tying words to the Qur'an and hadith. Used for entity facts only."
