  ar: "مقال الإنجليزية عن إيفلين كوبولد (1867-1963): مولدها في إدنبرة، نشأتها في الجزائر والقاهرة، تأكيد إسلامها بحلول 1915 واتخاذها اسم زينب، حجها سنة 1933 كأول مسلمة مولودة في بريطانيا، كتابها «الحج إلى مكة» (1934)، ووفاتها في إنفرنيس سنة 1963 ودفنها في عزبتها غلينكارون."
  en: "English encyclopedia article on Evelyn Cobbold (1867-1963): her Edinburgh birth, her childhood in Algiers and Cairo, her affirmation of Islam by 1915 and the name Zainab, her 1933 Hajj as the first British-born Muslim woman pilgrim, her Pilgrimage to Mecca (1934), and her 1963 death at Inverness and burial on her Glencarron estate."
  es: "Artículo de enciclopedia inglesa sobre Evelyn Cobbold (1867-1963): su nacimiento en Edimburgo, su infancia en Argel y El Cairo, su conversión al Islam en 1915 y el nombre de Zainab, su peregrinación a La Meca en 1933 como la primera mujer musulmana nacida en Gran Bretaña, su peregrinación a la Meca (1934) y su muerte en 1963 en Inverness y su entierro en su finca de Glencarron."
  fr: "Article d'encyclopédie anglaise sur Evelyn Cobbold (1867-1963): sa naissance à Édimbourg, son enfance à Alger et au Caire, son affirmation de l'islam en 1915 et le nom de Zainab, son Hajj de 1933 en tant que première femme pèlerine musulmane née en Grande-Bretagne, son pèlerinage à La Mecque (1934) et sa mort en 1963 à Inverness et son enterrement sur son domaine de Glencarron."
  ur: "ایولین کوبولڈ (1867-1963) پر انگریزی انسائیکلوپیڈیا کا مضمون: اس کی ایڈنبرا کی پیدائش، اس کا بچپن الجیئرز اور قاہرہ میں، اس کا 1915 تک اسلام کا اثبات اور نام زینب، اس کا 1933 کا حج پہلی برطانوی نژاد مسلم خاتون حاجی کے طور پر، اس کی مکہ کی زیارت اور 639 میں اس کی موت اور 439 میں اس کی موت۔ اس کی گلین کارون اسٹیٹ پر۔"
  tr: "Evelyn Cobbold hakkında İngilizce makale (1867-1963): Edinburgh doğumlu, Cezayir ve Kahire'de büyümüş, 1915'te İslam'a geçişinin teyit edilmesi ve Zeyneb adını alması, 1933'te Britanya'da doğan ilk Müslüman kadın olarak hac yolculuğu, 'Mekke'ye Hac Yolculuğu (1934) kitabı, 1963'te Inverness'te ölümü ve Glencarron malikanesine defnedilmesi."
  id: "Artikel bahasa Inggris tentang Evelyn Cobbold (1867-1963): lahir di Edinburgh, dibesarkan di Aljazair dan Kairo, konfirmasi konversinya ke Islam pada tahun 1915 dan mengambil nama Zainab, ziarahnya pada tahun 1933 sebagai wanita Muslim pertama yang lahir di Inggris, bukunya 'Pilgrimage to Mecca' (1934), kematiannya di Inverness pada tahun 1963, dan pemakamannya di tanah miliknya Glencarron."
