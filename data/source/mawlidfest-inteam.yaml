summary:
  ar: "صفحة مهرجان المولد التعريفية بفرقة إنتيم الماليزية؛ تذكر أنها تأسست سنة 1998 على أيدي أربعة طلاب في مركز التمهيدي بالجامعة الإسلامية العالمية بماليزيا، وأنها عُرفت بأغنية «كاسيه ككاسيه» نحو سنة 2000 تحت إدارة تسجيلات حجاز."
  en: "The Mawlid Festival's profile of the Malaysian group Inteam: established in 1998 by four students at the UIA Matriculation Center in Malaysia, with early members Syah, Hazamin, Izzat Mirwana and Kamarulzaman (KZ), and introduced through the song 'Kasih Kekasih' around 2000 under the management of Hijjaz Records."
  ur: "مولد فیسٹیول کا ملائیشی گروپ ان ٹیم کا تعارفی صفحہ؛ اس کے مطابق یہ گروپ 1998ء میں ملائیشیا کی بین الاقوامی اسلامی یونیورسٹی کے میٹرک سینٹر کے چار طلبہ نے قائم کیا اور تقریباً 2000ء میں حجاز ریکارڈز کی انتظامیہ میں «کاسیہ ککاسیہ» سے متعارف ہوا۔"
  es: "Perfil del Festival Mawlid del grupo malayo Inteam: fundado en 1998 por cuatro estudiantes del Centro de Matriculación de la UIA en Malasia, con los primeros miembros Syah, Hazamin, Izzat Mirwana y Kamarulzaman (KZ), e introducido a través de la canción 'Kasih Kekasih' alrededor del año 2000 bajo la dirección de Hijjaz Records."
