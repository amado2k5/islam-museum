reliability_note: "Festival artist profile read on 15 November 2026. It states that Inteam (formerly In-Team) was established in 1998 by four talented students who had just set foot at the UIA Matriculation Center, Malaysia; among the earliest members were Syah, Hazamin, Izzat Mirwana and Kamarulzaman, also known as KZ; the group has nasheed songs in Malay, English and Arabic, and was introduced through the song 'Kasih Kekasih' around the year 2000 under the management of Hijjaz Records. Read on 15 November 2026."
