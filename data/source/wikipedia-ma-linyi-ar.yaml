summary:
  ar: "مقالة ويكيبيديا العربية عن ما ليني؛ تُستخدم لوقائع الكيان فقط. وهي ترجمة للمقالة الإنجليزية: تروي المسلم الصيني المولود في خونان، وزير تربية قانسو سنة 1912 ومؤسس جمعية تعزيز التعليم الإسلامي سنة 1918، ورعايته مع ما فوشيانغ لحجّ وانغ جينغزهاي."
  en: "Arabic Wikipedia article on Ma Linyi; used for entity facts only. It is a translation of the English article: the Chinese Muslim born in Hunan, Gansu's education minister from 1912 and founder of the Association for the Promoting of Islamic Teaching in 1918, who with Ma Fuxiang sponsored Wang Jingzhai's hajj."
  es: "Artículo en árabe de la Wikipedia sobre Ma Linyi; se utiliza únicamente para datos sobre la persona. Es una traducción del artículo en inglés: el musulmán chino nacido en Hunan, ministro de educación de Gansu desde 1912 y fundador de la Asociación para la Promoción de la Enseñanza Islámica en 1918, quien junto con Ma Fuxiang patrocinó el Hajj de Wang Jingzhai."
  fr: "Article de Wikipédia en arabe sur Ma Linyi; utilisé uniquement à des fins d'information sur l'entité. Il s'agit d'une traduction de l'article anglais: musulman chinois né dans le Hunan, ministre de l'Éducation du Gansu à partir de 1912 et fondateur de l'Association pour la promotion de l'enseignement islamique en 1918, qui, avec Ma Fuxiang, a financé le pèlerinage à La Mecque de Wang Jingzhai."
