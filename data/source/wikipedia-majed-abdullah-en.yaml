summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ماجد عبد الله؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 11 يناير 1959 في جدة، ومسيرته كلها مع النصر، ورقميه القياسيين مع المنتخب ⁦(72 هدفًا في 117 مباراة)⁩، وكأسي آسيا 1984 و1988، واعتزاله سنة 1998."
  en: "English Wikipedia article on Majed Abdullah; used for entity facts only. It gives his birth on 11 January 1959 in Jeddah, his single-club career at Al-Nassr, his Saudi Arabia record of 72 goals in 117 internationals, the AFC Asian Cup titles of 1984 and 1988, and his retirement in 1998."
  es: "Artículo de la Wikipedia en inglés sobre Majed Abdullah; utilizado únicamente para obtener información sobre la persona. En él se indica que nació el 11 de enero de 1959 en Yeda, su trayectoria en el Al-Nassr, su récord con Arabia Saudí de 72 goles en 117 partidos internacionales, los títulos de la Copa Asiática de la AFC de 1984 y 1988, y su retirada en 1998."
  fr: "Article de Wikipédia en anglais sur Majed Abdullah; utilisé uniquement pour les informations relatives à l'entité. Il mentionne sa naissance le 11 janvier 1959 à Djeddah, sa carrière au sein du club d'Al-Nassr, son record de 72 buts en 117 sélections internationales en Arabie saoudite, ses victoires à la Coupe d'Asie des nations de l'AFC en 1984 et 1988, et sa retraite en 1998."
  ur: "مجید عبداللہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 11 جنوری 1959 کو جدہ میں ان کی پیدائش، النصر میں ان کا سنگل کلب کیریئر، 117 بین الاقوامی میچوں میں 72 گول کرنے کا ان کا سعودی عرب ریکارڈ، 1984 اور 1988 کے اے ایف سی ایشین کپ ٹائٹل، اور 1998 میں ان کی ریٹائرمنٹ۔"
