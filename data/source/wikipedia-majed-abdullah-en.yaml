reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Abdullah as born 11 January 1959 in Jeddah (Al-Baghdadia district), second son of Ahmed Abdullah, his family moving to Riyadh in the mid-1960s; his whole club career at Al-Nassr with 189 league goals, six Saudi League top-scorer titles, five league titles and four King Cups; Saudi Arabia's all-time leading scorer with 72 goals in 117 games; Asian Cup winner in 1984 (scoring in the final) and 1988; retired in 1998; nicknamed 'The Arabian Pelé' and third in the IFFHS Asia Player of the Century vote. It makes no statement of his religion anywhere in its text, and none of its categories is a religion category."
