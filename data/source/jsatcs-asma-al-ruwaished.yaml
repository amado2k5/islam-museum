reliability_note: "An aggregator page reproducing Saudi consultation centres' own listings; used only for its Asiyah Centre entry, which names her as the centre's supervisor in Riyadh and describes her women's mobile subscription service. The personal telephone numbers printed in the listing are not reproduced in the museum's record. It gives no birth date and names no school of law for her. Read in full on 26 October 2026."
