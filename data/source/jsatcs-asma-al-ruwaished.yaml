summary:
  ar: "صفحة دليل لأرقام مستشارات العلاقات الزوجية والأسرية في السعودية؛ يرد فيها مركز آسية للاستشارات التربوية والأسرية بوصفه مركزًا نسائيًا متخصصًا بالاستشارات الأسرية والتربوية في منطقة الرياض، وأن المشرفة على المركز هي الأستاذة أسماء الرويشد، وأن لها خدمة جوال للنساء يُشترك فيها برقم 804999."
  en: "A directory page of Saudi marital and family consultation numbers; its entry for the Asiyah Centre for Educational and Family Consultations describes a women's centre specialising in family and educational consultations in the Riyadh region, names Asma Al-Ruwaished as the centre's supervisor, and gives her women's mobile subscription service on the short code 804999."
