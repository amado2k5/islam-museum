summary:
  ar: "مقالة ويكيبيديا الألبانية عن سامي فراشري؛ تُستخدم لوقائع الكيان فقط. توافق الإنجليزية في تاريخي ميلاده ⁦(1 يونيو 1850)⁩ ووفاته في إسطنبول ⁦(18 يونيو 1904)⁩، وتصف أسلافه من جهة الأب بأنهم ملّاك تيمار مسلمون بكتاشيون."
  en: "Albanian Wikipedia article on Sami Frashëri; used for entity facts only. It agrees with the English article on his birth (1 June 1850) and his death at Istanbul (18 June 1904), and describes his father's ancestors as Muslim Bektashi timar holders."
  es: "Artículo de la Wikipedia en albanés sobre Sami Frashëri; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento (1 de junio de 1850) y su muerte en Estambul (18 de junio de 1904), y describe a los antepasados de su padre como musulmanes bektashi poseedores de timar."
  fr: "Article de Wikipédia albanais sur Sami Frashëri; utilisé uniquement pour les informations relatives à l'entité. Il concorde avec l'article anglais concernant sa naissance (1er juin 1850) et sa mort à Istanbul (18 juin 1904), et décrit les ancêtres de son père comme des détenteurs de timar bektashi musulmans."
  ur: "سامی فریشری پر البانی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش ⁦(1 جون 1850)⁩ اور استنبول میں ان کی وفات ⁦(18 جون 1904)⁩ سے متعلق انگریزی مضمون سے متفق ہے، اور ان کے والد کے آباؤ اجداد کو مسلم بکتاشی تیمار رکھنے والوں کے طور پر بیان کرتا ہے۔"
