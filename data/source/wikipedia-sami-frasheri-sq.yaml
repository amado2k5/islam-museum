reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Its lead gives: Sami bey Frashëri, in his time Shemsedin Sami Bey (Şemseddin Sami Bey), born at Frashër on 1 June 1850, died at Istanbul on 18 June 1904; Ottoman civil servant and intellectual, linguist, lexicographer, encyclopedist, novelist, playwright and translator, 'the fundamental ideologue of the National Renaissance' together with his brothers Abdyl and Naim; in Turkish opinion known as 'the father of encyclopedists'. On the family's faith it says his father's line were 'pasardhës timarlinjsh muslimanë bektashi' — descendants of Muslim Bektashi timar holders — again a statement about the family's background, not an attestation of Sami's own affiliation, and the record treats it so."
