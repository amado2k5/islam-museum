summary:
  ar: "مقالة ويكيبيديا الأردية عن عبد الرحمن السديس؛ تُستخدم لوقائع الكيان فقط. تحمل رواية منافسة لمولده: 10 فبراير 1960 بالرياض، وتذكر إمامته ورئاسته لأمور الحرمين وجائزة الشخصية الإسلامية 2005، ولا تسمي مذهبا له."
  en: "Urdu Wikipedia article on Abdul Rahman Al-Sudais; used for entity facts only. It carries the competing birth tradition, 10 February 1960 at Riyadh, and records his imamate, his presidency of the Two Holy Mosques' affairs and the 2005 Islamic Personality award; it names no school for him."
  es: "Artículo de Wikipedia en urdu sobre Abdul Rahman Al-Sudais; se utiliza únicamente para obtener información sobre la persona. Recoge la tradición alternativa sobre su nacimiento, el 10 de febrero de 1960 en Riad, y registra su imamato, su presidencia de los asuntos de las Dos Mezquitas Sagradas y el premio a la Personalidad Islámica de 2005; no menciona ninguna escuela a la que pertenezca."
  fr: "L'article de Wikipédia en ourdou consacré à Abdul Rahman Al-Sudais, utilisé uniquement pour les informations relatives à l'entité, présente une version alternative de sa date de naissance (10 février 1960 à Riyad) et mentionne son imamat, sa présidence des affaires des Deux Saintes Mosquées et l'obtention du prix de la personnalité islamique en 2005. Aucune école n'y est cependant mentionnée."
  ur: "عبدالرحمن السدیس پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 10 فروری 1960 کو ریاض میں مسابقتی پیدائش کی روایت ہے، اور اس کی امامت، ان کی دو مقدس مساجد کے امور کی صدارت اور 2005 کے اسلامی شخصیت کا ایوارڈ؛ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Abdul Rahman Al-Sudais hakkında Urduca Wikipedia makalesi; yalnızca varlığın etkinlikleri için kullanılmıştır. Doğumuna dair rekabetçi bir anlatım içerir: 10 Şubat 1960, Riyad'da, İmam ve İki Kutsal Cami ile İslami Kişilik Ödülü 2005'teki liderliğinden bahsedilir, ancak düşünce okulu belirtilmez."
  id: "Artikel Wikipedia Urdu tentang Abdul Rahman Al-Sudais; digunakan hanya untuk acara entitas tersebut. Artikel ini memuat kisah kelahirannya yang bersaing: 10 Februari 1960 di Riyadh, menyebutkan Imamate dan kepemimpinannya di Dua Masjid Suci serta Penghargaan Kepribadian Islam 2005, tanpa menyebutkan aliran pemikirannya."
