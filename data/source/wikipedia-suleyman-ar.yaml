summary:
  ar: "مقالة ويكيبيديا العربية عن مصطفى سليمان، تصفه بأنه مبرمج بريطاني من أصل سوري وُلد في 1 أغسطس 1984، وأحد مؤسسي ديب مايند، والرئيس التنفيذي لقطاع الذكاء الاصطناعي في مايكروسوفت منذ 2024. لا تذكر أي انتماء ديني."
  en: "The Arabic Wikipedia article on Mustafa Suleyman, describing him as a British programmer of Syrian origin born 1 August 1984, a DeepMind co-founder and CEO of Microsoft AI since 2024. It names no religious affiliation."
  es: "El artículo de Wikipedia en árabe sobre Mustafa Suleyman lo describe como un programador británico de origen sirio, nacido el 1 de agosto de 1984, cofundador de DeepMind y director ejecutivo de Microsoft AI desde 2024. No menciona ninguna afiliación religiosa."
  fr: "L'article de Wikipédia en arabe sur Mustafa Suleyman le décrit comme un programmeur britannique d'origine syrienne né le 1er août 1984, cofondateur de DeepMind et PDG de Microsoft AI depuis 2024. Il ne mentionne aucune appartenance religieuse."
  ur: "مصطفیٰ سلیمان پر عربی ویکیپیڈیا کا مضمون، جس میں اسے شامی نژاد برطانوی پروگرامر کے طور پر بیان کیا گیا ہے جو 1 اگست 1984 کو پیدا ہوئے، ڈیپ مائنڈ 2024 سے Microsoft AI کے شریک بانی اور سی ای او ہیں۔ اس میں کسی مذہبی وابستگی کا نام نہیں ہے۔"
  tr: "Mustafa Suleiman hakkında Arapça Wikipedia makalesi, onu 1 Ağustos 1984 doğumlu, Suriye kökenli bir İngiliz programcı, DeepMind'ın kurucularından biri ve 2024'ten beri Microsoft'un yapay zeka bölümünün CEO'su olarak tanımlıyor. Dini bir aidiyeti belirtilmemektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang Mustafa Suleiman menggambarkannya sebagai seorang programmer Inggris keturunan Suriah yang lahir pada 1 Agustus 1984, salah satu pendiri DeepMind, dan CEO divisi AI Microsoft sejak 2024. Tidak ada afiliasi agama yang disebutkan."
