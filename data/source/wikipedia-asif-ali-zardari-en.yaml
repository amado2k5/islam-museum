summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن آصف علي زرداري؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 26 يوليو 1955 في كراتشي، وزواجه من بينظير بوتو سنة 1987، ووزاراته في حكومتها الثانية، واعتقالاته واتهاماته في التسعينيات بالفساد وبقتل مرتضى بوتو، وبراءاته في 1993–1994 وإطلاق سراحه سنة 2004، وقيادته حزب الشعب بعد اغتيالها، ورئاستيه ⁦(2008–2013 ومنذ 2024)⁩ والتعديل الدستوري الثامن عشر. وتُسجل التهم مع نتائجها كما يذكرها المقال."
  en: "English Wikipedia article on Asif Ali Zardari; used for entity facts only. It recounts his birth on 26 July 1955 at Karachi, his marriage to Benazir Bhutto in 1987, his ministries in her second government, his arrests and indictments in the 1990s for corruption and for the murder of Murtaza Bhutto, his acquittals of 1993–1994 and release in 2004, his leadership of the PPP after her assassination, his presidencies (2008–2013 and since 2024) and the Eighteenth Amendment. Charges are recorded with their outcomes as the article states them."
  es: "Artículo de la Wikipedia en inglés sobre Asif Ali Zardari; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 26 de julio de 1955 en Karachi, su matrimonio con Benazir Bhutto en 1987, sus ministerios en el segundo gobierno de ella, sus arrestos y acusaciones en la década de 1990 por corrupción y por el asesinato de Murtaza Bhutto, sus absoluciones de 1993-1994 y su liberación en 2004, su liderazgo del PPP tras el asesinato de Bhutto, sus presidencias (2008-2013 y desde 2024) y la Decimoctava Enmienda. Los cargos se registran con sus resultados tal como aparecen en el artículo."
  fr: "Article de Wikipédia en anglais sur Asif Ali Zardari; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance le 26 juillet 1955 à Karachi, son mariage avec Benazir Bhutto en 1987, ses fonctions ministérielles au sein de son second gouvernement, ses arrestations et mises en examen dans les années 1990 pour corruption et pour le meurtre de Murtaza Bhutto, ses acquittements de 1993-1994 et sa libération en 2004, sa prise de fonction à la tête du Parti du peuple pakistanais (PPP) après l'assassinat de Benazir Bhutto, ses présidences (de 2008 à 2013 et depuis 2024) et le dix-huitième amendement. Les accusations sont recensées avec leurs suites telles qu'elles apparaissent dans l'article."
  ur: "آصف علی زرداری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 26 جولائی 1955 کو کراچی میں ان کی پیدائش، 1987 میں بے نظیر بھٹو سے ان کی شادی، ان کی دوسری حکومت میں ان کی وزارتیں، 1990 کی دہائی میں کرپشن اور مرتضیٰ بھٹو کے قتل کے الزام میں ان کی گرفتاریاں اور فرد جرم، 1993-1994 میں ان کی بریت اور پی پی پی کی قیادت، 40 میں ان کی قیادت کی رہائی کا ذکر ہے۔ صدارت ⁦(2008–2013 اور 2024 سے)⁩ اور اٹھارویں ترمیم۔ الزامات کو ان کے نتائج کے ساتھ ریکارڈ کیا جاتا ہے جیسا کہ مضمون میں بتایا گیا ہے۔"
  tr: "Asif Ali Zardari hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 26 Temmuz 1955'te Karaçi'de doğmasını, 1987'de Benazir Bhutto ile evliliğini, onun ikinci hükümetindeki bakanlıklarını, 1990'larda tutuklanmalarını ve yolsuzluk suçlamalarını, Murtadha Bhutto'nun öldürülmesini ve 1993–1994'te beraat etmelerini, 2004'te serbest bırakılmasını, onun suikastından sonra Halk Partisi'nin liderliğini, başkanlığını (2008–2013 ve 2024'ten itibaren) ve on sekizinci anayasa değişikliğini anlatır. Suçlamalar, makalede belirtilen sonuçlarıyla birlikte kaydedilmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Asif Ali Zardari; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada 26 Juli 1955 di Karachi, pernikahannya dengan Benazir Bhutto pada tahun 1987, kementeriannya dalam pemerintahan kedua Benazir, penangkapan dan tuduhan pada tahun 1990-an atas korupsi dan pembunuhan Murtadha Bhutto, pembebasannya pada 1993–1994, pembebasannya pada 2004, kepemimpinannya di Partai Rakyat setelah pembunuhan Benazir Bhutto, kepresidenannya (2008–2013 dan sejak 2024), serta amandemen konstitusi kedelapan belas. Tuduhan tersebut dicatat beserta hasilnya seperti yang disebutkan dalam artikel."
