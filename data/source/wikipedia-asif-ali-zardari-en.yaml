summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن آصف علي زرداري؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 26 يوليو 1955 في كراتشي، وزواجه من بينظير بوتو سنة 1987، ووزاراته في حكومتها الثانية، واعتقالاته واتهاماته في التسعينيات بالفساد وبقتل مرتضى بوتو، وبراءاته في 1993–1994 وإطلاق سراحه سنة 2004، وقيادته حزب الشعب بعد اغتيالها، ورئاستيه (2008–2013 ومنذ 2024) والتعديل الدستوري الثامن عشر. وتُسجل التهم مع نتائجها كما يذكرها المقال."
  en: "English Wikipedia article on Asif Ali Zardari; used for entity facts only. It recounts his birth on 26 July 1955 at Karachi, his marriage to Benazir Bhutto in 1987, his ministries in her second government, his arrests and indictments in the 1990s for corruption and for the murder of Murtaza Bhutto, his acquittals of 1993–1994 and release in 2004, his leadership of the PPP after her assassination, his presidencies (2008–2013 and since 2024) and the Eighteenth Amendment. Charges are recorded with their outcomes as the article states them."
