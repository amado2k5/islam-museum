summary:
  ar: "مدخل «رهبان» في موسوعة TDV الإسلامية: لفظة راهب ورهبانية في القرآن والتفسير، ومدح المفسرين للرهبان والذمّ في آيات أخرى، وحديث ترك الرهبانية، ثم التمييز بين الكشيش المنزوي في الصومعة وراهب الكنيسة أو القسيس الذي يدير العبادة ويعلّم ويفسّر النص، ونشأة الكهنوت ومراتبه: الأسقف والقسيس والشمّاس."
  en: "The TDV İslâm Ansiklopedisi entry on the ruhbān: the words râhib and rahbâniyye in the Qur'an and tafsir, the monks praised and blamed across the verses, the hadith giving up the monastic life, and then the distinction between the keşiş withdrawn in the monastery and the church priest or papaz who leads worship, teaches and interprets the text, with the origins and grades of priesthood: bishop, presbyter, deacon."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el ruhbān: las palabras râhib y rahbâniyye en el Corán y el tafsir, los monjes elogiados y censurados a lo largo de los versículos, el hadiz sobre el abandono de la vida monástica, y luego la distinción entre el keşiş retirado en el monasterio y el sacerdote de la iglesia o papaz que dirige el culto, enseña e interpreta el texto, con los orígenes y grados del sacerdocio: obispo, presbítero, diácono."
