reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It confirms her birth at Gjakova — which it gives in its other form, Đakovica — to a Kosovo Albanian family of Berisha ancestry from northern Albania, her law graduation from the University of Pristina in 2000, her 2006/07 Leicester programme in police management and criminal law, her training at the George C. Marshall Center and the FBI National Academy and her 2007 University of Virginia crime-science certification; her police career from major through colonel to major general, her deputy directorship and brief acting directorship in 2010, and the American officers' and diplomats' attention she drew before her candidacy. It names no religion for her."
