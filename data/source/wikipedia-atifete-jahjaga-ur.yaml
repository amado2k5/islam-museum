summary:
  ar: "مقالة ويكيبيديا الأردية عن عاطفة يحيى آغا؛ تُستخدم لوقائع الكيان فقط وتؤكد أنها ثالث رئيس لكوسوفو وأول امرأة وأول مرشح غير حزبي فيه، وتفصّل دراستها ومسيرتها الشرطية حتى رتبة جنرال ملازم أول."
  en: "Urdu Wikipedia article on Atifete Jahjaga; used for entity facts only, confirming her as Kosovo's third president, its first woman and first non-partisan candidate, and detailing her studies and her police career to the rank of general lieutenant colonel."
  es: "Artículo de Wikipedia en urdu sobre Atifete Jahjaga; utilizado únicamente para datos sobre la persona, que la confirma como la tercera presidenta de Kosovo, su primera mujer y la primera candidata no partidista, y detalla sus estudios y su carrera policial hasta el rango de teniente coronel general."
  fr: "Article de Wikipédia en ourdou sur Atifete Jahjaga; utilisé uniquement pour les faits concernant l'entité, confirmant qu'elle est la troisième présidente du Kosovo, sa première femme et sa première candidate non partisane, et détaillant ses études et sa carrière dans la police jusqu'au grade de lieutenant-colonel général."
  ur: "اردو ویکیپیڈیا مضمون عاطفے جھگڑا؛ کوسوو کے تیسرے صدر، اس کی پہلی خاتون اور پہلی غیر متعصب امیدوار کے طور پر اس کی تصدیق کرتے ہوئے، اور اس کی تعلیم اور اس کے پولیس کیرئیر کو جنرل لیفٹیننٹ کرنل کے عہدے تک بیان کرنے کے لیے استعمال کیا گیا۔"
  tr: "Atefat Yahya Ağa hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılıyor ve onun Kosova'nın üçüncü cumhurbaşkanı, ilk kadın ve oradaki ilk partizan olmayan aday olduğunu doğruluyor. Eğitimini ve polis kariyerini Korgeneral rütbesine kadar detaylandırıyor."
  id: "Artikel Wikipedia Urdu tentang Atefat Yahya Agha; hanya digunakan untuk fakta entitas tersebut dan mengonfirmasi bahwa dia adalah presiden ketiga Kosovo, wanita pertama, dan kandidat non-partisan pertama di sana. Artikel tersebut merinci studi dan karier kepolisiannya hingga pangkat Letnan Jenderal."
