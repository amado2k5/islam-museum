reliability_note: "The item is a scan of the poet's published Diwan, uploaded 18 January 2014; the descriptive metadata travels with the book and is used here only for its plain statement of his discipleship under Abdul Ghani Manglori. Read on 26 October 2026. It is a carrier independent of the Wikipedia articles: it does not repeat their wording and it names the shaykh with his nisba (Manglori) where the Urdu article names him simply Shah Abdul Ghani."
