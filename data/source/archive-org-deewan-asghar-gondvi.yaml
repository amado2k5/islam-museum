  ar: "صفحة «ديوان أصغر غوندوي» في أرشيف الإنترنت؛ يصف وصفُها النصيّ الشاعر بأنه كان مريدا لحضرة عبد الغني المنغلوري، وأخا في الطريقة (پير بھائی) لجيجار مورادابادي، ويصنّف الديوان في التصوف والسلوك."
  en: "Internet Archive item page for the Diwan-e-Asghar Gondvi. Its descriptive text states that Asghar was a murid (disciple) of Hazrat Abdul Ghani Manglori and a pir-bhai (fellow-disciple) of Jigar Moradabadi, and classifies the Diwan under tasawwuf and suluk (Sufi conduct)."
