summary:
  ar: "صفحة «ديوان أصغر غوندوي» في أرشيف الإنترنت؛ يصف وصفُها النصيّ الشاعر بأنه كان مريدا لحضرة عبد الغني المنغلوري، وأخا في الطريقة ⁦(پير بھائی)⁩ لجيجار مورادابادي، ويصنّف الديوان في التصوف والسلوك."
  en: "Internet Archive item page for the Diwan-e-Asghar Gondvi. Its descriptive text states that Asghar was a murid (disciple) of Hazrat Abdul Ghani Manglori and a pir-bhai (fellow-disciple) of Jigar Moradabadi, and classifies the Diwan under tasawwuf and suluk (Sufi conduct)."
  es: "Página del artículo del Archivo de Internet para el Diwan-e-Asghar Gondvi. Su texto descriptivo afirma que Asghar fue un murid (discípulo) de Hazrat Abdul Ghani Manglori y un pir-bhai (compañero discípulo) de Jigar Moradabadi, y clasifica el Diwan dentro del tasawwuf y el suluk (conducta sufí)."
  fr: "Page d'archive Internet consacrée au Diwan-e-Asghar Gondvi. Son texte descriptif indique qu'Asghar était un murid (disciple) de Hazrat Abdul Ghani Manglori et un pir-bhai (compagnon-disciple) de Jigar Moradabadi, et classe le Diwan sous les rubriques tasawwuf et suluk (conduite soufie)."
