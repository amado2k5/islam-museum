summary:
  ar: "مدخل «حكيم باشي» في موسوعة TDV الإسلامية (المجلد 17، إسطنبول 1998، ص 160–164)، في جزأين: الأول بقلم جميل أكپنار عن رئيس الأطباء في الإسلام وامتحان الأطباء وإجازتهم، والثاني بقلم نيل ساري عن الحكيم باشي في الدولة العثمانية وإلغاء منصبه سنة 1850."
  en: "The TDV İslâm Ansiklopedisi entry 'HEKİMBAŞI' (vol. 17, Istanbul 1998, pp. 160–164), in two parts: the first by Cemil Akpınar on the head of physicians in Islamic states, the examination and licensing of physicians; the second by Nil Sarı on the Ottoman chief physician and the end of the office in 1850."
title: "HEKİMBAŞI"
author: [{ family: "Akpınar", given: "Cemil" }, { family: "Sarı", given: "Nil" }]
issued: { "date-parts": [[1998]] }
