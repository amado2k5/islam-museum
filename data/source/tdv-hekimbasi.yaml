label: { ar: "الحكيم باشي — موسوعة TDV الإسلامية ⁦(جميل أكپنار ونيل ساري)⁩", en: "HEKİMBAŞI (chief physician) — TDV İslâm Ansiklopedisi (Cemil Akpınar and Nil Sarı)" }
summary:
  ar: "مدخل «حكيم باشي» في موسوعة TDV الإسلامية ⁦(المجلد 17، إسطنبول 1998، ص 160–164)⁩، في جزأين: الأول بقلم جميل أكپنار عن رئيس الأطباء في الإسلام وامتحان الأطباء وإجازتهم، والثاني بقلم نيل ساري عن الحكيم باشي في الدولة العثمانية وإلغاء منصبه سنة 1850."
  en: "The TDV İslâm Ansiklopedisi entry 'HEKİMBAŞI' (vol. 17, Istanbul 1998, pp. 160–164), in two parts: the first by Cemil Akpınar on the head of physicians in Islamic states, the examination and licensing of physicians; the second by Nil Sarı on the Ottoman chief physician and the end of the office in 1850."
  es: "La entrada 'HEKİMBAŞI' de la TDV İslâm Ansiklopedisi (vol. 17, Estambul 1998, pp. 160–164) consta de dos partes: la primera, de Cemil Akpınar, sobre el jefe de los médicos en los estados islámicos, el examen y la concesión de licencias a los médicos; la segunda, de Nil Sarı, sobre el médico jefe otomano y el fin del cargo en 1850."
  fr: "L'entrée TDV İslâm Ansiklopedisi 'HEKİMBAŞI' (vol. 17, Istanbul 1998, pp. 160–164), en deux parties: la première par Cemil Akpınar sur le chef des médecins dans les États islamiques, l'examen et l'agrément des médecins; la seconde par Nil Sarı sur le médecin en chef ottoman et la fin de la fonction en 1850."
  ur: "TDV İslâm Ansiklopedisi اندراج 'HEKİMBAŞI' ⁦(جلد 17، استنبول 1998، صفحہ 160–164)⁩، دو حصوں میں: پہلا سیمل اکپنار کی طرف سے اسلامی ریاستوں میں ڈاکٹروں کے سربراہ پر، ڈاکٹروں کا معائنہ اور لائسنسنگ؛ دوسرا نیل ساری کا عثمانی چیف فزیشن پر اور 1850 میں دفتر کا خاتمہ۔"
  tr: "TDV İslami Ansiklopedisi'nde (Cilt 17, İstanbul 1998, ss. 160–164) \"Hakim Başı\"nın iki bölüm halinde kaydı: ilki Cemil Akpenar'ın İslam'daki Baş Hekimler, doktorların muayenesi ve yetkilendirmesi hakkında, ikincisi ise Neil Sari'nin Osmanlı İmparatorluğu'ndaki Hakim Başı ve 1850'de görevinin kaldırılması hakkında."
  id: "Entri \"Hakim Bashi\" dalam Ensiklopedia Islam TDV (Volume 17, Istanbul 1998, hlm. 160–164), dalam dua bagian: yang pertama oleh Cemil Akpenar tentang Kepala Dokter dalam Islam, pemeriksaan dokter dan otorisasi mereka, dan yang kedua oleh Neil Sari tentang Hakim Bashi di Kekaisaran Ottoman dan penghapusan jabatannya pada tahun 1850."
