language: tr
reliability_note: "Read in full on 1 November 2026 in the web edition, both parts (Akpınar, printed pp. 160–161; Sarı, printed pp. 161–164). The entry's bibliography names Ibn Abi Usaybia, Ruhawi, Shayzari, Ibn al-Ukhuwwa, Ibn Fadl Allah al-Umari, Qalqashandi, Ahmed Isa Bey and Terzioğlu; these were not read for this record and are cited only as the entry reports them. The entry is the museum's source for the examination system of the Abbasid period, the licensing practice and the Ottoman hekimbaşı."
