summary:
  ar: "مقالة ويكيبيديا الروسية عن علي حاجي الأكوشينسكي؛ تُستخدم لوقائع الكيان فقط. تعطي سنتي 1847–1930 وأكوشا مكانا لمولده ووفاته، ودراسته عند عبد الرحمن السوغوري وغيره، وأنه «كان له مريدون كثيرون» في نواحي تمير خان شورا ودارغين وقايطاغو تاباساران، وقوله إنه سيجعل الأكوشيين «مريديّ»، وخطته المشتركة مع أوزون حاجي سنة 1919، وتنبّه إلى أن جميع المنشورات تعطي وفاته سنة 1930 بينما كتب ابنه الأصغر إلياس مرارا أنها سنة 1931."
  en: "Russian Wikipedia article on Ali-Hajji Akushinsky; used for entity facts only. It gives the years 1847–1930 and Akusha as his birth and death place, his study under Abdurrahman as-Suguri and others, that he 'had many murids' in the Temir-Khan-Shura, Dargin and Kaytago-Tabasaran districts, his own words that he would make the people of Akusha 'my murids', his joint 1919 plan with Uzun-Hajji, and notes that all publications give his death in 1930 while his younger son Ilyas repeatedly wrote that he died in 1931."
title: "Али-Хаджи Акушинский"
