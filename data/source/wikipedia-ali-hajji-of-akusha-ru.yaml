summary:
  ar: "مقالة ويكيبيديا الروسية عن علي حاجي الأكوشينسكي؛ تُستخدم لوقائع الكيان فقط. تعطي سنتي 1847–1930 وأكوشا مكانا لمولده ووفاته، ودراسته عند عبد الرحمن السوغوري وغيره، وأنه «كان له مريدون كثيرون» في نواحي تمير خان شورا ودارغين وقايطاغو تاباساران، وقوله إنه سيجعل الأكوشيين «مريديّ»، وخطته المشتركة مع أوزون حاجي سنة 1919، وتنبّه إلى أن جميع المنشورات تعطي وفاته سنة 1930 بينما كتب ابنه الأصغر إلياس مرارا أنها سنة 1931."
  en: "Russian Wikipedia article on Ali-Hajji Akushinsky; used for entity facts only. It gives the years 1847–1930 and Akusha as his birth and death place, his study under Abdurrahman as-Suguri and others, that he 'had many murids' in the Temir-Khan-Shura, Dargin and Kaytago-Tabasaran districts, his own words that he would make the people of Akusha 'my murids', his joint 1919 plan with Uzun-Hajji, and notes that all publications give his death in 1930 while his younger son Ilyas repeatedly wrote that he died in 1931."
  es: "Artículo de la Wikipedia rusa sobre Ali-Hajji Akushinsky; utilizado únicamente para datos sobre la persona. Indica los años 1847-1930 y Akusha como su lugar de nacimiento y muerte, sus estudios con Abdurrahman as-Suguri y otros, que \"tuvo muchos murids\" en los distritos de Temir-Khan-Shura, Dargin y Kaytago-Tabasaran, sus propias palabras de que haría de la gente de Akusha \"mis murids\", su plan conjunto de 1919 con Uzun-Hajji, y señala que todas las publicaciones indican su muerte en 1930, mientras que su hijo menor, Ilyas, escribió repetidamente que murió en 1931."
  fr: "L'article de Wikipédia russe sur Ali-Hajji Akushinsky, utilisé uniquement pour les informations factuelles, indique les années 1847-1930, Akushinsky comme lieu de naissance et de décès, ses études auprès d'Abdurrahman as-Suguri et d'autres, le fait qu'il avait de nombreux disciples dans les districts de Temir-Khan-Shura, Dargin et Kaytago-Tabasaran, ses propres propos selon lesquels il ferait des habitants d'Akusha « ses disciples », son projet commun de 1919 avec Uzun-Hajji, et note que toutes les publications font remonter son décès à 1930, tandis que son fils cadet, Ilyas, a écrit à plusieurs reprises qu'il était mort en 1931."
  ur: "علی-حاجی اکوشنسکی پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں سال 1847-1930 اور اکوشا کو اس کی پیدائش اور موت کی جگہ، عبدالرحمن الصغوری اور دیگر کے تحت اس کا مطالعہ بتایا گیا ہے کہ تیمر خان شوریٰ، دارگین اور کیتاگو-تباسران اضلاع میں اس کے بہت سے مرید تھے، اس کے اپنے الفاظ کہ وہ اکوشا کے لوگوں کو 'میرا مرید' بنائے گا، اس کے ساتھ مل کر منصوبہ بندی نہیں کی گئی۔ تمام اشاعتیں ان کی وفات 1930 میں بتاتی ہیں جبکہ ان کے چھوٹے بیٹے الیاس نے بار بار لکھا کہ ان کا انتقال 1931 میں ہوا۔"
  tr: "Ali Hacı Akushinsky hakkında Rusça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılır. 1847–1930 yılları ve Akusha, doğum ve ölüm yerini, Abdul Rahman al-Sughuri ve diğerleriyle yaptığı çalışmayı, Temir Han Şura, Dargin ve Kaytagu Tabesaran bölgelerinde \"birçok takipçisi olduğunu\" ve Akuşileri \"benim müritlerim\" yapacağına dair açıklamasını ve 1919'da Ozun Haji ile ortak planını belirtir. Tüm yayınların ölümünün 1930'da olduğunu, küçük oğlu Elias'ın ise defalarca 1931 olduğunu yazdığını belirtir."
  id: "Artikel Wikipedia Rusia tentang Ali Haji Akushinsky hanya digunakan untuk fakta-fakta entitas tersebut. Tahun 1847–1930 dan Akusha mencantumkan tempat kelahiran dan kematiannya, studinya bersama Abdul Rahman al-Sughuri dan lainnya, serta bahwa ia \"memiliki banyak pengikut\" di bidang Temir Khan Shura, Dargin, dan Kaytagu Tabasaran, serta pernyataannya bahwa ia akan menjadikan Akushian \"muridku,\" dan rencana bersamanya dengan Ozun Haji pada tahun 1919. Ia mencatat bahwa semua publikasi menyebutkan kematiannya pada tahun 1930, sementara putra bungsunya Elias berulang kali menulis bahwa itu adalah tahun 1931."
