  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم إنياس (1900–1975)، زعيم الطريقة التيجانية في غرب إفريقيا وصاحب الفيضة؛ تُستخدم لوقائع الكيان فقط. تصفه صراحة بأنه قائد رئيسي للطريقة التيجانية الصوفية، وتسجل فرعه بوصفه أكبر فروع التيجانية في العالم."
