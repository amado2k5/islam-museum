reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id via the MediaWiki API and the returned id asserted equal. It gives his birth on 8 November 1900 at Tayba Ñaseen near Kaolack and his death on 26 July 1975 in London. Its lead states his own standing in the order (a major leader of the Tijani Sufi order; in 1929 he announced he had been given the key to the secrets of divine knowledge and had become khalifa of Shaykh Tijani in the order), and its infobox gives tariqa Tijani with disciple_of Ahmed Skirej, denomination Sunni, and jurisprudence Maliki and creed Ash'ari — the last two referenced to Brigaglia 2013 in the Journal of Qur'anic Studies. No text in the article names his madhhab."
