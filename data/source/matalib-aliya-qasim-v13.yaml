label: { ar: "المطالب العالية بزوائد المسانيد الثمانية، المجلد الثالث عشر ⁦(تحقيق قاسم صالح القاسم)⁩", en: "al-Matalib al-Aliya, vol. 13 (ed. Qasim Salih al-Qasim, Dar al-Ghayth)" }
summary:
  ar: "الطبعة الأولى ⁦(الرياض، دار الغيث، 1420هـ/2000م)⁩ للمجلد الثالث عشر من المطالب العالية لابن حجر، بتحقيق قاسم صالح القاسم وتنسيق سعد بن ناصر الشثري؛ يضم كتاب العلم من الباب 36 والأبواب إلى الأذكار، وأرقام الأحاديث من 3100 إلى 3373."
  en: "First edition (Riyadh, Dar al-Ghayth, 1420 AH / 2000 CE) of volume 13 of Ibn Hajar's al-Matalib al-Aliya, edited by Qasim Salih al-Qasim and coordinated by Sa'd ibn Nasir al-Shathri; it covers the end of the Book of Knowledge and the opening of the Book of Remembrance, hadiths 3100 to 3373 in the edition's numbering."
  es: "Primera edición (Riad, Dar al-Ghayth, 1420 AH / 2000 d. C.) del volumen 13 de al-Matalib al-Aliya de Ibn Hajar, editado por Qasim Salih al-Qasim y coordinado por Sa'd ibn Nasir al-Shathri; abarca el final del Libro del Conocimiento y el comienzo del Libro del Recuerdo, hadices del 3100 al 3373 según la numeración de la edición."
  fr: "Première édition (Riyad, Dar al-Ghayth, 1420 AH / 2000 CE) du volume 13 de l'al-Matalib al-Aliya d'Ibn Hajar, édité par Qasim Salih al-Qasim et coordonné par Sa'd ibn Nasir al-Shathri; il couvre la fin du Livre de la Connaissance et le début du Livre du Souvenir, hadiths 3100 à 3373 dans la numérotation de l'édition."
  ur: "ابن حجر کی المطلب العالیہ کی جلد 13 کا پہلا ایڈیشن ⁦(ریاض، دار الغیث، 1420 ہجری / 2000 عیسوی)⁩، قاسم صالح القاسم کی طرف سے تدوین اور سعد ابن ناصر الشطری کی طرف سے مربوط؛ اس میں علم کی کتاب کے اختتام اور یاد کی کتاب کے آغاز کا احاطہ کیا گیا ہے، ایڈیشن کی تعداد میں احادیث 3100 سے 3373 تک ہیں۔"
  tr: "İbn Hajar'ın 'El-Matalib El-Aaliyyah' adlı eserinin on üçüncü cildinin ilk baskısı (Riyad, Dar Al-Ghaith, 1420 Hicri / 2000 M.S.) Kasım Salih Al-Kasim tarafından düzenlenmiş ve Saad bin Nasir Al-Shathri tarafından koordine edilmiştir; 36. Bölümden Bilgi Kitabı'nı, Edkarlara Bölümleri ve 3100'den 3373'e kadar olan hadis numaralarını içerir."
  id: "Edisi pertama (Riyadh, Dar Al-Ghaith, 1420 H / 2000 M) dari jilid tiga belas 'Al-Matalib Al-Aaliyyah' karya Ibn Hajar, yang disunting oleh Qasim Salih Al-Qasim dan dikoordinasikan oleh Saad bin Nasir Al-Shathri; mencakup Kitab Pengetahuan dari Bab 36 dan Bab untuk Adhkar, serta nomor hadis dari 3100 hingga 3373."
title: "المطالب العالية بزوائد المسانيد الثمانية، المجلد الثالث عشر"
