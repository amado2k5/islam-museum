  ar: "نسخ رقمي عام على موقع ArabicGenius لكتاب «عجائب الآثار في التراجم والأخبار» ⁦(1931 صفحة، الطبعة غير محددة على الموقع)⁩؛ قُرئت ترجمة حسن الجبرتي في صفحاته 457–460 مباشرة: فهرس مطولات أوسع، ومقطع «الآلات النافعة المبتدعة» الذي يذكر «الآلة المربعة لمعرفة الجهات والسمت والانحرافات» و«الدائرة التاريخية» و«بركار الدرجة»، وخبر إصلاح الموازين والقبابين."
  en: "Public-domain digital transcription of Aja'ib al-athar fi al-tarajim wa-l-akhbar on ArabicGenius (1931 pages; edition not identified on the site); Hasan al-Jabarti's obituary read live at pages 457–460: a longer list of compositions, the passage 'the invented useful instruments' naming the square instrument for directions, azimuth and inclinations plus 'the historical circle' and 'barqar al-daraja', and the account of the weights-and-measures reform."
  ur: "عجائب الآثار فی التراجم والأخبار کی Digital نقلیں ⁦(ArabicGenius پر، 1931 صفحات؛ ایڈیشن سائٹ پر غیر مخصوص)⁩؛ حسن الجبرتی کا ترجمہ صفحہ 457–460 براہ راست پڑھا گیا: مصنفات کی لمبی فہرست، «مفید ایجاد کردہ آلات» کا اقتباس جس میں سمتیں، سمتِ افق اور میلان کا مربع آلہ، «تاریخی دائرہ» اور «برکار الدرجہ» شامل ہیں، اور پیمانے و تول کی اصلاح کی خبر۔"
  es: "Transcripción digital de dominio público de Aja'ib al-athar fi al-tarajim wa-l-akhbar en ArabicGenius (1931 páginas; edición no identificada en el sitio); la necrología de Hasan al-Jabarti leída en directo en las páginas 457-460: una lista más extensa de composiciones, el pasaje \"los instrumentos útiles inventados\" que nombra el instrumento cuadrado para direcciones, acimut e inclinaciones, además de \"el círculo histórico\" y \"barqar al-daraja\", y el relato de la reforma de pesos y medidas."
