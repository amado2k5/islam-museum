reliability_note: "Pages 457–460 fetched live on 2026-11-15. The site presents the book as public domain across 1931 pages but does not identify the underlying print edition; pagination differs from both the Moreh 2013 and Dar al-Jil editions. The obituary at these pages matches Hasan al-Jabarti's biography detail-for-detail (1159 Frankish students, instruments collection, sundial installations, treatise list overlapping the Moreh obituary, son Ali's death in 1179 at age twelve, withdrawal to the Sanadiyya), so it is read as a wider recension of the same obituary — used only to corroborate and enrich the instrument passage, never to override the Moreh text. The year reading 'ithnatayn wa-sab'in' in the weights-reform notice is left unconverted."
