summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ما فولو؛ تُستخدم لوقائع الكيان فقط. تذكر جنرالًا مسلمًا صينيًا وُلد في لينشيا سنة 1854 ابنًا للجنرال ما تشيانلينغ، قمع ثورة الدونغان 1895–1896 ضمن قوات «شجعان قانسو»، وقُتل في معركة بكين سنة 1900 عند بوابة تشنغيانغ وهو يقاتل تحالف الدول الثماني؛ ولا تسمّي له مذهبًا ولا طريقة."
  en: "English Wikipedia article on Ma Fulu; used for entity facts only. It records a Chinese Muslim general born at Linxia in 1854, son of General Ma Qianling, who helped suppress the Dungan revolt of 1895–1896 with the Kansu Braves and was killed at the Zhengyang Gate in the Battle of Peking in 1900 fighting the Eight-Nation Alliance; it names no school or order for him."
