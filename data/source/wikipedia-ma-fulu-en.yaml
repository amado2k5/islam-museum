reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026, fetched through the MediaWiki API by its recorded revision id with the returned id asserted equal. It rests on Lipman, Familiar Strangers (2004), pp. 168–169, and Dillon (1999), p. 137. It gives his birth (1854, Linxia County) and death (1900, Beijing) at year precision only; its statement that his remains were moved to Yangzhushan in Linxia County in 1995 conflicts with the Chinese article's statement that his son Ma Hongbin moved them home in 1950 — the discrepancy is carried in his record's prose, not resolved. Its hatnote distinguishes him from the Peking opera actor of the same name. Its categories file him under Chinese Muslims and Qing dynasty Muslims; categories are filings, not attestation."
