summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ما فولو؛ تُستخدم لوقائع الكيان فقط. تذكر جنرالًا مسلمًا صينيًا وُلد في لينشيا سنة 1854 ابنًا للجنرال ما تشيانلينغ، قمع ثورة الدونغان 1895–1896 ضمن قوات «شجعان قانسو»، وقُتل في معركة بكين سنة 1900 عند بوابة تشنغيانغ وهو يقاتل تحالف الدول الثماني؛ ولا تسمّي له مذهبًا ولا طريقة."
  en: "English Wikipedia article on Ma Fulu; used for entity facts only. It records a Chinese Muslim general born at Linxia in 1854, son of General Ma Qianling, who helped suppress the Dungan revolt of 1895–1896 with the Kansu Braves and was killed at the Zhengyang Gate in the Battle of Peking in 1900 fighting the Eight-Nation Alliance; it names no school or order for him."
  es: "Artículo de la Wikipedia en inglés sobre Ma Fulu; utilizado únicamente para datos sobre la persona. Describe a un general musulmán chino nacido en Linxia en 1854, hijo del general Ma Qianling, que ayudó a sofocar la revuelta Dungan de 1895-1896 con los Kansu Braves y murió en la Puerta de Zhengyang en la Batalla de Pekín en 1900 luchando contra la Alianza de las Ocho Naciones; no menciona ninguna escuela u orden a la que perteneció."
  fr: "Article de Wikipédia en anglais sur Ma Fulu; utilisé uniquement pour les informations sur l'entité. Il relate la naissance d'un général musulman chinois à Linxia en 1854, fils du général Ma Qianling, qui participa à la répression de la révolte des Dungans de 1895-1896 avec les Braves du Kansu et fut tué à la porte de Zhengyang lors de la bataille de Pékin en 1900, aux côtés de l'Alliance des Huit Nations; l'article ne mentionne ni école ni ordre religieux."
  ur: "ما فلو پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1854 میں لنکسیا میں پیدا ہونے والے ایک چینی مسلمان جنرل کو ریکارڈ کیا گیا ہے، جو جنرل ما کیانلنگ کا بیٹا تھا، جس نے کانسو بہادروں کے ساتھ 1895-1896 کی ڈنگان بغاوت کو دبانے میں مدد کی اور 1900 میں پیکنگ کی جنگ میں ژینگ یانگ گیٹ پر آٹھ ملکی اتحاد سے لڑتے ہوئے مارا گیا۔ اس میں اس کے لیے کسی اسکول یا آرڈر کا نام نہیں ہے۔"
