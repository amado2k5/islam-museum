reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and its content checked against the recorded revision. It gives Jonathan William Davis, born 10 April 1970 in Manhattan, New York City; his central role in A Tribe Called Quest and The Ummah; the solo albums Amplified (1999), The Renaissance (2008) and Kamaal the Abstract (2009); his 2024 induction into the Rock and Roll Hall of Fame with the group; and his Kennedy Center and NYU appointments. On his faith it states once, in the personal-life section, that he converted to Islam in the mid-1990s and changed his name to Kamaal Ibn John Fareed, citing Time magazine of 6 December 1999; it also notes that the lyrical themes of Beats, Rhymes and Life (1996) were inspired by the conversion. No school is named anywhere in the article."
