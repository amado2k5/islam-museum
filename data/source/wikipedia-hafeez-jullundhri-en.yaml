summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أبي الأثر حفيظ جالندهري؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 14 كانون الثاني 1900 في جالاندهار في أسرة بنجابية مسلمة، وهجرته إلى لاهور سنة 1947، وكتابته كلمات النشيد الوطني الباكستاني و«شاهنامة الإسلام»، ووفاته في لاهور في 21 كانون الأول 1982."
  en: "English Wikipedia article on Abul Asar Hafeez Jalandhari (Jullundhri); used for entity facts only. It recounts his birth on 14 January 1900 in Jalandhar into a Punjabi Muslim family, his migration to Lahore in 1947, his writing of the lyrics of Pakistan's national anthem and of the Shahnama-e-Islam, and his death in Lahore on 21 December 1982."
  es: "Artículo de la Wikipedia en inglés sobre Abul Asar Hafeez Jalandhari (Jullundhri); utilizado únicamente para datos sobre la persona. Relata su nacimiento el 14 de enero de 1900 en Jalandhar en el seno de una familia musulmana punjabí, su migración a Lahore en 1947, la autoría de la letra del himno nacional de Pakistán y del Shahnama-e-Islam, y su fallecimiento en Lahore el 21 de diciembre de 1982."
  fr: "Article de Wikipédia en anglais sur Abul Asar Hafeez Jalandhari (Jullundhri); utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance le 14 janvier 1900 à Jalandhar dans une famille musulmane punjabie, son émigration à Lahore en 1947, la composition des paroles de l'hymne national du Pakistan et du Shahnama-e-Islam, et sa mort à Lahore le 21 décembre 1982."
  ur: "ابوالعصر حفیظ جالندھری ⁦(جالندھری)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 14 جنوری 1900 کو جالندھر میں ایک پنجابی مسلمان گھرانے میں، 1947 میں ان کی لاہور ہجرت، پاکستان کے قومی ترانے اور شاہنامہ اسلام کے گیت لکھنے اور 21 دسمبر 1982 کو لاہور میں ان کی موت کا ذکر ہے۔"
  tr: "Abu al-Athar Hafız Jalandhari hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 14 Ocak 1900'de Jalandhar'da Müslüman bir Pencaplı ailede doğmasını, 1947'de Lahor'a göçünü ve Pakistan milli marşı ile \"İslam'ın Şehnamehi\"nin sözlerini yazmasını anlatır. 21 Aralık 1982'de Lahor'da hayatını kaybetti."
  id: "Artikel Wikipedia bahasa Inggris tentang Abu al-Athar Hafiz Jalandhari; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 14 Januari 1900 di Jalandhar dalam keluarga Muslim Punjabi, migrasinya ke Lahore pada tahun 1947, dan penulisan lirik lagu kebangsaan Pakistan serta \"Shahnameh of Islam.\" Ia meninggal di Lahore pada 21 Desember 1982."
