  ar: "مقالة ويكيبيديا الإنجليزية عن أبي الأثر حفيظ جالندهري؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 14 كانون الثاني 1900 في جالاندهار في أسرة بنجابية مسلمة، وهجرته إلى لاهور سنة 1947، وكتابته كلمات النشيد الوطني الباكستاني و«شاهنامة الإسلام»، ووفاته في لاهور في 21 كانون الأول 1982."
  en: "English Wikipedia article on Abul Asar Hafeez Jalandhari (Jullundhri); used for entity facts only. It recounts his birth on 14 January 1900 in Jalandhar into a Punjabi Muslim family, his migration to Lahore in 1947, his writing of the lyrics of Pakistan's national anthem and of the Shahnama-e-Islam, and his death in Lahore on 21 December 1982."
