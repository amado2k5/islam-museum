reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026; the article was fetched by its recorded revision id through the MediaWiki API and the returned id asserted equal before use. It gives his birth name as Muhammad Abdul Hafeez and his pen name as Abu Al-Asar, his birth on 14 January 1900 at Jalandhar and his death on 21 December 1982 at Lahore, citing a Pakistan Post profile and a 2017 Dawn profile by Rauf Parekh; it records his burial first in Model Town, Lahore and later in a government-built tomb near the Minar-e-Pakistan. On religion it says only that he was born into a Punjabi Muslim family and, quoting a PoemHunter profile, that he was considered a devout Muslim; it names no school."
