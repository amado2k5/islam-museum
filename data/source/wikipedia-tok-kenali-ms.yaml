summary:
  ar: "مقالة ويكيبيديا الملايوية عن محمد يوسف بن أحمد، المعروف بتوك كنالي (نحو 1868–1933)، عالم كلنتن مؤسس نظام المدارس القرآنية (بوندوق) في شبه جزيرة الملايو؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في كامبونغ كنالي بكوبانغ كريان نحو سنة 1868 مقترنًا بسنة 1287هـ، ودراسته في كوتا بهرو ثم في مكة (1887–1909)، وتأسيسه بوندوق كنالي سنة 1911 وتدريسه في المسجد المحمدي، ورئاسته تحرير مجلة «بنغاسوه»، ووفاته يوم الأحد 19 تشرين الثاني 1933 ودفنه في كوتا بهرو؛ وحقل «المذهب» في صندوق معلوماتها فارغ."
  en: "Malay Wikipedia article on Muhammad Yusuf bin Ahmad, known as Tok Kenali (c. 1868–1933), the Kelantan scholar who spread the pondok school system across the Malay Peninsula; used for entity facts only. It gives his birth at Kampung Kenali, Kubang Kerian, Kota Bharu, about 1868, paired in the article with the year 1287H, his studies at Kota Bharu and then in Mecca (1887–1909), his founding of Pondok Kenali in 1911 and teaching at the Muhammadi Mosque, his editorship of the magazine Pengasuh, his death on Sunday 19 November 1933 and burial at Kota Bharu; the school (mazhab) field of its scholar infobox is left empty."
