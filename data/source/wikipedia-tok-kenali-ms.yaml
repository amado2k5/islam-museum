summary:
  ar: "مقالة ويكيبيديا الملايوية عن محمد يوسف بن أحمد، المعروف بتوك كنالي ⁦(نحو 1868–1933)⁩، عالم كلنتن مؤسس نظام المدارس القرآنية ⁦(بوندوق)⁩ في شبه جزيرة الملايو؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في كامبونغ كنالي بكوبانغ كريان نحو سنة 1868 مقترنًا بسنة 1287هـ، ودراسته في كوتا بهرو ثم في مكة (1887–1909)، وتأسيسه بوندوق كنالي سنة 1911 وتدريسه في المسجد المحمدي، ورئاسته تحرير مجلة «بنغاسوه»، ووفاته يوم الأحد 19 تشرين الثاني 1933 ودفنه في كوتا بهرو؛ وحقل «المذهب» في صندوق معلوماتها فارغ."
  en: "Malay Wikipedia article on Muhammad Yusuf bin Ahmad, known as Tok Kenali (c. 1868–1933), the Kelantan scholar who spread the pondok school system across the Malay Peninsula; used for entity facts only. It gives his birth at Kampung Kenali, Kubang Kerian, Kota Bharu, about 1868, paired in the article with the year 1287H, his studies at Kota Bharu and then in Mecca (1887–1909), his founding of Pondok Kenali in 1911 and teaching at the Muhammadi Mosque, his editorship of the magazine Pengasuh, his death on Sunday 19 November 1933 and burial at Kota Bharu; the school (mazhab) field of its scholar infobox is left empty."
  es: "Artículo de Wikipedia en malayo sobre Muhammad Yusuf bin Ahmad, conocido como Tok Kenali (c. 1868–1933), el erudito de Kelantan que difundió el sistema escolar pondok por toda la península malaya; se utiliza únicamente para datos sobre la entidad. Indica su nacimiento en Kampung Kenali, Kubang Kerian, Kota Bharu, alrededor de 1868, fecha que en el artículo se relaciona con el año 1287H, sus estudios en Kota Bharu y luego en La Meca (1887–1909), la fundación de Pondok Kenali en 1911 y su enseñanza en la Mezquita Muhammadi, su labor como editor de la revista Pengasuh, su fallecimiento el domingo 19 de noviembre de 1933 y su entierro en Kota Bharu; el campo de escuela (mazhab) de su ficha informativa sobre el erudito se deja vacío."
  fr: "L'article de Wikipédia en malais sur Muhammad Yusuf bin Ahmad, dit Tok Kenali (vers 1868-1933), érudit du Kelantan qui a diffusé le système des écoles pondok à travers la péninsule malaise, est utilisé uniquement à titre informatif. Il indique sa naissance à Kampung Kenali, Kubang Kerian, Kota Bharu, vers 1868 (année associée dans l'article à 1287 H), ses études à Kota Bharu puis à La Mecque (1887-1909), la fondation du Pondok Kenali en 1911 et son enseignement à la mosquée Muhammadi, sa direction de la revue Pengasuh, son décès le dimanche 19 novembre 1933 et son inhumation à Kota Bharu. Le champ « école » (mazhab) de son infobox est vide."
