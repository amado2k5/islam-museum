reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026; the article was fetched by its recorded revision id through the MediaWiki API and the returned id asserted equal before use. The birth year is expressly approximate in the article ('sekitar 1868') and its pairing of 1287H with 1868 is the article's own: 1287 AH corresponds to 1870–71 CE, and the article's own portrait file is named with the years 1870–1933, so the birth year is recorded as debated. The obituary in the magazine Pengasuh (11 December 1933), quoted in the article, pairs his death with the year 1352H. No text in the article names a school for him, and its infobox school field is empty."
