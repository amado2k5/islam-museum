summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد مدثر علي؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها مولده في 1 فبراير 1946 بغوبالغانج، ويروي نصها عمله مستشارا صحيا لرئيسة الوزراء (2009–2013)، وعضويته في المجلس التنفيذي لمنظمة الصحة العالمية، وتأسيسه مستشفى موجيبونيسا للعيون ومجلة بنغلاديش لطب العيون، وحملته ضد التدخين. لا يرد في المقال أي محتوى عن دينه."
  en: "English Wikipedia article on Syed Modasser Ali; used for entity facts only. Its infobox gives his birth as 1 February 1946 at Gopalganj; its text covers his work as health adviser to the prime minister (2009–2013), his terms on the WHO Executive Board, his founding of Mojibunnessa Eye Hospital and the Bangladesh Ophthalmic Journal, and his anti-tobacco campaigning. The article contains no religion content."
