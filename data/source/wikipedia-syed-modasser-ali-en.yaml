summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد مدثر علي؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها مولده في 1 فبراير 1946 بغوبالغانج، ويروي نصها عمله مستشارا صحيا لرئيسة الوزراء (2009–2013)، وعضويته في المجلس التنفيذي لمنظمة الصحة العالمية، وتأسيسه مستشفى موجيبونيسا للعيون ومجلة بنغلاديش لطب العيون، وحملته ضد التدخين. لا يرد في المقال أي محتوى عن دينه."
  en: "English Wikipedia article on Syed Modasser Ali; used for entity facts only. Its infobox gives his birth as 1 February 1946 at Gopalganj; its text covers his work as health adviser to the prime minister (2009–2013), his terms on the WHO Executive Board, his founding of Mojibunnessa Eye Hospital and the Bangladesh Ophthalmic Journal, and his anti-tobacco campaigning. The article contains no religion content."
  es: "Artículo de la Wikipedia en inglés sobre Syed Modasser Ali; utilizado únicamente para obtener información sobre la persona. Su ficha informativa indica que nació el 1 de febrero de 1946 en Gopalganj; el texto abarca su labor como asesor de salud del primer ministro (2009-2013), su participación en el Consejo Ejecutivo de la OMS, la fundación del Hospital Oftalmológico Mojibunnessa y la Revista Oftalmológica de Bangladesh, y su campaña antitabaco. El artículo no contiene contenido religioso."
  fr: "Article de Wikipédia en anglais sur Syed Modasser Ali; utilisé uniquement à des fins d'information sur l'entité. Son infobox indique sa date de naissance, le 1er février 1946 à Gopalganj; son texte aborde son travail de conseiller en santé auprès du Premier ministre (2009-2013), ses mandats au Conseil exécutif de l'OMS, la fondation de l'hôpital ophtalmologique Mojibunnessa et du Bangladesh Ophthalmic Journal, ainsi que son engagement dans la lutte contre le tabagisme. L'article ne contient aucun élément religieux."
  ur: "سید مدثر علی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے معلوماتی خانے نے اس کی پیدائش 1 فروری 1946 کو گوپال گنج میں دی ہے۔ اس کے متن میں وزیر اعظم کے مشیر صحت کے طور پر ان کے کام (2009-2013)، ڈبلیو ایچ او کے ایگزیکٹو بورڈ پر ان کی شرائط، موجیبونیسہ آئی ہسپتال اور بنگلہ دیش آپتھلمک جرنل کی بنیاد، اور ان کی تمباکو مخالف مہم کا احاطہ کیا گیا ہے۔ مضمون میں کوئی مذہبی مواد نہیں ہے۔"
  tr: "Syed Mudassir Ali hakkında İngilizce Wikipedia makalesi; yalnızca varlık gerçekleri için kullanılır. Bilgi kutusu 1 Şubat 1946'da Gobhang'da doğdu ve metni, Başbakan'ın sağlık danışmanı olarak yaptığı çalışmaları (2009–2013), Dünya Sağlık Örgütü Yürütme Konseyi üyeliğini, Mujibonsa Göz Hastanesi'nin ve Bangladeş Göz Dergisi'nin kuruluşunu ve sigara karşıtı kampanyasını anlatıyor. Makalede dini hakkında herhangi bir içerik bulunmamaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Syed Mudassir Ali; hanya digunakan untuk fakta entitas. Infobox tersebut lahir pada 1 Februari 1946 di Gobhang, dan teksnya menceritakan pekerjaannya sebagai penasihat kesehatan Perdana Menteri (2009–2013), keanggotaan Dewan Eksekutif Organisasi Kesehatan Dunia, pendirian Rumah Sakit Mata Mujibonsa dan Bangladesh Journal of Ophthalmology, serta kampanyenya melawan merokok. Artikel tersebut tidak memuat konten apapun tentang agamanya."
