summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الحليم محمود؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 12 مايو 1910 في أبو أحمد بالشرقية، وتخرجه في الأزهر 1932 ودكتوراه السوربون 1940، ومشيخته للأزهر 1973–1978، ووفاته في القاهرة في 17 أكتوبر 1978، ومواقفه، وقسما عن التصوف مبنيا على دراسات أكاديمية لكتاباته؛ وصندوق معلوماتها يعطي طائفته سنية وفقهه مالكيا."
  en: "English Wikipedia article on Abd al-Halim Mahmud; used for entity facts only. It gives his birth on 12 May 1910 at Abu Ahmed in Sharqia, his Azhar graduation of 1932 and Sorbonne doctorate of 1940, his Grand Imamate of 1973–1978, his death at Cairo on 17 October 1978, his positions on sharia and science, and a Sufism section drawn on scholarly treatments of his writings; its infobox gives denomination Sunni and jurisprudence Maliki."
