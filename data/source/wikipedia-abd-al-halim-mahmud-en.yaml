summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الحليم محمود؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 12 مايو 1910 في أبو أحمد بالشرقية، وتخرجه في الأزهر 1932 ودكتوراه السوربون 1940، ومشيخته للأزهر 1973–1978، ووفاته في القاهرة في 17 أكتوبر 1978، ومواقفه، وقسما عن التصوف مبنيا على دراسات أكاديمية لكتاباته؛ وصندوق معلوماتها يعطي طائفته سنية وفقهه مالكيا."
  en: "English Wikipedia article on Abd al-Halim Mahmud; used for entity facts only. It gives his birth on 12 May 1910 at Abu Ahmed in Sharqia, his Azhar graduation of 1932 and Sorbonne doctorate of 1940, his Grand Imamate of 1973–1978, his death at Cairo on 17 October 1978, his positions on sharia and science, and a Sufism section drawn on scholarly treatments of his writings; its infobox gives denomination Sunni and jurisprudence Maliki."
  es: "Artículo de la Wikipedia en inglés sobre Abd al-Halim Mahmud; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 12 de mayo de 1910 en Abu Ahmed, Sharqia, su graduación en Al-Azhar en 1932 y su doctorado en la Sorbona en 1940, su Gran Imamato de 1973 a 1978, su muerte en El Cairo el 17 de octubre de 1978, sus posturas sobre la sharia y la ciencia, y una sección sobre el sufismo basada en estudios académicos de sus escritos; su ficha informativa indica su denominación sunita y su jurisprudencia malikí."
  fr: "L'article de Wikipédia en anglais consacré à Abd al-Halim Mahmud, utilisé uniquement pour les informations le concernant, indique sa naissance le 12 mai 1910 à Abou Ahmed (Sharqia), son diplôme d'Al-Azhar en 1932 et son doctorat de la Sorbonne en 1940, son imamat de 1973 à 1978, son décès au Caire le 17 octobre 1978, ses positions sur la charia et la science, ainsi qu'une section sur le soufisme s'appuyant sur des analyses savantes de ses écrits. Son infobox précise son appartenance à l'école sunnite et à l'école de jurisprudence malikite."
  ur: "عبد الحلیم محمود پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 12 مئی 1910 کو ابو احمد میں شرقیہ میں ان کی پیدائش، 1932 میں ان کی ازہر گریجویشن اور 1940 کی سوربون ڈاکٹریٹ، 1973-1978 کی ان کی عظیم الشان امامت، 17 اکتوبر 1978 کو قاہرہ میں ان کی وفات، شریعت اور سائنس پر ان کے عہدوں، اور تصوف کے علمی علاج پر ان کی تصنیف کے سیکشن شامل ہیں۔ اس کا معلوماتی باکس فرقہ سنی اور فقہ مالکی دیتا ہے۔"
  tr: "Abdel Halim Mahmoud hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Makalede, 12 Mayıs 1910'da Abu Ahmed, Sharqia'da doğduğu, 1932'de El-Ezher'den mezun olması, 1940'ta Sorbonne'daki doktorası, 1973–1978 yılları arasında El-Ezher'in liderliği, 17 Ekim 1978'de Kahire'de ölümü, tutumları ve yazılarının akademik çalışmalarına dayanan bir Sufizm bölümü yer alır; ayrıca bilgi kutusunda mezhebi Sünni ve Maliki fıkhı yer alır."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdel Halim Mahmoud hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada 12 Mei 1910 di Abu Ahmed, Sharqia, kelulusannya dari Al-Azhar pada tahun 1932, gelar doktornya di Sorbonne pada tahun 1940, kepemimpinannya di Al-Azhar dari 1973–1978, kematiannya di Kairo pada 17 Oktober 1978, sikapnya, dan bagian tentang Sufisme berdasarkan studi akademis atas tulisannya; dan kotak info-nya memberikan yurisprudensi Sunni dan Maliki kepada sektenya."
