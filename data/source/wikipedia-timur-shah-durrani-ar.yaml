reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A short article: it names him king of Afghanistan and second ruler of the Durrani state, son of its founder Ahmad Shah Durrani, ruling 1772 to 1793; it gives his birth in 1748 at Mashhad — against the English article's December 1746 — his marriage to a daughter of the Mughal emperor Alamgir II and the gift of Sirhind, his death in 1793 at Kabul, the transfer of the capital from Kandahar to Kabul and the choice of Peshawar as winter capital in 1776. Its infobox files his religion as Islam generically; it names no legal school for him. Checked 1 November 2026."
