summary:
  ar: "مقابلة موقع «بشر فوزيا» مع حفصة أدهم، مؤسسة أكاديمية القلوب المستيقظة و«المسلمة الواثقة»؛ تقول فيها إنها من أسرة ريادية، وُلدت ونشأت في المملكة المتحدة، سافرت بعد شهادتها وأقامت في الشرق الأقصى ثماني سنوات تربّي أسرتها وتشارك في مشاريع خيرية وفعاليات تواصل، ثم عادت إلى المملكة المتحدة، وإن مهمتها تمكين الأفراد من الشجاعة الروحية والعمل الهادف."
  en: "Humans of Fuzia's interview with Hafsah Adham, founder of the Awakened Hearts Academy and The Confident Muslimah. In it she says she comes from an entrepreneurial family, was born and raised in the UK, travelled after her degree and settled in the Far East for eight years raising her young family and taking part in charity projects and networking events, then returned to the UK; her mission is to empower individuals to find spiritual courage and take meaningful action towards their goals."
