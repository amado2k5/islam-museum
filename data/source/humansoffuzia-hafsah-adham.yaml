summary:
  ar: "مقابلة موقع «بشر فوزيا» مع حفصة أدهم، مؤسسة أكاديمية القلوب المستيقظة و«المسلمة الواثقة»؛ تقول فيها إنها من أسرة ريادية، وُلدت ونشأت في المملكة المتحدة، سافرت بعد شهادتها وأقامت في الشرق الأقصى ثماني سنوات تربّي أسرتها وتشارك في مشاريع خيرية وفعاليات تواصل، ثم عادت إلى المملكة المتحدة، وإن مهمتها تمكين الأفراد من الشجاعة الروحية والعمل الهادف."
  en: "Humans of Fuzia's interview with Hafsah Adham, founder of the Awakened Hearts Academy and The Confident Muslimah. In it she says she comes from an entrepreneurial family, was born and raised in the UK, travelled after her degree and settled in the Far East for eight years raising her young family and taking part in charity projects and networking events, then returned to the UK; her mission is to empower individuals to find spiritual courage and take meaningful action towards their goals."
  es: "Entrevista de Humans of Fuzia con Hafsah Adham, fundadora de Awakened Hearts Academy y The Confident Muslimah. En ella, comenta que proviene de una familia emprendedora, nació y creció en el Reino Unido, viajó tras graduarse y se estableció en el Lejano Oriente durante ocho años, donde crió a su joven familia y participó en proyectos benéficos y eventos de networking, para luego regresar al Reino Unido. Su misión es empoderar a las personas para que encuentren el coraje espiritual y tomen medidas significativas para alcanzar sus metas."
  fr: "Humans of Fuzia présente son interview d'Hafsah Adham, fondatrice de l'Awakened Hearts Academy et de The Confident Muslimah. Elle y explique être issue d'une famille d'entrepreneurs, être née et avoir grandi au Royaume-Uni, avoir voyagé après ses études et s'être installée pendant huit ans en Extrême-Orient pour élever ses jeunes enfants et participer à des projets caritatifs et à des événements de réseautage, avant de revenir au Royaume-Uni. Sa mission est d'aider chacun à trouver le courage spirituel et à entreprendre des actions concrètes pour atteindre ses objectifs."
  ur: "Hafsah Adham کے ساتھ Humans of Fuzia کا انٹرویو، Awakened Hearts Academy اور The Confident Muslimah کی بانی۔ اس میں وہ کہتی ہیں کہ وہ ایک کاروباری خاندان سے تعلق رکھتی ہے، برطانیہ میں پیدا ہوئی اور پرورش پائی، اپنی ڈگری کے بعد سفر کیا اور مشرق بعید میں آٹھ سال تک اپنے نوجوان خاندان کی پرورش اور چیریٹی پروجیکٹس اور نیٹ ورکنگ ایونٹس میں حصہ لینے کے بعد واپس یو۔ اس کا مشن افراد کو بااختیار بنانا ہے کہ وہ روحانی ہمت تلاش کریں اور اپنے مقاصد کے لیے بامعنی اقدام کریں۔"
