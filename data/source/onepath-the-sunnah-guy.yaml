summary:
  ar: "ملف شبكة «ون باث» عن شعيب حسين «المعروف أكثر باسم فتى السنة» ⁦(نُشر في 31 يوليو 2025)⁩: أزمة شكه في الثامنة عشرة، ورسالة بلال أسد المرئية الشخصية التي أعادته إلى الممارسة، ودعوته الميدانية، وفيلمه الإسلامي البريطاني «وجهان»، وانتقاله في زمن الجائحة إلى المقاطع القصيرة، وجمهوره الذي تجاوز 2.9 مليون متابع."
  en: "OnePath Network's profile of Shoaib Hussain, 'better known as The Sunnah Guy' (published 31 July 2025): his crisis of doubt at eighteen, the personal video message from Bilal Assad that turned him back to practice, street dawah, his UK-based Islamic film Two Sides, the COVID-era move to short-form video, and an audience of over 2.9 million followers."
  es: "Perfil de Shoaib Hussain, \"más conocido como El Chico de la Sunnah\", publicado por OnePath Network el 31 de julio de 2025: su crisis de duda a los dieciocho años, el mensaje de vídeo personal de Bilal Assad que le hizo retomar la práctica, su prédica callejera, su película islámica Two Sides, rodada en el Reino Unido, su transición a los vídeos de formato corto durante la pandemia de COVID-19 y una audiencia de más de 2,9 millones de seguidores."
  fr: "Profil de Shoaib Hussain, « mieux connu sous le nom de The Sunnah Guy », par OnePath Network (publié le 31 juillet 2025): sa crise de doute à dix-huit ans, le message vidéo personnel de Bilal Assad qui l'a ramené à la pratique, la da'wa de rue, son film islamique Two Sides basé au Royaume-Uni, le passage aux vidéos courtes à l'ère du COVID et une audience de plus de 2,9 millions d'abonnés."
  ur: "شعیب حسین کا OnePath نیٹ ورک کا پروفائل، 'دی سنت گائے کے نام سے مشہور' ⁦(شائع شدہ 31 جولائی 2025)⁩: اٹھارہ سال کی عمر میں ان کا شکوک کا بحران، بلال اسد کا ذاتی ویڈیو پیغام جس نے انہیں مشق کی طرف موڑ دیا، اسٹریٹ دعوت، ان کی برطانیہ میں قائم اسلامی فلم ٹو سائیڈز، مختصر شکل والی ویڈیو کی طرف COVID-era اقدام، اور 20 لاکھ سے زائد سامعین کو فالو کیا۔"
  tr: "Shoaib Hussein, yani Yılın Çocuğu olarak bilinen One Path ağ dosyası (31 Temmuz 2025'te yayımlandı): on sekiz yaşındaki şüphe krizi, Bilal Asad'ın onu tekrar pratiğe döndüren kişisel görsel mesajı, saha çağrısı, İngiliz İslami filmi \"Two Faces\", pandemi sırasında kısa kliplere geçişi ve 2,9 milyonu aşan izleyici kitlesi."
  id: "File jaringan One Path tentang Shoaib Hussein, lebih dikenal sebagai Anak Laki-laki Tahun Ini\" (diterbitkan pada 31 Juli 2025): krisis keraguannya pada usia delapan belas tahun, pesan visual pribadi Bilal Asad yang membawanya kembali ke latihan, panggilan lapangannya, film Islam Inggris \"Two Faces,\" peralihannya selama pandemi ke klip pendek, dan audiensnya yang melebihi 2,9 juta pengikut."
title: "From Doubt to 2.9M Followers: The Sunnah Guy's Blueprint for Muslim Content Creators"
