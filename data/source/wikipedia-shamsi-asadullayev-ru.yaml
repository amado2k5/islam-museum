  ar: "مقالة ويكيبيديا الروسية عن شمسي أسد الله يف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1840 ⁦(وببيانات أخرى 1841)⁩ في أميرجان ووفاته في 21 أبريل 1913 في يالطا، وتروي أعماله النفطية ووقف دار أسد الله يف لمسلمي موسكو."
  en: "Russian Wikipedia article on Shamsi Asadullayev; used for entity facts only. It gives his birth in 1840 (by other data 1841) at Amirjan and his death on 21 April 1913 at Yalta, and recounts his oil business and the Asadullayev House he gave to Moscow's Muslims."
