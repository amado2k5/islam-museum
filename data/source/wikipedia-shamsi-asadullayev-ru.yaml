summary:
  ar: "مقالة ويكيبيديا الروسية عن شمسي أسد الله يف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1840 ⁦(وببيانات أخرى 1841)⁩ في أميرجان ووفاته في 21 أبريل 1913 في يالطا، وتروي أعماله النفطية ووقف دار أسد الله يف لمسلمي موسكو."
  en: "Russian Wikipedia article on Shamsi Asadullayev; used for entity facts only. It gives his birth in 1840 (by other data 1841) at Amirjan and his death on 21 April 1913 at Yalta, and recounts his oil business and the Asadullayev House he gave to Moscow's Muslims."
  es: "Artículo de la Wikipedia rusa sobre Shamsi Asadullayev; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1840 (según otros datos, en 1841) en Amirjan y su fallecimiento el 21 de abril de 1913 en Yalta, y relata su negocio petrolero y la Casa Asadullayev que donó a los musulmanes de Moscú."
  fr: "Article de Wikipédia en russe sur Shamsi Asadullayev; utilisé uniquement pour les informations le concernant. Il indique sa naissance en 1840 (ou 1841 selon d'autres sources) à Amirjan et son décès le 21 avril 1913 à Yalta, et relate son activité dans le commerce du pétrole ainsi que la Maison Asadullayev qu'il a offerte aux musulmans de Moscou."
  ur: "شمسی اسد اللائیف پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1840 میں ان کی پیدائش ⁦(دیگر اعداد و شمار 1841 کے مطابق)⁩ امیرجان میں اور ان کی موت 21 اپریل 1913 کو یالٹا میں ہوئی ہے، اور اس کے تیل کے کاروبار اور ماسکو کے مسلمانوں کو دیے گئے اسدالائیف ہاؤس کا ذکر ہے۔"
  tr: "Shamsi Asadullah Yev hakkında Rusça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1840'ta (diğer verilerle birlikte 1841'de) Amirgan'da doğduğunu ve 21 Nisan 1913'te Yalta'da öldüğünü anlatır; petrol faaliyetlerini ve Asadullah Yev'in evinin Moskova Müslümanları için bağışlanmasını anlatır."
  id: "Artikel Wikipedia Rusia tentang Shamsi Asadullah Yev; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya pada tahun 1840 (dan dengan data lain 1841) di Amirgan dan kematiannya pada 21 April 1913 di Yalta, serta menceritakan aktivitas minyaknya dan pemberian rumah Asadullah Yev untuk umat Muslim Moskow."
