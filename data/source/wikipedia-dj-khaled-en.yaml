reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and its content checked against the recorded revision. It gives Khaled Mohammed Khaled, born 26 November 1975 in New Orleans, Louisiana, to Palestinian immigrant parents; his 1990s radio work at 99 Jamz in Miami; his Terror Squad years; and the album run from Listennn... the Album (2006) to Khaled Khaled (2021), with Major Key (2016) debuting atop the Billboard 200. Its personal-life section states that in 2014 he described himself as a devout Muslim, citing the Larry King interview, and that in December 2022 he visited Mecca with Mike Tyson to perform the Umrah, citing The New Arab. No school is named."
