label:
  ar: "تتمة أضواء البيان في إيضاح القرآن بالقرآن — الجزء التاسع والثاني من التتمة ⁦(ط2، 1400هـ/1980م)⁩"
  en: "Tatimmat Adwa' al-Bayan — part 9, the second part of the completion (2nd ed., 1980)"
  ur: "تتمۂ اضواء البیان — جزء نہم، تتمے کا دوسرا جزء (دوسرا ایڈیشن، 1980ء)"
summary:
  ar: "الجزء التاسع من أضواء البيان، وهو الثاني من «التتمة»، ويبدأ بسورة النبأ؛ وعلى غلافه اسم الشيخ محمد الأمين بن محمد المختار الجكني الشنقيطي، وأنه طبع على نفقة محمد بن عوض بن لادن وقفًا لله على طلبة العلم؛ الطبعة الثانية 1400هـ/1980م."
  en: "Part 9 of Adwa' al-Bayan, the second part of the 'completion' (tatimma), beginning with Surat al-Naba'; its cover carries the name of Shaykh Muhammad al-Amin ibn Muhammad al-Mukhtar al-Jakani al-Shinqiti and says it was printed at the expense of Muhammad ibn Awad bin Ladin as an endowment for students; 2nd edition 1400 AH / 1980."
  ur: "اضواء البیان کا جزء نہم، جو «تتمے» کا دوسرا جزء ہے اور سورۂ نبأ سے شروع ہوتا ہے؛ اس کے سرورق پر شیخ محمد الامین بن محمد المختار الجکنی الشنقیطی کا نام ہے، اور یہ کہ یہ محمد بن عوض بن لادن کے خرچ پر طلبۂ علم کے لیے وقف کے طور پر چھپا؛ دوسرا ایڈیشن 1400ھ / 1980ء۔"
