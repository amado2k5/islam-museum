summary:
  ar: "عنصر ويكيداتا Q12485070 للحاج مصباح؛ يحمل ميلاده سنة 1876 ووفاته سنة 1926 بدقة السنة فقط، وسوراكارتا مكانًا لميلاده ومانوكواري مكانًا لوفاته، ولا يحمل أي قيمة للديانة."
  en: "Wikidata item Q12485070 for Haji Misbach; it carries his birth in 1876 and death in 1926 at year precision only, Surakarta as his birthplace and Manokwari as his place of death, and no religion value at all."
  es: "El elemento de Wikidata Q12485070 corresponde a Haji Misbach; solo indica con precisión el año de su nacimiento en 1876 y su fallecimiento en 1926, Surakarta como su lugar de nacimiento y Manokwari como su lugar de fallecimiento, sin ningún valor religioso."
  fr: "L'élément Wikidata Q12485070 pour Haji Misbach; il indique sa naissance en 1876 et sa mort en 1926 avec une précision d'année seulement, Surakarta comme lieu de naissance et Manokwari comme lieu de décès, et aucune valeur religieuse."
  ur: "حاجی مصباح کے لیے ویکی ڈیٹا آئٹم Q12485070؛ اس میں ان کی پیدائش 1876 میں اور موت 1926 میں صرف سال کی درستگی کے مطابق ہے، سوراکارتا کو اس کی جائے پیدائش اور مانوکواری کو اس کی موت کی جگہ، اور مذہب کی کوئی اہمیت نہیں۔"
  tr: "Wikidata öğesi Hajj Misbah tarafından Q12485070; doğumunu 1876'da ve ölümünü 1926'da tarihlendirir; sadece tam yılı Sárakarta olarak geçerek, doğum yeri Surakarta ve ölüm yeri Manukwari olarak yer alır ve dini bir önemi yoktur."
  id: "Elemen Wikidata Q12485070 oleh Haji Misbah; unsur ini menandai kelahirannya pada tahun 1876 dan kematiannya pada tahun 1926 dengan hanya tahun tepat sebagai Sárakarta, dengan Surakarta sebagai tempat kelahirannya dan Manukwari sebagai tempat kematiannya, dan tidak memiliki makna keagamaan."
