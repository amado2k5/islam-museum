summary:
  ar: "قناة يوتيوب للداعية المقيم في سيدني أبو بكر زود ⁦(المعرّف @abubakrzoud)⁩، تضم دروسه ومحاضراته المسجلة، ومنها سلاسل في القرآن والتفسير؛ وتربط أوصاف مقاطعها موقعه الرسمي وحساباته بالاسم نفسه."
  en: "The YouTube channel of the Sydney-based preacher Abu Bakr Zoud (handle @abubakrzoud), carrying his recorded lessons and lectures, including Qur'an and tafsir series; his video descriptions link his official website and social accounts under the same name."
  es: "El canal de YouTube del predicador Abu Bakr Zoud (usuario @abubakrzoud), residente en Sídney, contiene sus lecciones y conferencias grabadas, incluidas series sobre el Corán y el tafsir (interpretación del Corán); las descripciones de sus videos enlazan con su sitio web oficial y sus cuentas en redes sociales con el mismo nombre."
  fr: "La chaîne YouTube du prédicateur Abu Bakr Zoud, basé à Sydney (pseudo: @abubakrzoud), diffuse ses leçons et conférences enregistrées, notamment des séries sur le Coran et le tafsir; les descriptions de ses vidéos renvoient vers son site web officiel et ses comptes sur les réseaux sociaux sous le même nom."
  ur: "سڈنی میں مقیم مبلغ ابو بکر زود کا یوٹیوب چینل ⁦(@abubakrzoud ہینڈل)⁩، اس کے ریکارڈ شدہ اسباق اور لیکچرز بشمول قرآن اور تفسیر سیریز؛ اس کی ویڈیو کی تفصیل اس کی آفیشل ویب سائٹ اور سوشل اکاؤنٹس کو اسی نام سے لنک کرتی ہے۔"
