reliability_note: "Kenyan Muslim-media report, read in full on 8 November 2026; the page as read carries no visible publication date, so the read date stands in the issued field. It states that 'The Sheikh who is the Imam of Jamia Mosque, is scheduled to be in Nyeri as part of a regional outreach covering several towns in the Mt. Kenya region', with the visit 'scheduled between May 7th and 10th, 2026', that 'The lecture tour of Central Kenya is part of Jamia mosque's outreach da'wah programmes', and that the tour also covered Meru, Embu and Sagana, opening in Nyeri with a women's lecture at Qubaa Mosque on Thursday 7 May and the Friday sermon there. Used for his current activity and touring, not for biography. It names no school of law or order for him."
