summary:
  ar: "مقالة ويكيبيديا العربية عن ثريا طرزي؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تعطي مولدها في 24 نوفمبر 1899 ووفاتها في 20 أبريل 1968، ونشأتها في سوريا في كنف أبيها محمود طرزي المنتمي إلى قبيلة محمدزاي، وزواجها من الملك أمان الله خان. لا تحمل أي قيمة للديانة."
  en: "Arabic Wikipedia article on Soraya Tarzi; a short article used for entity facts only. It gives her birth on 24 November 1899 and her death on 20 April 1968, her upbringing in Syria under her father Mahmud Tarzi of the Mohammadzai tribe, and her marriage to King Amanullah Khan. It carries no religion value at all."
  es: "Artículo en árabe de la Wikipedia sobre Soraya Tarzi; un breve artículo que solo incluye datos biográficos. Menciona su nacimiento el 24 de noviembre de 1899 y su fallecimiento el 20 de abril de 1968, su crianza en Siria bajo el cuidado de su padre, Mahmud Tarzi, de la tribu Mohammadzai, y su matrimonio con el rey Amanullah Khan. No tiene ningún valor religioso."
  fr: "Article Wikipédia en arabe sur Soraya Tarzi; un court article à visée purement informative. Il mentionne sa naissance le 24 novembre 1899 et son décès le 20 avril 1968, son enfance en Syrie auprès de son père Mahmud Tarzi, de la tribu Mohammadzai, et son mariage avec le roi Amanullah Khan. Il n’a aucune valeur religieuse."
  ur: "ثریا طرزی پر عربی ویکیپیڈیا مضمون؛ ایک مختصر مضمون جو صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ یہ 24 نومبر 1899 کو اس کی پیدائش اور 20 اپریل 1968 کو اس کی موت، محمد زئی قبیلے کے اپنے والد محمود طرزی کے تحت شام میں اس کی پرورش، اور شاہ امان اللہ خان سے اس کی شادی ہوئی۔ اس میں مذہب کی کوئی اہمیت نہیں ہے۔"
