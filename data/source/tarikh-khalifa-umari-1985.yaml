label:
  ar: تاريخ خليفة بن خياط (تحقيق أكرم ضياء العمري، دار طيبة)
  en: Tarikh Khalifa ibn Khayyat (ed. Akram Diya' al-Umari, Dar Tayba)
  ur: تاریخ خلیفہ بن خیاط (تحقیق اکرم ضیاء العمری، دار طیبہ)
summary:
  ar: أقدم كتاب حوليات في التاريخ الإسلامي وصل إلينا، لخليفة بن خياط العصفري (ت 240هـ)، برواية بقي بن مخلد، بتحقيق أكرم ضياء العمري، دار طيبة بالرياض، الطبعة الثانية 1405هـ/1985م. يعتمد المحقق على النسخة الفريدة المحفوظة في الخزانة العامة بالرباط برقم 199، المنسوخة سنة 477هـ {cite:tarikh-khalifa-umari-1985 intro p. 3} {cite:tarikh-khalifa-umari-1985 intro p. 34}.
  en: The oldest surviving book of annals in Islamic history, by Khalifa ibn Khayyat al-Usfuri (d. 240 AH) in the transmission of Baqi ibn Makhlad, edited by Akram Diya' al-Umari, Dar Tayba, Riyadh, 2nd ed. 1405/1985. The editor relies on the unique manuscript in the General Library in Rabat, no. 199, copied in 477 AH {cite:tarikh-khalifa-umari-1985 intro p. 3} {cite:tarikh-khalifa-umari-1985 intro p. 34}.
  ur: اسلامی تاریخ کی قدیم ترین محفوظ سالانہ وقائع کی کتاب، از خلیفہ بن خیاط عصفری (وفات 240ھ)، بروایت بقی بن مخلد، تحقیق اکرم ضیاء العمری، دار طیبہ، ریاض، دوسرا ایڈیشن 1405ھ/1985ء۔ محقق رباط کے کتب خانۂ عامہ میں محفوظ واحد مخطوطے (نمبر 199) پر انحصار کرتے ہیں جو 477ھ میں نقل ہوا {cite:tarikh-khalifa-umari-1985 intro p. 3} {cite:tarikh-khalifa-umari-1985 intro p. 34}۔
