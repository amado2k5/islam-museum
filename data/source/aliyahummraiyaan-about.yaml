summary:
  ar: "صفحة التعريف في الموقع الرسمي لعالية أم ريان: اعتنقت الإسلام قبل 26 سنة، وأسست جمعية «سولاس يو كي» الخيرية سنة 2010 لدعم النساء المعتنقات للإسلام، وأطلقت برنامج «Honest Tea Talk» على يوتيوب سنة 2019، ونشرت لها دار بنغوين «تأملات رمضانية» (2023) الذي صار من أكثر كتب قائمة صنداي تايمز مبيعا، ثم «قوة الدعاء» و«العيش مع القرآن» (2025)، وهي متحدثة دولية قدمت محاضرة TEDx، وتقيم في شرق لندن."
  en: "The About page of Aliyah Umm Raiyaan's official website: she converted to Islam 26 years ago, founded the registered charity Solace UK in 2010 to support women converts in difficulty, launched the YouTube show Honest Tea Talk in 2019, and was approached by Penguin, which published Ramadan Reflections (2023), a Sunday Times bestseller, then The Power of Du'a and Living with the Qur'an (December 2025); she is an international speaker who gave a TEDx talk and lives in East London."
  es: "La página \"Acerca de\" del sitio web oficial de Aliyah Umm Raiyaan indica que se convirtió al Islam hace 26 años, fundó la organización benéfica registrada Solace UK en 2010 para apoyar a las mujeres conversas en dificultades, lanzó el programa de YouTube Honest Tea Talk en 2019 y fue contactada por Penguin, que publicó Ramadan Reflections (2023), un éxito de ventas del Sunday Times, y luego The Power of Du'a y Living with the Qur'an (diciembre de 2025); es oradora internacional, dio una charla TEDx y vive en el este de Londres."
  fr: "La page « À propos » du site officiel d’Aliyah Umm Raiyaan: elle s’est convertie à l’islam il y a 26 ans, a fondé l’association caritative Solace UK en 2010 pour soutenir les femmes converties en difficulté, a lancé l’émission YouTube Honest Tea Talk en 2019 et a été approchée par Penguin, qui a publié Ramadan Reflections (2023), un best-seller du Sunday Times, puis The Power of Du’a et Living with the Qur’an (décembre 2025); elle est une conférencière internationale qui a donné une conférence TEDx et vit dans l’est de Londres."
  ur: "عالیہ ام ریان کی آفیشل ویب سائٹ کے بارے میں صفحہ: اس نے 26 سال قبل اسلام قبول کیا، 2010 میں رجسٹرڈ چیریٹی سولیس یو کے کی بنیاد رکھی تاکہ مشکل میں تبدیل ہونے والی خواتین کی مدد کی جا سکے، 2019 میں یوٹیوب شو ہونسٹ ٹی ٹاک کا آغاز کیا، اور پینگوئن نے ان سے رابطہ کیا، جس نے رمضان ریفلیکشنز (2023) شائع کیا، جس کے بعد سنڈے پاور اور سنڈے پاور کا ایک بہترین پروگرام تھا۔ ⁦(دسمبر 2025)⁩؛ وہ ایک بین الاقوامی اسپیکر ہے جس نے TEDx ٹاک دیا اور وہ مشرقی لندن میں رہتی ہیں۔"
  tr: "Alia um Rayyan için resmi profil sayfası: 26 yıl önce İslam'a geçti, 2010'da İslam'a geçen kadınları desteklemek için 'Solas UK' adlı yardım kuruluşunu kurdu, 2019'da YouTube'da 'Honest Tea Talk' programını başlattı ve Penguin, Sunday Times listesinde en çok satanlar arasında yer alan 'Ramazan Reflections'ı (2023) yayımladı, ardından 'The Power of Prayer' ve 'Living with the Quran' (2025) geldi. Uluslararası bir konuşmacı, bir TEDx konferansı verdi ve Doğu Londra'da yaşıyor."
  id: "Halaman profil resmi untuk Alia um Rayyan: Dia memeluk Islam 26 tahun lalu, mendirikan badan amal 'Solas UK' pada 2010 untuk mendukung perempuan yang memeluk Islam, meluncurkan program 'Honest Tea Talk' di YouTube pada 2019, dan Penguin menerbitkan 'Ramadan Reflections' (2023), yang menjadi salah satu buku terlaris di daftar Sunday Times, diikuti oleh 'The Power of Prayer' dan 'Living with the Quran' (2025). Dia adalah pembicara internasional yang pernah memberikan kuliah TEDx dan tinggal di East London."
