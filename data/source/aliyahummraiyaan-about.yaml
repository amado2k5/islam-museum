summary:
  ar: "صفحة التعريف في الموقع الرسمي لعالية أم ريان: اعتنقت الإسلام قبل 26 سنة، وأسست جمعية «سولاس يو كي» الخيرية سنة 2010 لدعم النساء المعتنقات للإسلام، وأطلقت برنامج «Honest Tea Talk» على يوتيوب سنة 2019، ونشرت لها دار بنغوين «تأملات رمضانية» (2023) الذي صار من أكثر كتب قائمة صنداي تايمز مبيعا، ثم «قوة الدعاء» و«العيش مع القرآن» (2025)، وهي متحدثة دولية قدمت محاضرة TEDx، وتقيم في شرق لندن."
  en: "The About page of Aliyah Umm Raiyaan's official website: she converted to Islam 26 years ago, founded the registered charity Solace UK in 2010 to support women converts in difficulty, launched the YouTube show Honest Tea Talk in 2019, and was approached by Penguin, which published Ramadan Reflections (2023), a Sunday Times bestseller, then The Power of Du'a and Living with the Qur'an (December 2025); she is an international speaker who gave a TEDx talk and lives in East London."
