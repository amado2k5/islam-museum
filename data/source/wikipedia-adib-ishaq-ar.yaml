  ar: "مقالة ويكيبيديا العربية عن أديب إسحاق؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في دمشق من عائلة أرمنية، وتعليمه عند الآباء اللعازريين، وصحفه في بيروت ومصر وباريس، وتأثره بجمال الدين الأفغاني، ووفاته في قرية الحدث بلبنان."
  en: "Arabic Wikipedia article on Adib Ishaq; used for entity facts only. It recounts his upbringing in Damascus in an Armenian family, his schooling with the Lazarist fathers, his newspapers in Beirut, Egypt and Paris, his debt to Jamal al-Din al-Afghani, and his death in the village of al-Hadath in Lebanon."
