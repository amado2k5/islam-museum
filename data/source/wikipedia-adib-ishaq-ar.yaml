reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his Armenian family name as Adib Zalmatian, his birth in Damascus in 1856 (1272 AH) and his death in 1885 (1302 AH) at al-Hadath in Lebanon. Its text names no religion for him personally — family origin and Lazarist schooling only; its categories file him under 'Christian poets' and 'Syrian Christians', and carry both 1884 and 1885 death-year categories, reflecting the same conflict found in the English article."
