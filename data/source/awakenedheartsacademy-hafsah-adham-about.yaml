summary:
  ar: "الصفحة التعريفية في موقع أكاديمية القلوب المستيقظة، الأكاديمية التي أسستها حفصة أدهم؛ تصفها مدربة ثقة روحية معتمدة ومتحدثة وأمًا لثلاثة ومؤسسة الأكاديمية و«المسلمة الواثقة»، ومدربة رئيسية في «مسلم ماستري» ومدرّبة في شركة «المسلم المنتج»، حاصلة على دبلوم في التدريب التحويلي المعتمد من الاتحاد الدولي للتدريب، مقيمة في المملكة المتحدة ومتطوعة محاضرة في مركز للمسلمين الجدد وتدرس العلوم الإسلامية عند معلمين."
  en: "The about page of the Awakened Hearts Academy website, the academy Hafsah Adham founded. It describes her as a certified spiritual confidence coach, public speaker and mother of three, founder of the Academy and of The Confident Muslimah, a masterclass instructor with The Productive Muslim Co and a lead coach at Muslim Mastery, holder of an ICF-accredited diploma in transformational coaching, based in the UK, a volunteer lecturer at a revert centre, and a continuing student of the Islamic sciences under various teachers."
