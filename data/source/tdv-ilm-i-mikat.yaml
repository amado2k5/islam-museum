summary:
  ar: "مدخل «علم الميقات» في موسوعة TDV الإسلامية: علم تعيين الوقت — وخاصة أوقات الصلاة — بالشمس والقمر والنجوم، ونشأة جداول الأوقات الخمسة والقبلة في القرن التاسع، وذروته في دمشق القرن الرابع عشر، والفرق بين الموقّت موظف المؤسسة الدينية والميقاتي الفلكي العالم."
  en: "The TDV İslâm Ansiklopedisi entry on ilm-i mikat, the science of determining the times — above all the prayer times — by the sun, moon and stars: the first five-time and qibla tables of the ninth century, the science's peak in fourteenth-century Damascus, and the distinction between the muvakkit of the religious institution and the mîkâtî, the research astronomer."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre ilm-i mikat, la ciencia de determinar los tiempos —sobre todo los tiempos de oración— mediante el sol, la luna y las estrellas: las primeras tablas de cinco tiempos y de la qibla del siglo IX, el apogeo de la ciencia en la Damasco del siglo XIV y la distinción entre el muvakkit de la institución religiosa y el mîkâtî, el astrónomo investigador."
