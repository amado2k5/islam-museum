summary:
  ar: "مدخل «علم الميقات» في موسوعة TDV الإسلامية: علم تعيين الوقت — وخاصة أوقات الصلاة — بالشمس والقمر والنجوم، ونشأة جداول الأوقات الخمسة والقبلة في القرن التاسع، وذروته في دمشق القرن الرابع عشر، والفرق بين الموقّت موظف المؤسسة الدينية والميقاتي الفلكي العالم."
  en: "The TDV İslâm Ansiklopedisi entry on ilm-i mikat, the science of determining the times — above all the prayer times — by the sun, moon and stars: the first five-time and qibla tables of the ninth century, the science's peak in fourteenth-century Damascus, and the distinction between the muvakkit of the religious institution and the mîkâtî, the research astronomer."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre ilm-i mikat, la ciencia de determinar los tiempos —sobre todo los tiempos de oración— mediante el sol, la luna y las estrellas: las primeras tablas de cinco tiempos y de la qibla del siglo IX, el apogeo de la ciencia en la Damasco del siglo XIV y la distinción entre el muvakkit de la institución religiosa y el mîkâtî, el astrónomo investigador."
  fr: "L'article de TDV İslâm Ansiklopedisi sur l'ilm-i mikat, la science de la détermination des heures — et surtout des heures de prière — par le soleil, la lune et les étoiles: les premières tables des cinq heures et de la qibla du IXe siècle, l'apogée de cette science à Damas au XIVe siècle, et la distinction entre le muvakkit de l'institution religieuse et le mîkâtî, l'astronome chercheur."
  ur: "TDV İslâm Ansiklopedisi in ilm-i-mikat پر اندراج، اوقات کا تعین کرنے کی سائنس - سب سے بڑھ کر نماز کے اوقات - سورج، چاند اور ستاروں کے ذریعہ: نویں صدی کے پہلے پانچ وقت اور قبلہ میزیں، چودھویں صدی کے دمشق میں سائنس کی چوٹی، اور مذہبی اداروں کے درمیان فرق تحقیقی ماہر فلکیات۔"
  tr: "İslami TDV Ansiklopedisi'nde 'Mikat Bilimi'ne Giriş: Zamanın — özellikle namaz zamanlarının — güneş, ay ve yıldızlar tarafından belirlenmesi bilimi, dokuzuncu yüzyılda beş zaman çizelgesi ve kıblenin ortaya çıkışı, on dördüncü yüzyılda Şam'da zirveye ulaşması ve zamanlayıcı, dini kurumun çalışanı ile astronomik zamanlayıcı arasındaki fark."
  id: "Pengantar 'Ilmu Miqat' dalam Ensiklopedia TDV Islam: Ilmu penentuan waktu—terutama waktu shalat—oleh matahari, bulan, dan bintang, munculnya lima jadwal waktu dan qbla pada abad kesembilan, puncaknya di Damaskus pada abad keempat belas, serta perbedaan antara penghitung waktu, pegawai institusi keagamaan, dan penghitung waktu astronomi."
