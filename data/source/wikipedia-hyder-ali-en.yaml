reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It dates his birth about 1720 at Budikote and his death to 7 December 1782 at Chittoor, aged 62, and carries his reign from July 1761. Its infobox gives his religion as Sunni Islam, quoting Richard H. Davis, Lives of Indian Images (1999), p. 149 — 'parvenu Sunni Muslim rulers' — a single scholarly characterisation of him and Tipu jointly; no school or order is named for Hyder Ali himself anywhere in the article, and the record preserves that attestation without settling a school on it. It names his father Fath Muhammad and mother Razia Bibi; neither has a museum record. Checked 1 November 2026."
