summary:
  ar: "مقالة ويكيبيديا الأردية عن يحيى خان؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 4 فبراير 1917 في جكوال ووفاته في 10 أغسطس 1980 في راولبندي ودفنه في بيشاور، وقيادته للجيش ورئاسته، وانتخابات 1970 وسقوط دكا، وأصل أسرته القزلباشي. ويعطي صندوق معلوماتها الدين «إسلام» عموما."
  en: "Urdu Wikipedia article on Yahya Khan; used for entity facts only. It gives his birth on 4 February 1917 at Chakwal and death on 10 August 1980 at Rawalpindi with burial at Peshawar, his army command and presidency, the 1970 elections and the fall of Dhaka, and his Qizilbash family origin. Its infobox religion field gives Islam generically."
  es: "Artículo de Wikipedia en urdu sobre Yahya Khan; utilizado únicamente para datos biográficos. Indica su nacimiento el 4 de febrero de 1917 en Chakwal y su fallecimiento el 10 de agosto de 1980 en Rawalpindi, con sepultura en Peshawar, su mando militar y presidencia, las elecciones de 1970 y la caída de Dhaka, así como el origen de su familia Qizilbash. El campo de religión en su ficha informativa indica que se trata del islam de forma genérica."
  fr: "L'article de Wikipédia en ourdou consacré à Yahya Khan, utilisé uniquement pour les informations le concernant, indique sa naissance le 4 février 1917 à Chakwal et son décès le 10 août 1980 à Rawalpindi, avec inhumation à Peshawar. Il aborde également son commandement militaire, sa présidence, les élections de 1970, la chute de Dacca et ses origines familiales Qizilbash. L'infobox « Religion » mentionne l'islam de manière générique."
  ur: "یحییٰ خان پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 4 فروری 1917 کو چکوال میں ان کی پیدائش اور 10 اگست 1980 کو راولپنڈی میں پشاور میں تدفین، اس کی فوج کی کمان اور صدارت، 1970 کے انتخابات اور سقوط ڈھاکہ، اور اس کے قزلباش خاندان کی اصل موت ہے۔ اس کا infobox مذہب کا میدان اسلام کو عمومی طور پر دیتا ہے۔"
  tr: "Yahya Khan hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 4 Şubat 1917'de Jakwal'da doğmuş, 10 Ağustos 1980'de Rawalpindi'de ölmüş, Peşaver'de defnedilmiştir; ayrıca ordu liderliği ve liderliği, 1970 seçimleri ve Dakka'nın düşüşü ile aile kökeni Kızilbashi'dir. Bilgi kutusunda genellikle dini 'İslam' olarak verir."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Yahya Khan; digunakan hanya untuk fakta entitas. Ia disebutkan lahir pada 4 Februari 1917 di Jakwal, meninggal pada 10 Agustus 1980 di Rawalpindi, dan dimakamkan di Peshawar, serta kepemimpinan dan kepemimpinannya di militer, pemilihan tahun 1970 dan jatuhnya Dhaka, dan asal-usul keluarganya adalah Qizilbashi. Kotak infonya umumnya mencantumkan agama sebagai 'Islam'."
