  ar: "مقالة ويكيبيديا الأردية عن يحيى خان؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 4 فبراير 1917 في جكوال ووفاته في 10 أغسطس 1980 في راولبندي ودفنه في بيشاور، وقيادته للجيش ورئاسته، وانتخابات 1970 وسقوط دكا، وأصل أسرته القزلباشي. ويعطي صندوق معلوماتها الدين «إسلام» عموما."
  en: "Urdu Wikipedia article on Yahya Khan; used for entity facts only. It gives his birth on 4 February 1917 at Chakwal and death on 10 August 1980 at Rawalpindi with burial at Peshawar, his army command and presidency, the 1970 elections and the fall of Dhaka, and his Qizilbash family origin. Its infobox religion field gives Islam generically."
