reliability_note: "Structured dates, places and identifiers only (Wikipedia broad rule, AGENTS.md). Consulted on 26 October 2026. Item revision 2551914582 of 1 October 2026. It gives birth in 1868 (year precision) at Ruse (Q160173), and a second, day-precision birth value of 4 January 1868 referenced only to an import from a Wikimedia project, which no article supports and which is not followed. It gives death on 22 November 1948 — agreeing with both articles on the day — but places the death at Istanbul (Q406), which matches his burial city, Aşiyan Cemetery (Q4833524), rather than the articles' account of a heart attack on a train near Eskişehir; the articles are followed and the value disclosed. Its only religion value is Islam (Q432), generic, with a single URL reference (P854): one structured-data value naming no school."
