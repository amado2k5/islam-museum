summary:
  ar: "صفحة التعريف في الموقع الرسمي لحساي مجدددي: أكثر من عشرين عامًا في خدمة مجتمعات منطقة الخليج ومقاطعة أورانج ولوس أنجلوس منظِّمة ومعلمة ومرشدة روحية ومدافعة عن الصحة النفسية، وبداية رحلتها سنة 1996 في دروس الشيخ حمزة يوسف في هايورد، وإطلاقها موقع «الصحة النفسية للمسلمين» مع الدكتورة نفيسة سكندري."
  en: "The About page of Hosai Mojaddidi's official website: over twenty years serving the Bay Area and Orange County and Los Angeles communities as organizer, teacher, spiritual counsellor and mental-health advocate; her journey beginning in 1996 in Shaykh Hamza Yusuf's Hayward classes; and her launch of Mental Health 4 Muslims with Dr. Nafisa Sekandari."
