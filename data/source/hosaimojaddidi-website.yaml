summary:
  ar: "صفحة التعريف في الموقع الرسمي لحساي مجدددي: أكثر من عشرين عامًا في خدمة مجتمعات منطقة الخليج ومقاطعة أورانج ولوس أنجلوس منظِّمة ومعلمة ومرشدة روحية ومدافعة عن الصحة النفسية، وبداية رحلتها سنة 1996 في دروس الشيخ حمزة يوسف في هايورد، وإطلاقها موقع «الصحة النفسية للمسلمين» مع الدكتورة نفيسة سكندري."
  en: "The About page of Hosai Mojaddidi's official website: over twenty years serving the Bay Area and Orange County and Los Angeles communities as organizer, teacher, spiritual counsellor and mental-health advocate; her journey beginning in 1996 in Shaykh Hamza Yusuf's Hayward classes; and her launch of Mental Health 4 Muslims with Dr. Nafisa Sekandari."
  es: "La página \"Acerca de\" del sitio web oficial de Hosai Mojaddidi describe sus más de veinte años de servicio a las comunidades del Área de la Bahía, el Condado de Orange y Los Ángeles como organizadora, maestra, consejera espiritual y defensora de la salud mental; su trayectoria comenzó en 1996 en las clases del Shaykh Hamza Yusuf en Hayward; y el lanzamiento de Mental Health 4 Muslims con la Dra. Nafisa Sekandari."
  fr: "La page « À propos » du site officiel d’Hosai Mojaddidi: plus de vingt ans au service des communautés de la région de la baie de San Francisco, du comté d’Orange et de Los Angeles en tant qu’organisatrice, enseignante, conseillère spirituelle et défenseure de la santé mentale; son parcours a débuté en 1996 dans les cours de Shaykh Hamza Yusuf à Hayward; et elle a lancé Mental Health 4 Muslims avec le Dr Nafisa Sekandari."
  ur: "ہوسائی مجددی کی آفیشل ویب سائٹ کے بارے میں صفحہ: بیس سال سے زائد عرصے سے بے ایریا اور اورنج کاؤنٹی اور لاس اینجلس کی کمیونٹیز کے لیے بطور منتظم، استاد، روحانی مشیر اور دماغی صحت کے وکیل؛ اس کا سفر 1996 میں شیخ حمزہ یوسف کی ہیورڈ کلاسز میں شروع ہوا۔ اور ڈاکٹر نفیسہ سکندری کے ساتھ ان کی مینٹل ہیلتھ 4 مسلمز کا آغاز۔"
  tr: "Hasai Mujaddidi'nin resmi web sitesinde giriş sayfası: Körfez bölgesi, Orange County ve Los Angeles topluluklarına yirmi yılı aşkın süredir organizatör, öğretmen, manevi rehber ve ruh sağlığı savunucusu olarak hizmet etti. Yolculuğu 1996'da Hayward'da Sheikh Hamza Youssef ile derslerle başladı ve Dr. Nafisa Skandri ile birlikte \"Müslümanlar için Ruh Sağlığı\" adlı web sitesini başlattı."
  id: "Halaman pengantar di situs resmi Hasai Mujaddidi: Lebih dari dua puluh tahun melayani komunitas di wilayah Teluk, Orange County, dan Los Angeles sebagai penyelenggara, guru, pembimbing spiritual, dan advokat kesehatan mental. Perjalanannya dimulai pada tahun 1996 dengan pelajaran bersama Sheikh Hamza Youssef di Hayward, dan ia meluncurkan situs web \"Kesehatan Mental untuk Muslim\" bersama Dr. Nafisa Skandri."
