reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A long scholarly article: it heads his life 'c. 1720-30s - 7 May 1804', reporting one source's 1720 against Philipp's judgement for the 1730s, places his birth at Fatnica near Stolac in Herzegovina to the Bosniak Pervan family, records following Olivier that he sold himself to a slave trader and subsequently converted to Islam in Egypt, that Ali Bey al-Kabir adopted him as his protégé and made him sanjak-bey of Cairo, and that he died on 7 May 1804 after a tertian fever, having governed Sidon from Acre since 1776 and defended Acre against Napoleon in 1799. It names no legal school for him. Checked 1 November 2026."
