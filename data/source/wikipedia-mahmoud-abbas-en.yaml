  ar: "مقالة ويكيبيديا الإنجليزية عن محمود عباس؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في صفد في 15 نوفمبر 1935 ولجوء أسرته إلى سوريا سنة 1948، ودراسته القانون في دمشق والدكتوراه في موسكو، ودوره مؤسسًا في فتح، وتوقيعه اتفاق أوسلو الأول سنة 1993، ورئاسته الوزراء سنة 2003، وانتخابه رئيسًا سنة 2005 خلفًا لياسر عرفات. لا يسمّي نصها ولا صندوق معلوماتها مذهبًا له."
  en: "English Wikipedia article on Mahmoud Abbas; used for entity facts only. It recounts his birth in Safed on 15 November 1935, his family's flight to Syria in 1948, his law studies in Damascus and doctorate in Moscow, his role as a Fatah founder, his signing of the Oslo I Accord in 1993, his premiership in 2003, and his election as president in 2005 succeeding Yasser Arafat. Neither its text nor its infobox names a school for him."
