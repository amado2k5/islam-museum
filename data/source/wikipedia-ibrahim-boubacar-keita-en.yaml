summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم بو بكر كيتا؛ تُستخدم لوقائع الكيان فقط. تروي مولده في كوتيالا في 29 يناير 1945 ورئاسته وزراء مالي (1994–2000) ورئاسته الجمعية الوطنية (2002–2007) ورئاسته الجمهورية (2013–2020) وإجباره على الاستقالة بعد انقلاب 2020 ووفاته في بيته بباماكو في 16 يناير 2022، وتذكر دعم القادة والجمعيات الإسلامية لترشحه سنة 2002 والجدل حول توافق سياساته مع الإسلام."
  en: "English Wikipedia article on Ibrahim Boubacar Keïta; used for entity facts only. It recounts his birth at Koutiala on 29 January 1945, his premiership of Mali (1994–2000), his presidency of the National Assembly (2002–2007), his presidency (2013–2020), his forced resignation after the 2020 coup, and his death at home in Bamako on 16 January 2022. On religion its text records the strong backing of Muslim leaders and associations for his 2002 candidacy and that some doubted his policies were compatible with Islam; no school is named."
  es: "Artículo de la Wikipedia en inglés sobre Ibrahim Boubacar Keïta; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Koutiala el 29 de enero de 1945, su mandato como primer ministro de Malí (1994-2000), su presidencia de la Asamblea Nacional (2002-2007), su presidencia (2013-2020), su dimisión forzada tras el golpe de Estado de 2020 y su fallecimiento en su domicilio de Bamako el 16 de enero de 2022. En cuanto a la religión, el texto recoge el fuerte apoyo de líderes y asociaciones musulmanas a su candidatura en 2002 y las dudas de algunos sobre la compatibilidad de sus políticas con el islam; no se menciona ninguna escuela."
  fr: "Article de Wikipédia en anglais sur Ibrahim Boubacar Keïta; utilisé uniquement pour les informations biographiques. Il relate sa naissance à Koutiala le 29 janvier 1945, son mandat de Premier ministre du Mali (1994-2000), sa présidence de l’Assemblée nationale (2002-2007), sa présidence (2013-2020), sa démission forcée après le coup d’État de 2020 et son décès à son domicile de Bamako le 16 janvier 2022. Concernant la religion, le texte mentionne le soutien important apporté par les dirigeants et associations musulmanes à sa candidature de 2002 et indique que certains doutaient de la compatibilité de sa politique avec l’islam; aucune école n’est citée."
  ur: "ابراہیم بوبکر کیٹا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 29 جنوری 1945 کو کوٹیالا میں ان کی پیدائش، مالی کی ان کی وزارت عظمیٰ (1994–2000)، ان کی قومی اسمبلی کی صدارت (2002–2007)، ان کی صدارت (2013–2020)، 2020 کی بغاوت کے بعد ان کا جبری استعفیٰ، اور جنوری 2020 میں باکو 2020 میں ان کی موت کا متن بیان کیا گیا ہے۔ اپنی 2002 کی امیدواری کے لیے مسلم رہنماؤں اور انجمنوں کی مضبوط حمایت کو ریکارڈ کرتا ہے اور کچھ لوگوں کو شک تھا کہ اس کی پالیسیاں اسلام سے مطابقت رکھتی ہیں۔ کسی سکول کا نام نہیں ہے۔"
