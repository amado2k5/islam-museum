  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم بو بكر كيتا؛ تُستخدم لوقائع الكيان فقط. تروي مولده في كوتيالا في 29 يناير 1945 ورئاسته وزراء مالي (1994–2000) ورئاسته الجمعية الوطنية (2002–2007) ورئاسته الجمهورية (2013–2020) وإجباره على الاستقالة بعد انقلاب 2020 ووفاته في بيته بباماكو في 16 يناير 2022، وتذكر دعم القادة والجمعيات الإسلامية لترشحه سنة 2002 والجدل حول توافق سياساته مع الإسلام."
  en: "English Wikipedia article on Ibrahim Boubacar Keïta; used for entity facts only. It recounts his birth at Koutiala on 29 January 1945, his premiership of Mali (1994–2000), his presidency of the National Assembly (2002–2007), his presidency (2013–2020), his forced resignation after the 2020 coup, and his death at home in Bamako on 16 January 2022. On religion its text records the strong backing of Muslim leaders and associations for his 2002 candidacy and that some doubted his policies were compatible with Islam; no school is named."
