summary:
  ar: "مدخل «الحِيَل» في موسوعة TDV الإسلامية بقلم جواد إزغي: علم الميكانيكا التطبيقية والتقنية الميكانيكية في تاريخ العلوم الإسلامية، وتعريف الفارابي له فرعاً عملياً من العلوم الرياضية وتضييق الخوارزمي له في الرافعات والمنجنيقات والآلات المائية والأوتوماتا، وكتاب بني موسى في الحيل، وابن الرزاز الجزري وابن الساعاتي، وموضع الهندسة الإنشائية فيه."
  en: "The TDV İslâm Ansiklopedisi entry on hiyel by Cevat İzgi: the science of mechanical technology in Islamic intellectual history — al-Farabi's broad definition as the practical branch of the mathematical sciences and al-Khwarizmi's narrow one of levers, mangonels, hydraulic machines and automata; the Banu Musa's Kitab al-Hiyal, Ibn al-Sa'ati's water clock and al-Jazari's great book, and where the engineer's work sits within it."
