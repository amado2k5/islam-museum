summary:
  ar: "مدخل «الحِيَل» في موسوعة TDV الإسلامية بقلم جواد إزغي: علم الميكانيكا التطبيقية والتقنية الميكانيكية في تاريخ العلوم الإسلامية، وتعريف الفارابي له فرعاً عملياً من العلوم الرياضية وتضييق الخوارزمي له في الرافعات والمنجنيقات والآلات المائية والأوتوماتا، وكتاب بني موسى في الحيل، وابن الرزاز الجزري وابن الساعاتي، وموضع الهندسة الإنشائية فيه."
  en: "The TDV İslâm Ansiklopedisi entry on hiyel by Cevat İzgi: the science of mechanical technology in Islamic intellectual history — al-Farabi's broad definition as the practical branch of the mathematical sciences and al-Khwarizmi's narrow one of levers, mangonels, hydraulic machines and automata; the Banu Musa's Kitab al-Hiyal, Ibn al-Sa'ati's water clock and al-Jazari's great book, and where the engineer's work sits within it."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre hiyel, de Cevat İzgi, describe la ciencia de la tecnología mecánica en la historia intelectual islámica: la definición amplia de al-Farabi como la rama práctica de las ciencias matemáticas y la definición restringida de al-Khwarizmi sobre palancas, mangoneles, máquinas hidráulicas y autómatas; el Kitab al-Hiyal de Banu Musa, el reloj de agua de Ibn al-Sa'ati y el gran libro de al-Jazari, y el lugar que ocupa el trabajo del ingeniero dentro de todo ello."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le hiyel par Cevat İzgi: la science de la technologie mécanique dans l'histoire intellectuelle islamique — la définition large d'al-Farabi comme branche pratique des sciences mathématiques et la définition étroite d'al-Khwarizmi des leviers, mangonneaux, machines hydrauliques et automates; le Kitab al-Hiyal des Banu Musa, l'horloge à eau d'Ibn al-Sa'ati et le grand livre d'al-Jazari, et la place qu'y occupe le travail de l'ingénieur."
