reliability_note: "Read on 1 November 2026 in the web edition. Read in full: the introduction on the word's origin, the Abbasid section (vizierate under the Umayyads, the early Abbasids, the Buyid and Seljuk periods, the appointment ceremony and Mawardi's two kinds of vizier), and the Ottoman section by Halil İnalcık to its last paragraph. Not read for this record: the Karakhanid section, the Ayyubid and Fatimid section, the Ilkhanid section and the Mamluk section, which are not used here. The entry's bibliography names İA XIII, EI2 'Wazīr' by Zaman, and works by Mawardi, Sourdel, Goitein and Dûrî; none of those was read, and the claims attributed to them are cited to this entry. Cited by printed page range (vol. 43, pp. 79–82)."
