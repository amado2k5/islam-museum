summary:
  ar: "مدخل «وزير» في موسوعة TDV الإسلامية التركية (المجلد 43، إسطنبول 2013، ص 79–82)، وهو من خمسة أقسام: أصل الكلمة وتاريخ الوزارة في العهد العباسي بقلم فاتح يحيى أياز، والوزارة في الدول التركية الإسلامية بقلم عبد الكريم أوزايدن، والوزارة في الدولة العثمانية بقلم خليل إينالجيك، ويشمل الوزارة عند الأيوبيين والفاطميين والإلخانيين والمماليك في أقسام لم تُقرأ لهذا السجل."
  en: "The TDV İslâm Ansiklopedisi entry 'VEZİR' (vol. 43, Istanbul 2013, pp. 79–82), in five sections: the origin of the word and the Abbasid vizierate by Fatih Yahya Ayaz, the Karakhanid part by Abdülkerim Özaydın, the Ottoman part by Halil İnalcık, and the Ayyubid, Fatimid and Ilkhanid parts by Fatih Yahya Ayaz and Osman Gazi Özgüdenli. It covers the vizier's offices, appointment and insignia, and the Ottoman grand vizierate."
