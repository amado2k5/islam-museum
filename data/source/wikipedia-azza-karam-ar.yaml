summary:
  ar: "مقالة ويكيبيديا العربية عن عزة كرم ⁦(وُلدت 1968)⁩؛ تُستخدم لوقائع الكيان فقط. تروي نشأتها ودراستها ومسيرتها في الأمم المتحدة ومنظمة أديان من أجل السلام وأستاذيتها في أمستردام ونوتردام، موازية في مضمونها للمقالة الإنجليزية."
  en: "Arabic Wikipedia article on Azza Karam (born 1968); used for entity facts only. It parallels the English article on her upbringing, education, United Nations and Religions for Peace career, and her Amsterdam and Notre Dame professorships. Closely follows the English article, so it is not a fully independent family from it."
  es: "Artículo de Wikipedia en árabe sobre Azza Karam (nacida en 1968); se utiliza únicamente para datos sobre la persona. Es paralelo al artículo en inglés sobre su infancia, educación, trayectoria en las Naciones Unidas y Religiones por la Paz, y sus cátedras en Ámsterdam y Notre Dame. Sigue de cerca el artículo en inglés, por lo que no es completamente independiente."
  fr: "L'article de Wikipédia en arabe consacré à Azza Karam (née en 1968) est utilisé uniquement à titre informatif. Il reprend les éléments de l'article en anglais concernant son enfance, ses études, son engagement auprès des Nations Unies et de Religions pour la Paix, ainsi que ses postes de professeure à Amsterdam et à Notre-Dame. S'inspirant largement de l'article anglais, il ne constitue pas un article totalement indépendant."
  ur: "عزا کرم پر عربی ویکیپیڈیا مضمون ⁦(پیدائش 1968)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پرورش، تعلیم، اقوام متحدہ اور مذاہب برائے امن کیریئر، اور اس کے ایمسٹرڈیم اور نوٹر ڈیم پروفیسروں کے انگریزی مضمون کے متوازی ہے۔ انگریزی مضمون کی قریب سے پیروی کرتا ہے، لہذا یہ اس سے مکمل طور پر آزاد خاندان نہیں ہے۔"
  tr: "Azza Karam (1968 doğumlu) hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Birleşmiş Milletler ve Barış için Dinler Örgütü'ndeki yetiştirilme sürecini, eğitimini ve kariyerini, ayrıca İngilizce makaleye paralel içerik olarak Amsterdam ve Notre Dame'daki profesörlüğünü anlatır."
  id: "Artikel Wikipedia bahasa Arab tentang Azza Karam (lahir 1968); hanya digunakan untuk fakta entitas. Artikel ini menceritakan masa kecilnya, studi, dan kariernya di Perserikatan Bangsa-Bangsa dan Organisasi Agama untuk Perdamaian, serta jabatan profesornya di Amsterdam dan Notre Dame, yang isinya paralel dengan artikel berbahasa Inggris."
