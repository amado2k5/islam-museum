summary:
  ar: "مقالة ويكيبيديا العربية عن راجه برويز أشرف؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 26 ديسمبر 1950 في سنغهر، ووزارته للمياه والطاقة في حكومة يوسف رضا غيلاني، ورئاسته الوزراء من 22 يونيو 2012 إلى 16 مارس 2013، وتهما بالفساد واجهها أثناء وزارته. ويعطي صندوق معلوماتها دينه «الإسلام» بصورة عامة."
  en: "Arabic Wikipedia article on Raja Pervez Ashraf; used for entity facts only. It gives his birth on 26 December 1950 at Sanghar, his water and power ministry in Yousaf Raza Gillani's government, his premiership from 22 June 2012 to 16 March 2013, and corruption charges he faced as minister. Its infobox gives his religion as Islam, generically."
  es: "Artículo en árabe de la Wikipedia sobre Raja Pervez Ashraf; utilizado únicamente para datos sobre la persona. Indica su fecha de nacimiento, el 26 de diciembre de 1950 en Sanghar, su ministerio de Agua y Energía en el gobierno de Yousaf Raza Gillani, su mandato como primer ministro desde el 22 de junio de 2012 hasta el 16 de marzo de 2013, y las acusaciones de corrupción que enfrentó como ministro. Su ficha informativa indica que su religión era el islam, de forma genérica."
  fr: "Article Wikipédia en arabe consacré à Raja Pervez Ashraf; utilisé uniquement pour les informations le concernant. Il mentionne sa naissance le 26 décembre 1950 à Sanghar, son poste de ministre de l’Eau et de l’Énergie au sein du gouvernement de Yousaf Raza Gillani, son mandat de Premier ministre du 22 juin 2012 au 16 mars 2013, ainsi que les accusations de corruption auxquelles il a été confronté lorsqu’il était ministre. Son infobox indique qu’il est de religion musulmane, de manière générale."
  ur: "راجہ پرویز اشرف پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 26 دسمبر 1950 کو سانگھڑ میں ہوئی، یوسف رضا گیلانی کی حکومت میں ان کی وزارت پانی و بجلی، 22 جون 2012 سے 16 مارچ 2013 تک ان کی وزارت عظمیٰ، اور بطور وزیر کرپشن کے الزامات کا سامنا کرنا پڑا۔ اس کا معلوماتی خانہ عام طور پر اس کے مذہب کو بطور اسلام دیتا ہے۔"
