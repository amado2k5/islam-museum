  ar: "مقالة ويكيبيديا العربية عن راجه برويز أشرف؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 26 ديسمبر 1950 في سنغهر، ووزارته للمياه والطاقة في حكومة يوسف رضا غيلاني، ورئاسته الوزراء من 22 يونيو 2012 إلى 16 مارس 2013، وتهما بالفساد واجهها أثناء وزارته. ويعطي صندوق معلوماتها دينه «الإسلام» بصورة عامة."
  en: "Arabic Wikipedia article on Raja Pervez Ashraf; used for entity facts only. It gives his birth on 26 December 1950 at Sanghar, his water and power ministry in Yousaf Raza Gillani's government, his premiership from 22 June 2012 to 16 March 2013, and corruption charges he faced as minister. Its infobox gives his religion as Islam, generically."
