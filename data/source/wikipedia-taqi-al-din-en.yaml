summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تقي الدين بن معروف ⁦(1526-1585)⁩؛ لوقائع الكيان فقط: ولادته بدمشق وتعليمه وتدريسه وقضاؤه بفلسطين ودمشق ومصر، تعيينه منجّم باشي 1571 ومرصده بإستانبول، وأنه وصف في «الطرق السنية في الآلات الروحانية» سنة 1551 سيخاً دواراً تديره ريح البخار على ريش عجلة — وصفة في تاريخ التوربين البخاري — وأربع آلات رفع ماء منها مضخة الأسطوانات الست."
  en: "English Wikipedia article on Taqi al-Din Muhammad ibn Ma'ruf (1526-1585); entity facts only: born in Damascus, educated and taught and served as qadi in Palestine, Damascus and Egypt, appointed chief astronomer in 1571 with the Constantinople observatory, and that in the Al-Turuq al-saniyya fi al-alat al-ruhaniyya of 1551 he described a self-rotating spit turned by steam directed onto the vanes of a wheel — a description important in the history of the steam turbine — plus four water-raising machines including the six-cylinder pump."
