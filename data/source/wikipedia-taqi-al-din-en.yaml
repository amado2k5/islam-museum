summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تقي الدين بن معروف ⁦(1526-1585)⁩؛ لوقائع الكيان فقط: ولادته بدمشق وتعليمه وتدريسه وقضاؤه بفلسطين ودمشق ومصر، تعيينه منجّم باشي 1571 ومرصده بإستانبول، وأنه وصف في «الطرق السنية في الآلات الروحانية» سنة 1551 سيخاً دواراً تديره ريح البخار على ريش عجلة — وصفة في تاريخ التوربين البخاري — وأربع آلات رفع ماء منها مضخة الأسطوانات الست."
  en: "English Wikipedia article on Taqi al-Din Muhammad ibn Ma'ruf (1526-1585); entity facts only: born in Damascus, educated and taught and served as qadi in Palestine, Damascus and Egypt, appointed chief astronomer in 1571 with the Constantinople observatory, and that in the Al-Turuq al-saniyya fi al-alat al-ruhaniyya of 1551 he described a self-rotating spit turned by steam directed onto the vanes of a wheel — a description important in the history of the steam turbine — plus four water-raising machines including the six-cylinder pump."
  es: "Artículo de la Wikipedia en inglés sobre Taqi al-Din Muhammad ibn Ma'ruf (1526-1585); solo datos sobre la entidad: nació en Damasco, se educó, enseñó y sirvió como cadí en Palestina, Damasco y Egipto, fue nombrado astrónomo jefe en 1571 en el observatorio de Constantinopla, y en el Al-Turuq al-saniyya fi al-alat al-ruhaniyya de 1551 describió un asador autorrotatorio impulsado por vapor dirigido a las paletas de una rueda —una descripción importante en la historia de la turbina de vapor— además de cuatro máquinas de elevación de agua, incluida la bomba de seis cilindros."
  fr: "Article de Wikipédia en anglais sur Taqi al-Din Muhammad ibn Ma'ruf (1526-1585); faits concernant l'entité uniquement: né à Damas, éduqué et enseigné, il a servi comme cadi en Palestine, à Damas et en Égypte, nommé astronome en chef en 1571 à l'observatoire de Constantinople, et dans l'Al-Turuq al-saniyya fi al-alat al-ruhaniyya de 1551, il décrit une broche auto-rotative actionnée par de la vapeur dirigée sur les aubes d'une roue — une description importante dans l'histoire de la turbine à vapeur — ainsi que quatre machines d'élévation d'eau, dont la pompe à six cylindres."
