summary:
  ar: "مقالة ويكيبيديا الملايوية عن حاجي عبد الرحمن ليمبونغ؛ تُستخدم لوقائع الكيان فقط. وهي أكمل الروايات: وُلد نحو 1285 هـ/1868م في ترنغانو، وتعلّم في مكة وعلى توك كو بالوه، وكان — مثل شيخه — عاملًا بالطريقة السمانية؛ وعلّم في ترنغانو وأرجاء الأرخبيل، وقاد انتفاضة أيار 1928، وحُوكم ونُفي إلى سنغافورة أولًا في 13 حزيران 1928 ثم إلى مكة، وتوفي فيها في 14 جمادى الآخرة 1348 هـ (16 تشرين الثاني 1929) بحسب برقية من جدة."
  en: "Malay Wikipedia article on Haji Abdul Rahman Limbong; used for entity facts only. The fullest account: born c. 1285 H/1868 in Terengganu, educated at Mecca and under Tok Ku Paloh, and — like his teacher — a practitioner of the Sammaniyah order; he taught across Terengganu and the archipelago, led the May 1928 rising, was tried, exiled first to Singapore (13 June 1928) and then to Mecca, and died there on 14 Jumada al-Akhirah 1348 (16 November 1929), the date reported by a telegram from Jeddah."
