summary:
  ar: "مقالة ويكيبيديا الملايوية عن حاجي عبد الرحمن ليمبونغ؛ تُستخدم لوقائع الكيان فقط. وهي أكمل الروايات: وُلد نحو 1285 هـ/1868م في ترنغانو، وتعلّم في مكة وعلى توك كو بالوه، وكان — مثل شيخه — عاملًا بالطريقة السمانية؛ وعلّم في ترنغانو وأرجاء الأرخبيل، وقاد انتفاضة أيار 1928، وحُوكم ونُفي إلى سنغافورة أولًا في 13 حزيران 1928 ثم إلى مكة، وتوفي فيها في 14 جمادى الآخرة 1348 هـ ⁦(16 تشرين الثاني 1929)⁩ بحسب برقية من جدة."
  en: "Malay Wikipedia article on Haji Abdul Rahman Limbong; used for entity facts only. The fullest account: born c. 1285 H/1868 in Terengganu, educated at Mecca and under Tok Ku Paloh, and — like his teacher — a practitioner of the Sammaniyah order; he taught across Terengganu and the archipelago, led the May 1928 rising, was tried, exiled first to Singapore (13 June 1928) and then to Mecca, and died there on 14 Jumada al-Akhirah 1348 (16 November 1929), the date reported by a telegram from Jeddah."
  es: "Artículo de Wikipedia en malayo sobre Haji Abdul Rahman Limbong; utilizado únicamente para datos sobre la persona. El relato más completo: nació alrededor de 1285 H/1868 en Terengganu, se educó en La Meca y con Tok Ku Paloh, y —al igual que su maestro— practicante de la orden Sammaniyah; enseñó en Terengganu y el archipiélago, lideró el levantamiento de mayo de 1928, fue juzgado, exiliado primero a Singapur (13 de junio de 1928) y luego a La Meca, y murió allí el 14 de Jumada al-Akhirah de 1348 (16 de noviembre de 1929), fecha informada por un telegrama de Jeddah."
  fr: "Article de Wikipédia en malais sur Haji Abdul Rahman Limbong; utilisé uniquement pour les informations factuelles. Le récit le plus complet: né vers 1285 H/1868 à Terengganu, il fit ses études à La Mecque et auprès de Tok Ku Paloh, et – comme son maître – il était un adepte de l’ordre Sammaniyah; il enseigna à travers Terengganu et l’archipel, mena le soulèvement de mai 1928, fut jugé, exilé d’abord à Singapour (13 juin 1928) puis à La Mecque, où il mourut le 14 Jumada al-Akhirah 1348 (16 novembre 1929), date rapportée par un télégramme de Djeddah."
  ur: "حاجی عبدالرحمن لمبونگ پر مالائی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ مکمل حساب: پیدائش سی۔ تیرنگانو میں 1285 H/1868، مکہ میں اور ٹوک کو پالوہ کے تحت تعلیم حاصل کی، اور - اپنے استاد کی طرح - سامنیہ حکم کے ایک پریکٹیشنر؛ اس نے تیرنگانو اور جزیرہ نما میں تعلیم دی، مئی 1928 کے عروج کی قیادت کی، اس پر مقدمہ چلایا گیا، پہلے سنگاپور ⁦(13 جون 1928)⁩ اور پھر مکہ کو جلاوطن کر دیا گیا، اور وہیں 14 جمادی الآخرۃ 1348 ⁦(16 نومبر 1929)⁩ کو انتقال کر گئے، یہ تاریخ ایک ٹیلی گرام کے ذریعے بتائی گئی۔"
  tr: "Hacı Abdul Rahman Limbong hakkında Malay Vikipedi makalesi; yalnızca varlığın olayları için kullanılmıştır. Bunlar en kapsamlı anlatımlardır: Yaklaşık 1285 Hicri / 1868 yılında Terengganu'da doğdu, Mekke'de ve Tuk Ko Balu'da eğitim gördü ve şeyhi gibi — Samani tarikatında çalıştı; Terengganu'da ve takımadalar genelinde ders verdi, Mayıs 1928 ayaklanmasına öncülük etti, önce 13 Haziran 1928'de yargılandı ve önce Singapur'a, ardından Mekke'ye sürgün edildi; burada 14 Cumeda el-Akhirah 1348 Hicri (16 Kasım 1929) tarihinde öldü, Cidde'den gelen bir telgrafa göre."
  id: "Artikel Wikipedia Bahasa Melayu tentang Haji Abdul Rahman Limbong; hanya digunakan untuk peristiwa entitas tersebut. Ini adalah catatan paling lengkap: Ia lahir sekitar tahun 1285 H / 1868 M di Terengganu, belajar di Mekah dan di Tuk Ko Balu, dan seperti sheikh-nya — bekerja dalam ordo Samanid; mengajar di Terengganu dan seluruh kepulauan, memimpin pemberontakan Mei 1928, diadili dan diasingkan ke Singapura pertama pada 13 Juni 1928, kemudian ke Mekah, di mana ia meninggal pada 14 Jumada al-Akhirah 1348 H (16 November 1929), menurut telegram dari Jeddah."
