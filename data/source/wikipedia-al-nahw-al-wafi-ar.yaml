summary:
  ar: "صفحة «عباس حسن ⁦(نحوي)⁩» في ويكيبيديا العربية، وهي الصفحة الموثِّقة التي سماها ملخص بحثي قُدّم إلى المتحف للكتاب «النحو الوافي»؛ لم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص دون إعادة تحقق في 21 نوفمبر 2026، في موضوع: نسبة الكتاب إلى مؤلفه وتاريخه."
  en: "The page \"عباس حسن ⁦(نحوي)⁩\" on the Arabic Wikipedia, named by a research summary supplied to the museum as the documenting page for al-Nahw al-Wafi; the museum did not open the page, and the founder approved using the summary without re-verification on 21 November 2026, for the ascription of the work to its author and its date."
  ur: "عربی ویکیپیڈیا پر صفحہ «عباس حسن ⁦(نحوي)⁩»، جسے عجائب گھر کو دیے گئے ایک تحقیقی خلاصے نے «النحو الوافی» کا مستند صفحہ بتایا؛ عجائب گھر نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصے کے استعمال کی منظوری دی، موضوع: کتاب کی مصنف سے نسبت اور اس کی تاریخ۔"
  fr: "La page « عباس حسن ⁦(نحوي)⁩ » de Wikipédia (arabe), nommée par un résumé de recherche remis au musée comme page documentaire de al-Nahw al-Wafi ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé sans nouvelle vérification le 21 novembre 2026, pour l'attribution de l'ouvrage à son auteur et sa date."
  es: "La página «عباس حسن ⁦(نحوي)⁩» de Wikipedia (en árabe), nombrada por un resumen de investigación entregado al museo como página documental de al-Nahw al-Wafi; el museo no abrió la página, y el fundador aprobó usar el resumen sin nueva verificación el 21 de noviembre de 2026, para la atribución de la obra a su autor y su fecha."
  tr: "Arap Vikipedi'deki \"Abbas Hassan (dilbilgici)\" sayfası, kendisinin \"Al-Nahw Al-Wafi\" kitabı için müzeye sunulan araştırma özeti olarak adlandırılan belgelenmiş sayfa; müze sayfayı açmadı ve kurucu, 21 Kasım 2026'da özetin yeniden doğrulama olmaksızın kullanılmasına izin verdi: kitabın yazarına ve tarihine atfedilmesi konusunda."
  id: "Halaman \"Abbas Hassan (ahli tata bahasa)\" di Wikipedia Arab, yang merupakan halaman terdokumentasi yang ia sebut ringkasan penelitian yang diajukan ke museum untuk buku \"Al-Nahw Al-Wafi\"; museum tidak membuka halaman tersebut, dan pendiri mengizinkan penggunaan ringkasan tanpa verifikasi ulang pada 21 November 2026, dengan topik: atribusi buku kepada penulisnya dan sejarahnya."
