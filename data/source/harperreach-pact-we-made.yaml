summary:
  ar: "صفحة الناشر ⁦(هاربر كولينز)⁩ لرواية «The Pact We Made» مع سيرة مؤلفتها ليلى العمار: نشأت في الكويت لأم أمريكية وأب كويتي، وماجستير في الكتابة الإبداعية من جامعة إدنبرة."
  en: "The publisher's (HarperCollins) product page for The Pact We Made, carrying Layla AlAmmar's author biography: she grew up in Kuwait, with an American mother and a Kuwaiti father, and holds a master's in creative writing from the University of Edinburgh."
  es: "La página del producto de la editorial (HarperCollins) para The Pact We Made, que incluye la biografía de la autora Layla AlAmmar: creció en Kuwait, con una madre estadounidense y un padre kuwaití, y tiene una maestría en escritura creativa de la Universidad de Edimburgo."
  fr: "La page produit de l'éditeur (HarperCollins) pour The Pact We Made, contenant la biographie de l'auteure Layla AlAmmar: elle a grandi au Koweït, d'une mère américaine et d'un père koweïtien, et est titulaire d'une maîtrise en écriture créative de l'Université d'Édimbourg."
  ur: "The Pact We Made کے لیے پبلشر کا (HarperCollins) پروڈکٹ صفحہ، جس میں لیلیٰ الامر کی مصنفہ کی سوانح عمری ہے: وہ کویت میں ایک امریکی ماں اور کویتی والد کے ساتھ پلا بڑھا، اور ایڈنبرا یونیورسٹی سے تخلیقی تحریر میں ماسٹر کی ڈگری حاصل کی۔"
  tr: "Yayıncı sayfası (Harper Collins) 'The Pact We Made' romanı ve yazarı Layla Al-Ammar'ın biyografisi: Kuveyt'te Amerikalı bir anne ve Kuveytli bir babanın çocuğu oldum ve Edinburgh Üniversitesi'nden yaratıcı yazarlık alanında yüksek lisans derecesine sahibim."
  id: "Halaman penerbit (Harper Collins) untuk novel 'The Pact We Made' dengan biografi penulisnya Layla Al-Ammar: Saya tumbuh di Kuwait dari ibu Amerika dan ayah Kuwait, dan memiliki gelar master dalam penulisan kreatif dari University of Edinburgh."
