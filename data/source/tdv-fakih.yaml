summary:
  ar: "مدخل «فقيه» في موسوعة TDV الإسلامية (المجلد 12، إسطنبول 1995، ص 126–127) بقلم حيرالدين كارامان، يتناول معنى اللفظ في القرآن والحديث، والفرق بين الفقيه والمجتهد، وطبقات الفقهاء عند الحنفية وغيرهم، ومعه مداخل مرتبطة بالفقه والاجتهاد والتقليد والإفتاء والعلمية."
  en: "The TDV İslâm Ansiklopedisi entry 'FAKİH' (vol. 12, Istanbul 1995, pp. 126–127) by Hayreddin Karaman. It covers the word in the Qur'an and hadith, the difference between the faqih and the mujtahid, the Hanafi and other ranks of jurists, and carries related short entries on fiqh, ijtihad, taqlid, the fatwa-giver and the ilmiyye."
