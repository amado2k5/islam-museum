summary:
  ar: "مقالة ويكيبيديا العربية عن ناصر حسين؛ بذرة قصيرة تُستخدم لوقائع الكيان الأساسية فقط. تذكر مولده في 28 مارس 1968 في الهند ولعبه لمنتخب إنجلترا للكريكت، وتخطئ في نسبة لعبه المحلي، فلا يُعتمد عليها في وقائع الأندية."
  en: "Arabic Wikipedia article on Nasser Hussain; a short stub used for basic entity facts only. It gives his birth on 28 March 1968 in India and his play for the England cricket team, and misattributes his domestic cricket, so it is not relied on for club facts."
  es: "Artículo en árabe de la Wikipedia sobre Nasser Hussain; un breve fragmento que solo contiene información básica sobre la persona. Indica que nació el 28 de marzo de 1968 en India y que jugó para la selección inglesa de críquet, pero atribuye erróneamente su participación en el críquet nacional, por lo que no se recomienda consultar información sobre clubes."
  fr: "Article Wikipédia en arabe sur Nasser Hussain; une ébauche succincte servant uniquement à fournir des informations de base. On y trouve la date de naissance de Nasser Hussain, le 28 mars 1968 en Inde, ainsi que des informations sur son passage dans l’équipe d’Angleterre de cricket. Cependant, des erreurs sont commises concernant ses performances en club; cet article n’est donc pas pertinent pour les informations relatives à son club."
  ur: "ناصر حسین پر عربی ویکیپیڈیا مضمون؛ ایک مختصر سٹب جو صرف بنیادی ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ یہ 28 مارچ 1968 کو ہندوستان میں اس کی پیدائش اور انگلینڈ کی کرکٹ ٹیم کے لیے اس کے کھیل کو جنم دیتا ہے، اور اس کی ڈومیسٹک کرکٹ کو غلط بیان کرتا ہے، اس لیے کلب کے حقائق پر انحصار نہیں کیا جاتا ہے۔"
  tr: "Nasser Hüseyin hakkında Arapça Vikipedi makalesi; sadece varlığın temel gerçekleri için kullanılan kısa bir taslak. 28 Mart 1968'de Hindistan'da doğduğunu ve İngiltere milli kriket takımında oynadığını belirtir, ancak yanlışlıkla yerel oyunlarını buna bağlar, bu yüzden kulüp bilgilerinde buna dayanmaz."
  id: "Artikel Wikipedia bahasa Arab tentang Nasser Hussein; sebuah stub singkat yang hanya digunakan untuk fakta dasar entitas. Ia menyebutkan kelahirannya pada 28 Maret 1968 di India dan bermain untuk tim kriket nasional Inggris, dan keliru mengaitkan permainan domestiknya dengan tim tersebut, sehingga ia tidak mengandalkannya dalam fakta klub."
