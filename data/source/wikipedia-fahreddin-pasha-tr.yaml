summary:
  ar: "مقالة ويكيبيديا التركية عن عمر فخر الدين توركان؛ تُستخدم لوقائع الكيان فقط. تروي ألقابه «مدافع المدينة» و«نمر الصحراء»، ودفاعه عن المدينة، ووفاته قرب إسكي شهير سنة 1948 ودفنه في مقبرة أشيان."
  en: "Turkish Wikipedia article on Ömer Fahreddin Türkkan; used for entity facts only. It records his bynames 'Defender of Medina' and 'Tiger of the Desert', his defence of Medina, and his death near Eskişehir in 1948 and burial at Aşiyan Cemetery."
  es: "Artículo de la Wikipedia en turco sobre Ömer Fahreddin Türkkan; utilizado únicamente para datos sobre la persona. En él se recogen sus sobrenombres de «Defensor de Medina» y «Tigre del Desierto», su defensa de Medina, su muerte cerca de Eskişehir en 1948 y su entierro en el cementerio de Aşiyan."
  fr: "Article de Wikipédia en turc sur Ömer Fahreddin Türkkan; utilisé uniquement à des fins d'information sur l'entité. Il relate ses surnoms de « Défenseur de Médine » et de « Tigre du désert », sa défense de Médine, sa mort près d'Eskişehir en 1948 et son inhumation au cimetière d'Aşiyan."
  ur: "Ömer Fahreddin Türkkan پر ترک ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے نام 'مدینہ کا محافظ' اور 'صحرا کا شیر'، مدینہ کا دفاع، اور 1948 میں ایسکیہر کے قریب ان کی موت اور آشیان قبرستان میں تدفین درج ہے۔"
  tr: "Omar Fahrettin Türkan hakkında Türkçe Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 'Şehir Savunucusu' ve 'Çöl Kaplanı' başlıkları, şehri savunmasını, 1948'de Eskişehir yakınlarında ölümünü ve Çayan Mezarlığı'na defnedilmesini anlatır."
  id: "Artikel Wikipedia Turki tentang Omar Fahrettin Türkan hanya digunakan untuk fakta entitas tersebut. Gelarnya 'City Defender' dan 'Desert Tiger' menceritakan pertahanannya terhadap kota, kematiannya di dekat Eskişehir pada tahun 1948, dan pemakamannya di Pemakaman Çayan."
