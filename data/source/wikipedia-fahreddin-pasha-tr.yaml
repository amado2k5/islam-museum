reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical; the article is reached through the item's Turkish sitelink, the title 'Fahreddin Paşa' being a stale 2011 redirect. It agrees with the English article on his birth in 1868 at Rusçuk, his governorship and defence of Medina, his death on 22 November 1948 from a heart attack on a train near Eskişehir, and his burial at Aşiyan Cemetery, Istanbul, as he wished. It names his bynames 'Medine Müdafii' (Defender of Medina), 'Çöl Kaplanı' (Tiger of the Desert) and 'Medine Kahramanı', and records that as deputy commander of the Fourth Army he dealt with the resettlement of deported Armenians and suppressed the Armenian revolts at Urfa, Zeytun, Musa Dagh and Haçin. Neither its infobox nor its text states any religion for him."
