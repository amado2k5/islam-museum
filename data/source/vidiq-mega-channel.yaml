reliability_note: "Platform statistics aggregator, not a museum-verified fact: the figure of 730,000 subscribers (66,231,151 total views, 1,583 videos) was read from vidIQ on 8 November 2026 and is used only as a dated audience figure. The page also records that the channel was created on 19 April 2017, that its channel country is set to Bangladesh and that it ranks #3,511 in Religion; its top videos are lectures by Shoaib Ahmed Ashrafi, Amir Hamza, Maulana Mahmudul Hasan and Abul Kalam Azad Bashar. The most-viewed catalogue is 2021–2024 material and views still accrue (about 121,000 in the 28 days before the read). Upload recency beyond that catalogue was not separately evidenced. The page names no owner, head or operator for the channel. vidIQ's estimated earnings are modelled and are not used."
