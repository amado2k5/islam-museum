  ar: "مقالة ويكيبيديا الإنجليزية عن شهزية سكندر؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها سنة 1969 في لاهور، ودراستها فنّ المنمنمات الإندو-فارسية في الكلية الوطنية للفنون ودرجة الماجستير من رود آيلاند سنة 1995، وعملها «المخطوطة» و«سبين»، وإقامتها في نيويورك."
  en: "English Wikipedia article on Shahzia Sikander; used for entity facts only. It records her birth in 1969 in Lahore, her training in Indo-Persian miniature painting at the National College of Arts, her 1995 MFA from the Rhode Island School of Design, The Scroll and SpiNN, and her life and work in New York City."
