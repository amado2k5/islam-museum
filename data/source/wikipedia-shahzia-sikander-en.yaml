summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شهزية سكندر؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها سنة 1969 في لاهور، ودراستها فنّ المنمنمات الإندو-فارسية في الكلية الوطنية للفنون ودرجة الماجستير من رود آيلاند سنة 1995، وعملها «المخطوطة» و«سبين»، وإقامتها في نيويورك."
  en: "English Wikipedia article on Shahzia Sikander; used for entity facts only. It records her birth in 1969 in Lahore, her training in Indo-Persian miniature painting at the National College of Arts, her 1995 MFA from the Rhode Island School of Design, The Scroll and SpiNN, and her life and work in New York City."
  es: "Artículo de la Wikipedia en inglés sobre Shahzia Sikander; utilizado únicamente para datos biográficos. En él se recogen su nacimiento en 1969 en Lahore, su formación en pintura en miniatura indo-persa en el National College of Arts, su máster en Bellas Artes (MFA) en 1995 por la Rhode Island School of Design, The Scroll y SpiNN, y su vida y obra en la ciudad de Nueva York."
  fr: "Article de Wikipédia en anglais sur Shahzia Sikander; utilisé uniquement à titre informatif. Il relate sa naissance en 1969 à Lahore, sa formation en peinture miniature indo-persane au National College of Arts, son MFA obtenu en 1995 à la Rhode Island School of Design, The Scroll et SpiNN, ainsi que sa vie et son travail à New York."
  ur: "شاہزیہ سکندر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1969 میں لاہور میں اس کی پیدائش، نیشنل کالج آف آرٹس میں انڈو-فارسی منی ایچر پینٹنگ میں اس کی تربیت، رہوڈ آئی لینڈ اسکول آف ڈیزائن، دی اسکرول اور اسپی این این سے اس کی 1995 ایم ایف اے، اور نیویارک شہر میں اس کی زندگی اور کام کا ریکارڈ ہے۔"
