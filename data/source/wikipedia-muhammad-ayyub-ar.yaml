summary:
  ar: "مقالة ويكيبيديا العربية عن محمد أيوب؛ تُستخدم لوقائع الكيان فقط. تذكر مقدمتها مولده سنة 1372هـ/1952 بمكة ووفاته في 9 رجب 1437هـ الموافق 16 أبريل 2016 بالمدينة، بينما يعطي صندوقها المولد «1952 أو 1953»؛ ولا تسمي مذهباً، بل تذكر أن شيخه في الفقه درّسه على المذاهب الأربعة، وتوثق شيوخه ومنصبه بالجامعة الإسلامية ودفنه بالبقيع."
  en: "Arabic Wikipedia article on Muhammad Ayyub; used for entity facts only. Its lead gives his birth in 1372 AH/1952 at Mecca and his death on 9 Rajab 1437 = 16 April 2016 at Medina, while its infobox gives the birth as '1952 or 1953'; it names no school, recording instead that his fiqh teacher taught him across the four schools, and it documents his teachers, his Madinah faculty post and his burial at al-Baqi."
  es: "Artículo de Wikipedia en árabe sobre Muhammad Ayyub; utilizado únicamente para datos biográficos. Su introducción indica que nació en 1372 AH/1952 en La Meca y falleció el 9 de Rajab de 1437 (16 de abril de 2016) en Medina, mientras que su ficha informativa indica que nació en 1952 o 1953. No menciona ninguna escuela jurídica, sino que indica que su maestro de fiqh le impartió clases en las cuatro escuelas, y documenta a sus maestros, su puesto docente en Medina y su entierro en al-Baqi."
  fr: "Article de Wikipédia en arabe sur Muhammad Ayyub; utilisé uniquement pour les informations sur l’entité. Son introduction indique sa naissance en 1372 AH/1952 à La Mecque et son décès le 9 Rajab 1437 (16 avril 2016) à Médine, tandis que son infobox précise « 1952 ou 1953 » pour la naissance. L’article ne mentionne aucune école, mais indique que son maître de fiqh l’a instruit dans les quatre écoles. Il documente également ses professeurs, son poste à la faculté de Médine et son inhumation à al-Baqi."
  ur: "محمد ایوب پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ ان کی پیدائش 1372ھ/1952 میں مکہ میں ہوا اور اس کی وفات 9 رجب 1437 = 16 اپریل 2016 کو مدینہ منورہ میں ہوئی، جب کہ اس کی معلومات خانہ '1952 یا 1953' کے طور پر جنم دیتا ہے۔ اس میں کسی اسکول کا نام نہیں ہے، بجائے اس کے کہ اس کے فقہ کے استاد نے اسے چار اسکولوں میں پڑھایا، اور اس میں اس کے اساتذہ، اس کے مدینہ فیکلٹی کے عہدے اور البقی میں اس کی تدفین کی دستاویز ہے۔"
  tr: "Muhammed Eyyub hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Girişinde 1372 Hicri / 1952'de Mekke'de doğduğu ve 9 Rajab 1437 H.'de Medine'de öldüğü belirtilir; kutusunda ise doğum tarihi \"1952 veya 1953\" olarak belirtilir; bir okulun adı verilmez ancak fıkıh öğretmeninin ona dört düşünce okulunu öğrettiğini belirtir ve öğretmenlerini, İslam Üniversitesi'ndeki konumunu ve El-Baki'deki defnini belgeler."
  id: "Artikel Wikipedia bahasa Arab tentang Muhammad Ayyub; digunakan hanya untuk fakta entitas. Pendahuluannya menyebutkan kelahirannya pada tahun 1372 H / 1952 di Mekah dan kematiannya pada 9 Rajab 1437 H, yang bertepatan dengan 16 April 2016 di Madinah, sementara kotaknya mencantumkan tanggal lahir sebagai \"1952 atau 1953\"; tidak menyebutkan sekolah tetapi menyebutkan bahwa gurunya dalam bidang hukum mengajarinya empat aliran pemikiran, dan mendokumentasikan guru-gurunya, posisinya di Universitas Islam, dan pemakamannya di Al-Baqi'."
