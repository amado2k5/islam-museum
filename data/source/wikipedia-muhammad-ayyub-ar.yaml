  ar: "مقالة ويكيبيديا العربية عن محمد أيوب؛ تُستخدم لوقائع الكيان فقط. تذكر مقدمتها مولده سنة 1372هـ/1952 بمكة ووفاته في 9 رجب 1437هـ الموافق 16 أبريل 2016 بالمدينة، بينما يعطي صندوقها المولد «1952 أو 1953»؛ ولا تسمي مذهباً، بل تذكر أن شيخه في الفقه درّسه على المذاهب الأربعة، وتوثق شيوخه ومنصبه بالجامعة الإسلامية ودفنه بالبقيع."
  en: "Arabic Wikipedia article on Muhammad Ayyub; used for entity facts only. Its lead gives his birth in 1372 AH/1952 at Mecca and his death on 9 Rajab 1437 = 16 April 2016 at Medina, while its infobox gives the birth as '1952 or 1953'; it names no school, recording instead that his fiqh teacher taught him across the four schools, and it documents his teachers, his Madinah faculty post and his burial at al-Baqi."
