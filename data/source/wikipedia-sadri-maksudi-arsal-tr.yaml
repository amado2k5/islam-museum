summary:
  ar: "مقالة ويكيبيديا التركية عن صدري مقصودي أرسال؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في قرية طاشسو في 23 يوليو 1878، وهو التاريخ المضبوط باليوم الذي تفتقر إليه المقالة الإنجليزية، وتسمي أباه إمام القرية نظام الدين ملا، وتتتبع مسيرته عبر معهد المعلمين في قازان وإسطنبول والسوربون والدوما ودولة إيديل أورال والمنفى في فنلندا وباريس وبرلين ومسيرته الأكاديمية والبرلمانية في تركيا حتى وفاته في إسطنبول في 20 فبراير 1957. ولا تسمي له مدرسة إسلامية."
  en: "Turkish Wikipedia article on Sadri Maksudi Arsal; used for entity facts only. It gives his birth at Taşsu village on 23 July 1878 — the day-precision date the English article lacks — names his father as the village imam Nizamettin Molla, and follows his career through the Kazan Teachers' Institute, Istanbul, the Sorbonne, the Duma, the Idel-Ural State, exile in Finland, Paris and Berlin, and his Turkish academic and parliamentary career to his death at Istanbul on 20 February 1957. It names no school of Islam for him."
  es: "Artículo de la Wikipedia en turco sobre Sadri Maksudi Arsal; utilizado únicamente para datos sobre la persona. Indica que nació en la aldea de Taşsu el 23 de julio de 1878 —fecha exacta que no aparece en el artículo en inglés—, nombra a su padre como el imán de la aldea, Nizamettin Molla, y describe su trayectoria profesional a través del Instituto de Formación de Profesores de Kazán, Estambul, la Sorbona, la Duma, el Estado de Idel-Ural, su exilio en Finlandia, París y Berlín, y su carrera académica y parlamentaria en Turquía hasta su fallecimiento en Estambul el 20 de febrero de 1957. No menciona ninguna escuela del islam a la que perteneciera."
  fr: "L'article de Wikipédia en turc consacré à Sadri Maksudi Arsal, utilisé uniquement pour les informations le concernant, indique sa naissance au village de Taşsu le 23 juillet 1878 (date précise absente de l'article anglais), mentionne que son père était l'imam du village, Nizamettin Molla, et retrace son parcours: Institut des enseignants de Kazan, Istanbul, Sorbonne, Douma, État d'Idel-Oural, exil en Finlande, Paris et Berlin, carrière universitaire et parlementaire turque, jusqu'à sa mort à Istanbul le 20 février 1957. Aucune école islamique n'est mentionnée."
  ur: "صدری مقصودی ارسل پر ترکی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے 23 جولائی 1878 کو تاسو گاؤں میں اس کی پیدائش کی - جس دن کی درست تاریخ انگریزی مضمون میں نہیں ہے - اپنے والد کا نام گاؤں کے امام نظام الدین مولا کے طور پر رکھتا ہے، اور قازان ٹیچرز انسٹی ٹیوٹ، استنبول، سوربون، ڈوما، آئیڈیل-یورال اسٹیٹ، فن لینڈ میں جلاوطنی، برک پارلیمنٹ اور پیرس میں اس کی دیکھ بھال اور نگہداشت کے لیے اپنے کیرئیر کی پیروی کرتا ہے۔ 20 فروری 1957 کو استنبول میں۔ اس نے ان کے لیے اسلام کے کسی مکتب کا نام نہیں لیا۔"
  tr: "Sadri Maqsudi Arsal hakkında Türkçe Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 23 Temmuz 1878'de Taşsu köyünde doğduğu belirtilmiştir; bu, İngilizce makalede tam olarak belirtilmemiş tarihtir. Babası köyün imamı Nizam al-Din Mulla olarak adlandırılır ve Kazan, İstanbul, Sorbonne, Duma, Tİdıl Ural devleti, Finlandiya, Paris ve Berlin'deki sürgün, ayrıca 20 Şubat 1957'de İstanbul'da vefat edene kadar Türkiye'deki akademik ve parlamenter kariyerini takip eder. İslami bir okul verilmemektedir."
  id: "Artikel Wikipedia Turki tentang Sadri Maqsudi Arsal; digunakan hanya untuk fakta entitas. Ia disebutkan lahir di desa Taşsu pada 23 Juli 1878, yang merupakan tanggal pasti yang tidak dicantumkan dalam artikel bahasa Inggris. Ayahnya disebut imam desa Nizam al-Din Mulla, dan menelusuri perjalanannya melalui institut guru di Kazan, Istanbul, Sorbonne, Duma, negara Tİdıl Ural, pengasingan di Finlandia, Paris, dan Berlin, serta karier akademik dan parlemennya di Turki hingga wafat di Istanbul pada 20 Februari 1957. Ia tidak diberikan sekolah Islam."
