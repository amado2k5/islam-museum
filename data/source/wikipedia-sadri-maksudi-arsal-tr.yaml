summary:
  ar: "مقالة ويكيبيديا التركية عن صدري مقصودي أرسال؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في قرية طاشسو في 23 يوليو 1878، وهو التاريخ المضبوط باليوم الذي تفتقر إليه المقالة الإنجليزية، وتسمي أباه إمام القرية نظام الدين ملا، وتتتبع مسيرته عبر معهد المعلمين في قازان وإسطنبول والسوربون والدوما ودولة إيديل أورال والمنفى في فنلندا وباريس وبرلين ومسيرته الأكاديمية والبرلمانية في تركيا حتى وفاته في إسطنبول في 20 فبراير 1957. ولا تسمي له مدرسة إسلامية."
  en: "Turkish Wikipedia article on Sadri Maksudi Arsal; used for entity facts only. It gives his birth at Taşsu village on 23 July 1878 — the day-precision date the English article lacks — names his father as the village imam Nizamettin Molla, and follows his career through the Kazan Teachers' Institute, Istanbul, the Sorbonne, the Duma, the Idel-Ural State, exile in Finland, Paris and Berlin, and his Turkish academic and parliamentary career to his death at Istanbul on 20 February 1957. It names no school of Islam for him."
