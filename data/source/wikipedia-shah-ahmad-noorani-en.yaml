summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شاه أحمد نوراني (1926–2003)، زعيم الحركة البريلوية في باكستان وابن محمد عبد العليم صديقي؛ تعطي مولده في صدرها بـ1 تشرين الأول 1926 وفي قسم نشأته بـ31 آذار 1926 مقترناً بـ17 رمضان 1344هـ، وتذكر رئاسته لجمعية علماء باكستان وتأسيسه للبعثة الإسلامية العالمية سنة 1972 ورئاسته التأسيسية لمجلس العمل الموحد، وتصف كتاباته بأنها متجذرة في التقليد السني الحنفي ⁦(الماتريدي)⁩ مدافعة عن المواقف البريلوية التقليدية."
  en: "The English Wikipedia article on Shah Ahmad Noorani (1926–2003), the Pakistani Barelvi leader and son of Muhammad Abdul Aleem Siddiqi; its lead gives his birth as 1 October 1926 while its early-life section gives 31 March 1926 paired with 17 Ramadan 1344 AH, it records his presidency of Jamiat Ulema-e-Pakistan, his co-founding of the World Islamic Mission in 1972 and his founding presidency of the Muttahida Majlis-e-Amal, and it describes his writings as rooted in the Sunni-Hanafi (Maturidi) tradition, defending traditional Barelvi positions."
  es: "El artículo de la Wikipedia en inglés sobre Shah Ahmad Noorani (1926-2003), el líder barelvi pakistaní e hijo de Muhammad Abdul Aleem Siddiqi, indica en su introducción que nació el 1 de octubre de 1926, mientras que en la sección sobre su juventud menciona el 31 de marzo de 1926 junto con el 17 de Ramadán de 1344 AH. También registra su presidencia de Jamiat Ulema-e-Pakistan, su cofundación de la Misión Islámica Mundial en 1972 y su presidencia fundadora del Muttahida Majlis-e-Amal. Además, describe sus escritos como arraigados en la tradición sunita-hanafi (maturidi), defendiendo las posiciones tradicionales barelvi."
  fr: "L'article de Wikipédia en anglais sur Shah Ahmad Noorani (1926-2003), le leader barelvi pakistanais et fils de Muhammad Abdul Aleem Siddiqi; son introduction indique sa naissance au 1er octobre 1926 tandis que sa section sur sa jeunesse donne le 31 mars 1926 associé au 17 Ramadan 1344 AH, il relate sa présidence de Jamiat Ulema-e-Pakistan, sa co-fondation de la Mission islamique mondiale en 1972 et sa présidence fondatrice du Muttahida Majlis-e-Amal, et décrit ses écrits comme étant enracinés dans la tradition sunnite-hanafite (maturidite), défendant les positions barelvi traditionnelles."
  ur: "پاکستانی بریلوی رہنما اور محمد عبدالعلیم صدیقی کے بیٹے شاہ احمد نورانی (1926-2003) پر انگریزی ویکیپیڈیا کا مضمون؛ اس کی قیادت نے ان کی پیدائش 1 اکتوبر 1926 کو دی ہے جبکہ اس کا ابتدائی زندگی کا حصہ 31 مارچ 1926 کو 17 رمضان 1344 ہجری کے ساتھ جوڑتا ہے، اس میں جمعیت علمائے پاکستان کی ان کی صدارت، 1972 میں ورلڈ اسلامک مشن کی ان کی شریک بانی اور اس کی بانی صدارت اور مجلس مجلس کے بانی ہونے کا ریکارڈ درج ہے۔ روایتی بریلوی عہدوں کا دفاع کرتے ہوئے سنی حنفی ⁦(مطوریدی)⁩ روایت سے جڑی تحریریں۔"
  tr: "Pakistan'daki Barelvi hareketinin lideri ve Muhammed Abdul Aleem Siddiqui'nin oğlu Şah Ahmed Noorani (1926–2003) hakkında İngilizce Wikipedia makalesi, doğumunun 1 Ekim 1926 ve kuruluş tarihinin 31 Mart 1926 olarak belirtildiğini, ayrıca 17 Ramazan 1344 Hile birlikte belirtilmiştir. Makalede, Pakistan Alimler Derneği başkanlığı, 1972'de Dünya İslami Misyonu'nu kurması ve Birleşik Çalışma Konseyi'nin kurucu başkanlığı yer alır. Yazılarını Hanefi Sünni geleneğine (Maturidi) dayanan ve geleneksel Barelvi görüşlerini savunan olarak tanımlar."
  id: "Artikel Wikipedia berbahasa Inggris tentang Shah Ahmad Noorani (1926–2003), pemimpin gerakan Barelvi di Pakistan dan putra Muhammad Abdul Aleem Siddiqui, menyebutkan kelahirannya pada 1 Oktober 1926, dan tanggal pendiriannya pada 31 Maret 1926, disertai dengan 17 Ramadan 1344 H. Artikel tersebut menyebutkan kepresidenannya di Pakistan Scholars Association, mendirikan World Islamic Mission pada tahun 1972, dan masa kepemimpinannya sebagai ketua United Working Council. Artikel ini menggambarkan tulisannya sebagai berakar pada tradisi Sunni Hanafi (Maturidi), membela posisi Barelvi tradisional."
