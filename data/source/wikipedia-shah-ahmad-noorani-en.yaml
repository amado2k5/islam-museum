summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شاه أحمد نوراني (1926–2003)، زعيم الحركة البريلوية في باكستان وابن محمد عبد العليم صديقي؛ تعطي مولده في صدرها بـ1 تشرين الأول 1926 وفي قسم نشأته بـ31 آذار 1926 مقترناً بـ17 رمضان 1344هـ، وتذكر رئاسته لجمعية علماء باكستان وتأسيسه للبعثة الإسلامية العالمية سنة 1972 ورئاسته التأسيسية لمجلس العمل الموحد، وتصف كتاباته بأنها متجذرة في التقليد السني الحنفي (الماتريدي) مدافعة عن المواقف البريلوية التقليدية."
  en: "The English Wikipedia article on Shah Ahmad Noorani (1926–2003), the Pakistani Barelvi leader and son of Muhammad Abdul Aleem Siddiqi; its lead gives his birth as 1 October 1926 while its early-life section gives 31 March 1926 paired with 17 Ramadan 1344 AH, it records his presidency of Jamiat Ulema-e-Pakistan, his co-founding of the World Islamic Mission in 1972 and his founding presidency of the Muttahida Majlis-e-Amal, and it describes his writings as rooted in the Sunni-Hanafi (Maturidi) tradition, defending traditional Barelvi positions."
