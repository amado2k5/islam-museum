summary:
  ar: "طبعة «العمدة في الأحكام» لعبد الغني المقدسي ⁦(ت 600هـ)⁩ بتحقيق سمير بن أمين الزهيري، مكتبة المعارف للنشر والتوزيع لصاحبها سعد بن عبد الرحمن الراشد، الرياض، الطبعة الأولى 1419هـ، مع مقدمة فيها ترجمة المصنف ووصف النسخ الخطية."
  en: "The edition of al-Umda fi al-Ahkam by Abd al-Ghani al-Maqdisi (d. 600 AH) by Samir ibn Amin al-Zuhayri, Maktabat al-Ma'arif (owner Sa'd ibn Abd al-Rahman al-Rashid), Riyadh, 1st ed. 1419 AH, with an introduction giving the author's life and a description of the manuscripts."
  es: "La edición de al-Umda fi al-Ahkam de Abd al-Ghani al-Maqdisi (m. 600 d. H.) de Samir ibn Amin al-Zuhayri, Maktabat al-Ma'arif (propietario Sa'd ibn Abd al-Rahman al-Rashid), Riad, 1ª ed. 1419 AH, con una introducción que describe la vida del autor y una descripción de los manuscritos."
  fr: "L'édition d'al-Umda fi al-Ahkam d'Abd al-Ghani al-Maqdisi (mort en 600 AH) de Samir ibn Amin al-Zuhayri, Maktabat al-Ma'arif (propriétaire Sa'd ibn Abd al-Rahman al-Rashid), Riyad, 1ère éd. 1419 AH, avec une introduction donnant la vie de l'auteur et une description des manuscrits."
