  ar: "الصفحة «Nasri Khattar Collection finding aid (PDF)» في American University of Beirut Libraries؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: الحروف الطباعية والطباعة العربية وكتلة يونيكود العربية."
  en: "The page \"Nasri Khattar Collection finding aid (PDF)\" (American University of Beirut Libraries), named in a research file supplied to the museum on 21 November 2026; the museum did not open the page, and the founder approved using the file without re-verification. Used for: Arabic typography and the Unicode Arabic block."
  ur: "صفحہ «Nasri Khattar Collection finding aid (PDF)» (American University of Beirut Libraries)؛ یہ عجائب گھر کو 21 نومبر 2026ء کو دی گئی تحقیقی فائل میں مذکور ہے، عجائب گھر نے صفحہ نہیں کھولا اور بانی نے دوبارہ تصدیق کے بغیر فائل کے استعمال کی منظوری دی۔ استعمال: عربی ٹائپوگرافی اور یونی کوڈ کا عربی بلاک۔"
