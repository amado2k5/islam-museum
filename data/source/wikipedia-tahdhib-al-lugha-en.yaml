summary:
  ar: "صفحة «Abu Mansur al-Azhari» في ويكيبيديا الإنجليزية، وهي الصفحة الموثِّقة التي سماها ملخص بحثي قُدّم إلى المتحف للكتاب «تهذيب اللغة»؛ لم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص دون إعادة تحقق في 21 نوفمبر 2026، في موضوع: نسبة الكتاب إلى مؤلفه وتاريخه."
  en: "The page \"Abu Mansur al-Azhari\" on the English Wikipedia, named by a research summary supplied to the museum as the documenting page for Tahdhib al-Lugha; the museum did not open the page, and the founder approved using the summary without re-verification on 21 November 2026, for the ascription of the work to its author and its date."
  ur: "انگریزی ویکیپیڈیا پر صفحہ «Abu Mansur al-Azhari»، جسے عجائب گھر کو دیے گئے ایک تحقیقی خلاصے نے «تہذیب اللغۃ» کا مستند صفحہ بتایا؛ عجائب گھر نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصے کے استعمال کی منظوری دی، موضوع: کتاب کی مصنف سے نسبت اور اس کی تاریخ۔"
  fr: "La page « Abu Mansur al-Azhari » de Wikipédia (anglaise), nommée par un résumé de recherche remis au musée comme page documentaire de Tahdhib al-Lugha ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé sans nouvelle vérification le 21 novembre 2026, pour l'attribution de l'ouvrage à son auteur et sa date."
  es: "La página «Abu Mansur al-Azhari» de Wikipedia (en inglés), nombrada por un resumen de investigación entregado al museo como página documental de Tahdhib al-Lugha; el museo no abrió la página, y el fundador aprobó usar el resumen sin nueva verificación el 21 de noviembre de 2026, para la atribución de la obra a su autor y su fecha."
  tr: "İngilizce Vikipedi'deki \"Abu Mansur al-Azhari\" sayfası, kendisinin \"Tahdhib al-Lugha\" kitabı için müzeye sunulan araştırma özeti olarak adlandırılan belgelenmiş sayfa; müze sayfayı açmadı ve kurucu, 21 Kasım 2026'da özetin yeniden doğrulama yapılmadan kullanılmasına izin verdi: kitabın yazarına ve tarihine atfedilmesi."
  id: "Halaman \"Abu Mansur al-Azhari\" dalam Wikipedia bahasa Inggris, yang merupakan halaman terdokumentasi yang ia sebut ringkasan penelitian yang diajukan ke museum untuk buku \"Tahdhib al-Lugha\"; museum tidak membuka halaman tersebut, dan pendiri mengizinkan penggunaan ringkasan tanpa verifikasi ulang pada 21 November 2026, dengan topik: atribusi buku kepada penulisnya dan sejarahnya."
