summary:
  ar: "مقالة ويكيبيديا العربية عن شيخة حسينة واجد؛ تُستخدم لوقائع الكيان فقط. تتفق مع المقالة الإنجليزية في مولدها في 28 سبتمبر 1947 وفي ولدها وأبويها ومناصبها، ويعطي صندوق معلوماتها ديانتَها «الإسلام» بصيغة عامة دون تسمية مذهب أو مدرسة."
  en: "Arabic Wikipedia article on Sheikh Hasina Wazed; used for entity facts only. It agrees with the English article on her birth on 28 September 1947, her children, parents and offices, and its infobox gives her religion generically as Islam, naming no school or tradition."
  es: "Artículo de Wikipedia en árabe sobre la jequesa Hasina Wazed; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento el 28 de septiembre de 1947, sus hijos, padres y cargos, y su ficha informativa la identifica genéricamente como islam, sin mencionar ninguna escuela o tradición."
  fr: "Article Wikipédia en arabe sur la cheikha Hasina Wazed; utilisé uniquement pour les informations la concernant. Il concorde avec l’article en anglais concernant sa naissance le 28 septembre 1947, ses enfants, ses parents et ses fonctions, et son infobox indique sa religion comme étant l’islam, sans préciser d’école ni de tradition."
  ur: "شیخ حسینہ وازید پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 28 ستمبر 1947 کو اس کی پیدائش، اس کے بچوں، والدین اور دفاتر سے متعلق انگریزی مضمون سے متفق ہے، اور اس کا معلوماتی باکس اس کا مذہب عام طور پر اسلام کے طور پر دیتا ہے، کسی اسکول یا روایت کا نام نہیں دیتا۔"
  tr: "Şeyha Hasina Wajid hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 28 Eylül 1947'deki doğumu, oğlu, ebeveynleri ve pozisyonlarıyla ilgili İngilizce makaleye katılıyor ve bilgi kutusu dinine genel bir biçimde \"İslam\" veriyor, herhangi bir mezhep veya okul adı vermeden."
  id: "Artikel Wikipedia berbahasa Arab tentang Sheikha Hasina Wajid; digunakan hanya untuk fakta entitas. Dia setuju dengan artikel bahasa Inggris tentang kelahirannya pada 28 September 1947, serta putranya, orang tua, dan posisinya, dan infobox-nya memberikan agamanya \"Islam\" dalam bentuk umum tanpa menyebutkan sekte atau sekolah."
