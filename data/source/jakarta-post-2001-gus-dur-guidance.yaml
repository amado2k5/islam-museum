reliability_note: "Contemporary news reportage, read in full on 31 October 2026 as republished on jawawa.id, the Jakarta Post's archive. Independent of the biographical literature: it reports the practice as observed during his presidency — the eve-of-censure visit to his mother's and grandfather's tomb at Denanyar, the 1999 visit to Sukarno's grave, the habit of seeking out ancient graves on official trips — and quotes his daughter Yeni Wahid's recollection of him weeping at a famous scholar's grave. It does not itself use the word 'Sufi'; the practice it documents, pilgrimage to saints' tombs for spiritual guidance, is the classic Sufi devotional practice of his tradition, and the record's faith note states exactly what weight this source is given."
