summary:
  ar: "تقرير صحيفة جاكرتا بوست في 29 أبريل 2001 عن زيارات الرئيس عبد الرحمن وحيد للقبور؛ يُستشهد به لحياته التعبّدية الشخصية فقط. يصف زياراته لقبور الأولياء والشيوخ طلبا للهداية الروحية بأنها «طقسه المعتاد» وعادة واظب عليها طوال تنقّلاته رئيسا للبلاد."
  en: "The Jakarta Post's report of 29 April 2001 on President Abdurrahman Wahid's grave pilgrimages; cited only for his personal devotional practice. It describes his visits to the tombs of saints and elders, made to seek spiritual guidance, as his 'customary rite' and a habit he kept up throughout his travels as president."
  es: "El informe del Jakarta Post del 29 de abril de 2001 sobre las peregrinaciones a tumbas del presidente Abdurrahman Wahid, citado únicamente por su práctica devocional personal, describe sus visitas a las tumbas de santos y ancianos, realizadas en busca de guía espiritual, como un rito habitual que mantuvo durante sus viajes como presidente."
  fr: "L'article du Jakarta Post du 29 avril 2001 concernant les pèlerinages du président Abdurrahman Wahid sur les tombes, cité uniquement à titre de dévotion personnelle, décrit ses visites aux sépultures de saints et d'anciens, entreprises pour y chercher un réconfort spirituel, comme un « rite coutumier » et une habitude qu'il a conservée tout au long de ses voyages en tant que président."
