  ar: "تقرير صحيفة جاكرتا بوست في 29 أبريل 2001 عن زيارات الرئيس عبد الرحمن وحيد للقبور؛ يُستشهد به لحياته التعبّدية الشخصية فقط. يصف زياراته لقبور الأولياء والشيوخ طلبا للهداية الروحية بأنها «طقسه المعتاد» وعادة واظب عليها طوال تنقّلاته رئيسا للبلاد."
  en: "The Jakarta Post's report of 29 April 2001 on President Abdurrahman Wahid's grave pilgrimages; cited only for his personal devotional practice. It describes his visits to the tombs of saints and elders, made to seek spiritual guidance, as his 'customary rite' and a habit he kept up throughout his travels as president."
