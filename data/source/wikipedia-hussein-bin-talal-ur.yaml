summary:
  ar: "مقالة ويكيبيديا الأردية عن الحسين بن طلال، وهي مختصرة جدًا؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته سنة 1935 وحكمه للأردن ووفاته سنة 1999، ويقرأ حقل الدين في صندوق معلوماتها «اسلام» فقط، دون مذهب."
  en: "Urdu Wikipedia article on Hussein bin Talal, a very short stub; used for entity facts only. It gives his birth in 1935, his reign over Jordan and his death in 1999. Its infobox religion field reads 'Islam' only, with no school named."
  es: "Artículo de Wikipedia en urdu sobre Hussein bin Talal, muy breve; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1935, su reinado en Jordania y su muerte en 1999. El campo de religión en su ficha informativa solo dice «Islam», sin mencionar ninguna escuela."
  fr: "Article Wikipédia en ourdou sur Hussein bin Talal, une ébauche très courte; utilisée uniquement pour les informations sur l'entité. On y trouve sa naissance en 1935, son règne sur la Jordanie et sa mort en 1999. Le champ « religion » de l'infobox indique seulement « Islam », sans mention d'école."
  ur: "حسین بن طلال پر اردو ویکیپیڈیا کا مضمون، ایک بہت ہی مختصر سٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1935 میں اس کی پیدائش، اردن پر اس کی حکومت اور 1999 میں اس کی موت ہے۔ اس کے معلوماتی خانے میں صرف 'اسلام' پڑھا جاتا ہے، جس کا نام کوئی اسکول نہیں ہے۔"
  tr: "Al-Hussein bin Talal hakkında Urduca Wikipedia makalesi, çok kısa olup sadece varlığın gerçekleri için kullanılıyor. 1935'teki doğumundan, Ürdün yönetiminden ve 1999'daki ölümünden bahsediyor ve bilgi kutusunda din alanını sadece \"İslam\" olarak okuyordu, herhangi bir mezhepsel aidiyet olmadan."
  id: "Artikel Wikipedia Urdu tentang Al-Hussein bin Talal, yang sangat singkat, hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada tahun 1935, pemerintahannya di Yordania, dan kematiannya pada tahun 1999, serta menuliskan bidang agama di infobox hanya sebagai \"Islam\", tanpa afiliasi sektarian apa pun."
