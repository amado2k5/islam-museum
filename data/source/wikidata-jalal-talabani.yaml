  en: "Wikidata item Q57306 for Jalal Talabani, grounded through the English article's pageprops; used for entity facts only. It gives his birth on 12 November 1933, his death on 3 October 2017 at Berlin, and a religion value of Islam in general only."
  es: "El elemento de Wikidata Q57306 sobre Jalal Talabani, basado en las propiedades de la página del artículo en inglés, se utiliza únicamente para obtener información sobre la entidad. Indica que nació el 12 de noviembre de 1933, falleció el 3 de octubre de 2017 en Berlín y profesaba el islam en general."
  fr: "L'élément Wikidata Q57306 concernant Jalal Talabani, basé sur les propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Il indique sa date de naissance: le 12 novembre 1933; sa date de décès: le 3 octobre 2017 à Berlin; et son appartenance religieuse: l'islam."
  ur: "جلال طالبانی کے لیے ویکی ڈیٹا آئٹم Q57306، انگریزی آرٹیکل کے پیج پروپس کے ذریعے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 12 نومبر 1933 کو ان کی پیدائش، 3 اکتوبر 2017 کو برلن میں ان کی موت، اور عام طور پر صرف اسلام کی ایک مذہبی قدر بتاتی ہے۔"
  tr: "Wikidata öğesi Q57306 Jalal Talabani tarafından, İngilizce makale sayfası properties üzerinden düzeltildi; sadece varlık bilgileri için kullanıldı. 12 Kasım 1933'te doğdu ve 3 Ekim 2017'de Berlin'de vefat etti; bir dinin değeri genel olarak İslam'dır."
  id: "Item Wikidata Q57306 oleh Jalal Talabani, diperbaiki melalui properti halaman artikel Inggris; digunakan hanya untuk fakta entitas. Ia lahir pada 12 November 1933, dan meninggal pada 3 Oktober 2017 di Berlin, dan nilai sebuah agama adalah Islam secara umum."
