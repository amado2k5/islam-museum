summary:
  ar: "مقالة ويكيبيديا العربية عن وقار يونس؛ تُستخدم لوقائع الكيان الأساسية فقط. تذكر مولده في 16 نوفمبر 1971 في وهري وكونه لاعب كريكت باكستانيا سابقا قاد منتخب باكستان ودرّبه لاحقا، وتذكر في صندوق معلوماتها ديانته بلفظ أهل السنة والجماعة."
  en: "Arabic Wikipedia article on Waqar Younis; used for basic entity facts only. It gives his birth on 16 November 1971 in Vehari and his standing as a former Pakistani cricketer who captained and later coached Pakistan. Its infobox gives his religion as Ahl al-Sunna wal-Jama'a (Sunni) — a single infobox attestation, recorded in the person record's faith note and not taken as a documented school."
  es: "Artículo de Wikipedia en árabe sobre Waqar Younis; se utiliza únicamente para obtener información básica sobre la persona. Indica que nació el 16 de noviembre de 1971 en Vehari y que fue jugador de críquet pakistaní, capitán y posteriormente entrenador de la selección de Pakistán. Su ficha informativa señala que profesa la religión Ahl al-Sunna wal-Jama'a (sunita), una única mención en la ficha informativa, registrada en la nota sobre la fe de la persona y no considerada como una escuela documentada."
  fr: "Article Wikipédia en arabe sur Waqar Younis; utilisé uniquement pour les informations de base le concernant. Il indique sa date de naissance, le 16 novembre 1971, à Vehari, et son statut d’ancien joueur de cricket pakistanais, capitaine puis entraîneur de l’équipe nationale du Pakistan. Son infobox mentionne sa religion comme étant Ahl al-Sunna wal-Jama'a (sunnite) — une simple attestation, consignée dans la note relative à la religion de sa fiche, et non considérée comme une appartenance à une école de pensée officielle."
