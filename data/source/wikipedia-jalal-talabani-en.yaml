  ar: "مقالة ويكيبيديا الإنجليزية عن جلال طالباني، رئيس العراق 2005–2014؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته سنة 1933 في كلكان ووفاته في 3 أكتوبر 2017 في برلين، وتسمّي فؤاد معصوم خلفًا له في الرئاسة، وتتعمد إعطاء سنة الولادة وحدها محذّرة من أن تاريخ 12 نوفمبر المتداول وهمي."
  en: "English Wikipedia article on Jalal Talabani, president of Iraq 2005–2014; used for entity facts only. It gives his birth in 1933 at Kelkan and his death on 3 October 2017 at Berlin, names Fuad Masum as his successor as president, and deliberately gives his birth at year precision only, with an editorial warning that the circulating 12 November date is fictitious."
