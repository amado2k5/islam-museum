summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جلال طالباني، رئيس العراق 2005–2014؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته سنة 1933 في كلكان ووفاته في 3 أكتوبر 2017 في برلين، وتسمّي فؤاد معصوم خلفًا له في الرئاسة، وتتعمد إعطاء سنة الولادة وحدها محذّرة من أن تاريخ 12 نوفمبر المتداول وهمي."
  en: "English Wikipedia article on Jalal Talabani, president of Iraq 2005–2014; used for entity facts only. It gives his birth in 1933 at Kelkan and his death on 3 October 2017 at Berlin, names Fuad Masum as his successor as president, and deliberately gives his birth at year precision only, with an editorial warning that the circulating 12 November date is fictitious."
  es: "Artículo de la Wikipedia en inglés sobre Jalal Talabani, presidente de Irak entre 2005 y 2014; utilizado únicamente para datos sobre la persona. Indica que nació en 1933 en Kelkan y falleció el 3 de octubre de 2017 en Berlín, nombra a Fuad Masum como su sucesor en la presidencia y, deliberadamente, solo proporciona el año de su nacimiento, con una advertencia editorial de que la fecha del 12 de noviembre que circula es ficticia."
  fr: "Article de Wikipédia en anglais sur Jalal Talabani, président de l'Irak de 2005 à 2014; utilisé uniquement à des fins d'information. Il indique sa naissance en 1933 à Kelkan et son décès le 3 octobre 2017 à Berlin, nomme Fuad Masum comme son successeur à la présidence et précise délibérément l'année de naissance uniquement, avec un avertissement éditorial indiquant que la date du 12 novembre, souvent citée, est fictive."
  ur: "جلال طالبانی پر انگریزی ویکیپیڈیا مضمون، عراق کے صدر 2005-2014؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1933 میں کیلکن میں ان کی پیدائش اور 3 اکتوبر 2017 کو برلن میں ان کی موت، فواد معصوم کو صدر کے طور پر اپنے جانشین کے طور پر نامزد کرتا ہے، اور جان بوجھ کر صرف سال کی درستگی پر اس کی پیدائش دیتا ہے، ایک ادارتی انتباہ کے ساتھ کہ گردش کرنے والی 12 نومبر کی تاریخ فرضی ہے۔"
