  fr: "Les biographies des auteurs imprimées dans The Islamic Will (Dar Al Taqwa, 1995): l'acceptation de l'islam par Abdalhaqq Bewley en 1968, ses études au Maroc et son travail avec Abdalqadir as-Sufi, et la biographie d'Aisha Bewley (née en 1948) avec leurs traductions communes."
