  en: "The author biographies printed in The Islamic Will (Dar Al Taqwa, 1995): Abdalhaqq Bewley's acceptance of Islam in 1968, his study in Morocco and his work with Abdalqadir as-Sufi, and the biography of Aisha Bewley (b. 1948) with their joint translations."
