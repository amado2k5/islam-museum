reliability_note: "The book's printed author biographies, read in full in this session in the publisher's standard form as reproduced by its booksellers. The Abdalhaqq biography states that he accepted Islam in 1968, spent several years in Morocco studying Islam, has worked with Shaykh Dr Abdalqadir as-Sufi establishing Muslim communities in Nigeria, the United States, Czechoslovakia, Germany, Spain, the Caribbean and the United Kingdom, and that 'in collaboration with his wife, the renowned Arabic translator Aisha Bewley' he produced The Noble Qur'an, Al-Muwatta of Imam Malik and Muhammad: The Messenger of Allah (ash-Shifa). The Aisha biography, printed alongside, styles The Noble Qur'an 'a translation of the meanings of the Qur'an produced with her husband, Abdalhaqq Bewley', gives her birth year as 1948, her Berkeley BA in French and MA in Near Eastern languages, her study at the American University in Cairo and her embrace of Islam in 1968. The biographies name no legal school or Sufi order for either of them."
