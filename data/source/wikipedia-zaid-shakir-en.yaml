summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن العالم الأمريكي زيد شاكر: وُلد باسم ريكي داريل ميتشل في بيركلي بكاليفورنيا في 24 مايو 1956، واعتنق الإسلام سنة 1977، ودرس في الجامعة الأمريكية وروتجرز ثم سبع سنوات في سوريا وتخرج في جامعة أبو النور سنة 2001، وهو من مؤسسي كلية الزيتونة. ويذكر صندوق معلومات المقالة مذهبه سنيا وفقهه شافعيا، ولكل منهما مصدر أكاديمي محال إليه."
  en: "The English Wikipedia article on the American scholar Zaid Shakir: born Ricky Daryl Mitchell in Berkeley, California, on 24 May 1956; converted to Islam in 1977; studied at American University and Rutgers, then for seven years in Syria, graduating from Abu Nour University in 2001; co-founder of Zaytuna College. Its infobox gives his denomination as Sunni and jurisprudence as Shafi'i, each with a cited academic source."
