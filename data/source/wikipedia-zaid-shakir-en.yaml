summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن العالم الأمريكي زيد شاكر: وُلد باسم ريكي داريل ميتشل في بيركلي بكاليفورنيا في 24 مايو 1956، واعتنق الإسلام سنة 1977، ودرس في الجامعة الأمريكية وروتجرز ثم سبع سنوات في سوريا وتخرج في جامعة أبو النور سنة 2001، وهو من مؤسسي كلية الزيتونة. ويذكر صندوق معلومات المقالة مذهبه سنيا وفقهه شافعيا، ولكل منهما مصدر أكاديمي محال إليه."
  en: "The English Wikipedia article on the American scholar Zaid Shakir: born Ricky Daryl Mitchell in Berkeley, California, on 24 May 1956; converted to Islam in 1977; studied at American University and Rutgers, then for seven years in Syria, graduating from Abu Nour University in 2001; co-founder of Zaytuna College. Its infobox gives his denomination as Sunni and jurisprudence as Shafi'i, each with a cited academic source."
  es: "El artículo de Wikipedia en inglés sobre el erudito estadounidense Zaid Shakir: nacido como Ricky Daryl Mitchell en Berkeley, California, el 24 de mayo de 1956; convertido al islam en 1977; estudió en la American University y en Rutgers, luego pasó siete años en Siria, graduándose en la Universidad de Abu Nour en 2001; cofundador del Zaytuna College. Su ficha informativa indica que profesa el sunismo y sigue la escuela jurídica shafi'í, citando en cada caso una fuente académica."
  fr: "L'article de Wikipédia en anglais consacré à l'universitaire américain Zaid Shakir: né Ricky Daryl Mitchell à Berkeley, en Californie, le 24 mai 1956; converti à l'islam en 1977; a étudié à l'American University et à Rutgers, puis pendant sept ans en Syrie, et a obtenu son diplôme de l'université Abu Nour en 2001; cofondateur du Zaytuna College. Son infobox indique qu'il est sunnite et de courant juridique chaféite, chaque information étant étayée par une source académique citée."
  ur: "امریکی اسکالر زید شاکر پر انگریزی ویکیپیڈیا کا مضمون: 24 مئی 1956 کو برکلے، کیلیفورنیا میں پیدا ہوئے رکی ڈیرل مچل؛ 1977 میں اسلام قبول کیا۔ امریکن یونیورسٹی اور رٹگرز میں تعلیم حاصل کی، پھر شام میں سات سال تک، 2001 میں ابو نور یونیورسٹی سے گریجویشن کیا۔ زیتونا کالج کے شریک بانی۔ اس کا معلوماتی خانہ اس کا فرقہ بطور سنی اور فقہ کو شافعی کے طور پر دیتا ہے، ہر ایک کا حوالہ دیا گیا علمی ماخذ ہے۔"
  tr: "Amerikalı bilim insanı Zaid Shaker hakkında İngilizce Wikipedia makalesi: 24 Mayıs 1956'da Berkeley, California'da Ricky Darrell Mitchell olarak doğdu, 1977'de İslam'a geçti, Rutgers Üniversitesi'nde eğitim gördü, ardından Suriye'de yedi yıl geçirdi ve 2001'de Abu Al-Noor Üniversitesi'nden mezun oldu. Al-Zaytouna Koleji'nin kurucularından biridir. Makalenin bilgi kutusunda Sünni düşünce okulu ve Şafii fıkhihi yer almakta olup, her biri akademik kaynak olarak belirtilmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang ilmuwan Amerika Zaid Shaker: Lahir dengan nama Ricky Darrell Mitchell di Berkeley, California, pada 24 Mei 1956, ia memeluk Islam pada tahun 1977, belajar di Universitas Rutgers, kemudian menghabiskan tujuh tahun di Suriah, dan lulus dari Universitas Abu Al-Noor pada tahun 2001. Ia adalah salah satu pendiri Al-Zaytouna College. Kotak informasi artikel tersebut menyebutkan aliran pemikiran Sunni dan yurisprudensi Syafi'i, masing-masing dengan sumber akademik yang dikutip."
