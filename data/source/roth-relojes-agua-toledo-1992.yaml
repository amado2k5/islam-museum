reliability_note: "Two-page scholarly note actually read in full via the journal's landing page and its open PDF text (meahhebreo.com mirror snippet). Establishes the transmission chain: Muhammad b. Abu Bakr al-Zuhri of Granada (d. 1137) mentions in a commentary on a geographical work the water clocks (bila) built by al-Zarqalla in Toledo; al-Maqqari's account depends obviously on al-Zuhri. Roth records that al-Zuhri names the Jewish astronomer Hamis b. Zabara as destroyer, while al-Maqqari's dependent version gives Hunayn — a possible textual corruption; that in 527 AH the Jewish astronomer is said to have drawn all Andalusia's pigeons to Toledo in one day and predicted a Christian conquest of Cordoba (conquered by Alfonso VII in 1146); that a purported Moses Ibn Ezra poem 'Mármol, obra de Zarqal' on the clocks is a fabrication of the unreliable 19th-century writer Carmoly; and that the Ibn Zabara Jewish family is documented in 12th-century Toledo. Kept distinct from the museum's bounded record: the clocks' existence and mechanism remain unverified."
