  ar: "ملاحظة بحثية من صفحتين ⁦(MEAHHEBREO 41، 1992، ص 151–152)⁩ قرأها نورمان روث كاملة؛ تثبت سلسلة النقل من الجغرافي الأندلسي ابن الزهري ⁦(ت 1137)⁩ الذي يذكر ساعات ماء في طليطلة ينسبها إلى الزرقال، وتفصل بين رواية ابن الزهري ومقري في اسم المنجم اليهودي الذي هدم الحوض، وتكشف أن قصيدة ابن عزرئ على «ساعات الزرقال» اختلاق حديث."
  en: "Two-page scholarly note (MEAHHEBREO 41, 1992, pp. 151-152) read in full; establishes the transmission chain from the Andalusian geographer al-Zuhri (d. 1137) who mentions Toledo water clocks attributed to al-Zarqalla, separates al-Zuhri's account from al-Maqqari's on the Jewish astronomer's name, and exposes a spurious Ibn Ezra poem on the clocks."
  ur: "نورمان roth کی دوصفحہ دار علمی یادداشت ⁦(MEAHHEBREO 41، 1992، ص 151–152)⁩ جو مکمل پڑھی گئی؛ اندلسی جغرافیہ دان ابن زہری ⁦(ت 1137)⁩ سے نقل کی سند کرتی ہے، جو طلیطلہ کی آبی گھڑیاں الزرقالی سے منسوب کرتا ہے، اور المنجم یہودی کے نام میں ابن زہری اور مقری کی روایتوں کی فرق بتاتی ہے۔"
  es: "Nota académica de dos páginas (MEAHHEBREO 41, 1992, pp. 151-152), leída íntegramente; establece la cadena de transmisión desde el geógrafo andalusí al-Zuhri (m. 1137), quien menciona los relojes de agua de Toledo atribuidos a al-Zarqalla, separa el relato de al-Zuhri del de al-Maqqari sobre el nombre del astrónomo judío y expone un poema espurio de Ibn Ezra sobre los relojes."
