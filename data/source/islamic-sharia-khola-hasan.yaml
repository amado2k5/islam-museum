summary:
  ar: "الصفحة التعريفية بخولة حسن على موقع المجلس الشرعي الإسلامي بلندن، حيث تعمل مديرة مكتب ومستشارة: وُلدت في السعودية ودرست الابتدائية في كينيا وقضت معظم حياتها في لندن، وألّفت في السابعة عشرة كتابها عن إسبانيا، وشاركت في مناظرة بي بي سي راديو ٤ سنة ٢٠٠٥ وفي مناظرات الدوحة، وعملت ثماني سنوات مقدِّمة تدخلات لدى وزارة الداخلية البريطانية، وتدرس العلم الشرعي في معهد السلام."
  en: "The Islamic Shariah Council's team profile of Khola Hasan, its Office Director and Counsellor in London: born in Saudi Arabia, primary-schooled in Kenya, most of her life spent in London; she authored her Spain book at seventeen, took part in the BBC Radio 4 debate of 2005 and in the Doha Debates, worked eight years as a Home Office intervention provider, and is pursuing the Alimiyyah course at As Salam Institute."
  es: "Perfil de Khola Hasan, directora de su oficina y consejera en Londres, perteneciente al Consejo Islámico de la Sharia: nacida en Arabia Saudí, cursó la primaria en Kenia y ha vivido la mayor parte de su vida en Londres; escribió su libro sobre España a los diecisiete años, participó en el debate de BBC Radio 4 de 2005 y en los Debates de Doha, trabajó durante ocho años como proveedora de servicios de intervención del Ministerio del Interior y está cursando el programa Alimiyyah en el Instituto As Salam."
  fr: "Profil de Khola Hasan, directrice de bureau et conseillère du Conseil islamique de la charia à Londres: née en Arabie saoudite, scolarisée au Kenya, elle a passé la majeure partie de sa vie à Londres; elle a écrit son livre sur l’Espagne à dix-sept ans, a participé au débat de BBC Radio 4 en 2005 et aux débats de Doha, a travaillé pendant huit ans comme prestataire de services d’intervention pour le ministère de l’Intérieur et suit actuellement le cours d’Alimiyyah à l’Institut As Salam."
  ur: "اسلامی شریعہ کونسل کی لندن میں دفتر کی ڈائریکٹر اور کونسلر خولہ حسن کی ٹیم پروفائل: سعودی عرب میں پیدا ہوئیں، کینیا میں پرائمری تک تعلیم حاصل کی، اس کی زندگی کا بیشتر حصہ لندن میں گزرا۔ اس نے سترہ سال کی عمر میں اپنی اسپین کتاب تصنیف کی، 2005 کے بی بی سی ریڈیو 4 مباحثے میں حصہ لیا اور دوحہ ڈیبیٹس میں، ہوم آفس میں مداخلت فراہم کرنے والے کے طور پر آٹھ سال کام کیا، اور اس سلام انسٹی ٹیوٹ میں علیمیہ کورس کر رہی ہیں۔"
