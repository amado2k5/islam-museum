summary:
  ar: "الصفحة التعريفية بخولة حسن على موقع المجلس الشرعي الإسلامي بلندن، حيث تعمل مديرة مكتب ومستشارة: وُلدت في السعودية ودرست الابتدائية في كينيا وقضت معظم حياتها في لندن، وألّفت في السابعة عشرة كتابها عن إسبانيا، وشاركت في مناظرة بي بي سي راديو ٤ سنة ٢٠٠٥ وفي مناظرات الدوحة، وعملت ثماني سنوات مقدِّمة تدخلات لدى وزارة الداخلية البريطانية، وتدرس العلم الشرعي في معهد السلام."
  en: "The Islamic Shariah Council's team profile of Khola Hasan, its Office Director and Counsellor in London: born in Saudi Arabia, primary-schooled in Kenya, most of her life spent in London; she authored her Spain book at seventeen, took part in the BBC Radio 4 debate of 2005 and in the Doha Debates, worked eight years as a Home Office intervention provider, and is pursuing the Alimiyyah course at As Salam Institute."
