  ar: "مقالة ويكيبيديا الإنجليزية عن للا السعيدي؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها باسم للا آسية السعيدي في مراكش سنة 1956، ودراستها في باريس وبوسطن، وأعمالها المصوّرة عن المرأة العربية ومنها «نساء المغرب» و«أراضٍ متقاربة» وخطّها بالحناء."
  en: "English Wikipedia article on Lalla Essaydi; used for entity facts only. It records her birth as Lalla Assia Essaydi in Marrakesh in 1956, her studies in Paris and Boston, and her staged photographs of Arab women including Les Femmes du Maroc and Converging Territories and her henna calligraphy."
