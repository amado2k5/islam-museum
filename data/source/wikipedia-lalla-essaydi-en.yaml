summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن للا السعيدي؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها باسم للا آسية السعيدي في مراكش سنة 1956، ودراستها في باريس وبوسطن، وأعمالها المصوّرة عن المرأة العربية ومنها «نساء المغرب» و«أراضٍ متقاربة» وخطّها بالحناء."
  en: "English Wikipedia article on Lalla Essaydi; used for entity facts only. It records her birth as Lalla Assia Essaydi in Marrakesh in 1956, her studies in Paris and Boston, and her staged photographs of Arab women including Les Femmes du Maroc and Converging Territories and her henna calligraphy."
  es: "Artículo de la Wikipedia en inglés sobre Lalla Essaydi; se utiliza únicamente para obtener información sobre la persona. En él se registra su nacimiento como Lalla Assia Essaydi en Marrakech en 1956, sus estudios en París y Boston, sus fotografías escenificadas de mujeres árabes, entre las que se incluyen Les Femmes du Maroc y Converging Territories, y su caligrafía con henna."
  fr: "Article Wikipédia en anglais sur Lalla Essaydi; utilisé uniquement à titre informatif. Il relate sa naissance sous le nom de Lalla Assia Essaydi à Marrakech en 1956, ses études à Paris et à Boston, ses photographies mises en scène de femmes arabes, notamment Les Femmes du Maroc et Converging Territories, ainsi que son travail de calligraphie au henné."
  ur: "انگریزی ویکیپیڈیا مضمون لالہ ایسسیدی پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پیدائش 1956 میں مراکش میں لالہ آسیہ ایسیدی کے طور پر، پیرس اور بوسٹن میں اس کی تعلیم، اور اس کی لیس فیمس ڈو ماروک اور کنورجنگ ٹیریٹریز سمیت عرب خواتین کی اسٹیج کی گئی تصاویر اور اس کی مہندی کی خطاطی کو ریکارڈ کیا گیا ہے۔"
