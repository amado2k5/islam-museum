reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Its lead and infobox give Lalla Assia Essaydi, born 1956 in Marrakesh, with no month or day in any source read. In her own artist statement, quoted in the museum and university coverage of her work, she presents herself 'through multiple lenses — as artist, as Moroccan, as Saudi, as traditionalist, as liberal, as Muslim' — a self-description of identity that names no school or path, and the article names none for her; her work's engagement with Muslim women's bodies and Islamic calligraphy is subject matter, not a school attestation."
