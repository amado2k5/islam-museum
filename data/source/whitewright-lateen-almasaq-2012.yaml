label: { ar: "وايت رايت، الاستمرارية والتغير التقني في الشراع اللاتيني ⁦(2012)⁩", en: "Whitewright, Technological Continuity and Change: the Lateen Sail ⁦(2012)⁩", ur: "وائٹ رائٹ، لاتینی شراع میں تکنیکی تسلسل اور تبدیلی ⁦(2012)⁩" }
summary:
  ar: "مقالة جوليان وايت رايت في المساق: يبين أن الشراع اللاتيني متوسطي الأصل من القرن الثاني الميلادي، شاع بالخامس لأسباب كلفة بناء وصيانة لا لتفوق ملاحي على المربع، وأن التبني العربي جاء عبر البحارة الأقباط المتوارثين للتقاليد المتوسطية، ويعيد تقييم رواية الأصل الشرقي."
  en: "Julian Whitewright's Al-Masaq article: argues the lateen is Mediterranean in origin from the 2nd century AD, became common by the 5th for construction and maintenance cost reasons rather than superior sailing performance over the square rig, that Arab adoption came through Coptic seafarers inheriting the Mediterranean tradition, and re-evaluates the older belief in an eastern origin."
  es: "El artículo de Julian Whitewright en Al-Masaq argumenta que la vela latina es de origen mediterráneo desde el siglo II d.C., que se popularizó en el siglo V por razones de coste de construcción y mantenimiento, más que por su rendimiento de navegación superior al de la vela cuadrada, que la adopción árabe se produjo a través de marineros coptos que heredaron la tradición mediterránea, y reevalúa la antigua creencia en un origen oriental."
  fr: "L'article de Julian Whitewright dans Al-Masaq: soutient que le gréement latin est d'origine méditerranéenne depuis le IIe siècle après J.-C., qu'il s'est répandu au Ve siècle pour des raisons de coûts de construction et d'entretien plutôt que pour des performances de navigation supérieures à celles du gréement carré, que son adoption par les Arabes s'est faite par l'intermédiaire des marins coptes héritant de la tradition méditerranéenne, et réévalue l'ancienne croyance en une origine orientale."
  ur: "جولین وائٹ رائٹ کا الماسق مضمون: استدلال کرتا ہے کہ لیٹرین دوسری صدی عیسوی سے بحیرہ روم کا ہے، مربع رگ پر بہتر جہاز رانی کی کارکردگی کے بجائے تعمیر اور دیکھ بھال کی لاگت کی وجوہات کی بنا پر 5ویں تک عام ہو گیا، کہ عرب گود لینے والے قبطی بحری جہازوں کے ذریعے وراثت میں آئے جو بحیرہ روم یا قدیم روایت میں ہے۔"
  tr: "Julian White Wright'ın kurstaki makalesi: Akdeniz kökenli Latin yelkeninin, MS 2. yüzyıldan kalma olarak, beşinci yüzyılda meydan üzerinde deniz üstünlüğünden ziyade inşaat ve bakım maliyetleri nedeniyle popüler hale geldiğini ve Arap benimsemenin Akdeniz geleneklerini miras alan Kıpti denizciler aracılığıyla gerçekleştiğini ve Doğu köken anlatısını yeniden değerlendirdiğini gösteriyor."
  id: "Artikel Julian White Wright dalam kursus tersebut: menunjukkan bahwa layar Latin, yang berasal dari Mediterania sejak abad ke-2 M, menjadi populer pada abad kelima karena biaya konstruksi dan pemeliharaan, bukan karena keunggulan maritim atas alun-alun, dan adopsi Arab datang melalui pelaut Koptik yang mewarisi tradisi Mediterania, mengevaluasi ulang narasi asal Timur."
title: "Technological Continuity and Change: The Lateen Sail of the Medieval Mediterranean"
