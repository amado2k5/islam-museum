summary:
  ar: "مقالة جوليان وايت رايت في المساق: يبين أن الشراع اللاتيني متوسطي الأصل من القرن الثاني الميلادي، شاع بالخامس لأسباب كلفة بناء وصيانة لا لتفوق ملاحي على المربع، وأن التبني العربي جاء عبر البحارة الأقباط المتوارثين للتقاليد المتوسطية، ويعيد تقييم رواية الأصل الشرقي."
  en: "Julian Whitewright's Al-Masaq article: argues the lateen is Mediterranean in origin from the 2nd century AD, became common by the 5th for construction and maintenance cost reasons rather than superior sailing performance over the square rig, that Arab adoption came through Coptic seafarers inheriting the Mediterranean tradition, and re-evaluates the older belief in an eastern origin."
title: "Technological Continuity and Change: The Lateen Sail of the Medieval Mediterranean"
