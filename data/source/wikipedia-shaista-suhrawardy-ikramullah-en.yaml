summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شائستا سهروردي إكرام الله (1915–2000)؛ تعطي مولدها في كلكتا في 22 تموز 1915 ووفاتها في كراتشي في 11 كانون الأول 2000، وتروي عملها الدبلوماسي وكتابها الأشهر «من البرقع إلى البرلمان» وسيرتها لعمها حسين شهيد سهروردي (1991)."
  en: "The English Wikipedia article on Shaista Suhrawardy Ikramullah (1915–2000); it gives her birth at Calcutta on 22 July 1915 and her death at Karachi on 11 December 2000, and recounts her diplomatic career, her best-known book From Purdah to Parliament and her 1991 biography of her uncle Huseyn Shaheed Suhrawardy."
  es: "El artículo de la Wikipedia en inglés sobre Shaista Suhrawardy Ikramullah (1915-2000) indica que nació en Calcuta el 22 de julio de 1915 y falleció en Karachi el 11 de diciembre de 2000, y relata su carrera diplomática, su libro más conocido, From Purdah to Parliament, y la biografía que escribió en 1991 sobre su tío Huseyn Shaheed Suhrawardy."
  fr: "L'article de Wikipédia en anglais sur Shaista Suhrawardy Ikramullah (1915-2000); il indique sa naissance à Calcutta le 22 juillet 1915 et sa mort à Karachi le 11 décembre 2000, et relate sa carrière diplomatique, son livre le plus connu From Purdah to Parliament et sa biographie de son oncle Huseyn Shaheed Suhrawardy en 1991."
  ur: "انگریزی ویکیپیڈیا مضمون پر شائستہ سہروردی اکرام اللہ (1915-2000)؛ یہ 22 جولائی 1915 کو کلکتہ میں اس کی پیدائش اور 11 دسمبر 2000 کو کراچی میں اس کی موت ہوئی، اور اس کے سفارتی کیریئر، اس کی سب سے مشہور کتاب فرام پردہ سے پارلیمنٹ اور اس کے چچا حسین شہید سہروردی کی 1991 کی سوانح عمری کا ذکر کرتی ہے۔"
  tr: "Shaista Suhrawardy Ikramulla (1915–2000) hakkında İngilizce Wikipedia makalesi; 22 Temmuz 1915'te Kalküta'da doğduğunu ve 11 Aralık 2000'de Karaçi'de vefat ettiğini anlatır; diplomatik çalışmalarını, ünlü kitabı 'Burka'dan Parlamento'ya' ve amcası Hussain Shaheed Suhrawardy'nin biyografisini (1991) anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Shaista Suhrawardy Ikramulla (1915–2000); menceritakan kelahirannya di Calcutta pada 22 Juli 1915, dan kematiannya di Karachi pada 11 Desember 2000, menceritakan karya diplomatiknya dan buku terkenalnya 'From the Burqa to Parliament' dan biografi pamannya Hussain Shaheed Suhrawardy (1991)."
