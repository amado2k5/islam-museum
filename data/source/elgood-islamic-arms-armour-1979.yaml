reliability_note: "Downloaded as the Internet Archive scan (full OCR text layer) to sources/jobs-p2-harvest-6/Islamic_Arms_and_Armour_djvu.txt on 16 Nov 2026. Read: T. W. Flindt, 'Some nineteenth-century arms from Bukhara' pp. 21-25 (the Bukhara bazaars, imported Persian blades, L. A. Mayer's Islamic Armourers finding no armourer recorded at Bukhara); M. V. Gorelik, 'Oriental armour of the Near and Middle East from the eighth to the fifteenth centuries as shown in works of art' pp. 30-33 (mail dir'/zardiyya, lamellar jawshan, quilted gazakand, the Byzantine and Sasanian inheritances and the Central Asian steppe tradition); J. D. Latham & W. F. Paterson, 'Archery in the lands of Eastern Islam' pp. 78-79 (archery as religious duty, sultans apprenticed to bowyers, the composite principle of wood core, horn belly and sinew back); E. McEwen, 'The chahar kham or four-curved bow of India' pp. 90-93 (the dissected study bow: nine-piece rain-wood core spliced fish-tail, water-buffalo horn belly, tendon pay sorted, combed, weighed in dirhams and laid in up to three layers). Facts are rewritten in the museum's own words; printed page anchors the citations."
