summary:
  ar: "مجموعة دراسات حرّرها روبرت إلغود سنة 1979 في تاريخ السلاح الإسلامي: فصول عن أسلحة بخارى في القرن التاسع عشر، وعن دروع الشرقين الأدنى والأوسط من القرن الثامن إلى الخامس عشر كما تظهرها الصور، وعن الرماية في شرق العالم الإسلامي، وعن القوس الهندي المركّب «جَهار خَم» ⁦(ذو الانحناءات الأربع)⁩ بتركيبه من خشب وقرن ووتر."
  en: "Robert Elgood's 1979 edited volume on the history of Islamic arms: chapters on nineteenth-century arms from Bukhara, on the armour of the Near and Middle East from the eighth to the fifteenth centuries as shown in works of art, on archery in the lands of Eastern Islam, and on the Indian chahar kham 'four-curved' composite bow of wood, horn and sinew, with the bowyer's materials and technique described from a dissected specimen."
  ur: "رابرٹ ایلگڈ کی مرتب کردہ ۱۹۷۹ء کی کتاب جس میں اسلامی اسلحے کی تاریخ پر مقالے ہیں: انیسویں صدی کے بخارا کے ہتھیار، آٹھویں سے پندرہویں صدی تک مشرقِ وسطیٰ کی زرہیں جیسا کہ فنی شہادتیں دکھاتی ہیں، مشرقی اسلام میں تیر اندازی، اور ہندوستان کا «چہار خام» مرکب کمان جس کی لکڑی، سینگ اور پائے کی بناؤٹ کاکسی گئی مثال سے بیان ہوئی ہے۔"
  es: "El volumen editado por Robert Elgood en 1979 sobre la historia de las armas islámicas incluye capítulos sobre las armas del siglo XIX procedentes de Bujará, sobre las armaduras del Cercano y Medio Oriente desde el siglo VIII hasta el XV tal como se muestran en obras de arte, sobre el tiro con arco en las tierras del Islam oriental y sobre el chahar kham indio, un arco compuesto de cuatro curvas hecho de madera, cuerno y tendones, con la descripción de los materiales y la técnica del arquero a partir de un ejemplar disecado."
