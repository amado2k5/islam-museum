summary:
  ar: "مقالة ويكيبيديا الأردية عن عبد الباري الفرنجي محلي (1878–1926)؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في فرنجي محل بلكهنؤ في 10 ربيع الثاني 1295 هـ الموافق 12 أبريل 1878، ودخوله مريدًا في السلسلة القادرية عند شاه عبد الرزاق الهانسوي ونيله الإجازة والخلافة في جميع السلاسل، وفتواه بالجهاد ضد الإنجليز، ووفاته في 4 رجب 1344 هـ الموافق 19 يناير 1926."
  en: "Urdu Wikipedia article on Abdul Bari Firangi Mahali (1878–1926); used for entity facts only. It gives his birth at Firangi Mahal, Lucknow, on 10 Rabi' al-thani 1295 AH, paired with 12 April 1878; states in text that he entered the Qadiriyya order as a disciple of Shah Abdul Razzaq Hansvi and received authorisation and succession in all the orders; records his fatwa of jihad against the British; and pairs his death as 4 Rajab 1344 AH, 19 January 1926."
