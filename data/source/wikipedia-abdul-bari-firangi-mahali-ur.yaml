summary:
  ar: "مقالة ويكيبيديا الأردية عن عبد الباري الفرنجي محلي (1878–1926)؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في فرنجي محل بلكهنؤ في 10 ربيع الثاني 1295 هـ الموافق 12 أبريل 1878، ودخوله مريدًا في السلسلة القادرية عند شاه عبد الرزاق الهانسوي ونيله الإجازة والخلافة في جميع السلاسل، وفتواه بالجهاد ضد الإنجليز، ووفاته في 4 رجب 1344 هـ الموافق 19 يناير 1926."
  en: "Urdu Wikipedia article on Abdul Bari Firangi Mahali (1878–1926); used for entity facts only. It gives his birth at Firangi Mahal, Lucknow, on 10 Rabi' al-thani 1295 AH, paired with 12 April 1878; states in text that he entered the Qadiriyya order as a disciple of Shah Abdul Razzaq Hansvi and received authorisation and succession in all the orders; records his fatwa of jihad against the British; and pairs his death as 4 Rajab 1344 AH, 19 January 1926."
  es: "Artículo de Wikipedia en urdu sobre Abdul Bari Firangi Mahali (1878-1926); utilizado únicamente para datos sobre la persona. Indica que nació en Firangi Mahal, Lucknow, el 10 de Rabi' al-thani de 1295 AH, fecha que coincide con el 12 de abril de 1878; afirma que ingresó en la orden Qadiriyya como discípulo de Shah Abdul Razzaq Hansvi y recibió autorización y sucesión en todas las órdenes; registra su fatwa de yihad contra los británicos; y sitúa su muerte el 4 de Rajab de 1344 AH, fecha que coincide con el 19 de enero de 1926."
  fr: "L'article de Wikipédia en ourdou sur Abdul Bari Firangi Mahali (1878-1926) est utilisé uniquement à titre informatif. Il indique sa naissance à Firangi Mahal, Lucknow, le 10 Rabi' al-thani 1295 AH (12 avril 1878); précise qu'il entra dans l'ordre Qadiriyya comme disciple de Shah Abdul Razzaq Hansvi et reçut l'autorisation et la succession dans tous les ordres; mentionne sa fatwa de jihad contre les Britanniques; et situe son décès le 4 Rajab 1344 AH (19 janvier 1926)."
  ur: "عبدالباری فرنگی محلی (1878-1926) پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش فرنگی محل، لکھنؤ میں 10 ربیع الثانی 1295 ہجری کو ہوئی، جو کہ 12 اپریل 1878 کو ہوئی۔ متن میں کہتا ہے کہ وہ شاہ عبدالرزاق ہانسوی کے شاگرد کی حیثیت سے قادریہ حکم میں داخل ہوئے اور تمام احکام میں اجازت اور جانشینی حاصل کی۔ انگریزوں کے خلاف جہاد کا فتویٰ ریکارڈ کرتا ہے۔ اور ان کی وفات 4 رجب 1344 ہجری 19 جنوری 1926 کو ہوئی۔"
  tr: "Abdul Bari al-Franji Mahli (1878–1926) hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 10 Rabi'al-Thani 1295 H.'de Lakhnu'daki Franji Mahal'de doğduğu ve 12 Nisan 1878'e karşılık gelen 12 Nisan 1878'de doğduğu anılmaktadır; Şah Abdul Razzaq al-Hansawi'nin yanında Kadiri tarikatına katılarak tüm tarikatlarda ijaze ve halifelik elde etmiş, İngilizlere karşı cihat fetvaları vermiş ve 19 Ocak 1926'ya karşılık gelen 4 Rajab 1344 H.'de ölmüştür."
  id: "Artikel Wikipedia Urdu tentang Abdul Bari al-Franji Mahli (1878–1926); hanya digunakan untuk fakta entitas. Ia disebutkan lahir di Franji Mahal di Lakhnu pada 10 Rabi' al-Thani 1295 H, sesuai dengan 12 April 1878, bergabung dengan tarekat Qadiri sebagai murid di bawah Shah Abdul Razzaq al-Hansawi, memperoleh ijazah dan kekhalifahan dalam semua ordo, mengeluarkan fatwa jihad melawan Inggris, dan wafat pada 4 Rajab 1344 H, yang bertepatan dengan 19 Januari 1926."
