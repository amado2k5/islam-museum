summary:
  ar: "مدخل «قرسان» في موسوعة TDV الإسلامية: أصل الكلمة ومعناها ⁦(القرسان غازي البحر والحرامي لص البحر)⁩، القرصنة في المتوسط والبحر الأحمر والمحيط الهندي، قراصنة الأندلس وفلكسنتوم، قراصنة الجزائر والبحر الأبيض العثماني، وحكم الفقه وحظر مؤتمر باريس 1856."
  en: "The TDV İslâm Ansiklopedisi entry on the corsair: the word's origin and senses (the state-backed sea-ghazi versus the harami sea-thief), corsairing in the Mediterranean, the Red Sea and the Indian Ocean, the Andalusi corsairs and Fraxinetum, the Ottoman-age levend corsairs and North African bases, the fiqh ruling on sea-gaza, and the 1856 Paris congress ban."
  ur: "TDV اسلامی انسائیکلوپیڈیا کا مادہ «قورسان»: لفظ کی اصل و معنی ⁦(ریاستی سمندری غازی بمقابلہ حرامی سمندری ڈاکو)⁩، بحیرہ روم، بحیرہ احمر اور بحر ہند میں قزاقی، اندلسی قزاق اور فراکسینٹم، عثمانی دور کے لوند قزاق اور شمالی افریقی اڈے، بحری غزہ کا فقہی حکم، اور پیرس کانگریس 1856 کی پابندی۔"
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el corsario: el origen y los significados de la palabra (el ghazi marítimo respaldado por el estado frente al ladrón marítimo harami), el corso en el Mediterráneo, el Mar Rojo y el Océano Índico, los corsarios andalusíes y el Fraxinetum, los corsarios levend de la época otomana y las bases del norte de África, la decisión del fiqh sobre el ghazi marítimo y la prohibición del congreso de París de 1856."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le corsaire: l'origine et les sens du mot (le ghazi de mer soutenu par l'État contre le voleur de mer harami), la corsairie en Méditerranée, en mer Rouge et dans l'océan Indien, les corsaires andalous et Fraxinetum, les corsaires levend de l'époque ottomane et les bases nord-africaines, la jurisprudence fiqh sur le ghazi de mer et l'interdiction du congrès de Paris de 1856."
  tr: "TDV İslami Ansiklopedisi'nde \"Kursan\" maddesi: Kelimenin kökeni ve anlamı (Kur'an denizin fatihidir, hırsız ise denizin hırsızıdır), Akdeniz, Kızıldeniz ve Hint Okyanusu'ndaki korsanlık, Endülüs ve Flexantum korsanları, Cezayir ve Osmanlı Akdeniz korsanları, hukukun hükmü ve 1856 Paris Konferansı'nın yasaklanması."
  id: "Entri tentang \"Quran\" dalam Ensiklopedia Islam TDV: Asal Usul kata dan maknanya (Al-Qur'an adalah penakluk laut dan pencuri adalah pencuri laut), pembajakan di Mediterania, Laut Merah, dan Samudra Hindia, bajak laut Andalusia dan Flexantum, bajak laut Aljazair dan Mediterania Ottoman, serta penetapan hukum dan larangan Konferensi Paris tahun 1856."
