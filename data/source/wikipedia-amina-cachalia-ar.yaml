summary:
  ar: مقالة ويكيبيديا العربية عن أمينة كاشاليا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في فيرينجنغ في 28 يونيو 1930 ووفاتها في 31 يناير 2013، ونشاطها وزواجها من يوسف كاشاليا.
  en: Arabic Wikipedia article on Amina Cachalia; used for entity facts only. It gives her birth in Vereeniging on 28 June 1930 and her death on 31 January 2013, and her activism and marriage to Yusuf Cachalia.
  es: "Artículo de Wikipedia en árabe sobre Amina Cachalia; se utiliza únicamente para obtener información sobre ella. Nació el 28 de junio de 1930 en Vereeniging y falleció el 31 de enero de 2013. Estuvo casada con Yusuf Cachalia."
  fr: "Article Wikipédia en arabe sur Amina Cachalia; utilisé uniquement à titre informatif. Elle est née le 28 juin 1930 à Vereeniging et décédée le 31 janvier 2013. Elle était mariée à Yusuf Cachalia."
  ur: "عربی ویکیپیڈیا کا مضمون آمنہ کاچلیہ پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ وہ 28 جون 1930 کو ویرینینگ میں پیدا ہوئیں اور 31 جنوری 2013 کو انتقال کر گئیں۔ ان کی شادی یوسف کاچلیہ سے ہوئی تھی۔"
  tr: "Amina Kashalia hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 28 Haziran 1930'da Ferenging'de doğum, 31 Ocak 2013'te vefat etti, Yusuf Kashali ile evliliği ve faaliyetleri gerçekleşti."
  id: "Artikel Wikipedia bahasa Arab tentang Amina Kashalia; digunakan hanya untuk fakta entitas. Dia melahirkan di Ferenging pada 28 Juni 1930, meninggal pada 31 Januari 2013, aktivitas dan pernikahannya dengan Yusuf Kashalia."
