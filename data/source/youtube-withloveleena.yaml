  ar: "قناة لينا سنوبر على يوتيوب المعروفة باسم «مع الحب لينا»؛ مصدر أولي لمدوناتها في الأزياء المحتشمة والحياة الأسرية، منها أول فيديو أسئلة مع أخواتها سنة 2016 وفيديو زفافها ودروس الحجاب اليومية التي تجاوزت ملايين المشاهدات."
  en: "Leena Snoubar's YouTube channel, known as With Love, Leena; a primary source for her modest-fashion and family-life videos, including her first video, a 2016 Q&A with her sisters, her wedding video, and her everyday hijab tutorials viewed millions of times."
  es: "El canal de YouTube de Leena Snoubar, conocido como With Love, Leena, es una fuente principal de sus videos sobre moda modesta y vida familiar, incluyendo su primer video, una sesión de preguntas y respuestas de 2016 con sus hermanas, su video de boda y sus tutoriales diarios sobre el uso del hiyab, que han sido vistos millones de veces."
  fr: "La chaîne YouTube de Leena Snoubar, connue sous le nom de With Love, Leena, est une source principale pour ses vidéos sur la mode pudique et sa vie de famille, notamment sa première vidéo, une séance de questions-réponses de 2016 avec ses sœurs, sa vidéo de mariage et ses tutoriels quotidiens sur le hijab visionnés des millions de fois."
