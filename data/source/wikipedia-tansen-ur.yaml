reliability_note: "Article text read on 7 November 2026 at the recorded revision; the revision was fetched by its id through the API and the returned id asserted equal before any claim was drawn. The article is a short stub: it names him a jewel (ratan) of Akbar's court and the greatest musician of Hindustan, gives his birth name Ramtanu Pandey, born at Gwalior in the house of a temple priest, and states that though Hindu by birth he accepted Islam in his youth, and that after he joined the Navaratnas people addressed him as Mian Tansen. Its unqualified conversion statement is one of the readings preserved in the person's faith note; as a single text, contradicted by the scholarship the English article cites, it does not settle faith."
