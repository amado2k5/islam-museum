summary:
  ar: "مقالة ويكيبيديا العربية عن ناصر بن علي القطامي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1400هـ/1980م وإمامته لجامع عبد الله بن ناصر المهيني بالرياض ودراسته ومؤلفاته وإصداراته الصوتية، ولا تسمي له مذهباً."
  en: "Arabic Wikipedia article on Nasser Al-Qatami; used for entity facts only. It gives his birth in 1400 AH / 1980 CE, his imamate of the Abdullah ibn Nasser Al-Muhaini Mosque in Riyadh, his studies, his books and his audio releases; it names no school for him."
  es: "Artículo de Wikipedia en árabe sobre Nasser Al-Qatami; utilizado únicamente para datos sobre la persona. Menciona su nacimiento en 1400 AH / 1980 d. C., su imanato de la mezquita Abdullah ibn Nasser Al-Muhaini en Riad, sus estudios, sus libros y sus grabaciones de audio; no se menciona ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en arabe sur Nasser Al-Qatami; utilisé uniquement pour les informations le concernant. Il indique sa naissance en 1400 AH / 1980 CE, son imamat de la mosquée Abdullah ibn Nasser Al-Muhaini à Riyad, ses études, ses livres et ses enregistrements audio; il ne mentionne aucune école à laquelle il aurait appartenu."
  ur: "ناصر القطامی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1400 ہجری / 1980 عیسوی میں ان کی پیدائش، ریاض میں عبداللہ بن ناصر المحینی مسجد کی امامت، ان کی تعلیم، ان کی کتابیں اور ان کی آڈیو ریلیز؛ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Nasser bin Ali Al-Katami hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. 1400 Hicri / 1980 yılında doğumundan, Riyad'daki Abdullah bin Nasser Al-Muhayni Camii'ndeki imatı, çalışmaları, yazıları ve sesli yayınlarından bahseder, ancak düşünce okulunun adı verilmez."
  id: "Artikel Wikipedia berbahasa Arab tentang Nasser bin Ali Al-Qatami; hanya digunakan untuk fakta entitas. Artikel ini menyebutkan kelahirannya pada tahun 1400 H / 1980 M, immamate Masjid Abdullah bin Nasser Al-Muhayni di Riyadh, studinya, tulisan-tulisannya, dan publikasi audionya, serta tidak menyebutkan aliran pemikirannya."
