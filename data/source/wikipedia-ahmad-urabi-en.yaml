summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد عرابي؛ تُستخدم لوقائع الكيان فقط. توثّق مسيرته من ضابط فلاح إلى وزير حربية في حكومة البارودي الوطنية سنة 1882، والثورة العرابية وقصف الإسكندرية ومعركة التل الكبير، ومحاكمته ونفيه إلى سيلان (1882-1901) ووفاته في القاهرة في 21 سبتمبر 1911. يسمّيه صندوقها رئيسا للوزراء، وهو وصف يتردد المقال نفسه في إطلاقه وتعارضه المصادر الأخرى."
  en: "English Wikipedia article on Ahmed Urabi; used for entity facts only. It records his rise from fellah officer to Minister of War in al-Barudi's nationalist ministry in 1882, the 'Urabi revolt, the bombardment of Alexandria and the Battle of Tell el-Kebir, his trial and exile to Ceylon (1882–1901), and his death in Cairo on 21 September 1911. Its infobox styles him Prime Minister of Egypt, a description the article itself hedges ('it was claimed') and the other sources do not sustain."
  es: "Artículo de la Wikipedia en inglés sobre Ahmed Urabi; utilizado únicamente para datos sobre la persona. Narra su ascenso de oficial de la milicia a Ministro de Guerra en el ministerio nacionalista de al-Barudi en 1882, la revuelta de Urabi, el bombardeo de Alejandría y la batalla de Tell el-Kebir, su juicio y exilio a Ceilán (1882-1901), y su muerte en El Cairo el 21 de septiembre de 1911. Su ficha informativa lo denomina Primer Ministro de Egipto, una descripción que el propio artículo matiza («se afirmó») y que las demás fuentes no respaldan."
  fr: "L'article de Wikipédia en anglais consacré à Ahmed Urabi est utilisé uniquement pour les informations factuelles. Il relate son ascension, d'officier fellah à ministre de la Guerre au sein du gouvernement nationaliste d'al-Barudi en 1882, la révolte d'Urabi, le bombardement d'Alexandrie et la bataille de Tell el-Kebir, son procès et son exil à Ceylan (1882-1901), ainsi que sa mort au Caire le 21 septembre 1911. Son infobox le qualifie de Premier ministre d'Égypte, une affirmation nuancée par l'article lui-même (« il a été affirmé ») et que les autres sources ne confirment pas."
  ur: "احمد عربی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1882 میں البرودی کی قوم پرست وزارت میں فیلہ افسر سے وزیر جنگ تک اس کا عروج، عربی بغاوت، اسکندریہ پر بمباری اور ٹیل الکبیر کی لڑائی، اس کا مقدمہ اور سیلون میں جلاوطنی (1882-1901) اور قاہرہ میں اس کی موت 21 ستمبر کو مصر کے وزیر اعظم کے طرز پر 119 میں درج ہے۔ تفصیل مضمون خود ہیج کرتا ہے ⁦('اس کا دعوی کیا گیا تھا')⁩ اور دوسرے ذرائع برقرار نہیں رہتے ہیں۔"
  tr: "Ahmed Orabi hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılır. 1882'de Baroudi Ulusal Hükümeti'nde çiftçi subaydan savaş bakanlığına geçişini, Urabi İsyanı'nı, İskenderiye bombalanışını, Tel Kebir Muharebesi'ni, yargılanıp Seylan'a sürgün edilmesini (1882-1901) ve 21 Eylül 1911'de Kahire'de ölümünü belgelemektedir. Fon ona Başbakan olarak hitap eder; makale bu tanımı tekrar tekrar kullanır ve diğer kaynaklarda çelişmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Ahmed Orabi hanya digunakan untuk fakta-fakta entitas tersebut. Artikel ini mendokumentasikan perjalanannya dari perwira petani menjadi menteri perang dalam Pemerintahan Nasional Baroudi pada tahun 1882, Pemberontakan Urabi, pengeboman Alexandria, Pertempuran Tel Kebir, pengadilan dan pengasingannya ke Ceylon (1882-1901), serta kematiannya di Kairo pada 21 September 1911. Dana tersebut menyebutnya sebagai Perdana Menteri, sebuah deskripsi yang berulang kali digunakan dan dibantah oleh artikel tersebut dalam sumber lain."
