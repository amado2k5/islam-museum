reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 24 October 2026. It gives: born 31 March 1841; educated at al-Azhar from 1849; conscripted and risen to lieutenant colonel by about twenty; service in a support role in the Egyptian–Ethiopian War (1874–76), returning — in Blunt's account — incensed at its mismanagement; leader of the officers' protest against Turco-Circassian privilege and against Khedive Tewfik's law barring peasants from officership (the law was repealed); co-founder of the Egyptian Nationalist Party (1879); known to his followers as 'El Wahid'; Minister of War from February 1882 in Mahmud Sami al-Barudi's ministry; the Alexandria riots of June 1882, the British bombardment of July 1882, the battles of Kafr el-Dawwar and Kassassin (the 'Moonlight Charge', 28 August), and the decisive British victory at Tell el-Kebir on 13 September 1882; the trial of 3 December 1882 (defended by Broadley and Richard Eve), the guilty plea under the Dufferin understanding, the commuted death sentence and lifelong exile; departure on 28 December 1882 for Ceylon, where he championed Muslim education (Hameed Al Husseinie College, founded 15 November 1884; Zahira College, Colombo, 22 August 1892), his Kandy home being now the Orabi Pasha Cultural Centre; his pardon by Abbas II and return on 1 October 1901; his death in Cairo on 21 September 1911; and the 1952 echo of his words to Tewfik — that Egyptians were 'no longer inheritable' — by Muhammad Naguib. Caution recorded in the record: the infobox styles him 'Prime Minister of Egypt (1 July – 13 September 1882)', but the body itself hedges the claim, and the Arabic article and Britannica give the sounder framing — Minister of War and deputy head of the council in al-Barudi's ministry — which the museum follows."
