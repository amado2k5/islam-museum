summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد عرابي؛ تُستخدم لوقائع الكيان فقط. توثّق مسيرته من ضابط فلاح إلى وزير حربية في حكومة البارودي الوطنية سنة 1882، والثورة العرابية وقصف الإسكندرية ومعركة التل الكبير، ومحاكمته ونفيه إلى سيلان (1882-1901) ووفاته في القاهرة في 21 سبتمبر 1911. يسمّيه صندوقها رئيسا للوزراء، وهو وصف يتردد المقال نفسه في إطلاقه وتعارضه المصادر الأخرى."
  en: "English Wikipedia article on Ahmed Urabi; used for entity facts only. It records his rise from fellah officer to Minister of War in al-Barudi's nationalist ministry in 1882, the 'Urabi revolt, the bombardment of Alexandria and the Battle of Tell el-Kebir, his trial and exile to Ceylon (1882–1901), and his death in Cairo on 21 September 1911. Its infobox styles him Prime Minister of Egypt, a description the article itself hedges ('it was claimed') and the other sources do not sustain."
