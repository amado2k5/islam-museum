summary:
  ar: "فهرس الآيات ⁦(ص 634)⁩ في طبعة محمود محمد شاكر من دلائل الإعجاز للجرجاني، وهو بحسب الملخص البحثي يقرن هود ١٣ بالآية التي تذكر عشر سور مفتريات ⁦(الصفحات المذكورة 385 و606 و617)⁩. ذُكرت هذه الصفحة في ملخص بحثي قُدّم إلى المتحف وأجاز المؤسس استعماله في 21 نوفمبر 2026؛ ولم يفتح المتحف الصفحة نفسها."
  en: "The Quranic index (p. 634) of Mahmud Muhammad Shakir's edition of al-Jurjani's Dala'il al-I'jaz, which, according to the research summary, pairs Hud 13 with the verse on ten invented suras (cited pages 385, 606, 617). The page was named in a research summary supplied to the museum and approved for use by the founder on 21 November 2026; the museum did not open it."
  ur: "محمود محمد شاکر کی طبع میں جرجانی کی دلائل الاعجاز کا آیات کا اشاریہ ⁦(ص 634)⁩، جو تحقیقی خلاصے کے مطابق ہود 13 کو دس گھڑی ہوئی سورتوں والی آیت کے ساتھ جوڑتا ہے ⁦(مذکور صفحات 385، 606، 617)⁩۔ اس صفحے کا ذکر عجائب گھر کو دیے گئے ایک تحقیقی خلاصے میں تھا جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی؛ عجائب گھر نے یہ صفحہ خود نہیں کھولا۔"
  fr: "L'index coranique (p. 634) de l'édition de Mahmud Muhammad Shakir des Dala'il al-I'jaz d'al-Jurjani, qui, selon le résumé de recherche, associe Hud 13 au verset sur dix sourates inventées (pages citées 385, 606, 617). La page est nommée dans un résumé de recherche remis au musée et approuvé pour usage par le fondateur le 21 novembre 2026 ; le musée ne l'a pas ouverte."
  es: "El índice coránico (p. 634) de la edición de Mahmud Muhammad Shakir de los Dala'il al-I'jaz de al-Jurjani, que según el resumen de investigación asocia Hud 13 con el versículo sobre diez suras inventadas (páginas citadas 385, 606, 617). La página figura en un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026; el museo no la abrió."
  tr: "Araştırma özetine göre, Mahmud Muhammed Şaker'in Dalail al-I'jaz baskısındaki Ayetler Dizini (s. 634), araştırma özetine göre, Hud 13'ü on uydurma sureden bahseden ayetle (sayfa 385, 606 ve 617) ilişkilendirmektedir. Bu sayfa, müzeye sunulan ve kurucu tarafından 21 Kasım 2026'da yetkilendirilen bir araştırma özetinde bahsedilmiştir; müze sayfayı kendisi açmamıştır."
  id: "Indeks Ayat-ayat (hlm. 634) dalam edisi Dalail al-I'jaz karya Al-Jurjani oleh Mahmoud Muhammad Shaker, menurut ringkasan penelitian, mengaitkan Hud 13 dengan ayat yang menyebutkan sepuluh surah palsu (halaman 385, 606, dan 617). Halaman ini disebutkan dalam ringkasan penelitian yang diserahkan ke museum dan diotorisasi oleh pendiri pada 21 November 2026; museum tidak membuka halaman itu sendiri."
