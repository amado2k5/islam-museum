summary:
  ar: "طبعة دار ابن كثير ⁦(دمشق–بيروت)⁩ من جامع الأصول، بتحقيق الشيخ عبد القادر الأرناؤوط، وأعدّ طبعتها الثانية بعد وفاته مساعدوه عدنان عبد ربه ومحمد أديب الجادر ومأمون الصاغرجي، وضُمّت إليها تتمة الكتاب؛ الطبعة الثالثة 1437هـ/2016م، 8848 صفحة كما في بيانات الطبع."
  en: "The Dar Ibn Kathir (Damascus–Beirut) edition of Jami' al-Usul, edited by Shaykh 'Abd al-Qadir al-Arna'ut, its second edition prepared after his death by his assistants 'Adnan 'Abd Rabbih, Muhammad Adib al-Jadir and Ma'mun al-Saghirji, with the book's Tatimma included; third edition 1437 AH/2016 CE, 8,848 pages according to the imprint."
