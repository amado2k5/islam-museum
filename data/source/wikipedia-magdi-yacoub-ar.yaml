  ar: "مقالة ويكيبيديا العربية عن مجدي حبيب يعقوب ⁦(16 تشرين الثاني 1935)⁩، جرّاح القلب المصري العالمي؛ تعرض دراسته في القاهرة وعمله في شيكاغو ولندن ومركز أسوان للقلب، وتذكر أن زواجه سنة 1968 أُقيم في كنيسة صغيرة في جامعة شيكاغو، ولا تسميه قبطيًا في متنها."
