summary:
  ar: "مقالة ويكيبيديا العربية عن مجدي حبيب يعقوب ⁦(16 تشرين الثاني 1935)⁩، جرّاح القلب المصري العالمي؛ تعرض دراسته في القاهرة وعمله في شيكاغو ولندن ومركز أسوان للقلب، وتذكر أن زواجه سنة 1968 أُقيم في كنيسة صغيرة في جامعة شيكاغو، ولا تسميه قبطيًا في متنها."
  en: "Arabic Wikipedia article on Magdi Habib Yacoub (16 November 1935), the Egyptian heart surgeon; it covers his studies in Cairo, his work in Chicago and London and the Aswan Heart Centre, and records that his 1968 marriage was held in a small church at the University of Chicago, without ever calling him Coptic in its text."
  es: "Artículo en árabe de la Wikipedia sobre Magdi Habib Yacoub (16 de noviembre de 1935), el cirujano cardíaco egipcio; abarca sus estudios en El Cairo, su trabajo en Chicago y Londres y el Centro Cardíaco de Asuán, y registra que su boda en 1968 se celebró en una pequeña iglesia de la Universidad de Chicago, sin mencionar en ningún momento que fuera copto."
  fr: "Article de Wikipédia en arabe sur Magdi Habib Yacoub (16 novembre 1935), le chirurgien cardiaque égyptien; il couvre ses études au Caire, son travail à Chicago et à Londres et au Centre cardiaque d'Assouan, et indique que son mariage en 1968 a eu lieu dans une petite église de l'Université de Chicago, sans jamais le qualifier de copte dans son texte."
  ur: "مقدی حبیب یعقوب ⁦(16 نومبر 1935)⁩ پر عربی ویکیپیڈیا مضمون، مصری دل کے سرجن؛ اس میں قاہرہ میں ان کی تعلیم، شکاگو اور لندن میں ان کے کام اور اسوان ہارٹ سینٹر کا احاطہ کیا گیا ہے، اور ریکارڈ ہے کہ ان کی 1968 کی شادی شکاگو یونیورسٹی کے ایک چھوٹے سے چرچ میں ہوئی تھی، اس کے متن میں اسے کبھی قبطی نہیں کہا گیا تھا۔"
  tr: "Dünyaca ünlü Mısırlı kalp cerrahı Magdy Habib Yacoub (16 Kasım 1935) hakkında Arapça Wikipedia makalesi, Kahire'deki çalışmalarını ve Chicago, Londra ile Aswan Kalp Merkezi'ndeki çalışmalarını sunar. 1968'de evliliğinin Chicago Üniversitesi'ndeki küçük bir kilisede gerçekleştiği belirtilir ve içeriğinde kendisine Kıpti denmez."
  id: "Artikel Wikipedia berbahasa Arab tentang Magdy Habib Yacoub (16 November 1935), ahli bedah jantung Mesir yang terkenal di dunia, menyajikan studinya di Kairo dan karyanya di Chicago, London, dan Aswan Heart Center. Artikel tersebut menyebutkan bahwa pernikahannya pada tahun 1968 berlangsung di sebuah gereja kecil di University of Chicago, dan isinya tidak menyebutnya sebagai Koptik."
