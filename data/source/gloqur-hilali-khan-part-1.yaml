summary:
  ar: "الجزء الأول من دراسة ميخايلو ياكوبوفيتش في مشروع «القرآن العالمي» بجامعة مونستر، 29 أبريل 2022، عن ترجمة الهلالي ومحسن خان لمعاني القرآن إلى الإنجليزية: إتمامها في المدينة سنة 1972، وطبعتها الأولى عند كازي في شيكاغو سنة 1977، والثانية في أنقرة 1978، والثالثة 1985، ومراجعة دار السلام 1994، وطبعة مجمع الملك فهد 1997."
  en: "Part one of Mykhaylo Yakubovych's study for the Global Qur'an project at the University of Münster, 29 April 2022, on the Hilali–Khan English translation: completed in Medina in 1972, first published by Kazi in Chicago in 1977, second edition Ankara 1978, third 1985, Darussalam's revision of 1994 and the King Fahd Complex edition of 1997."
  ur: "جامعہ مونسٹر کے منصوبے «گلوبل قرآن» میں میخائیلو یاکوبووچ کی تحقیق کا پہلا حصہ، 29 اپریل 2022، ہلالی و محسن خان کے انگریزی ترجمے پر: مدینہ میں 1972 میں تکمیل، شکاگو میں کازی سے 1977 میں پہلی اشاعت، انقرہ 1978، تیسری اشاعت 1985، دار السلام کی 1994 کی نظرِ ثانی اور 1997 میں شاہ فہد کمپلیکس کی اشاعت۔"
