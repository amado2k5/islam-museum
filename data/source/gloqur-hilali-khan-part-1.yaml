label: { en: "GloQur, Qur'an translation of the week #102: Hilali and Khan, the story behind the first Saudi translation, part 1 (Mykhaylo Yakubovych, 2022)" }
summary:
  ar: "الجزء الأول من دراسة ميخايلو ياكوبوفيتش في مشروع «القرآن العالمي» بجامعة مونستر، 29 أبريل 2022، عن ترجمة الهلالي ومحسن خان لمعاني القرآن إلى الإنجليزية: إتمامها في المدينة سنة 1972، وطبعتها الأولى عند كازي في شيكاغو سنة 1977، والثانية في أنقرة 1978، والثالثة 1985، ومراجعة دار السلام 1994، وطبعة مجمع الملك فهد 1997."
  en: "Part one of Mykhaylo Yakubovych's study for the Global Qur'an project at the University of Münster, 29 April 2022, on the Hilali–Khan English translation: completed in Medina in 1972, first published by Kazi in Chicago in 1977, second edition Ankara 1978, third 1985, Darussalam's revision of 1994 and the King Fahd Complex edition of 1997."
  ur: "جامعہ مونسٹر کے منصوبے «گلوبل قرآن» میں میخائیلو یاکوبووچ کی تحقیق کا پہلا حصہ، 29 اپریل 2022، ہلالی و محسن خان کے انگریزی ترجمے پر: مدینہ میں 1972 میں تکمیل، شکاگو میں کازی سے 1977 میں پہلی اشاعت، انقرہ 1978، تیسری اشاعت 1985، دار السلام کی 1994 کی نظرِ ثانی اور 1997 میں شاہ فہد کمپلیکس کی اشاعت۔"
  es: "Primera parte del estudio de Mykhaylo Yakubovych para el proyecto Global Qur'an en la Universidad de Münster, 29 de abril de 2022, sobre la traducción al inglés de Hilali-Khan: completada en Medina en 1972, publicada por primera vez por Kazi en Chicago en 1977, segunda edición en Ankara en 1978, tercera en 1985, revisión de Darussalam de 1994 y la edición del Complejo Rey Fahd de 1997."
  fr: "Première partie de l'étude de Mykhaylo Yakubovych pour le projet Global Qur'an de l'Université de Münster, 29 avril 2022, sur la traduction anglaise Hilali-Khan: achevée à Médine en 1972, publiée pour la première fois par Kazi à Chicago en 1977, deuxième édition à Ankara en 1978, troisième en 1985, révision de Darussalam en 1994 et édition du complexe du roi Fahd en 1997."
  tr: "Michailo Yakupović'in Münster Üniversitesi'ndeki \"Dünya Kur'an\" projesindeki çalışmasının ilk bölümü, 29 Nisan 2022'de, Al-Hilali ve Mohsen Khan'ın Kur'an'ın anlamlarının İngilizceye çevirisi üzerine: 1972'de Medine'de tamamlandı, ilk baskısı 1977'de Chicago'da Kazi tarafından, 1978'de Ankara'da ikincisi, 1985'te üçüncüsü, 1994'te Dar Al-Salam tarafından inceleme ve 1997'de King Fahd Kompleksi baskısı."
  id: "Bagian pertama studi Michailo Yakupović dalam proyek \"Al-Qur'an Dunia\" di Universitas Münster, 29 April 2022, tentang terjemahan Al-Hilali dan Mohsen Khan tentang makna Al-Quran ke dalam bahasa Inggris: selesai di Madinah pada tahun 1972, edisi pertama oleh Kazi di Chicago pada tahun 1977, edisi kedua di Ankara pada tahun 1978, ketiga pada tahun 1985, ulasan oleh Dar Al-Salam pada tahun 1994, dan edisi King Fahd Complex pada tahun 1997."
title: "Qur'an translation of the week #102: 'Interpretation of the meanings of the Noble Qur'an in the English language' by al-Hilālī and Khān – the story behind the first Saudi translation (1/2)"
