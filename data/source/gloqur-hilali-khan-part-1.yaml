reliability_note: "Signed research post on the Münster project's blog, read in full in Chrome on 6 November 2026. Used for the translators' dates (al-Hilali 1893–1987, Muhsin Khan 1927–2021), the completion in 1972, the editions of 1977 (Kazi, Chicago), 1978 (Hilal Yayinlari, Ankara, with the Islamic University of Medina's letter), 1985, 1994 (Darussalam, revised, one- and nine-volume) and 1997 (King Fahd Complex), the original title and subtitle, and the 'more than 20 times since 1977' publication count."
