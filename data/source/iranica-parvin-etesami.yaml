summary:
  ar: "مدخل موسوعة إيرانيكا «اعتصامی، پروین» بقلم حشمت معيّد؛ يُستخدم لوقائع الكيان. يعطي ميلادها في 25 اسفند 1285 هـ.ش (16 مارس 1907) في تبريز ووفاتها في 16 فروردين 1320 هـ.ش (5 أبريل 1941) في طهران، وتدرّجها التعليمي وديوانها وقصائد المناظرة لديها."
  en: "Encyclopaedia Iranica entry 'E'tesami, Parvin' by Heshmat Moayyad; used for entity facts. It gives her birth on 25 Esfand 1285 SH (16 March 1907) at Tabriz and her death on 16 Farvardin 1320 SH (5 April 1941) at Tehran, her schooling, and her Divan and its debate poems."
