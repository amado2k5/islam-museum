summary:
  ar: "مدخل موسوعة إيرانيكا «اعتصامی، پروین» بقلم حشمت معيّد؛ يُستخدم لوقائع الكيان. يعطي ميلادها في 25 اسفند 1285 هـ.ش ⁦(16 مارس 1907)⁩ في تبريز ووفاتها في 16 فروردين 1320 هـ.ش ⁦(5 أبريل 1941)⁩ في طهران، وتدرّجها التعليمي وديوانها وقصائد المناظرة لديها."
  en: "Encyclopaedia Iranica entry 'E'tesami, Parvin' by Heshmat Moayyad; used for entity facts. It gives her birth on 25 Esfand 1285 SH (16 March 1907) at Tabriz and her death on 16 Farvardin 1320 SH (5 April 1941) at Tehran, her schooling, and her Divan and its debate poems."
  es: "Entrada de la Enciclopedia Iranica «E'tesami, Parvin» de Heshmat Moayyad; utilizada para datos biográficos. Indica su nacimiento el 25 de Esfand de 1285 SH (16 de marzo de 1907) en Tabriz y su fallecimiento el 16 de Farvardin de 1320 SH (5 de abril de 1941) en Teherán, su educación y su Diván y sus poemas de debate."
  fr: "L'article « E'tesami, Parvin » de Heshmat Moayyad, paru dans l'Encyclopaedia Iranica, fournit des informations sur cette personne. On y trouve des indications sur sa naissance le 25 Esfand 1285 SH (16 mars 1907) à Tabriz et son décès le 16 Farvardin 1320 SH (5 avril 1941) à Téhéran, sa scolarité, ainsi que son Divan et ses poèmes de débat."
  ur: "انسائیکلو پیڈیا ایرانیکا کا اندراج 'ایتصامی، پروین' از حشمت معیاد؛ ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 25 اسفند 1285 SH ⁦(16 مارچ 1907)⁩ کو تبریز میں ہوئی اور اس کی موت 16 فروردین 1320 SH ⁦(5 اپریل 1941)⁩ کو تہران میں ہوئی، اس کی اسکولنگ، اور اس کے دیوان اور اس کی بحث کی نظمیں ہیں۔"
