reliability_note: "Scholarly encyclopedia entry (Vol. VIII, Fasc. 6, pp. 666-669), read in full on 26 October 2026. Its birth date agrees with the Persian article and Wikidata; its death date, 16 Farvardin 1320 = 5 April 1941, differs from the two Wikipedia articles' 15 Farvardin = 4 April, a split the record discloses. It discusses her life and poetry without naming any personal affiliation."
