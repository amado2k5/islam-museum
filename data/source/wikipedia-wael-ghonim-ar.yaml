  ar: "مقالة ويكيبيديا العربية عن وائل غنيم؛ تُستخدم لوقائع الكيان فقط. تؤكد دوره في صفحة «كلنا خالد سعيد» وثورة 25 يناير، وتأسيسه مؤسسة نبضات وأكاديمية التحرير ومشاركته في تأسيس بارليو، ولا تسمّي له مذهبًا."
  en: "Arabic Wikipedia article on Wael Ghonim; used for entity facts only. It confirms his role in the 'We are all Khaled Said' page and the 25 January revolution, his founding of the Nabadat foundation and Tahrir Academy and his co-founding of Parlio, and names no school for him."
  es: "Artículo de Wikipedia en árabe sobre Wael Ghonim; utilizado únicamente para datos sobre la persona. Confirma su papel en la página «Todos somos Khaled Said» y en la revolución del 25 de enero, la fundación de la Fundación Nabadat y la Academia Tahrir, así como su participación como cofundador de Parlio, pero no menciona ninguna escuela en su honor."
  fr: "L'article de Wikipédia en arabe consacré à Wael Ghonim, utilisé uniquement à des fins d'information sur l'entité, confirme son rôle dans la page « Nous sommes tous Khaled Said » et la révolution du 25 janvier, la fondation de la fondation Nabadat et de l'Académie Tahrir, ainsi que sa cofondation de Parlio. Aucune école ne porte son nom."
