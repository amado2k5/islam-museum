reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026, and its lead and biography checked against the recorded revision. It gives Ballaké Sissoko, born 1968 (lead; the French article and Wikidata give 1967 — the conflict is carried in the person record); his father Djelimady Sissoko, a notable musician from the Gambia who moved to Mali and was funded by the government to be part of the national orchestra; Ballaké taking his father's place in the Ensemble Instrumental National du Mali after his father's death in 1981, when he was 13; fame through his 1999 duet with Toumani Diabaté; the trio Mande Tabolo (2000); Tomora (2005); Chamber Music (2009) with the cellist Vincent Ségal; the solo album At Peace (2013); the February 2020 affair of his custom-made kora, dismantled on his return from a US tour, which this article attributes to U.S. Customs and Border Protection while reporting that agency's denial that it opened the case; the 2021 album Djourou, named from those events; the 2023 premiere of Zad Moultaka's Concerto for Kora at Radio France in Paris; and the duo with Derek Gripper since 2022, with their joint album of 2024. The article states no religion for him."
