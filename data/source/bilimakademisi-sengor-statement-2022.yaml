summary:
  ar: "بيان أكاديمية العلوم التركية ⁦(5 سبتمبر 2022)⁩ بشأن استدعاء جلال شنغور للإدلاء بإفادته بعد شكوى رئاسة الشؤون الدينية: يوثق قوله على التلفاز إن أنبياء الكتب المقدسة الإبراهيمية وأحداثها لا وثائق تاريخية لها."
  en: "Statement of the Science Academy of Turkey (Bilim Akademisi), 5 September 2022, on Celâl Şengör being summoned to testify after the Presidency of Religious Affairs (Diyanet) complained about his television remarks: it records that on the programme he said the prophets and events narrated in the Abrahamic scriptures have no historical documents."
  es: "Declaración de la Academia de Ciencias de Turquía (Bilim Akademisi), 5 de septiembre de 2022, sobre la citación de Celâl Şengör para testificar después de que la Presidencia de Asuntos Religiosos (Diyanet) se quejara de sus declaraciones televisivas: en ella se recoge que en el programa dijo que los profetas y los acontecimientos narrados en las escrituras abrahámicas no tienen documentos históricos."
  fr: "Déclaration de l'Académie des sciences de Turquie (Bilim Akademisi), 5 septembre 2022, concernant la convocation de Celâl Şengör à témoigner après que la Direction des affaires religieuses (Diyanet) se soit plainte de ses propos télévisés: il est indiqué que dans l'émission, il a déclaré que les prophètes et les événements narrés dans les écritures abrahamiques n'avaient aucun document historique."
