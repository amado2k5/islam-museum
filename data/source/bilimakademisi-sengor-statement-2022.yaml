reliability_note: "Official one-page statement of the Science Academy's board, read in full in this session. It states that Şengör was summoned by the Istanbul Chief Public Prosecutor's Press Crimes Bureau, on a complaint by the Presidency of Religious Affairs, over words spoken on Habertürk's Teke Tek Bilim programme ('Harran kutsal kitaplarda nasıl anlatılıyor?'), in which he said that the prophets and events told in the holy books of the Abrahamic religions have no historical documents, distinguishing legendary from documentary transmission with reference to Fuad Köprülü's İlk Mutasavvıflar. It is an institutional record, independent of Wikipedia and Wikidata, of his publicly professed unbelief and of the official reaction it drew."
