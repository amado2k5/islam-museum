  ar: "بيان أكاديمية العلوم التركية (5 سبتمبر 2022) بشأن استدعاء جلال شنغور للإدلاء بإفادته بعد شكوى رئاسة الشؤون الدينية: يوثق قوله على التلفاز إن أنبياء الكتب المقدسة الإبراهيمية وأحداثها لا وثائق تاريخية لها."
  en: "Statement of the Science Academy of Turkey (Bilim Akademisi), 5 September 2022, on Celâl Şengör being summoned to testify after the Presidency of Religious Affairs (Diyanet) complained about his television remarks: it records that on the programme he said the prophets and events narrated in the Abrahamic scriptures have no historical documents."
