summary:
  ar: "أطروحة محفوظة في مستودع معهد إندونيسيا للفنون في سوراكارتا تدرس برامج نبوي تي في بوصفه وسيلة دعوة، وتوثق من ملف تعريف القناة نفسه طابعها غير التجاري وعدم انتمائها لأي منظمة أو حزب وتقديمها إسلاما معتدلا."
  en: "A thesis held in the repository of Institut Seni Indonesia Surakarta studying Nabawi TV's programming as a dakwah medium, documenting from the channel's own company profile its non-commercial character, its unaffiliated status and its presentation of moderate Islam."
  es: "Tesis conservada en el repositorio del Institut Seni Indonesia Surakarta que estudia la programación de Nabawi TV como medio de dakwah (proselitismo islámico), documentando a partir del perfil de la propia empresa del canal su carácter no comercial, su estatus de no afiliación y su presentación de un Islam moderado."
  fr: "Une thèse conservée dans les archives de l'Institut Seni Indonesia Surakarta étudiant la programmation de Nabawi TV en tant que moyen de da'wa, documentant à partir du profil de l'entreprise de la chaîne son caractère non commercial, son statut indépendant et sa présentation d'un islam modéré."
  ur: "Institut Seni Indonesia Surakarta کے ذخیرے میں منعقدہ ایک مقالہ جس میں نبیوی ٹی وی کے پروگرامنگ کا بطور ڈاکو میڈیم مطالعہ کیا گیا ہے، جس میں چینل کی اپنی کمپنی کی پروفائل سے اس کے غیر تجارتی کردار، اس کی غیر وابستہ حیثیت اور اعتدال پسند اسلام کی پیش کش کی گئی ہے۔"
  tr: "Saurakarta'daki Endonezya Sanat Enstitüsü'nün arşivinde saklanan bir tez, kanalın ticari olmayan nitelikteki profilini, herhangi bir örgüt veya partiye bağlılığını ve ılımlı İslam'ı sunumunu belgeleyen Peygamberlik TV programlarını bir davet aracı olarak inceliyor."
  id: "Disertasi yang disimpan di repositori Institut Seni Indonesia di Saurakarta mempelajari program TV Nabi sebagai sarana undangan, mendokumentasikan profil saluran ini sebagai non-komersial, ketidakterafiliasiannya dengan organisasi atau partai manapun, dan penyajian Islam moderat."
title: "Strategi Program Nabawi TV sebagai Media Dakwah"
