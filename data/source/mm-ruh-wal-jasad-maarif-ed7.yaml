summary:
  ar: "الطبعة السابعة من كتاب مصطفى محمود «الروح والجسد» عن دار المعارف، مقالات في السعادة والحب والجنة والنار والماء والنفس وأصنام العصر والوجود قبل الميلاد، وفي آخرها قائمة بواحد وستين كتاباً له."
  en: "The seventh edition of Mostafa Mahmoud's al-Ruh wa-l-Jasad from Dar al-Ma'arif: essays on happiness, love, Paradise and Hell, water, the self, the idols of the age and existence before birth, with a list of sixty-one of his books at the end."
  ur: "مصطفیٰ محمود کی «الروح والجسد» کا دار المعارف سے ساتواں ایڈیشن: خوشی، محبت، جنت و جہنم، پانی، نفس، دور کے بت اور پیدائش سے پہلے کے وجود پر مضامین، آخر میں ان کی اکسٹھ کتابوں کی فہرست۔"
