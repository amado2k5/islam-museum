  ar: "مقالة ويكيبيديا التركية عن محمد مراد بك «ميزانجي مراد»؛ تُستخدم لوقائع الكيان فقط. تعطي في مطلعها وصندوقها ولادته سنة 1854 في داغستان ووفاته في 15 أبريل 1917 في إسطنبول، وتروي رئاسته جمعية الاتحاد والترقي في جنيف سنة 1896 ومنفاه إلى رودس وميثليه وتاريخه «تاريخ أبي الفاروق»."
  en: "Turkish Wikipedia article on Mehmed Murad Bey, 'Mizanci Murad'; used for entity facts only. Its lead and infobox give his birth in 1854 in Dagestan and his death on 15 April 1917 at Istanbul, and it recounts his 1896 leadership of the Committee of Union and Progress at Geneva, his Rhodes exile after 1909, and his multi-volume Tarih-i Ebulfaruk."
