summary:
  ar: "مقالة ويكيبيديا التركية عن محمد مراد بك «ميزانجي مراد»؛ تُستخدم لوقائع الكيان فقط. تعطي في مطلعها وصندوقها ولادته سنة 1854 في داغستان ووفاته في 15 أبريل 1917 في إسطنبول، وتروي رئاسته جمعية الاتحاد والترقي في جنيف سنة 1896 ومنفاه إلى رودس وميثليه وتاريخه «تاريخ أبي الفاروق»."
  en: "Turkish Wikipedia article on Mehmed Murad Bey, 'Mizanci Murad'; used for entity facts only. Its lead and infobox give his birth in 1854 in Dagestan and his death on 15 April 1917 at Istanbul, and it recounts his 1896 leadership of the Committee of Union and Progress at Geneva, his Rhodes exile after 1909, and his multi-volume Tarih-i Ebulfaruk."
  es: "Artículo de la Wikipedia en turco sobre Mehmed Murad Bey, «Mizanci Murad»; utilizado únicamente para datos biográficos. Su introducción y ficha informativa indican su nacimiento en 1854 en Daguestán y su fallecimiento el 15 de abril de 1917 en Estambul, y relata su liderazgo del Comité de Unión y Progreso en Ginebra en 1896, su exilio en Rodas después de 1909 y su obra multivolumen Tarih-i Ebulfaruk."
  fr: "L'article de Wikipédia en turc sur Mehmed Murad Bey, « Mizanci Murad », est utilisé uniquement à des fins d'information sur l'entité. Son introduction et son infobox indiquent sa naissance en 1854 au Daghestan et sa mort le 15 avril 1917 à Istanbul. L'article relate également son rôle à la tête du Comité Union et Progrès à Genève en 1896, son exil à Rhodes après 1909 et son œuvre en plusieurs volumes, le Tarih-i Ebulfaruk."
  ur: "محمد مراد بے پر ترک ویکیپیڈیا مضمون، 'میزانچی مراد'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ اور انفو باکس 1854 میں داغستان میں اس کی پیدائش اور 15 اپریل 1917 کو استنبول میں اس کی موت کا ذکر کرتا ہے، اور یہ جنیوا میں ان کی 1896 کی کمیٹی آف یونین اینڈ پروگریس کی قیادت، 1909 کے بعد اس کی رہوڈز کی جلاوطنی، اور اس کی کثیر حجم کی تاریخ-ایبلفاروک کا ذکر کرتا ہے۔"
