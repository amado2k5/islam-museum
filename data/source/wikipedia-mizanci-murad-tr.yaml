reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. Its lead and infobox date his birth to 1854, while its biography section, following the Osmanlilar Ansiklopedisi entry, says he was born in 1853 in the village of Huraki (Urakhi) in Dagestan and was named after the Dagestani leader Haci Murat; the two readings are both preserved in the museum record. It describes his advocacy of Ottomanism as the state's official ideology and Islamic unity (ümmetçilik) as its cultural ideology, and says his line 'shifted Islamic' after 1908 - political positions, not a personal school attestation - and it names no madhhab for him."
