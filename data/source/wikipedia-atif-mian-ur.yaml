summary:
  ar: "مقالة ويكيبيديا الأردية عن عاطف ميان؛ تُستخدم لوقائع الكيان فقط. نص مستقل البنية عن الإنجليزية، يروي عضويته في المجلس الاستشاري الاقتصادي وإقالته في 7 سبتمبر 2018، ويذكر نصا أنه يواجه معارضة «لكونه أحمديا»."
  en: "Urdu Wikipedia article on Atif Mian; used for entity facts only. An independently structured text (not a translation of the English article), it recounts his Economic Advisory Council membership and removal on 7 September 2018 and states in its own words that he faces opposition 'because he is an Ahmadi'."
  es: "Artículo de Wikipedia en urdu sobre Atif Mian; utilizado únicamente para datos sobre la persona. Se trata de un texto con estructura independiente (no una traducción del artículo en inglés) que relata su pertenencia al Consejo Asesor Económico y su destitución el 7 de septiembre de 2018, y afirma textualmente que se enfrenta a la oposición «porque es ahmadí»."
  fr: "Article de Wikipédia en ourdou sur Atif Mian; utilisé uniquement à des fins d’information sur l’entité. Ce texte, structuré indépendamment (et non une traduction de l’article anglais), relate son appartenance au Conseil consultatif économique et son éviction le 7 septembre 2018, et affirme, en ses propres termes, qu’il fait face à de l’opposition « parce qu’il est ahmadi »."
  ur: "عاطف میاں پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک آزادانہ ساختہ متن ⁦(انگریزی مضمون کا ترجمہ نہیں)⁩، یہ 7 ستمبر 2018 کو ان کی اکنامک ایڈوائزری کونسل کی رکنیت اور برطرفی کا ذکر کرتا ہے اور اپنے الفاظ میں کہتا ہے کہ اسے 'اس لیے کہ وہ احمدی ہیں' مخالفت کا سامنا ہے۔"
