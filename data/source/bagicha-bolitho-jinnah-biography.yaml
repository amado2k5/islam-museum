summary:
  ar: "مقال بحثي ⁦(15 نوفمبر 2020)⁩ يعيد نشر مراسلات هيكتور بوليثو مع وزارة الإعلام الباكستانية سنة 1952 حول السيرة الرسمية لجناح؛ ويُذكر فيه البروفيسور محمود بريلوي بأنه عُيّن لمساعدة بوليثو ثم انسحب من العمل."
  en: "Research article of 15 November 2020 republishing Hector Bolitho's 1952 correspondence with Pakistan's Ministry of Information over the official biography of Jinnah; Bolitho's letter of 4 February 1952 names 'Prof. Mahmud Brelvi', appointed to help him, as having withdrawn from the work."
  es: "Artículo de investigación del 15 de noviembre de 2020 que republica la correspondencia de Hector Bolitho de 1952 con el Ministerio de Información de Pakistán sobre la biografía oficial de Jinnah; la carta de Bolitho del 4 de febrero de 1952 menciona que el 'Profesor Mahmud Brelvi', designado para ayudarle, se había retirado del trabajo."
  fr: "Article de recherche du 15 novembre 2020 republiant la correspondance de 1952 d'Hector Bolitho avec le ministère de l'Information du Pakistan au sujet de la biographie officielle de Jinnah; la lettre de Bolitho du 4 février 1952 mentionne que le « professeur Mahmud Brelvi », nommé pour l'aider, s'est retiré du projet."
