  ar: "مقالة ويكيبيديا الإنجليزية عن محمد شوكت أيغي ⁦(7 فبراير 1933 – 12 يوليو 2019)⁩: صحفي وكاتب عمود تركي، مؤسس صحيفة «بوغون» (1966)، وكاتب في «مللي غازته» من 1991 حتى وفاته؛ توثّق مقالاته الأكاديمية المستشهد بها آراءه الإسلامية ومعاداته للشيوعية ونظريات المؤامرة المعادية للسامية وإنكاره للهولوكوست."
  en: "English Wikipedia article on Mehmed Şevket Eygi (7 February 1933 – 12 July 2019): Turkish journalist and columnist, founder of the Bugün daily (1966) and Millî Gazete columnist from 1991 until his death; the scholarship it cites documents his Islamism, anti-communism, antisemitic conspiracy theorising and Holocaust denial."
  es: "Artículo de la Wikipedia en inglés sobre Mehmed Şevket Eygi (7 de febrero de 1933 - 12 de julio de 2019): periodista y columnista turco, fundador del diario Bugün (1966) y columnista de Millî Gazete desde 1991 hasta su muerte; los estudios que cita documentan su islamismo, anticomunismo, teorías conspirativas antisemitas y negación del Holocausto."
  fr: "Article de Wikipédia en anglais sur Mehmed Şevket Eygi (7 février 1933 – 12 juillet 2019): journaliste et chroniqueur turc, fondateur du quotidien Bugün (1966) et chroniqueur de Millî Gazete de 1991 jusqu'à sa mort; les travaux universitaires cités documentent son islamisme, son anticommunisme, ses théories du complot antisémites et son négationnisme de l'Holocauste."
  ur: "انگریزی ویکیپیڈیا مضمون پر محمود Şevket Eygi ⁦(7 فروری 1933 - 12 جولائی 2019)⁩: ترک صحافی اور کالم نگار، روزنامہ بگون کے بانی (1966) اور ملی گزیٹ کے کالم نگار 1991 سے اپنی موت تک؛ اس اسکالرشپ میں اس کی اسلامیت، کمیونزم مخالف، سام دشمن سازشی تھیوری اور ہولوکاسٹ سے انکار کی دستاویزات کا حوالہ دیا گیا ہے۔"
