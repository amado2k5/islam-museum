  ar: "صفحة «Graeco-Arabic translation movement» لدى Wikipedia (English). لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملخص بحثي قُدّم إلى المتحف ووافق المؤسس على استعماله في 21 نوفمبر 2026. يُستشهد بها في: بيت الحكمة وحركة الترجمة الإغريقية العربية في العصر العباسي."
  en: "The page \"Graeco-Arabic translation movement\" (Wikipedia (English)). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum and approved for use by the founder on 21 November 2026. Cited for: the House of Wisdom and the Graeco-Arabic translation movement of the Abbasid age."
  ur: "صفحہ «Graeco-Arabic translation movement»، Wikipedia (English)۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ عجائب گھر کو دیے گئے ایک تحقیقی خلاصے سے ہے جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ اس کے لیے دیا گیا: عباسی دور میں بیت الحکمت اور یونانی عربی ترجمہ تحریک۔"
  fr: "La page « Graeco-Arabic translation movement » (Wikipedia (English)). Le musée ne l'a pas ouverte lui-même : ce qu'on en sait vient d'une synthèse de recherche remise au musée et approuvée pour usage par le fondateur le 21 novembre 2026. Citée pour : la Maison de la sagesse et le mouvement de traduction gréco-arabe de l'époque abbasside."
  es: "La página «Graeco-Arabic translation movement» (Wikipedia (English)). El museo no la abrió por sí mismo: lo que se sabe de ella procede de un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026. Citada para: la Casa de la Sabiduría y el movimiento de traducción greco-árabe de la época abasí."
  tr: "Wikipedia'da \"Yunan-Arap çeviri hareketi\" sayfası (İngilizce). Müze bunu kendisi açmadı; içeriği, müzeye sunulan ve 21 Kasım 2026'da kurucu tarafından onaylanan bir araştırma özetinden biliniyordu. Atıf alanı: Beyt el-Hikma ve Abbasi döneminde Yunanca-Arapça çeviri hareketi."
  id: "Halaman \"Gerakan terjemahan Graeco-Arabic\" di Wikipedia (Inggris). Museum tidak membukanya sendiri; isinya diketahui dari ringkasan penelitian yang dikirim ke museum dan disetujui oleh pendiri pada 21 November 2026. Dikutip dalam: Bayt al-Hikma dan gerakan terjemahan Yunani-Arab selama era Abbasiyah."
