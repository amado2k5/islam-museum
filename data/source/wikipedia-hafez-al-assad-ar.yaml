  ar: "مقالة ويكيبيديا العربية عن حافظ الأسد؛ تُستخدم لوقائع الكيان فقط. توافق على ولادته في القرداحة في 6 أكتوبر 1930 ووفاته في 10 يونيو 2000، وتذكر ولادته لعائلة علوية فقيرة من الطائفة العلوية وتصفه بأنه أول رئيس بعثي علوي في التاريخ السوري؛ ويعطي صندوق معلوماتها دينه الإسلام عمومًا."
  en: "Arabic Wikipedia article on Hafez al-Assad; used for entity facts only. It agrees on his birth at Qardaha on 6 October 1930 and his death on 10 June 2000, records his birth to a poor Alawite family of the Alawite sect and calls him the first Alawite Ba'athist president in Syrian history; its infobox gives his religion as Islam in general."
