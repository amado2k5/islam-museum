summary:
  ar: "مقالة ويكيبيديا العربية عن حافظ الأسد؛ تُستخدم لوقائع الكيان فقط. توافق على ولادته في القرداحة في 6 أكتوبر 1930 ووفاته في 10 يونيو 2000، وتذكر ولادته لعائلة علوية فقيرة من الطائفة العلوية وتصفه بأنه أول رئيس بعثي علوي في التاريخ السوري؛ ويعطي صندوق معلوماتها دينه الإسلام عمومًا."
  en: "Arabic Wikipedia article on Hafez al-Assad; used for entity facts only. It agrees on his birth at Qardaha on 6 October 1930 and his death on 10 June 2000, records his birth to a poor Alawite family of the Alawite sect and calls him the first Alawite Ba'athist president in Syrian history; its infobox gives his religion as Islam in general."
  es: "Artículo de Wikipedia en árabe sobre Hafez al-Assad; utilizado únicamente para datos sobre la persona. Coincide en que nació en Qardaha el 6 de octubre de 1930 y falleció el 10 de junio de 2000, registra que nació en una familia alauita pobre de la secta alauita y lo denomina el primer presidente baazista alauita en la historia de Siria; su ficha informativa indica que profesaba el islam en general."
  fr: "Article de Wikipédia en arabe sur Hafez al-Assad; utilisé uniquement pour les informations sur l'entité. Il confirme sa naissance à Qardaha le 6 octobre 1930 et son décès le 10 juin 2000, indique qu'il est né dans une famille alaouite pauvre et le qualifie de premier président baasiste alaouite de l'histoire syrienne; son infobox précise qu'il était musulman."
