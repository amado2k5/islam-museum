summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن طاهر جلال الدين؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تعطي ميلاده في 8 كانون الأول 1869 في أمبيق أنغكيق بأغام في سومطرة الغربية ووفاته في 26 تشرين الأول 1956، وتحريره مجلة «الإمام» في سنغافورة (1906–1908)، ورسالتيه في علم الفلك الشرعي وابنه حمدان حاكم بينانغ، ولا تذكر معلّمًا ولا مذهبًا."
  en: "English Wikipedia article on Tahir Jalaluddin; used for entity facts only. A short stub: it gives his birth on 8 December 1869 at Ampek Angkek, Agam, West Sumatra, his death on 26 October 1956, his editorship of Al-Imam in Singapore (1906–1908), his two treatises on Islamic astronomy, and his son Hamdan, governor of Penang. It names no teacher and no school of law."
