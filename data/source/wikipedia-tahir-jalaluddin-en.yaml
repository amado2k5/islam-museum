summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن طاهر جلال الدين؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تعطي ميلاده في 8 كانون الأول 1869 في أمبيق أنغكيق بأغام في سومطرة الغربية ووفاته في 26 تشرين الأول 1956، وتحريره مجلة «الإمام» في سنغافورة (1906–1908)، ورسالتيه في علم الفلك الشرعي وابنه حمدان حاكم بينانغ، ولا تذكر معلّمًا ولا مذهبًا."
  en: "English Wikipedia article on Tahir Jalaluddin; used for entity facts only. A short stub: it gives his birth on 8 December 1869 at Ampek Angkek, Agam, West Sumatra, his death on 26 October 1956, his editorship of Al-Imam in Singapore (1906–1908), his two treatises on Islamic astronomy, and his son Hamdan, governor of Penang. It names no teacher and no school of law."
  es: "Artículo de la Wikipedia en inglés sobre Tahir Jalaluddin; utilizado únicamente para datos sobre la persona. Breve reseña: indica su nacimiento el 8 de diciembre de 1869 en Ampek Angkek, Agam, Sumatra Occidental; su fallecimiento el 26 de octubre de 1956; su cargo como editor de Al-Imam en Singapur (1906-1908); sus dos tratados sobre astronomía islámica; y su hijo Hamdan, gobernador de Penang. No menciona a ningún profesor ni escuela de derecho."
  fr: "Article Wikipédia en anglais sur Tahir Jalaluddin; utilisé uniquement pour les informations biographiques. Résumé succinct: il indique sa naissance le 8 décembre 1869 à Ampek Angkek, Agam, Sumatra occidental, son décès le 26 octobre 1956, son poste de rédacteur en chef d’Al-Imam à Singapour (1906-1908), ses deux traités d’astronomie islamique et son fils Hamdan, gouverneur de Penang. Il ne mentionne ni enseignant ni école de droit."
  ur: "طاہر جلال الدین پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر سٹب: یہ 8 دسمبر 1869 کو امپیک انگکیک، اگام، مغربی سماٹرا میں ان کی پیدائش، 26 اکتوبر 1956 کو ان کی موت، سنگاپور میں ان کی الامام کی ادارت (1906-1908)، اسلامی فلکیات پر ان کے دو مقالے، اور ان کے بیٹے حمدان، گورنر پنانگ۔ اس میں کسی استاد اور قانون کے کسی اسکول کا نام نہیں ہے۔"
  tr: "Tahir Celaleddin hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 8 Aralık 1869'da Batı Sumatra'daki Ambek Angkiq Bagam'da doğumunu ve 26 Ekim 1956'daki ölümünü anlatan kısa bir makale, Singapur'da 'Al-Imam' dergisinin editörlüğünü (1906–1908), dini astronomi üzerine tezlerini ve Penang hükümdarı oğlu Hamdan'ı anlatan kısa bir makalede herhangi bir öğretmen veya mezhepten bahsedilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Tahir Jalal al-Din; digunakan hanya untuk fakta entitas. Sebuah artikel singkat yang menyebutkan kelahirannya pada 8 Desember 1869 di Ambek Angkiq Bagam, Sumatera Barat, dan kematiannya pada 26 Oktober 1956, penyuntingannya majalah 'Al-Imam' di Singapura (1906–1908), tesisnya tentang astronomi agama, dan putranya Hamdan, penguasa Penang, tidak menyebutkan guru atau sekte manapun."
