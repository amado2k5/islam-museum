summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد بركت الله البهوبالي (1854–1927)؛ تُستخدم لوقائع الكيان فقط. تروي نشاطه الثوري من إنجلترا وأمريكا واليابان — حيث عُيّن أستاذًا للهندوستانية في جامعة طوكيو — ودوره في تأسيس حزب غدر، ورئاسته وزراء حكومة الهند المؤقتة في كابل سنة 1915، ووفاته في سان فرانسيسكو ودفنه في ساكرامنتو."
  en: "English Wikipedia article on Mohamed Barakatullah Bhopali (1854–1927); used for entity facts only. It recounts his revolutionary work from England, America and Japan — where he was appointed Professor of Hindustani at the University of Tokyo — his part in founding the Ghadar Party, his premiership of the Provisional Government of India at Kabul in 1915, and his death in San Francisco and burial at Sacramento."
