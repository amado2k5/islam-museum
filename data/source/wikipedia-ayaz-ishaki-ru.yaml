summary:
  ar: "مقالة ويكيبيديا الروسية عن غاياز إسحاقي؛ تُستخدم لوقائع الكيان فقط. تعطي أصله من قرية ياوشيرما ⁦(كوتلوشكينو اليوم)⁩ من التتار الميشار، ودراسته في مدارس تشيستوبول وقازان الشرعية، ونشاطه في مؤتمرات 1917 وإدارة إيدل أورال الوطنية، وهجرته وتنظيمه تتار المهجر ومجلة «مللي يول» في برلين، ووفاته في أنقرة ودفنه في مقبرة أدرنة قابي بإسطنبول؛ ولا تسمي له دينا ولا مذهبا."
  en: "Russian Wikipedia article on Gayaz Iskhaki; used for entity facts only. It gives his origin in the village of Yaushirma (now Kutlushkino), of Mishar Tatar stock, his madrasa schooling at Chistopol and Kazan, his work in the congresses of 1917 and the Idel-Ural national administration, his emigration, his organisation of the Tatar diaspora and the Berlin journal Milli Yul, and his death at Ankara and burial in the Edirnekapı cemetery in Istanbul; it names no religion or school for him."
  es: "Artículo de la Wikipedia rusa sobre Gayaz Iskhaki; utilizado únicamente para datos sobre la persona. Describe su origen en el pueblo de Yaushirma (actualmente Kutlushkino), su ascendencia tártara de Mishar, su educación en madrasas en Chistopol y Kazán, su trabajo en los congresos de 1917 y en la administración nacional de Idel-Ural, su emigración, su organización de la diáspora tártara y la revista berlinesa Milli Yul, y su muerte en Ankara y su entierro en el cementerio de Edirnekapı en Estambul; no menciona ninguna religión ni escuela a la que perteneciera."
  fr: "L'article de Wikipédia en russe consacré à Gayaz Iskhaki, utilisé uniquement à titre informatif, mentionne ses origines dans le village de Yaushirma (aujourd'hui Kutlushkino), son appartenance à la communauté tatare Mishar, sa scolarité dans les madrasas de Tchistopol et de Kazan, son rôle aux congrès de 1917 et au sein de l'administration nationale de l'Idel-Oural, son émigration, son organisation de la diaspora tatare et la création du journal berlinois Milli Yul, ainsi que sa mort à Ankara et son inhumation au cimetière d'Edirnekapı à Istanbul. L'article ne précise ni sa religion ni son école."
  ur: "گیاز اسخاکی پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ مشار تاتار اسٹاک کے گاؤں یوشیرما ⁦(اب کٹلوشکینو)⁩ میں اس کی اصلیت، چسٹوپول اور کازان میں اس کی مدرسہ کی تعلیم، 1917 کی کانگریسوں میں اس کا کام اور آئیڈیل-یورال قومی انتظامیہ، اس کی ہجرت، تاتار تارکین وطن کی اس کی تنظیم اور برلن کے جریدے ملی یول میں ان کی موت اور ایڈیبرنی میں ان کی موت کا ذکر کرتا ہے۔ استنبول میں قبرستان؛ اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
  tr: "Gayaz Ishaqi hakkında Rusça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Aslen Mishar Tatarlarının Yavshirma köyünden (bugünkü Kotlushkino) gelmektedir, Çistopol ve Kazan hukuk okullarında eğitim görmüş, 1917 konferanslarında ve Idle Ural Milli İdaresi'nde aktifti, göç etmiş ve Berlin'de Tatar diasporasını ve \"Melli Yul\" dergisini organize etmiştir, Ankara'da ölmüş ve İstanbul'daki Edirnekapi Mezarlığı'na defnedilmiştir; kendisine hiçbir din veya mezhep verilmemiştir."
  id: "Artikel Wikipedia Rusia tentang Gayaz Ishaqi; digunakan hanya untuk fakta entitas. Ia berasal dari desa Yavshirma (sekarang Kotlushkino) dari Mishar Tatar, belajar di sekolah hukum Chistopol dan Kazan, aktif dalam konferensi tahun 1917 dan Administrasi Nasional Ural yang Idle, bermigrasi dan mengorganisir diaspora Tatar serta majalah \"Melli Yul\" di Berlin, meninggal di Ankara, dan dimakamkan di Pemakaman Edirnekapi di Istanbul; tidak ada agama atau sekte yang diberikan kepadanya."
