summary:
  ar: "مقالة ويكيبيديا الروسية عن غاياز إسحاقي؛ تُستخدم لوقائع الكيان فقط. تعطي أصله من قرية ياوشيرما (كوتلوشكينو اليوم) من التتار الميشار، ودراسته في مدارس تشيستوبول وقازان الشرعية، ونشاطه في مؤتمرات 1917 وإدارة إيدل أورال الوطنية، وهجرته وتنظيمه تتار المهجر ومجلة «مللي يول» في برلين، ووفاته في أنقرة ودفنه في مقبرة أدرنة قابي بإسطنبول؛ ولا تسمي له دينا ولا مذهبا."
  en: "Russian Wikipedia article on Gayaz Iskhaki; used for entity facts only. It gives his origin in the village of Yaushirma (now Kutlushkino), of Mishar Tatar stock, his madrasa schooling at Chistopol and Kazan, his work in the congresses of 1917 and the Idel-Ural national administration, his emigration, his organisation of the Tatar diaspora and the Berlin journal Milli Yul, and his death at Ankara and burial in the Edirnekapı cemetery in Istanbul; it names no religion or school for him."
