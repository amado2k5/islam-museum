reliability_note: "A court judgment, a primary legal record, consulted on 26 October 2026; it carries no web revision identifier, so the judgment date is its issued date. Its text names 'justice Syed Karamat Hussain, a retired Judge of the Allahabad High Court' among the founders of the Anjuman Talim-ul-Muslimat-e-Hind formed on 27 April 1912, and states of the waqf deeds: 'Justice Karamat Husain as well as Raja of Mahmoodabad, no doubt belonged to Shia community but in the waqf deeds it is nowhere specifically mentioned that the benefit of the waqf would only flow to Shia women.' It records his waqf deed of 6 August 1908 and a later waqf for the school's support, with scholarships for Muslim girls and preference to girls of his own family and to Syed girls. This is one source: the same judgment text is mirrored on several legal websites, and mirrored copies count once."
