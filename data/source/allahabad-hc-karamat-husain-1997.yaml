summary:
  ar: "حكم المحكمة العليا في ألاهاباد ⁦(11 ديسمبر 1997)⁩ في قضية لجنة إدارة كلية كرامت حسين الإسلامية للبنات ضد المجلس المركزي الشيعي للأوقاف؛ يُستخدم لوقائع الكيان فقط. يثبت أن القاضي سيد كرامت حسين كان قاضيًا متقاعدًا في المحكمة العليا بألاهاباد، ومن مؤسسي جمعية تعليم المسلمات سنة 1912، ويذكر نصًّا أنه «كان ينتمي إلى الطائفة الشيعية»، ويناقش وقفيّتيه المؤرختين في 6 أغسطس 1908 وسنة 1912."
  en: "Allahabad High Court judgment of 11 December 1997 in Managing Committee, Karamat Husain Muslim Girls Degree College v. Shia Central Board of Waqfs; used for entity facts only. It records Justice Syed Karamat Hussain as a retired judge of the Allahabad High Court and a founder of the 1912 Anjuman Talim-ul-Muslimat-e-Hind, states in its text that he 'belonged to Shia community', and discusses his waqf deeds of 6 August 1908 and 1912."
  es: "Sentencia del Tribunal Superior de Allahabad del 11 de diciembre de 1997 en el caso Managing Committee, Karamat Husain Muslim Girls Degree College v. Shia Central Board of Waqfs; utilizada únicamente para datos sobre la entidad. En ella se menciona al juez Syed Karamat Hussain como juez jubilado del Tribunal Superior de Allahabad y fundador de la Anjuman Talim-ul-Muslimat-e-Hind de 1912, se indica en su texto que \"pertenecía a la comunidad chiíta\" y se analizan sus actos de waqf del 6 de agosto de 1908 y 1912."
  fr: "L'arrêt de la Haute Cour d'Allahabad du 11 décembre 1997, rendu dans l'affaire Managing Committee, Karamat Husain Muslim Girls Degree College c. Shia Central Board of Waqfs, est utilisé uniquement pour les faits relatifs à l'entité. Il mentionne le juge Syed Karamat Hussain comme juge retraité de la Haute Cour d'Allahabad et fondateur de l'Anjuman Talim-ul-Muslimat-e-Hind de 1912, précise qu'il « appartenait à la communauté chiite » et évoque ses actes de waqf des 6 août 1908 et 1912."
  ur: "الہ آباد ہائی کورٹ کا 11 دسمبر 1997 کا فیصلہ منیجنگ کمیٹی، کرامت حسین مسلم گرلز ڈگری کالج بمقابلہ شیعہ سنٹرل بورڈ آف وقف؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں جسٹس سید کرامت حسین کو الہ آباد ہائی کورٹ کے ریٹائرڈ جج اور 1912 کی انجمن تعلیم المسلمات ہند کے بانی کے طور پر درج کیا گیا ہے، اس کے متن میں کہا گیا ہے کہ وہ 'شیعہ برادری سے تعلق رکھتے تھے'، اور 6 اگست 1908 اور 1912 کے ان کے وقف کاموں پر بحث کرتے ہیں۔"
  tr: "Allahabad'da Yüksek Mahkeme'nin (11 Aralık 1997) Karamat Hussain İslam Koleji Kızlar Yönetim Komitesi ile Merkezi Şii Vakıf Konseyi arasındaki davasında verdiği karar; yalnızca kurumun olguları için kullanılmıştır. Yargıç Syed Karamat Hussain'in Allahabad Yüksek Mahkemesi'nden emekli bir yargıç ve 1912'de Müslüman Kadınlar Eğitim Derneği'nin kurucularından biri olduğu tespit edilmiştir. Bir metinde \"Şii mezhebine mensup olduğu\" belirtilmekte ve 6 Ağustos 1908 ile 1912 tarihli iki vakıf tartışılmıştır."
  id: "Putusan Mahkamah Agung di Allahabad (11 Desember 1997) dalam kasus Komite Manajemen Karamat Hussain Islamic College for Girls vs. Central Shia Council for Endowments; hanya digunakan untuk fakta entitas. Diketahui bahwa Hakim Syed Karamat Hussain adalah hakim pensiunan Mahkamah Agung di Allahabad dan salah satu pendiri Muslim Women's Education Association pada tahun 1912. Dalam sebuah teks disebutkan bahwa \"dia berasal dari sekte Syiah,\" dan membahas dua wakaf tertanggal 6 Agustus 1908 dan 1912."
title: "Managing Committee, Karamat Husain Muslim Girls Degree College v. Shia Central Board of Waqfs and Another"
