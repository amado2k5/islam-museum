summary:
  ar: "حكم المحكمة العليا في ألاهاباد (11 ديسمبر 1997) في قضية لجنة إدارة كلية كرامت حسين الإسلامية للبنات ضد المجلس المركزي الشيعي للأوقاف؛ يُستخدم لوقائع الكيان فقط. يثبت أن القاضي سيد كرامت حسين كان قاضيًا متقاعدًا في المحكمة العليا بألاهاباد، ومن مؤسسي جمعية تعليم المسلمات سنة 1912، ويذكر نصًّا أنه «كان ينتمي إلى الطائفة الشيعية»، ويناقش وقفيّتيه المؤرختين في 6 أغسطس 1908 وسنة 1912."
  en: "Allahabad High Court judgment of 11 December 1997 in Managing Committee, Karamat Husain Muslim Girls Degree College v. Shia Central Board of Waqfs; used for entity facts only. It records Justice Syed Karamat Hussain as a retired judge of the Allahabad High Court and a founder of the 1912 Anjuman Talim-ul-Muslimat-e-Hind, states in its text that he 'belonged to Shia community', and discusses his waqf deeds of 6 August 1908 and 1912."
title: "Managing Committee, Karamat Husain Muslim Girls Degree College v. Shia Central Board of Waqfs and Another"
