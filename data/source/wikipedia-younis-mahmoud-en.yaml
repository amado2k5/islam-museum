reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id. It gives his name as Younis Mahmoud Khalaf, born 3 February 1983 in Dibis, Kirkuk Governorate, citing the FIFA profile for the date; a club career with Kirkuk, Al-Talaba, Al-Wahda, Al-Khor, Al-Gharafa, Al-Wakrah, Al-Sadd, Al-Ahli, Erbil and Al-Talaba again; an Iraq debut in 2002, the winning goal in the 2007 AFC Asian Cup final as captain, and the tournament’s most valuable player award. Its personal-life section opens “Younis Mahmoud is an Arab Sunni Muslim”, citing two independent reports of the 2007 triumph: the Washington Post (30 July 2007), whose text reads “Mahmoud, a Sunni Turkmen, scored the winning goal”, and Al Jazeera English (2007), whose text reads that the team “was captained by a Sunni Turkman from Kirkuk — Younis Mahmoud”. Both quotations were verified directly in the archived articles on 26 October 2026; note that both sources call him a Turkmen, where the article text says Arab. Its categories file him under “Iraqi Sunni Muslims”, a filing."
