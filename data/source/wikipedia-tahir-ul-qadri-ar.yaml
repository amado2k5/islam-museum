summary:
  ar: مقالة ويكيبيديا العربية عن محمد طاهر القادري؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في جهنغ في 19 فبراير 1951 وتأسيسه منهاج القرآن الدولية وجامعة المنهاج في لاهور والحركة الشعبية الباكستانية.
  en: Arabic Wikipedia article on Muhammad Tahir-ul-Qadri; used for entity facts only. It gives his birth in Jhang on 19 February 1951 and his founding of Minhaj-ul-Quran International, Minhaj University Lahore and the Pakistan Awami Tehreek.
  es: "Artículo de Wikipedia en árabe sobre Muhammad Tahir-ul-Qadri; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Jhang el 19 de febrero de 1951 y la fundación de Minhaj-ul-Quran International, la Universidad Minhaj de Lahore y el Pakistan Awami Tehreek."
  fr: "Article de Wikipédia en arabe sur Muhammad Tahir-ul-Qadri; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance à Jhang le 19 février 1951 et la fondation de Minhaj-ul-Quran International, de l’université Minhaj de Lahore et du Pakistan Awami Tehreek."
  ur: "محمد طاہر القادری پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 19 فروری 1951 کو جھنگ میں ان کی پیدائش اور منہاج القرآن انٹرنیشنل، منہاج یونیورسٹی لاہور اور پاکستان عوامی تحریک کے بانی ہیں۔"
  tr: "Muhammed Tahir El-Qadri hakkında Arapça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmaktadır. 19 Şubat 1951'de Jhang'da doğdu ve Minhaj Al-Quran International, Lahor'daki Al-Minhaj Üniversitesi ve Pakistan Halk Hareketi'ni kurdu."
  id: "Artikel Wikipedia berbahasa Arab tentang Muhammad Tahir Al-Qadri hanya digunakan untuk fakta entitas tersebut. Ia lahir di Jhang pada 19 Februari 1951, dan mendirikan Minhaj Al-Quran International, Universitas Al-Minhaj di Lahore, serta Gerakan Rakyat Pakistan."
