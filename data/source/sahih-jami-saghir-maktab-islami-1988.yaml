summary:
  ar: "الطبعة المجددة والمزيدة والمنقحة من «صحيح الجامع الصغير وزيادته» للألباني، في المكتب الإسلامي، الطبعة الثالثة 1408هـ/1988م؛ فيها مقدمة الناشر زهير الشاويش المؤرخة في غرة رمضان 1405هـ، ثم مقدمة الألباني، ثم مقدمة النبهاني لـ«الفتح الكبير» مع تعليقات الألباني."
  en: "The renewed, enlarged and revised edition of al-Albani's Sahih al-Jami' al-Saghir wa-Ziyadatuh, al-Maktab al-Islami, 3rd ed. 1408 AH/1988 CE; it contains the publisher Zuhayr al-Shawish's preface dated 1 Ramadan 1405 AH, al-Albani's introduction, and al-Nabhani's preface to al-Fath al-Kabir with al-Albani's notes."
