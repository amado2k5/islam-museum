summary:
  ar: "مقالة ويكيبيديا العربية عن سعود بن عبد العزيز آل سعود؛ تُستخدم لوقائع الكيان فقط. تقرن ولادته بـ3 شوال 1319هـ ⁦(15 يناير 1902)⁩ في الكويت، وتروي تعليمه القرآني في طفولته وإصلاحاته وليًا للعهد وحكمه وتوسعة الحرمين وخلعه سنة 1964 بالتفصيل؛ ولا يذكر متنها له مذهبًا."
  en: "Arabic Wikipedia article on Saud bin Abdulaziz Al Saud; used for entity facts only. It pairs his birth with 3 Shawwal 1319 AH (15 January 1902) at Kuwait, recounts his Qur'anic schooling in childhood, his crown-prince reforms, his reign, the expansion of the two holy mosques and the 1964 deposition in detail; its text names no madhhab for him."
  es: "Artículo en árabe de la Wikipedia sobre Saud bin Abdulaziz Al Saud; se utiliza únicamente para datos sobre la persona. En él se indica su nacimiento el 3 de Shawwal de 1319 AH (15 de enero de 1902) en Kuwait, y se relata con detalle su educación coránica en la infancia, sus reformas como príncipe heredero, su reinado, la ampliación de las dos mezquitas sagradas y su deposición en 1964; el texto no menciona ninguna escuela jurídica (madhhab) relacionada con él."
  fr: "Article de Wikipédia en arabe sur Saoud ben Abdelaziz Al Saoud; utilisé uniquement pour les informations sur l'entité. Il situe sa naissance au Koweït le 3 Shawwal 1319 AH (15 janvier 1902), relate en détail son éducation coranique durant son enfance, ses réformes en tant que prince héritier, son règne, l'agrandissement des deux mosquées sacrées et sa destitution en 1964; le texte ne mentionne aucune école de pensée (madhhab) à son sujet."
  ur: "سعود بن عبدالعزیز آل سعود پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 3 شوال 1319 ہجری ⁦(15 جنوری 1902)⁩ کویت میں ہوتی ہے، اس کی بچپن میں قرآنی تعلیم، اس کے ولی عہد شہزادے کی اصلاحات، ان کے دور حکومت، دو مقدس مساجد کی توسیع اور 1964 کے بیان کا تفصیل سے ذکر کیا گیا ہے۔ اس کے متن کا نام اس کے لیے کوئی مذہب نہیں ہے۔"
