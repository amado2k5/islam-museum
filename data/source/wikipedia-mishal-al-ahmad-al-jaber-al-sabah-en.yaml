summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مشعل الأحمد الجابر الصباح؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في مدينة الكويت في 27 سبتمبر 1940، أخًا غير شقيق لثلاثة أمراء ⁦(جابر وصباح ونواف)⁩، وتخرج في كلية هيندون للشرطة سنة 1960، ورأس جهاز مباحث أمن الدولة 1967–1980، وكان النائب الفعلي لرئيس الحرس الوطني من 2004، ووليًا للعهد من 2020 — وكان آنذاك أكبر ولي عهد في العالم — ثم أمير الكويت من 16 ديسمبر 2023؛ وفي 2024 حلّ مجلس الأمة مرتين وعلّق بعض مواد الدستور وعيّن صباح الخالد وليًا للعهد. ويقرأ حقل الدين في صندوق معلوماتها «إسلام سني»، وهي قيمة بنيوية."
  en: "English Wikipedia article on Mishal Al-Ahmad Al-Jaber Al-Sabah; used for entity facts only. It gives him as born at Kuwait City on 27 September 1940, the paternal half-brother of three emirs (Jaber, Sabah and Nawaf), a 1960 graduate of Hendon Police College who headed the state security service 1967–1980 and was de facto deputy chief of the National Guard from 2004, crown prince from 2020 — then the oldest crown prince in the world — and Emir of Kuwait from 16 December 2023; in 2024 he twice dissolved the National Assembly, suspended selected constitutional articles and appointed Sabah Al-Khalid crown prince. Its infobox religion field reads 'Sunni Islam' (linking the article on Sunni Islam in Kuwait) — a structured value, not a statement in its text."
  es: "Artículo de la Wikipedia en inglés sobre Mishal Al-Ahmad Al-Jaber Al-Sabah; utilizado solo para datos de la entidad. Lo describe como nacido en la ciudad de Kuwait el 27 de septiembre de 1940, medio hermano paterno de tres emires (Jaber, Sabah y Nawaf), graduado en 1960 de la Academia de Policía de Hendon, quien dirigió el servicio de seguridad del estado entre 1967 y 1980 y fue subjefe de facto de la Guardia Nacional desde 2004, príncipe heredero desde 2020 —entonces el príncipe heredero de mayor edad del mundo— y emir de Kuwait desde el 16 de diciembre de 2023; en 2024 disolvió dos veces la Asamblea Nacional, suspendió artículos constitucionales específicos y nombró a Sabah Al-Khalid príncipe heredero. Su campo de religión en el cuadro de información dice \"Islam sunita\" (enlace al artículo sobre el islam sunita en Kuwait) — un valor estructurado, no una declaración en su texto."
  fr: "L'article de Wikipédia en anglais consacré à Mishal Al-Ahmad Al-Jaber Al-Sabah, utilisé uniquement pour les informations le concernant, indique qu'il est né à Koweït City le 27 septembre 1940, demi-frère paternel de trois émirs (Jaber, Sabah et Nawaf), diplômé de l'école de police de Hendon en 1960, qu'il a dirigé les services de sécurité de l'État de 1967 à 1980 et qu'il a été de facto chef adjoint de la Garde nationale à partir de 2004. Prince héritier à partir de 2020 – il était alors le prince héritier le plus âgé au monde – il est devenu émir du Koweït le 16 décembre 2023. En 2024, il a dissous l'Assemblée nationale à deux reprises, suspendu certains articles de la Constitution et nommé Sabah Al-Khalid prince héritier. Le champ « Religion » de son infobox indique « Islam sunnite » (avec un lien vers l'article sur l'islam sunnite au Koweït) – une valeur structurée, et non une affirmation dans le texte."
  ur: "مشال الاحمد الجابر الصباح پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس سے وہ 27 ستمبر 1940 کو کویت سٹی میں پیدا ہوئے، تین امیروں ⁦(جابر، صباح اور نواف)⁩ کے سوتیلے بھائی، ہینڈن پولیس کالج کے 1960 کے فارغ التحصیل تھے جنہوں نے 1967-1980 میں ریاستی سیکیورٹی سروس کے سربراہ تھے اور 4020 سے نیشنل گارڈ کے ڈی فیکٹو ڈپٹی چیف تھے۔ دنیا کے معمر ترین ولی عہد — اور 16 دسمبر 2023 سے کویت کے امیر؛ 2024 میں اس نے دو بار قومی اسمبلی کو تحلیل کیا، منتخب آئینی آرٹیکلز کو معطل کیا اور صباح الخالد کو ولی عہد مقرر کیا۔ اس کا انفو باکس مذہب کا فیلڈ 'سنی اسلام' پڑھتا ہے ⁦(کویت میں سنی اسلام پر مضمون کو جوڑتا ہے)⁩ - ایک ساختی قدر، اس کے متن میں کوئی بیان نہیں۔"
  tr: "Mishaal Al-Ahmad Al-Jaber Al-Sabah hakkında İngilizce Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. 27 Eylül 1940'ta Kuveyt Şehri'nde doğduğu, üç prensin (Jaber, Sabah ve Nawaf) üvey kardeşi olduğu, 1960'ta Hindon Polis Koleji'nden mezun olduğu, 1967-1980 yılları arasında Devlet Güvenlik Soruşturma Servisi'nin başında olduğu, 2004'ten itibaren fiilen Ulusal Muhafız başkan yardımcısı, 2020'den itibaren veliaht prens — o dönemde dünyanın en yaşlı veliaht prensi — ardından 16 Aralık 2023'ten itibaren Kuveyt Emiri olduğu belirtilmiştir; ve 2024'te Ulusal Meclis'i iki kez feshetti, bazı anayasa maddelerini askıya aldı ve Sabah Al-Khalid'i veliaht prens olarak atadı. Haql al-Din, bilgi kutusunda \"Sünni İslam\" adlı yapısal bir değer okuyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Mishaal Al-Ahmad Al-Jaber Al-Sabah; digunakan hanya untuk fakta entitas. Dicatat bahwa ia lahir di Kuwait City pada 27 September 1940, saudara tiri dari tiga pangeran (Jaber, Sabah, dan Nawaf), lulus dari Fakultas Kepolisian Hindon pada tahun 1960, memimpin Dinas Investigasi Keamanan Negara dari 1967 hingga 1980, menjadi wakil kepala Garda Nasional secara de facto sejak 2004, putra mahkota sejak 2020 — saat itu putra mahkota tertua di dunia — lalu Emir Kuwait sejak 16 Desember 2023; dan pada tahun 2024, ia membubarkan Majelis Nasional dua kali, menangguhkan beberapa pasal konstitusi, dan mengangkat Sabah Al-Khalid sebagai putra mahkota. Haql al-Din membaca di kotak info-nya \"Islam Sunni,\" sebuah nilai struktural."
