summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مشعل الأحمد الجابر الصباح؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في مدينة الكويت في 27 سبتمبر 1940، أخًا غير شقيق لثلاثة أمراء (جابر وصباح ونواف)، وتخرج في كلية هيندون للشرطة سنة 1960، ورأس جهاز مباحث أمن الدولة 1967–1980، وكان النائب الفعلي لرئيس الحرس الوطني من 2004، ووليًا للعهد من 2020 — وكان آنذاك أكبر ولي عهد في العالم — ثم أمير الكويت من 16 ديسمبر 2023؛ وفي 2024 حلّ مجلس الأمة مرتين وعلّق بعض مواد الدستور وعيّن صباح الخالد وليًا للعهد. ويقرأ حقل الدين في صندوق معلوماتها «إسلام سني»، وهي قيمة بنيوية."
  en: "English Wikipedia article on Mishal Al-Ahmad Al-Jaber Al-Sabah; used for entity facts only. It gives him as born at Kuwait City on 27 September 1940, the paternal half-brother of three emirs (Jaber, Sabah and Nawaf), a 1960 graduate of Hendon Police College who headed the state security service 1967–1980 and was de facto deputy chief of the National Guard from 2004, crown prince from 2020 — then the oldest crown prince in the world — and Emir of Kuwait from 16 December 2023; in 2024 he twice dissolved the National Assembly, suspended selected constitutional articles and appointed Sabah Al-Khalid crown prince. Its infobox religion field reads 'Sunni Islam' (linking the article on Sunni Islam in Kuwait) — a structured value, not a statement in its text."
