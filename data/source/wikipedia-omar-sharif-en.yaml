  ar: "مقالة ويكيبيديا الإنجليزية عن عمر الشريف ⁦(10 نيسان 1932 – 10 تموز 2015)⁩، المولود ميشيل يوسف ديمتري شلهوب في أسرة كاثوليكية ملكية سورية لبنانية الأصل؛ تعرض إسلامه وتغيير اسمه سنة 1955 ليتزوج فاتن حمامة، ومسيرته من «لورنس العرب» و«دكتور جيفاغو» إلى وفاته في القاهرة، ومواقفه الدينية المتأخرة في مقابلات 2004 و2010."
  en: "English Wikipedia article on Omar Sharif (10 April 1932 – 10 July 2015), born Michel Yusef Dimitri Chalhoub into a Melkite Greek Catholic family of Syro-Lebanese descent; it covers his conversion to Islam and legal name change in 1955 in order to marry Faten Hamama, his career from Lawrence of Arabia and Doctor Zhivago to his death in Cairo, and his later-life religious statements in interviews of 2004 and 2010."
