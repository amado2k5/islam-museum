summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمر الشريف ⁦(10 نيسان 1932 – 10 تموز 2015)⁩، المولود ميشيل يوسف ديمتري شلهوب في أسرة كاثوليكية ملكية سورية لبنانية الأصل؛ تعرض إسلامه وتغيير اسمه سنة 1955 ليتزوج فاتن حمامة، ومسيرته من «لورنس العرب» و«دكتور جيفاغو» إلى وفاته في القاهرة، ومواقفه الدينية المتأخرة في مقابلات 2004 و2010."
  en: "English Wikipedia article on Omar Sharif (10 April 1932 – 10 July 2015), born Michel Yusef Dimitri Chalhoub into a Melkite Greek Catholic family of Syro-Lebanese descent; it covers his conversion to Islam and legal name change in 1955 in order to marry Faten Hamama, his career from Lawrence of Arabia and Doctor Zhivago to his death in Cairo, and his later-life religious statements in interviews of 2004 and 2010."
  es: "Artículo de la Wikipedia en inglés sobre Omar Sharif (10 de abril de 1932 - 10 de julio de 2015), nacido Michel Yusef Dimitri Chalhoub en una familia greco-católica melquita de ascendencia sirio-libanesa; abarca su conversión al Islam y el cambio legal de nombre en 1955 para casarse con Faten Hamama, su carrera desde Lawrence de Arabia y Doctor Zhivago hasta su muerte en El Cairo, y sus declaraciones religiosas posteriores en entrevistas de 2004 y 2010."
  fr: "Article de Wikipédia en anglais sur Omar Sharif (10 avril 1932 – 10 juillet 2015), né Michel Yusef Dimitri Chalhoub dans une famille melkite grecque catholique d'origine syro-libanaise; il couvre sa conversion à l'islam et son changement légal de nom en 1955 afin d'épouser Faten Hamama, sa carrière de Lawrence d'Arabie et Docteur Jivago jusqu'à sa mort au Caire, et ses déclarations religieuses de fin de vie dans des interviews de 2004 et 2010."
  ur: "عمر شریف پر انگریزی ویکیپیڈیا کا مضمون ⁦(10 اپریل 1932 - 10 جولائی 2015)⁩، مشیل یوسف دیمتری چلہوب کی پیدائش سائرو-لبنانی نسل کے میلکائٹ یونانی کیتھولک خاندان میں ہوئی۔ اس میں 1955 میں فاتن حمامہ سے شادی کرنے کے لیے ان کی اسلام قبول کرنے اور قانونی نام کی تبدیلی، لارنس آف عربیہ اور ڈاکٹر زیواگو سے قاہرہ میں ان کی موت تک ان کا کیریئر اور 2004 اور 2010 کے انٹرویوز میں ان کے بعد کی زندگی کے مذہبی بیانات شامل ہیں۔"
