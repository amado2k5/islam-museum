reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 24 October 2026. The article is short — a lead, a works line and an infobox, citing a Pakistani madrasa-web profile and Darul Uloom Deoband's own Arabic page — and its biographical detail is thin; the fuller narrative is taken from the English and Urdu articles. What this article independently supplies is its infobox attestation, edited separately from the English and Urdu editions: denomination Ahl al-Sunna wa'l-Jama'a (Sunni), jurisprudence Hanafi, creed Maturidi — and its pairing of his life dates as 1268–1339 AH / 1851–1920 CE. It also records his birth at Bareilly, his father the litterateur Zulfiqar Ali Deobandi, his struggle against the British, his arrest and exile to Malta, and his Urdu translation of the meanings of the Qur'an."
