  ar: "مقالة ويكيبيديا الإنجليزية عن علي يوسف كيناديد، ثاني سلاطين هوبيو (حكم من 28 سبتمبر 1911 إلى 1925)، ابن مؤسس السلطنة يوسف علي كيناديد وأخي عثمان يوسف كيناديد مخترع الخط العثماني؛ يذكر متنها أنه توفي سنة 1927 بينما يذكر صندوق معلوماتها أنه توفي سنة 1936 في مقديشو، ويذكر صندوقها أن دينه الإسلام."
  en: "English Wikipedia article on Ali Yusuf Kenadid, second Sultan of Hobyo (reigned 28 September 1911 – 1925), son of the sultanate's founder Yusuf Ali Kenadid and brother of Osman Yusuf Kenadid, inventor of the Osmanya script; its lead states that he died in 1927 while its infobox, citing a page on his tomb, gives his death as 1936 at Mogadishu, and its infobox gives his religion as Islam."
