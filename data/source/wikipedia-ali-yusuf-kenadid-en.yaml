summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي يوسف كيناديد، ثاني سلاطين هوبيو ⁦(حكم من 28 سبتمبر 1911 إلى 1925)⁩، ابن مؤسس السلطنة يوسف علي كيناديد وأخي عثمان يوسف كيناديد مخترع الخط العثماني؛ يذكر متنها أنه توفي سنة 1927 بينما يذكر صندوق معلوماتها أنه توفي سنة 1936 في مقديشو، ويذكر صندوقها أن دينه الإسلام."
  en: "English Wikipedia article on Ali Yusuf Kenadid, second Sultan of Hobyo (reigned 28 September 1911 – 1925), son of the sultanate's founder Yusuf Ali Kenadid and brother of Osman Yusuf Kenadid, inventor of the Osmanya script; its lead states that he died in 1927 while its infobox, citing a page on his tomb, gives his death as 1936 at Mogadishu, and its infobox gives his religion as Islam."
  es: "Artículo de la Wikipedia en inglés sobre Ali Yusuf Kenadid, segundo sultán de Hobyo (reinó del 28 de septiembre de 1911 a 1925), hijo del fundador del sultanato, Yusuf Ali Kenadid, y hermano de Osman Yusuf Kenadid, inventor de la escritura otomana; su introducción afirma que murió en 1927, mientras que su ficha informativa, citando una página sobre su tumba, indica que murió en 1936 en Mogadiscio, y su ficha informativa indica que su religión era el Islam."
  fr: "L'article de Wikipédia en anglais sur Ali Yusuf Kenadid, deuxième sultan de Hobyo (règne du 28 septembre 1911 à 1925), fils du fondateur du sultanat Yusuf Ali Kenadid et frère d'Osman Yusuf Kenadid, inventeur de l'écriture Osmanya; son introduction indique qu'il est mort en 1927 tandis que son infobox, citant une page sur sa tombe, donne sa mort en 1936 à Mogadiscio, et son infobox indique que sa religion est l'islam."
