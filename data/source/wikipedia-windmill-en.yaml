summary:
  ar: "مقالتا ويكيبيديا الإنجليزية عن الطاحونة الهوائية والباني مون؛ لوقائع الكيان فقط: وضوح أدلة المحور القائم في سجستان القرن التاسع ⁦(الحسن وهيل؛ لوهرمان)⁩، أول ذكر أوروبي ⁦(ويدلي 1185)⁩، وصفة الباني مون الجداري وأشرعة القماش، بقاء أسباد نشتیفان، وتسجيل روداد أبي لؤلؤة كرواية لاحقة مشكوك فيها."
  en: "English Wikipedia articles Windmill and Panemone windmill; entity facts only: the clear ninth-century evidence for vertical-axle mills in Sistan (citing Hassan & Hill and Lohrmann), the first certain European record (Weedley 1185), the walled panemone with cloth sails, the surviving asbads of Nashtifan, and the Abu Lu'lu'a story recorded as a possibly later account."
  es: "Artículos de la Wikipedia en inglés Molino de viento y molino de viento Panemone; solo datos sobre la entidad: la clara evidencia del siglo IX de molinos de eje vertical en Sistan (citando a Hassan & Hill y Lohrmann), el primer registro europeo cierto (Weedley 1185), el panemone amurallado con aspas de tela, los asbads supervivientes de Nashtifan y la historia de Abu Lu'lu'a registrada como un relato posiblemente posterior."
  fr: "Articles de Wikipédia en anglais sur les moulins à vent et les moulins à vent Panemone; faits concernant l’entité uniquement: la preuve claire au IXe siècle de l’existence de moulins à essieu vertical au Sistan (citant Hassan & Hill et Lohrmann), le premier témoignage européen certain (Weedley 1185), le panemone muré avec des voiles en tissu, les asbads survivants de Nashtifan et l’histoire d’Abu Lu’lu’a enregistrée comme un récit possiblement plus tardif."
  ur: "انگریزی ویکیپیڈیا کے مضامین Windmill and Panemone windmill; صرف ہستی کے حقائق: سیستان میں عمودی ایکسل ملز کے لیے نویں صدی کے واضح ثبوت ⁦(حسن اور ہل اور لوہرمن کا حوالہ دیتے ہوئے)⁩، پہلا مخصوص یورپی ریکارڈ ⁦(ویڈلی 1185)⁩، کپڑوں کے جہازوں کے ساتھ دیواروں والا پینیمون، ناشتیفان کے زندہ بچ جانے والے اسباد، اور ابو للوعہ کی کہانی جو بعد میں ریکارڈ کی گئی۔"
