  ar: "مقالة ويكيبيديا الإنجليزية عن فياض خان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه مغنٍّ كلاسيكي هندي من غرانة آغرة، وُلد في 8 شباط 1886 في سكندرا قرب آغرة وتوفي في 5 تشرين الثاني 1950 في بارودا، عُرف بلقب «آفتاب موسيقي»، وكان موسيقي بلاط بارودا، ولحّن باسم «بريم بيا». لا تذكر دينه في أي موضع."
  en: "English Wikipedia article on Faiyaz Khan; used for entity facts only. It gives him as an Indian classical vocalist of the Agra gharana, born 8 February 1886 at Sikandara near Agra and died 5 November 1950 at Baroda, known as Aftab-e-Mausiqi, court musician of Baroda, composing under the pen name Prem Piya. It names no religion anywhere."
