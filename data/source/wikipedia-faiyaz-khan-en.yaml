summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فياض خان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه مغنٍّ كلاسيكي هندي من غرانة آغرة، وُلد في 8 شباط 1886 في سكندرا قرب آغرة وتوفي في 5 تشرين الثاني 1950 في بارودا، عُرف بلقب «آفتاب موسيقي»، وكان موسيقي بلاط بارودا، ولحّن باسم «بريم بيا». لا تذكر دينه في أي موضع."
  en: "English Wikipedia article on Faiyaz Khan; used for entity facts only. It gives him as an Indian classical vocalist of the Agra gharana, born 8 February 1886 at Sikandara near Agra and died 5 November 1950 at Baroda, known as Aftab-e-Mausiqi, court musician of Baroda, composing under the pen name Prem Piya. It names no religion anywhere."
  es: "Artículo de Wikipedia en inglés sobre Faiyaz Khan; utilizado únicamente para datos biográficos. Lo describe como un vocalista clásico indio de la gharana de Agra, nacido el 8 de febrero de 1886 en Sikandara, cerca de Agra, y fallecido el 5 de noviembre de 1950 en Baroda, conocido como Aftab-e-Mausiqi, músico de la corte de Baroda, que componía bajo el seudónimo de Prem Piya. No menciona su religión en ningún momento."
  fr: "L'article de Wikipédia en anglais consacré à Faiyaz Khan ne mentionne que des informations factuelles. Il le présente comme un chanteur classique indien de l'école d'Agra, né le 8 février 1886 à Sikandara, près d'Agra, et décédé le 5 novembre 1950 à Baroda, connu sous le nom d'Aftab-e-Mausiqi, musicien de cour de Baroda et compositeur sous le pseudonyme de Prem Piya. Aucune mention de sa religion n'est faite."
  ur: "فیاض خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انہیں آگرہ گھرانے کے ایک ہندوستانی کلاسیکی گلوکار کے طور پر پیش کرتا ہے، جو 8 فروری 1886 کو آگرہ کے قریب سکندرہ میں پیدا ہوئے اور 5 نومبر 1950 کو بڑودہ میں انتقال کر گئے، جو بڑودہ کے درباری موسیقار آفتاب موصیقی کے نام سے جانا جاتا ہے، پریم پیا کے قلمی نام سے کمپوز کیا۔ اس میں کہیں بھی کسی مذہب کا نام نہیں ہے۔"
  tr: "Fayyad Khan hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Grana'dan Hintli bir klasik şarkıcı olduğu, 8 Şubat 1886'da Agra yakınlarındaki Sikandra'da doğduğu ve 5 Kasım 1950'de Baroda'da öldüğü belirtilmiştir. 'Aftab Musiqi' lakabıyla tanınıyordu, Baroda'nın saray müzisyeniydi ve 'Prem Piya' adıyla müzik besteledi. Dininden hiçbir yerde bahsetmeyin."
  id: "Artikel Wikipedia bahasa Inggris tentang Fayyad Khan; digunakan hanya untuk fakta entitas tersebut. Perlu dicatat bahwa ia adalah penyanyi klasik India dari Grana, lahir pada 8 Februari 1886 di Sikandra dekat Agra, dan meninggal pada 5 November 1950 di Baroda. Ia dikenal dengan julukan 'Aftab Musiqi', adalah musisi istana Baroda, dan menciptakan musik dengan nama 'Prem Piya'. Jangan sebutkan agamanya di mana pun."
