summary:
  ar: "قناة «هدف برودكشن» نفسها على يوتيوب؛ وصفها مقتضب ⁦(«يرجى الاشتراك»)⁩ وكلماتها المفتاحية تسمي الصومال وكينيا وشيوخًا صوماليين، وتظهر أحدث مقاطعها (2026) خطبًا وبرامج صوتية لشيوخ صوماليين."
  en: "The Hadaf Production channel itself on YouTube; its description is a bare 'PLEASE SUBSCRIBE', its keywords name Somalia, Kenya and Somali sheikhs, and its recent uploads (2026) are Friday sermons and podcasts by Somali scholars."
  es: "El canal de Hadaf Production en YouTube tiene una descripción que dice simplemente \"SUSCRÍBETE\", sus palabras clave mencionan Somalia, Kenia y jeques somalíes, y sus publicaciones más recientes (2026) son sermones de los viernes y podcasts de académicos somalíes."
  fr: "La chaîne Hadaf Production elle-même sur YouTube; sa description est un simple « ABONNEZ-VOUS », ses mots-clés sont la Somalie, le Kenya et les cheikhs somaliens, et ses dernières mises en ligne (2026) sont des sermons du vendredi et des podcasts d'érudits somaliens."
  ur: "یوٹیوب پر خود ہداف پروڈکشن چینل؛ اس کی تفصیل ایک کھلی 'پلیز سبسکرائب' ہے، اس کے کلیدی الفاظ کے نام صومالیہ، کینیا اور صومالی شیخ ہیں، اور اس کے حالیہ اپ لوڈز (2026) صومالی علماء کے جمعہ کے خطبات اور پوڈ کاسٹ ہیں۔"
  tr: "'Hadaf Production' kanalının kendisi YouTube'da; açıklaması kısa ('Lütfen abone olun') ve anahtar kelimeleri Somali, Kenya ve Somali şeyhlerine atıfta bulunuyor. Son klibi (2026) Somali şeyhlerinin vaazları ve sesli programlarını içeriyor."
  id: "Saluran 'Hadaf Production' sendiri di YouTube; deskripsinya singkat ('Silakan berlangganan'), dan kata kuncinya merujuk pada Somalia, Kenya, dan sheikh Somalia. Klip terbarunya (2026) menampilkan khotbah dan program audio oleh sheikh Somalia."
