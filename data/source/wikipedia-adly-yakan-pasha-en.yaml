summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عدلي يكن باشا؛ تُستخدم لوقائع الكيان فقط. تروي انتماءه لأسرة يكن ولأسرة محمد علي ورئاساته الثلاث للوزراء بين 1921 و1930 ووزارتيه للخارجية والداخلية ورئاسته لمجلس الشيوخ ووفاته في باريس سنة 1933."
  en: "English Wikipedia article on Adly Yakan Pasha; used for entity facts only. It recounts his membership of the Yakan family and the Muhammad Ali dynasty, his three premierships between 1921 and 1930, his foreign and interior ministries, his speakership of the Senate and his death at Paris in 1933."
  es: "Artículo de la Wikipedia en inglés sobre Adly Yakan Pasha; utilizado únicamente para datos sobre la persona. Relata su pertenencia a la familia Yakan y a la dinastía Muhammad Ali, sus tres mandatos como primer ministro entre 1921 y 1930, sus cargos como ministro de Asuntos Exteriores e Interior, su presidencia del Senado y su fallecimiento en París en 1933."
  fr: "Article de Wikipédia en anglais sur Adly Yakan Pasha; utilisé uniquement à des fins d’information sur l’entité. Il relate son appartenance à la famille Yakan et à la dynastie de Muhammad Ali, ses trois mandats de Premier ministre entre 1921 et 1930, ses fonctions de ministre des Affaires étrangères et de l’Intérieur, sa présidence du Sénat et sa mort à Paris en 1933."
  ur: "عدلی یکان پاشا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں یاکان خاندان اور محمد علی خاندان کی ان کی رکنیت، 1921 اور 1930 کے درمیان ان کی تین پریمیئر شپ، ان کی وزارت خارجہ اور داخلہ، ان کی سینیٹ کی اسپیکر شپ اور 1933 میں پیرس میں ان کی موت کا ذکر ہے۔"
