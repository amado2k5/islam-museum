  en: "English Wikipedia article on Adly Yakan Pasha; used for entity facts only. It recounts his membership of the Yakan family and the Muhammad Ali dynasty, his three premierships between 1921 and 1930, his foreign and interior ministries, his speakership of the Senate and his death at Paris in 1933."
