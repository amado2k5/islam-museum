reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It is a short article: it gives him, under the infobox spelling 'Adly Yeghen Pasha', born on 18 January 1864 at Cairo and died on 22 October 1933 at Paris; of the Yeghen/Yakan family and a member of the Muhammad Ali dynasty, the great-grandnephew of Muhammad Ali Pasha, and of Turkish origin; prime minister three times (16 March 1921 – 1 March 1922, 7 June 1926 – 26 April 1927, and 4 October 1929 – 1 January 1930), and also foreign minister, interior minister and Speaker of the Egyptian Senate; made an honorary KCMG in the 1918 New Year Honours. It has no religion field, its text makes no statement of his religion, and its categories note only descent and offices."
