summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أراش فردوسي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أوفرلاند بارك بولاية كانساس سنة 1985 لأبوين مهاجرين إيرانيين، ودراسته في معهد ماساتشوستس للتقنية، وتأسيسه دروبوكس مع درو هيوستن سنة 2007 وإدارته التقنية حتى 2016. لا تذكر دينه."
  en: "English Wikipedia article on Arash Ferdowsi; used for entity facts only. It recounts his 1985 birth in Overland Park, Kansas, to Iranian immigrant parents, his MIT studies, his co-founding of Dropbox with Drew Houston in 2007 and his tenure as its chief technology officer until 2016. It makes no statement of his religion."
  es: "Artículo de la Wikipedia en inglés sobre Arash Ferdowsi; utilizado únicamente para datos biográficos. Relata su nacimiento en 1985 en Overland Park, Kansas, de padres inmigrantes iraníes, sus estudios en el MIT, la cofundación de Dropbox con Drew Houston en 2007 y su cargo como director de tecnología hasta 2016. No menciona su religión."
  fr: "Article Wikipédia en anglais sur Arash Ferdowsi; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance en 1985 à Overland Park, au Kansas, de parents immigrés iraniens, ses études au MIT, la création de Dropbox avec Drew Houston en 2007 et son poste de directeur technique jusqu'en 2016. Il ne mentionne pas sa religion."
  ur: "آرش فردوسی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اوورلینڈ پارک، کنساس میں ان کی 1985 کی پیدائش ایرانی تارکین وطن کے والدین کے لیے، اس کی MIT کی تعلیم، 2007 میں Drew Houston کے ساتھ Dropbox کی اس کی شریک بانی اور 2016 تک اس کے چیف ٹیکنالوجی آفیسر کے طور پر اس کی مدت کا ذکر کرتا ہے۔ اس میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
