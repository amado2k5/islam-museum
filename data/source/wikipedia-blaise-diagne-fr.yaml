reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his birth at Gorée on 13 October 1872, his birth name as Galaye M'Baye, his adoption by the Crespin family and his education by the Frères de l'instruction chrétienne de Ploërmel, who gave him the name Blaise; his masonic initiation in September 1899 in the lodge L'Amitié of the Grand Orient de France at Saint-Denis, Réunion, and his later mastership of the Paris lodge Pythagore; his deputyship from 1914, the mayoralty of Dakar, and the under-secretaryship of state for the colonies (1931–1932); and his death at Cambo-les-Bains on 11 May 1934, his body being repatriated to Dakar in 1935. It names no personal religious affiliation for him and its infobox has no religion field."
