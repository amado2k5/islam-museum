summary:
  ar: "مقالة ويكيبيديا الأردية عن السير علي إمام؛ تُستخدم لوقائع الكيان فقط. تروي ولادته سنة 1869 قرب باتنا ووزارته لحيدرآباد ودوره في فصل بيهار، وإهداء إقبال إليه الطبعة الأولى من «أسرار خودي»، وتذكر وفاته في 27 أكتوبر 1932، وهو تاريخ يخالف 31 أكتوبر في المقالة الإنجليزية وسُجّل الخلاف."
  en: "Urdu Wikipedia article on Sir Ali Imam; used for entity facts only. It recounts his birth in 1869 near Patna, his Hyderabad ministry and his part in the separation of Bihar, and Iqbal's dedication of the first edition of Asrar-i-Khudi to him; it dates his death 27 October 1932, against 31 October in the English article, and the conflict is recorded."
