summary:
  ar: "مقالة ويكيبيديا الأردية عن السير علي إمام؛ تُستخدم لوقائع الكيان فقط. تروي ولادته سنة 1869 قرب باتنا ووزارته لحيدرآباد ودوره في فصل بيهار، وإهداء إقبال إليه الطبعة الأولى من «أسرار خودي»، وتذكر وفاته في 27 أكتوبر 1932، وهو تاريخ يخالف 31 أكتوبر في المقالة الإنجليزية وسُجّل الخلاف."
  en: "Urdu Wikipedia article on Sir Ali Imam; used for entity facts only. It recounts his birth in 1869 near Patna, his Hyderabad ministry and his part in the separation of Bihar, and Iqbal's dedication of the first edition of Asrar-i-Khudi to him; it dates his death 27 October 1932, against 31 October in the English article, and the conflict is recorded."
  es: "Artículo de Wikipedia en urdu sobre Sir Ali Imam; utilizado únicamente para datos sobre la persona. Relata su nacimiento en 1869 cerca de Patna, su ministerio en Hyderabad y su participación en la separación de Bihar, así como la dedicatoria de Iqbal de la primera edición de Asrar-i-Khudi en su honor; fecha su muerte el 27 de octubre de 1932, en contraposición al 31 de octubre que figura en el artículo en inglés, y se registra la discrepancia."
  fr: "Article de Wikipédia en ourdou sur Sir Ali Imam; utilisé uniquement pour les informations factuelles. Il relate sa naissance en 1869 près de Patna, son ministère à Hyderabad et son rôle dans la séparation du Bihar, ainsi que la dédicace par Iqbal de la première édition d’Asrar-i-Khudi à son égard; il date son décès du 27 octobre 1932, contre le 31 octobre dans l’article en anglais, et cette divergence est mentionnée."
  ur: "سر علی امام پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1869 میں پٹنہ کے قریب ان کی پیدائش، ان کی حیدرآباد کی وزارت اور بہار کی علیحدگی میں ان کا حصہ، اور اقبال کے اسرار خودی کے پہلے ایڈیشن کو ان کے لیے وقف کرنے کا ذکر کرتا ہے۔ اس میں ان کی موت 27 اکتوبر 1932 ہے، انگریزی مضمون میں 31 اکتوبر کے مقابلے میں، اور تنازعہ درج ہے۔"
  tr: "Sir Ali İmam hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1869'daki doğumunu, Patna'ya yakınlığını, Haydarabad'daki hizmetini, Bihar şubesindeki rolünü ve İkbal tarafından ona ithaf edilen 'Asrar Khudi' adlı eserin ilk baskısını anlatır. 27 Ekim 1932'deki ölümünü belirtir; bu tarih İngilizce makalede 31 Ekim ile çelişir ve anlaşmazlığı kaydeder."
  id: "Artikel Wikipedia Urdu tentang Sir Ali Imam; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada tahun 1869, kedekatannya dengan Patna, pelayanannya di Hyderabad, perannya dalam cabang Bihar, dan dedikasi edisi pertama 'Asrar Khudi' kepadanya oleh Iqbal. Ia menyebutkan kematiannya pada 27 Oktober 1932, tanggal yang bertentangan dengan 31 Oktober dalam artikel bahasa Inggris dan mencatat perselisihan tersebut."
