  fr: "Article de Wikipédia en arabe sur Ahmad Khatib al-Minangkabawi; utilisé uniquement à des fins d'information sur l'entité. Traduction de l'article anglais: érudit sunnite originaire de Minangkabau, imam de l'école chaféite à la Grande Mosquée, né le 26 juin 1860 et décédé le 9 octobre 1915 à La Mecque."
