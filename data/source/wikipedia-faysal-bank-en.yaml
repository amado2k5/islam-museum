reliability_note: 'Pointer for entity facts only, used where the article cites a source: a Pakistani Islamic bank in Karachi
  (Bloomberg, 2019); begun in Pakistan in October 1987 as a branch of Bahrain''s Faysal Islamic Bank, owned by Prince Mohammed
