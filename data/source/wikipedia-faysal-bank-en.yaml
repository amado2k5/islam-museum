  (BBC); the 2014 plan to convert (Reuters) and the conversion to a full Islamic bank by December 2022 with an Islamic banking
  licence; the State Bank fines of July 2020 and October 2022; 2025 figures and Ithmaar Bank''s 66.78% (annual report 2025).
