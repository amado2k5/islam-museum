summary:
  ar: "القناة الرسمية للأستاذ عمر ميتا على يوتيوب باسم «عمر ميتا شاميلا»؛ بدأت في 9 مارس 2016 وتنشر محاضراته الموضوعية، ومنها سلسلته في أشراط الساعة."
  en: "The official YouTube channel of Ustaz Oemar Mita, named Oemar Mita Syameela (@oemarmitasyameela), started on 9 March 2016, carrying his thematic lectures, among them his eschatology series."
  es: "El canal oficial de YouTube del Ustaz Oemar Mita, llamado Oemar Mita Syameela (@oemarmitasyameela), se creó el 9 de marzo de 2016 y en él se pueden ver sus conferencias temáticas, entre ellas su serie sobre escatología."
  fr: "La chaîne YouTube officielle d'Ustaz Oemar Mita, nommée Oemar Mita Syameela (@oemarmitasyameela), a débuté le 9 mars 2016, diffusant ses conférences thématiques, parmi lesquelles sa série sur l'eschatologie."
  ur: "Ustaz Oemar Mita کا آفیشل یوٹیوب چینل، جس کا نام Oemar Mita Syameela (@oemarmitasyameela) ہے، 9 مارچ 2016 کو شروع ہوا، جس میں ان کے موضوعاتی لیکچرز شامل ہیں، ان میں ان کی اسچیٹولوجی سیریز بھی شامل ہے۔"
  tr: "Bay Omar Mita'nın YouTube'daki resmi kanalı \"Omar Mita Shamila\" 9 Mart 2016'da başladı ve \"Signs of the Hour\" dizisi dahil olmak üzere tematik derslerini yayınlamaktadır."
  id: "Saluran resmi Bapak Omar Mita di YouTube bernama \"Omar Mita Shamila\" dimulai pada 9 Maret 2016, dan menerbitkan kuliah tematiknya, termasuk seri \"Signs of the Hour.\""
