summary:
  ar: "سيرة علي جوان في موسوعة تاريخ الهندسة والتقانة (ETHW): أسرته الأذربيجانية، وأبوه المحامي، ودراسته في طهران وكولومبيا، ودروسه الموسيقية مع هنري كويل، وعمله في مختبرات بل ومعهد ماساتشوستس للتقانة."
  en: "ETHW biography of Ali Javan: his Azerbaijani family, his lawyer father, his studies in Tehran and at Columbia, his music classes with Henry Cowell, and his work at Bell Labs and MIT."
  es: "Biografía de Ali Javan publicada por ETHW: su familia azerbaiyana, su padre abogado, sus estudios en Teherán y en Columbia, sus clases de música con Henry Cowell y su trabajo en Bell Labs y el MIT."
  fr: "Biographie d'Ali Javan par ETHW: sa famille azerbaïdjanaise, son père avocat, ses études à Téhéran et à Columbia, ses cours de musique avec Henry Cowell et son travail chez Bell Labs et au MIT."
  ur: "علی جوان کی ETHW سوانح عمری: اس کا آذربائیجانی خاندان، اس کے وکیل والد، تہران اور کولمبیا میں اس کی تعلیم، ہنری کوول کے ساتھ اس کی موسیقی کی کلاسیں، اور بیل لیبز اور MIT میں اس کا کام۔"
