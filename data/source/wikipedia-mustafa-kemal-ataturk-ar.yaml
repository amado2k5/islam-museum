summary:
  ar: "مقالة ويكيبيديا العربية عن مصطفى كمال أتاتورك؛ تعرض نشأته في سالونيك ومسيرته العسكرية والسياسية وإصلاحاته، وتتضمن فصلًا عن الجدل حول معتقداته الدينية يقرر أن خطاباته ومصادر تركية تثبت أنه مسلم متدين وصف الإسلام بأنه «ديننا الأعظم» والقرآن بأنه «الكتاب المحكم»، في مقابل مصادر تزعم أنه كان ملحدًا أو ربوبيًا أو لاأدريًا معاديًا للأديان."
  en: "Arabic Wikipedia article on Mustafa Kemal Atatürk; it covers his Salonica upbringing, his military and political career and his reforms, and includes a section on the controversy over his religious beliefs which reports that his speeches and Turkish sources show a devout Muslim who called Islam 'our greatest religion' and the Qur'an 'the perfect book', against sources claiming he was an atheist, a deist or an agnostic hostile to all religions."
