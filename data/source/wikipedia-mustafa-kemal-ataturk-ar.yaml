summary:
  ar: "مقالة ويكيبيديا العربية عن مصطفى كمال أتاتورك؛ تعرض نشأته في سالونيك ومسيرته العسكرية والسياسية وإصلاحاته، وتتضمن فصلًا عن الجدل حول معتقداته الدينية يقرر أن خطاباته ومصادر تركية تثبت أنه مسلم متدين وصف الإسلام بأنه «ديننا الأعظم» والقرآن بأنه «الكتاب المحكم»، في مقابل مصادر تزعم أنه كان ملحدًا أو ربوبيًا أو لاأدريًا معاديًا للأديان."
  en: "Arabic Wikipedia article on Mustafa Kemal Atatürk; it covers his Salonica upbringing, his military and political career and his reforms, and includes a section on the controversy over his religious beliefs which reports that his speeches and Turkish sources show a devout Muslim who called Islam 'our greatest religion' and the Qur'an 'the perfect book', against sources claiming he was an atheist, a deist or an agnostic hostile to all religions."
  es: "Artículo de Wikipedia en árabe sobre Mustafa Kemal Atatürk; abarca su infancia en Salónica, su carrera militar y política y sus reformas, e incluye una sección sobre la controversia en torno a sus creencias religiosas que informa que sus discursos y fuentes turcas muestran a un musulmán devoto que llamaba al Islam \"nuestra mayor religión\" y al Corán \"el libro perfecto\", en contraposición a fuentes que afirman que era ateo, deísta o agnóstico hostil a todas las religiones."
  fr: "L'article de Wikipédia en arabe sur Mustafa Kemal Atatürk aborde son enfance à Salonique, sa carrière militaire et politique, ses réformes, et comprend une section sur la controverse concernant ses convictions religieuses. Cette section rapporte que ses discours et les sources turques montrent un musulman fervent qui qualifiait l'islam de « notre plus grande religion » et le Coran de « livre parfait », contrairement aux sources qui affirment qu'il était athée, déiste ou agnostique, hostile à toutes les religions."
  ur: "مصطفی کمال اتاترک پر عربی ویکیپیڈیا مضمون؛ اس میں اس کی سالونیکا کی پرورش، اس کے فوجی اور سیاسی کیریئر اور اس کی اصلاحات کا احاطہ کیا گیا ہے، اور اس میں ان کے مذہبی عقائد کے تنازعہ پر ایک سیکشن شامل ہے جس میں بتایا گیا ہے کہ اس کی تقاریر اور ترکی کے ذرائع ایک دیندار مسلمان کو ظاہر کرتے ہیں جس نے اسلام کو 'ہمارا سب سے بڑا مذہب' اور قرآن کو 'کامل کتاب' کہا، ذرائع کے خلاف یہ دعویٰ کیا گیا ہے کہ وہ ملحد، غیر متعصب مذہب یا تمام مذاہب کے مخالف ہیں۔"
  tr: "Mustafa Kemal Atatürk hakkında Arapça Vikipedi makalesi, Selanik'teki yetiştirilme sürecini, askeri ve siyasi kariyerini ve reformlarını sunar. Makalede, dini inançları üzerine yapılan tartışmayı ele alan bir bölüm yer alır; konuşmaları ve Türk kaynakları onun dindar bir Müslüman olduğunu kanıtlar, İslam'ı \"en büyük dinimiz\" ve Kur'an'ı \"mükemmel kitap\" olarak tanımlarken, kaynaklar onun ateist, despotist veya agnostik olduğunu ve dinlere karşı olduğunu iddia eder."
  id: "Artikel Wikipedia berbahasa Arab tentang Mustafa Kemal Atatürk menyajikan masa kecilnya di Tesaloniki, karier militer dan politiknya, serta reformasinya. Artikel tersebut memuat bab tentang perdebatan tentang keyakinan agamanya, menyatakan bahwa pidatonya dan sumber Turki membuktikan bahwa ia adalah Muslim yang taat, menggambarkan Islam sebagai \"agama terbesar kita\" dan Al-Qur'an sebagai \"kitab sempurna,\" sementara sumber mengklaim ia adalah ateis, despotis, atau agnostik dan menentang agama."
