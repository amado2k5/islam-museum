summary:
  ar: "كتاب السيرة النبوية لـابن هشام، تحقيق السقا والأبياري وشلبي، مصطفى البابي الحلبي، مصر، الطبعة الثانية؛ قُرئ في نسخة المكتبة الشاملة الموافقة للمطبوع في 21 نوفمبر 2026، في موضوع: أخبار من سمعوا القرآن بمكة."
  en: "al-Sira al-Nabawiyya by Ibn Hisham, eds. al-Saqqa, al-Abyari and Shalabi, Mustafa al-Babi al-Halabi, Egypt, 2nd ed., 1375 AH / 1955; read on 21 November 2026 in the Shamela library copy, whose numbering follows the printed edition, for the accounts of those who heard the Qur'an in Mecca (vol. 1, pp. 270-271, 293-294, 315-316, 343-345, 382-383)."
  ur: "السيرة النبوية، مصنف: ابن هشام؛ 21 نومبر 2026 کو المکتبۃ الشاملہ کے نسخے میں، جس کے صفحات مطبوعہ کے مطابق ہیں، اس موضوع کے لیے پڑھی گئی: أخبار من سمعوا القرآن بمكة۔"
  fr: "al-Sira al-Nabawiyya de Ibn Hisham, eds. al-Saqqa, al-Abyari and Shalabi, Mustafa al-Babi al-Halabi, Egypt, 2nd ed., 1375 AH / 1955 ; lu le 21 novembre 2026 dans la copie de la bibliothèque Shamela, dont la pagination suit l'édition imprimée, pour : the accounts of those who heard the Qur'an in Mecca (vol. 1, pp. 270-271, 293-294, 315-316, 343-345, 382-383)."
  es: "al-Sira al-Nabawiyya de Ibn Hisham, eds. al-Saqqa, al-Abyari and Shalabi, Mustafa al-Babi al-Halabi, Egypt, 2nd ed., 1375 AH / 1955; leído el 21 de noviembre de 2026 en la copia de la biblioteca Shamela, cuya paginación sigue la edición impresa, para: the accounts of those who heard the Qur'an in Mecca (vol. 1, pp. 270-271, 293-294, 315-316, 343-345, 382-383)."
  tr: "İbn Hişam tarafından yazılan Peygamberlik Biyografisi Kitabı, Al-Saqqa, Al-Abiyari ve Shalabi, Mustafa Al-Babi Al-Halabi, Mısır, ikinci baskı; 21 Kasım 2026 tarihli basılı baskıya karşılık gelen Kapsamlı Kütüphane baskısında, Mekke'de Kur'an'ı dinleyenlerin haberleri başlıklı olarak okunmaktadır."
  id: "Kitab Biografi Nabi oleh Ibn Hisham, disunting oleh Al-Saqqa, Al-Abiyari, dan Shalabi, Mustafa Al-Babi Al-Halabi, Mesir, edisi kedua; dibaca dalam edisi Perpustakaan Komprehensif yang sesuai dengan edisi cetak tanggal 21 November 2026, dengan topik: Berita mereka yang mendengar Al-Qur'an di Mekah."
