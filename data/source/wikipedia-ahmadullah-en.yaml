reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. Read in full on 5 November 2026. The lead and body give his birth on 15 December 1981 in Bashikpur village, Lakshmipur District, his Qawmi madrasa education (Darul Uloom Hathazari; ifta at Khulna Darul Uloom), his decade at the West Dammam Islamic Dawah Centre, the founding of the As-Sunnah Foundation and of IQA.info, and his refusal of a Religious Affairs advisor post in August 2024, each footnoted to Bengali press. The YouTube infobox gives his channel 'Ahmadullah' at 3.33 million subscribers and 368 million views, its figures last updated 30 November 2025. The Controversy section reports the 5 April 2026 Australian visa cancellation, citing the Dhaka Tribune and The Daily Telegraph. The infobox's religion, denomination, jurisprudence and creed entries (Sunni / Sunni / Hanafi / Athari) are structured data and were not used to settle faith. The revision-id endpoint was not reachable in this session, so no revision id is recorded; the access date stands in its place."
