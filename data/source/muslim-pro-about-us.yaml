summary:
  ar: "صفحة «من نحن» في موقع مسلم برو (Bitsmedia Pte. Ltd.) كما قُرئت في 6 نوفمبر 2026: الفكرة سنة 2009، والإطلاق على iOS سنة 2010 ثم أندرويد 2011، والمليون الأول في 21 نوفمبر 2011، والاستحواذ سنة 2017، وQalbox سنة 2022، و190 مليون تنزيل بحلول رمضان 2026، وفريق القيادة."
  en: "Muslim Pro's 'About Us' page (Bitsmedia Pte. Ltd.) as read on 6 November 2026: the concept in 2009, the iOS launch in 2010 and Android in 2011, the first million downloads on 21 November 2011, the 2017 acquisition, Qalbox in 2022, 190 million downloads by Ramadan 2026, and the leadership team."
  ur: "مسلم پرو (Bitsmedia Pte. Ltd.) کی ویب سائٹ کا «ہمارے بارے میں» صفحہ، 6 نومبر 2026 کو پڑھا گیا: 2009 میں خیال، 2010 میں iOS اور 2011 میں اینڈرائیڈ پر آغاز، 21 نومبر 2011 کو پہلے دس لاکھ ڈاؤن لوڈ، 2017 کا حصول، 2022 میں Qalbox، رمضان 2026 تک 19 کروڑ ڈاؤن لوڈ، اور قیادت۔"
  es: "La página \"Acerca de nosotros\" de Muslim Pro (Bitsmedia Pte. Ltd.), tal como se leyó el 6 de noviembre de 2026, describe el concepto en 2009, el lanzamiento para iOS en 2010 y para Android en 2011, el primer millón de descargas el 21 de noviembre de 2011, la adquisición en 2017, Qalbox en 2022, 190 millones de descargas para el Ramadán de 2026 y el equipo directivo."
  fr: "Page « À propos de nous » de Muslim Pro (Bitsmedia Pte. Ltd.) telle que consultée le 6 novembre 2026: le concept en 2009, le lancement sur iOS en 2010 et sur Android en 2011, le premier million de téléchargements le 21 novembre 2011, l'acquisition de 2017, Qalbox en 2022, 190 millions de téléchargements d'ici le Ramadan 2026 et l'équipe dirigeante."
  tr: "Muslim Pro web sitesindeki \"Biz Kimiz\" sayfası (Bitsmedia Pte. Ltd.) 6 Kasım 2026'da okundu: 2009 fikiri, 2010'da iOS'un lansmanı, ardından 2011'de Android'in lansmanı, 21 Kasım 2011'de ilk milyon, 2017'de satın alma, 2022'de Qalbox, Ramazan 2026'ya kadar 190 milyon indirme ve liderlik ekibi."
  id: "Halaman \"Siapa Kami\" di situs Muslim Pro (Bitsmedia Pte. Ltd.) seperti yang dibaca pada 6 November 2026: ide pada 2009, peluncuran iOS pada 2010, kemudian Android pada 2011, juta pertama pada 21 November 2011, akuisisi pada 2017, Qalbox pada 2022, 190 juta unduhan hingga Ramadan 2026, dan tim kepemimpinan."
