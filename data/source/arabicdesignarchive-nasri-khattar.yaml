summary:
  ar: "الصفحة «Nasri Khattar» في Arabic Design Archive؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: الحروف الطباعية والطباعة العربية وكتلة يونيكود العربية."
  en: "The page \"Nasri Khattar\" (Arabic Design Archive), named in a research file supplied to the museum on 21 November 2026; the museum did not open the page, and the founder approved using the file without re-verification. Used for: Arabic typography and the Unicode Arabic block."
  ur: "صفحہ «Nasri Khattar» (Arabic Design Archive)؛ یہ عجائب گھر کو 21 نومبر 2026ء کو دی گئی تحقیقی فائل میں مذکور ہے، عجائب گھر نے صفحہ نہیں کھولا اور بانی نے دوبارہ تصدیق کے بغیر فائل کے استعمال کی منظوری دی۔ استعمال: عربی ٹائپوگرافی اور یونی کوڈ کا عربی بلاک۔"
  fr: "La page « Nasri Khattar » (Arabic Design Archive), citée dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisée pour : la typographie arabe et le bloc arabe d'Unicode."
  es: "La página «Nasri Khattar» (Arabic Design Archive), citada en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el archivo sin volver a verificar. Usada para: la tipografía árabe y el bloque árabe de Unicode."
