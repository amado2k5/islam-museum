summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن سالم أ. في الله، مراجعة 13 يونيو 2024؛ تُستخدم لوقائع الكيان فقط. تفصّل كتبه منذ Nikmatnya Pacaran Setelah Pernikahan ⁦(2003)⁩ ونشاطه في مسجد جوغوكاريان وإشرافه على مجلس جيجاك نبي، ودراسته غير المكتملة في جامعة غاجاه مادا وجامعة سونان كاليجاغا."
  en: "Indonesian Wikipedia article on Salim A. Fillah, revision of 13 June 2024; used for entity facts only. It details his books from Nikmatnya Pacaran Setelah Pernikahan (2003), his activism at Masjid Jogokariyan and his care of its Majelis Jejak Nabi study circle, and his unfinished studies at Gadjah Mada University and UIN Sunan Kalijaga."
  es: "Artículo de Wikipedia en Indonesia sobre Salim A. Fillah, revisión del 13 de junio de 2024; Se utiliza únicamente para hechos de entidades. Detalla sus libros de Nikmatnya Pacaran Setelah Pernikahan (2003), su activismo en Masjid Jogokariyan y su cuidado de su círculo de estudio Majelis Jejak Nabi, y sus estudios inconclusos en la Universidad Gadjah Mada y la UIN Sunan Kalijaga."
  fr: "Article Wikipédia indonésien sur Salim A. Fillah, révisé le 13 juin 2024; utilisé uniquement pour les faits d’entité. Il détaille ses livres de Nikmatnya Pacaran Setelah Pernikahan (2003), son activisme à la mosquée Jogokariyan et sa prise en charge de son cercle d'étude Majelis Jejak Nabi, ainsi que ses études inachevées à l'université Gadjah Mada et à l'UIN Sunan Kalijaga."
  ur: "سلیم اے فلاہ پر انڈونیشی ویکیپیڈیا مضمون، 13 جون 2024 کی نظرثانی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں نکمتنیا پاکران سیٹلہ پرنیکاہن (2003) سے ان کی کتابوں، مسجد جوگوکاریان میں ان کی سرگرمی اور اس کے مجلس جیجک نبی کے مطالعہ کے حلقے کی دیکھ بھال، اور گدجا مڈا یونیورسٹی اور یو آئی این سنن کلیجاگا میں ان کی نامکمل تعلیم کی تفصیلات ہیں۔"
  tr: "Salem A. Fiallah hakkında Endonezya Vikipedi makalesi, revizyon 13 Haziran 2024; yalnızca varlık gerçekleri için kullanılmıştır. Kitapları Nikmatnya Pacaran Setelah Pernikahan (2003), Jogokarian Camii'ndeki faaliyetleri, Jijak Nabi Konseyi'nin denetimi ve Gajahmada Üniversitesi ile Sunan Kalijaga Üniversitesi'ndeki eksik eğitimlerini detaylandırır."
  id: "Artikel Wikipedia Indonesia tentang Salem A. Fiallah, revisi 13 Juni 2024; hanya digunakan untuk fakta entitas. Bukunya merinci Nikmatnya Pacaran Setelah Pernikahan (2003), aktivitasnya di Masjid Jogokarian, supervisi Dewan Jijak Nabi, dan studi yang belum selesai di Universitas Gajahmada dan Universitas Sunan Kalijaga."
