reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. Its lead gives his pen name Salim Akhukum Fillah, his birth name Arif Nursalim (citing a mailing-list post) and his birth date 21 March 1984; its infobox places the birth at Kulon Progo, Special Region of Yogyakarta, where the 2025 Cerdika journal study and his Wikidata item give Yogyakarta — both forms are recorded in his record. It records that his first book (2003) was also the first book published by Pro-U Media, lists his works to 2023, and notes his two open letters (to Prabowo Subianto in the 2014 election period, and to Vice President Jusuf Kalla). It names no school for him. Read in full on 15 November 2026."
