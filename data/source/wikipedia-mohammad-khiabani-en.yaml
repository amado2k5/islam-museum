summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشيخ محمد الخياباني؛ تُستخدم لوقائع الكيان فقط. تفتتح بوصفه «رجل دين شيعيًا إيرانيًا» وقائدًا سياسيًا وممثلًا في المجلس، مولودًا في خامنه قرب تبريز ابنًا للتاجر حاجي عبد الحميد، ونشاطه في الثورة الدستورية، ونفيه العثماني سنة 1918، وانتفاضته سنة 1920 وإعلانه «آزاديستان»، وقتله في أواخر صيف 1920."
  en: "English Wikipedia article on Mohammad Khiabani; used for entity facts only. Its lead calls him 'an Iranian Shia cleric, political leader, and representative to the parliament'. It gives his birth at Khameneh near Tabriz, son of the merchant Haji Abdolhamid, his activism in the Constitutional Revolution, his Ottoman exile of 1918, his 1920 revolt and proclamation of Azadistan, and his killing in the late summer of 1920."
