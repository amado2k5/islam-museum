summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشيخ محمد الخياباني؛ تُستخدم لوقائع الكيان فقط. تفتتح بوصفه «رجل دين شيعيًا إيرانيًا» وقائدًا سياسيًا وممثلًا في المجلس، مولودًا في خامنه قرب تبريز ابنًا للتاجر حاجي عبد الحميد، ونشاطه في الثورة الدستورية، ونفيه العثماني سنة 1918، وانتفاضته سنة 1920 وإعلانه «آزاديستان»، وقتله في أواخر صيف 1920."
  en: "English Wikipedia article on Mohammad Khiabani; used for entity facts only. Its lead calls him 'an Iranian Shia cleric, political leader, and representative to the parliament'. It gives his birth at Khameneh near Tabriz, son of the merchant Haji Abdolhamid, his activism in the Constitutional Revolution, his Ottoman exile of 1918, his 1920 revolt and proclamation of Azadistan, and his killing in the late summer of 1920."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Khiabani; utilizado únicamente para datos sobre la persona. Su introducción lo describe como «un clérigo chiíta iraní, líder político y representante en el parlamento». Menciona su nacimiento en Khameneh, cerca de Tabriz, su hijo del comerciante Haji Abdolhamid, su activismo en la Revolución Constitucional, su exilio otomano en 1918, su revuelta de 1920 y la proclamación de Azadistán, y su asesinato a finales del verano de 1920."
  fr: "Article de Wikipédia en anglais sur Mohammad Khiabani; utilisé uniquement pour les informations biographiques. Son introduction le décrit comme « un religieux chiite iranien, un chef politique et un député au Parlement ». L’article mentionne sa naissance à Khameneh, près de Tabriz, fils du marchand Haji Abdolhamid, son activisme lors de la Révolution constitutionnelle, son exil ottoman en 1918, sa révolte de 1920 et la proclamation de l’Azadistan, ainsi que son assassinat à la fin de l’été 1920."
  ur: "محمد خیابانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی قیادت انہیں 'ایرانی شیعہ عالم، سیاسی رہنما، اور پارلیمنٹ میں نمائندہ' کہتی ہے۔ یہ تبریز کے قریب خامنہ میں اس کی پیدائش، تاجر حاجی عبدالحمید کے بیٹے، آئینی انقلاب میں اس کی سرگرمی، 1918 کی اس کی عثمانی جلاوطنی، اس کی 1920 کی بغاوت اور آزادی کا اعلان، اور 1920 کے موسم گرما کے آخر میں اس کا قتل۔"
