reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. The article is short and leans on the Encyclopaedia Iranica entry by Nader Parvin (cited in its references as 'N. Parvin, Encyclopaedia Iranica'). Its lead sentence is one of the record's two attestations of 'Shia' for Khiabani personally; it gives his death only as 'the late summer of 1920', where the Iranica entry and the Persian article give 14 September 1920 (29 Dhu'l-Hijja 1338)."
