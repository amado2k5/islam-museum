summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الصمد خان أشكزئي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 7 يوليو 1907 في عناية الله كاريز واغتياله في 2 ديسمبر 1973 وتأسيسه أنجمن وطن بلوشستان."
  en: "English Wikipedia article on Abdul Samad Khan Achakzai; used for entity facts only. It records his birth on 7 July 1907 at Inayatullah Karez, his assassination on 2 December 1973, and his founding of the Anjuman-i-Watan Baluchistan."
  es: "Artículo de la Wikipedia en inglés sobre Abdul Samad Khan Achakzai; utilizado únicamente para datos sobre la persona. En él se registra su nacimiento el 7 de julio de 1907 en Inayatullah Karez, su asesinato el 2 de diciembre de 1973 y la fundación de la Anjuman-i-Watan Baluchistán."
  fr: "Article de Wikipédia en anglais sur Abdul Samad Khan Achakzai; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance le 7 juillet 1907 à Inayatullah Karez, son assassinat le 2 décembre 1973 et la fondation de l’Anjuman-i-Watan Baluchistan."
  ur: "عبدالصمد خان اچکزئی پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 7 جولائی 1907 کو عنایت اللہ کاریز میں ان کی پیدائش، 2 دسمبر 1973 کو ان کا قتل، اور انجمن وطن بلوچستان کی بنیاد درج ہے۔"
  tr: "Abdul Samad Khan Ashkzai hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 7 Temmuz 1907'de Inayatullah Kariz'de doğduğu, 2 Aralık 1973'te suikasta uğradığı ve Belucistan'ın anavatanını kurduğu belirtilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdul Samad Khan Ashkzai; digunakan hanya untuk fakta entitas. Ia disebutkan lahir pada 7 Juli 1907 di Inayatullah Kariz, dibunuh pada 2 Desember 1973, dan mendirikan tanah air Balochistan."
