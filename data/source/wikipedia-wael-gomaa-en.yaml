  ar: "مقالة ويكيبيديا الإنجليزية عن وائل جمعة؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته مع غزل المحلة والأهلي (2001–2014) وإعارته للسيلية، و114 مباراة دولية مع مصر وألقابه الأفريقية، وتذكر في صندوق معلوماتها أن مولده في قطور بمحافظة الغربية، وتدرجه في تصنيف «مسلمون مصريون» دون أن تذكر دينه في نصها أو تسمّي له مذهبًا."
