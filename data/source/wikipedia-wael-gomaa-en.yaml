summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن وائل جمعة؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته مع غزل المحلة والأهلي (2001–2014) وإعارته للسيلية، و114 مباراة دولية مع مصر وألقابه الأفريقية، وتذكر في صندوق معلوماتها أن مولده في قطور بمحافظة الغربية، وتدرجه في تصنيف «مسلمون مصريون» دون أن تذكر دينه في نصها أو تسمّي له مذهبًا."
  en: "English Wikipedia article on Wael Gomaa; used for entity facts only. It recounts his career at Ghazl El Mahalla and Al Ahly (2001–2014) with a loan at Al-Sailiya, his 114 Egypt caps and his African titles; its infobox gives his birthplace as Kotoor, Gharbia. It makes no statement of his religion in its text and files him under 'Egyptian Muslims', naming no school."
  es: "Artículo de la Wikipedia en inglés sobre Wael Gomaa; utilizado únicamente para obtener información sobre la persona. Relata su trayectoria en Ghazl El Mahalla y Al Ahly (2001-2014), con una cesión al Al-Sailiya, sus 114 partidos con la selección egipcia y sus títulos africanos. Su ficha informativa indica que nació en Kotoor, Gharbia. No menciona su religión y lo clasifica como «musulmán egipcio», sin especificar su escuela."
  fr: "Article Wikipédia en anglais sur Wael Gomaa; utilisé uniquement pour les informations le concernant. Il retrace sa carrière à Ghazl El Mahalla et Al Ahly (2001-2014), avec un prêt à Al-Sailiya, ses 114 sélections en équipe d'Égypte et ses titres africains; son infobox indique que son lieu de naissance est Kotoor, dans la province de Gharbia. L'article ne mentionne pas sa religion et le classe dans la catégorie « Musulmans égyptiens », sans préciser son école religieuse."
  ur: "وائل گوما پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں غزل المحلہ اور الاحلی (2001–2014) میں السیلیہ میں قرض کے ساتھ ان کے کیریئر کا ذکر، اس کے 114 مصری ٹوپیاں اور اس کے افریقی ٹائٹلز؛ اس کا معلومات خانہ اس کی جائے پیدائش کوٹور، غربیہ بتاتا ہے۔ یہ اپنے متن میں اس کے مذہب کا کوئی بیان نہیں دیتا اور اسے 'مصری مسلمان' کے تحت فائل کرتا ہے، کسی اسکول کا نام نہیں دیتا۔"
