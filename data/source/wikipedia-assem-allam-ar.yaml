summary:
  ar: "مقالة ويكيبيديا العربية عن عاصم علام: نبذة قصيرة عن رجل الأعمال المصري البريطاني مالك هال سيتي، وتذكر أنه وُلد في قرية السد بمركز قليوب سنة 1940 وهاجر إلى بريطانيا سنة 1968."
  en: "Arabic Wikipedia article on Assem Allam, a short stub on the Egyptian-British businessman and Hull City owner; it states he was born in the village of Al-Sadd, Qalyub district, in 1940 and emigrated to Britain in 1968."
  es: "Artículo en la Wikipedia en árabe sobre Assem Allam, una breve reseña sobre el empresario egipcio-británico y propietario del Hull City; en ella se afirma que nació en el pueblo de Al-Sadd, distrito de Qalyub, en 1940 y emigró a Gran Bretaña en 1968."
  fr: "Article Wikipédia en arabe sur Assem Allam, une brève ébauche sur l'homme d'affaires égypto-britannique et propriétaire de Hull City; il est indiqué qu'il est né dans le village d'Al-Sadd, district de Qalyub, en 1940 et a émigré en Grande-Bretagne en 1968."
  ur: "عربی ویکیپیڈیا مضمون اسم علام پر، مصری-برطانوی تاجر اور ہل سٹی کے مالک پر ایک مختصر سٹب؛ اس میں کہا گیا ہے کہ وہ 1940 میں قلیوب ضلع کے گاؤں السد میں پیدا ہوئے اور 1968 میں برطانیہ ہجرت کر گئے۔"
  tr: "Asim Allam hakkında Arapça Vikipedi makalesi: Mısırlı-İngiliz iş insanı Malek Hull City'nin kısa bir özeti; 1940'ta Qalyub Center'daki Al-Sadd köyünde doğduğu ve 1968'de Britanya'ya göç ettiği belirtilmektedir."
  id: "Artikel Wikipedia Arab tentang Asim Allam: Gambaran singkat tentang pengusaha Mesir-Inggris Malek Hull City, dengan catatan bahwa ia lahir di desa Al-Sadd di Qalyub Center pada tahun 1940 dan berimigrasi ke Inggris pada tahun 1968."
