reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Covers her birth on 20 April 1975 at Gjakova, then in the Socialist Federal Republic of Yugoslavia, into a Kosovo Albanian family whose paternal ancestry came from Berisha in northern Albania; her schooling at Gjakova, her law degree from the University of Pristina in 2000, her graduate certificate programme in police management and criminal law at the University of Leicester in 2006/07, and her training at the George C. Marshall Center, the FBI National Academy and the University of Virginia (crime science certification, 2007); her Kosovo Police career from major through colonel to major general, her deputy directorship and her brief acting directorship in 2010, holding the rank of general lieutenant colonel — described as the highest rank achieved by a woman officer in Southeastern Europe; her announcement on 6 April 2011 as the consensus candidate of the PDK, LDK and New Kosovo Alliance with the support of the US ambassador, Christopher Dell; her election on 7 April 2011 in the first round by 80 votes to 10 of the 100 MPs present — the only Kosovar president elected in the first round, and Kosovo's first woman, first non-partisan and youngest president; her presidency's work: returning the draft Criminal Code in 2012 over its defamation and source-disclosure provisions, the National Council for European Integration and the first National Strategy (2012), the National Anti-Corruption Council (14 February 2012), her sparing use of pardons — none in 2015, with the criticism that drew from the Ministry of Justice and prisoner advocates — her mediation of the 2014 political impasse, for which President Obama commended her, her anti-extremism work (addressing the UN Security Council in September 2014 and decreeing the March 2015 law banning participation in foreign armed conflicts), her Easter 2013 visit to Dečani Monastery for inter-religious tolerance, the National Council for Survivors of Sexual Violence (March 2014), the 2012 International Women's Summit in Pristina and its Pristina Principles, her membership of the Council of Women World Leaders from May 2012, the €22 million UAE donation she secured for a paediatric surgical hospital (2015), and Kosovo's Millennium Challenge Corporation eligibility of 16 December 2015; her founding of the Jahjaga Foundation in March 2018; and her honours, including honorary doctorates from Durham (2013) and Leicester (2015) and the Clinton Global Initiative's Leadership in Public Service Award (2014). The article names no religion for her."
