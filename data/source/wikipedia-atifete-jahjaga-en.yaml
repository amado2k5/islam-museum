  ar: "مقالة ويكيبيديا الإنجليزية عن عاطفة يحيى آغا (أتيفيته ياهيغا)؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها في جاكوفا سنة 1975، ومسيرتها في شرطة كوسوفو حتى رتبة جنرال، وانتخابها رئيسة لكوسوفو سنة 2011 بوصفها أول امرأة وأول مرشح غير حزبي وأصغر رئيس، ورئاستها 2011–2016."
  en: "English Wikipedia article on Atifete Jahjaga; used for entity facts only. It records her birth at Gjakova in 1975, her Kosovo Police career to the rank of general, her 2011 election as Kosovo's president — its first woman, first non-partisan and youngest president — and her presidency of 2011–2016."
