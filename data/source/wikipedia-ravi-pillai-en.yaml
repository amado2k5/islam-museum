summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ب. رافي بيلاي: وُلد في 2 أيلول 1953 في تشافارا بولاية كيرالا، أسس مجموعة آر بي وقاد شركة ناصر س. الهاجري في الخليج، وتذكر أن زواج ابنته سنة 2015 جرى وفق أعراف الناير وتقاليدهم."
  en: "English Wikipedia article on B. Ravi Pillai, born 2 September 1953 at Chavara, Kerala, founder of the RP Group and builder of Nasser S. Al Hajri Corporation in the Gulf; it records his daughter's 2015 wedding as conducted in accordance with Nair customs and cultural traditions."
  es: "Artículo de la Wikipedia en inglés sobre B. Ravi Pillai, nacido el 2 de septiembre de 1953 en Chavara, Kerala, fundador del Grupo RP y constructor de Nasser S. Al Hajri Corporation en el Golfo; en él se recoge la boda de su hija en 2015, celebrada de acuerdo con las costumbres y tradiciones culturales Nair."
  fr: "L'article de Wikipédia en anglais sur B. Ravi Pillai, né le 2 septembre 1953 à Chavara, au Kerala, fondateur du groupe RP et constructeur de la Nasser S. Al Hajri Corporation dans le Golfe, relate le mariage de sa fille en 2015, célébré selon les coutumes et traditions culturelles Nair."
  ur: "بی روی پلئی پر انگریزی ویکیپیڈیا کا مضمون، 2 ستمبر 1953 کو چاورا، کیرالہ میں پیدا ہوئے، آر پی گروپ کے بانی اور خلیج میں ناصر ایس الحجری کارپوریشن کے بلڈر؛ اس میں ان کی بیٹی کی 2015 کی شادی کو ریکارڈ کیا گیا ہے جیسا کہ نیر کے رسم و رواج اور ثقافتی روایات کے مطابق کیا گیا تھا۔"
  tr: "B. Ravi Pillai hakkında İngilizce Wikipedia makalesi: 2 Eylül 1953'te Kerala, Chavara'da doğdu, RP Grubu'nu kurdu ve Körfez'de Nasser S. Al-Hajri Şirketi'ni yönetti. Kızının 2015'teki evliliğinin Nayir gelenek ve göreneklerine göre gerçekleştiğini hatırlıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang B. Ravi Pillai: Lahir pada 2 September 1953 di Chavara, Kerala, ia mendirikan RP Group dan memimpin Perusahaan Nasser S. Al-Hajri di Teluk. Ia mengingat bahwa pernikahan putrinya pada tahun 2015 berlangsung sesuai dengan adat dan tradisi Nayir."
