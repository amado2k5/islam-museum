summary:
  ar: "تغطية الخليج أونلاين لقضية ازدراء الأديان: بحيري نفسه قال إنه واجه 48 دعوى وبلاغا، وتفاصيل حكم نهاية مايو 2015 بالسجن خمس سنوات مع الشغل."
  en: "Al Khaleej Online's coverage of the contempt-of-religion case: Behery himself said he faced 48 lawsuits and complaints, with details of the late-May 2015 verdict of five years with labour."
  es: "Cobertura de Al Khaleej Online sobre el caso de desacato a la religión: El propio Behery dijo que se enfrentaba a 48 demandas y denuncias, con detalles del veredicto de finales de mayo de 2015 de cinco años de trabajos forzados."
  fr: "Couverture par Al Khaleej Online de l'affaire d'outrage à la religion: Behery lui-même a déclaré avoir fait face à 48 poursuites et plaintes, avec des détails sur le verdict de fin mai 2015 le condamnant à cinq ans de travaux forcés."
  ur: "الخلیج آن لائن کی توہین مذہب کیس کی کوریج: بیہری نے خود کہا کہ انہیں 48 مقدمات اور شکایات کا سامنا کرنا پڑا، جن میں مئی 2015 کے اواخر کے فیصلے کی تفصیلات کے ساتھ پانچ سال مزدوری کی گئی۔"
  tr: "Al-Khaleej Online'ın küfür davasını haber yapması: Bahiri, kendisinin 48 dava ve raporla karşı karşıya olduğunu ve Mayıs 2015'te beş yıl ağır iş cezası verilen kararın detaylarını söyledi."
  id: "Liputan Al-Khaleej Online atas kasus penistaan agama: Bahiri sendiri mengatakan ia menghadapi 48 gugatan dan laporan, serta rincian putusan Mei 2015 yang menjatuhkan hukuman lima tahun penjara dengan kerja paksa."
