summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عاطف ميان؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 28 يونيو 1975 بلاهور في صندوق معلوماتها، وتعليمه في معهد ماساتشوستس للتكنولوجيا، ومنصبه في برينستون، وتعيينه سنة 2018 في المجلس الاستشاري الاقتصادي الباكستاني وإقالته بعد أسبوع، وتصفه نصا بأنه «مسلم أحمدي» وتنسب إلى والديه الأحمدية."
  en: "English Wikipedia article on Atif Mian; used for entity facts only. Its infobox gives his birth as 28 June 1975 at Lahore; its text covers his MIT education, his Princeton professorship, his 2018 appointment to Pakistan's Economic Advisory Council and removal a week later, calls him in the text 'an Ahmadi Muslim', and describes his parents as Ahmadi."
  es: "Artículo de la Wikipedia en inglés sobre Atif Mian; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació el 28 de junio de 1975 en Lahore; el texto abarca su formación en el MIT, su cátedra en Princeton, su nombramiento en 2018 para el Consejo Asesor Económico de Pakistán y su destitución una semana después, lo denomina en el texto \"un musulmán ahmadí\" y describe a sus padres como ahmadíes."
  fr: "L'article de Wikipédia en anglais consacré à Atif Mian ne fournit que des informations sur l'entité. Son infobox indique sa naissance le 28 juin 1975 à Lahore; le texte aborde ses études au MIT, son poste de professeur à Princeton, sa nomination en 2018 au Conseil consultatif économique du Pakistan et son limogeage une semaine plus tard, le qualifie de « musulman ahmadi » et décrit ses parents comme ahmadis."
