  ar: "مقالة ويكيبيديا الإنجليزية عن عاطف ميان؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 28 يونيو 1975 بلاهور في صندوق معلوماتها، وتعليمه في معهد ماساتشوستس للتكنولوجيا، ومنصبه في برينستون، وتعيينه سنة 2018 في المجلس الاستشاري الاقتصادي الباكستاني وإقالته بعد أسبوع، وتصفه نصا بأنه «مسلم أحمدي» وتنسب إلى والديه الأحمدية."
  en: "English Wikipedia article on Atif Mian; used for entity facts only. Its infobox gives his birth as 28 June 1975 at Lahore; its text covers his MIT education, his Princeton professorship, his 2018 appointment to Pakistan's Economic Advisory Council and removal a week later, calls him in the text 'an Ahmadi Muslim', and describes his parents as Ahmadi."
