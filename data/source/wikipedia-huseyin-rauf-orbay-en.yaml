  ar: "مقالة ويكيبيديا الإنجليزية عن حسين رؤوف أورباي؛ تُستخدم لوقائع الكيان فقط. تروي إبحاره الشهير بالطراد حميدية، وتوقيعه هدنة مودروس ناظرًا للبحرية، ورئاسته حكومة أنقرة 1922–1923، ومحاكمته في قضية مؤامرة إزمير ونفيه ثم إعادة اعتباره، وسفارته في لندن."
  en: "English Wikipedia article on Hüseyin Rauf Orbay; used for entity facts only. It recounts his famous cruise as captain of the cruiser Hamidiye, his signing of the Armistice of Mudros as Minister of the Navy, his premiership of the Ankara government in 1922–1923, his trial in the İzmir plot case, his exile and rehabilitation, and his London embassy."
