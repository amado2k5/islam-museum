summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسين رؤوف أورباي؛ تُستخدم لوقائع الكيان فقط. تروي إبحاره الشهير بالطراد حميدية، وتوقيعه هدنة مودروس ناظرًا للبحرية، ورئاسته حكومة أنقرة 1922–1923، ومحاكمته في قضية مؤامرة إزمير ونفيه ثم إعادة اعتباره، وسفارته في لندن."
  en: "English Wikipedia article on Hüseyin Rauf Orbay; used for entity facts only. It recounts his famous cruise as captain of the cruiser Hamidiye, his signing of the Armistice of Mudros as Minister of the Navy, his premiership of the Ankara government in 1922–1923, his trial in the İzmir plot case, his exile and rehabilitation, and his London embassy."
  es: "Artículo de la Wikipedia en inglés sobre Hüseyin Rauf Orbay; utilizado únicamente para datos sobre la persona. Relata su famoso crucero como capitán del crucero Hamidiye, la firma del Armisticio de Mudros como Ministro de Marina, su mandato como primer ministro del gobierno de Ankara entre 1922 y 1923, su juicio por el complot de Esmirna, su exilio y rehabilitación, y su embajada en Londres."
  fr: "Article de Wikipédia en anglais sur Hüseyin Rauf Orbay; utilisé uniquement à des fins d'information sur l'entité. Il relate sa célèbre croisière en tant que capitaine du croiseur Hamidiye, sa signature de l'armistice de Moudros en tant que ministre de la Marine, son poste de Premier ministre du gouvernement d'Ankara en 1922-1923, son procès dans l'affaire du complot d'Izmir, son exil et sa réhabilitation, ainsi que son ambassade à Londres."
  ur: "Hüseyin Rauf Orbay پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں کروزر حمیدیہ کے کپتان کے طور پر ان کے مشہور کروز، بحریہ کے وزیر کے طور پر مدروس کے آرمیسٹس پر دستخط، 1922-1923 میں انقرہ حکومت کی پریمیئر شپ، ازمیر سازش کیس میں ان کے مقدمے کی سماعت، اس کی جلاوطنی اور بحالی، اور لندن میں ان کے سفارت خانے کا ذکر ہے۔"
  tr: "Hüseyin Rauf Orbay hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Ünlü kruvazör Hamidiye ile seyir yolculuğunu, Modros Ateşkesi'ni Deniz Denetçisi olarak imzalamasını, 1922–1923 yılları arasında Ankara hükümetindeki liderliğini, İzmir komplosundaki yargılanışını, sürgününü ve ardından rehabilitasyonunu ve Londra'daki büyükelçiliğini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Hussein Raouf Orbay; hanya digunakan untuk fakta entitas. Artikel ini menceritakan pelayaran terkenalnya bersama kapal penjelajah Hamidiye, penandatanganan Gencatan Senjata Modros sebagai Pengawas Angkatan Laut, kepemimpinannya di pemerintahan Ankara 1922–1923, persidangannya dalam konspirasi Izmir, pengasingannya, dan kemudian rehabilitasinya, serta kedutaannya di London."
