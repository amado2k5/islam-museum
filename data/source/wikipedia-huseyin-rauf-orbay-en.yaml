reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him as born 27 July 1881 in the Cibali district of Constantinople to an Abkhaz family, son of the admiral Mehmet Muzaffer Pasha; Naval Academy graduate of 1899; captain of the cruiser Hamidiye in the Balkan Wars, whence his nickname 'Hero of Hamidiye'; Minister of the Navy in October 1918 and Ottoman signatory of the Armistice of Mudros; Malta exile; Prime Minister of the Ankara government from 12 July 1922 to 4 August 1923; sentenced to ten years in the İzmir plot trial while abroad, a political exile until his return in 1935 and rehabilitation in 1939–1941; MP for Kastamonu and ambassador to London in 1942–1944; dead of a heart attack at Istanbul on 16 July 1964, his grave in the Sahrayıcedit Cemetery at Erenköy. It makes no statement of his religion: its infobox has no religion field and its text names none. One scholarly article it cites (Atatürk Araştırma Merkezi Dergisi, 2004) prints his years in its title as 1880–1964, against the article's own 1881 birth date."
