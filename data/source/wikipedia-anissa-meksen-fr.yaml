reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The article gives her birth on 28 April 1988 in Nancy — one day earlier than the English article's 29 April — to Algerian parents, a father from Annaba and a mother from Constantine, and records that her brother Mehdi introduced her to boxing at the age of twelve. It describes her as Franco-Algerian and eighteen times a world champion. Parental origin is family background, not affiliation, and the article makes no statement of her religion."
