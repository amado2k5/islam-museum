summary:
  ar: "مقالة ويكيبيديا الفرنسية عن أنيسة مكسن؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في نانسي في 28 أبريل 1988 لأبوين جزائريين، وتعدّد بطولاتها العالمية والأوروبية والفرنسية، ولا تذكر أي ديانة لها."
  en: "French Wikipedia article on Anissa Meksen; used for entity facts only. It gives her birth in Nancy on 28 April 1988 to Algerian parents, and lists her world, European and French championships; it makes no statement of any religion for her."
  es: "Artículo de la Wikipedia en francés sobre Anissa Meksen; se utiliza únicamente para obtener información sobre la persona. Indica que nació en Nancy el 28 de abril de 1988 de padres argelinos y enumera sus campeonatos mundiales, europeos y franceses; no menciona ninguna religión que profese."
  fr: "Article Wikipédia en français sur Anissa Meksen; utilisé uniquement pour les informations la concernant. Il indique qu'elle est née à Nancy le 28 avril 1988 de parents algériens et mentionne ses titres de championne du monde, d'Europe et de France; aucune information n'est fournie quant à sa religion."
  ur: "انیسہ میکسن پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے نینسی میں 28 اپریل 1988 کو الجزائر کے والدین کے ہاں اس کی پیدائش کی، اور اس کی عالمی، یورپی اور فرانسیسی چیمپئن شپ کی فہرست دی ہے۔ اس کے لیے کسی مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Anissa Maksen hakkında Fransızca Wikipedia makalesi; sadece varlığın gerçekleri için kullanılmıştır. 28 Nisan 1988'de Nancy'de Cezayirli ebeveynlerin çocuğu olarak doğmuştur, birçok dünya, Avrupa ve Fransa şampiyonluğu vardır ve herhangi bir dinden bahsetmez."
  id: "Artikel Wikipedia Prancis tentang Anissa Maksen; digunakan hanya untuk fakta entitas. Dia lahir di Nancy pada 28 April 1988, dari orang tua Aljazair, memiliki beberapa kejuaraan dunia, Eropa, dan Prancis, dan tidak menyebutkan agama apa pun."
