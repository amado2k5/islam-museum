reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. Its infobox gives his birth as the year 1873 only and his death as 1928; its early-life text gives him born at Cairo on 31 March 1873, son of the finance official Ismail Abdel Khalek Pasha, graduated first of his class from the Khedival School of Law in 1893; twenty-six years in the Ministry of Justice, the first Egyptian attorney general since the occupation (appointed 1912), minister of justice 1914–1919, minister of the interior in 1921, prime minister 1 March – 30 November 1922 and 26 April 1927 – 16 March 1928, when his draft treaty from the Sarwat–Chamberlain negotiations was rejected and he resigned. The article contradicts itself on his death: its narrative summary says he died at Paris on 22 September 1928, while its dedicated death section says he died of a heart attack, on a personal visit to Paris, on 22 November 1928, and was buried at Cairo after national funerals. It has no religion field, and its text mentions religious officials and the religious establishment only as political actors, never as his affiliation."
