summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الخالق ثروت باشا؛ تُستخدم لوقائع الكيان فقط. تروي قضاءه ونائبًا عامًا ووزارته للعدل ثم الداخلية ورئاستيه للوزراء 1922 و1927–1928 ودوره في إعلان الاستقلال الأحادي سنة 1922 ومفاوضاته مع تشامبرلين ووفاته في باريس سنة 1928."
  en: "English Wikipedia article on Abdel Khalek Sarwat Pasha; used for entity facts only. It recounts his judicial career, his attorney-generalship, his justice and interior ministries, his two premierships of 1922 and 1927–1928, his part in the 1922 Unilateral Declaration of Egyptian Independence, his negotiations with Chamberlain and his death at Paris in 1928."
  es: "Artículo de la Wikipedia en inglés sobre Abdel Khalek Sarwat Pasha; utilizado únicamente para datos sobre la persona. Relata su carrera judicial, su cargo como fiscal general, sus ministerios de justicia e interior, sus dos mandatos como primer ministro en 1922 y 1927-1928, su participación en la Declaración Unilateral de Independencia de Egipto de 1922, sus negociaciones con Chamberlain y su muerte en París en 1928."
  fr: "Article de Wikipédia en anglais sur Abdel Khalek Sarwat Pacha; utilisé uniquement à des fins d’information sur l’entité. Il retrace sa carrière judiciaire, son poste de procureur général, ses ministères de la Justice et de l’Intérieur, ses deux mandats de Premier ministre en 1922 et 1927-1928, son rôle dans la déclaration unilatérale d’indépendance de l’Égypte en 1922, ses négociations avec Chamberlain et sa mort à Paris en 1928."
  ur: "عبدالخالق ثروت پاشا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے عدالتی کیرئیر، ان کے اٹارنی جنرل شپ، ان کی انصاف اور وزارت داخلہ، 1922 اور 1927-1928 کے ان کے دو وزیر اعظم، مصر کی آزادی کے 1922 کے یکطرفہ اعلان میں اس کا حصہ، چیمبرلین کے ساتھ ان کے مذاکرات اور Pa198 میں ان کی موت کا ذکر ہے۔"
  tr: "Abdul Khaleq Tharwat Paşa hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Yargı sistemini, Başsavcı olarak görevini, Adalet Bakanlığı ve ardından İçişleri Bakanlığını, 1922 ve 1927–1928 yıllarındaki bakanlar başbakanlığını, 1922'de tek taraflı bağımsızlık ilanındaki rolünü, Chamberlain ile müzakerelerini ve 1928'de Paris'teki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdul Khaleq Tharwat Pasha; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa peradilannya, posisinya sebagai Jaksa Agung, Kementerian Kehakiman lalu Dalam Negeri, masa jabatan perdana menterinya pada tahun 1922 dan 1927–1928, perannya dalam deklarasi kemerdekaan sepihak pada tahun 1922, negosiasinya dengan Chamberlain, dan kematiannya di Paris pada tahun 1928."
