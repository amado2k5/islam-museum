  en: "English Wikipedia article on Abdel Khalek Sarwat Pasha; used for entity facts only. It recounts his judicial career, his attorney-generalship, his justice and interior ministries, his two premierships of 1922 and 1927–1928, his part in the 1922 Unilateral Declaration of Egyptian Independence, his negotiations with Chamberlain and his death at Paris in 1928."
