summary:
  ar: "الجزء السابع من المفهم لأبي العباس أحمد بن عمر القرطبي (578–656هـ)، بتحقيق يوسف علي بديوي ومحيي الدين ديب مستو وأحمد محمد السيد ومحمود إبراهيم زايد، طبعة دمشق وبيروت (الطبعة الأولى كما يُقرأ في الصفحة الثانية)؛ يضم كتاب الأذكار والدعوات وكتاب الرقاق وكتاب الزهد وكتاب التفسير، مع الفهارس العلمية."
  en: "Volume 7 of al-Mufhim by Abu al-Abbas Ahmad ibn Umar al-Qurtubi (578–656 AH), edited by Yusuf Ali Badiwi, Muhyi al-Din Dib Mustu, Ahmad Muhammad al-Sayyid and Mahmud Ibrahim Zayid; Damascus and Beirut, first edition as printed on the second page. It covers the Book of Remembrance and Supplications, the Book of Softening of Hearts, the Book of Asceticism and the Book of Tafsir, with scholarly indexes."
