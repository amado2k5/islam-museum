label: { ar: "المفهم لما أشكل من تلخيص كتاب مسلم، الجزء السابع", en: "al-Mufhim li-ma Ashkala min Talkhis Kitab Muslim, vol. 7" }
summary:
  ar: "الجزء السابع من المفهم لأبي العباس أحمد بن عمر القرطبي ⁦(578–656هـ)⁩، بتحقيق يوسف علي بديوي ومحيي الدين ديب مستو وأحمد محمد السيد ومحمود إبراهيم زايد، طبعة دمشق وبيروت ⁦(الطبعة الأولى كما يُقرأ في الصفحة الثانية)⁩؛ يضم كتاب الأذكار والدعوات وكتاب الرقاق وكتاب الزهد وكتاب التفسير، مع الفهارس العلمية."
  en: "Volume 7 of al-Mufhim by Abu al-Abbas Ahmad ibn Umar al-Qurtubi (578–656 AH), edited by Yusuf Ali Badiwi, Muhyi al-Din Dib Mustu, Ahmad Muhammad al-Sayyid and Mahmud Ibrahim Zayid; Damascus and Beirut, first edition as printed on the second page. It covers the Book of Remembrance and Supplications, the Book of Softening of Hearts, the Book of Asceticism and the Book of Tafsir, with scholarly indexes."
  es: "Volumen 7 de al-Mufhim de Abu al-Abbas Ahmad ibn Umar al-Qurtubi (578–656 AH), editado por Yusuf Ali Badiwi, Muhyi al-Din Dib Mustu, Ahmad Muhammad al-Sayyid y Mahmud Ibrahim Zayid; Damasco y Beirut, primera edición impresa en la segunda página. Incluye el Libro del Recuerdo y las Súplicas, el Libro del Ablandamiento de los Corazones, el Libro del Ascetismo y el Libro del Tafsir, con índices académicos."
  fr: "Le volume 7 d'al-Mufhim d'Abu al-Abbas Ahmad ibn Umar al-Qurtubi (578-656 AH), édité par Yusuf Ali Badiwi, Muhyi al-Din Dib Mustu, Ahmad Muhammad al-Sayyid et Mahmud Ibrahim Zayid; Damas et Beyrouth, première édition telle qu'imprimée en deuxième page. Il comprend le Livre du Souvenir et des Supplications, le Livre de l'Adoucissement des Cœurs, le Livre de l'Ascétisme et le Livre du Tafsir, avec des index savants."
  ur: "ابو العباس احمد بن عمر القرطبی ⁦(578-656ھ)⁩ کی کتاب المفیم کی جلد 7، جس کی تدوین یوسف علی بدوی، محی الدین دیب مستو، احمد محمد السید اور محمود ابراہیم زید نے کی۔ دمشق اور بیروت، پہلا ایڈیشن جیسا کہ دوسرے صفحہ پر چھپا ہے۔ اس میں ذکر اور دعاؤں کی کتاب، دلوں کو نرم کرنے والی کتاب، علمی اشاریہ کے ساتھ کتاب التفسیر اور کتاب تفسیر کا احاطہ کیا گیا ہے۔"
  tr: "Yusuf Ali Badiwi, Muhyiddin Dib Mastu, Ahmed al-Sayyid ve Mahmud İbrahim Zayed tarafından düzenlenen Ebu el-Abbas Ahmed bin Ömer el-Kurtubi (578–656 H) tarafından yayımlanan El-Mufhim'in yedinci cildi, Şam ve Beyrut baskıları (birinci baskı ikinci sayfada okunur); Eğkar Kitabı, Dualar, Riqaq Kitabı, Kitab al-Zuhd ve Tafsir Kitabı ile bilimsel dizinleri içerir."
  id: "Jilid ketujuh Al-Mufhim oleh Abu al-Abbas Ahmad ibn Umar al-Qurtubi (578–656 H), disunting oleh Yusuf Ali Badiwi, Muhyiddin Dib Mastu, Ahmad Muhammad al-Sayyid, dan Mahmoud Ibrahim Zayed, edisi Damaskus dan Beirut (edisi pertama dibaca pada halaman dua); memuat Kitab Adhkar, Supplications, Book of Riqaq, Kitab al-Zuhd, dan Book of Tafsir, beserta indeks ilmiah."
