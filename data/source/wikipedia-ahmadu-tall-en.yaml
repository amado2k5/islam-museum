reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 21 June 1836 during his father Umar Tall's stay in the Sokoto Caliphate, eldest son of Umar Tall and of Aisha, a Hausa slave — his half-brothers 'looked down on him due to his mother's slave status'; raised at Dinguiraye; named Amir al-Muminin and Laamdo Dioulbé by his father in 1859; conquered Ségou, heart of the Bambara Empire, on 10 March 1861 and was left there as Almami; succeeded his father in 1864, though the empire never again cohered (Tidiani Tall at Bandiagara, Habibou at Dinguiraye, Mokhtar in Kaarta; rebellions of 1869 and 1885, Muntaga of Nioro blowing up his powder magazine rather than surrender); the Gallieni mission and the Treaty of Nango (1880, never ratified by Paris) and the Treaty of Gory (12 May 1887); Archinard's offensive from 1889, the fall of Ségou (1890), the destruction of his last stand at Youri (3 January 1891), the move to Bandiagara, its fall on 29 April 1893 and Aguibou's installation (4 May 1893); his refusal of Archinard's offer of retirement, his eastward exile and his death at Maykouki near Sokoto on 15 December 1897; the balanced legacy section (thirty years' resistance to colonial encroachment, and the charge that he and his father were themselves imperialists imposing Toucouleur minority rule). His titles are given as 'Laamdo Dioulbé 1864–1893, Faama of Ségou 1864–1884' (the French article dates his rule 1864–1890 — recorded as a framing difference). The article gives his full name with the nisba at-Tijani but narrates no initiation or affiliation of his own; his father's Tijani sheikhdom is his father's attestation, so the record's faith is unknown, as the faith note states. NOTE: the article's conquest narrative dates his appointment over conquered Massina to '1962', an obvious typographical error for 1862 in the father's lifetime; the record does not use that sentence."
