summary:
  ar: "دراسة في مجلة إندونيسية محكّمة ⁦(سيرديكا، 2025)⁩ عن دعوة سالم أ. في الله التاريخية عبر يوتيوب؛ تذكر مولده في يوجياكارتا في 21 مارس 1984 ونشاطه في مسجد جوغوكاريان وإشرافه على مجلس جيجاك نبي."
  en: "Indonesian journal study (Cerdika, 2025) of Salim A. Fillah's historical dawah on YouTube; it states that he was born in Yogyakarta on 21 March 1984, is an activist of Masjid Jogokariyan and leads its Majelis Jejak Nabi study circle."
  es: "Un estudio publicado en una revista indonesia (Cerdika, 2025) sobre la dawah histórica de Salim A. Fillah en YouTube afirma que nació en Yogyakarta el 21 de marzo de 1984, es activista de la Mezquita Jogokariyan y dirige su círculo de estudio Majelis Jejak Nabi."
  fr: "Une étude publiée dans une revue indonésienne (Cerdika, 2025) sur la dawah historique de Salim A. Fillah sur YouTube indique qu'il est né à Yogyakarta le 21 mars 1984, qu'il est un militant de la Masjid Jogokariyan et qu'il dirige son cercle d'étude Majelis Jejak Nabi."
  ur: "یوٹیوب پر سلیم اے فلہ کی تاریخی دعوت کا انڈونیشیائی جریدے کا مطالعہ ⁦(سرڈیکا، 2025)⁩؛ اس میں کہا گیا ہے کہ وہ یوگیکارتا میں 21 مارچ 1984 کو پیدا ہوا تھا، وہ مسجد جوگوکاریان کا کارکن ہے اور اس کے مجلس جیجک نبی کے مطالعاتی حلقے کی قیادت کرتا ہے۔"
title: "Dakwah Historis di Era Digital: Transmisi Materi Sejarah Islam Ustadz Salim A. Fillah di Media YouTube"
