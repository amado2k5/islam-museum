reliability_note: "Peer-reviewed journal study of his digital dawah, read in this session. It states that Ustadz Salim A. Fillah was born in Yogyakarta on 21 March 1984, that besides preaching he is known as a writer of Islamic books, that his name became widely known after Nikmatnya Pacaran Setelah Pernikahan, and that he is an activist of Masjid Jogokariyan in Yogyakarta where he serves as caretaker (pengasuh) of the Majelis Jejak Nabi study circle; its subject is his transmission of Islamic-history material on YouTube. It names no school for him."
