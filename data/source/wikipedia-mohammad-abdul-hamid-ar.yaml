summary:
  ar: "مقالة ويكيبيديا العربية عن محمد عبد الحميد (عنوانها مكتوب «محمد عبد الحيمد» بخطأ إملائي في الأصل)؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها ديانتَه «الإسلام، وأهل السنة والجماعة» ويذكر دكا مكانًا لمولده، بينما يذكر متنها أنه وُلد في كامالبور بمنطقة كيشوريغانج في 1 يناير 1944 كما في المقالة الإنجليزية."
  en: "Arabic Wikipedia article on Mohammad Abdul Hamid (its title is misspelled 'Muhammad Abd al-Haymid' in the original); used for entity facts only. Its infobox gives his religion as 'Islam, and Ahl al-Sunna wa'l-Jama'a' (Sunni) and gives Dhaka as his birthplace, while its own lead says he was born at Kamalpur in Kishoreganj District on 1 January 1944, as the English article gives."
