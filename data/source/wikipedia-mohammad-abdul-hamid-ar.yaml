summary:
  ar: "مقالة ويكيبيديا العربية عن محمد عبد الحميد ⁦(عنوانها مكتوب «محمد عبد الحيمد» بخطأ إملائي في الأصل)⁩؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها ديانتَه «الإسلام، وأهل السنة والجماعة» ويذكر دكا مكانًا لمولده، بينما يذكر متنها أنه وُلد في كامالبور بمنطقة كيشوريغانج في 1 يناير 1944 كما في المقالة الإنجليزية."
  en: "Arabic Wikipedia article on Mohammad Abdul Hamid (its title is misspelled 'Muhammad Abd al-Haymid' in the original); used for entity facts only. Its infobox gives his religion as 'Islam, and Ahl al-Sunna wa'l-Jama'a' (Sunni) and gives Dhaka as his birthplace, while its own lead says he was born at Kamalpur in Kishoreganj District on 1 January 1944, as the English article gives."
  es: "Artículo de Wikipedia en árabe sobre Mohammad Abdul Hamid (en el original aparece mal escrito como 'Muhammad Abd al-Haymid'); utilizado únicamente para datos sobre la persona. Su ficha informativa indica que su religión es 'Islam, y Ahl al-Sunna wa'l-Jama'a' (Suní)' y que nació en Dhaka, mientras que su propio titular afirma que nació en Kamalpur, en el distrito de Kishoreganj, el 1 de enero de 1944, tal como se indica en el artículo en inglés."
  fr: "L'article de Wikipédia en arabe sur Mohammad Abdul Hamid (dont le titre est mal orthographié « Muhammad Abd al-Haymid » dans l'original) est utilisé uniquement pour les informations le concernant. Son infobox indique que sa religion est l'islam et qu'il appartient à la sunnisme (Ahl al-Sunna wa'l-Jama'a) et que son lieu de naissance est Dhaka, tandis que son introduction précise qu'il est né à Kamalpur, dans le district de Kishoreganj, le 1er janvier 1944, comme l'indique l'article en anglais."
  ur: "محمد عبدالحمید پر عربی ویکیپیڈیا مضمون ⁦(اس کا عنوان اصل میں 'محمد عبد الحمید' غلط لکھا گیا ہے)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا انفو باکس اس کا مذہب 'اسلام اور اہل السنۃ والجماعت' ⁦(سنی)⁩ دیتا ہے اور ڈھاکہ کو اس کی جائے پیدائش بتاتا ہے، جب کہ اس کے اپنے لیڈر کا کہنا ہے کہ وہ یکم جنوری 1944 کو کشور گنج ضلع کے کمال پور میں پیدا ہوا تھا، جیسا کہ انگریزی مضمون دیتا ہے۔"
