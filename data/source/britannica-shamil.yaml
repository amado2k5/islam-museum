reliability_note: "Independent encyclopedia account, read in full on 24 October 2026. It dates his birth '1797?' at Gimry and his death 'March 1871, Medina?' — both with the entry's own question marks, against the day-dates of the English Wikipedia article and Wikidata; the discrepancy is recorded in the person record. It attests independently of Wikipedia that in 1830 he joined the Muridis, a Sufi (Islamic mystical) brotherhood — the Dagestani Muridiyya of the Naqshbandi tradition — and that he was elected third imam in 1834, surrendered on 25 August (6 September New Style) 1859 at Mount Gunib, was exiled to Kaluga, and made the Hajj in 1870 with the Tsar's permission. It names no madhhab."
