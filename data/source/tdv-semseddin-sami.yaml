reliability_note: "A signed encyclopedia entry in the Turkish Religious Foundation's İslâm Ansiklopedisi, read at the online edition on 25 October 2026; used for entity facts. Its opening confirms: born 1 June 1850 in the village of Fraşiri (Frashëri), Pırmeti (Përmet) district of the Ergiri (Gjirokastër) sanjak of the Yanya (Ioannina) vilayet — agreeing with the English and Albanian articles and Wikidata on the birth date and place; in Albanian literature he is known rather as Sami Frashëri; his father Hâlid Bey and grandfather Durmuş Bey were of a line of timar beys who came from Berat to Frashër, and his mother Emine Hanım descended from İmrahor İlyas Bey; he began his education at Frashër, taking Arabic and Persian lessons from Kalkandelenli Mahmud Efendi; after his father's death (1859) and his mother's (1861) he went with his elder brother Abdül to Ioannina in 1865, enrolled with his elder brother Naim at the Zosimea Greek high school and finished its eight-year course in seven years (1871). The entry names no school of law or personal order affiliation for him."
