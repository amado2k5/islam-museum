label: { en: "Şemseddin Sâmi — TDV İslâm Ansiklopedisi (Uçman)" }
summary:
  ar: "مدخل «شمس الدين سامي» في دائرة المعارف الإسلامية التركية (TDV) بقلم عبد الله أوتشمان (2010)؛ يؤكد ميلاده في 1 يونيو 1850 في قرية فراشر بقضاء بيرميت، وبدء تعليمه فيها."
  en: "The TDV İslâm Ansiklopedisi entry 'Şemseddin Sâmi' by Abdullah Uçman (2010); it confirms his birth on 1 June 1850 in the village of Frashër, Përmet district, and the start of his education there."
  es: "La entrada 'Şemseddin Sâmi' en la base de datos TDV İslâm Ansiklopedisi, realizada por Abdullah Uçman (2010), confirma su nacimiento el 1 de junio de 1850 en la aldea de Frashër, distrito de Përmet, y el inicio de su educación allí."
  fr: "L'entrée TDV İslâm Ansiklopedisi 'Şemseddin Sâmi' par Abdullah Uçman (2010); elle confirme sa naissance le 1er juin 1850 dans le village de Frashër, district de Përmet, et le début de son éducation là-bas."
  ur: "TDV İslâm Ansiklopedisi entry 'Semseddin Sami' از عبداللہ عثمان (2010)؛ یہ تصدیق کرتا ہے کہ اس کی پیدائش 1 جون 1850 کو فریشر گاؤں، پرمیٹ ضلع میں ہوئی، اور وہیں اس کی تعلیم کا آغاز ہوا۔"
  tr: "Abdullah Öçman'ın Türk İslam Ansiklopedisi'nde (TDV) (TDV) yayımlanan \"Şemseddin Sami\" maddesi, onun 1 Haziran 1850'de Bermit ilçesindeki Farasher köyünde doğduğunu ve eğitimine orada başladığını doğrulamaktadır."
  id: "Entri \"Shams al-Din Sami\" dalam Ensiklopedia Islam Turki (TDV) oleh Abdullah Öçman (2010) mengonfirmasi kelahirannya pada 1 Juni 1850 di desa Farasher di distrik Bermit, dan bahwa ia memulai pendidikannya di sana."
