reliability_note: "Signed research post, read in full in Chrome on 7 November 2026. Used for Bērziņš (1944–2021; Leningrad State University; poet and translator; Lund University; a member of the team for a new Latvian Bible; he identified as Lutheran, which the post states), his collaborator Jānis Ešots (1966–2011), the first edition by Zvaigzne ABC in Riga (2007, the post correcting The Muslim 500's 2009, though it also mentions a 2009 first edition), the 2011 second edition by Neputns, his stated literary aims and method, and its use by Latvian scholars. The other Latvian translations (an Ahmadiyya partial one; Imants Kalniņš, 2011) are context."
