  ar: "مقالة ويكيبيديا الإنجليزية عن فهميدة ميرزا (بعنوان «Fahmida Mirza»)؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها في كراتشي سنة 1956 وشهادتها في الطب من جامشورو، وخمس فترات في الجمعية الوطنية، ورئاستها لها من 2008 إلى 2013 أول امرأة في المنصب، وخروجها من حزب الشعب سنة 2018 ووزارتها للتنسيق بين الأقاليم حتى 2022، ولا تذكر ديانة لها."
  en: "English Wikipedia article on Fehmida Mirza (titled 'Fahmida Mirza'); used for entity facts only. It records her Karachi birth in 1956, her MBBS from Jamshoro, her five National Assembly terms, her speakership of 2008–2013 as the first woman in the office, her 2018 departure from the PPP and her ministry of inter-provincial coordination to 2022. It records no religion for her."
