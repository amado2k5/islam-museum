summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فهميدة ميرزا ⁦(بعنوان «Fahmida Mirza»)⁩؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها في كراتشي سنة 1956 وشهادتها في الطب من جامشورو، وخمس فترات في الجمعية الوطنية، ورئاستها لها من 2008 إلى 2013 أول امرأة في المنصب، وخروجها من حزب الشعب سنة 2018 ووزارتها للتنسيق بين الأقاليم حتى 2022، ولا تذكر ديانة لها."
  en: "English Wikipedia article on Fehmida Mirza (titled 'Fahmida Mirza'); used for entity facts only. It records her Karachi birth in 1956, her MBBS from Jamshoro, her five National Assembly terms, her speakership of 2008–2013 as the first woman in the office, her 2018 departure from the PPP and her ministry of inter-provincial coordination to 2022. It records no religion for her."
  es: "Artículo de la Wikipedia en inglés sobre Fehmida Mirza (titulado «Fahmida Mirza»); utilizado únicamente para datos sobre la persona. Registra su nacimiento en Karachi en 1956, su licenciatura en Medicina y Cirugía (MBBS) en Jamshoro, sus cinco mandatos en la Asamblea Nacional, su presidencia de la Asamblea entre 2008 y 2013 como la primera mujer en ocupar el cargo, su salida del PPP en 2018 y su ministerio de coordinación interprovincial hasta 2022. No registra ninguna religión para ella."
  fr: "L'article de Wikipédia en anglais consacré à Fehmida Mirza (intitulé « Fahmida Mirza ») est utilisé uniquement à des fins d'information sur l'entité. Il mentionne sa naissance à Karachi en 1956, son diplôme de médecine (MBBS) obtenu à Jamshoro, ses cinq mandats à l'Assemblée nationale, son poste de présidente de l'Assemblée de 2008 à 2013 (première femme à occuper cette fonction), son départ du Parti du peuple pakistanais (PPP) en 2018 et son ministère de la Coordination interprovinciale jusqu'en 2022. Aucune information n'est fournie concernant sa religion."
  ur: "فہمیدہ مرزا پر انگریزی ویکیپیڈیا مضمون ⁦(عنوان 'فہمیدہ مرزا')⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1956 میں اس کی کراچی پیدائش، جامشورو سے اس کی ایم بی بی ایس، اس کی پانچ قومی اسمبلی کی مدت، 2008-2013 کی اس کی اسپیکر شپ بطور دفتر میں پہلی خاتون، 2018 میں پی پی پی سے اس کی رخصتی اور 2022 تک بین الصوبائی رابطہ کی وزارت درج ہے۔ اس میں اس کے لیے کوئی مذہب درج نہیں ہے۔"
  tr: "Fahmida Mirza hakkında İngilizce Wikipedia makalesi (\"Fahmida Mirza\" başlıklı); yalnızca kurumun gerçekleri için kullanılmıştır. 1956'da Karaçi'de doğmasını, Jamshoro'dan tıp diplomasını, Ulusal Meclis'te beş dönem görevini, 2008-2013 yılları arasında ilk kadın olarak başkanlığını, 2018'de Halk Partisi'nden ayrılışını ve 2022'ye kadar eyaletler arası koordinasyon bakanlığını belgelemektedir, dini belirtilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Fahmida Mirza (berjudul \"Fahmida Mirza\"); hanya digunakan untuk fakta entitas tersebut. Artikel ini mendokumentasikan kelahirannya di Karachi pada tahun 1956, gelar kedokterannya dari Jamshoro, lima masa jabatan di Majelis Nasional, masa jabatannya dari 2008 hingga 2013 sebagai perempuan pertama yang menjabat, meninggalkan Partai Rakyat pada 2018, dan kementerian koordinasi antarprovinsi hingga 2022, tanpa menyebutkan agamanya."
