reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers her birth on 20 December 1956 in Karachi, daughter of the Hyderabad politician and journalist Qazi Abdul Majeed Abid; her schooling at St Mary's Convent, Hyderabad (1972) and her MBBS from Liaquat Medical College, Jamshoro (1982); her work as chief executive of an advertising company and of Mirza Sugar Mills; her five elections from Badin (1997, 2002, 2008, 2013, 2018); her election as Speaker on 19 March 2008 with 249 votes against 70 — the article's lead calls her the 16th Speaker and its speakership section the 18th, an internal discrepancy the person record notes without relying on the number — and her tenure to 3 June 2013 as the first woman to hold the office; her resignation from the PPP in May 2018, her joining the Grand Democratic Alliance, the State Bank's declaration in June 2018 that she and her husband were loan defaulters, and her service as Federal Minister for Inter Provincial Coordination from 20 August 2018 to 10 April 2022 in Imran Khan's cabinet; her marriage to Zulfiqar Mirza and their two sons and two daughters. The article states no religion; the faith segment rests on the note's account of the other sources. The article's spelling is 'Fahmida'; the person record keeps the queue's and Urdu usage 'Fehmida' as its label, recording the variant. Read in full on 24 October 2026."
