summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشاعر الإيراني السوفييتي أبو القاسم لاهوتي (1887–1957)؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في كرمانشاه في 12 أكتوبر 1887 ووفاته في موسكو في 16 مارس 1957، وتروي خدمته في الدرك وانتفاضة تبريز 1922 وفراره إلى الاتحاد السوفييتي وتأسيسه الشعر الطاجيكي السوفييتي وكتابته كلمات نشيد جمهورية طاجيكستان السوفييتية."
  en: "English Wikipedia article on the Iranian-Soviet poet Abolqasem Lahouti (1887-1957); used for entity facts only. It gives his birth at Kermanshah on 12 October 1887 and his death at Moscow on 16 March 1957, and recounts his gendarmerie service, the 1922 Tabriz uprising, his flight to the Soviet Union, his founding role in Soviet Tajik poetry, and his authorship of the Tajik SSR anthem lyrics."
  es: "Artículo de la Wikipedia en inglés sobre el poeta iraní-soviético Abolqasem Lahouti (1887-1957); utilizado únicamente para datos biográficos. Indica su nacimiento en Kermanshah el 12 de octubre de 1887 y su fallecimiento en Moscú el 16 de marzo de 1957, y relata su servicio en la gendarmería, el levantamiento de Tabriz de 1922, su huida a la Unión Soviética, su papel fundamental en la poesía tayika soviética y la autoría de la letra del himno de la RSS de Tayikistán."
  fr: "Article de Wikipédia en anglais sur le poète irano-soviétique Abolqasem Lahouti (1887-1957); utilisé uniquement à des fins d’information biographique. Il indique sa naissance à Kermanshah le 12 octobre 1887 et sa mort à Moscou le 16 mars 1957, et relate son service dans la gendarmerie, le soulèvement de Tabriz de 1922, sa fuite vers l’Union soviétique, son rôle fondateur dans la poésie tadjike soviétique et sa contribution à l’écriture des paroles de l’hymne de la RSS du Tadjikistan."
