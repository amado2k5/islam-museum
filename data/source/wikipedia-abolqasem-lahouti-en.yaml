summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشاعر الإيراني السوفييتي أبو القاسم لاهوتي (1887–1957)؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في كرمانشاه في 12 أكتوبر 1887 ووفاته في موسكو في 16 مارس 1957، وتروي خدمته في الدرك وانتفاضة تبريز 1922 وفراره إلى الاتحاد السوفييتي وتأسيسه الشعر الطاجيكي السوفييتي وكتابته كلمات نشيد جمهورية طاجيكستان السوفييتية."
  en: "English Wikipedia article on the Iranian-Soviet poet Abolqasem Lahouti (1887-1957); used for entity facts only. It gives his birth at Kermanshah on 12 October 1887 and his death at Moscow on 16 March 1957, and recounts his gendarmerie service, the 1922 Tabriz uprising, his flight to the Soviet Union, his founding role in Soviet Tajik poetry, and his authorship of the Tajik SSR anthem lyrics."
