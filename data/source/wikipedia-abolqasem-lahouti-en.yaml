reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his birth name as Abolqasem Elhami, his father Mirza Ahmad Elhami as a cobbler and religious poet, his early clerical schooling and his poems on Islam written in Bulgaria, his death sentence at Qom, his marriage to Cecilia Banu, and his death at Moscow (the infobox says Moscow Oblast). It makes no statement of Lahouti's own religion anywhere in its text; its categories file him under 'Iranian Marxists', a political classification."
