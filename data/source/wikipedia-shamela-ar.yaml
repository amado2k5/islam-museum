  ar: "مقالة ويكيبيديا العربية «المكتبة الشاملة»، المراجعة 76754458 ⁦(25 سبتمبر 2026)⁩؛ لوقائع الكيان فقط: برنامج وموقع لتصفح الكتب الإسلامية والتراثية والبحث فيها، صدر أولًا في 1 أبريل 2005، ونحو 8000 كتاب، ووصف جريدة الرياض له سنة 2008، ورعايته منذ 1433هـ، وإصداراته اللاحقة."
  en: "Arabic Wikipedia article 'al-Maktaba al-Shamela', revision 76754458 (25 September 2026); entity facts only: a program and website for browsing and searching Islamic and classical Arabic books, first released on 1 April 2005, its roughly 8,000 books, al-Riyadh's description of it in 2008, its sponsorship from 1433 AH, and its later releases."
  ur: "عربی ویکیپیڈیا کا مضمون «المكتبة الشاملة»، نظرِ ثانی 76754458 ⁦(25 ستمبر 2026)⁩؛ صرف حقائق: اسلامی اور عربی ورثے کی کتابوں کی تلاش اور مطالعے کا پروگرام اور ویب سائٹ، پہلا اجرا 1 اپریل 2005، تقریباً 8000 کتابیں، 2008 میں الریاض کا تبصرہ، 1433ھ سے سرپرستی، اور بعد کے اجرا۔"
