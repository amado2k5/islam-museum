summary:
  ar: "مقالة ويكيبيديا الروسية عن خورشيدبانو ناتوان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في 6 أغسطس 1832 ووفاتها «في سبتمبر – 8 أكتوبر 1897» على خلاف باقي الطبعات، وتذكر في قسم حياتها الخاصة أن أسرة جوانشير الحاكمة التي تنتمي إليها «كانوا مسلمين شيعة» — قولٌ عن الأسرة لا عنها شخصيًا — وتنسب إليها بناء مسجد في شوشا ضمن أعمالها. لا تسمي مذهبًا لها شخصيًا."
  en: "Russian Wikipedia article on Khurshidbanu Natavan; used for entity facts only. It gives her birth on 6 August 1832 and her death as 'September – 8 October 1897', diverging from the other editions, and states in its Private life section that the Javanshir ruling family, to which she belonged, 'were Shia Muslims' — a statement about her family, not about her personally; it also credits her with building a mosque in Shusha among other buildings. It names no school for her personally."
