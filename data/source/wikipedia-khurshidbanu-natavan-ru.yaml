summary:
  ar: "مقالة ويكيبيديا الروسية عن خورشيدبانو ناتوان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في 6 أغسطس 1832 ووفاتها «في سبتمبر – 8 أكتوبر 1897» على خلاف باقي الطبعات، وتذكر في قسم حياتها الخاصة أن أسرة جوانشير الحاكمة التي تنتمي إليها «كانوا مسلمين شيعة» — قولٌ عن الأسرة لا عنها شخصيًا — وتنسب إليها بناء مسجد في شوشا ضمن أعمالها. لا تسمي مذهبًا لها شخصيًا."
  en: "Russian Wikipedia article on Khurshidbanu Natavan; used for entity facts only. It gives her birth on 6 August 1832 and her death as 'September – 8 October 1897', diverging from the other editions, and states in its Private life section that the Javanshir ruling family, to which she belonged, 'were Shia Muslims' — a statement about her family, not about her personally; it also credits her with building a mosque in Shusha among other buildings. It names no school for her personally."
  es: "Artículo de la Wikipedia rusa sobre Khurshidbanu Natavan; utilizado únicamente para datos sobre la persona. Indica que nació el 6 de agosto de 1832 y falleció entre septiembre y el 8 de octubre de 1897, lo que difiere de otras ediciones. En la sección «Vida privada», afirma que la familia gobernante Javanshir, a la que pertenecía, era musulmana chiíta, una afirmación sobre su familia, no sobre ella personalmente. También le atribuye la construcción de una mezquita en Shusha, entre otros edificios. No menciona ninguna escuela a su nombre."
  fr: "L'article de Wikipédia en russe consacré à Khurshidbanu Natavan, utilisé uniquement pour des informations factuelles, indique sa naissance le 6 août 1832 et sa mort entre septembre et le 8 octobre 1897, contrairement à d'autres éditions. La section « Vie privée » précise que la famille régnante du Javan, à laquelle elle appartenait, était musulmane chiite – une affirmation concernant sa famille et non sa personne. L'article lui attribue également la construction d'une mosquée à Choucha, entre autres édifices. Aucune école n'est mentionnée à son nom."
  ur: "خورشید بانو نتاوان پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 6 اگست 1832 کو اس کی پیدائش اور اس کی موت 'ستمبر - 8 اکتوبر 1897' کے طور پر ہوئی، دوسرے ایڈیشن سے ہٹ کر، اور اس کے نجی زندگی کے حصے میں کہا گیا ہے کہ جوانشیر حکمران خاندان، جس سے وہ تعلق رکھتی تھی، 'شیعہ مسلمان تھے' - اس کے خاندان کے بارے میں بیان، ذاتی طور پر اس کے بارے میں نہیں۔ یہ اسے دوسری عمارتوں کے ساتھ شوشہ میں ایک مسجد بنانے کا سہرا بھی دیتا ہے۔ اس نے ذاتی طور پر اس کے لیے کسی اسکول کا نام نہیں لیا۔"
