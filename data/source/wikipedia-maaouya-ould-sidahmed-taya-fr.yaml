summary:
  ar: "مقالة ويكيبيديا الفرنسية عن معاوية ولد سيدي أحمد الطايع ⁦(بعنوان «Maaouiya»)⁩؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في 28 نوفمبر 1941 في أطار ومسيرته العسكرية ورئاسته والإطاحة به. لا يذكر نصّها دينه الشخصي؛ وصندوق معلوماتها يسمّي الإسلام."
  en: "French Wikipedia article on Maaouya Ould Sid'Ahmed Taya (titled 'Maaouiya'); used for entity facts only. It recounts his birth on 28 November 1941 at Atar, his military career, his presidency and his overthrow. Its text says nothing about his personal religion; its infobox names Islam."
  es: "Artículo de la Wikipedia en francés sobre Maaouya Ould Sid'Ahmed Taya (titulado «Maaouiya»); utilizado únicamente para datos sobre la persona. Relata su nacimiento el 28 de noviembre de 1941 en Atar, su carrera militar, su presidencia y su derrocamiento. El texto no menciona su religión personal; en su ficha informativa se indica que es islam."
  fr: "Article de Wikipédia en français sur Maaouya Ould Sid'Ahmed Taya (intitulé « Maaouiya »); utilisé uniquement pour les informations sur l'entité. Il relate sa naissance le 28 novembre 1941 à Atar, sa carrière militaire, sa présidence et son renversement. Le texte ne mentionne rien de sa religion personnelle; son infobox indique l'islam."
  ur: "معاویہ اولد سید احمد تایا پر فرانسیسی ویکیپیڈیا مضمون ⁦(عنوان 'معاویہ')⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 28 نومبر 1941 کو عطار میں ان کی پیدائش، ان کے فوجی کیریئر، اس کی صدارت اور ان کا تختہ الٹنے کا ذکر کرتا ہے۔ اس کا متن اس کے ذاتی مذہب کے بارے میں کچھ نہیں کہتا۔ اس کے انفو باکس کا نام اسلام ہے۔"
  tr: "Maaouiya Ould Sidi Ahmed Taya hakkında Fransızca Wikipedia makalesi (\"Maaouiya\" başlığıyla); yalnızca varlığın gerçekleri için kullanılır. 28 Kasım 1941'de Atar'da doğumunu, askeri kariyerini, liderliğini ve devrilişini anlatır. Metinde kişisel dininden bahsedilmez; bilgi kutusunda İslam olarak adlandırılır."
  id: "Artikel Wikipedia Prancis tentang Maaouiya Ould Sidi Ahmed Taya (berjudul \"Maaouiya\"); hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 28 November 1941 di Atar, karier militernya, kepemimpinan, dan penggulingannya. Teksnya tidak menyebutkan agama pribadinya; kotak infonya menyebutnya Islam."
