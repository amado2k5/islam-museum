  ar: "مقالة ويكيبيديا الأذربيجانية عن حميدة محمد قلي زاده (جوانشير)؛ تُستخدم لوقائع الكيان فقط. سيرة وافية: نشأتها في كهريزلي في بيت أبيها المؤرخ أحمد بك جوانشير، وزواجاها، ودعمها المالي والمعنوي لمجلة «ملا نصر الدين»، وقصة علاجها الشاعر صابر في تفليس، ومدرستها في كهريزلي (1912)، ودفنها في رواق الشرف بباكو بجانب قبر زوجها. لا تذكر شيئًا عن مذهبها."
  en: "Azerbaijani Wikipedia article on Hamida Mammadguluzadeh (Javanshir); used for entity facts only. A full biography: her upbringing at Kahrizli in the house of her father the historian Ahmad bey Javanshir, her two marriages, her financial and moral support of Molla Nasreddin, the episode of the poet Sabir's treatment at Tiflis, her Kahrizli school (1912), and her burial in the Alley of Honours at Baku beside her husband. It makes no statement about her school of religion."
