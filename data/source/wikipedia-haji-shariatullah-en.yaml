reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth in 1781 at Shamail in Faridpur, his years at Makkah from 1799 studying fiqh under the Hanafi jurist Tahir al-Sumbal Makki, who introduced him to tasawwuf and the Qadiriyya, his founding of the Faraizi movement on his return, and his death in 1840. Its infobox gives his denomination as Sunni, his jurisprudence as Hanafi and his tariqa as Qadiri, and its Teachings section states that his movement reformed Bengali Muslim practice on the basis of the Hanafi school — attestations the museum's faith note weighs together with Banglapedia. It rests chiefly on Muin-ud-Din Ahmad Khan's 1963 study in the Journal of the Pakistan Historical Society and on Banglapedia. Checked 1 November 2026."
