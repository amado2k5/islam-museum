reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026; the article was fetched by revision id through the MediaWiki API and the returned revid asserted equal to 76623332 before any claim was drawn. The title «أحمد ليمو» is a redirect to this article. Its infobox is entirely empty, including the religion field, and its text names no madhhab or creed for him. It records, from a 2013 Daily Trust interview, that his father named him Shehu Ahmadu after Ahmad al-Tijani and that he later Arabicised Shehu to Sheikh; a name given by a parent after a shaykh is not an attestation of the son's own affiliation. Much of the biography rests on the King Faisal International Prize's own profile of its 2014 laureate, cited throughout."
