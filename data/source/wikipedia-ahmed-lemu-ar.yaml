summary:
  ar: "مقالة ويكيبيديا العربية «شيخ أحمد ليمو»؛ تُستخدم لوقائع الكيان فقط. تثبت ميلاده في ليمو في 20 رجب 1348 (21 ديسمبر 1929) ووفاته في 9 جمادى الأولى 1442 (24 ديسمبر 2020)، وقصة اسمه «شيهو أحمدو» الذي سمّاه به أبوه نسبة إلى أحمد التيجاني، ومساره التعليمي في نيجيريا ولندن وعمله التربوي والقضائي وجوائزه، معتمدة في كثير منها على صفحة جائزة الملك فيصل العالمية."
  en: "Arabic Wikipedia article 'Sheikh Ahmed Lemu'; used for entity facts only. It gives his birth at Lemu on 20 Rajab 1348 (21 December 1929) and his death on 9 Jumada al-Awwal 1442 (24 December 2020), the story of his birth name Shehu Ahmadu, given him by his father after Ahmad al-Tijani, his education in Nigeria and London, his teaching and judicial career and his awards, drawing in large part on the King Faisal Prize profile."
