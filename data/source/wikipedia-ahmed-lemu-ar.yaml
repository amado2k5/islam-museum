summary:
  ar: "مقالة ويكيبيديا العربية «شيخ أحمد ليمو»؛ تُستخدم لوقائع الكيان فقط. تثبت ميلاده في ليمو في 20 رجب 1348 ⁦(21 ديسمبر 1929)⁩ ووفاته في 9 جمادى الأولى 1442 ⁦(24 ديسمبر 2020)⁩، وقصة اسمه «شيهو أحمدو» الذي سمّاه به أبوه نسبة إلى أحمد التيجاني، ومساره التعليمي في نيجيريا ولندن وعمله التربوي والقضائي وجوائزه، معتمدة في كثير منها على صفحة جائزة الملك فيصل العالمية."
  en: "Arabic Wikipedia article 'Sheikh Ahmed Lemu'; used for entity facts only. It gives his birth at Lemu on 20 Rajab 1348 (21 December 1929) and his death on 9 Jumada al-Awwal 1442 (24 December 2020), the story of his birth name Shehu Ahmadu, given him by his father after Ahmad al-Tijani, his education in Nigeria and London, his teaching and judicial career and his awards, drawing in large part on the King Faisal Prize profile."
  es: "Artículo en árabe de la Wikipedia «Sheikh Ahmed Lemu»; utilizado únicamente para datos sobre la persona. Describe su nacimiento en Lemu el 20 de Rajab de 1348 (21 de diciembre de 1929) y su fallecimiento el 9 de Jumada al-Awwal de 1442 (24 de diciembre de 2020), la historia de su nombre de nacimiento, Shehu Ahmadu, que le dio su padre en honor a Ahmad al-Tijani, su educación en Nigeria y Londres, su carrera docente y judicial, y sus premios, basándose en gran medida en el perfil del Premio Rey Faisal."
  fr: "L'article de Wikipédia en arabe intitulé « Cheikh Ahmed Lemu » est utilisé uniquement pour des informations factuelles. Il relate sa naissance à Lemu le 20 Rajab 1348 (21 décembre 1929) et son décès le 9 Jumada al-Awwal 1442 (24 décembre 2020), l'origine de son nom de naissance, Shehu Ahmadu, donné par son père en hommage à Ahmad al-Tijani, ses études au Nigeria et à Londres, sa carrière d'enseignant et de juge, ainsi que ses distinctions, en s'appuyant en grande partie sur le profil du prix du roi Faisal."
  ur: "عربی ویکیپیڈیا مضمون 'شیخ احمد لیمو'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 20 رجب 1348 ⁦(21 دسمبر 1929)⁩ کو لیمو میں ان کی پیدائش اور 9 جمادی الاول 1442 ⁦(24 دسمبر 2020)⁩ کو ان کی وفات ہوئی، ان کے پیدائشی نام شیہو احمدو کی کہانی، جسے ان کے والد نے احمد التیجانی کے بعد دیا، نائیجیریا اور لندن میں ان کی تعلیم، ان کی تعلیم اور شاہی نگہداشت کے بڑے حصے میں شاہی اعزازات۔ پروفائل"
  tr: "Arapça Vikipedi makalesi \"Şeyh Ahmed Limo\" yalnızca varlığın gerçekleri için kullanılmıştır. Limuzin'de doğumu 20 Rajab 1348 (21 Aralık 1929) ve ölümü 9 Jumada al-Awwal 1442 (24 Aralık 2020) tarihinde doğrulanmıştır; babasının Ahmed Al-Tijani'nin adını verdiği \"Shehu Ahmadu\" adının hikayesi, Nijerya ve Londra'daki eğitim kariyeri, eğitim ve yargı çalışmaları ile ödülleri, bunların çoğu Kral Faysal Uluslararası Ödülü sayfasına dayanmaktadır."
  id: "Artikel Wikipedia berbahasa Arab \"Sheikh Ahmed Limo\" hanya digunakan untuk fakta entitas tersebut. Kelahirannya di Limo dikonfirmasi pada 20 Rajab 1348 (21 Desember 1929) dan kematiannya pada 9 Jumada al-Awwal 1442 (24 Desember 2020), kisah namanya \"Shehu Ahmadu,\" yang ayahnya menamai menurut Ahmed Al-Tijani, karier pendidikannya di Nigeria dan London, pekerjaan pendidikan dan yudisialnya, serta penghargaan yang banyak didasarkan pada halaman King Faisal International Prize."
