summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سالم إسماعيل ⁦(وُلد 17 مايو 1965 في حيدر آباد بالهند)⁩، رائد الأعمال التكنولوجي الذي كان المدير التنفيذي المؤسس لجامعة التفرد (Singularity University) والمؤلف الرئيسي لكتاب «المنظمات الأسّية» (2014). لا تذكر المقالة أي انتماء ديني له."
  en: "The English Wikipedia article on Salim Ismail (born 17 May 1965 in Hyderabad, India), the technology entrepreneur who was the founding executive director of Singularity University and lead author of Exponential Organizations (2014). It names no religious affiliation for him."
  es: "El artículo de Wikipedia en inglés sobre Salim Ismail (nacido el 17 de mayo de 1965 en Hyderabad, India), el empresario tecnológico que fue director ejecutivo fundador de Singularity University y autor principal de Exponential Organizations (2014), no menciona ninguna afiliación religiosa."
  fr: "L'article de Wikipédia en anglais consacré à Salim Ismail (né le 17 mai 1965 à Hyderabad, en Inde), entrepreneur technologique, directeur exécutif fondateur de la Singularity University et auteur principal de l'ouvrage *Exponential Organizations* (2014), ne mentionne aucune appartenance religieuse à son égard."
  ur: "سلیم اسماعیل ⁦(پیدائش 17 مئی 1965 حیدرآباد، ہندوستان)⁩ پر انگریزی ویکیپیڈیا کا مضمون، ٹیکنالوجی کے کاروباری شخص جو سنگولریٹی یونیورسٹی کے بانی ایگزیکٹو ڈائریکٹر اور ایکسپونیشل آرگنائزیشنز (2014) کے سرکردہ مصنف تھے۔ یہ اس کے لیے کسی مذہبی وابستگی کا نام نہیں لیتا۔"
  tr: "Salem Ismail (17 Mayıs 1965, Haydarabad, Hindistan doğumlu) hakkında İngilizce Wikipedia makalesi; teknoloji girişimcisi, Singularity Üniversitesi'nin kurucu CEO'su ve \"Exponential Organizations\" (2014) kitabının baş yazarıdır. Makalede kendisiyle ilgili herhangi bir dini aidiyetten bahsedilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Salem Ismail (lahir 17 Mei 1965, di Hyderabad, India), seorang pengusaha teknologi yang merupakan CEO pendiri Singularity University dan penulis utama buku \"Exponential Organizations\" (2014). Artikel tersebut tidak menyebutkan afiliasi agama apapun darinya."
