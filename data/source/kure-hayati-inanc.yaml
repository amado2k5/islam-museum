  ar: "مدخل موسوعة «كوره» التركية عن حياتي إينانج ⁦(المولود 1961)⁩، الكاتب والمقدّم التلفزيوني المعروف بشرح الأدب التركي الكلاسيكي؛ يُستخدم لوقائع الكيان فقط."
  en: "Entry on Hayati İnanç (born 1961), the Turkish writer and television presenter known for expounding classical Turkish literature, in the KÜRE Encyclopedia; used for entity facts only."
