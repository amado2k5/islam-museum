  ur: "KÜRE انسائیکلوپیڈیا میں، Hayati İnanç ⁦(پیدائش 1961)⁩ پر اندراج، ترک مصنف اور ٹیلی ویژن پیش کنندہ، کلاسیکی ترک ادب کی وضاحت کے لیے جانا جاتا ہے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔"
  tr: "Klasik Türk edebiyatını açıklamalarıyla tanınan yazar ve televizyon sunucusu Inang'ın (1961 doğumlu) hayatını konu alan Türkçe \"Kore\" ansiklopedisi için sadece varlığın gerçekleri için kullanılır."
  id: "Entri untuk ensiklopedia Turki \"Kore\" tentang kehidupan Inang (lahir 1961), penulis dan pembawa acara televisi yang dikenal karena menjelaskan sastra Turki klasik; hanya digunakan untuk fakta-fakta entitas."
