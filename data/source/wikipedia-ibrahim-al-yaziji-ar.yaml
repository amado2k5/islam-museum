  ar: "مقالة ويكيبيديا العربية عن إبراهيم اليازجي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في بيروت، وتحريره «النجاح» سنة 1872، ونزوحه إلى مصر سنة 1894 وتأسيسه «الضياء» بالقاهرة سنة 1898، ووفاته فيها سنة 1906، وتنقل أقوال معاصريه فيه."
  en: "Arabic Wikipedia article on Ibrahim al-Yaziji; used for entity facts only. It recounts his Beirut upbringing, his editorship of al-Najah in 1872, his move to Egypt in 1894 and founding of Ad-Diya in Cairo in 1898, his death there in 1906, and the judgements of his contemporaries."
