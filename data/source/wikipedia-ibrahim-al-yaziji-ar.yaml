summary:
  ar: "مقالة ويكيبيديا العربية عن إبراهيم اليازجي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في بيروت، وتحريره «النجاح» سنة 1872، ونزوحه إلى مصر سنة 1894 وتأسيسه «الضياء» بالقاهرة سنة 1898، ووفاته فيها سنة 1906، وتنقل أقوال معاصريه فيه."
  en: "Arabic Wikipedia article on Ibrahim al-Yaziji; used for entity facts only. It recounts his Beirut upbringing, his editorship of al-Najah in 1872, his move to Egypt in 1894 and founding of Ad-Diya in Cairo in 1898, his death there in 1906, and the judgements of his contemporaries."
  es: "Artículo en árabe de la Wikipedia sobre Ibrahim al-Yaziji; se utiliza únicamente para obtener información sobre la persona. Relata su infancia en Beirut, su etapa como editor de al-Najah en 1872, su traslado a Egipto en 1894 y la fundación de Ad-Diya en El Cairo en 1898, su fallecimiento allí en 1906 y las opiniones de sus contemporáneos."
  fr: "Article de Wikipédia en arabe sur Ibrahim al-Yaziji; utilisé uniquement à des fins d’information sur l’entité. Il relate son enfance à Beyrouth, sa direction d’al-Najah en 1872, son installation en Égypte en 1894 et la fondation d’Ad-Diya au Caire en 1898, sa mort dans cette ville en 1906, ainsi que les jugements de ses contemporains."
  ur: "ابراہیم ال یازیجی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی بیروت کی پرورش، 1872 میں النجاح کی ان کی ادارت، 1894 میں مصر منتقل ہونے اور 1898 میں قاہرہ میں الدیہ کی بنیاد، 1906 میں وہاں ان کی موت، اور ان کے ہم عصروں کے فیصلوں کا ذکر ہے۔"
