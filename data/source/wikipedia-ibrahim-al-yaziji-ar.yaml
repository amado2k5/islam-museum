reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his full nasab, his birth on 2 March 1847 in Beirut and his death in Cairo in 1906. On religion it quotes Muhammad Rashid Rida placing him 'in the first rank of the Christian literati of the Levant' — one contemporary's description, quoted in this one text — and repeats an unsourced claim that he belonged to the Freemasons; its categories file him under 'Lebanese Freemasons' and 'Translators of the Bible into Arabic', and pair his birth year 1847 with 1263 AH and his death year 1906 with 1324 AH."
