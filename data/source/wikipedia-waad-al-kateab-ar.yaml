summary:
  ar: "مقالة ويكيبيديا العربية عن وعد الخطيب، الصحفية والمخرجة السورية صاحبة فيلم «من أجل سما»؛ توافق المقالة الإنجليزية على أن الاسم مستعار لحماية أسرتها، وعلى تغطيتها لحلب للقناة الرابعة وعلى جوائز الفيلم."
  en: "Arabic Wikipedia article on Waad Al-Kateab, the Syrian journalist and filmmaker behind For Sama; it agrees with the English article that the name is a pseudonym used to protect her family, on her Aleppo reporting for Channel 4 and on the film's BAFTA and Academy Award recognition."
  es: "Artículo en árabe de la Wikipedia sobre Waad Al-Kateab, la periodista y cineasta siria detrás de \"For Sama\"; coincide con el artículo en inglés en que el nombre es un seudónimo utilizado para proteger a su familia, en su cobertura de Alepo para Channel 4 y en el reconocimiento de la película por parte de los premios BAFTA y de la Academia."
  fr: "L'article de Wikipédia en arabe sur Waad Al-Kateab, la journaliste et réalisatrice syrienne à l'origine du film « For Sama », confirme, comme l'article en anglais, que ce nom est un pseudonyme utilisé pour protéger sa famille, et aborde également ses reportages sur Alep pour Channel 4 et la reconnaissance du film aux BAFTA et aux Oscars."
  ur: "عربی ویکیپیڈیا مضمون واد الکاتب پر، شامی صحافی اور سما کے پیچھے فلم ساز؛ یہ انگریزی مضمون سے متفق ہے کہ یہ نام ایک تخلص ہے جو اس کے خاندان کی حفاظت کے لیے استعمال کیا جاتا ہے، چینل 4 کے لیے اس کی حلب کی رپورٹنگ اور فلم کے بافٹا اور اکیڈمی ایوارڈ کی شناخت پر۔"
  tr: "\"For Sama\" filminin arkasındaki Suriyeli gazeteci ve yönetmen Waad Al-Khatib hakkında Arapça Wikipedia makalesi; İngilizce makale, ismin ailesini, Channel 4 için Halep'i haber yayınını ve film ödüllerini korumak için kullandığı bir takma ad olduğunu kabul ediyor."
  id: "Artikel Wikipedia Arab tentang Waad Al-Khatib, jurnalis Suriah dan sutradara di balik film \"For Sama\"; artikel berbahasa Inggris setuju bahwa nama itu adalah nama samaran untuk melindungi keluarganya, liputannya tentang Aleppo untuk Channel 4, dan penghargaan film."
