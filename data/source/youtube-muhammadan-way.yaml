summary:
  ar: "قناة الشيخ نورجان مير أحمدي الرسمية على يوتيوب (@muhammadanway)، صحبت ومحاضرات أسبوعية مباشرة في التصوف النقشبندي من فانكوفر؛ مصدر أولي لهويته وعمله وانتشاره، لا مصدر مستقل مؤيد."
  en: "Shaykh Nurjan Mirahmadi's official YouTube channel (@muhammadanway), carrying his weekly live Naqshbandi Sufi discourses from Vancouver; a primary source for his identity, work and reach, not independent corroboration."
  es: "El canal oficial de YouTube del jeque Nurjan Mirahmadi (@muhammadanway), que transmite sus discursos sufíes Naqshbandi semanales en directo desde Vancouver, es una fuente primaria sobre su identidad, su obra y su alcance, pero no una corroboración independiente."
  fr: "La chaîne YouTube officielle du cheikh Nurjan Mirahmadi (@muhammadanway), qui diffuse ses discours soufis Naqshbandi hebdomadaires en direct depuis Vancouver; une source principale pour son identité, son travail et son influence, et non une corroboration indépendante."
  ur: "شیخ نورجان میراحمدی کا آفیشل یوٹیوب چینل (@muhammadanway)، وینکوور سے ان کے ہفتہ وار براہ راست نقشبندی صوفی خطابات؛ اس کی شناخت، کام اور رسائی کا بنیادی ذریعہ، نہ کہ آزاد تصدیق۔"
  tr: "Şeyh Nurjan Mir Ahmadi'nin resmi YouTube kanalı (@muhammadanway), Vancouver'dan Nakşibendi Sufizmi üzerine haftalık canlı konferanslar sunuyor; kimliği, çalışmaları ve yayılımı için birincil kaynak, bağımsız destekleyici bir kaynak değil."
  id: "Saluran YouTube resmi Sheikh Nurjan Mir Ahmadi (@muhammadanway) telah mendampingi dan menyampaikan kuliah langsung mingguan tentang Sufisme Naqshbandi dari Vancouver; sumber utama untuk identitas, karya, dan penyebarannya, bukan sumber pendukung independen."
