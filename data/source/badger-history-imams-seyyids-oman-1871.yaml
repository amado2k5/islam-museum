summary:
  ar: "ترجمة جورج بيرسي بدجر الإنجليزية لتاريخ عمان من الفتح الإسلامي إلى سنة 1856م، مع هوامشه؛ فيها تواريخ وفاة الإمام ناصر بن مرشد وبيعة سلطان بن سيف ومناقشة بدجر لتأريخ وفاة سلطان."
  en: "George Percy Badger's English translation, with notes, of the Omani chronicle of the imams and sayyids from the early Islamic period to 1856; it carries the death date of Imam Nasir ibn Murshid, the pledge of allegiance to Sultan ibn Saif, and Badger's own discussion of the date given for Sultan's death."
  ur: "جارج پرسی بیڈجر کا انگریزی ترجمہ مع حواشی، جو ابتدائی اسلامی دور سے 1856ء تک عمان کے ائمہ اور سادات کی تاریخ ہے؛ اس میں امام ناصر بن مرشد کی وفات، سلطان بن سیف کی بیعت اور بیڈجر کی سلطان کی وفات کی تاریخ پر بحث موجود ہے۔"
