summary:
  ar: "مادة «الخوارزمي، محمد بن موسى» في موسوعة TDV الإسلامية: اسمه وصيغه اللاتينية، وما عند الطبري من أخباره إلى سنة 232 هـ، والرد على قراءة تومر «المجوسي القطربّلي»، ثم آثاره: زيج السند هند، وكتاب الجبر والمقابلة، وكتاب الحساب الهندي وترجمته اللاتينية ونشراتها، وكتاب الجمع والتفريق، وصورة الأرض، وغيرها."
  en: "The TDV İslâm Ansiklopedisi entry on Muhammad ibn Musa al-Khwarizmi: his name and its Latin forms, al-Tabari's reports of him up to 232 AH, the rebuttal of Toomer's reading 'al-Majusi al-Qutrabbulli', then his works: the Sindhind tables, the algebra, the book on Indian reckoning with its Latin translation and editions, the book on adding and subtracting, the Surat al-Ard and others."
  ur: "ٹی ڈی وی اسلامی انسائیکلوپیڈیا میں محمد بن موسیٰ خوارزمی کا مقالہ: ان کا نام اور اس کی لاطینی صورتیں، 232ھ تک ان کے بارے میں طبری کی روایات، ٹومر کی «المجوسی القطربلی» والی قراءت کا رد، پھر ان کی تصانیف: زیج سند ہند، الجبر والمقابلہ، ہندی حساب کی کتاب اور اس کا لاطینی ترجمہ و اشاعتیں، جمع و تفریق کی کتاب، صورۃ الارض وغیرہ۔"
