summary:
  ar: عشرة مداخل في ويكاموس الإنجليزي لكلمات من أصل عربي في الملايوية والإندونيسية، مُلخَّصة في ملف بحثي قُدّم إلى المتحف ولم يفتحها المتحف؛ تُستعمل لأمثلة الألفاظ ومعانيها وأصولها العربية. أجاز المؤسس استعمال الملخص في 21 نوفمبر 2026 دون إعادة تحقق.
  en: Ten entries of English Wiktionary for loanwords from Arabic in Malay and Indonesian, summarised in a research file supplied to the museum and not opened by the museum; used for the example words, their meanings and their Arabic source words. The founder approved using the summary on 21 November 2026 without re-verification.
  ur: ملائی اور انڈونیشی میں عربی سے مستعار دس الفاظ کے لیے انگریزی وکی لغت کے دس اندراجات، جو عجائب گھر کو فراہم کردہ تحقیقی فائل میں خلاصہ کیے گئے اور عجائب گھر نے نہیں کھولے؛ مثالی الفاظ، ان کے معنی اور عربی ماخذ الفاظ کے لیے استعمال ہوئے۔ بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔
  fr: Dix entrées du Wiktionnaire anglais pour des emprunts à l'arabe en malais et indonésien, résumées dans un fichier de recherche remis au musée et non ouvertes par le musée ; utilisées pour les mots d'exemple, leurs sens et leurs mots arabes sources. Le fondateur a approuvé l'usage du résumé le 21 novembre 2026 sans nouvelle vérification.
  es: Diez entradas del Wikcionario en inglés para préstamos del árabe en malayo e indonesio, resumidas en un archivo de investigación entregado al museo y no abiertas por el museo; usadas para las palabras de ejemplo, sus significados y sus palabras árabes de origen. El fundador aprobó el uso del resumen el 21 de noviembre de 2026 sin nueva verificación.
  tr: "Müzeye sunulan ancak müze tarafından açılmamış bir araştırma dosyasında özetlenen, Malayca ve Endonezce kökenli İngilizce Wiktionary'deki on madde; kelimeler, anlamları ve Arapça kökenleri için kullanılmıştır. Kurucu, özetin kullanımına 21 Kasım 2026'da geri alma olmaksızın izin vermiştir."
  id: "Sepuluh entri dalam Wiktionary Inggris yang berasal dari bahasa Arab dalam bahasa Melayu dan Indonesia, dirangkum dalam berkas penelitian yang diserahkan ke museum tetapi tidak dibuka oleh museum; digunakan sebagai contoh kata, maknanya, dan asal-usul Arab. Pendiri mengizinkan penggunaan abstrak pada 21 November 2026, tanpa verifikasi ulang."
