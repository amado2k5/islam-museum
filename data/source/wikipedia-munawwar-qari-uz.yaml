summary:
  ar: "مقالة ويكيبيديا الأوزبكية عن منوّر قاري عبد الرشيدخان أوغلي (1878 – 1931)، قائد الحركة الجديدية في آسيا الوسطى؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها مولده بـ4 نوفمبر 1878 ووفاته بـ23 أبريل 1931 في موسكو، حيث تذكر المقالة الروسية وويكيداتا 23 مايو 1931."
  en: "Uzbek Wikipedia article on Munavvarqori Abdurashidxon o'g'li (1878 – 1931), leader of the Jadid movement in Central Asia; used for entity facts only. Its infobox gives his birth as 4 November 1878 and his death as 23 April 1931 at Moscow, where the Russian article and Wikidata give 23 May 1931."
  es: "Artículo de Wikipedia en uzbeko sobre Munavvarqori Abdurashidxon o'g'li (1878-1931), líder del movimiento Jadid en Asia Central; utilizado únicamente para datos sobre la entidad. Su ficha informativa indica que nació el 4 de noviembre de 1878 y falleció el 23 de abril de 1931 en Moscú, mientras que el artículo ruso y Wikidata indican el 23 de mayo de 1931."
  fr: "L'article de Wikipédia en ouzbek sur Munavvarqori Abdurashidxon o'g'li (1878-1931), chef du mouvement Jadid en Asie centrale, est utilisé uniquement à titre informatif. Son infobox indique sa naissance le 4 novembre 1878 et sa mort le 23 avril 1931 à Moscou, alors que l'article russe et Wikidata mentionnent le 23 mai 1931."
  ur: "وسطی ایشیا میں جدید تحریک کے رہنما مناوورقوری عبدالرشیدکسن اوگلی (1878-1931) پر ازبک ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے معلوماتی خانے میں اس کی پیدائش 4 نومبر 1878 اور اس کی موت 23 اپریل 1931 کو ماسکو میں بتائی گئی ہے، جہاں روسی مضمون اور وکی ڈیٹا 23 مئی 1931 کو بتاتا ہے۔"
