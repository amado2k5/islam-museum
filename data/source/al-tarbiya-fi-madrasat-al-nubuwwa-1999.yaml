label:
  ar: "التربية في مدرسة النبوة — محمد متولي الشعراوي ⁦(الحرية للنشر والتوزيع، ١٩٩٩)⁩"
  en: "Education in the School of Prophethood — Muhammad Mutawalli al-Sha'rawi (al-Hurriya, 1999 edition)"
summary:
  ar: "طبعة الحرية للنشر والتوزيع ⁦(القاهرة، ١٤١٩ه / ١٩٩٩م)⁩ ضمن «السلسلة النادرة»، من إعداد جمال إبراهيم، في ٨٨ صفحة مصوّرة. مقالة في الإيمان والتشريع والمقارنة بالأفكار المعاصرة، يبدأ فيها الشيخ من الحجج العقلية والنفسية على وجود الخالق {cite:al-tarbiya-fi-madrasat-al-nubuwwa-1999 p. 5}."
  en: "The al-Hurriya edition (Cairo, 1419 AH / 1999) in its 'rare series', compiled by Jamal Ibrahim, 88 pages in the scan used here. An essay on faith, law and comparison with contemporary ideas; it opens with the rational and psychological grounds for believing in a Creator {cite:al-tarbiya-fi-madrasat-al-nubuwwa-1999 p. 5}."
  es: "La edición de al-Hurriya (El Cairo, 1419 AH / 1999), perteneciente a su «serie de rarezas», compilada por Jamal Ibrahim, consta de 88 páginas en la versión escaneada que se utiliza aquí. Se trata de un ensayo sobre la fe, la ley y su comparación con las ideas contemporáneas; comienza con los fundamentos racionales y psicológicos para creer en un Creador {cite:al-tarbiya-fi-madrasat-al-nubuwwa-1999 p. 5}."
  fr: "L'édition al-Hurriya (Le Caire, 1419 AH / 1999), dans sa série « rare », compilée par Jamal Ibrahim, compte 88 pages dans le document numérisé utilisé ici. Il s'agit d'un essai sur la foi, la loi et une comparaison avec les idées contemporaines; il s'ouvre sur les fondements rationnels et psychologiques de la croyance en un Créateur {cite:al-tarbiya-fi-madrasat-al-nubuwwa-1999 p. 5}."
  ur: "الحریہ ایڈیشن ⁦(قاہرہ، 1419ھ / 1999)⁩ اپنی 'نایاب سیریز' میں، جسے جمال ابراہیم نے مرتب کیا، یہاں استعمال شدہ اسکین میں 88 صفحات پر مشتمل ہے۔ عقائد، قانون اور عصری نظریات کے ساتھ موازنہ پر ایک مضمون؛ یہ خالق پر ایمان لانے کی عقلی اور نفسیاتی بنیادوں کے ساتھ کھلتا ہے۔ 5}۔"
