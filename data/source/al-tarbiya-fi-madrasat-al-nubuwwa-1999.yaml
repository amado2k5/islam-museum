  ar: "طبعة الحرية للنشر والتوزيع (القاهرة، ١٤١٩ه / ١٩٩٩م) ضمن «السلسلة النادرة»، من إعداد جمال إبراهيم، في ٨٨ صفحة مصوّرة. مقالة في الإيمان والتشريع والمقارنة بالأفكار المعاصرة، يبدأ فيها الشيخ من الحجج العقلية والنفسية على وجود الخالق {cite:al-tarbiya-fi-madrasat-al-nubuwwa-1999 p. 5}."
  en: "The al-Hurriya edition (Cairo, 1419 AH / 1999) in its 'rare series', compiled by Jamal Ibrahim, 88 pages in the scan used here. An essay on faith, law and comparison with contemporary ideas; it opens with the rational and psychological grounds for believing in a Creator {cite:al-tarbiya-fi-madrasat-al-nubuwwa-1999 p. 5}."
