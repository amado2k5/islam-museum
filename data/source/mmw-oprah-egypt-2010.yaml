label: { en: "Muslimah Media Watch — Oprah's episode on Marriage Around the Globe (2010)", ar: "مسلمة ميديا ووتش — حلقة أوبرا عن الزواج حول العالم (2010)" }
summary:
  ar: "مراجعة نشرتها مدونة «مسلمة ميديا ووتش» في فبراير 2010 لفقرة مصر من حلقة أوبرا وينفري «الزواج حول العالم»، وضيفاتها الأربع ومنهن هبة قطب، وتعليقها بعد البث."
  en: "Muslimah Media Watch's February 2010 review of the Egypt segment of Oprah Winfrey's 'Marriage Around the Globe' episode, its four guests including Heba Kotb, and her comments after broadcast."
  es: "Reseña de Muslimah Media Watch de febrero de 2010 sobre el segmento dedicado a Egipto en el episodio de \"Marriage Around the Globe\" de Oprah Winfrey, sus cuatro invitados, entre ellos Heba Kotb, y sus comentarios posteriores a la emisión."
  fr: "Critique de Muslimah Media Watch, en février 2010, du segment égyptien de l'émission « Marriage Around the Globe » d'Oprah Winfrey, de ses quatre invités, dont Heba Kotb, et de ses commentaires après la diffusion."
  ur: "مسلمہ میڈیا واچ کا فروری 2010 میں اوپرا ونفری کے 'میریج اراؤنڈ دی گلوب' ایپی سوڈ کے مصری حصے کا جائزہ، اس کے چار مہمان بشمول ہیبا کوٹب، اور نشر ہونے کے بعد ان کے تبصرے۔"
  tr: "Şubat 2010'da 'Muslim Media Watch' blogunda yayımlanan Oprah Winfrey'in 'Marriage Around the World' adlı bölümünün Mısır bölümü ve Heba Qutb dahil dört konuğu ile yayın sonrası yorumu üzerine bir inceleme."
  id: "Sebuah ulasan yang diterbitkan oleh blog 'Muslim Media Watch' pada Februari 2010 tentang segmen Mesir dari episode Oprah Winfrey 'Marriage Around the World' dan empat tamunya, termasuk Heba Qutb, serta komentarnya setelah siaran tersebut."
title: "Love and Marriage and Divorce, Egyptian Style: Oprah's Episode on Marriage Around the Globe"
