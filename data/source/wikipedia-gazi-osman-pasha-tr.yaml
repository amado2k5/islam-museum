summary:
  ar: "مقالة ويكيبيديا التركية عن غازي عثمان باشا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده سنة 1832 في طوقاد ووفاته في 5 أبريل 1900 في إسطنبول ودفنه في جامع الفاتح، ولقبه «غازي» الذي منحه إياه السلطان عبد الحميد الثاني بعد دفاع بلفنة."
  en: "Turkish Wikipedia article on Gazi Osman Paşa; used for entity facts only. It gives his birth in 1832 at Tokat, his death on 5 April 1900 at Istanbul and his burial at the Fatih Mosque, and the title Gazi conferred by Sultan Abdul Hamid II after the defence of Plevna."
  es: "Artículo de la Wikipedia en turco sobre Gazi Osman Paşa; utilizado únicamente para datos biográficos. Indica su nacimiento en 1832 en Tokat, su fallecimiento el 5 de abril de 1900 en Estambul y su entierro en la Mezquita Fatih, así como el título de Gazi que le otorgó el sultán Abdul Hamid II tras la defensa de Plevna."
  fr: "Article de Wikipédia en turc sur Gazi Osman Paşa; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance en 1832 à Tokat, sa mort le 5 avril 1900 à Istanbul et son inhumation à la mosquée Fatih, ainsi que le titre de Gazi qui lui fut conféré par le sultan Abdul Hamid II après la défense de Plevna."
  ur: "غازی عثمان پاشا پر ترک ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1832 میں توکات میں ان کی پیدائش، 5 اپریل 1900 کو استنبول میں ان کی وفات اور فاتح مسجد میں ان کی تدفین، اور پلوینا کے دفاع کے بعد سلطان عبدالحمید دوم کی طرف سے غازی کا لقب دیا گیا ہے۔"
