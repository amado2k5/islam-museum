summary:
  ar: "مقالة ويكيبيديا العربية عن محمد أوز، مراجعة 13 يونيو 2026؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها ميلاده في كليفلاند في 11 يونيو 1960 وديانته «مسلم» دون مدرسة، ويصف اهتمامه بكتابات إيمانويل سويندنبورغ."
  en: "Arabic Wikipedia article on Mehmet Oz, revision of 13 June 2026; used for entity facts only. Its infobox gives his birth in Cleveland on 11 June 1960 and his religion as Muslim, with no school, and describes his interest in the writings of Emanuel Swedenborg."
  es: "Artículo de Wikipedia en árabe sobre Mehmet Oz, revisado el 13 de junio de 2026; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació en Cleveland el 11 de junio de 1960, que era musulmán, que no había asistido a ninguna escuela y describe su interés por los escritos de Emanuel Swedenborg."
  fr: "Article de Wikipédia en arabe sur Mehmet Oz, mis à jour le 13 juin 2026; utilisé uniquement pour les informations sur l’entité. Son infobox indique sa naissance à Cleveland le 11 juin 1960, sa religion musulmane (sans scolarité) et son intérêt pour les écrits d’Emanuel Swedenborg."
  ur: "مہمت اوز پر عربی ویکیپیڈیا مضمون، 13 جون 2026 کی نظر ثانی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی باکس 11 جون 1960 کو کلیولینڈ میں اس کی پیدائش اور اس کا مذہب بطور مسلمان، جس میں کوئی اسکول نہیں ہے، اور ایمانوئل سویڈنبرگ کی تحریروں میں اس کی دلچسپی کو بیان کرتا ہے۔"
