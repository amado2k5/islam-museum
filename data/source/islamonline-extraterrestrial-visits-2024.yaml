label: { ar: "إسلام أون لاين: هل هناك كائنات فضائية تنزل إلى الأرض", en: "IslamOnline: \"Are there extraterrestrials who descend to the earth?\"" }
summary:
  ar: "صفحة سؤال وجواب في قسم الفقه بموقع إسلام أون لاين، تنقل رأي أستاذ أزهري بأنه لا مانع شرعاً من وجود مخلوقات أخرى وأن قصص نزولها إلى الأرض خرافات."
  en: "A question-and-answer page in the fiqh section of IslamOnline reporting an Azhar professor's view that nothing in the Shari'a prevents other creatures existing and that stories of their landing on earth are myths."
  es: "Una página de preguntas y respuestas en la sección de fiqh de IslamOnline recoge la opinión de un profesor de Al-Azhar de que nada en la Sharia impide la existencia de otras criaturas y que las historias sobre su llegada a la Tierra son mitos."
  fr: "Une page de questions-réponses dans la section fiqh d'IslamOnline rapporte l'avis d'un professeur d'Azhar selon lequel rien dans la charia n'empêche l'existence d'autres créatures et que les récits de leur arrivée sur terre sont des mythes."
  ur: "اسلام آن لائن کے فقہ سیکشن میں ایک سوال و جواب کا صفحہ ایک اظہر پروفیسر کے اس نظریے کی رپورٹ کرتا ہے کہ شریعت میں کوئی بھی چیز موجود دیگر مخلوقات کو نہیں روکتی اور یہ کہ ان کے زمین پر اترنے کی کہانیاں فرضی ہیں۔"
  tr: "İslam Hukuku Bölümü'nde Çevrimiçi Soru-Cevap sayfası, Profesör Azhari'nin diğer yaratıkların varlığına dini bir itiraz olmadığı ve onların dünyaya iniş hikayelerinin efsane olduğu görüşünü aktarıyor."
  id: "Sebuah halaman tanya jawab di Departemen Yurisprudensi tentang Islam Online menyampaikan pendapat Profesor Azhari bahwa tidak ada keberatan agama terhadap keberadaan makhluk lain dan bahwa kisah turunnya mereka ke bumi hanyalah mitos."
