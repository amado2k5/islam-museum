  ar: "مقالة ويكيبيديا الإنجليزية عن حكيم عبد الحميد؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في دلهي في 14 أيلول 1908 ووفاته في 22 تموز 1999، ودوره مؤسسا وأمينا رئيسيا لمختبرات هامدارد ومستشارا مؤسسا لجامعة هامدارد ومستشارا لجامعة عليكره الإسلامية (1996–1999)، وجوائزه بادما شري (1965) وبادما بوشان (1992)."
  en: "English Wikipedia article on Hakim Abdul Hameed; used for entity facts only. It gives his birth in Delhi on 14 September 1908 and death on 22 July 1999, his roles as founder and chief trustee of Hamdard Laboratories, founder chancellor of Jamia Hamdard and chancellor of Aligarh Muslim University (1996–1999), and his Padma Shri (1965) and Padma Bhushan (1992) awards."
