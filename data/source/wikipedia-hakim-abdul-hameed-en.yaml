summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حكيم عبد الحميد؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في دلهي في 14 أيلول 1908 ووفاته في 22 تموز 1999، ودوره مؤسسا وأمينا رئيسيا لمختبرات هامدارد ومستشارا مؤسسا لجامعة هامدارد ومستشارا لجامعة عليكره الإسلامية (1996–1999)، وجوائزه بادما شري (1965) وبادما بوشان (1992)."
  en: "English Wikipedia article on Hakim Abdul Hameed; used for entity facts only. It gives his birth in Delhi on 14 September 1908 and death on 22 July 1999, his roles as founder and chief trustee of Hamdard Laboratories, founder chancellor of Jamia Hamdard and chancellor of Aligarh Muslim University (1996–1999), and his Padma Shri (1965) and Padma Bhushan (1992) awards."
  es: "Artículo de la Wikipedia en inglés sobre Hakim Abdul Hameed; utilizado únicamente para datos sobre la persona. En él se indica su nacimiento en Delhi el 14 de septiembre de 1908 y su fallecimiento el 22 de julio de 1999, sus funciones como fundador y fideicomisario principal de Hamdard Laboratories, rector fundador de Jamia Hamdard y rector de la Universidad Musulmana de Aligarh (1996-1999), y sus premios Padma Shri (1965) y Padma Bhushan (1992)."
  fr: "Article de Wikipédia en anglais sur Hakim Abdul Hameed; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance à Delhi le 14 septembre 1908 et son décès le 22 juillet 1999, ses rôles de fondateur et principal administrateur des laboratoires Hamdard, de chancelier fondateur de Jamia Hamdard et de chancelier de l’université musulmane d’Aligarh (1996-1999), ainsi que ses décorations Padma Shri (1965) et Padma Bhushan (1992)."
  ur: "حکیم عبدالحمید پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 14 ستمبر 1908 کو دہلی میں ان کی پیدائش اور 22 جولائی 1999 کو انتقال کرتا ہے، ہمدرد لیبارٹریز کے بانی اور چیف ٹرسٹی، جامعہ ہمدرد کے بانی چانسلر اور علی گڑھ مسلم یونیورسٹی (1996-1999) کے چانسلر کے طور پر ان کے کردار، اور ان کے پدم شری (1965) اور پدم بھوشن (1999) ایوارڈز۔"
  tr: "Hakim Abdul Hamid hakkında İngilizce Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. 14 Eylül 1908'de Delhi'de doğdu, 22 Temmuz 1999'da vefat etti ve Hamdard Laboratuvarları'nın kurucusu ve baş sekreteri, Hamdard Üniversitesi'nin kurucu danışmanı, Aligarh İslam Üniversitesi'nin danışmanı (1996–1999) olarak görev yaptı ve Padma Shri (1965) ile Padma Bhushan (1992) ödüllerini aldı."
  id: "Artikel Wikipedia bahasa Inggris tentang Hakim Abdul Hamid; digunakan hanya untuk fakta entitas. Ia lahir di Delhi pada 14 September 1908, meninggal pada 22 Juli 1999, dan perannya sebagai pendiri dan sekretaris utama Hamdard Laboratories, penasihat pendiri Universitas Hamdard, dan penasihat Universitas Islam Aligarh (1996–1999), serta penghargaan Padma Shri (1965) dan Padma Bhushan (1992)."
