summary:
  ar: "نص وصف قناة مولانا عبيد رضا عطاري الرسمية كما تنشره إدارة التواصل الاجتماعي لدعوة إسلامي؛ يصفه بأنه الابن الأكبر لأمير أهل السنة، ومريد مخلص في السلسلة القادرية، عُيّن خليفة رسميا في 22 يناير 2016."
  en: "The official channel description text for Maulana Ubaid Raza Attari, published by Dawat-e-Islami's social media department: it calls him the esteemed elder son of Ameer-e-Ahl-e-Sunnat Maulana Ilyas Qadri, a devoted disciple in the Silsila Qadiriyyah, officially appointed successor on 22 January 2016."
  es: "El texto oficial de descripción del canal de Maulana Ubaid Raza Attari, publicado por el departamento de redes sociales de Dawat-e-Islami: lo llama el estimado hijo mayor de Ameer-e-Ahl-e-Sunnat Maulana Ilyas Qadri, un devoto discípulo de Silsila Qadiriyyah, nombrado oficialmente sucesor el 22 de enero de 2016."
  fr: "Le texte officiel de description de la chaîne de Maulana Ubaid Raza Attari, publié par le département des médias sociaux de Dawat-e-Islami: il l'appelle le fils aîné estimé d'Ameer-e-Ahl-e-Sunnat Maulana Ilyas Qadri, un disciple dévoué de la Silsila Qadiriyyah, officiellement nommé successeur le 22 janvier 2016."
  ur: "مولانا عبید رضا عطاری کے لیے سرکاری چینل کی تفصیل کا متن، جو دعوت اسلامی کے سوشل میڈیا ڈیپارٹمنٹ نے شائع کیا ہے: اس میں انہیں امیرِ اہلسنت مولانا الیاس قادری کے بزرگ فرزند، سلسلۂ قادریہ کے ایک عقیدت مند شاگرد، 2602 جنوری کو باضابطہ طور پر جانشین مقرر کیا گیا ہے۔"
  tr: "İslami Çağrı'nın Sosyal Medya Departmanı tarafından yayımlanan resmi Mawlana Ubaid Reda Attari kanalının tanımında, Ehl-sünnet Komutanı'nın en büyük oğlu ve Kadiriyye zincirinin samimi bir takipçisi olarak tanımlanıyor. 22 Ocak 2016'da resmi olarak Halife olarak atandı."
  id: "Deskripsi resmi saluran Mawlana Ubaid Reda Attari yang dipublikasikan oleh Departemen Media Sosial Islamic Call menggambarkannya sebagai putra sulung Komandan Ahl al-Sunnah dan pengikut tulus rantai Qadiriyya. Ia secara resmi diangkat sebagai Khalifah pada 22 Januari 2016."
