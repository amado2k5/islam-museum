reliability_note: "Channel boilerplate written by the movement's own social media department, read on 5 November 2026; a first-party text. It reads: 'Maulana Ubaid Raza Attari Madani is the esteemed elder son of Ameer-e-Ahl-e-Sunnat, Maulana Ilyas Qadri, the founder of Dawat-e-Islami. As a devoted disciple in the Silsila Qadiriyyah, he has been nurtured in spiritual training from an early age. On 11th Rabi-ul-Akhir 1437 AH (22 January 2016), he was officially appointed as the successor by his honorable father.' The elder-son and successor statements corroborate the founder page. The Qadiriyyah-disciple sentence is the single first-party text naming an order for him personally; under the lane's two-text rule it is preserved in his faith note and does not settle a faith value."
