summary:
  ar: "إدراج قناة «الإسلام مع عائشة» في دليل فيدسبوت لقنوات يوتيوب الإسلامية؛ يعيد نشر وصف القناة وينسب التفسير إلى عائشة خالد، ويدرج رقم مشتركين خاصًا بالدليل."
  en: "Feedspot's directory listing of the Islam with Aisha channel in its '100 Islamic YouTubers' list; it republishes the channel description attributing the tafseer to Aisha Khalid and lists the directory's own subscriber figure."
  es: "El directorio de Feedspot incluye el canal Islam with Aisha en su lista de \"100 YouTubers islámicos\"; republica la descripción del canal que atribuye el tafsir a Aisha Khalid y muestra la cifra de suscriptores del propio directorio."
  fr: "Le répertoire de Feedspot répertorie la chaîne Islam with Aisha dans sa liste des « 100 YouTubers islamiques »; il republie la description de la chaîne attribuant le tafsir à Aisha Khalid et affiche le nombre d'abonnés du répertoire."
  ur: "Feedspot کی ڈائرکٹری میں اسلام کی فہرست عائشہ چینل کے ساتھ اس کی '100 اسلامی YouTubers' کی فہرست میں؛ یہ چینل کی تفصیل کو دوبارہ شائع کرتا ہے جس میں تفسیر کو عائشہ خالد سے منسوب کیا جاتا ہے اور ڈائرکٹری کے اپنے سبسکرائبر کی فہرست درج ہوتی ہے۔"
  tr: "Feedspot rehberinde 'İslam ile Aisha' kanalının yer alması, kanalın açıklamasını yeniden yayımlıyor ve yorumu Aisha Khaled'e atfediyor, ayrıca rehbere özgü bir abone numarası da içeriyor."
  id: "Pencantuman saluran 'Islam dengan Aisha' dalam panduan Feedspot untuk saluran YouTube Islam menerbitkan ulang deskripsi saluran dan mengaitkan interpretasi tersebut kepada Aisha Khaled, serta menyertakan nomor pelanggan khusus untuk panduan tersebut."
