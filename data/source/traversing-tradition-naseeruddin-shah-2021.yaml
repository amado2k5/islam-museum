summary:
  ar: "تعليق نقدي ⁦(29 سبتمبر 2021)⁩ يصف نصير الدين شاه وجاويد أختر بأنهما «ملحدان معلنان» وينسب إلى شاه أنه يعدّ نفسه ملحداً مع تمسّكه بهوية مسلمة."
  en: "Critical commentary of 29 September 2021 which describes Naseeruddin Shah and Javed Akhtar as 'self-declared atheists' and says of Shah: 'Shah regards himself as an atheist, but still lays claim to Muslim identity.'"
  es: "Comentario crítico del 29 de septiembre de 2021 que describe a Naseeruddin Shah y Javed Akhtar como \"ateos declarados\" y dice de Shah: \"Shah se considera ateo, pero aún así reivindica su identidad musulmana\"."
  fr: "Commentaire critique du 29 septembre 2021 qui décrit Naseeruddin Shah et Javed Akhtar comme des « athées autoproclamés » et qui dit à propos de Shah: « Shah se considère comme un athée, mais revendique toujours une identité musulmane. »"
  ur: "29 ستمبر 2021 کی تنقیدی تبصرہ جس میں نصیر الدین شاہ اور جاوید اختر کو 'خود اعلانیہ ملحد' قرار دیا گیا ہے اور شاہ کے بارے میں کہا گیا ہے: 'شاہ خود کو ملحد سمجھتے ہیں، لیکن پھر بھی مسلم شناخت کا دعویٰ کرتے ہیں۔'"
  tr: "Eleştirel bir yorum (29 Eylül 2021), Nasiruddin Shah ve Javed Akhtar'ı \"ilan edilmiş ateist\" olarak tanımlar ve Shah'ın kendini ateist olarak görürken Müslüman kimliğine bağlı olduğunu belirtir."
  id: "Sebuah komentar kritis (29 September 2021) menggambarkan Nasiruddin Shah dan Javed Akhtar sebagai \"ateis yang dinyatakan\" dan mengaitkan Shah dengan menganggap dirinya ateis sambil tetap memegang identitas Muslim."
