summary:
  ar: "مقالة ويكيبيديا الفارسية «پروین اعتصامی»؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاد رخشنده اعتصامی في 25 اسفند 1285 هـ.ش في تبريز ووفاتها يوم الجمعة 15 فروردين 1320 هـ.ش ⁦(4 أبريل 1941)⁩ في طهران من الحمى التيفية ودفنها في حرم فاطمة المعصومة بقم، وأسلوبها الشعري القائم على المناظرة."
  en: "Persian Wikipedia article 'Parvin E'tesami'; used for entity facts only. It gives Rakhshandeh E'tesami's birth on 25 Esfand 1285 SH at Tabriz and her death on Friday 15 Farvardin 1320 SH (4 April 1941) at Tehran of typhoid fever, with burial at the shrine of Fatima Masumeh in Qom, and her debate-poem style."
  es: "Artículo de la Wikipedia en persa titulado \"Parvin E'tesami\"; utilizado únicamente para datos sobre la persona. Indica que Rakhshandeh E'tesami nació el 25 de Esfand de 1285 SH en Tabriz y falleció el viernes 15 de Farvardin de 1320 SH (4 de abril de 1941) en Teherán a causa de fiebre tifoidea, fue enterrada en el santuario de Fátima Masumeh en Qom y describe su estilo poético basado en debates."
  fr: "L'article Wikipédia persan « Parvin E'tesami »; utilisé uniquement pour les informations sur l'entité. Il indique la naissance de Rakhshandeh E'tesami le 25 Esfand 1285 SH à Tabriz et sa mort le vendredi 15 Farvardin 1320 SH (4 avril 1941) à Téhéran des suites de la fièvre typhoïde, son inhumation au sanctuaire de Fatima Masumeh à Qom, et son style de poésie engagée."
  ur: "فارسی ویکیپیڈیا مضمون 'پروین اعتصامی'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں رخشندہ اعتصامی کی پیدائش 25 اسفند 1285ھ کو تبریز میں ہوئی اور اس کی وفات جمعہ 15فروردین 1320ھ ⁦(4 اپریل 1941)⁩ کو تہران میں ٹائیفائیڈ بخار سے ہوئی، قم میں فاطمہ معصومہ کے مزار پر تدفین کے ساتھ، اور اس کی بحث کا انداز۔"
