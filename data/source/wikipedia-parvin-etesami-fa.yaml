  ar: "مقالة ويكيبيديا الفارسية «پروین اعتصامی»؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاد رخشنده اعتصامی في 25 اسفند 1285 هـ.ش في تبريز ووفاتها يوم الجمعة 15 فروردين 1320 هـ.ش (4 أبريل 1941) في طهران من الحمى التيفية ودفنها في حرم فاطمة المعصومة بقم، وأسلوبها الشعري القائم على المناظرة."
  en: "Persian Wikipedia article 'Parvin E'tesami'; used for entity facts only. It gives Rakhshandeh E'tesami's birth on 25 Esfand 1285 SH at Tabriz and her death on Friday 15 Farvardin 1320 SH (4 April 1941) at Tehran of typhoid fever, with burial at the shrine of Fatima Masumeh in Qom, and her debate-poem style."
