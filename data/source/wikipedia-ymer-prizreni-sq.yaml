summary:
  ar: "مقال موسوعي بالألبانية عن يمر أفندي بريزريني (1820/21–1887): تصفه مقدمته بأنه خوجة ومدرّس وعضو في الطريقة النقشبندية ونائب في أول برلمان عثماني وقيادي في عصبة بريزرن."
  en: "Albanian encyclopedia article on Ymer efendi Prizreni (1820/21–1887): its lead describes him as a hoxha, a müderris, a member of the Naqshbandi tariqa, a deputy of the first Ottoman parliament and an activist of the League of Prizren."
  es: "Artículo de una enciclopedia albanesa sobre Ymer efendi Prizreni (1820/21–1887): su introducción lo describe como un hoxha, un müderris, miembro de la tariqa Naqshbandi, diputado del primer parlamento otomano y activista de la Liga de Prizren."
  fr: "Article de l'encyclopédie albanaise sur Ymer efendi Prizreni (1820/21–1887): son introduction le décrit comme un hoxha, un müderris, un membre de la tariqa Naqshbandi, un député du premier parlement ottoman et un militant de la Ligue de Prizren."
  ur: "البانوی انسائیکلوپیڈیا آرٹیکل برائے یمر آفندی پریزرینی (1820/21–1887): اس کے لیڈ میں اسے ایک ہوکسہ، ایک مدریس، نقشبندی طریقہ کے رکن، پہلی عثمانی پارلیمنٹ کے نائب اور لیگ آف پریزرین کے کارکن کے طور پر بیان کیا گیا ہے۔"
  tr: "Yimer Efendi Prizrini (1820/21–1887) hakkında Arnavutça ansiklopedik bir makale: Girişinde kendisi bir Hoca, öğretmen, Nakşibendi tarikatı üyesi, ilk Osmanlı parlamentosunda milletvekili ve Prizren Birliği'nin lideri olarak tanımlanır."
  id: "Sebuah artikel ensiklopedis dalam bahasa Albania tentang Yimer Efendi Prizrini (1820/21–1887): Pengantarnya menggambarkannya sebagai seorang Khoja, guru, anggota ordo Naqshbandi, wakil di parlemen Ottoman pertama, dan pemimpin Liga Prizren."
