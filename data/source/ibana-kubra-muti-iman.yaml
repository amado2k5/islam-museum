label: { ar: "الإبانة عن شريعة الفرقة الناجية لابن بطة، كتاب الإيمان، تحقيق رضا بن نعسان معطي ⁦(دار الراية)⁩", en: "Ibn Batta, al-Ibana 'an Shari'at al-Firqa al-Najiya, Kitab al-Iman, ed. Rida ibn Na'san Mu'ti (Dar al-Raya)" }
summary:
  ar: "المجلد الأول من الإبانة الكبرى لأبي عبد الله عبيد الله بن محمد بن بطة العكبري الحنبلي ⁦(ت 387هـ)⁩، ويضم كتاب الإيمان ⁦(الأجزاء السبعة الأولى من الأصل)⁩، بتحقيق ودراسة رضا بن نعسان معطي، دار الراية بالرياض، الطبعة الثانية 1415هـ/1994م؛ في أوله دراسة في ترجمة المؤلف والتعريف بالكتاب وأبوابه ونسخه وسماعاته."
  en: "Volume 1 of al-Ibana al-Kubra by Abu Abd Allah Ubayd Allah ibn Muhammad Ibn Batta al-Ukbari al-Hanbali (d. 387 AH), containing the Book of Faith (the first seven parts of the original), edited with a study by Rida ibn Na'san Mu'ti, Dar al-Raya, Riyadh, 2nd ed. 1415 AH / 1994; it opens with a study of the author's life, the book, its chapters, manuscripts and audition notes."
  es: "Volumen 1 de al-Ibana al-Kubra de Abu Abd Allah Ubayd Allah ibn Muhammad Ibn Batta al-Ukbari al-Hanbali (m. 387 AH), que contiene el Libro de la Fe (las primeras siete partes del original), editado con un estudio de Rida ibn Na'san Mu'ti, Dar al-Raya, Riad, 2.ª ed. 1415 AH / 1994; comienza con un estudio de la vida del autor, el libro, sus capítulos, manuscritos y notas de audición."
  fr: "Volume 1 d'al-Ibana al-Kubra par Abu Abd Allah Ubayd Allah ibn Muhammad Ibn Batta al-Ukbari al-Hanbali (d. 387 AH), contenant le Livre de la Foi (les sept premières parties de l'original), édité avec une étude par Rida ibn Na'san Mu'ti, Dar al-Raya, Riyad, 2e éd. 1415 AH / 1994; il s'ouvre sur une étude de la vie de l'auteur, du livre, de ses chapitres, manuscrits et notes d'audition."
  ur: "ابو عبد اللہ عبید اللہ ابن محمد ابن بطہ العکبری الحنبلی ⁦(متوفی 387ھ)⁩ کی البنا الکبری کی جلد 1، کتاب ایمان ⁦(اصل کے پہلے سات حصوں)⁩ پر مشتمل ہے، ردا ابن نصان مطیع، دارالریاض، 2، کے مطالعہ کے ساتھ ترمیم کی گئی ہے۔ 1415ھ / 1994ء; اس کا آغاز مصنف کی زندگی، کتاب، اس کے ابواب، مخطوطات اور آڈیشن نوٹس کے مطالعہ سے ہوتا ہے۔"
  tr: "Ebu Abdullah Ubayd Allah ibn Muhammed ibn Batta el-Akbari el-Hanbali (ö. 387 Hicri) tarafından yazılmış El-İbanah el-Kubra'nın birinci cildi, Riyaz'da Dar al-Raya Ridha ibn Na'san Mu'ti tarafından düzenlenip incelenmiştir, ikinci baskı 1415 Hicri / 1994 M.S. başta; yazarın biyografisi, kitaba giriş, bölümleri, kopyaları ve ses kayıtları üzerine bir çalışma içerir."
  id: "Jilid pertama Al-Ibanah al-Kubra karya Abu Abdullah Ubayd Allah ibn Muhammad ibn Batta al-Akbari al-Hanbali (wafat 387 H), memuat buku Al-Iman (tujuh bagian pertama dari buku asli), disunting dan dipelajari oleh Ridha ibn Na'san Mu'ti, Dar al-Raya di Riyadh, edisi kedua 1415 H/1994 M; di awal, memuat studi tentang biografi penulis, pengantar buku, bab-babnya, salinan, dan rekaman audio."
title: "الإبانة عن شريعة الفرقة الناجية ومجانبة الفرق المذمومة: كتاب الإيمان"
