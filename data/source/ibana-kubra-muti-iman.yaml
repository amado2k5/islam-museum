summary:
  ar: "المجلد الأول من الإبانة الكبرى لأبي عبد الله عبيد الله بن محمد بن بطة العكبري الحنبلي (ت 387هـ)، ويضم كتاب الإيمان (الأجزاء السبعة الأولى من الأصل)، بتحقيق ودراسة رضا بن نعسان معطي، دار الراية بالرياض، الطبعة الثانية 1415هـ/1994م؛ في أوله دراسة في ترجمة المؤلف والتعريف بالكتاب وأبوابه ونسخه وسماعاته."
  en: "Volume 1 of al-Ibana al-Kubra by Abu Abd Allah Ubayd Allah ibn Muhammad Ibn Batta al-Ukbari al-Hanbali (d. 387 AH), containing the Book of Faith (the first seven parts of the original), edited with a study by Rida ibn Na'san Mu'ti, Dar al-Raya, Riyadh, 2nd ed. 1415 AH / 1994; it opens with a study of the author's life, the book, its chapters, manuscripts and audition notes."
