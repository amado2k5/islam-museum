  fr: "L'élément Wikidata Q1884979 pour Mahmudkhodja Behbudiy; utilisé uniquement pour les identifiants et les faits structurés. Il indique sa naissance le 20 janvier 1875, son décès le 25 mars 1919 (avec une précision sur l'année 1919) et sa religion (P140): l'islam en général, sans précision de branche."
