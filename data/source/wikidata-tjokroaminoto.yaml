summary:
  ar: "عنصر ويكيداتا Q2603591 لعمر سعيد تجوكروامينوتو؛ يحمل ميلاده في 16 آب 1882 ووفاته في 17 كانون الأول 1934 ويوجياكارتا مكانًا لوفاته، ويعطي ديانته «الإسلام» إجمالًا دون مذهب."
  en: "Wikidata item Q2603591 for Oemar Said Tjokroaminoto; it carries his birth on 16 August 1882 and his death on 17 December 1934, Yogyakarta as his place of death, and gives his religion as Islam in general, with no school."
  es: "El elemento de Wikidata Q2603591 corresponde a Oemar Said Tjokroaminoto; en él figura su fecha de nacimiento, el 16 de agosto de 1882, y su fecha de fallecimiento, el 17 de diciembre de 1934, en Yogyakarta, y se indica que profesaba el Islam en general, sin mencionar ninguna escuela específica."
  fr: "L'élément Wikidata Q2603591 pour Oemar Said Tjokroaminoto; il indique sa naissance le 16 août 1882 et sa mort le 17 décembre 1934, Yogyakarta comme lieu de décès, et donne sa religion comme étant l'islam en général, sans école."
  ur: "وکی ڈیٹا آئٹم Q2603591 برائے عمیر سید Tjokroaminoto؛ یہ 16 اگست 1882 کو ان کی پیدائش اور 17 دسمبر 1934 کو ان کی موت، یوگیکارتا کو ان کی موت کی جگہ کے طور پر لے جاتا ہے، اور اپنے مذہب کو عام طور پر اسلام کے طور پر دیتا ہے، جس میں کوئی اسکول نہیں ہے۔"
  tr: "Wikidata öğesi Q2603591 Omar Said Tjukroaminoto tarafından; 16 Ağustos 1882 doğumlu ve 17 Aralık 1934'te ölüm yeri Yogyakarta ile vefat etti; genellikle dini olarak herhangi bir mezhep olmadan \"İslam\" olarak tanımlar."
  id: "Elemen Wikidata Q2603591 oleh Omar Said Tjukroaminoto; lahir pada 16 Agustus 1882, dan wafat pada 17 Desember 1934, dengan Yogyakarta sebagai tempat kematiannya, dan ia umumnya menyebut agamanya sebagai \"Islam\" tanpa sekte apapun."
