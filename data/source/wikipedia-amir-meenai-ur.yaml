summary:
  ar: "مقالة ويكيبيديا الأردية عن أمير مينائي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في لكهنؤ في 21 فبراير 1828 ووفاته في حيدر آباد في 13 أكتوبر 1900، وتنص على بيعته لحضرة أمير شاه، سجادة نشين الأسرة الصابرية الجشتية."
  en: "Urdu Wikipedia article on Amir Meenai; used for entity facts only. It gives his birth at Lucknow on 21 February 1828 and his death at Hyderabad on 13 October 1900, and states in its text that he took the discipleship oath (bay'ah) from Hazrat Amir Shah, the sajjada-nashin of the Sabiri Chishti family."
  es: "Artículo de Wikipedia en urdu sobre Amir Meenai; utilizado únicamente para datos sobre la persona. Indica que nació en Lucknow el 21 de febrero de 1828 y falleció en Hyderabad el 13 de octubre de 1900, y afirma en su texto que prestó juramento de discipulado (bay'ah) ante Hazrat Amir Shah, el sajjada-nashin de la familia Sabiri Chishti."
  fr: "Article de Wikipédia en ourdou sur Amir Meenai; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance à Lucknow le 21 février 1828 et sa mort à Hyderabad le 13 octobre 1900, et précise qu'il a prêté serment de disciple (bay'ah) à Hazrat Amir Shah, le sajjada-nashin de la famille Sabiri Chishti."
  ur: "امیر مینائی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 21 فروری 1828 کو لکھنؤ میں ان کی ولادت اور 13 اکتوبر 1900 کو حیدر آباد میں ان کی وفات کا ذکر کرتا ہے، اور اس کے متن میں لکھا ہے کہ انہوں نے صابری چشتی خاندان کے سجادہ نشین حضرت امیر شاہ سے شاگردی کی بیعت لی۔"
  tr: "Amir Minai hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Lucknow'daki doğumu 21 Şubat 1828'de, 13 Ekim 1900'de Haydarabad'da öldüğünden bahsedilir ve Sabriya Jashti hanedanının Sajjadahı Hazret Amir Şah'a bağlılığını ifade eder."
  id: "Artikel Wikipedia Urdu tentang Amir Minai; digunakan hanya untuk fakta entitas tersebut. Kelahirannya di Lucknow disebutkan pada 21 Februari 1828, dan kematiannya di Hyderabad pada 13 Oktober 1900, serta menyatakan kesetiaannya kepada Hazrat Amir Shah, Sajjadah dari dinasti Sabriya Jashti."
