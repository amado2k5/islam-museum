  ar: "مقالة ويكيبيديا الأردية عن أمير مينائي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في لكهنؤ في 21 فبراير 1828 ووفاته في حيدر آباد في 13 أكتوبر 1900، وتنص على بيعته لحضرة أمير شاه، سجادة نشين الأسرة الصابرية الجشتية."
  en: "Urdu Wikipedia article on Amir Meenai; used for entity facts only. It gives his birth at Lucknow on 21 February 1828 and his death at Hyderabad on 13 October 1900, and states in its text that he took the discipleship oath (bay'ah) from Hazrat Amir Shah, the sajjada-nashin of the Sabiri Chishti family."
