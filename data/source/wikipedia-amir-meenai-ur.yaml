reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. A traditional Urdu biography drawing on Sarfaraz Ali Rizvi's reference work on poets (Anjuman Taraqqi Urdu, 1987): it names him Amir Ahmad, son of Maulvi Karam Muhammad, of the family of Makhdum Shah Mina; educated at Farangi Mahal; a disciple in poetry of Asir Lucknowi; presented at Wajid Ali Shah's court in 1852; then at Rampur under Yusuf Ali Khan and Kalb Ali Khan; and dead at Hyderabad in 1900 weeks after arriving. Its key sentence for this record states that he held bay'ah from Hazrat Amir Shah, sajjada-nashin of the Sabiri Chishti khandan — a personal discipleship attested in this one text only. Its categories are internally untidy (they file him under both 1828 and 1829 births, and even under 1901 deaths), which is why the birth year is marked debated on the strength of the English article's 1829."
