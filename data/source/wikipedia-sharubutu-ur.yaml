reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. The article is a translation of the English article and so counts as the same source family, not an independent attestation: it gives him as born in April 1919 at Cow Lane, Accra, to Nuhu Sharubutu and Hajja Ayishatu Abbass, taught at Kumasi by Abdullah Dan Tano, Deputy Regional Chief Imam from 1974 and National Chief Imam of Ghana from 1993, and founder of the SONSETFund and IPASEC. Its infobox template is empty and carries no denomination, creed or school value at all."
