summary:
  ar: "مقالة ويكيبيديا الأردية عن تميم بن حمد آل ثاني، وهي مختصرة؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في الدوحة في 3 يونيو 1980 وتولّيه الإمارة في 25 يونيو 2013 خلفًا لوالده، ويقرأ حقل الدين في صندوق معلوماتها «اہلسنت و الجماعت» ⁦(أهل السنة والجماعة)⁩."
  en: "Urdu Wikipedia article on Tamim bin Hamad Al Thani, a short stub; used for entity facts only. It gives his birth in Doha on 3 June 1980 and his accession on 25 June 2013 succeeding his father. Its infobox religion field reads 'Ahl al-Sunna wa'l-Jama'a' (Sunni) — a structured value in a stub, the only religion statement in any of his articles."
  es: "Artículo de Wikipedia en urdu sobre Tamim bin Hamad Al Thani, un breve esbozo; utilizado únicamente para datos sobre la entidad. Indica su nacimiento en Doha el 3 de junio de 1980 y su ascenso al trono el 25 de junio de 2013, sucediendo a su padre. El campo de religión de su ficha informativa dice «Ahl al-Sunna wa'l-Jama'a» (Sunita), un valor estructurado en un esbozo, la única declaración sobre religión en cualquiera de sus artículos."
  fr: "L'article Wikipédia en ourdou sur Tamim bin Hamad Al Thani est une ébauche succincte, utilisée uniquement pour les informations le concernant. Il indique sa naissance à Doha le 3 juin 1980 et son accession au trône le 25 juin 2013, succédant à son père. Le champ « religion » de l'infobox mentionne « Ahl al-Sunna wa'l-Jama'a » (sunnite) — une valeur structurée dans une ébauche, la seule mention de religion dans tous ses articles."
  ur: "تمیم بن حمد الثانی پر اردو ویکیپیڈیا کا مضمون، ایک چھوٹا سا سٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 3 جون 1980 کو دوحہ میں ہوئی اور 25 جون 2013 کو اس کا الحاق اپنے والد کے بعد ہوا۔ اس کے معلوماتی خانے میں 'اہل السنۃ والجماعۃ' ⁦(سنی)⁩ پڑھا جاتا ہے - ایک سٹب میں ایک ساختی قدر، اس کے کسی بھی مضمون میں واحد مذہب کا بیان۔"
