summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فياض بن حامد بن رقاد الرويلي ⁦(وُلد في 27 نيسان 1958)⁩، ضابط القوات الجوية الملكية السعودية ورئيس هيئة الأركان العامة منذ 2018؛ تذكر قيادته للقوات الجوية (2013–2014) ونائبيته لرئيس الأركان (2014–2018) ولقاءاته بنظرائه الإسرائيلي والإيراني."
  en: "English Wikipedia article on Fayyadh bin Hamed bin Raqed Al Ruwaili (born 27 April 1958), the Royal Saudi Air Force officer who has chaired the General Staff since 2018; it records his command of the air force (2013-2014), his deputy chairmanship (2014-2018) and his meetings with Israeli and Iranian counterparts."
  es: "Artículo de la Wikipedia en inglés sobre Fayyadh bin Hamed bin Raqed Al Ruwaili (nacido el 27 de abril de 1958), el oficial de la Real Fuerza Aérea Saudí que ha presidido el Estado Mayor desde 2018; en él se recoge su mando de la fuerza aérea (2013-2014), su vicepresidencia (2014-2018) y sus reuniones con sus homólogos israelíes e iraníes."
  fr: "Article de Wikipédia en anglais sur Fayyadh bin Hamed bin Raqed Al Ruwaili (né le 27 avril 1958), officier de la Royal Saudi Air Force qui préside l'état-major général depuis 2018; il relate son commandement de l'armée de l'air (2013-2014), sa vice-présidence (2014-2018) et ses rencontres avec ses homologues israélien et iranien."
  ur: "فیاض بن حمید بن راکد الرویلی ⁦(پیدائش 27 اپریل 1958)⁩ پر انگریزی ویکیپیڈیا کا مضمون، رائل سعودی ایئر فورس کے افسر جنہوں نے 2018 سے جنرل اسٹاف کی سربراہی کی ہے۔ اس میں ان کی فضائیہ کی کمانڈ (2013-2014)، اس کی ڈپٹی چیئرمین شپ (2014-2018) اور اسرائیلی اور ایرانی ہم منصبوں کے ساتھ ان کی ملاقاتوں کو ریکارڈ کیا گیا ہے۔"
  tr: "2018'den beri Suudi Kraliyet Hava Kuvvetleri subayı ve Genelkurmay Başkanı olan Fayyad bin Hamid bin Raqad Al-Ruwaili (d. 27 Nisan 1958) hakkında İngilizce Wikipedia makalesi; Hava Kuvvetleri liderliğinden (2013–2014), Genelkurmay Başkan Yardımcılığı görev süresinden (2014–2018) ve İsrailli ile İranlı muhataplarıyla yaptığı görüşmelerden bahsediyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Fayyad bin Hamid bin Raqad Al-Ruwaili (lahir 27 April 1958), seorang perwira di Angkatan Udara Kerajaan Saudi dan Kepala Staf Umum sejak 2018; artikel tersebut menyebutkan kepemimpinannya di Angkatan Udara (2013–2014), masa jabatannya sebagai Wakil Kepala Staf (2014–2018), dan pertemuannya dengan rekan-rekannya di Israel dan Iran."
