summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شيخة حسينة؛ تُستخدم لوقائع الكيان فقط. تروي مولدها في تونجيبارا في 28 سبتمبر 1947 ابنةً للشيخ مجيب الرحمن، واغتيال أسرتها سنة 1975 ومنفاها في الهند، وعودتها سنة 1981 ورئاستها رابطة عوامي، ورئاستها للوزراء من 1996 إلى 2001 ومن 2009 حتى استقالتها في 5 أغسطس 2024 إثر انتفاضة يوليو، ومنفاها في الهند وإدانتها غيابيًا سنة 2025. لا يحمل صندوق معلوماتها حقلًا للديانة."
  en: "English Wikipedia article on Sheikh Hasina; used for entity facts only. It recounts her birth at Tungipara on 28 September 1947 as a daughter of Sheikh Mujibur Rahman, the murder of her family in 1975 and her exile in India, her return in 1981 and presidency of the Awami League, her premierships of 1996–2001 and 2009 until her resignation on 5 August 2024 in the July uprising, her exile in India and her conviction in absentia in 2025. Its infobox carries no religion field."
  es: "Artículo de la Wikipedia en inglés sobre Sheikh Hasina; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Tungipara el 28 de septiembre de 1947 como hija de Sheikh Mujibur Rahman, el asesinato de su familia en 1975 y su exilio en la India, su regreso en 1981 y su presidencia de la Liga Awami, sus mandatos como primera ministra entre 1996 y 2001 y desde 2009 hasta su dimisión el 5 de agosto de 2024 durante el levantamiento de julio, su exilio en la India y su condena en rebeldía en 2025. Su ficha informativa no incluye información sobre religión."
  fr: "Article de Wikipédia en anglais sur Sheikh Hasina; utilisé uniquement pour les informations sur l'entité. Il relate sa naissance à Tungipara le 28 septembre 1947, fille de Sheikh Mujibur Rahman, l'assassinat de sa famille en 1975 et son exil en Inde, son retour en 1981 et sa présidence de la Ligue Awami, ses mandats de Première ministre de 1996 à 2001 et de 2009 jusqu'à sa démission le 5 août 2024 lors du soulèvement de juillet, son exil en Inde et sa condamnation par contumace en 2025. Son infobox ne comporte pas de champ « religion »."
  ur: "شیخ حسینہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں شیخ مجیب الرحمن کی بیٹی کے طور پر 28 ستمبر 1947 کو تنگی پارہ میں ان کی پیدائش، 1975 میں ان کے خاندان کا قتل اور ہندوستان میں ان کی جلاوطنی، 1981 میں ان کی واپسی اور عوامی لیگ کی صدارت، 1996-2001 اور 2009 کی ان کی وزارت عظمیٰ، 24 اگست 2009 کو ہندوستان میں استعفیٰ دینے تک اور 24 اگست کو استعفیٰ دینے تک کا ذکر ہے۔ اسے 2025 میں غیر حاضری میں سزا سنائی گئی۔ اس کے معلوماتی خانے میں کوئی مذہب نہیں ہے۔"
