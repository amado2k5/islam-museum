summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شيخة حسينة؛ تُستخدم لوقائع الكيان فقط. تروي مولدها في تونجيبارا في 28 سبتمبر 1947 ابنةً للشيخ مجيب الرحمن، واغتيال أسرتها سنة 1975 ومنفاها في الهند، وعودتها سنة 1981 ورئاستها رابطة عوامي، ورئاستها للوزراء من 1996 إلى 2001 ومن 2009 حتى استقالتها في 5 أغسطس 2024 إثر انتفاضة يوليو، ومنفاها في الهند وإدانتها غيابيًا سنة 2025. لا يحمل صندوق معلوماتها حقلًا للديانة."
  en: "English Wikipedia article on Sheikh Hasina; used for entity facts only. It recounts her birth at Tungipara on 28 September 1947 as a daughter of Sheikh Mujibur Rahman, the murder of her family in 1975 and her exile in India, her return in 1981 and presidency of the Awami League, her premierships of 1996–2001 and 2009 until her resignation on 5 August 2024 in the July uprising, her exile in India and her conviction in absentia in 2025. Its infobox carries no religion field."
