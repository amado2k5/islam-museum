summary:
  ar: "مسح إدوارد ستيوارت كينيدي للأزياج الإسلامية، المرجع المؤسس لتصنيفها: يعرف الزيج كتاباً فلكياً بجداول لحساب مواقع الشمس والقمر والنجوم والكواكب، ويصف محتواها المعتاد وجذورها البطلمية والساسانية والهندية، وأن معظم الأزياج تبنى على نظرية سابقة وإسهامها في تحسين أدوات المثلثات والحساب والرصد."
  en: "E. S. Kennedy's foundational survey of Islamic astronomical tables: defines the zij as an astronomical handbook with tables for computing the positions of sun, moon, stars and planets, describes its typical contents and Ptolemaic, Sasanian and Indian roots, and notes that most zijes built on earlier theory so that their contributions were improved trigonometrical, computational and observational technique."
  es: "El estudio fundamental de ES Kennedy sobre las tablas astronómicas islámicas define el zij como un manual astronómico con tablas para calcular las posiciones del sol, la luna, las estrellas y los planetas, describe su contenido típico y sus raíces ptolemaicas, sasánidas e indias, y señala que la mayoría de los zijes se basaron en teorías anteriores, de modo que sus contribuciones fueron técnicas trigonométricas, computacionales y de observación mejoradas."
  fr: "L'étude fondatrice d'ES Kennedy sur les tables astronomiques islamiques: définit le zij comme un manuel astronomique contenant des tables permettant de calculer les positions du soleil, de la lune, des étoiles et des planètes, décrit son contenu typique et ses racines ptolémaïques, sassanides et indiennes, et note que la plupart des zijes s'appuyaient sur des théories antérieures, de sorte que leurs contributions étaient des techniques trigonométriques, de calcul et d'observation améliorées."
  ur: "ای ایس کینیڈی کا اسلامی فلکیاتی جدولوں کا بنیادی سروے: زیج کو ایک فلکیاتی کتابچہ کے طور پر بیان کرتا ہے جس میں سورج، چاند، ستاروں اور سیاروں کی پوزیشنوں کی گنتی کے لیے جدولیں ہیں، اس کے مخصوص مواد اور بطلیما، ساسانی اور ہندوستانی جڑوں کو بیان کیا گیا ہے، اور یہ نوٹ کیا گیا ہے کہ زیادہ تر زیجز ان کے پہلے کی تھیوریوں کو بہتر بنانے کے لیے بنائے گئے تھے۔ کمپیوٹیشنل اور مشاہداتی تکنیک۔"
  tr: "Edward Stuart Kennedy'nin İslami Aynalar Araştırması, sınıflandırmaları için temel referans: Quiz, güneş, ay, yıldızlar ve gezegenlerin konumlarını hesaplayan tablolarla tanımlanır; içeriğini ve Ptolemaios, Sasani ve Hint kökenlerini açıklar; çoğu ayna, önceki bir teoriye ve trigonometri, hesaplama ve gözlem araçlarının geliştirilmesine katkılarına dayanır."
  id: "Survei Cermin Islam karya Edward Stuart Kennedy, referensi dasar untuk klasifikasinya: Kuis didefinisikan sebagai buku astronomi dengan tabel yang menghitung posisi matahari, bulan, bintang, dan planet, yang menggambarkan isi biasanya serta akar Ptolemaik, Sassanian, dan India, serta bahwa sebagian besar cermin didasarkan pada teori sebelumnya dan kontribusinya dalam meningkatkan trigonometri, alat perhitungan, dan pengamatan."
