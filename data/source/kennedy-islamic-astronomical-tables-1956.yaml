summary:
  ar: "مسح إدوارد ستيوارت كينيدي للأزياج الإسلامية، المرجع المؤسس لتصنيفها: يعرف الزيج كتاباً فلكياً بجداول لحساب مواقع الشمس والقمر والنجوم والكواكب، ويصف محتواها المعتاد وجذورها البطلمية والساسانية والهندية، وأن معظم الأزياج تبنى على نظرية سابقة وإسهامها في تحسين أدوات المثلثات والحساب والرصد."
  en: "E. S. Kennedy's foundational survey of Islamic astronomical tables: defines the zij as an astronomical handbook with tables for computing the positions of sun, moon, stars and planets, describes its typical contents and Ptolemaic, Sasanian and Indian roots, and notes that most zijes built on earlier theory so that their contributions were improved trigonometrical, computational and observational technique."
  es: "El estudio fundamental de ES Kennedy sobre las tablas astronómicas islámicas define el zij como un manual astronómico con tablas para calcular las posiciones del sol, la luna, las estrellas y los planetas, describe su contenido típico y sus raíces ptolemaicas, sasánidas e indias, y señala que la mayoría de los zijes se basaron en teorías anteriores, de modo que sus contribuciones fueron técnicas trigonométricas, computacionales y de observación mejoradas."
