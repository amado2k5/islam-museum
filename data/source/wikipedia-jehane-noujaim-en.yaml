  ur: "Jehane Noujaim پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1974 میں واشنگٹن ڈی سی میں اس کی پیدائش، کویت اور قاہرہ میں اس کی پرورش، اس کی ہارورڈ کی تعلیم، اور اس کی فلمیں کنٹرول روم، دی اسکوائر اور دی گریٹ ہیک کو ریکارڈ کیا گیا ہے۔"
