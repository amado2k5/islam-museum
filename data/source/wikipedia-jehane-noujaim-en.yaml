reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Covers: birth 17 May 1974 in Washington, D.C., to an Egyptian-Syrian-Lebanese father and an American mother born in Connecticut; raising in Kuwait and Cairo and the move to Boston by age 10 in 1984; Milton Academy and Harvard University (visual arts and philosophy, magna cum laude 1996); the Gardiner fellowship film Mokattam; MTV's UNfiltered; Startup.com (2001, DGA and IDA awards); Control Room (2004) and the 2006 TED Prize; Shayfeen.com (2007), Pangea Day (2008) and Rafea: Solar Mama (2012); The Square (2013, Oscar nomination, DGA Award 2014), including her arrests during filming and the film's release online in Egypt; The Great Hack (2019) and The Vow (2020-2022), co-directed with Karim Amer. It states no religion for her personally."
