  ar: "مقالة ويكيبيديا الإنجليزية عن جيهان نجيم؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في واشنطن سنة 1974 ونشأتها في الكويت والقاهرة ودراستها في هارفارد وأفلامها «غرفة التحكم» و«الميدان» و«الاختراق الكبير»."
