reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 31 October 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). A modern scholarly treatment drawing on Iskandar, Djajadiningrat, Kalus & Guillot and Portuguese sources. It states expressly that no contemporary source gives his birth date or certain birthplace; its infobox gives his death as 7 August 1530, while its epigraphic discussion weighs an attributed gravestone dated 21 Muharram 930 AH (c. 30 November 1523) against the tradition that he died on 12 Dhu al-Hijja 936 AH — the conflict is carried into the record's died note and no Hijri year is paired."
