summary:
  ar: "كتاب الدكتور محمود حمدي زقزوق ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، عن نشأة الاستشراق وتطوره، وأعمال المستشرقين وأهدافهم وفئاتهم ومناهجهم، وموقف المسلمين منه؛ 212 صفحة بحسب بطاقة الفهرسة، ويحمل الكتاب إشراف الأمين العام للمجمع. المؤلف ينقد عدداً من المستشرقين وينسب أحكامه إلى نفسه."
  en: "Mahmud Hamdi Zaqzuq's book in the Scientific Series of the Islamic Research Academy of al-Azhar, on the origins and development of orientalism, the work, aims, categories and methods of orientalists, and the Muslim response. The author's judgements of orientalists are his own and are cited as such."
