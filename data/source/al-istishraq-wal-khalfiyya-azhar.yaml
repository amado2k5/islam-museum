label:
  ar: الاستشراق والخلفية الفكرية للصراع الحضاري — محمود حمدي زقزوق
  en: Orientalism and the Intellectual Background of the Civilisational Conflict — Mahmud Hamdi Zaqzuq
summary:
  ar: "كتاب الدكتور محمود حمدي زقزوق ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، عن نشأة الاستشراق وتطوره، وأعمال المستشرقين وأهدافهم وفئاتهم ومناهجهم، وموقف المسلمين منه؛ 212 صفحة بحسب بطاقة الفهرسة، ويحمل الكتاب إشراف الأمين العام للمجمع. المؤلف ينقد عدداً من المستشرقين وينسب أحكامه إلى نفسه."
  en: "Mahmud Hamdi Zaqzuq's book in the Scientific Series of the Islamic Research Academy of al-Azhar, on the origins and development of orientalism, the work, aims, categories and methods of orientalists, and the Muslim response. The author's judgements of orientalists are his own and are cited as such."
  es: "El libro de Mahmud Hamdi Zaqzuq, perteneciente a la Serie Científica de la Academia de Investigación Islámica de Al-Azhar, trata sobre los orígenes y el desarrollo del orientalismo, la obra, los objetivos, las categorías y los métodos de los orientalistas, así como la respuesta musulmana. Las opiniones del autor sobre los orientalistas son propias y se citan como tales."
  fr: "L'ouvrage de Mahmud Hamdi Zaqzuq, publié dans la collection scientifique de l'Académie de recherche islamique d'al-Azhar, traite des origines et du développement de l'orientalisme, de l'œuvre, des objectifs, des catégories et des méthodes des orientalistes, ainsi que de la réaction musulmane. Les jugements portés par l'auteur sur les orientalistes lui sont propres et sont cités comme tels."
  ur: "اسلامک ریسرچ اکیڈمی الازہر کی سائنسی سیریز میں محمود حامدی زقوق کی کتاب مستشرقین کی ابتدا اور ترقی، مستشرقین کے کام، مقاصد، زمرے اور طریقہ کار اور مسلمانوں کے ردعمل پر۔ مستشرقین کے مصنف کے فیصلے ان کے اپنے ہیں اور ان کا حوالہ دیا گیا ہے۔"
