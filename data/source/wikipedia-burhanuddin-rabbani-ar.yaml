summary:
  ar: "مقالة ويكيبيديا العربية عن برهان الدين رباني؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 20 سبتمبر 1940 في فيض آباد ووفاته في كابل في 20 سبتمبر 2011 ودفنه فيها، وتأسيسه الجمعية الإسلامية الأفغانية ورئاسته لأفغانستان وقيادته لتحالف الشمال. يعطي صندوق معلوماتها دينه «الإسلام السني» ومذهبه الفقهي «حنفي»."
  en: "Arabic Wikipedia article on Burhanuddin Rabbani; used for entity facts only. It recounts his birth on 20 September 1940 at Fayzabad, his death at Kabul on 20 September 2011 and his burial there, his founding leadership of Jamiat-e Islami, his presidency of Afghanistan and his leadership of the Northern Alliance. Its infobox gives his religion as Sunni Islam and his school of jurisprudence as Hanafi."
  ur: "برہان الدین ربانی پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 20 ستمبر 1940ء کو فیض آباد میں ان کی پیدائش، 20 ستمبر 2011ء کو کابل میں ان کی وفات اور وہیں تدفین، جمعیت اسلامی افغانستان کی ان کی بنیادی قیادت، افغانستان کی صدارت اور شمالی اتحاد کی قیادت بیان ہوئی ہے۔ اس کے معلوماتی خانے میں ان کا مذہب اسلام سنی اور فقہی مذہب حنفی درج ہے۔"
