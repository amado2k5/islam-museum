reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision, resting on Al Jazeera's 2004 profile, Hoisington (1995) and Moroccan historiography (Allal al-Rakuk, Muhammad ibn Ahmad al-Manuzi). It is the fullest narrative source: his formation in his father's mahdara, his appointment as his father's successor in the spiritual leadership, the bay'a as amir of jihad, the entry into Marrakech (15 August 1912), Sidi Bou Othman, and his works. Its dates disagree with themselves — the lead pairs '18 Ramadan 1336' with 26–27 June 1919 although that Hijri year fell in 1918 and its own categories file his death under 1337, while its infobox gives 23 June 1919 and 1876 for the birth — and the record preserves the whole configuration. Its infobox gives his religion as Islam, Sunni, and its text records that he inherited his father's Sufi shaykhhood and consolidated the Ma'iniyya zawiya."
