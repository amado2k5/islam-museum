reliability_note: "Read in the museum's session on 20 November 2026. It defines gharib al-hadith as the science of the obscure or little-used words in the texts of hadith and reports, and says independent works on it began mostly in the late 2nd and early 3rd century AH and grew by collection, supplement and criticism, with arrangements by the order of the hadith and musnads, by alphabetical order, or by the explanation of a single hadith. Used for entity facts only."
