summary:
  ar: "المجلد الأول من تجارب الأمم لأبي علي مسكويه الرازي ⁦(320–421هـ)⁩، تحقيق الدكتور أبو القاسم إمامي، دار سروش للطباعة والنشر، طهران، الطبعة الثانية 1379ش؛ فيه «تصدير عام حول مسكويه وتصنيفه تجارب الأمم» ومقدمة المصنف وتاريخ ما بعد الطوفان والفرس قبل الإسلام."
  en: "Vol. 1 of Abu Ali Miskawayh al-Razi's (320-421 AH) Tajarib al-umam, ed. Dr Abu al-Qasim Imami, Dar Surush, Tehran, 2nd printing 1379 Sh; it contains the editor's 'General introduction on Miskawayh and his composition of Tajarib al-umam', the author's preface, and history from after the Flood through pre-Islamic Persia."
