summary:
  ar: "المجلد الأول من تجارب الأمم لأبي علي مسكويه الرازي ⁦(320–421هـ)⁩، تحقيق الدكتور أبو القاسم إمامي، دار سروش للطباعة والنشر، طهران، الطبعة الثانية 1379ش؛ فيه «تصدير عام حول مسكويه وتصنيفه تجارب الأمم» ومقدمة المصنف وتاريخ ما بعد الطوفان والفرس قبل الإسلام."
  en: "Vol. 1 of Abu Ali Miskawayh al-Razi's (320-421 AH) Tajarib al-umam, ed. Dr Abu al-Qasim Imami, Dar Surush, Tehran, 2nd printing 1379 Sh; it contains the editor's 'General introduction on Miskawayh and his composition of Tajarib al-umam', the author's preface, and history from after the Flood through pre-Islamic Persia."
  es: "El volumen 1 de Tajarib al-umam de Abu Ali Miskawayh al-Razi (320-421 AH), editado por el Dr. Abu al-Qasim Imami, Dar Surush, Teherán, 2.ª edición, 1379 chelines; contiene la «Introducción general del editor sobre Miskawayh y la composición de Tajarib al-umam», el prefacio del autor y la historia desde después del Diluvio hasta la Persia preislámica."
  fr: "Volume 1 du Tajarib al-umam d'Abu Ali Miskawayh al-Razi (320-421 AH), éd. Dr Abu al-Qasim Imami, Dar Surush, Téhéran, 2e impression 1379 Sh; il contient l'« Introduction générale de l'éditeur sur Miskawayh et sa composition du Tajarib al-umam », la préface de l'auteur et l'histoire depuis après le Déluge jusqu'à la Perse préislamique."
  ur: "والیوم 1 ابو علی مسکاویہ الرازی ⁦(320-421ھ)⁩ تجاریب الامام، ایڈیشن۔ ڈاکٹر ابو القاسم امامی، دار سروش، تہران، دوسری طباعت 1379ش؛ اس میں ایڈیٹر کا 'مسکاویہ کا عمومی تعارف اور ان کی تصنیف 'تاجریب الامام'، مصنف کا دیباچہ، اور قبل از اسلام فارس میں سیلاب کے بعد کی تاریخ ہے۔"
  tr: "Ebu Ali Miskavey el-Razi tarafından yazılmış Tajrib al-Umam'ın birinci cildi (320–421 H), Dr. Ebu el-Kasım İmamî, Dar Soroush for Printing and Publishing, Tahran, ikinci baskı 1379 SH tarihi; 'Miskavey ve ulusların deneyimlerinin sınıflandırılması üzerine genel bir giriş', yazarın girişi ve tufan sonrası tarih ile İslam öncesi Persler hakkında bir inceleme içerir."
  id: "Jilid pertama Tajrib al-Umam oleh Abu Ali Miskawayh al-Razi (320–421 H), disunting oleh Dr. Abu al-Qasim Imami, Dar Soroush untuk Percetakan dan Penerbitan, Teheran, edisi kedua 1379 SH; memuat 'pengantar umum tentang Miskawayh dan klasifikasinya atas pengalaman bangsa-bangsa,' pengantar penulis, dan sejarah setelah banjir serta bangsa Persia sebelum Islam."
