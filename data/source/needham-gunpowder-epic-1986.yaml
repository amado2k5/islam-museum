summary:
  ar: "جزء جوزف نيدهم عن تقانة البارود العسكرية: يراجع المصادر العربية على الرمح الناري والمدفع، يؤرخ أوصاف مدفع النصوص العربية بين 1320 و1352، ويقرأ أصل الكلمة في أنبوبة قاذف النفط قبل السلاح الناري."
  en: "Joseph Needham's volume on military gunpowder technology: reviews the Arabic sources on the fire lance and the midfa, dates the Arabic midfa textual descriptions to 1320-1352, and reads the word's origin as the tube of a naphtha projector before it meant a firearm."
  es: "El libro de Joseph Needham sobre la tecnología militar de la pólvora: revisa las fuentes árabes sobre la lanza de fuego y la midfa, fecha las descripciones textuales árabes de la midfa entre 1320 y 1352, e interpreta el origen de la palabra como el tubo de un proyector de nafta antes de que significara arma de fuego."
  fr: "L'ouvrage de Joseph Needham sur la technologie de la poudre à canon militaire: passe en revue les sources arabes sur la lance à feu et le midfa, date les descriptions textuelles arabes du midfa de 1320 à 1352 et retrace l'origine du mot comme le tube d'un projecteur à naphte avant qu'il ne signifie une arme à feu."
  ur: "ملٹری گن پاؤڈر ٹیکنالوجی پر جوزف نیدھم کا حجم: فائر لانس اور مڈفا پر عربی ذرائع کا جائزہ لیتا ہے، عربی مڈفا کے متنی وضاحتوں کی تاریخ 1320-1352 ہے، اور اس لفظ کی اصلیت کو نیفتھا پروجیکٹر کی ٹیوب کے طور پر پڑھتا ہے اس سے پہلے کہ اس کا مطلب آتشیں اسلحہ ہو۔"
  tr: "Joseph Needham'ın askeri barut teknolojisi bölümü: Ateşli mızrak ve top üzerine Arap kaynaklarını inceler, topun Arapça metinlerdeki tanımlarını 1320 ile 1352 yılları arasında tarihler ve kelimenin kökenini ateşli silahtan önce yağ makinesinin namlusunda okur."
  id: "Bagian Joseph Needham tentang teknologi bubuk mesiu militer: Ia meninjau sumber Arab tentang tombak dan meriam berapi, mencatat tanggal deskripsi meriam dalam teks Arab antara tahun 1320 dan 1352, serta membaca asal kata tersebut di laras mesin lempar minyak sebelum senjata api."
title: "Science and Civilisation in China, Volume 5: Chemistry and Chemical Technology, Part 7, Military Technology: The Gunpowder Epic"
