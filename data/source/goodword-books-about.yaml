summary:
  ar: "صفحة «من نحن» في موقع دار غودورد: أصلها في المركز الإسلامي الذي أسسه وحيد الدين خان في دلهي سنة 1976، وتأسيس ابنه ثنية السنين خان للدار سنة 1996، وعنايتها بكتب الأطفال الإسلامية وكتب الكبار."
  en: "Goodword Books' About Us page: its roots in the Islamic Centre founded by Maulana Wahiduddin Khan in Delhi in 1976, its founding by his son Saniyasnain Khan in 1996, and its focus on Islamic children's books as well as books for adults."
  ur: "گڈورڈ بکس کا «ہمارے بارے میں» صفحہ: مولانا وحید الدین خان کے 1976 میں دہلی میں قائم کردہ اسلامی مرکز سے آغاز، 1996 میں ان کے بیٹے ثنیہ السنین خان کے ہاتھوں قیام، اور بچوں اور بڑوں کی اسلامی کتابوں پر توجہ۔"
  es: "La página \"Sobre nosotros\" de Goodword Books describe sus orígenes en el Centro Islámico fundado por Maulana Wahiduddin Khan en Delhi en 1976, su fundación por su hijo Saniyasnain Khan en 1996 y su enfoque en libros islámicos para niños, así como en libros para adultos."
  fr: "La page « À propos » de Goodword Books: ses racines dans le Centre islamique fondé par Maulana Wahiduddin Khan à Delhi en 1976, sa fondation par son fils Saniyasnain Khan en 1996 et son intérêt pour les livres islamiques pour enfants ainsi que pour adultes."
  tr: "Godward House web sitesindeki \"Biz Kimiz\" sayfası: Kökeni, 1976'da Delhi'de Wahiduddin Khan tarafından kurulan İslami Merkez'e ve oğlu Thaniya Al-Saneen Khan'ın 1996'da evi kurmasına dayanır; ayrıca İslami çocuk ve yetişkin kitaplarına olan ilgisidir."
  id: "Halaman \"Who Are We\" di situs web Godward House: Asal-usulnya berasal dari Islamic Center yang didirikan oleh Wahiduddin Khan di Delhi pada tahun 1976, dan putranya Thaniya Al-Saneen Khan mendirikan rumah tersebut pada tahun 1996, serta perhatiannya terhadap buku anak-anak dan dewasa Islam."
