summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شاهد خاقان عباسي؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 27 ديسمبر 1958 في قرية ديوال بقضاء مري، ودراسته الهندسة الكهربائية في جامعة كاليفورنيا بلوس أنجلوس وجامعة جورج واشنطن، ودخوله السياسة سنة 1988 بعد وفاة والده، ورئاسته الخطوط الجوية الباكستانية، وتأسيسه شركة طيران «إير بلو»، ووزارته للبترول، ورئاسته الوزراء من أغسطس 2017 إلى مايو 2018، وما وُجّه إليه من قضايا ونتائجها كما تذكرها المقالة. وليس فيها أي محتوى ديني."
  en: "English Wikipedia article on Shahid Khaqan Abbasi; used for entity facts only. It recounts his birth on 27 December 1958 at Dewal village, Murree District, his electrical-engineering studies at UCLA and George Washington University, his entry into politics in 1988 after his father's death, his chairmanship of Pakistan International Airlines, his founding of Airblue, his petroleum ministry, his premiership from August 2017 to May 2018, and the cases brought against him with their outcomes as the article states them. It has no religion content."
