summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شاهد خاقان عباسي؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 27 ديسمبر 1958 في قرية ديوال بقضاء مري، ودراسته الهندسة الكهربائية في جامعة كاليفورنيا بلوس أنجلوس وجامعة جورج واشنطن، ودخوله السياسة سنة 1988 بعد وفاة والده، ورئاسته الخطوط الجوية الباكستانية، وتأسيسه شركة طيران «إير بلو»، ووزارته للبترول، ورئاسته الوزراء من أغسطس 2017 إلى مايو 2018، وما وُجّه إليه من قضايا ونتائجها كما تذكرها المقالة. وليس فيها أي محتوى ديني."
  en: "English Wikipedia article on Shahid Khaqan Abbasi; used for entity facts only. It recounts his birth on 27 December 1958 at Dewal village, Murree District, his electrical-engineering studies at UCLA and George Washington University, his entry into politics in 1988 after his father's death, his chairmanship of Pakistan International Airlines, his founding of Airblue, his petroleum ministry, his premiership from August 2017 to May 2018, and the cases brought against him with their outcomes as the article states them. It has no religion content."
  es: "Artículo de la Wikipedia en inglés sobre Shahid Khaqan Abbasi; utilizado únicamente para datos biográficos. Relata su nacimiento el 27 de diciembre de 1958 en la aldea de Dewal, distrito de Murree, sus estudios de ingeniería eléctrica en la UCLA y la Universidad George Washington, su incursión en la política en 1988 tras la muerte de su padre, su presidencia de Pakistan International Airlines, la fundación de Airblue, su ministerio de petróleo, su mandato como primer ministro desde agosto de 2017 hasta mayo de 2018, y los casos presentados en su contra con sus respectivos resultados, tal como se indica en el artículo. No contiene contenido religioso."
  fr: "Article de Wikipédia en anglais sur Shahid Khaqan Abbasi; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance le 27 décembre 1958 au village de Dewal, dans le district de Murree, ses études d'ingénierie électrique à l'UCLA et à l'Université George Washington, son entrée en politique en 1988 après le décès de son père, sa présidence de Pakistan International Airlines, la création d'Airblue, son ministère du Pétrole, son mandat de Premier ministre d'août 2017 à mai 2018, ainsi que les affaires judiciaires intentées contre lui et leurs conclusions, telles qu'elles sont présentées dans l'article. Il ne contient aucun contenu religieux."
