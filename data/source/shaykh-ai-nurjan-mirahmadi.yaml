summary:
  ar: "ملف الشيخ نورجان مير أحمدي في فريق Shaykh.ai: يذكر أنه عمل قرابة ثلاثة عقود على نشر التعاليم الصوفية الإسلامية، وتدرّب عند أساتذة صوفيين وحصل على إجازة في نقل التعاليم الصوفية وإرشادها في العالم، ويدير مركزًا صوفيًا متفرغًا ومقهى «رومي روز» في فانكوفر، ويقدّم برنامج Divine Love التلفزيوني الأسبوعي."
  en: "The Shaykh.ai team profile of Shaykh Nurjan Mirahmadi: for nearly three decades he has spread the Sufi Islamic teachings, trained under Sufi masters and received ijaza to impart Sufi teachings and guidance worldwide, operates a full-time Sufi centre and the Rumi Rose cafe in Vancouver, and hosts the weekly Divine Love television show."
  es: "Perfil del jeque Nurjan Mirahmadi en Shaykh.ai: durante casi tres décadas ha difundido las enseñanzas islámicas sufíes, se ha formado con maestros sufíes y ha recibido la ijaza para impartir enseñanzas y orientación sufíes en todo el mundo, dirige un centro sufí a tiempo completo y el café Rumi Rose en Vancouver, y presenta el programa de televisión semanal Divine Love."
  fr: "Profil de l'équipe Shaykh.ai concernant le cheikh Nurjan Mirahmadi: depuis près de trois décennies, il diffuse les enseignements islamiques soufis, s'est formé auprès de maîtres soufis et a reçu l'ijaza pour transmettre des enseignements et des conseils soufis dans le monde entier, dirige un centre soufi à temps plein et le café Rumi Rose à Vancouver, et anime l'émission télévisée hebdomadaire Divine Love."
  ur: "شیخ نورجان میراحمدی کی شیخ ڈاٹ آئی ٹیم پروفائل: تقریباً تین دہائیوں تک انہوں نے صوفی اسلامی تعلیمات کو پھیلایا، صوفی اساتذہ کے تحت تربیت حاصل کی اور دنیا بھر میں صوفی تعلیمات اور رہنمائی فراہم کرنے کے لیے اعجاز حاصل کیا، وینکوور میں ایک کل وقتی صوفی مرکز اور رومی روز کیفے چلاتے ہیں، اور ہفتہ وار ڈیوائن لو ٹیلی ویژن شو کی میزبانی کرتے ہیں۔"
  tr: "Şeyh Nurjan Mir Ahmadi'nin Shaykh.ai ekibindeki dosyası: Yaklaşık otuz yıl boyunca İslami Sufi öğretilerini yaymak için çalıştığını, Sufi ustalarının yanında eğitim aldığını, Sufi öğretilerini dünya çapında aktarma ve rehberlik etme lisansı aldığını, Vancouver'daki 'Romy Rose' kafesi olan özel bir Sufi merkezini yönettiğini ve haftalık televizyon programı Divine Love'u sunduğunu belirtmek gerekir."
  id: "Berkas Sheikh Nurjan Mir Ahmadi di tim Shaykh.ai: Perlu disebutkan bahwa ia bekerja hampir tiga dekade menyebarkan ajaran Sufi Islam, dilatih di bawah para master Sufi, memperoleh lisensi untuk meneruskan dan membimbing ajaran Sufi di seluruh dunia, mengelola pusat Sufi khusus, kafe 'Romy Rose' di Vancouver, dan menjadi pembawa acara program televisi mingguan Divine Love."
