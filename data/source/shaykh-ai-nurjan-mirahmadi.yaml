summary:
  ar: "ملف الشيخ نورجان مير أحمدي في فريق Shaykh.ai: يذكر أنه عمل قرابة ثلاثة عقود على نشر التعاليم الصوفية الإسلامية، وتدرّب عند أساتذة صوفيين وحصل على إجازة في نقل التعاليم الصوفية وإرشادها في العالم، ويدير مركزًا صوفيًا متفرغًا ومقهى «رومي روز» في فانكوفر، ويقدّم برنامج Divine Love التلفزيوني الأسبوعي."
  en: "The Shaykh.ai team profile of Shaykh Nurjan Mirahmadi: for nearly three decades he has spread the Sufi Islamic teachings, trained under Sufi masters and received ijaza to impart Sufi teachings and guidance worldwide, operates a full-time Sufi centre and the Rumi Rose cafe in Vancouver, and hosts the weekly Divine Love television show."
