summary:
  ar: "الطبعة الأولى ⁦(الرياض، دار القبس للنشر والتوزيع، 1438هـ/2017م)⁩ للمجلد العاشر من مرعاة المفاتيح شرح مشكاة المصابيح لعبيد الله محمد عبد السلام المباركفوري، بتحقيق وتخريج محمد سليمان أمين؛ يضم تتمة كتاب الدعوات وكتاب المناسك، أحاديث 2404 إلى 2584 في ترقيم المشكاة المعتمد في الطبعة."
  en: "First edition (Riyadh, Dar al-Qabas, 1438 AH / 2017 CE) of volume 10 of Mir'at al-Mafatih, a commentary on the Mishkat al-Masabih by Ubayd Allah Muhammad Abd al-Salam al-Mubarakfuri, edited and with takhrij by Muhammad Sulayman Amin; it covers the end of the Book of Supplications and the Book of Rites, hadiths 2404 to 2584 by the numbering the edition gives."
  es: "Primera edición (Riad, Dar al-Qabas, 1438 AH / 2017 CE) del volumen 10 de Mir'at al-Mafatih, un comentario sobre el Mishkat al-Masabih de Ubayd Allah Muhammad Abd al-Salam al-Mubarakfuri, editado y con takhrij por Muhammad Sulayman Amin; abarca el final del Libro de las Súplicas y el Libro de los Ritos, hadices 2404 a 2584 según la numeración de la edición."
  fr: "Première édition (Riyad, Dar al-Qabas, 1438 AH / 2017 CE) du volume 10 de Mir'at al-Mafatih, un commentaire sur le Mishkat al-Masabih par Ubayd Allah Muhammad Abd al-Salam al-Mubarakfuri, édité et avec takhrij par Muhammad Sulayman Amin; il couvre la fin du Livre des Supplications et du Livre des Rites, hadiths 2404 à 2584 selon la numérotation de l'édition."
  ur: "میرات المفاتیح کی جلد 10 کا پہلا ایڈیشن ⁦(ریاض، دار القبس، 1438ھ / 2017 عیسوی)⁩، مشکوٰۃ المصابیح کی ایک تفسیر عبید اللہ محمد عبدالسلام المبارکفوری، محمد سلیمان امین کی تدوین اور تخریج کے ساتھ؛ اس میں دعاؤں کی کتاب کے آخر میں اور کتابوں کی کتاب، احادیث 2404 سے 2584 تک کا احاطہ کیا گیا ہے۔"
  tr: "Birinci baskı (Riyad, Dar al-Kabas, Yayın ve Dağıtım İçin, 1438 Hicri / 2017 M.S.) Mar'a'at al-Mafatih, Sharh Mishkat al-Masabih adlı eserinden, Ubeyd Allah Muhammed Abd al-Salam al-Mubarakfuri'nin derlediği ve düzenlendiği eser; Mişkat'ın numaralandırmasında Namaz Kitabı ve Manasik Kitabı'nın devamını içerir; Mişkat'ın numaralandırmasında 2404-2584 numaralı hadislerin devamını içerir."
  id: "Edisi pertama (Riyadh, Dar Al-Qabas untuk Penerbitan dan Distribusi, 1438 H / 2017 M) jilid sepuluh dari Mar'a'at al-Mafatih, Sharh Mishkat al-Masabih oleh Ubayd Allah Muhammad Abd al-Salam al-Mubarakfuri, disunting dan diedit oleh Muhammad Suleiman Amin; mencakup kelanjutan Kitab Permohonan dan Kitab Manasik, hadis 2404 hingga 2584 dalam penomoran Mishkat sebagaimana diadopsi dalam edisi."
