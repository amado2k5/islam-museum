summary:
  ar: "الطبعة الأولى (الرياض، دار القبس للنشر والتوزيع، 1438هـ/2017م) للمجلد العاشر من مرعاة المفاتيح شرح مشكاة المصابيح لعبيد الله محمد عبد السلام المباركفوري، بتحقيق وتخريج محمد سليمان أمين؛ يضم تتمة كتاب الدعوات وكتاب المناسك، أحاديث 2404 إلى 2584 في ترقيم المشكاة المعتمد في الطبعة."
  en: "First edition (Riyadh, Dar al-Qabas, 1438 AH / 2017 CE) of volume 10 of Mir'at al-Mafatih, a commentary on the Mishkat al-Masabih by Ubayd Allah Muhammad Abd al-Salam al-Mubarakfuri, edited and with takhrij by Muhammad Sulayman Amin; it covers the end of the Book of Supplications and the Book of Rites, hadiths 2404 to 2584 by the numbering the edition gives."
