summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد ظفر الله خان (1893–1985)؛ تعطي مولده في 6 شباط 1893 في سيالكوت ووفاته في 1 أيلول 1985 في لاهور، وتروي وزارته للخارجية ورئاستيه للجمعية العامة ومحكمة العدل الدولية، وينص قسم دينها على أنه كان مسلماً أحمدياً ترأس فرع لاهور للجماعة الأحمدية (1919–1935) وأقر علناً بانتمائه إليها."
  en: "The English Wikipedia article on Muhammad Zafrullah Khan (1893–1985), titled 'Zafrulla Khan'; it gives his birth on 6 February 1893 at Sialkot and his death on 1 September 1985 at Lahore, recounts his foreign ministership and his presidencies of the UN General Assembly and the International Court of Justice, and its Religion section states that as an Ahmadi Muslim he presided over the Lahore chapter of the Ahmadiyya Community (1919–1935) and openly acknowledged his membership of it."
  es: "El artículo de la Wikipedia en inglés sobre Muhammad Zafrullah Khan (1893-1985), titulado 'Zafrulla Khan', indica que nació el 6 de febrero de 1893 en Sialkot y falleció el 1 de septiembre de 1985 en Lahore, relata su labor como ministro de Asuntos Exteriores y sus presidencias de la Asamblea General de la ONU y de la Corte Internacional de Justicia, y su sección sobre religión afirma que, como musulmán ahmadí, presidió la sección de Lahore de la Comunidad Ahmadiyya (1919-1935) y reconoció abiertamente su pertenencia a la misma."
  fr: "L'article de Wikipédia en anglais sur Muhammad Zafrullah Khan (1893-1985), intitulé « Zafrulla Khan », indique sa naissance le 6 février 1893 à Sialkot et sa mort le 1er septembre 1985 à Lahore, relate son mandat de ministre des Affaires étrangères et ses présidences de l'Assemblée générale des Nations Unies et de la Cour internationale de Justice, et sa section Religion précise qu'en tant que musulman ahmadi, il a présidé la section de Lahore de la Communauté ahmadiyya (1919-1935) et a ouvertement reconnu son appartenance à celle-ci."
