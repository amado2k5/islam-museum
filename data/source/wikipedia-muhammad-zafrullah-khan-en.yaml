summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد ظفر الله خان (1893–1985)؛ تعطي مولده في 6 شباط 1893 في سيالكوت ووفاته في 1 أيلول 1985 في لاهور، وتروي وزارته للخارجية ورئاستيه للجمعية العامة ومحكمة العدل الدولية، وينص قسم دينها على أنه كان مسلماً أحمدياً ترأس فرع لاهور للجماعة الأحمدية (1919–1935) وأقر علناً بانتمائه إليها."
  en: "The English Wikipedia article on Muhammad Zafrullah Khan (1893–1985), titled 'Zafrulla Khan'; it gives his birth on 6 February 1893 at Sialkot and his death on 1 September 1985 at Lahore, recounts his foreign ministership and his presidencies of the UN General Assembly and the International Court of Justice, and its Religion section states that as an Ahmadi Muslim he presided over the Lahore chapter of the Ahmadiyya Community (1919–1935) and openly acknowledged his membership of it."
