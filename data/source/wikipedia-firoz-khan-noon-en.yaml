  ar: "مقالة ويكيبيديا الإنجليزية عن فيروز خان نون (1893–1970)؛ تعطي مولده في 7 أيار 1893 ووفاته في 9 كانون الأول 1970، وتروي رئاسته للوزراء (1957–1958) خلفاً لإبراهيم إسماعيل تشوندريغار، وشراء غوادر، وحاكميته لبنغال الشرقية (1950–1953) ووزارة الخارجية في حكومة سهروردي؛ وتستخدم قالب عمر الوفاة تاريخ 18 حزيران 1893. لا يسمي نصها مذهباً له."
  en: "The English Wikipedia article on Firoz Khan Noon (1893–1970); it gives his birth on 7 May 1893 and his death on 9 December 1970, and recounts his premiership (1957–1958) succeeding Ibrahim Ismail Chundrigar, the Gwadar purchase, his governorship of East Bengal (1950–1953) and his foreign ministership under Suhrawardy; its death-age template computes from 18 June 1893. Its text names no school for him."
