summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيروز خان نون (1893–1970)؛ تعطي مولده في 7 أيار 1893 ووفاته في 9 كانون الأول 1970، وتروي رئاسته للوزراء (1957–1958) خلفاً لإبراهيم إسماعيل تشوندريغار، وشراء غوادر، وحاكميته لبنغال الشرقية (1950–1953) ووزارة الخارجية في حكومة سهروردي؛ وتستخدم قالب عمر الوفاة تاريخ 18 حزيران 1893. لا يسمي نصها مذهباً له."
  en: "The English Wikipedia article on Firoz Khan Noon (1893–1970); it gives his birth on 7 May 1893 and his death on 9 December 1970, and recounts his premiership (1957–1958) succeeding Ibrahim Ismail Chundrigar, the Gwadar purchase, his governorship of East Bengal (1950–1953) and his foreign ministership under Suhrawardy; its death-age template computes from 18 June 1893. Its text names no school for him."
  es: "El artículo de la Wikipedia en inglés sobre Firoz Khan Noon (1893-1970) indica que nació el 7 de mayo de 1893 y falleció el 9 de diciembre de 1970, y relata su mandato como primer ministro (1957-1958) sucediendo a Ibrahim Ismail Chundrigar, la compra de Gwadar, su gobernación de Bengala Oriental (1950-1953) y su ministerio de Asuntos Exteriores bajo el mandato de Suhrawardy; su cálculo de edad para la muerte parte del 18 de junio de 1893. El texto no menciona ninguna escuela a la que haya asistido."
  fr: "L'article de Wikipédia en anglais sur Firoz Khan Noon (1893-1970) indique sa naissance le 7 mai 1893 et sa mort le 9 décembre 1970, et relate son mandat de Premier ministre (1957-1958) succédant à Ibrahim Ismail Chundrigar, l'achat de Gwadar, son poste de gouverneur du Bengale oriental (1950-1953) et son ministère des Affaires étrangères sous Suhrawardy; son modèle de calcul de l'âge au décès part du 18 juin 1893. Le texte ne mentionne aucune école pour lui."
  ur: "فیروز خان نون (1893–1970) پر انگریزی ویکیپیڈیا کا مضمون؛ یہ 7 مئی 1893 کو ان کی پیدائش اور 9 دسمبر 1970 کو ان کی موت کا ذکر کرتا ہے، اور ابراہیم اسماعیل چندریگر کے بعد ان کی وزارت عظمیٰ (1957-1958)، گوادر کی خریداری، اس کی مشرقی بنگال کی گورنری (1950-1953) اور سہروردی کے تحت اس کی وزارت خارجہ کا ذکر کرتا ہے۔ اس کا ڈیتھ ایج ٹیمپلیٹ 18 جون 1893 سے حساب کرتا ہے۔ اس کے متن میں اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Firoz Khan Noon (1893–1970) hakkında İngilizce Wikipedia makalesi; doğumunu 7 Mayıs 1893'te, ölümünü 9 Aralık 1970'te ve İbrahim Ismail Chundrighar'ın yerine geçen bakanlık dönemini (1957–1958), Gwadar'ın satın alınmasını, Doğu Bengal valiliğini (1950–1953) ve Suhrawardy hükümetinde Dışişleri Bakanlığı'nı anlatır; 18 Haziran 1893 tarihli ölüm yaşı şablonunu kullanır. Metinde onun düşünce okulunun adı verilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Firoz Khan Noon (1893–1970); menyebutkan kelahirannya pada 7 Mei 1893, dan kematiannya pada 9 Desember 1970, serta menceritakan masa jabatannya sebagai menteri (1957–1958) menggantikan Ibrahim Ismail Chundrighar, pembelian Gwadar, masa jabatan gubernurnya di Bengal Timur (1950–1953), dan Kementerian Luar Negeri dalam pemerintahan Suhrawardy; artikel ini menggunakan template usia kematian tertanggal 18 Juni 1893. Teksnya tidak menyebutkan aliran pemikirannya."
