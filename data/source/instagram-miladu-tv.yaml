summary:
  ar: "حساب بابديو ميلادو على إنستغرام (@miladu_tv)؛ أظهرت بيانات منشور الإنجاز المؤرخ في 6 نوفمبر 2025، كما قرأها حصاد الموجة في 8 نوفمبر 2026، 110 آلاف متابع للحساب و300 ألف مشترك لقناته على يوتيوب آنذاك."
  en: "Babdeo Miladu's Instagram account (@miladu_tv); the metadata of its milestone post dated 6 November 2025, as read by the wave harvest on 8 November 2026, showed 110,000 followers for the account and 300,000 subscribers for his YouTube channel at that time."
  ur: "بابدیو میلادو کا انسٹاگرام اکاؤنٹ (@miladu_tv)؛ اس کی 6 نومبر 2025ء کی سنگِ میل پوسٹ کے میٹا ڈیٹا کے مطابق، جیسا کہ لہر کی فصل نے 8 نومبر 2026ء کو پڑھا، اس وقت اکاؤنٹ کے 110,000 فالوور اور اس کے یوٹیوب چینل کے 300,000 سبسکرائبر تھے۔"
  es: "La cuenta de Instagram de Babdeo Miladu (@miladu_tv); los metadatos de su publicación más importante, fechada el 6 de noviembre de 2025, según lo leído por Wave Harvest el 8 de noviembre de 2026, mostraban 110.000 seguidores para la cuenta y 300.000 suscriptores para su canal de YouTube en ese momento."
  fr: "Le compte Instagram de Babdeo Miladu (@miladu_tv); les métadonnées de sa publication marquante datée du 6 novembre 2025, telles que lues par la vague de récolte le 8 novembre 2026, indiquaient 110 000 abonnés pour le compte et 300 000 abonnés pour sa chaîne YouTube à ce moment-là."
  tr: "Papadio Milado'nun Instagram hesabı (@miladu_tv); 6 Kasım 2025 tarihli başarı paylaşımından alınan veriler, Hussad Al-Mowja'nın 8 Kasım 2026'da okuduğu üzere, o dönemde YouTube kanalında 110.000 takipçi ve 300.000 abone olduğunu gösteriyordu."
  id: "Akun Instagram Papadio Milado (@miladu_tv); data dari postingan pencapaian tertanggal 6 November 2025, yang dibaca oleh Hussad Al-Mowja pada 8 November 2026, menunjukkan 110.000 pengikut dan 300.000 pelanggan saluran YouTube-nya pada saat itu."
