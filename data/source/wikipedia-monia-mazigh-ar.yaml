summary:
  ar: "مقالة ويكيبيديا العربية عن منية مازيغ؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها ديانتها «الإسلام» بصيغة عامة وزوجها ماهر عرار، ويعطي نصّها ميلادها في تونس سنة 1970 وهجرتها إلى كندا سنة 1991."
  en: "Arabic Wikipedia article on Monia Mazigh; used for entity facts only. Its infobox gives her religion as Islam generically and her husband as Maher Arar; its text gives her birth in Tunisia in 1970 and her emigration to Canada in 1991."
  es: "Artículo de Wikipedia en árabe sobre Monia Mazigh; se utiliza únicamente para obtener información sobre la persona. Su ficha informativa indica que su religión es el islam en general y que su esposo es Maher Arar; el texto menciona que nació en Túnez en 1970 y que emigró a Canadá en 1991."
  fr: "Article Wikipédia en arabe sur Monia Mazigh; utilisé uniquement pour les informations la concernant. Son infobox indique qu’elle est de confession musulmane et que son mari est Maher Arar; son texte précise qu’elle est née en Tunisie en 1970 et qu’elle a émigré au Canada en 1991."
  ur: "عربی ویکیپیڈیا مضمون مونیہ مزائح پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی خانہ اس کا مذہب اسلام کے طور پر اور اس کے شوہر کو مہر ارار کے طور پر دیتا ہے۔ اس کا متن 1970 میں تیونس میں اس کی پیدائش اور 1991 میں اس کی کینیڈا ہجرت کرتا ہے۔"
  tr: "Munia Mazigh hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bilgi kutusu genel olarak dinini \"İslam\"ı veriyor ve eşi Maher Arar metnini veriyor; 1970'te Tunus'ta doğduğunu ve 1991'de Kanada'ya göçünü anlatıyor."
  id: "Artikel Wikipedia Arab tentang Munia Mazigh; digunakan hanya untuk fakta entitas. Infobox-nya memberikan agamanya \"Islam\" dalam bentuk umum, dan suaminya Maher Arar memberikan teks, yang menyebutkan kelahirannya di Tunisia pada tahun 1970 dan imigrasinya ke Kanada pada tahun 1991."
