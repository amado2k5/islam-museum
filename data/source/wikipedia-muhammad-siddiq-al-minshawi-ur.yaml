  ar: "مقالہ اردو ويكيبيديا عن محمد صديق المنشاوي؛ يقترن فيه مولده بـ28 ربيع الثاني 1338هـ ووفاته في المنشاة بـ5 ربيع الثاني 1389هـ، وصندوق معلوماته ⁦(بالعربية)⁩ يعطي عقيدته أهل السنة والجماعة ويترك المذهب خاليا."
  en: "Urdu Wikipedia article on Muhammad Siddiq al-Minshawi; it pairs his birth with 28 Rabi' al-Thani 1338 AH and his death at al-Munsha'ah with 5 Rabi' al-Thani 1389 AH, and its infobox gives his creed as Ahl al-Sunna wa-l-Jama'a with the madhhab field blank."
  es: "Artículo de Wikipedia en urdu sobre Muhammad Siddiq al-Minshawi; relaciona su nacimiento con el 28 Rabi' al-Thani de 1338 AH y su muerte en al-Munsha'ah con el 5 Rabi' al-Thani de 1389 AH, y su ficha informativa indica que su credo era Ahl al-Sunna wa-l-Jama'a con el campo madhhab en blanco."
  fr: "L'article de Wikipédia en ourdou sur Muhammad Siddiq al-Minshawi; il associe sa naissance au 28 Rabi' al-Thani 1338 AH et sa mort à al-Munsha'ah au 5 Rabi' al-Thani 1389 AH, et son infobox indique sa croyance comme Ahl al-Sunna wa-l-Jama'a avec le champ madhhab vide."
