summary:
  ar: "مقالة ويكيبيديا العربية عن سعيد المفتي (1898–1989)، الزعيم الأردني الشركسي من أسرة حبجوقة القبرطايية، الذي استضاف الأمير عبد الله في بيته عند وصوله من الحجاز سنة 1921، وقاد سنة 1920 قوة من ألف مقاتل شركسي إلى سوريا نصرة للملك فيصل، وكان عضوًا في مجلس الشورى في العشرين من عمره ومن مؤسسي حزب الشعب الأردني (1927)، وشكّل أربع حكومات بين 1950 و1955، وتقاعد سنة 1974 وتوفي ودُفن في عمان."
  en: "Arabic Wikipedia article on Sa'id al-Mufti (1898–1989), the Jordanian Circassian leader of the Habjoka family of the Kabarday tribe, who hosted the Emir Abdullah at his house on his arrival from the Hejaz in 1921, led a force of a thousand Circassian fighters to Syria in 1920 in support of King Faisal, sat on the Consultative Council at twenty, co-founded the Jordan People's Party (1927), formed four governments between 1950 and 1955, retired in 1974, and died and was buried in Amman."
