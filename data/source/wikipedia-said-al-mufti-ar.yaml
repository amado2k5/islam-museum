reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full at revision 77009886 on 25 October 2026. The article gives his birth and death by year only (born in Amman in 1898, died in 1989 and buried in it), his Circassian origin in the Habjoka family of the Kabarday tribe, his schooling in the kuttabs and then at the Sultaniyya school in Damascus, cut short by his father's death in 1917, his hosting of the Emir Abdullah in 1921, and his leadership of a Circassian force to Syria in 1920. Where the English article counts three terms as prime minister, this article counts four governments formed (two under King Abdullah I and two under King Hussein) between 1950 and 1955; both counts are stated in the prose, not merged. It gives no religion for him."
