summary:
  ar: "مقالة ويكيبيديا العربية عن سعيد المفتي (1898–1989)، الزعيم الأردني الشركسي من أسرة حبجوقة القبرطايية، الذي استضاف الأمير عبد الله في بيته عند وصوله من الحجاز سنة 1921، وقاد سنة 1920 قوة من ألف مقاتل شركسي إلى سوريا نصرة للملك فيصل، وكان عضوًا في مجلس الشورى في العشرين من عمره ومن مؤسسي حزب الشعب الأردني (1927)، وشكّل أربع حكومات بين 1950 و1955، وتقاعد سنة 1974 وتوفي ودُفن في عمان."
  en: "Arabic Wikipedia article on Sa'id al-Mufti (1898–1989), the Jordanian Circassian leader of the Habjoka family of the Kabarday tribe, who hosted the Emir Abdullah at his house on his arrival from the Hejaz in 1921, led a force of a thousand Circassian fighters to Syria in 1920 in support of King Faisal, sat on the Consultative Council at twenty, co-founded the Jordan People's Party (1927), formed four governments between 1950 and 1955, retired in 1974, and died and was buried in Amman."
  es: "Artículo en árabe de la Wikipedia sobre Sa'id al-Mufti (1898-1989), el líder circasiano jordano de la familia Habjoka de la tribu Kabarday, que acogió al emir Abdullah en su casa a su llegada desde el Hiyaz en 1921, dirigió una fuerza de mil combatientes circasianos a Siria en 1920 en apoyo del rey Faisal, formó parte del Consejo Consultivo a los veinte años, cofundó el Partido Popular de Jordania (1927), formó cuatro gobiernos entre 1950 y 1955, se retiró en 1974 y murió y fue enterrado en Amán."
  fr: "Article de Wikipédia en arabe sur Sa'id al-Mufti (1898-1989), le chef circassien jordanien de la famille Habjoka de la tribu Kabarday, qui a accueilli l'émir Abdullah chez lui à son arrivée du Hedjaz en 1921, a mené une force de mille combattants circassiens en Syrie en 1920 pour soutenir le roi Faisal, a siégé au Conseil consultatif à vingt ans, a cofondé le Parti populaire jordanien (1927), a formé quatre gouvernements entre 1950 et 1955, s'est retiré en 1974, et est mort et a été enterré à Amman."
  ur: "عربی ویکیپیڈیا کا مضمون سعید المفتی (1898-1989) پر، اردن کے سرکاسیائی رہنما کباردے قبیلے کے حبجوکا خاندان کے رہنما، جس نے 1921 میں حجاز سے آمد پر امیر عبداللہ کی ان کے گھر پر میزبانی کی، ایک ہزار سرکیسیئن جنگجوؤں کی ایک فوج کی قیادت میں شام کے بادشاہ کی حمایت کے لیے، بیس سال کی عمر میں کونسل نے اردن پیپلز پارٹی (1927) کی مشترکہ بنیاد رکھی، 1950 اور 1955 کے درمیان چار حکومتیں بنائیں، 1974 میں ریٹائر ہوئے، اور انتقال کر گئے اور عمان میں دفن ہوئے۔"
title: "سعيد المفتي"
