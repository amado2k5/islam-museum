summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سوسيلو بامبانغ يودهويونو ⁦(وُلد 1949)⁩؛ تُستخدم لوقائع الكيان فقط. تروي مولده في باسيتان في 9 سبتمبر 1949، ومسيرته العسكرية، ومناصبه الوزارية التنسيقية، وتأسيسه الحزب الديمقراطي، وولايتيه الرئاسيتين (2004–2014)."
  en: "English Wikipedia article on Susilo Bambang Yudhoyono (born 1949); used for entity facts only. It recounts his birth at Pacitan on 9 September 1949, his army career, his coordinating-minister posts, the founding of the Democratic Party, and his two presidential terms (2004–2014)."
  es: "Artículo de la Wikipedia en inglés sobre Susilo Bambang Yudhoyono (nacido en 1949); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Pacitan el 9 de septiembre de 1949, su carrera militar, sus cargos como ministro coordinador, la fundación del Partido Demócrata y sus dos mandatos presidenciales (2004-2014)."
  fr: "Article de Wikipédia en anglais sur Susilo Bambang Yudhoyono (né en 1949); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Pacitan le 9 septembre 1949, sa carrière militaire, ses postes de ministre coordinateur, la fondation du Parti démocrate et ses deux mandats présidentiels (2004-2014)."
  ur: "Susilo Bambang Yudhoyono ⁦(پیدائش 1949)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 9 ستمبر 1949 کو پیکیٹن میں ان کی پیدائش، ان کے فوجی کیریئر، ان کے رابطہ کار وزیر کے عہدوں، ڈیموکریٹک پارٹی کی بنیاد، اور ان کی دو صدارتی مدتوں (2004–2014) کا ذکر ہے۔"
  tr: "Susilo Bambang Yudhoyono (1949 doğumlu) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 9 Eylül 1949'da Bassetan'daki doğumunu, askeri kariyerini, bakanlık koordinasyon pozisyonlarını, Demokrat Parti'nin kuruluşunu ve iki başkanlık dönemini (2004–2014) anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Susilo Bambang Yudhoyono (lahir 1949); digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Bassetan pada 9 September 1949, karier militernya, posisi koordinasi menteri, pendirian Partai Demokrat, dan dua masa jabatannya sebagai presiden (2004–2014)."
