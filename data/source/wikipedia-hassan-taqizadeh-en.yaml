summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسن تقي زاده؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في تبريز في 27 سبتمبر 1878 ووفاته في طهران في 28 يناير 1970، وأسرته السيدية التقليدية وأباه رجل الدين وصيرورته هو نفسه ملّا في شبابه، ثم مسيرته سياسيًا علمانيًا ودبلوماسيًا وعالمًا في التقاويم الإيرانية عبر العهدين القاجاري والبهلوي."
  en: "English Wikipedia article on Hassan Taqizadeh; used for entity facts only. It gives his birth at Tabriz on 27 September 1878 and his death at Tehran on 28 January 1970, his traditional Sayyed family, his clergyman father and his own becoming a mullah in youth, and his career as a secular politician, diplomat and scholar of Iranian calendars across the Qajar and Pahlavi eras."
  es: "Artículo de la Wikipedia en inglés sobre Hassan Taqizadeh; utilizado únicamente para datos sobre la persona. Describe su nacimiento en Tabriz el 27 de septiembre de 1878 y su muerte en Teherán el 28 de enero de 1970, su familia tradicional Sayyed, su padre clérigo y su propia conversión al islam en su juventud, así como su trayectoria como político laico, diplomático y estudioso de los calendarios iraníes durante las épocas Qajar y Pahlavi."
  fr: "Article de Wikipédia en anglais sur Hassan Taqizadeh; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance à Tabriz le 27 septembre 1878 et sa mort à Téhéran le 28 janvier 1970, son appartenance à la famille Sayyed traditionnelle, son père religieux et sa propre ordination comme mollah dans sa jeunesse, ainsi que sa carrière d’homme politique laïc, de diplomate et d’érudit spécialiste des calendriers iraniens sous les dynasties Qajar et Pahlavi."
  ur: "حسن تقی زادہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 27 ستمبر 1878 کو تبریز میں ان کی پیدائش اور 28 جنوری 1970 کو تہران میں ان کی موت، اس کا روایتی سید خاندان، اس کے پادری والد اور جوانی میں اس کا خود ملا بننا، اور قاجار اور پہلوی دور میں ایک سیکولر سیاست دان، سفارت کار اور ایرانی کیلنڈروں کے اسکالر کے طور پر ان کا کیریئر۔"
