  ar: "مقالة ويكيبيديا الإنجليزية عن حسن تقي زاده؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في تبريز في 27 سبتمبر 1878 ووفاته في طهران في 28 يناير 1970، وأسرته السيدية التقليدية وأباه رجل الدين وصيرورته هو نفسه ملّا في شبابه، ثم مسيرته سياسيًا علمانيًا ودبلوماسيًا وعالمًا في التقاويم الإيرانية عبر العهدين القاجاري والبهلوي."
  en: "English Wikipedia article on Hassan Taqizadeh; used for entity facts only. It gives his birth at Tabriz on 27 September 1878 and his death at Tehran on 28 January 1970, his traditional Sayyed family, his clergyman father and his own becoming a mullah in youth, and his career as a secular politician, diplomat and scholar of Iranian calendars across the Qajar and Pahlavi eras."
