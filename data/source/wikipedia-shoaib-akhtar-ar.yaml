summary:
  ar: "مقالة ويكيبيديا العربية عن شعيب أختر؛ بذرة قصيرة تُستخدم لوقائع الكيان الأساسية فقط. تذكر مولده في 13 أغسطس 1975 في راولبندي وكونه لاعب كريكت باكستانيا، وتذكر في صندوق معلوماتها ديانته بلفظ أهل السنة والجماعة."
  en: "Arabic Wikipedia article on Shoaib Akhtar; a short stub used for basic entity facts only. It gives his birth on 13 August 1975 in Rawalpindi and his standing as a Pakistani cricketer. Its infobox gives his religion as Ahl al-Sunna wal-Jama'a (Sunni) — a single infobox attestation, recorded in the person record's faith note and not taken as a documented school."
  es: "Artículo en árabe de la Wikipedia sobre Shoaib Akhtar; un breve esbozo que solo contiene información básica sobre la persona. Indica su fecha de nacimiento, el 13 de agosto de 1975 en Rawalpindi, y su trayectoria como jugador de críquet pakistaní. Su ficha informativa señala que su religión es Ahl al-Sunna wal-Jama'a (suní), una única mención en la ficha informativa, registrada en la nota sobre la fe de la persona y no considerada como una escuela documentada."
  fr: "Article Wikipédia en arabe sur Shoaib Akhtar; une brève ébauche contenant uniquement des informations de base. On y apprend sa naissance le 13 août 1975 à Rawalpindi et son statut de joueur de cricket pakistanais. L’infobox indique qu’il est de confession sunnite (Ahl al-Sunna wal-Jama’a) – une simple attestation, consignée dans la note relative à la religion de sa fiche, et non une appartenance à une école de pensée officielle."
  ur: "شعیب اختر پر عربی ویکیپیڈیا مضمون؛ ایک مختصر سٹب جو صرف بنیادی ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ یہ 13 اگست 1975 کو راولپنڈی میں ان کی پیدائش اور ایک پاکستانی کرکٹر کے طور پر ان کی حیثیت رکھتا ہے۔ اس کا معلوماتی خانہ اس کا مذہب اہل السنۃ والجماعۃ ⁦(سنی)⁩ کے طور پر دیتا ہے - ایک واحد معلوماتی باکس کی تصدیق، جو شخص کے عقیدے کے نوٹ میں درج ہے اور اسے دستاویزی اسکول کے طور پر نہیں لیا گیا ہے۔"
  tr: "Shuaib Akhtar hakkında Arapça Wikipedia makalesi; sadece varlığın temel gerçekleri için kullanılan kısa bir taslak. 13 Ağustos 1975'te Rawalpindi'de ve Pakistanlı bir kriketçi olarak doğduğundan bahseder, bilgi kutusunda ise dini Ahl al-Sunnah wal-Jama'ah olarak belirtilir."
  id: "Artikel Wikipedia Arab tentang Shuaib Akhtar; sebuah stub singkat yang hanya digunakan untuk fakta dasar entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada 13 Agustus 1975 di Rawalpindi dan sebagai pemain kriket Pakistan, dan infobox menyebutkan agamanya sebagai Ahl al-Sunnah wal-Jama'ah."
