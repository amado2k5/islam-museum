summary:
  ar: "دراسة مبكرة في نشأة الأرقام الهندية وانتقالها عبر العالم الإسلامي إلى أوروبا؛ يقرر مؤلفاها أن الكتاب العرب منذ مطلع القرن التاسع أقروا بأصلها الهندي، وأن كتاب الخوارزمي في الحساب تُرجم لاتينياً في عصر أدلهارد الباثي نحو1130."
  en: "An early study of the origin of the Hindu numerals and their passage through the Islamic world to Europe; its authors show that Arabic writers from the early ninth century acknowledged the Indian origin, and that al-Khwarizmi's arithmetic was translated into Latin about 1130 in Adelard of Bath's time."
  ur: "ہندو ہندسوں کی ابتدا اور عالمِ اسلام کے راستے یورپ تک رسائی پر ابتدائی مطالعہ؛ مصنفین ثابت کرتے ہیں کہ نویں صدی کے عرب مصنفین نے ہندوستانی اصل تسلیم کی، اور خوارزمی کی کتابِ حساب تقریباً 1130ء میں لاطینی میں ترجمہ ہوئی۔"
  es: "Un estudio temprano sobre el origen de los numerales hindúes y su paso a través del mundo islámico hasta Europa; sus autores muestran que los escritores árabes de principios del siglo IX reconocieron el origen indio, y que la aritmética de al-Juarismi fue traducida al latín alrededor de 1130, en tiempos de Adelardo de Bath."
  fr: "Une étude pionnière sur l'origine des chiffres hindous et leur passage à travers le monde islamique jusqu'en Europe; ses auteurs montrent que des auteurs arabes du début du IXe siècle reconnaissaient l'origine indienne, et que l'arithmétique d'al-Khwarizmi a été traduite en latin vers 1130, à l'époque d'Adélard de Bath."
  tr: "Hint rakamlarının kökeni ve bunların İslam dünyasından Avrupa'ya aktarılması üzerine erken bir çalışma; yazarları, dokuzuncu yüzyılın başlarından itibaren Arap yazarların Hint kökenlerini kabul ettiğini ve Al-Harezmi'nin aritmetik kitabının Adelhard the Pathé döneminde, yaklaşık 1130'da Latinceye çevrildiğini ortaya koymaktadır."
  id: "Sebuah studi awal tentang asal-usul angka India dan transmisinya melalui dunia Islam ke Eropa; para penulisnya menetapkan bahwa penulis Arab sejak awal abad kesembilan mengakui asal-usul mereka dari India, dan bahwa buku aritmatika Al-Khwarizmi diterjemahkan ke dalam bahasa Latin pada era Adelhard the Pathé, sekitar tahun 1130."
