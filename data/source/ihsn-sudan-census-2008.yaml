  es: "IHSN catalog, Sudan 2008 census; CBS Sudan, IHSN catalog, 2008. Nombrado en un resumen de investigación entregado al museo con la entrada de proporciones de lenguas de Sudán; el museo no abrió la página, y el fundador aprobó usar el resumen tal como se entregó el 21 de noviembre de 2026."
