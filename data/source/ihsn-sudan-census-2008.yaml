  ar: "«فهرس IHSN، تعداد السودان 2008»، الجهاز المركزي للإحصاء في السودان، فهرس IHSN، 2008. ورد في ملخص بحثي زُوّد به المتحف مع إدخال نسب اللغات في السودان؛ ولم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص كما ورد في 21 نوفمبر 2026."
