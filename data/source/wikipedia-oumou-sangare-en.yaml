reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives her birth in 1968 (its lead specifies 25 February 1968, agreeing with the Arabic article against the French article's 2 February) at Bamako, of Fulani descent; her mother the singer Aminata Diakité and father Sidiki Sangaré, who took a second wife and left for Abidjan in 1970; singing in the streets from childhood; the 1973 inter-kindergarten singing competition won at age five, performed before several thousand at the Omnisport stadium; touring at 16 with the Djoliba percussion group; the first album Moussolou, a West African hit selling more than 200,000 copies; the World Circuit signing with Ali Farka Touré's help; Ko Sira (1993), Worotan (1996), Seya (2009), Mogoya (2017) and Timbuktu (2022); the IMC-UNESCO International Music Prize (2001), FAO goodwill ambassadorship (16 October 2003), Commander of the Ordre des Arts et des Lettres (1998), the 2011 Grammy for 'Imagine' (Best Pop Collaboration with Vocals), the WOMEX Artist Award (2017), the Aga Khan Music Award (2019) and the Rolf Schock Prize (2024); her advocacy for women's rights against child marriage and polygamy; and her businesses, the 30-room Hotel Wassoulou in Bamako and the 'Oum Sang' car. The article states no religion for her."
