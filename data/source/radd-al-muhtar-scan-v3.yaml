summary:
  ar: "الجزء الثالث من حاشية ابن عابدين على الدر المختار، في طبعة حجرية قديمة بمتن الدر المختار في الهامش، من مسح مكتبة الإسكندرية على الأرشيف ⁦(المعرّف AAlexandrina-050183، 723 صفحة)⁩. يبدأ بكتاب العتق وينتهي بكتاب الوقف، وفيه الأيمان والحدود والسرقة والسير والجزية والمرتد والبغاة واللقيط واللقطة والمفقود والشركة."
  en: "Volume 3 of Ibn Abidin's gloss on al-Durr al-Mukhtar, an old print with the text of al-Durr al-Mukhtar in the margin, from the Bibliotheca Alexandrina scan on archive.org (item AAlexandrina-050183, 723 pages). It runs from the Book of Manumission to the Book of Waqf, with oaths, hadd penalties, theft, siyar, jizya, the apostate, rebels, foundlings, lost property, the missing person and partnership."
