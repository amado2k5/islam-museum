  en: "Abu'l-Muzaffar Rustam Khan — Russian Wikipedia"
summary:
  ar: "مقالة ويكيبيديا الروسية عن أبي المظفر سلطان رستم بن مقصود بن أوزون حسن، خامس سلاطين الآق قوينلو (1492–1497)؛ تنص صراحة على أن تاريخ ميلاده غير معروف بيقين، وتذكر أنه وُلد في تبريز، وأن أباه مقصود بك والي بغداد أُعدم سنة 1478، وأنه هزم إسماعيل الصفوي سنة 1494، ثم هرب إلى جورجيا سنة 1497 ومات فيها."
  en: "Russian Wikipedia article on Abu'l-Muzaffar Sultan Rustam ibn Maqsud ibn Uzun Hasan, fifth sultan of the Aq Qoyunlu (1492–1497); it states expressly that his birth date is not reliably known, records that he was born at Tabriz, that his father Maqsud Beg, governor of Baghdad, was executed in 1478, that he defeated Ismail Safavi in 1494, and that in 1497 he fled to Georgia and died there."
  es: "Artículo de la Wikipedia rusa sobre Abu'l-Muzaffar Sultan Rustam ibn Maqsud ibn Uzun Hasan, quinto sultán de Aq Qoyunlu (1492-1497); afirma expresamente que su fecha de nacimiento no se conoce con certeza, registra que nació en Tabriz, que su padre Maqsud Beg, gobernador de Bagdad, fue ejecutado en 1478, que derrotó a Ismail Safavi en 1494 y que en 1497 huyó a Georgia y murió allí."
  fr: "L'article de Wikipédia russe sur Abu'l-Muzaffar Sultan Rustam ibn Maqsud ibn Uzun Hasan, cinquième sultan des Aq Qoyunlu (1492-1497); il indique expressément que sa date de naissance n'est pas connue avec certitude, rapporte qu'il est né à Tabriz, que son père Maqsud Beg, gouverneur de Bagdad, a été exécuté en 1478, qu'il a vaincu Ismail Safavi en 1494 et qu'en 1497, il s'est enfui en Géorgie et y est mort."
  ur: "ابوالمظفر سلطان رستم ابن مقصود ابن عزون حسن پر روسی ویکیپیڈیا کا مضمون، آق قیوونلو کے پانچویں سلطان (1492–1497)؛ اس میں واضح طور پر کہا گیا ہے کہ اس کی تاریخ پیدائش معتبر طور پر معلوم نہیں ہے، ریکارڈ ہے کہ وہ تبریز میں پیدا ہوا تھا، اس کے والد مقصود بیگ، بغداد کے گورنر، کو 1478 میں پھانسی دی گئی تھی، کہ اس نے 1494 میں اسماعیل صفوی کو شکست دی تھی، اور یہ کہ 1497 میں وہ جارجیا بھاگ گیا تھا اور وہیں انتقال کر گیا تھا۔"
  tr: "Rus Vikipedi'si, Ak Koyunlu'nun beşinci sultanı (1492–1497) Ebu el-Muzaffar Sultan Rustam ibn Maksud ibn Uzun Hasan hakkında; doğum tarihinin kesin olarak bilinmediğini açıkça belirtir; Tebriz'de doğduğunu, babası Bağdat valisi Mašsud Bey'in 1478'de idam edildiğini, 1494'te İsmail Safevi'yi yendiğini, ardından 1497'de Gürcistan'a kaçıp orada öldüğünü belirtir."
  id: "Artikel Wikipedia Rusia tentang Abu al-Muzaffar Sultan Rustam ibn Maqsud ibn Uzun Hasan, sultan kelima Aq Qoyunlu (1492–1497); secara eksplisit menyatakan bahwa tanggal lahirnya yang pasti tidak diketahui dengan pasti, menyebutkan bahwa ia lahir di Tabriz, bahwa ayahnya, Maqsud Bey, gubernur Baghdad, dieksekusi pada tahun 1478, bahwa ia mengalahkan Ismail Safavid pada tahun 1494, lalu melarikan diri ke Georgia pada tahun 1497 dan meninggal di sana."
