reliability_note: "Read in full on 1 November 2026. Its only listed source is Bosworth, The New Islamic Dynasties (1996), the same handbook the English article cites. It is the decisive witness on the birth year — it states in so many words that the date of his birth is not reliably known, which is why neither the queue's 1465 nor Wikidata's lone structured value of 1477 is adopted. Its Tabriz birthplace is single-sourced to it and is written as an edge with that disclosed. Its account of his death (flight to Georgia) conflicts with the English (execution) and Persian (killed at Tabriz) editions and is preserved as a reading. Its infobox gives his confession only as 'Islam', naming no school."
