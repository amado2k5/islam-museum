summary:
  ar: "مقالة ويكيبيديا الروسية عن أبي المظفر سلطان رستم بن مقصود بن أوزون حسن، خامس سلاطين الآق قوينلو (1492–1497)؛ تنص صراحة على أن تاريخ ميلاده غير معروف بيقين، وتذكر أنه وُلد في تبريز، وأن أباه مقصود بك والي بغداد أُعدم سنة 1478، وأنه هزم إسماعيل الصفوي سنة 1494، ثم هرب إلى جورجيا سنة 1497 ومات فيها."
  en: "Russian Wikipedia article on Abu'l-Muzaffar Sultan Rustam ibn Maqsud ibn Uzun Hasan, fifth sultan of the Aq Qoyunlu (1492–1497); it states expressly that his birth date is not reliably known, records that he was born at Tabriz, that his father Maqsud Beg, governor of Baghdad, was executed in 1478, that he defeated Ismail Safavi in 1494, and that in 1497 he fled to Georgia and died there."
