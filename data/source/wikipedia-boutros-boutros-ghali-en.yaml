  ar: "مقالة ويكيبيديا الإنجليزية عن بطرس بطرس غالي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في القاهرة سنة 1922 لأسرة قبطية، وتدريسه القانون الدولي في جامعة القاهرة، ووزارته للخارجية بالوكالة، وأمانته العامة للأمم المتحدة (1992–1996) و«خطة للسلام»، واعتراض الولايات المتحدة على ولايته الثانية، وأمانته العامة للفرنكوفونية ووفاته في القاهرة سنة 2016."
  en: "English Wikipedia article on Boutros Boutros-Ghali; used for entity facts only. It recounts his birth in Cairo in 1922 to a Coptic family, his teaching of international law at Cairo University, his acting foreign ministership, his tenure as Secretary-General of the United Nations (1992–1996) and An Agenda for Peace, the United States veto of his second term, his leadership of La Francophonie, and his death in Cairo in 2016."
