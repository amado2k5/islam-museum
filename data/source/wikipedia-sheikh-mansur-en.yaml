reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The fullest scholarly digest of the man: it infers his birth c. 1760 from his own statement to his captors in 1791 (after Musaev's 2007 biography), gives his birth name Ushurma/Uchermak (after the TDV encyclopedia), his campaigns of 1785–1791, his capture at Anapa and his death at Shlisselburg on 13 April 1794. On the question this record had to test it is explicit — citing Kemper's Encyclopaedia of Islam Three entry on Chechnya, it reports that his joining the Naqshbandi order is frequently assumed but unsupported by evidence, and citing Knysh's Encyclopaedia of Islam entry it notes he lacked the Sufi credentials of later Caucasian leaders. Its category set files him under 1732 births against its own text. Checked 1 November 2026."
