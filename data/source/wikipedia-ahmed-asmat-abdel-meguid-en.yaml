summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد عصمت عبد المجيد؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في الإسكندرية في 22 مارس 1923، ووزارته للخارجية (1984–1991)، وأمانته العامة لجامعة الدول العربية (1991–2001) خلفًا للشاذلي القليبي وخلفه فيها عمرو موسى، ووفاته في القاهرة في 21 ديسمبر 2013."
  en: "English Wikipedia article on Ahmed Asmat Abdel-Meguid; used for entity facts only. It recounts his birth in Alexandria on 22 March 1923, his foreign ministership (1984–1991), and his tenure as Secretary-General of the Arab League (1991–2001), succeeding Chedli Klibi and succeeded by Amr Moussa, and his death in Cairo on 21 December 2013."
  es: "Artículo de la Wikipedia en inglés sobre Ahmed Asmat Abdel-Meguid; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Alejandría el 22 de marzo de 1923, su mandato como ministro de Asuntos Exteriores (1984-1991), su etapa como secretario general de la Liga Árabe (1991-2001), sucediendo a Chedli Klibi y siendo sucedido por Amr Moussa, y su fallecimiento en El Cairo el 21 de diciembre de 2013."
  fr: "Article de Wikipédia en anglais sur Ahmed Asmat Abdel-Meguid; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Alexandrie le 22 mars 1923, son ministère des Affaires étrangères (1984-1991), son mandat de secrétaire général de la Ligue arabe (1991-2001), succédant à Chedli Klibi et remplacé par Amr Moussa, et son décès au Caire le 21 décembre 2013."
  ur: "احمد عصمت عبدالمجید پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 22 مارچ 1923 کو اسکندریہ میں ان کی پیدائش، ان کی وزارت خارجہ (1984-1991)، اور عرب لیگ کے سیکرٹری جنرل (1991-2001) کے طور پر ان کا دور، چیڈلی کلبی کے بعد اور عمرو موسیٰ کے بعد، اور 21 دسمبر 2013 کو قاہرہ میں ان کی موت کا ذکر ہے۔"
  tr: "Ahmed Ismat Abdel Meguid hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 22 Mart 1923'te İskenderiye'de doğduğunu, Dışişleri Bakanlığı'nı (1984–1991) ve Arap Ligi Genel Sekreterliğini (1991–2001) Chadhli Al-Qalibi'nin yerine Amr Moussa devralmasını ve 21 Aralık 2013'te Kahire'de vefatını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ahmed Ismat Abdel Meguid; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya di Alexandria pada 22 Maret 1923, Kementerian Luar Negeri (1984–1991), dan Sekretaris Jenderal Liga Arab (1991–2001) menggantikan Chadhli Al-Qalibi dan menggantikannya dalam posisi itu oleh Amr Moussa, serta kematiannya di Kairo pada 21 Desember 2013."
