reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: 'jeque Ma el-Ainéin (1830–1910; cuyo nombre real era Mohammed Mustafá uld Sheij Mohammed Fadel)' — the 1830 birth year shared with the English article against the Arabic article's exact Hijri date converting to 1831 (recorded as a conflict, the record following 1831); he accepted the Treaty of Algeciras (1906), then accused the sultan of treason when the arms flow for the anti-French jihad was cut; after the 4 March 1910 treaty he decided to take power, and — in this article's account — 'se proclamó también Sultán Azul' (proclaimed himself also Blue Sultan) before marching north in June 1910 with an army of several thousand, intercepted and destroyed by French forces on 23 June; he returned to Tiznit and died there in October 1910. The English article attributes the Blue Sultan title to his son El-Hiba, whose own museum record exists; the record follows the English article and records the Spanish article's divergent attribution as a conflict."
