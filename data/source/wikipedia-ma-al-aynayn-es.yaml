summary:
  ar: "مقالة ويكيبيديا الإسبانية عن ما العينين؛ تُستخدم لوقائع الكيان فقط. تؤرخ حياته 1830-1910 وتذكر قبوله معاهدة الجزيرة الخضراء ثم اتهامه السلطان بالخيانة، وتنسب إليه إعلان نفسه «سلطانا أزرق» خلافا للإنجليزية التي تنسب اللقب لابنه الهيبة."
  en: "Spanish Wikipedia article on Ma el-Ainéin; used for entity facts only. It dates his life 1830–1910, records his acceptance of the Treaty of Algeciras and his later accusation of treason against the sultan, and attributes a 'Blue Sultan' proclamation to him himself, against the English article's attribution of the title to his son El-Hiba."
  es: "Artículo de la Wikipedia en español sobre Ma el-Ainéin; utilizado únicamente para datos sobre la persona. En él se sitúa su vida entre 1830 y 1910, se registra su aceptación del Tratado de Algeciras y su posterior acusación de traición contra el sultán, y se le atribuye a él mismo la proclamación de «Sultán Azul», en contraposición a la atribución del título a su hijo El-Hiba en el artículo en inglés."
  fr: "Article Wikipédia espagnol sur Ma el-Ainéin; utilisé uniquement pour les informations le concernant. Il date sa vie de 1830 à 1910, relate son acceptation du traité d'Algésiras et son accusation ultérieure de trahison contre le sultan, et lui attribue la proclamation du « Sultan bleu », contrairement à l'article anglais qui attribue ce titre à son fils El-Hiba."
  ur: "ہسپانوی ویکیپیڈیا مضمون ما العین پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی زندگی کی تاریخ 1830-1910 ہے، اس کے معاہدے کو قبول کرنے اور اس کے بعد سلطان کے خلاف غداری کے الزام کو ریکارڈ کیا گیا ہے، اور انگریزی مضمون کے عنوان سے اس کے بیٹے الحیبا کو منسوب کرنے کے خلاف، 'بلیو سلطان' کے اعلان کو خود سے منسوب کیا گیا ہے۔"
  tr: "İspanyolca Vikipedi'deki 'Göz Nedir' makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1830'dan 1910'a kadar olan yaşamını anlatır, Algeciras Antlaşması'nı kabul etmesini, ardından Sultan tarafından vatana ihanet suçlamasını ve kendisini 'Mavi Sultan' olarak ilan etmesini içerir; oysa İngilizler oğlu Al-Hayba'ya unvan vermektedir."
  id: "Artikel Wikipedia bahasa Spanyol tentang 'Apa itu Mata'; hanya digunakan untuk fakta entitas. Artikel ini mengisahkan kehidupannya dari tahun 1830 hingga 1910, menyebutkan penerimaannya terhadap Perjanjian Algeciras, kemudian tuduhan pengkhianatan oleh Sultan, dan mengaitkan deklarasi dirinya sebagai 'Sultan Biru,' bertentangan dengan bahasa Inggris yang memberikan gelar kepada putranya Al-Hayba."
