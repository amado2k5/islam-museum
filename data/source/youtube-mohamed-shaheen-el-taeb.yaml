summary:
  ar: "قناة «الدعوة الإسلامية» على يوتيوب (@eld3wah)، وهي بحسب وصفها القناة الشخصية لمحمد شاهين التاعب، الباحث في الأديان والعقائد والمذاهب الفكرية المعاصرة؛ مصدر أولي لهويته وعمله وانتشاره، لا مصدر مستقل مؤيد."
  en: "The eld3wah ('Islamic Dawah') YouTube channel (@eld3wah), which its own description identifies as the personal channel of Mohamed Shaheen El-Taeb, a researcher in religions, doctrines and contemporary intellectual schools; a primary source for his identity, work and reach, not independent corroboration."
  es: "El canal de YouTube eld3wah ('Islamic Dawah') (@eld3wah), que su propia descripción identifica como el canal personal de Mohamed Shaheen El-Taeb, un investigador en religiones, doctrinas y escuelas intelectuales contemporáneas; una fuente primaria para su identidad, trabajo y alcance, no una corroboración independiente."
  fr: "La chaîne YouTube eld3wah (« Dawah islamique ») (@eld3wah), que sa propre description identifie comme la chaîne personnelle de Mohamed Shaheen El-Taeb, un chercheur en religions, doctrines et écoles intellectuelles contemporaines; une source primaire pour son identité, son travail et sa portée, et non une corroboration indépendante."
  ur: "eld3wah ('Islamic Dawah') YouTube چینل (@eld3wah)، جس کی اپنی وضاحت مذاہب، عقائد اور عصری فکری مکاتب کے ایک محقق، محمد شاہین الطیب کے ذاتی چینل کے طور پر شناخت کرتی ہے۔ اس کی شناخت، کام اور رسائی کا بنیادی ذریعہ، نہ کہ آزاد تصدیق۔"
