summary:
  ar: "مقالة تيريه أوستيبو ويكاتيت غ. تسيهايو في مجلة Mediterranean Politics عن السلفية الإثيوبية؛ تسمّي هوامشها أحمدين جبل بين فاعلي الأستاذ الجدد قائدًا لـ«صنّاع الأثر» وتذكر أن له أكثر من مليون متابع."
  en: "Terje Østebø and Yekatit G. Tsehayu's Mediterranean Politics article on Ethiopian Salafism; its notes name Ahmedin Jebel among the new ustaz actors as the leader of Impact Makers and record that he has over 1 million followers."
  es: "El artículo de Terje Østebø y Yekatit G. Tsehayu en Mediterranean Politics sobre el salafismo etíope menciona en sus notas a Ahmedin Jebel entre los nuevos actores ustaz como líder de Impact Makers y señala que tiene más de 1 millón de seguidores."
  fr: "L'article de Terje Østebø et Yekatit G. Tsehayu sur le salafisme éthiopien dans Mediterranean Politics; ses notes mentionnent Ahmedin Jebel parmi les nouveaux acteurs oustaz comme le leader d'Impact Makers et indiquent qu'il compte plus d'un million de fidèles."
  ur: "Terje Østebø اور Yekatit G. Tsehayu کا بحیرہ روم کی سیاست کا مضمون ایتھوپیائی سلفیت پر؛ اس کے نوٹ احمدین جیبل کا نام امپیکٹ میکرز کے رہنما کے طور پر نئے استاز اداکاروں میں شامل ہے اور ریکارڈ ہے کہ اس کے 1 ملین سے زیادہ پیروکار ہیں۔"
