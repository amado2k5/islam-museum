reliability_note: "Peer-reviewed journal article (DOI 10.1080/13629395.2024.2410116), read on 7 November 2026 (page crawled 15 October 2026); the notes were read in full. Note 17 states verbatim: 'Relevant examples are the Impact Makers led by like Ahmedin Jebel and the Center for Regional and National Integration Studies led by Ibrahim Mulushewa.' Note 21 states verbatim: 'Ahmedin Jebel has over 1 million followers, Abubakr Ahmed has over 600,000 followers, and Kamil Shamsu has over 200,000 followers.' The article's interviews are dated December 2021 to March 2023, so the follower note reflects that period and is superseded by the 2026 platform reads. The article studies Ethiopian Salafism as a scene; naming Ahmedin Jebel among its ustaz actors and as an organisation's leader is a scene-level framing and an affiliation, and does NOT attest a school of law or order for the man himself. It gives no birth date. Read on 7 November 2026."
