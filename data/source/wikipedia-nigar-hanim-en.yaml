summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نكار خانم (1856–1918): مولدها في إسطنبول سنة 1856 ووفاتها فيها في 1 أبريل 1918، وأبوها ماكار عثمان باشا المجري الأصل، وديوانها «إفسوس» أول كتاب شعر غربي الأسلوب لامرأة."
  en: "English Wikipedia article on Nigâr Hanım (1856–1918): her birth at Istanbul in 1856, death there on 1 April 1918, her father Macar Osman Pasha of Hungarian origin, and her Efsus as the first Western-style poetry book by a woman."
  es: "Artículo de la Wikipedia en inglés sobre Nigâr Hanım (1856-1918): su nacimiento en Estambul en 1856, su muerte allí el 1 de abril de 1918, su padre Macar Osman Pasha de origen húngaro y su obra Efsus como el primer libro de poesía de estilo occidental escrito por una mujer."
  fr: "Article de Wikipédia en anglais sur Nigâr Hanım (1856–1918): sa naissance à Istanbul en 1856, sa mort dans cette ville le 1er avril 1918, son père Macar Osman Pasha d'origine hongroise et son Efsus comme le premier livre de poésie de style occidental écrit par une femme."
  ur: "نگار حنیم (1856–1918) پر انگریزی ویکیپیڈیا کا مضمون: اس کی پیدائش 1856 میں استنبول میں، وہاں موت 1 اپریل 1918 کو، اس کے والد ماکر عثمان پاشا ہنگری نژاد، اور اس کا ایفسس ایک خاتون کی پہلی مغربی طرز کی شاعری کی کتاب ہے۔"
  tr: "Nakar Hanım (1856–1918) hakkında İngilizce Vikipedi makalesi: 1856'da İstanbul'da doğmuş ve 1 Nisan 1918'de orada vefat etmiş, babası Makar Osman Paşa Macar kökenliydi ve \"Efes\" adlı koleksiyonu, bir kadının yazdığı ilk Batı tarzı şiir kitabıdır."
  id: "Artikel Wikipedia bahasa Inggris tentang Nakar Khanum (1856–1918): Lahir di Istanbul pada tahun 1856 dan meninggal di sana pada 1 April 1918, ayahnya Makar Osman Pasha berasal dari Hungaria, dan kumpulan puisinya \"Ephesus\" adalah buku puisi bergaya Barat pertama karya seorang wanita."
