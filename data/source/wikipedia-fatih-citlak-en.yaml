summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد فاتح تشيتلاك؛ تُستخدم لوقائع الكيان فقط. تفصّل ميلاده سنة 1966 في إسطنبول، وتعليمه في ثانوية الفاتح للإمام الخطيب وجامعة مرمرة، وكتبه في الإسلام والتصوف، ورئاسته لدراويش فرقة إسطنبول للموسيقى التركية التاريخية."
  en: "English Wikipedia article on Mehmed Fatih Çıtlak; used for entity facts only. It details his birth in 1966 in Istanbul, his education at Fatih Imam Hatip High School and Marmara University, his books on Islam and Sufism, and his headship of the dervishes of the Istanbul Historical Turkish Music Ensemble."
  es: "Artículo de la Wikipedia en inglés sobre Mehmed Fatih Çıtlak; utilizado únicamente para obtener información sobre la persona. Detalla su nacimiento en 1966 en Estambul, su formación académica en el Liceo Fatih Imam Hatip y la Universidad de Marmara, sus libros sobre el islam y el sufismo, y su liderazgo de los derviches del Conjunto Histórico de Música Turca de Estambul."
  fr: "Article de Wikipédia en anglais sur Mehmed Fatih Çıtlak; utilisé uniquement pour les informations sur l’entité. Il détaille sa naissance en 1966 à Istanbul, ses études au lycée Fatih Imam Hatip et à l’université de Marmara, ses ouvrages sur l’islam et le soufisme, ainsi que son rôle de chef des derviches de l’Ensemble de musique historique turque d’Istanbul."
  ur: "انگریزی ویکیپیڈیا مضمون محمد فاتح Çıtlak پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں استنبول میں 1966 میں ان کی پیدائش، فتح امام ہتیپ ہائی اسکول اور مرمرہ یونیورسٹی میں ان کی تعلیم، اسلام اور تصوف پر ان کی کتابیں، اور استنبول کے تاریخی ترک موسیقی کے جوڑے کے درویشوں کی سربراہی کی تفصیلات درج ہیں۔"
  tr: "Mehmet Fatih Çetelak hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1966 yılında İstanbul'da doğdu, İmam El-Hatib için Fatih Lisesi'nde ve Marmara Üniversitesi'nde eğitim gördü, İslam ve Sufizm üzerine yazdı ve İstanbul Tarihi Türk Müzik Topluluğu'nun İstanbul Dervişleri'ne liderlik etti."
  id: "Artikel Wikipedia bahasa Inggris tentang Mehmet Fatih Çetelak; digunakan hanya untuk fakta entitas. Ia lahir pada tahun 1966 di Istanbul, menempuh pendidikan di Fatih High School for Imam Al-Khatib dan Universitas Marmara, menulis tentang Islam dan Sufisme, serta memimpin Istanbul Dervishes dari Istanbul Historical Turkish Music Ensemble."
