summary:
  ar: "مقالة ويكيبيديا الروسية عن منوّر قاري عبد الرشيدخانوف ⁦(1878 – 23 مايو 1931)⁩؛ تُستخدم لوقائع الكيان فقط. تؤرّخ مقدمتها وفاته بدقة بـ23 مايو 1931 في موسكو وتوثّق موقعه في أصول الصحافة الوطنية الأوزبكية والمدرسة بالطريقة الجديدة والمسرح."
  en: "Russian Wikipedia article on Munavvar Kary Abdurashidkhanov (1878 – 23 May 1931); used for entity facts only. Its lead dates his death precisely to 23 May 1931 in Moscow and documents his place at the origins of the Uzbek national press, new-method school and theatre."
  es: "Artículo de la Wikipedia en ruso sobre Munavvar Kary Abdurashidkhanov (1878-23 de mayo de 1931); utilizado únicamente para datos biográficos. Su introducción fecha su fallecimiento con precisión el 23 de mayo de 1931 en Moscú y documenta su papel en los orígenes de la prensa nacional uzbeka, la escuela de nuevo método y el teatro."
  fr: "Article de Wikipédia en russe sur Munavvar Kary Abdurashidkhanov (1878 – 23 mai 1931); utilisé uniquement à des fins d’information sur l’entité. Son introduction date précisément son décès du 23 mai 1931 à Moscou et documente son rôle dans la création de la presse nationale ouzbèke, de l’école de la nouvelle méthode et du théâtre."
  ur: "روسی ویکیپیڈیا مضمون منوور کیری عبدالرشیدخانوف ⁦(1878 - 23 مئی 1931)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی قیادت ماسکو میں 23 مئی 1931 کو ان کی موت کے بارے میں بتاتی ہے اور ازبک نیشنل پریس، نیو میتھڈ اسکول اور تھیٹر کی ابتدا میں اس کے مقام کو دستاویز کرتی ہے۔"
