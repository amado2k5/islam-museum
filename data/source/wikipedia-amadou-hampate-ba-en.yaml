summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أمادو هامباتي با؛ تُستخدم لوقائع الكيان فقط، ويُستشهد بكل واقعة بالمصدر الذي تذكره المقالة. تصف معلّمه تيرنو بوكار بأنه من وجهاء الطريقة التيجانية وتسمّيه «مرشده الروحي»."
  en: "English Wikipedia article on Amadou Hampâté Bâ; used for entity facts only, each cited where the article gives its own source. It describes his teacher Tierno Bokar as a dignitary of the Tijaniyyah brotherhood and calls Bokar his 'spiritual leader'."
  es: "Artículo de la Wikipedia en inglés sobre Amadou Hampâté Bâ; se utiliza únicamente para datos sobre la persona, citados donde el artículo proporciona su propia fuente. Describe a su maestro Tierno Bokar como un dignatario de la hermandad Tijaniyyah y lo llama su \"líder espiritual\"."
  fr: "Article de Wikipédia en anglais sur Amadou Hampâté Bâ; utilisé uniquement pour les informations relatives à l’entité, chaque citation étant indiquée dans l’article. Il décrit son maître Tierno Bokar comme un dignitaire de la confrérie Tijaniyyah et le qualifie de « guide spirituel »."
  ur: "Amadou Hampâté Bâ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک کا حوالہ دیا جاتا ہے جہاں مضمون اپنا ماخذ دیتا ہے۔ اس میں ان کے استاد ٹیرنو بوکر کو تیجانیہ بھائی چارے کے معزز کے طور پر بیان کیا گیا ہے اور بوکر کو اپنا 'روحانی رہنما' قرار دیا گیا ہے۔"
  tr: "Amadou Hambati Ba hakkında İngilizce Wikipedia makalesi; yalnızca varlığın olayları için kullanılır ve her olay makalede belirtilen kaynağı gösterir. Öğretmeni Tyrnu Pocar, onu Tijaniyya tarikatının önde gelen figürlerinden biri olarak tanımlar ve 'manevi rehberi' olarak tanımlar."
  id: "Artikel Wikipedia bahasa Inggris tentang Amadou Hambati Ba; hanya digunakan untuk peristiwa entitas tersebut, dan setiap insiden mengutip sumber yang disebutkan dalam artikel tersebut. Gurunya, Tyrnu Pocar, menggambarkannya sebagai salah satu tokoh terkemuka dari ordo Tijaniyya dan menyebutnya sebagai 'pembimbing spiritualnya.'"
