reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his Fula family at Bandiagara, adoption by Tidjani Amadou Ali Thiam, schooling under Tierno Bokar and at French schools in Bandiagara and Djenné, the refused école normale posting of 1921, colonial service in Upper Volta (1922-1932) and Bamako (1932-1942), the 1933 leave to visit Bokar, the IFAN appointment of 1942 under Théodore Monod and the research behind L'Empire peul du Macina (1955), the 1951 UNESCO grant, the Institute of Human Sciences (1960), the UNESCO Executive Board (1962-1970), the 1966 transcription work, the move to Abidjan in 1971, the works list, and the 1960/1962 history of his saying about a dying elder and a burning library. The article carries a 'multiple issues' maintenance notice, and it disagrees with itself on dates: its lead gives his birth as 1900/1901 and his death as 15 May 1991, while its infobox gives 13 May 1991 for the death; the variants are recorded in the person record. Read in full on 24 October 2026."
