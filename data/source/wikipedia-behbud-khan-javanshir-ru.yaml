summary:
  ar: "مقالة ويكيبيديا الروسية عن بهبود خان جوانشير؛ تُستخدم لوقائع الكيان فقط. تعطي تاريخيه 12 [24] يوليو 1878 – 18 يوليو 1921 وتلخّص مسيرته وزيرًا للداخلية ونائبًا لوزير التجارة والصناعة في جمهورية أذربيجان الديمقراطية وعضوًا في برلمانها. لا تذكر شيئًا عن دينه."
  en: "Russian Wikipedia article on Behbud Khan Javanshir; used for entity facts only. It gives his dates as 12 [24] July 1878 – 18 July 1921 and summarises his career as interior minister and deputy minister of trade and industry of the Azerbaijan Democratic Republic and member of its parliament. It makes no statement about his religion."
  es: "Artículo de la Wikipedia en ruso sobre Behbud Khan Javanshir; utilizado únicamente para datos sobre la persona. Indica que nació el 12 [24] de julio de 1878 y falleció el 18 de julio de 1921, y resume su trayectoria como ministro del Interior y viceministro de Comercio e Industria de la República Democrática de Azerbaiyán, además de ser miembro de su parlamento. No menciona su religión."
  fr: "Article de Wikipédia en russe sur Behbud Khan Javanshir; utilisé uniquement à des fins d’information sur l’entité. Il indique ses dates de naissance et de décès: 12 [24] juillet 1878 – 18 juillet 1921. Il résume sa carrière en tant que ministre de l’Intérieur et vice-ministre du Commerce et de l’Industrie de la République démocratique d’Azerbaïdjan, ainsi que son mandat de député. Il ne mentionne pas sa religion."
  ur: "بہبود خان جوانشیر پر روسی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی تاریخیں 12 [24] جولائی 1878 - 18 جولائی 1921 دی گئی ہیں اور آذربائیجان ڈیموکریٹک ریپبلک کے وزیر داخلہ اور نائب وزیر تجارت و صنعت اور اس کی پارلیمنٹ کے رکن کے طور پر ان کے کیریئر کا خلاصہ پیش کیا گیا ہے۔ اس کے مذہب کے بارے میں کوئی بیان نہیں ہے۔"
