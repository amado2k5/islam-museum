summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن روث بفاو؛ تُستخدم لوقائع الكيان فقط. تروي مولدها في لايبزيغ سنة 1929 في أسرة لوثرية، ومعموديتها البروتستانتية سنة 1951 واعتناقها الكاثوليكية الرومانية سنة 1953، وانضمامها إلى جمعية بنات قلب مريم سنة 1957، ووصولها إلى كراتشي سنة 1960 وتأسيسها مركز ماري أدلايد للجذام وبناءها برنامج باكستان لمكافحة الجذام، ووفاتها في كراتشي في 10 أغسطس 2017 وجنازتها الرسمية."
  en: "English Wikipedia article on Ruth Pfau; used for entity facts only. It recounts her birth at Leipzig in 1929 to Lutheran parents, her Protestant baptism in 1951 and conversion to Roman Catholicism in 1953, her joining the Society of the Daughters of the Heart of Mary in 1957, her arrival in Karachi in 1960, the founding of the Marie Adelaide Leprosy Centre and her building of Pakistan's leprosy-control programme, and her death at Karachi on 10 August 2017 and state funeral."
  es: "Artículo de la Wikipedia en inglés sobre Ruth Pfau; utilizado únicamente para datos biográficos. Relata su nacimiento en Leipzig en 1929, de padres luteranos, su bautismo protestante en 1951 y su conversión al catolicismo romano en 1953, su ingreso en la Sociedad de las Hijas del Corazón de María en 1957, su llegada a Karachi en 1960, la fundación del Centro de Lepra Marie Adelaide y la creación del programa de control de la lepra de Pakistán, y su fallecimiento en Karachi el 10 de agosto de 2017, seguido de un funeral de Estado."
  fr: "Article de Wikipédia en anglais sur Ruth Pfau; utilisé uniquement à des fins documentaires. Il relate sa naissance à Leipzig en 1929 de parents luthériens, son baptême protestant en 1951 et sa conversion au catholicisme romain en 1953, son entrée dans la Société des Filles du Cœur de Marie en 1957, son arrivée à Karachi en 1960, la fondation du Centre Marie Adélaïde pour la lèpre et la mise en place du programme de lutte contre la lèpre au Pakistan, ainsi que son décès à Karachi le 10 août 2017 et ses funérailles nationales."
  ur: "روتھ فاؤ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں لیپزگ میں 1929 میں لوتھرن کے والدین کے ہاں اس کی پیدائش، 1951 میں اس کا پروٹسٹنٹ بپتسمہ اور 1953 میں رومن کیتھولک مذہب میں تبدیلی، 1957 میں اس کی سوسائٹی آف دی ڈوٹرز آف دی ہارٹ آف میری میں شمولیت، 1960 میں کراچی میں اس کی آمد، اس کی ایڈیلا سینٹر آف ماری پاکستان کی بنیاد اور ایڈیلا سنٹر کی بانی کا ذکر ہے۔ جذام پر قابو پانے کا پروگرام، اور 10 اگست 2017 کو کراچی میں اس کی موت اور سرکاری تدفین۔"
  tr: "Ruth Bfau hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılmıştır. 1929'da Leipzig'de Lutheran bir ailede doğduğunu, 1951'de Protestan vaftizini, 1953'te Roma Katolikliğine geçişini, 1957'de Meryem Kızları Derneği'ne katılışını, 1960'ta Karaçi'ye gelişini, Mary Adelaide Cüzzam Merkezi'ni kurmasını, Pakistan Cüzzam Kontrol Programı'nı kurmasını, 10 Ağustos 2017'de Karaçi'de vefatını ve resmi cenazesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ruth Bfau; digunakan hanya untuk fakta entitas. Ia menceritakan kelahirannya di Leipzig pada tahun 1929 dalam keluarga Lutheran, baptisan Protestan pada tahun 1951, konversinya ke Katolik Roma pada tahun 1953, bergabung dengan Daughters of Mary Society pada tahun 1957, kedatangannya di Karachi pada tahun 1960, mendirikan Mary Adelaide Leprosy Centre, pendirian Program Pengendalian Kusta Pakistan, kematiannya di Karachi pada 10 Agustus 2017, dan pemakaman resminya."
