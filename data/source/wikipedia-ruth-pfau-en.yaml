summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن روث بفاو؛ تُستخدم لوقائع الكيان فقط. تروي مولدها في لايبزيغ سنة 1929 في أسرة لوثرية، ومعموديتها البروتستانتية سنة 1951 واعتناقها الكاثوليكية الرومانية سنة 1953، وانضمامها إلى جمعية بنات قلب مريم سنة 1957، ووصولها إلى كراتشي سنة 1960 وتأسيسها مركز ماري أدلايد للجذام وبناءها برنامج باكستان لمكافحة الجذام، ووفاتها في كراتشي في 10 أغسطس 2017 وجنازتها الرسمية."
  en: "English Wikipedia article on Ruth Pfau; used for entity facts only. It recounts her birth at Leipzig in 1929 to Lutheran parents, her Protestant baptism in 1951 and conversion to Roman Catholicism in 1953, her joining the Society of the Daughters of the Heart of Mary in 1957, her arrival in Karachi in 1960, the founding of the Marie Adelaide Leprosy Centre and her building of Pakistan's leprosy-control programme, and her death at Karachi on 10 August 2017 and state funeral."
