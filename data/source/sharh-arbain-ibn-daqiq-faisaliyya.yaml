summary:
  ar: "طبعة أخرى من «شرح الأربعين النووية» لابن دقيق العيد، صادرة عن الفيصلية بمكة المكرمة، ويرجع إليها هذا السجل بأرقام صفحات المسح."
  en: "A second printing of Ibn Daqiq al-Id's commentary on al-Nawawi's Forty Hadith, issued by al-Faisaliyya in Mecca; this record cites its scan pages."
  es: "Una segunda edición del comentario de Ibn Daqiq al-Id sobre los Cuarenta Hadices de al-Nawawi, publicada por al-Faisaliyya en La Meca; este registro cita sus páginas escaneadas."
  fr: "Une deuxième impression du commentaire d'Ibn Daqiq al-Id sur les Quarante Hadiths d'al-Nawawi, publiée par al-Faisaliyya à La Mecque; cette notice cite ses pages numérisées."
  ur: "ابن دقیق العد کی تفسیر النووی کی چالیس حدیثوں کی دوسری طباعت، جو مکہ میں الفیصلیہ کی طرف سے جاری کی گئی ہے۔ یہ ریکارڈ اس کے اسکین صفحات کا حوالہ دیتا ہے۔"
  tr: "İbn Daqiq al-''Eid'in 'Şerh al-Erba'in el-Nevaviyye' adlı başka bir baskısı, Mekke'de El-Feysaliye tarafından yayımlanmış ve bu kayıtta anket sayfa numaralarıyla anılmıştır."
