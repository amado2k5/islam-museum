summary:
  ar: "مقالة ويكيبيديا الأردية عن ببرك كارمل؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تذكر مولده في 6 يناير 1929 في كماري ووفاته في موسكو «في 1 أو 3 ديسمبر 1996»، ويعطي صندوق معلوماتها الدين «الإسلام» عموما، بينما تصنّفه فئاتها في «الأفغان الملحدين»."
  en: "Urdu Wikipedia article on Babrak Karmal; a short article used for entity facts only. It gives his birth on 6 January 1929 at Kamari and his death at Moscow as '1 or 3 December 1996'; its infobox gives his religion as Islam generically, while its categories file him under 'Afghan atheists' — a filing that contradicts the infobox and is not an attestation."
  es: "Artículo de Wikipedia en urdu sobre Babrak Karmal; un artículo breve que se utiliza únicamente para datos sobre la persona. Indica que nació el 6 de enero de 1929 en Kamari y que falleció en Moscú el 1 o el 3 de diciembre de 1996. Su ficha informativa indica que profesaba el islam de forma genérica, mientras que sus categorías lo clasifican como «ateo afgano», una clasificación que contradice la ficha informativa y no constituye una certificación."
  fr: "L'article Wikipédia en ourdou sur Babrak Karmal est un court article fournissant uniquement des informations factuelles. Il indique sa naissance le 6 janvier 1929 à Kamari et son décès à Moscou entre le 1er et le 3 décembre 1996. Son infobox mentionne l'islam comme religion, tandis que ses catégories le classent parmi les « athées afghans », une classification qui contredit l'infobox et ne constitue pas une attestation."
  ur: "ببرک کارمل پر اردو ویکیپیڈیا مضمون؛ ایک مختصر مضمون جو صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ یہ 6 جنوری 1929 کو کاماری میں ان کی پیدائش اور ماسکو میں '1 یا 3 دسمبر 1996' کے طور پر انتقال کرتا ہے۔ اس کا انفو باکس عام طور پر اس کے مذہب کو اسلام کے طور پر دیتا ہے، جبکہ اس کے زمرے اسے 'افغان ملحد' کے تحت فائل کرتے ہیں - ایک فائلنگ جو انفو باکس سے متصادم ہے اور اس کی تصدیق نہیں ہے۔"
