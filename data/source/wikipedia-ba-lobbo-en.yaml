summary:
  ar: "مقالة ويكيبيديا الإنجليزية القصيرة عن با لبو، ابن أخي شيخو أحمدو مؤسس إمبراطورية ماسينا والقائد العسكري البارز فيها؛ تروي أنه رُشح لخلافة عمه سنة 1845 فاختير ابن المؤسس أحمدو سيكو، ورُشح ثانية سنة 1853 فدعم ابن أخيه أحمدو أحمدو، ثم قاد بقايا قوات ماسينا بعد سقوط حمد الله سنة 1862 وطرد عمر تال منها سنة 1864 قبل أن يقمع ابن أخيه تيدياني تال مقاومته. لا تذكر المقالة تاريخ ولادة ولا وفاة له."
  en: "Short English Wikipedia article on Ba Lobbo, nephew of Seku Amadu, founder of the Massina Empire, and its able general; it recounts that he was considered as successor in 1845 but passed over for the founder's son Amadu Seku, was considered again in 1853 but backed Amadu Seku's son Amadu Amadu, and after the fall of Hamdullahi in 1862 led the remaining Massina forces, driving Umar Tall from Hamdullahi in 1864 before Umar's nephew Tidiani Tall suppressed his resistance. The article gives no birth or death date for him."
  es: "Breve artículo en inglés de Wikipedia sobre Ba Lobbo, sobrino de Seku Amadu, fundador del Imperio Massina, y su hábil general. Relata que fue considerado como sucesor en 1845, pero fue descartado en favor del hijo del fundador, Amadu Seku. Volvió a ser considerado en 1853, pero apoyó al hijo de Amadu Seku, Amadu Amadu. Tras la caída de Hamdullahi en 1862, lideró las fuerzas restantes de Massina, expulsando a Umar Tall de Hamdullahi en 1864 antes de que el sobrino de Umar, Tidiani Tall, sofocara su resistencia. El artículo no proporciona su fecha de nacimiento ni de fallecimiento."
  fr: "Court article de Wikipédia en anglais sur Ba Lobbo, neveu de Seku Amadu, fondateur de l'empire Massina, et son général de renom. Il relate qu'en 1845, il fut pressenti comme successeur, mais que le fils du fondateur, Amadu Seku, lui fut préféré. En 1853, il soutint à nouveau Amadu Amadu, lui aussi pressenti comme successeur. Après la chute d'Hamdullahi en 1862, il prit la tête des forces Massina restantes et chassa Umar Tall d'Hamdullahi en 1864, avant que le neveu de ce dernier, Tidiani Tall, ne réprime sa résistance. L'article ne mentionne ni sa date de naissance ni sa date de décès."
  ur: "میسینا سلطنت کے بانی، سیکو اماڈو کے بھتیجے، با لوبو اور اس کے قابل جنرل پر مختصر انگریزی ویکیپیڈیا مضمون؛ اس میں بتایا گیا ہے کہ اسے 1845 میں جانشین سمجھا جاتا تھا لیکن اسے بانی کے بیٹے امادو سیکو کے لیے منتقل کیا گیا، 1853 میں دوبارہ سمجھا گیا لیکن امادو سیکو کے بیٹے امادو امادو کی حمایت کی، اور 1862 میں حمد اللہی کے زوال کے بعد باقی ماندہ میسینا افواج کی قیادت کرتے ہوئے، عمر ٹل کو 1853 میں حمد اللہ سے پہلے 1853 میں چلا گیا۔ اس کی مزاحمت کو دبایا۔ مضمون میں اس کی پیدائش یا موت کی کوئی تاریخ نہیں بتائی گئی ہے۔"
  tr: "Masina İmparatorluğu'nun kurucusu ve orada önde gelen bir askeri komutan olan Şeyh Ahmadu'nun yeğeni Ba Lapbo hakkında kısa İngilizce Wikipedia makalesi; 1845'te amcasının yerine aday gösterildiği, kurucunun oğlu Ahmadu Seko'yu seçtiği ve 1853'te yeğeni Ahmadu Ahmadu'yu desteklediği anlatılır. 1862'de Hamdallah'ın düşüşünden sonra Masina'nın kalan kuvvetlerine liderlik etti ve 1864'te Omar Tayl'ı sürgün etti, ancak yeğeni Tidiani Tal direnişini bastırdı. Makalede doğum veya ölüm tarihlerinden bahsedilmemektedir."
  id: "Artikel singkat Wikipedia bahasa Inggris tentang Ba Lapbo, keponakan Sheikh Ahmadu, pendiri Kekaisaran Masina dan komandan militer terkemuka di sana; diceritakan bahwa ia dinominasikan untuk menggantikan pamannya pada tahun 1845, memilih putra pendiri Ahmadu Seko, dan kembali dinominasikan pada tahun 1853, mendukung keponakannya Ahmadu Ahmadu. Ia kemudian memimpin sisa pasukan Masina setelah jatuhnya Hamdallah pada tahun 1862 dan mengusir Omar Tayl pada tahun 1864 sebelum keponakannya Tidiani Tal menekan perlawanannya. Artikel tersebut tidak menyebutkan tanggal lahir atau kematiannya."
