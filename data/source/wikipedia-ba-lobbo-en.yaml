summary:
  ar: "مقالة ويكيبيديا الإنجليزية القصيرة عن با لبو، ابن أخي شيخو أحمدو مؤسس إمبراطورية ماسينا والقائد العسكري البارز فيها؛ تروي أنه رُشح لخلافة عمه سنة 1845 فاختير ابن المؤسس أحمدو سيكو، ورُشح ثانية سنة 1853 فدعم ابن أخيه أحمدو أحمدو، ثم قاد بقايا قوات ماسينا بعد سقوط حمد الله سنة 1862 وطرد عمر تال منها سنة 1864 قبل أن يقمع ابن أخيه تيدياني تال مقاومته. لا تذكر المقالة تاريخ ولادة ولا وفاة له."
  en: "Short English Wikipedia article on Ba Lobbo, nephew of Seku Amadu, founder of the Massina Empire, and its able general; it recounts that he was considered as successor in 1845 but passed over for the founder's son Amadu Seku, was considered again in 1853 but backed Amadu Seku's son Amadu Amadu, and after the fall of Hamdullahi in 1862 led the remaining Massina forces, driving Umar Tall from Hamdullahi in 1864 before Umar's nephew Tidiani Tall suppressed his resistance. The article gives no birth or death date for him."
