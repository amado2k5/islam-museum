summary:
  ar: "مقالة ويكيبيديا الألمانية عن ساموري توري؛ تُستخدم لوقائع الكيان فقط. تنسب قيام إمبراطوريته إلى إيديولوجية الإسلام دون أن تسمي له مذهبا، وتسرد حروبه مع فرنسا وأسره وموته."
  en: "German Wikipedia article on Samori Ture; used for entity facts only. It attributes the founding of his empire to the ideology of Islam without naming any school for him, and narrates his wars with France, capture and death."
  es: "Artículo de la Wikipedia en alemán sobre Samori Ture; se utiliza únicamente para obtener información sobre la persona. Atribuye la fundación de su imperio a la ideología del Islam sin mencionar ninguna escuela, y narra sus guerras con Francia, su captura y su muerte."
  fr: "Article de Wikipédia en allemand sur Samori Ture; utilisé uniquement pour des informations factuelles. Il attribue la fondation de son empire à l’idéologie islamique sans nommer d’école, et relate ses guerres contre la France, sa capture et sa mort."
  ur: "ساموری ٹور پر جرمن ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی سلطنت کی بنیاد کو اسلام کے نظریہ سے منسوب کرتا ہے اور اس کے لیے کسی مکتب کا نام لیے بغیر، اور فرانس کے ساتھ اس کی جنگوں، گرفتاری اور موت کو بیان کرتا ہے۔"
  tr: "Samori Tori hakkında Almanca Wikipedia makalesi; sadece varlığın gerçekleri için kullanılmıştır. İmparatorluğunun kurulmasını İslam ideolojisine bağlar, ona bir tarikat adı vermeden ve Fransa ile savaşlarını, esaretini ve ölümünü anlatır."
  id: "Artikel Wikipedia Jerman tentang Samori Tori; digunakan hanya untuk fakta entitas. Artikel ini mengaitkan pendirian kerajaannya dengan ideologi Islam tanpa menyebutnya sebagai sekte, dan menceritakan perangnya dengan Prancis, penawanannya, dan kematiannya."
