reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 24 October 2026. It records his birth c. 1830, his Dyula trading background, the conquest from 1860 with the help of Muslim Kaba teachers, the founding of the Wassoulou Empire (1864 by its dating), the French wars and the treaties of 1886, 1889 and 1891, the eastward shift from 1892, his capture in 1898 and death in Gabon. For the faith question it states that Islam supplied the empire's ideology and legitimacy; it names no madhhab for Samori himself — one of the silences the record's faith note relies on."
