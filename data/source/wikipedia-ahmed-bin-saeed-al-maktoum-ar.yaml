summary:
  ar: "مقالة ويكيبيديا العربية عن الشيخ أحمد بن سعيد آل مكتوم؛ تذكر في متنها مولده في 1 ديسمبر 1957 (بينما تجعله تصنيفاتها من مواليد 1958)، وكونه الابن الأصغر لسعيد بن مكتوم آل مكتوم والأخ غير الشقيق لراشد بن سعيد، ورئاسته هيئة دبي للطيران المدني ومجموعة الإمارات، وزواجه من المصرية نيفين الجمل سنة 2007 ثم من منى بنت عبيد بن ثاني سنة 2008."
  en: "Arabic Wikipedia article on Ahmed bin Saeed Al Maktoum; its text gives his birth on 1 December 1957 (while its categories file him under 1958 births), his being the youngest son of Saeed bin Maktoum Al Maktoum and half-brother of Rashid bin Saeed, his presidency of Dubai's Civil Aviation Authority and chairmanship of the Emirates Group, and his marriages to Nivin El-Gamal in 2007 and to Mona bint Obaid bin Thani in 2008."
