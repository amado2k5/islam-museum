summary:
  ar: "مقالة ويكيبيديا العربية عن الشيخ أحمد بن سعيد آل مكتوم؛ تذكر في متنها مولده في 1 ديسمبر 1957 ⁦(بينما تجعله تصنيفاتها من مواليد 1958)⁩، وكونه الابن الأصغر لسعيد بن مكتوم آل مكتوم والأخ غير الشقيق لراشد بن سعيد، ورئاسته هيئة دبي للطيران المدني ومجموعة الإمارات، وزواجه من المصرية نيفين الجمل سنة 2007 ثم من منى بنت عبيد بن ثاني سنة 2008."
  en: "Arabic Wikipedia article on Ahmed bin Saeed Al Maktoum; its text gives his birth on 1 December 1957 (while its categories file him under 1958 births), his being the youngest son of Saeed bin Maktoum Al Maktoum and half-brother of Rashid bin Saeed, his presidency of Dubai's Civil Aviation Authority and chairmanship of the Emirates Group, and his marriages to Nivin El-Gamal in 2007 and to Mona bint Obaid bin Thani in 2008."
  es: "Artículo en árabe de la Wikipedia sobre Ahmed bin Saeed Al Maktoum; su texto indica que nació el 1 de diciembre de 1957 (aunque sus categorías lo clasifican entre los nacimientos de 1958), que era el hijo menor de Saeed bin Maktoum Al Maktoum y hermanastro de Rashid bin Saeed, su presidencia de la Autoridad de Aviación Civil de Dubái y la presidencia del Grupo Emirates, y sus matrimonios con Nivin El-Gamal en 2007 y con Mona bint Obaid bin Thani en 2008."
  fr: "L'article de Wikipédia en arabe sur Ahmed bin Saeed Al Maktoum indique sa naissance le 1er décembre 1957 (alors que ses catégories le classent parmi les naissances de 1958), qu'il est le plus jeune fils de Saeed bin Maktoum Al Maktoum et le demi-frère de Rashid bin Saeed, sa présidence de l'Autorité de l'aviation civile de Dubaï et la présidence du groupe Emirates, ainsi que ses mariages avec Nivin El-Gamal en 2007 et avec Mona bint Obaid bin Thani en 2008."
  ur: "احمد بن سعید المکتوم پر عربی ویکیپیڈیا مضمون؛ اس کا متن ان کی پیدائش 1 دسمبر 1957 کو دیتا ہے ⁦(جبکہ اس کے زمرے اسے 1958 کی پیدائش کے تحت درج کرتے ہیں)⁩، وہ سعید بن مکتوم المکتوم کے سب سے چھوٹے بیٹے اور راشد بن سعید کے سوتیلے بھائی، دبئی کی سول ایوی ایشن اتھارٹی کی صدارت اور ایمریٹس گروپ کی چیئرمین شپ اور ایلوین 07 میں ان کی شادی، مونا بنت عبید بن تھانی 2008 میں۔"
  tr: "Şeyh Ahmed bin Saeed Al Maktoum hakkında Arapça Wikipedia makalesi, onun 1 Aralık 1957'de doğduğunu belirtir (sınıflandırmaları ise onu 1958 doğumlu olarak gösterir), Saeed bin Maktoum Al Maktoum'un en küçük oğlu ve Rashid bin Saeed'in üvey kardeşi olarak. Dubai Sivil Havacılık Otoritesi ve Emirates Grubu'nun başkanlığını yaptı, 2007'de Mısırlı Nevin El-Gamal ile, 2008'de ise Mona bint Obaid bin Thani ile evlendi."
  id: "Artikel Wikipedia berbahasa Arab tentang Sheikh Ahmed bin Saeed Al Maktoum menyebutkan kelahirannya pada 1 Desember 1957 (sementara klasifikasinya menempatkannya lahir pada tahun 1958), sebagai putra bungsu Saeed bin Maktoum Al Maktoum dan saudara tiri Rashid bin Saeed. Ia pernah memimpin Otoritas Penerbangan Sipil Dubai dan Emirates Group, serta menikah dengan Nevin El-Gamal dari Mesir pada tahun 2007 dan kemudian Mona bint Obaid bin Thani pada tahun 2008."
