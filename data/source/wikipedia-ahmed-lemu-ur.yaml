summary:
  ar: "مقالة ويكيبيديا الأردية عن شیخ احمد لیمو؛ موجز يستند إلى المقالة الإنجليزية ومراجعها النيجيرية. يثبت أنه عالم إسلامي نيجيري وقانوني خدم أولَ كبيرٍ لقضاة محكمة الاستئناف الشرعية بولاية نيجر، وأنه أسس مع زوجته عائشة صندوق التعليم الإسلامي، ويجعل ميلاده في 21 نوفمبر 1929."
  en: "Urdu Wikipedia article on Sheikh Ahmed Lemu; a short article drawing on the English article and its Nigerian references. It gives him as a Nigerian Islamic scholar and jurist who served as the first chief justice of Niger State, a co-founder with his wife Aisha of the Islamic Educational Trust, and gives his birth as 21 November 1929."
  es: "Artículo de Wikipedia en urdu sobre el jeque Ahmed Lemu; un breve artículo que se basa en el artículo en inglés y sus referencias nigerianas. Lo describe como un erudito y jurista islámico nigeriano que fue el primer presidente del Tribunal Supremo del estado de Níger, cofundador, junto con su esposa Aisha, del Islamic Educational Trust, y menciona que nació el 21 de noviembre de 1929."
  fr: "Article de Wikipédia en ourdou sur Cheikh Ahmed Lemu; un court article s’appuyant sur l’article anglais et ses références nigérianes. Il le présente comme un érudit et juriste islamique nigérian qui fut le premier juge en chef de l’État du Niger, cofondateur avec son épouse Aisha de l’Islamic Educational Trust, et indique sa date de naissance: le 21 novembre 1929."
  ur: "شیخ احمد لیمو پر اردو ویکیپیڈیا مضمون؛ انگریزی مضمون اور اس کے نائیجیرین حوالہ جات پر ایک مختصر مضمون۔ یہ انہیں نائجیریا کے اسلامی اسکالر اور فقیہ کے طور پر دیتا ہے جس نے نائجر اسٹیٹ کے پہلے چیف جسٹس کے طور پر خدمات انجام دیں، اسلامی تعلیمی ٹرسٹ کی اپنی اہلیہ عائشہ کے ساتھ شریک بانی، اور 21 نومبر 1929 کو ان کی پیدائش ہوئی۔"
  tr: "Şeyh Ahmed Limu hakkında Urduca Wikipedia makalesi; İngilizce makale ve Nijerya referanslarına dayanan bir özet. Nijer Eyaleti'ndeki Şeriat Temyiz Mahkemesi'nin ilk kıdemli yargıcı olarak görev yapmış ve eşi Aişa ile birlikte İslami Eğitim Fonu'nu kurmuş bir Nijeryalı İslam alimi ve hukukçu olduğunu kanıtlamaktadır; doğum tarihini 21 Kasım 1929'da belirlemiştir."
  id: "Artikel Wikipedia Urdu tentang Sheikh Ahmed Limu; ringkasan berdasarkan artikel bahasa Inggris dan referensi Nigerianya. Ia terbukti sebagai ulama dan ahli hukum Islam Nigeria yang menjabat sebagai hakim senior pertama di Pengadilan Banding Syariah di Negara Bagian Niger, dan mendirikan Dana Pendidikan Islam bersama istrinya Aisha, dengan tanggal 21 November 1929."
