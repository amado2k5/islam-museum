reliability_note: "A Pakistani news site's report, read in full on 5 November 2026. It quotes his statement on Samaa Digital's Makalma with Khalilur Rehman Qamar ('Take a sample of 100 women, 95 out of them will be ignorant not knowing anything. This is reality'), records that an audience member named Azba asked him to apologise to all women of Pakistan, that he cited a hadith, called her ignorant and declined to apologise, and that Khalilur Rehman Qamar then addressed her aggressively. It also sets the claim against the Economic Survey's figures (female illiteracy 48.1%, male 26.6%). The episode is recorded in his prose as an attributed controversy, not in the museum's voice."
