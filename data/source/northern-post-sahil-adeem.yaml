summary:
  ar: "تقرير ذا نورذرن بوست ⁦(2 يوليو 2024)⁩ عن الجدل الذي أثاره تصريح ساحل عديم في برنامج سماء «مكالمة» بأن 95 من كل 100 امرأة جاهلات، ومواجهته مع إحدى الحاضرات التي طالبته بالاعتذار."
  en: "A Northern Post report (2 July 2024) on the debate sparked by Sahil Adeem's statement on Samaa's 'Makalma' show that 95 out of 100 women are ignorant, and his confrontation with an audience member who demanded an apology."
  es: "Un reportaje del Northern Post (2 de julio de 2024) sobre el debate suscitado por la declaración de Sahil Adeem en el programa 'Makalma' de Samaa muestra que 95 de cada 100 mujeres son ignorantes, y su confrontación con un miembro del público que exigió una disculpa."
  fr: "Un article du Northern Post (2 juillet 2024) sur le débat suscité par la déclaration de Sahil Adeem dans l'émission « Makalma » de Samaa selon laquelle 95 femmes sur 100 sont ignorantes, et sa confrontation avec un membre du public qui exigeait des excuses."
  ur: "سماء کے 'مکلمہ' پر ساحل عدیم کے بیان سے شروع ہونے والی بحث پر ناردرن پوسٹ کی ایک رپورٹ ⁦(2 جولائی 2024)⁩ ظاہر کرتی ہے کہ 100 میں سے 95 خواتین لاعلم ہیں، اور اس کا سامعین کے ایک ممبر سے تصادم ہوا جس نے معافی کا مطالبہ کیا۔"
  tr: "The Northern Post'un (2 Temmuz 2024) raporu, Sahel Idim'in Samaa programı 'Kalama'da her 100 kadından 95'inin cahil olduğunu belirten açıklaması ve bir katılımcının özür talep ettiği için yaşadığı tartışmayı ele aldı."
  id: "Laporan Northern Post (2 Juli 2024) tentang kontroversi yang dipicu oleh pernyataan Sahel Idom di program Samaa 'Kalama' bahwa 95 dari setiap 100 perempuan tidak tahu, serta konfrontasinya dengan satu peserta yang menuntut permintaan maafnya."
