summary:
  ar: "مقالة ويكيبيديا التركية عن الشاعر أحمد باشا (1426–1497)، ابن قاضي عسكر مراد الثاني وليّ الدين بن إلياس؛ تعرض خلاف التذكرات حول مسقط رأسه ⁦(برسا عند لطيفي وعالي، وأدرنة عند سهي وبليغ ورواية ابن عمه ناظر جلبي)⁩، وتنقل تقدير فؤاد كوبرولو لمولده حول 830هـ/1426، وتجعل وفاته في برسا سنة 1496 في متنها و1497 في عنوانها."
  en: "Turkish Wikipedia article on the poet Ahmed Pasha (1426–1497), son of Murad II's kazasker Veliyüddin bin İlyas; it sets out the tezkire disagreement over his birthplace (Bursa in Latifi and Âlî, Edirne in Sehi, Beliğ and the report of his cousin Nazır Çelebi), quotes Fuad Köprülü's reasoning that he was born around 830/1426, and gives his death at Bursa as 1496 in its text but 1497 in its heading."
  es: "Artículo de la Wikipedia en turco sobre el poeta Ahmed Pasha (1426-1497), hijo del kazasker de Murad II, Veliyüddin bin İlyas; expone la controversia sobre su lugar de nacimiento (Bursa en Latifi y Âlî, Edirne en Sehi, Beliğ y el informe de su primo Nazır Çelebi), cita el razonamiento de Fuad Köprülü de que nació alrededor de 830/1426, y da su muerte en Bursa en 1496 en su texto, pero en su encabezado en 1497."
  fr: "L'article de Wikipédia turc sur le poète Ahmed Pacha (1426-1497), fils du kazasker de Murad II, Veliyüddin bin İlyas, expose la divergence d'opinions sur son lieu de naissance (Bursa selon Latifi et Âlî, Edirne selon Sehi, Beliğ et le récit de son cousin Nazır Çelebi), cite le raisonnement de Fuad Köprülü selon lequel il serait né vers 830/1426, et indique sa mort à Bursa en 1496 dans son texte mais en 1497 dans son titre."
  ur: "شاعر احمد پاشا (1426–1497) پر ترک ویکیپیڈیا کا مضمون، مراد II کے قازق ولی الدین بن الیاس کے بیٹے؛ اس میں ان کی جائے پیدائش ⁦(لطیفی میں برسا اور ایلی، سیہی میں ایڈیرنے، بیلیگ اور اس کے کزن نذیر چیلیبی کی رپورٹ)⁩ کے بارے میں تزکیر کے اختلاف کو بیان کیا گیا ہے، فواد کوپرلو کے استدلال کا حوالہ دیا گیا ہے کہ وہ 830/1426 کے آس پاس پیدا ہوا تھا، اور اس کا متن اس کی موت 1964 میں 1964 میں برسا کے عنوان سے بیان کرتا ہے۔"
