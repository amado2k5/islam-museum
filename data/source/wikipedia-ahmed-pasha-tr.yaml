  ar: "مقالة ويكيبيديا التركية عن الشاعر أحمد باشا (1426–1497)، ابن قاضي عسكر مراد الثاني وليّ الدين بن إلياس؛ تعرض خلاف التذكرات حول مسقط رأسه (برسا عند لطيفي وعالي، وأدرنة عند سهي وبليغ ورواية ابن عمه ناظر جلبي)، وتنقل تقدير فؤاد كوبرولو لمولده حول 830هـ/1426، وتجعل وفاته في برسا سنة 1496 في متنها و1497 في عنوانها."
  en: "Turkish Wikipedia article on the poet Ahmed Pasha (1426–1497), son of Murad II's kazasker Veliyüddin bin İlyas; it sets out the tezkire disagreement over his birthplace (Bursa in Latifi and Âlî, Edirne in Sehi, Beliğ and the report of his cousin Nazır Çelebi), quotes Fuad Köprülü's reasoning that he was born around 830/1426, and gives his death at Bursa as 1496 in its text but 1497 in its heading."
