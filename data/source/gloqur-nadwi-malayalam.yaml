summary:
  ar: "مقالة ضيف لسهير توتوبوراث من جامعة نجم الدين أربكان في قونية، 3 مايو 2024، عن «ترجمة القرآن المقدس» بالمليالمية لبهاء الدين محمد الندوي ، 2015،، وتاريخ ترجمات القرآن في كيرالا."
  en: "A guest post by Suhair Thottupurath of Necmettin Erbakan University, Konya, 3 May 2024, on Bahauddeen Muhammed Nadwi's Malayalam Vishudda Qur'an Vivarthanam (2015) and the history of Qur'an translation in Kerala."
  ur: "قونیہ کی نجم الدین اربکان یونیورسٹی کے سہیر توتوپوراتھ کی مہمان تحریر، 3 مئی 2024، بہاء الدین محمد ندوی کے ملیالم «وشُدّھ قرآن ووَرتنم» ، 2015، اور کیرالا میں تراجمِ قرآن کی تاریخ پر۔"
  es: "Una publicación invitada de Suhair Thottupurath de la Universidad Necmettin Erbakan, Konya, 3 de mayo de 2024, sobre el malayalam Vishudda Qur'an Vivarthanam (2015) de Bahauddeen Muhammed Nadwi y la historia de la traducción del Corán en Kerala."
  fr: "Un article invité de Suhair Thottupurath de l'Université Necmettin Erbakan, Konya, le 3 mai 2024, sur le Malayalam Vishudda Qur'an Vivarthanam de Bahauddeen Muhammed Nadwi (2015) et l'histoire de la traduction du Coran au Kerala."
  tr: "Konya'daki Necmettin Erbakan Üniversitesi'nden Suhair Tutuburath tarafından 3 Mayıs 2024 tarihli konuk makale, Bahauddin Muhammad Al-Nadwi tarafından Malayalam dilinde \"Kutsal Kuran'ın Çevirisi\" ve Kerala'daki Kur'an çevirilerinin tarihi üzerine."
  id: "Artikel tamu oleh Suhair Tutuburath dari Universitas Necmettin Erbakan di Konya, 3 Mei 2024, tentang \"Terjemahan Al-Qur'an\" dalam bahasa Malayalam oleh Bahauddin Muhammad Al-Nadwi, 2015, dan sejarah terjemahan Al-Qur'an di Kerala."
