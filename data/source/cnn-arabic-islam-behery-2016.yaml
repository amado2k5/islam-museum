summary:
  ar: "حوار إسلام بحيري مع سي إن إن بالعربية بعد العفو الرئاسي عنه في نوفمبر 2016؛ يعرّف نفسه بأنه «باحث إسلامي» ويرى العفو اعتذاراً عن حكم وصفه بالظالم."
  en: "Islam Behery's interview with CNN Arabic after the November 2016 presidential pardon; he describes himself as an 'Islamic researcher' and calls the pardon an apology for a sentence he deemed unjust."
  es: "Entrevista de Islam Behery con CNN Arabic tras el indulto presidencial de noviembre de 2016; se describe a sí mismo como un \"investigador islámico\" y califica el indulto como una disculpa por una sentencia que consideraba injusta."
  fr: "Dans une interview accordée à CNN Arabic après la grâce présidentielle de novembre 2016, Islam Behery se décrit comme un « chercheur islamique » et qualifie cette grâce d'excuses pour une peine qu'il jugeait injuste."
  ur: "نومبر 2016 کی صدارتی معافی کے بعد اسلام بیہری کا CNN عربی کے ساتھ انٹرویو؛ وہ خود کو ایک 'اسلامی محقق' کے طور پر بیان کرتا ہے اور معافی کو اس سزا کے لیے معافی مانگتا ہے جسے وہ ناانصافی سمجھتا ہے۔"
  tr: "Islam Behairy'nin Kasım 2016'daki cumhurbaşkanlığı affından sonra CNN Arabic ile yaptığı röportaj; kendisini 'İslami araştırmacı' olarak tanımlıyor ve affı, adaletsiz olarak nitelendirdiği bir karar için bir özür olarak görüyor."
  id: "Wawancara Islam Behairy dengan CNN Arabic setelah pengampunan presidennya pada November 2016; ia menggambarkan dirinya sebagai 'peneliti Islam' dan melihat pengampunan itu sebagai permintaan maaf atas putusan yang ia sebut tidak adil."
