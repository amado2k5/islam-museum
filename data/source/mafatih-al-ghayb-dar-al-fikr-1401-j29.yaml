  en: "Tafsir al-Fakhr al-Razi, known as al-Tafsir al-Kabir and Mafatih al-Ghayb — part 29 (Dar al-Fikr, Beirut, 1st ed., 1981)"
  ur: "تفسیر الفخر الرازی المعروف بالتفسیر الکبیر و مفاتیح الغیب — جزء انتیسواں (دار الفکر، بیروت، پہلا ایڈیشن، 1981ء)"
summary:
  ar: "الجزء التاسع والعشرون من طبعة دار الفكر ببيروت (الطبعة الأولى 1401هـ/1981م) لتفسير الرازي، وعلى غلافها اسم المؤلف «محمد الرازي فخر الدين ابن العلامة ضياء الدين عمر المشتهر بخطيب الري» وتاريخا 544–604هـ، وأن الطبعة تمتاز بفهرس لآيات الأحكام. ويضم تفسير سورة الواقعة وما حولها."
  en: "Part 29 of Dar al-Fikr's Beirut printing (1st ed. 1401 AH / 1981) of al-Razi's commentary; its cover names the author 'Muhammad al-Razi Fakhr al-Din, son of the learned Diya' al-Din Umar, known as the Preacher of Rayy', gives the dates 544–604 AH and says the printing has an index of the legal verses. It includes the commentary on Surat al-Waqi'a and the suras around it."
  ur: "دار الفکر بیروت (پہلا ایڈیشن 1401ھ / 1981ء) کی تفسیرِ رازی کی طباعت کا جزء انتیسواں؛ اس کے سرورق پر مصنف کا نام «محمد الرازی فخر الدین ابن العلامہ ضیاء الدین عمر المشتہر بخطیب الری»، تاریخیں 544–604ھ، اور یہ کہ اس طباعت میں آیاتِ احکام کا اشاریہ ہے۔ اس میں سورۂ واقعہ اور اس کے آس پاس کی سورتوں کی تفسیر ہے۔"
