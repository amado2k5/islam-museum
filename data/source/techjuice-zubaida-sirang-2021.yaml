summary:
  ar: "خبر موقع تك جوس ⁦(15 فبراير 2021)⁩ عن دخول كتاب زبيدة سيرانغ «Optics Made Easy» قائمة «أفضل كتب طب العيون على الإطلاق» لدى Book Authority، وهي أول باكستانية تحقق ذلك؛ يذكر أنها من يارخون بتشترال، وحاصلة على بكالوريوس الطب من جامعة الآغا خان، وخدمت في بلدتها أكثر من سنتين قبل تخصصها في جراحة العيون في أيرلندا."
  en: "TechJuice news report of 15 February 2021 on Zubaida Sirang's book Optics Made Easy entering Book Authority's 'Best Ophthalmology Books of All Time' list, the first Pakistani book to do so; it states she hails from Yarkhun, Chitral, took her MBBS at the Aga Khan University, served in her hometown for over two years, and was then specialising in surgical ophthalmology in Ireland."
  es: "Según un informe de TechJuice del 15 de febrero de 2021, el libro de Zubaida Sirang, Optics Made Easy, entró en la lista de \"Mejores libros de oftalmología de todos los tiempos\" de Book Authority, siendo el primer libro pakistaní en lograrlo. El informe indica que Sirang es originaria de Yarkhun, Chitral, estudió Medicina (MBBS) en la Universidad Aga Khan, trabajó en su ciudad natal durante más de dos años y luego se especializó en oftalmología quirúrgica en Irlanda."
  fr: "L'article de TechJuice du 15 février 2021 sur le livre de Zubaida Sirang, Optics Made Easy, qui entre dans la liste des « Meilleurs livres d'ophtalmologie de tous les temps » de Book Authority, est le premier livre pakistanais à y figurer; il indique qu'elle est originaire de Yarkhun, Chitral, qu'elle a obtenu son MBBS à l'Université Aga Khan, qu'elle a travaillé dans sa ville natale pendant plus de deux ans, puis qu'elle se spécialisait en ophtalmologie chirurgicale en Irlande."
title: "This Chitrali doctor just became the first Pakistani to be featured in 'Best Ophthalmology Books of All Time'"
