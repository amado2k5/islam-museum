summary:
  ar: "خبر موقع تك جوس (15 فبراير 2021) عن دخول كتاب زبيدة سيرانغ «Optics Made Easy» قائمة «أفضل كتب طب العيون على الإطلاق» لدى Book Authority، وهي أول باكستانية تحقق ذلك؛ يذكر أنها من يارخون بتشترال، وحاصلة على بكالوريوس الطب من جامعة الآغا خان، وخدمت في بلدتها أكثر من سنتين قبل تخصصها في جراحة العيون في أيرلندا."
  en: "TechJuice news report of 15 February 2021 on Zubaida Sirang's book Optics Made Easy entering Book Authority's 'Best Ophthalmology Books of All Time' list, the first Pakistani book to do so; it states she hails from Yarkhun, Chitral, took her MBBS at the Aga Khan University, served in her hometown for over two years, and was then specialising in surgical ophthalmology in Ireland."
title: "This Chitrali doctor just became the first Pakistani to be featured in 'Best Ophthalmology Books of All Time'"
