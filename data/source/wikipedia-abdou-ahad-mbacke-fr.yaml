  ar: "مقالة ويكيبيديا الفرنسية عن الشيخ عبد الأحد مباكي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته سنة 1914 في ديوربل لأحمدو بمبا وسخنة مرياما دياخاتي، وخلافته العامة للمريدية من 1968، وأعماله الكبرى في طوبى، ووفاته فيها في 19 يونيو 1989."
