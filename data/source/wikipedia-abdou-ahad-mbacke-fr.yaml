reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives him as born in 1914 at Diourbel, son of Cheikh Ahmadou Bamba, founder of Mouridism, and of Sokhna Mariama Diakhaté; third khalifa-general of the Mourides, succeeding his elder brother Fallou Mbacké in 1968; under his caliphate Touba gained a hospital, a gendarmerie, a bus station and a market, the mosque was extended and decorated in Moroccan style, and a library holding 170,000 works was built. He died on 19 June 1989 at Touba and was succeeded by his younger brother Cheikh Abdou Khadre Mbacké. The text describes him by office, descent and works; it makes no statement of his personal initiation or affiliation."
