summary:
  ar: "قناة الإرث على يوتيوب ⁦(@omerdongelogluondengidenler)⁩ التي تحمل تسجيلات برنامجه «الراحلون أوّلًا» على قناة كنال 7؛ يصف وصفها نفسه بأن فيه محتوى برنامجه التلفزيوني."
  en: "The legacy YouTube channel (@omerdongelogluondengidenler) carrying recordings of his Kanal 7 programme Önden Gidenler; its own description states that it holds content from the programme he made on Kanal 7."
  es: "El canal de YouTube que perduró en el tiempo (@omerdongelogluondengidenler) contiene grabaciones de su programa de Kanal 7, Önden Gidenler; su propia descripción indica que contiene contenido del programa que realizó en Kanal 7."
  fr: "La chaîne YouTube historique (@omerdongelogluondengidenler) héberge des enregistrements de son émission Önden Gidenler diffusée sur Kanal 7; sa propre description indique qu'elle contient du contenu de l'émission qu'il a réalisée sur Kanal 7."
  ur: "میراثی یوٹیوب چینل (@omerdongelogluondengidenler) اپنے کنال 7 پروگرام Önden Gidenler کی ریکارڈنگ لے کر؛ اس کی اپنی تفصیل بتاتی ہے کہ اس میں کنال 7 پر بنائے گئے پروگرام کا مواد ہے۔"
  tr: "YouTube'daki Heritage Channel'ın (@omerdongelogluondengidenler), Channel 7'de yayınlanan 'The Departed First' programının kayıtlarını yayınlamaktadır ve kendisini TV programından içerik barındıran biri olarak tanımlıyor."
  id: "Heritage Channel di YouTube (@omerdongelogluondengidenler), yang menayangkan rekaman programnya 'The Departed First' di Channel 7, menggambarkan dirinya berisi konten dari acara TV-nya."
