reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026, and its content checked against the recorded revision. It gives Ismaël Lô, born 30 August 1956 at Dogondoutchi, Niger, to a Senegalese father of the Wolof ethnic group and a Nigerien mother, the family's return to Senegal and settlement at Rufisque near Dakar; his guitar and harmonica and the description of him as 'the Bob Dylan of Africa'; his study at the School of Art in Dakar; Super Diamono, left in 1984 for a solo career, with five solo albums in the following four years; the soundtrack of Ousmane Sembène's Camp de Thiaroye (1988), in which he also played, and his part in Tableau Ferraille (1996); the 1990 Barclay deal and the album Ismael Lo, whose single 'Tajabone' made the European charts and launched his international career, and which was later used in Pedro Almodóvar's All About My Mother (1999); Iso (1994); the compilation Jammu Africa (1996) with the duet 'Without Blame' with Marianne Faithfull; his making a Knight of the Legion of Honor in 2002; and the album Sénégal (2006), recorded in Dakar, Paris and London, with his stated reason for its title. The article states no religion for him; song titles with religious words are repertoire, not attestation."
