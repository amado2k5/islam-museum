reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives his birth on 10 July 1929 at Toshka near Wadi Halfa; the family's move after the Aswan High Dam flooded the village in 1960; electrical engineering at King Fouad University (now Cairo University) and work on the Egyptian railways; study of the muwashshah at Ibrahim Shafiq's institute and then oud and Arab music at the King Fouad Institute for Middle Eastern Music; the Accademia di Santa Cecilia in Rome and a grant to study Western music in the United States; his travelling from village to village on a donkey collecting old Nubian songs, and his standing as 'father of Nubian music'; the soundtrack credit for Francis Ford Coppola's The Black Stallion film, per this article; teaching posts at Ohio, Washington and Texas universities; his last visit to Egypt in 2000 for a Cairo Opera House symposium; and his death on 22 May 2006 in Berkeley, noting the wide American and Japanese media attention and, in this article's assessment, the neglect of Egyptian media. The article states no religion for him."
