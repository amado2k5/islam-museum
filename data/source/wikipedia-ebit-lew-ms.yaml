reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. Read in full on 4 November 2026. The lead calls him a Malaysian entrepreneur and freelance preacher of Chinese ethnicity; the Elewsmart supermarket chain (first branch Bandar Baru Bangi, 18 July 2020), the Transform Training & Consultancy company and its Keluarga Sunnah seminar, and the book list with ISBNs are stated in the text; the Gaza mission dispute is footnoted to Astro Awani, Sinar Harian and The Star; the February 2022 plea at Tenom, Sabah (not guilty on 11 charges, bail RM11,000) is footnoted to Astro Awani. No revision id is recorded; the access date stands in its place (wave-187/188 pattern)."
