summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد عصمت عبد المجيد؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في الإسكندرية ودراسته، ومشاركته في وفد 1957 الذي تفاوض على استئناف العلاقات مع فرنسا، ووزارته وأمانته العامة، ووفاته يوم السبت 21 ديسمبر 2013 عن عمر يناهز التسعين. تذكر أن والده محمد فهمي عبد المجيد أسس جمعية المواساة الإسلامية الخيرية بالإسكندرية."
  en: "Arabic Wikipedia article on Ahmed Asmat Abdel-Meguid; used for entity facts only. It recounts his Alexandria upbringing and studies, his part in the 1957 delegation that negotiated the resumption of relations with France, his ministership and secretary-generalship, and his death on Saturday 21 December 2013 aged 90. It records that his father, Muhammad Fahmi Abdel-Meguid, founded the Islamic Mowasat charitable association in Alexandria."
  es: "Artículo en árabe de la Wikipedia sobre Ahmed Asmat Abdel-Meguid; utilizado únicamente para datos sobre la persona. Relata su infancia y estudios en Alejandría, su participación en la delegación de 1957 que negoció la reanudación de las relaciones con Francia, su ministerio y su cargo de secretario general, y su fallecimiento el sábado 21 de diciembre de 2013 a los 90 años. Menciona que su padre, Muhammad Fahmi Abdel-Meguid, fundó la asociación benéfica islámica Mowasat en Alejandría."
  fr: "Article de Wikipédia en arabe consacré à Ahmed Asmat Abdel-Meguid; utilisé uniquement à des fins d’information sur l’entité. Il relate son enfance et ses études à Alexandrie, son rôle au sein de la délégation de 1957 qui a négocié la reprise des relations avec la France, ses fonctions de ministre et de secrétaire général, ainsi que son décès le samedi 21 décembre 2013 à l’âge de 90 ans. Il indique que son père, Muhammad Fahmi Abdel-Meguid, a fondé l’association caritative islamique Mowasat à Alexandrie."
