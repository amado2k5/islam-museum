  ar: "مقالة ويكيبيديا العربية عن أحمد عصمت عبد المجيد؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في الإسكندرية ودراسته، ومشاركته في وفد 1957 الذي تفاوض على استئناف العلاقات مع فرنسا، ووزارته وأمانته العامة، ووفاته يوم السبت 21 ديسمبر 2013 عن عمر يناهز التسعين. تذكر أن والده محمد فهمي عبد المجيد أسس جمعية المواساة الإسلامية الخيرية بالإسكندرية."
  en: "Arabic Wikipedia article on Ahmed Asmat Abdel-Meguid; used for entity facts only. It recounts his Alexandria upbringing and studies, his part in the 1957 delegation that negotiated the resumption of relations with France, his ministership and secretary-generalship, and his death on Saturday 21 December 2013 aged 90. It records that his father, Muhammad Fahmi Abdel-Meguid, founded the Islamic Mowasat charitable association in Alexandria."
