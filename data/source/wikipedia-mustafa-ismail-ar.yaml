summary:
  ar: "مقالة ويكيبيديا العربية عن مصطفى إسماعيل؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بميت غزال في 17 يونيو 1905 الموافق ربيع الثاني 1323 هـ، وحفظه القرآن قبل الثانية عشرة، ودراسته بالمعهد الأحمدي بطنطا، واختيار الملك فاروق له قارئا للقصر، وزيارتيه للقدس 1960 و1977، ووفاته بالإسكندرية في 26 ديسمبر 1978 ودفنه بميت غزال بوصيته؛ وصندوق قارئ القرآن فيها يعطي الديانة الإسلام والطائفة أهل السنة والجماعة."
  en: "Arabic Wikipedia article on Mustafa Ismail; used for entity facts only. It gives his birth at Mit Gazal on 17 June 1905, paired with Rabi' al-Thani 1323 AH, his memorisation of the Qur'an before the age of twelve, his studies at the Ahmadi Institute in Tanta, King Farouk's choice of him as palace reciter, his Jerusalem visits of 1960 and 1977, and his death at Alexandria on 26 December 1978 with burial at Mit Gazal by his will; its reciter infobox gives religion Islam and sect Ahl al-Sunna wa-l-Jama'a."
