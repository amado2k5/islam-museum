summary:
  ar: "مقالة ويكيبيديا العربية عن مصطفى إسماعيل؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بميت غزال في 17 يونيو 1905 الموافق ربيع الثاني 1323 هـ، وحفظه القرآن قبل الثانية عشرة، ودراسته بالمعهد الأحمدي بطنطا، واختيار الملك فاروق له قارئا للقصر، وزيارتيه للقدس 1960 و1977، ووفاته بالإسكندرية في 26 ديسمبر 1978 ودفنه بميت غزال بوصيته؛ وصندوق قارئ القرآن فيها يعطي الديانة الإسلام والطائفة أهل السنة والجماعة."
  en: "Arabic Wikipedia article on Mustafa Ismail; used for entity facts only. It gives his birth at Mit Gazal on 17 June 1905, paired with Rabi' al-Thani 1323 AH, his memorisation of the Qur'an before the age of twelve, his studies at the Ahmadi Institute in Tanta, King Farouk's choice of him as palace reciter, his Jerusalem visits of 1960 and 1977, and his death at Alexandria on 26 December 1978 with burial at Mit Gazal by his will; its reciter infobox gives religion Islam and sect Ahl al-Sunna wa-l-Jama'a."
  es: "Artículo de Wikipedia en árabe sobre Mustafa Ismail; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Mit Gazal el 17 de junio de 1905, junto con Rabi' al-Thani 1323 AH, su memorización del Corán antes de los doce años, sus estudios en el Instituto Ahmadi en Tanta, su elección por el rey Farouk como recitador del palacio, sus visitas a Jerusalén en 1960 y 1977, y su muerte en Alejandría el 26 de diciembre de 1978, con entierro en Mit Gazal según su testamento; su ficha informativa sobre el recitador indica su religión, el Islam, y su secta, Ahl al-Sunna wa-l-Jama'a."
  fr: "Article de Wikipédia en arabe sur Mustafa Ismail; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance à Mit Gazal le 17 juin 1905 (Rabi' al-Thani 1323 AH), sa mémorisation du Coran avant l'âge de douze ans, ses études à l'Institut Ahmadi de Tanta, sa nomination par le roi Farouk comme récitateur du palais, ses visites à Jérusalem en 1960 et 1977, et sa mort à Alexandrie le 26 décembre 1978, avec inhumation à Mit Gazal conformément à ses dernières volontés; l'encadré relatif au récitateur précise sa religion: l'islam, et son appartenance à la secte Ahl al-Sunna wa-l-Jama'a."
  ur: "مصطفی اسماعیل پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 17 جون 1905 کو میت غزال میں ان کی پیدائش، ربیع الثانی 1323 ہجری کے ساتھ جوڑا، بارہ سال کی عمر سے پہلے اس کا قرآن حفظ، طنطہ کے احمدی انسٹی ٹیوٹ میں ان کی تعلیم، شاہ فاروق کا اسے محل کے قاری کے طور پر منتخب کرنا، اس کا یروشلم کا دورہ اور 1967 میں اسکندریہ کا دورہ اور 1967 میں ان کی وفات۔ دسمبر 1978 کو ان کی وصیت سے میت غزال میں تدفین کے ساتھ۔ اس کے قاری کا معلوماتی باکس مذہب اسلام اور فرقہ اہل السنۃ والجماعۃ دیتا ہے۔"
  tr: "Mustafa İsmail hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 17 Haziran 1905'te Mit Gazel'de doğdu, bu tarih 1323 Hicri Rabi'l-Thani'ye karşılık geliyor, on iki yaşından önce Kur'an'ı ezberledi, Tanta'daki Ahmedi Enstitüsü'nde eğitim gördü, Kral Faruk tarafından saray okumacısı olarak seçildi, 1960 ve 1977'de Kudüs'e yaptığı ziyaretler, 26 Aralık 1978'de İskenderiye'de vefat etti ve vasiyetine göre Mit Gazel'e defnedildi; oradaki Kur'an Şivetçi kutusunda İslam dini ve Ehl-sünnet ve Cema'a mezhebi yer almaktadır."
  id: "Artikel Wikipedia Arab tentang Mustafa Ismail; digunakan hanya untuk fakta entitas. Ia lahir di Mit Ghazal pada 17 Juni 1905, sesuai dengan Rabi' al-Thani 1323 H, menghafal Al-Qur'an sebelum usia dua belas tahun, belajar di Institut Ahmadi di Tanta, dipilih oleh Raja Farouk sebagai pembaca istana, serta kunjungannya ke Yerusalem pada tahun 1960 dan 1977, serta kematiannya di Alexandria pada 26 Desember 1978, dan pemakamannya di Mit Ghazal sesuai wasiatnya; dan kotak pembaca Al-Qur'an di sana menyebutkan agama Islam dan sekte Ahl al-Sunnah wa al-Jama'ah."
