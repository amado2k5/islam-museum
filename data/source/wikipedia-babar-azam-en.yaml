  ar: "مقالة ويكيبيديا الإنجليزية عن بابر أعظم (مواليد 1994)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في لاهور في 15 أكتوبر 1994، وبدايته الدولية سنة 2015، وفوزه مع باكستان بكأس الأبطال 2017، وقيادته باكستان في الصيغ الثلاث، وقيادته باكستان إلى نهائي كأس العالم للعشرين سنة 2022."
  en: "English Wikipedia article on Babar Azam (born 1994); used for entity facts only. It records his birth in Lahore on 15 October 1994, his international debut in 2015, his part in Pakistan's 2017 Champions Trophy win, his captaincy of Pakistan in all three formats and his leading Pakistan to the 2022 T20 World Cup final. Its early-life section describes his family as a family of the Walled City of Lahore; no religion or school is attested for him."
