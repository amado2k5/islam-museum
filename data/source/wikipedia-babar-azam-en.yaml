summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بابر أعظم ⁦(مواليد 1994)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في لاهور في 15 أكتوبر 1994، وبدايته الدولية سنة 2015، وفوزه مع باكستان بكأس الأبطال 2017، وقيادته باكستان في الصيغ الثلاث، وقيادته باكستان إلى نهائي كأس العالم للعشرين سنة 2022."
  en: "English Wikipedia article on Babar Azam (born 1994); used for entity facts only. It records his birth in Lahore on 15 October 1994, his international debut in 2015, his part in Pakistan's 2017 Champions Trophy win, his captaincy of Pakistan in all three formats and his leading Pakistan to the 2022 T20 World Cup final. Its early-life section describes his family as a family of the Walled City of Lahore; no religion or school is attested for him."
  es: "Artículo de la Wikipedia en inglés sobre Babar Azam (nacido en 1994); utilizado únicamente para datos sobre la persona. Registra su nacimiento en Lahore el 15 de octubre de 1994, su debut internacional en 2015, su participación en la victoria de Pakistán en el Trofeo de Campeones de 2017, su capitanía de Pakistán en los tres formatos y su liderazgo de Pakistán en la final de la Copa Mundial T20 de 2022. La sección sobre su infancia describe a su familia como perteneciente a la Ciudad Amurallada de Lahore; no se menciona su religión ni la escuela a la que asistió."
  fr: "Article de Wikipédia en anglais sur Babar Azam (né en 1994); utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Lahore le 15 octobre 1994, ses débuts internationaux en 2015, sa participation à la victoire du Pakistan au Trophée des Champions 2017, son capitanat de l'équipe nationale du Pakistan dans les trois formats et son rôle de capitaine du Pakistan jusqu'en finale de la Coupe du monde de T20 2022. La section consacrée à son enfance indique que sa famille est originaire de la vieille ville de Lahore; aucune information n'est fournie concernant sa religion ou son école."
  ur: "بابر اعظم ⁦(پیدائش 1994)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 15 اکتوبر 1994 کو لاہور میں ان کی پیدائش، 2015 میں ان کا بین الاقوامی ڈیبیو، پاکستان کی 2017 کی چیمپئنز ٹرافی جیتنے میں ان کا حصہ، تینوں فارمیٹس میں پاکستان کی کپتانی اور 2022 کے T20 ورلڈ کپ کے فائنل میں پاکستان کی قیادت کرنے کا ریکارڈ درج ہے۔ اس کا ابتدائی زندگی کا حصہ ان کے خاندان کو دیواروں والے شہر لاہور کے خاندان کے طور پر بیان کرتا ہے۔ اس کے لیے کوئی مذہب یا اسکول تصدیق شدہ نہیں ہے۔"
  tr: "Babur Azam (1994 doğumlu) hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılmıştır. 15 Ekim 1994'te Lahor'da doğduğunu, 2015'teki uluslararası çıkışını, 2017 Şampiyonlar Kupası'nda Pakistan ile kazandığı zaferi, üç formatta kaptanlığını ve 2022 Dünya Kupası finaline liderliğini belirtin."
  id: "Artikel Wikipedia bahasa Inggris tentang Babur Azam (lahir 1994); digunakan hanya untuk fakta entitas. Sebutkan kelahirannya di Lahore pada 15 Oktober 1994, debut internasionalnya pada 2015, kemenangannya bersama Pakistan di Piala Champions 2017, kepemimpinannya di ketiga format, dan kepemimpinannya hingga final Piala Dunia 2022."
