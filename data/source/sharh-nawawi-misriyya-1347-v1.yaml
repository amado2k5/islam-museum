label:
  ar: "صحيح مسلم بشرح النووي — المطبعة المصرية بالأزهر، الطبعة الأولى 1347هـ/1929م، الجزء الأول"
  en: "Sahih Muslim bi-Sharh al-Nawawi — al-Matba'a al-Misriyya bi-l-Azhar, 1st ed. 1347 AH/1929 CE, vol. 1"
summary:
  ar: "الجزء الأول من طبعة المطبعة المصرية بالأزهر ⁦(إدارة محمد محمد عبد اللطيف)⁩ لشرح النووي ⁦(ت 676هـ)⁩ على صحيح مسلم، الطبعة الأولى 1347هـ/1929م، وفيه مقدمة الشارح وفصولها في إسناد الكتاب ورواته وشرط مسلم وما انتُقد عليه ومصطلح الحديث، ثم شرح مقدمة مسلم."
  en: "Volume 1 of the al-Matba'a al-Misriyya bi-l-Azhar edition (managed by Muhammad Muhammad 'Abd al-Latif) of al-Nawawi's (d. 676 AH) commentary on Sahih Muslim, 1st ed. 1347 AH/1929 CE, containing the commentator's introduction — chapters on the book's chain and transmitters, Muslim's condition, criticisms of it and hadith terminology — and then the commentary on Muslim's own introduction."
  es: "Volumen 1 de la edición al-Matba'a al-Misriyya bi-l-Azhar (gestionada por Muhammad Muhammad 'Abd al-Latif) del comentario de al-Nawawi (m. 676 AH) sobre Sahih Muslim, 1.ª ed. 1347 AH/1929 CE, que contiene la introducción del comentarista —capítulos sobre la cadena y los transmisores del libro, la condición de Muslim, las críticas al mismo y la terminología de los hadices— y luego el comentario sobre la propia introducción de Muslim."
  fr: "Volume 1 de l'édition al-Matba'a al-Misriyya bi-l-Azhar (gérée par Muhammad Muhammad 'Abd al-Latif) du commentaire d'al-Nawawi (d. 676 AH) sur Sahih Muslim, 1ère édition 1347 AH/1929 CE, contenant l'introduction du commentateur — des chapitres sur la chaîne du livre et les transmetteurs, la condition de Muslim, les critiques de celui-ci et la terminologie des hadiths — puis le commentaire sur l'introduction de Muslim lui-même."
  ur: "المطبع المصریہ بائل الازہر ایڈیشن کی جلد 1 ⁦(منظم محمد عبد اللطیف)⁩ النووی ⁦(متوفی 676ھ)⁩ کی تفسیر صحیح مسلم، 1st ایڈیشن۔ 1347ھ/1929 عیسوی، جس میں مفسر کا تعارف — کتاب کے سلسلہ اور نقل کرنے والے ابواب، مسلم کی حالت، اس پر تنقید اور حدیث کی اصطلاحات — اور پھر مسلم کے اپنے تعارف کی تفسیر۔"
  tr: "Al-Ezher'deki Mısır Basını'nın (Muhammed Abdul Latif tarafından yönetilen) Şerh el-Nevavi (ö. 676 H) tarafından Sahih Müslüman üzerine ilk bölümü, ilk baskı 1347 Hicri / 1929 M.S. olup, yorumcunun girişi ve kitabın ve anlatıcılarının aktarım zincirleri, Müslümanların durumu ve eleştirileri, hadis terminolojisi üzerine bölümler içerir; ardından Müslüman'ın girişine ilişkin bir tefsir yer alır."
  id: "Bagian pertama edisi Pers Mesir di Al-Azhar (dikelola oleh Muhammad Muhammad Abdul Latif) oleh Sharh al-Nawawi (wafat 676 H) tentang Sahih Muslim, edisi pertama 1347 H / 1929 M, yang mencakup pengantar komentator dan bab-bab tentang rantai transmisi kitab dan naratornya, kondisi Muslim dan apa yang dikritik terhadapnya, serta terminologi hadits, diikuti dengan komentar atas pengantar Muslim."
