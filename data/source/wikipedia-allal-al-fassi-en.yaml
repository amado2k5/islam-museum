reliability_note: "Community-edited encyclopedia article (rated a good article), retrieved in full at the stated revision, resting on the scholarship of C. R. Pennell (2000), Henri Lauzière (2015), Susan Schriber (2024), Jamila Bargach, Benjamin Bruce (2018) and Ruba Salih (2013). Its embedded religious-biography infobox gives his religion as Islam, his movement as the neo-Salafiyya and Islamic modernism, and his creed as Ash'ari on Lauzière's authority. On the law school it records that the reform plan he led demanded unification of the legal system under Maliki law, that his own work in the law of worship claimed to uphold Maliki law while diverging from Maliki norms at points, that the Mudawana he helped codify was based on Maliki law, and, through Bruce, that he showed himself hostile to Morocco's Maliki school as an impediment to reason; the record's faith note preserves that whole configuration."
