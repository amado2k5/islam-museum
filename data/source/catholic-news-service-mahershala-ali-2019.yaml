reliability_note: "Wire-service news report, read on 25 October 2026. It reports that on 16 July 2019 Ali addressed an evening reception of the Ahmadiyya Muslim Congressional Caucus, co-sponsored with the Tom Lantos Human Rights Commission, speaking on religious freedom, and it states in its own voice: 'Ali, born in California, converted to the Muslim faith in 2000 and became an Ahmadi, a branch of Islam that is often targeted in nations that are majority Sunni Muslim, such as Pakistan.' As an independent news wire reporting both the affiliation and Ali's own public address to the Ahmadiyya community's caucus, it is one of the independent attestations on which the person record's ahmadiyya segment rests. The report also records, attributed, that Sunni critics call Ahmadis blasphemous and that Ahmadis face bans on group worship and mob violence in Pakistan — context the person prose carries as attributed, with no verdict."
