  ar: "مقالة ويكيبيديا الإنجليزية عن أناندا كريشنان (1 نيسان 1938 – 28 تشرين الثاني 2024)، مؤسس أوساها تيغاس وماكسيس وأسترو وميسات؛ تذكر مولده في بريكفيلدز بكوالالمبور من أبوين تاميليين، ودراسته في ملبورن وهارفارد، ووفاته في جبال الألب السويسرية، وتقول في متنها إنه كان من أتباع البوذية."
  en: "English Wikipedia article on Ananda Krishnan (1 April 1938 – 28 November 2024), founder of Usaha Tegas and of Maxis, Astro and MEASAT; it gives his birth at Brickfields, Kuala Lumpur to Tamil parents, his studies at Melbourne and Harvard, his death in the Swiss Alps, and states in its prose that he was a follower of Buddhism."
