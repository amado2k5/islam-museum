summary:
  ar: "مقالة ويكيبيديا العربية عن الحاج أذن خير ⁦(أوزون حاجي)⁩؛ تُستخدم لوقائع الكيان فقط. تروي سيرته شيخًا وأميرًا لشمال القوقاز ووفاته سنة 1920."
  en: "Arabic Wikipedia article on Uzun-Haji under his Arabic name al-Hajj Udhun Khayr; used for entity facts only. It recounts his career as sheikh and Emir of the North Caucasus and his death in 1920."
  es: "Artículo de Wikipedia en árabe sobre Uzun-Haji bajo su nombre árabe al-Hajj Udhun Khayr; Se utiliza únicamente para hechos de entidades. Relata su carrera como jeque y emir del Cáucaso Norte y su muerte en 1920."
  fr: "Article Wikipédia en arabe sur Uzun-Haji sous son nom arabe al-Hajj Udhun Khayr; utilisé uniquement pour les faits d’entité. Il retrace sa carrière de cheikh et d'émir du Caucase du Nord et sa mort en 1920."
  ur: "عزون حاجی پر عربی ویکیپیڈیا کا مضمون ان کے عربی نام الحاج ادون خیر کے تحت؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ شمالی قفقاز کے شیخ اور امیر کے طور پر ان کے کیریئر اور 1920 میں ان کی موت کا ذکر کرتا ہے۔"
  tr: "Hajj Azan Khair (Ozon Haci) hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kuzey Kafkasya'nın şeyhi ve prensi olarak biyografisini ve 1920'deki ölümünü anlatır."
  id: "Artikel Wikipedia Arab tentang Haji Azan Khair (Ozon Haji); hanya digunakan untuk fakta entitas. Artikel ini menceritakan biografinya sebagai seorang sheikh dan pangeran Kaukasus Utara serta kematiannya pada tahun 1920."
