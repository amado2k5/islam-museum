label:
  ar: "فتوى دار الإفتاء المصرية رقم 8127: صلاة الجمعة بخطبة واحدة بغير العربية"
  en: "Dar al-Ifta al-Misriyya, Fatwa 8127 (Friday prayer with one sermon in other than Arabic)"
summary:
  ar: "صفحة وردت في ملخص بحثي قُدِّم إلى المتحف واعتمده المؤسس في 21 نوفمبر 2026؛ لم تُفتح الصفحة، وأرقام الصفحات المذكورة هي ما في الملخص ولم يُتحقق منها. ناشرها: Dar al-Ifta al-Misriyya. يُستند إليها في: حكم الخطبة بغير العربية عند المذاهب."
  en: "A page listed in a research summary supplied to the museum and approved by the founder on 21 November 2026; the page was not opened, and any page numbers are the summary's and unchecked. Publisher: Dar al-Ifta al-Misriyya. Used for: the positions on giving the Friday sermon in a language other than Arabic."
  ur: "ایک صفحہ جو عجائب گھر کو دیے گئے تحقیقی خلاصے میں مذکور ہے اور جسے بانی نے 21 نومبر 2026 کو منظور کیا؛ صفحہ کھولا نہیں گیا، اور صفحات کے نمبر خلاصے کے ہیں اور جانچے نہیں گئے۔ ناشر: Dar al-Ifta al-Misriyya۔ اس سے استناد ان امور کے لیے ہے: جمعہ کے خطبے کو غیر عربی میں دینے کے بارے میں مذاہب کے اقوال۔"
  fr: "Page citée dans un résumé de recherche remis au musée et approuvé par le fondateur le 21 novembre 2026 ; la page n'a pas été ouverte, et les numéros de page sont ceux du résumé, non vérifiés. Éditeur : Dar al-Ifta al-Misriyya. Utilisée pour : les positions sur le prône du vendredi dans une langue autre que l'arabe."
  es: "Página citada en un resumen de investigación entregado al museo y aprobado por el fundador el 21 de noviembre de 2026; la página no se abrió, y los números de página son los del resumen, sin comprobar. Editor: Dar al-Ifta al-Misriyya. Usada para: las posiciones sobre dar el sermón del viernes en una lengua distinta del árabe."
  tr: "21 Kasım 2026'da müzeye sunulan ve kurucu tarafından onaylanan bir araştırma özetinde yer alan bir sayfa; sayfa açılmadı ve belirtilen sayfa numaraları özetteki numaralar olup doğrulanmadı. Yayıncı: Dar al-Ifta al-Misriyya. Temel: Düşünce okullarına göre Arapça dışındaki dillerde vaazlar hakkındaki karar."
  id: "Halaman yang muncul dalam ringkasan penelitian yang diserahkan ke museum dan disetujui oleh pendiri pada 21 November 2026; halaman tersebut tidak dibuka, dan nomor halaman yang disebutkan adalah yang abstrak dan belum diverifikasi. Penerbit: Dar al-Ifta al-Misriyya. Berdasarkan pada: Putusan tentang Khotbah dalam Bahasa selain Arab menurut aliran pemikiran."
