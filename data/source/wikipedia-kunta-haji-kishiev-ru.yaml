  ar: "مقالة ويكيبيديا الروسية عن كونتا حاجي كيشييف؛ تُستخدم لوقائع الكيان فقط. تسمّيه مقدمتها شيخًا صوفيًا ومؤسس «الحاجي مريدية»، ضربًا من الطريقة القادرية، وتذكر مولده «بين 1800 و1830» عن الموسوعة الروسية الكبرى، ووفاته في 19(31) مايو 1867 في أوستيوجنا، وتنوه بتقليد 11 يوليو 1812 الرسمي الشيشاني."
  en: "Russian Wikipedia article on Kunta-Haji Kishiev; used for entity facts only. Its lead names him a Sufi sheikh and founder of Haji-Muridiyya, a variety of the Qadiriyya order; it gives his birth as 'between 1800 and 1830' from the Great Russian Encyclopedia, his death on 19(31) May 1867 at Ustyuzhna, and notes the official Chechen tradition of 11 July 1812."
