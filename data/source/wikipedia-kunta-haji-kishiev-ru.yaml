summary:
  ar: "مقالة ويكيبيديا الروسية عن كونتا حاجي كيشييف؛ تُستخدم لوقائع الكيان فقط. تسمّيه مقدمتها شيخًا صوفيًا ومؤسس «الحاجي مريدية»، ضربًا من الطريقة القادرية، وتذكر مولده «بين 1800 و1830» عن الموسوعة الروسية الكبرى، ووفاته في 19(31) مايو 1867 في أوستيوجنا، وتنوه بتقليد 11 يوليو 1812 الرسمي الشيشاني."
  en: "Russian Wikipedia article on Kunta-Haji Kishiev; used for entity facts only. Its lead names him a Sufi sheikh and founder of Haji-Muridiyya, a variety of the Qadiriyya order; it gives his birth as 'between 1800 and 1830' from the Great Russian Encyclopedia, his death on 19(31) May 1867 at Ustyuzhna, and notes the official Chechen tradition of 11 July 1812."
  es: "Artículo de la Wikipedia rusa sobre Kunta-Haji Kishiev; utilizado únicamente para datos sobre la persona. Su introducción lo describe como un jeque sufí y fundador de Haji-Muridiyya, una variante de la orden Qadiriyya; según la Gran Enciclopedia Rusa, nació \"entre 1800 y 1830\", falleció el 19 (31) de mayo de 1867 en Ustyuzhna y menciona la tradición oficial chechena del 11 de julio de 1812."
  fr: "Article de Wikipédia en russe sur Kunta-Haji Kishiev; utilisé uniquement pour les informations sur l'entité. Son introduction le présente comme un cheikh soufi et fondateur de la Haji-Muridiyya, une variante de l'ordre Qadiriyya; elle indique sa naissance entre 1800 et 1830 d'après la Grande Encyclopédie russe, sa mort le 19 (ou 31) mai 1867 à Oustioujna, et mentionne la tradition tchétchène officielle du 11 juillet 1812."
  ur: "کنتا-حاجی کیشیف پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ اسے ایک صوفی شیخ اور حاجی مریدیہ کے بانی کا نام دیتا ہے، جو قادریہ کی ایک قسم ہے۔ یہ عظیم روسی انسائیکلوپیڈیا سے '1800 اور 1830 کے درمیان' کے طور پر اس کی پیدائش، 19 (31) مئی 1867 کو استیوزنا میں اس کی موت، اور 11 جولائی 1812 کی سرکاری چیچن روایت کو نوٹ کرتا ہے۔"
