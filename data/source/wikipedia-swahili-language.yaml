summary:
  ar: 'صفحة «Swahili» على Wikipedia (English)، ملخَّصة في ملف بحثي قُدّم إلى المتحف ولم يفتحها المتحف؛ تُستعمل لـنسبة الألفاظ العربية الدخيلة في السواحلية: نحو 40%، مع اختلاف التقديرات وبعض المصادر القديمة التي تذكر 16 إلى 20%. أجاز المؤسس استعمال الملخص في 21 نوفمبر 2026 دون إعادة تحقق.'
  en: 'The page "Swahili" on Wikipedia (English), summarised in a research file supplied to the museum and not opened by the museum; used for the Swahili share of Arabic loanwords: about 40%, with estimates varying and some historical sources giving 16 to 20%. The founder approved using the summary on 21 November 2026 without re-verification.'
  ur: 'Wikipedia (English) پر صفحہ «Swahili»، جو عجائب گھر کو فراہم کردہ تحقیقی فائل میں خلاصہ کیا گیا اور عجائب گھر نے نہیں کھولا؛ اس کے لیے استعمال ہوا: سواحلی میں عربی مستعار الفاظ کا تناسب: تقریباً 40 فیصد، اندازوں کے اختلاف کے ساتھ اور بعض تاریخی مآخذ 16 سے 20 فیصد بتاتے ہیں۔ بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔'
  fr: 'La page « Swahili » sur Wikipedia (English), résumée dans un fichier de recherche remis au musée et non ouverte par le musée ; utilisée pour la part des emprunts arabes en swahili : environ 40 %, les estimations variant et certaines sources anciennes donnant 16 à 20 %. Le fondateur a approuvé l''usage du résumé le 21 novembre 2026 sans nouvelle vérification.'
  es: 'La página «Swahili» en Wikipedia (English), resumida en un archivo de investigación entregado al museo y no abierta por el museo; usada para la parte de préstamos árabes en suajili: alrededor del 40 %, con estimaciones que varían y algunas fuentes históricas que dan entre el 16 y el 20 %. El fundador aprobó el uso del resumen el 21 de noviembre de 2026 sin nueva verificación.'
  tr: "Wikipedia'daki \"Swahili\" sayfası (İngilizce), müzeye sunulan ancak müze tarafından açılmayan bir araştırma dosyasında özetlenmiştir; Swahili'ye yabancı Arapça kelimelerin yüzdesi için kullanılır: yaklaşık %40, tahminler değişken ve bazı eski kaynaklar %16 ila %20 oranında belirtilmiştir. Kurucu, özetin kullanımına 21 Kasım 2026'da geri alma olmaksızın izin vermiştir."
  id: "Halaman \"Swahili\" di Wikipedia (Inggris), dirangkum dalam berkas penelitian yang dikirim ke museum tetapi tidak dibuka oleh museum; digunakan untuk persentase kata Arab asing bagi Swahili: sekitar 40%, dengan perkiraan yang berbeda dan beberapa sumber lama menyebutkan 16 hingga 20%. Pendiri mengizinkan penggunaan ringkasan pada 21 November 2026, tanpa verifikasi ulang."
