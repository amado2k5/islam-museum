reliability_note: "Read in the museum's session on 20 November 2026. It gives the full title al-Mu'arrab mine l-kalam al-a'jami 'ala huruf al-mu'jam, also called al-Mu'arrabat; says that after the preface and two chapters, since no word begins with the letters dha and za, the dictionary has twenty-six chapters explaining 732 words of foreign origin, 130 of them personal and place names, in alphabetical order; that its preface treats the Arabs' way of using foreign words, takes a middle course on whether the Qur'an contains foreign words (it does, but they were Arabised), and sets out criteria; and that arranging by the first letter alone makes words hard to find and causes some repetition. Used for entity facts only."
