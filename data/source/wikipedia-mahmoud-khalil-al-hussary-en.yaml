summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمود خليل الحصري؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 17 سبتمبر 1917 في شبرا النملة بطنطا، وتعيينه في إذاعة مصر 1944 وخدمته في مسجد الحسين منذ 1955، وأنه أول من سجّل المصحف كاملا مرتلا وسجّل روايات ورش وقالون والدوري، ومناصبه في الأزهر وجوائزه ورحلاته، ووفاته في القاهرة في 24 نوفمبر 1980؛ وصندوق سيرتها الدينية المضمّن يعطي طائفته سنية."
  en: "English Wikipedia article on Mahmoud Khalil al-Hussary; used for entity facts only. It gives his birth on 17 September 1917 at Shobra al-Namla, Tanta, his Egypt Radio appointment of 1944, his service at the al-Hussein Mosque from 1955, his first complete murattal recording and the Warsh, Qalun and Duri recordings, his al-Azhar posts, awards and travels, and his death at Cairo on 24 November 1980; its embedded religious-biography infobox gives his denomination as Sunni."
