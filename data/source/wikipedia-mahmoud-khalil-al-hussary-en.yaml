summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمود خليل الحصري؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 17 سبتمبر 1917 في شبرا النملة بطنطا، وتعيينه في إذاعة مصر 1944 وخدمته في مسجد الحسين منذ 1955، وأنه أول من سجّل المصحف كاملا مرتلا وسجّل روايات ورش وقالون والدوري، ومناصبه في الأزهر وجوائزه ورحلاته، ووفاته في القاهرة في 24 نوفمبر 1980؛ وصندوق سيرتها الدينية المضمّن يعطي طائفته سنية."
  en: "English Wikipedia article on Mahmoud Khalil al-Hussary; used for entity facts only. It gives his birth on 17 September 1917 at Shobra al-Namla, Tanta, his Egypt Radio appointment of 1944, his service at the al-Hussein Mosque from 1955, his first complete murattal recording and the Warsh, Qalun and Duri recordings, his al-Azhar posts, awards and travels, and his death at Cairo on 24 November 1980; its embedded religious-biography infobox gives his denomination as Sunni."
  es: "Artículo de la Wikipedia en inglés sobre Mahmoud Khalil al-Hussary; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 17 de septiembre de 1917 en Shobra al-Namla, Tanta, su nombramiento en Egypt Radio en 1944, su servicio en la Mezquita al-Hussein desde 1955, su primera grabación completa de murattal y las grabaciones de Warsh, Qalun y Duri, sus cargos en al-Azhar, premios y viajes, y su muerte en El Cairo el 24 de noviembre de 1980; su ficha biográfica religiosa integrada indica que era sunita."
  fr: "L'article de Wikipédia en anglais consacré à Mahmoud Khalil al-Hussary, utilisé uniquement pour les informations le concernant, indique sa naissance le 17 septembre 1917 à Shobra al-Namla, Tanta, sa nomination à la Radio égyptienne en 1944, son service à la mosquée al-Hussein à partir de 1955, son premier enregistrement complet de murattal ainsi que les enregistrements de Warsh, Qalun et Duri, ses postes à al-Azhar, ses distinctions et ses voyages, et son décès au Caire le 24 novembre 1980. Son encadré biographique religieux intégré précise son appartenance à l'islam sunnite."
  ur: "محمود خلیل الحسری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 17 ستمبر 1917 کو شوبرا النملہ، طنطہ میں ان کی ولادت، 1944 میں ان کی مصر ریڈیو کی تقرری، 1955 سے الحسین مسجد میں ان کی خدمات، ان کی پہلی مکمل مراتل ریکارڈنگ اور وارش، قالون اور دوری کی ریکارڈنگ، ان کے الازہر کے عہدوں، ایوارڈز اور نومبر 1940 میں وفات، 1944 میں ان کی وفات اور سفر کے دوران اس کا سرایت شدہ مذہبی سوانح حیات انفو باکس اس کا فرقہ بطور سنی دیتا ہے۔"
  tr: "Mahmud Halil El-Hüsari hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 17 Eylül 1917'de Tanta'nın Şubra el-Namla kentinde doğdu, 1944'te Radio Misr'e atandı, 1955'ten beri El-Hüseyin Camii'nde görev yaptı ve Warsh, Kalon ve Al-Douri'nin romanlarının tamamını okuyup kaydeden ilk kişi oldu; El-Ezher'deki görevlerini, ödüllerini ve seyahatlerini ve 24 Kasım 1980'de Kahire'de vefat ettiğini belirten ilk Kur'an'dı; ve onun dini biyografisinin kutusunda mezhebi Sünni olarak gösterildi."
  id: "Artikel Wikipedia bahasa Inggris tentang Mahmoud Khalil Al-Husary; digunakan hanya untuk fakta entitas. Ia lahir pada 17 September 1917 di Shubra Al-Namla, Tanta, diangkat ke Radio Misr pada tahun 1944, bertugas di Masjid Al-Hussein sejak 1955, dan menjadi yang pertama mencatat seluruh Al-Quran yang dibacakan dan dicatat novel-novel Warsh, Qalon, dan Al-Douri, jabatannya di Al-Azhar, penghargaan, dan perjalanannya, serta kematiannya di Kairo pada 24 November 1980; dan kotak biografi agamanya yang disertakan menunjukkan sektenya seorang Sunni."
