summary:
  ar: "مقال موسوعي عن عاطف أسلم ⁦(وُلد 12 مارس 1983 في وزير آباد)⁩، مغنّي البلاي باك الباكستاني صاحب «عادت»، والحاصل على تمغة الامتياز (2008)."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth on 12 March 1983 at Wazirabad, his rise with Aadat and the debut album Jal Pari (2004), his Bollywood playback career, his acting debut in Bol (2011), his Coke Studio performances and the Tamgha-e-Imtiaz (2008)."
  ur: "موسوعاتی مضمون عاطف اسلم ⁦(پیدائش 12 مارچ 1983ء، وزیرآباد)⁩ پر؛ «عادت»، «جل پری» اور تمغائے امتیاز ⁦(2008ء)⁩ کا احاطہ کرتا ہے۔"
  es: "Artículo de enciclopedia editado por la comunidad, recuperado íntegramente en la revisión indicada; en él se menciona su nacimiento el 12 de marzo de 1983 en Wazirabad, su ascenso con Aadat y el álbum debut Jal Pari (2004), su carrera como cantante de playback en Bollywood, su debut como actor en Bol (2011), sus actuaciones en Coke Studio y el Tamgha-e-Imtiaz (2008)."
  fr: "Article d'encyclopédie édité par la communauté, récupéré intégralement à la révision indiquée; il donne sa naissance le 12 mars 1983 à Wazirabad, son ascension avec Aadat et le premier album Jal Pari (2004), sa carrière de playback à Bollywood, ses débuts d'acteur dans Bol (2011), ses performances au Coke Studio et le Tamgha-e-Imtiaz (2008)."
  tr: "Atif Aslam hakkında ansiklopedik bir makale (12 Mart 1983, Wazirabad doğumlu), 'Adat'ın Pakistanlı playback şarkıcısı ve Mükemmellik Madalyası (2008) sahibi."
  id: "Sebuah artikel ensiklopedis tentang Atif Aslam (lahir 12 Maret 1983, di Wazirabad), penyanyi playback Pakistan dari 'Adat', dan penerima Excellence Medal (2008)."
