  ar: "مقالة ويكيبيديا العربية عن خواند مير؛ تعطي حياته 881–942هـ وصندوقها مولده 1475 ووفاته 1534، وهو سبط مير خواند صاحب «روضة الصفا»، وتذكر رحلته سنة 932هـ وتقربه من بابر شاه وابنه همايون ووفاته في الهند أثناء سفره إلى كجرات ودفنه في دلهي."
  en: "Arabic Wikipedia article on Khwandamir; it gives his life as 881-942 AH with 1475 and 1534 in its infobox, identifies him as the grandson of Mirkhvand of the Rawzat as-safa, and records his journey of 932 AH, his approach to Babur and Humayun, his death in India while travelling to Gujarat, and his burial at Delhi."
