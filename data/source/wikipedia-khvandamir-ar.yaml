summary:
  ar: "مقالة ويكيبيديا العربية عن خواند مير؛ تعطي حياته 881–942هـ وصندوقها مولده 1475 ووفاته 1534، وهو سبط مير خواند صاحب «روضة الصفا»، وتذكر رحلته سنة 932هـ وتقربه من بابر شاه وابنه همايون ووفاته في الهند أثناء سفره إلى كجرات ودفنه في دلهي."
  en: "Arabic Wikipedia article on Khwandamir; it gives his life as 881-942 AH with 1475 and 1534 in its infobox, identifies him as the grandson of Mirkhvand of the Rawzat as-safa, and records his journey of 932 AH, his approach to Babur and Humayun, his death in India while travelling to Gujarat, and his burial at Delhi."
  es: "Artículo de Wikipedia en árabe sobre Khwandamir; indica que su vida transcurrió entre 881 y 942 AH, con fechas de 1475 y 1534 en su ficha informativa, lo identifica como nieto de Mirkhvand de Rawzat as-safa y registra su viaje de 932 AH, su acercamiento a Babur y Humayun, su muerte en la India mientras viajaba a Gujarat y su entierro en Delhi."
  fr: "L'article de Wikipédia en arabe sur Khwandamir donne sa vie de 881 à 942 AH avec 1475 et 1534 dans son infobox, l'identifie comme le petit-fils de Mirkhvand de Rawzat as-safa, et relate son voyage de 932 AH, son approche de Babur et Humayun, sa mort en Inde lors d'un voyage au Gujarat et son enterrement à Delhi."
  ur: "خوندامیر پر عربی ویکیپیڈیا مضمون؛ اس نے اپنے معلوماتی خانے میں 1475 اور 1534 کے ساتھ ان کی زندگی 881-942 ہجری بتائی ہے، اس کی شناخت روضۃ الصفا کے میرخوند کے پوتے کے طور پر کی ہے، اور اس کا سفر 932 ہجری، بابر اور ہمایوں سے اس کا نقطہ نظر، گجرات کے سفر کے دوران ہندوستان میں اس کی موت، اور دہلی میں اس کی تدفین کو ریکارڈ کیا ہے۔"
  tr: "Arap Vikipedi makalesi, Khwand Mir hakkındaki hayatını 881–942 Hicri olarak ve kutusunu 1475'teki doğumunu ve 1534'teki ölümünü belirtir. O, 'Rawdat al-Safa'nın yazarı Mir Khwan'ın torunudur. Kitapta, 932 Hicri yılındaki yolculuğu, Babur Şah ve oğlu Humayun ile yakınlığı, Gujarat'a seyahat ederken Hindistan'da ölümü ve Delhi'de defnedilmesi anlatılır."
  id: "Artikel Wikipedia bahasa Arab tentang Khwand Mir menceritakan kehidupannya sebagai tahun 881–942 AH dan kotaknya sebagai kelahirannya pada tahun 1475 dan kematiannya pada tahun 1534. Ia adalah cucu dari Mir Khwan, penulis 'Rawdat al-Safa.' Artikel tersebut menyebutkan perjalanannya pada tahun 932 H, kedekatannya dengan Babur Shah dan putranya Humayun, serta kematiannya di India saat bepergian ke Gujarat dan pemakamannya di Delhi."
