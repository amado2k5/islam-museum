summary:
  ar: "مقالة ويكيبيديا الأردية «شيخ عبد المجيد سندي»؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 7 يوليو 1889 في تته في أسرة هندوسية، وقبوله الإسلام وهو في العشرين على يد عبد الرحيم الذي سماه عبد المجيد، وصحافته في الحق والوحيد، وسجنه لنشاطه في حركة الرسائل الحريرية وحركة الخلافة، ووفاته في 24 مايو 1978."
  en: "Urdu Wikipedia article 'Shaikh Abdul Majid Sindhi'; used for entity facts only. It gives his birth on 7 July 1889 at Thatta into a Hindu family, his acceptance of Islam at the age of twenty at the hands of Abdul Rahim, who named him Abdul Majid, his journalism at Al-Haq and Al-Waheed, his imprisonment for the Silk Letter Movement and a Khilafat speech, and his death on 24 May 1978."
