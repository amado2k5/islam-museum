summary:
  ar: "مقالة ويكيبيديا الأردية «شيخ عبد المجيد سندي»؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 7 يوليو 1889 في تته في أسرة هندوسية، وقبوله الإسلام وهو في العشرين على يد عبد الرحيم الذي سماه عبد المجيد، وصحافته في الحق والوحيد، وسجنه لنشاطه في حركة الرسائل الحريرية وحركة الخلافة، ووفاته في 24 مايو 1978."
  en: "Urdu Wikipedia article 'Shaikh Abdul Majid Sindhi'; used for entity facts only. It gives his birth on 7 July 1889 at Thatta into a Hindu family, his acceptance of Islam at the age of twenty at the hands of Abdul Rahim, who named him Abdul Majid, his journalism at Al-Haq and Al-Waheed, his imprisonment for the Silk Letter Movement and a Khilafat speech, and his death on 24 May 1978."
  es: "Artículo de Wikipedia en urdu titulado \"Shaikh Abdul Majid Sindhi\"; utilizado únicamente para datos sobre la persona. En él se indica su nacimiento el 7 de julio de 1889 en Thatta, en el seno de una familia hindú; su conversión al islam a los veinte años de manos de Abdul Rahim, quien le dio el nombre de Abdul Majid; su labor periodística en Al-Haq y Al-Waheed; su encarcelamiento por el Movimiento de la Carta de Seda y un discurso sobre el Califato; y su fallecimiento el 24 de mayo de 1978."
  fr: "L'article de Wikipédia en ourdou intitulé « Shaikh Abdul Majid Sindhi » (utilisé uniquement à des fins d'information sur l'entité) indique sa naissance le 7 juillet 1889 à Thatta, au sein d'une famille hindoue; sa conversion à l'islam à l'âge de vingt ans, initiée par Abdul Rahim qui lui donna le nom d'Abdul Majid; son travail de journaliste pour Al-Haq et Al-Waheed; son emprisonnement pour sa participation au Mouvement de la Lettre de Soie et un discours sur le Califat; et son décès le 24 mai 1978."
  ur: "اردو ویکیپیڈیا مضمون 'شیخ عبدالمجید سندھی'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 7 جولائی 1889 کو ٹھٹھہ میں ایک ہندو گھرانے میں ہوئی، بیس سال کی عمر میں عبدالرحیم کے ہاتھوں ان کا قبول اسلام، جس نے ان کا نام عبدالمجید رکھا، الحق اور الوحید میں ان کی صحافت، تحریک ریشم اور خلافت کی تقریر کے لیے قید، اور 24 مئی کو ان کی وفات ہوئی۔"
