reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 at its recorded revision via the MediaWiki API. Citing Dawn's Urdu service, the Pakistan Chronicle and a printed obituary register, it independently attests his birth into a Hindu family at Thatta, his birth name (given as Jetha Anand), and his acceptance of Islam at the hands of Abdul Rahim; it names no school or order, and its writer infobox has no religion field. It agrees with the English article on the birth date (7 July 1889) and the death date (24 May 1978)."
