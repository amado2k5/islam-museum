summary:
  ar: "مقالة ويكيبيديا الأردية «خان بہادر خان روہیلہ»؛ تُستخدم لوقائع الكيان فقط. تذكر أنه حفيد رحمة خان روهيلا، وأنه أقام حكومته في بريلي أثناء حرب الاستقلال سنة 1857، وفراره إلى نيبال وتسليمه للإنجليز، وإعدامه شنقًا في الكوتوالي في 24 فبراير 1860."
  en: "Urdu Wikipedia article 'Khan Bahadur Khan Rohilla'; used for entity facts only. It states that he was a grandson of Rahmat Khan Rohilla, that he set up his government in Bareilly during the 1857 war of independence, that he fled to Nepal and was handed over to the British, and that he was sentenced to death and hanged at the Kotwali on 24 February 1860."
  es: "Artículo de Wikipedia en urdu titulado «Khan Bahadur Khan Rohilla»; utilizado únicamente para datos biográficos. En él se afirma que era nieto de Rahmat Khan Rohilla, que estableció su gobierno en Bareilly durante la guerra de independencia de 1857, que huyó a Nepal y fue entregado a los británicos, y que fue condenado a muerte y ahorcado en el Kotwali el 24 de febrero de 1860."
  fr: "L'article de Wikipédia en ourdou intitulé « Khan Bahadur Khan Rohilla » est utilisé uniquement à titre informatif. Il indique qu'il était le petit-fils de Rahmat Khan Rohilla, qu'il établit son gouvernement à Bareilly pendant la guerre d'indépendance de 1857, qu'il s'enfuit au Népal où il fut livré aux Britanniques, et qu'il fut condamné à mort et pendu au Kotwali le 24 février 1860."
  ur: "اردو ویکیپیڈیا مضمون 'خان بہادر خان روہیلا'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں کہا گیا ہے کہ وہ رحمت خان روہیلا کا پوتا تھا، اس نے 1857 کی جنگ آزادی کے دوران بریلی میں اپنی حکومت قائم کی، وہ نیپال فرار ہو کر انگریزوں کے حوالے کر دیا گیا، اور اسے موت کی سزا سنائی گئی اور 24 فروری 1860 کو کوتوالی میں پھانسی دے دی گئی۔"
