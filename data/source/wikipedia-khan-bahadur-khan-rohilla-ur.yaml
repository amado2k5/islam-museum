  ar: "مقالة ويكيبيديا الأردية «خان بہادر خان روہیلہ»؛ تُستخدم لوقائع الكيان فقط. تذكر أنه حفيد رحمة خان روهيلا، وأنه أقام حكومته في بريلي أثناء حرب الاستقلال سنة 1857، وفراره إلى نيبال وتسليمه للإنجليز، وإعدامه شنقًا في الكوتوالي في 24 فبراير 1860."
  en: "Urdu Wikipedia article 'Khan Bahadur Khan Rohilla'; used for entity facts only. It states that he was a grandson of Rahmat Khan Rohilla, that he set up his government in Bareilly during the 1857 war of independence, that he fled to Nepal and was handed over to the British, and that he was sentenced to death and hanged at the Kotwali on 24 February 1860."
