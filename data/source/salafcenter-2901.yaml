summary:
  ar: "صفحة وردت في ملخص بحثي قُدِّم إلى المتحف واعتمده المؤسس في 21 نوفمبر 2026؛ لم تُفتح الصفحة، وأرقام الصفحات المذكورة هي ما في الملخص ولم يُتحقق منها. ناشرها: Salaf Center. يُستند إليها في: أوائل ترجمات القرآن: ترجمة سلمان الفارسي وروبرت الكيتوني وألكسندر روس؛ لماذا تسمى ترجمة القرآن تفسيراً: الزرقاني والشاطبي وابن تيمية وبكثال."
  en: "A page listed in a research summary supplied to the museum and approved by the founder on 21 November 2026; the page was not opened, and any page numbers are the summary's and unchecked. Publisher: Salaf Center. Used for: the first translations of the Qur'an: Salman al-Farisi, Robert of Ketton and Alexander Ross; why a translation of the Qur'an is called an interpretation: al-Zarqani, al-Shatibi, Ibn Taymiyya and Pickthall."
  ur: "ایک صفحہ جو عجائب گھر کو دیے گئے تحقیقی خلاصے میں مذکور ہے اور جسے بانی نے 21 نومبر 2026 کو منظور کیا؛ صفحہ کھولا نہیں گیا، اور صفحات کے نمبر خلاصے کے ہیں اور جانچے نہیں گئے۔ ناشر: Salaf Center۔ اس سے استناد ان امور کے لیے ہے: قرآن کے ابتدائی تراجم: سلمان فارسی، رابرٹ آف کیٹن اور الیگزینڈر راس؛ قرآن کے ترجمے کو تفسیر کیوں کہا جاتا ہے: زرقانی، شاطبی، ابن تیمیہ اور پکتھال۔"
  fr: "Page citée dans un résumé de recherche remis au musée et approuvé par le fondateur le 21 novembre 2026 ; la page n'a pas été ouverte, et les numéros de page sont ceux du résumé, non vérifiés. Éditeur : Salaf Center. Utilisée pour : les premières traductions du Coran : Salman al-Farisi, Robert de Ketton et Alexander Ross; pourquoi une traduction du Coran est dite interprétation : al-Zarqani, al-Shatibi, Ibn Taymiyya et Pickthall."
  es: "Página citada en un resumen de investigación entregado al museo y aprobado por el fundador el 21 de noviembre de 2026; la página no se abrió, y los números de página son los del resumen, sin comprobar. Editor: Salaf Center. Usada para: las primeras traducciones del Corán: Salman al-Farisi, Roberto de Ketton y Alexander Ross; por qué una traducción del Corán se llama interpretación: al-Zarqani, al-Shatibi, Ibn Taymiyya y Pickthall."
