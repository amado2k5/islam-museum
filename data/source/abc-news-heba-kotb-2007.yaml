summary:
  ar: "تغطية إيه بي سي نيوز ⁦(أبريل 2007)⁩ لهبة قطب بعنوان «دكتورة روث العالم المسلم»، تصفها بأنها مسلمة متدينة وتشرح طريقتها المستندة إلى سورة البقرة."
  en: "ABC News coverage (April 2007) of Heba Kotb, 'The Dr. Ruth of the Muslim World', describing her as a devout Muslim and explaining her method grounded in Surah al-Baqarah."
  es: "Cobertura de ABC News (abril de 2007) sobre Heba Kotb, 'La Dra. Ruth del mundo musulmán', describiéndola como una musulmana devota y explicando su método basado en la Sura al-Baqarah."
  fr: "Reportage d'ABC News (avril 2007) sur Heba Kotb, « la Dr Ruth du monde musulman », la décrivant comme une musulmane dévouée et expliquant sa méthode fondée sur la sourate al-Baqarah."
  ur: "اے بی سی نیوز کی کوریج ⁦(اپریل 2007)⁩ ہیبہ کوٹب، 'مسلم ورلڈ کی ڈاکٹر روتھ'، اسے ایک متقی مسلمان کے طور پر بیان کرتی ہے اور سورہ البقرہ میں اس کے طریقہ کار کی وضاحت کرتی ہے۔"
  tr: "ABC News'in Nisan 2007'de Heba Qutb üzerine yaptığı \"Müslüman Dünyasının Dr. Ruth\" başlıklı yayını, onu dindar bir Müslüman olarak tanımlar ve yöntemini Baqarah Suresi'ne dayanarak açıklar."
  id: "Liputan ABC News (April 2007) tentang Heba Qutb berjudul \"Dr. Ruth of the Muslim World,\" menggambarkannya sebagai Muslim yang taat dan menjelaskan metodenya berdasarkan Surah Al-Baqarah."
title: "'Have More Sex' Says Muslim 'Dr. Ruth'"
