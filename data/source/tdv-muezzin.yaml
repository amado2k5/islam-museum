label:
  ar: "المؤذّن — موسوعة TDV الإسلامية ⁦(كوتشوك آشجي)⁩"
  en: "MÜEZZİN (muezzin) — TDV İslâm Ansiklopedisi (Mustafa Sabri Küçükaşcı)"
summary:
  ar: "مدخل «مؤذّن» في موسوعة TDV الإسلامية: نشأة المؤذّن في المدينة، مؤذّنو العهد النبوي، مهام المؤذّنين من الأذان إلى الإعلان والتشريفات، أجورهم في الوقف والديوان، وتنظيمهم في الدولة العثمانية من مؤذّني الحرمين إلى مؤذّني السلاطين والجيش."
  en: "The TDV İslâm Ansiklopedisi entry on the muezzin: the office's beginnings at Medina, the muezzins of the Prophet's time, the muezzin's duties from the call to prayer to announcements and ceremonial, his pay from waqfs and the treasury, and his organisation under the Ottomans, from the muezzins of the two sanctuaries to the palace and army muezzins."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre el muecín: los inicios del cargo en Medina, los muecines de la época del Profeta, las funciones del muecín desde la llamada a la oración hasta los anuncios y las ceremonias, su remuneración procedente de los waqfs y el tesoro, y su organización bajo el dominio otomano, desde los muecines de los dos santuarios hasta los muecines del palacio y del ejército."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le muezzin: les débuts de cette fonction à Médine, les muezzins de l'époque du Prophète, les devoirs du muezzin, de l'appel à la prière aux annonces et aux cérémonies, sa rémunération provenant des waqfs et du trésor, et son organisation sous les Ottomans, des muezzins des deux sanctuaires aux muezzins du palais et de l'armée."
  ur: "مؤذن پر TDV İslâm Ansiklopedisi کا اندراج: مدینہ میں دفتر کا آغاز، پیغمبر کے زمانے کے مؤذن، مؤذن کے فرائض اذان سے لے کر اعلانات اور رسم و رواج تک، اس کی تنخواہ وقف اور خزانے سے، اور اس کی تنظیم، معترضین سے لے کر اوطاف تک۔ محل اور فوج کے مؤذن۔"
  tr: "TDV İslami Ansiklopedisi'nde \"Müeadhin\" hakkında bir giriş: Medine'de Müezzinlerin Ortaya Çıkışı, Peygamberlik Dönemi Müezzinleri, müezzinlerin görevleri, namaz çağrısından duyuru ve törenlere, vakıf ve diwanlardaki ücretleri ve Osmanlı devletindeki örgütlenmeleri, İki Kutsal Cami müezzinlerinden sultanların ve ordunun müezzinlerine kadar."
  id: "Entri tentang \"Mueadhin\" dalam Ensiklopedia Islam TDV: Kemunculan Muezzin di Madinah, Muezzin Era Kenabian, tugas muezzin mulai dari solat hingga pengumuman dan upacara, upah mereka dalam wakaf dan diwan, serta organisasi mereka di negara Ottoman mulai dari muezzin Dua Masjid Suci hingga muezzin sultan dan tentara."
