summary:
  ar: "مقالة ويكيبيديا الأردية عن صبغت اللہ مجددی؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. يعطي صدرها مولده في 21 أبريل 1926 ووفاته في 11 فبراير 2019، وتصفه بأنه قائد مسلم معتدل، وتصنّفه فئاتها في مسلمي أفغانستان السنة وصوفيتها."
  en: "Urdu Wikipedia article on Sibghatullah Mojaddedi; a stub used for entity facts only. Its lead gives his birth on 21 April 1926 and his death on 11 February 2019, and calls him a moderate Muslim leader; its categories file him under Afghan Sunni Muslims and Afghan Sufis (filings)."
  es: "Artículo de Wikipedia en urdu sobre Sibghatullah Mojaddedi; un esbozo utilizado únicamente para datos biográficos. Su introducción indica que nació el 21 de abril de 1926 y falleció el 11 de febrero de 2019, y lo describe como un líder musulmán moderado; sus categorías lo clasifican dentro de los musulmanes sunitas afganos y los sufíes afganos (archivos)."
  fr: "Article Wikipédia en ourdou sur Sibghatullah Mojaddedi; une ébauche servant uniquement à fournir des informations factuelles. Son introduction indique sa naissance le 21 avril 1926 et son décès le 11 février 2019, et le qualifie de chef musulman modéré; ses catégories le classent dans les catégories « Musulmans sunnites afghans » et « Soufis afghans »."
  ur: "صبغت اللہ مجددی پر اردو ویکیپیڈیا مضمون؛ ایک اسٹب جو صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ اس کی قیادت 21 اپریل 1926 کو اس کی پیدائش اور 11 فروری 2019 کو اس کی موت کا اعلان کرتی ہے، اور اسے ایک اعتدال پسند مسلم رہنما کہتا ہے۔ اس کے زمرے اسے افغان سنی مسلمان اور افغان صوفی ⁦(فائلنگ)⁩ کے تحت فائل کرتے ہیں۔"
  tr: "Sabghatullah Mujaddidi hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılan kısa bir makale. Doğum tarihini 21 Nisan 1926 ve ölümünü 11 Şubat 2019'da vererek, grupları tarafından Afganistan'daki Sünni Müslümanlar ve Sufiler arasında sınıflandırılan ılımlı bir Müslüman lider olarak tanımlıyor."
  id: "Artikel Wikipedia Urdu tentang Sabghatullah Mujaddidi; artikel pendek yang hanya digunakan untuk fakta entitas tersebut. Artikel tersebut mencantumkan tanggal lahirnya pada 21 April 1926, dan kematiannya pada 11 Februari 2019, menggambarkannya sebagai pemimpin Muslim moderat, diklasifikasikan berdasarkan kelompoknya di antara Muslim Sunni dan Sufi Afghanistan."
