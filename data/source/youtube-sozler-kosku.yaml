summary:
  ar: "قناة «سوزلر كوشكو» التركية على يوتيوب (@sozlerkosku)، قناة جمعية سوزلر كوشكو للعلم والثقافة؛ تسمّي أوصاف مقاطعها فاتح ياغجي جهةَ الاتصال والوجه العلني للجمعية، وهي القناة الأم التي انبثقت عنها قناة «نحو الأبدية» الإنجليزية."
  en: "The Turkish YouTube channel Sözler Köşkü (@sozlerkosku), the channel of the Sözler Köşkü Science and Culture Association; its video descriptions name Fatih Yağcı as the association's contact and public face, and it is the parent channel from which the English Towards Eternity channel grew."
  es: "El canal turco de YouTube Sözler Köşkü (@sozlerkosku), canal de la Asociación de Ciencia y Cultura Sözler Köşkü, menciona en las descripciones de sus vídeos a Fatih Yağcı como persona de contacto y rostro público de la asociación, y es el canal principal del que surgió el canal en inglés Towards Eternity."
  fr: "La chaîne YouTube turque Sözler Köşkü (@sozlerkosku), la chaîne de l'association scientifique et culturelle Sözler Köşkü; ses descriptions de vidéos nomment Fatih Yağcı comme le contact et le visage public de l'association, et c'est la chaîne mère à partir de laquelle la chaîne anglaise Towards Eternity s'est développée."
  ur: "ترکی کا یوٹیوب چینل Sözler Köşkü (@sozlerkosku)، Sözler Köşkü سائنس اور ثقافت ایسوسی ایشن کا چینل؛ اس کی ویڈیو کی تفصیل Fatih Yağcı کو ایسوسی ایشن کے رابطے اور عوامی چہرے کے طور پر بتاتی ہے، اور یہ وہ بنیادی چینل ہے جہاں سے انگلش Towards Eternity چینل پروان چڑھا ہے۔"
