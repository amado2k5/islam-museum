  ar: "قناة «سوزلر كوشكو» التركية على يوتيوب (@sozlerkosku)، قناة جمعية سوزلر كوشكو للعلم والثقافة؛ تسمّي أوصاف مقاطعها فاتح ياغجي جهةَ الاتصال والوجه العلني للجمعية، وهي القناة الأم التي انبثقت عنها قناة «نحو الأبدية» الإنجليزية."
