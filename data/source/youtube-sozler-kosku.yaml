reliability_note: "The association's own channel: a primary source for its identity and leadership presentation, not independent corroboration (founder's sourcing ladder, 24 Oct 2026). Its video descriptions give the association's name as 'Sözler Köşkü İlim ve Kültür Derneği' (Sözler Köşkü Science and Culture Association) and repeatedly carry the line 'Fatih Yağcı'ya Buradan Ulaş' — 'reach Fatih Yağcı here' — with his personal Instagram account, presenting him as the channel's public contact; its own history video states the channel began thirteen years before 2024 with a few young men asking how to come closer to the youth. The channel's own figures for the Turkish channel (over 3.6 million subscribers) are dated platform figures. Checked 26 October 2026."
