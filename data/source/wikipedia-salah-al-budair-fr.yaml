  ar: "مقالة ويكيبيديا الفرنسية عن صلاح البدير؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 7 يناير 1970 بالهفوف محوّلة التاريخ إلى 1389هـ، وإقامته بالمدينة، وإمامته للمسجد النبوي من 1419هـ (1998–99)، وقضاءه، وماجستيره (1994) ودكتوراه (2023)؛ وصندوقها لا يسمي ديناً ولا مذهباً."
  en: "French Wikipedia article on Salah Al-Budair; used for entity facts only. It gives his birth on 7 January 1970 at Al-Hufuf, converting the date to 1389 AH, his domicile at Medina, his imamate of the Prophet's Mosque from 1419 AH (1998–99), his judgeship, and his master's (1994) and doctorate (2023); its infobox names no religion or school."
