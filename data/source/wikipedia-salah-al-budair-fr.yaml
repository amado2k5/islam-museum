summary:
  ar: "مقالة ويكيبيديا الفرنسية عن صلاح البدير؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 7 يناير 1970 بالهفوف محوّلة التاريخ إلى 1389هـ، وإقامته بالمدينة، وإمامته للمسجد النبوي من 1419هـ (1998–99)، وقضاءه، وماجستيره (1994) ودكتوراه (2023)؛ وصندوقها لا يسمي ديناً ولا مذهباً."
  en: "French Wikipedia article on Salah Al-Budair; used for entity facts only. It gives his birth on 7 January 1970 at Al-Hufuf, converting the date to 1389 AH, his domicile at Medina, his imamate of the Prophet's Mosque from 1419 AH (1998–99), his judgeship, and his master's (1994) and doctorate (2023); its infobox names no religion or school."
  es: "Artículo de la Wikipedia en francés sobre Salah Al-Budair; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 7 de enero de 1970 en Al-Hufuf, fecha que corresponde al año 1389 de la Hégira, su domicilio en Medina, su imamato de la Mezquita del Profeta desde el año 1419 de la Hégira (1998-1999), su nombramiento como juez y sus títulos de máster (1994) y doctorado (2023); su ficha informativa no menciona ninguna religión ni escuela."
  fr: "Article de Wikipédia en français sur Salah Al-Budair; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 7 janvier 1970 à Al-Hufuf, ce qui correspond à l'année 1389 de l'Hégire, son domicile à Médine, son imamat de la Mosquée du Prophète à partir de 1419 de l'Hégire (1998-1999), sa fonction de juge, ainsi que sa maîtrise (1994) et son doctorat (2023); son infobox ne mentionne ni religion ni école."
  ur: "صلاح البدیر پر فرانسیسی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 7 جنوری 1970 کو الحفوف میں ان کی ولادت، تاریخ کو 1389 ہجری میں تبدیل کرتی ہے، مدینہ میں ان کا مقیم، 1419 ہجری (1998-99) تک مسجد نبوی کی امامت، ان کا قاضی اور ماسٹر (1994) اور ڈاکٹریٹ (2023)؛ اس کے انفو باکس میں کسی مذہب یا اسکول کا نام نہیں ہے۔"
  tr: "Salah Al-Badair hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 7 Ocak 1970'te Al-Hofuf'ta doğduğu belirtilir, bu da tarihi 1389 Hicri olarak değiştirir, Medine'deki ikametgahı, 1419 Hicri (1998–99) Peygamber Camii imamı, yargısı, yüksek lisans derecesi (1994) ve doktora (2023) olarak adlandırılır; fonu din veya mezhep olarak belirtilmez."
  id: "Artikel Wikipedia Prancis tentang Salah Al-Badair; digunakan hanya untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya pada 7 Januari 1970 di Al-Hofuf, yang mengubah tanggal menjadi 1389 H, kediamannya di Madinah, imam Masjid Nabi dari 1419 H. (1998–99), kehakimannya, gelar magister (1994), dan gelar doktornya (2023); dana tersebut tidak menyebutkan agama atau sekte."
