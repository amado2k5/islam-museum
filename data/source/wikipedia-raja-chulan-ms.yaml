summary:
  ar: "مقالة ويكيبيديا الملايوية عن راجا تشولان بن السلطان عبد الله محمد شاه الثاني؛ تُستخدم لوقائع الكيان فقط. تذكر ولايته «راجا دي هيلير بيراك» من 1919 إلى وفاته في 10 نيسان 1933، وتنصيبه في 1 كانون الأول 1920، ووفاته في كوالا كانغسار ودفنه في 11 نيسان 1933 في المقبرة الملكية في بوكيت تشاندان؛ ويعطي صندوق معلوماتها دينه «الإسلام» إجمالًا دون مذهب."
  en: "Malay Wikipedia article on Raja Chulan ibni Sultan Abdullah Muhammad Shah II; used for entity facts only. It gives his tenure as Raja Di-Hilir Perak from 1919 until his death on 10 April 1933, his installation on 1 December 1920, his death at Rumah Kelsumah, Kuala Kangsar, and his burial on 11 April 1933 in the Bukit Chandan royal mausoleum at Kuala Kangsar; its infobox gives his religion as Islam in general, with no school."
  es: "Artículo de Wikipedia en malayo sobre Raja Chulan ibni Sultan Abdullah Muhammad Shah II; utilizado únicamente para datos sobre la persona. Describe su mandato como Raja Di-Hilir Perak desde 1919 hasta su muerte el 10 de abril de 1933, su investidura el 1 de diciembre de 1920, su fallecimiento en Rumah Kelsumah, Kuala Kangsar, y su entierro el 11 de abril de 1933 en el mausoleo real de Bukit Chandan en Kuala Kangsar; su ficha informativa indica que profesaba el Islam en general, sin mencionar ninguna escuela."
  fr: "Article de Wikipédia en malais sur Raja Chulan ibni Sultan Abdullah Muhammad Shah II; utilisé uniquement pour les informations sur l'entité. Il retrace son règne en tant que Raja Di-Hilir Perak de 1919 jusqu'à sa mort le 10 avril 1933, son intronisation le 1er décembre 1920, son décès à Rumah Kelsumah, Kuala Kangsar, et son inhumation le 11 avril 1933 au mausolée royal de Bukit Chandan à Kuala Kangsar; son infobox indique qu'il était de confession musulmane, sans mention d'école religieuse."
  ur: "راجہ چولان ابنی سلطان عبداللہ محمد شاہ ثانی پر مالائی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1919 سے لے کر 10 اپریل 1933 کو ان کی موت تک راجہ دی ہلیر پراک کے طور پر ان کی مدت ملازمت، 1 دسمبر 1920 کو ان کی تنصیب، رومہ کلسومہ، کوالا کانگسار میں ان کی موت، اور 11 اپریل 1933 کو کوالا کانگسار میں بکیت چندن شاہی مقبرہ میں ان کی تدفین؛ اس کا انفو باکس اس کا مذہب عام طور پر اسلام کے طور پر دیتا ہے، جس میں کوئی اسکول نہیں ہے۔"
  tr: "Raja Chulan bin Sultan Abdullah Muhammad Shah II hakkındaki Malay Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Valiliği, 1919'dan ölümüne kadar (10 Nisan 1933), 1 Aralık 1920'deki yemin töreni, Kuala Kangsar'daki ölümü ve 11 Nisan 1933'te Bukit Chandan'daki Kraliyet Mezarlığı'na defnedilmesi ile 'Raja de Hilaire Perak' olarak anılmaktadır; bilgi kutusunda dini genel olarak 'İslam' olarak verilmiştir, ancak herhangi bir mezhep yoktur."
  id: "Artikel Wikipedia Bahasa Melayu tentang Raja Chulan bin Sultan Abdullah Muhammad Shah II; digunakan hanya untuk fakta entitas tersebut. Masa jabatannya disebut sebagai 'Raja de Hilaire Perak' dari tahun 1919 hingga wafatnya pada 10 April 1933, pelantikannya pada 1 Desember 1920, kematiannya di Kuala Kangsar, dan pemakamannya pada 11 April 1933 di Pemakaman Kerajaan di Bukit Chandan; infobox tersebut mencantumkan agamanya sebagai 'Islam' secara umum tanpa sekte apa pun."
