summary:
  ar: "مقالة ويكيبيديا الملايوية عن راجا تشولان بن السلطان عبد الله محمد شاه الثاني؛ تُستخدم لوقائع الكيان فقط. تذكر ولايته «راجا دي هيلير بيراك» من 1919 إلى وفاته في 10 نيسان 1933، وتنصيبه في 1 كانون الأول 1920، ووفاته في كوالا كانغسار ودفنه في 11 نيسان 1933 في المقبرة الملكية في بوكيت تشاندان؛ ويعطي صندوق معلوماتها دينه «الإسلام» إجمالًا دون مذهب."
  en: "Malay Wikipedia article on Raja Chulan ibni Sultan Abdullah Muhammad Shah II; used for entity facts only. It gives his tenure as Raja Di-Hilir Perak from 1919 until his death on 10 April 1933, his installation on 1 December 1920, his death at Rumah Kelsumah, Kuala Kangsar, and his burial on 11 April 1933 in the Bukit Chandan royal mausoleum at Kuala Kangsar; its infobox gives his religion as Islam in general, with no school."
