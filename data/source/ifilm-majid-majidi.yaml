summary:
  ar: "صفحة شبكة آي فيلم عن مجيد مجيدي؛ تذكر ميلاده في 17 أبريل 1959 في طهران، وبدايته ممثلًا هاويًا في الرابعة عشرة، ودراسته في جامعة الفنون، وأفلامه من «بادوك» إلى «أطفال الجنة» و«لون الجنة» و«باران» وجوائزه الدولية."
  en: "iFilm network profile of Majid Majidi; it gives his birth as 17 April 1959 in Tehran, his start in amateur theatre at 14, his graduation from the Art University in dramatic arts, his acting in Justification, Two Sightless Eyes and Boycott, and his films from Baduk to Children of Heaven, The Color of Heaven and Baran, with his international awards."
  es: "Perfil de Majid Majidi en la red iFilm; en él se indica que nació el 17 de abril de 1959 en Teherán, que comenzó en el teatro amateur a los 14 años, que se graduó en artes dramáticas en la Universidad de Arte, que actuó en Justificación, Dos ojos ciegos y Boicot, y que sus películas van desde Baduk hasta Los hijos del cielo, El color del cielo y Baran, con sus premios internacionales."
  fr: "Profil de Majid Majidi sur le réseau iFilm; il indique sa naissance le 17 avril 1959 à Téhéran, ses débuts au théâtre amateur à 14 ans, son diplôme de l’Université des Beaux-Arts en arts dramatiques, ses rôles dans Justification, Two Sightless Eyes et Boycott, et ses films allant de Baduk à Children of Heaven, The Color of Heaven et Baran, avec ses récompenses internationales."
  ur: "مجید مجیدی کا iFilm نیٹ ورک پروفائل؛ اس کی پیدائش 17 اپریل 1959 کو تہران میں ہوئی، 14 سال کی عمر میں شوقیہ تھیٹر میں اس کا آغاز، ڈرامائی فنون میں آرٹ یونیورسٹی سے اس کی گریجویشن، جواز میں ان کی اداکاری، ٹو سائیٹ لیس آئیز اور بائیکاٹ، اور اس کی فلمیں بدوک سے چلڈرن آف ہیوین، دی کلر آف ہیوین اور باران کو بین الاقوامی ایوارڈز سے نوازا گیا۔"
  tr: "Majid Majidi hakkında iFilm Network sayfası; 17 Nisan 1959'da Tahran'da doğduğunu, on dört yaşında amatör oyunculuğa başlamasını, Sanat Üniversitesi'ndeki eğitimini ve 'Paddock'tan 'Children of Paradise', 'The Color of Paradise', 'Baran'a kadar olan filmlerini ve uluslararası ödüllerini belirtiyor."
  id: "halaman iFilm Network tentang Majid Majidi; halaman ini menyebutkan kelahirannya pada 17 April 1959 di Teheran, memulai kariernya sebagai aktor amatir pada usia empat belas tahun, studinya di University of Arts, serta film-filmnya mulai dari 'Paddock' hingga 'Children of Paradise,' 'The Color of Paradise,' 'Baran,' dan penghargaan internasionalnya."
