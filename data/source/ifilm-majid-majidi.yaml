  ar: "صفحة شبكة آي فيلم عن مجيد مجيدي؛ تذكر ميلاده في 17 أبريل 1959 في طهران، وبدايته ممثلًا هاويًا في الرابعة عشرة، ودراسته في جامعة الفنون، وأفلامه من «بادوك» إلى «أطفال الجنة» و«لون الجنة» و«باران» وجوائزه الدولية."
  en: "iFilm network profile of Majid Majidi; it gives his birth as 17 April 1959 in Tehran, his start in amateur theatre at 14, his graduation from the Art University in dramatic arts, his acting in Justification, Two Sightless Eyes and Boycott, and his films from Baduk to Children of Heaven, The Color of Heaven and Baran, with his international awards."
