summary:
  ar: "مقالة ويكيبيديا الأردية عن مصطفى إسماعيل؛ تُستخدم لوقائع الكيان فقط. سيرة موجزة: مولده في 17 يونيو 1905 قرب طنطا، وأساتذته أبو العينين وعبد الله وإدريس فاخر، وتلاوات رمضان للملك فاروق من 1944، وتعيينه قارئا للأزهر سنة 1947، وجائزة عبد الناصر سنة 1965، وتلاوته بالمسجد الأقصى سنة 1977، ووفاته في 26 ديسمبر 1978."
  en: "Urdu Wikipedia article on Mustafa Ismail; used for entity facts only. A short biography: his birth on 17 June 1905 near Tanta, his teachers Abu al-Aynayn, Abdullah and Idris Fakhir, the Ramadan recitations for King Farouk from 1944, his appointment as Al-Azhar reciter in 1947, Nasser's 1965 award, his recitation at Al-Aqsa Mosque in 1977, and his death on 26 December 1978."
