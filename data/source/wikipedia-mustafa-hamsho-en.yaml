summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى حمشو؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 10 أكتوبر 1953 في اللاذقية بسوريا، ومسيرته من 1975 إلى 1989 بسجل 44 فوزاً و5 خسارات وتعادلين، ونزاليه على لقب الوزن المتوسط العالمي أمام مارفلوس مارفن هاغلر في 1981 و1984."
  en: "English Wikipedia article on Mustafa Hamsho; used for entity facts only. It gives his birth on 10 October 1953 in Latakia, Syria, his career from 1975 to 1989 with a record of 44 wins, 5 losses and 2 draws, and his two challenges for the world middleweight title against Marvin Hagler in 1981 and 1984."
  es: "Artículo de la Wikipedia en inglés sobre Mustafa Hamsho; utilizado únicamente para datos biográficos. Indica que nació el 10 de octubre de 1953 en Latakia, Siria, su carrera desde 1975 hasta 1989 con un récord de 44 victorias, 5 derrotas y 2 empates, y sus dos intentos por el título mundial de peso mediano contra Marvin Hagler en 1981 y 1984."
  fr: "Article de Wikipédia en anglais sur Mustafa Hamsho; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 10 octobre 1953 à Lattaquié, en Syrie, sa carrière de 1975 à 1989 avec un palmarès de 44 victoires, 5 défaites et 2 nuls, et ses deux combats pour le titre mondial des poids moyens contre Marvin Hagler en 1981 et 1984."
  ur: "مصطفیٰ ہمشو پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 10 اکتوبر 1953 کو لاطاکیہ، شام میں ہوئی، اس کا کیریئر 1975 سے 1989 تک 44 جیت، 5 ہار اور 2 ڈرا کے ریکارڈ کے ساتھ، اور 1981 اور 1984 میں مارون ہیگلر کے خلاف ورلڈ مڈل ویٹ ٹائٹل کے لیے اس کے دو چیلنجز۔"
