  ar: "مقالة ويكيبيديا الإنجليزية عن السلطان محمود شاه (ت. 1528)، ثامن سلاطين ملقا وآخرهم؛ ابن السلطان علاء الدين رعاية شاه، نُصّب صغيرًا فحكم 1488–1511، ثم فرّ عند سقوط ملقا بيد البرتغاليين سنة 1511 إلى بنتن وقاد اتحادًا ملايويًا مسلمًا ضد ملقا المحتلة، وفرّ إلى كمبار برياو حيث مات سنة 1528."
  en: "English Wikipedia article on Sultan Mahmud Shah (d. 1528), eighth and last sultan of Malacca; son of Sultan Alauddin Riayat Shah, installed young and reigned 1488–1511, fled the Portuguese capture of Malacca in 1511 to Bintan, led a Malay Muslim confederacy against the occupied city, and died at Kampar in Riau in 1528."
