reliability_note: "Read in full (article text and wikitext) on 1 November 2026. The narrative rests on Cœdès (1968) and the Malay Annals tradition. The infobox gives no birth date or birth place at all, and its father field names Alauddin Riayat Shah of Malacca; its religion field carries 'Sunni Islam', an unsourced structured value with no discussion of his religion anywhere in the article's prose, so it is one structured attestation and settles nothing by itself. The article states he was installed at a very young age on his father's death, which is inconsistent with the stray birth year of 1400 carried by his Wikidata item. His sons Ahmad Shah, Muzaffar Shah I of Perak and Alauddin Riayat Shah II of Johor are named, none of whom has a record in the museum."
