summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن السلطان محمود شاه ⁦(ت. 1528)⁩، ثامن سلاطين ملقا وآخرهم؛ ابن السلطان علاء الدين رعاية شاه، نُصّب صغيرًا فحكم 1488–1511، ثم فرّ عند سقوط ملقا بيد البرتغاليين سنة 1511 إلى بنتن وقاد اتحادًا ملايويًا مسلمًا ضد ملقا المحتلة، وفرّ إلى كمبار برياو حيث مات سنة 1528."
  en: "English Wikipedia article on Sultan Mahmud Shah (d. 1528), eighth and last sultan of Malacca; son of Sultan Alauddin Riayat Shah, installed young and reigned 1488–1511, fled the Portuguese capture of Malacca in 1511 to Bintan, led a Malay Muslim confederacy against the occupied city, and died at Kampar in Riau in 1528."
  es: "Artículo de la Wikipedia en inglés sobre el sultán Mahmud Shah (fallecido en 1528), octavo y último sultán de Malaca; hijo del sultán Alauddin Riayat Shah, fue coronado joven y reinó entre 1488 y 1511. Huyó de la toma de Malaca portuguesa en 1511 a Bintan, lideró una confederación musulmana malaya contra la ciudad ocupada y murió en Kampar, en Riau, en 1528."
  fr: "Article de Wikipédia en anglais sur le sultan Mahmud Shah (décédé en 1528), huitième et dernier sultan de Malacca; fils du sultan Alauddin Riayat Shah, installé jeune et régnant de 1488 à 1511, s'enfuit de la capture de Malacca par les Portugais en 1511 à Bintan, mena une confédération musulmane malaise contre la ville occupée et mourut à Kampar à Riau en 1528."
  ur: "ملاکا کے آٹھویں اور آخری سلطان سلطان محمود شاہ ⁦(متوفی 1528)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ سلطان علاؤالدین کا بیٹا ریاض شاہ، جو جوان ہوا اور 1488-1511 میں حکومت کیا، 1511 میں ملاکا پر پرتگالی قبضے سے بھاگ کر بنتن میں چلا گیا، مقبوضہ شہر کے خلاف ملائی مسلم کنفیڈریسی کی قیادت کی، اور 1528 میں ریاؤ کے کمپار میں انتقال کر گیا۔"
  tr: "Sultan Mahmud Şah (ö. 1528), Malakka'nın sekizinci ve son Sultanı, Sultan Alauddin Ra'iyat Shah'ın oğlu hakkında İngilizce Wikipedia makalesi, 1488'den 1511'e kadar hüküm süren küçük bir suikastçıydı. Daha sonra Malakka 1511'de Portekizlilerin eline geçtiğinde Benten'e kaçtı, işgal altındaki Malakka'ya karşı bir Malay Müslüman federasyonu yönetti ve Kempar Briao'ya sığındı; burada 1528'de öldü."
  id: "Artikel Wikipedia bahasa Inggris tentang Sultan Mahmud Shah (wafat 1528), Sultan Malaka kedelapan dan terakhir, putra Sultan Alauddin Ra'iyat Shah, adalah seorang pembunuh bayaran kecil yang memerintah dari tahun 1488 hingga 1511. Ia kemudian melarikan diri ke Benten ketika Malaka jatuh ke tangan Portugis pada tahun 1511, memimpin federasi Muslim Melayu melawan Melaka yang diduduki, dan melarikan diri ke Kempar Briao, tempat ia meninggal pada tahun 1528."
