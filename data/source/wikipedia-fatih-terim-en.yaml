reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Terim as born on 4 September 1953 in Adana to Nuriye and Talat Terim (his father a Turkish Cypriot who emigrated to Turkey); his playing career at Adana Demirspor and Galatasaray (1974–1985, 51 caps for Turkey); and his managerial career — four Galatasaray spells with eight Süper Lig titles and the 2000 UEFA Cup, Fiorentina and AC Milan in 2000–2001, three spells with Turkey including the Euro 2008 semi-final, Panathinaikos and Al Shabab. It makes no statement of his religion anywhere in its text."
