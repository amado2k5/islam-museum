  ar: "مقالة ويكيبيديا الإنجليزية عن فاتح تريم؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته لاعبًا مع غلطة سراي ثم أنجح مدرب في تاريخه (أربعة ألقاب متتالية وكأس الاتحاد الأوروبي 2000)، وفترتيه في إيطاليا مع فيورنتينا وميلان، وقيادته تركيا إلى نصف نهائي يورو 2008."
  en: "English Wikipedia article on Fatih Terim; used for entity facts only. It recounts his playing years at Galatasaray and his record as the club's most successful manager (four straight league titles and the 2000 UEFA Cup), his Italian spells at Fiorentina and Milan, and his leadership of Turkey to the Euro 2008 semi-finals."
