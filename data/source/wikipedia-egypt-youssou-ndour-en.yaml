summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألبوم «مصر» ليوسو ندور مع أوركسترا فتحي سلامة؛ لوقائع الكيان فقط: التسجيل في داكار والقاهرة، وتأجيل الإصدار إلى 8 يونيو 2004، والموضوعات، والاستقبال النقدي، والجدل في السنغال ومصر، وجائزة غرامي، والمراتب في القوائم."
  en: "English Wikipedia article on Youssou N'Dour's album Egypt with the Fathy Salama Orchestra; entity facts only: recording in Dakar and Cairo, the delay of the release to 8 June 2004, its subjects, the critical reception, the controversy in Senegal and Egypt, the Grammy and the chart positions; it cites the Village Voice, Reuters, the BBC, The Observer, NPR, The Guardian, Popular Music and the Associated Press."
  es: "Artículo de la Wikipedia en inglés sobre el álbum Egypt de Youssou N'Dour con la orquesta de Fathy Salama; solo datos sobre la entidad: grabación en Dakar y El Cairo, retraso del lanzamiento hasta el 8 de junio de 2004, sus temas, recepción de la crítica, la controversia en Senegal y Egipto, el premio Grammy y las posiciones en las listas; cita a Village Voice, Reuters, la BBC, The Observer, NPR, The Guardian, Popular Music y Associated Press."
  fr: "Article de Wikipédia en anglais sur l'album Egypt de Youssou N'Dour avec l'orchestre Fathy Salama; informations factuelles uniquement: enregistrement à Dakar et au Caire, report de la sortie au 8 juin 2004, thèmes abordés, accueil critique, controverse au Sénégal et en Égypte, Grammy et classement dans les charts; cite le Village Voice, Reuters, la BBC, The Observer, NPR, The Guardian, Popular Music et l'Associated Press."
  ur: "Fathy Salama آرکسٹرا کے ساتھ Youssou N'Dour کے البم مصر پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: ڈاکار اور قاہرہ میں ریکارڈنگ، 8 جون 2004 تک ریلیز میں تاخیر، اس کے مضامین، تنقیدی استقبال، سینیگال اور مصر میں تنازعہ، گریمی اور چارٹ پوزیشنز؛ اس میں ولیج وائس، رائٹرز، بی بی سی، دی آبزرور، این پی آر، دی گارڈین، پاپولر میوزک اور ایسوسی ایٹڈ پریس کا حوالہ دیا گیا ہے۔"
