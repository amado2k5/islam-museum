summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بورتشين موتلو باكديل؛ تُستخدم لوقائع الكيان فقط. تذكر تعليمها في بيلكنت (2009) وتكساس تك (2012) ومينيسوتا (دكتوراه 2017)، واكتشافها المجرة ذات الحلقتين PGC 1000714 الملقبة «مجرة بورتشين»، ومنصبها في دارتموث منذ 2022. وتصفها بأنها «مناضلة من أجل تمثيل أكبر للنساء المسلمات في العلوم» — صياغة دعوية لا تنسب إليها دينا شخصيا. لا يذكر المقال تاريخ مولدها."
  en: "English Wikipedia article on Burçin Mutlu-Pakdil; used for entity facts only. It covers her education at Bilkent (2009), Texas Tech (2012) and Minnesota (PhD 2017), her discovery of the double-ringed galaxy PGC 1000714 ('Burçin's Galaxy'), and her Dartmouth post from 2022. It calls her 'a campaigner for the increased representation of Muslim women in science' — an advocacy framing, not a statement of her own affiliation. The article gives no birth date."
