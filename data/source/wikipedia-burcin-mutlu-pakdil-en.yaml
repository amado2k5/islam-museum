summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بورتشين موتلو باكديل؛ تُستخدم لوقائع الكيان فقط. تذكر تعليمها في بيلكنت (2009) وتكساس تك (2012) ومينيسوتا ⁦(دكتوراه 2017)⁩، واكتشافها المجرة ذات الحلقتين PGC 1000714 الملقبة «مجرة بورتشين»، ومنصبها في دارتموث منذ 2022. وتصفها بأنها «مناضلة من أجل تمثيل أكبر للنساء المسلمات في العلوم» — صياغة دعوية لا تنسب إليها دينا شخصيا. لا يذكر المقال تاريخ مولدها."
  en: "English Wikipedia article on Burçin Mutlu-Pakdil; used for entity facts only. It covers her education at Bilkent (2009), Texas Tech (2012) and Minnesota (PhD 2017), her discovery of the double-ringed galaxy PGC 1000714 ('Burçin's Galaxy'), and her Dartmouth post from 2022. It calls her 'a campaigner for the increased representation of Muslim women in science' — an advocacy framing, not a statement of her own affiliation. The article gives no birth date."
  es: "Artículo de Wikipedia en inglés sobre Burçin Mutlu-Pakdil; utilizado únicamente para datos sobre la persona. Cubre su formación académica en Bilkent (2009), Texas Tech (2012) y Minnesota (doctorado en 2017), su descubrimiento de la galaxia de doble anillo PGC 1000714 («Galaxia de Burçin») y su puesto en Dartmouth desde 2022. La describe como «una activista por una mayor representación de las mujeres musulmanas en la ciencia», un enfoque de defensa, no una declaración sobre su propia afiliación. El artículo no proporciona su fecha de nacimiento."
  fr: "Article Wikipédia en anglais sur Burçin Mutlu-Pakdil; utilisé uniquement pour des informations factuelles. Il relate ses études à Bilkent (2009), Texas Tech (2012) et Minnesota (doctorat en 2017), sa découverte de la galaxie à double anneau PGC 1000714 (« galaxie de Burçin ») et son poste à Dartmouth à partir de 2022. L’article la décrit comme « une militante pour une meilleure représentation des femmes musulmanes en sciences » – une formulation militante, et non une affirmation de son appartenance religieuse. L’article ne mentionne pas sa date de naissance."
  ur: "Burçin Mutlu-Pakdil پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بلکینٹ (2009)، ٹیکساس ٹیک (2012) اور مینیسوٹا ⁦(پی ایچ ڈی 2017)⁩، اس کی ڈبل رنگ والی کہکشاں PGC 1000714 ('Burçin's Galaxy') کی دریافت، اور 2022 سے اس کی Dartmouth پوسٹ کا احاطہ کیا گیا ہے۔ وکالت کی تشکیل، اس کی اپنی وابستگی کا بیان نہیں۔ مضمون میں کوئی تاریخ پیدائش نہیں ہے۔"
  tr: "Porchin Motlow Buckdale hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılmıştır. Bilkin (2009), Texas Tech (2012) ve Minnesota'daki (PhD 2017) eğitimi, \"Porchin Galaksisi\" lakabıyla anılan iki halkalı galaksi PGC'yi keşfi 1000714 ve 2022'den beri Dartmouth'taki pozisyonu bahsedilmektedir. Onu \"bilimde Müslüman kadınların daha fazla temsil edilmesi için bir aktivist\" olarak tanımlar — bu misyonerlik ifadesi ona kişisel bir din atfetmez. Makalede doğum tarihi belirtilmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Porchin Motlow Buckdale; hanya digunakan untuk fakta entitas. Artikel tersebut menyebutkan pendidikannya di Bilkin (2009), Texas Tech (2012), dan Minnesota (PhD 2017), penemuannya tentang galaksi dua cincin PGC 1000714 dijuluki \"Galaksi Porchin,\" dan posisinya di Dartmouth sejak 2022. Dia menggambarkannya sebagai \"aktivis untuk representasi yang lebih besar dari perempuan Muslim dalam ilmu pengetahuan\" — sebuah frasa misionaris yang tidak mengaitkan agama pribadi kepadanya. Artikel tersebut tidak menyebutkan tanggal lahirnya."
