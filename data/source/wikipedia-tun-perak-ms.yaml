reliability_note: "Read in full (wikitext) on 1 November 2026. Its lead names him 'Tun Perak bin Tun Perpatih Sedang' and calls him the son of Bendahara Seri Wak Raja, agreeing with the genealogy the English Muzaffar Shah article reports, against the English Tun Perak article's 'Tun Perpatih Besar' phrasing; both are preserved in the record. The infobox's birth year 1426 and religion value 'Islam' are unsourced structured data: the birth year is attested nowhere else (the queue's 1410 likewise) and is not adopted, and the generic religion value names no school, so it settles nothing. Death in 1498 is shared with the English edition and Wikidata."
