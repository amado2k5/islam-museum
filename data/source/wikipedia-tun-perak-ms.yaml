summary:
  ar: "مقالة ويكيبيديا الملايوية عن تون بيراك ⁦(ت. 1498)⁩، بنداهارا ملقا الخامس؛ تنسبه إلى أبيه تون برباتيه سدانغ، بنداهارا سري واك راجا، وتذكر تعيينه حاكمًا على كلاغ سنة 1445 وردّه محاولة سيام غزو ملقا سنة 1446، ويحمل صندوق معلوماتها ميلاد سنة 1426 ودينًا هو الإسلام دون مصدر."
  en: "Malay Wikipedia article on Tun Perak (d. 1498), fifth bendahara of Malacca; it makes him the son of Tun Perpatih Sedang, the Bendahara Seri Wak Raja, records his appointment as chieftain of Klang in 1445 and his repulse of the Siamese attempt on Malacca in 1446, and its infobox carries an unsourced birth year of 1426 and a religion value of Islam."
  es: "Artículo de Wikipedia en malayo sobre Tun Perak (fallecido en 1498), quinto bendahara de Malaca; lo presenta como hijo de Tun Perpatih Sedang, el Bendahara Seri Wak Raja, registra su nombramiento como jefe de Klang en 1445 y su rechazo del intento siamés de atacar Malaca en 1446, y su ficha informativa contiene un año de nacimiento sin fuente de 1426 y un valor religioso de Islam."
  fr: "L'article malais de Wikipédia sur Tun Perak (mort en 1498), cinquième bendahara de Malacca; il le présente comme le fils de Tun Perpatih Sedang, le Bendahara Seri Wak Raja, relate sa nomination comme chef de Klang en 1445 et son repoussement de la tentative siamoise sur Malacca en 1446, et son infobox comporte une année de naissance non sourcée de 1426 et une valeur religieuse de l'Islam."
