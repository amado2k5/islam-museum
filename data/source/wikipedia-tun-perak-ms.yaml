summary:
  ar: "مقالة ويكيبيديا الملايوية عن تون بيراك (ت. 1498)، بنداهارا ملقا الخامس؛ تنسبه إلى أبيه تون برباتيه سدانغ، بنداهارا سري واك راجا، وتذكر تعيينه حاكمًا على كلاغ سنة 1445 وردّه محاولة سيام غزو ملقا سنة 1446، ويحمل صندوق معلوماتها ميلاد سنة 1426 ودينًا هو الإسلام دون مصدر."
  en: "Malay Wikipedia article on Tun Perak (d. 1498), fifth bendahara of Malacca; it makes him the son of Tun Perpatih Sedang, the Bendahara Seri Wak Raja, records his appointment as chieftain of Klang in 1445 and his repulse of the Siamese attempt on Malacca in 1446, and its infobox carries an unsourced birth year of 1426 and a religion value of Islam."
