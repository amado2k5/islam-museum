summary:
  ar: "تقرير رويترز من جاكرتا كما نشره موقع CIOL في 20 سبتمبر 2007: أجهزة المصحف الرقمي بحجم مشغل الموسيقى، تحمل النص العربي كاملًا مع ترجمة إندونيسية وتلاوته، تصنعها شركة كورية جنوبية باسم «إقرأ»، وتباع بين 900 ألف و1.9 مليون روبية، ويحملها حجاج كثيرون."
  en: "The Reuters report from Jakarta as carried by CIOL on 20 September 2007: digital Qur'an players the size of a music player, holding the full Arabic text with an Indonesian translation and its recitation, made by a South Korean company under the brand Iqra'a, priced from 900,000 to 1.9 million rupiah, and carried by many pilgrims."
  ur: "جکارتہ سے رائٹرز کی رپورٹ، CIOL پر 20 ستمبر 2007: موسیقی پلیئر جتنے ڈیجیٹل قرآن آلات جن میں پورا عربی متن انڈونیشیائی ترجمے اور تلاوت کے ساتھ ہے؛ جنوبی کوریا کی کمپنی «اقرأ» کے نام سے بناتی ہے؛ قیمت 9 لاکھ سے 19 لاکھ روپیہ؛ بہت سے حاجی ساتھ رکھتے ہیں۔"
