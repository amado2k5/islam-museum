reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 1 June 1850 at Frashër; 'erhielt Sami Frashëri seine erste Ausbildung an der Frashër-Tekke des Bektaschi-Ordens' — his first education at the Frashër tekke of the Bektashi order (an education fact, as in the English article); the Zosimea gymnasium and the Ioannina madrasa for Turkish, Persian and Arabic; his role in destroying, as the article puts it, the Albanian Muslims' illusion that the Ottoman Empire was reformable, and in raising an independent Albania as the alternative; his death at Istanbul on 5 June 1904 (against 18 June 1904 in the English and Albanian articles and Wikidata — recorded as a conflict). No statement attests his own membership of the order."
