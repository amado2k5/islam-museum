  en: "Finance in the Islamic Economy: Concept and Principles, Qeddi Abdelmadjid and Bouzid Issam"
summary:
  ar: "ورقة مؤتمر ⁦(24 صفحة)⁩ قدمها الباحثان ضمن الملتقى الدولي الثاني حول الأزمة المالية الراهنة والبدائل المالية والمصرفية، ويعرض مفهوم التمويل في الاقتصاد الإسلامي وأنواع الربا ومبادئ التمويل. النص المتاح عبر التعرف الضوئي على الحروف (OCR) تالف في معظم صفحاته."
  en: "A 24-page conference paper by the two authors, given at the second international forum on the current financial crisis and alternative financial and banking systems. It sets out the concept of finance in the Islamic economy, the kinds of riba and the principles of Islamic finance. The OCR text is badly corrupted on most pages."
  es: "Documento de 24 páginas presentado por los dos autores en el segundo foro internacional sobre la crisis financiera actual y los sistemas financieros y bancarios alternativos. En él se expone el concepto de finanzas en la economía islámica, los tipos de riba (usura) y los principios de las finanzas islámicas. El texto OCR está muy dañado en la mayoría de las páginas."
  fr: "Ce document de 24 pages, rédigé par les deux auteurs et présenté lors du deuxième forum international sur la crise financière actuelle et les systèmes financiers et bancaires alternatifs, expose le concept de finance dans l'économie islamique, les différentes formes d'usure (riba) et les principes de la finance islamique. La numérisation du texte est fortement altérée sur la plupart des pages."

