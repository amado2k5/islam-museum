summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد رضا بهلوي؛ تُستخدم لوقائع الكيان فقط. تروي حكمه لإيران من 1941 حتى ثورة 1979 وخروجه من البلاد ووفاته في القاهرة في 27 تموز 1980، وتعطي ميلاده في طهران في 26 تشرين الأول 1919. صندوق معلوماتها يعطي دينه بالإسلام الشيعي الاثني عشري، أما نصّها فلا ينصّ على انتمائه الشخصي ويورد قسمه بحماية الإسلام الشيعي بصفته شاهًا ورواية زونيس عن أحلام طفولته."
  en: "English Wikipedia article on Mohammad Reza Pahlavi; used for entity facts only. It recounts his reign over Iran from 1941 until the 1979 revolution, his departure from the country, and his death in Cairo on 27 July 1980; it gives his birth in Tehran on 26 October 1919. Its infobox gives his religion as Twelver Shia Islam; the text makes no statement of his personal affiliation, quoting his oath as shah to protect Shia Islam and Zonis's account of his childhood dreams of the Twelve Imams."
