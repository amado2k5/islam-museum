summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد رضا بهلوي؛ تُستخدم لوقائع الكيان فقط. تروي حكمه لإيران من 1941 حتى ثورة 1979 وخروجه من البلاد ووفاته في القاهرة في 27 تموز 1980، وتعطي ميلاده في طهران في 26 تشرين الأول 1919. صندوق معلوماتها يعطي دينه بالإسلام الشيعي الاثني عشري، أما نصّها فلا ينصّ على انتمائه الشخصي ويورد قسمه بحماية الإسلام الشيعي بصفته شاهًا ورواية زونيس عن أحلام طفولته."
  en: "English Wikipedia article on Mohammad Reza Pahlavi; used for entity facts only. It recounts his reign over Iran from 1941 until the 1979 revolution, his departure from the country, and his death in Cairo on 27 July 1980; it gives his birth in Tehran on 26 October 1919. Its infobox gives his religion as Twelver Shia Islam; the text makes no statement of his personal affiliation, quoting his oath as shah to protect Shia Islam and Zonis's account of his childhood dreams of the Twelve Imams."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Reza Pahlavi; utilizado únicamente para datos sobre la persona. Relata su reinado en Irán desde 1941 hasta la revolución de 1979, su salida del país y su muerte en El Cairo el 27 de julio de 1980; indica que nació en Teherán el 26 de octubre de 1919. Su ficha informativa señala que su religión era el islam chií duodecimano; el texto no menciona su afiliación personal, citando su juramento como shah de proteger el islam chií y el relato de Zonis sobre sus sueños infantiles acerca de los Doce Imanes."
  fr: "Article de Wikipédia en anglais sur Mohammad Reza Pahlavi; utilisé uniquement pour les informations sur l'entité. Il relate son règne sur l'Iran de 1941 à la révolution de 1979, son départ du pays et sa mort au Caire le 27 juillet 1980; il indique sa naissance à Téhéran le 26 octobre 1919. Son infobox précise qu'il était de confession chiite duodécimaine; le texte ne mentionne pas son appartenance personnelle, citant son serment en tant que shah de protéger l'islam chiite et le récit de Zonis concernant ses rêves d'enfance des Douze Imams."
  ur: "محمد رضا پہلوی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1941 سے لے کر 1979 کے انقلاب تک ایران پر ان کے دور حکومت، ملک سے ان کی روانگی اور 27 جولائی 1980 کو قاہرہ میں ان کی موت کا ذکر ہے۔ اس کی پیدائش 26 اکتوبر 1919 کو تہران میں ہوئی۔ اس کا انفو باکس اس کا مذہب بارہویں شیعہ اسلام کے طور پر دیتا ہے۔ متن میں ان کی ذاتی وابستگی کا کوئی بیان نہیں دیا گیا ہے، جس میں شیعہ اسلام اور زونس کے بارہ اماموں کے اپنے بچپن کے خوابوں کے بارے میں بیان کی حفاظت کے لیے ان کے شاہ کے حلف کا حوالہ دیا گیا ہے۔"
  tr: "Muhammed Rıza Pehlevi hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1941'den 1979 devrimine kadar İran üzerindeki yönetimini, ülkeden ayrılışını, 27 Temmuz 1980'de Kahire'de ölümünü anlatır ve 26 Ekim 1919'da Tahran'da doğduğunu anlatır. Bilgi kutusunda dinini On İki Dönem Şii İslamı olarak verirken, metni kişisel bağlılığını belirtmez ve Şii İslam'ı bir Şah olarak koruma yemini ile Zonis'in çocukluk hayallerine dair anlatımını içerir."
  id: "Artikel Wikipedia bahasa Inggris tentang Mohammad Reza Pahlavi; digunakan hanya untuk fakta entitas. Artikel ini menceritakan pemerintahannya atas Iran dari 1941 hingga revolusi 1979, kepergiannya dari negara itu, dan kematiannya di Kairo pada 27 Juli 1980, serta kelahirannya di Teheran pada 26 Oktober 1919. Kotak infonya mencantumkan agamanya sebagai Islam Syiah Dua Belas, sementara teksnya tidak menyebutkan afiliasi pribadinya dan menyertakan sumpahnya untuk melindungi Islam Syiah sebagai Shah serta catatan Zonis tentang mimpi masa kecilnya."
