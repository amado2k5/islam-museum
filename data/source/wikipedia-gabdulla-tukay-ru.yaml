summary:
  ar: "مقالة ويكيبيديا الروسية عن عبد الله توقاي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 26 أبريل ⁦(14 أبريل بالأسلوب القديم)⁩ 1886 في كوشلاوتش ووفاته مزدوجة التأريخ 15 أبريل ⁦(2 أبريل)⁩ 1913 في قازان ودفنه في مقبرة التتار الجديدة بقازان، وأن أباه وجدّيه كانوا ملالي قرى، وتفصّل طفولته اليتيمة وسنوات أورالسك وقازان وأسفاره ومرضه؛ ولا تسمي له دينا ولا مذهبا."
  en: "Russian Wikipedia article on Gabdulla Tukay; used for entity facts only. It dual-dates his birth 26 April (14 April old style) 1886 at Koshlauch and his death 15 April (2 April) 1913 at Kazan, with burial in Kazan's Novo-Tatar cemetery, records that his father and grandfathers were village mullahs, and details his orphaned childhood, his Uralsk and Kazan years, his journeys and his illness; it names no religion or school for him."
  es: "Artículo de la Wikipedia rusa sobre Gabdulla Tukay; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 26 de abril (14 de abril según el calendario antiguo) de 1886 en Koshlauch y su muerte el 15 de abril (2 de abril) de 1913 en Kazán, con entierro en el cementerio Novo-Tatar de Kazán, registra que su padre y sus abuelos eran mulás del pueblo y detalla su infancia huérfana, sus años en Uralsk y Kazán, sus viajes y su enfermedad; no menciona ninguna religión ni escuela a la que perteneciera."
  fr: "Article Wikipédia russe sur Gabdulla Tukay; utilisé uniquement pour des informations factuelles. Il mentionne deux dates: le 26 avril (14 avril selon l’ancien calendrier) 1886 à Koshlauch et le 15 avril (2 avril) 1913 à Kazan, avec inhumation au cimetière Novo-Tatar de Kazan. L’article indique que son père et ses grands-pères étaient des mollahs du village et détaille son enfance d’orphelin, ses années à Oural et à Kazan, ses voyages et sa maladie; il ne précise ni sa religion ni son école."
  ur: "Gabdulla Tukay پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ دوہری تاریخیں ان کی پیدائش 26 اپریل ⁦(14 اپریل پرانی طرز)⁩ 1886 کوشلوچ میں اور اس کی موت 15 اپریل ⁦(2 اپریل)⁩ 1913 کو کازان میں، قازان کے نوو تاتار قبرستان میں دفن کے ساتھ، ریکارڈ کرتا ہے کہ اس کے والد اور دادا گاؤں کے ملا تھے، اور اس کے یتیمی کے سال، اس کے بچپن اور اس کی بیماری، اس کی عمر، اس کی بیماری اور اس کی عمر کی تفصیلات درج کی گئی ہیں۔ اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
  tr: "Abdullah Toughai hakkında Rusça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumu 26 Nisan (eski tarzda 14 Nisan) 1886'da Kushlavch'ta, ölümü 15 Nisan (2 Nisan) 1913 Kazan'da çift tarihli ve defnişi Kazan'daki yeni Tatar mezarlığında verilmiştir. Babası ve dedesi köy din adamıydı, yetim çocukluğu, Uralsk ve Kazan yılları, seyahatleri ve hastalığı ayrıntılı olarak anlatılmıştır; dini veya mezhebi adı verilmemiştir."
  id: "Artikel Wikipedia Rusia tentang Abdullah Toughai; digunakan hanya untuk fakta entitas tersebut. Tanggal lahirnya dua kali bertanggal 26 April (14 April dengan gaya lama) 1886 di Kushlavch, kematiannya bertanggal ganda 15 April (2 April) 1913 di Kazan, dan pemakamannya dilakukan di pemakaman Tatar baru di Kazan. Ayah dan kakeknya adalah ulama desa, dan masa kecilnya yang yatim piatu, tahun-tahun Uralsk dan Kazan, perjalanannya, dan penyakitnya dirinci; tidak disebutkan agama atau sektenya."
