summary:
  ar: "مقالة ويكيبيديا الروسية عن عبد الله توقاي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 26 أبريل (14 أبريل بالأسلوب القديم) 1886 في كوشلاوتش ووفاته مزدوجة التأريخ 15 أبريل (2 أبريل) 1913 في قازان ودفنه في مقبرة التتار الجديدة بقازان، وأن أباه وجدّيه كانوا ملالي قرى، وتفصّل طفولته اليتيمة وسنوات أورالسك وقازان وأسفاره ومرضه؛ ولا تسمي له دينا ولا مذهبا."
  en: "Russian Wikipedia article on Gabdulla Tukay; used for entity facts only. It dual-dates his birth 26 April (14 April old style) 1886 at Koshlauch and his death 15 April (2 April) 1913 at Kazan, with burial in Kazan's Novo-Tatar cemetery, records that his father and grandfathers were village mullahs, and details his orphaned childhood, his Uralsk and Kazan years, his journeys and his illness; it names no religion or school for him."
