  ar: "الأنطولوجيا التعاونية للبيانات المترابطة المفتوحة للمفاهيم النقدية — مفردات موحدة للعملات والمسكوكات والمدن الضاربة والسلطات الإصدار والمعايير والتصنيفات، أسستها الجمعية الأمريكية لعلم النقود مع تطوير مرتبط بجامعة أكسفورد وبرعاية مجلس التراث غير المادي منذ ٢٠١٠، برخصة الإسناد Creative Commons ٣.٠، وتتضمن نقطة استعلام SPARQL وواجهات برمجية موثقة."
  en: "The collaborative Linked Open Data ontology for numismatic concepts — a shared vocabulary for coins, mints, issuing authorities, standards and classifications, founded in 2010 by the American Numismatic Society with Oxford-linked development and INC patronage, licensed CC-BY 3.0, with a SPARQL endpoint and documented APIs."
