summary:
  ar: "الأنطولوجيا التعاونية للبيانات المترابطة المفتوحة للمفاهيم النقدية — مفردات موحدة للعملات والمسكوكات والمدن الضاربة والسلطات الإصدار والمعايير والتصنيفات، أسستها الجمعية الأمريكية لعلم النقود مع تطوير مرتبط بجامعة أكسفورد وبرعاية مجلس التراث غير المادي منذ ٢٠١٠، برخصة الإسناد Creative Commons ٣.٠، وتتضمن نقطة استعلام SPARQL وواجهات برمجية موثقة."
  en: "The collaborative Linked Open Data ontology for numismatic concepts — a shared vocabulary for coins, mints, issuing authorities, standards and classifications, founded in 2010 by the American Numismatic Society with Oxford-linked development and INC patronage, licensed CC-BY 3.0, with a SPARQL endpoint and documented APIs."
  ur: "The collaborative Linked Open Data ontology for numismatic concepts — a shared vocabulary for coins, mints, issuing authorities, standards and classifications, founded in 2010 by the American Numismatic Society with Oxford-linked development and INC patronage, licensed CC-BY 3.0, with a SPARQL endpoint and documented APIs."
  es: "La ontología colaborativa de datos abiertos enlazados para conceptos numismáticos —un vocabulario compartido para monedas, cecas, autoridades emisoras, estándares y clasificaciones—, fundada en 2010 por la American Numismatic Society con desarrollo vinculado a Oxford y el patrocinio de INC, bajo licencia CC-BY 3.0, con un punto final SPARQL y API documentadas."
  fr: "L'ontologie collaborative Linked Open Data pour les concepts numismatiques — un vocabulaire partagé pour les pièces de monnaie, les ateliers monétaires, les autorités émettrices, les normes et les classifications, fondée en 2010 par l'American Numismatic Society avec un développement lié à Oxford et le patronage d'INC, sous licence CC-BY 3.0, avec un point de terminaison SPARQL et des API documentées."
  tr: "Parasal Kavramlar için Açık İşbirlikçi Veri Ontolojisi — madeni paralar, madeni paralar, strike cities, ihraç otoriteleri, standartlar ve sınıflandırmalar için birleşik kelime dağarcığı — Amerikan Nümismatik Derneği tarafından Oxford Üniversitesi ile bağlantılı bir geliştirme ile kurulmuş ve 2010'dan beri Creative Commons 3.0 Atıfı kapsamında Maddi Olmayan Miras Konseyi tarafından desteklenmektedir; SPARQL sorgu noktası ve belgelenmiş programlama arayüzlerini içerir."
  id: "Open Collaborative Data Ontology for Monetary Concepts — kosakata terpadu untuk koin, koin, kota strike, otoritas penerbit, standar, dan klasifikasi, didirikan oleh American Numismatics Association dengan pengembangan terkait Universitas Oxford dan disponsori oleh Intangible Heritage Council sejak 2010, di bawah Creative Commons 3.0 Attribution, dan mencakup titik kueri SPARQL serta antarmuka pemrograman yang terdokumentasi."
