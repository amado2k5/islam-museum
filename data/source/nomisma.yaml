reliability_note: "The reference ontology of numismatics — stable nomisma.org/id/ concept URIs for coin types, mints, issuing authorities, denominations and standards — the machine-readable backbone for Islamic coinage facts that the museum's two kind:coin objects cannot yet carry. Licence: CC-BY 3.0 stated on site (verified 9 Nov 2026); {cite:nomisma <concept-id>} is the attribution. Caveat: Nomisma is an ontology of concepts, not a coin catalogue — dataset records ingested through partner projects carry their own licence statements and stay facts-only until checked per-record. Cite mint → place, issuing authority → person/polity, type/standard → object kind coin; legend text and images are never republished. Harvest channel: SPARQL endpoint + documented APIs; pilot pending — only two kind:coin records exist, so the first pilot targets mint/issuer corroboration for existing place and person records. Verified live 9 November 2026; decision dec-20261109-224 (supersedes engine false-positive dec-20261109-223)."
