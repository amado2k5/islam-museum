  ar: "مقالة ويكيبيديا العربية عن حسين أحمد المدني؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 6 أكتوبر 1879 ووفاته في 5 ديسمبر 1957، وتتلمذه على محمود حسن الديوبندي وأسره في مالطا، وتصنّفه في الحنفية والماتريدية تصنيفًا لا نصًّا، وفي متنها خطأ في السنة الهجرية لوفاته."
  en: "Arabic Wikipedia article on Husain Ahmad Madani; used for entity facts only. It gives his birth on 6 October 1879 and death on 5 December 1957, his study under Mahmud Hasan Deobandi and his Malta captivity; its Hanafi and Maturidi framings are categories, not text, and its body carries a wrong Hijri year for his death."
