reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. A short article: its lead pairs 6 October 1879 with 1296 AH and 5 December 1957 with 1377 AH, and its text names his teachers (Dhulfiqar Ali, Khalil Ahmad Saharanpuri, Mufti Aziz al-Rahman, and Mahmud Hasan for fiqh and hadith) and his deportation to Malta with Mahmud Hasan. Its body then gives his death as 13 Jumada al-awwal 1363 AH, contradicting its own lead's 1377 — a typographical error in that article, not followed. Its text nowhere names a legal school for him; the Hanafi and Maturidi labels are its categories (Hanafis, Maturidis, Sunni Sufis, Deobandis), which are filings."
