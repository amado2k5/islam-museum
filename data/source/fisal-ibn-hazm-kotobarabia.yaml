summary:
  ar: "نص رقمي كامل لكتاب «الفصل في الملل والأهواء والنحل» للإمام أبي محمد علي بن أحمد بن حزم، في 1930 صفحة إلكترونية، يوزعه موقع كتب عربية، بفهرس موضوعات في أوله؛ يبدأ بالكلام على الفرق المخالفة لدين الإسلام ثم نحل أهل الإسلام ثم مسائل الكلام."
  en: "A complete digital text of al-Fisal fi al-Milal wa-l-Ahwa' wa-l-Nihal by Imam Abu Muhammad Ali ibn Ahmad ibn Hazm, 1,930 electronic pages, distributed by kotobarabia.com, with a table of contents at the start; it covers first the groups opposed to Islam, then the sects of the Muslims, then questions of theology."
  ur: "امام ابو محمد علی بن احمد ابن حزم کی «الفصل فی الملل والاہواء والنحل» کا مکمل ڈیجیٹل متن، 1930 الیکٹرانک صفحات، کتب عربیہ ویب سائٹ سے، آغاز میں فہرست کے ساتھ؛ اس میں پہلے اسلام کے مخالف فرقوں، پھر اہلِ اسلام کے فرقوں اور پھر کلامی مسائل کا ذکر ہے۔"
