  en: "Ibn Hazm, al-Fisal fi al-Milal wa-l-Ahwa' wa-l-Nihal (digital text, kotobarabia.com)"
  ur: "ابن حزم، الفصل فی الملل والاہواء والنحل ⁦(ڈیجیٹل متن، کتب عربیہ)⁩"
summary:
  ar: "نص رقمي كامل لكتاب «الفصل في الملل والأهواء والنحل» للإمام أبي محمد علي بن أحمد بن حزم، في 1930 صفحة إلكترونية، يوزعه موقع كتب عربية، بفهرس موضوعات في أوله؛ يبدأ بالكلام على الفرق المخالفة لدين الإسلام ثم نحل أهل الإسلام ثم مسائل الكلام."
  en: "A complete digital text of al-Fisal fi al-Milal wa-l-Ahwa' wa-l-Nihal by Imam Abu Muhammad Ali ibn Ahmad ibn Hazm, 1,930 electronic pages, distributed by kotobarabia.com, with a table of contents at the start; it covers first the groups opposed to Islam, then the sects of the Muslims, then questions of theology."
  ur: "امام ابو محمد علی بن احمد ابن حزم کی «الفصل فی الملل والاہواء والنحل» کا مکمل ڈیجیٹل متن، 1930 الیکٹرانک صفحات، کتب عربیہ ویب سائٹ سے، آغاز میں فہرست کے ساتھ؛ اس میں پہلے اسلام کے مخالف فرقوں، پھر اہلِ اسلام کے فرقوں اور پھر کلامی مسائل کا ذکر ہے۔"
  es: "Texto digital completo de al-Fisal fi al-Milal wa-l-Ahwa' wa-l-Nihal del Imam Abu Muhammad Ali ibn Ahmad ibn Hazm, 1930 páginas electrónicas, distribuido por kotobarabia.com, con un índice al principio; abarca primero los grupos opuestos al Islam, luego las sectas de los musulmanes y, finalmente, cuestiones de teología."
  fr: "Le texte numérique complet d'al-Fisal fi al-Milal wa-l-Ahwa' wa-l-Nihal de l'imam Abu Muhammad Ali ibn Ahmad ibn Hazm, 1 930 pages électroniques, distribué par kotobarabia.com, avec une table des matières au début; il traite d'abord des groupes opposés à l'islam, puis des sectes musulmanes, puis des questions de théologie."
  tr: "İmam Ebu Muhammed Ali ibn Ahmed ibn Hazm tarafından 1930 yılında yayımlanan \"Al-Fasl fi al-Milal wa al-Hawa' wa al-al-Nihal\" adlı kitabın tam dijital metni, Arap Kitapları web sitesi tarafından dağıtılan, başta konu dizini yer alır; İslam dinine karşı olan mezheplerin, ardından İslam halkının mezheplerinin ve ardından teoloji meselelerinin tartışılmasıyla başlar."
  id: "Teks digital lengkap dari buku \"Al-Fasl fi al-Milal wa al-Hawa' wa al-Nihal\" oleh Imam Abu Muhammad Ali ibn Ahmad ibn Hazm, pada tahun 1930 halaman elektronik, didistribusikan oleh situs web Arabic Books, dengan indeks topik di awal; dimulai dengan membahas sekte-sekte yang menentang agama Islam, kemudian sekte umat Islam, dan kemudian isu-isu teologi."
