  ar: "مقالة ويكيبيديا العربية عن كينان، وهي مقالة قصيرة؛ تُستخدم لوقائع الكيان فقط. تؤكد هويته مغنيًا صوماليًا-كنديًا، ولا تسمّي له مذهبًا."
  en: "Arabic Wikipedia article on K'naan, a short article; used for entity facts only. It confirms his identity as a Somali-Canadian singer, and names no school for him."
  es: "Artículo breve de la Wikipedia en árabe sobre K'naan; se utiliza únicamente para datos sobre la persona. Confirma su identidad como cantante somalí-canadiense y no menciona ninguna escuela a la que pertenezca."
  fr: "Article Wikipédia en arabe sur K'naan: court article, destiné uniquement à fournir des informations sur l'individu. Il confirme son identité de chanteur somalien-canadien et ne mentionne aucune école où il aurait étudié."
  ur: "عربی ویکیپیڈیا مضمون کنان پر، ایک مختصر مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ایک صومالی-کینیڈین گلوکار کے طور پر اس کی شناخت کی تصدیق کرتا ہے، اور اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Kenan hakkında kısa bir makale olan Arapça Wikipedia makalesi; sadece varlığın gerçekleri için kullanılmıştır. Kendisini Somali-Kanadalı bir şarkıcı olarak doğrular ve mezhebinin adını vermez."
  id: "Artikel Wikipedia bahasa Arab tentang Kenan, yang merupakan artikel singkat; hanya digunakan untuk fakta entitas. Ia mengonfirmasi identitasnya sebagai penyanyi Somalia-Kanada, dan tidak menyebutkan nama sektenya."
