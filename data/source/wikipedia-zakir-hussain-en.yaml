  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth at Bombay on 9 March 1951 as the eldest son of Alla Rakha, his move to San Francisco in the late 1960s, the Padma Vibhushan (2023), his three Grammy wins of 2024 and his death at San Francisco on 15 December 2024 of idiopathic pulmonary fibrosis, and carries no religion content for the man himself."
