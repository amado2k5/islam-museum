  ar: "مقالة ويكيبيديا الإنجليزية عن فيصل الثاني، آخر ملوك العراق؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 2 مايو 1935 في بغداد ووفاته مقتولًا في 14 يوليو 1958 في بغداد، ويحمل صندوق معلوماتها حقل ديانة يسمّي الإسلام السني مستشهدًا بمقال إخباري من سنة 2005."
  en: "English Wikipedia article on Faisal II, the last king of Iraq; used for entity facts only. It gives his birth on 2 May 1935 at Baghdad and his killing on 14 July 1958 at Baghdad. Its infobox carries a religion field naming Sunni Islam, cited to a 2005 APS news article."
