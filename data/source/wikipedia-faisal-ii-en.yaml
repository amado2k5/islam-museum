summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيصل الثاني، آخر ملوك العراق؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 2 مايو 1935 في بغداد ووفاته مقتولًا في 14 يوليو 1958 في بغداد، ويحمل صندوق معلوماتها حقل ديانة يسمّي الإسلام السني مستشهدًا بمقال إخباري من سنة 2005."
  en: "English Wikipedia article on Faisal II, the last king of Iraq; used for entity facts only. It gives his birth on 2 May 1935 at Baghdad and his killing on 14 July 1958 at Baghdad. Its infobox carries a religion field naming Sunni Islam, cited to a 2005 APS news article."
  es: "Artículo de la Wikipedia en inglés sobre Faisal II, el último rey de Irak; utilizado únicamente para datos sobre la persona. Indica que nació el 2 de mayo de 1935 en Bagdad y que fue asesinado el 14 de julio de 1958 en la misma ciudad. Su ficha informativa incluye un campo sobre religión que menciona el islam sunita, citado en un artículo de noticias de la APS de 2005."
  fr: "L'article de Wikipédia en anglais sur Fayçal II, dernier roi d'Irak, est utilisé uniquement à titre informatif. Il indique sa naissance le 2 mai 1935 à Bagdad et son assassinat le 14 juillet 1958, également à Bagdad. Son infobox mentionne l'islam sunnite, d'après un article de l'APS datant de 2005."
  ur: "عراق کے آخری بادشاہ فیصل دوم پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 2 مئی 1935 کو بغداد میں ہوئی اور 14 جولائی 1958 کو بغداد میں اس کا قتل ہوا۔ اس کے معلوماتی باکس میں ایک مذہب کا شعبہ ہے جس کا نام سنی اسلام ہے، جس کا حوالہ 2005 کے اے پی ایس نیوز آرٹیکل میں دیا گیا ہے۔"
