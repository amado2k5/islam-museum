summary:
  ar: "مقالة ويكيبيديا الأردية عن أشرف غني؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 19 مايو 1949 في لوكر ونسبه البشتوني، وتعليمه في بيروت وكولومبيا وتدريسه في جامعة كابل، وعمله في البنك الدولي، ووزارته للمالية (2002–2004) ورئاسته لجامعة كابل ورئاسته لأفغانستان (2014–2021). يعطي صندوق معلوماتها دينه «الإسلام» عموماً دون مذهب."
  en: "Urdu Wikipedia article on Ashraf Ghani; used for entity facts only. It recounts his birth on 19 May 1949 in Logar and his Pashtun descent, his education at Beirut and Columbia and his teaching at Kabul University, his World Bank years, his finance ministry (2002–2004), his chancellorship of Kabul University and his presidency of Afghanistan (2014–2021). Its infobox gives his religion generically as Islam, with no school."
  ur: "اشرف غنی پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 19 مئی 1949ء کو لوگر میں ان کی پیدائش اور پشتون نسبت، بیروت اور کولمبیا میں ان کی تعلیم اور جامعہ کابل میں تدریس، عالمی بنک کے برس، وزارت خزانہ ⁦(2002ء–2004ء)⁩، جامعہ کابل کی چانسلری اور افغانستان کی صدارت ⁦(2014ء–2021ء)⁩ بیان ہوئی ہے۔ اس کے معلوماتی خانے میں ان کا مذہب عمومی طور پر اسلام درج ہے، کوئی مسلک نہیں۔"
  es: "Artículo de Wikipedia en urdu sobre Ashraf Ghani; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 19 de mayo de 1949 en Logar y su ascendencia pastún, su educación en Beirut y Columbia y su docencia en la Universidad de Kabul, sus años en el Banco Mundial, su ministerio de finanzas (2002-2004), su rectorado de la Universidad de Kabul y su presidencia de Afganistán (2014-2021). Su ficha informativa indica genéricamente que su religión es el islam, sin mencionar ninguna escuela."
  fr: "L'article de Wikipédia en ourdou consacré à Ashraf Ghani, utilisé uniquement pour les informations le concernant, relate sa naissance le 19 mai 1949 à Logar, ses origines pachtounes, ses études à Beyrouth et à l'Université Columbia, son enseignement à l'Université de Kaboul, son passage à la Banque mondiale, son ministère des Finances (2002-2004), sa fonction de chancelier de l'Université de Kaboul et sa présidence de l'Afghanistan (2014-2021). Son infobox indique sa religion comme étant l'islam, sans préciser d'établissement scolaire."
  tr: "Ashraf Ghani hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 19 Mayıs 1949'da Loker'de doğmasını, Peştun soyunu, Beyrut ve Kolombiya'daki eğitimini, Kabil Üniversitesi'ndeki öğretimini, Dünya Bankası'ndaki çalışmalarını, Maliye Bakanlığını (2002–2004), Kabil Üniversitesi başkanlığını ve Afganistan başkanlığını (2014–2021) anlatır. Bilgi kutusunda genellikle dini \"İslam\" olarak herhangi bir mezhep olmadan listelenir."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Ashraf Ghani; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada 19 Mei 1949 di Loker, garis keturunan Pashtun-nya, pendidikannya di Beirut dan Kolombia, pengajarannya di Universitas Kabul, pekerjaannya di Bank Dunia, Kementerian Keuangannya (2002–2004), kepresidenannya di Universitas Kabul, dan kepresidenannya di Afghanistan (2014–2021). Kotak info-nya umumnya mencantumkan agamanya sebagai \"Islam\" tanpa sekte apa pun."
