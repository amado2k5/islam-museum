summary:
  ar: "مقالة ويكيبيديا الأردية عن أشرف غني؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 19 مايو 1949 في لوكر ونسبه البشتوني، وتعليمه في بيروت وكولومبيا وتدريسه في جامعة كابل، وعمله في البنك الدولي، ووزارته للمالية (2002–2004) ورئاسته لجامعة كابل ورئاسته لأفغانستان (2014–2021). يعطي صندوق معلوماتها دينه «الإسلام» عموماً دون مذهب."
  en: "Urdu Wikipedia article on Ashraf Ghani; used for entity facts only. It recounts his birth on 19 May 1949 in Logar and his Pashtun descent, his education at Beirut and Columbia and his teaching at Kabul University, his World Bank years, his finance ministry (2002–2004), his chancellorship of Kabul University and his presidency of Afghanistan (2014–2021). Its infobox gives his religion generically as Islam, with no school."
  ur: "اشرف غنی پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 19 مئی 1949ء کو لوگر میں ان کی پیدائش اور پشتون نسبت، بیروت اور کولمبیا میں ان کی تعلیم اور جامعہ کابل میں تدریس، عالمی بنک کے برس، وزارت خزانہ (2002ء–2004ء)، جامعہ کابل کی چانسلری اور افغانستان کی صدارت (2014ء–2021ء) بیان ہوئی ہے۔ اس کے معلوماتی خانے میں ان کا مذہب عمومی طور پر اسلام درج ہے، کوئی مسلک نہیں۔"
