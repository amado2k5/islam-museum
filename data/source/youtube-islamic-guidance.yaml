summary:
  ar: "قناة الإرشاد الإسلامي على يوتيوب (@Islamic_Guidance)، سلاسل تاريخية متحركة تركز على ماضي الإسلام وحاضره ومستقبله، أنشأها شيك شميم أحمد في 23 يونيو 2008 وينتجها وحده؛ مصدر أولي لهوية القناة وعملها وانتشارها، لا مصدر مستقل مؤيد."
  en: "The Islamic Guidance YouTube channel (@Islamic_Guidance), carrying animated history series focused on the past, present and future of Islam, started by Shek Shamim Ahmed on 23 June 2008 and produced by him alone; a primary source for the channel's identity, work and reach, not independent corroboration."
  es: "El canal de YouTube Islamic Guidance (@Islamic_Guidance), que emite series de historia animadas centradas en el pasado, el presente y el futuro del Islam, fue creado por Shek Shamim Ahmed el 23 de junio de 2008 y producido únicamente por él; es una fuente primaria para la identidad, el trabajo y el alcance del canal, pero no una corroboración independiente."
  fr: "La chaîne YouTube Islamic Guidance (@Islamic_Guidance), qui propose des séries historiques animées axées sur le passé, le présent et l'avenir de l'Islam, a été créée par Shek Shamim Ahmed le 23 juin 2008 et produite par lui seul; une source primaire pour l'identité, le travail et la portée de la chaîne, et non une corroboration indépendante."
  ur: "اسلامک گائیڈنس یوٹیوب چینل (@Islamic_Guidance)، جس میں اسلام کے ماضی، حال اور مستقبل پر توجہ مرکوز کرنے والی متحرک تاریخ کی سیریز ہے، جس کا آغاز شیخ شمیم احمد نے 23 جون 2008 کو کیا تھا اور اسے اکیلے نے تیار کیا تھا۔ چینل کی شناخت، کام اور رسائی کے لیے ایک بنیادی ذریعہ، نہ کہ آزاد تصدیق۔"
  tr: "YouTube'daki İslami Rehberlik Kanalı (@Islamic_Guidance), İslam'ın geçmişi, bugünü ve geleceğine odaklanan tarihi bir animasyon dizisidir. 23 Haziran 2008'de Shik Shamim Ahmed tarafından yaratılmış ve yalnızca kendisi tarafından üretilmiştir; kanalın kimliği, çalışmaları ve yaygınlığı için birincil kaynaktır, bağımsız bir destekleyici kaynak değildir."
  id: "Saluran Bimbingan Islam di YouTube (@Islamic_Guidance) adalah serial animasi sejarah yang berfokus pada masa lalu, masa kini, dan masa depan Islam. Serial ini dibuat oleh Shik Shamim Ahmed pada 23 Juni 2008, dan diproduksi sepenuhnya olehnya; ia adalah sumber utama untuk identitas, karya, dan penyebaran saluran tersebut, bukan sumber pendukung independen."
