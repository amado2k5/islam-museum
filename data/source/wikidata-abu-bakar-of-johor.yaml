  ur: "جوہر کے ابوبکر کے لیے ویکی ڈیٹا آئٹم Q2637695؛ اس میں ان کی پیدائش 3 فروری 1833، ان کی وفات 4 جون 1895 کو لندن میں ہوئی، ان کے والد ڈینگ ابراہیم اور ان کے بیٹے ابراہیم۔ اس میں مذہب کی کوئی اہمیت نہیں ہے۔"
  tr: "Wikidata Element Q2637695 Abu Bakr al-Jawhari tarafından; 3 Şubat 1833'te doğdu ve 4 Haziran 1895'te Londra'da, babası Daing İbrahim ve oğlu İbrahim ile birlikte vefat etti. Dini bir değeri yoktur."
  id: "Wikidata Element Q2637695 oleh Abu Bakr al-Jawhari; ia lahir pada 3 Februari 1833, dan meninggal pada 4 Juni 1895 di London, bersama ayahnya Daing Ibrahim dan putranya Ibrahim. Karya ini tidak memiliki nilai agama."
