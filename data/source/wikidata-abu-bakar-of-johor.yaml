  ar: "عنصر ويكيداتا Q2637695 لأبي بكر الجوهري؛ يحمل ميلاده في 3 شباط 1833 ووفاته في 4 حزيران 1895 في لندن وأباه داينغ إبراهيم وابنه إبراهيم. لا يحمل أي قيمة للديانة."
  en: "Wikidata item Q2637695 for Abu Bakar of Johor; it carries his birth on 3 February 1833, his death on 4 June 1895 in London, his father Daeng Ibrahim and his son Ibrahim. It carries no religion value at all."
  es: "El elemento Q2637695 de Wikidata corresponde a Abu Bakar de Johor; contiene información sobre su nacimiento el 3 de febrero de 1833, su fallecimiento el 4 de junio de 1895 en Londres, su padre Daeng Ibrahim y su hijo Ibrahim. No tiene ningún valor religioso."
