summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الطبلاوي؛ تذكر نقابته لقراء مصر من 2011 إلى وفاته، وقراءته في الأزهر، ودخوله الكعبة بدعوة من الملك خالد، وجنازته في زمن قيود كوفيد-19، وتستند إلى الأهرام أونلاين وجلف نيوز واليوم السابع ووكالة إكنا."
  en: "English Wikipedia article on al-Tablawi; it gives his headship of the Egyptian Syndicate of Quran Reciters from 2011 until his death, his recitation at al-Azhar, his entering the Kaaba at King Khalid's invitation and his funeral under COVID-19 restrictions, citing Ahram Online, Gulf News, Youm7 and IQNA."
  es: "Artículo de la Wikipedia en inglés sobre al-Tablawi; en él se menciona su liderazgo del Sindicato Egipcio de Recitadores del Corán desde 2011 hasta su muerte, su recitación en al-Azhar, su entrada a la Kaaba por invitación del rey Khalid y su funeral bajo las restricciones de la COVID-19, citando a Ahram Online, Gulf News, Youm7 e IQNA."
  fr: "L'article de Wikipédia en anglais sur al-Tablawi; il retrace son rôle à la tête du Syndicat égyptien des récitants du Coran de 2011 jusqu'à sa mort, sa récitation à al-Azhar, son entrée dans la Kaaba à l'invitation du roi Khalid et ses funérailles dans le respect des restrictions liées à la COVID-19, citant Ahram Online, Gulf News, Youm7 et IQNA."
  ur: "الطبلوی پر انگریزی ویکیپیڈیا مضمون؛ اس نے احرام آن لائن، گلف نیوز، یوم 7 اور IQNA کا حوالہ دیتے ہوئے 2011 سے ان کی وفات تک مصری سنڈیکیٹ آف قرآن قاریوں کی سربراہی، الازہر میں ان کی تلاوت، کنگ خالد کی دعوت پر خانہ کعبہ میں داخل ہونے اور COVID-19 پابندیوں کے تحت ان کی تدفین کی ذمہ داری دی ہے۔"
  tr: "El-Tablavi hakkında İngilizce Wikipedia makalesi, 2011'den ölümüne kadar Mısırlı okuyucular için örgütü, El-Ezher'deki okuması, Kral Halid'in davetiyle Kabe'ye girişi ve COVID-19 kısıtlamaları sırasında cenazesi hakkında bilgi vermektedir. Bu makale, Al-Ahram Online, Gulf News, Youm7 ve ICNA Ajansı'na dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Al-Tablawi menyebutkan sindikatnya untuk pembaca Mesir dari tahun 2011 hingga kematiannya, pembacaannya di Al-Azhar, kemasukannya ke Ka'bah atas undangan Raja Khaled, dan pemakamannya selama pembatasan COVID-19. Artikel ini didasarkan pada Al-Ahram Online, Gulf News, Youm7, dan ICNA Agency."
