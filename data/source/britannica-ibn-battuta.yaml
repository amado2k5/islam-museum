summary:
  en: "Britannica biography of Ibn Battuta; it gives his departure for the pilgrimage in 1325, the completed pilgrimage in 1326, his appointment as the Delhi sultan's envoy to China in 1342, his return to Fez in November 1349, his journey to the western Sudan from 1352, and his return to Morocco at the end of 1353, when he dictated his travels to Ibn Juzayy."
  es: "La biografía de Ibn Battuta publicada por la Enciclopedia Británica relata su partida para la peregrinación en 1325, la finalización de la peregrinación en 1326, su nombramiento como enviado del sultán de Delhi a China en 1342, su regreso a Fez en noviembre de 1349, su viaje al Sudán occidental a partir de 1352 y su regreso a Marruecos a finales de 1353, cuando dictó sus viajes a Ibn Juzayy."
