summary:
  ar: "عنصر ويكي بيانات Q12839455 لنواب سر فتح علي خان قزلباش؛ يُستخدم لوقائع الكيان فقط. يعطي مولده سنة 1862 ووفاته في 28 تشرين الأول 1923 ومهنته سياسيا ومكان دفنه كربلاء، ولا يحمل أي بيان ديانة."
  en: "Wikidata item Q12839455 for Nawab Sir Fateh Ali Khan Kazilbash; used for entity facts only. It gives his birth in 1862, his death on 28 October 1923, his occupation as a politician and his burial place as Karbala, and carries no religion statement."
  es: "El elemento de Wikidata Q12839455 corresponde a Nawab Sir Fateh Ali Khan Kazilbash; se utiliza únicamente para obtener información sobre la persona. Indica que nació en 1862, falleció el 28 de octubre de 1923, se dedicó a la política y fue enterrado en Karbala, sin mencionar su religión."
  fr: "L'élément Wikidata Q12839455 concerne le Nawab Sir Fateh Ali Khan Kazilbash; il sert uniquement à fournir des informations sur l'entité. Il indique sa naissance en 1862, son décès le 28 octobre 1923, sa profession d'homme politique et son lieu de sépulture à Karbala, sans mentionner sa religion."
  ur: "وکی ڈیٹا آئٹم Q12839455 نواب سر فتح علی خان کازلباش کے لیے؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1862 میں ان کی پیدائش، 28 اکتوبر 1923 کو ان کی موت، ایک سیاست دان کے طور پر ان کے قبضے اور کربلا کے طور پر ان کی تدفین کے بارے میں بتاتا ہے، اور اس میں کوئی مذہب بیان نہیں ہے۔"
  tr: "Wikidata öğesi Q12839455 Fath Ali Khan Kızilbash'ın vekilleri için; sadece varlığın gerçekleri için kullanılır. 1862 doğumlu ve 28 Ekim 1923'te vefat etti, siyasi mesleği ve mezarı Kerbela'dır ve herhangi bir dini ifade taşımamaktadır."
  id: "Elemen Wikidata Q12839455 untuk deputi Fath Ali Khan Qizilbash; digunakan hanya untuk fakta entitas. Ia lahir pada tahun 1862 dan meninggal pada 28 Oktober 1923, pekerjaan politiknya dan tempat makamnya adalah Karbala, dan ia tidak membawa pernyataan keagamaan apapun."
