  ar: "مقالة ويكيبيديا الإنجليزية عن إسماعيل مطر؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل وميلاده في 7 أبريل 1983 في أبوظبي، والكرة الذهبية في بطولة العالم للشباب 2003، وقيادته الإمارات إلى لقب كأس الخليج 2007، ومسيرته مع الوحدة من 2001 إلى 2024 ومبارياته الـ136 مع الإمارات. ولا تذكر ديانته."
  en: "English Wikipedia article on Ismail Matar; used for entity facts only. It gives his full name, his birth on 7 April 1983 in Abu Dhabi, the Golden Ball at the 2003 FIFA World Youth Championship, his leading of the UAE to the 2007 Gulf Cup title, his Al-Wahda career of 2001–2024 and his 136 UAE caps. It makes no statement about his religion."
