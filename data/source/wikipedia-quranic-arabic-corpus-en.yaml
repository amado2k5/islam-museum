summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن «المدونة القرآنية العربية» (Quranic Arabic Corpus)، المراجعة 1375079606 ⁦(15 سبتمبر 2026)⁩؛ لوقائع الكيان فقط: مورد لغوي موسوم لكلمات القرآن البالغة 77,430 كلمة على نحو الإعراب، بقيادة كايس دوكس في جامعة ليدز بإشراف إريك أتويل، أُطلق في نوفمبر 2009."
  en: "English Wikipedia article on the Quranic Arabic Corpus, revision 1375079606 (15 September 2026); entity facts only: an annotated linguistic resource of the Qur'an's 77,430 words in the framework of traditional i'rab, led by Kais Dukes at the University of Leeds under Eric Atwell, first released in November 2009."
  ur: "«قرآنی عربی کارپس» پر انگریزی ویکیپیڈیا کا مضمون، نظرِ ثانی 1375079606 ⁦(15 ستمبر 2026)⁩؛ صرف حقائق: قرآن کے 77,430 الفاظ کا روایتی اعراب کے مطابق لسانی نشان زدہ وسیلہ، جامعہ لیڈز میں کائس ڈیوکس کی قیادت اور ایرک ایٹویل کی نگرانی میں، نومبر 2009 میں جاری۔"
  es: "Artículo de la Wikipedia en inglés sobre el Corpus Árabe Coránico, revisión 1375079606 (15 de septiembre de 2026); solo datos de entidades: un recurso lingüístico anotado de las 77.430 palabras del Corán en el marco del i'rab tradicional, dirigido por Kais Dukes en la Universidad de Leeds bajo la dirección de Eric Atwell, publicado por primera vez en noviembre de 2009."
  fr: "Article de Wikipédia en anglais sur le Corpus arabe coranique, révision 1375079606 (15 septembre 2026); faits sur les entités uniquement: une ressource linguistique annotée des 77 430 mots du Coran dans le cadre de l'i'rab traditionnel, dirigée par Kais Dukes à l'Université de Leeds sous la direction d'Eric Atwell, publiée pour la première fois en novembre 2009."
  tr: "'Kur'an Arapça Korpusu' üzerine İngilizce Wikipedia makalesi, revizyon 1375079606 (15 Eylül 2026); yalnızca varlık için tutanaklar: Leeds Üniversitesi'nden Case Doux tarafından Eric Atwell gözetiminde yürütülen, dilbilgisel biçimde 77.430 kelimelik Kur'an kelimeleriyle etiketlenmiş dilbilimsel kaynak."
  id: "Artikel Wikipedia bahasa Inggris tentang 'Quranic Arabic Corpus', revisi 1375079606 (15 September 2026); untuk entitas saja prosiding: sumber daya linguistik yang diberi label 77.430 kata kata-kata Qur'an dalam bentuk tata bahasa, dipimpin oleh Case Doux di University of Leeds di bawah pengawasan Eric Atwell, diluncurkan pada November 2009."
