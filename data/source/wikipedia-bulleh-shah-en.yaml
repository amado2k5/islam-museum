reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives him as Sayyid Abdullah Shah Qadri, born about 1680 at Uch, schooled at Kasur under Hafiz Ghulam Murtaza and then at Lahore under Shah Inayat Qadiri, a Sufi murshid, and dead at Kasur in 1757 aged 77, noting Christopher Shackle's 1758 as a minority dating; its infobox gives 30 August 1757 for the death day against the Urdu article's and Wikidata's 22 August. It rests on modern scholarship including Shackle's Harvard University Press translation. Checked 1 November 2026."
