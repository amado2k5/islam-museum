summary:
  ar: "مقالة ويكيبيديا الفرنسية عن المختار ولد داداه؛ تُستخدم لوقائع الكيان فقط. تروي أصله من قبيلة أولاد بيري المرابطية ومسيرته أول رئيس لموريتانيا. يسمّي صندوق معلوماتها الإسلام دينا له؛ ويعطي مطلعها وفاته في 15 أكتوبر 2003، أي بعد يوم من التاريخ الذي تذكره المقالات الإنجليزية والعربية وويكيداتا ⁦(14 أكتوبر)⁩، وهو اختلاف مسجّل في السجل."
  en: "French Wikipedia article on Moktar Ould Daddah; used for entity facts only. It recounts his origin in the maraboutic Ouled Birri tribe and his career as Mauritania's first president. Its infobox names Islam as his religion; its lead gives his death on 15 October 2003 — one day later than the 14 October given by the English and Arabic articles and Wikidata, a variant recorded in the record."
  es: "Artículo de la Wikipedia en francés sobre Moktar Ould Daddah; utilizado únicamente para datos sobre la persona. Relata su origen en la tribu marabútica Ouled Birri y su trayectoria como primer presidente de Mauritania. Su ficha informativa indica que profesaba el islam; su introducción señala su fallecimiento el 15 de octubre de 2003, un día después del 14 de octubre que figura en los artículos en inglés y árabe, así como en Wikidata, una variante registrada en el documento."
  fr: "L'article de Wikipédia en français sur Moktar Ould Daddah, utilisé uniquement pour les informations le concernant, relate ses origines au sein de la tribu maraboutique des Ouled Birri et son mandat de premier président de la Mauritanie. Son infobox indique qu'il était musulman; son introduction mentionne le 15 octobre 2003 comme date de décès, soit un jour après le 14 octobre indiqué dans les articles en anglais et en arabe, ainsi que sur Wikidata (une variante consignée dans la fiche)."
