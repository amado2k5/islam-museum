summary:
  ar: "مقالة ويكيبيديا الفرنسية عن المختار ولد داداه؛ تُستخدم لوقائع الكيان فقط. تروي أصله من قبيلة أولاد بيري المرابطية ومسيرته أول رئيس لموريتانيا. يسمّي صندوق معلوماتها الإسلام دينا له؛ ويعطي مطلعها وفاته في 15 أكتوبر 2003، أي بعد يوم من التاريخ الذي تذكره المقالات الإنجليزية والعربية وويكيداتا (14 أكتوبر)، وهو اختلاف مسجّل في السجل."
  en: "French Wikipedia article on Moktar Ould Daddah; used for entity facts only. It recounts his origin in the maraboutic Ouled Birri tribe and his career as Mauritania's first president. Its infobox names Islam as his religion; its lead gives his death on 15 October 2003 — one day later than the 14 October given by the English and Arabic articles and Wikidata, a variant recorded in the record."
