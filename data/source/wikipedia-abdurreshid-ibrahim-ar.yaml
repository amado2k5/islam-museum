reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. A devotional biography (its narrative source is a hagiographic web history), and two of its claims are not followed: that he spent twenty years in the Hijaz, where the English article gives a study period of 1879–1885 across Medina, Mecca and Istanbul, and that he died at nearly a hundred years of age, where his 1857 birth makes him 87. Its Hijri pairing for his death (1364 AH / 1944) is also loose: the museum's tabular conversion of 31 August 1944 is 1363. Used, with those cautions, for the outline of his travels and the Tokyo Mosque imamate, which the Turkish article confirms. It names no school for him."
