  ar: "مقالة ويكيبيديا الإنجليزية عن عامر خان؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في بومباي سنة 1965، ومسيرته من طفل ممثل إلى «لغان» و«دانغال»، وبرنامجه التلفزيوني «ساتياميف جاياتي»، وتصفه بأنه مسلم ممارس أدّى الحج سنة 2013."
  en: "English Wikipedia article on Aamir Khan; used for entity facts only. It records his birth in Bombay in 1965, his career from child actor to Lagaan and Dangal, his television talk show Satyamev Jayate, and describes him as a practising Muslim who performed the Hajj in 2013."
