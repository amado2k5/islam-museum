reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A very long article, read in full on 25 October 2026. It gives his birth as Mohammed Aamir Hussain Khan on 14 March 1965 in Bombay, to the film producer Tahir Hussain and Zeenat Hussain; his child roles in Yaadon Ki Baaraat (1973) and Madhosh (1974); the breakthrough of Qayamat Se Qayamat Tak (1988); the 1990s successes and Raja Hindustani (1996); the founding of Aamir Khan Productions in 1999 and Lagaan (2001), nominated for the Academy Award for Best Foreign Language Film; the four-year hiatus; the return with Rang De Basanti and Fanaa (2006) and the directorial debut Taare Zameen Par (2007); the record-breaking run of Ghajini (2008), 3 Idiots (2009), Dhoom 3 (2013), PK (2014) and Dangal (2016) and his opening of the Chinese market to Indian films; the failures of Thugs of Hindostan (2018) and Laal Singh Chaddha (2022) and the success of Sitaare Zameen Par (2025); his talk show Satyamev Jayate (2012–2014) and the Paani Foundation's drought work in Maharashtra; his UNICEF ambassadorships; and the 2015 'intolerance' controversy and its backlash, carried in the person prose as attributed positions. On faith, the article calls him 'a practising Muslim' and records that he performed the Hajj with his mother in 2013; it names no school. The article records three marriages: Reena Dutta (1986, divorced 2002), Kiran Rao (2005, separated 2021) and Gauri Spratt (married 5 July 2026)."
