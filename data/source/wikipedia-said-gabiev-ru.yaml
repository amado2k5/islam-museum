  ar: "مقالة ويكيبيديا الروسية عن سعيد إبراهيموفيتش غابييف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 28 مايو 1882 في أوبوتشكا ووفاته في 18 فبراير 1963 في تبليسي، وسيرته شاعرا وكاتبا لاكيا ومنوّرا وثوريا وعضوا في الحزب الشيوعي منذ 1918 ورئيسا بالنيابة لحكومة داغستان الثورية ووزيرا للتعليم والمالية فيها؛ ولا يرد في متنها أي ذكر لدينه الشخصي."
  en: "Russian Wikipedia article on Said Ibragimovich Gabiev; used for entity facts only. It gives his birth on 28 May 1882 at Opochka and his death on 18 February 1963 at Tbilisi, and his biography as a Lak poet, writer, enlightener and revolutionary, Communist Party member from 1918, acting head of the Dagestan revolutionary government and its commissar of education and of finance; its text contains no statement of his personal religion."
