summary:
  ar: "مقالة ويكيبيديا الروسية عن سعيد إبراهيموفيتش غابييف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 28 مايو 1882 في أوبوتشكا ووفاته في 18 فبراير 1963 في تبليسي، وسيرته شاعرا وكاتبا لاكيا ومنوّرا وثوريا وعضوا في الحزب الشيوعي منذ 1918 ورئيسا بالنيابة لحكومة داغستان الثورية ووزيرا للتعليم والمالية فيها؛ ولا يرد في متنها أي ذكر لدينه الشخصي."
  en: "Russian Wikipedia article on Said Ibragimovich Gabiev; used for entity facts only. It gives his birth on 28 May 1882 at Opochka and his death on 18 February 1963 at Tbilisi, and his biography as a Lak poet, writer, enlightener and revolutionary, Communist Party member from 1918, acting head of the Dagestan revolutionary government and its commissar of education and of finance; its text contains no statement of his personal religion."
  es: "Artículo de la Wikipedia rusa sobre Said Ibragimovich Gabiev; utilizado únicamente para datos biográficos. Indica su nacimiento el 28 de mayo de 1882 en Opochka y su fallecimiento el 18 de febrero de 1963 en Tiflis, así como su biografía como poeta, escritor, ilustrado y revolucionario lak, miembro del Partido Comunista desde 1918, jefe interino del gobierno revolucionario de Daguestán y comisario de educación y finanzas; el texto no menciona su religión personal."
  fr: "Article de Wikipédia en russe sur Saïd Ibragimovitch Gabiev; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 28 mai 1882 à Opochka et sa mort le 18 février 1963 à Tbilissi, et retrace sa biographie: poète, écrivain, intellectuel et révolutionnaire lak, membre du Parti communiste à partir de 1918, chef par intérim du gouvernement révolutionnaire du Daghestan et commissaire à l’éducation et aux finances de ce dernier; le texte ne mentionne pas sa religion."
  ur: "Said Ibragimovich Gabiev پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 28 مئی 1882 کو اوپوچکا میں ان کی پیدائش اور 18 فروری 1963 کو تبلیسی میں ان کی موت، اور ان کی سوانح حیات بطور لک شاعر، مصنف، روشن خیال اور انقلابی، 1918 سے کمیونسٹ پارٹی کے رکن، داغستان کی انقلابی حکومت کے قائم مقام سربراہ اور اس کے کمشنر برائے تعلیم اور مالیات؛ اس کے متن میں اس کے ذاتی مذہب کا کوئی بیان نہیں ہے۔"
