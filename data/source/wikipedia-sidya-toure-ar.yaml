summary:
  ar: "مقالة ويكيبيديا العربية عن سيديا توري؛ تُستخدم لوقائع الكيان فقط. بذرة تذكر ولادته سنة 1945، ورئاسته الوزراء (1996–1999)، ورئاسته اتحاد القوى الجمهورية، وعودته إلى غينيا في سبتمبر 2021 بعد عشرة أشهر في المنفى. لا تسجّل وفاته في سبتمبر 2026 بعد، ولا تذكر دينه."
  en: "Arabic Wikipedia article on Sidya Touré; used for entity facts only. A stub: it gives his birth in 1945, his premiership (1996–1999), his presidency of the Union of Republican Forces, and his return to Guinea in September 2021 after ten months in exile. It does not yet record his September 2026 death, and it says nothing about his religion."
  es: "Artículo en árabe de la Wikipedia sobre Sidya Touré; utilizado únicamente para datos sobre la persona. Esbozo: indica su nacimiento en 1945, su mandato como primer ministro (1996-1999), su presidencia de la Unión de Fuerzas Republicanas y su regreso a Guinea en septiembre de 2021 tras diez meses de exilio. Aún no registra su fallecimiento en septiembre de 2026 ni menciona su religión."
  fr: "Article Wikipédia en arabe sur Sidya Touré; utilisé uniquement pour les informations biographiques. Ébauche: il mentionne sa naissance en 1945, son mandat de Premier ministre (1996-1999), sa présidence de l’Union des forces républicaines et son retour en Guinée en septembre 2021 après dix mois d’exil. Son décès en septembre 2026 n’y est pas encore mentionné, et sa religion n’est pas précisée."
  ur: "Sidya Touré پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک سٹب: یہ 1945 میں اس کی پیدائش، اس کی پریمیئر شپ (1996-1999)، ان کی یونین آف ریپبلکن فورسز کی صدارت، اور دس ماہ کی جلاوطنی کے بعد ستمبر 2021 میں گنی واپسی ہے۔ یہ ابھی تک اس کی ستمبر 2026 کی موت کو ریکارڈ نہیں کرتا ہے، اور اس میں اس کے مذہب کے بارے میں کچھ نہیں کہا گیا ہے۔"
  tr: "Sidia Touré hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bir taslakta 1945'teki doğumu, başbakanlığı (1996–1999), Cumhuriyetçi Güçler Birliği başkanlığı ve on aylık sürgünün ardından Eylül 2021'de Gine'ye dönüşü bahsedilmektedir. Eylül 2026'daki ölümü henüz kaydedilmemiştir ve dini de belirtilmemiştir."
  id: "Artikel Wikipedia berbahasa Arab tentang Sidia Touré; digunakan hanya untuk fakta entitas. Sebuah stub menyebutkan kelahirannya pada tahun 1945, masa jabatannya sebagai perdana menteri (1996–1999), kepresidenannya di Union of Republican Powers, dan kepulangannya ke Guinea pada September 2021 setelah sepuluh bulan di pengasingan. Kematiannya pada September 2026 belum tercatat, juga tidak disebutkan agamanya."
