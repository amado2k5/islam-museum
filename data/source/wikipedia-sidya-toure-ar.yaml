  ar: "مقالة ويكيبيديا العربية عن سيديا توري؛ تُستخدم لوقائع الكيان فقط. بذرة تذكر ولادته سنة 1945، ورئاسته الوزراء (1996–1999)، ورئاسته اتحاد القوى الجمهورية، وعودته إلى غينيا في سبتمبر 2021 بعد عشرة أشهر في المنفى. لا تسجّل وفاته في سبتمبر 2026 بعد، ولا تذكر دينه."
  en: "Arabic Wikipedia article on Sidya Touré; used for entity facts only. A stub: it gives his birth in 1945, his premiership (1996–1999), his presidency of the Union of Republican Forces, and his return to Guinea in September 2021 after ten months in exile. It does not yet record his September 2026 death, and it says nothing about his religion."
