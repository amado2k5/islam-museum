summary:
  ar: "مقال موسوعي عن أنس كانتر فريدوم ⁦(مواليد 1992)⁩، لاعب كرة السلة التركي الأمريكي والناشط، المولود باسم أنس كانتر في زيورخ."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth in Zurich, Switzerland, on 20 May 1992 as Enes Kanter, his eleven NBA seasons from Utah's third overall pick in 2011, his description as a practicing Muslim who wrote in 2019 about Ramadan fasting during the playoffs, and his American citizenship and legal name change of 29 November 2021."
  es: "Artículo de enciclopedia editado por la comunidad, recuperado en su totalidad en la revisión indicada; en él se menciona su nacimiento en Zúrich, Suiza, el 20 de mayo de 1992 como Enes Kanter, sus once temporadas en la NBA desde que fue la tercera selección general de Utah en 2011, su descripción como musulmán practicante que escribió en 2019 sobre el ayuno de Ramadán durante los playoffs, y su ciudadanía estadounidense y cambio legal de nombre el 29 de noviembre de 2021."
  fr: "Article encyclopédique édité par la communauté, récupéré intégralement à la version indiquée; il donne sa naissance à Zurich, en Suisse, le 20 mai 1992 sous le nom d’Enes Kanter, ses onze saisons en NBA après avoir été sélectionné en troisième position par l’Utah en 2011, sa description comme musulman pratiquant qui a écrit en 2019 sur le jeûne du Ramadan pendant les séries éliminatoires, et sa citoyenneté américaine et son changement légal de nom le 29 novembre 2021."
  ur: "کمیونٹی میں ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظرثانی پر مکمل طور پر بازیافت کیا گیا؛ اس نے زیورخ، سوئٹزرلینڈ میں 20 مئی 1992 کو انیس کانٹر کے طور پر جنم لیا، 2011 میں یوٹاہ کے تیسرے مجموعی انتخاب سے اس کے گیارہ این بی اے سیزن، اس کی تفصیل ایک مشق کرنے والے مسلمان کے طور پر جس نے 2019 میں پلے آف کے دوران رمضان کے روزے رکھنے کے بارے میں لکھا، اور اس کی امریکی شہریت اور قانونی نام 2021 نومبر کو تبدیل ہوا۔"
