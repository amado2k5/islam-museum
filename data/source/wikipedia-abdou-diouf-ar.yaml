summary:
  ar: "مقالة ويكيبيديا العربية عن عبدو ضيوف؛ تُستخدم لوقائع الكيان فقط. حقل الدين في صندوقها فارغ، ومتنها يثني على تشجيعه التعليم العربي والإسلامي وتنظيم اللقاءات الإسلامية ويذكر فوزه بجائزة الملك فيصل العالمية لخدمة الإسلام سنة 1998، وهي أعمال دولة وتكريم لا شهادة شخصية؛ وتصنّفه في فئتي مسلمي السنغال ومسلمي السنغال السنة."
  en: "Arabic Wikipedia article on Abdou Diouf; used for entity facts only. Its infobox religion field is empty. Its text praises his encouragement of Arabic and Islamic education and his organisation of Islamic conferences, and records his 1998 King Faisal International Prize for Service to Islam — state acts and an honour, not a personal attestation. It files him under Senegalese Muslims and Senegalese Sunni Muslims."
  es: "Artículo de Wikipedia en árabe sobre Abdou Diouf; utilizado únicamente para datos sobre la entidad. El campo de religión de su ficha informativa está vacío. El texto elogia su fomento de la educación árabe e islámica y su organización de conferencias islámicas, y menciona el Premio Internacional Rey Faisal de 1998 al Servicio al Islam, un reconocimiento oficial y honorífico, no una declaración personal. Lo clasifica dentro de la categoría de musulmanes senegaleses y musulmanes sunitas senegaleses."
  fr: "L'article Wikipédia en arabe consacré à Abdou Diouf ne contient que des informations factuelles. Son infobox « Religion » est vide. Le texte loue son engagement en faveur de l'éducation arabe et islamique, ainsi que l'organisation de conférences islamiques. Il mentionne également le Prix international Roi Fayçal pour services rendus à l'islam, qui lui a été décerné en 1998 – une distinction honorifique et non une reconnaissance personnelle. Il est classé dans les catégories « Musulmans sénégalais » et « Musulmans sunnites sénégalais »."
  ur: "عبدو دیوف پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا انفو باکس مذہب کا میدان خالی ہے۔ اس کا متن عربی اور اسلامی تعلیم کے حوالے سے ان کی حوصلہ افزائی اور اسلامی کانفرنسوں کی تنظیم کی تعریف کرتا ہے، اور اس کا 1998 کا شاہ فیصل انٹرنیشنل پرائز فار سروس ٹو اسلام - ریاستی اقدامات اور اعزاز کو ریکارڈ کرتا ہے، ذاتی تصدیق نہیں۔ یہ اسے سینیگالی مسلمانوں اور سینیگالی سنی مسلمانوں کے تحت فائل کرتا ہے۔"
  tr: "Abdo Diouf hakkında Arapça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Kutudaki din alanı boştur ve içeriği, Arap ve İslami eğitimi teşvik etmesini, İslami toplantıların organizasyonunu övmektedir ve 1998'de devlet eylemi ve onuru olan Kral Faysal Uluslararası İslam'a Hizmet Ödülü'nü kazanmasını belirtir; bu ödül kişisel bir sertifika değil, devlet eylemi ve onurudur; onu Senegal'in Müslümanları ve Sünni Müslümanları kategorilerine yerleştirir."
  id: "Artikel Wikipedia berbahasa Arab tentang Abdo Diouf hanya digunakan untuk fakta entitas. Bidang agama dalam kotaknya kosong, dan isinya memuji dorongannya terhadap pendidikan Arab dan Islam serta penyelenggaraan pertemuan Islam, serta menyebutkan kemenangannya Penghargaan Internasional King Faisal untuk Pengabdian kepada Islam pada tahun 1998, yang merupakan tindakan negara dan kehormatan, bukan sertifikat pribadi; artikel tersebut mengklasifikasikannya dalam kategori Muslim Senegal dan Muslim Sunni Senegal."
