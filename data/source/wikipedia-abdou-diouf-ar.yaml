summary:
  ar: "مقالة ويكيبيديا العربية عن عبدو ضيوف؛ تُستخدم لوقائع الكيان فقط. حقل الدين في صندوقها فارغ، ومتنها يثني على تشجيعه التعليم العربي والإسلامي وتنظيم اللقاءات الإسلامية ويذكر فوزه بجائزة الملك فيصل العالمية لخدمة الإسلام سنة 1998، وهي أعمال دولة وتكريم لا شهادة شخصية؛ وتصنّفه في فئتي مسلمي السنغال ومسلمي السنغال السنة."
  en: "Arabic Wikipedia article on Abdou Diouf; used for entity facts only. Its infobox religion field is empty. Its text praises his encouragement of Arabic and Islamic education and his organisation of Islamic conferences, and records his 1998 King Faisal International Prize for Service to Islam — state acts and an honour, not a personal attestation. It files him under Senegalese Muslims and Senegalese Sunni Muslims."
