summary:
  ar: مقالة ويكيبيديا الإنجليزية عن أحمد حسين؛ تُستخدم لوقائع الكيان فقط. تعطي، مستندة إلى مكتبة البرلمان، ميلاده في مقديشو سنة 1976 وانتقاله إلى كندا سنة 1993؛ ولا تسمّي ديانة، وتصنيفاتها تضعه ضمن «مسلمي الصومال» و«مسلمي كندا».
  en: English Wikipedia article on Ahmed Hussen; used for entity facts only. Citing the Library of Parliament, it gives his birth in Mogadishu in 1976 and his move to Canada in 1993; it names no religion, its categories filing him under 'Somali Muslims' and 'Canadian Muslims'.
  es: "Artículo de la Wikipedia en inglés sobre Ahmed Hussen; utilizado únicamente para datos sobre la persona. Citando a la Biblioteca del Parlamento, indica que nació en Mogadiscio en 1976 y se mudó a Canadá en 1993; no menciona su religión, clasificándolo como «musulmán somalí» y «musulmán canadiense»."
  fr: "Article de Wikipédia en anglais sur Ahmed Hussen; utilisé uniquement pour les informations le concernant. Citant la Bibliothèque du Parlement, il indique sa naissance à Mogadiscio en 1976 et son arrivée au Canada en 1993; il ne mentionne aucune religion, le classant dans les catégories « Musulmans somaliens » et « Musulmans canadiens »."
  ur: "احمد حسین پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ پارلیمنٹ کی لائبریری کا حوالہ دیتے ہوئے، یہ 1976 میں موغادیشو میں ان کی پیدائش اور 1993 میں کینیڈا منتقل ہوا؛ اس نے کسی مذہب کا نام نہیں لیا، اس کے زمرے اسے 'صومالی مسلمان' اور 'کینیڈین مسلمان' کے تحت درج کر رہے ہیں۔"
  tr: "Ahmed Hüseyin hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Parlamento Kütüphanesi'ne dayanarak, 1976'da Mogadişu'da doğduğunu ve 1993'te Kanada'ya taşındığını anlatır; bir din adı verilmez ve sınıflandırmaları onu \"Somali Müslümanları\" ve \"Kanadalı Müslümanlar\" arasında koyar."
  id: "Artikel Wikipedia bahasa Inggris tentang Ahmed Hussein; digunakan hanya untuk fakta entitas. Berdasarkan Perpustakaan Parlemen, artikel ini mencatat kelahirannya di Mogadishu pada tahun 1976 dan kepindahannya ke Kanada pada tahun 1993; artikel ini tidak menyebutkan agama manapun, dan klasifikasinya menempatkannya di antara \"Muslim Somalia\" dan \"Muslim Kanada.\""
