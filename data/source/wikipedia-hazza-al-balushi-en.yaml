  ar: "مقالة ويكيبيديا الإنجليزية عن هزاع البلوشي، القارئ العُماني المولود في لوى سنة 1995؛ تُستخدم لوقائع الكيان فقط: تاريخ ميلاده الكامل ودراسته في جامعة السلطان قابوس وإجازته بالقراءات من مجمع القرآن الكريم بالشارقة سنة 2025."
  en: "English Wikipedia article on Hazaa Al-Balushi, the Omani Qur'an reciter born in Liwa in 1995; used for entity facts only: his full birth date, his degree at Sultan Qaboos University, and his 2025 ijaza in the Qur'anic readings from the Sharjah Holy Qur'an Academy."
