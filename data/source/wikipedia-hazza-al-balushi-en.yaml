reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Fetched by revision id through the MediaWiki API on 26 October 2026; the returned revision id equals the recorded one. The article gives Hazza bin Abdullah bin Salem Al Balushi, born 10 April 1995 in Liwa, Al Batinah North Governorate, Oman; memorisation begun at seven and completed at thirteen; a degree in economics and political science at Sultan Qaboos University; fame from 2013; and a March 2025 certificate from the Sharjah Holy Qur'an Academy for completing the Qur'an in the various readings, with an ijaza. Its text names no school or sect for him; its uncited infobox gives 'sect: Sunni' and 'jurisprudence: Shafi'i', which are recorded here as infobox values only."
