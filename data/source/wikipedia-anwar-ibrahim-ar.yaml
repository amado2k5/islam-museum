summary:
  ar: "مقالة ويكيبيديا العربية عن أنور إبراهيم؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 10 أغسطس 1947 وتروي صعوده وزيرا للمالية ونائبا لرئيس الوزراء في عهد مهاتير محمد، وخلاف سنة 1998 وسقوطه، وعودته رئيسا للوزراء بعد انتخابات نوفمبر 2022."
  en: "Arabic Wikipedia article on Anwar Ibrahim; used for entity facts only. It confirms his birth on 10 August 1947 and recounts his rise as finance minister and deputy prime minister under Mahathir Mohamad, the rift and fall of 1998, and his return as prime minister after the November 2022 general election."
  es: "Artículo en árabe de la Wikipedia sobre Anwar Ibrahim; utilizado únicamente para datos sobre la persona. Confirma su nacimiento el 10 de agosto de 1947 y relata su ascenso como ministro de finanzas y viceprimer ministro bajo el mandato de Mahathir Mohamad, la ruptura y caída del gobierno en 1998, y su regreso como primer ministro tras las elecciones generales de noviembre de 2022."
  fr: "Article de Wikipédia en arabe sur Anwar Ibrahim; utilisé uniquement à des fins d’information sur l’entité. Il confirme sa naissance le 10 août 1947 et retrace son ascension au poste de ministre des Finances et de vice-Premier ministre sous Mahathir Mohamad, la crise et la chute du gouvernement en 1998, ainsi que son retour au poste de Premier ministre après les élections générales de novembre 2022."
  ur: "انور ابراہیم پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 10 اگست 1947 کو ان کی پیدائش کی تصدیق کرتا ہے اور مہاتیر محمد کے تحت وزیر خزانہ اور نائب وزیر اعظم کے طور پر ان کے عروج، 1998 کی دراڑ اور زوال اور نومبر 2022 کے عام انتخابات کے بعد وزیر اعظم کے طور پر ان کی واپسی کا ذکر کرتا ہے۔"
