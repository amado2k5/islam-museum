label:
  ar: "فرج الله أحمد يوسف، الآيات القرآنية على المسكوكات الإسلامية: دراسة مقارنة ⁦(الرياض: مركز الملك فيصل للبحوث والدراسات الإسلامية، 1423هـ/2003م)⁩"
  en: "Farajallah Ahmad Yusuf, al-Ayat al-qur'aniyya ala al-maskukat al-islamiyya: dirasa muqarana (Riyadh: King Faisal Center for Research and Islamic Studies, 1423/2003)"
summary:
  ar: "دراسة في الآيات القرآنية المنقوشة على النقود الإسلامية منذ تعريب السكة سنة 77هـ، تتبع 72 آية وتنشر 76 قطعة نقدية لأول مرة، أصلها رسالة دكتوراه في جامعة القاهرة سنة 1418هـ/1997م."
  en: "A study of Qur'anic verses inscribed on Islamic coins from the Arabisation of coinage in 77 AH, following 72 verses and publishing 76 coins for the first time; originally a doctoral thesis at Cairo University, 1418/1997."
  es: "Un estudio de versículos coránicos inscritos en monedas islámicas desde la arabización de la acuñación en el año 77 de la Hégira, que analiza 72 versículos y publica 76 monedas por primera vez; originalmente una tesis doctoral en la Universidad de El Cairo, 1418/1997."
  fr: "Une étude des versets coraniques inscrits sur les pièces de monnaie islamiques de l'arabisation de la monnaie en 77 AH, suivant 72 versets et publiant 76 pièces pour la première fois; à l'origine une thèse de doctorat à l'Université du Caire, 1418/1997."
  ur: "77 ہجری میں سکوں کی عرب کاری سے اسلامی سکوں پر کندہ قرآنی آیات کا مطالعہ، 72 آیات کے بعد اور پہلی بار 76 سکوں کی اشاعت؛ اصل میں قاہرہ یونیورسٹی میں ڈاکٹریٹ کا مقالہ، 1418/1997۔"
  tr: "77 Hicri yılında, paraların Araplaştırılmasından bu yana İslami paralara kazınmış Kur'an ayetlerinin incelenmesi, 72 ayeti takip ederek ilk kez 76 madeni para yayımlanmıştır; başlangıçta 1418 Hicri / 1997 yılında Kahire Üniversitesi'nde doktora tezi olarak yazılmıştır."
  id: "Studi tentang ayat-ayat Al-Qur'an yang terukir pada koin Islam sejak Arabisasi koin pada tahun 77 H, mengikuti 72 ayat dan menerbitkan 76 koin untuk pertama kalinya, awalnya merupakan disertasi doktoral di Universitas Kairo pada tahun 1418 H / 1997 M."
