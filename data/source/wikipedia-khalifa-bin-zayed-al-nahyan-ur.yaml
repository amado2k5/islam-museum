  ar: "مقالة ويكيبيديا الأردية عن خليفة بن زايد آل نهيان؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في قلعة المويجعي بالعين في 7 سبتمبر 1948، ودراسته في أكاديمية ساندهيرست العسكرية، ومناصبه من ممثل الحاكم في المنطقة الشرقية (1966) وولي عهد أبوظبي إلى رئيس وزراء أبوظبي ونائب رئيس وزراء الاتحاد. ولا يرد فيها أي قيمة للدين."
  en: "Urdu Wikipedia article on Khalifa bin Zayed Al Nahyan; used for entity facts only. It gives his birth at Al Muwaiji fort in Al Ain on 7 September 1948, his military education at Sandhurst, and his offices from ruler's representative in the Eastern Region (1966) and crown prince of Abu Dhabi to prime minister of Abu Dhabi and deputy prime minister of the UAE. It carries no religion value."
