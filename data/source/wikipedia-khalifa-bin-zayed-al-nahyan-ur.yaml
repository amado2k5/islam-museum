summary:
  ar: "مقالة ويكيبيديا الأردية عن خليفة بن زايد آل نهيان؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في قلعة المويجعي بالعين في 7 سبتمبر 1948، ودراسته في أكاديمية ساندهيرست العسكرية، ومناصبه من ممثل الحاكم في المنطقة الشرقية (1966) وولي عهد أبوظبي إلى رئيس وزراء أبوظبي ونائب رئيس وزراء الاتحاد. ولا يرد فيها أي قيمة للدين."
  en: "Urdu Wikipedia article on Khalifa bin Zayed Al Nahyan; used for entity facts only. It gives his birth at Al Muwaiji fort in Al Ain on 7 September 1948, his military education at Sandhurst, and his offices from ruler's representative in the Eastern Region (1966) and crown prince of Abu Dhabi to prime minister of Abu Dhabi and deputy prime minister of the UAE. It carries no religion value."
  es: "Artículo de Wikipedia en urdu sobre Khalifa bin Zayed Al Nahyan; se utiliza únicamente para datos sobre la persona. Indica su nacimiento en el fuerte Al Muwaiji en Al Ain el 7 de septiembre de 1948, su formación militar en Sandhurst y sus cargos, desde representante del gobernante en la Región Oriental (1966) y príncipe heredero de Abu Dabi hasta primer ministro de Abu Dabi y viceprimer ministro de los Emiratos Árabes Unidos. No tiene valor religioso."
  fr: "L'article de Wikipédia en ourdou consacré à Khalifa bin Zayed Al Nahyan, utilisé uniquement à des fins d'information sur l'entité, mentionne sa naissance au fort Al Muwaiji à Al Ain le 7 septembre 1948, sa formation militaire à Sandhurst, ainsi que ses fonctions successives de représentant du souverain dans la région orientale (1966), de prince héritier d'Abou Dhabi, de Premier ministre d'Abou Dhabi et de vice-Premier ministre des Émirats arabes unis. Il ne présente aucune dimension religieuse."
