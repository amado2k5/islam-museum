  ar: "مقالة ويكيبيديا العربية عن المنشد السوري محمد مصطفى أبو راتب؛ لوقائع الكيان فقط: مولده في حلب في 1962، ودراسته في معهد الموسيقى العربية بحلب والإخراج التلفزيوني في عمّان، ورئاسته فرقة الهدى الدولية، وجائزة 2006، وتوقيفه وترحيله من الولايات المتحدة في 2010؛ وتستند إلى Marshall Cavendish (2010) وmlive وArab American News."
