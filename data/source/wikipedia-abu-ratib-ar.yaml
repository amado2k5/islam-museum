summary:
  ar: "مقالة ويكيبيديا العربية عن المنشد السوري محمد مصطفى أبو راتب؛ لوقائع الكيان فقط: مولده في حلب في 1962، ودراسته في معهد الموسيقى العربية بحلب والإخراج التلفزيوني في عمّان، ورئاسته فرقة الهدى الدولية، وجائزة 2006، وتوقيفه وترحيله من الولايات المتحدة في 2010؛ وتستند إلى Marshall Cavendish (2010) وmlive وArab American News."
  en: "Arabic Wikipedia article on the Syrian munshid Muhammad Mustafa Abu Ratib; entity facts only: birth in Aleppo in 1962, study at Aleppo's institute of Arabic music and television directing in Amman, his leadership of the al-Huda international ensemble, a 2006 award, and his 2010 arrest and departure from the United States; it cites Marshall Cavendish (2010), mlive and the Arab American News."
  es: "Artículo en la Wikipedia en árabe sobre el munshid sirio Muhammad Mustafa Abu Ratib; solo datos sobre la persona: nacimiento en Alepo en 1962, estudios en el instituto de música árabe de Alepo y dirección de televisión en Amán, su liderazgo del conjunto internacional al-Huda, un premio en 2006 y su arresto y salida de los Estados Unidos en 2010; cita a Marshall Cavendish (2010), mlive y Arab American News."
  fr: "Article de Wikipédia en arabe sur le munshid syrien Muhammad Mustafa Abu Ratib; faits concernant l’entité uniquement: naissance à Alep en 1962, études à l’Institut de musique arabe d’Alep et à la réalisation télévisuelle à Amman, sa direction de l’ensemble international al-Huda, un prix en 2006, et son arrestation et son départ des États-Unis en 2010; il cite Marshall Cavendish (2010), mlive et Arab American News."
  ur: "عربی ویکیپیڈیا مضمون شامی منشد محمد مصطفیٰ ابو رتیب پر؛ صرف ہستی کے حقائق: 1962 میں حلب میں پیدائش، عمان میں حلب کے انسٹی ٹیوٹ آف عربی میوزک اور ٹیلی ویژن کی ہدایت کاری، الہدیٰ بین الاقوامی تنظیم کی قیادت، 2006 کا ایوارڈ، اور 2010 میں ان کی گرفتاری اور امریکہ سے روانگی؛ اس میں مارشل کیوینڈش (2010)، ملی لائیو اور عرب امریکن نیوز کا حوالہ دیا گیا ہے۔"
  tr: "Suriyeli vokalist Muhammed Mustafa Abu Rateb hakkında Arapça Wikipedia makalesi; sadece gerçekler için: 1962'de Halep'te doğması, Halep Arap Müzik Enstitüsü'ndeki eğitimi, Amman'da televizyon yönetmenliği, Uluslararası Al-Huda Band'in başkanlığı, 2006 ödülü, 2010'da Amerika Birleşik Devletleri'nden tutuklanması ve sınır dışı edilmesi; ve Marshall Cavendish (2010), mlive ve Arab American News'e dayanmaktadır."
  id: "Artikel Wikipedia bahasa Arab tentang vokalis Suriah Muhammad Mustafa Abu Rateb; hanya untuk fakta entitas: kelahirannya di Aleppo pada tahun 1962, studinya di Aleppo Institute of Arabic Music, penyutradaraan televisi di Amman, kepresidenannya di International Al-Huda Band, penghargaan tahun 2006, penangkapan dan deportasi dari Amerika Serikat pada tahun 2010; dan didasarkan pada Marshall Cavendish (2010), mlive, dan Arab American News."
