summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألبوم «Not Afraid to Stand Alone» لفرقة نيتف دين؛ لوقائع الكيان فقط: صدوره في نوفمبر 2007، وتسجيله في ميريلاند، وموضوعاته، ونسخته الصوتية، وقائمة أغانيه بضيوفها؛ تستند إلى متاجر ومراجعة في بلاك غروفز سنة 2009."
  en: "English Wikipedia article on Native Deen's album Not Afraid to Stand Alone; entity facts only: its release in November 2007, its recording in Maryland, its themes, its voice-only version and its track list with guests; it cites retailers and a 2009 review in Black Grooves."
  es: "Artículo de la Wikipedia en inglés sobre el álbum Not Afraid to Stand Alone de Native Deen; solo datos sobre la entidad: su lanzamiento en noviembre de 2007, su grabación en Maryland, sus temas, su versión solo vocal y su lista de canciones con invitados; cita a minoristas y una reseña de 2009 en Black Grooves."
  fr: "Article de Wikipédia en anglais sur l'album Not Afraid to Stand Alone de Native Deen; informations uniquement sur l'entité: sa sortie en novembre 2007, son enregistrement dans le Maryland, ses thèmes, sa version vocale uniquement et sa liste de titres avec des invités; il cite des détaillants et une critique de 2009 dans Black Grooves."
  ur: "مقامی دین کے البم پر انگریزی ویکیپیڈیا کا مضمون تنہا کھڑے ہونے سے خوفزدہ نہیں ہے۔ صرف ہستی کے حقائق: نومبر 2007 میں اس کی ریلیز، میری لینڈ میں اس کی ریکارڈنگ، اس کے تھیمز، اس کا صرف آواز والا ورژن اور مہمانوں کے ساتھ اس کی ٹریک لسٹ؛ یہ بلیک گرووز میں خوردہ فروشوں اور 2009 کے جائزے کا حوالہ دیتا ہے۔"
  tr: "Native Dean grubunun \"Not Afraid to Stand Alone\" albümü hakkında İngilizce Wikipedia makalesi; sadece entitif kayıtlar için: Kasım 2007'de Maryland'de kaydedilmiş albümün temaları, sesli versiyonu ve konuk listesi 2009'da Black Groves'ta yayımlanan mağazalar ve incelemeye dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang album \"Not Afraid to Stand Alone\" oleh band Native Dean; untuk entity records saja: perilisan pada November 2007, direkam di Maryland, tema-temanya, versi audionya, dan daftar tamunya didasarkan pada toko dan ulasan di Black Groves pada tahun 2009."
