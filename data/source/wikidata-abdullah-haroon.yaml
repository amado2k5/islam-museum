summary:
  ar: "عنصر ويكيداتا Q8704030 لسير عبد الله هارون: يذكر مولده في 1 يناير 1872 في كراتشي ووفاته فيها في 27 أبريل 1942، وزوجه نصرت عبد الله هارون، ودينه «الإسلام» بصورة عامة دون مذهب."
  en: "Wikidata item Q8704030 for Sir Abdullah Haroon: it gives his birth on 1 January 1872 at Karachi and his death there on 27 April 1942, his spouse as Nusrat Abdullah Haroon (Q6469906), and his religion as Islam generically, with no school."
  es: "Elemento de Wikidata Q8704030 para Sir Abdullah Haroon: indica que nació el 1 de enero de 1872 en Karachi y murió allí el 27 de abril de 1942, su cónyuge fue Nusrat Abdullah Haroon (Q6469906) y su religión fue el Islam en general, sin escuela."
  fr: "L'élément Wikidata Q8704030 pour Sir Abdullah Haroon: il indique sa naissance le 1er janvier 1872 à Karachi et sa mort au même endroit le 27 avril 1942, son épouse Nusrat Abdullah Haroon (Q6469906) et sa religion l'Islam en général, sans école."
  ur: "سر عبداللہ ہارون کے لیے Wikidata آئٹم Q8704030: یہ 1 جنوری 1872 کو کراچی میں ان کی پیدائش اور 27 اپریل 1942 کو ان کی موت، ان کی شریک حیات نصرت عبداللہ ہارون (Q6469906) کے طور پر، اور ان کا مذہب اسلام کے طور پر عام طور پر، کوئی اسکول نہیں ہے۔"
  tr: "Sir Abdullah Haroon Q8704030 Wikidata öğesi: 1 Ocak 1872'de Karaçi'de doğduğu ve 27 Nisan 1942'de orada öldüğü belirtilmektedir. Nusrat Abdullah Harun ile evliydi ve dini genellikle herhangi bir mezhep olmadan 'İslam' idi."
  id: "Elemen Wikidata Q8704030 Sir Abdullah Haroon: Ia disebutkan lahir pada 1 Januari 1872 di Karachi dan meninggal di sana pada 27 April 1942. Ia menikah dengan Nusrat Abdullah Haroon, dan agamanya umumnya adalah 'Islam' tanpa sekte."
