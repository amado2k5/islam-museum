reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 by its recorded revision id via the MediaWiki API, the returned id asserted equal before any claim was drawn. The article is flagged unsourced on its face. Its infobox gives his death as 4 January 1939, which is wrong on both day and year — a conflation with his brother's death date — against its own text and categories (died 1938) and against the English and Urdu articles and Wikidata (26 November 1938); it is not followed. Its categories pair his birth with 1290 AH and his death with 1357 AH."
