summary:
  ar: "مقالة ويكيبيديا العربية الموجزة غير الموثقة عن شوكت علي (1873–1938)؛ تُستخدم لوقائع الكيان فقط بحذر. تصفه بأنه زعيم مسلم هندي قاد حركة الخلافة في الهند وكان أخا محمد علي جوهر، وتذكر ولادته سنة 1873 في رامبور وتعليمه في جامعة عليكرة الإسلامية."
  en: "Short, unsourced Arabic Wikipedia stub on Shaukat Ali (1873–1938); used for entity facts only, with caution. It presents him as an Indian Muslim leader who led the Khilafat movement in India and was the brother of Muhammad Ali Jauhar, born in 1873 at Rampur and educated at Aligarh Muslim University."
  es: "Breve artículo de Wikipedia en árabe, sin fuentes, sobre Shaukat Ali (1873-1938); se utiliza únicamente para datos sobre la persona, con precaución. Lo presenta como un líder musulmán indio que dirigió el movimiento Khilafat en la India y era hermano de Muhammad Ali Jauhar, nacido en 1873 en Rampur y educado en la Universidad Musulmana de Aligarh."
  fr: "Brève ébauche de page Wikipédia en arabe, sans source, sur Shaukat Ali (1873-1938); à utiliser avec précaution uniquement pour des informations factuelles. Elle le présente comme un chef musulman indien ayant dirigé le mouvement Khilafat en Inde et frère de Muhammad Ali Jauhar, né en 1873 à Rampur et ayant fait ses études à l’université musulmane d’Aligarh."
  ur: "شوکت علی (1873–1938) پر مختصر، غیر منبع عربی ویکیپیڈیا اسٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، احتیاط کے ساتھ۔ یہ انہیں ایک ہندوستانی مسلم رہنما کے طور پر پیش کرتا ہے جس نے ہندوستان میں خلافت تحریک کی قیادت کی اور محمد علی جوہر کے بھائی تھے، جو 1873 میں رام پور میں پیدا ہوئے اور علی گڑھ مسلم یونیورسٹی میں تعلیم حاصل کی۔"
  tr: "Shaukat Ali (1873–1938) hakkında özlü Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için temkinli bir şekilde kullanılmıştır. Hindistan'da Hilafe hareketine liderlik eden ve Muhammed Ali Johar'ın kardeşi olan bir Hintli Müslüman lider olarak tanımlanır; 1873'te Rampur'da doğduğunu ve Aligarh İslam Üniversitesi'ndeki eğitimini belirtir."
  id: "Artikel Wikipedia bahasa Arab yang ringkas tentang Shaukat Ali (1873–1938); digunakan dengan hati-hati hanya untuk fakta entitas. Ia digambarkan sebagai pemimpin Muslim India yang memimpin gerakan Khilafa di India dan merupakan saudara dari Muhammad Ali Johar, menyebutkan kelahirannya pada tahun 1873 di Rampur dan pendidikannya di Universitas Islam Aligarh."
