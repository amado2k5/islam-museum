language: id
reliability_note: "An official provincial cultural-award profile, read on 15 November 2026. It states he was named best director at the Indonesian Film Festival in 2005 (Brownies) and 2007 (Get Married), that Ayat-Ayat Cinta (2008) drew 1.5 million viewers in its first nine days and screened in Malaysia and Singapore, and that he studied economics at the Indonesian Islamic University in Yogyakarta without completing it before moving to film studies at the Jakarta Art Institute."
