  ar: "ملف جائزة الثقافة الرسمي لإقليم يوجياكارتا عن هانونغ برامانتيو؛ يذكر جائزتيه لأفضل مخرج في مهرجان الفيلم الإندونيسي 2005 و2007 ونجاح «آيات آيات تشينتا» ودراسته للاقتصاد ثم السينما."
  en: "The Yogyakarta provincial cultural award's official profile of Hanung Bramantyo: it records his Indonesian Film Festival best-director awards of 2005 and 2007, the success of Ayat-Ayat Cinta, and his studies in economics and then film."
