label: { en: "Hanung Bramantyo — Yogyakarta provincial cultural award profile" }
summary:
  ar: "ملف جائزة الثقافة الرسمي لإقليم يوجياكارتا عن هانونغ برامانتيو؛ يذكر جائزتيه لأفضل مخرج في مهرجان الفيلم الإندونيسي 2005 و2007 ونجاح «آيات آيات تشينتا» ودراسته للاقتصاد ثم السينما."
  en: "The Yogyakarta provincial cultural award's official profile of Hanung Bramantyo: it records his Indonesian Film Festival best-director awards of 2005 and 2007, the success of Ayat-Ayat Cinta, and his studies in economics and then film."
  es: "El perfil oficial de Hanung Bramantyo, otorgado por el premio cultural provincial de Yogyakarta, recoge sus premios al mejor director en el Festival de Cine de Indonesia de 2005 y 2007, el éxito de Ayat-Ayat Cinta y sus estudios de economía y posteriormente de cine."
  fr: "Le profil officiel de Hanung Bramantyo pour le prix culturel provincial de Yogyakarta: il mentionne ses prix du meilleur réalisateur au Festival du film indonésien de 2005 et 2007, le succès d'Ayat-Ayat Cinta et ses études en économie puis en cinéma."
  ur: "یوگیکارتا صوبائی ثقافتی ایوارڈ کا ہنونگ برامانٹیو کا آفیشل پروفائل: اس میں 2005 اور 2007 کے انڈونیشین فلم فیسٹیول کے بہترین ہدایت کار کے ایوارڈز، آیات-آیات سنٹا کی کامیابی، اور معاشیات اور پھر فلم میں ان کی تعلیم کو ریکارڈ کیا گیا ہے۔"
  tr: "Hanong Pramanteau için Yogyakarta bölgesinin resmi kültür ödül dosyası; 2005 ve 2007 yıllarında Endonezya Film Festivali'nde En İyi Yönetmen dalında aldığı iki ödülden, \"Ayat Ayat Chinta\"nın başarısından ve ekonomi ile sinema alanındaki çalışmalarından bahsediliyor."
  id: "Berkas penghargaan budaya resmi wilayah Yogyakarta untuk Hanong Pramanteau; menyebutkan dua penghargaan Sutradara Terbaik di Festival Film Indonesia tahun 2005 dan 2007, serta kesuksesan \"Ayat Ayat Chinta,\" serta studinya di bidang ekonomi dan kemudian sinema."
title: "Profil Hanung Bramantyo"
