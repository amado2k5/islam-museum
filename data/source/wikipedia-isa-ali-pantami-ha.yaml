summary:
  ar: "مقالة ويكيبيديا الهوسا عن عيسى علي إبراهيم بنتامي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 20 أكتوبر 1972 في حي بنتامي بمدينة غومبي، وتعيينه وزيرا للاتصالات سنة 2019، وتصفه بأنه «عالم كبير من علماء السنة» دون أن تسمي مذهبا."
  en: "Hausa Wikipedia article on Isa Ali Ibrahim Pantami; used for entity facts only. It gives his birth on 20 October 1972 in the Pantami ward of Gombe city, his appointment as Minister of Communications in 2019, and describes him as a leading scholar of the Sunnah; it names no school for him."
  es: "Artículo de Wikipedia en hausa sobre Isa Ali Ibrahim Pantami; utilizado únicamente para datos sobre la persona. Indica que nació el 20 de octubre de 1972 en el barrio de Pantami de la ciudad de Gombe, su nombramiento como Ministro de Comunicaciones en 2019 y lo describe como un destacado erudito de la Sunnah; no menciona ninguna escuela a la que pertenezca."
  fr: "Article Wikipédia en haoussa sur Isa Ali Ibrahim Pantami; utilisé uniquement à titre informatif. Il indique sa naissance le 20 octobre 1972 dans le quartier Pantami de la ville de Gombe, sa nomination au poste de ministre des Communications en 2019 et le décrit comme un éminent érudit de la Sunna; aucune école n’est mentionnée."
  ur: "عیسیٰ علی ابراہیم پنتامی پر ہاؤسا ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 20 اکتوبر 1972 کو گومبے شہر کے پنتامی وارڈ میں ان کی پیدائش، 2019 میں مواصلات کے وزیر کے طور پر ان کی تقرری، اور انہیں سنت کے ایک سرکردہ عالم کے طور پر بیان کرتا ہے۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Hausa Wikipedia'da Isa Ali İbrahim Bentami hakkında; yalnızca varlığın gerçekleri için kullanılmıştır. 20 Ekim 1972'de Gombe şehrinin Bentami mahallesinde doğduğu ve 2019'da İletişim Bakanı olarak atandığı belirtilir; belirli bir mezhebin adını vermeden \"Sünni alimler arasında büyük bir bilgin\" olarak tanımlanır."
  id: "Artikel Wikipedia Hausa tentang Isa Ali Ibrahim Bentami; hanya digunakan untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya pada 20 Oktober 1972 di lingkungan Bentabami, kota Gombe, dan pengangkatannya sebagai Menteri Komunikasi pada 2019, menggambarkannya sebagai \"ulama besar di antara ulama Sunni\" tanpa menyebutkan sekte tertentu."
