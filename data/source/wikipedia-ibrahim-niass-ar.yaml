  ar: "مقالة ويكيبيديا العربية عن إبراهيم إنياس الكولخي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته على يد والده الحاج عبد الله إنياس وإجازات العلماء له، ومنها إجازة أحمد سكيرج، وينسب إليه صندوق معلوماتها: مالكي المذهب، ومن أهل السنة والجماعة الأشاعرة في العقيدة."
  en: "Arabic Wikipedia article on Ibrahim Niass al-Kawlakhi; used for entity facts only. It recounts his upbringing under his father al-Hajj Abdullah Niass and the ijazas granted to him, including that of Ahmed Skirej; its infobox gives his jurisprudence as Maliki and his creed as of Ahl al-Sunna wa'l-Jama'a, the Ash'aris."
