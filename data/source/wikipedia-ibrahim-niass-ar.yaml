summary:
  ar: "مقالة ويكيبيديا العربية عن إبراهيم إنياس الكولخي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته على يد والده الحاج عبد الله إنياس وإجازات العلماء له، ومنها إجازة أحمد سكيرج، وينسب إليه صندوق معلوماتها: مالكي المذهب، ومن أهل السنة والجماعة الأشاعرة في العقيدة."
  en: "Arabic Wikipedia article on Ibrahim Niass al-Kawlakhi; used for entity facts only. It recounts his upbringing under his father al-Hajj Abdullah Niass and the ijazas granted to him, including that of Ahmed Skirej; its infobox gives his jurisprudence as Maliki and his creed as of Ahl al-Sunna wa'l-Jama'a, the Ash'aris."
  es: "Artículo de Wikipedia en árabe sobre Ibrahim Niass al-Kawlakhi; Se utiliza únicamente para hechos de entidades. Relata su educación bajo la dirección de su padre al-Hajj Abdullah Niass y las ijazas que se le otorgaron, incluida la de Ahmed Skirej; su cuadro de información brinda su jurisprudencia como Maliki y su credo como Ahl al-Sunna wa'l-Jama'a, los Ash'aris."
  fr: "Article Wikipédia en arabe sur Ibrahim Niass al-Kawlakhi; utilisé uniquement pour les faits d’entité. Il raconte son éducation sous la direction de son père al-Hajj Abdullah Niass et les ijazas qui lui ont été accordées, dont celle d'Ahmed Skirej; son infobox donne sa jurisprudence en tant que Maliki et son credo depuis Ahl al-Sunna wa'l-Jama'a, les Ash'aris."
  ur: "ابراہیم نیاس الکولخی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پرورش اپنے والد الحاج عبداللہ نیاس کے ماتحت ہوئی اور انہیں عطا کیے گئے اعجازوں کا ذکر ہے، بشمول احمد سکریج؛ اس کا معلوماتی خانہ ان کا فقہ مالکی اور عقیدہ اہل السنۃ والجماعۃ اشعری کے طور پر دیتا ہے۔"
  tr: "İbrahim İnyas el-Kulkhi hakkında Arapça Vikipedi makalesi yalnızca varlığın olayları için kullanılmıştır. Babası Hac Abdullah İneas altında yetiştirilmesini ve alimlerin onun için yazdığı icazeleri, özellikle Ahmed Skirj'in ijazesini anlatır. Bilgi kutusu ona atfedilir: Maliki el-Medhab ve o, mezhep olarak Aş'ari Sünni alimleri arasındaydı."
  id: "Artikel Wikipedia berbahasa Arab tentang Ibrahim Inias Al-Kulkhi hanya digunakan untuk peristiwa entitas tersebut. Artikel ini menceritakan masa kecilnya di bawah ayahnya, Hajj Abdullah Ineas, dan ijazah para ulama untuknya, termasuk ijazah Ahmad Skirj. Kotak informasinya dikaitkan dengan dirinya: Maliki al-Madhhab, dan ia termasuk di antara ulama Sunni Ash'ari dalam agama."
