reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 at the recorded revision, fetched by revision id via the MediaWiki API and the returned id asserted equal. A long devotional biography resting on Tijani sources (Al Jazeera's encyclopedia entry and the order's own site among them). Its lead dates him 7 November 1900 - 24 July 1975, while its text dates his birth to Thursday 15 Rajab 1318 AH — which converts to 8 November 1900, the date the English and French articles and Wikidata give; the record follows 8 November 1900 - 26 July 1975 and states the Arabic variants in the date notes. The Maliki and Ash'ari values stand in its infobox; its text names no school for him."
