reliability_note: "University-press scholarly edition of Ruete's own writings with an editorial biography. Used here as one of the two independent attestations of her baptism and conversion to Christianity at Aden, and to corroborate her dates, marriage and death. Publisher's description and the edition's bibliographic data checked on 25 October 2026."
