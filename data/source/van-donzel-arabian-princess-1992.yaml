label: { en: "E. J. van Donzel (ed.), An Arabian Princess Between Two Worlds (Brill, 1992)" }
summary:
  ar: "طبعة علمية بتحقيق إ. ج. فان دونزل ⁦(بريل، 1992)⁩ لكتابات سلمة بنت سعيد / إميلي رويته، تتضمن سيرة قصيرة لها ولابنها رودولف سعيد رويته وترجمة إنجليزية جديدة لمذكراتها ونصوص «رسائل إلى الوطن» و«تتمات المذكرات» و«عادات سورية واستعمالاتها»؛ تذكر سيرتها أنها وُلدت في زنجبار في 30 أغسطس 1844، وفرّت سنة 1866 إلى عدن حيث تعمّدت باسم إميلي المسيحي وتزوجت التاجر الألماني رودولف هاينريش رويته، وتوفيت في يينا سنة 1924."
  en: "E. J. van Donzel's scholarly edition (Brill, 1992) of the writings of Salme bint Said / Emily Ruete, containing a short biography of her and of her son Rudolph Said-Ruete, a new English translation of her Memoirs, and her Letters Home, Sequels to the Memoirs and Syrian Customs and Usages; its biography states that she was born at Zanzibar on 30 August 1844, fled in 1866 to Aden where she was baptized with the Christian name Emily and married the German merchant Rudolph Heinrich Ruete, and died at Jena in 1924."
  es: "La edición académica de EJ van Donzel (Brill, 1992) de los escritos de Salme bint Said / Emily Ruete, que contiene una breve biografía de ella y de su hijo Rudolph Said-Ruete, una nueva traducción al inglés de sus Memorias y sus Cartas a casa, Secuelas de las Memorias y Costumbres y usos sirios; su biografía afirma que nació en Zanzíbar el 30 de agosto de 1844, huyó en 1866 a Adén, donde fue bautizada con el nombre cristiano de Emily y se casó con el comerciante alemán Rudolph Heinrich Ruete, y murió en Jena en 1924."
  fr: "L'édition savante d'EJ van Donzel (Brill, 1992) des écrits de Salme bint Said / Emily Ruete, contenant une courte biographie d'elle et de son fils Rudolph Said-Ruete, une nouvelle traduction anglaise de ses Mémoires, ainsi que ses Lettres à sa famille, les suites des Mémoires et les Coutumes et usages syriens; sa biographie indique qu'elle est née à Zanzibar le 30 août 1844, s'est enfuie en 1866 à Aden où elle a été baptisée sous le nom chrétien d'Emily et a épousé le marchand allemand Rudolph Heinrich Ruete, et est décédée à Jena en 1924."
title: "An Arabian Princess Between Two Worlds: Memoirs, Letters Home, Sequels to the Memoirs, Syrian Customs and Usages"
