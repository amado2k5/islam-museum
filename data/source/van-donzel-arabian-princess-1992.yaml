summary:
  ar: "طبعة علمية بتحقيق إ. ج. فان دونزل (بريل، 1992) لكتابات سلمة بنت سعيد / إميلي رويته، تتضمن سيرة قصيرة لها ولابنها رودولف سعيد رويته وترجمة إنجليزية جديدة لمذكراتها ونصوص «رسائل إلى الوطن» و«تتمات المذكرات» و«عادات سورية واستعمالاتها»؛ تذكر سيرتها أنها وُلدت في زنجبار في 30 أغسطس 1844، وفرّت سنة 1866 إلى عدن حيث تعمّدت باسم إميلي المسيحي وتزوجت التاجر الألماني رودولف هاينريش رويته، وتوفيت في يينا سنة 1924."
  en: "E. J. van Donzel's scholarly edition (Brill, 1992) of the writings of Salme bint Said / Emily Ruete, containing a short biography of her and of her son Rudolph Said-Ruete, a new English translation of her Memoirs, and her Letters Home, Sequels to the Memoirs and Syrian Customs and Usages; its biography states that she was born at Zanzibar on 30 August 1844, fled in 1866 to Aden where she was baptized with the Christian name Emily and married the German merchant Rudolph Heinrich Ruete, and died at Jena in 1924."
title: "An Arabian Princess Between Two Worlds: Memoirs, Letters Home, Sequels to the Memoirs, Syrian Customs and Usages"
