reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision; its hatnote expressly distinguishes him from Ma Fuxing. It gives him as born on 4 February 1876 at Linxia, Gansu, and as dying on 19 August 1932 — its infobox places the death at Beijing, its text says he died near Liangxiang while travelling to Beijing for treatment. Citing Lipman (1998, p. 167), it names his elder brothers as Ma Fushou, Ma Fulu and Ma Fucai, and its infobox names Ma Hongkui as his child. It records his childhood education in the Qur'an, his founding of the China Islamic Association, his enmity with the Jahriyya leader Ma Yuanzhang, and his stance against religious sectarianism and the menhuan, which he held to be a cause of violence; it names no school and no Sufi order as his own."
