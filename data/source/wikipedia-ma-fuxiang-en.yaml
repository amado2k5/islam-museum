summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ما فوشيانغ؛ تُستخدم لوقائع الكيان فقط. تروي ابن ما تشيانلينغ وشقيق ما فولو وأبا ما هونغكوي، الذي حكم نينغشيا وسويوان ورأس لجنة الشؤون المنغولية والتبتية، واشتهر بدعمه التعليم الإسلامي ووقوفه ضد نظام المنحوان."
  en: "English Wikipedia article on Ma Fuxiang; used for entity facts only. It recounts the son of Ma Qianling, brother of Ma Fulu and father of Ma Hongkui, who governed Ningxia and Suiyuan and chaired the Mongolian and Tibetan Affairs Commission, patronised Islamic education, and took a stance against the menhuan system."
  es: "Artículo de la Wikipedia en inglés sobre Ma Fuxiang; utilizado únicamente para datos sobre la persona. Relata la historia del hijo de Ma Qianling, hermano de Ma Fulu y padre de Ma Hongkui, quien gobernó Ningxia y Suiyuan, presidió la Comisión de Asuntos Mongoles y Tibetanos, patrocinó la educación islámica y se opuso al sistema menhuan."
  fr: "Article de Wikipédia en anglais sur Ma Fuxiang; utilisé uniquement à des fins d'information sur l'entité. Il relate l'histoire du fils de Ma Qianling, frère de Ma Fulu et père de Ma Hongkui, qui gouverna le Ningxia et le Suiyuan, présida la Commission des affaires mongoles et tibétaines, soutint l'éducation islamique et s'opposa au système des menhuan."
  ur: "Ma Fuxiang پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ما کیان لنگ کے بیٹے، ما فلو کے بھائی اور ما ہونگ کوئی کے والد کا ذکر کیا گیا ہے، جنہوں نے ننگزیا اور سوئیوان پر حکومت کی اور منگول اور تبتی امور کے کمیشن کی سربراہی کی، اسلامی تعلیم کی سرپرستی کی، اور مردانہ نظام کے خلاف موقف اختیار کیا۔"
  tr: "Ma Fuxian hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılır. Ma Qianling'in oğlu, Ma Fulu'nun kardeşi ve Ma Hongkui'nin babasını anlatır; Ma Hongkui, Ningxia ve Suyuan'ı yönetmiş, Moğol-Tibet İşleri Komitesi'ne başkanlık etmiş ve İslami eğitimi desteklemesi ile Minghuan sistemine karşı çıkmasıyla ünlüydü."
  id: "Artikel Wikipedia bahasa Inggris tentang Ma Fuxian; digunakan hanya untuk fakta entitas. Artikel ini menceritakan putra Ma Qianling, saudara Ma Fulu, dan ayah Ma Hongkui, yang memerintah Ningxia dan Suyuan, memimpin Komite Urusan Mongol-Tibet, dan terkenal karena mendukung pendidikan Islam serta menentang sistem Minghuan."
