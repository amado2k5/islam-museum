  ar: "مقالة ويكيبيديا الإنجليزية عن ما فوشيانغ؛ تُستخدم لوقائع الكيان فقط. تروي ابن ما تشيانلينغ وشقيق ما فولو وأبا ما هونغكوي، الذي حكم نينغشيا وسويوان ورأس لجنة الشؤون المنغولية والتبتية، واشتهر بدعمه التعليم الإسلامي ووقوفه ضد نظام المنحوان."
  en: "English Wikipedia article on Ma Fuxiang; used for entity facts only. It recounts the son of Ma Qianling, brother of Ma Fulu and father of Ma Hongkui, who governed Ningxia and Suiyuan and chaired the Mongolian and Tibetan Affairs Commission, patronised Islamic education, and took a stance against the menhuan system."
