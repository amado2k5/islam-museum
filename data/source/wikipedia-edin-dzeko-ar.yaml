summary:
  ar: "مقالة ويكيبيديا العربية عن إدين دجيكو؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته مع زيليزنيكار والأندية التشيكية وفولفسبورغ ومانشستر سيتي وروما وأرقامه مع منتخب البوسنة، وتذكر في حياته الشخصية أنه يتحدث خمس لغات وأنه مسلم دون تسمية أي مذهب."
  en: "Arabic Wikipedia article on Edin Džeko; used for entity facts only. It recounts his career at Željezničar, the Czech clubs, Wolfsburg, Manchester City and Roma and his Bosnia and Herzegovina records, and states in its personal-life passage that he speaks five languages and is a Muslim, without naming any school."
  es: "Artículo de Wikipedia en árabe sobre Edin Džeko; utilizado únicamente para obtener información sobre su persona. Relata su trayectoria en el Željezničar, los clubes checos Wolfsburg, Manchester City y Roma, así como sus récords en Bosnia y Herzegovina. En su apartado sobre su vida personal, afirma que habla cinco idiomas y es musulmán, sin mencionar ninguna escuela religiosa."
  fr: "Article Wikipédia en arabe sur Edin Džeko; utilisé uniquement pour les informations le concernant. Il retrace sa carrière à Željezničar, dans les clubs tchèques, à Wolfsburg, à Manchester City et à la Roma, ainsi que ses performances en Bosnie-Herzégovine. La partie consacrée à sa vie personnelle indique qu'il parle cinq langues et est musulman, sans mentionner d'établissement scolaire."
  ur: "Edin Džeko پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ Željezničar، چیک کلبوں، وولفسبرگ، مانچسٹر سٹی اور روما اور اس کے بوسنیا اور ہرزیگووینا کے ریکارڈ میں اپنے کیریئر کا ذکر کرتا ہے، اور اپنی ذاتی زندگی کے حوالے سے بیان کرتا ہے کہ وہ پانچ زبانیں بولتا ہے اور مسلمان ہے، بغیر کسی اسکول کا نام لیے۔"
