summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إسماعيل صبري يعقوب (وُلد 1960)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في تيميرلوه ببهانغ في 18 يناير 1960، ومسيرته القانونية والوزارية وزعامته للمعارضة، ودوره البارز في استجابة ماليزيا لجائحة كوفيد-19 وزيرا أول للدفاع ثم نائبا لرئيس الوزراء، ورئاسته التاسعة لوزراء ماليزيا (أغسطس 2021 – نوفمبر 2022) تحت مفهوم «أسرة ماليزيا»."
  en: "English Wikipedia article on Ismail Sabri Yaakob (born 1960); used for entity facts only. It recounts his birth at Temerloh, Pahang, on 18 January 1960, his legal and ministerial career and leadership of the opposition, his prominence in Malaysia's COVID-19 response as senior minister for security and then deputy prime minister, and his tenure as Malaysia's ninth prime minister (August 2021 – November 2022) under his 'Keluarga Malaysia' concept."
