summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إسماعيل صبري يعقوب ⁦(وُلد 1960)⁩؛ تُستخدم لوقائع الكيان فقط. تروي مولده في تيميرلوه ببهانغ في 18 يناير 1960، ومسيرته القانونية والوزارية وزعامته للمعارضة، ودوره البارز في استجابة ماليزيا لجائحة كوفيد-19 وزيرا أول للدفاع ثم نائبا لرئيس الوزراء، ورئاسته التاسعة لوزراء ماليزيا ⁦(أغسطس 2021 – نوفمبر 2022)⁩ تحت مفهوم «أسرة ماليزيا»."
  en: "English Wikipedia article on Ismail Sabri Yaakob (born 1960); used for entity facts only. It recounts his birth at Temerloh, Pahang, on 18 January 1960, his legal and ministerial career and leadership of the opposition, his prominence in Malaysia's COVID-19 response as senior minister for security and then deputy prime minister, and his tenure as Malaysia's ninth prime minister (August 2021 – November 2022) under his 'Keluarga Malaysia' concept."
  es: "Artículo de la Wikipedia en inglés sobre Ismail Sabri Yaakob (nacido en 1960); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Temerloh, Pahang, el 18 de enero de 1960, su carrera jurídica y ministerial y su liderazgo de la oposición, su prominencia en la respuesta de Malasia a la COVID-19 como ministro principal de seguridad y luego viceprimer ministro, y su mandato como noveno primer ministro de Malasia (agosto de 2021 - noviembre de 2022) bajo su concepto de 'Keluarga Malaysia'."
  fr: "Article de Wikipédia en anglais sur Ismail Sabri Yaakob (né en 1960); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Temerloh, Pahang, le 18 janvier 1960, sa carrière juridique et ministérielle et son rôle de chef de l’opposition, son importance dans la réponse de la Malaisie à la COVID-19 en tant que ministre principal de la Sécurité puis vice-Premier ministre, et son mandat de neuvième Premier ministre de Malaisie (août 2021 – novembre 2022) sous son concept de « Keluarga Malaysia »."
