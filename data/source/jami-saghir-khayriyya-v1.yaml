label:
  ar: "الجامع الصغير في أحاديث البشير النذير — جلال الدين السيوطي، وبالهامش «كنوز الحقائق في حديث خير الخلائق» للمناوي، المطبعة الخيرية، القاهرة، الجزء الأول"
  en: "al-Jami' al-Saghir fi Ahadith al-Bashir al-Nadhir — Jalal al-Din al-Suyuti, with al-Munawi's Kunuz al-Haqa'iq fi Hadith Khayr al-Khala'iq in the margin, al-Matba'a al-Khayriyya, Cairo, vol. 1"
summary:
  ar: "طبعة قديمة من الجامع الصغير بالمطبعة الخيرية بمصر القاهرة لمالكها ومديرها السيد عمر حسين الخشاب، وضعت فيها رموز الصحيح والحسن والضعيف ⁦(ص، ح، ض)⁩ في الصلب عقب رواة الحديث بين قوسين، وعلى هامشها «كنوز الحقائق» لعبد الرؤوف المناوي."
  en: "An old printing of al-Jami' al-Saghir by al-Matba'a al-Khayriyya, Cairo (owner and manager al-Sayyid 'Umar Husayn al-Khashshab), placing the sigla for sound, good and weak (s, h, d) in the main text between brackets after the transmitters, with 'Abd al-Ra'uf al-Munawi's Kunuz al-Haqa'iq in the margin."
  es: "Una antigua edición impresa de al-Jami' al-Saghir de al-Matba'a al-Khayriyya, El Cairo (propietario y gerente al-Sayyid 'Umar Husayn al-Khashshab), colocando los acrónimos para sólido, bueno y débil (s, h, d) en el texto principal entre corchetes después de los transmisores al-Haqa'iq en el margen."
  fr: "Une ancienne impression d'al-Jami' al-Saghir par al-Matba'a al-Khayriyya, Le Caire (propriétaire et gérant al-Sayyid 'Umar Husayn al-Khashshab), plaçant les acronymes pour son, bon et faible (s, h, d) dans le texte principal entre parenthèses après les transmetteurs al-Haqa'iq dans la marge."
  ur: "المطابع الخیریہ، قاہرہ ⁦(مالک اور منیجر السید عمر حسین الخشاب)⁩ کی الجامع الصغیر کی ایک پرانی طباعت، حاشیہ میں حاشیہ کے بعد بریکٹ کے درمیان مرکزی متن میں آواز، اچھے اور ضعیف ⁦(ص، ح، د)⁩ کے مخففات رکھ کر۔"
  tr: "Kahire'deki Al-Khairiya Matbaası'nda bulunan ve Sayyid Omar Hussein Al-Khashab'ın sahibi olduğu ve yönettiği eski bir Al-Jami' Al-Saghir baskısı; burada Sahih, Hasan ve Daif (S.A.H., D.D.) sembolleri, hadis rivayetçilerinin ardından parantez içinde yer almaktadır ve kenarında Abdul Rauf Al-Manawi'nin \"Hakikatlerin Hazineleri\" yer almaktadır."
  id: "Edisi lama Al-Jami' Al-Saghir di Al-Khairiya Press di Kairo, dimiliki dan dikelola oleh Sayyid Omar Hussein Al-Khashab, di mana simbol Sahih, Hasan, dan Da'if (S.A.H., D.D.) diletakkan di salib mengikuti narator hadis dalam tanda kurung, dan di pinggirnya terdapat \"Harta Kebenaran\" karya Abdul Raouf Al-Manawi."
