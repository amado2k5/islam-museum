label:
  ar: "الجامع الصغير في أحاديث البشير النذير — جلال الدين السيوطي، وبالهامش «كنوز الحقائق في حديث خير الخلائق» للمناوي، المطبعة الخيرية، القاهرة، الجزء الأول"
  en: "al-Jami' al-Saghir fi Ahadith al-Bashir al-Nadhir — Jalal al-Din al-Suyuti, with al-Munawi's Kunuz al-Haqa'iq fi Hadith Khayr al-Khala'iq in the margin, al-Matba'a al-Khayriyya, Cairo, vol. 1"
summary:
  ar: "طبعة قديمة من الجامع الصغير بالمطبعة الخيرية بمصر القاهرة لمالكها ومديرها السيد عمر حسين الخشاب، وضعت فيها رموز الصحيح والحسن والضعيف ⁦(ص، ح، ض)⁩ في الصلب عقب رواة الحديث بين قوسين، وعلى هامشها «كنوز الحقائق» لعبد الرؤوف المناوي."
  en: "An old printing of al-Jami' al-Saghir by al-Matba'a al-Khayriyya, Cairo (owner and manager al-Sayyid 'Umar Husayn al-Khashshab), placing the sigla for sound, good and weak (s, h, d) in the main text between brackets after the transmitters, with 'Abd al-Ra'uf al-Munawi's Kunuz al-Haqa'iq in the margin."
