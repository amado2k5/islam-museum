  ar: "مقالة ويكيبيديا العربية عن أبي بكر محمود غومي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه عالم دين وزعيم الحركة السلفية في نيجيريا وقاضي قضاة المنطقة الشمالية (1962–1967)، وينسب إليه صندوق معلوماتها: أهل السنة والجماعة طائفة، والمالكية مذهبًا، والأثرية عقيدة."
