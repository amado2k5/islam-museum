summary:
  ar: "مقالة ويكيبيديا العربية عن أبي بكر محمود غومي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه عالم دين وزعيم الحركة السلفية في نيجيريا وقاضي قضاة المنطقة الشمالية (1962–1967)، وينسب إليه صندوق معلوماتها: أهل السنة والجماعة طائفة، والمالكية مذهبًا، والأثرية عقيدة."
  en: "Arabic Wikipedia article on Abubakar Mahmud Gumi; used for entity facts only. It describes him as a religious scholar, leader of the Salafi movement in Nigeria and Grand Khadi of the Northern Region (1962-1967); its infobox gives Ahl al-Sunna wa'l-Jama'a as denomination, Maliki as school and Athari as creed."
  es: "Artículo en árabe de la Wikipedia sobre Abubakar Mahmud Gumi; utilizado únicamente para datos sobre la persona. Lo describe como un erudito religioso, líder del movimiento salafista en Nigeria y Gran Cadí de la Región Norte (1962-1967). Su ficha informativa indica Ahl al-Sunna wa'l-Jama'a como denominación, Maliki como escuela y Athari como credo."
  fr: "Article de Wikipédia en arabe sur Abubakar Mahmud Gumi; utilisé uniquement pour les informations sur l'entité. Il le décrit comme un érudit religieux, chef du mouvement salafiste au Nigeria et Grand Khadi de la région du Nord (1962-1967); son infobox indique Ahl al-Sunna wa'l-Jama'a comme dénomination, Maliki comme école et Athari comme croyance."
  ur: "ابوبکر محمود گمی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے ایک مذہبی اسکالر، نائیجیریا میں سلفی تحریک کے رہنما اور شمالی علاقہ کے گرینڈ کھادی (1962-1967) کے طور پر بیان کیا گیا ہے۔ اس کے معلوماتی خانے میں اہل السنۃ والجماعۃ کو فرقہ، مالکی کو مکتب اور اطہری کو عقیدہ دیا گیا ہے۔"
  tr: "Arapça Vikipedi makalesi, Ebu Bekir Mahmud Gumi hakkında; yalnızca varlığın gerçekleri için kullanılmıştır. Kendisi bir dini âlim, Nijerya'daki Selefi hareketin lideri ve Kuzey Bölgesi Baş Yargıcı (1962–1967) olarak tanımlanır. Bilgi kutusu ona atfedilir: Ahl al-Sunnah wa al-Jama'ah bir mezheptir, öğreti olarak Maliki ve Arkeoloji bir inanç olarak kabul edilir."
  id: "Artikel Wikipedia Arab tentang Abu Bakr Mahmoud Gumi; digunakan hanya untuk fakta entitas. Ia digambarkan sebagai seorang ulama agama, pemimpin gerakan Salafi di Nigeria, dan Ketua Hakim Wilayah Utara (1962–1967). Kotak infonya mengatributkan kepadanya: Ahl al-Sunnah wa al-Jama'ah adalah sebuah sekte, Maliki dalam doktrin, dan Arkeologi sebagai sebuah kepercayaan."
