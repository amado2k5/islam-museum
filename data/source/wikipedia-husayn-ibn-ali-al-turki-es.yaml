summary:
  ar: "مقالة ويكيبيديا الإسبانية عن الحسين بن علي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بالكاف سنة 1675 ثاني أبناء علي تركي الكريتي المسلم وحفصية الشرنية، وبيعته في 12 تموز 1705، ووفاته بالقيروان في 13 أيار 1740."
  en: "Spanish Wikipedia article on Al-Husayn I ibn Ali; used for entity facts only. It gives his birth at Le Kef in 1675 as second son of the Cretan Muslim commander Ali al-Turki and Hafsia al-Sharnia, his proclamation on 12 July 1705, his deposition in 1735 and his execution at Kairouan on 13 May 1740, agreeing with the French and Italian articles on the death day."
  es: "Artículo de la Wikipedia en español sobre Al-Husayn I ibn Ali; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Le Kef en 1675 como segundo hijo del comandante musulmán cretense Ali al-Turki y Hafsia al-Sharnia, su proclamación el 12 de julio de 1705, su deposición en 1735 y su ejecución en Kairouan el 13 de mayo de 1740, coincidiendo con los artículos en francés e italiano sobre la fecha de su muerte."
  fr: "L'article de Wikipédia en espagnol sur Al-Husayn Ier ibn Ali, utilisé uniquement pour les informations relatives à l'entité, indique sa naissance à Le Kef en 1675, deuxième fils du commandant musulman crétois Ali al-Turki et de Hafsia al-Sharnia, sa proclamation le 12 juillet 1705, sa destitution en 1735 et son exécution à Kairouan le 13 mai 1740, concordant ainsi avec les articles français et italiens concernant la date de son décès."
