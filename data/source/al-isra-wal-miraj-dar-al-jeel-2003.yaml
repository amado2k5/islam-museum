  en: "The Isra and Mi'raj — Muhammad Mutawalli al-Sha'rawi (Dar al-Jeel, 2003 edition)"
summary:
  ar: "طبعة دار الجيل ومكتبة التراث الإسلامي ⁦(بيروت – القاهرة، ٢٠٠٣م / ١٤٢٤ه)⁩ من كتاب الشيخ الشعراوي في الإسراء والمعراج، ١٠٨ صفحات مصوّرة. يبدأ بتصدير ومقدمة ثم يعرض الإسراء والمعراج بوصفهما حدثًا من أحداث الدعوة بين البعثة والهجرة {cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 6}."
  en: "The Dar al-Jeel and Maktabat al-Turath al-Islami edition (Beirut and Cairo, 2003), 108 pages in the scan used here. It opens with a preface and an introduction that place the Isra and Mi'raj among the turning points of the early da'wa, between the bi'tha and the hijra {cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 6}."
  es: "La edición de Dar al-Jeel y Maktabat al-Turath al-Islami (Beirut y El Cairo, 2003), de 108 páginas en el escaneo utilizado aquí, comienza con un prefacio y una introducción que sitúan el Isra y el Mi'raj entre los puntos de inflexión de la da'wa temprana, entre la bi'tha y la hijra {cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 6}."
  fr: "L'édition Dar al-Jeel et Maktabat al-Turath al-Islami (Beyrouth et Le Caire, 2003), de 108 pages dans le document numérisé utilisé ici, s'ouvre sur une préface et une introduction qui situent l'Isra et le Mi'raj parmi les moments charnières de la da'wa primitive, entre la bi'tha et l'hijra {cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 6}."
  ur: "دارالجیل اور مکتبۃ التراث الاسلامی ایڈیشن ⁦(بیروت اور قاہرہ، 2003)⁩، یہاں استعمال کیے گئے اسکین میں 108 صفحات۔ اس کا آغاز ایک دیباچہ اور ایک تعارف کے ساتھ ہوتا ہے جو اسراء اور معراج کو ابتدائی دعوت کے اہم موڑ میں، بیضہ اور حجرہ کے درمیان رکھتا ہے۔ 6}۔"
  tr: "Dar Al-Jeel ve Maktabat Al-Turath Al-Islami (Beyrut – Kahire, 2003 M.S. / 1424 H) tarafından Şeyh Al-Shaarawi'nin Al-Isra ve Al-Mi'raj üzerine kitabından 108 resimli sayfa yayımlanmıştır. Önsöz ve girişle başlar, ardından Al-Isra ve Al-Mi'raj'ı misyon ile Hicre arasındaki misyonun bir olayı olarak sunar {cite:al-isra-wal-miraj-dar-al-jeel-2003, s. 6}."
  id: "Edisi oleh Dar Al-Jeel dan Maktabat Al-Turath Al-Islami (Beirut – Kairo, 2003 M / 1424 H) dari buku Sheikh Al-Shaarawi tentang Al-Isra dan Al-Mi'raj, 108 halaman bergambar. Dimulai dengan kata pengantar dan pengantar, kemudian menyajikan Al-Isra dan Al-Mi'raj sebagai peristiwa misi antara misi dan Hijra {cite:al-isra-wal-miraj-dar-al-jeel-2003, hlm. 6}."
