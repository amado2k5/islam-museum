reliability_note: "Arabic Wikipedia, revision 76818993 (wikitext consulted in full). Its infobox prints a full birth date, 5 January 1826, that no text in any article supports — the English article's circa 1825 is followed instead, with the Arabic date stated as a reading. It agrees with the English article on Fuwayrit as birthplace but puts the death at Doha against the English and Urdu articles' Lusail, also stated rather than followed. Its lead gives his reign's Hijri span (24 Dhu al-Hijja 1295 – 13 Sha'ban 1331), consistent with the record's Hijri death year 1331. Its infobox religion field is empty, and it cites the Amiri Diwan's rulers page for the succession. Consulted on 26 October 2026."
