summary:
  ar: "مقالة ويكيبيديا العربية «جاسم بن محمد بن ثاني» ⁦(المراجعة 76818993)⁩: يعطي صندوقها ولادته في 5 يناير 1826 في فويرط ووفاته في 17 يوليو 1913 في الدوحة، ويحفظ لقبه «راع العليا» وكنيته «أخو روضة»، وحقل الدين فيه فارغ."
  en: "The Arabic Wikipedia article 'Jassim bin Mohammed bin Thani' (revision 76818993): its infobox gives his birth as 5 January 1826 at Fuwayrit and his death on 17 July 1913 at Doha, preserves his laqab 'Ra' al-Alya' and his kunya 'Akhu Rawda', and leaves the religion field empty."
  ur: "عربی ویکیپیڈیا کا مضمون «جاسم بن محمد بن ثانی» ⁦(نظرثانی 76818993)⁩: خانے میں پیدائش 5 جنوری 1826ء فویرط اور وفات 17 جولائی 1913ء دوحہ درج ہے، لقب «راع العلیا» اور کنیت «اخو روضہ» محفوظ ہیں، اور مذہب کا خانہ خالی ہے۔"
  es: "El artículo de Wikipedia en árabe 'Jassim bin Mohammed bin Thani' (revisión 76818993): su ficha informativa indica que nació el 5 de enero de 1826 en Fuwayrit y murió el 17 de julio de 1913 en Doha, conserva su laqab 'Ra' al-Alya' y su kunya 'Akhu Rawda', y deja el campo de religión vacío."
  fr: "L'article de Wikipédia en arabe « Jassim bin Mohammed bin Thani » (révision 76818993): son infobox indique sa naissance le 5 janvier 1826 à Fuwayrit et sa mort le 17 juillet 1913 à Doha, conserve son laqab « Ra' al-Alya' » et sa kunya « Akhu Rawda », et laisse le champ religion vide."
  tr: "Arapça Vikipedi makalesi \"Jassim bin Muhammad bin Thani\" (76818993 inceleme): Kutusunda 5 Ocak 1826'da Fuwairat'ta doğduğu ve 17 Temmuz 1913'te Doha'da öldüğü belirtilmiştir. \"Ra'a al-Ulya\" unvanını ve \"Rawda'nın Kardeşi\" lakabını korumaktadır, din alanı ise boştur."
  id: "Artikel Wikipedia Arab \"Jassim bin Muhammad bin Thani\" (ulasan 76818993): Kotaknya mencantumkan kelahirannya pada 5 Januari 1826 di Fuwairat dan kematiannya pada 17 Juli 1913 di Doha. Ia mempertahankan gelar \"Ra'a al-Ulya\" dan julukannya \"Saudara Rawda,\" dan bidang agama menjadi kosong."
