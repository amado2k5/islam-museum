label: { ar: "فتوى دار الإفتاء 292399 ⁦(قصة الإسلام)⁩", en: "Dar Al-Iftaa fatwa 292399, as republished by IslamStory" }
summary:
  ar: "نص فتوى دار الإفتاء المصرية رقم 292399 لسنة 2011 كما أعاد نشره موقع قصة الإسلام وتقارير صحفية معاصرة؛ فتوى مشروطة في عبارة قالها خالد منتصر في برنامج تلفزيوني."
  en: "The text of Egyptian Dar Al-Iftaa fatwa no. 292399 of 2011 as republished by IslamStory and contemporary press reports; a conditional ruling on a phrase Khaled Montaser said on a television programme."
  es: "El texto de la fatwa egipcia Dar Al-Iftaa n.º 292399 de 2011, republicado por IslamStory y por informes de prensa contemporáneos; un dictamen condicional sobre una frase que Khaled Montaser dijo en un programa de televisión."
  fr: "Le texte de la fatwa égyptienne Dar Al-Iftaa n° 292399 de 2011, republiée par IslamStory et dans la presse contemporaine; une décision conditionnelle sur une phrase prononcée par Khaled Montaser lors d’une émission de télévision."
  ur: "مصری دار الافتاء کا متن فتویٰ نمبر۔ 2011 کا 292399 جیسا کہ اسلام اسٹوری اور معاصر پریس رپورٹس کے ذریعے دوبارہ شائع کیا گیا ہے۔ خالد منتظر نے ایک ٹیلی ویژن پروگرام میں کہے گئے فقرے پر مشروط حکم۔"
  tr: "2011 tarihli Mısır Dar al-İfte fetvasının 292399 sayılı metni, Qissat al-Islam web sitesinde ve çağdaş basın haberlerinde yeniden yayımlanmıştır; Khaled Montaser tarafından bir televizyon programında söylenen bir koşullu fetvadır."
  id: "Teks fatwa Dar al-Ifta Mesir No. 292399 tahun 2011, sebagaimana diterbitkan ulang oleh situs Qissat al-Islam dan laporan pers kontemporer; sebuah fatwa bersyarat dalam frasa yang diucapkan oleh Khaled Montaser dalam sebuah program televisi."
title: "دار الإفتاء: قول «إيه دخل الله في السياسة»"
