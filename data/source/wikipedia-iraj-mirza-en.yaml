summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إيرج ميرزا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في أكتوبر 1874 في تبريز ووفاته في 14 مارس 1926 في طهران، ونسبه القاجاري ولقبه جلال‌الممالک ومنصب شاعر البلاط، وشعره العامي الساخر ومنظومتيه «عارف‌نامه» و«زهره و منوچهر»."
  en: "English Wikipedia article on Iraj Mirza; used for entity facts only. It gives his birth in October 1874 at Tabriz and his death on 14 March 1926 at Tehran, his Qajar descent, his Jalal-ol-Mamalek title and court-poet post, and his colloquial satirical poetry including the Arefnameh and Zohreh-o Manuchehr."
  es: "Artículo de la Wikipedia en inglés sobre Iraj Mirza; utilizado únicamente para datos biográficos. Indica su nacimiento en octubre de 1874 en Tabriz y su fallecimiento el 14 de marzo de 1926 en Teherán, su ascendencia Qajar, su título de Jalal-ol-Mamalek y su cargo de poeta de la corte, así como su poesía satírica coloquial, que incluye el Arefnameh y el Zohreh-o Manuchehr."
  fr: "Article de Wikipédia en anglais sur Iraj Mirza; utilisé uniquement pour les informations biographiques. Il indique sa naissance en octobre 1874 à Tabriz et sa mort le 14 mars 1926 à Téhéran, son appartenance à la dynastie Qajar, son titre de Jalal-ol-Mamalek et sa fonction de poète de cour, ainsi que sa poésie satirique en langue vernaculaire, notamment l’Arefnameh et le Zohreh-o Manuchehr."
  ur: "ایراج مرزا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اکتوبر 1874 میں تبریز میں ان کی پیدائش اور 14 مارچ 1926 کو تہران میں ان کی وفات، ان کی نسل قاجار، ان کا جلال الممالک لقب اور درباری شاعر کا عہدہ، اور ان کی بولی کی طنزیہ شاعری بشمول عارف نامی اور ظہرے او منوچہر۔"
