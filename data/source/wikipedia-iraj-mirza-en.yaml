  ar: "مقالة ويكيبيديا الإنجليزية عن إيرج ميرزا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في أكتوبر 1874 في تبريز ووفاته في 14 مارس 1926 في طهران، ونسبه القاجاري ولقبه جلال‌الممالک ومنصب شاعر البلاط، وشعره العامي الساخر ومنظومتيه «عارف‌نامه» و«زهره و منوچهر»."
  en: "English Wikipedia article on Iraj Mirza; used for entity facts only. It gives his birth in October 1874 at Tabriz and his death on 14 March 1926 at Tehran, his Qajar descent, his Jalal-ol-Mamalek title and court-poet post, and his colloquial satirical poetry including the Arefnameh and Zohreh-o Manuchehr."
