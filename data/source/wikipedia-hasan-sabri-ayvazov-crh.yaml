  ar: "مقالة ويكيبيديا التترية القرمية عن أسان صبري أيفازوف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 6 مايو 1878 في ألوبكا في أسرة فلاحية فقيرة ودراسته في إسطنبول ونشره في ترجمان غاسبرينسكي وتأسيسه مدرسة جديدة في ألوبكا؛ ولا تذكر له مذهبا."
