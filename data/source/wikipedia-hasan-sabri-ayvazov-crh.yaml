summary:
  ar: "مقالة ويكيبيديا التترية القرمية عن أسان صبري أيفازوف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 6 مايو 1878 في ألوبكا في أسرة فلاحية فقيرة ودراسته في إسطنبول ونشره في ترجمان غاسبرينسكي وتأسيسه مدرسة جديدة في ألوبكا؛ ولا تذكر له مذهبا."
  en: "Crimean Tatar Wikipedia article on Asan Sabri Ayvazov; used for entity facts only. It gives his birth on 6 May 1878 at Alupka into a poor peasant family, his studies in Istanbul, his publication in Gasprinsky's Tercüman and his founding of a new-method school at Alupka; it names no school for him."
  es: "Artículo de Wikipedia sobre Asan Sabri Ayvazov en Crimea; se utiliza únicamente para datos sobre la persona. Menciona su nacimiento el 6 de mayo de 1878 en Alupka en el seno de una familia campesina pobre, sus estudios en Estambul, su publicación en el Tercüman de Gasprinsky y la fundación de una escuela de nuevo método en Alupka; no se menciona el nombre de la escuela."
  fr: "Article Wikipédia en tatar de Crimée sur Asan Sabri Ayvazov; utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance le 6 mai 1878 à Aloupka dans une famille de paysans pauvres, ses études à Istanbul, sa publication dans le Tercüman de Gasprinsky et la fondation d'une école novatrice à Aloupka; aucune école n'est mentionnée."
  ur: "کریمیائی تاتار ویکیپیڈیا مضمون آسن صابری ایوازوف پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 6 مئی 1878 کو الوپکا میں ایک غریب کسان گھرانے میں اس کی پیدائش، استنبول میں اس کی تعلیم، گیسپرنسکی کے ٹیرکمن میں اس کی اشاعت اور الوپکا میں ایک نئے طریقہ کار کے اسکول کی بنیاد؛ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
