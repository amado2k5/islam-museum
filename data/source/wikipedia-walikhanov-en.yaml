  ar: "مقالة ويكيبيديا الإنجليزية عن شوقان ولي خانوف؛ تُستخدم لوقائع الكيان فقط. تروي مولده في نوفمبر 1835 في حصن كوشمورون، وتدرّبه في فيلق أومسك العسكري، ورحلاته إلى إيسيك كول وكاشغر (1858–1859)، وصداقته لدوستويفسكي، ووفاته بالسل في 10 أبريل 1865."
  en: "English Wikipedia article on Shoqan Walikhanov; used for entity facts only. It recounts his birth in November 1835 at the Kushmurun fort, his training at the Omsk Cadet Corps, his expeditions to Issyk-Kul and to Kashgar (1858–59), his friendship with Dostoevsky, and his death from tuberculosis on 10 April 1865."
