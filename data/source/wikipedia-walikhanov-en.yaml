summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شوقان ولي خانوف؛ تُستخدم لوقائع الكيان فقط. تروي مولده في نوفمبر 1835 في حصن كوشمورون، وتدرّبه في فيلق أومسك العسكري، ورحلاته إلى إيسيك كول وكاشغر (1858–1859)، وصداقته لدوستويفسكي، ووفاته بالسل في 10 أبريل 1865."
  en: "English Wikipedia article on Shoqan Walikhanov; used for entity facts only. It recounts his birth in November 1835 at the Kushmurun fort, his training at the Omsk Cadet Corps, his expeditions to Issyk-Kul and to Kashgar (1858–59), his friendship with Dostoevsky, and his death from tuberculosis on 10 April 1865."
  es: "Artículo de la Wikipedia en inglés sobre Shoqan Walikhanov; utilizado únicamente para datos sobre la persona. Relata su nacimiento en noviembre de 1835 en el fuerte de Kushmurun, su formación en el Cuerpo de Cadetes de Omsk, sus expediciones a Issyk-Kul y a Kashgar (1858-1859), su amistad con Dostoievski y su muerte por tuberculosis el 10 de abril de 1865."
  fr: "Article de Wikipédia en anglais sur Shoqan Walikhanov; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance en novembre 1835 au fort de Kushmurun, sa formation au Corps des cadets d’Omsk, ses expéditions à Issyk-Koul et à Kachgar (1858-1859), son amitié avec Dostoïevski et sa mort de la tuberculose le 10 avril 1865."
  ur: "شوقان ولیخانوف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں نومبر 1835 میں کشمورون قلعے میں اس کی پیدائش، اومسک کیڈٹ کور میں اس کی تربیت، اسک-کول اور کاشغر (1858-59) تک اس کی مہمات، دوستوفسکی کے ساتھ اس کی دوستی، اور 10 اپریل 1865 کو تپ دق سے اس کی موت کا ذکر ہے۔"
  tr: "Shokan ve Ulihanov hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kasım 1835'te Kushmuron Kalesi'nde doğmasını, Omsk askeri birliğindeki eğitimini, Issyk-Kul ve Kaşgar'a (1858–1859) yaptığı seyahatleri, Dostoyevski ile dostluğunu ve 10 Nisan 1865'te veremden ölmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Shokan dan Ulikhanov; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada November 1835 di Benteng Kushmuron, pelatihannya di korps militer Omsk, perjalanannya ke Issyk-Kul dan Kashgar (1858–1859), persahabatannya dengan Dostoevsky, dan kematiannya akibat tuberkulosis pada 10 April 1865."
