summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ابن سهل الرياضي؛ لوقائع الكيان فقط: نحو 940–1000، ارتباطه بالبلاط البويهي ببغداد، رسالته البصرية نحو 984، مخطوطا دمشق الظاهرية 4871 وطهران الملي 867، ووصفه في المراجع المذكورة باكتشاف قانون الانكسار وتصميم عدسات كاسرة."
  en: "English Wikipedia article on Ibn Sahl the mathematician; entity facts only: c. 940-1000, his association with the Buyid court of Baghdad, the c. 984 optical treatise, the Damascus al-Zahiriyya MS 4871 and Tehran Milli MS 867, and the credited discovery of the law of refraction with anaclastic lens design, as stated by its cited scholars."
  es: "Artículo de la Wikipedia en inglés sobre Ibn Sahl, el matemático; solo datos sobre la persona: c. 940-1000, su asociación con la corte Buyid de Bagdad, el tratado de óptica de c. 984, el manuscrito al-Zahiriyya de Damasco 4871 y el manuscrito Milli de Teherán 867, y el supuesto descubrimiento de la ley de refracción con diseño de lentes anaclásticas, según lo afirman los estudiosos citados."
  fr: "Article de Wikipédia en anglais sur Ibn Sahl le mathématicien; faits concernant l'entité uniquement: vers 940-1000, son association avec la cour bouyide de Bagdad, le traité d'optique vers 984, le manuscrit al-Zahiriyya 4871 de Damas et le manuscrit Milli 867 de Téhéran, et la découverte attribuée à la loi de la réfraction avec une conception de lentille anaclastique, comme indiqué par les érudits cités."
  ur: "ابن سہل ریاضی دان پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: c. 940-1000، بغداد کی بیعد عدالت سے ان کی وابستگی، c. 984 نظری مقالہ، دمشق الظاہریہ ایم ایس 4871 اور تہران ملی ایم ایس 867، اور انکلاسٹک لینس ڈیزائن کے ساتھ ریفریکشن کے قانون کی تصدیق شدہ دریافت، جیسا کہ اس کے حوالہ کردہ علماء نے بیان کیا ہے۔"
  tr: "İbn Sahl al-Maariti hakkında İngilizce Vikipedi makalesi; varlık için sadece olaylar için: yaklaşık 940–1000, Bağdat'taki Büyid sarayı ile bağlantısı, yaklaşık 984 tarihli görsel incelemesi, Şam el-Zahiriyya el yazması 4871 ve Tahran el-Milli 867 ve alıntı yapılan kaynaklarda kırılma yasasını keşfettiği ve kırıcı mercekler tasarladığı belirtilir."
  id: "Artikel Wikipedia bahasa Inggris tentang Ibn Sahl al-Maariti; untuk entitas saja: sekitar tahun 940–1000, hubungannya dengan istana Buyid di Baghdad, risalah visualnya sekitar tahun 984, manuskrip Damaskus al-Zahiriyya 4871 dan Tehran al-Milli 867, dan ia digambarkan dalam referensi yang dikutip sebagai penemu hukum pembiasan dan merancang lensa refraksi."
