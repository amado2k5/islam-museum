summary:
  ar: "صفحة وردت في ملخص بحثي قُدِّم إلى المتحف واعتمده المؤسس في 21 نوفمبر 2026؛ لم تُفتح الصفحة، وأرقام الصفحات المذكورة هي ما في الملخص ولم يُتحقق منها. ناشرها: al-Bayan (UK). يُستند إليها في: أوائل ترجمات القرآن: ترجمة سلمان الفارسي وروبرت الكيتوني وألكسندر روس؛ ترجمات القرآن إلى الإنجليزية؛ تاريخ ترجمات القرآن بعدة لغات."
  en: "A page listed in a research summary supplied to the museum and approved by the founder on 21 November 2026; the page was not opened, and any page numbers are the summary's and unchecked. Publisher: al-Bayan (UK). Used for: the first translations of the Qur'an: Salman al-Farisi, Robert of Ketton and Alexander Ross; English translations of the Qur'an; the history of Qur'an translations in several languages."
  ur: "ایک صفحہ جو عجائب گھر کو دیے گئے تحقیقی خلاصے میں مذکور ہے اور جسے بانی نے 21 نومبر 2026 کو منظور کیا؛ صفحہ کھولا نہیں گیا، اور صفحات کے نمبر خلاصے کے ہیں اور جانچے نہیں گئے۔ ناشر: al-Bayan (UK)۔ اس سے استناد ان امور کے لیے ہے: قرآن کے ابتدائی تراجم: سلمان فارسی، رابرٹ آف کیٹن اور الیگزینڈر راس؛ قرآن کے انگریزی تراجم؛ کئی زبانوں میں قرآن کے تراجم کی تاریخ۔"
  fr: "Page citée dans un résumé de recherche remis au musée et approuvé par le fondateur le 21 novembre 2026 ; la page n'a pas été ouverte, et les numéros de page sont ceux du résumé, non vérifiés. Éditeur : al-Bayan (UK). Utilisée pour : les premières traductions du Coran : Salman al-Farisi, Robert de Ketton et Alexander Ross; les traductions anglaises du Coran; l'histoire des traductions du Coran en plusieurs langues."
  es: "Página citada en un resumen de investigación entregado al museo y aprobado por el fundador el 21 de noviembre de 2026; la página no se abrió, y los números de página son los del resumen, sin comprobar. Editor: al-Bayan (UK). Usada para: las primeras traducciones del Corán: Salman al-Farisi, Roberto de Ketton y Alexander Ross; las traducciones inglesas del Corán; la historia de las traducciones del Corán en varias lenguas."
