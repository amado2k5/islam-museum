summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن وزير أكبر خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في صندوق المعلومات في 11 نوفمبر 1817 بمزار شريف بينما يعطي متنها سنة 1816، ووفاته في 10 ديسمبر 1847، وإمارته لكابل ⁦(ديسمبر 1842 - أبريل 1843)⁩ وقيادته الحزب الوطني في كابل ودوره في تدمير جيش إلفينستون المنسحب. يعطي صندوق معلوماتها دينه «الإسلام السني»."
  en: "English Wikipedia article on Wazir Akbar Khan; used for entity facts only. Its infobox gives his birth as 11 November 1817 at Mazar-i-Sharif while its text gives the year 1816, and his death as 10 December 1847; it recounts his emirate of Kabul (December 1842 – April 1843), his leadership of the Kabul national party and his part in the destruction of Elphinstone's retreating army. Its infobox gives his religion as Sunni Islam."
  es: "Artículo de la Wikipedia en inglés sobre Wazir Akbar Khan; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació el 11 de noviembre de 1817 en Mazar-i-Sharif, mientras que el texto menciona el año 1816, y su muerte el 10 de diciembre de 1847. Relata su emirato de Kabul (diciembre de 1842 - abril de 1843), su liderazgo del partido nacional de Kabul y su participación en la destrucción del ejército de Elphinstone en retirada. Su ficha informativa indica que profesaba el islam sunita."
  fr: "Article de Wikipédia en anglais sur Wazir Akbar Khan; utilisé uniquement pour les informations biographiques. Son infobox indique sa naissance le 11 novembre 1817 à Mazar-i-Sharif, tandis que son texte mentionne l’année 1816 et sa mort le 10 décembre 1847. L’article relate son émirat de Kaboul (décembre 1842 – avril 1843), son rôle à la tête du parti national de Kaboul et sa participation à la destruction de l’armée d’Elphinstone en retraite. Son infobox précise qu’il était de confession sunnite."
