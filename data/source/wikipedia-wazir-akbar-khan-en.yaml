summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن وزير أكبر خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في صندوق المعلومات في 11 نوفمبر 1817 بمزار شريف بينما يعطي متنها سنة 1816، ووفاته في 10 ديسمبر 1847، وإمارته لكابل (ديسمبر 1842 - أبريل 1843) وقيادته الحزب الوطني في كابل ودوره في تدمير جيش إلفينستون المنسحب. يعطي صندوق معلوماتها دينه «الإسلام السني»."
  en: "English Wikipedia article on Wazir Akbar Khan; used for entity facts only. Its infobox gives his birth as 11 November 1817 at Mazar-i-Sharif while its text gives the year 1816, and his death as 10 December 1847; it recounts his emirate of Kabul (December 1842 – April 1843), his leadership of the Kabul national party and his part in the destruction of Elphinstone's retreating army. Its infobox gives his religion as Sunni Islam."
