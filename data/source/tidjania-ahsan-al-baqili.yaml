reliability_note: "Biography published by the Tijaniyya order's official Moroccan site; its stated research sources are scholarly (al-Mukhtar al-Susi, al-Ma'sul, vol. 11, pp. 155–186; Ibn Suda, Dalil Mu'arrikh; Kahhala, Mu'jam al-Mu'allifin, vol. 3, p. 211; Ma'lamat al-Maghrib, vol. 4, p. 1286), and a closing section is by the subject's daughter Zaynab Abu Aqil, who states his madhhab, creed and spiritual path in her own words. As the order's own site it is an interested source for his Tijani affiliation; that affiliation is independently corroborated by Wikidata's description of him as a Sufi jurist. The page pairs his death year 1368 AH loosely with 1948 in its narrative while dating the death precisely to the night of 10 Shawwal 1368 in the daughter's section; both renderings are disclosed in the person record."
