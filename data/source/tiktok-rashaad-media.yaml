reliability_note: "The official channel operation's own TikTok account: a primary source for the operation's output and audience, not independent corroboration of biography. The profile figures were obtained in the wave-198 second pass (9 November 2026) from the search-indexed profile: a crawl of about 20 October 2026 showed 181,400 followers, 12 following and 4,500,000 likes, and an earlier crawl of about 15 October 2026 showed 180,700 followers and 4,400,000 likes — a growing, active account, with fresh videos indexed as crawled one to two days before 9 November 2026 (posting to 8 November 2026). These are dated platform figures as indexed, not museum measurements, and they are TikTok follower counts, not YouTube subscriber counts: no dated YouTube count for the operation's YouTube channel (@RashaadMedia1) could be pinned from any public tracker in this pass, and none is carried anywhere in this record. The profile names no school of law for the sheikh. Read on 9 November 2026."
