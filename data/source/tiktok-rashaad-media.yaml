summary:
  ar: "حساب «رشاد ميديا» على تيك توك (@rashaadmedia1)، وهو الحساب الرسمي لمحاضرات الشيخ محمود خاليكي؛ أظهر ملفه كما فُهرس في بحث الويب نحو 20 أكتوبر 2026 عدد 181,400 متابع و4,500,000 إعجاب، وأظهرت فهرسة أسبق نحو 15 أكتوبر 2026 عدد 180,700 متابع، وكانت مقاطع جديدة منه ما تزال تُفهرس حتى 8 نوفمبر 2026."
  en: "The Rashaad Media TikTok account (@rashaadmedia1), the official-channel account for Sheikh Mahmoud Xaliike's lectures; its profile, as indexed in web search at a crawl of about 20 October 2026, showed 181,400 followers and 4,500,000 likes, an earlier indexed crawl of about 15 October 2026 showed 180,700 followers, and fresh videos from the account were still being indexed up to 8 November 2026."
  ur: "«رشاد میڈیا» کا ٹک ٹاک اکاؤنٹ (@rashaadmedia1)، جو شیخ محمود خالیکے کے خطبات کے سرکاری چینل کا اکاؤنٹ ہے؛ اس کے پروفائل نے، جیسا کہ ویب تلاش میں تقریباً 20 اکتوبر 2026ء کی فہرست سازی میں ظاہر ہوا، 181,400 فالوور اور 4,500,000 لائکس دکھائے، تقریباً 15 اکتوبر 2026ء کی ایک پہلے کی فہرست سازی میں 180,700 فالوور تھے، اور اس اکاؤنٹ کی نئی ویڈیوز 8 نومبر 2026ء تک فہرست میں آتی رہیں۔"
  es: "La cuenta de TikTok de Rashaad Media (@rashaadmedia1), el canal oficial de las conferencias del jeque Mahmoud Xaliike, mostraba en su perfil, según la indexación de una búsqueda web realizada alrededor del 20 de octubre de 2026, 181.400 seguidores y 4.500.000 \"me gusta\". Una indexación anterior, realizada alrededor del 15 de octubre de 2026, mostraba 180.700 seguidores, y los vídeos nuevos de la cuenta seguían indexándose hasta el 8 de noviembre de 2026."
  fr: "Le compte TikTok de Rashaad Media (@rashaadmedia1), le compte officiel des conférences de Cheikh Mahmoud Xaliike; son profil, tel qu'indexé dans la recherche Web lors d'une exploration vers le 20 octobre 2026, affichait 181 400 abonnés et 4 500 000 likes, une exploration indexée antérieure vers le 15 octobre 2026 affichait 180 700 abonnés, et de nouvelles vidéos du compte étaient encore en cours d'indexation jusqu'au 8 novembre 2026."
  tr: "TikTok'taki 'Rashad Media' hesabı (@rashaadmedia1), ki bu Şeyh Mahmoud Khaliki'nin derslerinin resmi hesabıdır ve 20 Ekim 2026 civarında web aramalarında dosyasını ve dizinini gösterdi; 181.400 takipçi ve 4.500.000 beğeni vardı. Daha önceki bir indeks, 15 Ekim 2026 civarında 180.700 takipçi gösteriyordu ve yeni klipler 8 Kasım 2026'ya kadar indekslenmeye devam ediyordu."
  id: "Akun 'Rashad Media' di TikTok (@rashaadmedia1), yang merupakan akun resmi untuk kuliah Sheikh Mahmoud Khaliki, menampilkan file dan indeksnya dalam pencarian web sekitar 20 Oktober 2026, dengan 181.400 pengikut dan 4.500.000 like. Indeks sebelumnya sekitar 15 Oktober 2026 menunjukkan 180.700 pengikut, dengan klip baru yang masih diindeks hingga 8 November 2026."
