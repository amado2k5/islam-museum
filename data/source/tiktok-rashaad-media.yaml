summary:
  ar: "حساب «رشاد ميديا» على تيك توك (@rashaadmedia1)، وهو الحساب الرسمي لمحاضرات الشيخ محمود خاليكي؛ أظهر ملفه كما فُهرس في بحث الويب نحو 20 أكتوبر 2026 عدد 181,400 متابع و4,500,000 إعجاب، وأظهرت فهرسة أسبق نحو 15 أكتوبر 2026 عدد 180,700 متابع، وكانت مقاطع جديدة منه ما تزال تُفهرس حتى 8 نوفمبر 2026."
  en: "The Rashaad Media TikTok account (@rashaadmedia1), the official-channel account for Sheikh Mahmoud Xaliike's lectures; its profile, as indexed in web search at a crawl of about 20 October 2026, showed 181,400 followers and 4,500,000 likes, an earlier indexed crawl of about 15 October 2026 showed 180,700 followers, and fresh videos from the account were still being indexed up to 8 November 2026."
  ur: "«رشاد میڈیا» کا ٹک ٹاک اکاؤنٹ (@rashaadmedia1)، جو شیخ محمود خالیکے کے خطبات کے سرکاری چینل کا اکاؤنٹ ہے؛ اس کے پروفائل نے، جیسا کہ ویب تلاش میں تقریباً 20 اکتوبر 2026ء کی فہرست سازی میں ظاہر ہوا، 181,400 فالوور اور 4,500,000 لائکس دکھائے، تقریباً 15 اکتوبر 2026ء کی ایک پہلے کی فہرست سازی میں 180,700 فالوور تھے، اور اس اکاؤنٹ کی نئی ویڈیوز 8 نومبر 2026ء تک فہرست میں آتی رہیں۔"
