summary:
  ar: "مقالة ويكيبيديا الفارسية عن صادقي بيك أفشار ⁦(صادقي كتابدار)⁩؛ تعطي ولادته 1533 في تبريز ووفاته 1610 في أصفهان، ونسبه إلى إيل أفشار وقبيلة خدابنده لو التركمانية القزلباشية، وأستاذه في التصوير مظفر علي التربتي."
  en: "Persian Wikipedia article on Sadiqi Beg Afshar (Sadiqi Kitabdar); it gives his birth in 1533 in Tabriz and death in 1610 in Isfahan, his descent from the Afshar tribe and the Khodabandalu Turkoman Qizilbash clan, and his painting teacher Mozaffar Ali Torbati."
  es: "Artículo de la Wikipedia en persa sobre Sadiqi Beg Afshar (Sadiqi Kitabdar); en él se indica que nació en 1533 en Tabriz y murió en 1610 en Isfahán, que descendía de la tribu Afshar y del clan turcomano Qizilbash de Khodabandalu, y que su maestro de pintura fue Mozaffar Ali Torbati."
  fr: "L'article persan de Wikipédia sur Sadiqi Beg Afshar (Sadiqi Kitabdar) indique sa naissance en 1533 à Tabriz et sa mort en 1610 à Ispahan, son appartenance à la tribu Afshar et au clan turkmène Khodabandalu Qizilbash, ainsi que son professeur de peinture Mozaffar Ali Torbati."
