summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تشودري محمد علي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 15 يوليو 1905 في جالاندهر لأسرة أراين بنجابية، ومسيرته في الخدمة المدنية الهندية ثم وزيرًا للمالية (1951–1955)، ورئاسته للوزراء من أغسطس 1955 إلى سبتمبر 1956 وإعلانه دستور 1956، وتأليفه كتاب «نشوء باكستان» (1967)، ووفاته في كراتشي في 2 ديسمبر 1982. لا يحمل صندوق معلوماتها أي قيمة للديانة."
  en: "English Wikipedia article on Chaudhri Muhammad Ali; used for entity facts only. It gives his birth on 15 July 1905 at Jalandhar into an Arain Punjabi family, his Indian Civil Service career and finance ministry (1951–1955), his prime ministership from August 1955 to September 1956 and his promulgation of the 1956 constitution, his book The Emergence of Pakistan (1967), and his death at Karachi on 2 December 1982. Its infobox carries no religion value."
