summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تشودري محمد علي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 15 يوليو 1905 في جالاندهر لأسرة أراين بنجابية، ومسيرته في الخدمة المدنية الهندية ثم وزيرًا للمالية (1951–1955)، ورئاسته للوزراء من أغسطس 1955 إلى سبتمبر 1956 وإعلانه دستور 1956، وتأليفه كتاب «نشوء باكستان» (1967)، ووفاته في كراتشي في 2 ديسمبر 1982. لا يحمل صندوق معلوماتها أي قيمة للديانة."
  en: "English Wikipedia article on Chaudhri Muhammad Ali; used for entity facts only. It gives his birth on 15 July 1905 at Jalandhar into an Arain Punjabi family, his Indian Civil Service career and finance ministry (1951–1955), his prime ministership from August 1955 to September 1956 and his promulgation of the 1956 constitution, his book The Emergence of Pakistan (1967), and his death at Karachi on 2 December 1982. Its infobox carries no religion value."
  es: "Artículo de la Wikipedia en inglés sobre Chaudhri Muhammad Ali; utilizado únicamente para datos sobre la persona. Describe su nacimiento el 15 de julio de 1905 en Jalandhar en el seno de una familia Arain Punjabi, su trayectoria en el Servicio Civil Indio y su ministerio de finanzas (1951-1955), su mandato como primer ministro desde agosto de 1955 hasta septiembre de 1956 y la promulgación de la constitución de 1956, su libro El surgimiento de Pakistán (1967) y su fallecimiento en Karachi el 2 de diciembre de 1982. Su ficha informativa no tiene valor religioso."
  fr: "Article de Wikipédia en anglais sur Chaudhri Muhammad Ali; utilisé uniquement pour les informations sur l'entité. Il retrace sa naissance le 15 juillet 1905 à Jalandhar, au sein d'une famille arain du Pendjab, sa carrière dans la fonction publique indienne et son poste de ministre des Finances (1951-1955), son mandat de Premier ministre d'août 1955 à septembre 1956 et la promulgation de la Constitution de 1956, son ouvrage *The Emergence of Pakistan* (1967), et son décès à Karachi le 2 décembre 1982. Son infobox ne mentionne pas la religion."
  ur: "چوہدری محمد علی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 15 جولائی 1905 کو جالندھر میں ایک آرائیں پنجابی خاندان میں ہوئی، ان کا انڈین سول سروس کیریئر اور وزارت خزانہ (1951–1955)، اگست 1955 سے ستمبر 1956 تک ان کی وزارت عظمیٰ اور 1956 کے آئین کا نفاذ، ان کی کتاب The Emergence of Pakistan ⁦(1967 دسمبر)⁩ اور کراچی میں ان کی موت 1982. اس کے انفو باکس میں مذہب کی کوئی اہمیت نہیں ہے۔"
  tr: "Chaudhry Muhammad Ali hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 15 Temmuz 1905'te Jalandhar'da Pencaplı bir Aryan ailede doğdu; Hindistan kamu hizmetindeki kariyeri ve ardından Maliye Bakanı (1951–1955), Ağustos 1955'ten Eylül 1956'ya kadar bakanlık görevi, 1956 Anayasası'nın ilanı, 'Pakistan'ın Ortaya Çıkışı' (1967) kitabının yazarlığı ve 2 Aralık 1982'de Karaçi'de vefat etmesi. Bilgi kutusunun herhangi bir dini değeri yoktur."
  id: "Artikel Wikipedia bahasa Inggris tentang Chaudhry Muhammad Ali; digunakan hanya untuk fakta entitas. Ia lahir pada 15 Juli 1905 di Jalandhar dari keluarga Arya Punjabi, kariernya di dinas sipil India dan kemudian sebagai Menteri Keuangan (1951–1955), posisi menteri dari Agustus 1955 hingga September 1956, proklamasi Konstitusi 1956, penulis buku 'The Emergence of Pakistan' (1967), dan kematiannya di Karachi pada 2 Desember 1982. Infobox di sana tidak memiliki nilai agama."
