summary:
  ar: "مقالة ويكيبيديا العربية عن برديس ثابتي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادتها في 25 ديسمبر 1975 في طهران، وتروي تعليمها وعملها على إيبولا وجوائزها، وتذكر أن والدها ينتسب لعائلة بهائية دون أن ينضم رسميًا."
  en: "Arabic Wikipedia article on Pardis Sabeti; used for entity facts only. It gives her birth as 25 December 1975 at Tehran, recounts her education, her Ebola work and her awards, and notes that her father belonged to a Baháʼí family without formally joining."
  es: "Artículo de Wikipedia en árabe sobre Pardis Sabeti; utilizado únicamente para datos sobre la persona. Indica que nació el 25 de diciembre de 1975 en Teherán, relata su educación, su labor en la lucha contra el ébola y sus premios, y señala que su padre pertenecía a una familia baháʼí sin haberse unido formalmente a ella."
  fr: "Article de Wikipédia en arabe sur Pardis Sabeti; utilisé uniquement à des fins d’information sur l’entité. Il indique sa date de naissance, le 25 décembre 1975, à Téhéran, relate ses études, son travail contre Ebola et les distinctions qu’elle a reçues, et précise que son père appartenait à une famille bahá’íe sans pour autant être membre de la communauté."
  ur: "پردیس سبیتی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 25 دسمبر 1975 کو تہران میں اس کی پیدائش ہوئی، اس کی تعلیم، اس کے ایبولا کے کام اور اس کے ایوارڈز کا ذکر کرتی ہے، اور نوٹ کرتی ہے کہ اس کے والد کا تعلق باضابطہ طور پر شامل کیے بغیر ایک بہائی خاندان سے تھا۔"
  tr: "Bardis Thabeti hakkında Arapça Wikipedia makalesi sadece varlığın gerçekleri için kullanılmıştır. 25 Aralık 1975'te Tahran'da doğum yapar, eğitimini, Ebola üzerindeki çalışmalarını ve ödüllerini anlatır; babasının resmi olarak katılmadan bir Bahai ailesine mensup olduğunu belirtir."
  id: "Artikel Wikipedia bahasa Arab tentang Bardis Thabeti hanya digunakan untuk fakta entitas tersebut. Ia melahirkan pada 25 Desember 1975 di Teheran, menceritakan pendidikannya, pekerjaannya tentang Ebola, dan penghargaan yang diterimanya, serta menyebutkan bahwa ayahnya berasal dari keluarga Baha'i tanpa resmi bergabung."
