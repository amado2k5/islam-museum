  ar: "مقالة ويكيبيديا العربية عن محمد مرسي؛ تُستخدم لوقائع الكيان فقط. تروي حياته وعضويته في جماعة الإخوان المسلمين ورئاسته لحزب الحرية والعدالة ثم رئاسته لمصر، وعزله وسجنه ووفاته سنة 2019. صندوق معلوماتها يعطي دينه «مسلم سني»."
  en: "Arabic Wikipedia article on Mohamed Morsi; used for entity facts only. It recounts his life, his membership of the Muslim Brotherhood, his chairmanship of the Freedom and Justice Party and then of Egypt, his removal, imprisonment and death in 2019. Its infobox gives his religion as 'Muslim Sunni'."
