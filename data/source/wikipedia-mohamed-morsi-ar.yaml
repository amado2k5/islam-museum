summary:
  ar: "مقالة ويكيبيديا العربية عن محمد مرسي؛ تُستخدم لوقائع الكيان فقط. تروي حياته وعضويته في جماعة الإخوان المسلمين ورئاسته لحزب الحرية والعدالة ثم رئاسته لمصر، وعزله وسجنه ووفاته سنة 2019. صندوق معلوماتها يعطي دينه «مسلم سني»."
  en: "Arabic Wikipedia article on Mohamed Morsi; used for entity facts only. It recounts his life, his membership of the Muslim Brotherhood, his chairmanship of the Freedom and Justice Party and then of Egypt, his removal, imprisonment and death in 2019. Its infobox gives his religion as 'Muslim Sunni'."
  es: "Artículo de Wikipedia en árabe sobre Mohamed Morsi; utilizado únicamente para datos sobre la persona. Narra su vida, su pertenencia a los Hermanos Musulmanes, su presidencia del Partido Libertad y Justicia y posteriormente de Egipto, su destitución, encarcelamiento y muerte en 2019. Su ficha informativa indica que su religión era «musulmán sunita»."
  fr: "Article de Wikipédia en arabe sur Mohamed Morsi; utilisé uniquement à des fins d'information sur l'entité. Il retrace sa vie, son appartenance aux Frères musulmans, sa présidence du Parti Liberté et Justice puis de l'Égypte, sa destitution, son emprisonnement et sa mort en 2019. Son infobox indique qu'il était musulman sunnite."
  ur: "محمد مرسی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی زندگی، اخوان المسلمون کی رکنیت، فریڈم اینڈ جسٹس پارٹی اور پھر مصر کی سربراہی، 2019 میں ان کی برطرفی، قید اور موت کا ذکر ہے۔"
  tr: "Muhammed Mursi hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılıyor. Makale, hayatını, Müslüman Kardeşler üyeliğini, Özgürlük ve Adalet Partisi başkanlığını, ardından Mısır başkanlığını, görevden alınmasını, hapsedilmesini ve 2019'daki ölümünü anlatıyor. Bilgi kutusunda dinini \"Sünni Müslüman\" olarak veriyor."
  id: "Artikel Wikipedia berbahasa Arab tentang Mohamed Morsi hanya digunakan untuk fakta entitas tersebut. Artikel itu menceritakan kehidupannya, keanggotaannya di Ikhwanul Muslimin, kepresidenannya di Partai Kebebasan dan Keadilan, lalu masa kepresidenannya di Mesir, pemecatan, penahanan, dan kematiannya pada 2019. Infobox di sana mencantumkan agamanya sebagai \"Muslim Sunni.\""
