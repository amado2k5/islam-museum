reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and fetched by the recorded revision id, with the returned revision asserted equal before any claim was drawn. Its personal-life section states, citing Libération (7 October 2005), that Weah was born to Christian parents but converted to Islam, and afterwards returned to Christianity; that in his youth he attended a Quranic school; that in 1995, while still a Muslim, he described himself as practising that religion and spoke of making up the Ramadan fast after his sporting career (citing L'Humanité); and that in 2019 he inaugurated an evangelical church, the Forky Jlaleh Family Fellowship, within his residence (citing BBC Afrique, 22 January 2019). Its categories file him among evangelical Christian political figures."
