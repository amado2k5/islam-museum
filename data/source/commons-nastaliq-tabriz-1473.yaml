summary:
  ar: "صورة مخطوطة عربية وفارسية نسخها عبد الرحيم اليعقوبي في تبريز عام 878هـ/1473م، نصها العربي بالنستعليق الذهبي والفارسي بالنستعليق الأسود الأصغر، برخصة الملك العام."
  en: "Photograph of an Arabic-Persian manuscript copied by Abd al-Rahim al-Ya'qubi in Tabriz in 878 AH/1473 CE, its Arabic in gold nasta'liq and its Persian in smaller black nasta'liq, released as public domain."
  ur: "عبد الرحیم یعقوبی کی طرف سے تبریز میں 878ھ/1473ء میں نقل شدہ عربی فارسی مخطوطہ کی تصویر؛ عربی حصہ سنہری نستعلیق اور فارسی چھوٹے سیاہ نستعلیق میں، عوامی ملکیت کے تحت۔"
  es: "Fotografía de un manuscrito árabe-persa copiado por Abd al-Rahim al-Ya'qubi en Tabriz en el año 878 AH/1473 CE, con su texto en árabe escrito en nasta'liq dorado y su texto en persa escrito en nasta'liq negro más pequeño, publicado como dominio público."
  fr: "Photographie d'un manuscrit arabo-persan copié par Abd al-Rahim al-Ya'qubi à Tabriz en 878 AH/1473 CE, son arabe en nasta'liq d'or et son persan en nasta'liq noir plus petit, publié dans le domaine public."
  tr: "Abd al-Rahim al-Ya'qubi tarafından 878 Hicri / 1473 yılında Tebriz'de kopyalanmış, Arapça metni altın Nastaliq ve Farsça ile Farsça metni Asghar Kara Nastaliq'ta ve kamu malı olarak lisanslanmış bir kopya."
  id: "Salinan manuskrip Arab dan Persia yang disalin oleh Abd al-Rahim al-Ya'qubi di Tabriz pada tahun 878 H / 1473 M, dengan teks Arabnya dalam Nastaliq emas dan Persia dalam Asghar Black Nastaliq, dilisensikan oleh domain publik."
