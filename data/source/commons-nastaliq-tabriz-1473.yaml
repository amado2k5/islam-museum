reliability_note: "File page and licence section inspected on 15 November 2026: the image is a faithful photograph of a two-dimensional public-domain work, marked PDMC with a United States public-domain tag; the work itself is a 1473 Tabriz manuscript whose description states the Arabic text is in gold nasta'liq and the Persian translation in smaller black nasta'liq, with a dedication to the Aqquyunlu Sultan Ya'qub and a colophon dated 10 Rabi' II 878/4 September 1473. The photograph source is a Christie's lot page; the museum uses the image as a dated surviving example of nasta'liq, not as evidence about the script's invention."
