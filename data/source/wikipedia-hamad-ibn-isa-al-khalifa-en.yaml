summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حمد بن عيسى آل خليفة (1872–1942)؛ تُستخدم لوقائع الكيان فقط. تروي أنه ثاني أبناء عيسى بن علي، ونائب الحاكم من سنة 1923 وحاكم البحرين من 1932 حتى وفاته في الروميثة سنة 1942، وبدء إنتاج النفط سنة 1932 ودور المستشار بلغريف، وقائمة أبنائه ومنهم سلمان (1894–1961) وعبد الله (1915–1973). صندوق معلوماتها يذكر دينه: الإسلام السنّي."
  en: "English Wikipedia article on Hamad bin Isa Al Khalifa (1872–1942); used for entity facts only. It recounts that he was the second son of Isa bin Ali, deputy ruler from 1923 and Hakim of Bahrain from 1932 until his death at Al Rumaitha in 1942, the start of oil production in 1932 and the role of the adviser Belgrave, and lists his children, among them Salman (1894–1961) and Abdullah (1915–1973). Its infobox gives his religion as Sunni Islam."
