summary:
  ar: "أرشيف الدروس المسجّلة لـراغب السرجاني على موقع Assabile، ويضم 1 سلسلة تضم نحو 15 درسا بحسب صفحة الموقع. مصدر أولي لما يقوله المتحدث في تلك التسجيلات، لا مصدر مستقل على الوقائع التاريخية."
  en: "The archive of Ragheb El-Sergani's recorded lessons on the Assabile website: 1 series, about 15 lessons by the site's own count. A primary source for what the speaker says in those recordings, not independent corroboration of historical events."
  ur: "Assabile ویب سائٹ پر راغب السرجانی کے ریکارڈ شدہ دروس کا آرکائیو: سائٹ کے اپنے شمار کے مطابق 1 سلسلے، تقریباً 15 اسباق۔ یہ ماخذ اس بات کا اولین ثبوت ہے کہ مقرر ان ریکارڈنگز میں کیا کہتا ہے، تاریخی واقعات کی آزاد تصدیق نہیں۔"
  es: "El archivo de las lecciones grabadas de Ragheb El-Sergani en el sitio web de Assabile consta de una serie de aproximadamente 15 lecciones, según el propio sitio. Se trata de una fuente primaria de lo que dice el orador en esas grabaciones, pero no una corroboración independiente de los hechos históricos."
  fr: "Les archives des leçons enregistrées de Ragheb El-Sergani sur le site web Assabile: une série, soit une quinzaine de leçons selon le décompte du site. Il s’agit d’une source primaire relatant les propos de l’orateur dans ces enregistrements, et non d’une corroboration indépendante des événements historiques."
  tr: "Ragheb Al-Serjani'nin Asabile web sitesindeki kaydedilmiş derslerinin arşivi, sitenin sayfasına göre yaklaşık 15 ders içeren bir seri dahil. Bu kayıtlarda konuşmacının söylediklerine dair birincil kaynak, bağımsız tarihsel gerçekler değil."
  id: "Arsip pelajaran yang direkam oleh Ragheb Al-Serjani di situs web Asabile, termasuk 1 seri yang berisi sekitar 15 pelajaran menurut halaman situs. Sumber utama untuk apa yang dikatakan pembicara dalam rekaman tersebut, bukan sumber independen tentang fakta sejarah."
