reliability_note: "Pointer for entity facts only: a fact is used only where the article cites a source for it. Read at the recorded revision and checked against it on 26 October 2026. Gives Mohamed Hafez Ibrahim, born 24 February 1872 at Dairut (its lead nonetheless spans 1871-1932), died 21 June 1932 at Cairo; 'Poet of the Nile' and 'Poet of the People' (Lababidi 2008; Kabha in Dictionary of African Biography 2012); Military Academy 1888, Sudan service and court-martial, head of the literary section of Dar al-Kutub from 1911 with the title Bey; his 1903 translation of Hugo's Les Misérables. It makes no statement of his religion anywhere in its text."
