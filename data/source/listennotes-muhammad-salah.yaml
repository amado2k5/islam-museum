  ar: "صفحة بودكاست مسلم سنترال للدكتور محمد صلاح مع سيرته القياسية: من أعلام العلماء في الولايات المتحدة، قاد المركز الإسلامي في فيكتوريا بتكساس وأسّس مدرستين، مقدّم برنامج «اسأل هدى» على قناة هدى ومشرفها الديني، يحمل بكالوريوس الشريعة والقانون من الأزهر وبكالوريوس الصيدلة ودبلوم الدراسات الإسلامية، ويدرّس في الأزهر وأكاديمية الشريعة وكلية لندن."
  en: "Muslim Central's podcast page for Dr. Muhammad Salah with his standard biography: one of the well-known scholars in the US; he led the Islamic Center of Victoria, Texas and founded two schools; presenter of Ask Huda on Huda TV and its religious supervisor; he holds a BA in Sharia and Islamic Law from Al-Azhar and a BA in pharmacology, a diploma in Muslim arts and calligraphy, and a pre-master diploma in Islamic studies; he teaches at Al-Azhar University, Shariah Academy and London College."
