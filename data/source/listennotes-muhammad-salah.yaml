summary:
  ar: "صفحة بودكاست مسلم سنترال للدكتور محمد صلاح مع سيرته القياسية: من أعلام العلماء في الولايات المتحدة، قاد المركز الإسلامي في فيكتوريا بتكساس وأسّس مدرستين، مقدّم برنامج «اسأل هدى» على قناة هدى ومشرفها الديني، يحمل بكالوريوس الشريعة والقانون من الأزهر وبكالوريوس الصيدلة ودبلوم الدراسات الإسلامية، ويدرّس في الأزهر وأكاديمية الشريعة وكلية لندن."
  en: "Muslim Central's podcast page for Dr. Muhammad Salah with his standard biography: one of the well-known scholars in the US; he led the Islamic Center of Victoria, Texas and founded two schools; presenter of Ask Huda on Huda TV and its religious supervisor; he holds a BA in Sharia and Islamic Law from Al-Azhar and a BA in pharmacology, a diploma in Muslim arts and calligraphy, and a pre-master diploma in Islamic studies; he teaches at Al-Azhar University, Shariah Academy and London College."
  es: "Página de podcasts de Muslim Central sobre el Dr. Muhammad Salah con su biografía habitual: uno de los eruditos más conocidos de EE. UU.; dirigió el Centro Islámico de Victoria, Texas, y fundó dos escuelas; presentador de Ask Huda en Huda TV y su supervisor religioso; posee una licenciatura en Sharia y Derecho Islámico por Al-Azhar y una licenciatura en farmacología, un diploma en artes y caligrafía musulmanas y un diploma pre-máster en estudios islámicos; imparte clases en la Universidad de Al-Azhar, la Academia Sharia y el London College."
  fr: "La page du podcast de Muslim Central consacrée au Dr Muhammad Salah présente sa biographie habituelle: l’un des érudits les plus connus aux États-Unis; il a dirigé le Centre islamique de Victoria, au Texas, et fondé deux écoles; présentateur de l’émission « Ask Huda » sur Huda TV et son superviseur religieux; il est titulaire d’une licence en charia et droit islamique d’Al-Azhar, d’une licence en pharmacologie, d’un diplôme en arts musulmans et calligraphie, et d’un diplôme de pré-master en études islamiques; il enseigne à l’université Al-Azhar, à la Shariah Academy et au London College."
