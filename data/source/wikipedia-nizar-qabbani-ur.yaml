summary:
  ar: "مقالة ويكيبيديا الأردية الموجزة عن نزار قباني؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 21 مارس 1923 ووفاته في 30 أبريل 1998، موافقةً المقالة العربية خلافًا لـ22 مارس في المقالة الإنجليزية."
  en: "Urdu Wikipedia stub on Nizar Qabbani; used for entity facts only. It gives his birth on 21 March 1923 and his death on 30 April 1998, agreeing with the Arabic article against the English article's 22 March."
  es: "Fragmento de la Wikipedia en urdu sobre Nizar Qabbani; se utiliza únicamente para datos biográficos. Indica que nació el 21 de marzo de 1923 y falleció el 30 de abril de 1998, coincidiendo con el artículo en árabe, a diferencia del artículo en inglés, que indica el 22 de marzo."
  fr: "Ébauche de l'article Wikipédia en ourdou sur Nizar Qabbani; utilisée uniquement pour les informations le concernant. Elle indique sa naissance le 21 mars 1923 et son décès le 30 avril 1998, ce qui concorde avec l'article arabe et non avec l'article anglais qui mentionne le 22 mars."
  ur: "نزار قبانی پر اردو ویکیپیڈیا اسٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 21 مارچ 1923 کو ان کی پیدائش اور 30 اپریل 1998 کو ان کی موت بتاتا ہے، انگریزی مضمون کے 22 مارچ کے خلاف عربی مضمون سے اتفاق کرتا ہے۔"
  tr: "Urduca Vikipedi makalesi Nizar Qabbani hakkında özetlidir; yalnızca varlığın gerçekleri için kullanılır. 21 Mart 1923'teki doğumu ve 30 Nisan 1998'deki ölümü, İngilizce makaledeki 22 Mart'ın aksine, Arapça makale tarafından onaylanmıştır."
  id: "Artikel Wikipedia dalam bahasa Urdu singkat tentang Nizar Qabbani; digunakan hanya untuk fakta entitas. Kelahirannya pada 21 Maret 1923, dan kematiannya pada 30 April 1998, disetujui oleh artikel Arab, berbeda dengan 22 Maret dalam artikel bahasa Inggris."
