summary:
  ar: "مقالة ويكيبيديا الإنجليزية ⁦(بذرة)⁩ عن القوّال منشي رضي الدين أحمد خان؛ لوقائع الكيان فقط: مولده في دلهي في 1912، وغناؤه في بلاط نظام حيدر آباد، وانتقاله إلى كراتشي بعد 1948، وفرقته مع أبناء عمومته (1956–1966)، ووسام حسن الأداء في 1967، وشارعه في «قوالی گلی» بكراتشي، ووفاته في 2003؛ وتستند إلى داون وذا إكسبريس تريبيون."
  en: "English Wikipedia stub on the qawwal Munshi Raziuddin Ahmed Khan; entity facts only: birth in Delhi in 1912, his singing at the court of the Nizam of Hyderabad, his move to Karachi after 1948, his party with his cousins (1956–1966), the Pride of Performance in 1967, his street in Karachi's 'Qawwali Gali', and death in 2003; it cites Dawn and The Express Tribune."
