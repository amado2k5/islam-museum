summary:
  ar: "مقالة ويكيبيديا الإنجليزية ⁦(بذرة)⁩ عن القوّال منشي رضي الدين أحمد خان؛ لوقائع الكيان فقط: مولده في دلهي في 1912، وغناؤه في بلاط نظام حيدر آباد، وانتقاله إلى كراتشي بعد 1948، وفرقته مع أبناء عمومته (1956–1966)، ووسام حسن الأداء في 1967، وشارعه في «قوالی گلی» بكراتشي، ووفاته في 2003؛ وتستند إلى داون وذا إكسبريس تريبيون."
  en: "English Wikipedia stub on the qawwal Munshi Raziuddin Ahmed Khan; entity facts only: birth in Delhi in 1912, his singing at the court of the Nizam of Hyderabad, his move to Karachi after 1948, his party with his cousins (1956–1966), the Pride of Performance in 1967, his street in Karachi's 'Qawwali Gali', and death in 2003; it cites Dawn and The Express Tribune."
  es: "Breve reseña de la Wikipedia en inglés sobre el qawwal Munshi Raziuddin Ahmed Khan; solo datos sobre la persona: nacimiento en Delhi en 1912, su canto en la corte del Nizam de Hyderabad, su traslado a Karachi después de 1948, su fiesta con sus primos (1956-1966), el premio Pride of Performance en 1967, su calle en la 'Qawwali Gali' de Karachi y su muerte en 2003; cita a Dawn y The Express Tribune."
  fr: "Ébauche de l'article Wikipédia en anglais sur le qawwal Munshi Raziuddin Ahmed Khan; faits concernant uniquement l'entité: naissance à Delhi en 1912, ses prestations à la cour du Nizam d'Hyderabad, son installation à Karachi après 1948, son groupe avec ses cousins (1956-1966), le prix Pride of Performance en 1967, sa rue dans le quartier « Qawwali Gali » de Karachi et sa mort en 2003; l'article cite Dawn et The Express Tribune."
  ur: "قوال منشی رضی الدین احمد خان پر انگریزی ویکیپیڈیا کا سٹب؛ ہستی کے حقائق صرف: 1912 میں دہلی میں پیدائش، حیدرآباد کے نظام کے دربار میں ان کا گانا، 1948 کے بعد کراچی منتقل ہونا، اپنے کزنز کے ساتھ ان کی پارٹی (1956-1966)، 1967 میں پرائیڈ آف پرفارمنس، کراچی کی 'قوالی گلی' میں ان کی گلی، اور 2003 میں موت؛ اس نے ڈان اور ایکسپریس ٹریبیون کا حوالہ دیا۔"
  tr: "Qawwal Manshi Raziuddin Ahmad Khan hakkında İngilizce Vikipedi makalesi (taslak); sadece varlık için gerçekler: 1912'de Delhi'de doğması, Haydarabad Nizam sarayında şarkı söylemesi, 1948'den sonra Karaçi'ye taşınması, kuzenleriyle birlikte grubu (1956–1966), 1967'de Mükemmellik Madalyası, Karaçi'deki 'Qawwali Gali'ye katılımı ve 2003'teki ölümü; Dawn ve The Express Tribune'a dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris (stub) tentang qawwal Manshi Raziuddin Ahmad Khan; hanya untuk fakta entitas: kelahirannya di Delhi pada tahun 1912, nyanyiannya di istana Nizam Hyderabad, kepindahannya ke Karachi setelah 1948, bandnya bersama sepupunya (1956–1966), Medal of Excellence pada tahun 1967, partisipasinya dalam 'Qawwali Gali' di Karachi, dan kematiannya pada tahun 2003; didasarkan pada Dawn dan The Express Tribune."
