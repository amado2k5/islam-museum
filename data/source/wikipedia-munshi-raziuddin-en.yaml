summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0625\u0646\u062c\u0644\u064a\u0632\u064a\u0629 \u2066(\u0628\u0630\u0631\u0629)\u2069 \u0639\u0646 \u0627\u0644\u0642\u0648\u0651\u0627\u0644 \u0645\u0646\u0634\u064a \u0631\u0636\u064a \u0627\u0644\u062f\u064a\u0646 \u0623\u062d\u0645\u062f \u062e\u0627\u0646\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u062f\u0644\u0647\u064a \u0641\u064a 1912\u060c \u0648\u063a\u0646\u0627\u0624\u0647 \u0641\u064a \u0628\u0644\u0627\u0637 \u0646\u0638\u0627\u0645 \u062d\u064a\u062f\u0631 \u0622\u0628\u0627\u062f\u060c \u0648\u0627\u0646\u062a\u0642\u0627\u0644\u0647 \u0625\u0644\u0649 \u0643\u0631\u0627\u062a\u0634\u064a \u0628\u0639\u062f 1948\u060c \u0648\u0641\u0631\u0642\u062a\u0647 \u0645\u0639 \u0623\u0628\u0646\u0627\u0621 \u0639\u0645\u0648\u0645\u062a\u0647 (1956\u20131966)\u060c \u0648\u0648\u0633\u0627\u0645 \u062d\u0633\u0646 \u0627\u0644\u0623\u062f\u0627\u0621 \u0641\u064a 1967\u060c \u0648\u0634\u0627\u0631\u0639\u0647 \u0641\u064a \u00ab\u0642\u0648\u0627\u0644\u06cc \u06af\u0644\u06cc\u00bb \u0628\u0643\u0631\u0627\u062a\u0634\u064a\u060c \u0648\u0648\u0641\u0627\u062a\u0647 \u0641\u064a 2003\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u062f\u0627\u0648\u0646 \u0648\u0630\u0627 \u0625\u0643\u0633\u0628\u0631\u064a\u0633 \u062a\u0631\u064a\u0628\u064a\u0648\u0646."
  en: "English Wikipedia stub on the qawwal Munshi Raziuddin Ahmed Khan; entity facts only: birth in Delhi in 1912, his singing at the court of the Nizam of Hyderabad, his move to Karachi after 1948, his party with his cousins (1956\u20131966), the Pride of Performance in 1967, his street in Karachi's 'Qawwali Gali', and death in 2003; it cites Dawn and The Express Tribune."
