  ar: "وثيقة «A Grammar of the Arabic Language, vol. 1 (3rd ed.)»، Cambridge University Press (PDF copy on ghazali.org). لم يفتح المتحف هذا المرجع بنفسه؛ عُرف ما قيل عنه من ملخص بحثي قدّمه المؤسس إلى المتحف ووافق على استعماله في 21 نوفمبر 2026. يُستشهد به في: أوزان الفعل المزيد، الأسماء المشتقة، الإعراب، المثنى والجمع، العدد من ثلاثة إلى عشرة، الممنوع من الصرف."
  en: "The document \"A Grammar of the Arabic Language, vol. 1 (3rd ed.)\" (Cambridge University Press (PDF copy on ghazali.org)). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum by the founder, who approved its use on 21 November 2026. Cited for: the verb forms, derived nouns, case endings, the dual and the plural, the numbers three to ten, diptotes."
  ur: "دستاویز «A Grammar of the Arabic Language, vol. 1 (3rd ed.)»، Cambridge University Press (PDF copy on ghazali.org)۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ بانی کے فراہم کردہ تحقیقی خلاصے سے ہے، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ ان کے لیے دیا گیا: افعال کے اوزان، مشتق اسماء، اعراب، مثنیٰ اور جمع، تین سے دس تک کے اعداد، ممنوع من الصرف۔"
  fr: "Le document « A Grammar of the Arabic Language, vol. 1 (3rd ed.) » (Cambridge University Press (PDF copy on ghazali.org)). Le musée ne l'a pas ouvert lui-même : ce qu'on en sait vient d'un résumé de recherche fourni au musée par le fondateur, qui en a approuvé l'usage le 21 novembre 2026. Cité pour : les formes verbales, les noms dérivés, les cas et leurs terminaisons, le duel et le pluriel, les nombres de trois à dix, les diptotes."
  es: "El documento «A Grammar of the Arabic Language, vol. 1 (3rd ed.)» (Cambridge University Press (PDF copy on ghazali.org)). El museo no lo abrió por sí mismo: lo que se sabe de él procede de un resumen de investigación entregado al museo por el fundador, que aprobó su uso el 21 de noviembre de 2026. Citado para: las formas verbales, los nombres derivados, los casos y sus terminaciones, el dual y el plural, los números del tres al diez, los diptotos."
