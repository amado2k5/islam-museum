summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سعود الشريم؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بالرياض في 19 يناير 1966، ودكتوراه أم القرى 1995، وإمامته وخطابته بالحرم من 1991 إلى اعتزاله 2022؛ وصندوق سيرتها الدينية المضمّن يعطي المذهب سني والعقيدة أثري والفقه حنبلي والحركة سلفية."
  en: "English Wikipedia article on Saud Al-Shuraim; used for entity facts only. It gives his birth at Riyadh on 19 January 1966, his 1995 Umm al-Qura doctorate, and his service as imam and khatib of the Grand Mosque from 1991 until his retirement in 2022; its embedded religious-biography infobox gives denomination Sunni, creed Athari, jurisprudence Hanbali and movement Salafism."
  es: "Artículo de la Wikipedia en inglés sobre Saud Al-Shuraim; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Riad el 19 de enero de 1966, su doctorado por la Universidad Umm al-Qura en 1995 y su servicio como imán y khatib de la Gran Mezquita desde 1991 hasta su jubilación en 2022; su ficha biográfica religiosa integrada indica su denominación sunita, su credo athari, su jurisprudencia hanbalí y su movimiento salafista."
  fr: "Article Wikipédia en anglais sur Saoud Al-Shuraim; utilisé uniquement pour les informations le concernant. Il indique sa naissance à Riyad le 19 janvier 1966, son doctorat de l’université Umm al-Qura obtenu en 1995 et son service en tant qu’imam et khatib de la Grande Mosquée de 1991 à sa retraite en 2022; son infobox biographique religieuse intégrée précise son appartenance à l’islam sunnite, à la religion athari, au courant juridique hanbalite et au salafisme."
  ur: "سعود الشریم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 19 جنوری 1966 کو ریاض میں ان کی پیدائش، 1995 میں ام القراء ڈاکٹریٹ، اور 1991 سے 2022 میں ریٹائرمنٹ تک جامع مسجد کے امام اور خطیب کی حیثیت سے خدمات انجام دیتا ہے۔ اس کا سرایت شدہ مذہبی سوانح حیات کا انفو باکس فرقہ سنی، مسلک اطہری، فقہ حنبلی اور تحریک سلفیت دیتا ہے۔"
  tr: "Suud El-Şuraim hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 19 Ocak 1966'da Riyad'da doğduğunu, 1995'te um al-Kura'dan doktora derecesini, 1991'den 2022'de emekli olana kadar Haram'daki imamı ve vaazını belirtmektedir; ve dahil edilen dini biyografi kutusunda Sünni doktrini, eski inanç, Hanbali fıkıhi ve Selefi hareketi yer almaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Saud Al-Shuraim; digunakan hanya untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya di Riyadh pada 19 Januari 1966, PhD dari um Al-Qura pada 1995, imamat dan khotbahnya di Haram dari 1991 hingga pensiun pada 2022; dan kotak biografi agama yang disertakan memuat doktrin Sunni, kredo kuno, yurisprudensi Hanbali, dan gerakan Salafi."
