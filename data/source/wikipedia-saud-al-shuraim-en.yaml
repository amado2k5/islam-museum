  en: "English Wikipedia article on Saud Al-Shuraim; used for entity facts only. It gives his birth at Riyadh on 19 January 1966, his 1995 Umm al-Qura doctorate, and his service as imam and khatib of the Grand Mosque from 1991 until his retirement in 2022; its embedded religious-biography infobox gives denomination Sunni, creed Athari, jurisprudence Hanbali and movement Salafism."
