summary:
  ar: "أقدم مخطوط معروف لصحيح البخاري، نسخة نحو سنة 1000م محفوظة في مكتبة كادبوري للأبحاث ببرمنغهام (Islamic Arabic 225)، صدرت طبعتها المصورة عام 1936 على يد المستشرق Mingana؛ الملف مرخص CC0."
  en: "The oldest known manuscript of Sahih al-Bukhari, a copy dated about 1000 CE held at Birmingham's Cadbury Research Library (Islamic Arabic 225), published in a scanned edition by orientalist Mingana in 1936; the file is CC0."
  ur: "صحیح بخاری کا قدیم ترین معلوم مخطوطہ، تقریباً 1000ء کی نقل جو برمنگھم کی کادبوری ریسرچ لائبریری (Islamic Arabic 225) میں ہے، مستشرق مینگانا کی 1936ء کی مصور اشاعت کے ساتھ؛ فائل CC0 ہے۔"
  es: "El manuscrito más antiguo conocido de Sahih al-Bukhari, una copia fechada alrededor del año 1000 d. C. que se conserva en la Biblioteca de Investigación Cadbury de Birmingham (Islamic Arabic 225), fue publicado en una edición escaneada por el orientalista Mingana en 1936; el archivo tiene licencia CC0."
  fr: "Le plus ancien manuscrit connu du Sahih al-Bukhari, une copie datant d'environ 1000 CE conservée à la Cadbury Research Library de Birmingham (Islamic Arabic 225), a été publié dans une édition numérisée par l'orientaliste Mingana en 1936; le fichier est CC0."
  tr: "Sahih al-Bukhari'nin bilinen en eski el yazması, yaklaşık MS 1000 yılına ait bir kopyası, Birmingham'daki Cadbury Araştırma Kütüphanesi'nde korunmaktadır (İslami Arapça 225). Resimli baskısı 1936'da oryantalist Mingana tarafından yayımlanmıştır; dosya CC0 lisanslıdır."
  id: "Naskah tertua yang diketahui dari Sahih al-Bukhari, sebuah salinan sekitar tahun 1000 M, disimpan di Perpustakaan Riset Cadbury di Birmingham (Arab Islam 225). Edisi bergambar yang diterbitkan pada tahun 1936 oleh orientalis Mingana; berkas tersebut berlisensi CC0."
