summary:
  ar: "نشرة عبد السلام هارون من «البيان والتبيين» لأبي عثمان عمرو بن بحر الجاحظ ⁦(150-255هـ)⁩، وهي الكتاب الثاني من سلسلته «مكتبة الجاحظ»، في أربعة أجزاء، مع مقدمة المحقق المؤرخة 16 أغسطس 1948 ومقدمة الطبعة الثانية التي قوبلت فيها على نسخة فيض الله؛ والمسح الواحد يضم الأجزاء الأربعة."
  en: "'Abd al-Salam Harun's edition of al-Bayan wa-l-Tabyin by Abu 'Uthman 'Amr ibn Bahr al-Jahiz (150-255 AH), the second book of his 'Jahiz Library' series, in four volumes, with the editor's introduction dated 16 August 1948 and the introduction to the second edition, for which the text was collated with the Feyzullah manuscript; the single scan holds all four volumes."
  ur: "ابو عثمان عمرو بن بحر جاحظ ⁦(150-255ھ)⁩ کی «البیان والتبیین» کا عبد السلام ہارون کا ایڈیشن، ان کے سلسلے «مکتبۃ الجاحظ» کی دوسری کتاب، چار اجزاء میں، محقق کے 16 اگست 1948 کے مقدمے اور دوسرے ایڈیشن کے مقدمے کے ساتھ، جس میں متن کا فیض اللہ نسخے سے مقابلہ کیا گیا؛ ایک ہی اسکین میں چاروں اجزاء ہیں۔"
