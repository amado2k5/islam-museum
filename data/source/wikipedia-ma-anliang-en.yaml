reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026, fetched through the MediaWiki API by its recorded revision id with the returned id asserted equal. The menhuan sentence — 'They belonged to the Huasi menhuan, of the Khafiya Naqshbandi Sufi order', of the 1872 defectors including Ma Anliang and his father Ma Zhan'ao — cites Michael Dillon, China's Muslim Hui Community (1999), p. 140. The death date (24 November 1918, at Hezhou) cites The Far Eastern Review (1919) and The Moslem World (1920). Its categories file him under the Naqshbandi order and Chinese Sufis; categories are filings, not attestation."
