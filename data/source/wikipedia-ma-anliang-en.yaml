summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ما انليانغ؛ تُستخدم لوقائع الكيان فقط. تذكر جنرالًا مسلمًا صينيًا وُلد في هتشو سنة 1855 ابنًا لما جان آو، انشقّ مع والده إلى التشينغ سنة 1872، وكان بحسب متنها — ناقلة عن ديلون — من المنتمين مع والده ورفاقه إلى منحوان هواسي من الطريقة النقشبندية الخفية الصوفية، ثم صار القائد الفعلي لمسلمي شمال غرب الصين من 1912 حتى وفاته في هتشو في 24 تشرين الثاني 1918."
  en: "English Wikipedia article on Ma Anliang; used for entity facts only. It records a Chinese Muslim general born at Hezhou in 1855, son of Ma Zhan'ao, who defected with his father to the Qing in 1872 and — its text states, citing Dillon — belonged with his father and their companions to the Huasi menhuan of the Khafiya Naqshbandi Sufi order; he became the de facto senior leader of the Muslims of northwest China from 1912 until his death at Hezhou on 24 November 1918."
