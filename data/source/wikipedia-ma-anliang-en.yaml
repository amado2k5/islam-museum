summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ما انليانغ؛ تُستخدم لوقائع الكيان فقط. تذكر جنرالًا مسلمًا صينيًا وُلد في هتشو سنة 1855 ابنًا لما جان آو، انشقّ مع والده إلى التشينغ سنة 1872، وكان بحسب متنها — ناقلة عن ديلون — من المنتمين مع والده ورفاقه إلى منحوان هواسي من الطريقة النقشبندية الخفية الصوفية، ثم صار القائد الفعلي لمسلمي شمال غرب الصين من 1912 حتى وفاته في هتشو في 24 تشرين الثاني 1918."
  en: "English Wikipedia article on Ma Anliang; used for entity facts only. It records a Chinese Muslim general born at Hezhou in 1855, son of Ma Zhan'ao, who defected with his father to the Qing in 1872 and — its text states, citing Dillon — belonged with his father and their companions to the Huasi menhuan of the Khafiya Naqshbandi Sufi order; he became the de facto senior leader of the Muslims of northwest China from 1912 until his death at Hezhou on 24 November 1918."
  es: "Artículo de la Wikipedia en inglés sobre Ma Anliang; utilizado únicamente para datos sobre la persona. Describe a un general musulmán chino nacido en Hezhou en 1855, hijo de Ma Zhan'ao, que desertó con su padre al Qing en 1872 y —según su texto, que cita a Dillon— perteneció, junto con su padre y sus compañeros, al Huasi menhuan de la orden sufí Khafiya Naqshbandi; se convirtió en el líder de facto de los musulmanes del noroeste de China desde 1912 hasta su muerte en Hezhou el 24 de noviembre de 1918."
  fr: "Article de Wikipédia en anglais sur Ma Anliang; utilisé uniquement pour les informations sur l'entité. Il relate l'histoire d'un général musulman chinois né à Hezhou en 1855, fils de Ma Zhan'ao, qui fit défection avec son père au profit des Qing en 1872 et — selon le texte, citant Dillon — appartenait avec son père et leurs compagnons au Huasi menhuan de l'ordre soufi Khafiya Naqshbandi; il devint le chef de facto des musulmans du nord-ouest de la Chine de 1912 jusqu'à sa mort à Hezhou le 24 novembre 1918."
  ur: "ما اینلیانگ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1855 میں ہیزو میں پیدا ہونے والے ایک چینی مسلمان جنرل کو ریکارڈ کیا گیا ہے، جو ما ژاناؤ کا بیٹا تھا، جو 1872 میں اپنے والد کے ساتھ کنگ میں چلا گیا تھا اور - اس کے متن میں، ڈلن کا حوالہ دیتے ہوئے کہا گیا ہے کہ - اپنے والد اور ان کے ساتھیوں کے ساتھ خفیہ نقشبندی صوفی حکم کے ہواسی مینہون سے تعلق رکھتے تھے۔ وہ 1912 سے لے کر 24 نومبر 1918 کو ہیزو میں اپنی موت تک شمال مغربی چین کے مسلمانوں کے ڈی فیکٹو سینئر رہنما بن گئے۔"
