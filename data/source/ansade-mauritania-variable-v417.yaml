  ar: "«فهرس البيانات الخام لدى ANSADE، المتغير V417، اللغة الأم Q11، التعداد الخامس»، الوكالة الوطنية للإحصاء والتحليل الديمغرافي والاقتصادي في موريتانيا ANSADE، 2023. ورد في ملخص بحثي زُوّد به المتحف مع إدخال نسب اللغات في موريتانيا؛ ولم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص كما ورد في 21 نوفمبر 2026."
