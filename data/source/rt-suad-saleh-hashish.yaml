id: source/rt-suad-saleh-hashish
class: source
label:
  ar: "«روسيا اليوم: هجوم مصري على أستاذة الأزهر صاحبة فتوى «جواز تعاطي الحشيش»»"
  en: "RT Arabic: Egyptian backlash against the Al-Azhar professor over the cannabis remarks"
  ur: "«آر ٹی عربی: سعاد صالح کے بھنگ والے بیان پر مصری ردعمل»"
summary:
  ar: «تقرير قناة روسيا اليوم (RT Arabic) عن الجدل الذي أثارته تصريحات سعاد صالح في برومو بودكاست «السر» سنة 2025 حول الحشيش، وقرار جامعة الأزهر إيقافها وإحالتها إلى التحقيق، ورد دار الإفتاء المصرية. قُرئ التقرير عبر مجمّع نبض الإخباري في أكتوبر 2026.»
  en: "RT Arabic's report on the controversy over Suad Saleh's 2025 remarks about cannabis in a promo for the podcast 'Al-Sirr', Al-Azhar University's decision to suspend her and refer her to investigation, and the response of Egypt's Dar al-Ifta. Read via the Nabd news aggregator in October 2026."
  ur: «2025 میں سعاد صالح کے بھنگ سے متعلق بیان، جامعہ ازہر کے فیصلے اور دارالافتاء مصر کے ردعمل پر آر ٹی عربی کی رپورٹ۔»
  es: "El reportaje de RT Arabic sobre la controversia generada por las declaraciones de Suad Saleh en 2025 acerca del cannabis en un avance del podcast «Al-Sirr», la decisión de la Universidad de Al-Azhar de suspenderla y someterla a investigación, y la respuesta de Dar al-Ifta de Egipto. Disponible en el agregador de noticias Nabd desde octubre de 2026."
  fr: "Le reportage de RT Arabic sur la polémique suscitée par les propos de Suad Saleh en 2025 concernant le cannabis dans une promotion du podcast « Al-Sirr », la décision de l'université Al-Azhar de la suspendre et de la saisir d'une enquête, ainsi que la réaction de Dar al-Ifta en Égypte. À lire via l'agrégateur d'actualités Nabd en octobre 2026."
  tr: "\"Rusya Today (RT Arapça) tarafından Suad Saleh'in 2025 tanıtım podcast'i 'Al-Sir'de haşişle ilgili açıklamaları ve El-Ezher Üniversitesi'nin haşişi askıya alma ve soruşturmaya sevk etme kararı üzerine başlatılan tartışma hakkında bir rapor, Mısır Dar el-İfta tarafından bildirildi.\" Rapor, Ekim 2026'da Nabd Haber Kompleksi aracılığıyla okundu."
  id: "\"Laporan dari Russia Today (RT Arabic) tentang kontroversi yang dipicu oleh pernyataan Suad Saleh dalam podcast promo 2025 'Al-Sir' tentang hashish, dan keputusan Universitas Al-Azhar untuk menangguhkannya dan merujuknya untuk penyelidikan, seperti yang dilaporkan oleh Dar al-Ifta Mesir.\" Laporan tersebut dibacakan melalui Nabd News Complex pada Oktober 2026."
