  ar: "«روسيا اليوم: هجوم مصري على أستاذة الأزهر صاحبة فتوى «جواز تعاطي الحشيش»»"
  en: "RT Arabic: Egyptian backlash against the Al-Azhar professor over the cannabis remarks"
  ur: "«آر ٹی عربی: سعاد صالح کے بھنگ والے بیان پر مصری ردعمل»"
summary:
  ar: «تقرير قناة روسيا اليوم (RT Arabic) عن الجدل الذي أثارته تصريحات سعاد صالح في برومو بودكاست «السر» سنة 2025 حول الحشيش، وقرار جامعة الأزهر إيقافها وإحالتها إلى التحقيق، ورد دار الإفتاء المصرية. قُرئ التقرير عبر مجمّع نبض الإخباري في أكتوبر 2026.»
  en: "RT Arabic's report on the controversy over Suad Saleh's 2025 remarks about cannabis in a promo for the podcast 'Al-Sirr', Al-Azhar University's decision to suspend her and refer her to investigation, and the response of Egypt's Dar al-Ifta. Read via the Nabd news aggregator in October 2026."
  ur: «2025 میں سعاد صالح کے بھنگ سے متعلق بیان، جامعہ ازہر کے فیصلے اور دارالافتاء مصر کے ردعمل پر آر ٹی عربی کی رپورٹ۔»
