summary:
  ar: "مقالة ويكيبيديا العربية عن نور ميسواري ⁦(وُلد 1939)⁩؛ تُستخدم لوقائع الكيان فقط. مقالة مختصرة تذكر مولده في 3 مارس 1939 في تابول بسولو، وأنه ثوري وسياسي من شعب المورو ومؤسس الجبهة الوطنية لتحرير مورو وزعيمها."
  en: "Arabic Wikipedia article on Nur Misuari (born 1939); used for entity facts only. A short article giving his birth on 3 March 1939 at Tapul, Sulu, and describing him as a Moro revolutionary and politician, founder and leader of the Moro National Liberation Front. Closely follows the English article, so it is not a fully independent family from it."
  es: "Artículo de Wikipedia en árabe sobre Nur Misuari (nacido en 1939); utilizado únicamente para datos sobre la persona. Un breve artículo que indica su nacimiento el 3 de marzo de 1939 en Tapul, Sulu, y lo describe como un revolucionario y político moro, fundador y líder del Frente Moro de Liberación Nacional. Sigue de cerca el artículo en inglés, por lo que no es completamente independiente."
  fr: "Article Wikipédia en arabe sur Nur Misuari (né en 1939); utilisé uniquement à titre informatif. Ce court article indique sa naissance le 3 mars 1939 à Tapul, dans la province de Sulu, et le décrit comme un révolutionnaire et homme politique moro, fondateur et dirigeant du Front de libération nationale moro. Cet article reprend en grande partie l'article en anglais et ne constitue donc pas une famille totalement indépendante."
  ur: "نور مسوری ⁦(پیدائش 1939)⁩ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون جس میں 3 مارچ 1939 کو تاپول، سولو میں ان کی پیدائش ہوئی، اور اسے مورو کے ایک انقلابی اور سیاست دان، مورو نیشنل لبریشن فرنٹ کے بانی اور رہنما کے طور پر بیان کیا گیا۔ انگریزی مضمون کی قریب سے پیروی کرتا ہے، لہذا یہ اس سے مکمل طور پر آزاد خاندان نہیں ہے۔"
  tr: "Nur Misowari (1939 doğumlu) hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kısa bir makalede, 3 Mart 1939'da Tabul, Sulu'da doğduğu, Moro halkından bir devrimci ve politikacı olduğu, ayrıca Moro Ulusal Kurtuluş Cephesi'nin kurucusu ve lideri olduğu belirtilmektedir."
  id: "Artikel Wikipedia Arab tentang Nur Misowari (lahir 1939); digunakan hanya untuk fakta entitas. Sebuah artikel singkat menyebutkan kelahirannya pada 3 Maret 1939 di Tabul, Sulu, dan bahwa ia adalah seorang revolusioner dan politisi dari masyarakat Moro, serta pendiri dan pemimpin Front Pembebasan Nasional Moro."
