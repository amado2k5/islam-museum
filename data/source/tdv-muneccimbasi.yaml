  ar: "مدخل «منجّم باشي» في موسوعة TDV الإسلامية، وهو مدخل قصير ما زال قيد التحديث، يعرّفه بأنه الموظف المكلّف بالشؤون المتعلقة بالفلك والتنجيم في الدولة العثمانية، ويحيل إلى مواد أخرى منها الموقّتخانة."
  en: "The TDV İslâm Ansiklopedisi entry 'MÜNECCİMBAŞI', a short entry marked as being updated. It defines the office as the official responsible for astronomy and astrology affairs in the Ottoman state, and refers to related entries including the muvakkithane."
