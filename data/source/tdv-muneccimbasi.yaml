summary:
  ar: "مدخل «منجّم باشي» في موسوعة TDV الإسلامية، وهو مدخل قصير ما زال قيد التحديث، يعرّفه بأنه الموظف المكلّف بالشؤون المتعلقة بالفلك والتنجيم في الدولة العثمانية، ويحيل إلى مواد أخرى منها الموقّتخانة."
  en: "The TDV İslâm Ansiklopedisi entry 'MÜNECCİMBAŞI', a short entry marked as being updated. It defines the office as the official responsible for astronomy and astrology affairs in the Ottoman state, and refers to related entries including the muvakkithane."
  es: "La entrada 'MÜNECCİMBAŞI' del TDV İslâm Ansiklopedisi es una entrada breve que se encuentra en proceso de actualización. Define el cargo como el funcionario responsable de los asuntos de astronomía y astrología en el estado otomano, y hace referencia a entradas relacionadas, incluido el muvakkithane."
  fr: "L'entrée « MÜNECCİMBAŞI » de l'encyclopédie islamique TDV (Title Veritas İslâm Ansiklopedisi), une entrée courte signalée comme étant en cours de mise à jour, définit cette fonction comme le fonctionnaire chargé des questions d'astronomie et d'astrologie dans l'État ottoman et renvoie à des entrées connexes, notamment celle de muvakkithane."
  ur: "TDV İslâm Ansiklopedisi اندراج 'MÜNECCİMBAŞI'، ایک مختصر اندراج جس کو اپ ڈیٹ کیا جا رہا ہے۔ یہ دفتر کو عثمانی ریاست میں فلکیات اور علم نجوم کے امور کے ذمہ دار کے طور پر بیان کرتا ہے، اور اس سے متعلقہ اندراجات کا حوالہ دیا جاتا ہے جس میں موواکیتھانے شامل ہیں۔"
  tr: "İslami TDV Ansiklopedisi'ndeki \"Majim Bashi\" maddesi, hâlâ güncellenmekte olan kısa bir giriş, onu Osmanlı İmparatorluğu'nda astronomi ve astroloji işlerinden sorumlu yetkili olarak tanıtır ve Muqtakhana dahil diğer materyallere atıfta bulunur."
  id: "Entri \"Majim Bashi\" dalam Ensiklopedia TDV Islam, sebuah entri singkat yang masih dalam tahap pembaruan, memperkenalkannya sebagai pejabat yang bertanggung jawab atas urusan astronomi dan astrologi di Kekaisaran Ottoman, dan merujuk pada materi lain termasuk Muqtakhana."
title: "MÜNECCİMBAŞI"
