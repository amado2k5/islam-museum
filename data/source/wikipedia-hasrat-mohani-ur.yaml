summary:
  ar: "مقالة ويكيبيديا الأردية عن حسرت موهاني؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته باسم سيد فضل الحسن في موهان في 4 تشرين الأول 1875 ووفاته في لكنو في 13 أيار 1951، وتعليمه في عليكرة وتحريره «أردو معلى» منذ 1903 ونضاله الاستقلالي."
  en: "Urdu Wikipedia article on Hasrat Mohani; used for entity facts only. It gives his birth, as Syed Fazl-ul-Hasan, at Mohan on 4 October 1875 and his death at Lucknow on 13 May 1951, and recounts his Aligarh education, his editorship of Urdu-e-Mualla from 1903 and his independence activism."
  es: "Artículo de Wikipedia en urdu sobre Hasrat Mohani; se utiliza únicamente para obtener información sobre la persona. Indica su nacimiento, como Syed Fazl-ul-Hasan, en Mohan el 4 de octubre de 1875 y su fallecimiento en Lucknow el 13 de mayo de 1951, y relata su educación en Aligarh, su labor como editor de Urdu-e-Mualla desde 1903 y su activismo independentista."
  fr: "Article de Wikipédia en ourdou sur Hasrat Mohani; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance, sous le nom de Syed Fazl-ul-Hasan, à Mohan le 4 octobre 1875 et sa mort à Lucknow le 13 mai 1951, et relate ses études à Aligarh, son poste de rédacteur en chef d’Urdu-e-Mualla à partir de 1903 et son activisme pour l’indépendance."
  ur: "حسرت موہانی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 4 اکتوبر 1875 کو موہن میں سید فضل الحسن کی حیثیت سے ان کی پیدائش اور 13 مئی 1951 کو لکھنؤ میں ان کی موت کا ذکر کرتا ہے، اور ان کی علی گڑھ کی تعلیم، 1903 سے اردو مُلا کی ان کی ادارت اور ان کی آزادی کی سرگرمی کا ذکر کرتا ہے۔"
