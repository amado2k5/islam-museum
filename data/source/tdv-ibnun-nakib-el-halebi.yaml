label: { ar: "ابن النقِيب الحلبي — موسوعة Türkiye Diyanet", en: "Ibnü'n-Nakîb el-Halebî — TDV İslâm Ansiklopedisi", ur: "ابن النقیب حلبی — ٹی ڈی وی اسلام انسائیکلوپیڈیا" }
summary:
  ar: "مقالة في موسوعة Türkiye Diyanet عن «إبنؤ'ن-ناقيب الحلبي» غرس الدين خليل بن شهاب الدين أحمد الحلبي ⁦(ت 971/1563م)⁩، فقيه شافعي من حلب اشتغل بالرياضيات والفلك والطب، وله مؤلفات في الهيئة وفي تنبيه النقاد على ما في الهيئة المشهورة من الفساد مع نقد لأصول بطلمية واستناد إلى ابن الشاطر والعرضي."
  en: "TDV İslâm Ansiklopedisi article on 'İbnü'n-Nakîb el-Halebî', Garsüddin Halîl ibn Shihabüddin Ahmed al-Halabi (d. 971/1563), a Shafi'i scholar of Aleppo who worked in mathematics, astronomy and medicine, author of works on hay'a including Tanbih al-naqqad critiquing Ptolemaic principles via Ibn al-Shatir and al-Urdi."
  ur: "ڈیانیت Türk Ansiklopedisi کا مضمون «İbnü'n-Nakîb el-Halebî» پر — غرس الدین خلیل بن شهاب الدین احمد حلبی ⁦(ت 971/1563ء)⁩، حلب کا شافعی فقیہ جس نے ریاضی، فلکیات اور طب پر کام کیا اور ہیئت کی کتابوں میں «تنبیہ النقاد» لکھی جس میں بطلیموسی اصولوں پر تنقید اور ابن الشاطر و عرضی سے استناد ہے۔"
  es: "Artículo de TDV İslâm Ansiklopedisi sobre 'İbnü'n-Nakîb el-Halebî', Garsüddin Halîl ibn Shihabüddin Ahmed al-Halabi (m. 971/1563), un erudito shafi'í de Alepo que trabajó en matemáticas, astronomía y medicina, autor de trabajos sobre hay'a que incluyen críticas a Tanbih al-naqqad Principios ptolemaicos a través de Ibn al-Shatir y al-Urdi."
  fr: "Article du TDV İslâm Ansiklopedisi sur 'İbnü'n-Nakîb el-Halebî', Garsüddin Halîl ibn Shihabüddin Ahmed al-Halabi (mort en 971/1563), érudit shafi'ite d'Alep qui a travaillé dans les mathématiques, l'astronomie et la médecine, auteur d'ouvrages sur la hay'a, dont la critique de Tanbih al-naqqad Principes ptolémaïques via Ibn al-Shatir et al-Urdi."
