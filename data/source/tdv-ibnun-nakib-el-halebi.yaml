reliability_note: "Actual article text read on 2026-11-15. It documents the subject's name, death 971/1563, Shafi'i affiliation, Aleppo milieu, mathematical/astronomical/medical work and the Tanbih al-naqqad critique of Ptolemaic astronomy citing Ibn al-Haytham, Ibn al-Shatir and al-Urdi. The identification of this Ottoman-era scholar with the Tanbih al-naqqad author named by Heinen (Gars al-Din b. Ahmad b. Khalil al-Halabi, d. 971 AH per Suter) is probable on name and death-year agreement but is NOT independently verified; used only to document the debated identification, never to assert a madhhab for the treatise's author."
