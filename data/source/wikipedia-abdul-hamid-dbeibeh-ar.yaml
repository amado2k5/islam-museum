summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الحميد الدبيبة؛ تُستخدم لوقائع الكيان فقط. تعطي مقدمتها سنة ولادته 1959 واختياره رئيسًا للوزراء في فبراير 2021؛ ويعطي صندوق معلوماتها دينه الإسلام عمومًا، ويذكر فايز السراج بين أسلافه، ويسجّل ادّعاءه ماجستير في الهندسة من كندا. وتصنّفه المقالة في فئتَي مواليد 1958 و1959 معًا، بما يعكس الخلاف على سنة ولادته."
  en: "Arabic Wikipedia article on Abdul Hamid Dbeibeh; used for entity facts only. Its lead gives his birth year as 1959 and his selection as prime minister in February 2021; its infobox gives his religion as Islam in general, names Fayez al-Sarraj among his predecessors, and records his claimed master's degree in engineering from Canada. The article files him under both the 1958 and the 1959 birth categories, reflecting the contested year."
  es: "Artículo de Wikipedia en árabe sobre Abdul Hamid Dbeibeh; utilizado únicamente para datos sobre la persona. En su introducción, indica que nació en 1959 y que fue elegido primer ministro en febrero de 2021. En su ficha informativa, menciona que profesa el islam, nombra a Fayez al-Sarraj entre sus predecesores y registra su supuesta maestría en ingeniería por una universidad canadiense. El artículo lo incluye tanto en la categoría de nacimiento de 1958 como en la de 1959, reflejando así la controversia sobre el año de nacimiento."
  fr: "L'article de Wikipédia en arabe consacré à Abdul Hamid Dbeibeh est utilisé uniquement pour des informations factuelles. Son introduction indique qu'il est né en 1959 et qu'il a été nommé Premier ministre en février 2021. Son infobox précise qu'il est musulman, cite Fayez al-Sarraj parmi ses prédécesseurs et mentionne un master en ingénierie obtenu au Canada. L'article le classe à la fois en 1958 et en 1959, année contestée."
  ur: "عبدالحمید دبیبہ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی برتری ان کا سال پیدائش 1959 بتاتی ہے اور فروری 2021 میں وزیر اعظم کے طور پر ان کا انتخاب؛ اس کا معلوماتی باکس عام طور پر اس کا مذہب اسلام کے طور پر دیتا ہے، فیاض السراج کا نام اپنے پیشروؤں میں رکھتا ہے، اور کینیڈا سے انجینئرنگ میں اس کی دعویٰ کردہ ماسٹر ڈگری ریکارڈ کرتا ہے۔ مضمون میں اسے 1958 اور 1959 دونوں زمروں کے تحت درج کیا گیا ہے، جو مقابلہ شدہ سال کی عکاسی کرتا ہے۔"
  tr: "Abdul Hamid Dbeibeh hakkında Arapça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Girişinde doğum yılı 1959 ve Şubat 2021'de Başbakan olarak seçildiği belirtilmiştir; bilgi kutusunda genel olarak İslam dinini belirtir, ataları arasında Fayez al-Sarraj'ı anar ve Kanada'dan mühendislik alanında yüksek lisans derecesine sahip olduğunu iddia eder. Makale, doğum yılı üzerindeki anlaşmazlığı yansıtarak onu 1958 ve 1959 doğumlular kategorilerine ayırmaktadır."
  id: "Artikel Wikipedia berbahasa Arab tentang Abdul Hamid Dbeibeh hanya digunakan untuk fakta entitas tersebut. Pengenalannya mencantumkan tahun kelahirannya sebagai 1959 dan pemilihannya sebagai Perdana Menteri pada Februari 2021; kotak infonya mencantumkan agamanya sebagai Islam secara umum, menyebut Fayez al-Sarraj sebagai salah satu leluhurnya, dan mencatat klaimnya memiliki gelar magister teknik dari Kanada. Artikel tersebut mengklasifikasikannya baik dalam kategori mereka yang lahir pada tahun 1958 maupun 1959, mencerminkan perbedaan pendapat mengenai tahun kelahirannya."
