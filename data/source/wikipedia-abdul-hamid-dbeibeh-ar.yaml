summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الحميد الدبيبة؛ تُستخدم لوقائع الكيان فقط. تعطي مقدمتها سنة ولادته 1959 واختياره رئيسًا للوزراء في فبراير 2021؛ ويعطي صندوق معلوماتها دينه الإسلام عمومًا، ويذكر فايز السراج بين أسلافه، ويسجّل ادّعاءه ماجستير في الهندسة من كندا. وتصنّفه المقالة في فئتَي مواليد 1958 و1959 معًا، بما يعكس الخلاف على سنة ولادته."
  en: "Arabic Wikipedia article on Abdul Hamid Dbeibeh; used for entity facts only. Its lead gives his birth year as 1959 and his selection as prime minister in February 2021; its infobox gives his religion as Islam in general, names Fayez al-Sarraj among his predecessors, and records his claimed master's degree in engineering from Canada. The article files him under both the 1958 and the 1959 birth categories, reflecting the contested year."
