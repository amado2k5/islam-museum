summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد لطفي السيد؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في برقين سنة 1872 وتحريره «الجريدة» وتأسيسه حزب الأمة ورئاسته دار الكتب والجامعة المصرية ووفاته سنة 1963."
  en: "English Wikipedia article on Ahmed Lutfi al-Sayyid; used for entity facts only. It recounts his birth at Berqin in 1872, his editorship of al-Jarida, his founding of Hizb al-Umma, his direction of the National Library and presidency of the Egyptian University, and his death in 1963."
  es: "Artículo de la Wikipedia en inglés sobre Ahmed Lutfi al-Sayyid; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Berqin en 1872, su labor como editor de al-Jarida, la fundación de Hizb al-Umma, su dirección de la Biblioteca Nacional y su presidencia de la Universidad Egipcia, y su fallecimiento en 1963."
  fr: "Article de Wikipédia en anglais sur Ahmed Lutfi al-Sayyid; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Berqin en 1872, son poste de rédacteur en chef d’al-Jarida, la fondation du Hizb al-Umma, sa direction de la Bibliothèque nationale et sa présidence de l’Université égyptienne, ainsi que sa mort en 1963."
  ur: "احمد لطفی السید پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1872 میں برقین میں ان کی پیدائش، الجریدہ کی ان کی ادارت، حزب الامہ کی ان کی بنیاد، نیشنل لائبریری اور مصری یونیورسٹی کی صدارت، اور 1963 میں ان کی وفات کا ذکر ہے۔"
  tr: "Ahmed Lotfi Al-Sayyid hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 1872'de Burqin'deki doğumunu, 'Al-Jarida' adlı eserin editörlüğünü, Umma Partisi'ni kurmasını, Ulusal Kütüphane ve Mısır Üniversitesi başkanlığını ve 1963'teki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ahmed Lotfi Al-Sayyid hanya digunakan untuk fakta-fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Burqin pada tahun 1872, penyuntingannya atas 'Al-Jarida', pendirian Partai Umma, kepresidenannya di Perpustakaan Nasional dan Universitas Mesir, serta kematiannya pada tahun 1963."
