summary:
  ar: "المجلد الأول (الأحاديث 1–332) من طبعة دار ابن الجوزي لسبل السلام للأمير الصنعاني (ت 1182هـ)، بتحقيق محمد صبحي حسن حلاق وتخريجه وضبط نصه، الإصدار الثالث، الطبعة الثالثة 1433هـ؛ فيه مقدمات الطبعات ومقدمة المحقق المؤرخة بصنعاء 5 شعبان 1410هـ مع ترجمة الصنعاني وابن حجر."
  en: "Volume 1 (hadiths 1–332) of the Dar Ibn al-Jawzi edition of al-Amir al-San'ani's (d. 1182 AH) Subul al-Salam, edited, documented and vocalised by Muhammad Subhi Hasan Hallaq, 3rd issue, 3rd printing 1433 AH; it contains the edition prefaces and the editor's introduction dated San'a, 5 Sha'ban 1410 AH, with lives of al-San'ani and Ibn Hajar."
