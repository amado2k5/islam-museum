summary:
  ar: "«دستور دولة الإمارات العربية المتحدة»، كما يُنشر عند: بوابة التشريعات الإماراتية. العنوان ونص المادة 7 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Constitution of the United Arab Emirates, as published at: UAE Legislation Portal. The address and the wording of Article 7 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Constitution of the United Arab Emirates، جیسا کہ UAE Legislation Portal پر شائع ہے۔ پتہ اور دفعہ 7 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Constitution of the United Arab Emirates, tel que publié à : UAE Legislation Portal. L'adresse et le texte (article 7) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Constitution of the United Arab Emirates, tal como se publica en: UAE Legislation Portal. La dirección y el texto (artículo 7) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Birleşik Arap Emirlikleri Anayasası,\" BAE Yasa Portalı'nda yayımlandığı şekliyle. Madde 7'nin başlığı ve metni, müze tarafından sağlanan bir araştırma özetinden alınmıştır ve müze sayfayı açmamıştır; kurucu, metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Konstitusi Uni Emirat Arab,\" sebagaimana diterbitkan di: Portal Legislasi UEA. Judul dan teks Pasal 7 diambil dari ringkasan penelitian yang disediakan oleh museum, dan museum tidak membuka halaman tersebut; pendiri mengizinkan penggunaan teks tersebut seperti yang dinyatakan pada 21 November 2026."
