reliability_note: 'Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. Two of its dates are not followed: it gives his birth as 28 June 1842 (the Azerbaijani and Russian articles give 1837, with the split disclosed in the record) and prints his death as 15 November 1907, the Old Style form of the 28 November 1907 New Style date. Its Swietochowski quotation (Russia and Azerbaijan, Cambridge University Press, 1985) is one of the two independent Sunni attestations behind the record''s faith value.'
