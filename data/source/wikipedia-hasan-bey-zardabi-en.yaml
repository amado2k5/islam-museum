  ar: مقالة ويكيبيديا الإنجليزية عن حسن بك زردابي؛ تُستخدم لوقائع الكيان فقط. تروي دراسته في جامعة موسكو وتأسيسه «أكينجي» سنة 1875 أول صحيفة باللغة الأذربيجانية وأول عرض مسرحي أذربيجاني سنة 1873 وسنوات تدريسه في باكو، وتنقل عن سفيتوخوفسكي وصف دائرة «أكينجي» بأنهم «في معظمهم سنّة مثل زردابي».
  en: English Wikipedia article on Hasan bey Zardabi; used for entity facts only. It recounts his Moscow University studies, the founding of Akinchi in 1875 as the first Azerbaijani-language newspaper, the first Azerbaijani theatrical production of 1873, his Baku teaching and city-duma years, and quotes Swietochowski describing Akinchi's circle as 'mainly Sunnis like Zardabi'.
