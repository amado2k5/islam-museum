summary:
  ar: مقالة ويكيبيديا الإنجليزية عن حسن بك زردابي؛ تُستخدم لوقائع الكيان فقط. تروي دراسته في جامعة موسكو وتأسيسه «أكينجي» سنة 1875 أول صحيفة باللغة الأذربيجانية وأول عرض مسرحي أذربيجاني سنة 1873 وسنوات تدريسه في باكو، وتنقل عن سفيتوخوفسكي وصف دائرة «أكينجي» بأنهم «في معظمهم سنّة مثل زردابي».
  en: English Wikipedia article on Hasan bey Zardabi; used for entity facts only. It recounts his Moscow University studies, the founding of Akinchi in 1875 as the first Azerbaijani-language newspaper, the first Azerbaijani theatrical production of 1873, his Baku teaching and city-duma years, and quotes Swietochowski describing Akinchi's circle as 'mainly Sunnis like Zardabi'.
  es: "Artículo de la Wikipedia en inglés sobre Hasan bey Zardabi; utilizado únicamente para datos sobre la persona. Relata sus estudios en la Universidad de Moscú, la fundación de Akinchi en 1875 como el primer periódico en lengua azerbaiyana, la primera producción teatral azerbaiyana de 1873, sus años como profesor en Bakú y en la Duma de la ciudad, y cita a Swietochowski describiendo el círculo de Akinchi como «principalmente sunitas como Zardabi»."
  fr: "Article de Wikipédia en anglais sur Hasan bey Zardabi; utilisé uniquement pour les informations factuelles. Il relate ses études à l’Université de Moscou, la fondation d’Akinchi en 1875, premier journal en langue azerbaïdjanaise, la première production théâtrale azerbaïdjanaise de 1873, ses années d’enseignement à Bakou et à la Douma municipale, et cite Swietochowski décrivant le cercle d’Akinchi comme « principalement sunnite, à l’instar de Zardabi »."
  ur: "حسن بی زرداری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی ماسکو یونیورسٹی کی تعلیم کا ذکر کیا گیا ہے، 1875 میں اکینچی کی بنیاد آذربائیجانی زبان کے پہلے اخبار کے طور پر، 1873 کی پہلی آذربائیجانی تھیٹر پروڈکشن، اس کی باکو میں تدریس اور شہر ڈوما کے سال، اور سویٹچووسکی کا حوالہ دیتے ہوئے اکنچی کے دائرے کو 'بنیادی طور پر سنّیوں جیسے زردابی' کے طور پر بیان کیا گیا ہے۔"
