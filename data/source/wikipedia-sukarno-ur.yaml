  ar: "مقالة ويكيبيديا الأردية عن سوکارنو؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده باسم كوسنو سوسروديهاردجو في 6 يونيو 1901 ووفاته في 21 يونيو 1970 ورئاسته إندونيسيا 1945–1967، وصندوق معلوماتها إحالة فارغة تستمد القيم من ويكيداتا، وتصنّفه فئاتها في مسلمي إندونيسيا واشتراكيي الإسلام."
  en: "Urdu Wikipedia article on Sukarno; used for entity facts only. It confirms his birth as Kusno Sosrodihardjo on 6 June 1901, his death on 21 June 1970 and his presidency of Indonesia 1945–1967. Its infobox is an empty transclusion drawing values from Wikidata; its categories file him under Indonesian Muslims and Islamic socialists (filings)."
