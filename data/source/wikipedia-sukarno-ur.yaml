summary:
  ar: "مقالة ويكيبيديا الأردية عن سوکارنو؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده باسم كوسنو سوسروديهاردجو في 6 يونيو 1901 ووفاته في 21 يونيو 1970 ورئاسته إندونيسيا 1945–1967، وصندوق معلوماتها إحالة فارغة تستمد القيم من ويكيداتا، وتصنّفه فئاتها في مسلمي إندونيسيا واشتراكيي الإسلام."
  en: "Urdu Wikipedia article on Sukarno; used for entity facts only. It confirms his birth as Kusno Sosrodihardjo on 6 June 1901, his death on 21 June 1970 and his presidency of Indonesia 1945–1967. Its infobox is an empty transclusion drawing values from Wikidata; its categories file him under Indonesian Muslims and Islamic socialists (filings)."
  es: "Artículo de Wikipedia en urdu sobre Sukarno; se utiliza únicamente para datos sobre la entidad. Confirma su nacimiento como Kusno Sosrodihardjo el 6 de junio de 1901, su fallecimiento el 21 de junio de 1970 y su presidencia de Indonesia entre 1945 y 1967. Su ficha informativa es una transclusión vacía que extrae valores de Wikidata; sus categorías lo clasifican dentro de los musulmanes indonesios y los socialistas islámicos (archivos)."
  fr: "Article de Wikipédia en ourdou sur Sukarno; utilisé uniquement pour les informations sur l'entité. Il confirme sa naissance sous le nom de Kusno Sosrodihardjo le 6 juin 1901, son décès le 21 juin 1970 et sa présidence de l'Indonésie de 1945 à 1967. Son infobox est une transclusion vide reprenant les valeurs de Wikidata; ses catégories le classent dans les catégories « Musulmans indonésiens » et « Socialistes islamiques »."
  ur: "سوکارنو پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 6 جون 1901 کو کسنو سوسروڈی ہارڈو کے طور پر ان کی پیدائش، 21 جون 1970 کو ان کی موت اور انڈونیشیا کی صدارت 1945-1967 کی تصدیق کرتا ہے۔ اس کا انفو باکس Wikidata سے خالی ٹرانسکلوژن ڈرائنگ ویلیوز ہے۔ اس کے زمرے اسے انڈونیشیائی مسلمانوں اور اسلامی سوشلسٹ ⁦(فائلنگ)⁩ کے تحت فائل کرتے ہیں۔"
  tr: "Sukarno hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kosno Sosrudehardjo olarak doğumu 6 Haziran 1901'de, ölümü 21 Haziran 1970'te ve 1945-1967 yılları arasında Endonezya başkanlığı olarak teyit edilmiştir. Bilgi kutusu, Wikidata'dan değer alan ve onu Endonezyalı Müslümanlar ile İslami sosyalistler arasında sınıflandıran boş bir referanstır."
  id: "Artikel Wikipedia Urdu tentang Sukarno; hanya digunakan untuk fakta entitas. Kelahirannya sebagai Kosno Sosrudehardjo dikonfirmasi pada 6 Juni 1901, kematiannya pada 21 Juni 1970, dan masa kepresidenannya di Indonesia dari 1945 hingga 1967. Infobox tersebut adalah referensi kosong yang mengambil nilai dari Wikidata dan mengklasifikasikannya di antara Muslim Indonesia dan sosialis Islam."
