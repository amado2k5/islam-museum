reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia, by the historian of the Faraizi movement. Read in full on 1 November 2026. It states that on his first return in 1818 his preaching failed, that he went back to Makkah, and that his teacher Taher Sombal initiated him into the Qadiriyah Tariqah of Sufism and sent him back to Bengal in 1820, after which the movement spread — a textual attestation of the initiation for the man himself, weighed in the museum's faith note. On law it records that, following the classical doctrines noted in the Hedaya, the Hanafi legal manual, he declared British India dar al-harb and suspended the Friday and Eid congregations."
