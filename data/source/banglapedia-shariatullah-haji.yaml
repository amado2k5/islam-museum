summary:
  ar: "مدخل حاجي شريعة الله في بنغلابيديا، الموسوعة الوطنية لبنغلاديش، بقلم معين الدين أحمد خان؛ تُستخدم لوقائع الكيان فقط. يذكر مولده سنة 1781 في شمائل بفريدبور، وإقامته في مكة من 1799 إلى 1818، وإدخال شيخه طاهر سومبل إياه في الطريقة القادرية، وتأسيسه الحركة الفرائضية، ووفاته سنة 1840."
  en: "Entry 'Shariatullah, Haji' in Banglapedia, the national encyclopedia of Bangladesh, by Muin-ud-Din Ahmad Khan; used for entity facts only. It records his birth in 1781 at Shamail in Faridpur, his stay at Makkah from 1799 to 1818, his teacher Taher Sombal's initiation of him into the Qadiriyah tariqah, his founding of the Faraizi movement, his ruling from the Hedaya that British India was dar al-harb, and his death in 1840."
