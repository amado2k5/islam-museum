reliability_note: "An organisational profile within the Minhaj-ul-Quran network (the same profile text is carried on other MQI sites), read in full on 5 November 2026; a first-party source used for his offices and education as the organisation presents them. It gives: Chairman of the Supreme Council of Minhaj-ul-Quran International (MQI); Dean, Faculty of Law, and Member of the Board of Governors at Minhaj University Lahore; Patron of Nizam-ul-Madaris Pakistan; Head of the College of Shariah and Islamic Sciences (COSIS) and Minhaj College for Women, Lahore; PhD in Islamic and Western Constitutional Law, Arab League University, Cairo (2012); MSc in Management, Sir John Cass Business School, London City University (2005); Bachelor of Laws, Pakistan College of Law, Lahore (2003); Masters in Arabic and Islamic Studies, COSIS, Minhaj University Lahore (1995–2002); more than twenty authored books; and speeches at forums including UNOV, the World Economic Forum and UNESCO House, Paris. It names no school or order for him personally; 'Sufism' appears only among his research areas of expertise."
