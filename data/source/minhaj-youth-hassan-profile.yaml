summary:
  ar: "الملف التعريفي بحسن محي الدين قادري على موقع شباب منهاج القرآن باكستان؛ رئيس المجلس الأعلى لمنهاج القرآن الدولية، وعميد كلية الحقوق بجامعة منهاج لاهور، وصاحب أكثر من عشرين كتابا، ودكتوراه 2012 من جامعة الدول العربية."
  en: "The profile of Hassan Mohi-ud-Din Qadri on the Minhaj Youth Pakistan site: Chairman of the Supreme Council of Minhaj-ul-Quran International, Dean of Law at Minhaj University Lahore, author of more than twenty books, with a 2012 PhD from Arab League University."
  es: "Perfil de Hassan Mohi-ud-Din Qadri en el sitio web de Minhaj Youth Pakistan: Presidente del Consejo Supremo de Minhaj-ul-Quran International, Decano de Derecho en la Universidad Minhaj de Lahore, autor de más de veinte libros, con un doctorado de 2012 de la Universidad de la Liga Árabe."
  fr: "Profil de Hassan Mohi-ud-Din Qadri sur le site Minhaj Youth Pakistan: Président du Conseil suprême de Minhaj-ul-Quran International, doyen de la faculté de droit de l’université Minhaj de Lahore, auteur de plus de vingt livres, titulaire d’un doctorat de l’université de la Ligue arabe (2012)."
  ur: "منہاج یوتھ پاکستان کی سائٹ پر حسن محی الدین قادری کا پروفائل: منہاج القرآن انٹرنیشنل کی سپریم کونسل کے چیئرمین، منہاج یونیورسٹی لاہور کے ڈین آف لاء، بیس سے زائد کتابوں کے مصنف، عرب لیگ یونیورسٹی سے 2012 میں پی ایچ ڈی کی ڈگری حاصل کی۔"
