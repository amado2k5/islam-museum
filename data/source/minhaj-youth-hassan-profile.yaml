  ar: "الملف التعريفي بحسن محي الدين قادري على موقع شباب منهاج القرآن باكستان؛ رئيس المجلس الأعلى لمنهاج القرآن الدولية، وعميد كلية الحقوق بجامعة منهاج لاهور، وصاحب أكثر من عشرين كتابا، ودكتوراه 2012 من جامعة الدول العربية."
