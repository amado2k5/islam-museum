summary:
  ar: "مقالة ويكيبيديا العربية عن إلهان عمر، مراجعة 23 أكتوبر 2026؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها ميلادها في 4 أكتوبر 1982 وديانتها «الإسلام»، بينما يذكر متن قسم النشأة سنة 1981، وهو اختلاف مسجل في سجل الشخص."
  en: "Arabic Wikipedia article on Ilhan Omar, revision of 23 October 2026; used for entity facts only. Its infobox gives her birth as 4 October 1982 and her religion as Islam, while its early-life narrative gives the year 1981 — a discrepancy recorded in her person record."
  es: "Artículo de Wikipedia en árabe sobre Ilhan Omar, revisado el 23 de octubre de 2026; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació el 4 de octubre de 1982 y que su religión es el islam, mientras que la narración de su infancia menciona el año 1981, una discrepancia registrada en su ficha personal."
  fr: "Article de Wikipédia en arabe sur Ilhan Omar, mis à jour le 23 octobre 2026; utilisé uniquement pour les informations relatives à l’entité. Son infobox indique sa date de naissance le 4 octobre 1982 et sa religion l’islam, tandis que son récit de jeunesse mentionne l’année 1981 — une divergence relevée dans sa fiche personnelle."
  ur: "الہان عمر پر عربی ویکیپیڈیا کا مضمون، 23 اکتوبر 2026 کی نظر ثانی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا انفو باکس اس کی پیدائش 4 اکتوبر 1982 اور اس کا مذہب اسلام بتاتا ہے، جب کہ اس کی ابتدائی زندگی کی داستان 1981 بتاتی ہے - اس کے شخصی ریکارڈ میں درج ایک تضاد۔"
