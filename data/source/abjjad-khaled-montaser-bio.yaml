summary:
  ar: "السيرة الرسمية المختصرة لخالد منتصر كما تعيد نشرها أبجد وغودريدز وصفحات الناشرين؛ تنص على رئاسته قسم الأمراض الجلدية والتناسلية بهيئة قناة السويس."
  en: "Khaled Montaser's standard official bio as republished by Abjjad, Goodreads and publisher pages; it states his headship of the dermatology and venereology department at the Suez Canal Authority."
  es: "La biografía oficial estándar de Khaled Montaser, republicada por Abjjad, Goodreads y las páginas de la editorial, indica que fue jefe del departamento de dermatología y venereología de la Autoridad del Canal de Suez."
  fr: "La biographie officielle standard de Khaled Montaser, telle que republiée par Abjjad, Goodreads et les sites de son éditeur, indique qu'il dirige le département de dermatologie et de vénéréologie de l'Autorité du canal de Suez."
  ur: "خالد مونتاسر کا معیاری آفیشل بائیو جیسا کہ ابجد، گڈریڈز اور پبلشر پیجز نے دوبارہ شائع کیا ہے۔ اس میں سوئز کینال اتھارٹی میں ڈرمیٹولوجی اور وینیرولوجی ڈیپارٹمنٹ کی سربراہی بیان کی گئی ہے۔"
  tr: "Abjad, Goodreads ve yayınevi sayfalarında yeniden yayımlanan Khaled Montaser'in resmi kısa biyografisi, Süveyş Kanalı Otoritesi'nde Dermatoloji ve Venereoloji Bölümü'ne başkanlık ettiğini belirtmektedir."
  id: "Biografi resmi Khaled Montaser, yang diterbitkan ulang oleh Abjad, Goodreads, dan halaman penerbit, menyatakan bahwa ia memimpin Departemen Dermatologi dan Venereologi di Otoritas Terusan Suez."
