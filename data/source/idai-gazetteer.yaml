reliability_note: "The scholarly gazetteer of ancient-world places — stable canonical URIs (https://gazetteer.dainst.org/place/<gazId>) with types, coordinates and polygon extents, parent/ancestor hierarchies, ~25-language names including Arabic, per-record identifiers (zenon-systemnr, zenon-thesaurus, GND-ID) and owl:sameAs links to Pleiades, GeoNames and the DAI's own arachne entity store. Licence: the site footer states contents are licensed CC-BY (creativecommons.org/licenses/by/4.0/, verified 9 Nov 2026); the museum's {cite:idai-gazetteer <gazId>} is the attribution. Harvest channel: unauthenticated JSON endpoints — search.json (full-text and fielded queries, facets, bbox), doc/<gazId>.json (full record), suggestions, children, geoSearch — robots policy allows all agents ('User-agent: * / Allow: /'). Citable for place identity, gazetteer type, coordinates, alternate names and hierarchy; gazetteer editorial text is never republished. Tier 2: a shared reference vocabulary for place identity, the gazetteer counterpart of Nomisma for numismatic concepts. Verified live 9 November 2026; decision dec-20261109-228 (supersedes engine false-positive dec-20261109-227)."
