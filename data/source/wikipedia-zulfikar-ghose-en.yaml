reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Used for his birth in Sialkot on 13 March 1935, his father Khwaja Mohammed Ghose, the family's move to Bombay in 1942 and emigration to England after Partition, his Keele University degree of 1959, his marriage to Helena de la Fontaine in 1964, his move to the University of Texas at Austin in 1969, his retirement as professor emeritus in 2007, his United States citizenship of 2004, his bibliography, and his death in Austin on 30 June 2022 as reported by the Dawn and Guardian obituaries the article cites. The article's line that he grew up as a Muslim, sourced to Britannica, is upbringing and is not used as attestation of an adult affiliation, and the article's 'Pakistani Ahmadis' category filing is a category, not attestation, and is not used for faith."
