summary:
  ar: "مدخل موسوعة إيرانيكا «باقر خان سالار ملي» بقلم عباس أمانت؛ يُستخدم لوقائع الكيان. يعطي ميلاده في تبريز في سبعينيات القرن التاسع عشر ابنًا لحاجي رضا وبنّاءً غدا كبير لوطيي حي خيابان وذا «خلفية متشرّعة» ⁦(متشرّع)⁩، ودفاعه عن تبريز عشرة أشهر، واستسلام حديقة أتابك سنة 1910، وقتله في محرم 1335 ⁦(نوفمبر 1916)⁩ قرب قصر شيرين."
  en: "Encyclopaedia Iranica entry 'Baqer Khan Salar-e Melli' by Abbas Amanat; used for entity facts. It gives his birth at Tabriz in the 1870s, son of Haji Reza, a bricklayer who became chief luti of the Khiaban quarter and was himself 'from an orthodox (motasharre') background', his ten-month defence of Tabriz, the Atabak Park surrender of 1910, and his murder in Muharram 1335 (November 1916) near Qasr-e Shirin."
  es: "Entrada de la Enciclopedia Iranica 'Baqer Khan Salar-e Melli' de Abbas Amanat; utilizada para datos sobre la persona. Describe su nacimiento en Tabriz en la década de 1870, hijo de Haji Reza, un albañil que llegó a ser jefe luti del barrio de Khiaban y que provenía de un entorno ortodoxo (motasharre'), su defensa de Tabriz durante diez meses, la rendición del Parque Atabak en 1910 y su asesinato en Muharram de 1335 (noviembre de 1916) cerca de Qasr-e Shirin."
  fr: "L'article « Baqer Khan Salar-e Melli » de l'Encyclopaedia Iranica, rédigé par Abbas Amanat, est utilisé pour les informations relatives à cette personne. Il indique sa naissance à Tabriz dans les années 1870, fils de Haji Reza, un maçon devenu chef luti du quartier de Khiaban et lui-même issu d'une famille orthodoxe (motasharre), sa défense de Tabriz pendant dix mois, la reddition du parc Atabak en 1910 et son assassinat en Muharram 1335 (novembre 1916) près de Qasr-e Shirin."
  ur: "انسائیکلوپیڈیا ایرانیکا اندراج 'باقر خان سالار ملی' از عباس امانت؛ ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 1870 کی دہائی میں تبریز میں ہوئی، حاجی رضا کے بیٹے، جو ایک اینٹوں کی پٹی بنانے والے تھے، جو خیابان کوارٹر کا چیف لوٹی بن گیا تھا اور وہ خود بھی 'ایک آرتھوڈوکس ⁦(متشری')⁩ پس منظر سے تھا، تبریز کا دس ماہ کا دفاع، 1910 کے اتبک پارک کا ہتھیار ڈالنا، اور اس کا قتل ⁦(1910 کے قریب)⁩ قصرِ شیریں"
  tr: "Abbas Amanat'ın İranica Ansiklopedisi \"Baqir Khan Salar Melli\" girişi; varlığın gerçekleri için kullanılmıştır. 1870'lerde Tebriz'de doğması, ona Khiyaban'da büyük bir eşcinsel sokağın \"yasama geçmişi\" olan Hacı Reza'nın oğlu olarak verilmiştir; Tebriz'i on ay savunmuş, 1910'da Atabeg Parkı'nın teslimiyetini ve 1335'te Shirin Sarayı yakınlarındaki Muharrem'de suikasta uğramıştır."
  id: "Entri untuk Ensiklopedia Iranica \"Baqir Khan Salar Melli\" oleh Abbas Amanat; digunakan untuk fakta entitas. Kelahirannya di Tabriz pada tahun 1870-an memberinya putra Haji Reza, pembangun jalan gay besar di Khiyaban dengan \"latar belakang yang disahkan oleh undang-undang,\" pembelaannya atas Tabriz selama sepuluh bulan, penyerahan Taman Atabeg pada tahun 1910, dan pembunuhannya pada Muharram 1335 (November 1916) dekat Istana Shirin."
