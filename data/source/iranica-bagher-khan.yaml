summary:
  ar: "مدخل موسوعة إيرانيكا «باقر خان سالار ملي» بقلم عباس أمانت؛ يُستخدم لوقائع الكيان. يعطي ميلاده في تبريز في سبعينيات القرن التاسع عشر ابنًا لحاجي رضا وبنّاءً غدا كبير لوطيي حي خيابان وذا «خلفية متشرّعة» (متشرّع)، ودفاعه عن تبريز عشرة أشهر، واستسلام حديقة أتابك سنة 1910، وقتله في محرم 1335 (نوفمبر 1916) قرب قصر شيرين."
  en: "Encyclopaedia Iranica entry 'Baqer Khan Salar-e Melli' by Abbas Amanat; used for entity facts. It gives his birth at Tabriz in the 1870s, son of Haji Reza, a bricklayer who became chief luti of the Khiaban quarter and was himself 'from an orthodox (motasharre') background', his ten-month defence of Tabriz, the Atabak Park surrender of 1910, and his murder in Muharram 1335 (November 1916) near Qasr-e Shirin."
title: "BĀQER KHAN SĀLĀR-E MELLĪ"
