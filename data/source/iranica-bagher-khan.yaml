reliability_note: "Scholarly encyclopedia entry by Abbas Amanat, read in full on 26 October 2026. It is the record's scholarly anchor for the birth dating ('born in Tabriz in the 1870s', against the Persian article's 1240 Solar Hijri) and for the death (Muharram 1335/November 1916, near Qasr-e Shirin, sheltered and murdered by Mohammad-Amin Talebani). On faith it says, of Bagher Khan himself: 'Being himself from an orthodox (motašarreʿ) background but with an inclination to the pro-Constitution Shaikhi leader Ṯeqat al-Eslām' — the motasharre' being the shari'a-minded of Tabriz's two Twelver luti currents, the Mutasharri'a and the Sheikhiyya."
