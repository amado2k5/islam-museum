summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كوامي نكروما؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في نكروفول وتعليمه في مدارس الإرسالية الكاثوليكية ومعموديته في الإيمان الكاثوليكي سنة 1925 وتدريسه في معهد أميسانو الكاثوليكي، ودراسته في لنكولن وبنسلفانيا، وقيادته حزب المؤتمر الشعبي إلى استقلال غانا سنة 1957 ورئاسته (1960–1966) والإطاحة به ووفاته في بوخارست في 27 أبريل 1972."
  en: "English Wikipedia article on Kwame Nkrumah; used for entity facts only. It recounts his birth at Nkroful, his schooling in Catholic mission schools, his baptism into the Catholic faith in 1925 and his teaching at the Catholic seminary at Amissano, his studies at Lincoln and the University of Pennsylvania, his leadership of the Convention People's Party to Ghana's independence in 1957, his presidency (1960–1966), his overthrow, and his death in Bucharest on 27 April 1972."
