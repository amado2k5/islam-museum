summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كوامي نكروما؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في نكروفول وتعليمه في مدارس الإرسالية الكاثوليكية ومعموديته في الإيمان الكاثوليكي سنة 1925 وتدريسه في معهد أميسانو الكاثوليكي، ودراسته في لنكولن وبنسلفانيا، وقيادته حزب المؤتمر الشعبي إلى استقلال غانا سنة 1957 ورئاسته (1960–1966) والإطاحة به ووفاته في بوخارست في 27 أبريل 1972."
  en: "English Wikipedia article on Kwame Nkrumah; used for entity facts only. It recounts his birth at Nkroful, his schooling in Catholic mission schools, his baptism into the Catholic faith in 1925 and his teaching at the Catholic seminary at Amissano, his studies at Lincoln and the University of Pennsylvania, his leadership of the Convention People's Party to Ghana's independence in 1957, his presidency (1960–1966), his overthrow, and his death in Bucharest on 27 April 1972."
  es: "Artículo de la Wikipedia en inglés sobre Kwame Nkrumah; utilizado únicamente para datos biográficos. Relata su nacimiento en Nkroful, su educación en escuelas misioneras católicas, su bautismo en la fe católica en 1925 y su enseñanza en el seminario católico de Amissano, sus estudios en Lincoln y la Universidad de Pensilvania, su liderazgo del Partido de la Convención Popular para la independencia de Ghana en 1957, su presidencia (1960-1966), su derrocamiento y su muerte en Bucarest el 27 de abril de 1972."
  fr: "Article de Wikipédia en anglais sur Kwame Nkrumah; utilisé uniquement pour les informations sur l'entité. Il relate sa naissance à Nkroful, sa scolarité dans des écoles de missions catholiques, son baptême dans la foi catholique en 1925 et son enseignement au séminaire catholique d'Amissano, ses études à Lincoln et à l'Université de Pennsylvanie, son rôle de chef du Convention People's Party dans l'accession du Ghana à l'indépendance en 1957, sa présidence (1960-1966), son renversement et sa mort à Bucarest le 27 avril 1972."
  ur: "Kwame Nkrumah پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں نیکروفل میں ان کی پیدائش، کیتھولک مشن اسکولوں میں ان کی تعلیم، 1925 میں کیتھولک عقیدے میں ان کا بپتسمہ اور امیسانو کے کیتھولک سیمنری میں ان کی تدریس، لنکن اور پنسلوانیا یونیورسٹی میں ان کی تعلیم، گھانا کی آزادی کے لیے کنونشن پیپلز پارٹی کی قیادت، ⁦(1916-1916 میں ان کی قیادت)⁩ کا ذکر ہے۔ ان کا تختہ الٹ دیا گیا، اور 27 اپریل 1972 کو بخارسٹ میں ان کی موت ہوئی۔"
  tr: "Kwame Nkrumah hakkında İngilizce Wikipedia makalesi; yalnızca varlık gerçekleri için kullanılmıştır. Necroful'daki yetiştirilme tarihini, Katolik misyon okullarındaki eğitimini, 1925'te Katolik inancıyla vaftizini, Amisanu Katolik Enstitüsü'ndeki öğretmenliğini, Lincoln ve Pennsylvania'daki eğitimlerini, 1957'de Gana'nın bağımsızlığını kazanmak için Halk Kongre Partisi'ne liderliğini, başkanlığını (1960–1966), devrilmesini ve 27 Nisan 1972'de Bükreş'te vefatını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Kwame Nkrumah; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Necroful, pendidikannya di sekolah misi Katolik, pembaptisannya dalam iman Katolik pada tahun 1925, pengajarannya di Amisanu Catholic Institute, studinya di Lincoln dan Pennsylvania, kepemimpinannya di Partai Kongres Populer menuju kemerdekaan Ghana pada tahun 1957, masa jabatannya sebagai presiden (1960–1966), penggulingannya, dan kematiannya di Bucharest pada 27 April 1972."
