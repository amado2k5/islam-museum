summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم العريّض (1908–2002)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بومباي في 8 مارس 1908 لأب من المنامة وأم عراقية، وتعليمه في البحرين وبومباي واليغره، وتدريسه من سنة 1927 وعمله في الجمارك وشركة نفط البحرين حتى 1967، وترجماته الشعرية، ورئاسته المجلس الدستوري، ووفاته في مايو 2002. لا تذكر دينا له."
  en: "English Wikipedia article on Ebrahim Al-Arrayedh (1908–2002); used for entity facts only. It recounts his birth in Bombay on 8 March 1908 to a father from Manama and an Iraqi mother, his schooling in Bahrain, Bombay and Aligarh, his teaching from 1927 and his work in customs and for the Bahrain Petroleum Company until 1967, his poetry translations, his chairmanship of the Constitutional Council, and his death in May 2002. It names no religion for him."
  es: "Artículo de la Wikipedia en inglés sobre Ebrahim Al-Arrayedh (1908-2002); utilizado únicamente para datos biográficos. Relata su nacimiento en Bombay el 8 de marzo de 1908, hijo de un padre de Manama y una madre iraquí; su educación en Baréin, Bombay y Aligarh; su labor docente desde 1927; su trabajo en aduanas y para la Compañía Petrolera de Baréin hasta 1967; sus traducciones de poesía; su presidencia del Consejo Constitucional; y su fallecimiento en mayo de 2002. No se menciona su religión."
  fr: "L'article de Wikipédia en anglais consacré à Ebrahim Al-Arrayedh (1908-2002) est utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Bombay le 8 mars 1908, d'un père originaire de Manama et d'une mère irakienne, sa scolarité à Bahreïn, Bombay et Aligarh, son enseignement à partir de 1927, son travail aux douanes et pour la Bahrain Petroleum Company jusqu'en 1967, ses traductions de poésie, sa présidence du Conseil constitutionnel et son décès en mai 2002. Aucune mention n'est faite de sa religion."
