summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم العريّض (1908–2002)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بومباي في 8 مارس 1908 لأب من المنامة وأم عراقية، وتعليمه في البحرين وبومباي واليغره، وتدريسه من سنة 1927 وعمله في الجمارك وشركة نفط البحرين حتى 1967، وترجماته الشعرية، ورئاسته المجلس الدستوري، ووفاته في مايو 2002. لا تذكر دينا له."
  en: "English Wikipedia article on Ebrahim Al-Arrayedh (1908–2002); used for entity facts only. It recounts his birth in Bombay on 8 March 1908 to a father from Manama and an Iraqi mother, his schooling in Bahrain, Bombay and Aligarh, his teaching from 1927 and his work in customs and for the Bahrain Petroleum Company until 1967, his poetry translations, his chairmanship of the Constitutional Council, and his death in May 2002. It names no religion for him."
