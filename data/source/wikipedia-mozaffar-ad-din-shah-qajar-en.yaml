summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مظفر الدين شاه قاجار؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في طهران في 23 مارس 1853، وولايته للعهد الطويلة وحكمه لأذربيجان، وعهده (1896-1907) وامتياز دارسي النفطي سنة 1901 ومنحه الدستور في ديسمبر 1906، ووفاته بعد ذلك بوقت قصير ودفنه في مرقد الإمام الحسين بكربلاء."
  en: "English Wikipedia article on Mozaffar ad-Din Shah Qajar; used for entity facts only. It gives his birth at Tehran on 23 March 1853, his long crown-princeship and governorship of Azerbaijan, his reign (1896-1907), the D'Arcy oil concession of 1901 and his grant of the constitution in December 1906, and his death shortly afterwards and burial in the Imam Hussein Shrine at Karbala."
  es: "Artículo de la Wikipedia en inglés sobre Mozaffar ad-Din Shah Qajar; utilizado únicamente para datos sobre la persona. Describe su nacimiento en Teherán el 23 de marzo de 1853, su largo reinado como príncipe heredero y gobernador de Azerbaiyán, su reinado (1896-1907), la concesión petrolera de D'Arcy de 1901 y la promulgación de la constitución en diciembre de 1906, así como su muerte poco después y su entierro en el santuario del Imam Hussein en Karbala."
  fr: "Article de Wikipédia en anglais sur Mozaffar ad-Din Shah Qajar; utilisé uniquement pour les informations sur l'entité. Il retrace sa naissance à Téhéran le 23 mars 1853, son long mandat de prince héritier et de gouverneur d'Azerbaïdjan, son règne (1896-1907), la concession pétrolière D'Arcy de 1901 et l'octroi de la constitution en décembre 1906, ainsi que sa mort peu après et son inhumation au sanctuaire de l'imam Hussein à Karbala."
  ur: "مظفرالدین شاہ قاجار پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 23 مارچ 1853 کو تہران میں ان کی پیدائش، اس کی طویل ولی عہد اور آذربائیجان کی گورنری، اس کا دور حکومت (1896-1907)، 1901 کی ڈی آرسی تیل کی رعایت اور دسمبر 1906 میں اسے آئین کی منظوری، اور اس کے فوراً بعد امامبورسلہ اور کربلا میں ان کی موت واقع ہوئی۔"
  tr: "Müzafferdin Şah Kacar hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 23 Mart 1853'te Tahran'da doğduğunu, Azerbaycan'daki uzun hükümdarlığını, 1896-1907 yılları arasındaki hükümdarlığını, 1901'de Darsi'ye petrol imtiyazını ve Aralık 1906'da anayasanın verilmesini anlatır. Kısa süre sonra öldü ve Kerbel'deki İmam Hüseyin'in türbesine defnedildi."
  id: "Artikel Wikipedia bahasa Inggris tentang Muzaffar al-Din Shah Qajar; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Teheran pada 23 Maret 1853, masa pemerintahannya yang panjang dan pemerintahannya atas Azerbaijan, pemerintahannya (1896-1907), konsesi minyak Darsi pada 1901, dan pemberian konstitusi pada Desember 1906. Ia meninggal tak lama kemudian dan dimakamkan di makam Imam Hussein di Karbala."
