  ar: "مقالة ويكيبيديا الإنجليزية عن مظفر الدين شاه قاجار؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في طهران في 23 مارس 1853، وولايته للعهد الطويلة وحكمه لأذربيجان، وعهده (1896-1907) وامتياز دارسي النفطي سنة 1901 ومنحه الدستور في ديسمبر 1906، ووفاته بعد ذلك بوقت قصير ودفنه في مرقد الإمام الحسين بكربلاء."
  en: "English Wikipedia article on Mozaffar ad-Din Shah Qajar; used for entity facts only. It gives his birth at Tehran on 23 March 1853, his long crown-princeship and governorship of Azerbaijan, his reign (1896-1907), the D'Arcy oil concession of 1901 and his grant of the constitution in December 1906, and his death shortly afterwards and burial in the Imam Hussein Shrine at Karbala."
