label: { en: "Khaled Abou El Fadl, 'Corrupting God's Book', chapter 57 of The Search for Beauty in Islam: A Conference of the Books (excerpt on Scholar of the House)" }
summary:
  ar: "فصل «إفساد كتاب الله» لخالد أبو الفضل، أستاذ الشريعة الإسلامية، من كتابه «البحث عن الجمال في الإسلام»، منشور على موقع «سكولار أوف ذا هاوس»، ينتقد فيه ترجمة الهلالي وخان، ولا سيما إضافاتها بين الأقواس في آيات الحجاب والقوامة، ونسبتها إلى الطبري والقرطبي وابن كثير ما لم يقولوه."
  en: "The chapter 'Corrupting God's Book' by the Islamic law professor Khaled Abou El Fadl, from his book The Search for Beauty in Islam, published on the Scholar of the House website, criticising the Hilali–Khan translation, especially its bracketed additions in the verses on veiling and on husbands and wives, and its attribution to al-Tabari, al-Qurtubi and Ibn Kathir of views they do not hold."
  ur: "اسلامی قانون کے پروفیسر خالد ابو الفضل کا باب «کرپٹنگ گاڈز بک»، ان کی کتاب «دی سرچ فار بیوٹی ان اسلام» سے، اسکالر آف دی ہاؤس ویب سائٹ پر، جس میں وہ ہلالی و خان کے ترجمے، خصوصاً پردے اور میاں بیوی سے متعلق آیات میں قوسین کے اضافوں اور طبری، قرطبی اور ابن کثیر کی طرف ان آرا کی نسبت پر تنقید کرتے ہیں جو ان کی نہیں۔"
  es: "El capítulo «Corrompiendo el Libro de Dios», del profesor de derecho islámico Khaled Abou El Fadl, de su libro La búsqueda de la belleza en el Islam, publicado en el sitio web Scholar of the House, critica la traducción de Hilali-Khan, especialmente sus adiciones entre corchetes en los versículos sobre el velo y sobre los maridos y las esposas, y su atribución a al-Tabari, al-Qurtubi e Ibn Kathir de opiniones que ellos no comparten."
  fr: "Le chapitre « Corrompre le Livre de Dieu » du professeur de droit islamique Khaled Abou El Fadl, extrait de son livre La Quête de la Beauté en Islam, publié sur le site web Scholar of the House, critique la traduction Hilali-Khan, en particulier ses ajouts entre parenthèses dans les versets sur le voile et sur les maris et les femmes, et son attribution à al-Tabari, al-Qurtubi et Ibn Kathir de points de vue qu'ils ne partagent pas."
  tr: "İslam hukuku profesörü Halid Ebu el-Fadl'ın \"İslam'da Güzellik Arayışı\" adlı kitabından \"Tanrı'nın Kitabını Bozmak\" başlıklı bölüm, Scholar of the House web sitesinde yayımlanan \"İslam'da Güzellik Arayışı\" adlı kitabında, el-Hilali ve Han'ın biyografisini, özellikle başörtüsü ve vesayet ayetlerine parantez içinde eklemelerini eleştirir ve bunları el-Tabari, el-Kurtubi ve İbn Kathir'e atfeder çünkü onlar bunu belirtmemiştir."
  id: "Bab \"Merusak Kitab Tuhan\" oleh Khalid Abu al-Fadl, seorang profesor hukum Islam, dari bukunya \"The Search for Beauty in Islam,\" yang diterbitkan di situs web Scholar of the House, mengkritik biografi al-Hilali dan Khan, terutama tambahan dalam tanda kurung pada ayat hijab dan perwalian, serta mengaitkannya dengan al-Tabari, al-Qurtubi, dan Ibn Kathir karena mereka tidak mengatakannya."
title: "Chapter 57: Corrupting God's Book (The Search for Beauty in Islam: A Conference of the Books)"
