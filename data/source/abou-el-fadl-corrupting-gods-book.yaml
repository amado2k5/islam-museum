summary:
  ar: "فصل «إفساد كتاب الله» لخالد أبو الفضل، أستاذ الشريعة الإسلامية، من كتابه «البحث عن الجمال في الإسلام»، منشور على موقع «سكولار أوف ذا هاوس»، ينتقد فيه ترجمة الهلالي وخان، ولا سيما إضافاتها بين الأقواس في آيات الحجاب والقوامة، ونسبتها إلى الطبري والقرطبي وابن كثير ما لم يقولوه."
  en: "The chapter 'Corrupting God's Book' by the Islamic law professor Khaled Abou El Fadl, from his book The Search for Beauty in Islam, published on the Scholar of the House website, criticising the Hilali–Khan translation, especially its bracketed additions in the verses on veiling and on husbands and wives, and its attribution to al-Tabari, al-Qurtubi and Ibn Kathir of views they do not hold."
  ur: "اسلامی قانون کے پروفیسر خالد ابو الفضل کا باب «کرپٹنگ گاڈز بک»، ان کی کتاب «دی سرچ فار بیوٹی ان اسلام» سے، اسکالر آف دی ہاؤس ویب سائٹ پر، جس میں وہ ہلالی و خان کے ترجمے، خصوصاً پردے اور میاں بیوی سے متعلق آیات میں قوسین کے اضافوں اور طبری، قرطبی اور ابن کثیر کی طرف ان آرا کی نسبت پر تنقید کرتے ہیں جو ان کی نہیں۔"
title: "Chapter 57: Corrupting God's Book (The Search for Beauty in Islam: A Conference of the Books)"
