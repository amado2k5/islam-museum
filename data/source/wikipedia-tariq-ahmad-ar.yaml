summary:
  ar: "مقالة ويكيبيديا العربية عن طارق محمود أحمد، البارون أحمد من ويمبلدون: رجل أعمال وسياسي بريطاني وُلد في 3 نيسان 1968. تذكر المقالة صراحة أنه «من الطائفة الأحمدية» و«عضو في الجماعة الأحمدية»، وأنه شغل منصب نائب رئيس خدام الأحمدية بين 1999 و2008."
  en: "Arabic Wikipedia article on Tariq Mahmood Ahmad, Baron Ahmad of Wimbledon, the British businessman and politician born on 3 April 1968. It states in its own text that he is of the Ahmadiyya community and a member of the Ahmadiyya Jamaat, and that he served as vice-president of Khuddam-ul Ahmadiyya from 1999 to 2008."
  es: "Artículo en la Wikipedia en árabe sobre Tariq Mahmood Ahmad, Barón Ahmad de Wimbledon, empresario y político británico nacido el 3 de abril de 1968. En su propio texto se afirma que pertenece a la comunidad Ahmadiyya y es miembro de la Jamaat Ahmadiyya, y que fue vicepresidente de Khuddam-ul Ahmadiyya desde 1999 hasta 2008."
  fr: "L'article de Wikipédia en arabe sur Tariq Mahmood Ahmad, baron Ahmad de Wimbledon, homme d'affaires et homme politique britannique né le 3 avril 1968, indique qu'il appartient à la communauté ahmadie et est membre de la Jamaat ahmadie, et qu'il a été vice-président de Khuddam-ul Ahmadiyya de 1999 à 2008."
  ur: "3 اپریل 1968 کو پیدا ہونے والے برطانوی تاجر اور سیاست دان طارق محمود احمد، بیرن احمد آف ومبلڈن پر عربی ویکیپیڈیا کا مضمون۔ اس کے اپنے متن میں کہا گیا ہے کہ وہ احمدیہ کمیونٹی سے ہیں اور احمدیہ جماعت کے رکن ہیں، اور انہوں نے 1990 سے 1998 تک خدام الاحمدیہ کے نائب صدر کے طور پر خدمات انجام دیں۔"
  tr: "Tariq Mahmoud Ahmed, Wimbledon Baronu Ahmed hakkında Arapça Vikipedi makalesi: 3 Nisan 1968 doğumlu İngiliz iş insanı ve politikacı. Makalede açıkça \"Ahmadiyya topluluğundan\" ve \"Ahmadiyya topluluğunun bir üyesi\" olduğu belirtilmektedir ve 1999-2008 yılları arasında Ahmadiyya hizmetkarlarının başkan yardımcısı olarak görev yapmıştır."
  id: "Artikel Wikipedia Arab tentang Tariq Mahmoud Ahmed, Baron Ahmed dari Wimbledon: pengusaha dan politisi Inggris yang lahir pada 3 April 1968. Artikel tersebut secara eksplisit menyatakan bahwa ia \"berasal dari komunitas Ahmadiyya\" dan \"anggota komunitas Ahmadiyya,\" serta menjabat sebagai wakil kepala pelayan Ahmadiyya antara tahun 1999 dan 2008."
