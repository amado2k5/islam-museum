  ar: "نسخة رقمية بصيغة نور بوك لموسوعة فقهية تصدرها وزارة الأوقاف والشئون الإسلامية في الكويت. اسم الملف يقول «الجزء 3 من 45»، أما صفحة العنوان فتقول «الجزء الأول» وتذكر الطبعة الثانية؛ لم يُتحقق من الطبعة أو الجزء. قُرئت هنا المقدمة وأول المداخل فقط."
