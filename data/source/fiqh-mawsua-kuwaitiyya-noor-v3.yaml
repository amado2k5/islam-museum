summary:
  ar: "نسخة رقمية بصيغة نور بوك لموسوعة فقهية تصدرها وزارة الأوقاف والشئون الإسلامية في الكويت. اسم الملف يقول «الجزء 3 من 45»، أما صفحة العنوان فتقول «الجزء الأول» وتذكر الطبعة الثانية؛ لم يُتحقق من الطبعة أو الجزء. قُرئت هنا المقدمة وأول المداخل فقط."
  en: "A Noor-Book digital copy of a fiqh encyclopedia issued by the Ministry of Awqaf and Islamic Affairs in Kuwait. The file name says volume 3 of 45, but the title page reads Part 1; the edition and volume are not verified. Only the introduction and the first entries were read."
  es: "Copia digital Noor-Book de una enciclopedia de fiqh publicada por el Ministerio de Asuntos Islámicos y Awqaf de Kuwait. El nombre del archivo indica volumen 3 de 45, pero la portada dice Parte 1; la edición y el volumen no se han verificado. Solo se leyeron la introducción y las primeras entradas."
  fr: "Copie numérique Noor-Book d'une encyclopédie de fiqh publiée par le ministère des Awqaf et des Affaires islamiques du Koweït. Le nom du fichier indique le volume 3 sur 45, mais la page de titre mentionne la partie 1; l'édition et le volume n'ont pas été vérifiés. Seules l'introduction et les premières entrées ont été lues."
  ur: "کویت میں وزارت اوقاف و اسلامی امور کی طرف سے جاری کردہ فقہ انسائیکلو پیڈیا کی نور کتاب ڈیجیٹل کاپی۔ فائل کا نام 45 کی جلد 3 کہتا ہے، لیکن عنوان کا صفحہ حصہ 1 پڑھتا ہے؛ ایڈیشن اور حجم کی تصدیق نہیں کی گئی ہے۔ صرف تعارف اور پہلے اندراجات پڑھے گئے۔"
  tr: "Kuveyt Awqaf ve İslami İşler Bakanlığı tarafından yayımlanan bir fıkıh ansiklopedisinin Noor Book formatında dijital kopyası. Dosya adı \"45'in 3. Bölümü\" ifadesini verirken, başlık sayfasında ikinci baskıdan bahseden \"Birinci Bölüm\" yazıyor; baskı veya bölüm doğrulanmamıştı. Burada sadece giriş ve girişlerin başı okunmuştur."
  id: "Salinan digital dalam format Buku Noor dari ensiklopedia yurisprudensi yang diterbitkan oleh Kementerian Awqaf dan Urusan Islam di Kuwait. Nama berkas tertulis \"Bagian 3 dari 45,\" sementara halaman judul tertulis \"Bagian Satu\" yang menyebutkan edisi kedua; edisi atau bagian tersebut tidak diverifikasi. Di sini, hanya pengantar dan awal entri yang dibacakan."
