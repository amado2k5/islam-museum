  ar: "مقالة ويكيبيديا الإنجليزية عن آصف علي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في سيوهارا بقضاء بيجنور في 11 أيار 1888 ووفاته في برن في 2 نيسان 1953، وتعليمه في دلهي ولندن، ودفاعه عن بهاغت سينغ وفريق الدفاع عن الجيش الوطني الهندي، وسفارته الأولى للهند في الولايات المتحدة وحاكميته لأوديشا ثم سفارته في سويسرا، وزواجه من أرونا غانغولي سنة 1928."
  en: "English Wikipedia article on Asaf Ali; used for entity facts only. It gives his birth at Seohara in Bijnor district on 11 May 1888 and his death at Bern on 2 April 1953, his education in Delhi and London, his defence of Bhagat Singh and of the INA officers, his posts as India's first ambassador to the United States, Governor of Odisha and ambassador to Switzerland, and his 1928 marriage to Aruna Ganguly."
