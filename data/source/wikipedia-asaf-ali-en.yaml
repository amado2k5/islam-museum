summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن آصف علي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في سيوهارا بقضاء بيجنور في 11 أيار 1888 ووفاته في برن في 2 نيسان 1953، وتعليمه في دلهي ولندن، ودفاعه عن بهاغت سينغ وفريق الدفاع عن الجيش الوطني الهندي، وسفارته الأولى للهند في الولايات المتحدة وحاكميته لأوديشا ثم سفارته في سويسرا، وزواجه من أرونا غانغولي سنة 1928."
  en: "English Wikipedia article on Asaf Ali; used for entity facts only. It gives his birth at Seohara in Bijnor district on 11 May 1888 and his death at Bern on 2 April 1953, his education in Delhi and London, his defence of Bhagat Singh and of the INA officers, his posts as India's first ambassador to the United States, Governor of Odisha and ambassador to Switzerland, and his 1928 marriage to Aruna Ganguly."
  es: "Artículo de la Wikipedia en inglés sobre Asaf Ali; utilizado únicamente para datos biográficos. En él se indica su nacimiento en Seohara, distrito de Bijnor, el 11 de mayo de 1888 y su fallecimiento en Berna el 2 de abril de 1953, su educación en Delhi y Londres, su defensa de Bhagat Singh y de los oficiales del Ejército Nacional Indio (INA), sus cargos como primer embajador de la India en Estados Unidos, gobernador de Odisha y embajador en Suiza, y su matrimonio en 1928 con Aruna Ganguly."
  fr: "Article de Wikipédia en anglais sur Asaf Ali; utilisé uniquement pour les informations factuelles. Il indique sa naissance à Seohara, dans le district de Bijnor, le 11 mai 1888 et sa mort à Berne le 2 avril 1953, ses études à Delhi et à Londres, sa défense de Bhagat Singh et des officiers de l’INA, ses postes de premier ambassadeur de l’Inde aux États-Unis, de gouverneur de l’Odisha et d’ambassadeur en Suisse, ainsi que son mariage en 1928 avec Aruna Ganguly."
  ur: "آصف علی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 11 مئی 1888 کو بجنور ضلع کے سیوہارا میں ان کی پیدائش اور 2 اپریل 1953 کو برن میں ان کی موت، دہلی اور لندن میں ان کی تعلیم، بھگت سنگھ اور آئی این اے افسران کے دفاع، ریاستہائے متحدہ میں ہندوستان کے پہلے سفیر، اوڈیشہ کے گورنر اور سوئٹزرلینڈ میں سفیر کے طور پر ان کے عہدے، اور اروناانگ سے ان کی شادی۔"
  tr: "Asif Ali hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 11 Mayıs 1888'de Bijnorr bölgesindeki Seohara'da doğduğu, 2 Nisan 1953'te Bern'de öldüğü, Delhi ve Londra'daki eğitimi, Bhagat Singh ve Hindistan Ulusal Ordusu savunma ekibini savunması, Amerika Birleşik Devletleri'ndeki ilk Hint büyükelçiliği, Odisha valiliği ve ardından İsviçre'deki büyükelçiliği ile 1928'de Aruna Ganguly ile evlendiği belirtilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Asif Ali hanya digunakan untuk fakta entitas tersebut. Ia disebutkan lahir di Seohara, distrik Bijnorr pada 11 Mei 1888, meninggal di Bern pada 2 April 1953, pendidikannya di Delhi dan London, pembelaannya terhadap Bhagat Singh dan tim pertahanan Tentara Nasional India, kedutaan India pertamanya di Amerika Serikat, masa jabatan gubernur Odisha dan kemudian kedutaannya di Swiss, serta pernikahannya dengan Aruna Ganguly pada tahun 1928."
