reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his birth on 11 May 1888 at Seohara (its infobox says Bijnor, its text Seohara town in Bijnor district) and his death in office at Bern on 2 April 1953, citing The Indian Express of 3 April 1953; the Arabic article and Wikidata give 1 April instead. In its Personal life section it states that Asaf Ali was a Muslim while Aruna was a Hindu, cited to India Today; no school is named for him anywhere in the article, and its categories file him under '20th-century Indian Muslims'."
