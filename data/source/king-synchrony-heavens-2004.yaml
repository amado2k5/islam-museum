summary:
  ar: "المجلد الأول «نداء المؤذن» من دراسات ديفيد كينغ في ضبط الوقت والآلات الفلكية في الحضارة الإسلامية الوسيطة؛ تسجل ببليوغرافيته دراسته للأسطرلاب الكروي المحفوظ بأكسفورد ⁦(Physis 4, 1962)⁩."
  en: "Volume one, 'The Call of the Muezzin', of David A. King's studies in astronomical timekeeping and instrumentation in medieval Islamic civilisation; its bibliography registers his study of the Oxford spherical astrolabe (Physis 4, 1962)."
  ur: "قرون وسطی کی اسلامی تہذیب میں فلکی وقت شناسی اور آلات پر ڈیوڈ کنگ کے مطالعوں کی پہلی جلد «نداء المؤذن»؛ اس کی ببلوگرافی میں آکسفورڈ کے کروی اسطرلاب پر اس کی تحقیق ⁦(Physis 4, 1962)⁩ درج ہے۔"
  es: "El primer volumen, «La llamada del muecín», recoge los estudios de David A. King sobre la medición del tiempo y la instrumentación astronómica en la civilización islámica medieval; su bibliografía recoge su estudio del astrolabio esférico de Oxford (Physis 4, 1962)."
  fr: "Le premier volume, « L'appel du muezzin », des études de David A. King sur la mesure du temps astronomique et l'instrumentation dans la civilisation islamique médiévale; sa bibliographie mentionne son étude de l'astrolabe sphérique d'Oxford (Physis 4, 1962)."
  tr: "İlk cilt \"Müezzin'in Çağrısı\", David King'in ortaçağ İslam uygarlığında zaman kontrolü ve astronomik aletler üzerine yaptığı çalışmalardan biridir; bibliyografyasında Oxford'da korunan küresel astrolab üzerine yaptığı çalışmalar kaydedilmiştir (Physis 4, 1962)."
  id: "Volume pertama, \"The Call of the Muezzin,\" adalah salah satu studi David King tentang kontrol waktu dan instrumen astronomi dalam peradaban Islam abad pertengahan; bibliografinya mencatat studinya tentang astrolabe bola yang disimpan di Oxford (Physis 4, 1962)."
