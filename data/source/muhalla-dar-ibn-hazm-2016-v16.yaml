summary:
  ar: "المجلد السادس عشر من طبعة دار ابن حزم لـ«المحلى»، بإشراف خالد الرباط ومشاركة باحثين، يضم كتب الحدود: الردة والمحاربين والسرقة وحد الخمر، مع تعليقات المحققين وتخريجاتهم وفهرس المسائل."
  en: "Volume 16 of the Dar Ibn Hazm edition of al-Muhalla, supervised by Khalid al-Rabbat with a team of researchers, holding the Books of Hadd Punishments: apostasy, highway robbery, theft and the punishment for wine, with the editors' notes, references and an index of questions."
  ur: "دار ابن حزم کے ایڈیشن «المحلی» کی جلد شانزدہم، خالد الرباط کی نگرانی میں محققین کی شرکت سے، جس میں کتاب الحدود: ارتداد، محاربین، چوری اور شراب کی حد ہیں، محققین کے حواشی، تخریجات اور مسائل کی فہرست کے ساتھ۔"
title: "المحلى بالآثار في شرح المجلى بالاختصار (المجلد السادس عشر)"
