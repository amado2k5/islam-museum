summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد بن راشد آل مكتوم؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في دبي في 15 يوليو 1949، ثالث أبناء راشد بن سعيد، وخلف أخاه مكتوم حاكمًا لدبي ونائبًا لرئيس الدولة ورئيسًا لوزرائها سنة 2006، وأشرف على مشاريع جعلت دبي مدينة عالمية (طيران الإمارات، جزر النخلة، برج خليفة). ويقرأ حقل الدين في صندوق معلوماتها «الإسلام» دون فرع أو مدرسة، ولا يذكر متنها مدرسة له."
  en: "English Wikipedia article on Mohammed bin Rashid Al Maktoum; used for entity facts only. It gives him as born at Dubai on 15 July 1949, the third son of Rashid bin Saeed, succeeding his brother Maktoum as ruler of Dubai, vice president and prime minister in 2006, and as the overseer of the projects that made Dubai a global city (Emirates airline, the Palm Islands, the Burj Khalifa). Its infobox religion field reads 'Islam' with no branch or school, and no text in it names a school for him."
