summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد بن راشد آل مكتوم؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في دبي في 15 يوليو 1949، ثالث أبناء راشد بن سعيد، وخلف أخاه مكتوم حاكمًا لدبي ونائبًا لرئيس الدولة ورئيسًا لوزرائها سنة 2006، وأشرف على مشاريع جعلت دبي مدينة عالمية ⁦(طيران الإمارات، جزر النخلة، برج خليفة)⁩. ويقرأ حقل الدين في صندوق معلوماتها «الإسلام» دون فرع أو مدرسة، ولا يذكر متنها مدرسة له."
  en: "English Wikipedia article on Mohammed bin Rashid Al Maktoum; used for entity facts only. It gives him as born at Dubai on 15 July 1949, the third son of Rashid bin Saeed, succeeding his brother Maktoum as ruler of Dubai, vice president and prime minister in 2006, and as the overseer of the projects that made Dubai a global city (Emirates airline, the Palm Islands, the Burj Khalifa). Its infobox religion field reads 'Islam' with no branch or school, and no text in it names a school for him."
  es: "Artículo de Wikipedia en inglés sobre Mohammed bin Rashid Al Maktoum; utilizado únicamente para datos sobre la persona. Lo describe como nacido en Dubái el 15 de julio de 1949, tercer hijo de Rashid bin Saeed, sucesor de su hermano Maktoum como gobernante de Dubái, vicepresidente y primer ministro en 2006, y supervisor de los proyectos que convirtieron a Dubái en una ciudad global (la aerolínea Emirates, las Islas Palm, el Burj Khalifa). El campo de religión en su ficha informativa indica «Islam», sin mencionar ninguna rama ni escuela, y ningún texto nombra una escuela religiosa para él."
  fr: "Article de Wikipédia en anglais sur Mohammed ben Rachid Al Maktoum; utilisé uniquement pour les informations sur l'entité. Il indique qu'il est né à Dubaï le 15 juillet 1949, troisième fils de Rachid ben Saïd, et qu'il a succédé à son frère Maktoum à la tête de Dubaï, en tant que vice-président et Premier ministre en 2006. Il a également supervisé les projets qui ont fait de Dubaï une métropole mondiale (Emirates Airlines, les îles Palm, le Burj Khalifa). Le champ « Religion » de son infobox indique « Islam », sans mention de branche ou d'école, et aucun texte ne fait référence à une école qui lui serait dédiée."
