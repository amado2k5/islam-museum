  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0625\u0646\u062c\u0644\u064a\u0632\u064a\u0629 \u0639\u0646 \u0639\u0627\u0632\u0641 \u0627\u0644\u0646\u0627\u064a \u0627\u0644\u062a\u0631\u0643\u064a \u0642\u062f\u0633\u064a \u0625\u0631\u063a\u0648\u0646\u0631\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u062f\u064a\u0627\u0631 \u0628\u0643\u0631 \u0641\u064a 4 \u0641\u0628\u0631\u0627\u064a\u0631 1952\u060c \u0648\u062a\u0639\u0644\u0651\u0645\u0647 \u0639\u0644\u0649 \u0623\u0628\u064a\u0647 \u0623\u0648\u0644\u0648\u064a \u0625\u0631\u063a\u0648\u0646\u0631\u060c \u0648\u0628\u062f\u0621 \u0639\u0645\u0644\u0647 \u0641\u064a \u0625\u0630\u0627\u0639\u0629 \u0625\u0633\u0637\u0646\u0628\u0648\u0644 \u0641\u064a 1969\u060c \u0648\u062a\u0623\u0633\u064a\u0633\u0647 \u0645\u0639\u0647\u062f \u0645\u0648\u0644\u0627\u0646\u0627 \u0641\u064a \u0628\u0627\u0631\u064a\u0633\u060c \u0648\u062a\u0633\u0645\u064a\u062a\u0647 \u0641\u0646\u0627\u0646\u064b\u0627 \u0644\u0644\u064a\u0648\u0646\u0633\u0643\u0648 \u0645\u0646 \u0623\u062c\u0644 \u0627\u0644\u0633\u0644\u0627\u0645 \u0641\u064a \u064a\u0648\u0644\u064a\u0648 2016\u060c \u0648\u062a\u0633\u062c\u064a\u0644\u0627\u062a\u0647\u061b \u062a\u0646\u0642\u0635\u0647\u0627 \u0627\u0644\u0627\u0633\u062a\u0634\u0647\u0627\u062f\u0627\u062a \u0627\u0644\u0645\u0636\u0645\u0651\u0646\u0629\u060c \u0648\u0645\u0631\u062c\u0639\u0647\u0627 \u0627\u0644\u0645\u0636\u0645\u0651\u0646 \u0627\u0644\u064a\u0648\u0646\u0633\u0643\u0648."
