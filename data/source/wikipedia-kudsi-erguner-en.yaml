  ar: "مقالة ويكيبيديا الإنجليزية عن عازف الناي التركي قدسي إرغونر؛ لوقائع الكيان فقط: مولده في ديار بكر في 4 فبراير 1952، وتعلّمه على أبيه أولوي إرغونر، وبدء عمله في إذاعة إسطنبول في 1969، وتأسيسه معهد مولانا في باريس، وتسميته فنانًا لليونسكو من أجل السلام في يوليو 2016، وتسجيلاته؛ تنقصها الاستشهادات المضمّنة، ومرجعها المضمّن اليونسكو."
