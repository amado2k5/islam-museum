summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عازف الناي التركي قدسي إرغونر؛ لوقائع الكيان فقط: مولده في ديار بكر في 4 فبراير 1952، وتعلّمه على أبيه أولوي إرغونر، وبدء عمله في إذاعة إسطنبول في 1969، وتأسيسه معهد مولانا في باريس، وتسميته فنانًا لليونسكو من أجل السلام في يوليو 2016، وتسجيلاته؛ تنقصها الاستشهادات المضمّنة، ومرجعها المضمّن اليونسكو."
  en: "English Wikipedia article on the Turkish ney player Kudsi Erguner; entity facts only: birth at Diyarbakır on 4 February 1952, training with his father Ulvi Erguner, the start of his work at Istanbul Radio in 1969, his founding of the Mevlana Institute in Paris, his naming as UNESCO Artist for Peace in July 2016, and his recordings; it lacks inline citations, its one inline reference being UNESCO."
  es: "Artículo de la Wikipedia en inglés sobre el intérprete turco de ney Kudsi Erguner; solo datos sobre la persona: nacimiento en Diyarbakır el 4 de febrero de 1952, formación con su padre Ulvi Erguner, inicio de su trabajo en la Radio de Estambul en 1969, fundación del Instituto Mevlana en París, nombramiento como Artista de la UNESCO para la Paz en julio de 2016 y sus grabaciones; carece de citas en línea, siendo la única referencia en línea la de la UNESCO."
  fr: "Article de Wikipédia en anglais sur le joueur de ney turc Kudsi Erguner; ne contient que des informations sur l’entité: naissance à Diyarbakır le 4 février 1952, formation avec son père Ulvi Erguner, début de sa carrière à la radio d’Istanbul en 1969, fondation de l’Institut Mevlana à Paris, nomination comme artiste de l’UNESCO pour la paix en juillet 2016 et ses enregistrements; il ne contient aucune citation en ligne, sa seule référence étant l’UNESCO."
