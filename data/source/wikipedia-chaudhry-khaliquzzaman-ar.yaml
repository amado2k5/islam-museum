  ar: "مقالة ويكيبيديا العربية الموجزة عن تشودري خليق الزمان (1889–1973)؛ تعطي مولده في تشونار وحاكميته لشرق البنغال من آذار 1953 إلى أيار 1954 وترؤسه الأول للرابطة الإسلامية (باكستان). لا يسمي نصها مذهباً؛ وتصنيفاتها تضعه بين مسلمي باكستان السنة."
  en: "The short Arabic Wikipedia article on Chaudhry Khaliquzzaman (1889–1973); it gives his birth at Chunar, his governorship of East Bengal from March 1953 to May 1954 and his first presidency of the Muslim League (Pakistan). Its text names no school; its categories file him among Pakistani Sunni Muslims."
