summary:
  ar: "تدوينة من سلسلة «ترجمة القرآن في الأسبوع» في مشروع «القرآن العالمي» بجامعة مونستر، كتبها صهيب سعيد في 26 يونيو 2020، عن ترجمة محمد أسد «رسالة القرآن»: نشرها الكاملة سنة 1980، وتصريحه بأنه مدين لمحمد عبده، واعتماده على التفاسير القديمة في حواشيه، وقراءة كثير من المسلمين لها على أنها ذات منحى عقلاني حداثي."
  en: "A post in the 'Qur'an translation of the week' series of the Global Qur'an project at the University of Münster, by Sohaib Saeed, 26 June 2020, on Muhammad Asad's The Message of the Qur'an: its complete publication in 1980, his stated debt to Muhammad Abduh, his use of classical tafsir in the footnotes, and its reading by many Muslims as rationalist and modernist."
  ur: "جامعہ مونسٹر کے منصوبے «گلوبل قرآن» کی سلسلہ وار تحریر «ہفتے کا ترجمۂ قرآن»، از صہیب سعید، 26 جون 2020، محمد اسد کی «دی میسج آف دی قرآن» پر: 1980 میں مکمل اشاعت، محمد عبدہ کا اعتراف، حواشی میں قدیم تفاسیر سے استفادہ، اور بہت سے مسلمانوں کے نزدیک اس کا عقلی و جدید رجحان۔"
