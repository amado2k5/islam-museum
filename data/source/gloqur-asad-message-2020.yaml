label: { en: "GloQur, Qur'an translation of the week #06: The Message of the Qur'an by Muhammad Asad (Sohaib Saeed, 2020)" }
summary:
  ar: "تدوينة من سلسلة «ترجمة القرآن في الأسبوع» في مشروع «القرآن العالمي» بجامعة مونستر، كتبها صهيب سعيد في 26 يونيو 2020، عن ترجمة محمد أسد «رسالة القرآن»: نشرها الكاملة سنة 1980، وتصريحه بأنه مدين لمحمد عبده، واعتماده على التفاسير القديمة في حواشيه، وقراءة كثير من المسلمين لها على أنها ذات منحى عقلاني حداثي."
  en: "A post in the 'Qur'an translation of the week' series of the Global Qur'an project at the University of Münster, by Sohaib Saeed, 26 June 2020, on Muhammad Asad's The Message of the Qur'an: its complete publication in 1980, his stated debt to Muhammad Abduh, his use of classical tafsir in the footnotes, and its reading by many Muslims as rationalist and modernist."
  ur: "جامعہ مونسٹر کے منصوبے «گلوبل قرآن» کی سلسلہ وار تحریر «ہفتے کا ترجمۂ قرآن»، از صہیب سعید، 26 جون 2020، محمد اسد کی «دی میسج آف دی قرآن» پر: 1980 میں مکمل اشاعت، محمد عبدہ کا اعتراف، حواشی میں قدیم تفاسیر سے استفادہ، اور بہت سے مسلمانوں کے نزدیک اس کا عقلی و جدید رجحان۔"
  es: "Artículo de Sohaib Saeed, del 26 de junio de 2020, perteneciente a la serie \"Traducción del Corán de la semana\" del proyecto \"El Corán Global\" de la Universidad de Münster, sobre \"El Mensaje del Corán\" de Muhammad Asad: su publicación completa en 1980, su reconocida deuda con Muhammad Abduh, su uso de la exégesis coránica clásica en las notas a pie de página y su interpretación por muchos musulmanes como racionalista y modernista."
  fr: "Article de Sohaib Saeed, publié le 26 juin 2020 dans la série « Traduction du Coran de la semaine » du projet Global Qur'an de l'Université de Münster, sur l'ouvrage de Muhammad Asad, Le Message du Coran: sa publication intégrale en 1980, sa dette envers Muhammad Abduh, son utilisation du tafsir classique dans les notes de bas de page et la façon dont de nombreux musulmans le perçoivent comme rationaliste et moderniste."
  tr: "Münster Üniversitesi'ndeki \"Küresel Kur'an\" projesindeki \"Haftada Kur'an Çevirisi\" serisinden bir yazı, Sohaib Saeed tarafından 26 Haziran 2020'de yazılan, Muhammed Asad'ın 1980'de tam olarak yayımlanan \"Kur'an'ın Mesajı\" çevirisi, Muhammed Abduh'a borçlu olduğunu ifade etmesi, kenar notlarında eski yorumlara dayanması ve birçok Müslümanın rasyonel ve modern bir yaklaşımla yorumlanması hakkında."
  id: "Sebuah tulisan dari seri \"Terjemahan Al-Qur'an dalam Mingguan\" dalam proyek \"Global Quran\" di Universitas Münster, yang ditulis oleh Sohaib Saeed pada 26 Juni 2020, tentang terjemahan Muhammad Asad atas \"Pesan Al-Qur'an\": yang diterbitkan secara lengkap pada tahun 1980, pernyataannya bahwa ia berutang budi kepada Muhammad Abduh, ketergantungannya pada komentar lama dalam catatan pinggirnya, dan penafsiran banyak Muslim sebagai pendekatan yang rasional dan modern."
