summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ما جان آو؛ تُستخدم لوقائع الكيان فقط. تذكر جنرالًا مسلمًا صينيًا انشقّ إلى أسرة تشينغ سنة 1872 أثناء ثورة الدونغان، وأرسل ابنه ما انليانغ للتفاوض على الاستسلام، ثم ساعد الجنرال تسوو تسونغتانغ في سحق الثوّار، وطرد آخر الرافضين للاستسلام من تلال هتشو سنة 1877؛ وتؤرّخ مولده سنة 1830 ووفاته سنة 1886، ولا تسمّي له مذهبًا ولا طريقة في متنها."
  en: "English Wikipedia article on Ma Zhan'ao; used for entity facts only. It records a Chinese Muslim general who defected to the Qing in 1872 during the Dungan revolt, sent his son Ma Anliang to negotiate the surrender, then assisted General Zuo Zongtang in crushing the rebels and in 1877 expelled those who refused to give up from the hills around Hezhou; it dates his birth to 1830 and his death to 1886, and names no school or order for him in its text."
