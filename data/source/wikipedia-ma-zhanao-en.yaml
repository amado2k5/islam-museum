reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026, fetched through the MediaWiki API by its recorded revision id with the returned id asserted equal. It rests on Lipman, Familiar Strangers (2004), Dillon (1999) and Bales (1937). It names his three sons — Ma Anliang, Ma Guoliang and Ma Suiliang — and makes no statement of his school or order in its text; its categories file him under the Naqshbandi order and Chinese Sufis, which are filings, not attestation. The statement of his own Huasi menhuan membership used in his record is in the English article on his son Ma Anliang, citing Dillon (1999), p. 140."
