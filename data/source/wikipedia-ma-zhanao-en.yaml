summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ما جان آو؛ تُستخدم لوقائع الكيان فقط. تذكر جنرالًا مسلمًا صينيًا انشقّ إلى أسرة تشينغ سنة 1872 أثناء ثورة الدونغان، وأرسل ابنه ما انليانغ للتفاوض على الاستسلام، ثم ساعد الجنرال تسوو تسونغتانغ في سحق الثوّار، وطرد آخر الرافضين للاستسلام من تلال هتشو سنة 1877؛ وتؤرّخ مولده سنة 1830 ووفاته سنة 1886، ولا تسمّي له مذهبًا ولا طريقة في متنها."
  en: "English Wikipedia article on Ma Zhan'ao; used for entity facts only. It records a Chinese Muslim general who defected to the Qing in 1872 during the Dungan revolt, sent his son Ma Anliang to negotiate the surrender, then assisted General Zuo Zongtang in crushing the rebels and in 1877 expelled those who refused to give up from the hills around Hezhou; it dates his birth to 1830 and his death to 1886, and names no school or order for him in its text."
  es: "Artículo de la Wikipedia en inglés sobre Ma Zhan'ao; utilizado únicamente para datos sobre la persona. Describe a un general musulmán chino que desertó al bando Qing en 1872 durante la revuelta de Dungan, envió a su hijo Ma Anliang a negociar la rendición, luego ayudó al general Zuo Zongtang a aplastar a los rebeldes y en 1877 expulsó de las colinas que rodean Hezhou a quienes se negaron a rendirse; fecha su nacimiento en 1830 y su muerte en 1886, y no menciona ninguna escuela u orden religiosa a la que perteneciera."
  fr: "Article de Wikipédia en anglais sur Ma Zhan'ao; utilisé uniquement pour les informations sur l'entité. Il relate l'histoire d'un général musulman chinois qui fit défection au profit des Qing en 1872 lors de la révolte des Dungans, envoya son fils Ma Anliang négocier la reddition, puis aida le général Zuo Zongtang à écraser les rebelles et, en 1877, expulsa des collines autour de Hezhou ceux qui refusaient de se rendre; l'article situe sa naissance en 1830 et sa mort en 1886, et ne mentionne ni école ni ordre religieux."
  ur: "Ma Zhan'ao پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ایک چینی مسلمان جنرل کا ریکارڈ ہے جس نے 1872 میں ڈنگان بغاوت کے دوران کنگ سے منحرف ہو گئے، اپنے بیٹے ما اینلیانگ کو ہتھیار ڈالنے کے لیے بات چیت کے لیے بھیجا، پھر باغیوں کو کچلنے میں جنرل زوو زونگ تانگ کی مدد کی اور 1877 میں ہیزو کے آس پاس کی پہاڑیوں سے ہار ماننے سے انکار کرنے والوں کو نکال باہر کیا۔ اس میں اس کی پیدائش کی تاریخ 1830 اور اس کی موت 1886 ہے، اور اس کے متن میں اس کے لیے کسی اسکول یا آرڈر کا نام نہیں ہے۔"
