  ar: "مقالة ويكيبيديا الإنجليزية عن مريم ميرزاخاني؛ تُستخدم لوقائع الكيان فقط. تروي ولادتها في طهران 1977، وذهبيتي الأولمبياد، ودكتوراه هارفارد 2004، وأستاذيتها في ستانفورد، وكونها أول امرأة وأول إيرانية تنال ميدالية فيلدز (2014)، ووفاتها بسرطان الثدي سنة 2017."
  en: "English Wikipedia article on Maryam Mirzakhani; used for entity facts only. It recounts her birth in Tehran in 1977, her two Olympiad gold medals, her 2004 Harvard doctorate, her Stanford professorship, her becoming the first woman and first Iranian to win the Fields Medal (2014), and her death from breast cancer in 2017."
