summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أبي يعقوب يوسف الناصر المريني؛ تُستخدم لوقائع الكيان فقط. توثّق خلافته لأبيه أبي يوسف يعقوب سنة 1286، وحصاره الطويل لتلمسان، واغتياله في 13 مايو 1307 في معسكر الحصار."
  en: "English Wikipedia article on Abu Yaqub Yusuf an-Nasr, Marinid sultan of Morocco; used for entity facts only. It documents his succession to his father Abu Yusuf Yaqub in 1286, the long siege of Tlemcen, and his assassination on 13 May 1307 in the siege camp."
  es: "Artículo de la Wikipedia en inglés sobre Abu Yaqub Yusuf an-Nasr, sultán de Marruecos; utilizado únicamente para datos sobre la persona. Documenta su sucesión de su padre, Abu Yusuf Yaqub, en 1286, el largo asedio de Tremecén y su asesinato el 13 de mayo de 1307 en el campo de asedio."
  fr: "Article de Wikipédia en anglais sur Abou Yaqub Yusuf an-Nasr, sultan du Maroc; utilisé uniquement à des fins d'information sur l'entité. Il relate sa succession à son père Abou Yusuf Yaqub en 1286, le long siège de Tlemcen et son assassinat le 13 mai 1307 dans le camp de siège."
  ur: "مراکش کے سلطان ابو یعقوب یوسف النصر پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1286 میں ان کے والد ابو یوسف یعقوب کی جانشینی، تلمسن کا طویل محاصرہ، اور 13 مئی 1307 کو محاصرہ کیمپ میں ان کے قتل کی دستاویز کرتا ہے۔"
  tr: "Abu Yaqub Yusuf el-Nasir el-Marini hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1286'da babası Abu Yusuf Yaqub'a devredilmesi, Tlemcen'in uzun kuşatması ve 13 Mayıs 1307'de kuşatma kampında suikastı belgelenmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Abu Yaqub Yusuf al-Nasir al-Marini; digunakan hanya untuk fakta entitas. Suksesi ayahnya Abu Yusuf Yaqub pada tahun 1286, pengepungan panjang Tlemcen, dan pembunuhannya pada 13 Mei 1307 di kamp pengepungan didokumentasikan."
