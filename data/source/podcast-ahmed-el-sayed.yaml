summary:
  ar: "بودكاست أحمد السيد على ساوند كلاود وتطبيقات البودكاست، ويضم تسجيلات محاضراته وسلاسله الصوتية، منها سيرة رسول الله وخير القرون والطريق إلى بيت المقدس ورياض الصالحين وأنوار الأنبياء. مصدر ثانوي حديث لما يرويه ويشرحه في هذه التسجيلات، وليس مصدرًا أوليًا ولا شاهدًا مستقلًا على الوقائع التاريخية؛ فما يرويه عن الماضي يُسجَّل على أنه روايته، وإذا ذكر كتابًا قديمًا أساسًا لحلقته سُجِّل الكتاب بوصفه المصدر الذي ذكرته الحلقة."
  en: "The podcast of Ahmed Elsayed on SoundCloud and the podcast apps, carrying the audio of his lectures and series, among them the biography of the Messenger of God, The Best of Generations, The Road to Jerusalem, Riyad al-Salihin and Lights of the Prophets. A modern secondary source for what he narrates and explains in these recordings; not a primary source and not independent corroboration of historical events. What he tells of the past is recorded as his account, and when an episode names a classical book as its basis, that book is recorded as the source the episode states."
  ur: "ساؤنڈ کلاؤڈ اور پوڈکاسٹ ایپس پر احمد السید کا پوڈکاسٹ، جس میں ان کے لیکچرز اور آڈیو سیریز شامل ہیں، جن میں رسول اللہ کی سیرت، خیر القرون، بیت المقدس کا راستہ، ریاض الصالحین اور انوار الانبیاء ہیں۔ ان ریکارڈنگز میں جو کچھ وہ بیان اور شرح کرتے ہیں اس کے لیے یہ ایک جدید ثانوی ماخذ ہے؛ نہ بنیادی ماخذ ہے اور نہ تاریخی واقعات کی آزاد تصدیق۔ ماضی کے بارے میں ان کا بیان ان کی روایت کے طور پر درج ہوتا ہے، اور جب کوئی قسط کسی قدیم کتاب کو اپنی بنیاد بتائے تو وہ کتاب اس ماخذ کے طور پر درج ہوتی ہے جس کا قسط نے ذکر کیا۔"
  fr: "Le podcast d'Ahmed Elsayed sur SoundCloud et les applications de podcast, qui diffuse l'audio de ses conférences et de ses séries, dont la biographie du Messager de Dieu, Les meilleures générations, La route vers Jérusalem, Riyad al-Salihin et Lumières des prophètes. Source secondaire moderne pour ce qu'il raconte et explique dans ces enregistrements ; ni source primaire ni corroboration indépendante des événements historiques. Ce qu'il dit du passé est consigné comme son récit, et lorsqu'un épisode nomme un livre classique comme base, ce livre est consigné comme la source que l'épisode indique."
  es: "El pódcast de Ahmed Elsayed en SoundCloud y en las aplicaciones de pódcast, con el audio de sus conferencias y series, entre ellas la biografía del Mensajero de Dios, Las mejores generaciones, El camino a Jerusalén, Riyad al-Salihin y Luces de los profetas. Fuente secundaria moderna de lo que narra y explica en estas grabaciones; ni fuente primaria ni corroboración independiente de los hechos históricos. Lo que cuenta del pasado se registra como su relato, y cuando un episodio nombra un libro clásico como base, ese libro se registra como la fuente que el episodio indica."
