summary:
  ar: "مدخل «ابن الهيثم» في موسوعة TDV الإسلامية التركية: مولده في البصرة نحو 354هـ وعمله في الديوان أيام البويهيين، ودعوة الحاكم الفاطمي له إلى مصر في أمر النيل، ووجوده في بغداد سنة 418هـ ووفاته على الأرجح سنة 432هـ، ورسائله في الرد على الطاعنين في النبوة وعلى المعتزلة، وكتابه «المناظر» وما فيه من امتداد الضوء على الاستقامة والظلال والبيت المظلم والانعكاس والانعطاف، وترجمته اللاتينية وأثره في أوروبا وفي كمال الدين الفارسي، وقائمة مؤلفاته."
  en: "The TDV İslâm Ansiklopedisi entry on Ibn al-Haytham: his birth at Basra c. 354 AH and his post in a diwan under the Buyids; the Fatimid al-Hakim's invitation to Egypt over the Nile; his presence in Baghdad in 418 AH and probable death in 432 AH; his treatises against critics of prophethood and against the Mu'tazila; his Kitab al-Manazir, with rectilinear light, shadows, the dark room, reflection and refraction; its Latin translation and influence in Europe and on Kamal al-Din al-Farisi; and a list of his works."
  ur: "ٹی ڈی وی اسلامی انسائیکلوپیڈیا کا مدخل «ابن الہیثم»: تقریباً 354ھ میں بصرہ میں ان کی پیدائش اور بویہیوں کے زمانے میں دیوان میں ملازمت؛ دریائے نیل کے معاملے میں فاطمی حاکم کی طرف سے مصر کی دعوت؛ 418ھ میں بغداد میں ان کی موجودگی اور غالباً 432ھ میں وفات؛ نبوت پر اعتراض کرنے والوں اور معتزلہ کے رد میں ان کے رسالے؛ ان کی «کتاب المناظر» جس میں روشنی کا سیدھی لکیر میں پھیلنا، سائے، تاریک کمرہ، انعکاس اور انعطاف ہیں؛ اس کا لاطینی ترجمہ اور یورپ اور کمال الدین فارسی پر اس کا اثر؛ اور ان کی تصانیف کی فہرست۔"
