label:
  ar: "الاستيعاب في معرفة الأصحاب، ومعه الإنباه على قبائل الرواة لابن عبد البر، والاستدراك على الاستيعاب لابن فتحون، وحواشي الاستيعاب لسبط ابن العجمي — تحقيق د. عبد الله بن عبد المحسن التركي بالتعاون مع مركز هجر، ط1 1440هـ/2019م، الجزء الأول"
  en: "al-Isti'ab fi Ma'rifat al-Ashab, with Ibn 'Abd al-Barr's al-Inbah 'ala Qaba'il al-Ruwat, Ibn Fathun's al-Istidrak 'ala al-Isti'ab and Sibt Ibn al-'Ajami's glosses — ed. 'Abd Allah ibn 'Abd al-Muhsin al-Turki with the Hajr Centre, 1st ed. 1440/2019, vol. 1"
summary:
  ar: "الجزء الأول من الطبعة المحققة التي حققها عبد الله بن عبد المحسن التركي بالتعاون مع مركز هجر للبحوث والدراسات العربية والإسلامية، وضمّت إلى الاستيعاب كتاب «الإنباه على قبائل الرواة» للمؤلف، و«الاستدراك على الاستيعاب» لابن فتحون، و«حواشي الاستيعاب» لسبط ابن العجمي؛ يبدأ بمقدمة التحقيق."
  en: "Volume 1 of the critical edition by 'Abd Allah ibn 'Abd al-Muhsin al-Turki with the Hajr Centre for Arabic and Islamic Research and Studies, which adds to al-Isti'ab the author's al-Inbah 'ala Qaba'il al-Ruwat, Ibn Fathun's al-Istidrak 'ala al-Isti'ab and Sibt Ibn al-'Ajami's glosses; it opens with the editor's introduction."
