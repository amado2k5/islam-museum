  ar: "الصفحة «Marah al-Arwah» — Shamela.org؛ لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: توافر كتاب «Marah al-Arwah» في المكتبة الشاملة، وهذا الرابط إحالة ببليوغرافية."
  en: "The page «Marah al-Arwah» — Shamela.org; summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the availability of «Marah al-Arwah» in the Shamela library; the link is a bibliographic pointer."
  ur: "صفحہ «Marah al-Arwah» — Shamela.org؛ اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: شاملہ میں کتاب «Marah al-Arwah» کی دستیابی؛ یہ ربط صرف کتابیاتی اشارہ ہے۔"
  fr: "La page «Marah al-Arwah» — Shamela.org ; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : la présence de « Marah al-Arwah » dans la bibliothèque Shamela ; le lien est un simple renvoi bibliographique."
  es: "La página «Marah al-Arwah» — Shamela.org; resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: la presencia de «Marah al-Arwah» en la biblioteca Shamela; el enlace es solo una referencia bibliográfica."
