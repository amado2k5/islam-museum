summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إم. سي. تشاغلا (1900–1981)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بومباي لأسرة خوجة إسماعيلية غوجراتية، ورئاسته قضاة محكمة بومباي العالية 1947–1958، وسفارتيه ووزارتيه، وسيرته «ورود في ديسمبر»، ووفاته سنة 1981 وحرق جثمانه بوصيته."
  en: "English Wikipedia article on M. C. Chagla (1900–1981); used for entity facts only. It recounts his Bombay birth into a Gujarati Ismaili Khoja family, his chief justiceship of the Bombay High Court (1947–1958), his ambassadorships and ministries, his autobiography Roses in December, and his 1981 death and cremation by his own wish."
  es: "Artículo de la Wikipedia en inglés sobre MC Chagla (1900-1981); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Bombay en el seno de una familia Khoja ismaelita gujarati, su presidencia del Tribunal Superior de Bombay (1947-1958), sus embajadas y ministerios, su autobiografía Rosas en diciembre y su fallecimiento e incineración en 1981 por voluntad propia."
  fr: "Article de Wikipédia en anglais sur MC Chagla (1900-1981); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Bombay au sein d’une famille gujarati ismaélienne khoja, son poste de juge en chef de la Haute Cour de Bombay (1947-1958), ses ambassades et ministères, son autobiographie Roses in December, et sa mort en 1981 et sa crémation selon son souhait."
  ur: "ایم سی چھاگلا (1900–1981) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی بمبئی کی پیدائش گجراتی اسماعیلی کھوجا خاندان میں، بمبئی ہائی کورٹ کی ان کی چیف جسٹس شپ (1947-1958)، ان کی سفیروں اور وزارتوں، دسمبر میں ان کی سوانح عمری روزز، اور ان کی 1981 کی موت اور ان کی اپنی مرضی سے آخری رسومات کا ذکر ہے۔"
