  ar: "مقالة ويكيبيديا الإنجليزية عن برنارد هوبكينز؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 15 يناير 1965 في فيلادلفيا، وسجنه وإطلاق سراحه سنة 1988، وألقابه العالمية في الوزن المتوسط وخفيف الثقيل، وسجله (55 فوزاً، 32 بالضربة القاضية، و8 هزائم وتعادلان) بين 1988 و2016، وتذكر أنه اعتنق الإسلام بعد خروجه من السجن."
  en: "English Wikipedia article on Bernard Hopkins; used for entity facts only. It gives his birth on 15 January 1965 in Philadelphia, his imprisonment and release in 1988, his middleweight and light-heavyweight world titles, his record of 55 wins (32 by knockout), 8 losses and 2 draws between 1988 and 2016, and states that after his release from prison he converted to Islam."
