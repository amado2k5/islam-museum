summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن برنارد هوبكينز؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 15 يناير 1965 في فيلادلفيا، وسجنه وإطلاق سراحه سنة 1988، وألقابه العالمية في الوزن المتوسط وخفيف الثقيل، وسجله ⁦(55 فوزاً، 32 بالضربة القاضية، و8 هزائم وتعادلان)⁩ بين 1988 و2016، وتذكر أنه اعتنق الإسلام بعد خروجه من السجن."
  en: "English Wikipedia article on Bernard Hopkins; used for entity facts only. It gives his birth on 15 January 1965 in Philadelphia, his imprisonment and release in 1988, his middleweight and light-heavyweight world titles, his record of 55 wins (32 by knockout), 8 losses and 2 draws between 1988 and 2016, and states that after his release from prison he converted to Islam."
  es: "Artículo de la Wikipedia en inglés sobre Bernard Hopkins; utilizado únicamente para datos sobre la persona. Indica que nació el 15 de enero de 1965 en Filadelfia, fue encarcelado y liberado en 1988, obtuvo sus títulos mundiales de peso mediano y semipesado, registró 55 victorias (32 por nocaut), 8 derrotas y 2 empates entre 1988 y 2016, y afirma que, tras su liberación, se convirtió al Islam."
  fr: "Article de Wikipédia en anglais sur Bernard Hopkins; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 15 janvier 1965 à Philadelphie, son emprisonnement et sa libération en 1988, ses titres de champion du monde des poids moyens et mi-lourds, son palmarès de 55 victoires (dont 32 par KO), 8 défaites et 2 matchs nuls entre 1988 et 2016, et précise qu’après sa libération, il s’est converti à l’islam."
  ur: "برنارڈ ہاپکنز پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 15 جنوری 1965 کو فلاڈیلفیا میں اس کی پیدائش، 1988 میں اس کی قید اور رہائی، اس کے مڈل ویٹ اور ہلکے ہیوی ویٹ ورلڈ ٹائٹلز، اس کا 55 جیت کا ریکارڈ ⁦(32 ناک آؤٹ)⁩، 1988 اور 2016 کے درمیان 8 ہار اور 2 ڈرا، اور بیان کیا گیا کہ اس نے جیل سے رہائی کے بعد اسلام قبول کیا۔"
  tr: "Bernard Hopkins hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 15 Ocak 1965'te Philadelphia'da doğdu, hapsedildi ve 1988'de serbest bırakıldı, orta siklet ve hafif ağır sıklet kategorilerinde dünya şampiyonluklarını kazandı; 1988 ile 2016 arasında (55 galibiyet, 32'si nakavt, 8 mağlubiyet ve 2 beraberlik) kaydetti ve hapisten çıktıktan sonra İslam'a geçtiği belirtilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Bernard Hopkins; digunakan hanya untuk fakta entitas. Ia lahir pada 15 Januari 1965 di Philadelphia, dipenjara dan dibebaskan pada tahun 1988, dan memenangkan gelar dunia di kategori kelas menengah dan kelas berat ringan, mencatat (55 kemenangan, 32 dengan knockout, 8 kekalahan dan 2 seri) antara tahun 1988 dan 2016, dan dicatat bahwa ia memeluk Islam setelah dibebaskan dari penjara."
