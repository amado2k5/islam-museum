summary:
  ar: "ترجمة الحوفي في سير أعلام النبلاء للذهبي ⁦(ج 17، ص 521-522)⁩ على إسلام ويب، وهي بحسب الملخص البحثي تذكر اسمه الكامل ووفاته سنة 430هـ. ذُكرت هذه الصفحة في ملخص بحثي قُدّم إلى المتحف وأجاز المؤسس استعماله في 21 نوفمبر 2026؛ ولم يفتح المتحف الصفحة نفسها."
  en: "The entry on al-Hawfi in al-Dhahabi's Siyar A'lam al-Nubala' (vol. 17, pp. 521-522) on Islamweb, which, according to the research summary, gives his full name and his death in 430 AH. The page was named in a research summary supplied to the museum and approved for use by the founder on 21 November 2026; the museum did not open it."
  ur: "اسلام ویب پر ذہبی کی سیر اعلام النبلاء ⁦(ج 17، ص 521-522)⁩ میں الحوفی کا ترجمہ، جو تحقیقی خلاصے کے مطابق ان کا پورا نام اور 430ھ میں وفات بتاتا ہے۔ اس صفحے کا ذکر عجائب گھر کو دیے گئے ایک تحقیقی خلاصے میں تھا جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی؛ عجائب گھر نے یہ صفحہ خود نہیں کھولا۔"
  fr: "La notice sur al-Hawfi dans les Siyar A'lam al-Nubala' d'al-Dhahabi (vol. 17, pp. 521-522) sur Islamweb, qui, selon le résumé de recherche, donne son nom complet et sa mort en 430 H. La page est nommée dans un résumé de recherche remis au musée et approuvé pour usage par le fondateur le 21 novembre 2026 ; le musée ne l'a pas ouverte."
  es: "La entrada sobre al-Hawfi en los Siyar A'lam al-Nubala' de al-Dhahabi (vol. 17, pp. 521-522) en Islamweb, que según el resumen de investigación da su nombre completo y su muerte en 430 H. La página figura en un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026; el museo no la abrió."
