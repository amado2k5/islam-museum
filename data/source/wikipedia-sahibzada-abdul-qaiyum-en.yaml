reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 by its recorded revision id via the MediaWiki API, the returned id asserted equal before any claim was drawn. The article carries no religion field and names no school for him; it attests a religious family, a paternal line traced to the Lodi dynasty and a maternal line to Husayn ibn Ali — lineage and background, not affiliation. Its infobox and lead give his death on 4 December 1937, and Radio Pakistan marks the anniversary on 4 December; its own death narrative is internally garbled, and Wikidata gives 3 December (a value imported from an older revision of this same article), so the death is carried as debated in the person record."
