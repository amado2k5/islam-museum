summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صاحبزاده عبد القيوم (1863–1937)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في طوبي في 12 ديسمبر 1863 في أسرة دينية معروفة، ومسيرته موظفا في الإدارة البريطانية ثم سياسيا، ودوره في مفاوضات خط دوراند سنة 1893، وتأسيسه الكلية الإسلامية في بيشاور، وتولّيه أول رئاسة وزراء لإقليم الحدود الشمالية الغربية سنة 1937، ووفاته في 4 ديسمبر 1937."
  en: "English Wikipedia article on Sahibzada Abdul Qayyum (1863–1937); used for entity facts only. It recounts his birth at Topi on 12 December 1863 into a well-known religious family, his career as a British Indian administrator and then politician, his part in the Durand Line negotiations of 1893, his founding of Islamia College, Peshawar, his term as the first Chief Minister of the North-West Frontier Province in 1937, and his death on 4 December 1937."
  es: "Artículo de la Wikipedia en inglés sobre Sahibzada Abdul Qayyum (1863-1937); utilizado únicamente para datos biográficos. Relata su nacimiento en Topi el 12 de diciembre de 1863 en el seno de una conocida familia religiosa, su trayectoria como administrador y luego político británico de la India, su participación en las negociaciones de la Línea Durand de 1893, la fundación del Islamia College en Peshawar, su mandato como primer Ministro Principal de la Provincia de la Frontera Noroeste en 1937 y su fallecimiento el 4 de diciembre de 1937."
  fr: "Article de Wikipédia en anglais sur Sahibzada Abdul Qayyum (1863-1937); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Topi le 12 décembre 1863 au sein d’une famille religieuse renommée, sa carrière d’administrateur britannique des Indes puis d’homme politique, son rôle dans les négociations de la ligne Durand en 1893, la fondation de l’Islamia College de Peshawar, son mandat de premier ministre de la province de la Frontière-du-Nord-Ouest en 1937 et sa mort le 4 décembre 1937."
