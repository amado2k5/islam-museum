summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صاحبزاده عبد القيوم (1863–1937)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في طوبي في 12 ديسمبر 1863 في أسرة دينية معروفة، ومسيرته موظفا في الإدارة البريطانية ثم سياسيا، ودوره في مفاوضات خط دوراند سنة 1893، وتأسيسه الكلية الإسلامية في بيشاور، وتولّيه أول رئاسة وزراء لإقليم الحدود الشمالية الغربية سنة 1937، ووفاته في 4 ديسمبر 1937."
  en: "English Wikipedia article on Sahibzada Abdul Qayyum (1863–1937); used for entity facts only. It recounts his birth at Topi on 12 December 1863 into a well-known religious family, his career as a British Indian administrator and then politician, his part in the Durand Line negotiations of 1893, his founding of Islamia College, Peshawar, his term as the first Chief Minister of the North-West Frontier Province in 1937, and his death on 4 December 1937."
