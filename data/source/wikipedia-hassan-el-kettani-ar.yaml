summary:
  ar: "مقالة ويكيبيديا العربية «الحسن الكتاني»؛ تُستخدم لوقائع الكيان فقط. تثبت ميلاده في سلا في 7 رجب 1392 (16 أغسطس 1972)، وتنقّله في صباه بين بوسطن والظهران والحجاز، ودراسته في جامعة آل البيت ودكتوراه في أصول الفقه، واعتقاله في 18 فبراير 2003 والإفراج عنه بعفو ملكي سنة 2012، وقائمة طويلة من مصنفاته وشرحه."
  en: "Arabic Wikipedia article 'Al-Hasan al-Kettani'; used for entity facts only. It gives his birth at Salé on 7 Rajab 1392 (16 August 1972), his childhood moves between Boston, Dhahran and the Hijaz, his studies at Al al-Bayt University and his doctorate in usul al-fiqh, his arrest on 18 February 2003 and release by royal pardon in 2012, and a long list of his works and recorded commentaries."
