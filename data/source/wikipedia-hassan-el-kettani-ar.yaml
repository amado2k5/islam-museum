reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026; the article was fetched by revision id through the MediaWiki API and the returned revid asserted equal to 76676151 before any claim was drawn. The title «حسن الكتاني» is a redirect to this article. Its infobox leaves the religion field empty, and its text names no madhhab or creed for him; its categories file him among Moroccan Salafis and Sunni scholars, which are category filings, not text attestations. It gives his full nasab as al-Hasan ibn Ali ibn al-Muntasir al-Kettani, his marriage in 1421 AH, his teaching and Friday preaching at the Makka mosque in Salé and the al-Diya mosque in Rabat, and his suspension from preaching after he signed a fatwa of Moroccan scholars."
