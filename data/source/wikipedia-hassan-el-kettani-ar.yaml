summary:
  ar: "مقالة ويكيبيديا العربية «الحسن الكتاني»؛ تُستخدم لوقائع الكيان فقط. تثبت ميلاده في سلا في 7 رجب 1392 ⁦(16 أغسطس 1972)⁩، وتنقّله في صباه بين بوسطن والظهران والحجاز، ودراسته في جامعة آل البيت ودكتوراه في أصول الفقه، واعتقاله في 18 فبراير 2003 والإفراج عنه بعفو ملكي سنة 2012، وقائمة طويلة من مصنفاته وشرحه."
  en: "Arabic Wikipedia article 'Al-Hasan al-Kettani'; used for entity facts only. It gives his birth at Salé on 7 Rajab 1392 (16 August 1972), his childhood moves between Boston, Dhahran and the Hijaz, his studies at Al al-Bayt University and his doctorate in usul al-fiqh, his arrest on 18 February 2003 and release by royal pardon in 2012, and a long list of his works and recorded commentaries."
  es: "Artículo en árabe de la Wikipedia «Al-Hasan al-Kettani»; utilizado únicamente para datos sobre la persona. En él se detalla su nacimiento en Salé el 7 de Rajab de 1392 (16 de agosto de 1972), sus mudanzas durante la infancia entre Boston, Dhahran y el Hiyaz, sus estudios en la Universidad Al al-Bayt y su doctorado en usul al-fiqh, su arresto el 18 de febrero de 2003 y su liberación por indulto real en 2012, así como una larga lista de sus obras y comentarios grabados."
  fr: "L'article de Wikipédia en arabe intitulé « Al-Hasan al-Kettani » (utilisé uniquement pour les informations sur l'entité) mentionne sa naissance à Salé le 7 Rajab 1392 (16 août 1972), son enfance passée entre Boston, Dhahran et le Hedjaz, ses études à l'université Al al-Bayt et son doctorat en usul al-fiqh, son arrestation le 18 février 2003 et sa libération par grâce royale en 2012, ainsi qu'une longue liste de ses œuvres et commentaires enregistrés."
  ur: "عربی ویکیپیڈیا مضمون 'الحسن الکیطانی'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 7 رجب 1392 ⁦(16 اگست 1972)⁩ کو سالے میں ان کی پیدائش ہوئی، اس کا بچپن بوسٹن، ظہران اور حجاز کے درمیان گزرا، البیت یونیورسٹی میں اس کی تعلیم اور اصول الفقہ میں ڈاکٹریٹ، 18 فروری 2003 کو ان کی گرفتاری اور 2012 میں شاہی معافی کے ذریعے رہائی، اور اس کے طویل تبصروں کی فہرست اور ریکارڈ شدہ کام۔"
  tr: "Arapça Vikipedi makalesi \"Al-Hassan Al-Kettani\"; yalnızca varlığın gerçekleri için kullanılmıştır. Sale'deki doğumu 7 Rajab 1392'de (16 Ağustos 1972) doğrulanmıştır, gençliğinde Boston, Dhahran ve Hicaz arasında hareket etti, Al al-Bayt Üniversitesi'nde eğitim gördü, hukuk prensipleri alanında doktora yaptı, 18 Şubat 2003'te tutuklandı ve 2012'de kraliyet affı ile serbest bırakıldı; ayrıca eserleri ve yorumlarının uzun listesini de ekledi."
  id: "Artikel Wikipedia Arab \"Al-Hassan Al-Kettani\"; hanya digunakan untuk fakta entitas. Kelahirannya di Salé dikonfirmasi pada 7 Rajab 1392 (16 Agustus 1972), ia pindah di masa mudanya antara Boston, Dhahran, dan Hejaz, belajar di Universitas Al al-Bayt, meraih gelar PhD dalam prinsip hukum, ditangkap pada 18 Februari 2003, dan dibebaskan dengan pengampunan kerajaan pada 2012, bersama dengan daftar panjang karya dan komentarnya."
