summary:
  ar: "صحيح ابن خزيمة، لأبي بكر محمد بن إسحاق بن خزيمة النيسابوري ⁦(ت 311هـ)⁩، المسمى «المختصر من المختصر من المسند الصحيح عن النبي»؛ الممسوح المحلي ⁦(ملف 61667)⁩ ذو الترقيم المطبوع، ويُستشهد بأرقام الصفحات الممسوحة."
  en: "Sahih Ibn Khuzayma by Abu Bakr Muhammad ibn Ishaq ibn Khuzayma al-Naysaburi (d. 311 AH), titled al-Mukhtasar min al-Mukhtasar min al-Musnad al-Sahih; the local scan (file 61667) is cited by scan page."
  es: "Sahih Ibn Khuzayma de Abu Bakr Muhammad ibn Ishaq ibn Khuzayma al-Naysaburi (m. 311 d. H.), titulado al-Mukhtasar min al-Mukhtasar min al-Musnad al-Sahih; el escaneo local (archivo 61667) se cita por página de escaneo."
  fr: "Sahih Ibn Khuzayma par Abu Bakr Muhammad ibn Ishaq ibn Khuzayma al-Naysaburi (mort en 311 AH), intitulé al-Mukhtasar min al-Mukhtasar min al-Musnad al-Sahih; le scan local (fichier 61667) est cité par page de scan."
  ur: "صحیح ابن خزیمہ از ابوبکر محمد بن اسحاق ابن خزیمہ النیسابوری ⁦(متوفی 311ھ)⁩، المختصر من المختصر من المسند الصحیح کے عنوان سے۔ مقامی اسکین ⁦(فائل 61667)⁩ اسکین صفحہ کے ذریعہ حوالہ دیا گیا ہے۔"
  tr: "Sahih İbn Houzaymah, Abu Bekir Muhammed ibn İshaq ibn Khuzaymah al-Nisaburi (ö. 311 H) tarafından, 'Al-Mukhtasar min al-Mukhtasar min al-Musnad al-Sahih 'an al-Nabi' başlıklı; yerel olarak taranmış (dosya 61667), basılı numaralandırmayla, taranan sayfaların numaralarını belirtmektedir."
  id: "Sahih Ibn Khuzaymah, oleh Abu Bakr Muhammad ibn Ishaq ibn Khuzaymah al-Nisaburi (wafat 311 H), berjudul 'Al-Mukhtasar min al-Mukhtasar min al-Musnad al-Sahih 'an al-Nabi'; yang dipindai secara lokal (file 61667), dengan penomoran cetak, menyebutkan nomor halaman yang dipindai."
