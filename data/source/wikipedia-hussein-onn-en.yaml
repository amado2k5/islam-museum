summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسين أون (1922–1990)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في جوهور بهرو في 12 فبراير 1922 ابنًا لعون جعفر، ومسيرتيه العسكرية والقانونية، وعودته إلى أمنو، ورئاسته الثالثة لوزراء ماليزيا (1976–1981)، ووفاته في سان ماتيو بكاليفورنيا في 29 مايو 1990."
  en: "English Wikipedia article on Hussein Onn (1922–1990); used for entity facts only. It recounts his birth at Johor Bahru on 12 February 1922 as the son of Onn Jaafar, his military and legal careers, his return to UMNO, his tenure as Malaysia's third prime minister (1976–1981), and his death at San Mateo, California, on 29 May 1990."
  es: "Artículo de la Wikipedia en inglés sobre Hussein Onn (1922-1990); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Johor Bahru el 12 de febrero de 1922 como hijo de Onn Jaafar, su carrera militar y jurídica, su regreso a la UMNO, su mandato como tercer primer ministro de Malasia (1976-1981) y su fallecimiento en San Mateo, California, el 29 de mayo de 1990."
  fr: "Article de Wikipédia en anglais sur Hussein Onn (1922-1990); utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Johor Bahru le 12 février 1922, fils d'Onn Jaafar, ses carrières militaire et juridique, son retour à l'UMNO, son mandat de troisième Premier ministre de Malaisie (1976-1981) et sa mort à San Mateo, en Californie, le 29 mai 1990."
