  ar: "مقالة ويكيبيديا الإنجليزية عن حسين أون (1922–1990)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في جوهور بهرو في 12 فبراير 1922 ابنًا لعون جعفر، ومسيرتيه العسكرية والقانونية، وعودته إلى أمنو، ورئاسته الثالثة لوزراء ماليزيا (1976–1981)، ووفاته في سان ماتيو بكاليفورنيا في 29 مايو 1990."
  en: "English Wikipedia article on Hussein Onn (1922–1990); used for entity facts only. It recounts his birth at Johor Bahru on 12 February 1922 as the son of Onn Jaafar, his military and legal careers, his return to UMNO, his tenure as Malaysia's third prime minister (1976–1981), and his death at San Mateo, California, on 29 May 1990."
