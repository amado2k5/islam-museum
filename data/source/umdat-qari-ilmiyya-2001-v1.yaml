label:
  ar: "عمدة القاري شرح صحيح البخاري — بدر الدين محمود بن أحمد العيني (ت 855هـ)، ضبطه وصححه عبد الله محمود محمد عمر، دار الكتب العلمية، بيروت، الطبعة الأولى 1421هـ/2001م، الجزء الأول"
  en: "'Umdat al-Qari Sharh Sahih al-Bukhari — Badr al-Din Mahmud b. Ahmad al-'Ayni (d. 855 AH), ed. 'Abd Allah Mahmud Muhammad 'Umar, Dar al-Kutub al-'Ilmiyya, Beirut, 1st ed. 1421 AH/2001 CE, vol. 1"
summary:
  ar: "الجزء الأول من طبعة دار الكتب العلمية (منشورات محمد علي بيضون) لعمدة القاري، طبعة مرقمة الكتب والأبواب والأحاديث على ترقيم المعجم المفهرس، يحوي من كتاب بدء الوحي إلى كتاب الإيمان (الأحاديث 1–58)، وفي أوله ترجمة للبخاري، وترجمة مطولة للعيني غير موقعة، ثم مقدمة الشارح وإسناده."
  en: "Vol. 1 of the Dar al-Kutub al-'Ilmiyya (Muhammad 'Ali Baydun) edition of 'Umdat al-Qari, with books, chapters and hadiths numbered after the Concordance; it covers the Book of the Beginning of Revelation to the Book of Faith (hadiths 1–58) and opens with a notice on al-Bukhari, a long unsigned biography of al-'Ayni, then the commentator's preface and his chains."
