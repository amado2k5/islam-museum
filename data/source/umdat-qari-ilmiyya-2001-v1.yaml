label:
  ar: "عمدة القاري شرح صحيح البخاري — بدر الدين محمود بن أحمد العيني ⁦(ت 855هـ)⁩، ضبطه وصححه عبد الله محمود محمد عمر، دار الكتب العلمية، بيروت، الطبعة الأولى 1421هـ/2001م، الجزء الأول"
  en: "'Umdat al-Qari Sharh Sahih al-Bukhari — Badr al-Din Mahmud b. Ahmad al-'Ayni (d. 855 AH), ed. 'Abd Allah Mahmud Muhammad 'Umar, Dar al-Kutub al-'Ilmiyya, Beirut, 1st ed. 1421 AH/2001 CE, vol. 1"
summary:
  ar: "الجزء الأول من طبعة دار الكتب العلمية ⁦(منشورات محمد علي بيضون)⁩ لعمدة القاري، طبعة مرقمة الكتب والأبواب والأحاديث على ترقيم المعجم المفهرس، يحوي من كتاب بدء الوحي إلى كتاب الإيمان ⁦(الأحاديث 1–58)⁩، وفي أوله ترجمة للبخاري، وترجمة مطولة للعيني غير موقعة، ثم مقدمة الشارح وإسناده."
  en: "Vol. 1 of the Dar al-Kutub al-'Ilmiyya (Muhammad 'Ali Baydun) edition of 'Umdat al-Qari, with books, chapters and hadiths numbered after the Concordance; it covers the Book of the Beginning of Revelation to the Book of Faith (hadiths 1–58) and opens with a notice on al-Bukhari, a long unsigned biography of al-'Ayni, then the commentator's preface and his chains."
  es: "El volumen 1 de la edición Dar al-Kutub al-'Ilmiyya (Muhammad 'Ali Baydun) de 'Umdat al-Qari, con libros, capítulos y hadices numerados según la Concordancia, abarca desde el Libro del Comienzo de la Revelación hasta el Libro de la Fe (hadices 1-58) y comienza con una nota sobre al-Bujari, una larga biografía sin firmar de al-'Ayni, seguida del prefacio del comentarista y sus cadenas de transmisión."
  fr: "Le volume 1 de l'édition Dar al-Kutub al-'Ilmiyya (Muhammad 'Ali Baydun) de 'Umdat al-Qari, avec des livres, des chapitres et des hadiths numérotés selon la Concordance; il couvre le Livre du Commencement de la Révélation jusqu'au Livre de la Foi (hadiths 1-58) et s'ouvre sur une notice sur al-Bukhari, une longue biographie non signée d'al-'Ayni, puis la préface du commentateur et ses chaînes."
  ur: "والیوم 1 دار الکتب العلمیہ ⁦(محمد علی بیدون)⁩ امت القاری کے ایڈیشن کا 1، کتابوں، ابواب اور احادیث کے ساتھ موافقت کے بعد نمبر؛ اس میں کتاب کی کتاب ⁦(حدیث 1-58)⁩ تک کتاب کا احاطہ کیا گیا ہے اور البخاری پر ایک نوٹس کے ساتھ کھلتا ہے، العینی کی ایک طویل غیر دستخط شدہ سوانح عمری، پھر مفسر کا دیباچہ اور اس کی زنجیریں۔"
