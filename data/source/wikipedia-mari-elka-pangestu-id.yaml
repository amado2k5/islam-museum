summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن ماري إلكا بانغيستو، المولودة في جاكرتا في 23 تشرين الأول 1956، ابنة الاقتصادي ج. بانغلايكيم؛ تذكر زواجها في 21 نيسان 1990 من آدي هارسونو وتصرح في متنها أنها معتنقة للكاثوليكية الرومانية."
  en: "Indonesian Wikipedia article on Mari Elka Pangestu, born in Jakarta on 23 October 1956, daughter of the economist J. Panglaykim; it records her 21 April 1990 marriage to Adi Harsono and states in its prose that she is a Roman Catholic adherent."
  es: "Artículo de la Wikipedia en indonesio sobre Mari Elka Pangestu, nacida en Yakarta el 23 de octubre de 1956, hija del economista J. Panglaykim; en él se registra su matrimonio con Adi Harsono el 21 de abril de 1990 y se afirma en su texto que es católica practicante."
  fr: "L'article de Wikipédia indonésien sur Mari Elka Pangestu, née à Jakarta le 23 octobre 1956, fille de l'économiste J. Panglaykim; il relate son mariage avec Adi Harsono le 21 avril 1990 et précise dans son texte qu'elle est de confession catholique romaine."
  ur: "انڈونیشیائی ویکیپیڈیا کا مضمون ماری ایلکا پانگسٹو پر، 23 اکتوبر 1956 کو جکارتہ میں پیدا ہوئی، ماہر اقتصادیات جے پینگلیکیم کی بیٹی؛ اس نے 21 اپریل 1990 کو اڈی ہارسونو کے ساتھ اس کی شادی کو ریکارڈ کیا اور اپنے نثر میں کہا کہ وہ رومن کیتھولک کی پیروکار ہے۔"
  tr: "Endonezya Wikipedia'sındaki makale, 23 Ekim 1956'da Cakarta'da doğan ve ekonomist J. Banglaikim'in kızı Mari Elka Bangistu hakkında; 21 Nisan 1990'da Adi Harsono ile evlendiğini belirtiyor ve Roma Katolikliğine geçtiğini belirtiyor."
  id: "Artikel Wikipedia Indonesia tentang Mari Elka Bangistu, lahir di Jakarta pada 23 Oktober 1956, putri ekonom J. Banglaikim; ia menyebutkan pernikahannya pada 21 April 1990 dengan Adi Harsono dan menyatakan di dalamnya bahwa ia adalah seorang mualaf ke Katolik Roma."
