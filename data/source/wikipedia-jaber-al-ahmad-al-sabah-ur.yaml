summary:
  ar: "مقالة ويكيبيديا الأردية عن جابر الأحمد الصباح، وهي مختصر قصير؛ تُستخدم لوقائع الكيان فقط. تذكر أنه كان أمير الكويت من 1977 إلى 2006، ولا تتضمن أي بيان عن دينه أو مدرسته."
  en: "Urdu Wikipedia article on Jaber Al-Ahmad Al-Sabah, a short stub; used for entity facts only. It records that he was Emir of Kuwait from 1977 to 2006 and contains no statement of his religion or school."
  es: "Artículo de Wikipedia en urdu sobre Jaber Al-Ahmad Al-Sabah, un breve esbozo; utilizado únicamente para datos sobre la persona. Indica que fue emir de Kuwait desde 1977 hasta 2006 y no contiene ninguna mención a su religión o escuela."
  fr: "L'article de Wikipédia en ourdou sur Jaber Al-Ahmad Al-Sabah est une ébauche succincte, servant uniquement à fournir des informations sur l'entité. Il indique qu'il fut émir du Koweït de 1977 à 2006, sans mentionner sa religion ni son école."
  ur: "جابر الاحمد الصباح پر اردو ویکیپیڈیا مضمون، ایک مختصر سٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں درج ہے کہ وہ 1977 سے 2006 تک کویت کے امیر تھے اور ان کے مذہب یا مکتب کا کوئی بیان نہیں ہے۔"
  tr: "Jaber Al-Ahmad Al-Sabah hakkında Urduca Wikipedia makalesi, kısa bir özet; sadece varlığın gerçekleri için kullanılmıştır. Unutmayın, 1977'den 2006'ya kadar Kuveyt Emiri idi ve dini veya okulu hakkında herhangi bir açıklama içermiyor."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Jaber Al-Ahmad Al-Sabah, yang merupakan ringkasan singkat; digunakan hanya untuk fakta entitas. Ingat bahwa dia adalah Emir Kuwait dari tahun 1977 hingga 2006, dan tidak menyertakan pernyataan apapun tentang agama atau sekolahnya."
