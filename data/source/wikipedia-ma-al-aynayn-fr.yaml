reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: Muhammad al-Mustafa 'dit Ma El Aïnin', 'né vers 1831 près d'Oualata (actuelle Mauritanie)' — the 'about 1831' agreeing with the Arabic article's exact Hijri date (27 Sha'ban 1246, converting to 10 February 1831) against the English and Spanish articles' 1830; died 23 October 1910 at Tiznit (against the Arabic article's Gregorian pairing of 25 October 1910, recorded as a conflict); twelfth son of Muhammad Fadil, 'fondateur de la congrégation soufie Fadiliyya' — founder of the Sufi congregation Fadiliyya — and himself 'un cheikh et marabout' with 'de nombreux disciples (tlamid)'; the article names his own line 'la Fadiliyya-Ma'ïniyya' when describing his brotherhood's desert-edge network; educated by his father at the family zawiya in the Tagant, memorising Qur'an, hadith and fiqh, master of the Arabic language by 16, after which he 'began to preach'; studied at Tolba/Tiznit and with Mauritanian and Moroccan ulema; the 1904 jihad, the march against Fez in June 1910 at the head of 6,000 horsemen at about 80, the defeat by General Moinier's column near Sidi Salah (Kasba-Tadla) on 23 June 1910 and his wounding; the article also states that at Tiznit 'il se proclame Mahdi' — a claim the museum carries only as this article's attributed claim; his works include Mubsir al-mutashawwif 'ala Muntakhab al-Tasawwuf; Le Clézio's novel Désert weaves his 1910 expedition."
