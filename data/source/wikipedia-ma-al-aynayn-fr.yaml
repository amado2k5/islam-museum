summary:
  ar: "مقالة ويكيبيديا الفرنسية عن ماء العينين؛ تُستخدم لوقائع الكيان فقط. تصف أباه بأنه مؤسس «الجماعة الصوفية الفاضلية» وتصفه هو بأنه شيخ ومرابط له تلاميذ كثيرون، وتؤرخ ميلاده «نحو 1831» بالقرب من ولاتة ووفاته في 23 أكتوبر 1910 في تزنيت."
  en: "French Wikipedia article on Ma al-'Aynayn; used for entity facts only. It describes his father as founder of 'the Sufi congregation Fadiliyya' and him as a sheikh and marabout with numerous disciples, and dates his birth 'about 1831' near Oualata and his death to 23 October 1910 at Tiznit."
  es: "Artículo de la Wikipedia en francés sobre Ma al-'Aynayn; utilizado únicamente para datos sobre la persona. Describe a su padre como fundador de la congregación sufí Fadiliyya y a él mismo como un jeque y marabú con numerosos discípulos, y fecha su nacimiento alrededor de 1831 cerca de Oualata y su muerte el 23 de octubre de 1910 en Tiznit."
  fr: "Article de Wikipédia en français sur Ma al-'Aynayn; utilisé uniquement pour les informations sur l'entité. Il décrit son père comme le fondateur de la congrégation soufie Fadiliyya et lui-même comme un cheikh et marabout avec de nombreux disciples, et situe sa naissance vers 1831 près d'Oualata et sa mort le 23 octobre 1910 à Tiznit."
  ur: "ما العینین پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے والد کو 'صوفی جماعت فدیلیہ' کے بانی کے طور پر بیان کیا گیا ہے اور انھیں متعدد شاگردوں کے ساتھ ایک شیخ اور مرعب کے طور پر بیان کیا گیا ہے، اور اس کی تاریخ 'تقریباً 1831' اوالاتا کے قریب اور ان کی وفات 23 اکتوبر 1910 کو تزنٹ میں ہے۔"
  tr: "Ma El Ainin hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Makalede babası 'Erdemli Sufi Cemaati'nin kurucusu olarak tanımlanır ve onu bir şeyh ve Murabat olarak tanımlar, birçok öğrencisi olan bir şeyh ve Murabat olarak tanımlanır; doğumunu 'yaklaşık 1831' Walata yakınlarında ve 23 Ekim 1910'da Tiznit'te öldüğünü belirtir."
  id: "Artikel Wikipedia Prancis tentang Ma El Ainin; digunakan hanya untuk fakta entitas tersebut. Artikel ini menggambarkan ayahnya sebagai pendiri 'Komunitas Sufi Berbudi Luhur' dan menggambarkannya sebagai seorang sheikh dan Murabat dengan banyak murid, serta mencatat kelahirannya 'sekitar tahun 1831' di dekat Walata dan kematiannya pada 23 Oktober 1910 di Tiznit."
