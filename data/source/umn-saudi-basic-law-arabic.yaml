  en: "Basic Law of Governance of Saudi Arabia (University of Minnesota Human Rights Library, Arabic full text of the Basic Law)"
summary:
  ar: "«النظام الأساسي للحكم في السعودية»، كما يُنشر عند: مكتبة حقوق الإنسان بجامعة مينيسوتا، النص الكامل للنظام الأساسي بالعربية. العنوان ونص المادة 1 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Basic Law of Governance of Saudi Arabia, as published at: University of Minnesota Human Rights Library, Arabic full text of the Basic Law. The address and the wording of Article 1 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Basic Law of Governance of Saudi Arabia، جیسا کہ University of Minnesota Human Rights Library, Arabic full text of the Basic Law پر شائع ہے۔ پتہ اور دفعہ 1 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Basic Law of Governance of Saudi Arabia, tel que publié à : University of Minnesota Human Rights Library, Arabic full text of the Basic Law. L'adresse et le texte (article 1) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Basic Law of Governance of Saudi Arabia, tal como se publica en: University of Minnesota Human Rights Library, Arabic full text of the Basic Law. La dirección y el texto (artículo 1) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Suudi Arabistan'da Temel Yönetişim Yasası,\" Minnesota Üniversitesi İnsan Hakları Kütüphanesi'nde yayımlandığı gibi, Temel Yasa'nın Arapça tam metni. Madde 1'in başlığı ve metni, müze tarafından sağlanan bir araştırma özetinden alınmıştır ve müze sayfayı açmamıştır; kurucu, metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Undang-Undang Dasar Tata Kelola di Arab Saudi,\" sebagaimana diterbitkan di: Perpustakaan Hak Asasi Manusia di Universitas Minnesota, teks lengkap Undang-Undang Dasar dalam bahasa Arab. Judul dan teks Pasal 1 diambil dari ringkasan penelitian yang disediakan oleh museum, dan museum tidak membuka halaman tersebut; pendiri mengizinkan penggunaan teks tersebut seperti yang dinyatakan pada 21 November 2026."
