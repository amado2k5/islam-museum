  ar: "مقالة ويكيبيديا الإنجليزية عن القوّال فريد أياز؛ لوقائع الكيان فقط: مولده في حيدر آباد في 13 نوفمبر 1952، وانتقال أسرته إلى كراتشي في 1956، وانتسابه إلى غرانة قوال بچوں کا دہلی، وفرقته مع أخيه أبو محمد، وأعماله في كوك ستوديو، ووسام حسن الأداء في 2006؛ وتستند إلى داون وذا هندو وتهران تايمز وذا إكسبريس تريبيون."
  en: "English Wikipedia article on the qawwal Fareed Ayaz; entity facts only: birth in Hyderabad on 13 November 1952, the family's move to Karachi in 1956, his place in the Qawwal Bachon ka Gharana of Delhi, his party with his brother Abu Muhammad, his Coke Studio pieces and the Pride of Performance in 2006; it cites Dawn, The Hindu, the Tehran Times and The Express Tribune."
