summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0625\u0646\u062c\u0644\u064a\u0632\u064a\u0629 \u0639\u0646 \u0627\u0644\u0642\u0648\u0651\u0627\u0644 \u0641\u0631\u064a\u062f \u0623\u064a\u0627\u0632\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a \u062d\u064a\u062f\u0631 \u0622\u0628\u0627\u062f \u0641\u064a 13 \u0646\u0648\u0641\u0645\u0628\u0631 1952\u060c \u0648\u0627\u0646\u062a\u0642\u0627\u0644 \u0623\u0633\u0631\u062a\u0647 \u0625\u0644\u0649 \u0643\u0631\u0627\u062a\u0634\u064a \u0641\u064a 1956\u060c \u0648\u0627\u0646\u062a\u0633\u0627\u0628\u0647 \u0625\u0644\u0649 \u063a\u0631\u0627\u0646\u0629 \u0642\u0648\u0627\u0644 \u0628\u0686\u0648\u06ba \u06a9\u0627 \u062f\u06c1\u0644\u06cc\u060c \u0648\u0641\u0631\u0642\u062a\u0647 \u0645\u0639 \u0623\u062e\u064a\u0647 \u0623\u0628\u0648 \u0645\u062d\u0645\u062f\u060c \u0648\u0623\u0639\u0645\u0627\u0644\u0647 \u0641\u064a \u0643\u0648\u0643 \u0633\u062a\u0648\u062f\u064a\u0648\u060c \u0648\u0648\u0633\u0627\u0645 \u062d\u0633\u0646 \u0627\u0644\u0623\u062f\u0627\u0621 \u0641\u064a 2006\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u062f\u0627\u0648\u0646 \u0648\u0630\u0627 \u0647\u0646\u062f\u0648 \u0648\u062a\u0647\u0631\u0627\u0646 \u062a\u0627\u064a\u0645\u0632 \u0648\u0630\u0627 \u0625\u0643\u0633\u0628\u0631\u064a\u0633 \u062a\u0631\u064a\u0628\u064a\u0648\u0646."
