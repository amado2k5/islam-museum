summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن القوّال فريد أياز؛ لوقائع الكيان فقط: مولده في حيدر آباد في 13 نوفمبر 1952، وانتقال أسرته إلى كراتشي في 1956، وانتسابه إلى غرانة قوال بچوں کا دہلی، وفرقته مع أخيه أبو محمد، وأعماله في كوك ستوديو، ووسام حسن الأداء في 2006؛ وتستند إلى داون وذا هندو وتهران تايمز وذا إكسبريس تريبيون."
  en: "English Wikipedia article on the qawwal Fareed Ayaz; entity facts only: birth in Hyderabad on 13 November 1952, the family's move to Karachi in 1956, his place in the Qawwal Bachon ka Gharana of Delhi, his party with his brother Abu Muhammad, his Coke Studio pieces and the Pride of Performance in 2006; it cites Dawn, The Hindu, the Tehran Times and The Express Tribune."
  es: "Artículo de la Wikipedia en inglés sobre el qawwal Fareed Ayaz; solo datos sobre la persona: nacimiento en Hyderabad el 13 de noviembre de 1952, traslado de la familia a Karachi en 1956, su lugar en la Qawwal Bachon ka Gharana de Delhi, su fiesta con su hermano Abu Muhammad, sus piezas para Coke Studio y el premio Pride of Performance en 2006; cita a Dawn, The Hindu, The Tehran Times y The Express Tribune."
  fr: "Article de Wikipédia en anglais sur le qawwal Fareed Ayaz; faits concernant uniquement l’artiste: naissance à Hyderabad le 13 novembre 1952, déménagement de la famille à Karachi en 1956, sa place au sein du Qawwal Bachon ka Gharana de Delhi, sa fête avec son frère Abu Muhammad, ses prestations au Coke Studio et le prix Pride of Performance en 2006; l’article cite Dawn, The Hindu, le Tehran Times et The Express Tribune."
  ur: "قوال فرید ایاز پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: 13 نومبر 1952 کو حیدرآباد میں پیدائش، 1956 میں خاندان کا کراچی منتقل ہونا، دہلی کے قوال بچون کا گھرانہ میں ان کی جگہ، اپنے بھائی ابو محمد کے ساتھ ان کی پارٹی، کوک اسٹوڈیو کے ٹکڑے اور 2006 میں پرائیڈ آف پرفارمنس؛ اس نے ڈان، دی ہندو، تہران ٹائمز اور ایکسپریس ٹریبیون کا حوالہ دیا ہے۔"
