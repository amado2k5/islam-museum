reliability_note: "Read in full. Gives 1639–1691, calls him an 'Iranian Shia philosopher', names Rajab Ali Tabrizi, Fayz Kashani and Abd al-Razzaq Lahiji as his teachers, and covers the Kalid-i bihisht, the Forty Hadith commentary left at the twenty-eighth hadith, the Tawhid commentary, and his defence of Ibn Arabi's mystical monotheism against Mulla Sadra. Its death year (18 Ramadan 1691) conflicts with the dated evidence in Encyclopaedia Iranica and is preserved as a reading in the record, not followed."
