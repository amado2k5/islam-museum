  ar: "«المعهد الوطني للإحصاء في تونس، نشرة التعليم السريعة، تعداد 2024، سبتمبر 2025»، المعهد الوطني للإحصاء في تونس INS، 2025. ورد في ملخص بحثي زُوّد به المتحف مع إدخال نسب اللغات في تونس؛ ولم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص كما ورد في 21 نوفمبر 2026."
  en: "INS Tunisia, Flash Education bulletin, RGPH 2024, September 2025, page 1; INS Tunisia, 2025. Named in a research summary supplied to the museum with the language-share entry for Tunisia; the museum did not open the page, and the founder approved using the summary as supplied on 21 November 2026."
  ur: "INS Tunisia, Flash Education bulletin, RGPH 2024, September 2025, page 1؛ INS Tunisia, 2025۔ متحف کو فراہم کردہ تحقیقی خلاصے میں تیونس کے زبانوں کے تناسب کے اندراج کے ساتھ مذکور؛ متحف نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو خلاصے کو جیسا ملا اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "INS Tunisia, Flash Education bulletin, RGPH 2024, September 2025, page 1 ; INS Tunisia, 2025. Nommé dans un résumé de recherche remis au musée avec l'entrée des parts de langues pour la Tunisie ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026."
  es: "INS Tunisia, Flash Education bulletin, RGPH 2024, September 2025, page 1; INS Tunisia, 2025. Nombrado en un resumen de investigación entregado al museo con la entrada de proporciones de lenguas de Túnez; el museo no abrió la página, y el fundador aprobó usar el resumen tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Tunus Ulusal İstatistik Enstitüsü, Hızlı Eğitim Bülteni, 2024 Nüfus Sayımı, Eylül 2025,\" Tunus Ulusal İstatistik Enstitüsü INS, 2025. Müze tarafından sağlanan ve Tunus'taki dil yüzdelerinin girdileriyle birlikte bir araştırma özetine dahil edilmiştir; müze sayfayı açmamış ve kurucu 21 Kasım 2026'da belirtildiği gibi özetin kullanımına izin vermiştir."
  id: "\"Institut Statistik Nasional di Tunisia, Buletin Pendidikan Cepat, Sensus 2024, September 2025,\" Institut Statistik Nasional di Tunisia INS, 2025. Artikel ini dimasukkan dalam ringkasan penelitian yang disediakan oleh museum dengan masukan persentase bahasa di Tunisia; museum tidak membuka halaman tersebut, dan pendiri mengizinkan penggunaan abstrak tersebut seperti yang dinyatakan pada 21 November 2026."
