summary:
  ar: "مقالة ويكيبيديا الأردية عن نواب قدسية بيكم ⁦(گوہر بيكم)⁩؛ تُستخدم لوقائع الكيان فقط. تعطي مولدها سنة 1215هـ في بوبال وزواجها سنة 1232هـ، وتصف حكمها وبناءها الجامع الكبير في بوبال وتنحّيها سنة 1252هـ ووفاتها سنة 1299هـ، وتطيل في وصف عبادتها وكرمها."
  en: "Urdu Wikipedia article on Nawab Qudsia Begum (Gauhar Begum); used for entity facts only. It gives her birth in 1215 AH at Bhopal and her marriage in 1232 AH, describes her rule, her building of Bhopal's great Jama Masjid and waterworks, her removal from rule in 1252 AH, and her death in 1299 AH, and dwells on her personal devotion and charity — practice, not a school attestation."
  es: "Artículo de Wikipedia en urdu sobre Nawab Qudsia Begum (Gauhar Begum); utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1215 AH en Bhopal y su matrimonio en 1232 AH, describe su gobierno, la construcción de la gran Jama Masjid y las obras hidráulicas de Bhopal, su destitución en 1252 AH y su muerte en 1299 AH, y profundiza en su devoción personal y caridad (práctica, no testimonio académico)."
  fr: "L'article de Wikipédia en ourdou sur la Nawab Qudsia Begum (Gauhar Begum) est utilisé uniquement à titre informatif. Il indique sa naissance en 1215 AH à Bhopal et son mariage en 1232 AH, décrit son règne, la construction de la grande mosquée Jama Masjid et des ouvrages hydrauliques de Bhopal, sa destitution en 1252 AH et sa mort en 1299 AH, et insiste sur sa dévotion et sa charité personnelles – un témoignage direct et non une attestation académique."
  ur: "نواب قدسیہ بیگم ⁦(گوہر بیگم)⁩ پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پیدائش 1215 ہجری میں بھوپال میں ہوئی اور اس کی شادی 1232 ہجری میں ہوئی، اس میں اس کی حکمرانی، اس کی بھوپال کی عظیم جامع مسجد اور واٹر ورکس کی تعمیر، 1252 ہجری میں اس کی حکومت سے برطرفی، اور 1299 ہجری میں اس کی موت کا ذکر ہے، اور اس کی ذاتی عقیدت اور خیرات پر توجہ دی گئی ہے - نہ کہ اسکول کے عمل میں۔"
