  en: "Urdu Wikipedia article on Nawab Qudsia Begum (Gauhar Begum); used for entity facts only. It gives her birth in 1215 AH at Bhopal and her marriage in 1232 AH, describes her rule, her building of Bhopal's great Jama Masjid and waterworks, her removal from rule in 1252 AH, and her death in 1299 AH, and dwells on her personal devotion and charity — practice, not a school attestation."
