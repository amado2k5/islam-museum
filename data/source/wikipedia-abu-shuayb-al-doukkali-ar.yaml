summary:
  ar: "مقالة ويكيبيديا العربية عن أبي شعيب بن عبد الرحمن الصديقي الدكالي ⁦(1295–1356 هـ)⁩، فقيه المغرب ومحدثه ووزير عدله؛ تنص على ولادته في 25 ذي القعدة 1295 بالصديقات بدكالة، وأخذه العلم بالأزهر عن سليم البشري ومحمد بخيت المطيعي، وإفتائه في المذاهب الأربعة."
  en: "The Arabic Wikipedia article on Abu Shu'ayb ibn Abd al-Rahman al-Sadiqi al-Doukkali (1295–1356 AH), Morocco's jurist, hadith master and minister of justice; it gives his birth on 25 Dhu al-Qa'da 1295 at al-Sadiqat in Doukkala, his studies at al-Azhar under Salim al-Bishri and Muhammad Bakhit al-Muti'i, and his giving fatwa across the four madhhabs."
  es: "El artículo árabe de Wikipedia sobre Abu Shu'ayb ibn Abd al-Rahman al-Sadiqi al-Doukkali (1295-1356 d. H.), jurista marroquí, maestro de hadices y ministro de justicia; Da su nacimiento el 25 de Dhu al-Qa'da de 1295 en al-Sadiqat en Doukkala, sus estudios en al-Azhar con Salim al-Bishri y Muhammad Bakhit al-Muti'i, y sus fatwas en las cuatro madhabs."
  fr: "L'article arabe de Wikipédia sur Abu Shu'ayb ibn Abd al-Rahman al-Sadiqi al-Doukkali (1295-1356 AH), juriste marocain, maître des hadiths et ministre de la justice; il donne sa naissance le 25 Dhu al-Qa'da 1295 à al-Sadiqat à Doukkala, ses études à al-Azhar sous Salim al-Bishri et Muhammad Bakhit al-Muti'i, et ses fatwas à travers les quatre madhhabs."
  ur: "ابو شعیب بن عبدالرحمن الصادقی الدوکلی ⁦(1295-1356ھ)⁩ پر عربی ویکیپیڈیا کا مضمون، مراکشی فقیہ، حدیث کے ماہر اور وزیر انصاف؛ اس کی ولادت 25 ذی القعدہ 1295 کو الصادقات میں دوکلا میں ہوئی، اس کی تعلیم الازہر میں سلیم البشری اور محمد بخیت المطیعی کے تحت ہوئی، اور چاروں مذاہب میں اس کے فتوے دیے گئے۔"
  tr: "Faslı hukukçu, hadis alimi ve Adalet Bakanı olan Ebu Şuayb bin Abdul Rahman El-Siddiqi El-Dukkali (1295–1356 H) hakkında Arapça Vikipedi makalesi; 25 Zfu Kı'de 1295'te Doukkala'daki El-Siddiqat'ta doğduğunu, El-Ezher'de Salim El-Bişri ve Muhammed Bakhit El-Mutai'i'den eğitim aldığını ve dört mezhebe fetvalar verdiğini belirtir."
  id: "Artikel Wikipedia berbahasa Arab tentang Abu Shuayb bin Abdul Rahman Al-Siddiqi Al-Dukkali (1295–1356 H), seorang ahli hukum Maroko, ulama hadis, dan Menteri Kehakiman; disebutkan bahwa ia lahir pada 25 Dhu al-Qi'dah 1295 di Al-Siddiqat di Doukkala, bahwa ia belajar di Al-Azhar di bawah bimbingan Salim Al-Bishri dan Muhammad Bakhit Al-Mutai'i, serta bahwa ia mengeluarkan fatwa dalam empat aliran pemikiran."
