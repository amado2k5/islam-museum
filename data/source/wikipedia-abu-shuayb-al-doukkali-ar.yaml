  ar: "مقالة ويكيبيديا العربية عن أبي شعيب بن عبد الرحمن الصديقي الدكالي (1295–1356 هـ)، فقيه المغرب ومحدثه ووزير عدله؛ تنص على ولادته في 25 ذي القعدة 1295 بالصديقات بدكالة، وأخذه العلم بالأزهر عن سليم البشري ومحمد بخيت المطيعي، وإفتائه في المذاهب الأربعة."
  en: "The Arabic Wikipedia article on Abu Shu'ayb ibn Abd al-Rahman al-Sadiqi al-Doukkali (1295–1356 AH), Morocco's jurist, hadith master and minister of justice; it gives his birth on 25 Dhu al-Qa'da 1295 at al-Sadiqat in Doukkala, his studies at al-Azhar under Salim al-Bishri and Muhammad Bakhit al-Muti'i, and his giving fatwa across the four madhhabs."
