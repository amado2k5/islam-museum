label:
  ar: "أنوار التنزيل وأسرار التأويل — البيضاوي، الجزء الرابع، وبهامشه حاشية الكازروني ⁦(دار الكتب العربية الكبرى، مصطفى البابي الحلبي وأخواه، القاهرة، 1330هـ)⁩"
  en: "Anwar al-Tanzil wa-Asrar al-Ta'wil — al-Baydawi, part 4, with al-Kazaruni's gloss in the margin (Dar al-Kutub al-Arabiyya al-Kubra, Mustafa al-Babi al-Halabi and brothers, Cairo, 1330 AH)"
  ur: "انوار التنزیل واسرار التاویل — بیضاوی، جزء چہارم، حاشیے پر کازرونی کا حاشیہ (دار الکتب العربیہ الکبریٰ، مصطفیٰ البابی الحلبی و برادران، قاہرہ، 1330ھ)"
summary:
  ar: "الجزء الرابع ⁦(من سورة مريم إلى آخر القرآن)⁩ من طبعة دار الكتب العربية الكبرى بمصر على نفقة مصطفى البابي الحلبي وأخويه بكري وعيسى، وبهامشه حاشية أبي الفضل القرشي الصديقي الخطيب المشهور بالكازروني؛ وعلى غلافه أن المجلس الأعلى بالأزهر قرر تدريس هذا الجزء لطلبة السنة التاسعة. فرغ من طبعه في أوائل جمادى الآخرة سنة 1330هـ، ورئيس لجنة تصحيحه محمد الزهري الغمراوي."
  en: "Part 4 (from Surat Maryam to the end of the Qur'an) of the printing by Dar al-Kutub al-Arabiyya al-Kubra in Cairo at the expense of Mustafa al-Babi al-Halabi and his brothers Bakri and Isa, with the gloss of Abu al-Fadl al-Qurashi al-Siddiqi al-Khatib, known as al-Kazaruni, in the margin; the cover says al-Azhar's High Council prescribed this part for ninth-year students. Printing was finished early in Jumada II 1330 AH; the head of its correction committee was Muhammad al-Zuhri al-Ghamrawi."
  ur: "دار الکتب العربیہ الکبریٰ مصر کی طباعت کا جزء چہارم (سورۂ مریم سے قرآن کے آخر تک)، مصطفیٰ البابی الحلبی اور ان کے بھائیوں بکری اور عیسیٰ کے خرچ پر، جس کے حاشیے پر ابو الفضل القرشی الصدیقی الخطیب المعروف بالکازرونی کا حاشیہ ہے؛ سرورق پر ہے کہ ازہر کی مجلسِ اعلیٰ نے یہ جزء نویں سال کے طلبہ کے لیے مقرر کیا۔ طباعت جمادی الآخرہ 1330ھ کے اوائل میں مکمل ہوئی؛ تصحیح کمیٹی کے سربراہ محمد الزہری الغمراوی تھے۔"
