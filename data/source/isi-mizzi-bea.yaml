reliability_note: "Complete biography page read in full on the ISMI host reproducing the Springer BEA entry with author byline. Facts used: born probably al-Mizza near Damascus 1291, died Damascus 1349; studied in Cairo under Ibn al-Akfani; first muwaqqit at al-Rabwa then at the Umayyad Mosque until death; treatises al-Rawdhat al-muzhirat fi al-'amal bi-rub' al-muqantarat and Kashf al-rayb fi al-'amal bi-l-jayb were popular; also wrote on musattar (concealed) and mujahhanah (winged) quadrants; instruments praised as best of his times, 200 dirhams or more for an astrolabe and at least 50 for a quadrant; some five quadrants of his fabrication extant dated 1326/1327 onward; BEA reports Ibn al-Attar's note that he made astrolabes with mixed projections (stereographic markings about both poles) and that he excelled in oiling bows and constructing mechanical devices in the manner of Banu Musa. Charette judges the contributions 'few original' — the museum record keeps that assessment and claims only documented instrument variants, not priority."
