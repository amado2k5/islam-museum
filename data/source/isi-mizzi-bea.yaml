summary:
  ar: "سيرة فرانسوا شارتي لأبي عبد الله محمد بن أحمد المزي الحنفي ⁦(نحو 1291–1349م)⁩: ميقاتي بدمشق ثم بالجامع الأموي، صانع آلات بارع ومؤلف رسائل في الأسطرلاب والربع المقنطري وجيب والمستر والمجناح، وآلاته نالت مدحاً وبيعت بأسعار عالية."
  en: "François Charette's BEA biography of Zayn al-Din/Shams al-Din Abu Abd Allah Muhammad ibn Ahmad al-Mizzi al-Hanafi (c. 1291–1349): muwaqqit of al-Rabwa then the Umayyad Mosque in Damascus, skilled instrument maker and author of treatises on the astrolabe, astrolabic, sine, concealed and winged quadrants; his instruments were praised and sold at high prices."
  ur: "فرانکوا شارٹی کی BEA سوانح میں زین الدین/شمس الدین ابو عبد اللہ محمد بن احمد المزی حنفی ⁦(تقریباً 1291–1349ء)⁩: ربوہ پھر دمشق کی جامع اموی کے میقاتی، ماہر آلہ ساز اور اسطرلاب، ربع مقنطری، جیب، مستر اور مجنح پر رسائل کے مصنف؛ ان کے آلات سراہے گئے اور مہنگے بکتے۔"
  es: "La biografía de François Charette para la BEA sobre Zayn al-Din/Shams al-Din Abu Abd Allah Muhammad ibn Ahmad al-Mizzi al-Hanafi (c. 1291–1349): muwaqqit de al-Rabwa y luego de la Mezquita Omeya en Damasco, hábil fabricante de instrumentos y autor de tratados sobre el astrolabio, astrolábico, seno, cuadrantes ocultos y alados; sus instrumentos fueron elogiados y vendidos a precios elevados."
title: "Mizzī: Zayn al-Dīn [Shams al-Dīn] Abū ʿAbd Allāh Muḥammad ibn Aḥmad ibn ʿAbd al-Raḥīm al-Mizzī al-Ḥanafī"
