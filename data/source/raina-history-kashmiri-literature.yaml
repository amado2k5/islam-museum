label:
  en: "Trilokinath Raina, A History of Kashmiri Literature (2002)"
summary:
  ar: "كتاب تريلوكيناث راينا «تاريخ الأدب الكشميري» ⁦(أكاديمية ساهتيا، 2002)⁩: يقول فيه إن آزاد «بشّر بشجاعة بالإنسانية العلمية» وإن التزامه الأيديولوجي كان عميقاً، وإنه ظل «ماركسياً راديكالياً طوال حياته»."
  en: "Trilokinath Raina's Sahitya Akademi history of Kashmiri literature (2002): it says Azad 'courageously preached scientific humanism', that his ideological commitment was deep, and that politically 'he remained a Radical Marxist throughout his life'."
  es: "En su obra \"Historia de la literatura de Cachemira\" (2002), publicada por la Sahitya Akademi de Trilokinath Raina, se afirma que Azad \"predicó valientemente el humanismo científico\", que su compromiso ideológico era profundo y que, políticamente, \"siguió siendo un marxista radical durante toda su vida\"."
  fr: "L'histoire de la littérature kashmiri de Trilokinath Raina (2002) publiée par la Sahitya Akademi: il y est dit qu'Azad « prêchait courageusement l'humanisme scientifique », que son engagement idéologique était profond et que politiquement « il est resté un marxiste radical tout au long de sa vie »."
  ur: "ترلوکی ناتھ رائنا کی ساہتیہ اکادمی کشمیری ادب کی تاریخ (2002): اس میں کہا گیا ہے کہ آزاد نے 'جرات کے ساتھ سائنسی انسانیت کی تبلیغ کی'، کہ ان کی نظریاتی وابستگی گہری تھی، اور سیاسی طور پر 'وہ زندگی بھر ایک ریڈیکل مارکسسٹ رہے'۔"
  tr: "Trilokinath Raina'nın \"Keşmir Edebiyatı Tarihi\" (Sahitya Akademi, 2002) adlı kitabında Azad'ın \"cesurca bilimsel hümanizmi vaaz ettiğini\", ideolojik bağlılığının derin olduğunu ve hayatı boyunca \"radikal bir Marksist olarak kaldığını\" belirtir."
  id: "Buku Trilokinath Raina \"History of Kashmiri Literature\" (Sahitya Akademi, 2002) menyatakan bahwa Azad \"dengan berani mengajarkan humanisme ilmiah,\" bahwa komitmen ideologisnya sangat dalam, dan bahwa ia tetap \"seorang Marxis radikal sepanjang hidupnya.\""
