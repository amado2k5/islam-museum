reliability_note: "Standard literary history, read in the full Internet Archive scan of the 2002 Sahitya Akademi edition (ISBN 81-260-1366-4, as printed in the copy). The Azad discussion stands in 'The Modern Age' at pp. 105–106: 'Azad courageously preached scientific humanism'; 'Azad's ideological commitment was deep'; 'Politically he remained a Radical Marxist throughout his life.' The book elsewhere gives Azad's years as 1909–1948, which are wrong and are not used for any date."
