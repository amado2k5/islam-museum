reliability_note: "Read in the museum's session on 20 November 2026. It calls the book the author's chief work and one of the most trusted Arabic dictionaries; says it opens with a long preface (vol. I, pp. 2-54) on the sources and on the Arabic language; and gives three reasons al-Azhari states for writing it: to record the language he had heard and memorised in his long captivity among the Qarmatians, to fulfil the duty of sincere advice in the hadith, and to expose faults and gaps in earlier works, including those of al-Layth ibn al-Muzaffar, Ibn Durayd and Ibn Qutayba. Used for entity facts only."
