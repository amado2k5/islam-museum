summary:
  ar: "مدخل «موسيقى» في موسوعة TDV الإسلامية بقسميه: الأول تاريخ الموسيقى ونظرياتها من الإغريق إلى نظريّي العباسيين والموسيقيين الأشهار، والثاني أحكام الفقه في الغناء والمعازف ومصطلحاتها كالقينة والكيان والملاهي والمزامير."
  en: "The TDV İslâm Ansiklopedisi entry on music in two sections: the first on the history and theory of music from the Greeks through the Abbasid theorists and celebrated performers to the Ottoman notation systems, the second on fiqh — gınâ, samâʿ, the kayne and kiyân singing-girls, melâhî, meâzif and mezâmîr — and the scholars' debate over the ruling."
  ur: "TDV اسلام انسائیکلوپیڈیا کا «موسیقی» مدخل دو حصوں میں: پہلا یونانیوں سے عباسی نظریہ پردازوں اور مشہور فنکاروں تک موسیقی کی تاریخ و نظریہ، دوسرا فقہ — غنا، سماع، قینہ و کیان گانے والی لونڈیاں، ملاہی، معازف اور مزامیر — اور حکم پر علماء کا مباحثہ۔"
  es: "La entrada de TDV İslâm Ansiklopedisi sobre música se divide en dos secciones: la primera trata sobre la historia y la teoría de la música desde los griegos, pasando por los teóricos abasíes y los intérpretes célebres, hasta los sistemas de notación otomanos; la segunda, sobre el fiqh (jurisprudencia islámica): gınâ, samâʿ, las cantantes kayne y kiyân, melâhî, meâzif y mezâmîr, y el debate de los eruditos sobre la normativa."
  fr: "L'entrée de TDV İslâm Ansiklopedisi sur la musique est divisée en deux sections: la première sur l'histoire et la théorie de la musique, des Grecs aux théoriciens et interprètes célèbres abbassides, jusqu'aux systèmes de notation ottomans; la seconde sur le fiqh — gınâ, samâʿ, les chanteuses kayne et kiyân, melâhî, meâzif et mezâmîr — et le débat des érudits sur la question."
  tr: "TDV İslami Ansiklopedisi'ndeki \"Müzik\" maddesi iki bölümden oluşur: birincisi Yunanlardan Abbasi teorisyenlerine ve ünlü müzisyenlere kadar müzik tarihi ve teorileri; ikincisi ise şarkı ve müzik aletlerindeki fıkıh hükümleri ile bunların terimleri olan qinnah, varlık, eğlence parkları ve flütlerdir."
  id: "Entri \"Musik\" dalam Ensiklopedia Islam TDV terdiri dari dua bagian: yang pertama adalah sejarah musik dan teorinya dari Yunani hingga teoritikus Abbasiyah dan musisi terkenal; yang kedua adalah aturan yurisprudensi dalam menyanyi dan alat musik serta istilahnya seperti qinnah, entitas, taman hiburan, dan seruling."
