  ar: "مقالة ويكيبيديا الإنجليزية عن فوزية كوفي؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها سنة 1975 في بدخشان، وعملها لدى اليونيسف، ونيابتها لرئاسة البرلمان، ومشروع قانون القضاء على العنف ضد المرأة، ومحاولات اغتيالها، ومنفاها في لندن، ولا تسمّي لها مذهبًا."
  en: "English Wikipedia article on Fawzia Koofi; used for entity facts only. It records her birth in 1975 in Badakhshan, her UNICEF work, her deputy speakership, the EVAW legislation, the assassination attempts on her and her exile in London, and names no school for her."
