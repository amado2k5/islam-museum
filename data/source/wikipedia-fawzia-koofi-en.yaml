summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فوزية كوفي؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها سنة 1975 في بدخشان، وعملها لدى اليونيسف، ونيابتها لرئاسة البرلمان، ومشروع قانون القضاء على العنف ضد المرأة، ومحاولات اغتيالها، ومنفاها في لندن، ولا تسمّي لها مذهبًا."
  en: "English Wikipedia article on Fawzia Koofi; used for entity facts only. It records her birth in 1975 in Badakhshan, her UNICEF work, her deputy speakership, the EVAW legislation, the assassination attempts on her and her exile in London, and names no school for her."
  es: "Artículo de la Wikipedia en inglés sobre Fawzia Koofi; utilizado únicamente para datos sobre la persona. En él se registra su nacimiento en 1975 en Badakhshan, su labor con UNICEF, su cargo como vicepresidenta del Parlamento, la legislación EVAW, los intentos de asesinato en su contra y su exilio en Londres, pero no menciona ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en anglais sur Fawzia Koofi; utilisé uniquement pour des informations sur l’entité. Il mentionne sa naissance en 1975 au Badakhshan, son travail pour l’UNICEF, son poste de vice-présidente de l’Assemblée nationale, la loi EVAW, les tentatives d’assassinat dont elle a été victime et son exil à Londres, mais ne cite aucun établissement scolaire où elle aurait étudié."
  ur: "فوزیہ کوفی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1975 میں بدخشاں میں اس کی پیدائش، اس کا یونیسیف کا کام، اس کی ڈپٹی اسپیکر شپ، EVAW قانون سازی، اس پر قاتلانہ حملے اور لندن میں اس کی جلاوطنی، اور اس کے لیے کسی اسکول کا نام نہیں بتایا گیا ہے۔"
