reliability_note: "Platform statistics aggregator, not a museum-verified fact: vidIQ compiles public YouTube data and stated, as of 14 November 2026, 439,000 subscribers, 54,943,321 total views and 6,951 videos; the channel started on 5 June 2012 and its channel country is set to Indonesia. Its most-viewed upload, as listed on 15 November 2026, is a Friday khutbah by KH. Bachtiar Nasir (October 2023; 351.92K views in the listing), and its recent uploads include talks by him and by other teachers at the centre. vidIQ's estimated earnings are modelled and are not used. The page does not state who founded the centre. Read on 15 November 2026; the figures agree with the wave-200 harvest's vidIQ read of 10 November 2026 (439,000 subscribers, 54,930,809 views, 6,946 videos)."
