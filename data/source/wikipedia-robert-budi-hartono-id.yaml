  ar: "مقالة ويكيبيديا الإندونيسية عن روبرت بودي هارتونو، المولود باسم أوي هوي تجونغ في 28 نيسان 1941، الابن الثاني لمؤسس جاروم أوي وي غوان وأخوه الأكبر مايكل بامبانغ هارتونو؛ تذكر حصتهما الكبرى في بنك سنترال آسيا ومزارع النخيل والعقارات، وتأسيسه نادي بادمنتون جاروم سنة 1969، وزوجته ويدوواتي وأبناءه الثلاثة."
  en: "Indonesian Wikipedia article on Robert Budi Hartono, born Oei Hwie Tjhong on 28 April 1941, second son of Djarum founder Oei Wie Gwan, his elder brother being Michael Bambang Hartono; it records their majority stake in Bank Central Asia, their palm-oil estates and properties, his founding of the PB Djarum badminton club in 1969, and his wife Widowati and three sons."
