summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن روبرت بودي هارتونو، المولود باسم أوي هوي تجونغ في 28 نيسان 1941، الابن الثاني لمؤسس جاروم أوي وي غوان وأخوه الأكبر مايكل بامبانغ هارتونو؛ تذكر حصتهما الكبرى في بنك سنترال آسيا ومزارع النخيل والعقارات، وتأسيسه نادي بادمنتون جاروم سنة 1969، وزوجته ويدوواتي وأبناءه الثلاثة."
  en: "Indonesian Wikipedia article on Robert Budi Hartono, born Oei Hwie Tjhong on 28 April 1941, second son of Djarum founder Oei Wie Gwan, his elder brother being Michael Bambang Hartono; it records their majority stake in Bank Central Asia, their palm-oil estates and properties, his founding of the PB Djarum badminton club in 1969, and his wife Widowati and three sons."
  es: "Artículo de la Wikipedia en indonesio sobre Robert Budi Hartono, nacido Oei Hwie Tjhong el 28 de abril de 1941, segundo hijo del fundador de Djarum, Oei Wie Gwan, siendo su hermano mayor Michael Bambang Hartono; en él se menciona su participación mayoritaria en Bank Central Asia, sus plantaciones y propiedades de palma aceitera, la fundación del club de bádminton PB Djarum en 1969, y a su esposa Widowati y sus tres hijos."
  fr: "L'article de Wikipédia indonésien sur Robert Budi Hartono, né Oei Hwie Tjhong le 28 avril 1941, deuxième fils du fondateur de Djarum, Oei Wie Gwan, son frère aîné étant Michael Bambang Hartono; il mentionne leur participation majoritaire dans Bank Central Asia, leurs plantations d'huile de palme et leurs propriétés, la fondation par Robert du club de badminton PB Djarum en 1969, ainsi que sa femme Widowati et leurs trois fils."
  ur: "رابرٹ بوڈی ہارٹونو پر انڈونیشیائی ویکیپیڈیا کا مضمون، 28 اپریل 1941 کو پیدا ہوئے اوئی ہیوئی ٹژونگ، دجارم کے بانی اوئی وائی گوان کے دوسرے بیٹے، ان کے بڑے بھائی مائیکل بامبنگ ہارٹونو؛ اس میں بینک سینٹرل ایشیا، ان کی پام آئل اسٹیٹس اور جائیدادوں، 1969 میں پی بی جارم بیڈمنٹن کلب کی ان کی بنیاد، اور ان کی اہلیہ ودووتی اور تین بیٹوں میں ان کے اکثریتی حصص کا ریکارڈ ہے۔"
