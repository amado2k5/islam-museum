reliability_note: "A third-party channel-analytics page, used only for the channel's shape and dated platform figures. Its FAQ records 193K subscribers, 31M total views, a first upload on 31 August 2012 and Kenya as the channel-profile country, and its header block records about 4 videos a week at an average of 20 minutes; its descriptive copy gives the earlier rounded figures of 185,000 subscribers and over 29 million views, superseded within the same page by the FAQ figure and independently matched by vidIQ's 193,000 subscribers as of 7 November 2026 (source/vidiq-izudin-alwy-ahmed). It describes the content, verbatim, as 'a strong focus on religious and societal themes, particularly related to Islamic teachings and lifestyle' and the channel language as Swahili. Platform figures are dated observations, not museum facts. It names no school for the sheikh himself. Crawled 6 November 2026; read 8 November 2026."
