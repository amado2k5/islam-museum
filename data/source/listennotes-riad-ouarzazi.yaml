summary:
  ar: "قائمة Listen Notes لبودكاست مسلم سنترال الخاص برياض الورزازي (نحو 792 حلقة منذ 2012)؛ تذكر سيرته أنه وُلد في الدار البيضاء، ونال شهادات في التعليم الإسلامي من جامعة عبد الله، وانتقل إلى الولايات المتحدة سنة 1988 فدرس الإدارة الدولية ونظم المعلومات، ودرس العقيدة على وليد بسيوني والفقه على وليد إدريس، وانتقل إلى كندا سنة 2001 فألقى المحاضرات وخطب الجمعة في مساجد منطقة تورونتو الكبرى."
  en: "The Listen Notes listing of Muslim Central's Riad Ouarzazi podcast (some 792 episodes since 2012); its biography records that he was born in Casablanca, took Islamic education degrees from M. Abdullah University, moved to the United States in 1988 and read international management and computer information systems, studied Aqeedah under Waleed Basyouni and Fiqh under Waleed Idrees, and moved to Canada in 2001, lecturing and giving Friday sermons in the mosques of the Greater Toronto Area."
