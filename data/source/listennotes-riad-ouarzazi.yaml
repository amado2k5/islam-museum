summary:
  ar: "قائمة Listen Notes لبودكاست مسلم سنترال الخاص برياض الورزازي ⁦(نحو 792 حلقة منذ 2012)⁩؛ تذكر سيرته أنه وُلد في الدار البيضاء، ونال شهادات في التعليم الإسلامي من جامعة عبد الله، وانتقل إلى الولايات المتحدة سنة 1988 فدرس الإدارة الدولية ونظم المعلومات، ودرس العقيدة على وليد بسيوني والفقه على وليد إدريس، وانتقل إلى كندا سنة 2001 فألقى المحاضرات وخطب الجمعة في مساجد منطقة تورونتو الكبرى."
  en: "The Listen Notes listing of Muslim Central's Riad Ouarzazi podcast (some 792 episodes since 2012); its biography records that he was born in Casablanca, took Islamic education degrees from M. Abdullah University, moved to the United States in 1988 and read international management and computer information systems, studied Aqeedah under Waleed Basyouni and Fiqh under Waleed Idrees, and moved to Canada in 2001, lecturing and giving Friday sermons in the mosques of the Greater Toronto Area."
  es: "La lista de Listen Notes del podcast de Riad Ouarzazi de Muslim Central (unos 792 episodios desde 2012); su biografía registra que nació en Casablanca, obtuvo títulos en educación islámica de la Universidad M. Abdullah, se mudó a los Estados Unidos en 1988 y estudió administración internacional y sistemas de información informática, estudió Aqeedah con Waleed Basyouni y Fiqh con Waleed Idrees, y se mudó a Canadá en 2001, donde impartió conferencias y pronunció sermones de los viernes en las mezquitas del área metropolitana de Toronto."
  fr: "La liste des podcasts de Muslim Central consacrés à Riad Ouarzazi (environ 792 épisodes depuis 2012); sa biographie indique qu'il est né à Casablanca, a obtenu des diplômes en éducation islamique à l'Université M. Abdullah, a déménagé aux États-Unis en 1988 et a étudié la gestion internationale et les systèmes d'information informatique, a étudié l'Aqeedah sous la direction de Waleed Basyouni et le Fiqh sous celle de Waleed Idrees, et a déménagé au Canada en 2001, donnant des conférences et prononçant les sermons du vendredi dans les mosquées de la région du Grand Toronto."
  ur: "مسلم سنٹرل کے ریاض اوارزازی پوڈ کاسٹ کی لسٹنگ نوٹس ⁦(2012 کے بعد سے کچھ 792 اقساط)⁩؛ اس کی سوانح عمری ریکارڈ کرتی ہے کہ وہ کاسابلانکا میں پیدا ہوا، ایم عبداللہ یونیورسٹی سے اسلامی تعلیم کی ڈگریاں لی، 1988 میں امریکہ چلا گیا اور بین الاقوامی مینجمنٹ اور کمپیوٹر انفارمیشن سسٹم پڑھا، ولید بسیونی کے تحت عقیدہ اور ولید ادریس کے تحت فقہ کی تعلیم حاصل کی، اور 2001 میں کینیڈا چلا گیا، جامع مسجد میں خطبہ دیا اور خطبہ دیا۔"
  tr: "Riyad Al-Warzazi'nin yer aldığı Muslim Central podcast'i için dinle notlar listesi (2012'den bu yana yaklaşık 792 bölüm); biyografisinde Kazablanka'da doğduğu, Abdullah Üniversitesi'nden İslami eğitim alanında diploma aldığı, 1988'de Amerika Birleşik Devletleri'ne taşındığı, burada uluslararası yönetim ve bilgi sistemleri okudu, Walid Bassiouni'den mezhep ve Walid Idris'in yanında fıkıh eğitimi aldığı ve 2001'de Kanada'ya taşınıp Toronto bölgesindeki camilerde konferanslar ve Cuma vaazları verdiği belirtiliyor."
  id: "Daftar Catatan untuk podcast Muslim Central yang menampilkan Riyad Al-Warzazi (sekitar 792 episode sejak 2012); biografinya menyebutkan bahwa ia lahir di Casablanca, meraih gelar pendidikan Islam dari Universitas Abdullah, pindah ke Amerika Serikat pada tahun 1988, di mana ia belajar manajemen internasional dan sistem informasi, mempelajari ajaran di bawah Walid Bassiouni dan hukum di bawah Walid Idris, lalu pindah ke Kanada pada tahun 2001 di mana ia memberikan kuliah dan khotbah Jumat di masjid-masjid di wilayah Toronto yang lebih luas."
