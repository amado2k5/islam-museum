summary:
  ar: "كتاب الشيخ محمد متولي الشعراوي ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، في الإسراء والمعراج: آية الإسراء، ومعجزة الإسراء والمعراج، والفرق بين الرؤيا والإراءة، وما رآه النبي في المعراج، وفرض الصلاة؛ 114 صفحة، إشراف الأمين العام للمجمع. مادته تأملات ألقيت على هيئة أسئلة وأجوبة."
  en: "Muhammad Mutawalli al-Sha'rawi's book in the Scientific Series of the Islamic Research Academy of al-Azhar, on the Isra and Mi'raj: the Qur'anic account of the night journey, the question of body and waking, what was seen during the ascent, and the ordaining of prayer; 114 pages, supervised by the Academy's Secretary-General. Its text is reflections in question-and-answer form."
