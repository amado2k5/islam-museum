label:
  ar: "الإسراء والمعراج — محمد متولي الشعراوي"
  en: "The Isra and Mi'raj — Muhammad Mutawalli al-Sha'rawi"
summary:
  ar: "كتاب الشيخ محمد متولي الشعراوي ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، في الإسراء والمعراج: آية الإسراء، ومعجزة الإسراء والمعراج، والفرق بين الرؤيا والإراءة، وما رآه النبي في المعراج، وفرض الصلاة؛ 114 صفحة، إشراف الأمين العام للمجمع. مادته تأملات ألقيت على هيئة أسئلة وأجوبة."
  en: "Muhammad Mutawalli al-Sha'rawi's book in the Scientific Series of the Islamic Research Academy of al-Azhar, on the Isra and Mi'raj: the Qur'anic account of the night journey, the question of body and waking, what was seen during the ascent, and the ordaining of prayer; 114 pages, supervised by the Academy's Secretary-General. Its text is reflections in question-and-answer form."
  es: "El libro de Muhammad Mutawalli al-Sha'rawi, perteneciente a la Serie Científica de la Academia Islámica de Investigación de Al-Azhar, trata sobre el Isra y el Mi'raj: el relato coránico del viaje nocturno, la cuestión del cuerpo y la vigilia, lo que se vio durante el ascenso y la ordenación de la oración. Consta de 114 páginas y fue supervisado por el Secretario General de la Academia. Su texto se presenta en forma de reflexiones en preguntas y respuestas."
  fr: "L'ouvrage de Muhammad Mutawalli al-Sha'rawi, publié dans la collection scientifique de l'Académie de recherche islamique d'al-Azhar, traite de l'Isra et du Mi'raj: le récit coranique du voyage nocturne, la question du corps et de l'éveil, les visions lors de l'ascension et l'institution de la prière. Ce livre de 114 pages, supervisé par le secrétaire général de l'Académie, présente des réflexions sous forme de questions-réponses."
  ur: "اسلامک ریسرچ اکیڈمی الازہر کی سائنسی سیریز میں محمد متولی الشعراوی کی کتاب اسراء اور معراج پر: رات کے سفر کا قرآنی بیان، جسم اور جاگنے کا سوال، چڑھائی کے دوران کیا دیکھا گیا، اور نماز کا حکم؛ اکیڈمی کے سیکرٹری جنرل کی زیر نگرانی 114 صفحات۔ اس کا متن سوال و جواب کی شکل میں عکاسی کرتا ہے۔"
title: الإسراء والمعراج
