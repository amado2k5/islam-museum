summary:
  ar: "مقالة ويكيبيديا الفرنسية عن باي بوريه، المولود في 15 فبراير 1840 بكاسيه والمتوفى في 24 أغسطس 1908 بالمدينة نفسها، الزعيم السيراليوني والاستراتيجي العسكري والمرشد الديني المسلم الذي قاد ثورة التمني واللوكو ضد السلطة الاستعمارية البريطانية سنة 1898؛ تروي نشأته ابنًا لعالم لوكو من علماء الإسلام وأم تاجر تمنية، وتدريبه الحربي في گبندمبو ولقبه كبَالاي، وحروبه وحرب ضريبة الأكواخ واستسلامه ونفيه وعودته، بموازاة المقالة الإنجليزية في خطوطها العامة."
  en: "French Wikipedia article on Bai Bureh, born 15 February 1840 at Kasseh and died 24 August 1908 in the same town, the Sierra Leonean chief, military strategist and Muslim religious guide who led the Temne and Loko revolt against British colonial authority in 1898; it recounts his upbringing as son of a Loko ulama and a Temne trader mother, his martial training at Gbendembu and nickname Kebalai, his wars, the Hut Tax War, his surrender, exile and return, paralleling the English article in outline."
  es: "Artículo de la Wikipedia en francés sobre Bai Bureh, nacido el 15 de febrero de 1840 en Kasseh y fallecido el 24 de agosto de 1908 en la misma ciudad, jefe sierraleonés, estratega militar y guía religioso musulmán que lideró la revuelta de los Temne y los Loko contra la autoridad colonial británica en 1898; relata su infancia como hijo de un ulema Loko y una madre comerciante Temne, su entrenamiento marcial en Gbendembu y su apodo Kebalai, sus guerras, la Guerra del Impuesto sobre las Cabañas, su rendición, exilio y regreso, con un esquema similar al del artículo en inglés."
  fr: "L'article de Wikipédia en français sur Bai Bureh, né le 15 février 1840 à Kasseh et mort le 24 août 1908 dans la même ville, chef sierra-léonais, stratège militaire et guide religieux musulman qui a mené la révolte des Temne et des Loko contre l'autorité coloniale britannique en 1898, relate son enfance en tant que fils d'un ouléma Loko et d'une mère commerçante Temne, sa formation martiale à Gbendembu et son surnom Kebalai, ses guerres, la guerre de la taxe sur les huttes, sa reddition, son exil et son retour, suivant un parallèle avec l'article anglais dans ses grandes lignes."
