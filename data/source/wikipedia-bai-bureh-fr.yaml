summary:
  ar: "مقالة ويكيبيديا الفرنسية عن باي بوريه، المولود في 15 فبراير 1840 بكاسيه والمتوفى في 24 أغسطس 1908 بالمدينة نفسها، الزعيم السيراليوني والاستراتيجي العسكري والمرشد الديني المسلم الذي قاد ثورة التمني واللوكو ضد السلطة الاستعمارية البريطانية سنة 1898؛ تروي نشأته ابنًا لعالم لوكو من علماء الإسلام وأم تاجر تمنية، وتدريبه الحربي في گبندمبو ولقبه كبَالاي، وحروبه وحرب ضريبة الأكواخ واستسلامه ونفيه وعودته، بموازاة المقالة الإنجليزية في خطوطها العامة."
  en: "French Wikipedia article on Bai Bureh, born 15 February 1840 at Kasseh and died 24 August 1908 in the same town, the Sierra Leonean chief, military strategist and Muslim religious guide who led the Temne and Loko revolt against British colonial authority in 1898; it recounts his upbringing as son of a Loko ulama and a Temne trader mother, his martial training at Gbendembu and nickname Kebalai, his wars, the Hut Tax War, his surrender, exile and return, paralleling the English article in outline."
