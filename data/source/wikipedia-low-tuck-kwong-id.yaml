  ar: "مقالة ويكيبيديا الإندونيسية عن لو تاك كوانغ، المولود في سنغافورة في 17 نيسان 1948؛ تذكر انتقاله إلى إندونيسيا سنة 1972 وتأسيسه شركة جايا سومبيليس سنة 1973 وحصوله على الجنسية الإندونيسية سنة 1992 وشراءه أول منجم فحم سنة 1997."
  en: "Indonesian Wikipedia article on Low Tuck Kwong, born in Singapore on 17 April 1948; it records his 1972 move to Indonesia, his founding of PT Jaya Sumpiles Indonesia in 1973, his Indonesian citizenship in 1992, and his first coal-mine purchase in 1997."
  es: "Artículo de la Wikipedia en indonesio sobre Low Tuck Kwong, nacido en Singapur el 17 de abril de 1948; en él se recoge su traslado a Indonesia en 1972, la fundación de PT Jaya Sumpiles Indonesia en 1973, su ciudadanía indonesia en 1992 y la compra de su primera mina de carbón en 1997."
  fr: "L'article de Wikipédia indonésien sur Low Tuck Kwong, né à Singapour le 17 avril 1948, relate son installation en Indonésie en 1972, la création de PT Jaya Sumpiles Indonesia en 1973, sa citoyenneté indonésienne en 1992 et l'acquisition de sa première mine de charbon en 1997."
  ur: "17 اپریل 1948 کو سنگاپور میں پیدا ہونے والے لو ٹک کوانگ پر انڈونیشیائی ویکیپیڈیا کا مضمون؛ اس میں ان کی 1972 میں انڈونیشیا منتقلی، 1973 میں پی ٹی جیا سمپلس انڈونیشیا کی بنیاد، 1992 میں ان کی انڈونیشیائی شہریت، اور 1997 میں ان کی پہلی کوئلے کی کان کی خریداری ریکارڈ کی گئی ہے۔"
