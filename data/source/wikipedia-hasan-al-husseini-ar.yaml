reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Fetched by its recorded revision (revid 76706777) via the MediaWiki API, the returned revid asserted equal, and read in full on 26 October 2026. The article gives him as a Bahraini scholar, born in Mecca on Monday 27 Sha'ban 1396 AH (23 August 1976), son of the reciter and hadith scholar Muhammad Sa'id Faqir al-Harawi al-Husseini, of Afghan origin and resident at Muharraq; educated at the Azhari religious institute in Bahrain, with a bachelor's degree in Sharia from Imam Muhammad ibn Saud Islamic University (its Emirates branch), a master's in Islamic history and thought and a doctorate in hadith; brother of the former Bahraini MP Muhammad Rafiq al-Husseini. Its text calls him a scholar of Ahl al-Sunna wa'l-Jama'a, Shafi'i in madhhab, and its infobox gives the same creed and madhhab; the biography is sourced in part to his profile in the Midad scholar directory and to his official website's CV. Its categories file him under Bahraini Sunni scholars, which are category filings."
