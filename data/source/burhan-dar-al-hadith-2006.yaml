  en: "al-Burhan fi Ulum al-Qur'an — Badr al-Din al-Zarkashi, ed. Abu al-Fadl al-Dimyati Ahmad ibn Ali (Dar al-Hadith, Cairo, 2006)"
  ur: "البرہان فی علوم القرآن — بدر الدین زرکشی، تحقیق ابو الفضل دمیاطی احمد بن علی (دار الحدیث، قاہرہ، 2006ء)"
summary:
  ar: "طبعة دار الحديث بالقاهرة للبرهان في مجلد واحد ⁦(1232 صفحة)⁩، حققها أبو الفضل الدمياطي ⁦(أحمد بن علي)⁩ على أصل خطي كامل من مصورات معهد المخطوطات بجامعة الدول العربية رمز له بـ⁦(م)⁩، مع زيادات من طبعة دار التراث بتحقيق محمد أبي الفضل إبراهيم رمز لها بـ⁦(ف)⁩؛ وفيها مقدمة للمحقق وترجمة للمؤلف وتقديمان لمحمد رزق ساطور وعلي علي لقم."
  en: "Dar al-Hadith's (Cairo) one-volume edition of al-Burhan (1,232 pages), edited by Abu al-Fadl al-Dimyati (Ahmad ibn Ali) on a complete manuscript from the microfilms of the Arab League manuscripts institute, siglum (m), with additions from Muhammad Abu al-Fadl Ibrahim's Dar al-Turath edition, siglum (f); with the editor's introduction, a biography of the author and forewords by Muhammad Rizq Satur and Ali Ali Luqm."
  ur: "دار الحدیث قاہرہ کا البرہان کا ایک جلد (1232 صفحات) والا ایڈیشن، جس کی تحقیق ابو الفضل دمیاطی (احمد بن علی) نے عرب لیگ کے ادارۂ مخطوطات کی تصاویر میں سے ایک مکمل قلمی نسخے پر کی، رمز (م)، اور محمد ابو الفضل ابراہیم کے دار التراث ایڈیشن سے اضافے لیے، رمز (ف)؛ اس میں محقق کا مقدمہ، مصنف کے سوانح اور محمد رزق ساطور اور علی علی لقم کے دو پیش لفظ ہیں۔"
