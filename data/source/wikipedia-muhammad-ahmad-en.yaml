reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth on Labab Island, Dongola, his studies under al-Amin al-Suwaylih and Muhammad al-Dikayr, his discipleship under the Sammaniyya sheikh Muhammad Sharif Nur al-Da'im from 1861 (seven years, licensed as a sheikh), the split of 1878 and his move to Sheikh al-Qurashi wad al-Zayn, the proclamation of the Mahdiyya on 29 June 1881 and the doctrine of the prophetic assembly (hadra), the rejection of his claim by government-aligned ulama, the victories at El Obeid and Shaykan, the siege and fall of Khartoum (26 January 1885), and his death from typhus. The article's lead dates his birth 12 August 1843 and his death 21 June 1885, while its own body gives his death as 22 June 1885 and Wikidata gives 1844 for the birth year — the conflicts are recorded in the person record, which follows 12 August 1844 and 22 June 1885. It nowhere labels him with a madhhab; his attested affiliation is the Sammaniyya Sufi order. Read in full on 24 October 2026."
