reliability_note: "His employing university's own faculty profile: a primary source for his degrees, post and publications. It gives the bachelor's in Islamic Sharia from Baghdad (1988), the master's in the Prophetic Hadith and its sciences (21 July 1993; thesis on al-Sakhawi's method in Fath al-Mughith) and the doctorate in the same field (1995; thesis an edition and study of al-Khatib al-Baghdadi's al-Fasl lil-Wasl al-Mudraj fi al-Naql), and lists among his books Jawanib Hadariyya fi al-Sunna al-Nabawiyya (Dubai International Holy Quran Award, 2013) and his edition of Ibn Hajar's Nuzhat al-Nazar (1999). The university's English CV adds his associate professorship at Sharjah (2005–2016) and his chairmanship at the College of Sharia and Law in Muscat (2000–2005). Checked 25 October 2026."
