summary:
  ar: "صفحة عبد السميع الأنيس في موقع جامعة الشارقة ⁦(كلية الشريعة والدراسات الإسلامية، قسم أصول الدين)⁩؛ تذكر شهاداته من جامعة بغداد ⁦(بكالوريوس الشريعة 1988، ماجستير الحديث 1993، دكتوراه الحديث 1995)⁩ ومنشوره المختار."
  en: "Abdul Samie Al-Anis's faculty profile on the University of Sharjah website (College of Sharia and Islamic Studies, Department of Usul al-Din); it lists his University of Baghdad degrees (bachelor's in Sharia 1988, master's in Hadith 1993, doctorate in Hadith 1995) and selected publications."
  es: "El perfil docente de Abdul Samie Al-Anis se encuentra en el sitio web de la Universidad de Sharjah (Facultad de Sharia y Estudios Islámicos, Departamento de Usul al-Din); en él se enumeran sus títulos obtenidos en la Universidad de Bagdad (licenciatura en Sharia, 1988; maestría en Hadith, 1993; doctorado en Hadith, 1995) y algunas de sus publicaciones."
  fr: "Le profil d'Abdul Samie Al-Anis sur le site web de l'Université de Sharjah (Collège de la charia et des études islamiques, Département d'Usul al-Din); il répertorie ses diplômes de l'Université de Bagdad (licence en charia 1988, maîtrise en hadith 1993, doctorat en hadith 1995) et une sélection de ses publications."
  ur: "شارجہ یونیورسٹی کی ویب سائٹ پر عبدالسمیع الانیس کی فیکلٹی پروفائل ⁦(کالج آف شریعہ اینڈ اسلامک اسٹڈیز، شعبہ اصول الدین)⁩؛ اس میں ان کی جامعہ بغداد کی ڈگریوں ⁦(شریعہ میں بیچلر 1988، حدیث میں ماسٹرز 1993، حدیث میں ڈاکٹریٹ 1995)⁩ اور منتخب اشاعتوں کی فہرست دی گئی ہے۔"
  tr: "Abdul Samee Al-Anis'in Şaria Üniversitesi web sitesindeki sayfasında (Şeriat ve İslami Araştırmalar Fakültesi, Din Temelleri Bölümü); Bağdat Üniversitesi'nden (Şeriat Lisansı 1988, Hadis Yüksek Lisansı 1993, Hadis Doktorası 1995) ve seçilmiş yayınlarından bahsedilmektedir."
  id: "Halaman Abdul Samee Al-Anis di situs web Universitas Sharjah (Fakultas Syariah dan Studi Islam, Departemen Dasar-dasar Agama); menyebutkan gelarnya dari Universitas Baghdad (Sarjana Syariah 1988, Magister Hadis 1993, PhD Hadis 1995) dan publikasi pilihannya."
