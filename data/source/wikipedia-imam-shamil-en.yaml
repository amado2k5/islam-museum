summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الإمام شامل؛ تُستخدم لوقائع الكيان فقط، ويُستشهد بكل واقعة بالمصدر الذي تذكره المقالة. يصف صندوق معلوماتها دينه بأنه الإسلام السني ⁦(أشعري، شافعي، نقشبندي)⁩ وتصفه مقدمتها بأنه شيخ الطريقة النقشبدية الصوفية."
  en: "English Wikipedia article on Imam Shamil; used for entity facts only, each cited where the article gives its own source. Its infobox gives his religion as Sunni Islam (Ash'ari, Shafi'i, Naqshbandi) and its lead calls him a sheikh of the Naqshbandi Sufi order."
  es: "Artículo de Wikipedia en inglés sobre el imán Shamil; se utiliza únicamente para obtener información sobre la persona, citando cada fuente donde el artículo la proporciona. Su ficha informativa indica que su religión es el islam sunita (Ash'ari, Shafi'i, Naqshbandi) y su introducción lo describe como un jeque de la orden sufí Naqshbandi."
  fr: "L'article de Wikipédia en anglais sur l'imam Shamil est utilisé uniquement pour les informations le concernant, chaque source étant citée dans l'article. Son infobox indique qu'il est de confession sunnite (ash'arite, chaféite, naqshbandi) et son introduction le présente comme un cheikh de l'ordre soufi naqshbandi."
  ur: "امام شامل پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک کا حوالہ دیا جاتا ہے جہاں مضمون اپنا ماخذ دیتا ہے۔ اس کا معلوماتی خانہ اس کا مذہب بطور سنی اسلام ⁦(اشاعری، شافعی، نقشبندی)⁩ دیتا ہے اور اس کا لیڈ اسے نقشبندی صوفی حکم کا شیخ کہتا ہے۔"
  tr: "İmam Şamil hakkında İngilizce Wikipedia makalesi yalnızca varlığın olayları için kullanılmakta ve her olayda makalede belirtilen kaynak gösterilmektedir. Bilgi kutusunda dini Sünni İslam (Aş'ari, Şafii, Nakşibendi) olarak tanımlanır ve girişinde Nakşibi Sufi tarikatının şeyhi olarak tanımlanır."
  id: "Artikel Wikipedia bahasa Inggris tentang Imam Shamil hanya digunakan untuk peristiwa entitas tersebut, dan setiap insiden mengutip sumber yang dikutip dalam artikel tersebut. Infobox tersebut menggambarkan agamanya sebagai Islam Sunni (Ash'ari, Shafi'i, Naqshbandi), dan pendahuluannya menggambarkannya sebagai sheikh dari tarekat Sufi Naqshbid."
