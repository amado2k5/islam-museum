reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth at Gimry on 26 June 1797, his birth name Ali and renaming to Shamuyil/Shamil, his discipleship under Ghazi Muhammad, his escape from the battle of Gimry in 1832, his succession as third Imam in 1834, the siege of Akhoulgo and the hostage Jamaldin in 1839, the destruction of Vorontsov's column in 1845, the Hadji Murad episode, his surrender in September 1859, exile at Kaluga and Kyiv, the Hajj of 1869-70, and his death at Medina in 1871 and burial in Jannat al-Baqi. The infobox's Ash'ari/Shafi'i/Naqshbandi parenthesis is a single-source attestation for the madhhab and is treated as such in the person record. Read in full on 24 October 2026."
