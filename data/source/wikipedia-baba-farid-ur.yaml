summary:
  ar: "مقالة ويكيبيديا الأردية عن بابا فرید الدین گنج شکر؛ تروي مولده سنة 1173 ووفاته في 5 محرم 664 هـ ⁦(1265 م)⁩ عن 92 عامًا، وبعض تحويلاتها الهجرية غير متسقة؛ تُستخدم لوقائع الكيان فقط مع هذا التنبيه."
  en: "Urdu Wikipedia article on Baba Fariduddin Ganjshakar; it gives his birth in 1173 and his death on 5 Muharram 664 AH (1265 CE) at the age of 92, though some of its Hijri conversions are inconsistent; used for entity facts only, with that caution."
  es: "Artículo de Wikipedia en urdu sobre Baba Fariduddin Ganjshakar; indica que nació en 1173 y murió el 5 de Muharram del año 664 AH (1265 d. C.) a la edad de 92 años, aunque algunas de sus conversiones al calendario islámico son inconsistentes; se utiliza solo para datos sobre la entidad, con esa precaución."
  fr: "Article de Wikipédia en ourdou sur Baba Fariduddin Ganjshakar; il indique sa naissance en 1173 et sa mort le 5 Muharram 664 AH (1265 CE) à l'âge de 92 ans, bien que certaines de ses conversions hijri soient incohérentes; utilisé uniquement pour les faits concernant l'entité, avec cette mise en garde."
  ur: "بابا فرید الدین گنج شکر پر اردو ویکیپیڈیا مضمون؛ اس کی پیدائش 1173 میں ہوئی اور اس کی وفات 5 محرم 664 ہجری ⁦(1265 عیسوی)⁩ کو 92 سال کی عمر میں ہوئی، حالانکہ اس کے کچھ ہجری تبدیلیاں متضاد ہیں۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، اس احتیاط کے ساتھ۔"
  tr: "Baba Farid al-Din Ganj Şakar hakkında Urduca Vikipedi makalesi, onun 1173'teki doğumunu ve 5 Muharrem 664 Hicri (1265 M.S.) 92 yaşında öldüğünü anlatır ve bazı Hicri dönüşümleri tutarsızdır; bu notla yalnızca varlığın gerçekleri için kullanılır."
  id: "Artikel Wikipedia Urdu tentang Baba Farid al-Din Ganj Shakar menceritakan kelahirannya pada tahun 1173 dan kematiannya pada 5 Muharram 664 H (1265 M) pada usia 92 tahun, dan beberapa konversi Hijriyahnya tidak konsisten; artikel ini hanya digunakan untuk fakta entitas yang memiliki catatan ini."
