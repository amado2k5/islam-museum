summary:
  ar: "مقالة ويكيبيديا الأردية «فضل حق خیر آبادی»؛ تُستخدم لوقائع الكيان فقط. تضعه في صدرها بين علماء أهل السنة، ويعطي صندوق معلوماتها فقهه حنفيًا وفرقته سنيًا، وتروي خطبته في جامع مسجد دلهي وفتوى الجهاد الموقعة من كبار علماء زمانه، ومحاكمته وإقراره بالفتوى، وحبسه في كالا باني."
  en: "Urdu Wikipedia article 'Fazl-e-Haq Khairabadi'; used for entity facts only. Its lead places him among the scholars of Ahl al-Sunnah, and its infobox gives his fiqh as Hanafi and his denomination as Sunni; it recounts his sermon at Delhi's Jama Masjid, the jihad fatwa signed by leading scholars of the day, his trial and his admission of the fatwa, and his imprisonment at Kala Pani."
  es: "Artículo de Wikipedia en urdu titulado «Fazl-e-Haq Khairabadi»; utilizado únicamente para datos sobre la persona. Su introducción lo sitúa entre los eruditos de Ahl al-Sunnah, y su ficha informativa indica que su fiqh era Hanafi y su denominación Sunni; relata su sermón en la Jama Masjid de Delhi, la fatwa de la yihad firmada por destacados eruditos de la época, su juicio y su admisión de la fatwa, y su encarcelamiento en Kala Pani."
  fr: "L'article de Wikipédia en ourdou intitulé « Fazl-e-Haq Khairabadi » est utilisé uniquement à des fins d'information sur l'entité. Son introduction le situe parmi les savants d'Ahl al-Sunnah, et son infobox indique qu'il est de tradition hanafite et sunnite; elle relate son sermon à la Jama Masjid de Delhi, la fatwa du jihad signée par les plus éminents savants de l'époque, son procès et sa reconnaissance de la fatwa, ainsi que son emprisonnement à Kala Pani."
