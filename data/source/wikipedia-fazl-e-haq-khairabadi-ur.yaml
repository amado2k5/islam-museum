summary:
  ar: "مقالة ويكيبيديا الأردية «فضل حق خیر آبادی»؛ تُستخدم لوقائع الكيان فقط. تضعه في صدرها بين علماء أهل السنة، ويعطي صندوق معلوماتها فقهه حنفيًا وفرقته سنيًا، وتروي خطبته في جامع مسجد دلهي وفتوى الجهاد الموقعة من كبار علماء زمانه، ومحاكمته وإقراره بالفتوى، وحبسه في كالا باني."
  en: "Urdu Wikipedia article 'Fazl-e-Haq Khairabadi'; used for entity facts only. Its lead places him among the scholars of Ahl al-Sunnah, and its infobox gives his fiqh as Hanafi and his denomination as Sunni; it recounts his sermon at Delhi's Jama Masjid, the jihad fatwa signed by leading scholars of the day, his trial and his admission of the fatwa, and his imprisonment at Kala Pani."
