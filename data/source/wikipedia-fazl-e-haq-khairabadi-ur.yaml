reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. It gives his birth in 1797 at Khairabad and, in its infobox, his fiqh as Hanafi and his denomination as Sunni, without references; its lead calls him one of the scholars of Ahl al-Sunnah. Its biographical detail rests largely on a single devotional website (ziaetaiba.com, now a dead link), including a claim that he was hanged on 12 February 1861 — a claim no other source read supports, against the English article's scholarly account (Asir Adrawi) of his death in prison in the Andamans in August 1861, with which the Arabic article and Wikidata agree on the month and year. Its category filings under 'Hanafis' and 'Maturidis' are filings, not attestations, and are not counted."
