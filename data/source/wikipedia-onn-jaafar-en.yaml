summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عون جعفر (1895–1962)، السياسي الملايوي مؤسس المنظمة الوطنية للملايويين المتحدين ⁦(أمنو)⁩ وأول رئيس لها؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 12 شباط 1895 في بوكيت غامبير بجوهر بهرو، ورئاسته وزراء جوهر (1947–1950)، وتأسيسه حزب استقلال الملايو ثم حزب الوطن، ووفاته في 19 كانون الثاني 1962 في جوهر بهرو؛ ولا ترد فيها ولا في صندوق معلوماتها أي إشارة إلى دينه أو مذهبه."
  en: "English Wikipedia article on Onn Jaafar (1895–1962), the Malayan politician who founded the United Malays National Organisation (UMNO) and was its first president; used for entity facts only. It gives his birth on 12 February 1895 at Bukit Gambir, Johor Bahru, his term as Menteri Besar of Johor (1947–1950), his founding of the Independence of Malaya Party and then Parti Negara, and his death on 19 January 1962 at Johor Bahru. Neither its text nor its infobox makes any statement of his religion or school."
  es: "Artículo de la Wikipedia en inglés sobre Onn Jaafar (1895-1962), el político malayo que fundó la Organización Nacional de los Malayos Unidos (UMNO) y fue su primer presidente; se utiliza únicamente para datos sobre la entidad. Indica su nacimiento el 12 de febrero de 1895 en Bukit Gambir, Johor Bahru, su mandato como Ministro Principal de Johor (1947-1950), la fundación del Partido de la Independencia de Malasia y posteriormente del Partido Nacional, y su fallecimiento el 19 de enero de 1962 en Johor Bahru. Ni el texto ni el recuadro informativo mencionan su religión ni su escuela política."
  fr: "L'article de Wikipédia en anglais sur Onn Jaafar (1895-1962), homme politique malais fondateur de l'Organisation nationale des Malais unis (UMNO) et son premier président, est utilisé uniquement à des fins d'information sur l'entité. Il indique sa naissance le 12 février 1895 à Bukit Gambir, Johor Bahru, son mandat de Menteri Besar de Johor (1947-1950), la fondation du Parti pour l'indépendance de la Malaisie (puis du Parti Negara) et son décès le 19 janvier 1962 à Johor Bahru. Ni le texte ni l'infobox ne mentionnent sa religion ou son école."
