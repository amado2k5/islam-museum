summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عون جعفر (1895–1962)، السياسي الملايوي مؤسس المنظمة الوطنية للملايويين المتحدين (أمنو) وأول رئيس لها؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 12 شباط 1895 في بوكيت غامبير بجوهر بهرو، ورئاسته وزراء جوهر (1947–1950)، وتأسيسه حزب استقلال الملايو ثم حزب الوطن، ووفاته في 19 كانون الثاني 1962 في جوهر بهرو؛ ولا ترد فيها ولا في صندوق معلوماتها أي إشارة إلى دينه أو مذهبه."
  en: "English Wikipedia article on Onn Jaafar (1895–1962), the Malayan politician who founded the United Malays National Organisation (UMNO) and was its first president; used for entity facts only. It gives his birth on 12 February 1895 at Bukit Gambir, Johor Bahru, his term as Menteri Besar of Johor (1947–1950), his founding of the Independence of Malaya Party and then Parti Negara, and his death on 19 January 1962 at Johor Bahru. Neither its text nor its infobox makes any statement of his religion or school."
