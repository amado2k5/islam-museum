  ar: "مقالة ويكيبيديا الأردية عن بندو خان؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته سنة 1880 في دلهي، وتعلّمه السارنغي على يد خاله ممّن خان ثم تتلمذه على الملنغ مياں أحمد شاه، وانتقاله بعد قيام باكستان إلى كراتشي ووفاته فيها في 13 يناير 1955، ومنحه تمغا الأداء سنة 1959 بحسب المقالة."
  en: "Urdu Wikipedia article on Bundu Khan; used for entity facts only. It gives him born in 1880 at Delhi, trained on the sarangi by his uncle Mamman Khan and then a disciple of the malang Mian Ahmad Shah, moved to Karachi after Partition and died there on 13 January 1955, and — per the article — awarded the Pride of Performance in 1959."
