reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. A short Urdu biography resting on the ITC Sangeet Research Academy tribute. Its statement that he became a disciple (shagird) of the malang Mian Ahmad Shah, who taught him his knowledge, is a statement of musical tutelage in a single text — it names no order, initiation or affiliation — and its Pride of Performance year (1959) conflicts with the English article's 1985; both splits are recorded in the record."
