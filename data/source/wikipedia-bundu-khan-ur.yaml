summary:
  ar: "مقالة ويكيبيديا الأردية عن بندو خان؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته سنة 1880 في دلهي، وتعلّمه السارنغي على يد خاله ممّن خان ثم تتلمذه على الملنغ مياں أحمد شاه، وانتقاله بعد قيام باكستان إلى كراتشي ووفاته فيها في 13 يناير 1955، ومنحه تمغا الأداء سنة 1959 بحسب المقالة."
  en: "Urdu Wikipedia article on Bundu Khan; used for entity facts only. It gives him born in 1880 at Delhi, trained on the sarangi by his uncle Mamman Khan and then a disciple of the malang Mian Ahmad Shah, moved to Karachi after Partition and died there on 13 January 1955, and — per the article — awarded the Pride of Performance in 1959."
  es: "Artículo de Wikipedia en urdu sobre Bundu Khan; utilizado únicamente para datos sobre la persona. Indica que nació en 1880 en Delhi, que su tío Mamman Khan lo formó en el sarangi y que luego fue discípulo del malang Mian Ahmad Shah. Tras la Partición, se trasladó a Karachi, donde falleció el 13 de enero de 1955, y —según el artículo— recibió el premio Pride of Performance en 1959."
  fr: "Article de Wikipédia en ourdou sur Bundu Khan; utilisé uniquement pour les informations le concernant. Il indique qu’il est né en 1880 à Delhi, a été formé au sarangi par son oncle Mamman Khan puis disciple du malang Mian Ahmad Shah, s’est installé à Karachi après la Partition et y est décédé le 13 janvier 1955, et – selon l’article – a reçu la Pride of Performance en 1959."
  ur: "بندو خان پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس سے وہ 1880 میں دہلی میں پیدا ہوئے، سارنگی پر ان کے چچا ممن خان نے تربیت حاصل کی اور پھر ملنگ میاں احمد شاہ کے شاگرد، تقسیم کے بعد کراچی چلے گئے اور 13 جنوری 1955 کو وہیں انتقال کر گئے، اور مضمون کے مطابق - 1959 میں پرائیڈ آف پرفارمنس سے نوازا گیا۔"
  tr: "Pandu Khan hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1880 yılında Delhi'de doğduğu, amcası Muman Khan'dan sarangi öğrendiği, ardından Malang Mian Ahmad Shah'ın yanında eğitim aldığı, Pakistan'ın kurulmasından sonra Karaçi'ye taşındığı, 13 Ocak 1955'te orada öldüğü ve 1959'da Performans Madalyası ile ödüllendirildiği belirtilmektedir, makaleye göre."
  id: "Artikel Wikipedia Urdu tentang Pandu Khan; digunakan hanya untuk fakta entitas tersebut. Ia disebutkan lahir pada tahun 1880 di Delhi, belajar sarangi dari pamannya Muman Khan, kemudian belajar di bawah Malang Mian Ahmad Shah, pindah ke Karachi setelah pembentukan Pakistan, meninggal di sana pada 13 Januari 1955, dan dianugerahi Performance Medal pada tahun 1959, menurut artikel tersebut."
