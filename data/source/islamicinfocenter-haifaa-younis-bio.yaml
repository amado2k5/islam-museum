reliability_note: "A published profile carrying the text of her standard biography, which other profiles repeat verbatim — one source family. It states that she is an American board-certified obstetrician-gynaecologist of Iraqi roots, that she graduated from the Mecca Institute of Islamic Studies and Al-Huda Qur'an Memorization School in Jeddah and memorised the Qur'an, that she founded Jannah Institute in Irvine, California in 2013 and chairs it, that she is a resident scholar at the Islamic Center of Irvine teaching Qur'an, tafsir and tazkiyah, and that she is profiled in The Muslim 500. It publishes no birth date and names no school of law or creed for her. Checked 26 October 2026."
