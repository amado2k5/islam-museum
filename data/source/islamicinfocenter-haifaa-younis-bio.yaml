  ar: "سيرة منشورة لهيفاء يونس في موقع مركز المعلومات الإسلامي؛ تعطي اعتمادها الطبي في طب النساء والتوليد وأصولها العراقية وتخرجها في مؤسستين بجدة وتأسيسها معهد جنة سنة 2013 وإقامتها العلمية في المركز الإسلامي في إيرفاين، ولا تنشر تاريخ ميلاد ولا تسمي مذهبا."
  en: "A published biography of Haifaa Younis on the Islamic Info Center site; it gives her board certification in obstetrics and gynaecology, her Iraqi roots, her graduation from two Jeddah institutions, her founding of Jannah Institute in 2013 and her resident scholarship at the Islamic Center of Irvine, and publishes no birth date and names no school."
