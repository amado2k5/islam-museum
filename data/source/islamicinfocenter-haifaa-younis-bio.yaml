summary:
  ar: "سيرة منشورة لهيفاء يونس في موقع مركز المعلومات الإسلامي؛ تعطي اعتمادها الطبي في طب النساء والتوليد وأصولها العراقية وتخرجها في مؤسستين بجدة وتأسيسها معهد جنة سنة 2013 وإقامتها العلمية في المركز الإسلامي في إيرفاين، ولا تنشر تاريخ ميلاد ولا تسمي مذهبا."
  en: "A published biography of Haifaa Younis on the Islamic Info Center site; it gives her board certification in obstetrics and gynaecology, her Iraqi roots, her graduation from two Jeddah institutions, her founding of Jannah Institute in 2013 and her resident scholarship at the Islamic Center of Irvine, and publishes no birth date and names no school."
  es: "En el sitio web del Centro de Información Islámica se publicó una biografía de Haifaa Younis; en ella se menciona su certificación profesional en obstetricia y ginecología, sus raíces iraquíes, su graduación de dos instituciones de Jeddah, la fundación del Instituto Jannah en 2013 y su beca de residencia en el Centro Islámico de Irvine, pero no se publica su fecha de nacimiento ni se menciona ninguna escuela."
  fr: "Une biographie de Haifaa Younis a été publiée sur le site du Centre d'information islamique; elle mentionne sa certification en obstétrique et gynécologie, ses origines irakiennes, ses diplômes de deux institutions de Djeddah, la fondation de l'Institut Jannah en 2013 et sa bourse de résidence au Centre islamique d'Irvine, mais ne mentionne ni sa date de naissance ni son école."
