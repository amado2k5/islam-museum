  ar: "مقالة ويكيبيديا الإنجليزية عن محمد عبد الله محمد (فرماجو)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في مقديشو في 11 مارس 1962، وتعليمه وعمله في الولايات المتحدة، ورئاسته وزراء الصومال (2010–2011) ثم رئاسته (2017–2022) خلفا لحسن شيخ محمود ومُخلفا به. لا يذكر النص دينه شخصيا ولا مدرسته."
  en: "English Wikipedia article on Mohamed Abdullahi Mohamed (Farmajo); used for entity facts only. It recounts his birth in Mogadishu on 11 March 1962, his education and work in the United States, his premiership of Somalia (2010–2011) and his presidency (2017–2022), succeeding Hassan Sheikh Mohamud and succeeded by him. The text does not discuss his own religion or school."
