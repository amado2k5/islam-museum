summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد عبد الله محمد ⁦(فرماجو)⁩؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في مقديشو في 11 مارس 1962، وتعليمه وعمله في الولايات المتحدة، ورئاسته وزراء الصومال (2010–2011) ثم رئاسته (2017–2022) خلفا لحسن شيخ محمود ومُخلفا به. لا يذكر النص دينه شخصيا ولا مدرسته."
  en: "English Wikipedia article on Mohamed Abdullahi Mohamed (Farmajo); used for entity facts only. It recounts his birth in Mogadishu on 11 March 1962, his education and work in the United States, his premiership of Somalia (2010–2011) and his presidency (2017–2022), succeeding Hassan Sheikh Mohamud and succeeded by him. The text does not discuss his own religion or school."
  es: "Artículo de la Wikipedia en inglés sobre Mohamed Abdullahi Mohamed (Farmajo); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Mogadiscio el 11 de marzo de 1962, su educación y trabajo en Estados Unidos, su mandato como primer ministro de Somalia (2010-2011) y su presidencia (2017-2022), sucediendo a Hassan Sheikh Mohamud y siendo sucedido por él. El texto no menciona su religión ni su escuela."
  fr: "Article de Wikipédia en anglais sur Mohamed Abdullahi Mohamed (Farmajo); utilisé uniquement à des fins d'information sur l'individu. Il relate sa naissance à Mogadiscio le 11 mars 1962, ses études et son travail aux États-Unis, son mandat de Premier ministre de Somalie (2010-2011) et sa présidence (2017-2022), succédant à Hassan Sheikh Mohamud et dont il fut le successeur. Le texte n'aborde ni sa religion ni son école."
  ur: "محمد عبداللہ محمد ⁦(فارمجو)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 11 مارچ 1962 کو موغادیشو میں ان کی پیدائش، ریاستہائے متحدہ میں ان کی تعلیم اور کام، صومالیہ کی ان کی وزارت عظمیٰ (2010–2011) اور ان کی صدارت (2017–2022)، حسن شیخ محمد کے بعد اور ان کے بعد ان کے جانشین ہونے کے بارے میں بتایا گیا ہے۔ متن میں اس کے اپنے مذہب یا مکتب پر بحث نہیں کی گئی ہے۔"
  tr: "Mohamed Abdullah Mohamed (Farmajo) hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılmıştır. Metin, 11 Mart 1962'de Mogadişu'daki doğumunu, Amerika Birleşik Devletleri'ndeki eğitimini ve çalışmalarını, Somali başbakanlığını (2010–2011) ve ardından Hassan Sheikh Mahmoud'un halefi olarak başkanlığını (2017–2022) anlatır. Metin, onun dini veya okulu hakkında kişisel olarak bahsedilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Mohamed Abdullah Mohamed (Farmajo); hanya digunakan sebagai fakta entitas. Artikel ini menceritakan kelahirannya di Mogadishu pada 11 Maret 1962, pendidikan dan pekerjaannya di Amerika Serikat, masa jabatannya sebagai perdana menteri Somalia (2010–2011), dan kemudian masa jabatannya (2017–2022) sebagai penerus Hassan Sheikh Mahmoud. Teks tersebut tidak menyebutkan agamanya secara pribadi maupun sekolahnya."
