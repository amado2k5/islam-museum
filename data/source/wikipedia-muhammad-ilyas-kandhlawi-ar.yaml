summary:
  ar: "مقالة ويكيبيديا العربية عن محمد إلياس الكاندهلوي (1885 – 13 تموز 1944)، العالم الهندي مؤسس جماعة التبليغ؛ تعطي مولده سنة 1303هـ (1885/1886م) في قرية كاندهلة، وتذكر حفظه القرآن على يد أبيه وتتلمذه على رشيد أحمد الكنكوهي ثم التحاقه بدار العلوم ديوبند سنة 1908، وإعداده في أوائل عشرينيات القرن العشرين نخبة من خريجي ديوبند وسهارانبور وإرسالهم إلى موات لتأسيس المساجد والمدارس، دون أن تسمي في متنها مذهباً."
  en: "The Arabic Wikipedia article on Muhammad Ilyas Kandhlawi (1885 – 13 July 1944), the Indian scholar who founded the Tablighi Jamaat; it gives his birth in 1303 AH (1885/1886) in the village of Kandhla, records his memorisation of the Qur'an under his father, his study under Rashid Ahmad Gangohi and his enrolment at Darul Uloom Deoband in 1908, and his early-1920s preparation of Deoband and Saharanpur graduates sent to Mewat to found mosques and schools, while naming no school in its prose."
