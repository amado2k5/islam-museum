summary:
  ar: "مقالة ويكيبيديا العربية عن محمد إلياس الكاندهلوي ⁦(1885 – 13 تموز 1944)⁩، العالم الهندي مؤسس جماعة التبليغ؛ تعطي مولده سنة 1303هـ ⁦(1885/1886م)⁩ في قرية كاندهلة، وتذكر حفظه القرآن على يد أبيه وتتلمذه على رشيد أحمد الكنكوهي ثم التحاقه بدار العلوم ديوبند سنة 1908، وإعداده في أوائل عشرينيات القرن العشرين نخبة من خريجي ديوبند وسهارانبور وإرسالهم إلى موات لتأسيس المساجد والمدارس، دون أن تسمي في متنها مذهباً."
  en: "The Arabic Wikipedia article on Muhammad Ilyas Kandhlawi (1885 – 13 July 1944), the Indian scholar who founded the Tablighi Jamaat; it gives his birth in 1303 AH (1885/1886) in the village of Kandhla, records his memorisation of the Qur'an under his father, his study under Rashid Ahmad Gangohi and his enrolment at Darul Uloom Deoband in 1908, and his early-1920s preparation of Deoband and Saharanpur graduates sent to Mewat to found mosques and schools, while naming no school in its prose."
  es: "El artículo de Wikipedia en árabe sobre Muhammad Ilyas Kandhlawi (1885 – 13 de julio de 1944), el erudito indio que fundó el Tablighi Jamaat, indica su nacimiento en 1303 AH (1885/1886) en el pueblo de Kandhla, registra su memorización del Corán con su padre, sus estudios con Rashid Ahmad Gangohi y su matriculación en Darul Uloom Deoband en 1908, y su preparación a principios de la década de 1920 de graduados de Deoband y Saharanpur enviados a Mewat para fundar mezquitas y escuelas, aunque no menciona ninguna escuela en su texto."
  fr: "L'article de Wikipédia en arabe sur Muhammad Ilyas Kandhlawi (1885 – 13 juillet 1944), l'érudit indien qui a fondé la Tablighi Jamaat; il indique sa naissance en 1303 AH (1885/1886) dans le village de Kandhla, relate sa mémorisation du Coran sous la direction de son père, ses études sous la direction de Rashid Ahmad Gangohi et son inscription à Darul Uloom Deoband en 1908, et sa préparation, au début des années 1920, des diplômés de Deoband et de Saharanpur envoyés à Mewat pour fonder des mosquées et des écoles, sans toutefois nommer d'école dans son texte."
  ur: "محمد الیاس کاندھلوی ⁦(1885 - 13 جولائی 1944)⁩ پر عربی ویکیپیڈیا مضمون، ہندوستانی اسکالر جنہوں نے تبلیغی جماعت کی بنیاد رکھی۔ اس کی پیدائش 1303 ہجری (1885/1886) میں کاندھلہ کے گاؤں میں ہوئی، اس نے اپنے والد کے تحت قرآن کا حفظ، رشید احمد گنگوہی کے تحت اس کا مطالعہ اور 1908 میں دارالعلوم دیوبند میں ان کا داخلہ ریکارڈ کیا، اور 1920 کی دہائی کے اوائل میں دیوبند اور میگراڈو کی مساجد کی تیاری کے دوران ناپوراٹیسنگ کے اسکولوں کو بھیجا۔ اس کے نثر میں کوئی اسکول نہیں۔"
  tr: "Hintli âlim ve Tabligh Grubu'nun kurucusu Muhammad Ilyas Al-Kandhlawi (1885 – 13 Temmuz 1944) hakkında Arapça Wikipedia makalesi, onun 1303 Hicri (1885/1886 MS) yılında Kandhla köyünde doğduğunu belirtir; babası tarafından Kur'an'ı ezberlediğini, Rashid Ahmad Al-Kankohi'nin yanında eğitim aldığını ve ardından 1908'de Darul Uloom Deoband'a kaydolduğunu belirtir. 1920'lerin başında, seçilmiş bir grup Deoband ve Saharanpur mezununu hazırladı ve onları Mawat'a cami ve okul kurmak üzere gönderdi, ancak içinde hiçbir mezhep belirtmedi."
  id: "Artikel Wikipedia berbahasa Arab tentang Muhammad Ilyas Al-Kandhlawi (1885 – 13 Juli 1944), seorang ulama India dan pendiri Kelompok Tabligh, menyatakan kelahirannya pada tahun 1303 H (1885/1886 M) di desa Kandhla, menyebutkan hafalan Al-Quran oleh ayahnya, bimbingan Rashid Ahmad Al-Kankohi, lalu pendaftarannya di Darul Uloom Deoband pada tahun 1908. Pada awal 1920-an, ia menyiapkan kelompok lulusan Deoband dan Saharanpur dan mengirim mereka ke Mawat untuk mendirikan masjid dan sekolah, tanpa menyebutkan sekte apapun di dalamnya."
