reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives him as the eldest son of Abdulaziz bin Muhammad, born at Diriyah in 1748 to a daughter of Uthman bin Mu'ammar of Uyaina, designated heir in 1787, ruler from 1803, and dead of a fever at Diriyah on 27 April 1814, succeeded by his eldest son Abdullah; it contrasts his interest in the material side of rule with his deeply religious father. It names no legal school for him. Checked 1 November 2026."
