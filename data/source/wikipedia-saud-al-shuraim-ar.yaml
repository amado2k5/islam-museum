summary:
  ar: "مقالة ويكيبيديا العربية عن سعود الشريم؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بالرياض سنة 1386 هـ / 19 يناير 1966، ومشايخه وفيهم صالح الفوزان في فقه البيوع بالمعهد العالي للقضاء، ومناصبه إماما وخطيبا وقاضيا وأستاذا، ومؤلفاته؛ وصندوقها يعطي الديانة الإسلام أهل السنة والجماعة وحقل الفقه فارغ، وتصنيفاتها تضعه في الحنابلة والسلفيين السعوديين."
  en: "Arabic Wikipedia article on Saud Al-Shuraim; used for entity facts only. It gives his birth at Riyadh in 1386 AH, 19 January 1966, lists his teachers — among them Salih al-Fawzan, under whom he studied the fiqh of sales at the Higher Judicial Institute — his posts as imam, khatib, judge and professor, and his works; its infobox gives his religion as Islam, Ahl al-Sunna wa-l-Jama'a, with the fiqh field left empty, and its categories file him among Hanbalis and Saudi Salafis."
