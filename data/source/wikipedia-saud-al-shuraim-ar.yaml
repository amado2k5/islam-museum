summary:
  ar: "مقالة ويكيبيديا العربية عن سعود الشريم؛ تُستخدم لوقائع الكيان فقط. تذكر مولده بالرياض سنة 1386 هـ / 19 يناير 1966، ومشايخه وفيهم صالح الفوزان في فقه البيوع بالمعهد العالي للقضاء، ومناصبه إماما وخطيبا وقاضيا وأستاذا، ومؤلفاته؛ وصندوقها يعطي الديانة الإسلام أهل السنة والجماعة وحقل الفقه فارغ، وتصنيفاتها تضعه في الحنابلة والسلفيين السعوديين."
  en: "Arabic Wikipedia article on Saud Al-Shuraim; used for entity facts only. It gives his birth at Riyadh in 1386 AH, 19 January 1966, lists his teachers — among them Salih al-Fawzan, under whom he studied the fiqh of sales at the Higher Judicial Institute — his posts as imam, khatib, judge and professor, and his works; its infobox gives his religion as Islam, Ahl al-Sunna wa-l-Jama'a, with the fiqh field left empty, and its categories file him among Hanbalis and Saudi Salafis."
  es: "Artículo de Wikipedia en árabe sobre Saud Al-Shuraim; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Riad el 19 de enero de 1966 (1386 AH), enumera a sus maestros —entre ellos Salih al-Fawzan, con quien estudió el fiqh de las ventas en el Instituto Judicial Superior—, sus cargos como imán, khatib, juez y profesor, y sus obras; su ficha informativa indica que su religión es el Islam, Ahl al-Sunna wa-l-Jama'a, con el campo de fiqh vacío, y sus categorías lo clasifican entre los hanbalíes y los salafistas saudíes."
  fr: "L'article de Wikipédia en arabe consacré à Saoud Al-Shuraim, utilisé uniquement pour les informations le concernant, indique sa naissance à Riyad en 1386 AH (19 janvier 1966), énumère ses maîtres – parmi lesquels Salih al-Fawzan, auprès duquel il étudia le fiqh (jurisprudence islamique) à l'Institut supérieur de la magistrature – ses fonctions d'imam, de khatib (chef religieux), de juge et de professeur, ainsi que ses œuvres. Son infobox précise qu'il est musulman, de confession sunnite (Ahl al-Sunna wa-l-Jama'a), le champ relatif au fiqh étant laissé vide, et ses catégories le classent parmi les hanbalites et les salafistes saoudiens."
  ur: "سعود الشریم پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1386ھ، 19 جنوری 1966 کو ریاض میں ان کی ولادت، ان کے اساتذہ کی فہرست دیتا ہے - ان میں صالح الفوزان، جن کے تحت اس نے ہائر جوڈیشل انسٹی ٹیوٹ میں فقہ کی تعلیم حاصل کی - امام، خطیب، جج اور پروفیسر کے طور پر ان کے عہدے، اور ان کے کام؛ اس کا معلوماتی خانہ اس کا مذہب اسلام، اہل السنۃ والجماعۃ دیتا ہے، فقہ کا میدان خالی رہ گیا ہے، اور اس کے زمرے اسے حنبلیوں اور سعودی سلفیوں میں درج کرتے ہیں۔"
  tr: "Suud el-Şuraim hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1386 Hicri / 19 Ocak 1966'da Riyad'da doğduğu ve Yüksek Yargı Enstitüsü'nde satış fıkıhında yer alan Salih Al-Fawzan dahil hocaları, imam, vaiz, yargıç ve profesör pozisyonları ve eserlerinden bahsedilir; kutusunda İslam Ahl-al-Sunnah wa al-Jama'ah'a verilir ve hukuk alanı boştur, sınıflandırmaları onu Hanbali ve Suudi Selefiler arasında yerleştirir."
  id: "Artikel Wikipedia Arab tentang Saud Al-Shuraim; hanya digunakan untuk fakta entitas. Artikel ini menyebutkan kelahirannya di Riyadh pada tahun 1386 AH / 19 Januari 1966, serta gurunya, termasuk Saleh Al-Fawzan dalam bidang hukum penjualan di Institut Tinggi Kehakiman, posisinya sebagai imam, pengkhotbah, hakim, dan profesor, serta karya-karyanya; dan kotaknya memberikan Islam kepada Ahl al-Sunnah wa al-Jama'ah, dan bidang hukum kosong, serta klasifikasinya menempatkannya di antara Hanbal dan Salafi Saudi."
