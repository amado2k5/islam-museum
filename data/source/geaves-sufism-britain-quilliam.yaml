  en: "Ron Geaves's scholarly paper on the history and development of Sufism in Britain, which reports that Quilliam 'defined himself as an Ottoman Hanafi with an allegiance to traditional Islam', that he considered the Wahhabi movement a rebellion against the legitimate Sunni Caliphate, and that there is no evidence he was a Sufi in the tariqa sense."
