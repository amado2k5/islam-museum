label:
  en: "Geaves — Quilliam's self-definition as an Ottoman Hanafi"
summary:
  ar: "ورقة رون غيفز الأكاديمية عن تاريخ التصوف في بريطانيا وتطوره، وفيها أن كويليام «عرّف نفسه بأنه حنفي عثماني» متمسكاً بالإسلام التقليدي، وأنه عدّ الوهابية تمرداً على الخلافة السنية المشروعة، وأنه لا دليل على انتمائه لطريقة صوفية."
  en: "Ron Geaves's scholarly paper on the history and development of Sufism in Britain, which reports that Quilliam 'defined himself as an Ottoman Hanafi with an allegiance to traditional Islam', that he considered the Wahhabi movement a rebellion against the legitimate Sunni Caliphate, and that there is no evidence he was a Sufi in the tariqa sense."
  es: "El artículo académico de Ron Geaves sobre la historia y el desarrollo del sufismo en Gran Bretaña informa que Quilliam \"se definía a sí mismo como un hanafi otomano con lealtad al islam tradicional\", que consideraba el movimiento wahabí una rebelión contra el califato suní legítimo y que no hay evidencia de que fuera un sufí en el sentido de la tariqa."
  fr: "L'article savant de Ron Geaves sur l'histoire et le développement du soufisme en Grande-Bretagne rapporte que Quilliam « se définissait comme un hanafite ottoman fidèle à l'islam traditionnel », qu'il considérait le mouvement wahhabite comme une rébellion contre le califat sunnite légitime et qu'il n'existe aucune preuve qu'il ait été un soufi au sens de la tariqa."
  ur: "برطانیہ میں تصوف کی تاریخ اور ترقی پر رون گیوز کا علمی مقالہ، جس میں بتایا گیا ہے کہ کوئلیم نے 'خود کو ایک عثمانی حنفی کے طور پر روایتی اسلام سے وفاداری کے طور پر بیان کیا'، کہ وہ وہابی تحریک کو جائز سنی خلافت کے خلاف بغاوت سمجھتے تھے، اور اس بات کا کوئی ثبوت نہیں ہے کہ وہ طریقت کے لحاظ سے صوفی تھے۔"
  tr: "Ron Graves'in Britanya'da tasavvufun tarihi ve gelişimi üzerine yazdığı akademik makalede, Quillam \"kendini geleneksel İslam'a bağlı bir Osmanlı Hanefi olarak tanımlamıştı\"; bu makalede Vahhabilik meşru Sünni Halifeliği'ne karşı bir isyan olarak görülüyor ve bir Sufi tarikatıyla bağlantısına dair hiçbir kanıt bulunmuyor."
  id: "Makalah akademis Ron Graves tentang sejarah dan perkembangan Sufisme di Inggris, di mana Quillam \"mengidentifikasi dirinya sebagai Hanafi Ottoman\" yang menganut Islam tradisional, menganggap Wahhabisme sebagai pemberontakan terhadap Khalifah Sunni yang sah, dan tidak ada bukti afiliasinya dengan tarekat Sufi."
