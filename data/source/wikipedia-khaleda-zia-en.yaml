summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خالدة ضياء؛ تُستخدم لوقائع الكيان فقط. تروي مولدها (باسم خالدة خانم) في جلبايجوري، وتزوجها ضياء الرحمن سنة 1960، ورئاستها الحزب الوطني البنغلاديشي من 1984 حتى وفاتها، ورئاستها للوزراء من 1991 إلى 1996 ومن 2001 إلى 2006، وسجنها بتهم فساد ثم إطلاق سراحها وتبرئتها بعد انتفاضة يوليو 2024، ووفاتها في دكا في 30 ديسمبر 2025 وجنازتها الرسمية ودفنها في ضريح ضياء الرحمن. وتوثّق المقالة نفسها اختلاف وثائقها الرسمية في تاريخ مولدها."
  en: "English Wikipedia article on Khaleda Zia; used for entity facts only. It recounts her birth (as Khaleda Khanam) at Jalpaiguri, her marriage to Ziaur Rahman in 1960, her chairpersonship of the Bangladesh Nationalist Party from 1984 until her death, her premierships of 1991–1996 and 2001–2006, her imprisonment on corruption charges and her release and acquittal after the July 2024 uprising, and her death at Dhaka on 30 December 2025, state funeral and burial at the Mausoleum of Ziaur Rahman. The article itself documents the disagreement among her official documents over her birth date. Its infobox carries no religion field."
