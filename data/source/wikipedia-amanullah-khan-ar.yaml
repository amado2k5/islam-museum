summary:
  ar: "مقالة ويكيبيديا العربية عن أمان الله خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في بغمان في 1 يونيو 1892 وحكمه من 1919 إلى تنازله سنة 1929 وإصلاحاته، وتعطي في مقدمتها وفاته في 25 أبريل 1960 بينما يقول متنها 26 أبريل 1960. لا تحمل قيمة للديانة في صندوق معلوماتها، لكنها تصنفه في تصنيف «مسلمون سنة أفغان»، وهو تصنيف ملفي لا يشهد."
  en: "Arabic Wikipedia article on Amanullah Khan; used for entity facts only. It gives his birth at Paghman on 1 June 1892, his rule from 1919 to his abdication in 1929 and his reforms, and gives his death in its lead as 25 April 1960 while its body text says 26 April 1960. It carries no religion value in its infobox, but files him under the category Afghan Sunni Muslims — a category filing, which never attests."
