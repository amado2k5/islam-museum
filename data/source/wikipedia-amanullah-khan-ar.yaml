summary:
  ar: "مقالة ويكيبيديا العربية عن أمان الله خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في بغمان في 1 يونيو 1892 وحكمه من 1919 إلى تنازله سنة 1929 وإصلاحاته، وتعطي في مقدمتها وفاته في 25 أبريل 1960 بينما يقول متنها 26 أبريل 1960. لا تحمل قيمة للديانة في صندوق معلوماتها، لكنها تصنفه في تصنيف «مسلمون سنة أفغان»، وهو تصنيف ملفي لا يشهد."
  en: "Arabic Wikipedia article on Amanullah Khan; used for entity facts only. It gives his birth at Paghman on 1 June 1892, his rule from 1919 to his abdication in 1929 and his reforms, and gives his death in its lead as 25 April 1960 while its body text says 26 April 1960. It carries no religion value in its infobox, but files him under the category Afghan Sunni Muslims — a category filing, which never attests."
  es: "Artículo de Wikipedia en árabe sobre Amanullah Khan; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Paghman el 1 de junio de 1892, su reinado desde 1919 hasta su abdicación en 1929 y sus reformas, y menciona su muerte el 25 de abril de 1960 en la introducción, mientras que el cuerpo del texto indica el 26 de abril de 1960. No incluye información sobre su religión en el recuadro informativo, pero lo clasifica dentro de la categoría de musulmanes sunitas afganos, una clasificación que nunca se verifica."
  fr: "Article Wikipédia en arabe sur Amanullah Khan; utilisé uniquement pour les informations factuelles. Il indique sa naissance à Paghman le 1er juin 1892, son règne de 1919 à son abdication en 1929 et ses réformes. La date de son décès est mentionnée dans l’introduction comme étant le 25 avril 1960, tandis que le corps du texte indique le 26 avril 1960. L’infobox ne mentionne aucune religion, mais le classe dans la catégorie « Musulmans sunnites afghans » – un classement qui n’est jamais étayé."
