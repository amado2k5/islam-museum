summary:
  ar: "مقال في موقع «أونلي كشمير» عن ميرواعظ يوسف شاه بوصفه أول مترجم للقرآن إلى الكشميرية: ميلاده 1894 في سريناغار، ودراسته في ديوبند على أنور شاه الكشميري، وخلافته 1931، و«بيان الفرقان» 1957، ووفاته في راولبندي 1968."
  en: "Onlykashmir feature marking Mirwaiz Yusuf Shah as the first Kashmiri translator of the Quran: his 1894 Srinagar birth, Deoband study under Anwar Shah Kashmiri, the 1931 succession, the 1957 Bayan-ul-Furqan and his 1968 Rawalpindi death."
  es: "Onlykashmir destaca a Mirwaiz Yusuf Shah como el primer traductor cachemir del Corán: su nacimiento en Srinagar en 1894, sus estudios en Deoband con Anwar Shah Kashmiri, la sucesión en 1931, el Bayan-ul-Furqan de 1957 y su muerte en Rawalpindi en 1968."
  fr: "Onlykashmir présente les éléments qui font de Mirwaiz Yusuf Shah le premier traducteur cachemiri du Coran: sa naissance à Srinagar en 1894, ses études à Deoband sous la direction d’Anwar Shah Kashmiri, sa succession en 1931, le Bayan-ul-Furqan de 1957 et sa mort à Rawalpindi en 1968."
  ur: "صرف کشمیر میں میر واعظ یوسف شاہ کو قرآن کے پہلے کشمیری مترجم کے طور پر نشان زد کیا گیا ہے: ان کی 1894 سری نگر کی پیدائش، انور شاہ کشمیری کے تحت دیوبند کا مطالعہ، 1931 کی جانشینی، 1957 کا بیان الفرقان اور ان کی 1968 راولپنڈی وفات۔"
  tr: "'Only Kashmir' web sitesinde Mirwaiz Yusuf Shah'ın Kur'an'ın Keşmirce'ye ilk çevirmeni olduğu bir makale: 1894'te Srinagar'da doğması, Deoband'da Keşmirli Anwar Shah'ın yanında çalışmaları, 1931'de tahta çıkışı, 1957'de 'Bayan al-Furqan' ve 1968'de Rawalpindi'de ölümü."
  id: "Sebuah artikel di situs web 'Only Kashmir' tentang Mirwaiz Yusuf Shah sebagai penerjemah pertama Al-Qur'an ke dalam bahasa Kashmir: kelahirannya pada tahun 1894 di Srinagar, studinya di Deoband di bawah Anwar Shah dari Kashmir, suksesinya pada tahun 1931, 'Bayan al-Furqan' pada tahun 1957, dan kematiannya di Rawalpindi pada tahun 1968."
title: "Remembering Mirwaiz Yusuf Shah as the First Kashmiri Translator of the Quran"
