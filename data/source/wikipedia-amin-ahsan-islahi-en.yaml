summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أمين أحسن الإصلاحي (1904 – 15 كانون الأول 1997)، المولود في بمهور بقضاء أعظم كره؛ تذكر أن الفراهي دعاه سنة 1925 ليدرس القرآن عليه، وأنه أسس الدائرة الحميدية ومجلة «الإصلاح»، وكان عضوًا مؤسسًا في الجماعة الإسلامية وتركها سنة 1958، وأتم «تدبر القرآن» في 29 رمضان 1400هـ (12 آب 1980) وتوفي في لاهور؛ ويحمل صندوقها حقل عقيدة سنية ويسمّي الفراهي شيخًا له، والحقل ليس شهادة نصية."
  en: "The English Wikipedia article on Amin Ahsan Islahi (1904 – 15 December 1997), born at Bamhur in Azamgarh district; it states that Farahi invited him in 1925 to study the Qur'an with him, that he founded the Daira-i-Hamidiyyah and the journal Al-Islah, was a founder member of Jamaat-e-Islami and left it in 1958, finished Tadabbur-i-Qur'an on 29 Ramadan 1400 AH (12 August 1980) and died at Lahore; its infobox carries a Sunni creed field and names Farahi as his teacher — the field is not a text attestation."
