summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أمين أحسن الإصلاحي ⁦(1904 – 15 كانون الأول 1997)⁩، المولود في بمهور بقضاء أعظم كره؛ تذكر أن الفراهي دعاه سنة 1925 ليدرس القرآن عليه، وأنه أسس الدائرة الحميدية ومجلة «الإصلاح»، وكان عضوًا مؤسسًا في الجماعة الإسلامية وتركها سنة 1958، وأتم «تدبر القرآن» في 29 رمضان 1400هـ ⁦(12 آب 1980)⁩ وتوفي في لاهور؛ ويحمل صندوقها حقل عقيدة سنية ويسمّي الفراهي شيخًا له، والحقل ليس شهادة نصية."
  en: "The English Wikipedia article on Amin Ahsan Islahi (1904 – 15 December 1997), born at Bamhur in Azamgarh district; it states that Farahi invited him in 1925 to study the Qur'an with him, that he founded the Daira-i-Hamidiyyah and the journal Al-Islah, was a founder member of Jamaat-e-Islami and left it in 1958, finished Tadabbur-i-Qur'an on 29 Ramadan 1400 AH (12 August 1980) and died at Lahore; its infobox carries a Sunni creed field and names Farahi as his teacher — the field is not a text attestation."
  es: "El artículo de la Wikipedia en inglés sobre Amin Ahsan Islahi (1904 – 15 de diciembre de 1997), nacido en Bamhur en el distrito de Azamgarh, afirma que Farahi lo invitó en 1925 a estudiar el Corán con él, que fundó el Daira-i-Hamidiyyah y la revista Al-Islah, fue miembro fundador de Jamaat-e-Islami y la abandonó en 1958, terminó el Tadabbur-i-Qur'an el 29 de Ramadán de 1400 AH (12 de agosto de 1980) y murió en Lahore; su ficha informativa contiene un campo de credo sunita y nombra a Farahi como su maestro; este campo no es una atestación textual."
  fr: "L'article de Wikipédia en anglais sur Amin Ahsan Islahi (1904 – 15 décembre 1997), né à Bamhur dans le district d'Azamgarh, indique que Farahi l'a invité en 1925 à étudier le Coran avec lui, qu'il a fondé la Daira-i-Hamidiyyah et la revue Al-Islah, qu'il était membre fondateur de Jamaat-e-Islami et l'a quittée en 1958, qu'il a terminé le Tadabbur-i-Qur'an le 29 Ramadan 1400 AH (12 août 1980) et qu'il est décédé à Lahore; son infobox comporte un champ sur la croyance sunnite et nomme Farahi comme son professeur — ce champ n'est pas une attestation textuelle."
  ur: "امین احسن اصلاحی ⁦(1904 - 15 دسمبر 1997)⁩ پر انگریزی ویکیپیڈیا کا مضمون، اعظم گڑھ ضلع کے بامہر میں پیدا ہوئے۔ اس میں بتایا گیا ہے کہ فراہی نے انہیں 1925 میں اپنے ساتھ قرآن پڑھنے کی دعوت دی، انہوں نے دائرہ حمیدیہ اور جریدہ الاصلاح کی بنیاد رکھی، جماعت اسلامی کے بانی رکن تھے اور 1958 میں اسے چھوڑ دیا، تدبر قرآن ختم کیا اور 29 رمضان المبارک 1902 ہجری کو لاہور میں وفات پائی۔ اس کے انفو باکس میں سنی مسلک کا ایک فیلڈ ہے اور فراہی کو اپنے استاد کے طور پر نامزد کیا گیا ہے - یہ فیلڈ ٹیکسٹ اٹیسٹیشن نہیں ہے۔"
  tr: "Amin Ahsan Al-Islahi (1904 – 15 Aralık 1997), Azam Karh ilçesindeki Bamhur'da doğan İngilizce Wikipedia makalesinde; Al-Farahi'nin onu 1925'te Kur'an çalışması için davet ettiği ve Hamidiya çevresini ile \"Al-Islah\" dergisini kurduğu belirtilir. İslami Grup'un kurucu üyelerindendi ve 1958'de ayrıldı, 29 Ramazan 1400 Hile (12 Ağustos 1980) tarihinde \"Kur'an Tedirkisi\"ni tamamladı ve Lahor'da öldü; kutusunda Sünni mezhep tarlası yer alır ve Al-Farahi şeyhi olarak adlandırılır, ancak bu alan metinsel bir tanıklık değildir."
  id: "Artikel Wikipedia bahasa Inggris tentang Amin Ahsan Al-Islahi (1904 – 15 Desember 1997), lahir di Bamhur di distrik Azam Karh; disebutkan bahwa Al-Farahi mengundangnya pada tahun 1925 untuk belajar Al-Qur'an bersamanya, dan bahwa ia mendirikan lingkaran Hamidiya serta majalah \"Al-Islah.\" Ia adalah anggota pendiri Kelompok Islam dan keluar pada tahun 1958, menyelesaikan \"Kontemplasi Al-Qur'an\" pada 29 Ramadan 1400 H (12 Agustus 1980), dan meninggal di Lahore; kotaknya memuat ladang ajaran Sunni dan Al-Farahi disebut sebagai sheikhnya, tetapi bidang tersebut bukan kesaksian teks."
