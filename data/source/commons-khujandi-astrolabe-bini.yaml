reliability_note: "Actual file page read 2026-11-15: uploader-described title locates a Buyid-period astrolabe signed by Hamid ibn al-Khidr al-Khujandi at Rayy (Iran) or Baghdad (Iraq), 984-985; EXIF date 3 November 2023; photographer Francesco Bini, own work; CC BY-SA 4.0; original 2892x3840, uploaded by Sailko 1 November 2025. The museum's companion bibliography (jphogendijk-khujandi-works) identifies the object as the signed astrolabe in the Museum of Islamic Art, Doha, bearing the maker's name and 374 AH on the reverse; Qatar Museums' own catalogue numbering SI.5.1999 was not independently opened here, so the shelfmark is not asserted. The photograph evidences the maker's surviving astrolabe — a different instrument from the unpublished shamila treatise."
