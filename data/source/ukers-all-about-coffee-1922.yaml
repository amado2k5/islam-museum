summary:
  ar: "مرجع تجاري أمريكي مبكر في تاريخ القهوة؛ بابه التاريخي يلخص المصادر العربية القديمة عبر روايات المؤلفين الأوروبيين، فيذكر الجمهل الذبهاني وتقاليد عمر الشاذلي."
  en: "An early American trade reference on coffee history; its historical chapter digests the old Arabic sources through European writers, naming the Aden mufti Jamal al-Din al-Dhabhani and the Umar al-Shadhili traditions."
  ur: "کافی کی تاریخ پر ابتدائی امریکی تجارتی مرجع؛ تاریخی باب عربی روایات کو یورپی مصنفین کے ذریعے سمیٹتا ہے، عدن کے مفتی جمال الدین ذبهانی اور عمر شاذلی کی روایتیں دیتا ہے۔"
  es: "Una obra de referencia estadounidense temprana sobre la historia del café; su capítulo histórico resume las antiguas fuentes árabes a través de escritores europeos, mencionando las tradiciones del muftí de Adén, Jamal al-Din al-Dhabhani, y de Umar al-Shadhili."
  fr: "Un ouvrage de référence américain ancien sur l'histoire du café; son chapitre historique digère les anciennes sources arabes à travers les écrits d'auteurs européens, citant le mufti d'Aden Jamal al-Din al-Dhabhani et les traditions d'Umar al-Shadhili."
  tr: "Kahve tarihinde erken bir Amerikan ticari referansı olan bu bölüm, Avrupalı yazarların romanları aracılığıyla eski Arap kaynaklarını özetler, Al-Jamhal Al-Dhabhani ve Omar Al-Shadhili geleneklerinden bahseder."
  id: "Referensi komersial Amerika awal dalam sejarah kopi; bagian sejarahnya merangkum sumber Arab kuno melalui novel-novel penulis Eropa, menyebutkan Al-Jamhal Al-Dhabhani dan tradisi Omar Al-Shadhili."
