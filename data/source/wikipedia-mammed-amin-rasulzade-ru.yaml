summary:
  ar: مقالة ويكيبيديا الروسية عن محمد أمين رسول زاده؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في نوخاني في 31 يناير 1884 ووفاته في أنقرة في 6 مارس 1955، وتروي قيادته «مساوات» وجمهورية 1918 وهجرته.
  en: Russian Wikipedia article on Mamed Emin Rasulzade; used for entity facts only. It gives his birth at Novkhany on 31 January 1884 and death at Ankara on 6 March 1955, and recounts his Musavat leadership, the 1918 republic and his emigration.
  es: "Artículo de la Wikipedia rusa sobre Mamed Emin Rasulzade; utilizado únicamente para datos biográficos. Indica su nacimiento en Novkhany el 31 de enero de 1884 y su fallecimiento en Ankara el 6 de marzo de 1955, y relata su liderazgo en el partido Musavat, la república de 1918 y su emigración."
  fr: "Article de Wikipédia en russe sur Mamed Emin Rasulzade; utilisé uniquement pour les informations factuelles. Il indique sa naissance à Novkhany le 31 janvier 1884 et sa mort à Ankara le 6 mars 1955, et relate son rôle à la tête du Musavat, la république de 1918 et son émigration."
  ur: "مامد ایمن رسول زادے پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 31 جنوری 1884 کو نوخانی میں ان کی پیدائش اور 6 مارچ 1955 کو انقرہ میں موت ہوئی، اور اس کی مساوات قیادت، 1918 کی جمہوریہ اور اس کی ہجرت کا ذکر ہے۔"
  tr: "Muhammed Emin Rasulzadeh hakkında Rusça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 31 Ocak 1884'te Nokhani'de doğduğunu ve 6 Mart 1955'te Ankara'da öldüğünü anlatır ve liderliğini 'Musavat', 1918 cumhuriyeti ve göçü olarak anlatır."
  id: "Artikel Wikipedia Rusia tentang Mohammad Amin Rasulzadeh; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Nokhani pada 31 Januari 1884, dan kematiannya di Ankara pada 6 Maret 1955, serta menceritakan kepemimpinannya sebagai 'Musavat,' republik 1918, dan migrasinya."
