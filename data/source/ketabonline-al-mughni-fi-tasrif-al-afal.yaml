summary:
  ar: "الصفحة «al-Mughni fi Tasrif al-Afal» — KetabOnline؛ لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: كتاب «al-Mughni fi Tasrif al-Afal» ومؤلفه وتاريخه."
  en: "The page «al-Mughni fi Tasrif al-Afal» — KetabOnline; summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the book «al-Mughni fi Tasrif al-Afal»: its author and date."
  ur: "صفحہ «al-Mughni fi Tasrif al-Afal» — KetabOnline؛ اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: کتاب «al-Mughni fi Tasrif al-Afal»، اس کے مصنف اور تاریخ کا بیان۔"
  fr: "La page «al-Mughni fi Tasrif al-Afal» — KetabOnline ; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : le livre « al-Mughni fi Tasrif al-Afal » : son auteur et sa date."
  es: "La página «al-Mughni fi Tasrif al-Afal» — KetabOnline; resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: el libro «al-Mughni fi Tasrif al-Afal»: su autor y su fecha."
  tr: "«al-Mughni fi Tasrif al-Afal» sayfası — KetabOnline; kurucusunun 21 Kasım 2026'da müzeye sunduğu bir araştırma özetiyle özetlenmiştir; müze sayfayı açmamış ve kurucu özeti yeniden doğrulama yapmadan kullanmayı kabul etmiştir. Kullanıldığı alanlar: «al-Mughni fi Tasrif al-Afal' kitabında, yazarı ve tarihçesi."
  id: "Halaman «al-Mughni fi Tasrif al-Afal» — KetabOnline; dirangkum oleh ringkasan riset yang dikirimkan oleh pendiri ke museum pada 21 November 2026; museum tidak membuka halaman tersebut, dan pendiri setuju untuk menggunakan abstrak tanpa verifikasi ulang. Digunakan dalam: buku «al-Mughni fi Tasrif al-Afal', penulisnya, dan sejarahnya."
